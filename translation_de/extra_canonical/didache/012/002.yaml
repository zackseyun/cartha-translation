id: DID.12.2
reference: Didache 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: de
  text: Wenn der Ankommende ein Durchreisender[a] ist, helft ihm, so gut ihr könnt; doch soll er nur zwei oder drei Tage bei euch bleiben, wenn es nötig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Reisender«.'
    reason: παρόδιος kann allgemein einen Reisenden bezeichnen; »Durchreisender« bringt im Kontext deutlicher zum Ausdruck, dass er sich nur vorübergehend am Ort aufhält.
lexical_decisions:
- source_word: παρόδιος
  choice: Durchreisender
  rationale: Bezeichnet einen Reisenden auf der Durchreise und passt zum Zusammenhang begrenzter Gastfreundschaft.
- source_word: βοηθεῖτε αὐτῷ ὅσον δύνασθε
  choice: helft ihm, so gut ihr könnt
  rationale: Natürliches modernes Deutsch, das das Maß der Hilfe entsprechend den vorhandenen Möglichkeiten wiedergibt.
- source_word: οὐ μενεῖ ... εἰ μὴ
  choice: soll ... nur ... bleiben
  rationale: Gibt die exklusive Begrenzung idiomatisch wieder, ohne den Eindruck zu erwecken, eine Notlage erlaube einen längeren Aufenthalt.
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: wenn es nötig ist
  rationale: Bewahrt die sachliche Bedingung des griechischen Textes.
theological_decisions:
- issue: Bezug der Notwendigkeitsbedingung
  choice: Die Bedingung bezieht sich auf den Aufenthalt von zwei oder drei Tagen.
  alternative: Die Notwendigkeit gestattet einen Aufenthalt über zwei oder drei Tage hinaus.
  rationale: Die Folge οὐ ... εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη begrenzt den Aufenthalt auf zwei oder drei Tage, sofern ein solcher Aufenthalt nötig ist; sie eröffnet keine Ausnahme über diese Grenze hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Pluralanrede wird beibehalten. Das einleitende μέν wird ohne künstliches deutsches Gegenstück wiedergegeben; der Gegensatz des δέ erscheint mit »doch«.
