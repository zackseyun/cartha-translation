  register: Modernes, klares Standarddeutsch mit würdig-knapper Satzstruktur. Das maskuline Pronomen folgt dem generischen Einzelbeispiel des griechischen Textes; es wurde keine zusätzliche inklusive oder konfessionell geprägte Deutung eingeführt.
