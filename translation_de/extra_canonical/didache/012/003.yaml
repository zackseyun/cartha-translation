source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δὲ θέλει πρὸς ὑμᾶς καθίσαι, τεχνίτης ὤν, ἐργαζέσθω καὶ φαγέτω·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/003.yaml
  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: de
  text: Wenn er aber bei euch bleiben will und ein Handwerker ist, soll er arbeiten und essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσαι
  choice: bleiben
  rationale: Der Infinitiv bezeichnet hier im Zusammenhang das Sichniederlassen beziehungsweise dauerhaftere Bleiben bei der Gemeinschaft; „bleiben“ ist natürlich und überdehnt den Ausdruck nicht.
- source_word: τεχνίτης
  choice: Handwerker
  rationale: Die übliche konkrete Bedeutung ist eine Person mit einem erlernten Handwerk; die Formulierung bewahrt die berufliche Aussage des griechischen Textes.
- source_word: ἐργαζέσθω καὶ φαγέτω
  choice: soll er arbeiten und essen
  rationale: Die beiden Imperative der dritten Person werden direkt und parallel wiedergegeben. „Essen“ wahrt die knappe Formulierung, ohne ausdrücklich Versorgung oder Lebensunterhalt hineinzulesen.
theological_decisions: []
