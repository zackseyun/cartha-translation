source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: de
  text: Wenn er aber nicht so handeln will, ist er ein Messiashändler[a]. Nehmt euch vor solchen Leuten in Acht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: jemand, der mit dem Messias Handel treibt; gemeint ist jemand, der den Messias oder den Glauben an ihn zur Einnahmequelle macht.'
    reason: Das griechische χριστέμπορος ist ein seltenes, prägnantes Kompositum. Die Anmerkung erläutert es, ohne die nicht ausdrücklich genannte konkrete Form des Gewinnstrebens festzulegen.
lexical_decisions:
- source_word: χριστέμπορος
  choice: Messiashändler
  rationale: Das seltene, wohl bewusst zugespitzte Kompositum verbindet »Messias/Christus« mit »Händler« und bezeichnet jemanden, der aus dem Messias beziehungsweise aus seiner religiösen Stellung Gewinn schlagen will. Die ungewöhnliche deutsche Wortbildung bewahrt die Prägnanz des griechischen Ausdrucks.
- source_word: προσέχετε ἀπὸ τῶν τοιούτων
  choice: Nehmt euch vor solchen Leuten in Acht
  rationale: Gibt die Warnung idiomatisch, deutlich und in einem würdigen modernen Register wieder.
- source_word: οὐ θέλει οὕτω ποιεῖν
  choice: nicht so handeln will
  rationale: Bewahrt den Willensaspekt von θέλει sowie den Rückverweis von οὕτω auf die zuvor genannte Handlungsweise.
theological_decisions:
- issue: Wiedergabe von χριστ- im seltenen Kompositum χριστέμπορος
  choice: Messias-
  alternative: Christus-
  rationale: χριστός ist seinem Ursprung nach der Titel »Messias/der Gesalbte«. »Messiashändler« hält diesen Titelcharakter sichtbar, ohne die polemische Aussage des Kompositums abzuschwächen; »Christushändler« wäre ebenfalls sprachlich möglich.
translation_notes:
  register: Modernes, klares Standarddeutsch mit mahnendem, würdigem Ton. Das auffällige Wort »Messiashändler« spiegelt bewusst die ungewöhnliche griechische Wortbildung.
