  verdict: revise
  source_fidelity: Der Entwurf trifft den Sinn von τέχνη, κατὰ τὴν σύνεσιν ὑμῶν und ἀργός im Wesentlichen. Die Konstruktion προνοήσατε, πῶς ... ζήσεται wird jedoch genauer wiedergegeben, wenn die Gemeinde Vorsorge dafür treffen soll, wie der Betreffende leben wird/kann, statt lediglich dafür zu sorgen, dass dies möglich ist. Die syntaktische Einordnung von χριστιανός als Prädikatsbezeichnung des konkreten Reisenden ist kontextuell gut begründet, bleibt aber mit einer substantivischen, allgemeiner klingenden Lesart übersetzungsfähig.
  naturalness: „Trefft nach eurem Ermessen Vorsorge dafür, wie ...“ ist modernes, idiomatisches Standarddeutsch und bildet die griechische πῶς-Konstruktion klarer ab als „sorgt ... dafür, dass“. „Ohne untätig zu sein“ ist natürlich und vermeidet die wertende Zuspitzung von „faul“.
  terminology: „Handwerk“ ist für τέχνη im gegebenen Kontext angemessen. „Christ“ gibt χριστιανός sachlich wieder. Die Fußnote dokumentiert die mögliche allgemeinere Auffassung, ohne eine theologische Auslegung festzulegen.
  issues:
  - severity: medium
    issue: Die πῶς-Konstruktion wird im Entwurf zu einer dass-Konstruktion geglättet.
    rationale: „Sorgt ... dafür, dass er ... leben kann“ verschiebt προνοήσατε, πῶς von konkreter Vorsorge dafür, wie der Lebensunterhalt bzw. das Leben ohne Müßiggang gestaltet werden soll, zu einer bloßen Ermöglichung.
  - severity: low
    issue: Die prädikative Wiedergabe von χριστιανός ist nicht als mögliche Auslegung kenntlich.
    rationale: Der Kontext stützt „er als Christ“, doch der griechische Nominativ kann in der Übersetzung auch allgemeiner als „ein Christ“ gefasst werden. Eine knappe Alternative bewahrt diese Nuance.
  revised_text: Wenn er aber kein Handwerk beherrscht, trefft nach eurem Ermessen Vorsorge dafür, wie er bei euch als Christ leben kann, ohne untätig zu sein.[a]
