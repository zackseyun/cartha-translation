id: DID.12.4
reference: Didache 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: de
  text: Wenn er aber kein Handwerk beherrscht, trefft nach eurem Ermessen Vorsorge dafür, wie er bei euch als Christ leben kann, ohne untätig zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Christ bei euch leben kann, ohne untätig zu sein.“'
    reason: χριστιανός kann im Kontext auf den konkreten Ankömmling bezogen und prädikativ („er ... als Christ“) oder allgemeiner substantivisch („ein Christ“) wiedergegeben werden.
lexical_decisions:
- source_word: τέχνην
  choice: Handwerk
  rationale: Im Zusammenhang mit der Aufnahme eines reisenden Christen bezeichnet τέχνη eine erlernte praktische Tätigkeit beziehungsweise ein Gewerbe, durch das er seinen Lebensunterhalt bestreiten kann.
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  choice: nach eurem Ermessen
  rationale: σύνεσις meint hier verständige Einsicht oder Urteilsvermögen; die idiomatische Wendung überträgt sowohl die Verantwortung als auch den Spielraum der Gemeinde.
- source_word: προνοήσατε
  choice: sorgt … dafür
  rationale: Der Imperativ fordert dazu auf, vorausschauend praktische Vorkehrungen zu treffen; „sorgt dafür“ ist im Deutschen natürlich und passt zur folgenden πῶς-Konstruktion.
- source_word: ἀργός
  choice: untätig
  rationale: Das Wort bezeichnet hier jemanden, der nicht arbeitet beziehungsweise ohne Beschäftigung lebt; „untätig“ wahrt diesen Sinn, ohne vorschnell moralische Faulheit zu unterstellen.
- source_word: χριστιανός
  choice: als Christ
  rationale: Im Kontext ist weiterhin der zuvor genannte Gast gemeint. Die prädikative Wiedergabe „er als Christ“ bildet diese Referenz natürlich ab, ohne aus dem Satz eine allgemeine Maxime über jeden Christen zu machen.
theological_decisions:
- issue: Bezug und syntaktische Funktion von χριστιανός
  choice: „dass er als Christ bei euch leben kann“
  alternative: „wie ein Christ bei euch leben kann“
  rationale: Der unmittelbare Kontext spricht vom konkreten Ankömmling ohne Handwerk. χριστιανός lässt sich daher plausibel prädikativ auf ihn beziehen. Die Übersetzung wahrt zugleich die christliche Identität als Grund seiner Aufnahme, ohne eine weitergehende Gemeindelehre einzutragen.
- issue: Bedeutung von μὴ ἀργός
  choice: „ohne untätig zu sein“
  alternative: „nicht müßig“ oder „nicht arbeitslos“
  rationale: „Untätig“ gibt den Kontrast zur Erwerbstätigkeit wieder, ohne entweder einen veralteten Ausdruck zu verwenden oder den Sinn auf unfreiwillige Arbeitslosigkeit einzuengen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzführung ist idiomatisch und hält sich eng an die griechische Argumentation: fehlendes Handwerk, verständige Vorsorge der Gemeinde und Vermeidung dauernder Untätigkeit.'
