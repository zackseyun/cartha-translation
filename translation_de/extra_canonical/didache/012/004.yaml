  revision_rationale: Die Revision bewahrt den Bezug auf den konkreten Reisenden, gibt προνοήσατε, πῶς enger als „Vorsorge dafür treffen, wie“ wieder und vermerkt die verbleibende Übersetzungsnuance bei χριστιανός. Bedeutung und Register des Entwurfs bleiben erhalten.
