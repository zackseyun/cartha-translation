source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: de
  text: Jeder aber, der im Namen des Herrn kommt, soll aufgenommen werden. Nachdem ihr ihn geprüft habt, werdet ihr Klarheit gewinnen; denn ihr werdet Einsicht haben, rechts und links zu unterscheiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'δεχξήσθω (normalisiert: δεχθήσθω)'
  choice: soll aufgenommen werden
  rationale: Gibt den passiven Imperativ natürlich und zugleich verpflichtend wieder.
- source_word: δοκιμάσαντες
  choice: prüft ihn
  rationale: Das Partizip bezeichnet ein prüfendes Erproben beziehungsweise Beurteilen des Ankommenden.
- source_word: γνώσεσθε
  choice: dann werdet ihr Klarheit gewinnen
  rationale: Das Verb steht ohne ausdrückliches Objekt. Diese Wiedergabe vermeidet das missverständliche persönliche »ihr werdet ihn kennen« und bewahrt den Sinn, nach der Prüfung zu einer Erkenntnis zu gelangen.
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  choice: die nötige Einsicht haben, rechts und links zu unterscheiden
  rationale: Formuliert die knappe griechische Wendung verständlich, ohne »rechts und links« vorschnell auf eine bestimmte moralische oder lehrmäßige Deutung festzulegen.
theological_decisions:
- issue: Gegenstand von γνώσεσθε
  choice: Kein ausdrückliches Objekt; »Klarheit gewinnen«
  alternative: »Ihr werdet ihn erkennen«
  rationale: αὐτόν gehört grammatisch zu δοκιμάσαντες; γνώσεσθε steht absolut. Die Übersetzung wahrt daher den Schwerpunkt auf gewonnener Urteilsfähigkeit.
- issue: Bedeutung von »rechts und links«
  choice: Als allgemeine Fähigkeit zur Unterscheidung stehen lassen
  alternative: Ausdrücklich als Unterscheidung von Gut und Böse deuten
  rationale: Der griechische Text nennt die Pole, erklärt ihre konkrete Zuordnung aber nicht. Eine theologische Präzisierung wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der verpflichtende Ton des Imperativs bleibt erhalten; die ungewöhnliche Bildsprache »rechts und links« wird bewahrt, aber syntaktisch für heutige Leser erschlossen.
