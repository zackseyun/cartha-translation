review_pass:
  verdict: revise
  source_fidelity: 'Die Aussage wird im Wesentlichen getroffen: δεχθήτω ist ein verpflichtender Imperativ, αὐτόν ist Objekt von δοκιμάσαντες, und γνώσεσθε bleibt ohne ausgedrücktes Objekt. Die Fassung „Danach prüft ihn“ macht jedoch aus dem aoristischen Partizip δοκιμάσαντες einen selbstständigen Imperativ und verwischt damit die zeitlich-begründende Verknüpfung („nachdem ihr ihn geprüft habt“). „die nötige Einsicht“ fügt zudem ein im Griechischen nicht ausdrücklich vorhandenes Wertungswort hinzu.'
  naturalness: Die Sprache ist insgesamt modern und verständlich. Mit der partizipialen Beziehung als Nebensatz klingt der Satz im Deutschen zugleich natürlicher und genauer.
  terminology: „im Namen des Herrn“, „aufgenommen werden“, „prüfen“ und „Einsicht“ sind angemessen. „Klarheit gewinnen“ gibt das objektlos gebrauchte γνώσεσθε idiomatisch wieder, ohne fälschlich persönliches Kennenlernen nahezulegen. Die offene Wendung „rechts und links“ wird beibehalten; „zu unterscheiden“ erschließt nur die durch σύνεσις nahegelegte Urteilsfähigkeit, ohne die beiden Pole dogmatisch festzulegen.
  issues:
  - severity: medium
    issue: δοκιμάσαντες ist nicht als eigenständiger Imperativ wiedergegeben.
    rationale: Das griechische aoristische Partizip bedeutet „nachdem/ihr ihn geprüft habt“ und steht in Bezug auf das anschließende γνώσεσθε. „Danach prüft ihn“ verändert die Satzstruktur und schwächt die Abfolge von Prüfung und daraus folgender Erkenntnis.
  - severity: low
    issue: „nötige“ ist eine zusätzliche Qualifikation.
    rationale: σύνεσιν heißt „Einsicht/Verständnis“; eine ausdrücklich als „nötig“ bezeichnete Einsicht steht nicht im Text.
