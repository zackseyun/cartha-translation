revisions:
- from: Jeder aber, der im Namen des Herrn kommt, soll aufgenommen werden. Danach prüft ihn; dann werdet ihr Klarheit gewinnen. Denn ihr werdet die nötige Einsicht haben, rechts und links zu unterscheiden.
  to: Jeder aber, der im Namen des Herrn kommt, soll aufgenommen werden. Nachdem ihr ihn geprüft habt, werdet ihr Klarheit gewinnen; denn ihr werdet Einsicht haben, rechts und links zu unterscheiden.
  rationale: Die Revision stellt die partizipiale Vorzeitigkeit von δοκιμάσαντες mit „Nachdem ihr ihn geprüft habt“ wieder her. Das objektlose γνώσεσθε bleibt als „werdet ihr Klarheit gewinnen“ ohne Ergänzung von „ihn“ wiedergegeben. Die bildhafte und auslegungsfähige Formel „rechts und links“ bleibt erhalten; die hinzugefügte Wertung „nötige“ entfällt.
