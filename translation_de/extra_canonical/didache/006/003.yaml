  naturalness: „Trage, was du kannst“ ist im heutigen Standarddeutsch ohne ergänzendes Objekt nicht idiomatisch und bleibt zudem schwer verständlich. „Nimm auf dich, was du kannst“ bewahrt die Belastungsmetapher von βάστασον, ohne den Gegenstand über den griechischen Text hinaus festzulegen.
  terminology: „Speise“, „Götzenopferfleisch“ und „tote Götter“ sind passend. „Verehrung“ ist für λατρεία in diesem knappen polemischen Kontext idiomatischer und weniger durch die heutige christliche Bedeutung von „Gottesdienst“ geprägt.
