id: DID.6.3
reference: Didache 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: de
  text: 'Was aber die Speise betrifft: Nimm auf dich, was du kannst. Doch vor Götzenopferfleisch hüte dich sehr; denn es ist Verehrung toter Götter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶσις
  choice: Speise
  rationale: Der Ausdruck bezeichnet hier Nahrung beziehungsweise das Essen und knüpft an die vorausgehenden Speisevorschriften an. „Speise“ ist knapp, würdig und im Deutschen verständlich.
- source_word: βάστασον
  choice: Trage
  rationale: Die Grundbedeutung „tragen“ bewahrt das Bild einer auferlegten Last beziehungsweise Verpflichtung. Die Formulierung lässt offen, welchen Umfang der Speiseregeln jemand auf sich nehmen kann.
- source_word: εἰδωλόθυτον
  choice: Götzenopferfleisch
  rationale: Der etablierte deutsche Ausdruck bezeichnet Nahrung, besonders Fleisch, die einem Götzen geopfert wurde. Er macht den im Kontext gemeinten Speisebezug deutlich.
- source_word: λίαν πρόσεχε
  choice: hüte dich sehr
  rationale: προσέχειν mit ἀπό drückt eindringliche Vorsicht und Abstand aus. „Hüte dich sehr“ ist natürlich und gibt die starke Intensivierung durch λίαν wieder.
- source_word: λατρεία
  choice: Gottesdienst
  rationale: Das Wort bezeichnet kultischen Dienst oder Verehrung. „Gottesdienst“ bewahrt den religiös-kultischen Charakter und die zugespitzte Wertung des Satzes.
- source_word: θεῶν νεκρῶν
  choice: tote Götter
  rationale: Die wörtliche Wiedergabe erhält die polemische Spannung des griechischen Ausdrucks, ohne sie erklärend aufzulösen.
theological_decisions:
- issue: Reichweite der Aufforderung zu den Speisevorschriften
  choice: „Trage, was du kannst“
  alternative: „Halte ein, was du kannst“
  rationale: Die Übersetzung bewahrt die Last-Metaphorik von βάστασον und lässt wie der Ausgangstext offen, ob die vorausgehenden Regeln als Verpflichtung, Entsagung oder praktische Belastung gedacht sind.
- issue: Charakter des Verzehrs von Götzenopferfleisch
  choice: „denn es ist Gottesdienst für tote Götter“
  alternative: „denn damit verehrt man tote Götter“
  rationale: Die nominale Aussage des Griechischen wird beibehalten. So bleibt die scharfe Gleichsetzung bestehen, ohne näher festzulegen, ob sich „es“ auf das Götzenopferfleisch, dessen Verzehr oder die damit verbundene Kultpraxis bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper paränetischer Satzführung. Der ungewöhnliche Imperativ „Trage“ ist bewusst beibehalten, um die Bildsprache und echte Deutungsoffenheit des griechischen βάστασον nicht durch eine erklärende Paraphrase zu beseitigen.
