    rationale: „Für“ kann Zweck oder Begünstigte markieren; λατρεία θεῶν νεκρῶν bezeichnet hier die Verehrung, deren Objekt die toten Götter sind. „Verehrung toter Götter“ bildet dies präziser ab.
