    issue: „denn sonst“ gibt ἐπεί unzutreffend wieder.
    rationale: 'ἐπεί leitet die Begründung ein: Derjenige, der vom Weg der Lehre wegführt, lehrt „ohne/abseits von Gott“. „Sonst“ macht daraus eine bloße Eventualfolge und schwächt den kausalen Zusammenhang.'
  - severity: low
    issue: „fern von Gott“ ist gegenüber παρεκτὸς Θεοῦ weniger direkt.
    rationale: Die Formulierung ist verständlich, legt aber stärker eine relationale Distanz nahe. „ohne Gott“ bildet die knappe griechische Präpositionalfügung unmittelbarer und natürlich ab.
  revised_text: Sieh zu, dass dich niemand von diesem Weg der Lehre in die Irre führt; denn er lehrt dich ohne Gott.
