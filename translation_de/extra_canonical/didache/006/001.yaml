- from: Achte darauf, dass dich niemand von diesem Weg der Lehre abbringt; denn sonst lehrt er dich fern von Gott.
  to: Sieh zu, dass dich niemand von diesem Weg der Lehre in die Irre führt; denn er lehrt dich ohne Gott.
  rationale: Die Revision stellt die kausale Funktion von ἐπεί mit „denn“ wieder her und übersetzt πλανήσῃ ausdrücklich als „in die Irre führt“. „Ohne Gott“ gibt παρεκτὸς Θεοῦ knapp und idiomatisch wieder, ohne die genaue Art des Abseitsstehens näher festzulegen.
