id: DID.6.1
reference: Didache 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: de
  text: Sieh zu, dass dich niemand von diesem Weg der Lehre in die Irre führt; denn er lehrt dich ohne Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  choice: Achte darauf, dass dich niemand … abbringt
  rationale: Gibt die Warnung und das mögliche Irreführen in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: von diesem Weg der Lehre
  rationale: Bewahrt das Weg-Motiv und die Zuordnung zur zuvor dargelegten Lehre.
- source_word: ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει
  choice: denn sonst lehrt er dich fern von Gott
  rationale: Bewahrt die Aussage, dass eine solche Unterweisung außerhalb der Beziehung beziehungsweise Ausrichtung auf Gott erfolgt, ohne sie konfessionell auszudeuten.
theological_decisions:
- issue: Bezug und Bedeutung von ἐπεὶ
  choice: denn sonst
  alternative: da er
  rationale: Das Subjekt ist im Griechischen nur impliziert. „Sonst“ stellt den gedanklichen Bezug zu demjenigen her, der vom Weg abbringt, ohne eine konkrete Person vorauszusetzen.
- issue: Bedeutung von παρεκτὸς Θεοῦ
  choice: fern von Gott
  alternative: ohne Gott / außerhalb Gottes
  rationale: „Fern von Gott“ klingt im Deutschen natürlich und erhält die theologische Spannung, ohne präziser festzulegen, ob räumliche, relationale oder autoritative Trennung gemeint ist.
translation_notes:
  register: Kurze, eindringliche Warnung in modernem, würdigem Standarddeutsch. Das Bild vom „Weg der Lehre“ bleibt erhalten.
