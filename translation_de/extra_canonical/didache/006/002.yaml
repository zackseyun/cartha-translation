id: DID.6.2
reference: Didache 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: de
  text: Denn wenn du das ganze Joch des Herrn tragen kannst, wirst du vollkommen sein; wenn du es aber nicht kannst, dann tu, was du kannst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: tragen
  rationale: Gibt das Bild des Jochs natürlich und quellennah wieder.
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: das ganze Joch des Herrn
  rationale: Bewahrt die Metapher und den vollständigen Umfang von ὅλον.
- source_word: τέλειος
  choice: vollkommen
  rationale: Entspricht der Bedeutung von τέλειος im Sinn von vollständig beziehungsweise zur Reife gelangt, ohne die theologische Spannung aufzulösen.
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: dann tu, was du kannst
  rationale: Natürliches modernes Deutsch, das die knappe Aufforderung und die Begrenzung durch das eigene Vermögen erhält.
theological_decisions:
- issue: Bedeutung des »ganzen Jochs des Herrn«
  choice: Die Metapher bleibt ohne erklärende Eingrenzung stehen.
  alternative: Das Joch ausdrücklich als Gesamtheit bestimmter Gebote oder asketischer Pflichten deuten.
  rationale: Der griechische Text nennt den konkreten Umfang nicht; eine Festlegung würde eine Auslegung in die Übersetzung eintragen.
- issue: Bedeutung von τέλειος
  choice: »vollkommen«
  alternative: »vollendet«, »reif« oder »ein vollkommener Jünger«
  rationale: »Vollkommen« bewahrt die traditionelle und semantisch mögliche Aussage, ohne einen nicht ausdrücklich genannten Bezug wie »Jünger« hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau, Konditionalstruktur und Joch-Metapher des griechischen Textes. Keine Fußnote erforderlich.
