id: DID.15.1
reference: Didache 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: de
  text: 'Setzt also für euch Aufseher und Diakone ein,[a] die des Herrn würdig sind: Männer, die sanftmütig, nicht geldgierig, wahrhaftig und bewährt sind. Denn auch sie verrichten für euch den Dienst der Propheten und Lehrer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wählt also für euch Aufseher und Diakone.“ Das griechische Verb kann eine Bestellung bezeichnen und historisch auch eine Wahl durch Handzeichen einschließen.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlicher: „Denn auch sie dienen euch den Dienst der Propheten und Lehrer.“ Das Griechische verbindet Verb und Substantiv desselben Wortstamms.'
    reason: source_idiom
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: Setzt … ein
  rationale: Das Verb bezeichnet hier die Bestellung in ein Amt; je nach historischem Verfahren kann auch die Wahl durch Handzeichen mitgemeint sein. „Einsetzen“ gibt den sicheren Kernsinn wieder, ohne ein bestimmtes Wahlverfahren festzuschreiben.
- source_word: ἐπισκόπους
  choice: Aufseher
  rationale: Die transparente Funktionsbezeichnung wahrt den frühchristlichen Kontext und vermeidet, vorschnell das später institutionell geprägte „Bischöfe“ einzutragen.
- source_word: διακόνους
  choice: Diakone
  rationale: „Diakone“ ist im Deutschen als frühchristliche Amtsbezeichnung verständlich und entspricht der koordinierten Rollenbezeichnung im Griechischen.
- source_word: πραεῖς
  choice: sanftmütig
  rationale: Das Wort bezeichnet eine milde, nicht aggressive Haltung; „sanftmütig“ ist würdig, verständlich und in religiösem Kontext geläufig.
- source_word: ἀφιλαργύρους
  choice: nicht geldgierig
  rationale: Dies bildet die Verneinung von Geldliebe direkt und natürlich ab.
- source_word: ἀληθεῖς
  choice: wahrhaftig
  rationale: „Wahrhaftig“ bezeichnet verlässliche Aufrichtigkeit und passt als persönliche Qualifikation besser als das enger klingende „wahr“.
- source_word: δεδοκιμασμένους
  choice: bewährt
  rationale: Das Perfektpartizip bezeichnet Personen, die geprüft wurden und sich als zuverlässig erwiesen haben.
- source_word: λειτουργοῦσι … τὴν λειτουργίαν
  choice: verrichten … den Dienst
  rationale: Die deutsche Formulierung gibt die griechische figura etymologica natürlich wieder und bewahrt den Gedanken einer ausgeübten gemeinschaftlichen beziehungsweise religiösen Dienstaufgabe.
theological_decisions:
- issue: Amtsbezeichnung ἐπίσκοποι
  choice: Aufseher
  alternative: Bischöfe
  rationale: „Aufseher“ wahrt die lexikalische Bedeutung und lässt offen, inwieweit die in der Didache genannte Rolle bereits dem späteren Bischofsamt entspricht.
- issue: Art der Bestellung durch χειροτονέω
  choice: einsetzen
  alternative: wählen
  rationale: Der Text fordert die Gemeinschaft zur Bestellung auf, nennt aber nicht eindeutig das konkrete Verfahren. Daher wird eine formale Wahl durch Handzeichen nicht als sicher vorausgesetzt.
- issue: Verhältnis zum Dienst der Propheten und Lehrer
  choice: „den Dienst der Propheten und Lehrer“ ohne weitere Erklärung
  alternative: „denselben Dienst wie die Propheten und Lehrer“
  rationale: Der Genitiv lässt sich natürlich auf den charakteristischen Dienst dieser Gruppen beziehen. Die Übersetzung behauptet weder völlige Amtsgleichheit noch bloßen Ersatz und bewahrt so die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, während die griechische Wortstammwiederholung bei λειτουργοῦσι/λειτουργίαν idiomatisch als „verrichten … den Dienst“ wiedergegeben wird. Die Rollenbezeichnungen werden weder konfessionell überformt noch historisch stärker präzisiert, als es der Text erlaubt.
