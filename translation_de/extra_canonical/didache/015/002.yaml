source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: de
  text: Darum missachtet sie nicht; denn sie sind es, die bei euch in Ehren stehen, zusammen mit den Propheten und Lehrern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν ὑπερίδητε αὐτούς
  choice: Darum missachtet sie nicht
  rationale: ὑπεροράω bedeutet hier, jemanden zu übersehen bzw. gering zu achten; „missachten“ gibt die warnende Aufforderung knapp und natürlich wieder. „Darum“ wahrt die folgernde Funktion von οὖν.
- source_word: οἱ τετιμημένοι ὑμῶν
  choice: die bei euch in Ehren stehen
  rationale: Das Perfektpassiv τετιμημένοι bezeichnet Personen, denen Ehre erwiesen worden ist und die entsprechend geehrt gelten. Das natürliche deutsche Idiom wahrt diesen Sinn; ὑμῶν wird kontextgemäß als Bezug auf die Gemeinschaft („bei euch“) verstanden.
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: zusammen mit den Propheten und Lehrern
  rationale: Die Wiedergabe folgt der koordinierenden Bedeutung von μετά mit Genitiv und bewahrt beide Amts- bzw. Personengruppen ohne nähere Deutung.
theological_decisions:
- issue: Stellung der zuvor genannten Gemeindeleiter gegenüber Propheten und Lehrern
  choice: „zusammen mit“ stellt sie hinsichtlich der gebührenden Ehre neben Propheten und Lehrer.
  alternative: Die Formulierung könnte als feste Rangordnung oder vollständige Gleichsetzung kirchlicher Ämter ausgedeutet werden.
  rationale: Der griechische Text fordert ihre Anerkennung gemeinsam mit den genannten Gruppen, legt aber weder eine detaillierte Ämterlehre noch eine Rangordnung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „bei euch in Ehren stehen“ ist idiomatisch und erhält den passiven Ehrungsaspekt des griechischen Perfektpartizips, ohne ein unnatürliches „die von euch Geehrten“ zu erzwingen.
