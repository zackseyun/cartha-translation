id: DID.15.4
reference: Didache 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: de
  text: Was aber eure Gebete, eure Almosen[a] und alle eure Taten betrifft, so verfahrt damit so, wie ihr es im Evangelium unseres Herrn habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gaben für Bedürftige“.'
    reason: „Almosen“ gibt die konkrete wohltätige Gabe genau wieder, kann im heutigen Deutsch jedoch abwertend klingen; die Alternative verdeutlicht den neutralen Sinn.
lexical_decisions:
- source_word: ἐλεημοσύνας
  choice: Almosen
  rationale: Das Wort bezeichnet hier konkret wohltätige Gaben an Bedürftige, nicht allgemein jede barmherzige Handlung. „Almosen“ bewahrt diesen sachlichen und frühchristlichen Sprachgebrauch.
- source_word: πράξεις
  choice: Taten
  rationale: „Taten“ ist ein natürliches, umfassendes deutsches Wort für Handlungen und vermeidet die technischere Färbung von „Praktiken“ oder „Verrichtungen“.
- source_word: οὕτω ποιήσατε
  choice: so tut dies auf die Weise
  rationale: Die Formulierung bewahrt den Imperativ und nimmt die vorangestellten Gebete, Almosen und Taten gemeinsam auf, ohne ein im Griechischen nicht vorhandenes Verb wie „befolgen“ oder „gestalten“ einzuführen.
- source_word: ὡς ἔχετε
  choice: wie ihr es … habt
  rationale: Die knappe griechische Wendung wird bewusst nicht als „wie es vorgeschrieben ist“ oder „wie ihr es vorgegeben findet“ ausgelegt; dadurch bleibt offen, in welchem Sinn die Adressaten die Weisung im Evangelium „haben“.
theological_decisions:
- issue: Bedeutung von „Evangelium“
  choice: im Evangelium unseres Herrn
  alternative: in der Botschaft unseres Herrn
  rationale: Der Singular mit bestimmtem Artikel wird formal bewahrt. Der Text lässt offen, ob eine schriftliche Evangelienüberlieferung oder die autoritative Herrenüberlieferung insgesamt gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Themenkonstruktion bildet die griechische Hervorhebung der drei Gegenstände nach. Die etwas knappe Wendung „wie ihr es … habt“ erhält die Mehrdeutigkeit des Ausgangstextes, statt sie durch eine erklärende Paraphrase aufzulösen.
