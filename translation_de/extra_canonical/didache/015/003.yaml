id: DID.15.3
reference: Didache 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: de
  text: Weist einander jedoch zurecht, nicht im Zorn, sondern in Frieden, wie ihr es im Evangelium habt. Mit jedem, der sich gegen einen anderen vergeht,[a] soll niemand reden; auch soll er von euch nichts zu hören bekommen, bis er umkehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der gegenüber einem anderen das Ziel verfehlt“ oder „fehlgeht“.'
    reason: Erläutert das Bild und den Bedeutungsumfang von ἀστοχέω, während der Haupttext den zwischenmenschlichen Zusammenhang natürlich wiedergibt.
lexical_decisions:
- source_word: ἐλέγχετε
  choice: weist … zurecht
  rationale: Gibt den fortlaufenden Imperativ als gegenseitige, korrigierende Zurechtweisung wieder, ohne ihn auf bloße Kritik oder öffentliche Anklage zu verengen.
- source_word: ἐν ὀργῇ / ἐν εἰρήνῃ
  choice: im Zorn / in Frieden
  rationale: Bewahrt den ausdrücklichen Gegensatz und die würdevolle, zugleich leicht verständliche Sprache des Griechischen.
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: der sich gegen einen anderen vergeht
  rationale: ἀστοχέω bedeutet grundlegend das Ziel verfehlen oder fehlgehen; mit κατά bezeichnet es hier ein Fehlverhalten gegenüber einem Mitmenschen. „Sich vergehen“ bildet den zwischenmenschlichen Verstoß natürlich ab, ohne das Verb vorschnell auf einen bestimmten Sündenbegriff festzulegen.
- source_word: μηδὲ παρ’ ὑμῶν ἀκουέτω
  choice: auch soll er von euch nichts zu hören bekommen
  rationale: Entspricht der aktiven Form ἀκουέτω und der Herkunftsangabe παρ’ ὑμῶν. Die idiomatische deutsche Wendung macht den im Griechischen ausgelassenen Redegegenstand deutlich, ohne eine passive Bedeutung einzutragen.
- source_word: μετανοήσῃ
  choice: umkehrt
  rationale: Gibt die geforderte Sinnes- und Verhaltensänderung umfassender wieder als bloßes Bedauern.
theological_decisions:
- issue: Art der gemeinschaftlichen Distanzierung
  choice: „Mit … soll niemand reden; auch soll er von euch nichts zu hören bekommen“
  alternative: „Niemand soll ihn anhören“
  rationale: Die griechische Konstruktion beschreibt, dass der Fehlende keine Ansprache aus der Gemeinschaft erhalten soll. Sie verlangt keine Auslegung darüber hinaus, ob dies eine bestimmte formale Kirchenzuchtordnung darstellt.
- issue: Bezug auf „das Evangelium“
  choice: „wie ihr es im Evangelium habt“
  alternative: „wie es im Evangelium vorgeschrieben ist“
  rationale: Die knappe Formulierung des Ausgangstextes bleibt erhalten und wird nicht auf eine bestimmte Evangelienstelle oder einen ausdrücklich gesetzgeberischen Sinn festgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem paränetischem Ton. Der Satzbau bleibt nahe an der griechischen Abfolge, wird aber durch Punkt und Semikolon für heutige Leser gegliedert. Der Fußnotenmarker [a] steht im Haupttext.
