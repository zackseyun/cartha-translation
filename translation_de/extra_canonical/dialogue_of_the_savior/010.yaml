lexical_decisions:
- source_word: word
  choice: Wort
  rationale: Bewahrt die mögliche personale oder offenbarende Bedeutung, ohne sie vorschnell als bloße Rede oder ausdrücklich als Logos zu deuten.
- source_word: abyss
  choice: Abgrund
  rationale: Natürliches, würdiges Deutsch, das sowohl räumliche Tiefe als auch kosmologische Bedeutung offenhält.
- source_word: inferno
  choice: Feuersglut
  rationale: Gibt das bedrohliche Feuerbild wieder, ohne den späteren dogmatischen Begriff „Hölle“ einzutragen.
- source_word: power
  choice: Macht
  rationale: Bewahrt die abstrakte oder hypostasierte Bedeutung und vermeidet eine Festlegung auf „Kraft“ oder ein bestimmtes Geistwesen.
- source_word: Majesty
  choice: Majestät
  rationale: Erhält den titulären Charakter und die mögliche Bezeichnung eines höchsten göttlichen Wesens.
- source_word: deficient
  choice: unvollständig geworden
  rationale: Bewahrt den Gedanken eines Mangels, ohne ihn als moralische Schuld oder ontologischen Fall festzulegen.
- source_word: spirits
  choice: Geister
  rationale: Direkte, kontextoffene Wiedergabe; „Geistwesen“ wäre bereits stärker erklärend.
- source_word: soul
  choice: Seele
  rationale: Bewahrt die im Zeugen erkennbare Unterscheidung zwischen Geistern und einer Seele.
- source_word: garments
  choice: Gewänder
  rationale: Erhält die mögliche symbolische Bedeutung und klingt würdiger als das alltägliche „Kleider“.
- source_word: vision
  choice: Schau
  rationale: Kennzeichnet visionäres Sehen, bleibt aber verständlich und vermeidet die Mehrdeutigkeit von „Anblick“.
- source_word: Eternally Existent One
  choice: der ewig Seiende
  rationale: Bewahrt die substantivierte, theologisch offene Seinsbezeichnung, ohne sie stillschweigend mit einem bestimmten Gottesnamen gleichzusetzen.
theological_decisions:
- issue: Personaler oder unpersonaler Status des „Wortes“
  choice: Durchgehend „das Wort“, auch bei Anrede und Handlung
  alternative: „die Stimme“, „der Logos“ oder ausdrücklich eine personale Mittlergestalt
  rationale: Der Zeuge stellt das Wort handelnd dar, erklärt aber dessen ontologischen Status nicht. Die Übersetzung bewahrt diese Spannung.
- issue: Kosmologische Begriffe
  choice: „Macht“, „Majestät“, „Same“ und „Wort“ bleiben unkommentiert im Haupttext
  alternative: Erklärende Identifikation mit Gott, Christus, Seele oder göttlichem Funken
  rationale: Solche Identifikationen wären interpretative Festlegungen, die der beschädigte Text nicht eindeutig trägt.
- issue: „Son of Man“
  choice: „Menschensohn“
  alternative: „Sohn des Menschen“ oder eine rein menschliche Umschreibung
  rationale: „Menschensohn“ ist die geläufige, formal entsprechende deutsche Titelwiedergabe und lässt die traditionsgeschichtliche Bedeutung offen.
- issue: „the good“
  choice: „das Gute“
  alternative: „die Guten“
  rationale: Der englische Zeuge ist zwischen abstraktem Gut und guten Menschen deutungsoffen; der Singular „das Gute“ wahrt diese Offenheit am ehesten.
- issue: Göttliche Immanenz
  choice: „Der lebendige Gott ist in euch, so wie ihr in Gott seid“
  alternative: Abschwächung zu „Gott wirkt unter euch“ oder ontologische Gleichsetzung von Mensch und Gott
  rationale: Die wechselseitige Innenbeziehung wird unmittelbar wiedergegeben, ohne daraus Identität oder bloße Gegenwart abzuleiten.
- issue: Umgang mit Textlücken
  choice: Rekonstruktionen in eckigen Klammern und unlesbare Stellen als […]
  alternative: Lücken stillschweigend glätten oder alle Ergänzungen in den Fließtext integrieren
  rationale: Der fragmentarische Zustand ist auslegungsrelevant und soll für Leser sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Der fragmentarische Charakter des koptischen Manuskripts wird durch eckige Klammern und Auslassungszeichen sichtbar gehalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, stützt sich der Entwurf auf den angegebenen gemeinfreien englischen Zeugen; ungewöhnliche Bilder und theologische Spannungen wurden nicht konfessionell geglättet.
