translation:
  language: de
  text: 'Er [nahm] Judas, Matthäus und Maria [mit], [um ihnen den äußersten] Rand von Himmel und Erde zu zeigen.[a] Als er seine [Hand] auf sie legte, hofften sie, ihn sehen zu können.


    Judas blickte nach oben und sah einen Ort von gewaltiger Höhe; und unten sah er den Ort des Abgrunds.


    Judas sagte zu Matthäus: „Bruder, wer kann zu einer solchen Höhe hinaufsteigen oder in den Abgrund dort unten hinabsteigen, wo doch dort eine gewaltige Feuersglut und großer Schrecken herrschen?“


    In genau diesem Augenblick ging ein Wort von der Höhe aus. Während Judas dastand, sah er, auf welche Weise das Wort herabstieg.


    Er fragte das Wort: „Warum bist du herabgestiegen?“


    Der Menschensohn begrüßte sie und sagte zu ihnen: „Ein Same aus einer Macht war unvollständig geworden und stieg in den Abgrund der Erde hinab. Die Majestät erinnerte sich [an ihn] und sandte das [Wort zu] ihm. Das Wort nahm den Samen hinauf vor [das Angesicht] der Majestät, damit […] das erste Wort nicht verloren ginge.“[b]


    [Seine] Jünger wunderten sich über alles, was er ihnen sagte, und nahmen alles vertrauensvoll an, obwohl sie wussten, dass es nutzlos ist, über Unrecht nachzusinnen.[c]


    Dann sagte er zu seinen Jüngern: „Habe ich euch nicht gesagt, dass das Gute zum Licht hinaufgenommen werden wird wie eine sichtbare Stimme und ein aufleuchtender Blitz?“[d]


    Alle seine Jünger priesen ihn und sagten: „Herr, bevor du hier erschienen bist – wer pries dich, da doch alles Lob dir gilt? Oder wer segnete [dich], da doch aller Segen dir <gilt>?“


    Während sie dort standen, sah er zwei Geister, die eine einzige Seele mit sich führten. Und ein gewaltiger Blitz leuchtete auf. Vom Menschensohn ging ein Wort aus: „Gebt ihnen ihre Gewänder!“


    Da wurde das Kleine dem Großen gleich. Sie waren [wie] jene, die nach oben aufgenommen wurden. […] [Es bestand kein Unterschied] zwischen ihnen. Die [Aussprüche], die er [sprach, überzeugten die] Jünger.[e]


    Maria [sagte zu ihm: „Sieh, ich] erkenne das Böse, [das] die Menschen von Anfang an [beeinflusst], wenn sie miteinander leben.“


    Der Herr sagte [zu ihr]: „Wenn du sie siehst, [erkennst] du viel. Sie werden [dort nicht beieinanderbleiben]. Wenn du jedoch den ewig Seienden siehst, wird dies die große Schau sein.“[f]


    Sie alle sagten zu ihm: „Erkläre es uns.“


    Er sagte zu ihnen: „Auf welche Weise wollt ihr es sehen: [in] einer Schau, die vergeht, oder in einer Schau, die ewig bleibt?“


    Weiter sagte er: „Bemüht euch nach Kräften, das zu retten, was nach [euch] bleiben wird. Sucht es und sprecht aus seinem Inneren, damit alles, was ihr sucht, mit euch selbst übereinstimmt. Denn wahrlich, ich [sage] euch: Der lebendige Gott [ist] in euch, […] [so wie ihr] in Gott seid.“[g]


    [a] Der Text ist an dieser Stelle beschädigt; die Wörter in eckigen Klammern sind ergänzte Rekonstruktionen. Leere beziehungsweise nicht rekonstruierbare Lücken werden mit […] angezeigt.


    [b] „Same“, „Macht“, „Majestät“ und „Wort“ bleiben als eigenständige Bild- oder Wesensbegriffe stehen. Der beschädigte Zusammenhang lässt ihre genaue Beziehung zueinander offen.


    [c] Möglich ist auch: „selbst als sie erkannten, dass es nutzlos ist, das Unrecht zu betrachten“. Die Satzbeziehung ist unsicher.


    [d] Die ungewöhnliche Verbindung „sichtbare Stimme“ wurde bewahrt und nicht erklärend aufgelöst.


    [e] Dieser Abschnitt ist stark beschädigt. Sowohl die Bezüge von „ihnen“ und „sie“ als auch das Verhältnis von „dem Kleinen“ und „dem Großen“ bleiben unsicher.


    [f] „Schau“ bezeichnet hier das Sehen einer Vision. „Der ewig Seiende“ kann auch als „der, der ewig besteht“ wiedergegeben werden.


    [g] Der Wortlaut ist beschädigt. Insbesondere „was nach euch bleiben wird“ und „aus seinem Inneren“ lassen mehrere Deutungen zu.'
