review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung bewahrt die Aussagefolge, die fragmentarische Überlieferung sowie die editorischen Klammern grundsätzlich zuverlässig. Eine kleine, aber sinnvolle Korrektur betrifft die Verteilung der Ergänzungsklammern in Judas’ Frage: Das in der Vorlage ergänzte „to know“ sollte im Deutschen klar als Teil der ersten Ergänzung erkennbar sein, statt die folgende Relativfügung künstlich in dieselbe Klammer hineinzuziehen.'
  naturalness: Modernes, würdiges Standarddeutsch. „in Ordnung halten“, „fortbestehen“, „Gefährten“, „Leuchte“ und „Verstand“ sind verständlich und wahren den absichtlich offenen, teils aphoristischen Duktus. Die fragmentarische Syntax wird angemessen nicht geglättet.
  terminology: „Retter“ ist für Savior neutral und angemessen; „Herr“, „Wahrheit“, „Seele“, „Geist“, „Verstand“ und „Leuchte“ sind konsistent. Die Übersetzung vermeidet zusätzliche dogmatische Festlegungen. Da die direkte koptische Prüfung aussteht, bleibt insbesondere die genaue Fachterminologie vorläufig.
  issues:
  - severity: low
    issue: Klammersegmentierung in Judas’ Frage
    rationale: 'Die englische Vorlage hat getrennte editorische Ergänzungen: „[I would like to know all]“ und „[that belong to]“. In „[ich möchte alle] Taten der Seelen [kennen, die zu] diesen Kleinen [gehören]“ wird „die zu“ zwar korrekt als ergänzt markiert, aber „kennen“ wird unnötig mit der Relativfügung verbunden. „[kennenlernen, die zu]“ bildet die deutsche Satzfügung und die Ergänzungsstruktur klarer ab.'
