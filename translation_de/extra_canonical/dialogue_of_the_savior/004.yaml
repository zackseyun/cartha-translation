translation:
  language: de
  text: 'Matthäus sagte: „Wie [. . .]?“


    [] Der Retter sagte: „[Wenn ihr nicht in Ordnung haltet], was in euch ist, wird [euer Werk] fortbestehen, ihr selbst aber [nicht].“


    Judas [sagte]: „Herr, [ich möchte alle] Taten der Seelen [kennen, die zu] diesen Kleinen [gehören]. Wenn [. . .], wo werden sie wohnen? [. . .] der Geist [. . .]?“


    Der Herr [sagte: „. . . nehmt] sie auf. Sie sterben nicht und werden auch nicht vernichtet, denn sie haben [ihre] Gefährten erkannt und den, der sie aufnehmen wird; denn die Wahrheit sucht die Weisen und die Gerechten.“


    Der Retter [sagte]: „Die Leuchte [des] Körpers ist der Verstand. Solange [das, was in] euch ist, in Ordnung gehalten wird, nämlich [die Seele], werden eure Körper [erleuchtet] sein. Solange eure Herzen verfinstert sind, wird das Licht, auf das ihr [] hofft, [euch fernbleiben]. Ich habe [euch zu mir gerufen], weil ich bald fortgehen werde, damit [ihr] mein Wort unter euch [aufnehmt. Seht], ich sende es [euch].“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten gemeinfreien englischen Textzeugen. Eckige Klammern kennzeichnen editorisch ergänzten beziehungsweise beschädigten Text; „[. . .]“ und leere Klammern zeigen Lücken im Manuskript an. Eine direkte Prüfung am koptischen Text von Nag-Hammadi-Kodex III,5 steht noch aus.
    reason: Die Ausgangsdaten weisen ausdrücklich darauf hin, dass die Prüfung anhand der koptischen Quelle noch aussteht; die Leser müssen den vorläufigen Charakter und die Funktion der Schadenszeichen erkennen können.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Natürliches, würdiges Standarddeutsch; vermeidet eine konfessionell stärker geprägte Festlegung auf „Heiland“.
- source_word: maintain in order
  choice: in Ordnung halten
  rationale: Bewahrt die konkrete und zugleich offene Bedeutung des englischen Zeugnisses, ohne sie psychologisch oder asketisch auszudeuten.
- source_word: work
  choice: Werk
  rationale: Erhält die mögliche Bedeutung eines hervorgebrachten Werks oder Wirkens und legt sich nicht enger auf „Taten“ fest.
- source_word: little ones
  choice: diese Kleinen
  rationale: Formnahe Wiedergabe, die offenlässt, ob Kinder, Jünger oder eine geistliche Gruppe gemeint sind.
- source_word: companions
  choice: Gefährten
  rationale: Gibt die relationale Bedeutung wieder, ohne eine bestimmte kosmologische Identität zu unterstellen.
- source_word: mind
  choice: Verstand
  rationale: Verständliches modernes Deutsch; die genaue koptische Terminologie muss bei der Quellenprüfung verifiziert werden.
- source_word: lamp
  choice: Leuchte
  rationale: Dignifizierte und bildhafte Wiedergabe; „Leuchte“ bezeichnet hier das lichtgebende Organ beziehungsweise Prinzip.
- source_word: accept
  choice: aufnehmen
  rationale: Passt in beiden erhaltenen Zusammenhängen zu Personen beziehungsweise zum Wort und bewahrt die mögliche Bedeutung von Annehmen oder Empfangen.
theological_decisions:
- issue: Fortbestehen des Werks im Gegensatz zur Person
  choice: „wird [euer Werk] fortbestehen, ihr selbst aber [nicht]“
  alternative: „wird eure Arbeit Bestand haben, nicht aber ihr“
  rationale: Bewahrt die auffällige theologische Spannung, ohne zu erklären, worin Werk und persönliches Fortbestehen bestehen.
- issue: Unsterblichkeit beziehungsweise Unzerstörbarkeit der Seelen
  choice: „Sie sterben nicht und werden auch nicht vernichtet“
  alternative: „Sie werden weder sterben noch zugrunde gehen“
  rationale: Die präsentische Aussage und ihre doppelte Negation bleiben erhalten; keine systematische Seelenlehre wird ergänzt.
- issue: Personifizierung der Wahrheit
  choice: „die Wahrheit sucht die Weisen und die Gerechten“
  alternative: „die Wahrheit verlangt nach den Weisen und Gerechten“
  rationale: Das aktive Suchen wird beibehalten und nicht als bloße Zugehörigkeit oder abstrakte Übereinstimmung umgedeutet.
- issue: Verhältnis von Verstand, Seele, Körper und Licht
  choice: Die überlieferte Abfolge bleibt wörtlich erkennbar.
  alternative: Eine harmonisierende Deutung, nach der die Seele den Körper geistlich erleuchtet.
  rationale: Der fragmentarische Text enthält eine genuine anthropologische Spannung; die Übersetzung soll keine geschlossene Lehre daraus konstruieren.
- issue: Empfänger von „ich sende es“
  choice: Das Pronomen „es“ verweist grammatisch auf „mein Wort“.
  alternative: „ich sende ihn euch“ mit möglichem Personenbezug
  rationale: Im vorhandenen englischen Zeugnis ist „word“ der nächstliegende Bezug; wegen des beschädigten Textes bleibt die Aussage dennoch als Rekonstruktion markiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit möglichst formnaher Bewahrung der fragmentarischen Syntax. Unsichere Ergänzungen und Manuskriptlücken wurden nicht geglättet. Die Anrede wurde im Plural wiedergegeben, entsprechend den Formen „you/your“ im konsultierten englischen Zeugnis; auch dies ist bei der koptischen Quellenprüfung zu kontrollieren.
