lexical_decisions:
- source_word: Mother of the All
  choice: Mutter des Alls
  rationale: Bewahrt die kosmologische Titelform und vermeidet die stärker personifizierende oder erklärende Wiedergabe „Mutter aller Dinge“.
- source_word: true mind
  choice: wahres Denken
  rationale: Gibt den Erkenntnisbezug wieder, ohne ihn vorschnell als „Vernunft“, „Gesinnung“ oder eine technische Hypostase festzulegen.
- source_word: works of the female
  choice: Werke des Weiblichen
  rationale: Unterscheidet die abstrakt-kosmologische Formulierung von der unmittelbar vorausgehenden „Frau“ und vermeidet eine pauschale Aussage über Werke von Frauen.
- source_word: archons / aeons
  choice: Archonten / Äonen
  rationale: Behält etablierte Fachbegriffe bei; eine eindeutige Auflösung als bloß „Herrscher“ oder „Zeitalter“ würde den kosmologischen Sinn verengen.
- source_word: generative
  choice: es bringt hervor
  rationale: Natürliches Deutsch, das die produktive beziehungsweise zeugende Kraft ausdrückt, ohne eine bestimmte metaphysische Theorie festzuschreiben.
- source_word: dissolves
  choice: löst … auf
  rationale: Bewahrt die Unterscheidung zum zuvor gebrauchten „vernichten“ und damit den möglichen Wechsel der Bildsprache.
- source_word: work / works
  choice: wirken / Werke / tun
  rationale: Die deutsche Wortfamilie wird soweit idiomatisch möglich sichtbar gehalten; im Schlusssatz verlangt natürliches Deutsch jedoch „den Willen tun“.
theological_decisions:
- issue: Die Aussage „Betet an dem Ort, an dem es keine Frau gibt“
  choice: Wörtliche, nicht harmonisierende Wiedergabe mit erklärender Fußnote zur wechselnden Ausdrucksweise
  alternative: Deutung als innerer, geschlechtsloser Zustand oder als Aufforderung zur Enthaltsamkeit
  rationale: Der beschädigte und rätselhafte Text bietet keine sichere Grundlage, eine bestimmte anthropologische oder asketische Auslegung in die Übersetzung einzutragen.
- issue: Einheit von Vater und Sohn
  choice: „denn die beiden sind eins“
  alternative: „denn beide sind ein und dasselbe“ oder eine trinitarische Ausdeutung
  rationale: Bewahrt die starke Einheitsaussage, ohne ihre genaue ontologische Bedeutung über den Wortlaut hinaus festzulegen.
- issue: „Selbst für mich ist es schwer, ihn zu erreichen“
  choice: Die theologisch spannungsreiche Aussage bleibt unverändert stehen
  alternative: Abschwächung zu „schwer zu beschreiben“ oder Bezug auf die Jünger
  rationale: Eine Harmonisierung würde die genuine Schwierigkeit des überlieferten Zeugnisses beseitigen.
- issue: Das wahre Wort und seine hervorbringende Kraft
  choice: „ein wahres Wort … und es bringt hervor“
  alternative: Personalisierung als „das Wort“ oder technische Bezeichnung als „zeugungskräftig“
  rationale: Die unbestimmte Form und die semantische Offenheit des Zeugnisses bleiben erhalten.
- issue: Wer die Werke auflöst
  choice: Die ergänzte Lesart wird in eckigen Klammern beibehalten
  alternative: Glättung ohne Kennzeichnung oder dogmatische Identifizierung des Verstehenden
  rationale: Die Rekonstruktion ist textkritisch unsicher und darf nicht als vollständig erhaltener Wortlaut erscheinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen Dialogsätzen. Rätselhafte und theologisch spannungsreiche Aussagen wurden nicht harmonisiert. Ergänzungen und Lücken bleiben sichtbar. Der Entwurf beruht mangels abgeschlossener koptischer Quellenprüfung vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugen; die englische POB-Fassung wurde nur als konsultative Kontrollschicht behandelt.
