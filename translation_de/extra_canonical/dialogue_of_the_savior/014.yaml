review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt sorgfältig und erhält Ergänzungen, Textlücken sowie die rätselhafte Kosmologie sichtbar. Eine sichere Korrektur betrifft jedoch Matthäus’ Begründung: „but because they should cease [giving birth]“ ist nicht final als Zweck („damit sie aufhören“) formuliert, sondern modal („weil sie … aufhören sollen“). Die Wiedergabe des passiven „made visible“ beim Licht wird zudem deutlicher als Vorgang ausgedrückt.'
  naturalness: Würdiges modernes Standarddeutsch, überwiegend flüssig. „aus dem wahren Denken heraus“ ist verständlich, aber stilistisch unnötig umständlich; „aus wahrem Denken“ ist knapper und bewahrt die vorläufige, nicht-technische Wiedergabe. „wird … sichtbar gemacht“ bildet beim Licht die passive Form genauer ab.
  terminology: „Mutter des Alls“, „Werke des Weiblichen“, „Archonten“ und „Äonen“ sind konsequent und ohne interpretierende Verengung wiedergegeben. Die Einheit von Vater und Sohn sowie die schwierige Aussage über das Erreichen des Weges bleiben unharmonisiert. Die Fußnoten sind angemessen verankert; die entfernten bloßen Kodexseitenzahlen müssen nicht als Anker erhalten werden.
  issues:
  - severity: medium
    issue: Modalität in Matthäus’ Erklärung
    rationale: Die Formulierung „sondern damit sie aufhören“ macht das Aufhören zu einem Zweck der Vernichtung. Der Zeuge sagt dagegen „but because they should cease [giving birth]“ und bezeichnet das Aufhören als geforderte beziehungsweise vorgesehene Folge. „sondern weil sie [aufhören sollen, Kinder zu gebären]“ bewahrt dies.
  - severity: low
    issue: Passiv bei der Sichtbarkeit des Lichts
    rationale: „[Es wird] ewig durch sich selbst [sichtbar]“ klingt im Deutschen vor allem statisch. „[Es wird] ewig durch sich selbst [sichtbar gemacht]“ gibt das im Zeugen ergänzte passive „made visible“ präziser wieder.
  - severity: low
    issue: Stilistische Schwere bei „aus dem wahren Denken heraus“
    rationale: „Aus wahrem Denken“ ist idiomatischer und bewahrt die semantische Offenheit von „from the true mind“, ohne „mind“ dogmatisch oder psychologisch festzulegen.
