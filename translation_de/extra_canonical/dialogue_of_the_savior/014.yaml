translation:
  language: de
  text: '**Dialog des Erlösers — Die Werke des Vaters und die Werke der Welt**


    Maria fragte: „[Von welcher] Art ist das Senfkorn? Ist es vom Himmel oder von der Erde?“[a]


    Der Herr sagte: „Nachdem der Vater die Welt für sich eingerichtet hatte, ließ er vieles von dem, was übrig geblieben war, bei der Mutter des Alls. Deshalb sät und wirkt er.“


    Judas sagte: „Du hast uns dies aus dem wahren Denken heraus gesagt. Wenn wir beten, wie sollen wir beten?“


    Der Herr sagte: „Betet an dem Ort, an dem es keine Frau gibt.“


    Matthäus sagte: „Er sagt uns: ›Betet an dem Ort, an dem es keine Frau gibt.‹ Das bedeutet, die Werke des Weiblichen zu vernichten. Nicht weil es eine andere Art der Geburt gibt, sondern damit sie aufhören, [Kinder zu gebären].“[b]


    Maria sagte: „Werden sie denn niemals vernichtet werden?“


    Der Herr sagte: „[Ihr] wisst, dass sie [wieder] vergehen werden, […] und [auch die Werke] des [Weiblichen, die hier sind,] werden [vernichtet werden].“


    Judas sagte [zu Matthäus]: „Die Werke des [Weiblichen] werden tatsächlich vergehen. Die Archonten werden [dann ihre Äonen anrufen], und wir werden auf sie vorbereitet sein.“[c]


    Der Herr sagte: „Werden sie [euch sehen, und werden sie] diejenigen sehen, die euch aufnehmen? Seht: Vom Vater geht in der Stille ein wahres Wort zum Abgrund aus, mit einem Blitzstrahl, und es bringt hervor. Sehen sie es, oder überwältigen sie es? Gewiss kennt ihr den [Weg] besser, den [weder ein Engel] noch eine Macht [kennt]. Es ist der Weg des Vaters und des Sohnes, denn die beiden sind eins, und ihr werdet auf dem [Weg] gehen, den ihr erkannt habt. Selbst wenn die Archonten gewaltig werden, werden sie ihn nicht erreichen können. Ich sage euch die [Wahrheit]: Selbst für mich ist es schwer, ihn zu erreichen.“


    […] [Maria] fragte [den Herrn]: „Wenn Werke [vernichtet werden, was] vernichtet dann eigentlich ein Werk?“


    [Der Herr sagte]: „Ihr wisst: [Wann immer] ich [es] vernichte, wird es an seinen eigenen Ort gehen.“


    Judas sagte: „Wie wird der Geist sichtbar?“


    Der Herr sagte: „Wie wird das Schwert [sichtbar]?“


    Judas sagte: „Wie wird das Licht sichtbar?“


    Der Herr sagte: „[Es wird] ewig durch sich selbst [sichtbar].“


    Judas fragte: „Wer löst wessen Werke auf? Lösen die Werke die Welt auf, oder ist es die Welt, die die Werke auflöst?“


    Der Herr [antwortete]: „Wer [versteht, ist derjenige, der die Werke auflöst]. Denn wer die Werke erkannt hat, muss den [Willen] des Vaters tun.“[d]


    [a] Eckige Klammern kennzeichnen ergänzten oder wegen Beschädigung unsicheren Text; […] bezeichnet eine Lücke im überlieferten Text. Die bloßen Seitenzahlen des Kodex sind nicht wiedergegeben.


    [b] „Die Frau“ und „das Weibliche“ stehen hier bewusst nebeneinander: Der erste Ausdruck bezeichnet im Wortlaut eine Frau, der zweite die im Text so genannten „Werke des Weiblichen“. Die rätselhafte Aussage wird nicht deutend aufgelöst.


    [c] „Archonten“ („Herrscher“) und „Äonen“ sind Fachbegriffe der Gedankenwelt dieses Textes und bleiben daher als solche stehen.


    [d] Die wiederholten Wörter „Werke“, „wirkt“ und „tun“ geben ein Wortspiel des zugrunde liegenden Zeugnisses soweit wie möglich wieder. Da eine unmittelbare Prüfung des koptischen Textes noch aussteht, bleibt die genaue Wortverknüpfung vorläufig.'
