review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die auffälligen Aussagen über Opfer, gute Taten, Seele und Körper ohne dogmatische Harmonisierung. Einzelne editorische Klammergrenzen sowie die Auslassungszeichen sind jedoch nicht konsequent erhalten. Die unmittelbare koptische Prüfung steht nach den Metadaten noch aus.
  naturalness: Das Gebetsregister ist überwiegend würdig und modernes Standarddeutsch. „Vollkommene Gelassenheit“ gibt „complete serenity“ genauer und idiomatischer wieder als „vollkommene Ruhe“, ohne die zuvor genannte „Ruhe“ für „rest“ zu vermischen. „Vieler [Arbeit]“ ist als genitivische Ergänzung zu „Ruhe von“ korrekt.
  terminology: „einziger Sohn“, „Umkehr zum Leben“, „Streitkräfte“, „der Einsame“ und „Glieder des Körpers“ sind zurückhaltende, quellentreue Entscheidungen. „Dein Opfer“ und „hineingehen“ lassen die im Zeugen nicht näher bestimmte Bezugsgröße beziehungsweise das Ziel offen.
  issues:
  - severity: medium
    issue: Die editorischen Klammergrenzen in der Zeile über das Hervorgehen aus dem Vater sind verschoben.
    rationale: Der Zeuge hat „[and this has come forth] from you“. Die deutsche Fassung muss daher den Gegenstand „von dir“ außerhalb der Klammer belassen, statt ihn teilweise in eine anders abgegrenzte Ergänzung zu integrieren.
  - severity: low
    issue: Die Auslassungszeichen der beschädigten Zeile sind typografisch uneinheitlich und teils mit einem Leerzeichen innerhalb der Klammer gesetzt.
    rationale: Die Beschädigungssignale des Zeugen sollen erkennbar und einheitlich bewahrt werden; „[. . .]“ bildet die Vorlage transparent nach.
  - severity: low
    issue: „vollkommene Ruhe“ verengt bzw. vermischt „complete serenity“ mit dem vorherigen „rest“.
    rationale: „Vollkommene Gelassenheit“ entspricht „serenity“ präziser und bleibt in modernem Gebetsdeutsch verständlich.
