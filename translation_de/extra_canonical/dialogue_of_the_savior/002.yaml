translation:
  language: de
  text: '„Wenn ihr Lob darbringt, tut es auf diese Weise:


    Höre uns, Vater,

    so wie du auf deinen einzigen Sohn gehört

    und ihn sogar zu dir aufgenommen hast.

    [Du] hast ihm Ruhe von vieler [Arbeit] geschenkt.

    Unsere Kraft [kann nicht überwunden werden],

    [weil] deine Streitkräfte [nicht überwunden werden können],

    [… ] Licht [… ] lebendig [… ] unzugänglich [… lebendig].

    Das [wahre] Wort [hat] Umkehr zum Leben [geschenkt],

    [und dies ist] von dir [ausgegangen].

    Du bist der Gedanke und die vollkommene Ruhe des Einsamen.[a]

    Höre uns noch einmal,

    so wie du auf deine Erwählten gehört hast.

    Durch dein Opfer werden die Erwählten hineingehen.[b]

    Durch ihre guten Taten haben sie ihre Seelen von blinden Gliedern des Körpers befreit,

    damit sie [] für immer bestehen können.

    Amen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Einsame“ kann je nach zugrunde liegendem koptischem Ausdruck auch „der Alleinstehende“ oder „der Einzige“ bedeuten. Die genaue Bedeutung bleibt ohne Prüfung der Handschrift unsicher.
    reason: Kennzeichnet eine bedeutungsvolle lexikalische und möglicherweise theologische Mehrdeutigkeit.
  - marker: b
    text: Wohinein die Erwählten gehen, ist im erhaltenen Wortlaut nicht genannt. Auch die genaue Bedeutung von „dein Opfer“ bleibt offen.
    reason: Verhindert, dass Ziel und Opferbezug stillschweigend dogmatisch ergänzt werden.
lexical_decisions:
- source_word: offer up praise
  choice: Lob darbringen
  rationale: Bewahrt den kultisch-feierlichen Ton, ohne die nicht ausdrücklich genannte Vorstellung eines konkreten Opferakts hinzuzufügen.
- source_word: only Son
  choice: einziger Sohn
  rationale: Gibt die Aussage des vorliegenden Zeugen direkt wieder; „einziggeborener Sohn“ würde eine spezifischere christologische Terminologie einführen.
- source_word: rest
  choice: Ruhe
  rationale: Erhält die mögliche körperliche, geistige oder eschatologische Mehrdeutigkeit.
- source_word: battle forces
  choice: Streitkräfte
  rationale: Bewahrt das militärische Bild und vermeidet eine vorschnelle Deutung als Engelheere oder geistliche Mächte.
- source_word: repentance for life
  choice: Umkehr zum Leben
  rationale: „Umkehr“ ist gegenwärtiges, verständliches Deutsch und lässt offen, ob Leben Ziel, Folge oder Bestimmung der Umkehr ist.
- source_word: thought
  choice: Gedanke
  rationale: Nahe Wiedergabe des englischen Zeugen; eine abstraktere gnostische Fachbedeutung wird ohne koptische Prüfung nicht vorausgesetzt.
- source_word: complete serenity
  choice: vollkommene Ruhe
  rationale: „Ruhe“ passt zum Gebetsregister und bewahrt mögliche spirituelle bzw. eschatologische Bezüge; „Gelassenheit“ wäre stärker psychologisierend.
- source_word: solitary
  choice: Einsamen
  rationale: Bewahrt die substantivische und mehrdeutige Bezeichnung; weder asketische noch metaphysische Bedeutung wird festgelegt.
- source_word: enter in
  choice: hineingehen
  rationale: Erhält das nicht genannte Ziel und ergänzt weder Reich noch Ruhe oder Heil.
- source_word: blind bodily limbs
  choice: blinden Gliedern des Körpers
  rationale: Gibt das auffällige Körperbild möglichst transparent wieder, ohne es allegorisch aufzulösen.
theological_decisions:
- issue: Beziehung zwischen Gottes Opfer und dem Eintritt der Erwählten
  choice: „Durch dein Opfer werden die Erwählten hineingehen“
  alternative: „Durch das dir dargebrachte Opfer …“ oder „Durch ihr Opfer …“
  rationale: Der Zeuge lautet „your sacrifice“. Die gewählte Übersetzung erhält die direkte Zuordnung zu Gott, ohne Art, Urheber oder Empfänger des Opfers näher zu bestimmen.
- issue: Befreiung der Seele durch gute Taten
  choice: Die Aussage wird direkt als „Durch ihre guten Taten haben sie ihre Seelen … befreit“ wiedergegeben.
  alternative: Eine Abschwächung wie „zeigten sie die Befreiung ihrer Seelen“
  rationale: Die Spannung zwischen guten Taten, Seele und Körper gehört zum vorliegenden Text und darf nicht durch konfessionelle Harmonisierung beseitigt werden.
- issue: „der Einsame“ als mögliche religiöse Fachbezeichnung
  choice: Wörtlich und offen als „des Einsamen“ wiedergegeben
  alternative: „des Mönchs“, „des Einzigen“ oder „dessen, der allein ist“
  rationale: Ohne direkte Prüfung des koptischen Textes lässt sich die asketische, individualisierende oder metaphysische Lesart nicht sicher entscheiden.
- issue: Textbeschädigung und Ergänzungen
  choice: Eckige Klammern und Auslassungspunkte werden erhalten.
  alternative: Glättende Rekonstruktion zu einem lückenlosen Gebet
  rationale: Die Überlieferungslücken und editorischen Ergänzungen sind für die Aussagegrenzen theologisch wie textkritisch bedeutsam.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit direkter Anrede. Die Zeilenform des Gebets, alle eckigen Klammern und die Auslassungszeichen des bereitgestellten Zeugen bleiben erhalten. Da eine direkte koptische Quellenprüfung noch aussteht, ist die Fassung ausdrücklich vorläufig und folgt eng dem gemeinfreien englischen Textzeugen.
