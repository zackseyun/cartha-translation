translation:
  language: de
  text: '„Wer das Werk der Vollendung [nicht][a] kennt, weiß nichts.


    Wer nicht in der Finsternis steht, kann das […] Licht[b] nicht sehen.


    Wer [nicht versteht][c], wie das Feuer ins Dasein kam, wird darin verbrennen, ohne seinen Ursprung zu kennen.


    Wenn jemand nicht zuerst das Wasser versteht, weiß dieser Mensch nichts; denn was nützt es ihm, darin getauft zu werden?


    Wer nicht versteht, wie der wehende Wind ins Dasein kam, wird mit ihm fortgeweht.


    Wer nicht versteht, wie der Leib, den er trägt, ins Dasein kam, wird mit ihm zugrunde gehen.


    Und wie wird jemand, der den Sohn nicht kennt, den [Vater][d] kennen?


    Alles ist dem verborgen, der die Wurzel von allem nicht kennt.


    Wer die Wurzel des Unrechts nicht kennt, dem ist es nicht fremd.


    Die nicht verstehen, wie sie gekommen sind, werden nicht verstehen, wie sie gehen werden.


    Und diese Welt ist dem nicht fremd, der [sich selbst erhöhen][e] und infolgedessen erniedrigt werden wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „nicht“ ist im zugrunde gelegten Zeugnis ergänzt.
    reason: Kennzeichnet eine editorische Wiederherstellung bei beschädigter oder fehlender Textsubstanz.
  - marker: b
    text: Vor „Licht“ weist das Zeugnis eine nicht rekonstruierte Lücke auf.
    reason: Bewahrt die sichtbare Textlücke, ohne fehlende Wörter zu ergänzen.
  - marker: c
    text: „nicht versteht“ beruht teilweise auf einer Ergänzung; im Zeugnis ist „versteht“ rekonstruiert.
    reason: Macht die unsichere Textgrundlage der Formulierung kenntlich.
  - marker: d
    text: „Vater“ ist im zugrunde gelegten Zeugnis ergänzt.
    reason: Kennzeichnet die editorische Rekonstruktion trotz des naheliegenden Parallelismus mit „Sohn“.
  - marker: e
    text: „sich selbst erhöhen“ ist im zugrunde gelegten Zeugnis ergänzt.
    reason: Kennzeichnet die unsichere Wiederherstellung im abschließenden Satz.
lexical_decisions:
- source_word: deed of completeness
  choice: Werk der Vollendung
  rationale: Bewahrt sowohl den Handlungscharakter von „deed“ als auch die mögliche Bedeutung eines Zustands oder Vorgangs des Vollendetseins, ohne den Ausdruck dogmatisch festzulegen.
- source_word: came into existence
  choice: ins Dasein kam
  rationale: Eine natürliche, zugleich würdevolle Wiedergabe, die Entstehung bezeichnet, ohne ausdrücklich Schöpfung oder Zeugung zu behaupten.
- source_word: the blowing wind
  choice: der wehende Wind
  rationale: Erhält das konkrete Bewegungsbild des Zeugnisses und den Zusammenhang mit „fortgeweht“.
- source_word: the body he wears
  choice: der Leib, den er trägt
  rationale: Bewahrt die auffällige Kleidungsmetapher des Körpers, statt sie als bloßes Besitzen abzuschwächen.
- source_word: root of iniquity
  choice: Wurzel des Unrechts
  rationale: „Unrecht“ ist breit genug, um moralische Bosheit und schuldhaftes Handeln einzuschließen, ohne eine engere lehrmäßige Deutung aufzuzwingen.
- source_word: be no stranger to it
  choice: dem ist es nicht fremd
  rationale: Erhält die bewusst indirekte Formulierung und legt nicht fest, ob Zugehörigkeit, Vertrautheit oder Verstrickung gemeint ist.
theological_decisions:
- issue: „Vollendung“ als möglicherweise technisch-theologischer Begriff
  choice: Werk der Vollendung
  alternative: Tat der Vollkommenheit
  rationale: „Vollendung“ lässt offen, ob ein vollendender Vorgang, ein Zustand der Ganzheit oder eine religiöse Vollkommenheit gemeint ist; „Vollkommenheit“ würde die Aussage stärker festlegen.
- issue: Erkennen von Sohn und Vater
  choice: Die Erkenntnissprache bleibt als „kennen“ wiedergegeben.
  alternative: „verstehen“ oder „erkennen“ im erkenntnistheoretischen Sinn
  rationale: Der Satz kann persönliche Kenntnis und geistige Erkenntnis zugleich anklingen lassen; „kennen“ bewahrt diese Spannung und folgt dem Parallelismus.
- issue: Aussage über den Leib
  choice: „wird mit ihm zugrunde gehen“
  alternative: „wird zusammen mit ihm vernichtet werden“
  rationale: Die weniger technische Formulierung wahrt die Aussage über gemeinsames Verderben, ohne eine bestimmte Lehre über Leib und Seele einzutragen.
- issue: Letzter Satz über Selbsterhöhung und Erniedrigung
  choice: Die kausale Folge wird mit „infolgedessen“ sichtbar gemacht.
  alternative: Nur „und erniedrigt werden wird“
  rationale: Das englische Zeugnis kennzeichnet den Folgezusammenhang ausdrücklich als erläuternde Ergänzung; die Übersetzung erhält ihn, ohne festzulegen, wer die Erniedrigung bewirkt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, sentenzhaftem Stil. Die wiederkehrenden Formeln „Wer nicht versteht“ und „kennt“ wurden zur Wahrung der rhetorischen Struktur beibehalten. Die Handschriftenseitenangabe [15] wurde nicht in den Lesetext übernommen. Der Entwurf ist vorläufig, da er auf dem bereitgestellten gemeinfreien englischen Zeugnis beruht; eine direkte Prüfung des koptischen Textes steht noch aus.
