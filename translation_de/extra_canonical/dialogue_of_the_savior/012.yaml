  verdict: revise
  source_fidelity: Der Entwurf folgt dem vorliegenden englischen Zeugnis im Wesentlichen eng und bewahrt die textkritischen Signale in eckigen und spitzen Klammern überwiegend. Zwei ausdrücklich im Zeugen vorhandene Leerstellenzeichen („[]“) wurden jedoch ausgelassen. Außerdem ist die Antwort „Den Ort, an dem ich nicht wohne“ im Deutschen als bloßes Akkusativfragment weniger angemessen als die nominativische, weiterhin knappe Antwort „Der Ort, an dem ich nicht wohne.“
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. „sogar [wie ein verzehrendes Feuer] für diejenigen“ klingt syntaktisch holprig; eine Umstellung macht die Aussage verständlicher, ohne ihren lückenhaften Charakter oder die Ergänzung zu glätten.
  terminology: „Fülle“, „Mangel“, „Wahrheit“, „das, was einen Menschen belebt“, und „zur Ruhe kommen“ sind angemessen und lassen die begrifflichen bzw. theologischen Offenheiten des Zeugnisses bestehen. „Offenbarer“ bewahrt die substantivische Entsprechung zu „revealer“ und das Wortspiel mit „offenbarst“ besser als die Umschreibung.
  issues:
  - severity: medium
    issue: Leerstellenzeichen des Zeugnisses fehlen.
    rationale: Das englische Zeugnis enthält vor der Rede des Herrn sowie innerhalb von Marias Aussage jeweils „[]“. Da die Übersetzungsnotiz die Bewahrung solcher textkritischen Signale zusagt, müssen sie im deutschen Text stehen bleiben.
  - severity: low
    issue: Kasus in der knappen Antwort auf Marias Ortsfrage.
    rationale: „Den Ort, an dem ich nicht wohne“ ist zwar als elliptische Ergänzung denkbar, aber „Der Ort, an dem ich nicht wohne“ entspricht der prädikativen Antwort im Deutschen klarer und bleibt ebenso knapp.
  - severity: low
    issue: Unnatürliche Stellung von „sogar [wie ein verzehrendes Feuer] für diejenigen“.
    rationale: Die Umstellung auf eine Konstruktion mit „bei denen“ gibt die Wirkung auf die Nichtkennenden idiomatischer wieder. Die Lacuna und die ergänzten Wörter bleiben sichtbar.
