translation:
  language: de
  text: 'Die Jünger fragten ihn: »Was ist die Fülle, und was ist der Mangel?«


    Er antwortete ihnen: »Ihr seid aus der Fülle gekommen und wohnt am Ort des Mangels.


    Und seht, sein Licht hat sich auf mich ergossen.«


    Matthäus fragte: »Herr, sag mir: Wie sterben die Toten, und wie leben die Lebenden?«


    Der Herr sagte: »[Ihr habt] mich nach einem [wahren] Ausspruch gefragt, den kein Auge gesehen hat; und ihr seid die Einzigen, von denen ich ihn gehört habe. Ich aber sage euch: Wenn das, was einen Menschen belebt, weggenommen wird, wird er tot genannt; und wenn das Lebendige in das Tote <eintritt>, wird es lebendig genannt.«[a]


    Judas fragte: »Um die Wahrheit zu sagen: Warum <sterben> einige, während andere leben?«


    Der Herr sagte: »Alles, was aus der Wahrheit kommt, wird nicht sterben. Alles, was von einer Frau kommt, wird sterben.«[b]


    Maria fragte: »Sag mir, Herr: Warum bin ich an diesen Ort gekommen – um Gewinn zu haben oder um Verlust zu erleiden?«


    Der Herr antwortete: »Du offenbarst den Reichtum dessen, der offenbart.«[c]


    Maria fragte ihn: »Herr, gibt es demnach einen Ort, der von der Wahrheit verlassen ist oder an dem die Wahrheit fehlt?«[d]


    Der Herr sagte: »Den Ort, an dem ich nicht wohne.«


    Maria sagte: »Herr, du erweckst Furcht und Staunen, sogar [wie ein verzehrendes Feuer] für diejenigen, die [dich] nicht kennen.«[e]


    Matthäus fragte: »Warum kommen wir nicht sofort zur Ruhe?«


    Der Herr sagte: »Wenn ihr zurücklasst, was ihr nicht mitnehmen könnt, werdet ihr zur Ruhe kommen.«


    Matthäus fragte: »Wie stimmt das Kleine mit dem Großen überein?«


    Der Herr sagte: »Indem ihr diese Lasten zurücklasst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen ergänzten oder unsicher erhaltenen Text; die Winkelklammern kennzeichnen eine redaktionelle Wiederherstellung im zugrunde liegenden Zeugnis.
    reason: Die Handschrift ist an dieser Stelle beschädigt beziehungsweise wurde im veröffentlichten Zeugnis ergänzt.
  - marker: b
    text: 'Wörtlich steht hier eine spannungsreiche Gegenüberstellung: Was aus der Wahrheit kommt, stirbt nicht; was von einer Frau kommt, stirbt. Der Text erklärt diese Aussage nicht näher.'
    reason: Bewahrt die theologische und anthropologische Spannung, ohne sie konfessionell oder kosmologisch festzulegen.
  - marker: c
    text: 'Auch möglich: »Du offenbarst den Reichtum des Offenbarers.«'
    reason: Die Formulierung beruht auf einem Wortspiel zwischen Offenbaren und dem Offenbarenden, das im Deutschen unterschiedlich wiedergegeben werden kann.
  - marker: d
    text: Die Frage kann sowohl einen von der Wahrheit verlassenen Ort als auch einen Ort meinen, dem die Wahrheit fehlt.
    reason: Das zugrunde liegende englische Zeugnis bietet beide Verständnisweisen und die koptische Quellenprüfung steht noch aus.
  - marker: e
    text: Der Text ist an dieser Stelle lückenhaft. »wie ein verzehrendes Feuer« und »dich« sind ergänzte Lesungen des zugrunde liegenden Zeugnisses.
    reason: Kennzeichnet den unsicheren Erhaltungszustand und verhindert, dass Ergänzungen als vollständig gesicherter Wortlaut erscheinen.
lexical_decisions:
- source_word: fullness
  choice: Fülle
  rationale: Bewahrt den zentralen, möglicherweise kosmologisch oder theologisch gefüllten Begriff, ohne ihn auszudeuten.
- source_word: deficiency
  choice: Mangel
  rationale: Natürliches deutsches Gegenstück zu »Fülle«; lässt offen, ob ein Zustand, Bereich oder kosmologisches Prinzip gemeint ist.
- source_word: what animates a person
  choice: das, was einen Menschen belebt
  rationale: Vermeidet eine unbelegte Festlegung auf »Seele« oder »Geist« und erhält die funktionale Unbestimmtheit des Zeugnisses.
- source_word: rest
  choice: zur Ruhe kommen
  rationale: Gibt sowohl gewöhnliche Ruhe als auch einen möglichen eschatologischen oder geistlichen Sinn wieder.
- source_word: revealer
  choice: der offenbart
  rationale: Ist im Deutschen natürlicher als das substantivische »Offenbarer«, bewahrt aber die bewusste Wortverbindung mit »offenbarst«.
- source_word: harmonize
  choice: übereinstimmen
  rationale: Gibt die Beziehung zwischen dem Kleinen und dem Großen verständlich wieder, ohne eine spezielle kosmologische Deutung einzutragen.
theological_decisions:
- issue: Herkunft aus Wahrheit gegenüber Herkunft von einer Frau
  choice: Die schroffe Gegenüberstellung bleibt wörtlich und unerklärt stehen.
  alternative: Die Aussage als Gegensatz von geistlicher und leiblicher Geburt paraphrasieren.
  rationale: Der Text selbst löst die Spannung nicht auf; eine Paraphrase würde eine bestimmte anthropologische oder gnostische Deutung importieren.
- issue: Identität des Belebenden und des Lebendigen
  choice: Neutrale Umschreibungen statt »Seele« oder »Geist«.
  alternative: »Wenn die Seele/der Geist den Menschen verlässt ...«
  rationale: Das englische Zeugnis unterscheidet »what animates« und »what is alive«; die Übersetzung bewahrt diese Ambiguität.
- issue: Ruhe als Heilszustand
  choice: »zur Ruhe kommen« ohne weitere Erklärung.
  alternative: »Erlösung finden« oder »in die ewige Ruhe eingehen«.
  rationale: Der mögliche theologische Sinn wird offengehalten, aber nicht als sicher vorausgesetzt.
- issue: Ort ohne Wahrheit und Ort ohne Gegenwart des Herrn
  choice: Die Antwort bleibt knapp und grammatisch als Antwortfragment formuliert.
  alternative: »Es ist der Ort, an dem ich nicht wohne.«
  rationale: Die knappe Gestalt erhält den dialogischen Nachdruck und vermeidet eine systematische Gleichsetzung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Dialogstruktur. Die Übersetzung ist vorläufig, da keine direkte Prüfung des koptischen Textes vorliegt und der Entwurf auf dem angegebenen gemeinfreien englischen Zeugnis beruht. Eckige und spitze Klammern wurden als textkritische Signale erhalten; bloße Handschriftenseitenangaben wurden nicht übernommen.
