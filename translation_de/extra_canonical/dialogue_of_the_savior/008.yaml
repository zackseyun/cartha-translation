translation:
  language: de
  text: 'Judas antwortete: „Sag mir, Herr: Wie erschüttert das Beben eines [Erdbebens] die Erde?“


    Der Herr hob einen Stein auf und hielt ihn in seiner Hand. [Er sagte zu ihm: „Was] halte ich in meiner Hand?“


    Er antwortete: „[Es ist] ein Stein.“


    Er sagte zu ihnen: „Dasselbe, was die [Erde] trägt, trägt auch den Himmel. Wenn ein Wort von der Majestät ausgeht, wird es auf das treffen, was Himmel und Erde trägt. Die Erde wird sich nicht bewegen. Denn wenn sie sich bewegte, würde sie hinabfallen. Doch sie bewegt sich nicht, damit das erste Wort nicht hinfällig wird. Das Wort richtete die Welt auf, wohnte in ihr und roch ihren Duft. Euch allen, ihr Menschensöhne,[a] verkünde ich alles, was unbeweglich ist, denn ihr stammt von jenem Ort. Ihr lebt in den Herzen derer, die in Freude und Wahrheit sprechen. Wenn das Wort aus dem Leib des Vaters hervorgeht und unter die Menschen kommt, sie es aber nicht annehmen, wird es an seinen Ort zurückkehren.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugnis: „Söhne des Menschen“. Der ungewöhnliche Plural kann wegen der noch ausstehenden Prüfung des koptischen Textes nicht sicher beurteilt werden.'
    reason: Kennzeichnet eine sprachlich und möglicherweise textkritisch schwierige Form, ohne sie stillschweigend zu normalisieren.
lexical_decisions:
- source_word: '[earthquake] shaking'
  choice: das Beben eines [Erdbebens]
  rationale: Bewahrt die auffällige Wiederholung des Zeugnisses und kennzeichnet die ergänzte Lesart weiterhin durch eckige Klammern.
- source_word: Majesty
  choice: Majestät
  rationale: Gibt den personifiziert oder titular gebrauchten Ausdruck formal wieder, ohne seine theologische Referenz näher festzulegen.
- source_word: word
  choice: Wort
  rationale: Bewahrt die mögliche Spannung zwischen gesprochenem Ausspruch, schöpferischem Wort und hypostatischer Größe, ohne sie auszudeuten.
- source_word: supports
  choice: trägt
  rationale: Natürliches Deutsch für das kosmische Stützen oder Tragen, wobei die Identität dessen, was trägt, offenbleibt.
- source_word: set up the world
  choice: richtete die Welt auf
  rationale: Bewahrt das räumlich-kosmische Bild stärker als das interpretierendere „erschuf“.
- source_word: lived in it
  choice: wohnte in ihr
  rationale: „Wohnte“ ist im Deutschen idiomatisch und wahrt die Aussage eines Verweilens in der Welt.
- source_word: Sons of Man
  choice: Menschensöhne
  rationale: Formale Wiedergabe des ungewöhnlichen Plurals; eine Glättung zu „Menschen“ würde eine mögliche gruppenbezogene oder theologische Nuance beseitigen.
- source_word: Father’s body
  choice: Leib des Vaters
  rationale: Der konkrete und theologisch spannungsreiche Ausdruck wird nicht zu „Gegenwart“, „Wesen“ oder „Mund“ umgedeutet.
theological_decisions:
- issue: Status des „Wortes“
  choice: Durchgehend „das Wort“, ohne christologische Identifikation oder bloße Reduktion auf eine Äußerung
  alternative: „der Logos“ oder „ein Ausspruch“
  rationale: Das Zeugnis lässt offen, ob das Wort als Rede, kosmische Wirkmacht oder personale Größe verstanden wird.
- issue: Das kosmisch Tragende
  choice: „Dasselbe, was die Erde trägt, trägt auch den Himmel“
  alternative: Benennung Gottes oder einer bestimmten kosmologischen Substanz
  rationale: Das nicht ausdrücklich benannte Subjekt bleibt wie im Zeugnis unbestimmt.
- issue: „Menschensöhne“
  choice: Ungewöhnlichen Plural beibehalten und mit einer textkritischen Fußnote versehen
  alternative: „Menschen“ oder Anrede an einen einzelnen „Menschensohn“
  rationale: So wird keine bestimmte Anthropologie oder Titularchristologie in den beschädigten bzw. schwierigen Wortlaut eingetragen.
- issue: Rückkehr des Wortes
  choice: „wird es an seinen Ort zurückkehren“
  alternative: „kehrt es zum Vater zurück“
  rationale: Die räumliche und theologische Unbestimmtheit von „seinem Ort“ wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Eckige Klammern markieren weiterhin beschädigten oder redaktionell ergänzten Text; störende Handschriftenseitenangaben wurden nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, folgt der Entwurf vorsichtig dem angegebenen gemeinfreien englischen Zeugnis und vermeidet über dessen Evidenz hinausgehende Präzisierungen.
