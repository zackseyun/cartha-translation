base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: de
  text: '„Was euch selbst betrifft, bemüht euch mit allem Ernst, euch von [Zorn] und Eifersucht zu befreien. Legt eure [Werke] ab und tut nicht […]. […] […] Vorwurf […], denn ich sage [euch: …] Ihr werdet […] viel empfangen […] derjenige, der gesucht und [das wahre Leben entdeckt hat]. Dieser wird [zur Ruhe gelangen und] ewig leben. Ich sage [euch: Hütet euch], damit ihr [eure] Geister und eure Seelen nicht in die Irre führt.“[a]


    [Der Dialog] des Erlösers[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen ergänzten beziehungsweise rekonstruierten Text; Auslassungspunkte zeigen beschädigte oder fehlende Stellen der Handschrift an. Die Übersetzung ist vorläufig und beruht auf einem englischen gemeinfreien Textzeugen; eine unmittelbare Prüfung des koptischen Textes steht noch aus.
    reason: Die Überlieferung ist stark beschädigt, und der angegebene Arbeitsstand erlaubt keine sichere direkte Kontrolle am Koptischen.
  - marker: b
    text: Auch der Werktitel ist nur teilweise erhalten und daher in eckige Klammern gesetzt.
    reason: Der editorisch ergänzte Bestandteil des Titels muss sichtbar bleiben.
lexical_decisions:
- source_word: wrath
  choice: Zorn
  rationale: Die ergänzte Lesart wird in eckigen Klammern bewahrt; „Zorn“ ist die natürliche und würdevolle deutsche Entsprechung.
- source_word: jealousy
  choice: Eifersucht
  rationale: Gibt die im Zeugen bezeugte negative Gemütsregung direkt wieder, ohne sie zu „Neid“ umzudeuten.
- source_word: strip from yourselves
  choice: Legt … ab
  rationale: Natürliches modernes Deutsch, das die bildhafte Aufforderung des Zeugen erhält.
- source_word: works
  choice: Werke
  rationale: Bewahrt den theologisch offenen Begriff; wegen der Rekonstruktion steht er weiterhin in eckigen Klammern.
- source_word: true life
  choice: das wahre Leben
  rationale: Formnahe Wiedergabe, die den möglicherweise soteriologischen Sinn nicht weiter auslegt.
- source_word: achieve rest
  choice: zur Ruhe gelangen
  rationale: Idiomaticher als „Ruhe erreichen“ und offen dafür, ob Ruhe gegenwärtig, eschatologisch oder geistlich gemeint ist.
- source_word: spirits and souls
  choice: Geister und … Seelen
  rationale: Die beiden anthropologischen Begriffe bleiben getrennt und werden nicht harmonisiert.
- source_word: Savior
  choice: Erlöser
  rationale: „Erlöser“ ist im Deutschen als Titel geläufig und entspricht dem soteriologischen Titel des Werkes.
theological_decisions:
- issue: Bedeutung von „Werke“
  choice: Der Ausdruck bleibt unkommentiert als „[Werke]“ stehen.
  alternative: „Taten“, „böse Werke“ oder „weltliche Werke“
  rationale: Der beschädigte Kontext erlaubt keine sichere moralische oder lehrmäßige Präzisierung.
- issue: Art der verheißenen Ruhe
  choice: „[zur Ruhe gelangen und] ewig leben“
  alternative: „[Erlösung finden und] ewig leben“
  rationale: „Ruhe“ wird nicht als bestimmtes Erlösungsschema ausgelegt, sondern in ihrer theologischen Spannung bewahrt.
- issue: Verhältnis von Geist und Seele
  choice: Plural „Geister“ neben „Seelen“ wird erhalten.
  alternative: Zusammenfassung als „euer Inneres“ oder Singular „Geist und Seele“
  rationale: Die auffällige Unterscheidung des Zeugen soll nicht anthropologisch harmonisiert werden.
- issue: Handelndes Subjekt in der beschädigten Sucher-Aussage
  choice: „derjenige, der gesucht und [das wahre Leben entdeckt hat]“ bleibt als fragmentarischer Satzteil erhalten.
  alternative: Glättung zu „Wer sucht und das wahre Leben entdeckt, wird …“
  rationale: Eine Glättung würde die beschädigte Syntax und mögliche verlorene Satzbezüge verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beschädigte Syntax wird nur so weit geglättet, wie es für die Lesbarkeit nötig ist; Klammern, Lücken und echte Mehrdeutigkeiten bleiben sichtbar. Da eine direkte koptische Quellenprüfung noch aussteht, ist der Entwurf ausdrücklich vorläufig.
