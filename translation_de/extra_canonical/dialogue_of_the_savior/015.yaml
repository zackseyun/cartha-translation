  - severity: low
    issue: Interpunktion und Großschreibung innerhalb der beschädigten Rede leicht glättend
    rationale: '„[euch: …] Ihr“ fügt einen Doppelpunkt innerhalb der Ergänzung ein und behandelt den folgenden Satz als neuen direkten Redeabschnitt. „[euch, …], ihr“ hält sich enger an die bruchstückhafte Satzfortsetzung des Zeugen.'
