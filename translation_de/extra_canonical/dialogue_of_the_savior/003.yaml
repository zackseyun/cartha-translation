translation:
  language: de
  text: '„Ich werde euch lehren, wann die Zeit der Vernichtung kommt.[a] Die erste Macht der Finsternis wird euch einholen; fürchtet euch nicht[b] und sagt auch nicht: ‚Seht, die Zeit ist gekommen.‘[c] Wenn ihr aber einen einzelnen Stab seht […].[d] Erkennt, dass […] von dem Werk […] und die Archonten […] euch einholen […]. Die Furcht ist die eigentliche Macht [der Finsternis]. Wenn ihr euch also vor dem fürchtet, was euch bald einholen wird, wird es euch überwältigen; und kein Einziger von ihnen wird euch freilassen oder Erbarmen mit euch haben. Blickt stattdessen auf das, [was] in euch ist,[e] denn ihr habt alles Irdische überwunden. Dies […] [wird] euch hinaufführen an einen [Ort] ohne Herrschaft [und ohne] Tyrannen. Wenn ihr […] werdet ihr jene […] sehen, und auch ihr werdet [sie hören. Ich] sage euch: Die Vernunft […]. Die Vernunft ist [… wo] die Wahrheit [ist]. Sie aber […] und ihr […] die Wahrheit. Dies [ist … im Innern] des lebendigen [Geistes]. Daher […] und eure Freude […], damit
    […] eure Seelen […], damit das Wort nicht […] was sie aufgerichtet hatten […] und sie konnten es nicht [verstehen] […]. Macht das, was [in] euch ist, und das, was [außerhalb] von euch ist, zu ein und demselben.[f]


    Der […] Ort des Übergangs erscheint [euch] gewiss furchterregend; doch zögert nicht, ihn zu durchschreiten. Groß ist seine Tiefe, gewaltig [ist] seine Höhe! [Seid eines Sinnes …], und das Feuer […] Tautropfen […] alle Mächte […] euch. Sie werden […], und [alle] Mächte […] sie […] zuvor. Ich sage [euch]: […] die Seele […] wird […] werden in ihnen allen […] ihr seid […] und dass […] schlaft nicht […] die Söhne […] und ihr […] ihr […].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Text ist stark beschädigt. Die Übersetzung beruht vorläufig auf dem angegebenen englischen Zeugen; eine unmittelbare Prüfung des koptischen Manuskripts steht noch aus.
    reason: Macht die begrenzte Quellenbasis und den vorläufigen Charakter transparent.
  - marker: b
    text: Das „euch“ kann im Deutschen sowohl mehrere Angesprochene als auch eine gemeinschaftlich gedachte Hörerschaft bezeichnen.
    reason: Bewahrt den pluralischen Adressatenbezug des Zeugen.
  - marker: c
    text: Ob „die Zeit“ hier den angekündigten Zeitpunkt der Vernichtung oder einen umfassenderen endzeitlichen Zeitpunkt bezeichnet, bleibt offen.
    reason: Vermeidet eine vorschnelle eschatologische Festlegung.
  - marker: d
    text: Das Bild vom „einzelnen Stab“ ist wegen der unmittelbar anschließenden Textlücke nicht sicher zu deuten.
    reason: Kennzeichnet eine echte bildliche und textkritische Unklarheit.
  - marker: e
    text: „Was in euch ist“ bezeichnet etwas Inneres, dessen genaue Bedeutung der erhaltene Zusammenhang nicht erkennen lässt.
    reason: Verhindert eine unbelegte Gleichsetzung etwa mit Seele, Geist oder göttlichem Funken.
  - marker: f
    text: Die Formulierung fordert wörtlich eine Einheit von Innerem und Äußerem; wie diese Einheit zu verstehen ist, erklärt der erhaltene Text nicht.
    reason: Bewahrt die theologische und anthropologische Spannung der Aussage.
lexical_decisions:
- source_word: destruction
  choice: Vernichtung
  rationale: Gibt die im englischen Zeugen bezeichnete zerstörerische Endzeitvorstellung nüchtern wieder, ohne sie vorschnell als „Weltuntergang“ auszulegen.
- source_word: power
  choice: Macht
  rationale: Bewahrt sowohl den Sinn einer wirksamen Gewalt als auch den möglichen Bezug auf überirdische Mächte.
- source_word: archons
  choice: Archonten
  rationale: Der religionsgeschichtlich geprägte Titel bleibt als Fremdwort erhalten, da „Herrscher“ die mögliche kosmische Bedeutung verengen könnte.
- source_word: logic
  choice: Vernunft
  rationale: Natürliches modernes Deutsch für den im Zeugen überlieferten abstrakten Ausdruck; wegen des ausstehenden koptischen Abgleichs wird keine Gleichsetzung mit „Logos“ vorgenommen.
- source_word: living mind
  choice: lebendiger Geist
  rationale: Bewahrt die geistig-mentale Bedeutung und die ungewöhnliche Formulierung, ohne eine bestimmte Anthropologie festzuschreiben.
- source_word: crossing place
  choice: Ort des Übergangs
  rationale: Gibt das räumliche Bild verständlich wieder und lässt offen, ob ein kosmischer, geistiger oder eschatologischer Übergang gemeint ist.
theological_decisions:
- issue: Furcht als Macht der Finsternis
  choice: „Die Furcht ist die eigentliche Macht [der Finsternis]“
  alternative: „Furcht verleiht der Finsternis Macht“
  rationale: Die Identifikation des Zeugen wird nicht in eine bloße psychologische Erklärung umgedeutet; die ergänzten Wörter bleiben gekennzeichnet.
- issue: Inneres und Äußeres
  choice: „zu ein und demselben“
  alternative: „in Einklang miteinander“
  rationale: Die starke Aussage über die Einheit von Innerem und Äußerem bleibt bestehen, statt harmonisierend abgeschwächt zu werden.
- issue: Überwindung alles Irdischen
  choice: „alles Irdische überwunden“
  alternative: „über alles Irdische geherrscht“
  rationale: „Überwunden“ passt im Zusammenhang des Aufstiegs natürlich, ohne daraus eine konfessionell bestimmte Lehre von Weltverachtung abzuleiten.
- issue: Ort ohne Herrschaft und Tyrannen
  choice: Wortlautnahe negative Beschreibung
  alternative: „Ort der Freiheit“
  rationale: Die fremdartige Spannung des Textes bleibt erhalten; eine positive eschatologische Deutung wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit pluralischer Anrede. Eckige Klammern kennzeichnen im Zeugen ergänzten oder unsicher wiederhergestellten Text; […] kennzeichnet Textverlust. Ungewöhnliche Bilder und abgebrochene Satzfolgen wurden nicht geglättet. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich als vorläufiger, quellenbewusster Publikationsentwurf zu behandeln.
