translation:
  language: de
  text: 'Der Retter sagte zu seinen Jüngern: „Brüder, nun ist die Zeit für uns gekommen, unsere Arbeit zu beenden und zur Ruhe zu kommen; denn wer zur Ruhe kommt, wird für immer ruhen. Ich sage euch: Übersteigt stets […] die Zeitlichkeit […]. [Ich sage] euch: […] fürchtet [nicht diejenigen, die …] euch. Ich [sage euch]: Der Zorn ist furchterregend, [und wer] Zorn hervorruft, ist ein [furchterregender Mensch]. Weil ihr jedoch [leiden konntet], könnte er aus [euch …] hervorkommen.


    „Die Menschen haben diese Worte über den Zorn mit Furcht und Zittern angenommen. Der Zorn setzte Herrscher[a] über sie ein, denn niemand kann dem Zorn entgehen. Als ich jedoch kam, öffnete ich einen Pfad und unterwies die Menschen über den Weg des Hinübergehens für die Erwählten und die Alleinstehenden[b], […], die den Vater erkannt haben und der Wahrheit treu gewesen sind; und ihr brachtet Lobpreis dar.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. als Fachbegriff auch: „Archonten“. In manchen antiken religiösen Texten bezeichnet das Wort kosmische Herrschermächte; hier bleibt die genaue Bedeutung offen.'
    reason: Der Ausdruck kann sowohl gewöhnliche Herrscher als auch überweltliche Mächte bezeichnen.
  - marker: b
    text: „Alleinstehende“ kann Menschen bezeichnen, die allein, ungeteilt oder abgesondert leben; möglicherweise handelt es sich um einen geistlichen Fachausdruck.
    reason: Die mögliche technische Bedeutung von „solitary“ soll nicht vorschnell auf eine bestimmte Lebensform festgelegt werden.
lexical_decisions:
- source_word: Savior
  choice: Retter
  rationale: Natürliches, würdevolles Standarddeutsch; vermeidet eine unnötige konfessionelle Einengung.
- source_word: stand at rest / rest
  choice: zur Ruhe kommen / ruhen
  rationale: Bewahrt die wiederholte Ruhe-Terminologie und den möglichen geistlichen Sinn, ohne ihn näher festzulegen.
- source_word: transcend
  choice: übersteigt
  rationale: Gibt die Bewegung des Überschreitens wieder und wahrt die ungewöhnliche, möglicherweise technische Ausdrucksweise.
- source_word: temporality
  choice: Zeitlichkeit
  rationale: Bewahrt den abstrakten Sinn des Zeithaften; wegen der beschädigten Umgebung wird keine glättende Deutung eingeführt.
- source_word: anger
  choice: Zorn
  rationale: Die konsequente Wiederholung erhält die Personifizierung und die gedankliche Spannung des Zeugnisses.
- source_word: archons
  choice: Herrscher
  rationale: Übersetzt den griechisch-koptischen Fachausdruck in verständliches Deutsch; eine Fußnote nennt die mögliche technische Bedeutung.
- source_word: crossing over
  choice: Hinübergehen
  rationale: Erhält die räumliche Metapher und lässt deren soteriologische oder kosmologische Bedeutung offen.
- source_word: elect and solitary
  choice: Erwählten und Alleinstehenden
  rationale: Bewahrt beide Gruppenbezeichnungen, ohne ‚solitary‘ vorschnell als Mönche, Asketen oder unverheiratete Menschen zu deuten.
- source_word: offered up praise
  choice: brachtet Lobpreis dar
  rationale: Entspricht dem kultisch gefärbten Ausdruck und erhält den Wechsel zur direkten Anrede.
theological_decisions:
- issue: Personifizierung des Zorns
  choice: „Der Zorn setzte Herrscher über sie ein“
  alternative: „Wegen des Zorns wurden Herrscher über sie eingesetzt“
  rationale: Die aktive, auffällige Formulierung des Zeugnisses bleibt erhalten; die Beziehung zwischen Zorn und Herrschern wird nicht harmonisiert.
- issue: Bedeutung der Ruhe
  choice: „zur Ruhe kommen … für immer ruhen“
  alternative: „innehalten … ewige Ruhe finden“
  rationale: Die lexikalische Wiederholung wird gewahrt, ohne Ruhe eindeutig als Tod, Erlösung oder kontemplativen Zustand auszulegen.
- issue: Identität der ‚Alleinstehenden‘
  choice: Wörtlich-offene Wiedergabe mit Fußnote
  alternative: „Mönche“, „Einsiedler“ oder „Unverheiratete“
  rationale: Der Ausdruck kann in frühchristlichen Texten technisch oder geistlich gebraucht sein; die vorliegende Grundlage erlaubt keine sichere Festlegung.
- issue: Subjekt von „might come forth“
  choice: „könnte er aus [euch …] hervorkommen“
  alternative: „könnte es aus [euch …] hervorkommen“
  rationale: Der Zusammenhang legt als mögliches Bezugswort den Zorn nahe, doch der beschädigte Text macht die Syntax unsicher. Die Formulierung bleibt deshalb modal und die Lücke sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrten Wiederholungen und Metaphern. Eckige Klammern und Auslassungspunkte kennzeichnen entsprechend dem überlieferten englischen Zeugen beschädigten oder ergänzten Text. Die leeren Klammern des Zeugnisses wurden als sichtbare Lücke „[…]“ wiedergegeben. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und folgt der bereitgestellten gemeinfreien englischen Übersetzung als Quellenzeugnis.
