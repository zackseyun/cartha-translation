translation:
  language: de
  text: 'Seine Jünger [sagten: »Herr], wer ist es, der sucht, und [wer] ist es, der offenbart?«


    [Der Herr] sagte [zu ihnen]: »Derjenige, der sucht, ist [derselbe], der offenbart.«


    Matthäus [sagte erneut zu ihm: »Herr], wenn ich [dir zuhöre] und wenn ich spreche: Wer ist es, der [spricht, und] wer ist es, der zuhört?«


    Der [Herr] sagte: »Derjenige, der spricht, ist derselbe, der [zuhört], und wer sehen kann, ist derselbe, der offenbart.«


    Maria sagte: »Herr, sieh: [Während ich] einen Körper trage, woher fließen meine Tränen, und woher kommt mein Lachen?«


    Der Herr sagte: »[Es ist der Körper, der] wegen seiner Taten weint [und wegen] der Taten, die noch zu tun bleiben. Es ist der Verstand, der [wegen der Früchte] des Geistes lacht.[a] Wer nicht in der Finsternis [steht], wird [un]fähig sein, [das Licht] zu sehen.[b]


    Ich sage euch: [Was ohne] das Licht ist, ist die Finsternis, [und wer nicht] in der [Finsternis] steht, wird [un]fähig sein, das Licht zu sehen.[b] Doch [die Söhne] der Täuschung wurden herausgenommen […]. Ihr werdet das Licht anziehen und [so für immer leben] […]. [Wenn …], dann wird [jede] Macht oben und unten euch grausam behandeln. An jenem Ort [wird] Weinen und [Zähneknirschen] sein über das Ende von [allem].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Ergänzung »wegen der Früchte« steht in einer beschädigten Stelle; die genaue Wortfolge ist unsicher.
    reason: Kennzeichnet eine besonders verschachtelte und beschädigte Rekonstruktion im zugrunde liegenden englischen Zeugen.
  - marker: b
    text: Die Aussage ist in dieser Gestalt paradox und möglicherweise durch Textverlust oder unsichere Ergänzungen beeinträchtigt. Sie wird hier nicht zu einer logisch glatteren Lesart berichtigt.
    reason: Bewahrt echte textliche Unsicherheit und verhindert eine unbelegte Emendation.
lexical_decisions:
- source_word: reveals
  choice: offenbart
  rationale: Bewahrt den religiös-erkenntnisbezogenen Sinn und die wiederholte Verknüpfung von Suchen, Sehen und Offenbaren.
- source_word: mind
  choice: Verstand
  rationale: Gibt die im englischen Zeugen gebotene Unterscheidung zwischen Körper, mind und Geist wieder, ohne diese Größen theologisch gleichzusetzen.
- source_word: spirit
  choice: Geist
  rationale: Die offene Bedeutung des Ausdrucks bleibt erhalten; weder menschlicher noch göttlicher Geist wird ausdrücklich festgelegt.
- source_word: wearing a body
  choice: einen Körper trage
  rationale: Bewahrt die auffällige Bekleidungsmetapher des Zeugen, ohne sie zu glätten.
- source_word: sons of deceit
  choice: Söhne der Täuschung
  rationale: Formnahe Wiedergabe der semitisch anmutenden Gruppenbezeichnung; eine auslegende Umschreibung wie »Betrüger« würde das Bild beseitigen.
- source_word: put on the light
  choice: das Licht anziehen
  rationale: Erhält die Bekleidungsmetapher und ihre Verbindung zu Marias Aussage über das Tragen eines Körpers.
- source_word: powers
  choice: Macht
  rationale: Der Singular innerhalb der distributiven Konstruktion »jede Macht« bewahrt die mögliche kosmische Bedeutung, ohne eine bestimmte Angelologie festzulegen.
theological_decisions:
- issue: Identität von Suchendem und Offenbarendem sowie von Sprechendem und Hörendem
  choice: Die Identitätsaussagen werden wörtlich und ohne Erklärung wiedergegeben.
  alternative: Die Aussagen als innere Einheit eines Menschen oder als mystische Einheit mit dem Herrn auslegen.
  rationale: Der beschädigte Text lässt die genaue anthropologische oder mystische Aussage offen.
- issue: Körper, Verstand und Geist
  choice: Die drei Begriffe bleiben voneinander unterschieden.
  alternative: »Verstand« und »Geist« angleichen oder den Geist ausdrücklich als Heiligen Geist bestimmen.
  rationale: Eine solche Festlegung wäre durch den vorliegenden Zeugen nicht hinreichend gedeckt.
- issue: Paradoxe Aussage über Finsternis und Licht
  choice: Das überlieferte beziehungsweise rekonstruierte »nicht« und »unfähig« bleibt sichtbar erhalten.
  alternative: Die Aussage zu »Wer in der Finsternis steht, kann das Licht nicht sehen« emendieren.
  rationale: Die vorliegende Fassung ist schwierig und möglicherweise textlich gestört; die Übersetzung darf die Spannung nicht stillschweigend auflösen.
- issue: Eschatologisches Ende
  choice: »das Ende von [allem]«
  alternative: »das Ende aller Dinge« oder »ihr aller Ende«
  rationale: Die Ergänzung bleibt als unsichere Rekonstruktion markiert und wird nicht präziser gefasst, als der Zeuge erlaubt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst formnahen Wiederholungen. Eckige Klammern und Auslassungszeichen bewahren die im gelieferten Zeugen angezeigten Ergänzungen und Lücken. Der Entwurf ist vorläufig, da eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex III,5 noch aussteht.
