  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. »Sieh« ist als formnahes Gegenstück zu »behold« möglich; die Wiederholungen mit »derselbe« sind verständlich und textnah.
  terminology: »offenbart«, »Verstand«, »Geist«, »Söhne der Täuschung«, »das Licht anziehen« und »jede Macht« sind angemessen und legen keine weitergehende theologische Interpretation fest.
