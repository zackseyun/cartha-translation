translation:
  language: de
  text: 'Maria fragte ihre Brüder: „Wo werdet ihr [diese] Fragen bewahren, die ihr dem Menschensohn stellt?“


    Der Herr [sagte] zu ihr: „Schwester, [niemand] kann nach diesen Dingen fragen [außer] einem, der im Herzen einen Ort besitzt, [] um sie dort zu bewahren. Ein solcher Mensch kann [die Welt] verlassen und an den Ort [des Lebens] gelangen; er wird nicht in dieser Welt der Armut festgehalten werden.“


    Matthäus sagte: „Herr, ich möchte jenen Ort des Lebens [schauen], [wo] es kein Unrecht gibt, sondern nur reines [Licht].“


    Der Herr antwortete: „Bruder Matthäus, du kannst ihn nicht sehen, [solange du] das Fleisch trägst.“


    Matthäus sagte: „Herr, [wenn ich] ihn nicht sehen kann, dann lass mich ihn wenigstens erkennen.“


    Der Herr sagte: „Jeder, der sich selbst erkannt hat, hat ihn gesehen. Alles, was ihm zu tun gegeben wird, tut er. Ein solcher Mensch ist daher in seiner Güte [wie] jener Ort geworden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des koptischen Textes steht noch aus. Eckige Klammern kennzeichnen beschädigten Text oder editorische Ergänzungen; die leeren Klammern [] geben eine nicht ergänzte Lücke wieder. Der letzte Satz ist grammatisch und textlich unsicher und kann auch enger als „Ein solcher ist so in Güte jenem Ort gleich geworden“ verstanden werden.
    reason: Die Quellenangabe erklärt ausdrücklich die indirekte Übersetzungsgrundlage, die Zeichen für Textschäden und die echte Unsicherheit der Schlussaussage.
lexical_decisions:
- source_word: store
  choice: bewahren
  rationale: „Bewahren“ passt sowohl zu den Fragen als auch zu ihrem Ort im Herzen und klingt im Deutschen natürlicher und würdiger als das räumlich-technische „lagern“.
- source_word: place of life
  choice: Ort des Lebens
  rationale: Die wiederkehrende, möglicherweise technische Wendung wird formal und durchgehend gleich wiedergegeben.
- source_word: world of poverty
  choice: Welt der Armut
  rationale: Die konkrete Metapher bleibt erhalten; eine Deutung als geistliche Bedürftigkeit würde die Spannung des Textes voreilig auflösen.
- source_word: iniquity
  choice: Unrecht
  rationale: „Unrecht“ ist gegenwärtiges Standarddeutsch und lässt offen, ob moralische Bosheit, Rechtswidrigkeit oder ein umfassender mangelhafter Zustand gemeint ist.
- source_word: wear the flesh
  choice: das Fleisch tragen
  rationale: Die ungewöhnliche Körpermetapher wird bewahrt, statt sie erklärend zu „im Körper leben“ abzuschwächen.
- source_word: known himself
  choice: sich selbst erkannt
  rationale: Die Erkenntnissprache und ihre mögliche soteriologische Bedeutung bleiben ohne konfessionelle Auslegung erhalten.
- source_word: come to be like that place in goodness
  choice: in seiner Güte [wie] jener Ort geworden
  rationale: Die beschädigte beziehungsweise ergänzte Vergleichsform und die Mehrdeutigkeit der Zuordnung von „Güte“ werden möglichst eng bewahrt.
theological_decisions:
- issue: Selbsterkenntnis und Schau des Ortes des Lebens
  choice: „Jeder, der sich selbst erkannt hat, hat ihn gesehen.“
  alternative: „Wer sein wahres Selbst erkannt hat, hat den Ort des Lebens gesehen.“
  rationale: Die Übersetzung fügt weder ein „wahres“ Selbst noch eine bestimmte Erlösungslehre ein und erhält die knappe Gleichsetzung des Zeugnisses.
- issue: Verhältnis von Fleisch und geistlicher Schau
  choice: „solange du das Fleisch trägst“
  alternative: „solange du in einem sterblichen Körper lebst“
  rationale: Die bildhafte und theologisch spannungsreiche Formulierung wird nicht als bloße Sterblichkeit ausgelegt.
- issue: Der „Ort im Herzen“
  choice: als Ort zum Bewahren der Fragen wiedergegeben
  alternative: als innere Erkenntnisfähigkeit paraphrasiert
  rationale: Die räumliche Metapher bleibt stehen; ihre anthropologische oder mystische Bedeutung wird nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Dialogstruktur. Wiederkehrende Leitbegriffe wie „Ort“, „Leben“, „Herz“, „Fleisch“, „erkennen“ und „Güte“ wurden bewusst beibehalten. Rekonstruktionen des beschädigten Manuskripts stehen in eckigen Klammern; keine zusätzliche Ergänzung wurde stillschweigend eingeführt.
