translation:
  language: de
  text: '**Dialog des Erlösers — Schöpfung und Beschneidung**[a]


    Judas fragte: »Sag [uns], Herr, was [existierte], bevor [Himmel und] Erde entstanden waren?«


    Der Herr sagte: »Da waren Finsternis und Wasser, und [] ein Geist war über dem [Wasser]. Und ich sage euch [die Wahrheit]: Seht, was ihr sucht und wonach ihr fragt, ist in euch, und es [besitzt] die Kraft und das Geheimnis des Geistes, weil es [aus dem Geist hervorgeht]. Die Ungerechtigkeit drang ein, [um] den Verstand [fortwährend zu zerstören]. Seht, […].«


    [Matthäus] sagte: »Herr, sag uns: Wo ist [die Seele] aufgerichtet, und wo wohnt der wahre [Verstand]?«


    Der Herr [sagte]: »Das Feuer des Geistes entstand [zwischen] diesen beiden; so entstand auch [Geist] und in ihnen der wahre Verstand. [Wenn] jemand die Seele in der Höhe aufrichtet, dann [wird] sie erhöht werden.«


    Matthäus fragte ihn: [] »[Ist die Beschneidung nicht notwendig], wenn man sie [der wahren Deutung entsprechend] versteht?«


    Der Herr [sagte: »Die Beschneidung ist] nützlicher als euer [Werk. Entfernt] aus euch, [was] euch verfolgen [kann], ja alles [in] euren Herzen. Denn so, wie eure Herzen [beschnitten sind], [werdet ihr] einen Weg finden, die Mächte oben und unten zu überwinden.[b] Und ich sage euch: Wer [Macht besitzt], soll auf sie verzichten [und] umkehren; und wer [versteht], soll suchen und finden und sich freuen.«


    Judas sagte: »Seht, [ich] erkenne, dass alles [genau] wie ein Zeichen über [der Erde] ist und dass es deshalb auf diese Weise entstanden ist.«


    Der Herr [sagte]: »Als der Vater die Welt aufrichtete, [sammelte] er etwas von ihrem Wasser, und das Wort ging daraus hervor. [] Es erlitt viel [Bedrängnis], doch es war höher als die Bahn [der Sterne], die die ganze Erde umgibt.


    [Er fuhr fort]: »Das Wasser, das [oben] gesammelt ist, befindet sich jenseits der Sterne; und [jenseits] des Wassers <ist> ein gewaltiges Flammenmeer, das sie wie eine Mauer umgibt. Sobald mehrere der inneren Wesenheiten sich von den übrigen getrennt hatten, [begann man], Zeiträume zu berechnen.


    »Als das [Ganze] aufgerichtet worden war, blickte er nach [unten] — der Vater, der zu ihm sagte: ›Geh, [lass etwas] aus dir hervorgehen, damit es [der Erde] von Generation zu [Generation und] von Zeitalter zu Zeitalter an nichts fehlt.‹


    »Da ließ [es] aus sich Quellen von Milch, Quellen von Honig, Öl und Wein hervorgehen, dazu gute Früchte, köstliche Aromen und heilsame Wurzeln, [damit] es der Erde von Generation [zu] Generation und von Zeitalter zu Zeitalter an nichts fehlt.


    »Es ist über […], [] stand [da und zeigte] seine Schönheit […]. Und außerhalb [war ein großes Licht], heller [als] das ihm ähnliche, denn jenes herrscht über [alle] Äonen oben und unten.[c] [Licht wurde] aus dem Feuer herausgenommen und am [Firmament] oben und unten ausgestreut. Diejenigen über dem Himmel oben und über der Erde unten hängen an ihnen. Alles hängt an ihnen.«


    Als Judas dies gehört hatte, warf er sich nieder, fiel auf die Knie und pries den Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige deutsche Fassung nach dem angegebenen gemeinfreien englischen Übersetzungszeugen des koptischen Textes aus Nag-Hammadi-Codex III,5; eine unmittelbare Prüfung am Koptischen steht noch aus. Eckige Klammern kennzeichnen ergänzten oder unsicher wiederhergestellten Text; [] und […] zeigen Lücken an, spitze Klammern eine editorische Ergänzung.
    reason: Macht Überlieferungszustand und vorläufige Quellengrundlage transparent.
  - marker: b
    text: Der Abschnitt über die Beschneidung ist stark beschädigt. Insbesondere die Verbindung zwischen »nützlicher als euer Werk«, dem Entfernen des Verfolgenden und der Beschneidung der Herzen bleibt unsicher.
    reason: Warnt vor einer scheinbar eindeutigen theologischen Auslegung eines fragmentarischen Satzgangs.
  - marker: c
    text: »Äonen« kann hier Zeitalter, kosmische Bereiche oder überweltliche Wirklichkeiten bezeichnen.
    reason: Erhält das Bedeutungsspektrum des antiken kosmologischen Begriffs.
lexical_decisions:
- source_word: spirit
  choice: Geist
  rationale: Bewahrt die Mehrdeutigkeit zwischen kosmischem Geist, geistiger Wirklichkeit und möglichem personalem Bezug, ohne sie konfessionell festzulegen.
- source_word: mind / true mind
  choice: Verstand / wahrer Verstand
  rationale: Gibt die Erkenntnisfähigkeit natürlich und würdig wieder; die mögliche fachsprachliche Bedeutung eines antiken Nous-Begriffs wird nicht durch eine spekulative Präzisierung vorweggenommen.
- source_word: secrecy
  choice: Geheimnis
  rationale: Passt zum inneren, verborgenen Charakter des Geistes; die Alternative »Verborgenheit« wäre ebenfalls möglich, klingt hier jedoch abstrakter.
- source_word: iniquity
  choice: Ungerechtigkeit
  rationale: Bewahrt den moralisch-theologischen Gehalt, ohne auf das engere »Gesetzlosigkeit« festzulegen, solange die koptische Lesart nicht direkt geprüft ist.
- source_word: powers
  choice: Mächte
  rationale: Lässt offen, ob kosmische, geistige oder herrschaftliche Kräfte gemeint sind.
- source_word: aeons
  choice: Äonen
  rationale: Behält den antiken kosmologischen Fachbegriff bei, da »Zeitalter« an dieser Stelle die mögliche Bedeutung als überweltliche Bereiche oder Wesen verengen würde.
- source_word: inferno
  choice: Flammenmeer
  rationale: Vermittelt ein großes, umschließendes Feuer natürlicher als »Inferno«, ohne es ausdrücklich als Hölle zu deuten.
- source_word: firmament
  choice: Firmament
  rationale: Bewahrt die kosmologische Bildwelt des Textes und vermeidet eine moderne naturwissenschaftliche Umdeutung.
theological_decisions:
- issue: Innerlichkeit des Gesuchten
  choice: »was ihr sucht … ist in euch«
  alternative: »ist in eurem Inneren«
  rationale: Die direkte Formulierung erhält die Spannung zwischen innerer Erkenntnis, Geistursprung und kosmologischer Lehre, ohne daraus eine abgeschlossene Heilslehre zu formen.
- issue: Beschneidung
  choice: Körperliche und innere Beschneidung werden in ihrer spannungsvollen Gegenüberstellung belassen.
  alternative: Die Aussage ausschließlich als »Beschneidung des Herzens« paraphrasieren.
  rationale: Der beschädigte Text scheint die Frage nach Beschneidung aufzunehmen und auf das Herz zu beziehen; eine rein symbolische Auflösung würde mehr entscheiden, als der Zeuge sicher hergibt.
- issue: Verzicht auf Macht
  choice: »Wer Macht besitzt, soll auf sie verzichten«
  alternative: »Wer Macht hat, soll sie verleugnen«
  rationale: »Verzichten« ist verständlich und wahrt den ethischen Anspruch, ohne eine ontologische Verneinung von Macht hineinzulesen.
- issue: Kosmologische Wesenheiten und Pronomina
  choice: Unklare Bezüge wie »es«, »ihm« und »ihnen« bleiben erhalten.
  alternative: Die Bezugswörter als Welt, Wasser, Licht oder Sterne ausdrücklich identifizieren.
  rationale: Der fragmentarische Zeuge erlaubt keine sichere Identifikation; eine Glättung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der dialogische Ton und die kosmologische Bildsprache bleiben erhalten. Fragmentarische Stellen wurden nicht frei geglättet; Ergänzungen, Lücken und unsichere Bezüge sind sichtbar. Die Anrede wechselt quellengemäß zwischen Singular in Fragen an den Herrn und Plural in seinen Worten an die Jünger.
