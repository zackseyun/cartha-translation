  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen im Wesentlichen zuverlässig und bewahrt die markierten Rekonstruktionen sowie die auffällige Aussage des Herrn. Eine sichere Korrektur ist jedoch nötig: Die im Zeugen ausdrücklich leere Klammerfolge „[]“ darf nicht zu „[—]“ umgestaltet werden, weil dies ein zusätzliches editorisches Zeichen einführt. Einige Formulierungen können zudem näher am Zeugen und zugleich natürlicher gestaltet werden.'
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. „unter dem, was bleiben wird, existiert“ bleibt wegen der unsicheren und verschachtelten Vorlage sperrig, sollte aber syntaktisch lesbarer gefasst werden, ohne den Bezug zu klären. „Nahrung“ ist hier weniger idiomatisch als „Essen“.
  terminology: „Mangel“, „Archonten“, „Brautkammer“ und „Gewänder des Lebens“ sind angemessen und theologisch nicht voreingenommen. „Eifersucht“ bewahrt die engere Bedeutung von „jealousy“ besser als eine interpretierende Ausweitung zu „Neid“.
  issues:
  - severity: medium
    issue: Die leere Klammer „[]“ wurde zu „[—]“ erweitert.
    rationale: Der englische Zeuge markiert eine leere Klammerfolge. Ein Gedankenstrich ist kein überliefertes Signal und suggeriert eine bestimmte editorische Darstellung der Lücke. Das Zeichen sollte unverändert als „[]“ erhalten bleiben.
  - severity: low
    issue: „die Archonten stehen über uns“ ist gegenüber „the archons are over us“ leicht idiomatisierend und kann räumlich-hierarchisch enger wirken.
    rationale: „Die Archonten sind über uns“ bewahrt die knappe, möglicherweise absichtlich offene Formulierung des Zeugen besser.
  - severity: low
    issue: Die Wiedergabe von „the trouble of each day“ mit „seine eigene Mühe“ ist stärker an die bekannte kanonische Formulierung angelehnt als erforderlich.
    rationale: „Jedem Tag genügt seine Mühe“ ist idiomatisch, folgt dem gelieferten Wortlaut näher und vermeidet die ergänzende Nuance „eigene“.
