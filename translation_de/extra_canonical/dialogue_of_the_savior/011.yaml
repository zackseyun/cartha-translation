translation:
  language: de
  text: 'Judas [sagte]: »Ich möchte wirklich [alles erfahren].«


    Der [Herr] sagte zu ihm: »Der lebendige [Gott wohnt nicht] irgendwo in diesem ganzen [Bereich] des Mangels.«[a]


    Judas [fragte]: »Wer [wird über uns herrschen]?«


    Der Herr antwortete: »[Sieh, hier wohnt] alles, was unter dem, was bleiben wird, existiert. Ihr werdet über sie [herrschen].«[b]


    Judas sagte: »Sieh, die Archonten stehen über uns, sodass sie über uns herrschen werden.«[c]


    Der Herr antwortete: »Ihr seid es, die über sie herrschen werden. Wenn ihr die Eifersucht aus euch entfernt, werdet ihr euch mit dem Licht bekleiden und in die Brautkammer eintreten.«[d]


    Judas fragte: »Wie werden uns [unsere] Gewänder bereitgestellt werden?«


    Der Herr antwortete: »Einige werden sie euch bereitstellen, und andere werden [sie] empfangen, [—] und sie sind es, [die] euch eure Gewänder [geben werden]. Denn wer kann an jenen Ort gelangen, da er doch so überaus [furchterregend] ist? Die Gewänder des Lebens jedoch werden den Menschen gegeben werden, weil sie den Weg kennen, den sie gehen werden. Tatsächlich ist es sogar für mich schwer, dorthin zu gelangen.«[e]


    Maria sagte: »So <genügt> jedem Tag seine eigene Mühe. Arbeiter sind ihrer Nahrung wert. Schüler werden ihren Lehrern gleich sein.«[f]


    Das sagte sie als eine Frau, die alles verstand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen ergänzten beziehungsweise rekonstruierten Text des zugrunde gelegten englischen Zeugen. Der genaue Wortlaut bleibt wegen der beschädigten Überlieferung unsicher.
    reason: Manuskriptzustand und vorläufige Quellenbasis müssen transparent bleiben.
  - marker: b
    text: Der Satzbau und die Bezüge von »hier«, »alles« und »ihnen« sind im überlieferten beziehungsweise rekonstruierten Text unsicher.
    reason: Die grammatische und referenzielle Mehrdeutigkeit darf nicht stillschweigend aufgelöst werden.
  - marker: c
    text: »Archonten« bedeutet wörtlich »Herrscher«; hier kann der Ausdruck übermenschliche oder kosmische Mächte bezeichnen.
    reason: Der Fachbegriff ist erklärungsbedürftig, ohne dass seine genaue theologische Funktion festgelegt werden soll.
  - marker: d
    text: »Brautkammer« und das Bekleiden mit Licht sind symbolische Ausdrücke; der Ausschnitt erklärt ihre genaue rituelle oder eschatologische Bedeutung nicht.
    reason: Bewahrt die theologische Offenheit der Bilder.
  - marker: e
    text: Im Zeugen steht zwischen »empfangen« und »und« eine leere Klammer als Zeichen einer Lücke; sie wird hier als [—] sichtbar gemacht. Auch mehrere angrenzende Wörter sind ergänzt. Die überraschende Aussage »sogar für mich« wird nicht geglättet.
    reason: Kennzeichnet Textverlust und bewahrt eine genuine theologische Spannung.
  - marker: f
    text: Die Winkelklammern um »<genügt>« zeigen eine editorische Ergänzung an. Die drei Sätze erinnern an überlieferte Jesusworte, werden hier aber in der vorliegenden Form wiedergegeben.
    reason: Unterscheidet editorische Ergänzung von rekonstruierter Beschädigung und vermeidet eine Harmonisierung mit kanonischen Fassungen.
lexical_decisions:
- source_word: deficiency
  choice: Mangel
  rationale: Bewahrt den sachlichen und möglicherweise kosmologischen Sinn des Zeugen, ohne ihn durch eine stärker konfessionell oder gnostisch geprägte Deutung festzulegen.
- source_word: archons
  choice: Archonten
  rationale: Der etablierte Fachbegriff bewahrt die Mehrdeutigkeit zwischen Herrschern, Mächten und kosmischen Machthabern.
- source_word: bridal chamber
  choice: Brautkammer
  rationale: Nahe, verständliche Wiedergabe des symbolisch aufgeladenen Ausdrucks, ohne dessen rituelle oder eschatologische Bedeutung zu erklären.
- source_word: garments of life
  choice: Gewänder des Lebens
  rationale: Die Bildsprache wird formal bewahrt; eine Deutung als Licht-, Tauf- oder Auferstehungsgewänder wird nicht eingetragen.
- source_word: jealousy
  choice: Eifersucht
  rationale: Entspricht dem gelieferten Zeugen und lässt offen, ob persönliche Eifersucht, Neid oder eine kosmische Eigenschaft gemeint ist.
- source_word: students
  choice: Schüler
  rationale: Natürliches modernes Deutsch; der Bezug auf Jünger bzw. Lernende bleibt im Kontext erkennbar, ohne ihn zu vereindeutigen.
theological_decisions:
- issue: Herrschaft der Jünger über die Archonten
  choice: Die direkte Aussage »Ihr seid es, die über sie herrschen werden« bleibt stehen.
  alternative: Die Herrschaft metaphorisch als bloße Unabhängigkeit von inneren Leidenschaften auslegen.
  rationale: Der Text verbindet Archonten und Eifersucht, erklärt aber ihr Verhältnis nicht vollständig; die Spannung bleibt erhalten.
- issue: Aussage, dass selbst der Herr den Ort nur schwer erreicht
  choice: »Tatsächlich ist es sogar für mich schwer, dorthin zu gelangen.«
  alternative: Die Aussage abschwächen oder einen anderen Sprecher annehmen.
  rationale: Die theologisch auffällige Aussage wird entsprechend dem Zeugen nicht harmonisiert.
- issue: Brautkammer und Gewänder
  choice: Die Begriffe werden ohne sakramentale oder eschatologische Festlegung wiedergegeben.
  alternative: Sie ausdrücklich auf Taufe, Erlösung, himmlische Vereinigung oder Auferstehung beziehen.
  rationale: Der Ausschnitt legt keine einzige dieser Deutungen eindeutig fest.
- issue: Der lebendige Gott und der Bereich des Mangels
  choice: Die negative Ortsaussage bleibt in restaurierter Form erhalten.
  alternative: »Gott ist außerhalb der materiellen Welt« oder eine ähnliche kosmologische Erklärung.
  rationale: Eine solche Erklärung würde mehr behaupten, als der beschädigte und nur mittelbar geprüfte Wortlaut sicher trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die Anrede im Plural wird durch »ihr/euch« wiedergegeben. Eckige Klammern und Winkelklammern folgen den Signalen des gelieferten Zeugen; die leere Lücke wird lesbar als [—] markiert. Da eine direkte Prüfung des koptischen Textes ausdrücklich noch aussteht, ist die Fassung ein vorläufiger, quellenbewusster Entwurf auf Grundlage des öffentlichen englischen Zeugen.
