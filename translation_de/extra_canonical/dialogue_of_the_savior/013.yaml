translation:
  language: de
  text: 'Maria sagte: „Ich möchte alles verstehen, [genau so,] wie es ist.“[a]


    Der Herr sagte: „Wer das Leben sucht, für den wird dies der Reichtum sein; denn die [Ruhe], die die Welt gibt, ist trügerisch, und ihr Gold und Silber täuschen.“[b]


    Seine Jünger fragten ihn: „Was sollen wir tun, damit unser Werk vollendet wird?“


    Der Herr [sagte] zu ihnen: „Seid unter allen Umständen bereit. Glücklich ist, wer den [] [Kampf kennengelernt und] die Schlacht mit eigenen Augen gesehen hat. Er hat weder getötet, noch ist [er] getötet worden, sondern ist als Sieger daraus hervorgegangen.“[c]


    Judas fragte: „Herr, sag mir: Was ist der Anfang des Weges?“


    Er sagte: „Liebe und Güte. Hätte es auch nur eine von beiden unter den Archonten gegeben, wäre das Böse niemals entstanden.“[d]


    Matthäus sagte: „Herr, du hast ohne Schwierigkeit über das Ende aller Dinge gesprochen.“


    Der Herr sagte: „Ihr habt alles verstanden, was ich euch gesagt habe, und ihr habt es im Glauben angenommen. Wenn ihr es erkennt, gehört es euch; wenn nicht, gehört es euch nicht.“[e]


    Sie fragten ihn: „An welchen Ort gehen wir?“


    Der Herr sagte: „Nehmt den Ort ein, den ihr erreichen könnt.“[f]


    Maria fragte: „Ist alles, was auf diese Weise eingerichtet ist, sichtbar?“


    Der Herr sagte: „Ich habe euch gesagt: Wer sehen kann, ist derselbe, der offenbart.“[g]


    Seine Jünger, die Zwölf, fragten ihn: „Lehrer, [mit] [] Ruhe […] lehre uns […].“[h]


    Der Herr sagte: „[Wenn ihr] alles [verstanden habt], was ich [euch gesagt habe], werdet ihr [unsterblich werden, denn] ihr […] alles.“


    Maria sagte: „Nur eines will ich dem Herrn [sagen], und zwar über das Geheimnis der Wahrheit: In ihm stehen wir, und in ihm sind wir durchsichtig für das, was zur Welt gehört.“[i]


    Judas sagte zu Matthäus: „Wir wollen verstehen, mit was für Gewändern wir bekleidet werden sollen, wenn wir die Vergänglichkeit des [Fleisches] verlassen.“[j]


    Der Herr sagte: „Die Herrscher und die Verwalter besitzen Gewänder, die nur für eine begrenzte Zeit gegeben werden und keinen Bestand haben. Ihr aber sollt euch als Söhne der Wahrheit nicht mit diesen Gewändern bekleiden, die nur für eine begrenzte Zeit Bestand haben. Vielmehr sage ich euch: Ihr werdet glücklich sein, wenn ihr eure Gewänder ablegt; denn [] [das Äußere abzulegen] ist keine große Sache.“[k]


    […] sagte: „Bin ich es, der spricht, und bin ich es, der […] empfängt?“


    Der Herr sagte: „Ja, [einer, der] euren Vater [auf vernünftige Weise empfängt].“[l]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter „genau so“ sind im zugrunde liegenden Zeugen ergänzt.
    reason: Kennzeichnet eine editorische Wiederherstellung.
  - marker: b
    text: „Ruhe“ ist ergänzt; der beschädigte Text lässt die genaue Lesart unsicher.
    reason: Dokumentiert die Textunsicherheit.
  - marker: c
    text: Vor „Kampf“ besteht eine nicht rekonstruierte Lücke; auch Teile der folgenden Wendung sind ergänzt.
    reason: Bewahrt die sichtbare Überlieferungslücke.
  - marker: d
    text: „Archonten“ ist eine Bezeichnung für herrschende Mächte; der Text bestimmt ihre genaue Art hier nicht näher.
    reason: Erläutert einen ungewöhnlichen antiken Fachbegriff ohne dogmatische Festlegung.
  - marker: e
    text: „Erkennen“ kann hier sowohl Wissen als auch einsichtsvolle Aneignung bezeichnen.
    reason: Bewahrt die semantische Weite des Erkenntnismotivs.
  - marker: f
    text: Die Aufforderung kann räumlich oder bildlich-geistlich verstanden werden.
    reason: Macht eine echte Deutungsmehrdeutigkeit sichtbar.
  - marker: g
    text: Der Satz setzt den Sehenden und den Offenbarenden gleich; sein genauer Bezug bleibt offen.
    reason: Verhindert eine stillschweigende Auflösung der schwierigen Aussage.
  - marker: h
    text: Die Passage ist stark beschädigt; leere Klammern und Auslassungspunkte markieren nicht wiederhergestellten Text.
    reason: Erklärt die editorischen Zeichen.
  - marker: i
    text: Die Bedeutung von „durchsichtig“ ist unsicher und wird hier bewusst nicht geglättet.
    reason: Erhält die ungewöhnliche Bildsprache und ihre Spannung.
  - marker: j
    text: „Fleisch“ ist ergänzt. „Vergänglichkeit“ bezeichnet hier die Verfallsfähigkeit, ohne den Leib selbst eindeutig mit dem Bösen gleichzusetzen.
    reason: Kennzeichnet Ergänzung und vermeidet eine konfessionelle oder dualistische Überdeutung.
  - marker: k
    text: Im letzten Satz bestehen eine Lücke und eine ergänzte Wortfolge; die Bildsprache der Gewänder bleibt daher unsicher.
    reason: Dokumentiert den beschädigten Textzustand.
  - marker: l
    text: Die abschließende Antwort ist beschädigt. „Auf vernünftige Weise“ folgt einer unsicheren Wiederherstellung des vorliegenden englischen Zeugen.
    reason: Warnt vor einer zu sicheren Auslegung der rekonstruierten Aussage.
lexical_decisions:
- source_word: '[rest]'
  choice: '[Ruhe]'
  rationale: Die Ergänzung des englischen Zeugen wird als unsichere Wiederherstellung in eckigen Klammern bewahrt; „Ruhe“ erhält zugleich den möglichen spirituellen Sinn.
- source_word: archons
  choice: Archonten
  rationale: Der fachsprachliche Lehnbegriff wahrt die besondere kosmologische Bezeichnung des Textes, ohne sie deutend mit „Dämonen“ oder allgemein mit „Herrschern“ gleichzusetzen.
- source_word: known
  choice: erkennt / kennengelernt
  rationale: Je nach Zusammenhang wird das Erkenntnismotiv natürlich wiedergegeben, ohne es auf rein intellektuelles Wissen zu beschränken.
- source_word: occupy
  choice: Nehmt … ein
  rationale: Die räumliche und möglicherweise geistliche Mehrdeutigkeit des Imperativs bleibt erhalten.
- source_word: garments
  choice: Gewänder
  rationale: „Gewänder“ wahrt die symbolische Bildsprache besser als das alltäglichere „Kleider“.
- source_word: destructibility
  choice: Vergänglichkeit
  rationale: Die natürliche deutsche Entsprechung bezeichnet den Zustand des Verfalls, ohne bereits eine bestimmte Körpertheologie festzulegen.
- source_word: flesh
  choice: Fleisch
  rationale: Der traditionelle anthropologische Ausdruck bleibt in der editorisch ergänzten Passage erhalten und wird nicht interpretierend zu „Körper“ geglättet.
- source_word: logical way
  choice: vernünftige Weise
  rationale: Eine vorsichtige Wiedergabe des schwer verständlichen Zeugen; die Ergänzung bleibt durch Klammern ausdrücklich vorläufig.
theological_decisions:
- issue: Bezeichnung der kosmischen Mächte
  choice: Archonten
  alternative: Herrscher
  rationale: Die Transliteration vermeidet eine vorschnelle Identifizierung mit gewöhnlichen politischen Herrschern und bewahrt den besonderen Vorstellungshorizont des Werkes.
- issue: Geschlechtsspezifische Bezeichnung „sons of truth“
  choice: Söhne der Wahrheit
  alternative: Kinder der Wahrheit
  rationale: Die konkrete Metapher des Zeugen wird formal bewahrt; eine inklusive Verallgemeinerung könnte eine mögliche symbolische oder gruppenbezogene Nuance verdecken.
- issue: Aussage über Töten, Getötetwerden und Sieg
  choice: Wörtliche Spannung bewahrt
  alternative: Als rein geistlichen Kampf erläutern
  rationale: Der Text selbst legt nicht eindeutig fest, ob der Kampf wörtlich, asketisch oder kosmologisch zu verstehen ist.
- issue: „deathless“
  choice: '[unsterblich werden]'
  alternative: '[dem Tod entgehen]'
  rationale: „Unsterblich“ bewahrt die starke Aussage des ergänzten Zeugen; die Klammern kennzeichnen ihre textliche Unsicherheit.
- issue: Transparenz gegenüber der Welt
  choice: „durchsichtig für das, was zur Welt gehört“
  alternative: „der Welt offenbar“
  rationale: Die ungewöhnliche und theologisch offene Formulierung wird nicht auf eine eindeutige Lehre über Weltentsagung oder Offenbarung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Dialogform. Eckige Klammern, leere Klammern und Auslassungspunkte wurden als textkritische Signale des beschädigten Manuskripts bewahrt. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorläufig und folgt dem bereitgestellten gemeinfreien englischen Zeugen, ohne dessen schwierige Stellen zu harmonisieren.
