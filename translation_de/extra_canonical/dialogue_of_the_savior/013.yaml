review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen im Wesentlichen zuverlässig und bewahrt dessen Klammern, Leerstellen und Auslassungen. Eine sichere Korrektur ist jedoch in der beschädigten Aussage über Kämpfen und Schlacht nötig: Die deutsche Fassung verschmilzt die im Zeugen getrennten Ausdrücke „fighting“ und „battle“. Ferner sollte die Klammerung bei „[If you have understood]“ näher am überlieferten Ergänzungsumfang bleiben. „Faithfully“ ist neutraler mit „treu“ als mit dem stärker religiös konnotierten „im Glauben“ wiederzugeben. Die direkte koptische Kontrolle steht nach Aufgabenstellung noch aus; die Beurteilung erfolgt daher vorläufig gegen den bereitgestellten englischen Zeugen.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Einzelne absichtlich sperrige Formulierungen, insbesondere „durchsichtig für das, was zur Welt gehört“ und die Schlusszeile, dürfen wegen des schwierigen und beschädigten Zeugen nicht harmonisierend geglättet werden. „auf logische Weise“ ist zwar ungewohnt, bildet „in a logical way“ aber enger ab als die interpretierendere Formulierung „auf vernünftige Weise“.
  terminology: „Archonten“, „Söhne der Wahrheit“, „Gewänder“, „Fleisch“ und „unsterblich“ sind als quellennahe und registergerechte Entscheidungen beizubehalten. „Herrscher“ für governors und „Verwalter“ für administrators differenzieren die beiden Begriffe angemessen. Die Fußnoten sind korrekt verankert und erklären die textkritischen Markierungen ohne konfessionelle Festlegung.
  issues:
  - severity: medium
    issue: Die Wendung über Kämpfen und Schlacht wird zusammengezogen.
    rationale: Der Zeuge unterscheidet „[fighting …]“ und „the battle“. „den [] [Kampf kennengelernt und] die Schlacht“ lässt die Leerstelle syntaktisch unpassend erscheinen und nivelliert die doppelte Bildsprache. „[] [das Kämpfen kennengelernt und] den Kampf“ wahrt beides.
  - severity: medium
    issue: Die Klammerung bei der Aussage über das Unsterblichwerden verschiebt den Ergänzungsumfang.
    rationale: Der Zeuge ergänzt „[If you have understood]“, nicht nur das deutsche „Wenn ihr“. Die Revision kennzeichnet daher die gesamte entsprechende Verbphrase als ergänzt.
  - severity: low
    issue: „im Glauben angenommen“ ist enger als „accepted it faithfully“.
    rationale: Die deutsche Fassung kann eine spezifisch religiöse Glaubensannahme nahelegen. „treu angenommen“ bewahrt die Offenheit des Zeugen.
  - severity: low
    issue: „auf vernünftige Weise“ deutet „in a logical way“ stärker aus.
    rationale: „Auf logische Weise“ bleibt näher an der auffällig-technischen Wortwahl des englischen Zeugen; die Fußnote weist weiterhin auf die Unsicherheit der Rekonstruktion hin.
