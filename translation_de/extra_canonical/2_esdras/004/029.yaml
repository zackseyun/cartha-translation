  terminology: „das Gesäte“, „das Böse“, „das Gute“, „Ort“ und „Feld“ sind treffend und halten die Parallelismen sowie den Gegensatz von locus und ager aufrecht. Es werden keine konfessionell festgelegten Deutungen in den Text eingetragen.
