id: 2ES.4.29
reference: 2 Esdras 4:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: de
  text: Denn wenn das Gesäte nicht geerntet wird[a] und der Ort, an dem das Böse gesät worden ist, nicht vergeht, wird das Feld, auf dem das Gute gesät worden ist, nicht kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Wortlaut ist an dieser Stelle offenbar verkürzt; „nicht geerntet wird“ folgt dem durch den Zusammenhang vorausgesetzten Sinn.
    reason: textual
lexical_decisions:
- source_word: seminatum est
  choice: gesät worden ist
  rationale: Das lateinische Perfekt Passiv wird in allen drei Vorkommen möglichst einheitlich wiedergegeben; beim substantivierten ersten Vorkommen steht aus natürlichem deutschem Sprachgebrauch „das Gesäte“.
- source_word: discesserit
  choice: vergeht
  rationale: Im eschatologischen Zusammenhang bezeichnet das Verb das Weichen beziehungsweise Aufhören des Ortes; „vergeht“ ist verständlich und wahrt den Gegensatz zum kommenden Feld.
- source_word: ager
  choice: Feld
  rationale: Entspricht dem landwirtschaftlichen Bild und hält den Kontrast zu „Ort“ (locus) aufrecht.
- source_word: ueniet
  choice: wird … kommen
  rationale: Bewahrt die auffällige räumlich-eschatologische Ausdrucksweise des Lateinischen, statt sie erklärend als „erscheinen“ oder „anbrechen“ aufzulösen.
theological_decisions:
- issue: Zeitliche Beziehung zwischen dem Ort des Bösen und dem Feld des Guten
  choice: Der Ort des Bösen muss vergehen, bevor das Feld des Guten kommt.
  alternative: Das Bild ausdrücklich als Ablösung des gegenwärtigen Zeitalters durch das künftige Zeitalter deuten.
  rationale: Die Übersetzung erhält das Bild und seine eschatologische Spannung, ohne die Metaphern konfessionell oder systematisch auszudeuten.
- issue: Perfektaspekt der drei Aussaat-Aussagen
  choice: Die bereits erfolgte Aussaat wird an allen drei Stellen bewahrt.
  alternative: Beim Guten präsentisch „gesät wird“ formulieren.
  rationale: Das dreimalige seminatum est legt eine bewusste formale Parallelität und eine bereits vollzogene Aussaat sowohl des Bösen als auch des Guten nahe.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Aussaatmetaphorik und die ungewöhnliche Wendung, dass ein Feld „kommt“, bleiben bewusst erhalten.
