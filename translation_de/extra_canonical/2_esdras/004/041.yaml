  text: And I said[a], “It cannot, Lord.” And he said to me, “In Hades the storehouses
translation:
  language: de
  text: 'Und ich sagte: »Das kann sie nicht, Herr.« Und er sagte zu mir: »In der Unterwelt[a] die Vorratskammern …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unterwelt“ bezeichnet hier das Reich der Toten, nicht speziell den Ort der endgültigen Bestrafung.
    reason: cultural_note
lexical_decisions:
- source_word: inferno
  choice: Unterwelt
  rationale: Bezeichnet hier das Totenreich; „Unterwelt“ bewahrt diese Bedeutung, ohne den Ausdruck speziell als Ort der endgültigen Strafe festzulegen.
- source_word: prumptuaria
  choice: Vorratskammern
  rationale: Die Schreibvariante steht für lateinisch „promptuaria“ und bezeichnet Vorrats- oder Aufbewahrungsräume. Die konkrete Ergänzung dessen, was dort verwahrt wird, fehlt im erhaltenen Text und wird daher nicht eingefügt.
- source_word: non potest
  choice: Das kann sie nicht
  rationale: Das feminine Pronomen nimmt natürlich die zuvor genannte „matrix“ (Gebärmutter) auf; im Deutschen macht „sie“ diesen Rückbezug deutlich.
theological_decisions:
- issue: Bedeutung von „infernum“
  choice: Unterwelt als Totenreich
  alternative: Hölle als Ort endgültiger Bestrafung
  rationale: Der lateinische Ausdruck legt an dieser Stelle nicht eindeutig den Ort der endgültigen Strafe fest. Die Übersetzung vermeidet daher eine theologische Verengung.
- issue: Unvollständiger Satz am Ende des Fragments
  choice: Die syntaktische Unvollständigkeit mit Auslassungspunkten bewahren
  alternative: Den Satz aus späterer Überlieferung oder durch Vermutung ergänzen
  rationale: Die vorgelegte lateinische Quelle bricht nach „prumptuaria“ ab. Eine Ergänzung wie „der Seelen sind wie der Mutterleib“ wäre durch diesen Quellentext nicht gedeckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp. Der fragmentarische Schluss der lateinischen Textgrundlage wird sichtbar bewahrt, statt inhaltlich ergänzt zu werden.
