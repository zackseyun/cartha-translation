  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/016.yaml
  text: 'Likewise also the plan of the waves of the sea: for the sand stood fast and held them back.'
translation:
  language: de
  text: 'Ebenso auch das Vorhaben der Meereswellen: Denn der Sand stand fest und hielt sie zurück.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Wortlaut ist an dieser Stelle knapp und offenbar unvollständig: wörtlich endet er mit „denn er/es stand“. „Der Sand … hielt sie zurück“ verdeutlicht den aus dem Zusammenhang erschlossenen Sinn.'
    reason: Die Ergänzung macht die elliptische lateinische Überlieferung verständlich, ohne ihre Unsicherheit zu verschweigen.
lexical_decisions:
- source_word: cogitatus
  choice: Vorhaben
  rationale: Das lateinische Wort bezeichnet einen Gedanken, eine Absicht oder einen Plan. „Vorhaben“ bewahrt hier die bildhafte Zuschreibung an die Meereswellen und klingt im Deutschen natürlicher als „Gedanke der Wellen“.
- source_word: fluctuum maris
  choice: der Meereswellen
  rationale: Eine knappe und genaue Wiedergabe des lateinischen Genitivs.
- source_word: stetit
  choice: stand fest
  rationale: „Stand“ wäre wörtlich möglich; „stand fest“ gibt in diesem Zusammenhang die Widerstandskraft der begrenzenden Schranke deutlicher wieder.
theological_decisions:
- issue: Personifizierung der Meereswellen
  choice: „das Vorhaben der Meereswellen“
  alternative: „der Gedanke an die Meereswellen“
  rationale: Der Genitiv lässt am ehesten die Wellen selbst als Träger eines bildhaft dargestellten Vorhabens erscheinen. Diese Spannung wird nicht durch eine sachlichere Umschreibung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Personifizierung der Wellen bleibt erhalten; die durch die fragmentarische lateinische Überlieferung nötige Ergänzung wird in einer Fußnote offengelegt.
