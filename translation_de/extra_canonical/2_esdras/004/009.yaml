source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: de
  text: Jetzt aber habe ich dich nur nach Feuer, Wind und Tag gefragt, durch die du hindurchgegangen bist und ohne die du nicht existieren kannst; doch du hast mir darüber nicht geantwortet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: Jetzt aber
  rationale: Gibt den zeitlichen Kontrast knapp und unmittelbar wieder.
- source_word: non interrogaui te nisi de
  choice: habe ich dich nur nach … gefragt
  rationale: Die lateinische Ausschließlichkeitskonstruktion wird in natürlichem Deutsch mit „nur“ wiedergegeben.
- source_word: igne et uento et die
  choice: Feuer, Wind und Tag
  rationale: Bewahrt die drei konkreten Größen des lateinischen Textes ohne erklärende Zusätze.
- source_word: per quae transisti
  choice: durch die du hindurchgegangen bist
  rationale: Gibt die räumlich beziehungsweise erfahrungsbezogen offene Formulierung des Lateinischen wieder, ohne sie näher auszudeuten.
- source_word: sine quibus esse non potes
  choice: ohne die du nicht existieren kannst
  rationale: „Existieren“ bringt esse hier klar als Dasein beziehungsweise Bestehen zum Ausdruck und ist im modernen Standarddeutsch verständlich.
- source_word: non respondisti mihi de eis
  choice: du hast mir darauf nicht geantwortet
  rationale: „Darauf antworten“ ist die natürliche deutsche Entsprechung; der Rückbezug auf die drei genannten Dinge bleibt eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung und der Vorwurf bleiben eng am Latein; das Semikolon gliedert den langen Satz, ohne den fortlaufenden Redegang zu beenden.
