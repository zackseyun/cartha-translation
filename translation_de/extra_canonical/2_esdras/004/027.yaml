  naturalness: Der Satzbau und das Register sind insgesamt modernes, würdevolles Standarddeutsch. „Schwachheiten“ ist jedoch im heutigen Standarddeutsch ungebräuchlich und klingt künstlich; „Schwächen“ ist natürlich und bewahrt den Plural von infirmitatibus.
  terminology: „Zeitalter“, „Gerechten“ und „verheißen“ sind angemessen. „Zu den dafür bestimmten Zeiten“ ist als interpretierende, aber vertretbare Wiedergabe von in temporibus iustis möglich und vermeidet eine unangebrachte dogmatische Festlegung.
