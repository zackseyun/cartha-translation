source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: de
  text: Denn das Zeitalter eilt in großer Hast seinem Ende entgegen. Es kann nämlich nicht tragen, was den Gerechten zu den dafür bestimmten Zeiten verheißen ist; denn dieses Zeitalter ist voller Trauer und Schwächen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: Zeitalter
  rationale: Bezeichnet hier die gegenwärtige Weltzeit und nicht bloß die physische Welt; „Zeitalter“ bewahrt zudem den Gegensatz zur kommenden Heilszeit.
- source_word: festinans festinat ... pertransire
  choice: eilt seinem Ende entgegen
  rationale: Gibt die emphatische lateinische Wiederholung natürlich wieder und macht den gemeinten Übergang beziehungsweise das Vergehen des Zeitalters verständlich, ohne eine genaue Endzeitchronologie einzutragen.
- source_word: capiet portare
  choice: kann ... nicht tragen
  rationale: Bewahrt das Bild der mangelnden Tragfähigkeit des gegenwärtigen Zeitalters; eine freiere Wiedergabe wie „kann nicht fassen“ würde die Bildsprache verschieben.
- source_word: quae ... repromissa sunt
  choice: was ... verheißen ist
  rationale: „Verheißen“ entspricht dem religiös geprägten Versprechen und ist im modernen gehobenen Deutsch verständlich.
- source_word: in temporibus iustis
  choice: zu den dafür bestimmten Zeiten
  rationale: Das lateinische „iustis“ kann „rechten“, „angemessenen“ oder „bestimmten“ Zeiten meinen. Die Formulierung bezeichnet die zugehörigen, festgesetzten Zeiten, ohne sie mit den Gerechten grammatisch zu verbinden.
- source_word: mesticia ... et infirmitatibus
  choice: Trauer und Schwachheiten
  rationale: Bewahrt sowohl den Kummer als auch die im Plural genannten Formen von Schwäche; „Leiden“ wäre flüssiger, aber weniger quellennah.
theological_decisions:
- issue: Bezug der verheißenen Güter und ihrer Zeiten
  choice: „was den Gerechten zu den dafür bestimmten Zeiten verheißen ist“
  alternative: „was den Gerechten in ihren Zeiten verheißen ist“
  rationale: Die gewählte Fassung lässt die Verheißung den Gerechten gelten und bezieht die Zeiten auf die vorgesehene Erfüllung. Sie vermeidet die missverständliche Aussage, die Gerechten selbst hätten jeweils eigene Zeiten.
- issue: Personifizierung des gegenwärtigen Zeitalters
  choice: Das Zeitalter kann die Verheißungen „nicht tragen“.
  alternative: Das Zeitalter kann die Verheißungen „nicht aufnehmen“ oder „nicht hervorbringen“.
  rationale: 'Die quellennahe Personifizierung hält die Spannung fest: Die kommende Erfüllung passt nicht in die von Trauer und Schwäche erfüllte gegenwärtige Weltzeit.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste lateinische Verstärkung wird idiomatisch statt doppelt wiedergegeben; die zweite Satzhälfte bleibt bewusst bildhaft und relativ formnah.
