  to: Denn das Zeitalter eilt in großer Hast seinem Ende entgegen. Es kann nämlich nicht tragen, was den Gerechten zu den dafür bestimmten Zeiten verheißen ist; denn dieses Zeitalter ist voller Trauer und Schwächen.
