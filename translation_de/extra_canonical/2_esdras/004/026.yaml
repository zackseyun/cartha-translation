  yaml_path: translation/extra_canonical/2_esdras/004/026.yaml
  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: de
  text: 'Und er antwortete mir und sagte: „Wenn du dann da bist,[a] wirst du es sehen; und wenn du lebst, wirst du dich oft wundern.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wenn du gewesen sein wirst“; die knappe lateinische Formulierung ist mehrdeutig und unterscheidet sich von dem folgenden „wenn du lebst“.'
    reason: Die Anmerkung dokumentiert die ungewöhnliche Zukunftsform und die im Ausgangstext vorhandene Differenz zu si vixeris, ohne sie auszudeuten.
lexical_decisions:
- source_word: si fueris
  choice: wenn du dann noch da bist
  rationale: Die lateinische Wendung bedeutet wörtlich etwa „wenn du sein wirst“. Die idiomatische deutsche Fassung wahrt den Bezug auf Esras künftiges Dasein, ohne sie mit dem ausdrücklich folgenden „wenn du lebst“ gleichzusetzen.
- source_word: videbis
  choice: wirst du es sehen
  rationale: Das im Deutschen nötige Objekt „es“ greift den zuvor besprochenen Sachverhalt auf.
- source_word: si vixeris
  choice: wenn du weiterlebst
  rationale: Gibt die zukünftige Bedingung natürlich wieder und hält sie von si fueris unterscheidbar.
- source_word: frequenter miraberis
  choice: wirst du dich oft wundern
  rationale: „oft“ entspricht frequenter ohne den Zusatz einer bestimmten Lebensdauer; „sich wundern“ ist die natürliche Wiedergabe von mirari.
theological_decisions:
- issue: Verhältnis von si fueris und si vixeris
  choice: 'Die beiden Bedingungen werden sprachlich unterschieden: „noch da bist“ und „weiterlebst“.'
  alternative: Beide Wendungen mit „leben“ wiedergeben.
  rationale: Der lateinische Text verwendet bewusst verschiedene Verben; die Übersetzung soll diese Spannung nicht einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das doppelte lateinische „er antwortete mir und sagte“ wird natürlich zu „er antwortete mir“ gestrafft; die feierliche direkte Rede bleibt erhalten.
