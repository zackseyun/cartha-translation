  verdict: revise
  source_fidelity: Die Unterscheidung zwischen si fueris und si vixeris muss erhalten bleiben. „Weiterlebst“ fügt bei vixeris jedoch den Aspekt eines Fortlebens hinzu, der im bloßen vivere nicht ausdrücklich liegt; „noch da bist“ trägt zudem stärker als nötig die Vorstellung eines Überlebens hinein. Die revidierte Fassung wahrt die knappe, auffällig unterschiedliche lateinische Wortwahl.
  naturalness: „Wenn du dann da bist“ ist modernes, gut verständliches Deutsch und gibt die zukunftsbezogene Existenzbedingung idiomatisch wieder. „Wenn du lebst“ bleibt bewusst schlicht und unterscheidbar.
  terminology: Keine theologischen oder namensbezogenen Fragen. „sehen“ für videbis und „sich oft wundern“ für frequenter miraberis sind angemessen.
  issues:
  - severity: medium
    issue: „weiterlebst“ für si vixeris
    rationale: Das Präfix „weiter-“ kann ein Fortleben über einen bestimmten Punkt hinweg nahelegen. Der lateinische Text sagt lediglich vixeris und setzt damit zwar einen anderen Akzent als fueris, aber nicht ausdrücklich „weiterleben“.
  - severity: low
    issue: „noch da bist“ für si fueris
    rationale: „Noch“ verstärkt die Aussage zu einer Überlebens- bzw. Fortbestandsaussage. „Dann da bist“ gibt die künftige Bedingung zurück, ohne diesen Zusatz.
  - severity: low
    issue: Fußnote bezeichnet „wenn du sein wirst“ als wörtlich
    rationale: fueris ist formal ein Futur-II-Ausdruck; die Fußnote sollte die ungewohnte Form genauer beschreiben, ohne eine einzige Deutung festzulegen.
