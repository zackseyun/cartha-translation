source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos omnes pleni sumus impietatem. Et ne forte propter nos prohibeatur iustorum area, propter peccata inhabitantium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: de
  text: Wir alle sind voller Gottlosigkeit. Und vielleicht wird unseretwegen die Tenne der Gerechten zurückgehalten[a], wegen der Sünden derer, die dort wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gehindert«; möglicherweise auch: »verzögert«.'
    reason: Das lateinische prohibeatur bezeichnet allgemein ein Verhindern oder Zurückhalten; im Zusammenhang kann daraus auch eine Verzögerung folgen.
lexical_decisions:
- source_word: impietatem
  choice: Gottlosigkeit
  rationale: Gibt die religiös-moralische Bedeutung von lateinisch impietas in natürlichem, würdigem Deutsch wieder.
- source_word: prohibeatur
  choice: zurückgehalten wird
  rationale: Bewahrt den Grundsinn von prohibere als hindern bzw. zurückhalten, ohne ihn auf eine bloße zeitliche Verzögerung zu verengen.
- source_word: iustorum area
  choice: die Tenne der Gerechten
  rationale: Gibt die landwirtschaftliche Bildsprache formal und verständlich wieder; der Genitiv bleibt in seiner Zuordnung erhalten.
- source_word: inhabitantium
  choice: ihrer Bewohner
  rationale: Das substantivierte Partizip bezeichnet die dort Wohnenden. Das Pronomen bezieht sich im Deutschen natürlich auf die Tenne, ohne einen im Lateinischen nicht genannten Ort wie die Erde einzuführen.
theological_decisions:
- issue: Bedeutung der »Tenne der Gerechten«
  choice: Das Bild wird unverändert als »Tenne der Gerechten« wiedergegeben.
  alternative: Eine Deutung als Ernte, Versammlungsort oder endzeitlicher Lohn ausdrücklich in den Text einsetzen.
  rationale: Der lateinische Text erläutert die Metapher nicht. Eine auslegende Festlegung würde die genuine Mehrdeutigkeit und mögliche endzeitliche Spannung beseitigen.
- issue: Art der Behinderung durch prohibeatur
  choice: »zurückgehalten«
  alternative: »verzögert« oder »verhindert«
  rationale: »Zurückgehalten« wahrt sowohl eine zeitliche als auch eine allgemein hindernde Nuance und vermeidet eine unnötige dogmatische Präzisierung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Wiederholung des Kausalgedankens wird durch einen Gedankenstrich natürlich gegliedert, ohne den Sinn zu verändern.
