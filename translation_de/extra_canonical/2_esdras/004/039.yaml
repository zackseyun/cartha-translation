    text: 'Oder: »gehindert«; möglicherweise auch: »verzögert«.'
    reason: Das lateinische prohibeatur bezeichnet allgemein ein Verhindern oder Zurückhalten; im Zusammenhang kann daraus auch eine Verzögerung folgen.
  revision_rationale: Die Revision beseitigt die unzutreffende possessive Zuordnung von „Bewohner“ zur „Tenne“. „Derer, die dort wohnen“ gibt das substantivierte Partizip *inhabitantium* wieder und lässt den nicht ausdrücklich benannten, kontextuell vorausgesetzten Ort ebenso offen wie der lateinische Text.
