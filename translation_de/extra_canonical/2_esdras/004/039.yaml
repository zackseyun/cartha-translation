revisions:
- from: Wir alle sind voller Gottlosigkeit. Und vielleicht wird unseretwegen die Tenne der Gerechten zurückgehalten[a] – wegen der Sünden ihrer Bewohner.
  to: Wir alle sind voller Gottlosigkeit. Und vielleicht wird unseretwegen die Tenne der Gerechten zurückgehalten[a], wegen der Sünden derer, die dort wohnen.
  rationale: Die Revision beseitigt die unzutreffende possessive Zuordnung von „Bewohner“ zur „Tenne“. „Derer, die dort wohnen“ gibt das substantivierte Partizip *inhabitantium* wieder und lässt den nicht ausdrücklich benannten, kontextuell vorausgesetzten Ort ebenso offen wie der lateinische Text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:05:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsinn ist zutreffend wiedergegeben: *impietatem* als „Gottlosigkeit“, *area iustorum* als „Tenne der Gerechten“ und *prohibeatur* als „zurückgehalten wird“. Die Übersetzung von *inhabitantium* mit „ihrer Bewohner“ legt jedoch durch das Possessivpronomen nahe, die Bewohner seien Bewohner der Tenne. Der lateinische Text nennt den Bezugsort nicht ausdrücklich, sondern spricht schlicht von den dort Wohnenden.'
  naturalness: Der Satz ist insgesamt idiomatisch und angemessen würdig. „Ihre Bewohner“ klingt im Deutschen bei „Tenne“ sachlich unplausibel und erzeugt eine unnötige, vom Ausgangstext nicht verlangte Referenzbindung. „derer, die dort wohnen“ ist natürlich und bewahrt die kontextuell vorausgesetzte Ortsangabe.
  terminology: „Gottlosigkeit“, „Tenne der Gerechten“ und „zurückgehalten“ sind terminologisch tragfähig. Die Fußnote bildet die Bandbreite von *prohibeatur* sinnvoll ab, ohne die Übersetzung auf „verzögert“ zu verengen.
  issues:
  - severity: medium
    issue: „ihrer Bewohner“ bindet *inhabitantium* an die Tenne.
    rationale: Das lateinische Partizip enthält kein Possessivpronomen und spezifiziert den Ort nicht. Im Deutschen verweist „ihre“ grammatisch auf die Tenne, deren Bewohner jedoch nicht gemeint sein können. Die Formulierung sollte die im Kontext vorausgesetzten Wohnenden bezeichnen, ohne einen neuen Ort wie „die Erde“ einzutragen.
  revised_text: Wir alle sind voller Gottlosigkeit. Und vielleicht wird unseretwegen die Tenne der Gerechten zurückgehalten[a], wegen der Sünden derer, die dort wohnen.
  revised_footnotes:
