base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/052.yaml
  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: de
  text: Du fragst beharrlich. Zum Teil kann ich es dir sagen[a]; über dein Leben aber bin ich nicht gesandt worden, dir etwas zu sagen, aber ich weiß es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uriels Antwort bleibt bewusst begrenzt: Er kann nur teilweise Auskunft geben. Im Kontext kann die Frage nach Esras Lebensspanne mitgemeint sein; der Wortlaut dieses Verses spricht allgemeiner von seinem „Leben“.'
    reason: compositional_layer
lexical_decisions:
- source_word: perrogas
  choice: Du fragst beharrlich
  rationale: Das Präfix per- verstärkt hier das Fragen; „beharrlich“ gibt den nachdrücklichen bzw. wiederholten Charakter natürlich wieder, ohne einen nicht ausdrücklich genannten Gegenstand einzuführen.
- source_word: ex parte
  choice: zum Teil
  rationale: Entspricht der Einschränkung des lateinischen Ausdrucks und wahrt die bewusst nur teilweise gewährte Auskunft.
- source_word: de vita autem tua
  choice: über dein Leben aber
  rationale: Bewahrt den thematischen Gegensatz durch „aber“. „Leben“ lässt wie das lateinische vita offen, ob allgemein das Leben oder insbesondere die Lebensdauer gemeint ist.
- source_word: non sum missus dicere tibi
  choice: bin ich nicht gesandt worden, dir Auskunft zu geben
  rationale: Erhält das Sendungsmotiv und gibt dicere tibi in diesem Auskunftskontext idiomatisch wieder.
- source_word: sed nescio
  choice: und ich weiß es nicht
  rationale: Das lateinische sed kann nach der vorausgehenden Verneinung den zusätzlichen Punkt anschließen; „und“ klingt im Deutschen natürlich und lässt die Spannung zwischen fehlendem Auftrag und fehlendem Wissen bestehen.
theological_decisions:
- issue: Umfang der offenbarten Kenntnis
  choice: „Zum Teil kann ich es dir sagen“ bleibt ausdrücklich begrenzt.
  alternative: Die nicht genannten „Zeichen“ als Gegenstand ergänzen.
  rationale: Der überlieferte lateinische Wortlaut nennt den Gegenstand an dieser Stelle nicht. Die Übersetzung wahrt deshalb die Begrenzung, ohne Kontextmaterial in den Haupttext einzutragen.
- issue: Bedeutung von vita
  choice: „dein Leben“
  alternative: „deine Lebensdauer“
  rationale: „Lebensdauer“ wäre kontextuell möglich, würde aber die weitere Bedeutung von vita verengen. Der Haupttext bewahrt die echte Mehrdeutigkeit; die Fußnote kann den Bezug zur Lebensspanne erläutern.
- issue: Nicht gesandt und nicht wissend
  choice: Beide Aussagen werden nebeneinander beibehalten.
  alternative: Das Nichtwissen als bloße Folge des fehlenden Auftrags erklären.
  rationale: Der Text nennt sowohl den fehlenden Sendungsauftrag als auch das Nichtwissen. Ihre genaue Beziehung wird nicht harmonisierend festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzführung folgt dem abrupten lateinischen Wortlaut. Der Fußnotenmarker [a] steht unmittelbar bei der Aussage, deren bewusste Begrenzung erläutert wird.
