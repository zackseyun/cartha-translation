    rationale: Der unmittelbare lateinische Wortlaut nennt weder Zeichen noch Lebensspanne; vita bleibt im Haupttext offen. Der Kontext kann die Lebensspanne nahelegen, doch die Anmerkung sollte diese Einengung als kontextuelle Deutung kenntlich machen.
