  verdict: revise
  source_fidelity: Der Haupttext gibt perrogas, ex parte, de vita tua und die doppelte Aussage von fehlender Sendung und Nichtwissen im Wesentlichen treffend wieder. Das lateinische sed ist jedoch adversativ und sollte nicht mit „und“, sondern mit „aber“ wiedergegeben werden. Der nicht näher bezeichnete Gegenstand von dicere bleibt zu Recht unergänzt.
  naturalness: „Du fragst beharrlich“ und „Zum Teil kann ich es dir sagen“ sind natürliches, würdevolles Standarddeutsch. „bin ich nicht gesandt worden, dir Auskunft zu geben“ ist verständlich, aber „dir etwas zu sagen“ ist näher an dicere und weniger verwaltungssprachlich.
  terminology: „dein Leben“ bewahrt die Mehrdeutigkeit von vita angemessen. Die Fußnote sollte nicht behaupten, der Vers selbst nenne „Zeichen“, und sie sollte die kontextuelle Einengung auf die Lebensspanne als Erläuterung statt als Textaussage formulieren.
