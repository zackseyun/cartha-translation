    issue: „und ich weiß es nicht“ statt „aber ich weiß es nicht“
    rationale: Das lateinische sed setzt die zweite Aussage kontrastierend hinzu. Die deutsche adversative Konjunktion ist hier sowohl quellentreuer als auch ohne stilistische Härte möglich.
