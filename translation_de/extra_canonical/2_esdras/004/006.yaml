source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi : quis natorum poterit hoc facere, ut me interroges de his ?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/006.yaml
  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: de
  text: 'Und ich antwortete und sagte: »Wer unter den Geborenen kann dies tun, dass du mich nach diesen Dingen fragst?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: natorum
  choice: von den Geborenen
  rationale: Gibt den substantivierten Genitiv Plural wörtlich und verständlich wieder, ohne den Kreis eigenmächtig auf Menschen oder Sterbliche einzugrenzen.
- source_word: poterit
  choice: könnte
  rationale: Im rhetorischen Fragesatz bringt der deutsche Konjunktiv die gemeinte Unmöglichkeit natürlich zum Ausdruck; formal kann das lateinische Futur auch als »wird ... können« verstanden werden.
- source_word: hoc facere
  choice: das tun
  rationale: Bewahrt den knappen Rückverweis des lateinischen Ausdrucks.
- source_word: ut me interroges de his
  choice: dass du mich nach diesen Dingen fragst
  rationale: Gibt die Konstruktion direkt wieder und hält sich mit »diesen Dingen« eng an de his.
theological_decisions:
- issue: Reichweite von »natorum«
  choice: von den Geborenen
  alternative: unter den Menschen / unter den Sterblichen
  rationale: Der lateinische Text sagt allgemein »der Geborenen«. Eine anthropologische oder sterblichkeitsbezogene Präzisierung wäre interpretierend.
- issue: Bezug der ut-Konstruktion
  choice: dass du mich nach diesen Dingen fragst
  alternative: sodass du mich nach diesen Dingen fragen könntest
  rationale: Die direkte Form bewahrt die Spannung des lateinischen Satzes und vermeidet eine zusätzliche modale Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das formelhafte »antwortete und sagte« wird idiomatisch zu »antwortete« verdichtet, ohne Informationsverlust.
