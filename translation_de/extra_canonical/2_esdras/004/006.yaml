review_pass:
  verdict: revise
  source_fidelity: Die Auslassung von »et dixi« verdichtet eine im Ausgangstext ausdrücklich vorhandene Redeformel. Zudem gibt »könnte« das lateinische Futur »poterit« als irrealen bzw. stärker hypothetischen Konjunktiv wieder; ein indikativisches »kann« bewahrt die rhetorische Frage ohne diese Verschiebung besser. »unter den Geborenen« gibt »natorum« allgemein wieder, ohne es auf Menschen oder Sterbliche einzuengen.
  naturalness: Die revidierte Fassung bleibt würdevoll und verständlich im modernen Standarddeutsch. Die Verbindung mit »dass du mich nach diesen Dingen fragst« ist absichtlich nah am knappen und leicht gespannten lateinischen Satzbau; sie sollte nicht durch eine stärker ausdeutende Zweck- oder Möglichkeitsform ersetzt werden.
  terminology: »Geborenen« erhält die offene Reichweite von »natorum«. »diesen Dingen« entspricht »de his« und ist gegenüber einer verallgemeinernden Wiedergabe wie »solchen Dingen« vorzuziehen.
  issues:
