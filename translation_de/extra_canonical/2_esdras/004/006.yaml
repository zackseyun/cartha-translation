    issue: Die Formel »et respondi et dixi« ist zu »antwortete« verkürzt.
    rationale: Für eine optimal-äquivalente Übersetzung sollte die doppelte Einleitungsformel erhalten bleiben, auch wenn sie im Deutschen formelhaft wirkt.
  - severity: medium
    issue: »könnte« gibt »poterit« als Konjunktiv wieder.
    rationale: Das lateinische Futur ist nicht als irrealer Konditionalsatz markiert. »kann« bildet die rhetorische Unmöglichkeitsfrage im Deutschen idiomatisch ab, ohne eine zusätzliche hypothetische Nuance einzutragen.
