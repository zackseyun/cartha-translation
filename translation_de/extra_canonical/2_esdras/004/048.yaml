  text: I will show you the interpretation of the likeness. And I stood and saw, and behold, a blazing furnace passed before me, and it happened when
translation:
  language: de
  text: 'Ich werde dir die Deutung des Gleichnisses zeigen. Und ich stand da und sah: Siehe, ein brennender Ofen zog vor mir vorüber. Und es geschah, als'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstrabo
  choice: Ich werde … zeigen
  rationale: Gibt das lateinische Futur unmittelbar und natürlich wieder.
- source_word: interpretationem similitudinis
  choice: die Deutung des Gleichnisses
  rationale: „Deutung“ ist im Deutschen für die Erklärung eines bildhaften Geschehens idiomatisch; „Gleichnis“ gibt similitudo in diesem Kontext verständlich wieder.
- source_word: fornax ardens
  choice: ein brennender Ofen
  rationale: Bewahrt das konkrete Bild des lateinischen Textes ohne die Intensität durch einen nicht ausdrücklich belegten Zusatz zu steigern.
- source_word: transiit coram me
  choice: zog vor mir vorüber
  rationale: Gibt die Bewegung von transiit und die räumliche Beziehung von coram me in natürlichem Deutsch wieder.
- source_word: factum est cum
  choice: Und es geschah, als
  rationale: Erhält den im überlieferten Vers bewusst unvollständigen Anschluss an den folgenden Text.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Wortlaut. Die syntaktische Unvollständigkeit am Versende wurde bewahrt, da die Quelle mit „cum“ abbricht und in den Folgevers überleitet.
