  text: And he answered me and said, “Go and ask a pregnant woman whether, when she has completed her nine months, she can still keep the child within her.”
translation:
  language: de
  text: 'Und er antwortete mir und sagte: »Geh und frag eine Schwangere, ob sie, wenn sie ihre neun Monate vollendet hat, das Kind noch in sich behalten kann.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnantem
  choice: eine Schwangere
  rationale: Natürliche und präzise moderne deutsche Bezeichnung für eine schwangere Frau.
- source_word: impleuerit nouem menses suos
  choice: wenn ihre neun Monate vollendet sind
  rationale: Bewahrt die zeitliche Aussage und die Vorstellung einer vollständig abgelaufenen Schwangerschaftsdauer, ohne sie unnötig auszudeuten.
- source_word: adhuc
  choice: noch
  rationale: Gibt die fortdauernde Möglichkeit wieder, die durch die rhetorische Frage geprüft wird.
- source_word: respondit ad me et dixit
  choice: antwortete mir und sagte
  rationale: Erhält die formelhafte Doppelung des lateinischen Erzählstils in verständlichem Deutsch.
