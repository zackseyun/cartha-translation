  source_fidelity: Die Übersetzung gibt praegnantem, respondit ad me et dixit sowie die rhetorische Frage mit adhuc sachgerecht wieder. Die im lateinischen Auszug nur angedeutete Ergänzung („das Kind ... behalten“) entspricht der englischen Auditfassung und ist für den vollständigen deutschen Satz vertretbar.
  naturalness: Der Satz ist insgesamt natürlich und würdig. „wenn ihre neun Monate vollendet sind“ klingt im Deutschen jedoch unidiomatisch und verschiebt die Vollendung von der Frau auf die Monate. „wenn sie ihre neun Monate vollendet hat“ bildet die lateinische Konstruktion genauer und flüssiger nach.
  terminology: „eine Schwangere“ ist modernes Standarddeutsch und passend. „das Kind noch in sich behalten“ gibt die bildhafte Aussage ohne medizinische oder theologische Überdeutung wieder.
