lexical_decisions:
- source_word: profectus sum
  choice: Ich machte mich … auf
  rationale: Gibt das lateinische Perfekt von proficisci natürlich und ohne den unbelegten Zusatz „einst“ wieder.
- source_word: ad siluam lignorum campi
  choice: zu einem Wald aus den Bäumen der Ebene
  rationale: Bewahrt die ungewöhnliche Bildsprache und die Genitivbeziehung des Lateinischen; „Ebene“ gibt campus im Kontext verständlich wieder.
- source_word: cogitauerunt cogitationem
  choice: fassten sie einen Plan
  rationale: Überträgt die lateinische figura etymologica idiomatisch, ohne eine zusätzliche inhaltliche Bestimmung des Plans einzuführen.
- source_word: uenite et eamus et faciamus ad
  choice: Kommt, lasst uns gehen und etwas gegen … tun
  rationale: Gibt die Aufforderungen sowie faciamus ad in natürlichem Deutsch wieder und kennzeichnet zugleich, dass das Bezugswort nach „gegen“ erst im folgenden Vers steht.
