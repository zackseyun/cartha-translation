source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: de
  text: 'und sagte zu mir: „Dein Herz ist in diesem Zeitalter weit hinausgegangen; meinst du, den Weg des Höchsten begreifen zu können?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excedens excessit cor tuum
  choice: Dein Herz ist völlig verwirrt
  rationale: Die figura etymologica verstärkt die Aussage. Im semitisch geprägten Kontext bezeichnet das Überschreiten bzw. Außersichgeraten des Herzens eher geistige Verwirrung oder Überforderung als schuldhaftes Übertreten.
- source_word: in saeculo hoc
  choice: in dieser Welt
  rationale: saeculum kann Zeitalter oder Weltzeit bedeuten; hier steht die gegenwärtige geschaffene Ordnung im Kontrast zum Weg des Höchsten. „Diese Welt“ ist natürlich und wahrt den zeitlich-kosmischen Sinn.
- source_word: comprehendere cogitas
  choice: meinst du da, du könntest … begreifen?
  rationale: Die rhetorische Frage drückt angesichts der zuvor festgestellten Begrenzung einen verneinenden Schluss aus; „meinst du“ gibt cogitas natürlich wieder, ohne die Spannung aufzulösen.
- source_word: uiam altissimi
  choice: den Weg des Höchsten
  rationale: Formale und theologisch offene Wiedergabe; „Weg“ kann sein Handeln, seinen Plan oder seine Ordnung bezeichnen.
theological_decisions:
- issue: Art der Zurechtweisung
  choice: Aussage über Esras begrenztes und verwirrtes Erkenntnisvermögen
  alternative: Vorwurf, Esras Herz sei zu weit gegangen oder habe eine Grenze überschritten
  rationale: Die intensive Konstruktion und der Argumentationsgang vom Unvermögen gegenüber der gegenwärtigen Welt zum noch größeren Unvermögen gegenüber dem Höchsten sprechen für kognitive Überforderung, nicht primär für moralische Anmaßung.
- issue: Bedeutung von „Weg des Höchsten“
  choice: Bildhafte Formulierung beibehalten
  alternative: Als Plan, Ratschluss oder Handeln des Höchsten explizieren
  rationale: Der Ausgangstext lässt den Bezug offen; eine Konkretisierung würde eine mögliche Deutung festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung wird mit „da“ idiomatisch markiert. „Herz“ bleibt als biblisch-anthropologischer Sitz des Denkens erhalten, während „völlig verwirrt“ den gemeinten Zustand verständlich ausdrückt.
