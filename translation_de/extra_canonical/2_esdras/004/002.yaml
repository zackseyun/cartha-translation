  naturalness: „weit hinausgegangen“ ist in modernem Standarddeutsch verständlich und bewahrt den bewusst bildhaften, leicht feierlichen Charakter der Rede. Die Frageformulierung ist natürlich; „da“ ist nicht nötig.
