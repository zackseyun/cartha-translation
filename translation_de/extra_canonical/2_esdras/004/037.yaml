  source_fidelity: Die Wiedergabe von mensurauit sowie der Schlussformel praedicta ist grundsätzlich quellentreu. Allerdings bezeichnet tempora in beiden parallelen Gliedern dasselbe; die Variation zu „Zeitabschnitte“ führt ohne Grundlage im lateinischen Text eine Bedeutungsdifferenz ein. „Verändern“ deutet commouebit stärker als der Bewegungsverbstamm nahelegt.
  naturalness: Die Fassung ist überwiegend modernes, würdiges Deutsch. „Zeiten ... aufrütteln“ bleibt jedoch bildhaft und etwas ungewohnt, was bereits durch das lateinische Bild bedingt ist. „bewegen noch aufrütteln“ bewahrt dieses Bild näher, ohne unverständlich zu werden.
  terminology: „Das Vorhergesagte“ gibt das substantivierte praedicta angemessen wieder und ergänzt kein „Maß“. Die Wiederholung von „Zeiten“ erhält die lateinische Parallelität und vermeidet eine nicht belegte terminologische Unterscheidung.
