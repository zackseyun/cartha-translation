  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: de
  text: Er hat die Zeiten abgemessen und die Zeiten gezählt. Er wird sie weder bewegen noch aufrütteln, bis das Vorhergesagte erfüllt ist.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mensurauit tempora
  choice: hat die Zeiten abgemessen
  rationale: Gibt das Perfekt und das Bild des göttlichen Bemessens direkt und natürlich wieder.
- source_word: numero numerauit tempora
  choice: hat die Zeitabschnitte gezählt
  rationale: Bewahrt die Zählhandlung, vermeidet aber im Deutschen die schwerfällige etymologische Wiederholung »mit einer Zahl gezählt«. »Zeitabschnitte« unterscheidet die zweite Aussage leicht von der ersten, ohne eine sachfremde Präzisierung einzuführen.
- source_word: non commouebit nec excitabit
  choice: wird sie weder verändern noch aufrütteln
  rationale: Gibt die doppelte Negation und die beiden Bewegungsverben wieder. »Verändern« passt idiomatisch zu festgesetzten Zeiten; »aufrütteln« erhält die kräftigere Nuance von excitare.
- source_word: usque dum impleatur praedicta
  choice: bis das Vorhergesagte erfüllt ist
  rationale: Das neutrale Plural praedicta lässt sich substantivisch als »das Vorhergesagte« wiedergeben; dadurch wird kein im Latein nicht ausdrücklich genanntes »Maß« ergänzt.
theological_decisions:
- issue: Bezug der Objekte bei commouebit und excitabit
  choice: »sie« bezieht sich auf die zuvor genannten Zeiten beziehungsweise Zeitabschnitte
  alternative: Die Verben ohne ausdrückliches Objekt wiedergeben
  rationale: Im Latein ist das Objekt elliptisch; der unmittelbare Kontext legt die Zeiten nahe. Das Pronomen ist für natürliches Deutsch erforderlich, ohne den theologischen Sinn weiter festzulegen.
- issue: Deutung von praedicta
  choice: »das Vorhergesagte«
  alternative: »das vorherbestimmte Maß« oder »die angekündigten Dinge«
  rationale: Die gewählte Fassung bewahrt den Gedanken prophetischer Erfüllung und vermeidet sowohl die Ergänzung von »Maß« als auch eine unnötig konkrete Mehrzahl.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ton. Die Parallelstruktur der beiden ersten Satzglieder und die doppelte Verneinung bleiben erhalten; unnötige lateinische Wortwiederholungen werden idiomatisch geglättet.
