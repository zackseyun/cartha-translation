lexical_decisions:
- source_word: Si enim
  choice: Wenn du also
  rationale: „Si“ leitet die Bedingung ein; „enim“ knüpft folgernd an den vorausgehenden Gedankengang an und wird hier natürlich mit „also“ wiedergegeben.
- source_word: eras iudex
  choice: richten würdest
  rationale: Die prädikative Wendung „Richter sein“ wird im modernen Deutschen idiomatisch als Tätigkeit ausgedrückt; der hypothetische Sinn bleibt erhalten.
- source_word: horum
  choice: über diese
  rationale: Das Demonstrativpronomen wird bewusst ohne ergänzendes Substantiv wiedergegeben, da der Text auf zuvor Genanntes verweist und dessen grammatisches Geschlecht im deutschen Versfragment nicht eindeutig festgelegt werden sollte.
