  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
translation:
  language: de
  text: 'und sagten[a]: »Kommt, lasst uns gegen das Meer Krieg führen, damit es vor uns zurückweicht und wir uns andere Wälder schaffen können.« Ebenso fassten auch die Wellen des Meeres einen Plan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Wiedergabe lautete: »und sagten: ›Kommt, lasst uns gegen das Meer Krieg führen, damit es vor uns zurückweicht und wir uns weitere Wälder schaffen können.‹ Ebenso fassten auch die Wellen des Meeres einen Plan,«'
    reason: previous_rendering
lexical_decisions:
- source_word: alias siluas
  choice: andere Wälder
  rationale: Das lateinische »alias« bezeichnet andere Wälder, nicht lediglich eine größere Zahl von Wäldern.
- source_word: ut recedat coram nos
  choice: damit es vor uns zurückweicht
  rationale: Gibt Zweck und räumliche Vorstellung des lateinischen Ausdrucks natürlich und eng am Wortlaut wieder.
- source_word: cogitauerunt
  choice: fassten … einen Plan
  rationale: Im Zusammenhang personifizierter Meereswellen bezeichnet das Verb ein überlegtes Vorhaben; diese idiomatische Wiedergabe wahrt den parallelen Gegenplan.
