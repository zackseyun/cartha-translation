source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: granum seminis mali seminatum est in corde Adam ab initio, et quantum impietatis generauit usque nunc et generabit usque cum ueniat area. Aestima autem apud te granum mali
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: de
  text: Denn von Anfang an wurde ein Korn bösen Samens in Adams Herz gesät. Wie viel Gottlosigkeit hat es bis jetzt hervorgebracht, und wie viel wird es noch hervorbringen, bis die Tenne kommt! Erwäge aber bei dir selbst das Korn des Bösen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: granum seminis mali
  choice: ein Korn bösen Samens
  rationale: Gibt das lateinische Bild formal und zugleich in natürlichem Deutsch wieder; „Samenkorn“ wäre flüssiger, würde aber die Genitivverbindung stärker glätten.
- source_word: in corde Adam
  choice: in Adams Herz
  rationale: Bewahrt das konkrete Herzmotiv als Ort, an dem der böse Same ausgesät wurde.
- source_word: impietatis
  choice: Gottlosigkeit
  rationale: Entspricht der religiös-moralischen Bedeutung von „impietas“ und vermeidet die Abschwächung zu bloßer „Bosheit“.
- source_word: area
  choice: Tenne
  rationale: Bewahrt das landwirtschaftliche und wohl endzeitlich gerichtliche Bild, ohne es durch eine auslegende Umschreibung aufzulösen.
- source_word: Aestima autem apud te
  choice: Bedenke aber bei dir selbst
  rationale: Gibt die Aufforderung zur inneren Erwägung wieder; „aestima“ bezeichnet hier ein Abwägen oder Bedenken.
- source_word: granum mali
  choice: das Korn des Bösen
  rationale: Bewahrt den abrupten, gegenüber „bösem Samen“ leicht variierten Ausdruck des lateinischen Textes und dessen offene Fortführung.
theological_decisions:
- issue: Bedeutung der kommenden „Tenne“
  choice: Das Bild wird wörtlich als „bis die Tenne kommt“ wiedergegeben.
  alternative: „bis die Zeit des Dreschens/Erntens kommt“ oder ausdrücklich „bis zum Gericht“
  rationale: Der lateinische Text nennt lediglich „area“. Die mögliche Anspielung auf das endzeitliche Gericht bleibt erhalten, wird aber nicht vereindeutigt.
- issue: Das Böse in Adams Herz und seine fortwirkende Frucht
  choice: Die kausale Bildsprache von Aussaat und Hervorbringen bleibt bestehen.
  alternative: Eine dogmatische Erklärung als Erbsünde oder vererbte Schuld
  rationale: Der Vers beschreibt den Ursprung und die fortdauernde Wirkung der Gottlosigkeit bildhaft, formuliert jedoch keine ausgearbeitete Lehre über Art oder Übertragung der Sünde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Saat-und-Tenne-Metaphorik. Der Schluss bleibt wie die lateinische Vorlage syntaktisch und gedanklich offen, da der Satz offenbar im folgenden Vers weitergeführt wird.
