  yaml_path: translation/extra_canonical/2_esdras/004/033.yaml
  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: de
  text: 'Da antwortete ich: „Wie lange noch, und wann wird dies geschehen? Warum sind unsere Jahre kurz und schlimm?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  choice: Wie lange noch, und wann wird dies geschehen?
  rationale: Das überlieferte „quo“ ist im Zusammenhang als Frage nach der Dauer beziehungsweise dem zeitlichen Ziel verstanden; „haec“ wird im Deutschen natürlich durch „dies“ mit verbal ergänztem „geschehen“ wiedergegeben. Die Formulierung bewahrt die zwei zeitlichen Fragen des Textes.
- source_word: modici
  choice: so wenige
  rationale: Bei „anni“ bezeichnet „modici“ eine geringe Zahl beziehungsweise kurze Lebensdauer; „wenige“ gibt die quantitative Aussage klar wieder.
- source_word: mali
  choice: so leidvoll
  rationale: Das lateinische „mali“ kann „schlecht“, „böse“ oder „leidvoll“ bedeuten. Auf Lebensjahre bezogen drückt „leidvoll“ natürlich deren von Not geprägten Charakter aus, ohne moralische Bosheit der Jahre zu unterstellen.
theological_decisions:
- issue: Zeitpunkt und Dauer der erwarteten Ereignisse
  choice: Die doppelte Frage „Wie lange noch, und wann“ bleibt erhalten.
  alternative: Nur eine allgemeine Frage wie „Wann wird dies geschehen?“
  rationale: Die sprachliche Spannung zwischen Dauer des Wartens und konkretem Zeitpunkt soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Redewendung „antwortete ich und sagte“ wurde idiomatisch zu „antwortete ich“ gestrafft; der klagende Ton wird durch „Wie lange noch“ und „so leidvoll“ gewahrt.
