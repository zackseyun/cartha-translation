  text: what is above the height of the heavens.” And I answered and said[a], “I beg you, Lord, why has understanding been given to me?”
translation:
  language: de
  text: 'was über der Höhe der Himmel ist.« Da antwortete ich: »Ich bitte dich, Herr: Warum wurde mir die Fähigkeit zu verstehen gegeben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altitudinem caelorum
  choice: Höhe des Himmels
  rationale: Gibt die räumliche Bildsprache des lateinischen Ausdrucks würdevoll und verständlich wieder.
- source_word: deprecor te
  choice: ich bitte dich
  rationale: Entspricht der eindringlichen Bitte, ohne im modernen Deutsch unnötig feierlich oder missverständlich zu wirken.
- source_word: sensus intellegendi
  choice: Verstand
  rationale: Bezeichnet hier die verliehene Fähigkeit zu verstehen; die knappe Wiedergabe ist im Deutschen natürlicher als eine substantivische Doppelung.
theological_decisions:
- issue: Anrede „domine“
  choice: Herr
  alternative: mein Herr
  rationale: Der lateinische Text enthält kein Possessivpronomen; „Herr“ bewahrt daher die formale Offenheit der Anrede.
- issue: Sinn der Frage nach dem verliehenen Verstand
  choice: Warum wurde mir Verstand gegeben?
  alternative: Wozu wurde mir die Fähigkeit zu verstehen gegeben?
  rationale: „ut quid“ kann nach Grund oder Zweck fragen. „Warum“ bewahrt im Deutschen eine ähnliche Offenheit, ohne die theologische Spannung auf einen Zweck festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der am Versanfang stehende Abschluss der vorangehenden Rede wird gemäß der lateinischen Verssegmentierung beibehalten. Das formelhafte „respondi et dixi“ wird natürlich als „Da antwortete ich“ wiedergegeben.
