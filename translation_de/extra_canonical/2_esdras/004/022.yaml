  source_fidelity: Der Versanfang gibt den Abschluss der vorangehenden Rede zutreffend wieder. Allerdings steht im Lateinischen caelorum im Plural, und sensus intellegendi bezeichnet ausdrücklich die Fähigkeit bzw. das Vermögen zu verstehen, nicht lediglich „Verstand“ im allgemeinen Sinn. Die Antwortformel respondi et dixi kann im Deutschen ohne Bedeutungsverlust gestrafft werden.
