lexical_decisions:
- source_word: quam
  choice: als
  rationale: Bewahrt den Vergleichsanschluss an den vorausgehenden, im vorgelegten Quellenausschnitt nicht enthaltenen Satzteil.
- source_word: aduenientes
  choice: nachdem wir gekommen sind
  rationale: Gibt das vorzeitige Partizip verständlich wieder, ohne ein im Latein nicht ausdrücklich genanntes Ziel wie „in die Welt“ oder „ins Dasein“ einzufügen.
- source_word: uiuere in impietatibus
  choice: in Gottlosigkeit zu leben
  rationale: „Gottlosigkeit“ entspricht impietas im religiös-moralischen Sinn; der lateinische Plural wird im Deutschen idiomatisch als Kollektivsingular wiedergegeben.
- source_word: pati
  choice: zu leiden
  rationale: Schlichte und kontextuell natürliche Wiedergabe des Infinitivs.
- source_word: non intelligere de qua re
  choice: ohne zu verstehen, weshalb
  rationale: Gibt den Sinn „nicht verstehen, aus welchem Grund“ in natürlichem Deutsch wieder.
- source_word: proficiscens
  choice: Aufbrechend …
  rationale: Bewahrt das am Versende stehende Partizip und den bewusst unvollständigen Übergang zum folgenden Vers, statt es auszulassen oder voreilig zu einem finiten Satz zu ergänzen.
theological_decisions:
- issue: Bezeichnung von impietas
  choice: Gottlosigkeit
  alternative: Frevel / mangelnde Gottesfurcht
  rationale: „Gottlosigkeit“ hält den Gottesbezug fest, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Ergänzung eines Ziels bei aduenientes
  choice: kein Ziel ergänzt
  alternative: „in die Welt gekommen“ oder „ins Dasein gekommen“
  rationale: Das lateinische Partizip nennt kein Ziel; die offene Formulierung bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anfang und das offene Versende werden entsprechend dem überlieferten lateinischen Ausschnitt beibehalten; die Auslassungspunkte kennzeichnen den syntaktischen Fortgang in den nächsten Vers.
