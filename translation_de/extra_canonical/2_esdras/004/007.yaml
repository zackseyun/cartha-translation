source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: de
  text: 'Und er sagte zu mir: »Wenn ich dich fragen würde: Wie viele Wohnstätten gibt es im Herzen des Meeres? Oder wie viele Wasseradern gibt es am Ursprung der Tiefe? Oder wie viele Wege gibt es über dem Himmelsgewölbe? Oder welches sind die Ausgänge des Paradieses?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische »exitus« kann Ausgänge, Wege hinaus oder Ausflüsse bezeichnen.
    reason: Die genaue räumliche Vorstellung bleibt im Ausgangstext offen.
lexical_decisions:
- source_word: habitationes
  choice: Wohnstätten
  rationale: Gibt den konkreten Sinn von Aufenthalts- oder Wohnorten wieder und bewahrt das rätselhafte Bild im Herzen des Meeres.
- source_word: uenae
  choice: Wasseradern
  rationale: Das lateinische Wort bezeichnet wörtlich Adern und kann im Zusammenhang mit der Tiefe unterirdische Wasserläufe oder Quellen meinen; »Wasseradern« bewahrt Bild und Sachbezug.
- source_word: principium abyssi
  choice: Ursprung der Tiefe
  rationale: Folgt der lateinischen Formulierung eng, ohne festzulegen, ob ein zeitlicher Anfang oder die Quellregion der Tiefe gemeint ist.
- source_word: firmamentum
  choice: Himmelsgewölbe
  rationale: Ist im heutigen Deutsch verständlicher als »Firmament« und vermittelt die antike Vorstellung einer festen Himmelswölbung.
- source_word: exitus paradisi
  choice: Ausgänge des Paradieses
  rationale: Entspricht dem Grundsinn von exitus und lässt offen, ob konkrete Tore, Wege hinaus oder Ausflüsse gemeint sind.
theological_decisions:
- issue: Kosmologische Bildsprache
  choice: Die räumlichen Bilder von Meer, Tiefe, Himmelsgewölbe und Paradies werden unverändert beibehalten.
  alternative: Die Bilder als allgemeine Hinweise auf verborgene Geheimnisse umschreiben.
  rationale: Der Vers stellt bewusst unbeantwortbare kosmologische Fragen; eine erklärende Umdeutung würde seine Spannung und Bildwelt abschwächen.
translation_notes:
  register: Dignige, gut verständliche Standardsprache. Die wiederholten Fragen und die rätselhafte kosmologische Bildsprache bleiben erhalten; der Konditionalsatz wird idiomatisch als nicht eingetretene Voraussetzung formuliert.
