source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ; ita, dominus meus. et respondit mihi et dixit : tres uias missus sum ostendere tibi, et tres similitudines proponere coram te ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/003.yaml
  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: de
  text: 'Und ich sagte: „Ja, mein Herr.“ Da antwortete er mir: „Ich bin gesandt worden, dir drei Wege zu zeigen und dir drei Vergleiche vor Augen zu stellen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ita
  choice: Ja
  rationale: Gibt die bestätigende Antwort im Deutschen natürlich und prägnant wieder.
- source_word: dominus meus
  choice: mein Herr
  rationale: Bewahrt die respektvolle Anrede des lateinischen Textes, ohne sie näher zu bestimmen.
- source_word: tres uias
  choice: drei Wege
  rationale: Entspricht der konkreten Bildsprache des lateinischen Ausdrucks und wahrt eine mögliche übertragene Bedeutung.
- source_word: tres similitudines
  choice: drei Vergleiche
  rationale: Gibt similitudines im Kontext von anschaulichen Gegenüberstellungen verständlich wieder, ohne es vorschnell als Gleichnisse festzulegen.
- source_word: proponere coram te
  choice: dir … vor Augen zu stellen
  rationale: Vermittelt idiomatisch sowohl das Vorlegen als auch das coram te, also die Darstellung vor dem Angesprochenen.
theological_decisions:
- issue: Identität und Rang des Angesprochenen
  choice: „mein Herr“ bleibt als respektvolle Anrede unbestimmt
  alternative: „mein Gebieter“ oder eine ausdrücklich göttliche Anrede
  rationale: Der Vers selbst identifiziert den Angesprochenen nicht näher; die Übersetzung soll diese Offenheit bewahren.
- issue: Art der drei similitudines
  choice: „Vergleiche“
  alternative: „Gleichnisse“ oder „Sinnbilder“
  rationale: „Vergleiche“ hält den Bedeutungsumfang offen und vermeidet eine stärker gattungsspezifische oder deutende Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte lateinische Redeeinleitung „respondit … et dixit“ wird natürlich zu „antwortete er mir“ verdichtet; der Inhalt der direkten Rede bleibt vollständig erhalten.
