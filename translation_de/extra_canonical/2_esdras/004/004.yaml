  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: de
  text: Wenn du mir über eines davon Auskunft gibst[a], werde auch ich dir den Weg zeigen, den du sehen möchtest, und dich lehren, warum das Herz böse ist.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn du mir eines davon darlegst«.'
    reason: Die Bedeutungsbreite von renuntiare umfasst hier sowohl das Mitteilen einer Antwort als auch das Darlegen bzw. Erklären.
lexical_decisions:
- source_word: renunciaueris
  choice: Auskunft gibst
  rationale: Das lateinische Verb bezeichnet hier das Mitteilen bzw. Darlegen einer Antwort. »Auskunft geben« klingt im Deutschen natürlich und bewahrt den direkten Bedingungssatz, ohne ein im Lateinischen nicht ausgedrücktes »können« hinzuzufügen.
- source_word: uiam
  choice: den Weg
  rationale: Entspricht unmittelbar dem lateinischen Akkusativ und wahrt das Bild des Weges.
- source_word: cor malignum
  choice: das Herz böse ist
  rationale: Die knappe lateinische Wendung wird als indirekte Frage mit ergänztem Kopulaverb wiedergegeben. »Herz« und »böse« entsprechen den Grundbedeutungen von cor und malignum.
theological_decisions:
- issue: Art der Aussage über das böse Herz
  choice: warum das Herz böse ist
  alternative: warum es ein böses Herz gibt
  rationale: Die gewählte Fassung folgt der prädikativen Lesart von »quare cor malignum« und vermeidet es, die Wendung unnötig als Existenzfrage zu deuten. Die Kürze des Lateins bleibt dabei erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Latein, wird aber durch »Auskunft geben« idiomatisch formuliert. Das Futur des Hauptsatzes gibt die auf die erfüllte Bedingung folgende Zusage klar wieder.
