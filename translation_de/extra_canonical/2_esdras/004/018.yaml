lexical_decisions:
- source_word: incipiebas iustificare
  choice: würdest du anfangen, zu rechtfertigen
  rationale: Gibt den inzeptiven Gehalt von incipiebas mit Infinitiv wieder, ohne ein nicht ausdrücklich genanntes Objekt zu ergänzen.
- source_word: quem condemnare
  choice: oder wen verurteilen
  rationale: quem ist maskuliner Akkusativ Singular und wird wegen der Personifizierung im Zusammenhang natürlich mit „wen“ wiedergegeben.
- source_word: Et respondi et
  choice: Und ich antwortete und
  rationale: Bewahrt den unvollständigen Anschluss des erhaltenen lateinischen Fragments; „sagte“ wird nicht ergänzt.
theological_decisions:
- issue: Mögliche modale statt inzeptive Bedeutung von incipiebas
  choice: „würdest du anfangen, zu rechtfertigen“
  alternative: „wen würdest du rechtfertigen“
  rationale: Die Übersetzung wahrt die ausdrücklich vorhandene Form von incipere. Die kontextuell mögliche modale Lesart wird in der Fußnote genannt, statt die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abrupte Schlusskonjunktion „und“ bleibt erhalten, weil auch die vorgelegte lateinische Quelle an dieser Stelle fragmentarisch endet.
