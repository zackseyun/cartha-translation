source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'archangelus et dixit: quando impletus fuerit numerus similium uobis, quoniam in statera ponderauit saeculum, Et mensura'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/036.yaml
  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: de
  text: 'Und der Erzengel antwortete und sagte: »Wenn die Zahl derer, die euch ähnlich sind, vollendet sein wird, denn er hat das Zeitalter auf einer Waage gewogen und mit einem Maß …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text bricht hier mit den Worten „und mit einem Maß“ ab; der Satz wird im folgenden Vers fortgesetzt.
    reason: Kennzeichnet den fragmentarischen, versübergreifenden Satz, ohne fehlenden Inhalt zu ergänzen.
lexical_decisions:
- source_word: archangelus
  choice: der Erzengel
  rationale: Gibt den lateinischen Titel unmittelbar und in geläufigem modernem Deutsch wieder; ein Eigenname wird nicht ergänzt, da im vorliegenden Text keiner steht.
- source_word: quando impletus fuerit numerus similium uobis
  choice: Wenn die Zahl derer, die euch gleichen, vollständig geworden ist
  rationale: Bewahrt den Zukunftsbezug des Futur II sowie den pluralischen Bezug von „uobis“, ohne genauer festzulegen, worin die Ähnlichkeit besteht.
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bewahrt den zeitlich-kosmischen Bedeutungsumfang von „saeculum“ besser als das enger mögliche „Welt“.
- source_word: in statera ponderauit
  choice: auf einer Waage gewogen
  rationale: Erhält das konkrete Bild des Wiegens und die abgeschlossene Handlung des lateinischen Perfekts.
- source_word: Et mensura
  choice: und mit einem Maß …
  rationale: Gibt den überlieferten Satzanfang idiomatisch wieder, ohne das im Fragment fehlende Prädikat zu ergänzen.
theological_decisions:
- issue: Identität des Erzengels
  choice: Kein Name wird genannt.
  alternative: „der Erzengel Jeremiel“
  rationale: Der bereitgestellte lateinische Quelltext enthält lediglich „archangelus“; eine traditionelle Identifizierung darf nicht in den Haupttext eingetragen werden.
- issue: Referent von „er“ in „ponderauit“
  choice: Das Pronomen „er“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Explizite Benennung Gottes
  rationale: Der Text setzt den Referenten voraus, nennt ihn in diesem Ausschnitt jedoch nicht; die Übersetzung bewahrt diese Ellipse.
- issue: Bedeutung von „similium uobis“
  choice: „derer, die euch gleichen“
  alternative: „eurer Mitknechte“ oder „der Gerechten wie ihr“
  rationale: Die Quelle bezeichnet weder den Stand noch die moralische oder religiöse Eigenschaft der betreffenden Personen ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Doppelwendung „antwortete und sagte“ folgt der Quellform. Das Satzende bleibt bewusst offen; die Auslassungspunkte und die Fußnote machen den Abbruch transparent.
