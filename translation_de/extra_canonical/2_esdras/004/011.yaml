source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: de
  text: '„Wie kann dein Gefäß den Weg des Höchsten erfassen und die Unvergänglichkeit begreifen, da es doch schon von dem verdorbenen Zeitalter erschöpft ist?“ Als ich dies hörte, fiel ich auf mein Angesicht und sagte zu ihm: „Es wäre besser gewesen, wenn wir nicht existierten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas tuum
  choice: dein Gefäß
  rationale: Bewahrt die konkrete und möglicherweise metaphorische Bildsprache des lateinischen Textes, ohne sie erklärend auf „Verstand“ oder „Fassungsvermögen“ festzulegen.
- source_word: capere
  choice: erfassen
  rationale: Gibt sowohl das geistige Begreifen als auch das Aufnehmen durch ein Gefäß wieder.
- source_word: uiam
  choice: den Weg
  rationale: Die wörtliche Wiedergabe erhält die theologisch offene Bedeutung von Gottes Weg oder Wirkweise.
- source_word: saeculo
  choice: Weltzeit
  rationale: Bezeichnet hier mehr als bloß ein Zeitalter und hält den Zusammenhang mit der gegenwärtigen vergänglichen Weltordnung fest.
- source_word: incorruptionem
  choice: die Unvergänglichkeit
  rationale: Entspricht dem Gegenbegriff zu corrupto und wahrt die abstrakte, eschatologisch offene Aussage.
- source_word: non adesse
  choice: nicht da wären
  rationale: Gibt adesse näher wieder als das stärkere „nicht existieren“ und bewahrt die mögliche Bedeutung „nicht gegenwärtig/zugegen sein“.
theological_decisions:
- issue: Was das „Gefäß“ bezeichnet
  choice: Die Metapher bleibt als „dein Gefäß“ stehen.
  alternative: „dein Verstand“ oder „dein Fassungsvermögen“
  rationale: Der lateinische Wortlaut identifiziert das Gefäß nicht ausdrücklich mit dem Verstand; eine Auflösung würde die genuine Mehrdeutigkeit beseitigen.
- issue: Bedeutung von corrupto saeculo
  choice: „von der vergänglichen Weltzeit zermürbt“
  alternative: „vom verdorbenen Zeitalter zugrunde gerichtet“
  rationale: Die Formulierung hält körperliche Erschöpfung, moralische Verderbnis und die Vergänglichkeit der gegenwärtigen Weltordnung zusammen, ohne eine Dimension exklusiv festzulegen.
- issue: Reichweite von non adesse
  choice: „wenn wir nicht da wären“
  alternative: „wenn wir nicht existierten“
  rationale: Die gewählte Form folgt dem lateinischen adesse enger und vermeidet, die Aussage zwingend als Wunsch nach Nichtexistenz auszulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche Gefäßmetapher und die Spannung zwischen vergänglicher Weltzeit und Unvergänglichkeit bleiben bewusst erhalten. „Auf mein Angesicht“ wahrt den feierlichen biblischen Gestus; die Satzführung bleibt trotz der komplexen Argumentation gut verständlich.
