revisions:
- from: 'Wie kann dein Gefäß den Weg des Höchsten erfassen und, da es bereits von der vergänglichen Weltzeit zermürbt ist, die Unvergänglichkeit begreifen?“ Als ich das hörte, fiel ich auf mein Angesicht und sagte zu ihm: „Es wäre besser gewesen, wenn wir nicht da wären.“'
  to: '„Wie kann dein Gefäß den Weg des Höchsten erfassen und die Unvergänglichkeit begreifen, da es doch schon von dem verdorbenen Zeitalter erschöpft ist?“ Als ich dies hörte, fiel ich auf mein Angesicht und sagte zu ihm: „Es wäre besser gewesen, wenn wir nicht existierten.“'
  rationale: Die Überarbeitung ersetzt die interpretierende Wiedergabe „vergängliche Weltzeit“ durch die quellennahe und natürliche Formulierung „verdorbenes Zeitalter“, ordnet die Begründung flüssig dem Begreifen der Unvergänglichkeit zu und verdeutlicht non adesse als Nichtexistenz statt als bloßes Nicht-anwesend-Sein. Die Metapher des „Gefäßes“, die Bezeichnung „der Höchste“ und die feierliche Geste des Fallens auf das Angesicht bleiben erhalten. Eine Fußnote ist nicht erforderlich.
