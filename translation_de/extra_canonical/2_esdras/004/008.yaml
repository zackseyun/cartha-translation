  text: 'Dicebas fortassis mihi : in abyssum non descendi, neque in infernum adhuc, neque in caelis unquam ascendi.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: de
  text: 'Vielleicht würdest du mir sagen: »Ich bin nicht in den Abgrund hinabgestiegen, auch noch nicht ins Totenreich[a], und ich bin auch nie in den Himmel hinaufgestiegen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hades«.'
    reason: Nennt eine traditionelle Wiedergabe von lateinisch »infernum«, während der Haupttext die im Deutschen transparentere Bezeichnung verwendet.
lexical_decisions:
- source_word: Dicebas fortassis mihi
  choice: Vielleicht würdest du zu mir sagen
  rationale: Das lateinische Imperfekt mit »fortassis« wird als vorsichtig formulierte hypothetische Aussage natürlich und würdig wiedergegeben, ohne sie als tatsächlich vergangene Äußerung festzulegen.
- source_word: abyssum
  choice: Abgrund
  rationale: »Abgrund« gibt den kosmischen Tiefenraum des lateinischen Begriffs präzise wieder und wahrt die Unterscheidung vom folgenden »infernum«.
- source_word: infernum
  choice: Totenreich
  rationale: »Totenreich« vermittelt den gemeinten Aufenthaltsbereich der Toten in verständlichem Deutsch, ohne die griechisch-mythologischen Nebenbedeutungen von »Hades« in den Haupttext zu übernehmen.
- source_word: caelis
  choice: Himmel
  rationale: Obwohl die lateinische Form pluralisch ist, bezeichnet »Himmel« im Deutschen diesen kosmischen Bereich idiomatisch; »in die Himmel« wäre hier unnötig fremdsprachlich geprägt.
theological_decisions:
- issue: Benennung des Bereichs der Toten
  choice: Totenreich
  alternative: Hades
  rationale: Der überlieferte lateinische Ausdruck »infernum« steht zwischen »Abgrund« und »Himmel« als kosmische Ortsbezeichnung. »Totenreich« wahrt diese Vorstellung neutral; »Hades« bleibt als mögliche traditionsgeschichtliche Wiedergabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache räumliche Gegenüberstellung von Abgrund, Totenreich und Himmel sowie die Abstufung durch »noch nicht« und »nie« bleiben erhalten.
