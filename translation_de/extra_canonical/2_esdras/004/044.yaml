  source_fidelity: 'Der deutsche Text gibt den vollständig erhaltenen lateinischen Fragmenttext genau wieder: „Et respondi et dixi“ entspricht „Und ich antwortete und sagte“, und „si inueni gratiam ante oculos tuos“ wird idiomatisch-biblisch als „Wenn ich Gnade vor deinen Augen gefunden habe“ wiedergegeben. Das abschließende „et si“ bleibt ebenso unabgeschlossen; es werden keine nicht belegten Ergänzungen eingefügt.'
