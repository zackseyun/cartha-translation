lexical_decisions:
- source_word: sta
  choice: Stell dich
  rationale: Der lateinische Imperativ bezeichnet hier das Einnehmen eines Standorts; „Stell dich“ ist im modernen Deutschen natürlicher als das statischere „Steh“.
- source_word: super dexteram partem
  choice: auf die rechte Seite
  rationale: Gibt die räumliche Anweisung klar und nah am lateinischen Wortlaut wieder, ohne eine nicht ausgedrückte symbolische Bedeutung einzutragen.
