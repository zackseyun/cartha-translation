source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et oravi et dixi: putas vivo usque in diebus illis, vel quiserit in diebus illis? respondit ad me et dixit: de signis de quibus me'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: de
  text: 'Und ich betete und sagte: »Meinst du, dass ich bis zu jenen Tagen leben werde? Oder wer wird in jenen Tagen leben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: putas
  choice: Meinst du
  rationale: Gibt die direkte Frage natürlich und ohne zusätzliche Gewissheitsnuance wieder.
- source_word: vivo usque in diebus illis
  choice: dass ich bis zu jenen Tagen leben werde
  rationale: Das offenbar fehlerhafte oder verkürzte Latein wird entsprechend dem klaren Sinn der Frage idiomatisch wiedergegeben; »bis zu« entspricht der zeitlichen Zielangabe.
- source_word: quis erit in diebus illis
  choice: wer wird in jenen Tagen leben
  rationale: Das im bereinigten Text zusammengeschriebene »quiserit« wird als »quis erit« verstanden. Das ergänzte »leben« macht im Deutschen den aus dem ersten Fragesatz fortwirkenden Sinn deutlich.
theological_decisions:
- issue: Identität der Menschen in den angekündigten Tagen
  choice: Die offene Frage »wer« bleibt bestehen.
  alternative: »Was für Menschen werden in jenen Tagen leben?«
  rationale: Der lateinische Wortlaut fragt schlicht »quis«; eine nähere Bestimmung der gemeinten Personengruppe würde die eschatologische Offenheit unnötig einschränken.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und fragend; »jene Tage« bewahrt den eschatologischen, aber nicht näher aufgelösten Bezug des Ausgangstextes. Der am Ende überlieferte Beginn der Antwort (»respondit … de signis de quibus me«) gehört offenbar zum folgenden Vers und wurde entsprechend der angegebenen Versabgrenzung nicht aufgenommen.
