  source_fidelity: 'Die landwirtschaftliche Metaphorik wird zutreffend bewahrt: *seminatum est* bezeichnet die erfolgte Aussaat, *destrictio* ist hier im Zusammenhang mit dem anschließenden *messum fuerit* als Ernte/Einbringung zu verstehen, nicht als „Vernichtung“. Der unvollständige Bedingungssatz am Versende bleibt erhalten.'
