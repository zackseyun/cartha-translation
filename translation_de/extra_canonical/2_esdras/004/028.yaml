source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
translation:
  language: de
  text: Denn das Böse, über das du mich fragst, ist ausgesät worden, und die Zeit seiner Ernte ist noch nicht gekommen. Wenn es also nicht abgeerntet wird,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Seminatum est
  choice: ist ausgesät worden
  rationale: Bewahrt das landwirtschaftliche Bild und gibt das lateinische Perfektpassiv genau und natürlich wieder.
- source_word: malum
  choice: das Böse
  rationale: Die substantivische Wiedergabe lässt offen, ob das Böse als Macht, Zustand oder Gesamtheit böser Taten gemeint ist.
- source_word: destrictio ipsius
  choice: seine Ernte
  rationale: „Destrictio“ ist hier im Sinn des Aberntens beziehungsweise Einbringens zu verstehen; der folgende Satz mit „messum“ bestätigt das durchgehende Bild von Aussaat und Ernte.
- source_word: messum fuerit
  choice: geerntet wird
  rationale: Gibt das Futurperfekt Passiv im deutschen Konditionalsatz idiomatisch wieder und setzt die Erntemetaphorik fort.
theological_decisions:
- issue: Verhältnis zwischen gegenwärtigem Bösen und kommender Ernte
  choice: Die zeitliche Spannung bleibt als Aussaat, noch ausstehende Ernte und bedingter Folgesatz stehen.
  alternative: „Vernichtung“ statt „Ernte“
  rationale: „Vernichtung“ würde die Metapher unterbrechen und eine bestimmte Deutung des Gerichts stärker festlegen, als es der Quellenwortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers endet wie die lateinische Vorlage mitten in einem Konditionalsatz, der im folgenden Vers fortgesetzt wird.
