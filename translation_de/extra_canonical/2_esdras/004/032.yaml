base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/032.yaml
  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
translation:
  language: de
  text: 'Wenn unzählige Ähren gesät worden sind, was für eine große Tenne werden sie da zu bilden beginnen! Da antwortete ich[a] und sagte: »Bis wann –«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im lateinischen Text eine gemischte Form: „Da antwortete er, und ich sagte“. Wahrscheinlich ist beim ersten Verb ebenfalls „ich antwortete“ gemeint.'
    reason: textual_grammar
lexical_decisions:
- source_word: seminatae fuerint
  choice: gesät worden sind
  rationale: Das lateinische Futur II Passiv steht in einem vorausblickenden Temporalsatz. Im heutigen Deutschen gibt das Perfekt nach „wenn“ denselben Zukunftsbezug natürlicher wieder.
- source_word: spicae quarum non est numerus
  choice: unzählige Ähren
  rationale: Die knappe deutsche Wendung gibt den Relativsatz wörtlich dem Sinn nach wieder, ohne die Bildsprache der Ähren durch „Saat“ oder „Getreide“ zu ersetzen.
- source_word: aream
  choice: Tenne
  rationale: Im landwirtschaftlichen Bild bezeichnet area den Dreschplatz beziehungsweise die Tenne; „Tenne“ ist hier prägnant und verständlich.
- source_word: incipient facere
  choice: werden sie da zu bilden beginnen
  rationale: Die Formulierung bewahrt sowohl den Beginnsaspekt von incipient als auch das allgemeine facere, statt unbelegt „füllen“ einzusetzen.
- source_word: usque-
  choice: Bis wann –
  rationale: Das abgebrochene usque- eröffnet sehr wahrscheinlich eine Frage nach der Dauer. Der Gedankenstrich bewahrt den fragmentarischen Versschluss.
theological_decisions:
- issue: Sprecherwechsel in „Et respondit et dixi“
  choice: Da antwortete ich und sagte
  alternative: Da antwortete er, und ich sagte
  rationale: Die überlieferte Wortfolge mischt die dritte Person respondit mit der ersten Person dixi. Der Zusammenhang und das einheitliche Antwortformular sprechen für einen Sprecher in der ersten Person; die Abweichung wird jedoch ausdrücklich in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche Bild von gesäten Ähren und einer sich bildenden Tenne bleibt erhalten; der fragmentarische Schluss wird nicht ergänzt.
