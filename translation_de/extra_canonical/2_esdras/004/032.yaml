review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von *seminatae fuerint*, *spicae quarum non est numerus*, *aream* und *incipient facere* ist im Wesentlichen sachgerecht. Der Haupttext darf jedoch die auffällige Personenmischung in „Et respondit et dixi“ nicht stillschweigend zu „ich antwortete“ emendieren. Auch „Bis wann“ legt die Bedeutung des abgebrochenen *usque-* stärker fest, als der überlieferte Fragmentbeginn erlaubt.
  naturalness: „Unzählige Ähren“ und „Tenne“ sind gutes modernes, zugleich würdiges Deutsch. „werden sie da zu bilden beginnen“ ist zwar verständlich, aber etwas schwerfällig; „die sie zu bilden beginnen“ ist flüssiger und bewahrt den Beginnsaspekt.
  terminology: „Ähren“ für *spicae* und „Tenne“ für *area* sind passend. Der fragmentarische Schluss sollte mit „Bis …“ offen bleiben, ohne eine Frage nach der Dauer vorwegzunehmen.
  issues:
  - severity: high
    issue: Unbezeichnete Emendation des Sprecherwechsels
    rationale: 'Der Entwurf ersetzt das überlieferte „respondit“ (3. Person Singular: „er antwortete“) durch „ich antwortete“. Die Fußnote benennt dies zwar, aber der Haupttext entscheidet sich dennoch für eine nicht im Wortlaut gedeckte Konjektur. Bei einer textlich auffälligen und möglicherweise verderbten Stelle ist die Ambiguität im Haupttext zu bewahren.'
  - severity: medium
    issue: „Bis wann“ ist zu spezifisch für das Fragment „usque-“
    rationale: Das erhaltene *usque-* kann in diesem Fragment nicht sicher zu einer Zeitfrage ergänzt werden. „Bis …“ gibt den abgebrochenen Wortanfang wieder, ohne eine bestimmte Fortsetzung festzulegen.
  - severity: low
    issue: Schwerfällige Wiedergabe von „incipient facere“
    rationale: „werden sie da zu bilden beginnen“ ist unnötig umständlich. Eine Relativformulierung klingt natürlicher und erhält sowohl die Größe der Tenne als auch den inchoativen Aspekt.
  revised_text: 'Wenn unzählige Ähren gesät worden sind, wie groß wird die Tenne sein, die sie zu bilden beginnen! Da antwortete er, und ich sagte: »Bis …«'
  revised_footnotes:
  - marker: a
    text: 'Der lateinische Text lautet wörtlich: „Da antwortete er, und ich sagte“. Die Verbindung der dritten Person („er antwortete“) mit der ersten Person („ich sagte“) ist im überlieferten Text auffällig; eine sichere Korrektur ist nicht möglich.'
    reason: textual_grammar
  revision_rationale: Der Sprecherwechsel wird nicht konjektural geglättet, sondern mitsamt seiner textlichen Schwierigkeit transparent wiedergegeben. Der abgebrochene Schluss bleibt offen. Die Formulierung zur Tenne wird idiomatischer gestaltet, ohne die Bildsprache oder den Beginnsaspekt von *incipient* zu verlieren.
