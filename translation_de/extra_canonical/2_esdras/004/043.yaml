  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: de
  text: Sie beeilen sich, das zurückzugeben, was von Anfang an anvertraut worden ist. Dann wird dir gezeigt, was du zu sehen begehrst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant reddere
  choice: Sie beeilen sich, ... zurückzugeben
  rationale: Gibt sowohl die Eile von „festinant“ als auch den Rückgabeaspekt von „reddere“ natürlich und genau wieder.
- source_word: ea quae commendata sunt
  choice: was ihnen ... anvertraut wurde
  rationale: „commendare“ bezeichnet hier das Anvertrauen beziehungsweise Übergeben zur Verwahrung; das ergänzte „ihnen“ macht den im lateinischen Passiv vorausgesetzten Bezug im Deutschen verständlich.
- source_word: ab initio
  choice: von Anfang an
  rationale: Bewahrt die zeitliche Wendung des lateinischen Textes ohne unnötige Präzisierung.
- source_word: concupiscis uidere
  choice: du zu sehen begehrst
  rationale: „begehren“ erhält die stärkere Intensität von „concupiscere“ und passt zum würdevollen Register.
