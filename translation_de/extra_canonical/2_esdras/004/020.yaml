  text: to me and said, “You have judged rightly, so why have you not judged for yourself?”
translation:
  language: de
  text: 'zu mir und sagte: „Du hast richtig geurteilt. Warum hast du dann nicht für dich selbst geurteilt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene tu iudicasti
  choice: Du hast richtig geurteilt
  rationale: „bene“ bewertet hier das vorausgehende Urteil als zutreffend; „richtig“ ist im modernen Deutschen natürlicher als das wörtlichere „gut“.
- source_word: et quare
  choice: Warum … dann
  rationale: Das lateinische „et“ verbindet die Rückfrage folgernd mit der Feststellung. Im Deutschen gibt „dann“ diesen Zusammenhang natürlich wieder.
- source_word: tibi
  choice: für dich selbst
  rationale: Der Dativ wird bewusst nicht zu „über deinen eigenen Fall“ präzisiert. So bleibt die knappe, möglicherweise reflexive Bedeutung des Lateinischen erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der überlieferte Vers setzt mitten im Satz mit „zu mir“ ein; diese Anschlussform wird beibehalten. Die direkte Rede ist klar und natürlich formuliert, ohne die Mehrdeutigkeit von „tibi“ unnötig aufzulösen.
