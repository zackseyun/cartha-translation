id: 2ES.4.23
reference: 2 Esdras 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: de
  text: 'Denn ich wollte nicht nach den höheren Wegen fragen, sondern nach dem, was täglich über uns ergeht[a]: Warum ist Israel den Völkern zur Schmach preisgegeben? Warum ist das Volk, das du geliebt hast, gottlosen Stämmen preisgegeben? Und warum ist das Gesetz unserer Väter zunichtegemacht worden?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was täglich unter uns geschieht“.'
    reason: Das lateinische „quae pertranseunt per nos cotidie“ lässt sich als das Israel Widerfahrende oder allgemeiner als das täglich in seiner Mitte Geschehende verstehen.
lexical_decisions:
- source_word: superioribus uiis
  choice: den höheren Wegen
  rationale: Die vergleichende Bedeutung von „superioribus“ und das Bild der „Wege“ bleiben erhalten, ohne den schwer deutbaren Ausdruck vorschnell auf himmlische Geheimnisse festzulegen.
- source_word: quae pertranseunt per nos cotidie
  choice: was täglich über uns ergeht
  rationale: Die deutsche Wendung gibt die wahrscheinlich semitisch geprägte Bedeutung von Geschehnissen wieder, die Israel täglich treffen, und bewahrt zugleich etwas vom Bewegungsbild des lateinischen Ausdrucks.
- source_word: in obprobrium gentibus
  choice: den Völkern zur Schmach
  rationale: „Schmach“ entspricht „obprobrium“ und bezeichnet Israels entehrenden Zustand vor den Völkern.
- source_word: tribubus impiis
  choice: gottlosen Stämmen
  rationale: Die direkte Wiedergabe wahrt sowohl die soziale Bezeichnung „tribubus“ als auch das religiös-moralische Urteil „impiis“.
- source_word: in inritum deducta
  choice: zunichtegemacht worden
  rationale: Die Formulierung bringt zum Ausdruck, dass das Gesetz wirkungslos gemacht beziehungsweise seiner Geltung beraubt wurde, ohne genauer festzulegen, auf welche Weise dies geschah.
theological_decisions:
- issue: Bezug der „höheren Wege“
  choice: Die bildhafte und mehrdeutige Formulierung bleibt stehen.
  alternative: „die himmlischen Wege“ oder „die Wege dort oben“
  rationale: Der lateinische Text sagt nicht ausdrücklich „himmlisch“. Eine Konkretisierung würde die kosmologische Bedeutung stärker festlegen, als es die Quelle erlaubt.
- issue: Status des Gesetzes der Väter
  choice: „zunichtegemacht worden“
  alternative: „außer Kraft gesetzt worden“
  rationale: Die gewählte Formulierung bewahrt die Klage über die faktische Wirkungslosigkeit des Gesetzes, ohne dogmatisch zu behaupten, Gott habe seine normative Geltung aufgehoben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei inhaltlichen Klagen wurden als parallele Fragen gesetzt; damit wird das im lateinischen „propter quod“ gebündelte Warum sprachlich klar entfaltet.
