source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: suis dicentes, usquequo spero sic? et quando uenit fructus areae mercedis nostrae? Et respondit ad eas Hieremiel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/035.yaml
  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: de
  text: 'Haben nicht die Seelen der Gerechten in ihren Kammern[a] danach gefragt und gesagt: »Wie lange soll ich noch so hoffen[b]? Und wann kommt die Frucht von der Tenne unseres Lohns?« Da antwortete ihnen Jeremiel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild der Seelen in »Kammern« weist auf den Vergleich mit der Geburt in den Versen 40–42 voraus: Sie werden an vorbehaltenen Orten bewahrt, bis die festgesetzte Zahl vollständig ist.'
    reason: cross_reference
  - marker: b
    text: 'Der lateinische Text hat hier den Singular »ich hoffe«, obwohl mehrere Seelen sprechen und gleich darauf von »unserem Lohn« die Rede ist. Andere alte Sprachfassungen lesen sinngemäß: »Wie lange sollen wir noch so hoffen?«'
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: in ihren Kammern
  rationale: Das überlieferte „suis“ („in ihren/eigenen“) setzt ein zuvor genanntes oder im Überlieferungsgang ausgefallenes Substantiv voraus. „Kammern“ gibt den aus dem Zusammenhang erschließbaren Aufenthaltsort der Seelen natürlich wieder, ohne das Bild unnötig auf „Vorratshäuser“ festzulegen.
- source_word: usquequo spero sic?
  choice: Wie lange soll ich noch so hoffen?
  rationale: Die erste Person Singular von „spero“ wird trotz der Mehrzahl der redenden Seelen bewahrt. „noch so“ gibt die anhaltende, bedrängte Erwartung idiomatisch wieder.
- source_word: fructus areae mercedis nostrae
  choice: die Frucht von der Tenne unseres Lohns
  rationale: Die ungewöhnliche Bildfolge von Frucht, Tenne und Lohn bleibt erhalten. „von der Tenne“ ist im Deutschen verständlicher als eine schwer lesbare Kette von Genitiven.
- source_word: Hieremiel
  choice: Jeremiel
  rationale: Die Namensform wird in einer im Deutschen geläufigen Transkription wiedergegeben.
theological_decisions:
- issue: Aufenthaltsort der Seelen der Gerechten
  choice: Kammern
  alternative: Vorratskammern / Aufbewahrungsorte
  rationale: „Kammern“ wahrt das Bild eines bis zum bestimmten Zeitpunkt vorbehaltenen Ortes, ohne eine detaillierte Lehre über den Zwischenzustand einzutragen.
- issue: Numerus in der Klage der Seelen
  choice: 'Singular: „ich … hoffe“'
  alternative: 'Plural: „wir … hoffen“'
  rationale: Der lateinische Hauptzeuge hat ausdrücklich „spero“ im Singular. Obwohl der Pluralkontext und andere Versionen für den Plural sprechen können, wird die echte textliche Spannung nicht stillschweigend beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage, die ungewöhnliche Ernte- und Lohnmetapher sowie der im Lateinischen bezeugte Wechsel vom Plural zum Singular bleiben erhalten. Der abschließende Doppelpunkt zeigt, dass Jeremiels Antwort im folgenden Vers weitergeht.
