  terminology: »Seelen der Gerechten«, »Tenne«, »Lohn« und »Jeremiel« sind konsistent, verständlich und registergerecht. Die Fußnote zum Singular dokumentiert die relevante textliche Spannung, ohne die Übersetzung stillschweigend in eine harmonisierte Pluralform zu ändern.
