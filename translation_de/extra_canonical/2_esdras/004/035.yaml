  source_fidelity: Die Übersetzung gibt die rhetorische Frage, die Seelen der Gerechten als Subjekt, den auffälligen Singular in »spero«, die Ernte-/Tennenmetapher und Jeremiels einsetzende Antwort zuverlässig wieder. »Kammern« ist für den im Kontext vorauszusetzenden Aufenthaltsort angemessen und legt die Bedeutung von *promptuariis suis* nicht unnötig stärker als nötig fest.
