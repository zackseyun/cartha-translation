translation:
  language: de
  text: Barmherzigkeit zu erlangen. Doch was wird er für seinen Namen tun, der[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im nächsten Vers fortgesetzt.
    reason: Die lateinische Vorlage dieses Verses endet mit dem Relativpronomen „quod“; der zugehörige Relativsatz steht in Vers 26.
lexical_decisions:
- source_word: misericordiam consequi
  choice: Barmherzigkeit zu erlangen
  rationale: Gibt den lateinischen Infinitivausdruck eng und in würdigem, verständlichem Deutsch wieder; der Satz beginnt aufgrund der vorgegebenen Versgrenze als Fortsetzung.
- source_word: Sed quid faciet nomini suo
  choice: Doch was wird er für seinen Namen tun
  rationale: Das lateinische Dativgefüge „nomini suo“ wird im Deutschen natürlich mit „für seinen Namen“ wiedergegeben.
- source_word: quod
  choice: der
  rationale: Das Relativpronomen bezieht sich grammatisch auf „nomini“ und bleibt entsprechend der Quelle am Versende unvollständig; die Fortsetzung gehört zum nächsten Vers.
theological_decisions:
- issue: Bedeutung von „seinem Namen“
  choice: Wörtlich „für seinen Namen“ beibehalten
  alternative: Deutend etwa „um seines Namens willen“ oder „zum Schutz seines Ansehens“
  rationale: Die Quelle fragt offen, was Gott für seinen Namen tun wird; eine theologische oder idiomatische Auflösung würde die im Text vorhandene Spannung vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Fragment am Versanfang und der offene Relativsatz am Versende werden aus Gründen der strengen Versabgrenzung bewahrt.
