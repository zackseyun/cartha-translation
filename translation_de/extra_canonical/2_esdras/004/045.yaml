source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possibile est, et si idoneus sum, Demonstra mihi et hoc, si plus quam praeteriit habet uenire, aut plura pertransierunt super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: de
  text: 'Wenn es möglich ist und ich dafür geeignet bin, dann zeige mir auch dies: ob mehr kommen wird, als vergangen ist, oder ob mehr über … hinweggegangen ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich endet der lateinische Vers: „oder ob mehr über … hinweggegangen ist“. Das dazugehörige „uns“ steht nach der überlieferten Verseinteilung am Anfang des folgenden Verses.'
    reason: Die Auslassung bewahrt die am Ende des lateinischen Verses offene Konstruktion, ohne ein nicht vorhandenes Bezugsobjekt wie „darüber“ einzufügen.
lexical_decisions:
- source_word: possibile est
  choice: wenn es möglich ist
  rationale: Gibt die unpersönliche Möglichkeitsformel natürlich und eng am Lateinischen wieder.
- source_word: idoneus sum
  choice: ich dafür geeignet bin
  rationale: „Geeignet“ bewahrt die offene Bedeutung von idoneus, ohne durch „würdig“ unnötig eine religiös-moralische Deutung einzutragen.
- source_word: si plus quam praeteriit habet uenire
  choice: ob mehr kommen wird, als vergangen ist
  rationale: Gibt die Vergleichsstruktur idiomatisch wieder; habet venire bezeichnet das noch Bevorstehende.
- source_word: plura pertransierunt super
  choice: mehr darüber hinweggegangen ist
  rationale: Bewahrt pertransire super und die im vorliegenden Vers unvollständige Konstruktion, statt das aus dem Folgevers zu erschließende Objekt in den Haupttext einzufügen.
theological_decisions:
- issue: Bedeutung von idoneus
  choice: geeignet
  alternative: würdig
  rationale: Der lateinische Ausdruck bezeichnet hier zunächst Befähigung oder Eignung; eine Aussage über geistliche Würdigkeit wäre eine mögliche, aber nicht zwingende Zuspitzung.
- issue: Ergänzung eines Objekts nach super
  choice: keine Ergänzung im Haupttext
  alternative: „über uns hinweggegangen“
  rationale: Der bereitgestellte Vers endet mit super. „Uns“ gehört nach der überlieferten Versabgrenzung zum Beginn des folgenden Verses; die Übersetzung wahrt daher die formale Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallelen Zeitfragen bleiben knapp; die durch die lateinische Versgrenze entstandene Unvollständigkeit wird im Haupttext bewahrt und in der Fußnote erklärt.
