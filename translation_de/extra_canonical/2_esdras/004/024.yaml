  source_fidelity: Die Übersetzung gibt die Reihung, das Bild der Heuschrecken, die Vergänglichkeit des Lebens als »Dunst« und den offenen Satzanschluss mit Schlusskomma zuverlässig wieder. »Zeitalter« ist für saeculum vertretbar; die Richtung der Konstruktion pertransimus de saeculo wird nicht überdeutet. Die pluralische Wiedergabe von dispositionis scriptae folgt dem englischen Audit-Trail, obwohl die überlieferte lateinische Form in dieser Edition auffällig ist, und wahrt damit die beabsichtigte Offenheit.
  naturalness: »schriftlich festgehaltenen Ordnungen« ist verständlich, wirkt im modernen Deutschen jedoch unnötig umschreibend und administrativ. »schriftlichen Ordnungen« ist knapper, idiomatischer und ebenso bedeutungstreu.
  terminology: »Ordnungen«, »Zeitalter«, »Heuschrecken«, »Dunst« und »würdig« sind registergerecht und theologisch nicht einengend. Die Fußnote bleibt als vorsichtige historische Einordnung formuliert und ist korrekt unmittelbar an der Aussage über die nicht auffindbaren Ordnungen verankert.
