id: 2ES.4.24
reference: 2 Esdras 4:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: de
  text: und die schriftlichen Ordnungen sind nirgends zu finden.[a] Wir ziehen durch dieses Zeitalter wie Heuschrecken, unser Leben ist wie Dunst, und wir sind nicht würdig,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dass „die schriftlichen Ordnungen nirgends zu finden“ sind, meint wahrscheinlich, dass Israels maßgebliche schriftliche Ordnung infolge der Katastrophe faktisch verloren gegangen oder unwirksam geworden ist; es muss nicht heißen, dass jede Handschrift physisch verschwunden war.
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  choice: die schriftlich festgehaltenen Ordnungen
  rationale: Gibt die schriftlich fixierte, maßgebliche Ordnung wieder, ohne den Singular der lateinischen Abstraktform im Deutschen unnatürlich nachzubilden.
- source_word: pertransimus de saeculo
  choice: wir ziehen durch dieses Zeitalter
  rationale: Bewahrt den Gedanken des Durchschreitens und gibt saeculum hier als gegenwärtiges Zeitalter wieder; die ungewöhnliche Verbindung mit de bleibt in ihrer Richtung offen.
- source_word: locustae
  choice: Heuschrecken
  rationale: Direkte und geläufige Entsprechung des lateinischen Bildworts.
- source_word: uapor
  choice: Dunst
  rationale: Bezeichnet etwas Flüchtiges und rasch Vergehendes und bewahrt das konkrete Bild knapper als eine erklärende Umschreibung.
- source_word: nec digni sumus
  choice: wir sind nicht würdig
  rationale: Formale, theologisch offene Wiedergabe; das folgende Komma zeigt, dass die Aussage im nächsten Vers weitergeführt wird.
theological_decisions:
- issue: Bedeutung der nicht auffindbaren schriftlichen Ordnungen
  choice: Der Haupttext lässt offen, ob Texte physisch verloren gingen oder ihre verbindliche Ordnung unter der Katastrophe faktisch aufgehoben war.
  alternative: Als vollständiges Verschwinden sämtlicher Handschriften verstehen.
  rationale: Der lateinische Wortlaut sagt nur, dass sie nirgends zu finden sind, und entscheidet nicht zwischen materiellem Verlust und wirksamer Außerkraftsetzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang und das Schlusskomma bewahren den fragmentarischen Anschluss an den Kontext. Das wiederholte lateinische et wird teilweise durch deutsche Satzfügung geglättet, ohne die Reihung der Klage aufzulösen.
