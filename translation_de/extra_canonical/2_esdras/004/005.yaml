  text: 'Et dixi : loquere, dominus meus. et dixit ad me : uade, pondera mihi ignis pondus, aut mensura mihi satum uenti, aut reuoca mihi diem quae praeteriit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
translation:
  language: de
  text: 'Und ich sagte: »Sprich, mein Herr.« Da sagte er zu mir: »Geh, wäge mir das Gewicht des Feuers, oder miss mir das Maß des Windes[a], oder rufe mir den vergangenen Tag zurück.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Wendung, die mit »miss mir das Maß des Windes« wiedergegeben ist, ist textlich schwierig. Gemeint ist eindeutig die unmögliche Aufgabe, den Wind zu bemessen; welche Maßeinheit dem Wortlaut genau zugrunde liegt, ist jedoch unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: loquere
  choice: Rede
  rationale: Der Imperativ wird knapp und unmittelbar wiedergegeben.
- source_word: pondera mihi ignis pondus
  choice: wäge mir das Gewicht des Feuers
  rationale: Bewahrt die absichtliche Wiederholung von Verb und Substantiv sowie die unmögliche Aufgabe.
- source_word: mensura mihi satum uenti
  choice: miss mir das Maß des Windes
  rationale: Gibt den klaren Sinn der schwierigen lateinischen Wendung wieder, ohne eine nicht sicher bestimmbare Maßeinheit festzulegen.
- source_word: reuoca mihi diem quae praeteriit
  choice: rufe mir den vergangenen Tag zurück
  rationale: Eine natürliche deutsche Formulierung, die Bild und Unmöglichkeit der Aufforderung erhält.
