  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: animarum matrici adsimilata sunt. Quemadmodum enim festinabit quae parit effugere necessitatem partus, sic et haec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/042.yaml
  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: de
  text: Sie werden mit dem Mutterschoß der Seelen verglichen. Denn wie eine Gebärende sich beeilt, der Not der Geburt[a] zu entkommen, so auch diese.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „dem Zwang der Geburt“.'
    reason: Das lateinische necessitas kann hier sowohl die Bedrängnis als auch die unausweichliche Notwendigkeit des Geburtsvorgangs hervorheben.
lexical_decisions:
- source_word: matrici
  choice: Mutterschoß
  rationale: Das lateinische matrix bezeichnet hier bildhaft den Ort, der Seelen in sich trägt; „Mutterschoß“ bewahrt das Geburtsbild und klingt im modernen Deutsch natürlicher als „Gebärmutter“.
- source_word: necessitatem partus
  choice: Not der Geburt
  rationale: necessitas kann sowohl Zwang beziehungsweise Unausweichlichkeit als auch Bedrängnis bezeichnen. „Not“ hält die Härte und den Drang, ihr zu entkommen, fest, ohne den Ausdruck auf bloß logische Notwendigkeit zu verengen.
- source_word: festinabit
  choice: sich beeilt
  rationale: Das lateinische Futur steht in einem allgemeinen Vergleich; das deutsche Präsens gibt eine solche allgemeine Aussage idiomatisch wieder.
- source_word: haec
  choice: diese
  rationale: Das substantivisch gebrauchte neutrale Pluralpronomen bleibt ohne Ergänzung, da der vorgelegte Ausschnitt seinen Bezug nicht ausdrücklich nennt.
theological_decisions:
- issue: Bezug von haec
  choice: „diese“ ohne erklärendes Substantiv
  alternative: eine aus dem weiteren Zusammenhang erschlossene Bezeichnung einsetzen
  rationale: Der lateinische Ausschnitt lässt den konkreten Bezug offen. Eine Ergänzung würde die im Quellentext vorhandene Unbestimmtheit unzulässig auflösen.
- issue: Bild vom „Mutterschoß der Seelen“
  choice: Die Metapher wird unmittelbar beibehalten
  alternative: deutende Umschreibung als Aufenthalts- oder Aufbewahrungsort der Seelen
  rationale: Die bildhafte und möglicherweise theologisch spannungsreiche Formulierung des Quellentextes soll nicht durch eine erklärende Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt entsprechend dem vorgelegten lateinischen Ausschnitt am Ende syntaktisch offen; es wird kein im Ausschnitt fehlendes Folgematerial ergänzt.
