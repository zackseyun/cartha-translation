  text: Was mit dir herangewachsen ist, kannst du nicht erkennen; wie wirst du dann … können?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tecum coadulescentia
  choice: was mit dir herangewachsen ist
  rationale: Die substantivierte Form bezeichnet die Dinge bzw. Gegebenheiten, die zugleich mit dem Angesprochenen herangewachsen sind. Die Formulierung bewahrt die Bildlichkeit und vermeidet eine unnötige Festlegung.
- source_word: cognoscere
  choice: erkennen
  rationale: „Erkennen“ gibt den weiten Bedeutungsumfang von cognoscere wieder und passt zum Kontext begrenzter menschlicher Erkenntnis.
- source_word: Et quomodo poterit
  choice: wie wirst du dann … können?
  rationale: Der überlieferte Vers bricht syntaktisch ab und führt offenbar in den folgenden Vers. Die deutsche Fassung macht den Übergang idiomatisch, ohne das fehlende Komplement zu ergänzen.
theological_decisions:
- issue: Gegenstand menschlicher Erkenntnis
  choice: „was mit dir herangewachsen ist“ bleibt allgemein
  alternative: eine Deutung als Welt, Schöpfung oder zeitgenössische Dinge ausdrücklich einsetzen
  rationale: Der lateinische Wortlaut benennt den Gegenstand nicht genauer; eine theologische Konkretisierung würde die echte Offenheit des Textes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Auslassungspunkte zeigen an, dass der Satz am Versende unvollständig bleibt und im folgenden Vers weitergeführt wird.
