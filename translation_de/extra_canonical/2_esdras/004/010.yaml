  source_fidelity: 'Die Wendung „was mit dir herangewachsen ist“ gibt tecum coadulescentia angemessen allgemein und bildhaft wieder. Die direkte Satzstellung des Lateinischen sollte jedoch beibehalten werden: Der Text sagt zunächst, dass der Angeredete dies nicht erkennen kann, und setzt dann mit einer rhetorischen Frage an. Die Auslassung am Versende ist aufgrund des überlieferten syntaktischen Anschlusses zu bewahren.'
  naturalness: „Was mit dir herangewachsen ist, kannst du nicht erkennen“ ist im modernen Standarddeutsch natürlicher und näher am Quellsatz als der einleitende Wenn-Satz. Ein Semikolon macht den unabgeschlossenen Anschluss klar; die Auslassungspunkte markieren weiterhin das über den Vers hinausgehende Satzgefüge.
  terminology: „erkennen“ ist für cognoscere im Zusammenhang begrenzter menschlicher Erkenntnis passend. Die allgemeine Formulierung vermeidet eine nicht belegte Festlegung auf Welt, Schöpfung oder andere Gegenstände.
