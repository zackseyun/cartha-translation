source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: de
  text: Denn wie die Erde dem Wald gegeben ist und das Meer seinen Wellen, so können auch die Bewohner der Erde nur verstehen, was auf der Erde ist; und der, der über den Himmeln ist, versteht, was über den Himmeln ist.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra siluae data est
  choice: die Erde dem Wald überlassen ist
  rationale: Gibt die ungewöhnliche lateinische Formulierung möglichst unmittelbar und verständlich wieder, ohne das Bild zu normalisieren.
- source_word: qui super terram inhabitant
  choice: die Bewohner der Erde
  rationale: Natürliche deutsche Wiedergabe des pluralischen Relativsatzes.
- source_word: intellegere solummodo possunt
  choice: nur verstehen können
  rationale: Bewahrt die Einschränkung durch solummodo und die Aussage über begrenztes Erkenntnisvermögen.
- source_word: qui super caelos
  choice: der, der über den Himmeln ist
  rationale: Das lateinische qui ist formal mehrdeutig; der Zusammenhang und die indirekte Überlieferung stützen hier den Singular als Bezeichnung Gottes.
theological_decisions:
- issue: Numerus und Bezug von qui super caelos
  choice: 'Singular: »der, der über den Himmeln ist«'
  alternative: 'Plural: »die, die über den Himmeln sind«'
  rationale: Der lateinische Wortlaut allein lässt Singular oder Plural zu. Der vom Kontext gebildete Gegensatz zwischen den Erdbewohnern und dem über den Himmeln Stehenden sowie die singularische Bezeugung in Tochterübersetzungen sprechen für den Singular, ohne einen Gottesnamen einzusetzen.
- issue: Ergänzung des im Fragment abgebrochenen Satzes
  choice: »versteht, was über den Himmeln ist«
  alternative: Den Satz nach »über den Himmeln ist« abbrechen lassen
  rationale: Der vorgelegte lateinische Text bricht nach qui super caelos ab; die syntaktisch parallele Ergänzung ist durch die konsultierte Überlieferung und den überlieferten Sinn gestützt und ergibt einen vollständigen Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und der Gegensatz zwischen irdischer und überhimmlischer Erkenntnis bleiben erhalten; die auffällige Wald-Metapher wird nicht stillschweigend geglättet.
