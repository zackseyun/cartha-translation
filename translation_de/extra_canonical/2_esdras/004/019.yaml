source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixi: utrique uanam cogitationem cogitauerunt, terra enim data est siluae, et maris locus portare fluctus suos. Et respondit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/019.yaml
  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: de
  text: 'Ich sagte: „Beide haben einen vergeblichen Plan ersonnen; denn das Land ist dem Wald gegeben und der Raum des Meeres dazu, seine Wogen zu tragen.“ Und er antwortete:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: utrique
  choice: Beide
  rationale: Gibt den distributiven Bezug auf die beiden zuvor genannten Größen knapp und natürlich wieder.
- source_word: uanam cogitationem cogitauerunt
  choice: haben einen vergeblichen Plan ersonnen
  rationale: Bewahrt das Wortspiel von cogitationem/cogitauerunt sinngemäß, ohne im Deutschen eine schwerfällige Wiederholung wie „einen Gedanken gedacht“ zu erzeugen.
- source_word: terra
  choice: das Land
  rationale: Im Gegensatz zu Meer und Wald bezeichnet terra hier den festen Erdboden beziehungsweise Landraum; „Land“ ist im Deutschen am klarsten.
- source_word: maris locus
  choice: der Raum des Meeres
  rationale: Gibt locus als den dem Meer zugewiesenen Bereich wieder und vermeidet die missverständliche Formulierung „Ort des Meeres“.
- source_word: portare fluctus suos
  choice: seine Wogen zu tragen
  rationale: Folgt der Bildsprache des lateinischen Textes eng; das Possessivpronomen bezieht sich grammatisch auf das Meer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Raumzuweisung an Wald und Meer sowie der offene Anschluss „Und er antwortete:“ bleiben erhalten.
