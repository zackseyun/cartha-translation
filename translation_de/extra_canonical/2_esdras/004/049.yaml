- from: Und siehe, Rauch blieb zurück. Danach zog vor mir eine wassergefüllte Wolke vorüber und ließ heftigen, ergiebigen Regen niedergehen. Als die Wucht des Regens vorüber war, blieben in ihr einzelne Tropfen zurück.
  to: Und siehe, Rauch blieb zurück. Danach zog vor mir eine Wolke voller Wasser vorüber und ließ einen heftigen, ergiebigen Regen niedergehen. Als der Ansturm des Regens vorüber war, blieben in ihr Tropfen zurück.
  rationale: Die Revision entfernt allein die unbelegte Spezifizierung „einzelne“ und glättet zwei Formulierungen, ohne die Bildsprache, den Umfang oder die Aussage des lateinischen Textes zu verändern. Eine Fußnote ist nicht erforderlich; die im englischen Audit erwähnte Alternative betrifft nicht den vorliegenden lateinischen Wortlaut und ist für die deutsche Fassung nicht einschlägig.
