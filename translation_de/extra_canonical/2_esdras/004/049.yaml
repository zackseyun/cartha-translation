source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'transisset flamma et uidi et ecce superauit fumus. Et post hoc transiit coram me nubs plena aquae et inmisit pluuiam impetu multam, et cum transisset impetus pluuiae superauerunt in ea guttae. Et dixit ad me ; cogita tibi ; sicut enim crescit pluuia amplius quam guttae et ignis amplius quam fumus, sic superhabundauit quae transiuit mensura, superauerunt autem guttae et fumus. Et oraui et dixi : putas uiuo usque in diebus illis ? uel quis erit in diebus illis ? Respondit ad me et dixit : de signis de quibus me interrogas, ex parte possum tibi dicere, de uita autem tua non sum missus dicere tibi, sed nescio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/049.yaml
  text: and behold[a], smoke remained behind. After this a cloud full of water passed before me and sent forth a great driving rain, and when the force of the rain had passed, drops remained behind in it.
translation:
  language: de
  text: Und siehe, Rauch blieb zurück. Danach zog vor mir eine Wolke voller Wasser vorüber und ließ einen heftigen, ergiebigen Regen niedergehen. Als der Ansturm des Regens vorüber war, blieben in ihr Tropfen zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauit fumus
  choice: Rauch blieb zurück
  rationale: superare bezeichnet hier im Zusammenhang das Zurück- oder Übrigbleiben nach dem Vorübergehen der Flamme.
- source_word: nubs plena aquae
  choice: eine wassergefüllte Wolke
  rationale: Gibt die konkrete Wendung plena aquae natürlich und eng am Lateinischen wieder.
- source_word: inmisit pluuiam impetu multam
  choice: ließ heftigen, ergiebigen Regen niedergehen
  rationale: Bewahrt sowohl die große Regenmenge (multam) als auch dessen Wucht (impetu), ohne ein im Ausgangstext nicht ausdrücklich genanntes Gewitter einzuführen.
- source_word: superauerunt in ea guttae
  choice: blieben in ihr einzelne Tropfen zurück
  rationale: Gibt in ea ausdrücklich mit „in ihr“ wieder; „einzelne“ verdeutlicht idiomatisch den Gegensatz zwischen der großen Regenmenge und den verbleibenden Tropfen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; die wiederholte Bildstruktur des lateinischen Textes wird bewahrt. Die im englischen Konsultationstext angeführte Alternative „drops remained behind“ für fumus wurde nicht übernommen, da der vorgelegte lateinische Text eindeutig „Rauch“ liest.
