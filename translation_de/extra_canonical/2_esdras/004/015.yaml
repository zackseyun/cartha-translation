  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem lateinischen Text eng: Aufforderung zum Hinaufziehen, Unterwerfung des Waldes der Ebene, Gewinn eines weiteren Gebiets und die Vernichtung des Waldes durch Feuer sind erhalten. Der Genitiv in „cogitatus siluae“ ist jedoch nicht sicher als feindlich gerichteter Plan („gegen den Wald“) festgelegt und sollte neutral wiedergegeben werden, entsprechend der englischen Audit-Fassung „concerning the forest“.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und syntaktisch klar. „Plan hinsichtlich des Waldes“ ist idiomatisch und vermeidet die unnatürliche beziehungsweise zu stark festgelegte Genitivdeutung.
  terminology: „Wald der Ebene“, „bezwingen“, „Gebiet gewinnen“ und „verzehrte ihn“ bewahren die Bildlichkeit und den gehobenen Erzählregister. Die neutrale Präpositionalfügung wahrt die Mehrdeutigkeit von „cogitatus siluae“.
  issues:
  - severity: medium
    issue: „der Plan gegen den Wald“ legt „cogitatus siluae“ einseitig als gegen den Wald gerichteten Plan aus.
    rationale: Der lateinische Genitiv kann den Plan im Zusammenhang mit beziehungsweise betreffend den Wald bezeichnen. Die englische Audit-Fassung hat diese Neutralität ausdrücklich mit „the plan concerning the forest“ wiederhergestellt. Die deutsche Fassung soll diese interpretative Engführung nicht einführen.
