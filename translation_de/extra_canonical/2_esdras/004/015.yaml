  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: de
  text: 'und sagten: »Kommt, lasst uns hinaufziehen und den Wald der Ebene bezwingen, damit wir uns auch dort ein weiteres Gebiet gewinnen.« Doch der Plan hinsichtlich des Waldes war vergeblich; denn Feuer kam und verzehrte ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ascendentes
  choice: lasst uns hinaufziehen
  rationale: Gibt die Bewegungsrichtung des lateinischen Partizips in natürlichem deutschem Aufforderungsstil wieder.
- source_word: debellemus
  choice: bezwingen
  rationale: Bewahrt den kämpferischen Sinn von debellare, ohne das Bild durch eine sachlichere Wiedergabe wie „roden“ aufzulösen.
- source_word: siluam campi
  choice: den Wald der Ebene
  rationale: Formale und zugleich verständliche Wiedergabe der Genitivverbindung.
- source_word: consum[memus] nobismetipsis aliam regionem
  choice: damit wir uns auch dort ein weiteres Gebiet gewinnen
  rationale: Das beschädigt überlieferte consumemus wird kontextgemäß als Erwerb beziehungsweise Gewinn eines weiteren Gebietes verstanden; nobismetipsis wird durch „uns“ wiedergegeben.
- source_word: cogitatus siluae
  choice: der Plan gegen den Wald
  rationale: Der Genitiv ist mehrdeutig; im Kontext bezeichnet er am ehesten den gegen den Wald gerichteten Plan, nicht einen vom Wald selbst gefassten Plan.
- source_word: in uano
  choice: vergeblich
  rationale: Idiomatiche Wiedergabe der lateinischen Wendung mit Erhalt ihres Ergebnissinns.
- source_word: consumpsit (satzübergreifend ergänzt)
  choice: verzehrte ihn
  rationale: Der vorgelegte Ausschnitt bricht bei con- ab; die Fortsetzung wird durch den konsultierten vollständigen Vers bezeugt. „Verzehren“ erhält das Feuerbild und den Bezug auf den Wald.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Bildsprache von Kampf, Gebietserwerb und verzehrendem Feuer bleibt erhalten; die Genitivmehrdeutigkeit in cogitatus siluae wird kontextuell, aber nicht allegorisch oder konfessionell ausgelegt.
