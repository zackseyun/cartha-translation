source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: de
  text: 'Und er antwortete mir und sagte: „Du hast es nicht eiliger als der Höchste. Denn du hast es um deiner selbst willen eilig, der Höchste aber um vieler willen. Haben nicht die Seelen der Gerechten in ihren Kammern danach gefragt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinas ... super altissimum
  choice: du hast es nicht eiliger als der Höchste
  rationale: Gibt die vergleichende Aussage des lateinischen Ausdrucks natürlich und zugleich quellennah wieder; „es eilig haben“ ist im modernen Deutschen idiomatischer als ein wörtliches „eilen“.
- source_word: propter temetipsum
  choice: um deiner selbst willen
  rationale: Bewahrt die emphatische Rückbeziehung auf Esra und den Gegensatz zum Handeln des Höchsten für viele.
- source_word: nam excelsus pro multis
  choice: der Höchste aber um vieler willen
  rationale: Ergänzt das aus dem vorherigen Satz zu verstehende Prädikat und macht den im Kontext angelegten Kontrast deutlich, ohne den knappen lateinischen Ausdruck inhaltlich auszuweiten.
- source_word: animae iustorum
  choice: die Seelen der Gerechten
  rationale: Formale und theologisch neutrale Entsprechung des lateinischen Ausdrucks.
- source_word: in promptuariis
  choice: in ihren Kammern
  rationale: „Kammern“ gibt hier die als Verwahrungsorte gedachten Räume natürlicher wieder als das im Deutschen zu konkrete „Vorratskammern“.
- source_word: de his interrogauerunt
  choice: danach gefragt
  rationale: Natürliches modernes Deutsch für „nach diesen Dingen gefragt“, ohne den unbestimmten Rückbezug zu präzisieren.
theological_decisions:
- issue: Aussage oder rhetorische Frage in „non festinas tu super altissimum“
  choice: 'Als verneinte Aussage: „Du hast es nicht eiliger als der Höchste.“'
  alternative: 'Als Frage: „Hast du es etwa eiliger als der Höchste?“'
  rationale: Im unmittelbaren Anschluss markiert „Nonne“ ausdrücklich eine Frage, während der erste Satz schlicht mit „non“ formuliert ist. Daher ist die Aussage wahrscheinlicher; die mögliche rhetorische Lesart wird jedoch in einer Fußnote bewahrt.
- issue: Die wartenden Seelen der Gerechten
  choice: Wörtlich als „Seelen der Gerechten in ihren Kammern“ wiedergegeben
  alternative: Deutende Wiedergaben wie „die verstorbenen Gerechten an ihren Ruheorten“
  rationale: Der Text nennt ausdrücklich die Seelen und ihre Kammern. Eine weitergehende Bestimmung ihres Zustands oder Ortes würde eine theologische Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und rhetorisch; Ellipsen des Lateinischen werden nur so weit ergänzt, wie es für natürliches Deutsch nötig ist. Der unbestimmte Rückbezug „danach“ und die räumliche Metapher der „Kammern“ bleiben erhalten.
