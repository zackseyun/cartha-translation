translation:
  language: de
  text: Bedenke nun selbst, wie viel Frucht der Gottlosigkeit ein Same hervorgebracht hat. Wenn
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminis
  choice: ein Same
  rationale: Das lateinische Genitivwort bezeichnet den Samen; in der fragmentarisch überlieferten Satzgestalt wird es entsprechend dem erkennbaren Sinn als Satzgegenstand wiedergegeben, ohne ein im vorgelegten Text nicht vorhandenes Attribut wie „böse“ hinzuzufügen.
- source_word: quantum fructum
  choice: wie viel Frucht
  rationale: Bewahrt die quantitative Fragekonstruktion und das Bild von Saat und Frucht.
- source_word: impietatis
  choice: der Gottlosigkeit
  rationale: Gibt impietas in seinem religiös-moralischen Sinn wieder, ohne es auf eine einzelne Art von Bosheit einzuengen.
- source_word: generauerit
  choice: hervorgebracht hat
  rationale: Drückt das Hervorbringen von Frucht natürlich aus und wahrt die abgeschlossene Handlung.
- source_word: Quando
  choice: Wenn
  rationale: Übernimmt ausdrücklich den Beginn des folgenden, im Ausschnitt noch unvollständigen Nebensatzes.
theological_decisions:
- issue: Art der aus dem Samen hervorgehenden Verfehlung
  choice: Frucht der Gottlosigkeit
  alternative: Frucht des Frevels / Frucht der Bosheit
  rationale: „Gottlosigkeit“ erhält die religiöse Dimension von impietas und lässt zugleich dessen moralische Tragweite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bildsprache von Samen und Frucht bleibt erhalten. Das abschließende „Wenn“ bildet bewusst den unvollständigen Übergang des lateinischen Ausschnitts ab.
