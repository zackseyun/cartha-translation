source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: cogita tibi. sicut enim crescit pluvia amplius quam guttae, et ignis amplius quam fumus, sic superabundavit quae transivit mensura, superaverunt autem guttae et fumus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: de
  text: 'Und er sagte zu mir: »Bedenke selbst: Wie der Regen mehr wiegt als die Tropfen und das Feuer mehr als der Rauch, so hat das vergangene Maß bei Weitem überwogen; die Tropfen und der Rauch aber sind übrig geblieben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist die lateinische Wortfolge schwierig: Sie kann auch so verstanden werden, dass „was vergangen ist“ das Maß bei Weitem überschritten hat; der Vergleichsmaßstab bleibt dann unausgesprochen.'
    reason: Dokumentiert die syntaktische Mehrdeutigkeit von „superabundavit quae transivit mensura“, ohne die bevorzugte, vom Parallelismus gestützte Lesart im Haupttext aufzugeben.
lexical_decisions:
- source_word: cogita tibi
  choice: Bedenke selbst
  rationale: Gibt die Aufforderung idiomatisch wieder und bewahrt den reflexiven Nachdruck von „tibi“.
- source_word: pluvia amplius quam guttae
  choice: der Regen mehr ist als die Tropfen
  rationale: Bewahrt den knappen Vergleich des lateinischen Textes, in dem das Ganze der kleinen verbleibenden Menge gegenübersteht.
- source_word: quae transivit mensura
  choice: das vergangene Maß
  rationale: Folgt der grammatisch naheliegenden Verbindung von „quae“ mit „mensura“ und vermeidet die weniger natürliche Deutung, etwas Vergangenes habe ein Maß überschritten.
- source_word: superabundavit
  choice: war bei Weitem größer
  rationale: Drückt die übergroße, vergleichende Menge in natürlichem Deutsch aus.
- source_word: superaverunt
  choice: übrig geblieben sind
  rationale: Im Zusammenhang bezeichnet das Verb plausibel das Verbleiben des kleinen Restes; die deutsche Wiedergabe macht diese Bildlogik verständlich, ohne „zurück“ ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Zeit- oder Mengenvergleich im zweiten Satzteil
  choice: Das vergangene Maß war bei Weitem größer; Tropfen und Rauch bilden den verbliebenen Rest.
  alternative: Was vergangen ist, hat das Maß weit überschritten.
  rationale: Syntax und Parallelismus sprechen dafür, „mensura“ als Bezugswort von „quae“ zu lesen und den Gegensatz zwischen der größeren vergangenen Menge und dem kleinen verbleibenden Rest zu bewahren. Wegen der schwierigen lateinischen Formulierung wird die Alternative in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergleiche bleiben bewusst knapp und bildhaft; die schwierige Syntax des lateinischen zweiten Satzteils wird im Haupttext natürlich wiedergegeben und ihre echte Mehrdeutigkeit in der Fußnote erhalten.
