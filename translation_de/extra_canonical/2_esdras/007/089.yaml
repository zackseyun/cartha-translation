source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: de
  text: Dies ist die Ordnung derer, die die Wege des Höchsten bewahrt haben, wenn sie beginnen, vom vergänglichen Gefäß getrennt zu werden.[a] Während sie darin weilten, dienten sie dem Höchsten mit Mühe und ertrugen zu jeder Stunde Gefahr, damit sie das Gesetz des Gesetzgebers vollkommen einhielten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorgelegte lateinische Ausschnitt ist am Anfang beschädigt und hat später „bewahrt werden“; aus dem Zusammenhang und der vollständigeren Textgestalt ergibt sich wahrscheinlich: „die die Wege des Höchsten bewahrt haben“ und „wenn sie beginnen, vom vergänglichen Gefäß getrennt zu werden“. Das „Gefäß“ bezeichnet im Zusammenhang wahrscheinlich den sterblichen Leib.'
    reason: Kennzeichnet die erhebliche textkritische Unsicherheit und erläutert die Metapher, ohne sie im Haupttext aufzulösen.
  - marker: b
    text: Der vorgelegte Ausschnitt endet nach „ertrugen“. „Gefahr“ und der abschließende Zwecksatz folgen der vollständigeren überlieferten Gestalt des Verses.
    reason: Macht transparent, dass der am Ende ergänzte Wortlaut im bereitgestellten lateinischen Ausschnitt fehlt.
lexical_decisions:
- source_word: ordo
  choice: Ordnung
  rationale: Gibt die festgelegte Abfolge beziehungsweise den Zustand der Verstorbenen im unmittelbaren Kontext sachgerecht wieder.
- source_word: uas corruptibile
  choice: vergängliches Gefäß
  rationale: Bewahrt das lateinische Körperbild und dessen Deutungsspielraum, statt es im Haupttext ausdrücklich mit „sterblicher Körper“ aufzulösen.
- source_word: commoratae
  choice: wohnten
  rationale: Gibt das zeitweilige Verweilen der Seelen im vergänglichen Gefäß natürlich und zugleich bildnah wieder.
- source_word: seruierunt cum labore
  choice: dienten … unter Mühe
  rationale: Erhält sowohl den Dienst am Höchsten als auch dessen beschwerlichen Charakter.
- source_word: legislatoris legem
  choice: das Gesetz des Gesetzgebers
  rationale: Bewahrt die bewusste lateinische Wiederholung und vermeidet eine konfessionell geprägte Umschreibung.
theological_decisions:
- issue: Bedeutung des „vergänglichen Gefäßes“
  choice: Metapher im Haupttext beibehalten
  alternative: „sterblicher Körper“
  rationale: Der Kontext legt den Leib nahe, doch die bildhafte Ausdrucksweise soll nicht stillschweigend beseitigt werden.
- issue: Textgestalt des überlieferten lateinischen Ausschnitts
  choice: Den aus dem Zusammenhang und der breiteren Bensly-Überlieferung erkennbaren vollständigen Satz wiedergeben und die Unsicherheit in Fußnoten offenlegen
  alternative: Nur die verstümmelten beziehungsweise unvollständigen Wörter des vorgelegten Ausschnitts übersetzen
  rationale: Der vorgelegte Wortlaut setzt mitten in einem Wort ein, weist bei „seruari“ wahrscheinlich eine Textstörung auf und bricht nach „sustinuerunt“ ab; eine rein mechanische Wiedergabe wäre weder verständlich noch eine angemessene Darstellung des Verses.
- issue: Vollkommene Gesetzestreue
  choice: „damit sie das Gesetz … vollkommen einhielten“
  alternative: Die Aussage abschwächen oder als zugerechnete Gerechtigkeit deuten
  rationale: Die Spannung der Aussage wird ohne dogmatische Harmonisierung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt gut verständlich, während zentrale Bilder und die markante Wiederholung „Gesetz des Gesetzgebers“ erhalten bleiben.
