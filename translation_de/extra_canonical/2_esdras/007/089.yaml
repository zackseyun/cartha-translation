review_pass:
  verdict: revise
  source_fidelity: Der Entwurf stellt den durch den vorgelegten lateinischen Ausschnitt beschädigten Vers anhand der erkennbaren vollständigen Textgestalt plausibel wieder. Die Rekonstruktion von „die die Wege des Höchsten bewahrt haben“ sowie von „getrennt“ statt des im Ausschnitt stehenden „bewahrt“ muss weiterhin als textkritisch unsicher markiert bleiben. „Wenn sie vom vergänglichen Gefäß getrennt werden“ glättet jedoch das in „incipient ... separari“ enthaltene Einsetzen des Getrenntwerdens.
  naturalness: „Unter Mühe“ ist im heutigen Standarddeutsch weniger idiomatisch als „mit Mühe“. „Zu jeder Stunde Gefahr ertrugen“ ist natürlich, wahrt die knappe Aussage und vermeidet die im Entwurf nicht unmittelbar abgesicherte Pluralform „Gefahren“.
  terminology: „Höchster“, „vergängliches Gefäß“ und „Gesetz des Gesetzgebers“ sind treffend. Das Gefäßbild bleibt im Haupttext erhalten; die mögliche Bezugnahme auf den sterblichen Leib wird angemessen in der Anmerkung erläutert.
  issues:
  - severity: medium
    issue: Der Beginn der Trennung wird nicht ausdrücklich wiedergegeben.
    rationale: Die rekonstruierte vollständige Lesart hinter „quando incipient separari a vaso corruptibili“ bezeichnet den Zeitpunkt, an dem die Betroffenen beginnen, vom vergänglichen Gefäß getrennt zu werden. Die indikativische Fassung „wenn sie ... getrennt werden“ ist zwar verständlich, lässt diesen Aspekt aber aus.
  - severity: low
    issue: Einzelne deutsche Formulierungen sind unnötig unidiomatisch beziehungsweise weniger quellennah.
    rationale: „Mit Mühe“ ist die natürliche Entsprechung zu „cum labore“. Die Fassung „zu jeder Stunde Gefahr ertrugen“ ist stilistisch glatt und vermeidet den nicht im vorgelegten Ausschnitt belegten Plural „Gefahren“.
