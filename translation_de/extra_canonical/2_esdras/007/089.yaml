revisions:
- from: Dies ist die Ordnung für diejenigen, die die Wege des Höchsten bewahrt haben, wenn sie vom vergänglichen Gefäß getrennt werden.[a] Solange sie darin wohnten, dienten sie dem Höchsten unter Mühe und hielten zu jeder Stunde Gefahren stand, damit sie das Gesetz des Gesetzgebers vollkommen einhielten.[b]
  to: Dies ist die Ordnung derer, die die Wege des Höchsten bewahrt haben, wenn sie beginnen, vom vergänglichen Gefäß getrennt zu werden.[a] Während sie darin weilten, dienten sie dem Höchsten mit Mühe und ertrugen zu jeder Stunde Gefahr, damit sie das Gesetz des Gesetzgebers vollkommen einhielten.[b]
  rationale: Die Revision bewahrt die notwendige textkritische Kennzeichnung, gibt aber den in der rekonstruierten lateinischen Lesart enthaltenen Beginn der Trennung genauer wieder. Sie glättet zudem zwei Formulierungen in modernes Standarddeutsch, ohne Bildsprache, Register oder theologische Aussage zu verändern.
