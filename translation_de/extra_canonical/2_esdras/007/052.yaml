  source_fidelity: Die Übersetzung gibt „impios uero multiplicari“ angemessen als „über die Vermehrung der Gottlosen“ wieder und bewahrt dabei die im lateinischen Passiv enthaltene Offenheit. „audi haec“ ist natürlich mit „Doch höre dies“ übertragen. „Lapides electos si habueris paucos ualde“ entspricht präzise „Wenn du nur sehr wenige auserlesene Steine hast“. Der unvollständige Satz bleibt wie im abgegrenzten Quellsegment offen.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Wortstellung und der abschließende Doppelpunkt leiten das anschließende Vergleichsbild klar ein; das Schlusskomma ist wegen der segmentierten Vorlage sachgerecht.
  terminology: „Die Gottlosen“ ist für impii bibelsprachlich etabliert und registergerecht. „Auserlesene Steine“ bildet lapides electos ohne unzulässige Einengung auf materiell „kostbare“ Edelsteine ab. Es bestehen keine Fußnotenanker im deutschen Text, die zu prüfen oder zu ergänzen wären.
