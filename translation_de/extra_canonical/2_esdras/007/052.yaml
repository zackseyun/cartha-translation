  text: 'But hear this about the multiplication of the ungodly: if you have very few choice stones,[a]'
translation:
  language: de
  text: 'Doch höre dies über die Vermehrung der Gottlosen: Wenn du nur sehr wenige auserlesene Steine hast,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impios
  choice: die Gottlosen
  rationale: Gibt den substantivisch gebrauchten Akkusativ Plural von „impius“ klar und in bibelsprachlich natürlicher Weise wieder.
- source_word: multiplicari
  choice: Vermehrung
  rationale: Die nominale Wendung „über die Vermehrung“ bewahrt den Sinn des passiven Infinitivs im Anschluss an „höre dies“ und vermeidet eine vorschnelle Festlegung darauf, wer die Gottlosen vermehrt.
- source_word: Lapides electos
  choice: auserlesene Steine
  rationale: „Auserlesen“ bildet „electos“ unmittelbar ab, ohne den materiellen Wert der Steine stärker zu bestimmen, als es der lateinische Wortlaut tut.
- source_word: paucos ualde
  choice: nur sehr wenige
  rationale: Natürliche deutsche Wiedergabe der starken Mengenbegrenzung; „nur“ verdeutlicht idiomatisch den Kontrast, ohne neue Sachinformation einzuführen.
theological_decisions:
- issue: Die Vermehrung der Gottlosen
  choice: über die Vermehrung der Gottlosen
  alternative: darüber, dass sich die Gottlosen vermehren
  rationale: Die gewählte Form bewahrt die im lateinischen Passiv liegende Offenheit hinsichtlich Ursache bzw. Urheber und löst die theologische Spannung nicht einseitig auf.
- issue: Bedeutung von „electos“
  choice: auserlesene Steine
  alternative: kostbare Steine
  rationale: Der lateinische Text bezeichnet die Steine als ausgewählt bzw. erlesen, nicht ausdrücklich als kostbar; daher wird keine zusätzliche Wertbedeutung importiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den vorliegenden lateinischen Quellabschnitt. Der Satz bleibt entsprechend der segmentierten Vorlage offen und endet mit einem Komma; nicht im Quellsegment enthaltenes Material aus der Textüberlieferung wurde nicht ergänzt.
