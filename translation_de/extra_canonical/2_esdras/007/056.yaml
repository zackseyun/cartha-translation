  text: silver and bronze[a], and also iron and lead and clay; but silver is more abundant than gold, and bronze than silver, and iron than
translation:
  language: de
  text: Silber und Bronze sowie auch Eisen, Blei und Ton; Silber aber ist reichlicher vorhanden als Gold, Bronze als Silber und Eisen als …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Text dieses Verses endet mitten in der Vergleichsreihe; die Fortsetzung steht im folgenden Vers.
    reason: Die lateinische Quellspanne endet mit „et ferrum super“ („und Eisen reichlicher als“) und nennt innerhalb dieser Versgrenze nicht, womit Eisen verglichen wird.
lexical_decisions:
- source_word: æramentum
  choice: Bronze
  rationale: Das lateinische Wort bezeichnet hier im Zusammenhang mit Metallen ein Kupfermetall beziehungsweise Bronze; „Bronze“ ist im Deutschen natürlich und entspricht der konsultierten Wiedergabe.
- source_word: fictile
  choice: Ton
  rationale: Das substantivierte „fictile“ bezeichnet etwas aus gebranntem beziehungsweise geformtem Ton. In der Aufzählung von Werkstoffen ist das knappe „Ton“ angemessen.
- source_word: Multiplicatur … super
  choice: ist häufiger als
  rationale: Die Wendung beschreibt ein größeres Vorkommen beziehungsweise eine größere Menge. „Ist häufiger als“ gibt den Vergleich verständlich wieder, ohne eine Vermehrungshandlung zu unterstellen.
theological_decisions:
- issue: Am Versende unvollständiger Vergleich
  choice: Den Satz offen enden lassen und dies mit Auslassungspunkten sowie einer Fußnote kennzeichnen
  alternative: Die Vergleichsreihe aus dem folgenden lateinischen Text ergänzen
  rationale: Der für 7,56 vorgegebene lateinische Text endet tatsächlich bei „et ferrum super“. Eine Ergänzung würde Text aus dem nächsten Vers in diesen Vers ziehen und die bezeugte Versgrenze verwischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung des Lateinischen bleibt erhalten; die ungewöhnliche offene Satzgrenze wird nicht stillschweigend ergänzt.
