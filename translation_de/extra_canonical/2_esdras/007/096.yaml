  to: 'Die fünfte Stufe: Sie freuen sich darüber, dass sie nun dem Vergänglichen entronnen sind und wie sie das Kommende als Erbe besitzen werden[a], während sie noch den engen und mühevollen Weg sehen, weil sie befreit worden sind.[b]'
