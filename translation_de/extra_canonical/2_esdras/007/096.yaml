source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: de
  text: 'Die fünfte Stufe: Sie freuen sich darüber, dass sie nun dem Vergänglichen entronnen sind und wie sie das Kommende als Erbe besitzen werden[a], während sie noch den engen und mühevollen Weg sehen, weil sie befreit worden sind.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sie nun dem Vergänglichen entronnen sind und das Kommende als Erbe besitzen werden“. Das zweimalige lateinische quomodo kann beide parallelen Aussagen einleiten.'
    reason: Bewahrt die grammatische Mehrdeutigkeit zwischen deklarativem und modalem Verständnis von quomodo, ohne die Parallelität zu verdecken.
  - marker: b
    text: 'Wörtlicher: „während sie noch das Enge und mit Mühe Erfüllte sehen, weil sie befreit worden sind“. „Weg“ ist kontextuell ergänzt; „Mühe“ steht im lateinischen Text als editorische Ergänzung.'
    reason: Kennzeichnet die Ergänzung von „Weg“, bewahrt den kausalen Anschluss von quoniam und vermerkt die textkritische Ergänzung [labore].
lexical_decisions:
- source_word: corruptibile
  choice: das Vergängliche
  rationale: Das substantivierte Neutrum bezeichnet das, was dem Verfall unterliegt; „das Vergängliche“ ist im Deutschen natürlich und bewahrt den abstrakten Sinn.
- source_word: futurum
  choice: das Kommende
  rationale: Das substantivierte Futurpartizip bezeichnet die zukünftige Wirklichkeit; „das Kommende“ ist würdevoll und weniger abstrakt als „das Zukünftige“.
- source_word: hereditatem possidebunt
  choice: als Erbe empfangen werden
  rationale: Gibt den Erbgedanken idiomatisch wieder, ohne das lateinische „Erbschaft besitzen“ hölzern nachzubilden.
- source_word: angustum et [labore] plenum
  choice: den engen und mühevollen Weg
  rationale: Das im Lateinischen substantivisch gebrauchte „angustum“ wird kontextgemäß als Weg entfaltet; „mühevoll“ bildet das textkritisch ergänzte „labore plenum“ natürlich ab.
- source_word: liberati sunt
  choice: sie befreit worden sind
  rationale: Bewahrt das Passiv und lässt den Handelnden, wie im Lateinischen, ungenannt.
theological_decisions:
- issue: Funktion des zweimaligen „quomodo“
  choice: erstes Vorkommen als „dass“, zweites als „wie“
  alternative: beide Vorkommen als „dass“
  rationale: Spätlateinisch kann „quomodo“ indirekte Rede einleiten, doch beim zweiten Vorkommen ist auch ein modaler Sinn möglich. Der Haupttext erhält diese im überlieferten Text erkennbare Spannung; die Fußnote nennt die parallele deklarative Lesart.
- issue: Bezug von „quoniam liberati sunt“
  choice: relativisch auf den engen, mühevollen Weg bezogen
  alternative: 'kausal: „weil sie befreit worden sind“'
  rationale: Der lateinische Anschluss ist syntaktisch knapp und mehrdeutig. Die gewählte Fassung ergibt im Deutschen einen verständlichen Bezug, ohne eine zusätzliche theologische Aussage einzuführen; die alternative kausale Wiedergabe wird vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah an der knappen lateinischen Vorlage, wird aber durch „darüber“ und die kontextuelle Ergänzung „Weg“ lesbar gemacht. Die Bezeichnung „Die fünfte Stufe“ folgt der Versgliederung der konsultierten Fassung, obwohl sie im bereitgestellten lateinischen Ausschnitt nicht ausdrücklich erscheint.
