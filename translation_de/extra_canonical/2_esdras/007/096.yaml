  source_fidelity: Die Übersetzung trifft die zentrale Gegenüberstellung von Vergänglichem und Kommendem sowie die zweimalige Einleitung mit quomodo grundsätzlich. Sie verändert jedoch quoniam liberati sunt im Haupttext zu einem Relativsatz („von dem ... befreit“), obwohl der lateinische Text kausal lautet. Außerdem ist „als Erbe empfangen werden“ ein unpassendes Passiv für hereditatem possidere; das Subjekt besitzt die Erbschaft künftig.
  naturalness: Die Fassung ist überwiegend modernes, würdiges Deutsch. „wie sie das Kommende als Erbe empfangen werden“ wirkt jedoch sowohl syntaktisch als auch semantisch unerquicklich. „wie sie das Kommende als Erbe besitzen werden“ ist näher am Ausgangstext und idiomatisch verständlich.
  terminology: „das Vergängliche“, „das Kommende“ und „eng und mühevoll“ geben die lateinischen Ausdrücke angemessen wieder. „Weg“ ist eine vorsichtige kontextuelle Ergänzung zu angustum; sie soll als solche kenntlich bleiben. Die textkritische Ergänzung [labore] muss weiterhin in einer Anmerkung vermerkt werden.
