  naturalness: „Denn sie kennen weder die Qualen noch die ihnen verheißene Rettung nach dem Tod“ ist natürliches, würdiges modernes Standarddeutsch. „Uns aber …“ ist als bewusst unvollständiger Übergang ebenfalls idiomatisch und bildet die Satzfortsetzung akkurat ab.
