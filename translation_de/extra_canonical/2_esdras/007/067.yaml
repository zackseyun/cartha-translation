source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nec enim sciunt cruciamenta nec salutem post mortem repromissam sibi. Nobis autem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/067.yaml
  text: for they do not know torments[a], nor the salvation promised to them after death. But as for us,
translation:
  language: de
  text: Denn sie kennen weder die Qualen noch die ihnen verheißene Rettung nach dem Tod. Uns aber …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cruciamenta
  choice: die Qualen
  rationale: Gibt die konkreten Leiden beziehungsweise Strafqualen natürlich und würdevoll wieder, ohne über den lateinischen Ausdruck hinaus Einzelheiten festzulegen.
- source_word: salutem
  choice: Rettung
  rationale: Bewahrt den heilsgeschichtlichen Sinn von salus und ist im modernen Deutsch unmittelbar verständlich.
- source_word: repromissam sibi
  choice: die ihnen verheißene
  rationale: Das Präfix re- in repromissam verlangt hier nicht zwingend „erneut versprochen“; „verheißen“ entspricht dem religiösen Kontext und sibi bezieht sich auf sie.
- source_word: post mortem
  choice: nach dem Tod
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Bestimmung.
- source_word: Nobis autem
  choice: Wir aber …
  rationale: Erhält den unvollständigen Übergang zum folgenden Vers, statt den Gedanken vorzeitig zu ergänzen.
theological_decisions:
- issue: Bezug von „sie“ und Inhalt der Verheißung
  choice: Die Pronomen und die knappe Aussage bleiben ohne erklärende Präzisierung stehen.
  alternative: Die gemeinte Personengruppe oder die Art der Rettung ausdrücklich benennen.
  rationale: Der einzelne Vers nennt weder die Bezugsgruppe noch nähere Einzelheiten; eine Ergänzung würde die im Kontext zu klärende Spannung unzulässig auflösen.
- issue: salus nach dem Tod
  choice: „Rettung nach dem Tod“
  alternative: „Heil nach dem Tod“ oder eine spezifische Auferstehungslehre ausformulieren.
  rationale: „Rettung“ bewahrt die Breite des lateinischen salus, ohne eine bestimmte konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang „Denn“ wahrt den Anschluss an den vorherigen Kontext; die Auslassungspunkte zeigen, dass „Wir aber“ syntaktisch in den nächsten Vers weiterführt.
