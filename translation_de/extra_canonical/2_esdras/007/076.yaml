  text: let those times come[a], in which you will begin to renew the creation, or are we tormented from now on?” And he answered me and said, “I will show you this also; but as for you, do not mingle with them
translation:
  language: de
  text: '„Mögen jene Zeiten kommen, in denen du beginnen wirst, die Schöpfung zu erneuern, oder werden wir von jetzt an gequält?“ Und er antwortete mir und sagte: „Auch das werde ich dir zeigen; du aber mische dich nicht unter sie.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vermische dich nicht mit ihnen“.'
    reason: Dokumentiert das Bild und die Konstruktion des lateinischen commisceri cum eis hinter der natürlicheren deutschen Formulierung.
lexical_decisions:
- source_word: ueniant
  choice: Mögen … kommen
  rationale: Gibt den jussivischen Konjunktiv wieder, ohne ihn als bloße Zukunftsaussage zu glätten.
- source_word: creaturam renouare
  choice: die Schöpfung zu erneuern
  rationale: Entspricht dem Singular creaturam und bewahrt die umfassende Bedeutung von renovare.
- source_word: amodo
  choice: von jetzt an
  rationale: Gibt den zeitlichen Ausgangspunkt des lateinischen Ausdrucks direkt wieder.
- source_word: cruciamur
  choice: werden wir … gequält
  rationale: Bewahrt Passivform und Fragecharakter; das stärkere cruciari wird nicht zu einem bloßen Leiden abgeschwächt.
- source_word: tu autem
  choice: du aber
  rationale: Erhält die ausdrückliche Hervorhebung des Angesprochenen und den Gegensatz.
- source_word: noli commisceri cum eis
  choice: mische dich nicht unter sie
  rationale: Ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „vermischen“, bewahrt aber das Bild des Sich-Mischens und lässt den Bezug von „sie“ offen.
theological_decisions:
- issue: Zeitpunkt der Qual
  choice: oder werden wir von jetzt an gequält?
  alternative: oder werden wir sogleich gequält?
  rationale: amodo bezeichnet am ehesten „von jetzt an“; die Frage und ihre Spannung zum Zeitpunkt der Erneuerung bleiben erhalten.
- issue: Bezug von eis („ihnen/sie“)
  choice: Das Pronomen bleibt ohne erklärende Identifizierung stehen.
  alternative: Eine aus dem Folgevers ergänzte Gruppe ausdrücklich benennen.
  rationale: Der vorgelegte lateinische Vers nennt den Bezug nicht. Eine Ergänzung würde die Versgrenze überschreiten und eine Auslegung in den Haupttext eintragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede setzt mitten in einer bereits laufenden Frage ein, wie es die vorgelegte Versabgrenzung verlangt. Die Wiederholungsformel „antwortete mir und sagte“ bleibt aufgrund ihrer erzählerischen Funktion erhalten.
