source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: de
  text: 'Seht auf die eine und auf die andere Seite: Hier sind Freude und Ruhe, dort aber Feuer und Qualen. Dies wirst du[a] am Tag des Gerichts zu ihnen sagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lateinisch „loqueris“, formal „du sprichst/du wirst sprechen“. Im Zusammenhang wird meist „er wird sprechen“ erwartet; die überlieferte Personenform ist jedoch nicht eindeutig daran angeglichen.
    reason: Die Anmerkung bewahrt die formale zweite Person der lateinischen Überlieferung und weist zugleich auf die kontextuell erwartete dritte Person hin.
lexical_decisions:
- source_word: iocunditas
  choice: Freude
  rationale: Gibt die positive, beglückende Bedeutung natürlich und würdig wieder; „Wonne“ wäre im heutigen Standarddeutsch stärker gehoben.
- source_word: requies
  choice: Ruhe
  rationale: Entspricht unmittelbar dem lateinischen Begriff und bewahrt den Gegensatz zu Feuer und Qualen.
- source_word: tormenta
  choice: Qualen
  rationale: Bezeichnet hier leidvolle Strafen; der Plural erhält die Ausdruckskraft des lateinischen Plurals.
- source_word: Videte contra et in contra
  choice: Seht auf die eine und auf die andere Seite
  rationale: Eine natürliche deutsche Wiedergabe der auffordernden Gegenüberstellung; der Pluralimperativ von „videte“ bleibt erhalten.
theological_decisions:
- issue: Subjekt des abschließenden Sprechens
  choice: „wirst du … sagen“ nach dem überlieferten lateinischen „loqueris“ (2. Person Singular)
  alternative: „wird er … sagen“, wie die englische Konsultationsfassung und der Zusammenhang es nahelegen
  rationale: Die unmittelbare lateinische Quellenlesart hat Vorrang. Da sie vom kontextuell erwartbaren Subjekt abweicht, wird die Spannung nicht stillschweigend aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die knappe Gegenüberstellung und der Pluralimperativ der Quelle wurden bewahrt.
