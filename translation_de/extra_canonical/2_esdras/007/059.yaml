lexical_decisions:
- source_word: pondera
  choice: Gewichte
  rationale: Gibt das lateinische Bild wörtlich wieder, ohne den schwierigen Text durch eine freie Deutung wie „Wäge ab“ zu glätten.
- source_word: cogitasti
  choice: bedacht hast
  rationale: Bewahrt den Bezug auf das zuvor Gedachte oder Erwogene und klingt im Deutschen natürlicher als „gedacht hast“ in dieser Konstruktion.
- source_word: qui habet
  choice: derjenige, der hat …
  rationale: Gibt den unvollständigen Relativsatz des überlieferten Quellenausschnitts wieder und ergänzt kein nicht vorhandenes Satzende.
theological_decisions:
- issue: Sinn des vermutlich beschädigten Satzes „In te †stant pondera quæ cogitasti“
  choice: Das Gewichtsbild und die Aussage, dass die Gewichte „in dir liegen“, bleiben stehen.
  alternative: „Wäge in dir ab, was du gedacht hast.“
  rationale: Die Alternative ergäbe einen glatteren argumentativen Sinn, würde aber den problematischen lateinischen Wortlaut stärker emendieren. Die Übersetzung bewahrt daher die echte textliche Unsicherheit.
