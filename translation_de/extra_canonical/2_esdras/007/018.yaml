source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iusti autem ferent angusta sperantes spatiosa; qui enim impie gesserunt, et angustiam passi sunt et spatiosa non viderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: de
  text: Die Gerechten aber werden die Enge ertragen und auf die Weite hoffen; denn diejenigen, die gottlos gehandelt haben, haben sowohl die Enge erlitten als auch die Weite nicht gesehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iusti
  choice: die Gerechten
  rationale: Die substantivische Bezeichnung wird im Deutschen natürlich und traditionsnah wiedergegeben.
- source_word: ferent
  choice: werden … ertragen
  rationale: Bewahrt den futurischen Sinn und bezeichnet standhaftes Erdulden.
- source_word: angusta / angustiam
  choice: die Enge
  rationale: Erhält die bewusste räumliche Metapher und die lexikalische Verbindung beider Vorkommen.
- source_word: spatiosa
  choice: die Weite
  rationale: Gibt das substantivierte neutrale Pluralwort idiomatisch als Kollektivbegriff wieder und bewahrt den Gegensatz zur Enge.
- source_word: impie gesserunt
  choice: gottlos gehandelt haben
  rationale: Gibt sowohl die moralisch-religiöse Wertung von impie als auch den Handlungssinn von gesserunt wieder.
- source_word: et … et …
  choice: sowohl … als auch …
  rationale: Bewahrt die korrelative Hervorhebung der zweifachen Erfahrung der Gottlosen.
theological_decisions:
- issue: Deutung der räumlichen Metapher
  choice: Enge und Weite bleiben unaufgelöst bildhaft
  alternative: Bedrängnis und Heil/Freiheit
  rationale: Der lateinische Text deutet die Bilder nicht ausdrücklich aus; die Übersetzung wahrt daher die theologische Offenheit und den bewussten Gegensatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Bildsprache „Enge/Weite“ wird zur Wahrung der poetisch-theologischen Spannung beibehalten.
