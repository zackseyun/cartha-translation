  to: zu dem, der sie gegeben hat, damit sie zuerst die Herrlichkeit des Höchsten anbetet. Und wenn sie tatsächlich zu denen gehört, die den Weg des Höchsten verschmäht und nicht eingehalten haben, und zu denen, die das Gesetz verachtet haben,
  rationale: Die Revision ersetzt den deutschen „um“-Infinitiv durch einen „damit“-Satz. Dadurch wird ausdrücklich die im Kontext vorausgesetzte Seele als diejenige kenntlich, die die Herrlichkeit anbetet, ohne den lateinischen Sinn oder die fragmentarische Abgrenzung des Quellabschnitts zu verändern. Die übrige Wortwahl bleibt erhalten.
