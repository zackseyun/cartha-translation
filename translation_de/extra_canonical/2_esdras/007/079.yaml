  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/079.yaml
  text: to him who gave it[a], to worship the glory of the Most High first of all. And if indeed it is one of those who have spurned and have not kept the way of the Most High, and of those who have despised the law,
translation:
  language: de
  text: zu dem, der sie gegeben hat, damit sie zuerst die Herrlichkeit des Höchsten anbetet. Und wenn sie tatsächlich zu denen gehört, die den Weg des Höchsten verschmäht und nicht eingehalten haben, und zu denen, die das Gesetz verachtet haben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad eum qui dedit
  choice: zu dem, der sie gegeben hat
  rationale: Gibt die Zielrichtung von „ad eum“ und das elliptische „dedit“ wieder. Das ergänzte Pronomen „sie“ nimmt die im Zusammenhang vorausgesetzte Seele auf.
- source_word: adorare
  choice: anzubeten
  rationale: Entspricht im religiösen Kontext dem lateinischen Verb und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: gloriam Altissimi
  choice: die Herrlichkeit des Höchsten
  rationale: Bewahrt die traditionelle und sachlich genaue Wiedergabe von „gloria“ und des Gottesprädikats „Altissimus“.
- source_word: spreuerunt
  choice: verschmäht haben
  rationale: Gibt die bewusste Zurückweisung stärker wieder als ein bloßes Nichtbeachten.
- source_word: non seruauerunt uiam
  choice: den Weg … nicht eingehalten haben
  rationale: „Einhalten“ vermittelt hier das praktische Befolgen des von Gott vorgegebenen Weges.
- source_word: contempserunt legem
  choice: das Gesetz verachtet haben
  rationale: Entspricht direkt dem abwertenden Sinn von „contemnere“, ohne ein im lateinischen Text nicht vorhandenes Possessivpronomen einzufügen.
theological_decisions:
- issue: Bezug des unausgesprochenen Objekts bei „dedit“ und des Subjekts bei „esset“
  choice: Das feminine Pronomen „sie“ beziehungsweise die Formulierung „sie … gehört“ verweist auf die im Kontext vorausgesetzte Seele.
  alternative: 'Die Ellipse auch im Deutschen stehen lassen: „zu dem, der gegeben hat“ / „wenn es tatsächlich einer von denen wäre“.'
  rationale: Deutsch verlangt für einen verständlichen Satz eine deutlichere Wiederaufnahme. Die Ergänzung erklärt nur den grammatischen Zusammenhang und fügt keine konfessionelle Deutung hinzu.
- issue: Zuordnung in „esset eorum“
  choice: „zu denen gehört“
  alternative: „eine von denen ist“
  rationale: Die gewählte Form bewahrt die Zugehörigkeitskonstruktion des lateinischen Genitivs und vermeidet eine unnötige Festlegung auf Person oder Gruppe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Wortlaut. Der Satzanfang und das abschließende Komma bleiben fragmentarisch, weil der bereitgestellte Quellabschnitt versetzt abgegrenzt ist und sowohl mit dem Ende des vorausgehenden Satzes beginnt als auch vor dem Ende des folgenden Satzes abbricht.
