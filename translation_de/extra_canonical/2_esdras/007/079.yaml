    issue: Falscher grammatischer Bezug des Finalinfinitivs
    rationale: In „der sie gegeben hat, um zuerst die Herrlichkeit des Höchsten anzubeten“ kann nur „der“ das Subjekt von „anzubeten“ sein. Der Kontext und die lateinische Konstruktion beziehen das Anbeten jedoch auf die implizit ergänzte Seele („sie“).
  revised_text: zu dem, der sie gegeben hat, damit sie zuerst die Herrlichkeit des Höchsten anbetet. Und wenn sie tatsächlich zu denen gehört, die den Weg des Höchsten verschmäht und nicht eingehalten haben, und zu denen, die das Gesetz verachtet haben,
