  text: uerunt quae per fidem data est lex. Quartus ordo, intellegentes requiem quam nunc in promptuariis congregati requiescent cum silentio multo ab angelis conseruati, †atque in nouissimis eorum manentem gloriam.† Quintus ordo, exultantes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: de
  text: 'Die vierte Stufe: Sie erkennen die Ruhe, in der sie – nun in Kammern versammelt – in tiefem Schweigen ruhen werden, von Engeln bewahrt, und die Herrlichkeit, die ihnen in den letzten Zeiten bleibt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut des Satzteils über die Herrlichkeit in den letzten Zeiten ist textlich unsicher. Der Gesamtsinn einer gegenwärtig von Engeln bewahrten Ruhe und künftigen Herrlichkeit ist jedoch gesichert.
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: Die vierte Stufe
  rationale: „Stufe“ gibt hier eine geordnete Folge von Zuständen natürlicher wieder als das im Deutschen missverständliche „Ordnung“.
- source_word: requiem
  choice: die Ruhe
  rationale: Direkte und kontextgemäße Wiedergabe des eschatologischen Ruhezustands.
- source_word: in promptuariis
  choice: in ihren Kammern
  rationale: Das lateinische Wort bezeichnet Vorrats- oder Verwahrungsräume; „Kammern“ bewahrt das räumliche Bild, ohne die im Deutschen befremdliche Vorstellung gewöhnlicher Vorratshäuser aufzudrängen.
- source_word: cum silentio multo
  choice: in tiefem Schweigen
  rationale: Natürliche, würdige Wiedergabe der verstärkenden Formulierung „mit großem Schweigen“.
- source_word: ab angelis conseruati
  choice: von Engeln beschützt
  rationale: Gibt sowohl das Bewahren als auch den Schutz durch Engel klar wieder.
- source_word: manentem gloriam
  choice: die Herrlichkeit, die ihnen … vorbehalten bleibt
  rationale: Bewahrt den Gedanken einer fortbestehenden, künftig für sie bereitliegenden Herrlichkeit.
- source_word: in nouissimis
  choice: in den letzten Zeiten
  rationale: Entspricht dem eschatologischen Zeithorizont und vermeidet eine unnötige Präzisierung.
theological_decisions:
- issue: Gegenwärtige Verwahrung und künftige Ruhe
  choice: „nun … versammelt“ bei zugleich künftigem „ruhen werden“
  alternative: „nun … ruhen“
  rationale: Das lateinische „nunc … congregati“ beschreibt die gegenwärtige Sammlung, während „requiescent“ formal Futur ist; die Spannung wird nicht eingeebnet.
- issue: Zeitpunkt der Herrlichkeit
  choice: „in den letzten Zeiten“
  alternative: „an ihrem Ende“
  rationale: Die textkritisch unsichere Wendung wird gemäß dem wahrscheinlichen Gesamtsinn eschatologisch wiedergegeben, ohne ihre genaue zeitliche Zuordnung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der gestuften Vision, wird jedoch durch Gedankenstriche lesbarer gemacht. Das räumliche Bild von „promptuaria“ bleibt mit „Kammern“ erhalten; die zeitliche Spannung zwischen gegenwärtiger Sammlung und künftigem Ruhen wird ausdrücklich bewahrt.
