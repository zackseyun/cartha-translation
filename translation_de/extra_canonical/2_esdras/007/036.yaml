- from: Und der See der Qual wird sichtbar werden[a], und ihm gegenüber wird der Ort der Ruhe sein; und der Ofen der Gehenna wird gezeigt werden[b], und ihm gegenüber das Paradies der Wonne.
  to: Und[b] der See der Qual wird sichtbar werden[a], und ihm gegenüber wird der Ort der Ruhe sein; und der Ofen der Gehenna wird gezeigt werden, und ihm gegenüber das Paradies der Freude.
  rationale: Die Revision modernisiert ausschließlich „Wonne“ zu „Freude“ und versetzt Fußnotenmarker b an das Wort, dessen Übersetzung die Anmerkung begründet. Die Satzfolge, die räumlichen Gegenbilder, die Bezeichnung „Gehenna“ und die Unterscheidung der beiden lateinischen Verben bleiben erhalten.
