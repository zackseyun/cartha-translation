source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et apparebit lacus tormenti, et contra illum erit locus requietionis ; et clibanus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: de
  text: Und[b] der See der Qual wird sichtbar werden[a], und ihm gegenüber wird der Ort der Ruhe sein; und der Ofen der Gehenna wird gezeigt werden, und ihm gegenüber das Paradies der Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 7,36–105 bilden Benslys „fehlendes Fragment“. Sie fehlen in den meisten mittelalterlichen lateinischen Handschriften und daher auch in der Vulgata sowie in der King-James-Bibel von 1611. Dort folgte auf 7,35 unmittelbar der Abschnitt, der in älteren Ausgaben etwa siebzig Verse später als 7,36 gezählt wurde. Robert Bensly entdeckte das Fragment 1875 in einer spanischen Handschrift wieder; moderne kritische Ausgaben haben es wieder aufgenommen. Als möglicher Grund für die Auslassung gilt, dass dieser Abschnitt die Fürbitte für die Verdammten als wirkungslos darstellt, was späterer christlicher Frömmigkeit Schwierigkeiten bereitete.
    reason: recovered_fragment
  - marker: b
    text: Die ältere Wiedergabe begann den Vers mit „Dann wird der See der Qual sichtbar werden“. Das lateinische Et bedeutet hier jedoch schlicht „Und“ und führt die wiederholte Satzverknüpfung des Zusammenhangs fort.
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  choice: See der Qual
  rationale: „Lacus“ bezeichnet hier wörtlich einen See beziehungsweise ein Becken; „See der Qual“ wahrt das Bild und gibt den Genitiv „tormenti“ knapp wieder.
- source_word: locus requietionis
  choice: Ort der Ruhe
  rationale: Formale und natürliche Wiedergabe des Gegenbildes zum Ort der Qual.
- source_word: clibanus
  choice: Ofen
  rationale: Das lateinische Wort bezeichnet einen Ofen; die konkrete Bildsprache bleibt erhalten.
- source_word: Gehenna
  choice: Gehenna
  rationale: Der traditionsreiche Eigenbegriff wird transliteriert und nicht deutend mit „Hölle“ gleichgesetzt.
- source_word: iucunditatis paradisus
  choice: Paradies der Wonne
  rationale: Die traditionelle, würdevolle Wendung bildet den lateinischen Genitiv ab, ohne dessen positive Intensität abzuschwächen.
theological_decisions:
- issue: Gegenüberstellung der endzeitlichen Orte
  choice: Die räumliche Parallelstruktur „ihm gegenüber“ wird in beiden Satzhälften bewahrt.
  alternative: Die Gegensätze freier als bloße Zustände der Verdammnis und Seligkeit wiederzugeben.
  rationale: Der Text stellt Qual und Ruhe sowie Gehenna und Paradies sichtbar und räumlich einander gegenüber; eine rein abstrakte Deutung würde diese Spannung auflösen.
- issue: Gehenna als Begriff
  choice: „Gehenna“ bleibt stehen.
  alternative: „Hölle“
  rationale: „Hölle“ könnte spätere, umfassendere Lehrvorstellungen eintragen, während „Gehenna“ die historische Bild- und Begriffsebene wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter polysyndetischer Satzfolge („Und … und …; und … und …“). Die konkreten räumlichen Bilder und die paarweise Gegenüberstellung des lateinischen Textes bleiben erhalten. Der bereitgestellte lateinische Ausschnitt bricht nach „et clibanus“ ab; der Schluss des Verses wird nach der im geprüften englischen Konsultationstext bezeugten Fortsetzung wiedergegeben.
