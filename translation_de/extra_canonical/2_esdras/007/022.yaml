  text: hii autem non sunt persuasi et contradixerunt ei. et constituerunt sibi cogitamenta vanitatis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/022.yaml
  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: de
  text: Sie aber ließen sich nicht überzeugen[a] und widersprachen ihm; sie ersannen für sich nichtige Gedanken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „waren nicht überzeugt“.'
    reason: Das lateinische Passiv kann entweder als Zustand oder idiomatisch als verweigerte Überzeugung verstanden werden.
  - marker: b
    text: 'Wörtlicher: „Gedanken der Nichtigkeit“.'
    reason: Die Fußnote bewahrt die lateinische Genitivkonstruktion cogitamenta vanitatis, während der Haupttext sie natürlich wiedergibt.
lexical_decisions:
- source_word: non sunt persuasi
  choice: ließen sich nicht überzeugen
  rationale: Die Formulierung gibt das lateinische Passiv idiomatisch wieder und bewahrt den Gedanken, dass sie der an sie gerichteten Überzeugung nicht folgten.
- source_word: contradixerunt ei
  choice: widersprachen ihm
  rationale: „Widersprachen“ entspricht contradixerunt unmittelbar und kann im Kontext sowohl verbalen Widerspruch als auch auflehnende Gegenrede bezeichnen, ohne die Aussage zu verstärken.
- source_word: constituerunt sibi
  choice: ersannen für sich
  rationale: Bei Gedanken bezeichnet constituerunt ein bewusstes Hervorbringen oder Fassen. „Ersannen“ ist im Deutschen natürlicher als ein wörtliches „richteten auf“ oder „stellten fest“; „für sich“ erhält sibi.
- source_word: cogitamenta vanitatis
  choice: nichtige Gedanken
  rationale: Die Qualitätsbestimmung vanitatis wird idiomatisch als Adjektiv wiedergegeben. „Nichtig“ bewahrt die Bedeutungsbreite von leer, wertlos und vergeblich.
theological_decisions:
- issue: Stärke des Widerstands gegen die göttliche Weisung
  choice: widersprachen ihm
  alternative: widersetzten sich ihm
  rationale: Das stärkere „widersetzten sich“ wäre kontextuell möglich, würde jedoch den lexikalischen Wert von contradicere stärker als nötig in Richtung tätiger Rebellion festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt die dreigliedrige Abfolge des Lateinischen; das Semikolon verdeutlicht den Übergang zur selbst hervorgebrachten Gedankenwelt, ohne eine zusätzliche logische Beziehung einzutragen.
