  text: enter[a], but from now on they will wander in torments, always grieving and sad.
translation:
  language: de
  text: eintreten, sondern von nun an unter Qualen umherirren und stets leidend und traurig sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingredientur
  choice: eintreten
  rationale: Gibt den futurischen Sinn von „ingredientur“ wieder; die Verneinung „non“ steht am Ende des vorausgehenden Verses und wirkt syntaktisch hier weiter.
- source_word: sed
  choice: sondern
  rationale: Im Zusammenhang mit dem vorausgehenden „non“ ist im Deutschen die korrelative Fügung „nicht … sondern“ natürlicher und genauer als „aber“.
- source_word: uagantes erunt
  choice: umherirren
  rationale: Bewahrt den Sinn eines ruhelosen, ziellosen Umhergehens im Futur; die Zukunft wird durch „werden“ aus dem vorausgehenden Satzgefüge beziehungsweise idiomatisch durch die Konstruktion erschlossen.
- source_word: amodo
  choice: von nun an
  rationale: Entspricht dem zeitlichen Einsatzpunkt des lateinischen Ausdrucks.
- source_word: in cruciamentis
  choice: unter Qualen
  rationale: Natürliches modernes Deutsch für einen fortdauernden Zustand quälenden Leidens.
- source_word: dolentes semper et tristes
  choice: immer voller Schmerz und Trauer
  rationale: Gibt beide affektiven Begriffe würdig und verständlich wieder, ohne sie auf bloße körperliche Schmerzen zu verengen.
theological_decisions:
- issue: Versübergreifende Verneinung
  choice: „eintreten … sondern“ als Fortsetzung des in Vers 80 stehenden „nicht“
  alternative: Den Vers als selbstständige positive Aussage „Sie werden eintreten, aber …“ lesen
  rationale: Der lateinische Text setzt syntaktisch den vorherigen Vers fort; dessen abschließendes „non“ verneint „ingredientur“. Eine selbstständige positive Lesart würde den Sinn verkehren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt als versübergreifendes Satzfragment erkennbar und wahrt damit die Syntax der lateinischen Quelle.
