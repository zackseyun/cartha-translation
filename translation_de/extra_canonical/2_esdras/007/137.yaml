id: 2ES.7.137
reference: 2 Esdras 7:137
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: de
  text: Denn wenn er sie nicht vermehrt[a], wird das Zeitalter nicht zusammen mit denen, die darin wohnen, zum Leben erweckt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wenn er nicht vermehrt haben wird“; wen er vermehrt, wird im Lateinischen dieses Verses nicht ausdrücklich gesagt.'
    reason: Macht sowohl die lateinische Zukunftsform als auch das ergänzte Objekt transparent.
lexical_decisions:
- source_word: multiplicaverit
  choice: er sie … vermehrt
  rationale: Das lateinische Futur II wird in einem deutschen wenn-Satz natürlich mit Präsens wiedergegeben; Subjekt und Objekt sind im Lateinischen nicht ausdrücklich genannt, werden aber aus dem Zusammenhang ergänzt.
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bewahrt die zeitlich-eschatologische Bedeutung von saeculum, ohne sie vorschnell als „Welt“ oder „Ewigkeit“ festzulegen.
- source_word: vivificabitur
  choice: zum Leben erweckt werden
  rationale: Gibt das passive Futur von vivificare würdig und verständlich wieder und wahrt die Vorstellung des Lebendigmachens.
- source_word: cum his qui habitant in eo
  choice: zusammen mit denen, die darin wohnen
  rationale: Folgt der lateinischen Verknüpfung mit cum und bezieht eo grammatisch auf das Zeitalter.
theological_decisions:
- issue: Wer vermehrt wird
  choice: „er sie“ wird aus dem Zusammenhang ergänzt und durch eine Fußnote als Ergänzung kenntlich gemacht.
  alternative: 'Das elliptische Latein ohne Objekt nachbilden: „wenn er nicht vermehrt“.'
  rationale: Im Deutschen verlangt „vermehren“ hier ein verständliches Objekt; zugleich darf die im lateinischen Vers selbst unausgesprochene Referenz nicht verschleiert werden.
- issue: Zeitform der Bedingung
  choice: 'Reale beziehungsweise offene Zukunftsbedingung: „wenn er sie nicht vermehrt, wird …“.'
  alternative: 'Irreale Bedingung: „wenn er sie nicht vermehrte, würde …“.'
  rationale: multiplicaverit steht zusammen mit dem Futur vivificabitur und bezeichnet hier keine kontrafaktische Bedingung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Lateinischen; das Futur II des Bedingungssatzes wird idiomatisch mit deutschem Präsens wiedergegeben.
