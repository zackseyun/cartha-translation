source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: de
  text: 'So ist es auch mit der von mir verheißenen Schöpfung: Ich werde mich über die wenigen freuen, die gerettet werden, denn sie sind es, die meine Herrlichkeit jetzt mächtiger gemacht haben und durch die mein Name jetzt genannt wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repromissa creatura
  choice: die von mir verheißene Schöpfung
  rationale: Bewahrt die Aussage, dass die Schöpfung Gegenstand der göttlichen Verheißung ist; „verheißen“ entspricht dem biblisch-feierlichen Kontext besser als „versprochen“.
- source_word: saluabuntur
  choice: gerettet werden
  rationale: Gibt den lateinischen Futur Passiv wieder und wahrt den eschatologischen Zukunftsbezug.
- source_word: dominantiorem fecerunt
  choice: mächtiger gemacht haben
  rationale: Bewahrt den ungewöhnlichen komparativischen Sinn von „dominantiorem“, ohne ihn zu dem glatteren, aber weniger genauen „zur Geltung gebracht“ abzuschwächen.
- source_word: nomen meum ... nominatur
  choice: mein Name jetzt genannt wird
  rationale: Erhält die bewusste Wiederholung von „Name/nennen“ und den passivischen Ausdruck des lateinischen Textes.
theological_decisions:
- issue: Zeitbezug der Rettung
  choice: die gerettet werden
  alternative: die gerettet sind
  rationale: „saluabuntur“ ist Futur Passiv; die Rettung wird daher nicht als bereits bestehender Zustand formuliert.
- issue: Aussage über die Herrlichkeit Gottes
  choice: meine Herrlichkeit jetzt mächtiger gemacht haben
  alternative: meiner Herrlichkeit jetzt größere Geltung verschafft haben
  rationale: Die gewählte Fassung lässt die auffällige Spannung stehen, dass die Wenigen Gottes Herrlichkeit „mächtiger“ gemacht haben, statt die Aussage interpretierend abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen Formulierungen über die mächtiger gemachte Herrlichkeit und den genannten Namen wurden wegen ihrer Nähe zum lateinischen Wortlaut bewusst nicht geglättet.
