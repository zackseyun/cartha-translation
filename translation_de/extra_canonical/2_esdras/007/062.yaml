source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'feruerunt et extincti sunt. Et respondit et dixi: O tu terra, quid peperisti, si sensus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: de
  text: 'Und ich antwortete: »O Erde, was hast du hervorgebracht, wenn der Verstand[a] wie die übrige Schöpfung aus Staub geschaffen wurde?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Einsicht; das Wahrnehmungs- und Denkvermögen.'
    reason: Das lateinische „sensus“ hat ein breiteres Bedeutungsspektrum als das deutsche „Verstand“.
lexical_decisions:
- source_word: terra
  choice: Erde
  rationale: Die direkte Anrede des lateinischen Textes wird schlicht und würdevoll wiedergegeben.
- source_word: quid peperisti
  choice: was hast du hervorgebracht
  rationale: Das Bild des Gebärens wird mit dem natürlichen deutschen Ausdruck „hervorgebracht“ bewahrt, ohne die Erde unnötig zu personifizieren.
- source_word: sensus
  choice: Verstand
  rationale: „Sensus“ bezeichnet hier das menschliche Denk- und Erkenntnisvermögen; „Verstand“ ist im Kontext natürlich, während die mögliche Bedeutung „Einsicht“ in einer Fußnote erhalten bleibt.
- source_word: pulvere
  choice: aus Staub
  rationale: Die Stoffangabe wird direkt wiedergegeben und bewahrt den Bezug auf die geschöpfliche Herkunft des Menschen.
- source_word: sicut et cetera creatura
  choice: wie die übrige Schöpfung
  rationale: Diese Formulierung wahrt den Vergleich mit dem übrigen Geschaffenen in idiomatischem Deutsch.
theological_decisions:
- issue: Verhältnis des menschlichen Verstandes zur übrigen Schöpfung
  choice: Die rhetorische Frage bleibt offen und spannungsvoll formuliert.
  alternative: Die Aussage als ausdrückliche Lehre über die Nichtigkeit oder Sündhaftigkeit des Menschen ausdeuten.
  rationale: Der Text beklagt die erdgebundene Herkunft des menschlichen Erkenntnisvermögens, legt hier aber keine weitergehende dogmatische Deutung ausdrücklich fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das formelhafte „antwortete und sagte“ wurde idiomatisch zu „antwortete“ gestrafft. Die Anrede „O Erde“ bewahrt die feierlich-klagende Rhetorik.
