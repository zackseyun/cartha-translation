  source_fidelity: 'Der deutsche Text gibt sämtliche Bestandteile des lateinischen Textes wieder: die anschließende Frage („modo respondebunt ...?“), die Dauerfrage zu Gottes Langmut, den Kontrast „nicht ihretwegen, sondern wegen der ... Zeiten“ sowie den unvollständigen Beginn der Erwiderung. „vorausgesehen“ bildet prouidit angemessen ab, ohne eine über den Wortlaut hinausgehende Festlegung auf Vorherbestimmung vorzunehmen.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „Mit denen, die in dieser Weltzeit leben, Geduld gehabt“ ist klar und natürlich; „Weltzeit“ ist hier eine vertretbare, sinnwahrende Wiedergabe von saeculum. Die offene Anführung und die Auslassungspunkte machen angemessen kenntlich, dass die direkte Rede im folgenden Vers fortgesetzt wird.
  terminology: „Der Höchste“, „Geduld“ und „Gnade gefunden“ passen zum Register und bewahren die einschlägigen Begriffe ohne konfessionelle Engführung. Die Wiedergabe von saeculum als „Weltzeit“ und von prouidit als „vorausgesehen“ erhält die semantische Offenheit des Ausgangstextes.
