source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'modo respondebunt in nouissimis temporibus? Quantum enim tempus ex quo longanimitatem habuit Altissimus his qui inhabitant saeculum, et non propter eos, sed propter ea quae prouidit tempora! Et respondi et dixi: si inueni gratiam'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/074.yaml
  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: de
  text: 'Wie werden sie dann in den letzten Zeiten antworten?[a] Denn wie lange hat der Höchste mit denen, die in dieser Weltzeit leben, Geduld gehabt – nicht ihretwegen, sondern wegen der Zeiten, die er vorausgesehen hat! Und ich antwortete: „Wenn ich Gnade gefunden habe …'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der einleitende Satz knüpft offenbar an den vorhergehenden Zusammenhang an; in manchen Versgliederungen wird er dem vorigen Vers zugerechnet.
    reason: Der bereitgestellte lateinische Quelltext enthält die Klausel, während die konsultierte englische Fassung von Vers 74 erst mit „Denn wie lange“ einsetzt.
lexical_decisions:
- source_word: longanimitatem habuit
  choice: hat … Geduld gehabt
  rationale: Gibt die anhaltende Langmut des Höchsten natürlich und würdig wieder, ohne den Sinn durch ein konfessionell geprägtes Fachwort einzuengen.
- source_word: saeculum
  choice: Weltzeit
  rationale: Bewahrt den zeitlich-weltlichen Bedeutungsumfang von saeculum besser als entweder nur „Welt“ oder nur „Zeitalter“.
- source_word: prouidit
  choice: vorausgesehen hat
  rationale: Entspricht dem lateinischen Wortlaut und vermeidet, aus dem Verb eine stärkere Aussage über Vorherbestimmung abzuleiten.
- source_word: inueni gratiam
  choice: Gnade gefunden habe
  rationale: Bewahrt die traditionelle und im Deutschen verständliche Gnadenformel des lateinischen Textes.
theological_decisions:
- issue: Grund der göttlichen Geduld
  choice: „nicht ihretwegen, sondern wegen der Zeiten, die er vorausgesehen hat“
  alternative: „nicht um ihretwillen, sondern um der von ihm bestimmten Zeiten willen“
  rationale: Die gewählte Fassung erhält die Spannung des Textes, ohne prouidit als ausdrückliche Vorherbestimmung auszulegen.
- issue: Bedeutung von saeculum
  choice: „Weltzeit“
  alternative: „Welt“ oder „Zeitalter“
  rationale: Die Übersetzung hält sowohl die gegenwärtige Weltordnung als auch deren zeitlichen Charakter offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der abrupte, unvollständige Beginn der folgenden Rede bleiben erhalten; die Auslassungspunkte zeigen an, dass der Satz im nächsten Vers weitergeführt wird.
