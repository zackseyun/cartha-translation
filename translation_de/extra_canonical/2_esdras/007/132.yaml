id: 2ES.7.132
reference: 2 Esdras 7:132
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: de
  text: 'Und ich antwortete: „Ich weiß, Herr, dass der Höchste jetzt barmherzig genannt wird, weil er sich derer erbarmt, die noch nicht in die Welt gekommen sind.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  choice: Und ich antwortete
  rationale: Die lateinische Doppelwendung ist eine semitisch geprägte Redeformel. Natürliches modernes Deutsch gibt sie ohne bedeutungsleere Verdopplung mit „ich antwortete“ wieder.
- source_word: Altissimus
  choice: der Höchste
  rationale: Die substantivierte Gottesbezeichnung wird formal und traditionsgemäß wiedergegeben.
- source_word: misericors / misereatur
  choice: barmherzig / sich erbarmt
  rationale: Die gemeinsame Wortwurzel und der begründende Zusammenhang zwischen Bezeichnung und Handeln bleiben im Deutschen hörbar.
- source_word: qui nondum in saeculo advenerunt
  choice: die noch nicht in die Welt gekommen sind
  rationale: In dieser Verbindung bezeichnet „in saeculum advenire“ das Eintreten in die menschliche Existenz, also das Zur-Welt-Kommen. „In das Zeitalter kommen“ wäre zwar formal näher, im Deutschen jedoch missverständlich und hier weniger idiomatisch.
theological_decisions:
- issue: Bedeutung von „saeculum“ im Kontext
  choice: Welt
  alternative: Zeitalter
  rationale: Obwohl „saeculum“ in 4 Esra auch ein eschatologisches Zeitalter bezeichnen kann, spricht die Wendung hier am ehesten von denen, die noch nicht geboren beziehungsweise in die Welt gekommen sind. Die Übersetzung legt darüber hinaus nicht fest, auf welche Weise ihnen Barmherzigkeit gilt.
- issue: Göttlicher Titel „domine“
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ wahrt den ehrfürchtigen Anredeton, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Latein, während die semitisch-lateinische Doppelredeformel idiomatisch gestrafft wird. Die Wiederholung von „barmherzig“ und „sich erbarmen“ bewahrt die rhetorische Verbindung des Ausgangstextes.
