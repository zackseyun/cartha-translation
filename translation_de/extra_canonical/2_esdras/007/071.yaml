source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: de
  text: Und nun erkenne aus deinen eigenen Worten, denn du hast gesagt, dass die Einsicht mit uns wächst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intellege
  choice: erkenne
  rationale: Der Imperativ fordert dazu auf, aus dem zuvor Gesagten eine Folgerung zu ziehen; „erkenne“ ist hier natürlich und bewahrt den gedanklichen Nachdruck.
- source_word: de sermonibus tuis
  choice: aus deinen eigenen Worten
  rationale: „Aus deinen Worten“ gibt den Ausgangspunkt der Folgerung wieder; „eigenen“ macht den rückbezüglichen Kontrast im Deutschen idiomatisch deutlich, ohne den Sinn zu erweitern.
- source_word: sensus
  choice: Einsicht
  rationale: Das lateinische Wort kann Wahrnehmung, Verstand oder Verständnis bezeichnen. „Einsicht“ passt zum argumentativen Zusammenhang und vermeidet die mögliche Verwechslung von „Verständnis“ mit zwischenmenschlichem Entgegenkommen.
- source_word: nobiscum crescit
  choice: mit uns wächst
  rationale: Die knappe und mehrdeutige lateinische Formulierung wird formal bewahrt; sie kann sowohl begleitendes Wachstum als auch Wachstum im Menschenleben nahelegen.
theological_decisions:
- issue: Art und Träger des Wachstums von sensus
  choice: „die Einsicht mit uns wächst“
  alternative: „unser Verständnis wächst“
  rationale: Die gewählte Fassung bewahrt die auffällige lateinische Konstruktion, in der „Einsicht“ das Subjekt ist und „mit uns“ steht, statt sie anthropologisch oder lehrmäßig enger festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am lateinischen Argumentationsgang, klingt jedoch natürlich; keine Fußnoten erforderlich.
