  source_fidelity: Die Hauptdeutung von *terram Adam dare* als „die Erde bringt Adam hervor“ ist angesichts des Sprachgebrauchs von 4 Esra gut begründet und wahrscheinlicher als „Adam die Erde geben“. Der Entwurf legt jedoch im zweiten Glied die Erde als Handelnde von *coercere eum* fest. Das lateinische *coercere* hat hier keinen ausdrücklich genannten Handelnden; die Übersetzung sollte diese Offenheit bewahren.
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. Die überarbeitete Satzfügung vermeidet zugleich die unbeabsichtigte Aussage, die Erde selbst halte Adam vom Sündigen zurück.
