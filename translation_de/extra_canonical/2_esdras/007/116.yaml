source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: hic sermo meus primus et novissimus, quoniam melius erat non dare terramAdam vel, cum iam dedisset, coercereeum ut non peccaret.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: de
  text: 'Und ich antwortete und sagte: »Dies ist mein erstes und letztes Wort: Es wäre besser gewesen, hätte die Erde Adam nicht hervorgebracht oder wäre er, nachdem die Erde ihn bereits hervorgebracht hatte, vom Sündigen zurückgehalten worden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die lateinische Formulierung kann auch verstanden werden: »Es wäre besser gewesen, Adam die Erde nicht zu geben oder ihn, nachdem sie ihm bereits gegeben worden war, vom Sündigen zurückzuhalten.« Der Sprachgebrauch des Werkes spricht jedoch eher dafür, dass die Erde Adam hervorbringt.'
    reason: Der indeklinable Name „Adam“ lässt die Kasusfunktion formal offen. Der innerwerkliche Sprachgebrauch unterstützt jedoch die Übersetzung „die Erde Adam hervorbringen“.
lexical_decisions:
- source_word: dare
  choice: hervorbringen
  rationale: In der Wendung „terram Adam dare“ bezeichnet „dare“ wahrscheinlich das Hervorbringen Adams durch die Erde; diese Lesart entspricht dem Sprachgebrauch des Werkes und gibt dem folgenden „eum“ einen klaren Bezug.
- source_word: coercere
  choice: zurückhalten
  rationale: Das Verb bezeichnet hier ein wirksames Hindern oder Beschränken, das Adam vom Sündigen abgehalten hätte, ohne näher zu bestimmen, auf welche Weise.
- source_word: sermo
  choice: Wort
  rationale: „Mein erstes und letztes Wort“ ist im Deutschen eine natürliche, würdevolle Wiedergabe für eine abschließende grundlegende Aussage.
theological_decisions:
- issue: Subjekt und Bedeutung von „non dare terram Adam“
  choice: Die Erde bringt Adam hervor.
  alternative: Die Erde wird Adam gegeben.
  rationale: Da „Adam“ im Lateinischen indeklinabel ist, lässt die Formulierung grammatisch auch die alternative Zuordnung zu. Der innerwerkliche Sprachgebrauch, in dem Erde beziehungsweise Staub Adam „gibt“, stützt jedoch die Deutung als Hervorbringen. Die andere Möglichkeit wird in der Fußnote bewahrt.
- issue: Art des Zurückhaltens vom Sündigen
  choice: Keine nähere Bestimmung der göttlichen oder geschöpflichen Handlungsweise.
  alternative: Ausdrückliche Deutung als Entzug des freien Willens oder als göttlicher Zwang.
  rationale: Der Text sagt lediglich, Adam hätte zurückgehalten werden sollen, sodass er nicht sündigte; eine systematisch-theologische Erklärung würde die Spannung des Textes unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur und die zugespitzte theologische Klage bleiben erhalten; schwerfällige lateinische Infinitivkonstruktionen werden in natürliche Konditionalsätze überführt.
