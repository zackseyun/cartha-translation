source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: de
  text: Denn mein Sohn Jesus[b] wird zusammen mit denen offenbart werden, die bei ihm sind, und vierhundert Jahre lang wird er die Übriggebliebenen erfreuen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er wird die Übriggebliebenen vierhundert Jahre lang erfreuen.“ Die Zeitangabe bezeichnet die Dauer des Erfreuens.'
    reason: Dauerangabe von annis quadringentis
  - marker: b
    text: 'Der lateinische Text zeigt hier einen auffälligen Wechsel der Bezeichnung: In 7,28 steht filius meus Iesus („mein Sohn Jesus“), in 7,29 dagegen filius meus Christus („mein Sohn Christus“ bzw. „mein Sohn, der Messias“). Der Abschnitt schildert eine vierhundertjährige Zeit, danach den Tod des Messias, sieben Tage uranfänglichen Schweigens und schließlich die Auferstehung.'
    reason: Messianische Bezeichnung und unmittelbarer literarischer Zusammenhang
lexical_decisions:
- source_word: revelabitur
  choice: wird … offenbart werden
  rationale: Gibt das lateinische Futur Passiv formal und in würdigem, verständlichem Deutsch wieder.
- source_word: Filius meus Iesus
  choice: mein Sohn Jesus
  rationale: Bewahrt die auffällige konkrete Namensform des lateinischen Textes, ohne sie mit „Christus“ oder „Messias“ aus dem Folgevers anzugleichen.
- source_word: cum his qui cum eo
  choice: zusammen mit denen …, die bei ihm sind
  rationale: Gibt die wiederholte Präposition cum natürlich wieder; das im Lateinischen elliptisch fehlende sunt ist dem Sinn nach ergänzt.
- source_word: qui relicti sunt
  choice: die Übriggebliebenen
  rationale: Erfasst den perfektisch-passiven Sinn und bezeichnet diejenigen, die zurück- bzw. am Leben geblieben sind, ohne die Art ihres Verbleibens näher festzulegen.
- source_word: iucundabit
  choice: wird er … erfreuen
  rationale: Bewahrt das aktive, kausative Verb des lateinischen Textes; eine Wiedergabe mit „werden sich freuen“ würde die grammatische Form ändern.
- source_word: annis quadringentis
  choice: vierhundert Jahre lang
  rationale: Versteht den Ablativ als Zeitdauer und ordnet ihn im Haupttext dem Erfreuen zu; die mögliche andere Anbindung wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Benennung der messianischen Gestalt
  choice: „mein Sohn Jesus“ entsprechend Iesus in Vers 28
  alternative: „mein Sohn, der Messias“ oder „mein Sohn Christus“
  rationale: Die konkrete Lesart des lateinischen Verses wird bewahrt und nicht mit Christus in Vers 29 harmonisiert.
- issue: Bezug der vierhundert Jahre
  choice: Die Zeitangabe beschreibt im Haupttext die Dauer seines Erfreuens der Übriggebliebenen.
  alternative: Die Zeitangabe beschreibt, wie lange die Betreffenden übrig bleiben.
  rationale: Als ablativische Dauerangabe lässt sie sich am natürlichsten adverbial auf iucundabit beziehen; wegen Wortstellung und Überlieferungsform bleibt die alternative Anbindung jedoch möglich und wird ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber durch „zusammen mit“ und die Stellung der Zeitangabe idiomatisch gegliedert. Die genuine Mehrdeutigkeit von annis quadringentis wird nicht stillschweigend beseitigt, sondern durch Fußnote [a] offengehalten.
