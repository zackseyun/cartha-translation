id: 2ES.7.122
reference: 2 Esdras 7:122
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: de
  text: Und weil die Herrlichkeit des Höchsten beginnen wird, jene zu beschützen, die in Reinheit gelebt haben[a], wir aber auf den schlimmsten Wegen gegangen sind?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich rein verhalten haben“.'
    reason: Die Alternative bildet conversati sunt stärker als Verhalten beziehungsweise Lebensführung ab.
lexical_decisions:
- source_word: quoniam
  choice: weil
  rationale: Gibt die begründende Konjunktion wieder und bewahrt den Charakter des Satzes als abhängige, rhetorische Frage.
- source_word: gloria Altissimi
  choice: die Herrlichkeit des Höchsten
  rationale: Nahe, klare Wiedergabe der lateinischen Gottesbezeichnung und des theologischen Schlüsselbegriffs.
- source_word: protegere
  choice: beschützen
  rationale: Entspricht der konkreten Schutzbedeutung des lateinischen Verbs, ohne zusätzliche Bildsprache einzuführen.
- source_word: caste conversati sunt
  choice: in Reinheit gelebt haben
  rationale: Erfasst das moralisch-religiös reine Verhalten umfassender als das im heutigen Deutsch meist sexuell verengte „keusch“.
- source_word: pessimis viis ambulavimus
  choice: auf den schlimmsten Wegen gegangen sind
  rationale: Bewahrt die Wegmetapher und gibt den Superlativ pessimis deutlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von caste
  choice: in Reinheit gelebt haben
  alternative: keusch gelebt haben
  rationale: Der Gegensatz zu den „schlimmsten Wegen“ legt umfassende moralische und religiöse Reinheit nahe; eine ausschließlich sexuelle Deutung wird daher vermieden.
- issue: Syntaktisch unvollständige Frage
  choice: Die mit „weil“ eingeleitete, vom Kontext abhängige Frage bleibt erhalten.
  alternative: Umformung zu einem selbstständigen Aussagesatz
  rationale: Der lateinische Wortlaut ist als rhetorisches Satzglied formuliert; eine Glättung würde die überlieferte Spannung und den Anschluss an den Kontext abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegmetapher und die rhetorisch abhängige Frageform werden bewahrt; „in Reinheit“ vermeidet die heute oft sexuelle Verengung von „keusch“.
