source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: æramentum, plumbum super ferrum, et fictile super plumbum. Aestima et tu, quæ sint pretiosa et desiderabilia, quod multiplicatur aut quod rarum nascitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: de
  text: 'So beurteile auch du, was kostbar und begehrenswert ist: was sich vermehrt oder was nur selten entsteht?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aestima et tu
  choice: So beurteile auch du
  rationale: Gibt den auffordernden Sinn von „aestima“ und die ausdrückliche Einbeziehung des Gegenübers durch „et tu“ natürlich wieder.
- source_word: pretiosa et desiderabilia
  choice: kostbar und begehrenswert
  rationale: Bewahrt die beiden Wertbegriffe des Lateinischen, ohne sie miteinander zu verschmelzen.
- source_word: quod multiplicatur
  choice: was sich vermehrt
  rationale: Folgt dem dynamischen Verb „multiplicatur“ genauer als eine rein statische Wiedergabe wie „was reichlich vorhanden ist“.
- source_word: quod rarum nascitur
  choice: was nur selten entsteht
  rationale: „Entsteht“ ist im Deutschen bei den hier verglichenen Dingen natürlicher als „wird selten geboren“, bewahrt aber den Vorgangscharakter von „nascitur“; „nur selten“ drückt die Seltenheit idiomatisch aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im gelieferten lateinischen Ausschnitt vorangehende fragmentarische Rest („æramentum …“) ist syntaktisch an den vorherigen Vers gebunden und wird entsprechend der geprüften Versabgrenzung der englischen Konsultationsfassung nicht in 7,57 aufgenommen.
