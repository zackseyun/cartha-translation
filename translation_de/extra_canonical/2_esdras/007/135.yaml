  yaml_path: translation/extra_canonical/2_esdras/007/135.yaml
  text: and generous, because indeed he is willing to give rather than demand,
translation:
  language: de
  text: und freigebig, weil er ja lieber schenken als fordern will,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: munificus
  choice: freigebig
  rationale: Gibt die Bedeutung von großzügiger, bereitwilliger Freigebigkeit im Deutschen natürlich und würdig wieder.
- source_word: quoniam quidem
  choice: weil er ja
  rationale: „Weil“ bildet quoniam ab; das unaufdringliche „ja“ bewahrt die bekräftigende Nuance von quidem.
- source_word: donare
  choice: schenken
  rationale: Bewahrt gegenüber dem allgemeineren „geben“ den Gedanken einer unentgeltlichen Gabe.
- source_word: pro exigere
  choice: lieber … als fordern
  rationale: Gibt den hier gemeinten Vorzug des Schenkens gegenüber dem Einfordern idiomatisch wieder; „fordern“ bewahrt die Härte von exigere, ohne im Deutschen unnötig technisch zu klingen.
theological_decisions:
- issue: Gegenüberstellung von göttlichem Schenken und Fordern
  choice: lieber schenken als fordern
  alternative: schenken statt einzufordern
  rationale: Die gewählte Fassung erhält die im Lateinischen ausgedrückte Gegenüberstellung, ohne daraus eine absolute Aussage zu machen, dass niemals etwas gefordert werde.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Kleinschreibung am Anfang und das abschließende Komma bewahren den Charakter als fortlaufendes Satzglied des Kontextes.
