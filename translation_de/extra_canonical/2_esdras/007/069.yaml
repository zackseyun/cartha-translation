  - severity: low
    issue: Konditionalform im Entwurf
    rationale: Die Kombination »wenn ... müssten, wäre es uns ... ergangen« ist zwar verständlich, aber weniger stimmig. »Wenn wir ... nicht vor Gericht kämen, wäre es uns vielleicht besser ergangen« bildet die irreale Bedingung und die vergangenheitsbezogene Konsequenz idiomatisch ab.
  revised_text: Und wenn wir nach dem Tod nicht vor Gericht kämen, wäre es uns vielleicht besser ergangen.«
