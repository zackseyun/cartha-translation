review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: ein Gericht nach dem Tod und die vorsichtig formulierte Aussage, dass es den Betroffenen andernfalls vielleicht besser ergangen wäre. »müssten« fügt jedoch eine im Latein nicht ausdrücklich enthaltene Notwendigkeitsnuance hinzu. Zudem gibt »vor Gericht kommen« das lateinische in iudicio venientes unmittelbarer wieder als »vor das Gericht treten«.'
  naturalness: Der Entwurf ist verständlich und würdevoll, verbindet aber eine gegenwärtige irreal wirkende Bedingung (»müssten«) mit einer vergangenheitsbezogenen Folge (»wäre es uns ... ergangen«). Mit »kämen« ist die Konstruktion glatt und entspricht der quellsprachlichen Bedingungsform.
  terminology: »Gericht« ist für iudicium angemessen. »Nach dem Tod« und »vielleicht« geben post mortem beziehungsweise fortassis präzise wieder. Die Revision vermeidet eine zusätzliche Modalbedeutung.
