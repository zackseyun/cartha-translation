  yaml_path: translation/extra_canonical/2_esdras/007/069.yaml
  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: de
  text: Und wenn wir nach dem Tod nicht vor Gericht kämen, wäre es uns vielleicht besser ergangen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post mortem
  choice: nach dem Tod
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Bestimmung.
- source_word: in iudicio uenientes
  choice: vor das Gericht treten müssten
  rationale: "Gibt das lateinische Bild des Komm\uFEFFens ins Gericht idiomatisch wieder; der Konjunktiv »müssten« entspricht der irrealen Bedingung, ohne den Gerichtsausgang vorwegzunehmen."
- source_word: melius fortassis nobis uenisset
  choice: wäre es uns vielleicht besser ergangen
  rationale: Bewahrt sowohl die Unsicherheit von »fortassis« als auch die idiomatische Bedeutung von »melius ... nobis uenisset«.
theological_decisions:
- issue: Gericht nach dem Tod
  choice: nach dem Tod ... vor das Gericht treten
  alternative: nach dem Tod ... ins Gericht kommen
  rationale: Die Formulierung hält lediglich das im Latein genannten Eintreten in ein Gericht fest und legt weder Art noch Zeitpunkt oder Ausgang des Gerichts näher fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die irreale Bedingung wird natürlich mit »wenn ... nicht ... müssten« und »wäre« ausgedrückt; »vielleicht« bewahrt die vorsichtige Aussage des lateinischen fortassis.
