  yaml_path: translation/extra_canonical/2_esdras/007/128.yaml
  text: if he is defeated, he will suffer what you have said; but if he conquers, he will receive what I say.
translation:
  language: de
  text: Wenn er besiegt wird, wird er erleiden, was du gesagt hast; wenn er aber siegt, wird er empfangen, was ich sage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: besiegt wird
  rationale: Gibt die konditionale passive Form natürlich und nah am lateinischen Wortlaut wieder.
- source_word: patiatur
  choice: wird er erleiden
  rationale: Im Zusammenhang der Bedingung bezeichnet das Verb die leidvolle Folge; die deutsche Futurform macht den Folgesatz klar.
- source_word: vicerit
  choice: siegt
  rationale: Bewahrt den direkten Gegensatz zu „besiegt wird“ und vermeidet eine unnötige Ausdeutung.
- source_word: recipiet
  choice: wird er empfangen
  rationale: Entspricht dem lateinischen Verb und erhält den feierlichen, theologischen Ton.
theological_decisions:
- issue: Bezug von „was du gesagt hast“ und „was ich sage“
  choice: Die knappen, inhaltlich offenen Verweise bleiben erhalten.
  alternative: Die jeweils gemeinte Strafe beziehungsweise Belohnung ausdrücklich benennen.
  rationale: Der lateinische Text nennt den Inhalt nicht erneut; eine Konkretisierung würde die Aussage interpretierend erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Wahrung der parallelen Satzstruktur und des Gegensatzes zwischen Niederlage und Sieg.
