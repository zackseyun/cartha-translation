  text: 'The second way: because they cannot now make a good repentance so as to live[a].'
translation:
  language: de
  text: 'Der zweite Weg: weil sie keine gute Umkehr vollziehen können, um zu leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Secunda uia
  choice: Der zweite Weg
  rationale: Bewahrt die Gliederung und das Bild des lateinischen Textes in natürlichem Deutsch.
- source_word: reuersionem bonam facere
  choice: eine gute Umkehr vollziehen
  rationale: „Umkehr“ gibt reuersio als Sinnes- und Lebenswende wieder; „vollziehen“ wahrt die Verbindung mit facere, ohne die Wendung konfessionell auf den festen Ausdruck „Buße tun“ festzulegen.
- source_word: ut uiuant
  choice: um zu leben
  rationale: Gibt den Ziel- beziehungsweise Folgesinn von ut knapp und idiomatisch wieder, ohne den unvollständig überlieferten Ausschnitt unnötig auszubauen.
theological_decisions:
- issue: Zeitliche Einordnung der unmöglichen Umkehr
  choice: Kein ausdrückliches „jetzt“ ergänzt
  alternative: „weil sie jetzt keine gute Umkehr mehr vollziehen können“
  rationale: Im lateinischen Wortlaut steht kein Temporaladverb wie nunc oder iam. Der Zusammenhang kann die nachträgliche Unmöglichkeit nahelegen, doch diese Deutung wird nicht in den Haupttext eingetragen.
- issue: Wiedergabe von reuersio
  choice: Umkehr
  alternative: Buße
  rationale: „Umkehr“ wahrt die breite Bedeutung einer Rückwendung und vermeidet eine unnötige Festlegung auf eine bestimmte kirchliche Bußlehre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsform des Ausgangstextes bleibt erhalten; auf ein nicht ausdrücklich belegtes „jetzt“ oder „mehr“ wird verzichtet.
