base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/130.yaml
  text: But they did not believe him, nor the prophets after him, nor even me, who spoke to them.
translation:
  language: de
  text: Doch sie glaubten ihm nicht, auch nicht den Propheten nach ihm, nicht einmal mir, der zu ihnen sprach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non crediderunt autem
  choice: Doch sie glaubten ... nicht
  rationale: Gibt den adversativen Anschluss und die Vergangenheitsform des lateinischen Textes natürlich und präzise wieder.
- source_word: sed nec ... sed nec
  choice: auch nicht ... und nicht einmal
  rationale: Bewahrt die steigernde Reihung; „nicht einmal“ hebt den abschließenden Bezug auf den göttlichen Sprecher angemessen hervor.
- source_word: qui locutus sum ad eos
  choice: der zu ihnen gesprochen hatte
  rationale: Das Plusquamperfekt macht im Deutschen klar, dass das Sprechen dem beschriebenen Unglauben vorauslag, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Identität des Sprechers in „mihi“
  choice: „mir“ ohne erläuternde Benennung
  alternative: „mir, Gott“ oder eine andere ausdrückliche Identifikation
  rationale: Der lateinische Text nennt den Sprecher an dieser Stelle nicht ausdrücklich; die Übersetzung bewahrt diesen kontextabhängigen Bezug und fügt keine theologische Identifikation ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur des lateinischen Satzes bleibt erkennbar, wird aber idiomatisch gegliedert.
