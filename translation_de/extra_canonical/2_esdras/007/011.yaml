id: 2ES.7.11
reference: 2 Esdras 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter eos enim feci saeculum, et quando transgressus est Adam constitutiones meas, iudicatum est quod factum est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: de
  text: Denn ihretwegen habe ich die Welt[a] geschaffen. Und als Adam meine Ordnungen übertrat, wurde das Geschaffene gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zeitalter“.'
    reason: Das lateinische saeculum kann sowohl die Welt als auch ein Zeitalter bezeichnen.
lexical_decisions:
- source_word: propter eos
  choice: ihretwegen
  rationale: 'Die Wendung bezeichnet hier den Zweck beziehungsweise den begünstigten Personenkreis der Schöpfung: Die Welt wurde um ihretwillen geschaffen.'
- source_word: saeculum
  choice: Welt
  rationale: Obwohl saeculum auch „Zeitalter“ bedeuten kann, weist die Verbindung mit feci und die Wiederaufnahme durch quod factum est hier auf die geschaffene Welt.
- source_word: constitutiones meas
  choice: meine Ordnungen
  rationale: „Ordnungen“ gibt die von Gott festgesetzten Bestimmungen würdig und verständlich wieder, ohne den Ausdruck unnötig auf einzelne Gebote zu verengen.
- source_word: iudicatum est quod factum est
  choice: wurde das Geschaffene gerichtet
  rationale: Die passive Form und die sachliche Mehrdeutigkeit des lateinischen Wortlauts bleiben erhalten; es wird nicht näher bestimmt, worin dieses Gericht bestand.
theological_decisions:
- issue: Bezug von „ihretwegen“
  choice: Das maskuline Pluralpronomen bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: „um Israels willen“ oder eine andere ausdrückliche Bezugsangabe
  rationale: Der Vers selbst nennt den Bezug nicht; eine Identifizierung aus dem Kontext sollte nicht in den Haupttext eingetragen werden.
- issue: Umfang des Gerichts nach Adams Übertretung
  choice: „das Geschaffene“ wurde gerichtet
  alternative: Adam wurde gerichtet; die Welt wurde verurteilt
  rationale: Das grammatische Subjekt ist quod factum est. Die Übersetzung bewahrt sowohl den Schöpfungsbezug als auch die theologische Spannung der Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „ihretwegen“ ist natürlicher als „um ihretwillen“, während „das Geschaffene“ die knappe und bewusst offene Ausdrucksweise des lateinischen Textes wahrt.
