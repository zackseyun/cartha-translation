id: 2ES.7.37
reference: 2 Esdras 7:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: de
  text: 'Dann wird der Höchste zu den Völkern, die erweckt worden sind[a], sagen: »Seht und begreift, wen ihr verleugnet habt, wem ihr nicht gedient habt und wessen Wege ihr verachtet habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Völker, die aufgeweckt worden sind«; im Zusammenhang ist auch die Auferweckung zum Gericht mitgemeint.'
    reason: Das lateinische excitatas kann das Aufwecken beziehungsweise Erwecken bezeichnen und trägt im Kontext zugleich Auferstehungsbedeutung.
lexical_decisions:
- source_word: Altissimus
  choice: der Höchste
  rationale: Die geläufige und würdige deutsche Wiedergabe des lateinischen Gottesprädikats.
- source_word: excitatas gentes
  choice: die Völker, die erweckt worden sind
  rationale: Bewahrt sowohl das Passiv als auch das im Kontext wichtige Bild des Erwachens; »erweckt« kann zugleich die Auferstehung zum Gericht anklingen lassen, ohne sie als einzige Bedeutung festzulegen.
- source_word: uidete et intellegite
  choice: Seht und begreift
  rationale: Gibt die beiden Imperative knapp und natürlich wieder; »begreift« bezeichnet hier verstehende Einsicht.
- source_word: quem negastis
  choice: wen ihr verleugnet habt
  rationale: »Verleugnen« erfasst negare bei einer Person genauer als das bloße »bestreiten«.
theological_decisions:
- issue: Bedeutung von excitatas im Zusammenhang von Auferstehung und Gericht
  choice: erweckt worden sind
  alternative: auferweckt worden sind / aufgeweckt worden sind
  rationale: »Erweckt« wahrt die Spannung zwischen dem Bild des Aufwachens und der Auferstehung. »Auferweckt« würde den Auferstehungssinn stärker festlegen, während »aufgeweckt« im heutigen Deutsch leicht alltagssprachlich oder im Sinn von »munter« verstanden wird.
- issue: Ergänzung des im bereitgestellten lateinischen Ausschnitt abgebrochenen Satzendes
  choice: wem ihr nicht gedient habt und wessen Wege ihr verachtet habt
  alternative: Nur bis »wen ihr verleugnet habt« übersetzen
  rationale: Der lateinische Beleg bricht nach »uel cui non« mitten im Satz ab. Das Satzende wird entsprechend der auditierten englischen Konsultationsschicht wiedergegeben, ohne darüber hinaus zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und eindringlich. Die Relativkonstruktion vermeidet das missverständliche Adjektiv »aufgeweckte« und erhält das lateinische Passiv.
