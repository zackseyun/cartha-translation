- from: 'Denn sieh: Die Zeit wird kommen. Wenn dann die Zeichen eintreffen, die ich dir vorausgesagt habe, wird die Braut erscheinen und die sichtbar werdende Stadt[a]; und es wird gezeigt werden, was jetzt der Erde entzogen ist.'
  to: 'Denn sieh: Die Zeit wird kommen. Wenn dann die Zeichen eintreffen, die ich dir vorausgesagt habe, wird die Braut erscheinen, ebenso die sichtbar werdende Stadt; und es wird gezeigt werden, was jetzt der Erde entzogen ist.'
  rationale: Die Revision ergänzt bei der Stadt die im Deutschen notwendige parallele Prädikation („ebenso … wird erscheinen“), welche die in apparescens liegende Erscheinungsbewegung aufnimmt. Sie hält am überlieferten lateinischen Wortlaut fest und ersetzt ihn weder im Haupttext noch in der Anmerkung durch die textkritische Rekonstruktion einer verborgenen Stadt.
