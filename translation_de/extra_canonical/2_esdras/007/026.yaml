    text: 'Die knappe Folge von Braut und sichtbar werdender Stadt verbindet wahrscheinlich Bilder der Wiederherstellung Zions beziehungsweise Jerusalems in apokalyptischer Sprache. Der lateinische Text erklärt das Verhältnis zwischen Braut und Stadt nicht. Möglich ist auch die Wiedergabe: »die erscheinende Stadt«.'
