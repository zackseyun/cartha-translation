base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: de
  text: 'Denn sieh: Die Zeit wird kommen. Wenn dann die Zeichen eintreffen, die ich dir vorausgesagt habe, wird die Braut erscheinen, ebenso die sichtbar werdende Stadt; und es wird gezeigt werden, was jetzt der Erde entzogen ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce enim
  choice: Denn sieh
  rationale: Gibt sowohl die begründende Partikel enim als auch den aufmerksamkeitslenkenden Ausruf ecce knapp und würdig wieder.
- source_word: venient signa
  choice: die Zeichen eintreffen
  rationale: Natürliches Deutsch für das Eintreten angekündigter Zeichen; vermeidet die schwerfällige Wiederholung von »kommen«.
- source_word: sponsa
  choice: die Braut
  rationale: Direkte Entsprechung, ohne das apokalyptische Bild auf eine bestimmte Deutung festzulegen.
- source_word: apparescens civitas
  choice: die sichtbar werdende Stadt
  rationale: Bewahrt den präsentischen Partizipialcharakter des lateinischen Wortlauts und ersetzt ihn nicht durch die rekonstruierende Lesart einer »jetzt verborgenen Stadt«.
- source_word: subducitur terra
  choice: der Erde entzogen ist
  rationale: 'Lässt terra als Ablativ der Trennung erkennen: Etwas ist gegenwärtig dem Bereich der Erde entzogen.'
theological_decisions:
- issue: Verhältnis von Braut und Stadt
  choice: Beide Bilder werden entsprechend dem knappen lateinischen Wortlaut nebeneinandergestellt.
  alternative: Braut und Stadt ausdrücklich als ein und dieselbe Größe identifizieren.
  rationale: Der Text erläutert ihre Beziehung nicht; eine Gleichsetzung würde die genuine apokalyptische Spannung auflösen.
- issue: Textgeschichtliche Rekonstruktion von apparescens civitas
  choice: Der überlieferte lateinische Wortlaut wird als »die sichtbar werdende Stadt« übersetzt.
  alternative: »die jetzt verborgene Stadt wird erscheinen«
  rationale: Die Alternative beruht auf einer Rekonstruktion hinter dem Lateinischen und darf den ausdrücklich vorgegebenen Quelltext nicht ersetzen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Der lange lateinische Satz ist behutsam gegliedert; die Bildfolge und ihre Mehrdeutigkeit bleiben erhalten.
