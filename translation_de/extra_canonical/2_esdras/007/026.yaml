review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen lateinischen Elemente zutreffend wieder: ecce enim, die angekündigten Zeichen, sponsa, die partizipiale Beschreibung apparescens civitas sowie das gegenwärtig der Erde Entzogene. Insbesondere wird die rekonstruierende Lesart einer „jetzt verborgenen Stadt“ nicht in den Haupttext importiert. Die deutsche Satzfügung lässt jedoch bei „die sichtbar werdende Stadt“ ein erforderliches finites Prädikat aus und bildet die lateinische Bildfolge dadurch nicht verständlich ab.'
  naturalness: „Denn sieh“ und „eintreffen“ sind verständlich und im gehobenen apokalyptischen Register möglich. Die Koordination „wird die Braut erscheinen und die sichtbar werdende Stadt“ ist im Deutschen jedoch unvollständig. Eine ausdrücklich parallele Verbfügung macht den Satz idiomatisch, ohne die Bildfolge oder ihre offene Beziehung zu deuten.
  terminology: „Braut“, „Stadt“ und „der Erde entzogen“ sind angemessen. „Sichtbar werdende Stadt“ gibt apparescens sachgerecht als gegenwärtig-prozesshafte Erscheinung wieder. Die Anmerkung wahrt die Unsicherheit über das Verhältnis von Braut und Stadt und sollte die alternative, noch näher am Partizip bleibende Formulierung als Übersetzungsoption kenntlich machen.
  issues:
  - severity: medium
    issue: Unvollständige deutsche Koordination bei Braut und Stadt
    rationale: Nach „wird die Braut erscheinen und die sichtbar werdende Stadt“ fehlt für das zweite koordinierte Subjekt ein finites Verb. Das Lateinische ist an dieser Stelle selbst knapp und textgeschichtlich problematisch, doch die deutsche Übersetzung soll nicht ungrammatisch werden. „… die Braut wird erscheinen, ebenso die sichtbar werdende Stadt“ drückt die implizite parallele Erscheinung aus, ohne Braut und Stadt gleichzusetzen.
  revised_text: 'Denn sieh: Die Zeit wird kommen. Wenn dann die Zeichen eintreffen, die ich dir vorausgesagt habe, wird die Braut erscheinen, ebenso die sichtbar werdende Stadt; und es wird gezeigt werden, was jetzt der Erde entzogen ist.'
  revised_footnotes:
