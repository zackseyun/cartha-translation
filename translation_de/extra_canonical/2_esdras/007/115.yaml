  to: Dann wird also niemand Erbarmen mit dem haben können, der im Gericht unterlegen ist,[a] und niemand wird den zu Fall bringen können, der sich durchgesetzt hat.
  rationale: Ausschließlich die deutsche Wortstellung im ersten Teilsatz wurde korrigiert. Die Aussage, die gerichtliche Ambiguität und die parallele Struktur des lateinischen Satzes bleiben erhalten.
