source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: de
  text: Dann wird also niemand Erbarmen mit dem haben können, der im Gericht unterlegen ist,[a] und niemand wird den zu Fall bringen können, der sich durchgesetzt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: besiegt worden ist.'
    reason: Die Alternative bewahrt die wörtlichere Bedeutung von lateinisch victus, während der Haupttext den gerichtlichen Zusammenhang hervorhebt.
lexical_decisions:
- source_word: Tunc ergo
  choice: Dann wird also
  rationale: Gibt sowohl den zeitlichen Bezug von tunc als auch die folgernde Funktion von ergo natürlich wieder.
- source_word: misereri eius
  choice: mit dem Erbarmen haben
  rationale: Bewahrt die Bedeutung des lateinischen Deponens misereri mit Genitiv und klingt im modernen Deutschen natürlich.
- source_word: in iudicio victus fuerit
  choice: im Gericht unterlegen ist
  rationale: Der Zusammenhang ist forensisch; unterliegen gibt victus präzise wieder, ohne unnötig bereits eine Verurteilung auszudrücken.
- source_word: demergere
  choice: zu Fall bringen
  rationale: Gibt das Herabdrücken oder Stürzen idiomatisch wieder und bewahrt den Gegensatz zum erfolgreichen Ausgang des Gerichts.
- source_word: qui vicerit
  choice: der sich durchgesetzt hat
  rationale: Im gerichtlichen Kontext bezeichnet vincere das Obsiegen; diese Formulierung vermeidet unpassende militärische Nebenbedeutungen.
theological_decisions:
- issue: Endgültigkeit des Gerichtsausgangs
  choice: 'Die parallelen Aussagen bleiben uneingeschränkt stehen: Weder kann dem Unterlegenen nachträglich geholfen noch der Obsiegende gestürzt werden.'
  alternative: Die erste Hälfte ausdrücklich als Verurteilung und die zweite als Rechtfertigung deuten.
  rationale: Der lateinische Text spricht mit victus und vicerit bildhaft vom Unterliegen und Obsiegen im Gericht, ohne die theologischen Kategorien weiter auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die spiegelbildliche Struktur von victus und vicerit wird durch „unterlegen“ und „sich durchgesetzt“ im forensischen Sinn wiedergegeben; militärisch klingende Formulierungen werden im Haupttext vermieden.
