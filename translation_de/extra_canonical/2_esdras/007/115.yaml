  source_fidelity: Die gerichtliche Gegenüberstellung von victus fuerit und vicerit ist zutreffend als „unterlegen“ bzw. „sich durchgesetzt hat“ wiedergegeben. „Zu Fall bringen“ gibt demergere im bildhaften Gegensatz angemessen wieder, ohne über die genaue Art des Stürzens hinauszugehen.
  naturalness: Die Wortfolge „mit dem Erbarmen haben“ ist im modernen Standarddeutschen nicht idiomatisch und grammatisch missglückt. Erforderlich ist „Erbarmen mit dem haben“ oder „mit dem Erbarmen haben“.
  terminology: „Gericht“, „unterlegen“ und „sich durchgesetzt“ bewahren den forensischen Registerton und vermeiden sowohl eine ungesicherte Gleichsetzung mit Verurteilung als auch martialische Konnotationen. Die Fußnotenalternative „besiegt worden ist“ ist als wörtlichere, aber weniger forensische Möglichkeit vertretbar.
