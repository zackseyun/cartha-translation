source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post annos hos, et morietur Filius meus Christus et omnes qui spiramentum habent hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/029.yaml
  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: de
  text: Und nach diesen Jahren wird mein Sohn, der Messias, sterben, und alle, die menschlichen Atem haben, werden sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filius meus Christus
  choice: mein Sohn, der Messias
  rationale: „Filius meus“ wird unmittelbar als „mein Sohn“ wiedergegeben; das lateinische „Christus“ bezeichnet hier den Gesalbten beziehungsweise Messias. Die Apposition hält beide Aussagen klar zusammen.
- source_word: spiramentum ... hominis
  choice: menschlichen Atem
  rationale: Die natürliche deutsche Wendung gibt den Lebensatem des Menschen wieder, ohne den Ausdruck unnötig auszudeuten.
- source_word: et omnes
  choice: ebenso alle
  rationale: Das zweite „et“ verbindet alle Menschen mit dem zuvor ausgesagten Sterben. „Ebenso“ macht diese im Lateinischen elliptische Zuordnung im Deutschen verständlich.
theological_decisions:
- issue: Tod des Sohnes beziehungsweise Messias
  choice: Die Aussage, dass Gottes Sohn, der Messias, sterben wird, bleibt uneingeschränkt stehen.
  alternative: Den Tod nur auf die übrigen Menschen beziehen oder christologisch erklärend umformulieren.
  rationale: Der lateinische Text sagt ausdrücklich „morietur Filius meus Christus“. Die theologische Spannung darf nicht abgeschwächt oder durch eine konfessionelle Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ellipse des lateinischen zweiten Satzglieds wird mit „ebenso“ behutsam verdeutlicht; ohne Fußnote, da keine für das Verständnis wesentliche Textvariante oder echte Mehrdeutigkeit markiert werden muss.
