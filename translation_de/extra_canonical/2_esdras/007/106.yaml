  yaml_path: translation/extra_canonical/2_esdras/007/106.yaml
  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: de
  text: 'Und ich antwortete und sagte: „Und wie erkennen wir nun, dass Abraham als Erster für die Sodomiter[a] bat und Mose für die Väter, die in der Wüste gesündigt hatten,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Propter Sodomitas“ kann wörtlich auch „wegen der Sodomiter“ heißen; im Zusammenhang mit „rogavit“ bedeutet es eine Bitte zu ihren Gunsten.
    reason: Erläutert die mögliche Grundbedeutung von „propter“ und die kontextuell gebotene Wiedergabe „für“, unmittelbar am entsprechenden Ausdruck verankert.
lexical_decisions:
- source_word: invenimus modo
  choice: finden wir dann jetzt
  rationale: Gibt das lateinische „invenimus“ und das zeitliche „modo“ eng wieder, ohne die Aussage als bloßes Lesen oder als feststehende Schlussfolgerung auszudeuten.
- source_word: rogavit
  choice: bat
  rationale: Das einfache „bat“ entspricht dem lateinischen Verb und lässt den Fürbittecharakter aus der Ergänzung „für“ hervorgehen.
- source_word: primus Abraham
  choice: als Erster Abraham
  rationale: „Primus“ ist nominativisch auf Abraham bezogen und kennzeichnet ihn als den Ersten in der folgenden Reihe von Fürbittern, nicht Abrahams Gebet als seine erste Handlung.
- source_word: propter Sodomitas
  choice: für die Sodomiter
  rationale: „Für“ gibt hier den begünstigten Gegenstand der Bitte natürlich wieder; „Sodomiter“ entspricht dem lateinischen Personenbegriff.
- source_word: patribus
  choice: Väter
  rationale: Bewahrt die traditionelle, kollektiv-geschichtliche Bezeichnung für die Vorfahren Israels.
theological_decisions:
- issue: Fürbitte zugunsten anderer
  choice: Abraham „bat für“ die Sodomiter und Mose für die Väter
  alternative: Abraham „legte Fürbitte ein“
  rationale: Die schlichte Formulierung bleibt nahe am lateinischen „rogavit“ und trägt keine zusätzliche systematisch-theologische Deutung ein.
- issue: Zeitliche Funktion von „primus“
  choice: Abraham wird als Erster einer Reihe bezeichnet
  alternative: Abraham betete zuerst für die Sodomiter
  rationale: Die grammatische Übereinstimmung von „primus“ mit „Abraham“ und der anschließende Katalog sprechen für die Reihenfolge der Fürbitter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst quellennaher Satzführung. Der offene Satzschluss mit Komma bleibt erhalten, da der Gedanke im folgenden Vers fortgesetzt wird.
