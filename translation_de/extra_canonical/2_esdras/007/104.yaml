  to: 'Und er antwortete mir und sagte[a]: »Weil du vor meinen Augen Gnade gefunden hast, will ich dir auch dies zeigen: Der Tag des Gerichts ist ein Tag der Entscheidung und wird allen das Siegel der Wahrheit zeigen. Denn wie ein Vater nicht seinen Sohn schickt oder ein Sohn nicht seinen Vater, ein Herr nicht seinen Diener oder ein Freund nicht einen geliebten Menschen, damit dieser für ihn im Gericht spricht[b].«'
