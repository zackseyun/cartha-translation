base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a servant, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: de
  text: 'Und er antwortete mir und sagte[a]: »Weil du vor meinen Augen Gnade gefunden hast, will ich dir auch dies zeigen: Der Tag des Gerichts ist ein Tag der Entscheidung und wird allen das Siegel der Wahrheit zeigen. Denn wie ein Vater nicht seinen Sohn schickt oder ein Sohn nicht seinen Vater, ein Herr nicht seinen Diener oder ein Freund nicht einen geliebten Menschen, damit dieser für ihn im Gericht spricht[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Teil dieses Verses gehört zu dem wiederentdeckten Fragment, das in den meisten mittelalterlichen lateinischen Handschriften fehlt. Die Beispiele aus dem persönlichen Umfeld veranschaulichen, dass im endgültigen Gericht niemand die Verantwortung eines anderen übernehmen kann.
    reason: recovered_fragment
  - marker: b
    text: 'Der hier vorgelegte lateinische Textausschnitt bricht bei „ut pro“ („um für …“) ab. Die Fortsetzung wird nach dem im bezeugten Zusammenhang überlieferten Sinn ergänzt: für jemanden im Gericht zu sprechen.'
    reason: incomplete_source_excerpt
lexical_decisions:
- source_word: dies decretorius
  choice: ein Tag der Entscheidung
  rationale: Gibt den entscheidenden und endgültig festlegenden Charakter des Gerichtstags natürlich wieder, ohne über den lateinischen Ausdruck hinauszugehen.
- source_word: signaculum ueritatis
  choice: das Siegel der Wahrheit
  rationale: Bewahrt das konkrete Siegelbild und die Aussage, dass im Gericht die Wahrheit beglaubigt beziehungsweise offenbar gemacht wird.
- source_word: fidus carissimum
  choice: ein Freund den Menschen, der ihm am liebsten ist
  rationale: Das elliptische lateinische „fidus“ wird entsprechend dem Sinn als Freund verstanden; „carissimum“ bezeichnet den besonders geliebten Menschen. Die Umschreibung klingt im Deutschen natürlicher als „ein Getreuer einen Geliebtesten“.
- source_word: ut pro
  choice: kann jemand ihn vor Gericht vertreten
  rationale: Der überlieferte Ausschnitt bricht nach „ut pro“ ab; die Formulierung führt den durch die Satzstruktur und den englischen Konsultationstext bezeugten Gedanken idiomatisch zu Ende und macht die Nichtübertragbarkeit persönlicher Verantwortung deutlich.
theological_decisions:
- issue: Persönliche Nichtübertragbarkeit im Endgericht
  choice: „kann jemand ihn vor Gericht vertreten“
  alternative: „kann jemand für ihn im Gericht sprechen“
  rationale: „Vertreten“ bringt die Analogie der nicht delegierbaren Verantwortung knapp zum Ausdruck, ohne Fürbitte allgemein oder in anderen Zusammenhängen auszuschließen.
- issue: Bedeutung des Siegels der Wahrheit
  choice: Das Bild bleibt unaufgelöst stehen.
  alternative: Paraphrase als vollständige Offenlegung aller Tatsachen
  rationale: Die bildhafte und theologisch offene Formulierung des lateinischen Textes soll nicht auf eine einzelne Deutung verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur des lateinischen Vergleichs bleibt erkennbar; schwer verständliche Nominalformen werden behutsam idiomatisiert. Der Text wahrt das Siegelbild sowie die Spannung zwischen persönlicher Nähe und nicht übertragbarer Verantwortung.
