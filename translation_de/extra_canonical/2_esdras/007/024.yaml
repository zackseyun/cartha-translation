id: 2ES.7.24
reference: 2 Esdras 7:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: de
  text: Sie verachteten sein Gesetz und leugneten seine Verheißungen[a]. Sie schenkten seinen Satzungen keinen Glauben und vollbrachten seine Werke nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zusagen“.'
    reason: sponsiones kann sowohl feierlich verheißene Versprechen als auch verbindliche Zusagen bezeichnen.
lexical_decisions:
- source_word: spreverunt
  choice: verachteten
  rationale: Gibt die bewusste Geringschätzung des Gesetzes präzise und in natürlichem Deutsch wieder.
- source_word: sponsiones
  choice: Verheißungen
  rationale: Das spätlateinische sponsio bezeichnet hier göttliche Versprechen oder zugesagte Gewähr; „Verheißungen“ wahrt den religiösen Kontext, ohne den Begriff als „Bund“ umzudeuten.
- source_word: legitimis
  choice: Satzungen
  rationale: Das substantivierte legitima bezeichnet verbindliche göttliche Bestimmungen; „Satzungen“ ist dafür eine würdige und verständliche Entsprechung.
- source_word: fidem non habuerunt
  choice: schenkten … keinen Glauben
  rationale: Die Wendung mit dem Dativ kann fehlendes Vertrauen beziehungsweise fehlenden Glauben an die Satzungen ausdrücken. Die Formulierung bleibt nahe am Latein und ist im Deutschen idiomatisch.
- source_word: opera eius non perfecerunt
  choice: vollbrachten seine Werke nicht
  rationale: „Vollbrachten“ bildet perficere ab und bewahrt die offene Aussage, ob damit Gottes geforderte Werke oder Werke in seinem Sinn gemeint sind.
theological_decisions:
- issue: Bedeutung von sponsiones eius
  choice: seine Verheißungen
  alternative: 'seine Zusagen; nicht: seine Bünde'
  rationale: sponsiones bezeichnet hier Versprechen oder verbindliche Zusagen. Die spezifische Bundesterminologie wird im Werk gewöhnlich anders ausgedrückt, weshalb „Bünde“ eine nicht belegte theologische Präzisierung wäre.
- issue: Verhältnis zu den göttlichen Satzungen
  choice: schenkten seinen Satzungen keinen Glauben
  alternative: vertrauten seinen Satzungen nicht / hielten seinen Satzungen nicht die Treue
  rationale: fidem habere mit Dativ lässt Vertrauen oder Glauben erkennen; eine rein gehorsamsbezogene Wiedergabe würde die semantische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aussagen des lateinischen Satzes bleiben erhalten; zur besseren Lesbarkeit wird die Reihung nach dem zweiten Glied in zwei Sätze geteilt.
