  source_fidelity: 'Die Übersetzung gibt die vier lateinischen Prädikate und ihre Bezüge zuverlässig wieder: spreverunt als „verachteten“, abnegaverunt als „leugneten“, fidem non habuerunt als „schenkten … keinen Glauben“ und non perfecerunt als „vollbrachten … nicht“. „Verheißungen“ trifft sponsiones und folgt zutreffend der englischen Auditentscheidung gegen die unzutreffende Einengung auf „Bünde“.'
  naturalness: Modernes, würdiges Standarddeutsch. „Seinen Satzungen keinen Glauben schenken“ ist gehoben, aber idiomatisch und bewahrt gegenüber einer rein gehorsamsbezogenen Formulierung die mögliche Vertrauensbedeutung von fidem habere. Die Aufteilung in zwei Sätze ist klar und verändert die Reihung nicht wesentlich.
  terminology: „Gesetz“, „Verheißungen“, „Satzungen“ und „Werke“ sind konsistent, registerangemessen und ohne konfessionell lenkende Präzisierung gewählt. Die Fußnote bietet mit „Zusagen“ eine sachgerechte Alternative zu sponsiones, ohne „Bünde“ nahezulegen.
