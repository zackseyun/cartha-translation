source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: de
  text: Denn was nützt es uns, wenn uns eine unsterbliche Zeit verheißen ist, wir aber sterbliche Werke getan haben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  choice: Denn was nützt es uns
  rationale: Gibt die begründende Partikel „enim“ und die Nutzenfrage idiomatisch und zugleich eng am lateinischen Wortlaut wieder.
- source_word: inmortale tempus
  choice: eine unsterbliche Zeit
  rationale: Bewahrt die auffällige wörtliche Verbindung von „unsterblich“ und „Zeit“, ohne sie interpretierend zu „ewigem Leben“ oder „künftiger Weltzeit“ umzudeuten.
- source_word: mortalia opera
  choice: sterbliche Werke
  rationale: Erhält den bewussten Gegensatz zu „unsterbliche Zeit“ sowie die sachliche Mehrdeutigkeit von Werken, die der Sterblichkeit angehören oder zum Tod führen.
- source_word: egimus
  choice: getan haben
  rationale: Natürliches modernes Deutsch für das Perfekt, das die vollzogene menschliche Lebensführung rückblickend bezeichnet.
theological_decisions:
- issue: Bedeutung von „unsterbliche Zeit“
  choice: Wörtlich als „unsterbliche Zeit“ wiedergegeben
  alternative: „ewiges Leben“ oder „eine unvergängliche Weltzeit“
  rationale: Der lateinische Text spricht von „tempus“ und lässt offen, wie genau die verheißene kommende Wirklichkeit zu bestimmen ist; diese Spannung wird nicht dogmatisch aufgelöst.
- issue: Bedeutung von „sterbliche Werke“
  choice: Die ungewöhnliche Formulierung bleibt erhalten
  alternative: „Werke, die zum Tod führen“ oder „vergängliche Taten“
  rationale: Die Quelle benennt weder ausdrücklich die Folge noch nur die Vergänglichkeit der Taten. Die formale Entsprechung bewahrt den Kontrast und die theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Gegenüberstellung „unsterbliche Zeit“/„sterbliche Werke“ wird als prägendes Stilmittel des Ausgangstextes bewahrt.
