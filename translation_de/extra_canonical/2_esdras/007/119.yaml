  source_fidelity: 'Die Übersetzung bildet den lateinischen Satz vollständig und präzise ab: „Denn“ entspricht dem begründenden enim, „was nützt es uns“ Quid ... nobis prodest, die Verheißung einer „unsterblichen Zeit“ inmortale tempus und „sterbliche Werke“ mortalia opera. Der Gegensatz zwischen verheißener Unsterblichkeit und den vollbrachten sterblichen Werken bleibt erhalten, ohne ihn ausdeutend zu verschieben.'
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und bewahrt zugleich die bewusst auffälligen Gegenüberstellungen der Vorlage. Die Konstruktion „wenn uns ... verheißen ist, wir aber ... getan haben“ ist als rhetorisch verdichtete Bedingungsfrage gut verständlich.
  terminology: „Unsterbliche Zeit“ und „sterbliche Werke“ sind bewusst eng am lateinischen Wortlaut und erhalten dessen offene, antithetische Terminologie. Insbesondere wird tempus nicht voreilig zu „ewigem Leben“ oder „Zeitalter“ und mortalia opera nicht zu einer spezifisch dogmatischen Kategorie umgedeutet.
