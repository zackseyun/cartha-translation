  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: de
  text: 'Die sechste Stufe: Dann wird ihnen gezeigt werden, wie ihr Angesicht wie die Sonne zu leuchten beginnen wird und wie sie anfangen werden, dem Licht der Sterne gleichgestaltet zu werden, und von da an unvergänglich sein werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Ausschnitt bricht nach „und wie“ ab. Der anschließende Wortlaut über das Licht der Sterne und die Unvergänglichkeit folgt dem für diese Ausgabe geprüften Textzusammenhang.
    reason: Kennzeichnet transparent, dass der bereitgestellte lateinische Beleg innerhalb des Satzes abbricht, während der vollständige Vers nach der auditierten Überlieferung wiedergegeben wird.
lexical_decisions:
- source_word: Sextus ordo
  choice: Die sechste Stufe
  rationale: Im Zusammenhang bezeichnet ordo eine Abfolge von Zuständen oder Erfahrungsstufen; „Stufe“ ist im modernen Deutsch klarer und natürlicher als „Ordnung“.
- source_word: ostendetur
  choice: wird ihnen gezeigt werden
  rationale: Bewahrt das lateinische Futur und Passiv.
- source_word: uultus eorum
  choice: ihr Angesicht
  rationale: Gibt den kollektiven Singular des Lateinischen wieder und wahrt den würdevollen Ton.
- source_word: fulgere sicut sol
  choice: wie die Sonne zu leuchten
  rationale: Natürliche, bildgetreue Wiedergabe des Vergleichs.
- source_word: incorruptibiles
  choice: unvergänglich
  rationale: Bezeichnet den Zustand, keinem Verfall mehr unterworfen zu sein, ohne eine zusätzliche dogmatische Deutung einzutragen.
theological_decisions:
- issue: Art und Zeitpunkt der Verwandlung
  choice: „anfangen werden … gleich zu werden“ und „von da an unvergänglich zu sein“
  alternative: „dem Licht der Sterne gleichgemacht werden“ oder „fortan unsterblich sein“
  rationale: Die Formulierung bewahrt den im Konsultationstext bezeugten Beginn eines zukünftigen Vorgangs und unterscheidet Unvergänglichkeit von einer engeren Gleichsetzung mit Unsterblichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die futurische Perspektive und die gestufte Satzform des lateinischen Textes bleiben erhalten; „Angesicht“ trägt dem feierlichen apokalyptischen Kontext Rechnung.
