review_pass:
  verdict: revise
  source_fidelity: Die Zukunftsform und das Passiv von „ostendetur“ sind zutreffend wiedergegeben. „Angesicht“ entspricht uultus gut, und „Stufe“ ist für ordo im Kontext einer gezählten Abfolge vertretbar. Der über den vorgelegten lateinischen Ausschnitt hinausgehende Satzteil folgt dem englischen Audittext; die Fußnote kennzeichnet diese editorische Lage angemessen.
  naturalness: Die Konstruktion „wie ihr Angesicht anfangen wird, wie die Sonne zu leuchten“ ist zwar verständlich, wirkt im modernen Deutschen jedoch unnötig schwerfällig. Außerdem ist „gleich zu werden“ gegenüber dem im Audittext erkennbaren passivischen Gedanken („made like“) weniger genau. Eine Umstellung und „gleichgestaltet zu werden“ machen den Satz idiomatischer und präziser.
  terminology: „Unvergänglich“ gibt incorruptible sachgerecht wieder, ohne es dogmatisch auf „unsterblich“ zu verengen. „Dem Licht der Sterne gleichgestaltet“ wahrt den Vergleich und macht die empfangene Verwandlung sprachlich sichtbar.
