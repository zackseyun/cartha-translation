    rationale: „anfangen wird, wie die Sonne zu leuchten“ sollte zu „wie die Sonne zu leuchten beginnen wird“ umgestellt werden.
  - severity: medium
    issue: Aktive Formulierung der Gleichwerdung
    rationale: „dem Licht der Sterne gleich zu werden“ kann ein eigenes Tätigwerden nahelegen. Der englische Audittext bezeugt den passivischen Sinn „made like“; „gleichgestaltet zu werden“ gibt diesen genauer wieder.
