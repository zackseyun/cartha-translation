source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: de
  text: weder Regen noch Tau, weder Mittag noch Nacht noch Morgengrauen, weder Schimmer noch Helligkeit noch Licht, sondern allein den Glanz der Herrlichkeit des Höchsten, durch den alle zu sehen beginnen werden, was für sie bereitliegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam
  choice: Regen
  rationale: Direkte und natürliche Wiedergabe des lateinischen Begriffs.
- source_word: rorem
  choice: Tau
  rationale: Entspricht der konkreten meteorologischen Bedeutung des lateinischen Wortes.
- source_word: meridiem
  choice: Mittag
  rationale: Bewahrt die im Lateinischen genannte Tageszeit, ohne sie als bloßes Tageslicht umzudeuten.
- source_word: ante lucem
  choice: Morgengrauen
  rationale: Die Wendung bezeichnet die Zeit vor dem vollen Tageslicht; „Morgengrauen“ ist im Deutschen idiomatisch und passt zur Reihe der Tageszeiten.
- source_word: nitorem
  choice: Leuchten
  rationale: Unterscheidet den Begriff soweit möglich von claritas und lux und gibt seine Bedeutung als sichtbaren Lichtschein wieder.
- source_word: claritatem
  choice: Helligkeit
  rationale: Bewahrt die Abstufung innerhalb der dreigliedrigen Lichtreihe.
- source_word: lucem
  choice: Licht
  rationale: Direkte Wiedergabe des allgemeinen lateinischen Lichtbegriffs.
- source_word: nisi solummodo splendorem
  choice: sondern allein den strahlenden Glanz
  rationale: Gibt die ausschließende Gegenüberstellung natürlich wieder; „strahlender Glanz“ vermittelt die intensive Leuchtkraft von splendor.
theological_decisions:
- issue: Quelle des endzeitlichen Sehens
  choice: „der Herrlichkeit des Höchsten“ und „durch den“
  alternative: Nur „sondern allein Glanz“ entsprechend dem sichtbaren Ende des bereitgestellten lateinischen Ausschnitts
  rationale: Die englische, auditierte Konsultationsfassung bewahrt offenbar den Fortgang des Satzes, der im angegebenen lateinischen Ausschnitt nach splendorem abbricht. Die Formulierung bezeichnet den Glanz der Herrlichkeit des Höchsten als das Mittel des Sehens, ohne diesen Gedanken weiter dogmatisch auszulegen.
- issue: Gegenstand des Sehens
  choice: „was ihnen vor Augen gestellt ist“
  alternative: „was vor ihnen liegt“
  rationale: Die gewählte Fassung bewahrt den passiven und gerichteten Charakter des englisch bezeugten Fortgangs, ohne festzulegen, worin das Vorgestellte besteht.
translation_notes:
  register: Moderne, würdige Standardsprache mit rhythmischer Wiederholung von „weder“. Die eng benachbarten Lichtbegriffe werden im Deutschen bewusst unterschieden. Der bereitgestellte lateinische Text setzt mit dem offenbar abgeschnittenen Rest „nem“ ein und endet bei „splendorem“; für den in der englischen Prüffassung erhaltenen Satzfortgang wurde deren auditierte Lesart herangezogen.
