  source_fidelity: 'Die Reihenfolge und die Negationsreihe entsprechen dem überlieferten Latein: Regen, Tau, Mittag, Nacht, Zeit vor dem Tageslicht sowie drei Lichtbegriffe. Der bereitgestellte lateinische Ausschnitt ist am Anfang und am Ende fragmentarisch; der Fortgang mit „der Herrlichkeit des Höchsten“ und dem darauffolgenden Sehen ist daher nur aufgrund der englischen Prüffassung zu bestätigen. „Glanz“ ist für splendorem unmittelbar; ein zusätzliches Adjektiv „strahlend“ ist nicht vom Text gefordert.'
  naturalness: Die Syntax mit „weder … noch“ ist natürlich und dem feierlichen Register angemessen. „Was ihnen vor Augen gestellt ist“ ist verständlich, klingt jedoch weniger idiomatisch als „was für sie bereitliegt“.
  terminology: '„Der Höchste“ und „Herrlichkeit“ sind etablierte, registergerechte Wiedergaben. Die Lichtreihe sollte möglichst klar abgestuft bleiben: „Schimmer“, „Helligkeit“, „Licht“ gegenüber dem abschließenden „Glanz“.'
