lexical_decisions:
- source_word: surge
  choice: Steh auf
  rationale: Gibt den lateinischen Imperativ unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: sermones
  choice: die Worte
  rationale: Entspricht hier der angekündigten Botschaft beziehungsweise Rede; »Worte« bewahrt die konkrete Ausdrucksweise des Ausgangstextes.
- source_word: veni loqui ad te
  choice: die ich gekommen bin, dir zu sagen
  rationale: Bewahrt die Zweckrichtung des lateinischen Kommens und klingt zugleich verständlich; »zu dir zu sprechen« wäre formaler, im Deutschen aber weniger natürlich.
