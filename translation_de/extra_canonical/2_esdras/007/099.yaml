id: 2ES.7.99
reference: 2 Esdras 7:99
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: '[eius], cui seruiunt uiuentes et a quo incipiunt gloriosi mercedem recipere. Hic ordo animarum iustorum, ut a modo adnuntiatur, praedictae uiae cruciatus, quas'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
translation:
  language: de
  text: '[ihm][a], dem die Lebenden dienen und von dem die Verherrlichten beginnen, ihren Lohn zu empfangen. Dies ist die Ordnung der Seelen der Gerechten, wie sie nun verkündet wird; [und dies sind] die zuvor beschriebenen Wege der Qual, die'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Abschnitt beginnt mitten im Satz; „ihm“ ist sinngemäß aus dem vorausgehenden Zusammenhang ergänzt.
    reason: Kennzeichnet die durch die eckigen Klammern sichtbare Ergänzung am fragmentarischen Versanfang.
lexical_decisions:
- source_word: cui seruiunt uiuentes
  choice: dem die Lebenden dienen
  rationale: Gibt den lateinischen Relativsatz eng und in natürlichem modernem Deutsch wieder; „die Lebenden“ bleibt als substantivierte Bezeichnung erhalten.
- source_word: gloriosi
  choice: die Verherrlichten
  rationale: Das substantivierte Adjektiv bezeichnet hier Menschen, die Herrlichkeit empfangen haben bzw. verherrlicht sind; „die Herrlichen“ wäre im Deutschen missverständlich.
- source_word: mercedem
  choice: Lohn
  rationale: „Lohn“ bewahrt den Vergeltungs- und Belohnungsaspekt des lateinischen Ausdrucks, ohne ihn näher dogmatisch festzulegen.
- source_word: a modo adnuntiatur
  choice: wie sie nun verkündet wird
  rationale: „Nun“ gibt a modo im unmittelbaren Darstellungszusammenhang idiomatisch wieder; „von nun an“ wäre möglich, klänge hier aber unnötig programmatisch.
- source_word: praedictae uiae cruciatus
  choice: die zuvor beschriebenen Wege der Qual
  rationale: Bewahrt das Bild der „Wege“ sowie den Rückverweis von praedictae; der Genitiv cruciatus wird natürlich als nähere Bestimmung wiedergegeben.
theological_decisions:
- issue: Status der als gloriosi bezeichneten Gerechten
  choice: die Verherrlichten
  alternative: die Herrlichen
  rationale: Die Übersetzung lässt offen, auf welche Weise oder zu welchem genauen Zeitpunkt diese Herrlichkeit erlangt wird, und vermeidet eine bloße Charakterbeschreibung.
- issue: Fragmentarischer Anfang und Schluss des überlieferten Abschnitts
  choice: Ergänztes „ihm“ in eckigen Klammern; Schluss ohne syntaktische Vervollständigung
  alternative: Den Satz aus dem Kontext frei vervollständigen
  rationale: Die Vorlage setzt am Anfang einen vorausgehenden Satz fort und endet mit dem Relativpronomen quas. Die Übersetzung wahrt diese Textgestalt, statt fehlenden Inhalt stillschweigend einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die lateinische Syntax. Der unvollständige Schluss bleibt bewusst stehen, da der Satz im folgenden Vers weitergeführt wird.
