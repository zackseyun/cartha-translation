  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „die Lebenden“, „die Verherrlichten“ und „Wege der Qual“ sind im religiös-literarischen Register verständlich. Der Satzabbruch bei „die“ ist absichtlich beibehalten und durch die vorliegende Textgestalt gedeckt.
  terminology: „Lohn“ gibt merces angemessen wieder. „die Verherrlichten“ ist für gloriosi im Kontext der gerechten Seelen eine plausible, theologisch nicht weiter spezifizierende Wiedergabe; sie vermeidet die im heutigen Deutsch missverständliche Lesart von „die Herrlichen“.
