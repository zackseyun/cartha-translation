source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: de
  text: O Adam, was hast du getan? Denn wenn du gesündigt hast, war dein Fall nicht allein dein Fall, sondern auch unser Fall, wir, die wir von dir abstammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  choice: O Adam, was hast du getan?
  rationale: Die Anrede wird im Deutschen natürlich vorangestellt; das feierlich-klagende „O“ bewahrt Ton und Nachdruck des Lateinischen.
- source_word: si enim tu peccasti
  choice: Denn wenn du gesündigt hast
  rationale: „si“ wird formal als „wenn“ wiedergegeben, ohne die im lateinischen Wortlaut vorhandene Bedingungsform stillschweigend in ein konzessives „obwohl“ umzudeuten. Das ausgesprochene „du“ ist bereits durch die direkte Anrede und die Verbform kontextuell hervorgehoben.
- source_word: casus
  choice: Fall
  rationale: „Fall“ erhält sowohl das Bild des Sturzes als auch die theologische Bedeutung des Sündenfalls, ohne diese im Text ausdrücklich auszuweiten.
- source_word: qui ex te advenimus
  choice: die wir von dir abstammen
  rationale: Das wörtliche „die wir aus dir gekommen sind“ wäre im modernen Deutschen unnatürlich; „von dir abstammen“ gibt die Herkunftsbeziehung klar und idiomatisch wieder.
theological_decisions:
- issue: Bedingte oder konzessive Wiedergabe von „si“
  choice: wenn du gesündigt hast
  alternative: obwohl du gesündigt hast / da du gesündigt hast
  rationale: Der lateinische Text bietet ausdrücklich „si“. Obwohl der Zusammenhang keine wirkliche Unsicherheit über Adams Sünde voraussetzt und eine konzessive Lesart möglich ist, bewahrt „wenn“ die sprachliche Spannung des Quellenwortlauts.
- issue: Gemeinschaftliche Beteiligung am „Fall“
  choice: war dein Fall nicht nur deiner, sondern auch unserer
  alternative: betraf dein Fall nicht nur dich, sondern auch uns
  rationale: Die gewählte Fassung erhält die auffällige Aussage, dass der Fall auch „unser“ ist, statt sie zu einer bloßen Betroffenheit durch Folgen abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klagend-rhetorischem Ton. Die ungewöhnliche prädikative Genitividee des Lateinischen wird durch „nicht nur deiner, sondern auch unserer“ bewusst bewahrt.
