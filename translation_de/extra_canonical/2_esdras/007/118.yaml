  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des lateinischen Textes grundsätzlich treffend wieder: die Anrede, das konditionale si enim, Adams Sünde, casus und die gemeinsame Zugehörigkeit des Falls werden bewahrt. „Von dir abstammen“ ist für qui ex te advenimus idiomatisch und sachlich angemessen.'
  naturalness: Die Verbindung „war dein Fall nicht nur deiner, sondern auch unserer“ ist im heutigen Standarddeutsch nicht idiomatisch und wirkt wegen der prädikativen Genitive missverständlich. Die Konstruktion „nicht allein dein Fall, sondern auch unser Fall“ ist natürlich und erhält die im Ausgangstext betonte Aussage.
  terminology: „Fall“ ist als Wiedergabe von casus passend, da es den theologischen Resonanzraum zulässt, ohne ihn über den Wortlaut hinaus zu erläutern. „Gesündigt“ und „abstammen“ sind registergerecht. Das konditionale „wenn“ sollte stehen bleiben, weil si im lateinischen Wortlaut nicht ohne Weiteres zu „obwohl“ festgelegt werden darf.
