  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/053.yaml
  text: you will sort them for yourself by their number[a], but lead and clay are abundant. And
translation:
  language: de
  text: Du wirst sie für dich nach ihrer Zahl ordnen; Blei und Ton[a] aber gibt es im Überfluss. Und
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tonware«.'
    reason: Das lateinische fictile kann den Werkstoff Ton oder etwas daraus Gefertigtes, besonders Töpferware, bezeichnen.
lexical_decisions:
- source_word: ad numerum eorum
  choice: nach ihrer Zahl
  rationale: Gibt die zahlenmäßige Zuordnung des lateinischen Ausdrucks wieder, ohne eine genauere Art des Zählens hineinzulesen.
- source_word: compones eos tibi
  choice: Du wirst sie für dich … ordnen
  rationale: Bewahrt Futur, zweite Person Singular und den Dativ tibi; »ordnen« deckt den weiten Sinn von componere hier besser ab als ein engeres »aussortieren«.
- source_word: plumbum
  choice: Blei
  rationale: Direkte und eindeutige Entsprechung.
- source_word: fictile
  choice: Ton
  rationale: Im Gegensatz zu Blei bezeichnet das substantivierte fictile etwas aus gebranntem oder geformtem Ton; »Ton« folgt der knappen Stoffbezeichnung des konsultierten Textes.
- source_word: abundat
  choice: gibt es im Überfluss
  rationale: Natürliches modernes Deutsch für das reichliche Vorhandensein der genannten gewöhnlichen Materialien.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Das abschließende »Und« bleibt stehen, weil es im gelieferten lateinischen Versfragment vorhanden ist und in den folgenden Vers überleitet. Die frühere Lesart »Und ich sagte: Herr, wie kann das sein?« wurde nicht übernommen, da sie zum anschließenden lateinischen Satz gehört und hier eine Versverschiebung wäre.'
