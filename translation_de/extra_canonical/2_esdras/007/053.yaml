  source_fidelity: 'Der Entwurf gibt den überlieferten lateinischen Text präzise wieder: Futur und Anrede in „compones“, die Bezugnahme von „eorum“, der Dativ „tibi“, „plumbum“, „fictile“, „abundat“ sowie das fragmentarisch überlieferte abschließende „Et“ sind erhalten. „ordnen“ ist für componere in diesem Kontext angemessen weit und vermeidet eine ungesicherte Spezifizierung.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Stellung „für dich nach ihrer Zahl“ ist gut lesbar; das abschließende „Und“ ist als bewusst beibehaltenes Satzfragment aufgrund des Quelltexts vertretbar.
  terminology: „Blei“ ist eindeutig. „Ton“ ist als knappe Stoffbezeichnung für fictile vertretbar; die Fußnote weist sachgerecht auf die mögliche Bedeutung „Tonware“ hin, ohne den Text unnötig festzulegen. Es werden keine theologischen oder interpretativen Zusätze eingeführt.
