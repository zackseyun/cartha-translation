lexical_decisions:
- source_word: introitus
  choice: Zugang
  rationale: „Zugang“ bezeichnet hier natürlich den Weg beziehungsweise Eingang zu dem zuvor genannten Ort und passt besser zur räumlichen Beschreibung als das abstraktere „Eintritt“.
- source_word: in angusto loco
  choice: an einer engen Stelle
  rationale: Die Formulierung gibt die räumliche Enge idiomatisch wieder, ohne zusätzliche Gefahr oder Schwierigkeit in den Text hineinzulesen.
- source_word: similis fluminis
  choice: einem Fluss ähnlich
  rationale: Dies bildet den lateinischen Genitiv nach „similis“ im Deutschen mit dem Dativ ab und bewahrt den knappen Vergleich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Zugang zu ihr“ macht den Bezug des lateinischen Dativs „ei“ verständlich, ohne das grammatische Geschlecht des zuvor genannten Ortes vorauszusetzen. Das Futur von „erit“ und der Konjunktiv von „esset“ bleiben erkennbar.
