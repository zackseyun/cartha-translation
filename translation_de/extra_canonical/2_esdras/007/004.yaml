- from: Doch der Zugang zu ihr wird an einer engen Stelle angelegt sein[a], sodass er einem Fluss ähnlich wäre[b].
  to: Doch ihr Zugang wird an einer engen Stelle liegen[a], sodass er einem Fluss ähnlich wäre[b].
  rationale: Die Revision ersetzt die potenziell missverständliche bauliche bzw. futurperfektische Nuance von „angelegt sein“ durch das natürliche, räumlich präzise „liegen“. Sie bewahrt Futur und Konjunktiv sowie die Offenheit von „ut“ zwischen Folge und Zweck. Die Fußnote zu „erit … positus“ wurde so angepasst, dass sie den lateinischen Zukunftsbezug nicht aufgibt.
