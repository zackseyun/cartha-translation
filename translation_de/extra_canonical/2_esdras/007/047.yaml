  yaml_path: translation/extra_canonical/2_esdras/007/047.yaml
  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: de
  text: Und nun sehe ich, dass das kommende Zeitalter wenigen Freude bringen wird, vielen aber Qualen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und nun sehe ich, dass die Freude des kommenden Zeitalters wenigen zuteilwerden wird, vielen aber Qualen.“'
    reason: Die lateinische Satzfügung ist knapp und elliptisch; sie lässt sich entweder mit dem kommenden Zeitalter als bringendem Subjekt oder mit Freude und Qualen als den jeweils Zugeordneten wiedergeben.
lexical_decisions:
- source_word: futurum saeculum
  choice: das kommende Zeitalter
  rationale: Gibt die zeitlich-eschatologische Bedeutung von „saeculum“ wieder, ohne sie konfessionell näher festzulegen.
- source_word: iocunditatem
  choice: Freude
  rationale: Natürliches, allgemein verständliches Deutsch für die positive Gegenüberstellung zu „tormenta“.
- source_word: tormenta
  choice: Qualen
  rationale: Bewahrt den starken Gegensatz zur Freude und gibt den Plural des lateinischen Ausdrucks wieder.
- source_word: ad paucos … multis autem
  choice: wenigen … vielen aber
  rationale: Erhält die pointierte Gegenüberstellung von wenigen und vielen in knapper deutscher Form.
theological_decisions:
- issue: Beziehung des kommenden Zeitalters zu Freude und Qualen
  choice: Das kommende Zeitalter wird wenigen Freude, vielen aber Qualen bringen.
  alternative: Die Freude des kommenden Zeitalters wird wenigen zuteilwerden, vielen aber Qualen.
  rationale: Die Hauptfassung macht die elliptische lateinische Gegenüberstellung im Deutschen verständlich, ohne die eschatologische Spannung zwischen wenigen und vielen abzuschwächen. Die Fußnote bewahrt die mögliche stärker nominale Zuordnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Struktur des Lateinischen wird bewahrt; „aber“ markiert den Kontrast deutlich. Der Fußnotenmarker steht ordnungsgemäß im Haupttext.
