  text: 'quoniam haec est via, quam Moyses dixit cum viveret ad populum dicens: elige tibi vitam ut vivas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: de
  text: 'Denn dies ist der Weg, von dem Mose zu seinen Lebzeiten zum Volk sprach: »Wähle für dich das Leben, damit du lebst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: haec est via
  choice: dies ist der Weg
  rationale: Gibt die lateinische Formulierung unmittelbar und in natürlichem, würdigem Deutsch wieder.
- source_word: cum viveret
  choice: zu seinen Lebzeiten
  rationale: Drückt den zeitlichen Sinn idiomatisch aus, ohne einen Gegensatz oder weiteren theologischen Gehalt hinzuzufügen.
- source_word: elige tibi vitam
  choice: Wähle für dich das Leben
  rationale: Bewahrt sowohl den Imperativ als auch das reflexive bzw. dativische Element „tibi“; zugleich bleibt der erkennbare Anklang an Deuteronomium 30 erhalten.
- source_word: ut vivas
  choice: damit du lebst
  rationale: Gibt den finalen Sinn des lateinischen „ut“ mit Konjunktiv klar und direkt wieder.
theological_decisions:
- issue: Verhältnis des Weges zur Rede des Mose
  choice: „der Weg, von dem Mose … sprach“
  alternative: „der Weg, den Mose … nannte“
  rationale: Das Latein „via, quam Moyses dixit“ ist knapp und leicht unidiomatisch. Die gewählte Formulierung folgt dem Sinn, ohne Mose ausdrücklich zum Urheber oder Benenner des Weges zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede wird knapp und nah am lateinischen Wortlaut wiedergegeben.
