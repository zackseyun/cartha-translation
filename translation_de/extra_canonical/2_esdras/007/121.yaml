  text: Et quoniam reposita sunt habitacula sanitatis et securitatis, nos vero male conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: de
  text: Und da Wohnstätten des Wohlergehens und der Sicherheit bereitgehalten worden sind, wir aber schlecht gelebt haben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  choice: bereitliegen
  rationale: Gibt das vollendete Bereitstellen beziehungsweise Aufbewahren für die Zukunft natürlich wieder, ohne festzulegen, von wem die Wohnungen bereitet wurden.
- source_word: habitacula
  choice: Wohnungen
  rationale: Eine geläufige, würdige Entsprechung für Wohnstätten; natürlicher als das gehobene „Behausungen“.
- source_word: sanitatis
  choice: des Heils
  rationale: Das lateinische sanitas kann Gesundheit, Unversehrtheit oder Heil bezeichnen. Im eschatologischen Zusammenhang erfasst „Heil“ die umfassende Bedeutung, ohne sie auf körperliche Gesundheit zu verengen.
- source_word: securitatis
  choice: der Sicherheit
  rationale: Bewahrt den direkten Sinn von Schutz, Geborgenheit und Gefahrlosigkeit.
- source_word: male conversati sumus
  choice: einen bösen Lebenswandel geführt haben
  rationale: Conversari bezeichnet hier Verhalten beziehungsweise Lebensführung; „Lebenswandel“ bildet dies genauer ab als ein bloßes „böse gelebt“.
theological_decisions:
- issue: Bedeutungsumfang von sanitas
  choice: Heil
  alternative: Gesundheit / Unversehrtheit
  rationale: Der eschatologische Kontext spricht für umfassendes Wohlergehen und Rettung. „Heil“ hält diesen Horizont offen, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Satzform als rhetorische Frage
  choice: Die konditionale, fragende Form bleibt erhalten.
  alternative: Umformung zu einer Aussage oder Ergänzung einer Folgerung
  rationale: Der lateinische Text ist syntaktisch eine vom Kontext abhängige rhetorische Frage. Die Übersetzung ergänzt keine im Vers selbst unausgesprochene Konsequenz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng an der lateinischen Syntax, klingt aber durch „Wohnungen“ und „bereitliegen“ gegenwärtig und verständlich.
