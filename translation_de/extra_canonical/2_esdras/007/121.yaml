revisions:
- from: Und wenn Wohnungen des Heils und der Sicherheit bereitliegen, wir aber einen bösen Lebenswandel geführt haben?
  to: Und da Wohnstätten des Wohlergehens und der Sicherheit bereitgehalten worden sind, wir aber schlecht gelebt haben?
  rationale: Die Revision folgt der kausalen Konjunktion und dem Perfektpassiv des lateinischen Textes genauer. Sie ersetzt die theologisch verengende Wiedergabe von sanitas durch einen modernen, semantisch offenen Ausdruck. Die elliptische Frageform bleibt erhalten, da keine im Vers nicht ausgedrückte Folgerung ergänzt werden soll.
