source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: de
  text: Denn der Tag des Gerichts wird das Ende dieser Zeit und der Anfang der kommenden unsterblichen Zeit[a] sein, in der die Vergänglichkeit vergangen sein wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der zukünftigen unsterblichen Zeit.'
    reason: Bewahrt die mögliche direktere Wiedergabe von futurus neben der im apokalyptischen Zusammenhang natürlicheren Formulierung „kommend“.
lexical_decisions:
- source_word: futuri inmortalis temporis
  choice: der kommenden unsterblichen Zeit
  rationale: Gibt den eschatologischen Sinn von futurus („kommend“, „zukünftig“) natürlich wieder und bewahrt zugleich tempus als „Zeit“.
- source_word: corruptela
  choice: Vergänglichkeit
  rationale: Bezeichnet hier im Gegensatz zur unsterblichen kommenden Zeit den Zustand von Verfall und Sterblichkeit, nicht vorrangig moralische Verderbtheit.
- source_word: pertransivit
  choice: vergangen sein wird
  rationale: Das lateinische Perfekt wird im durch das Futur bestimmten deutschen Satzgefüge als abgeschlossener Zustand innerhalb der kommenden Zeit wiedergegeben.
theological_decisions:
- issue: Eschatologischer Gegensatz zwischen dieser und der kommenden Zeit
  choice: dieser Zeit … der kommenden unsterblichen Zeit
  alternative: diesem Zeitalter … dem kommenden unsterblichen Zeitalter
  rationale: Das Latein verwendet tempus, daher bleibt „Zeit“ die nähere Entsprechung; „kommend“ erhält dennoch den apokalyptischen Horizont, ohne „Zeitalter“ ausdrücklich einzutragen.
- issue: Bedeutung von corruptela
  choice: Vergänglichkeit
  alternative: Verderbnis
  rationale: Der unmittelbare Gegensatz zur Unsterblichkeit spricht für körperlich-kosmische Vergänglichkeit. Die Übersetzung legt keine ausschließlich moralische Deutung nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ton. Die Satzstruktur folgt dem lateinischen Gegensatz eng; das abschließende Komma bleibt erhalten, da der überlieferte Vers als fortlaufender Satz weitergeht.
