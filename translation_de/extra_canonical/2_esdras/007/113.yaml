  source_fidelity: 'Die Übersetzung folgt dem Latein eng: „Tag des Gerichts“, Ende der gegenwärtigen Zeit und Anfang der kommenden unsterblichen Zeit entsprechen dem Satzbau und den Begriffen von *dies iudicii*, *finis temporis huius* und *initium futuri inmortalis temporis*. „Vergänglichkeit“ ist für *corruptela* im eschatologischen Kontrast zur Unsterblichkeit gut begründet. Das Futurperfekt „vergangen sein wird“ gibt den unter dem Zukunftshorizont als abgeschlossen dargestellten Zustand angemessen wieder.'
