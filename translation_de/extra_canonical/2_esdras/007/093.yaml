id: 2ES.7.93
reference: 2 Esdras 7:93
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seducat a uita in mortem. Secundus ordo, quoniam uident complicationem, in qua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: de
  text: 'Die zweite Stufe: Sie sehen die Verstrickung, in der die Seelen der Gottlosen umherirren[a], und die Strafe, die sie erwartet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in der Ratlosigkeit umherirren“.
    reason: Das lateinische complicationem kann neben einer bildhaften Verstrickung auch einen Zustand der Verwirrung oder Ratlosigkeit bezeichnen.
lexical_decisions:
- source_word: complicationem
  choice: Verstrickung
  rationale: Das lateinische Wort bezeichnet ein Ineinanderfalten beziehungsweise eine Verwicklung. Zusammen mit dem räumlichen Bild des Umherirrens gibt „Verstrickung“ die konkrete Bildhaftigkeit besser wieder als ein rein innerer Zustand wie „Ratlosigkeit“.
- source_word: ordo
  choice: Stufe
  rationale: Im Kontext einer geordneten Folge von Erfahrungen bezeichnet „Stufe“ einen einzelnen Abschnitt dieser Abfolge natürlich und verständlich.
theological_decisions:
- issue: Gegenstand der geschauten Verstrickung und der erwarteten Strafe
  choice: Die Aussage bleibt bei der Verstrickung der Seelen der Gottlosen und der ihnen bevorstehenden Strafe.
  alternative: Die Art der Verstrickung oder Strafe näher bestimmen.
  rationale: Der Text erläutert weder Wesen noch Dauer der Strafe. Eine weitergehende dogmatische Festlegung wäre nicht quellengestützt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umherirren“ bewahrt das räumliche Bild, während „Verstrickung“ die Mehrdeutigkeit von äußerer Verwicklung und innerer Verwirrung weitgehend erhält.
source_grounding:
  english_pob_role: consult_only
