  source_fidelity: 'Die Übersetzung gibt den überlieferten lateinischen Satzteil sachgerecht wieder: „Secundus ordo“ ist als „Die zweite Stufe“ im Kontext einer geordneten Abfolge angemessen, „uident“ als „Sie sehen“, und „complicationem, in qua ... uagantur“ wird mit dem räumlich-bildhaften „die Verstrickung, in der ... umherirren“ treffend erfasst. Die ergänzte Bezugsaussage zu den Seelen der Gottlosen und der erwarteten Strafe entspricht dem im Kontext vorausgesetzten vollständigen Satz und dem englischen Audit Trail.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Satzfügung mit Doppelpunkt ist gut lesbar; „umherirren“ bewahrt das Bild des lateinischen uagari.
