id: 2ES.7.78
reference: 2 Esdras 7:78
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: de
  text: 'Denn mit dem Tod verhält es sich so: Wenn vom Höchsten der Beschluss ergangen ist, dass ein Mensch sterben soll, verlässt der Lebenshauch den Körper, damit er wieder entlassen wird,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam de morte sermo est
  choice: Denn mit dem Tod verhält es sich so
  rationale: Gibt die begründende Partikel „Nam“ wieder und überträgt die lateinische Wendung natürlich, ohne „sermo“ unnötig als eine bestimmte Lehre zu deuten.
- source_word: terminus sententiae
  choice: der Beschluss
  rationale: Bezeichnet hier die vom Höchsten ausgehende verbindliche Entscheidung; „Beschluss“ ist im Deutschen natürlich und wahrt den richterlichen Klang des lateinischen „sententia“.
- source_word: inspiratione
  choice: der Lebenshauch
  rationale: Im Zusammenhang mit dem Verlassen des Körpers bezeichnet das Wort den belebenden Atem. „Lebenshauch“ wahrt diese Bedeutung, ohne vorschnell eine ausgearbeitete Lehre vom Geist einzutragen.
- source_word: ut dimittatur iterum
  choice: damit er wieder entlassen wird
  rationale: Bewahrt sowohl den Zweck- beziehungsweise Folgesinn von „ut“ als auch das passive und hinsichtlich des Zieles offene „dimittatur“; „iterum“ wird ausdrücklich mit „wieder“ wiedergegeben.
theological_decisions:
- issue: Deutung von „inspiratio“ als Atem oder Geist
  choice: Lebenshauch
  alternative: Geist
  rationale: Der lateinische Ausdruck erlaubt einen Bezug auf den belebenden Atem; die Übersetzung vermeidet eine übermäßige Festlegung auf eine eigenständige Geistwesenheit und erhält zugleich die anthropologische Spannung.
- issue: Ziel des wieder entlassenen Lebenshauchs
  choice: Kein Ziel ausdrücklich genannt
  alternative: „zu dem zurückgesandt wird, der ihn gab“
  rationale: Der vorgelegte lateinische Text nennt kein Ziel. Eine Rückkehr zu Gott ausdrücklich einzufügen, würde über die vorhandene Quelle hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt mit einem Komma offen, weil der überlieferte Versausschnitt syntaktisch in den folgenden Text weiterführt. Das vorangestellte isolierte „temporibus.“ wurde als Rest des vorausgehenden Satzes nicht in diesen Vers aufgenommen.
