  text: Et quoniam praedicta est nobis perennis spes, nos vero pessime vani facti sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/120.yaml
  text: And if everlasting hope has been foretold to us[a], but we have become utterly vain?
translation:
  language: de
  text: Und da uns eine immerwährende Hoffnung vorausgesagt worden ist, wir aber völlig nichtig geworden sind?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: perennis spes
  choice: immerwährende Hoffnung
  rationale: „Immerwährend“ gibt die zeitlich fortdauernde Bedeutung von perennis wieder, ohne die Hoffnung selbst näher zu definieren.
- source_word: praedicta est nobis
  choice: uns … vorausgesagt worden ist
  rationale: Die Passivkonstruktion und der Empfängerbezug des Lateinischen werden unmittelbar bewahrt.
- source_word: pessime vani facti sumus
  choice: wir aber ganz und gar nichtig geworden sind
  rationale: vani bezeichnet hier eher Leere, Vergeblichkeit oder fehlenden Bestand als Eitelkeit im Sinn von Selbstgefälligkeit. „Ganz und gar“ gibt die starke Intensivierung durch pessime in natürlichem Deutsch wieder.
theological_decisions:
- issue: Beziehung zwischen verheißener Hoffnung und menschlicher Nichtigkeit
  choice: Der Gegensatz wird mit „aber“ bewahrt, ohne zu erklären, wie beide Aussagen theologisch zusammengehören.
  alternative: „obwohl uns …“
  rationale: vero markiert den Gegensatz deutlich; eine konzessive Wiedergabe mit „obwohl“ würde die logische Beziehung stärker festlegen als der lateinische Wortlaut.
- issue: Elliptischer Anschluss mit quoniam
  choice: „Und dass …?“ als Fortführung der vorausgehenden rhetorischen Frage
  alternative: „Und da/weil …?“
  rationale: Im Zusammenhang führt der Vers die Frage nach dem Nutzen fort. Die Wiedergabe mit „dass“ erhält diesen abhängigen, aufzählenden Charakter, statt einen neuen Kausalgedanken einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht elliptische Satzgestalt ist beibehalten, weil der Vers die rhetorische Frage des Zusammenhangs fortsetzt.
