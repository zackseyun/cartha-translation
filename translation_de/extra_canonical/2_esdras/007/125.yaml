  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: de
  text: Denn die Gesichter derer, die Enthaltsamkeit geübt haben, werden heller als die Sterne leuchten[a], unsere Gesichter aber schwärzer als die Finsternis sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »über den Sternen«.'
    reason: Das lateinische „super“ kann räumlich verstanden werden; der Parallelismus mit „schwärzer als die Finsternis“ spricht im Haupttext jedoch für die komparative Wiedergabe.
lexical_decisions:
- source_word: abstinentiam habuerunt
  choice: sich in Selbstbeherrschung geübt haben
  rationale: Die Wendung bezeichnet gelebte Enthaltsamkeit beziehungsweise Selbstbeherrschung. Die gewählte Formulierung ist im modernen Deutschen natürlich und stellt die fortdauernde Praxis heraus.
- source_word: super stellas fulgebunt
  choice: heller als die Sterne leuchten werden
  rationale: Im parallelen Aufbau mit „super tenebras nigrae“ ist super am besten komparativ zu verstehen. So bleibt der Gegensatz zwischen strahlenden und schwarzen Gesichtern erhalten.
- source_word: super tenebras nigrae
  choice: schwärzer als die Finsternis
  rationale: Die komparative Wiedergabe bildet die zugespitzte Parallelkonstruktion des lateinischen Textes ab.
- source_word: quoniam
  choice: weil
  rationale: Gibt die kausale Bedeutung unmittelbar wieder und bewahrt den syntaktisch an den Zusammenhang angeschlossenen Charakter des Fragesatzes.
theological_decisions:
- issue: Bedeutung von super in der Aussage über die Sterne
  choice: 'komparativ: „heller als die Sterne“'
  alternative: 'räumlich: „über den Sternen“'
  rationale: Der unmittelbare Parallelismus mit „schwärzer als die Finsternis“ spricht stark für einen Vergleich. Die mögliche räumliche Lesart wird dennoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit „Und weil“ einsetzende, syntaktisch an den vorausgehenden Zusammenhang gebundene Fragesatz wurde entsprechend der lateinischen Form bewahrt.
