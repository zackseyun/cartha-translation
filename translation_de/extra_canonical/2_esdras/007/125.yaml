revisions:
- from: Und weil die Gesichter derer, die sich in Selbstbeherrschung geübt haben, heller als die Sterne leuchten werden[a], unsere Gesichter aber schwärzer als die Finsternis sein werden?
  to: Denn die Gesichter derer, die Enthaltsamkeit geübt haben, werden heller als die Sterne leuchten[a], unsere Gesichter aber schwärzer als die Finsternis sein?
  rationale: Die Revision glättet die deutsche Satzfügung, ohne die rhetorische Frage oder die kausale Anbindung des lateinischen „quoniam“ aufzugeben. Sie präzisiert „abstinentia“ als „Enthaltsamkeit“ und bewahrt die alternative räumliche Deutung von „super stellas“ in einer knapp formulierten Fußnote.
