base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: de
  text: 'Ich antwortete und sagte: »O Herrscher und Herr, siehe, du hast in deinem Gesetz bestimmt, dass die Gerechten dies alles erben werden, die Gottlosen aber zugrunde gehen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: O Herr, du Herrscher
  rationale: Gibt die feierliche doppelte Anrede als zwei Titel wieder, bleibt im Deutschen verständlich und vermeidet die Deutung als beschreibenden Relativsatz.
- source_word: ecce
  choice: siehe
  rationale: Bewahrt den rhetorischen Aufmerksamkeitsruf des lateinischen Textes.
- source_word: disposuisti in lege tua
  choice: du hast in deinem Gesetz bestimmt
  rationale: „Bestimmt“ gibt die rechtsetzende Aussage von disposuisti natürlich und ohne unnötige konfessionelle Färbung wieder.
- source_word: iusti hereditabunt haec
  choice: die Gerechten werden all dies erben
  rationale: Bewahrt das Erbmotiv und gibt das pluralische haec im Deutschen idiomatisch als „all dies“ wieder.
- source_word: impii autem peribunt
  choice: die Gottlosen aber werden zugrunde gehen
  rationale: „Gottlose“ entspricht impii im religiös-moralischen Gegensatz zu den Gerechten; „zugrunde gehen“ wahrt die mögliche Bedeutungsbreite von peribunt.
theological_decisions:
- issue: Schicksal der Gerechten und Gottlosen
  choice: „erben“ beziehungsweise „zugrunde gehen“ ohne nähere Erklärung
  alternative: Das Erbe oder das Verderben ausdrücklich als ewiges Heil beziehungsweise ewige Verdammnis auslegen
  rationale: Der Vers selbst lässt Gegenstand und genaue Art des Erbes sowie des Zugrundegehens unausgeführt; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Feierliche, aber heutige Standardsprache. „Siehe“ erhält den apokalyptisch-rhetorischen Ton; Satzbau und Wortwahl bleiben für gewöhnliche Leser verständlich.
