review_pass:
  verdict: revise
  source_fidelity: Der begründende Anschluss von enim und die jussive Gegenüberstellung von pereant ... quam neglegatur sind zutreffend wiedergegeben. »vorangestellt« legt bei anteposita jedoch eher eine Rangordnung des Gesetzes als ein Vorlegen bzw. Darbieten nahe. Das Latein lässt das Ziel des Vorlegens unausgedrückt; die deutsche Fassung soll daher kein »ihnen« ergänzen.
  naturalness: »Viele der jetzt Anwesenden« ist im modernen Standarddeutsch knapper und idiomatischer als »viele von denen, die jetzt da sind«. »Eher ... als dass« bildet die Vergleichskonstruktion klar ab.
  terminology: »Gesetz Gottes« gibt Dei lex genau wieder. »Vorgelegt worden ist« bewahrt Passiv und Perfekt von anteposita est, ohne ein nicht ausdrücklich genanntes Objekt hinzuzufügen. »Vernachlässigt wird« trifft neglegatur unmittelbar.
  issues:
  - severity: medium
    issue: »das vorangestellt worden ist« für anteposita est
    rationale: Die Formulierung wird im Deutschen primär als zeitliches oder hierarchisches Voranstellen verstanden. Anteposita est bezeichnet hier natürlicher das Vorlegen/Aufstellen des Gesetzes; ein Empfänger darf dabei nicht ergänzt werden.
  - severity: low
    issue: »viele von denen, die jetzt da sind«
    rationale: Die Wiedergabe ist verständlich, aber unnötig umständlich. »Viele der jetzt Anwesenden« ist präziser und stilistisch natürlicher.
  revised_text: Denn eher sollen viele der jetzt Anwesenden zugrunde gehen,[a] als dass das Gesetz Gottes, das vorgelegt worden ist, vernachlässigt wird.
