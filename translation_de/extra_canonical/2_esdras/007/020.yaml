base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: de
  text: Denn eher sollen viele der jetzt Anwesenden zugrunde gehen,[a] als dass das Gesetz Gottes, das vorgelegt worden ist, vernachlässigt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn eher sollen viele der jetzt Lebenden zugrunde gehen.«'
    reason: Praesentes kann kontextuell auch die gegenwärtig Lebenden bezeichnen.
lexical_decisions:
- source_word: enim
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorherigen Vers.
- source_word: multi praesentes
  choice: viele von denen, die jetzt da sind
  rationale: Gibt praesentes als gegenwärtig Anwesende wieder, ohne es unnötig auf »Lebende« festzulegen.
- source_word: pereant
  choice: sollen ... zugrunde gehen
  rationale: Erhält die jussive Bedeutung und die ernste Aussage von pereant.
- source_word: quam
  choice: lieber ... als dass
  rationale: Drückt die im lateinischen Vergleich enthaltene Rangordnung idiomatisch aus.
- source_word: anteposita est
  choice: vorangestellt worden ist
  rationale: Bewahrt die Passivform und die Grundbedeutung des Voranstellens, ohne ein im Lateinischen nicht genanntes Objekt wie »ihnen« einzufügen.
- source_word: neglegatur
  choice: unbeachtet bleibt
  rationale: Natürliches Deutsch für das passive »vernachlässigt/missachtet werden«, wobei der Kontrast zur vorrangigen Stellung des Gesetzes erhalten bleibt.
theological_decisions:
- issue: Vorrang des Gesetzes Gottes gegenüber dem Schicksal vieler Menschen
  choice: Die schroffe Rangordnung des Ausgangstextes wird unverändert beibehalten.
  alternative: Die Aussage abschwächen oder als bloße Warnung umformulieren.
  rationale: Der lateinische Text formuliert bewusst eine theologisch spannungsvolle Gegenüberstellung; sie darf nicht harmonisierend entschärft werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Die jetzt da sind« ist verständlich und hält die Bedeutung von praesentes offener als »die jetzt leben«. Die Konstruktion »lieber ... als dass« macht den lateinischen Vergleich im Deutschen natürlich lesbar.
