review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zurückhaltende Wiedergabe von *qui vivunt*, *angusta et vana haec* und *quae sunt reposita* sind zutreffend. „All dies“ fügt jedoch gegenüber dem bloßen Demonstrativum *haec* eine nicht ausgedrückte Totalität hinzu.
  naturalness: Der Satz ist in einem würdigen, modernen Bibelregister verständlich. „Dieses Enge und Nichtige“ bleibt absichtlich markiert, ist aber als substantivierte, abstrakte Ausdrucksweise im Deutschen möglich und wahrt die Eigentümlichkeit der Vorlage.
  terminology: „Die Lebenden“, „Enge und Nichtige“, „empfangen“ und „aufbewahrt“ sind theologisch nicht überdeutet. Die doppelte Form *ingredientes ingressi fuerint* wird ohne spekulative Verstärkung natürlich wiedergegeben.
  issues:
  - severity: low
    issue: Zusatz von „all“ in „in all dies Enge und Nichtige“
    rationale: Das lateinische *haec* bedeutet „diese“; es enthält keine Entsprechung zu „all“. Der Zusatz kann den Umfang der genannten Dinge verstärken.
  revised_text: Wenn also die Lebenden nicht in dieses Enge und Nichtige hineingehen, werden sie nicht empfangen können, was aufbewahrt ist.
