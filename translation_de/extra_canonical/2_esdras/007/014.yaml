source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: de
  text: Wenn also die Lebenden nicht in dieses Enge und Nichtige hineingehen, werden sie nicht empfangen können, was aufbewahrt ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui vivunt
  choice: die Lebenden
  rationale: Die substantivische Wiedergabe gibt den Relativsatz knapp und natürlich wieder, ohne den Kreis der Gemeinten näher zu bestimmen.
- source_word: angusta et vana haec
  choice: all dies Enge und Nichtige
  rationale: Die substantivierten Adjektive bewahren die ungewöhnliche, abstrakte Ausdrucksweise des lateinischen Textes. „Nichtig“ entspricht vana, ohne es vorschnell als „vergänglich“ oder „mühsam“ auszulegen.
- source_word: quae sunt reposita
  choice: was aufbewahrt ist
  rationale: Dies bildet den unbestimmten Relativausdruck und den Zustand des Zurückgelegten beziehungsweise Verwahrten ab, ohne ausdrücklich einen Empfänger oder eine Belohnung einzutragen.
theological_decisions:
- issue: Beziehung zwischen gegenwärtiger Enge und dem Aufbewahrten
  choice: 'Die Aussage bleibt allgemein: Die Lebenden müssen in das Enge und Nichtige hineingehen, um das Aufbewahrte empfangen zu können.'
  alternative: „Bedrängnisse dieser vergänglichen Welt durchmachen“ und „die für sie bereitgehaltene Belohnung empfangen“
  rationale: Die Alternative würde den bildhaften und grammatisch ungewöhnlichen Wortlaut theologisch ausdeuten. Die Übersetzung wahrt seine Spannung und Unbestimmtheit.
- issue: Emphase der Doppelung ingredientes ingressi fuerint
  choice: einfaches „hineingehen“
  alternative: „wirklich hineingehen“ oder „ganz hineingehen“
  rationale: Die lateinische Doppelung kann emphatisch oder übersetzungsbedingt sein. Eine zusätzliche deutsche Verstärkung wäre interpretierend; „hineingehen“ bildet die Bewegungsrichtung bereits deutlich ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Formulierung „all dies Enge und Nichtige“ ist bewusst beibehalten, damit die genuine Abstraktheit und Mehrdeutigkeit des lateinischen Textes nicht durch eine konkrete Deutung ersetzt wird.
