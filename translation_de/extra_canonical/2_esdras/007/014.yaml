- from: Wenn also die Lebenden nicht in all dies Enge und Nichtige hineingehen, werden sie nicht empfangen können, was aufbewahrt ist.
  to: Wenn also die Lebenden nicht in dieses Enge und Nichtige hineingehen, werden sie nicht empfangen können, was aufbewahrt ist.
  rationale: „All“ wurde gestrichen, damit das Demonstrativum *haec* ohne zusätzliche Quantifizierung wiedergegeben wird. Die bewusst abstrakte und leicht ungewöhnliche Formulierung bleibt erhalten, statt die „engen und nichtigen Dinge“ inhaltlich als Bedrängnisse oder Vergänglichkeit auszudeuten.
