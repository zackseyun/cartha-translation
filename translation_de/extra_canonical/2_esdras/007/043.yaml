    rationale: Die Formulierung „was ihnen vor Augen gestellt worden ist“ ergänzt „ihnen“. Das Fragment bietet lediglich quae anteposita sunt („was vorgelegt/vorangestellt worden ist“); die Bezugsperson bleibt darin unausgedrückt.
