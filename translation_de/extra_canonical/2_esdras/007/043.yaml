  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: de
  text: der Herrlichkeit des Höchsten[a], durch die alle beginnen werden zu sehen, was vorgelegt worden ist[b]. Ein Zeitraum …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Glanzes des Höchsten“.'
