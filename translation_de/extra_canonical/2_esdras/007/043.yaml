lexical_decisions:
- source_word: claritatis Altissimi
  choice: der Herrlichkeit des Höchsten
  rationale: Der Genitivanschluss des Fragments wird gewahrt; „Herrlichkeit“ gibt claritas in seinem religiös-apokalyptischen Zusammenhang natürlich und würdig wieder.
- source_word: unde
  choice: durch die
  rationale: Das relative Adverb bezeichnet hier den Ausgangspunkt oder das Mittel des Sehens. „Durch die“ ergibt im Deutschen einen natürlichen Anschluss an „Herrlichkeit“, ohne die Beziehung unnötig festzulegen.
- source_word: incipiant uidere
  choice: zu sehen beginnen werden
  rationale: Die Konstruktion incipere mit Infinitiv wird direkt wiedergegeben; die Zukunftsform entspricht dem apokalyptischen Zusammenhang und der englischen Konsultationsfassung.
- source_word: quae anteposita sunt
  choice: was ihnen vor Augen gestellt worden ist
  rationale: anteponere bedeutet wörtlich „voran-/vor jemanden hinstellen“. Die Formulierung bewahrt das Bild des Sichtbar-vor-Augen-Stellens.
- source_word: Spatium
  choice: Ein Zeitraum
  rationale: spatium bezeichnet hier eine zeitliche Spanne. Da das vorgelegte Quellenfragment an diesem Wort abbricht, markiert die Auslassung den unvollständigen Satz.
theological_decisions:
- issue: Bezug von unde auf claritas
  choice: 'instrumental bzw. vermittelnd: „durch die“'
  alternative: 'räumlich: „von der aus“ oder kausal: „weshalb“'
  rationale: Der knappe lateinische Anschluss bleibt mehrdeutig. „Durch die“ ist im Deutschen verständlich und lässt offen, ob die Herrlichkeit Mittel, Sphäre oder Ausgangspunkt des Erkennens ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Genitiv am Anfang und der Satzabbruch nach „Ein Zeitraum“ werden bewusst beibehalten; die Auslassungspunkte kennzeichnen das Ende des überlieferten Ausschnitts.
