  verdict: revise
  source_fidelity: Der Genitivanfang „der Herrlichkeit des Höchsten“ gibt claritatis Altissimi treffend wieder. „Durch die“ ist für unde als vermittelnden Bezug auf die Herrlichkeit möglich, sollte jedoch nicht durch ein zusätzliches „ihnen“ bei quae anteposita sunt konkretisiert werden; ein solcher Dativ steht im vorgelegten lateinischen Fragment nicht. „Ein Zeitraum …“ bewahrt den überlieferten Abbruch nach Spatium angemessen.
  naturalness: „Alle werden beginnen zu sehen“ ist im modernen Standarddeutsch flüssiger als die weit auseinandergezogene Infinitivkonstruktion. „Was vorgelegt worden ist“ ist idiomatisch und bewahrt zugleich die offene Referenz des lateinischen Passivs.
  terminology: „Herrlichkeit des Höchsten“ ist für claritas Altissimi traditionsbewusst, verständlich und nicht konfessionell einengend. Die Alternative „Glanz“ ist als lexikalische Fußnote vertretbar.
