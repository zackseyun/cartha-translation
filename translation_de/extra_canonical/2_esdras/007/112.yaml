id: 2ES.7.112
reference: 2 Esdras 7:112
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: de
  text: 'Und er antwortete mir und sagte: „Das gegenwärtige Zeitalter ist nicht das Ende; die Herrlichkeit bleibt darin nicht beständig.[a] Darum beteten diejenigen, die es vermochten, für die Schwachen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrlichkeit ist darin nicht häufig anzutreffen.“'
    reason: Das lateinische frequens kann neben „beständig, fortdauernd“ auch „häufig“ bedeuten.
lexical_decisions:
- source_word: praesens saeculum
  choice: das gegenwärtige Zeitalter
  rationale: Gibt den eschatologischen Zeitbegriff von saeculum wieder, ohne ihn auf die materielle Welt oder ein bloßes Jahrhundert zu verengen.
- source_word: finis
  choice: das Ende
  rationale: Bewahrt die knappe, im Kontext eschatologische Aussage des lateinischen Textes.
- source_word: gloria
  choice: die Herrlichkeit
  rationale: Die übliche und sachlich offene Wiedergabe, die den theologischen Gehalt nicht näher bestimmt, als es die Quelle tut.
- source_word: non frequens manet
  choice: bleibt darin nicht beständig
  rationale: Bringt im Zusammenhang den Gegensatz zwischen der vergänglichen Gegenwart und bleibender Herrlichkeit zum Ausdruck; die mögliche Bedeutung von frequens als „häufig“ wird in der Fußnote bewahrt.
- source_word: qui potuerunt
  choice: diejenigen, die es vermochten
  rationale: Erhält die unbestimmte Aussage darüber, wer dazu fähig oder imstande war, ohne eine Ursache oder besondere Gruppe hinzuzufügen.
- source_word: invalidis
  choice: die Schwachen
  rationale: Eine natürliche, breite Wiedergabe für Menschen ohne Kraft oder Vermögen; sie legt weder ausschließlich Krankheit noch einen bestimmten geistlichen Zustand fest.
theological_decisions:
- issue: Bedeutung von gloria non frequens manet im gegenwärtigen Zeitalter
  choice: die Herrlichkeit bleibt darin nicht beständig
  alternative: Herrlichkeit ist darin nicht häufig anzutreffen
  rationale: Die Hauptfassung wahrt den eschatologischen Kontrast und die Aussage mangelnder Dauerhaftigkeit; die lexikalisch mögliche Häufigkeitsnuance von frequens bleibt als Alternative sichtbar.
- issue: Identität der Fürbittenden und der Schwachen
  choice: diejenigen, die es vermochten … für die Schwachen
  alternative: die Fähigen … für die Kraftlosen
  rationale: Die Formulierung lässt offen, worin das Vermögen beziehungsweise die Schwäche bestand, und importiert keine konfessionelle Lehre über Fürbitte.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Zeitalter“ erhält den eschatologischen Sinn von saeculum; „die es vermochten“ bewahrt die knappe Unbestimmtheit des lateinischen Ausdrucks.
