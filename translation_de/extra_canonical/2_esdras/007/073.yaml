base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: de
  text: Sie haben das Gesetz, das sie empfangen haben, hintergangen. Und was werden sie im Gericht zu sagen haben, oder wie werden sie in den letzten Zeiten antworten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fraudauerunt
  choice: treulos behandelt
  rationale: Das lateinische Verb bezeichnet betrügerisches beziehungsweise treuloses Handeln. Die Wiedergabe wahrt den Vorwurf, ohne im Deutschen fälschlich zwingend einen finanziellen Betrug anzudeuten.
- source_word: eam quam acceperunt
  choice: das, was sie empfangen hatten
  rationale: Das feminine Pronomen verweist im Kontext auf etwas zuvor Genanntes, wahrscheinlich die lex. Da deutsches „Gesetz“ sächlich ist, gibt die substantivierte Wendung den Bezug natürlich wieder, ohne ein unpassendes grammatisches Geschlecht zu erzwingen.
- source_word: Et quid habebunt dicere
  choice: Und was werden sie … zu sagen haben
  rationale: „Und“ bewahrt die parataktische Verknüpfung von Et; „zu sagen haben“ entspricht der lateinischen Konstruktion habebunt dicere idiomatisch.
- source_word: in iudicio
  choice: im Gericht
  rationale: Die knappe Formulierung lässt sowohl den Gerichtsvorgang als auch das endzeitliche Gericht anklingen.
- source_word: in novissimis temporibus
  choice: in den letzten Zeiten
  rationale: Die wörtlich-nahe Wiedergabe erhält den eschatologischen Ausdruck und legt ihn nicht enger als die Vorlage aus.
theological_decisions:
- issue: Bezug des femininen Pronomens eam
  choice: Neutral als „das, was sie empfangen hatten“ wiedergegeben
  alternative: Explizit „das Gesetz, das sie empfangen hatten“
  rationale: Der Kontext legt das Gesetz nahe, doch der vorgelegte Vers nennt es nicht ausdrücklich. Die neutrale Form bewahrt den Rückbezug, ohne das Bezugswort in den Vers einzutragen.
- issue: Eschatologische Zeitangabe
  choice: „in den letzten Zeiten“
  alternative: „am Ende der Zeiten“
  rationale: Der Plural der lateinischen Vorlage bleibt erhalten; eine Vereinheitlichung zu einem einzelnen Endzeitpunkt würde die Aussage stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parataktische Satzverknüpfung und die gerichtliche beziehungsweise eschatologische Spannung der Vorlage bleiben erhalten.
