  source_fidelity: Die erste Satzhälfte gibt enim und den Vergleich mit ebdomada annorum sachgerecht wieder. In constitutio eius wird der rückverweisende Genitiv jedoch genauer durch „seine“ als durch die Zweckbestimmung „dafür geltende“ bewahrt.
  naturalness: „Denn es wird so lange dauern wie eine Jahrwoche“ ist modernes, verständliches Standarddeutsch. „Dies ist mein Urteil und seine Ordnung“ ist knapp und im gehobenen biblischen Register natürlich genug; das Possessivpronomen bezieht sich grammatisch auf „Urteil“.
  terminology: „Jahrwoche“ ist für ebdomada annorum passend. „Urteil“ gibt iudicium angemessen wieder. „Ordnung“ ist als Wiedergabe von constitutio vertretbar, sofern der offene Rückbezug von eius erhalten bleibt.
