    rationale: Das Latein sagt wörtlich „seine/deren Ordnung“ und legt den Bezug von eius nicht weiter aus. „Dafür geltende“ klingt, als bezeichne die Ordnung nur eine Regel für den zuvor genannten Zeitraum, und schränkt damit den Bezug unnötig ein.
