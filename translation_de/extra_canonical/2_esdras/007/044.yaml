source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim habebit sicut ebdomada annorum. Hoc est iudicium meum et constitutio eius,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/044.yaml
  text: For it will last like a week of years. This is my judgment and its ordinance,
translation:
  language: de
  text: Denn es wird so lange dauern wie eine Jahrwoche. Dies ist mein Urteil und seine Ordnung,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ebdomada annorum
  choice: Jahrwoche
  rationale: Die feste, verständliche Bezeichnung gibt wörtlich eine »Woche von Jahren«, also einen Zeitraum von sieben Jahren, wieder.
- source_word: iudicium meum
  choice: mein Urteil
  rationale: Bewahrt den richterlichen Sinn von »iudicium« und folgt der knappen Aussage des lateinischen Textes.
- source_word: constitutio eius
  choice: die dafür geltende Ordnung
  rationale: »Constitutio« bezeichnet hier eine Festsetzung oder Ordnung; »dafür geltende« gibt den rückbezüglichen Genitiv »eius« natürlich wieder, ohne den Bezug weiter festzulegen.
theological_decisions:
- issue: Bezug von »eius« in »constitutio eius«
  choice: die dafür geltende Ordnung
  alternative: seine Ordnung
  rationale: Das lateinische Pronomen lässt seinen genauen Bezug offen. Die gewählte Form bewahrt diese Rückbezüglichkeit und vermeidet eine unbegründete Personifizierung oder dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jahrwoche« ist knapp und bibelsprachlich etabliert; »so lange dauern wie« verdeutlicht den zeitlichen Vergleich. Das abschließende Komma bleibt erhalten, da der Satz im folgenden Verssegment weitergeführt wird.
