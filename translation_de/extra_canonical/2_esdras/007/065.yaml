  text: et propter hoc torquemur, quoniam scientes perimus. Lugeat hominum genus, et agrestes bestiae laetentur, lugeant omnes qui nati sunt, quadripedia uero et pecora
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: de
  text: Und deshalb werden wir gequält, weil wir, obwohl wir es wissen, zugrunde gehen. Das Menschengeschlecht soll trauern, und die wilden Tiere sollen sich freuen; alle, die geboren sind, sollen klagen, die vierfüßigen Tiere aber und das Vieh sollen froh sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquemur
  choice: werden wir gequält
  rationale: Gibt das passive Präsens und die starke Bedeutung von körperlicher oder seelischer Qual natürlich wieder.
- source_word: scientes perimus
  choice: wissend zugrunde gehen
  rationale: Bewahrt die knappe, spannungsreiche Aussage des Lateinischen, ohne das Objekt des Wissens zu ergänzen.
- source_word: hominum genus
  choice: das Menschengeschlecht
  rationale: Entspricht der kollektiven Bedeutung und dem gehobenen Ton des Ausgangstextes.
- source_word: agrestes bestiae
  choice: die wilden Tiere
  rationale: Gibt Tiere außerhalb des menschlichen Lebensbereichs idiomatisch wieder; das Lateinische kann Feld- oder Wildtiere bezeichnen.
- source_word: quadripedia
  choice: die Vierfüßer
  rationale: Bewahrt die eigenständige zoologische Kategorie des Ausgangstextes.
- source_word: pecora
  choice: das Vieh
  rationale: Bezeichnet kollektiv domestizierte Herdentiere und unterscheidet sie von den zuvor genannten wilden Tieren.
theological_decisions:
- issue: Grund der Qual und des Verderbens
  choice: „weil wir wissend zugrunde gehen“ ohne Ergänzung
  alternative: „weil wir trotz unseres Wissens zugrunde gehen“ oder „weil wir wissentlich sündigen und zugrunde gehen“
  rationale: Der lateinische Text nennt weder den Inhalt des Wissens noch ausdrücklich Sünde; die offene theologische Spannung bleibt daher erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Wechsel zwischen Konjunktiv („trauere“) und sollen-Formen vermeidet eine schwerfällige Reihung und erhält den feierlich-klagenden Charakter.
