base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/084.yaml
  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: de
  text: 'Der vierte Weg: in der letzten Zeit werden sie sich die Qual vor Augen führen, die für sie aufbewahrt ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: Der vierte Weg
  rationale: Gibt die Gliederung des lateinischen Textes direkt und natürlich wieder.
- source_word: considerabunt sibi
  choice: werden sie sich … vor Augen führen
  rationale: Bewahrt den reflexiven Bezug von „sibi“ und drückt „considerabunt“ im Deutschen als bewusstes Betrachten beziehungsweise Erkennen aus.
- source_word: in nouissimis
  choice: in der letzten Zeit
  rationale: Folgt der zeitlichen Deutung des substantivisch gebrauchten Superlativs, ohne den Zeitpunkt genauer festzulegen.
- source_word: repositum … eis tormentum
  choice: die Qual …, die für sie aufbewahrt ist
  rationale: Gibt sowohl das für sie bestimmte Leiden als auch den Gedanken des Aufbewahrtseins wieder; die im Ausschnitt abgebrochene Form „repo-“ wird entsprechend der überlieferten Satzfortsetzung und der Konsultationsschicht ergänzt.
theological_decisions:
- issue: Art und Zeitpunkt der eschatologischen Qual
  choice: „in der letzten Zeit“ und „Qual“ bleiben allgemein
  alternative: Eine genauere Festlegung auf Endgericht, Hölle oder einen bestimmten Zwischenzustand
  rationale: Der lateinische Wortlaut benennt weder den exakten Zeitpunkt noch die konkrete Art der Qual; diese Spannung wird nicht konfessionell aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „sich … vor Augen führen“ bildet den reflexiven lateinischen Ausdruck idiomatisch ab, während der Relativsatz das passive „für sie aufbewahrt“ erhält.
