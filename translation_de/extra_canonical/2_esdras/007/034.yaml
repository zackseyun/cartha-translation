  text: iudicium autem solum remanebit. et veritas stabit et fides convalescet,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/034.yaml
  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: de
  text: Doch allein das Gericht wird bleiben. Die Wahrheit wird feststehen, und der Glaube wird erstarken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: das Gericht
  rationale: Gibt den gerichtlichen Vorgang beziehungsweise das göttliche Urteil wieder, ohne die im Lateinischen bestehende Bedeutungsbreite unnötig einzuengen.
- source_word: solum remanebit
  choice: allein … wird bleiben
  rationale: Bewahrt die Hervorhebung und Ausschließlichkeit von solum bei natürlicher deutscher Wortstellung.
- source_word: veritas stabit
  choice: die Wahrheit wird feststehen
  rationale: „Feststehen“ vermittelt sowohl das wörtliche Stehen als auch Bestand und Geltung der Wahrheit.
- source_word: fides convalescet
  choice: der Glaube wird erstarken
  rationale: Convalescere bezeichnet ein Kräftigwerden oder Erstarken; „Glaube“ wahrt die mögliche Bedeutungsbreite von fides zwischen Glauben, Treue und Zuverlässigkeit.
theological_decisions:
- issue: Bedeutungsumfang von fides
  choice: der Glaube
  alternative: die Treue / die Zuverlässigkeit
  rationale: Der Kontext bietet hier keine sichere Grundlage, fides ausschließlich als menschliche Treue oder objektive Zuverlässigkeit zu bestimmen. „Glaube“ entspricht der traditionellen und im Satz natürlichen Wiedergabe, ohne die Spannung vollständig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei kurzen Zukunftsaussagen und ihre feierliche Parallelstruktur bleiben erhalten.
