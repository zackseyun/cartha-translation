source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: de
  text: 'Und ich antwortete: »Wird also den Seelen, nachdem sie von den Körpern getrennt worden sind, Zeit gegeben werden, das zu sehen, wovon du mir erzählt hast?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  choice: Und ich antwortete
  rationale: Die lateinische Doppelwendung ist eine geläufige Erzählformel. Im natürlichen modernen Deutsch gibt »ich antwortete« ihren Sinn vollständig wieder, ohne das schwerfällige »antwortete und sagte«.
- source_word: ergo dabitur tempus animabus
  choice: Wird also den Seelen … Zeit gegeben werden
  rationale: Bewahrt die Folgerungspartikel »ergo«, die Passivform und die offene Frage nach einer den Seelen gewährten Zeit.
- source_word: postquam separatae fuerint de corporibus
  choice: nachdem sie von den Körpern getrennt worden sind
  rationale: Gibt die zeitliche Folge und das passive Getrenntwerden eng am Latein wieder; der Plural »Körpern« entspricht »corporibus«.
- source_word: ut uideant de quo mihi
  choice: das zu sehen, wovon du mir erzählt hast
  rationale: »das …, wovon« erhält den Bezug auf einen Gegenstand oder Sachverhalt deutlicher als ein bloßes »was«. »erzählt hast« ergänzt den im vorliegenden Ausschnitt elliptischen Anschluss entsprechend dem überlieferten Satzverständnis.
theological_decisions:
- issue: Möglichkeit einer Wahrnehmungs- oder Erkenntniszeit der Seelen nach der Trennung vom Körper
  choice: Als Frage formuliert, ob den Seelen Zeit gegeben wird, »das zu sehen«
  alternative: Die Aussage als ausdrückliche Lehre über einen feststehenden Zwischenzustand formulieren
  rationale: Der Vers stellt eine Frage und entscheidet sie hier noch nicht. Die Übersetzung bewahrt diese Offenheit und vermeidet eine konfessionelle Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die umständliche lateinische Redundanz »antwortete und sagte« wurde idiomatisch verdichtet; Satzbau und Schlüsselbegriffe bleiben ansonsten bewusst quellennah.
