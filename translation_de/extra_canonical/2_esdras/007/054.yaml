base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/054.yaml
  text: I said[a], “Lord, how can it be?” And he said to me, “Not only this, but ask—
translation:
  language: de
  text: 'Ich sagte: „Herr, wie kann das sein?“ Er sagte zu mir: „Nicht nur dies, sondern frage—“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixi
  choice: Ich sagte
  rationale: Gibt die erste Person Singular des lateinischen Perfekts schlicht und natürlich wieder.
- source_word: domine
  choice: Herr
  rationale: Die übliche würdevolle Anrede für den lateinischen Vokativ.
- source_word: quomodo poterit?
  choice: Wie kann das sein?
  rationale: Bewahrt die offene Frage nach der Möglichkeit; das im Lateinischen nicht ausdrücklich genannte Subjekt wird im Deutschen idiomatisch durch „das“ aufgenommen.
- source_word: non hoc solummodo
  choice: Nicht nur dies
  rationale: Nahe Wiedergabe der hervorgehobenen Einschränkung, ohne den Sinn aus dem Folgevers vorwegzunehmen.
- source_word: sed interroga
  choice: sondern frage—
  rationale: „interroga“ ist ein Imperativ Singular. Der Gedankenstrich signalisiert, dass das Objekt beziehungsweise die Fortsetzung erst im folgenden Text erscheint.
theological_decisions:
- issue: Unausgesprochenes Subjekt in „quomodo poterit“
  choice: „Wie kann das sein?“
  alternative: „Wie wird es möglich sein?“
  rationale: Die gewählte Fassung erhält die sachliche Unbestimmtheit der Frage und klingt im modernen Deutsch natürlich, ohne eine bestimmte theologische Deutung einzutragen.
- issue: Abgrenzung zum folgenden Vers
  choice: Nach „frage“ offen abbrechen
  alternative: „die Erde, und sie wird es dir sagen“ ergänzen
  rationale: Der bereitgestellte lateinische Text endet bei „interroga“. Material aus der syntaktischen Fortsetzung darf nicht in diesen Vers hineingezogen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Dialogform und der syntaktisch offene Versschluss des lateinischen Ausgangstextes bleiben erhalten.
