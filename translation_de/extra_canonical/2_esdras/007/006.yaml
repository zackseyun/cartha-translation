  yaml_path: translation/extra_canonical/2_esdras/007/006.yaml
  text: 'Again, another example: a city is built and set in a plain, and it is full of every good thing.'
translation:
  language: de
  text: 'Noch ein anderes Beispiel: Eine Stadt ist erbaut und in einer Ebene angelegt; sie aber ist voll von allen guten Dingen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: item aliud
  choice: Noch ein anderes Beispiel
  rationale: Die knappe lateinische Wendung leitet eine weitere Veranschaulichung ein; „Beispiel“ wird zum natürlichen Verständnis ergänzt, ohne den Gedankengang festzulegen.
- source_word: posita in loco campestri
  choice: liegt in einer Ebene
  rationale: „Locus campestris“ bezeichnet flaches, offenes Gelände. Das idiomatische „liegt“ gibt „posita“ im Zusammenhang mit einer Stadt natürlich wieder.
- source_word: plena omnium bonorum
  choice: voll von allem Guten
  rationale: Bewahrt die umfassende und leicht mehrdeutige Bedeutung von „bona“ als Güter beziehungsweise gute Dinge, ohne sie unnötig zu konkretisieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der lateinischen Bildfolge, wird aber für heutige Leser leicht geglättet.
