  text: et omnis qui liberatus est de praedictis malis, ipse videbit mirabilia mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: de
  text: Und jeder, der von den angekündigten Übeln befreit wird, der wird meine Wunder sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberatus est
  choice: befreit wird
  rationale: Das lateinische Perfekt steht im Zusammenhang einer zukünftigen Erwartung; im natürlichen Deutschen gibt „befreit wird“ diesen Zukunftsbezug klar wieder.
- source_word: praedictis malis
  choice: den angekündigten Übeln
  rationale: „Angekündigt“ bewahrt den Bezug auf zuvor vorausgesagte beziehungsweise genannte Übel, ohne die Wendung unnötig auszudeuten.
- source_word: mirabilia mea
  choice: meine Wunder
  rationale: „Wunder“ ist die natürliche und würdige deutsche Wiedergabe für Gottes staunenerregende Machttaten.
- source_word: ipse videbit
  choice: der wird … sehen
  rationale: Das wiederaufnehmende „der“ bildet das emphatische beziehungsweise resumptive ipse nach dem vorangestellten komplexen Subjekt ab und bleibt im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme mit „der“ bewahrt die markante lateinische Satzstruktur, ohne unverständlich zu wirken.
