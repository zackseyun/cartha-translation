  text: Say to it, ‘You produce gold and silver and bronze, and iron also and lead and clay;
translation:
  language: de
  text: 'Sage zu ihr: »Du bringst Gold und Silber hervor, Bronze und Eisen, dazu Blei und Ton.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Text des angegebenen Ausschnitts bricht nach »Gold … und« ab; die weitere Aufzählung folgt der im englischen POB wiedergegebenen Textgestalt.
    reason: Die Quellenlage des vorgelegten lateinischen Ausschnitts ist unvollständig und sollte transparent gemacht werden.
lexical_decisions:
- source_word: aurum creas
  choice: du bringst Gold … hervor
  rationale: Das lateinische „creas“ bedeutet wörtlich „du erschaffst/erzeugst“. Im Bild von der Erde, die Metalle und Ton hervorbringt, ist „hervorbringen“ im Deutschen natürlich und bewahrt den Sinn.
- source_word: ei
  choice: zu ihr
  rationale: Das Pronomen bezieht sich auf „terram“ (Erde), das im Lateinischen wie im Deutschen feminin ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Bronze“ ist für gewöhnliche Leser verständlicher als das ältere „Erz“. Die parallele Aufzählung bleibt knapp und rhythmisch.
