source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum finissem loqui verba haec, et missus est ad me angelus, qui missus fuerat ad me primis noctibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: de
  text: 'Und es geschah: Als ich diese Worte zu Ende gesprochen hatte, wurde der Engel zu mir gesandt, der in den ersten Nächten zu mir gesandt worden war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est
  choice: Und als
  rationale: Die lateinische Erzählungsformel wird in natürliches modernes Deutsch überführt; ihr narrativer Anschluss bleibt durch „Und“ erhalten.
- source_word: cum finissem loqui verba haec
  choice: als ich diese Worte zu Ende gesprochen hatte
  rationale: Das Plusquamperfekt gibt die Vorzeitigkeit von „finissem“ wieder; „diese Worte“ entspricht „verba haec“.
- source_word: angelus
  choice: der Engel
  rationale: Die übliche und sachlich genaue Wiedergabe des lateinischen Begriffs.
- source_word: primis noctibus
  choice: in den ersten Nächten
  rationale: Die pluralische Zeitangabe wird eng am lateinischen Wortlaut bewahrt.
theological_decisions:
- issue: Wiederholte Sendung desselben Engels
  choice: „wurde der Engel zu mir gesandt, der schon in den ersten Nächten zu mir gesandt worden war“
  alternative: „kam wieder der Engel zu mir, der in den ersten Nächten zu mir gesandt worden war“
  rationale: Der doppelte Gebrauch von „missus“ wird beibehalten, statt die zweite Sendung bloß als Kommen zu paraphrasieren. „schon“ verdeutlicht idiomatisch den Rückbezug, ohne ausdrücklich ein im Lateinischen nicht vorhandenes „wieder“ einzufügen.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch mit enger Bindung an die lateinische Satzstruktur. Keine Fußnoten erforderlich.
