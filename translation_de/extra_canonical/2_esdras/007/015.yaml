source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo tu quare conturbaris, corruptibilis cum sis? et quid moveris tu, cum sis mortalis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/015.yaml
  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: de
  text: Warum also bist du jetzt beunruhigt, wo du doch vergänglich bist? Und warum bist du erschüttert, wo du doch sterblich bist?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: bist du ... beunruhigt
  rationale: Gibt die innere Unruhe oder Bestürzung natürlich und in deutlicher Parallelität zu »erschüttert« wieder.
- source_word: corruptibilis
  choice: vergänglich
  rationale: Bezeichnet die dem Verfall unterworfene menschliche Natur; »vergänglich« ist im heutigen Deutsch klarer und würdiger als »verderblich«.
- source_word: moveris
  choice: bist du ... erschüttert
  rationale: Vermeidet das im Deutschen leicht sentimental verstandene »bewegt« und bewahrt den Sinn innerer Erschütterung im Parallelismus.
- source_word: mortalis
  choice: sterblich
  rationale: Direkte und natürliche Entsprechung des lateinischen Ausdrucks.
theological_decisions:
- issue: Verhältnis von menschlicher Vergänglichkeit und innerer Erschütterung
  choice: Die beiden rhetorischen Fragen ohne erklärenden Zusatz wiedergeben
  alternative: Den Zusammenhang als ausdrückliche Zurechtweisung oder Trostaussage ausdeuten
  rationale: Der lateinische Text stellt die Spannung zwischen Erschütterung und menschlicher Vergänglichkeit fest, erklärt aber nicht ausdrücklich, welche Folgerung daraus zu ziehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Konstruktion »wo du doch ... bist« bildet cum sis idiomatisch ab und erhält den rhetorischen Parallelismus.
