  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: de
  text: 'Die dritte Stufe: Sie sehen das Zeugnis, das derjenige, der sie geformt hat, über sie abgelegt hat[a]: dass sie zu Lebzeiten das ihnen im Glauben anvertraute Gesetz gehalten haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zeugnis, das ihnen derjenige bezeugt hat, der sie geformt hat“; das lateinische „eis“ kann „ihnen“ oder im Zusammenhang „über sie“ wiedergegeben werden.'
    reason: Bewahrt die Mehrdeutigkeit des lateinischen Dativs eis und gibt testificatus est mit „bezeugt“ quellentreu wieder.
lexical_decisions:
- source_word: Tertius ordo
  choice: Die dritte Stufe
  rationale: „Stufe“ gibt die geordnete Folge der beschriebenen Zustände natürlicher wieder als das im Deutschen missverständliche „Orden“; „dritte“ bleibt formal erhalten.
- source_word: uidentes
  choice: Sie sehen
  rationale: Das Partizip bezeichnet hier Wahrnehmung und soll nicht wie in früheren Gliedern kausal mit „weil“ aufgelöst werden.
- source_word: qui plasmauit eas
  choice: derjenige, der sie geformt hat
  rationale: „Geformt“ entspricht plasmare genauer als das allgemeinere „geschaffen“; „sie“ bezieht sich auf die Seelen.
- source_word: seruauerunt legem
  choice: das Gesetz gehalten haben
  rationale: „Das Gesetz halten“ ist eine klare, im biblischen Register geläufige Wiedergabe von servare legem.
- source_word: quae data est eis in fide
  choice: das ihnen anvertraute Gesetz
  rationale: Die aus dem fortlaufenden Text ergänzte Wendung wird sinngemäß als treuhänderische Übergabe verstanden; dies ergibt natürliches modernes Deutsch, ohne „Glauben“ als mögliche, aber kontextuell weniger wahrscheinliche Deutung einzutragen.
theological_decisions:
- issue: Adressat beziehungsweise Bezug des Zeugnisses
  choice: über sie abgelegt
  alternative: ihnen bezeugt
  rationale: Das lateinische eis lässt formal einen Dativ zu; inhaltlich beschreibt der folgende dass-Satz jedoch ihr Verhalten, sodass ein Zeugnis „über sie“ im Zusammenhang gut passt. Die echte grammatische Mehrdeutigkeit wird in einer Fußnote bewahrt.
- issue: Verhältnis von Gesetzestreue und Zeugnis
  choice: Der dass-Satz gibt den Inhalt des Zeugnisses wieder
  alternative: Der dass-Satz könnte enger an das Sehen oder an die Übergabe des Gesetzes angeschlossen werden
  rationale: Die gewählte Zeichensetzung folgt der naheliegenden syntaktischen Lesart, ohne daraus eine weitergehende Aussage über Verdienst oder Heil abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel zum Partizip uidentes wird als eigenständige Aussage „Sie sehen“ sichtbar gemacht. Die Formulierung vermeidet konfessionelle Zusätze und behält die juristisch-zeugnishafte Bildsprache bei.
