  terminology: „Zeugnis“, „geformt“ und „das Gesetz gehalten“ sind angemessen. Die Fußnote sollte die Mehrdeutigkeit von eis bewahren, ohne testificatus est ungenau zu „gegeben hat“ abzuschwächen.
