  to: Der siebte Weg ist größer als alle zuvor genannten Wege[a]; denn sie werden in Verwirrung dahinschwinden, von Schrecken verzehrt werden und vor Angst verkümmern, während sie die Herrlichkeit des Höchsten sehen, vor dem sie während ihres Lebens gesündigt haben und vor dem sie in den letzten Zeiten gerichtet zu werden beginnen[b].
