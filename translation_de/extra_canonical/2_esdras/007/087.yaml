  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: de
  text: Der siebte Weg ist größer als alle zuvor genannten Wege[a]; denn sie werden in Verwirrung dahinschwinden, von Schrecken verzehrt werden und vor Angst verkümmern, während sie die Herrlichkeit des Höchsten sehen, vor dem sie während ihres Lebens gesündigt haben und vor dem sie in den letzten Zeiten gerichtet zu werden beginnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mehrere Wörter in diesem Vers sind in der lateinischen Überlieferung textlich unsicher. Der Sinn ist dennoch hinreichend klar: Die Gottlosen erleiden ihre schwerste Qual, wenn sie mit der Herrlichkeit des Höchsten konfrontiert werden, vor dem sie gesündigt haben.'
    reason: textual_variant
  - marker: b
    text: 'Frühere Wiedergabe: „Der siebte Weg, schwerer als alle zuvor genannten Wege: Sie schwinden in Verwirrung dahin, werden von Scham verzehrt und verkümmern vor Angst, weil sie die Herrlichkeit des Höchsten sehen, vor dem sie während ihres Lebens gesündigt haben und vor dem sie in den letzten Zeiten gerichtet werden sollen.“'
    reason: previous_rendering
lexical_decisions:
- source_word: maior
  choice: schwerer
  rationale: Wörtlich bedeutet das Wort „größer“. Im Zusammenhang bezeichnet es jedoch den höchsten Grad der Qual unter den sieben Wegen; „schwerer“ gibt diesen vergleichenden Sinn im Deutschen natürlich wieder.
- source_word: detabescent in confusione
  choice: werden in Verwirrung dahinschwinden
  rationale: Bewahrt das Futur und die bildhafte Bedeutung von „detabescere“ (allmählich vergehen, dahinschwinden), ohne „confusio“ einseitig als Scham festzulegen.
- source_word: consumentur in horroribus
  choice: von Schrecken verzehrt werden
  rationale: Gibt sowohl das passive Futur als auch den Plural „horroribus“ wieder; „Schrecken“ ist hier treffender als „Scham“.
- source_word: maereescent / marcescent in timoribus
  choice: vor Angst verkümmern
  rationale: Die Überlieferung ist orthografisch bzw. textkritisch rau. Der Kontext und die konsultierte Lesart stützen ein Verwelken oder Verkümmern unter Furcht; der lateinische Plural wird idiomatisch als Kollektiv „Angst“ wiedergegeben.
- source_word: uidentes
  choice: wenn sie … sehen
  rationale: Die temporale Wiedergabe macht den begleitenden Umstand natürlich verständlich, ohne „quoniam“ fälschlich unmittelbar an das Sehen zu binden.
- source_word: incipient … iudicari
  choice: allmählich gerichtet werden
  rationale: Das im vollständigen Vers bezeugte „incipient“ darf nicht ausgelassen werden. „Allmählich“ bringt den einsetzenden Vorgang im Deutschen flüssiger zum Ausdruck als die sperrige Formulierung „beginnen, gerichtet zu werden“.
theological_decisions:
- issue: Art und Zeitpunkt des Gerichts
  choice: „in den letzten Zeiten allmählich gerichtet werden“
  alternative: „in der letzten Zeit zu richten beginnen“ oder ein bereits abgeschlossenes Gericht
  rationale: Die passive Form hält fest, dass die Betroffenen gerichtet werden, und bewahrt den futurischen, einsetzenden Charakter des lateinischen Ausdrucks, ohne ein bestimmtes konfessionelles Endzeitschema einzutragen.
- issue: Bezug der Herrlichkeit des Höchsten auf Sünde und Gericht
  choice: Die Wiederholung „vor dem“ bleibt erhalten.
  alternative: Straffung zu einem einzigen Relativsatz
  rationale: 'Die Wiederholung bewahrt die rhetorische und theologische Spannung: Derselbe Höchste, vor dem sie im Leben sündigten, steht ihnen im kommenden Gericht gegenüber.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache, steigernde Beschreibung des Leidens bleibt erhalten. Futurformen und Kausalstruktur werden ausdrücklich bewahrt; textliche Rauheiten werden in einer Fußnote kenntlich gemacht.
