source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: coram te, domine, demonstra, domine, seruo tuo, si post mortem uel nunc quando reddimus unusquisque animam suam, si conseruati conseruabimur in requie, donec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/075.yaml
  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: de
  text: Vor dir, Herr, zeige deinem Diener, Herr, ob wir nach dem Tod oder jetzt, wenn jeder von uns seine Seele zurückgibt, falls wir bewahrt werden, in Ruhe bewahrt bleiben werden, bis …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Textabschnitt bricht nach „bis“ ab; der Satz wird hier nicht ergänzt.
    reason: Der bereitgestellte lateinische Quelltext endet mit donec und ist syntaktisch unvollständig.
lexical_decisions:
- source_word: coram te
  choice: Vor dir
  rationale: Gibt die räumlich-forensische Grundbedeutung der lateinischen Wendung wieder und wahrt den abrupten Beginn des erhaltenen Textabschnitts.
- source_word: reddimus unusquisque animam suam
  choice: wenn jeder von uns seine Seele zurückgibt
  rationale: Bewahrt das Bild des lateinischen Textes, statt es lediglich als „stirbt“ aufzulösen; „jeder von uns“ gibt den distributiven Sinn von unusquisque wieder.
- source_word: conseruati conseruabimur
  choice: falls wir bewahrt werden, … bewahrt bleiben werden
  rationale: Erhält sowohl die konditionale Form mit si als auch die Wiederholung und Zukunftsbedeutung; „bewahrt bleiben“ klingt im Deutschen natürlich und bezeichnet fortdauernde Bewahrung.
- source_word: in requie
  choice: in Ruhe
  rationale: Nahe, natürliche Wiedergabe des lateinischen Ausdrucks ohne eine spezifische Lehre über den Zwischenzustand einzutragen.
- source_word: donec
  choice: bis …
  rationale: Markiert ausdrücklich, dass der gelieferte Quelltext an dieser Stelle unvollständig abbricht.
theological_decisions:
- issue: Zustand der Seele nach dem Tod
  choice: Die Frageform und die Bedingung „falls wir bewahrt werden“ bleiben offen erhalten.
  alternative: Die Bewahrung als sichere Aussage oder als sofortigen Eintritt in einen bestimmten Zwischenzustand formulieren.
  rationale: Der lateinische Text stellt eine Frage und enthält mit si eine echte syntaktische Spannung; diese darf nicht konfessionell oder systematisch aufgelöst werden.
- issue: Mögliche emphatische Wiederholung in conseruati conseruabimur
  choice: Die Wiederholung wird formal als „bewahrt … bewahrt bleiben werden“ wiedergegeben.
  alternative: „ganz gewiss bewahrt werden“ oder „sicher bewahrt bleiben“.
  rationale: Eine emphatische, möglicherweise semitisch beeinflusste Konstruktion ist denkbar, doch die vorliegende lateinische Form lässt zugleich eine konditionale Lesart zu. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Anrede „Herr“ bleibt entsprechend der Quelle erhalten. Gedankenstriche gliedern den schwer verständlichen eingeschobenen Zeitausdruck, ohne die syntaktische Offenheit zu beseitigen.
