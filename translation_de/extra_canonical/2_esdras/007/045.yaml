  yaml_path: translation/extra_canonical/2_esdras/007/045.yaml
  text: 'But to you alone I showed these things. Then I answered and said[a], “Lord, then I said, and now I say:'
translation:
  language: de
  text: 'Dir allein aber habe ich dies gezeigt. Da antwortete ich und sagte: »Herr, damals sagte ich, und jetzt sage ich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tibi autem soli
  choice: Dir allein aber
  rationale: Gibt die Hervorhebung durch „soli“ und den weiterführenden Gegensatz von „autem“ knapp und würdig wieder.
- source_word: ostendi haec
  choice: habe ich dies gezeigt
  rationale: Entspricht dem Perfekt „ostendi“; das singularische „dies“ ist im Deutschen für einen zusammenhängenden Offenbarungsinhalt natürlich.
- source_word: respondi ... et dixi
  choice: antwortete ich und sagte
  rationale: Bewahrt die im biblischen Erzählstil übliche Doppelung des lateinischen Wortlauts.
- source_word: tunc ... et nunc
  choice: damals ... und jetzt
  rationale: Stellt den rhetorischen zeitlichen Kontrast heraus, den die Überlieferung trotz der etwas schwierigen lateinischen Wortstellung erkennen lässt.
theological_decisions:
- issue: Zuordnung von „tunc“ zum Erzählsatz oder zur direkten Rede
  choice: '„damals“ wird der direkten Rede zugeordnet: „damals sagte ich, und jetzt sage ich“'
  alternative: '„Da antwortete ich und sagte: Herr, und jetzt sage ich“'
  rationale: Die lateinische Stellung ist mehrdeutig bzw. leicht gestört. Der klare Gegensatz „tunc ... nunc“ sowie die alten Tochterübersetzungen sprechen dafür, die frühere und die gegenwärtige Aussage Esras gegenüberzustellen, ohne diese Spannung im Text zu glätten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die formelhafte Doppelung „antwortete ... und sagte“ bleibt erhalten; der Vers endet entsprechend der Quelle offen mit einem Doppelpunkt.
