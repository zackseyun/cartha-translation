source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: de
  text: Und die Weltzeit wird sieben Tage lang in das uralte Schweigen zurückkehren, wie bei den früheren Anfängen, sodass niemand zurückbleibt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: Weltzeit
  rationale: Bezeichnet hier das gegenwärtige Weltzeitalter beziehungsweise die Weltordnung; „Weltzeit“ bewahrt sowohl den zeitlichen als auch den kosmischen Bezug.
- source_word: convertetur
  choice: wird … zurückkehren
  rationale: Das mediale/passive Futur bezeichnet eine Rückkehr in einen früheren Zustand; die natürliche deutsche Formulierung vermeidet ein unnötig schweres „wird zurückverwandelt werden“.
- source_word: antiquum silentium
  choice: das uralte Schweigen
  rationale: Gibt die Vorstellung eines bereits am Anfang bestehenden Schweigens knapp und würdevoll wieder.
- source_word: in prioribus initiis
  choice: wie bei den ersten Anfängen
  rationale: Bewahrt den auffälligen Plural „initiis“ und den Rückbezug auf die ursprünglichen Anfänge, ohne ihn auslegend zu vereinheitlichen.
- source_word: nemo derelinquatur
  choice: niemand übrig bleibt
  rationale: Im Kontext des universalen Schweigens bedeutet derelinquatur am natürlichsten, dass niemand verbleibt; „zurückgelassen wird“ könnte irreführend eine handelnde Person oder Gruppe nahelegen.
theological_decisions:
- issue: Bedeutung der Rückkehr zum ursprünglichen Schweigen
  choice: Die Aussage bleibt bildhaft und wird nicht als konkrete Lehre über Vernichtung, Tod oder einen menschenleeren Kosmos ausgedeutet.
  alternative: „sodass niemand am Leben bleibt“ oder „sodass kein Mensch zurückgelassen wird“
  rationale: Der lateinische Text nennt weder Tod noch Vernichtung ausdrücklich. Die Übersetzung bewahrt daher die eschatologische Spannung und Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „erste Anfänge“ wurde wegen des lateinischen Plurals bewusst beibehalten; „Weltzeit“ ist leicht gehoben, trifft saeculum hier aber genauer als bloßes „Zeitalter“ oder „Welt“.
