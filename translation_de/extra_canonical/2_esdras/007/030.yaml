revisions:
- from: Und die Weltzeit wird für sieben Tage in das uralte Schweigen zurückkehren, wie bei den ersten Anfängen, sodass niemand übrig bleibt.
  to: Und die Weltzeit wird sieben Tage lang in das uralte Schweigen zurückkehren, wie bei den früheren Anfängen, sodass niemand zurückbleibt.
  rationale: 'Die Revision ist auf drei sprachlich und semantisch sichere Punkte beschränkt: prioribus wird als „früheren“ wiedergegeben, der passive Sinn von derelinquatur durch „zurückbleibt“ gewahrt und die Zeitdauer idiomatischer formuliert. Die bildhafte Aussage bleibt bewusst ohne dogmatische Auslegung.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:07:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: saeculum kehrt für sieben Tage zum antiquum silentium zurück; der Vergleich mit den prioribus initiis bleibt erhalten. „Niemand übrig bleibt“ schwächt jedoch die passive, relationale Nuance von nemo derelinquatur („niemand wird zurückgelassen/zurückbleibt“) ab. „Früheren“ entspricht prioribus unmittelbarer als „ersten“.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Sieben Tage lang“ stellt den zeitlichen Umfang eindeutiger dar als „für sieben Tage“. „Zurückbleibt“ ist idiomatisch und vermeidet die stärker endgültig-vernichtende Konnotation von „übrig bleibt“.
  terminology: „Weltzeit“ ist für saeculum als gegenwärtige Weltordnung beziehungsweise Weltzeit vertretbar, wenn auch leicht gehoben. „Uralte Schweigen“ gibt antiquum silentium angemessen wieder. Die Revision legt keine eschatologische Deutung fest.
  issues:
  - severity: medium
    issue: „wie bei den ersten Anfängen“ für in prioribus initiis
    rationale: Prioribus bedeutet unmittelbar „früheren/vorangegangenen“, nicht zwingend „ersten“. „Früheren Anfängen“ bewahrt den Plural und vermeidet eine unnötige Präzisierung.
  - severity: medium
    issue: „sodass niemand übrig bleibt“ für ita ut nemo derelinquatur
    rationale: Derelinquatur ist ein passiver Ausdruck des Zurückgelassenwerdens. „Niemand zurückbleibt“ bildet diese Nuance natürlicher und genauer ab, ohne Tod oder Vernichtung einzutragen.
  - severity: low
    issue: „für sieben Tage“
    rationale: „Sieben Tage lang“ markiert im Deutschen klarer die Dauer des Rückkehrzustands.
  revised_text: Und die Weltzeit wird sieben Tage lang in das uralte Schweigen zurückkehren, wie bei den früheren Anfängen, sodass niemand zurückbleibt.
