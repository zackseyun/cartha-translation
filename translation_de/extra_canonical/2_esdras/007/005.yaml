id: 2ES.7.5
reference: 2 Esdras 7:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: de
  text: Denn wenn jemand in das Meer gelangen will, um es zu sehen oder zu beherrschen, wie kann er in die Weite gelangen, wenn er nicht die Enge durchquert?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingredi mare
  choice: ins Meer hinausfahren
  rationale: Im Bildzusammenhang bezeichnet die Wendung das Hineingelangen in das Meer. »Hinausfahren« ist im Deutschen bei einem Menschen, der das Meer erreichen und bewältigen will, natürlicher als das missverständliche »das Meer betreten«.
- source_word: videre eum
  choice: um es zu sehen
  rationale: Das lateinische Pronomen eum bezieht sich dem Sinn nach auf mare; im Deutschen steht daher das sächliche »es«.
- source_word: dominari eius
  choice: es zu beherrschen
  rationale: Gibt den Gedanken der Herrschaft oder Bewältigung möglichst direkt wieder, ohne ihn auf eine bestimmte Tätigkeit einzuengen.
- source_word: angustum
  choice: die Enge
  rationale: Bewahrt den substantivierten Gegensatz zur folgenden Weite und den räumlichen Bildcharakter.
- source_word: in latitudinem venire
  choice: in die Weite gelangen
  rationale: Gibt latitudo als räumliche Weite wieder und erhält den ausdrücklichen Gegensatz zur Enge.
theological_decisions:
- issue: Bild von Enge und Weite
  choice: Die räumliche Metapher bleibt unaufgelöst stehen.
  alternative: Die Enge ausdrücklich als Mühsal und die Weite als Heil oder ewiges Leben deuten.
  rationale: Der Vers selbst formuliert ein Gleichnis; seine theologische Anwendung folgt aus dem Zusammenhang und soll nicht in die Übersetzung hineingelesen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der Gegensatz zwischen »Enge« und »Weite« bleiben erhalten. Die doppelte Willensformel volens voluerit wird idiomatisch mit »will« wiedergegeben, ohne eine im Deutschen unnatürliche Verdopplung oder zusätzliche Intensivierung.
