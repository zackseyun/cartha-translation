  to: Und wenn[a] der Richter denen, die durch sein Wort erschaffen wurden, nicht vergäbe und die Vielzahl der Missachtungen[b] nicht tilgte, blieben von einer unzählbaren Menge vielleicht nur sehr wenige übrig.
  rationale: 'Die Revision stellt die lateinische Konstruktion multitudinem contemptionum genauer nach: eine Vielzahl/Menge von Missachtungen, nicht bloß viele einzelne „Akte“ einer abstrakten Verachtung. Der hypothetische Charakter, die Gottesbeziehung und die unbestimmte Aussage über den kleinen verbleibenden Rest bleiben unverändert.'
