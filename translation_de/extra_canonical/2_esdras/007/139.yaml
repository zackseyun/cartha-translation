source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: de
  text: Und wenn[a] der Richter denen, die durch sein Wort erschaffen wurden, nicht vergäbe und die Vielzahl der Missachtungen[b] nicht tilgte, blieben von einer unzählbaren Menge vielleicht nur sehr wenige übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wenn der Richter …“'
    reason: Bewahrt die überlieferte alternative Verknüpfung mit dem vorausgehenden Gedankengang, obwohl im vorliegenden lateinischen Satz keine ausdrückliche kausale Konjunktion steht.
  - marker: b
    text: 'Oder: „die Menge der Verachtungen“.'
    reason: „contemptiones“ bezeichnet Verachtung, Geringschätzung oder bewusste Missachtung; die Alternative wahrt sowohl diese Nuance als auch den pluralischen Genitiv des lateinischen Ausdrucks.
lexical_decisions:
- source_word: iudex
  choice: der Richter
  rationale: Gibt die richterliche Bezeichnung unmittelbar und würdevoll wieder, ohne das im Lateinischen nicht ausdrücklich stehende Pronomen „er“ einzufügen.
- source_word: ignoverit
  choice: vergäbe
  rationale: Der deutsche Konjunktiv II bildet die hypothetische Bedingung zusammen mit dem Folgesatz natürlich und klar ab.
- source_word: creati sunt verbo eius
  choice: durch sein Wort erschaffen wurden
  rationale: Bewahrt sowohl das passive Erschaffenwerden als auch das instrumentale „durch sein Wort“.
- source_word: multitudinem contemptionum
  choice: die vielen Akte der Verachtung
  rationale: „Verachtung“ erhält die spezifische Bedeutung von contemptionum; „Akte“ macht den lateinischen Plural im Deutschen verständlich, während „die vielen“ multitudinem natürlich wiedergibt.
- source_word: derelinquentur … nisi pauci valde
  choice: blieben … nur sehr wenige übrig
  rationale: Gibt die Aussage über den verbleibenden Rest idiomatisch wieder und bewahrt die starke Einschränkung durch pauci valde.
- source_word: innumerabilem multitudinem
  choice: von einer unzählbaren Menge
  rationale: Erhält das Bild einer nicht zählbaren Ausgangsmenge und vermeidet die stillschweigende Ergänzung eines im Lateinischen nicht genannten Bezugsworts wie „Menschen“.
theological_decisions:
- issue: Vergebung und Tilgung als Voraussetzung dafür, dass überhaupt viele Geschöpfe bestehen bleiben
  choice: Die hypothetische Spannung des Bedingungssatzes bleibt erhalten.
  alternative: Den Satz als direkte dogmatische Feststellung über Gottes Vergebung umzuformen.
  rationale: Der lateinische si-Satz stellt ausdrücklich eine hypothetische Bedingung auf; diese darf nicht zugunsten einer glatteren theologischen Aussage aufgelöst werden.
- issue: Bedeutung von contemptionum
  choice: Akte der Verachtung
  alternative: Verfehlungen
  rationale: Die spezifische Vorstellung von Verachtung beziehungsweise bewusster Missachtung soll nicht zu einem allgemeinen Begriff für Sünde oder Vergehen abgeschwächt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallelen Konjunktivformen „vergäbe“, „tilgte“ und „blieben“ machen den hypothetischen Zusammenhang klar; die Wortstellung bleibt natürlich, ohne die syntaktische Unebenheit des Lateinischen unnötig nachzuahmen.
