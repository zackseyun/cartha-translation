  source_fidelity: 'Der Bedingungssatz und die hypothetische Folge sind grundsätzlich treffend wiedergegeben. „durch sein Wort erschaffen wurden“, „nicht vergäbe“, „nicht tilgte“ und „nur sehr wenige übrig“ entsprechen dem lateinischen Sinn. Jedoch ist „multitudinem contemptionum“ nicht „die vielen Akte der Verachtung“: Das Singularwort multitudinem bezeichnet die Menge/Vielzahl, während contemptionum die pluralischen Verachtungen bzw. Missachtungen bezeichnet. Die Übersetzung verschiebt daher die Quantifizierung.'
  naturalness: Die Satzführung ist modernes, verständliches Standarddeutsch. „Akte der Verachtung“ klingt jedoch verwaltungssprachlich und ist mit dem vorangestellten „vielen“ weniger natürlich als „die Vielzahl der Missachtungen“ bzw. „die Menge der Verachtungen“.
  terminology: „der Richter“ ist angemessen. „Verachtung“ wahrt die besondere Bedeutung von contemptionum besser als das allgemeinere „Verfehlungen“. „Missachtungen“ kann den pluralischen Charakter und die willentliche Geringschätzung idiomatischer wiedergeben.
  issues:
