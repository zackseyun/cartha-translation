    issue: Quantifizierung bei multitudinem contemptionum ist verschoben.
    rationale: Lateinisch steht „Menge/Vielzahl“ im Singular (multitudinem) mit einem Genitiv Plural („der Verachtungen/Missachtungen“). „die vielen Akte der Verachtung“ macht dagegen die Akte unmittelbar zahlreich und behandelt Verachtung als Singularabstraktum.
  - severity: low
    issue: Fußnote b bietet eine zu allgemeine Alternative.
    rationale: „Verfehlungen“ kann als freie Deutung möglich sein, verdeckt aber gerade die spezifische Nuance von contemptionum. Eine Alternative mit „Missachtungen“ dokumentiert die lexikalische Spannweite genauer.
