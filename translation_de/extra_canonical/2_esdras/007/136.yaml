source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: de
  text: und von großer Barmherzigkeit, denn er vermehrt die Erweise seiner Barmherzigkeit noch mehr für die, die gegenwärtig sind, die, die vergangen sind, und die, die künftig sein werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Gegenwärtigen, die Vergangenen und die Zukünftigen“.'
    reason: Gibt die knappe, symmetrische zeitliche Dreierreihe des Lateinischen als mögliche alternative deutsche Formulierung wieder, ohne „vergangen“ ausdrücklich auf Verstorbene oder „zukünftig“ auf bestimmte Generationen festzulegen.
lexical_decisions:
- source_word: multae misericordiae
  choice: von großer Barmherzigkeit
  rationale: Die lateinische Genitivwendung bezeichnet idiomatisch große bzw. reiche Barmherzigkeit; die gewählte Formulierung bewahrt zudem den Anschluss an die vorausgehende Satzkonstruktion.
- source_word: multiplicat magis misericordias
  choice: er vermehrt die Erweise seiner Barmherzigkeit
  rationale: Der Plural misericordias bezeichnet konkrete Erweise der Barmherzigkeit. magis verstärkt bzw. modifiziert multiplicat; das deutsche „vermehrt“ gibt diesen Sinn natürlich wieder, ohne ein unbelegtes fortschreitendes „immer mehr“ festzulegen.
- source_word: qui praesentes sunt
  choice: die, die jetzt leben
  rationale: Wörtlich sind es „die Gegenwärtigen“; im zeitlichen Dreischritt mit Vergangenen und Zukünftigen ist „die jetzt leben“ im Deutschen klar und natürlich.
- source_word: qui praeterierunt
  choice: die, die dahingegangen sind
  rationale: praeterierunt kann allgemein „vergangen/vorübergegangen“ bedeuten und hier verstorbene frühere Menschen bezeichnen. „dahingegangen“ bewahrt diese zurückhaltende Ausdrucksweise.
- source_word: qui futuri sunt
  choice: die, die noch kommen werden
  rationale: Die Wendung bezeichnet zukünftige Menschen bzw. Generationen; die Übersetzung hält dies natürlich und ohne zusätzliche Deutung fest.
theological_decisions:
- issue: Reichweite der göttlichen Barmherzigkeit über Gegenwart, Vergangenheit und Zukunft
  choice: Die drei zeitlichen Gruppen werden vollständig und parallel wiedergegeben.
  alternative: Die Vergangenheit ausdrücklich auf „die Verstorbenen“ und die Zukunft auf „künftige Generationen“ festlegen.
  rationale: Der lateinische Text beschreibt eine umfassende zeitliche Reichweite, legt aber weder den Zustand der Vergangenen noch die genaue kollektive Bedeutung der Zukünftigen ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erweise seiner Barmherzigkeit“ vermeidet den im Deutschen unnatürlichen Plural „Barmherzigkeiten“, während die Wiederholung des lateinischen misericordia-Wortfeldes erhalten bleibt.
