  source_fidelity: 'Die Übersetzung gibt die Bildfolge des lateinischen Textes präzise wieder: das in den Menschen herangewachsene böse Herz, Entfremdung, Verderben, Wege des Todes, Pfade des Untergangs und die Entfernung vom Leben. Die textkritisch umstrittene Präpositionalphrase lateinisch „ab his“ wird nicht verschwiegen. Die Wahl „Gott“ im Text ist angesichts der in den alten Tochterversionen bezeugten Lesart „von ihm“ vertretbar; die Fußnote dokumentiert die abweichende lateinische Lesart angemessen.'
