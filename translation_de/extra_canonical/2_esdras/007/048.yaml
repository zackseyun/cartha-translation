  terminology: „Böses Herz“, „Wege des Todes“, „Pfade des Untergangs“ und „Leben“ bewahren die biblische Bild- und Begriffssprache. „Verderben“ ist für corruptionem möglich und wird sinnvoll von „Untergang“ für perditionis unterschieden.
