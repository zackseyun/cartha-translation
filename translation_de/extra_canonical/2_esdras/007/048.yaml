id: 2ES.7.48
reference: 2 Esdras 7:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: de
  text: Denn in uns ist ein böses Herz herangewachsen, das uns Gott entfremdet[a] und uns ins Verderben und auf die Wege des Todes geführt, uns die Pfade des Untergangs gezeigt und uns weit vom Leben entfernt hat – und dies nicht nur bei wenigen, sondern bei fast allen, die geschaffen worden sind.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lateinisch: „von diesen“; mehrere alte Übersetzungen bezeugen dagegen „von ihm“, das heißt: von Gott.'
    reason: Textkritisch bedeutsame Abweichung zwischen der lateinischen Überlieferung und mehreren alten Tochterversionen.
lexical_decisions:
- source_word: cor malum
  choice: ein böses Herz
  rationale: Die formnahe Wiedergabe bewahrt das biblisch-anthropologische Bild und deutet es nicht psychologisch oder dogmatisch aus.
- source_word: increuit ... in nos
  choice: ist in uns herangewachsen
  rationale: Gibt den Wachstumsvorgang des lateinischen Verbs und die innere Verortung natürlich wieder.
- source_word: corruptionem
  choice: Verderben
  rationale: Bezeichnet hier den Zustand beziehungsweise Bereich des Verfalls, ohne ihn auf körperliche Verwesung zu verengen.
- source_word: itinera mortis
  choice: die Wege des Todes
  rationale: Bewahrt die Wegmetaphorik und den Genitiv des Ausgangstextes.
- source_word: semitas perditionis
  choice: die Pfade des Untergangs
  rationale: Unterscheidet semitas von itinera und gibt perditionis in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: longe fecit nos a uita
  choice: uns weit vom Leben entfernt hat
  rationale: Formnahe und im Deutschen natürliche Wiedergabe der räumlichen Metapher.
theological_decisions:
- issue: Bezugswort von lateinisch „ab his“
  choice: Gott
  alternative: diesen Dingen
  rationale: Der überlieferte lateinische Text lautet zwar „ab his“ („von diesen“), doch die syrische, äthiopische, arabische und armenische Überlieferung stützt „von ihm“, womit im Zusammenhang Gott gemeint ist. Die Lesart wird im Text verwendet und die lateinische Abweichung transparent in der Fußnote dokumentiert.
- issue: Reichweite der Aussage über die Geschaffenen
  choice: fast alle, die geschaffen worden sind
  alternative: nahezu die gesamte Menschheit
  rationale: Die inklusive und spannungsreiche Aussage wird bewahrt, ohne „Geschaffene“ stillschweigend auf eine enger definierte Gruppe zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Wegmetaphorik und die anthropologische Bildsprache des Ausgangstextes bleiben erhalten; textkritische Unsicherheit wird nicht verschwiegen.
