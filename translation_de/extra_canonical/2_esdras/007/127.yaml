  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: de
  text: 'Und er antwortete und sagte: »Dies ist der Gedanke des Kampfes, den ein auf der Erde geborener Mensch gekämpft hat:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dies ist der Gedanke des Kampfes, den ein auf der Erde geborener Mensch kämpfen muss:«'
    reason: Die Alternative gibt die in der englischen Audit-Spur belegte modale Deutung wieder; der lateinische Wortlaut selbst hat mit certavit eine Vergangenheitsform.
lexical_decisions:
- source_word: cogitamentum
  choice: Gedanke
  rationale: Gibt den Grundsinn von cogitamentum wieder, ohne ihn deutend zu »Sinn« oder »Bedeutung« zu verengen.
- source_word: certaminis
  choice: des Kampfes
  rationale: Bewahrt die Kampfmetaphorik und die Genitivkonstruktion des lateinischen Textes.
- source_word: certavit
  choice: ausgefochten hat
  rationale: Entspricht der Vergangenheitsform des lateinischen Verbs und vermeidet im Deutschen die schwerfällige Wiederholung »den Kampf gekämpft hat«.
- source_word: homo
  choice: ein Mensch
  rationale: Homo ist hier generisch. Der unbestimmte Artikel verhindert, dass die Formulierung irrtümlich auf einen bestimmten Mann bezogen wird.
- source_word: super terram natus est
  choice: der auf der Erde geboren wurde
  rationale: Nahe Wiedergabe der lokalen Wendung und des Perfekt-Passivs.
theological_decisions:
- issue: Zeitform und mögliche modale Deutung von certavit
  choice: ausgefochten hat
  alternative: kämpfen muss
  rationale: Der überlieferte lateinische Text hat eine indikativische Vergangenheitsform, nicht ausdrücklich eine Verpflichtungsform. Die auslegungsgeschichtlich bekannte modale Wiedergabe bleibt deshalb nur als Fußnotenalternative erhalten.
- issue: Referenz von homo
  choice: ein Mensch
  alternative: der Mensch
  rationale: Die Aussage scheint allgemein vom irdisch geborenen Menschen zu sprechen; »ein Mensch« wahrt diesen generischen Sinn und vermeidet eine unbegründete Identifikation mit einer einzelnen Gestalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Wendung »Gedanke des Kampfes« bleibt bewusst nahe am lateinischen cogitamentum certaminis; die Doppelung der lateinischen Wortwurzel certamen/certavit wird durch das idiomatische »Kampf … ausgefochten« geglättet.
