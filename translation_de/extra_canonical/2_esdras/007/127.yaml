- from: 'Und er antwortete und sagte: »Dies ist der Gedanke des Kampfes, den ein Mensch, der auf der Erde geboren wurde, ausgefochten hat:[a]'
  to: 'Und er antwortete und sagte: »Dies ist der Gedanke des Kampfes, den ein auf der Erde geborener Mensch gekämpft hat:[a]'
