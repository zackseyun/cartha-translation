  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: de
  text: 'Doch zwischen ihnen liegt nur ein einziger Pfad – das heißt: zwischen dem Feuer und dem Wasser –, sodass der Pfad nur für den Fußabdruck eines Menschen Platz bietet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: Pfad
  rationale: „Pfad“ gibt den schmalen Weg natürlich und anschaulich wieder.
- source_word: una sola
  choice: nur ein einziger
  rationale: Bewahrt die doppelte Hervorhebung der Einzigkeit.
- source_word: inter eos posita
  choice: zwischen ihnen liegt
  rationale: Gibt die räumliche Lage idiomatisch wieder, ohne das im Deutschen schwerfällige „gelegt“ zu erzwingen.
- source_word: hoc est ignis et aqua
  choice: 'das heißt: zwischen dem Feuer und dem Wasser'
  rationale: Bewahrt die ausdrücklich erklärende Formel „hoc est“ und macht den Bezug von „ihnen“ im Deutschen grammatisch klar.
- source_word: ut non capiat ... nisi solummodo vestigium hominis
  choice: sodass der Pfad nur für den Fußabdruck eines Menschen Platz bietet
  rationale: Gibt die extreme Enge des Pfades natürlich wieder; „eines Menschen“ wahrt den generischen Sinn von „hominis“.
