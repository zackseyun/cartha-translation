id: 2ES.7.123
reference: 2 Esdras 7:123
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam ostendetur paradisus, cuius fructus incorruptus perseverat, in quo est saturitas et medella,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: de
  text: Und weil das Paradies gezeigt werden wird, dessen Frucht unvergänglich bleibt und in dem es Sättigung und Heilung gibt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: weil
  rationale: Gibt den kausalen Sinn der lateinischen Konjunktion wieder und vermeidet die sachlich unzutreffende Bedingung „wenn“.
- source_word: ostendetur
  choice: sichtbar werden wird
  rationale: Bewahrt das Futur und den passiven Offenbarungscharakter, klingt im modernen Deutschen jedoch natürlicher als „gezeigt werden wird“.
- source_word: paradisus
  choice: das Paradies
  rationale: Die etablierte und unmittelbar verständliche Entsprechung.
- source_word: fructus incorruptus perseverat
  choice: dessen Frucht unvergänglich bleibt
  rationale: „Unvergänglich“ erfasst incorruptus im eschatologischen Zusammenhang; „bleibt“ gibt perseverat knapp und natürlich wieder.
- source_word: saturitas
  choice: Sättigung
  rationale: Bewahrt den konkreten Sinn von Fülle beziehungsweise vollständigem Gestilltsein, ohne ihn nur abstrakt als „Fülle“ wiederzugeben.
- source_word: medella
  choice: Heilung
  rationale: Eine natürliche deutsche Wiedergabe für Heilung oder Heilmittel; der Zustand beziehungsweise die Gabe im Paradies steht hier im Vordergrund.
theological_decisions:
- issue: Art der künftigen Offenbarung des Paradieses
  choice: „sichtbar werden wird“
  alternative: „gezeigt werden wird“
  rationale: Die Formulierung lässt offen, wem oder durch wen das Paradies sichtbar gemacht wird, und fügt keinen ausdrücklich genannten Handelnden hinzu.
- issue: Bedeutung von saturitas
  choice: „Sättigung“
  alternative: „Fülle“
  rationale: „Sättigung“ hält den möglichen Bezug auf gestilltes Verlangen fest; „Fülle“ wäre idiomatischer, aber semantisch allgemeiner.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als mit „Und weil“ eingeleiteter Nebensatz offen, da er syntaktisch zum folgenden Zusammenhang gehört. Keine Fußnoten erforderlich.
