- issue: Umfang der Aussage über die Erschaffenen
  choice: fast alle
  alternative: beinahe alle
  rationale: »Fast alle« wahrt die ausdrückliche Einschränkung von »pene omnes«, ohne sie zu einer Aussage über ausnahmslos alle zu verschärfen.
