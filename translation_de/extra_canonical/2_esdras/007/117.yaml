source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: de
  text: Denn was nützt es allen, in der Gegenwart in Traurigkeit zu leben und als Tote Strafe zu erwarten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim prodest
  choice: Denn was nützt es
  rationale: Gibt die begründende Partikel „enim“ und die rhetorische Frage natürlich und eng am Lateinischen wieder.
- source_word: omnibus
  choice: allen
  rationale: Bewahrt den uneingeschränkten Dativ Plural, ohne ihn unnötig zu „allen Menschen“ zu erweitern.
- source_word: in praesenti
  choice: in der Gegenwart
  rationale: Erhält den eschatologisch bedeutsamen Gegensatz zwischen der gegenwärtigen Wirklichkeit und dem Kommenden deutlicher als das bloße „jetzt“.
- source_word: vivere in tristitia
  choice: in Traurigkeit zu leben
  rationale: Formale und zugleich natürliche Wiedergabe; „Traurigkeit“ lässt den Umfang des gemeinten Leids offen.
- source_word: mortuos sperare punitionem
  choice: als Tote Strafe zu erwarten
  rationale: Spiegelt den prädikativen Akkusativ „mortuos“ direkter als „nach dem Tod“ und erhält die auffällige Vorstellung, im Zustand des Totseins Strafe zu erwarten.
theological_decisions:
- issue: Zeitlicher beziehungsweise eschatologischer Sinn von „in praesenti“
  choice: in der Gegenwart
  alternative: jetzt
  rationale: Die gewählte Formulierung bewahrt den in 4 Esra wichtigen Kontrast der gegenwärtigen Ordnung mit der zukünftigen, ohne diesen ausdrücklich auszudeuten.
- issue: Bezug von „mortuos“ zur erwarteten Strafe
  choice: als Tote Strafe zu erwarten
  alternative: nach dem Tod Strafe zu erwarten
  rationale: Die engere Wiedergabe vermeidet eine stillschweigende Umformung des lateinischen Prädikativs in eine rein zeitliche Angabe und lässt die theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als zugespitzte rhetorische Frage knapp und bewahrt die leicht sperrige, theologisch bedeutsame Verbindung von gegenwärtiger Traurigkeit, Tod und erwarteter Strafe.
