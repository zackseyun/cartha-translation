  source_fidelity: Der Entwurf gibt die elliptische Reihung und die Grundbedeutungen von *pro confractione* sowie *pro eis qui in sanctificationem* insgesamt vorsichtig wieder. „Zerschlagung“ ist als wörtliche Wiedergabe von *confractio* vertretbar; die Fußnote wahrt die mögliche Anspielung auf Davids Plage, ohne sie in den Haupttext einzutragen. Für *sanctificationem* ist „Heiligung“ möglich, während die Fußnote die im Salomo-Kontext naheliegende Tempelweihe kenntlich macht.
  naturalness: „für die bei der Heiligung“ ist im modernen Standarddeutsch keine vollständige oder natürliche Nominalgruppe. Das lateinische *eis qui* verlangt im Deutschen zumindest „diejenigen“, sofern die Ellipse nicht durch eine stärker interpretierende Ergänzung aufgelöst werden soll.
  terminology: „Salomo“ und „Heiligung“ sind registergerecht. Die alternative Deutung „Weihe“ sollte als Fußnote verbleiben, da sie den historischen Bezug plausibel konkretisiert, aber über die knappe lateinische Formulierung hinausgeht.
