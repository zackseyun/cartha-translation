source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et David pro confractione, et Salomon pro eis qui in sanctificationem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/108.yaml
  text: and David for the destruction[a], and Solomon for those in sanctification,
translation:
  language: de
  text: und David wegen der Zerschlagung[a] und Salomo für diejenigen bei der Heiligung[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Zerbrechens«; möglicherweise ist die Plage zur Zeit Davids gemeint.'
    reason: Das lateinische *confractio* bezeichnet wörtlich ein Zerbrechen oder eine Zerschlagung, könnte hier aber auf ein bestimmtes Unglück anspielen.
  - marker: b
    text: 'Oder: »bei der Weihe«; wahrscheinlich ist die Einweihung des Tempels gemeint.'
    reason: Lateinisch *sanctificationem* kann sowohl „Heiligung“ als auch „Weihe“ bedeuten; die knappe Formulierung lässt den genauen Bezug offen.
lexical_decisions:
- source_word: confractione
  choice: Zerschlagung
  rationale: Gibt die Grundbedeutung von lateinisch confractio („Zerbrechen, Zerschlagung“) wieder, ohne sie kontextuell zu „Plage“ zu verengen.
- source_word: sanctificationem
  choice: Heiligung
  rationale: Bewahrt den Wortlaut und die Mehrdeutigkeit des lateinischen sanctificatio; im Zusammenhang mit Salomo kann insbesondere die Weihe des Tempels gemeint sein.
- source_word: pro
  choice: wegen / für
  rationale: Die jeweils kontextgerechte deutsche Wiedergabe erhält den Unterschied zwischen dem Anlass bei David und den Personen, für die Salomo eintrat.
theological_decisions:
- issue: Bedeutung von sanctificatio im Zusammenhang mit Salomo
  choice: Heiligung im Haupttext beibehalten
  alternative: Weihe
  rationale: „Weihe“ ist historisch plausibel, würde die mehrdeutige lateinische Formulierung jedoch eindeutiger auslegen, als der erhaltene Text erlaubt.
- issue: Bedeutung von confractio
  choice: Zerschlagung
  alternative: Plage
  rationale: „Plage“ könnte auf Davids Fürbitte in 2 Samuel 24 zielen, ist aber eine kontextuelle Identifizierung und nicht die unmittelbare Bedeutung des lateinischen Wortes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Reihung des lateinischen Fragments bleibt erhalten; interpretierende Glättungen werden in die Fußnoten verlegt.
