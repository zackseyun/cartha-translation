  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: periculum, uti perfecte custodirent legislatoris legem. Propter quod hic de his
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/090.yaml
  text: 'the danger, that they might perfectly keep the law of the Lawgiver. Therefore this is concerning them:'
translation:
  language: de
  text: 'die Gefahr, damit sie das Gesetz des Gesetzgebers vollkommen einhielten. Deshalb heißt es hier über sie:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: die Gefahr
  rationale: Gibt die Grundbedeutung des lateinischen Substantivs wieder und bewahrt den Anschluss an den vorausgehenden, hier nicht mitgelieferten Satzteil.
- source_word: custodirent
  choice: einhielten
  rationale: Bei einem Gesetz ist „einhalten“ im modernen Deutschen natürlicher als das wörtlichere „bewahren“, ohne den Sinn abzuschwächen.
- source_word: perfecte
  choice: vollkommen
  rationale: Bewahrt die ausdrückliche Intensivierung des lateinischen Textes.
- source_word: legislatoris legem
  choice: das Gesetz des Gesetzgebers
  rationale: Erhält die bewusste Wiederholung von Gesetz und Gesetzgeber, statt sie stilistisch zu glätten.
- source_word: Propter quod hic de his
  choice: 'Darum gilt für sie Folgendes:'
  rationale: Gibt die knappe, auf das Nachfolgende verweisende lateinische Wendung in verständlichem Deutsch wieder.
theological_decisions:
- issue: Zweck- oder Folgesinn von uti mit Konjunktiv
  choice: damit sie … einhielten
  alternative: sodass sie … einhielten
  rationale: Der Zweckbezug ist im Zusammenhang naheliegend; die Formulierung legt darüber hinaus keine besondere Lehrdeutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text beginnt absichtlich als Satzfragment, da auch der bereitgestellte lateinische Quellenausschnitt mit „periculum“ an einen vorausgehenden Satzteil anschließt.
