  text: and Hezekiah for the people in the days of Sennacherib, and many for many?
translation:
  language: de
  text: und Hiskia für das Volk in den Tagen Sanheribs und viele für viele?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ezechias
  choice: Hiskia
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform für den König von Juda.
- source_word: Sennacherib
  choice: Sanherib
  rationale: Die etablierte deutsche biblische Namensform.
- source_word: pro
  choice: für
  rationale: 'Bewahrt die knappe und im Zusammenhang bewusst offene Bedeutung: zugunsten des Volkes beziehungsweise in dessen Fürsprache.'
- source_word: multi pro multis
  choice: viele für viele
  rationale: Gibt die rhetorische Parallelität und die unbestimmte Mehrzahl des lateinischen Textes ohne erklärende Ergänzung wieder.
theological_decisions:
- issue: Art der Handlung Hiskias und der Vielen
  choice: Die elliptische Formulierung „für“ bleibt ohne ergänztes Verb stehen.
  alternative: „Fürsprache einlegten für“ oder „beteten für“
  rationale: Der Vers setzt offenbar ein Verb beziehungsweise eine Handlung aus dem Kontext voraus. Eine ausdrückliche Festlegung auf Fürbitte oder Gebet würde die im Wortlaut vorhandene Offenheit unnötig einschränken.
translation_notes:
  register: Knappe, rhetorische Fortsetzung einer Aufzählung. Die Frageform und die parallele Struktur des lateinischen Textes werden bewahrt; die Namen folgen dem üblichen modernen deutschen Bibelgebrauch.
