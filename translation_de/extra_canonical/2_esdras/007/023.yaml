source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et proposuerunt sibi circumventiones delictorum. et superdixeruntAltissimum non esse, et vias eius non cognoverunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/023.yaml
  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: de
  text: Sie ersannen Pläne für Verfehlungen, behaupteten sogar, der Höchste existiere nicht, und kannten seine Wege nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: proposuerunt sibi
  choice: legten sich … zurecht
  rationale: Gibt die reflexive Wendung natürlich wieder und bewahrt den Gedanken, dass sie sich selbst etwas vorsätzlich bereitstellten.
- source_word: circumventiones delictorum
  choice: Pläne zur Sünde
  rationale: Das seltene und mehrdeutige „circumventiones“ bezeichnet hier wohl listige Anschläge oder ausgeklügelte Vorhaben; „Pläne“ ist verständlich, ohne die Wendung unnötig festzulegen. „delictorum“ wird als Ziel beziehungsweise Inhalt der Pläne gefasst.
- source_word: superdixerunt
  choice: behaupteten sogar
  rationale: „sogar“ bildet die steigernde Kraft von „super-“ ab; „behaupteten“ passt idiomatisch zur folgenden Aussage über Gottes Nichtsein.
- source_word: Altissimum
  choice: der Höchste
  rationale: Traditionelle und zugleich verständliche Wiedergabe des göttlichen Titels.
- source_word: vias eius non cognoverunt
  choice: erkannten seine Wege nicht
  rationale: Bewahrt das biblische Bild der Wege und gibt „cognoverunt“ mit dem gehobenen, aber geläufigen „erkannten“ wieder.
theological_decisions:
- issue: Aussage über die Existenz des Höchsten
  choice: der Höchste existiere nicht
  alternative: es gebe den Höchsten nicht
  rationale: Der Konjunktiv der indirekten Rede macht deutlich, dass dies die Behauptung der Menschen ist, nicht die Aussage des Erzählers. „existiere“ entspricht dem lateinischen „non esse“ präzise.
- issue: Bedeutung von „seine Wege nicht erkennen“
  choice: Bildsprache unverändert bewahrt
  alternative: seinen Willen nicht verstanden
  rationale: Die Formulierung kann Unkenntnis, fehlendes Verständnis oder verweigerte Anerkennung umfassen; eine Auflösung zu „Willen“ würde diese Spannung einengen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur wurde für flüssiges Deutsch gestrafft; die dreifache Abfolge vorsätzlicher Sünde, Gottesleugnung und fehlender Gotteserkenntnis bleibt erhalten.
