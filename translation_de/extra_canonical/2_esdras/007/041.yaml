  source_fidelity: 'Die Übersetzung gibt sämtliche im zugeordneten lateinischen Vers enthaltenen Elemente in der richtigen Reihenfolge wieder: aerem, tenebras, sero, mane, aestatem, ver, aestum, hiemem, gelu, frigus und das am Zeilenumbruch fortzusetzende grandinem. Insbesondere sind „Luft“ und „Hagel“ vorhanden; Regen und Tau, die erst zum folgenden Vers gehören, werden nicht vorgezogen.'
  naturalness: Die wiederholte weder–noch-Konstruktion ist im Deutschen klar, idiomatisch und für eine feierliche Aufzählung angemessen. „Finsternis“ passt gut zum biblischen Register, ohne unverständlich altertümlich zu wirken. Das abschließende Komma ist sachgerecht, da die Aufzählung in Vers 42 fortläuft.
  terminology: „Frost“ für gelu und „Kälte“ für frigus erhält die im Lateinischen angelegte Unterscheidung. „Hitze“ für aestum sowie „Abend“ und „Morgen“ für sero und mane sind kontextgerecht. Es sind keine theologischen Fachbegriffe oder Namensformen betroffen.
