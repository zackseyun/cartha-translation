id: 2ES.7.46
reference: 2 Esdras 7:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: de
  text: Glücklich sind die, die jetzt leben und sich an das halten, was du festgesetzt hast. Doch was jene betrifft, für die ich gebetet habe:[a] Wer von den jetzt Lebenden hat denn nicht gesündigt, und welcher Mensch ist je geboren worden, ohne deinen Bund zu übertreten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische de („für/über die“) ist in der Ausgabe als textkritisch unsicher gekennzeichnet.
    reason: Die eckigen Klammern in „[de] quibus“ zeigen eine editorisch unsichere Lesart an; die Fußnote bewahrt diese textliche Unsicherheit.
  - marker: b
    text: Der hier bereitgestellte lateinische Ausschnitt bricht nach „oder welcher Geborene“ ab. Die abschließenden Worte werden nach der im englischen Konsultationstext erhaltenen Fortsetzung wiedergegeben.
    reason: Macht transparent, dass der vollständige Schluss nicht im vorgelegten lateinischen Textausschnitt steht.
lexical_decisions:
- source_word: beati
  choice: Glücklich
  rationale: Gibt die Seligpreisung natürlich und würdevoll wieder, ohne einen späteren fachtheologischen Sinn aufzudrängen.
- source_word: praesentes / de praesentibus
  choice: die jetzt leben / von den jetzt Lebenden
  rationale: Im Zusammenhang bezeichnet praesentes nicht bloß räumlich Anwesende, sondern die gegenwärtig Lebenden; die leicht unterschiedliche Formulierung vermeidet im Deutschen eine steife Wiederholung.
- source_word: obseruantes
  choice: sich an das halten
  rationale: Natürliches modernes Deutsch für das sorgfältige Befolgen göttlicher Festsetzungen.
- source_word: quae a te constituta sunt
  choice: was du festgesetzt hast
  rationale: Bewahrt die Passivkonstruktion und den umfassenden Bezug, ohne das Gemeinte vorschnell auf Gebote oder Gesetze einzuengen.
- source_word: oratio mea
  choice: ich gebetet habe
  rationale: Im Kontext ist oratio eine an Gott gerichtete Bitte; die verbale Wiedergabe klingt im Deutschen natürlicher als „mein Gebet war“.
- source_word: quis natus
  choice: welcher Mensch ist je geboren worden
  rationale: Entfaltet den knappen lateinischen Ausdruck idiomatisch und bewahrt seine universale Aussage.
- source_word: praeteriit pactum tuum (in der konsultierten Fortsetzung vorausgesetzt)
  choice: deinen Bund zu übertreten
  rationale: „Den Bund übertreten“ erhält die Bundesmetaphorik und die Aussage schuldhaften Zuwiderhandelns.
theological_decisions:
- issue: Reichweite der Aussage über menschliche Sünde
  choice: Als rhetorische Universalfrage wiedergegeben
  alternative: Als ausdrückliche dogmatische Feststellung formulieren
  rationale: Der Text fragt rhetorisch, wer nicht gesündigt habe; die Übersetzung bewahrt diese Form und verstärkt sie nicht zu einer systematischen Lehrformel.
- issue: Bedeutung von constituta
  choice: Allgemein mit „was du festgesetzt hast“
  alternative: „deine Gebote“ oder „dein Gesetz“
  rationale: Die allgemeinere Wiedergabe vermeidet eine nicht ausdrücklich im Ausgangstext enthaltene theologische Präzisierung.
- issue: Ergänzung am Ende des bereitgestellten lateinischen Ausschnitts
  choice: Die im englischen Konsultationstext bezeugte Fortsetzung wird übersetzt und kenntlich gemacht
  alternative: Den Satz nach „geboren worden“ abbrechen lassen
  rationale: Der bereitgestellte lateinische Wortlaut bricht syntaktisch nach „vel quis natus“ ab. Die Fortsetzung ist für den vollständigen Vers im auditierten Konsultationstext überliefert, wird aber wegen des unvollständigen hier vorgelegten lateinischen Ausschnitts transparent markiert.
translation_notes:
  register: 'Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Bewegung bleibt erhalten: zunächst die Seligpreisung der Gehorsamen, dann die spannungsvolle Frage nach der allgemeinen menschlichen Sündhaftigkeit. Keine konfessionell geprägte Terminologie wurde ergänzt.'
