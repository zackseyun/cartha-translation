source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi : dominator domine, quod abundat uilius, quod enim rarius pretiosius est.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: de
  text: 'Und ich sagte: „Gebieter, Herr,[a] was reichlich vorhanden ist, ist weniger wert;[b] denn was seltener ist, ist kostbarer.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrscher, Herr“.'
    reason: dominator domine ist eine doppelte Anrede aus zwei Titeln.
  - marker: b
    text: 'Oder: „ist billiger“.'
    reason: Das lateinische uilius kann je nach Kontext geringeren Wert oder einen niedrigeren Preis bezeichnen.
lexical_decisions:
- source_word: dominator domine
  choice: Herr, du Herrscher
  rationale: Die doppelte Anrede wird vollständig bewahrt, aber in eine natürliche und würdevolle deutsche Wortstellung gebracht.
- source_word: quod abundat
  choice: was reichlich vorhanden ist
  rationale: Gibt abundat als vorhandene Fülle oder Häufigkeit wieder, ohne einen rein wirtschaftlichen Sinn festzulegen.
- source_word: uilius
  choice: weniger wert
  rationale: Bewahrt den vergleichenden Wertbegriff und passt zum Gegenbegriff pretiosius; die mögliche Bedeutung „billiger“ wird in einer Fußnote genannt.
- source_word: quod enim rarius pretiosius est
  choice: denn was seltener ist, ist kostbarer
  rationale: Gibt die vergleichende Gegenüberstellung von rarius und pretiosius eng und idiomatisch wieder.
theological_decisions:
- issue: Gottes Anrede mit zwei Titeln
  choice: Herr, du Herrscher
  alternative: Herrscher, Herr; Gebieter, Herr
  rationale: Die beiden lateinischen Vokative werden nicht zu einem einzigen Titel verschmolzen; zugleich vermeidet die Formulierung eine im Deutschen abgehackte Anrede.
- issue: Art des Wertes in uilius/pretiosius
  choice: 'allgemeiner Wertbegriff: weniger wert/kostbarer'
  alternative: 'wirtschaftlicher Preisbegriff: billiger/teurer'
  rationale: Der Kontext formuliert einen allgemeinen Vergleich zwischen Fülle und Seltenheit. Daher wird die mögliche wirtschaftliche Nuance nicht zum alleinigen Sinn gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller biblischer Anrede. Der sentenzartige Parallelismus und die vergleichende Spannung zwischen reichlichem und seltenem Vorkommen bleiben erhalten.
