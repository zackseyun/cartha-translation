  yaml_path: translation/extra_canonical/2_esdras/007/134.yaml
  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: de
  text: und langmütig, weil er denen, die gesündigt haben, Langmut erweist wie seinen eigenen Werken,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimis / longanimitatem
  choice: langmütig / Langmut
  rationale: Die Wortwiederholung des lateinischen Ausgangstextes bleibt erhalten; „Langmut“ bezeichnet geduldiges Zurückhalten von Zorn oder Strafe.
- source_word: praestat
  choice: erweist
  rationale: Gibt das Gewähren beziehungsweise Entgegenbringen von Langmut in natürlichem Deutsch wieder.
- source_word: quasi suis operibus
  choice: wie seinen eigenen Werken
  rationale: Bewahrt den knappen Vergleich und die genuine Offenheit von „quasi“, ohne seine Beziehung zu den Sündern näher auszudeuten.
theological_decisions:
- issue: Beziehung der Sünder zu Gottes Werken
  choice: wie seinen eigenen Werken
  alternative: als wären sie seine eigenen Werke
  rationale: Die gewählte Formulierung folgt der Vergleichsstruktur des Lateinischen und vermeidet es, „quasi“ als bloß irrealen Vergleich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die partizipiale Anschlussform und das abschließende Komma wurden beibehalten, da der Vers ein Satzglied innerhalb einer fortlaufenden Aufzählung bildet.
