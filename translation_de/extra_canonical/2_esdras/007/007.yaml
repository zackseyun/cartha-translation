  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: de
  text: Doch sein Eingang ist eng und liegt an einem steilen Abhang, sodass rechts Feuer und links tiefes Wasser sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: Eingang
  rationale: Die direkte und im Deutschen natürliche Entsprechung im Bild eines schwer zugänglichen Weges.
- source_word: angustus
  choice: eng
  rationale: Bewahrt die räumliche Enge des lateinischen Ausdrucks knapp und eindeutig.
- source_word: in praecipiti positus
  choice: an einem steilen Abhang liegt
  rationale: Gibt die gefährliche Lage an einem Steilhang idiomatisch wieder, ohne das Bild zu erweitern.
- source_word: aqua alta
  choice: tiefes Wasser
  rationale: Lateinisch alta kann bei Wasser die große Tiefe bezeichnen; „tiefes Wasser“ ist hier die natürliche deutsche Wiedergabe.
