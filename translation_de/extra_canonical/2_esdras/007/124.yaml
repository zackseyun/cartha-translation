source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos vero non ingrediemur, ingratis enim locis conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/124.yaml
  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: de
  text: Wir aber werden nicht eingehen, weil wir an unwirtlichen[a] Orten gelebt haben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unangenehmen, unwillkommenen; lateinisch ingratis.'
    reason: Das lateinische ingratis hat ein Bedeutungsspektrum von „unangenehm“ und „unwillkommen“ bis wörtlich „undankbar“. Bei Orten ist „unwirtlich“ im Deutschen am natürlichsten, doch die lexikalische Mehrdeutigkeit soll sichtbar bleiben.
lexical_decisions:
- source_word: ingrediemur
  choice: werden … eingehen
  rationale: Gibt das lateinische Futur von ingredi wieder, ohne ein im Ausgangstext nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: ingratis locis
  choice: an unwirtlichen Orten
  rationale: Ingratus bezeichnet hier am natürlichsten etwas Unangenehmes, Unwillkommenes oder wenig Einladendes. „Unwirtlich“ bewahrt im Deutschen den Ortsbezug und vermeidet die sachlich irreführende moralische Wertung „schändlich“.
- source_word: conversati sumus
  choice: gelebt haben
  rationale: Das Perfekt von conversari bezeichnet den bisherigen Aufenthalt beziehungsweise die Lebensführung an diesen Orten; „gelebt haben“ ist klar und idiomatisch.
theological_decisions:
- issue: Unausgesprochenes Ziel von ingrediemur
  choice: 'Kein Objekt ergänzt: „eingehen“'
  alternative: „dort hineingehen“ oder „in die kommende Welt eingehen“
  rationale: Der lateinische Satz nennt das Ziel nicht ausdrücklich. Die Übersetzung bewahrt diese kontextuell zu erschließende Offenheit.
- issue: Fragecharakter des Satzes
  choice: Als rhetorische Frage beibehalten
  alternative: Als Aussagesatz wiedergeben
  rationale: Das überlieferte Fragezeichen und der Gedankengang verlangen eine fragende Wiedergabe; die Spannung der Argumentation wird nicht aufgelöst.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche Begründung und die rhetorische Spannung des lateinischen Satzes bleiben erhalten; weder ein Ziel des Eingehens noch eine moralische Verurteilung der Orte wird ergänzt.
