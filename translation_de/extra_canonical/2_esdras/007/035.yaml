source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: de
  text: Und das Werk wird folgen, und der Lohn wird sichtbar werden. Die gerechten Taten werden wachen, und die ungerechten Taten werden nicht schlafen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: das Werk
  rationale: Bewahrt den singularischen, umfassenden Ausdruck des lateinischen Textes; gemeint sein kann das vollbrachte Werk beziehungsweise Tun, ohne dies enger festzulegen.
- source_word: subsequetur
  choice: wird folgen
  rationale: Gibt die zeitliche beziehungsweise folgerichtige Bewegung des Futurs direkt wieder.
- source_word: merces
  choice: der Lohn
  rationale: Entspricht dem gerichtlichen Zusammenhang von Vergeltung oder Entgelt, ohne den Ausgang bereits als Belohnung oder Strafe festzulegen.
- source_word: ostendetur
  choice: wird sichtbar werden
  rationale: Natürliches Deutsch für das passive 'wird gezeigt/offenbar gemacht werden' und betont das Hervortreten des Lohns.
- source_word: iustitiae
  choice: die gerechten Taten
  rationale: Der abstrakte Plural bezeichnet hier am natürlichsten konkrete Erweise beziehungsweise Taten der Gerechtigkeit; die parallele Wiedergabe erhält die Bildsprache.
- source_word: vigilabunt
  choice: werden wachen
  rationale: Bewahrt die Personifikation und die Bedeutung des Wachseins beziehungsweise Wachens genauer als 'erwachen'.
- source_word: iniustitiae
  choice: die ungerechten Taten
  rationale: Gibt den parallelen abstrakten Plural konkret und verständlich wieder, ohne ihn auf einzelne Arten des Unrechts zu beschränken.
- source_word: non dormibunt
  choice: werden nicht schlafen
  rationale: Erhält die ausdrückliche Gegenüberstellung zu 'werden wachen' und die personifizierende Gerichtssprache.
theological_decisions:
- issue: Art und Richtung des Lohns
  choice: der Lohn
  alternative: die Vergeltung
  rationale: Das lateinische merces kann Entgelt, Lohn oder Vergeltung bezeichnen. 'Lohn' wahrt die Offenheit, ob das Ergebnis günstig oder ungünstig ist.
- issue: Personifikation der Taten im Gericht
  choice: Die gerechten Taten werden wachen, und die ungerechten Taten werden nicht schlafen.
  alternative: Die Gerechtigkeit wird wach sein, und die Ungerechtigkeit wird nicht schlafen.
  rationale: Der Plural iustitiae/iniustitiae und der Parallelismus sprechen für konkrete Erweise oder Taten. Die auffällige Personifikation wird nicht erklärend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst engem Parallelismus. Keine Fußnoten erforderlich; die genuine Bildsprache des Wachens und Nichtschlafens bleibt im Haupttext erhalten.
