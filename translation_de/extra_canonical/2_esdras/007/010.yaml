  text: And I said[a], “So it is, Lord.” And he said to me, “So also is Israel’s portion.”
translation:
  language: de
  text: 'Und ich sagte: »So ist es, Herr.« Da sagte er zu mir: »So ist auch Israels Anteil.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic
  choice: so
  rationale: Gibt die wiederholte lateinische Formulierung knapp und unmittelbar wieder und bewahrt den Rückbezug auf das zuvor Gesagte.
- source_word: domine
  choice: Herr
  rationale: Natürliche und würdevolle deutsche Anredeform; die Großschreibung entspricht dem üblichen Gebrauch als direkte Anrede.
- source_word: pars
  choice: Anteil
  rationale: Trifft hier den Israel zukommenden Teil beziehungsweise das ihm bestimmte Los, ohne die Aussage unnötig auszudeuten.
theological_decisions:
- issue: Bedeutung von »sic est et Israhel pars«
  choice: »So ist auch Israels Anteil.«
  alternative: »So verhält es sich auch mit Israels Anteil.«
  rationale: Die gewählte Fassung bewahrt die knappe, bildhafte Aussage des Lateinischen und legt nicht fest, in welchem genauen Sinn der Anteil Israels dem zuvor Beschriebenen entspricht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »so« bildet die knappe Parallelstruktur des lateinischen Textes ab.
