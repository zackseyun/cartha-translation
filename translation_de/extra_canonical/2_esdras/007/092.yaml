id: 2ES.7.92
reference: 2 Esdras 7:92
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: de
  text: 'Die erste Ordnung: Sie haben unter großen Mühen darum gekämpft, den bösen Gedanken zu überwinden, der mit ihnen gebildet wurde, damit er sie nicht vom Leben in den Tod verleitet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ordo primus
  choice: Die erste Ordnung
  rationale: Bewahrt die Gliederung der sieben »ordines« und gibt den Ausdruck in natürlichem, zugleich würdevollem Deutsch wieder.
- source_word: cum labore multo certati sunt
  choice: Sie haben unter großen Mühen darum gekämpft
  rationale: Gibt sowohl die Anstrengung (labore multo) als auch den aktiven Kampf (certati sunt) wieder.
- source_word: uincerent
  choice: zu überwinden
  rationale: Entspricht dem Ziel des Kampfes, ohne die Aussage durch eine stärkere Deutung wie »vernichten« zu verschärfen.
- source_word: cum eis plasmatum cogitamentum malum
  choice: den bösen Gedanken …, der mit ihnen Gestalt angenommen hat
  rationale: Bewahrt die auffällige Verbindung von plasmatum und cum eis, vermeidet aber die im Deutschen missverständliche Formulierung »mit ihnen geschaffen«, die ausdrücklich einen Schöpfer des Bösen nahelegen könnte.
- source_word: a uita in mortem
  choice: vom Leben weg in den Tod
  rationale: Erhält die gerichtete Bewegung vom Leben zum Tod.
theological_decisions:
- issue: Ursprung und Verhältnis des bösen Gedankens zum Menschen
  choice: »der mit ihnen Gestalt angenommen hat«
  alternative: »der mit ihnen geschaffen wurde« oder »der in ihnen entstand«
  rationale: Die Formulierung bewahrt das lateinische cum eis und plasmatum, ohne festzulegen, ob der Gedanke als mitgeschaffen, angeboren oder später innerlich entstanden zu verstehen ist.
- issue: Wirkung des bösen Gedankens
  choice: »damit er sie nicht vom Leben weg in den Tod führt«
  alternative: »damit er sie nicht vom Leben zum Tod verführt«
  rationale: »führt« wahrt die Bewegungsaussage und vermeidet es, die Art der Einwirkung unnötig auf Verführung einzuengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe an der lateinischen Begründungsfolge, wird jedoch für einen natürlichen deutschen Lesefluss leicht geglättet. Der vorangestellte Satz »requiescent enim per septem ordines« wird entsprechend der überlieferten Versabgrenzung und der auditierten englischen Konsultationsfassung nicht in 7,92 aufgenommen.
