revisions:
- from: 'Die erste Ordnung: Sie haben unter großen Mühen darum gekämpft, den bösen Gedanken zu überwinden, der mit ihnen Gestalt angenommen hat, damit er sie nicht vom Leben weg in den Tod führt.'
  to: 'Die erste Ordnung: Sie haben unter großen Mühen darum gekämpft, den bösen Gedanken zu überwinden, der mit ihnen gebildet wurde, damit er sie nicht vom Leben in den Tod verleitet.'
  rationale: 'Die Revision bewahrt die auffällige und auslegungsbedürftige Aussage cum eis plasmatum, ohne ihren ontologischen Sinn weiter festzulegen: „mit ihnen gebildet wurde“ bleibt näher an der passivischen Form von plasmatum. „Verleitet“ gibt die negative Bewegungsrichtung von Leben zu Tod präziser wieder. Die knappe Überschrift und der moderne, würdige Stil bleiben erhalten.'
