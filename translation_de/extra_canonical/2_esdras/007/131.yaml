id: 2ES.7.131
reference: 2 Esdras 7:131
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: de
  text: Denn über ihren Untergang sollte keine Trauer herrschen, ebenso wie Freude über jene sein wird, denen das Heil zugesichert ist.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: Denn
  rationale: Gibt die begründende Konjunktion wieder; ein folgerndes „daher“ wäre nicht quellengerecht.
- source_word: non esset tristitia
  choice: sollte keine Trauer herrschen
  rationale: Bewahrt den Konjunktiv von esset und formuliert zugleich natürlich auf Deutsch.
- source_word: in perditione eorum
  choice: über ihren Untergang
  rationale: Das lateinische in bezeichnet hier den Anlass beziehungsweise Gegenstand der Trauer; „Untergang“ wahrt die eschatologische Schärfe von perditio.
- source_word: sicut et futurum est gaudium super eos
  choice: ebenso wie Freude über jene sein wird
  rationale: Spiegelt den Vergleich und das ausdrücklich zukünftige futurum est; super eos wird idiomatisch mit „über jene“ wiedergegeben.
- source_word: quibus persuasa est salus
  choice: denen das Heil zugesichert ist
  rationale: Persuasa est mit Dativ drückt hier aus, dass das Heil den Betreffenden glaubhaft gemacht beziehungsweise verbürgt ist. „Zugesichert“ ist natürlicher und näher als ein unidiomatisches „überredet“; „versprochen“ wäre möglich, aber stärker auf einen Sprechakt festgelegt.
theological_decisions:
- issue: Art und Gewissheit des Heils in persuasa est salus
  choice: denen das Heil zugesichert ist
  alternative: denen das Heil verheißen worden ist
  rationale: „Zugesichert“ bewahrt die Bedeutung von Gewissheit beziehungsweise glaubhafter Versicherung, ohne einen ausdrücklichen Verheißungsakt in den Text einzutragen.
- issue: Modalität der ausbleibenden Trauer
  choice: sollte keine Trauer herrschen
  alternative: würde keine Trauer herrschen
  rationale: Der lateinische Konjunktiv esset wird sichtbar gehalten. „Sollte“ entspricht der unmittelbaren Quellenform und vermeidet, sie stillschweigend zum einfachen Futur zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur zwischen ausbleibender Trauer und künftiger Freude bleibt erhalten; die etwas markierte Modalität des lateinischen Konjunktivs wird nicht eingeebnet.
