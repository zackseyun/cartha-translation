  text: and compassionate, because he shows compassion to those who turn back to his law,
translation:
  language: de
  text: und barmherzig, weil er sich über die erbarmt, die zu seinem Gesetz umkehren,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miserator / miseretur
  choice: barmherzig / sich erbarmen
  rationale: Die verwandten deutschen Ausdrücke bewahren die bewusste Wiederholung des lateinischen Wortstamms und geben sowohl die Eigenschaft als auch das Handeln wieder.
- source_word: conversionem faciunt
  choice: umkehren
  rationale: Die Wendung bezeichnet eine Umkehr beziehungsweise Hinwendung; „umkehren“ ist im Deutschen natürlich und wahrt den Gedanken einer Richtungsänderung.
- source_word: in lege eius
  choice: zu seinem Gesetz
  rationale: Bei einer Umkehr ist „zu“ idiomatisch und entspricht dem Sinn der Hinwendung zum Gesetz, ohne zusätzliche Auslegung einzutragen.
theological_decisions:
- issue: Verhältnis von Umkehr und göttlichem Erbarmen
  choice: 'Die Begründungsstruktur bleibt ausdrücklich erhalten: Er erbarmt sich derer, die umkehren.'
  alternative: Die Aussage allgemeiner als bedingungslose Barmherzigkeit formulieren.
  rationale: Der lateinische Text verbindet das Erbarmen ausdrücklich mit denen, die zu seinem Gesetz umkehren; diese Spannung darf nicht eingeebnet werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung „barmherzig … erbarmt“ bildet die lateinische Wortfigur ab. Das abschließende Komma bleibt stehen, da der Vers als Teil einer fortlaufenden Aufzählung überliefert ist.
