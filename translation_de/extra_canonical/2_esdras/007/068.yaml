  source_fidelity: Der deutsche Text gibt die rhetorische Frage „quid prodest … si …?“ sowie die drei Prädikationen über alle Geborenen vollständig wieder. „gerettet werden“ und „Qualen erleiden werden“ geben die Zukunftsaussagen ohne unbelegte Verstärkung wieder. „mit Ungerechtigkeiten vermengt“, „voller Sünden“ und „mit Verfehlungen beladen“ entsprechen conmixti, pleni und gravidi angemessen.
  naturalness: Modernes, verständliches Standarddeutsch mit einem würdigen Register. Die Satzfügung ist klar; die dreigliedrige Aufzählung ist gut lesbar und bewahrt die rhetorische Dichte des Ausgangstextes.
