id: 2ES.7.68
reference: 2 Esdras 7:68
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: de
  text: Was nützt es, dass wir gerettet werden, wenn wir Qualen erleiden werden? Denn alle, die geboren sind, sind mit Ungerechtigkeiten vermengt, voller Sünden und mit Verfehlungen beladen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid prodest
  choice: Was nützt es
  rationale: Gibt die rhetorische Frage knapp und idiomatisch wieder.
- source_word: salutati saluabimur
  choice: dass wir gerettet werden
  rationale: Folgt dem bereinigten lateinischen Sinn, wobei salutati als Überlieferungsvariante zu salvati verstanden wird; eine im Lateinischen nicht eindeutig ausgedrückte Verstärkung wird nicht ergänzt.
- source_word: tormento tormentabimur
  choice: Qualen erleiden werden
  rationale: Natürliches, würdevolles Deutsch für die etymologische Wiederholung; vermeidet eine unbelegte Intensivierung wie »schwer«.
- source_word: conmixti sunt iniquitatibus
  choice: sind mit Ungerechtigkeiten vermengt
  rationale: Bewahrt das konkrete Bild von conmixti und den Plural iniquitatibus, ohne es deutend zu »verstrickt« umzudeuten.
- source_word: grauidi delictis
  choice: mit Verfehlungen beladen
  rationale: Erhält das Bild moralischer Last und passt zum feierlichen apokalyptischen Register.
theological_decisions:
- issue: Verhältnis von Rettung und Qual
  choice: Die Spannung bleibt in der rhetorischen Frage unvermittelt stehen.
  alternative: Die Rettung zeitlich, bedingt oder nur scheinbar zu erklären.
  rationale: Der lateinische Text erläutert nicht, wie Rettung und Qual zueinander stehen; eine konfessionelle oder systematische Auflösung wäre interpretierende Ergänzung.
- issue: Mögliche Verstärkung durch salutati saluabimur und tormento tormentabimur
  choice: Keine zusätzlichen Adverbien wie »gewiss« oder »schwer«.
  alternative: »gewiss gerettet« und »schwer gequält«
  rationale: Die vorliegende lateinische Form lässt solche Intensivierungen nicht sicher erkennen; die Übersetzung wahrt daher die belegte Aussage ohne semitische Rückübersetzung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die dreigliedrige Beschreibung menschlicher Schuld bleibt erhalten; »Ungerechtigkeiten«, »Sünden« und »Verfehlungen« werden lexikalisch unterschieden.
