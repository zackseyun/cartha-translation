source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: de
  text: 'Und er antwortete mir und sagte: »Als der Höchste die Welt erschuf, bereitete er zuerst das Gericht und alles, was zum Gericht gehört, für Adam und alle vor, die mit ihm kamen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von ihm kamen.'
    reason: Gibt die im englischen Audit Trail ausgewiesene alternative Lesart („from him“) knapp wieder, während der Haupttext dem lateinischen „cum eo“ („mit ihm“) folgt.
lexical_decisions:
- source_word: saeculum
  choice: die Welt
  rationale: Im Schöpfungszusammenhang bezeichnet das lateinische „saeculum“ hier die geschaffene Welt bzw. Weltzeit; „Welt“ ist im Deutschen natürlich und wahrt den kosmischen Bezug.
- source_word: iudicium
  choice: das Gericht
  rationale: „Gericht“ gibt den rechtlich-eschatologischen Sinn von „iudicium“ direkt und würdig wieder.
- source_word: quae sunt iudicii
  choice: alles, was zum Gericht gehört
  rationale: Die lateinische Genitivwendung wird verständlich wiedergegeben, ohne ihren bewusst umfassenden Charakter unnötig einzuengen.
- source_word: cum eo uenerunt
  choice: die mit ihm kamen
  rationale: Dies entspricht unmittelbar dem lateinischen „cum eo“ und vermeidet die unbelegte Umdeutung zu „von ihm abstammten“.
theological_decisions:
- issue: Beziehung Adams zu den übrigen Menschen
  choice: mit ihm kamen
  alternative: von ihm abstammten
  rationale: Der lateinische Grundtext sagt ausdrücklich „cum eo“ („mit ihm“). Die genealogisch plausiblere Alternative darf nicht stillschweigend in den Haupttext eingetragen werden.
- issue: Bedeutung von „saeculum“
  choice: Welt
  alternative: Zeitalter
  rationale: Das Verb des Erschaffens legt hier „Welt“ nahe; „Zeitalter“ bleibt lexikalisch möglich, wäre im modernen Deutsch in diesem Satz jedoch weniger natürlich und könnte den Schöpfungsbezug verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die schwerfällige lateinische Figura etymologica „faciens faciebat“ wird idiomatisch mit „erschuf“ wiedergegeben; die Satzstellung verdeutlicht, dass „für Adam und alle …“ zu „bereitete“ gehört.
