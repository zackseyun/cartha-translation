source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: de
  text: die sie verachtet haben, und rechne dich nicht zu denen, die gequält werden. Denn beim Höchsten ist für dich ein Schatz an Werken hinterlegt; doch er wird dir bis in die letzten Zeiten nicht gezeigt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speruerunt
  choice: sie verachtet haben
  rationale: Das lateinische Verb spernere bezeichnet ein verächtliches Zurückweisen oder Missachten. Die Formulierung bleibt als Relativsatzfragment erhalten, weil der Vers im überlieferten Text an den vorherigen Satz anschließt.
- source_word: connumeres
  choice: rechne dich ... zu
  rationale: Gibt das Einordnen beziehungsweise Mitzählen unter einer Gruppe natürlich und genau wieder.
- source_word: cruciantur
  choice: gequält werden
  rationale: Bewahrt den passiven Vorgang andauernder Qual, ohne die Art der Pein näher festzulegen.
- source_word: thesaurus operum
  choice: ein Schatz an Werken
  rationale: Gibt die konkrete Schatzmetapher wieder; »Werke« bleibt offen für die im Kontext gemeinten Taten.
- source_word: repositus apud Altissimum
  choice: beim Höchsten ... hinterlegt
  rationale: »Hinterlegt« drückt das sichere Aufbewahren aus; »beim Höchsten« folgt apud und bezeichnet den Ort beziehungsweise Gewahrsam.
- source_word: nouissimis
  choice: den letzten Zeiten
  rationale: Der substantivierte Plural ist elliptisch. Im Kontext ist die zeitliche Deutung naheliegend; »Zeiten« wird entsprechend der englischen Konsultationsfassung ergänzt.
theological_decisions:
- issue: Bedeutung des Schatzes der Werke
  choice: ein Schatz an Werken
  alternative: ein Schatz guter Werke / ein Lohn für deine Werke
  rationale: Der Text spricht von operum, nicht ausdrücklich von guten Werken oder einem daraus abgeleiteten Lohn. Die Metapher und ihre theologische Spannung bleiben daher erhalten.
- issue: Zeitpunkt der Offenbarung
  choice: bis zu den letzten Zeiten
  alternative: bis zum Letzten / bis ans Ende
  rationale: Die zeitliche Lesart passt zum eschatologischen Kontext, ohne einen einzelnen Endzeitpunkt genauer zu bestimmen, als es die elliptische lateinische Form erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der anfängliche Relativsatz ist bewusst als syntaktischer Anschluss an den vorherigen Vers bewahrt; die Versgrenze wirkt deshalb isoliert fragmentarisch. Keine konfessionell geprägte Ausdeutung von »Werken« oder »Schatz«.
