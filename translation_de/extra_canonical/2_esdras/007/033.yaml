source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: de
  text: Und der Höchste wird auf dem Richterstuhl offenbar werden; die Erbarmungen werden vergehen, und die Langmut wird gesammelt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird gesammelt werden“. Im Zusammenhang kann dies auch das Zurücknehmen oder Aufhören der Langmut andeuten.'
    reason: Bewahrt den Wortlaut von congregabitur im Haupttext und vermerkt die mögliche kontextuelle, privative Deutung, ohne sie als gesichert auszugeben.
lexical_decisions:
- source_word: revelabitur
  choice: wird offenbar werden
  rationale: Gibt das passive Futur wieder und bewahrt den Gedanken, dass der Höchste in Erscheinung tritt beziehungsweise sichtbar offenbar wird.
- source_word: super sedem iudicii
  choice: auf dem Richterstuhl
  rationale: Eine natürliche und zugleich formnahe Wiedergabe des Sitzes, von dem aus Gericht gehalten wird.
- source_word: misericordiae
  choice: die Erweise der Barmherzigkeit
  rationale: Bewahrt den lateinischen Plural sinngemäß, ohne das im heutigen Deutsch ungebräuchliche „Barmherzigkeiten“ zu verwenden.
- source_word: pertransibunt
  choice: werden vergehen
  rationale: Drückt hier das Vorübergehen beziehungsweise Aufhören der Erbarmungen im eschatologischen Gericht aus.
- source_word: longanimitas
  choice: die Langmut
  rationale: Entspricht dem theologischen und ethischen Sinn von geduldiger Nachsicht.
- source_word: congregabitur
  choice: wird zurückgenommen werden
  rationale: Das wörtliche „wird gesammelt werden“ dürfte eine semitisch geprägte Wendung für das Einziehen oder Zurücknehmen bezeichnen; die gewählte Form macht den Zusammenhang verständlich, während die Fußnote den Wortlaut offenlegt.
theological_decisions:
- issue: Ende der göttlichen Barmherzigkeit und Langmut im Gericht
  choice: Die zeitliche Gerichtsgegenüberstellung wird deutlich wiedergegeben, ohne eine allgemeine Aussage über Gottes Wesen daraus abzuleiten.
  alternative: „Barmherzigkeit und Langmut werden abgeschafft“
  rationale: Der Text beschreibt ihr Vergehen beziehungsweise Zurücknehmen in der Gerichtsszene; eine ontologische oder uneingeschränkt dauerhafte Abschaffung wäre stärker als die Quelle.
- issue: Bedeutung von congregabitur
  choice: „wird zurückgenommen werden“ im Haupttext, mit wörtlicher Alternative in der Fußnote
  alternative: „wird gesammelt werden“
  rationale: Die kontextuelle Bedeutung ist wahrscheinlich privativ, doch die ungewöhnliche Bildsprache des Lateinischen bleibt als echte sprachliche Spannung dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon gliedert die Offenbarung des Richters von den beiden parallelen Aussagen über das Ende von Barmherzigkeitserweisen und Langmut.
