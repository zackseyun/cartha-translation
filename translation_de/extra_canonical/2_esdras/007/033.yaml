  verdict: revise
  source_fidelity: Die Wiedergabe von revelabitur, super sedem iudicii, misericordiae und pertransibunt ist insgesamt quellentreu. Bei congregabitur geht der Haupttext mit „wird zurückgenommen werden“ über die explizite Aussage des lateinischen Textes hinaus. Die privative Deutung ist im Gerichtskontext möglich, aber die wörtliche Bildsprache sollte im Haupttext bewahrt werden.
  naturalness: Der Satz ist würdiges, modernes Standarddeutsch. „Erweise der Barmherzigkeit“ ist verständlich, jedoch etwas umständlich; „Erbarmungen“ bewahrt den Plural und klingt in diesem gehobenen Kontext natürlicher. „Wird gesammelt werden“ ist zwar markiert, aber verständlich und für die quellennähere Fassung vertretbar.
  terminology: „Der Höchste“, „Richterstuhl“ und „Langmut“ sind angemessen und registergerecht. Die Fußnote sollte die mögliche kontextuelle Deutung als Möglichkeit, nicht als gemeinte eindeutige Bedeutung formulieren.
  issues:
  - severity: medium
    issue: „wird zurückgenommen werden“ legt congregabitur im Haupttext einseitig privativ aus.
    rationale: Congregabitur bedeutet formal „wird gesammelt werden“. Zwar kann der Kontext ein Ende der Langmut nahelegen, doch diese weitergehende Deutung ist nicht im lateinischen Wortlaut selbst festgelegt und sollte daher als Fußnotenhinweis erscheinen.
  - severity: low
    issue: Die Fußnote behauptet mit „Gemeint ist wahrscheinlich“ eine semitische Erklärung relativ bestimmt.
    rationale: Eine semitisch geprägte idiomatische Vorgeschichte kann erwogen werden, ist für die Übersetzung des überlieferten lateinischen Textes aber nicht zwingend nachweisbar. Eine vorsichtigere Formulierung bewahrt die Auslegungsambiguität.
  revised_text: Und der Höchste wird auf dem Richterstuhl offenbar werden; die Erbarmungen werden vergehen, und die Langmut wird gesammelt werden.[a]
