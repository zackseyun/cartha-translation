    rationale: Es klingt vorrangig nach sieben räumlichen Routen. Der Kontext eröffnet sieben aufeinanderfolgend benannte Arten der Qual; „in siebenfacher Weise“ vermittelt diese Funktion klar und bewahrt die knappe, nicht weiter ausgedeutete Angabe.
  - severity: low
    issue: „in Behausungen eingehen“ wirkt archaisch.
    rationale: „In Behausungen eintreten“ ist modernes Standarddeutsch und gibt das Betreten der habitationes präzise wieder.
