  text: these spirits will not enter habitations[a], but will wander from now on in torments, always grieving and sad, in seven ways.
translation:
  language: de
  text: Diese Geister werden nicht in Behausungen eintreten[a], sondern von nun an unter Qualen umherirren, stets klagend und traurig, in siebenfacher Weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Solche Geister werden nicht in Behausungen eintreten, sondern von nun an unter Qualen umherirren, stets klagend und traurig.“'
    reason: Dokumentiert die frühere abweichende Wiedergabe des Demonstrativums und der Satzabgrenzung; der überlieferte Zusammenhang stützt jedoch „diese“ sowie die anschließende Angabe der siebenfachen Weise.
lexical_decisions:
- source_word: Haec inspirationes
  choice: Diese Geister
  rationale: Das Demonstrativpronomen wird mit „diese“ wiedergegeben; „Geister“ gibt das im Kontext auf körperlose Wesen bezogene lateinische „inspirationes“ natürlich wieder.
- source_word: habitationes
  choice: Behausungen
  rationale: „Behausungen“ wahrt die konkrete und zugleich jenseitige Offenheit des lateinischen Ausdrucks besser als das alltäglichere „Wohnungen“.
- source_word: vagabuntur amodo in tormentis
  choice: werden … von nun an unter Qualen umherirren
  rationale: Die Formulierung bewahrt sowohl die Zukunftsbedeutung als auch das ziellose Umherziehen und den Zustand der Qual.
- source_word: per septem vias
  choice: auf sieben Wegen
  rationale: Die wörtliche räumliche Metapher leitet die anschließend aufgezählten sieben Arten der Qual ein, ohne sie bereits ausdeutend mit „auf siebenfache Weise“ wiederzugeben.
theological_decisions:
- issue: Art der jenseitigen Aufenthaltsorte
  choice: Behausungen
  alternative: Wohnungen; Ruhestätten
  rationale: Der Text benennt Aufenthaltsorte, bestimmt aber weder ihre genaue Beschaffenheit noch ausdrücklich, dass es sich um Orte der Ruhe handelt.
- issue: Bedeutung der sieben Wege
  choice: auf sieben Wegen
  alternative: auf siebenfache Weise
  rationale: Die bildhafte Ausdrucksweise und die Spannung zwischen Wegen und Arten der Qual bleiben erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am lateinischen Gedankengang; „Behausungen“ und „auf sieben Wegen“ bewahren die bildhafte und theologisch offene Ausdrucksweise.
