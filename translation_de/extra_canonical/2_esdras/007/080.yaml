  source_fidelity: Die Satzstruktur und die entscheidende siebenfache Gliederung werden grundsätzlich getroffen. „Leidend“ ist für das im Kontext gemeinte fortwährende Klagen/Trauern jedoch zu unspezifisch. „In siebenfacher Weise“ gibt per septem vias als Einleitung der folgenden sieben Arten von Qual idiomatisch wieder, ohne die Metapher theologisch auszudeuten.
  naturalness: „In Behausungen eingehen“ ist verständlich, aber im modernen Standarddeutsch unnötig altertümlich. „In Behausungen eintreten“ wahrt den gehobenen Registerton und ist klarer. „Stets klagend und traurig“ ist natürlich und semantisch präziser als „immer leidend und traurig“.
  terminology: „Geister“ ist im Kontext eine vertretbare Wiedergabe von inspirationes. „Behausungen“ bewahrt die Offenheit von habitationes. Die Formulierung zur Siebenzahl wird als Gliederungsangabe, nicht als dogmatische Beschreibung jenseitiger Zustände, wiedergegeben.
