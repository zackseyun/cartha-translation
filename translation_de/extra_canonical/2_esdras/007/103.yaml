id: 2ES.7.103
reference: 2 Esdras 7:103
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iudicii iusti impios excusare poterint uel deprecari pro eis Altissimum, Si patres pro filiis, uel filii pro parentibus, si fratres pro fratribus, si adfines pro proximis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: de
  text: werden sie beim gerechten Gericht die Gottlosen entschuldigen oder für sie den Höchsten anflehen können – wie Väter für ihre Kinder, Kinder für ihre Eltern, Brüder für ihre Brüder oder Verwandte für ihre Nachbarn,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impios
  choice: die Gottlosen
  rationale: Gibt die religiös-moralische Bedeutung von „impii“ im Gerichtskontext klar und ohne konfessionelle Zuspitzung wieder.
- source_word: excusare
  choice: entschuldigen
  rationale: Bewahrt den Grundsinn, jemanden von einem Vorwurf zu entlasten; „freisprechen“ würde den genannten Angehörigen eine richterliche Befugnis zuschreiben, die der lateinische Text nicht ausdrücklich behauptet.
- source_word: deprecari pro eis Altissimum
  choice: für sie den Höchsten anflehen
  rationale: Gibt sowohl die Fürbitte zugunsten der Gottlosen als auch das eindringliche Bitten gegenüber dem Höchsten natürlich wieder.
- source_word: filiis / filii
  choice: Kinder
  rationale: „Filii“ kann je nach Zusammenhang Söhne oder Kinder bezeichnen; das inklusive „Kinder“ passt zur allgemeinen Aufzählung familiärer Beziehungen.
- source_word: adfines
  choice: Verwandte
  rationale: Bezeichnet insbesondere durch Heirat verbundene Angehörige; „Verwandte“ ist im Deutschen verständlich und für die rhetorische Beziehungsreihe angemessen.
- source_word: proximis
  choice: ihre Nächsten
  rationale: Bewahrt die relationale Bedeutung von „proximi“; „Nachbarn“ wäre hier im Zusammenhang enger persönlicher Bindungen unnötig räumlich verengt.
theological_decisions:
- issue: Möglichkeit der Fürbitte beim Endgericht
  choice: Die Frage bleibt offen formuliert und nennt sowohl ein Entschuldigen der Gottlosen als auch ein Flehen zum Höchsten.
  alternative: Die Aussage als eindeutige Leugnung jeder Fürbitte formulieren.
  rationale: Der vorliegende Versabschnitt ist grammatisch Teil einer Frage; eine dogmatische Antwort darf nicht in diesen Satz hineingetragen werden.
- issue: „gerechtes Gericht“
  choice: beim gerechten Gericht
  alternative: durch das gerechte Gericht
  rationale: Die Wendung bezeichnet hier am natürlichsten den Anlass beziehungsweise Zeitpunkt, an dem eine solche Fürsprache versucht würde, entsprechend dem Zusammenhang und der konsultierten englischen Fassung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzanfang und das abschließende Komma bleiben erhalten, weil der überlieferte Versausschnitt syntaktisch an den Kontext anschließt und die Aufzählung offenbar fortgesetzt wird. Der Gedankenstrich macht die beispielhafte Beziehungsreihe im Deutschen übersichtlich, ohne ihren Inhalt zu verändern.
