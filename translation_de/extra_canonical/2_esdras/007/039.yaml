source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: die iudicii. Hic talis qui neque solem [habeat] neque lunam, neque stellas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/039.yaml
  text: This is such a day[a], which has neither sun nor moon nor stars,
translation:
  language: de
  text: Dieser Tag ist so beschaffen[a], dass er weder Sonne noch Mond noch Sterne hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies ist ein solcher Tag, der weder Sonne noch Mond noch Sterne hat.“'
    reason: „Hic talis“ lässt sich entweder mit wiederaufgenommenem Bezugswort („Dieser Tag ist so beschaffen“) oder präsentativ („Dies ist ein solcher Tag“) wiedergeben.
lexical_decisions:
- source_word: Hic
  choice: Dieser Tag
  rationale: Das proximale Demonstrativpronomen nimmt das unmittelbar zuvor genannte „die iudicii“ („Tag des Gerichts“) auf. Im Deutschen muss das Bezugswort für eine natürliche und eindeutige Wiedergabe wiederholt werden.
- source_word: talis
  choice: ist so beschaffen
  rationale: Gibt die beschreibende Bedeutung von „talis“ idiomatisch wieder und leitet passend den folgenden Relativ- beziehungsweise Folgesatz ein.
- source_word: neque solem … neque lunam, neque stellas
  choice: weder Sonne noch Mond noch Sterne
  rationale: Bewahrt die dreigliedrige Verneinung und gibt sie in natürlichem modernem Deutsch wieder.
- source_word: '[habeat]'
  choice: hat
  rationale: Das in der Edition ergänzte Verb wird für einen vollständigen deutschen Satz ausdrücklich wiedergegeben; der Konjunktiv steht im abhängigen charakterisierenden Satz und verlangt hier keinen deutschen Konjunktiv.
theological_decisions:
- issue: Beschreibung des Gerichtstages ohne Himmelslichter
  choice: wörtlich als Aussage wiedergegeben, dass der Tag weder Sonne noch Mond noch Sterne hat
  alternative: als bloße Aussage über fehlendes Licht auslegen
  rationale: Der Quelltext nennt ausdrücklich die drei Himmelskörper beziehungsweise -lichter; eine Deutung ihres theologischen oder kosmologischen Sinnes wird nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng an der lateinischen Satzstruktur, vermeidet aber ein unnatürliches deutsches „Dieser ist ein solcher“. Das abschließende Komma bleibt erhalten, da der überlieferte Ausschnitt syntaktisch weiterführt.
