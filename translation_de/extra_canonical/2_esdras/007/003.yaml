  text: And I said, “Speak, my lord.” And he said to me, “The sea is set in a broad place, so that it might be deep and immense.
translation:
  language: de
  text: 'Und ich sagte: »Sprich, mein Herr.« Da sagte er zu mir: »Das Meer ist an einem weiten Ort angelegt, damit es tief und unermesslich sei.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: mein Herr
  rationale: Gibt die respektvolle Anrede wörtlich und in natürlichem modernem Deutsch wieder, ohne die Identität des Angesprochenen näher festzulegen.
- source_word: positum est
  choice: liegt
  rationale: Entspricht hier idiomatisch dem räumlichen Sinn von »ist hingesetzt/angelegt« und vermeidet eine unnötig hölzerne Passivform.
- source_word: in spatioso loco
  choice: in einem weiten Raum
  rationale: Bewahrt sowohl die räumliche Weite von »spatiosus« als auch das allgemein gehaltene »locus«.
- source_word: altum et inmensum
  choice: tief und unermesslich
  rationale: Gibt beide Eigenschaften direkt wieder; »unermesslich« bewahrt den Gedanken einer nicht auszumessenden Ausdehnung.
