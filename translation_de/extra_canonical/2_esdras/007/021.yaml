source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: de
  text: Denn der Herr gebot denen, die kamen, bei ihrer Ankunft ausdrücklich, was sie tun sollten, um zu leben, und was sie beachten sollten, um nicht bestraft zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  choice: Denn … hatte … ausdrücklich geboten
  rationale: Die Verbindung von Partizip und finitem Verb verstärkt das Gebieten. „Ausdrücklich“ gibt diesen Nachdruck wieder, ohne die nicht ausdrücklich bezeichnete Strenge von „streng“ einzutragen.
- source_word: venientibus quando venerunt
  choice: denen, die kamen, bei ihrer Ankunft
  rationale: Bewahrt sowohl den Bezug auf die Kommenden als auch die Zeitangabe, vermeidet aber im Deutschen die schwerfällige Wiederholung „die kamen, als sie kamen“.
- source_word: quid facientes viverent
  choice: was sie tun sollten, um zu leben
  rationale: Gibt die modale Aussage und den Zweck beziehungsweise die Folge des Handelns natürlich wieder, ohne das Leben näher theologisch festzulegen.
- source_word: quid observantes non punirentur
  choice: was sie beachten sollten, um nicht bestraft zu werden
  rationale: „Beachten“ entspricht observare im Sinn des Befolgens oder Einhaltens; die passive Form und die negative Ziel- beziehungsweise Folgeaussage bleiben erhalten.
theological_decisions:
- issue: Bedeutung von „leben“
  choice: „um zu leben“ ohne nähere Bestimmung
  alternative: „um das Leben zu erlangen“ oder „gerettet zu werden“
  rationale: Der lateinische Text sagt lediglich viverent. Eine Präzisierung als ewiges Leben oder Rettung würde die im Vers bestehende Offenheit auflösen.
- issue: Verhältnis von Handeln und Nichtbestrafung
  choice: Die parallele Bedingungs- und Zielstruktur des Ausgangstextes bleibt stehen.
  alternative: Eine erklärende Formulierung, die Gnade, Verdienst oder Bundesgehorsam ausdrücklich einführt
  rationale: Der Vers verbindet Tun und Beachten unmittelbar mit Leben und Nichtbestrafung; eine dogmatische Einordnung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt verdeutlicht, dass das Gebot bei der Ankunft bereits als vollzogene Weisung erging; die Satzparallelität des lateinischen Textes bleibt weitgehend erhalten.
