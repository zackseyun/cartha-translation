source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: de
  text: Und nach sieben Tagen wird das Zeitalter, das noch nicht erwacht ist, erweckt werden, und das Verdorbene wird sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: das Zeitalter
  rationale: Das lateinische saeculum bezeichnet hier das kommende Zeitalter beziehungsweise die kommende Weltzeit; „Zeitalter“ bewahrt die zeitlich-kosmische Bedeutung und entspricht dem grammatischen Subjekt.
- source_word: qui nondum vigilat
  choice: das noch nicht erwacht ist
  rationale: Die wörtliche Aussage „noch nicht wacht“ wird im Deutschen idiomatisch als ein noch nicht erfolgtes Erwachen wiedergegeben und bewahrt das Bild des anschließenden Erwecktwerdens.
- source_word: excitabitur
  choice: wird … erweckt werden
  rationale: Das Passiv wird beibehalten; so bleibt offen, wer das kommende Zeitalter erweckt.
- source_word: corruptum
  choice: das Verdorbene
  rationale: Die substantivierte neutrale Form bezeichnet allgemein das, was verdorben ist. „Das Verdorbene“ gibt diesen Zustand direkter wieder als „das Vergängliche“ und vermeidet eine Verengung auf bloße Sterblichkeit.
- source_word: morietur
  choice: wird sterben
  rationale: Die einfache Zukunftsaussage des lateinischen Verbs wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Bezug von saeculum und corruptum
  choice: „das Zeitalter“ und „das Verdorbene“ als zwei grammatisch getrennte Größen wiedergeben
  alternative: corruptum auf das gegenwärtige Zeitalter beziehen oder als „das Vergängliche“ deuten
  rationale: Der lateinische Satz wechselt vom maskulinen saeculum mit qui zum neutralen corruptum. Die Übersetzung bewahrt diesen formalen Unterschied und lässt die genaue Identität des „Verdorbenen“ offen.
- issue: Handelnder beim Erwecken
  choice: Passiv ohne ausdrückliches Agens
  alternative: „Gott wird das Zeitalter erwecken“
  rationale: Der Ausgangstext nennt den Handelnden nicht; eine ausdrückliche Nennung Gottes würde eine im Text nur implizite Deutung ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche kosmische Personifikation des noch nicht erwachten Zeitalters bleibt bewusst erhalten; der parallele Zukunftssatzbau folgt dem lateinischen Text, ohne unnatürlich zu wirken.
