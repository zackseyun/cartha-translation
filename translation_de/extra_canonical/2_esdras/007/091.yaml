source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sermo: Imprimis uident cum exultatione multa gloriam eius qui suscipit eas,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/091.yaml
  text: First[a], they see with great joy the glory of him who receives them.
translation:
  language: de
  text: Erstens sehen sie mit großer Freude die Herrlichkeit dessen, der sie aufnimmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Imprimis
  choice: Erstens
  rationale: Gibt die einleitende Reihenfolgeangabe präzise und im Zusammenhang der folgenden Ordnungen natürlich wieder.
- source_word: uident
  choice: sehen sie
  rationale: Direkte Wiedergabe des Präsens; das Subjekt ergibt sich aus dem vorausgehenden Zusammenhang.
- source_word: cum exultatione multa
  choice: mit großer Freude
  rationale: Natürliches modernes Deutsch für intensive jubelnde Freude, ohne den Ausdruck unnötig zu übersteigern.
- source_word: gloriam eius
  choice: die Herrlichkeit dessen
  rationale: Bewahrt den Bezug des lateinischen Genitivs auf die nachfolgend durch den Relativsatz bestimmte Person.
- source_word: qui suscipit eas
  choice: der sie aufnimmt
  rationale: Suscipere bezeichnet hier das annehmende beziehungsweise empfangende Aufnehmen; „sie“ bezieht sich auf die zuvor genannten Seelen.
theological_decisions:
- issue: Identität dessen, der die Seelen aufnimmt
  choice: dessen, der sie aufnimmt
  alternative: Gottes, der sie aufnimmt
  rationale: Der lateinische Text nennt die Person nicht ausdrücklich. Die Übersetzung bewahrt diese referenzielle Offenheit und ergänzt keine theologische Identifikation.
- issue: Versabgrenzung
  choice: Nur den im überlieferten Text von Vers 91 enthaltenen Satz übersetzen
  alternative: Den Satz „denn sie werden in sieben Ordnungen ruhen“ aus Vers 92 anfügen
  rationale: Die zusätzliche Klausel gehört nach der vorgelegten lateinischen Segmentierung an den Anfang von Vers 92 und wird daher hier nicht aufgenommen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Aufzählungsstruktur des Lateinischen bleibt erhalten; keine Fußnote ist für diesen Vers erforderlich.
