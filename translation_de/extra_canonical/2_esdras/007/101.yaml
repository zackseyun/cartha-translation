source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixisti ? Et dixit : septem diebus erit libertas earum, ut uideant qui praedicti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/101.yaml
  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: de
  text: 'Und er sagte: „Sieben Tage lang werden sie Freiheit haben, damit sie sehen, was vorhergesagt wurde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: libertas
  choice: Freiheit
  rationale: Gibt den lateinischen Begriff direkt und im Zusammenhang der befristeten Freiheit der Seelen angemessen wieder.
- source_word: qui praedicti
  choice: was vorhergesagt wurde
  rationale: Der überlieferte Ausschnitt bricht syntaktisch ab; die neutrale Formulierung wahrt den Sinn des passiven praedicti, ohne ein im Ausschnitt nicht sichtbares Bezugswort unnötig festzulegen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Gegenüber bei „Et dixit“
  choice: „Und er sagte“ ohne „zu mir“
  alternative: „Und er sagte zu mir“
  rationale: Im vorgelegten lateinischen Text steht kein ausdrückliches „zu mir“; die Ergänzung würde die Erzählperspektive unnötig präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Zeitangabe wird natürlich wiedergegeben; die im Quellenausschnitt erkennbare Satzgrenze wird eingehalten, ohne späteren Text zu ergänzen.
