source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: de
  text: Und ich werde nicht über die Menge derer trauern, die zugrunde gegangen sind. Denn sie sind es, die dem Dampf und der Flamme ähnlich gemacht, dem Rauch gleichgesetzt worden sind und aufgeflammt sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbrannt sind“.'
    reason: Das lateinische exarserunt kann ein Entbrennen oder Auflodern, je nach Kontext auch intensives Brennen, bezeichnen.
lexical_decisions:
- source_word: contristabor
  choice: ich werde … trauern
  rationale: Gibt das futurische Deponens natürlich und in würdigem modernem Deutsch wieder.
- source_word: qui perierunt
  choice: die zugrunde gegangen sind
  rationale: Bewahrt den perfektischen Aspekt und lässt offen, ob körperlicher Tod oder endgültiger Untergang gemeint ist.
- source_word: uapori assimilati sunt et flammae
  choice: Dampf und Flamme ähnlich gemacht … worden sind
  rationale: Ordnet entsprechend der lateinischen Syntax sowohl „Dampf“ als auch „Flamme“ dem ersten Vergleichsausdruck zu.
- source_word: fumo adaequati sunt
  choice: dem Rauch gleichgesetzt worden sind
  rationale: Hält den zweiten Vergleich ausdrücklich bei „Rauch“ und bewahrt die passive Form.
- source_word: exarserunt
  choice: verbrannt sind
  rationale: Gibt das vollendete Brennen knapp und verständlich wieder; die mögliche Nuance des Aufloderns wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von perierunt
  choice: zugrunde gegangen sind
  alternative: umgekommen sind
  rationale: „Zugrunde gegangen“ bewahrt die mögliche eschatologische Tragweite, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das vorangestellte „nominatum est“ wurde als Rest des vorhergehenden Verses nicht aufgenommen, entsprechend der Versabgrenzung der konsultierten englischen Fassung. Die ungewöhnliche Folge der drei Vergleiche bleibt erhalten, ohne ihre Bildsprache zu glätten.
