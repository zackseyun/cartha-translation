  rationale: 'Die Revision korrigiert die deutsche Kasusrektion, ohne die im Lateinischen auffällige Verteilung der drei Bildwörter zu glätten: Dampf und Flamme bleiben beim ersten Vergleich, Rauch beim zweiten. „Aufgeflammt“ gibt exarserunt als Haupttext wieder; die mögliche weitergehende Nuance wird knapp in der Fußnote dokumentiert.'
