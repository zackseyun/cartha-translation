  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: de
  text: 'Darum, Esra: Leeres für die Leeren und Volles für die Vollen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: Darum
  rationale: Gibt die folgernde Bedeutung der lateinischen Wendung knapp und natürlich wieder.
- source_word: vacua vacuis
  choice: Leeres ist für die Leeren bestimmt
  rationale: Bewahrt das Wortspiel und die substantivische Gegenüberstellung von Neutrum Plural und Dativ Plural; »bestimmt« macht die im Lateinischen elliptische Zuordnung im Deutschen verständlich.
- source_word: plena plenis
  choice: Fülle für die Erfüllten
  rationale: Bewahrt den Kontrast zu »Leeres« und gibt plena substantivisch als das inhaltlich Volle wieder, während plenis die Personen oder Dinge bezeichnet, die erfüllt sind.
theological_decisions:
- issue: Deutung der elliptischen Gegensatzpaare vacua vacuis / plena plenis
  choice: Die Zuordnung wird sprachlich verdeutlicht, aber nicht theologisch ausgedeutet.
  alternative: »Leere Dinge gehören den Leeren und volle Dinge den Vollen.«
  rationale: Der lateinische Satz lässt offen, worauf sich die substantivierten Adjektive beziehen. Die Übersetzung wahrt diese Spannung und vermeidet eine Festlegung etwa auf geistlich leere beziehungsweise erfüllte Menschen.
translation_notes:
  register: Knapp, sentenzartig und würdevoll. Die auffällige Parallelität des lateinischen Satzes bleibt erhalten; wegen der elliptischen Form wird im ersten Glied »bestimmt« ergänzt und im zweiten mitverstanden.
