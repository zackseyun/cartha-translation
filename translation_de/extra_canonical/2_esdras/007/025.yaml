review_pass:
  verdict: revise
  source_fidelity: Die folgernde Anrede „Darum, Esra“ gibt propter hoc, Ezra zutreffend wieder. Die lateinischen substantivierten Neutra bzw. Dative (vacua vacuis et plena plenis) sind jedoch bewusst elliptisch und parallel. „Fülle“ verschiebt plena von einem substantivierten Adjektiv im Plural zu einem abstrakten Singular; „Erfüllten“ legt die Dativgruppe stärker als bereits erfüllte Personen aus, als der Text verlangt.
  naturalness: Die revidierte Fassung bleibt im Deutschen knapp, sentenzartig und verständlich. Die Ellipse ist hier als stilistische Parallelform tragfähig; ein ergänztes „bestimmt“ ist nicht nötig.
  terminology: „Leeres“/„Volles“ wahrt die formale und semantische Gegenüberstellung von vacua/plena. „die Leeren“/„die Vollen“ erhält die offene Referenz der Dativformen, ohne sie geistlich oder theologisch zu spezifizieren.
  issues:
  - severity: medium
    issue: „Fülle“ statt „Volles“
    rationale: Das lateinische plena ist parallel zu vacua ein substantiviertes Neutrum im Plural. Der abstrakte Singular „Fülle“ löst diese Parallelität und verändert die bildhafte Offenheit.
  - severity: medium
    issue: „die Erfüllten“ statt „die Vollen“
    rationale: „Erfüllten“ kann im Deutschen nahelegen, dass Personen durch etwas oder jemanden erfüllt worden sind, und trägt damit eine zusätzliche, potenziell theologische Nuance ein. plenis besagt lediglich „den Vollen“ und lässt den Bezug offen.
  revised_text: 'Darum, Esra: Leeres für die Leeren und Volles für die Vollen.'
