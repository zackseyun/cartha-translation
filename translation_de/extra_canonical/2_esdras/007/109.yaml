  text: and Elijah for those who received rain and for the dead man, that he might live,
translation:
  language: de
  text: und Elia für diejenigen, die Regen empfingen, und für den Toten, damit er lebendig würde,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: Elia
  rationale: Die geläufige moderne deutsche Namensform des Propheten.
- source_word: pro his qui pluviam acceperunt
  choice: für diejenigen, die Regen empfingen
  rationale: Gibt die Fürbitteformel mit »für« und die Aussage des lateinischen Relativsatzes eng und verständlich wieder.
- source_word: pro mortuo
  choice: für den Toten
  rationale: Bewahrt den substantivierten Singular des lateinischen »mortuo«.
- source_word: ut viveret
  choice: damit er wieder lebte
  rationale: Der Zwecksatz wird natürlich wiedergegeben; »wieder« verdeutlicht im Deutschen den durch den Kontext vorausgesetzten Übergang vom Tod zum Leben, ohne eine nähere Art der Belebung festzulegen.
theological_decisions:
- issue: Bezug und Aussage von »ut viveret«
  choice: damit er wieder lebte
  alternative: damit er wieder lebendig würde
  rationale: Der Satz bleibt als Ziel beziehungsweise Inhalt von Elias Fürbitte für den Toten formuliert. Die Übersetzung legt weder eine besondere Auferstehungslehre noch die genaue Dauer des wiedererlangten Lebens fest.
translation_notes:
  register: Moderne, würdige Standardsprache; die fragmentarische Fortsetzung einer Aufzählung und das abschließende Komma des Ausgangstextes bleiben erhalten.
