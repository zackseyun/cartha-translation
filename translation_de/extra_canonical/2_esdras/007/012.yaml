  source_fidelity: 'Der Entwurf gibt die Reihung und die Hauptbegriffe des lateinischen Textes grundsätzlich treffend wieder: introitus als „Zugänge“, angusti, dolentes und laboriosi als „eng, schmerzhaft und mühsam“, ebenso periculorum plenae. „Spärlich“ schwächt jedoch das ausdrücklich zählende paucae ab. Für fultae ist „getragen“ als bewusst bildnahe Wiedergabe vertretbar; es sollte nicht, dem englischen Audit trail folgend, ohne Weiteres zu „belastet“ umgedeutet werden.'
  naturalness: „Weltzeit“ ist im modernen Standarddeutsch unnötig kunstsprachlich. „Dieser Welt“ ist für huius saeculi idiomatisch und lässt im apokalyptischen Kontext die zeitlich-weltliche Bedeutung offen. „Wenige“ ist zudem natürlicher und präziser als „spärlich“.
  terminology: Die Begriffe bleiben nichtkonfessionell. „Schlecht“ gibt malae allgemein wieder, ohne es ausschließlich moralisch als „böse“ oder zu konkret als „unheilvoll“ auszulegen. Die Alternative „leidvoll“ in der Anmerkung bewahrt den möglichen weiteren Bedeutungsbereich von dolentes.
  issues:
