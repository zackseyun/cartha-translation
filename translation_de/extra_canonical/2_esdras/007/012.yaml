    issue: „spärlich“ für paucae
    rationale: Paucae bezeichnet primär eine geringe Anzahl („wenige“). „Spärlich“ beschreibt eher eine dünne Verteilung oder geringe Menge und ist hier weniger genau.
  - severity: low
    issue: „Weltzeit“ für huius saeculi
    rationale: Die Wiedergabe ist semantisch möglich, klingt aber im modernen Standarddeutsch markiert. „Dieser Welt“ ist idiomatischer und bewahrt die im Kontext mögliche Bedeutung von saeculum als gegenwärtige Welt beziehungsweise Weltzeit.
  - severity: low
    issue: „schlimm“ für malae
    rationale: „Schlimm“ ist möglich, wirkt in dieser Reihung jedoch umgangssprachlicher. „Schlecht“ ist neutraler und wahrt die offene negative Wertung des Lateinischen.
  revised_text: Und die Zugänge zu dieser Welt wurden eng, schmerzhaft und mühsam[a], wenige und schlecht, voller Gefahren und von großen Mühen getragen.
