source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: de
  text: Und die Zugänge zu dieser Welt wurden eng, schmerzhaft und mühsam[a], wenige und schlecht, voller Gefahren und von großen Mühen getragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »leidvoll«.'
    reason: dolentes kann neben „schmerzhaft“ auch den Gedanken von Leid bzw. Kummer ausdrücken.
lexical_decisions:
- source_word: introitus
  choice: Zugänge
  rationale: Gibt den Plural und die Grundbedeutung von Zugängen bzw. Eingängen wieder, ohne das Bild vorschnell auf einen einzelnen Weg einzuengen.
- source_word: huius saeculi
  choice: zu dieser Weltzeit
  rationale: Bewahrt den zeitlich-eschatologischen Sinn von saeculum besser als das rein räumliche „Welt“.
- source_word: dolentes
  choice: schmerzhaft
  rationale: Bei den unbelebten „Zugängen“ bezeichnet das Wort am ehesten eine schmerzverursachende Beschaffenheit; „traurig“ würde unnötig personifizieren.
- source_word: laboriosi
  choice: mühsam
  rationale: Natürliches modernes Deutsch für etwas, das Mühe und Anstrengung verursacht.
- source_word: paucae
  choice: spärlich
  rationale: Gibt die geringe Zahl bzw. Seltenheit idiomatisch wieder und lässt die elliptische Beziehung auf introitus bestehen.
- source_word: malae
  choice: schlimm
  rationale: Bewahrt die negative Wertung, ohne sie enger als moralisch „böse“ festzulegen.
- source_word: fultae
  choice: getragen
  rationale: Folgt dem ungewöhnlichen Bild des lateinischen Ausdrucks möglichst eng, statt es mit „belastet“ interpretierend zu glätten.
theological_decisions:
- issue: Bedeutung von saeculum
  choice: Weltzeit
  alternative: Welt / Zeitalter
  rationale: „Weltzeit“ hält sowohl den gegenwärtigen Weltzustand als auch dessen zeitliche Begrenzung im Blick und vermeidet eine konfessionelle Ausdeutung.
- issue: Bildsprache der introitus
  choice: Zugänge
  alternative: Eingänge / Wege
  rationale: Der Quelltext spricht von introitus im Plural; „Zugänge“ wahrt das Bild und lässt offen, ob konkrete Eingänge oder Zugangsmöglichkeiten gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzstruktur. Die auffällige Reihung des lateinischen Textes und seine spannungsreiche Bildsprache bleiben erhalten.
