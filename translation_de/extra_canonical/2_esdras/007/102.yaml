lexical_decisions:
- source_word: Et respondi et dixi
  choice: Und ich antwortete und sagte
  rationale: Bewahrt die formelhafte Doppelung des lateinischen Ausgangstextes in natürlichem, würdigem Deutsch.
- source_word: si inueni gratiam ante oculos tuos
  choice: Wenn ich Gnade vor deinen Augen gefunden habe
  rationale: Gibt die biblische Wendung eng und verständlich wieder, ohne sie zu modernisierend auf bloßes Wohlwollen zu reduzieren.
- source_word: demonstra mihi adhuc seruo tuo
  choice: dann zeige mir, deinem Diener, auch
  rationale: Bezieht sowohl mihi als auch seruo tuo auf den Sprecher und erhält adhuc im Sinn von »auch/noch«; »dann« macht die deutsche Wenn-dann-Konstruktion lesbar.
- source_word: si in die
  choice: ob am Tag
  rationale: Erhält die indirekte Frage und den bewusst unvollständigen Abbruch des überlieferten Verssegments.
theological_decisions:
- issue: Unvollständiger Satz am Versende
  choice: Der Text endet offen mit »ob am Tag«.
  alternative: Die aus dem folgenden Kontext bekannte Frage ergänzen.
  rationale: Die Vorlage für diese Einheit endet bei si in die; eine Ergänzung würde nicht zum bereitgestellten lateinischen Quellsegment gehören.
translation_notes:
  register: Modernes Standarddeutsch mit bewusst biblisch-würdigem Ton. Die syntaktische Unvollständigkeit am Ende ist quellenbedingt und wird nicht geglättet.
