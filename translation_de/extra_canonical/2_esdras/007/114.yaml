id: 2ES.7.114
reference: 2 Esdras 7:114
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: soluta est intemperantia, abscisa est incredulitas, crevit autem iustitia, orta est veritas.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/114.yaml
  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: de
  text: Die Zügellosigkeit ist beseitigt, der Unglaube abgeschnitten; die Gerechtigkeit aber ist gewachsen, und die Wahrheit ist aufgegangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: Zügellosigkeit
  rationale: Bezeichnet mangelnde Selbstbeherrschung beziehungsweise ungehemmtes Verhalten; „Zügellosigkeit“ gibt den negativen moralischen Sinn im Deutschen prägnant wieder.
- source_word: soluta est
  choice: ist beseitigt
  rationale: Das lateinische „solvere“ kann lösen oder aufheben bedeuten. Im Gegensatz zu den anschließend positiv aufkommenden Größen ist hier das Ende der Zügellosigkeit gemeint; „beseitigt“ klingt natürlich, ohne die Bildsprache unnötig festzulegen.
- source_word: incredulitas
  choice: Unglaube
  rationale: Entspricht dem religiös und moralisch gefärbten Sinn des lateinischen Begriffs, ohne ihn enger als bloße Skepsis zu deuten.
- source_word: abscisa est
  choice: abgeschnitten
  rationale: Bewahrt die konkrete Bildsprache des lateinischen Verbs und den deutlichen Gegensatz zu „gewachsen“.
- source_word: iustitia
  choice: Gerechtigkeit
  rationale: Die übliche und im Kontext angemessene Wiedergabe; sie lässt den ethischen wie auch den heilsgeschichtlichen Bedeutungsumfang offen.
- source_word: crevit
  choice: ist gewachsen
  rationale: Bewahrt das Wachstumsbild und bildet zusammen mit „abgeschnitten“ einen anschaulichen Gegensatz.
- source_word: veritas
  choice: Wahrheit
  rationale: Direkte, natürliche Entsprechung, die sowohl Wahrhaftigkeit als auch Wahrheit umfassen kann.
- source_word: orta est
  choice: ist aufgegangen
  rationale: 'Bewahrt die bildhafte Bedeutung von „oriri“: hervorbrechen beziehungsweise wie Licht oder ein Gestirn aufgehen; vermeidet eine unnötige Festlegung auf „entstanden“.'
theological_decisions:
- issue: Reichweite von „iustitia“
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ hält sowohl eine persönliche Tugend als auch einen umfassenderen Zustand offen und vermeidet eine Verengung auf individuelles Verhalten.
- issue: Bildgehalt von „orta est veritas“
  choice: die Wahrheit ist aufgegangen
  alternative: die Wahrheit ist entstanden
  rationale: „Aufgegangen“ erhält die eschatologisch wirkende Bildsprache, ohne zu behaupten, Wahrheit habe vorher überhaupt nicht existiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Orientierung an der parallelen lateinischen Satzstruktur. Das adversative „aber“ wird entsprechend „autem“ beibehalten; die vier perfektischen Aussagen erscheinen einheitlich im Perfekt.
