source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: unum saeculum, sed duo. Tu enim, quia dixisti non esse multos iustos, sed paucos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/051.yaml
  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: de
  text: Eine Weltzeit, aber zwei. Denn du hast gesagt, dass es nicht viele Gerechte gibt, sondern wenige,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: Weltzeit
  rationale: Das lateinische Wort kann sowohl eine Zeitspanne bzw. ein Zeitalter als auch die gegenwärtige Weltordnung bezeichnen. „Weltzeit“ bewahrt diese Bedeutungsbreite besser als das engere „Zeitalter“.
- source_word: iustos
  choice: Gerechte
  rationale: Die substantivierte Wiedergabe bezeichnet Menschen, die als gerecht gelten, ohne näher festzulegen, worin ihre Gerechtigkeit besteht.
- source_word: enim
  choice: Denn
  rationale: Gibt die begründende Verknüpfung unmittelbar und in würdigem modernem Deutsch wieder.
theological_decisions:
- issue: Die spannungsvolle Formulierung „unum saeculum, sed duo“
  choice: „Eine Weltzeit, aber zwei“
  alternative: „Ein Zeitalter, aber zwei“
  rationale: Die auffällige, im vorliegenden Ausschnitt nicht aufgelöste Spannung zwischen „eine“ und „zwei“ wird erhalten und nicht durch eine erläuternde Ergänzung harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fragmentarische Syntax und das abschließende Komma werden entsprechend der Quelle beibehalten, da der Satz offenbar im folgenden Vers weitergeführt wird.
