id: 2ES.7.72
reference: 2 Esdras 7:72
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: de
  text: Deshalb werden die, die auf der Erde leben, gequält werden, weil sie, obwohl sie Einsicht hatten, Unrecht taten, obwohl sie Gebote empfingen, sie nicht hielten und obwohl sie das Gesetz erhielten, treulos damit umgingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte lateinische Wortlaut bricht nach „legem consecuti“ („das Gesetz erhielten“) ab. Die abschließende Klausel ist nach der ausgewiesenen englischen Konsultationsfassung wiedergegeben.
    reason: Macht transparent, dass allein die letzte Klausel nicht im vorgelegten lateinischen Ausschnitt enthalten ist.
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: die Bewohner der Erde
  rationale: Gibt die auf Dauer angelegte Bedeutung von commorari natürlich und knapp wieder.
- source_word: sensum habentes
  choice: obwohl sie Einsicht hatten
  rationale: Bewahrt den konzessiven Zusammenhang und gibt sensus hier als sittlich relevante Einsicht wieder.
- source_word: iniquitatem fecerunt
  choice: taten sie Unrecht
  rationale: Eine direkte, idiomatische Wiedergabe, die den allgemeinen Charakter von iniquitas nicht unnötig präzisiert.
- source_word: mandata accipientes non seruauerunt ea
  choice: obwohl sie Gebote empfingen, hielten sie sie nicht
  rationale: Spiegelt die Wiederholung von Empfangen und Nichtbewahren eng und in würdigem Gegenwartsdeutsch.
- source_word: legem consecuti
  choice: obwohl sie das Gesetz erhielten
  rationale: Consecuti bezeichnet hier das Erlangen beziehungsweise Empfangen des Gesetzes; „erhielten“ ist im Deutschen klar und natürlich.
- source_word: dealt deceitfully with it (consultation layer; continuation absent from the supplied Latin excerpt)
  choice: gingen sie treulos damit um
  rationale: Gibt den überlieferten Sinn idiomatisch wieder, ohne das Gesetz als unmittelbar betrogene Person darzustellen.
theological_decisions:
- issue: Grund der künftigen Qual
  choice: Die dreifache Verantwortlichkeit aufgrund von Einsicht, Geboten und Gesetz bleibt ausdrücklich erhalten.
  alternative: Die Aussage als allgemeine Verdammung der Erdbewohner ohne nähere Begründung wiederzugeben.
  rationale: Der Vers begründet die Qual gerade mit erkanntem und dennoch begangenem Unrecht sowie mit dem Nichtbefolgen empfangener Weisung.
- issue: Art der Untreue gegenüber dem Gesetz
  choice: „gingen sie treulos damit um“
  alternative: „betrogen sie es“ oder „übertraten sie es“
  rationale: Die gewählte Formulierung bewahrt den Vorwurf der Treulosigkeit, ohne ihn auf bloße Gesetzesübertretung zu verengen oder unnatürlich zu personifizieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Parallelstruktur mit „obwohl“ macht die gesteigerte Verantwortlichkeit verständlich und bewahrt den rhetorischen Aufbau des lateinischen Satzes.
