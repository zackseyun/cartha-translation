base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: de
  text: Und die Erde wird die zurückgeben, die in ihr schlafen,[a] und der Staub die, die in ihm in der Stille wohnen; und die Vorratskammern werden die Seelen zurückgeben, die ihnen anvertraut worden sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die in der Stille in ihm wohnen«.'
    reason: Stilistische Umstellung der deutschen Wortfolge ohne behauptete abweichende Textgliederung.
lexical_decisions:
- source_word: reddet
  choice: wird ... zurückgeben
  rationale: Gibt den futurischen Sinn und die Wiederholung des lateinischen Verbs wieder; im zweiten Glied kann das Verb entsprechend dem lateinischen Parallelismus elliptisch ergänzt werden.
- source_word: promptuaria
  choice: Vorratskammern
  rationale: Bewahrt das konkrete Bild von Aufbewahrungsorten, denen die Seelen bis zu ihrer Herausgabe anvertraut sind.
- source_word: commendatae sunt animae
  choice: die Seelen, die ihnen anvertraut worden sind
  rationale: Gibt das passive commendatae sunt und den Gedanken treuhänderischer Verwahrung genau und natürlich wieder.
- source_word: silentio habitant
  choice: in der Stille wohnen
  rationale: Erhält die wörtliche, poetische Darstellung des stillen Wohnens im Staub, ohne sie als bloße Umschreibung des Todes aufzulösen.
theological_decisions:
- issue: Verhältnis von Schlafenden, still Wohnenden und verwahrten Seelen
  choice: Die drei Bilder werden nebeneinandergestellt, ohne ihre genaue Beziehung systematisch zu erklären.
  alternative: Die Schlafenden beziehungsweise still Wohnenden ausdrücklich mit den Seelen gleichsetzen oder voneinander unterscheiden.
  rationale: Der lateinische Text verbindet Auferstehungs- und Verwahrungsbilder, bestimmt aber nicht ausdrücklich, wie Erde, Staub und Vorratskammern anthropologisch zueinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus des Lateinischen bleibt erhalten; das im zweiten Satzglied ausgelassene Verb ist im Deutschen eindeutig mitzuverstehen. Der Fußnotenmarker steht unmittelbar nach dem ersten Glied, auf das sich die Lesartalternative bezieht.
