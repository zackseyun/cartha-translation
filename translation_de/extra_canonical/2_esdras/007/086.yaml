  yaml_path: translation/extra_canonical/2_esdras/007/086.yaml
  text: 'The sixth way: they see how some of them will pass over into torment[a].'
translation:
  language: de
  text: 'Der sechste Weg: Sie sehen, wie einige von ihnen in die Qual hinübergehen werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie von ihnen [einige] in die Qual hinübergehen werden“.'
    reason: Die lateinische partitive Konstruktion „de eis“ erfordert im Deutschen eine sinngemäße Ergänzung.
lexical_decisions:
- source_word: Sexta uia
  choice: Der sechste Weg
  rationale: Bewahrt die Gliederung und das Bild des lateinischen Textes in natürlichem Deutsch.
- source_word: de eis
  choice: einige von ihnen
  rationale: Die partitive Wendung bedeutet hier „von ihnen“ bzw. sinngemäß „einige von ihnen“; sie ist nicht als verstärkendes „sie selbst“ zu verstehen.
- source_word: pertransient
  choice: hinübergehen werden
  rationale: Gibt sowohl die Bewegung als auch die Zukunftsform des lateinischen Verbs wieder.
- source_word: cruciamentum
  choice: die Qual
  rationale: Der rekonstruierte Singular bezeichnet einen Zustand oder Ort der Pein; der Singular bleibt erhalten.
theological_decisions:
- issue: Wer in die Qual hinübergeht
  choice: „einige von ihnen“ bleibt unbestimmt
  alternative: die Gruppe näher bestimmen oder „sie selbst“ schreiben
  rationale: Der lateinische Text enthält nur die partitive Angabe „de eis“ und benennt die Betroffenen an dieser Stelle nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die Weg-Metaphorik und die knappe, visionäre Aussageform bleiben erhalten.
