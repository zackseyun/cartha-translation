source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: de
  text: Denn als wir lebten und Unrecht taten, bedachten wir nicht, was wir nach dem Tod zu erleiden beginnen würden.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem faciebamus
  choice: Unrecht taten
  rationale: Die Wendung gibt das fortgesetzte schuldhafte Handeln natürlich und präzise wieder, ohne den Begriff unnötig konfessionell aufzuladen.
- source_word: cogitavimus
  choice: bedachten wir
  rationale: „Bedachten“ bezeichnet hier das ernsthafte Erwägen der künftigen Folgen und passt idiomatisch zum indirekten Fragesatz.
- source_word: incipientes … pati
  choice: zu erleiden beginnen würden
  rationale: 'Die Wiedergabe bewahrt ausdrücklich den inchoativen Sinn von incipere: Nach dem Tod setzt das Leiden ein. Eine modale Fassung wie „leiden müssten“ würde diesen Aspekt verwischen.'
theological_decisions:
- issue: Beginn des Leidens nach dem Tod
  choice: „nach dem Tod zu erleiden beginnen würden“
  alternative: „nach dem Tod würden leiden müssen“
  rationale: Der lateinische Wortlaut betont den Beginn eines nachtodlichen Erleidens, nicht in erster Linie eine Verpflichtung oder Notwendigkeit. Die Übersetzung wahrt diese eschatologische Zeitangabe, ohne Art oder Dauer des Leidens näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zeitliche Konstruktion „als wir lebten“ ist natürlicher als das substantivierte „als Lebende“; „Unrecht taten“ bleibt für ein breites Publikum verständlich. Wegen der klaren inchoativen Aussage des lateinischen Textes ist keine Fußnote mit der schwächeren modalen Alternative erforderlich.
