  source_fidelity: 'Die Übersetzung gibt den Sinn des lateinischen Satzes zuverlässig wieder: Das imperfektische „faciebamus“ wird angemessen als vergangenes fortgesetztes Handeln gefasst, „cogitavimus“ als fehlendes ernsthaftes Erwägen, und die indirekte Frage nach dem künftigen Erleiden bleibt erhalten. Die inchoative Aussage von „incipientes … pati“ wird mit „zu erleiden beginnen würden“ ausdrücklich und ohne unzulässige Ausdeutung wiedergegeben.'
