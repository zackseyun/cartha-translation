id: 2ES.7.138
reference: 2 Esdras 7:138
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: de
  text: Und er ist freigebig; denn wenn er nicht aus seiner Güte gäbe, damit diejenigen, die Unrecht getan haben, von ihren Verfehlungen entlastet würden[a], könnte nicht einmal der zehntausendste Teil der Menschen zum Leben gebracht werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von der Last ihrer Verfehlungen befreit würden“.'
    reason: Das lateinische „adleventur ... de“ bezeichnet eine Erleichterung oder Entlastung, lässt aber deren genaue Art offen.
lexical_decisions:
- source_word: donator
  choice: freigebig
  rationale: Das lateinische Nomen bezeichnet einen Gebenden bzw. Wohltäter. In diesem prädikativen Zusammenhang gibt „freigebig“ die gemeinte Wesenseigenschaft natürlicher wieder als das im Deutschen schwerfällige „ein Geber“.
- source_word: adleventur ... de suis iniquitatibus
  choice: von ihren Verfehlungen entlastet würden
  rationale: „Adlevare“ bezeichnet ein Erleichtern oder Entlasten; die Formulierung wahrt das Bild einer genommenen Last, ohne genauer festzulegen, ob Schuld, Folgen oder die Verfehlungen selbst gemeint sind.
- source_word: decies millesima pars hominum
  choice: der zehntausendste Teil der Menschen
  rationale: Die lateinische Verhältnisangabe wird als ein Zehntausendstel wiedergegeben; „nicht einmal“ bringt die verneinte äußerst geringe Größenordnung idiomatisch zum Ausdruck.
- source_word: vivificari
  choice: zum Leben gebracht werden
  rationale: Die passive Kausativbedeutung von „vivificare“ wird bewahrt und nicht vorschnell als Auferweckung, Rettung oder ewiges Leben spezifiziert.
theological_decisions:
- issue: Art der Entlastung von den Verfehlungen
  choice: von ihren Verfehlungen entlastet
  alternative: von ihrer Schuld befreit / ihre Verfehlungen würden ihnen erleichtert
  rationale: Der lateinische Wortlaut lässt offen, worin die Entlastung genau besteht. Die Übersetzung vermeidet daher eine ausdrückliche Festlegung auf Vergebung, Tilgung der Schuld oder Aufhebung zeitlicher Folgen.
- issue: Bedeutung von „vivificari“
  choice: zum Leben gebracht werden
  alternative: lebendig gemacht / gerettet werden
  rationale: Die allgemeinere Formulierung erhält die theologische Spannung des Verbs und importiert keine bestimmte Lehre über Auferstehung oder Heil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Anschluss „Und“ sowie das abschließende Komma bleiben erhalten, da der Vers Teil eines fortlaufenden Satz- und Gedankengefüges ist.
