  source_fidelity: 'Die Übersetzung gibt die argumentative Struktur des lateinischen Satzes zuverlässig wieder: die Gegenwartssituation (modo), das Anwachsen des corruptibile und die Vermehrung der Ungerechtigkeit, die Fürbitte der Gerechten für die Gottlosen sowie die auf die Zukunft gerichtete Frage. Das additive et in et tunc ist mit „auch“ angemessen erhalten.'
  naturalness: Der Satz ist trotz der bewusst komplexen Vorlage gut lesbares, würdiges modernes Standarddeutsch. „Da das Vergängliche zugenommen ... hat“ ist leicht literarisch, aber für den eschatologisch-philosophischen Kontext passend und verständlich.
  terminology: „Die Gerechten“, „Ungerechtigkeit“, „die Gottlosen“ und „für ... gebetet“ sind treffend und registergerecht. „Das Vergängliche“ bewahrt die substantivierte und semantisch nicht völlig festgelegte Form von corruptibile; die Fußnote dokumentiert die vertretbaren Alternativen ohne den Haupttext zu überladen.
