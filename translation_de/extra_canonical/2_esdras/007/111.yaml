id: 2ES.7.111
reference: 2 Esdras 7:111
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: de
  text: Wenn also die Gerechten jetzt, da das Vergängliche[a] zugenommen und die Ungerechtigkeit sich vervielfacht hat, für die Gottlosen gebetet haben, warum wird es dann nicht auch so sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Verderbliche«; auch: »die Vergänglichkeit«.'
    reason: Das lateinische corruptibile ist substantiviert und kann das Vergängliche, das dem Verderben Unterworfene oder abstrakter die Vergänglichkeit bezeichnen.
lexical_decisions:
- source_word: corruptibile
  choice: das Vergängliche
  rationale: Das substantivierte lateinische Adjektiv bezeichnet wörtlich das Vergängliche beziehungsweise dem Verderben Unterworfene. Die Wiedergabe bewahrt diesen Gedanken, ohne ihn vorschnell auf moralische Verderbnis zu verengen.
- source_word: exoraverunt
  choice: gebetet haben
  rationale: Im Zusammenhang bezeichnet das Verb die Fürbitte der Gerechten zugunsten der Gottlosen. »Gebetet haben« ist natürliches Deutsch und wahrt den religiösen Sinn.
- source_word: impiis
  choice: die Gottlosen
  rationale: Die geläufige substantivische Wiedergabe erfasst Menschen, die sich gegen Gott und das Rechte stellen, ohne eine spezifische Konfessionsterminologie einzuführen.
- source_word: et tunc
  choice: dann nicht auch
  rationale: Das additive et wird mit »auch« ausdrücklich bewahrt; tunc wird durch »dann« wiedergegeben.
theological_decisions:
- issue: Fürbitte der Gerechten für die Gottlosen zur Zeit des Gerichts
  choice: 'Die Frage bleibt offen formuliert: »warum wird es dann nicht auch so sein?«'
  alternative: Die Möglichkeit künftiger Fürbitte ausdrücklich bejahen oder verneinen
  rationale: Der lateinische Text stellt eine argumentative Frage und löst die darin liegende theologische Spannung in diesem Vers nicht auf. Die Übersetzung fügt daher keine dogmatische Antwort hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange lateinische Bedingungssatz wurde in natürlicher deutscher Wortfolge wiedergegeben; die Steigerung »zugenommen … sich vervielfacht« und die additive Kraft von et in »et tunc« bleiben erhalten.
