source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam maioris saeculi introitus spatiosi et securi et facientes inmortalitatis fructum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: de
  text: Denn die Zugänge zum größeren Zeitalter[a] sind weit und sicher und bringen die Frucht der Unsterblichkeit hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere alte Textzeugen: „zum kommenden Zeitalter“.'
    reason: textual_variant
lexical_decisions:
- source_word: nam
  choice: Denn
  rationale: Die lateinische Konjunktion ist hier begründend beziehungsweise erläuternd, nicht adversativ.
- source_word: maioris saeculi
  choice: zum größeren Zeitalter
  rationale: Dies gibt den vorgelegten lateinischen Text formal wieder. Andere alte Textzeugen stützen jedoch die Lesart „kommenden Zeitalter“, die deshalb in einer Fußnote bewahrt wird.
- source_word: introitus
  choice: Zugänge
  rationale: Der Plural und das Bild von Wegen beziehungsweise Eintrittsmöglichkeiten werden gewahrt; „Zugänge“ klingt im Deutschen natürlicher als „Eintritte“.
- source_word: spatiosi et securi
  choice: weit und sicher
  rationale: Die beiden prädikativen Adjektive werden knapp und bildhaft wiedergegeben.
- source_word: facientes inmortalitatis fructum
  choice: bringen die Frucht der Unsterblichkeit hervor
  rationale: „Hervorbringen“ bildet facientes direkt ab, während die Genitivverbindung und das Fruchtbild erhalten bleiben.
theological_decisions:
- issue: Bezeichnung des eschatologischen Zeitalters
  choice: größeren Zeitalter im Haupttext
  alternative: kommenden Zeitalter
  rationale: Der Haupttext folgt dem ausdrücklich vorgelegten lateinischen Wortlaut maioris. Da syrische und äthiopische Überlieferung offenbar eine Vorlage im Sinn von „kommend/zukünftig“ bezeugt und dies zum Gegensatz mit „diesem Zeitalter“ passt, wird die wichtige textliche Alternative nicht stillschweigend beseitigt, sondern vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Latein, ohne unnatürlich zu wirken; das apokalyptische Bild und die textkritische Spannung werden bewahrt.
