source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: de
  text: Wenn aber einem Menschen eine Stadt als Erbe gegeben wird und der Erbe die ihm vorgelegte Gefahr nicht durchschritten hat, wie wird er sein Erbe empfangen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: data dabitur
  choice: gegeben werden soll
  rationale: Die verdoppelte lateinische Form bezeichnet im Zusammenhang die in Aussicht gestellte Übergabe; die deutsche Fügung bewahrt den Zukunftsbezug, ohne eine im Deutschen unnatürliche Wortwiederholung einzuführen.
- source_word: civitas
  choice: Stadt
  rationale: Die gewöhnliche und kontextuell passende Bedeutung von civitas ist hier die als Erbe bestimmte Stadt.
- source_word: homini
  choice: einem Menschen
  rationale: Gibt homo geschlechtsübergreifend und in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: in hereditatem
  choice: als Erbe
  rationale: Natürliche deutsche Wiedergabe der Bestimmung beziehungsweise Zuweisung als Erbbesitz.
- source_word: antepositum periculum
  choice: die ihm vor Augen gestellte Gefahr
  rationale: Bewahrt das Bild von etwas, das dem Erben vorangestellt beziehungsweise vor Augen gestellt ist, und vermeidet die stärkere Deutung, die Gefahr sei ihm göttlich auferlegt.
- source_word: pertransierit
  choice: durchschritten hat
  rationale: Gibt den Gedanken des vollständigen Hindurchgehens wieder und passt zum räumlichen Bild der Gefahr auf dem Weg zur Stadt.
- source_word: accipiet hereditatem suam
  choice: wird er sein Erbe empfangen
  rationale: Nahe, idiomatische Wiedergabe von accipiet und hereditatem suam; die Wiederholung von Erbe/erben bleibt als rhetorischer Zusammenhang erhalten.
theological_decisions:
- issue: Verhältnis von Gefahr und Empfang des Erbes
  choice: Die Bedingung und die rhetorische Frage bleiben ausdrücklich bestehen.
  alternative: Die Aussage als allgemeine Lehre über verdienstliche Erlösung oder als bloße zeitliche Abfolge auslegen.
  rationale: Der Vers verknüpft das Durchschreiten der Gefahr mit dem Empfang des Erbes, erklärt aber nicht die umfassende theologische Grundlage dieser Beziehung; diese Spannung wird nicht dogmatisch aufgelöst.
- issue: Urheber der vorangestellten Gefahr
  choice: Keine handelnde Person wird ergänzt.
  alternative: Formulierungen wie „die Gott ihm auferlegt hat“.
  rationale: Das passive antepositum nennt den Urheber nicht; eine ausdrückliche Zuschreibung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hypothetische Konstruktion wurde zur besseren Verständlichkeit mit Doppelpunkt und nachgestelltem zweiten Bedingungssatz geordnet. Keine Fußnote erforderlich.
