revisions:
- from: 'Wenn aber eine Stadt einem Menschen als Erbe gegeben werden soll: Wie wird er sein Erbe empfangen, wenn der Erbe die ihm vor Augen gestellte Gefahr nicht durchschritten hat?'
  to: Wenn aber einem Menschen eine Stadt als Erbe gegeben wird und der Erbe die ihm vorgelegte Gefahr nicht durchschritten hat, wie wird er sein Erbe empfangen?
  rationale: Die Revision entfernt die durch „soll“ eingetragene Modalität, bewahrt den Zukunftsbezug idiomatisch durch „gegeben wird“ und stellt beide Bedingungen wie im lateinischen Satz voran. „Durchschritten“ erhält das Bild des vollständigen Hindurchgehens (pertransierit); „vorgelegte Gefahr“ gibt antepositum wieder, ohne den Urheber der Gefahr zu bestimmen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:07:20Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft Bild und Bedingungszusammenhang im Wesentlichen. „gegeben werden soll“ fügt jedoch eine modale Nuance („soll“) hinzu, die data dabitur nicht ausdrückt; die lateinische Form ist futurisch/passiv. Die Umstellung der beiden Bedingungssätze hinter einen Doppelpunkt ist verständlich, entfernt sich aber unnötig von der rhetorischen Abfolge des Originals.
  naturalness: Der Satz ist grundsätzlich verständlich und würdig. Eine lineare Bedingungskonstruktion ohne Doppelpunkt ist im modernen Standarddeutsch ebenso natürlich und macht die logische Abfolge klarer. „die ihm vorgelegte Gefahr“ ist eine natürliche, eng am antepositum orientierte Formulierung.
  terminology: „Stadt“, „Erbe“, „Erbe/Erben“ und „empfangen“ geben civitas, hereditas, heres und accipiet angemessen wieder. Für antepositum periculum ist „ihm vorgelegte Gefahr“ näher als „ihm vor Augen gestellte Gefahr“, ohne einen Urheber zu ergänzen.
  issues:
  - severity: medium
    issue: „gegeben werden soll“ ist modalisiert.
    rationale: Das lateinische data dabitur bedeutet wörtlich etwa „gegeben werden wird“ und bezeichnet eine zukünftige/passive Zuweisung. Das deutsche „soll“ kann Absicht, Verpflichtung oder Bestimmung ausdrücken und fügt daher eine nicht gesicherte Bedeutung hinzu.
  - severity: low
    issue: Die Satzordnung weicht ohne Not vom Original ab.
    rationale: Im Lateinischen stehen beide si-Sätze vor der rhetorischen Frage. Die Beibehaltung dieser Struktur erhöht die Transparenz der Argumentation.
  revised_text: Wenn aber einem Menschen eine Stadt als Erbe gegeben wird und der Erbe die ihm vorgelegte Gefahr nicht durchschritten hat, wie wird er sein Erbe empfangen?
