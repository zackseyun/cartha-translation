source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iocundentur. Multum enim melius est illis quam nobis, non enim sperant iudicium,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: de
  text: 'Denn ihnen geht es viel besser als uns: Sie erwarten kein Gericht und wissen weder von Qualen noch von dem Heil, das nach dem Tod verheißen ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: Denn ihnen geht es viel besser als uns
  rationale: Gibt die lateinische Vergleichskonstruktion natürlich und zugleich eng am Wortlaut wieder; „denn“ bewahrt die begründende Verbindung zum vorausgehenden Zusammenhang.
- source_word: sperant iudicium
  choice: sie erwarten kein Gericht
  rationale: „sperare“ kann hoffen oder erwarten bedeuten; bei einem kommenden Gericht ist „erwarten“ im Deutschen sachlich und lässt offen, wie dieses Gericht bewertet wird.
- source_word: tormenta
  choice: Qualen
  rationale: Entspricht dem Sinn körperlicher oder jenseitiger Pein, ohne deren genaue Art näher festzulegen.
- source_word: salutem post mortem promissam
  choice: das Heil, das nach dem Tod verheißen ist
  rationale: „Heil“ gibt „salus“ in seinem umfassenden religiösen Sinn wieder; der Relativsatz bildet die lateinische Partizipialfügung in natürlichem Deutsch ab.
theological_decisions:
- issue: Bedeutung von „iudicium“
  choice: Gericht
  alternative: Urteil
  rationale: „Gericht“ bewahrt den eschatologischen Vorgang und legt nicht vorzeitig fest, ob nur der Urteilsspruch oder das gesamte Gerichtsgeschehen gemeint ist.
- issue: Umfang des verheißenen Heils
  choice: Heil
  alternative: Rettung
  rationale: „Heil“ lässt den umfassenden theologischen Gehalt von „salus“ offen und beschränkt die Aussage nicht auf die Befreiung aus einer bestimmten Gefahr.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die begründende Erläuterung klar, ohne die Aussage theologisch auszudeuten. Der eingereichte lateinische Ausschnitt bricht nach „iudicium“ ab; die anschließenden Satzglieder werden gemäß der auditierten englischen Konsultationsschicht wiedergegeben.
