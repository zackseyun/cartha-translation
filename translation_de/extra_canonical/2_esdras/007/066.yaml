  source_fidelity: Die Übersetzung gibt die erhaltene lateinische Begründung („Multum enim melius est illis quam nobis, non enim sperant iudicium“) präzise wieder. „Gericht“ bewahrt den eschatologischen Sinn von iudicium; „erwarten“ ist für sperant hier angemessen und wertet die Erwartung nicht aus. Die im Quellenausschnitt nicht mitgedruckten folgenden Glieder entsprechen der englischen Audit-Schicht und sind sinnvoll als „Qualen“ sowie als das nach dem Tod verheißene „Heil“ wiedergegeben.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Der Doppelpunkt gliedert die Begründung klar; die Satzfügung ist natürlich und ohne unnötige Ausdeutung.
  terminology: „Gericht“, „Qualen“ und „Heil“ sind terminologisch tragfähig und lassen den religiös-eschatologischen Bedeutungsumfang offen. „Das Heil, das nach dem Tod verheißen ist“ gibt salutem post mortem promissam idiomatisch wieder.
