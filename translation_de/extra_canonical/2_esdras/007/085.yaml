  text: 'Der fünfte Weg: Sie sehen, wie die Wohnstätte der anderen von Engeln bewacht wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinta uia
  choice: Der fünfte Weg
  rationale: Gibt die nummerierte Folge knapp und unmittelbar wieder.
- source_word: aliorum habitaculum
  choice: die Wohnstätte der anderen
  rationale: Bewahrt sowohl den Singular von habitaculum als auch die unbestimmte Bezugnahme von aliorum, ohne die anderen ausdrücklich als eine bestimmte Gruppe zu identifizieren.
- source_word: ab angelis conseruari
  choice: von Engeln bewacht wird
  rationale: Der passive Infinitiv conseruari bezeichnet hier das behütende Bewahren der Wohnstätte; „bewacht wird“ ist im Deutschen natürlich und entspricht dem Kontext.
theological_decisions:
- issue: Identität der „anderen“
  choice: der anderen
  alternative: der Gerechten
  rationale: Der lateinische Text nennt die Gruppe nicht ausdrücklich; die offene Bezeichnung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Singular „Wohnstätte“ folgt genau dem lateinischen habitaculum; eine pluralische Alternative ist daher nicht aufgenommen.
