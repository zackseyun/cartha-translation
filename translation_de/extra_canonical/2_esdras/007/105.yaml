  yaml_path: translation/extra_canonical/2_esdras/007/105.yaml
  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
translation:
  language: de
  text: oder einen besonders lieben Freund, damit er für ihn[a] verstehen, schlafen, essen oder geheilt werden kann; so wird niemals jemand für einen anderen beten, denn dann werden alle – jeder Einzelne – seine eigenen Ungerechtigkeiten oder Gerechtigkeiten tragen.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch ihn« beziehungsweise »an seiner Stelle«. Der Bezug und die genaue Funktion des lateinischen »eo« sind in diesem Satzfragment nicht eindeutig.'
    reason: textual_or_linguistic_ambiguity
lexical_decisions:
- source_word: eo
  choice: für ihn
  rationale: Das lateinische Pronomen ist in diesem Satzfragment mehrdeutig. »Für ihn« folgt der naheliegenden stellvertretenden Bedeutung, ohne den Bezug durch eine nähere Benennung festzulegen.
- source_word: intellegat
  choice: zur Einsicht kommt
  rationale: Gibt den Vorgang des Verstehens idiomatisch wieder und passt zur Reihe der Tätigkeiten bzw. Zustände.
- source_word: curetur
  choice: geheilt wird
  rationale: Bewahrt das Passiv des lateinischen Konjunktivs.
- source_word: rogabit
  choice: bitten
  rationale: Im Kontext ist Fürbitte gemeint; »bitten« erhält jedoch die allgemeinere lexikalische Bedeutung des Verbs.
- source_word: iniustitias suas aut iustitias
  choice: ihre eigenen ungerechten oder gerechten Taten
  rationale: Die abstrakten Pluralformen bezeichnen hier am natürlichsten die jeweils eigenen ungerechten bzw. gerechten Handlungen; die Parallelität und der Plural bleiben erhalten.
theological_decisions:
- issue: Begründung der Unmöglichkeit stellvertretender Fürbitte
  choice: denn
  alternative: aber
  rationale: Lateinisch »enim« begründet die vorangehende Aussage und bezeichnet keinen Gegensatz.
- issue: Universale und individuelle Verantwortung im Gericht
  choice: alle – jeder Einzelne –
  alternative: jeder
  rationale: Diese Formulierung bewahrt sowohl »omnes« als auch »unusquisque« und damit die Spannung zwischen der Gesamtheit und der persönlichen Verantwortung.
- issue: Zuordnung von »tunc«
  choice: denn dann werden alle ... tragen
  alternative: so wird dann niemals jemand ... bitten
  rationale: Die lateinische Stellung verbindet »tunc« am ehesten mit »portabunt«; der Zeitpunkt gehört daher zum Tragen der eigenen Taten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt mitten in einer Aufzählung ein; deshalb beginnt der Text kleingeschrieben. Der Gedankenstrich macht die lateinische Doppelung »alle – jeder Einzelne« lesbar, ohne eines ihrer Elemente auszulassen.
