lexical_decisions:
- source_word: quem
  choice: den
  rationale: Das lateinische Relativpronomen steht im maskulinen Akkusativ Singular; die Übersetzung bewahrt den fragmentarisch vorausgesetzten Bezug.
- source_word: incipient ... iudicari
  choice: sie ... zu richten beginnen werden
  rationale: Die überlieferte Form iudicari ist im bereinigten Fragment inhaltlich als Vorgang des Richtens wiedergegeben; die unbestimmte Subjektform „sie“ folgt der konsultierten Textfassung, ohne eine Identität zu ergänzen.
- source_word: in nouissimis temporibus
  choice: in den letzten Zeiten
  rationale: Wörtliche und im Deutschen verständliche Wiedergabe der eschatologischen Zeitangabe, ohne sie präziser als die Quelle zu bestimmen.
- source_word: Nam
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss des neuen, jedoch abgebrochenen Satzes.
- source_word: eorum qui uias seruaue-
  choice: von denen, die die Wege bewahrt ha-
  rationale: Gibt Genitiv, Relativsatz und den materiellen Wortabbruch sichtbar wieder, ohne den fehlenden Fortgang aus einer anderen Textform zu ergänzen.
theological_decisions:
- issue: Unbestimmte Richter und unvollständiger Zusammenhang
  choice: Das Subjekt bleibt als „sie“ unbestimmt, und der Text endet mitten im Wort.
  alternative: Die Richter oder das Objekt aus dem weiteren Kontext identifizieren und den Satz vervollständigen.
  rationale: Der erhaltene lateinische Ausschnitt erlaubt keine sichere Identifizierung; eine Ergänzung würde die fragmentarische Quellenlage und mögliche theologische Spannung verdecken.
- issue: Eschatologische Zeitangabe
  choice: „in den letzten Zeiten“
  alternative: „am Ende der Zeit“ oder „in den letzten Tagen“
  rationale: Die gewählte Form bildet den lateinischen Plural temporibus ab und vermeidet eine nicht ausdrücklich vorhandene Vereinheitlichung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ungewöhnliche Beginn mit einem Relativpronomen sowie der Abbruch „ha-“ sind bewusst erhalten, weil der zugrunde liegende lateinische Text an beiden Seiten fragmentarisch ist.
