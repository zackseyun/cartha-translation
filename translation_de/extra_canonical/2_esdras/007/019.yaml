base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/019.yaml
  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Du bist kein besserer Richter als der Herr und nicht verständiger als der Höchste.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das lateinische super kann hier vergleichend (»mehr/besser als«) oder hierarchisch (»über«) verstanden werden. Bei hierarchischem Verständnis lautet der Sinn etwa: »Du bist kein Richter über den Herrn und nicht verständiger als jemand über den Höchsten.«'
    reason: Die Anmerkung bewahrt die umstrittene mögliche hierarchische Deutung, ohne die missverständliche Formulierung der bisherigen Fußnote als wörtliche Übersetzung auszugeben.
lexical_decisions:
- source_word: iudex
  choice: Richter
  rationale: Gibt das lateinische Substantiv direkt und würdevoll wieder.
- source_word: super
  choice: besser … als / verständiger als
  rationale: Im parallelen Zusammenhang wird super vergleichend verstanden; dadurch entsteht im Deutschen eine natürliche, in beiden Satzgliedern gleichartige Gegenüberstellung.
- source_word: intellegens
  choice: verständiger
  rationale: Bewahrt den Bezug auf Einsicht und Verstehen und passt zur vergleichenden Konstruktion mit super.
- source_word: Altissimum
  choice: der Höchste
  rationale: Die etablierte und präzise Gottesbezeichnung entspricht dem lateinischen Superlativ.
theological_decisions:
- issue: Bedeutung von super in beiden parallelen Satzgliedern
  choice: 'vergleichend: „besser … als“ und „verständiger als“'
  alternative: 'hierarchisch-räumlich: „Richter über den Herrn“ und „einer, der über dem Höchsten Einsicht besitzt“'
  rationale: Die parallele Konstruktion non … super … neque … super legt für beide Glieder dieselbe Funktion nahe. Eine vergleichende Wiedergabe ergibt einen verständlichen Sinn, ohne Esras Befugnis zu einem Urteil über Gott zum alleinigen Thema zu machen; die formnähere hierarchische Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede ist direkt und klar; die syntaktische Parallelität des lateinischen Satzes bleibt weitgehend erhalten.
