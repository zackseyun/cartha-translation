id: 2ES.7.98
reference: 2 Esdras 7:98
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: de
  text: 'Die siebte Stufe, die höher ist als alle zuvor genannten: Sie werden voller Zuversicht jubeln, vertrauen, ohne beschämt zu werden, und sich ohne Furcht freuen; denn sie eilen, das Angesicht dessen zu sehen, dem sie zu Lebzeiten gedient haben und von dem sie, nun verherrlicht, ihren Lohn empfangen sollen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ordo
  choice: Stufe
  rationale: Im Zusammenhang der aufeinanderfolgenden Zustände beziehungsweise Ränge bezeichnet „ordo“ eine Stufe; „Ordnung“ wäre im modernen Deutsch missverständlich.
- source_word: exultabunt cum fiducia
  choice: werden voller Zuversicht jubeln
  rationale: Gibt sowohl die ausgelassene Freude von „exultabunt“ als auch die sichere Zuversicht von „fiducia“ natürlich wieder.
- source_word: confidebunt non confusi
  choice: vertrauen, ohne beschämt zu werden
  rationale: Bewahrt den Zusammenhang zwischen Vertrauen und dem Ausbleiben von Beschämung; „confusi“ meint hier eher zuschanden oder beschämt werden als bloße Verwirrung.
- source_word: gaudebunt non reuerentes
  choice: sich ohne Furcht freuen
  rationale: „reverentes“ trägt hier im negierten eschatologischen Zusammenhang den Sinn von Scheu oder Furcht.
- source_word: festinant uidere uultum
  choice: sie eilen, das Angesicht … zu sehen
  rationale: Bewahrt die Dringlichkeit von „festinant“ und die biblisch geprägte, würdevolle Wendung „das Angesicht sehen“.
- source_word: gloriosi
  choice: nun verherrlicht
  rationale: Das nominativische Adjektiv bezieht sich auf die Empfangenden, nicht auf „Lohn“; „nun“ verdeutlicht knapp ihren dann bestehenden Zustand, ohne den Lohn selbst als herrlich umzudeuten.
- source_word: mercedem
  choice: Lohn
  rationale: Die geläufige und kontextgerechte Entsprechung für eine von dem Herrn gewährte Vergeltung beziehungsweise Belohnung.
theological_decisions:
- issue: Bezug von „gloriosi“
  choice: Die Dienenden sind verherrlicht und empfangen in diesem Zustand ihren Lohn.
  alternative: Sie empfangen einen herrlichen Lohn.
  rationale: Die lateinische Form „gloriosi“ ist Nominativ Plural und bestimmt das Subjekt, nicht das Akkusativobjekt „mercedem“.
- issue: Identität dessen, dessen Angesicht sie sehen
  choice: Mit „dessen“ bleibt die im Satz vorausgesetzte Person unbenannt.
  alternative: Explizite Wiedergabe als „Gott“ oder „der Herr“.
  rationale: Die Übersetzung soll keine im vorliegenden Wortlaut nicht ausdrücklich stehende Benennung ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischer Färbung bei „das Angesicht sehen“. Der Satzbau folgt der rhetorischen Steigerung des Lateinischen, bleibt aber für heutige Leser gut erfassbar. Die im englischen Konsultationstext überlieferte ältere Alternativdeutung von „gloriosi“ wurde wegen der eindeutigen lateinischen Kongruenz nicht als Fußnote beibehalten.
