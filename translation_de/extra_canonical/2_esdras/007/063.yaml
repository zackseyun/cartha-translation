source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: factus est de puluere, sicut et cetera creatura! Melius enim erat ipsum pulverem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: de
  text: Denn es wäre besser gewesen, wenn der Staub selbst nicht entstanden wäre, damit aus ihm nicht Einsicht hervorgegangen wäre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Melius enim erat
  choice: Denn es wäre besser gewesen
  rationale: Gibt die rückblickende, irreale Wertung des lateinischen Ausdrucks in natürlichem modernem Deutsch wieder.
- source_word: ipsum pulverem
  choice: der Staub selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung durch „ipsum“ und das Schöpfungsmotiv von „pulvis“.
- source_word: factus est / come into being
  choice: entstanden wäre
  rationale: „Entstanden“ passt sachlich zu Staub und Schöpfung und vermeidet das bei unbelebter Materie missverständliche „geboren“.
- source_word: understanding
  choice: Einsicht
  rationale: Bezeichnet das aus dem Staub hervorgehende Erkenntnisvermögen, ohne es vorschnell auf bloße Vernunft oder eine bestimmte theologische Anthropologie einzuengen.
theological_decisions:
- issue: Bezug des Staubes auf den Menschen
  choice: Die bildhafte Rede vom „Staub selbst“ bleibt stehen.
  alternative: Den Staub ausdrücklich als „den aus Staub geschaffenen Menschen“ deuten.
  rationale: Die Formulierung bewahrt das Schöpfungsbild und die Spannung des Textes, ohne die Metapher erklärend aufzulösen.
- issue: Art des aus dem Staub hervorgehenden Erkenntnisvermögens
  choice: „Einsicht“
  alternative: „Verstand“ oder „Vernunft“
  rationale: „Einsicht“ lässt offen, ob allgemein menschliches Verstehen, moralische Erkenntnis oder ein umfassenderes Erkenntnisvermögen gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der irreale Rückblick wird durch den Konjunktiv II („wäre … gewesen“, „wäre“) klar ausgedrückt; die knappe Parallelität des Satzes bleibt erhalten.
