  yaml_path: translation/extra_canonical/2_esdras/007/050.yaml
  text: For this reason the Most High did not make one age, but two.
translation:
  language: de
  text: Darum hat der Höchste nicht ein einziges Zeitalter geschaffen, sondern zwei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter hoc
  choice: Darum
  rationale: Gibt die begründende Folgerung knapp und natürlich wieder.
- source_word: Altissimus
  choice: der Höchste
  rationale: Bewahrt den traditionellen Gottesbegriff und die substantivische Form des lateinischen Titels.
- source_word: saeculum
  choice: Zeitalter
  rationale: Passt zum eschatologischen Gegensatz zweier Zeitalter; „Welt“ wäre möglich, würde die zeitliche Dimension aber weniger deutlich ausdrücken.
- source_word: unum … duo
  choice: nicht ein einziges … sondern zwei
  rationale: Bewahrt den ausdrücklichen Gegensatz und klingt im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Verhältnis der beiden Zeitalter
  choice: Die Aussage bleibt auf die Existenz zweier Zeitalter beschränkt.
  alternative: Die Zeitalter ausdrücklich als gegenwärtige und zukünftige Weltzeit bestimmen.
  rationale: Der Vers selbst benennt oder erläutert die beiden Zeitalter nicht; die Übersetzung soll diese Deutung nicht in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und sentenzartig entsprechend der lateinischen Aussage.
