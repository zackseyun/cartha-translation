base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: de
  text: Doch nun wächst das Bewusstsein mit uns, und deshalb werden wir gequält, weil wir im Wissen darum zugrunde gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil wir wissend zugrunde gehen“.'
    reason: Die Fußnote macht die knappe partizipiale Ausdrucksweise sichtbar und wahrt ihre leichte grammatische Offenheit, ohne sie konzessiv umzudeuten.
lexical_decisions:
- source_word: sensus
  choice: Bewusstsein
  rationale: Im Zusammenhang bezeichnet sensus nicht nur abstrakten Verstand, sondern das wachsende bewusste Erkennen der eigenen Lage. „Bewusstsein“ gibt den Gedankengang natürlicher und genauer wieder als „Verstand“.
- source_word: nobiscum crescit
  choice: wächst mit uns
  rationale: 'Die bildhafte lateinische Formulierung wird eng bewahrt: Das Bewusstsein entwickelt sich zusammen mit dem Menschen.'
- source_word: torquemur
  choice: werden wir gequält
  rationale: Bewahrt die starke Leidenssprache und den passivischen Ausdruck, ohne den Urheber der Qual festzulegen.
- source_word: scientes perimus
  choice: gehen wir im Wissen darum zugrunde
  rationale: 'Das Partizip wird modal beziehungsweise begleitend verstanden: Die Menschen gehen in vollem Bewusstsein ihres Geschicks zugrunde, nicht trotz eines Wissens, das sie hätte retten sollen.'
theological_decisions:
- issue: Funktion des Wissens beim Zugrundegehen
  choice: Das Wissen verschärft die Qual, weil der Mensch sein Zugrundegehen bewusst erlebt.
  alternative: „Obwohl wir wissen, gehen wir zugrunde“, als ob Wissen eine erwartete Rettungswirkung hätte.
  rationale: Der Argumentationszusammenhang stellt sensus als Ursache bewusster Qual dar. Eine konzessive Wiedergabe würde eine im Text nicht ausgesagte Spannung zwischen Wissen und Rettung einführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Wissen darum“ ist allgemein verständlich und bringt deutlicher als „wissentlich“ zum Ausdruck, dass das Bewusstsein des eigenen Untergangs die Qual verursacht. Der im bereitgestellten lateinischen Ausschnitt ausdrücklich belegte Anfang lautet „Nunc autem nobiscum crescit sensus“; die Fortsetzung folgt der auditierten Überlieferungsangabe mit torquemur und scientes perimus.
