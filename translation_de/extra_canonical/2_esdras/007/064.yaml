  source_fidelity: '„sensus“ ist im gegebenen Kontext treffend als „Bewusstsein“ wiedergegeben. „wächst mit uns“ bildet „nobiscum crescit“ angemessen ab. Die Wiedergabe von „scientes perimus“ als „wir im Wissen darum zugrunde gehen“ wahrt die begleitend-modale Aussage: Das Bewusstsein des eigenen Untergangs verschärft die Qual; eine konzessive Deutung wird vermieden. Die über den lateinischen Ausschnitt hinausgehende Satzfortsetzung stimmt mit dem auditierten englischen Text überein.'
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. „Im Wissen darum zugrunde gehen“ ist idiomatisch genug und präzisiert den im Kontext gemeinten Bezug, ohne unnötig zu paraphrasieren.
  terminology: „Bewusstsein“ ist hier gegenüber einem rein intellektuellen „Verstand“ die passende Wahl für sensus. „gequält“ gibt die starke passive Leidensaussage wieder, ohne eine nicht genannte Ursache oder einen Urheber festzulegen. Theologisch oder konfessionell lenkende Zusätze liegen nicht vor.
