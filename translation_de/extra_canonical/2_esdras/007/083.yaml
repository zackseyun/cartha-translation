base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/083.yaml
  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: de
  text: 'Der dritte Weg: Sie sehen den Lohn, der für diejenigen bereitliegt, die den Bündnissen des Höchsten vertraut haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  choice: Der dritte Weg
  rationale: Gibt die Gliederung und das Bild des lateinischen Textes unmittelbar und natürlich wieder.
- source_word: uident
  choice: Sie sehen
  rationale: Bewahrt das Präsens und die direkte Aussage des lateinischen Verbs.
- source_word: repositam mercedem
  choice: den Lohn, der … bereitliegt
  rationale: Repositam bezeichnet einen zurückgelegten beziehungsweise aufbewahrten Lohn; „bereitliegt“ klingt im Deutschen natürlich und erhält diesen Sinn.
- source_word: testamentis … crediderunt
  choice: den Bundesschlüssen … vertraut haben
  rationale: Die Fortsetzung ist im bereitgestellten lateinischen Ausschnitt nicht enthalten, wird jedoch durch die geprüfte englische Konsultationsfassung bezeugt. „Bundesschlüsse“ wahrt den theologischen Gehalt von testamenta, während „vertraut haben“ die personale und verlässliche Dimension von credere ausdrückt.
- source_word: Altissimi
  choice: des Höchsten
  rationale: Die übliche, würdevolle deutsche Wiedergabe des Gottesprädikats.
theological_decisions:
- issue: Bedeutung von testamenta
  choice: Bundesschlüsse
  alternative: Verheißungen / Testamente
  rationale: „Bundesschlüsse“ bewahrt die mögliche heilsgeschichtliche Bedeutung, ohne den Ausdruck auf bloße Zusagen oder schriftliche Testamente zu verengen.
- issue: Wiedergabe von credere mit Dativ
  choice: vertraut haben
  alternative: geglaubt haben
  rationale: „Vertrauen“ gibt die auf die Bundesschlüsse gerichtete Haltung idiomatischer wieder; es legt dabei nicht fest, ob vor allem Fürwahrhalten oder treue Zuversicht gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe aufzählende Form bleibt erhalten. Da der übermittelte lateinische Ausschnitt nach „his qui“ abbricht, folgt der Schluss der geprüften englischen Konsultationsschicht; die Formulierung entspricht der zu erwartenden lateinischen Fortsetzung.
