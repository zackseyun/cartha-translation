source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarta autem die imperasti fieri solis splendorem, lunae lumen stellarum dispositionem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/045.yaml
  text: On the fourth day you commanded the brightness of the sun[a], the light of the moon, and the arrangement of the stars to be made,
translation:
  language: de
  text: Am vierten Tag aber befahlst du, dass der Glanz der Sonne, das Licht des Mondes und die Anordnung der Sterne entstehen sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quarta autem die
  choice: Am vierten Tag aber
  rationale: Gibt die zeitliche Bestimmung und die leicht weiterführende beziehungsweise kontrastierende Partikel »autem« natürlich und zugleich sichtbar wieder.
- source_word: imperasti fieri
  choice: befahlst du, … entstehen zu lassen
  rationale: Das lateinische »fieri« bezeichnet das Werden beziehungsweise Ins-Dasein-Kommen. Die Formulierung lässt das Verb wie im Latein alle drei Akkusativobjekte regieren.
- source_word: solis splendorem
  choice: den Glanz der Sonne
  rationale: Formale und im Deutschen natürliche Entsprechung für »splendor«; sie vermeidet eine unnötige Gleichsetzung mit dem nachfolgenden »lumen«.
- source_word: lunae lumen
  choice: das Licht des Mondes
  rationale: Bewahrt die lexikalische Unterscheidung zwischen »splendor« (Glanz) und »lumen« (Licht).
- source_word: stellarum dispositionem
  choice: die Anordnung der Sterne
  rationale: »Anordnung« gibt »dispositio« in diesem kosmischen Kontext präzise und ohne zusätzliche Ausdeutung wieder.
theological_decisions:
- issue: Reichweite von »fieri«
  choice: »entstehen zu lassen« bezieht sich auf den Glanz der Sonne, das Licht des Mondes und die Anordnung der Sterne.
  alternative: Das Werden nur ausdrücklich mit dem Glanz der Sonne verbinden.
  rationale: Im lateinischen Satz steht »fieri« vor einer koordinierten Reihe von drei Akkusativobjekten und regiert syntaktisch am natürlichsten die gesamte Reihe.
- issue: Gegenstand des Schöpfungsbefehls
  choice: Wörtlich werden Glanz, Licht und Anordnung als hervorgebrachte Größen genannt.
  alternative: Sonne, Mond und Sterne selbst als geschaffen wiedergeben.
  rationale: Die Übersetzung bewahrt die konkrete Ausdrucksweise der lateinischen Quelle und fügt keine ontologische Präzisierung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält den dreigliedrigen Parallelismus klar und vermeidet, dass »entstehen zu lassen« nur auf das erste Glied bezogen wird.
