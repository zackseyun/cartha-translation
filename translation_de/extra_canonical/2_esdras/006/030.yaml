lexical_decisions:
- source_word: haec
  choice: dies
  rationale: Das neutrale Demonstrativpronomen bewahrt den knappen Rückverweis des Lateinischen.
- source_word: veni tibi ostendere
  choice: ich bin gekommen, um dir … zu zeigen
  rationale: Gibt die Bewegungsform mit finalem Infinitiv natürlich und zugleich eng am lateinischen Wortlaut wieder.
- source_word: venturae nocti
  choice: in der kommenden Nacht
  rationale: Folgt der weithin anerkannten Emendation zu einer temporalen Wendung wie „hac ventura nocte“ und bereitet den Gegensatz zum folgenden „am Tag“ vor.
theological_decisions: []
