  text: And he said to me[a], “I have come to show you these things tonight.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Ich bin gekommen, um dir diese Dinge in der kommenden Nacht zu zeigen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Text ist am Schluss verderbt (wörtlich etwa: „und der kommenden Nacht“). Die Übersetzung folgt einer naheliegenden, vom Kontext gestützten Ergänzung: „in dieser kommenden Nacht“.'
