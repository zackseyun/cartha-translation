  yaml_path: translation/extra_canonical/2_esdras/006/002.yaml
  text: and before the voices of the thunders sounded, and before the flashes of the lightnings shone, and before the foundations of paradise were established,
translation:
  language: de
  text: und bevor die Stimmen der Donner ertönten, und bevor die Blitze aufleuchteten, und bevor die Fundamente des Paradieses gefestigt wurden,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: voces tonitruum
  choice: die Stimmen der Donner
  rationale: Die auffällige Bildsprache des lateinischen Plurals wird formal bewahrt; „Stimmen“ gibt voces unmittelbar wieder.
- source_word: nitores coruscuum
  choice: die Blitze
  rationale: Die Wendung bezeichnet die leuchtenden Erscheinungen der Blitze. Im Deutschen vermeidet „Blitze“ eine schwerfällige Doppelung wie „Lichtscheine der Blitze“, während „aufleuchteten“ den Glanzaspekt von nitores und splenderent ausdrückt.
- source_word: confirmarentur
  choice: befestigt wurden
  rationale: Die Grundbedeutung des Festmachens bzw. Festigens passt zur Rede von Grundfesten und wahrt das anschauliche Bild besser als das abstraktere „festgelegt“.
- source_word: fundamenta paradisi
  choice: die Grundfesten des Paradieses
  rationale: „Grundfesten“ ist eine natürliche, würdige Wiedergabe von fundamenta und erhält die kosmische Bauvorstellung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener dreifacher Anapher „und bevor“. Die ungewöhnliche Pluralform „Donner“ folgt der lateinischen Bildsprache.
