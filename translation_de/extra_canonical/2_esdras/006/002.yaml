    issue: „Grundfesten des Paradieses befestigt wurden“ ist stilistisch und semantisch weniger genau.
    rationale: Die Wortverbindung wiederholt denselben Festigkeitsgedanken und „befestigen“ kann ein Sicherungs- oder Verstärkungshandeln implizieren. „Fundamente ... gefestigt“ bildet fundamenta und confirmarentur klarer ab.
