base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: de
  text: 'Und ich sagte: »O Herr, zu Beginn der Schöpfung, am ersten Tag, hast du gesprochen[a] und gesagt: ›Himmel und Erde sollen entstehen‹, und dein Wort führte das Werk aus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »redend hast du geredet«; eine emphatische Wiederholung.'
    reason: Gibt die auffällige lateinische Doppelung loquens locutus es wieder, ohne die Betonung mit einer inhaltlich engeren Formulierung wie »ausdrücklich« festzulegen.
lexical_decisions:
- source_word: loquens locutus es
  choice: hast du ausdrücklich gesprochen
  rationale: Die verdoppelte Redeform ist im Deutschen nicht wörtlich natürlich wiederzugeben. »ausdrücklich« bewahrt ihren emphatischen Charakter, ohne eine zusätzliche inhaltliche Aussage einzuführen.
- source_word: fiat caelum et terra
  choice: Himmel und Erde sollen entstehen
  rationale: »Entstehen« gibt das schöpferische fiat idiomatisch und würdig wieder; der deutsche Jussiv mit »sollen« bewahrt den gebietenden Charakter.
- source_word: tuum verbum
  choice: dein Wort
  rationale: Die formale Entsprechung erhält die mögliche theologische Tragweite, ohne sie näher festzulegen.
- source_word: opus perfecit
  choice: vollendete das Werk
  rationale: Bewahrt sowohl das ausdrücklich genannte Werk als auch den Aspekt der erfolgreichen Vollendung.
theological_decisions:
- issue: Mögliche personale Bedeutung von »dein Wort«
  choice: dein Wort
  alternative: dein Befehl
  rationale: Die Übersetzung lässt offen, ob »Wort« hier lediglich Gottes schöpferische Rede oder darüber hinaus eine personale Wirklichkeit bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische lateinische Doppelung wird idiomatisch markiert; die zeitlichen Angaben bleiben in der Reihenfolge der Quelle.
