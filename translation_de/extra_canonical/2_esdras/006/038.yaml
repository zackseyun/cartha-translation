- from: 'Und ich sagte: »O Herr, von Anfang der Schöpfung an, am ersten Tag, hast du ausdrücklich gesprochen: ›Himmel und Erde sollen entstehen‹, und dein Wort vollendete das Werk.«'
  to: 'Und ich sagte: »O Herr, zu Beginn der Schöpfung, am ersten Tag, hast du gesprochen[a] und gesagt: ›Himmel und Erde sollen entstehen‹, und dein Wort führte das Werk aus.«'
  rationale: Die Revision ersetzt die semantisch zu enge Wiedergabe der emphatischen Doppelung durch eine idiomatische deutsche Form mit textnaher Fußnote, glättet die Zeitangabe und gibt opus perfecit als Ausführung des Werkes wieder. Die Aussage und ihre theologische Offenheit bleiben unverändert.
