base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: de
  text: Die übrigen Völker aber, die von Adam abstammen, hast du als nichts bezeichnet. Du hast gesagt, sie seien dem Speichel gleich, und ihre Menge hast du mit einem Tropfen aus einem Gefäß verglichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: Die übrigen Völker aber
  rationale: Gibt den adversativen Anschluss und die kollektive Bedeutung von gentes natürlich und genau wieder.
- source_word: ab Adam natas
  choice: die von Adam abstammen
  rationale: Das lateinische natas bezeichnet hier ihre Herkunft; „abstammen“ ist im Deutschen idiomatischer als eine wörtliche Wiedergabe mit „geboren“.
- source_word: dixisti eas nihil esse
  choice: hast du für nichts erklärt
  rationale: Bewahrt die starke Wertung des lateinischen nihil esse und formuliert sie in natürlichem Deutsch.
- source_word: salivae adsimilatae sunt
  choice: sie seien wie Speichel
  rationale: Gibt den anstößig-geringschätzigen Vergleich unverharmlost wieder; der Konjunktiv markiert die berichtete Aussage.
- source_word: abundantiam eorum
  choice: ihre große Menge
  rationale: Bezeichnet hier am ehesten die zahlenmäßige Fülle der Völker beziehungsweise ihrer Angehörigen.
- source_word: sicut stillicidium de vaso
  choice: mit einem Tropfen aus einem Gefäß
  rationale: Folgt dem Bild des lateinischen Textes; „Tropfen“ ist im gegenwärtigen Deutsch natürlicher als „Tröpfeln“.
theological_decisions:
- issue: Geringschätzige Darstellung der übrigen Völker
  choice: Die drastischen Vergleiche „für nichts“ und „wie Speichel“ bleiben erhalten.
  alternative: Die Aussage durch Formulierungen wie „unbedeutend“ oder „gering“ abmildern.
  rationale: Der Vers gibt eine an Gott gerichtete Aussage wieder, deren theologische Spannung nicht durch beschönigende Übersetzung aufgelöst werden darf.
- issue: Bezug von eorum
  choice: Das Possessivpronomen „ihre“ lässt den Bezug auf die übrigen Völker im Deutschen bestehen.
  alternative: Explizit „die Menge ihrer Angehörigen“ schreiben.
  rationale: Der lateinische Wortlaut bleibt knapp und lässt offen, ob primär die Völker als Gesamtheit oder deren Menschenmenge gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Ausgangstext. Die Satzstruktur wurde leicht gegliedert, damit die wiederholten Aussagen klar verständlich bleiben; die drastische Bildsprache wurde nicht abgeschwächt.
