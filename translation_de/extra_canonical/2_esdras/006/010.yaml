  source_fidelity: Die Übersetzung gibt alle Satzglieder des lateinischen Textes wieder und bewahrt den am Versende offenen Konditionalsatz. „Frage nichts anderes“ trifft aliud und noli querere angemessen. Der Anschluss mit „Da“ ist jedoch gegenüber dem einfachen et leicht interpretierend; „Und“ entspricht dem Quellentext unmittelbarer.
