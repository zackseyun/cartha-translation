  text: “Do not ask anything else[a], Ezra.” And I answered and said, “O Lord who rules, if I have found favor
translation:
  language: de
  text: '„Frage nichts anderes, Esra.“ Und ich antwortete und sagte: „O Herrscher, Herr, wenn ich Gnade gefunden habe'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aliud
  choice: etwas anderes
  rationale: Gibt den unbestimmten substantivischen Gebrauch von aliud unmittelbar wieder, ohne ihn zeitlich als „weiter“ festzulegen.
- source_word: noli querere
  choice: Frage nichts
  rationale: Die verneinte Aufforderung wird im Deutschen natürlich und knapp als Imperativ wiedergegeben.
- source_word: Et respondi et dixi
  choice: Da antwortete ich und sagte
  rationale: Bewahrt beide lateinischen Verben; „Da“ sorgt für einen natürlichen erzählerischen Anschluss.
- source_word: dominator domine
  choice: O Herrscher, Herr
  rationale: Gibt beide Anredeformen wieder und wahrt ihre auffällige Verbindung, statt sie zu einem einzigen theologischen Titel zu verschmelzen.
- source_word: si inueni gratiam
  choice: wenn ich Gnade gefunden habe
  rationale: Entspricht der konditionalen Form und der etablierten biblischen Wendung, ohne den im Folgevers fortgesetzten Satz zu ergänzen.
theological_decisions:
- issue: Wiedergabe der doppelten Anrede „dominator domine“
  choice: O Herrscher, Herr
  alternative: O herrschender Herr / O souveräner Herr
  rationale: Die gewählte Fassung hält die beiden lateinischen Wörter unterscheidbar und vermeidet, „souverän“ als abstrakte Eigenschaft einzutragen. Die ungewöhnliche Spannung der Anrede bleibt sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Erzählton. Der Vers bleibt gemäß der Quelle am Ende syntaktisch offen, da die Bitte im folgenden Vers weitergeht.
