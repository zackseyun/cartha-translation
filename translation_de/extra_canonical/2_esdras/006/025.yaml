  verdict: revise
  source_fidelity: Der Entwurf gibt die Struktur von Et erit ... salvabitur et videbit sowie salutare meum und finem saeculi mei grundsätzlich zutreffend wieder. „Von all dem übrig geblieben“ bewahrt die offene, auf die vorausgesagten Dinge bezogene Formulierung von derelictus ... ex omnibus istis, ohne sie zu stark als bloßes Überleben zu deuten. Im Deutschen sollte jedoch das futurische Verhältnis des lateinischen Futur II deutlicher markiert werden.
  naturalness: Die Formulierung „der ... übrig geblieben ist, ... wird gerettet werden“ ist verständlich, verbindet aber innerhalb einer Zukunftsankündigung ein Perfekt mit Futur und klingt dadurch zeitlich weniger präzise. „übrig geblieben sein wird“ ist hier eine natürliche, würdige und genaue Wiedergabe des vorausliegenden zukünftigen Geschehens.
  terminology: „Heil“ ist für salutare meum sachgerecht und theologisch offen. „Zeitalter“ gibt saeculum angemessen wieder; die Fußnote mit „Weltzeit“ als möglicher Alternative ist sinnvoll. Das Possessivum „meines“ und die bestimmte Formulierung „das Ende“ bleiben erhalten.
  issues:
