  yaml_path: translation/extra_canonical/2_esdras/006/025.yaml
  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: de
  text: 'Und es wird geschehen: Jeder, der von all dem übrig geblieben sein wird, was ich dir vorausgesagt habe, wird gerettet werden und mein Heil und das Ende meines Zeitalters[a] sehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Weltzeit“.'
    reason: Das lateinische saeculum kann ein Zeitalter beziehungsweise eine Weltzeit bezeichnen und je nach Kontext auch die Weltordnung meinen.
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: von all dem übrig geblieben ist
  rationale: Gibt das lateinische Perfekt Futur im Zusammenhang der angekündigten endzeitlichen Ereignisse natürlich wieder und bewahrt den Gedanken des Verbleibens nach diesen Ereignissen.
- source_word: salutabitur
  choice: wird gerettet werden
  rationale: Entspricht dem passiven Zukunftsausdruck und lässt den Handelnden, wie im Lateinischen, unausgesprochen.
- source_word: salutare meum
  choice: mein Heil
  rationale: Bewahrt die substantivische und theologisch offene Formulierung des lateinischen Textes.
- source_word: saeculi mei
  choice: meines Zeitalters
  rationale: Gibt saeculum hier als zeitliche Epoche wieder, ohne den ungewöhnlichen Bezug durch das Possessivpronomen abzuschwächen.
theological_decisions:
- issue: Bedeutung von „saeculi mei“
  choice: meines Zeitalters
  alternative: meiner Weltzeit / meiner Welt
  rationale: Der Kontext spricht vom Ende einer gegenwärtigen Ordnung oder Epoche. „Zeitalter“ wahrt die eschatologische Spannung besser als eine Festlegung auf die räumliche Bedeutung „Welt“.
- issue: Bezug von „ex omnibus istis“
  choice: 'auf die vorausgesagten Ereignisse bezogen: „von all dem übrig geblieben“'
  alternative: „aus der Gesamtheit all derer übrig geblieben“
  rationale: Das neutrale „omnibus istis“ wird durch „quibus praedixi tibi“ näher bestimmt und bezeichnet am naheliegendsten die zuvor angekündigten Dinge beziehungsweise Ereignisse.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der einleitende Doppelpunkt bildet die lateinische Ereignisformel natürlich ab; die auffällige Wendung „mein Zeitalter“ bleibt bewusst erhalten.
