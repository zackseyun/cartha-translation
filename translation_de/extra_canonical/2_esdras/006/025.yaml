    rationale: Das lateinische derelictus fuerit ist ein Futur II und bezeichnet das vor dem folgenden „wird gerettet werden“ eintretende Übrigbleiben. Die deutsche Fassung sollte dies mit „übrig geblieben sein wird“ ausdrücklich abbilden.
