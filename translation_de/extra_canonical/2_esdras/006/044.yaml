  - severity: low
    issue: „unergründlichem Wohlgeruch“
    rationale: inuestigabiles bedeutet eher „unerforschlich/unaufspürbar“ als „unergründlich“. Die Revision hält die rhetorische Verbindung von Düften und Wohlgeruch enger fest.
