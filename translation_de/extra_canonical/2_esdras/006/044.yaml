  source_fidelity: 'Die Übersetzung gibt die Schöpfungsaufzählung und ihre Abfolge zuverlässig wieder. Eine kleine Präzisierung ist bei „processit“ sinnvoll: Früchte „kamen ... hervor“ entspricht dem Hervorkommen unmittelbarer als „sprossen“. Für „odores odoramentis inuestigabiles“ sollte die Unausforschlichkeit ausdrücklich auf den Wohlgeruch bezogen bleiben.'
  naturalness: Der Entwurf ist überwiegend idiomatisches, würdiges modernes Deutsch. „Vielfältige Köstlichkeiten für den Geschmack“ wirkt jedoch etwas erklärend und weniger flüssig als „Gaumenfreuden vielfältiger Art“.
  terminology: „Unermessliche Fülle“, „unnachahmliche Farbe“ und „am dritten Tag“ sind treffend. „Unerforschlicher Wohlgeruch“ bildet die betonte lateinische Wendung angemessener ab als „unergründlicher Wohlgeruch“ und wahrt den Sinn von inuestigabiles.
