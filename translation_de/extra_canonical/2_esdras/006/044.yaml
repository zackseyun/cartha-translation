  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: de
  text: Denn sogleich kamen Früchte in unermesslicher Fülle hervor, dazu Gaumenfreuden vielfältiger Art, Blumen von unnachahmlicher Farbe und Düfte von unerforschlichem Wohlgeruch. Dies alles entstand am dritten Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: Früchte in unermesslicher Fülle
  rationale: Gibt die außerordentliche Menge der hervorgebrachten Früchte natürlich und quellennah wieder.
- source_word: concupiscentia gustus multiformis
  choice: vielfältige Köstlichkeiten für den Geschmack
  rationale: Versteht concupiscentia hier als objektive Begehrenswürdigkeit beziehungsweise angenehme Beschaffenheit der Gewächse; die ungewöhnliche wörtliche Lesart bleibt in der Fußnote erhalten.
- source_word: flores colore inimitabiles
  choice: Blumen von unnachahmlicher Farbe
  rationale: Bewahrt die Aussage, dass ihre Farbe nicht nachgebildet oder erreicht werden kann.
- source_word: odores odoramentis inuestigabiles
  choice: Düfte von unergründlichem Wohlgeruch
  rationale: Gibt die emphatische, etymologisch eng geführte lateinische Wendung in würdigem und verständlichem Deutsch wieder.
- source_word: haec facta sunt
  choice: Dies alles entstand
  rationale: Passt zum Schöpfungskontext und vermeidet ein unnötig mechanisches „wurde gemacht“.
theological_decisions:
- issue: Bedeutung von concupiscentia im Schöpfungsbericht
  choice: objektive Köstlichkeit beziehungsweise angenehme Geschmacksfülle
  alternative: Verlangen nach vielerlei Geschmacksarten
  rationale: Der Kontext zählt Eigenschaften der geschaffenen Pflanzen auf. Dennoch ist die ungewöhnliche wörtliche Bedeutung des lateinischen Ausdrucks textlich möglich und wird deshalb nicht verschwiegen, sondern als Alternative ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt bildhaft und rhythmisch; altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
