id: 2ES.6.54
reference: 2 Esdras 6:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
translation:
  language: de
  text: Und über ihnen steht Adam, den du zum Herrscher über alle Werke eingesetzt hast, die du geschaffen hast; von ihm stammen wir alle ab – das Volk, das du erwählt hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super his
  choice: über ihnen
  rationale: Bewahrt den räumlich-hierarchischen Sinn des lateinischen Ausdrucks und knüpft an die zuvor genannten Geschöpfe an.
- source_word: ducem
  choice: zum Herrscher
  rationale: Gibt Adams eingesetzte Leitungs- und Herrschaftsstellung über die Schöpfungswerke im Deutschen klar und würdig wieder.
- source_word: ex eo educimur
  choice: von ihm stammen wir … ab
  rationale: Natürliches modernes Deutsch für die hier gemeinte gemeinsame Abstammung von Adam.
- source_word: nos omnes quem elegisti populum
  choice: wir alle … das Volk, das du erwählt hast
  rationale: Versteht „populum“ als in den Relativsatz aufgenommenes Bezugswort und als Apposition zu „wir alle“, nicht als eine zweite, durch „und“ abgetrennte Gruppe.
theological_decisions:
- issue: Verhältnis von „wir alle“ zum erwählten Volk
  choice: 'Identifikation durch Apposition: „wir alle – das Volk, das du erwählt hast“'
  alternative: „wir alle und das Volk, das du erwählt hast“
  rationale: Kasus und Satzbau des Lateinischen sprechen dafür, dass „populum“ „nos omnes“ näher bestimmt. So bleibt auch der Gegensatz zu den übrigen, ebenfalls von Adam abstammenden Völkern im folgenden Kontext erhalten.
- issue: Adams Stellung über den zuvor genannten Geschöpfen
  choice: „über ihnen steht Adam“
  alternative: „über sie hast du Adam gesetzt“
  rationale: Das Lateinische lässt im Hauptsatz das Verb unausgesprochen. Die gewählte Ergänzung ist zurückhaltend, während der Relativsatz ausdrücklich sagt, dass Gott Adam eingesetzt hat.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gedankenstrich macht die appositionelle Bestimmung des erwählten Volkes deutlich, ohne eine zusätzliche Gruppe einzuführen.
