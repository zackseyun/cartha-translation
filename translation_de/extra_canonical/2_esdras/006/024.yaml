  source_fidelity: 'Die Übersetzung gibt die lateinische Abfolge und Bildsprache zuverlässig wieder: „Freunde ihre Freunde wie Feinde bekämpfen“ entspricht *debellabunt amici amicos ut inimici*; das assoziative *cum* ist mit „zusammen mit“ klar erfasst; „Adern der Quellen“ bewahrt die Metapher von *uenae fontium*. Das Stillstehen und dreistündige Nichtfließen werden sachgerecht wiedergegeben.'
