id: 2ES.6.24
reference: 2 Esdras 6:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
translation:
  language: de
  text: Und in jener Zeit werden Freunde ihre Freunde wie Feinde bekämpfen. Die Erde wird zusammen mit ihren Bewohnern in Schrecken geraten, und die Adern der Quellen werden stillstehen, sodass sie drei Stunden lang nicht fließen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: Freunde werden ihre Freunde wie Feinde bekämpfen
  rationale: Gibt die wechselseitige persönliche Nähe von „amici amicos“ und den Vergleich „ut inimici“ klar und natürlich wieder, ohne „debellare“ unnötig auf einen förmlichen Krieg einzuengen.
- source_word: expauescet terra cum his qui inhabitant eam
  choice: Die Erde wird zusammen mit ihren Bewohnern in Schrecken geraten
  rationale: '„cum“ wird assoziativ verstanden: Erde und Bewohner teilen den Schrecken. „In Schrecken geraten“ bewahrt die intransitive Aussage von „expavescet“.'
- source_word: uenae fontium
  choice: die Adern der Quellen
  rationale: Die konkrete Metapher des lateinischen „venae“ bleibt erhalten und bezeichnet die Wasserläufe beziehungsweise Quelladern.
- source_word: stabunt, ut non decurrant in tribus horis
  choice: werden stillstehen, sodass sie drei Stunden lang nicht fließen
  rationale: Folgt der im konsultierten Textzeugnis überlieferten Fortsetzung und formuliert das Ausbleiben des Fließens in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die apokalyptische Bildsprache bleibt konkret; insbesondere wird „Adern der Quellen“ nicht erklärend verflacht. Der Satzbau wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert.
