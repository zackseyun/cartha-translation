  text: and the truth, which has been fruitless for so long, will be revealed.”
translation:
  language: de
  text: Und die Wahrheit, die so lange ohne Frucht geblieben ist, wird offenbar werden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: wird offenbar werden
  rationale: Gibt das lateinische Futur Passiv natürlich und würdevoll wieder; der Offenbarungscharakter bleibt erhalten.
- source_word: ueritas
  choice: die Wahrheit
  rationale: Direkte und im Kontext sachgemäße Entsprechung.
- source_word: sine fructu fuit
  choice: ohne Frucht geblieben ist
  rationale: Bewahrt das konkrete Fruchtbild des Lateinischen und klingt im Deutschen natürlicher als eine rein abstrakte Wiedergabe wie „erfolglos“.
- source_word: tantis temporibus
  choice: so lange
  rationale: Gibt die ausgedehnte Dauer idiomatisch wieder, ohne eine im Lateinischen nicht näher bestimmte Zeitspanne festzulegen.
theological_decisions:
- issue: Bedeutung der bislang fruchtlosen Wahrheit
  choice: 'Die Metapher bleibt unaufgelöst: „ohne Frucht geblieben“'
  alternative: „wirkungslos geblieben“ oder „keinen Ertrag gebracht“
  rationale: Der Vers erklärt nicht, ob fehlende Anerkennung, Wirkung oder Ertrag gemeint ist; die bildhafte Form bewahrt diese Offenheit.
- issue: Art des Offenbarwerdens
  choice: „wird offenbar werden“
  alternative: „wird gezeigt werden“
  rationale: Beide Bedeutungen sind durch „ostendebitur“ möglich. „Offenbar werden“ passt zum eschatologischen Zusammenhang, ohne zu bestimmen, durch wen oder auf welche Weise die Wahrheit sichtbar gemacht wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das Fruchtbild des Ausgangstextes wird bewahrt; keine Fußnote erforderlich.
