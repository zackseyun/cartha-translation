  text: 'dixit ad me : ab Abraham usque ad Abraham, quoniam ab eo natus est Iacob et Esau, manus enim Iacob tenebat ab initio calcaneum Esau. Finis enim huius saeculi Esau, et principium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/008.yaml
  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: de
  text: 'Und er sagte zu mir: „Von Abraham bis Abraham[a], denn von ihm wurden Jakob und Esau geboren; Jakobs Hand hielt nämlich von Anfang an Esaus Ferse fest. Denn Esau ist das Ende dieses Zeitalters[b] und der Anfang …[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „Von Abraham bis Abraham“ ist in der lateinischen Überlieferung dunkel und wahrscheinlich verderbt. Der folgende Hinweis auf die Geburt Jakobs und Esaus setzt Isaak als ihren Vater voraus; auch alte Tochterübersetzungen bezeugen hier sinngemäß „von Abraham bis Isaak“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „dieser Weltzeit“.'
    reason: translation_alternative
  - marker: c
    text: Der hier vorgelegte lateinische Quellenausschnitt bricht nach „und der Anfang“ mitten im Satz ab.
    reason: source_fragment
lexical_decisions:
- source_word: saeculi
  choice: Zeitalters
  rationale: Das lateinische „saeculum“ bezeichnet hier eine Weltzeit beziehungsweise ein Zeitalter; „Zeitalter“ gibt den zeitlich-eschatologischen Sinn natürlich wieder, ohne ihn auf die räumliche Bedeutung „Welt“ zu verengen.
- source_word: calcaneum
  choice: Ferse
  rationale: „Ferse“ ist die natürliche moderne Entsprechung und bewahrt den Bezug auf Jakobs Geburtserzählung.
- source_word: ab initio
  choice: von Anfang an
  rationale: Die Wendung wird formal und idiomatisch wiedergegeben, ohne festzulegen, ob sie ausschließlich den Augenblick der Geburt oder eine weiter reichende typologische Beziehung bezeichnet.
theological_decisions:
- issue: Die dunkle Lesart „ab Abraham usque ad Abraham“
  choice: Von Abraham bis Abraham
  alternative: Von Abraham bis Isaak
  rationale: Der vorgelegte lateinische Text nennt Abraham zweimal. Obwohl der Zusammenhang und mehrere Tochterübersetzungen stark für „Isaak“ als ursprüngliche Lesart sprechen, wird die überlieferte lateinische Lesart im Haupttext nicht stillschweigend verbessert; die Schwierigkeit wird in einer Fußnote offengelegt.
- issue: Eschatologische Bedeutung von „saeculum“
  choice: Zeitalter
  alternative: Welt
  rationale: „Zeitalter“ erhält den Gedanken aufeinanderfolgender Weltzeiten und vermeidet die mögliche Fehlvorstellung, Esau sei das räumliche Ende der geschaffenen Welt.
- issue: Unvollständiger Schluss des gelieferten Quellenausschnitts
  choice: und der Anfang …
  alternative: und der Anfang
  rationale: Die Auslassungspunkte zeigen transparent, dass der vorgelegte lateinische Ausschnitt mitten im Satz nach „principium“ abbricht; die inhaltliche Fortsetzung wird nicht aus späterem Text ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formaler Satzführung. Das wiederholte „denn/nämlich“ bildet die lateinische Begründungsstruktur ab, ohne unnötig schwerfällig zu wirken. Die offenkundig schwierige Namenslesart und der fragmentarische Versschluss werden nicht geglättet, sondern transparent markiert.
