  yaml_path: translation/extra_canonical/2_esdras/006/053.yaml
  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: de
  text: Und am sechsten Tag hast du der Erde befohlen, vor dir Nutztiere, wilde Tiere und Kriechtiere hervorzubringen;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iumenta
  choice: Nutztiere
  rationale: Der lateinische Ausdruck bezeichnet hier domestizierte beziehungsweise dem Menschen dienende Tiere und bildet den Gegenpol zu den wilden Tieren.
- source_word: bestias
  choice: wilde Tiere
  rationale: Diese Wiedergabe macht den Gegensatz zu den Nutztieren im modernen Deutsch klar und vermeidet das missverständliche „Bestien“.
- source_word: reptilia
  choice: Kriechtiere
  rationale: „Kriechtiere“ entspricht dem lateinischen Sammelbegriff in der Schöpfungssprache, ohne ihn auf die moderne zoologische Klasse der Reptilien zu verengen.
- source_word: crearet
  choice: hervorzubringen
  rationale: In Verbindung mit der Erde ist „hervorbringen“ natürliches Deutsch und bewahrt zugleich, dass die Erde auf Gottes Befehl hin tätig wird.
- source_word: coram te
  choice: vor dir
  rationale: Die formale und theologisch offene Wendung des lateinischen Textes wird unmittelbar bewahrt.
theological_decisions:
- issue: Die Erde als handelndes Subjekt des Schöpfungsbefehls
  choice: „der Erde befohlen, … hervorzubringen“
  alternative: „befohlen, dass die Erde … erschaffe“
  rationale: Die gewählte Fassung erhält die Aussage, dass Gott befiehlt und die Erde die Tiere hervorbringt, ohne diese Spannung durch eine direkte Schöpfungsaussage über Gott aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und das abschließende Semikolon bewahren den fortlaufenden Charakter des Gebets beziehungsweise Schöpfungsrückblicks.
