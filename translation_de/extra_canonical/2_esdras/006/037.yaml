  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: de
  text: Denn mein Geist war sehr entflammt, und meine Seele war bedrängt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur
  choice: war heftig entflammt
  rationale: Bewahrt das lateinische Feuerbild und gibt das Imperfekt als anhaltenden Zustand wieder.
- source_word: spiritus meus
  choice: mein Geist
  rationale: Entspricht der anthropologischen Ausdrucksweise des lateinischen Textes, ohne Geist und Seele gleichzusetzen.
- source_word: anima mea anxiabatur
  choice: meine Seele war von Angst erfüllt
  rationale: Gibt die innere Bedrängnis idiomatisch und würdevoll wieder; das Imperfekt bezeichnet einen fortdauernden Zustand.
theological_decisions:
- issue: Verhältnis von Geist und Seele
  choice: Beide Begriffe werden getrennt als „Geist“ und „Seele“ wiedergegeben.
  alternative: Beide Ausdrücke zu einer allgemeinen Aussage über das innere Erleben zusammenziehen.
  rationale: Die Parallelität und mögliche anthropologische Spannung des lateinischen Textes sollen erhalten bleiben, ohne daraus ein bestimmtes Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild des entflammten Geistes bleibt erhalten; „von Angst erfüllt“ ist natürlicher als eine wörtliche, im Deutschen schwerfällige Passivform wie „wurde geängstigt“.
