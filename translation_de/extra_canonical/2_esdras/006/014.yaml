  footnotes:
  - marker: a
    text: Der lateinische Text ist am Anfang dieser Stelle beschädigt und setzt erst mit „…bitur“ ein; „erschüttert wird“ ist aus dem Zusammenhang erschlossen.
    reason: Die unvollständige Überlieferung soll sichtbar bleiben, statt die Rekonstruktion als völlig sicher auszugeben.
lexical_decisions:
- source_word: '[move]bitur'
  choice: erschüttert wird
  rationale: Der überlieferte Text setzt erst mit „bitur“ ein; aus dem Zusammenhang ist eine Form wie „movebitur“ („wird bewegt/erschüttert werden“) zu erschließen. „Erschüttert wird“ gibt den in diesem Zusammenhang gemeinten heftigen Vorgang natürlich wieder.
- source_word: locus, in quo stas super eum
  choice: der Ort, auf dem du stehst
  rationale: Die wörtlich redundante lateinische Konstruktion („der Ort, in dem du auf ihm stehst“) wird in idiomatischem Deutsch wiedergegeben, ohne ihren räumlichen Sinn zu verändern.
