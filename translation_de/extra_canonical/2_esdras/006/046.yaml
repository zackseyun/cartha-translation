  yaml_path: translation/extra_canonical/2_esdras/006/046.yaml
  text: and you commanded them to serve the man who was to be formed.
translation:
  language: de
  text: und du befahlst ihnen, dem Menschen zu dienen, der erst noch geformt werden sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deservirent
  choice: zu dienen
  rationale: Gibt den lateinischen Konjunktiv im von „befahlst“ abhängigen Final- bzw. Objektsatz natürlich und sachlich wieder; eine stärkere Formulierung wie „dienstbar zu sein“ wäre möglich, klingt aber weniger unmittelbar.
- source_word: futuro plasmato homini
  choice: dem Menschen, der erst noch geformt werden sollte
  rationale: Bewahrt sowohl den Zukunftsbezug von „futuro“ als auch das bildhafte „plasmato“ (formen, gestalten), ohne bereits eine bestimmte Art der Erschaffung festzulegen.
theological_decisions:
- issue: Zeitlicher Bezug der Erschaffung des Menschen
  choice: „der erst noch geformt werden sollte“
  alternative: „dem künftig geformten Menschen“
  rationale: Die Relativsatzkonstruktion macht verständlich, dass der Mensch zum Zeitpunkt des Befehls noch nicht geformt war, und erhält damit die zeitliche Spannung des lateinischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Latein, wird jedoch mit einem natürlichen deutschen Relativsatz wiedergegeben.
