revisions:
- from: 'Und er sagte zu mir: „Am Anfang des irdischen Erdkreises, noch bevor die Ausgänge der Weltzeit[a] feststanden, bevor die Ansammlungen der Winde wehten, bevor die Stimmen des Donners ertönten, bevor die Blitze aufleuchteten und bevor … befestigt wurden“'
  to: 'Und er sagte zu mir: „Am Anfang des irdischen Erdkreises, noch bevor die Enden der Weltzeit[a] feststanden, bevor die Windversammlungen zu wehen begannen, bevor die Stimmen des Donners ertönten, bevor die Lichtscheine der Blitze aufleuchteten und bevor … gefestigt wurden“'
