source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me: initium terreni orbis, et antequam starent exitus saeculi et antequam spirarent conuentiones uentorum, Et antequam sonarent uoces tonitruum, et antequam splenderent nitores coruscuum et antequam confirmarentur'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
translation:
  language: de
  text: 'Und er sagte zu mir: „Am Anfang des irdischen Erdkreises, noch bevor die Enden der Weltzeit[a] feststanden, bevor die Windversammlungen zu wehen begannen, bevor die Stimmen des Donners ertönten, bevor die Lichtscheine der Blitze aufleuchteten und bevor … gefestigt wurden“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Grenzen der Welt“; wörtlich auch: „die Ausgänge des Zeitalters“.'
    reason: '„Exitus saeculi“ ist lexikalisch und kosmologisch mehrdeutig: *saeculum* kann „Weltzeit/Zeitalter“ oder „Welt“ bedeuten, *exitus* unter anderem „Ausgänge“, „Enden“ oder „Grenzen“. Die Anmerkung bewahrt die räumliche Lesart, ohne sie im Haupttext festzulegen.'
lexical_decisions:
- source_word: initium terreni orbis
  choice: am Anfang des irdischen Erdkreises
  rationale: „Orbis“ bezeichnet hier den geschaffenen Erdkreis bzw. die irdische Welt. „Erdkreis“ bewahrt das antike kosmologische Bild besser als das moderne „Planet Erde“.
- source_word: exitus saeculi
  choice: die Ausgänge der Weltzeit
  rationale: „Exitus“ kann Ausgänge, Endpunkte oder Grenzen bezeichnen; „saeculum“ kann zeitlich „Weltzeit/Zeitalter“ oder räumlich „Welt“ bedeuten. Die bewusst ungewohnte Formulierung erhält diese genuine Mehrdeutigkeit.
- source_word: starent
  choice: feststanden
  rationale: Das lateinische „stare“ bedeutet wörtlich „stehen“, hier im Sinn eines bereits festgelegten bzw. beständigen Zustands.
- source_word: conuentiones uentorum
  choice: die Ansammlungen der Winde
  rationale: „Conventiones“ bezeichnet Zusammenkünfte oder Ansammlungen. Die konkrete kosmologische Bildsprache wird nicht zu „Strömungen“ verallgemeinert.
- source_word: spirarent
  choice: wehten
  rationale: Bei Winden ist „wehen“ die natürliche deutsche Entsprechung von „spirare“, ohne das Bild zu verändern.
- source_word: uoces tonitruum
  choice: die Stimmen des Donners
  rationale: Die wörtliche Personifikation „Stimmen“ bleibt erhalten; der Genitivplural wird im Deutschen idiomatisch kollektivisch mit „des Donners“ wiedergegeben.
- source_word: nitores coruscuum
  choice: die Blitze
  rationale: Die Wendung bezeichnet den hellen Glanz bzw. das Aufleuchten von Blitzen. „Die Blitze leuchteten auf“ gibt das Naturbild klar und würdig wieder.
- source_word: confirmarentur
  choice: befestigt wurden
  rationale: Das Passiv bedeutet „befestigt, gefestigt, bestätigt wurden“. Da das zugehörige Subjekt im bereitgestellten Fragment fehlt, wird die syntaktische Lücke sichtbar gelassen.
theological_decisions:
- issue: Zeitliche oder räumliche Deutung von „exitus saeculi“
  choice: 'Mehrdeutigkeit im Haupttext bewahren: „Ausgänge der Weltzeit“'
  alternative: „Grenzen der Welt“ oder „Tore der Welt“
  rationale: Der Schöpfungskontext ermöglicht eine räumlich-kosmologische Lesart, doch das Latein legt sie nicht eindeutig fest. Eine glättende Wiedergabe als „Tore der Welt“ würde ein konkretes kosmologisches Modell stärker festschreiben als die Quelle.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll formaler Satzführung. Antike kosmologische Bilder werden bewahrt. Die Auslassung vor „befestigt wurden“ kennzeichnet, dass der gelieferte lateinische Quelltext mitten im Satz abbricht.
