  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: de
  text: 'Da antwortete ich und sagte: „Was wird die Trennung der Zeiten sein? Oder wann werden das Ende des Früheren und der Anfang des Folgenden eintreten?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: divisio temporum
  choice: die Trennung der Zeiten
  rationale: Gibt die nominale und in ihrem genauen Sinn offene lateinische Wendung wieder, ohne sie etwa als Zeitpunkt, Zeichen oder Zeitabstand festzulegen.
- source_word: prioris
  choice: des Früheren
  rationale: Bewahrt die substantivierte Vergleichsform und ihren Bezug auf den früheren der beiden Zeitabschnitte oder Weltzeitalter.
- source_word: sequentis
  choice: des Folgenden
  rationale: Entspricht der substantivierten Form und hält die Parallelität zu „des Früheren“ aufrecht.
theological_decisions:
- issue: Bezug der beiden substantivierten Vergleichsformen
  choice: des Früheren … des Folgenden
  alternative: des früheren Zeitalters … des folgenden Zeitalters
  rationale: Der lateinische Text nennt die Zeitalter nicht ausdrücklich. Die offenere Formulierung bewahrt diese Ellipse und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas feierliche Nominalkonstruktion folgt bewusst der ausgewogenen Struktur des lateinischen Textes; „Da antwortete ich und sagte“ bewahrt die traditionelle semitisch geprägte Erzählform des Lateinischen.
