  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
translation:
  language: de
  text: 'Dann bewahrtest du zwei Lebewesen: Das eine nanntest du Behemoth[a], das andere Leviathan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Behemoth und Leviathan sind urzeitliche Geschöpfe, die aus der jüdischen biblischen und nachbiblischen Überlieferung bekannt sind. Hier erscheinen sie in Esras Nacherzählung der Schöpfung als bewahrte Geschöpfe.
    reason: Querverweis und traditionsgeschichtliche Einordnung
lexical_decisions:
- source_word: conseruasti
  choice: bewahrtest
  rationale: Gibt das lateinische Verb im Zusammenhang mit den beiden für einen späteren Zweck erhaltenen Geschöpfen knapp und natürlich wieder.
- source_word: duo animalia
  choice: zwei Lebewesen
  rationale: „Lebewesen“ wahrt die Breite von animalia und vermeidet die im Deutschen mögliche Verengung von „Tiere“.
- source_word: nomen uni uocasti Behemoth
  choice: Das eine nanntest du Behemoth
  rationale: Natürliche deutsche Wiedergabe der lateinischen Namensformel ohne Bedeutungsverlust.
theological_decisions:
- issue: Einordnung von Behemoth und Leviathan
  choice: Die Namen werden unübersetzt beibehalten und die traditionsgeschichtliche Einordnung der Fußnote überlassen.
  alternative: Die Wesen im Haupttext als Ungeheuer, Urzeittiere oder mythische Wesen näher bestimmen.
  rationale: Der Vers selbst bezeichnet sie lediglich als Lebewesen und nennt ihre Namen; eine genauere Wesensbestimmung würde die überlieferte Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzform ist gegenüber der wörtlichen lateinischen Namensformel gestrafft. Der bereitgestellte lateinische Ausschnitt bricht nach „et“ ab; die Nennung Leviathans wird durch den fortlaufenden Verszusammenhang und die geprüfte englische Konsultationsfassung gestützt.
