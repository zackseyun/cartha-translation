id: 2ES.6.41
reference: 2 Esdras 6:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et in die secundo iterum creasti spiritum firmamenti et imperasti ei, ut divideret et divisionem faceret inter aquas, ut pars quidem sursum recederet, pars vero deorsum maneret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/041.yaml
  text: And again[a], on the second day, you created the spirit of the firmament, and commanded it to divide and make a division between the waters, so that one part might recede upward and the other part remain below.
translation:
  language: de
  text: Und wiederum[a] erschufst du am zweiten Tag den Geist des Himmelsgewölbes und befahlst ihm, die Wasser zu trennen und eine Scheidung zwischen ihnen herbeizuführen, sodass ein Teil nach oben zurückwich, der andere aber unten blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und am zweiten Tag erschufst du wiederum …“'
    reason: Die Stellung von lateinisch iterum lässt auch diese Zuordnung zu.
lexical_decisions:
- source_word: spiritum firmamenti
  choice: den Geist des Himmelsgewölbes
  rationale: Gibt spiritum ausdrücklich als „Geist“ wieder und versteht firmamentum im Schöpfungskontext als das feste Himmelsgewölbe; die ungewöhnliche Formulierung des Quelltexts bleibt erhalten.
- source_word: divideret et divisionem faceret
  choice: die Wasser zu trennen und eine Scheidung zwischen ihnen herbeizuführen
  rationale: Bewahrt die rhetorische Wiederholung von dividere/divisio, ohne im Deutschen völlig unnatürlich zu klingen.
- source_word: recederet
  choice: zurückwich
  rationale: Entspricht der räumlichen Bewegung des lateinischen Verbs und vermeidet eine stärkere Deutung wie „emporstieg“.
- source_word: deorsum maneret
  choice: unten blieb
  rationale: Schlichte, unmittelbare Wiedergabe der Ortsangabe und des Verbleibens.
theological_decisions:
- issue: Bedeutung von spiritus in „spiritum firmamenti“
  choice: Geist des Himmelsgewölbes
  alternative: Hauch des Himmelsgewölbes / geistiges Wesen des Himmelsgewölbes
  rationale: Der lateinische Text bezeichnet das Geschaffene ausdrücklich als spiritus. Die Übersetzung wahrt diese auffällige Aussage, statt sie mit dem Himmelsgewölbe selbst gleichzusetzen oder näher zu bestimmen.
- issue: Bezug von „wiederum“ (iterum)
  choice: Als fortführender Diskursmarker am Satzanfang
  alternative: „Am zweiten Tag erschufst du erneut …“, was eine wiederholte Erschaffung nahelegen könnte
  rationale: Die Stellung verhindert im Deutschen möglichst, dass „wiederum“ als zweite Erschaffung desselben Gegenstands missverstanden wird, und erhält zugleich die mögliche syntaktische Mehrdeutigkeit in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schöpfungstheologische Fachprägung „Himmelsgewölbe“ und die ungewöhnliche Wendung „Geist des Himmelsgewölbes“ wurden bewusst beibehalten; die parallele Trennungsformel ist leicht geglättet, aber erkennbar erhalten.
