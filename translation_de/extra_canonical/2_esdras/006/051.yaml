  yaml_path: translation/extra_canonical/2_esdras/006/051.yaml
  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: de
  text: Und du gabst Behemot einen Teil, der am dritten Tag trocken geworden war, damit es dort wohne, wo tausend Berge sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Behemoth
  choice: Behemot
  rationale: Die im Deutschen geläufige Namensform bewahrt die Bezeichnung des urzeitlichen Wesens.
- source_word: unam partem
  choice: einen Teil
  rationale: Gibt die räumlich verstandene Zuweisung eng wieder, ohne den nicht ausdrücklich genannten Begriff „Land“ einzufügen.
- source_word: quae siccata est
  choice: der … trockengelegt worden war
  rationale: Das Passiv wird bewahrt; „trockengelegt“ bezeichnet natürlich einen zuvor vom Wasser bedeckten Teil der Schöpfung.
- source_word: tertio
  choice: am dritten Tag
  rationale: Der im englischen Konsultationstext ausdrücklich bezeugte Schöpfungstag vervollständigt die im bereitgestellten lateinischen Ausschnitt abgebrochene Wendung.
- source_word: ut habitet in ea
  choice: damit es dort wohne
  rationale: Drückt Zweck und Ortsbezug in natürlichem, würdigem Deutsch aus; das sächliche Pronomen behandelt Behemot als Wesen, ohne ein nicht festgelegtes Geschlecht einzutragen.
- source_word: ubi sunt mille montes
  choice: wo tausend Berge sind
  rationale: Bewahrt die schlichte Ortsangabe und die konkrete Zahl.
theological_decisions:
- issue: Art und Geschlecht Behemots
  choice: Behemot bleibt als Eigenname stehen und wird mit „es“ aufgenommen.
  alternative: „er“ oder eine Deutung als bestimmtes Tier
  rationale: Der Text identifiziert das Wesen nicht näher; die Übersetzung vermeidet daher eine zoologische oder geschlechtliche Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung „Behemot gabst du“ hebt wie der Ausgangstext den Empfänger der Landzuweisung hervor.
