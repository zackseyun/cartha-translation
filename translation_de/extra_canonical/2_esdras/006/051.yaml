revisions:
- from: Und Behemot gabst du einen Teil, der am dritten Tag trockengelegt worden war, damit es dort wohne, wo tausend Berge sind.
  to: Und du gabst Behemot einen Teil, der am dritten Tag trocken geworden war, damit es dort wohne, wo tausend Berge sind.
  rationale: Die Änderung beschränkt sich auf die Wiedergabe von siccata est. „Trocken geworden war“ ist im modernen Standarddeutsch natürlich, vermeidet die zu spezielle Entwässerungsassoziation von „trockengelegt“ und erhält die zeitliche Vorordnung zum anschließenden Geben. Die übrigen offenen Bezüge und die Behemot-Terminologie bleiben unverändert.
