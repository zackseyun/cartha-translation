  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: de
  text: Dann dachte ich nach, und diese Dinge wurden durch mich geschaffen und nicht durch einen anderen. So wird auch das Ende durch mich und nicht durch einen anderen geschehen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitaui
  choice: fasste ich den Entschluss
  rationale: Gibt das lateinische Verb im Zusammenhang eines göttlichen Schöpfungsentschlusses natürlich wieder, ohne ihm ein ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: facta sunt haec per me
  choice: diese Dinge wurden durch mich geschaffen
  rationale: Bewahrt die passive Konstruktion und die durch »per me« ausgedrückte Urheberschaft; »geschaffen« passt zum kosmologischen Zusammenhang besser als das unnatürliche »gemacht«.
- source_word: finis per me
  choice: das Ende durch mich kommen
  rationale: Ergänzt das im Lateinischen sinngemäß vorausgesetzte zukünftige Geschehen in natürlichem Deutsch und bewahrt die Aussage, dass auch das Ende allein durch den Sprecher herbeigeführt wird.
theological_decisions:
- issue: Alleinige Urheberschaft von Anfang und Ende
  choice: »durch mich … und nicht durch einen anderen« wird in beiden Satzteilen ausdrücklich beibehalten
  alternative: Die Aussage freier als »ich allein« wiederzugeben
  rationale: Die Wiederholung und die Spannung des lateinischen Wortlauts sind theologisch bedeutsam und sollen nicht geglättet werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von »durch mich und nicht durch einen anderen« bleibt als bewusstes rhetorisches Gewicht erhalten; das schließende Anführungszeichen folgt der überlieferten Redeeinheit.
