    issue: cogitaui als „fasste ich den Entschluss“
    rationale: Die Wahl fügt eine entschiedene Willenshandlung hinzu, die cogitaui („ich dachte/nach, erwog“) nicht ausdrücklich enthält.
  - severity: low
    issue: finis als „wird ... kommen“
    rationale: „Kommen“ ist möglich, konkretisiert die elliptische Aussage aber stärker als erforderlich. „wird ... geschehen“ gibt die ergänzte Zukunftsaussage neutraler wieder.
