  source_fidelity: '„fasste ich den Entschluss“ ist für cogitaui zu bestimmt: Das Lateinische bezeichnet zunächst ein Denken/Erwägen, nicht ausdrücklich einen Entschluss. „Diese Dinge wurden durch mich geschaffen“ gibt facta sunt ... per me im kosmologischen Zusammenhang angemessen wieder. Die Zukunftsaussage beim elliptischen finis ist im Deutschen sinnvoll zu ergänzen, sollte aber nicht mit „kommen“ unnötig konkretisiert werden.'
  naturalness: Die vorgeschlagene Fassung ist insgesamt würdig und gut verständlich. „Dann dachte ich nach“ ist modernes, natürliches Deutsch und wahrt die Offenheit des lateinischen Verbs. „wird ... geschehen“ ergänzt die im Latein elliptische Prädikation beim „Ende“ idiomatisch, ohne ein bestimmtes Bild vom Kommen des Endes einzutragen.
  terminology: „Ende“ entspricht finis. Die wiederholte Formel „durch mich und nicht durch einen anderen“ bleibt erhalten und wahrt die emphatische Ausschließlichkeit des Ausgangstextes, ohne sie auslegend zu „ich allein“ umzuformen.
  issues:
