  yaml_path: translation/extra_canonical/2_esdras/006/040.yaml
  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: de
  text: Da gebotest du, Licht[a] aus deinen Schatzkammern hervorzubringen, damit dann deine Werke sichtbar würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut unmittelbar nach „Licht“ ist in der vorliegenden Textgestalt grammatisch unsicher; übersetzt ist der sicher erkennbare Satzsinn.
    reason: Die überlieferte Folge „lumen quod luminis“ ist syntaktisch auffällig und lässt sich nicht zuverlässig wörtlich wiedergeben.
lexical_decisions:
- source_word: tunc dixisti
  choice: Da gebotest du
  rationale: Mit folgendem Infinitiv bezeichnet „dixisti“ hier nicht nur ein Sprechen, sondern einen wirksamen Befehl; „da“ gibt die erzählerische Abfolge natürlich wieder.
- source_word: de thesauris tuis
  choice: aus deinen Schatzkammern
  rationale: „Schatzkammern“ bewahrt das konkrete Bild des lateinischen „thesauri“ und passt zum würdevollen Schöpfungskontext.
- source_word: proferri lumen
  choice: Licht … hervorzubringen
  rationale: Die Infinitivkonstruktion wird im Deutschen aktiv und natürlich an „gebotest“ angeschlossen; „Licht“ bleibt ohne unbestimmten Zusatz.
- source_word: ut apparerent … opera tua
  choice: damit deine Werke sichtbar würden
  rationale: „sichtbar würden“ gibt das inchoative Erscheinen der zuvor nicht sichtbaren Werke idiomatisch wieder.
theological_decisions:
- issue: Göttliches Sprechen als Schöpfungsbefehl
  choice: „gebotest du“
  alternative: „sprachst du“
  rationale: Die lateinische Konstruktion „dixisti … proferri“ kann einen angeordneten Vorgang ausdrücken. „Gebotest“ erfasst die wirksame göttliche Rede, ohne eine weitergehende Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und feierlich; das Bild der göttlichen Schatzkammern wird bewahrt.
