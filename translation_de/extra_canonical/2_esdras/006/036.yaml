lexical_decisions:
- source_word: in octava nocte
  choice: in der achten Nacht
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Angabe.
- source_word: cor meum iterato turbabatur in me
  choice: Mein Herz geriet in mir erneut in Unruhe
  rationale: Bewahrt das innere Aufgewühltsein, die Wiederholung durch „iterato“ und die im Lateinischen ausdrücklich genannte Wendung „in mir“.
- source_word: coram Altissimo
  choice: vor dem Höchsten
  rationale: „Vor“ gibt „coram“ knapp wieder; „der Höchste“ ist die etablierte, würdevolle Gottesbezeichnung.
