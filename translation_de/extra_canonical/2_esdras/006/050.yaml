  yaml_path: translation/extra_canonical/2_esdras/006/050.yaml
  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: de
  text: Den zweiten nanntest du Leviatan. Und du trenntest sie voneinander, denn der siebte Teil, wo das Wasser gesammelt worden war, konnte sie nicht fassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „konnte sie nicht beide fassen.“ Das lateinische Pronomen bedeutet wörtlich nur „sie“; aus dem Zusammenhang sind die beiden Wesen gemeint.'
    reason: Bewahrt den Unterschied zwischen dem ausdrücklichen Wortlaut und der im Zusammenhang naheliegenden dualen Deutung.
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: Den zweiten nanntest du Leviatan
  rationale: Gibt die lateinische Benennungsformel vollständig, aber in natürlichem modernem Deutsch wieder; „Leviatan“ ist die etablierte deutsche Namensform.
- source_word: separasti ea ab alterutro
  choice: du trenntest sie voneinander
  rationale: „ea“ bleibt als Pronomen im Plural wiedergegeben, während „ab alterutro“ die gegenseitige Trennung bezeichnet.
- source_word: septima pars ubi erat aqua congregata
  choice: der siebte Teil, wo das Wasser gesammelt worden war
  rationale: Bewahrt die räumliche Gliederung und das gegenüber der Haupthandlung vorzeitige Gesammeltsein des Wassers.
- source_word: capere
  choice: fassen
  rationale: „Fassen“ gibt die Bedeutung „aufnehmen/enthalten können“ knapp und würdig wieder.
