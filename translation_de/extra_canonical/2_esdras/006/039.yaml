  terminology: „Geist“, „Finsternis“ und „Schweigen“ sind sachgerecht. Die Großschreibung von „Geist“ ist im Deutschen bei dieser kontextuell möglichen Gottesbezeichnung vertretbar, ohne die genaue Bedeutung von spiritus über das Lateinische hinaus festzulegen. Die Fußnote erläutert die kausative Deutung von abs te, ohne sie dem Haupttext aufzuzwingen.
