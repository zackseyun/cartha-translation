source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: de
  text: Und damals bewegte sich der Geist, und Finsternis und Schweigen umgaben alles; der Klang einer menschlichen Stimme ging noch nicht von dir aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: war von dir noch nicht hervorgebracht.'
    reason: abs te kann neben Herkunft auch göttliche Urheberschaft beziehungsweise Hervorbringung bezeichnen.
lexical_decisions:
- source_word: spiritus volans
  choice: der Geist bewegte sich
  rationale: „Sich bewegen“ gibt volans in diesem Schöpfungskontext neutral wieder, ohne das Bild unnötig auf „fliegen“ oder „schweben“ festzulegen.
- source_word: tenebrae circumferebantur et silentium
  choice: Finsternis und Schweigen umgaben alles
  rationale: Die natürliche deutsche Formulierung bewahrt den ringsum umfassenden Sinn des passiven circumferebantur; „alles“ macht den impliziten Umfang verständlich.
- source_word: sonus vocis hominis
  choice: der Klang einer menschlichen Stimme
  rationale: Dies bildet die lateinische Wendung eng und zugleich idiomatisch ab.
- source_word: nondum erat abs te
  choice: ging noch nicht von dir aus
  rationale: Die Wendung bewahrt die offene Bedeutung von abs te als Herkunft oder Urheberschaft und klingt im Deutschen natürlicher als eine wörtliche Kopula-Konstruktion.
theological_decisions:
- issue: Bezug und Tätigkeit des spiritus im Schöpfungsbericht
  choice: „der Geist bewegte sich“
  alternative: „der Geist schwebte“ oder „der Geist flog“
  rationale: Die Übersetzung vermeidet eine unnötige Festlegung darauf, ob volans ein Schweben wie in Genesis 1 oder ein eigentliches Fliegen bezeichnet.
- issue: Herkunft oder Erschaffung der menschlichen Stimme durch Gott
  choice: „ging noch nicht von dir aus“
  alternative: „war von dir noch nicht hervorgebracht“
  rationale: abs te kann Herkunft beziehungsweise Urheberschaft ausdrücken. Der Haupttext erhält diese Spannung, während die Fußnote die stärker kausative Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Schöpfungston bleibt erkennbar, ohne archaische oder konfessionell festgelegte Formulierungen.
