  source_fidelity: 'Der Text gibt die lateinischen Satzglieder zuverlässig wieder: spiritus volans wird bewusst nicht enger als „schwebte“ oder „flog“ festgelegt; Finsternis und Schweigen werden als allumfassend beschrieben; und abs te bleibt im Haupttext als Herkunfts- bzw. Urheberschaftsaussage offen. „Alles“ ist im Lateinischen nicht ausdrücklich genannt, erschließt aber den Umfang von circumferebantur idiomatisch und ohne wesentliche Sinnverschiebung.'
