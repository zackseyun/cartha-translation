  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/016.yaml
  text: Because the speech concerns them[a], they will tremble and be shaken, for they know that their end must be changed.”
translation:
  language: de
  text: Denn die Rede über diese Dinge wird zittern und erschüttert werden; denn sie weiß, dass deren Ende geändert werden muss.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sermo de his (aus dem im Fragment angeschnittenen Satzteil; vgl. die überlieferte Lesart und die Konsultationsfassung)
  choice: die Rede über diese Dinge
  rationale: Bewahrt „sermo“ als grammatisches Subjekt und gibt „de his“ natürlich als Gegenstandsangabe wieder.
- source_word: trepidabit et commovebitur
  choice: wird erbeben und erschüttert werden
  rationale: Gibt die beiden unterschiedlichen Bewegungsbegriffe wieder und erhält die auffällige Personifikation der Rede.
- source_word: scit enim
  choice: sie weiß nämlich
  rationale: Das lateinische Verb steht im Singular und verweist am ehesten auf die personifizierte „Rede“, nicht auf eine Mehrzahl von Personen.
- source_word: finem eorum
  choice: deren Ende
  rationale: Erhält den pluralischen Rückverweis von „eorum“, ohne seinen Bezug unnötig festzulegen.
- source_word: oportet commutari
  choice: verwandelt werden muss
  rationale: Gibt sowohl die Notwendigkeit als auch das Passiv von „commutari“ wieder.
theological_decisions:
- issue: Subjekt von „scit“ und der vorausgehenden Verben
  choice: Die „Rede“ wird als personifiziertes singularisches Subjekt beibehalten.
  alternative: '„Sie“ als eine Gruppe verstehen: „Sie werden zittern … denn sie wissen …“'
  rationale: Die lateinischen Verbformen „trepidabit“, „commovebitur“ und „scit“ sind Singularformen. Die pluralische Deutung der englischen Konsultationsfassung würde diese grammatische Spannung auflösen und ein nicht ausdrücklich genanntes pluralisches Subjekt einführen.
- issue: Bedeutung der endzeitlichen Veränderung
  choice: „deren Ende verwandelt werden muss“
  alternative: „ihr Zustand am Ende geändert werden muss“
  rationale: Die knappe und rätselhafte Aussage des lateinischen Textes wird nicht durch eine bestimmte eschatologische Erklärung erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Personifikation der „Rede“ wurde bewusst erhalten. Das schließende Anführungszeichen folgt der Einbettung des Verses in die vorausgehende direkte Rede.
