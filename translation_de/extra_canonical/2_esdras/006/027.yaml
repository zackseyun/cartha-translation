  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/027.yaml
  text: For evil will be blotted out[a], and deceit will be extinguished.
translation:
  language: de
  text: Denn das Böse wird getilgt, und der Trug wird ausgelöscht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: delebitur
  choice: wird getilgt
  rationale: Das Passiv von „delere“ bezeichnet das Beseitigen oder Auslöschen; „getilgt“ gibt dies prägnant wieder und lässt zugleich Raum für die bildhafte Bedeutung.
- source_word: malum
  choice: das Böse
  rationale: Das substantivierte Neutrum bezeichnet hier das Böse beziehungsweise Übel allgemein; „das Böse“ passt zum eschatologischen Zusammenhang.
- source_word: extinguetur
  choice: wird ausgelöscht
  rationale: Das Passiv von „extinguere“ bewahrt das Bild des Erlöschens beziehungsweise Auslöschens und unterscheidet sich sprachlich von „delebitur“.
- source_word: dolus
  choice: der Trug
  rationale: „Trug“ erfasst vorsätzliche Täuschung und Arglist in einer knappen, würdigen Form besser als das stärker auf eine einzelne Tat bezogene „Betrug“.
theological_decisions:
- issue: Eschatologische Beseitigung des Bösen und des Trugs
  choice: Beide Aussagen werden als passive Zukunftsaussagen wiedergegeben, ohne den Handelnden ausdrücklich zu benennen.
  alternative: Gott wird das Böse tilgen und den Trug auslöschen.
  rationale: Der lateinische Text nennt den Handelnden nicht. Die passive Form wahrt diese Offenheit und vermeidet eine ausdrückliche Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen Passivformen und die unterschiedlichen Verben des lateinischen Textes bleiben erhalten. Die im englischen Konsultationstext überlieferte Fußnote wird nicht aufgenommen, da ihre alternative Formulierung nicht zum vorliegenden lateinischen Vers gehört.
