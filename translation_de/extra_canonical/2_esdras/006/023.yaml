  text: And the trumpet will sound, and when all hear it, they will suddenly be terrified.
translation:
  language: de
  text: Und die Posaune wird erschallen, und wenn alle sie hören, werden sie plötzlich in Schrecken geraten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuba
  choice: Posaune
  rationale: „Posaune“ ist die geläufige, würdevolle biblische Wiedergabe für das endzeitliche Blasinstrument; „Trompete“ wäre instrumentenkundlich moderner, klänge hier aber weniger traditionsnah.
- source_word: canet cum sono
  choice: wird erschallen
  rationale: Das natürliche deutsche Verb „erschallen“ gibt sowohl das Ertönen als auch den ausdrücklich genannten Klang wieder, ohne die lateinische Wendung redundant als „mit einem Ton ertönen“ nachzubilden.
- source_word: quam cum omnes audierint
  choice: sobald alle sie hören
  rationale: Das Pronomen bezieht sich auf die Posaune. „Sobald“ bildet die zeitliche Konstruktion knapp und idiomatisch ab; das deutsche Präsens ist im temporalen Nebensatz nach einem futurischen Hauptsatz natürlich.
- source_word: subito expavescent
  choice: werden sie plötzlich erschrecken
  rationale: „Erschrecken“ gibt das plötzliche, starke Erfasstwerden von Furcht wieder. „In Schrecken geraten“ wäre ebenfalls möglich, ist jedoch schwerfälliger.
theological_decisions:
- issue: Art und Ursache des endzeitlichen Schreckens
  choice: 'Die Aussage bleibt allgemein: Alle hören die Posaune und erschrecken plötzlich.'
  alternative: Den Schrecken als ausdrückliche Furcht vor Gericht, Verdammnis oder einer bestimmten Erscheinung deuten.
  rationale: Der lateinische Text nennt weder den genaueren Grund noch die theologischen Folgen des Schreckens; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der Semikolonanschluss erhält den engen zeitlichen Zusammenhang, ohne einen unnötig langen Satz zu erzeugen.
