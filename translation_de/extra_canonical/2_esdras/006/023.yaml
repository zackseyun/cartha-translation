  naturalness: Der Entwurf ist flüssiges, modernes Standarddeutsch. „Wenn“ ist hier ebenso natürlich und quellennäher als „sobald“. „In Schrecken geraten“ gibt expavescent als plötzliches, intensives Erschrecken klarer wieder als das etwas allgemeinere „erschrecken“.
  terminology: „Posaune“ wahrt den etablierten biblisch-apokalyptischen Sprachgebrauch, ohne eine instrumentenkundliche Präzisierung zu behaupten. Es werden keine zusätzlichen Aussagen über Gericht oder Ursache des Schreckens eingeführt.
