source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: conuertetur in sensum alium. Delebitur enim malum et extinguetur dolus. Florebit autem fides, et uincetur corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: de
  text: Es wird zu einem anderen Verständnis verwandelt[a]. Denn das Böse wird ausgelöscht und die Täuschung vernichtet werden. Der Glaube aber wird aufblühen, und die Verderbnis wird überwunden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bezugswort zu „es“ wird im vorliegenden lateinischen Wortlaut nicht genannt. „Verständnis“ kann auch mit „Sinn“ oder „Denkweise“ wiedergegeben werden.
    reason: source_ambiguity
lexical_decisions:
- source_word: conuertetur
  choice: wird sich … wandeln
  rationale: Gibt die zukünftige Veränderung wieder, ohne ein im vorliegenden lateinischen Ausschnitt nicht genanntes Bezugswort einzufügen.
- source_word: sensum alium
  choice: zu einer anderen Gesinnung
  rationale: sensus kann hier Sinn, Denken oder innere Haltung bezeichnen; „Gesinnung“ passt zum moralischen Zusammenhang, ohne die Bedeutung zu eng auf bloßes Verstehen zu begrenzen.
- source_word: delebitur
  choice: wird ausgelöscht
  rationale: Bewahrt das starke Bild vollständiger Beseitigung.
- source_word: dolus
  choice: Trug
  rationale: Bezeichnet Täuschung und Arglist in knapper, würdiger Sprache.
- source_word: fides
  choice: Glaube
  rationale: Die übliche und im Kontext tragfähige Wiedergabe; je nach Zusammenhang kann auch Treue mitschwingen.
- source_word: corruptela
  choice: Verderbnis
  rationale: Bewahrt die mögliche moralische und zerstörerische Bedeutungsbreite des lateinischen Wortes.
- source_word: uincetur
  choice: wird überwunden
  rationale: Entspricht der passiven Form und vermeidet die unnötig kämpferische Verengung auf „besiegt“.
theological_decisions:
- issue: Bedeutungsumfang von fides
  choice: Glaube
  alternative: Treue
  rationale: „Glaube“ ist die naheliegende Wiedergabe, doch die lateinische Form allein schließt den Aspekt der Treue nicht aus.
- issue: Unbestimmtes Bezugswort von conuertetur
  choice: Das Pronomen „Es“ ohne ergänztes Substantiv beibehalten
  alternative: Ein Bezugswort wie „Herz“ oder „Sinn“ aus dem weiteren Kontext ergänzen
  rationale: Der bereitgestellte lateinische Wortlaut nennt das Bezugswort nicht; die Übersetzung soll diese syntaktische Offenheit nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und der abschließende Beistrich spiegeln den fortlaufenden Charakter der lateinischen Vorlage. Die überlieferten englischen Fußnoten wurden nicht übernommen, da sie sich auf einen anderen Wortlaut beziehen und in der hier vorgelegten lateinischen Quelle keine Grundlage haben.
