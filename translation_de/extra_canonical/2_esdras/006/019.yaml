  text: and when I begin to inquire of those who have unjustly harmed others by their injustice[a], and
translation:
  language: de
  text: und wenn ich anfange, die zu befragen, die durch ihr Unrecht zu Unrecht anderen geschadet haben[a], und
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und wenn ich anfange, diejenigen zur Rechenschaft zu ziehen, die durch ihr Unrecht zu Unrecht anderen geschadet haben, und“.'
    reason: Das lateinische inquirere kann hier neben „befragen/nachforschen“ im gerichtlichen Zusammenhang auch das Einfordern von Rechenschaft bezeichnen.
lexical_decisions:
- source_word: inquirere
  choice: befragen
  rationale: Gibt die Grundbedeutung „nachforschen, befragen, untersuchen“ direkt wieder, ohne die mögliche gerichtliche Nuance vorschnell festzulegen.
- source_word: ab eis
  choice: die … zu befragen
  rationale: Natürliches modernes Deutsch für die auf Personen gerichtete Untersuchung; die lateinische Präposition ab wird im Deutschen durch das Akkusativobjekt wiedergegeben.
- source_word: qui iniuste nocuerunt iniustitia sua
  choice: die durch ihr Unrecht zu Unrecht anderen geschadet haben
  rationale: Bewahrt die auffällige Wiederholung von iniuste und iniustitia und macht das im lateinischen nocere nur implizite Gegenüber im Deutschen verständlich.
theological_decisions:
- issue: Gerichtliche Bedeutung von inquirere
  choice: befragen
  alternative: zur Rechenschaft ziehen
  rationale: Der Zusammenhang kann ein göttliches Gericht und eine Rechenschaftsforderung meinen; das lateinische Verb selbst bezeichnet jedoch zunächst Nachforschen oder Befragen. Die Hauptfassung hält diese Spannung offen, die Fußnote nennt die stärkere gerichtliche Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Unrechtsaussage des Lateinischen bleibt bewusst erhalten. Der Vers endet entsprechend der Quelle mit „und“ und setzt sich syntaktisch im folgenden Vers fort.
