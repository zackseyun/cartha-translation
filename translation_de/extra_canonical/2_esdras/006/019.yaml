review_pass:
  verdict: approve
  source_fidelity: Die Fassung gibt „inquirere incipiam ab eis“ angemessen mit „wenn ich anfange, die zu befragen“ wieder. „Durch ihr Unrecht zu Unrecht anderen geschadet haben“ bewahrt sowohl die auffällige Wiederholung von iniuste/iniustitia sua als auch die bei nocere naheliegende, im Latein nicht ausdrücklich genannte geschädigte Seite. Das abschließende „und“ entspricht dem überlieferten, versübergreifenden Satzanschluss und fügt keinen Stoff aus V. 20 hinzu.
  naturalness: Das Deutsch ist modernes, verständliches Standarddeutsch und wahrt einen angemessen würdevollen Registerton. Die doppelte Unrechtsformulierung ist leicht markiert, aber dies ist als bewusst beibehaltene rhetorische Wiederholung der Quelle gerechtfertigt.
  terminology: „befragen“ ist für inquirere eine sachlich offene und gut vertretbare Hauptwiedergabe. Die Fußnote erläutert die mögliche forensische Nuance („zur Rechenschaft ziehen“), ohne sie dogmatisch oder überdeutlich in den Haupttext zu verlagern. Der Fußnotenanker steht sinnvoll am Ende der betroffenen Teilaussage.
