  terminology: „Vorratskammern“ trifft „prumptuaria“ sachgerecht; „Posaune“ ist für „tuba“ eine etablierte und kontextangemessene Wiedergabe, ohne die konkrete Instrumentenart zu überbestimmen. „erschrecken“ gibt „expauescent“ hinreichend stark und idiomatisch wieder.
