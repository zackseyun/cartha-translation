source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: de
  text: Und plötzlich werden besäte Orte unbesät erscheinen, und volle Vorratskammern wird man plötzlich leer vorfinden. Die Posaune wird erschallen; wenn alle sie hören, werden sie plötzlich erschrecken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca non seminata
  choice: besäte Orte unbesät
  rationale: Bewahrt den auffälligen Gegensatz des lateinischen Textes, ohne ihn als Ernteausfall oder Verwüstung näher auszudeuten.
- source_word: plena prumptuaria
  choice: volle Vorratskammern
  rationale: Das orthografisch schwankende „prumptuaria“ entspricht „promptuaria“ und bezeichnet Vorrats- oder Speicheräume.
- source_word: tuba
  choice: Posaune
  rationale: „Posaune“ ist im modernen deutschen Bibelregister die geläufige, würdevolle Wiedergabe des endzeitlichen Signal- beziehungsweise Blasinstruments; eine genaue historische Instrumentenform legt das Latein nicht fest.
- source_word: subito expauescent
  choice: werden sie plötzlich erschrecken
  rationale: Gibt sowohl das plötzliche Eintreten als auch die starke Furcht des Verbs „expavescere“ natürlich wieder.
- source_word: et sciritabuntur
  choice: nicht in den Vers aufgenommen
  rationale: Die Buchstabenfolge ist in der überlieferten Form unverständlich und syntaktisch nicht mit dem folgenden Satz verbunden; sie erscheint als beschädigtes oder versfremdes Überlieferungselement. Eine spekulative deutsche Ergänzung wurde vermieden.
theological_decisions:
- issue: Bedeutung des endzeitlichen Posaunenschalls
  choice: Der Text nennt nur den Schall und die daraus folgende Furcht.
  alternative: Den Schall ausdrücklich als Gerichtssignal, Auferstehungsruf oder Zeichen eines bestimmten endzeitlichen Ablaufs deuten.
  rationale: Solche Deutungen sind möglich, werden aber von diesem Vers nicht ausdrücklich festgelegt und daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die ungewöhnliche Bildsprache des Originals bleibt erhalten; „wird man … vorfinden“ vermeidet eine schwerfällige deutsche Passivkonstruktion.
