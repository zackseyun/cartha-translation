  source_fidelity: 'Die Übersetzung gibt die drei klar verständlichen lateinischen Aussagen genau wieder: besäte Orte erscheinen unbesät, volle Vorratsräume werden leer vorgefunden, und beim Ertönen der Posaune geraten alle Hörenden plötzlich in Schrecken. Die unverständliche, syntaktisch isolierte Überlieferungsform „et sciritabuntur“ wird zu Recht nicht spekulativ ergänzt.'
