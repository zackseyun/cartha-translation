    text: 'Oder: „entfremdet“ bzw. „entfernt“.'
    reason: Das lateinische abalienarentur ist semantisch nicht völlig eindeutig; „beseitigt“ ist im Zusammenhang eine natürliche Wiedergabe, ohne die mögliche Nuance des Entfernens auszuschließen.
  revision_rationale: Die Revision korrigiert die unpassende Wiedergabe von abalienarentur, bewahrt die passive und zeitlich untergeordnete Struktur aller drei Teilsätze und formuliert die Schatzmetapher idiomatischer. Der Gedankenstrich bleibt erhalten, weil der Satz über den Vers hinaus fortgeführt wird.
