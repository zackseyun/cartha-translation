  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: de
  text: und bevor die gegenwärtigen Jahre erforscht wurden, bevor die Machenschaften derer, die jetzt sündigen, beseitigt wurden und bevor diejenigen versiegelt wurden, die den Glauben als Schatz gehortet haben –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuestigarentur
  choice: erforscht wurden
  rationale: Gibt das lateinische Bild des untersuchenden Ergründens natürlich und würdevoll wieder.
- source_word: praesentes anni
  choice: die gegenwärtigen Jahre
  rationale: Bewahrt die zeitliche Aussage des Lateinischen ohne sie deutend zu präzisieren.
- source_word: adinventiones
  choice: Pläne
  rationale: Im Kontext bezeichnet das Wort ersonnene Vorhaben oder Anschläge; „Pläne“ ist im modernen Deutsch verständlicher als das wörtlichere „Erfindungen“.
- source_word: abalienarentur
  choice: abgewendet wurden
  rationale: Bewahrt den passiven Gedanken des Entfernens oder Abbringens, ohne ein bestimmtes handelndes Subjekt einzutragen.
- source_word: consignarentur
  choice: versiegelt wurden
  rationale: Entspricht dem lateinischen Verb und erhält die religiös bedeutsame Bildsprache.
- source_word: fidem thesaurizaverunt
  choice: Glauben als Schatz gesammelt haben
  rationale: Erhält sowohl den Glauben als Gegenstand als auch die Schatzmetapher des lateinischen Ausdrucks.
theological_decisions:
- issue: Zeitliche Unterordnung der Versiegelung
  choice: „bevor“ wird auch vor der letzten Teilaussage wiederholt
  alternative: Die Versiegelung als selbstständige Hauptaussage formulieren
  rationale: Das lateinische consignarentur steht im Konjunktiv und führt die von antequam abhängige zeitliche Reihe fort; die Wiederholung verhindert eine unbeabsichtigte theologische Umdeutung.
- issue: Deutung der abgewendeten Pläne
  choice: Das Passiv bleibt ohne genanntes handelndes Subjekt
  alternative: Ausdrücklich sagen, Gott habe die Pläne verworfen
  rationale: Der lateinische Text nennt den Handelnden nicht; die Übersetzung soll diese Offenheit bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Struktur mit „bevor“ wahrt den feierlichen Rhythmus und die grammatische Unterordnung. Der Gedankenstrich zeigt, dass der Satz über diesen Vers hinaus weitergeführt wird.
