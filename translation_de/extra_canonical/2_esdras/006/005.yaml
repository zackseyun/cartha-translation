review_pass:
  verdict: revise
  source_fidelity: 'Die dreigliedrige, von antequam abhängige Zeitreihe und die abschließende Unterordnung der Versiegelung sind zutreffend wiedergegeben. „abgewendet“ ist für abalienarentur bei „Plänen“ jedoch semantisch ungenau: Es bezeichnet eher ein Abwenden als ein Entfernen bzw. Beseitigen. „Machenschaften“ gibt adinventiones im Zusammenhang mit den jetzt Sündigenden idiomatisch wieder, ohne ein handelndes Subjekt einzuführen.'
  naturalness: Der Satz ist insgesamt verständlich und hält den feierlichen, fortlaufenden Satzbau. Die Wiederholung von „bevor“ ist sinnvoll. „den Glauben als Schatz gehortet haben“ ist im Deutschen etwas idiomatischer und bewahrt die Schatzmetapher präziser als „Glauben als Schatz gesammelt haben“.
  terminology: „versiegelt“ und „Glauben“ sind angemessen und theologisch nicht überdeutet. „beseitigt“ ist für die passive Aussage zu adinventiones klarer als „abgewendet“, bleibt aber hinsichtlich des nicht genannten Handelnden neutral.
  issues:
  - severity: medium
    issue: „abgewendet“ für abalienarentur
    rationale: Bei den adinventiones („Erfindungen/Plänen“) der Sünder legt „abgewendet“ nahe, dass diese sich abwenden oder dass jemand sie nur abwehrt. Das lateinische Passiv zielt hier eher auf ein Entfernen bzw. Beseitigen der Dinge selbst. Die vorhandene Fußnote behebt diese Verschiebung nicht.
  - severity: low
    issue: „Glauben als Schatz gesammelt“
    rationale: Die Formulierung ist verständlich, doch „den Glauben als Schatz gehortet“ bildet fidem thesaurizaverunt als bewusst bewahrten Schatz im modernen Deutsch genauer und flüssiger ab.
  revised_text: und bevor die gegenwärtigen Jahre erforscht wurden, bevor die Machenschaften derer, die jetzt sündigen, beseitigt wurden und bevor diejenigen versiegelt wurden, die den Glauben als Schatz gehortet haben –
  revised_footnotes:
