review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt das Satzthema und die kosmische Bildsprache grundsätzlich treffend wieder. Sie lässt jedoch das im überlieferten lateinischen Text stehende „intellegetur“ aus. Auch wenn diese Form syntaktisch schwierig ist und die englische Audit-Fassung sie zugunsten der folgenden Bewegungsverben übergeht, muss die Verständnisaussage im Deutschen mit entsprechender textkritischer Anmerkung berücksichtigt werden. Das am Ende abgebrochene „commoue-“ rechtfertigt weiterhin eine vorsichtige Ergänzung zu „erschüttert werden“.
  naturalness: „Erschrick nicht“ und „Grundfesten der Erde“ sind natürliches, würdiges modernes Standarddeutsch. „weil die Rede von ihnen handelt“ ist verständlich, aber weniger idiomatisch als „denn von ihnen ist die Rede“. Die ergänzte Formulierung bleibt trotz der Personifikation flüssig.
  terminology: „Wort“, „Ende“ und „Grundfesten“ bewahren die knappen, offenen Begriffe des Lateinischen. „Ende“ wird nicht unzulässig zur Endzeit oder zum Weltende präzisiert. Die Personifikation der Grundfesten wird beibehalten.
  issues:
  - severity: high
    issue: Die Aussage von „intellegetur“ fehlt im Haupttext.
    rationale: Der vorgelegte lateinische Text enthält zwischen „fundamenta terrae“ und „de ipsis sermo“ ausdrücklich „intellegetur“. Die englische Audit-Fassung lässt dies aus, doch die Prüfung hat vorrangig am Originaltext zu erfolgen. Wegen der schwierigen Überlieferung ist eine erläuternde Fußnote erforderlich.
  - severity: medium
    issue: Die vorhandene Fußnote beschreibt die textliche Schwierigkeit nicht vollständig und formuliert die Deutung zu bestimmt.
    rationale: Nicht allein „commoue-“ ist abgebrochen; auch die Zuordnung und Form von „intellegetur“ ist syntaktisch auffällig. Die Fußnote soll die gewählte sinngemäße Wiedergabe als vorsichtige Lesung kennzeichnen, ohne die Textunsicherheit zu verdecken.
  - severity: low
    issue: „weil die Rede von ihnen handelt“ ist stilistisch unnötig schwerfällig.
    rationale: „Denn von ihnen ist die Rede“ gibt „quoniam de ipsis sermo [est]“ unmittelbarer und idiomatischer wieder.
  revised_text: Erschrick nicht, denn das Wort betrifft das Ende; auch die Grundfesten der Erde werden es verstehen, denn von ihnen ist die Rede, und sie werden zittern und erschüttert werden.[a]
  revised_footnotes:
  - marker: a
    text: 'Der lateinische Text ist hier schwierig überliefert: „intellegetur“ steht in einer syntaktisch auffälligen Form bei „Grundfesten der Erde“, und das folgende Wort bricht bei „commoue-“ ab. Die Übersetzung folgt der naheliegenden sinngemäßen Lesung: Die personifizierten Grundfesten verstehen die Rede, die sie betrifft, und werden zittern sowie erschüttert werden.'
    reason: Macht sowohl die auffällige Form „intellegetur“ als auch den Textabbruch bei „commoue-“ transparent und kennzeichnet die Ergänzung als vorsichtige Lesung.
  revision_rationale: Die Revision stellt die im lateinischen Text bezeugte Verständnisaussage wieder her, die die englische Audit-Fassung ausgelassen hat, und bewahrt zugleich die folgenden Bewegungsverben. Der Satzbau wird im Deutschen mit Semikolon und der idiomatischen Wendung „von ihnen ist die Rede“ geglättet. Die Fußnote dokumentiert die überlieferungsbedingte Unsicherheit, ohne den Haupttext mit einer spekulativen Alternative zu überfrachten.
