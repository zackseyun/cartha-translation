  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: de
  text: Erschrick nicht, denn das Wort betrifft das Ende. Die Grundfesten der Erde werden erbeben und erschüttert werden, weil die Rede von ihnen handelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text ist an dieser Stelle syntaktisch unsicher überliefert und bricht bei „commoue-“ ab; gemeint ist offenbar, dass die Grundfesten erbeben und erschüttert werden, weil die Rede sie betrifft.
    reason: Hinweis auf die unsichere Überlieferung und die ergänzte Verbform, ohne den Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: expauescas
  choice: Erschrick nicht
  rationale: Im überlieferten Satzzusammenhang ist die Form als verneinte Aufforderung zu verstehen; „erschrecken“ gibt die starke Furcht des lateinischen Verbs natürlich wieder.
- source_word: de fine uerbum
  choice: das Wort betrifft das Ende
  rationale: Die knappe lateinische Wendung bezeichnet den Gegenstand der Botschaft; „Ende“ bewahrt ihre eschatologische Offenheit.
- source_word: fundamenta terrae
  choice: die Grundfesten der Erde
  rationale: „Grundfesten“ erhält das kosmische Bild und klingt im modernen Deutschen würdig und verständlich.
- source_word: tremescet et commoue-
  choice: werden erbeben und erschüttert werden
  rationale: Die beiden Bewegungsverben werden getrennt wiedergegeben; die abgebrochene zweite Form ist kontextgemäß als Form von „commovere“ verstanden.
- source_word: de ipsis sermo
  choice: die Rede von ihnen handelt
  rationale: Die Wendung bedeutet, dass gerade die Grundfesten Gegenstand der Rede sind; das Pronomen bleibt ausdrücklich auf sie bezogen.
theological_decisions:
- issue: Bedeutung von „Ende“
  choice: „das Ende“ ohne nähere Bestimmung
  alternative: „das Ende der Welt“ oder „die Endzeit“
  rationale: Der lateinische Text nennt nur „finis“; eine genauere eschatologische Festlegung würde über die Quelle hinausgehen.
- issue: Personifizierung der Grundfesten
  choice: Die Grundfesten reagieren auf eine Rede, die von ihnen handelt
  alternative: Die Formulierung als rein sachliche Aussage über ein Erdbeben auflösen
  rationale: Die bildhafte Personifizierung gehört zur Spannung des Textes und wird nicht rationalisierend eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren die eindringliche, prophetische Wirkung; das kosmische Bild und die Offenheit des Begriffs „Ende“ bleiben erhalten.
