  source_fidelity: 'Die Übersetzung gibt die lateinische Satzfolge und die zentralen Aussagen zuverlässig wieder: die vollendete Erniedrigung Zions, das gekennzeichnete Zeitalter im Übergang, das Vollbringen der Zeichen, die geöffneten Bücher vor dem Firmament und das gemeinsame bzw. gleichzeitige Sehen aller. „Gekennzeichnet“ ist für das seltene und nuancenoffene supersignabitur eine sachgerechte, nicht überbestimmende Wahl.'
