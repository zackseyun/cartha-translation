source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: de
  text: 'Wenn die Erniedrigung Zions vollendet ist und das Zeitalter, das zu vergehen beginnt, gekennzeichnet wird,[a] werde ich folgende Zeichen vollbringen: Die Bücher werden vor dem Angesicht des Firmaments geöffnet werden, und alle werden es zugleich sehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „versiegelt wird“.'
    reason: Supersignabitur kann stärker als ein Bezeichnen durch ein Siegel verstanden werden; die genaue Nuance des seltenen Verbs bleibt unsicher.
lexical_decisions:
- source_word: suppleta fuerit humilitas Sion
  choice: die Erniedrigung Zions vollendet ist
  rationale: Gibt die zeitliche Vollendung der humilitas Sion eng und idiomatisch wieder; „Erniedrigung“ bewahrt sowohl den Zustand der Demütigung als auch das erlittene Niedrigmachen.
- source_word: supersignabitur
  choice: gekennzeichnet wird
  rationale: Das seltene Verb bezeichnet ein An- oder Überzeichnen beziehungsweise Markieren. „Gekennzeichnet“ bewahrt diese Breite, ohne die speziellere Vorstellung einer Versiegelung festzulegen.
- source_word: saeculum
  choice: Zeitalter
  rationale: Im apokalyptischen Zusammenhang ist ein Weltzeitalter gemeint, nicht bloß ein Jahrhundert.
- source_word: haec signa faciam
  choice: werde ich folgende Zeichen vollbringen
  rationale: „Vollbringen“ gibt faciam als Ausführen oder Bewirken wieder und vermeidet die unzutreffende Bedeutung „zeigen“.
- source_word: libri aperientur
  choice: Die Bücher werden ... geöffnet werden
  rationale: Formales Passiv und bestimmter Artikel entsprechen dem apokalyptischen Bild geöffneter Bücher.
- source_word: ante faciem firmamenti
  choice: vor dem Angesicht des Firmaments
  rationale: Bewahrt das markante räumliche Bild und die feierliche Ausdrucksweise des Lateinischen.
- source_word: omnes uidebunt simul
  choice: alle werden es zugleich sehen
  rationale: „Zugleich“ gibt simul natürlich wieder; das ergänzte „es“ macht den deutschen Satz idiomatisch, ohne das nicht ausdrücklich genannte Objekt inhaltlich festzulegen.
theological_decisions:
- issue: Bedeutung von supersignabitur
  choice: gekennzeichnet wird
  alternative: versiegelt wird
  rationale: Die allgemeinere Wiedergabe erhält die lexikalische Unsicherheit und vermeidet, das Zeichen zwingend als endzeitliche Versiegelung zu deuten.
- issue: Bezug von omnes uidebunt simul
  choice: alle werden es zugleich sehen
  alternative: alle werden einander zugleich sehen
  rationale: Das Lateinische nennt kein Objekt. Die neutrale Ergänzung „es“ bezieht sich am ehesten auf das angekündigte Geschehen, ohne eine gegenseitige Schau dogmatisch oder erzählerisch festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenem apokalyptischem Bildwort „Firmament“. Die Satzstruktur folgt dem lateinischen Gedankengang, wurde aber für flüssiges Deutsch leicht geglättet.
