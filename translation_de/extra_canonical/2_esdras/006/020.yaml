  terminology: „Erniedrigung“, „Zeitalter“, „Zeichen“, „Bücher“ und „Firmament“ sind kontextgerecht und terminologisch konsistent. Die Fußnote zu „versiegelt“ dokumentiert die mögliche stärkere Nuance von supersignabitur, ohne sie als alleinige Bedeutung auszugeben.
