id: 2ES.6.59
reference: 2 Esdras 6:59
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: de
  text: Und wenn die Welt um unseretwillen geschaffen wurde, warum besitzen wir dann unsere Welt nicht als Erbe? Wie lange noch soll das so bleiben?“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: Welt
  rationale: Im Kontext bezeichnet saeculum die geschaffene Welt beziehungsweise Weltzeit. „Welt“ ist hier natürlich und bewahrt den Bezug zur Schöpfung.
- source_word: propter nos
  choice: um unseretwillen
  rationale: Gibt den Zweck- oder Begünstigungsbezug des lateinischen Ausdrucks präzise und in würdigem modernem Deutsch wieder.
- source_word: hereditatem possidemus
  choice: als Erbe besitzen
  rationale: Bewahrt sowohl das Erbmotiv von hereditatem als auch den Besitzaspekt von possidemus.
- source_word: usquequo haec
  choice: Wie lange noch soll das so bleiben?
  rationale: Die knappe lateinische Ellipse wird idiomatisch ergänzt, ohne ihren klagenden und offenen Charakter aufzulösen.
theological_decisions:
- issue: Bedeutung des wiederholten saeculum
  choice: Beide Vorkommen mit „Welt“ wiedergeben
  alternative: „Zeitalter“ beziehungsweise „Weltzeit“
  rationale: Der Schöpfungsbezug und das possessive nostrum sprechen hier für „Welt“. Die Wiederholung bleibt erhalten und es wird keine zusätzliche eschatologische Präzisierung in den Text eingetragen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die rhetorische Klage und die Spannung zwischen geschaffener Bestimmung und gegenwärtig ausbleibendem Erbbesitz bleiben erhalten.
