  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: de
  text: Und beeile dich nicht, über die früheren Zeiten Nichtiges zu denken[a][b], damit du hinsichtlich der letzten Zeiten nicht voreilig wirst.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du nicht von den letzten Zeiten forteilst.“'
    reason: previous_rendering
  - marker: b
    text: Die Bedeutung der Wendung „von den letzten Zeiten“ ist umstritten. Sie kann, wie im Haupttext, im Sinn von „hinsichtlich der letzten Zeiten“ verstanden werden; auch eine räumlich-trennende Deutung ist möglich.
    reason: textual_variant
lexical_decisions:
- source_word: festinare
  choice: beeile dich
  rationale: Gibt den imperativischen Gedanken des hastigen, ungeduldigen Vorgehens natürlich wieder und bewahrt die Verbindung mit dem Infinitiv „denken“.
- source_word: in prioribus temporibus
  choice: über die früheren Zeiten
  rationale: Der lateinische Ausdruck bezeichnet die vorausliegenden beziehungsweise früheren Zeiten; „über“ entspricht im Deutschen dem Gegenstandsbezug des Denkens.
- source_word: vana
  choice: Nichtiges
  rationale: Bewahrt die offene Bedeutung von leeren, gehaltlosen oder vergeblichen Gedanken, ohne eine spezifische Form der Spekulation einzutragen.
- source_word: a novissimis temporibus
  choice: in Bezug auf die letzten Zeiten
  rationale: Fasst „a“ hier als Beziehungsangabe und erhält so die sachliche Parallelität zu den früheren Zeiten. Die räumlich-separative Lesart bleibt in einer Fußnote erhalten.
- source_word: properes
  choice: voreilig bist
  rationale: Bringt die Warnung vor ungeduldiger Hast hinsichtlich der letzten Zeiten in verständlichem Deutsch zum Ausdruck, ohne das im Kontext nicht naheliegende Fortgehen zur Hauptlesart zu machen.
theological_decisions:
- issue: Bezug der „letzten Zeiten“
  choice: Die eschatologische Formulierung bleibt im Plural als „die letzten Zeiten“ stehen.
  alternative: „die Endzeit“ oder „das Ende“
  rationale: Der Plural entspricht „novissimis temporibus“ und vermeidet eine unnötige dogmatische Präzisierung.
- issue: Verhältnis zwischen früheren und letzten Zeiten
  choice: Beide Zeitangaben werden als Gegenstände ungeduldigen Denkens beziehungsweise Verhaltens parallel wiedergegeben.
  alternative: „a novissimis temporibus“ räumlich als Fortbewegung weg von den letzten Zeiten zu verstehen
  rationale: Die Beziehungslesart ergibt im Kontext der Ungeduld Esras den besseren Sinn und erhält die Parallelität; die grammatisch mögliche andere Lesart wird dennoch dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nichtiges“ hält den leicht gehobenen biblischen Ton, bleibt aber verständlich. Die etwas ungewohnte Wendung „in Bezug auf die letzten Zeiten nicht voreilig“ bewahrt die Schwierigkeit und Parallelität des lateinischen Textes, statt sie durch eine stärker deutende Paraphrase aufzulösen.
