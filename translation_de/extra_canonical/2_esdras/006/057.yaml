source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc, Domine, ecce istae gentes quae in nihilum deputatae sunt dominari nostri et devorarenos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: de
  text: Und nun, Herr, siehe, diese Völker, die als nichts gerechnet wurden, herrschen über uns und verschlingen uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: sieh
  rationale: Bewahrt den auffordernden, eindringlichen Charakter des lateinischen Ausdrucks in natürlichem Deutsch.
- source_word: in nihilum deputatae sunt
  choice: für nichts geachtet wurden
  rationale: Gibt die Wertung als unbedeutend oder nichtig wieder, ohne sie stärker als Aussage über die Existenz der Völker zu deuten.
- source_word: dominari nostri
  choice: herrschen über uns
  rationale: Der überlieferte lateinische Wortlaut ist grammatisch auffällig; sinngemäß liegt eine Herrschaft über die Sprechergruppe nahe, wie auch die Parallelkonstruktion mit „uns verschlingen“ zeigt.
- source_word: devorarenos
  choice: verschlingen uns
  rationale: Die bereinigte Lesung ist als „devorare nos“ zu verstehen; „verschlingen“ erhält das gewaltsame Bild des lateinischen Verbs.
theological_decisions:
- issue: Bewertung der fremden Völker
  choice: „für nichts geachtet wurden“ als wiedergegebene Wertung
  alternative: „als nichts gerechnet wurden“
  rationale: Die Formulierung bewahrt die Spannung zwischen früherer Geringschätzung und gegenwärtiger Vorherrschaft, ohne eine zusätzliche theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Gebetsruf und das drastische Bild des Verschlingens bleiben erhalten; die ungewöhnliche lateinische Syntax wird behutsam in idiomatisches Deutsch überführt.
