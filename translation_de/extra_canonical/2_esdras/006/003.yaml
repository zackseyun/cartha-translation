  text: and before the beautiful flowers were seen[a], and before the powers of the movements were established, and before
translation:
  language: de
  text: die Grundfesten des Paradieses, und bevor die prächtigen Blumen sichtbar wurden, und bevor die Kräfte der Bewegungen[a] gefestigt wurden, und bevor
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Erdbeben«.'
    reason: Das lateinische motus kann sowohl Bewegungen allgemein als auch Erdbeben bezeichnen.
lexical_decisions:
- source_word: fundamenta paradisi
  choice: die Grundfesten des Paradieses
  rationale: Gibt den vorangestellten, offenbar aus dem vorherigen Satzteil fortgeführten lateinischen Ausdruck vollständig wieder; »Grundfesten« wahrt den feierlich-kosmologischen Ton.
- source_word: decores flores
  choice: die prächtigen Blumen
  rationale: »Prächtig« gibt decores natürlich und würdig wieder, ohne die Blumen lediglich abstrakt als »Schönheiten« zu bezeichnen.
- source_word: uiderentur
  choice: sichtbar wurden
  rationale: Entspricht dem passiven Konjunktiv in der antequam-Konstruktion und klingt im Deutschen natürlicher als »gesehen wurden«.
- source_word: motus uirtutes
  choice: die Kräfte der Bewegungen
  rationale: Bewahrt die konkrete Mehrdeutigkeit von motus und die Zuordnung von uirtutes, statt die nicht ausdrücklich genannte Deutung »Erdbeben« in den Haupttext einzutragen.
- source_word: confirmarentur
  choice: gefestigt wurden
  rationale: Gibt das Herstellen von Festigkeit oder Bestand wieder und passt zur Schöpfungs- und Ordnungsbeschreibung.
theological_decisions:
- issue: Deutung von motus im kosmologisch-apokalyptischen Zusammenhang
  choice: Bewegungen im Haupttext, mit Erdbeben als Fußnotenalternative
  alternative: Erdbeben
  rationale: Das lateinische motus kann allgemein »Bewegungen« und kontextuell auch »Erdbeben« bezeichnen. Da der vorliegende Wortlaut die engere Deutung nicht erzwingt, bleibt die Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anfang und das unvollständige Ende der gelieferten Quelle bleiben erhalten; es wurden keine aus dem weiteren Kontext erschlossenen Wörter ergänzt.
