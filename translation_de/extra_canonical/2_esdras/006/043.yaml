  text: For your word went forth, and the work was immediately done.
translation:
  language: de
  text: Denn dein Wort erging, und sogleich geschah das Werk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers angegebene lateinische Textprobe bricht nach „Verbum enim“ („Denn das Wort“) ab. Der restliche Wortlaut folgt dem überlieferten Verszusammenhang: „dein Wort erging, und sogleich geschah das Werk“.'
    reason: Die Quellenangabe enthält offenbar nur den Anfang des Verses beziehungsweise eine fehlerhaft abgegrenzte Textprobe; die Ergänzung wird für Leser transparent gemacht.
lexical_decisions:
- source_word: Verbum enim
  choice: Denn dein Wort
  rationale: „Verbum“ wird im Schöpfungskontext natürlich mit „Wort“ wiedergegeben; „enim“ begründet die unmittelbar vorausgehende Aussage und entspricht daher „denn“.
- source_word: processit
  choice: erging
  rationale: Die im überlieferten Verszusammenhang vorausgesetzte Formulierung bezeichnet das Hervorgehen des göttlichen Wortes. „erging“ ist im Deutschen idiomatisch und bewahrt den feierlichen Ton.
- source_word: statim opus factum est
  choice: sogleich war das Werk vollbracht
  rationale: „sogleich“ gibt die Unmittelbarkeit wieder; „war … vollbracht“ drückt das vollendete Schöpfungswerk natürlich und würdig aus.
theological_decisions:
- issue: Personifizierung des göttlichen Wortes
  choice: „dein Wort erging“ ohne zusätzliche christologische Deutung
  alternative: „du sprachst“ oder eine ausdrückliche Identifikation des Wortes mit einer Person
  rationale: Der Text spricht vom wirksamen Wort Gottes, identifiziert es an dieser Stelle jedoch nicht ausdrücklich mit einer Person. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. „erging“ und „sogleich“ sind gehoben, aber allgemein verständlich; die knappe Satzstruktur spiegelt die Unmittelbarkeit des Schöpfungshandelns.
