    issue: „bewahrt hast“ für habuisti
    rationale: Das lateinische Verb bedeutet hier, dass Esra die Reinheit seit seiner Jugend hatte; „bewahren“ stellt zusätzlich ein aktives Erhalten beziehungsweise eine mögliche Bedrohung der Reinheit in den Text.
  revised_text: Denn deine Stimme hat beim Höchsten wirklich Gehör gefunden. Der Mächtige hat deinen Lebenswandel gesehen und auf die Reinheit geachtet, die du seit deiner Jugend hast.
