id: 2ES.6.32
reference: 2 Esdras 6:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: de
  text: Denn deine Stimme hat beim Höchsten wirklich Gehör gefunden. Der Mächtige hat deinen Lebenswandel gesehen und auf die Reinheit geachtet, die du seit deiner Jugend hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est
  choice: wirklich gehört worden
  rationale: Die figura etymologica verstärkt die Aussage des Hörens. Natürliches Deutsch gibt diese Bekräftigung mit „wirklich“ wieder, ohne die lateinische Dopplung künstlich nachzuahmen.
- source_word: apud Altissimum
  choice: beim Höchsten
  rationale: „Beim Höchsten“ bewahrt sowohl die Gottesbezeichnung als auch die Vorstellung, dass die Stimme vor ihm beziehungsweise in seiner Gegenwart Gehör fand.
- source_word: Fortis
  choice: der Mächtige
  rationale: Die substantivierte Gottesbezeichnung wird würdevoll und eng am lateinischen Ausdruck wiedergegeben.
- source_word: directionem tuam
  choice: deinen Lebenswandel
  rationale: Im Zusammenhang bezeichnet „directio“ die Ausrichtung beziehungsweise Führung des Lebens. „Lebenswandel“ ist im Deutschen verständlicher als das wörtliche „Ausrichtung“ und legt nicht ausdrücklich moralische Rechtschaffenheit in den Ausdruck hinein.
- source_word: providit
  choice: hat … geachtet
  rationale: Das Verb kann ein Wahrnehmen, Beachten oder fürsorgliches Ansehen ausdrücken. „Auf … geachtet“ erhält diese Bedeutungsbreite, ohne bloßes Sehen mit dem vorausgehenden „vidit“ zu wiederholen.
- source_word: pudicitiam
  choice: Reinheit
  rationale: Der Ausdruck kann Sittsamkeit, Keuschheit oder moralische Reinheit meinen. „Reinheit“ bewahrt die weitere Bedeutung und vermeidet eine unnötige Verengung auf Sexualethik.
- source_word: quam a iuventute tua habuisti
  choice: die du seit deiner Jugend bewahrt hast
  rationale: Das lateinische „haben“ bezeichnet hier eine seit der Jugend fortbestehende Eigenschaft. „Bewahrt hast“ klingt im Deutschen natürlich und bringt die zeitliche Beständigkeit zum Ausdruck.
theological_decisions:
- issue: Göttliche Beachtung von Lebensführung und Reinheit
  choice: Die Aussage wird als Feststellung wiedergegeben, dass Gott Esras Lebenswandel gesehen und seine Reinheit beachtet hat.
  alternative: Man könnte „providit“ stärker als göttliche Vorsehung oder Fürsorge verstehen.
  rationale: Der unmittelbare Parallelismus mit „vidit“ spricht vor allem für Wahrnehmung und Beachtung; eine spezifische Lehre von der Vorsehung sollte hier nicht in den Text eingetragen werden.
- issue: Bedeutungsumfang von „pudicitia“
  choice: Reinheit
  alternative: Keuschheit oder Sittsamkeit
  rationale: Der Kontext bestimmt nicht eindeutig, dass ausschließlich sexuelle Enthaltsamkeit gemeint ist. Die weitere Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Sätze folgen dem lateinischen Gedankengang, vermeiden jedoch unnatürliche Wortwiederholung. Gottesbezeichnungen werden substantiviert und großgeschrieben.
