source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'factum est cum audissem, et surrexi super pedes meos et audiui, et ecce uox loquens, et sonus eius sicut sonus aquarum multarum. Et dixit : ecce dies ueniunt, et erit quando adpro-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: de
  text: Als ich das hörte, richtete ich mich auf meine Füße und hörte zu. Siehe, eine Stimme redete, und ihr Klang war wie das Rauschen vieler Wasser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est cum audissem
  choice: Als ich das hörte
  rationale: Die lateinische Erzählungsformel wird natürlich und ohne Bedeutungsverlust wiedergegeben.
- source_word: surrexi super pedes meos
  choice: stand ich auf, stellte mich auf meine Füße
  rationale: Bewahrt sowohl das Aufstehen als auch die ausdrückliche Wendung »auf meine Füße«, ohne unnatürlich zu klingen.
- source_word: audiui
  choice: lauschte
  rationale: Im Zusammenhang bezeichnet das Verb bewusstes Hinhören; »lauschte« vermeidet die unmittelbare Wiederholung von »hörte«.
- source_word: ecce uox loquens
  choice: Da sprach eine Stimme
  rationale: Gibt das überraschende Auftreten der sprechenden Stimme in idiomatischem Deutsch wieder.
- source_word: sonus aquarum multarum
  choice: das Rauschen gewaltiger Wassermassen
  rationale: »Viele Wasser« ist eine semitisch geprägte Wendung für mächtige, umfangreiche Wassermengen; »Rauschen« bezeichnet hier natürlich deren Klang.
