id: 2ES.6.58
reference: 2 Esdras 6:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: de
  text: Wir aber, dein Volk, das du deinen Erstgeborenen, deinen Einzigen, deinen Eiferer[a] und deinen Liebsten genannt hast, sind in ihre Hände ausgeliefert worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische Wort ist schwierig und kann einen Eifernden, Nacheifernden oder Rivalen bezeichnen. Die Reihe häuft Bundestitel für Israel an, statt sie zu einer glatten Umschreibung zusammenzufassen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: übergeben worden.'
    reason: translation_alternative
lexical_decisions:
- source_word: primogenitum
  choice: deinen Erstgeborenen
  rationale: Gibt den Bundes- und Ehrentitel wörtlich und in vertrauter biblischer Sprache wieder.
- source_word: unigenitum
  choice: deinen Einzigen
  rationale: Bewahrt den Sinn der Einzigkeit, ohne durch „Einziggeborenen“ eine im Kontext nicht ausdrücklich aufgelöste christologische Festlegung einzutragen.
- source_word: aemulatorem
  choice: deinen Eiferer
  rationale: Das schwierige lateinische Wort kann einen Eifernden, Nacheifernden oder Rivalen bezeichnen. „Eiferer“ hält diese Spannung eher offen als eine glättende Wiedergabe wie „Geliebten“.
- source_word: carissimum
  choice: deinen Liebsten
  rationale: Entspricht dem Superlativ und unterscheidet diesen letzten Ehrentitel klar von aemulatorem.
- source_word: traditi sumus in manibus eorum
  choice: sind in ihre Hände ausgeliefert worden
  rationale: „Ausgeliefert“ gibt die feindliche Preisgabe von tradere präziser wieder als das allgemeinere „gegeben“; die Wendung „in ihre Hände“ bleibt erhalten.
theological_decisions:
- issue: Reihe der Bundestitel für Israel
  choice: Alle vier Titel werden einzeln und in der Reihenfolge des lateinischen Textes wiedergegeben.
  alternative: Die Reihe zu einer allgemeinen Aussage über Israels besondere Erwählung glätten.
  rationale: 'Die Häufung der Titel trägt die theologische Spannung des Verses: Das höchstgeehrte Volk ist dennoch seinen Gegnern ausgeliefert.'
- issue: Wiedergabe von unigenitum
  choice: deinen Einzigen
  alternative: deinen Einziggeborenen
  rationale: „Einzigen“ bezeichnet Israels einzigartige Stellung, ohne eine mögliche, aber hier nicht erzwungene dogmatische Konnotation vorzuschreiben.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst biblischem Klang bei „Erstgeborenen“ und „in ihre Hände“. Die markante Reihung der Ehrentitel und der Gegensatz zur Auslieferung bleiben erhalten.
