    issue: Grammatische Kongruenz und Anschluss des Schöpfungsbefehls
    rationale: Das Bezugswort „Teil“ ist im Deutschen Neutrum; daher kann nicht „er solle“ stehen. Zudem ist „jemandem etwas sagen, dass ...“ natürlicher als „zu jemandem sagen, er solle ...“. Die Änderung betrifft nur die deutsche Grammatik, nicht den Sinn.
