  source_fidelity: Die Zeitangabe, das adversative „aber“, der Dativ „dem siebten Teil“ und die schlichte Orts-/Zustandsangabe „wo das Wasser war“ entsprechen dem lateinischen Text. Der über den erhaltenen lateinischen Ausschnitt hinausgehende Schöpfungsauftrag folgt nachvollziehbar der englischen Auditfassung.
  naturalness: 'Die Formulierung „sagtest du zum siebten Teil ... er solle“ ist im Deutschen sowohl in der Rektion als auch in der grammatischen Kongruenz holprig: „Teil“ ist sächlich. „sagtest du dem ... dass es ... hervorbringe“ ist idiomatisch und wahrt den gehobenen biblischen Registerton.'
  terminology: „Wasser“ bewahrt den Singular von aqua. „lebende Geschöpfe, Vögel und Fische“ sowie „hervorbringen“ sind für den aus der englischen Konsultationsschicht ergänzten Satzteil angemessen und nicht doktrinär eingeengt.
