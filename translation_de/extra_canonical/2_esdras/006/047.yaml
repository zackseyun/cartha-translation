  yaml_path: translation/extra_canonical/2_esdras/006/047.yaml
  text: On the fifth day you said to the seventh part, where the water was gathered, that it should bring forth living creatures, birds, and fish;
translation:
  language: de
  text: Am fünften Tag aber sagtest du dem siebten Teil, wo das Wasser war, dass es lebende Geschöpfe, Vögel und Fische hervorbringe;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinto autem die
  choice: Am fünften Tag aber
  rationale: Gibt sowohl die Zeitangabe als auch die leicht fortführende beziehungsweise kontrastierende Funktion von „autem“ wieder.
- source_word: septimae parti
  choice: zum siebten Teil
  rationale: Formale und verständliche Entsprechung des Dativs; der folgende Konjunktiv wird im Deutschen mit „er solle“ angeschlossen.
- source_word: ubi erat aqua
  choice: wo das Wasser war
  rationale: Folgt dem vorliegenden lateinischen Singular „aqua“ und dem schlichten „erat“, ohne den im lateinischen Ausschnitt nicht belegten Gedanken des Sammelns einzutragen.
- source_word: living creatures, birds, and fish
  choice: lebende Geschöpfe, Vögel und Fische
  rationale: Natürliche, würdevolle Wiedergabe der im geprüften englischen Konsultationstext überlieferten Aufzählung; dieser Satzteil steht außerhalb des bereitgestellten lateinischen Ausschnitts.
- source_word: bring forth
  choice: hervorbringen
  rationale: Passt idiomatisch zur Schöpfungssprache und bewahrt die kausative Aussage des Konsultationstextes.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der überlieferte lateinische Ausschnitt endet bei „aqua“; der restliche Versinhalt wurde aus der auditierten englischen Konsultationsschicht übernommen. Das Semikolon bewahrt den offenen Anschluss des Verses.
