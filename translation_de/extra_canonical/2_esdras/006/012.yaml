- source_word: surge super pedes tuos
  choice: Stell dich auf deine Füße
  rationale: Bewahrt das konkrete Bild des lateinischen Befehls, ohne unnatürlich wörtlich zu klingen.
- source_word: audies
  choice: du wirst hören
  rationale: Gibt das Futur wieder und lässt den am Versende noch unvollständigen Gedanken offen.
