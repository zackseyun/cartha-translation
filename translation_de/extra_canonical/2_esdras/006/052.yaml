  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: de
  text: Dem Leviatan aber gabst du den feuchten siebten Teil; und du hast sie[a] aufbewahrt, damit sie für wen du willst und wann du willst zur Nahrung dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Lateinischen stehen hier Pluralformen: „du hast sie aufbewahrt, damit sie … dienen“. Gemeint sind im unmittelbaren Zusammenhang offenbar die beiden zuvor genannten Geschöpfe Behemot und Leviatan.'
    reason: Der Plural von „ea“ und „fiant“ soll gegenüber der singularischen englischen Konsultationsfassung im deutschen Text sichtbar bleiben; die Anmerkung erläutert den naheliegenden Rückbezug.
lexical_decisions:
- source_word: Leuiathan
  choice: Leviatan
  rationale: Die im modernen Deutschen gebräuchliche Form des biblischen Namens.
- source_word: septimam partem humidam
  choice: den feuchten siebten Teil
  rationale: Gibt die lateinische Wortgruppe klar und natürlich wieder; gemeint ist der siebte, vom Wasser bedeckte Teil der Schöpfung.
- source_word: seruasti
  choice: hast … aufbewahrt
  rationale: Bewahrt die Bedeutung des Zurückbehaltens für einen späteren, von Gott bestimmten Zweck.
- source_word: ut fiant in
  choice: damit sie zur Nahrung werden
  rationale: Der überlieferte Ausschnitt bricht nach „in“ ab; die Fortsetzung wird durch die vollständige, geprüfte Konsultationsfassung gestützt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug des lateinischen Plurals „ea … fiant“
  choice: „sie“ als Rückbezug auf die beiden zuvor genannten Geschöpfe
  alternative: Singularischer Rückbezug allein auf Leviatan oder auf den feuchten siebten Teil
  rationale: „ea“ und „fiant“ sind im Lateinischen eindeutig Pluralformen. Daher wird die grammatische Spannung nicht nach der englischen Revision zum Singular geglättet.
- issue: Gottes Verfügung über die Geschöpfe
  choice: „für wen du willst und wann du willst“
  alternative: Eine nähere Bestimmung der Empfänger oder des Zeitpunkts
  rationale: Die offene Formulierung lässt Gottes souveräne Bestimmung stehen, ohne Empfänger oder Zeitpunkt auslegend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am lateinischen Parallelismus, ohne unnatürlich zu wirken; die genuine Mehrdeutigkeit des Rückbezugs wird durch den Plural im Text und eine knappe Fußnote bewahrt.
