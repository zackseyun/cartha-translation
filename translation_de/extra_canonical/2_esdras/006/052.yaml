  terminology: „Leviatan“ ist die übliche deutsche biblische Namensform. „feuchten siebten Teil“ gibt „septimam partem humidam“ hinreichend genau wieder. Die Fußnote ist sachlich und sinnvoll, sollte aber den Plural nicht als bloßes „offenbar“ darstellen, sondern als grammatisch klaren Befund mit kontextuell naheliegendem Bezug.
