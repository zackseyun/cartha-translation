  yaml_path: translation/extra_canonical/2_esdras/006/021.yaml
  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: de
  text: Und einjährige Kinder werden mit eigener Stimme sprechen, und Schwangere werden drei oder vier Monate alte Frühgeborene[a] zur Welt bringen, und sie werden leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unreife Kinder von drei oder vier Monaten“.'
    reason: Die lateinische Formulierung ist ungewöhnlich; die Fußnote bewahrt ihre wörtlichere Gestalt neben der idiomatischen Übersetzung.
lexical_decisions:
- source_word: anniculi infantes
  choice: einjährige Kinder
  rationale: „Anniculi“ bezeichnet Einjährige; „Kinder“ ist im Deutschen natürlicher als „Säuglinge“ und bewahrt dennoch die auffällige Aussage, dass sie sprechen werden.
- source_word: loquentur uocibus suis
  choice: werden mit eigener Stimme sprechen
  rationale: Gibt sowohl das Verb „sprechen“ als auch die reflexive Wendung „mit ihrer/eigener Stimme“ wieder, ohne einen im Lateinischen nicht vorhandenen Zusatz einzuführen.
- source_word: immaturos ... infantes trium et quatuor mensium
  choice: drei und vier Monate alte Frühgeborene
  rationale: „Frühgeborene“ gibt den Sinn von „immaturos infantes“ idiomatisch wieder; „drei und vier Monate alte“ bewahrt die ungewöhnliche Zeitangabe des Lateins.
- source_word: uiuent
  choice: sie werden leben
  rationale: Entspricht dem schlichten Futur des lateinischen „vivent“ und vermeidet die stärkere Deutung „überleben“.
theological_decisions:
- issue: Art des endzeitlichen Zeichens
  choice: Die ungewöhnlichen Geburten und das Leben der Frühgeborenen werden ohne erklärende Deutung wiedergegeben.
  alternative: Die Aussage als wunderbares Überleben ausdrücklich auslegen.
  rationale: Der lateinische Text berichtet das Zeichen knapp und lässt seine genaue theologische Bedeutung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem knappen, aufzählenden Charakter des lateinischen Ausgangstextes. Der in einer älteren englischen Fußnote erwähnte Zusatz „herumspringen“ wurde nicht aufgenommen, da er im bereitgestellten lateinischen Text nicht steht.
