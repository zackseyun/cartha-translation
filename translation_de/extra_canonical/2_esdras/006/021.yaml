  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzfolge und alle wesentlichen Elemente des lateinischen Textes wieder: einjährige Kinder sprechen, Schwangere bringen unreife bzw. vorzeitig geborene Kinder zur Welt, und diese leben. „Frühgeborene“ ist eine vertretbare idiomatische Wiedergabe von „immaturos ... infantes“. Die Zeitangabe „trium et quatuor mensium“ sollte im Deutschen jedoch klar als Alternative bzw. Verteilung von drei oder vier Monaten formuliert werden.'
  naturalness: Der Stil ist modern, verständlich und dem knappen aufzählenden Duktus angemessen. „Drei und vier Monate alte“ ist im Deutschen zwar möglich, kann aber so verstanden werden, als seien dieselben Personen zugleich drei und vier Monate alt. „Drei oder vier Monate alte“ ist klarer und wahrt den Sinn der lateinischen Reihung.
  terminology: „Kinder“ für „infantes“ und „Frühgeborene“ für „immaturos ... infantes“ sind sachlich und registergerecht. Es werden keine theologischen Deutungen ergänzt. Die Fußnote ist sinnvoll, sollte aber die klarere Zeitangabe ebenfalls übernehmen.
