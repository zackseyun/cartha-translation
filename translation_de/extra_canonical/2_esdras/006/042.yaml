revisions:
- from: Und am dritten Tag hast du den Wassern geboten, sich im siebten Teil der Erde zu sammeln; die sechs anderen Teile aber hast du trockengelegt und bewahrt, damit aus ihnen vor dir Saaten und Kulturen seien, die dir dienen.
  to: Und am dritten Tag hast du den Wassern geboten, sich im siebten Teil der Erde zu sammeln; die sechs anderen Teile aber hast du trockengelegt und bewahrt, damit aus ihnen Gesätes und Angebautes hervorgehe, um dir vor Augen zu dienen.
  rationale: Die Revision ersetzt die missverständliche und wenig idiomatische Wortverbindung „Saaten und Kulturen“ durch „Gesätes und Angebautes“. Damit werden die substantivierten Partizipien seminata und culta sachgerecht und ohne unnötige Eingrenzung wiedergegeben. Die abschließende Zweckbestimmung verbindet „vor dir“ und „dienend“ in natürlichem modernen Deutsch.
