source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: de
  text: Und am dritten Tag hast du den Wassern geboten, sich im siebten Teil der Erde zu sammeln; die sechs anderen Teile aber hast du trockengelegt und bewahrt, damit aus ihnen Gesätes und Angebautes hervorgehe, um dir vor Augen zu dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: im siebten Teil der Erde
  rationale: 'Gibt die räumliche Zuordnung des lateinischen Ausdrucks natürlich wieder: Die Wasser werden auf einen von sieben Teilen der Erde begrenzt.'
- source_word: sex vero partes siccasti et conservasti
  choice: die sechs anderen Teile aber hast du trockengelegt und bewahrt
  rationale: „anderen“ verdeutlicht idiomatisch den Gegensatz zum zuvor genannten siebten Teil, ohne zusätzliche Sachinformation einzuführen; „bewahrt“ erhält conservasti.
- source_word: seminata adeo et culta
  choice: Saaten und Kulturen
  rationale: Bewahrt die substantivische, sachlich nicht ganz eindeutige Formulierung für das Gesäte und Angebaute; „Kulturen“ bezeichnet hier landwirtschaftlich Angebautes.
- source_word: coram te ministrantia
  choice: vor dir … die dir dienen
  rationale: Erhält sowohl coram te als auch die Dienstbeziehung von ministrantia und ordnet das Partizip verständlich den Saaten und Kulturen zu.
theological_decisions:
- issue: Bezug von „ministrantia“
  choice: auf „Saaten und Kulturen“ bezogen
  alternative: auf die sechs trockengelegten Teile oder allgemein auf deren Erzeugnisse bezogen
  rationale: Die Stellung und der grammatische Zusammenhang legen den Bezug auf seminata … et culta nahe; die Formulierung lässt den bildhaften Gedanken bestehen, dass das Geschaffene Gott dient.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem feierlichen Gebetsstil, bleibt aber gut verständlich; „trockengelegt“ ist hier natürlicher als das wörtlichere „getrocknet“.
