  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
translation:
  language: de
  text: 'sammelte sich, damit es Tiere, Vögel und Fische hervorbrächte; und so geschah es: Das stumme, leblose Wasser brachte lebende Geschöpfe hervor, wie ihm geboten worden war.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Satzbau am Ende ist stark verkürzt; sinngemäß auch: „Das stumme, leblose Wasser tat, was ihm geboten worden war: Es brachte lebende Geschöpfe hervor.“'
    reason: Die überlieferte lateinische Wortfolge „quod ei iubebatur, animalia“ ist syntaktisch gedrängt und lässt sich im Deutschen nicht zugleich wörtlich und verständlich wiedergeben.
lexical_decisions:
- source_word: congregata
  choice: sammelte sich
  rationale: Das Partizip nimmt das Wasser aus dem vorangehenden Zusammenhang wieder auf. Die reflexive Form gibt das Zusammenströmen im natürlichen Deutschen wieder, ohne ein im Latein nicht genanntes handelndes Subjekt einzuführen.
- source_word: procrearet
  choice: hervorbrächte
  rationale: „Hervorbringen“ passt zum Schöpfungszusammenhang und bewahrt den finalen Sinn von „ut“ mit Konjunktiv.
- source_word: animalia, uolatilia et pisces
  choice: Tiere, Vögel und Fische
  rationale: „Volatilia“ bezeichnet wörtlich fliegende Wesen; im Zusammenhang ist „Vögel“ die natürliche deutsche Wiedergabe. „Animalia“ bleibt hier allgemein „Tiere“.
- source_word: aqua muta et sine anima
  choice: das stumme, leblose Wasser
  rationale: Die auffällige Personifikation wird bewahrt. „Leblos“ gibt „sine anima“ idiomatisch wieder, ohne daraus eine dogmatische Aussage über eine Seele zu machen.
- source_word: animalia
  choice: lebende Geschöpfe
  rationale: Am Satzende bezeichnet „animalia“ die vom zuvor leblosen Wasser hervorgebrachten Lebewesen. „Lebende Geschöpfe“ wahrt den Schöpfungston und die Abgrenzung zum leblosen Wasser.
theological_decisions:
- issue: Das leblose Wasser bringt auf Gottes Gebot hin Lebewesen hervor
  choice: Die Spannung zwischen dem leblosen Medium und den lebenden Geschöpfen bleibt ausdrücklich erhalten.
  alternative: Den Satz glätten und lediglich sagen, im Wasser seien Tiere entstanden.
  rationale: Die lateinische Formulierung betont gerade das Wunder, dass das „stumme“ und „seelenlose“ Wasser dem Gebot gehorcht und Leben hervorbringt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als Fortsetzung des vorangehenden Satzes; deshalb bleibt der Anfang kleingeschrieben. Die Personifikation des Wassers und der feierliche Schöpfungston werden bewahrt.
