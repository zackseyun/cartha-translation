source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: de
  text: und bevor die Höhen der Lüfte emporgehoben wurden, und bevor die Maße der Himmelsgewölbe benannt wurden, und bevor der Fußschemel vermessen wurde[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eingeschätzt oder veranschlagt. Das lateinische Wort bezeichnet nicht eindeutig ein konkretes Messen.'
    reason: aestimaretur kann ein Schätzen, Bewerten oder Veranschlagen bezeichnen; die Anmerkung bewahrt diese Breite, ohne ein nicht ausdrücklich vorliegendes „Bestimmen“ nahezulegen.
lexical_decisions:
- source_word: altitudines aerum
  choice: die Höhen der Luft
  rationale: Gibt den Plural altitudines und den Bereich der Luft möglichst unmittelbar und natürlich wieder.
- source_word: extollerentur
  choice: emporgehoben wurden
  rationale: Bewahrt das Passiv und die räumliche Grundbedeutung von extollere.
- source_word: mensurae firmamentorum
  choice: die Maße der Himmelsgewölbe
  rationale: Wahrt die Pluralformen; „Himmelsgewölbe“ vermittelt firmamenta in verständlichem, würdigem Deutsch.
- source_word: nominarentur
  choice: benannt wurden
  rationale: Entspricht dem passiven „genannt/benannt werden“, ohne es zu „festgelegt“ umzudeuten.
- source_word: scabellum
  choice: der Fußschemel
  rationale: Direkte und im biblischen Sprachgebrauch geläufige Entsprechung.
- source_word: aestimaretur
  choice: vermessen wurde
  rationale: Passt zum kosmischen Kontext von Maßen, während die breitere Bedeutung des lateinischen Verbs in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Nicht näher bestimmter „Fußschemel“
  choice: der Fußschemel
  alternative: der Fußschemel Zions
  rationale: Der lateinische Text nennt weder Zion noch einen anderen Besitzer oder Ort; eine nähere Bestimmung würde den überlieferten Wortlaut erweitern.
- issue: Kosmologische Bildsprache bei firmamentorum
  choice: Himmelsgewölbe
  alternative: Firmamente
  rationale: „Himmelsgewölbe“ ist für heutige Leser verständlicher, ohne die Mehrzahl oder die antike kosmologische Bildsprache aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur des lateinischen Textes bleibt erhalten; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
