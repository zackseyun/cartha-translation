  text: And it said, “Behold, days are coming, and it will be that when I begin to draw near to visit those who dwell on the earth,
translation:
  language: de
  text: 'Und es sprach: »Siehe, es kommen Tage, da werde ich beginnen, mich zu nähern, um die Bewohner der Erde aufzusuchen.[a] Und wenn …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu besuchen«; das lateinische Wort kann in diesem Zusammenhang auch ein göttliches Eingreifen, einschließlich eines Gerichts, andeuten.'
    reason: »Aufsuchen« bewahrt im Haupttext die offene Grundbedeutung von uisitare; die Anmerkung benennt die im Kontext mögliche weitergehende Bedeutung, ohne sie festzulegen.
lexical_decisions:
- source_word: 'appropinquare incipio (im vorgelegten Ausschnitt verkürzt: pinquare incipio)'
  choice: werde ich beginnen, mich zu nähern
  rationale: Gibt den Beginn einer Annäherung ausdrücklich wieder und folgt zugleich der im englischen Konsultationstext bezeugten Rekonstruktion des am Ausschnittanfang verstümmelten Verbs.
- source_word: uisitem
  choice: heimzusuchen
  rationale: Bewahrt die mögliche Spannweite von göttlichem Aufsuchen, Eingreifen und Gericht besser als das neutralere »besuchen«, ohne das Ergebnis vorwegzunehmen.
- source_word: habitantes in terra
  choice: die Bewohner der Erde
  rationale: Natürliche und sachlich genaue Wiedergabe der auf der Erde Wohnenden.
- source_word: Et quando
  choice: Und wenn …
  rationale: Erhält den im überlieferten Ausschnitt offenen Anschluss an den folgenden Vers- oder Satzteil.
theological_decisions:
- issue: Bedeutung des göttlichen Besuchens
  choice: heimzusuchen
  alternative: zu besuchen
  rationale: Der Kontext lässt ein machtvolles göttliches Eingreifen erwarten, legt hier aber dessen rettenden oder richtenden Ausgang noch nicht eindeutig fest. »Heimsuchen« wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« bewahrt den feierlichen Ankündigungscharakter. Der Auslassungspunkt macht kenntlich, dass der vorgelegte lateinische Ausschnitt mit »Und wenn« abbricht; der im englischen Konsultationstext bezeugte Satzanfang wurde aufgenommen.
