source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: finis enim huius saeculi Esau, et principium sequentis Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: de
  text: Denn das Ende dieses Zeitalters ist Esau, und der Anfang des folgenden Zeitalters ist Jakob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: Zeitalters
  rationale: Im eschatologischen Zusammenhang bezeichnet saeculum die gegenwärtige Weltzeit beziehungsweise das gegenwärtige Zeitalter; „Zeitalter“ gibt diesen zeitlichen Sinn präzise und verständlich wieder.
- source_word: finis
  choice: Ende
  rationale: Die direkte Entsprechung bewahrt den Gegensatz zu principium.
- source_word: principium
  choice: Anfang
  rationale: Die direkte Entsprechung erhält die rhetorische Paarung „Ende … Anfang“.
- source_word: sequentis
  choice: des folgenden
  rationale: Das substantivierte Adjektiv bezieht sich elliptisch auf das folgende Zeitalter. Die knappe Form wahrt diese Ellipse, ohne den Bezug im Deutschen unverständlich zu machen.
- source_word: Esau / Iacob
  choice: Esau / Jakob
  rationale: Verwendet die im modernen deutschen Bibelgebrauch üblichen Namensformen.
theological_decisions:
- issue: Verhältnis Esaus und Jakobs zu den beiden Zeitaltern
  choice: 'Prädikative Identifikation: „das Ende … ist Esau“ und „der Anfang … ist Jakob“'
  alternative: „Esau steht für das Ende …; Jakob steht für den Anfang …“
  rationale: Die Übersetzung bewahrt die zugespitzte Bildsprache des lateinischen Textes und löst sie nicht interpretierend als bloße Symbolvertretung auf.
- issue: Satzgliedstellung und rhetorischer Anschluss
  choice: „das Ende dieses Zeitalters“ und „der Anfang des folgenden“ stehen jeweils vor dem Namen
  alternative: „Esau ist das Ende …, und Jakob ist der Anfang …“
  rationale: Die lateinische Reihenfolge finis … Esau / principium … Iacob hebt Ende und Anfang hervor und greift damit die Fragestellung des Kontextes auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele und leicht markierte Wortstellung bewahrt die rhetorische Struktur des lateinischen Satzes; wegen der Kürze und Klarheit ist keine Fußnote erforderlich.
