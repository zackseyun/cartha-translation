  text: 'Et factum est cum loqueretur mihi, et ecce paulatim mouebatur locus super quem stabam super eum. Et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/029.yaml
  text: 'And it happened[a], while he was speaking to me, behold, the place on which I was standing was gradually moving. And he said to me:'
translation:
  language: de
  text: 'Und es geschah, während er mit mir redete: Siehe, der Ort, auf dem ich stand, bewegte sich allmählich[a]. Und er sagte zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde allmählich erschüttert.“'
    reason: „paulatim mouebatur“ kann allgemein eine allmähliche Bewegung und, kontextabhängig, ein allmähliches Erschüttertwerden bezeichnen. Der Haupttext bleibt bewusst neutral.
lexical_decisions:
- source_word: paulatim mouebatur
  choice: bewegte sich allmählich
  rationale: Gibt die schrittweise Bewegung neutral und direkt wieder; das lateinische Passiv kann hier idiomatisch reflexiv übersetzt werden, ohne die Bewegung ausdrücklich als Erschütterung zu deuten.
- source_word: locus super quem stabam
  choice: der Ort, auf dem ich stand
  rationale: Formnahe und im Deutschen verständliche Wiedergabe der räumlichen Angabe.
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt das markierende, visionäre Aufmerksamkeitssignal des Ausgangstextes in würdigem biblischem Register.
theological_decisions:
- issue: Art der Bewegung des Ortes
  choice: bewegte sich
  alternative: wurde erschüttert
  rationale: mouebatur bezeichnet zunächst allgemein ein Bewegtwerden bzw. Sichbewegen. Da der lateinische Text keine eindeutige Festlegung auf ein Beben enthält, wird die neutralere Bedeutung im Haupttext bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Prägung. Der Doppelpunkt nach dem einleitenden Geschehen gliedert den langen lateinischen Satz natürlich; der abschließende Doppelpunkt bleibt erhalten, da die folgende Rede angekündigt wird.
