  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: de
  text: Doch dies alles habe ich vor dir ausgesprochen, Herr, weil du gesagt hast, dass du um unseretwillen die erstgeborene Welt[a] erschaffen hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem lateinischen Text: »die erstgeborene Welt«. Andere alte Sprachfassungen bezeugen hier »diese Welt«; möglich ist, dass »erstgeboren« im lateinischen Überlieferungstext versehentlich aus Vers 58 hierher gelangte. Auch »die erste Welt« ist als Deutung vorgeschlagen worden.'
    reason: textual_variant
lexical_decisions:
- source_word: autem
  choice: Doch
  rationale: Kennzeichnet den Übergang und den Gegensatz zum vorausgehenden Gedankengang, ohne ihn übermäßig stark zuzuspitzen.
- source_word: haec omnia dixi coram te
  choice: dies alles habe ich vor dir ausgesprochen
  rationale: Gibt dixi und coram te natürlich und zugleich eng am lateinischen Wortlaut wieder.
- source_word: propter nos
  choice: um unseretwillen
  rationale: Bewahrt die Zweck- beziehungsweise Begünstigungsrelation des lateinischen Ausdrucks.
- source_word: primogenitum saeculum
  choice: die erstgeborene Welt
  rationale: Folgt dem vorgelegten lateinischen Haupttext formal; saeculum bezeichnet hier die Welt beziehungsweise Weltzeit, primogenitum wörtlich ‚erstgeboren‘.
theological_decisions:
- issue: Textkritisch schwierige Lesart primogenitum saeculum
  choice: die erstgeborene Welt
  alternative: diese Welt / die erste Welt
  rationale: Der bereitgestellte lateinische Text bietet ausdrücklich primogenitum saeculum. Da die Lesart ungewöhnlich und möglicherweise verderbt ist, wird sie im Haupttext bewahrt und die wichtige Variantenfrage in einer Fußnote offengelegt, statt die Kosmologie stillschweigend zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »erstgeborene Welt« wird wegen der lateinischen Quellenlesart beibehalten, aber durch eine textkritische Fußnote transparent gemacht.
