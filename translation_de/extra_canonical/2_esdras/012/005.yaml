  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des lateinischen Textes zutreffend wieder: spiritu meo, die starke Erschöpfung, die emphatische Verneinung von Kraft, den kausalen Bezug der großen Furcht und das anschließende Gebetsvorhaben. Die Wiedergabe von expavi als Erschrecken wahrt im Haupttext zu Recht die Intensität des Verbs.'
