  yaml_path: translation/extra_canonical/2_esdras/012/005.yaml
  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: de
  text: In meinem Geist bin ich sehr schwach, und nicht die geringste Kraft ist in mir wegen der großen Angst, die mich in dieser Nacht erschreckt hat.[a] Darum werde ich nun beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen der großen Angst, vor der ich mich in dieser Nacht sehr gefürchtet habe«.'
    reason: Die Konstruktion timorem quem expavi kann idiomatisch mit einer Umschreibung des erschrockenen bzw. sich fürchtenden Reagierens wiedergegeben werden. Anders als „empfand“ bewahrt diese Alternative die starke Bedeutung von expavi.
lexical_decisions:
- source_word: spiritu meo
  choice: in meinem Geist
  rationale: Gibt den lateinischen Ablativ natürlich wieder und bewahrt den inneren, geistigen Bezug.
- source_word: inualidus sum ualde
  choice: bin ich sehr schwach
  rationale: Entspricht unmittelbar der starken Aussage körperlich beziehungsweise innerlich empfundener Schwäche, ohne sie näher festzulegen.
- source_word: nec modica est in me uirtus
  choice: nicht die geringste Kraft ist noch in mir
  rationale: Gibt die emphatische Verneinung idiomatisch wieder; „Kraft“ trifft virtus in diesem Zusammenhang besser als „Tugend“.
- source_word: a multo timore
  choice: wegen der großen Angst
  rationale: a bezeichnet hier den Grund; „Angst“ ist im modernen Deutsch natürlicher als „Furcht“ und bewahrt die Intensität von multus.
- source_word: quem expaui nocte hac
  choice: die mich in dieser Nacht in Schrecken versetzt hat
  rationale: Erfasst die starke Bedeutung von expavesco als heftiges Erschrecken und vermeidet die Abschwächung zu bloßem Empfinden.
- source_word: Nunc ergo orabo
  choice: Darum will ich nun beten
  rationale: Gibt Folgerung, zeitlichen Bezug und das futurische Vorhaben klar und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Geist“ und „Kraft“ hält die innere Erschöpfung des Sprechers deutlich auseinander; die Intensität der nächtlichen Angst bleibt erhalten.
