lexical_decisions:
- source_word: Et factum est
  choice: Und es geschah
  rationale: Gibt die traditionelle lateinische Erzählformel würdig und unmittelbar wieder.
- source_word: dum loqueretur
  choice: während … richtete
  rationale: Bewahrt das zeitliche Verhältnis; »Worte an jemanden richten« ist im Deutschen natürlicher als »Worte zu jemandem sprechen«.
- source_word: leo
  choice: der Löwe
  rationale: Direkte, eindeutige Entsprechung.
- source_word: uerba haec
  choice: diese Worte
  rationale: Formale und zugleich natürliche Wiedergabe.
- source_word: ad
  choice: an den Adler
  rationale: Die Präposition verlangt hier ein Ziel der Rede. »Den Adler« wird aus dem unmittelbaren Erzählzusammenhang ergänzt, da der vorgelegte lateinische Wortlaut nach »ad« abbricht.
