  text: upon the earth[a], and it will be the terror of all the kingdoms that were before it.
translation:
  language: de
  text: auf der Erde, und es wird der Schrecken aller Königreiche sein, die ihm vorausgingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen Lesart: „und es wird furchterregender sein als alle Königreiche, die ihm vorausgingen.“'
    reason: Bewahrt die plausible komparativische Lesart „timoratior“, ohne sie gegen den vorgelegten Wortlaut in den Haupttext zu setzen.
lexical_decisions:
- source_word: super terram
  choice: auf der Erde
  rationale: Gibt die räumliche Wendung vollständig und innerhalb der vorgegebenen Versgrenze wieder.
- source_word: timoratio omnium regnorum
  choice: der Schrecken aller Königreiche
  rationale: Folgt dem überlieferten Substantiv „timoratio“ und gibt den Genitiv „omnium regnorum“ natürlich wieder, ohne im Haupttext einen nicht ausdrücklich vorhandenen Komparativ einzuführen.
- source_word: quae fuerunt ante eam
  choice: die vor ihm bestanden
  rationale: „bestanden“ entspricht dem vergangenen Dasein der Königreiche besser als ein bloß zeitliches „waren“. Das deutsche Pronomen bezieht sich sinngemäß auf das zuvor genannte Reich beziehungsweise Gebilde.
theological_decisions:
- issue: Textliche Spannung zwischen dem überlieferten „timoratio“ und der erschlossenen komparativischen Lesart „timoratior“
  choice: 'Im Haupttext substantivisch: „der Schrecken aller Königreiche“'
  alternative: „furchterregender als alle Königreiche“
  rationale: Die vorgelegte lateinische Quelle hat „timoratio“; die alternative komparativische Deutung ist jedoch textgeschichtlich plausibel und wird deshalb ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als versübergreifendes Fragment erhalten. Die Formulierung ist eng am lateinischen Wortlaut, aber idiomatisch lesbar.
