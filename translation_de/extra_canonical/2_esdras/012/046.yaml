  yaml_path: translation/extra_canonical/2_esdras/012/046.yaml
  text: And I answered them and said[a], “Take courage, Israel, and do not grieve.”
translation:
  language: de
  text: 'Und ich antwortete ihnen und sagte: »Fasse Mut, Israel, und sei nicht traurig.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Confide
  choice: Fasse Mut
  rationale: Der lateinische Singularimperativ richtet sich an Israel als Kollektiv. »Fasse Mut« gibt die Aufforderung idiomatisch und würdevoll wieder, ohne sie auf bloßes Vertrauen oder Zuversicht zu verengen.
- source_word: noli tristari
  choice: sei nicht traurig
  rationale: Die Konstruktion aus »noli« und Infinitiv bezeichnet eine verneinte Aufforderung; »sei nicht traurig« ist im modernen Deutsch natürlich und entspricht dem Sinn von »tristari«.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller direkter Rede. Die nicht im angegebenen lateinischen Vers enthaltene Wendung »Haus Jakob« wurde weder in den Haupttext noch in eine Fußnote aufgenommen.
