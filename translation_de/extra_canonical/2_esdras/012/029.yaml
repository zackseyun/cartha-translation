  yaml_path: translation/extra_canonical/2_esdras/012/029.yaml
  text: 'the two little wings crossing over to the head that is on the right side—this is the interpretation: these are the ones whom the Most High has preserved in[a]'
translation:
  language: de
  text: 'die beiden kleinen Flügel, die sich über den Kopf auf der rechten Seite hinüberzogen – dies ist die Deutung: Sie sind diejenigen, die der Höchste in'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duas subalares
  choice: die beiden kleinen Flügel
  rationale: „Subalares“ bezeichnet hier die kleineren Flügel der Adlergestalt; „kleine Flügel“ ist im Deutschen klar und entspricht dem Bildzusammenhang.
- source_word: treicentes super caput
  choice: die zu dem Kopf … hinüberzogen
  rationale: Die bereinigte Form „treicentes“ wird im Sinn von „hinübergehend/hinüberziehend“ verstanden. Die Richtungsangabe zum rechten Kopf wird natürlich wiedergegeben, ohne das Bild näher auszudeuten.
- source_word: quod est a dextera parte
  choice: auf der rechten Seite
  rationale: Gibt die räumliche Lage des Kopfes knapp und idiomatisch wieder.
- source_word: conseruauit
  choice: bewahrt hat
  rationale: Entspricht dem lateinischen Perfekt und lässt offen, worin oder wofür die Betreffenden bewahrt wurden.
- source_word: altissimus
  choice: der Höchste
  rationale: Traditionelle und zugleich allgemein verständliche Gottesbezeichnung für „Altissimus“.
theological_decisions:
- issue: Unvollständiger Schluss bei „in“
  choice: Der Vers endet bewusst mit „in“.
  alternative: Das fehlende Satzglied aus dem folgenden Text ergänzen oder den Satz glatt abschließen.
  rationale: Die vorgelegte lateinische Quelle bricht nach der Präposition „in“ ab. Eine Ergänzung wäre nicht durch den angegebenen Quelltext gedeckt und würde die fragmentarische Überlieferung verdecken.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich macht den Übergang von der Vision zu ihrer Deutung sichtbar. Der unvollständige Schluss bildet den bereitgestellten lateinischen Text genau ab.
