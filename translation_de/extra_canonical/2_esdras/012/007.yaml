  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your servant.”
translation:
  language: de
  text: 'Und ich sagte: „O Herr, du Herrscher, wenn ich Gnade vor deinen Augen gefunden habe, wenn ich vor dir mehr als viele andere gerechtfertigt worden bin und wenn mein Flehen gewiss vor dein Angesicht hinaufgestiegen ist, dann stärke mich und zeige mir, deinem Sklaven, [a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im folgenden Vers fortgesetzt; dort folgt, was Gott seinem Sklaven zeigen soll.
    reason: Die lateinische Versfassung endet nach »zeige mir, deinem Sklaven« und lässt das Objekt des Verbs bis zum folgenden Vers offen.
lexical_decisions:
- source_word: 'dominator domine (im überlieferten Versanfang nur: nator domine)'
  choice: O Herr, mein Gebieter
  rationale: Der am Versübergang geteilte Titel wird sinngemäß vollständig wiedergegeben. Die Anrede wahrt sowohl die Herrschaftsbezeichnung als auch »domine«, ohne das im Deutschen schwerfällige »Herrscher, Herr« zu verwenden.
- source_word: gratiam
  choice: Gnade
  rationale: Entspricht der festen lateinischen Wendung »gratiam invenire ante oculos« und bewahrt ihren religiösen Gehalt.
- source_word: iustificatus sum
  choice: gerechtfertigt worden bin
  rationale: Die passive Form und die mögliche forensisch-theologische Spannung des Verbs bleiben erhalten.
- source_word: prae multis
  choice: mehr als viele andere
  rationale: Gibt den vergleichenden Sinn von »prae« wieder, ohne »allen anderen« zu behaupten.
- source_word: certum ascendit deprecatio mea
  choice: mein Flehen gewiss … hinaufgestiegen ist
  rationale: Bewahrt das Bild des aufsteigenden Gebets und gibt »certum« adverbial wieder.
- source_word: Conforta me
  choice: stärke mich
  rationale: Direkte und natürliche Wiedergabe der Bitte um Kraft.
- source_word: seruo tuo mihi
  choice: mir, deinem Sklaven
  rationale: Die beiden Dativformen werden als Apposition verstanden. »Sklave« bildet den rechtlichen und sozialen Grundsinn von »servus« deutlicher ab als das heute mehrdeutige »Diener«.
- source_word: ostende
  choice: zeige
  rationale: Das Verb bleibt transitiv und ohne ausdrücklich genanntes Objekt, da dieses in der fortlaufenden Satzkonstruktion erst im nächsten Vers folgt. Eine reflexive Ergänzung wie »zeige dich« steht nicht im Latein.
theological_decisions:
- issue: Bedeutung von iustificatus sum
  choice: gerechtfertigt worden bin
  alternative: als gerecht anerkannt worden bin
  rationale: Die formale Wiedergabe erhält offen, ob eine rechtliche Anerkennung, moralische Bewährung oder ein weiter gefasstes Rechtfertigungsgeschehen gemeint ist.
- issue: Ergänzung zu ostende
  choice: Kein Objekt und kein Reflexivpronomen ergänzt
  alternative: zeige dich mir
  rationale: Der lateinische Text sagt nicht »zeige dich«. Die unvollständige Konstruktion setzt sich offenbar mit dem Gegenstand des Zeigens im folgenden Vers fort; die Übersetzung soll diese Versgrenze nicht theologisch oder inhaltlich umdeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltenen biblischen Bildwendungen wie »vor deinen Augen« und »vor dein Angesicht hinaufgestiegen«. Die Satzstruktur bleibt wegen der Quellenversifikation am Versende offen.
