  rationale: Das Relativpronomen leitet einen auf die zwölf Flügel bezogenen Relativsatz ein. Obwohl der bereitgestellte lateinische Ausschnitt nach „quas“ abbricht, wird der durch die überlieferte Versgestalt und die geprüfte englische Konsultationsfassung bezeugte Sinn vollständig ausgedrückt.
