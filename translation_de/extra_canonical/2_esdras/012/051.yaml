id: 2ES.12.51
reference: 2 Esdras 12:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: de
  text: Ich aber saß sieben Tage lang auf dem Feld, wie er mir geboten hatte, und aß nur die Blumen des Feldes; in jenen Tagen wurde meine Nahrung aus Kräutern zubereitet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedi
  choice: blieb
  rationale: Das lateinische Perfekt von »sedere« kann in diesem Zusammenhang ein anhaltendes Verweilen bezeichnen. »Blieb« gibt die siebentägige Dauer im natürlichen Deutschen wieder, ohne eine ununterbrochen sitzende Körperhaltung nahezulegen.
- source_word: flores ... agri
  choice: die Blumen des Feldes
  rationale: Die konkrete Bedeutung von »flores« und die Genitivverbindung mit »agri« werden direkt und würdig wiedergegeben.
- source_word: herbis
  choice: Kräuter
  rationale: »Herbae« bezeichnet essbare Kräuter beziehungsweise krautartige Feldpflanzen. »Kräuter« bewahrt die Unterscheidung gegenüber den zuvor genannten »Blumen«, ohne den Begriff unnötig zu verengen.
- source_word: facta est mihi esca
  choice: dienten mir als Nahrung
  rationale: Diese idiomatische deutsche Formulierung bewahrt den Sinn, dass die Kräuter für den Sprecher zur Nahrung wurden, und vermeidet die missverständliche Vorstellung, jemand habe daraus eine Speise zubereitet.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzgliederung und der Gegensatz zwischen »Blumen des Feldes« und »Kräutern« bleiben erhalten.
