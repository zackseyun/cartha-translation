  text: For the second who begins to reign will hold power longer[a]
translation:
  language: de
  text: Denn der Zweite, der zu regieren beginnt, wird länger an der Macht bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird länger innehaben“. Womit verglichen wird, bleibt in diesem Vers unausgesprochen.'
    reason: Die lateinische Formulierung lässt sowohl das Objekt von tenebit als auch den Vergleichsmaßstab von amplius implizit.
lexical_decisions:
- source_word: Nam
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung oder Erläuterung ein und ist nicht adversativ.
- source_word: secundus
  choice: der Zweite
  rationale: Die substantivierte Ordnungszahl bleibt erhalten, da der Zusammenhang die gemeinte Person bestimmt.
- source_word: qui incipiet regnare
  choice: der zu regieren beginnt
  rationale: Natürliches modernes Deutsch; das lateinische Futur wird im Deutschen idiomatisch durch das Präsens wiedergegeben.
- source_word: ipse tenebit amplius
  choice: wird länger an der Macht bleiben
  rationale: Gibt das implizite Objekt von tenebit im Zusammenhang mit regnare natürlich wieder. amplius bleibt als offener Vergleich ohne ergänzten Bezug erhalten.
theological_decisions:
- issue: Unausgesprochener Vergleich bei amplius
  choice: Keinen Vergleichsmaßstab in den Haupttext ergänzen
  alternative: „länger als jeder der Zwölf“ oder „länger als die Zwölf“
  rationale: Der vorgelegte lateinische Vers nennt keinen Vergleichsmaßstab. Eine Ergänzung würde die im Wortlaut bestehende Offenheit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „An der Macht bleiben“ ist allgemein verständlich und entspricht dem politischen Zusammenhang, ohne einen im lateinischen Vers nicht genannten Vergleichsmaßstab einzufügen.
