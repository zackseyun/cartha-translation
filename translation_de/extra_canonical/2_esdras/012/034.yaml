  source_fidelity: Der Vers ist vollständig wiedergegeben, einschließlich des abschließenden „Dies ist der Traum“. Die Übersetzung folgt dem lateinischen Satzbau und wahrt die als Apposition formulierte nähere Bestimmung der Geretteten. „Mit Barmherzigkeit“ gibt cum misericordia ohne den im Ausgangstext nicht ausdrücklich gesetzten possessiven Bezug wieder.
  naturalness: Die vorliegende Gedankenstrich-Apposition „mein Volk – die, die ...“ ist im Deutschen syntaktisch und stilistisch holprig. Eine Komma-Apposition mit „nämlich“ macht die Einschränkung verständlich, ohne den Sinn zu verändern. „Sie erfreuen“ ist eine unmittelbare, natürliche Wiedergabe von iocundabit eos.
  terminology: „Tag des Gerichts“ entspricht dies iudicii. „Innerhalb meiner Grenzen“ folgt der audit-trail-gestützten kontextuellen Bedeutung von super fines meos. „Gerettet“ ist für salvati angemessen und wahrt die soteriologische Offenheit des lateinischen Ausdrucks.
