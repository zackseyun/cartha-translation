  text: populum meum liberabit cum misericordia, qui saluati sunt super fines meos, et iocundabit eos, quoadusque ueniat finis, dies iudicii, de quo locutus sum tibi ab initio. Hoc est somnium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/034.yaml
  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: de
  text: Er wird mein Volk mit Barmherzigkeit befreien, nämlich die, die innerhalb meiner Grenzen gerettet worden sind, und wird sie erfreuen, bis das Ende kommt, der Tag des Gerichts, von dem ich von Anfang an zu dir gesprochen habe. Dies ist der Traum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum misericordia
  choice: in seiner Barmherzigkeit
  rationale: Gibt die modale Wendung natürlich und würdevoll wieder, ohne den Bezug der Barmherzigkeit über den Kontext hinaus festzulegen.
- source_word: qui saluati sunt
  choice: die, die ... gerettet worden sind
  rationale: Bewahrt das Perfekt-Passiv und den rückbezüglichen Anschluss an »mein Volk«.
- source_word: super fines meos
  choice: innerhalb meiner Grenzen
  rationale: Im Kontext bezeichnet die Wendung den bewahrten Bereich innerhalb der göttlichen Grenzen; eine wörtliche Wiedergabe mit »über/auf meinen Grenzen« wäre im Deutschen irreführend.
- source_word: iocundabit eos
  choice: wird sie mit Freude erfüllen
  rationale: 'Natürliches Deutsch für das kausative Verb: Er bewirkt ihre Freude.'
- source_word: quoadusque ueniat finis
  choice: bis das Ende kommt
  rationale: Nahe und idiomatische Wiedergabe des zeitlichen Ausdrucks.
- source_word: Hoc est somnium
  choice: Dies ist der Traum
  rationale: Entspricht dem lateinischen Wortlaut und hält die Versabgrenzung ein.
theological_decisions:
- issue: Bezug und Umfang der Geretteten
  choice: Apposition »die, die innerhalb meiner Grenzen gerettet worden sind«
  alternative: »mein Volk, das innerhalb meiner Grenzen gerettet worden ist«
  rationale: Die appositive Form bewahrt die mögliche Einschränkung durch den lateinischen Relativsatz, ohne ausdrücklich eine Rest-Theologie aus dem vorhergehenden Vers einzutragen.
- issue: Agens der Barmherzigkeit
  choice: »in seiner Barmherzigkeit«
  alternative: »mit Barmherzigkeit«
  rationale: Das possessive Pronomen macht im Deutschen den natürlichen Bezug zum handelnden »er« deutlich, ohne eine zusätzliche Lehrentscheidung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche kennzeichnen die erklärende beziehungsweise einschränkende Apposition und halten den langen Satz gut verständlich. Kein Text aus Vers 33 wurde übernommen; der Schluss »Dies ist der Traum« bleibt gemäß der lateinischen Quelle in Vers 34.
