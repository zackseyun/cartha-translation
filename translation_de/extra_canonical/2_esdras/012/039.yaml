source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seruare secreta haec. Tu autem adhuc sustine hic alios dies septem, ut tibi ostendatur quicquid uisum fuerit altissimo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/039.yaml
  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: de
  text: Du aber bleib noch sieben weitere Tage hier, damit dir alles gezeigt wird, was der Höchste für gut befinden wird.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sustine hic
  choice: bleib … hier
  rationale: „Sustinere“ kann hier wörtlich ein Ausharren oder Warten bezeichnen; im Zusammenhang ist das natürliche deutsche „bleib hier“ treffend.
- source_word: alios dies septem
  choice: sieben weitere Tage
  rationale: Gibt die zeitliche Fortsetzung idiomatisch und genau wieder.
- source_word: quicquid uisum fuerit altissimo
  choice: alles …, was der Höchste dir zeigen will
  rationale: Die lateinische Wendung bedeutet wörtlich etwa „was immer dem Höchsten gut erscheinen wird“. In Verbindung mit „dir gezeigt wird“ gibt die gewählte Formulierung den Sinn natürlich wieder, ohne den Umfang der Offenbarung einzuschränken.
theological_decisions:
- issue: Göttliche Entscheidung über den Inhalt der Offenbarung
  choice: was der Höchste dir zeigen will
  alternative: was dem Höchsten gut erscheint
  rationale: Die Formulierung bewahrt, dass der Höchste selbst bestimmt, was offenbart wird, und vermeidet zugleich eine im Deutschen schwerfällige Wiederholung von „zeigen/gezeigt“.
- issue: Im englischen Konsultationstext enthaltener Abschiedssatz
  choice: „Und er ging von mir fort“ nicht aufgenommen
  alternative: Den Satz nach dem überlieferten Abschnitt ergänzen
  rationale: Der Satz steht nicht im angegebenen lateinischen Ausgangstext und wird daher nicht allein aufgrund der englischen Konsultationsschicht ergänzt.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Der einleitende Rest „seruare secreta haec“ wurde als Abschluss des vorausgehenden Satzes behandelt, entsprechend dem Verszuschnitt des englischen Konsultationstextes. Das schließende Anführungszeichen signalisiert das Ende der direkten Rede.
