  source_fidelity: Die Wiedergabe von „sustine hic alios dies septem“ mit „bleib noch sieben weitere Tage hier“ ist sachgerecht. „quicquid visum fuerit altissimo“ bedeutet jedoch nicht, was der Höchste „zeigen will“, sondern was ihm gut bzw. angemessen erscheinen wird. Der Ausgangstext enthält keinen Abschiedssatz; dessen Auslassung ist daher richtig.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „für gut befinden wird“ gibt die lateinische Entscheidungsformel idiomatisch wieder, ohne die wiederholte Verwendung von „zeigen“ zu erzwingen.
  terminology: „der Höchste“ ist eine passende Wiedergabe von „altissimus“. Die Formulierung wahrt, dass der Inhalt der Offenbarung dem göttlichen Ermessen untersteht, ohne dieses auf einen ausdrücklichen Willensakt des Zeigens zu verengen.
  issues:
