  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
translation:
  language: de
  text: 'Und es wird geschehen: Wenn er sie zurechtgewiesen hat, dann wird er sie vernichten. Denn der Rest[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im folgenden Vers fortgesetzt.
    reason: Der lateinische Quelltext dieses Verses endet mitten im Satz mit „Nam residuum“ („Denn der Rest …“).
lexical_decisions:
- source_word: arguerit
  choice: zurechtgewiesen hat
  rationale: Das lateinische arguere kann je nach Zusammenhang „überführen“, „anklagen“ oder „zurechtweisen“ bedeuten. „Zurechtweisen“ gibt hier die richterliche Konfrontation natürlich wieder, ohne den Sinn unnötig auf ein förmliches Gerichtsverfahren festzulegen.
- source_word: corrumpet
  choice: wird er sie vernichten
  rationale: Corrumpere kann „verderben“, „zugrunde richten“ oder „vernichten“ bedeuten. Im Gerichtskontext bezeichnet es hier die endgültige Beseitigung der zuvor Zurechtgewiesenen.
- source_word: residuum
  choice: der Rest
  rationale: Die knappe substantivische Wendung wird formal bewahrt; im vorliegenden Quellenausschnitt beginnt sie einen Satz, der erst im folgenden Text weitergeführt wird.
theological_decisions:
- issue: Art und Tragweite des angekündigten Gerichts
  choice: „wird er sie vernichten“
  alternative: „wird er sie zugrunde richten“
  rationale: Die stärkere Wiedergabe entspricht dem gerichtlichen Gebrauch von corrumpere, ohne über den Text hinaus festzulegen, ob damit Tod, politische Beseitigung oder endgültiges eschatologisches Verderben gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „Und es wird geschehen“ bewahrt den feierlichen Übergang des lateinischen et erit; das ausdrückliche „dann“ bildet die Folgebeziehung von cum … tunc ab.
