  source_fidelity: 'Der deutsche Text gibt den lateinischen Wortlaut präzise wieder: „cum arguerit eos“ als vorzeitiges „wenn/sobald er sie zurechtgewiesen hat“, „tunc corrumpet eos“ als anschließendes Vernichten und „Nam residuum“ als bewusst unvollständigen Satzanfang. Die zeitliche und argumentative Verknüpfung bleibt erhalten.'
  naturalness: 'Modernes, würdiges Standarddeutsch. „Und es wird geschehen: Wenn er sie zurechtgewiesen hat, dann wird er sie vernichten“ ist verständlich und bildet die feierlich-prophetische Syntax des Lateinischen angemessen nach.'
  terminology: „Zurechtgewiesen“ ist für arguere im gerichtlichen Kontext tragfähig, ohne die Bedeutung unzulässig auf eine technische Anklage einzuengen. „Vernichten“ ist für corrumpet im gegebenen Gerichtszusammenhang vertretbar. „Der Rest“ bewahrt residuum formal und semantisch.
