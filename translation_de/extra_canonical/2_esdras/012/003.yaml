  text: 'et ego a multo excessu mentis et a magno timore uigilaui, et dixi spiritui meo: Ecce tu mihi praestitisti haec in eo quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: de
  text: 'Da erwachte ich aus tiefer Entrückung[a] und aus großer Furcht und sagte zu meinem Geist: »Siehe, du hast mir all dies widerfahren lassen, weil'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus großer Verwirrung des Geistes«.'
    reason: Das lateinische „excessus mentis“ kann einen ekstatischen oder tranceartigen Zustand bezeichnen, ist hier aber auch als starke geistige Bestürzung beziehungsweise Verwirrung verständlich.
lexical_decisions:
- source_word: a multo excessu mentis
  choice: aus großer Verwirrung des Geistes
  rationale: „Excessus mentis“ bezeichnet einen außergewöhnlichen, visionär-psychischen Zustand und kann Entrückung, Ekstase oder Geistesverwirrung meinen. Die gewählte Formulierung folgt dem unmittelbaren Zusammenhang von Erwachen und Furcht, ohne die Wendung auf eine eindeutig positive Ekstase festzulegen.
- source_word: uigilaui
  choice: erwachte ich
  rationale: Die konkrete Grundbedeutung von „vigilare“ passt zum Übergang aus dem visionären Zustand.
- source_word: spiritui meo
  choice: zu meinem Geist
  rationale: Die ungewöhnliche Selbstanrede des lateinischen Textes bleibt erhalten; eine Wiedergabe mit „zu mir selbst“ wäre natürlicher, würde aber das ausdrückliche „spiritui“ tilgen.
- source_word: praestitisti haec
  choice: du hast mir all dies widerfahren lassen
  rationale: Die Formulierung gibt „haec“ ausdrücklich wieder und vermittelt, dass der angesprochene Geist das Erlebte herbeigeführt beziehungsweise ermöglicht hat, ohne unnötig eine böswillige Verursachung anzunehmen.
- source_word: in eo quod
  choice: weil
  rationale: Die kausale Verbindung bleibt als bewusst unvollendeter Anschluss an den folgenden Vers stehen.
theological_decisions:
- issue: Art des visionären Zustands
  choice: Verwirrung des Geistes
  alternative: tiefe Entrückung
  rationale: Das lateinische „excessus mentis“ lässt sowohl einen ekstatisch-visionären Zustand als auch Bestürzung beziehungsweise geistige Verwirrung anklingen. Der Haupttext wahrt den Zusammenhang mit großer Furcht; die alternative Deutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wendung „zu meinem Geist“ und der am Versende offene Kausalsatz wurden quellentreu bewahrt.
