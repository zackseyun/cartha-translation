lexical_decisions:
- source_word: Et quoniam
  choice: Und weil
  rationale: Gibt die begründende Verknüpfung des lateinischen Ausdrucks natürlich und eng am Satzbau wieder.
- source_word: audisti uocem
  choice: du eine Stimme gehört hast
  rationale: Direkte, idiomatische Wiedergabe des lateinischen Perfekts mit persönlicher Anrede.
- source_word: quae locuta est
  choice: die … sprach
  rationale: Das Relativpronomen bezieht sich auf „Stimme“; das deutsche Präteritum hält die Formulierung klar und würdig.
- source_word: non de
  choice: nicht von
  rationale: Bewahrt die räumliche Herkunftsangabe, ohne ein zusätzliches Verb wie „hervorkam“ einzuführen.
- source_word: de medio corporis
  choice: aus der Mitte seines Körpers
  rationale: Folgt der im konsultierten vollständigen Vers bezeugten räumlichen Gegenüberstellung und formuliert sie in natürlichem Deutsch.
