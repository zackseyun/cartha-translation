source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: regnum quartum quod uisum est in uisu Danihelo fratri tuo. Sed non est illi interpretatum quomodo ego nunc tibi interpretor
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/011.yaml
  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: de
  text: das vierte Reich, das deinem Bruder Daniel in einer Vision erschien. Es wurde ihm jedoch nicht so gedeutet, wie ich es dir jetzt deute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: das vierte Reich
  rationale: „Reich“ ist die natürliche und sachlich passende Wiedergabe von „regnum“ im apokalyptischen Zusammenhang.
- source_word: quod uisum est in uisu
  choice: das … in einer Vision gezeigt wurde
  rationale: Die idiomatische deutsche Passivform gibt das lateinische Sehen einer Offenbarungsvision klar wieder, ohne den Inhalt näher zu bestimmen.
- source_word: Danihelo fratri tuo
  choice: deinem Bruder Daniel
  rationale: Bewahrt die geistliche beziehungsweise gemeinschaftliche Verwandtschaftsbezeichnung des Ausgangstextes, ohne sie auszudeuten.
- source_word: interpretatum / interpretor
  choice: gedeutet / deute
  rationale: „Deuten“ passt zu einer symbolischen Vision besser als das allgemeinere „auslegen“ und erhält die Wiederholung desselben lateinischen Wortstamms sinngemäß.
theological_decisions:
- issue: Art der Bruderschaft zwischen Esra und Daniel
  choice: deinem Bruder Daniel
  alternative: Daniel, deinem Volksgenossen
  rationale: Der Ausgangstext sagt ausdrücklich „fratri tuo“. Eine erklärende Eingrenzung auf ethnische oder geistliche Zugehörigkeit würde die mögliche Bedeutung unnötig festlegen.
- issue: Umfang der früheren Deutung für Daniel
  choice: Ihm wurde es jedoch nicht so gedeutet, wie ich es dir jetzt deute.
  alternative: Doch ihm wurde es nicht erklärt; dir aber erkläre ich es jetzt.
  rationale: „quomodo“ bezeichnet die Art und Weise der Deutung. Die gewählte Fassung vermeidet die stärkere Behauptung, Daniel habe überhaupt keine Deutung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am lateinischen Gedankengang, klingt aber natürlich. Da der Vers im Zusammenhang offenbar syntaktisch an den vorhergehenden Satz anschließt, beginnt die Fassung mit einem Kleinbuchstaben.
