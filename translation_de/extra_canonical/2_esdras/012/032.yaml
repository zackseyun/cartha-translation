  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Ohne den eingefügten damit-Satz bleibt die Aussage ebenso verständlich und näher am knappen, dichten Satzbau der Vorlage.
  terminology: „der Gesalbte“, „der Höchste“, „Gottlosigkeiten“, „Ungerechtigkeiten“ und „Verachtung“ sind passende, theologisch nicht überbestimmende Entsprechungen. Die Fußnote zu unctus erläutert den Kontext, ohne den Haupttext auf „Messias“ festzulegen.
