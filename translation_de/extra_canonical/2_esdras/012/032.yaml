id: 2ES.12.32
reference: 2 Esdras 12:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: de
  text: Das ist der Gesalbte[a], den der Höchste für die Endzeit gegen sie und ihre Gottlosigkeiten[b] aufbewahrt hat. Er wird sie wegen ihrer Ungerechtigkeiten zurechtweisen und ihnen ihre Verachtung vor Augen stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lateinisch unctus, wörtlich „Gesalbter“. In dieser Vision tritt die Gestalt als endzeitlicher Retter auf, der das Adlerreich zurechtweist und den Rest des Volkes rettet; der Titel hat daher messianischen Klang.
    reason: messianic_passage
  - marker: b
    text: 'Oder nach einer früheren, hier jedoch irrtümlich eingefügten Wiedergabe: „Und der Löwe, den du aus dem Wald hervorkommen sahst, der brüllte, zum Adler redete und ihn wegen seiner Ungerechtigkeiten und aller seiner Worte zurechtwies, wie du es gehört hast —“ Dieser Satz gehört zum vorangehenden Abschnitt; der lateinische Text dieses Verses spricht vom Gesalbten.'
    reason: previous_rendering
lexical_decisions:
- source_word: unctus
  choice: der Gesalbte
  rationale: Gibt den lateinischen Titel wörtlich wieder und lässt zugleich seine messianische Bedeutung im Zusammenhang der Vision erkennen.
- source_word: reservavit
  choice: aufbewahrt hat
  rationale: Bewahrt den Sinn des gezielten Zurückhaltens bis zu einem bestimmten Zeitpunkt; im Deutschen klingt dies natürlicher als eine rein administrative Formulierung wie „reserviert hat“.
- source_word: in finem
  choice: für die Endzeit
  rationale: Der visionäre Zusammenhang legt das endzeitliche Ziel nahe; „bis zum Ende“ wäre ebenfalls möglich, würde aber den Zweck- und Bestimmungsaspekt schwächer ausdrücken.
- source_word: impietates
  choice: Gottlosigkeiten
  rationale: Bezeichnet schuldhaftes, gegen Gott gerichtetes Handeln und ist stärker als das allgemeinere „Vergehen“.
- source_word: arguet
  choice: zurechtweisen
  rationale: Gibt das öffentliche Überführen und Rügen wieder, ohne vorschnell ein förmliches Gerichtsurteil auszudrücken.
- source_word: infulciet coram ipsis spretiones eorum
  choice: ihnen ihre Verachtung vor Augen stellen
  rationale: 'Gibt die bildhafte Aussage idiomatisch wieder: Ihr verächtliches Verhalten wird ihnen offen vorgehalten.'
theological_decisions:
- issue: Messianische Bedeutung von unctus
  choice: „der Gesalbte“ im Haupttext, mit erklärender Fußnote
  alternative: „der Messias“
  rationale: Die wörtliche Titelbezeichnung bleibt erhalten, während die Fußnote die im Kontext erkennbare messianische Funktion benennt, ohne sie stärker als die Quelle festzulegen.
- issue: Bezug und Funktion von ad eos et impietates ipsorum
  choice: „damit er gegen sie und ihre Gottlosigkeiten vorgeht“
  alternative: „gegen sie und ihre Gottlosigkeiten“ unmittelbar an „aufbewahrt“ anschließen
  rationale: Die lateinische Konstruktion ist knapp und im Deutschen bei wörtlicher Nachbildung schwer verständlich. Die finale Formulierung wahrt, dass der Gesalbte für ein endzeitliches Vorgehen gegen die Menschen und ihre Gottlosigkeiten aufbewahrt wird.
- issue: Sinn von spretiones eorum
  choice: ihre eigene Verachtung beziehungsweise ihr verächtliches Verhalten wird ihnen vorgehalten
  alternative: die Verachtung, die ihnen widerfährt
  rationale: Das Possessivpronomen lässt formal mehrere Beziehungen zu; der Parallelismus mit „ihren Ungerechtigkeiten“ spricht jedoch dafür, dass ihre eigenen verächtlichen Taten oder Äußerungen gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem knappen Latein leicht entfaltet, um den Zweckbezug von ad eos verständlich zu machen. „Vor Augen stellen“ ist eine geläufige, anschauliche Entsprechung für die ungewöhnliche Wendung infulciet coram ipsis.
