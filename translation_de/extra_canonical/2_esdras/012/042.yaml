  source_fidelity: Die Wiedergabe trifft die fortgeführte Frage, den Vergleichssinn von superasti und die beiden Bilder grundsätzlich. Das lateinische Perfekt superasti sollte im Deutschen jedoch als Perfekt wiedergegeben werden; die Präsensform „übertriffst“ schwächt diesen Befund ab. Das problematische nobis bleibt mit „für uns“ ausdrücklich erhalten, ohne es zur Aussage eines bloßen Übrigbleibens umzudeuten.
  naturalness: „Denn für uns hast du alle Propheten übertroffen“ ist in der Wortstellung natürlich und bewahrt die hervorgehobene Bezugnahme auf „uns“. „Eine Traube aus der Weinlese“ ist als Bild eines Traubenbüschels verständlich. Der Satzanfang bleibt aufgrund der versübergreifend fortgesetzten direkten Frage kleingeschrieben.
