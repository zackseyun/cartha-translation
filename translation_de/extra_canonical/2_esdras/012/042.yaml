  text: hast du an diesem Ort gesessen? Denn für uns hast du alle Propheten übertroffen, wie eine Traube aus der Weinlese und wie eine Lampe an einem dunklen Ort,“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedisti
  choice: hast du … gesessen
  rationale: Gibt das lateinische Perfekt in der vorliegenden, aus dem vorherigen Zusammenhang fortgeführten Frage wieder.
- source_word: nobis superasti ex omnibus prophetis
  choice: für uns übertriffst du alle Propheten
  rationale: Bewahrt den komparativen Sinn von superasti und gibt nobis ausdrücklich wieder, ohne die Aussage als ‚allein übrig geblieben‘ umzudeuten.
- source_word: botrus de uindemia
  choice: eine Traube von der Weinlese
  rationale: Erhält das konkrete Bild eines Traubenbüschels beziehungsweise einer Traube aus der Weinlese in verständlichem Deutsch.
- source_word: lucerna in loco obscuro
  choice: eine Lampe an einem dunklen Ort
  rationale: Nahe und natürliche Wiedergabe des lateinischen Bildes.
theological_decisions:
- issue: Esras Verhältnis zu allen Propheten
  choice: übertriffst du alle Propheten
  alternative: du allein bist uns von allen Propheten geblieben
  rationale: Der überlieferte lateinische Wortlaut superasti bezeichnet hier vorrangig ein Übertreffen; die alternative Deutung würde eine nicht ausdrücklich vorhandene Aussage über das Übrigbleiben eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt mitten in einer aus dem vorigen Vers fortgesetzten Frage; deshalb bleibt der Satzanfang kleingeschrieben. Die Schlussanführungszeichen zeigen das Ende der direkten Rede.
