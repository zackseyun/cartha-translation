  text: but this one also will fall by the sword in the last days[a]. And because you saw
translation:
  language: de
  text: Doch auch dieser wird in den letzten Tagen durch das Schwert fallen. Und weil du gesehen hast
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sed tamen
  choice: doch
  rationale: Gibt den adversativen und zugleich bekräftigenden Übergang knapp und natürlich wieder; ein zusätzliches »dennoch« neben »auch« wäre im Deutschen schwerfällig.
- source_word: et hic
  choice: auch dieser
  rationale: Bewahrt den rückverweisenden Charakter von »hic« und die additive Bedeutung von »et«.
- source_word: gladio
  choice: durch das Schwert
  rationale: Der Ablativ bezeichnet hier das Mittel, durch das er fällt.
- source_word: in nouissimis
  choice: in den letzten Tagen
  rationale: Gibt die eschatologisch-zeitliche Wendung verständlich wieder; das ergänzte »Tagen« entspricht dem Kontext und der konsultierten englischen Fassung.
- source_word: cadet
  choice: wird … fallen
  rationale: Bewahrt das Futur und das traditionelle Bild des Fallens durch das Schwert.
- source_word: Et quoniam uidisti
  choice: Und weil du gesehen hast
  rationale: Spiegelt den unvollständigen Anschluss des gelieferten Quelltextabschnitts, der im folgenden Vers fortgeführt wird.
theological_decisions:
- issue: Zeitliche Bedeutung von »in nouissimis«
  choice: in den letzten Tagen
  alternative: zuletzt / am Ende
  rationale: Die gewählte Formulierung bewahrt den möglichen endzeitlichen Klang, ohne ihn weiter dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzschluss bleibt bewusst offen, da auch der vorgelegte lateinische Abschnitt mit einem abhängigen Nebensatz endet.
