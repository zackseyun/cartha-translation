  source_fidelity: 'Der deutsche Text gibt den lateinischen Abschnitt vollständig und in seiner Satzfolge wieder: „sed tamen et hic“ wird angemessen mit „Doch auch dieser“ erfasst, „gladio“ als Mittel mit „durch das Schwert“, und das Futur „cadet“ mit „wird ... fallen“. Der unvollständige Anschluss „Et quoniam uidisti“ bleibt korrekt offen.'
  naturalness: Modernes, idiomatisches und zugleich würdiges Standarddeutsch. „Doch auch dieser wird ... fallen“ ist flüssig; der offene Schluss nach „weil du gesehen hast“ ist wegen des vorliegenden Abschnitts erforderlich.
  terminology: „Schwert“ und „in den letzten Tagen“ sind angemessen und bewahren den bildlichen beziehungsweise zeitlich-endzeitlichen Sprachklang des Ausgangstextes, ohne eine weitergehende Auslegung festzulegen. Die fehlende deutsche Fußnote ist kein Mangel, da die englische Fußnote lediglich eine frühere, hier nicht quellenkongruente Textzuordnung dokumentiert.
