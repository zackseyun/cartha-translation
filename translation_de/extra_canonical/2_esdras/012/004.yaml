  rationale: Drückt hier die Fortdauer des Zustands klar aus.
- source_word: fatigatus sum animo
  choice: ich bin noch immer im Innersten erschöpft
  rationale: Animo bezeichnet hier den inneren, seelisch-geistigen Menschen; „im Innersten“ wahrt diese Offenheit, ohne die Bedeutung einseitig auf „Seele“, „Geist“ oder „Gemüt“ festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von „animo“
  choice: im Innersten
  alternative: im Geist / in der Seele / im Gemüt
  rationale: Die neutrale Formulierung bewahrt die anthropologische Unschärfe des lateinischen Ausdrucks und vermeidet eine konfessionell oder systematisch aufgeladene Festlegung.
- issue: Unvollständiger Satzschluss
  choice: abschließendes „und“ beibehalten
  alternative: das „und“ auslassen oder den Satz ergänzen
  rationale: Der bereitgestellte Quellenausschnitt endet mit „et“; die syntaktische Offenheit soll nicht stillschweigend geglättet werden.
translation_notes:
