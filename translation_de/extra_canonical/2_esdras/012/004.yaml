  source_fidelity: '„erforschst“ gibt scrutas treffend wieder; „die Wege des Höchsten“ wahrt die Metapher und den Hoheitstitel. Die vorliegende Wiedergabe von animo als „im Innersten“ ist jedoch syntaktisch und idiomatisch weniger präzise: Das Latein bezeichnet die innere Verfassung des Sprechers, nicht einen bloß adverbialen Ort. „in meinem Innern“ gibt dies offen und quellentreu wieder. Das abschließende „und“ muss wegen des überlieferten et stehen bleiben.'
