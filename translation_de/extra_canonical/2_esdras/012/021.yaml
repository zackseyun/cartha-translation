  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: de
  text: deren Zeiten kurz[a] sein werden und deren Jahre rasch vergehen werden. Zwei von ihnen werden umkommen, wenn die mittlere Zeit naht; vier aber werden für die Zeit bewahrt bleiben, in der ihr Ende sich zu nahen beginnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „flüchtig“; wörtlich auch „leicht“.'
    reason: leuia hat ein breites Bedeutungsspektrum. Im zeitlichen Zusammenhang ist „kurz“ oder „flüchtig“ wahrscheinlicher, doch die wörtliche Bedeutung „leicht“ soll als mögliche Nuance sichtbar bleiben.
lexical_decisions:
- source_word: leuia
  choice: kurz
  rationale: Bei einer Zeitangabe bezeichnet levis hier am ehesten Kürze oder Flüchtigkeit. „Kurz“ gibt den Sinn natürlich wieder, ohne das im Deutschen irreführende Bild geringen Gewichts in den Haupttext zu übernehmen.
- source_word: anni citati
  choice: Jahre rasch vergehen
  rationale: citati bedeutet „schnell, beschleunigt, dahineilend“. Die verbale Fassung ist im Deutschen natürlicher als „rasche Jahre“ und bewahrt das Bild einer schnell verstreichenden Dauer.
- source_word: perient
  choice: werden umkommen
  rationale: perire bezeichnet Untergang oder Verderben; „umkommen“ bleibt nahe am Ausdruck und legt die genaue Art des Endes nicht fest.
- source_word: seruabuntur
  choice: werden … bewahrt bleiben
  rationale: Die passive Form wahrt den Gedanken des Erhalten- oder Verschontwerdens und entspricht dem gehobenen, aber verständlichen Register.
theological_decisions:
- issue: Bezug von „eius“ in „tempus eius ut finiatur“
  choice: „in der ihr Ende sich zu nahen beginnt“ mit Bezug auf „die Zeit“
  alternative: Bezug auf eine zuvor genannte Gestalt oder Herrschaft
  rationale: Der nächstliegende grammatische Bezug ist tempus. Die Formulierung bleibt jedoch zurückhaltend und fügt keine endzeitliche Deutung hinzu.
- issue: Deutung von „tempore medio“
  choice: „wenn die mittlere Zeit naht“
  alternative: „wenn die Mitte der Zeit naht“
  rationale: Die Wiedergabe folgt der Übereinstimmung von medio mit tempore und bewahrt die ungewöhnliche, möglicherweise technisch gemeinte Bezeichnung, statt sie als exakten Mittelpunkt auszulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers beginnt als Relativsatzfragment und behält damit den Anschluss an den vorausgehenden Kontext. Die ungewöhnliche Wendung „die mittlere Zeit“ wurde nicht erklärend geglättet.
