- source_word: Quid peccauimus tibi
  choice: Womit haben wir gegen dich gesündigt
  rationale: Das lateinische quid ist wörtlich offen, doch »Womit« gibt die Frage im modernen Deutschen natürlich wieder, ohne eine bestimmte Sünde vorauszusetzen.
- source_word: quid iniuste egimus in te
  choice: welches Unrecht haben wir dir angetan
  rationale: Gibt das ungerechte Handeln gegen eine Person idiomatisch und inhaltlich genau wieder.
- source_word: derelinquens dereliquisti nos
  choice: du uns völlig verlassen hast
  rationale: Die lateinische figura etymologica verstärkt das Verb; »völlig« bewahrt diese emphatische Wirkung in natürlichem Deutsch.
