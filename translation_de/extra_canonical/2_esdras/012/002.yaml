source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aquilam, et uidi Et ecce quod superauerat caput non conparuit. et surrexerunt alae duae quae ad eum transierunt et erectae sunt ut regnarent, et erat regnum eorum exile et tumulti plenum. Et uidi et ecce ipsa non apparesebant, et omne corpus aquilae incendebatur, et expauescebat terra ualde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: de
  text: 'dass ich hinsah, und siehe: Das Haupt, das übrig geblieben war, erschien nicht. Und die beiden Flügel, die zu ihm hinübergegangen waren, erhoben sich und wurden aufgerichtet, um zu herrschen; doch ihre Herrschaft war schwach und voller Unruhen. Und ich sah hin, und siehe: Auch sie erschienen nicht. Der ganze Körper des Adlers stand in Flammen,[a] und die Erde erschrak sehr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde verbrannt«.'
    reason: Das passive lateinische Imperfekt incendebatur kann den fortdauernden Vorgang auch als Verbranntwerden ausdrücken; ein abgeschlossener Brand wird nicht behauptet.
lexical_decisions:
- source_word: quod superauerat caput
  choice: das Haupt, das übrig geblieben war
  rationale: superauerat bezeichnet hier im Zusammenhang das verbleibende beziehungsweise überlebende Haupt; die Formulierung bewahrt den Bildcharakter.
- source_word: non conparuit / non apparesebant
  choice: erschien nicht mehr / waren nicht mehr zu sehen
  rationale: Beide Ausdrücke bezeichnen das Nicht-mehr-Erscheinen im Visionsbild. Die leicht variierte deutsche Wiedergabe ist natürlich und vermeidet die stärkere Aussage einer ausdrücklich beschriebenen Vernichtung.
- source_word: surrexerunt ... erectae sunt
  choice: erhoben sich und wurden aufgerichtet
  rationale: 'Die beiden gesonderten lateinischen Verbhandlungen werden erhalten: zuerst das Sich-Erheben, dann das passive Aufgerichtetwerden.'
- source_word: regnum eorum exile
  choice: ihre Herrschaft war schwach
  rationale: exile kann gering, dürftig oder schwach bedeuten. Im politischen Zusammenhang bezeichnet es eine wenig kraftvolle Herrschaft; die zeitliche Bedeutung „kurz“ ist nicht die unmittelbarste Aussage des lateinischen Wortes.
- source_word: tumulti plenum
  choice: voller Unruhen
  rationale: tumultus bezeichnet Aufruhr, Wirren oder Unruhen; der Plural ist im Deutschen idiomatisch.
- source_word: incendebatur
  choice: stand ... in Flammen
  rationale: Das lateinische Imperfekt beschreibt einen andauernden Brandvorgang, nicht notwendig dessen vollendetes Ergebnis.
- source_word: expauescebat terra ualde
  choice: die Erde geriet in große Furcht
  rationale: Bewahrt die Personifikation der Erde und die starke Intensivierung durch ualde in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Dauer oder Beschaffenheit der Herrschaft
  choice: schwach
  alternative: kurz
  rationale: Das lateinische exile beschreibt primär etwas Geringes, Schwaches oder Dürftiges. „Kurz“ wäre im Kontext möglich, würde aber eine zeitliche Deutung festlegen, die der Wortlaut nicht eindeutig verlangt.
- issue: Verbrennen des Adlerkörpers
  choice: stand in Flammen
  alternative: wurde verbrannt
  rationale: Die Übersetzung hält den durch das Imperfekt ausgedrückten fortlaufenden Vorgang fest und entscheidet nicht, ob der Adlerkörper vollständig verbrannte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener Visionssprache. „Siehe“ und „Haupt“ bewahren den biblisch-apokalyptischen Ton, ohne unnötig altertümlich zu wirken. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Textes mit „dass ich hinsah“.
