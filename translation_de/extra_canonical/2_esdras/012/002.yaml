revisions:
- from: 'dass ich hinsah, und siehe: Das Haupt, das übrig geblieben war, erschien nicht mehr. Und die beiden Flügel, die zu ihm hinübergegangen waren, erhoben sich und wurden aufgerichtet, um zu herrschen; doch ihre Herrschaft war schwach und voller Unruhen. Und ich sah hin, und siehe: Auch sie waren nicht mehr zu sehen. Da stand der ganze Körper des Adlers in Flammen,[a] und die Erde geriet in große Furcht.'
  to: 'dass ich hinsah, und siehe: Das Haupt, das übrig geblieben war, erschien nicht. Und die beiden Flügel, die zu ihm hinübergegangen waren, erhoben sich und wurden aufgerichtet, um zu herrschen; doch ihre Herrschaft war schwach und voller Unruhen. Und ich sah hin, und siehe: Auch sie erschienen nicht. Der ganze Körper des Adlers stand in Flammen,[a] und die Erde erschrak sehr.'
  rationale: Die Revision entfernt die nicht ausdrücklich markierte zeitliche Ergänzung »mehr« und ersetzt die abstrakte, ingressive Reaktion der Erde durch eine unmittelbare, dem lateinischen Ausdruck entsprechende Formulierung. Die übrigen Entscheidungen, einschließlich der getrennten Wiedergabe von surrexerunt und erectae sunt sowie der fortlaufenden Brandszene, bleiben erhalten.
