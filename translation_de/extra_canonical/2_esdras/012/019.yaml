  source_fidelity: 'Die Übersetzung gibt alle Elemente des lateinischen Ausschnitts wieder: „dann“ für tunc, den Gegensatz und die futurische Passivform in „Doch wird es wieder … versetzt werden“, die Wiederholung in „wieder“ sowie die offene kausale Fortsetzung „Und weil“ für Et quoniam. „in seinen ursprünglichen Zustand“ ist im Kontext eine tragfähige idiomatische Entfaltung von in suum initium, ohne den Inhalt dieses Zustands näher zu bestimmen.'
