translation:
  language: de
  text: dann. Doch wird es wieder in seinen ursprünglichen Zustand versetzt werden[a]. Und weil
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zu seinem Anfang«.'
    reason: Bewahrt die formale Bedeutung und mögliche Mehrdeutigkeit von „in suum initium“.
lexical_decisions:
- source_word: tunc
  choice: dann
  rationale: Gibt das lateinische Zeitadverb unmittelbar wieder; da der Ausschnitt mitten im Satz einsetzt, bleibt auch im Deutschen der Anschluss an den vorausgehenden Kontext erkennbar.
- source_word: sed iterum constituetur
  choice: Doch wird es wieder … versetzt werden
  rationale: Bewahrt den Gegensatz von „sed“, die Wiederholung von „iterum“ und die passive Zukunftsform von „constituetur“ in natürlichem Deutsch.
- source_word: in suum initium
  choice: in seinen ursprünglichen Zustand
  rationale: Das lateinische „initium“ bezeichnet hier wahrscheinlich nicht nur einen zeitlichen Anfangspunkt, sondern die anfängliche beziehungsweise ursprüngliche Verfassung. Eine wörtlichere Möglichkeit wird in der Fußnote erhalten.
- source_word: Et quoniam
  choice: Und weil
  rationale: Gibt die am Versende offenbleibende kausale Satzeinleitung ohne Ergänzung wieder.
theological_decisions:
- issue: Bedeutung von „in suum initium“
  choice: in seinen ursprünglichen Zustand
  alternative: zu seinem Anfang
  rationale: Die idiomatische Wiedergabe bezeichnet eine Wiederherstellung der früheren Verfassung, ohne näher festzulegen, worin diese besteht; die formale Lesart bleibt als Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anfang und das offene Satzende wurden beibehalten, weil der überlieferte Versausschnitt an beiden Stellen in den Zusammenhang übergeht.
