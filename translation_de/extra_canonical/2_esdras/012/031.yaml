  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: de
  text: wie du gesehen hast. Und der Löwe, den du aus dem Wald hervorkommen, brüllen und zum Adler sprechen gesehen hast und der ihn wegen seiner Ungerechtigkeiten und all seiner Worte zurechtwies, wie du gehört hast –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de silua euigilantem
  choice: aus dem Wald erwachen
  rationale: Gibt sowohl die Herkunftsangabe de silua als auch das Erwachen bzw. Sich-Erheben in euigilantem direkt und natürlich wieder.
- source_word: mugientem
  choice: brüllen
  rationale: Das lateinische Verb bezeichnet eigentlich ein dröhnendes Brüllen oder Brummen; bei einem Löwen ist „brüllen“ im Deutschen die natürliche Entsprechung.
- source_word: arguentem
  choice: zurechtwies
  rationale: Trifft hier den Sinn eines anklagenden Tadels, ohne den Ausdruck unnötig auf ein förmliches Gerichtsverfahren festzulegen.
- source_word: iniustitias ipsius et omnes sermones eius
  choice: wegen seiner Ungerechtigkeiten und all seiner Worte
  rationale: Bewahrt die beiden Gegenstände des Tadels. Die maskulinen Pronomen beziehen sich im Deutschen grammatisch passend auf „der Adler“.
theological_decisions:
- issue: Übergang zur Identifizierung des Löwen als Gesalbter
  choice: Der Vers endet mit einem Gedankenstrich und lässt die Identifizierung für den folgenden Vers offen.
  alternative: „Dieser ist der Gesalbte …“ bereits in Vers 31 aufnehmen.
  rationale: Nach der dokumentierten Versabgrenzung gehört der Text nur bis sicut audisti zu 12,31; Hic est unctus, quem beginnt den folgenden Vers. Der Gedankenstrich wahrt den syntaktischen Übergang, ohne Text aus 12,32 vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederaufnahme „wie du gesehen hast“ am Versanfang bleibt erhalten, weil sie aus der überlieferten Versabgrenzung stammt. Der Satz bleibt am Versende bewusst offen und führt in 12,32 weiter.
