  text: Und nun geht, jeder von euch, in sein Haus; ich werde nach diesen Tagen zu euch kommen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ite
  choice: geht
  rationale: Gibt den pluralischen Imperativ direkt und in natürlichem modernem Deutsch wieder.
- source_word: unusquisque uestrum
  choice: jeder von euch
  rationale: Bewahrt die individuelle Aufforderung innerhalb der angesprochenen Gruppe.
- source_word: in domum suam
  choice: in sein Haus
  rationale: Entspricht der distributiven lateinischen Formulierung; gemeint ist jeweils das eigene Haus.
- source_word: post dies istos
  choice: nach diesen Tagen
  rationale: Bewahrt die ungewöhnliche, zeitlich nicht näher bestimmte Formulierung des lateinischen Textes, ohne sie als »in einigen Tagen« auszudeuten.
