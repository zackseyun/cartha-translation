  source_fidelity: 'Der Entwurf gibt alle Satzglieder des lateinschen Textes zutreffend wieder: »Und nun« entspricht et nunc, »geht« dem Pluralimperativ ite, »jeder von euch« wahrt die distributive Aussage von unusquisque vestrum, und »in sein Haus« gibt in domum suam idiomatisch wieder. »Ich werde nach diesen Tagen zu euch kommen« bildet ego veniam ad vos post dies istos ohne unzulässige zeitliche Präzisierung ab.'
