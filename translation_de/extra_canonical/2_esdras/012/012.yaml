  text: oder wie ich es gedeutet habe. Siehe, es kommen Tage, und ein Reich wird sich erheben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatus sum
  choice: ich es gedeutet habe
  rationale: Gibt das lateinische Perfekt und den Sinn des erklärenden Auslegens natürlich wieder, ohne eine bestimmte Auslegungstradition vorauszusetzen.
- source_word: Ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Aufmerksamkeitsruf des lateinischen Textes.
- source_word: regnum
  choice: Reich
  rationale: Ist die übliche, kontextoffene Wiedergabe und kann sowohl Herrschaft als auch ein konkretes Königreich bezeichnen.
- source_word: exsurget
  choice: wird sich erheben
  rationale: Bewahrt das Bild des Aufstehens beziehungsweise Emporkommens stärker als das neutralere „wird entstehen“.
theological_decisions:
- issue: Art und Bedeutung des kommenden Reiches
  choice: ein Reich
  alternative: ein Königreich / eine Herrschaft
  rationale: Der knappe lateinische Satz bestimmt das Reich hier nicht näher; die Übersetzung lässt seine politische oder symbolische Bedeutung daher offen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Text. Die einleitende Kleinschreibung und das abschließende Komma spiegeln den fragmentarischen Anschluss an den vorausgehenden und folgenden Kontext wider.
