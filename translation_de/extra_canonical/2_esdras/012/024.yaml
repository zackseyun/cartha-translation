  text: the earth and those who dwell in it, with much oppression, more than all who were before them; therefore they are called the heads
translation:
  language: de
  text: die Erde und die, die auf ihr wohnen, mit großer Bedrückung, mehr als alle, die vor ihnen waren; deshalb wurden sie die Häupter genannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Häupter“ kann hier auch im Sinn von „Anführer“ oder „Herrscher“ verstanden werden.
    reason: Die Fußnote erläutert die mögliche übertragene Bedeutung von capita, ohne die Bildsprache im Haupttext aufzulösen.
lexical_decisions:
- source_word: cum labore multo
  choice: mit großer Bedrückung
  rationale: Im Herrschaftskontext bezeichnet labor die schwere Belastung, die der Erde und ihren Bewohnern auferlegt wird. Die Formulierung bewahrt zugleich die knappe, an den vorausgehenden Satz anschließende lateinische Struktur.
- source_word: capita
  choice: Häupter
  rationale: Die bildhafte Bezeichnung „Häupter“ entspricht dem lateinischen Ausdruck und sollte nicht deutend zu „Herrscher“ aufgelöst werden.
- source_word: propter hoc
  choice: deshalb
  rationale: Gibt den ausdrücklichen Folgerungszusammenhang des lateinischen Textes natürlich wieder.
theological_decisions:
- issue: Bildhafte Benennung der dargestellten Herrscher als capita
  choice: Häupter
  alternative: Anführer / Herrscher
  rationale: Die Metapher bleibt erhalten, ohne ihre apokalyptische Bedeutung konfessionell oder historisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kleingeschriebene Beginn und die syntaktische Offenheit bleiben erhalten, weil der Vers im lateinischen Ausgangstext als Fortsetzung des vorausgehenden Satzes einsetzt.
