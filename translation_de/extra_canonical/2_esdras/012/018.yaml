  source_fidelity: 'Die Übersetzung gibt den Hauptsatz der lateinischen Deutung zuverlässig wieder: „contentiones non modicae“ bleibt als Litotes erhalten, „periclitabitur ut cadat“ bezeichnet eine reale Sturzgefahr ohne behaupteten Sturz, und „non cadet“ setzt den Kontrast klar. „post tempus regni illius“ ist im Kontext sinnvoll als ein Zeitpunkt nach einer gewissen Dauer innerhalb des fortbestehenden Reiches wiedergegeben, nicht als Ende seiner Zeit.'
