source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: de
  text: 'Dies ist die Deutung: Nach einiger Zeit in jenem Königreich werden nicht geringe Auseinandersetzungen entstehen, und es wird Gefahr laufen zu fallen; doch wird es nicht fallen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post tempus regni illius
  choice: Nach einiger Zeit dieses Königreichs
  rationale: Das lateinische „post tempus“ kann idiomatisch „nach einiger Zeit“ bedeuten. Im Zusammenhang entstehen die Auseinandersetzungen während des Fortbestehens des Königreichs, das anschließend ausdrücklich nicht fällt.
- source_word: contentiones non modicae
  choice: nicht geringe Auseinandersetzungen
  rationale: Bewahrt die litotische Ausdrucksweise des Lateinischen und lässt offen, ob politische Konflikte, Machtkämpfe oder breitere Unruhen gemeint sind.
- source_word: periclitabitur ut cadat
  choice: es wird in Gefahr geraten zu fallen
  rationale: Gibt sowohl die Gefährdung als auch das drohende Fallen wieder, ohne den Fall als tatsächlich eintretend darzustellen.
- source_word: et non cadet
  choice: doch es wird nicht fallen
  rationale: „doch“ bildet den klaren Gegensatz zur unmittelbar zuvor genannten Sturzgefahr natürlich und würdig ab.
theological_decisions:
- issue: Zeitliches Verhältnis der Auseinandersetzungen zum Königreich
  choice: „Nach einiger Zeit dieses Königreichs“ bezeichnet einen Zeitpunkt im Verlauf seines Bestehens.
  alternative: „Nach der Zeit dieses Königreichs“ könnte das Ende seiner Herrschaftszeit bezeichnen.
  rationale: Die anschließende Aussage, das Königreich gerate in Gefahr zu fallen, falle aber nicht, setzt sein Fortbestehen voraus. Die idiomatische Lesart von „post tempus“ wahrt diesen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die lateinische Satzstruktur. Die Litotes „nicht geringe“ und die Spannung zwischen drohendem und ausbleibendem Fall bleiben erhalten.
