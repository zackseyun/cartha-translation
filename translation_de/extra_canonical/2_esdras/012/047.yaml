    rationale: Der bereitgestellte Ausgangstext beginnt mit „tu domus Jacob“. Die Übersetzung muss diese Anrede enthalten; die im Entwurf angeführte angenommene Versgrenze ist kein Grund, ausdrücklich gelieferten Quelltext auszulassen.
  - severity: low
    issue: Fußnote legt eine unnötig formnähere Alternative vor
    rationale: Die Fußnote ist nicht sachlich falsch, aber nach der Revision entspricht „vor dem Höchsten“ bereits der natürlichen Haupttextwiedergabe. Eine alternative Formulierung bietet keinen wesentlichen textkritischen oder semantischen Gewinn.
