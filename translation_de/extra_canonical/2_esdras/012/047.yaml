revisions:
- from: Denn die Erinnerung an euch ist dem Höchsten gegenwärtig.[a]
  to: 'Du, Haus Jakob: Denn das Gedenken an euch ist vor dem Höchsten.'
  rationale: Die vollständige Quellphrase wird übersetzt. Die Anrede „Du, Haus Jakob“ gibt „tu domus Jacob“ ohne unbelegten Zusatz wieder. „Das Gedenken an euch“ vermittelt den objektiven Bezug von „memoria uestri“, und „vor dem Höchsten“ erhält „coram altissimo“ unmittelbar und in angemessenem biblischem Deutsch. Die nicht quellenbelegten Erweiterungen der früheren englischen Fassung bleiben ausgeschlossen.
