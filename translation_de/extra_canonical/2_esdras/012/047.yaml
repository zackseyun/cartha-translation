  text: For the memory of you is before the Most High[a][b],
translation:
  language: de
  text: 'Du, Haus Jakob: Denn das Gedenken an euch ist vor dem Höchsten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memoria uestri
  choice: die Erinnerung an euch
  rationale: Der Genitiv „uestri“ bezeichnet hier die Personen, an die gedacht wird. „Erinnerung an euch“ gibt diesen objektiven Sinn im modernen Deutsch klar wieder.
- source_word: coram altissimo
  choice: dem Höchsten gegenwärtig
  rationale: Die Formulierung bewahrt den Sinn von „coram“ („vor, in der Gegenwart von“), ohne das im Deutschen unnatürliche „ist vor dem Höchsten“ wörtlich nachzubilden.
theological_decisions:
- issue: Aussage über Gottes Gedenken
  choice: Die nominale Aussage „die Erinnerung an euch“ bleibt erhalten.
  alternative: „Denn der Höchste denkt an euch.“
  rationale: Die Alternative wäre idiomatischer, würde aber „memoria“ in ein aktives Verb umformen und die bildhafte Aussage des lateinischen Textes stärker einebnen.
- issue: Zusatz über den Mächtigen und den Kampf
  choice: Nicht in den Haupttext aufgenommen.
  alternative: „Und der Mächtige hat euch im Kampf nicht vergessen.“
  rationale: Dieser Satz steht nicht im bereitgestellten lateinischen Ausgangstext und darf daher nicht als Bestandteil dieses Verses ergänzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dem Höchsten gegenwärtig“ klingt gehoben, bleibt aber verständlich und bildet die lateinische Gegenwartsformel natürlicher ab als eine starre Wort-für-Wort-Fassung. Das vorangehende „tu domus Jacob“ gehört syntaktisch offenbar zum Satz vor dem hier durch die Referenz und die geprüfte englische Fassung abgegrenzten Versabschnitt und wurde daher nicht aufgenommen.
