translation:
  language: de
  text: Das Schwert wird sie verschlingen. Denn das Schwert des einen wird den verschlingen, der bei ihm ist,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Satz ist knapp und syntaktisch schwierig; auch möglich: „Denn ein Schwert wird den verschlingen, der bei ihm ist.“'
    reason: Bewahrt die textliche Unsicherheit hinsichtlich Vnius gladius und des Bezugs von qui cum eo.
lexical_decisions:
- source_word: gladius
  choice: das Schwert
  rationale: Direkte und im Zusammenhang natürliche Wiedergabe des lateinischen Substantivs.
- source_word: comedet
  choice: wird … verschlingen
  rationale: Bewahrt das kraftvolle Bild von comedere statt es zu dem schwächeren „töten“ zu glätten.
- source_word: Vnius … gladius
  choice: das Schwert des einen
  rationale: Vnius ist formal ein Genitiv („des einen“); diese Wiedergabe folgt dem lateinischen Wortlaut enger als „ein Schwert“.
- source_word: qui cum eo
  choice: der bei ihm ist
  rationale: Gibt die relationale Formulierung wörtlich wieder und lässt die im knappen lateinischen Satz vorhandene Bezugsspannung bestehen.
theological_decisions:
- issue: Bezug der Personen und des Schwertes im zweiten Satz
  choice: „das Schwert des einen … den …, der bei ihm ist“
  alternative: „ein Schwert wird den verschlingen, der bei ihm ist“ beziehungsweise „der bei ihm ist, wird ihn mit dem Schwert verschlingen“
  rationale: Der Text beschreibt offenbar das gewaltsame Ende der betreffenden Gestalten, doch die knappe lateinische Syntax ist nicht völlig eindeutig. Die Übersetzung folgt dem Genitiv Vnius und ergänzt lediglich das im Deutschen erforderliche substantivierte Objekt „den“, ohne die Identitäten weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte Bild vom verschlingenden Schwert wird bewusst beibehalten; die schwerfällige Quellenkonstruktion wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
