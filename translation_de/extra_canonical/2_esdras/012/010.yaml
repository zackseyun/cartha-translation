  yaml_path: translation/extra_canonical/2_esdras/012/010.yaml
  text: 'And he said to me, “This is the interpretation of the vision that you saw: the eagle that you saw coming up from the sea—this is'
translation:
  language: de
  text: 'Und er sagte zu mir: „Dies ist die Deutung der Vision, die du gesehen hast: Der Adler, den du aus dem Meer aufsteigen sahst, ist'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aquilam
  choice: Der Adler
  rationale: Die Akkusativform gehört zur hervorgehobenen Satzkonstruktion; im natürlichen deutschen Folgesatz steht das Bezugswort als Subjekt im Nominativ.
- source_word: ascendentem de mari
  choice: aus dem Meer aufsteigen sahst
  rationale: Gibt das Partizip Präsens zusammen mit dem Wahrnehmungsverb idiomatisch wieder und bewahrt die Richtung aus dem Meer heraus.
- source_word: hoc est
  choice: ist
  rationale: Der lateinische Identifikationssatz bleibt am Versende bewusst unvollständig und wird im folgenden Vers fortgesetzt.
theological_decisions:
- issue: Identität des Adlers
  choice: Die Aussage endet offen mit „ist“
  alternative: Die Identität durch eine Ergänzung vorwegnehmen
  rationale: Das lateinische „hoc est“ leitet eine Deutung ein, die erst im anschließenden Text ausgeführt wird; sie darf hier nicht theologisch oder historisch vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vision“ ist allgemein verständlich und entspricht dem konsultierten Kontext; die syntaktische Offenheit am Versende wurde erhalten.
