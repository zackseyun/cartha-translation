base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: de
  text: 'Dass du drei ruhende Köpfe gesehen hast, bedeutet Folgendes: In dessen letzten Tagen wird der Höchste drei Königreiche aufkommen lassen, vieles darin[a] erneuern, und sie werden herrschen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das lateinische „in ea“ steht im Singular: „in ihr“. Es kann sich auf die durch den Adler dargestellte Macht oder auf die Erde beziehen, nicht auf die drei Königreiche; dafür wäre im Lateinischen ein Plural zu erwarten.'
    reason: Der Singularbezug des lateinischen Textes wird erläutert, ohne eine der im Kontext möglichen Bezugsgrößen festzulegen.
lexical_decisions:
- source_word: quiescentia
  choice: ruhende
  rationale: Das Partizip bezeichnet die drei Köpfe als in Ruhe befindlich; „ruhende Köpfe“ ist quellennah und im Deutschen verständlich.
- source_word: interpretatio
  choice: Deutung
  rationale: „Deutung“ gibt die Erklärung eines visionären Zeichens in natürlichem, würdigem Deutsch wieder.
- source_word: suscitabit
  choice: wird … erstehen lassen
  rationale: Die Wendung bewahrt den Gedanken, dass der Höchste die drei Königreiche aufkommen lässt, ohne unnötig eine Auferstehung anzudeuten.
- source_word: regna
  choice: Königreiche
  rationale: Direkte und kontextgemäße Wiedergabe des neutrum Plurals „regna“.
- source_word: renouabit
  choice: erneuern
  rationale: Entspricht dem Grundsinn von „renovare“ und lässt offen, worin die Erneuerung besteht.
- source_word: dominabunt
  choice: sie werden herrschen
  rationale: Gibt das intransitive Herrschen wieder; das Subjekt sind grammatisch die drei Königreiche.
theological_decisions:
- issue: Bezug der singularischen Pronomen „eius“ und „in ea“
  choice: „dessen letzten Tagen“ und „darin“
  alternative: „in ihren letzten Tagen“ und „in ihr“ oder pluralisch „in ihnen“
  rationale: Der lateinische Text verwendet Singularformen. „Dessen“ und „darin“ bewahren diesen Bezug, ohne im Deutschen wegen des abweichenden grammatischen Geschlechts von „aquila“ und „Adler“ eine unsichere Bezugsgröße festzulegen. Eine pluralische Wiedergabe mit Bezug auf die drei Königreiche wäre grammatisch nicht quellengerecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt der lateinischen Deutungsformel nahe, wird aber idiomatisch geglättet. Die visionäre und politische Bildsprache wird nicht konfessionell ausgelegt.
