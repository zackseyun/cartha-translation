  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Lateins zutreffend wieder: drei ruhende Köpfe, die Deutung, das Erwecken dreier Königreiche durch den Höchsten, das Erneuern vieler Dinge im Singularbezug und ihr Herrschen. Die Singularität von „eius“ und „in ea“ wird grundsätzlich gewahrt. Allerdings kann „dessen“ im Deutschen nicht wirklich geschlechtsneutral auf die im Kontext mögliche Erde bezogen werden; die Fußnote muss daher klarstellen, dass die Übersetzung den Bezug nicht endgültig entscheidet.'
  naturalness: „Und dass du drei ruhende Köpfe gesehen hast, hat folgende Deutung“ ist im modernen Standarddeutsch nicht idiomatisch. „Dass du … gesehen hast, bedeutet Folgendes“ ist klar, natürlich und bewahrt die Deutungsformel. „Aufkommen lassen“ ist für suscitabit idiomatischer als „erstehen lassen“.
  terminology: „der Höchste“, „Königreiche“, „erneuern“ und „herrschen“ sind angemessen. Die politische und visionäre Sprache wird weder abgeschwächt noch dogmatisch ausgelegt.
