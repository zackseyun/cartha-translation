  - severity: low
    issue: Begründung zur geschlechtsneutralen Wirkung von „dessen“
    rationale: „Dessen“ ist im Deutschen maskulin oder neutral und kann deshalb nicht ohne Weiteres auch auf „die Erde“ bezogen werden. Der knappe Haupttext kann den Singularbezug kontextuell lassen, aber die Fußnote sollte nicht behaupten, diese Form selbst sei geschlechtsneutral.
