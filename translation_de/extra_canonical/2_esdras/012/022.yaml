translation:
  language: de
  text: Zwei aber werden bis zum Ende bewahrt werden. Und weil du drei Köpfe gesehen hast,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duo uero
  choice: Doch zwei
  rationale: „uero“ markiert hier einen Gegensatz beziehungsweise eine Weiterführung; „doch“ gibt diese Funktion natürlich und knapp wieder.
- source_word: in finem
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet den zeitlichen Endpunkt; die deutsche Formulierung bleibt nah am Latein.
- source_word: seruabuntur
  choice: werden … bewahrt werden
  rationale: Das Futur Passiv von „seruare“ wird formal entsprechend wiedergegeben, ohne näher zu bestimmen, wer oder was die beiden bewahrt.
- source_word: Et quoniam
  choice: Und weil
  rationale: Bewahrt sowohl den Anschluss durch „Et“ als auch den kausalen beziehungsweise begründenden Charakter von „quoniam“.
- source_word: tria capita
  choice: drei Köpfe
  rationale: „Köpfe“ ist die direkte und im Bildzusammenhang natürliche Wiedergabe von „capita“.
theological_decisions:
- issue: Akteur des Bewahrens
  choice: Das Passiv bleibt ohne genannten Handelnden stehen.
  alternative: „Gott wird zwei bis zum Ende bewahren.“
  rationale: Der lateinische Text nennt den Handelnden nicht; eine ausdrückliche Identifizierung würde eine Auslegung in die Übersetzung eintragen.
- issue: Unvollständiger Satzanschluss
  choice: Die abschließende kausale Wendung bleibt mit Komma offen.
  alternative: Die Wendung als eigenständigen vollständigen Satz umformen.
  rationale: Der Vers endet nach „drei Köpfe“ mitten in einer Satzkonstruktion, die im Folgetext fortgeführt wird; diese syntaktische Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Übersetzung folgt dem lateinischen Wortlaut eng, wahrt aber eine natürliche deutsche Satzführung und den offenen Übergang zum Folgevers.
