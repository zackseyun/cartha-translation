id: 2ES.12.44
reference: 2 Esdras 12:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nobis mala quae contigerunt? Si ergo tu nos dereliqueris, quanto erat nobis melius, si essemus succensi et nos in incendio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: de
  text: Oder ist das Unglück, das uns getroffen hat, noch nicht genug? Wenn du uns also verlässt, wie viel besser wäre es für uns gewesen, wenn auch wir im Feuer[a] verbrannt worden wären!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Feuersbrunst.'
    reason: Das lateinische »in incendio« kann sowohl allgemein »im Feuer« als auch stärker »in der Feuersbrunst« bedeuten.
lexical_decisions:
- source_word: mala quae contigerunt
  choice: das Unglück, das uns getroffen hat
  rationale: Das lateinische Neutrum Plural »mala« bezeichnet hier zusammenfassend das erlittene Unheil; der deutsche Kollektivsingular klingt natürlich und bewahrt den Sinn.
- source_word: dereliqueris
  choice: verlässt
  rationale: Gibt das Verlassen beziehungsweise Im-Stich-Lassen ohne zusätzliche theologische Festlegung wieder.
- source_word: quanto erat nobis melius
  choice: wie viel besser wäre es für uns gewesen
  rationale: Bewahrt den rückblickenden, irrealen Vergleich des lateinischen Ausdrucks.
- source_word: succensi et nos in incendio
  choice: auch wir im Feuer verbrannt worden wären
  rationale: »succensi« wird im Zusammenhang mit »incendium« idiomatisch als Verbrennen wiedergegeben; »et nos« bedeutet hier »auch wir«.
theological_decisions:
- issue: Art des göttlichen Verlassens
  choice: verlässt
  alternative: im Stich lässt
  rationale: »Verlässt« bleibt nahe an »dereliqueris« und lässt offen, ob endgültige Preisgabe oder aus der Klage heraus empfundene Verlassenheit gemeint ist.
translation_notes:
  register: Moderne, würdige Klagesprache. Der Kollektivsingular »Unglück« vermeidet eine unnatürliche Wiedergabe als »Übel«, und die Ausrufung am Ende bringt die emotionale Intensität des Satzes zum Ausdruck.
