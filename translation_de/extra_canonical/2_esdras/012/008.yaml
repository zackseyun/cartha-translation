source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: interpretationem et distinctionem uisus horribilis huius, ut plenissime consoles animam meam. Dignum enim me habuisti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/008.yaml
  text: the interpretation and the distinction of this dreadful vision[a], so that you may fully comfort my soul. For you have counted me worthy
translation:
  language: de
  text: die Deutung und die Erklärung dieses schrecklichen Gesichts, damit du meine Seele völlig tröstest. Denn du hast mich für würdig erachtet
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretationem
  choice: die Deutung
  rationale: Gibt die Auslegung beziehungsweise Erschließung des Sinns der Vision natürlich und präzise wieder.
- source_word: distinctionem
  choice: die genaue Erklärung
  rationale: Bezeichnet hier neben der Deutung eine nähere Darlegung oder Aufschlüsselung; das wörtliche „Unterscheidung“ wäre im modernen Deutschen missverständlich.
- source_word: uisus horribilis huius
  choice: dieses schrecklichen Gesichts
  rationale: „Gesicht“ ist in biblischem Deutsch eine verständliche, würdevolle Bezeichnung für eine Vision; „schrecklich“ bewahrt die starke Wirkung von horribilis.
- source_word: plenissime
  choice: vollkommen
  rationale: Bewahrt den verstärkenden Sinn „in vollstem Maße“, ohne im Deutschen schwerfällig zu wirken.
- source_word: Dignum enim me habuisti
  choice: Denn du hast mich für würdig erachtet
  rationale: Formale und zugleich idiomatische Wiedergabe der lateinischen Konstruktion aliquem dignum habere.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Versanfang bleibt entsprechend dem lateinischen Akkusativ syntaktisch vom vorangehenden Vers abhängig; es wird kein dort bereits stehendes „und zeige deinem Diener“ wiederholt. Auch der Versschluss bleibt als Übergang zum folgenden Kontext offen.
