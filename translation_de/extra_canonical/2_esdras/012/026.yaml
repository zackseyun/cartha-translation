source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui perficient nouissima eius. Et quoniam uidisti caput maius non apparescens, quoniam unus ex eis super lectum suum morietur, et tamen cum tormentis. Nam duo qui superauerunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/026.yaml
  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: de
  text: 'und seine letzten Taten vollbringen werden.[a] Und weil du das größere Haupt verschwinden sahst,[b] bedeutet dies: Einer von ihnen wird in seinem Bett sterben, doch unter Qualen. Denn die beiden, die übrig geblieben sind,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und seine letzten Ereignisse zu Ende führen werden.'
    reason: „Nouissima eius“ kann die letzten Handlungen oder allgemeiner die letzten Ereignisse beziehungsweise die Endphase bezeichnen.
  - marker: b
    text: 'Wörtlich: nicht erscheinend; im Zusammenhang auch: nicht mehr sichtbar werdend.'
    reason: „Non apparescens“ bezeichnet zunächst das Nicht-Erscheinen beziehungsweise Nicht-Sichtbarsein. Der Zusammenhang legt nahe, dass das Haupt verschwindet.
lexical_decisions:
- source_word: perficient nouissima eius
  choice: seine letzten Taten vollbringen werden
  rationale: Gibt das futurische Verb und das substantivierte „nouissima“ als abschließende Handlungen wieder, ohne den Satz zu einem bloßen Hinweis auf das zeitliche Ende zu verkürzen.
- source_word: caput maius
  choice: das größere Haupt
  rationale: Bewahrt die Bildsprache des Adlers und den Komparativ „maius“; „Haupt“ passt zum gehobenen, apokalyptischen Register.
- source_word: non apparescens
  choice: nicht mehr zu sehen war
  rationale: Natürliches Deutsch für das nicht länger sichtbare beziehungsweise verschwindende Haupt; die Formulierung vermeidet eine unnötig technische Wiedergabe.
- source_word: super lectum suum morietur
  choice: wird in seinem Bett sterben
  rationale: Nahe Wiedergabe der lateinischen Ortsangabe; der folgende Gegensatz zeigt, dass damit kein schmerzloser Tod gemeint sein muss.
- source_word: cum tormentis
  choice: unter Qualen
  rationale: „Qualen“ gibt die starke Bedeutung von „tormenta“ idiomatisch und ohne zusätzliche Festlegung auf Folter durch andere wieder.
- source_word: superauerunt
  choice: übrig geblieben sind
  rationale: Passt zum Zusammenhang der noch verbleibenden Häupter und bewahrt gegenüber „überlebt haben“ die mögliche Bedeutung des bloßen Verbleibens.
theological_decisions:
- issue: Deutung von „nouissima eius“
  choice: letzte Taten
  alternative: das Ende beziehungsweise die letzten Ereignisse
  rationale: Die Hauptfassung folgt der handlungsbezogenen Deutung der englischen Konsultationsschicht, während die Fußnote die offenere eschatologische Reichweite des lateinischen Ausdrucks wahrt.
- issue: Art der Qualen beim Tod im Bett
  choice: nicht näher bestimmt
  alternative: Krankheitsqualen oder von außen zugefügte Folter
  rationale: Der lateinische Text nennt nur „cum tormentis“; eine genauere Ursache wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Bildwortschatz. Der Vers beginnt und endet entsprechend der vorgegebenen lateinischen Segmentierung als Satzfragment; diese Grenzen wurden nicht künstlich geglättet.
