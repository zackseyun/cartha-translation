source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: libro, quae uidisti, et pones ea in loco abscondito. Et docebis ea sapientes de populo tuo, quorum scis corda posse capere et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: de
  text: Und du sollst die Weisen aus deinem Volk darin unterweisen, deren Herzen, wie du weißt, fähig sind, sie zu erfassen und geheim zu halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: docebis ea sapientes de populo tuo
  choice: du sollst sie die Weisen aus deinem Volk lehren
  rationale: Gibt sowohl den Gegenstand „ea“ („sie“) als auch die Empfänger „sapientes de populo tuo“ eng am lateinischen Satzbau wieder und bleibt im Deutschen verständlich.
- source_word: capere
  choice: erfassen
  rationale: „Erfassen“ bewahrt die geistige Bedeutung von „capere“ und klingt in Verbindung mit „Herzen“ natürlicher und würdiger als das technischere „begreifen“.
- source_word: corda
  choice: Herzen
  rationale: Die konkrete anthropologische Bildsprache des Lateinischen bleibt erhalten; „Herz“ bezeichnet hier das innere Vermögen zu verstehen und zu bewahren.
- source_word: ea … geheim halten
  choice: sie … geheim halten
  rationale: Das Pronomen nimmt die zuvor genannten Offenbarungsinhalte wieder auf, ohne das interpretierende Substantiv „Geheimnisse“ einzuführen.
theological_decisions:
- issue: Fähigkeit der Herzen
  choice: dass ihre Herzen sie erfassen und geheim halten können
  alternative: dass sie fähig sind, sie zu verstehen und als Geheimnisse zu bewahren
  rationale: Die gewählte Fassung bewahrt die Herzensmetaphorik und vermeidet eine erklärende Erweiterung, die im vorliegenden lateinischen Wortlaut nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Verbindung „ihre Herzen … erfassen“ erhält bewusst die Bildsprache der Vorlage. Keine Fußnoten erforderlich.
