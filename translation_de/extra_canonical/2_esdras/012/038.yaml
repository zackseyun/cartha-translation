revisions:
- from: Und du sollst sie die Weisen aus deinem Volk lehren, von denen du weißt, dass ihre Herzen sie erfassen und geheim halten können.
  to: Und du sollst die Weisen aus deinem Volk darin unterweisen, deren Herzen, wie du weißt, fähig sind, sie zu erfassen und geheim zu halten.
  rationale: Die Empfängerkonstruktion wurde für modernes Standarddeutsch in „die Weisen aus deinem Volk darin unterweisen“ überführt. Das anaphorische „darin“ und das abschließende „sie“ erhalten den nicht näher spezifizierten Bezug von ea, ohne ihn zu „Geheimnissen“ auszuweiten. Die Aussage, dass die Herzen dieser Weisen zum Erfassen und geheimen Bewahren fähig sind, bleibt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:08Z'
review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt die Empfängergruppe, die Herzensmetaphorik sowie das doppelte Vermögen des Erfassens und geheimen Bewahrens grundsätzlich zutreffend wieder. Die Konstruktion „sie die Weisen ... lehren“ ist jedoch im heutigen Standarddeutsch schwer verständlich und syntaktisch missverständlich.
  naturalness: „Die Weisen aus deinem Volk darin unterweisen“ ist idiomatisches modernes Standarddeutsch und wahrt den Sinn von docebis ea sapientes. Die Relativkonstruktion wird gestrafft, ohne die Aussage über ihre Herzen zu verändern.
  terminology: „Weise“, „Herzen“, „erfassen“ und „geheim halten“ sind angemessene, registergerechte Entsprechungen. „Darin“ verweist anaphorisch auf die zuvor genannten Inhalte und führt keinen zusätzlichen theologischen Begriff ein.
  issues:
  - severity: medium
    issue: Unnatürliche und mehrdeutige Wortstellung bei „sie die Weisen ... lehren“
    rationale: Zwar kann lehren historisch mit zwei Akkusativen stehen, doch die vorliegende Abfolge ist im modernen Deutsch kaum verständlich und lässt „sie“ vorübergehend als Subjekt oder als unklaren Bezug erscheinen. Eine idiomatische Umformung ist ohne Sinnverlust möglich.
  revised_text: Und du sollst die Weisen aus deinem Volk darin unterweisen, deren Herzen, wie du weißt, fähig sind, sie zu erfassen und geheim zu halten.
