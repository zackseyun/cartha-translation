revisions:
- from: '„Und dass du gesehen hast, wie zwei kleine Flügel zu dem Kopf auf der rechten Seite hinübergingen, hat folgende Bedeutung: Sie sind diejenigen, die der Höchste bis zu ihrem Ende aufbewahrt hat. Dies war ein kleines[a] Reich voller Unruhen,“'
  to: '„Und dass du gesehen hast, wie zwei kleine Flügel zu dem Kopf auf der rechten Seite hinübergingen, hat folgende Bedeutung: Sie sind diejenigen, die der Höchste für das Ende bewahrt hat. Dies war ein kleines[a] Reich voller Unruhen,“'
  rationale: Die Änderung beschränkt sich auf die Wiedergabe von „in finem suum“. „Für das Ende“ gibt die finale bzw. auf das Ende bezogene Wendung wieder, ohne das Ende einem bestimmten pluralischen Personenkreis zuzuschreiben. Die offene Referenz bleibt damit erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von „regnum exile et turbationis plenum“ als „ein kleines Reich voller Unruhen“ ist im Rahmen der beigefügten Anmerkung vertretbar. Bei „in finem suum“ ist „bis zu ihrem Ende“ jedoch zu eng: Das lateinische Singular-Possessivum kann sich nicht unmittelbar auf die pluralischen „diejenigen“ beziehen, und die Wendung lässt den Bezug des Endes offen bzw. kann final verstanden werden.'
  naturalness: Der Satz ist insgesamt modernes, würdiges Deutsch. „zum Kopf auf der rechten Seite hinübergingen“ bildet die Bildsprache angemessen ab. „für das Ende bewahrt hat“ ist hier natürlicher und vermeidet einen im Deutschen irreführenden Personenbezug.
  terminology: „der Höchste“, „Reich“ und „Unruhen“ sind registergerecht und sachlich. Die Fußnote zu „klein“ bewahrt die Bedeutungsbreite von „exile“ sinnvoll.
  issues:
  - severity: medium
    issue: „bis zu ihrem Ende“ legt das Ende auf die beiden bewahrten Personen fest.
    rationale: Die Quelle hat ein Singular-Possessivum („suum“; in der vorliegenden Lesung offenbar fehlerhaft als „suam“ überliefert). Der Kontext und die englische Audit-Spur erlauben keinen sicheren Bezug auf die Personen. Die deutsche Fassung soll diese Unsicherheit nicht einengen.
  revised_text: '„Und dass du gesehen hast, wie zwei kleine Flügel zu dem Kopf auf der rechten Seite hinübergingen, hat folgende Bedeutung: Sie sind diejenigen, die der Höchste für das Ende bewahrt hat. Dies war ein kleines[a] Reich voller Unruhen,“'
  revised_footnotes:
  - marker: a
    text: 'Oder: geringes; möglicherweise auch: kurzlebiges.'
    reason: Das lateinische „exile“ kann geringe Größe, Bedeutung, Stärke oder Dauer ausdrücken.
  revision_rationale: Die Änderung beschränkt sich auf die Wiedergabe von „in finem suum“. „Für das Ende“ gibt die finale bzw. auf das Ende bezogene Wendung wieder, ohne das Ende einem bestimmten pluralischen Personenkreis zuzuschreiben. Die offene Referenz bleibt damit erhalten.
