base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: de
  text: '„Und dass du gesehen hast, wie zwei kleine Flügel zu dem Kopf auf der rechten Seite hinübergingen, hat folgende Bedeutung: Sie sind diejenigen, die der Höchste für das Ende bewahrt hat. Dies war ein kleines[a] Reich voller Unruhen,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: geringes; möglicherweise auch: kurzlebiges.'
    reason: Das lateinische „exile“ kann geringe Größe, Bedeutung, Stärke oder Dauer ausdrücken.
lexical_decisions:
- source_word: finem suam
  choice: bis zu ihrem Ende
  rationale: Gibt die Endgrenze der Bewahrung natürlich wieder und bezieht das Possessivpronomen auf die zuvor genannten Personen, ohne das Ende näher zu deuten.
- source_word: regnum exile
  choice: ein kleines Reich
  rationale: Lateinisch „exile“ bezeichnet hier etwas Geringes, Schwaches oder von kleinem Umfang. „Klein“ bewahrt diese Offenheit besser als die eindeutig zeitliche Wiedergabe „kurzlebig“.
- source_word: turbationis plenum
  choice: voller Unruhen
  rationale: Eine idiomatische und sachlich passende Wiedergabe für einen von Wirren und Erschütterungen geprägten Herrschaftsabschnitt.
theological_decisions:
- issue: Bezug von „ihrem Ende“
  choice: Bezug auf die bewahrten Personen
  alternative: „für sein Ende“ mit Bezug auf das Reich oder das Adlerreich
  rationale: Der unmittelbare Satzbau legt den Bezug auf „diejenigen“ nahe; eine weitergehende endzeitliche Identifikation wird nicht in den Text eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Bildsprache von Flügeln und Kopf bleibt wörtlich erhalten; der abschließende Beistrich signalisiert den im Quelltext mit „Sicut“ weiterlaufenden Satz.
