  source_fidelity: 'Der deutsche Text gibt den im englischen POB-Ausschnitt behandelten lateinischen Satz zuverlässig wieder: „verlassen“ entspricht dereliqui, „nicht von euch weggegangen“ wahrt die eigenständige räumliche Aussage von neque excessi a vobis, und die Zweckangaben entsprechen veni ... ut deprecarer ... et ut quererem. „wegen der Verwüstung Zions“ lässt die bei pro mögliche Anlass-/Fürbittennuance angemessen offen. „Erniedrigung eures Heiligtums“ ist für humilitate sanctificationis vestrae im Kontext vertretbar und vermeidet eine ungesicherte Gleichsetzung mit dem Tempel.'
