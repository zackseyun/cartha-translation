id: 2ES.12.48
reference: 2 Esdras 12:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: de
  text: Denn ich habe euch nicht verlassen und bin nicht von euch weggegangen, sondern ich bin an diesen Ort gekommen, um wegen der Verwüstung Zions zu flehen und um Erbarmen für die Erniedrigung eures Heiligtums zu erbitten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: verlassen
  rationale: Gibt das lateinische Verb unmittelbar und in natürlichem, würdigem Deutsch wieder.
- source_word: excessi a uobis
  choice: bin nicht von euch weggegangen
  rationale: Bewahrt die räumliche Grundbedeutung von excedere mit a und unterscheidet die Wendung von dem vorausgehenden „verlassen“.
- source_word: deprecarer pro desolatione Sion
  choice: wegen der Verwüstung Zions zu flehen
  rationale: „flehen“ erfasst den bittenden Charakter von deprecari; „wegen“ lässt offen, ob die Verwüstung Anlass oder Gegenstand der Bitte ist.
- source_word: quererem misericordiam
  choice: Erbarmen … zu erbitten
  rationale: Quaerere bezeichnet hier das suchende Erstreben göttlichen Erbarmens; „erbitten“ ist im Gebetszusammenhang natürlich.
- source_word: humilitate sanctificationis uestrae
  choice: Erniedrigung eures Heiligtums
  rationale: Sanctificatio kann im kirchenlateinischen Sprachgebrauch das Heiligtum bezeichnen. „Erniedrigung“ hält die bildhafte und theologisch offene Aussage von humilitas fest.
theological_decisions:
- issue: Bedeutung von sanctificatio
  choice: Heiligtum
  alternative: Heiligung
  rationale: Der Zusammenhang mit Zion und dessen Verwüstung spricht für einen heiligen Ort; zugleich wird keine weitergehende Identifizierung, etwa ausdrücklich mit dem Tempel, eingeführt.
- issue: Bezug von misericordiam
  choice: „Erbarmen für die Erniedrigung eures Heiligtums“
  alternative: „Erbarmen wegen der Erniedrigung eures Heiligtums“
  rationale: Die Formulierung folgt der Konstruktion des Ausgangstextes und wahrt deren leichte semantische Spannung, ohne das Erbarmen ausdrücklich auf das Volk oder auf den Ort festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die lateinische Syntax, jedoch ohne unnötig altertümliche Wendungen. Der Versumfang folgt dem bereitgestellten englischen POB-Ausschnitt.
