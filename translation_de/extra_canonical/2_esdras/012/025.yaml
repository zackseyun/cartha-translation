  text: of the eagle. For these are the ones who will bring its impieties to a head[a], and
translation:
  language: de
  text: des Adlers. Denn diese sind es, die seine Gottlosigkeiten auf den Höhepunkt bringen werden[a], und
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Gottlosigkeiten zusammenfassen.'
    reason: Bewahrt die genuine Bedeutungsbreite von recapitulabunt und dessen möglichen Anklang an die Häupter des Adlers.
lexical_decisions:
- source_word: aquilae
  choice: des Adlers
  rationale: Der Genitiv setzt den Satz aus dem vorigen Vers unmittelbar fort.
- source_word: recapitulabunt
  choice: auf den Höhepunkt bringen werden
  rationale: Das Verb bezeichnet hier nicht bloß ein sprachliches Zusammenfassen, sondern das Zusammenführen beziehungsweise Vollenden der Gottlosigkeiten bis zu ihrem Höhepunkt; zugleich klingt das Motiv der zuvor genannten Häupter an.
- source_word: impietates
  choice: Gottlosigkeiten
  rationale: Der Plural und der religiös-moralische Gehalt des lateinischen Ausdrucks bleiben erhalten.
- source_word: et
  choice: und
  rationale: Die abschließende Konjunktion wird beibehalten, da der Satz im folgenden Vers weitergeht.
theological_decisions:
- issue: Bedeutung von recapitulabunt im apokalyptischen Zusammenhang
  choice: seine Gottlosigkeiten auf den Höhepunkt bringen
  alternative: seine Gottlosigkeiten zusammenfassen
  rationale: Die Hauptfassung gibt die Zuspitzung und Vollendung des Bösen wieder, ohne eine bestimmte konfessionelle Deutung einzutragen; die wörtlichere Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anfang und das abschließende „und“ bleiben erhalten, weil der Vers syntaktisch an die Nachbarverse anschließt.
