  text: Doch du allein warst würdig, dieses Geheimnis des Höchsten zu kennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tu autem solus
  choice: Doch du allein
  rationale: Gibt den Gegensatz durch „autem“ und die Ausschließlichkeit von „solus“ knapp und natürlich wieder.
- source_word: dignus fuisti
  choice: warst würdig
  rationale: Entspricht unmittelbar dem lateinischen Perfekt; ein zusätzliches „für würdig befunden“ wäre im Ausgangstext nicht ausdrücklich enthalten.
- source_word: scire
  choice: zu kennen
  rationale: Bewahrt die Grundbedeutung „wissen/kennen“ und verbindet sich im Deutschen natürlich mit „Geheimnis“.
- source_word: altissimi secretum hoc
  choice: dieses Geheimnis des Höchsten
  rationale: Erhält die demonstrative Bestimmung „hoc“ und gibt „Altissimus“ mit der etablierten Gottesbezeichnung „der Höchste“ wieder.
theological_decisions:
- issue: Art der Würdigkeit
  choice: „warst würdig“ ohne Ergänzung
  alternative: „wurdest für würdig befunden“
  rationale: Der lateinische Text sagt lediglich „dignus fuisti“ und nennt weder eine prüfende Instanz noch einen Vorgang des Für-würdig-Befindens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die exklusive Aussage „du allein“ bleiben erhalten.
