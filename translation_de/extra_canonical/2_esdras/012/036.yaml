  source_fidelity: „Doch du allein warst würdig, dieses Geheimnis des Höchsten zu kennen.“ gibt *tu autem solus*, *dignus fuisti*, *scire* und *altissimi secretum hoc* vollständig und ohne sachliche Ergänzung wieder. Insbesondere wird der im Latein nicht vorhandene Aspekt eines ‚Für-würdig-Befundenwerdens‘ nicht eingeführt.
