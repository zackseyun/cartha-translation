  text: 'uidisti subalares octo coherentes alis eius, Haec est interpretatio : exsurgent enim in ipso octo reges, quorum erunt tempora'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: de
  text: 'Und weil du acht kleine Flügel gesehen hast, die an seinen Flügeln hafteten, lautet die Deutung: In ihm werden nämlich acht Könige aufstehen, deren Zeiten …'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subalares octo
  choice: acht kleine Flügel
  rationale: Das lateinische »subalares« bezeichnet kleinere beziehungsweise untergeordnete Flügel; »kleine Flügel« ist im Deutschen anschaulich und entspricht dem Kontext.
- source_word: coherentes alis eius
  choice: die an seinen Flügeln hingen
  rationale: »cohaerere« bedeutet festhängen oder verbunden sein; »hingen« gibt die räumliche Beziehung natürlich wieder, ohne sie näher auszudeuten.
- source_word: exsurgent enim in ipso
  choice: In ihm werden nämlich … aufstehen
  rationale: Die Formulierung bewahrt sowohl das begründende »enim« als auch den Bezug des mehrdeutigen »ipso« auf das zuvor gedeutete Wesen beziehungsweise Reich.
- source_word: octo reges
  choice: acht Könige
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: quorum erunt tempora
  choice: deren Zeiten …
  rationale: Der lateinische Ausgangstext bricht syntaktisch nach »tempora« ab; die Übersetzung erhält diesen unvollständigen Anschluss.
theological_decisions:
- issue: Bezug von »in ipso«
  choice: in ihm
  alternative: in seinem Reich
  rationale: Das Latein nennt das Reich hier nicht ausdrücklich. Die pronominale Wiedergabe bewahrt die genuine Offenheit des Bildes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers endet entsprechend dem überlieferten Ausschnitt unvollständig mit Auslassungspunkten.
