  yaml_path: translation/extra_canonical/2_esdras/012/006.yaml
  text: Therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: de
  text: Darum werde ich den Höchsten bitten, dass er mich bis zum Ende stärkt.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  choice: zum Höchsten
  rationale: Der substantivierte Superlativ ist eine Gottesbezeichnung und wird im Deutschen natürlich und würdig mit „der Höchste“ wiedergegeben.
- source_word: me confortet
  choice: er mich … stärkt
  rationale: „Stärken“ gibt confortare im Kontext eines Gebets um Beistand klar und idiomatisch wieder.
- source_word: usque in finem
  choice: bis zum Ende
  rationale: Die zeitliche beziehungsweise zielbezogene Offenheit des lateinischen Ausdrucks bleibt erhalten; es wird nicht näher bestimmt, welches Ende gemeint ist.
theological_decisions:
- issue: Bezug von „bis zum Ende“
  choice: Die unbestimmte Formulierung bleibt stehen.
  alternative: „bis ans Ende meines Lebens“ oder „bis alles vollendet ist“
  rationale: Der lateinische Text legt nicht fest, ob das Lebensende, das Ende einer Prüfung oder eine endzeitliche Vollendung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darum“ wahrt den folgernden Zusammenhang ohne ein im lateinischen Ausschnitt nicht belegtes zusätzliches Zeitadverb. Das schließende Anführungszeichen folgt der vorgelegten Versabgrenzung; der lateinische Text setzt anschließend mit „Et dixi“ fort.
