  text: they marry, as though widowed; therefore those who labor labor without cause
translation:
  language: de
  text: Sie heiraten, als wären sie verwitwet. Deshalb mühen sich die, die arbeiten, ohne Grund ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubunt
  choice: sie heiraten
  rationale: Gibt das lateinische Präsens schlicht und idiomatisch wieder.
- source_word: sic quasi uidui
  choice: als wären sie verwitwet
  rationale: Bewahrt den irrealen Vergleich und gibt uidui geschlechtsübergreifend entsprechend dem Kontext wieder.
- source_word: laborant
  choice: sich ... abmühen / arbeiten
  rationale: Die variierte deutsche Wiedergabe vermeidet eine schwerfällige Wortwiederholung, lässt aber Tätigkeit und vergebliche Anstrengung erkennen.
- source_word: sine causa
  choice: ohne Grund
  rationale: Entspricht dem lateinischen Ausdruck enger als „vergeblich“ und bewahrt seine mögliche Bedeutungsoffenheit zwischen Grundlosigkeit und Zwecklosigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, warnende Satzfolge des lateinischen Textes bleibt erhalten; die semantische Spannung von sine causa wird nicht durch eine ausschließlich ergebnisbezogene Formulierung aufgelöst.
