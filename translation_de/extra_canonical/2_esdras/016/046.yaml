  source_fidelity: Die Übersetzung gibt die beiden lateinischen Satzteile vollständig wieder. „Sie heiraten“ entspricht nubunt; „als wären sie verwitwet“ bewahrt den Vergleich sic quasi uidui. „Deshalb mühen sich die, die arbeiten, ohne Grund ab“ bildet die auffällige Wiederaufnahme von laborant im englischen Audit-Trail sinnvoll ab und gibt sine causa offen als „ohne Grund“ wieder.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Wiederholung „die, die arbeiten“ ist leicht markiert, aber angesichts der knappen und rhetorisch zugespitzten Vorlage vertretbar; „sich ... abmühen“ macht die resultative Anstrengung idiomatisch.
  terminology: „verwittert“ ist nicht verwendet; „verwitwet“ ist die korrekte, geschlechtsübergreifend mögliche Wiedergabe. „ohne Grund“ vermeidet eine einengende Deutung von sine causa ausschließlich als „vergeblich“.
