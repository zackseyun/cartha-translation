  text: A sword has been sent upon you, and who is there to turn it back?
translation:
  language: de
  text: Ein Schwert ist gegen euch gesandt worden; wer kann es abwenden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est uobis gladius
  choice: Ein Schwert ist über euch gekommen
  rationale: Die lateinische Wendung bezeichnet, dass den Angesprochenen ein Schwert beziehungsweise kriegerisches Unheil bevorsteht oder sie erreicht hat. Die deutsche Formulierung gibt dies natürlich und eindringlich wieder.
- source_word: quis est qui auertat illum?
  choice: wer kann es abwenden?
  rationale: Das rhetorische lateinische „Wer ist es, der es abwendet?“ wird in gegenwärtigem Deutsch knapp wiedergegeben; „es“ bezieht sich auf das Schwert.
- source_word: Inmissus est
  choice: über euch gekommen
  rationale: Das am überlieferten Ausschnitt anschließende „Inmissus est“ („es ist losgeschickt/gesandt worden“) bestätigt den Gedanken eines verhängten beziehungsweise hereinbrechenden Schwertes. Da die Versabgrenzung beziehungsweise Satzfolge der bereinigten Vorlage offenbar gestört ist, wird der Sinn ohne eine redundante Wiederholung integriert.
theological_decisions:
- issue: Urheber des hereinbrechenden Schwertes
  choice: Der Handelnde bleibt ungenannt.
  alternative: „Gott hat ein Schwert über euch gesandt.“
  rationale: Der lateinische Text verwendet eine unpersönliche beziehungsweise passive Form und nennt Gott an dieser Stelle nicht ausdrücklich; die Übersetzung ergänzt daher keinen theologischen Akteur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischer Zuspitzung. Die Bildsprache des Schwertes bleibt erhalten; der Gedankenstrich bildet die enge Verbindung von Ankündigung und rhetorischer Frage ab.
