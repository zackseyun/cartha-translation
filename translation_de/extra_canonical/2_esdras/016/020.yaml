  source_fidelity: 'Die dreigliedrige Reihe entspricht dem vorgelegten Latein: „fames“, „plaga“ und „tribulatio“. Der im Quellenausschnitt nicht mit abgedruckte Prädikat- und Zweckteil wird sachgerecht aus der englischen Auditfassung übernommen. „Plage“ ist für lateinisch „plaga“ genauer als „Seuche“, da es die Bedeutung nicht auf eine epidemische Krankheit einengt.'
