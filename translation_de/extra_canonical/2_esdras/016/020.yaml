  terminology: „Plage“ wahrt die lexikalische und sachliche Weite von „plaga“. „Geißeln“ bewahrt das Bild der strafend-korrigierenden Heimsuchung, ohne es dogmatisch zu verengen. „Zurechtweisung“ gibt „correction“ neutral und treffend wieder.
