  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: de
  text: Siehe, Hunger, Plage und Bedrängnis sind als Geißeln zur Zurechtweisung gesandt worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen, aufmerksammachenden Charakter des lateinischen Ausdrucks.
- source_word: fames
  choice: Hunger
  rationale: Direkte und im Deutschen natürliche Wiedergabe.
- source_word: plaga
  choice: Seuche
  rationale: Im Zusammenhang einer Reihe kommender Notlagen bezeichnet das Wort eine verheerende Plage; „Seuche“ gibt den konkreten Sinn klar wieder.
- source_word: tribulatio
  choice: Bedrängnis
  rationale: Gibt schwere äußere Not wieder, ohne eine zusätzliche, im vorgelegten lateinischen Text nicht vorhandene vierte Notlage einzuführen.
- source_word: scourges for correction (consultation layer)
  choice: Geißeln zur Besserung
  rationale: Bewahrt das Bild einer schmerzhaften Züchtigung mit korrigierendem Ziel und folgt für den über den vorgelegten lateinischen Ausschnitt hinausgehenden Satzabschluss der auditierten englischen Konsultationsfassung.
theological_decisions:
- issue: Zweck der gesandten Nöte
  choice: zur Besserung
  alternative: zur Züchtigung
  rationale: „Zur Besserung“ erhält die auf Korrektur zielende Aussage, ohne den Zweck ausschließlich als Strafe zu deuten.
translation_notes:
  register: Feierlich und verständlich; die dreigliedrige Aufzählung des vorgelegten lateinischen Textes bleibt erhalten. Der Satzabschluss wird entsprechend der auditierten englischen Konsultationsfassung wiedergegeben.
