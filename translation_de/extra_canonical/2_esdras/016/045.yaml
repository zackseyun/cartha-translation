revisions:
- from: Die heiraten, als würden sie keine Kinder bekommen; und die nicht heiraten, wie Verwitwete.
  to: Diejenigen, die heiraten, als würden sie keine Kinder bekommen; und diejenigen, die nicht heiraten, wie Witwer.
  rationale: Die Revision ersetzt die im Deutschen nicht tragfähige Form „Die heiraten“ durch idiomatische Relativgruppen und gibt „vidui“ mit „Witwer“ quellentreu wieder. Die vom vorausgehenden Imperativ abhängige Ellipse sowie der parallele, litaneiartige Satzbau bleiben erhalten.
  reviewer_model: gpt-5.6-terra
