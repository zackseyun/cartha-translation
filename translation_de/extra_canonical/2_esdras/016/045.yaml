review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die elliptische, vom Imperativ des vorherigen Verses abhängige Mahnreihe grundsätzlich. „Verwitwete“ verwischt jedoch das im lateinischen „vidui“ vorliegende Maskulinum („Witwer“).
  naturalness: „Die heiraten“ ist im modernen Standarddeutsch ohne Relativpronomen nicht idiomatisch. „Diejenigen, die heiraten“ bewahrt die Reihung und ist klar verständlich; die bewusst elliptische Fortsetzung bleibt bestehen.
  terminology: „keine Kinder bekommen“ ist eine natürliche Wiedergabe von „filios non facturi“, ohne die Aussage unnötig biologisch oder theologisch einzuengen. „Witwer“ gibt „vidui“ präzise wieder.
  issues:
  - severity: medium
    issue: Unidiomatische Nominalgruppe „Die heiraten“
    rationale: Das Deutsche benötigt hier regulär eine Form wie „Diejenigen, die heiraten“ (oder „Wer heiratet“). Die vorliegende Form wirkt wie eine fehlerhafte Auslassung, nicht wie die beabsichtigte kontextuelle Ellipse.
  - severity: low
    issue: „Verwitwete“ ist gegenüber „vidui“ zu weit
    rationale: „Vidui“ ist maskuliner Plural und bezeichnet Witwer. Eine geschlechtsneutrale Form ist hier keine notwendige Vermeidung von Festlegung, sondern reduziert die lexikalische Genauigkeit.
  revised_text: Diejenigen, die heiraten, als würden sie keine Kinder bekommen; und diejenigen, die nicht heiraten, wie Witwer.
