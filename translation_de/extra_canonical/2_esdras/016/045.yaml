source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui nubunt, sic quasi filios non facturi; et qui non nubunt, sic quasi vidui.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/045.yaml
  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
translation:
  language: de
  text: Diejenigen, die heiraten, als würden sie keine Kinder bekommen; und diejenigen, die nicht heiraten, wie Witwer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui nubunt
  choice: Die heiraten
  rationale: Gibt den substantivisch gebrauchten Relativsatz knapp wieder und bewahrt die elliptische Reihung des Kontexts.
- source_word: sic quasi
  choice: als würden sie
  rationale: Gibt im ersten Satzglied die irreale Vergleichsbedeutung natürlich und präzise wieder; „sic“ stützt die modale Lesart.
- source_word: filios non facturi
  choice: keine Kinder bekommen
  rationale: Die futurische Umschreibung bezeichnet hier das Hervorbringen beziehungsweise Bekommen von Nachkommen; „Kinder“ ist im Deutschen idiomatischer und kann beide Geschlechter einschließen.
- source_word: qui non nubunt
  choice: die nicht heiraten
  rationale: Bewahrt den Parallelismus und vermeidet eine unnötige Festlegung auf einen dauerhaften Familienstand.
- source_word: vidui
  choice: Verwitwete
  rationale: Gibt den nominativischen Plural wieder, ohne das grammatische Maskulinum im Deutschen unnötig auf Männer zu beschränken.
theological_decisions:
- issue: Elliptische Abhängigkeit vom vorausgehenden Imperativ
  choice: Die Satzellipse wird ohne ergänztes „sollen sein“ bewahrt.
  alternative: Die heiraten, sollen so sein, als würden sie keine Kinder bekommen …
  rationale: Der lateinische Satz setzt die in Vers 42 begonnene Aufforderungsreihe fort. Die knappe deutsche Form erhält den litaneiartigen Rhythmus, ohne die implizite Aufforderung dogmatisch auszudeuten.
- issue: Bedeutung des Vergleichs bei den Heiratenden
  choice: „als würden sie keine Kinder bekommen“
  alternative: „wie Menschen, die keine Kinder bekommen werden“
  rationale: Die irreale beziehungsweise distanzierende Kraft von „quasi“ bleibt erhalten; zugleich wird nicht entschieden, ob Kinderlosigkeit biologisch, gesellschaftlich oder aufgrund der bevorstehenden Not gemeint ist.
translation_notes:
  register: Knappes, würdiges Standarddeutsch mit bewusst erhaltener Ellipse und Parallelstruktur. Die etwas abrupte Form entspricht der fortlaufenden Mahnreihe des lateinischen Kontexts.
