  yaml_path: translation/extra_canonical/2_esdras/016/043.yaml
  text: and the one who buys, like one who is about to lose; and the one who trades, like one who will gain no profit;
translation:
  language: de
  text: und wer kauft, wie einer, der im Begriff ist, es zu verlieren; wer Handel treibt, wie einer, der …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier zugrunde gelegte lateinische Text bricht nach „wie einer, der“ ab; die englische Konsultationsfassung ergänzt sinngemäß: „keinen Gewinn erzielen wird“.'
    reason: Kennzeichnet die tatsächliche Textgrenze und verhindert, dass eine nicht im vorgelegten lateinischen Ausgangstext belegte Ergänzung stillschweigend in den Haupttext gelangt.
lexical_decisions:
- source_word: emit
  choice: kauft
  rationale: Gibt den gewöhnlichen Sinn des lateinischen Verbs emere direkt und natürlich wieder.
- source_word: quasi
  choice: wie einer, der
  rationale: Bewahrt den vergleichenden, zugespitzten Satzbau des lateinischen Textes.
- source_word: perditurus
  choice: im Begriff ist, es zu verlieren
  rationale: Gibt das Futurpartizip wieder, das eine bevorstehende beziehungsweise zu erwartende Handlung ausdrückt; „es“ nimmt sinngemäß das Gekaufte auf.
- source_word: mercatur
  choice: Handel treibt
  rationale: Unterscheidet das allgemeinere Handeltreiben vom vorhergehenden konkreten Kaufen.
theological_decisions:
- issue: Unvollständiger zweiter Vergleichssatz
  choice: Den Abbruch des überlieferten Ausgangstextes sichtbar lassen
  alternative: 'Nach der englischen Konsultationsfassung ergänzen: „wie einer, der keinen Gewinn erzielen wird“'
  rationale: Der vorgelegte lateinische Wortlaut endet mit „quasi qui“ und enthält keine Entsprechung für „keinen Gewinn erzielen wird“. Die Ergänzung würde daher über die angegebene originalsprachliche Evidenz hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau der beiden Aussagen bleibt erhalten; die Auslassung markiert transparent den unvollständigen lateinischen Ausgangstext.
