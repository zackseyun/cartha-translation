  source_fidelity: 'Der Entwurf gibt die erhaltene lateinische Form präzise wieder: „Übel“ bewahrt den abrupten substantivischen Plural mala; „wer wird sie abwehren?“ entspricht quis repellet ea; und „Feuer wird aus seinem Zorn hervorgehen“ bildet exiet ignis ex iracundia eius ohne Bedeutungsverschiebung ab. Die Schlussfrage nimmt das im vorgelegten englischen Audit bezeugte „quench it“ zutreffend als „löschen“ auf.'
