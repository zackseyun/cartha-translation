base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/009.yaml
  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: de
  text: Übel – und wer wird sie abwehren? Feuer wird aus seinem Zorn hervorgehen, und wer wird es löschen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: Übel
  rationale: Der substantivierte Plural bewahrt Zahl und Breite des lateinischen Ausdrucks; „Plagen“ wäre kontextuell enger, „Unheil“ dagegen singularisch-kollektiv.
- source_word: repellet
  choice: wird … abwehren
  rationale: Gibt das Futur und die Bedeutung des Zurücktreibens beziehungsweise Abwendens natürlich wieder.
- source_word: exiet
  choice: wird … hervorgehen
  rationale: Bewahrt die Vorstellung, dass das Feuer aus dem Zorn hervorkommt, ohne die im Deutschen mögliche Fehlassoziation von „das Feuer geht aus“ im Sinn von Erlöschen hervorzurufen.
- source_word: iracundia eius
  choice: seinem Zorn
  rationale: Eine direkte, im Deutschen natürliche Wiedergabe; das männliche Possessivpronomen lässt den im Kontext gemeinten göttlichen Bezug bestehen.
theological_decisions:
- issue: Verhältnis von Feuer und göttlichem Zorn
  choice: „Feuer wird aus seinem Zorn hervorgehen“
  alternative: „Feuer seines Zorns wird hervorbrechen“
  rationale: Die gewählte Form wahrt die lateinische Herkunftsbeziehung mit ex und setzt Feuer und Zorn nicht ohne Not gleich.
- issue: Rhetorischer Charakter der Schlussfrage
  choice: „wer wird es löschen?“
  alternative: „wer kann es löschen?“
  rationale: „Wird“ bleibt näher an der futurischen Gestalt der parallelen Frage und fügt keine ausdrücklich modale Aussage über Fähigkeit ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den im überlieferten Versanfang abrupt stehenden Plural „Übel“ lesbar, ohne ein im lateinischen Ausschnitt nicht vorhandenes Verb zu ergänzen.
