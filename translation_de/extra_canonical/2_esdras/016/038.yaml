source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: de
  text: 'Seht, die Übel rücken näher und lassen nicht auf sich warten. Wie bei einer Frau, die im neunten Monat mit ihrem Sohn schwanger ist: Wenn die Stunde ihrer Entbindung naht, wird sie zwei oder drei Stunden zuvor von schmerzhaften Wehen um ihren Leib erfasst; und wenn das Kind aus dem Mutterleib hervortritt, wird sie nicht länger zögern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Lateinische hat wörtlich: „wird sie nicht zögern“. Grammatisch bezieht sich dies auf die schwangere Frau; gemeint ist, dass die Geburt nach dem Hervortreten des Kindes ohne weiteren Aufschub erfolgt.'
    reason: Die knappe Schlusskonstruktion ist im Deutschen ohne Erläuterung missverständlich. Die Anmerkung erklärt den grammatischen Bezug, ohne den bildhaften Sinn unnötig festzulegen.
lexical_decisions:
- source_word: mala
  choice: die Übel
  rationale: Der substantivierte Plural bezeichnet bevorstehende schlimme Ereignisse oder Nöte; „Übel“ bewahrt diese Breite besser als eine einzelne Konkretisierung.
- source_word: adpropinquant ... et non tardantur
  choice: rücken näher und lassen nicht auf sich warten
  rationale: Die idiomatische deutsche Wendung erhält sowohl das Herannahen als auch die Aussage, dass kein Aufschub eintritt.
- source_word: gementes dolores circum uentrem eius
  choice: schmerzhafte Wehen im ganzen Unterleib
  rationale: Im Geburtskontext bezeichnet dolores natürlich Wehen. „Im ganzen Unterleib“ gibt circum ventrem verständlich wieder; gementes wird sinngemäß durch die Schmerzhaftigkeit ausgedrückt, ohne unnatürlich von „stöhnenden Schmerzen“ zu sprechen.
- source_word: prodiente infante de uentre
  choice: wenn das Kind aus dem Mutterleib hervortritt
  rationale: Die Formulierung folgt dem Geburtsbild eng und gibt venter hier kontextgerecht als „Mutterleib“ wieder.
