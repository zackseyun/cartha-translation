  - severity: medium
    issue: „im ganzen Unterleib“ überdehnt circum ventrem
    rationale: circum bedeutet räumlich „um … herum“; der Zusatz „im ganzen“ und die Einengung auf den Unterleib werden vom lateinischen Text nicht verlangt.
