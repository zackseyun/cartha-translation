  register: Modernes, würdiges Standarddeutsch. Das einleitende „Seht“ bewahrt den prophetischen Mahnruf. Das Geburtsbild bleibt konkret, während unidiomatische lateinische Konstruktionen in natürliches Deutsch überführt werden.
