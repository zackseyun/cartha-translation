  to: 'Seht, die Übel rücken näher und lassen nicht auf sich warten. Wie bei einer Frau, die im neunten Monat mit ihrem Sohn schwanger ist: Wenn die Stunde ihrer Entbindung naht, wird sie zwei oder drei Stunden zuvor von schmerzhaften Wehen um ihren Leib erfasst; und wenn das Kind aus dem Mutterleib hervortritt, wird sie nicht länger zögern.[a]'
