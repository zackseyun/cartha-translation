lexical_decisions:
- source_word: Ignis
  choice: Feuer
  rationale: Direkte und natürliche Wiedergabe des lateinischen Substantivs.
- source_word: succenditur
  choice: wird entzündet
  rationale: Bewahrt das Passiv und den präsentischen Aspekt des lateinischen Verbs.
- source_word: non extinguetur
  choice: wird nicht erlöschen
  rationale: Gibt das Futur und die Aussage eines nicht verlöschenden Feuers idiomatisch wieder; im Deutschen kann Feuer sowohl „gelöscht werden“ als auch „erlöschen“, wobei die gewählte Formulierung natürlich klingt, ohne einen ausdrücklich genannten Handelnden einzuführen.
