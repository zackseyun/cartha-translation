  source_fidelity: Das lateinische „Ignis succenditur et non extinguetur“ verbindet ein passivisches Präsens („wird entzündet/angezündet“) mit einem passivischen Futur („wird nicht gelöscht werden“). Die vorliegende Fassung gibt die Grundbedeutung wieder, macht den zweiten Teilsatz mit „erlöschen“ jedoch intransitiv und lässt damit das Passiv des Ausgangstexts entfallen.
