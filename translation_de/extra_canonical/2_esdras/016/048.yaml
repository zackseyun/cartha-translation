  text: Et qui negociantur negociantur in rapina, quamdiu exornant
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/048.yaml
  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: de
  text: Und die Handel treiben, treiben Handel für Beute[a], solange sie schmücken[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Handel treiben, treiben Handel für Beute.“'
    reason: Bewahrt als Alternative die Wiederholung des lateinischen Verbs und die Mehrdeutigkeit von „in rapina“.
  - marker: b
    text: 'Das lateinische Verb bedeutet „schmücken“ oder „ausschmücken“; wen oder was sie schmücken, bleibt unausgesprochen. Möglich ist auch: „solange sie sich schmücken“.'
    reason: Das englische Konsultationsstück ergänzt ein reflexives Objekt, das im lateinischen Wortlaut nicht ausdrücklich steht.
lexical_decisions:
- source_word: negociantur
  choice: Handel treiben / tun es
  rationale: Gibt das wiederholte lateinische Verb idiomatisch wieder, ohne die Wiederholung im Deutschen schwerfällig auszuschreiben.
- source_word: in rapina
  choice: für Beute
  rationale: 'Bewahrt die knappe und mehrdeutige Formulierung des Lateinischen: Gemeint sein kann Handel im Blick auf Beute beziehungsweise Handel, dessen Ertrag zur Beute wird; eine ausdrücklich räuberische Absicht wird nicht ergänzt.'
- source_word: quamdiu
  choice: solange
  rationale: Direkte zeitliche Entsprechung, die den syntaktischen Anschluss des lateinischen Satzes offenhält.
- source_word: exornant
  choice: sie schmücken
  rationale: Das lateinische Verb steht aktiv im Plural, doch sein Objekt ist nicht genannt. Die Übersetzung ergänzt daher weder ausdrücklich „sich“ noch einen anderen Gegenstand.
theological_decisions:
- issue: Deutung von „in rapina“ im Gerichtskontext
  choice: Die Mehrdeutigkeit mit „für Beute“ bewahren
  alternative: „nur um ausgeplündert zu werden“ oder „um zu plündern“
  rationale: Beide Alternativen legen eine Richtung des Plünderns fest, die der knappe lateinische Ausdruck nicht ausdrücklich bestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas schroffe Schlusswendung ist bewusst beibehalten, weil auch der überlieferte lateinische Text kein Objekt zu „exornant“ nennt. Das Semikolon entspricht dem fragmentarischen Fortgang des vorgelegten Verses.
