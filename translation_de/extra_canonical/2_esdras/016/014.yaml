  yaml_path: translation/extra_canonical/2_esdras/016/014.yaml
  text: to the ends of the earth. Behold, evils are sent out, and they will not return until
translation:
  language: de
  text: bis an die Enden der Erde. Siehe, Unheil wird ausgesandt und wird nicht zurückkehren, bis …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier zugrunde gelegte lateinische Text bricht mit „bis“ ab; der Satz wird im folgenden Vers fortgesetzt.
    reason: Kennzeichnet transparent die syntaktische Unvollständigkeit des überlieferten beziehungsweise versgeteilten Ausgangstextes und verhindert eine unbelegte Ergänzung.
lexical_decisions:
- source_word: in fines terrae
  choice: bis an die Enden der Erde
  rationale: Gibt die räumliche Ausdehnung der lateinischen Wendung natürlich und würdevoll wieder; der Satzanfang setzt den vorhergehenden Vers fort.
- source_word: Ecce
  choice: Siehe
  rationale: Bewahrt den markanten prophetischen Aufmerksamkeitsruf des Ausgangstextes.
- source_word: mala
  choice: Unheil
  rationale: Das substantivierte lateinische Neutrum im Plural bezeichnet hier drohende Übel beziehungsweise Katastrophen; der deutsche Sammelbegriff „Unheil“ klingt natürlich und vermeidet eine unnötige moralische Verengung.
- source_word: mittuntur
  choice: wird ausgesandt
  rationale: Das Passiv bleibt erhalten, ohne einen im Text nicht genannten Handelnden einzuführen.
- source_word: non reuertentur
  choice: wird nicht zurückkehren
  rationale: Die grammatische Mehrzahl wird im Deutschen passend zum kollektiven Singular „Unheil“ als Singular wiedergegeben.
- source_word: donec
  choice: bis …
  rationale: Bewahrt die im überlieferten Versausschnitt offene, erst im Folgenden zu ergänzende Konstruktion.
theological_decisions:
- issue: Nicht genannter Urheber des ausgesandten Unheils
  choice: Passivform ohne ausdrückliches Subjekt beibehalten
  alternative: „Gott sendet Unheil aus“
  rationale: Der lateinische Text nennt den Handelnden nicht; eine ausdrückliche Zuschreibung an Gott würde eine theologische Präzisierung importieren.
- issue: Bedeutung von „mala“
  choice: „Unheil“
  alternative: „das Böse“ oder „Übel“
  rationale: Im Kontext angekündigter Heimsuchungen ist konkretes Unheil wahrscheinlich, doch die Übersetzung lässt offen, welche einzelnen Plagen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ wahrt den prophetisch-biblischen Ton; „Unheil“ ist allgemein verständlich. Die Auslassungspunkte machen den offenen Anschluss nach „bis“ sichtbar.
