translation:
  language: de
  text: Ein starker Bogenschütze hat einen Pfeil abgeschossen; wer wird ihn zurückholen? Gott, der Herr, sendet Unheil; wer wird es abwenden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: Ein starker Bogenschütze hat einen Pfeil abgeschossen
  rationale: Gibt das lateinische Passiv in natürlichem modernem Deutsch aktiv wieder, ohne die Bildaussage zu verändern.
- source_word: revocabit
  choice: kann ihn zurückholen
  rationale: Im Bild eines bereits abgeschossenen Pfeils bezeichnet das Verb dessen Rückholung beziehungsweise Umkehr; „zurückholen“ bewahrt das Bild und klingt idiomatisch.
- source_word: mala
  choice: Unheil
  rationale: Das lateinische Wort kann Übel, Leiden oder Katastrophen bezeichnen. „Unheil“ passt zum Gerichtskontext, ohne Gott moralisch Böses zuzuschreiben oder die konkrete Art des Unheils festzulegen.
- source_word: avertet
  choice: abwenden
  rationale: Entspricht dem Gedanken, gesandtes Unheil wegzuwenden oder fernzuhalten, und erhält die Parallelität zur ersten rhetorischen Frage.
theological_decisions:
- issue: Gott als Urheber des gesandten mala
  choice: Der Herr, Gott, sendet Unheil
  alternative: Der Herr, Gott, sendet Böses
  rationale: Die Aussage über Gottes unmittelbares Senden wird nicht abgeschwächt. Zugleich wahrt „Unheil“ die lexikalische Mehrdeutigkeit von mala und vermeidet eine unnötige Festlegung auf moralisches Böses.
translation_notes:
  register: Dignige, gut verständliche Gegenwartssprache. Die beiden rhetorischen Fragen und ihre parallele Struktur bleiben erhalten; Gedankenstriche markieren den nachdrücklichen Übergang von Aussage zu Frage.
