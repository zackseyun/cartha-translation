source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: de
  text: Seht, Gott ist Richter; fürchtet ihn! Lasst ab von euren Sünden, lasst eure Verfehlungen hinter euch und begeht sie nie wieder[a]. Und Gott wird euch herausführen und aus jeder Bedrängnis befreien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Vergesst, eure Verfehlungen fortan für immer zu begehen.« Die lateinische Konstruktion ist ungewöhnlich; gemeint ist die dauerhafte Abkehr von ihnen.'
    reason: Bewahrt die auffällige Konstruktion mit obliuiscimini und dem ergänzenden Infinitiv, während der Haupttext idiomatisches Deutsch bietet.
lexical_decisions:
- source_word: Ecce
  choice: Seht
  rationale: Die geläufige, würdevolle deutsche Aufforderung erhält die aufmerksamkeitslenkende Funktion des lateinischen Ausdrucks.
- source_word: iudex deus
  choice: Gott ist Richter
  rationale: Gibt die knappe lateinische Nominalkonstruktion natürlich und ohne zusätzliche theologische Festlegung wieder.
- source_word: desinite a peccatis uestris
  choice: Lasst ab von euren Sünden
  rationale: Bewahrt den Aufforderungscharakter und entspricht dem lateinischen desinere a in idiomatischem Deutsch.
- source_word: obliuiscimini iniquitates uestras iam agere eas sempiterno
  choice: lasst eure Verfehlungen hinter euch und begeht sie nie wieder
  rationale: Die schwerfällige lateinische Verbindung von ‚vergessen‘, ‚tun‘ und dauerhafter Beendigung wird verständlich wiedergegeben, wobei sowohl Abkehr als auch endgültige Unterlassung erhalten bleiben.
- source_word: educabit uos
  choice: wird euch herausführen
  rationale: Gibt educere in seiner räumlich-befreienden Bedeutung wieder und passt zur anschließenden Rettung aus Bedrängnis.
- source_word: de omni tribulatione
  choice: aus jeder Bedrängnis
  rationale: ‚Bedrängnis‘ deckt den weiten Sinn von tribulatio besser ab als ein engeres Wort wie ‚Notlage‘.
theological_decisions:
- issue: Verhältnis zwischen Umkehr und Gottes Befreiung
  choice: Dann wird Gott euch herausführen
  alternative: und Gott wird euch herausführen
  rationale: Das lateinische et verbindet die Verheißung mit den vorausgehenden Aufforderungen; ‚Dann‘ macht diesen gedanklichen Fortgang im Deutschen verständlich, ohne eine ausgearbeitete Verdienstlehre einzutragen.
- issue: Dauer der Abkehr von den Verfehlungen
  choice: begeht sie nie wieder
  alternative: begeht sie in Ewigkeit nicht mehr
  rationale: Die Wendung bewahrt die uneingeschränkte zeitliche Tragweite von sempiterno in natürlichem modernem Deutsch.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, mahnendem Ton. Die parallelen Imperative und die knappe Verheißung bleiben erhalten; unnötig konfessionelle Fachsprache wurde vermieden.
