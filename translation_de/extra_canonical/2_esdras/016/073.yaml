  text: Denn sie werden ihren Besitz und ihre Häuser verwüsten und plündern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deuastabunt
  choice: verwüsten
  rationale: Gibt die gewaltsame Zerstörung bzw. Verheerung des lateinischen Verbs unmittelbar wieder.
- source_word: diripient
  choice: plündern
  rationale: Entspricht dem gewaltsamen Rauben und Wegnehmen, das das lateinische Verb bezeichnet.
- source_word: substantias eorum
  choice: ihren Besitz
  rationale: Substantia steht hier im Plural für Vermögen bzw. Habe; der deutsche Kollektivbegriff »Besitz« ist natürlich und umfasst die materiellen Güter.
- source_word: domos
  choice: Häuser
  rationale: Direkte Wiedergabe des Akkusativs Plural; die ungewöhnliche lateinische Fügung »de domos« wird nicht durch eine unbelegte Handlung wie Vertreibung ergänzt.
