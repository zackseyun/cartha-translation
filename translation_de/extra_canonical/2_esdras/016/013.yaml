revisions:
- from: Denn mächtig ist seine rechte Hand, die den Bogen spannt. Seine Pfeile, die er abschießt, sind scharf[a]; wenn sie erst abgeschossen werden, verfehlen sie ihr Ziel nicht.
  to: Denn mächtig ist seine rechte Hand, die den Bogen spannt; seine scharfen Pfeile, die von ihm abgeschossen werden[a], versagen nicht, sobald sie abgeschossen werden.
  rationale: Die Revision vermeidet die nicht ausdrücklich im Lateinischen genannte Zielvorstellung und gibt non deficient weiter als „versagen nicht“ wieder. Zugleich bleibt die im Bogenschützenkontext natürliche Übersetzung von mittere mit „abschießen“ erhalten. Die Fußnote dokumentiert die allgemeinere Lesemöglichkeit von mittuntur sowie die semantische Weite von non deficient; der Anker steht bei dem Ausdruck, auf den die erste Alternative unmittelbar Bezug nimmt.
