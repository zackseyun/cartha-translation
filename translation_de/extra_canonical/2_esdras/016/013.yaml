  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: de
  text: Denn mächtig ist seine rechte Hand, die den Bogen spannt; seine scharfen Pfeile, die von ihm abgeschossen werden[a], versagen nicht, sobald sie abgeschossen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von ihm ausgesandt werden“; ebenso kann „versagen nicht“ allgemeiner verstanden werden.'
    reason: Bewahrt die allgemeinere Bedeutung von mittuntur und non deficient, ohne die im Haupttext naheliegende Bogenschützenmetaphorik aufzugeben.
lexical_decisions:
- source_word: fortis
  choice: mächtig
  rationale: Gibt die Stärke und Wirksamkeit der rechten Hand in würdigem, natürlichem Deutsch wieder.
- source_word: quae arcum tendit
  choice: die den Bogen spannt
  rationale: Entspricht der konkreten lateinischen Wendung und bewahrt das Bild des Bogenschützen.
- source_word: mittuntur / mitti
  choice: abschießt / abgeschossen werden
  rationale: Im unmittelbaren Zusammenhang mit Bogen und Pfeilen bezeichnet mittere idiomatisch das Abschießen, nicht bloß ein allgemeines Senden.
- source_word: non deficient
  choice: verfehlen sie ihr Ziel nicht
  rationale: Deficere kann allgemein ‚versagen‘ oder ‚nicht ausreichen‘ bedeuten; im Bild eines abgeschossenen Pfeils vermittelt die zielbezogene Formulierung die konkrete Wirkung natürlich.
- source_word: cum coeperint mitti
  choice: wenn sie erst abgeschossen werden
  rationale: Bewahrt den Beginn-Aspekt von coeperint, ohne die schwerfällige wörtliche Form ‚wenn sie begonnen haben, abgeschossen zu werden‘.
theological_decisions:
- issue: Bezug des Possessivpronomens eius
  choice: seine rechte Hand / seine Pfeile
  alternative: die rechte Hand Gottes / Gottes Pfeile
  rationale: Der lateinische Text nennt den Bezugsgegenstand in diesem Vers nicht ausdrücklich; die Pronomen bleiben daher erhalten, statt die Referenz aus dem Kontext einzusetzen.
- issue: Bedeutung von non deficient
  choice: verfehlen sie ihr Ziel nicht
  alternative: versagen sie nicht / bleiben sie nicht aus
  rationale: Die konkrete Deutung folgt dem Bogenschützenbild, während die Fußnote die allgemeinere lateinische Aussage sichtbar hält und keine weitergehende theologische Präzisierung einführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze machen das lange lateinische Satzgefüge gut verständlich; das martialische Bild und die proniminale Offenheit des Ausgangstextes bleiben erhalten.
