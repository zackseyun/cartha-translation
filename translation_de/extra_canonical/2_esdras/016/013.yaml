  verdict: revise
  source_fidelity: Die Wiedergabe von fortis, arcum tendit und dem Bild des Abschießens ist grundsätzlich zutreffend. „Verfehlen sie ihr Ziel nicht“ legt non deficient jedoch stärker auf einen erfolgreichen Treffer fest, als das lateinische deficere verlangt; „versagen nicht“ bewahrt die weitere Aussage. Die Wiederholung von mittuntur/mitti soll erkennbar bleiben.
  naturalness: Der Entwurf ist gut verständlich. Die Formulierung „wenn sie erst abgeschossen werden“ ist jedoch stilistisch weniger klar als „sobald sie abgeschossen werden“. Die Satzstruktur mit dem Semikolon entspricht dem eng verbundenen lateinischen Gefüge gut.
  terminology: „Mächtig“, „rechte Hand“, „Bogen spannen“ und „Pfeile“ sind angemessen und registergerecht. „Scharfe Pfeile“ gibt acutae idiomatisch wieder. Die Fußnote wird an „abgeschossen“ verankert und als echte, knappe Alternative formuliert.
  issues:
