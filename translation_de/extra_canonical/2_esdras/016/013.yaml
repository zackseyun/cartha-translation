    issue: non deficient ist zu eng als „verfehlen sie ihr Ziel nicht“ übersetzt.
    rationale: Im Kontext der Pfeile ist ein Fehlschuss naheliegend, doch das lateinische Verb bedeutet allgemeiner „versagen“, „nachlassen“ oder „fehlschlagen“. Die Ergänzung „ihr Ziel“ steht nicht im Text und schränkt die Aussage ein.
  - severity: low
    issue: Die vorhandene Fußnote ist als „Wörtlicher“ nicht zuverlässig formuliert.
    rationale: Sie verändert die Wortstellung und bietet zugleich eine Auslegungsalternative; außerdem gehört die Alternative zu mittuntur/non deficient, nicht nur zu „scharf“. Eine als „Oder“ gekennzeichnete Fußnote am betreffenden Ausdruck ist präziser.
  revised_text: Denn mächtig ist seine rechte Hand, die den Bogen spannt; seine scharfen Pfeile, die von ihm abgeschossen werden[a], versagen nicht, sobald sie abgeschossen werden.
