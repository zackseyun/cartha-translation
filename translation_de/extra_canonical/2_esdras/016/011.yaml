  text: Er wird donnern – wer wird nicht erzittern? Der Herr wird drohen – und wer
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tonabit
  choice: Er wird donnern
  rationale: Das lateinische Futur von „tonare“ bezeichnet unmittelbar das Donnern; die personale Form bleibt wie in der Quelle ohne ausdrücklich genanntes Subjekt.
- source_word: horrebit
  choice: wird da nicht erschauern
  rationale: „horrescere/ horrere“ kann körperliches Schaudern und angstvolles Erschrecken bezeichnen. „Erschauern“ gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: Dominus
  choice: Der Herr
  rationale: Die übliche und kontextgerechte Wiedergabe des lateinischen Gottesnamens beziehungsweise Hoheitstitels.
- source_word: comminabitur
  choice: wird drohen
  rationale: Das Verb bedeutet eine Drohung aussprechen oder androhen; „drohen“ wahrt die knappe Parallelstruktur.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von „tonabit“
  choice: Das Pronomen „Er“ wird verwendet, ohne den Bezug näher zu bestimmen.
  alternative: „Der Herr wird donnern“
  rationale: Das lateinische Verb enthält ein männliches Subjekt, nennt „Dominus“ aber erst im zweiten Satzglied. Die Übersetzung vermeidet es daher, die mögliche Identifikation ausdrücklich vorwegzunehmen.
- issue: Abgebrochener Schluss
  choice: Der Wortlaut endet bewusst mit „und wer“.
  alternative: Den Satz aus späterem Kontext oder einer anderen Überlieferung ergänzen.
  rationale: Die bereitgestellte lateinische Quelle bricht nach „et quis“ ab. Diese textliche Unvollständigkeit wird bewahrt und nicht durch unbelegten Inhalt aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rhetorischer Parallelität. Der Gedankenstrich markiert die beiden eindringlichen Fragen, ohne den unvollständigen Quellenwortlaut zu ergänzen.
