  verdict: approve
  source_fidelity: 'Die Übersetzung gibt den lateinischen Wortlaut vollständig wieder: „scrutinabit“ als gründliches Prüfen, „omnia opera eorum“ als alle ihre Taten, „traducet vos omnes“ als Bloßstellung aller Angeredeten. Der unvollständige Anschluss „Et vos“ bleibt mit „Und ihr“ bewusst erhalten. Das nicht ausgedrückte Subjekt wird angemessen aus dem Kontext mit „Er“ aufgenommen, ohne „der Herr“ zusätzlich in den deutschen Wortlaut einzutragen.'
  naturalness: „Er wird alle ihre Taten genau prüfen und euch alle bloßstellen“ ist modernes, verständliches und dem gerichtlichen Kontext angemessenes Standarddeutsch. Die Schlussphrase ist absichtlich syntaktisch offen und bildet den fragmentarischen Satzanschluss der Vorlage nach.
  terminology: „Taten“ ist für „opera“ hier natürlich und ausreichend umfassend. „bloßstellen“ trifft den öffentlichen, beschämenden Aspekt von „traducere“, ohne eine engere technische oder konfessionelle Deutung aufzuzwingen.
