  text: Therefore the Lord will search out all their works and will expose you all. And you
translation:
  language: de
  text: Er wird alle ihre Taten genau prüfen und euch alle bloßstellen. Und ihr
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinabit
  choice: wird … genau prüfen
  rationale: Das lateinische Verb bezeichnet ein gründliches Untersuchen oder Erforschen; „genau prüfen“ gibt dies natürlich und ohne zusätzliche Verstärkung wieder.
- source_word: omnia opera eorum
  choice: alle ihre Taten
  rationale: „Opera“ meint hier die vollbrachten Handlungen; „Taten“ ist im Deutschen idiomatischer als „Werke“ und wahrt den umfassenden Sinn.
- source_word: traducet uos omnes
  choice: wird euch alle bloßstellen
  rationale: „Traducere“ kann in diesem Kontext öffentlich vorführen, entlarven oder der Schande preisgeben bedeuten; „bloßstellen“ bewahrt den gerichtlichen und öffentlichen Beiklang.
- source_word: Et uos
  choice: Und ihr
  rationale: Der unvollständige Anschluss wird entsprechend der fragmentarischen Versgrenze bewahrt und nicht aus dem folgenden Kontext ergänzt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt
  choice: Pronomen „Er“
  alternative: „der Herr“
  rationale: Im vorliegenden lateinischen Text steht bei „scrutinabit“ kein ausdrückliches Subjekt. Anders als die englische Konsultationsfassung fügt die Übersetzung „der Herr“ daher nicht in den Haupttext ein; „Er“ nimmt das Subjekt aus dem vorausgehenden Kontext auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abrupte Schlusswendung „Und ihr“ bleibt erhalten, weil der gelieferte Quelltext an dieser Stelle in den nächsten Vers beziehungsweise Satz überleitet.
