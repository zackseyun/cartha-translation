  source_fidelity: 'Der deutsche Text gibt alle Elemente des maßgeblichen lateinischen Textes wieder: ecce („Siehe“), annonae vilitas („Getreide ... billig“), in brevi („bald“), die als bloße menschliche Einschätzung markierte pax directa („sie glauben werden, der Friede sei ... gesichert“) sowie superflorescent mala und die abschließenden Plagen gladius et famis. Insbesondere wird keine „große Verwirrung“ in den Haupttext aufgenommen.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen prophetisch-feierlichem Register. „Üppig hervorsprießen“ ist bewusst bildhaft und gibt die Intensivierung in superflorescent nachvollziehbar wieder, ohne den Sinn zu verändern.
  terminology: „Getreide“, „Friede“, „Schwert“ und „Hungersnot“ sind treffend und registergerecht. Die Formulierung „der Friede sei für sie gesichert“ wahrt, dass es sich um die Erwartung bzw. Annahme der Betroffenen handelt, nicht um eine bestätigende Erzähleraussage.
