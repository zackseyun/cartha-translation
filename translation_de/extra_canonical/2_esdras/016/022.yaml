id: 2ES.16.22
reference: 2 Esdras 16:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce erit annonae vilitas in brevi super terram, ut putent sibi esse directam pacem. tunc superflorescent mala super terram, gladius et famis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: de
  text: 'Siehe[a], bald wird das Getreide auf der Erde billig sein, sodass sie glauben werden, der Friede sei für sie gesichert[b]. Dann werden die Übel auf der Erde üppig hervorsprießen: Schwert und Hungersnot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Überlieferung dieses Kapitels enthält im Bereich der Verse 22–35 einen doppelt überlieferten Textblock. Die vorliegende Übersetzung gibt die vollständigere Abfolge einmal wieder, statt dieselben Gerichtsankündigungen zweimal zu wiederholen.
    reason: compositional_layer
  - marker: b
    text: 'Oder nach einer früheren Wiedergabe: »Auf der Erde wird Getreide billig sein, sodass sie meinen, der Friede sei für sie hergestellt; dann werden auf der Erde die Übel hervorsprießen: Schwert, Hungersnot und große Verwirrung.«'
    reason: previous_rendering
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Aufmerksamkeitsruf des lateinischen Textes in einer bibelsprachlich vertrauten, aber verständlichen Form.
- source_word: annonae vilitas
  choice: das Getreide … billig
  rationale: Gibt die konkrete Bedeutung eines niedrigen Getreidepreises natürlich wieder; das abstrakte »Billigkeit des Getreides« wäre im Deutschen schwerfällig.
- source_word: in brevi
  choice: bald
  rationale: Gibt den ausdrücklich genannten zeitlichen Hinweis knapp und idiomatisch wieder.
- source_word: directam pacem
  choice: der Friede sei für sie gesichert
  rationale: Vermittelt natürlich, dass die Menschen ihre Friedenslage als hergestellt beziehungsweise abgesichert ansehen, ohne zu behaupten, dieser Friede sei tatsächlich dauerhaft.
- source_word: superflorescent
  choice: üppig hervorsprießen
  rationale: Bewahrt das ungewöhnlich starke Wachstumsbild des Verbs und vermeidet die Abschwächung zu einem bloßen »auftreten«.
- source_word: gladius et famis
  choice: Schwert und Hungersnot
  rationale: »Schwert« bleibt als Bild für Krieg und Gewalt stehen; »Hungersnot« bezeichnet die gemeinte Notlage deutlicher als das allgemeinere »Hunger«.
theological_decisions:
- issue: Der Friede wird nur aus der Sicht der Menschen beschrieben.
  choice: sodass sie glauben werden, der Friede sei für sie gesichert
  alternative: sodass für sie Frieden gesichert sein wird
  rationale: Die gewählte Fassung erhält die Spannung zwischen der menschlichen Einschätzung und den unmittelbar danach aufbrechenden Übeln; sie macht den vermeintlichen Frieden nicht zur Aussage des Erzählers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von superflorescent bleibt bewusst erhalten. Der Satzbau ist klar und mündlich verständlich, während »Siehe«, »Schwert« und »Hungersnot« den prophetischen Ton wahren.
