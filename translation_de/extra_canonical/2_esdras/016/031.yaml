  text: or as in a harvested vineyard an exposed cluster remains from those who carefully search the vintage,[a]
translation:
  language: de
  text: oder wie in einem abgeernteten Weinberg eine offen daliegende Traube denen entgeht, die die Traubenernte sorgfältig absuchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… wie in einem abgeernteten Weinberg eine offen daliegende Traube bei denen zurückbleibt, die die Traubenernte sorgfältig absuchen.“'
    reason: Bewahrt die nähere, bildhafte Wiedergabe von subremanet und die mögliche Funktion von ab scrutantibus, ohne die idiomatische Hauptfassung zu ersetzen.
lexical_decisions:
- source_word: vinea vindemiata
  choice: abgeernteter Weinberg
  rationale: 'Gibt das Substantiv mit dem Partizip direkt und natürlich wieder: ein Weinberg, dessen Lese bereits erfolgt ist.'
- source_word: subremanet
  choice: entgeht
  rationale: Im Zusammenhang bezeichnet das Verb eine Traube, die beim gründlichen Absuchen übrig bleibt und den Suchenden somit entgeht; die Formulierung vermeidet ein unnatürliches deutsches „bleibt von ihnen übrig“.
- source_word: racemus patens
  choice: eine offen sichtbare Traube
  rationale: Bewahrt den Singular von racemus und gibt patens als offen daliegend bzw. sichtbar wieder.
- source_word: scrutantibus vindemiam diligenter
  choice: denen, die die Weinlese sorgfältig absuchen
  rationale: Unterscheidet vindemia (Weinlese/Ernte) von vinea (Weinberg) und erhält sowohl das gründliche Suchen als auch den Bezug zu den Suchenden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild bleibt konkret; der scheinbare Gegensatz zwischen der offen sichtbaren Traube und ihrem Übersehenwerden wird nicht geglättet.
