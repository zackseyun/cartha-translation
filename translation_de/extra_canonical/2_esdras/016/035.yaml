  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/035.yaml
  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: de
  text: Ohne ihre Hilfe[a] werden ihre Bräutigame im Krieg umkommen, und ihre Männer werden durch Hunger zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Text setzt hier als Satzfragment ein: wörtlich etwa „ihre Hilfe nicht habend“. Auf wen sich „ihre“ bezieht, ergibt sich aus dem vorausgehenden Zusammenhang.'
    reason: Die Fußnote macht den fragmentarischen Satzanschluss und den innerhalb dieses Verses nicht bestimmten Bezug von „earum“ transparent.
lexical_decisions:
- source_word: earum non habentes adiutorium
  choice: Ohne Hilfe von ihnen
  rationale: Gibt die Genitivform „earum“ als Herkunft bzw. Bezug der Hilfe wieder und bewahrt den fragmentarischen Anschluss des lateinischen Satzes, ohne einen im Text nicht ausdrücklich genannten Bezug einzusetzen.
- source_word: in bello consumentur
  choice: werden im Krieg umkommen
  rationale: „Umkommen“ überträgt das passive „consumentur“ natürlich und würdig, ohne das lateinische Bild des Aufgezehrtwerdens übermäßig wörtlich wiederzugeben.
- source_word: in fame exterentur
  choice: werden durch Hunger zugrunde gehen
  rationale: Bewahrt die vernichtende Bedeutung von „exterentur“ und gibt „in fame“ im Deutschen idiomatisch als Ursache wieder.
theological_decisions:
- issue: Bezug von „earum“ und Subjekt des Partizips „habentes“
  choice: Der Pronomenbezug bleibt mit „von ihnen“ offen und wird nicht näher bestimmt.
  alternative: „Da sie keine Hilfe haben“ oder „ohne ihre Hilfe“
  rationale: Der überlieferte Vers beginnt syntaktisch als Anschlussfragment. Das maskuline Pluralpartizip „habentes“ weist zwar auf die anschließend genannten Bräutigame bzw. Männer, doch der konkrete Bezug von „earum“ ergibt sich nur aus dem weiteren Kontext. Die Übersetzung soll diese Unbestimmtheit nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „ihre Bräutigame … ihre Männer“ bleibt erhalten; „umkommen“ und „zugrunde gehen“ unterscheiden die beiden lateinischen Verben, ohne unnatürlich wörtlich zu klingen.
