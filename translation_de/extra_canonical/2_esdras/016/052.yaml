    issue: Doppelpunkt und Großschreibung nach „siehe“
    rationale: Die Interpunktion ist möglich, lässt den kurzen Anschluss jedoch unnötig wie eine neu angesetzte Erklärung wirken. Ein Komma und Kleinschreibung bilden die fortlaufende Satzfügung natürlicher und quellennäher ab.
