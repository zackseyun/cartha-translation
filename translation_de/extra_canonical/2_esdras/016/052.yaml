    issue: „dann“ statt koordinierendem „und“ nach der Zeitangabe
    rationale: Das Latein verbindet „adhuc pusillum“ und „tolletur“ mit et. „Dann“ ist verständlich, verstärkt aber die zeitlich-folgernde Gliederung gegenüber der Vorlage.
