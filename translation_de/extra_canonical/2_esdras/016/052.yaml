  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/052.yaml
  text: For behold[a], yet a little while, and iniquity will be taken away from the earth, and
translation:
  language: de
  text: Denn siehe, noch eine kurze Zeit, und die Ungerechtigkeit wird von der Erde weggenommen werden, und
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam
  choice: Denn
  rationale: Gibt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang natürlich und präzise wieder.
- source_word: ecce
  choice: siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden Ausruf des lateinischen Textes in würdigem, allgemein verständlichem Deutsch.
- source_word: adhuc pusillum
  choice: nur noch kurze Zeit
  rationale: Gibt die zeitliche Bedeutung der Wendung idiomatisch wieder; ein substantivisches Bezugswort steht im Lateinischen nicht ausdrücklich dabei.
- source_word: tolletur
  choice: wird … weggenommen
  rationale: Bewahrt Futur und Passiv des lateinischen Verbs.
- source_word: iniquitas
  choice: Ungerechtigkeit
  rationale: Deckt den moralischen Sinn von iniquitas ab, ohne ihn enger als Bosheit oder Gesetzlosigkeit festzulegen.
- source_word: a terra
  choice: von der Erde
  rationale: Entspricht der räumlichen Entfernungskonstruktion und lässt den umfassenden Bezug von terra erkennen.
- source_word: et
  choice: und
  rationale: Das abschließende Bindewort bleibt stehen, da der überlieferte Versausschnitt syntaktisch in den folgenden Text weiterführt.
theological_decisions:
- issue: Reichweite von iniquitas
  choice: Ungerechtigkeit
  alternative: Bosheit; Gesetzlosigkeit; Unrecht
  rationale: „Ungerechtigkeit“ wahrt den breiten moralisch-theologischen Gehalt des Ausdrucks, ohne eine bestimmte dogmatische Deutung einzutragen.
- issue: Bezug von terra
  choice: Erde
  alternative: Land
  rationale: Der unmittelbare Wortlaut begrenzt terra nicht auf ein bestimmtes Land; „Erde“ bewahrt daher die mögliche universale Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt und „dann“ machen die knappe lateinische Satzfügung verständlich, während das abschließende „und“ bewusst erhalten bleibt, weil der Satz im nächsten Vers weiterläuft.
