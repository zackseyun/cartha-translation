  verdict: revise
  source_fidelity: Der Entwurf gibt die wesentlichen Wörter zutreffend wieder. Doch „dann“ ersetzt die koordinierende lateinische Satzverknüpfung „et“ nach „adhuc pusillum“ durch eine stärker folgernde deutsche Konstruktion. Die knappe, elliptische Zeitangabe sollte zudem ohne die nicht erforderliche Satzumstellung wiedergegeben werden.
  naturalness: „Denn siehe, noch eine kurze Zeit, und …“ ist als bewusst unvollständiger, in den folgenden Vers übergehender prophetischer Satz im modernen würdigen Deutsch verständlich. Es bewahrt den Duktus besser als der Doppelpunkt mit nachfolgend großgeschriebenem Satzanfang.
  terminology: „Ungerechtigkeit“ ist für iniquitas angemessen und hinreichend weit. „Erde“ gibt terra ohne unzulässige Einschränkung wieder. Keine Fußnote ist für diesen lateinischen Textabschnitt erforderlich; die englische Fußnote bezieht sich auf die frühere, versehentlich versetzte Fassung und darf nicht übernommen werden.
  issues:
