  source_fidelity: Die Übersetzung gibt „sic estote“ als direkte Aufforderung treffend wieder. „wie Fremde im Land“ entspricht „quasi aduenae terrae“ idiomatisch und ohne den vorläufigen bzw. nichtheimischen Status zu überdeuten. „wer verkauft, sei wie einer, der fliehen wird“ bewahrt die elliptische, mahnende Vergleichsstruktur sowie das Futur von „fugiet“; es fügt keinen Fluchtgrund hinzu.
  naturalness: Modernes, klares Standarddeutsch mit angemessen würdig-knapper Mahnrede. Die Wiederaufnahme von „sei“ ist im Deutschen für die zweite Vergleichskonstruktion natürlich und macht die implizite Prädikation verständlich.
  terminology: „Fremde“ ist hier eine geeignete moderne Wiedergabe von „aduenae“ und vermeidet unnötig altertümliches „Fremdlinge“. „fliehen wird“ gibt das lateinische Futur präzise wieder. Es bestehen keine theologischen oder namensbezogenen Fragen.
