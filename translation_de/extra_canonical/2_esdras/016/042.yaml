  text: So seid wie Fremde im Land; wer verkauft, sei wie einer, der fliehen wird;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic estote
  choice: So seid
  rationale: Gibt den auffordernden Imperativ und den an den Kontext anknüpfenden Sinn von „sic“ knapp wieder.
- source_word: quasi aduenae terrae
  choice: wie Fremde im Land
  rationale: „advenae“ bezeichnet Menschen, die sich ohne bleibendes Heimatrecht an einem Ort aufhalten; „Fremde“ ist verständlich und bewahrt diesen vorläufigen Status. Der Genitiv „terrae“ wird idiomatisch als Ortsangabe wiedergegeben.
- source_word: Qui uendit
  choice: wer verkauft
  rationale: Die substantivierte Relativkonstruktion wird im Deutschen natürlich mit „wer“ ausgedrückt.
- source_word: quasi qui fugiet
  choice: wie einer, der fliehen wird
  rationale: Bewahrt sowohl den Vergleich als auch das Futur „fugiet“, ohne den Grund oder Zeitpunkt der Flucht näher festzulegen.
