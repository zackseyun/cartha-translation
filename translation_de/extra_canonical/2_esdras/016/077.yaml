  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: de
  text: Denn Gott führt euch. Ihr aber, die ihr meine Gebote und Vorschriften haltet – spricht der Herr, Gott –, mögen sie euch nicht niederdrücken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In der hier zugrunde gelegten lateinischen Textfassung ist das Subjekt von „mögen sie euch nicht niederdrücken“ nicht genannt; der Satz endet an dieser Stelle. Die englische Konsultationsfassung ergänzt „eure Sünden“ als Subjekt und fügt hinzu: „Noch sollen eure Ungerechtigkeiten euch überwältigen.“'
    reason: Kennzeichnet die grammatische Unbestimmtheit beziehungsweise mögliche Textlücke der vorgelegten lateinischen Fassung und grenzt die nicht im lateinischen Wortlaut belegte englische Ergänzung transparent ab.
lexical_decisions:
- source_word: dux
  choice: Führer
  rationale: Gibt die Grundbedeutung „Anführer, Leiter, Wegführer“ wieder; „Führer“ ist hier durch den unmittelbaren religiösen Kontext eindeutig bestimmt.
- source_word: mandata et praecepta
  choice: Gebote und Vorschriften
  rationale: Bewahrt die zwei koordinierten lateinischen Begriffe, ohne sie künstlich zu synonymisieren.
- source_word: praeponderent
  choice: niederdrücken
  rationale: Das Verb bezeichnet wörtlich ein Überwiegen oder schweres Lasten; „niederdrücken“ vermittelt das Gewichtsbild natürlich auf Deutsch.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von „praeponderent“
  choice: Das Pronomen „Sie“ bleibt ohne nachträglich eingesetztes Bezugswort stehen und wird durch eine Fußnote erläutert.
  alternative: „Eure Sünden sollen euch nicht niederdrücken, und eure Ungerechtigkeiten sollen euch nicht überwältigen.“
  rationale: Der vorgelegte lateinische Wortlaut nennt weder „Sünden“ noch „Ungerechtigkeiten“ und enthält auch die zweite Aussage nicht. Diese aus der englischen Konsultationsfassung einzusetzen, würde über die angegebene Originalsprachengrundlage hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas auffällige Unbestimmtheit von „Sie“ ist bewusst beibehalten, weil die bereitgestellte lateinische Quelle das Subjekt nicht nennt; die Fußnote macht den Befund verständlich.
