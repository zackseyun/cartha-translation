  rationale: Die Überarbeitung glättet die deutsche Satzführung und die Gottesredeformel, ohne den lückenhaften lateinischen Befund zu verdecken. Sie vermeidet sowohl eine unbelegte Ergänzung des Subjekts als auch den im modernen Deutsch problematischen isolierten Titel „Führer“.
