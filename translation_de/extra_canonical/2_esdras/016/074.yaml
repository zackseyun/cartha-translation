  source_fidelity: 'Der Haupttext gibt den lateinischen Satz vollständig und sachgerecht wieder: „probatio“ ist treffend als „Prüfung“ übersetzt und bleibt mit „geprüft wird“ für „probatur“ verbunden. „parebit“ wird idiomatisch und genau mit „wird offenbar werden“ wiedergegeben. Der Goldvergleich und „meiner Erwählten“ entsprechen dem lateinischen Wortlaut.'
