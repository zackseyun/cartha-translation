id: 2ES.16.74
reference: 2 Esdras 16:74
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: suas eos eicient. Tunc parebit probatio electorum meorum, ut aurum quod probatur ab igne.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/074.yaml
  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: de
  text: Dann wird die Prüfung meiner Erwählten offenbar werden[a], wie Gold, das im Feuer geprüft wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wird die Bewährung meiner Erwählten offenbar werden, wie Gold, das im Feuer geprüft wird.“ Das lateinische probatio kann sowohl den Vorgang der Prüfung als auch die dabei erwiesene Echtheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: Prüfung
  rationale: Das lateinische Substantiv bezeichnet zunächst den Vorgang des Prüfens oder Erprobens und nimmt zugleich das unmittelbar folgende probatur auf. Die mögliche Ergebnisbedeutung wird in der Fußnote bewahrt.
- source_word: electorum meorum
  choice: meiner Erwählten
  rationale: Die Formulierung gibt den Genitiv und den theologischen Begriff ohne konfessionelle Ausdeutung unmittelbar wieder.
- source_word: parebit
  choice: wird … offenbar werden
  rationale: Parebit bezeichnet das Sichtbar- oder Offenbarwerden; die Wiedergabe ist im Deutschen natürlich und wahrt, dass die Prüfung beziehungsweise ihr Ergebnis hervortreten wird.
- source_word: ut aurum quod probatur ab igne
  choice: wie Gold, das im Feuer geprüft wird
  rationale: Die Vergleichsstruktur und die lexikalische Verbindung zwischen probatio und probatur bleiben erhalten. Das lateinische ab igne wird idiomatisch als „im Feuer“ wiedergegeben.
theological_decisions:
- issue: Bezeichnet probatio den Prüfungsvorgang oder die dadurch erwiesene Echtheit?
  choice: Im Haupttext steht „Prüfung“ als primäre und kontextuell naheliegende Bedeutung.
  alternative: „Bewährung“ beziehungsweise „erwiesene Echtheit“ meiner Erwählten
  rationale: Das Latein lässt sowohl den Vorgang des Prüfens als auch das daraus hervorgehende Erweis- oder Bewährungsergebnis anklingen. Der Haupttext wahrt den direkten Zusammenhang mit probatur; die alternative Nuance wird nicht dogmatisch festgelegt, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Offenbar werden“ erhält den leicht feierlichen Ton des lateinischen parebit, ohne altertümlich zu wirken. Der überlieferte Satzrest „suas eos eicient“ gehört syntaktisch zum vorausgehenden Kontext und wird entsprechend der vorgegebenen Versabgrenzung und der konsultierten englischen Fassung nicht in 16,74 aufgenommen.
