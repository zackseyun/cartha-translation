    issue: „zurückschnellen lassen“ ist semantisch und idiomatisch ungenau.
    rationale: Das Verb kann nahelegen, dass der Pfeil selbst zurückschnellt. Das lateinische recutiet beschreibt hier das Zurückwenden eines abgeschossenen Pfeils; „zurücklenken“ gibt dies im modernen Deutsch unmittelbar wieder.
