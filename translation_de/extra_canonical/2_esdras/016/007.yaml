translation:
  language: de
  text: Oder kann etwa jemand einen Pfeil zurücklenken, den ein starker Bogenschütze abgeschossen hat?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: zurückschnellen lassen
  rationale: Gibt die Vorstellung wieder, einen bereits abgeschossenen Pfeil zurückzuschlagen beziehungsweise umkehren zu lassen, und bewahrt so die rhetorische Unmöglichkeit der Frage.
- source_word: sagittam inmissam
  choice: einen Pfeil … abgeschossen
  rationale: Natürliches modernes Deutsch für einen in Bewegung gesetzten beziehungsweise entsandten Pfeil.
- source_word: a sagittario forte
  choice: von einem starken Bogenschützen
  rationale: Bezieht forte entsprechend der lateinischen Form und dem unmittelbaren Zusammenhang auf sagittario; „stark“ bildet fortis direkt und ohne zusätzliche heroische Färbung ab.
- source_word: aut numquid
  choice: Oder kann etwa
  rationale: Bewahrt sowohl den Anschluss an die vorherige Aussage als auch den erwarteten verneinenden Sinn der rhetorischen Frage.
theological_decisions:
- issue: Bild für die Unumkehrbarkeit des angekündigten Gerichts
  choice: Die rhetorische Frage bleibt als Bild stehen und wird nicht erklärend aufgelöst.
  alternative: Das Bild ausdrücklich als Aussage über Gottes Gericht paraphrasieren.
  rationale: Der Vers formuliert selbst nur den Vergleich; eine explizite theologische Deutung würde mehr festlegen, als der lateinische Wortlaut an dieser Stelle sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zurückschnellen lassen“ ist bildhaft und verständlich; die Satzstellung vermeidet eine schwerfällige wörtliche Nachbildung des lateinischen Passivs.
