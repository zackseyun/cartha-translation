  source_fidelity: Die rhetorische Frage, der bereits abgeschossene Pfeil und die Charakterisierung des Schützen als fortis sind zutreffend wiedergegeben. „Zurückschnellen lassen“ legt jedoch im Deutschen eher ein selbsttätiges Zurückschnellen nahe und trifft recutiet („zurückwenden/-lenken“) nicht idiomatisch.
  naturalness: Die Satzstruktur ist verständlich und dem würdigen modernen Register angemessen. „Einen Pfeil zurücklenken“ ist für die gemeinte unmögliche Umkehr eines abgeschossenen Pfeils klarer und natürlicher als „zurückschnellen lassen“.
  terminology: „Pfeil“, „Bogenschütze“ und „stark“ sind sachgerecht. Die Formulierung wahrt die Bildsprache, ohne die theologische Aussage auszudeuten.
