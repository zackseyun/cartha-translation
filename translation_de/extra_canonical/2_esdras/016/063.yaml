source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: spiramentum dei omnipotentis, qui fecit omnia et scrutatur absconsa in absconsis. Certe hic nouit adinuentionem uestram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/063.yaml
  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: de
  text: Der Atem Gottes, des Allmächtigen, der alles geschaffen hat und das Verborgene im Verborgenen erforscht. Gewiss kennt er euren Plan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiramentum
  choice: Atem
  rationale: Das lateinische Wort bezeichnet hier den Atem oder Lebenshauch. »Atem« wahrt das konkrete Bild, ohne es vorschnell als »Geist« auszulegen.
- source_word: scrutatur
  choice: erforscht
  rationale: Gibt das intensive Prüfen und Durchsuchen des Verborgenen in natürlichem, würdigem Deutsch wieder.
- source_word: absconsa in absconsis
  choice: das Verborgene im Verborgenen
  rationale: Bewahrt die auffällige Wiederholung und die Mehrdeutigkeit des lateinischen Ausdrucks, statt ihn auf bestimmte »Verstecke« festzulegen.
- source_word: adinuentionem uestram
  choice: euren Plan
  rationale: »Plan« gibt die hier gemeinte menschliche Ausarbeitung oder List verständlich wieder und wahrt den Singular des lateinischen Textes.
theological_decisions:
- issue: Deutung von »spiramentum«
  choice: Atem
  alternative: Geist
  rationale: Die konkretere Grundbedeutung wird beibehalten; eine ausdrückliche Gleichsetzung mit dem Geist Gottes wäre eine stärkere theologische Festlegung als der lateinische Wortlaut verlangt.
- issue: Satzfragment am Versanfang
  choice: Das nominale Fragment bleibt ohne ergänzendes »und« stehen.
  alternative: »Und der Atem Gottes …«
  rationale: Im vorgegebenen Vers beginnt der lateinische Text ohne »et«; ein ergänztes »und« würde Material aus dem vorhergehenden Vers übernehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung »das Verborgene im Verborgenen« bleibt bewusst erhalten. Der fragmentarische erste Satz entspricht der überlieferten Versabgrenzung; weder das abschließende Material des vorigen noch der Beginn des folgenden Verses wurde aufgenommen.
