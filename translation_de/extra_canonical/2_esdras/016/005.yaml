  source_fidelity: Der Entwurf gibt das lateinische „uobis mala“ angemessen als über die Angeredeten kommendes Unheil wieder und vermeidet zutreffend, einen im vorgelegten Textausschnitt nicht bezeichneten Sender zu ergänzen. „Wer kann es abwehren?“ entspricht der rhetorischen Frage „quis est qui repellat ea?“; das kollektive Singularwort „Unheil“ fasst das lateinische Pluralwort „mala“ idiomatisch zusammen.
  naturalness: „Unheil kommt über euch – und wer kann es abwehren?“ ist flüssiges, eindringliches modernes Standarddeutsch. Der Gedankenstrich unterstützt die rhetorische Zuspitzung, ohne den Sinn zu verändern.
  terminology: „Unheil“ und „abwehren“ sind treffende, registergerechte Entsprechungen. Die Formulierung bewahrt die im Fragment bestehende Unbestimmtheit über Ursprung oder Urheber des Unheils und folgt damit dem lateinischen Befund besser als die englische auditierte Formulierung mit explizitem Passiv „have been sent“.
