  text: Unheil kommt über euch – und wer kann es abwehren?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uobis mala
  choice: Unheil kommt über euch
  rationale: Das elliptische lateinische Fragment bezeichnet drohendes Unheil für die Angeredeten. Die Formulierung bleibt nahe am Sinn, ohne eine im erhaltenen Wortlaut nicht ausdrücklich belegte passive Sendungsform einzuführen.
- source_word: repellat ea
  choice: es abwehren
  rationale: „Abwehren“ gibt repellere natürlich und prägnant wieder; das singularische Pronomen nimmt das im Deutschen kollektiv gebrauchte „Unheil“ auf.
theological_decisions:
- issue: Ursprung bzw. Urheber des Unheils
  choice: Der Urheber bleibt ungenannt.
  alternative: „Unheil ist über euch gesandt worden“
  rationale: Der vorgelegte lateinische Wortlaut nennt keinen Handelnden und enthält in diesem Ausschnitt kein Verb des Sendens. Daher wird keine ausdrückliche göttliche Verursachung ergänzt.
translation_notes:
  register: Modernes, eindringliches Standarddeutsch mit rhetorischer Zuspitzung. Der Gedankenstrich bildet den Übergang von der Ankündigung zur Frage ab.
