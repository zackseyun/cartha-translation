id: 2ES.16.34
reference: 2 Esdras 16:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugebunt virgines non habentes sponsos, lugebunt mulieres non habentes viros, lugebunt filiae earum non habentes adiutorium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: de
  text: Jungfrauen, die keine Bräutigame haben, werden trauern; Frauen, die keine Ehemänner haben, werden trauern; ihre Töchter, die keinen Beistand haben, werden trauern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: virgines
  choice: Jungfrauen
  rationale: Entspricht der konkreten lateinischen Bezeichnung und bewahrt die Parallele zu Frauen und Töchtern.
- source_word: sponsos
  choice: Bräutigame
  rationale: Gibt den auf Heirat beziehungsweise Verlobung bezogenen Sinn von sponsus genauer wieder als das allgemeinere „Partner“.
- source_word: viros
  choice: Männer
  rationale: Im Zusammenhang mit mulieres und non habentes bezeichnet viros die Ehemänner; das natürliche deutsche „ihre Männer“ wird durch die Konstruktion „keine Männer haben“ verständlich ausgedrückt.
- source_word: adiutorium
  choice: Beistand
  rationale: Bewahrt den allgemeinen Sinn von Hilfe oder Unterstützung, ohne die Art des fehlenden Beistands näher festzulegen.
theological_decisions:
- issue: Art und Träger des fehlenden Beistands
  choice: „keinen Beistand haben“ bleibt allgemein
  alternative: „niemanden haben, der ihnen hilft“ oder „keinen Beschützer haben“
  rationale: Das lateinische adiutorium bezeichnet Hilfe oder Beistand, legt aber weder eine bestimmte Person noch Schutz als besondere Form der Hilfe fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; die dreifache Satzparallele und das wiederholte „werden trauern“ des lateinischen Textes bleiben erhalten.
