- from: einige von euch, und sie werden euch Götzenopfer zu essen geben. Und diejenigen, die sich ihnen fügen, werden ihnen zum Gespött, zur Schmach und zum Zertreten dienen.
  to: einige von euch, und sie werden euch Speisen zu essen geben, die Götzen geopfert wurden. Und diejenigen, die ihnen zustimmen, werden für sie Gegenstand von Spott, Schmach und Zertreten sein.
  rationale: Die Revision präzisiert die Opfermahlzeit, wahrt bei der Zustimmung die im Lateinischen bestehende Offenheit und gibt die abschließende dreigliedrige Nominalreihe in natürlichem modernen Deutsch wieder. Der fragmentarische Satzanfang bleibt als Fortsetzung des vorigen Verses erhalten.
