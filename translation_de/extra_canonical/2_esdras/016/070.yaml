source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quosdam ex uobis et cibabunt idolis occisam. Et qui consenserint eis, erint illis in derisum et in inproperium et in conculcationem;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/070.yaml
  text: some of you[a], and they will feed you food sacrificed to idols. And those who consent to them will be for them an object of derision and reproach and trampling underfoot.
translation:
  language: de
  text: einige von euch, und sie werden euch Speisen zu essen geben, die Götzen geopfert wurden. Und diejenigen, die ihnen zustimmen, werden für sie Gegenstand von Spott, Schmach und Zertreten sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cibabunt idolis occisam
  choice: sie werden euch Götzenopfer zu essen geben
  rationale: Die lateinische Wendung bezeichnet trotz ihrer grammatisch schwierigen Überlieferung Speise beziehungsweise Fleisch, das Götzen geopfert wurde. Die Übersetzung gibt den historischen Sinn natürlich wieder und vermeidet die falsche Vorstellung, Menschen würden den Götzen als Opfer dargebracht.
- source_word: consenserint eis
  choice: die sich ihnen fügen
  rationale: consentire mit Dativ kann Zustimmung oder Einwilligung in eine Forderung ausdrücken. Im Verfolgungskontext bezeichnet „sich ihnen fügen“ verständlich das Nachgeben, ohne eine innere Überzeugung zu unterstellen.
- source_word: in derisum et in inproperium et in conculcationem
  choice: zum Gespött, zur Schmach und zum Zertreten
  rationale: Die dreigliedrige lateinische Reihung wird bewahrt. „Zum Zertreten“ gibt conculcatio als substantivierten Vorgang wieder, ohne es stillschweigend in ein zusätzliches Passivverb umzuwandeln.
theological_decisions:
- issue: Art der Zustimmung gegenüber den Verfolgern
  choice: sich ihnen fügen
  alternative: ihnen zustimmen
  rationale: Die Formulierung lässt offen, ob es um ausdrückliche Zustimmung oder praktische Unterwerfung geht, und legt keine bestimmte Bewertung innerer Motive fest.
translation_notes:
  register: Moderner, würdevoller Standardstil. Der kleingeschriebene, syntaktisch unvollständige Anfang bleibt als Fortsetzung des vorhergehenden Verses erkennbar. Die dreifache Steigerung des lateinischen Schlusses wird beibehalten.
