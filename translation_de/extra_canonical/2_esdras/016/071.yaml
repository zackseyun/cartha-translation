    rationale: Das lateinische Substantiv ist Singular; »multa« kann hier die Intensität bzw. das Ausmaß ausdrücken. Die Pluralfassung ist möglich, legt aber stärker mehrere abgegrenzte Aufstände nahe.
  - severity: low
    issue: Die Formulierung »an einem Ort nach dem anderen« wirkt leicht sequenziell.
    rationale: Die schwierige distributive Formel kann knapper als »an Ort um Ort« wiedergegeben werden, ohne einen zeitlichen Ablauf zu betonen.
