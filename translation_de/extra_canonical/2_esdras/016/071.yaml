  source_fidelity: Die Ortsangaben werden im Wesentlichen zutreffend erfasst. »Exsurrectio multa« steht jedoch im Singular und bezeichnet eher ein starkes bzw. weit verbreitetes Sich-Erheben/Aufruhr als ausdrücklich mehrere einzelne »Aufstände«. Die überlieferte, syntaktisch auffällige Wendung »locis locus« sollte nicht stärker als nötig präzisiert werden.
  naturalness: Die Fassung ist gut verständlich. »An Ort um Ort« ist eine knappe, idiomatische und dem gehobenen prophetischen Register angemessene Wiedergabe der distributiven Ortsformel.
  terminology: »Aufruhr« gibt den hier ohne benanntes Ziel verwendeten Begriff »exsurrectio« neutral und kollektiv wieder. Es wird keine nicht im Text stehende Gegnerschaft ergänzt.
