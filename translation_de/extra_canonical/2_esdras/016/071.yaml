  text: For there will be much uprising in place after place and in the neighboring cities.
translation:
  language: de
  text: Denn an Ort um Ort und in den benachbarten Städten wird viel Aufruhr sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: locis locus
  choice: an einem Ort nach dem anderen
  rationale: Die schwierige beziehungsweise offenbar unregelmäßige lateinische Wendung wird distributiv wiedergegeben, entsprechend dem Sinn von wiederholt auftretenden Unruhen an verschiedenen Orten.
- source_word: in uicinas ciuitates
  choice: in den benachbarten Städten
  rationale: Das Latein bezeichnet benachbarte Städte; die idiomatische deutsche Ortsangabe steht mit »in« und Dativ.
- source_word: exsurrectio multa
  choice: viele Aufstände
  rationale: »Exsurrectio« kann ein Sich-Erheben beziehungsweise einen Aufstand bezeichnen. Der Plural gibt »multa« im Zusammenhang mit mehreren Orten natürlich wieder, ohne ein nicht genanntes Ziel der Erhebung hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aussage bleibt knapp und fügt insbesondere keine Personengruppe hinzu, gegen die sich die Aufstände richten.
