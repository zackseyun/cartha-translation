translation:
  language: de
  text: Gerechtigkeit wird über uns herrschen.[a] Der Sünder soll nicht sagen, er habe nicht gesündigt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere, auf einer abweichenden Versabgrenzung beruhende Fassung lautete: „Denn seht, in ganz kurzer Zeit wird die Ungerechtigkeit von der Erde weggenommen werden, und Gerechtigkeit wird über uns herrschen.“ Der hier gebotene Text folgt genau dem angegebenen lateinischen Abschnitt.'
    reason: previous_rendering
lexical_decisions:
- source_word: iusticia
  choice: Gerechtigkeit
  rationale: Die direkte und im biblischen Register natürliche Entsprechung bewahrt den ethisch-rechtlichen Sinn des lateinischen Begriffs.
- source_word: regnabit in nos
  choice: wird über uns herrschen
  rationale: Das lateinische regnare in mit Akkusativ bezeichnet hier Herrschaft über Personen; die Formulierung gibt das Futur und das königliche Herrschen klar wieder.
- source_word: peccator
  choice: der Sünder
  rationale: Die substantivische Personenbezeichnung entspricht dem Latein und bleibt allgemein, ohne eine besondere Tätergruppe festzulegen.
- source_word: non se peccasse
  choice: er habe nicht gesündigt
  rationale: Der Konjunktiv der indirekten Rede nach dicat wird im Deutschen idiomatisch mit Konjunktiv I wiedergegeben.
theological_decisions:
- issue: Bezug und Art der Herrschaft der Gerechtigkeit
  choice: „Gerechtigkeit wird über uns herrschen“
  alternative: „Gerechtigkeit wird in uns herrschen“
  rationale: Bei regnare in mit Akkusativ liegt die Bedeutung „über jemanden herrschen“ näher. Die Übersetzung deutet nicht zusätzlich aus, ob diese Herrschaft innerlich, gesellschaftlich oder eschatologisch gemeint ist.
