  text: sic remanebunt in diebus illis tres velquattuor ab scrutantibus domos eorum in romphea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/032.yaml
  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: de
  text: So werden in jenen Tagen drei oder vier von denen übrig bleiben, die ihre Häuser mit dem Schwert durchsuchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: remanebunt
  choice: werden … übrig bleiben
  rationale: Gibt das zukünftige Fortbestehen bzw. Überleben natürlich und quellennah wieder.
- source_word: ab scrutantibus domos eorum
  choice: von denen, die ihre Häuser … durchsuchen
  rationale: Bewahrt die lateinische Zuordnung von „von/unter den Durchsuchenden“ zu den drei oder vier Übrigbleibenden; „ihre“ lässt wie im Lateinischen einen gewissen Bezugsspielraum.
- source_word: in romphea
  choice: mit dem Schwert
  rationale: Das gräzisierende lateinische „romphea“ bezeichnet eine Schwertwaffe; die Präposition wird hier instrumental verstanden.
theological_decisions:
- issue: Bezug der Überlebenden zu den Hausdurchsuchern
  choice: Drei oder vier bleiben von denen übrig, die die Häuser durchsuchen.
  alternative: Drei oder vier Hausbewohner bleiben vor bzw. nach den schwerttragenden Durchsuchern übrig.
  rationale: Die Wortstellung und „ab scrutantibus“ sprechen am ehesten für eine partitive bzw. herkunftsbezogene Verbindung mit den Durchsuchenden. Eine Täter-Opfer-Deutung wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe und etwas rätselhafte Aussage des lateinischen Textes bleibt erhalten.
