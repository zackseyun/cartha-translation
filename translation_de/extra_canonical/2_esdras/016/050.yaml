  text: the more I will be zealous against them for their sins, says the Lord. How
translation:
  language: de
  text: Umso mehr werde ich gegen sie wegen ihrer Sünden eifern, spricht der Herr. Wie
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magis
  choice: umso mehr
  rationale: Gibt den steigernden bzw. vergleichenden Sinn des lateinischen Adverbs im fortlaufenden Zusammenhang natürlich wieder.
- source_word: adzelabor eos
  choice: werde ich gegen sie … eifern
  rationale: Bewahrt die Bedeutung von adzelabor als leidenschaftlichen Eifer und die gegen die Betroffenen gerichtete Aussage, ohne sie enger als bloßen Zorn auszulegen.
- source_word: super peccata
  choice: wegen ihrer Sünden
  rationale: Gibt super hier idiomatisch als Begründung bzw. Anlass des göttlichen Eifers wieder.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Entspricht der in würdevoller deutscher Bibelsprache üblichen Wiedergabe der prophetischen Redeformel.
- source_word: Quomodo
  choice: Wie
  rationale: Das am Versende überlieferte Wort wird als Beginn des folgenden Satzes beibehalten und nicht stillschweigend ausgelassen oder ergänzt.
theological_decisions:
- issue: Art der göttlichen Reaktion auf die Sünden
  choice: eifern
  alternative: zornig sein
  rationale: Das lateinische adzelabor bezeichnet ausdrücklich Eifer; die Übersetzung vermeidet es, die Aussage ohne zwingenden Grund auf Zorn zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche, aber verständliche Wendung „gegen sie eifern“ bewahrt die Eigenart des lateinischen Ausdrucks. Das abschließende „Wie“ bleibt als satzübergreifender Anschluss an den nächsten Vers stehen.
