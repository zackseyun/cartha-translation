  text: By his word the stars were established, and he knows the number of the stars.
translation:
  language: de
  text: Durch sein Wort bestehen die Sterne,[a] und er kennt die Zahl der Sterne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Text setzt hier erst mit „sunt“ („sind/bestehen“) ein; „Durch sein Wort“ ergänzt den im Ausschnitt fehlenden Satzanfang.
    reason: Der lateinische Quellenausschnitt beginnt mitten im Satz. Die Anmerkung macht die notwendige Ergänzung transparent, ohne den erhaltenen Präsenswortlaut zu überdeuten.
lexical_decisions:
- source_word: sunt … et novit numerum stellarum
  choice: wurden … gegründet, und er kennt die Zahl der Sterne
  rationale: „novit numerum stellarum“ wird unmittelbar und idiomatisch wiedergegeben. Das am Anfang erhaltene „sunt“ gehört zum abgeschnittenen vorangehenden Satzteil und verlangt im Deutschen eine ergänzte Verbform.
theological_decisions:
- issue: Ergänzung des im vorgelegten lateinischen Ausschnitt nur teilweise erhaltenen ersten Satzteils
  choice: Durch sein Wort wurden die Sterne fest gegründet
  alternative: … sind, und er kennt die Zahl der Sterne
  rationale: Der lateinische Ausschnitt setzt mitten im Satz mit „sunt“ ein. Die ergänzte Fassung folgt dem durch die Überlieferung beziehungsweise den geprüften Konsultationstext bezeugten Sinn, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „fest gegründet“ bewahrt das Bild einer durch Gottes Wort verliehenen Beständigkeit; „Zahl der Sterne“ folgt eng dem lateinischen Ausdruck.
