base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: de
  text: Wie sich eine anständige und sehr gute Frau über eine Prostituierte entrüstet,[a] so wird sich die Gerechtigkeit über die Ungerechtigkeit entrüsten, wenn sie sich schmückt, und wird die Ungerechtigkeit ihr ins Gesicht anklagen, wenn der kommt, der denjenigen verteidigt, der jede Sünde auf Erden erforscht.[b] Darum ahmt weder sie noch ihre Werke nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut ist grammatisch schwierig und stark zusammengedrängt. Das Bild vergleicht offenbar Gerechtigkeit und Ungerechtigkeit mit einer anständigen Frau und einer Prostituierten. Die genaue Wertung in idonea et bona valde ist nicht ganz eindeutig.
    reason: textual_variant
  - marker: b
    text: Die Satzfügung ist mehrdeutig. Im Haupttext bezieht sich „sie sich schmückt“ auf die Gerechtigkeit, da iusticia am ehesten Subjekt von exornat und accusat ist; eine Deutung auf die Ungerechtigkeit wird jedoch ebenfalls erwogen. Auch die Beziehung zwischen dem kommenden Verteidiger und demjenigen, der jede Sünde erforscht, ist im Lateinischen stark verdichtet.
    reason: textual_ambiguity
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: sich entrüsten / sich entrüsten wird
  rationale: Das lateinische Verb kann Eifer, Eifersucht oder heftigen Unwillen bezeichnen. „Sich entrüsten“ passt zum Gegensatz zwischen Gerechtigkeit und Ungerechtigkeit, ohne den Text auf Hass oder Eifersucht festzulegen.
- source_word: mulierem idonea et bona ualde
  choice: eine achtbare und sehr gute Frau
  rationale: Der grammatisch gedrängte lateinische Ausdruck beschreibt offenbar die Frau als angesehen bzw. untadelig und sehr gut. „Schön“ ist im erhaltenen Wortlaut nicht ausdrücklich belegt.
- source_word: fornicariam
  choice: Prostituierte
  rationale: Gibt die weibliche Personenbezeichnung klar und in heutigem Standarddeutsch wieder.
- source_word: cum exornat se
  choice: wenn diese sich herausputzt
  rationale: „Sich herausputzen“ bewahrt den bildhaften, tadelnden Sinn von exornare und kennzeichnet „Ungerechtigkeit“ als Subjekt, ohne die Personifikation aufzugeben.
- source_word: accusat eam in faciem
  choice: sie offen anklagen
  rationale: Die Wendung bedeutet wörtlich, jemanden „ins Gesicht“ anzuklagen; „offen anklagen“ gibt den Sinn einer unmittelbaren, unverdeckten Anklage natürlich wieder.
- source_word: exquirentem omnem peccatum super terram
  choice: der jeder Sünde auf Erden nachforscht
  rationale: Bewahrt den umfassenden Sinn des Suchens bzw. gründlichen Aufspürens aller Sünde auf der Erde.
- source_word: nolite similari eam nec operibus eius
  choice: gleicht ihr nicht und auch nicht ihren Werken
  rationale: Folgt der lateinischen Mahnung eng und erhält den Rückbezug auf die personifizierte Ungerechtigkeit.
theological_decisions:
- issue: Bezug von „qui defendat exquirentem“
  choice: „der denjenigen verteidigt, der jeder Sünde auf Erden nachforscht“
  alternative: „der als Verteidiger kommt und jeder Sünde auf Erden nachforscht“
  rationale: Die gewählte Fassung bildet die lateinische Verschachtelung und die zwei verbalen Rollen möglichst formal ab. Wegen der gedrängten Syntax wird die alternative Deutung in einer Fußnote offengehalten.
- issue: Personifikation von Gerechtigkeit und Ungerechtigkeit
  choice: Beide werden durch feminine Pronomen als handelnde Gestalten dargestellt.
  alternative: Neutrale oder unpersönliche Rückverweise
  rationale: Im Deutschen sind beide Substantive feminin; dies entspricht zugleich dem Frauenbild des Vergleichs und bewahrt dessen rhetorische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Personifikation bleibt erhalten; „Prostituierte“ ist klar und gegenwärtig, „sich herausputzen“ gibt die bildhafte Polemik natürlich wieder. Die schwierige lateinische Syntax wird nicht dogmatisch vereindeutigt.
