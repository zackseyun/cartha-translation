  to: Wie sich eine anständige und sehr gute Frau über eine Prostituierte entrüstet,[a] so wird sich die Gerechtigkeit über die Ungerechtigkeit entrüsten, wenn sie sich schmückt, und wird die Ungerechtigkeit ihr ins Gesicht anklagen, wenn der kommt, der denjenigen verteidigt, der jede Sünde auf Erden erforscht.[b] Darum ahmt weder sie noch ihre Werke nach.
  rationale: Die Revision folgt der wahrscheinlichsten lateinischen Kongruenz und Satzfortführung, ohne die textlich schwierigen Punkte dogmatisch zu entscheiden. Sie verbessert zugleich die deutsche Referenzklarheit, gibt in faciem konkreter wieder und ersetzt die irreführende alternative Fußnote durch eine quellennahe Ambiguitätsanmerkung.
