  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: In „cum exornat se“ ist nach der lateinischen Satzführung am naheliegendsten weiterhin iusticia das Subjekt; se bezieht sich daher auf die Gerechtigkeit. Die Fassung des Entwurfs, nach der die Ungerechtigkeit sich herausputzt, ist zwar als Deutungsmöglichkeit denkbar, wird aber im Text ohne Kennzeichnung festgelegt. Die schwierige Konstruktion bei „qui defendat exquirentem ...“ bleibt als solche gewahrt.'
  naturalness: Die Wiederholung femininer Pronomen ist im Deutschen grundsätzlich möglich, wird aber bei drei weiblichen Bezugsgrößen unnötig schwer verständlich. Die überarbeitete Fassung nennt „Gerechtigkeit“ und „Ungerechtigkeit“ an den entscheidenden Stellen ausdrücklich. „Ahmt weder sie noch ihre Werke nach“ ist eine natürliche und genaue Wiedergabe der abschließenden Mahnung.
  terminology: „Gerechtigkeit“, „Ungerechtigkeit“ und „Prostituierte“ sind sachgerecht. „Anständige und sehr gute Frau“ gibt idonea et bona valde zurück, ohne das im vorliegenden lateinischen Wortlaut nicht ausdrücklich stehende „schöne“ einzutragen. „Ins Gesicht anklagen“ bewahrt die Direktheit von in faciem besser als bloß „offen anklagen“.
  issues:
  - severity: medium
    issue: Bezug von „se“ in „cum exornat se“
    rationale: Der Entwurf macht die Ungerechtigkeit zum Subjekt von „sich herausputzt“. Im überlieferten Satz ist jedoch iusticia das fortlaufende Subjekt von exornat und accusat; eam verweist anschließend auf iniquitatem. Die alternative Deutung kann in der Anmerkung genannt, sollte aber nicht unmarkiert den Haupttext bestimmen.
  - severity: low
    issue: Fußnote b bietet keine tragfähige Alternativübersetzung
    rationale: „der als Verteidiger jeder Sünde auf Erden nachforscht“ löst defendat exquirentem in eine andere syntaktische und semantische Aussage auf. Die Anmerkung sollte stattdessen die tatsächliche Mehrdeutigkeit der Rollenbeziehung knapp benennen.
  - severity: low
    issue: „offen anklagen“ und „gleicht ihr nicht“
    rationale: „Offen“ schwächt die konkrete Wendung in faciem ab; „jemandem ins Gesicht anklagen“ ist näher am Bild. „Ahmt weder sie noch ihre Werke nach“ ist im modernen Deutsch idiomatischer und umfasst die beiden lateinischen Objekte klar.
