  naturalness: „Siehe, das Wort des Herrn! Nehmt es an“ ist verständlich, doch ein Doppelpunkt verbindet den Ausruf und die Aufforderung natürlicher. Die Schlussformulierung des Entwurfs ist schwer verständlich und für modernes Standarddeutsch nicht tragfähig.
