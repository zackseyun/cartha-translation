translation:
  language: de
  text: 'Siehe, das Wort des Herrn: Nehmt es an; zweifelt nicht an dem, was der Herr sagt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Latein hat hier die auffällige pluralische Form „de quibus“ („über die/von denen“), ohne dass ein eindeutiges Bezugswort genannt wird. Der Sinn ist wahrscheinlich: „Zweifelt nicht an dem, was der Herr sagt.“'
    reason: Macht die überlieferte grammatische Spannung sichtbar, während der Haupttext den wahrscheinlichen Sinn in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Aufmerksamkeitsruf des lateinischen Textes in einer würdigen, bibelsprachlich vertrauten Form.
- source_word: verbum Domini
  choice: das Wort des Herrn
  rationale: Direkte und theologisch offene Wiedergabe der lateinischen Genitivverbindung.
- source_word: excipite eum
  choice: Nehmt es an
  rationale: Excipere bezeichnet hier das Aufnehmen bzw. Annehmen des zuvor genannten Wortes; das deutsche Neutrum „es“ nimmt „Wort“ grammatisch korrekt auf.
- source_word: ne discredatis
  choice: glaubt nicht ungläubig
  rationale: Versucht, die ungewöhnliche negative Bildung discredere formal sichtbar zu halten, ohne sie einfach mit einem gewöhnlichen „nicht glauben“ gleichzusetzen.
- source_word: de quibus dicit Dominus
  choice: dem gegenüber, wovon der Herr spricht
  rationale: Bewahrt die im überlieferten Latein auffällige und grammatisch spannungsvolle Formulierung mit de quibus, statt sie stillschweigend zu „was der Herr sagt“ zu glätten.
theological_decisions:
- issue: Bezug von „de quibus“
  choice: Die formale Unklarheit wird im Text teilweise bewahrt und in einer Fußnote erläutert.
  alternative: „Glaubt nicht ungläubig, was der Herr sagt“ bzw. glatt „Zweifelt nicht an dem, was der Herr sagt“.
  rationale: Das lateinische quibus ist pluralisch, während ein eindeutiges Bezugswort im vorliegenden Satz fehlt. Eine völlig glatte Wiedergabe würde eine textliche Spannung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem „Siehe“. Die ungewöhnliche Formulierung am Versende spiegelt die Schwierigkeit des lateinischen Ausgangstextes; eine Fußnote ermöglicht zugleich ein verständliches Lesen.
