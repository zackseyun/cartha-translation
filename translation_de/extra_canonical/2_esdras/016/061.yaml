  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
translation:
  language: de
  text: Er legte auf den Gipfeln der Berge Wasserbecken an, um von der Höhe Flüsse hervorzusenden, damit die Erde trinken konnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lacus
  choice: Wasserbecken
  rationale: Das lateinische „lacus“ kann Seen, Teiche oder Becken bezeichnen. „Wasserbecken“ passt hier natürlich zu den auf Berggipfeln angelegten Wasserspeichern, aus denen Flüsse hervorgehen.
- source_word: ad emittendum flumina
  choice: damit … Flüsse hervorströmten
  rationale: Die Zweckangabe wird im Deutschen als Finalsatz wiedergegeben; „hervorströmen“ bewahrt das Bild des von der Höhe ausgehenden Wassers.
- source_word: ab eminenti
  choice: aus der Höhe
  rationale: Die substantivierte lateinische Wendung bezeichnet einen erhöhten Ort; die knappe Formulierung erhält zugleich die räumliche Bildsprache.
- source_word: ut potaret terra
  choice: und die Erde trinken konnte
  rationale: „Terra“ ist das Subjekt von „potaret“. Die Wiedergabe bewahrt daher das poetische Bild der trinkenden Erde, statt es zu „die Erde bewässern“ umzudeuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das im lateinischen Ausschnitt nur aus dem vorausgehenden Zusammenhang erschließbare Prädikat zu „lacus“ wird entsprechend der geprüften englischen Fassung mit „legte … an“ ergänzt. Der am Ende überlieferte Beginn des nächsten Satzes („Qui finxit hominem …“) wird nicht in Vers 61 aufgenommen.
