  yaml_path: translation/extra_canonical/2_esdras/016/012.yaml
  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: de
  text: Wird die Erde vor ihm nicht völlig zerschmettert werden? Die Erde erbebte, ebenso ihre Grundfesten; das Meer wird aus der Tiefe aufgewühlt, und seine Wellen und seine Fische werden vor dem Angesicht des Herrn und vor der Herrlichkeit seiner Macht in Unruhe geraten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: funditus conteretur
  choice: völlig zerschmettert werden
  rationale: „funditus“ verstärkt das passive Futur „conteretur“ bis zur vollständigen Zerstörung; die Formulierung gibt sowohl die Intensität als auch den Zukunftsbezug wieder.
- source_word: a facie ipsius
  choice: vor ihm
  rationale: Im Deutschen ist dies im ersten Fragesatz natürlicher als die wörtliche Wendung „vor seinem Angesicht“, ohne die Bedeutung der unmittelbaren Gegenwart abzuschwächen.
- source_word: Terra tremuit
  choice: Die Erde erbebte
  rationale: „tremuit“ ist formal Perfekt und wird daher nicht zum Präsens geglättet. Das deutsche Präteritum passt zum gehobenen Erzähl- und Prophetenton.
- source_word: mare fluctuatur de profundo
  choice: das Meer wird aus der Tiefe aufgewühlt
  rationale: Die passive Form und die Bewegung aus der Tiefe werden bewahrt; „aufgewühlt“ ist im Deutschen anschaulich und idiomatisch.
- source_word: disturbabuntur
  choice: werden … in Unruhe geraten
  rationale: Das Futur Passiv bezeichnet eine bevorstehende Erschütterung oder Verwirrung. Die deutsche Form wahrt den Zukunftsbezug und lässt sich natürlich auf Wellen und Fische zugleich beziehen.
- source_word: gloria uirtutis eius
  choice: Herrlichkeit seiner Macht
  rationale: „virtus“ bezeichnet hier im Kontext göttliche Kraft oder Macht; „Macht“ ist würdig und allgemein verständlich.
theological_decisions:
- issue: Bezug von „a facie domini et a gloria uirtutis eius“
  choice: auf die Unruhe der Wellen und Fische bezogen
  alternative: als allgemeiner Grund aller zuvor genannten kosmischen Erschütterungen verstanden
  rationale: Die Stellung unmittelbar nach „disturbabuntur“ legt den direkten syntaktischen Bezug auf Wellen und Fische nahe, ohne einen weiteren inhaltlichen Bezug auszuschließen.
- issue: Subjekt des einleitenden „conteretur“
  choice: die Erde
  alternative: ein ungenanntes, aus dem vorherigen Zusammenhang zu ergänzendes Subjekt
  rationale: Das feminine „conteretur“ lässt sich natürlich auf die unmittelbar folgende „Terra“ beziehen; die Ergänzung ist auch inhaltlich durch den kosmischen Gerichtskontext gestützt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrten Tempuswechseln des lateinischen Textes. „Grundfesten“ und „vor dem Angesicht“ tragen den biblisch-feierlichen Ton, bleiben aber allgemein verständlich.
