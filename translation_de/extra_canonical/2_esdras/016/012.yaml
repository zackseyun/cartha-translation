  to: Wird die Erde vor ihm nicht völlig zerschmettert werden? Die Erde erbebte, ebenso ihre Grundfesten; das Meer wird aus der Tiefe aufgewühlt, und seine Wellen und seine Fische werden vor dem Angesicht des Herrn und vor der Herrlichkeit seiner Macht in Unruhe geraten.
