  text: Mourn for them[a], because your destruction has drawn near.
translation:
  language: de
  text: Trauert um sie, denn eure Vernichtung ist nahe gekommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolete eos
  choice: Trauert um sie
  rationale: „Dolere“ bezeichnet hier Trauer oder Klage; mit dem Akkusativ „eos“ wird der Gegenstand der Trauer natürlich als „um sie“ wiedergegeben.
- source_word: contritio uestra
  choice: eure Vernichtung
  rationale: „Contritio“ bedeutet im prophetisch-apokalyptischen Zusammenhang Verderben, Zerstörung oder Vernichtung; „Vernichtung“ wahrt den ernsten Ton und vermeidet das im Deutschen unnatürliche, zu etymologische „Zermalmung“.
- source_word: adpropinquauit
  choice: ist nahe gekommen
  rationale: Das Perfekt bezeichnet ein bereits eingetretenes Nahen. „Ist nahe gekommen“ bildet diesen Aspekt genauer ab als das bloße „ist nahe“.
theological_decisions: []
translation_notes:
  register: Kurzer, würdevoller prophetischer Warnruf in modernem Standarddeutsch. Die direkte Anrede im Plural und der bedrohliche apokalyptische Ton bleiben erhalten.
