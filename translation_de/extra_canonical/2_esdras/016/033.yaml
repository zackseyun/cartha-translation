source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et relinquetur deserta terra, et agri eius inveteraverunt, et viae eius et omnes semitae germinabunt spinas, eo quod non transient oves per eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: de
  text: Und das Land wird verwüstet zurückbleiben, seine Felder werden verkommen[a], und auf seinen Straßen und all seinen Wegen werden Dornen sprießen, weil keine Schafe durch das Land ziehen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alt werden“; auch: „verfallen“.'
    reason: Die Grundbedeutung von inveterare ist „alt werden“, wirkt aber auf Felder bezogen im Deutschen ungewöhnlich; die Fußnote bewahrt die Formulierung und Bedeutungsbreite des lateinischen Textes.
lexical_decisions:
- source_word: terra
  choice: das Land
  rationale: „Land“ gibt terra in diesem Zusammenhang natürlicher und genauer wieder als „Erde“.
- source_word: relinquetur deserta
  choice: wird verwüstet zurückbleiben
  rationale: Bewahrt sowohl den passiven Gedanken des Zurückgelassenwerdens als auch den Zustand der Verwüstung.
- source_word: agri eius inveteraverunt
  choice: seine Felder werden verkommen
  rationale: Das wörtliche „alt werden“ klingt bei Feldern im heutigen Deutsch unnatürlich; „verkommen“ gibt den Bedeutungsbereich von inveterare (alt werden, verfallen) kontextgerecht wieder, ohne Dornen in diesen Satzteil hineinzulesen.
- source_word: germinabunt spinas
  choice: werden Dornen sprießen
  rationale: Entspricht dem bildhaften Verb germinare und dem Substantiv spinae unmittelbar.
- source_word: non transient oves per eam
  choice: keine Schafe mehr durch das Land ziehen werden
  rationale: Das feminine Singularpronomen eam bezieht sich grammatisch am ehesten auf terra; die Wiederaufnahme als „das Land“ vermeidet im Deutschen einen missverständlichen Pronomenbezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am lateinischen Ausgangstext, wird aber durch idiomatische Wortwahl und die ausdrückliche Wiederaufnahme von „das Land“ verständlich gehalten.
