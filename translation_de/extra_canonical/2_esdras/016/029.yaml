source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquentur enim decem de civitate et duo exagro, qui absconderint se in silva et in fissuras petrarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/029.yaml
  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: de
  text: Denn zehn aus der Stadt und zwei vom Land werden übrig bleiben, die sich im Wald und in Felsspalten verborgen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquentur
  choice: werden … übrig bleiben
  rationale: Gibt das lateinische Futur Passiv idiomatisch als verbleibenden Rest wieder.
- source_word: de civitate
  choice: aus der Stadt
  rationale: Bewahrt den Herkunfts- bzw. Teilungsbezug der Präposition de.
- source_word: ex agro
  choice: vom Land
  rationale: Bezeichnet hier im Gegensatz zur Stadt das ländliche Gebiet; „vom Land“ ist im Deutschen natürlich und ohne unnötige Verengung auf ein einzelnes Feld.
- source_word: in silva
  choice: im Wald
  rationale: Entspricht der gewöhnlichen Bedeutung von silva, ohne die nicht belegte Ergänzung „dicht“.
- source_word: in fissuras petrarum
  choice: in Felsspalten
  rationale: Gibt die Zufluchtsorte knapp und natürlich wieder; der lateinische Akkusativ nach in lässt eine Bewegung in die Spalten anklingen, während das Verbergen als vollzogener Zustand formuliert ist.
theological_decisions:
- issue: Bezug des Relativsatzes qui absconderint se
  choice: auf alle zwölf Übriggebliebenen bezogen
  alternative: nur auf die zwei vom Land bezogen
  rationale: Das maskuline Pluralpronomen qui kann grammatisch die gesamte zuvor genannte Personengruppe aufnehmen; der deutsche Relativsatz bewahrt diesen naheliegenden, aber nicht zusätzlich ausgedeuteten Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Wortlaut. Die Satzstellung hebt wie die Quelle die beiden kleinen Gruppen hervor; unbelegte Zusätze aus früheren Wiedergaben wurden vermieden.
