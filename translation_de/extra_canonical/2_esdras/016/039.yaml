source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: de
  text: 'Wie bei einer Schwangeren im neunten Monat: Wenn die Stunde ihrer Entbindung naht, erfassen zwei oder drei Stunden zuvor Wehen ihren Unterleib; und wenn das Kind aus dem Mutterleib hervortritt, zögert es keinen einzigen Augenblick,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense
  choice: eine Schwangere im neunten Monat
  rationale: Gibt die fortgeschrittene Schwangerschaft knapp, natürlich und sachlich wieder.
- source_word: ante horas duas vel tres
  choice: zwei oder drei Stunden zuvor
  rationale: Das lateinische „ante“ bezeichnet einen Zeitpunkt vor der Geburt, nicht die Dauer der Wehen.
- source_word: gementes dolores
  choice: Wehen
  rationale: Im unmittelbaren Geburtskontext sind schmerzhafte Geburtswehen gemeint; eine wörtliche Wiedergabe als „stöhnende Schmerzen“ wäre im Deutschen unnatürlich.
- source_word: circum ventrem eius
  choice: erfassen … ihren Unterleib
  rationale: Vermittelt idiomatisch, dass die Schmerzen den Bauchbereich der Schwangeren ringsum betreffen, ohne „venter“ vorschnell ausschließlich als Gebärmutter zu bestimmen.
- source_word: prodiente infante de ventre
  choice: wenn das Kind aus dem Mutterleib hervortritt
  rationale: Bewahrt das Bild des aus dem Leib hervorkommenden Kindes und formuliert es in würdigem, verständlichem Deutsch.
- source_word: non tardabit uno puncto
  choice: zögert es keinen einzigen Augenblick
  rationale: „Punctum“ bezeichnet hier einen minimalen Zeitpunkt; die Formulierung erhält die starke Aussage, dass keinerlei Verzögerung eintritt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Vergleich bleibt als fortlaufender, mit Komma endender Satzteil erhalten, da der Vers syntaktisch auf den folgenden Zusammenhang hin geöffnet ist. Keine Fußnote wurde übernommen, weil die Lesart „für zwei oder drei Stunden“ dem lateinischen „ante horas duas vel tres“ nicht entspricht.
