  text: peccata uestra, nec supereleuent iniquitates uestrae. Vae qui constringuntur a peccatis suis et obteguntur ab iniquitatibus suis, quemadmodum ager constringitur a silua et spinis tegitur semina eius, per quem non transit homo, et excluditur et mittitur ad deuorationem ignis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/078.yaml
  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: de
  text: eure Sünden[a], und eure Ungerechtigkeiten sollen nicht die Oberhand über euch gewinnen. Wehe denen, die von ihren Sünden fest gefesselt und von ihren Ungerechtigkeiten bedeckt sind! Sie gleichen einem Feld, das von Wald eingeengt ist und dessen Saat von Dornen bedeckt wird, durch das kein Mensch hindurchgeht; es wird abgesperrt und dem verzehrenden Feuer preisgegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers beginnt mitten im Satz; „eure Sünden“ setzt die Aufforderung aus Vers 77 fort.
    reason: Die lateinische Verseinteilung stellt den Abschluss des vorangehenden Satzes an den Anfang dieses Verses; die Fußnote verhindert, dass das Satzfragment als Textfehler verstanden wird.
lexical_decisions:
- source_word: supereleuent
  choice: die Oberhand über euch gewinnen
  rationale: Gibt das bildhafte Sich-über-jemanden-Erheben idiomatisch und mit dem Sinn des Überwältigens wieder, ohne die Aussage unnötig zu präzisieren.
- source_word: constringuntur
  choice: fest gefesselt
  rationale: Bewahrt das Bild eines Menschen, der durch seine eigenen Sünden eng gebunden ist.
- source_word: silua
  choice: Wald
  rationale: Direkte, natürliche Entsprechung für das einengende Gehölz um das Feld.
- source_word: semina eius
  choice: dessen Saat
  rationale: Das lateinische Neutrum Plural bezeichnet hier kollektiv das ausgesäte Saatgut; „Saat“ ist im Deutschen natürlich und bewahrt den landwirtschaftlichen Zusammenhang.
- source_word: excluditur
  choice: es wird abgesperrt
  rationale: Drückt aus, dass das Feld unzugänglich gemacht beziehungsweise abgeriegelt wird; der Bezug auf „Feld“ bleibt erhalten.
- source_word: mittitur ad deuorationem ignis
  choice: dem verzehrenden Feuer preisgegeben
  rationale: Gibt die Übergabe zur Vernichtung durch Feuer in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Verhältnis des Menschen zu Sünden und Ungerechtigkeiten
  choice: Die Sünden fesseln und die Ungerechtigkeiten bedecken die Betroffenen.
  alternative: Die Formulierungen lediglich abstrakt als Schuldzustand wiederzugeben.
  rationale: Die konkreten Bilder des lateinischen Textes werden beibehalten, ohne eine besondere Lehre über Ursache, Zurechnung oder Unentrinnbarkeit hinzuzufügen.
- issue: Bezug von „per quem“
  choice: 'Das Relativpronomen wird auf das Feld bezogen: „durch das kein Mensch hindurchgeht“.'
  alternative: Bezug auf den Wald oder eine freie Folgeangabe wie „sodass niemand hindurchgehen kann“.
  rationale: Das maskuline lateinische Relativpronomen „quem“ stimmt mit „ager“ überein; der Indikativ „transit“ bezeichnet eine tatsächliche Gegebenheit und nicht ausdrücklich eine Folge oder Unmöglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eröffnende Satzfortsetzung bleibt wegen der überlieferten Versgrenze fragmentarisch. Das Gleichnis wurde in zwei deutsche Sätze gegliedert, um die lange lateinische Konstruktion verständlich zu machen; die Bildfolge und der Bezug des abschließenden Singulars auf das Feld bleiben erhalten.
