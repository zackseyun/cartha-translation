  text: They will be like madmen[a], sparing no one, plundering and ravaging those who still fear the Lord.
translation:
  language: de
  text: Sie werden wie Wahnsinnige sein, niemanden verschonen und diejenigen ausplündern und verwüsten, die den Herrn noch immer fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quasi insani
  choice: wie Wahnsinnige
  rationale: Gibt den Vergleich und den Gedanken eines ungezügelten, vernunftlosen Handelns direkt und verständlich wieder.
- source_word: neminem parcentes
  choice: niemanden verschonen
  rationale: Formgetreue und natürliche Wiedergabe der lateinischen Partizipialkonstruktion.
- source_word: diripiendum et deuastandum
  choice: ausplündern und verwüsten
  rationale: 'Bewahrt die beiden komplementären Gewaltbegriffe: gewaltsames Berauben und zerstörerisches Verheeren.'
- source_word: adhuc timentes dominum
  choice: die den Herrn noch immer fürchten
  rationale: Die unmittelbare Stellung von „adhuc“ vor „timentes“ spricht dafür, dass das fortdauernde Fürchten des Herrn gemeint ist.
theological_decisions:
- issue: Bezug von „adhuc“
  choice: „noch immer“ bezieht sich auf diejenigen, die den Herrn fürchten
  alternative: „noch immer“ könnte auf das fortgesetzte Plündern und Verwüsten bezogen werden
  rationale: Wortstellung und Syntax verbinden „adhuc“ am engsten mit „timentes dominum“; dadurch wird das Ausharren der Gottesfürchtigen hervorgehoben, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache des lateinischen Textes bleibt erhalten; die Konstruktion wurde für gewöhnliche Leser syntaktisch verdeutlicht.
