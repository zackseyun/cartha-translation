  text: Will there be anyone to extinguish him? He will flash forth, and who will not fear?
translation:
  language: de
  text: Gibt es jemanden, der ihn auslöschen kann? Er wird aufblitzen, und wer wird sich nicht fürchten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: extinguat
  choice: auslöschen kann
  rationale: Gibt das lateinische Bild des Löschens unmittelbar wieder und lässt den Bezug des männlichen Pronomens bewusst offen.
- source_word: Coruscabit
  choice: Er wird aufblitzen
  rationale: Bewahrt das Bild eines plötzlichen, hellen Aufleuchtens; eine Wiedergabe mit »donnern« wäre vom lateinischen Text nicht gedeckt.
- source_word: timebit
  choice: sich fürchten
  rationale: Entspricht dem allgemeinen lateinischen Ausdruck für Furcht, ohne ihn zu »erschauern« oder einer anderen körperlichen Reaktion zu verengen.
theological_decisions:
- issue: Bezug von »eum« und das Subjekt von »coruscabit«
  choice: Das männliche Pronomen »ihn/er« bleibt ohne erklärende Identifizierung erhalten.
  alternative: Den Bezug ausdrücklich als Gott, Feuer oder Gericht benennen.
  rationale: Der vorgelegte lateinische Satzausschnitt nennt den Bezug nicht ausdrücklich; eine Identifizierung würde die im Quelltext vorhandene Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schlussfrage wird idiomatisch mit »wer sollte sich da nicht fürchten?« formuliert; der Gedankenstrich verdeutlicht den engen Folgezusammenhang, ohne zusätzliche Aussage einzuführen.
