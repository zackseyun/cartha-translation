  text: As in an olive orchard three or four olives are left,[a]
translation:
  language: de
  text: Wie in einem Olivenhain drei oder vier Oliven übrig bleiben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quemadmodum
  choice: Wie
  rationale: Leitet entsprechend dem lateinischen Vergleich eine knappe Vergleichsformel ein.
- source_word: in oliveto
  choice: in einem Olivenhain
  rationale: Gibt den Ort als gesamten Olivenhain wieder; der lateinische Text sagt nicht „an jedem Baum“.
- source_word: relinquentur
  choice: übrig bleiben
  rationale: Das Futur Passiv kann idiomatisch den verbleibenden Rest bezeichnen; im Deutschen ist „übrig bleiben“ natürlich und bewahrt den Sinn extremer Verknappung.
- source_word: tres vel quattuor olivae
  choice: drei oder vier Oliven
  rationale: Wörtliche und klare Wiedergabe der sehr kleinen Restmenge.
theological_decisions:
- issue: Umfang des verbleibenden Restes
  choice: Nur drei oder vier Oliven im Olivenhain werden genannt.
  alternative: Drei oder vier Oliven an jedem Baum.
  rationale: Die Alternative fügt eine Verteilung auf einzelne Bäume ein, die in „in oliveto“ nicht enthalten ist, und schwächt dadurch das Bild äußerster Knappheit.
translation_notes:
  register: Knappe, bildhafte und würdevolle Standardsprache. Das abschließende Komma bleibt erhalten, da der Vers offenbar syntaktisch in den folgenden Vergleichszusammenhang weiterführt.
