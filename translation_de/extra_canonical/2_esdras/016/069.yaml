review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung von „cibabunt idolis occisam“ als Gabe von Götzenopferfleisch ist im Einklang mit der im Audit dokumentierten, kontextuell besseren Deutung. Jedoch wird „turba copiosa“ im Entwurf fälschlich als Genitiv zu „Zorn“ aufgefasst. In der überlieferten, syntaktisch rauen Konstruktion steht es am besten als Anrede zu „euch“: die große Schar, über die die Zornesglut kommt.'
  naturalness: „Der glühende Zorn einer großen Menge“ ist nicht nur syntaktisch missverständlich, sondern verändert auch die Aussage, indem die Menge zur Trägerin des Zorns wird. Die Anrede „ihr große Schar“ ist im würdevollen modernen Bibelregister klar und natürlich. „Jemandem etwas zu essen geben“ ist für Menschen idiomatischer als „mit etwas füttern“.
  terminology: „Zornesglut“ gibt ardor sowie incenditur angemessen wieder. „Götzenopferfleisch“ ist ein etablierter, verständlicher Begriff und wahrt die im englischen Audit festgehaltene Deutung. Die Fußnote erhält die aufgrund der gedrängten lateinischen Form mögliche harte Alternativdeutung, ohne sie als Haupttext auszugeben.
  issues:
  - severity: medium
    issue: „turba copiosae“ wird als „einer großen Menge“ an „Zorn“ gebunden.
    rationale: Dadurch wird die große Menge zur Quelle beziehungsweise Besitzerin des Zorns. Die Konstruktion ist vielmehr am plausibelsten als Anrede bei „euch“ zu lesen, wie auch die Zeichensetzung des englischen Audittexts nahelegt.
  - severity: low
    issue: „mit Götzenopferfleisch füttern“ wirkt bei erwachsenen Gefangenen unnötig unidiomatisch.
    rationale: „Ihnen Götzenopferfleisch zu essen geben“ bewahrt den Sinn von cibabunt, ist modernes Standarddeutsch und besagt nicht mehr als der Ausgangstext.
