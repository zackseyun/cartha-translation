  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: de
  text: 'Denn siehe: Gegen euch, ihr große Schar, wird Zornesglut entfacht. Sie werden einige von euch ergreifen und ihnen Götzenopferfleisch zu essen geben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Latein ist an dieser Stelle rau und stark verkürzt. Die Wendung kann auch so verstanden werden, dass die Ergriffenen im Zusammenhang mit dem Götzendienst getötet oder nach ihrer Tötung als Speise preisgegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: incenditur ardor super uos
  choice: der glühende Zorn … entbrennt gegen euch
  rationale: „Incenditur“ bezeichnet das Entzünden oder Entbrennen; „ardor“ kann wörtlich „Glut“ oder übertragen „Zorn“ bedeuten. „Gegen euch“ gibt den feindlichen Sinn von „super vos“ natürlich wieder.
- source_word: turba copiosae
  choice: einer großen Menge
  rationale: Die überlieferte lateinische Formulierung ist grammatisch rau; inhaltlich bezeichnet sie eine zahlreiche Menschenmenge. Die Zuordnung zum entbrennenden Zorn ergibt einen verständlichen, quellennahen Satz.
- source_word: rapient
  choice: Sie werden einige von euch ergreifen
  rationale: „Rapient“ bedeutet „sie werden ergreifen/fortreißen“. Das im geprüften Ergänzungstext vorausgesetzte Objekt wird im Deutschen ausdrücklich gemacht, damit der Bezug verständlich bleibt.
- source_word: cibabunt idolis occisam
  choice: sie mit Götzenopferfleisch füttern
  rationale: Die Wendung wird als Hinweis auf Fleisch eines geschlachteten Opfertiers verstanden, das Götzen geopfert wurde, und auf den Zwang, davon zu essen.
theological_decisions:
- issue: Bezug des Geschlachteten in der gedrängten lateinischen Fortsetzung
  choice: Die Ergriffenen werden gezwungen, Götzenopferfleisch zu essen.
  alternative: Die Ergriffenen werden getötet und den Götzen beziehungsweise als Speise preisgegeben.
  rationale: Der historische Verfolgungskontext und der sachliche Bezug auf geopfertes Fleisch stützen die gewählte Lesart; wegen der rauen, verkürzten lateinischen Form bleibt die andere Deutung in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn seht“ bewahrt den eindringlichen Ankündigungscharakter; „Götzenopferfleisch“ ist ein verständlicher und im biblischen Sprachgebrauch etablierter Ausdruck.
