revisions:
- from: 'Denn seht: Der glühende Zorn einer großen Menge entbrennt gegen euch. Sie werden einige von euch ergreifen und sie mit Götzenopferfleisch füttern.[a]'
  to: 'Denn siehe: Gegen euch, ihr große Schar, wird Zornesglut entfacht. Sie werden einige von euch ergreifen und ihnen Götzenopferfleisch zu essen geben.[a]'
  rationale: Die Revision stellt die Anredefunktion von „turba copiosa“ wieder her und vermeidet damit eine sinnverändernde Zuordnung der großen Menge zum Zorn. Die Hauptübersetzung folgt weiterhin der durch den englischen Audit belegten Deutung von „cibabunt idolis occisam“ als erzwungene beziehungsweise auferlegte Speise aus Götzenopferfleisch. Die alternative, wegen der schwierigen lateinischen Kürze nicht völlig auszuschließende Deutung bleibt in der Fußnote erhalten.
