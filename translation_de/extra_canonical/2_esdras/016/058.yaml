id: 2ES.16.58
reference: 2 Esdras 16:58
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: thesauros illorum, qui metitus est mare et conceptum eius; Qui conclusit mare in medio aquarum et suspendit terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/058.yaml
  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: de
  text: Er erforscht die Tiefe und ihre Schätze; er hat das Meer und alles, was es enthält, ausgemessen; er hat das Meer mitten in den Wassern eingeschlossen und die Erde aufgehängt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: metitus est
  choice: hat … ausgemessen
  rationale: Gibt das vollendete Messen des lateinischen Perfekts präzise und in natürlichem Deutsch wieder.
- source_word: mare et conceptum eius
  choice: das Meer und alles, was es enthält
  rationale: Bewahrt den Sinn von „conceptum eius“ als Inhalt beziehungsweise das im Meer Enthaltene, ohne eine unnötig technische Formulierung.
- source_word: conclusit
  choice: hat … eingeschlossen
  rationale: Entspricht dem Bild des Begrenzens oder Einschließens des Meeres.
- source_word: suspendit terram
  choice: hat … die Erde aufgehängt
  rationale: Erhält das konkrete kosmologische Bild des lateinischen Verbs, statt es deutend zu „schweben lassen“ abzuschwächen.
theological_decisions:
- issue: Kosmologische Bildsprache
  choice: Das Meer wird „mitten in den Wassern eingeschlossen“ und die Erde „aufgehängt“.
  alternative: Die Bilder naturwissenschaftlich glätten oder als bloße Metaphern kennzeichnen.
  rationale: Die konkrete antike Bildsprache wird ohne harmonisierende Erklärung oder dogmatische Auslegung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Perfektformen und die wiederholte Nennung des Meeres bewahren den feierlichen Aufbau des lateinischen Textes.
