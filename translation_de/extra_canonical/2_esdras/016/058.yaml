  source_fidelity: 'Die Übersetzung gibt die im Kontext bezeugte vollständige Satzfolge sachgerecht wieder: „erforscht“ für scrutatur, „Tiefe“ für abyssum, „Schätze“ für thesauros, „ausgemessen“ für metitus est, „alles, was es enthält“ für conceptum eius, „eingeschlossen“ für conclusit und „aufgehängt“ für suspendit terram. Sie bewahrt die antike kosmologische Bildlichkeit, ohne sie zu modernisieren oder auszudeuten. Die überlieferungsbedingt auffällige Verkürzung am Beginn des bereitgestellten lateinischen Ausschnitts wird durch den englischen POB-Audit-Trail als die vollständige, beabsichtigte Satzfassung bestätigt.'
