base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/056.yaml
  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: de
  text: 'Er sprach: »Der Himmel soll entstehen«, und er entstand; und durch sein Wort wurden die Sterne gegründet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: Der Himmel soll entstehen
  rationale: Gibt den lateinischen Schöpfungsbefehl natürlich und würdig wieder, ohne das im Deutschen schwerfällige »werde gemacht«.
- source_word: factum est
  choice: er entstand
  rationale: Bewahrt die Entsprechung zum vorausgehenden Schöpfungsbefehl und vermeidet ein unnatürliches Passiv.
- source_word: in uerbo illius
  choice: durch sein Wort
  rationale: Das lateinische »in« bezeichnet hier sinngemäß das Mittel bzw. die wirksame Kraft; »durch« ist im modernen Deutschen klar und idiomatisch.
- source_word: stellae fundatae
  choice: die Sterne wurden gegründet
  rationale: Bewahrt das Fundament- bzw. Gründungsmotiv von »fundatae«, statt es allgemein zu »geschaffen« abzuschwächen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des Schöpfungswortes
  choice: Er sprach
  alternative: Derjenige, der sprach
  rationale: Der lateinische Ausschnitt beginnt elliptisch mit dem Schöpfungsbefehl; aus dem Kontext und der konsultierten englischen Fassung ergibt sich ein männliches, zuvor genanntes Subjekt. »Er sprach« bleibt knapp und vermeidet eine unnötig substantivierte Umschreibung.
- issue: Verhältnis von Wort und Sternengründung
  choice: durch sein Wort
  alternative: in seinem Wort
  rationale: Die instrumentale Deutung ist im Zusammenhang eines wirksamen Schöpfungswortes am natürlichsten, ohne eine weitergehende christologische Identifikation in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Parallelstruktur des lateinischen Textes bleibt erhalten; die ungewöhnliche, aber bedeutungstragende Rede von der Gründung der Sterne wird nicht geglättet.
