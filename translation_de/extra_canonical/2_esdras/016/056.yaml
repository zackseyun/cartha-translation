  source_fidelity: 'Der Entwurf gibt die beiden lateinischen Aussagen sachgerecht wieder: den Schöpfungsbefehl »fiat caelum« mit seiner Erfüllung »et factum est« sowie die durch Gottes Wort bewirkte Gründung der Sterne. »Durch sein Wort« ist für »in uerbo illius« eine angemessene idiomatische instrumentale Wiedergabe. Die ungewöhnliche Bildsprache von »stellae fundatae« bleibt mit »wurden die Sterne gegründet« erhalten.'
  naturalness: Modernes Standarddeutsch mit angemessen knappem, würdigem biblischen Register. Die Formulierung »Der Himmel soll entstehen« ist als schöpferischer Befehl verständlich; »und er entstand« bewahrt die prägnante Wiederaufnahme.
  terminology: »Wort« und »gegründet« sind terminologisch zurückhaltend und textnah. Insbesondere wird »fundatae« nicht interpretierend zu »geschaffen« eingeebnet und keine christologische Deutung in »sein Wort« eingetragen.
