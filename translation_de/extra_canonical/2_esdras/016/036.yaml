  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, servants of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: de
  text: 'Hört aber dies und erkennt es, ihr Diener des Herrn. Siehe, das Wort des Herrn: Nehmt es an und zweifelt nicht an dem, wovon er spricht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite uero
  choice: Hört aber
  rationale: Gibt den adversativen beziehungsweise weiterführenden Akzent von „uero“ und den Imperativ „Audite“ knapp wieder.
- source_word: cognoscite ea
  choice: erkennt es
  rationale: Bewahrt gegenüber bloßem Verstehen den Erkenntnisaspekt von „cognoscite“; das deutsche Singularpronomen nimmt den zusammengefassten Inhalt von „dies“ auf.
- source_word: serui domini
  choice: Diener des Herrn
  rationale: „serui“ kann Sklaven oder Diener bezeichnen. In der direkten Anrede ist „Diener des Herrn“ natürlich und würdig, ohne das Zugehörigkeitsverhältnis aufzulösen.
- source_word: Ecce uerbum domini
  choice: Seht, das Wort des Herrn!
  rationale: „Seht“ bildet das präsentative „Ecce“ ab; die elliptische Form des lateinischen Satzes bleibt erhalten.
- source_word: excipite eum
  choice: Nehmt es an
  rationale: „excipere“ bezeichnet hier das Aufnehmen beziehungsweise Annehmen; „es“ bezieht sich im Deutschen grammatisch auf „das Wort“.
- source_word: ne discredatis
  choice: glaubt nicht dem nicht
  rationale: Versucht, das Verbot des Nichtglaubens formal wiederzugeben.
- source_word: de quibus dicit
  choice: wovon er spricht
  rationale: Die lateinische Konstruktion ist knapp und etwas uneben; die Wiedergabe bewahrt den Bezug auf das, wovon der Herr spricht.
theological_decisions:
- issue: Bedeutung von „serui domini“
  choice: Diener des Herrn
  alternative: Sklaven des Herrn
  rationale: Beide Bedeutungen liegen im lateinischen „serui“. „Diener“ ist im modernen deutschen Bibelregister idiomatischer und lässt den Kontext entscheiden, ohne eine konfessionelle Zuspitzung einzutragen.
- issue: Referent von „dicit“
  choice: er spricht
  alternative: es spricht
  rationale: Das maskuline „eum“ kann auf das personhaft gefasste Wort beziehungsweise auf den Herrn bezogen sein; die englische Konsultationsfassung versteht das Subjekt als „he“. Die Übersetzung bewahrt diese personale Lesart.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Anrede und bewusst knapper Satzstruktur.
