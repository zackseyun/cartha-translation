  source_fidelity: 'Der Haupttext gibt die gesamte vorgelegte lateinische Passage wieder: „opera“ als „Werke“, „adinuentiones“ idiomatisch als „Pläne“, „cogitatum“ als „Gedanken“ und „corda“ als „Herzen“. „Er, der sagte“ entspricht dem relativischen „Qui dixit“, ohne das aus dem vorausgehenden Vers zu erschließende Subjekt „der Herr“ unzulässig in den Haupttext einzutragen. „Die Erde soll entstehen“ gibt „fiat terra“ als schöpferischen Befehl angemessen wieder; „und sie entstand“ entspricht „et facta est“.

