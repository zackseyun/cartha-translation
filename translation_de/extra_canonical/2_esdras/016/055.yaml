  yaml_path: translation/extra_canonical/2_esdras/016/055.yaml
  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: de
  text: 'alle Werke der Menschen, ihre Pläne, ihre Gedanken und ihre Herzen. Er, der sagte[a]: »Die Erde soll entstehen«, und sie entstand;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bei versübergreifender Satzverbindung: »Siehe, der Herr kennt alle Werke der Menschen, ihre Pläne, ihre Gedanken und ihre Herzen. Er sagte: ›Die Erde soll entstehen‹, und sie entstand.«'
    reason: Bewahrt die frühere, auf dem syntaktischen Anschluss an das Ende von Vers 54 beruhende Wiedergabe, ohne die vorgegebenen Quelltextgrenzen im Haupttext zu verwischen.
lexical_decisions:
- source_word: opera
  choice: Werke
  rationale: Gibt das breite lateinische Bedeutungsfeld von Taten und Hervorbringungen formal und idiomatisch wieder.
- source_word: adinventiones
  choice: Pläne
  rationale: Bezeichnet hier menschliche Einfälle, Vorhaben oder Erfindungen; »Pläne« ist im Zusammenhang natürlich und verständlich.
- source_word: cogitatum
  choice: Gedanken
  rationale: Der bereinigte Text weist offenbar eine nichtklassische oder fehlerhafte Form für die Gedanken der Menschen auf; der Sinn ist eindeutig pluralisch.
- source_word: corda
  choice: Herzen
  rationale: Bewahrt die biblische Rede vom Herzen als innerem Bereich des Menschen.
- source_word: fiat terra
  choice: Die Erde soll entstehen
  rationale: Gibt den Schöpfungsbefehl mit seinem Werden-Sinn wieder, ohne ein menschliches Anfertigen der Erde nahezulegen.
theological_decisions:
- issue: Anschluss des Relativsatzes »Qui dixit«
  choice: 'Als neuer Satz: »Er, der sagte …«'
  alternative: An das aus dem vorherigen Vers zu ergänzende Subjekt »der Herr« anschließen
  rationale: Der überlieferte Versabschnitt beginnt mitten in einer Satzfolge. Die gewählte Form folgt den angegebenen Versgrenzen und lässt zugleich erkennen, dass der Sprecher auf den Schöpfer verweist.
- issue: Im englischen Konsultationstext markierte frühere Lesart
  choice: Fußnote zur versübergreifenden Anschlussmöglichkeit
  alternative: »Siehe, der Herr kennt …« in den Haupttext aufnehmen
  rationale: »Ecce dominus cognoscit« gehört nach der vorliegenden Segmentierung zum Ende von 16,54 und darf nicht in den Haupttext von 16,55 verschoben werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Beginn des lateinischen Versabschnitts bleibt erhalten; keine Ergänzung von »Siehe, der Herr kennt« im Haupttext. Das Semikolon wahrt den fortlaufenden Charakter des Ausgangstextes.
