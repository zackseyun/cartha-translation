  text: For a man will long to see another man[a], or at least to hear his voice.
translation:
  language: de
  text: Denn ein Mensch wird sich danach sehnen, einen anderen Menschen zu sehen oder wenigstens seine Stimme zu hören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: concupiscet
  choice: wird sich danach sehnen
  rationale: Gibt das starke Verlangen des lateinischen Futurs natürlich und würdig wieder.
- source_word: homo hominem
  choice: ein Mensch … einen anderen Menschen
  rationale: Macht die Beziehung zwischen einem Menschen und einem anderen im Deutschen eindeutig, ohne den Ausdruck geschlechtsspezifisch auf »Mann« zu verengen.
- source_word: vel certe
  choice: oder wenigstens
  rationale: Kennzeichnet das Hören der Stimme als geringere, ersatzweise verbleibende Möglichkeit.
- source_word: vocem eius audire
  choice: seine Stimme zu hören
  rationale: Entspricht der lateinischen Formulierung unmittelbar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von »Mensch« bleibt erhalten, weil sie die verzweifelte Sehnsucht nach irgendeinem anderen Menschen hervorhebt.
