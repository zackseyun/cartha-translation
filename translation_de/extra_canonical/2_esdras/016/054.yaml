  source_fidelity: 'Die Übersetzung bildet die lateinische Syntax sorgfältig ab: conburet ist als Futur der 3. Person Singular mit unausgedrücktem Subjekt wiedergegeben, während „Feuerkohlen“ das direkte Objekt bleibt. super caput, der Relativsatz mit dicit, coram deo et gloria ipsius sowie der knappe objektlose Schlusssatz Ecce dominus cognoscit sind erhalten.'
  naturalness: Das Deutsch ist verständlich und würdig. Die Formulierung „Feuerkohlen ... verbrennen“ wirkt im Deutschen bewusst hart, entspricht jedoch der transitiven und semantisch auffälligen Formulierung des lateinischen Textes besser als eine glättende Umdeutung, bei der die Kohlen selbst zum Subjekt würden.
  terminology: „Feuerkohlen“, „Herrlichkeit“ und „der Herr“ sind registergerecht und theologisch nicht überdeutet. Die Fußnote kennzeichnet die nur erschlossene Zuordnung des unausgedrückten Subjekts angemessen.
