source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: de
  text: 'Denn Feuerkohlen wird er[a] auf dem Kopf dessen verbrennen, der sagt: »Ich habe vor Gott und seiner Herrlichkeit nicht gesündigt.« Siehe, der Herr weiß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt ist im Lateinischen nicht ausdrücklich genannt; gemeint ist wahrscheinlich der Herr.
    reason: Die Form des Verbs verlangt ein unausgesprochenes Subjekt in der Einzahl, dessen Bezug aus dem Zusammenhang erschlossen werden muss.
lexical_decisions:
- source_word: carbones ignis
  choice: Feuerkohlen
  rationale: Gibt die wörtliche Verbindung „Kohlen des Feuers“ knapp und idiomatisch wieder.
- source_word: conburet
  choice: wird … verbrennen
  rationale: Bewahrt Futur und transitive Bedeutung der dritten Person Singular; „Feuerkohlen“ ist dabei das direkte Objekt.
- source_word: coram deo et gloria ipsius
  choice: vor Gott und seiner Herrlichkeit
  rationale: Erhält die ungewöhnliche Koordination des lateinischen Textes, ohne sie erklärend aufzulösen.
- source_word: Ecce dominus cognoscit
  choice: Siehe, der Herr weiß
  rationale: Bewahrt den knappen, möglicherweise in den Folgevers überleitenden und im Lateinischen objektlosen Ausdruck.
theological_decisions:
- issue: Unausgesprochenes Subjekt von „conburet“
  choice: „er“, wahrscheinlich auf den Herrn bezogen
  alternative: „Feuerkohlen werden auf dem Kopf … brennen“
  rationale: Das lateinische Verb steht in der dritten Person Singular und ist transitiv; daher können die pluralischen „carbones“ nicht ohne Weiteres das Subjekt sein. Der unmittelbar danach genannte „Herr“ ist der wahrscheinlichste Bezug, wird aber im ersten Satz nicht ausdrücklich genannt.
- issue: Bezug von „seiner Herrlichkeit“
  choice: Die grammatische Verbindung mit Gott bleibt erhalten
  alternative: Deutung als Sünde gegen Gott und gegen seine Herrlichkeit
  rationale: Die Übersetzung wahrt die sprachliche und theologische Spannung des Quelltexts, statt das Verhältnis der beiden Ergänzungen näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache und der abrupte Schlusssatz bleiben bewusst erhalten; „Kopf“ ist gegenüber dem gehobeneren „Haupt“ für heutige Leser unmittelbar verständlich.
