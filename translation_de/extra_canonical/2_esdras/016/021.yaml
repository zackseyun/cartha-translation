  source_fidelity: Die Wiedergabe von „se non conuertent ab iniquitatibus suis“ ist sachgerecht, und „nicht immer“ bewahrt die auffällige, im Kontext nicht eindeutig zu verstärkende Stellung von „semper“. „trotz alledem“ macht aus „in his omnibus“ jedoch eine deutlichere Konzessivbeziehung („trotz“) als der lateinische Ausdruck selbst vorgibt; „bei all dem“ entspricht der lokalen/umständlichen Formulierung genauer.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. Mit „bei all dem“ bleibt er ebenso idiomatisch und ist zugleich näher am Ausgangstext.
