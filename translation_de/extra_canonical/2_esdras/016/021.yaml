source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et angustia missa sunt flagella in emendatione. Et in his omnibus se non conuertent ab iniquitatibus suis, neque flagellorum memores erunt semper. Ecce erit annonae uilitas super terram sic ut putent sibi esse directam pacem, et tunc germinabunt mala super terram, gladius, fames et magna confusio. A fame enim plurimi qui inhabitant terram interient, et gladius perdet ceteros qui superauerint a fame; Et mortui tanquam stercora proicientur, et non erit qui consoletur eos; derelinquetur enim terra deserta, et ciuitates eius deicientur. Non derelinquetur qui colat terram et qui seminet eam. Ligna dabunt fructus, et quis uindemiabit illa? Vua matura fiet, et quis calcabit illam? erit enim in locis magna desertio; Cupiet enim homo hominem uidere uel uocem eius audire; Relinquentur enim de ciuitate decem, et duo de agro qui absconderint se in densis nemoribus et fissuris petrarum. Quemadmodum relinquentur in oliueto in singulis arboribus tres aut quattuor oliuae, Aut sicut in uinea uindemiata
    racemi relinquentur ab his qui diligenter uineam scrutantur; Sic relinquentur in diebus illis tres aut quattuor ab scrutantibus domus eorum in rumpheam. Et relinquetur deserta terra, et agri eius in uepres erunt, et uiae eius et omnes semitae germinabunt spinas, eo quod non transient oues per eam. Lugebunt uirgines non habentes sponsos, lugebunt mulieres non habentes uiros, lugebunt filiae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/021.yaml
  text: Yet in all these things they will not turn from their iniquities, nor will they always remember the scourges.
translation:
  language: de
  text: Doch bei all dem werden sie sich nicht von ihren Ungerechtigkeiten abwenden und sich auch nicht immer an die Plagen erinnern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in his omnibus
  choice: trotz alledem
  rationale: 'Die Wendung bezeichnet hier den begleitenden beziehungsweise einräumenden Umstand: Selbst angesichts all dieser Züchtigungen erfolgt keine Umkehr. Idiomatisches modernes Deutsch gibt dies mit „trotz alledem“ klar wieder.'
- source_word: se non conuertent ab iniquitatibus suis
  choice: sie werden sich nicht von ihren Ungerechtigkeiten abwenden
  rationale: Bewahrt die reflexive Bewegung des lateinischen „convertere se ab“ und gibt „iniquitates“ als moralische Verfehlungen wieder, ohne die Aussage konfessionell zuzuspitzen.
- source_word: flagellorum
  choice: Plagen
  rationale: Im Kontext sind auferlegte Straf- und Züchtigungsmaßnahmen gemeint. „Plagen“ ist im Deutschen verständlicher und natürlicher als das wörtliche „Geißeln“, bewahrt aber den Gerichtsklang.
- source_word: memores erunt semper
  choice: sich auch nicht immer … erinnern
  rationale: Folgt der Stellung und Reichweite von „semper“ im überlieferten lateinischen Text und bewahrt die ungewöhnliche, möglicherweise mehrdeutige Aussage, statt sie zu „überhaupt nicht“ zu glätten.
theological_decisions:
- issue: Bedeutung von „semper“ in der Verneinung
  choice: „nicht immer“ wörtlich bewahren
  alternative: „niemals“ oder „überhaupt nicht“
  rationale: Das Latein lautet „neque … memores erunt semper“ und bedeutet formal „sie werden nicht immer eingedenk sein“. Obwohl der Zusammenhang eine stärkere Verneinung nahelegen könnte, soll die echte sprachliche Spannung nicht stillschweigend aufgelöst werden.
- issue: Charakter der „flagella“
  choice: neutral als „Plagen“ wiedergeben
  alternative: „Züchtigungen“ oder „Geißelhiebe“
  rationale: Der vorangehende Kontext beschreibt „flagella“ als Mittel der Besserung. „Plagen“ wahrt den Zusammenhang von Gericht und Leid, ohne ausdrücklich eine bestimmte Lehre von göttlicher Züchtigung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nahe an der lateinischen Struktur, klingt jedoch idiomatisch. Keine Fußnote ist erforderlich; die auffällige Formulierung „nicht immer“ bewahrt bewusst die Mehrdeutigkeit des Ausgangstextes.
