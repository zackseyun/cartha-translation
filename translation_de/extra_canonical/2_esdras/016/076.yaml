  rationale: Gibt das Verbot des Fürchtens in natürlichem, modernem Deutsch wieder.
- source_word: nec haesitemini
  choice: und zögert nicht
  rationale: Das lateinische haesitare bezeichnet hier ein Zögern oder Schwanken; „zögert“ bewahrt den handlungsbezogenen Sinn, ohne ihn auf Zweifel zu verengen.
- source_word: dux vester
  choice: euer Führer
  rationale: Dux bezeichnet denjenigen, der vorangeht und leitet. „Führer“ entspricht dem Bild und ist im religiös-literarischen Zusammenhang verständlich.
