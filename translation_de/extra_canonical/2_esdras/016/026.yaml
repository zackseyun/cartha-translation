  rationale: Das lateinische „ligna“ kann zwar wörtlich „Hölzer“ bedeuten, bezeichnet hier wegen des Fruchttragens natürlich Bäume.
- source_word: fructiferabunt
  choice: werden Frucht tragen
  rationale: Gibt die zukünftige Aussage direkt und in natürlichem Deutsch wieder.
- source_word: vindemiet
  choice: ernten
  rationale: Das Verb bezeichnet ursprünglich besonders die Weinlese, kann hier im Zusammenhang mit der Frucht der Bäume jedoch allgemein das Einbringen der Ernte ausdrücken.
theological_decisions:
- issue: Rhetorische Frage nach dem Einbringen der Frucht
  choice: doch wer wird sie ernten?
  alternative: und wer wird sie ernten?
  rationale: „Doch“ macht den im Kontext der Unheilsankündigung liegenden Gegensatz verständlich, ohne die offene rhetorische Frage aufzulösen.
