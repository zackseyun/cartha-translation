source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et aporiant vitam super terram, et gladius dispersit quae superaverint a fame.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/023.yaml
  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: de
  text: Und sie werden auf der Erde ihr Leben verlieren[a], und das Schwert wird die zerstreuen, die die Hungersnot überlebt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine andere lateinische Textform lautet: „Denn viele von denen, die auf der Erde wohnen, werden an Hunger sterben, und das Schwert wird die vernichten, die die Hungersnot überleben.“'
    reason: Die überlieferte Alternativfassung erklärt die deutlich abweichende frühere Wiedergabe und macht die relevante lateinische Textvariante transparent.
lexical_decisions:
- source_word: aporiant vitam
  choice: ihr Leben verlieren
  rationale: Das seltene bzw. textlich auffällige „aporiant“ wird im Zusammenhang mit „vitam“ als Mangel oder Verlust des Lebens verstanden; die Formulierung folgt dem vorliegenden gereinigten lateinischen Text, ohne die abweichende Vulgata-Lesart „an Hunger sterben“ in den Haupttext einzutragen.
- source_word: super terram
  choice: auf der Erde
  rationale: Direkte und natürliche Wiedergabe der räumlichen Wendung.
- source_word: gladius dispersit
  choice: das Schwert wird ... zerstreuen
  rationale: „dispergere“ bedeutet „zerstreuen“. Das lateinische Perfekt „dispersit“ steht spannungsvoll neben dem futurischen Zusammenhang; entsprechend der prophetischen Zukunftsaussage wird es im Deutschen futurisch wiedergegeben, während die lexikalische Bedeutung erhalten bleibt.
- source_word: quae superaverint a fame
  choice: die die Hungersnot überlebt haben
  rationale: Idiomatiche Wiedergabe derjenigen, die von der Hungersnot übrig geblieben bzw. ihr entkommen sind; das neutrale „quae“ wird auf Personen bezogen.
theological_decisions: []
