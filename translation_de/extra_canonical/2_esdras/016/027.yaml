source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et uva tradet se ad vindemiam, et quis adligabit eam? erit enim etlocis desertio multa.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/027.yaml
  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: de
  text: Die Weintraube wird sich zur Lese darbieten, und wer wird sie einbringen?[a] Denn mancherorts wird große Verödung herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und wer wird sie fest- oder zusammenbinden?“ Gemeint sein kann das Sammeln beziehungsweise Einbringen der Trauben.'
    reason: Das lateinische „adligabit“ bezeichnet grundsätzlich ein Binden; seine konkrete Bedeutung im Zusammenhang der Weinlese ist nicht völlig eindeutig.
lexical_decisions:
- source_word: uva
  choice: Weintraube
  rationale: Bezeichnet hier die Traube als Erntegut; „Weintraube“ macht den Bezug zur anschließenden Weinlese im Deutschen unmittelbar verständlich.
- source_word: tradet se ad vindemiam
  choice: wird sich zur Lese darbieten
  rationale: Bewahrt die auffällige Personifikation und gibt die Zweckrichtung von „ad vindemiam“ natürlich wieder, ohne den Ausdruck auf bloßes Reifen zu reduzieren.
- source_word: adligabit eam
  choice: wird sie einbringen
  rationale: Das Verb bedeutet wörtlich „(fest-/zusammen)binden“. Im Erntezusammenhang liegt das Sammeln beziehungsweise Einbringen der Traube nahe; die Fußnote hält den wörtlichen Sinn offen.
- source_word: locis desertio multa
  choice: mancherorts wird große Verödung herrschen
  rationale: Gibt die örtlich auftretende, umfangreiche Verödung in idiomatischem Deutsch wieder, ohne aus „locis“ ausdrücklich „viele Orte“ zu machen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Personifikation der Weintraube bleibt erhalten; ungewöhnliche Quellensprache wird nicht unnötig geglättet.
