  source_fidelity: 'Der deutsche Vers gibt den für 2 Esdras 16,16 maßgeblichen Vergleich präzise wieder: »sagitta missa a sagittario valido« entspricht idiomatisch einem von einem kräftigen Bogenschützen abgeschossenen Pfeil, und die zweimalige Verneinung von »reverti« bleibt erhalten. »mala« wird angemessen offen und im Plural als »Übel« wiedergegeben. Der im gelieferten lateinischen Ausschnitt vorangestellte Satzteil »donec consumat fundamenta terrae« gehört sachlich zum vorausgehenden Satz bzw. Vers; die englische Audit-Fassung und die deutsche Übersetzung betreffen zutreffend den anschließenden Pfeilvergleich.'
