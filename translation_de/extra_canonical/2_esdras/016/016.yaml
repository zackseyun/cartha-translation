  terminology: »Übel« wahrt die breite Bedeutung von »mala«, ohne die Aussage auf eine bestimmte Art von Unheil oder auf eine konfessionell bestimmte Deutung festzulegen. »über die Erde gesandt« entspricht dem durch den Kontext und die englische Audit-Fassung bezeugten Abschluss des im Zitat abgebrochenen Relativsatzes.
