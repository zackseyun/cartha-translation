source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: donec consumat fundamenta terrae. Quemadmodum non redit sagitta missa a sagittario ualido, sic non reuertentur mala quae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: de
  text: Wie ein Pfeil, den ein kräftiger Bogenschütze abgeschossen hat, nicht zurückkehrt, so werden auch die Übel, die über die Erde gesandt worden sind, nicht zurückkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Textausschnitt bricht nach »die« ab; der Abschluss des Relativsatzes folgt dem durch den Zusammenhang und die konsultierte englische Textfassung bezeugten Wortlaut.
    reason: Macht transparent, dass die im Deutschen notwendige Vervollständigung des Relativsatzes im bereitgestellten lateinischen Ausschnitt nicht vollständig erhalten ist.
lexical_decisions:
- source_word: sagitta missa a sagittario ualido
  choice: ein Pfeil, den ein kräftiger Bogenschütze abgeschossen hat
  rationale: Gibt das Bild konkret und in natürlichem modernem Deutsch wieder; »kräftig« bewahrt die Bedeutung von »ualido«, ohne dem Schützen eine zusätzliche Wertung zuzuschreiben.
- source_word: mala
  choice: die Übel
  rationale: Bewahrt den Plural und die absichtlich weite Bedeutung des lateinischen Ausdrucks, der sowohl Katastrophen als auch anderes Unheil bezeichnen kann.
- source_word: non reuertentur
  choice: nicht zurückkehren
  rationale: Entspricht der Wiederholung des Verbs aus dem Pfeilvergleich und erhält die pointierte Parallelität.
theological_decisions:
- issue: Art und Urheber der angekündigten Übel
  choice: Die allgemeine Formulierung »die Übel, die über die Erde gesandt worden sind« wird beibehalten.
  alternative: Die Übel ausdrücklich als göttliche Strafgerichte oder Plagen bezeichnen.
  rationale: Der Versausschnitt nennt den Urheber nicht ausdrücklich und verwendet das allgemeine »mala«; eine engere theologische Deutung wäre eine nicht im Wortlaut begründete Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Der wiederholte Ausdruck »nicht zurückkehren« erhält die Bildlogik des lateinischen Vergleichs; »Übel« wahrt dessen semantische und theologische Offenheit.
