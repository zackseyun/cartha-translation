  text: Audite uerbum, plebs mea, parate uos in pugnam et in malis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: de
  text: Hört das Wort, mein Volk! Bereitet euch auf den Kampf vor und seid in Bedrängnissen wie Fremde auf der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte lateinische Wortlaut bricht nach „in malis“ („in Bedrängnissen“/„in Übeln“) syntaktisch unvollständig ab. Der Satzschluss „wie Fremde auf der Erde“ folgt der vollständigeren Textgestalt, die auch dem englischen Audit-Text zugrunde liegt.
    reason: 'Textkritische Transparenz: Der Satzschluss steht nicht im mitgelieferten lateinischen Ausschnitt.'
lexical_decisions:
- source_word: Audite uerbum
  choice: Hört auf das Wort
  rationale: „Audite“ fordert nicht nur akustisches Hören, sondern aufmerksames Beachten; „auf das Wort hören“ gibt diesen Aufforderungscharakter natürlich wieder.
- source_word: plebs mea
  choice: mein Volk
  rationale: „Volk“ ist im Deutschen die natürliche und würdige Anrede; „meine Volksmenge“ wäre zu wörtlich und unidiomatisch.
- source_word: parate uos in pugnam
  choice: Macht euch bereit zum Kampf
  rationale: Gibt die reflexive Aufforderung und den militärischen Sinn von „pugna“ klar und unmittelbar wieder.
- source_word: in malis
  choice: in all dem Unheil
  rationale: Das substantivierte Pluralwort „malis“ kann Übel, Nöte oder schlimme Ereignisse bezeichnen. „In all dem Unheil“ bewahrt die Weite des Ausdrucks und klingt im Deutschen natürlich.
- source_word: sicut advenae terrae (im vollständigen, durch die Konsultationsschicht bezeugten Satzschluss)
  choice: wie Fremde auf der Erde
  rationale: „Fremde“ bewahrt das Bild von Menschen, die nicht dauerhaft ansässig sind, ohne es enger als „Pilger“ religiös auszudeuten.
theological_decisions:
- issue: Bedeutung des Fremdseins auf der Erde
  choice: wie Fremde auf der Erde
  alternative: wie Pilger auf der Erde
  rationale: „Fremde“ lässt offen, ob vor allem Nichtzugehörigkeit, Vorläufigkeit oder Wanderschaft gemeint ist. „Pilger“ würde stärker eine ausdrücklich religiöse Reisevorstellung eintragen.
translation_notes:
  register: Moderne, klare und zugleich eindringliche Mahnrede. Die kurzen Imperative bewahren den feierlichen Ernst des lateinischen Textes; „Unheil“ und „Fremde“ vermeiden sowohl unnötige Altertümlichkeit als auch konfessionelle Überdeutung.
