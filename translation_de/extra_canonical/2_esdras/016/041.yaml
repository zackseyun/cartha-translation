  source_fidelity: Die Imperative und die Anrede sind zutreffend wiedergegeben. „in all dem Unheil“ verstärkt jedoch den bloßen Plural „in malis“ durch „all dem“ und fasst ihn zugleich stärker kollektiv. „in Bedrängnissen“ gibt die offene Pluralbedeutung von malis idiomatisch wieder. Der Satzschluss ist im vorgelegten lateinischen Ausschnitt nicht enthalten, entspricht aber dem englischen Audit-Text und der im Entwurf dokumentierten vollständigeren Textgestalt.
  naturalness: Die Mahnrede ist klar und modern. „Hört das Wort“ ist als knappe prophetische Anrede unmittelbarer als „Hört auf das Wort“ und vermeidet eine mögliche Verschiebung von der Botschaft zum bloßen Aufmerken. „Bereitet euch auf den Kampf vor“ ist standardsprachlich und präzise.
  terminology: „Volk“, „Kampf“, „Bedrängnissen“ und „Fremde“ wahren den eindringlichen Registerton und vermeiden konfessionell einengende Auslegung. „Fremde“ erhält die offene Bildlichkeit von advenae besser als „Pilger“.
