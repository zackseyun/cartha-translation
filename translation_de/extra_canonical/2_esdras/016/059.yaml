  text: He who hung the earth upon the water by his word[a], and stretched out the heaven like a vault;
translation:
  language: de
  text: der die Erde durch sein Wort über dem Wasser aufgehängt und den Himmel wie ein Gewölbe ausgespannt hat;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super aquam
  choice: über dem Wasser
  rationale: Gibt den lateinischen Singular aquam wieder und bewahrt das räumliche Bild.
- source_word: uerbo suo
  choice: durch sein Wort
  rationale: Drückt das Mittel der Schöpfungshandlung natürlich und quellennah aus.
- source_word: extendit
  choice: ausgespannt hat
  rationale: Entspricht dem kosmischen Bild des Ausbreitens bzw. Ausspannens des Himmels.
- source_word: caelum quasi cameram
  choice: den Himmel wie ein Gewölbe
  rationale: camera bezeichnet hier bildhaft einen gewölbten Raum bzw. eine gewölbte Decke; „Gewölbe“ ist im Deutschen prägnant und würdevoll.
theological_decisions:
- issue: Fortlaufender Relativsatz im Lobpreis
  choice: Beginn mit „der“ und Abschluss mit „hat“
  alternative: 'Ein selbstständiger Satz: „Er hängte …“'
  rationale: Das lateinische Qui setzt die Folge von Relativsätzen fort und bezieht die Schöpfungsaussage auf den zuvor genannten Herrn; diese syntaktische Verbindung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmischen Bilder werden konkret bewahrt; der Satz bleibt als Relativsatz bewusst vom vorausgehenden Kontext abhängig.
