  text: No farmer will be left to till the earth and to sow it[a].
translation:
  language: de
  text: Kein Bauer wird übrig bleiben, der den Boden bestellt und ihn besät.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: agricola
  choice: Bauer
  rationale: Das lateinische Substantiv bezeichnet ausdrücklich einen Bauern bzw. Landwirt; die konkrete Bezeichnung wird gegenüber einer Verallgemeinerung wie „niemand“ bewahrt.
- source_word: derelinquetur
  choice: wird übrig bleiben
  rationale: Die passive Form bezeichnet hier, dass jemand nach den angekündigten Verwüstungen zurück- bzw. übrig bleibt.
- source_word: colit terram
  choice: den Boden bestellt
  rationale: „Den Boden bestellen“ ist die natürliche landwirtschaftliche Wiedergabe von colere terram.
- source_word: seminat eam
  choice: ihn besät
  rationale: Das Pronomen eam greift terram auf; im Deutschen verweist „ihn“ entsprechend auf „den Boden“.
