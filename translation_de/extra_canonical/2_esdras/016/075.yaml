  source_fidelity: 'Die Übersetzung gibt den lateinischen Text vollständig und treffend wieder: „Hört“ für audite, „meine Erwählten“ für electi mei, „spricht der Herr“ für dicit dominus, „Seht“ für ecce, „sind da“ für adsunt, „Tage der Bedrängnis“ für dies tribulationis, „aus ihnen werde ich euch erretten“ für et de his liberabo vos sowie „Fürchtet euch nicht und zögert nicht“ für ne timeatis nec haesitemini. Die Anschlussform des abschließenden Kommas entspricht dem Quellenausschnitt.'
  naturalness: Das Deutsch ist modernes Standarddeutsch und bewahrt angemessen den gehobenen, prophetisch-apokalyptischen Ton. Wortstellung, Anrede und Imperative sind idiomatisch. „Sind da“ trifft die präsentische Dringlichkeit von adsunt natürlicher als eine bloße Näheformulierung.
  terminology: „Erwählten“, „Bedrängnis“ und „erretten“ sind kontextgerecht und theologisch nicht überbestimmt. Besonders „aus ihnen“ bewahrt die Offenheit von de his hinsichtlich der Art der Befreiung.
