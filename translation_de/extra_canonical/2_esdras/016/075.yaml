  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite, electi mei, dicit dominus, ecce adsunt dies tribulationis, et de his liberabo uos. Ne timeatis nec haesitemini,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: de
  text: 'Hört, meine Erwählten, spricht der Herr: Seht, die Tage der Bedrängnis sind da, und aus ihnen werde ich euch erretten. Fürchtet euch nicht und zögert nicht,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electi mei
  choice: meine Erwählten
  rationale: Gibt die direkte Anrede und den Erwählungsbegriff des lateinischen Textes präzise und in würdigem, verständlichem Deutsch wieder.
- source_word: ecce
  choice: Seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Imperativ, ohne ihn durch das heute unnatürliche „siehe“ wiederzugeben.
- source_word: adsunt
  choice: sind da
  rationale: Drückt die Gegenwart beziehungsweise das unmittelbare Eingetretensein der Bedrängnistage aus, nicht bloß ihre Nähe.
- source_word: tribulationis
  choice: der Bedrängnis
  rationale: Bewahrt die Bedeutung schwerer äußerer Not und passt zum feierlichen apokalyptischen Register.
- source_word: liberabo uos
  choice: werde ich euch erretten
  rationale: Gibt die zugesagte künftige Befreiung mit einem in biblischem Kontext natürlichen und zugleich verständlichen Verb wieder.
- source_word: haesitemini
  choice: zögert
  rationale: Erfasst den Aufruf, angesichts der Not nicht unschlüssig oder zaghaft zu werden; die mediale Form wird im Deutschen idiomatisch wiedergegeben.
theological_decisions:
- issue: Art der Erwählung
  choice: „meine Erwählten“ ohne nähere Bestimmung
  alternative: „meine Auserwählten“ oder eine inhaltliche Identifizierung der Angeredeten
  rationale: Der Vers bezeichnet die Angeredeten als electi, erklärt aber weder Grundlage noch Reichweite ihrer Erwählung; diese Offenheit bleibt erhalten.
- issue: Rettung aus den Tagen der Bedrängnis
  choice: „aus ihnen werde ich euch erretten“
  alternative: „vor ihnen werde ich euch bewahren“ oder „durch sie hindurch werde ich euch retten“
  rationale: Die Formulierung hält sich an de his und legt nicht fest, ob die Befreiung Vermeidung, Bewahrung innerhalb der Not oder Herausführung bedeutet.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht feierlichem Ton. Der Doppelpunkt nach der Redeeinleitung und die imperativischen Kurzsätze bewahren den eindringlichen Charakter. Das abschließende Komma bleibt stehen, da der überlieferte Versausschnitt syntaktisch in den folgenden Text weiterführt.
