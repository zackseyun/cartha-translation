  source_fidelity: Die Übersetzung gibt die im überlieferten Kontext erkennbare Frageform mit „In his“ sowie das kommende „malorum“ sinngemäß und ohne unzulässige Präzisierung wieder. „Unheil“ ist als deutsches Kollektivwort eine angemessene Wiedergabe für die bedrohlichen Übel; die lateinische Pluralform wird dadurch nicht sachlich eingeschränkt. Der vorgelegte lateinische Ausschnitt ist am Versende bzw. -anfang fragmentarisch, liefert aber keinen Anlass, vom auditierbaren englischen Wortlaut abzuweichen.
