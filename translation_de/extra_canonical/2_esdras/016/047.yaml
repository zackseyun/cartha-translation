source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: de
  text: Sie mühen sich ab; denn Fremde werden ihre Früchte ernten, ihren Besitz rauben, ihre Häuser zerstören und ihre Kinder gefangen wegführen, weil sie ihre Kinder in Gefangenschaft und Hungersnot zeugen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborant
  choice: Sie mühen sich ab
  rationale: Gibt das Präsens von laborare natürlich wieder und bewahrt den im überlieferten Versanfang stehenden Satzrest.
- source_word: alienigenae
  choice: Fremde
  rationale: Bezeichnet Menschen fremder Herkunft; „Fremde“ ist im Kontext natürlicher und weniger staatsrechtlich geprägt als „Ausländer“.
- source_word: Fructus ... metent
  choice: ihre Früchte ernten
  rationale: Bewahrt das konkrete Bild und die Verbindung von fructus mit metere.
- source_word: substantiam ... rapient
  choice: ihren Besitz rauben
  rationale: Substantia bezeichnet hier die Habe beziehungsweise den Besitz; rapere drückt gewaltsames Wegnehmen aus.
- source_word: domus euertent
  choice: ihre Häuser zerstören
  rationale: Euertere bedeutet bei Gebäuden niederreißen, verwüsten oder zerstören; „umstürzen“ wäre im Deutschen ein unnatürlicher Latinismus.
- source_word: filios eorum captiuabunt
  choice: ihre Kinder gefangen wegführen
  rationale: Captivare bezeichnet hier die Gefangennahme und Verschleppung; „Kinder“ gibt filii im allgemeinen familiären Sinn angemessen wieder.
- source_word: generant natos suos
  choice: ihre Kinder ... zeugen
  rationale: Bewahrt das auffällige Präsens und den Zeugungsaspekt von generare, ohne die Aussage durch eine freiere Umschreibung aufzulösen.
theological_decisions:
- issue: Zeitform im Begründungssatz
  choice: 'Präsens: „zeugen“'
  alternative: 'Futur oder umschrieben: „zur Welt bringen werden“'
  rationale: Das Latein wechselt ausdrücklich von Futurformen zu generant im Präsens; dieser Spannungswechsel bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harten Folgen werden in einer klaren Reihung wiedergegeben. Der überlieferte Versanfang „laborant“ wird nicht ausgelassen; der semantisch klare Gebäudekontext von „euertere“ wird idiomatisch mit „zerstören“ übersetzt.
