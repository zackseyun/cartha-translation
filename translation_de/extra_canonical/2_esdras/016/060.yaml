  text: super aquas fundauit eum; Qui posuit in deserto fontes aquarum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/060.yaml
  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: de
  text: Er spannte den Himmel wie ein Gewölbe aus und gründete ihn über den Wassern; er ließ in der Wüste Wasserquellen entspringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super aquas fundauit eum
  choice: gründete ihn über den Wassern
  rationale: „eum“ nimmt den im unmittelbar vorausgehenden Satzteil genannten Himmel wieder auf; „super“ wird räumlich mit „über“ wiedergegeben, ohne das kosmologische Bild weiter auszudeuten.
- source_word: posuit in deserto fontes aquarum
  choice: ließ in der Wüste Wasserquellen entspringen
  rationale: Die natürliche deutsche Wendung gibt das Setzen beziehungsweise Hervorbringen von Wasserquellen wieder; „Wasserquellen“ bewahrt die ausdrückliche Nennung von „aquarum“.
- source_word: sicut cameram
  choice: wie ein Gewölbe
  rationale: Der im konsultierten vollständigen Vers erhaltene Vergleich bezeichnet hier einen gewölbten Raum beziehungsweise eine gewölbte Decke; „Gewölbe“ ist im Deutschen anschaulich und würdig.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Klang. Das Semikolon wahrt die Reihung der lateinischen Gottesprädikationen; das wiederholte „er“ macht den Anschluss im Deutschen natürlich.
