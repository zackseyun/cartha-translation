  source_fidelity: 'Der Entwurf gibt die Abfolge und Aussage des lateinischen Textes zuverlässig wieder: futurisches Passiv bei „proicientur“, der harte Vergleich „quasi stercora“, das präsente „non habent“, die nicht-kausale Reihung mit „et“ sowie die Verwüstung von Land und Städten. „Erde“ ist möglich, doch „Land“ ist bei der Verbindung mit dessen Städten im Deutschen konkreter und für „terra“ ebenso gedeckt.'
  naturalness: „Hinausgeworfen werden“ ist verständlich, klingt ohne einen genannten Ausgangsort jedoch weniger idiomatisch als „weggeworfen werden“. Die Doppelung von „werden“ ist als Zukunftspassiv nicht falsch, aber die Stellung mit dem Partizip vor dem finalen Hilfsverb ist flüssiger.
  terminology: „Mist“ bewahrt die drastische Konkretheit von „stercora“. „Zerstört“ ist eine zulässige moderne Wiedergabe von „demolientur“ und muss nicht durch das baulich engere „abgerissen“ ersetzt werden. Der Präsenswechsel bei „sie haben“ soll erhalten bleiben.
