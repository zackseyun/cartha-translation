source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et mortui quasi stercora proicientur, et non habent qui consolentur eos. et derelinquetur deserta terra, et civitates eius demolientur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: de
  text: Und die Toten werden wie Mist weggeworfen, und sie haben niemanden, der sie tröstet. Und das Land wird öde zurückgelassen, und seine Städte werden zerstört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: stercora
  choice: Mist
  rationale: Gibt den drastischen Vergleich des lateinischen Ausdrucks unmittelbar und verständlich wieder.
- source_word: proicientur
  choice: hinausgeworfen werden
  rationale: Bewahrt sowohl das gewaltsame Wegwerfen als auch die passive Zukunftsform.
- source_word: terra
  choice: Erde
  rationale: Entspricht dem weiten Bezug des Kontextes und stimmt mit dem grammatischen Femininum des anschließenden Possessivbezugs überein.
- source_word: demolientur
  choice: zerstört werden
  rationale: Natürliches modernes Deutsch für die passive Zerstörung ganzer Städte; enger bauliche Wiedergaben wie „abgerissen“ klingen bei Städten weniger idiomatisch.
theological_decisions:
- issue: Tempuswechsel bei „non habent“ zwischen Futurformen
  choice: „sie haben niemanden“ im Präsens
  alternative: „sie werden niemanden haben“ zur Angleichung an den Zukunftskontext
  rationale: Das lateinische „non habent“ ist ausdrücklich Präsens. Der Tempuswechsel wird als mögliche rhetorische Vergegenwärtigung bewahrt und nicht stillschweigend geglättet.
- issue: Verknüpfung des letzten Satzteils
  choice: Koordination mit „Und“
  alternative: kausale Verbindung mit „denn“
  rationale: Das lateinische „et“ bezeichnet hier keine ausdrückliche Begründung; eine kausale Deutung würde dem Text eine nicht markierte Beziehung hinzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildschärfe. Die wiederholten Passivformen folgen dem feierlich-prophetischen Charakter des lateinischen Textes; der auffällige Präsenswechsel bleibt erhalten.
