    rationale: Lateinisch „proicientur“ bezeichnet hier allgemein ein gewaltsames Wegwerfen bzw. Fortwerfen; „weggeworfen“ ist im Deutschen idiomatischer, ohne die Aussage einzuengen.
  - severity: low
    issue: „Erde“ ist in der Verbindung mit „ihre Städte“ etwas abstrakt.
    rationale: „Land“ gibt „terra“ in diesem Verwüstungs- und Städtebezug natürlich wieder, ohne den Umfang des Bezugs wesentlich zu verändern.
