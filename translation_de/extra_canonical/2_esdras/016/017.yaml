  text: Woe is me, woe is me! Who will deliver me in those days?
translation:
  language: de
  text: Weh mir, weh mir! Wer wird mich retten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text enthält hier keine ausdrückliche Zeitangabe; „in jenen Tagen“ wird in manchen Wiedergaben sinngemäß aus dem Zusammenhang ergänzt.
    reason: Macht transparent, warum die in der englischen Konsultationsfassung enthaltene Zeitangabe nicht in den Haupttext übernommen wurde.
lexical_decisions:
- source_word: Vae mihi
  choice: Weh mir
  rationale: Gibt den lateinischen Weheruf knapp, würdevoll und im Deutschen idiomatisch wieder; die Wiederholung bleibt erhalten.
- source_word: quis me liberabit
  choice: Wer wird mich retten?
  rationale: Bewahrt Frageform, Zukunftsbezug und die persönliche Bedrohung. »Retten« ist hier natürlicher als »befreien«, ohne genauer festzulegen, welcher Art die Gefahr ist.
theological_decisions:
- issue: Nicht ausdrücklich genannter Zeitpunkt der Rettung
  choice: Keine Zeitangabe im Haupttext ergänzt
  alternative: „Wer wird mich in jenen Tagen retten?“
  rationale: Der überlieferte lateinische Wortlaut enthält keine Entsprechung für „in jenen Tagen“. Die kontextuell mögliche Ergänzung wird daher nicht stillschweigend in den Text aufgenommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit der würdevollen, auch heute geläufigen Klageformel „Weh mir“. Der abgebrochene Satzteil „missa fuerint in terram“ gehört dem vorangehenden Kontext an und wird nicht in Vers 17 aufgenommen.
