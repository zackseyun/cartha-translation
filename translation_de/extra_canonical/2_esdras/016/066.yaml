source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: de
  text: Ihr werdet beschämt sein, wenn eure Sünden vor den Menschen ans Licht treten und eure Ungerechtigkeiten an jenem Tag als Ankläger auftreten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: Ihr werdet beschämt dastehen
  rationale: Gibt den zukünftigen Zustand öffentlicher Beschämung natürlich und würdevoll wieder.
- source_word: processerint
  choice: ans Licht treten
  rationale: Bewahrt das Bild des Hervortretens und macht im Deutschen die öffentliche Offenlegung der Sünden deutlich, ohne den Sinn zu überdeuten.
- source_word: iniquitates
  choice: Verfehlungen
  rationale: Bezeichnet schuldhaftes Unrecht in allgemein verständlicher, nicht konfessionell geprägter Sprache.
- source_word: accusatores stabunt
  choice: als Ankläger dastehen
  rationale: Erhält sowohl die Personifikation der Verfehlungen als auch das wiederholte Motiv des Dastehens.
theological_decisions:
- issue: Personifikation der Verfehlungen im Gericht
  choice: eure Verfehlungen ... als Ankläger dastehen
  alternative: eure Verfehlungen werden euch anklagen
  rationale: Die gewählte Fassung bewahrt näher die ungewöhnliche Quellkonstruktion, in der die Verfehlungen selbst als Ankläger dastehen, statt sie in eine bloße verbale Aussage umzuwandeln.
translation_notes:
  register: Feierlich-apokalyptischer, zugleich moderner und gut verständlicher Standardstil. Die öffentliche Bloßstellung und die gerichtliche Personifikation bleiben erhalten. Das im überlieferten Ausschnitt anschließende „Quid“ gehört offenbar zum nächsten Satz und wurde daher nicht aufgenommen.
