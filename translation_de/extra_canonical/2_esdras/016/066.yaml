  to: Ihr werdet beschämt sein, wenn eure Sünden vor den Menschen ans Licht treten und eure Ungerechtigkeiten an jenem Tag als Ankläger auftreten.
  rationale: Die Revision bewahrt die öffentliche Entlarvung und die gerichtliche Personifikation, gibt iniquitates gewichtiger wieder und glättet eine im Deutschen unmotivierte Wiederholung. Der überlieferte Satzanfang „Quid“ gehört zum folgenden Zusammenhang und wird nicht in diesen Vers aufgenommen.
