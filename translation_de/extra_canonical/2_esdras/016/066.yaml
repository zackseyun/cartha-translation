  verdict: revise
  source_fidelity: 'Die Grundstruktur ist zutreffend: zukünftige Beschämung, öffentliches Hervortreten der Sünden und die Personifikation der iniquitates als Ankläger am Gerichtstag bleiben erhalten. „Verfehlungen“ ist für iniquitates jedoch zu abgeschwächt; zudem gibt „auftreten“ die forensische Rolle der Ankläger im Deutschen natürlicher wieder als das zweite „dastehen“.'
  naturalness: Der Entwurf ist insgesamt gut verständlich und angemessen feierlich. Die Wiederholung von „dastehen“ wirkt jedoch im Deutschen unnötig schwerfällig, da confusi eritis kein eigenes Motiv des Stehens ausdrückt.
  terminology: „Sünden“ für peccata ist treffend. Für iniquitates ist „Ungerechtigkeiten“ näher am Gewicht des lateinischen Begriffs als „Verfehlungen“ und im apokalyptisch-gerichtlichen Register vertretbar.
  issues:
  - severity: medium
    issue: „Verfehlungen“ schwächt iniquitates ab.
    rationale: Iniquitates bezeichnet nicht bloß Fehltritte oder allgemeine Verfehlungen, sondern schuldhaftes Unrecht bzw. Ungerechtigkeiten. Die Unterscheidung von peccata und iniquitates sollte nicht durch eine zu milde Wiedergabe eingeebnet werden.
  - severity: low
    issue: Das zweite „dastehen“ ist stilistisch unnatürlich.
    rationale: Für accusatores stabunt ist „als Ankläger auftreten“ im Deutschen idiomatischer und bewahrt die gerichtliche Personifikation. Das erste „beschämt dastehen“ ist zwar möglich, bildet aber kein im lateinischen Text angelegtes Wiederholungsmotiv.
  revised_text: Ihr werdet beschämt sein, wenn eure Sünden vor den Menschen ans Licht treten und eure Ungerechtigkeiten an jenem Tag als Ankläger auftreten.
