source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: medio corporis, et misit ei spiritum et uitam et intellectum, Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/062.yaml
  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: de
  text: Er bildete den Menschen, setzte ihm das Herz in die Mitte seines Körpers und gab ihm Geist, Leben und Verstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ kann hier auch den Atem oder Lebensatem bezeichnen.
    reason: Die Bedeutungsbreite von lateinisch spiritus lässt sich im Haupttext nicht vollständig mit einem einzigen deutschen Wort abbilden.
lexical_decisions:
- source_word: medio corporis
  choice: mitten in den Körper
  rationale: Gibt die räumliche Aussage des lateinischen Ausdrucks natürlich und anschaulich wieder.
- source_word: misit ei
  choice: gab ihm
  rationale: Das wörtliche „sandte ihm“ wäre im Deutschen in Verbindung mit Geist, Leben und Verstand unnatürlich; „gab ihm“ bewahrt hier den gemeinten Vorgang.
- source_word: spiritum
  choice: Geist
  rationale: Bewahrt die breite Bedeutung von lateinisch spiritus; je nach Kontext kann auch der Lebensatem mitgemeint sein.
- source_word: uitam
  choice: Leben
  rationale: Direkte und idiomatische Entsprechung zu vita.
- source_word: intellectum
  choice: Verstand
  rationale: Bezeichnet das dem Menschen verliehene Denk- und Erkenntnisvermögen in allgemein verständlichem Deutsch.
theological_decisions:
- issue: Bedeutungsumfang von spiritum
  choice: Geist
  alternative: Atem / Lebensatem
  rationale: „Geist“ hält die anthropologische und möglicherweise theologische Weite des lateinischen Begriffs offen, ohne ihn ausschließlich auf den Atemvorgang festzulegen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Reihung „Geist, Leben und Verstand“ folgt der lateinischen Struktur. Der Anfang des Satzes wird entsprechend dem vollständigen Verszusammenhang wiedergegeben, da der bereitgestellte lateinische Ausschnitt erst bei „medio corporis“ einsetzt.
