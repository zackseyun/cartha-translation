  source_fidelity: 'Die Fassung gibt den überlieferten lateinischen Text im Wesentlichen zutreffend wieder: „gab“ ist für misit ... et idiomatisch vertretbar, und die Dreierreihe spiritum et uitam et intellectum bleibt erhalten. „Mitten in den Körper“ verfehlt jedoch die syntaktische und semantische Beziehung von medio corporis: Gemeint ist die Mitte des Körpers, nicht eine Bewegung bzw. Platzierung in den Körper hinein.'
