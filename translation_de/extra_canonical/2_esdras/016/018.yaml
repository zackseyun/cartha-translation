source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: de
  text: 'In jenen Tagen[a]: der Anfang der Schmerzen und viel Seufzen, der Anfang der Hungersnot und viele werden umkommen, der Anfang der Kriege und sie werden sich fürchten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Fragezeichen nach „in illis diebus“ in der lateinischen Vorlage weist auf eine mögliche textkritische oder editorische Unsicherheit dieser einleitenden Worte hin.
    reason: Die Anmerkung erklärt das editionsbedingte Fragezeichen, ohne die Worte als gewöhnliche inhaltliche Frage zu verstehen oder ihre mögliche Unsicherheit zu verschleiern.
lexical_decisions:
- source_word: in illis diebus
  choice: In jenen Tagen
  rationale: Entspricht der lateinischen Zeitangabe in natürlichem, würdigem Deutsch.
- source_word: Initium dolorum
  choice: der Anfang der Schmerzen
  rationale: Bewahrt die allgemeine und möglicherweise endzeitlich zugespitzte Bedeutung von dolor, ohne sie enger als etwa »Wehen« auszulegen.
- source_word: multi gemitus
  choice: viel Seufzen
  rationale: Gibt den pluralischen lateinischen Ausdruck idiomatisch als kollektives Geschehen wieder; »viele Seufzer« wäre ebenfalls möglich, klingt hier jedoch weniger natürlich.
- source_word: famis
  choice: der Hungersnot
  rationale: Bezeichnet nicht bloß persönlichen Hunger, sondern eine allgemeine Notlage.
- source_word: multi interient
  choice: viele werden umkommen
  rationale: Gibt interire sachgerecht wieder, ohne eine bestimmte Todesursache einzutragen.
- source_word: formidabunt
  choice: sie werden sich fürchten
  rationale: Das lateinische Verb nennt kein ausdrückliches Subjekt. Das Pronomen wahrt diese Unbestimmtheit, statt etwa »die Herrscher« einzufügen.
theological_decisions:
- issue: Deutung von »dolores«
  choice: Schmerzen
  alternative: Wehen
  rationale: »Schmerzen« wahrt den breiteren Wortsinn und legt keine besondere Geburtswehen- oder Endzeitmetaphorik fest.
- issue: Unausgesprochenes Subjekt von »formidabunt«
  choice: sie werden sich fürchten
  alternative: die Herrscher werden sich fürchten
  rationale: Im bereitgestellten lateinischen Text steht kein Substantiv wie »potestates«; ein bestimmtes Personenkollektiv darf daher nicht ergänzt werden.
- issue: Zusätzlicher Schlusssatz der englischen Konsultationsfassung
  choice: nicht aufgenommen
  alternative: »der Anfang der Übel, und alle werden zittern«
  rationale: Dieser Satz fehlt in dem als maßgeblich bereitgestellten lateinischen Ausgangstext. Die Übersetzung folgt daher der vorliegenden Originalsprachenevidenz und ergänzt ihn nicht aus der englischen Fassung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Rhythmus. Die dreifache Folge »der Anfang …« bewahrt die markante Parallelstruktur des Lateinischen. Es wurde nichts aus der längeren englischen Konsultationsfassung ergänzt, was im bereitgestellten lateinischen Text nicht belegt ist.
