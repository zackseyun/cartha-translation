  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: de
  text: So werden auch die Übel nicht zögern, über die Erde hereinzubrechen; und das Zeitalter[a] wird stöhnen, und Schmerzen umgeben es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Welt.'
    reason: Lateinisch saeculum kann sowohl ein Zeitalter als auch die Welt beziehungsweise Weltordnung bezeichnen.
lexical_decisions:
- source_word: mala
  choice: die Übel
  rationale: Bewahrt den Plural und den umfassenden Sinn von Unheil beziehungsweise bösen Widerfahrnissen.
- source_word: non morabuntur ... ad prodiendum
  choice: werden nicht zögern, ... hereinzubrechen
  rationale: Gibt die ausbleibende Verzögerung und das Hervortreten der angekündigten Übel in natürlichem, eindringlichem Deutsch wieder.
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bewahrt den zeitlich-kosmischen Sinn des lateinischen Begriffs, ohne ihn stillschweigend auf „Welt“ festzulegen.
- source_word: circumtenent
  choice: werden ... umringen
  rationale: Entspricht dem Bild des ringsum Umgebens und wahrt die personifizierende Bildsprache.
theological_decisions:
- issue: Bedeutungsumfang von saeculum
  choice: das Zeitalter
  alternative: die Welt
  rationale: „Zeitalter“ hält die apokalyptische zeitliche Dimension offen; eine Fußnote nennt die ebenfalls mögliche räumlich-kosmische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Personifikation. Das vorangestellte „uno puncto“ wird als Abschluss des vorausgehenden Satzes beziehungsweise Verses verstanden, entsprechend der konsultierten Versabgrenzung.
