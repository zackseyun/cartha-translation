  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: de
  text: Ich habe mich im Dornbusch offenbart und zu Mose gesprochen, als mein Volk in Ägypten dienen musste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: Ich habe mich … offenbart
  rationale: Die figura etymologica ist wahrscheinlich semitisch geprägte Übersetzungssprache mit verstärkender Wirkung. Im natürlichen Deutschen vermittelt „offenbart“ den Gedanken klar; eine wörtliche Verdopplung wäre unidiomatisch.
- source_word: super rubum
  choice: im Dornbusch
  rationale: „rubus“ bezeichnet den Busch der Mose-Erzählung, traditionell und kontextgemäß einen Dornbusch. Das lateinische „super“ wird hier idiomatisch als Ort der Erscheinung wiedergegeben.
- source_word: locutus sum Moysi
  choice: zu Mose gesprochen
  rationale: „Moysi“ ist Dativ; die natürliche deutsche Konstruktion lautet „zu Mose sprechen“.
- source_word: seruiebat in Aegypto
  choice: in Ägypten dienen musste
  rationale: „servire“ heißt zunächst „dienen“, bezeichnet im Exoduskontext jedoch erzwungenen Dienst. „dienen musste“ bewahrt die Grundbedeutung und macht den Zwang verständlich, ohne stärker als nötig „versklavt“ zu formulieren.
theological_decisions:
- issue: Emphase in „Reuelans reuelatus sum“
  choice: Keine zusätzliche deutsche Verstärkung im Haupttext
  alternative: „Ich habe mich wahrhaftig/offenkundig offenbart“
  rationale: Die Doppelung kann eine emphatische semitische Konstruktion spiegeln, doch ihr genauer Stärkegrad ist unsicher. Eine ausdrücklich bekräftigende Partikel könnte die Aussage im Deutschen überzeichnen; die natürliche Form bewahrt den Offenbarungsanspruch.
- issue: Art der Erscheinung am Dornbusch
  choice: „im Dornbusch“
  alternative: „über dem Dornbusch“ oder „beim Dornbusch“
  rationale: Die Formulierung knüpft erkennbar an die Gotteserscheinung in Exodus 3 an. „im Dornbusch“ ist die natürliche deutsche Wiedergabe, ohne die genaue räumliche oder metaphysische Art der Erscheinung weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng am lateinischen Wortlaut, vermeidet jedoch unnatürliche Übersetzungssprache. „Mose“ folgt der heute üblichen deutschen Namensform.
