  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: de
  text: Darum bring jetzt dein Haus in Ordnung, weise dein Volk zurecht, tröste die Demütigen unter ihnen und sage dich jetzt vom vergänglichen Leben los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom verdorbenen Leben“. Das lateinische Wort kann sowohl ein dem Verfall unterworfenes als auch ein verdorbenes Leben bezeichnen.'
    reason: Bewahrt die mögliche lexikalische Mehrdeutigkeit von „corruptae“, während die Hauptübersetzung dem Kontext von Sterblichkeit und Verfall folgt.
lexical_decisions:
- source_word: dispone domum tuam
  choice: Bringe dein Haus in Ordnung
  rationale: Die geläufige deutsche Wendung gibt den Imperativ natürlich und genau wieder; „Haus“ kann dabei Haushalt, Familie oder persönliche Angelegenheiten bezeichnen.
- source_word: corripe
  choice: weise … zurecht
  rationale: Das lateinische Verb bezeichnet hier mahnendes Tadeln oder Zurechtweisen, nicht bloß allgemeines Unterweisen.
- source_word: humiles eorum
  choice: die Demütigen unter ihnen
  rationale: „Unter ihnen“ macht den Bezug des lateinischen Genitivs bzw. Possessivpronomens auf das Volk im Deutschen verständlich. „Demütigen“ bewahrt die mögliche innere Haltung, ohne die ebenfalls mögliche soziale Niedrigkeit auszuschließen.
- source_word: renuntia
  choice: sage dich … los
  rationale: Das Verb verlangt hier die Abkehr bzw. den Verzicht auf etwas; die idiomatische Formulierung bewahrt die Entschiedenheit des Imperativs.
- source_word: corruptae uitae
  choice: vom vergänglichen Leben
  rationale: Im Zusammenhang mit Sterblichkeit, menschlichen Lasten und schwacher Natur bezeichnet die Wendung wahrscheinlich das dem Verfall unterworfene, sterbliche Leben. „Vergänglich“ ist im modernen Deutsch klarer als „verderbt“, das vor allem moralische Verderbtheit nahelegen würde.
theological_decisions:
- issue: Bedeutung von „corruptae uitae“
  choice: das vergängliche Leben
  alternative: das verdorbene Leben
  rationale: Der unmittelbare Kontext legt Sterblichkeit und Verfall nahe, doch die lateinische Form kann auch ein bereits verdorbenes Leben bezeichnen. Die Hauptübersetzung folgt dem Kontext; die Fußnote bewahrt die lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen. Die wiederholten Aufforderungen und ihre parataktische Struktur bleiben erhalten; lediglich der Bezug von „eorum“ wird durch „unter ihnen“ idiomatisch verdeutlicht.
