  source_fidelity: 'Die Übersetzung trifft die Imperativfolge und die wesentlichen Bedeutungen des lateinischen Textes zuverlässig: dispone, corripe, consolare und renuntia sind angemessen wiedergegeben. „Vergänglichen Leben“ gibt corruptae vitae im vorliegenden eschatologischen Zusammenhang treffend als dem Verfall bzw. der Sterblichkeit unterworfenes Leben wieder. Die Fußnote wahrt die mögliche lexikalische Nebenbedeutung von moralischer Verderbtheit, ohne sie zur Hauptbedeutung zu machen.'
