  text: hos quia parati sunt ad scribendum uelociter ; Et uenies hic, et ego accendam in corde tuo lucernam intellectus, quae non extinguetur quoadusque finiantur quae incipies scribere. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/025.yaml
  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: de
  text: Diese fünf, denn sie sind bereit, schnell zu schreiben. Und komm hierher, und ich werde in deinem Herzen eine Leuchte der Erkenntnis entzünden, die nicht erlöschen wird, bis alles vollendet ist, was du zu schreiben beginnst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: parati sunt ad scribendum uelociter
  choice: sie sind bereit, schnell zu schreiben
  rationale: Gibt Bereitschaft und Schreibgeschwindigkeit des lateinischen Ausdrucks direkt und natürlich wieder.
- source_word: lucernam intellectus
  choice: eine Leuchte der Erkenntnis
  rationale: Bewahrt das Lichtbild von „lucerna“ und gibt „intellectus“ hier als von Gott verliehene Erkenntnis beziehungsweise Einsicht wieder.
- source_word: finiantur
  choice: vollendet ist
  rationale: Im Deutschen bezeichnet „vollendet“ idiomatisch den Abschluss des begonnenen Schreibwerks, ohne nur das physische Ende des Schreibvorgangs zu betonen.
theological_decisions:
- issue: Art der göttlich verliehenen Befähigung
  choice: Leuchte der Erkenntnis
  alternative: Leuchte des Verstandes / Leuchte der Einsicht
  rationale: Die metaphorische und theologisch offene Formulierung bleibt erhalten; sie wird weder ausdrücklich als Inspiration noch als bloße menschliche Geisteskraft festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzanfangsform „diese fünf“ setzt den vorausgehenden Kontext fort. Das abschließende isolierte lateinische „Et“ gehört offenbar zum Anschluss des nächsten Verses und wird daher hier nicht eigens wiedergegeben.
