source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: reuiuiscemus; et tunc iustorum nomen apparebit, et impiorum facta ostendentur. Ad me autem nemo accedat nunc, neque
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/035.yaml
  text: we will live again; and then the name of the righteous will appear, and the deeds of the ungodly will be disclosed. But let no one come near me now, nor
translation:
  language: de
  text: Wir werden wieder leben; dann wird der Name der Gerechten offenbar werden, und die Taten der Gottlosen werden aufgedeckt werden. Zu mir aber soll jetzt niemand kommen, noch
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuiuiscemus
  choice: Wir werden wieder lebendig werden
  rationale: Gibt die futurische Aussage und das erneute Lebendigwerden direkt wieder, ohne die Art des Vorgangs näher zu bestimmen.
- source_word: iustorum nomen
  choice: der Name der Gerechten
  rationale: Bewahrt die auffällige Singularform „nomen“ bei kollektivem Genitiv, statt sie deutend zu „die Namen“ oder „der Ruf“ umzuformen.
- source_word: apparebit
  choice: wird offenbar werden
  rationale: Drückt das Sichtbar- oder Erkennbarwerden in einem würdigen, natürlichen Register aus.
- source_word: impiorum
  choice: der Gottlosen
  rationale: Entspricht dem religiös-moralischen Gehalt von „impii“, ohne eine spezifische konfessionelle Deutung einzutragen.
- source_word: facta ostendentur
  choice: die Taten … werden aufgedeckt werden
  rationale: Gibt das passive Offenlegen der Taten wieder; „aufgedeckt“ ist im Deutschen für bislang Verborgenes natürlich.
- source_word: Ad me autem nemo accedat nunc
  choice: Zu mir aber soll jetzt niemand kommen
  rationale: Bildet den lateinischen verneinten Jussiv natürlich und mit erhaltener adversativer Partikel ab.
theological_decisions:
- issue: Bedeutung von „reuiuiscemus“
  choice: wieder lebendig werden
  alternative: wieder auferstehen
  rationale: Die gewählte Formulierung bewahrt die Aussage vom erneuten Leben, ohne den lateinischen Ausdruck stärker auf eine bestimmte Auferstehungsvorstellung festzulegen.
- issue: Deutung von „nomen“
  choice: Singular „der Name der Gerechten“ beibehalten
  alternative: „die Namen der Gerechten“ oder „das Ansehen der Gerechten“
  rationale: Der ungewöhnliche Wortlaut bleibt erhalten, damit die mögliche Bedeutung zwischen Identität, Anerkennung und Ansehen nicht stillschweigend entschieden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit relativ formnaher Syntax. Das abschließende „noch“ bleibt bewusst unvollständig, weil der gelieferte lateinische Ausschnitt mit „neque“ in den folgenden Vers- bzw. Satzzusammenhang weiterführt.
