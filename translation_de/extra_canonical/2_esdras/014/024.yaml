lexical_decisions:
- source_word: diebus XL
  choice: vierzig Tage lang
  rationale: Gibt die lateinische Zeitangabe natürlich wieder; der Satz setzt offenbar aus dem vorherigen Vers fort.
- source_word: buxos multos
  choice: viele Schreibtafeln aus Buchsbaumholz
  rationale: Das lateinische „buxos“ bezeichnet hier im Kontext des Schreibens Tafeln aus Buchsbaumholz. Die Übersetzung bewahrt sowohl Funktion als auch Materialbezug.
- source_word: praepara tibi
  choice: bereite dir … vor
  rationale: Entspricht dem reflexiven Dativ und klingt im modernen Deutschen natürlich.
- source_word: accipe tecum
  choice: nimm … mit dir
  rationale: Direkte und idiomatische Wiedergabe der Aufforderung.
- source_word: quinque
  choice: diese fünf
  rationale: Bezieht die nachgestellte Zahl eindeutig auf die fünf genannten Personen und erhält die im Lateinischen ausdrücklich vorhandene Zählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Beginn wird bewahrt, da „vierzig Tage lang“ syntaktisch an den vorherigen Vers anschließt. Die Eigennamen folgen der vorgelegten Textform; „Asihel“ wird entsprechend der etablierten englischen Konsultationsschicht als „Asiel“ wiedergegeben.
