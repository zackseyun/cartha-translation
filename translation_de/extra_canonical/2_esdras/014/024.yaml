  text: for forty days. But you[a], prepare for yourself many writing tablets, and take with you Sarea, Dabria, Selemia, Ethan, and Asiel, five
translation:
  language: de
  text: vierzig Tage lang. Du aber bereite dir viele Schreibtafeln aus Buchsbaumholz[a] vor und nimm Sarea, Dabria, Selemia, Ethan und Asihel, fünf an der Zahl, mit.
