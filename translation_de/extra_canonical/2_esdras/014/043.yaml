  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: de
  text: Vierzig Tage lang schrieben sie am Tag und aßen nachts Brot. Ich aber sprach am Tag und schwieg nachts nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: XL diebus
  choice: Vierzig Tage lang
  rationale: Gibt die Zeitdauer des lateinischen Ablativs natürlich und präzise wieder.
- source_word: per diem
  choice: am Tag
  rationale: Natürliche moderne Wiedergabe der wiederholten Tätigkeit während des Tages.
- source_word: manducabant panem
  choice: aßen ... Brot
  rationale: Bewahrt das konkrete Objekt „Brot“ und den schlichten Erzählstil.
- source_word: loquebar
  choice: sprach
  rationale: Entspricht dem durativen Imperfekt im erzählerischen Zusammenhang.
- source_word: nocte non
  choice: schwieg nachts nicht
  rationale: Der gereinigte lateinische Text endet elliptisch mit „nachts nicht“; entsprechend der antithetischen Satzstruktur wird das im Englischen angenommene „nicht schweigen“ knapp und idiomatisch ausgedrückt.
