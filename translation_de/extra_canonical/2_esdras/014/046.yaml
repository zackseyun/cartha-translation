  yaml_path: translation/extra_canonical/2_esdras/014/046.yaml
  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: de
  text: Würdige und Unwürdige sollen sie lesen. Die letzten siebzig[a] aber sollst du aufbewahren, damit du sie den Weisen deines Volkes übergeben kannst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die letzten siebzig Bücher erscheinen hier als verborgene Weisheit, die den Weisen aus Esras Volk vorbehalten ist. Dies ist ein wichtiges kompositorisches Merkmal der Darstellung geheimer Offenbarung in 4. Esra.
    reason: compositional_layer
lexical_decisions:
- source_word: digni et indigni
  choice: Würdige und Unwürdige
  rationale: Gibt den Gegensatz des Lateinischen direkt und in natürlichem Deutsch wieder, ohne näher festzulegen, worin die Würdigkeit besteht.
- source_word: Nouissimos … LXX
  choice: die letzten siebzig
  rationale: Bewahrt sowohl die Reihenfolgebezeichnung „letzten“ als auch die konkrete Zahl siebzig.
- source_word: conseruabis
  choice: sollst du aufbewahren
  rationale: Drückt den zukunftsbezogenen Auftrag aus und bezeichnet die besondere Verwahrung der Bücher.
theological_decisions:
- issue: Zugang zu den letzten siebzig Büchern
  choice: Die letzten siebzig werden für die Weisen des Volkes aufbewahrt.
  alternative: Die letzten siebzig werden allgemein veröffentlicht.
  rationale: Der lateinische Gegensatz zwischen allgemeinem Lesen und der Verwahrung der letzten siebzig sowie die überlieferte Fortsetzung weisen auf einen begrenzten Empfängerkreis, ohne dessen Weisheit konfessionell zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im lateinischen Quellenausschnitt enthaltene Eingangssatz wurde beibehalten; die nach „ut“ abgebrochene Satzfortsetzung folgt der geprüften englischen Konsultationsfassung und der überlieferten Aussage des Verses.
