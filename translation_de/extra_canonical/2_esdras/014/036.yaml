  text: But let no one come near me now, nor seek me for forty days.”
translation:
  language: de
  text: Doch jetzt soll niemand zu mir kommen oder vierzig Tage lang nach mir suchen.« Und ich nahm fünf Männer, wie er mir befohlen hatte, und wir machten uns auf den Weg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: requirent me
  choice: nach mir suchen
  rationale: Das lateinische „requirere“ bezeichnet hier das Aufsuchen beziehungsweise Suchen einer Person; die natürliche deutsche Wendung bewahrt diesen Sinn.
- source_word: usque diebus XL
  choice: vierzig Tage lang
  rationale: Die Zeitangabe bezeichnet im Zusammenhang die Dauer, während der Esra nicht aufgesucht werden soll; „vierzig Tage lang“ ist klares, heutiges Deutsch.
