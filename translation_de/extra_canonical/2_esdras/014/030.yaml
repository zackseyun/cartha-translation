  yaml_path: translation/extra_canonical/2_esdras/014/030.yaml
  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: de
  text: Und nach ihnen habt auch ihr übertreten. Und das Land wurde euch im Land Zion gegeben; doch sowohl ihr als auch eure Väter habt Unrecht getan und die Wege nicht bewahrt, die der Höchste euch geboten hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: transgressi estis
  choice: habt das Gesetz übertreten
  rationale: Das lateinische Verb bezeichnet eine Übertretung; im Zusammenhang mit den gebotenen Wegen macht die Ergänzung „das Gesetz“ den gemeinten Normverstoß in natürlichem Deutsch deutlich, ohne eine besondere Verfehlung festzulegen.
- source_word: post eos
  choice: nach ihnen
  rationale: Bewahrt sowohl die zeitliche Abfolge als auch den Rückbezug auf die zuvor genannten Vorfahren.
- source_word: et uos et patres uestri
  choice: sowohl ihr als auch eure Väter
  rationale: Gibt die korrelative Doppelung et … et wieder und betont die gemeinsame Schuld beider Generationen.
- source_word: iniquitatem fecistis
  choice: habt Unrecht getan
  rationale: Eine natürliche, bewusst allgemein gehaltene Wiedergabe, die den moralisch-theologischen Gehalt wahrt.
- source_word: Altissimus
  choice: der Höchste
  rationale: Entspricht der traditionellen und allgemein verständlichen Gottesbezeichnung.
theological_decisions:
- issue: Gegenstand der Übertretung
  choice: das Gesetz übertreten
  alternative: euch vergangen / übertreten
  rationale: Der unmittelbare Zusammenhang spricht von den gebotenen Wegen des Höchsten. „Das Gesetz“ wird zur idiomatischen Verdeutlichung eingesetzt, ohne eine konfessionelle Auslegung hinzuzufügen.
- issue: Generationenübergreifende Schuld
  choice: sowohl ihr als auch eure Väter
  alternative: ihr und eure Väter
  rationale: Die ausdrückliche lateinische Korrelation et … et soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der lateinischen Abfolge, wird aber durch Semikolon und idiomatische Verbformen flüssig lesbar. Da der bereitgestellte lateinische Ausschnitt nach „in“ abbricht, stützt sich der zweite Teil ergänzend auf die dokumentierte, quellengeprüfte Konsultationsschicht und ihre Revisionsangaben.
