revisions:
- from: Und nach ihnen habt auch ihr das Gesetz übertreten. Das Land im Gebiet Zion wurde euch gegeben; doch sowohl ihr als auch eure Väter habt Unrecht getan und die Wege nicht eingehalten, die der Höchste euch geboten hatte.
  to: Und nach ihnen habt auch ihr übertreten. Und das Land wurde euch im Land Zion gegeben; doch sowohl ihr als auch eure Väter habt Unrecht getan und die Wege nicht bewahrt, die der Höchste euch geboten hat.
  rationale: Die Revision entfernt die nicht belegte Objektsergänzung zu „übertreten“, ersetzt die ungenaue Ortsformulierung durch die quellennahe Wiedergabe von in terra Sion und glättet die Zeitform. Die generationsübergreifende Betonung der lateinischen Doppelung et ... et bleibt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:55Z'
review_pass:
  verdict: revise
  source_fidelity: Die Ergänzung „das Gesetz“ ist im lateinischen transgressi estis nicht ausgedrückt und verengt den bewusst offenen Gegenstand der Übertretung. „im Gebiet Zion“ trifft in terra Sion ungenau; gemeint ist das Land Zion. Die korrelative Schuldzuweisung „sowohl ihr als auch eure Väter“ und „Unrecht getan“ geben et ... et beziehungsweise iniquitatem fecistis angemessen wieder.
  naturalness: Die Fassung ist insgesamt verständlich und würdevoll. „Das Land im Gebiet Zion“ wirkt jedoch administrativ und unidiomatisch; „im Land Zion“ ist näher am Wortlaut und flüssiger. „die Wege ... nicht bewahrt“ ist im biblisch-würdigen modernen Standarddeutsch eine natürliche Wiedergabe von vias ... non custodistis.
  terminology: „Der Höchste“ ist passend. Die nicht im Quelltext belegte Spezifizierung „das Gesetz“ soll entfallen. Die Vergangenheitsform bei dem göttlichen Gebot wird ohne unnötiges Plusquamperfekt wiedergegeben.
  issues:
  - severity: medium
    issue: Unbelegte Ergänzung „das Gesetz“
    rationale: transgressi estis nennt keinen Gegenstand. Die Ergänzung lenkt die Aussage auf das Gesetz und nimmt dem Text seine formale Offenheit.
  - severity: medium
    issue: „im Gebiet Zion“ für in terra Sion
    rationale: terra bezeichnet hier Land, nicht ein Verwaltungsgebiet. Die Formulierung ist zudem im Deutschen unnötig sachamtlich.
  - severity: low
    issue: Unnötiges Plusquamperfekt „geboten hatte“
    rationale: Der lateinische Satz verlangt keine Vorvergangenheit. „geboten hat“ gibt den Bezug klar und idiomatisch wieder.
  revised_text: Und nach ihnen habt auch ihr übertreten. Und das Land wurde euch im Land Zion gegeben; doch sowohl ihr als auch eure Väter habt Unrecht getan und die Wege nicht bewahrt, die der Höchste euch geboten hat.
