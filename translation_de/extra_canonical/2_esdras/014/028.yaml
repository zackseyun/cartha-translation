source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: grinati sunt patres nostri ab initio in Aegypto, et liberati sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/028.yaml
  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: de
  text: Von Anfang an[a] lebten unsere Väter als Fremde in Ägypten, und sie wurden befreit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsere Väter lebten von Anfang an als Fremde in Ägypten.“'
    reason: Die Stellung von „ab initio“ lässt offen, ob die Wendung den Beginn der Erzählung markiert oder besonders zum Leben als Fremde in Ägypten gehört.
lexical_decisions:
- source_word: grinati sunt
  choice: lebten … als Fremde
  rationale: Die überlieferte Form ist offenbar verkürzt oder textlich beschädigt und entspricht sinngemäß einem Verb des Aufenthalts in der Fremde. „Lebten als Fremde“ gibt dies im heutigen Deutsch natürlich wieder, ohne einen bloß kurzen Aufenthalt zu unterstellen.
- source_word: patres nostri
  choice: unsere Väter
  rationale: Die traditionelle genealogische Bezeichnung bleibt erhalten und bezeichnet die Vorfahren Israels.
- source_word: liberati sunt
  choice: sie wurden befreit
  rationale: Die passive Form und der Gedanke der Befreiung werden direkt bewahrt; ein im Lateinischen nicht genannter Befreier oder Herkunftsort wird nicht ergänzt.
theological_decisions:
- issue: Bezug von „ab initio“
  choice: „Von Anfang an“ wird vorangestellt und mit einer Fußnote versehen.
  alternative: „Unsere Väter lebten von Anfang an als Fremde in Ägypten“
  rationale: Die Stellung kann entweder den Beginn der erzählten Geschichte oder die Dauer des Fremdseins hervorheben. Der Haupttext folgt der adverbialen Lesart, während die Fußnote die mögliche engere Verbindung mit dem Aufenthalt in Ägypten erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lebten als Fremde“ ist verständlicher und natürlicher als das gehobene „weilten“ oder „hielten sich als Fremde auf“. Der parataktische Satzbau des lateinischen Textes bleibt erhalten.
