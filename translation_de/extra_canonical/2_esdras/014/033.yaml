  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: de
  text: Nun seid ihr hier, und eure Brüder sind in euch.[a] Wenn ihr daher eurem Verstand gebietet und euer Herz unterweist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in euch« bzw. »in eurem Inneren«. Die ungewöhnliche lateinische Wendung wird unterschiedlich gedeutet; möglicherweise ist auch eine räumliche Bedeutung wie »weiter im Landesinneren als ihr« gemeint.'
    reason: Bewahrt die formale, auffällige Aussage von introrsum uestrum im Haupttext und vermerkt die mögliche räumliche Deutung, ohne sie als sicher auszugeben.
lexical_decisions:
- source_word: nunc uos hic estis
  choice: Jetzt seid ihr hier
  rationale: Gibt Zeitangabe, Personalpronomen und Ortsangabe knapp und unmittelbar wieder.
- source_word: fratres uestri
  choice: eure Brüder
  rationale: Entspricht der gewöhnlichen Bedeutung von fratres; der Kontext verlangt keine engere Festlegung auf leibliche Brüder.
- source_word: introrsum uestrum
  choice: in eurer Mitte
  rationale: Gibt die schwerfällige lateinische Wendung idiomatisch als Zugehörigkeit zum inneren Kreis beziehungsweise Aufenthalt unter den Angeredeten wieder, ohne das unnatürliche körperliche Bild „in euch“ in den Haupttext zu setzen.
- source_word: imperaueritis sensui uestro
  choice: eurem Denken gebietet
  rationale: Bewahrt die Konstruktion von imperare mit Dativ und die innere Selbstlenkung; „Denken“ ist hier natürlicher und weniger rein intellektuell als „Verstand“.
- source_word: erudieritis cor uestrum
  choice: euer Herz unterweist
  rationale: Erhält „Herz“ als biblisches Zentrum des inneren Menschen und gibt erudire als anleitendes, formendes Unterweisen wieder.
theological_decisions:
- issue: Verhältnis von Denken und Herz
  choice: 'Beide werden als unterschiedliche, aber verbundene Bereiche beibehalten: dem Denken gebieten und das Herz unterweisen.'
  alternative: Beides zu einer allgemeinen Aufforderung zur Selbstbeherrschung zusammenziehen.
  rationale: Die lateinische Parallelstruktur sensui ... cor soll erhalten bleiben und darf nicht theologisch vereinheitlicht werden.
- issue: Unvollständiger Konditionalsatz am Versende
  choice: Der Satz endet nach dem Bedingungssatz mit einem Komma.
  alternative: Die Folgeaussage aus Vers 34 ergänzen.
  rationale: Der vorgelegte lateinische Text von Vers 33 enthält nur die Protasis; die Apodosis gehört zum folgenden Vers und darf nicht vorgezogen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt direkt; die syntaktische Spannung des am Versende noch offenen Wenn-Satzes wird entsprechend der lateinischen Versgrenze bewahrt.
