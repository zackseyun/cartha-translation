  text: and hurry to depart from these times[a]; for the things you have now seen
translation:
  language: de
  text: Beeile dich, diese Zeiten zu verlassen; denn was du jetzt gesehen hast
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina
  choice: Beeile dich
  rationale: Gibt den Imperativ und die Dringlichkeit des lateinischen Verbs unmittelbar und natürlich wieder.
- source_word: transmigrare a temporibus his
  choice: aus diesen Zeiten fortzugehen
  rationale: Bewahrt das Bild des Weggehens aus der gegenwärtigen Zeit, ohne das mehrdeutige transmigrare unnötig auf Tod oder Entrückung festzulegen.
- source_word: Quae enim uidisti nunc
  choice: denn was du jetzt gesehen hast
  rationale: Folgt dem unvollständigen lateinischen Satz am Versende und zieht weder mala noch contigisse aus dem folgenden Vers vor.
theological_decisions:
- issue: Bedeutung von transmigrare
  choice: fortzugehen
  alternative: hinüberzugehen / zu sterben
  rationale: Der lateinische Ausdruck kann einen Übergang oder ein Fortziehen bezeichnen. Die offene Formulierung vermeidet eine nicht ausdrücklich festgelegte Deutung.
- issue: Ergänzung des unvollständigen Relativsatzes
  choice: keine Ergänzung innerhalb dieses Verses
  alternative: „die Übel, die du jetzt hast geschehen sehen“
  rationale: Der vorgelegte lateinische Text endet mit Quae enim uidisti nunc. Die inhaltliche Ergänzung gehört zum folgenden Vers und darf hier nicht vorweggenommen werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das Semikolon hält die enge Verbindung der lateinischen Teilsätze fest; der bewusst unvollständige Schluss wahrt die Versgrenze.
