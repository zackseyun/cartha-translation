  yaml_path: translation/extra_canonical/2_esdras/014/039.yaml
  text: Something like water was being offered to me[a], but its color was like fire.
translation:
  language: de
  text: Mir wurde etwas gereicht.[a] Es war mit etwas wie Wasser gefüllt, doch seine Farbe war wie Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mir wurde etwas wie Wasser gereicht; doch seine Farbe war wie Feuer.“'
    reason: Der knappe lateinische Wortlaut lässt die Beziehung zwischen dem Gereichtwerden, dem unbestimmten Gegenstand und dem Wasservergleich nicht völlig eindeutig erkennen.
lexical_decisions:
- source_word: porrigebatur mihi
  choice: Mir wurde etwas gereicht
  rationale: Das Passiv von porrigere bezeichnet, dass etwas hingereicht oder dargeboten wurde; mihi gibt den Empfänger als „mir“ an. Da im überlieferten Wortlaut kein eindeutiges Substantiv genannt ist, bleibt der Gegenstand unbestimmt.
- source_word: hoc erat plenum sicut aqua
  choice: Es war mit etwas wie Wasser gefüllt
  rationale: hoc verweist auf das Gereichte; plenum beschreibt es als gefüllt. sicut aqua wird natürlich und vergleichend wiedergegeben, ohne den Inhalt schlicht mit Wasser gleichzusetzen.
- source_word: color autem
  choice: doch seine Farbe
  rationale: autem markiert den Gegensatz zwischen dem wasserähnlichen Inhalt und seiner feuerähnlichen Farbe. Die Angabe „wie Feuer“ folgt der im englischen Konsultationstext bewahrten Fortsetzung des lateinischen Satzes.
theological_decisions:
- issue: Gestalt des gereichten Gegenstands
  choice: Der Gegenstand bleibt mit „etwas“ unbestimmt.
  alternative: Ein ausdrücklich genannter „Becher“ oder „Kelch“.
  rationale: Der bereitgestellte lateinische Wortlaut nennt an dieser Stelle kein entsprechendes Substantiv; eine Konkretisierung würde mehr festlegen, als die vorgelegte Quellenform erlaubt.
- issue: Zuordnung des Wasservergleichs
  choice: Der Vergleich beschreibt den Inhalt des gereichten Gegenstands.
  alternative: „Etwas wie Wasser wurde mir gereicht.“
  rationale: hoc erat plenum legt nahe, dass das Gereichte ein gefüllter Gegenstand ist. Wegen der knappen beziehungsweise möglicherweise beschädigten Überlieferung wird die alternative Zuordnung in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung vermeidet die unbelegte Ergänzung „Becher“ oder „Kelch“ und wahrt durch „etwas wie Wasser“ den Vergleichscharakter des lateinischen sicut.
