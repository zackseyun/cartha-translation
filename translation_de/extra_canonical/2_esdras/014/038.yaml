  text: and behold[a], a voice called me, saying, “Ezra, open your mouth and drink what I am giving you.” And I opened my mouth, and behold, a full cup
translation:
  language: de
  text: 'Und siehe, eine Stimme rief mir zu: »Esra, öffne deinen Mund und trink, was ich dir zu trinken gebe.« Und ich öffnete meinen Mund, und siehe: ein voller Becher'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: sieh da
  rationale: Bewahrt das wiederholte lateinische Aufmerksamkeitssignal in einer würdigen, noch verständlichen deutschen Wendung.
- source_word: uox uocauit me
  choice: eine Stimme rief mir zu
  rationale: Natürliches Deutsch für den persönlichen Anruf; die ungenannte Herkunft der Stimme bleibt offen.
- source_word: bibe quod te potiono
  choice: trink, was ich dir zu trinken gebe
  rationale: Gibt die ungewöhnliche, kausative Formulierung des Lateinischen klar wieder, ohne einen im Ausgangstext nicht genannten Inhalt einzuführen.
- source_word: calix plenus
  choice: ein voller Becher
  rationale: Bezeichnet ein Trinkgefäß natürlich und ohne unnötig kultische Festlegung.
theological_decisions:
- issue: Herkunft und Identität der Stimme
  choice: eine Stimme
  alternative: Gottes Stimme
  rationale: Der lateinische Text identifiziert den Sprecher an dieser Stelle nicht ausdrücklich; die Übersetzung wahrt diese Offenheit.
- issue: Unvollständiger Schluss der Versabgrenzung
  choice: ein voller Becher …
  alternative: ein voller Becher wurde mir gereicht
  rationale: Der vorgelegte lateinische Versabschnitt endet nominal und setzt sich offenbar im folgenden Vers fort. Die Auslassungspunkte kennzeichnen den syntaktisch offenen Schluss, ohne Text aus dem Nachbarvers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das zweimalige »sieh da« bildet die Wiederholung von ecce ab. Die direkte Rede bleibt klar und schlicht; der Versschluss wird wegen der quellenbedingten Satzunterbrechung bewusst offen gelassen.
