  source_fidelity: 'Der Entwurf gibt den vorliegenden lateinischen Abschnitt insgesamt treffend wieder: die nicht identifizierte Stimme bleibt unbestimmt, die ungewöhnliche Wendung bibe quod te potiono wird ohne inhaltliche Ergänzung übertragen, und der Schluss bleibt auf calix plenus beschränkt. Die Auslassungspunkte stehen jedoch nicht im lateinischen Text und sollten nicht als Bestandteil der Übersetzung gesetzt werden; der grammatisch offene Versschluss ergibt sich bereits aus der Versgrenze.'
  naturalness: »Sieh da« ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig umgangssprachlich-imperativisch. »Siehe« ist als bewusst gehobenes, biblisch angemessenes Aufmerksamkeitssignal idiomatischer. »Und ich öffnete meinen Mund« bildet die einfache Reihung von et aperui genauer ab als das leicht stärker zeitlich folgernde »Da öffnete ich«.
  terminology: »Esra«, »Stimme«, »Mund« und »Becher« sind angemessen. »Voller Becher« gibt calix plenus neutral wieder, ohne eine kultische Bedeutung einzutragen.
