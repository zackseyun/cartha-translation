  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/022.yaml
  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
translation:
  language: de
  text: oder was sich ereignen wird. Denn wenn ich Gnade vor dir gefunden habe, sende den Heiligen Geist in mich, und ich werde alles aufschreiben, was von Anfang an in der Welt[a] geschehen ist, nämlich das, was in deinem Gesetz geschrieben stand, damit die Menschen den Weg finden können und damit alle, die es wollen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Zeitalter“.'
    reason: Das lateinische saeculum kann sowohl die Welt beziehungsweise ihren geschichtlichen Verlauf als auch ein Zeitalter bezeichnen; ab initio spricht hier eher für „Welt“.
lexical_decisions:
- source_word: quae incipient operari
  choice: was sich ereignen wird
  rationale: Die wörtliche Vorstellung dessen, was ‚anfangen wird, sich zu vollziehen‘, wird in natürlichem Deutsch als künftiges Geschehen wiedergegeben; der Anschluss an den vorangehenden Vers bleibt fragmentarisch erhalten.
- source_word: inmitte in me spiritum sanctum
  choice: sende den Heiligen Geist in mich
  rationale: Bewahrt die gerichtete Bildsprache von inmitte in me und gibt spiritum sanctum im würdigen, geläufigen deutschen Sprachgebrauch wieder, ohne ‚deinen‘ hinzuzufügen.
- source_word: omne quod factum est in saeculo ab initio
  choice: alles …, was von Anfang an in der Welt geschehen ist
  rationale: Im Zusammenhang mit ab initio bezeichnet saeculum den gesamten geschichtlichen Weltlauf seit dem Anfang; die Wortstellung wurde für verständliches Deutsch angepasst.
- source_word: semitam
  choice: den Weg
  rationale: ‚Weg‘ ist die natürliche deutsche Entsprechung für den bildlich gemeinten Pfad und bewahrt dessen ethisch-religiöse Offenheit.
- source_word: homines
  choice: die Menschen
  rationale: Das lateinische Wort bezeichnet hier Menschen allgemein, nicht ausschließlich Männer.
theological_decisions:
- issue: Bezeichnung spiritum sanctum
  choice: der Heilige Geist
  alternative: heiliger Geist / ein heiliger Geist
  rationale: Der bestimmte deutsche Ausdruck entspricht in diesem Gebetszusammenhang am natürlichsten der im Lateinischen bezeichneten göttlichen Geistgabe; es wird jedoch kein im Ausgangstext fehlendes Possessivpronomen ergänzt.
- issue: Bezug von quae erant in lege tua scripta
  choice: nämlich das, was in deinem Gesetz geschrieben stand
  alternative: alles, was … geschehen ist und in deinem Gesetz geschrieben stand
  rationale: Das erläuternde ‚nämlich‘ macht den wahrscheinlich appositionellen Bezug verständlich, ohne Gesetz und Weltgeschehen als zwei getrennte Schreibgegenstände auszugeben.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers setzt mitten im Satz ein und endet unvollständig; dies wurde nicht durch eine Ergänzung geglättet. Die ungewöhnliche räumliche Formulierung „in mich“ bewahrt bewusst die Bildsprache des lateinischen Textes.
