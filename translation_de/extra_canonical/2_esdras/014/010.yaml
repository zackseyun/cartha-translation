source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quoniam saeculum perdidit iuuentutem suam, et tempora adpropinquant senescere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: de
  text: Denn das Zeitalter hat seine Jugend verloren, und die Zeiten sind nahe daran, alt zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bezeichnet hier die gegenwärtige Weltzeit als eine alternde Epoche; „Zeitalter“ bewahrt das Bild und den zeitlichen Sinn.
- source_word: iuuentutem
  choice: seine Jugend
  rationale: Gibt die Personifikation des Zeitalters und den Verlust seiner früheren Lebenskraft unmittelbar wieder.
- source_word: tempora
  choice: die Zeiten
  rationale: Der lateinische Plural wird bewahrt, da er die fortschreitenden Zeitläufe bezeichnet.
- source_word: adpropinquant senescere
  choice: nähern sich dem Greisenalter
  rationale: Natürliches Deutsch für die Annäherung an das Altwerden; zugleich bleibt die parallele Altersmetaphorik erhalten.
theological_decisions:
- issue: Eschatologische Altersmetaphorik
  choice: Die Weltzeit wird als ein Mensch dargestellt, der Jugend verliert und sich dem Greisenalter nähert.
  alternative: Die Zeiten gehen ihrem Ende entgegen.
  rationale: Die bildhafte Aussage des lateinischen Textes wird nicht in eine ausdrücklichere Endzeitaussage aufgelöst; so bleiben Bild, Spannung und Reichweite des Originals erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die Personifikation des Zeitalters beziehungsweise der Zeiten bleiben erhalten.
