  text: When you have completed them[a], some things you shall make public, and some things you shall hand over in secret to the wise. For tomorrow at this hour you shall begin to write.” And I went away, as he commanded me, and I gathered all the
translation:
  language: de
  text: Wenn du sie vollendet hast[a], sollst du einiges öffentlich bekannt machen und anderes den Weisen im Verborgenen übergeben. Denn morgen um diese Stunde sollst du zu schreiben beginnen.« Da ging ich fort, wie er mir befohlen hatte, und versammelte die ganze
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wenn du vollendet hast«; das Objekt ist im Lateinischen nicht ausdrücklich genannt.'
    reason: Das lateinische »cum perfeceris« lässt das aus dem Kontext zu ergänzende Objekt unausgesprochen.
lexical_decisions:
- source_word: palam facies
  choice: öffentlich bekannt machen
  rationale: Gibt die öffentliche Zugänglichmachung natürlich und präzise wieder; »palam« steht im Gegensatz zu »absconse«.
- source_word: absconse trades
  choice: im Verborgenen übergeben
  rationale: Bewahrt sowohl den Gedanken einer nicht öffentlichen Weitergabe als auch das konkrete Verb »übergeben«.
- source_word: sapientibus
  choice: den Weisen
  rationale: Direkte, im Kontext passende Wiedergabe des substantivierten Adjektivs.
- source_word: in crastinum enim hac hora
  choice: Denn morgen um diese Stunde
  rationale: »Denn« gibt das erklärende »enim« wieder; die Zeitangabe wird in natürlicher deutscher Wortstellung formuliert.
- source_word: profectus sum
  choice: ging ich fort
  rationale: Entspricht dem Aufbrechen beziehungsweise Weggehen, ohne ein nicht genanntes Ziel hinzuzufügen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt von »perfeceris«
  choice: sie vollendet hast
  alternative: vollendet hast
  rationale: Das Objekt ist im Lateinischen aus dem vorausgehenden Zusammenhang zu ergänzen. Das Pronomen ergibt idiomatisches Deutsch, während die Fußnote die formale Ellipse sichtbar hält.
- issue: Geheime Weitergabe an die Weisen
  choice: im Verborgenen übergeben
  alternative: heimlich den Weisen anvertrauen
  rationale: Die gewählte Fassung wahrt die Spannung zwischen öffentlicher Bekanntmachung und beschränkter Weitergabe, ohne den Zweck oder die Art der Überlieferung theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung mit »Denn« bildet »enim« ausdrücklich ab. Der überlieferte Ausschnitt endet unvollständig bei »omnem«; daher bleibt auch die deutsche Fassung nach »die ganze« bewusst offen, statt ein im bereitgestellten Quelltext nicht genanntes Substantiv zu ergänzen.
