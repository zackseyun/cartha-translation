lexical_decisions:
- source_word: enarraui
  choice: erzählte
  rationale: Gibt das ausführliche Mitteilen natürlich und quellennah wieder.
- source_word: mirabilia multa
  choice: viele Wunder
  rationale: Bewahrt die konkrete Bedeutung von mirabilia und die Wortstellung in idiomatischem Deutsch.
- source_word: temporum secreta
  choice: die Geheimnisse der Zeiten
  rationale: Erhält den wiederholten Bezug auf tempora und die apokalyptische Offenbarungssprache.
- source_word: temporum finem
  choice: das Ende der Zeiten
  rationale: Folgt dem lateinischen Plural und vermeidet eine vorschnelle Gleichsetzung mit einem bestimmten theologischen Fachbegriff.
- source_word: praecepi
  choice: gebot
  rationale: Drückt den autoritativen Charakter des Befehls prägnant aus.
- source_word: dicens
  choice: 'gebot ihm:'
  rationale: Ein Doppelpunkt gibt die einleitende Partizipialformel im modernen Deutschen natürlicher wieder als das wörtliche „indem ich sagte“.
theological_decisions:
- issue: Bedeutung von „temporum finem“
  choice: das Ende der Zeiten
  alternative: das Ende der Zeit
  rationale: Der Plural des Ausgangstextes bleibt erhalten; so wird die mögliche Vorstellung verschiedener festgesetzter Zeiten nicht eingeebnet.
