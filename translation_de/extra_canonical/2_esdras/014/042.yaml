source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: apertum est os meum et non est clausum amplius. Altissimus autem dedit intellectum quinque uiris, et scripserunt quae dicebantur ex successione notis quas non sciebant, et sederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: de
  text: Da öffnete sich mein Mund und schloss sich nicht mehr. Der Höchste aber gab den fünf Männern Einsicht, und sie schrieben abwechselnd[b] auf, was gesprochen wurde, und zwar in Zeichen, die sie nicht kannten.[a] So saßen sie vierzig Tage lang da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „in Zeichen, die sie nicht kannten“ kann unbekannte Schriftzeichen, Kurzschrift oder eine von Gott ermöglichte Schreibform bezeichnen; der lateinische Text legt dies nicht näher fest.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „in Aufeinanderfolge“; gemeint ist wahrscheinlich, dass die fünf Männer einander beim Schreiben ablösten.'
    reason: previous_rendering
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: Da öffnete sich mein Mund und schloss sich nicht mehr
  rationale: Gibt die passive lateinische Wendung natürlich und eng am Wortlaut wieder, ohne ihren außergewöhnlichen Charakter abzuschwächen.
- source_word: intellectum
  choice: Einsicht
  rationale: Bezeichnet hier die vom Höchsten verliehene Befähigung zum Verstehen und Ausführen der Aufgabe; „Einsicht“ ist natürlicher und weniger rein intellektuell als „Verstand“.
- source_word: ex successione
  choice: abwechselnd
  rationale: Die Wendung beschreibt am ehesten die Aufeinanderfolge der Schreiber, die einander bei der fortlaufenden Niederschrift ablösen, nicht die Anordnung des diktierten Inhalts.
- source_word: notis quas non sciebant
  choice: in Zeichen, die sie nicht kannten
  rationale: „Zeichen“ bewahrt die Offenheit von notae zwischen Schriftzeichen, Kurzschriftzeichen oder einer besonderen Schreibform; „nicht kannten“ gibt die fehlende Vertrautheit wieder.
- source_word: sederunt
  choice: So saßen sie ... da
  rationale: Gibt das konkrete Sitzen der Schreiber wieder und verbindet es natürlich mit der angegebenen Dauer.
theological_decisions:
- issue: Art der den Schreibern verliehenen Befähigung
  choice: Der Höchste gab ihnen „Einsicht“; die unbekannten Zeichen werden nicht näher erklärt.
  alternative: Die Männer erhielten ausdrücklich eine übernatürliche Zeichenschrift oder die Gabe, eine unbekannte Sprache zu schreiben.
  rationale: Der lateinische Text schreibt die Befähigung dem Höchsten zu, bestimmt aber weder die genaue Art der Zeichen noch den Mechanismus des Schreibens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am lateinischen Erzählstil, während „abwechselnd“ die personelle Aufeinanderfolge der Schreiber verständlich ausdrückt. Sämtliche Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Formulierungen.
