lexical_decisions:
- source_word: apertum est os meum
  choice: mein Mund wurde geöffnet
  rationale: Bewahrt die passive Formulierung des lateinischen Textes und lässt den Handelnden wie in der Vorlage ungenannt.
- source_word: non est clausum amplius
  choice: blieb von da an offen
  rationale: 'Gibt die fortdauernde Folge idiomatisch und würdig wieder. Wörtlich steht: »wurde nicht mehr geschlossen«.'
theological_decisions:
- issue: Ungenannter Handelnder beim Öffnen des Mundes
  choice: Passivform ohne ausdrückliches Subjekt
  alternative: Gott öffnete meinen Mund
  rationale: Die lateinische Vorlage nennt den Handelnden nicht; eine ausdrückliche Zuschreibung an Gott würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die koordinierende Struktur mit »Und« bleibt erhalten; die zweite Hälfte wird natürlich formuliert, ohne den Sinn der dauerhaften Öffnung zu verändern.
