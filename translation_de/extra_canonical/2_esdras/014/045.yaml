  yaml_path: translation/extra_canonical/2_esdras/014/045.yaml
  text: And it happened when the forty days were completed[a], the Most High spoke to me, saying, “The former things that you wrote, set them out publicly, and
translation:
  language: de
  text: 'Und es geschah: Als die vierzig Tage vollendet waren, sprach der Höchste zu mir: »Was du zuvor geschrieben hast, mache öffentlich zugänglich, und«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conpleti essent XL dies
  choice: die vierzig Tage zu Ende waren
  rationale: Gibt die vollendete Zeitspanne in natürlichem modernem Deutsch wieder.
- source_word: altissimus
  choice: der Höchste
  rationale: Entspricht dem substantivierten lateinischen Gottesprädikat und wahrt den würdevollen biblischen Sprachgebrauch.
- source_word: priora quae scripsisti
  choice: was du zuvor geschrieben hast
  rationale: Prior(a) bezeichnet hier das früher beziehungsweise zuvor Geschriebene; diese Formulierung ist natürlicher als eine wörtliche Wiedergabe mit »die früheren Dinge«.
- source_word: in palam pone
  choice: mache öffentlich zugänglich
  rationale: Drückt die Aufforderung aus, das Geschriebene öffentlich bereitzustellen beziehungsweise bekannt zu machen.
