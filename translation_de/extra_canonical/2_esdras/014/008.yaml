id: 2ES.14.8
reference: 2 Esdras 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Signa quae demonstraui, et somnia quae uidisti, et interpretationes quas tu audisti, in corde tuo repone ea;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/008.yaml
  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
translation:
  language: de
  text: Die Zeichen, die ich gezeigt habe, und die Träume, die du gesehen hast, und die Deutungen, die du gehört hast – bewahre sie in deinem Herzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  choice: die Zeichen
  rationale: Direkte und natürliche Wiedergabe des lateinischen Plurals; der visionäre Sinn bleibt offen.
- source_word: demonstraui
  choice: ich dir gezeigt habe
  rationale: Das lateinische Verb bedeutet hier »gezeigt/vor Augen geführt«; das im Deutschen notwendige indirekte Objekt wird aus dem Kontext ergänzt.
- source_word: somnia
  choice: die Träume
  rationale: Entspricht dem üblichen Sinn von »somnia« und passt zum visionären Zusammenhang.
- source_word: interpretationes
  choice: die Deutungen
  rationale: »Deutungen« gibt Auslegungen von Zeichen und Träumen idiomatisch und ohne unnötige Festlegung wieder.
- source_word: in corde tuo repone ea
  choice: bewahre sie in deinem Herzen
  rationale: Bewahrt sowohl das resumptive Pronomen »ea« als auch das biblische Bild des inneren Bewahrens; »bewahre« klingt im modernen Deutsch natürlicher als das wörtlichere »lege nieder«.
theological_decisions:
- issue: Vorwegnahme der drei Objekte mit anschließendem resumptivem Pronomen
  choice: Die drei Gegenstände werden vorangestellt und anschließend mit »sie« wieder aufgenommen.
  alternative: »Bewahre in deinem Herzen die Zeichen …«
  rationale: Die gewählte Satzgestalt erhält die emphatische Linksversetzung des lateinischen Textes und damit den rhetorischen Aufbau, ohne die Aussage theologisch zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die lange Voranstellung verständlich und hebt den abschließenden Auftrag hervor. Die dreifache Verbindung mit »und« bildet die lateinische Reihung bewusst nach.
