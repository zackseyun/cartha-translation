source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: de
  text: Und ich nahm es und trank davon. Als ich davon getrunken hatte, strömte aus meinem Herzen Einsicht hervor, und in meiner Brust wuchs die Weisheit; denn mein Geist bewahrte die Erinnerung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bewahrte das Gedächtnis.'
    reason: Das lateinische „memoria“ kann sowohl Erinnerung als auch Gedächtnis beziehungsweise Erinnerungsvermögen bezeichnen.
lexical_decisions:
- source_word: eructuabat intellectum
  choice: strömte … Einsicht hervor
  rationale: Das lateinische „eructuabat“ bezeichnet ein kräftiges Hervorbringen oder Hervorströmen. Die Formulierung gibt das Bild natürlich und würdevoll wieder, ohne die im Deutschen unpassende wörtliche Bedeutung „aufstoßen“ zu verwenden. „Intellectum“ wird hier als „Einsicht“ wiedergegeben.
- source_word: increscebat sapientia
  choice: wuchs die Weisheit
  rationale: „Increscebat“ bezeichnet ein Zunehmen oder Anwachsen; „wuchs“ bewahrt das körperlich-räumliche Bild in Verbindung mit der Brust.
- source_word: spiritus meus conseruabat memoriam
  choice: mein Geist bewahrte das Gedächtnis
  rationale: 'Die Wiedergabe folgt der lateinischen Satzstruktur: „spiritus meus“ ist das Subjekt, „memoriam“ das Objekt. „Bewahrte“ trifft den fortdauernden Sinn von „conservabat“ und wahrt die mögliche Bedeutung des Gedächtnisses als Erinnerungsvermögen oder bewahrter Erinnerungsinhalt.'
theological_decisions:
- issue: Verhältnis von Geist und Gedächtnis
  choice: mein Geist bewahrte das Gedächtnis
  alternative: mein Geist behielt alles im Gedächtnis
  rationale: Die gewählte Fassung vermeidet die nicht ausdrücklich im Lateinischen stehende Ergänzung „alles“ und lässt offen, ob „memoria“ das Erinnerungsvermögen oder den bewahrten Erinnerungsinhalt bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzrhythmus folgt der feierlichen Erzählweise des lateinischen Textes. Das am Anfang überlieferte Fragment „eius ut ignis similis“ gehört zum vorausgehenden Zusammenhang, das abschließende „Et“ zum folgenden Vers; beides wurde daher nicht in Vers 40 aufgenommen.
