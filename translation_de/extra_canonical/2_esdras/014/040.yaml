    issue: Unidiomatische Wiedergabe von „Et accepi et bibi“
    rationale: Die Formulierung „ich nahm es und trank“ lässt offen, was genau getrunken wird, und klingt im Deutschen elliptisch. „Ich nahm es und trank davon“ gibt den im Lateinischen mitverstandenen Bezug natürlich wieder.
  - severity: low
    issue: „bewahrte das Gedächtnis“ ist im Deutschen weniger natürlich
    rationale: Das Lateinische „memoriam“ kann sowohl Erinnerung als auch Gedächtnis bedeuten. „Die Erinnerung bewahren“ ist eine idiomatische deutsche Verbindung und die Alternativbedeutung wird in der Fußnote erhalten.
