  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des vorgelegten lateinischen Segments wieder: „sumus“ als Präsens („sind“), „in campo“ als „auf dem Feld“, „mansimus ibi“ als „blieben dort“ und „Et factum est in crastinum“ als in den folgenden Zusammenhang überleitende Zeitformel. Der im Latein vorhandene ungewöhnliche Tempuswechsel wird nicht unzulässig harmonisiert.'
