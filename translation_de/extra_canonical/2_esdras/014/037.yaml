lexical_decisions:
- source_word: sumus
  choice: wir sind
  rationale: Gibt das lateinische Präsens formal wieder, obwohl der anschließende Tempuswechsel zu „mansimus“ ungewöhnlich ist.
- source_word: in campo
  choice: auf dem Feld
  rationale: Natürliche deutsche Wiedergabe des Ortsausdrucks; „Feld“ bleibt gegenüber möglichen Bedeutungen wie freies Gelände bewusst offen.
- source_word: mansimus ibi
  choice: und blieben dort
  rationale: Entspricht dem Perfekt „mansimus“ und gibt „ibi“ ausdrücklich mit „dort“ wieder.
- source_word: Et factum est in crastinum
  choice: Und am nächsten Tag geschah es,
  rationale: Bewahrt die formelhafte Wendung und ihren unvollständigen, in den folgenden Vers überleitenden Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Der auffällige Wechsel vom Präsens („sind“) zum Präteritum („blieben“) wird gemäß der lateinischen Vorlage nicht geglättet. Das abschließende Komma signalisiert, dass der Satz syntaktisch in den nächsten Vers weiterführt.
