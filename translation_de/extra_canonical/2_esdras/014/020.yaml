  verdict: approve
  source_fidelity: Die Übersetzung gibt den fragmentarisch einsetzenden adversativen Anschluss („Aber“), die auf künftig Geborene bezogene Frage sowie die Bildsprache von Finsternis und Licht zutreffend wieder. „liegt in Finsternis“ entspricht der hier naheliegenden stativen Funktion von „positum est ... in tenebris“, ohne einen nicht ausdrücklich genannten Handelnden einzutragen.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und syntaktisch klar. „Weltzeit“ ist leicht gehoben, aber als Wiedergabe des bedeutungsweiten „saeculum“ vertretbar; „darin“ vermeidet eine unnötige Festlegung auf ein rein zeitliches oder räumliches Verständnis.
  terminology: „Warnen“ ist für „commonebit“ im vorliegenden Kontext eine mögliche, verständliche Wiedergabe. Die Begriffe „Finsternis“ und „Licht“ bewahren die offene metaphorische Sprache des Ausgangstextes. Die Fußnote kennzeichnet die formal mögliche, im Kontext jedoch weniger wahrscheinliche Vorgangslesart von „positum est“ angemessen.
