id: 2ES.14.20
reference: 2 Esdras 14:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: de
  text: Aber wer wird diejenigen warnen, die später geboren werden? Denn die Weltzeit liegt in Finsternis[a], und die darin wohnen, sind ohne Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist in Finsternis gesetzt worden“.'
    reason: Das lateinische „positum est“ kann formal auch als vollendetes passives Geschehen verstanden werden, obwohl im Zusammenhang die stative Bedeutung „liegt“ näherliegt.
lexical_decisions:
- source_word: autem iterum nati fuerint
  choice: die später geboren werden
  rationale: Im fragmentarischen Satzzusammenhang bezeichnet die Wendung die künftig beziehungsweise nach der gegenwärtigen Generation Geborenen. „Später“ gibt den zeitlichen Sinn natürlich wieder, ohne das missverständliche „wiedergeboren“ nahezulegen.
- source_word: quis commonebit?
  choice: wer wird ... warnen?
  rationale: „Commonere“ kann erinnern, ermahnen oder warnend aufmerksam machen. Im Zusammenhang fehlender Unterweisung für spätere Generationen trifft „warnen“ den Sinn knapp und verständlich.
- source_word: saeculum
  choice: Weltzeit
  rationale: Das lateinische Wort kann „Zeitalter“, „Welt“ oder die gegenwärtige Weltordnung bezeichnen. „Weltzeit“ bewahrt sowohl den zeitlichen als auch den kosmischen Horizont.
- source_word: positum est ... in tenebris
  choice: liegt in Finsternis
  rationale: Mit der Ortsangabe beschreibt das Perfekt Passiv hier natürlich einen bestehenden Zustand. „Liegt“ vermeidet die unnötige Festlegung, jemand habe die Weltzeit aktiv in die Finsternis versetzt.
- source_word: sine lumine
  choice: ohne Licht
  rationale: Direkte und idiomatische Wiedergabe der metaphorisch offenen Aussage.
theological_decisions:
- issue: Ursache der Finsternis
  choice: liegt in Finsternis
  alternative: ist in Finsternis gesetzt worden
  rationale: Die stative Wiedergabe beschreibt den Zustand, ohne Gott oder einen anderen Handelnden ausdrücklich als Ursache einzutragen; diese Frage bleibt im lateinischen Wortlaut offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weltzeit“ ist leicht gehoben, aber verständlich und bewahrt die Bedeutungsbreite von „saeculum“. Die parallelen Bilder „Finsternis“ und „ohne Licht“ bleiben erhalten.
