source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uiui conseruati eritis et post mortem misericordiam consequemini; Iudicium enim post mortem ueniet quando iterum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/034.yaml
  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
translation:
  language: de
  text: Ihr werdet am Leben erhalten werden und nach dem Tod Barmherzigkeit erlangen. Denn das Gericht wird nach dem Tod kommen, wenn erneut[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im folgenden Vers fortgesetzt.
    reason: Der lateinische Quellenausschnitt endet mit „quando iterum“ („wenn erneut“) und enthält noch nicht das dazugehörige Verb.
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: Ihr werdet am Leben erhalten werden
  rationale: Gibt die passive Zukunftsform und das prädikative „uiui“ formal und verständlich wieder.
- source_word: misericordiam consequemini
  choice: Barmherzigkeit erlangen
  rationale: Bewahrt den Zukunftssinn sowie die Vorstellung, Barmherzigkeit zu empfangen bzw. ihrer teilhaftig zu werden.
- source_word: Iudicium
  choice: das Gericht
  rationale: Im eschatologischen Zusammenhang ist „Gericht“ die natürliche und sachlich offene Entsprechung.
- source_word: quando iterum
  choice: wenn erneut
  rationale: Der Quellenausschnitt endet unvollständig; die Übersetzung bildet diese Fortsetzung bewusst ab, ohne das Verb aus dem nächsten Vers vorwegzunehmen.
theological_decisions:
- issue: Beziehung von Tod, Barmherzigkeit und Gericht
  choice: Die Satzfolge des lateinischen Textes wird unverändert bewahrt.
  alternative: Die Barmherzigkeit ausdrücklich als Ergebnis des Gerichts oder der Auferstehung deuten.
  rationale: Der lateinische Text stellt die Aussagen nebeneinander, bestimmt ihre genaue theologische Beziehung aber nicht.
- issue: Unvollständiger Schlusssatz
  choice: „wenn erneut“ bleibt als offener Anschluss stehen.
  alternative: „wenn wir wieder leben werden“ ergänzen.
  rationale: „reuiuiscemus“ gehört nach der vorgegebenen Segmentierung zum folgenden Vers und darf hier nicht stillschweigend ergänzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markierte Passivform „am Leben erhalten werden“ wahrt die Form des lateinischen Textes; der syntaktisch offene Versschluss bleibt erkennbar.
