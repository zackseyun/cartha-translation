  yaml_path: translation/extra_canonical/2_esdras/014/029.yaml
  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: de
  text: Und sie empfingen das Gesetz des Lebens, das sie nicht hielten und das auch ihr nach ihnen übertreten habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem uitae
  choice: das Gesetz des Lebens
  rationale: Die Genitivverbindung wird formal und zugleich idiomatisch wiedergegeben; „Leben“ bleibt als inhaltliche Bestimmung des Gesetzes erhalten.
- source_word: custodierunt
  choice: hielten
  rationale: Im Zusammenhang mit einem Gesetz bedeutet „halten“ natürlich und prägnant, es zu bewahren und zu befolgen.
- source_word: transgressed
  choice: übertretet habt
  rationale: Die deutsche Wendung „ein Gesetz übertreten“ gibt den im geprüften Konsultationstext bezeugten Gedanken präzise wieder.
- source_word: post eos / after them
  choice: nach ihnen
  rationale: Die zeitliche und generationale Folge bleibt ohne zusätzliche Deutung erhalten.
theological_decisions:
- issue: Bedeutung von „Gesetz des Lebens“
  choice: Die offene Genitivformulierung „Gesetz des Lebens“ bleibt stehen.
  alternative: „das Gesetz, das zum Leben führt“
  rationale: Die auslegungsfähige Beziehung zwischen Gesetz und Leben soll nicht auf eine ausschließlich zweckhafte Bedeutung festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Relativsätze bewahren die Struktur und den vorwurfsvollen Ton. Der zweite Satzteil ist im bereitgestellten lateinischen Ausschnitt nicht vollständig erhalten und wird entsprechend der geprüften englischen Konsultationsschicht wiedergegeben.
