translation:
  language: de
  text: Nach der Mitte des zehnten Teils bleiben aber zwei seiner Teile übrig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die lateinische Angabe ist knapp und ungewöhnlich; wörtlich: »nach der Mitte des zehnten Teils«. Wie die genannten Teile genau zu berechnen sind, bleibt offen.'
    reason: Bewahrt die Unklarheit der überlieferten Formulierung, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: Superant
  choice: bleiben … noch … übrig
  rationale: Gibt das lateinische Verb im Sinn von »verbleiben« natürlich und präzise wieder.
- source_word: eius
  choice: von ihm
  rationale: Bewahrt den ausdrücklichen Rückverweis auf das zuvor genannte Zeitalter und lässt ihn nicht, wie in einer verkürzten Wiedergabe, entfallen.
- source_word: post medium decimae partis
  choice: nach der Mitte des zehnten Teils
  rationale: Folgt der ungewöhnlichen, aber grammatisch möglichen Formulierung des lateinischen Textes, ohne die zugrunde liegende Einteilung erklärend zu glätten.
- source_word: duae … partis
  choice: zwei Teile
  rationale: Gibt Zahl und Substantiv direkt wieder; die auseinandergezogene lateinische Wortstellung muss im Deutschen nicht nachgebildet werden.
theological_decisions:
- issue: Rückbezug der verbleibenden Teile
  choice: Der Rückverweis »von ihm« bleibt ausdrücklich erhalten.
  alternative: Nur »zwei Teile bleiben übrig«.
  rationale: Das lateinische »eius« verbindet die Teile ausdrücklich mit dem zuvor erwähnten Zeitalter; sein Weglassen würde eine vorhandene Bedeutungsnuance beseitigen.
- issue: Deutung der Zeitrechnung
  choice: Die rätselhafte Angabe wird möglichst wörtlich wiedergegeben.
  alternative: Eine rechnerisch oder endzeitlich präzisierende Umschreibung.
  rationale: Der Vers erklärt die Einteilung nicht eindeutig. Die Übersetzung soll daher keine bestimmte chronologische oder theologische Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist natürlich deutsch, während der ausdrückliche Rückverweis und die ungewöhnliche Zeitangabe des lateinischen Ausgangstextes erhalten bleiben.
