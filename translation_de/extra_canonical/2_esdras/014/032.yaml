lexical_decisions:
- source_word: iudex cum sit
  choice: Da er Richter ist
  rationale: Gibt die kausale Konstruktion mit cum und den prädikativen Begriff iudex knapp und natürlich wieder.
- source_word: abstulit a uobis
  choice: nahm er euch
  rationale: Bewahrt die Bedeutung des Wegnehmens und den Bezug auf die angesprochenen Personen.
- source_word: in tempore
  choice: zur rechten Zeit
  rationale: Drückt den zeitlich angemessenen bzw. bestimmten Zeitpunkt idiomatisch aus, ohne ihn näher festzulegen.
- source_word: quod donauerat
  choice: was er gegeben hatte
  rationale: Das Plusquamperfekt wahrt die Vorzeitigkeit; „gegeben“ ist im Kontext natürlicher als „geschenkt“, ohne den Sinn von donare zu verlieren.
- source_word: Et
  choice: Und
  rationale: Das am Fragmentende stehende Bindewort wird erhalten, da es in den folgenden Satz überleitet.
theological_decisions:
- issue: Charakterisierung des Richters
  choice: Richter
  alternative: gerechter Richter
  rationale: Im vorgelegten lateinischen Text steht nur iudex; „gerecht“ würde eine nicht in diesem Textabschnitt enthaltene Eigenschaft ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fragmentarische Fortsetzung „Und“ bleibt entsprechend der Vers- und Quellenabgrenzung stehen.
