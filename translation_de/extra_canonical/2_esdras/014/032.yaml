- from: Da er Richter ist, nahm er euch zur rechten Zeit, was er gegeben hatte. Und
  to: Da er Richter ist, nahm er euch zu gegebener Zeit das weg, was er gegeben hatte. Und
  rationale: Die Revision ergänzt „weg“ als notwendige Entsprechung zu abstulit und glättet die deutsche Objektkonstruktion durch „das ... was“. Das abschließende, unvollständige „Und“ bleibt als genaue Wiedergabe des quellenbedingt überlieferten Et erhalten. Die englische Alternativfußnote gehört zu einer früheren, versverschobenen Lesung und hat keine Grundlage im vorgelegten lateinischen Text; daher wird keine Fußnote gesetzt.
