  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: de
  text: das Erbteil im Land Zion[a]. Ihr und eure Väter habt Unrecht getan und die Wege nicht eingehalten, die der Höchste euch geboten hat; der Gerechte[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Los“ beziehungsweise „der zugeloste Anteil“. Der Vers beginnt im überlieferten Text als Satzfragment.'
    reason: Die Bedeutungsbreite von „sortem“ und der fragmentarische Versanfang sollen transparent bleiben.
  - marker: b
    text: Der lateinische Textausschnitt endet mit „der Gerechte“; der Satz wird offenbar im folgenden Text fortgesetzt.
    reason: Die syntaktische Offenheit des Schlusswortes darf nicht durch eine unbelegte Ergänzung verdeckt werden.
lexical_decisions:
- source_word: sortem
  choice: das Erbteil
  rationale: Das lateinische „sors“ bezeichnet hier den zugelosten Anteil beziehungsweise Besitz. „Erbteil“ gibt den sachlichen Sinn im Zusammenhang mit dem Land Zion natürlicher wieder als das im Deutschen mehrdeutige „Los“.
- source_word: iniquitatem fecistis
  choice: habt Unrecht getan
  rationale: Die Wendung bezeichnet schuldhaftes, ungerechtes Handeln. Die Übersetzung bleibt verständlich und bewahrt den moralischen Gehalt, ohne ihn konfessionell einzuengen.
- source_word: non seruastis uias
  choice: seid nicht auf den Wegen geblieben
  rationale: Diese Wiedergabe bewahrt das biblische Bild der gebotenen Wege und drückt zugleich aus, dass sie nicht eingehalten beziehungsweise befolgt wurden.
- source_word: altissimus
  choice: der Höchste
  rationale: Traditionelle und zugleich allgemein verständliche Wiedergabe des lateinischen Gottesprädikats.
- source_word: Iustus
  choice: der Gerechte
  rationale: Die substantivierte Bezeichnung wird formal bewahrt. Da das Wort am Ende des überlieferten Ausschnitts syntaktisch offenbleibt, wird es nicht deutend zu einem vollständigen Satz ergänzt.
theological_decisions:
- issue: Bezug und Funktion von „Iustus“
  choice: „der Gerechte“ als offenes Satzglied stehen lassen
  alternative: „der gerechte Richter“ oder „weil er gerecht ist“
  rationale: Der lateinische Text bietet lediglich „Iustus“. Eine Ergänzung wie „Richter“ oder eine kausale Auflösung würde eine nicht ausdrücklich vorhandene Deutung in den Text eintragen.
- issue: Kollektive Schuld von Adressaten und Vorfahren
  choice: „Ihr und eure Väter habt Unrecht getan“
  alternative: Nur die Vorfahren oder nur die gegenwärtigen Adressaten als Täter darstellen
  rationale: Die koordinierte lateinische Formulierung „et uos et patres uestri“ schließt ausdrücklich beide Gruppen ein und sollte nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Ausdruck „Wege“ und die Gottesbezeichnung „der Höchste“ bleiben erhalten. Die beiden überlieferungsbedingt offenen Versränder werden nicht künstlich zu einem vollständigen Satz geglättet.
