id: 2ES.14.9
reference: 2 Esdras 14:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: de
  text: Denn du wirst von den Menschen hinweggenommen werden[a] und die verbleibende Zeit bei meinem Sohn und bei deinesgleichen bleiben, bis die Zeiten vollendet sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von den Menschen aufgenommen werden.'
    reason: Das lateinische reciperis kann sowohl die Hinwegnahme aus der menschlichen Gemeinschaft als auch die Aufnahme an einen anderen Ort oder in einen anderen Bereich anklingen lassen.
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: du wirst von den Menschen hinweggenommen werden
  rationale: Das Futur Passiv von recipere bezeichnet hier, dass Esra aus der menschlichen Gemeinschaft fortgenommen beziehungsweise aufgenommen wird. „Hinweggenommen“ gibt die Bewegung aus ihrer Mitte natürlich wieder, ohne die Art des Vorgangs näher festzulegen.
- source_word: conuerteris residuum
  choice: die verbleibende Zeit … bleiben
  rationale: residuum bezeichnet den noch übrigen Zeitraum. Zusammen mit conuerteris wird die Wendung idiomatisch als Bleiben während dieser restlichen Zeit wiedergegeben; damit bleibt die in der Revision hervorgehobene zeitliche Nuance erhalten.
- source_word: cum filio meo
  choice: bei meinem Sohn
  rationale: cum bezeichnet hier Gemeinschaft beziehungsweise Aufenthalt. „Bei“ ist im Deutschen natürlicher als ein mechanisches „mit“, ohne die Beziehung näher auszudeuten.
- source_word: cum similibus tuis
  choice: bei deinesgleichen
  rationale: Die knappe Formulierung bewahrt den offenen Bezug von similibus tuis auf Menschen, die Esra in der hier vorausgesetzten Hinsicht gleichen.
- source_word: usquequo finiantur tempora
  choice: bis die Zeiten vollendet sind
  rationale: „Vollendet“ wahrt den eschatologischen Klang von finiantur und gibt zugleich dessen Grundbedeutung „zu Ende kommen“ wieder.
theological_decisions:
- issue: Art der Hinwegnahme Esras
  choice: hinweggenommen
  alternative: aufgenommen
  rationale: Der Text sagt nicht ausdrücklich, ob Tod, Entrückung oder eine andere Aufnahme gemeint ist. Die Übersetzung lässt diese Frage offen; die mögliche Nuance von „aufgenommen“ wird in der Fußnote genannt.
- issue: Identität der Esra Gleichenden
  choice: deinesgleichen
  alternative: Menschen wie du
  rationale: Die Quelle bestimmt nicht, worin die Ähnlichkeit besteht. „Deinesgleichen“ erhält diese theologische und referenzielle Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am lateinischen Gedankengang, während „die verbleibende Zeit … bleiben“ die adverbiale Zeitangabe residuum im Deutschen verständlich ausdrückt.
