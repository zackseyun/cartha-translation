  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des Lateins zuverlässig wieder: reciperis ab hominibus als offene Hinwegnahme aus der Menschenwelt, residuum als noch verbleibenden Zeitraum, cum filio meo ... cum similibus tuis als gemeinschaftlichen Aufenthalt und usquequo finiantur tempora als zeitliche Begrenzung. Die Deutung der Art der Aufnahme wird nicht unzulässig festgelegt.'
  naturalness: „Denn du wirst von den Menschen hinweggenommen werden und die verbleibende Zeit bei meinem Sohn und bei deinesgleichen bleiben, bis die Zeiten vollendet sind“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht gehobene Formulierung entspricht dem prophetisch-apokalyptischen Register.
  terminology: „Mein Sohn“ bewahrt die quellensprachliche Bezeichnung ohne zusätzliche dogmatische Auslegung. „Deinesgleichen“ erhält die offene Referenz von similibus tuis. „Vollendet“ ist für finiantur und den eschatologischen Kontext angemessen.
