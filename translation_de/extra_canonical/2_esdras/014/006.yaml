  text: Diese Worte sollst du öffentlich bekannt machen, und diese sollst du verbergen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in palam facies
  choice: öffentlich bekannt machen
  rationale: Die Wendung bezeichnet, dass die Worte an die Öffentlichkeit gebracht werden; die gewählte Formulierung ist im modernen Deutschen klar und bewahrt den Gegensatz zu „verbergen“.
- source_word: abscondes
  choice: verbergen
  rationale: Gibt das bewusste Geheimhalten der betreffenden Worte direkt und würdig wieder.
theological_decisions:
- issue: Gegensatz zwischen öffentlich bestimmten und verborgenen Worten
  choice: „diese aber“ markiert zwei gegenübergestellte Gruppen von Worten
  alternative: „und diese“ ohne ausdrückliches Gegensatzsignal
  rationale: Das lateinische „et ... et“ verbindet die beiden Anweisungen, während ihr Inhalt einen deutlichen Kontrast bildet. „aber“ macht diesen natürlichen Gegensatz sichtbar, ohne ihn theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Futurformen des Lateinischen werden als gebietende Zukunft beziehungsweise Auftrag mit „sollst“ wiedergegeben.
