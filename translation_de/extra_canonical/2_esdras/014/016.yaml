source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'contigisse mala, iterum horum deteriora facientur : Quantum enim inualidum fit saeculum a senectute, tantum multiplicabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: de
  text: —noch Schlimmeres als dies wird erneut geschehen. Denn je schwächer die Welt durch ihr Alter wird, desto mehr werden sich die Übel vermehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deteriora
  choice: noch Schlimmeres
  rationale: Der substantivierte Komparativ bezeichnet »schlimmere Dinge«; die knappe deutsche Form wahrt die Steigerung gegenüber den zuvor genannten Übeln.
- source_word: facientur
  choice: wird … geschehen
  rationale: Die passive Form bedeutet hier »wird geschehen/werden« und darf nicht aktiv als »wird hervorbringen« wiedergegeben werden.
- source_word: iterum
  choice: erneut
  rationale: Gibt die Wiederholung beziehungsweise das erneute Eintreten wieder, ohne eine Ursache-Wirkung-Beziehung zu behaupten.
- source_word: saeculum
  choice: Weltzeit
  rationale: Im apokalyptischen Zusammenhang bezeichnet saeculum sowohl die gegenwärtige Weltordnung als auch ihr Zeitalter; »Weltzeit« bewahrt beide Aspekte.
- source_word: inualidum
  choice: schwächer
  rationale: Bezeichnet nachlassende Kraft beziehungsweise Gebrechlichkeit und passt zum Bild des Alterns.
- source_word: multiplicabunt
  choice: werden sich die Übel vermehren
  rationale: Das im Zusammenhang vorausgesetzte Subjekt mala wird im Deutschen ausdrücklich aufgenommen; die reflexive Form gibt das Zunehmen natürlich wieder.
theological_decisions:
- issue: Subjekt und Aussage von facientur
  choice: »noch Schlimmeres … wird geschehen«
  alternative: »die Übel werden noch Schlimmeres hervorbringen«
  rationale: deteriora ist das Subjekt der passiven Verbform facientur. Die Übersetzung wahrt das angekündigte eschatologische Geschehen und führt keine im Lateinischen nicht ausgesagte natürliche Verursachung durch frühere Übel ein.
- issue: Bild vom alternden saeculum
  choice: Das Bild der schwächer werdenden Weltzeit bleibt erhalten.
  alternative: Eine abstrakte Aussage wie »mit fortschreitender Zeit verschlechtert sich alles«
  rationale: Die Personifikation des alternden saeculum gehört zur apokalyptischen Bildsprache und sollte nicht rationalisierend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält den syntaktischen Anschluss an den vorausgehenden Vers; die Je-desto-Konstruktion bildet quantum … tantum idiomatisch ab.
