  rationale: Die kleine stilistische und terminologische Anpassung von „Weltzeit“ zu „Welt“ erhöht die Natürlichkeit und bewahrt zugleich das lateinische Bild eines alternden saeculum. Da keine erläuternde Fußnote mehr erforderlich ist, entfällt der Anker.
