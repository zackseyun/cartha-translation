review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt deteriora facientur zutreffend als erneutes Geschehen von Schlimmerem wieder und vermeidet die unhaltbare aktive Verursachungslesart. Die je–desto-Konstruktion entspricht quantum … tantum; das aus dem Kontext ergänzte Subjekt „die Übel“ bei multiplicabunt ist sachgerecht. Für saeculum ist hier jedoch „Welt“ die naheliegendere und im Bild einer alternden Schöpfungsordnung idiomatischere Wiedergabe als das im Deutschen weniger geläufige „Weltzeit“.
  naturalness: Der Satz ist flüssig und hat einen angemessen würdigen Ton. „Die Welt … durch ihr Alter“ klingt im modernen Standarddeutsch natürlicher als „die Weltzeit … durch ihr Alter“ und bewahrt die Personifikation.
  terminology: „Schlimmeres“, „Übel“, „Alter“ und „Welt“ sind kontextgerecht. Die Fußnote zu „Weltzeit“ wird mit der Änderung gegenstandslos; „Welt“ lässt die Bedeutung von saeculum im apokalyptischen Kontext ausreichend offen.
  issues:
  - severity: low
    issue: „Weltzeit“ ist hier unnötig fachsprachlich und semantisch enger als das lateinische saeculum.
    rationale: Saeculum kann zwar Weltzeit bzw. Zeitalter bezeichnen, doch das Bild des durch Alter geschwächten saeculum wird im Deutschen am natürlichsten und traditionsgerechtsten mit „Welt“ wiedergegeben. Die aktuelle Fußnote bietet nur „Zeitalter“ als Alternative und bildet den Aspekt der Weltordnung nicht klarer ab.
  revised_text: —noch Schlimmeres als dies wird erneut geschehen. Denn je schwächer die Welt durch ihr Alter wird, desto mehr werden sich die Übel vermehren.
