  verdict: revise
  source_fidelity: Der Satzanfang bleibt zutreffend als Fortsetzung eines vorher begonnenen Satzes klein geschrieben. »Höre, Israel, diese Worte« gibt »Audi, Israel, verba haec« genau wieder. Das erste »Peregrinantes« kann angemessen als »Ihr, die ihr in der Fremde lebt« wiedergegeben werden. Der anschließende Befund »pere-« ist jedoch nur der Anfang eines weiteren, nicht sicher ergänzbaren Wortes; die vorliegende Fassung gestaltet ihn zu einer vollständigen Wiederholung derselben deutschen Wendung aus und geht damit über den erhaltenen Text hinaus.
  naturalness: Die vorgeschlagene Fassung bleibt modernes, würdiges Standarddeutsch. Der abgebrochene Ausdruck »in der Fremd…« ist als sichtbar markierter Textabbruch verständlich; die Fußnote erläutert die ungewöhnliche Form.
  terminology: »in der Fremde lebt« ist für peregrinantes kontextoffen und vermeidet eine unnötige Festlegung auf einen rechtlichen Status (etwa »Fremdlinge«) oder bloßes Reisen. Die kollektive Anrede »Israel« und der Imperativ Singular »Höre« sind beizubehalten.
