translation:
  language: de
  text: 'das Volk und sagte: »Höre, Israel, diese Worte: Ihr, die ihr in der Fremde lebt, ihr, die ihr in der Fremd…«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene lateinische Text bricht hier mitten im nächsten Wort nach »pere-« ab; dessen Fortsetzung ist nicht erhalten.
    reason: Kennzeichnet den Wortabbruch präzise und stellt klar, dass die scheinbar ansetzende Wiederholung nicht als vollständig rekonstruierter Wortlaut zu verstehen ist.
lexical_decisions:
- source_word: Audi, Israel
  choice: Höre, Israel
  rationale: Bewahrt die direkte Anrede und den Imperativ des lateinischen Textes in einer natürlichen, würdigen deutschen Form.
- source_word: Peregrinantes
  choice: Ihr, die ihr in der Fremde lebt
  rationale: Gibt das substantivisch gebrauchte Partizip als direkte Anrede wieder und wahrt den Sinn des Lebens fern der Heimat, ohne ihn auf bloßes Reisen oder eine bestimmte rechtliche Stellung zu verengen.
- source_word: pere-
  choice: ihr, die ihr in der Fremde …
  rationale: Spiegelt den erkennbaren Ansatz einer Wiederholung, lässt den abgebrochenen Wortlaut aber ausdrücklich unvollständig, statt die verlorene Fortsetzung zu ergänzen.
theological_decisions:
- issue: Status der angesprochenen Israeliten als peregrinantes
  choice: in der Fremde lebt
  alternative: Fremdlinge / Wanderer
  rationale: Die Formulierung hält offen, ob Exil, Diaspora oder allgemeiner Aufenthalt fern der Heimat gemeint ist, und vermeidet eine unnötige theologische oder rechtliche Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdiger biblischer Direktheit. Der Vers setzt mitten in einem Satz ein; daher beginnt die Wiedergabe mit einem Kleinbuchstaben. Die unvollständige Wiederholung am Ende wird nicht stillschweigend ergänzt.
