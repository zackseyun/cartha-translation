  text: those who are to live in the last days may live.” And he answered me and said, “Go, gather the people, and say to them not to seek you
translation:
  language: de
  text: 'damit die, die in den letzten Tagen leben werden, leben können.« Und er antwortete mir und sagte: »Geh, versammle das Volk und sage ihnen, sie sollen dich nicht suchen'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuere ... uiuant
  choice: leben werden ... leben können
  rationale: Die Wiederholung von »leben« bleibt erhalten; der Konjunktiv »uiuant« wird im abhängigen Zwecksatz natürlich mit »leben können« wiedergegeben.
- source_word: in nouissimis
  choice: in den letzten Tagen
  rationale: Die substantivierte Wendung bezeichnet hier die Endzeit; »in den letzten Tagen« ist im Deutschen verständlich und entspricht dem Kontext.
- source_word: uadens
  choice: Geh
  rationale: Das lateinische Partizip hat imperativische Kraft und wird idiomatisch als unmittelbarer Befehl übersetzt.
- source_word: congrega populum
  choice: versammle das Volk
  rationale: Direkte und registergerechte Wiedergabe von »congrega« und »populum«.
- source_word: ut non te quaerant
  choice: sie sollen dich nicht suchen
  rationale: Der abhängige ut-Satz nach »sag ihnen« bezeichnet den Inhalt der Aufforderung; die deutsche Konstruktion bewahrt den negativen Auftrag.
theological_decisions:
- issue: Bedeutung von »in nouissimis«
  choice: in den letzten Tagen
  alternative: in der letzten Zeit
  rationale: Die pluralische Form und der eschatologische Zusammenhang sprechen für die geläufige, zugleich nicht weiter ausgedeutete Wendung »in den letzten Tagen«.
- issue: Funktion des wiederholten »leben«
  choice: Wiederholung beibehalten
  alternative: damit die Menschen der letzten Tage überleben können
  rationale: »Überleben« würde eine zusätzliche Bedeutung festlegen; die bewusste Spannung des lateinischen »uiuere ... uiuant« bleibt daher erhalten.
translation_notes:
  register: Moderner, würdiger Erzählstil. Da der Vers mitten im Satz beginnt und endet, bleiben Anfang und Schluss entsprechend fragmentarisch; die im Lateinischen implizite Personengruppe wird für verständliches Deutsch als »die, die …« ergänzt.
