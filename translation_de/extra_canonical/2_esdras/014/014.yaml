id: 2ES.14.14
reference: 2 Esdras 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: de
  text: Und lege die sterblichen Gedanken ab, wirf die menschlichen Lasten von dir, streife nun deine schwache Natur ab und schiebe die Gedanken beiseite, die dir am meisten zu schaffen machen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortales cogitationes
  choice: die sterblichen Gedanken
  rationale: Gibt die ungewöhnliche Verbindung des lateinischen Textes bewusst wörtlich wieder und bewahrt ihre mögliche Bedeutung als Gedanken eines Sterblichen beziehungsweise auf Vergängliches gerichtete Gedanken.
- source_word: pondera humana
  choice: die menschlichen Lasten
  rationale: Bewahrt das Bild von Belastungen, die zur menschlichen Existenz gehören.
- source_word: exue te
  choice: streife ... ab
  rationale: Erhält die Kleidungsmetapher des lateinischen exuere und klingt im Deutschen natürlich.
- source_word: infirmam naturam
  choice: deine schwache Natur
  rationale: Entspricht der anthropologischen Aussage des Ausgangstextes, ohne sie als Sünde, Leiblichkeit oder Sterblichkeit näher festzulegen.
- source_word: repone in unam partem
  choice: schiebe ... beiseite
  rationale: Gibt die räumliche Grundvorstellung idiomatisch wieder; ein wörtliches »lege auf eine Seite« wäre im Deutschen missverständlich.
- source_word: molestissima tibi cogitamenta
  choice: die Gedanken, die dir am meisten zu schaffen machen
  rationale: Gibt den Superlativ und die persönliche Belastung natürlich wieder, ohne die Gedanken enger als Sorgen oder Kummer zu bestimmen.
theological_decisions:
- issue: Aufforderung, die schwache Natur abzustreifen
  choice: Die Metapher bleibt unaufgelöst stehen.
  alternative: »Überwinde deine menschliche Schwäche«
  rationale: Die Alternative würde die bildhafte und möglicherweise eschatologische oder asketische Spannung des Textes interpretierend abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Imperative und die Abstreifmetapher wurden bewahrt; der Vers endet entsprechend der Quelle offen mit einem Komma.
