  source_fidelity: Die vier Imperative und ihre Reihenfolge entsprechen dem lateinischen Text genau. „sterbliche Gedanken“ bildet mortales cogitationes bewusst offen ab; „menschliche Lasten“, „schwache Natur“ und „Gedanken, die dir am meisten zu schaffen machen“ geben pondera humana, infirmam naturam und molestissima tibi cogitamenta ohne zusätzliche Ausdeutung wieder. Die Abstreifmetapher von exue te bleibt erhalten. Das abschließende Komma entspricht dem unvollständigen Satzanschluss der Vorlage.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die Imperativreihe ist klar und gut lesbar. „Sterbliche Gedanken“ ist im Deutschen markiert, aber als absichtlich wörtliche und mehrdeutigkeitserhaltende Wiedergabe hier vertretbar.
  terminology: Die anthropologisch und theologisch potenziell aufgeladene Formulierung „schwache Natur“ bleibt neutral und legt weder Sünde noch Leiblichkeit oder Sterblichkeit als alleinige Deutung fest. Die Wortwahl stimmt mit dem englischen Audit-Text überein, ohne von ihm abhängig zu sein.
