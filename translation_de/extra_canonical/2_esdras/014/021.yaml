  text: For your law has been burned, and therefore no one knows the things done by you
translation:
  language: de
  text: Denn dein Gesetz ist verbrannt. Deshalb weiß niemand, was von dir getan wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende lateinische Text bricht nach „was von dir“ ab; „getan wurde“ ergänzt den offenbar vorausgesetzten Sinn.
    reason: Kennzeichnet transparent die textliche Unvollständigkeit der angegebenen Quellengrundlage.
lexical_decisions:
- source_word: lex tua
  choice: dein Gesetz
  rationale: Die direkte Entsprechung bewahrt die persönliche Anrede und den Bezug auf Gottes Gesetz.
- source_word: incensa est
  choice: ist verbrannt worden
  rationale: Die Passivform des lateinischen Perfekts wird beibehalten; sie bezeichnet die erfolgte Zerstörung durch Feuer.
- source_word: propter quod
  choice: deshalb
  rationale: Gibt den kausalen Zusammenhang idiomatisch und klar wieder.
- source_word: quae a te
  choice: was du getan hast
  rationale: Das überlieferte Textstück bricht nach „a te“ ab. Die Formulierung folgt der im Konsultationstext bezeugten Ergänzung des sinngemäß erwarteten „facta sunt“ und gibt das lateinische Passiv in natürlichem Deutsch aktiv wieder.
theological_decisions:
- issue: Gegenstand des verlorenen Wissens
  choice: was du getan hast
  alternative: was von dir …
  rationale: Der vorgelegte lateinische Wortlaut ist am Versende unvollständig. Die gewählte Ergänzung bewahrt den Bezug auf Gottes Taten, ohne ihren Inhalt näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei kurze Hauptsätze bilden den lateinischen Ursache-Folge-Zusammenhang klar ab; die Fußnote macht die notwendige Ergänzung des unvollständigen Quelltexts sichtbar.
