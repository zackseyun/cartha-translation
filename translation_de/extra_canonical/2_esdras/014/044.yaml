  text: And in forty days ninety-four books were written[a].
translation:
  language: de
  text: Und innerhalb von vierzig Tagen wurden vierundneunzig Bücher geschrieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zahl ist in der überlieferten lateinischen Zeile textlich schwierig. Als Sinn des Kapitels ist weithin „vierundneunzig Bücher“ anerkannt; dies entspricht auch der Aufteilung in die öffentlich zugänglichen Schriften und die letzten siebzig, die für die Weisen aufbewahrt werden sollten.
    reason: textual_variant
lexical_decisions:
- source_word: in XL diebus
  choice: innerhalb von vierzig Tagen
  rationale: Die lateinische Wendung bezeichnet hier den Zeitraum, in dem die Niederschrift abgeschlossen wurde; „innerhalb von“ gibt diesen Sinn im modernen Deutsch natürlich wieder.
- source_word: libri
  choice: Bücher
  rationale: Die direkte und kontextuell passende Entsprechung für die einzelnen Schriften.
- source_word: DCCCClIIII
  choice: vierundneunzig
  rationale: 'Die überlieferte Zahl ist offenbar textlich gestört. Der anerkannte Zusammenhang des Kapitels verlangt insgesamt 94 Bücher: 24 zur öffentlichen Weitergabe und 70 zur Verwahrung für die Weisen.'
- source_word: Scripti sunt
  choice: wurden … geschrieben
  rationale: Das lateinische Passiv wird bewahrt; dadurch bleibt offen, wer außer Esra an der konkreten Niederschrift beteiligt war.
theological_decisions:
- issue: Umfang der offenbarten Schriften
  choice: vierundneunzig Bücher
  alternative: die überlieferte Zeichenfolge wörtlich als eine andere Zahl deuten
  rationale: Die Kapitelstruktur nennt anschließend 24 öffentlich zugängliche und 70 zurückzuhaltende Bücher, zusammen 94. Die textkritische Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Passiv des lateinischen Textes und die knappe Erzählweise bleiben erhalten. Das vorausgehende „tacebam“ gehört syntaktisch zum vorherigen Zusammenhang und wird entsprechend der vorgegebenen Versabgrenzung nicht aufgenommen.
