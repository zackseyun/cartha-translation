lexical_decisions:
- source_word: super inhabitantes in eo mala
  choice: über die Menschen, die auf ihr wohnen
  rationale: Der Vers beginnt als Satzfortsetzung aus dem vorherigen Kontext. Das lateinische „eo“ bezieht sich dem Sinn nach auf die Erde; daher steht im Deutschen das feminine Pronomen „ihr“. „mala“ gehört syntaktisch zum vorausgehenden Satz und wird hier nicht eigenständig wiederholt.
- source_word: Prolongabit enim magis ueritas
  choice: Denn die Wahrheit wird sich immer weiter entfernen
  rationale: Die ungewöhnliche lateinische Wendung bezeichnet hier ein zunehmendes Fernrücken bzw. Sich-Entziehen der Wahrheit. Die Wiedergabe wahrt den Gegensatz zu „adpropinquabit“.
- source_word: adpropinquabit mendacium
  choice: die Lüge wird näher kommen
  rationale: „mendacium“ wird konkret und allgemeinverständlich mit „Lüge“ wiedergegeben; „näher kommen“ bildet den räumlichen Kontrast zum Sich-Entfernen der Wahrheit ab.
- source_word: iam enim festinat aquila uenire
  choice: Schon eilt nämlich der Adler herbei
  rationale: „festinat ... uenire“ wird idiomatisch mit „eilt ... herbei“ wiedergegeben; „nämlich“ erhält die begründende bzw. erläuternde Funktion von „enim“.
- source_word: quam uidisti in uisionem
  choice: den du in der Vision gesehen hast
  rationale: Das bereinigte Latein hat eine nichtklassische Kasusverwendung; gemeint ist eindeutig der in der Vision gesehene Adler. „Vision“ ist im apokalyptischen Kontext präzise und geläufig.
theological_decisions:
- issue: Symbolische Bedeutung des Adlers
  choice: Das Symbol bleibt unaufgelöst als „der Adler“ stehen.
  alternative: Eine identifizierende Deutung, etwa auf ein bestimmtes Reich oder eine konkrete Macht, in den Text aufzunehmen.
  rationale: Der Vers verweist auf die zuvor gesehene Vision, erklärt das Symbol hier aber nicht. Eine Festlegung würde über die unmittelbare Quellenaussage hinausgehen.
- issue: Verhältnis von Wahrheit und Lüge
  choice: Die personifizierende, räumliche Gegenüberstellung bleibt erhalten.
  alternative: Die Aussage abstrakt als gesellschaftlichen Wahrheitsverlust zu paraphrasieren.
  rationale: Der lateinische Text lässt Wahrheit und Lüge gegensätzlich fern- bzw. näher rücken; diese theologische und rhetorische Spannung soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang wird bewusst als Fortsetzung des vorherigen Satzes belassen. Die Bildsprache ist klar und direkt, ohne das Adlersymbol auszudeuten.
