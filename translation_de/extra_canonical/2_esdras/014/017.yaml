  text: upon those who dwell in it. For truth will withdraw farther away, and falsehood will draw near. For already the eagle that you saw in the vision is hastening to come.”
translation:
  language: de
  text: über die Menschen, die auf ihr wohnen. Denn die Wahrheit wird sich immer weiter entfernen, und die Lüge wird näher kommen. Schon eilt nämlich der Adler herbei, den du in der Vision gesehen hast.“
