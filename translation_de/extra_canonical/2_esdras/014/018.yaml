  text: Then I answered and said before you[a], Lord, "Behold, I will go,"
translation:
  language: de
  text: 'Da antwortete ich und sagte vor dir, Herr: »Siehe doch, ich werde fortgehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  choice: Da antwortete ich und sagte
  rationale: Gibt die lateinische Doppelwendung vollständig wieder; »Da« stellt den erzählerischen Anschluss natürlicher her als ein bloßes »Und«.
- source_word: coram te
  choice: vor dir
  rationale: Entspricht der räumlich beziehungsweise relational offenen Bedeutung von »coram« und erhält die direkte Anrede.
- source_word: Ecce
  choice: sieh
  rationale: Eine natürliche, würdige deutsche Aufforderung, die die aufmerksamkeitslenkende Funktion von »ecce« bewahrt.
- source_word: enim
  choice: nicht eigens wiedergegeben
  rationale: Das lateinische »enim« wirkt hier diskursverknüpfend; ein ausdrückliches »denn« wäre in der kurzen deutschen Äußerung unnatürlich und könnte eine nicht ausgeführte Begründung erwarten lassen.
- source_word: ego abibo
  choice: ich werde fortgehen
  rationale: Bewahrt sowohl das ausdrücklich gesetzte Subjekt als auch die futurische Aussage von »abibo«; »fortgehen« ist im Deutschen natürlicher und konkreter als »weggehen« in diesem würdigen Register.
theological_decisions:
- issue: Bezug von »coram te, domine«
  choice: '»vor dir: Herr« als direkte Anrede'
  alternative: »vor dir, Herr« ohne syntaktische Verdeutlichung
  rationale: Der lateinische Text richtet sowohl »te« als auch den Vokativ »domine« an dieselbe angesprochene Person. Die Interpunktion macht die deutsche Satzstruktur lesbar, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die etwas formelhafte Doppelung »antwortete … und sagte« bleibt aus Quellennähe erhalten; keine Fußnote ist erforderlich.
