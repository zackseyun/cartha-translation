source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et misi eum et eduxit populum meum de Aegypto, et adduxi eum super montem Sina et detinui eum apud me diebus multis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: de
  text: Und ich sandte ihn, und er führte mein Volk aus Ägypten heraus. Ich brachte ihn auf den Berg Sinai hinauf und behielt ihn viele Tage bei mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misi eum
  choice: ich sandte ihn
  rationale: Gibt die göttliche Beauftragung schlicht und formal nah am lateinischen Wortlaut wieder.
- source_word: eduxit populum meum de Aegypto
  choice: er führte mein Volk aus Ägypten heraus
  rationale: Bewahrt Subjektwechsel, Besitzbezug und Auszugsbewegung des lateinischen Textes.
- source_word: adduxi eum super montem Sina
  choice: ich brachte ihn auf den Berg Sinai hinauf
  rationale: Drückt sowohl das Heranführen als auch die Aufwärtsbewegung zu dem Berg natürlich aus.
- source_word: detinui eum apud me
  choice: ich behielt ihn bei mir
  rationale: Gibt das längere Verweilen in Gottes Gegenwart wieder, ohne dem Verb eine weitergehende theologische Deutung aufzuerlegen.
- source_word: diebus multis
  choice: viele Tage
  rationale: Direkte und idiomatische Entsprechung.
theological_decisions:
- issue: Verteilung der Handlungen zwischen Mose und Gott
  choice: Mose führt das Volk heraus; Gott bringt Mose auf den Sinai und behält ihn bei sich.
  alternative: Alle Handlungen könnten stilistisch stärker miteinander verschmolzen werden.
  rationale: Die wechselnden Verbsubjekte des lateinischen Textes werden ausdrücklich bewahrt und nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; klare Satzgliederung bei enger Bindung an die lateinische Vorlage.
