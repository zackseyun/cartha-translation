  terminology: „Dornbusch“, „Esra“ und die Anrede „Herr“ sind angemessen. „Herr“ wahrt die nicht näher bestimmte Anrede domine; weder Gottesidentität noch eine bestimmte theologische Deutung wird hinzugefügt.
