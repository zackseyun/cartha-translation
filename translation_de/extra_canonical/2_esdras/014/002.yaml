  source_fidelity: 'Der Entwurf gibt den lateinischen Sinn insgesamt zuverlässig wieder: ecce bleibt als aufmerksamkeitslenkende Einleitung erhalten, die Stimme kommt aus dem Dornbusch zu Esra, die doppelte Anrede sowie „Herr“ sind bewahrt, und der abschließende Doppelpunkt entspricht der Fortsetzung der Rede im folgenden Vers. Die Identität der Stimme wird zutreffend nicht ausgelegt.'
