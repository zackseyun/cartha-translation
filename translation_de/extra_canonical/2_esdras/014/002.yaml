  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: de
  text: 'Und sieh, aus dem Dornbusch kam eine Stimme zu mir und sagte: »Esra, Esra!« Ich antwortete: »Hier bin ich, Herr.« Dann stand ich auf, und die Stimme sagte zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: und sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter des lateinischen Ausdrucks in würdiger, gut verständlicher Sprache.
- source_word: uox exiuit contra me de rubo
  choice: aus dem Dornbusch drang eine Stimme zu mir
  rationale: Gibt Herkunft und Richtung der Stimme natürlich wieder; »drang … zu mir« bewahrt die Bewegungsvorstellung von exiuit contra me, ohne die im Deutschen missverständliche wörtliche Wiedergabe »gegen mich«.
- source_word: ecce ego, domine
  choice: Hier bin ich, Herr
  rationale: Entspricht der üblichen Bereitschaftsformel und erhält die Anrede domine, ohne die Identität des Angeredeten näher festzulegen.
- source_word: surrexi super pedes meos
  choice: stellte ich mich auf die Füße
  rationale: Bewahrt das konkrete Bild des lateinischen Textes in natürlichem Deutsch.
theological_decisions:
- issue: Identität der Stimme und Bezug der Anrede »Herr«
  choice: Die Stimme wird nicht ausdrücklich mit Gott identifiziert; »Herr« bleibt als Anrede stehen.
  alternative: Die Stimme ausdrücklich als Gottes Stimme bezeichnen oder »mein Herr« schreiben.
  rationale: Der lateinische Vers nennt nur eine Stimme aus dem Dornbusch. Eine nähere Identifizierung würde eine im Vers selbst nicht ausgesprochene Deutung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Esra, Esra« und der Doppelpunkt am Schluss bleiben erhalten, weil der folgende Vers die angekündigte Rede fortsetzt.
