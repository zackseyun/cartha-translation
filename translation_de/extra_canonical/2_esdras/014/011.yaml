id: 2ES.14.11
reference: 2 Esdras 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: XII enim partibus diuisum est saeculum, et transierunt eius X iam et dimidium xmae partis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: de
  text: Denn die Weltzeit ist in zwölf Abschnitte eingeteilt, und zehn ihrer Abschnitte sind bereits vergangen, dazu die Hälfte des zehnten Abschnitts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere alte Übersetzungen lesen hier „neun“ statt „zehn“. Das passt zu der anschließenden Hälfte des zehnten Abschnitts und zu Vers 12, wonach noch zweieinhalb Abschnitte verbleiben.
    reason: textual_variant
lexical_decisions:
- source_word: saeculum
  choice: Weltzeit
  rationale: Im Zusammenhang bezeichnet das Wort den gegenwärtigen Weltlauf beziehungsweise das Zeitalter als zeitlich begrenzte Größe; „Weltzeit“ gibt diesen zeitlichen Sinn klar wieder.
- source_word: partibus / partis
  choice: Abschnitte / Abschnitts
  rationale: Gemeint sind die Teile, in welche die Weltzeit gegliedert ist. „Abschnitte“ klingt im Deutschen bei einer Zeiteinteilung natürlicher als das allgemeinere „Teile“.
- source_word: transierunt
  choice: sind … vergangen
  rationale: Die Form bezeichnet bereits abgelaufene Zeitabschnitte; „vergangen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: X … et dimidium xmae partis
  choice: zehn … dazu die Hälfte des zehnten Abschnitts
  rationale: Die Übersetzung folgt dem vorgelegten lateinischen Text mit X („zehn“) und xmae („des zehnten“), ohne die daraus entstehende rechnerische Spannung stillschweigend zu beseitigen.
theological_decisions:
- issue: Zahl der bereits vergangenen Abschnitte
  choice: zehn
  alternative: neun
  rationale: Der vorgelegte lateinische Haupttext liest ausdrücklich X. Mehrere alte Übersetzungen und der Zusammenhang sprechen jedoch für IX; diese textkritische Alternative wird deshalb in einer Fußnote offengelegt, nicht kommentarlos in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Zahlenfolge des lateinischen Textes bleibt im Haupttext erhalten; die wahrscheinlich ältere Lesart wird transparent in der Fußnote genannt.
