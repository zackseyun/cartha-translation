  text: tradas eos sapientibus de populo tuo; In his enim est uena intellectus et sapientiae fons et scientiae flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/047.yaml
  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
translation:
  language: de
  text: damit du sie den Weisen aus deinem Volk übergibst. Denn in ihnen ist die Ader der Einsicht[a], die Quelle der Weisheit und der Strom der Erkenntnis.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Quellader der Einsicht.'
    reason: »Vena« kann neben »Ader« auch eine wasserführende Ader beziehungsweise Quelle bezeichnen; die Lesart bleibt daher bildlich mehrdeutig.
lexical_decisions:
- source_word: tradas
  choice: damit du … übergibst
  rationale: Der Konjunktiv hängt syntaktisch vom vorangehenden »ut« in Vers 46 ab; die deutsche Fassung wahrt diesen fortlaufenden Zwecksatz.
- source_word: sapientibus de populo tuo
  choice: den Weisen aus deinem Volk
  rationale: Gibt den Dativ »sapientibus« und die Zugehörigkeitsangabe »de populo tuo« klar und natürlich wieder.
- source_word: uena intellectus
  choice: die Ader der Einsicht
  rationale: Bewahrt das eigenständige lateinische Bild von »vena« und unterscheidet es von »fons« im folgenden Ausdruck.
- source_word: sapientiae fons
  choice: die Quelle der Weisheit
  rationale: Direkte und idiomatische Wiedergabe der Metapher.
- source_word: scientiae flumen
  choice: der Strom der Erkenntnis
  rationale: Bewahrt die Steigerung und das Wasserbild von »flumen«; »Erkenntnis« passt im gehobenen biblischen Register zu »scientia«.
theological_decisions:
- issue: Bezug von »in his«
  choice: in ihnen
  alternative: in diesen Schriften
  rationale: Das Pronomen bleibt wie im lateinischen Text formal auf die zuvor erwähnten Bücher bezogen, ohne die Referenz im Vers ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kleingeschriebene, mit »damit« fortgesetzte Versanfang macht die syntaktische Abhängigkeit von Vers 46 sichtbar. Die drei parallelen Metaphern bleiben deutlich voneinander unterschieden.
