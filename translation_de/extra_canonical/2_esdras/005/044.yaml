review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die beiden Satzglieder des Lateinischen zuverlässig wieder. »Die Schöpfung« ist für creatura im vorliegenden Parallelismus gut begründet; die Fußnote wahrt den möglichen individualen Sinn. »schneller voraneilen als« bildet festinare super creatorem als Vergleich ab, und »alle, die in ihm geschaffen wurden, auf einmal tragen« gibt sustinere ... qui in eo creati sunt in unum angemessen wieder.
  naturalness: Der Text ist in modernem Standarddeutsch verständlich und zugleich würdig. »Voraneilen« und »tragen« sind leicht gehoben, aber für den prophetisch-apokalyptischen Registerzusammenhang natürlich. Die Satzstruktur bleibt klar.
  terminology: »Schöpfung«, »Schöpfer« und »Zeitalter« sind konsistent und sachgerecht. »Zeitalter« hält die zeitlich-weltliche Offenheit von saeculum besser als eine einengende Wiedergabe mit »Welt«. Die Fußnoten erläutern echte lexikalische beziehungsweise syntaktische Möglichkeiten, ohne den Haupttext unnötig zu relativieren.
