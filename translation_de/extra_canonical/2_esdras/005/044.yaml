source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'spondit ad me et dixit : non potest festinare creatura super creatorem, nec sustinere saeculum qui in eo creati sunt in unum. Et dixi : quomodo dixisti seruo tuo, quoniam uiuificans uiuifi-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: de
  text: 'Und er antwortete mir und sagte: »Die Schöpfung[a] kann nicht schneller voraneilen als der Schöpfer[b], und das Zeitalter kann nicht alle, die in ihm geschaffen wurden, auf einmal tragen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Geschöpf« beziehungsweise »Das Geschaffene«.'
    reason: creatura kann sowohl ein einzelnes Geschöpf als auch die Schöpfung insgesamt bezeichnen.
  - marker: b
    text: 'Oder: »kann dem Schöpfer nicht vorauseilen«.'
    reason: super kann mit festinare vergleichend (»schneller als«) oder bildhaft als ein Vorauseilen verstanden werden.
lexical_decisions:
- source_word: creatura
  choice: die Schöpfung
  rationale: Das lateinische Wort kann ein einzelnes Geschöpf oder die Schöpfung als geschaffene Ordnung bezeichnen. Der parallele Hinweis auf das Zeitalter und alle darin Geschaffenen spricht hier für den kollektiven Sinn.
- source_word: festinare super creatorem
  choice: schneller voraneilen als der Schöpfer
  rationale: festinare bezeichnet ein Eilen oder Voraneilen; super ist im Zusammenhang am ehesten vergleichend zu verstehen. Die Formulierung wahrt zugleich das Bild, dass die Schöpfung dem Schöpfer nicht voraus sein kann.
- source_word: saeculum
  choice: das Zeitalter
  rationale: saeculum bezeichnet hier die gegenwärtige Weltzeit beziehungsweise den zeitlichen Weltlauf, nicht bloß einen kurzen Zeitabschnitt.
- source_word: sustinere ... in unum
  choice: alle ... auf einmal tragen
  rationale: sustinere hat den Sinn von tragen, aushalten oder aufnehmen; in unum bedeutet hier, dass alle zugleich vorhanden wären.
theological_decisions:
- issue: Verhältnis von Schöpfung, Schöpfer und zeitlichem Weltlauf
  choice: Die Aussage bleibt als Begrenzung der geschaffenen Ordnung gegenüber dem Schöpfer formuliert.
  alternative: Die Aussage als abstrakte Lehre über göttliche Vorherbestimmung oder Endzeitabläufe auslegen.
  rationale: Der lateinische Text behauptet unmittelbar nur, dass das Geschaffene den Schöpfer nicht überholen kann und das Zeitalter nicht alle Geschaffenen zugleich tragen kann; weitergehende dogmatische Festlegungen wären importiert.
translation_notes:
  register: Moderne, würdige Standardsprache. »Voraneilen« erhält das Bewegungsbild des lateinischen festinare, während »tragen« die Belastungs- und Fassungsbedeutung von sustinere knapp wiedergibt.
