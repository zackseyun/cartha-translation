  to: Denn konntest du nicht alle zugleich erschaffen – die, die bereits geschaffen worden sind, die, die jetzt sind, und die, die künftig sein werden –, damit du dein Gericht schneller zeigst?
  rationale: Die einzige Änderung entfernt die nicht im lateinischen Text ausgedrückte Einschränkung auf „leben“ und bewahrt so die dreigliedrige, absichtlich knappe Zeitfolge der Quelle. Die übrigen Formulierungen können bestehen bleiben.
