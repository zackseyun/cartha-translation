base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: de
  text: Denn konntest du nicht alle zugleich erschaffen – die, die bereits geschaffen worden sind, die, die jetzt sind, und die, die künftig sein werden –, damit du dein Gericht schneller zeigst?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nec enim
  choice: Denn … nicht
  rationale: Gibt sowohl die verneinte Frage als auch die begründende beziehungsweise anknüpfende Funktion von „enim“ natürlich wieder.
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: die, die bereits geschaffen worden sind, die, die jetzt leben, und die, die künftig leben werden
  rationale: Bewahrt die drei zeitlichen Gruppen; bei „qui sunt“ und „qui futuri sunt“ macht „leben“ im Deutschen den Bezug auf Menschen natürlich verständlich, ohne die zeitliche Spannung aufzulösen.
- source_word: in unum
  choice: alle zugleich
  rationale: Gibt den Gedanken wieder, sämtliche Gruppen zu ein und demselben Zeitpunkt zu erschaffen.
- source_word: iudicium tuum ostendas
  choice: dein Gericht … zeigst
  rationale: Bleibt nahe bei „ostendere“ und lässt offen, ob „iudicium“ den Gerichtsvollzug, das Gerichtsgeschehen oder Gottes richterliches Urteil bezeichnet.
theological_decisions:
- issue: Gottes Fähigkeit und der Zeitpunkt des Gerichts
  choice: konntest du nicht … erschaffen
  alternative: hättest du nicht … erschaffen können
  rationale: Die Formulierung bewahrt die direkte Frage nach Gottes Fähigkeit und folgt dem lateinischen Imperfekt „poteras“, ohne aus der Frage ausdrücklich eine irreale Rückschau zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang „Denn“ erhält den argumentativen Anschluss des lateinischen „enim“. Die im englischen Konsultationstext stehende Redeeinleitung ist im angegebenen lateinischen Verswortlaut nicht belegt und wurde daher nicht übernommen.
