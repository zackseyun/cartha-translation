source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dices ad eam : decem si paris, quare per tempus ? roga ergo eam ut det decem in unum. Et dixi : non utique poterit, sed'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/046.yaml
  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: de
  text: 'Du wirst zu ihr sagen: »Wenn du zehn gebierst, warum dann im Lauf der Zeit? Bitte sie also, zehn auf einmal zur Welt zu bringen.« Und ich sagte: »Das kann sie gewiss nicht, aber …«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: Du wirst zu ihr sagen
  rationale: Gibt Futur und weiblichen Bezug des lateinischen Ausdrucks direkt wieder, ohne ein im Ausschnitt nicht ausdrücklich genanntes Bezugswort zu ergänzen.
- source_word: decem si paris
  choice: Wenn du zehn gebierst
  rationale: Bewahrt die direkte Anrede und die knappe Ausdrucksweise des Lateins.
- source_word: per tempus
  choice: im Lauf der Zeit
  rationale: Bezeichnet eine zeitliche Verteilung, ohne stärker deutend »nach und nach« oder »in Abständen« einzusetzen.
- source_word: roga ergo eam
  choice: Bitte sie also
  rationale: Roga kann »bitten« oder »fragen« bedeuten; mit folgendem ut-Satz ist »bitten« im Deutschen idiomatisch.
- source_word: det decem in unum
  choice: zehn auf einmal zur Welt zu bringen
  rationale: Det wird im Geburtskontext sinngemäß wiedergegeben; in unum bezeichnet hier das gleichzeitige Geschehen.
- source_word: non utique poterit
  choice: Das kann sie gewiss nicht
  rationale: Bewahrt die nachdrückliche Verneinung von utique und die modale Aussage von poterit.
- source_word: sed
  choice: aber …
  rationale: Die Auslassungspunkte machen sichtbar, dass der Satz im vorliegenden Vers bzw. Fragment abbricht und weiterführt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unbestimmte weibliche Referenz von »eam« bleibt erhalten; ein ergänztes »Gebärmutter einer Frau« würde über den vorgelegten lateinischen Wortlaut hinausgehen. Der Wechsel von direkter Anrede (»du«) zu dritter Person (»sie«) folgt dem Quelltext.
