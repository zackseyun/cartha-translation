source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnium terrarum orbis elegisti tibi foveam unam, et ex omnibus floribus orbis elegisti tibi lilium unum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/024.yaml
  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: de
  text: Und aus allen Ländern der Welt hast du dir eine Grube[a] erwählt, und aus allen Blumen der Welt hast du dir eine einzige Lilie erwählt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Vertiefung“ beziehungsweise „eine Höhlung“.'
    reason: Das lateinische „fovea“ hat einen Bedeutungsbereich von Grube über Vertiefung bis Höhlung; die ungewöhnliche Lesart soll transparent bleiben.
lexical_decisions:
- source_word: foveam unam
  choice: eine Grube
  rationale: „Fovea“ bezeichnet gewöhnlich eine Grube, Vertiefung oder Höhlung. Die wörtliche, im Zusammenhang auffällige Bildsprache des überlieferten lateinischen Textes bleibt erhalten.
- source_word: lilium unum
  choice: eine einzige Lilie
  rationale: „Unum“ hebt hier die eine aus allen Blumen erwählte Lilie hervor; „eine einzige“ gibt diesen Auswahlkontrast im Deutschen natürlich wieder.
- source_word: elegisti tibi
  choice: hast du dir … erwählt
  rationale: Die reflexive Nuance von „tibi“ und der feierliche Auswahlcharakter von „eligere“ werden bewahrt.
theological_decisions:
- issue: Deutung der erwählten Grube und Lilie
  choice: Die Bilder werden ohne Identifizierung wiedergegeben.
  alternative: Die Bilder ausdrücklich auf ein Land, einen Ort oder ein Volk beziehen.
  rationale: Der Vers selbst erklärt die Bildsprache nicht. Eine konkrete theologische Zuordnung würde die genuine Offenheit des Textes einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die wiederholte Erwählungsformel des lateinischen Textes bleiben erhalten; die ungewöhnliche Metapher wird nicht geglättet.
