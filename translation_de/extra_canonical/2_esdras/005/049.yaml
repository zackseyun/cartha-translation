  source_fidelity: 'Der Vergleich ist im Entwurf im Kern zutreffend wiedergegeben: „infans“ und die gealterte weibliche Person bilden die beiden Lebensphasen, „parit“ wird sinnvoll expliziert, und das negierte „adhuc“ kann hier natürlich mit „nicht mehr“ ausgedrückt werden. Der in der angegebenen lateinischen Quelle anschließende Satz „Et interrogaui et dixi: cum iam dederis mihi uiam, loquar“ fehlt jedoch vollständig und muss ergänzt werden.'
  naturalness: „Ein kleines Kind“ und die Wiederholung von „gebiert“ sind verständlich und registergerecht. „Eine alt gewordene Frau“ ist möglich, aber „eine Frau, die alt geworden ist“ klingt im modernen Standarddeutsch weniger formelhaft. „Weltzeit“ bewahrt die beabsichtigte Mehrdeutigkeit von „saeculum“; „geordnet“ ist für „disposui“ hier gut vertretbar.
  terminology: Die weibliche Bezugnahme bei „ea quae senuit“ ist sachlich begründet. „Weltzeit“ ist als bewusst mehrdeutige Wiedergabe von „saeculum“ beizubehalten. Der englische Audit-Text bestätigt die Ellipse beim zweiten „parit“, erfasst aber den im bereitgestellten lateinischen Text folgenden Fragesatz nicht.
