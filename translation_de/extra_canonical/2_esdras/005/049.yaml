source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'admodum enim infans non parit nec ea quae senuit adhuc, sic ego disposui a me creatum saeculum. Et interrogaui et dixi : cum iam dederis mihi uiam, loquar'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: de
  text: 'Denn wie ein kleines Kind keine Kinder gebiert und eine Frau, die alt geworden ist, nicht mehr gebiert, so habe ich die von mir geschaffene Weltzeit geordnet. Und ich fragte und sagte: Da du mir nun den Weg gewiesen hast, will ich reden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: infans
  choice: ein kleines Kind
  rationale: Gibt den Gegensatz zwischen dem frühesten und dem späten Lebensalter natürlich wieder; das lateinische Wort bezeichnet ein sehr junges Kind.
- source_word: parit
  choice: Kinder gebiert
  rationale: Das Verb bezeichnet hier das Gebären; „Kinder“ wird im Deutschen zur natürlichen Verdeutlichung des im Lateinischen impliziten Objekts ergänzt.
- source_word: ea quae senuit
  choice: eine alt gewordene Frau
  rationale: Das feminine Pronomen und der Zusammenhang des Gebärens verlangen eine weibliche Bezugsperson; die Formulierung bewahrt den Zustandswechsel des Verbs „senescere“.
- source_word: adhuc
  choice: nicht mehr
  rationale: Im negierten Satz drückt „adhuc“ aus, dass die Fähigkeit im hohen Alter nicht länger besteht.
- source_word: disposui
  choice: geordnet
  rationale: Bewahrt den Gedanken einer absichtlichen zeitlichen Ordnung, der im Kontext der gestuften Schöpfung zentral ist.
- source_word: saeculum
  choice: Weltzeit
  rationale: Das Wort kann sowohl „Welt“ als auch „Zeitalter“ bezeichnen; „Weltzeit“ hält hier beide Aspekte zusammen und passt zur zeitlichen Ordnung der Schöpfung.
theological_decisions:
- issue: Bedeutung von „saeculum“
  choice: Weltzeit
  alternative: Welt; Zeitalter
  rationale: Der Kontext verbindet die geschaffene Welt mit ihrer zeitlichen Entfaltung. „Weltzeit“ vermeidet eine vorschnelle Festlegung auf nur den räumlichen oder nur den zeitlichen Sinn.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „gebiert“ wird beibehalten, weil sie die elliptische lateinische Parallelkonstruktion eindeutig und gut verständlich wiedergibt.
