  rationale: Der Text wird ausschließlich um den in der Quellenvorgabe enthaltenen, bisher ausgelassenen Schlusssatz ergänzt. Die bestehende Deutung von „saeculum“ als „Weltzeit“ und von negiertem „adhuc“ als „nicht mehr“ wird beibehalten. „Den Weg gewiesen“ gibt „dederis mihi uiam“ idiomatisch wieder, ohne die genaue Art der erbetenen Erlaubnis oder Gelegenheit auszuinterpretieren.
