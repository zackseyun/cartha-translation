source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et mulieres parient menstruata monstra. Et in dulcibus aquis salsae inuenientur, et amici omnes semetipsos expugnabunt, et abscondetur tunc sensus, et intellectus separabitur in promptuarium suum, Et queretur a multis et non inuenietur, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/009.yaml
  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: de
  text: Und Frauen werden missgestaltete Wesen gebären, die mit Menstruation verbunden sind.[a] Und in Süßgewässern wird man Salzwasser finden, und alle Freunde werden gegeneinander Krieg führen. Dann wird der Verstand verborgen sein, und die Einsicht wird sich in ihre Vorratskammer zurückziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Wendung menstruata monstra ist dunkel. Menstruata stimmt grammatisch mit monstra („missgestaltete Wesen“ bzw. „Ungeheuer“) überein; wie die Verbindung mit Menstruation genau zu verstehen ist, lässt der erhaltene lateinische Text offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: menstruata monstra
  choice: während ihrer Monatsblutung missgestaltete Wesen
  rationale: Die lateinische Wortverbindung ist ungewöhnlich und unsicher. Die Übersetzung bewahrt sowohl den Bezug zur Menstruation als auch den Gedanken außergewöhnlicher, missgestalteter Geburten, ohne eine im Lateinischen nicht gesicherte medizinische Präzision vorzutäuschen.
- source_word: dulcibus aquis salsae
  choice: in Süßgewässern … Salzwasser
  rationale: Gibt den Gegensatz von dulcis und salsus in natürlichem modernem Deutsch wieder; das ergänzte „Wasser“ ist aus dem substantivierten lateinischen Adjektiv salsae zu erschließen.
- source_word: semetipsos expugnabunt
  choice: werden gegeneinander Krieg führen
  rationale: Bewahrt die wechselseitige Feindschaft und die kriegerische Stärke von expugnare, ohne zwingend einen erfolgreichen Sieg oder eine vollständige Vernichtung auszudrücken.
- source_word: sensus
  choice: Verstand
  rationale: Sensus kann Wahrnehmung, Sinn oder verständiges Urteilsvermögen bezeichnen. „Verstand“ passt hier zum Parallelismus mit intellectus, ohne beide Begriffe gleichzusetzen.
- source_word: intellectus
  choice: Einsicht
  rationale: Unterscheidet intellectus von sensus und gibt die Fähigkeit des Erkennens in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: promptuarium suum
  choice: ihre Vorratskammer
  rationale: Eine konkrete Wiedergabe der Lager- oder Vorratskammermetapher; das Possessivpronomen bezieht sich auf die personifizierte Einsicht.
theological_decisions:
- issue: Personifizierung geistiger Fähigkeiten
  choice: Verstand und Einsicht bleiben als handelnde beziehungsweise verborgene Größen personifiziert.
  alternative: Die Aussage als bloßen Verlust menschlicher Vernunft paraphrasieren.
  rationale: Die bildhafte Spannung des lateinischen Textes—verborgener sensus und in die eigene Kammer zurückweichender intellectus—soll nicht durch eine erklärende Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Bildsprache. Der Fußnotenmarker steht unmittelbar bei der dunklen Wendung, auf die er sich bezieht. Der nach „promptuarium suum“ folgende lateinische Satzanfang gehört in der überlieferten Versgliederung zum nächsten Vers und wurde daher hier nicht aufgenommen.
