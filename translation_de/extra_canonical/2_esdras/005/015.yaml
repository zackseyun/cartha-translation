source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborauit, ut deficeret. Et tenuit me qui uenit angelus, qui loquebatur in me, et confortauit me et statuit me super pedes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/015.yaml
  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: de
  text: Es mühte sich ab, sodass es zu versagen drohte. Und der Engel, der gekommen war und in mir redete, ergriff mich, stärkte mich und stellte mich auf die Füße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: Es mühte sich ab, bis es versagte
  rationale: Die unbestimmte Subjektform des lateinischen Textes bleibt gewahrt; „bis“ gibt die resultative Zuspitzung von ut wieder, ohne ein Subjekt wie „Seele“ ergänzend einzuführen.
- source_word: tenuit me
  choice: ergriff mich
  rationale: „Ergriff“ gibt das körperliche Fassen in diesem Zusammenhang natürlich und prägnant wieder.
- source_word: loquebatur in me
  choice: in mir redete
  rationale: Die auffällige Präposition in wird bewusst nicht zu „mit mir“ geglättet; dadurch bleibt die mögliche innere oder vermittelte Redeweise offen.
- source_word: confortauit me
  choice: stärkte mich
  rationale: Direkte und idiomatische Entsprechung für körperliche oder innere Kräftigung.
- source_word: statuit me super pedes
  choice: stellte mich auf die Füße
  rationale: Bewahrt das konkrete Bild des lateinischen Ausdrucks in natürlichem Deutsch.
theological_decisions:
- issue: Nicht genanntes Subjekt von laborauit
  choice: Neutrales „Es“ ohne nähere Bestimmung
  alternative: „Meine Seele“ oder ein aus dem Kontext erschlossenes Subjekt
  rationale: Der vorgelegte lateinische Wortlaut nennt das Subjekt nicht; eine ausdrückliche Identifizierung würde die genuine Unbestimmtheit beseitigen.
- issue: Bedeutung von loquebatur in me
  choice: „in mir redete“
  alternative: „mit mir redete“ oder „zu mir redete“
  rationale: Die wörtlich ungewöhnliche Formulierung kann eine theologisch bedeutsame innere Rede andeuten. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend auf gewöhnliche Gesprächssprache festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an den lateinischen Wortlaut. Die ungewöhnliche Wendung „in mir redete“ ist absichtlich erhalten; keine interpretierende Ergänzung eines Subjekts.
