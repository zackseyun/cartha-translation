id: 2ES.5.4
reference: 2 Esdras 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: de
  text: Doch wenn der Höchste dir gewährt, am Leben zu bleiben, wirst du nach der dritten Erschütterung[a] sehen, wie plötzlich die Sonne bei Nacht und der Mond bei Tag aufleuchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere alte Textzeugen lassen hier auf die »dritte Trompete« schließen.
    reason: Die lateinische Überlieferung hat turbatam („erschüttert“ bzw. sinngemäß „Erschütterung“); Tochterversionen stützen dagegen eine Lesart, die auf „Trompete“ zurückgeht.
lexical_decisions:
- source_word: Altissimus
  choice: der Höchste
  rationale: Die geläufige und würdevolle deutsche Wiedergabe des lateinischen Gottesprädikats.
- source_word: dederit … vivere
  choice: dir gewährt, am Leben zu bleiben
  rationale: Gibt die lateinische Konstruktion natürlich wieder und bewahrt den Gedanken, dass weiteres Leben vom Höchsten gewährt wird.
- source_word: post tertiam turbatam
  choice: nach der dritten Erschütterung
  rationale: Folgt dem überlieferten lateinischen turbatam und gibt den Sinn eines Aufruhrs oder einer Erschütterung wieder, ohne die textkritische Alternative stillschweigend in den Haupttext einzusetzen.
- source_word: relucescet subito
  choice: plötzlich … aufleuchten
  rationale: Bildet sowohl das plötzliche Eintreten als auch das ungewöhnliche Leuchten der Himmelskörper idiomatisch ab.
- source_word: noctu … interdie
  choice: bei Nacht … bei Tag
  rationale: Natürliche, knappe Entsprechung der zeitlichen Adverbien.
theological_decisions:
- issue: Textkritische Deutung von turbatam
  choice: Erschütterung im Haupttext
  alternative: Trompete
  rationale: Der vorgelegte lateinische Text liest turbatam. Die Lesart „Trompete“ kann durch Tochterversionen und eine Konjektur gestützt werden, gehört aber als textkritische Alternative in die Fußnote, nicht unangekündigt in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Latein, wird aber durch „sehen, wie“ idiomatisch geglättet. Der Fußnotenmarker steht unmittelbar bei der tatsächlich strittigen Wendung.
