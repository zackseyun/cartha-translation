  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: de
  text: 'Und sie selbst wird dir sagen: »Anders sind die, die in der Kraft der Jugend geboren wurden, und anders die, die gegen das Alter hin geboren wurden, wenn die Gebärmutter ihre Kraft verliert.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sub tempus senectutis
  choice: gegen die Zeit des Alters
  rationale: Die Formulierung gibt die zeitliche Annäherung wieder, die durch „sub“ mit Akkusativ ausgedrückt wird, statt lediglich einen festen Zeitpunkt zu bezeichnen.
- source_word: deficiente matrice
  choice: wenn der Mutterleib an Kraft verliert
  rationale: Der lateinische Ablativus absolutus bezeichnet das altersbedingte Nachlassen der Gebärfähigkeit. „Mutterleib“ ist natürlich und würdevoll; „an Kraft verliert“ wahrt den Bezug zum Gegensatz mit der Kraft der Jugend.
- source_word: alii … et alii
  choice: anders sind die … und anders die
  rationale: Bewahrt die kontrastive Parallelstruktur des Lateinischen und entspricht dem Zusammenhang, in dem zwei Gruppen Geborener einander gegenübergestellt werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild des im Alter nachlassenden Mutterleibs bleiben erhalten; die Formulierung vermeidet unnötig medizinische oder konfessionell geprägte Sprache.
