source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me : coronae adsimilabo iudicium meum ; sicut non nouissimorum tarditas, sic nec priorum uelocitas. Et respondi et dixi :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: de
  text: 'Und er sagte zu mir: „Ich werde mein Gericht mit einer Krone[a] vergleichen: Wie es für die Letzten keine Verzögerung gibt, so gibt es für die Ersten keine Eile.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Krone“ kann hier auch als „Kreis“ oder „Ring“ verstanden werden; dann betont der Vergleich die Entsprechung zwischen den Ersten und den Letzten.
    reason: lexical_alternative
lexical_decisions:
- source_word: coronae
  choice: mit einer Krone
  rationale: Das lateinische corona bezeichnet gewöhnlich eine Krone oder einen Kranz, kann hier aufgrund der Gestalt aber auch einen Kreis oder Ring meinen. Die Hauptbedeutung bleibt im Text erhalten; die für den Vergleich wichtige Alternative wird in der Fußnote genannt.
- source_word: adsimilabo
  choice: werde ich … vergleichen
  rationale: Gibt die Bedeutung „gleichsetzen, ähnlich machen, vergleichen“ in natürlichem modernem Deutsch wieder.
- source_word: nouissimorum tarditas
  choice: für die Letzten keine Verzögerung
  rationale: Bewahrt sowohl den Gegensatz zwischen den Letzten und den Ersten als auch den zeitlichen Sinn von tarditas.
- source_word: priorum uelocitas
  choice: für die Ersten keine Eile
  rationale: Gibt den parallelen Gegenbegriff zu „Verzögerung“ wieder, ohne den rätselhaften Vergleich erklärend aufzulösen.
theological_decisions:
- issue: Bedeutung des Vergleichs mit der corona
  choice: Die Bildsprache bleibt unausgelegt; „Krone“ steht im Haupttext, „Kreis“ oder „Ring“ in der Fußnote.
  alternative: Den Vergleich ausdrücklich als Bild für die Gleichzeitigkeit oder Symmetrie von Ersten und Letzten deuten.
  rationale: Der lateinische Text erklärt den Vergleich nicht. Eine ausdrückliche theologische Deutung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau des lateinischen Textes und seine Spannung zwischen den Letzten und den Ersten bleiben erhalten. Das am Ende der bereitgestellten Quellenzeile stehende „Et respondi et dixi“ wird als Beginn des folgenden Verses behandelt, entsprechend der konsultierten Versabgrenzung.
