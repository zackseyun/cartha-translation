  verdict: approve
  source_fidelity: Der deutsche Text gibt me ... adsimilabo iudicium meum zutreffend als Vergleich des göttlichen Gerichts mit einer Krone wieder. Die beiden parallelen Verneinungen (non ... tarditas / nec ... uelocitas) sowie die Gegenüberstellung von Letzten und Ersten bleiben erhalten. Der Satzteil „Et respondi et dixi“ gehört nach der vorgegebenen Versabgrenzung zum folgenden Vers und ist daher hier zu Recht nicht aufgenommen.
  naturalness: Modernes, würdiges Standarddeutsch. „Wie es für die Letzten keine Verzögerung gibt, so gibt es für die Ersten keine Eile“ ist idiomatisch und bewahrt die bewusst nicht erklärte Bildlogik des lateinischen Textes.
  terminology: „Gericht“ ist für iudicium passend. „Krone“ ist die naheliegende Hauptwiedergabe von corona; die Fußnote dokumentiert knapp und angemessen die im englischen Audit Trail ausgewiesene Möglichkeit „Kreis/Ring“, ohne die Metapher auslegend festzulegen.
