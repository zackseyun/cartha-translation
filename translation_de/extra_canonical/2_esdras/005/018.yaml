  rationale: 'Die minimale Umstellung verdeutlicht die lateinische Konstruktion: Die Angeredeten sollen nicht, wie ein Hirte seine eigene Herde, den bösen Wölfen ausgeliefert werden. „den Händen böser Wölfe“ entspricht dabei unmittelbar dem Ablativ in manibus luporum malignorum. Die englische Anmerkung dokumentiert lediglich eine frühere versverschobene Wiedergabe und stellt weder eine Lesart noch eine für die deutsche Übersetzung zu übernehmende Fußnote dar.'
