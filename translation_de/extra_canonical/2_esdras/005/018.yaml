  source_fidelity: 'Der Sinn des Lateins wird im Entwurf im Wesentlichen richtig getroffen: exsurge ergo, gusta panem alicuius, derelinquas nos und luporum malignorum sind angemessen wiedergegeben. Die Stellung des Vergleichs kann jedoch im Deutschen klarer zeigen, dass sowohl „uns“ als auch im Vergleich die Herde den Wölfen preisgegeben werden.'
  naturalness: Der Entwurf ist würdig und modernes Standarddeutsch. Die gegenwärtige Nachstellung „..., wie ein Hirte seine Herde“ ist zwar verständlich, wirkt aber leicht abgebrochen und lässt den Bezug zu „den bösen Wölfen“ weniger unmittelbar erkennen. Eine Umstellung ist idiomatischer und eindeutiger.
  terminology: „böse Wölfe“ gibt maligni angemessen wieder; „überlassen“ bewahrt den Sinn des Preisgebens von derelinquere. „etwas Brot“ ist für gusta panem alicuius natürlich und sachlich vertretbar.
  issues:
