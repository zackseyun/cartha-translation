    rationale: In „überlass uns nicht den bösen Wölfen, wie ein Hirte seine Herde“ wird die im Lateinischen elliptische Vergleichsstruktur zwar nachgebildet, aber die deutsche Wortstellung kann den Eindruck eines nachgetragenen, unvollständigen Vergleichs erwecken. Die Voranstellung von „wie ein Hirte seine Herde“ vor dem Ziel des Überlassens macht die Parallelität klar, ohne den Sinn zu verändern.
