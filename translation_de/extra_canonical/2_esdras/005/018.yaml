  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: de
  text: Steh also auf und iss etwas Brot, und überlass uns nicht wie ein Hirte seine Herde den Händen böser Wölfe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exsurge
  choice: Steh auf
  rationale: Gibt den lateinischen Imperativ unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: gusta panem alicuius
  choice: iss etwas Brot
  rationale: „gusta“ kann wörtlich „koste“ bedeuten, bezeichnet hier aber natürlich das Essen; „etwas Brot“ folgt dem im Kontext bezeugten Sinn der ungewöhnlichen lateinischen Wendung.
- source_word: derelinquas
  choice: überlass
  rationale: Drückt hier nicht nur ein Zurücklassen, sondern das Preisgeben an die nachfolgend genannten Wölfe aus.
- source_word: luporum malignorum
  choice: den bösen Wölfen
  rationale: Bewahrt das moralisch bedrohliche Gewicht von „malignorum“, ohne die Formulierung unnötig aufzublähen.
theological_decisions:
- issue: Vergleich mit dem Hirten
  choice: „wie ein Hirte seine Herde“ bleibt als offener Vergleich stehen
  alternative: Den Hirten ausdrücklich als jemanden bezeichnen, der seine Herde preisgibt
  rationale: Der lateinische Satz setzt das Verb im Vergleich nur sinngemäß fort. Die Übersetzung bewahrt diese knappe, spannungsreiche Form, ohne eine theologische Deutung des Hirtenbildes hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde gegenüber dem Lateinischen leicht geordnet, damit eindeutig und natürlich erkennbar ist, dass die Herde den Wölfen überlassen wird. Die englische Fußnote zur früheren, versverschobenen Wiedergabe wurde nicht übernommen, da sie keine Textvariante darstellt.
