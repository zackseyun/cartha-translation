lexical_decisions:
- source_word: Et factum est
  choice: Und es geschah
  rationale: Bewahrt die formelhafte lateinische Einleitung in natürlichem, würdigem Deutsch.
- source_word: cum locutus essem sermones istos
  choice: als ich diese Worte gesprochen hatte
  rationale: Der Plusquamperfekt gibt die Vorzeitigkeit des lateinischen Konjunktiv Plusquamperfekt angemessen wieder; „diese Worte“ ist im Deutschen idiomatisch.
- source_word: et missus
  choice: und gesandt wurde
  rationale: Gibt das passive Partizip mit der über die Versgrenze hinausreichenden Verbform wieder und lässt den Satz wie die Quelle bewusst unvollständig.
