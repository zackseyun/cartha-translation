- from: Und es geschah, als ich diese Worte gesprochen hatte und gesandt wurde
  to: 'Und es geschah: Als ich diese Worte gesprochen hatte, wurde gesandt'
  rationale: Der Doppelpunkt verhindert, dass „gesandt“ auf Esra bezogen wird, und bewahrt zugleich, dass die passive Verbfügung sowie ihr Subjekt erst über die Versgrenze in 5,32 weitergeführt werden. Es wird kein Material aus dem folgenden Vers vorgezogen.
