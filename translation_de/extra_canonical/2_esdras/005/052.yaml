source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quos peperisti nunc non sunt similes his qui ante sed minores statu ? Et dicet tibi et ipsa : alii sunt qui in iuuentute uirtutis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: de
  text: 'Denn du wirst zu ihr sagen: »Warum sind die, die du jetzt geboren hast, denen, die zuvor kamen, nicht ähnlich, sondern kleiner von Gestalt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peperisti
  choice: du … geboren hast
  rationale: Gibt das Perfekt von „parere“ im Bild einer gebärenden Frau unmittelbar und natürlich wieder.
- source_word: his qui ante
  choice: denen, die früher da waren
  rationale: Bewahrt die knappe zeitliche Gegenüberstellung, ohne genauer festzulegen, ob frühere Kinder oder Generationen gemeint sind.
- source_word: minores statu
  choice: kleiner von Gestalt
  rationale: Gibt die körperliche Bedeutung von „statu“ wieder und bleibt etwas weiter als ausschließlich „kleiner an Körpergröße“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das im lateinischen Fragesatz nur indirekt erkennbare „Warum“ wird entsprechend dem Sinnzusammenhang explizit gemacht. Der anschließende, offenbar zu Vers 53 gehörende und im vorgelegten Ausschnitt unvollständige Satz wurde nicht in Vers 52 aufgenommen.
