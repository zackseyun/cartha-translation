  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: de
  text: Und meine Seele gewann den Geist der Einsicht zurück, und wieder begann ich, vor dem Höchsten zu sprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: gewann … zurück
  rationale: Gibt die Bedeutung des erneuten Erlangens oder Wiederaufnehmens natürlich wieder.
- source_word: anima mea
  choice: meine Seele
  rationale: Formale und im Kontext verständliche Entsprechung.
- source_word: spiritum intellectus
  choice: den Geist der Einsicht
  rationale: Bewahrt die substantivische Wendung und ihre mögliche anthropologische beziehungsweise geistliche Bedeutungsbreite, ohne sie auf bloße Verstandeskraft zu verengen.
- source_word: coram Altissimo
  choice: vor dem Höchsten
  rationale: Direkte, würdige Wiedergabe des lateinischen Gottesprädikats.
- source_word: sermones
  choice: zu sprechen
  rationale: Das Objekt ist im Deutschen beim Verb „sprechen“ entbehrlich; „Worte zu sprechen“ wäre redundant und schwerfälliger.
theological_decisions:
- issue: Bedeutung von spiritus intellectus
  choice: Geist der Einsicht
  alternative: Verständnis / Verstandeskraft
  rationale: Die gewählte Formulierung erhält die Spannung zwischen innerer geistiger Befähigung und intellektuellem Verstehen, statt sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem lateinischen Gedankengang, klingt aber natürlich. Keine Fußnote übernommen, da die englische Fußnote eine überholte, nachweislich versverschobene frühere Fassung enthält.
