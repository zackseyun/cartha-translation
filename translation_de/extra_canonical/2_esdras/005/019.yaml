  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: de
  text: 'Und ich sagte zu ihm[a]: »Geh weg von mir und komm mir nicht nahe, bis sieben Tage vergangen sind; dann wirst du zu mir kommen.« Er tat, was ich gesagt hatte, und zog sich von mir zurück.'
