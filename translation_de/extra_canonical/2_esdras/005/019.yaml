lexical_decisions:
- source_word: vade a me
  choice: Geh weg von mir
  rationale: Gibt den Imperativ und die räumliche Trennung direkt und natürlich wieder.
- source_word: non ad me accedas
  choice: komm mir nicht nahe
  rationale: Bewahrt die konkrete Bedeutung von accedere und klingt in modernem Standarddeutsch würdevoll und verständlich.
- source_word: usque diebus septem
  choice: bis sieben Tage vergangen sind
  rationale: Drückt die zeitliche Grenze aus, ohne die Formulierung als bloße Dauerangabe zu verengen.
- source_word: audivit ut dixi
  choice: tat, was ich gesagt hatte
  rationale: Gibt audire im kontextuellen Sinn von Gehorchen bzw. Befolgen idiomatisch wieder.
- source_word: recessit a me
  choice: zog sich von mir zurück
  rationale: Entspricht der Bewegung fort vom Sprecher und vermeidet eine unnötig harte Wiederholung von »weggehen«.
theological_decisions:
- issue: Abweichende frühere Versfassung
  choice: Der vorgelegte lateinische Text wird im Haupttext übersetzt; die abweichende Fassung steht in der Fußnote.
  alternative: »Und ich fastete sieben Tage, klagte und weinte, wie der Engel Uriel mir befohlen hatte.«
  rationale: Die Alternative gehört nach der maßgeblichen lateinischen Versfolge offenbar zum folgenden Vers. Als überlieferte bzw. frühere Fassung wird sie dennoch transparent dokumentiert, ohne sie in den Haupttext einzutragen.
