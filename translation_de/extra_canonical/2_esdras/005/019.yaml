  source_fidelity: 'Der Haupttext folgt dem lateinischen Wortlaut insgesamt genau: Ezra spricht die andere Person an, weist sie für sieben Tage fort, und diese zieht sich daraufhin zurück. „dann kannst du ... kommen“ gibt jedoch eine Erlaubnis wieder, während lat. „tunc venies“ ein einfacher Zukunftssatz ist. Auch „wieder“ ist im lateinischen Wortlaut nicht ausdrücklich enthalten.'
  naturalness: Klares, modernes und dem erzählerischen Register angemessenes Deutsch. „Komm mir nicht nahe“ und „zog sich von mir zurück“ sind natürlich. Die Umstellung auf „dann wirst du zu mir kommen“ ist ebenso idiomatisch und genauer.
  terminology: Keine problematischen theologischen oder namensbezogenen Entscheidungen. Die Fußnote soll die alternative Fassung neutral als Alternative ausweisen, ohne die nicht weiter belegte Einordnung als „abweichende Versfassung“ zu behaupten.
