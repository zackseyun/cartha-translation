id: 2ES.5.26
reference: 2 Esdras 5:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus creatis volatilibus nominasti tibi columbam unam, et ex omnibus plasmatis pecoribus providisti tibi ovem unam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/026.yaml
  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
translation:
  language: de
  text: Und aus allen erschaffenen Vögeln hast du dir eine einzige Taube bestimmt, und aus allem geformten Vieh hast du dir ein einziges Schaf ausersehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volatilibus
  choice: Vögeln
  rationale: Das lateinische Substantiv bezeichnet hier die fliegenden Geschöpfe; im heutigen Deutsch ist „Vögel“ die natürliche Entsprechung.
- source_word: nominasti tibi
  choice: hast du dir … bestimmt
  rationale: Das wörtliche „dir benannt“ wäre im Deutschen missverständlich. „Sich bestimmen“ bewahrt den Gedanken der besonderen Erwählung, ohne eine spezifische Identifizierung einzutragen.
- source_word: columbam unam
  choice: eine einzige Taube
  rationale: „Eine einzige“ gibt unam im Kontrast zu „allen“ deutlich wieder.
- source_word: plasmatis pecoribus
  choice: geformten Vieh
  rationale: „Geformt“ bewahrt die Schöpfungs- und Gestaltungsmetaphorik von plasmatis; pecora wird als kollektives „Vieh“ wiedergegeben.
- source_word: providisti tibi
  choice: hast du dir … ausersehen
  rationale: Providere kann hier im Kontext der Auswahl „ersehen/ausersehen“ bedeuten. Die Formulierung klingt natürlich und bewahrt die Parallele zur erwählten Taube.
- source_word: ovem unam
  choice: ein einziges Schaf
  rationale: Ovis kann Schaf oder Mutterschaf bedeuten; ohne zwingende Geschlechtsmarkierung ist „Schaf“ angemessen. „Ein einziges“ bildet den Kontrast zur Gesamtheit ab.
theological_decisions:
- issue: Bildhafte Erwählung einer Taube und eines Schafes
  choice: Die Tierbilder werden ohne allegorische Deutung übersetzt.
  alternative: Taube und Schaf ausdrücklich als Symbole für Israel beziehungsweise das erwählte Volk kennzeichnen.
  rationale: Der lateinische Vers nennt nur die Tiere; eine Auslegung ihrer möglichen Symbolik gehört nicht in den Haupttext.
- issue: Bedeutung von nominasti und providisti
  choice: Beide Verben werden als besondere Bestimmung beziehungsweise Auswahl verstanden, jedoch mit unterschiedlichen deutschen Verben wiedergegeben.
  alternative: Wörtlich „benannt“ und „vorgesehen“ übersetzen.
  rationale: Eine streng wörtliche Wiedergabe wäre im modernen Deutsch unklar; die gewählte Fassung erhält Parallelismus und Erwählungsmotiv, ohne die beiden lateinischen Verben völlig gleichzuschalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und der Kontrast zwischen „allen“ und „eine einzige/ein einziges“ bleiben erhalten. Keine Fußnote ist erforderlich, da die im englischen Konsultationstext überlieferte Fußnote auf eine frühere Versverschiebung zurückgeht und nicht als echte Variante zu diesem lateinischen Ausgangstext beibehalten werden sollte.
