  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: de
  text: 'Der Engel, der in der vergangenen Nacht zu mir gekommen war, war bei mir[a], und er sagte zu mir: »Hör mir zu, und ich werde dich unterweisen; achte auf mich, und ich werde noch mehr hinzufügen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer früheren Versabgrenzung lautet der hier zugeordnete Text: »Und ich sagte: ›Rede, mein Herr.‹ Da sagte er zu mir: ›Du hast dich in deinen Gedanken über Israel sehr hinreißen lassen. Hast du es mehr geliebt als der, der es geschaffen hat?‹«'
    reason: Dokumentiert die frühere Wiedergabe beziehungsweise abweichende Versabgrenzung, ohne den Text des vorliegenden lateinischen Versabschnitts in den Haupttext zu vermischen.
lexical_decisions:
- source_word: praeterita nocte
  choice: in der vergangenen Nacht
  rationale: Natürliche und genaue Wiedergabe des unmittelbar zuvor liegenden nächtlichen Zeitraums.
- source_word: audi me
  choice: Hör mir zu
  rationale: Im Deutschen idiomatischer als das wörtliche »Höre mich« und passend zur Aufforderung, die folgende Unterweisung anzunehmen.
- source_word: instruam te
  choice: werde ich dich unterweisen
  rationale: Bewahrt den lehrenden Sinn von instruere in würdigem, verständlichem Deutsch.
- source_word: intende mihi
  choice: achte auf mich
  rationale: Gibt die Aufforderung zu gespannter Aufmerksamkeit wieder, ohne sie unnötig zu interpretieren.
- source_word: adiciam
  choice: werde ich noch mehr hinzufügen
  rationale: Erhält den offenen, ergänzenden Charakter des lateinischen Verbs am Versende.
theological_decisions:
- issue: Offener Inhalt dessen, was der Engel hinzufügen wird
  choice: »noch mehr hinzufügen« ohne Ergänzung eines Objekts
  alternative: »dir noch mehr sagen«
  rationale: Das Latein nennt kein Objekt; die Übersetzung bewahrt diese Offenheit und vermeidet eine inhaltliche Festlegung.
- issue: Text- und Versabgrenzung gegenüber der früheren Wiedergabe
  choice: Übersetzung genau des vorgegebenen lateinischen Versabschnitts
  alternative: Aufnahme des Dialogs »Rede, mein Herr … Israel« aus dem anschließenden Text
  rationale: Der bereitgestellte lateinische Quelltext gehört aufgrund der Verssegmentierung vollständig zu 5,32; der frühere Wortlaut entstammt dem folgenden Abschnitt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungs- und Folgesätze des Lateinischen bleiben erkennbar; schwerfällige Wort-für-Wort-Konstruktionen werden vermieden.
