  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: de
  text: 'Und ich fragte und sagte: »Da du mir nun einen Weg eröffnet hast, will ich vor dir reden. Denn ist unsere Mutter, von der du zu mir gesprochen hast, noch jung, oder[a] nähert sie sich bereits dem Alter?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das dem zweiten Frageglied entsprechende lateinische Wort an („oder“) ist in der Ausgabe ergänzt.
    reason: textual_editorial_supply
lexical_decisions:
- source_word: coram te
  choice: vor dir
  rationale: Gibt die räumlich-bildhafte und zugleich höfische Bedeutung des lateinischen Ausdrucks knapp und natürlich wieder.
- source_word: nam
  choice: denn
  rationale: Bewahrt die ausdrücklich vorhandene begründende Verknüpfung mit dem vorausgehenden Gedankengang.
- source_word: mater nostra
  choice: unsere Mutter
  rationale: Entspricht der personifizierenden Metapher des Ausgangstextes, ohne sie auszudeuten.
- source_word: de qua dixisti mihi
  choice: von der du zu mir gesprochen hast
  rationale: Gibt die Beziehung und den Sprechakt natürlich wieder; „zu mir gesprochen“ bleibt näher an dixisti mihi als eine erklärende Paraphrase.
- source_word: adhuc iuuenis est
  choice: ist sie noch jung
  rationale: „Noch jung“ bildet adhuc und iuvenis unmittelbar und idiomatisch ab.
- source_word: iam senectuti adpropinquat
  choice: nähert sie sich bereits dem hohen Alter
  rationale: Bewahrt die Bewegungsmetapher von adpropinquat und gibt senectus in würdigem, modernem Deutsch wieder.
theological_decisions:
- issue: Deutung der personifizierten „Mutter“
  choice: Die Metapher bleibt unaufgelöst als „unsere Mutter“ stehen.
  alternative: Die Mutter ausdrücklich als Welt, Schöpfung oder Zeitalter bestimmen.
  rationale: Der Vers selbst nennt das Gemeinte nicht ausdrücklich; eine Identifikation würde die im Zusammenhang bestehende Bildsprache vorschnell festlegen.
- issue: Syntaktische Hervorhebung von „unsere Mutter“
  choice: Die vorangestellte Nominalgruppe wird mit einem Doppelpunkt und anschließendem Pronomen bewahrt.
  alternative: Glättung zu „Ist unsere Mutter … noch jung?“
  rationale: So bleibt die lateinische Linksherausstellung von mater nostra … erhalten, ohne im Deutschen unverständlich zu wirken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die begründende Partikel nam wird als „denn“ ausdrücklich erhalten; die linksherausgestellte „Mutter“ wird durch Doppelpunkt und Pronomen natürlich nachvollzogen. Der einleitende Satzteil folgt der überlieferten Versgestalt der konsultierten Fassung; der hier angeführte lateinische Ausschnitt setzt erst bei „vor dir“ ein.
