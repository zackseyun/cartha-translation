source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem facient. Et mare Sodomiticum pisces reiciet, et dabit uocem noctu, quam non nouerunt multi, omnes autem audient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: de
  text: Und das Meer von Sodom wird Fische auswerfen[a] und bei Nacht einen Laut von sich geben, den viele bisher nicht gekannt haben[b]; doch alle werden ihn hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Meer von Sodom“ ist wahrscheinlich das Tote Meer gemeint. Die Übersetzung behält jedoch die anspielungsreiche Bezeichnung des lateinischen Textes bei.
    reason: cultural_note
  - marker: b
    text: 'Oder: „und bei Nacht eine Stimme erschallen lassen, die viele bisher nicht gekannt haben; doch alle werden sie hören“.'
    reason: translation_alternative
lexical_decisions:
- source_word: mare Sodomiticum
  choice: das Meer von Sodom
  rationale: Die geografische Umschreibung bewahrt den Bezug auf Sodom, klingt im heutigen Deutsch natürlich und vermeidet die irreführenden Nebenbedeutungen von „sodomitisch“.
- source_word: pisces reiciet
  choice: wird Fische auswerfen
  rationale: „Auswerfen“ gibt reiciet anschaulich und relativ formal wieder, ohne näher festzulegen, ob tote oder lebende Fische gemeint sind.
- source_word: dabit vocem
  choice: einen Laut von sich geben
  rationale: Die idiomatische Wendung wahrt den hörbaren Sinn von vox, ohne das Meer unnötig zu personifizieren; die mögliche Wiedergabe als „Stimme“ wird in der Fußnote genannt.
- source_word: quam non noverunt multi
  choice: den viele bisher nicht gekannt haben
  rationale: Das Perfekt noverunt wird gegenüber einem bloßen Präsens sichtbar gemacht; „bisher“ verdeutlicht den zurückliegenden Erfahrungsbezug im natürlichen Deutschen.
- source_word: omnes autem audient
  choice: doch alle werden ihn hören
  rationale: „Doch“ bildet autem im Kontrast zu „viele“ ab; das Pronomen bezieht sich gemäß dem lateinischen Femininum quam auf vox, hier „Laut“.
theological_decisions:
- issue: Bezeichnung des Sodomitischen Meeres
  choice: Meer von Sodom
  alternative: Totes Meer
  rationale: Die allusive Ortsbezeichnung des lateinischen Textes bleibt erhalten, statt sie durch den später üblichen Namen zu ersetzen.
- issue: Personifikation in dabit vocem
  choice: einen Laut von sich geben
  alternative: eine Stimme erschallen lassen
  rationale: Der Text lässt offen, welcher Art das außergewöhnliche Geräusch ist. „Laut“ bewahrt diese Offenheit und vermeidet eine stärkere Personifikation, als der Zusammenhang verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Ton. Die Satzstruktur folgt dem Latein eng, wird aber idiomatisch geglättet. Das am Anfang der gelieferten Quelle stehende „nem facient.“ ist erkennbar das abgeschnittene Ende des vorhergehenden Satzes und gehört nicht zum übersetzten Vers.
