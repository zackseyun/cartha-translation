  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: de
  text: Und an vielen Orten wird sich ein Abgrund auftun[a], und häufig wird Feuer hervorbrechen, und wilde Tiere werden ihr Gebiet verlassen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »An vielen Orten wird Chaos entstehen.«'
    reason: Das lateinische „chaos“ kann sowohl als Abgrund beziehungsweise gähnende Öffnung als auch, nach modernem Verständnis, als Chaos aufgefasst werden.
lexical_decisions:
- source_word: chaos fiet per loca multa
  choice: an vielen Orten wird sich ein Abgrund auftun
  rationale: Das lateinische „chaos“ kann hier einen gähnenden Abgrund oder Erdspalt bezeichnen; im Zusammenhang apokalyptischer Zeichen ist das konkrete Bild natürlicher als das moderne abstrakte „Chaos“. „fiet“ wird idiomatisch als Eintreten beziehungsweise Auftun dieses Zustands wiedergegeben.
- source_word: ignis frequenter emittetur
  choice: häufig wird Feuer hervorbrechen
  rationale: Das Passiv von „emittere“ bezeichnet ein wiederholtes Hervortreten oder Ausbrechen von Feuer; die Formulierung wahrt zugleich den ungenannten Urheber.
- source_word: bestiae agrestes transmigrabunt regionem suam
  choice: wilde Tiere werden ihr Gebiet verlassen
  rationale: „bestiae agrestes“ sind wilde Tiere; „transmigrare“ bezeichnet hier das Fortziehen aus ihrem angestammten Gebiet. Die natürliche deutsche Wiedergabe vermeidet das missverständliche „ihre Region durchwandern“.
theological_decisions:
- issue: Bedeutung von „chaos“ als apokalyptisches Zeichen
  choice: konkreter Abgrund beziehungsweise Erdspalt
  alternative: abstraktes Chaos oder allgemeine Unordnung
  rationale: Der lateinische Ausdruck lässt formal mehrere Nuancen zu; der konkrete räumliche Sinn passt jedoch besser zu „per loca multa“ und zur Reihe physischer Vorzeichen. Die verbleibende textliche Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher apokalyptischer Bildsprache. Die Satzfortsetzung und das abschließende Komma entsprechen dem überlieferten Verssegment.
