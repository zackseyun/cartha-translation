lexical_decisions:
- source_word: secundum tempus
  choice: zu seiner Zeit
  rationale: Die Wendung bezeichnet eine dem jeweiligen Geschehen entsprechende Zeit; das im Kontext erschlossene Possessivpronomen ergibt natürliches Deutsch, ohne den Sinn unnötig festzulegen.
- source_word: Et dixit ad me
  choice: Und er sagte zu mir
  rationale: Direkte und idiomatische Wiedergabe der lateinischen Redeeinleitung.
- source_word: et ego dedi
  choice: Auch ich gab
  rationale: Das betonte ego wird durch »ich« bewahrt; et ist hier am natürlichsten additiv als »auch« wiedergegeben, wobei der fragmentarische Anschluss offenbleibt.
- source_word: matricem
  choice: den Mutterleib
  rationale: Matrix bezeichnet hier den Mutterleib beziehungsweise die Gebärmutter; »Mutterleib« ist verständlich, würdig und für den literarisch-theologischen Kontext angemessen.
theological_decisions:
- issue: Gottes Rolle bei der Gabe des Mutterleibs
  choice: Auch ich gab den Mutterleib
  alternative: Und ich gab die Gebärmutter
  rationale: Die Formulierung hält sich an den erhaltenen lateinischen Wortlaut und fügt weder Empfänger noch Zweck der Gabe hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Text ist am Anfang und Ende ein Satzfragment; deshalb wurde keine inhaltliche Ergänzung vorgenommen und kein abschließendes Anführungszeichen gesetzt.
