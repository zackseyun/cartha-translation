  register: Modernes, würdiges Standarddeutsch; die knappe Erzählform und die Intensität der Trauerhandlungen bleiben erhalten. Die frühere abweichende Fassung gehört aufgrund einer Versverschiebung nicht in den Haupttext und wird daher auch nicht als textkritische Fußnote geführt.
