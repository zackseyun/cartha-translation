lexical_decisions:
- source_word: ieiunavi diebus septem
  choice: ich fastete sieben Tage lang
  rationale: Gibt Dauer und Handlung des lateinischen Ausdrucks natürlich und genau wieder.
- source_word: ululans et plorans
  choice: klagte laut und weinte
  rationale: „Klagte laut“ erfasst das hörbare, intensive Klagen von „ululans“, während „weinte“ dem eigenständigen „plorans“ entspricht.
- source_word: mandavit
  choice: geboten hatte
  rationale: Bewahrt die Verbindlichkeit des lateinischen Verbs und gibt die Vorzeitigkeit gegenüber dem Fasten idiomatisch wieder.
theological_decisions:
- issue: Bezeichnung und Stellung Uriels
  choice: der Engel Uriel
  alternative: Uriel, der Engel
  rationale: Folgt der lateinischen Apposition „Urihel angelus“ in natürlichem Deutsch, ohne zusätzliche Aussagen über Rang oder Wesen Uriels einzutragen.
