  yaml_path: translation/extra_canonical/2_esdras/005/054.yaml
  text: Therefore consider also for yourself[a], that you are smaller in stature than those before you,
translation:
  language: de
  text: 'Bedenke daher auch du: Ihr seid von kleinerem Wuchs als die, die vor euch waren,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Considera
  choice: Bedenke
  rationale: Gibt den auffordernden Sinn des lateinischen Imperativs natürlich und würdig wieder.
- source_word: ergo et tu
  choice: daher auch du
  rationale: Bewahrt sowohl die folgernde Verknüpfung als auch die ausdrückliche persönliche Anrede.
- source_word: minores statu
  choice: von kleinerem Wuchs
  rationale: Entspricht im Kontext körperlicher Größe beziehungsweise Gestalt; „Wuchs“ ist im modernen Deutsch natürlicher als „Statur“ und vermeidet die unpassende Deutung als gesellschaftlichen Rang.
- source_word: prae his qui ante vos
  choice: als die, die vor euch waren
  rationale: Gibt den Vergleich und den zeitlichen Bezug auf frühere Menschen eng am lateinischen Ausdruck wieder.
theological_decisions:
- issue: Bezug des Wechsels von Singular zu Plural
  choice: „auch du“ und anschließend „ihr“
  alternative: Den gesamten Satz einheitlich im Singular wiedergeben
  rationale: Das Latein wechselt bewusst von der persönlichen Anrede „tu“ zum Plural „estis … vos“. Diese Spannung bleibt erhalten, statt Ezra und seine Zeitgenossen sprachlich zusammenzuziehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Vers bleibt wegen des überlieferten Satzanschlusses mit einem Komma offen.
