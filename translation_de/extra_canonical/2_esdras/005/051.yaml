  text: And he said[a], 'Ask a woman who bears, and she will tell you. For you will say to her, "Why
translation:
  language: de
  text: 'Und er sagte[a]: »Frag eine Frau, die ein Kind zur Welt bringt, und sie wird es dir sagen. Denn du wirst zu ihr sagen: ›Warum'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer früheren Wiedergabe: »Und er antwortete mir und sagte«. Der vorliegende lateinische Text lautet lediglich »dixit« (»er sagte«).'
    reason: previous_rendering
lexical_decisions:
- source_word: dixit
  choice: er sagte
  rationale: Das lateinische Verb bedeutet schlicht »er sagte«; Zusätze wie »antwortete mir und« stehen im vorliegenden Ausgangstext nicht.
- source_word: interroga quae parit
  choice: Frag eine Frau, die ein Kind zur Welt bringt
  rationale: Das substantivisch gebrauchte feminine Relativpronomen bezeichnet allgemein eine gebärende Frau. Der unbestimmte Ausdruck »eine Frau« und die natürliche Wendung »ein Kind zur Welt bringt« geben dies verständlich wieder.
- source_word: dicet tibi
  choice: sie wird es dir sagen
  rationale: Das im Deutschen erforderliche Objekt »es« nimmt den erfragten Sachverhalt auf, ohne dem Inhalt etwas hinzuzufügen.
- source_word: Dices enim ei
  choice: Denn du wirst zu ihr sagen
  rationale: Dies folgt dem lateinischen Wortlaut mit dicere (»sagen«) und enim (»denn«), statt das Verb deutend als »fragen« wiederzugeben.
- source_word: quare
  choice: Warum
  rationale: Das Fragewort wird wörtlich wiedergegeben. Der Satz bleibt entsprechend dem an dieser Versgrenze abbrechenden Ausgangstext unvollendet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die allgemeine Aussage über eine gebärende Frau wird idiomatisch formuliert. Das am Versende unvollständige »Warum« bleibt bewusst offen, weil der lateinische Ausgangstext an dieser Stelle abbricht beziehungsweise in den nächsten Vers übergeht.
