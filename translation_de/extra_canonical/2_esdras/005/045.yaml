    issue: praesentes wird als „alle, die gegenwärtig leben“ wiedergegeben.
    rationale: Das ergänzte „leben“ steht nicht bei praesentes und verwischt die vom Text beibehaltene Unterscheidung zwischen uiuentes und praesentes. „die jetzt da sind“ ist natürliches modernes Deutsch und wahrt den weiteren Bezug.
  - severity: low
    issue: „Wie konntest du ... sagen“ klingt im Deutschen wie ein Vergangenheitskonditional.
    rationale: Das lateinische dixisti lässt sich als rhetorische Rückfrage natürlicher mit „Wie hast du ... sagen können“ wiedergeben.
