source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: de
  text: 'Und ich sagte: „Wie hast du deinem Diener sagen können, dass du die von dir erschaffene Schöpfung[a] alle zugleich lebendig machen wirst? Wenn also die Lebenden alle zugleich leben werden und die Schöpfung Bestand haben wird, dann kann sie auch jetzt alle, die jetzt da sind, zugleich tragen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das von dir erschaffene Geschöpf“.'
    reason: Das lateinische creatura kann formal sowohl „Schöpfung“ als auch „Geschöpf“ bedeuten; der Kontext legt hier den kollektiven Sinn nahe.
lexical_decisions:
- source_word: creatam creaturam
  choice: die von dir erschaffene Schöpfung
  rationale: Das lateinische creatura ist hier kollektiv zu verstehen, wie der folgende Plural uiuentes zeigt. „Schöpfung“ wahrt diesen Gesamtbezug besser als das im heutigen Deutsch meist einzelne Wesen bezeichnende „Geschöpf“.
- source_word: in unum
  choice: alle zugleich / zugleich
  rationale: Die Wendung bezeichnet hier das gemeinsame, gleichzeitige Leben beziehungsweise Tragen der Gesamtheit; eine wörtliche Wiedergabe wie „in eins“ wäre im Deutschen unverständlich.
- source_word: sustinebit
  choice: Bestand haben wird
  rationale: Da creatura das Subjekt ist, bezeichnet das Verb zunächst das Fortbestehen beziehungsweise Standhalten der Schöpfung unter dieser Belastung, nicht unmittelbar das Tragen eines ausdrücklich genannten Objekts.
- source_word: portare praesentes
  choice: alle, die gegenwärtig leben, tragen
  rationale: praesentes meint im Zusammenhang die jetzt vorhandenen Lebenden. Die Ergänzung „leben“ macht den Bezug im Deutschen klar, ohne eine neue Personengruppe einzuführen.
theological_decisions:
- issue: Kollektiver oder individueller Sinn von creatura
  choice: Schöpfung
  alternative: Geschöpf
  rationale: Der Zusammenhang handelt von sämtlichen Lebenden und davon, ob die geschaffene Ordnung sie zugleich tragen kann. Dennoch bleibt die formal mögliche individuelle Wiedergabe in einer Fußnote sichtbar.
- issue: Bedeutung von sustinebit creatura
  choice: die Schöpfung wird Bestand haben
  alternative: die Schöpfung wird es aushalten / sie alle halten
  rationale: Die gewählte Fassung bewahrt, dass die Schöpfung im lateinischen Satz Subjekt ist, und vermeidet ein nicht ausdrücklich gesetztes Objekt. Der anschließende Satz nimmt mit portare den Gedanken des Tragens ausdrücklich auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Schöpfung“ und „zugleich“ folgt der argumentativen Struktur des lateinischen Textes; „Bestand haben“ gibt sustinere idiomatisch wieder und hält es vom anschließenden portare („tragen“) auseinander.
