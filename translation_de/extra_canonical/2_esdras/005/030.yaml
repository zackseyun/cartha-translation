  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: de
  text: Und wenn du dein Volk wirklich hasst, soll es durch deine eigenen Hände gezüchtigt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: odiens odisti
  choice: wirklich hasst
  rationale: Die figura etymologica verstärkt das Verb. „Wirklich“ gibt den Nachdruck wieder, ohne ihn mit „zutiefst“ oder „völlig“ zu übersteigern.
- source_word: populum tuum
  choice: dein Volk
  rationale: Direkte und natürliche Wiedergabe des lateinischen Ausdrucks.
- source_word: tuis manibus
  choice: durch deine eigenen Hände
  rationale: Bewahrt sowohl das Mittel beziehungsweise den Handelnden als auch die Betonung des possessiven „tuis“.
- source_word: debet castigari
  choice: soll ... gezüchtigt werden
  rationale: „Soll“ gibt hier die geschuldete beziehungsweise angemessene Handlung natürlicher wieder als ein starres „muss“; „gezüchtigt“ wahrt den korrektiven Strafsinn von „castigari“.
theological_decisions:
- issue: Göttlicher Hass und unmittelbare Züchtigung
  choice: 'Die an Gott gerichtete Bedingung bleibt unverändert scharf formuliert: „wenn du dein Volk wirklich hasst“ und „durch deine eigenen Hände“.'
  alternative: Den Hass abschwächen, etwa zu „verworfen hast“, oder die eigenen Hände nur als allgemeines göttliches Handeln umschreiben.
  rationale: Der lateinische Text spricht ausdrücklich von „odisti“ und „tuis manibus“. Die Spannung des Vorwurfs beziehungsweise der Bitte darf nicht konfessionell oder harmonisierend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am lateinischen Ausgangstext; „züchtigen“ ist leicht gehoben, trifft hier aber den korrektiven Strafcharakter genauer als das allgemeinere „bestrafen“.
