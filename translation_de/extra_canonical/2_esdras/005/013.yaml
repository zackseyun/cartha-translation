source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborabunt et non dirigentur uiae eorum. Haec signa dicere tibi permissum est mihi, et si oraueris iterum et ploraueris sicut et nunc et ieiunaueris septem diebus, audies iterato horum maiora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: de
  text: Sie werden sich abmühen, doch ihre Wege werden nicht zum Ziel führen. Diese Zeichen darf ich dir nennen. Wenn du wieder betest und weinst wie jetzt und sieben Tage fastest, wirst du erneut noch Größeres als dies hören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborabunt
  choice: Sie werden sich abmühen
  rationale: Gibt die anhaltende, mühevolle Arbeit des lateinischen Verbs natürlich wieder.
- source_word: non dirigentur uiae eorum
  choice: ihre Wege werden nicht zum Ziel führen
  rationale: Bewahrt das Bild der Wege und vermittelt zugleich idiomatisch, dass ihre Unternehmungen keine erfolgreiche Richtung beziehungsweise kein Ziel erreichen.
- source_word: permissum est mihi
  choice: darf ich
  rationale: Natürliche deutsche Wiedergabe der erteilten Erlaubnis; die persönliche Beauftragung bleibt erkennbar.
- source_word: iterato horum maiora
  choice: erneut noch Größeres als dies
  rationale: Gibt sowohl das erneute Hören als auch den Vergleich mit den bereits genannten Dingen wieder.
theological_decisions:
- issue: Bedeutung von „dirigentur“ in der Wegmetapher
  choice: werden nicht zum Ziel führen
  alternative: werden nicht gelenkt werden / werden keinen Erfolg haben
  rationale: Die Formulierung wahrt die echte Wegmetapher, klingt im modernen Deutschen verständlich und vermeidet sowohl eine rein passive Fremdlenkung als auch die vollständige Auflösung des Bildes in „Erfolg haben“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde leicht gegliedert, ohne Inhalt auszulassen. Keine Fußnote nötig, da die Bildsprache im Haupttext zugleich verständlich und quellennah wiedergegeben werden kann.
