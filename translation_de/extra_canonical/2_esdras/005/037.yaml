  to: Mach mir die vertrockneten Blumen wieder grün, öffne mir die verschlossenen Vorratskammern und bring mir die darin eingeschlossenen Winde heraus; oder zeige mir das Bild einer Stimme. Dann werde ich dir jene Not zeigen, nach der du fragst.
