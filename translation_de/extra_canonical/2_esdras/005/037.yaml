  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: de
  text: Mach mir die vertrockneten Blumen wieder grün, öffne mir die verschlossenen Vorratskammern und bring mir die darin eingeschlossenen Winde heraus; oder zeige mir das Bild einer Stimme. Dann werde ich dir jene Not zeigen, nach der du fragst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuirida mihi aridos flores
  choice: Lass die vertrockneten Blumen für mich wieder aufblühen
  rationale: Das offenbar imperativische revirida fordert die Wiederherstellung vertrockneter Blumen. „Wieder aufblühen“ gibt das Bild im natürlichen Deutschen wieder, ohne bloß eine Rückgabe der Blumen anzudeuten.
- source_word: prumptuaria
  choice: Vorratskammern
  rationale: Das bereinigte lateinische Wort entspricht promptuaria, also Vorrats- oder Aufbewahrungskammern.
- source_word: flatos
  choice: Winde
  rationale: Im Kontext bezeichnet flatus eingeschlossene Luftströmungen bzw. Winde; „Winde“ entspricht der kosmischen Bildsprache.
- source_word: uocis imaginem
  choice: das Bild einer Stimme
  rationale: Die bewusst paradoxe Formulierung des Lateinischen wird formal und ohne erklärende Auflösung bewahrt.
- source_word: eum laborem
  choice: jene Not
  rationale: Labor bezeichnet hier aufgrund des Rückbezugs auf laborem Iacob in 5,35 nicht Arbeit, sondern Bedrängnis oder Not. „Jene“ bildet den anaphorischen Demonstrativbezug von eum ab.
- source_word: quem rogas
  choice: nach der du fragst
  rationale: Natürliches Deutsch, das den Sinn von rogare wahrt, ohne das im Lateinischen nicht ausdrücklich vorhandene „zu sehen“ hinzuzufügen.
theological_decisions:
- issue: Rückbezug von eum laborem auf Jakobs Not in 5,35
  choice: jene Not
  alternative: jene Mühsal / jene Bedrängnis
  rationale: Der unmittelbare Kontext macht Leiden oder Bedrängnis wahrscheinlicher als geleistete Arbeit. Die Formulierung wahrt den Rückbezug, ohne die genaue Art der Not näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihe unmöglicher Forderungen bleibt bildhaft und leicht verständlich; das paradoxe „Bild einer Stimme“ wird absichtlich nicht geglättet.
