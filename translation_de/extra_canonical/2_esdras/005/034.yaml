  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: de
  text: 'ihn mehr als den, der ihn geschaffen hat?« Ich sagte: »Nein, Herr. Doch ich habe aus Schmerz gesprochen, denn mein Innerstes quält mich zu jeder Stunde, während ich versuche, den Weg des Höchsten zu erfassen und einen Teil seines Gerichts zu ergründen.« Da sagte er zu mir: »Das kannst du nicht.« Ich sagte: »Warum, Herr? Oder wozu wurde ich geboren? Oder warum wurde der Schoß meiner Mutter nicht zu meinem Grab, damit ich die Mühsal Jakobs nicht sehen würde?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: renes mei
  choice: mein Innerstes
  rationale: Wörtlich »meine Nieren«; im Lateinischen bezeichnen die Nieren bildhaft den innersten Sitz von Empfindung und Gemüt. »Mein Innerstes« bewahrt den Sinn in natürlichem modernem Deutsch.
- source_word: semitam altissimi
  choice: den Weg des Höchsten
  rationale: »Weg« gibt semita verständlich und würdig wieder; der Genitiv bleibt bewusst offen für den Weg, den der Höchste geht oder bestimmt.
- source_word: partem iudicii eius
  choice: einen Teil seines Gerichts
  rationale: iudicium kann Urteil, Rechtsprechung oder richtendes Handeln bedeuten. »Gericht« erhält diese theologisch bedeutsame Spannweite besser als eine einengende Umschreibung.
- source_word: matrix matris meae
  choice: der Schoß meiner Mutter
  rationale: Die natürliche deutsche Entsprechung für den Mutterleib; sie wahrt zugleich das bildhafte Gegenüber von Schoß und Grab.
- source_word: laborem Iacob
  choice: die Mühsal Jakobs
  rationale: labor bezeichnet Mühe, Leid oder Bedrängnis. »Mühsal« hält die Bedeutung relativ offen und vermeidet eine unbelegte Festlegung auf ein bestimmtes endzeitliches Konzept.
theological_decisions:
- issue: Reichweite von »iudicium eius«
  choice: seines Gerichts
  alternative: seines Ratschlusses / seines Urteils
  rationale: Der lateinische Ausdruck bezeichnet Gottes richterliches Urteil oder Handeln, kann im Zusammenhang aber weiter reichen. Die gewählte Formulierung bewahrt diese Spannung.
- issue: Bedeutung von »laborem Iacob«
  choice: die Mühsal Jakobs
  alternative: Jakobs Not / das Leiden Jakobs
  rationale: Der Text kann das gegenwärtige Leiden des Volkes oder eine umfassendere Bedrängnis meinen. Eine neutrale Wiedergabe vermeidet eine konfessionell oder eschatologisch vorgeprägte Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Versanfang bleibt als syntaktische Fortsetzung des vorhergehenden Verses erhalten. Bildhafte Ausdrücke werden dort idiomatisch wiedergegeben, wo eine wörtliche Fassung im heutigen Deutsch irreführend oder unnatürlich wäre.
