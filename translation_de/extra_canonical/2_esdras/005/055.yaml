  to: 'Darum bedenkt auch dies bei euch selbst: Ihr seid kleiner als die, die vor euch waren, und die nach euch kommen, werden kleiner sein als ihr – gleichsam bei einer Schöpfung, die schon altert und die Kraft der Jugend hinter sich lässt.'
