source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: de
  text: 'Darum bedenkt auch dies bei euch selbst: Ihr seid kleiner als die, die vor euch waren, und die nach euch kommen, werden kleiner sein als ihr – gleichsam bei einer Schöpfung, die schon altert und die Kraft der Jugend hinter sich lässt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: senescentis creaturae
  choice: die Schöpfung ist bereits alt geworden
  rationale: Gibt das Bild einer alternden Schöpfung in natürlichem, würdigem Deutsch wieder, ohne es dogmatisch auszudeuten.
- source_word: fortitudinem iuuentutis praeterientis
  choice: lässt die Kraft der Jugend hinter sich
  rationale: Bewahrt das Bild vom Überschreiten beziehungsweise Zurücklassen jugendlicher Kraft und vermeidet eine unnötig technische Formulierung.
- source_word: his qui ante uos … qui post uos
  choice: die, die vor euch lebten … die nach euch kommen
  rationale: Macht den zeitlichen Generationenvergleich ausdrücklich und verständlich.
theological_decisions:
- issue: Ursache der abnehmenden Größe späterer Generationen
  choice: als Folge des Alterns der Schöpfung dargestellt
  alternative: als Aussage über geistlichen oder moralischen Verfall ausgelegt
  rationale: Der lateinische Text verwendet das Bild einer alternden Schöpfung, bestimmt aber nicht näher, ob die Abnahme körperlich, geistlich oder moralisch zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Pluralanrede „ihr/euch“ folgt dem lateinischen „uos“. „Kleiner“ bewahrt die im Zusammenhang erkennbare, aber nicht näher bestimmte Vergleichsaussage, ohne sie auf Körpergröße oder Bedeutung festzulegen.
