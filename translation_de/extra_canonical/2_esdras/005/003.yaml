revisions:
- from: Und das Gebiet, das du jetzt herrschen siehst, wird unwegsames Ödland sein, und man wird es verwüstet sehen.
  to: Und das Gebiet, das du jetzt herrschen siehst, wird zu einer weglosen Öde werden, und sie werden es verödet sehen.
  rationale: Die Revision präzisiert die schwierige Wendung inconposita vestigio als „weglose Öde“, ohne ihre Bildlichkeit zu erklären oder geschichtlich festzulegen. Außerdem bewahrt sie mit „sie werden“ den Plural der lateinischen Vorlage. Die Personifikation des Gebiets, die Terminologie „Gebiet“ und der prophetische Registerton bleiben erhalten.
