base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: de
  text: Und das Gebiet, das du jetzt herrschen siehst, wird zu einer weglosen Öde werden, und sie werden es verödet sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: das Gebiet
  rationale: „Gebiet“ gibt das lateinische „regionem“ präzise und in natürlichem modernem Deutsch wieder, ohne es unnötig auf „Land“ oder ein politisches Reich festzulegen.
- source_word: quam nunc vides regnare
  choice: das du jetzt herrschen siehst
  rationale: Die auffällige Personifikation des Gebiets wird bewahrt; „herrschen“ entspricht unmittelbar „regnare“, ohne die gemeinte geschichtliche Macht ausdrücklich zu identifizieren.
- source_word: inconposita vestigio
  choice: unwegsames Ödland
  rationale: Die schwierige lateinische Wendung bezeichnet im Zusammenhang einen verwüsteten, nicht mehr gangbaren beziehungsweise spurlosen Zustand. „Unwegsames Ödland“ bewahrt beide Aspekte in verständlichem Deutsch.
- source_word: et videbunt eam desertam
  choice: und man wird es verwüstet sehen
  rationale: Das unbestimmte pluralische Subjekt wird idiomatisch mit „man“ wiedergegeben; „verwüstet“ trifft „desertam“ hier als Zustand eines verlassenen und verheerten Gebiets.
theological_decisions:
- issue: Bezug des herrschenden Gebiets
  choice: Die Personifikation bleibt ohne ausdrückliche Deutung stehen.
  alternative: „das Reich, das jetzt herrscht“
  rationale: Der lateinische Text sagt „regionem“ und lässt das Verhältnis zwischen Gebiet und Herrschaft in Spannung. Eine Umdeutung zu „Reich“ würde die mögliche geschichtliche oder apokalyptische Referenz stärker festlegen als die Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Aussage, ein Gebiet „herrsche“, wurde bewusst nicht geglättet. Keine Fußnoten erforderlich.
