review_pass:
  verdict: revise
  source_fidelity: '„Gebiet“ für regionem und die beibehaltene Personifikation in „das du jetzt herrschen siehst“ sind quellentreu. „Unwegsames Ödland“ trifft den Sinn von inconposita vestigio nur teilweise: Die Wendung hebt besonders die Weg-/Spurlosigkeit hervor. Das lateinische videbunt ist ein unbestimmtes Plural-Subjekt und sollte nicht ohne Not zu deutschem „man“ singularisiert werden.'
  naturalness: Der Entwurf ist insgesamt verständlich und würdevoll. „Weglose Öde“ ist idiomatisch, knapp und gibt die bildhafte Härte der Vorlage besser wieder. „Sie werden es verödet sehen“ ist im apokalyptisch-prophetischen Register natürlich; das nicht näher bestimmte „sie“ bewahrt die Vorlage.
  terminology: „Gebiet“ ist für regionem angemessen und vermeidet eine überbestimmende Deutung als politisches „Reich“. „Verödet“ gibt desertam als Zustand präziser wieder als „verwüstet“, das stärker einen Vorgang beziehungsweise äußere Zerstörung nahelegen kann.
  issues:
  - severity: medium
    issue: inconposita vestigio wird nicht hinreichend als Weg-/Spurlosigkeit wiedergegeben.
    rationale: „Unwegsam“ kann zwar fehlende Passierbarkeit bezeichnen, aber „Ödland“ fügt eine Landschaftskategorie hinzu und verliert den spezifischen Bezug auf Weg oder Spur. „Weglose Öde“ wahrt die Bildsprache ohne eine strittige historische Deutung.
  - severity: low
    issue: videbunt wird als unpersönliches „man wird“ wiedergegeben.
    rationale: Das lateinische Verb steht im Plural. „Sie werden“ ist im Deutschen ebenso möglich und erhält die offene Pluralreferenz der Quelle.
  revised_text: Und das Gebiet, das du jetzt herrschen siehst, wird zu einer weglosen Öde werden, und sie werden es verödet sehen.
