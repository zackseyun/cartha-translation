  yaml_path: translation/extra_canonical/2_esdras/005/048.yaml
  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: de
  text: 'Und er sagte zu mir: »So gab auch ich den Schoß der Erde denen, die zu ihrer Zeit auf ihr ausgesät wurden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terrae
  choice: der Erde
  rationale: Der Genitiv hängt im erhaltenen Satzfragment sachlich von dem im Kontext vorausgesetzten Ausdruck für den »Schoß« ab; »Erde« ist die natürliche deutsche Entsprechung.
- source_word: seminati sunt
  choice: ausgesät wurden
  rationale: Bewahrt das lateinische Saatbild und gibt das Passiv sowie die vergangene Handlung wieder.
- source_word: super eam
  choice: auf ihr
  rationale: Das Pronomen bezieht sich auf die Erde; die knappe räumliche Formulierung entspricht dem Lateinischen.
- source_word: per tempus
  choice: zu ihrer Zeit
  rationale: Gibt die zeitliche Zuordnung idiomatisch wieder, ohne das Latein unnötig auf einzelne Personen zu verteilen.
theological_decisions:
- issue: Bild vom Schoß der Erde
  choice: Schoß der Erde
  alternative: Mutterleib der Erde
  rationale: »Schoß« erhält das Geburts- und Fruchtbarkeitsbild, klingt im Deutschen würdig und legt keine zusätzliche personifizierende Deutung fest.
- issue: Deutung der Ausgesäten
  choice: denen, die … ausgesät wurden
  alternative: den Menschen, die … ausgesät wurden
  rationale: Die substantivierte Umschreibung bewahrt die Offenheit des Textes und ergänzt nicht ausdrücklich »Menschen«, obwohl dies im Kontext naheliegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzform folgt dem erhaltenen lateinischen Fragment und dem durch den unmittelbaren Kontext gesicherten vorangehenden Aussagesatz; das Saat- und Schoßbild bleibt bewusst erhalten.
