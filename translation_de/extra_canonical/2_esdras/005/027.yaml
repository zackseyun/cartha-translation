id: 2ES.5.27
reference: 2 Esdras 5:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus multiplicatis populis adquisisti tibi populum unum, et ab omnibus probatam legem donasti huic quem desiderasti populo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/027.yaml
  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: de
  text: Und aus allen zahlreich gewordenen Völkern hast du dir ein einziges Volk erworben, und diesem Volk, nach dem du Verlangen hattest, hast du das von allen anerkannte Gesetz geschenkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicatis populis
  choice: zahlreich gewordenen Völkern
  rationale: Gibt den Gedanken der Vermehrung beziehungsweise großen Zahl natürlich wieder, ohne das im Deutschen schwer verständliche wörtliche »vervielfachten Völkern« zu verwenden.
- source_word: adquisisti tibi
  choice: hast du dir … erworben
  rationale: Bewahrt sowohl den Erwerbsgedanken von »adquisisti« als auch den reflexiven Bezug von »tibi«.
- source_word: populum unum
  choice: ein einziges Volk
  rationale: Hebt entsprechend der wiederkehrenden Auswahlstruktur des Zusammenhangs das eine Volk aus der Vielzahl hervor.
- source_word: quem desiderasti
  choice: nach dem du Verlangen hattest
  rationale: Gibt das starke Begehren beziehungsweise Erwählen von »desiderasti« wieder, ohne es als bloßes Mögen abzuschwächen.
- source_word: ab omnibus probatam legem
  choice: das von allen anerkannte Gesetz
  rationale: Lässt »ab omnibus« als Urheberangabe stehen und gibt »probatam« in idiomatischem Deutsch als anerkannt beziehungsweise für bewährt befunden wieder.
- source_word: donasti
  choice: geschenkt
  rationale: Bewahrt den Gabecharakter des lateinischen Verbs stärker als das neutralere »gegeben«.
theological_decisions:
- issue: Verhältnis des einen Volkes zu den vielen Völkern
  choice: »ein einziges Volk« aus »allen zahlreich gewordenen Völkern«
  alternative: »ein Volk« aus »allen vermehrten Völkern«
  rationale: Die Fassung erhält die im Kontext wichtige Spannung zwischen Vielheit und Einheit, ohne über den lateinischen Text hinaus eine bestimmte Identität oder Heilslehre festzulegen.
- issue: Geltung des Gesetzes
  choice: »von allen anerkannte Gesetz«
  alternative: »von allen als bewährt befundene Gesetz«
  rationale: Die passive Konstruktion »ab omnibus probatam« wird nicht in eine konfessionelle Aussage über Wesen oder Reichweite des Gesetzes umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt eng dem lateinischen Parallelismus, wird aber durch natürliche deutsche Wortstellung lesbar gehalten. Die frühere, als Fußnote überlieferte Fassung gehört inhaltlich zum folgenden Vers und wird daher hier nicht aufgenommen.
