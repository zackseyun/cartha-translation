  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die lateinische Satzstruktur und sämtliche wesentlichen Elemente zuverlässig wieder: die Vielzahl der Völker (multiplicatis populis), Gottes Erwerb eines einzigen Volkes für sich (adquisisti tibi populum unum), das begehrte Volk (quem desiderasti) sowie das von allen gebilligte Gesetz (ab omnibus probatam legem).'
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. „Zahlreich gewordenen Völkern“ ist eine natürliche, sinnentsprechende Wiedergabe; „nach dem du Verlangen hattest“ ist leicht gehoben, aber im Gebets- und Schriftregister angemessen und bewahrt die Stärke von desiderasti.
  terminology: „Volk“, „Gesetz“ und „geschenkt“ sind treffend. „Ein einziges Volk“ bringt unum klar zur Geltung, ohne zusätzliche theologische Identifikationen einzutragen. „Von allen anerkannte“ ist für probatam als passive Bewertung vertretbar und bewahrt die Formulierung ab omnibus.
