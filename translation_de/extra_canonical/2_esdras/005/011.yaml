revisions:
- from: 'Die Ungerechtigkeit und die Zügellosigkeit werden sich auf der Erde vermehren. Dann wird eine Gegend ihre Nachbargegend fragen: »Ist die Gerechtigkeit etwa durch dich gezogen?«[a]'
  to: 'Ungerechtigkeit und mangelnde Selbstbeherrschung werden auf der Erde zunehmen. Und ein Gebiet wird das benachbarte fragen: »Ist Gerechtigkeit etwa durch dich hindurchgezogen?«[a]'
  rationale: Die Revision glättet die personifizierte Rede von benachbarten Gebieten, gibt incontinentia präziser wieder und verdeutlicht mit „hindurchgezogen“ die räumliche Bildsprache. Die Fußnote bleibt erforderlich, weil die vollständige Frage über den gelieferten lateinischen Text hinaus ergänzt wird.
