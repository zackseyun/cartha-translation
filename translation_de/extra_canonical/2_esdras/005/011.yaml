source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: de
  text: 'Ungerechtigkeit und mangelnde Selbstbeherrschung werden auf der Erde zunehmen. Und ein Gebiet wird das benachbarte fragen: »Ist Gerechtigkeit etwa durch dich hindurchgezogen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der bereitgestellte lateinische Textausschnitt endet nach „numquid per te“ („Ist etwa durch dich …“). Die Vervollständigung der Frage folgt der konsultierten englischen Prüffassung: „Has righteousness passed through you?“'
    reason: Kennzeichnet, dass die Ergänzung der im Deutschen vollständigen Frage nicht im bereitgestellten lateinischen Ausschnitt enthalten ist.
lexical_decisions:
- source_word: multiplicabitur
  choice: werden sich … vermehren
  rationale: Gibt die Zunahme von »Ungerechtigkeit und Zügellosigkeit« im natürlichen modernen Deutsch wieder; das lateinische Verb steht im Singular, obwohl es sich sinngemäß auf beide verbundenen Substantive bezieht.
- source_word: iniustitia
  choice: Ungerechtigkeit
  rationale: Direkte und im Kontext passende Wiedergabe des lateinischen Begriffs.
- source_word: incontinentia
  choice: Zügellosigkeit
  rationale: Bezeichnet mangelnde Selbstbeherrschung, bewahrt aber den kräftigen, sittlich negativen Ton des lateinischen Ausdrucks.
- source_word: regio proximam suam
  choice: eine Gegend ihre Nachbargegend
  rationale: Macht die personifizierte Beziehung zwischen benachbarten Gebieten klar und vermeidet das politisch enger gefasste »Land«.
- source_word: numquid per te
  choice: Ist … etwa durch dich gezogen?
  rationale: »Etwa« bildet die fragende Partikel numquid ab; »durch dich« entspricht per te. Das Verb und das Subjekt der vervollständigten Frage stammen aus der überlieferten Fortsetzung, wie in der Fußnote erläutert.
theological_decisions:
- issue: Personifizierung der Gerechtigkeit
  choice: »Ist die Gerechtigkeit etwa durch dich gezogen?«
  alternative: »Ist bei dir etwa Gerechtigkeit zu finden?«
  rationale: Die gewählte Fassung bewahrt das konkrete Bild einer durch eine Gegend ziehenden Gerechtigkeit und löst es nicht interpretierend in einen bloßen Zustand auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Latein, während »Dann« den Übergang natürlich wiedergibt. »Zügellosigkeit« ist idiomatischer und prägnanter als »Mangel an Selbstbeherrschung«.
