  source_fidelity: Die Grundstruktur und die vier Zukunftsaussagen folgen dem lateinischen Text. Allerdings ist „aus Holz wird Blut tropfen“ im Deutschen missverständlich, weil es Blut als aus Holz hervorgebracht verstehen lassen kann, während de ligno den Herkunfts- bzw. Austrittsort bezeichnet. „Seine Stimme erheben“ ist enger als dabit vocem suam, da es gewöhnlich gezieltes Sich-Äußern impliziert; „seine Stimme hören lassen“ wahrt die Personifikation, ohne die Art der Lautäußerung festzulegen. Die passivische Form von commutabuntur sollte erkennbar bleiben.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Blut wird aus Holz tropfen“ ist idiomatischer als die Ausgangsstellung mit „aus Holz“. Das Futurpassiv „werden verändert werden“ ist zwar markiert, aber in diesem knappen prophetischen Kontext verständlich und für die Quellform angemessen.
  terminology: „Holz“, „Stein“, „Völker“ und „Schritte“ sind sachgerecht. Die Fußnote zu „Baum“ wird gestrichen, da lignum hier primär Holz, Holzstück oder Bauholz bezeichnet und „Baum“ ohne näheren Kontext keine gleichwertige deutsche Alternative ist. Die Anmerkung zu gressus erhält die quellennahe Mehrdeutigkeit.
