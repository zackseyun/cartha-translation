- from: Und aus Holz[a] wird Blut tropfen, und der Stein wird seine Stimme erheben; die Völker werden erschüttert werden, und die Schritte[b] werden sich ändern.
  to: Und Blut wird aus Holz tropfen, und der Stein wird seine Stimme hören lassen; die Völker werden erschüttert werden, und die Schritte[b] werden verändert werden.
  rationale: Die Revision beseitigt die deutsche Mehrdeutigkeit bei „aus Holz“, gibt die unbestimmte Personifikation des Steins genauer wieder und erhält bei gressus commutabuntur die passive Aussageform. Die nicht ausreichend begründete Baum-Alternative wird entfernt; die genuine Mehrdeutigkeit von gressus bleibt in einer Fußnote dokumentiert.
