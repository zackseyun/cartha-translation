  revision_rationale: Die Revision beseitigt die deutsche Mehrdeutigkeit bei „aus Holz“, gibt die unbestimmte Personifikation des Steins genauer wieder und erhält bei gressus commutabuntur die passive Aussageform. Die nicht ausreichend begründete Baum-Alternative wird entfernt; die genuine Mehrdeutigkeit von gressus bleibt in einer Fußnote dokumentiert.
