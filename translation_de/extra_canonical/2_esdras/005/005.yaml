  yaml_path: translation/extra_canonical/2_esdras/005/005.yaml
  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: de
  text: Und Blut wird aus Holz tropfen, und der Stein wird seine Stimme hören lassen; die Völker werden erschüttert werden, und die Schritte[b] werden verändert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Schritte“ kann hier auch Gang, Fortbewegung oder Verlauf bedeuten.
    reason: Das lateinische „gressus“ hat neben der konkreten Bedeutung „Schritte“ einen weiteren Bedeutungsumfang, während der Zusammenhang den Bezug nicht bestimmt.
lexical_decisions:
- source_word: ligno
  choice: Holz
  rationale: 'Der lateinische Ablativ mit de bezeichnet den Ausgangspunkt: „aus Holz“. „Lignum“ kann je nach Zusammenhang auch einen Baum oder ein Stück Holz meinen; die knappe Bildsprache bleibt mit „Holz“ erhalten.'
- source_word: stillabit
  choice: wird … tropfen
  rationale: „Stillare“ bedeutet tropfen oder herabtropfen und wird im Deutschen mit der Stellung des Subjekts „Blut“ natürlich wiedergegeben.
- source_word: dabit vocem suam
  choice: wird seine Stimme erheben
  rationale: Die wörtliche Wendung „seine Stimme geben“ wäre im Deutschen unnatürlich. „Seine Stimme erheben“ bewahrt die Personifikation und vermittelt, dass der Stein hörbar wird, ohne den Inhalt seiner Äußerung festzulegen.
- source_word: populi commovebuntur
  choice: die Völker werden erschüttert werden
  rationale: Der Plural „populi“ wird als „Völker“ wiedergegeben. „Erschüttert werden“ bewahrt die passive Form und die Spannweite von „commovere“ zwischen Bewegung und heftiger Erregung.
- source_word: gressus commutabuntur
  choice: die Schritte werden sich ändern
  rationale: „Gressus“ bezeichnet zunächst Schritte, kann aber auch Gang, Fortbewegung oder Verlauf meinen. Die Formulierung bleibt nahe am konkreten apokalyptischen Bild; die reflexive deutsche Wiedergabe vermeidet das schwerfällige doppelte Futurpassiv.
theological_decisions:
- issue: Personifikation des Steins
  choice: „der Stein wird seine Stimme erheben“
  alternative: „der Stein wird laut rufen“
  rationale: Die gewählte Fassung wahrt die ungewöhnliche Ausdrucksweise des lateinischen Textes und legt nicht fest, ob verständliche Worte, ein Ruf oder ein anderes Geräusch gemeint sind.
- issue: Bedeutung der veränderten „gressus“
  choice: „die Schritte werden sich ändern“
  alternative: „die Wege/Läufe werden verändert werden“
  rationale: Der Text erklärt nicht, wessen Schritte gemeint sind oder ob „gressus“ übertragen zu verstehen ist. Deshalb wird die Mehrdeutigkeit nicht durch eine Deutung auf Lebenswege, Himmelsläufe oder politische Entwicklungen aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die knappe lateinische Zeichenfolge. Das wiederholte Futur trägt den prophetisch-apokalyptischen Ton; Semikolon und parallele Satzglieder strukturieren die vier Zeichen.
