    rationale: Die deutsche Formulierung kann nahelegen, das Blut bestehe aus Holz. De ligno bezeichnet hier vielmehr, dass Blut von bzw. aus Holz hervortritt.
  - severity: medium
    issue: „der Stein wird seine Stimme erheben“ konkretisiert die Lautäußerung zu stark.
    rationale: Dabit vocem suam sagt lediglich, dass der Stein seine Stimme gibt bzw. hören lässt; „Stimme erheben“ legt eher ein absichtliches Reden oder Protestieren nahe.
  - severity: low
