  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: de
  text: und aus allen Tiefen des Meeres fülltest du dir einen einzigen Wasserlauf[a], und aus allen erbauten Städten heiligtest du dir selbst Zion,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer abweichenden Textfassung: »und aus allen erschaffenen Vögeln nanntest du dir eine einzige Taube, und aus allem geformten Vieh sahst du dir ein einziges Schaf vor«.'
    reason: previous_rendering
lexical_decisions:
- source_word: abyssis maris
  choice: Tiefen des Meeres
  rationale: Gibt den lateinischen Plural und die maritime Bestimmung unmittelbar und natürlich wieder.
- source_word: replesti tibi rivum unum
  choice: fülltest du dir einen einzigen Strom
  rationale: Bewahrt das konkrete Verb „replesti“, den ethischen Dativ „tibi“ und die Hervorhebung von „unum“.
- source_word: aedificatis civitatibus
  choice: erbauten Städten
  rationale: Knappes, idiomatisches Deutsch für das substantivierte Partizip; die abgeschlossene Errichtung bleibt erkennbar.
- source_word: sanctificasti tibimet ipsi Sion
  choice: heiligtest du dir Zion
  rationale: „heiligen“ entspricht „sanctificare“; „dir“ gibt den verstärkten Rückbezug auf Gott natürlich wieder, ohne im Deutschen schwerfällig zu werden.
theological_decisions:
- issue: Bedeutung der Erwählung Zions
  choice: heiligtest du dir Zion
  alternative: sondertest du Zion für dich aus
  rationale: Die Übersetzung hält am kultisch-theologischen Ausdruck „sanctificasti“ fest und deutet ihn nicht ausschließlich als Erwählung oder Aussonderung.
- issue: Stark abweichende alternative Textgestalt
  choice: Haupttext nach der angegebenen gereinigten lateinischen Quelle; alternative Fassung in der Fußnote
  alternative: Vogel-, Tauben-, Vieh- und Schaf-Fassung im Haupttext
  rationale: Die vorgelegte lateinische Quelle bezeugt Meerestiefen, Strom, Städte und Zion; die überlieferte frühere Fassung wird transparent dokumentiert, aber nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die lateinische Satzstruktur. Der Marker [a] steht unmittelbar nach der textkritisch betroffenen ersten Satzhälfte.
