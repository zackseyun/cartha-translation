review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den vollständigen lateinischen Vers wieder, einschließlich der Antwort »non potes« und Esras anschließender Klage. »Mit ansehen müsste« trifft jedoch den finalen, kontrafaktischen Gedanken von »ut non viderem« weniger genau als ein Konjunktiv der Vergangenheit. Die Genitivverbindung bei »generis Israhel« sollte im Deutschen ausdrücklich markiert werden.
  naturalness: Der Ton ist klar und würdevoll. »Damit ich … nicht hätte sehen müssen« bildet Zweck und rückblickend-unerfüllten Wunsch idiomatisch und präziser ab. »des Geschlechts Israels« ist modernes Standarddeutsch und natürlicher als »des Geschlechts Israel«.
  terminology: »Schoß meiner Mutter«, »Leid Jakobs« und »Erschöpfung des Geschlechts Israels« sind quellentreu. »Geschlecht« bewahrt die Offenheit von genus zwischen Abstammungsgemeinschaft und Volk; eine Engführung zu »Volk« oder »Nachkommenschaft« ist nicht nötig.
  issues:
  - severity: medium
    issue: Kontrafaktischer finaler Nebensatz
    rationale: Lateinisch »ut non viderem« steht im Kontext der nicht eingetretenen Möglichkeit, dass der Mutterleib zum Grab geworden wäre. »nicht mit ansehen müsste« klingt eher gegenwartsbezogen bzw. hypothetisch-offen. »nicht hätte sehen müssen« gibt den rückblickenden, unerfüllten Wunsch genauer wieder.
  - severity: low
    issue: Genitiv bei »generis Israhel«
    rationale: »des Geschlechts Israel« ist zwar bibelsprachlich möglich, aber im modernen Standarddeutsch weniger natürlich. »des Geschlechts Israels« kennzeichnet die lateinische Zugehörigkeitsbeziehung klar.
