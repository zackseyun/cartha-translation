base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: de
  text: 'Und er sagte zu mir: »Du kannst es nicht.« Da sagte ich: »Warum, Herr? Warum wurde ich überhaupt geboren? Warum wurde der Schoß meiner Mutter nicht zu meinem Grab, damit ich das Leid Jakobs und die Erschöpfung des Geschlechts Israels nicht hätte sehen müssen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  choice: Du kannst es nicht
  rationale: Gibt die knappe lateinische Verneinung wieder; das im Deutschen nötige Objekt »es« bleibt inhaltlich unbestimmt und bewahrt so den Kontextbezug.
- source_word: quid nascébar
  choice: Warum wurde ich überhaupt geboren?
  rationale: Das idiomatische »überhaupt« bringt die klagende, existenzielle Zuspitzung der Frage zum Ausdruck, ohne zusätzliche Sachinformation einzuführen.
- source_word: matrix matris meae
  choice: der Schoß meiner Mutter
  rationale: Natürliches, würdevolles Deutsch für den Mutterleib; die Wiederholung von matrix und mater lässt sich so verständlich wiedergeben.
- source_word: labor Iacob
  choice: das Leid Jakobs
  rationale: labor bezeichnet hier im Zusammenhang des Klagens Bedrängnis, Mühsal oder Leid; »Leid« ist klar und umfasst diese Belastung.
- source_word: defatigationem generis Israhel
  choice: die Erschöpfung des Geschlechts Israel
  rationale: »Erschöpfung« wahrt die Bedeutung von defatigatio; »Geschlecht Israel« gibt genus Israhel formal und in biblisch-würdevollem Register wieder, ohne es eindeutig auf Volk, Abstammung oder Generation festzulegen.
theological_decisions:
- issue: Bezeichnung der Gemeinschaft Israels mit genus
  choice: Geschlecht Israel
  alternative: Volk Israel / Nachkommenschaft Israels
  rationale: Die gewählte Formulierung bewahrt die semantische Offenheit zwischen Abstammungsgemeinschaft und Volk und vermeidet eine unnötige konfessionelle oder ethnologische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Warum-Fragen und die drastische Gegenüberstellung von Mutterleib und Grab bleiben erhalten. »Mit ansehen müsste« gibt den irrealen Wunsch nach Nichtgeburt im abschließenden Zwecksatz idiomatisch wieder.
