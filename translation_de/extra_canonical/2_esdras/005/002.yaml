source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multiplicabitur iniustitia super hanc quam ipse tu vides et super quam audisti olim.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/002.yaml
  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: de
  text: Und die Ungerechtigkeit wird sich vermehren über das hinaus, was du selbst siehst, und über das hinaus, was du einst gehört hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicabitur
  choice: wird noch größer werden
  rationale: Gibt die zukünftige starke Zunahme idiomatisch wieder; ein wörtliches „wird vervielfacht werden“ klänge im Deutschen unnatürlich und könnte eine äußere handelnde Instanz unnötig hervorheben.
- source_word: iniustitia
  choice: Ungerechtigkeit
  rationale: Entspricht dem breiten moralischen Bedeutungsfeld des lateinischen Begriffs und bewahrt dessen abstrakte Form.
- source_word: super hanc ... et super quam
  choice: als das ... und als das
  rationale: 'Versteht „super“ in beiden parallelen Gliedern komparativ: Die künftige Ungerechtigkeit übersteigt das gegenwärtig Gesehene und das früher Gehörte.'
- source_word: ipse tu vides
  choice: du selbst siehst
  rationale: Bewahrt die ausdrückliche Hervorhebung des Adressaten durch „ipse tu“.
- source_word: audisti olim
  choice: wovon du vor langer Zeit gehört hast
  rationale: „vor langer Zeit“ gibt „olim“ natürlich wieder; „wovon ... gehört hast“ verdeutlicht im Deutschen den Bezug auf das zuvor genannte Ausmaß der Ungerechtigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Vergleichsstruktur des Lateinischen bleibt sichtbar; die passive lateinische Form wird zugunsten einer natürlichen deutschen Zustandszunahme wiedergegeben.
