id: 2ES.5.12
reference: 2 Esdras 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: de
  text: Ist die Gerechtigkeit vorübergegangen – oder jemand, der Gerechtigkeit übt?[a] Und sie wird Nein sagen. Zu jener Zeit werden die Menschen hoffen und nichts erlangen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut ist hier knapp und möglicherweise gestört; die Frage setzt offenbar den vorherigen Vers fort.
    reason: textual_ambiguity
lexical_decisions:
- source_word: pertransiit
  choice: ist … vorübergegangen
  rationale: Gibt das lateinische Perfekt und die Grundbedeutung von „pertransire“ wieder, ohne die ungewöhnliche, offenbar an 5,11 anschließende Frage zu glätten.
- source_word: iustitia
  choice: die Gerechtigkeit
  rationale: Entspricht dem abstrakten lateinischen Substantiv und bewahrt dessen mögliches Auftreten als handelndes Subjekt.
- source_word: iustum faciens
  choice: jemand, der Gerechtigkeit übt
  rationale: Gibt die semitisch geprägte Wendung als Bezeichnung eines gerecht Handelnden wieder und vermeidet die missverständliche Deutung „jemanden gerecht machen“.
- source_word: negabit
  choice: wird Nein sagen
  rationale: Im Zusammenhang bezeichnet „negare“ eine verneinende Antwort; diese Wiedergabe folgt dem knappen Dialogcharakter.
- source_word: sperabunt … et non impetrabunt
  choice: werden hoffen und nichts erlangen
  rationale: Bewahrt den Gegensatz zwischen Hoffnung und ausbleibendem Erfolg; „nichts“ macht das im Lateinischen nicht eigens genannte Objekt im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Bezug von „haec“ in „et haec negabit“
  choice: „sie“ bezieht sich grammatisch naheliegend auf „die Gerechtigkeit“
  alternative: Unpersönlich „es wird Nein sagen“ oder Bezug auf eine andere Größe aus dem vorherigen Vers
  rationale: Das feminine Demonstrativpronomen „haec“ stimmt formal mit „iustitia“ überein. Die Übersetzung lässt die ungewöhnliche Personifikation stehen, statt sie theologisch auszudeuten.
- issue: Deutung von „iustum faciens“
  choice: eine Person, die gerecht handelt
  alternative: jemand, der einen anderen gerecht macht
  rationale: Die Wendung entspricht wahrscheinlich einer semitischen Ausdrucksweise für das Tun von Gerechtigkeit. Eine soteriologische Festlegung wäre vom Wortlaut nicht gefordert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abgebrochene beziehungsweise ungewöhnlich gebaute Frage und die Personifikation der Gerechtigkeit bleiben erhalten. Das Semikolon am Versende signalisiert den fortlaufenden Satz, ohne bereits den Text von 5,13 einzubeziehen.
