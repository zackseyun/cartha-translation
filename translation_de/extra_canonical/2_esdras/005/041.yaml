  yaml_path: translation/extra_canonical/2_esdras/005/041.yaml
  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: de
  text: 'Und ich sagte[a]: »Doch sieh, Herr, du stehst denen vor, die am Ende sind. Und was werden die tun, die vor uns waren, oder wir selbst oder die, die nach uns kommen werden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer früheren Wiedergabe: »Doch sieh, Herr, du stehst denen vor, die am Ende sind. Aber was …«'
    reason: previous_rendering
lexical_decisions:
- source_word: sed ecce
  choice: Doch sieh
  rationale: Gibt sowohl den Gegensatz von „sed“ als auch den aufmerksamkeitslenkenden Ausdruck „ecce“ knapp und in würdigem, verständlichem Deutsch wieder.
- source_word: praees
  choice: du stehst … vor
  rationale: Bewahrt die Bedeutung des Vorstehens bzw. Leitens, ohne sie stärker als Herrschaft, Fürsorge oder Gericht auszulegen.
- source_word: qui in fine sunt
  choice: die am Ende sind
  rationale: Erhält die unbestimmte Formulierung des Lateinischen und ergänzt nicht ausdrücklich „der Zeiten“ oder „der Welt“.
- source_word: quid facient
  choice: was werden … tun
  rationale: Entspricht dem lateinischen Futur und bewahrt die offene Frage.
- source_word: qui ante nos sunt
  choice: die vor uns waren
  rationale: Gibt den im Kontext gemeinten zeitlichen Vorrang früherer Generationen in natürlichem Deutsch wieder; ein wörtliches „vor uns sind“ wäre missverständlich.
- source_word: aut nos aut hi qui post nos
  choice: oder wir selbst oder die, die nach uns kommen werden
  rationale: Bewahrt die dreifache zeitliche Gegenüberstellung und macht den Bezug auf spätere Generationen idiomatisch deutlich.
theological_decisions:
- issue: Bedeutung von „am Ende“
  choice: Die Wendung bleibt ohne erklärenden Zusatz stehen.
  alternative: „am Ende der Zeiten“ oder „am Ende der Welt“
  rationale: Der Quelltext nennt nicht ausdrücklich, wessen Ende gemeint ist; eine nähere Bestimmung würde die eschatologische Aussage unnötig festlegen.
- issue: Art des Vorstehens Gottes
  choice: „du stehst denen vor“
  alternative: „du herrschst über“ oder „du sorgst für“
  rationale: Die neutrale Wiedergabe bewahrt die Spannweite von „praees“ und vermeidet eine einseitige theologische Deutung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Ton. „Doch sieh“ bewahrt den rhetorischen Nachdruck, während Satzbau und Zeitbezüge für heutige Leser verständlich bleiben.
