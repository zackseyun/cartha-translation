lexical_decisions:
- source_word: insipiens
  choice: unverständig
  rationale: Gibt die Selbsteinschätzung als Mangel an Einsicht würdig und natürlich wieder; „töricht“ wäre stärker wertend.
- source_word: quomodo potero dicere
  choice: wie könnte ich da … sprechen
  rationale: Bewahrt die rhetorische Frage und gibt „potero“ im Deutschen idiomatisch als Ausdruck des Unvermögens wieder.
- source_word: de his quibus
  choice: über diese Dinge …, über die
  rationale: Erhält die Beziehung der beiden lateinischen Ausdrücke und lässt den überlieferten Satz bewusst unvollendet.
theological_decisions:
- issue: Unvollständiger überlieferter Satz
  choice: Den Abbruch nach „über die“ sichtbar beibehalten
  alternative: Den Gedanken aus dem weiteren Kontext ergänzen
  rationale: Der bereitgestellte lateinische Quelltext endet bei „quibus“. Eine inhaltliche Ergänzung würde nicht belegte Aussage in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt gut verständlich und bildet zugleich den abrupten Abbruch der lateinischen Vorlage ab.
