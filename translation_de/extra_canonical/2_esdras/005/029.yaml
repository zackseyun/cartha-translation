  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: de
  text: Und diejenigen, die deinen Verheißungen widersprachen, haben jene zertreten, die auf deine Bündnisse vertrauten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Wortlaut ist syntaktisch schwierig: Sowohl „die deinen Verheißungen widersprachen“ als auch „die deinen Bündnissen glaubten“ steht formal im Nominativ. Daher kann der Text auch so verstanden werden, dass beide Gruppen gemeinsam die Handelnden sind; ein Objekt zu „zertreten“ wäre dann nicht ausdrücklich bezeichnet.'
    reason: Macht die tatsächliche grammatische Unsicherheit transparent, ohne eine semantisch unzureichende scheinwörtliche Übersetzung zu erzeugen.
lexical_decisions:
- source_word: conculcaverunt
  choice: haben … zertreten
  rationale: Gibt das lateinische Perfekt und das gewaltsame Bild von conculcare natürlich und prägnant wieder.
- source_word: contradicebant sponsionibus tuis
  choice: die deinen Verheißungen widersprachen
  rationale: Bewahrt die Konstruktion mit dem Dativ und den Sinn des fortgesetzten Widerstands gegen Gottes Zusagen.
- source_word: testamentis tuis
  choice: deinen Bundesschlüssen
  rationale: Testamentum bezeichnet im biblischen Latein häufig einen Bund; der Plural des Ausgangstextes bleibt erhalten.
- source_word: credebant
  choice: glaubten
  rationale: Entspricht dem Grundsinn und lässt sowohl Vertrauen als auch Für-wahr-Halten anklingen.
theological_decisions:
- issue: Verhältnis der beiden Relativgruppen
  choice: Die Gegner der Verheißungen werden als diejenigen verstanden, die die Glaubenden zertreten.
  alternative: Beide Relativgruppen könnten aufgrund der überlieferten lateinischen Nominativformen gemeinsam als Subjekt von „zertreten“ gelesen werden.
  rationale: Diese Deutung ergibt den klarsten inhaltlichen Gegensatz und entspricht der geprüften englischen Konsultationsfassung; die grammatische Schwierigkeit des lateinischen Wortlauts wird jedoch in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bundesschlüsse“ wahrt den biblisch-theologischen Gehalt von testamenta, ohne konfessionelle Sonderdeutung; die ungewöhnliche Syntax wird nicht im Haupttext belastend nachgebildet, sondern transparent vermerkt.
