  terminology: „Verheißungen“ trifft sponsiones. „Bündnisse“ ist für testamenta im biblisch-lateinischen Kontext die geläufige, theologisch neutrale Wiedergabe und bewahrt den Plural. „Zertreten“ gibt conculcaverunt angemessen kräftig wieder.
