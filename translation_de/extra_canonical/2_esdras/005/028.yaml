revisions:
- from: Und nun, Herr, warum hast du den Einen den Vielen ausgeliefert, die eine Wurzel über die anderen erhoben und deinen Einzigen unter den Vielen zerstreut?
  to: Und nun, Herr, warum hast du den Einen den Vielen ausgeliefert und eine Wurzel über die anderen gestellt und deinen Einzigen unter den Vielen zerstreut?
  rationale: Die Revision stellt die gemeinsame Anrede Gottes als Subjekt aller drei Verben eindeutig her. Die Ein–Viele-Gegenüberstellungen und die bewusst nicht erklärte Bildsprache bleiben erhalten. Die englische Fußnote bezieht sich laut Audit Trail auf die frühere, falsch ausgerichtete Versfassung und erhält daher keine deutsche Fußnotenmarkierung.
