review_pass:
  verdict: revise
  source_fidelity: Die drei Prädikate des lateinischen Fragesatzes (tradidisti, praeparasti, dispersisti) haben sämtlich den Herrn als Subjekt. Der Entwurf gibt die Grundbegriffe ansonsten treffend wieder, lässt aber durch die Relativsatzkonstruktion fälschlich die Vielen zu Handelnden der folgenden Verben werden.
  naturalness: Die beabsichtigte dreigliedrige Klage ist im Deutschen natürlich und würdig wiederzugeben. Eine koordinierende Verbfolge beseitigt die grammatische Mehrdeutigkeit und bewahrt den Rhythmus.
  terminology: „der Eine“, „eine Wurzel“ und „deinen Einzigen“ bewahren die singulären Bilder des Lateins, ohne ihren kollektiven Bezug ausdeutend festzulegen. „Über die anderen gestellt“ gibt praeparasti ... super alias in diesem Kontext verständlich wieder, ohne die Metapher aufzugeben.
  issues:
  - severity: high
    issue: Fehlbezug durch „die eine Wurzel ... erhoben und ... zerstreut“
    rationale: Nach „den Einen den Vielen ausgeliefert“ macht das Relativpronomen „die“ grammatisch die Vielen zum Subjekt von „erhoben“ und „zerstreut“. Im Lateinischen ist jedoch durchgehend Gott angesprochen und Subjekt aller drei Handlungen.
  - severity: low
    issue: „erhoben“ ist für praeparasti stärker interpretierend
    rationale: Das lateinische praeparasti bedeutet primär „bereitet/vorbereitet“ und kann im Kontext eine bevorzugte Stellung implizieren. „Über ... gestellt“ bringt diese Stellung idiomatisch zum Ausdruck, ohne eine körperliche Erhebung nahezulegen.
  revised_text: Und nun, Herr, warum hast du den Einen den Vielen ausgeliefert und eine Wurzel über die anderen gestellt und deinen Einzigen unter den Vielen zerstreut?
