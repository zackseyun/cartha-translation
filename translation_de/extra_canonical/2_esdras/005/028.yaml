source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: de
  text: Und nun, Herr, warum hast du den Einen den Vielen ausgeliefert und eine Wurzel über die anderen gestellt und deinen Einzigen unter den Vielen zerstreut?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tradidisti
  choice: hast du … ausgeliefert
  rationale: Gibt das Übergeben in fremde Gewalt natürlich und mit der im Kontext naheliegenden Härte wieder.
- source_word: unum / unicum tuum
  choice: den Einen / deinen Einzigen
  rationale: Bewahrt die wiederholte Gegenüberstellung des einen erwählten Volkes mit den vielen anderen, ohne den Bezug im Text ausdrücklich festzulegen.
- source_word: praeparasti
  choice: erhoben
  rationale: Im Zusammenhang mit „über die anderen“ bezeichnet das Verb hier das bevorzugte Einsetzen beziehungsweise Herausstellen der einen Wurzel; „erhoben“ ergibt idiomatisches Deutsch.
- source_word: radicem
  choice: Wurzel
  rationale: Bewahrt das konkrete Bild und seine kollektive, theologisch offene Bedeutung.
- source_word: dispersisti
  choice: zerstreut
  rationale: Entspricht dem räumlichen Verteilen beziehungsweise Verstreuen unter vielen.
theological_decisions:
- issue: Bezug von „der Eine“, „eine Wurzel“ und „dein Einziger“
  choice: Die singularischen Bilder bleiben ohne erklärenden Zusatz stehen.
  alternative: Sie ausdrücklich auf Israel beziehungsweise das erwählte Volk beziehen.
  rationale: Der Zusammenhang legt einen kollektiven Bezug nahe, doch der Vers selbst benennt ihn nicht; die Übersetzung wahrt daher Bildsprache und mögliche theologische Spannung.
- issue: Bedeutung von „praeparasti … super alias“
  choice: „die eine Wurzel über die anderen erhoben“
  alternative: „eine Wurzel vor den anderen bereitet“
  rationale: „Erhoben“ macht die Vorrangstellung im Deutschen verständlich, ohne eine bestimmte Lehre über Erwählung weiter auszuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Klage und die dreifache Ein-viele-Gegenüberstellung werden bewahrt; keine Fußnote, da die im englischen Konsultationstext vermerkte frühere Fassung nachweislich zum folgenden Vers gehört.
