id: 2ES.5.6
reference: 2 Esdras 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et regnabit quem non sperant qui inhabitant super terram; et volatilia conmigrationem facient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/006.yaml
  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: de
  text: Und einer, den die Bewohner der Erde nicht erwarten, wird herrschen; und die Vögel werden fortziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnabit
  choice: wird herrschen
  rationale: Gibt das zukünftige königliche Regieren wieder, ohne im Deutschen unnötig ausdrücklich einen Königstitel einzuführen.
- source_word: quem non sperant
  choice: den … nicht erwarten
  rationale: Das lateinische sperare kann hier im Zusammenhang das erwartende Ausschauhalten bezeichnen; „nicht erhoffen“ wäre möglich, würde aber stärker eine wertende Ablehnung nahelegen.
- source_word: qui inhabitant super terram
  choice: die Bewohner der Erde
  rationale: Natürliche und würdevolle Wiedergabe der auf der Erde Wohnenden.
- source_word: volatilia
  choice: die Vögel
  rationale: Im Kontext ist dies die natürliche deutsche Bezeichnung für fliegende Tiere.
- source_word: conmigrationem facient
  choice: werden fortziehen
  rationale: Idiomatiche Wiedergabe des Wanderungs- beziehungsweise Zugvorgangs; ein zusätzliches „gemeinsam“ ist durch die lateinische Form nicht zwingend gefordert.
theological_decisions:
- issue: Identität des unerwarteten Herrschers
  choice: Die unbestimmte Formulierung „einer“ bleibt erhalten.
  alternative: Den Herrscher ausdrücklich messianisch oder anderweitig identifizieren.
  rationale: Der lateinische Text nennt keine Identität; eine nähere theologische Bestimmung wäre eine interpretierende Ergänzung.
translation_notes:
  register: Modernes Standarddeutsch in knapper, prophetisch-würdevoller Sprache. Der parallele Satzbau und das Futur des lateinischen Textes bleiben gewahrt.
source_grounding:
  english_pob_role: consult_only
