  source_fidelity: Die Übersetzung gibt die Satzstruktur und die Zukunftsaussagen des lateinischen Textes präzise wieder. „Einer“ bewahrt die unbestimmte Bezugnahme von „quem“, „nicht erwarten“ trifft „non sperant“ im vorliegenden Kontext, und „wird herrschen“ entspricht regnabit ohne eine nicht ausdrücklich genannte Königswürde einzutragen. „Die Vögel werden fortziehen“ ist eine idiomatische, kontextgerechte Wiedergabe von volatilia conmigrationem facient.
  naturalness: Modernes, klares Standarddeutsch mit angemessen knappem prophetischem Register. Die Wiederholung von „und“ und die Semikolonverbindung bilden den parataktischen Charakter der Vorlage gut ab.
  terminology: „Bewohner der Erde“, „herrschen“ und „Vögel“ sind verständlich, sachgerecht und theologisch nicht überbestimmt. „Fortziehen“ bezeichnet bei Vögeln natürlich den Zug beziehungsweise die Abwanderung und fügt kein zwingendes „gemeinsam“ hinzu.
