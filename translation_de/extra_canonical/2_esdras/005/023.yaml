base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/023.yaml
  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
translation:
  language: de
  text: 'Und ich sagte: »Herrscher, Herr, aus allen Wäldern der Erde und aus all ihren Bäumen hast du einen einzigen Weinberg erwählt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Fassung gab hier offenbar irrtümlich den Inhalt des folgenden Verses wieder: »Und aus allen Ländern der Welt hast du dir eine Grube erwählt, und aus allen Blumen der Welt hast du dir eine Lilie erwählt.«'
    reason: previous_rendering
lexical_decisions:
- source_word: Dominator Domine
  choice: Herrscher, Herr
  rationale: Bewahrt die zweigliedrige Anrede und gibt sowohl die souveräne Herrschaft als auch den Herrentitel wieder.
- source_word: ex omni silva terrae
  choice: aus allen Wäldern der Erde
  rationale: Natürliches modernes Deutsch für die distributive lateinische Wendung; der Bezug auf die gesamte Erde bleibt erhalten.
- source_word: ex omnium arborum eius
  choice: aus all ihren Bäumen
  rationale: Das Pronomen bezieht sich auf die Erde; die partitive Auswahl aus der Gesamtheit ihrer Bäume wird gewahrt.
- source_word: elegisti vineam unam
  choice: hast du einen einzigen Weinstock erwählt
  rationale: „Erwählt“ erhält den bewussten Auswahlakt; „einen einzigen“ bildet die Hervorhebung von unam ab, und „Weinstock“ passt zum männlichen deutschen Genus.
theological_decisions:
- issue: Mögliche symbolische Bedeutung des einen Weinstocks
  choice: Die Bildsprache bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Weinstock im Text als Israel oder Gottes Volk erklären.
  rationale: Der Vers selbst nennt die symbolische Entsprechung nicht; eine Deutung würde die vorhandene Offenheit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich feierliche Doppelanrede „Herrscher, Herr“ und die metaphorische Gegenüberstellung von Bäumen und einem Weinstock bleiben bewusst erhalten.
