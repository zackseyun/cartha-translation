  terminology: „Erwählt“ gibt „elegisti“ präzise wieder. „Weinberg“ stellt die erforderliche Entsprechung zu „vinea“ her, ohne die im Bild enthaltene symbolische Offenheit auszudeuten. Die Fußnote ist als Hinweis auf die frühere Fehlzuordnung sachlich zutreffend und korrekt am Vers verankert.
