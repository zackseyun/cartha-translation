  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Begriffe des lateinischen Textes zutreffend wieder: die Frage „me interrogasti?“, den Vergleich mit der Unfähigkeit, eines der zuvor erwähnten Dinge zu tun, und „inuenire iudicium“. „Vollbringen“ ist möglich, aber „tun“ entspricht facere unmittelbarer und vermeidet eine leichte Bedeutungsverengung auf eine besondere Leistung.'
  naturalness: Der Text ist insgesamt gutes modernes Standarddeutsch. „Dingen, die gesagt worden sind“ ist jedoch näher an quae dicta sunt und zugleich idiomatischer als „genannten Dingen“, das auch bloßes Aufzählen oder Benennen nahelegen kann.
  terminology: „Gericht“ bewahrt die Offenheit von iudicium und ist in diesem Kontext angemessen. Eine possessive Ergänzung („mein Gericht“) oder die im englischen Audit-Trail erwähnte Aussage über die Liebe darf nicht ergänzt werden, da sie im vorgelegten lateinischen Wortlaut fehlt.
