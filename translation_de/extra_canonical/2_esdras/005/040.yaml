source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me interrogasti? Et dixit ad me: quomodo non potes facere unum de his quae dicta sunt, sic non poteris inuenire iudicium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
translation:
  language: de
  text: '„Hast du mich gefragt?“ Und er sagte zu mir: „So wie du keines von diesen Dingen, die gesagt worden sind, tun kannst, wirst du auch das Gericht nicht ergründen können.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facere
  choice: vollbringen
  rationale: Das lateinische Verb bedeutet wörtlich „tun/machen“; „vollbringen“ gibt hier natürlich wieder, dass Esra keines der zuvor genannten Dinge zustande bringen kann.
- source_word: unum de his quae dicta sunt
  choice: keines von diesen genannten Dingen
  rationale: Die Wiedergabe bewahrt den Bezug auf die zuvor ausgesprochenen Aufgaben und formuliert die lateinische Konstruktion idiomatisch auf Deutsch.
- source_word: inuenire iudicium
  choice: das Gericht ergründen
  rationale: „Ergründen“ bringt in diesem Zusammenhang das Herausfinden beziehungsweise Begreifen zum Ausdruck; „Gericht“ wahrt die theologisch und semantisch offene Bedeutung von iudicium.
theological_decisions:
- issue: Umfang des abschließenden Ausspruchs
  choice: Nur das im vorgelegten lateinischen Text vorhandene „iudicium“ wird übersetzt.
  alternative: Ergänzung von „mein Gericht“ oder einer Aussage über Ziel/Vollendung der verheißenen Liebe.
  rationale: Die Zusätze stehen nicht im bereitgestellten lateinischen Ausgangstext und werden daher trotz ihrer Bezeugung in anderen Fassungen oder früheren Bearbeitungsständen nicht in den Haupttext aufgenommen.
- issue: Bestimmtheit und Zugehörigkeit des Gerichts
  choice: „das Gericht“
  alternative: „mein Gericht“
  rationale: Der lateinische Text hat iudicium ohne Possessivpronomen. Die Übersetzung vermeidet eine sachlich plausible, aber textlich nicht vorhandene Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ungewöhnliche einleitende Fragesatz „Hast du mich gefragt?“ wird entsprechend dem überlieferten Wortlaut stehen gelassen, ohne eine nicht belegte Ergänzung wie „Warum“ einzufügen.
