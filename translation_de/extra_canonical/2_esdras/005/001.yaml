id: 2ES.5.1
reference: 2 Esdras 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: de
  text: 'Was aber die Zeichen betrifft: Siehe, es kommen Tage, da werden die Bewohner der Erde von großem Entsetzen ergriffen[a], der Weg der Wahrheit wird verborgen sein, und das Land wird an Glauben unfruchtbar sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von großer Bestürzung ergriffen“.'
    reason: Die ungewöhnliche lateinische Wendung „in excessu multo“ kann neben heftigem Schrecken auch starke Bestürzung oder Verwirrung bezeichnen.
lexical_decisions:
- source_word: de signis autem
  choice: Was aber die Zeichen betrifft
  rationale: Gibt die Themenangabe und den weiterführenden Gegensatz des lateinischen „autem“ natürlich und vollständig wieder.
- source_word: ecce dies venient
  choice: Siehe, es kommen Tage
  rationale: Bewahrt das prophetisch-apokalyptische Signalwort „ecce“ sowie die Zukunftsaussage in würdigem, verständlichem Deutsch.
- source_word: adprehendentur ... in excessu multo
  choice: werden ... von großem Entsetzen ergriffen
  rationale: „Ergriffen werden“ bildet „adprehendentur“ ab; „Entsetzen“ gibt den hier wahrscheinlich gemeinten Zustand heftiger apokalyptischer Furcht wieder, ohne die mögliche Bedeutung „Bestürzung“ auszuschließen.
- source_word: qui inhabitant super terram
  choice: die Bewohner der Erde
  rationale: Eine natürliche substantivische Wiedergabe für „die, welche auf der Erde wohnen“.
- source_word: abscondetur veritatis via
  choice: der Weg der Wahrheit wird verborgen sein
  rationale: Bewahrt Bild, Genitivbeziehung und passiven Zukunftssinn des lateinischen Textes.
- source_word: sterilis erit a fide regio
  choice: das Land wird an Glauben unfruchtbar sein
  rationale: Erhält die auffällige Fruchtbarkeitsmetapher von „sterilis“ und gibt „a fide“ als den Bereich wieder, in dem Unfruchtbarkeit herrscht.
theological_decisions:
- issue: Bedeutung von „in excessu multo“
  choice: von großem Entsetzen ergriffen
  alternative: in großer Bestürzung / Verwirrung
  rationale: Im apokalyptischen Zusammenhang bezeichnet die zugrunde liegende Vorstellung wahrscheinlich panischen Schrecken. Da die Formulierung auch einen Zustand der Bestürzung oder Verwirrung zulässt, wird diese Spannung in einer Fußnote erhalten.
- issue: „fides“ als Glaube oder Treue
  choice: Glauben
  alternative: Treue
  rationale: „Glaube“ entspricht der naheliegenden Bedeutung von „fides“ in der überlieferten lateinischen Formulierung; der knappe Kontext erlaubt keine sichere Präzisierung auf menschliche Treue.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetisch-apokalyptischem Ton. „Siehe“ und die wiederholten Zukunftsformen bewahren den feierlichen Charakter; ungebräuchliche oder konfessionell geprägte Terminologie wird vermieden.
