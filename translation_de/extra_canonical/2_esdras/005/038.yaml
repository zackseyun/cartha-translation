source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: de
  text: 'Und ich sagte: »Gebieter, Herr, wer kann denn das wissen außer jemandem, der nicht bei den Menschen wohnt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Herr, Gebieter
  rationale: Die doppelte Anrede wird bewahrt; »Gebieter« gibt dominator würdig und verständlich wieder, während »Herr« domine entspricht.
- source_word: quis enim est qui potest haec scire
  choice: wer kann dies denn wissen
  rationale: »Denn« gibt enim wieder und erhält den nachdrücklichen, rhetorischen Charakter der Frage; »dies« fasst haec natürlich zusammen.
- source_word: nisi qui cum hominibus habitationem non habet
  choice: außer dem, der nicht unter den Menschen wohnt
  rationale: Die Wendung gibt das Nicht-Haben einer Wohnstätte bei den Menschen idiomatisch wieder, ohne die Aussage näher zu bestimmen oder theologisch aufzulösen.
theological_decisions:
- issue: Identität dessen, der nicht unter den Menschen wohnt
  choice: Die unbestimmte Formulierung »dem, der« bleibt erhalten.
  alternative: Eine ausdrückliche Identifikation mit Gott, einem Engel oder einem himmlischen Wesen.
  rationale: Der lateinische Text benennt die Person nicht ausdrücklich; eine Konkretisierung würde die genuine Offenheit des Verses beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die doppelte Anrede des lateinischen Textes bleiben erhalten; keine Fußnote ist erforderlich.
