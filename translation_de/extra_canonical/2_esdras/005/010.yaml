source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: de
  text: Und viele werden danach suchen und es nicht finden; Unrecht und Zügellosigkeit werden sich auf der Erde mehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur a multis
  choice: viele werden danach suchen
  rationale: Die lateinische unpersönliche Passivkonstruktion wird natürlich ins Deutsche übertragen; „danach“ bewahrt den nicht ausdrücklich genannten Gegenstand der Suche.
- source_word: non invenietur
  choice: es nicht finden
  rationale: Das Pronomen „es“ hält den im Kontext vorausgesetzten, in diesem Vers aber ungenannten Suchgegenstand offen.
- source_word: iniustitia
  choice: Unrecht
  rationale: „Unrecht“ ist eine natürliche und breite Wiedergabe, die sowohl ungerechtes Handeln als auch einen Zustand der Ungerechtigkeit umfassen kann.
- source_word: incontinentia
  choice: Zügellosigkeit
  rationale: Der Begriff bezeichnet mangelnde Selbstbeherrschung; „Zügellosigkeit“ gibt die negative ethische Kraft im Zusammenhang prägnant wieder.
- source_word: multiplicabitur ... super terram
  choice: werden sich auf der Erde mehren
  rationale: Die koordinierte Singularform des Lateinischen wird im Deutschen wegen des zusammengesetzten Subjekts pluralisch wiedergegeben; „sich mehren“ entspricht dem Zunehmen bzw. Sich-Ausbreiten.
theological_decisions:
- issue: Nicht genannter Gegenstand der Suche
  choice: „danach“ bzw. „es“ ohne ergänzende Benennung
  alternative: Den Suchgegenstand aus dem vorherigen Kontext ausdrücklich einsetzen
  rationale: Der lateinische Vers lässt den Gegenstand grammatisch unausgesprochen. Die Übersetzung bewahrt diese Kontextabhängigkeit und vermeidet eine interpretierende Festlegung.
- issue: Bedeutungsumfang von incontinentia
  choice: „Zügellosigkeit“
  alternative: „Mangel an Selbstbeherrschung“
  rationale: „Zügellosigkeit“ ist im Deutschen idiomatischer und bewahrt den moralisch zugespitzten Sinn, ohne ihn auf einen einzelnen Bereich einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon macht die Zweiteilung des Verses deutlich, ohne den engen Zusammenhang der endzeitlichen Entwicklungen aufzulösen.
