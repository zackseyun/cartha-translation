    issue: Unidiomatische Wiedergabe von »factus es«
    rationale: »Du bist ... außer dir geraten« ist möglich, aber »Du bist ... außer dir gewesen« ist im heutigen Standarddeutsch natürlicher und gibt den resultativen Sinn von »factus es« klar wieder.
  - severity: low
    issue: Neutrales Pronomen bei Bezug auf Israel
    rationale: Das lateinische Verb enthält kein Pronomen. In der personifizierenden rhetorischen Frage ist »ihn« als Bezug auf Israel stilistisch und kontextuell näherliegend; die offene Vergleichsfrage bleibt dabei unverändert.
