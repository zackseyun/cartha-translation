  text: 'coram te. Et dixi: loquere, dominus meus. et dixit ad me: ualde in excessu mentis factus es in Israel; aut plus dilexisti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: de
  text: '… vor dir.« Und ich sagte[a]: »Sprich, mein Herr.« Da sagte er zu mir: »Du bist wegen Israel ganz außer dir gewesen; oder hast du ihn mehr geliebt …'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Fassung gab hier irrtümlich den Anfang des folgenden Verses wieder: »Und ich sagte: Nein, Herr, doch ich habe aus Kummer gesprochen; denn mein Innerstes quält mich jede Stunde, während ich den Weg des Höchsten zu begreifen und einen Teil seines Gerichts zu erforschen suche.«'
    reason: previous_rendering
lexical_decisions:
- source_word: loquere
  choice: Sprich
  rationale: Der lateinische Imperativ wird knapp und unmittelbar wiedergegeben.
- source_word: dominus meus
  choice: mein Herr
  rationale: Die Anrede wird trotz der nominativischen Form des spätlateinischen Textes ihrem offenkundigen vokativischen Sinn entsprechend übersetzt.
- source_word: ualde in excessu mentis factus es
  choice: du bist … völlig außer dir geraten
  rationale: Die natürliche deutsche Wendung bewahrt den starken Sinn eines Zustands außerhalb der gewöhnlichen geistigen Fassung besser als das schwächere „sehr bekümmert“.
- source_word: in Israel
  choice: wegen Israel
  rationale: In diesem Zusammenhang bezeichnet die Präposition den Anlass beziehungsweise Gegenstand seines Zustands.
- source_word: aut plus dilexisti
  choice: oder hast du es mehr geliebt
  rationale: Die unvollständige Vergleichsfrage des überlieferten Ausschnitts bleibt offen; „es“ nimmt das im Deutschen gewöhnlich sächliche „Israel“ auf.
theological_decisions:
- issue: Intensität und Art von Esras innerem Zustand
  choice: völlig außer dir geraten
  alternative: im Geist sehr bestürzt geworden
  rationale: Die Übersetzung erhält die Schärfe von „in excessu mentis“, ohne den Zustand vorschnell als bloße Trauer oder als besondere Ekstase theologisch festzulegen.
- issue: Offener Vergleich bei „plus dilexisti“
  choice: oder hast du es mehr geliebt …
  alternative: Oder liebst du es etwa mehr …
  rationale: Vergangenheit und Abbruch des lateinischen Fragments werden bewahrt; der unausgesprochene Vergleich wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Auslassungspunkte am Anfang und Ende zeigen an, dass der vorgelegte Quellenausschnitt mitten im Satz einsetzt und mitten in einer Vergleichsfrage abbricht.
