  verdict: revise
  source_fidelity: 'Der lateinische Text wird im Wesentlichen korrekt wiedergegeben: »loquere, dominus meus«, »ualde in excessu mentis factus es in Israel« und das unabgeschlossene »aut plus dilexisti« sind erfasst. Das Perfekt »factus es« und das Perfekt »dilexisti« sollten jedoch im Deutschen klarer als geschehene Zustandsveränderung bzw. vergangene Liebe erscheinen.'
  naturalness: »völlig außer dir geraten« ist verständlich, klingt jedoch idiomatisch weniger glatt als »ganz außer dir gewesen«. Die Satzstellung mit »wegen Israel« ist natürlich. Die direkte Anrede kann im würdigen modernen Deutsch mit »Herr« stehen.
  terminology: »mein Herr« gibt »dominus meus« angemessen wieder. »Israel« als sächliches Pronomen ist im Deutschen möglich; bei personifizierter Bezugnahme im Kontext ist »ihn« näherliegend und vermeidet, Israel wie ein bloßes Objekt klingen zu lassen. Die Ellipsen bewahren den fragmentarischen Ausschnitt.
