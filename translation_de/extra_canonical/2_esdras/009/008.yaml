  terminology: „Heil“ ist für salutare angemessen und bewahrt dessen theologische Breite. „Land“ und „Grenzen“ bewahren die Zweigliedrigkeit von terra mea et in finibus meis. „Seit Urzeiten“ gibt a saeculo idiomatisch wieder, ohne die Wendung zu einer Aussage über absolute Ewigkeit auszuweiten.
