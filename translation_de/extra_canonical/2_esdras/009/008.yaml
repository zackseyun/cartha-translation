  source_fidelity: 'Die Fassung gibt die zentralen Begriffe insgesamt zutreffend wieder: salutare meum als „mein Heil“, terra/fines als räumlich unterschiedene Bezeichnungen und a saeculo als nicht dogmatisch zugespitztes „seit Urzeiten“. Für relinquetur de praedictis periculis ist „aus den ... Gefahren übrig bleiben“ jedoch im Deutschen keine tragfähige Verbindung und lässt das gemeinte Entrinnen bzw. Verschontbleiben unnötig unklar. „den ... Gefahren entkommen“ gibt die kontextuelle Aussage idiomatisch wieder, ohne eine spezifische Rettungsmechanik festzulegen.'
