  text: relinquetur de praedictis periculis et videbit salutare meum in terra mea et in finibus meis, quae sanctificavi mihi a saeculo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: de
  text: wird den vorhergesagten Gefahren entkommen und mein Heil in meinem Land und innerhalb meiner Grenzen sehen, die ich mir seit Urzeiten geheiligt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquetur
  choice: wird … übrig bleiben
  rationale: Bewahrt den passiven bzw. resultativen Gedanken des Zurück- oder Übrigbleibens. Das im Kontext mögliche Überleben wird nicht stärker ausgedeutet, als es der lateinische Wortlaut verlangt.
- source_word: praedictis periculis
  choice: aus den vorhergesagten Gefahren
  rationale: Gibt das Ablativgefüge mit natürlichem Deutsch wieder und erhält die Charakterisierung der Gefahren als zuvor angekündigt.
- source_word: salutare meum
  choice: mein Heil
  rationale: Die substantivische Wendung bezeichnet Gottes rettendes Heil; „Heil“ wahrt dabei die theologische Weite.
- source_word: in terra mea et in finibus meis
  choice: in meinem Land und innerhalb meiner Grenzen
  rationale: Unterscheidet terra als Land von fines als Grenzen bzw. begrenztem Gebiet, ohne beide Ausdrücke zusammenzuziehen.
- source_word: a saeculo
  choice: seit Urzeiten
  rationale: Gibt die zeitliche Rückverweisung idiomatisch wieder, ohne sie dogmatisch auf absolute Ewigkeit festzulegen.
theological_decisions:
- issue: Bedeutung von relinquetur im Gerichtskontext
  choice: wird … übrig bleiben
  alternative: wird die … Gefahren überleben / wird aus den … Gefahren gerettet werden
  rationale: Die gewählte Fassung bewahrt das Motiv eines verbleibenden Restes und vermeidet, eine ausdrücklichere Rettungsaussage in das Verb hineinzulesen.
- issue: Bezug des Relativsatzes quae sanctificavi
  choice: Bezug auf „mein Land und … meine Grenzen“ als zusammengehörigen Bereich
  alternative: Bezug nur auf „meine Grenzen“
  rationale: Das feminine Pluralpronomen quae kann im Lateinischen die beiden koordinierten femininen Bezugswörter terra und fines gemeinsam aufnehmen; die deutsche Pluralform erhält diese naheliegende Lesart.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die etwas markante Wendung „aus den … Gefahren übrig bleiben“ wurde bewusst gewählt, um die genuine Spannung von relinquetur zwischen Übrigbleiben, Verschontwerden und Überleben nicht vorschnell aufzulösen.
