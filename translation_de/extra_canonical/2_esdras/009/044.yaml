  source_fidelity: Die Zeitangaben und das Imperfekt werden im Wesentlichen zutreffend wiedergegeben. Das lateinische Akkusativobjekt „Altissimum“ ist jedoch bei „deprecabar“ unmittelbarer als „den Höchsten anflehen“ abzubilden. „in all diesen“ fügt gegenüber „his“ eine nicht notwendige Verstärkung hinzu.
  naturalness: Die Häufung der Zeitangaben ist quellentreu, wirkt mit „Stunde für Stunde und Tag für Tag, bei Nacht und bei Tag“ jedoch etwas schwerfällig. Eine leichte Umstellung erhält die rhetorische Wiederholung und liest sich natürlicher.
  terminology: „der Höchste“ ist ein angemessenes, bibelsprachlich etabliertes Gottesprädikat. Die Konstruktion „den Höchsten anflehen“ entspricht zugleich dem lateinischen Akkusativ und modernem Standarddeutsch.
