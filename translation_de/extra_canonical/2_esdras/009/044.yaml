  text: For every hour and every day throughout those thirty years I kept praying to the Most High night and day.
translation:
  language: de
  text: Denn während dieser dreißig Jahre flehte ich den Höchsten jede Stunde und jeden Tag bei Nacht und bei Tag an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deprecabar
  choice: flehte ich … zum
  rationale: Das Imperfekt bezeichnet ein fortdauerndes beziehungsweise wiederholtes inständiges Bitten; „flehen“ gibt diese Intensität natürlich wieder.
- source_word: Altissimum
  choice: zum Höchsten
  rationale: Entspricht dem substantivierten lateinischen Gottesprädikat und bewahrt den würdevollen biblischen Sprachgebrauch.
- source_word: per singulas horas et per singulos dies
  choice: Stunde für Stunde und Tag für Tag
  rationale: Gibt die distributive Wiederholung des Lateinischen idiomatisch und nachdrücklich wieder.
- source_word: in annis triginta his
  choice: in all diesen dreißig Jahren
  rationale: Die bereinigte Lesart wird als Zeitspanne verstanden; „all“ verdeutlicht den durchgängigen Sinn, der durch die distributiven Wendungen gestützt wird.
- source_word: nocte ac die
  choice: bei Nacht und bei Tag
  rationale: Bewahrt beide ausdrücklich genannten Zeiträume und die feierliche Parallelstruktur.
