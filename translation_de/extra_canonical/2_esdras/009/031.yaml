  to: 'Denn siehe: Ich säe mein Gesetz in euch, und es wird in euch Frucht bringen, und darin werdet ihr für immer verherrlicht werden.'
  rationale: Die Änderung beschränkt sich auf die sachlich nötige Korrektur der Wiedergabe von in eo sowie eine leicht idiomatischere Einleitung. „Darin“ erhält die lokative Formulierung und vermeidet eine dogmatisch oder grammatisch nicht gedeckte Festlegung des Bezugs. Der durch die englische Audit-Fassung ausgewiesene Versumfang wird beibehalten.
