source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: de
  text: 'Denn siehe: Ich säe mein Gesetz in euch, und es wird in euch Frucht bringen, und darin werdet ihr für immer verherrlicht werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce enim
  choice: Denn seht
  rationale: Gibt sowohl die begründende Funktion von „enim“ als auch den aufmerksamkeitslenkenden Ausruf „ecce“ natürlich wieder.
- source_word: semino in uobis legem meam
  choice: Ich säe mein Gesetz in euch
  rationale: Bewahrt das auffällige Saatbild und die Wendung „in euch“, statt sie erklärend abzuschwächen.
- source_word: faciet in uobis fructum
  choice: es wird in euch Frucht bringen
  rationale: Eine natürliche deutsche Wiedergabe des lateinischen Bildes, bei der Gesetz und Fruchtmotiv erhalten bleiben.
- source_word: glorificabimini
  choice: werdet ihr verherrlicht werden
  rationale: Bewahrt das Passiv und die theologische Offenheit hinsichtlich dessen, wer die Verherrlichung bewirkt.
- source_word: in eo
  choice: durch dieses Gesetz
  rationale: Das maskuline Pronomen bezieht sich am naheliegendsten auf „legem“; die explizite Wiederaufnahme vermeidet im Deutschen einen unklaren Pronomenbezug.
- source_word: per saeculum
  choice: für immer
  rationale: Gibt die zeitliche Bedeutung idiomatisch und würdig wieder.
theological_decisions:
- issue: Mittel oder Bereich der Verherrlichung in „in eo“
  choice: durch dieses Gesetz
  alternative: in ihm / darin
  rationale: Der unmittelbare grammatische Bezug ist das Gesetz. „Durch“ bringt die instrumentale Lesart zum Ausdruck, ohne den Urheber der Verherrlichung festzulegen.
- issue: Ungenannter Urheber des Passivs „glorificabimini“
  choice: Passiv beibehalten
  alternative: Gott wird euch verherrlichen
  rationale: Der lateinische Text nennt den Handelnden nicht; eine ausdrückliche Ergänzung Gottes würde die genuine Offenheit auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das Saat- und Fruchtbild sowie das theologisch offene Passiv bleiben erhalten. Der eingereichte Vers folgt dem durch die englische Konsultationsfassung markierten Versumfang; das vorangehende „Iacob intendite sermonibus meis“ und das folgende „Nam patres nostri …“ gehören offenbar zum angrenzenden Kontext.
