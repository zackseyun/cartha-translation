  terminology: „der Höchste“ ist passend. „besuchen“ ist für uisitare die formnähere Hauptwiedergabe; die Fußnote erläutert die im Kontext mögliche Bedeutung von Heimsuchung bzw. Eingreifen, ohne sie als alleinigen Sinn festzuschreiben.
