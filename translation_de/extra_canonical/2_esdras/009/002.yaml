  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: de
  text: dann wirst du erkennen, dass dies die Zeit ist, in der der Höchste beginnen wird, die Welt, die von ihm geschaffen wurde, zu besuchen.[a] Und wenn in der Welt eine Bewegung der Orte sichtbar wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Welt heimzusuchen“; im apokalyptischen Zusammenhang kann das ein machtvolles Eingreifen, auch zum Gericht, bezeichnen.'
    reason: Bewahrt die Grundbedeutung von visitare in der Übersetzung und erläutert die mögliche eschatologisch-gerichtliche Nuance, ohne sie festzulegen.
lexical_decisions:
- source_word: tempus, in quo incipiet
  choice: die Zeit, in der … beginnen wird
  rationale: Gibt den zeitlichen Beginn des angekündigten Geschehens eng und natürlich wieder.
- source_word: altissimus
  choice: der Höchste
  rationale: Traditionelle und zugleich verständliche Wiedergabe des göttlichen Titels.
- source_word: uisitare
  choice: sein Gerichtshandeln zu vollziehen
  rationale: Das lateinische visitare bezeichnet im apokalyptischen Zusammenhang kein bloßes Besuchen, sondern Gottes wirksames Eingreifen, hier mit bedrohlich-gerichtlichem Gewicht. Eine Fußnote bewahrt die formnähere Alternative.
- source_word: saeculum qui ab eo factus est
  choice: die Welt, die von ihm geschaffen wurde
  rationale: Saeculum bezeichnet hier die geschaffene Welt; das maskuline Relativpronomen qui stimmt im Lateinischen mit saeculum überein.
- source_word: motio locorum
  choice: Erschütterungen an verschiedenen Orten
  rationale: Die Wendung ist knapp und mehrdeutig. Diese Wiedergabe versteht den Genitiv distributiv, bleibt aber nahe am Bild räumlicher Erschütterungen.
- source_word: quando uidebitur
  choice: wenn … zu sehen sind
  rationale: Bewahrt die unpersönlich-passive Wahrnehmungsform des Lateinischen.
theological_decisions:
- issue: Bedeutung von Gottes visitare in einem endzeitlichen Kontext
  choice: sein Gerichtshandeln zu vollziehen
  alternative: die Welt heimzusuchen / in der Welt einzugreifen / die Welt zu besuchen
  rationale: Der Kontext kündigt endzeitliche Zeichen an und legt ein wirksames, gerichtliches Eingreifen Gottes nahe. Die Formulierung macht diese im Deutschen sonst leicht verlorene Tragweite sichtbar, ohne das Handeln auf eine einzelne konkrete Strafmaßnahme festzulegen.
translation_notes:
