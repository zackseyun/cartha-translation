  text: then you will understand that it was of these things that the Most High spoke from the days that were before, from the beginning.
translation:
  language: de
  text: Dann wirst du erkennen, dass der Höchste von diesen Dingen seit den Tagen gesprochen hat, die vor dem Anfang waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus (im überlieferten Ausschnitt nur als Wortende „-simus“ erhalten)
  choice: der Höchste
  rationale: Die Ergänzung wird durch den Textzusammenhang und die konsultierte englische Fassung gestützt; „der Höchste“ ist die übliche, klare Wiedergabe des lateinischen Gottesprädikats.
- source_word: locutus
  choice: gesprochen hat
  rationale: Gibt das lateinische Perfekt sachlich und in natürlichem modernem Deutsch wieder.
- source_word: a diebus qui fuerunt ante
  choice: seit den Tagen, die zuvor waren
  rationale: Bewahrt die ungewöhnliche zeitliche Formulierung und ihre Rückwendung auf frühere Zeiten, ohne sie interpretierend zu glätten.
- source_word: ab initio
  choice: von Anfang an
  rationale: Entspricht unmittelbar der lateinischen Wendung und erhält ihren nachdrücklichen Charakter.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „Der Höchste“ gibt den lateinischen Superlativ präzise und würdig wieder, ohne eine zusätzliche konfessionelle Färbung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der zeitlichen Bestimmungen „seit den Tagen … von Anfang an“ bleibt erhalten, da sie bereits im lateinischen Ausgangstext angelegt ist.
