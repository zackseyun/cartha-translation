  text: She said to me, “I, your female servant, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: de
  text: 'Sie sagte zu mir: »Ich, deine Magd, war unfruchtbar und gebar kein Kind, obwohl ich dreißig Jahre lang einen Mann hatte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula tua
  choice: deine Magd
  rationale: „Magd“ gibt die weibliche und sozial untergeordnete Stellung von famula knapp und würdig wieder. „Sklavin“ wäre möglich, legt hier aber einen rechtlichen Status stärker fest, als der Kontext verlangt.
- source_word: sterilis
  choice: unfruchtbar
  rationale: Die natürliche deutsche Entsprechung im Zusammenhang mit ausbleibender Geburt.
- source_word: non peperi
  choice: gebar kein Kind
  rationale: Macht den im Lateinischen impliziten Gegenstand idiomatisch deutlich, ohne den Sinn zu erweitern.
- source_word: habens maritum annis triginta
  choice: obwohl ich dreißig Jahre lang einen Mann hatte
  rationale: Bewahrt die zeitliche Dauer und gibt maritum in natürlichem Deutsch wieder; „obwohl“ bringt den sachlichen Gegensatz zum Nichtgebären zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Selbstbezeichnung „deine Magd“ bewahrt das Abhängigkeitsverhältnis, ohne den möglichen sozialen Status unnötig zu verengen.
