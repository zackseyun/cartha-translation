  text: '“I have spoken before[a], and now I say, and I will say afterward: many more perish than will be saved,'
translation:
  language: de
  text: '„Schon früher habe ich gesprochen, und jetzt sage ich, und später werde ich sagen: Es gehen mehr Menschen zugrunde, als gerettet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: olim locutus sum
  choice: Schon früher habe ich gesprochen
  rationale: Gibt den Rückblick von „olim“ und den Sprechakt von „locutus sum“ natürlich wieder, ohne ihn mit dem folgenden „dico“ gleichzusetzen.
- source_word: nunc dico et postea dicam
  choice: jetzt sage ich, und später werde ich sagen
  rationale: Bewahrt den Wechsel von „loqui“ zu „dicere“ durch „sprechen“ gegenüber „sagen“ und bildet Gegenwart sowie Zukunft genau ab.
- source_word: plures sunt qui pereunt
  choice: Es gehen mehr Menschen zugrunde
  rationale: „Menschen“ macht den substantivisch gebrauchten Relativsatz im Deutschen verständlich; „zugrunde gehen“ wahrt die Aussage von „pereunt“, ohne sie näher zu bestimmen.
- source_word: qui salvabuntur
  choice: als gerettet werden
  rationale: Das Passiv erhält die Offenheit des lateinischen Passivs hinsichtlich des Handelnden.
theological_decisions:
- issue: Bedeutung von „pereunt“ und „salvabuntur“
  choice: zugrunde gehen / gerettet werden
  alternative: verloren gehen / selig werden
  rationale: Die gewählte Fassung bleibt nahe am Latein, bewahrt den Gegensatz und vermeidet eine konfessionell oder systematisch verengende Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unterschiedliche Wortwahl des Lateinischen („locutus sum“ gegenüber „dico/dicam“) wird mit „gesprochen“ und „sage/sagen“ sichtbar gehalten. Der eröffnete direkte Redegang bleibt entsprechend dem Versfragment ohne schließendes Anführungszeichen.
