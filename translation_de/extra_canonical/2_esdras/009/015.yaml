  verdict: approve
  source_fidelity: Die Übersetzung gibt die Abfolge von olim locutus sum, nunc dico und postea dicam treffend wieder und bewahrt sinnvoll die lexikalische Unterscheidung zwischen „sprechen“ und „sagen“. „Es gehen mehr Menschen zugrunde, als gerettet werden“ entspricht plures sunt qui pereunt quam qui salvabuntur; das Passiv lässt den im Latein nicht genannten Handelnden offen. Die deutsche Gegenwartsform in „gerettet werden“ ist in diesem allgemeinen, eschatologisch ausgerichteten Vergleich idiomatisch und erzwingt keine Abweichung vom futurischen salvabuntur.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die Satzführung mit Doppelpunkt ist klar; „Menschen“ macht den Relativsatz im Deutschen natürlich verständlich, ohne den Sinn einzuengen. Das offene Anführungszeichen ist angesichts des fortlaufenden Redegangs im Versfragment sachgerecht.
  terminology: „zugrunde gehen“ und „gerettet werden“ bilden den Gegensatz pereunt/salvabuntur neutral und theologisch nicht vorentscheidend ab. Die gewählte Terminologie vermeidet stärker auslegende Alternativen wie „verloren gehen“ oder „selig werden“.
