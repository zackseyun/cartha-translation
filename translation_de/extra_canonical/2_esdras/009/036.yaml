  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: de
  text: Wir freilich[a], die wir das Gesetz empfangen haben, werden als Sünder zugrunde gehen, ebenso unser Herz, das es aufgenommen hat[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Text in diesem Abschnitt ist stellenweise holprig überliefert. Der Hauptgedanke ist: Die Menschen, die das Gesetz empfangen haben, gehen zugrunde; das Gesetz selbst geht dagegen nicht zugrunde, sondern bleibt in Ehren.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Wir freilich, die wir das Gesetz empfangen haben, werden zugrunde gehen, weil wir gesündigt haben, ebenso unser Herz, das es aufgenommen hat.“ Das lateinische Partizip kann auch „indem wir sündigen“ bedeuten.'
    reason: translation_alternative
lexical_decisions:
- source_word: nos quidem
  choice: wir freilich
  rationale: Gibt die hervorhebende, im Zusammenhang möglicherweise gegensätzliche Partikel quidem wieder, ohne sie fälschlich als kausales „denn“ zu verstehen.
- source_word: legem accepimus
  choice: das Gesetz empfangen haben
  rationale: Formale und im biblischen Register natürliche Wiedergabe von accipere; gemeint ist der Empfang des Gesetzes.
- source_word: peccantes peribimus
  choice: werden zugrunde gehen, weil wir gesündigt haben
  rationale: Gibt das sündige Handeln als Grund des Untergangs verständlich wieder. Das lateinische Präsenspartizip peccantes lässt zugleich eine Wiedergabe wie „als Sünder“ oder „indem wir sündigen“ zu.
- source_word: cor nostrum quod suscepit eam
  choice: unser Herz, das es aufgenommen hat
  rationale: Bewahrt das ausdrückliche Possessivpronomen nostrum und den Rückbezug des femininen eam auf lex („Gesetz“). „Aufgenommen“ unterscheidet suscipere leicht vom vorherigen accipere.
theological_decisions:
- issue: Verhältnis von Gesetz, Sünde und Untergang
  choice: Der Untergang wird dem sündigen Volk und seinem Herzen zugeschrieben, nicht dem Gesetz.
  alternative: Der Satz könnte so geglättet werden, dass auch das Gesetz als vergänglich erscheint.
  rationale: Subjekt von peribimus ist „wir“; der Folgesatz nennt zusätzlich „unser Herz“. Der weitere Zusammenhang kontrastiert dies mit dem Fortbestand beziehungsweise der Ehre des Gesetzes.
- issue: Zeit- und Kausalwert von peccantes
  choice: „weil wir gesündigt haben“
  alternative: „als Sünder“, „indem wir sündigen“ oder „weil wir sündigen“
  rationale: Das lateinische Präsenspartizip bezeichnet die Sündigenden und kann modal oder kausal verstanden werden. Die Hauptfassung folgt der im geprüften englischen Konsultationstext vertretenen kausalen Deutung; die Fußnote hält die grammatische Offenheit fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Freilich“ erhält die Hervorhebung von quidem, „zugrunde gehen“ den ernsten eschatologischen Ton. Die Satzgestalt bleibt wegen des anschließenden Kontexts mit Semikolon offen; beide Fußnotenmarker stehen an passenden Ankerstellen im Haupttext.
