  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: de
  text: Denn wie alles, was im Zeitalter entstanden ist, einen Anfang durch eine Vollendung hat[a] und die Vollendung offenbar ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Anfang durch eine Vollendung“. Die lateinische Formulierung ist ungewöhnlich und möglicherweise textlich gestört. Als textkritische Rekonstruktion wurde auch ein Sinn wie „einen erkennbaren Anfang hat“ beziehungsweise „der Anfang ist erkennbar“ vorgeschlagen.'
    reason: Bewahrt die schwierige überlieferte Formulierung im Haupttext und kennzeichnet die glattere Wiedergabe ausdrücklich als Rekonstruktion, nicht als unmarkierte Übersetzung.
lexical_decisions:
- source_word: saeculo
  choice: Zeitalter
  rationale: Bewahrt den zeitlich-eschatologischen Sinn von „saeculum“, ohne ihn vorschnell auf „Welt“ zu verengen.
- source_word: consummatio
  choice: Vollendung
  rationale: Gibt sowohl den Abschluss als auch das Erreichen des Endzustands wieder und erhält die Wiederholung des lateinischen Begriffs.
- source_word: manifesta
  choice: offenbar
  rationale: Entspricht dem lateinischen Ausdruck eng und passt zum würdevollen, gegenwärtigen Register.
theological_decisions:
- issue: Verhältnis von Anfang und Vollendung in der überlieferten Formulierung
  choice: „einen Anfang durch die Vollendung hat“
  alternative: „einen erkennbaren Anfang und eine offenbar werdende Vollendung hat“
  rationale: Die ungewöhnliche und möglicherweise gestörte Lesart „initium per consummationem“ wird nicht stillschweigend geglättet; die textliche Schwierigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt wegen des anschließenden Gedankengangs offen; die genuine Schwierigkeit des lateinischen Textes wird nicht im Haupttext aufgelöst.
