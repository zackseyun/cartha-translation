source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erat perditum, et orbem meum, et ecce erat periclitans propter cogitationes quae in eo aduenerunt. Et uidi et peperci eis uix
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/020.yaml
  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: de
  text: 'Und ich betrachtete meine Welt: Siehe, sie war verloren; und meinen Erdkreis: Siehe, er war in Gefahr wegen der Gedanken, die in ihn gekommen waren. Und ich sah und verschonte sie kaum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Wortlaut beginnt hier mitten im Satz; die einleitenden Worte „Und ich betrachtete meine Welt: Siehe, sie“ sind aus dem Zusammenhang ergänzt. Das abschließende „kaum“ kann auch „nur mit Mühe“ bedeuten.'
    reason: Kennzeichnet sowohl den unvollständigen Beginn des bereitgestellten lateinischen Textes als auch die echte Bedeutungsbreite von vix.
lexical_decisions:
- source_word: orbem meum
  choice: meinen Erdkreis
  rationale: Gibt orbis als die bewohnte Welt beziehungsweise den Weltkreis wieder und unterscheidet den Ausdruck von dem zuvor vorausgesetzten saeculum meum („meine Welt“).
- source_word: periclitans
  choice: war in Gefahr
  rationale: Entspricht dem durativen Sinn des Partizips und klingt im modernen Deutschen natürlich.
- source_word: cogitationes
  choice: Gedanken
  rationale: Bewahrt den Grundsinn von cogitationes und legt nicht einseitig die stärker negative Deutung „Machenschaften“ fest.
- source_word: peperci eis uix
  choice: verschonte sie kaum
  rationale: Gibt parcere mit Dativ und das mehrdeutige vix knapp wieder, ohne es ausschließlich als „mit Mühe“ auszulegen.
theological_decisions:
- issue: Bezug des Pronomens eis („ihnen/sie“)
  choice: verschonte sie
  alternative: verschonte sie nur mit Mühe / verschonte ihre Bewohner kaum
  rationale: Das nicht ausdrücklich benannte Bezugswort wird nicht ergänzt; so bleibt die im lateinischen Text vorhandene Unbestimmtheit erhalten.
- issue: Deutung von cogitationes
  choice: Gedanken
  alternative: Pläne / Machenschaften
  rationale: Die neutrale Grundbedeutung wahrt die Spannung, ob menschliche Gedanken allgemein oder ausdrücklich böse Anschläge gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Schauformel „Siehe“ und die Parallelstruktur des lateinischen Textes bleiben erhalten; unklare Bezüge und die Mehrdeutigkeit von vix werden nicht stillschweigend aufgelöst.
