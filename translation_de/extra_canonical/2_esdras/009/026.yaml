revisions:
- from: So ging ich, wie er mir gesagt hatte, auf das Feld namens Ardat und setzte mich dort zwischen die Blumen. Ich aß von den Pflanzen des Feldes, und die Nahrung, die sie mir boten, sättigte mich.[a]
  to: So ging ich, wie er mir gesagt hatte, auf das Feld namens Ardat und setzte mich dort zwischen die Blumen. Ich aß von den Kräutern des Feldes, und die Nahrung daraus sättigte mich.[a]
  rationale: Die Revision beseitigt die leichte Personifizierung in „die sie mir boten“ und gibt herbis enger als „Kräuter“ wieder. Der Sinn und die zurückhaltende, moderne Erzählweise bleiben erhalten; die Fußnote kennzeichnet weiterhin die ungewöhnliche lateinische Konstruktion, ohne ein im Wortlaut nicht ausgedrücktes Dativobjekt hinzuzufügen.
