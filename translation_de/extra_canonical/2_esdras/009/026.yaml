    issue: Personifizierende Umschreibung von esca earum
    rationale: „die Nahrung, die sie mir boten“ lässt die Pflanzen aktiv Nahrung anbieten. Das lateinische esca earum bezeichnet schlicht Nahrung von/aus ihnen.
  - severity: low
    issue: „Pflanzen“ ist für herbis weniger unmittelbar
    rationale: Im Kontext des Essens bezeichnet herbae am natürlichsten Kräuter bzw. essbare Feldgewächse; „Kräuter“ wahrt die lexikalische Nähe ohne unnatürlich zu wirken.
  - severity: low
    issue: Die Fußnote ergänzt ein Dativobjekt
    rationale: Die formnahe Wiedergabe „wurde mir zur Sättigung“ ist als Deutung möglich, doch das Latein hat in saturitatem ohne ausdrücklich gesetztes „mir“.
