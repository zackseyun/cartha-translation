source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ardat, et sedi ibi in floribus et de herbis agri manducaui et facta est esca earum in saturitatem. Et factum est post dies
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: de
  text: So ging ich, wie er mir gesagt hatte, auf das Feld namens Ardat und setzte mich dort zwischen die Blumen. Ich aß von den Kräutern des Feldes, und die Nahrung daraus sättigte mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und ihre Nahrung wurde zur Sättigung.«'
    reason: Die lateinische Wendung facta est esca earum in saturitatem ist ungewöhnlich und kann formnäher als Zustands- bzw. Ergebnisaussage wiedergegeben werden.
lexical_decisions:
- source_word: Ardat
  choice: Ardat
  rationale: Der Ortsname wird unverändert übernommen; entsprechend dem unmittelbaren Zusammenhang und der Textüberlieferung bezeichnet er das Feld.
- source_word: herbis agri
  choice: Pflanzen des Feldes
  rationale: „Pflanzen“ gibt herbae im Zusammenhang mit essbarer Feldvegetation natürlicher und weiter wieder als das im Deutschen enger oder kulinarisch klingende „Kräuter“.
- source_word: esca earum
  choice: die Nahrung, die sie mir boten
  rationale: Die Formulierung macht deutlich, dass die Nahrung von den Pflanzen stammt, ohne das im Deutschen missverständliche „ihre Nahrung“ zu verwenden.
- source_word: in saturitatem
  choice: sättigte mich
  rationale: Die knappe verbale Wiedergabe vermittelt idiomatisch, dass die Nahrung zur Sättigung ausreichte.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzführung ist bewusst schlicht. Der im konsultierten englischen Text bezeugte Zusammenhang zu dem Feld namens Ardat wird aufgenommen; die am Ende des lateinischen Ausschnitts beginnende Wendung »Et factum est post dies« gehört syntaktisch zum folgenden Vers und wird hier nicht vorweggenommen.
