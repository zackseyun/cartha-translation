lexical_decisions:
- source_word: sed non ieiunabis in eis
  choice: Doch während dieser Tage sollst du nicht fasten
  rationale: Das lateinische Pronomen „eis“ greift die zuvor genannten Tage auf. „Während dieser Tage“ macht den Bezug im Deutschen natürlich verständlich, ohne hier eine im erhaltenen Verssegment nicht ausdrücklich genannte Zahl einzufügen.
- source_word: Ibis autem
  choice: sondern … gehen
  rationale: Nach der Verneinung gibt „sondern“ den Gegensatz idiomatisch wieder; das Futur „ibis“ wird als Anweisung mit „sollst … gehen“ ausgedrückt.
- source_word: in campum florum
  choice: auf ein Blumenfeld
  rationale: „Campus florum“ bezeichnet wörtlich ein Feld von Blumen; „Blumenfeld“ ist knapp, anschaulich und natürlich.
- source_word: ubi
  choice: wo
  rationale: Der unabgeschlossene Relativanschluss des lateinischen Ausschnitts bleibt erhalten.
