  text: and all who despised my law while they still had freedom,
translation:
  language: de
  text: und alle, die mein Gesetz verachteten, als sie noch die Freiheit dazu hatten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fastidierunt
  choice: verachteten
  rationale: Das lateinische Verb bezeichnet ablehnende Geringschätzung oder Verschmähung; „verachteten“ gibt dies im Kontext einer bewussten Zurückweisung des Gesetzes natürlich und prägnant wieder.
- source_word: legem meam
  choice: mein Gesetz
  rationale: Direkte und sachlich genaue Wiedergabe des lateinischen Ausdrucks.
- source_word: habentes libertatem
  choice: die Freiheit dazu hatten
  rationale: Bewahrt den Gedanken eines noch bestehenden freien Handlungsspielraums. „dazu“ stellt im Deutschen den natürlichen Bezug zur vorher genannten Haltung gegenüber dem Gesetz her, ohne die Art dieser Freiheit weiter festzulegen.
theological_decisions:
- issue: Bedeutung der Freiheit
  choice: die Freiheit dazu hatten
  alternative: frei entscheiden konnten
  rationale: Der lateinische Text nennt allgemein „libertas“ und erläutert weder Willensfreiheit noch politische oder rechtliche Freiheit. Die gewählte Formulierung bewahrt diese Offenheit und vermeidet eine dogmatische Festlegung.
translation_notes:
  register: Moderne, klare und würdige Standardsprache; als fortlaufender Teilsatz bleibt die abschließende Interpunktion ein Komma.
