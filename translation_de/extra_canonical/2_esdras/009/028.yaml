  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: de
  text: Es war wie zuvor aufgewühlt. Dann öffnete sich mein Mund, und ich begann …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turbabatur
  choice: Ich war aufgewühlt
  rationale: Der überlieferte lateinische Text hat die 3. Person Singular („er/sie/es wurde aufgewühlt“), doch der unmittelbare Ich-Kontext und das folgende „mein Mund“ sprechen für einen textlich oder redaktionell bedingten Personenwechsel; die deutsche Fassung gibt den naheliegenden Sinn wieder, ohne den Zustand unnötig zu präzisieren.
- source_word: sicut et ante
  choice: wie zuvor
  rationale: Natürliche und genaue Wiedergabe des zeitlichen Vergleichs.
- source_word: apertum est os meum
  choice: Da öffnete sich mein Mund
  rationale: Bewahrt das lateinische Passiv beziehungsweise intransitive Geschehen und vermeidet, ein handelndes Subjekt hinzuzufügen.
- source_word: inchoaui
  choice: ich begann
  rationale: Entspricht dem lateinischen Verb; da der vorgelegte Quelltext hier abbricht, wird kein nicht belegtes Ergänzungskomplement aus der englischen Konsultationsfassung übernommen.
theological_decisions:
- issue: In der englischen Konsultationsfassung stehen „vor dem Höchsten“ und „und ich sagte“, die im angegebenen lateinischen Quelltext fehlen.
  choice: Diese Zusätze werden nicht in den Haupttext aufgenommen; der fragmentarische Abschluss wird durch Auslassungspunkte kenntlich gemacht.
  alternative: „… und ich begann vor dem Höchsten zu sprechen und sagte:“
  rationale: Die Übersetzung folgt vorrangig dem bereitgestellten originalsprachlichen Quellenbeleg und ergänzt keine dort unbezeugten Gottesbezeichnungen oder Redeeinleitungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang wird als Teil des Verses beibehalten, obwohl er offenbar an den vorangehenden Kontext anschließt. Die Auslassungspunkte markieren den Abbruch des bereitgestellten lateinischen Wortlauts.
