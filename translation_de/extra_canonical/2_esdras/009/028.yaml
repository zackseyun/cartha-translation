  naturalness: „Es war wie zuvor aufgewühlt“ ist als kontextanschließende Rückverweisung im Deutschen möglich und bewahrt die im Auszug fehlende Subjektsnennung. „Dann öffnete sich mein Mund“ ist modernes, würdiges Standarddeutsch.
  terminology: Keine theologischen oder namensbezogenen Begriffe sind im vorgelegten lateinischen Text enthalten. „der Höchste“ und eine anschließende Redeeinleitung aus dem englischen Audit-Trail dürfen nicht ergänzt werden, da sie im bereitgestellten Quellenwortlaut nicht enthalten sind.
