  text: and you said[a], saying, ‘Hear me, O Israel, and give ear to my words, O seed of Jacob.’
translation:
  language: de
  text: 'Und du sagtest mit den Worten[a]: »Du, Israel, hör mir zu, und du, Nachkommenschaft Jakobs, achte auf meine Worte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und indem du sprachst, sagtest du«; die doppelte Redeformel kann auch schlicht mit »Und du sagtest« wiedergegeben werden.'
    reason: Das lateinische „dicens dixisti“ ist eine pleonastische Redeformel, die sich im Deutschen nicht zugleich wörtlich und idiomatisch abbilden lässt.
lexical_decisions:
- source_word: dicens dixisti
  choice: du sprachst mit den Worten
  rationale: Die doppelte Redeformel wird in natürlichem Deutsch erkennbar wiedergegeben, ohne sie zu zwei getrennten Äußerungen umzudeuten.
- source_word: Tu Israel audi me
  choice: Du, Israel, höre auf mich
  rationale: Bewahrt die im Lateinischen vorangestellte Anrede „Tu Israel“ und gibt den Imperativ unmittelbar wieder.
- source_word: semen
  choice: Nachkommenschaft
  rationale: Gibt lateinisch „semen“ im kollektiven Sinn verständlich und würdig wieder; gemeint ist die Nachkommenschaft Jakobs.
theological_decisions:
- issue: Beziehung zwischen Israel und der Nachkommenschaft Jakobs
  choice: Beide Anreden bleiben parallel stehen.
  alternative: Beide Ausdrücke zu einer einzigen Anrede zusammenziehen.
  rationale: Die Parallelität des Quelltextes soll erhalten bleiben und nicht theologisch harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Verdoppelung der Redeformel wird im Haupttext natürlich wiedergegeben und in der Fußnote transparent gemacht; die Reihenfolge der Anreden folgt dem lateinischen Zeugnis.
