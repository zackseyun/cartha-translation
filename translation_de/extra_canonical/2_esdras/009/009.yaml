source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc mirabuntur qui nunc abusi sunt vias meas, et in cruciamentis commorabuntur hii qui eos proiecerunt in contemptu.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: de
  text: Dann werden die, die jetzt meine Wege missbraucht haben, staunen; und die, die sie verächtlich verworfen haben, werden in Qualen bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Lateinischen steht hier eos („sie“, maskulin), obwohl bei einem Bezug auf vias („Wege“, feminin) eas zu erwarten wäre. Dem Zusammenhang nach sind wahrscheinlich dennoch Gottes Wege gemeint.
    reason: Die Fußnote dokumentiert die grammatisch auffällige überlieferte Pronomenform und wahrt zugleich die Unsicherheit ihres Bezugs.
lexical_decisions:
- source_word: mirabuntur
  choice: werden … bestürzt sein
  rationale: Das lateinische Verb bezeichnet Verwunderung oder Erschrecken. Im Gerichtskontext gibt „bestürzt sein“ die negative Färbung natürlich wieder, ohne eine darüber hinausgehende Reaktion festzulegen.
- source_word: abusi sunt vias meas
  choice: meine Wege missbraucht haben
  rationale: „Missbrauchen“ entspricht dem lateinischen abuti und bewahrt das Bild von Gottes Wegen, statt es allgemein als Ungehorsam aufzulösen.
- source_word: proiecerunt in contemptu
  choice: verächtlich verworfen haben
  rationale: Die Formulierung gibt sowohl das Wegwerfen beziehungsweise Verwerfen als auch die Haltung der Verachtung in idiomatischem Deutsch wieder.
- source_word: in cruciamentis commorabuntur
  choice: werden in Qualen bleiben
  rationale: „In Qualen“ entspricht cruciamentis, während „bleiben“ die andauernde Bedeutung von commorabuntur bewahrt.
theological_decisions:
- issue: Bezug des Pronomens eos
  choice: „sie“ bezieht sich im Haupttext auf „meine Wege“
  alternative: Das Pronomen könnte aufgrund der abweichenden grammatischen Form auf eine andere, im überlieferten Text nicht klar erkennbare Bezugsgröße weisen.
  rationale: Der unmittelbare Sinnzusammenhang und die parallelen Aussagen sprechen dafür, dass erneut Gottes Wege gemeint sind; die formale Unstimmigkeit der lateinischen Überlieferung wird jedoch in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt den Parallelismus der lateinischen Vorlage; „bestürzt“, „verächtlich verworfen“ und „in Qualen bleiben“ sind klar und gegenwärtig, ohne die Gerichtsaussage abzuschwächen oder konfessionell auszudeuten.
