  source_fidelity: 'Die Bildpaare sind quellennah wiedergegeben: ager/semina, flores/tincturae, opera/creatio und agricola/area entsprechen dem lateinischen Parallelismus. Auch der offene Satzschluss mit Komma bildet den Anschluss an den folgenden Vers angemessen ab. „Es gab eine Zeit des Zeitalters“ ist jedoch keine gute Wiedergabe von tempus erat saeculi: Das lateinische erat ist hier kopulativ („es war die Zeit ...“), nicht existenziell im Sinn von „es gab“.'
