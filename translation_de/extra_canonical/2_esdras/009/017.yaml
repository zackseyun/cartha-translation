  terminology: „Acker“, „Samen“, „Blüten“, „Farben“, „Werk“, „Schöpfung“, „Bauer“ und „Dreschplatz“ sind passende moderne Wiedergaben. „Zeitalter“ wahrt die Offenheit von saeculum. Es sind keine Fußnoten erforderlich; insbesondere darf kein nicht im lateinischen Text vorhandenes „so“ ergänzt werden.
