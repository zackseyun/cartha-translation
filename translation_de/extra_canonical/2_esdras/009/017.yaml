source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: de
  text: „Wie der Acker beschaffen ist, so sind auch die Samen; und wie die Blüten beschaffen sind, so sind auch die Farben; und wie das Werk beschaffen ist, so ist auch die Schöpfung; und wie der Bauer beschaffen ist, so ist auch der Dreschplatz. Denn es war die Zeit des Zeitalters,“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ager
  choice: Acker
  rationale: Bezeichnet hier bebautes Land und passt zur anschließenden landwirtschaftlichen Bildfolge.
- source_word: semina
  choice: Samen
  rationale: Gibt den lateinischen Plural konkret wieder; „Saat“ wäre idiomatischer, würde aber den Numerus und das Gegenüber von Acker und einzelnen Samen weniger deutlich bewahren.
- source_word: flores
  choice: Blüten
  rationale: Im Zusammenhang mit den zugehörigen Farben ist „Blüten“ präziser als das weiter gefasste „Blumen“.
- source_word: tincturae
  choice: Farben
  rationale: Das Wort kann Färbungen oder Farbtöne bezeichnen; „Farben“ ist hier natürlich und wahrt den sichtbaren Bezug zu den Blüten.
- source_word: opera
  choice: Werk
  rationale: Bewahrt die formale Gegenüberstellung von hervorgebrachtem Werk und Schöpfung, ohne sie erklärend aufzulösen.
- source_word: creatio
  choice: Schöpfung
  rationale: Entspricht dem lateinischen Begriff unmittelbar und lässt sowohl Vorgang als auch Geschaffenes anklingen.
- source_word: agricola
  choice: Bauer
  rationale: Moderne, allgemein verständliche Bezeichnung für den Landwirt innerhalb des Bildvergleichs.
- source_word: area
  choice: Dreschplatz
  rationale: Gibt die landwirtschaftliche Bedeutung des lateinischen Wortes in diesem Kontext präzise wieder.
- source_word: saeculi
  choice: des Zeitalters
  rationale: Bewahrt den Genitiv und die eschatologische Offenheit von saeculum; „Welt“ oder „Weltzeit“ würde die Bedeutung stärker festlegen.
theological_decisions:
- issue: Verhältnis zwischen Werk und Schöpfung
  choice: „wie das Werk beschaffen ist, so ist auch die Schöpfung“
  alternative: „wie die Arbeit ist, so ist auch das Geschaffene“
  rationale: Die gewählte Fassung hält die begriffliche und mögliche theologische Spannung zwischen opera und creatio offen, statt sie auf menschliche Arbeit und deren Ergebnis zu verengen.
- issue: Zeitangabe am Versende
  choice: „Denn es gab eine Zeit des Zeitalters“
  alternative: „Denn so war die Zeit des Zeitalters“
  rationale: Im lateinischen Text fehlt ein demonstratives Wort für „so“. Die Fassung bewahrt zudem den fragmentarischen Übergang in den folgenden Vers und fügt keine Deutung über die Beschaffenheit des Zeitalters hinzu.
translation_notes:
  register: Die wiederholte Formulierung „beschaffen ist“ macht die qualis–talis-Struktur im modernen Deutsch verständlich und erhält den feierlich-weisheitlichen Parallelismus. Der syntaktisch offene Schluss mit Komma folgt dem lateinischen Satzfortgang in den nächsten Vers. Die im englischen Konsultationstext stehende Einleitung „He answered me and said“ wurde nicht übernommen, da sie im angegebenen lateinischen Ausgangstext dieses Verses nicht vorhanden ist.
