  text: 'Et respondit ad me et dixit: metiens metire in temetipso, et erit cum uideris quoniam transiuit pars quaedam signorum quae praedicta sunt, Tunc intelleges quoniam ipsum est'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/001.yaml
  text: He answered me and said[a], “Measure carefully within yourself, and when you see that some part of the signs foretold has passed by,
translation:
  language: de
  text: 'Er antwortete mir und sagte: „Miss sorgfältig in dir selbst[a]. Wenn du siehst, dass ein Teil der vorhergesagten Zeichen vorübergegangen ist,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Miss in dir selbst.“'
    reason: Die Alternative gibt den einfachen Imperativ wieder, ohne die verstärkende Wirkung von „metiens metire“ ausdrücklich wiederzugeben.
lexical_decisions:
- source_word: metiens metire
  choice: Miss sorgfältig
  rationale: Die Verbindung aus Partizip und Imperativ verstärkt den Messauftrag. „Sorgfältig“ gibt diese emphatische, wahrscheinlich semitisch geprägte Konstruktion in natürlichem Deutsch wieder.
- source_word: in temetipso
  choice: in dir selbst
  rationale: Bewahrt die reflexive und innere Ausrichtung der lateinischen Formulierung, ohne sie deutend auf bloße Selbstprüfung festzulegen.
- source_word: transiuit
  choice: vorübergegangen ist
  rationale: Gibt den zeitlichen Verlauf der angekündigten Zeichen idiomatisch und nah am lateinischen Perfekt wieder.
- source_word: pars quaedam signorum
  choice: ein Teil der … Zeichen
  rationale: „Ein Teil“ wahrt die unbestimmte Mengenangabe, ohne sie als bestimmte Anzahl auszulegen.
theological_decisions:
- issue: Bedeutung des Messens „in dir selbst“
  choice: Die bildhafte Aussage bleibt wörtlich und offen.
  alternative: „Prüfe sorgfältig für dich selbst“ oder „Berechne genau“
  rationale: Der lateinische Text benennt weder ausdrücklich Selbstprüfung noch Berechnung; eine stärker deutende Wiedergabe würde die mögliche Mehrdeutigkeit einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgrenze nach „selbst“ erleichtert das Verständnis; das abschließende Komma bleibt stehen, weil der Gedanke im folgenden Vers weitergeführt wird. Das im bereitgestellten lateinischen Kontext anschließende „Tunc intelleges quoniam ipsum est“ gehört syntaktisch zur Fortsetzung und wurde entsprechend der Versabgrenzung von 2 Esdras 9,1 nicht in den Haupttext aufgenommen.
