  text: And after seven days I was lying on the grass, and my heart again as before
translation:
  language: de
  text: Und nach sieben Tagen lag ich auf dem Gras, und mein Herz war wieder …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorgelegte lateinische Wortlaut bricht hier unvollständig ab: wörtlich etwa „und mein Herz wieder“.'
    reason: Die Fußnote macht die Überlieferungs- beziehungsweise Textunvollständigkeit sichtbar, ohne den fehlenden Satzteil zu ergänzen.
lexical_decisions:
- source_word: septem
  choice: nach sieben Tagen
  rationale: Das isolierte „septem“ wird entsprechend dem zeitlichen Zusammenhang als verkürzte Angabe „nach sieben Tagen“ wiedergegeben; dies stimmt auch mit der geprüften englischen Konsultationsfassung überein.
- source_word: discumbebam supra fenum
  choice: lag ich auf dem Gras
  rationale: „discumbebam“ bezeichnet ein Liegen oder Lagern; „fenum“ kann Heu beziehungsweise Gras meinen. Im erzählerischen Zusammenhang ist „auf dem Gras“ natürlich und sachgerecht.
- source_word: cor meum iterum
  choice: mein Herz war wieder …
  rationale: Der lateinische Wortlaut bricht nach „mein Herz wieder“ ab und nennt keinen Zustand oder Vorgang. Das ergänzte „war“ ermöglicht einen natürlichen deutschen Satzansatz, während die Auslassungspunkte die echte Unvollständigkeit offenhalten.
theological_decisions:
- issue: Nicht überlieferte Aussage über den Zustand des Herzens
  choice: Die Aussage bleibt mit Auslassungspunkten unvollständig.
  alternative: „mein Herz war wieder wie zuvor beunruhigt“
  rationale: Weder „beunruhigt“ noch „wie zuvor“ steht im vorgelegten lateinischen Text. Eine solche Ergänzung würde die Überlieferungslücke inhaltlich festlegen.
translation_notes:
  register: Modernes, schlichtes und würdevolles Erzähldeutsch. Die ungewöhnliche Satzunvollständigkeit wird bewusst bewahrt und durch eine Fußnote erklärt.
