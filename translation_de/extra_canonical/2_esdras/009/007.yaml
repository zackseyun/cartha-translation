  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: de
  text: 'Und es wird geschehen: Jeder, der gerettet worden ist[a] und der durch seine Werke oder durch den Glauben, an den er geglaubt hat, entkommen kann,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und jeder, der gerettet worden ist,“'
    reason: Die Satzgliederung kann „Und es wird geschehen“ stärker als eigenständige Einleitung behandeln; die alternative Fassung folgt der überlieferten früheren Wiedergabe.
lexical_decisions:
- source_word: et erit
  choice: Und es wird geschehen
  rationale: Gibt die ausdrücklich vorhandene prophetisch-apokalyptische Einleitungsformel wieder.
- source_word: salvus factus fuerit
  choice: gerettet worden ist
  rationale: Bewahrt den passivischen Sinn und lässt den Urheber der Rettung wie im Lateinischen unausgesprochen.
- source_word: effugere
  choice: entkommen
  rationale: Entspricht dem konkreten Sinn des Entrinnens aus der bevorstehenden Gefahr bzw. dem Gericht.
- source_word: per opera sua
  choice: durch seine Werke
  rationale: Formale und theologisch unentschärfte Wiedergabe des lateinischen Ausdrucks.
- source_word: per fidem in qua credidit
  choice: durch den Glauben, den er angenommen hat
  rationale: Vermeidet die im Deutschen schwerfällige Wiederholung „Glauben, an den er geglaubt hat“, bewahrt aber den Rückbezug auf einen bereits bejahten Glauben.
theological_decisions:
- issue: Verhältnis von Werken und Glauben beim Entkommen
  choice: durch seine Werke oder durch den Glauben
  alternative: aufgrund seiner Werke oder seines Glaubens
  rationale: Das disjunktive „oder“ und die instrumentale bzw. vermittelnde Offenheit von per bleiben erhalten; die Spannung wird nicht konfessionell aufgelöst.
- issue: Zeitliches Verhältnis von Rettung und Entkommen
  choice: der gerettet worden ist … entkommen kann
  alternative: der gerettet wird … entkommen kann
  rationale: Die zusammengesetzte Form salvus factus fuerit wird möglichst nah wiedergegeben, ohne die genaue eschatologische Abfolge über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar prophetisch-apokalyptischem Ton. Der Vers bleibt entsprechend dem Quelltext syntaktisch offen, da er im folgenden Vers weitergeführt wird.
