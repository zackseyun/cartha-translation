review_pass:
  verdict: revise
  source_fidelity: 'Die prophetische Einleitungsformel „et erit“ ist mit „Und es wird geschehen“ sachgerecht wiedergegeben. „gerettet worden ist“, „durch seine Werke oder durch den Glauben“ und „entkommen kann“ geben die lateinische Syntax und die offene Zuordnung von Werken beziehungsweise Glauben angemessen wieder. „den er angenommen hat“ ist jedoch keine hinreichend genaue Entsprechung von „in qua credidit“: Es kann das bloße Übernehmen einer Glaubenslehre bezeichnen, während das Lateinische ausdrücklich den Glaubensvollzug formuliert.'
  naturalness: Der Satz ist als bewusst unvollständiger Übergang zum folgenden Vers im modernen, würdigen Deutsch gut lesbar. Die Formel „Glauben, an den er geglaubt hat“ ist zwar stilistisch markiert, bewahrt hier aber die absichtliche Wiederaufnahme von fides/credidit besser als die interpretierende Glättung des Entwurfs.
  terminology: „gerettet“, „Werke“, „Glauben“ und „entkommen“ sind etablierte und registergerechte Wiedergaben. Die Änderung zu „an den er geglaubt hat“ vermeidet eine theologisch enger gefasste Deutung von Glauben als Annahme einer Lehre.
  issues:
  - severity: medium
    issue: „den er angenommen hat“ für „in qua credidit“
    rationale: „Annehmen“ deutet einen Akt des Übernehmens oder Akzeptierens an. Das Lateinische wiederholt dagegen ausdrücklich „Glaube/Glauben“ und lässt den Glaubensbezug selbst im Vordergrund stehen. Die Übersetzung sollte diese Wiederaufnahme ohne zusätzliche dogmatische oder begriffliche Präzisierung erhalten.
  revised_text: 'Und es wird geschehen: Jeder, der gerettet worden ist[a] und der durch seine Werke oder durch den Glauben, an den er geglaubt hat, entkommen kann,'
