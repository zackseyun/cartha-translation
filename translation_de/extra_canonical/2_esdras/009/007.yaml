    text: 'Oder: „Und jeder, der gerettet worden ist,“'
    reason: Die Satzgliederung kann „Und es wird geschehen“ stärker als eigenständige Einleitung behandeln; die alternative Fassung folgt der überlieferten früheren Wiedergabe.
  revision_rationale: Es wird ausschließlich die zu stark interpretierende Wiedergabe von „in qua credidit“ korrigiert. Die vollständige Satzform und der offene Anschluss an den folgenden Vers bleiben erhalten; die vorhandene Fußnotenmarke und ihr Bezug bleiben unverändert.
