source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female servant, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: de
  text: Und es geschah nach dreißig Jahren, dass Gott mich, deine Sklavin, erhörte[a], meine Niedrigkeit sah, auf meine Not achtete und mir einen Sohn gab. Und ich freute mich sehr über ihn, ebenso mein Mann und alle meine Mitbürger, und wir ehrten den Mächtigen sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Latein hat die auffällige Genitivform „ancillae tuae“ („deiner Sklavin“). Wahrscheinlich steht sie, nach einer griechischen Konstruktion, appositiv zu „mich“: „mich, deine Sklavin“. Grammatisch möglich ist auch: „Der Gott deiner Sklavin erhörte mich“.'
    reason: Die Fußnote dokumentiert die ungewöhnliche Form und bewahrt die grammatisch mögliche, aber kontextuell weniger wahrscheinliche Alternative.
lexical_decisions:
- source_word: exaudivit
  choice: erhörte
  rationale: 'Gibt mehr als bloßes Hören wieder: Gott hört die Bitte an und antwortet darauf.'
- source_word: ancillae tuae
  choice: deine Magd
  rationale: Bewahrt das weibliche Geschlecht und den dienenden Status von ancilla, ohne im Deutschen unnötig modern-rechtlich „Sklavin“ zu sagen; der schwierige lateinische Genitiv wird als Apposition verstanden.
- source_word: humilitatem
  choice: Erniedrigung
  rationale: Bewahrt die objektive Bedrängnis bzw. den niedrigen Zustand stärker als das missverständliche moderne „Demut“.
- source_word: tribulationi
  choice: Not
  rationale: Natürliches, würdiges Deutsch für bedrängende Leiden oder Bedrängnis.
- source_word: iucundata sum super eum valde
  choice: Über ihn freute ich mich sehr
  rationale: Natürliches Deutsch, das den Gegenstand und die Intensität der Freude erhält.
- source_word: cives mei
  choice: meine Mitbürger
  rationale: Entspricht dem bürgerlichen bzw. städtischen Gemeinschaftsbezug von cives.
- source_word: Fortem
  choice: dem Mächtigen
  rationale: Bewahrt den substantivierten Gottesbezeichner und seine feierliche Wirkung.
theological_decisions:
- issue: Bezug von ancillae tuae
  choice: 'Apposition zu „mich“: „mich, deine Magd“'
  alternative: „der Gott deiner Magd erhörte mich“
  rationale: Das ungewöhnliche Latein ist am plausibelsten als Übersetzungsgriechisch zu verstehen, bei dem die weibliche Dienerin die Sprecherin bezeichnet. Die Alternative macht aus dem Genitiv eine Gottesbestimmung und ergibt im Kontext einen weniger wahrscheinlichen Sinn.
- issue: Gottesbezeichnung Fortem
  choice: „der Mächtige“
  alternative: „der Starke“
  rationale: „Der Mächtige“ ist als substantivierte Gottesbezeichnung im heutigen Deutsch natürlicher und bewahrt den theologischen Titel, ohne ihn durch einen spezifischeren Namen zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Magd“ ist bewusst bibelsprachlich, aber allgemein verständlich; „weibliche Sklavin“ wäre zwar sozialgeschichtlich expliziter, klänge hier jedoch schwerfällig. Die Satzfolge des lateinischen Ausgangstextes bleibt weitgehend erhalten, wird aber idiomatisch gegliedert.
