revisions:
- from: Und nach dreißig Jahren geschah es, dass Gott mich, deine Magd, erhörte[a], meine Erniedrigung sah, auf meine Not achtete und mir einen Sohn schenkte. Über ihn freute ich mich sehr, ebenso mein Mann und alle meine Mitbürger, und wir erwiesen dem Mächtigen große Ehre.
  to: Und es geschah nach dreißig Jahren, dass Gott mich, deine Sklavin, erhörte[a], meine Niedrigkeit sah, auf meine Not achtete und mir einen Sohn gab. Und ich freute mich sehr über ihn, ebenso mein Mann und alle meine Mitbürger, und wir ehrten den Mächtigen sehr.
  rationale: Die Revision folgt dem lateinischen Wortlaut genauer, insbesondere bei ancilla, humilitas und dedit, und überarbeitet die Anmerkung so, dass sie die textliche Schwierigkeit präzise und neutral erklärt. Die wahrscheinliche appositionelle Lesart bleibt im Text; die alternative Analyse wird in der Fußnote transparent erhalten.
