id: 2ES.9.34
reference: 2 Esdras 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uel nauem mare uel uas aliud escas uel potus, et cum fuerit ut exterminetur quod seminatum est uel quod missum est uel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/034.yaml
  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: de
  text: oder das Meer ein Schiff oder ein anderes Gefäß Speise oder Trank aufnimmt, und wenn es geschieht, dass vernichtet wird, was gesät oder hineingegeben wurde, oder …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas aliud
  choice: irgendein anderes Gefäß
  rationale: „aliud“ wird ausdrücklich mit „anderes“ wiedergegeben; „irgendein“ bildet den unbestimmten Charakter der Wendung natürlich ab.
- source_word: escas uel potus
  choice: Speise oder Trank
  rationale: Die Paarung wird knapp und würdevoll wiedergegeben; der lateinische Numerus ist in der koordinierten Sachbezeichnung im Deutschen nicht zwingend nachzuahmen.
- source_word: exterminetur
  choice: vernichtet wird
  rationale: Das Verb bezeichnet hier das Zugrundegehen beziehungsweise die Beseitigung des Aufgenommenen; „vernichtet“ bewahrt die starke Aussage.
- source_word: missum est
  choice: hineingegeben wurde
  rationale: Im Zusammenhang mit einem aufnehmenden Gefäß meint „mittere“ das Einbringen; „hineingegeben“ macht den elliptischen Bezug verständlich, ohne den Gegenstand festzulegen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Standardstil. Der überlieferte Wortlaut setzt mitten in einer Aufzählung ein und bricht am Ende erneut mit „oder“ ab; beide Fragmentgrenzen bleiben sichtbar. Die nicht im vorgelegten lateinischen Text belegte englische Einleitung („And behold … it is the custom … when the earth receives seed“) wurde nicht in den Haupttext übernommen.
