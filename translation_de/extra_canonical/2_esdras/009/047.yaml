  naturalness: Der revidierte Satz ist modernes, würdiges Standarddeutsch. Die Formulierung »ihm eine Frau zu nehmen« ist bewusst quellennahe und markiert den historischen idiomatischen Heiratskontext, ohne dessen soziale Einzelheiten auszudeuten.
