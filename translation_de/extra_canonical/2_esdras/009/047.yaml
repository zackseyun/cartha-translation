source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum crevisset et venissem accipere illi uxorem, et feci diem epuli.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/047.yaml
  text: And it happened, when he had grown up and I had come to take a wife for him, that I made a day of feasting.
translation:
  language: de
  text: 'Und es geschah: Als er erwachsen war und ich kam, um ihm eine Frau zu nehmen, richtete ich einen Festtag aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum crevisset
  choice: als er erwachsen war
  rationale: Das lateinische plusquamperfektische »crevisset« bezeichnet hier das Herangewachsensein des Sohnes; »erwachsen war« ist im Deutschen natürlich und kontextgemäß.
- source_word: venissem accipere illi uxorem
  choice: ich so weit war, ihm eine Frau zu nehmen
  rationale: »venissem« wird idiomatisch als Erreichen eines Zeitpunkts oder Vorhabens verstanden. »ihm eine Frau zu nehmen« bewahrt die historische Ausdrucksweise und die Dativbeziehung von »illi«, ohne modernere Vorstellungen wie eine vollständig vom Vater arrangierte Ehe zusätzlich einzutragen.
- source_word: feci diem epuli
  choice: veranstaltete ich ein Festmahl
  rationale: Die wörtliche Wendung »einen Tag des Festmahls machen« wird als natürliche deutsche Bezeichnung für die Ausrichtung eines Festmahls wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische Einleitungsformel »et factum est« wird nicht mechanisch mit »und es geschah« abgebildet, sondern natürlich in den deutschen Satzbau integriert. Keine Fußnoten erforderlich.
