revisions:
- from: Und damals, als ich für sie – für die, die jetzt leben – die Weltzeit vorbereitete, in der sie wohnen sollten, ehe sie für sie geschaffen worden war, widersprach mir niemand.
  to: Und damals, als ich für sie – für die, die jetzt leben – Vorkehrungen traf, bevor für sie das Zeitalter geschaffen wurde, in dem sie wohnen sollten, widersprach mir niemand.
  rationale: 'Die Revision stellt die lateinische Abfolge und Bezugsstruktur wieder her: Vorsorge für die gegenwärtig Lebenden, dann die Erschaffung des saeculum, in dem sie wohnen sollten. Sie bewahrt die knappe abschließende Aussage ohne erläuternden Zusatz und benötigt keine Fußnote, da die vorliegende lateinische Lesart keinen im deutschen Text zu markierenden textkritischen Zusatz enthält.'
