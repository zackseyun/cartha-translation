  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: de
  text: Und damals, als ich für sie – für die, die jetzt leben – Vorkehrungen traf, bevor für sie das Zeitalter geschaffen wurde, in dem sie wohnen sollten, widersprach mir niemand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: Weltzeit
  rationale: Das lateinische Wort kann sowohl eine Zeitspanne beziehungsweise ein Zeitalter als auch die geschaffene Weltordnung bezeichnen. „Weltzeit“ bewahrt diese Verbindung hier besser als das rein zeitliche „Zeitalter“.
- source_word: his qui nunc
  choice: für die, die jetzt leben
  rationale: Die elliptische Wendung bezeichnet die gegenwärtig existierenden Menschen; „leben“ ist im Deutschen natürlich und bleibt sachlich nahe bei „die jetzt sind“.
- source_word: contradixit mihi
  choice: widersprach mir
  rationale: Direkte und idiomatische Wiedergabe des lateinischen Ausdrucks ohne eine im Ausgangstext nicht vorhandene Begründung hinzuzufügen.
theological_decisions:
- issue: Bezug von „ihnen“ und der nachgestellten Erläuterung
  choice: „für sie – für die, die jetzt leben –“
  alternative: „für diejenigen, die jetzt leben“
  rationale: Die Wiederaufnahme von eis durch his qui nunc wird sichtbar gehalten, statt sie zu glätten; so bleibt die markierte lateinische Satzstruktur erhalten.
- issue: Nicht im lateinischen Text stehende Begründung
  choice: Keine Ergänzung wie „denn es gab niemanden“
  alternative: Ergänzung nach der syrischen Überlieferung
  rationale: Die vorgelegte lateinische Primärquelle endet mit „und niemand widersprach mir“. Eine erklärende Zusatzklausel wäre hier nicht quellengemäß.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche bilden die appositive Präzisierung des lateinischen „eis, his qui nunc“ ab. Die ungewöhnliche zeitliche Verschränkung von Vorbereitung und Erschaffung wurde nicht harmonisiert.
