  source_fidelity: Der Sinn wird insgesamt gut getroffen. Allerdings bedeutet „animo“ hier „im Geist/Gemüt“ und nicht „Seele“; die Umformung zu „meine Seele ist ... erfüllt“ verschiebt sowohl den Ausdruck als auch die prädikative Aussage „ich bin sehr bitter im Geist“.
  naturalness: Die Fassung ist flüssig und würdig. „Lass mich“ ist im Kontext natürlich; „in meinem Inneren sehr verbittert“ ist modernes Standarddeutsch und bewahrt die innere Zustandsbeschreibung.
  terminology: „Gedemütigt“ gibt humiliata als passivischen Zustand angemessen wieder. „Verbittert“ für amara sollte durch die Ergänzung „in meinem Inneren“ klar als Leidenszustand, nicht als bloße Charaktereigenschaft, markiert werden.
