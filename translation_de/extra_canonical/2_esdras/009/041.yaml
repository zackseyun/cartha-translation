id: 2ES.9.41
reference: 2 Esdras 9:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dimitte me, dominus meus, ut defleam me et adiciam dolorem, quoniam valde amara sumanimo et humiliata sum valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: de
  text: 'Sie sagte zu mir: »Lass mich, mein Herr, damit ich über mich selbst weinen und meinen Schmerz noch vermehren kann; denn ich bin in meinem Inneren sehr verbittert und tief gedemütigt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: Lass mich
  rationale: Gibt die knappe Bitte des lateinischen Textes eng wieder, ohne das nicht ausdrücklich vorhandene »allein« hinzuzufügen.
- source_word: ut defleam me
  choice: damit ich über mich selbst weinen ... kann
  rationale: Bewahrt sowohl den Zweckcharakter von ut als auch den Bezug des Weinens auf die Sprecherin selbst.
- source_word: adiciam dolorem
  choice: meinen Schmerz noch vermehren
  rationale: Gibt das wörtliche Bild des Hinzufügens zum bereits vorhandenen Schmerz in natürlichem Deutsch wieder.
- source_word: valde amara sum animo
  choice: meine Seele ist von großer Bitterkeit erfüllt
  rationale: Vermittelt den inneren Zustand von animo und vermeidet das im Deutschen leicht charakterbezogene Missverständnis von »ich bin sehr bitter«.
- source_word: humiliata sum valde
  choice: ich bin tief gedemütigt
  rationale: Entspricht dem passivischen Zustand des Erniedrigt- oder Gedemütigtseins und wahrt dessen mögliche emotionale wie soziale Tragweite.
theological_decisions:
- issue: Bedeutung von humiliata
  choice: tief gedemütigt
  alternative: sehr erniedrigt / tief gebeugt
  rationale: »Gedemütigt« bewahrt die passive Form und die Spannung zwischen äußerer Erniedrigung und innerer Niedergeschlagenheit, ohne eine bestimmte theologische Deutung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt emotional eindringlich und folgt der lateinischen Struktur, wird jedoch dort idiomatisch geglättet, wo eine zu wörtliche Fassung im Deutschen missverständlich wäre.
