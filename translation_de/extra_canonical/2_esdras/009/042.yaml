lexical_decisions:
- source_word: quid passa es
  choice: Was ist dir widerfahren?
  rationale: Das lateinische pati bezeichnet hier etwas, das die Frau erlebt oder erlitten hat. „Widerfahren“ bewahrt diesen passiven, möglicherweise leidvollen Sinn, ohne ihn auf ein bloßes Geschehen zu verengen.
- source_word: dic mihi
  choice: Sag es mir.
  rationale: Natürliches modernes Deutsch; das ergänzte „es“ nimmt die zuvor erfragte Erfahrung auf.
- source_word: Et dixit ad me
  choice: 'Und sie sagte zu mir:'
  rationale: Die abschließende Redeeinleitung gehört ausdrücklich zu diesem Vers und wird samt parataktischem „Und“ und Doppelpunkt erhalten.
