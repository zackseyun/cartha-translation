  source_fidelity: 'Der deutsche Text gibt den knappen lateinischen Parallelismus angemessen wieder: „initia“ steht im Plural als „Anfänge“, „consummatio“ im Singular als „Ende“. „sichtbar“ gibt „manifesta“ idiomatisch wieder; „Wunder und Machttaten“ entspricht „prodigiis et uirtutibus“, und „Taten und Zeichen“ bildet „in actu et in signis“ sachgerecht ab.'
