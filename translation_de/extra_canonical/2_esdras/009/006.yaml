source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'manifesta in prodigiis et uirtutibus, et consummatio in actu et in signis. Et erit omnis qui saluus factus fuerit, et qui poterit effugere per opera sua uel per fidem in qua credidit, Is relinquetur de praedictis periculis et uidebit salutare meum in terra mea et in finibus meis quae sanctificaui mihi a saeculo. Et tunc mirabuntur qui nunc abusi sunt uias meas, et in cruciamentis commorabuntur hii qui eas proiecerunt in contemptu. Quodquod enim non cognouerunt me uiuentes beneficia consecuti, Et quodquod fastidierunt legem meam, cum adhuc erant habentes libertatem, Et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreuerunt, hos oportet post mortem in cruciamento cognoscere. Tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti saluabuntur, et quorum saeculum et propter quos saeculum et quando. Respondi et dixi : Olim locutus sum et nunc dico et postea dicam, quoniam plures sunt qui pereunt quam ii qui saluabuntur, Sicut multiplicat
    fluctus super guttam. Et respondit ad me et dixit : qualis ager, talia et semina ; et quales flores, tales et tincturae ; et qualis opera, talis et creatio ; et qualis agricola, talis et area. Quoniam tempus erat saeculi, et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum, in quo inhabitarent; et nemo contradixit mihi tunc, nec enim erat quisquam: Et nunc creati in mundo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/006.yaml
  text: 'so also are the times of the Most High: beginnings made manifest in wonders and mighty works[a], and the end in deeds and signs.'
translation:
  language: de
  text: 'So ist es auch mit den Zeiten des Höchsten: Ihre Anfänge werden in Wundern und Machttaten sichtbar, ihr Ende in Taten und Zeichen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: manifesta
  choice: werden … sichtbar
  rationale: Gibt das prädikative „offenkundig/sichtbar“ in natürlichem Deutsch wieder; das ergänzte Verb entspricht dem elliptischen lateinischen Satzbau.
- source_word: prodigiis
  choice: Wundern
  rationale: Bezeichnet außergewöhnliche, zeichenhafte Geschehnisse; „Wunder“ ist hier verständlich und würdevoll.
- source_word: uirtutibus
  choice: Machttaten
  rationale: Im Kontext meint „virtutes“ machtvolle Taten, nicht moralische Tugenden.
- source_word: consummatio
  choice: Ende
  rationale: Bewahrt den Singular des lateinischen Substantivs und bezeichnet den abschließenden Vollzug.
- source_word: in actu et in signis
  choice: in Taten und Zeichen
  rationale: Gibt den Kontrast zu „Wundern und Machttaten“ knapp wieder; der lateinische Singular „actu“ kann kollektiv den Vollzug beziehungsweise das Handeln bezeichnen.
theological_decisions:
- issue: Verhältnis der Zeiten des Höchsten zu ihren sichtbaren Kennzeichen
  choice: „So ist es auch mit den Zeiten des Höchsten“
  alternative: „So sind auch die Zeiten des Höchsten“
  rationale: Die idiomatische deutsche Formulierung wahrt den Vergleich aus dem vorangehenden Zusammenhang, ohne eine zusätzliche Deutung über die Endzeitabfolge einzutragen.
- issue: Singular von „consummatio“
  choice: „ihr Ende“
  alternative: „ihre Enden“
  rationale: Der lateinische Text hat ausdrücklich den Singular; daher wird keine Mehrzahl eingeführt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Der knappe Parallelismus zwischen Anfängen und Ende sowie zwischen den jeweiligen Zeichen bleibt erhalten.
