source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae suscepta sunt, Exterminentur haec, susceptoria uero manent: apud nos enim non sic factum est. Nos quidem qui legem accepimus peccantes peribimus et cor nostrum quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: de
  text: und wenn das Aufgenommene vernichtet wird, dann wird dieses vernichtet; die Aufnahmegefäße aber bleiben bestehen.[a] Denn bei uns ist es nicht so geschehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische „diese“ kann das zuvor genannte Aufgenommene nochmals aufgreifen; susceptoria ist ein seltenes Wort für das Aufnehmende oder für Aufnahmegefäße.
    reason: Die Anmerkung erläutert sowohl die im Deutschen bewusst beibehaltene Wiederaufnahme als auch die Bedeutungsweite des seltenen susceptoria.
lexical_decisions:
- source_word: suscepta
  choice: das Aufgenommene
  rationale: Das substantivierte Partizip bewahrt die Grundbedeutung von suscipere („aufnehmen, empfangen“) und vermeidet die im lateinischen Wortlaut nicht ausdrücklich enthaltenen Deutungen „Gesätes“ oder „Gesandtes“.
- source_word: exterminentur
  choice: vernichtet wird
  rationale: Im Kontext bezeichnet das Verb die Beseitigung beziehungsweise den Untergang des Aufgenommenen; „vernichtet“ gibt dies in natürlichem, würdigem Deutsch wieder.
- source_word: susceptoria
  choice: die Behältnisse
  rationale: Das seltene substantivierte Neutrum bezeichnet das Aufnehmende beziehungsweise Aufnahmegefäße. „Behältnisse“ erhält den Gegensatz zwischen Inhalt und aufnehmendem Träger.
- source_word: apud nos enim non sic factum est
  choice: Denn bei uns ist es nicht so geschehen
  rationale: „Denn“ gibt enim als begründende Verknüpfung wieder; die unpersönliche Formulierung wahrt die knappe Aussage des Lateinischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie „aufgenommen/Behältnisse“ lässt den Gegensatz zwischen dem aufgenommenen Inhalt und dem aufnehmenden Träger erkennen, ohne eine nicht ausdrücklich genannte Saatmetapher einzuführen.
