revisions:
- from: und wenn das Aufgenommene vernichtet wird, wird es vernichtet, die Behältnisse aber bleiben bestehen.[a] Denn bei uns ist es nicht so geschehen.
  to: und wenn das Aufgenommene vernichtet wird, dann wird dieses vernichtet; die Aufnahmegefäße aber bleiben bestehen.[a] Denn bei uns ist es nicht so geschehen.
  rationale: Die Revision macht den demonstrativen Rückverweis des lateinischen haec transparent, ohne die syntaktische und semantische Unbestimmtheit des schwierigen Wortlauts aufzulösen. Zugleich ersetzt sie das ungenauere „Behältnisse“ durch „Aufnahmegefäße“.
