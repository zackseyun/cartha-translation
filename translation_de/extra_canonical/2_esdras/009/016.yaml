  text: 'wie eine Woge einen Tropfen vielfach übertrifft.« Und er antwortete mir und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicat
  choice: um ein Vielfaches übertrifft
  rationale: Das lateinische Verb bezeichnet hier im Vergleich eine vielfache Überlegenheit. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne lediglich ein allgemeines »größer sein« einzusetzen.
- source_word: fluctus
  choice: eine Woge
  rationale: Wegen des singularischen Verbs multiplicat wird fluctus als Nominativ Singular verstanden. »Woge« bewahrt das Bild und ist im gehobenen, aber verständlichen Register idiomatisch.
- source_word: super guttam
  choice: einen Tropfen … übertrifft
  rationale: super drückt in Verbindung mit dem Vergleich die Überlegenheit gegenüber dem Tropfen aus; im Deutschen wird dies durch die Konstruktion mit »übertreffen« klar und natürlich wiedergegeben.
- source_word: et respondit ad me et dixit
  choice: Und er antwortete mir und sprach
  rationale: Die vollständige Dialogformel wird innerhalb der vorgegebenen Versgrenze wiedergegeben; »sprach« wahrt den würdevollen biblischen Erzählton.
theological_decisions:
- issue: Art des Vergleichs zwischen Woge und Tropfen
  choice: vielfache Überlegenheit einer einzelnen Woge
  alternative: zahlenmäßige Vielzahl von Wogen gegenüber einem Tropfen
  rationale: Die singularische Form multiplicat stützt eine einzelne Woge als Subjekt. Da die knappe lateinische Wendung dennoch semantisch ungewöhnlich ist und auch kollektiv verstanden werden kann, wird die alternative Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählton. Die Vergleichsformel wird idiomatisch, aber bildnah wiedergegeben; die abschließende Dialogformel bleibt gemäß der lateinischen Versabgrenzung in diesem Vers.
