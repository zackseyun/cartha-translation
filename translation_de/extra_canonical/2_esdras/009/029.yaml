  source_fidelity: 'Die Ergänzung „Da begann ich“ ist vom vorliegenden Latein nicht gedeckt: „dicere coram altissimo et dixi“ bietet hier lediglich den (syntaktisch auffälligen) Bezug auf das Sprechen vor dem Höchsten und „ich sagte“. Die Gottesoffenbarung, die Väter, der Auszug aus Ägypten und die unbetretene Wüste sind sonst sachgerecht wiedergegeben. Das im Ausschnitt fehlende zweite Adjektiv muss weiterhin als Ergänzung kenntlich bleiben.'
  naturalness: „Da sprach ich vor dem Höchsten und sagte“ ist modernes, würdiges Deutsch und vermeidet die unbegründete Aspektergänzung „begann“. „unter uns“ ist natürlicher und weniger interpretierend als „mitten unter uns“, wahrt aber die ungewöhnliche Zuordnung von „in nobis“ zu den Vätern.
  terminology: „der Höchste“, „Herr“, „Väter“, „Wüste“ und „unbetreten“ passen zu Register und Quellsprache. „unfruchtbar“ ist als textkritisch ergänzter Bestandteil zulässig, sofern die Fußnote dies transparent ausweist.
