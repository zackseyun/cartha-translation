    rationale: Das Fragment enthält „dicere ... et dixi“, aber kein Äquivalent zu „beginnen“. Die deutsche Übersetzung soll die syntaktische Unebenheit nicht durch einen neuen erzählerischen Sachverhalt auflösen.
  - severity: low
    issue: „mitten unter uns“ ist gegenüber „in nobis“ leicht verstärkend.
    rationale: „Mitten“ kann zwar idiomatisch sein, ist aber im Latein nicht ausdrücklich vorhanden. „unter uns“ bewahrt die schwierige, möglicherweise textgeschichtlich bedingte Konstruktion zurückhaltender.
