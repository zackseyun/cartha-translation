  text: 'dicere coram altissimo et dixi: O domine in nobis ostendens ostensus es patribus nostris in deserto quando erant exientes de Aegypto et quando ueniebant in deserto quod non calcatur et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: de
  text: 'Da sprach ich vor dem Höchsten und sagte: »O Herr, du hast dich unseren Vätern unter uns in der Wüste gezeigt, als sie aus Ägypten auszogen und in die unbetretene und unfruchtbare Wüste kamen,[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Textausschnitt bricht hier nach „und“ ab. „unfruchtbar“ folgt der ergänzten Versüberlieferung.
    reason: Das zweite Adjektiv steht nicht im bereitgestellten lateinischen Ausschnitt, wird jedoch von der ergänzten Überlieferung und der englischen Prüffassung gestützt.
lexical_decisions:
- source_word: dicere coram altissimo et dixi
  choice: Da begann ich vor dem Höchsten zu sprechen und sagte
  rationale: Der überlieferte Wortlaut setzt offenbar eine begonnene Verbform aus dem vorherigen Zusammenhang fort. Die deutsche Fassung gibt den natürlichen Erzählsinn wieder, ohne die lateinische Satzfügung nachzuahmen.
- source_word: ostendens ostensus es
  choice: du hast dich … gezeigt
  rationale: Die lateinische Doppelung ist wahrscheinlich semitisch geprägte Verstärkung. Eine wörtliche Verdoppelung wäre im Deutschen unverständlich; das reflexive Verb bewahrt den Sinn einer Selbstoffenbarung.
- source_word: in nobis … patribus nostris
  choice: unseren Vätern mitten unter uns
  rationale: Die Stellung und Zuordnung von „in nobis“ ist ungewöhnlich. Diese Fassung lässt sowohl die Offenbarung an die Väter als auch ihre Verortung innerhalb des Gottesvolkes anklingen, ohne die schwierige Konstruktion dogmatisch festzulegen.
- source_word: deserto quod non calcatur
  choice: unbetretene … Wüste
  rationale: „non calcatur“ bezeichnet wörtlich einen Ort, der nicht betreten oder begangen wird.
- source_word: et
  choice: und unfruchtbare
  rationale: Der bereitgestellte lateinische Ausschnitt bricht nach „et“ ab; „unfruchtbar“ folgt der ergänzten, im konsultierten englischen Text bezeugten Versfassung.
theological_decisions:
- issue: Art und Adressaten der göttlichen Offenbarung
  choice: „du hast dich unseren Vätern mitten unter uns … gezeigt“
  alternative: „du hast dich unter uns unseren Vätern … gezeigt“ oder „du hast dich in uns unseren Vätern … gezeigt“
  rationale: Das mehrdeutige lateinische „in nobis … patribus nostris“ wird nicht als präzise Lehrformel ausgelegt. Die gewählte Wortstellung bleibt verständlich und wahrt die Spannung zwischen Offenbarung an die Väter und Gottes Gegenwart inmitten seines Volkes.
translation_notes:
  register: Moderne, würdige Standardsprache. „O Herr“ bewahrt die feierliche Anrede; „mitten unter uns“ klingt natürlich, lässt aber die ungewöhnliche lateinische Konstruktion erkennbar offen. Das abschließende Komma zeigt, dass die Rede im folgenden Vers weitergeht.
