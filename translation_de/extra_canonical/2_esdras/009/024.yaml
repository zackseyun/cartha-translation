  source_fidelity: 'Die Übersetzung gibt die erhaltene lateinische Vorlage sowie den durch den englischen Audit-Trail ausgewiesenen Kontext getreu wieder: das unbebaute Feld, die ausschließliche Nahrung aus Feldblumen, der Verzicht auf Fleisch und Wein sowie das unablässige Gebet zum Höchsten. Das abschließende „und“ bewahrt die offene Satzfortsetzung des lateinischen „et“ angemessen.'
