id: 2ES.9.24
reference: 2 Esdras 9:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domus non est aedificata, et manduca solummodo de floribus campi, et carnem non gustabis et uinum non bibes, sed solummodo flores—Et deprecare altissimum sine intermissione, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: de
  text: Geh auf ein Feld, auf dem kein Haus gebaut ist, und iss nur von den Blumen des Feldes. Fleisch sollst du nicht kosten und Wein nicht trinken, sondern nur Blumen. Und bete ohne Unterlass zum Höchsten, und
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domus non est aedificata
  choice: auf dem kein Haus gebaut ist
  rationale: Gibt die lateinische Aussage eng und in natürlichem Deutsch wieder; der vorauszusetzende Gang auf ein Feld folgt dem durch den überlieferten Satzzusammenhang und die konsultierte Fassung erkennbaren Kontext.
- source_word: manduca solummodo de floribus campi
  choice: iss nur von den Blumen des Feldes
  rationale: Bewahrt mit „von“ die Konstruktion de floribus und formuliert die asketische Anweisung verständlich.
- source_word: carnem non gustabis
  choice: Fleisch sollst du nicht kosten
  rationale: „kosten“ entspricht gustare genauer als das allgemeinere „essen“ und erhält den nachdrücklichen Verzicht.
- source_word: uinum non bibes
  choice: Wein nicht trinken
  rationale: Direkte, idiomatische Wiedergabe der negierten Zukunfts- beziehungsweise Gebotsform.
- source_word: deprecare altissimum sine intermissione
  choice: bete ohne Unterlass zum Höchsten
  rationale: „zum Höchsten beten“ ist im Deutschen natürlich; „ohne Unterlass“ bewahrt den feierlichen biblischen Ton von sine intermissione.
theological_decisions:
- issue: Bezeichnung Gottes als altissimus
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „der Höchste“ gibt den lateinischen Superlativ klar und traditionsnah wieder, ohne eine zusätzliche Verstärkung einzutragen.
- issue: Abgebrochener Satz am Versende
  choice: abschließendes „und“ beibehalten
  alternative: das „und“ aus stilistischen Gründen auslassen oder den Satz aus dem Folgevers ergänzen
  rationale: Die Vorlage endet mit et. Die offene Fortsetzung wird bewahrt, damit die Versgrenze nicht geglättet und kein Text aus dem nächsten Vers vorweggenommen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Anrede. Die ungewöhnliche Wendung „sondern nur Blumen“ bleibt erhalten, weil sie ausdrücklich in der lateinischen Vorlage steht. Das abschließende „und“ bildet bewusst den fragmentarischen Übergang zum Folgevers ab.
