  text: acceperunt perierunt non custodientes quod in eis seminatum fuerat. Et ecce consuetudo est ut, cum acceperit terra semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: de
  text: Denn diejenigen, die es empfingen, gingen zugrunde[a], weil sie nicht bewahrten, was in ihnen gesät worden war. Und siehe, es ist üblich, dass, wenn die Erde Samen aufgenommen hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch diejenigen, die es empfingen, gingen zugrunde.“'
    reason: Dokumentiert die frühere adversative Wiedergabe im englischen Audit Trail, obwohl der lateinische Anschluss mit „nam“ vorzugsweise begründend zu verstehen ist.
lexical_decisions:
- source_word: acceperunt
  choice: die es empfingen
  rationale: Das im Lateinischen unausgesprochene Objekt wird entsprechend dem Zusammenhang mit „es“ wiedergegeben, ohne es näher zu bestimmen.
- source_word: perierunt
  choice: gingen zugrunde
  rationale: Gibt das vollendete perire natürlich und würdevoll wieder; gemeint ist der Untergang der Empfänger.
- source_word: non custodientes
  choice: weil sie nicht bewahrten
  rationale: Das lateinische Partizip bezeichnet hier den begründenden Umstand; „bewahren“ erhält den Gedanken des treuen Festhaltens.
- source_word: quod in eis seminatum fuerat
  choice: was in sie gesät worden war
  rationale: Bewahrt das Bild des in Menschen gesäten Samens und die Vorzeitigkeit des lateinischen Plusquamperfekts.
- source_word: consuetudo est ut
  choice: gewöhnlich geschieht Folgendes
  rationale: Eine natürliche deutsche Einleitung für den üblichen Vorgang, der im anschließenden, über die Versgrenze hinausreichenden Satz beschrieben wird.
- source_word: cum acceperit terra semen
  choice: Wenn die Erde Samen aufgenommen hat
  rationale: Gibt den zeitlichen Nebensatz und das Bild der Erde, die Saat empfängt, klar wieder.
theological_decisions:
- issue: Logischer Anschluss des einleitenden nam
  choice: Denn diejenigen, die es empfingen, gingen zugrunde
  alternative: Doch diejenigen, die es empfingen, gingen zugrunde
  rationale: 'Das in der maßgeblichen Textüberlieferung am Satzanfang stehende „nam“ begründet die vorausgehende Aussage: Nicht die Frucht des Gesetzes ging verloren, sondern seine Empfänger. Die alternative adversative Lesart wird in der Fußnote dokumentiert.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Saatbild und das unbestimmte Objekt von „empfingen“ bleiben erhalten. Der letzte Satz bleibt bewusst offen, da der lateinische Satz über die Versgrenze hinaus weitergeführt wird; der Doppelpunkt macht diesen fragmentarischen Anschluss im Deutschen verständlich.
