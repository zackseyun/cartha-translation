id: 2ES.9.32
reference: 2 Esdras 9:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam patres nostri accipientes legem non servaverunt et legitima mea non custodierunt. et factum est fructumlegis non periens; nec enim poterat, quoniam tuus erat.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: de
  text: Denn unsere Väter empfingen das Gesetz, hielten es aber nicht und befolgten meine Satzungen nicht. Doch die Frucht des Gesetzes ging nicht zugrunde; das konnte sie auch nicht, denn sie gehörte dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: unsere Väter
  rationale: Bewahrt die traditionelle, im Kontext auf die Vorfahren bezogene Ausdrucksweise des lateinischen Textes.
- source_word: accipientes legem
  choice: empfingen das Gesetz
  rationale: Gibt das Partizip natürlich und zeitlich vorgeordnet wieder, ohne den Vorgang unnötig auszudeuten.
- source_word: legitima mea
  choice: meine Satzungen
  rationale: „Satzungen“ bezeichnet verbindliche göttliche Bestimmungen und bewahrt das ausdrücklich vorhandene Possessivpronomen mea.
- source_word: fructum legis
  choice: die Frucht des Gesetzes
  rationale: Erhält die konkrete Metapher und ihre mögliche theologische Mehrdeutigkeit.
- source_word: non periens
  choice: ging nicht zugrunde
  rationale: Der bereinigte Text ist syntaktisch auffällig; die Wahl folgt dem durch nec enim poterat bestätigten Sinn, dass die Frucht nicht vergehen konnte.
- source_word: tuus erat
  choice: sie war dein Eigentum
  rationale: Macht die prädikative Zugehörigkeit im Deutschen eindeutig, ohne näher festzulegen, was die „Frucht“ bezeichnet.
theological_decisions:
- issue: Bezug und Bedeutung der „Frucht des Gesetzes“
  choice: Die Metapher bleibt unaufgelöst.
  alternative: Eine Deutung als Lohn, Wirkung, Verheißung oder Gerechtigkeit des Gesetzes ausdrücklich einsetzen.
  rationale: Der lateinische Text erklärt die Metapher nicht; eine konkrete Auslegung würde die genuine theologische Offenheit einschränken.
- issue: Göttliche Zugehörigkeit der Frucht
  choice: „dein Eigentum“ drückt die Zugehörigkeit aus.
  alternative: „sie war von dir“ oder „sie gehörte dir“.
  rationale: tuus erat bezeichnet Zugehörigkeit; „dein Eigentum“ ist klar und lässt offen, ob Ursprung, Herrschaft oder Bewahrung im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die adversative Bewegung zwischen dem Versagen der Väter und dem Fortbestand der Frucht wird mit „aber“ und „Doch“ klar wiedergegeben. Keine Fußnoten erforderlich.
