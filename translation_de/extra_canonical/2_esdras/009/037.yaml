source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: suscepit eam. Nam lex non perit sed permanet in suo honore.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/037.yaml
  text: For the law does not perish[a], but remains in its honor.”
translation:
  language: de
  text: Denn das Gesetz vergeht nicht, sondern bleibt in seiner Würde bestehen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: Denn
  rationale: Gibt die begründende Funktion der lateinischen Konjunktion wieder.
- source_word: lex
  choice: das Gesetz
  rationale: Direkte und kontextgemäße Wiedergabe des lateinischen Substantivs.
- source_word: non perit sed permanet
  choice: vergeht nicht, sondern bleibt … bestehen
  rationale: Bewahrt die klare Gegenüberstellung mit non … sed und gibt permanet idiomatisch wieder.
- source_word: in suo honore
  choice: in seiner Würde
  rationale: Bewahrt den Sinn von honor als fortbestehende Würde beziehungsweise Ehrenstellung; eine rein räumliche Wiedergabe wäre im Deutschen unnatürlich.
theological_decisions:
- issue: Art und Reichweite der Unvergänglichkeit des Gesetzes
  choice: Die Aussage bleibt uneingeschränkt und ohne dogmatische Erläuterung stehen.
  alternative: Den Fortbestand ausdrücklich auf Geltung, Ansehen oder einen bestimmten heilsgeschichtlichen Rahmen beziehen.
  rationale: Der lateinische Text erklärt nicht näher, in welchem Sinn das Gesetz nicht vergeht; diese Spannung darf die Übersetzung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die adversative Struktur des Lateinischen wird deutlich bewahrt; der abschließende Anführungsstrich folgt der gelieferten Versgestalt.
