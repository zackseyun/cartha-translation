source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populorum turbatio, gentium cogitationes, ducum inconstantia, principum turbatio, Tunc intelleges quoniam de his erat altis-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/003.yaml
  text: and confusion among peoples, thoughts among nations, instability among leaders, turmoil among rulers. Then you will understand that it was about these things that the Most High
translation:
  language: de
  text: Verwirrung unter den Völkern, Gedanken der Nationen, Unbeständigkeit der Anführer, Verwirrung der Herrscher. Dann wirst du erkennen, dass der Höchste bei diesen Dingen …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populorum turbatio
  choice: Verwirrung unter den Völkern
  rationale: Gibt den Genitiv idiomatisch wieder und bewahrt die offene Bedeutung von »turbatio«.
- source_word: gentium cogitationes
  choice: Gedanken unter den Nationen
  rationale: Übersetzt »cogitationes« bewusst neutral als »Gedanken« und vermeidet die unbelegte Einengung auf Pläne oder Intrigen.
- source_word: ducum inconstantia
  choice: Unbeständigkeit der Anführer
  rationale: »Anführer« ist eine natürliche, kontextoffene Wiedergabe von »duces«; »Unbeständigkeit« entspricht »inconstantia«.
- source_word: principum turbatio
  choice: Aufruhr unter den Herrschern
  rationale: Unterscheidet die zweite Verwendung von »turbatio« stilistisch, ohne ihren Störungs- und Unruhecharakter zu verlieren; »Herrscher« gibt »principes« im politischen Kontext wieder.
- source_word: Tunc intelleges quoniam de his erat altissimus
  choice: Dann wirst du erkennen, dass der Höchste von diesen Dingen
  rationale: Folgt dem überlieferten, am Versende abbrechenden Wortlaut. Die deutsche Formulierung bleibt entsprechend syntaktisch unvollständig und greift nicht dem folgenden Vers vor.
theological_decisions:
- issue: Bezeichnung Gottes als altissimus
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: »Der Höchste« ist eine direkte, würdige Wiedergabe und vermeidet eine unnötige Steigerung.
- issue: Unvollständiger Schluss des Versfragments
  choice: Die Aussage endet offen mit »von diesen Dingen«
  alternative: Ergänzung eines Prädikats aus dem Folgevers
  rationale: Der bereitgestellte lateinische Quelltext bricht nach »altis-« ab; eine Ergänzung würde über die vorgelegte Evidenz hinausgehen und mögliche Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nominale Reihung des Lateinischen bleibt erhalten. Der Schluss ist wegen der versübergreifenden, im bereitgestellten Quelltext abgebrochenen Konstruktion bewusst unvollständig.
