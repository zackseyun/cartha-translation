  text: ualde et saluaui mihi acinum de botru et plantationem de tribu multa. Pereat ergo multitudo quae sine causa nata est et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/021.yaml
  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: de
  text: Und ich sah und verschonte sie nur mit sehr großer Mühe. Ich rettete mir eine Beere aus der Traube und eine Pflanzung aus einem großen Wald.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lateinisch: „aus einem großen Stamm“; alte Übersetzungen bewahren hier wahrscheinlich die ursprünglichere Lesart „aus einem großen Wald“.'
    reason: Die Haupttextlesart beruht auf textkritischer Rekonstruktion gegen das überlieferte lateinische „de tribu multa“.
lexical_decisions:
- source_word: acinum de botru
  choice: eine Beere aus der Traube
  rationale: „Acinum“ bezeichnet eine einzelne Beere, „botrus“ die Traube beziehungsweise den Traubenbund; das Bild des einen bewahrten Einzelstücks bleibt erhalten.
- source_word: plantationem
  choice: eine Pflanzung
  rationale: Die konkrete Bildsprache des lateinischen Substantivs wird bewahrt, ohne sie zu einer bestimmten Pflanzenart zu verengen.
- source_word: saluaui mihi
  choice: Ich rettete mir
  rationale: Gibt sowohl das Bewahren beziehungsweise Retten als auch den Dativ des eigenen Interesses („für mich“) knapp und natürlich wieder.
- source_word: ualde
  choice: mit sehr großer Mühe
  rationale: Folgt der im konsultierten Text bezeugten Sinnlinie, wonach das Verschonen nur unter größter Mühe geschah; der vorgelegte lateinische Ausschnitt ist an dieser Stelle offenbar unvollständig.
- source_word: de tribu multa
  choice: aus einem großen Wald
  rationale: Das überlieferte lateinische „tribu“ bedeutet wörtlich „Stamm“, gilt hier jedoch als Korruption einer griechischen Lesart für „Wald“; die alten Tochterübersetzungen und der Parallelismus mit Beere und Traube stützen „Wald“.
theological_decisions:
- issue: Bezug von „saluaui mihi“
  choice: „Ich rettete mir“ bewahrt Gottes aktives Aussondern eines kleinen Restes.
  alternative: „Ich behielt für mich“
  rationale: Die gewählte Formulierung hält die Rettungsbedeutung von „salvare“ fest, ohne die Bildsprache als ausgearbeitete Lehre vom Rest zu deuten.
- issue: Textkritische Lesart „Wald“ oder „Stamm“
  choice: „Wald“ im Haupttext, „Stamm“ in der Fußnote
  alternative: „aus einem großen Stamm“ im Haupttext
  rationale: „Wald“ gibt mit hoher Wahrscheinlichkeit den älteren Sinn wieder; die lateinische Überlieferung wird dennoch transparent dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Rettungsbilder bleiben konkret und parallel; die Satzteilung verbessert die Verständlichkeit. Die im gelieferten lateinischen Ausschnitt anschließenden Worte „Pereat ergo multitudo …“ gehören dem konsultierten Versumfang zufolge zum folgenden Vers und wurden daher nicht aufgenommen.
