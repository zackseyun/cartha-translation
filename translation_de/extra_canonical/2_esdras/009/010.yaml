  yaml_path: translation/extra_canonical/2_esdras/009/010.yaml
  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: de
  text: Denn alle, die mich zu ihren Lebzeiten nicht erkannt hatten, obwohl sie Wohltaten empfangen hatten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot
  choice: alle, die
  rationale: Gibt die umfassende, indefinite Bedeutung des lateinischen Relativpronomens natürlich wieder.
- source_word: non cognoverunt me
  choice: mich nicht erkannt hatten
  rationale: „Erkennen“ bewahrt den möglichen Bedeutungsumfang von bloßem Kennen bis zu persönlicher Anerkennung; das Plusquamperfekt stellt den Vorgang vor die im Kontext erwartete Folge.
- source_word: viventes
  choice: zu ihren Lebzeiten
  rationale: Gibt den temporalen Sinn des Partizips idiomatisch und klar wieder.
- source_word: beneficia consecuti
  choice: Wohltaten empfangen hatten
  rationale: „Wohltaten“ wahrt den positiven Sinn von beneficia; „empfangen“ gibt consecuti in diesem Zusammenhang natürlich wieder.
theological_decisions:
- issue: Bedeutung von „cognoverunt“
  choice: erkannt
  alternative: gekannt
  rationale: „Erkannt“ lässt offen, ob Erkenntnis, Anerkennung oder eine relationale Gotteskenntnis gemeint ist, ohne die Aussage konfessionell festzulegen.
- issue: Verhältnis von empfangenen Wohltaten und fehlender Gotteserkenntnis
  choice: obwohl sie Wohltaten empfangen hatten
  alternative: nachdem sie Wohltaten empfangen hatten
  rationale: Das lateinische Partizip benennt zunächst nur einen Begleitumstand; „obwohl“ macht den im Satz erkennbaren Gegensatz verständlich, ohne eine zusätzliche Heilslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Satzfragment endet mit einem Komma, weil Vers 10 syntaktisch in die folgende Aussage weiterführt.
