id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: de
  text: Befasse dich also nicht länger mit der Frage, wie die Gottlosen gequält werden, sondern forsche danach, wie die Gerechten gerettet werden und wessen das Zeitalter ist, um wessen willen es da ist und wann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wessen die Welt ist, um wessen willen sie da ist und wann“. Das lateinische Wort kann sowohl „Zeitalter“ als auch „Welt“ bezeichnen. Der Schluss lautet wörtlich nur „und wann“; das zu ergänzende Verb bleibt offen.'
    reason: Die Bedeutungsbreite von „saeculum“ und die auffällige Ellipse des lateinischen Schlusses sind für Übersetzung und Auslegung erheblich.
lexical_decisions:
- source_word: curiosus esse
  choice: zu ergründen versuchen
  rationale: Gibt hier das forschende, auf Einzelheiten gerichtete Interesse wieder, ohne die im modernen Deutschen oft harmlose oder positive Färbung von „neugierig“ hervorzurufen.
- source_word: impii
  choice: die Gottlosen
  rationale: Entspricht dem religiös-moralischen Sinn des lateinischen Ausdrucks und wahrt den Gegensatz zu „die Gerechten“.
- source_word: cruciabuntur
  choice: gequält werden
  rationale: Bewahrt das passive Futur in idiomatischem Deutsch; „gefoltert“ wäre unnötig eng und würde stärker eine menschliche Strafhandlung nahelegen.
- source_word: iusti
  choice: die Gerechten
  rationale: Die etablierte und sachlich passende Wiedergabe für Menschen, die als gerecht gelten.
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bewahrt die zeitlich-eschatologische Bedeutung des lateinischen Wortes besser als das allgemeinere „Welt“, ohne seine mögliche Bedeutungsweite zu verschweigen.
- source_word: propter quos
  choice: um wessen willen
  rationale: Gibt die finale beziehungsweise begründende Beziehung offen wieder und legt nicht näher fest, in welchem Sinn das Zeitalter ihretwegen da ist.
theological_decisions:
- issue: Bezug und Bedeutung von „saeculum“
  choice: „das Zeitalter“; in den elliptischen Schlusssätzen durch „es da ist“ und „es kommt“ verständlich gemacht
  alternative: „die Welt“ oder „die kommende Welt“
  rationale: Der lateinische Text sagt lediglich „saeculum“ und lässt die genaue kosmologische beziehungsweise eschatologische Nuance offen. „Kommende Welt“ würde eine Deutung ausdrücklich in den Haupttext eintragen; „Zeitalter“ hält die zeitliche Dimension und die Spannung der Aussage besser fest.
- issue: Unausgesagtes Verb in „et quorum saeculum et propter quos saeculum et quando“
  choice: Die Ellipse wird idiomatisch als „wem das Zeitalter gehört, um wessen willen es da ist und wann es kommt“ entfaltet.
  alternative: 'Wörtlicher: „wessen das Zeitalter ist, um wessen willen das Zeitalter ist und wann“'
  rationale: Die Ergänzungen machen den lateinischen Sinn auf Deutsch lesbar. „Kommt“ erschließt die zeitliche Frage „wann“, ohne einen Zeitpunkt oder Ablauf festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz zwischen spekulativem Ergründen des Gerichts und dem Forschen nach der Rettung bleibt deutlich. Die etwas rätselhafte Dreierfrage am Ende wird lesbar gemacht, aber nicht konfessionell oder systematisch aufgelöst.
