  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: de
  text: 'Doch die, die in dieser vorbereiteten Welt erschaffen wurden, mit einem unerschöpflichen Tisch[a] und einem unerforschlichen Gesetz, sind in ihrem Verhalten verdorben worden. Und ich betrachtete mein Zeitalter, und siehe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verbindung „ein unerschöpflicher Tisch und ein unerforschliches Gesetz“ ist im Lateinischen schwierig. Sie scheint darauf hinzudeuten, dass den Menschen reichliche Versorgung und göttliche Weisung bereits bereitstanden, sie in ihrem Verhalten aber dennoch verdorben wurden.
    reason: textual_variant
lexical_decisions:
- source_word: hoc parato
  choice: in dieser bereiteten Welt
  rationale: Der knappe lateinische Ausdruck ist elliptisch und bezieht sich im Zusammenhang wahrscheinlich auf die bereitete Welt; die Ergänzung macht den Bezug im Deutschen verständlich, ohne die Bildsprache aufzulösen.
- source_word: mensa indeficienti
  choice: mit einem unerschöpflichen Tisch
  rationale: Bewahrt das ungewöhnliche Bild eines Tisches, dessen Vorrat nicht ausgeht, und vermeidet eine vorschnelle Deutung als allgemeine Versorgung.
- source_word: lege inuestigabili
  choice: mit einem unerforschlichen Gesetz
  rationale: Gibt die schwierige lateinische Formulierung formal wieder und erhält ihre mögliche Bedeutungsoffenheit.
- source_word: corrupti sunt moribus eorum
  choice: sind in ihren Lebensweisen verdorben worden
  rationale: Gibt den passivischen Ausdruck und den Bezug auf Verhalten beziehungsweise Sitten wieder; der Plural wahrt die Breite von moribus.
- source_word: saeculum meum
  choice: mein Zeitalter
  rationale: Saeculum bezeichnet hier eher die gegenwärtige Weltzeit oder Epoche als das persönliche Lebensalter.
- source_word: et ecce
  choice: 'und siehe:'
  rationale: Bewahrt die biblische Aufmerksamkeitsformel und den offenen Anschluss an den folgenden Vers.
theological_decisions:
- issue: Verhältnis von göttlicher Bereitstellung und menschlichem Verderben
  choice: Die Bilder von Tisch und Gesetz bleiben nebeneinander stehen.
  alternative: Beide Bilder ausdrücklich als Versorgung und göttliche Unterweisung erklären.
  rationale: Der lateinische Text stellt die Gaben und das Verderben spannungsvoll gegenüber, ohne ihre genaue Beziehung auszudeuten.
- issue: Art des Verderbens
  choice: 'Passivisch: „sind … verdorben worden“'
  alternative: 'Aktiv beziehungsweise zuständlich: „haben ihre Lebensweise verdorben“ oder „wurden verdorben“ mit genanntem Urheber.'
  rationale: Das lateinische corrupti sunt lässt den Urheber offen; die Übersetzung soll weder göttliche Verursachung noch ausschließlich menschliche Selbstverderbnis hineinlesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Der Doppelpunkt nach „siehe“ kennzeichnet den offenen Satzanschluss an den folgenden Vers.
