  source_fidelity: Die Übersetzung gibt die zentrale Gegenüberstellung von vorbereiteter Gegebenheit, „unerschöpflichem Tisch“, „unerforschlichem Gesetz“ und dem Verderben treffend wieder. „in dieser bereiteten Welt geschaffen“ ist jedoch sprachlich unnatürlich; „vorbereitet“ und „erschaffen“ entsprechen dem intendierten Sinn klarer. Die passive Form von corrupti sunt bleibt zu Recht erhalten und lässt einen Urheber offen.
  naturalness: Der Satzbau ist insgesamt verständlich und würdig. „bereitete Welt“ wirkt im modernen Standarddeutsch jedoch künstlich; „vorbereitete Welt“ ist idiomatischer. „in ihren Lebensweisen verdorben worden“ ist zwar möglich, aber schwerfällig; „in ihrem Verhalten verdorben worden“ ist natürliches Deutsch und wahrt den offenen, verhaltensbezogenen Sinn von moribus eorum.
  terminology: Die bewusst rätselhaften Bilder „unerschöpflicher Tisch“ und „unerforschliches Gesetz“ sollten beibehalten werden. „Zeitalter“ ist für saeculum in diesem Zusammenhang eine vertretbare, nicht unnötig spezifizierende Wiedergabe. Die Fußnote kennzeichnet die Schwierigkeit angemessen, sollte aber klar als vorsichtige Sinnangabe formuliert bleiben.
