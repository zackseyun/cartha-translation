  - severity: low
    issue: „in ihren Lebensweisen verdorben worden“
    rationale: Der Plural „Lebensweisen“ ist hier unnötig abstrakt. „in ihrem Verhalten“ gibt den Bereich von moribus idiomatischer wieder und behauptet keinen Handelnden des Verderbens.
