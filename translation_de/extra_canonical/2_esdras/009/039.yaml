lexical_decisions:
- source_word: dimisi cogitatus
  choice: ließ ich die Gedanken los
  rationale: Gibt das lateinische Bild des Loslassens bzw. Aufgebens der Gedanken direkt und zugleich natürlich wieder.
- source_word: in quibus eram cogitans
  choice: in die ich vertieft gewesen war
  rationale: Bewahrt den Bezug auf die zuvor beschäftigenden Gedanken, ohne die im Deutschen schwerfällige Wiederholung „Gedanken, die ich gedacht hatte“.
- source_word: conversus sum ad eam
  choice: wandte mich ihr zu
  rationale: Natürliche und genaue Wiedergabe der körperlichen oder aufmerksamen Hinwendung zu der Frau.
- source_word: dixi ei
  choice: sagte
  rationale: Im Deutschen macht „wandte mich ihr zu und sagte“ den Adressaten bereits eindeutig; ein zusätzliches „zu ihr“ wäre unnötig.
