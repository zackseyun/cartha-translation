  to: Meine Weintraube und meine Pflanzung sollen bewahrt werden, denn mit großer Mühe habe ich sie vollendet. Wenn du aber noch weitere sieben Tage wartest—
  rationale: „Weinstock“ wird quellentreu durch „Weintraube“ ersetzt. Die letzte Verbform wird als natürliches „wartest“ wiedergegeben, ohne den durch intermittere möglichen Sinn eines weiteren Aufschubs unnötig einzuengen. Der Gedankenstrich bleibt, da die vorgelegte Quelle syntaktisch offen endet.
