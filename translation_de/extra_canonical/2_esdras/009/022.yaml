  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: de
  text: Meine Weintraube und meine Pflanzung sollen bewahrt werden, denn mit großer Mühe habe ich sie vollendet. Wenn du aber noch weitere sieben Tage wartest—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruietur
  choice: sollen bewahrt werden
  rationale: Das lateinische Futur Passiv wird im Zusammenhang als Aufforderung beziehungsweise Wunsch zur Bewahrung wiedergegeben; die Formulierung lässt den Bezug auf beide folgenden Satzglieder zu.
- source_word: acinus meus
  choice: mein Weinstock
  rationale: Acinus bezeichnet gewöhnlich eine Beere oder Weintraube, kann hier jedoch bildhaft die eigene Rebe beziehungsweise den Weinstock meinen. „Mein Weinstock“ ist im Deutschen natürlich und passt parallel zu „meine Pflanzung“.
- source_word: plantatio mea
  choice: meine Pflanzung
  rationale: Die konkrete Pflanzenmetapher des lateinischen plantatio bleibt erhalten.
- source_word: cum multo labore
  choice: mit großer Mühe
  rationale: Gibt den erheblichen Aufwand idiomatisch und würdevoll wieder.
- source_word: perfeci haec
  choice: habe ich sie vollendet
  rationale: Perfeci bezeichnet das Zu-Ende-Bringen oder Vollenden. Das Pronomen „sie“ nimmt die beiden zuvor genannten Bilder gemeinsam auf.
- source_word: intermittas
  choice: innehältst
  rationale: Intermittere kann unterbrechen, aussetzen oder eine Pause einlegen bedeuten. „Innehältst“ bewahrt den offenen Sinn, ohne unbegründet „verzögerst“ festzulegen.
- source_word: septem dies alios
  choice: weitere sieben Tage
  rationale: Natürliche deutsche Wiedergabe von „sieben andere/weitere Tage“.
theological_decisions:
- issue: Bildsprache von acinus und plantatio
  choice: „mein Weinstock und meine Pflanzung“
  alternative: „meine Traube und meine Pflanzung“
  rationale: Die organische Bildsprache wird bewahrt, ohne sie ausdrücklich auf eine bestimmte Personengruppe oder Heilsgemeinschaft festzulegen.
- issue: Unabgeschlossener Satz am Versende
  choice: Gedankenstrich beibehalten
  alternative: Satz durch Ergänzung aus dem Folgevers abschließen
  rationale: Die Quelle endet syntaktisch offen; diese Spannung darf nicht durch eine nicht vorliegende Ergänzung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Pflanzenmetaphorik und der offene Satzschluss der lateinischen Vorlage bleiben erhalten; keine konfessionelle Ausdeutung wird hinzugefügt.
