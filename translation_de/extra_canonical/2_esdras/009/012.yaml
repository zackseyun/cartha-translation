  source_fidelity: 'Der Text gibt die lateinische Satzstruktur und den Sinn präzise wieder: Die noch bestehende Möglichkeit zur Umkehr wird missachtet, und die Betroffenen müssen nach dem Tod in der Qual zu einem Erkennen gelangen. „Diese Menschen müssen“ bildet hos oportet idiomatisch und mit der nötigen Hervorhebung ab. Die Ergänzung von „es“ bei „erkennen“ ist im Deutschen erforderlich und wird sachgerecht als kontextuelle Ergänzung kenntlich gemacht.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Raum zur Umkehr offenstand“ bewahrt die Metapher von locus und bleibt zugleich natürlich. Semikolon und Satzrhythmus entsprechen dem gewichtigen Register der Vorlage.
  terminology: „Umkehr“ ist für paenitentia angemessen und konfessionell nicht einengend. „Verachteten“ gibt spreverunt mit dessen bewusster Geringschätzung treffend wieder. „Qual“ gibt cruciamentum ohne unzulässige Konkretisierung wieder. „Erkennen“ hält die offene Bedeutung von cognoscere besser als eine theologisch spezifizierende Umschreibung.
