id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: de
  text: Und solange ihnen noch Raum zur Umkehr offenstand, begriffen sie es nicht, sondern verachteten es; diese Menschen müssen es nach dem Tod in der Qual erkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht beim letzten Verb kein Gegenstand: „diese Menschen müssen nach dem Tod in der Qual erkennen“. Das „es“ ist aus dem Zusammenhang ergänzt.'
    reason: Bewahrt die grammatische Offenheit des lateinischen cognoscere und macht die notwendige deutsche Ergänzung transparent.
lexical_decisions:
- source_word: paenitentiae locus
  choice: Raum zur Umkehr
  rationale: Gibt die räumliche Metapher von locus natürlich wieder und versteht paenitentia als Umkehr beziehungsweise Reue, ohne den Ausdruck sakramental einzuengen.
- source_word: spreverunt
  choice: verachteten
  rationale: Bewahrt die starke Bedeutung bewusster Geringschätzung und geht über ein bloßes Ablehnen hinaus.
- source_word: hos oportet
  choice: diese Menschen müssen
  rationale: Gibt hos als hervorgehobenen Akkusativ beim Infinitiv und oportet als Notwendigkeit wieder; „diese Menschen“ ist im Deutschen klarer als das substantivierte „diese“.
- source_word: in cruciamento
  choice: in der Qual
  rationale: Entspricht dem Singular und bezeichnet einen Zustand schmerzhafter Pein, ohne nähere Art oder Dauer hinzuzufügen.
- source_word: cognoscere
  choice: erkennen
  rationale: Erfasst das nachträgliche, erfahrungsbezogene Erkennen; das im Lateinischen unausgesprochene Objekt wird im Deutschen durch „es“ aus dem Zusammenhang aufgenommen.
theological_decisions:
- issue: Gegenstand des Erkennens nach dem Tod
  choice: Das Objekt bleibt inhaltlich offen und wird nur mit „es“ auf den Zusammenhang bezogen.
  alternative: Ausdrücklich „die Wahrheit“, „ihr Unrecht“ oder „Gottes Gericht“ ergänzen.
  rationale: cognoscere hat im lateinischen Text kein ausgesprochenes Objekt. Eine nähere Bestimmung würde eine theologische Deutung in den Text eintragen.
- issue: Bedeutung von paenitentia
  choice: Umkehr
  alternative: Buße oder Reue
  rationale: „Umkehr“ ist allgemein verständlich und umfasst die Neuorientierung, ohne eine bestimmte kirchliche Bußpraxis vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der zweigliedrigen Argumentation des Lateinischen; das Semikolon verbindet die versäumte Umkehrmöglichkeit mit dem späteren Erkennen, ohne die genaue Art dieses Zusammenhangs weiter auszudeuten.
