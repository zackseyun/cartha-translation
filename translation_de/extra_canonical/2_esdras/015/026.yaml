source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: novit Deus qui peccantin eum, propterea tradet eos in mortem et in occisionem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/026.yaml
  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: de
  text: Gott kennt die, die gegen ihn sündigen; deshalb wird er sie dem Tod und dem Gemetzel ausliefern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: novit
  choice: kennt
  rationale: 'Das lateinische Perfekt von noscere hat hier präsentische Bedeutung: Gott kennt bzw. weiß um die betreffenden Menschen. „Kennt“ bewahrt den unmittelbaren Personenbezug.'
- source_word: qui peccant in eum
  choice: die, die gegen ihn sündigen
  rationale: in mit Akkusativ bezeichnet hier die gegen Gott gerichtete Sünde. Die wiederholte Form „die, die“ ist im modernen Deutsch klar und natürlich.
- source_word: tradet eos
  choice: wird er sie … ausliefern
  rationale: tradere bezeichnet die Übergabe in die Gewalt eines Schicksals oder einer Macht; „ausliefern“ gibt den bedrohlichen gerichtlichen Zusammenhang präzise wieder.
- source_word: in mortem et in occisionem
  choice: dem Tod und dem Gemetzel
  rationale: Die beiden lateinischen Zielangaben werden parallel wiedergegeben. „Gemetzel“ wahrt gegenüber dem allgemeineren „Tod“ die konkrete, gewaltsame Bedeutung von occisio.
theological_decisions:
- issue: Verhältnis von Gottes Wissen und dem folgenden Gericht
  choice: Die Aussage bleibt als Feststellung mit anschließendem „deshalb“ stehen.
  alternative: „Denn Gott kennt …“ als Begründung des vorausgehenden Verses.
  rationale: Im überlieferten lateinischen Wortlaut steht vor novit Deus keine kausale Konjunktion. propterea markiert dagegen ausdrücklich die Folgerung im zweiten Satzteil.
- issue: Bedeutung von „kennt“
  choice: Keine nähere Erklärung im Text
  alternative: „weiß, wer gegen ihn sündigt“
  rationale: „Kennt“ entspricht novit formal und lässt offen, ob besonders Gottes Erkennen, sein Wissen um die Täter oder seine gerichtliche Kenntnis betont ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der knappen Zweiteilung des Lateinischen; „Gemetzel“ hält die Härte des Gerichtswortes fest, ohne sie abzuschwächen.
