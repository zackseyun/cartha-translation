  text: And after this the dragon[a], mindful of its origin, will prevail; and if they turn, conspiring in great force to pursue them[b],
translation:
  language: de
  text: Und danach wird der Drache[a], seiner Herkunft eingedenk, die Oberhand gewinnen; und wenn sie umkehren und sich in großer Stärke verbünden, um sie zu verfolgen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage über den Drachen, der „seiner Herkunft eingedenk“ ist, ist textlich dunkel. Die Übersetzung bewahrt das ungewöhnliche Bild, statt es durch eine glättende Vermutung zu ersetzen.
    reason: textual_variant
  - marker: b
