  terminology: „Drache“, „Herkunft“, „die Oberhand gewinnen“ und „verfolgen“ sind angemessen. „In großer Stärke“ bewahrt den militärisch wirksamen Sinn von virtus, ohne eine moralische Bedeutung von „Tugend“ oder die etwas abstrakte deutsche Wendung „mit großer Macht“ nahezulegen.
