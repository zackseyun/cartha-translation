lexical_decisions:
- source_word: supervalescet
  choice: wird ... die Oberhand gewinnen
  rationale: Gibt das verstärkte praevalere natürlich wieder und bewahrt den zukünftigen, machtpolitischen Sinn.
- source_word: nativitatis memoria suae
  choice: seiner Herkunft eingedenk
  rationale: Bewahrt die ungewöhnliche Verbindung von nativitas und memoria, während „Herkunft“ hier natürlicher und semantisch weiter als „Geburt“ ist.
- source_word: conspirantes
  choice: sich ... verbünden
  rationale: Im militärischen Zusammenhang bezeichnet das Partizip ein gemeinsames Vorgehen bzw. Sich-Zusammenschließen; „verschwören“ würde im heutigen Deutsch unnötig geheime Umtriebe nahelegen.
- source_word: converterint se
  choice: umkehren
  rationale: Gibt die reflexive Wendung idiomatisch wieder, ohne das im Deutschen unnötige „sich selbst“.
- source_word: in virtute magna
  choice: mit großer Macht
  rationale: Bewahrt virtus im Sinn wirksamer Stärke oder Streitmacht und vermeidet eine moralische Lesart wie „Tugend“.
theological_decisions:
- issue: Bezug und Bild des Drachen
  choice: Das dunkle Bild „der Drache, seiner Herkunft eingedenk“ bleibt stehen.
  alternative: Den Drachen oder seine „Herkunft“ durch eine historische bzw. symbolische Deutung ersetzen.
  rationale: Der lateinische Text ist an dieser Stelle dunkel; eine identifizierende Auslegung würde eine nicht ausdrücklich genannte theologische oder historische Deutung in den Haupttext eintragen.
- issue: Subjekt- und Objektbezüge im Bedingungssatz
  choice: Die Pronomen „sie“ werden nicht identifiziert.
  alternative: Bestimmte Völker oder Heere ausdrücklich benennen.
  rationale: Der Vers selbst lässt die Referenten nur aus dem weiteren Kontext erschließen; die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eingedenk“ ist bewusst gehoben, entspricht aber der apokalyptischen Diktion und hält die auffällige lateinische Formulierung knapp zusammen. Das abschließende Komma bleibt erhalten, weil der überlieferte Vers syntaktisch in den folgenden Zusammenhang weiterführt.
