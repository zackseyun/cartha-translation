  source_fidelity: Der Haupttext gibt die lateinische Satzstruktur und die bewusst dunkle Formulierung „draco nativitatis memoria suae“ sachgerecht wieder. „seiner Herkunft eingedenk“ ist eine vertretbare, idiomatische Wiedergabe, ohne die Bildsprache historisch zu identifizieren. „sich ... verbünden“ trifft conspirantes im Kontext eines gemeinschaftlichen militärischen Vorgehens besser als „sich verschwören“. Für in virtute magna ist „in großer Stärke“ im Deutschen jedoch näher am hier gemeinten Aufgebot bzw. der Machtentfaltung als „mit großer Macht“.
