source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: de
  text: Und Völker arabischer Drachen werden mit vielen Streitwagen ausziehen[a]. Ihr Zischen wird über die Erde getragen, sogar noch aus einer Tagesreise Entfernung[b], sodass alle, die es hören, sich fürchten und zittern werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die schwierige lateinische Wendung „Völker arabischer Drachen“ wird hier möglichst eng wiedergegeben. Ob die Darstellung symbolisch, monströs oder ethnografisch gemeint ist, lässt sich allein aus dem lateinischen Text nicht mehr sicher erschließen.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „aus der Entfernung einer Tagesreise“. Gemeint ist, wie weit das Zischen zu hören ist.'
    reason: previous_rendering
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: Völker arabischer Drachen
  rationale: Gibt die schwierige Genitivverbindung möglichst eng wieder, ohne die nicht mehr sicher erschließbare Bildsprache ethnografisch oder symbolisch festzulegen.
- source_word: exient
  choice: werden ... ausziehen
  rationale: Entspricht dem futurischen exient und passt im Zusammenhang mit vielen Streitwagen natürlicher als das allgemeinere „herauskommen“.
- source_word: in curris multis
  choice: mit vielen Streitwagen
  rationale: Currus bezeichnet hier im militärisch-bedrohlichen Zusammenhang am ehesten Streitwagen; „mit“ gibt das instrumentale beziehungsweise begleitende in idiomatisch wieder.
- source_word: sibilatus eorum
  choice: ihr Zischen
  rationale: Bewahrt das akustische, schlangen- oder drachenartige Bild des lateinischen sibilatus.
- source_word: a die itineris
  choice: aus einer Tagesreise Entfernung
  rationale: Dies itineris ist ein Entfernungsmaß. Die Wendung bezeichnet daher die Distanz, aus der das Zischen vernehmbar ist, nicht den Zeitpunkt seines Beginns.
- source_word: timeant et trepidentur
  choice: sich fürchten und zittern werden
  rationale: Gibt die beiden Reaktionen klar und würdig wieder; die ungewöhnliche lateinische Passivform trepidentur wird sinngemäß als intransitives Zittern verstanden.
theological_decisions:
- issue: Deutung der „arabischen Drachen“
  choice: Die rätselhafte Formulierung bleibt im Haupttext wörtlich und offen.
  alternative: Sie als bestimmte Völker, Fabelwesen oder rein symbolische Mächte auslegen.
  rationale: Der lateinische Text allein erlaubt keine sichere Entscheidung; eine Präzisierung würde die echte Mehrdeutigkeit unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die befremdliche Bildsprache bleibt bewusst erhalten. „Zu hören sein“ verdeutlicht idiomatisch, dass sich das Zischen über diese Entfernung hin ausbreitet, ohne den Sinn zeitlich umzudeuten.
