- from: Und Völker arabischer Drachen werden mit vielen Streitwagen[a] ausziehen. Ihr Zischen wird über das Land hin aus einer Tagesreise Entfernung zu hören sein[b], sodass alle, die es hören, sich fürchten und zittern werden.
