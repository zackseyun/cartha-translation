base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: de
  text: 'Wie sie meinen Erwählten bis heute getan haben, so werde ich tun und es ihnen in ihren Gewandbausch zurückzahlen. So spricht der Herr, Gott:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electis meis
  choice: meinen Erwählten
  rationale: Gibt den substantivierten lateinischen Ausdruck natürlich und in seinem theologischen Gewicht wieder.
- source_word: in sinum ipsorum
  choice: in den Gewandbausch
  rationale: Sinus bezeichnet hier den als Tasche dienenden Bausch beziehungsweise die Falte eines Gewandes; diese konkrete Vergeltungsmetapher soll erhalten bleiben.
- source_word: reddam
  choice: zurückzahlen
  rationale: Bringt den Gedanken entsprechender Vergeltung idiomatisch zum Ausdruck, ohne ihn näher festzulegen.
- source_word: haec dicit Dominus Deus
  choice: So spricht der Herr, Gott
  rationale: Bewahrt die Gottesbezeichnungen Dominus und Deus getrennt; der Doppelpunkt des Quelltexts weist auf die anschließende Rede voraus.
theological_decisions:
- issue: Göttliche Vergeltung nach dem Tun der Gegner
  choice: „so werde auch ich ihnen tun und es ihnen … zurückzahlen“
  alternative: „so werde ich handeln und in ihren Schoß vergelten“
  rationale: Die Entsprechung zwischen ihrem Handeln und Gottes Antwort bleibt deutlich; „ihnen“ macht das im lateinischen ipsorum enthaltene Bezugsverhältnis im Deutschen verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Formel „So spricht“ und das Bild des Gewandbauschs bewahren den prophetischen Ton und die konkrete antike Metapher.
