  source_fidelity: Die Grundbedeutung wird getroffen. Jedoch hat das lateinische "in sinum ipsorum" ausdrücklich die Richtung in den Gewandbausch der Betroffenen; dies sollte im Deutschen mit dem Possessivpronomen sichtbar bleiben. Das zusätzlich hervorgehobene „auch ich“ ist im Ausgangstext nicht eigens ausgedrückt und kann entfallen.
  naturalness: „Gewandbausch“ ist als bewusst konkretes, historisch verständliches Bild angemessen. Mit „in ihren Gewandbausch“ ist die Konstruktion zugleich klarer. Die sonstige prophetische Satzfügung bleibt natürlich und würdevoll.
  terminology: „meinen Erwählten“ gibt electis meis treffend wieder. „Der Herr, Gott“ bewahrt die zweigliedrige Gottesbezeichnung des lateinischen Textes. „zurückzahlen“ gibt reddam als Vergeltung wieder, ohne deren Art zusätzlich auszudeuten.
