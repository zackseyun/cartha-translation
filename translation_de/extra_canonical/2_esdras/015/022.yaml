  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: de
  text: Meine rechte Hand wird die Sünder nicht verschonen. Das Schwert wird nicht aufhören, gegen diejenigen vorzugehen, die auf der Erde unschuldiges Blut vergießen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: meine rechte Hand
  rationale: Bewahrt das konkrete Bild des lateinischen Textes und seinen Gerichtston.
- source_word: peccantes
  choice: die Sünder
  rationale: Gibt das substantivisch gebrauchte Partizip knapp und idiomatisch wieder.
- source_word: romphea
  choice: das Schwert
  rationale: Das aus dem Griechischen entlehnte Wort bezeichnet hier die Gerichtswaffe; „Schwert“ ist im Deutschen natürlich und vermeidet eine unbelegte Spezifizierung der Waffenart.
- source_word: effundentes sanguinem innocuum
  choice: die unschuldiges Blut vergießen
  rationale: Entspricht der festen biblischen Wendung für das Töten Unschuldiger.
- source_word: super terram
  choice: auf der Erde
  rationale: Gibt die räumliche Wendung unmittelbar und in modernem Standarddeutsch wieder.
theological_decisions:
- issue: Bezug und Wirkung des Schwertes bei „cessabit ... super“
  choice: das Schwert wird nicht von denen ablassen
  alternative: das Schwert wird über denen nicht zur Ruhe kommen
  rationale: Die gewählte Formulierung stellt das fortdauernde Gericht gegen die Blutvergießer natürlich dar, ohne dessen Art oder zeitlichen Umfang näher festzulegen. Eine Fußnote bewahrt die ungewöhnlichere räumliche Ausdrucksweise des Lateinischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die beiden Gerichtsaussagen bleiben parallel und werden nicht konfessionell oder dogmatisch ausgedeutet.
