id: 2ES.15.33
reference: 2 Esdras 15:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et a territorio Assyriorum subsessor subsedebiteos et consumet unum ex illis, et erit timor et tremor in exercitum illorum et inconstabilitio in regno illorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: de
  text: Und aus dem Gebiet der Assyrer wird ein Angreifer ihnen auflauern und einen von ihnen vernichten. Da werden Furcht und Zittern in ihrem Heer sein und Unbeständigkeit in ihrem Königreich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a territorio Assyriorum
  choice: aus dem Gebiet der Assyrer
  rationale: Gibt Herkunft beziehungsweise Ausgangspunkt des Angreifers natürlich und nah am lateinischen Wortlaut wieder.
- source_word: subsessor subsedebit eos
  choice: ein Angreifer wird ihnen auflauern
  rationale: „Subsessor“ bezeichnet jemanden, der aus einem Hinterhalt angreift; „auflauern“ bewahrt das Bild des verborgenen Wartens. Der fehlerhaft zusammengeschriebene Überlieferungstext wird entsprechend dem erkennbaren lateinischen Satzbau verstanden.
- source_word: consumet unum ex illis
  choice: einen von ihnen vernichten
  rationale: „Vernichten“ trifft hier die gewaltsame Bedeutung von „consumere“ besser als das im Deutschen missverständliche „verzehren“.
- source_word: inconstabilitio
  choice: Unbeständigkeit
  rationale: Bewahrt den seltenen lateinischen Ausdruck für mangelnde Festigkeit oder Stabilität, ohne die Art der politischen Erschütterung näher festzulegen.
- source_word: regno illorum
  choice: ihrem Königreich
  rationale: Entspricht der konkreten politischen Bedeutung von „regnum“ und wahrt den Parallelismus zu „ihrem Heer“.
theological_decisions:
- issue: Identität des Angreifers und des vernichteten Einzelnen
  choice: 'Beide bleiben unbestimmt: „ein Angreifer“ und „einen von ihnen“.'
  alternative: Die Figuren anhand des weiteren apokalyptischen Zusammenhangs näher identifizieren.
  rationale: Der lateinische Vers benennt weder den Angreifer noch die betroffene Einzelperson; eine Präzisierung würde über die Quelle hinausgehen.
- issue: Art der Instabilität im Königreich
  choice: Der allgemeine Ausdruck „Unbeständigkeit“ bleibt stehen.
  alternative: „Aufruhr“, „Zusammenbruch“ oder „politische Unruhe“.
  rationale: Solche Alternativen würden die genuine semantische Offenheit von „inconstabilitio“ unnötig einengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Aussage. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die inhaltliche Abfolge und die unbestimmten Bezüge der lateinischen Vorlage bleiben erhalten.
