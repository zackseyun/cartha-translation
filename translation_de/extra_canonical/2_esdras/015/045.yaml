  text: And those who remain will serve those who terrified her.
translation:
  language: de
  text: Und die, die übrig bleiben, werden denen dienen, die sie in Schrecken versetzt haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subremanserint
  choice: übrig bleiben
  rationale: Gibt das zukünftige Verbleiben eines Restes präzise und natürlich wieder, ohne ausdrücklich ein Überleben zu behaupten.
- source_word: seruient
  choice: werden … dienen
  rationale: Entspricht dem Futur und dem Sinn von servire.
- source_word: his qui eam exteruerunt
  choice: denen, die sie in Schrecken versetzt haben
  rationale: Bewahrt den Bezug von eam auf die zuvor genannte feminine Größe und gibt exterrere als heftiges Erschrecken beziehungsweise Terrorisieren wieder, nicht als Vernichten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „die“ ist idiomatisch und hält die zwei Personengruppen klar auseinander; das feminine Pronomen „sie“ bewahrt den Rückbezug des lateinischen eam.
