review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt subremanserint angemessen als „übrig bleiben“ wieder, ohne den engeren Sinn von „überleben“ festzulegen. „werden … dienen“ entspricht dem futurischen seruient. „die sie in Schrecken versetzt haben“ trifft exteruerunt („in äußersten Schrecken versetzen/erschrecken“) und bewahrt mit „sie“ den femininen Bezug von eam, dessen konkretes Antezedens aus dem vorliegenden Vers allein nicht erneut benannt werden sollte.
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und hat einen angemessen würdevollen biblischen Registerton. Die wiederholte Relativkonstruktion macht die Gegenüberstellung der Zurückbleibenden und ihrer künftigen Herren klar.
  terminology: „Dienen“ ist die sachgerechte, theologisch nicht überladene Wiedergabe von seruire. Die Formulierung „in Schrecken versetzt“ ist gegenüber stärker interpretierenden oder modern-politisch gefärbten Alternativen wie „terrorisiert“ vorzuziehen.
  issues: []
