  yaml_path: translation/extra_canonical/2_esdras/015/039.yaml
  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: de
  text: Und die Winde aus dem Osten werden an Stärke gewinnen und ihn samt der Wolke, die er im Zorn aufsteigen ließ, einschließen.[a] Und der Stern, der dazu bestimmt ist, Vernichtung zu bringen, wird vom Ostwind, vom Südwind[b] und vom Westwind heftig bedrängt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers gehört zu den schwierigsten Stellen des lateinischen Textes in diesem Kapitel. Die Übersetzung gibt nach bestem Ermessen den Sinn wieder, dass kosmische Kräfte eingeschlossen werden und in Unordnung geraten; Satzbau und Bezüge sind jedoch unsicher.
    reason: textual_variant
  - marker: b
    text: 'Andere mögliche Wiedergabe: „… und die Wolke, die er im Zorn aufsteigen ließ, und der Stern, der dazu bestimmt ist, Vernichtung über Osten und Westen zu bringen, werden in Verwirrung geraten.“'
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: werden mächtig werden
  rationale: Gibt die verstärkte Zukunftsaussage des lateinischen Verbs wieder und klingt im prophetischen Zusammenhang würdevoll.
- source_word: recludent
  choice: einschließen
  rationale: Folgt hier dem aus dem Kontext erschlossenen Sinn des schwierigen Verbs; der genaue Bezug und die Syntax bleiben unsicher und werden deshalb in einer Fußnote offengelegt.
- source_word: nubem quam suscitavit in ira
  choice: die Wolke, die er im Zorn aufsteigen ließ
  rationale: Bewahrt das Akkusativobjekt „nubem“ und gibt „suscitavit“ im natürlichen Zusammenhang mit einer Wolke wieder.
- source_word: sidus ad faciendam exteritionem
  choice: der Stern, der dazu bestimmt ist, Vernichtung zu bringen
  rationale: Gibt die Zweckbestimmung der lateinischen Konstruktion verständlich wieder; „exteritionem“ wird als verderbte bzw. nichtklassische Form mit dem Sinn „Vernichtung“ verstanden.
- source_word: violabitur
  choice: wird … heftig bedrängt werden
  rationale: Bewahrt das Passiv und vermittelt einen gewaltsamen Angriff, ohne das ungewöhnliche Bild unnötig zu konkretisieren.
- source_word: ab orientalem notum et occidentem
  choice: vom Ostwind, vom Südwind und vom Westwind
  rationale: Versteht die spätlateinische Konstruktion mit „ab“ als Angabe der wirkenden Kräfte und bezieht „notum“ auf den Südwind.
theological_decisions:
- issue: Bezug von „eum“ sowie Verhältnis von Wolke und Stern
  choice: „ihn“ bleibt ohne erklärende Identifizierung; die Wolke wird als weiteres Objekt von „einschließen“ verstanden, der Stern als Subjekt des folgenden Passivs
  alternative: Wolke und Stern als Subjekte eines gemeinsamen Vorgangs verstehen oder „ihn“ ausdrücklich mit einer zuvor genannten Größe identifizieren
  rationale: Der lateinische Text ist syntaktisch schwierig. Die gewählte Fassung folgt den Kasusformen und wahrt zugleich die echte Unsicherheit durch Fußnote [a], statt eine theologische oder kosmologische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Klang. Die Zukunftsformen und die kosmische Bildsprache bleiben erhalten; die schwer verständliche lateinische Syntax wird lesbar geordnet, ohne ihre Unsicherheit zu verschweigen.
