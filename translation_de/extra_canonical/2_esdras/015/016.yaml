id: 2ES.15.16
reference: 2 Esdras 15:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erit enim constabilitio hominibus, alisalios supervalescentes non curabunt regem suum et principem megestanorum suorum in potentia sua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: de
  text: Denn unter den Menschen wird Unbeständigkeit herrschen. Sie werden einander überwältigen und in ihrer Macht[a] weder auf ihren König noch auf den Obersten ihrer Großen achten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Vertrauen auf ihre Macht“.'
    reason: Die lateinische Wendung in potentia sua kann eine Machtstellung bezeichnen oder ausdrücken, dass sie sich auf ihre eigene Macht verlassen.
lexical_decisions:
- source_word: constabilitio
  choice: Unbeständigkeit
  rationale: Die überlieferte lateinische Form ist auffällig und möglicherweise verderbt. Im Zusammenhang bezeichnet sie einen Zustand gesellschaftlicher Instabilität; „Unbeständigkeit“ folgt diesem Sinn, ohne ihn zu einer konkreteren „Unordnung“ oder „Anarchie“ auszuweiten.
- source_word: alisalios supervalescentes
  choice: Sie werden einander überwältigen
  rationale: Die offenbar zusammengeschriebene bzw. gestörte Form steht für alii alios; supervalescere bezeichnet das Übermächtigwerden oder Überwältigen. Der deutsche Hauptsatz gibt den Vorgang natürlich wieder.
- source_word: non curabunt
  choice: weder … noch … achten
  rationale: curare mit Akkusativ bedeutet hier, sich um jemanden zu kümmern bzw. ihn zu beachten. „Nicht achten“ passt zum Widerstand gegen die genannten Autoritäten.
- source_word: principem megestanorum suorum
  choice: den Obersten ihrer Großen
  rationale: principem ist Singular und regiert den Genitiv Plural megestanorum, eine Latinisierung für Magnaten oder hochgestellte Große. Die Wiedergabe bewahrt die Beziehung zwischen einem einzelnen Obersten und der Gruppe.
- source_word: in potentia sua
  choice: in ihrer Macht
  rationale: Die formnahe Wiedergabe erhält die knappe und syntaktisch mehrdeutige Schlusswendung; sie kann sowohl ihre Machtstellung als auch ihr Vertrauen auf diese Macht bezeichnen.
theological_decisions:
- issue: Beziehung von „in potentia sua“ zum übrigen Satz
  choice: Die Wendung bleibt als „in ihrer Macht“ nahe am lateinischen Wortlaut und beim Nichtachten der Herrscher eingeordnet.
  alternative: „im Vertrauen auf ihre Macht“ oder Anschluss an „einander überwältigen“
  rationale: Der lateinische Satz legt die genaue semantische Beziehung nicht eindeutig fest. Eine ausdrücklich kausale oder psychologische Deutung würde die offene Formulierung unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Macht“ wird vermieden; „der Oberste ihrer Großen“ bewahrt bewusst die singuläre Leitungsfunktion gegenüber der Gruppe der Magnaten.
