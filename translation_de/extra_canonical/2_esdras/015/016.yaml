  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Satzteilung macht die partizipiale lateinische Konstruktion gut lesbar. Die Stellung von „in ihrer Macht“ ist leicht markiert, aber als bewusst knappe, dem Ausgangstext folgende Schlusswendung vertretbar.
  terminology: „König“ und „Obersten ihrer Großen“ bewahren die Singular-Plural-Beziehung von principem megestanorum suorum. „Große“ ist in diesem politischen Kontext eine angemessene Wiedergabe für Magnaten bzw. hochgestellte Würdenträger. Die Fußnote dokumentiert die mögliche modale Nuance von in potentia sua, ohne sie im Haupttext festzulegen.
