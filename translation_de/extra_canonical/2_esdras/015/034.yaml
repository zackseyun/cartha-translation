id: 2ES.15.34
reference: 2 Esdras 15:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce nubs ab oriente et a septentrione usque ad meridianum, et facies illorum horrida valde, plena irae et procellae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/034.yaml
  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: de
  text: Siehe, Wolken vom Osten und vom Norden bis zum Süden; ihr Anblick ist überaus schrecklich, voll Zorn und Sturm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter des lateinischen Ausdrucks.
- source_word: nubs
  choice: Wolken
  rationale: Die Form steht offenbar für »nubes«; der Kontext und das pluralische Pronomen »illorum« sprechen für den Plural.
- source_word: ab oriente et a septentrione usque ad meridianum
  choice: vom Osten und vom Norden bis in den Süden
  rationale: Gibt die Himmelsrichtungen und die durch »usque ad« bezeichnete Erstreckung natürlich und nah am Lateinischen wieder.
- source_word: facies illorum
  choice: ihr Anblick
  rationale: »Facies« bezeichnet hier am ehesten das Erscheinungsbild der Wolken; »Anblick« klingt im Deutschen natürlicher als »Gesicht«.
- source_word: horrida valde
  choice: überaus schrecklich
  rationale: Bewahrt sowohl die starke Intensivierung durch »valde« als auch die furchterregende Wirkung von »horrida«.
- source_word: plena irae et procellae
  choice: voll Zorn und Sturm
  rationale: Eine formnahe Wiedergabe, die die personifizierende und bedrohliche Bildsprache nicht abschwächt.
theological_decisions: []
translation_notes:
  register: Feierlich-prophetischer, zugleich verständlicher Gegenwartsstil. Die Bildsprache bleibt bewusst stark und mehrdeutig; »Zorn« wird weder ausdrücklich Gott noch den Wolken als handelnden Mächten zugeordnet.
