  text: Would I be so zealous against you[a], says the Lord,
translation:
  language: de
  text: Würde ich so gegen dich eifern[a], spricht der Herr,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Würde ich so gegen dich entbrennen?“'
    reason: Die Bedeutungsbreite von zelare umfasst sowohl Eifer als auch leidenschaftlichen Zorn; die Alternative macht die Gerichtsdimension sichtbar, ohne sie im Haupttext festzuschreiben.
lexical_decisions:
- source_word: Numquid
  choice: Würde ich
  rationale: Die einleitende Fragepartikel kennzeichnet hier eine rhetorische Frage; zusammen mit dem folgenden Bedingungszusammenhang wird sie im Deutschen natürlich mit dem Konjunktiv wiedergegeben.
- source_word: sic
  choice: so
  rationale: Bewahrt den Rückbezug auf das geschilderte Gericht und zugleich den Zusammenhang mit der nachfolgenden Begründung.
- source_word: zelabo
  choice: eifern
  rationale: Das Futur von zelare bezeichnet hier leidenschaftlichen, gegen jemanden gerichteten Eifer im Gericht. „Eifersüchtig sein“ würde im heutigen Deutsch leicht Neid oder besitzergreifende Eifersucht nahelegen.
- source_word: te
  choice: gegen dich
  rationale: Das lateinische Singularpronomen wird beibehalten; die Präposition macht die gegen die angesprochene Person gerichtete Bedeutung von zelabo idiomatisch deutlich.
theological_decisions:
- issue: Bedeutung des göttlichen Eifers
  choice: gegen dich eifern
  alternative: auf dich eifersüchtig sein
  rationale: Die gewählte Formulierung wahrt den Gedanken leidenschaftlichen göttlichen Eifers beziehungsweise Zorns im Gericht, ohne moderne Vorstellungen von Neid oder romantischer Eifersucht einzutragen.
- issue: Zeit- und Bedingungsbezug der rhetorischen Frage
  choice: Würde ich
  alternative: Hätte ich … geeifert
  rationale: Der lateinische Futurindikativ zelabo steht als Folgesatz in einem Bedingungszusammenhang. Der deutsche Konjunktiv gibt dessen modale Kraft wieder, ohne die Aussage eigenmächtig vollständig in die Vergangenheit zu verlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Satzform und der Singular der Anrede bleiben erhalten; „eifern“ bewahrt die theologische Spannung des lateinischen zelabo.
