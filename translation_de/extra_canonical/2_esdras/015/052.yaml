  source_fidelity: 'Der Haupttext bildet „Numquid ego sic zelabo te“ angemessen ab: Die rhetorische Frage, „sic“ („so“), die Singularanrede und die gegen die angesprochene Person gerichtete Aussage von „zelabo“ bleiben erhalten. Der Konjunktiv „Würde ich“ ist im übergreifenden bedingenden Zusammenhang vertretbar und entspricht auch der englischen Audit-Fassung.'
