  terminology: „Eifern“ vermeidet die im heutigen Deutsch leicht missverständliche Assoziation von „eifersüchtig“ mit Neid oder Besitzdenken und erhält zugleich die für zelare mögliche Spannung von leidenschaftlichem Eifer und Gerichtszorn. Die Fußnotenalternative ist als mögliche kontextuelle Zuspitzung kenntlich gemacht, nicht als erzwungene Bedeutung.
