  text: merces fornicariae in sinus tuos, propterea redditionem percipies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/055.yaml
  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: de
  text: Der Lohn einer Prostituierten ist in deinem Gewandbausch[a]; darum wirst du Vergeltung empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich Plural: „in deine Gewandfalten“. Lateinisch „sinus“ kann den durch das Gewand gebildeten Bausch bezeichnen, in dem etwas verwahrt wird.'
    reason: Die Anmerkung korrigiert die unzutreffende Bezeichnung der singularischen deutschen Wiedergabe als „wörtlich“ und erläutert das konkrete Bild des lateinischen Ausdrucks.
lexical_decisions:
- source_word: merces fornicariae
  choice: der Lohn einer Prostituierten
  rationale: „fornicariae“ ist Genitiv Singular und bezeichnet eine Prostituierte, nicht abstrakt Prostitution; „merces“ bedeutet Lohn beziehungsweise Entgelt.
- source_word: in sinus tuos
  choice: in deinem Gewandbausch
  rationale: Lateinisch „sinus“ bezeichnet hier wahrscheinlich den durch das Gewand gebildeten Bausch als Ort, an dem Geld getragen oder gesammelt wird. Der lateinische Plural wird im Deutschen idiomatisch singularisch wiedergegeben.
- source_word: redditionem percipies
  choice: du wirst Vergeltung empfangen
  rationale: „redditio“ bezeichnet eine Rückgabe oder entsprechende Gegenleistung und hat im Kontext den Sinn einer vergeltenden Heimzahlung; die Formulierung bewahrt den Zusammenhang mit dem zuvor genannten Lohn.
theological_decisions:
- issue: Art und Urheber der Vergeltung
  choice: Die Vergeltung wird ohne ausdrücklich genannten Handelnden formuliert.
  alternative: Gott wird es dir vergelten.
  rationale: Der lateinische Satz nennt Gott an dieser Stelle nicht ausdrücklich. Eine Ergänzung würde die Aussage theologisch präzisieren, obwohl der Quelltext diese Präzisierung offenlässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gewandbausch“ erhält das konkrete antike Bild, während die Fußnote dessen Bedeutung erläutert; „Vergeltung empfangen“ wahrt die knappe, mahnende Tonlage.
