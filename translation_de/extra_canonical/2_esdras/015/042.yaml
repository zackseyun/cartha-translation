  yaml_path: translation/extra_canonical/2_esdras/015/042.yaml
  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: de
  text: Und sie werden Städte und Mauern niederreißen, Berge und Hügel, Waldbäume und Gras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: werden … niederreißen
  rationale: Gibt das aktive Zerstören natürlich und kräftig wieder und lässt die ungewöhnliche Aufzählung der zerstörten Landschaftsformen stehen.
- source_word: ligna siluarum
  choice: Waldbäume
  rationale: Das lateinische ligna kann Holz oder Bäume bezeichnen; im Zusammenhang der aufgezählten Dinge ist „Waldbäume“ die natürliche konkrete Wiedergabe.
- source_word: fena
  choice: Gras
  rationale: Das lateinische Wort bezeichnet Gras beziehungsweise Heu. Da kein Vorgang des Trocknens oder Erntens genannt ist, passt „Gras“ im Zusammenhang mit der Landschaft am besten.
