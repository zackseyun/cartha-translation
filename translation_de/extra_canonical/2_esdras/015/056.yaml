base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: de
  text: „Wie du mit meinen Erwählten[a] verfahren wirst“, spricht der Herr, „so wird Gott mit dir verfahren und dich an Übel ausliefern.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Wiedergabe lautete: „Deine Städte werden zerschmettert werden, und alle, die dir gehören und auf dem Feld sind, werden durch das Schwert fallen.“ Dieser Wortlaut gehört jedoch zum folgenden Vers.'
    reason: previous_rendering
lexical_decisions:
- source_word: sicut facies … sic faciet
  choice: „Wie du … verfahren wirst, so wird … mit dir verfahren“
  rationale: Die korrespondierenden Futurformen und die Vergeltungsstruktur werden im natürlichen Deutschen ausdrücklich wiedergegeben.
- source_word: electis meis
  choice: „meinen Erwählten“
  rationale: Dies ist die direkte und im biblischen Register geläufige Entsprechung; die Zugehörigkeit durch „meinen“ bleibt erhalten.
- source_word: tradet te in malis
  choice: „dich dem Unheil ausliefern“
  rationale: „Ausliefern“ bildet tradet ab; „Unheil“ gibt den kontextuell wahrscheinlichen Sinn des substantivierten Plurals malis idiomatisch wieder, ohne eine bestimmte Form des Unheils festzulegen.
theological_decisions:
- issue: Wechsel zwischen „Dominus“ und „Deus“
  choice: „spricht der Herr … so wird Gott“
  alternative: Beide Bezeichnungen angleichen
  rationale: Der auffällige Wechsel der Gottesbezeichnungen steht ausdrücklich im lateinischen Ausgangstext und wird nicht stillschweigend eingeebnet.
- issue: Art der vergeltenden Entsprechung
  choice: Die offene Formulierung „wie … so“ beibehalten
  alternative: Die Handlung als Strafe, Rache oder Gericht näher bestimmen
  rationale: Der Ausgangstext beschreibt eine entsprechende Behandlung, benennt aber deren theologischen Charakter nicht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit jemandem verfahren“ wahrt die formale Entsprechung der beiden Handlungen und klingt zugleich natürlich. Die direkte Rede und der Wechsel zwischen „Herr“ und „Gott“ bleiben erhalten.
