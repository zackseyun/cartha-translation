  to: „Wie du mit meinen Erwählten[a] verfahren wirst“, spricht der Herr, „so wird Gott mit dir verfahren und dich an Übel ausliefern.“
  rationale: Die Revision beschränkt sich auf „an Übel“ für lateinisch in malis. Dadurch bleibt die Pluralform erhalten, ohne die Art der widerfahrenden Übel näher festzulegen. Die syntaktische Vergeltungsstruktur, die Zukunftsformen, die Anrede und der Wechsel von Dominus zu Deus bleiben gewahrt. Die vorhandene Fußnote ist korrekt verankert und erläutert sachlich die frühere, versehentlich aus dem Folgevers stammende Wiedergabe.
