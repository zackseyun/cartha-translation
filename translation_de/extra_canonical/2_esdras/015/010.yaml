  text: Behold, my people are being led like a flock to the slaughter. I will no longer allow them to dwell in the land of Egypt,
translation:
  language: de
  text: Siehe, mein Volk wird wie eine Herde zur Schlachtung geführt. Ich werde nicht länger zulassen, dass es im Land Ägypten wohnt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter des lateinischen Ausdrucks.
- source_word: populus meus
  choice: mein Volk
  rationale: Direkte und natürliche Wiedergabe der Besitzbeziehung.
- source_word: quasi grex
  choice: wie eine Herde
  rationale: Gibt den Vergleich genau wieder, ohne die im Kontext naheliegenden Schafe ausdrücklich in den Text einzutragen.
- source_word: ad occisionem ducitur
  choice: wird zur Schlachtung geführt
  rationale: Bewahrt Passivform, Zielrichtung und gewaltsame Bedeutung des Ausgangstextes.
- source_word: iam non patiar
  choice: Ich werde nicht länger zulassen
  rationale: Drückt das Ende der bisherigen Duldung idiomatisch aus; der Zukunftsbezug ergibt sich im Deutschen natürlich aus der Formulierung.
- source_word: illum habitare
  choice: dass es … wohnt
  rationale: Das lateinische Pronomen bezieht sich auf das grammatisch maskuline populus; im Deutschen verlangt das neutrale „Volk“ das Pronomen „es“.
- source_word: in terra Aegypti
  choice: im Land Ägypten
  rationale: Formale und im Deutschen geläufige Wiedergabe der geographischen Bezeichnung.
theological_decisions:
- issue: Identität des Volkes und Bedeutung Ägyptens
  choice: Die allgemeinen Bezeichnungen „mein Volk“ und „Land Ägypten“ bleiben ohne nähere Deutung stehen.
  alternative: Eine historische, symbolische oder eschatologische Identifikation ausdrücklich in den Text aufnehmen.
  rationale: Der Vers selbst legt keine einzelne Auslegung fest; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischem „Siehe“. Das abschließende Komma wurde beibehalten, da der überlieferte Vers syntaktisch in den folgenden Text weiterführt.
