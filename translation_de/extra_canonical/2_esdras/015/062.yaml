revisions:
- from: Deine Kinder werden sie gefangen wegführen und deinen Besitz als Beute nehmen.
  to: Sie werden deine Söhne als Gefangene wegführen und deinen Besitz als Beute nehmen.
  rationale: Die Revision stellt die vom lateinischen „filios“ nahegelegte konkrete Bezeichnung „Söhne“ wieder her und ersetzt die leicht sperrige Konstruktion „werden sie gefangen wegführen“ durch die idiomatische, eindeutige Wendung „als Gefangene wegführen“. Die Aussage zu Besitz und Beute bleibt entsprechend dem überlieferten Fragment und der englischen Audit-Fassung erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:25Z'
review_pass:
  verdict: revise
  source_fidelity: Die Aussage über Gefangennahme und Besitz/Beute wird zutreffend wiedergegeben. Das lateinische „filios tuos“ bezeichnet jedoch ohne einen erkennbaren Kontextgrund zunächst „deine Söhne“; die Verallgemeinerung zu „deine Kinder“ folgt der englischen Audit-Fassung, ist aber gegenüber dem vorliegenden lateinischen Text weniger präzise.
  naturalness: Die Umstellung „Deine Kinder werden sie gefangen wegführen“ ist grammatisch möglich, kann beim ersten Lesen aber kurz den Eindruck erwecken, die Kinder seien das Subjekt. Eine Subjekt-vorangestellte Formulierung ist im modernen Standarddeutsch klarer und natürlicher.
  terminology: „als Gefangene wegführen“ gibt „captiuos ducent“ idiomatisch und vollständig wieder. „Besitz“ ist für „censum“ in diesem Zusammenhang angemessen; „als Beute nehmen“ entspricht der durch die englische Audit-Fassung belegten Ergänzung am Fragmentende.
  issues:
  - severity: medium
    issue: „Kinder“ statt „Söhne“ für „filios“
    rationale: Der lateinische Wortlaut bietet „filios“ und nicht eine geschlechtsübergreifende Bezeichnung. Ohne kontextlichen Anlass sollte die spezifischere Bedeutung „Söhne“ bewahrt werden.
  - severity: low
    issue: Potentiell missverständliche Satzstellung
    rationale: Bei vorangestelltem Objekt und nachgestelltem Subjekt ist die Rollenverteilung zwar grammatisch eindeutig, aber weniger unmittelbar verständlich als eine Subjekt-vorangestellte Fassung.
  revised_text: Sie werden deine Söhne als Gefangene wegführen und deinen Besitz als Beute nehmen.
