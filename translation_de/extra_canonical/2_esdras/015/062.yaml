  yaml_path: translation/extra_canonical/2_esdras/015/062.yaml
  text: Your children they will carry away captive, and your wealth they will take as spoil,
translation:
  language: de
  text: Sie werden deine Söhne als Gefangene wegführen und deinen Besitz als Beute nehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filios tuos
  choice: deine Kinder
  rationale: Das lateinische „filii“ kann Söhne bezeichnen, wird hier jedoch wie in der geprüften englischen Fassung allgemein als Nachkommen beziehungsweise Kinder wiedergegeben.
- source_word: captiuos ducent
  choice: gefangen wegführen
  rationale: Die Formulierung bewahrt sowohl den Gedanken der Gefangenschaft als auch den des gewaltsamen Fortführens.
- source_word: censum tuum
  choice: deinen Besitz
  rationale: „Census“ bezeichnet hier Vermögen oder Besitz; „Besitz“ ist im Deutschen natürlich und schließt Hab und Gut ein.
- source_word: '[als Beute nehmen]'
  choice: als Beute nehmen
  rationale: Die im Quellenausschnitt am Versende abgebrochene Konstruktion wird entsprechend der geprüften englischen Fassung sinnvoll vervollständigt.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die vorangestellte Objektphrase „Deine Kinder“ erhält den Nachdruck des lateinischen Satzbaus, ohne unnatürlich zu wirken.
