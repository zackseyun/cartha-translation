  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: de
  text: Und sie werden einander schlagen und ein gewaltiges Unwetter über die Erde ausgießen[a], ihr Unwetter[b]; und es wird Blut geben, vom Schwert bis an den Bauch des Pferdes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische sidus steht hier und im ganzen Abschnitt im Singular. Meist bedeutet es „Stern“, kann aber auch ein Unwetter oder einen Sturm bezeichnen. Das Verb „ausgießen“ und der Zusammenhang sprechen hier für „Unwetter“; möglich bleibt jedoch auch ein apokalyptisches Bild eines Sterns oder Himmelszeichens.
    reason: lexical_alternative
  - marker: b
    text: 'Oder, wenn sidus als „Stern“ verstanden wird: „einen gewaltigen Stern über die Erde ausgießen, ihren Stern“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: conlident se invicem
  choice: sie werden miteinander zusammenstoßen
  rationale: Gibt den wechselseitigen, gewaltsamen Zusammenprall wieder, ohne das Bild unnötig auf einen bestimmten Kampfvorgang festzulegen.
- source_word: sidus copiosum
  choice: ein gewaltiges Unwetter
  rationale: Sidus kann neben „Stern“ auch ein Unwetter beziehungsweise einen Sturm bezeichnen. Effundent („ausgießen“) und copiosum stützen hier die meteorologische Bedeutung; „gewaltig“ ist in diesem Zusammenhang natürliches Deutsch und vermittelt die große Fülle oder Heftigkeit.
- source_word: effundent
  choice: ausgießen
  rationale: Bewahrt das konkrete Bild des lateinischen Verbs und passt zugleich zur Unwetterdarstellung.
- source_word: erit sanguis a gladio usque ad ventrem equi
  choice: es wird Blut geben, vom Schwert bis an den Bauch des Pferdes
  rationale: Folgt der ungewöhnlichen lateinischen Formulierung eng und ergänzt kein im Ausgangstext fehlendes Verb wie „reichen“ oder „steigen“.
theological_decisions:
- issue: Apokalyptische Bedeutung von sidus
  choice: Unwetter im Haupttext, mit Hinweis auf „Stern“ in der Fußnote
  alternative: Stern beziehungsweise himmlisches Zeichen im Haupttext
  rationale: Der unmittelbare sprachliche Zusammenhang spricht stärker für die meteorologische Nebenbedeutung. Die echte lexikalische Mehrdeutigkeit und das mögliche apokalyptische Sternbild bleiben jedoch ausdrücklich dokumentiert.
- issue: Höhe oder Ausdehnung des Blutes
  choice: Die elliptische Wendung wörtlich offenlassen
  alternative: „Das Blut wird bis an den Bauch des Pferdes reichen“
  rationale: Das Latein sagt lediglich erit sanguis und nennt danach die Spanne „vom Schwert bis zum Bauch des Pferdes“. Eine ausdrücklich beschriebene Bluthöhe wäre eine plausible, aber interpretierende Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wiederholung „ihr Unwetter“ und die elliptische Schlusswendung bleiben erhalten, damit die Härte und Mehrdeutigkeit des lateinischen Textes nicht geglättet werden.
