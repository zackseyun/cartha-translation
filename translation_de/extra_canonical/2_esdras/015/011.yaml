  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: de
  text: Doch werde ich ihn mit mächtiger Hand und erhobenem Arm herausführen, Ägypten wie einst mit einer Plage schlagen[a] und sein ganzes Land verwüsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit Plagen schlagen. Der lateinische Text hat hier den Singular „Plage“, während der Rückblick auf Ägypten an die mehreren Plagen des Exodus erinnern kann.'
    reason: Der lateinische Singular wird im Haupttext wiedergegeben; die Fußnote dokumentiert die im Kontext mögliche kollektive Auffassung.
lexical_decisions:
- source_word: eum
  choice: es
  rationale: Der lateinische Text hat einen maskulinen Singular („ihn“); da der Bezug ohne weiteren Kontext unsicher ist und kollektiv gemeint sein kann, gibt „es“ den möglichen Bezug auf ein Volk wieder, ohne gegen den lateinischen Numerus in den Plural zu wechseln.
- source_word: in manu potenti et brachio excelso
  choice: mit mächtiger Hand und erhobenem Arm
  rationale: Bewahrt die traditionelle Exodus-Bildsprache und gibt „excelso“ natürlich als „erhoben“ wieder.
- source_word: plaga
  choice: mit einer Plage
  rationale: Der lateinische Beleg steht im Singular. Die Übersetzung folgt der überlieferten Form, auch wenn der Exodus-Kontext an mehrere Plagen denken lässt.
- source_word: corrumpam
  choice: verwüsten
  rationale: Im Zusammenhang mit einem ganzen Land bezeichnet „corrumpere“ dessen Verderben beziehungsweise Verheerung; „verwüsten“ ist präzise und idiomatisch, ohne zwingend die vollständige Vernichtung jedes Bestandteils zu behaupten.
theological_decisions:
- issue: Numerus des herausgeführten Objekts
  choice: Singular („es“)
  alternative: Plural („sie“) nach dem kollektiv verstandenen Kontext
  rationale: Die lateinische Quelle liest ausdrücklich „eum“. Die genuine Spannung zwischen grammatischem Singular und möglichem kollektivem Bezug wird nicht stillschweigend zugunsten des englischen Plurals aufgelöst.
- issue: Eine oder mehrere Plagen
  choice: „eine Plage“ im Haupttext
  alternative: „Plagen“ nach dem Exodus-Gesamtgeschehen
  rationale: „plaga“ ist morphologisch Singular. Eine Fußnote weist auf die mögliche kollektive beziehungsweise kontextuelle Deutung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer Exodus-Bildsprache. Der Satzbau bleibt nah an der lateinischen Abfolge, klingt aber natürlich. Der Singular der Quelle wird gegenüber der englischen Konsultationsfassung bewahrt.
