source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeat Aegyptus et fundamenta eius a plaga verberati et mastigati quam inducet Dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: de
  text: Ägypten und seine Grundfesten sollen trauern über die Plage der Schläge und der Geißelung, die der Herr über Ägypten bringen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeat
  choice: sollen trauern
  rationale: Der lateinische Konjunktiv steht hier als auffordernder beziehungsweise ankündigender Ausdruck; die deutsche Form bewahrt den feierlich-prophetischen Ton.
- source_word: fundamenta
  choice: Grundfesten
  rationale: „Grundfesten“ gibt die wörtliche Bedeutung wieder und klingt im apokalyptischen Zusammenhang natürlicher und umfassender als bloß „Fundamente“.
- source_word: plaga
  choice: Plage
  rationale: Das Wort kann einen Schlag oder eine Heimsuchung bezeichnen; „Plage“ passt zur vom Herrn herbeigeführten Katastrophe und lässt die anschließenden Gewaltbegriffe zur Geltung kommen.
- source_word: verberati
  choice: Schläge
  rationale: Die Form bezeichnet hier das Schlagen beziehungsweise eine Folge von Schlägen; „Schläge“ bewahrt die körperliche und gewaltsame Bildsprache.
- source_word: mastigati
  choice: Geißelung
  rationale: Der Ausdruck bezeichnet konkret das Auspeitschen oder Geißeln und soll nicht zum allgemeineren „Züchtigung“ abgeschwächt werden.
- source_word: inducet
  choice: über es bringen wird
  rationale: Die Wendung gibt das Heran- beziehungsweise Herbeiführen einer Plage über Ägypten idiomatisch wieder.
theological_decisions:
- issue: Urheber der angekündigten Plage
  choice: „die der Herr über es bringen wird“
  alternative: „die über es kommen wird“
  rationale: Das lateinische „inducet Dominus“ nennt den Herrn ausdrücklich als handelndes Subjekt; dies wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptisch-prophetischem Klang. Die Häufung körperlicher Gewaltbegriffe wird beibehalten; der Satz wird nicht konfessionell ausgedeutet.
