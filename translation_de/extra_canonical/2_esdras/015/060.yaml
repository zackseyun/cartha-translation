source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: allident ciuitatem otiosam et exterent aliquam portionem terrae tuae et partem gloriae tuae exterminabunt rursum reuertentes a Babylonia subuersa. Et demolita eris illis pro stipula et ipsi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: de
  text: Sie werden die sorglose Stadt angreifen und einen Teil deines Landes verwüsten. Einen Teil deiner Herrlichkeit werden sie vernichten, wenn sie aus dem verwüsteten Babylon wieder zurückkehren. Sie werden dich wie Stoppeln niederreißen, und sie werden für dich wie Feuer sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Text bricht nach „und sie“ ab. Die Worte „werden für dich wie Feuer sein“ folgen der überlieferten englischen Konsultationsfassung; der unvollständige lateinische Ausschnitt allein enthält sie nicht.
    reason: Kennzeichnet transparent, dass der letzte Vergleich im bereitgestellten lateinischen Quellenausschnitt fehlt und nicht als unmittelbar dort belegter Wortlaut ausgegeben werden darf.
lexical_decisions:
- source_word: allident
  choice: angreifen
  rationale: Das Verb bezeichnet ein gewaltsames Schlagen bzw. einen Angriff; „angreifen“ ist im Deutschen natürlich und wahrt den militärischen Zusammenhang.
- source_word: ciuitatem otiosam
  choice: die sorglose Stadt
  rationale: „Otiosam“ kann Untätigkeit, Müßiggang oder unbekümmerte Sorglosigkeit bezeichnen. „Sorglos“ ist hier idiomatischer als „müßig“, ohne die tadelnde Aussage aufzugeben.
- source_word: exterent
  choice: verwüsten
  rationale: Das Verb meint hier, einen Landesteil schwer zu verheeren; „verwüsten“ gibt die Wirkung im Deutschen klar wieder.
- source_word: gloriae tuae
  choice: deiner Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die breite Bedeutung von gloria zwischen Glanz, Ansehen und Pracht, ohne sie auf bloßen Ruhm einzuengen.
- source_word: demolita eris illis pro stipula
  choice: sie werden dich wie Stoppeln niederreißen
  rationale: Die passive lateinische Wendung wird natürlich aktiv wiedergegeben; das Bild der leicht zerstörbaren Stoppeln bleibt erhalten.
theological_decisions:
- issue: Bezug der angeredeten Größe und ihrer „Herrlichkeit“
  choice: Die mehrdeutige Anrede wird nicht näher bestimmt.
  alternative: Die Stadt oder politische Macht ausdrücklich benennen.
  rationale: Der Vers selbst lässt den Bezug nur aus dem größeren Zusammenhang erschließen; eine ausdrückliche Identifizierung würde über den vorgelegten Wortlaut hinausgehen.
- issue: Zeitlicher bzw. begleitender Sinn von „rursum reuertentes“
  choice: „wenn sie … zurückkehren“
  alternative: „wobei sie … zurückkehren“ oder „nachdem sie … zurückgekehrt sind“
  rationale: Die lateinische Partizipialkonstruktion legt das genaue Verhältnis nicht vollständig fest. Die gewählte Form wahrt einen offenen zeitlichen Zusammenhang, ohne eine strenge Abfolge zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer prophetischer Bildsprache. Kurze Sätze entlasten die lange lateinische Periodenstruktur; die personifizierende Anrede und die Bilder von Stoppeln und Feuer bleiben erhalten.
