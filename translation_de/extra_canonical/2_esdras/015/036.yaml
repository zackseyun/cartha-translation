  text: and a man's thigh and a camel's hock[a]. And there will be great fear and trembling upon the earth,
translation:
  language: de
  text: und den Oberschenkel eines Menschen und das Sprunggelenk[a] eines Kamels. Und auf der Erde wird es große Furcht und großes Zittern geben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als Fortsetzung der vorherigen Satzfügung: „und zum Oberschenkel eines Menschen und zum Sprunggelenk eines Kamels“.'
    reason: Die lateinische Akkusativgruppe kann im Zusammenhang elliptisch stehen; die ergänzte Präposition ist möglich, aber im Text nicht ausdrücklich vorhanden.
lexical_decisions:
- source_word: femur hominis
  choice: den Oberschenkel eines Menschen
  rationale: „Femur“ bezeichnet den Oberschenkel beziehungsweise den Oberschenkelknochen; „Oberschenkel“ bewahrt die konkrete Körperteilbezeichnung ohne unnötige anatomische Verengung.
- source_word: suffraginem cameli
  choice: das Sprunggelenk eines Kamels
  rationale: Lateinisch „suffrago“ bezeichnet bei einem Tier das hintere Beingelenk, den Haken beziehungsweise das Sprunggelenk. „Sprunggelenk“ ist im heutigen Deutsch klar und anatomisch passend.
- source_word: timor et tremor multus
  choice: große Furcht und großes Zittern
  rationale: Die Paarung von „timor“ und „tremor“ wird konkret und möglichst formnah wiedergegeben; „groß“ vermittelt die durch „multus“ ausgedrückte Intensität.
- source_word: super terram
  choice: auf der Erde
  rationale: Gibt die räumliche Wendung natürlich wieder, ohne ein zusätzliches Bewegungsverb einzuführen.
