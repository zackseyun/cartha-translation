lexical_decisions:
- source_word: quoniam
  choice: Denn
  rationale: Gibt die begründende Verknüpfung des lateinischen Satzes natürlich und präzise wieder.
- source_word: omnis incredulus
  choice: jeder Ungläubige
  rationale: Bewahrt die umfassende Aussage von omnis und gibt incredulus substantivisch entsprechend dem lateinischen Wortlaut wieder.
- source_word: in incredulitate sua
  choice: in seinem Unglauben
  rationale: Erhält die bewusste Wiederholung des Wortstamms incredulus/incredulitas und die durch sua ausgedrückte persönliche Zuordnung.
- source_word: morietur
  choice: wird … sterben
  rationale: Entspricht dem Futur des lateinischen Verbs mori.
theological_decisions:
- issue: Bedeutungsumfang von incredulus/incredulitas
  choice: Ungläubige/Unglauben
  alternative: Ungehorsame/Ungehorsam oder Untreue
  rationale: Die unmittelbare lateinische Quelle bezeichnet ausdrücklich fehlenden Glauben. Die Übersetzung wahrt diesen Sinn, ohne die Aussage konfessionell näher zu bestimmen.
translation_notes:
  register: Kurzer, würdevoller Standardsatz in modernem Deutsch; die prägnante Wiederholung von „Ungläubige“ und „Unglauben“ bildet die lateinische Wortfigur ab.
