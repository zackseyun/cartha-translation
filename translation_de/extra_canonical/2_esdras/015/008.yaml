id: 2ES.15.8
reference: 2 Esdras 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: de
  text: Ich werde über ihre Freveltaten, die sie gottlos begehen, nicht länger schweigen und nicht länger hinnehmen, was sie zu Unrecht tun. Siehe, unschuldiges und gerechtes Blut schreit zu mir, und die Seelen der Gerechten schreien unablässig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: Freveltaten
  rationale: Das konkrete „Freveltaten“ gibt hier den Plural und den Zusammenhang mit agunt natürlicher wieder als das abstraktere „Gottlosigkeiten“, ohne die religiös-moralische Schwere abzuschwächen.
- source_word: inreligiose agunt
  choice: die sie in Gottlosigkeit begehen
  rationale: „In Gottlosigkeit“ bewahrt den religiös-moralischen Gehalt von inreligiose; „begehen“ passt im Deutschen idiomatisch zu Freveltaten.
- source_word: nec sustinebo
  choice: nicht länger hinnehmen
  rationale: sustinere bezeichnet hier das weitere Dulden bzw. Ertragen ihres ungerechten Handelns; „nicht länger“ führt die zeitliche Aussage von iam non parallel weiter.
- source_word: sanguis innoxius et iustus
  choice: unschuldiges und gerechtes Blut
  rationale: Die beiden lateinischen Adjektive werden formal bewahrt; die personifizierende Aussage, dass das Blut zu Gott schreit, bleibt erhalten.
- source_word: perseveranter
  choice: unablässig
  rationale: Das Adverb bezeichnet ein anhaltendes, nicht nachlassendes Rufen; „unablässig“ ist in diesem Zusammenhang natürlich und würdevoll.
theological_decisions:
- issue: Das Rufen des Blutes und der Seelen zu Gott
  choice: Die Personifikation und die ausdrückliche Nennung der Seelen bleiben unverändert stehen.
  alternative: Das Rufen als bloß bildliche Forderung nach Vergeltung paraphrasieren.
  rationale: Der lateinische Text unterscheidet ausdrücklich zwischen dem rufenden Blut und den rufenden Seelen der Gerechten. Eine erklärende Paraphrase würde die eschatologische und anthropologische Spannung des Textes vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität des lateinischen Textes wird gewahrt, während schwerfällige oder missverständliche Bildungen wie „irreligiös handeln“ vermieden werden.
