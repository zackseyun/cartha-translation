id: 2ES.15.40
reference: 2 Esdras 15:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exaltabuntur nubes magnae et validae plenaeirae et sidus, ut exterant omnem terram et inhabitantes eam, et fundent super omnemaltum et eminentem sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: de
  text: Und große, mächtige, vom Zorn erfüllte Wolken und ein Stern werden sich erheben, um die ganze Erde und ihre Bewohner zu vernichten; und sie werden über jeden hohen und erhabenen Ort einen schrecklichen Stern ausgießen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exaltabuntur
  choice: werden sich erheben
  rationale: Gibt das lateinische Futur Passiv idiomatisch-medial wieder; im Deutschen bezeichnet es natürlich das Aufsteigen bzw. Emporkommen von Wolken und Stern.
- source_word: nubes magnae et validae
  choice: große, mächtige Wolken
  rationale: Bewahrt sowohl die Größe als auch die Stärke bzw. Gewaltigkeit der Wolken in würdigem, natürlichem Deutsch.
- source_word: plenae irae
  choice: vom Zorn erfüllt
  rationale: Entspricht der Genitivfügung und bezieht sich grammatisch auf die femininen Pluralformen nubes/plenae, nicht auf sidus.
- source_word: sidus
  choice: ein Stern
  rationale: Das neutrale Nominativwort steht als weiteres Subjekt neben nubes; die Grundbedeutung »Stern/Gestirn« wird hier mit »Stern« wiedergegeben.
- source_word: exterant
  choice: vernichten
  rationale: Der bereinigte Text ist offenbar orthografisch bzw. textlich schwierig; im Kontext bezeichnet das Verb eine umfassende zerstörerische Wirkung auf Erde und Bewohner.
- source_word: inhabitantes eam
  choice: ihre Bewohner
  rationale: Natürliche deutsche Verdichtung von »diejenigen, die sie bewohnen«, ohne Bedeutungsverlust.
- source_word: fundent
  choice: werden ... ausgießen
  rationale: Bewahrt das konkrete und ungewöhnliche Bild des lateinischen fundere, statt es erklärend abzuschwächen.
- source_word: omnem altum et eminentem
  choice: jeden hohen und erhabenen Ort
  rationale: Das substantivierte bzw. elliptische Latein verlangt im Deutschen eine Ergänzung; »Ort« hält die räumliche Aussage offen.
- source_word: sidus terribile
  choice: einen schrecklichen Stern
  rationale: Formale Wiedergabe der zweiten Sternbezeichnung; die befremdliche apokalyptische Bildsprache bleibt erhalten.
theological_decisions:
- issue: Zuordnung von »plenae irae« und syntaktische Stellung von »sidus«
  choice: Nur die Wolken sind »vom Zorn erfüllt«; »ein Stern« ist ein eigenes, koordiniertes Subjekt.
  alternative: Wolken, die mit Zorn und einem Stern erfüllt sind
  rationale: plenae ist feminin Plural und stimmt mit nubes überein; sidus ist Neutrum Nominativ und kann nicht als von plenae abhängiger Inhalt verstanden werden.
- issue: Identität der beiden Erwähnungen von »sidus«
  choice: Beide werden wörtlich als »Stern« wiedergegeben, ohne ihre Identität oder Verschiedenheit zu erklären.
  alternative: Die zweite Erwähnung als Feuer, Unheil oder Sternenregen deuten
  rationale: Der lateinische Text verwendet dasselbe Nomen, lässt aber das Verhältnis der beiden Vorkommen offen; die Übersetzung soll diese apokalyptische Spannung nicht auflösen.
- issue: Handelndes Subjekt von »fundent«
  choice: Das plurale »sie« bleibt erhalten und kann sich grammatisch auf die zuvor genannten Erscheinungen beziehen.
  alternative: Nur die Wolken werden ausdrücklich als Handelnde genannt.
  rationale: Das lateinische Verb steht im Plural, während die genaue Referenz im Satz nicht vollständig eindeutig ist; eine explizite Festlegung wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Syntax. Die ungewöhnliche Wendung »einen schrecklichen Stern ausgießen« bleibt bewusst stehen, weil sie die markante apokalyptische Bildsprache des lateinischen Textes wiedergibt. Keine Fußnote ist nötig, da die frühere englische Alternative durch die lateinische Kongruenz ausgeschlossen wird.
