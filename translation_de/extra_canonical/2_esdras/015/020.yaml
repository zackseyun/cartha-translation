    issue: Zusätzlicher expliziter Empfänger in „ihnen zurückzugeben“
    rationale: Der lateinische Text lautet „reddere quae dederunt illis“. Das einzige explizite „illis“ steht bei „dederunt“. Die deutsche Fassung setzt mit „ihnen zurückzugeben“ zusätzlich einen Empfänger der Rückgabe und wiederholt ihn dann bei „sie ihnen gegeben haben“. Dadurch wird ein Bezugsverhältnis stärker festgelegt, als es der Wortlaut erlaubt.
