  to: Siehe, ich rufe, spricht Gott, alle Könige der Erde auf, sich in Bewegung zu setzen – die aus dem Norden, dem Süden, dem Osten und dem Südwesten[a] stammen –, sich gegeneinander zu wenden und zurückzugeben, was sie ihnen gegeben haben.
