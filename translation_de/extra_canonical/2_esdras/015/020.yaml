source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: de
  text: Siehe, ich rufe, spricht Gott, alle Könige der Erde auf, sich in Bewegung zu setzen – die aus dem Norden, dem Süden, dem Osten und dem Südwesten[a] stammen –, sich gegeneinander zu wenden und zurückzugeben, was sie ihnen gegeben haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene lateinische Text hat hier wörtlich „Libanon“. Wahrscheinlich ist dies eine Textverderbnis für die Bezeichnung des Südwestwinds; zusammen mit Norden, Süden und Osten ergibt sich eine Aufzählung der vier Himmelsrichtungen.
    reason: textual_variant
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Aufmerksamkeitsruf des lateinischen Textes.
- source_word: convoco ... ad movendum
  choice: ich rufe ... auf, sich in Bewegung zu setzen
  rationale: Gibt sowohl das Zusammenrufen als auch den folgenden Bewegungsimpuls wieder, ohne ein im Lateinischen nicht genanntes Ziel einzuführen.
- source_word: a borea et a noto et ab euro et a libano
  choice: aus dem Norden, dem Süden, dem Osten und dem Südwesten
  rationale: Boreas, Notos und Euros bezeichnen Windrichtungen. Das überlieferte „libano“ ist sehr wahrscheinlich eine Verderbnis von „libo“ für den Südwestwind Lips; die Viererreihe meint somit die vier Himmelsrichtungen. Die lateinische Lesart wird in einer Fußnote offengelegt.
- source_word: ad convertendos in se
  choice: sich gegeneinander zu wenden
  rationale: Das reflexive „in se“ wird im pluralischen Zusammenhang reziprok verstanden; die Formulierung bewahrt den Gedanken gegenseitiger Feindschaft.
- source_word: reddere quae dederunt illis
  choice: ihnen zurückzugeben, was sie ihnen gegeben haben
  rationale: Bleibt bewusst nahe bei der ungewöhnlichen und hinsichtlich der Pronomen mehrdeutigen lateinischen Formulierung, statt sie deutend zu „vergelten“ oder „heimzahlen“ auszubauen.
theological_decisions:
- issue: Göttliche Einberufung der Könige zum Gericht
  choice: Gott ruft die Könige auf, sich gegeneinander zu wenden
  alternative: Gott ruft die Könige lediglich zusammen, ohne ihre gegenseitige Wendung als Teil seines Aufrufs darzustellen
  rationale: Die beiden lateinischen Zweckkonstruktionen hängen grammatisch von „convoco“ ab; die Übersetzung wahrt damit die Spannung zwischen göttlichem Handeln und dem Handeln der Könige.
- issue: Unklare Bezugsverhältnisse in „quae dederunt illis“
  choice: Die Pronomenmehrdeutigkeit bleibt erhalten
  alternative: Explizit bestimmen, wer wem welches Unrecht vergilt
  rationale: Der lateinische Text nennt die beteiligten Gruppen nicht eindeutig genug, um die Referenten ohne interpretativen Zusatz festzulegen.
translation_notes:
  register: Feierlich-prophetischer, zugleich moderner Standarddeutsch-Stil. „Siehe“ erhält den biblischen Warnruf; der übrige Satz ist syntaktisch gegliedert, ohne die Mehrdeutigkeit des Schlusses zu glätten.
