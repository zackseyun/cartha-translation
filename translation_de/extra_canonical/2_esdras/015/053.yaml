    issue: Wiedergabe von dicens super mortem eorum
    rationale: „angesichts ihres Todes geredet“ klingt im Deutschen sperrig und verschiebt das Reden von seinem Gegenstand zu einem bloßen situativen Anlass. „über ihren Tod gesprochen“ ist idiomatisch und näher an super mortem.
  - severity: low
    issue: Terminologie für electos
    rationale: „Erwählten“ ist möglich, doch „Auserwählten“ entspricht im modernen deutschen Bibelregister üblicher dem substantivierten electi und bleibt auslegungsneutral.
