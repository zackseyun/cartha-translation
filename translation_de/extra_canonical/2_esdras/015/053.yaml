  source_fidelity: Die Versgrenze und die offene Syntax des lateinischen irrealen Bedingungssatzes werden gewahrt. „angesichts ihres Todes geredet“ ist jedoch für dicens super mortem eorum zu unbestimmt und im Deutschen nicht idiomatisch genug; „über ihren Tod gesprochen“ gibt die Präposition und den Bezug klarer wieder. „in die Hände geschlagen“ ist eine natürliche Wiedergabe von percussione manuum im Zusammenhang mit exultans.
  naturalness: Die Satzführung ist würdig und modernes Standarddeutsch. Die revidierte Partizipial-/Prädikatsreihe ist flüssig und lässt den satztechnisch erforderlichen Anschluss an Vers 54 offen.
  terminology: „meine Auserwählten“ ist für electos meos im deutschen biblischen Register die geläufige und zugleich theologisch offene Formulierung. Sie fügt keine nähere Gruppenbestimmung hinzu.
  issues:
