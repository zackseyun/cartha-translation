  text: dicit dominus, Nisi occidisses electos meos in omni tempore, exultans percussione manuum et dicens super mortem eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/053.yaml
  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
translation:
  language: de
  text: 'spricht der Herr: »Hättest du meine Auserwählten nicht die ganze Zeit getötet, dabei jubelnd in die Hände geschlagen und über ihren Tod gesprochen'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Gibt die einleitende Redeformel knapp und würdig wieder; das Präsens des lateinischen dicit bleibt erhalten.
- source_word: Nisi occidisses
  choice: Hättest du … nicht getötet
  rationale: Der irreale Bedingungssatz bleibt entsprechend der lateinischen Form offen, weil seine Fortsetzung erst im nächsten Vers folgt.
- source_word: electos meos
  choice: meine Erwählten
  rationale: Formale und theologisch offene Wiedergabe von electos; vermeidet eine nähere Bestimmung der betreffenden Gruppe.
- source_word: in omni tempore
  choice: die ganze Zeit
  rationale: Im Kontext natürlicher als das missverständliche „zu jeder Zeit“ und näher an dem fortdauernden Handeln als „schon immer“.
- source_word: exultans percussione manuum
  choice: dabei jubelnd in die Hände geschlagen
  rationale: Verbindet exultans mit der idiomatischen, im Kontext schadenfrohen Geste des Händeklatschens, ohne die Freude ausdrücklich als Schadenfreude auszudeuten.
- source_word: dicens super mortem eorum
  choice: angesichts ihres Todes geredet
  rationale: Bewahrt die Unbestimmtheit dessen, was gesagt wurde; super mortem bezeichnet hier das Reden anlässlich bzw. angesichts ihres Todes.
theological_decisions:
- issue: Bezeichnung der Getöteten
  choice: meine Erwählten
  alternative: meine Auserwählten
  rationale: „Erwählte“ gibt electos direkt wieder, ohne zusätzliche konfessionelle Assoziationen stärker als nötig hervorzurufen.
- issue: Unvollständiger Bedingungssatz am Versende
  choice: Der Satz bleibt ohne Abschlusszeichen offen
  alternative: Den Folgesatz aus Vers 54 ergänzen oder den Satz selbstständig abrunden
  rationale: Der lateinische Vers endet syntaktisch offen. Die Fortsetzung darf nicht aus dem folgenden Vers vorweggenommen oder interpretierend ergänzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede beginnt großgeschrieben; der Vers bleibt bewusst syntaktisch offen, da der lateinische Bedingungssatz erst im Folgevers weitergeführt wird.
