lexical_decisions:
- source_word: pratorum
  choice: ihre Weiden
  rationale: Der überlieferte Text setzt mit einem Genitiv Plural ein, der syntaktisch offenbar zum vorhergehenden, hier nicht mitgelieferten Kontext gehört. Nach der geprüften englischen Konsultationsfassung wird der gemeinte Objektbezug mit dem Possessivpronomen aufgenommen; „Weiden“ gibt prata natürlich wieder.
- source_word: frumenta
  choice: ihr Getreide
  rationale: Frumenta bezeichnet hier Getreide beziehungsweise Feldfrüchte. „Getreide“ ist im Deutschen knapp und kontextgerecht.
- source_word: transibunt constanter
  choice: sie werden unbeirrt weiterziehen
  rationale: Transibunt beschreibt das Weiter- oder Vorüberziehen; constanter bezeichnet dabei Standhaftigkeit beziehungsweise unbeirrtes Vorgehen. Die Formulierung wahrt beides in natürlichem Deutsch.
- source_word: usque
  choice: bis
  rationale: Usque eröffnet eine noch nicht abgeschlossene Ziel- oder Grenzangabe. „Bis“ bewahrt den fragmentarischen Anschluss an den folgenden Vers beziehungsweise Textabschnitt.
