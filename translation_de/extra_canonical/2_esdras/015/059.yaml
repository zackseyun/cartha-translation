  text: As chief you will come[a], and again you will receive evils. And in passing
translation:
  language: de
  text: Als Erste wirst du kommen und erneut Unheil erfahren. Und beim Vorüberziehen[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im folgenden Vers fortgesetzt.
    reason: Das überlieferte Versende „Et in transitu“ ist syntaktisch unvollständig und gehört inhaltlich zum anschließenden Text.
lexical_decisions:
- source_word: primaria
  choice: als Erste
  rationale: Das feminine Singularadjektiv wird prädikativ wiedergegeben und bezieht sich wahrscheinlich auf die zuvor angeredete weiblich gedachte Größe oder Stadt. „Als Oberste“ wäre ebenfalls möglich, klänge im Deutschen hier jedoch weniger natürlich.
- source_word: uenies
  choice: wirst du kommen
  rationale: Gibt das Futur der zweiten Person Singular direkt wieder.
- source_word: rursum accipies mala
  choice: wirst du erneut Unheil erfahren
  rationale: Lateinisch wörtlich „wirst du wiederum Übel empfangen“; „Unheil erfahren“ ist im modernen Deutsch natürlich und bewahrt den Sinn widerfahrender schlimmer Dinge.
- source_word: Et in transitu
  choice: Und beim Vorüberziehen
  rationale: Die unvollständige Wendung wird bewusst als Satzfragment erhalten, da ihr syntaktischer Anschluss offenbar im folgenden Vers steht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das abrupte Versende bleibt entsprechend der lateinischen Vorlage erhalten; das feminine „Erste“ bewahrt die grammatische Form von primaria.
