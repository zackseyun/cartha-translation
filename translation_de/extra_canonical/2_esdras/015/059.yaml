  source_fidelity: 'Die Übersetzung bildet den vorliegenden lateinischen Text vollständig und in Versreihenfolge ab: „primaria“ wird angemessen als feminine Anrede „Als Erste“ wiedergegeben, „uenies“ als Futur, und „rursum accipies mala“ als erneutes Erleiden von Unheil. Das abschließende, im Latein fragmentarische „Et in transitu“ bleibt bewusst unabgeschlossen erhalten.'
  naturalness: „Als Erste wirst du kommen und erneut Unheil erfahren“ ist modernes, verständliches Standarddeutsch bei angemessen würdigem Register. „Und beim Vorüberziehen“ bewahrt den absichtlich offenen Anschluss natürlich genug.
  terminology: „Unheil erfahren“ ist eine idiomatische, dem Kontext angemessene Wiedergabe von „mala“ und vermeidet eine unnötig enge Festlegung. Die feminine Form „Erste“ folgt der Form von „primaria“, ohne die referierte Größe weiter zu bestimmen.
