source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: de
  text: Denn schon ist Unheil über die Welt gekommen, und ihr werdet darin bleiben; denn Gott wird euch nicht retten, weil ihr gegen ihn gesündigt habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: Unheil
  rationale: Das substantivierte lateinische Neutrum im Plural bezeichnet hier hereinbrechende Übel beziehungsweise Notlagen. Das deutsche Kollektivwort „Unheil“ gibt den Zusammenhang natürlich und würdig wieder, ohne es auf moralisch böse Taten zu verengen.
- source_word: orbem terrarum
  choice: die Welt
  rationale: Die feste lateinische Wendung bezeichnet die bewohnte Welt beziehungsweise den Erdkreis; „die Welt“ ist die natürliche moderne Entsprechung.
- source_word: manebitis in illis
  choice: ihr werdet darin bleiben
  rationale: Die Formulierung bewahrt das Bild des Verbleibens in dem bereits gekommenen Unheil und vermeidet eine erklärende Erweiterung.
- source_word: liberabit
  choice: retten
  rationale: „Retten“ gibt die Befreiung aus dem hereinbrechenden Unheil in klarem modernem Deutsch wieder.
- source_word: peccastis in eum
  choice: ihr gegen ihn gesündigt habt
  rationale: Das lateinische „in eum“ markiert die gegen Gott gerichtete Sünde; „gegen ihn sündigen“ bildet dies im Deutschen unmittelbar ab.
theological_decisions:
- issue: Gottes ausbleibende Rettung als Folge der Sünde
  choice: „Gott wird euch nicht retten, weil ihr gegen ihn gesündigt habt“
  alternative: „Gott wird euch nicht befreien, denn ihr habt gegen ihn gesündigt“
  rationale: Die kausale und gerichtliche Aussage des lateinischen Textes wird ohne Abschwächung oder dogmatische Ergänzung bewahrt.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die zweimalige Verwendung von „denn“ folgt der argumentativen Struktur des lateinischen Satzes; das kollektive „Unheil“ vermeidet die im Deutschen schwerfällige Wendung „Übel“.
