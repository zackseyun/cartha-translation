  source_fidelity: 'Der Entwurf gibt den lateinischen Satz vollständig und sachgerecht wieder: „mala“ als hereinbrechendes Unheil, „super orbem terrarum“ als „über die Welt“, „manebitis in illis“ als Verbleiben darin sowie die begründete ausbleibende Rettung aufgrund der gegen Gott gerichteten Sünde. Die Kausalstruktur mit zweimaligem „denn“ bzw. „weil“ ist treffend abgebildet.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit angemessen würdig-prophetischem Register. „Denn schon ist Unheil über die Welt gekommen“ ist leicht gehoben, aber natürlich und dem Kontext angemessen. Das Kollektivwort „Unheil“ funktioniert idiomatisch; „darin“ nimmt es sinnvoll auf.
