source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter quod superposuit iniquitas omnem terram et adimpletae sunt operationes eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/006.yaml
  text: because iniquity has spread over the whole earth[a], and their deeds have been filled up.
translation:
  language: de
  text: Denn die Ungerechtigkeit hat sich über die ganze Erde gelegt, und ihre Taten sind zum vollen Maß gelangt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und ihre Taten sind erfüllt worden“ oder „voll geworden“.'
    reason: Das lateinische adimpletae sunt kann sowohl das Erfülltwerden als auch das Erreichen der Fülle bezeichnen.
lexical_decisions:
- source_word: propter quod
  choice: Denn
  rationale: Gibt den begründenden Anschluss an den vorangehenden Zusammenhang natürlich und knapp wieder.
- source_word: superposuit iniquitas omnem terram
  choice: die Ungerechtigkeit hat sich über die ganze Erde gelegt
  rationale: Bewahrt das Bild, dass die Ungerechtigkeit die gesamte Erde überlagert bzw. bedeckt, ohne das lateinische Verb unnatürlich wörtlich abzubilden.
- source_word: operationes eorum
  choice: ihre Taten
  rationale: Entspricht dem neutralen operationes; die nicht im zugrunde gelegten Text stehende Wertung „schädliche“ wird nicht ergänzt.
- source_word: adimpletae sunt
  choice: sind zum vollen Maß gelangt
  rationale: Gibt das Vollwerden bzw. Erreichen der Fülle idiomatisch wieder und bewahrt zugleich die Vorstellung eines voll gewordenen Maßes.
theological_decisions:
- issue: Bedeutung des Vollwerdens der Taten
  choice: sind zum vollen Maß gelangt
  alternative: sind erfüllt bzw. vollendet worden
  rationale: Die Formulierung lässt offen, ob die Taten als vollzählig, ausgereift oder zum Gericht reif gedacht sind, und legt keine zusätzliche Lehrdeutung fest.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Das Bild der die Erde überziehenden Ungerechtigkeit und die Mehrdeutigkeit von adimpletae sunt bleiben erhalten.
