id: 2ES.15.30
reference: 2 Esdras 15:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Carmonii insanientes in ira exient de silva et advenient in virtute magna et constabunt in pugnam cum illis et vastabunt portionem terrae Assyriorum in dentibus suis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: de
  text: Die Karmonier[a] werden vor Zorn rasend aus dem Wald hervorziehen. Mit großer Macht werden sie anrücken, sich ihnen zum Kampf stellen und mit ihren Zähnen einen Teil des Landes der Assyrer verwüsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Namensform lautet „Carmonii“; möglicherweise sind die Karmanier aus Karmanien gemeint.
    reason: Die überlieferte Namensform wird bewahrt, während die wahrscheinliche historische Identifizierung kenntlich gemacht wird.
lexical_decisions:
- source_word: Carmonii
  choice: die Karmonier
  rationale: Die Namensform des lateinischen Textes wird möglichst direkt wiedergegeben. Eine Identifizierung mit den Karmaniern aus Karmanien ist möglich, aber nicht so sicher, dass sie ohne Hinweis in den Haupttext aufgenommen werden sollte.
- source_word: insanientes in ira
  choice: vor Zorn rasend
  rationale: Gibt sowohl den heftigen Zorn als auch das außer-sich-geratene Verhalten des Partizips wieder.
- source_word: de silva
  choice: aus dem Wald
  rationale: Direkte und natürliche Wiedergabe der lateinischen Ortsangabe.
- source_word: in virtute magna
  choice: mit großer Macht
  rationale: Virtus bezeichnet hier im militärischen Zusammenhang eher Macht beziehungsweise Streitkraft als moralische Tugend.
- source_word: constabunt in pugnam cum illis
  choice: sich ihnen zum Kampf stellen
  rationale: Natürliche deutsche Wiedergabe des militärischen Gegenübertretens, ohne den unklaren Bezug von illis aufzulösen.
- source_word: in dentibus suis
  choice: mit ihren Zähnen
  rationale: Das auffällige und möglicherweise bildhafte Ausdrucksmittel des Quelltexts bleibt unverändert erhalten.
theological_decisions:
- issue: Bezug des Pronomens illis
  choice: ihnen
  alternative: den zuvor genannten Gegnern
  rationale: Der Vers selbst benennt den Bezug nicht ausdrücklich; die Übersetzung bewahrt diese textliche Offenheit.
- issue: Bildsprache der Zähne
  choice: wörtlich „mit ihren Zähnen“
  alternative: mit ihrer Gewalt / gierig
  rationale: Eine Deutung als bloßes Bild für Gewalt oder Gier würde die ungewöhnliche apokalyptische Formulierung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige apokalyptische Bildsprache bleibt erhalten; lange lateinische Satzreihen werden für bessere Verständlichkeit in zwei deutsche Sätze gegliedert.
