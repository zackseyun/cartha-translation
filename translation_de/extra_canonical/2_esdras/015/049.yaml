  text: 'deus: Inmittam tibi mala, uiduitatem, paupertatem et famem et gladium et pestem ad deuastandas domus tuas, ad uiolationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: de
  text: 'Gott: »Ich werde Unheil über dich bringen: Witwenschaft, Armut, Hunger, Schwert und Seuche, zur Verwüstung deiner Häuser, zur Verletzung[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Gewalttat«, »zur Schädigung« oder »zur Entweihung«. Das lateinische violatio ist hier in seiner genauen Nuance unsicher; die mit »zur« beginnende Wendung wird im folgenden Vers fortgeführt.'
    reason: Die Anmerkung bewahrt die Bedeutungsbreite von violatio, ohne die Übersetzung auf eine einzelne, enger gefasste Deutung festzulegen, und erklärt die syntaktische Unvollständigkeit am Versende.
lexical_decisions:
- source_word: mala
  choice: Unheil
  rationale: Der kollektive Singular gibt die angekündigten schweren Übel natürlich wieder, ohne sie auf Krankheiten oder einzelne Plagen zu verengen.
- source_word: uiduitatem
  choice: Witwenschaft
  rationale: Entspricht dem abstrakten lateinischen Substantiv und bezeichnet den Zustand, den Ehepartner verloren zu haben.
- source_word: gladium
  choice: Schwert
  rationale: Bewahrt das konkrete Bild, das hier zugleich für kriegerische Gewalt stehen kann.
- source_word: pestem
  choice: Pest
  rationale: Eine knappe, geläufige Wiedergabe für eine tödliche Seuche.
- source_word: ad deuastandas domus tuas
  choice: zur Verwüstung deiner Häuser
  rationale: Gibt die lateinische Zweckkonstruktion mit ad und Gerundiv wieder und lässt sie parallel zur folgenden ad-Phrase stehen.
- source_word: ad uiolationem
  choice: zur Schändung
  rationale: Bewahrt den Gedanken gewaltsamer Verletzung und die zweite, eigenständige ad-Zweckangabe; die Bedeutungsbreite wird in der Fußnote offengelegt.
theological_decisions:
- issue: Gott als Sprecher und Urheber des angekündigten Unheils
  choice: Die direkte göttliche Ankündigung wird unverändert beibehalten.
  alternative: Das Unheil lediglich als von Gott zugelassen oder vorausgesagt darzustellen.
  rationale: Inmittam ist aktiv und bedeutet, dass der Sprecher das Unheil senden beziehungsweise über die Angeredete bringen wird; eine Abschwächung wäre eine theologische Auslegung statt Übersetzung.
- issue: Verhältnis der beiden mit ad eingeleiteten Wendungen
  choice: Beide werden als parallele Ziel- beziehungsweise Folgeangaben wiedergegeben.
  alternative: Die zweite Wendung als Art und Weise der Verwüstung zu verstehen, etwa „mit Zerstörung“.
  rationale: Die Wiederholung von ad spricht für eine koordinierte Struktur; diese bleibt zudem offen für die Fortsetzung im folgenden Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Unheilsformen und die parallelen Zweckangaben des Lateinischen bleiben erhalten. Der Doppelpunkt nach „Gott“ folgt der knappen Sprecherangabe der Quelle; die durch die Versgrenze entstehende Unvollständigkeit wird nicht künstlich geglättet.
