source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ignem et grandinem et rompheas volantes et aquas multas, ut etiam impleantur omnes campi et omnes rivi a plenitudine aquarum illarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: de
  text: Feuer und Hagel und fliegende Schwerter[a] und große Wassermassen, sodass sogar[b] alle Felder und alle Bäche von der Fülle jener Wassermassen erfüllt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fliegende große Schwerter“.'
    reason: Das lateinische romphaea kann eine große Schwertwaffe bezeichnen, wird im biblisch-apokalyptischen Sprachgebrauch jedoch oft allgemein im Sinn von „Schwert“ verwendet.
  - marker: b
    text: 'Oder: „auch“.'
    reason: Das lateinische etiam kann je nach Betonung sowohl „sogar“ als auch „auch“ bedeuten.
lexical_decisions:
- source_word: rompheas volantes
  choice: fliegende Schwerter
  rationale: „Schwerter“ gibt die in biblisch-apokalyptischem Latein übliche Bedeutung von romphaea natürlich wieder; eine technisch engere Waffenbezeichnung wäre hier unnötig spezifisch. Das Partizip volantes wird direkt mit „fliegende“ wiedergegeben.
- source_word: aquas multas
  choice: gewaltige Wassermassen
  rationale: Das lateinische Pluralbild bezeichnet eine große Menge Wasser. „Gewaltige Wassermassen“ klingt im Deutschen natürlich und bewahrt die apokalyptische Wucht besser als das unübliche „viele Wasser“.
- source_word: omnes rivi
  choice: alle Flüsse
  rationale: rivi kann Wasserläufe, Bäche oder Flüsse bezeichnen. „Flüsse“ entspricht hier dem Umfang der geschilderten Überschwemmung, ohne die Aussage unnötig einzuengen.
- source_word: a plenitudine aquarum illarum
  choice: von der Fülle jener Wassermassen
  rationale: Die Formulierung hält sowohl plenitudo („Fülle“) als auch den rückverweisenden Demonstrativbezug illarum („jener“) sichtbar.
theological_decisions:
- issue: Funktion von etiam in der Flutbeschreibung
  choice: sogar alle Felder
  alternative: auch alle Felder
  rationale: '„sogar“ bewahrt den emphatischen Sinn von etiam: Nicht nur die Wasserläufe, sondern selbst die Felder werden von den Wassermassen erfüllt. Die Fußnote hält die weniger emphatische Lesemöglichkeit offen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Reihung durch „und“. Die anschauliche apokalyptische Sprache bleibt kräftig, ohne altertümliche oder waffentechnisch überpräzise Begriffe.
