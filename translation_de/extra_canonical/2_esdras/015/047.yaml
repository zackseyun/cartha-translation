id: 2ES.15.47
reference: 2 Esdras 15:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: de
  text: Weh dir, du Elende! Denn du hast dich ihr gleichgemacht und deine Töchter für die Unzucht geschmückt, um deinen Liebhabern zu gefallen und dich ihrer zu rühmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misera
  choice: du Elende
  rationale: Gibt die feminine Anrede und den klagend-gerichtlichen Ton von „Vae tibi“ würdig und verständlich wieder.
- source_word: adsimilasti ei
  choice: du hast dich ihr gleichgemacht
  rationale: Bewahrt den femininen Rückverweis „ei“ und legt nicht näher fest, worin die Angleichung besteht.
- source_word: in fornicatione
  choice: für die Unzucht
  rationale: „Unzucht“ wahrt die sexuelle und moralische Bedeutung von „fornicatio“, ohne den Sinn unnötig auf gewerbsmäßige Prostitution zu verengen.
- source_word: gloriandum in amatoribus
  choice: dich ihrer zu rühmen
  rationale: Gibt das Sich-Rühmen mit beziehungsweise wegen der Liebhaber idiomatisch wieder und bewahrt den negativen Kontext.
theological_decisions:
- issue: Bildhafte weibliche Anrede und moralische Anklage
  choice: Die feminine Personifikation und die offene Anklage bleiben erhalten.
  alternative: Die Angeredete als bestimmte Stadt oder Gemeinschaft ausdrücklich benennen.
  rationale: Der Vers selbst nennt die Identität der Angeredeten nicht; eine ausdrückliche Festlegung würde Kontext in den Wortlaut eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der isoliert vorangestellte Genitiv „eius“ gehört syntaktisch offenbar zum vorausgehenden Zusammenhang und wurde nicht in diesen Vers aufgenommen. Die parallelen Infinitivkonstruktionen des Lateinischen werden natürlich mit „um … zu“ wiedergegeben.
