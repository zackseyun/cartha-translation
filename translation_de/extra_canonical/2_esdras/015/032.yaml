    issue: „angesichts ihrer Stärke“ bildet die kausale Funktion von in virtute illorum nicht hinreichend deutlich ab.
    rationale: In diesem Zusammenhang bezeichnet die Wendung den Grund für ihr Verstummen bzw. ihre Reaktion. „Wegen ihrer Macht“ wahrt dies ohne die unzutreffende instrumentale Nuance eines passiven „durch ihre Macht“.
  - severity: low
    issue: „sie werden sich zur Flucht wenden“ ist eine wenig idiomatische Wiedergabe von convertent pedes suos in fugam.
    rationale: Die lateinische Wendung bedeutet, dass sie fliehen. „Die Flucht ergreifen“ ist im modernen Standarddeutsch natürlich und sinngetreu.
