  verdict: revise
  source_fidelity: Die aktive Zukunftsform „verstummen“ gibt silebunt korrekt wieder. Für in virtute illorum ist die kausale Wiedergabe „wegen ihrer Macht“ dem bloß situationsbezogenen „angesichts ihrer Stärke“ näher; sie entspricht auch dem bereinigten englischen Audit-Trail („because of their strength“).
  naturalness: „Sie werden die Flucht ergreifen“ ist modernes, idiomatisches Deutsch und gibt das feste lateinische Bild convertent pedes suos in fugam klar wieder. „Sich zur Flucht wenden“ ist verständlich, klingt jedoch weniger natürlich und schwächt die entschiedene Bewegung ab.
  terminology: „Macht“ ist hier für virtus in einem militärisch-bedrohlichen Kontext idiomatisch und semantisch passend. Die Pronomenreferenz bleibt, wie im Lateinischen, kontextabhängig und wird nicht künstlich präzisiert.
  issues:
