  text: then these will be thrown into confusion and fall silent because of their strength[a], and they will turn their feet to flight.
translation:
  language: de
  text: Dann werden diese in Verwirrung geraten und wegen ihrer Macht verstummen, und sie werden die Flucht ergreifen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turbabuntur
  choice: werden in Verwirrung geraten
  rationale: Gibt das zukünftige Passiv von „turbare“ natürlich wieder, ohne die Wirkung unnötig zu verstärken.
- source_word: silebunt
  choice: verstummen
  rationale: 'Bewahrt den aktiven Sinn des lateinischen Futurs: Sie werden still beziehungsweise hören auf zu reden; ein passives „zum Schweigen gebracht werden“ wäre grammatisch weniger genau.'
- source_word: in virtute illorum
  choice: angesichts ihrer Stärke
  rationale: Drückt den durch die Stärke ausgelösten Schrecken idiomatisch aus und vermeidet die irreführend instrumentale Wiedergabe „durch ihre Stärke“.
- source_word: convertent pedes suos in fugam
  choice: sie werden sich zur Flucht wenden
  rationale: Eine natürliche deutsche Wiedergabe der lateinischen Wendung; das Bild der gewendeten Füße wird in seinem Sinn erhalten, ohne im Deutschen hölzern zu wirken.
