  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: de
  text: 'Und die, die jenen Zorn sehen, werden erschaudern[a], und Zittern wird sie ergreifen. Und danach werden zahlreiche Gewitterwolken aufziehen.


    [a] Eine frühere Wiedergabe lautete: »Und auf der Erde wird große Furcht und großes Zittern herrschen; alle, die jenen Zorn sehen, werden erschaudern, und Zittern wird sie ergreifen. Danach werden mächtige Gewitterwolken aufziehen.« Der einleitende Satz gehört im zugrunde liegenden lateinischen Text jedoch zum Ende von Vers 36.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Wiedergabe lautete: »Und auf der Erde wird große Furcht und großes Zittern herrschen; alle, die jenen Zorn sehen, werden erschaudern, und Zittern wird sie ergreifen. Danach werden mächtige Gewitterwolken aufziehen.« Der einleitende Satz gehört im zugrunde liegenden lateinischen Text jedoch zum Ende von Vers 36.'
    reason: previous_rendering
lexical_decisions:
- source_word: horrebunt
  choice: werden erschaudern
  rationale: Gibt das körperlich-emotionale Erschrecken von »horrebunt« natürlich und würdig wieder.
- source_word: iram illam
  choice: jenen Zorn
  rationale: Bewahrt das Demonstrativpronomen »illam« und den Rückbezug auf den zuvor genannten Zorn.
- source_word: tremor adprehendet illos
  choice: Zittern wird sie ergreifen
  rationale: Folgt der Bildsprache und Satzstruktur des Lateinischen eng, ohne im Deutschen unnatürlich zu wirken.
- source_word: nimbi copiosi
  choice: dichte Gewitterwolken
  rationale: »nimbi« bezeichnet regen- beziehungsweise sturmbringende Wolken; »dichte« vermittelt die Fülle von »copiosi« und vermeidet »mächtig«, das besser für »validae« in Vers 40 reserviert bleibt.
- source_word: movebuntur
  choice: werden … aufziehen
  rationale: Das idiomatische deutsche »Wolken ziehen auf« gibt die einsetzende Bewegung der Wolken natürlicher wieder als das wörtliche »werden bewegt werden«.
