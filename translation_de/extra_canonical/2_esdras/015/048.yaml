  source_fidelity: Die Anrede und die scharfe Bezeichnung der Frau sind zutreffend wiedergegeben. Die Explizierung von „Gott“ in „Darum spricht Gott“ geht jedoch über das im lateinischen Text stehende, subjektlose „dicit“ hinaus. Außerdem ist „Machenschaften“ für adinventiones enger und stärker negativ als nötig; das Wort bezeichnet hier Erfindungen bzw. ersonnene Vorgehensweisen.
  naturalness: „Du hast die verhasste Hure in allem nachgeahmt, was sie tat und ersann“ ist modernes, flüssiges Standarddeutsch und gibt die gekoppelte Wendung opera et adinventiones idiomatisch wieder.
  terminology: „Hure“ bewahrt die polemische, herabsetzende Bildsprache von fornicarian. „tat und ersann“ deckt opera und adinventiones ohne unnötige Spezialisierung auf geheime oder betrügerische Machenschaften ab.
