source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuis qui te cupierunt semper. Fornicarian odibilem imitata es in omnibus operibus eius et adinuentionibus eius; propterea dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: de
  text: 'Du hast die verhasste Hure in allem nachgeahmt, was sie tat und ersann. Deshalb spricht er:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fornicarian odibilem
  choice: die verhasste Hure
  rationale: Das lateinische Substantiv bezeichnet eine Prostituierte beziehungsweise Hure; „verhasst“ gibt odibilem direkt und in natürlichem, würdigem Deutsch wieder.
- source_word: opera
  choice: Taten
  rationale: „Taten“ gibt hier die ausgeführten Handlungen natürlicher wieder als das im Deutschen möglicherweise positiv klingende „Werke“.
- source_word: adinventiones
  choice: Machenschaften
  rationale: Im negativen Zusammenhang bezeichnet das Wort ausgedachte Vorgehensweisen oder Pläne; „Machenschaften“ bewahrt diesen abwertenden Sinn.
- source_word: imitata es
  choice: hast … nachgeahmt
  rationale: Direkte Wiedergabe des Perfekts und des Vergleichs mit der zuvor genannten Gestalt.
theological_decisions:
- issue: Ausdrückliches Subjekt von dicit
  choice: Gott
  alternative: er
  rationale: Im lateinischen Wortlaut steht nur „dicit“ („er spricht“); „Gott“ macht den im Kontext verstandenen Sprecher für heutige Leser kenntlich, ohne die Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit bewusst scharfer Bildsprache. Der vorangestellte Textrest „tuis qui te cupierunt semper“ wird als Abschluss des vorhergehenden Verses behandelt und daher hier nicht aufgenommen.
