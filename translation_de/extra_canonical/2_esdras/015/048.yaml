    rationale: Der lateinische Wortlaut nennt an dieser Stelle kein Subjekt. Da die Ergänzung nicht für einen verständlichen deutschen Satz erforderlich ist, sollte die Ambiguität mit „er“ erhalten bleiben.
  - severity: low
