  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a meridiano
  choice: aus dem Süden
  rationale: Das lateinische »meridianus« bezeichnet hier die südliche Himmelsrichtung; die natürliche deutsche Richtungsangabe lautet »aus dem Süden«.
- source_word: septentrione
  choice: Norden
  rationale: »septentrio« ist die übliche lateinische Bezeichnung für den Norden.
- source_word: portio alia
  choice: ein weiterer Teil
  rationale: Gibt die unbestimmte Mengen- oder Gruppenbezeichnung »portio« und »alia« knapp wieder, ohne näher festzulegen, worauf sich der Teil bezieht.
- source_word: occidente
  choice: Westen
  rationale: »occidens« bezeichnet hier die westliche Himmelsrichtung.
