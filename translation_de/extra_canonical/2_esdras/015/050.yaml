- source_word: sicut flos siccabitur
  choice: wird verdorren wie eine Blume
  rationale: „Verdorren“ gibt siccabitur im Bild einer Blume idiomatisch und anschaulich wieder.
- source_word: cum
  choice: wenn
  rationale: Der Vers bricht mit der unterordnenden Konjunktion ab; die syntaktische Offenheit wird für die Fortsetzung bewahrt.
