source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: de
  text: Babylon werden sie vernichten.[a] Sie werden gegen sie zusammenkommen, sie umzingeln und einen Sturm[b] und allen Zorn über sie ausgießen. Staub und Rauch werden bis zum Himmel aufsteigen, und alle ringsum werden trauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text setzt hier mitten im Satz mit »Babylon« ein; die Wendung schließt möglicherweise an den vorhergehenden Vers an.
    reason: Der überlieferte Versanfang Babylonem steht im Akkusativ und wirkt syntaktisch wie die Fortsetzung des vorangehenden Satzes. Die Fußnote bewahrt die Unsicherheit der Versabgrenzung.
  - marker: b
    text: 'Wörtlich auch: »einen Stern« oder »ein Gestirn«.'
    reason: Das lateinische sidus bezeichnet gewöhnlich einen Stern oder ein Gestirn, kann im Zusammenhang mit effundere jedoch eine Wettererscheinung meinen.
lexical_decisions:
- source_word: exterent
  choice: sie werden es vernichten
  rationale: Das Verb exterere bezeichnet hier das Aufreiben oder Zerstören. Die Zukunftsform und das sächliche Pronomen passen zum deutschen Städtenamen Babylon.
- source_word: sidus
  choice: ein Unwetter
  rationale: Sidus kann neben »Stern/Gestirn« auch eine Himmels- oder Wettererscheinung bezeichnen. Zusammen mit effundent (»ausgießen«) und ira ist »Unwetter« im Kontext die natürlichste Wiedergabe, ohne das Bild abzuschwächen.
- source_word: omnem iram
  choice: ihren ganzen Zorn
  rationale: Das lateinische Possessivpronomen fehlt, ist im Deutschen aber nötig, um die handelnde Gruppe als Trägerin des Zorns kenntlich zu machen; omnem wird mit »ganzen« wiedergegeben.
- source_word: subibit
  choice: werden … aufsteigen
  rationale: Subire kann ein Hinaufsteigen ausdrücken; die Richtung wird durch usque ad caelum eindeutig bestimmt.
- source_word: lugebunt
  choice: werden trauern
  rationale: Die absolute Verwendung ohne ausdrückliches Objekt bleibt erhalten; es wird nicht ergänzt, um wen oder was getrauert wird.
theological_decisions:
- issue: Bildsprache von sidus
  choice: Unwetter im Haupttext mit wörtlicher Alternative in der Fußnote
  alternative: Stern oder Gestirn
  rationale: Die kontextuelle Wetterbedeutung ergibt im Deutschen einen verständlichen Satz, während die Fußnote die ungewöhnliche wörtliche Lesart und damit die echte lexikalische Spannung bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer apokalyptischer Bildsprache. Das sächliche Pronomen »es« folgt dem deutschen Genus von »Babylon«. Die syntaktische Härte des durch die Versgrenze abgetrennten Anfangs wird im Haupttext nicht künstlich beseitigt, sondern in Fußnote [a] erläutert.
