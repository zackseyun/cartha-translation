- from: Babylon, und sie werden es vernichten.[a] Sie werden gegen es zusammenkommen, es umzingeln und ein Unwetter[b] und ihren ganzen Zorn über es ausgießen. Staub und Rauch werden bis zum Himmel aufsteigen, und alle ringsum werden trauern.
  to: Babylon werden sie vernichten.[a] Sie werden gegen sie zusammenkommen, sie umzingeln und einen Sturm[b] und allen Zorn über sie ausgießen. Staub und Rauch werden bis zum Himmel aufsteigen, und alle ringsum werden trauern.
  rationale: Die Revision stellt Babylon als feminin personifizierte Stadt dar, macht die objektische Funktion des lateinischen Babylonem im Deutschen sichtbar und vermeidet die nicht erforderliche Ergänzung eines Possessivpronomens. Die lexikalische Spannung von sidus bleibt durch die Fußnote erhalten.
