  text: Sie werden Beute haben und die Herrlichkeit deines Angesichts vernichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeda habebunt
  choice: Sie werden Beute machen
  rationale: Die lateinische Wendung bedeutet wörtlich, dass sie Beute haben werden; „Beute machen“ gibt dies im Deutschen natürlich und prägnant wieder.
- source_word: gloriam faciei tuae
  choice: den Glanz deines Angesichts
  rationale: „Glanz“ bewahrt hier die sichtbare Ehr- und Herrlichkeitsdimension von gloria, während „Angesicht“ dem würdevollen Ausdruck facies entspricht.
- source_word: exterminabunt
  choice: auslöschen
  rationale: Das Verb bezeichnet hier ein vollständiges Beseitigen oder Vernichten; „auslöschen“ verbindet sich idiomatisch mit „Glanz“ und erhält die starke Aussage.
