source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non miserebitur homo proximo suo ad irritum faciendum in domos eorum in gladium, ad diripiendas substantias eorum propter famem panis et tribulationem multam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/019.yaml
  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: de
  text: Kein Mensch wird seinen Nächsten schonen, sondern mit dem Schwert über ihre Häuser herfallen und ihren Besitz plündern – aus Hunger nach Brot und wegen großer Bedrängnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  choice: Ein Mensch wird kein Erbarmen mit seinem Nächsten haben
  rationale: Gibt die Verneinung von misereri mit Dativ sowie die allgemeine Aussage über menschliches Verhalten klar und würdig wieder.
- source_word: ad irritum faciendum in domos eorum in gladium
  choice: sondern dessen Haus mit dem Schwert überfallen
  rationale: Der überlieferte lateinische Wortlaut ist syntaktisch auffällig beziehungsweise wohl verderbt. Im Kontext bezeichnet er einen gewaltsamen Angriff auf die Häuser; die deutsche Fassung wahrt diesen Sinn, ohne die unklare Konstruktion wörtlich nachzubilden.
- source_word: ad diripiendas substantias eorum
  choice: und dessen Besitz plündern
  rationale: diripere bezeichnet gewaltsames Rauben oder Plündern; substantiae meint hier die Habe beziehungsweise den Besitz.
- source_word: propter famem panis
  choice: aus Hunger nach Brot
  rationale: Bewahrt das konkrete Bild des Brothungers und klingt im modernen Deutschen natürlich.
- source_word: tribulationem multam
  choice: große Bedrängnis
  rationale: Gibt die starke Notlage wieder, ohne sie unnötig auf rein seelische oder äußere Bedrängnis festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem prophetischem Register. Der Singular wurde durchgehend beibehalten, da homo und proximo suo singularisch sind; die späteren lateinischen Pluralformen eorum dürften generisch oder durch Textüberlieferung bedingt sein. Die schwierige Wendung ad irritum faciendum wurde kontextgerecht, aber zurückhaltend als gewaltsames Überfallen wiedergegeben.
