- from: Ein Mensch wird kein Erbarmen mit seinem Nächsten haben, sondern dessen Haus mit dem Schwert überfallen und dessen Besitz plündern – aus Hunger nach Brot und wegen großer Bedrängnis.
  to: Kein Mensch wird seinen Nächsten schonen, sondern mit dem Schwert über ihre Häuser herfallen und ihren Besitz plündern – aus Hunger nach Brot und wegen großer Bedrängnis.
  rationale: Die Revision bewahrt die im lateinischen Text stehenden pluralischen Bezüge bei Häusern und Besitz und verbessert zugleich die idiomatische deutsche Formulierung. Die in der Überlieferung syntaktisch schwierige Angriffsformel wird kontextgerecht und zurückhaltend wiedergegeben, entsprechend dem englischen Audit, ohne ihre genaue textkritisch unsichere Mechanik zu überdeuten.
