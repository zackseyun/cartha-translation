  text: because they are faithful and true. Do not fear the thoughts against you, nor let the unbelief of those who speak against you trouble you.
translation:
  language: de
  text: Denn sie sind zuverlässig und wahr. Fürchte dich nicht vor den Gedanken, die sich gegen dich richten, und lass dich auch nicht durch den Unglauben derer beunruhigen, die dir widersprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fideles et ueri
  choice: zuverlässig und wahr
  rationale: „Zuverlässig“ gibt fideles bei Aussagen oder Schriften natürlicher wieder als das personenbezogene „treu“; ueri wird unmittelbar mit „wahr“ wiedergegeben.
- source_word: cogitationibus aduersum te
  choice: den Gedanken, die sich gegen dich richten
  rationale: Die Wiedergabe bleibt beim Grundsinn von cogitationes („Gedanken“) und vermeidet die stärker deutende Übersetzung „Pläne“ oder „Anschläge“.
- source_word: incredulitates
  choice: Unglauben
  rationale: Das lateinische Abstraktum wird im Deutschen idiomatisch im Singular wiedergegeben; gemeint ist die ablehnende Haltung der Widersprechenden.
- source_word: contra dicentium
  choice: derer, die dir widersprechen
  rationale: Die partizipiale Wendung bezeichnet Menschen, die gegen die angesprochene Person reden; „widersprechen“ ist präzise und natürlich.
theological_decisions:
- issue: Bedeutung von fideles bei den zuvor genannten schriftlich festzuhaltenden Worten
  choice: zuverlässig
  alternative: treu
  rationale: Der sachbezogene Kontext spricht für die Verlässlichkeit der Worte, ohne den theologischen Bedeutungsumfang von „treu“ unnötig einzutragen.
- issue: Charakter der gegen die angesprochene Person gerichteten cogitationes
  choice: Gedanken
  alternative: Pläne oder Anschläge
  rationale: Der lateinische Text lässt offen, ob bloße Gedanken, feindliche Absichten oder konkrete Pläne gemeint sind; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Mahnruf des lateinischen Satzes bleibt erhalten; „auch nicht“ verbindet die beiden Aufforderungen natürlich, ohne die Aussage zu verstärken.
