source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non parcam illis, discedite, filii apostatae, nolite contaminare sanctificationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
translation:
  language: de
  text: Ich werde sie nicht verschonen. Geht fort, ihr abtrünnigen Kinder! Verunreinigt nicht, was mir heilig ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die lateinische Wendung „meine Heiligung“ bedeuten; gemeint sein kann auch „mein Heiligtum“ oder allgemeiner das, was Gottes Heiligkeit zugehört.
    reason: lexical_alternative
lexical_decisions:
- source_word: filii apostatae
  choice: ihr abtrünnigen Kinder
  rationale: „Kinder“ gibt filii in einer geschlechtsübergreifend verständlichen und im Anredekontext natürlichen Weise wieder; „abtrünnig“ bewahrt den Gedanken des Abfalls.
- source_word: sanctificationem meam
  choice: was mir heilig ist
  rationale: Die lateinische Wendung kann wörtlich „meine Heiligung“ bedeuten, bezeichnet hier aber im Zusammenhang mit „verunreinigen“ wahrscheinlich etwas, das Gottes Heiligkeit zugehört. Die offene Formulierung vermeidet eine unbelegte Einengung auf das Heiligtum.
theological_decisions:
- issue: Bezug von sanctificationem meam
  choice: was mir heilig ist
  alternative: meine Heiligung; mein Heiligtum
  rationale: Die Übersetzung wahrt die Mehrdeutigkeit zwischen einem abstrakten Heiligkeits- beziehungsweise Heiligungsbegriff und einem konkret geheiligten Bereich, ohne den Ausdruck vorschnell auf ein Heiligtum festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative bewahren den scharfen prophetischen Ton; „Geht fort“ gibt discedite natürlich und direkt wieder.
