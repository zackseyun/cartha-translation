revisions:
- from: Und du[a], Asia, Teilhaberin an der Pracht Babylons und an der Herrlichkeit ihrer Gestalt —
  to: Und du[a], Asien, Teilhaberin an der Pracht Babylons und an der Herrlichkeit ihrer Person —
  rationale: Die Änderung von „Asia“ zu „Asien“ normalisiert den geographischen Namen im Deutschen. „Ihrer Person“ ersetzt „ihrer Gestalt“, damit die personifizierende und nicht eindeutig auf äußere Form beschränkte Bedeutung von persona erhalten bleibt. Satzbau, feminine Personifizierung, gehobenes Register und der satzfortführende Gedankenstrich bleiben bestehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:20Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Anrede, die personifizierte feminine Beziehung von Asia/Asien und die koordinierte Konstruktion mit consors in ... et ... im Wesentlichen treffend wieder. „Gestalt“ verengt jedoch persona auf äußere Erscheinung, während das lateinische Wort gerade die personifizierte „Person“ bzw. Erscheinung offenlässt. Die deutsche Form „Asien“ ist für die Länder-/Regionsbezeichnung im modernen Standarddeutsch angemessen.
  naturalness: „Teilhaberin an der Pracht Babylons“ ist verständlich und wahrt die Personifizierung. „Herrlichkeit ihrer Person“ ist trotz leicht gehobenen Tons idiomatisch genug im prophetisch-rhetorischen Register und näher am mehrdeutigen persona als „Gestalt“.
  terminology: „Pracht“ ist für species im Kontext gut gewählt. „Teilhaberin“ gibt consors ohne unberechtigte Einengung auf ein politisches Bündnis wieder. „Person“ bewahrt die rhetorische Personifizierung und die semantische Offenheit von persona. Die Fußnote soll die deutsche Namensform „Asien“ verwenden.
  issues:
  - severity: medium
    issue: „Gestalt“ für persona
    rationale: „Gestalt“ legt den Sinn auf die äußere Form fest. persona kann hier die personifizierte Person, Rolle oder Erscheinung Babylons meinen; „Person“ erhält diese Offenheit und entspricht auch der englischen Audit-Fassung („her person“).
  - severity: low
    issue: Namensform „Asia“
    rationale: Im modernen Standarddeutsch heißt die geographische Bezeichnung „Asien“. Die Beibehaltung des lateinischen Namens wirkt unnötig fremdsprachlich; dieselbe Form sollte auch in der Fußnote stehen.
