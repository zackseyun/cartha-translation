  yaml_path: translation/extra_canonical/2_esdras/015/046.yaml
  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
translation:
  language: de
  text: Und du[a], Asien, Teilhaberin an der Pracht Babylons und an der Herrlichkeit ihrer Person —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Anrede an Asien als Teilhaberin Babylons stammt aus einer anderen Kompositionsschicht als der jüdische Kern des 4. Esrabuchs. Diese Redeweise gehört zum späteren lateinisch-christlichen Anhang, der gewöhnlich als 6. Esra bezeichnet wird.
    reason: compositional_layer
lexical_decisions:
- source_word: consors
  choice: Teilhaberin
  rationale: Das feminine Substantiv bewahrt die Personifizierung Asias und bezeichnet seine Beteiligung an Babylons Pracht, ohne die Beziehung enger als im Lateinischen als Bündnis festzulegen.
- source_word: species
  choice: Pracht
  rationale: Im Zusammenhang mit Babylon bezeichnet species dessen glanzvolle äußere Erscheinung; „Pracht“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: persona
  choice: Gestalt
  rationale: „Gestalt“ bewahrt den Bezug auf Babylons personifizierte Erscheinung und vermeidet das im Deutschen missverständliche wörtliche „Person“.
theological_decisions:
- issue: Literarische Einordnung der Anrede an Asia
  choice: Die spätere christlich-lateinische Kompositionsschicht wird nur in der Fußnote benannt.
  alternative: Die Anrede ohne Hinweis auf ihre literarische Schichtung wiedergeben.
  rationale: Der Hinweis ist textgeschichtlich hilfreich, verändert aber weder den Wortlaut noch legt er dem Vers eine konfessionelle Deutung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Form „Teilhaberin“ erhält die rhetorische Personifizierung Asias; der Gedankenstrich lässt den im folgenden Vers weitergeführten Satz bewusst offen.
