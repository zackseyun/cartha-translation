  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: de
  text: Und aus seinem Zorn ging Feuer hervor und verzehrte die Grundfesten der Erde[a] und die Sünder wie entzündetes Stroh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Lateinische verbindet „die Grundfesten der Erde“ und „die Sünder“ unmittelbar als das, was das Feuer verzehrte. Der Vergleich mit entzündetem Stroh steht nach „die Sünder“ und kann sich besonders auf sie beziehen; seine genaue Reichweite wird jedoch nicht ausdrücklich bestimmt.
    reason: Die Fußnote erläutert die Satzstruktur und bewahrt die mögliche Reichweite des Vergleichs, ohne eine nicht eindeutig markierte Begrenzung festzulegen.
lexical_decisions:
- source_word: exiit ignis ab ira eius
  choice: aus seinem Zorn ging Feuer hervor
  rationale: Bewahrt das Bild des aus dem Zorn hervorgehenden Feuers und gibt die lateinische Wendung in natürlichem, würdevollem Deutsch wieder.
- source_word: devoravit
  choice: verzehrte
  rationale: Entspricht dem starken Bild des vollständigen Aufzehrens durch Feuer.
- source_word: fundamenta terrae
  choice: die Grundfesten der Erde
  rationale: „Grundfesten“ gibt die kosmische Tragweite von fundamenta prägnant und bibelsprachlich verständlich wieder.
- source_word: peccatores
  choice: die Sünder
  rationale: Direkte und theologisch neutrale Wiedergabe des lateinischen Begriffs.
- source_word: quasi stramen incensum
  choice: wie entzündetes Stroh
  rationale: Gibt sowohl den Vergleich quasi als auch den Zustand des in Brand gesetzten Strohs wieder, ohne das Bild abzuschwächen.
theological_decisions:
- issue: Verhältnis des Feuers zum Zorn
  choice: Das Feuer geht „aus seinem Zorn“ hervor.
  alternative: Das Feuer wird „durch seinen Zorn“ hervorgebracht.
  rationale: Die Fassung hält sich an ab ira eius und vermeidet es, die bildhafte Herkunftsbeziehung in eine eindeutig instrumentale Aussage umzudeuten.
- issue: Reichweite von „verzehrte“
  choice: Sowohl die Grundfesten der Erde als auch die Sünder sind Objekte von „verzehrte“; nur die Sünder werden ausdrücklich mit entzündetem Stroh verglichen.
  alternative: Eine stärkere rhetorische Trennung zwischen den Grundfesten und den Sündern.
  rationale: Die lateinische Koordination fundamenta terrae et peccatores stützt die gemeinsame Abhängigkeit von devoravit, während quasi stramen incensum unmittelbar bei peccatores steht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. „Grundfesten“ und „verzehrte“ bewahren die kraftvolle kosmische Bildsprache; unnötig altertümliche Formen werden vermieden.
