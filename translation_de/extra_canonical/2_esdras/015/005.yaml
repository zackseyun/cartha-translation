source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego induco, dicit Dominus, super orbem terrarum mala, gladium et famem et mortem et interitum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/005.yaml
  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: de
  text: 'Siehe, ich bringe Unheil über den Erdkreis, spricht der Herr: Schwert, Hunger, Tod und Verderben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Warnruf und entspricht dem prophetischen Register des Verses.
- source_word: induco
  choice: ich bringe … über
  rationale: Gibt die aktive Verursachung und die Konstruktion mit »super« natürlich und genau wieder.
- source_word: orbem terrarum
  choice: den Erdkreis
  rationale: Bezeichnet die bewohnte Welt als Ganzes und bewahrt gegenüber dem allgemeineren »Welt« den gehobenen, umfassenden Klang.
- source_word: mala
  choice: Unheil
  rationale: Das lateinische Neutrum Plural meint hier hereinbrechende Übel beziehungsweise Katastrophen; »Unheil« ist im Deutschen idiomatisch und wird durch die folgende Aufzählung entfaltet.
- source_word: gladium
  choice: Schwert
  rationale: Bewahrt das konkrete Bild, das metonymisch für Krieg und gewaltsames Töten stehen kann, ohne diese Bedeutung einengend auszudeuten.
- source_word: famem
  choice: Hunger
  rationale: Natürliche deutsche Wiedergabe für eine schwere Hungersnot im Rahmen einer Unheilsreihe.
- source_word: mortem
  choice: Tod
  rationale: Direkte und theologisch neutrale Entsprechung.
- source_word: interitum
  choice: Verderben
  rationale: Unterscheidet den umfassenden Untergang beziehungsweise die Vernichtung vom unmittelbar vorausgehenden »Tod«.
theological_decisions:
- issue: Göttliche Urheberschaft des angekündigten Unheils
  choice: »ich bringe Unheil über«
  alternative: »ich lasse Unheil über … kommen«
  rationale: Die aktive Form von »induco« wird nicht abgeschwächt; dadurch bleibt die Spannung der ausdrücklichen göttlichen Ankündigung erhalten.
translation_notes:
  register: Feierlich-prophetisches, zugleich verständliches Standarddeutsch. Die asyndetische Aufzählung wird mit Doppelpunkteinleitung und Kommas bewahrt; der abschließende Punkt ersetzt das im Quellenausschnitt offene Komma.
