  text: Behold, a dreadful vision, and its face is from the east.
translation:
  language: de
  text: Siehe, eine schreckliche Erscheinung, und ihr Angesicht ist aus dem Osten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Ausruf des lateinischen Textes.
- source_word: visio horribilis
  choice: eine schreckliche Erscheinung
  rationale: „Erscheinung“ gibt visio als etwas Geschautes natürlich wieder; „schrecklich“ wahrt die Furcht erregende Bedeutung von horribilis.
- source_word: facies illius
  choice: ihr Angesicht
  rationale: Das feminine Pronomen bezieht sich auf die Erscheinung; „Angesicht“ erhält die konkrete Bildsprache von facies, ohne sie zu „Aussehen“ abzuschwächen.
- source_word: ab oriente
  choice: kommt aus dem Osten
  rationale: Das elliptische lateinische „ist aus dem Osten“ wird im Deutschen idiomatisch als Herkunftsangabe wiedergegeben; die Ergänzung „kommt“ bleibt durch den Kontext eng begrenzt.
theological_decisions:
- issue: Personifizierung der Erscheinung durch facies
  choice: „ihr Angesicht“ beibehalten
  alternative: „ihr Aussehen“ oder „sie erscheint vom Osten her“
  rationale: Die auffällige Personifizierung und mögliche apokalyptische Mehrdeutigkeit des Ausgangstextes sollen nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem „Siehe“ und „Angesicht“. Die ungewöhnliche Bildsprache des lateinischen Satzes bleibt erkennbar; ein Ausrufezeichen verdeutlicht die durch ecce eröffnete Ausrufstruktur.
