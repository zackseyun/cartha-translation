source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeant cultores operantes terram, quoniam deficient semina eorum et vastabuntur ligna eorum ab uredine et grandine et a sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/013.yaml
  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: de
  text: Diejenigen, die das Land bebauen, sollen klagen; denn ihre Saat wird ausbleiben, und ihre Bäume werden durch Pflanzenbrand, Hagel und einen schrecklichen Stern verwüstet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeant
  choice: sollen klagen
  rationale: Gibt den lateinischen Jussiv natürlich und würdevoll wieder.
- source_word: cultores operantes terram
  choice: die das Land bebauen
  rationale: Bewahrt sowohl die Bezeichnung der Landbebauer als auch die Tätigkeit, ohne die schwerfällige Doppelung „Bauern, die den Boden bearbeiten“.
- source_word: deficient semina eorum
  choice: ihre Saat wird ausbleiben
  rationale: „Saat“ bezeichnet hier kollektiv das Saatgut beziehungsweise den daraus erwarteten Ertrag; „ausbleiben“ bewahrt die Aussage des Versagens oder Fehlens.
- source_word: uredine
  choice: Brand
  rationale: Lateinisch „uredo“ bezeichnet eine Pflanzenkrankheit, besonders Rost oder Brand; „Brand“ ist im landwirtschaftlichen Zusammenhang eine knappe, verständliche Wiedergabe.
- source_word: a sidus terribile
  choice: einen schrecklichen Stern
  rationale: Folgt trotz der grammatisch auffälligen überlieferten Form dem klar erkennbaren Sinn und bewahrt das ungewöhnliche Bild des „schrecklichen Sterns“.
theological_decisions:
- issue: Deutung des schrecklichen Sterns
  choice: wörtlich als „schrecklicher Stern“ wiedergegeben
  alternative: als Hagelsturm, Himmelszeichen oder symbolisches Gericht auslegen
  rationale: Der lateinische Text nennt ein sidus; die Übersetzung wahrt das Bild und legt seine kosmische oder symbolische Bedeutung nicht fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Ton. Die Satzstellung hält den Mahnruf am Anfang und wahrt die dreifache Ursache der Verwüstung.
