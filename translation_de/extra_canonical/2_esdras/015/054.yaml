base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: de
  text: Wann wurdest du berauscht? Schmücke die Schönheit deines Gesichts! Der Lohn einer Hure liegt in deinem Schoß[a]; darum wirst du Vergeltung empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmücke dein Gesicht! Der Lohn der Hurerei liegt in deinem Schoß.“'
    reason: Dokumentiert die mögliche idiomatischere Wiedergabe von speciem vultus tui und die weniger konkrete Deutung des Genitivs fornicariae.
lexical_decisions:
- source_word: cum inebriata es?
  choice: Wann wurdest du berauscht?
  rationale: Bewahrt die Frageform sowie das feminine Passiv des lateinischen Perfekts; die angesprochene Größe wird als Frau personifiziert.
- source_word: Exorna speciem uultus tui!
  choice: Schmücke die Schönheit deines Gesichts!
  rationale: Gibt sowohl exorna als auch speciem vultus möglichst vollständig wieder und erhält den zugespitzten, spöttisch wirkenden Imperativ.
- source_word: Merces fornicariae
  choice: Der Lohn einer Hure
  rationale: Fornicariae ist Genitiv Singular und bezeichnet konkret eine Hure, nicht abstrakt die Hurerei; dadurch bleibt die Personifikation erhalten.
- source_word: in sinus tuos
  choice: liegt in deinem Schoß
  rationale: Sinus bezeichnet hier den Schoß beziehungsweise den Bausch des Gewandes; der Singular im Deutschen ist idiomatisch.
- source_word: redditionem recipies
  choice: du wirst Vergeltung empfangen
  rationale: Bewahrt die Wiedervergeltungsbedeutung von redditio und den Zukunftsbezug.
theological_decisions:
- issue: Personifikation der angesprochenen Stadt oder Macht als Hure
  choice: Konkrete feminine Bezeichnung „Hure“
  alternative: Abstrakt „Lohn der Hurerei“
  rationale: Die lateinische Form fornicariae bezeichnet eine weibliche Person und setzt die im Kontext angelegte Personifikation fort, ohne sie näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst enger Bindung an die lateinische Bildsprache. Der leicht ungewöhnliche Ausdruck „die Schönheit deines Gesichts schmücken“ erhält die formale Zuspitzung des Ausgangstextes.
