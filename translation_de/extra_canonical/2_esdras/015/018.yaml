base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: de
  text: Denn wegen ihres Hochmuts werden die Städte in Unruhe versetzt, die Häuser werden zerstört, und die Menschen werden sich fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter superbiam enim eorum
  choice: Denn wegen ihres Hochmuts
  rationale: Gibt die kausale Verbindung durch „denn“ und „wegen“ wieder; „Hochmut“ ist die natürliche und präzise Entsprechung für superbia.
- source_word: civitates turbabuntur
  choice: die Städte werden in Aufruhr geraten
  rationale: Das passive turbabuntur bezeichnet Störung, Unruhe oder Verwirrung. „In Aufruhr geraten“ bewahrt die Offenheit zwischen gesellschaftlicher Unordnung und allgemeiner Erschütterung.
- source_word: domus exterentur
  choice: die Häuser werden zerstört
  rationale: Der überlieferte lateinische Ausdruck bezeichnet eine schwere Vernichtung beziehungsweise Verwüstung; „zerstört“ ist im Kontext klar und idiomatisch.
- source_word: homines metuent
  choice: die Menschen werden sich fürchten
  rationale: „Menschen“ gibt homines inklusiv und modern wieder; „sich fürchten“ entspricht dem einfachen Futur metuent.
theological_decisions: []
