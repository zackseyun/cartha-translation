source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: de
  text: Denn das Schwert und ihre Vernichtung sind nahe gekommen[a], und ein Volk wird sich gegen das andere zum Kampf erheben, und Breitschwerter werden in ihren Händen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Schwert und ihre Vernichtung sind nahe.“'
    reason: Das lateinische Perfekt adpropinquavit kann im Deutschen auch stärker resultativ als gegenwärtiger Zustand wiedergegeben werden.
lexical_decisions:
- source_word: gladius
  choice: das Schwert
  rationale: Der lateinische Singular wird direkt und idiomatisch wiedergegeben; der bestimmte Artikel entspricht dem angekündigten Gerichtswerkzeug.
- source_word: extritio illorum
  choice: ihre Vernichtung
  rationale: 'Der Genitiv illorum bezieht sich am natürlichsten auf extritio: Gemeint ist die Vernichtung, die sie trifft, nicht ein ihnen gehörendes Schwert. Vernichtung gibt den spätlateinischen Gerichtssinn von extritio angemessen wieder.'
- source_word: adpropinquavit
  choice: sind nahe gekommen
  rationale: Das lateinische Perfekt wird als vollzogene Annäherung wiedergegeben. Wegen des zusammengesetzten deutschen Subjekts steht das Verb im Plural.
- source_word: gens contra gentem
  choice: ein Volk gegen das andere
  rationale: Diese natürliche deutsche Wendung bewahrt die wechselseitige Gegenüberstellung des Lateinischen.
- source_word: ad pugnam
  choice: zum Kampf
  rationale: Gibt Ziel beziehungsweise Zweck der Erhebung knapp und direkt wieder.
- source_word: romphea
  choice: breite Schwerter
  rationale: Das Lehnwort bezeichnet ein großes beziehungsweise breites Schwert; die Umschreibung ist für heutige Leser verständlicher als ein seltenes Fachwort.
- source_word: in manibus eorum
  choice: in ihren Händen
  rationale: Direkte, natürliche Entsprechung der lateinischen Ortsangabe.
theological_decisions:
- issue: Bezug von illorum
  choice: 'Auf extritio bezogen: „ihre Vernichtung“'
  alternative: 'Auf gladius und extritio bezogen: „ihr Schwert und ihre Vernichtung“'
  rationale: Wortstellung und Sinnzusammenhang sprechen dafür, illorum als Genitivattribut zu extritio zu verstehen; das Schwert erscheint als kommendes Gerichtswerkzeug, nicht als Besitz der Betroffenen.
- issue: Aspekt von adpropinquavit
  choice: „sind nahe gekommen“
  alternative: „sind nahe“
  rationale: Die Perfektform bezeichnet nicht nur einen Zustand, sondern eine bereits erfolgte Annäherung; diese Spannung zwischen vollzogener Annäherung und bevorstehendem Ereignis bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ton. Die Satzstruktur folgt dem wiederholten lateinischen et, ohne unnatürlich steif zu wirken; „breite Schwerter“ vermeidet ein dem allgemeinen Publikum wenig geläufiges Fachwort.
