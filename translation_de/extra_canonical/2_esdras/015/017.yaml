  yaml_path: translation/extra_canonical/2_esdras/015/017.yaml
  text: For a man will desire to go into a city and will not be able[a].
translation:
  language: de
  text: Denn ein Mensch wird in eine Stadt gehen wollen und es nicht können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enim
  choice: Denn
  rationale: Bewahrt den begründenden beziehungsweise erläuternden Anschluss an den vorausgehenden Zusammenhang.
- source_word: homo
  choice: ein Mensch
  rationale: Gibt das allgemeine lateinische homo geschlechtsübergreifend und ohne unnötige Spezifizierung wieder.
- source_word: concupiscet ... ire
  choice: wird ... gehen wollen
  rationale: Im Zusammenhang bezeichnet concupiscere den starken Wunsch beziehungsweise das Verlangen, in die Stadt zu gelangen; die natürliche deutsche Zukunftsform wahrt den Sinn.
- source_word: in civitatem
  choice: in eine Stadt
  rationale: Entspricht dem unbestimmten lateinischen Ausdruck und seiner Richtungsangabe.
- source_word: non poterit
  choice: wird es nicht können
  rationale: Gibt das Futur und die Unfähigkeit wieder; „es“ nimmt den zuvor genannten Gang in die Stadt natürlich auf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der erklärende Anschluss durch „Denn“ bleibt ausdrücklich erhalten. Keine Fußnote nötig, da die mögliche Wiedergabe „ein Mann“ gegenüber dem generischen lateinischen homo weniger genau ist.
