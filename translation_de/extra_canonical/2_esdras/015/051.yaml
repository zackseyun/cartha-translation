source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: exsurget ardor qui emissus est super te. Et infirmaberis et paupera a plaga et mastigata a uulneribus, ut non possis tuos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/051.yaml
  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: de
  text: Die Glut, die gegen dich ausgesandt wurde, wird auflodern. Du wirst geschwächt, durch den Schlag arm gemacht und mit Wunden gegeißelt werden, sodass du die Deinen nicht aufnehmen kannst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Text bricht nach „die Deinen“ ab; „aufnehmen“ ist sinngemäß ergänzt.
    reason: source_truncation
lexical_decisions:
- source_word: ardor
  choice: Glut
  rationale: Gibt die brennende Hitze bzw. das verzehrende Feuer wieder, ohne unnötig zwischen wörtlicher und bildlicher Bedeutung zu entscheiden.
- source_word: exsurget
  choice: wird auflodern
  rationale: Im Zusammenhang mit ardor ist „auflodern“ natürlich und bewahrt den Gedanken des Sich-Erhebens bzw. Ausbrechens.
- source_word: infirmaberis
  choice: du wirst geschwächt werden
  rationale: Entspricht dem passivischen Sinn des lateinischen Verbs und klingt im modernen Deutsch natürlich.
- source_word: paupera a plaga
  choice: durch den Schlag arm gemacht
  rationale: Bewahrt das auffällige paupera möglichst formal; plaga bezeichnet im unmittelbaren Kontext von Geißelung und Wunden am ehesten einen Schlag, nicht eine Krankheit.
- source_word: mastigata a vulneribus
  choice: mit Wunden gegeißelt
  rationale: Erhält die körperliche Straf- und Verletzungsmetaphorik des lateinischen Textes.
- source_word: tuos
  choice: die Deinen
  rationale: Das substantivierte Possessivpronomen bezeichnet die zu ihr gehörenden Menschen, ohne die im vorgelegten lateinischen Text nicht genannten Gruppen näher zu bestimmen.
theological_decisions:
- issue: Unvollständiger Schlusssatz nach „tuos“
  choice: „die Deinen nicht aufnehmen kannst“ mit Fußnote
  alternative: „sodass du die Deinen nicht … kannst“
  rationale: Der vorgelegte lateinische Wortlaut bricht syntaktisch nach tuos ab. „aufnehmen“ folgt der konsultierten englischen Fassung, wird aber transparent als sinngemäße Ergänzung gekennzeichnet, statt zusätzliche Personengruppen in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harte Bildfolge von Glut, Schlag, Geißelung und Wunden bleibt erhalten; die syntaktische Lücke am Versende wird nicht verschleiert.
