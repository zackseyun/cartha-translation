  source_fidelity: 'Die Übersetzung gibt den vorgelegten lateinischen Wortlaut insgesamt sorgfältig wieder: ardor als „Glut“, exsurget als „wird auflodern“, die Passivfolge von infirmaberis bis mastigata sowie die abschließende Unfähigkeit. „durch den Schlag arm gemacht“ bewahrt sowohl paupera als auch die im Kontext von Geißelung und Wunden naheliegende Bedeutung von plaga als körperlichem Schlag, nicht als Seuche.'
