  language: de
  text: Siehe, sprich meinem Volk die Worte der Prophetie zu Gehör.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Siehe
  rationale: Bewahrt den feierlichen Aufmerksamkeitssignalcharakter der lateinischen Aufforderung und entspricht dem biblischen Register.
- source_word: loquere
  choice: sprich
  rationale: Gibt den Imperativ Singular direkt und natürlich wieder.
- source_word: in aures plebi meae
  choice: vor den Ohren meines Volkes
  rationale: Die idiomatische deutsche Wendung bewahrt das konkrete Bild der Ohren, ohne das unnatürliche „in die Ohren“ zu verwenden; plebi meae wird als „meines Volkes“ wiedergegeben.
- source_word: sermones prophetiae
  choice: die Worte der Prophezeiung
  rationale: Gibt sowohl den Plural sermones als auch den Genitiv prophetiae formal nah wieder, ohne den Inhalt näher zu bestimmen.
theological_decisions:
- issue: Bedeutungsumfang von prophetia
  choice: Prophezeiung
  alternative: Weissagung
  rationale: „Prophezeiung“ ist im heutigen Standarddeutsch unmittelbar verständlich und lässt offen, ob Vorhersage oder umfassendere prophetische Verkündigung gemeint ist.
translation_notes:
  register: Feierlich-biblisches, zugleich verständliches modernes Standarddeutsch. Die konkrete Hörmetapher des lateinischen Textes bleibt in einer geläufigen deutschen Formulierung erhalten.
