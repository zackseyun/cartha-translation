  yaml_path: translation/extra_canonical/2_esdras/015/061.yaml
  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: de
  text: Sie werden dir zum Feuer werden. Sie werden dich und deine Städte verschlingen, dein Land und deine Berge; alle deine Wälder und deine fruchttragenden Bäume werden sie mit Feuer verbrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: Sie werden dir zum Feuer werden
  rationale: Gibt die prädikative Wendung wörtlich und zugleich in natürlichem, feierlichem Deutsch wieder, ohne das Bild zu „Feuersglut“ oder „Kohlen“ zu konkretisieren.
- source_word: deuorabunt
  choice: werden … verschlingen
  rationale: Bewahrt das starke Bild des lateinischen Verbs und passt sowohl zur Vernichtung von Menschen als auch von Städten und Land.
- source_word: ligna … fructifera
  choice: fruchttragende Bäume
  rationale: Entspricht dem durch die konsultierte Fortsetzung bezeugten Sinn genauer als das allgemeinere „fruchtbares Holz“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Feuer“ bleibt erhalten. Der bereitgestellte lateinische Ausschnitt bricht nach „terram“ ab; der restliche Satz wurde entsprechend der als geprüfte Konsultationsschicht vorliegenden Fortsetzung wiedergegeben.
