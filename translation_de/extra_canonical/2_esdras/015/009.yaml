base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: de
  text: Ich werde gewiss Rache für sie nehmen[a], spricht der Herr, und alles unschuldige Blut werde ich von ihnen für mich einfordern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Rächend werde ich sie rächen.“ Die Wiederholung dient der Bekräftigung.'
    reason: Die ungewöhnliche lateinische Verdoppelung „vindicans vindicabo“ wird im Haupttext idiomatisch als emphatische Aussage wiedergegeben; die Fußnote dokumentiert ihre Form.
lexical_decisions:
- source_word: vindicans vindicabo
  choice: Ich werde sie gewiss rächen
  rationale: Die figura etymologica aus Partizip und finitem Verb verstärkt die Aussage. Das moderne deutsche „gewiss“ gibt diese emphatische Funktion natürlicher wieder als eine wörtliche Verdoppelung.
- source_word: accipiam ... sanguinem innocuum ex illis ad me
  choice: alles unschuldig vergossene Blut werde ich von ihnen für mich einfordern
  rationale: „Einfordern“ gibt im Gerichtskontext den Sinn wieder, dass der Herr Rechenschaft für das Blut verlangt. „Unschuldig vergossenes Blut“ ist im Deutschen die natürliche Bezeichnung für das Blut unschuldiger Opfer; „für mich“ bewahrt ad me, ohne es auszudeuten.
- source_word: dicit Dominus
  choice: spricht der Herr
  rationale: Eine würdige und im deutschen Bibelstil geläufige Wiedergabe der prophetischen Redeeinleitung.
theological_decisions:
- issue: Bezug von „illos“
  choice: sie
  alternative: für sie Vergeltung üben
  rationale: Das Pronomen bleibt wie im lateinischen Vers kontextabhängig und wird nicht durch eine ausdrückliche Benennung seiner Bezugsgruppe vereindeutigt.
- issue: Bedeutung von „sanguinem ... ex illis“
  choice: Blut von ihnen einfordern
  alternative: ihr Blut nehmen
  rationale: Der Zusammenhang und die englische Prüfschicht sprechen für das Einfordern von Rechenschaft wegen unschuldigen Blutes, nicht dafür, dass das Blut der Täter selbst gemeint ist. Die Formulierung wahrt zugleich die gerichtliche Bildsprache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die Satzstellung hebt entsprechend dem lateinischen Text „alles unschuldig vergossene Blut“ hervor; unnötig altertümliche oder konfessionell geprägte Wendungen werden vermieden.
