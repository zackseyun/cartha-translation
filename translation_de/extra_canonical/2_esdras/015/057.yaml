review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt sämtliche Bestandteile des lateinischen Verses wieder: „ciuitates tuae“ als „Deine Städte“, „conterentur“ als zukünftiges Passiv, „omnes tui“ sinnvoll elliptisch aufgelöst als „alle deine Leute“, „in campo gladio cadent“ als Fallen auf offenem Feld durch das Schwert sowie „in montibus fame peribunt et manducabunt carnes“ als Hungertod und Essen von Fleisch. Der im Englischen dokumentierte, erst im folgenden Vers stehende Zusatz zu „eigenem“ Fleisch wird zu Recht nicht vorweggenommen.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit einem angemessen würdig-prophetischen Register. Die doppelte Zukunftspassivform „werden zerschmettert werden“ ist zwar schwerer als eine stilistisch freiere Umformung, aber grammatisch korrekt und für den feierlich-prophetischen Kontext vertretbar. „auf dem freien Feld“ verdeutlicht natürlich den Sinn von „in campo“.
  terminology: „zerschmettert“, „durch das Schwert fallen“ und „vor Hunger umkommen“ bewahren die Bildlichkeit und den ernsten Ton des Ausgangstextes. „Fleisch“ ist terminologisch richtig und wahrt die durch die Versgrenze bedingte Offenheit des lateinischen „carnes“.
  issues: []
  revised_text: ''
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Insbesondere sollte weder „ihr eigenes Fleisch“ noch eine entsprechende Fußnote ergänzt werden, da der vorgelegte lateinische Wortlaut dieses Verses nur mit „carnes“ endet und der besitzanzeigende Zusatz nach dem dokumentierten Quellenbefund zum folgenden Vers gehört.
