id: 2ES.15.57
reference: 2 Esdras 15:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: de
  text: Deine Städte werden zerschmettert werden, und alle deine Leute auf dem freien Feld werden durch das Schwert fallen. Diejenigen aber, die in den Bergen sind, werden vor Hunger umkommen und Fleisch essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ciuitates tuae conterentur
  choice: Deine Städte werden zerschmettert werden
  rationale: Gibt das starke Passiv von conterere bildhaft und würdig wieder.
- source_word: omnes tui
  choice: alle deine Leute
  rationale: Löst die substantivierte Ellipse natürlich auf, ohne eine engere Gruppe zu bestimmen, als der lateinische Text zulässt.
- source_word: in campo
  choice: auf dem freien Feld
  rationale: Bezeichnet hier den offenen Raum außerhalb befestigter Orte; die Formulierung ist im Deutschen eindeutiger als nur „im Feld“.
- source_word: gladio cadent
  choice: werden durch das Schwert fallen
  rationale: Bewahrt das traditionelle Gewaltbild und gibt den instrumentalen Ablativ gladio angemessen wieder.
- source_word: fame peribunt
  choice: werden vor Hunger umkommen
  rationale: Natürliche deutsche Wiedergabe des Ablativs der Ursache fame.
- source_word: manducabunt carnes
  choice: werden Fleisch essen
  rationale: Übersetzt den an dieser Versgrenze überlieferten Wortlaut genau; „ihr eigenes“ gehört nach der angegebenen Quelleneinteilung nicht in diesen Vers.
theological_decisions:
- issue: Bezug von „Fleisch“
  choice: Fleisch
  alternative: ihr eigenes Fleisch
  rationale: Der vorgelegte lateinische Vers endet mit carnes. Der Zusatz suas fällt laut Quellenbefund über die Versgrenze in den folgenden Vers und wird daher hier nicht vorweggenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der drohende prophetische Ton und die parallelen Zukunftsaussagen bleiben erhalten; die Syntax wurde nur so weit geglättet, wie es für gewöhnliche heutige Leser nötig ist.
