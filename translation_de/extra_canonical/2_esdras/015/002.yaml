- source_word: in carta
  choice: auf eine Schriftrolle
  rationale: Im antiken Schreibkontext bezeichnet carta das Schreibmaterial beziehungsweise das Schriftstück; „Schriftrolle“ ist hier verständlich und kontextgerecht.
