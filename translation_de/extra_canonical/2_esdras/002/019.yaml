  text: fructibus Et totidem fontes fluentes lac et mel et montes inmensos septem habentes rosam et lilium, in quibus gaudio replebo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/019.yaml
  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: de
  text: und ebenso viele Quellen, aus denen Milch und Honig fließen, sowie sieben gewaltige Berge, auf denen Rosen und Lilien wachsen. Dort werde ich deine Kinder mit Freude erfüllen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: totidem fontes
  choice: ebenso viele Quellen
  rationale: „Totidem“ verweist auf eine zuvor genannte gleiche Anzahl; die knappe Rückverweisung bleibt erhalten.
- source_word: fluentes lac et mel
  choice: aus denen Milch und Honig fließen
  rationale: Im Deutschen wird die Beziehung der fließenden Quellen zu Milch und Honig natürlich mit einem Relativsatz ausgedrückt.
- source_word: montes inmensos septem
  choice: sieben gewaltige Berge
  rationale: „Gewaltig“ gibt die Größe und Eindrücklichkeit von „inmensos“ in würdigem, heutigem Deutsch wieder.
- source_word: habentes rosam et lilium
  choice: auf denen Rosen und Lilien wachsen
  rationale: Das lateinische „haben“ wird idiomatisch als Bewuchs ausgedrückt; die Singularformen „rosam“ und „lilium“ sind kollektiv verstanden.
- source_word: in quibus gaudio replebo
  choice: Dort werde ich deine Kinder mit Freude erfüllen
  rationale: „Dort“ greift die unmittelbar zuvor genannten Berge auf. Das im vorgelegten lateinischen Ausschnitt nicht ausgedrückte Objekt wird entsprechend dem überlieferten Kontext und der konsultierten Fassung als „deine Kinder“ wiedergegeben.
theological_decisions:
- issue: Bezug von „in quibus“
  choice: 'örtlicher Bezug auf die sieben Berge: „Dort“'
  alternative: 'instrumentaler Bezug: „durch sie“'
  rationale: Das lateinische „in quibus“ bezeichnet am natürlichsten den Ort und bewahrt die Bildwelt der Berge.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. Der am Anfang stehende Rest „fructibus“ gehört syntaktisch zur vorausgehenden Aussage und wird in diesem Vers nicht nochmals wiedergegeben. Der lange lateinische Satz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
