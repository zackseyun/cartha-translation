  source_fidelity: 'Die Übersetzung gibt die im Ausschnitt fortgeführte Aufzählung sachgerecht wieder: „ebenso viele“ bewahrt die rückverweisende Quantitätsangabe von „totidem“, die Quellen fließen mit Milch und Honig, und die sieben „gewaltigen“ Berge entsprechen den „montes inmensos“. Der örtliche Bezug von „in quibus“ auf die Berge wird mit „Dort“ angemessen aufgenommen. Das im lateinischen Ausschnitt ausgelassene, im Kontext überlieferte Objekt „deine Kinder“ ist wie in der englischen Audit-Fassung sinnvoll ergänzt.'
