  text: Do not fear, mother of children, for I have chosen you, says the Lord.
translation:
  language: de
  text: Fürchte dich nicht, Mutter der Kinder, denn ich habe dich erwählt, spricht der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Noli timere
  choice: Fürchte dich nicht
  rationale: Die geläufige und würdevolle deutsche Wiedergabe des lateinischen Verbots mit timere; der Singular entspricht der angeredeten Mutter.
- source_word: mater filiorum
  choice: Mutter von Kindern
  rationale: Gibt die Genitivverbindung bewusst eng wieder, ohne durch »deiner Kinder« eine im Lateinischen nicht ausdrücklich markierte Zuordnung einzutragen.
- source_word: elegi
  choice: habe … erwählt
  rationale: Das Perfekt wird als vollendete Wahl wiedergegeben; »erwählt« bewahrt den feierlichen und theologischen Klang von eligere.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Idiomatiche deutsch-biblische Redeeinleitung, die den Sinn von dicit dominus natürlich und würdevoll wiedergibt.
theological_decisions:
- issue: Bezug und Bedeutung der Erwählung
  choice: 'Die Aussage bleibt allgemein: »ich habe dich erwählt«.'
  alternative: Eine nähere Bestimmung des Zwecks oder der heilsgeschichtlichen Identität der Mutter.
  rationale: Der lateinische Text nennt weder Zweck noch nähere Identität der Erwählten; diese Offenheit wird nicht interpretierend aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Formulierung bleibt nah am lateinischen Ausgangstext und vermeidet konfessionelle Zusätze.
