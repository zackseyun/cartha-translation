base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: de
  text: Verschaffe der Witwe Recht, sprich der Waise Recht, gib dem Bedürftigen, beschütze das Waisenkind, bekleide den Nackten. Kümmere dich um den Verletzten und Schwachen; den Lahmen …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das vorgelegte lateinische Textsegment bricht nach „den Lahmen“ ab; die dazugehörige Aussage ist daher unvollständig.
    reason: Kennzeichnet den abrupten Abbruch der Vorlage, ohne claudum unbelegt dem vorhergehenden Verb zuzuordnen oder den fehlenden Text zu ergänzen.
lexical_decisions:
- source_word: iustifica
  choice: Verschaffe … Recht
  rationale: Das lateinische Verb bezeichnet hier nicht eine abstrakte Rechtfertigungslehre, sondern die Aufforderung, der Witwe zu ihrem Recht zu verhelfen.
- source_word: pupillo iudica
  choice: sprich Recht für die Waise
  rationale: Die Wendung gibt die rechtliche Fürsprache beziehungsweise ein gerechtes Urteil zugunsten der Waise wieder.
- source_word: egenti
  choice: dem Bedürftigen
  rationale: Entspricht dem Dativ von egens und bewahrt den allgemeinen Sinn einer Person in Not.
- source_word: orfanum tuere
  choice: beschütze das Waisenkind
  rationale: tuere fordert aktiven Schutz; Waisenkind ist im heutigen Deutsch natürlich und unterscheidet die Formulierung leicht vom vorhergehenden pupillus.
- source_word: Confractum et debilem
  choice: den Gebrochenen und Schwachen
  rationale: Die beiden substantivierten Adjektive bleiben als unterschiedliche, zugleich semantisch überlappende Bezeichnungen erhalten.
- source_word: cura
  choice: Kümmere dich um
  rationale: Gibt die fürsorgliche Aufforderung natürlich wieder, ohne den stärkeren Sinn „heilen“ in das Verb einzutragen.
- source_word: claudum
  choice: den Gelähmten
  rationale: Bezeichnet eine gehbehinderte beziehungsweise lahme Person; die Form bleibt als Akkusativ erhalten, weil das überlieferte Segment an dieser Stelle abbricht.
theological_decisions:
- issue: Bedeutung von iustifica
  choice: sozial-rechtliche Wendung „Verschaffe der Witwe Recht“
  alternative: „Rechtfertige die Witwe“
  rationale: Der Reihenkontext fordert gerechtes Handeln zugunsten Schutzbedürftiger; eine dogmatisch-technische Lesart wäre hier irreführend.
- issue: Zuordnung von claudum
  choice: als unvollständig anschließendes Satzglied sichtbar belassen
  alternative: 'als weiteres Objekt von cura wiedergeben: „kümmere dich … um den Gelähmten“'
  rationale: Im vorgelegten lateinischen Segment steht claudum nach cura, doch sein regierendes Verb fehlt offenbar am Segmentende. Die Übersetzung soll diese textliche Unvollständigkeit nicht stillschweigend auflösen.
translation_notes:
  register: Moderne, würdevolle Imperativreihe mit verständlicher Rechtssprache. Die Zeichensetzung gliedert die Fürsorgegebote und macht den unvollständigen Schluss transparent. Das am Anfang der gelieferten Quelle stehende „filios tuos.“ gehört erkennbar zum vorausgehenden Satz und wird entsprechend der Versabgrenzung der konsultierten englischen Fassung hier nicht aufgenommen.
