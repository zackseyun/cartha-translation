review_pass:
  verdict: revise
  source_fidelity: Die Imperativreihe gibt die vorgelegte lateinische Vorlage insgesamt zuverlässig wieder. Der Satz bricht jedoch mit dem Akkusativ claudum tatsächlich ab; dies muss sichtbar bleiben. Claudus bedeutet primär „lahm“ und nicht zwingend „gelähmt“. Confractus lässt sich in diesem Fürsorgekontext natürlicher als „verletzt“ denn als die im Deutschen missverständliche Personenbezeichnung „der Gebrochene“ wiedergeben.
  naturalness: „Sprich Recht für die Waise“ ist weniger idiomatisch als „Sprich der Waise Recht“. Die revidierte Fassung wahrt den knappen, würdevollen Stil einer Imperativreihe und markiert den unvollständigen letzten Satzteil ohne eine Ergänzung zu erfinden.
  terminology: „Der Lahme“ entspricht claudum präzise und ohne die stärkere medizinische Festlegung von „der Gelähmte“. „Der Verletzte und Schwache“ gibt Confractum et debilem verständlich und unterscheidbar wieder. Die rechtliche Formel „der Witwe Recht verschaffen / der Waise Recht sprechen“ ist kontextgerecht und nicht dogmatisch aufgeladen.
  issues:
  - severity: medium
    issue: claudum ist mit „den Gelähmten“ zu eng wiedergegeben.
    rationale: Claudus bezeichnet vorrangig eine lahme bzw. gehbehinderte Person; eine Lähmung ist möglich, aber nicht vom lateinischen Wort gefordert.
  - severity: low
    issue: „sprich Recht für die Waise“ ist im modernen Standarddeutsch unidiomatisch.
    rationale: Die etablierte deutsche Rechtswendung lautet „jemandem Recht sprechen“.
  - severity: low
    issue: „den Gebrochenen“ ist als Personenbezeichnung im Deutschen missverständlich.
    rationale: Confractus kann körperliche Verletzung bzw. Zerschlagenheit bezeichnen; „den Verletzten“ ist hier natürlich und wahrt den fürsorglichen Reihenkontext.
