source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mittam tibi adiutorium pueros meos Isaiam et Hieremiam, ad quorum consilium sanctificaui et paraui tibi arbores xii grauatās uariis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/018.yaml
  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: de
  text: 'Ich werde dir Hilfe senden: meine Diener Jesaja und Jeremia. Auf ihren Rat hin habe ich für dich zwölf Bäume geheiligt und vorbereitet, die mit vielerlei Früchten beladen sind,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adiutorium
  choice: Hilfe
  rationale: Gibt das lateinische Substantiv unmittelbar und natürlich wieder; der folgende Akkusativ erläutert, worin diese Hilfe besteht.
- source_word: pueros meos
  choice: meine Diener
  rationale: Lateinisch puer kann hier einen Untergebenen oder Diener bezeichnen; im Zusammenhang mit Jesaja und Jeremia ist „Diener“ würdiger und sachgerechter als „Jungen“.
- source_word: ad quorum consilium
  choice: Nach ihrem Rat
  rationale: Bewahrt den instrumentalen beziehungsweise richtungsbezogenen Sinn der Wendung, ohne die mögliche Rolle ihres Rates weiter auszudeuten.
- source_word: sanctificaui et paraui
  choice: habe ich … geheiligt und bereitet
  rationale: Erhält beide Verben und damit die Unterscheidung zwischen Weihe und Vorbereitung.
- source_word: arbores xii grauatās uariis
  choice: zwölf Bäume … die mit vielerlei Früchten beladen sind
  rationale: „Mit vielerlei Früchten“ folgt der durch die englische Konsultationsschicht bestätigten inhaltlichen Ergänzung; das überlieferte lateinische „variis“ ist offenbar elliptisch beziehungsweise am Versende unvollständig.
theological_decisions:
- issue: Bezeichnung Jesajas und Jeremias als pueri Gottes
  choice: meine Diener
  alternative: meine Knechte
  rationale: „Diener“ bewahrt die Beziehung des Dienstes, ohne einen unnötig altertümlichen oder sozial stärker belasteten Ausdruck einzuführen.
- issue: Bezug von ad quorum consilium
  choice: Nach ihrem Rat habe ich …
  alternative: Für ihren Rat habe ich … / gemäß ihrem Plan habe ich …
  rationale: Die gewählte Form lässt offen, wie genau der Rat der Propheten an der Heiligung und Bereitung beteiligt ist, und löst die theologische Spannung nicht weiter auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die beiden Prädikate des Lateinischen bleiben erhalten. Das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeführt wird.
