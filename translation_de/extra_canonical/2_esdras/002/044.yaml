source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Tunc interrogaui angelum et dixi: qui sunt hi, domine?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/044.yaml
  text: Then I asked the angel and said, “Who are these, lord?”
translation:
  language: de
  text: 'Da fragte ich den Engel und sagte: »Wer sind diese, Herr?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc
  choice: Da
  rationale: Gibt den zeitlich-fortführenden Übergang im Deutschen natürlich und knapp wieder.
- source_word: interrogaui angelum et dixi
  choice: fragte ich den Engel
  rationale: Das lateinische Doppelprädikat »fragte … und sagte« ist eine semitisch geprägte Redeformel; im heutigen Deutsch bringt »fragte« die volle Funktion natürlich zum Ausdruck.
- source_word: qui sunt hi
  choice: Wer sind diese
  rationale: Bewahrt die direkte Frage und den deiktischen Bezug von »hi« ohne zusätzliche Bestimmung.
- source_word: domine
  choice: Herr
  rationale: Gibt die respektvolle direkte Anrede ohne den im Lateinischen nicht ausdrücklich vorhandenen Possessivzusatz »mein« wieder.
theological_decisions:
- issue: Bezug der Anrede »domine«
  choice: Herr
  alternative: mein Herr
  rationale: Die Anrede gilt im unmittelbaren Satz dem Engel. »Herr« bewahrt den Wortlaut und vermeidet sowohl einen nicht ausgedrückten Possessivzusatz als auch eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Zusammenziehung von »interrogaui … et dixi« vermeidet eine im Deutschen schwerfällige wörtliche Doppelung, ohne Inhalt zu verlieren.
