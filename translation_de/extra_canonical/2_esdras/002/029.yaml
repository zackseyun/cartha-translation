lexical_decisions:
- source_word: mater
  choice: Mutter
  rationale: Gibt die direkte Anrede des lateinischen Substantivs ohne Ergänzung wieder.
- source_word: cum filiis tuis
  choice: mit deinen Kindern
  rationale: Natürliches modernes Deutsch; »filiis« kann Kinder beziehungsweise Söhne bezeichnen, und der Zusammenhang legt die umfassendere Wiedergabe »Kinder« nahe.
- source_word: eripiam
  choice: werde dich retten
  rationale: Gibt das Herausreißen oder Befreien aus Gefahr in klarem, gegenwärtigem Deutsch wieder.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Bewahrt die traditionelle prophetische Redeformel in würdigem, geläufigem Deutsch.
theological_decisions:
- issue: Unvollständige Anrede im lateinischen Ausgangstext
  choice: 'Die Satzellipse bleibt erhalten: »Mutter, mit deinen Kindern«.'
  alternative: Ein nicht belegtes Verb ergänzen, etwa »Freue dich« oder »Komm«.
  rationale: Im vorgelegten lateinischen Text steht kein entsprechendes Verb. Eine Ergänzung würde die Textgrundlage überschreiten und die echte syntaktische Uneindeutigkeit beseitigen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die auffällige Ellipse des lateinischen Textes wird bewusst nicht geglättet.
