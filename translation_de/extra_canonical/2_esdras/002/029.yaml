  source_fidelity: 'Die Übersetzung gibt die lateinischen Elemente präzise wieder: „Mutter“ für mater, „mit deinen Kindern“ für cum filiis tuis, die begründende Konjunktion „denn“ für quia sowie die Zukunftsaussage „ich werde dich retten“ für ego te eripiam. Die im Ausgangstext vorhandene elliptische Anrede wird nicht durch ein unbelegtes Verb ergänzt.'
