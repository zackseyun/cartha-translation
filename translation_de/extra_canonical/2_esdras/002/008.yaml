  source_fidelity: 'Die Übersetzung gibt die lateinische Anrede und den Inhalt zuverlässig wieder: „Vae tibi“ = „Wehe dir“, „Assur“ angemessen als „Assyrien“, „abscondis iniquos“ als „du verbirgst die Ungerechten“ und „gens mala“ als fortgeführter Vokativ „Du böses Volk“. „Bei dir“ bewahrt die offene Bedeutung von „penes te“ (bei, in der Obhut bzw. im Bereich von dir), ohne sie unzulässig zu präzisieren.'
