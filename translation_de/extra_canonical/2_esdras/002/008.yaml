base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/008.yaml
  text: Woe to you[a], Assyria, who hide the unrighteous with you! O evil nation,
translation:
  language: de
  text: Wehe dir, Assyrien – du verbirgst die Ungerechten bei dir![a] Du böses Volk,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in deiner Mitte.'
    reason: Die lateinische Wendung „penes te“ kann sowohl „bei dir“ als auch räumlicher „in deiner Mitte“ verstanden werden.
lexical_decisions:
- source_word: Assur
  choice: Assyrien
  rationale: Die lateinische Bezeichnung wird als geläufiger deutscher Ländername wiedergegeben; die direkte Anrede bleibt erhalten.
- source_word: iniquos
  choice: die Ungerechten
  rationale: Die substantivierte Personenbezeichnung bewahrt den moralisch-rechtlichen Sinn des lateinischen Ausdrucks, ohne ihn auf bestimmte Verbrechen einzuengen.
- source_word: penes te
  choice: bei dir
  rationale: Die knappe Wendung kann Nähe, Aufnahme oder Verfügungsbereich ausdrücken. „Bei dir“ bildet diese Offenheit unmittelbarer ab als eine stärker ausdeutende Formulierung.
- source_word: gens mala
  choice: Du böses Volk
  rationale: Die Formulierung gibt den eigenständigen Vokativ wieder und bewahrt den Übergang zum folgenden Satz beziehungsweise Vers.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Gedankenstrich ermöglicht eine natürliche direkte Anrede, ohne die lateinische Zweite-Person-Form abzuschwächen. Das abschließende Komma bleibt stehen, weil der Vokativ in den folgenden Vers hineinführt.
