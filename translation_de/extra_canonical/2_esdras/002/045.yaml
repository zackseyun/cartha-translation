  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: de
  text: 'Er antwortete mir: »Das sind die, die das sterbliche Gewand abgelegt und das unsterbliche angezogen haben und sich zum Namen Gottes bekannt haben. Nun werden sie gekrönt und empfangen Palmzweige.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam
  choice: das sterbliche Gewand
  rationale: Bewahrt das Bild eines ablegbaren Kleidungsstücks; »Gewand« klingt im Deutschen natürlicher und würdevoller als das wörtlichere »Tunika«.
- source_word: inmortalem [tunicam]
  choice: das unsterbliche [Gewand]
  rationale: Das im Lateinischen elliptisch ausgelassene Substantiv wird im Deutschen sinngemäß mitverstanden; die substantivierte Form erhält die knappe Parallelstruktur.
- source_word: confessi sunt nomen dei
  choice: sich zum Namen Gottes bekannt haben
  rationale: Gibt »confiteri« als öffentliches Bekenntnis wieder und behält den ungewöhnlichen, theologisch bedeutsamen Ausdruck »Name Gottes« bei.
- source_word: coronantur
  choice: werden sie gekrönt
  rationale: Entspricht dem präsentischen Passiv und vermeidet eine nicht ausdrücklich genannte handelnde Person.
- source_word: accipiunt palmas
  choice: empfangen Palmzweige
  rationale: »Palmas« bezeichnet hier Siegespalmen; »Palmzweige« macht den konkreten Gegenstand für heutige Leser verständlich, ohne die Symbolik auszudeuten.
theological_decisions:
- issue: Bedeutung des Ablegens des sterblichen und Anziehens des unsterblichen Gewandes
  choice: Die Kleidungsmetapher bleibt ohne erklärende Festlegung erhalten.
  alternative: Explizite Deutung als Auferstehung, Verwandlung oder Eintritt in den Himmel.
  rationale: Der lateinische Text benennt den Vorgang bildhaft und lässt seine genaue heilsgeschichtliche Einordnung offen.
- issue: Symbolik der Palmzweige
  choice: Der konkrete Bildausdruck »Palmzweige« bleibt stehen.
  alternative: Deutende Wiedergabe als »Siegespreis« oder »Zeichen des Sieges«.
  rationale: Die Übersetzung soll die traditionelle Symbolik bewahren, ohne deren Bedeutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Struktur des lateinischen Satzes und seine präsentische Schlussaussage werden bewahrt.
