  text: that you may give them over to shame and their mother to plundering, so that
translation:
  language: de
  text: damit du sie der Schande und ihre Mutter der Plünderung preisgibst, damit nicht
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusionem
  choice: Schande
  rationale: Das lateinische Wort bezeichnet hier Beschämung bzw. Schmach; „Schande“ ist im Deutschen natürlich und wahrt den gerichtlichen Ton.
- source_word: in direptionem
  choice: der Plünderung
  rationale: Die Wendung bezeichnet die Preisgabe zur Plünderung; in Verbindung mit dem ersten Satzglied wird „preisgibst“ sinngemäß mitgeführt.
- source_word: matrem eorum
  choice: ihre Mutter
  rationale: Die personifizierende Rede des Ausgangstextes bleibt unverändert erhalten, ohne die Identität der „Mutter“ aus dem Kontext heraus festzulegen.
- source_word: ne
  choice: damit nicht
  rationale: Da der Vers als syntaktisch offener Übergang endet, bleibt auch die deutsche Fassung bewusst unvollständig und führt in den folgenden Text weiter.
theological_decisions:
- issue: Personifizierung der „Mutter“
  choice: Wörtlich als „ihre Mutter“ beibehalten
  alternative: Als Stadt, Nation oder Gemeinschaft ausdeuten
  rationale: Der lateinische Text benennt die Bezugsgröße nicht ausdrücklich; eine konkrete Deutung würde die echte Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Preisgabe an Schande und Plünderung wird knapp wiedergegeben; der abschließende, syntaktisch offene Anschluss „damit nicht“ entspricht dem fragmentarischen Versende.
