source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ad angelum: ille iuuenis quis est, qui eis coronas inponit et palmas in manus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
translation:
  language: de
  text: 'Und ich sagte zu dem Engel: „Wer ist jener junge Mann, der ihnen Kronen aufsetzt und Palmzweige in die Hände legt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et
  choice: Und
  rationale: Bewahrt die einfache anknüpfende Konjunktion des Lateinischen; anders als „Dann“ macht „Und“ keine zusätzliche zeitliche Abfolge ausdrücklich.
- source_word: iuuenis
  choice: jener junge Mann
  rationale: „Junger Mann“ gibt das substantivierte lateinische Adjektiv natürlich wieder; „jener“ entspricht dem hinweisenden „ille“.
- source_word: coronas inponit
  choice: Kronen aufsetzt
  rationale: Das lateinische „inponere“ bezeichnet hier das Aufsetzen beziehungsweise Auflegen von Kronen; „aufsetzt“ ist im Deutschen idiomatisch und anschaulich.
- source_word: palmas
  choice: Palmzweige
  rationale: Im Zusammenhang mit dem Tragen in den Händen sind Palmzweige gemeint; das bloße „Palmen“ wäre im modernen Deutschen missverständlich.
- source_word: in manus
  choice: in die Hände legt
  rationale: Das lateinische Verb „inponit“ regiert elliptisch sowohl die Kronen als auch die Palmzweige. Im Deutschen wird für den zweiten Gegenstand ein passendes Verb ergänzt, um die Aussage natürlich und eindeutig wiederzugeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Frage und das demonstrative „jener“ bewahren die Anschaulichkeit des lateinischen Textes. Die verbale Ergänzung „legt“ löst lediglich die im Lateinischen mögliche Ellipse idiomatisch auf, ohne den Sinn theologisch auszudeuten.
