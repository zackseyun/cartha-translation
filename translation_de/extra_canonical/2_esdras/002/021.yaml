  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: de
  text: Verspotte den Lahmen[a] nicht; beschütze den Versehrten und lass den Blinden meine Herrlichkeit sehen. Bewahre Alte und Junge innerhalb deiner Mauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht in diesem Versabschnitt nur: „Verspotte nicht.“ Das Objekt „den Lahmen“ ergibt sich aus dem unmittelbar vorausgehenden lateinischen Wort, das bei der Verseinteilung am Ende von Vers 20 steht.'
    reason: source_boundary
lexical_decisions:
- source_word: inridere noli
  choice: Verspotte … nicht
  rationale: Gibt das lateinische Verbot natürlich und präzise wieder; das im vorliegenden Versabschnitt unausgesprochene Objekt wird aus dem unmittelbar vorausgehenden „claudum“ ergänzt.
- source_word: mancum
  choice: den Versehrten
  rationale: Bezeichnet einen Menschen mit einer körperlichen Schädigung oder fehlenden Gliedmaßen. „Versehrter“ ist würdig und weiter als das zu enge „Lahmer“.
- source_word: tutare
  choice: beschütze
  rationale: Entspricht dem Imperativ des deponentischen Verbs „tutari“ und bewahrt den fürsorglich-schützenden Sinn.
- source_word: caecum ad uisionem claritatis meae admitte
  choice: gewähre dem Blinden, meine Herrlichkeit zu schauen
  rationale: Eine natürliche deutsche Wiedergabe von „zur Schau meiner claritas zulassen“. „Herrlichkeit“ erfasst hier den sichtbaren Glanz göttlicher Majestät, ohne die Spannung aufzulösen, dass gerade der Blinde schauen soll.
- source_word: Senem et iuuenem
  choice: Alte und Junge
  rationale: Die generischen Singularformen werden im Deutschen idiomatisch als umfassendes Gegensatzpaar wiedergegeben.
- source_word: intra muros tuos serua
  choice: Bewahre … innerhalb deiner Mauern
  rationale: Folgt sowohl dem Schutzgedanken von „serva“ als auch der räumlichen Aussage von „intra muros tuos“.
theological_decisions:
- issue: Der Blinde wird zum Schauen der göttlichen Herrlichkeit zugelassen
  choice: gewähre dem Blinden, meine Herrlichkeit zu schauen
  alternative: nimm den Blinden auf, damit er den Glanz meiner Herrlichkeit sieht
  rationale: Die knappe Form bewahrt die im Latein angelegte eschatologische beziehungsweise wundersame Spannung, ohne ausdrücklich Heilung oder eine nur bildliche Bedeutung einzutragen.
- issue: Unausgesprochenes Objekt von „inridere noli“ an der Versgrenze
  choice: den Lahmen aus dem vorausgehenden Kontext ergänzen und mit einer Fußnote kennzeichnen
  alternative: 'objektlos: „Spotte nicht“'
  rationale: „Claudum“ steht nach der überlieferten Satzstruktur unmittelbar vor „inridere noli“, wurde aber durch die Versabgrenzung dem vorherigen Vers zugeschlagen. Die Ergänzung stellt den syntaktischen Zusammenhang verständlich her, während die Fußnote die Textlage offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Imperative bleiben direkt und parallel. Personenbezeichnungen wie „Versehrter“ vermeiden abwertende oder unnötig medizinische Sprache; zugleich bleibt die konkrete körperliche Bedeutung des lateinischen Textes erhalten.
