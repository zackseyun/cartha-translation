  yaml_path: translation/extra_canonical/2_esdras/002/023.yaml
  text: and I will give you the first seat in my resurrection[23]. Pause and rest[a],
translation:
  language: de
  text: und ich werde dir den ersten Platz in meiner Auferstehung geben.[a] Ruhe und sei still,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den ersten Sitz in meiner Auferstehung“. Gemeint ist wahrscheinlich Vorrang oder Ehre bei der Auferstehung, nicht lediglich ein Sitzplatz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: primam sessionem
  choice: den ersten Platz
  rationale: Wörtlich bezeichnet die Wendung einen „ersten Sitz“. Im Deutschen vermittelt „der erste Platz“ natürlicher den wahrscheinlichen Sinn von Vorrang oder Ehre, ohne das Bild eines Sitzes unnötig zu konkretisieren.
- source_word: in resurrectione mea
  choice: bei meiner Auferstehung
  rationale: „Bei“ gibt den zeitlich-sachlichen Zusammenhang idiomatisch wieder. Das lateinische in kann auch „in“ bedeuten; diese Möglichkeit wird nicht dogmatisch ausgeschlossen.
- source_word: Pausa et quiesce
  choice: Ruhe und sei still
  rationale: Spätlateinisch pausare bedeutet hier eher „ruhen“ als lediglich eine Tätigkeit kurz zu unterbrechen; quiescere ergänzt den Gedanken durch Stille und ungestörte Ruhe.
theological_decisions:
- issue: Bedeutung des „ersten Platzes“ bei der Auferstehung
  choice: Die Rang- oder Ehrenvorstellung bleibt im Text erhalten, ohne sie näher zu erklären.
  alternative: Die Wendung als bloßen Sitzplatz oder als fest bestimmte heilsgeschichtliche Rangordnung auslegen.
  rationale: Der lateinische Wortlaut spricht von einem „ersten Sitz“, bestimmt aber weder die genaue Art des Vorrangs noch seine theologischen Voraussetzungen.
- issue: Bezug von „meiner Auferstehung“
  choice: Die erste Person des lateinischen Textes wird unverändert beibehalten.
  alternative: Den Bezug erklärend auf die allgemeine Auferstehung oder ausdrücklich auf die Auferstehung Christi festlegen.
  rationale: Der knappe Ausschnitt lässt den Sprecherbezug stehen; eine weitergehende Identifikation würde die vorhandene Mehrdeutigkeit auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Ruhe und sei still“ bewahrt den feierlich-eschatologischen Klang des spätlateinischen Doppelausdrucks. Der Fußnotenmarker [a] steht unmittelbar nach dem erklärungsbedürftigen Satzteil.
