  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/024.yaml
  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: de
  text: Mein Volk, denn deine Ruhe wird kommen. Du gute Amme, nähre deine Kinder und stärke ihre Füße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populus meus
  choice: Mein Volk
  rationale: Die lateinische Wortgruppe ist als direkte Anrede wiedergegeben.
- source_word: requies tua
  choice: deine Ruhe
  rationale: Bewahrt das konkrete Bild der kommenden Ruhe, ohne es deutend als Rettung oder Frieden festzulegen.
- source_word: Nutrix bona
  choice: Du gute Amme
  rationale: „Amme“ gibt die fürsorgliche weibliche Bezugsperson präzise und in einem würdigen Register wieder; „du“ macht die Anrede im Deutschen natürlich.
- source_word: nutri
  choice: nähre
  rationale: Entspricht dem Imperativ und bewahrt die Verbindung zum Bild der Amme.
theological_decisions:
- issue: Bedeutung der kommenden „Ruhe“
  choice: deine Ruhe wird kommen
  alternative: deine Ruhezeit wird kommen / du wirst Frieden finden
  rationale: Die wörtlich-bildhafte Formulierung lässt offen, ob endzeitliche Ruhe, Trost, Frieden oder Befreiung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und die direkte Anrede bleiben eng am Latein; „Du gute Amme“ vermeidet zugleich eine im Deutschen abgehackte Nominalanrede. Der bereitgestellte lateinische Ausschnitt endet nach „nutri“; die im konsultierten englischen Text bezeugte Fortsetzung wurde für die vollständige Versfassung berücksichtigt.
