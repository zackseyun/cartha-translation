source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'memorare quid fecerim Sodomae et Gomorrae, Quorum terra iacet in picis glebis et aggeribus cinerum: sic dabo eos qui me non audierunt, dicit dominus omnipotens.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: de
  text: Denk daran, was ich Sodom und Gomorra angetan habe. Ihr Land liegt da, bedeckt mit Pechklumpen und Aschehaufen. Ebenso werde ich mit denen verfahren[a], die nicht auf mich gehört haben, spricht der Herr, der Allmächtige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »So werde ich jene geben«; möglicherweise auch: »So werde ich jene hingeben.«'
    reason: Das lateinische sic dabo eos ist ungewöhnlich. Spätlateinisches dare kann hier im Sinn von ‚tun‘ oder ‚verfahren‘ gebraucht sein, doch die wörtliche Bedeutung ‚geben‘ beziehungsweise ‚hingeben‘ bleibt als Möglichkeit bestehen.
lexical_decisions:
- source_word: memorare
  choice: Denk daran
  rationale: Der lateinische Singularimperativ wird direkt und in modernem Standarddeutsch wiedergegeben.
- source_word: picis glebis
  choice: Pechklumpen
  rationale: Bewahrt das konkrete Bild von festen Klumpen oder Schollen aus Pech, ohne eine unnatürliche deutsche Formulierung zu erzwingen.
- source_word: aggeribus cinerum
  choice: Aschehaufen
  rationale: Gibt das sichtbare Bild aufgehäufter Asche klar und quellennah wieder.
- source_word: sic dabo eos
  choice: Ebenso werde ich mit denen verfahren
  rationale: Das ungewöhnliche spätlateinische dare wird im Zusammenhang als ‚tun/verfahren‘ verstanden und nimmt quid fecerim sinngemäß wieder auf. Eine Fußnote bewahrt die formale Mehrdeutigkeit.
- source_word: dominus omnipotens
  choice: der Herr, der Allmächtige
  rationale: Die traditionelle und zugleich allgemein verständliche Wiedergabe erhält beide Titel.
theological_decisions:
- issue: Art des angekündigten Gerichts in sic dabo eos
  choice: Ebenso werde ich mit denen verfahren
  alternative: So werde ich jene hingeben
  rationale: Der Kontext stellt das kommende Handeln Gottes parallel zu seinem Handeln an Sodom und Gomorra. ‚Hingeben‘ würde deutlicher ein Überlassen oder Ausliefern ausdrücken, das im lateinischen Kontext nicht zwingend gemeint ist; die Fußnote hält diese Möglichkeit offen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Singularimperativ bleibt erhalten. Der lange lateinische Relativsatz wurde für bessere Verständlichkeit in zwei Sätze gegliedert; die drastischen Sachbilder des Gerichts bleiben konkret.
