revisions:
- from: Diejenigen, die aus dem Schatten der Weltzeit hinübergegangen sind, haben vom Herrn strahlende Gewänder empfangen.
  to: Diejenigen, die aus dem Schatten des Zeitalters hinübergegangen sind, haben vom Herrn prächtige Gewänder empfangen.
  rationale: Die Revision ersetzt die unidiomatische und semantisch stärker festlegende Wiedergabe „Weltzeit“ durch „Zeitalter“ und gibt splendidas mit „prächtige“ wieder. Die Satzselbstständigkeit, die bildhafte Bewegung und die theologische Offenheit des lateinischen Textes bleiben erhalten. Eine Fußnote ist nicht erforderlich.
