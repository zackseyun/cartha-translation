  yaml_path: translation/extra_canonical/2_esdras/002/039.yaml
  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: de
  text: Diejenigen, die aus dem Schatten des Zeitalters hinübergegangen sind, haben vom Herrn prächtige Gewänder empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui
  choice: Diejenigen, die
  rationale: Die substantivisch gebrauchte Relativkonstruktion bildet das Subjekt des selbstständigen Satzes und wird im Deutschen so klar und natürlich wiedergegeben.
- source_word: se de umbra saeculi transtulerunt
  choice: aus dem Schatten der Weltzeit hinübergegangen sind
  rationale: „Hinübergegangen“ wahrt die Bewegung aus einem Bereich heraus, ohne genauer festzulegen, ob Tod, Entrückung oder ein anderer Übergang gemeint ist. „Weltzeit“ erhält die zeitliche und weltbezogene Bedeutungsbreite von „saeculum“.
- source_word: splendidas tunicas
  choice: strahlende Gewänder
  rationale: „Gewänder“ passt zum feierlichen Kontext besser als das engere „Tuniken“; „strahlend“ gibt den Glanz von „splendidus“ wieder.
- source_word: a domino acceperunt
  choice: haben vom Herrn … empfangen
  rationale: Die Formulierung gibt Herkunft beziehungsweise Geber und den vollendeten Empfang idiomatisch wieder.
theological_decisions:
- issue: Deutung des Übergangs aus dem Schatten der Weltzeit
  choice: hinübergegangen
  alternative: sich aus dem Schatten der Weltzeit entfernt
  rationale: Die gewählte Fassung lässt offen, worin der Übergang genau besteht, und vermeidet eine ausdrückliche Gleichsetzung mit Tod, Auferstehung oder Entrückung.
- issue: Eigenständigkeit des Satzes
  choice: Diejenigen, die …, haben … empfangen
  alternative: die … hinübergegangen sind und … empfangen haben
  rationale: „Qui“ leitet hier eine substantivische Relativkonstruktion als Subjekt zu „acceperunt“ ein; die Übersetzung wahrt daher den eigenständigen Hauptsatz und fügt kein unbelegtes „und“ ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Sprache und die Mehrdeutigkeit von „saeculum“ bleiben erhalten; der Satz wird grammatisch als eigenständige Aussage wiedergegeben.
