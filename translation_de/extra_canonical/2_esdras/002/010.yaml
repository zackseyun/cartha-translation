source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus ad Ezram: adnuntia populo meo, quoniam dabo eis regnum Hierusalem, quod daturus eram Israel.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: de
  text: 'So spricht der Herr zu Esra: Verkünde meinem Volk, dass ich ihm das Reich von Jerusalem geben werde, das ich Israel geben wollte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntia
  choice: Verkünde
  rationale: Gibt den öffentlichen und verbindlichen Charakter des lateinischen Imperativs natürlich wieder.
- source_word: populo meo
  choice: meinem Volk
  rationale: Entspricht direkt dem lateinischen Dativ und bewahrt die Zugehörigkeitsaussage.
- source_word: regnum Hierusalem
  choice: das Reich Jerusalem
  rationale: Bewahrt die ungewöhnliche und möglicherweise mehrdeutige lateinische Verbindung, ohne sie zu »Königreich Jerusalem« oder »Herrschaft über Jerusalem« zu präzisieren.
- source_word: quod daturus eram
  choice: das ich … geben wollte
  rationale: Gibt die rückblickende Absicht der periphrastischen Form idiomatisch wieder, ohne zu behaupten, die Gabe sei bereits erfolgt.
theological_decisions:
- issue: Verhältnis von »meinem Volk« zu »Israel«
  choice: Die unterschiedlichen Bezeichnungen bleiben unverändert nebeneinander stehen.
  alternative: »meinem Volk Israel« oder eine ausdrückliche Unterscheidung zwischen zwei Völkern
  rationale: Der lateinische Text lässt das genaue Verhältnis offen; eine Identifizierung oder Gegenüberstellung würde die theologische Spannung unzulässig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache; die auffällige Wendung »das Reich Jerusalem« bleibt wegen ihrer möglichen inhaltlichen Mehrdeutigkeit bewusst erhalten.
