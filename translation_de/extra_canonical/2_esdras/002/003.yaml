  yaml_path: translation/extra_canonical/2_esdras/002/003.yaml
  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: de
  text: Ich habe euch mit Freude großgezogen und euch mit Trauer und Kummer verloren,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui
  choice: habe … großgezogen
  rationale: Das lateinische educare bezeichnet hier das Aufziehen und Erziehen von Kindern; „großgezogen“ ist im modernen Deutsch natürlich und bewahrt das familiäre Bild.
- source_word: cum laetitia
  choice: mit Freude
  rationale: Gibt die begleitende Haltung bzw. Lebenslage knapp und idiomatisch wieder.
- source_word: amisi
  choice: verloren
  rationale: Bewahrt die starke, bewusst nicht näher erklärte Aussage des lateinischen Verbs amittere.
- source_word: cum luctu et tristitia
  choice: mit Trauer und Kummer
  rationale: 'Erhält die beiden verwandten, aber unterscheidbaren Begriffe: luctus bezeichnet besonders Trauer bzw. Klage über einen Verlust, tristitia allgemeinen Kummer oder Betrübnis.'
theological_decisions:
- issue: Art und Ursache des Verlustes
  choice: „verloren“ bleibt ohne nähere Erklärung
  alternative: „musste euch unter Trauer und Kummer verlieren“ oder eine Deutung als Tod, Abfall beziehungsweise Verbannung
  rationale: Der lateinische Text nennt weder Ursache noch Art des Verlustes; die Übersetzung wahrt diese Offenheit und die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „mit Freude … mit Trauer und Kummer“ wird beibehalten; das abschließende Komma folgt dem vorgelegten Versausschnitt.
