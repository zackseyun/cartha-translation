id: 2ES.2.41
reference: 2 Esdras 2:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: de
  text: Die volle Zahl deiner Kinder, nach denen du dich gesehnt hast, ist erreicht. Bitte um die Macht des Herrn, dass dein Volk, das von Anfang an berufen wurde, geheiligt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Textgrundlage beginnt an dieser Stelle mit den isolierten Wörtern „des Herrn vollendet haben“ (domini compleuerunt), die syntaktisch zum vorausgehenden Zusammenhang gehören und hier nicht als Teil dieses Satzes wiedergegeben werden.
    reason: textual_boundary
lexical_decisions:
- source_word: Filiorum tuorum ... plenus est numerus
  choice: Die volle Zahl deiner Kinder ... ist erreicht
  rationale: Gibt die lateinische Aussage idiomatisch und zugleich eng wieder; „die Zahl ist voll“ wäre im heutigen Deutsch weniger natürlich.
- source_word: quos optabas
  choice: nach denen du dich gesehnt hast
  rationale: optare bezeichnet hier ein starkes Wünschen oder Ersehnen; die Formulierung passt natürlich zu den erhofften Kindern.
- source_word: roga imperium domini
  choice: Bitte die Macht des Herrn
  rationale: Bewahrt imperium als Macht beziehungsweise hoheitliche Gewalt, ohne es auf einen bloßen Befehl oder eine bestimmte institutionelle Autorität zu verengen.
- source_word: sanctificetur
  choice: geheiligt wird
  rationale: Das theologisch gewichtige Passiv des lateinischen Verbs wird bewahrt.
- source_word: uocatus est ab initio
  choice: von Anfang an berufen wurde
  rationale: uocare wird in diesem Zusammenhang als „berufen“ wiedergegeben; ab initio bleibt zeitlich offen und wird nicht weiter gedeutet.
theological_decisions:
- issue: Bezug des Relativsatzes qui uocatus est ab initio
  choice: unmittelbarer Bezug auf „dein Volk“
  alternative: nachgestellte Formulierung, die den Bezug lockerer erscheinen lässt
  rationale: Genus und Numerus sowie die lateinische Wortstellung weisen eindeutig auf populus tuus; die deutsche Stellung macht diesen Bezug klar, ohne den Sinn zu erweitern.
- issue: Bedeutung von imperium domini
  choice: „die Macht des Herrn“
  alternative: „die Autorität des Herrn“ oder „die Herrschaft des Herrn“
  rationale: „Macht“ hält die Bandbreite von imperium offen und lässt die ungewöhnliche Anrede einer göttlichen Macht bestehen, statt sie stillschweigend zu „Bitte den Herrn“ umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „Bitte die Macht des Herrn“ folgt bewusst der lateinischen Formulierung und glättet sie nicht zu einer direkten Bitte an den Herrn.
