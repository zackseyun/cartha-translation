source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: de
  text: Denn ihr habt vor Gott, dem Herrn, gesündigt und getan, was vor mir böse ist. Was aber soll ich jetzt für euch tun? Denn ich bin eine Witwe und verlassen. Geht, meine Kinder, und bittet den Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: vor Gott, dem Herrn
  rationale: Gibt die beiden Gottesbezeichnungen des Lateinischen in natürlicher deutscher Apposition wieder, ohne eine im Ausgangstext nicht vorhandene nähere Bestimmung einzufügen.
- source_word: quod malum est coram me fecistis
  choice: getan, was vor mir böse ist
  rationale: Bewahrt die Perspektive von coram me und folgt der schlichten, anklagenden Formulierung des Ausgangstextes.
- source_word: uidua sum et derelicta
  choice: ich bin eine Witwe und verlassen
  rationale: Gibt sowohl den Witwenstand als auch das Verlassensein wieder und erhält die eindringliche Selbstbeschreibung.
- source_word: petite a domino
  choice: bittet den Herrn
  rationale: Petere mit a kann hier als an den Herrn gerichtetes Bitten verstanden werden. Die Formulierung lässt den Gegenstand der Bitte offen und fügt insbesondere nicht „um Erbarmen“ hinzu.
theological_decisions:
- issue: Nicht genannter Gegenstand der Bitte
  choice: bittet den Herrn
  alternative: erbittet es vom Herrn / bittet den Herrn um Erbarmen
  rationale: Der lateinische Text nennt keinen Gegenstand. Die Übersetzung bewahrt diese Offenheit und vermeidet eine theologische Ergänzung.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, eindringlicher Rede. Die ungewöhnliche Verbindung „eine Witwe und verlassen“ wird bewusst beibehalten, da sie beide Prädikate des lateinischen Textes knapp wiedergibt.
