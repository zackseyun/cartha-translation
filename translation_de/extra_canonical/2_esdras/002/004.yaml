  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des lateinischen Textes vollständig und ohne sachliche Ergänzung wieder: die Sünde vor Gott, das Tun des Bösen vor der Sprecherin, die ratlose Frage, ihre Selbstbeschreibung als Witwe und Verlassene sowie die offene Aufforderung, den Herrn zu bitten. Besonders angemessen ist, dass bei „petite a domino“ kein Gegenstand wie „um Erbarmen“ ergänzt wird.'
  naturalness: Die Formulierung ist moderne, würdige Standardsprache und behält den knappen, klagenden Duktus der Rede. „eine Witwe und verlassen“ ist leicht markiert, aber verständlich und für die bewusst parallele Wiedergabe von „uidua ... et derelicta“ gut vertretbar.
  terminology: „Gott, dem Herrn“ gibt „domino deo“ idiomatisch als Apposition wieder. „bittet den Herrn“ wahrt die im Lateinischen offene Bitte und stimmt mit der englischen Audit-Entscheidung überein.
