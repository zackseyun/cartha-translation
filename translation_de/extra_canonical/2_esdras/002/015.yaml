  source_fidelity: Der Entwurf gibt die Anrede, die drei Imperative und die Gottesrede insgesamt zuverlässig wieder. „Festige ihre Schritte“ deutet jedoch das konkrete lateinische Bild „confirma pedes eorum“ („stärke ihre Füße“) um und ersetzt den ausdrücklich genannten Körperteil durch eine abstraktere Bewegungsmetapher.
  naturalness: „Mutter, nimm deine Kinder in die Arme“ ist im modernen Standarddeutsch idiomatisch und bewahrt den liebevollen Imperativ. „Stärke ihre Füße“ ist auch im Deutschen verständlich und im biblisch-würdigen Register natürlich.
  terminology: „erwählt“ und „spricht der Herr“ entsprechen dem biblischen Register angemessen. Der Vergleich „wie eine Taube“ bleibt, wie im Lateinischen, in seiner genauen syntaktischen und bildlichen Zuordnung offen.
