    rationale: Lateinisch steht ausdrücklich „pedes eorum“. Da die Formulierung ohne Härte wörtlich übersetzt werden kann, sollte „Füße“ beibehalten werden, um die Bildsprache und mögliche Anklänge nicht abzuschwächen.
