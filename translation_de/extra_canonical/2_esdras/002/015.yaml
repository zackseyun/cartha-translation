source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mater, complectere filios tuos, educa illos cum laetitia sicut columba, confirma pedes eorum, quoniam te elegi, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/015.yaml
  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: de
  text: Mutter, nimm deine Kinder in die Arme; zieh sie mit Freude auf wie eine Taube; stärke ihre Füße, denn ich habe dich erwählt, spricht der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: complectere
  choice: schließe … in die Arme
  rationale: Gibt die konkrete, liebevolle Bedeutung von „umarmen“ natürlich und würdevoll wieder.
- source_word: educa
  choice: zieh … auf
  rationale: Im Zusammenhang mit Kindern bezeichnet das Verb ihr Aufziehen und Großziehen, nicht bloß Belehrung.
- source_word: cum laetitia
  choice: mit Freude
  rationale: Direkte und idiomatische Entsprechung, die die freudige Art des Aufziehens ausdrückt.
- source_word: sicut columba
  choice: wie eine Taube
  rationale: Bewahrt das ausdrücklich genannte, in seiner genauen Beziehung etwas offene Vergleichsbild.
- source_word: confirma pedes eorum
  choice: festige ihre Schritte
  rationale: Überträgt das wörtliche Bild von der Stärkung ihrer Füße in eine natürliche deutsche Wendung, ohne den Gedanken an sicheren Stand und Weg auf eine einzelne Deutung festzulegen.
- source_word: elegi
  choice: erwählt
  rationale: Entspricht dem biblisch geprägten Sinn von Gottes Auswahl und wahrt das gehobene Register.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Etablierte, würdige deutsche Formel für eine göttliche Redeaussage.
theological_decisions:
- issue: Bezug und Sinn des Taubenvergleichs
  choice: 'Das Bild bleibt unmittelbar nach „mit Freude aufziehen“ stehen: „zieh sie mit Freude auf wie eine Taube“.'
  alternative: Den Vergleich ausdrücklich auf die Mutter, ihre Fürsorge oder ihre Freude beziehen.
  rationale: Der lateinische Wortlaut lässt die genaue Vergleichsebene offen; die Übersetzung bewahrt diese Spannung, statt das Bild auszudeuten.
- issue: Bedeutung von „confirma pedes eorum“
  choice: „festige ihre Schritte“
  alternative: „stärke ihre Füße“ oder deutend „gib ihnen sicheren Halt“.
  rationale: Die gewählte Formulierung erhält das Weg- und Standbild, klingt im modernen Deutsch jedoch natürlicher als eine streng anatomische Wiedergabe und vermeidet eine theologische Verengung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-biblischem Ton. Der Imperativcharakter und die mütterliche Bildsprache des lateinischen Textes bleiben erhalten; Satzbau und Zeichensetzung folgen einem natürlichen deutschen Lesefluss.
