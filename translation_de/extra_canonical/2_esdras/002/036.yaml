  source_fidelity: 'Die Übersetzung gibt den lateinischen Imperativ "Fugite … accipite" sachgerecht wieder. "Schatten dieses Zeitalters" bewahrt die Bildlichkeit von umbra und den weltzeitlichen Sinn von saeculum. "Freude eurer Herrlichkeit" entspricht accipite iucunditatem gloriae vestrae ohne unnötige Auslegung. Entscheidend ist "testor palam saluatorem meum": Die Wiedergabe als öffentliche Anrufung des Retters zum Zeugen trifft die lateinische Konstruktion mit persönlichem Akkusativ und vermeidet zutreffend die ungenauere Bedeutung, über den Retter Zeugnis abzulegen.'
