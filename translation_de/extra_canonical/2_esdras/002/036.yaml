  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: de
  text: Flieht den Schatten dieses Zeitalters; empfangt die Freude eurer Herrlichkeit. Ich rufe offen meinen Retter zum Zeugen an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Sinn einer feierlichen Bekräftigung: „Ich rufe meinen Retter öffentlich als Zeugen an.“'
    reason: Die Fußnote verdeutlicht die idiomatische Bedeutung von testor mit persönlichem Akkusativ und verhindert die mögliche Fehlauffassung „Zeugnis über meinen Retter ablegen“.
lexical_decisions:
- source_word: Fugite umbram saeculi huius
  choice: Flieht den Schatten dieses Zeitalters
  rationale: Die im überlieferten Ausschnitt nur angeschnittene Satzhälfte wird nach dem breiteren lateinischen Textbestand wiedergegeben. „Zeitalter“ bewahrt den zeitlich-weltzeitlichen Sinn von saeculum besser als das rein räumliche „Welt“.
- source_word: accipite iucunditatem gloriae vestrae
  choice: empfangt die Freude eurer Herrlichkeit
  rationale: „Empfangt“ entspricht dem auffordernden accipite; „Freude“ gibt iucunditas natürlich und verständlich wieder, ohne die mehrdeutige „Herrlichkeit“ (gloria) näher auszulegen.
- source_word: ego testor palam saluatorem meum
  choice: Ich rufe offen meinen Retter zum Zeugen an
  rationale: testor mit persönlichem Akkusativ bedeutet idiomatisch, jemanden als Zeugen anzurufen. palam wird mit „offen“ wiedergegeben; saluator erscheint in natürlichem modernem Deutsch als „Retter“.
theological_decisions:
- issue: Funktion des Retters in der Aussage
  choice: Der Retter wird als Zeuge angerufen.
  alternative: Der Sprecher legt offen Zeugnis über den Retter ab.
  rationale: Die Konstruktion testor + persönlicher Akkusativ stützt die Anrufung als Zeugen. Die alternative Deutung würde die syntaktische Funktion von saluatorem meum verändern und die Aussage theologischer umdeuten.
translation_notes:
  register: Kurze, feierliche Aufforderungen in modernem Standarddeutsch. Die parallele Satzstruktur und der würdige Ton bleiben erhalten; ungebräuchliche oder konfessionell geprägte Formulierungen werden vermieden.
