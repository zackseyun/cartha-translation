  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: de
  text: 'Er antwortete und sagte mir: „Er ist der Sohn Gottes[a], zu dem sie sich in dieser Welt bekannt haben.“ Da begann ich, diejenigen zu preisen, die für den Namen des Herrn mutig eingestanden waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ausdrückliche Identifizierung der gekrönten Gestalt als „Sohn Gottes“ ist kennzeichnend für die spätere christliche Kompositionsschicht dieses Kapitels. Sie sollte nicht unkritisch in die jüdische Apokalypse der Kapitel 3–14 zurückgelesen werden.
    reason: compositional_layer
lexical_decisions:
- source_word: ipse est filius dei
  choice: Er ist der Sohn Gottes
  rationale: Direkte und formnahe Wiedergabe der ausdrücklichen Identifizierung im lateinischen Text.
- source_word: quem ... confessi sunt
  choice: zu dem sie sich ... bekannt haben
  rationale: Confiteri bezeichnet hier das öffentliche Bekennen zu einer Person; die deutsche Formulierung klingt natürlich und bewahrt diesen Sinn.
- source_word: in saeculo
  choice: in dieser Welt
  rationale: Saeculum kann „Zeitalter“ oder „Welt“ bedeuten. Im Kontext bezeichnet es wahrscheinlich das gegenwärtige irdische Leben; „in dieser Welt“ ist im Deutschen verständlich, ohne die zeitliche Dimension völlig auszuschließen.
- source_word: magnificare
  choice: preisen
  rationale: Gibt das ehrende Hervorheben der Standhaften in natürlichem, würdevollem Deutsch wieder.
- source_word: pro nomine Domini fortiter steterunt
  choice: für den Namen des Herrn mutig eingestanden waren
  rationale: Folgt der durch die konsultierte englische Fassung bezeugten Fortsetzung des am Ende des bereitgestellten lateinischen Ausschnitts abgebrochenen Relativsatzes und gibt fortiter stare idiomatisch wieder.
theological_decisions:
- issue: Identität der gekrönten Gestalt
  choice: „der Sohn Gottes“ unverändert und ausdrücklich wiedergegeben
  alternative: Die Gestalt allgemeiner als Messias oder Erwählter bezeichnen
  rationale: Der lateinische Wortlaut identifiziert sie ausdrücklich als filius dei; diese christologische Aussage darf weder abgeschwächt noch harmonisierend umformuliert werden.
- issue: Bedeutung von in saeculo
  choice: „in dieser Welt“
  alternative: „in dem Zeitalter“
  rationale: Beide Bedeutungen sind sprachlich möglich. Die gewählte Fassung ist im Zusammenhang natürlicher; die verbleibende Mehrdeutigkeit wird nicht für eine bestimmte Endzeitlehre vereinnahmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich zu jemandem bekennen“ und „für den Namen des Herrn einstehen“ sind für heutige Leser verständlich und bewahren zugleich den feierlichen, bekenntnishaften Ton. Der bereitgestellte lateinische Ausschnitt bricht nach qui ab; der Abschluss des Satzes wurde anhand der auditierten englischen Konsultationsfassung wiedergegeben.
