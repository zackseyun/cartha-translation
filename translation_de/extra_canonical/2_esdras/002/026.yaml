id: 2ES.2.26
reference: 2 Esdras 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: de
  text: Keiner von ihnen wird umkommen, denn ich werde sie aus deiner Schar zurückfordern. Sei nicht besorgt, denn wenn der Tag der Bedrängnis und Angst kommt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interiet
  choice: wird umkommen
  rationale: Gibt das futurische lateinische Verb natürlich und mit seiner ernsten Bedeutung wieder, ohne die Art des Untergangs näher festzulegen.
- source_word: requiram
  choice: werde … zurückfordern
  rationale: Bewahrt den Anspruchs- und Verantwortlichkeitsaspekt von requirere; im Deutschen ist „von dir zurückfordern“ verständlicher als eine wörtliche Wiedergabe mit „verlangen“.
- source_word: de numero tuo
  choice: von dir
  rationale: Das lateinische Idiom bezeichnet hier offenbar die der angesprochenen Person anvertraute Schar. Eine wörtliche Wiedergabe „aus deiner Zahl“ wäre im modernen Deutsch missverständlich.
- source_word: Noli satagere
  choice: Sei nicht besorgt
  rationale: Trifft die kontextuelle Bedeutung des Verbots in natürlichem, würdigem Deutsch.
- source_word: pressurae et angustiae
  choice: der Bedrängnis und Angst
  rationale: Erhält die Doppelung und Spannung der beiden lateinischen Begriffe; „Bedrängnis“ bezeichnet die äußere Not, „Angst“ deren bedrückende Enge beziehungsweise innere Wirkung.
theological_decisions:
- issue: Gottes Anspruch auf die anvertrauten Menschen
  choice: „ich werde sie von dir zurückfordern“
  alternative: „ich werde sie aus deiner Zahl verlangen“
  rationale: Die Übersetzung lässt den Gedanken göttlicher Rechenschaftspflicht bestehen, ohne zu erklären, auf welche konkrete Personengruppe oder Form der Verantwortung er sich bezieht.
- issue: Reichweite von „nemo ex eis“
  choice: „Keiner von ihnen“
  alternative: „Niemand von ihnen“
  rationale: Die maskuline Form bleibt gruppenbezogen und bestimmt weder Identität noch Heilsstatus der Gruppe näher.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der am Versende offene Nebensatz und das abschließende Komma werden beibehalten, da der lateinische Text syntaktisch in den folgenden Vers weiterführt.
