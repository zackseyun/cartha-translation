lexical_decisions:
- source_word: filios tuos
  choice: deine Kinder
  rationale: Gibt den lateinischen Akkusativ Plural natürlich und ohne unnötige geschlechtliche Verengung wieder.
- source_word: confirma
  choice: stärke
  rationale: Entspricht dem Imperativ und bewahrt das Bild körperlicher Festigung.
- source_word: pedes eorum
  choice: ihre Füße
  rationale: Wörtliche, im Deutschen verständliche Wiedergabe des lateinischen Ausdrucks.
- source_word: Seruos
  choice: Die Diener
  rationale: Gibt servos in einem würdigen, allgemein verständlichen Register wieder; der Akkusativ hängt syntaktisch vom folgenden Vers ab.
- source_word: quos tibi dedi
  choice: die ich dir gegeben habe
  rationale: Bewahrt Relativsatz, Empfängerbezug und perfektischen Aspekt.
theological_decisions:
- issue: Unvollständiger Satz am Versende
  choice: Die Diener, die ich dir gegeben habe,
  alternative: Den Satz mit Material aus Vers 26 vervollständigen
  rationale: Der bereitgestellte lateinische Quellabschnitt endet mitten im Satz. Die Übersetzung wahrt diese Versgrenze und importiert keinen Text aus dem Folgevers.
- issue: Bezug und Funktion von enim
  choice: denn
  alternative: weglassen oder als „ja“ wiedergeben
  rationale: Enim wird ausdrücklich wiedergegeben, obwohl der begründende Zusammenhang erst im weiteren Kontext vollständig erkennbar ist; die Spannung wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fragmentarische Syntax am Anfang und Ende wird entsprechend dem vorgegebenen lateinischen Versabschnitt beibehalten.
