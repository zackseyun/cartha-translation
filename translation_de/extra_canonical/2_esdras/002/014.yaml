  verdict: revise
  source_fidelity: 'Die doppelte Anredeform wird korrekt als emphatisch wiederholter Imperativ bewahrt. »Beseitigt« ist für omisi jedoch zu stark: omittere bezeichnet hier eher ein Beiseitetun bzw. Ablegen als die Aussage, das Böse sei vernichtet. Die vorgeschlagene Fußnote bietet zudem eine grammatisch wenig tragfähige Alternative, da testare ein Imperativ Singular ist und somit nicht unmittelbar als Aufforderung an »Himmel und Erde« im Plural gelesen werden kann.'
  naturalness: Die Übersetzung ist im Ganzen würdig und gut verständlich. »Das Böse beiseitegetan« ist modernes Standarddeutsch und gibt die vorsichtigere Aussage des Lateinischen natürlich wieder. Die Wiederholung »Rufe, rufe« bleibt als bewusst rhetorische, gehobene Form angemessen.
  terminology: »Himmel und Erde zu Zeugen rufen«, »das Gute geschaffen« und »spricht der Herr« sind treffend. Die zweimalige kausale Anknüpfung mit »denn« entspricht enim und quia und sollte nicht harmonisiert werden.
