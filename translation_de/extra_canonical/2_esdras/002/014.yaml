source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Testare, testare caelum et terram, omisi enim malum et creaui bonum, quia uiuo ego, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/014.yaml
  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: de
  text: Rufe, rufe Himmel und Erde zu Zeugen! Denn ich habe das Böse beiseitegetan und das Gute geschaffen; denn ich lebe, spricht der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Testare, testare
  choice: Rufe, rufe … zu Zeugen
  rationale: Das lateinische testare ist hier am ehesten als wiederholter Imperativ im Sinn von »zu Zeugen rufen« zu verstehen. Die Wiederholung bewahrt den nachdrücklichen, dringlichen Ton.
- source_word: omisi … malum
  choice: ich habe das Böse beseitigt
  rationale: omittere kann »wegschaffen, beseitigen, fahren lassen« bedeuten. »Beseitigt« gibt den Gegensatz zum anschließenden Erschaffen des Guten natürlich wieder, ohne näher zu bestimmen, auf welche Weise das Böse entfernt wurde.
- source_word: creaui bonum
  choice: das Gute geschaffen
  rationale: Die direkte Wiedergabe erhält sowohl das Schöpfungsverb als auch den substantivischen Gegensatz zwischen dem Bösen und dem Guten.
- source_word: quia uiuo ego
  choice: denn ich lebe
  rationale: Die betonte lateinische Aussage wird eng am Wortlaut wiedergegeben. Eine Umformung zu »So wahr ich lebe« wäre idiomatischer als Schwurformel, würde diese Funktion aber eindeutiger festlegen, als es der Wortlaut selbst tut.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: »Spricht der Herr« entspricht dem würdevollen, in deutschen Bibelübersetzungen geläufigen prophetischen Sprachgebrauch.
theological_decisions:
- issue: Verhältnis zwischen Gottes Beseitigung des Bösen und Erschaffung des Guten
  choice: Die parallele Aussage wird ohne erklärenden Zusatz bewahrt.
  alternative: Die Aussage kosmologisch, moralisch oder endzeitlich näher bestimmen.
  rationale: Der Vers selbst erläutert weder den Umfang noch den Zeitpunkt der beiden Handlungen; eine Präzisierung würde eine theologische Deutung in den Text eintragen.
- issue: Funktion von »quia uiuo ego«
  choice: Wörtlich-kausal als »denn ich lebe« wiedergegeben.
  alternative: Als Schwurformel »So wahr ich lebe« wiedergeben.
  rationale: Der Kontext kann eine feierliche Selbstbekräftigung nahelegen, doch die formale kausale Verbindung des lateinischen Textes bleibt in der Hauptübersetzung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der doppelte Imperativ wird wegen seiner rhetorischen Bedeutung beibehalten; das Semikolon hält die eng verbundenen Gottesaussagen zusammen, ohne die wiederholte Begründungspartikel einzuebnen.
