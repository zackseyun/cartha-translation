  - severity: medium
    issue: Die Fußnote präsentiert eine sprachlich nicht gleichwertige Deutung.
    rationale: testare ist Imperativ Singular. Eine direkte Aufforderung an die zwei genannten Instanzen müsste im Lateinischen eine Pluralform erwarten lassen. Die alternative deutsche Lesart sollte daher nicht als echte Übersetzungsalternative stehen bleiben.
