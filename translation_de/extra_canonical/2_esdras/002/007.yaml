review_pass:
  verdict: revise
  source_fidelity: Die zweite und dritte Bitte sowie die Begründung geben den lateinischen Text präzise wieder. In der ersten Klausel steht im erhaltenen Latein jedoch positiv „generatio eorum fiat“ („ihre Nachkommenschaft soll entstehen/werden“). „soll ein Ende nehmen“ ist zwar kontextuell verständlich und folgt der englischen Audit-Fassung, ist aber nicht vom überlieferten Wortlaut gedeckt.
  naturalness: „Ihre Nachkommenschaft soll entstehen“ ist modernes, verständliches Standarddeutsch, auch wenn die Aussage im Kontext auffällig wirkt. Die parallelen Formulierungen mit „sollen“ bewahren den gerichtlichen bzw. wunschhaften Ton.
  terminology: „Völker“, „getilgt“, „verachtet“ und insbesondere „Bund“ für testamentum sind treffend. Es sind keine theologischen Zusätze enthalten.
  issues:
  - severity: medium
    issue: Die erste Klausel wird inhaltlich zu einer negativen Verwünschung umgedeutet.
    rationale: Der Text liest „generatio eorum fiat“; eine Negation oder ein Ausdruck für Aufhören fehlt. Der Kontext und die englische Audit-Fassung legen zwar eine verderbte oder anders zu verstehende Lesart nahe, erlauben aber nicht, die positive Formulierung im Haupttext ohne Wahrung der Textunsicherheit zu ersetzen.
  revised_text: Ihre Nachkommenschaft soll entstehen.[a] Sie sollen unter die Völker zerstreut werden; ihre Namen sollen von der Erde getilgt werden, denn sie haben meinen Bund verachtet.
  revised_footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Wortlaut lautet wörtlich etwa: „Ihre Nachkommenschaft soll entstehen“ oder „soll werden“. Das steht in Spannung zum folgenden Gerichtswort; daher wird teils angenommen, dass der Text hier verderbt ist oder eine negative Aussage gemeint war.'
    reason: Bewahrt die auffällige, im Kontext möglicherweise textkritisch problematische Formulierung des lateinischen Textes, ohne die naheliegende Deutung zu verschweigen.
  revision_rationale: Die erste Klausel wird auf den überlieferten lateinischen Wortlaut zurückgeführt. Die Fußnote dokumentiert die kontextuelle und textkritische Schwierigkeit, statt eine nicht ausdrücklich bezeugte negative Bedeutung in den Haupttext zu übernehmen. Der übrige Text bleibt unverändert.
