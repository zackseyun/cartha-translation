  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: de
  text: Ihre Nachkommenschaft soll ein Ende nehmen.[a] Sie sollen unter die Völker zerstreut werden; ihre Namen sollen von der Erde getilgt werden, denn sie haben meinen Bund verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Wortlaut ist hier ungewöhnlich und lautet wörtlich etwa: „Ihre Nachkommenschaft soll entstehen.“ Im Zusammenhang ist wahrscheinlich gemeint, dass ihre Nachkommenschaft aufhören soll.'
    reason: Kennzeichnet eine echte Spannung zwischen dem erhaltenen lateinischen Wortlaut und dem im Zusammenhang naheliegenden imprekatorischen Sinn.
lexical_decisions:
- source_word: generatio eorum fiat
  choice: Ihre Nachkommenschaft soll ein Ende nehmen
  rationale: „generatio“ bezeichnet hier die Nachkommenschaft. Der überlieferte lateinische Wortlaut ist in dieser Form auffällig und wörtlich eher affirmativ; im Zusammenhang wird die Klausel als Verwünschung verstanden. Die textliche Unsicherheit wird in einer Fußnote offengelegt.
- source_word: Dispergantur in gentes
  choice: Sie sollen unter die Völker zerstreut werden
  rationale: Gibt den passivischen Jussiv und „gentes“ natürlich und würdig wieder.
- source_word: nomina eorum deleantur a terra
  choice: ihre Namen sollen von der Erde getilgt werden
  rationale: „tilgen“ bewahrt die starke Bedeutung von „deleantur“ und die bildhafte Vorstellung, dass ihre Namen von der Erde verschwinden.
- source_word: spreuerunt testamentum meum
  choice: sie haben meinen Bund verachtet
  rationale: „testamentum“ bedeutet in diesem biblischen Zusammenhang „Bund“; „verachtet“ entspricht der bewussten Geringschätzung in „spreverunt“.
theological_decisions:
- issue: Imprekatorischer Sinn der ersten Klausel trotz auffälliger lateinischer Form
  choice: Als Wunsch nach dem Ende ihrer Nachkommenschaft übersetzt und mit Fußnote gekennzeichnet
  alternative: 'Wörtlich: „Ihre Nachkommenschaft soll entstehen“ bzw. „soll werden“'
  rationale: Die wörtliche Alternative widerspricht dem unmittelbar folgenden Gerichtswort und wahrscheinlich auch der intendierten Aussage. Da der erhaltene Wortlaut die negative Bedeutung jedoch nicht ausdrücklich enthält, wird die Spannung nicht verschwiegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die wiederholte Form „sollen“ bewahrt den Charakter einer feierlichen Gerichtserklärung.
