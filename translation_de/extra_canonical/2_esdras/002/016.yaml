  source_fidelity: 'Die Übersetzung gibt die lateinische Satzstruktur und die zentralen Ausdrücke zuverlässig wieder: Futurformen („werde … auferwecken“, „herausführen“), die voneinander unterschiedenen Herkunftsangaben „von ihren Orten“ und „aus den Gräbern“ sowie das göttliche Subjekt von „cognoui“. „Habe meinen Namen in ihnen erkannt“ ist eine vertretbare, idiomatischere Wiedergabe des schwierigen lateinischen Perfekts, ohne die im Text nicht stehende Konjektur „sie haben meinen Namen erkannt“ zu übernehmen.'
