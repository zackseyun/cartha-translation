  terminology: „Tote“, „auferwecken“ und „Gräber“ sind im Kontext sachgerecht und registergerecht. Die Anmerkung erläutert die textlich und semantisch auffällige Schlussklausel transparent und wahrt die Überlieferungslage sowie die Unsicherheit, entsprechend der englischen Audit-Spur.
