source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et resuscitabo mortuos de locis suis et de monumentis educam illos, quoniam cognoui nomen meum in illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: de
  text: Und ich werde die Toten von ihren Orten auferwecken und sie aus den Gräbern herausführen, denn ich habe meinen Namen in ihnen erkannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nur lateinisch überliefert. Wörtlicher, aber im Deutschen ungewöhnlich: „denn ich habe meinen Namen in ihnen gekannt“. Die lateinische Formulierung kann auch im Sinn von „ich erkenne meinen Namen in ihnen“ verstanden werden. Mitunter wird vermutet: „denn sie haben meinen Namen erkannt“; das steht jedoch nicht im überlieferten Text.'
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo
  choice: werde … auferwecken
  rationale: Gibt das Futur und den Zusammenhang der Auferweckung von den Toten präzise und idiomatisch wieder.
- source_word: de locis suis
  choice: von ihren Orten
  rationale: Bewahrt die ungewöhnliche, aber verständliche räumliche Formulierung des lateinischen Textes, ohne sie mit „Gräbern“ gleichzusetzen, die erst im folgenden Satzglied genannt werden.
- source_word: de monumentis educam illos
  choice: sie aus den Gräbern herausführen
  rationale: „monumenta“ bezeichnet hier Grabstätten; „herausführen“ bildet das Bewegungsmoment von „educam“ ab.
- source_word: cognoui
  choice: habe … erkannt
  rationale: Das Perfekt von „cognoscere“ kann ein Erkennen bzw. Wiedererkennen ausdrücken. Diese Wiedergabe ist im Deutschen natürlicher als „habe … gekannt“ und lässt die Aussage bei Gott als Subjekt bestehen.
theological_decisions:
- issue: Bedeutung von „cognoui nomen meum in illis“
  choice: denn ich habe meinen Namen in ihnen erkannt
  alternative: denn sie haben meinen Namen erkannt / denn mein Name ist unter ihnen bekannt
  rationale: Der überlieferte lateinische Text hat Gott als Subjekt von „cognoui“. Die Übersetzung wahrt diese grammatische Gestalt und deutet sie nicht durch eine Konjektur oder Passivumschreibung um.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Formulierung „von ihren Orten“ bleibt erhalten; der schwierige Schlusssatz wird lesbar wiedergegeben, ohne das Subjekt des lateinischen Textes zu ändern.
