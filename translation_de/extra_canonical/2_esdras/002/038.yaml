  yaml_path: translation/extra_canonical/2_esdras/002/038.yaml
  text: He has called the heavenly kingdom. Rise and stand, and see the number
translation:
  language: de
  text: Er hat die himmlischen Reiche gerufen.[a] Steht auf und bleibt stehen und seht die Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: berufen oder eingeladen.'
    reason: Das lateinische vocavit kann je nach Zusammenhang „rief“, „berief“ oder „lud ein“ bedeuten; der ungewöhnliche Gegenstand „die himmlischen Reiche“ lässt die genaue Nuance offen.
lexical_decisions:
- source_word: caelestia regna
  choice: die himmlischen Reiche
  rationale: Bewahrt den Akkusativ Plural des lateinischen Textes; die Wiedergabe im Singular wäre grammatisch nicht quellennah.
- source_word: uocauit
  choice: gerufen
  rationale: Gibt das breite Bedeutungsspektrum von vocare wieder, ohne zwischen »rufen«, »berufen« und »einladen« vorschnell zu entscheiden.
- source_word: Surgite et state
  choice: Steht auf, stellt euch hin
  rationale: 'Unterscheidet die beiden aufeinanderfolgenden Imperative im natürlichen modernen Deutsch: zuerst das Aufstehen, dann das Einnehmen einer stehenden Haltung.'
- source_word: numerum
  choice: die Zahl
  rationale: Entspricht dem unbestimmten, am Versende abbrechenden Ausdruck; ein nicht im Quelltext genanntes Bezugswort wird nicht ergänzt.
theological_decisions:
- issue: Bezugsgröße von »die Zahl«
  choice: Ohne Ergänzung belassen
  alternative: Etwa »die Zahl der Versiegelten« oder eine andere Personengruppe ergänzen
  rationale: Der vorliegende lateinische Vers nennt das Gezählte nicht. Eine Ergänzung würde die offene Fortsetzung auslegen und nicht übersetzen.
translation_notes:
  register: Kurze, würdige Imperativfolge in modernem Standarddeutsch. Die ungewöhnliche Formulierung des lateinischen Ausgangstextes und der offene Satzanschluss am Versende bleiben erhalten.
