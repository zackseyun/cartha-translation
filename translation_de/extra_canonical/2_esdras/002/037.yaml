  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: de
  text: Empfangt vom Herrn die Freude eurer Herrlichkeit und freut euch; dankt dem, der euch in die himmlischen Königreiche berufen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier vorgelegte lateinische Ausschnitt beginnt und endet mitten im Satz. Die Ergänzung folgt dem überlieferten Verszusammenhang; einige Textfassungen geben den letzten Ausdruck im Singular wieder: „in das himmlische Königreich“.'
    reason: Die materielle Unvollständigkeit des bereitgestellten Quellenausschnitts und die Zahlvariante werden transparent gemacht.
lexical_decisions:
- source_word: domini
  choice: des Herrn
  rationale: Der Genitiv wird natürlich auf das im überlieferten Zusammenhang vorausgesetzte Objekt „Gabe“ bezogen.
- source_word: accipite
  choice: Empfangt
  rationale: Der Imperativ Plural wird direkt und würdig wiedergegeben.
- source_word: iocundamini
  choice: freut euch
  rationale: Natürliches modernes Deutsch für den pluralischen Imperativ; die Aufforderung zur Freude bleibt erhalten.
- source_word: gratias agentes
  choice: dankt
  rationale: Die lateinische Partizipialfügung wird idiomatisch als koordinierter Imperativ wiedergegeben.
- source_word: ei
  choice: dem
  rationale: Das Dativpronomen verweist auf Gott als den Empfänger des Dankes.
- source_word: qui uos ad
  choice: der euch in … berufen hat
  rationale: Das im gelieferten Auszug abgebrochene Relativgefüge wird entsprechend dem bezeugten Verszusammenhang und der geprüften Konsultationsschicht vervollständigt.
theological_decisions:
- issue: Singular oder Plural bei den himmlischen Reichen
  choice: die himmlischen Königreiche
  alternative: das himmlische Königreich
  rationale: Der Plural der Konsultationsschicht wird bewahrt; eine theologische Vereinheitlichung zum geläufigeren Singular würde die Textform unnötig glätten.
- issue: Gegenstand des Empfangens
  choice: die Gabe des Herrn
  alternative: die Freude eurer Herrlichkeit vom Herrn
  rationale: Der unmittelbar gelieferte lateinische Ausschnitt setzt vor „domini accipite“ ein Objekt voraus, überliefert es aber nicht. „Gabe“ entspricht dem bekannten lateinischen Verszusammenhang und ergibt eine klare Konstruktion; die englische Revisionsformulierung lässt sich aus dem hier vorgelegten lateinischen Wortlaut nicht sicher begründen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Partizipialkonstruktion wurde zugunsten eines flüssigen deutschen Imperativs aufgelöst; die Quellenunsicherheit wird nicht stillschweigend verdeckt.
