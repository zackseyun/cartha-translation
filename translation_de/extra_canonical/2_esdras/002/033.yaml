source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ut irem ad Israel; ad quos cum uenirem, reprobauerunt me et respuerunt mandatum domini. Ideoque uobis dico, gentes,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: de
  text: 'Ich, Esra, erhielt auf dem Berg Horeb vom Herrn den Auftrag, zu Israel zu gehen. Doch als ich zu ihnen kam, wiesen sie mich zurück und stießen das Gebot des Herrn von sich. Darum sage ich euch, ihr Völker:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reprobauerunt
  choice: wiesen … zurück
  rationale: Gibt die ausdrückliche Ablehnung der Person klar und idiomatisch wieder.
- source_word: respuerunt
  choice: stießen … von sich
  rationale: Bewahrt stärker als „verachteten“ den aktiven, nachdrücklichen Charakter von respuere („zurückweisen, von sich stoßen“), ohne das wörtliche Bild des Ausspuckens unnatürlich einzuführen.
- source_word: gentes
  choice: ihr Völker
  rationale: Gibt den Vokativ und die kollektive Anrede natürlich wieder; „Völker“ ist hier verständlicher und weniger missverständlich als „Heiden“.
theological_decisions:
- issue: Adressatenwechsel von Israel zu den gentes
  choice: „Darum sage ich euch, ihr Völker“
  alternative: „Darum sage ich euch, ihr Heiden“
  rationale: „Völker“ hält die ethnische und heilsgeschichtliche Spannung des Textes offen, ohne die pejorativen Nebenbedeutungen des heutigen Wortes „Heiden“ einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt am Ende bewahrt den Anschluss an die folgende Rede. Die zweifache Zurückweisung wird durch unterschiedliche, aber parallele Verben wiedergegeben.
