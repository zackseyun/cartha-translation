  source_fidelity: 'Die Übersetzung gibt die lateinische Syntax und Aussage vollständig wieder: Die Mutter als Handelnde, die sie geboren hat, die direkte Anrede im Plural sowie die Begründung mit Witwenschaft und Verlassensein. Das nicht im Lateinischen stehende Possessivpronomen wird zutreffend nicht ergänzt.'
