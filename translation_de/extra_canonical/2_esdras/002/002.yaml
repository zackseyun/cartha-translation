source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Mater, quae eos generauit, dicit illis : ite, filii, quia ego uidua sum et derelicta :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/002.yaml
  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: de
  text: 'Die Mutter, die sie geboren hat, sagt zu ihnen: »Geht, Kinder, denn ich bin eine Witwe und verlassen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater, quae eos generauit
  choice: Die Mutter, die sie geboren hat
  rationale: Gibt die lateinische Relativkonstruktion eng und zugleich natürlich wieder; »sie« bewahrt den Rückbezug auf die zuvor Genannten.
- source_word: ite, filii
  choice: Geht, Kinder
  rationale: Der Pluralimperativ »ite« wird direkt mit »Geht« wiedergegeben. »Kinder« entspricht hier der Anrede »filii«, ohne ein im Lateinischen nicht ausdrücklich vorhandenes »meine« hinzuzufügen.
- source_word: quia ego uidua sum et derelicta
  choice: denn ich bin eine Witwe und verlassen
  rationale: »Denn« gibt den begründenden Anschluss von »quia« wieder; »eine Witwe« und »verlassen« wahren die beiden Aussagen und die emphatische Ich-Aussage.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Bindung an den lateinischen Wortlaut. Die etwas spannungsvolle Verbindung von substantivischem »eine Witwe« und prädikativem »verlassen« bleibt erhalten.
