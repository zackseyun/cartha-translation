source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: latibulis terrae et misericordiam cum illis faciam, quoniam misericors sum, dicit dominus omnipotens. Amplectere natos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/031.yaml
  text: and I will show mercy to them, because I am merciful, says the Lord Almighty.
translation:
  language: de
  text: Und ich werde ihnen Barmherzigkeit erweisen, denn ich bin barmherzig, spricht der allmächtige Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam cum illis faciam
  choice: ich werde ihnen Barmherzigkeit erweisen
  rationale: Die lateinische Wendung bedeutet wörtlich, mit ihnen Barmherzigkeit zu üben; die gewählte Formulierung gibt dies natürlich und würdevoll wieder.
- source_word: misericors
  choice: barmherzig
  rationale: Bewahrt die direkte Wortverbindung zu „Barmherzigkeit“ und die Begründungsstruktur des lateinischen Textes.
- source_word: dicit
  choice: spricht
  rationale: Traditionelle, zugleich verständliche Einleitungsformel für eine göttliche Rede.
- source_word: dominus omnipotens
  choice: der allmächtige Herr
  rationale: Gibt Titel und Attribut in ihrer lateinischen Reihenfolge und Bedeutung klar wieder.
theological_decisions:
- issue: Gottes Barmherzigkeit als Grund seines Handelns
  choice: „denn ich bin barmherzig“
  alternative: „weil ich voller Erbarmen bin“
  rationale: Die knappe Aussage des Ausgangstextes bleibt erhalten, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das am Anfang der gelieferten Quelle stehende Fragment „latibulis terrae“ gehört syntaktisch zum vorausgehenden Satzteil und wird entsprechend der angegebenen Versabgrenzung und der englischen Konsultationsfassung hier nicht aufgenommen.
