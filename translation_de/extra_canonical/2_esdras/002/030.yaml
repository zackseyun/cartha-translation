  text: Denk an deine schlafenden Kinder; denn ich werde sie herausführen aus …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorgelegte lateinische Text bricht hier nach „de“ („aus/von“) ab. Die englische Konsultationsfassung ergänzt: „aus den verborgenen Orten der Erde“.'
