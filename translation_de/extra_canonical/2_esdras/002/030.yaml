lexical_decisions:
- source_word: memorare
  choice: Denk an
  rationale: Gibt den lateinischen Imperativ natürlich und würdig wieder, ohne eine über das Erinnern hinausgehende Bedeutung einzutragen.
- source_word: Filios tuos dormientes
  choice: deine schlafenden Kinder
  rationale: Bewahrt die partizipiale Formulierung und lässt offen, ob Schlaf wörtlich oder als Bild für den Tod gemeint ist.
- source_word: educam
  choice: ich werde sie herausführen
  rationale: Entspricht der Grundbedeutung von educere und passt zur anschließenden Präposition de, ohne das nicht erhaltene Ziel oder den Herkunftsort zu ergänzen.
theological_decisions:
- issue: Bedeutung des Schlafens
  choice: schlafenden
  alternative: verstorbenen
  rationale: Der Ausgangstext sagt dormientes und kann den Tod bildhaft bezeichnen; die Übersetzung bewahrt diese theologische Spannung, statt sie aufzulösen.
- issue: Nicht erhaltener Satzabschluss
  choice: Abbruch mit Auslassungspunkten
  alternative: Ergänzung „den verborgenen Orten der Erde“ nach der englischen Konsultationsfassung
  rationale: Der vorgelegte lateinische Text bricht nach de ab. Eine inhaltliche Ergänzung allein aus der englischen Konsultationsschicht wäre nicht unmittelbar durch die angegebene Originalsprachenevidenz gedeckt.
