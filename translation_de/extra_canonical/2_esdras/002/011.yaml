  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: de
  text: Und ich werde ihre Herrlichkeit an mich nehmen und ihnen ewige Wohnstätten geben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sumam mihi
  choice: werde … an mich nehmen
  rationale: Gibt sowohl das Nehmen als auch den Bezug auf den Sprecher wieder, ohne das lateinische mihi unnötig zu verstärken.
- source_word: gloriam illorum
  choice: ihre Herrlichkeit
  rationale: Bewahrt die knappe Genitivverbindung und die mögliche Bezugsspannung des lateinischen illorum; der Bezug wird nicht durch einen erklärenden Zusatz festgelegt.
- source_word: tabernacula aeterna
  choice: ewige Wohnstätten
  rationale: Tabernacula bezeichnet Wohn- oder Zeltstätten. „Wohnstätten“ ist im Deutschen würdig und verständlich und vermeidet die heute leicht missverständliche kultische Verengung von „Tabernakel“.
theological_decisions:
- issue: Bezug von illorum und eis
  choice: „ihre … ihnen“ ohne erläuternde Identifizierung
  alternative: „die Herrlichkeit jener … ihnen“
  rationale: Der Einzelvers benennt die Bezugsgruppen nicht ausdrücklich. Die Übersetzung wahrt diese anaphorische Offenheit, statt aufgrund des Kontextes eine bestimmte Gruppenzuordnung in den Text einzutragen.
- issue: Art der ewigen tabernacula
  choice: „ewige Wohnstätten“
  alternative: „ewige Zelte“
  rationale: Die Formulierung lässt offen, ob bildhafte Zelte, himmlische Wohnungen oder dauerhafte Behausungen gemeint sind; sie legt keine ausgearbeitete Jenseitslehre fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Aussage des lateinischen Textes. Das abschließende Komma bleibt erhalten, da der Satz im folgenden Vers weitergeführt wird.
