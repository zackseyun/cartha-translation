lexical_decisions:
- source_word: quae praeparaueram illis
  choice: die ich für sie vorbereitet hatte
  rationale: Der Relativsatz setzt den vorherigen Zusammenhang fort; das lateinische Plusquamperfekt und illis werden direkt wiedergegeben.
- source_word: Lignum uitae
  choice: Der Baum des Lebens
  rationale: Die geläufige und genaue deutsche Entsprechung.
- source_word: erit illis in odorem unguenti
  choice: wird ihnen zum Duft von Salböl
  rationale: Die Konstruktion mit in odorem wird prädikativ als „zum Duft“ wiedergegeben, nicht als ausdrücklich vergleichendes „wie“. unguentum bezeichnet hier wohl ein wohlriechendes Öl oder Salbmittel.
- source_word: non laborabunt neque fatigabuntur
  choice: sie werden sich weder abmühen noch müde werden
  rationale: 'Bewahrt die zweigliedrige Aussage: mühevolle Tätigkeit und daraus folgende Ermüdung.'
theological_decisions:
- issue: Art der Aussage über den Baum des Lebens
  choice: 'prädikativ: „zum Duft von Salböl“'
  alternative: 'vergleichend: „wie der Duft von Salböl“'
  rationale: Das Latein hat keine ausdrückliche Vergleichspartikel; daher wird die resultative beziehungsweise prädikative Spannung von in odorem nicht zu einem eindeutigen Vergleich umgedeutet.
