  text: 'fortiter pro nomine domini steterunt. Tunc dixit mihi angelus: uade, adnuntia populo meo, qualia et quanta mirabilia domini dei uidisti.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: de
  text: 'Sie sind mutig für den Namen des Herrn eingestanden. Dann sagte der Engel zu mir: „Geh und verkünde meinem Volk, welche und wie große Wunder des Herrn Gottes du gesehen hast.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortiter
  choice: mutig
  rationale: Gibt das adverbiale fortiter natürlich und würdevoll wieder, ohne die Bedeutung unnötig zu verstärken.
- source_word: pro nomine domini steterunt
  choice: sie sind für den Namen des Herrn eingestanden
  rationale: Bewahrt das Bild des Standhaltens und bringt zugleich die idiomatische Bedeutung des öffentlichen Eintretens für den Namen des Herrn zum Ausdruck.
- source_word: adnuntia
  choice: verkünde
  rationale: Entspricht dem feierlichen Auftrag, etwas öffentlich bekannt zu machen.
- source_word: qualia et quanta mirabilia
  choice: welcher Art und wie groß die Wunder ... sind
  rationale: Erhält die parallele Beziehung beider Ausdrücke auf mirabilia und gibt sowohl Beschaffenheit als auch Größe wieder.
theological_decisions:
- issue: domini dei
  choice: des Herrn, Gottes
  alternative: des Herrn Gottes
  rationale: Die Apposition wird mit Komma sichtbar gemacht, ohne die mögliche enge Titelfügung dogmatisch auszuschließen.
- issue: pro nomine domini
  choice: für den Namen des Herrn
  alternative: um des Namens des Herrn willen
  rationale: Die gewählte Form bewahrt den unmittelbaren Bezug zum Namen und vermeidet, den Sinn ausschließlich als Leiden um seinetwillen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ „Geh und verkünde“ ist klar und natürlich; die etwas gehobene Formulierung „welcher Art und wie groß“ bewahrt die lateinische Parallelstruktur.
