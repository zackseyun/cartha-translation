  to: 'Sie sind mutig für den Namen des Herrn eingestanden. Dann sagte der Engel zu mir: „Geh und verkünde meinem Volk, welche und wie große Wunder des Herrn Gottes du gesehen hast.“'
  rationale: Die Revision korrigiert die unpassende Kommasetzung in der Gottesbezeichnung und ordnet die beiden parallelen lateinischen Frageadjektive unmittelbar dem Substantiv „Wunder“ zu. Der Inhalt und der würdige moderne Registerton bleiben erhalten.
