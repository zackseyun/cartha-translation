source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: de
  text: Umarme deine Kinder, bis ich komme, und verkünde ihnen Barmherzigkeit; denn meine Quellen fließen über, und meine Gnade wird nicht versiegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuos
  choice: deine Kinder
  rationale: Das substantivierte Possessivpronomen bedeutet wörtlich „die Deinen“. Der unmittelbare Zusammenhang identifiziert sie als die Kinder; die ausdrückliche Wiedergabe ist im Deutschen natürlich und erhält den Sinn.
- source_word: praedica illis misericordiam
  choice: verkünde ihnen Barmherzigkeit
  rationale: „Praedicare“ bezeichnet öffentliches Verkünden; „misericordia“ wird als „Barmherzigkeit“ wiedergegeben, ohne den offenen Bezug auf Gottes Erbarmen durch eine engere Deutung festzulegen.
- source_word: exuberant fontes mei
  choice: meine Quellen fließen über
  rationale: Die konkrete Bildsprache und das Präsens von „exuberant“ werden bewahrt.
- source_word: gratia mea non deficiet
  choice: meine Gnade wird nicht versiegen
  rationale: „Deficiet“ ist Futur und verheißt, dass die Gnade nicht ausgehen oder erschöpft werden wird. „Versiegen“ verbindet die Aussage natürlich mit dem vorausgehenden Bild der Quellen.
theological_decisions:
- issue: Bezug und Tragweite von „misericordiam“
  choice: Barmherzigkeit
  alternative: meine Barmherzigkeit / Erbarmen
  rationale: Der lateinische Text hat kein ausdrückliches Possessivpronomen. Die Übersetzung fügt daher kein „meine“ ein und lässt die genaue Beziehung offen.
- issue: Zeitform von „non deficiet“
  choice: wird nicht versiegen
  alternative: versiegt nicht
  rationale: Das lateinische Futur ist eindeutig und wird gegen eine mögliche präsentische Lesart ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Quellenmetapher. Der anschließende Satz „Ego Ezra accepi …“ wurde nicht aufgenommen, da er den Beginn des nächsten Verses bildet. Das im vorgelegten englischen Text vorhandene Fußnotenzeichen steht inhaltlich an einer falschen Stelle und seine präsentische Alternative widerspricht dem lateinischen Futur; daher wurde keine entsprechende Fußnote gesetzt.
