id: 2ES.2.34
reference: 2 Esdras 2:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: de
  text: 'Ihr Menschen aus den Völkern[a], die ihr hört und versteht: Wartet auf euren Hirten. Er wird euch ewige Ruhe schenken; denn er ist nahe – er, der am Ende des Zeitalters kommen wird. Seid bereit für die Belohnungen des Reiches,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Völker“. Das feminine lateinische Relativpronomen quae verweist wahrscheinlich auf das im Zusammenhang vorausgesetzte gentes („Völker“); gemeint sind im Gegensatz zu Israel die Angehörigen der anderen Völker.'
    reason: Korrigiert die unzutreffende Benennung von „die“ als lateinischem Pronomen und erläutert die kontextuelle Erschließung von gentes präzise.
lexical_decisions:
- source_word: quae auditis et intellegitis
  choice: die ihr hört und versteht
  rationale: Die beiden lateinischen Verben werden direkt und in ihrer aktiven Bedeutung wiedergegeben; das feminine Relativpronomen weist auf ein erschlossenes oder im Kontext vorausgehendes „gentes“ hin.
- source_word: gentes (im Kontext erschlossen)
  choice: Menschen aus den Völkern
  rationale: Die Formulierung bringt den frühchristlichen Gegensatz zu Israel zum Ausdruck, ohne das heute leicht abwertend klingende Wort „Heiden“ zu verwenden. Zugleich bleibt in der Fußnote die wörtlichere Möglichkeit „Völker“ sichtbar.
- source_word: expectate pastorem uestrum
  choice: Wartet auf euren Hirten
  rationale: „Wartet auf“ gibt expectate natürlich wieder und bewahrt das Hirtenbild unverändert.
- source_word: requiem aeternitatis
  choice: ewige Ruhe
  rationale: Die idiomatische deutsche Wendung vermittelt den Sinn der wörtlichen Genitivverbindung „Ruhe der Ewigkeit“.
- source_word: in proximo est
  choice: ist nahe
  rationale: Die knappe räumlich-zeitliche Aussage des Lateinischen bleibt erhalten, ohne sie genauer festzulegen.
- source_word: in finem saeculi
  choice: am Ende des Zeitalters
  rationale: „Zeitalter“ wahrt die zeitliche Bedeutung von saeculum und vermeidet die vorschnelle Festlegung auf die Vernichtung der Welt.
- source_word: praemia regni
  choice: Belohnungen des Reiches
  rationale: Der Plural von praemia und das unbestimmt gelassene regnum werden beibehalten.
theological_decisions:
- issue: Bezeichnung der im Gegensatz zu Israel angesprochenen Gruppe
  choice: Menschen aus den Völkern
  alternative: Heiden; Völker; Nichtjuden
  rationale: Die Wahl erhält den frühchristlichen Israel–Völker-Kontrast, vermeidet aber eine unnötig abwertende moderne Konnotation und legt die Gruppe nicht stärker fest, als der Kontext erlaubt.
- issue: Bedeutung von saeculum
  choice: Zeitalter
  alternative: Welt; Weltzeit
  rationale: „Zeitalter“ lässt die eschatologische Aussage bestehen, ohne saeculum ausschließlich kosmologisch zu deuten.
- issue: Nicht ausdrücklich benanntes Reich
  choice: Reich
  alternative: Reich Gottes; Himmelreich
  rationale: Da der lateinische Text nur regni sagt, wird keine theologische Ergänzung in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Das Hirtenbild und die eschatologische Spannung bleiben erhalten. Der abschließende Beistrich zeigt, wie in der Quelle, dass der Satz im folgenden Vers weitergeht.
