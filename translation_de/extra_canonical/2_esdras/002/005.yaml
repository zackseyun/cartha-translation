  source_fidelity: Die Übersetzung gibt die lateinische gerichtliche Formel „testem invoco super“ treffend als „rufe … als Zeugen gegen“ wieder. „Die Mutter der Kinder“ entspricht filiorum ohne unberechtigtes Demonstrativpronomen. Das willentliche Moment von noluerunt und die Bundesbedeutung von testamentum sind erhalten.
