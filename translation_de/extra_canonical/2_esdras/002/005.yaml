  terminology: „Bund“ ist für testamentum im biblischen Kontext sachgerecht; „den Bund halten“ ist eine etablierte und natürliche deutsche Wiedergabe von testamentum servare. „Vater“ wahrt die Anredeform des lateinischen Vokativs.
