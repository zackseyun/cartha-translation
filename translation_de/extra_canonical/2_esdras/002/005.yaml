source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: de
  text: Doch ich rufe dich, Vater, als Zeugen gegen die Mutter der Kinder an, weil sie meinen Bund nicht halten wollten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testem inuoco
  choice: rufe … als Zeugen … an
  rationale: Gibt die gerichtliche Wendung idiomatisch und zugleich quellennah wieder.
- source_word: super matrem filiorum
  choice: gegen die Mutter der Kinder
  rationale: In diesem gerichtlichen Zusammenhang hat super mit Akkusativ adversative Bedeutung; filiorum enthält kein Demonstrativpronomen.
- source_word: testamentum meum
  choice: meinen Bund
  rationale: Testamentum bezeichnet im biblischen Latein gewöhnlich den Bund; „Testament“ wäre hier im modernen Deutsch missverständlich.
- source_word: noluerunt … seruare
  choice: nicht halten wollten
  rationale: Bewahrt das Willensmoment von noluerunt und gibt servare testamentum idiomatisch als „den Bund halten“ wieder.
theological_decisions:
- issue: Gerichtliche Stoßrichtung der Zeugenaussage
  choice: „gegen die Mutter“
  alternative: „über die Mutter“
  rationale: Der Zusammenhang und die Formel testem invoco stützen eine gegen sie gerichtete Zeugenschaft; die weniger bestimmte Alternative würde die feindliche Rechtsbedeutung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Konjunktion autem wird als „Doch“ wiedergegeben; die Satzform bleibt wegen des über Versgrenzen fortlaufenden Zusammenhangs mit Komma offen.
