id: 2ES.2.43
reference: 2 Esdras 2:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: de
  text: Und mitten unter ihnen war ein hochgewachsener junger Mann, der sie alle überragte. Jedem von ihnen setzte er eine Krone aufs Haupt, und er selbst wurde noch mehr erhöht. Ich aber war von Staunen ergriffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis statura celsus
  choice: ein hochgewachsener junger Mann
  rationale: Gibt sowohl das junge Alter als auch die außergewöhnliche Körpergröße natürlich und präzise wieder.
- source_word: eminentior omnibus illis
  choice: der sie alle überragte
  rationale: Bewahrt den hier zunächst räumlich-körperlichen Vergleich und klingt im modernen Deutschen idiomatisch.
- source_word: singulis eorum capitibus inponebat coronas
  choice: Jedem von ihnen setzte er eine Krone aufs Haupt
  rationale: Gibt den distributiven Sinn von „singulis“ sowie das Aufsetzen der Kronen klar wieder; der deutsche Singular bezeichnet jeweils das Haupt der einzelnen Person.
- source_word: magis exaltabatur
  choice: er selbst wurde noch mehr erhöht
  rationale: Bewahrt das Passiv und die mögliche Spannung zwischen sichtbarer Erhöhung und erhöhter Stellung, ohne den Handelnden oder die genaue Bedeutung festzulegen.
- source_word: miraculo tenebar
  choice: war von Staunen ergriffen
  rationale: Entspricht der idiomatischen Bedeutung der Wendung und bewahrt die starke Reaktion des Ich-Erzählers.
theological_decisions:
- issue: Bedeutung und Urheber von „magis exaltabatur“
  choice: „er selbst wurde noch mehr erhöht“
  alternative: „er ragte noch höher empor“ oder „er wurde immer erhabener“
  rationale: Die gewählte Fassung erhält das lateinische Passiv und legt weder fest, wer ihn erhöht, noch ob ausschließlich Körpergröße, Rang oder Herrlichkeit gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge wurde leicht gegliedert, um die lange lateinische Periode gut verständlich wiederzugeben; die bildhafte und theologisch offene Formulierung „wurde noch mehr erhöht“ bleibt erhalten.
