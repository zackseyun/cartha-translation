lexical_decisions:
- source_word: Mortuos
  choice: Tote
  rationale: Gibt den substantivisch gebrauchten Akkusativ Plural natürlich und ohne zusätzliche Festlegung wieder.
- source_word: ubi inueneris
  choice: wo immer du … findest
  rationale: Der lateinische Relativsatz mit Konjunktiv bezeichnet einen unbestimmten Fundort bzw. wiederkehrenden Fall.
- source_word: signans
  choice: kennzeichne sie
  rationale: Das Partizip beschreibt eine begleitende Handlung; im Deutschen ist eine koordinierte Aufforderung klarer. „Kennzeichnen“ bewahrt den allgemeinen Sinn, ohne die Art des Zeichens festzulegen.
- source_word: commenda sepulchro
  choice: übergib sie dem Grab
  rationale: Bewahrt die Bildlichkeit und die Dativkonstruktion des Lateinischen; gemeint ist die Bestattung.
- source_word: et dabo
  choice: und ich werde geben
  rationale: Der überlieferte Ausschnitt endet unvollständig. Die Ergänzung dessen, was gegeben wird, bleibt deshalb bewusst offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt am Ende entsprechend dem fragmentarischen Quellenausschnitt syntaktisch offen; es wird kein Objekt zu „geben“ ergänzt.
