  source_fidelity: Der Entwurf gibt den lateinischen Wortlaut vollständig und in seiner fragmentarischen Form wieder. „Wo immer du Tote findest“ entspricht Mortuos ubi inueneris; „kennzeichne sie“ gibt signans angemessen wieder, ohne die Art des Zeichens zu bestimmen. „übergib sie dem Grab“ bewahrt die bildhafte Dativfügung commenda sepulchro. Das unvollständige „und ich werde geben“ bildet et dabo korrekt ab, ohne ein im Quellenausschnitt fehlendes Objekt zu ergänzen.
