  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des lateinischen Textes zutreffend wieder: den an Zion gerichteten Imperativ, „numerum tuum“ als zugehörige gezählte Gemeinschaft, „conclude“ im Sinn des Zusammenführens sowie „candidatos“ mit der ausdrücklich bewahrten Weiß-Kleidung. „die das Gesetz des Herrn erfüllt haben“ entspricht der vorausgesetzten Fortsetzung des überlieferten Satzes und dem englischen Audit-Trail.'
  naturalness: „Nimm, Zion, deine Schar auf und versammle deine weiß Gekleideten“ ist würdiges, verständliches modernes Standarddeutsch. Die getrennte Schreibung „weiß Gekleideten“ ist hier als substantiviertes Partizip mit adverbialem „weiß“ sprachlich möglich und gut lesbar.
  terminology: „Schar“ ist eine angemessene idiomatische Wiedergabe von „numerus“ im kollektiven, visionären Kontext; die Fußnote dokumentiert die wörtliche Lesart „Zahl“. „weiß Gekleideten“ bewahrt die für „candidatos“ maßgebliche Farbvorstellung, ohne die Gruppe unzulässig etwa als Täuflinge oder Märtyrer festzulegen. „Gesetz des Herrn“ ist terminologisch sachgerecht.
