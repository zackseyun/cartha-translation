source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: transtulerunt, splendidas tunicas a domino acceperunt. Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: de
  text: Nimm, Zion, deine Schar[a] auf und versammle deine weiß Gekleideten[b], die das Gesetz des Herrn erfüllt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deine Zahl«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die in Weiß Gekleideten«; das lateinische Wort kann auch »Kandidaten« bedeuten, bezeichnet hier aber Menschen in weißer Kleidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: numerum tuum
  choice: deine Schar
  rationale: Wörtlich steht »deine Zahl«. Gemeint ist hier im Zusammenhang jedoch die gezählte Gesamtheit der zu Zion Gehörenden; »Schar« klingt im Deutschen natürlich und bewahrt den kollektiven Sinn.
- source_word: conclude
  choice: versammle
  rationale: Das Verb kann »zusammenschließen«, »einschließen« oder »zusammenbringen« bedeuten. »Versammle« gibt im visionären Zusammenhang die Aufforderung wieder, die bezeichnete Gruppe zusammenzuführen.
- source_word: candidatos tuos
  choice: deine weiß Gekleideten
  rationale: »candidatos« bezeichnet seinem Bildgehalt nach Menschen in glänzend weißer Kleidung. Die Wiedergabe bewahrt die für die Szene wesentliche weiße Gewandung und vermeidet den im heutigen Deutschen irreführenden politischen Sinn von »Kandidaten«.
- source_word: qui legem [domini impleverunt]
  choice: die das Gesetz des Herrn erfüllt haben
  rationale: Die Formulierung folgt der im überlieferten Zusammenhang ergänzten Fortsetzung und gibt »legem implere« idiomatisch als »das Gesetz erfüllen« wieder.
theological_decisions:
- issue: Bedeutung der weiß Gekleideten
  choice: Keine nähere Identifizierung im Haupttext
  alternative: Ausdrückliche Deutung als Getaufte oder Märtyrer
  rationale: Weiße Kleidung kann in frühchristlichen Zusammenhängen verschiedene Gruppen kennzeichnen. Der lateinische Text selbst legt hier keine eindeutige Identifizierung fest; daher bleibt die Bildsprache offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Schar« vermeidet die unnatürliche Wendung »deine Zahl«, während die Fußnote den wörtlichen Ausdruck dokumentiert. »weiß Gekleideten« erhält ausdrücklich die Farbsymbolik des lateinischen »candidatos«.
