  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: de
  text: Bittet, und ihr werdet empfangen. Betet darum, dass eure wenigen Tage verkürzt werden.[a] Das Reich ist schon für euch bereit; bleibt wachsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die lateinische Formulierung ist schwierig. Wahrscheinlich sind die Tage der gegenwärtigen Zeit oder Bedrängnis gemeint, nicht der Wunsch nach einem kurzen Leben. Weniger wahrscheinlich lässt sich übersetzen: „Betet darum, dass eure Tage wenige seien und verkürzt werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Petite et accipietis
  choice: Bittet, und ihr werdet empfangen
  rationale: Gibt die geläufige Aufforderung und Verheißung des lateinischen Satzes knapp und würdig wieder.
- source_word: rogate uobis dies paucos ut minorentur
  choice: Betet darum, dass eure wenigen Tage verkürzt werden
  rationale: 'Versteht „dies paucos“ als vorweggenommenes Subjekt des ut-Satzes: Die bereits als „wenig“ bezeichneten Tage sollen verkürzt werden. Die schwierige, apokalyptisch gefärbte Formulierung bleibt in der Fußnote erläutert.'
- source_word: iam paratum est uobis regnum
  choice: Das Reich ist schon für euch bereit
  rationale: „Schon“ gibt iam natürlich wieder; „für euch bereit“ bewahrt sowohl den Zustandscharakter von paratum est als auch den Dativ uobis.
- source_word: uigilate
  choice: bleibt wachsam
  rationale: Drückt den fortdauernden Aufruf zu geistlicher Wachsamkeit im modernen Standarddeutsch aus.
theological_decisions:
- issue: Bezug der verkürzten „wenigen Tage“
  choice: Der Haupttext lässt den Gegenstand als „eure wenigen Tage“ stehen und deutet ihn nicht ausdrücklich als Lebenszeit oder Weltzeit.
  alternative: Die Tage ausdrücklich als gegenwärtiges Zeitalter, Bedrängniszeit oder persönliche Lebenszeit bestimmen.
  rationale: Der lateinische Text legt keine eindeutige Referenz fest. Eine apokalyptische Deutung ist wahrscheinlich, soll aber nicht als sichere Aussage in den Haupttext eingetragen werden.
- issue: Gegenwärtige Bereitung des Reiches
  choice: Das Reich ist „schon“ für die Angesprochenen bereit.
  alternative: Das Reich wird künftig für sie bereitet.
  rationale: Das Perfekt Passiv paratum est zusammen mit iam bezeichnet einen bereits bestehenden Zustand; die Spannung zwischen gegenwärtiger Bereitung und zukünftiger Erwartung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die kurzen Imperative und die eschatologische Spannung des lateinischen Textes bleiben erhalten.
