id: 2ES.2.1
reference: 2 Esdras 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my servants the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: de
  text: 'So spricht der Herr: Ich habe dieses Volk aus der Knechtschaft herausgeführt und ihnen durch meine Knechte, die Propheten, Gebote gegeben. Auf sie wollten sie nicht hören, sondern sie machten meine Ratschlüsse zunichte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruitute
  choice: Knechtschaft
  rationale: Bezeichnet einen Zustand der Unfreiheit oder Versklavung; „Knechtschaft“ ist im biblischen Zusammenhang natürlich und würdevoll, ohne den Bezug auf tatsächliche Unfreiheit abzuschwächen.
- source_word: pueros meos prophetas
  choice: meine Knechte, die Propheten
  rationale: „Puer“ kann hier einen Diener oder Knecht bezeichnen. „Knechte“ wahrt die traditionelle prophetische Dienstbezeichnung und gibt das Abhängigkeitsverhältnis zum Herrn deutlicher wieder als das allgemeinere „Diener“.
- source_word: mandata
  choice: Gebote
  rationale: Im Kontext göttlicher Weisungen ist „Gebote“ die klare und übliche Entsprechung.
- source_word: consilia
  choice: Ratschlüsse
  rationale: „Ratschlüsse“ bewahrt den Sinn göttlicher Beschlüsse oder Vorhaben und vermeidet die Verengung auf bloße Ratschläge.
- source_word: irrita fecerunt
  choice: machten … zunichte
  rationale: Gibt die aktive Vereitelung beziehungsweise Missachtung der göttlichen Ratschlüsse idiomatisch und kräftig wieder.
theological_decisions:
- issue: Bezug von „quos“
  choice: „Auf sie“ bezieht sich ausdrücklich auf die Propheten.
  alternative: 'Das Objekt auslassen: „Sie wollten nicht hören“.'
  rationale: Das lateinische Relativpronomen „quos“ verweist grammatisch auf „pueros meos prophetas“. Die Übersetzung erhält damit die direkte Zurückweisung der Propheten.
- issue: Bedeutung von „pueros“
  choice: Knechte
  alternative: Diener oder Sklaven
  rationale: „Knechte“ bildet sowohl Dienst als auch Unterordnung ab, ohne eine sachlich nicht eindeutig geforderte soziale Einstufung als Sklaven vorzunehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Aufteilung in zwei Sätze verhindert eine schwerfällige Relativsatzkette; die Wiederaufnahme „Auf sie“ macht den Bezug auf die Propheten klar. Keine Fußnote ist nötig, da der lateinische Satz an dieser Stelle eindeutig ist.
