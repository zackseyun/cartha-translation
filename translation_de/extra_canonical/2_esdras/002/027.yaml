id: 2ES.2.27
reference: 2 Esdras 2:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: de
  text: Andere werden weinen und traurig sein, du aber wirst fröhlich sein und Überfluss haben.[a] Die Völker werden neidisch auf dich sein, doch sie werden nichts gegen dich ausrichten können, spricht der Herr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reich sein“.'
    reason: Das lateinische copiosa kann sowohl vorhandene Fülle bzw. Überfluss als auch den daraus folgenden Zustand des Reichseins bezeichnen.
lexical_decisions:
- source_word: alii
  choice: Andere
  rationale: Gibt den unbestimmten Gegensatz zur angesprochenen Person bzw. Gemeinschaft direkt wieder.
- source_word: hilaris
  choice: fröhlich
  rationale: Natürliches modernes Deutsch für einen heiteren, freudigen Zustand im Gegensatz zu Weinen und Trauer.
- source_word: copiosa
  choice: Überfluss haben
  rationale: Bewahrt den Sinn von Fülle bzw. reicher Versorgung; die prädikative lateinische Form wird im Deutschen idiomatisch verbal ausgedrückt.
- source_word: Zelabunt
  choice: werden neidisch auf dich sein
  rationale: Im Kontext bezeichnet zelare am ehesten den Neid der Völker; die deutsche Wendung ist natürlicher als „eifersüchtig sein“.
- source_word: nihil aduersus te poterunt
  choice: werden nichts gegen dich ausrichten können
  rationale: Gibt nicht bloß fehlende Fähigkeit, sondern die Wirkungslosigkeit jedes Vorgehens gegen die Angesprochene idiomatisch wieder.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Traditionelle, würdige und im Deutschen geläufige prophetische Redeformel.
theological_decisions:
- issue: Bezug und Geschlecht der angesprochenen Größe
  choice: Das Pronomen „du“ bleibt ohne ergänzende Identifizierung stehen.
  alternative: Die Angesprochene ausdrücklich als Zion, Mutter oder Stadt benennen.
  rationale: Die feminine Form copiosa zeigt im Lateinischen eine weibliche Bezugsgröße an, nennt sie in diesem Vers jedoch nicht ausdrücklich. Eine Identifizierung würde Kontext in den Wortlaut eintragen.
- issue: Bedeutung von zelare
  choice: Neid der Völker
  alternative: Eifersucht oder Eifer der Völker
  rationale: „Neidisch auf dich sein“ passt am besten zur angekündigten Fülle und zur feindseligen, aber erfolglosen Haltung der Völker, ohne eine besondere theologische Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelkontrast zwischen den Trauernden und der fröhlichen, reich versorgten Angesprochenen bleibt erhalten; die zwei lateinischen Sätze werden klar voneinander abgegrenzt.
