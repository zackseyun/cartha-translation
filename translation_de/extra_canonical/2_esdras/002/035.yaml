id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: de
  text: Denn ewiges Licht wird euch durch alle Ewigkeit leuchten. Flieht den Schatten dieses Zeitalters; empfangt die Freude der Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: ewiges Licht
  rationale: Gibt die Dauerhaftigkeit des Lichts natürlich und würdevoll wieder; „immerwährendes Licht“ wäre möglich, klingt aber weniger geläufig.
- source_word: per aeternitatem temporis
  choice: in alle Ewigkeit
  rationale: Eine natürliche deutsche Wiedergabe der verstärkten lateinischen Zeitangabe, ohne die Aussage abzuschwächen.
- source_word: saeculi huius
  choice: dieser Weltzeit
  rationale: Bewahrt den zeitlich-weltlichen Bedeutungsumfang von „saeculum“ und vermeidet eine vorschnelle Festlegung allein auf „Welt“ oder „Zeitalter“.
- source_word: iocunditatem gloriae
  choice: die Freude der Herrlichkeit
  rationale: Gibt sowohl „iocunditas“ als Freude als auch den Genitiv „gloriae“ formal und theologisch offen wieder.
theological_decisions:
- issue: Bedeutung von „saeculum“
  choice: dieser Weltzeit
  alternative: dieses Zeitalters
  rationale: „Weltzeit“ lässt sowohl die gegenwärtige Weltordnung als auch ihren zeitlichen Charakter anklingen und erhält so die eschatologische Spannung.
- issue: Genitivverhältnis in „iocunditatem gloriae“
  choice: Freude der Herrlichkeit
  alternative: herrliche Freude
  rationale: Der Genitiv bleibt erhalten, damit nicht entschieden wird, ob Herrlichkeit Ursprung, Inhalt oder Sphäre der Freude ist.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klaren Imperativen. Die anaphorische Begründungspartikel „Denn“ wahrt den Anschlusscharakter von „quia“. Keine Ergänzung des früher überlieferten, aber im maßgeblichen Quelltext nicht vorhandenen Satzes über die Belohnungen des Reiches.
