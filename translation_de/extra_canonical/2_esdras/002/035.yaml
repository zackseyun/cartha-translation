- from: Denn ewiges Licht wird euch in alle Ewigkeit leuchten. Flieht den Schatten dieser Weltzeit; empfangt die Freude der Herrlichkeit.
  to: Denn ewiges Licht wird euch durch alle Ewigkeit leuchten. Flieht den Schatten dieses Zeitalters; empfangt die Freude der Herrlichkeit.
  rationale: Die Revision ersetzt allein die unnatürliche Wiedergabe „Weltzeit“ durch „Zeitalter“ und fasst die Zeitangabe idiomatisch sowie näher an per. Die Mehrdeutigkeit des Genitivs „der Herrlichkeit“ bleibt erhalten.
