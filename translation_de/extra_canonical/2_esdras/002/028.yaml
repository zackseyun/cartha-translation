source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Manus meae tegent te, ne filii tui gehennam uideant. Iocundare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/028.yaml
  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: de
  text: Meine Hände werden dich bedecken, damit deine Kinder die Gehenna nicht sehen. Freue dich,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Manus meae
  choice: Meine Hände
  rationale: Gibt den lateinischen Plural wörtlich und natürlich wieder.
- source_word: tegent te
  choice: werden dich bedecken
  rationale: Bewahrt das Bild des schützenden Bedeckens und die futurische Aussage.
- source_word: filii tui
  choice: deine Kinder
  rationale: Im Kontext ist „Kinder“ die natürliche inklusive Wiedergabe von filii; „Söhne“ wäre formal möglich, könnte den Bezug aber unnötig verengen.
- source_word: gehennam
  choice: die Gehenna
  rationale: Behält den traditions- und bedeutungsgeladenen Ortsbegriff bei, statt ihn deutend mit „Hölle“ wiederzugeben.
- source_word: Iocundare
  choice: Freue dich
  rationale: Natürliche deutsche Wiedergabe des singularischen Imperativs; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
theological_decisions:
- issue: Bedeutung von Gehenna
  choice: Gehenna als Begriff beibehalten
  alternative: Hölle
  rationale: Die Transliteration bewahrt die konkrete und theologisch offene Bildsprache des Ausgangstextes, ohne sie auf eine spätere dogmatische Kategorie festzulegen.
- issue: Art des Schutzes durch die Hände
  choice: „bedecken“
  alternative: „beschützen“
  rationale: „Bedecken“ erhält die Metapher des lateinischen tegere; „beschützen“ würde ihre Funktion bereits auslegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Bildsprache. Das Komma am Ende wurde erhalten, weil „Freue dich“ syntaktisch in den folgenden Vers hineinführt.
