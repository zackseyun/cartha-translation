  text: Wie lange soll ich sie noch ertragen, denen ich so große Wohltaten erwiesen habe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vsquequo
  choice: Wie lange ... noch
  rationale: Gibt die zeitliche Frage idiomatisch und mit dem im Deutschen natürlichen Nachdruck von „noch“ wieder.
- source_word: sustinebo
  choice: soll ich ... ertragen
  rationale: Bewahrt den Sinn von dulden bzw. aushalten und die deliberative oder zukunftsbezogene Nuance der lateinischen Futurform.
- source_word: quibus
  choice: nachdem ich ihnen
  rationale: Die relative Konstruktion wird für natürliches Deutsch als nachgestellter Umstandssatz wiedergegeben, ohne den Bezug auf dieselben Personen zu verändern.
- source_word: tanta beneficia contuli
  choice: so große Wohltaten erwiesen habe
  rationale: „Wohltaten erweisen“ ist eine genaue, würdige und im modernen Standarddeutsch verständliche Entsprechung für beneficia conferre.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Klage bleibt knapp und eindringlich; „Wohltaten“ bewahrt den positiven und unverdienten Charakter der gewährten Güter, ohne eine spezifische dogmatische Deutung einzutragen.
