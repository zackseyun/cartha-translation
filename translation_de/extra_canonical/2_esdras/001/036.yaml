    rationale: Der lateinische Ausdruck kann sich auf die Vorzeit im weiteren Sinn sowie auf zu ihr gehörige Menschen oder Dinge beziehen. Die Formulierung legt ihn zu stark auf frühere Zeitabschnitte fest.
