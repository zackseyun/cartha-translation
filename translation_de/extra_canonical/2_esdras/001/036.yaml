  yaml_path: translation/extra_canonical/2_esdras/001/036.yaml
  text: They have not seen[a], yet they will remember their antiquity[b]. I call to witness
translation:
  language: de
  text: Sie haben nicht gesehen, doch werden sie sich ihrer Vorzeit erinnern.[a] Ich rufe zum Zeugen
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut ist hier unsicher. Statt „ihrer Vorzeit“ kann auch das gemeint sein, was zu ihrer Vorzeit gehört, etwa Menschen oder Dinge aus alter Zeit.
    reason: textual_variant
lexical_decisions:
- source_word: non uiderunt
  choice: Sie haben nicht gesehen
  rationale: Die lateinische Aussage hat kein ausdrücklich genanntes Objekt. Deshalb wird weder „Propheten“ noch eine andere Ergänzung in den Haupttext eingefügt.
- source_word: memorabuntur antiquitatum eorum
  choice: werden sie ihrer alten Zeiten gedenken
  rationale: „Gedenken“ kann im Deutschen wie das lateinische memorari mit einem Genitiv stehen. „Ihre alten Zeiten“ gibt antiquitatum eorum wieder, ohne die schwer bestimmbare Bedeutung auf bloße persönliche Erlebnisse festzulegen.
- source_word: Testor
  choice: Ich rufe zum Zeugen
  rationale: Testor eröffnet hier offenbar eine über die Versgrenze hinausführende Wendung. Die Übersetzung bewahrt diesen fragmentarischen Anschluss.
theological_decisions:
- issue: Nicht genanntes Objekt von „gesehen“
  choice: Kein Objekt ergänzt
  alternative: „Sie haben keine Propheten gesehen“
  rationale: „Propheten“ ist aus dem vorgelegten lateinischen Wortlaut nicht zu begründen; eine Ergänzung würde den Sinn unzulässig festlegen.
- issue: Bezug von antiquitatum eorum
  choice: „ihrer alten Zeiten“ mit erklärender Fußnote
  alternative: „ihrer Altertümer“ oder „der Menschen/Dinge aus alter Zeit“
  rationale: Der überlieferte Ausdruck ist sprachlich unsicher und kann alte Zeiten ebenso wie Menschen oder Dinge der Vorzeit bezeichnen. Der Haupttext bleibt lesbar, während die Fußnote die echte Mehrdeutigkeit wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gehobene Ausdruck „gedenken“ bewahrt die Genitivkonstruktion und passt zum biblischen Register, ohne unnötig altertümlich zu wirken. Die Unvollständigkeit am Versende wird entsprechend der Quelle beibehalten.
