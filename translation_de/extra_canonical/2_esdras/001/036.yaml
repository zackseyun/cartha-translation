  verdict: revise
  source_fidelity: '„Sie haben nicht gesehen“ bewahrt zutreffend das im Lateinischen objektlose non uiderunt. Die Wiedergabe von antiquitatum eorum als „ihrer alten Zeiten“ ist jedoch zu eng und zudem stilistisch schwerfällig: antiquitas/antiquitates kann neben früheren Zeiten auch die Vorzeit bzw. zu ihr gehörige Personen oder Dinge meinen. „ihrer Vorzeit“ hält den Zeithorizont offen, ohne ein nicht belegtes Objekt zu ergänzen. Das unabgeschlossene Testor wird beibehalten.'
  naturalness: „Sie haben nicht gesehen, doch werden sie sich ihrer Vorzeit erinnern“ ist modernes, flüssiges Standarddeutsch. Die Konstruktion „ihrer alten Zeiten gedenken“ wirkt wegen der Verbindung von „alt“ und „Zeiten“ unnötig redundant und weniger idiomatisch. „Ich rufe zum Zeugen“ bleibt als bewusst unvollständiger Anschluss an die folgende Wendung erhalten.
  terminology: „Vorzeit“ ist für das mehrdeutige antiquitatum angemessener als „alte Zeiten“. Die Fußnote erläutert weiterhin, dass der Ausdruck auch Personen oder Dinge aus der Vorzeit bezeichnen kann, ohne diese Deutung im Haupttext festzuschreiben.
