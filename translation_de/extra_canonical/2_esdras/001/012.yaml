  text: But you[a], speak to them, saying, ‘Thus says the Lord:’
translation:
  language: de
  text: 'Du aber, sprich zu ihnen: So spricht der Herr:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tu uero
  choice: Du aber
  rationale: Das Personalpronomen wird wegen seiner ausdrücklichen Setzung betont wiedergegeben; »uero« markiert hier einen adversativen beziehungsweise hervorhebenden Übergang, nicht eine Folgerung.
- source_word: loquere ad eos dicens
  choice: sollst zu ihnen sprechen und sagen
  rationale: Der lateinische Imperativ wird in natürlichem prophetischem Deutsch als Auftragsformulierung wiedergegeben; »dicens« bleibt durch »und sagen« ausdrücklich erhalten.
- source_word: haec dicit dominus
  choice: So spricht der Herr
  rationale: Die feste prophetische Botenformel wird idiomatisch und traditionsübergreifend präzise wiedergegeben.
theological_decisions:
- issue: Zuordnung der prophetischen Formel zum Vers
  choice: »So spricht der Herr« bleibt in Vers 12 und eröffnet das folgende Gotteswort.
  alternative: Die Formel an den Anfang von Vers 13 verschieben.
  rationale: Der lateinische Quelltext enthält »haec dicit dominus« ausdrücklich in diesem Vers; die abschließende Interpunktion wahrt zugleich die syntaktische Verbindung zum folgenden Inhalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede »Du aber« bewahrt die Hervorhebung und den Gegensatz des Lateinischen. Der Doppelpunkt am Versende zeigt an, dass das angekündigte Herrenwort im folgenden Vers fortgesetzt wird.
