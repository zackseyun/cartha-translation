source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: de
  text: Geh und verkünde meinem Volk seine Freveltaten und seinen Kindern die Vergehen, die sie gegen mich begangen haben, damit sie davon ihren Kindeskindern erzählen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facinora
  choice: Freveltaten
  rationale: Gibt die starke moralische Wertung des lateinischen Begriffs wieder, ohne die Taten unnötig zu konkretisieren.
- source_word: iniquitates
  choice: Vergehen
  rationale: Bewahrt die Bedeutung schuldhaften Unrechts und vermeidet eine künstliche Wiederholung von „Freveltaten“.
- source_word: in me admiserunt
  choice: gegen mich begangen haben
  rationale: Entspricht der persönlichen Zielrichtung des lateinischen Ausdrucks und klingt im modernen Deutschen natürlich.
- source_word: filiis filiorum suorum
  choice: ihren Kindeskindern
  rationale: Gibt die generationenübergreifende Weitergabe knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezug von „ut nuntient“
  choice: damit sie davon ihren Kindeskindern erzählen
  alternative: damit diese es ihren Kindeskindern verkünden
  rationale: Das lateinische Subjekt bleibt grammatisch unausgedrückt und kann auf das Volk beziehungsweise dessen Kinder bezogen werden. Die deutsche Fassung lässt „sie“ ebenfalls offen und bewahrt so die Ambiguität.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Imperativ und der prophetische Verkündigungsauftrag bleiben direkt; „davon“ macht den Rückbezug natürlich, ohne den Inhalt einzuengen.
