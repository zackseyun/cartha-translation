  text: in this wilderness[a]. I grieved over your groanings and gave you manna.
translation:
  language: de
  text: in dieser Wüste. Ich war über euer Stöhnen betrübt[a] und gab euch Manna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ich hatte Mitleid wegen eures Stöhnens.'
    reason: Bewahrt die frühere, kontextuell mögliche Wiedergabe, ohne sie gegenüber der näheren Bedeutung von dolui zu bevorzugen.
lexical_decisions:
- source_word: deserto hoc
  choice: in dieser Wüste
  rationale: Der lateinische Ablativ mit Demonstrativpronomen wird entsprechend dem im Fragment vorausgesetzten Zusammenhang lokal wiedergegeben.
- source_word: dolui
  choice: war … betrübt
  rationale: Doleo bezeichnet Schmerz oder Betrübnis. Die Formulierung gibt die emotionale Stärke des Verbs natürlich wieder, ohne es auf bloßes Mitleid einzuengen.
- source_word: gemitos uestros
  choice: über euer Stöhnen
  rationale: Gemitus bezeichnet Stöhnen, Seufzen oder Klagen; „Stöhnen“ wahrt das konkrete Bild und entspricht dem Plural kollektiv.
- source_word: mannam
  choice: Manna
  rationale: Die etablierte deutsche Bezeichnung für die biblische Speise.
theological_decisions:
- issue: Bedeutung von dolui
  choice: Ich war über euer Stöhnen betrübt
  alternative: Ich hatte Mitleid wegen eures Stöhnens
  rationale: Der lateinische Text spricht unmittelbar von Schmerz oder Betrübnis. Die Alternative mit „Mitleid“ ist kontextuell möglich, schwächt jedoch die Grundbedeutung von doleo ab und wird daher nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang wird beibehalten; es wird kein im lateinischen Text nicht vorhandenes Bindewort ergänzt.
