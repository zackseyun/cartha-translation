- from: Ja, ich habe euch durch das Meer geführt und euch in unwegsamem Gelände sichere Straßen angelegt.
  to: Gewiss habe ich euch durch das Meer geführt und euch in unwegsamem Gelände Straßen befestigt.
  rationale: Die Revision hält die knappe, bekräftigende Gottesrede bei und gibt die entscheidende Aussage von munitas mit „befestigt“ unmittelbarer wieder. Sie übernimmt weder die nicht im Vers stehende Redeeinleitung aus dem vorherigen Vers noch legt sie eine über den Wortlaut hinausgehende konkrete Straßenbaumaßnahme fest.
