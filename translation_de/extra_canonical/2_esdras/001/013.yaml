  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: de
  text: Gewiss habe ich euch durch das Meer geführt und euch in unwegsamem Gelände Straßen befestigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe
  choice: Ja
  rationale: Bekräftigt die Aussage im natürlichen Deutschen; je nach Kontext auch »Gewiss« oder »Fürwahr« möglich.
- source_word: mare traieci
  choice: durch das Meer geführt
  rationale: 'Gibt die kausative Aussage idiomatisch wieder: Gott brachte das Volk durch das Meer hindurch.'
- source_word: plateas
  choice: Straßen
  rationale: Im Zusammenhang mit unwegsamem Gelände bezeichnet das Wort angelegte, gangbare Wege beziehungsweise Straßen.
- source_word: in inuia
  choice: in unwegsamem Gelände
  rationale: Bewahrt den Sinn von Orten ohne gangbare Wege, ohne das lateinische substantivierte Neutrum unnötig abstrakt wiederzugeben.
- source_word: munitas
  choice: sichere … angelegt
  rationale: Munire kann befestigen, sichern oder einen Weg bahnen beziehungsweise anlegen bedeuten; die Formulierung verbindet hier die Herstellung mit der Sicherheit der Straßen.
theological_decisions:
- issue: Anschluss an die Redeeinleitung des vorherigen Verses
  choice: Keine Wiederholung von »So spricht der Herr«
  alternative: '»So spricht der Herr: Ich habe euch durch das Meer geführt …«'
  rationale: Vers 13 beginnt in der maßgeblichen lateinischen Quelle mit »Nempe ego«; eine erneute Redeeinleitung steht dort nicht und wird daher nicht aus dem vorherigen Vers übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ja« gibt die bekräftigende Partikel knapp wieder; »unwegsames Gelände« ist allgemein verständlich und wahrt das Bild einer erschlossenen Route.
