id: 2ES.1.7
reference: 2 Esdras 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: de
  text: Habe ich sie nicht aus dem Land Ägypten, aus dem Haus der Knechtschaft, herausgeführt? Sie aber reizten mich zum Zorn und verachteten meine Ratschlüsse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domo seruitutis
  choice: Haus der Knechtschaft
  rationale: Bewahrt die biblisch geprägte Exodus-Formulierung und gibt den Zustand erzwungener Unfreiheit würdig und verständlich wieder.
- source_word: irritauerunt me
  choice: reizten mich zum Zorn
  rationale: Macht die im lateinischen Verb liegende Provokation deutlich, ohne den Gegenstand des göttlichen Zorns weiter auszudeuten.
- source_word: consilia mea
  choice: meine Ratschlüsse
  rationale: Gibt den Plural sowie den Sinn von Beschlüssen, Weisungen oder Vorhaben wieder und vermeidet eine vorschnelle Verengung auf bloßen Rat.
- source_word: spreuerunt
  choice: verachteten
  rationale: Entspricht der starken Zurückweisung des lateinischen Verbs und wahrt den Parallelismus mit der vorausgehenden Auflehnung.
theological_decisions:
- issue: Anthropopathische Rede von Gottes Reaktion
  choice: reizten mich zum Zorn
  alternative: erbitterten mich / forderten mich heraus
  rationale: Die personale und spannungsreiche Rede des Ausgangstextes bleibt erhalten; sie wird weder abgeschwächt noch systematisch erklärt.
- issue: Bedeutungsbreite von consilia
  choice: Ratschlüsse
  alternative: Ratschläge / Weisungen / Pläne
  rationale: „Ratschlüsse“ hält die mögliche Spannung zwischen göttlichen Weisungen und Vorhaben offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener biblischer Exodus-Sprache. Die rhetorische Frage und der scharfe Gegensatz durch „Sie aber“ folgen eng dem lateinischen Aufbau.
