source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'misi pueros meos prophetas ad uos, quos acceptos interfecistis et laniastis corpora illorum : quorum sanguinem exquiram, dicit dominus. Haec dicit dominus omnipotens : domus uestra de-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/032.yaml
  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: de
  text: Ich sandte meine Diener, die Propheten, zu euch. Ihr nahmt sie auf, tötetet sie und risst ihre Leiber in Stücke. Ihr Blut werde ich einfordern, spricht der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: meine Diener, die Propheten
  rationale: Das lateinische puer kann je nach Zusammenhang „Junge“, „Knecht“ oder „Diener“ bedeuten. Hier bezeichnet es die von Gott gesandten Propheten; „Diener“ gibt diese Funktion im heutigen Deutsch natürlich wieder.
- source_word: acceptos
  choice: ihr nahmt sie auf
  rationale: Das Partizip von accipere bedeutet grundlegend „annehmen/aufnehmen/empfangen“. Die Formulierung bewahrt diese auffällige Aussage, ohne sie deutend zu „ergriffen“ oder „gefangen genommen“ umzuschreiben.
- source_word: laniastis corpora illorum
  choice: riss­t ihre Leiber in Stücke
  rationale: laniare bezeichnet ein gewaltsames Zerreißen oder Zerfleischen. „Die Leiber in Stücke reißen“ erhält die drastische Bildsprache und ist klares modernes Deutsch.
- source_word: sanguinem exquiram
  choice: ihr Blut werde ich einfordern
  rationale: exquirere kann „suchen“, „untersuchen“ oder „zur Rechenschaft einfordern“ bedeuten. In Verbindung mit Blut bezeichnet es die angekündigte Ahndung der Blutschuld; „einfordern“ bewahrt zugleich die biblische Ausdrucksweise.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Die geläufige prophetische Formel wird würdig und idiomatisch wiedergegeben.
theological_decisions:
- issue: Gottes Ankündigung, das Blut der Propheten einzufordern
  choice: „Ihr Blut werde ich einfordern“
  alternative: „Für ihr Blut werde ich Rechenschaft verlangen“
  rationale: Die gewählte Fassung bewahrt die knappe, konkrete Metonymie des lateinischen Textes und legt die genaue Art des angekündigten Gerichts nicht weiter fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Schärfe. Die ungewöhnliche Abfolge „aufnehmen, töten und zerreißen“ wurde nicht harmonisiert. Der am Ende der Quellenzeile beginnende nächste Satz („Haec dicit … domus vestra de-“), der bereits zu Vers 33 gehört beziehungsweise dort abbricht, wurde nicht aufgenommen.
