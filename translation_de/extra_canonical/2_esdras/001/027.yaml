base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/027.yaml
  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
translation:
  language: de
  text: Ihr habt nicht etwa mich verlassen, sondern euch selbst, spricht der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non quasi
  choice: nicht etwa
  rationale: Gibt die abschwächend-korrigierende Wendung natürlich wieder, ohne mit einem irrealen deutschen Vergleich einen unnötigen Vorzeitigkeitsbezug zu erzeugen.
- source_word: dereliquistis
  choice: habt … verlassen
  rationale: Das deutsche Perfekt entspricht hier dem lateinischen Perfekt und wahrt den zeitlichen Bezug zum Zusammenhang.
- source_word: uos ipsos
  choice: euch selbst
  rationale: Bewahrt die emphatische Rückbezüglichkeit und den scharfen Gegensatz zu „mich“.
- source_word: dicit dominus
  choice: spricht der Herr
  rationale: Eine würdevolle und im biblischen Deutsch geläufige Wiedergabe der prophetischen Redeeinleitung.
theological_decisions:
- issue: Paradoxe Gegenüberstellung des Verlassens Gottes und des eigenen Selbst
  choice: 'Die Aussage bleibt wörtlich zugespitzt: „nicht etwa mich … sondern euch selbst“.'
  alternative: Eine erklärende Wiedergabe wie „Damit habt ihr nicht mir, sondern euch selbst geschadet“.
  rationale: Der lateinische Text spricht ausdrücklich vom Verlassen und erläutert die Konsequenz nicht. Die paradoxe theologische Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die markierte Wortstellung hebt wie der lateinische Satz den Gegensatz zwischen „mich“ und „euch selbst“ hervor.
