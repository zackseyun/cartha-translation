source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: de
  text: Noch immer murrt ihr. Wo sind die Wohltaten, die ich euch erwiesen habe? Habt ihr nicht in der Wüste laut gerufen, als ihr Hunger und Durst hattet,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque
  choice: Bis jetzt
  rationale: Gibt die zeitliche Bedeutung des lateinischen Ausdrucks natürlich und genau wieder.
- source_word: murmuratis
  choice: habt ihr immer wieder gemurrt
  rationale: „Murren“ bewahrt den biblischen Anklang; „immer wieder“ bringt den fortdauernden beziehungsweise wiederholten Charakter im Kontext zum Ausdruck.
- source_word: beneficia
  choice: Wohltaten
  rationale: Bezeichnet gewährte gute Taten oder Begünstigungen und passt zum vorwurfsvollen Rückblick.
- source_word: praestiti uobis
  choice: die ich euch erwiesen habe
  rationale: Natürliches Deutsch für das Gewähren von Wohltaten, ohne einen zusätzlichen theologischen Gehalt einzutragen.
- source_word: proclamastis
  choice: habt ihr ... laut gerufen
  rationale: Bewahrt die verstärkende Bedeutung von proclamare, ohne ein im Latein nicht genanntes Ziel des Rufens hinzuzufügen.
- source_word: cum esuriretis et sitiretis
  choice: als ihr Hunger und Durst hattet
  rationale: Idiomatiche, verständliche Wiedergabe der beiden durativen Zustände.
theological_decisions:
- issue: Adressat des Rufens
  choice: Kein indirektes Objekt ergänzt
  alternative: „zu mir gerufen“
  rationale: Der lateinische Text sagt lediglich proclamastis; die naheliegende kontextuelle Beziehung zu Gott wird nicht ausdrücklich in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem biblischem Ausdruck „murren“. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
