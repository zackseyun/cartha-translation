  yaml_path: translation/extra_canonical/2_esdras/001/033.yaml
  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: de
  text: 'So spricht der Herr, der Allmächtige: Euer Haus ist verödet. Ich werde euch fortstoßen, wie der Wind Stoppeln fortweht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domus vestra
  choice: euer Haus
  rationale: Gibt die konkrete und zugleich kollektiv deutbare Formulierung des lateinischen Textes direkt wieder, ohne sie auf Tempel, Familie oder Volk festzulegen.
- source_word: deserta est
  choice: ist verödet
  rationale: Bewahrt den Zustand völliger Verlassenheit bzw. Verwüstung und klingt im Deutschen würdevoll und natürlich.
- source_word: proiciam vos
  choice: ich werde euch fortwerfen
  rationale: Erhält die Schärfe und das direkte Objekt des lateinischen Verbs; „vertreiben“ wäre interpretierender und weniger bildhaft.
- source_word: sicut ventus stipulam
  choice: wie der Wind die Stoppeln
  rationale: Formt den knappen lateinischen Vergleich zu einem natürlichen deutschen Satz aus und bewahrt das Bild leichter, vom Wind fortgetragener Erntereste.
theological_decisions:
- issue: Bedeutungsumfang von „Haus“
  choice: Die offene Bezeichnung „euer Haus“ bleibt stehen.
  alternative: „Euer Tempel“, „euer Geschlecht“ oder „euer Land“
  rationale: Der lateinische Wortlaut legt keine einzelne Deutung fest; die mögliche institutionelle, familiäre oder nationale Bedeutung soll nicht vorschnell eingeengt werden.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdig-prophetischem Ton. Die Gerichtsankündigung bleibt knapp und nachdrücklich; echte Mehrdeutigkeit wird nicht aufgelöst.
