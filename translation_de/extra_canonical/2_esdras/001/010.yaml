  yaml_path: translation/extra_canonical/2_esdras/001/010.yaml
  text: For their sake I overthrew many kings; I struck Pharaoh with his servants and all his army.
translation:
  language: de
  text: Ihretwegen stürzte ich viele Könige; den Pharao mit seinen Dienern und seinem ganzen Heer schlug ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter eos
  choice: Ihretwegen
  rationale: Gibt den kausalen Ausdruck knapp und natürlich wieder; der Bezug auf die zuvor Genannten bleibt wie im Lateinischen erhalten.
- source_word: subuerti
  choice: stürzte ich
  rationale: Bewahrt die starke Bedeutung von »umstürzen/zu Fall bringen« im Zusammenhang mit Königen.
- source_word: pueris suis
  choice: seinen Dienern
  rationale: »Pueri« kann neben »Jungen/Kinder« auch Diener oder Gefolgsleute bezeichnen; im militärisch-höfischen Zusammenhang ist »Diener« die natürliche Wiedergabe, ohne sie mit dem Heer gleichzusetzen.
- source_word: percussi
  choice: schlug ich
  rationale: Entspricht dem Grundsinn von »percutere« und lässt Art und Endgültigkeit des Schlages offen.
- source_word: omnem exercitum eius
  choice: seinem ganzen Heer
  rationale: Direkte und idiomatische Wiedergabe des militärischen Ausdrucks.
