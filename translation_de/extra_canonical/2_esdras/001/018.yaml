  yaml_path: translation/extra_canonical/2_esdras/001/018.yaml
  text: saying, “Why have you brought us into this wilderness, to kill us? It would have been better for us to serve the Egyptians than to die in this wilderness.”
translation:
  language: de
  text: 'Sie sagten zu mir: „Warum hast du uns in diese Wüste gebracht, um uns zu töten? Es wäre besser für uns gewesen, den Ägyptern zu dienen, als in dieser Wüste[a] zu sterben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Text bricht nach „als zu sterben in …“ ab. „dieser Wüste“ ergänzt den begonnenen Ortsausdruck entsprechend der englischen POB-Konsultationsfassung.
    reason: Kennzeichnet transparent, dass der Ortsausdruck im bereitgestellten lateinischen Fragment nicht vollständig erhalten ist, ohne den Satz unverständlich abzubrechen.
lexical_decisions:
- source_word: desertum
  choice: Wüste
  rationale: Die übliche und kontextgerechte Wiedergabe des lateinischen Begriffs; sie bewahrt den Bezug auf die Wüstenwanderung.
- source_word: seruire Aegyptiis
  choice: den Ägyptern zu dienen
  rationale: Gibt den Dativ und den Infinitiv direkt und natürlich wieder, ohne die Aussage durch „Sklaven sein“ interpretierend zu verschärfen.
- source_word: interficere nos
  choice: um uns zu töten
  rationale: Bewahrt die im Lateinischen ausgedrückte Zweckvorstellung und den scharfen Vorwurf.
theological_decisions:
- issue: Vorwurf einer Tötungsabsicht
  choice: „um uns zu töten“
  alternative: „damit wir sterben“
  rationale: Das lateinische „interficere nos“ bezeichnet ein aktives Töten und sollte nicht zu einem bloßen Sterben abgeschwächt werden.
- issue: Ergänzung des am Fragmentende fehlenden Ortsbezugs
  choice: „in dieser Wüste“
  alternative: Satzabbruch nach „zu sterben“
  rationale: Der überlieferte lateinische Ausschnitt endet mit „in“; die von der englischen Konsultationsfassung bestätigte Ergänzung stellt den offenkundig begonnenen Ortsausdruck verständlich her. Da der bereitgestellte lateinische Text unvollständig ist, wird die Ergänzung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Syntax. Der Vorwurf und der Vergleich mit dem Dienst für die Ägypter bleiben eng an der lateinischen Formulierung.
