lexical_decisions:
- source_word: ab oriente
  choice: aus dem Osten
  rationale: Gibt die Herkunftsangabe des lateinischen Ausdrucks knapp und natürlich wieder; der fragmentarische Anschluss an den vorhergehenden Kontext bleibt erhalten.
- source_word: quibus dabo
  choice: denen ich … geben werde
  rationale: Bewahrt den Bezug auf eine vorangehende Personengruppe sowie die futurische Aussage.
- source_word: ducattum
  choice: als Führer
  rationale: Die überlieferte Form ist ungewöhnlich bzw. fehlerhaft, wird hier aber entsprechend dem erkennbaren Sinn einer Leitungsfunktion wiedergegeben. Die prädikative Formulierung macht deutlich, dass Abraham, Isaak und Jakob dieser Gruppe zur Führung gegeben werden.
theological_decisions:
- issue: Rolle Abrahams, Isaaks und Jakobs
  choice: als Führer
  alternative: zur Führung / als Führung
  rationale: Die Personen werden als diejenigen verstanden, die der genannten Gruppe leitend zugeordnet werden. Die Übersetzung vermeidet weitergehende Aussagen über Art, Zeitpunkt oder Heilsbedeutung dieser Führung.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch. Da der Versausschnitt syntaktisch an den vorhergehenden Kontext anschließt und mit einem Komma endet, bleibt die deutsche Fassung ebenfalls fragmentarisch.
