source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non ignem uobis pro blasphemiis dedi, sed mittens lignum in aqua dulce feci flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: de
  text: Ich gab euch nicht Feuer wegen eurer Lästerungen, sondern indem ich Holz ins Wasser warf, machte ich den Fluss süß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: blasphemiis
  choice: Lästerungen
  rationale: Der lateinische Plural bezeichnet ehrfurchtslose bzw. beleidigende Äußerungen gegen Gott; „Lästerungen“ bewahrt Bedeutung und Zahl, ohne den Bezug weiter einzuengen.
- source_word: lignum
  choice: Holz
  rationale: „Holz“ entspricht dem lateinischen Sammel- bzw. Stoffbegriff und wahrt zugleich die Anspielung auf das ins Wasser geworfene Holz.
- source_word: dulce feci
  choice: machte … süß
  rationale: 'Die wörtliche Wiedergabe erhält das konkrete Wunderzeichen: Bitteres bzw. ungenießbares Wasser wird süß.'
- source_word: flumen
  choice: Fluss
  rationale: „Fluss“ ist die direkte Bedeutung des lateinischen Ausdrucks; eine Angleichung an die Exodusüberlieferung durch „Wasser“ oder „Quelle“ wäre interpretierend.
theological_decisions:
- issue: Gegensatz zwischen verdientem Gericht und gnädiger Versorgung
  choice: Die adversative Struktur „nicht … sondern“ bleibt ausdrücklich erhalten.
  alternative: Den Satz erklärend als Verschonung trotz der Lästerungen wiederzugeben.
  rationale: Der lateinische Text stellt Feuer als mögliche Antwort auf die Lästerungen der Süßung des Wassers gegenüber, ohne das Verhältnis weiter auszudeuten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die koordinierte Form „warf … und machte“ gibt das lateinische Partizip „mittens“ natürlich wieder und lässt dessen instrumentale bzw. begleitende Nuance im Zusammenhang erkennen.
