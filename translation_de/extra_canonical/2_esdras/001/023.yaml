  terminology: „Lästerungen“, „Holz“ und „Fluss“ sind sachgerecht. „süß machen“ bewahrt die konkrete Ausdrucksweise von „dulce feci“, ohne die Stelle durch „trinkbar“ oder eine Anspielung auf Exodus ausdeutend zu paraphrasieren.
