  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: de
  text: Wenn ihr mir Opfer darbringt[a], werde ich mein Angesicht von euch abwenden; denn eure Festtage, Neumonde und Beschneidungen des Fleisches habe ich verworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieses Kapitel gehört zu der späteren christlichen Schicht, die oft als 5. Esra bezeichnet wird. Die Zurückweisung von »Festtagen, Neumonden und Beschneidungen des Fleisches« spiegelt die polemische Stimme dieser Schicht wider und darf nicht mit der Theologie der jüdischen Apokalypse in den Kapiteln 3–14 gleichgesetzt werden.
    reason: compositional_layer
lexical_decisions:
- source_word: obtulleritis
  choice: Opfer darbringt
  rationale: Das überlieferte lateinische Verb bezeichnet hier ein Darbringen; aus dem Zusammenhang ergibt sich als natürlichste Ergänzung »Opfer«.
- source_word: auertam faciem meam a uobis
  choice: werde ich mein Angesicht von euch abwenden
  rationale: Bewahrt das biblische Bild des abgewandten Angesichts und gibt die zukünftige Verbform genau wieder.
- source_word: dies enim festos uestros et neomenias
  choice: denn eure Festtage, Neumondfeste
  rationale: »Neumondfeste« macht die kultische Bedeutung von neomenias im modernen Deutschen deutlich, ohne sie mit gewöhnlichen Kalendermonaten zu verwechseln.
- source_word: circumcisiones carnis
  choice: Beschneidungen des Fleisches
  rationale: Die wörtliche, bewusst zugespitzte Formulierung wird beibehalten und nicht theologisch geglättet.
- source_word: repudiavi
  choice: habe ich verworfen
  rationale: Gibt die entschiedene Zurückweisung im lateinischen Perfekt angemessen wieder.
theological_decisions:
- issue: Polemische Zurückweisung jüdischer Kultpraktiken
  choice: Die Aufzählung und ihre schroffe Zurückweisung bleiben unverändert stehen; eine Fußnote ordnet sie der späteren christlichen Schicht zu.
  alternative: Die Aussage im Haupttext abmildern oder unmittelbar auf die gesamte jüdische Apokalypse in Kapitel 3–14 beziehen.
  rationale: Der Wortlaut der Quelle ist zu bewahren, doch seine kompositionsgeschichtliche Einordnung verhindert, dass die Stimme dieser späteren Schicht mit der Theologie des älteren jüdischen Werkteils gleichgesetzt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem biblischem Ausdruck »mein Angesicht«. Die kultischen Begriffe werden klar und quellennah wiedergegeben. Das am Ende des Quellenausschnitts stehende »Ego« gehört offenbar zum folgenden Satz und wird daher in diesem Vers nicht übersetzt.
