  text: in escam, panem angelorum manducastis. Nonne cum sitiretis petram excidi, et fluxerunt aquae in satietate? propter aestus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: de
  text: Als Nahrung habt ihr Engelbrot gegessen. Als ihr Durst hattet, habe ich da nicht den Felsen gespalten, sodass Wasser in Fülle strömte? Wegen der Hitze bedeckte ich euch mit den Blättern der Bäume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorgelegte lateinische Textzeile bricht nach „wegen der Hitze“ ab. Der restliche Satz folgt der überlieferten Fortsetzung, die auch der englischen Konsultationsfassung zugrunde liegt: „bedeckte ich euch mit den Blättern der Bäume“.'
    reason: Die im Haupttext wiedergegebene Fortsetzung steht nicht im bereitgestellten lateinischen Ausschnitt und muss daher kenntlich gemacht werden.
lexical_decisions:
- source_word: in escam
  choice: als Nahrung
  rationale: Gibt die Zweck- bzw. Verwendungsangabe knapp und idiomatisch wieder.
- source_word: panem angelorum
  choice: Engelbrot
  rationale: Bewahrt das biblisch geprägte Bild und klingt im Deutschen natürlicher als „Brot der Engel“ in dieser Satzstellung.
- source_word: petram excidi
  choice: den Felsen gespalten
  rationale: Gibt das aktive Aufbrechen des Felsens wieder; „Felsen“ entspricht dem konkreten lateinischen petra.
- source_word: in satietate
  choice: in Fülle
  rationale: Bezeichnet hier eine bis zur Sättigung reichende, überreiche Wassermenge und nicht wörtlich den Zustand „Sättigung“.
- source_word: propter aestus
  choice: wegen der Hitze
  rationale: Direkte und natürliche Wiedergabe der kausalen Fügung.
theological_decisions:
- issue: Bezug von „Engelbrot“
  choice: Das Bild bleibt ohne erklärende Gleichsetzung stehen.
  alternative: Ausdrückliche Identifizierung mit Manna
  rationale: Der lateinische Text nennt „panem angelorum“, legt die Identifizierung im Vers selbst aber nicht ausdrücklich aus.
- issue: Verknüpfung von Felsspaltung und Wasserfluss
  choice: „sodass“ gibt den Wasserfluss als Folge der Felsspaltung wieder.
  alternative: „und Wasser strömte in Fülle“
  rationale: So bleibt die rhetorische Frage im Deutschen grammatisch klar, ohne aus dem zweiten Teilsatz eine weitere, im Lateinischen nicht eigens markierte Frage zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage wird natürlich formuliert; das biblische Bild „Engelbrot“ bleibt knapp und unverdeutlicht erhalten.
