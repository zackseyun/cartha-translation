  terminology: „Volk“, „Gott“, „Söhne“ und „Vater“ sind treffend und registergerecht. Eine Fußnote zu „Söhne“ ist nicht erforderlich, da der lateinische Text ausdrücklich „filios“ bietet und die englische Alternativnote keine textkritische Unsicherheit markiert.
