  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: de
  text: damit ihr mein Volk wärt und ich euer Gott wäre und ihr meine Söhne wärt und ich euer Vater wäre?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populum
  choice: Volk
  rationale: Bewahrt die geläufige biblische Bundesformel „mein Volk … euer Gott“.
- source_word: filios
  choice: Söhne
  rationale: Gibt den maskulinen Plural genau wieder und erhält die ausdrückliche Sohn-Vater-Bildsprache sowie den lexikalischen Bezug zum vorhergehenden Vers.
- source_word: patrem
  choice: Vater
  rationale: Entspricht direkt dem lateinischen Singular und bildet das Gegenstück zu „Söhne“.
theological_decisions:
- issue: Beziehungsformeln mit mihi/vobis und in + Akkusativ
  choice: „mein Volk … euer Gott … meine Söhne … euer Vater“
  alternative: „mir zum Volk … euch zum Gott … mir zu Söhnen … euch zum Vater“
  rationale: Die possessive deutsche Fassung gibt die wechselseitige Bundesbeziehung natürlich und traditionsnah wieder, ohne den Sinn in Richtung bloßer Zugehörigkeit oder Wesensveränderung festzulegen.
- issue: Wiedergabe von filios
  choice: „Söhne“
  alternative: „Kinder“
  rationale: „Söhne“ bewahrt die konkrete Vater-Sohn-Metaphorik und die sprachliche Verbindung zum vorangehenden filios; die inklusive Erweiterung „Kinder“ wäre hier weniger quellennah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzführung. Das am Ende der gelieferten lateinischen Zeile stehende „Ita vos“ wurde entsprechend der vorgegebenen Versabgrenzung und der konsultierten englischen Fassung nicht in Vers 29 aufgenommen; es gehört syntaktisch zum folgenden Zusammenhang.
