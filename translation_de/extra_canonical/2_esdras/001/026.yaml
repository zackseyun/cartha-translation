source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quando inuocabitis me, ego non exaudiam uos: maculastis enim manus uestras sanguine, et pedes uestri inpigri sunt ad committenda homicidia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/026.yaml
  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: de
  text: Wenn ihr mich anruft, werde ich euch nicht erhören; denn ihr habt eure Hände mit Blut befleckt, und eure Füße sind eifrig dabei, Morde zu begehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: ihr mich anruft
  rationale: Gibt den religiösen Sinn von invocare natürlich und unmittelbar wieder.
- source_word: non exaudiam
  choice: werde ich euch nicht erhören
  rationale: Bewahrt gegenüber einem bloßen »hören« den Sinn, dass der Ruf keine gewährende Antwort findet.
- source_word: maculastis
  choice: habt ... befleckt
  rationale: Entspricht dem Bild kultischer und moralischer Verunreinigung und ist im Deutschen idiomatisch.
- source_word: inpigri sunt
  choice: sind schnell dabei
  rationale: Das lateinische inpigri bezeichnet hier tatkräftige Bereitschaft beziehungsweise Eile; die Formulierung klingt modern, ohne die Aussage abzuschwächen.
- source_word: ad committenda homicidia
  choice: Mord zu begehen
  rationale: homicidia steht im Plural, kann jedoch kollektiv für Mordtaten beziehungsweise das Morden stehen; der deutsche Singular »Mord« gibt die verbrecherische Tötung prägnant wieder.
theological_decisions:
- issue: Gottes Nichterhören
  choice: werde ich euch nicht erhören
  alternative: werde ich euch nicht hören
  rationale: Die Übersetzung erhält die Spannung einer angekündigten Verweigerung göttlicher Antwort, ohne darüber hinaus eine allgemeine Lehre über Gebet oder Vergebung zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Satzbau und die Bildsprache. Keine Fußnoten erforderlich.
