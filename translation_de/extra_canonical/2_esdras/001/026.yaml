  verdict: revise
  source_fidelity: Der Entwurf gibt Anrufung, angekündigtes Nichterhören und das Bild blutbefleckter Hände zutreffend wieder. Bei „inpigri“ ist jedoch „schnell dabei“ etwas zu umschreibend und schwächer als die entschlossene, eifrige Bereitschaft des lateinischen Ausdrucks. Zudem sollte der Plural „homicidia“ im Deutschen als „Morde“ erhalten bleiben.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Eure Füße sind eifrig dabei, Morde zu begehen“ ist natürlich genug und bildet die Aussage präziser ab als „sind schnell dabei, Mord zu begehen“.
  terminology: „anruft“, „erhören“ und „mit Blut befleckt“ sind angemessen, registergerecht und theologisch nicht überdeutet. „Morde“ bewahrt den lateinischen Plural, ohne eine über den Text hinausgehende rechtliche Differenzierung einzutragen.
  issues:
  - severity: low
    issue: „sind schnell dabei“ gibt „inpigri sunt“ nur abgeschwächt wieder.
    rationale: „inpigri“ bezeichnet Unermüdlichkeit, Eifer bzw. tatkräftige Bereitschaft, nicht bloß Schnelligkeit.
  - severity: low
    issue: Der Singular „Mord“ nivelliert den Plural „homicidia“.
    rationale: Der lateinische Text spricht von mehrfachen Tötungsverbrechen; „Morde“ kann dies im Deutschen ohne Bedeutungszuwachs wiedergeben.
  revised_text: Wenn ihr mich anruft, werde ich euch nicht erhören; denn ihr habt eure Hände mit Blut befleckt, und eure Füße sind eifrig dabei, Morde zu begehen.
