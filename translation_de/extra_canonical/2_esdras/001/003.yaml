source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Filii Aaron ex tribu Leui, qui fuit captiuus in regione Medorum, in regno Artaxersis regis Persarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: de
  text: des Sohnes Aarons aus dem Stamm Levi, der im Gebiet der Meder ein Gefangener war, zur Regierungszeit des Artaxerxes, des Königs der Perser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii Aaron
  choice: Söhne Aarons
  rationale: „Filii“ ist formal Plural; der Genitivname wird im Deutschen natürlich als „Aarons“ wiedergegeben.
- source_word: ex tribu Leui
  choice: aus dem Stamm Levi
  rationale: Entspricht der genealogischen Herkunftsangabe und ist im modernen Bibeldeutsch geläufig.
- source_word: captiuus
  choice: Gefangene
  rationale: Das Prädikatswort bezeichnet mit „fuit“ einen Zustand beziehungsweise Status, nicht ausdrücklich den Vorgang der Gefangennahme.
- source_word: in regione Medorum
  choice: im Gebiet der Meder
  rationale: „regio“ bezeichnet hier ein Gebiet oder eine Region; „Gebiet“ klingt natürlich und lässt die genaue politische Geografie offen.
- source_word: in regno Artaxersis regis Persarum
  choice: zur Regierungszeit des Artaxerxes, des Königs der Perser
  rationale: In diesem zeitlichen Zusammenhang bezeichnet „in regno“ die Herrschafts- oder Regierungszeit; die Apposition wird im Deutschen klar gegliedert.
theological_decisions:
- issue: Numeruswechsel zwischen „Filii“ und „qui fuit captiuus“
  choice: Im Haupttext pluralisch auf „Söhne“ bezogen; die lateinische Singularform wird in einer Fußnote offengelegt.
  alternative: „Sohn Aarons …, der … Gefangener war“ oder eine streng wörtliche, grammatisch spannungsvolle Mischform.
  rationale: Der eröffnende Plural „Filii“ ist eindeutig, während Relativpronomen und Kopula unerwartet im Singular stehen. Eine flüssige deutsche Wiedergabe folgt dem Plural, ohne die Abweichung des Quellenwortlauts zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt knapp und genealogisch-historisch; „Gefangene waren“ beschreibt bewusst den Zustand der Gefangenschaft und nicht ausdrücklich den Vorgang der Gefangennahme.
