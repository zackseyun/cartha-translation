  verdict: revise
  source_fidelity: Die Pluraldeutung von „Filii Aaron“ ist hier nicht haltbar. Im Kontext einer fortlaufenden Genealogie kann und muss „filii“ als Genitiv Singular von „filius“ („des Sohnes“) gelesen werden. Das folgende Singular-Relativpronomen „qui“ und „fuit captiuus“ bestätigt diese syntaktische Zuordnung; es liegt kein Numeruswechsel im lateinischen Text vor.
  naturalness: Die revidierte Fassung ist ein natürlicher, knapper Anschluss innerhalb einer Genealogie. „ein Gefangener war“ gibt den mit „fuit captiuus“ bezeichneten Zustand idiomatisch wieder.
  terminology: „Stamm Levi“, „Gebiet der Meder“ und „zur Regierungszeit des Artaxerxes, des Königs der Perser“ sind sachgerecht und registerangemessen. Der Eigenname Levi bleibt in dieser genealogischen Formel ohne zusätzliche Flexion.
  issues:
