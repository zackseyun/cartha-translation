    issue: „Filii Aaron“ wurde als Nominativ Plural („Söhne Aarons“) übersetzt.
    rationale: „Filii“ ist formal sowohl Nominativ Plural als auch Genitiv Singular. Das unmittelbar folgende „qui fuit captiuus“ steht eindeutig im Singular und zeigt, dass hier der Genitiv Singular „des Sohnes Aarons“ in einer genealogischen Kette vorliegt.
  - severity: medium
    issue: Die Fußnote behauptet einen unerwarteten Wechsel vom Plural zum Singular.
    rationale: Ein solcher Wechsel besteht nicht, wenn „filii“ korrekt als Genitiv Singular gelesen wird. Die Fußnote erzeugt daher eine nicht vorhandene textkritische bzw. grammatische Schwierigkeit.
  revised_text: des Sohnes Aarons aus dem Stamm Levi, der im Gebiet der Meder ein Gefangener war, zur Regierungszeit des Artaxerxes, des Königs der Perser.
