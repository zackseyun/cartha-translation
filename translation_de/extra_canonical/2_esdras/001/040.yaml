base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/040.yaml
  text: Nahum and Habakkuk[a], Zephaniah, Haggai, Zechariah, and Malachi[b], who is also called the angel of the Lord.”
translation:
  language: de
  text: Nahum und Habakuk, Zefanja, Haggai, Sacharja und Maleachi, der auch Engel des Herrn[a] genannt wurde.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bote des Herrn«. Das lateinische Wort »angelus« kann einen Engel oder einen Boten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: angelus domini
  choice: Engel des Herrn
  rationale: Das lateinische »angelus« bezeichnet im frühchristlichen Sprachgebrauch gewöhnlich einen Engel. Die Formulierung wird daher nicht allein aufgrund der Namensbedeutung von Maleachi zu »Bote« abgeschwächt; die lexikalisch mögliche Wiedergabe »Bote des Herrn« bleibt in der Fußnote erhalten.
- source_word: qui et ... uocatus est
  choice: der auch ... genannt wird
  rationale: Die natürliche deutsche Relativkonstruktion wahrt den Singular und bezieht die Aussage unmittelbar auf Maleachi.
theological_decisions:
- issue: Identifizierung Maleachis als »Engel des Herrn«
  choice: Die Aussage des lateinischen Textes wird direkt wiedergegeben, ohne sie umzudeuten.
  alternative: »Bote des Herrn«, verstanden als Erklärung des Namens Maleachi
  rationale: Der Quelltext verwendet ausdrücklich »angelus domini«. Ob damit eine ontologische Identifizierung oder ein Titel beziehungsweise ein Wortspiel gemeint ist, wird nicht entschieden.
translation_notes:
  register: Moderne, würdige Standardsprache; gebräuchliche deutsche Namensformen. Das schließende deutsche Anführungszeichen wurde beibehalten, da der Vers offenbar eine zuvor begonnene Rede abschließt.
