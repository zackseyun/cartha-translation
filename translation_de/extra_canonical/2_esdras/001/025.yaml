source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam me dereliquistis, et ego uos derelinquam: petentibus uobis a me misericordiam, non miserebor uestri.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: de
  text: Weil ihr mich verlassen habt, werde auch ich euch verlassen. Wenn ihr mich um Erbarmen bittet, werde ich kein Erbarmen mit euch haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: verlassen habt / verlassen
  rationale: Die Wiederholung desselben deutschen Verbs bewahrt die vergeltende Parallelität des lateinischen Wortspiels.
- source_word: misericordiam / miserebor
  choice: Erbarmen / Erbarmen haben
  rationale: „Erbarmen“ gibt sowohl das Substantiv als auch das verwandte Verb natürlich wieder und erhält die lexikalische Wiederholung.
- source_word: petentibus uobis a me
  choice: Wenn ihr mich um … bittet
  rationale: Die lateinische Partizipialkonstruktion wird als verständlicher temporaler beziehungsweise konditionaler Nebensatz wiedergegeben, ohne die genaue Nuance stärker festzulegen.
theological_decisions:
- issue: Göttliche Antwort auf das Verlassenwerden
  choice: Die wechselseitige Formulierung wird unmittelbar und uneingeschränkt beibehalten.
  alternative: Die Aussage durch „meine Hilfe entziehen“ oder eine ähnliche Deutung abschwächen.
  rationale: Der lateinische Text stellt der Abkehr des Volkes ausdrücklich Gottes künftiges Verlassen gegenüber; diese theologische Spannung darf nicht aufgelöst werden.
- issue: Verweigerung des Erbarmens
  choice: „werde ich kein Erbarmen mit euch haben“
  alternative: „werde ich euch nicht erhören“
  rationale: Der Ausgangstext spricht ausdrücklich vom Erbarmen, nicht lediglich von der Erhörung eines Gebets.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die beiden bewussten Wortwiederholungen des lateinischen Textes bleiben erhalten; Fußnoten sind nicht erforderlich.
