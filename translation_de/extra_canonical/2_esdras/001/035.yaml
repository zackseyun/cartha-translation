  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: de
  text: Ich werde eure Häuser einem Volk geben[a], dessen Angehörige an mich glauben, ohne mich zu hören. Ihnen habe ich keine Zeichen gezeigt, und doch werden sie tun, was ich geboten habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Volk, das kommt“.'
    reason: Das lateinische Partizip „uenienti“ kann als attributives „kommend“ oder mit einem Relativsatz wiedergegeben werden.
lexical_decisions:
- source_word: domus uestras
  choice: eure Häuser
  rationale: Gibt den Plural „domus“ und das Possessivpronomen direkt und natürlich wieder.
- source_word: populo uenienti
  choice: einem Volk, das kommt
  rationale: Bewahrt die Dativkonstruktion und den gegenwärtigen Vorgang des Partizips „uenienti“, ohne ihn unnötig als fernes Zukunftsgeschehen festzulegen.
- source_word: qui me non audientes credunt
  choice: Menschen, die an mich glauben, ohne mich zu hören
  rationale: Die explizierende Wiederaufnahme mit „Menschen“ löst den Numeruswechsel von „populo“ zum pluralischen „qui … audientes“ im Deutschen verständlich auf. Das Präsens „glauben“ und die Gleichzeitigkeit von Nicht-Hören und Glauben bleiben erhalten.
- source_word: quibus signa non ostendi
  choice: Ihnen habe ich keine Zeichen gezeigt
  rationale: Gibt das Perfekt „ostendi“ als abgeschlossenes Nichtzeigen wieder und bezieht das Relativpronomen auf die genannten Menschen.
- source_word: facient quae praecepi
  choice: werden sie tun, was ich geboten habe
  rationale: Bewahrt den Gegensatz zwischen gegenwärtigem Glauben („credunt“) und zukünftigem Handeln („facient“) sowie den rückblickenden Charakter von „praecepi“.
theological_decisions:
- issue: Glaube ohne Hören oder Glaube trotz fehlender Zeichen
  choice: 'Beide Aussagen werden getrennt und ohne harmonisierende Erklärung wiedergegeben: Sie glauben, ohne zu hören, und werden trotz nicht gezeigter Zeichen gehorchen.'
  alternative: „Obwohl sie mich nicht gehört haben, werden sie glauben“ oder eine Deutung als ausschließlich zukünftige Bekehrung.
  rationale: Der lateinische Text setzt „credunt“ ins Präsens und „facient“ ins Futur. Diese zeitliche und theologische Spannung darf nicht zugunsten einer glatteren Abfolge beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht den lateinischen Wechsel vom singularischen Kollektiv „Volk“ zu den pluralisch bezeichneten Angehörigen transparent. „Prophetas“ am Ende der gelieferten Zeichenfolge wurde nicht aufgenommen, da es erkennbar zum folgenden Satz beziehungsweise Vers gehört.
