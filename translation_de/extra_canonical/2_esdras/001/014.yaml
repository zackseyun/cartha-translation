- from: Ich gab euch Mose zum Führer und Aaron zum Priester. Durch eine Feuersäule schenkte ich euch Licht, und ich vollbrachte große Wunder an euch.
  to: Ich gab euch Mose zum Führer und Aaron zum Priester. Durch eine Feuersäule gab ich euch Licht, und ich vollbrachte große Wunder unter euch.
  rationale: Die Revision ersetzt allein die missverständliche Präposition beim letzten Satzglied durch „unter euch“ und glättet „schenkte“ zu dem neutraleren „gab“. Dadurch wird der Personenbezug des lateinischen Satzes in Übereinstimmung mit dem englischen Audit-Trail idiomatisch und quellentreu wiedergegeben.
