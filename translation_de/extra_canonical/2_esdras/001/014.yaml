  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: de
  text: Ich gab euch Mose zum Führer und Aaron zum Priester. Durch eine Feuersäule gab ich euch Licht, und ich vollbrachte große Wunder unter euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem uobis dedi Moysen
  choice: Ich gab euch Mose zum Führer
  rationale: Gibt die lateinische Konstruktion mit „dedi“ und prädikativem „ducem“ knapp, natürlich und inhaltlich genau wieder.
- source_word: Aaron sacerdotem
  choice: Aaron zum Priester
  rationale: Die parallele Formulierung bewahrt die enge Verbindung mit „dedi“ und die Symmetrie zu Mose als Führer.
- source_word: Lucem uobis per columnam ignis praestiti
  choice: Durch eine Feuersäule schenkte ich euch Licht
  rationale: „Durch“ gibt das instrumentale „per“ wieder; „schenkte“ vermittelt „praestiti“ als Gewähren beziehungsweise Bereitstellen, ohne die Wiederholung von „gab“.
- source_word: magna mirabilia feci in
  choice: ich vollbrachte große Wunder an euch
  rationale: „Vollbrachte“ ist eine natürliche, würdige Wiedergabe von „feci“ bei Wundern. Das überlieferte Satzende „in“ ist im vorgelegten Ausschnitt unvollständig; die konsultierte englische Fassung setzt den erwarteten Personenbezug voraus. „An euch“ bewahrt dabei die mögliche Bedeutung von lateinisch „in vobis“ besser als eine rein räumliche Festlegung.
