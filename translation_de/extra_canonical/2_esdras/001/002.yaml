source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Filii Achiae, filii Finees, filii Heli, filii Ameriae, filii Aziei, filii Marimoth, filii Arna, filii Oziae, filii Borith, filii Abissei, filii Finees, filii Eleazar,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/002.yaml
  text: son of Ahijah[a], son of Phinehas, son of Eli, son of Amariah, son of Aziah, son of Meraioth, son of Arna, son of Uzziah, son of Borith, son of Abishua, son of Phinehas, son of Eleazar,
translation:
  language: de
  text: Sohn Ahijas, Sohn des Pinhas, Sohn Elis, Sohn Amarjas, Sohn Asjas, Sohn Merajots, Sohn Arnas, Sohn Usijas, Sohn Borits, Sohn Abischuas, Sohn des Pinhas, Sohn Eleasars,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii
  choice: Sohn
  rationale: Die wiederholte lateinische Abstammungsformel wird im Deutschen als fortlaufende Genealogie wiedergegeben; bei Namen mit Artikelgebrauch steht natürliches „Sohn des“.
- source_word: Achiae
  choice: Ahijas
  rationale: Die latinisierte Namensform wird mit der geläufigen deutschen biblischen Form Ahija wiedergegeben; die abweichende frühere Zuordnung wird in einer Fußnote bewahrt.
- source_word: Finees
  choice: Pinhas
  rationale: Verwendet die im modernen deutschen Bibelgebrauch verbreitete Form des hebräischen Namens.
- source_word: Heli
  choice: Eli
  rationale: Die lateinische Form entspricht dem geläufigen deutschen biblischen Namen Eli.
- source_word: Ameriae
  choice: Amarjas
  rationale: Gibt die latinisierte Form mit der etablierten deutschen biblischen Namensform Amarja wieder.
- source_word: Aziei
  choice: Asjas
  rationale: Nahe Wiedergabe der lateinischen Namensform in deutscher biblischer Orthografie, ohne sie mit einem anderen Namen gleichzusetzen.
- source_word: Marimoth
  choice: Merajots
  rationale: Entspricht der traditionellen priestlichen Genealogie und der geläufigen deutschen Form Merajot.
- source_word: Arna
  choice: Arnas
  rationale: Der seltene Name wird formal als Arna übernommen und für die deutsche Abstammungsformel in den Genitiv gesetzt.
- source_word: Oziae
  choice: Usijas
  rationale: Die lateinische Form Ozia wird mit der geläufigen deutschen Form Usija wiedergegeben, nicht mit dem anderen Namen Uszi.
- source_word: Borith
  choice: Borits
  rationale: Der im lateinischen Text überlieferte seltene Name wird möglichst formnah deutsch wiedergegeben.
- source_word: Abissei
  choice: Abischuas
  rationale: Die Form gehört in der priesterlichen Linie zu Abischua; Abischai würde eine andere biblische Person bezeichnen.
- source_word: Eleazar
  choice: Eleasars
  rationale: Verwendet die geläufige deutsche biblische Form Eleasar im Genitiv.
theological_decisions: []
translation_notes:
  register: Knappe, würdige genealogische Reihung in modernem Standarddeutsch. Die Eigennamen folgen, soweit sicher identifizierbar, geläufigen deutschen Bibelformen; seltene Namen bleiben nahe an der lateinischen Überlieferung. Das abschließende Komma bleibt erhalten, weil der Satz im folgenden Vers weitergeführt wird.
