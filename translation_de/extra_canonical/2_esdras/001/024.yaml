id: 2ES.1.24
reference: 2 Esdras 1:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: de
  text: Was soll ich dir tun, Jakob? Du wolltest nicht auf mich hören, Juda. Ich werde mich anderen Völkern zuwenden und ihnen meinen Namen geben, damit sie meine Satzungen halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: Was soll ich dir tun
  rationale: Gibt die lateinische Dativkonstruktion eng wieder und bewahrt den offenen, möglicherweise drohenden Ton der rhetorischen Frage.
- source_word: obaudire
  choice: auf mich hören
  rationale: Natürliches modernes Deutsch für gehorchendes Hören; der Bezug „me“ wird ausdrücklich als „auf mich“ wiedergegeben.
- source_word: transferam me ad alias gentes
  choice: Ich werde mich anderen Völkern zuwenden
  rationale: Bewahrt die reflexive Bewegung des lateinischen Ausdrucks und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „versetzen“.
- source_word: nomen meum
  choice: meinen Namen
  rationale: Direkte und theologisch offene Entsprechung; die Bedeutung des Namens wird nicht interpretierend ausgeweitet.
- source_word: legitima mea
  choice: meine Satzungen
  rationale: Entspricht dem Sinn verbindlicher göttlicher Bestimmungen und wahrt den gehobenen biblischen Sprachton.
theological_decisions:
- issue: Zuwendung zu anderen Völkern
  choice: anderen Völkern
  alternative: den Heiden
  rationale: „Gentes“ bezeichnet hier andere Völker bzw. Nationen. Die neutrale Wiedergabe vermeidet eine konfessionell oder abwertend gefärbte Festlegung.
- issue: Gabe des göttlichen Namens
  choice: ihnen meinen Namen geben
  alternative: sie nach meinem Namen nennen
  rationale: Die wörtliche Formulierung bewahrt die inhaltliche Offenheit des lateinischen Textes, statt die Gabe des Namens als Benennung, Zugehörigkeit oder Offenbarung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den lateinischen Ausgangstext. Die Anreden „Jakob“ und „Juda“ sowie der Wechsel zu „anderen Völkern“ bleiben unverändert und werden nicht harmonisiert.
