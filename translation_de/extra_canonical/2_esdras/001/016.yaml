source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: de
  text: Ich gab [etwas] zum Schutz[a], und dort habt ihr gemurrt. Ihr habt nicht in meinem Namen über den Untergang eurer Feinde gejubelt, sondern noch immer …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut nennt kein Objekt. „[etwas]“ ist im Deutschen nur zur grammatischen Ergänzung hinzugefügt.
    reason: ad tutelam dedi enthält kein genanntes Objekt.
  - marker: b
    text: Der hier zugrunde gelegte lateinische Text bricht an dieser Stelle mitten im Satz ab.
    reason: sed adhuc („sondern noch immer“) verlangt eine Fortsetzung, die im angegebenen Quellenausschnitt nicht enthalten ist.
lexical_decisions:
- source_word: ad tutelam dedi
  choice: Zum Schutz gab ich
  rationale: Gibt die Zweckangabe ad tutelam und dedi wieder, ohne ein im vorliegenden lateinischen Text nicht genanntes Objekt zu ergänzen. Die dadurch entstehende Offenheit entspricht dem fragmentarischen Versanfang.
- source_word: murmurastis
  choice: habt ihr gemurrt
  rationale: „Murren“ ist die natürliche und im biblischen Zusammenhang treffende Wiedergabe des vorwurfsvollen murmurare.
- source_word: triumphastis
  choice: habt ihr … gejubelt
  rationale: Mit de perditione bezeichnet triumphare hier das Jubeln beziehungsweise Frohlocken über ein Ereignis, nicht das Besiegen dieses Ereignisses.
- source_word: in nomine meo
  choice: in meinem Namen
  rationale: Bewahrt die knappe und theologisch offene lateinische Formulierung, ohne sie als „mir zu Ehren“ oder „durch meine Macht“ festzulegen.
- source_word: de perditione inimicorum uestrorum
  choice: über den Untergang eurer Feinde
  rationale: de mit Ablativ nennt den Anlass des Jubels; „Untergang“ gibt perditio angemessen wieder.
- source_word: sed adhuc
  choice: sondern noch immer …
  rationale: Der überlieferte Ausschnitt bricht nach adhuc ab. Die Auslassungspunkte bewahren den unvollständigen Satz, statt ihn durch nicht belegte Wörter zu ergänzen.
theological_decisions:
- issue: Bedeutung von „in nomine meo“
  choice: in meinem Namen
  alternative: mir zu Ehren / kraft meines Namens
  rationale: Der lateinische Ausdruck kann unterschiedliche Nuancen tragen. Die formnahe Wiedergabe erhält diese theologische Spannung.
- issue: Reaktion auf den Untergang der Feinde
  choice: über den Untergang … gejubelt
  alternative: den Untergang … im Triumph überwunden
  rationale: Die Konstruktion triumphare de bezeichnet hier Jubel über den Untergang. Sie sagt nicht, dass Israel den Untergang selbst besiegt oder herbeigeführt habe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murren“ hält den biblischen Ton, bleibt aber allgemein verständlich. Der fragmentarische Anfang und Schluss werden nicht durch unbelegte Ergänzungen geglättet.
