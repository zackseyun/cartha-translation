id: 2ES.1.11
reference: 2 Esdras 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: de
  text: Ich vernichtete alle Völker vor ihnen; und im Osten zerstreute ich das Volk der beiden Provinzen, Tyrus und Sidon, und tötete alle ihre Gegner.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: vor ihnen
  rationale: Gibt die lateinische räumlich-relationale Wendung knapp wieder; gemeint sind die Völker, die Israel im Weg beziehungsweise gegenüberstanden.
- source_word: perdidi
  choice: vernichtete
  rationale: Bewahrt die starke Bedeutung von »zugrunde richten/vernichten« im militärischen Kontext.
- source_word: prouinciarum duarum
  choice: der beiden Provinzen
  rationale: Formale und verständliche Wiedergabe des lateinischen Ausdrucks, ohne die politische Einordnung näher festzulegen.
- source_word: dissipaui
  choice: zerstreute
  rationale: Entspricht dem Grundsinn von »auseinandertreiben/zerstreuen« und bewahrt den Unterschied zu »vernichten«.
- source_word: aduersarios
  choice: Gegner
  rationale: Neutraler und kontextgerechter als »Feinde«; lässt offen, ob militärische oder allgemein widerstrebende Gegner gemeint sind.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Bindung an den lateinischen Satzbau. Das einleitende Verb wurde vorgezogen, damit der Gottesredecharakter und die parallelen Handlungen klar bleiben; die Ortsangabe »im Osten« bleibt bewusst ohne zusätzliche Deutung.
