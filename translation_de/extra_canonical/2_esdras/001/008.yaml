id: 2ES.1.8
reference: 2 Esdras 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: de
  text: Du aber, schüttle dein Haupthaar aus und wirf alles Unheil[b] auf sie, denn sie haben meinem Gesetz nicht gehorcht. Sie sind ein undiszipliniertes Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Volk ohne Zucht“; sinngemäß auch: „ein rebellisches Volk“.'
    reason: indisciplinatus bezeichnet zunächst fehlende disciplina, kann im Zusammenhang aber auch hartnäckige Widersetzlichkeit ausdrücken.
  - marker: b
    text: 'Oder: „alles Böse“ beziehungsweise „alle Übel“.'
    reason: Das lateinische mala hat sowohl eine moralische als auch eine leid- oder unheilbezogene Bedeutungsbreite.
lexical_decisions:
- source_word: excute comam capitis tui
  choice: schüttle dein Haupthaar aus
  rationale: Die konkrete Bildsprache des lateinischen Ausdrucks wird bewahrt; „Haupthaar“ gibt comam capitis tui knapp und würdig wieder.
- source_word: omnia mala
  choice: alles Unheil
  rationale: Das substantivierte Neutrum Plural mala kann Böses oder Übel beziehungsweise Unheil bezeichnen. Im Zusammenhang des Auf-sie-Werfens bezeichnet „Unheil“ am natürlichsten die sie treffenden Übel, ohne den Ausdruck unnötig zu spezifizieren.
- source_word: non obaudierunt legi meae
  choice: sie haben meinem Gesetz nicht gehorcht
  rationale: Das lateinische Verb verlangt hier den Dativ legi meae; die deutsche Formulierung bildet den Gehorsamsgedanken direkt und idiomatisch ab.
- source_word: populus autem indisciplinatus
  choice: Sie sind ein undiszipliniertes Volk
  rationale: „Undiszipliniert“ entspricht indisciplinatus enger als „rebellisch“ und hält den Zusammenhang mit der nicht befolgten Weisung beziehungsweise disciplina offen. Das im Lateinischen verblos stehende Satzglied wird im Deutschen als vollständiger Satz wiedergegeben.
theological_decisions:
- issue: Art der auf das Volk geworfenen mala
  choice: Unheil
  alternative: Böses
  rationale: Der Text kann von Übeln beziehungsweise Strafgerichten sprechen, ohne ausdrücklich moralisches Böses zu meinen. Die Fußnote bewahrt die lexikalische Spannweite.
- issue: Bedeutung von indisciplinatus
  choice: undiszipliniert
  alternative: ohne Zucht; rebellisch
  rationale: Die Hauptfassung folgt der konkreten lateinischen Wortwahl und deutet den Ungehorsam nicht vorschnell als eine ausschließlich theologische Rebellion. Die mögliche stärkere Bedeutung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante körperliche Bildhandlung bleibt erhalten. Der knappe lateinische Nominalsatz am Ende wird für natürliche deutsche Syntax verbalisiert; die Wiederaufnahme mit „Sie“ macht den Bezug eindeutig.
