  source_fidelity: 'Die Übersetzung bildet die lateinische Syntax und Semantik zuverlässig ab: „schüttle dein Haupthaar aus“ wahrt die konkrete Geste von excute comam capitis tui; „wirf alles Unheil auf sie“ gibt proice omnia mala super illos angemessen wieder. Der Dativ in „meinem Gesetz gehorcht“ entspricht legi meae, und „ein undiszipliniertes Volk“ trifft indisciplinatus genauer als eine ausschließlich wertende Wiedergabe wie „rebellisch“.'
  naturalness: Der Text ist klares, würdiges modernes Standarddeutsch. „Haupthaar“ ist leicht gehoben, aber in einer prophetisch-biblischen Anrede natürlich und passend. Die Auflösung des lateinischen Nominalsatzes zu „Sie sind ...“ ist idiomatisch.
  terminology: „Gesetz“ für lex ist etabliert und sachgerecht. „Unheil“ wahrt bei mala die im Kontext naheliegende Bedeutung von Übeln bzw. Unheil, während die Fußnote die weitere Lesemöglichkeit „Böse/Übel“ offenhält. Die Anmerkung zu indisciplinatus macht deutlich, dass „rebellisch“ nur eine sinngemäße, nicht die primäre lexikalische Wiedergabe ist.
