lexical_decisions:
- source_word: folia arborum uos texi
  choice: Ich bedeckte euch mit den Blättern der Bäume
  rationale: Gibt das lateinische Bild unmittelbar und in natürlichem Deutsch wieder, ohne es auszudeuten.
- source_word: Diuisi uobis terras pingues
  choice: Ich teilte euch fruchtbare Länder zu
  rationale: „Zuteilen“ bewahrt den knappen Sinn von dividere mit Dativ; „fruchtbar“ gibt pingues im landwirtschaftlichen Zusammenhang idiomatisch wieder.
- source_word: a facie uestra proieci
  choice: vertrieb ich vor euch
  rationale: Bewahrt die räumliche Wendung des Lateinischen, klingt aber im modernen Deutschen verständlich.
- source_word: quid faciam
  choice: Was soll ich tun?
  rationale: Entspricht der knappen lateinischen Frage, ohne das im vorgelegten lateinischen Text nicht ausdrücklich stehende „für euch“ oder „spricht der Herr“ hinzuzufügen.
