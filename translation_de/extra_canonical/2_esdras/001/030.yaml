  text: collegi ut gallina pullos suos sub alas suas. modo autem quid faciam uobis ? proiciam uos a facie mea. Oblationes mihi cum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: de
  text: So habe ich euch gesammelt, wie eine Henne ihre Küken unter ihren Flügeln sammelt.[a] Doch was soll ich jetzt mit euch tun? Ich werde euch von meinem Angesicht verstoßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe euch gesammelt.«'
    reason: „So“ gibt das am Ende des vorausgehenden Verses stehende lateinische „Ita“ wieder, das syntaktisch zu „collegi“ gehört; bei streng versweiser Abgrenzung kann es entfallen.
lexical_decisions:
- source_word: collegi
  choice: habe ich euch gesammelt
  rationale: Das Perfekt gibt das lateinische Perfekt natürlich wieder; das Objekt „euch“ stammt aus dem unmittelbar vorausgehenden „uos“.
- source_word: ut gallina pullos suos sub alas suas
  choice: wie eine Henne ihre Küken unter ihren Flügeln sammelt
  rationale: Die Ergänzung des im Vergleich elliptisch ausgelassenen Verbs ergibt im Deutschen einen klaren, natürlichen Satz und bewahrt das Bild des Schutzes unter den Flügeln.
- source_word: proiciam uos a facie mea
  choice: Ich werde euch von meinem Angesicht verstoßen
  rationale: „Verstoßen“ trifft die nachdrückliche Zurückweisung von „proiciam“; „von meinem Angesicht“ bewahrt die konkrete und theologisch offene Ausdrucksweise des Lateinischen.
theological_decisions:
- issue: Bild der Henne und ihrer Küken
  choice: Das Schutzbild wird ohne zusätzliche Deutung wiedergegeben.
  alternative: Das Bild ausdrücklich als göttlichen Schutz oder Bundesschutz erklären.
  rationale: Der Vers selbst lässt die Metapher sprechen und legt keine engere dogmatische Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ wurde statt des alltäglicheren „Gesicht“ gewählt, weil es die feierliche biblische Wendung bewahrt, ohne die Aussage auszudeuten.
