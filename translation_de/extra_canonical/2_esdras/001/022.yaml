source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis adhuc? dicit dominus. Haec dicit dominus omnipotens: in deserto cum essetis in flumine amaro sitientes et blasphemantes nomen meum,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: de
  text: 'So spricht der Herr, der Allmächtige: Als ihr in der Wüste am bitteren Fluss Durst hattet und meinen Namen lästertet,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus omnipotens
  choice: der Herr, der Allmächtige
  rationale: Gibt den lateinischen Hoheitstitel vollständig und in geläufiger, würdevoller deutscher Bibelsprache wieder.
- source_word: in flumine amaro
  choice: am bitteren Fluss
  rationale: Bewahrt das konkrete Bild des lateinischen Ausdrucks; „am“ gibt den örtlichen Zusammenhang natürlich wieder, ohne die Ursache der Bitterkeit näher festzulegen.
- source_word: blasphemantes nomen meum
  choice: meinen Namen lästertet
  rationale: Entspricht dem starken religiösen Sinn von „blasphemare“ und bleibt im Deutschen klar und unmittelbar.
theological_decisions:
- issue: Art der Lästerung
  choice: meinen Namen lästertet
  alternative: meinen Namen schmähtet
  rationale: „Lästern“ bewahrt die ausdrücklich religiöse Tragweite des lateinischen „blasphemare“, ohne das Motiv oder den genauen Inhalt der Äußerungen zu ergänzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bibelsprachlichem Ton. Der Vers bleibt wie die lateinische Vorlage syntaktisch offen und endet mit einem Komma, da der Gedanke im folgenden Vers fortgeführt wird.
