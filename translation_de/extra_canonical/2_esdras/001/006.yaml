source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: de
  text: Denn die Sünden ihrer Vorfahren sind in ihnen gewachsen; denn sie haben mich vergessen und fremden Göttern Opfer dargebracht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: parentum illorum
  choice: ihrer Vorfahren
  rationale: Das lateinische „parentes“ kann Eltern oder Vorfahren bezeichnen. Im Zusammenhang mit ererbter beziehungsweise fortgesetzter Schuld gibt „Vorfahren“ den weiteren möglichen Bezug natürlich wieder.
- source_word: in illis creuerunt
  choice: sind in ihnen angewachsen
  rationale: Bewahrt das auffällige Bild, dass die Sünden der Vorfahren in den Nachkommen zugenommen beziehungsweise weitergewachsen sind, ohne es deutend aufzulösen.
- source_word: obliti enim me
  choice: sie haben mich nämlich vergessen
  rationale: Gibt die begründende Funktion von „enim“ und den direkten Gottesbezug des lateinischen Textes wieder.
- source_word: sacrificauerunt
  choice: Opfer dargebracht
  rationale: Eine natürliche und zugleich kultisch präzise Wiedergabe des lateinischen Verbs.
- source_word: diis alienis
  choice: fremden Göttern
  rationale: „Fremd“ wahrt den Gegensatz zu Gott und vermeidet eine unnötige Festlegung auf ethnisch ausländische Gottheiten.
theological_decisions:
- issue: Verhältnis zwischen der Sünde der Vorfahren und der Schuld der Nachkommen
  choice: Die Sünden der Vorfahren „sind in ihnen angewachsen“.
  alternative: Die Sünden ihrer Eltern haben sich unter ihnen vermehrt.
  rationale: 'Die gewählte Formulierung erhält die theologische Spannung des lateinischen „in illis creuerunt“: Die früheren Sünden wirken in der gegenwärtigen Generation fort und nehmen in ihr zu, ohne dass ausdrücklich eine mechanische Vererbung von Schuld behauptet wird.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Wendung „in ihnen angewachsen“ wurde bewusst beibehalten, weil sie das prägnante Wachstumsbild der lateinischen Vorlage trägt. Keine Fußnoten erforderlich.
