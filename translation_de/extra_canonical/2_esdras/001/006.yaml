revisions:
- from: Denn die Sünden ihrer Vorfahren sind in ihnen angewachsen; sie haben mich nämlich vergessen und fremden Göttern Opfer dargebracht.
  to: Denn die Sünden ihrer Vorfahren sind in ihnen gewachsen; denn sie haben mich vergessen und fremden Göttern Opfer dargebracht.
  rationale: Die einzige Änderung ersetzt „angewachsen“ durch „gewachsen“. Damit bleibt das markante Bild des lateinischen in illis creuerunt erhalten, ohne eine bestimmte Lehre über vererbte Schuld zu formulieren. Die Wiederholung von „denn“ bildet die begründende Funktion von quia und enim transparent ab.
