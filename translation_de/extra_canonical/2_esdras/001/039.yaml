theological_decisions:
- issue: Abgrenzung des Verses gegenüber dem vorangehenden Satzteil
  choice: Nur die in der vorgelegten Quellenspanne stehende Prophetenliste wird im Haupttext wiedergegeben.
  alternative: „Denen werde ich Abraham, Isaak und Jakob als Führer geben, Hosea und Amos und Micha und Joel und Obadja und Jona.“
  rationale: Der zusätzliche Satzteil gehört nach der maßgeblichen Versabgrenzung zu Vers 38. Die Fußnote dokumentiert die frühere, weiter gefasste Wiedergabe, ohne sie in den Text von Vers 39 einzutragen.
translation_notes:
