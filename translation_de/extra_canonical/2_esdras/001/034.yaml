base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: de
  text: Und eure Söhne werden keine Nachkommen zeugen, weil sie mein Gebot in eurer Mitte missachtet und getan haben, was vor mir böse ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: werden keine Nachkommen zeugen
  rationale: Die Wendung bezeichnet im Zusammenhang das Ausbleiben von Nachkommenschaft. „Nachkommen zeugen“ ist im Deutschen natürlich und bewahrt den Fortpflanzungssinn des lateinischen Ausdrucks.
- source_word: mandatum meum
  choice: mein Gebot
  rationale: „Gebot“ gibt mandatum in diesem religiösen Zusammenhang präzise und allgemeinverständlich wieder.
- source_word: uobiscum
  choice: bei euch
  rationale: Das wörtliche „mit euch“ wäre hier missverständlich. „Bei euch“ bewahrt den lokalen beziehungsweise gemeinschaftlichen Sinn, ohne genauer festzulegen, als der lateinische Text erlaubt.
- source_word: quod malum est coram me
  choice: was vor mir böse ist
  rationale: Die formelhafte Gottesrede wird eng am Lateinischen und zugleich idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug von „eure Söhne“ und der folgenden Verben
  choice: Die Söhne bleiben Subjekt von „missachtet“ und „getan haben“.
  alternative: Die Verben könnten gedanklich auf die angesprochene Gemeinschaft insgesamt bezogen werden.
  rationale: Grammatisch liegt der Rückbezug auf „eure Söhne“ am nächsten; eine weitergehende theologische Zuordnung wird nicht ergänzt.
- issue: Bedeutung von „uobiscum“
  choice: „bei euch“
  alternative: „mit euch“ oder „unter euch“
  rationale: Die Übersetzung wahrt die Mehrdeutigkeit zwischen Anwesenheit und Zugehörigkeit möglichst natürlich, ohne eine besondere gemeinschaftliche Beteiligung am Gebot zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt nah an der lateinischen Struktur, vermeidet jedoch die im Deutschen unnatürliche wörtliche Wiedergabe „keine Schöpfung hervorbringen“.
