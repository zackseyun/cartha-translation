source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: de
  text: 'So spricht der Herr, der Allmächtige: Habe ich euch nicht eindringlich gebeten wie ein Vater seine Söhne, wie eine Mutter ihre Töchter und wie eine Amme ihre Kleinen,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec dicit
  choice: So spricht
  rationale: Natürliche und zugleich würdevolle deutsche Einleitungsformel für die lateinische Botenformel.
- source_word: dominus omnipotens
  choice: der Herr, der Allmächtige
  rationale: Gibt beide Titel ausdrücklich wieder und wahrt ihre appositionelle Beziehung.
- source_word: rogaui
  choice: angefleht
  rationale: Im emotionalen Zusammenhang bezeichnet rogare ein eindringliches Bitten oder Flehen; „angefleht“ bewahrt die Stärke des göttlichen Werbens besser als das schwächere „gebeten“.
- source_word: nutrix
  choice: Amme
  rationale: Bezeichnet eine Frau, die kleine Kinder nährt und betreut; „Amme“ ist präzise, verständlich und knapper als eine erklärende Umschreibung.
- source_word: paruulos suos
  choice: ihre Kleinen
  rationale: Bewahrt die liebevolle, altersbezogene Bezeichnung und gibt suos durch das Possessivpronomen wieder.
theological_decisions:
- issue: Elterliche und fürsorgliche Vergleiche für Gottes eindringliches Bitten
  choice: Alle drei Vergleiche parallel und ohne Deutung wiedergeben
  alternative: Die Bilder vereinheitlichen oder ausdrücklich auf Gott beziehen
  rationale: Der lateinische Text stellt Vater, Mutter und Amme nebeneinander. Diese vielschichtige Bildsprache und ihre theologische Spannung sollen unverändert stehen bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Lateinischen bleibt erhalten; die im Deutschen notwendige Verbklammer wird nicht in jedem Vergleich wiederholt. Der lateinische Satz endet mit einem Komma und läuft offenbar in den Folgevers weiter; als eigenständiger Vers wird er hier mit einem Fragezeichen abgeschlossen, da nonne eine rhetorische Frage einleitet.
