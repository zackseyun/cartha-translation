source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis. uos autem mei obliti estis, dicit dominus. Haec dicit dominus omnipotens: coturnix uobis in signo fuit, castra uobis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: de
  text: 'Ihr aber habt mich vergessen, spricht der Herr. So spricht der Herr, der Allmächtige: Die Wachtel war euch ein Zeichen; ein Lager[a] war für euch'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Lateinischen steht »castra«, ein formal pluralisches Wort; es bezeichnet jedoch häufig ein einzelnes Lager.
    reason: Präzisiert die formale Mehrzahl im Ausgangstext, ohne den üblichen lateinischen Sprachgebrauch im Haupttext unnatürlich wiederzugeben.
lexical_decisions:
- source_word: uos autem
  choice: Ihr aber
  rationale: Gibt den adversativen Übergang des lateinischen Ausdrucks knapp und natürlich wieder.
- source_word: mei obliti estis
  choice: habt mich vergessen
  rationale: Entspricht der idiomatischen Bedeutung der lateinischen Genitivkonstruktion bei »oblivisci«.
- source_word: dominus omnipotens
  choice: der Herr, der Allmächtige
  rationale: Bewahrt sowohl den Gottesnamen-Titel »Herr« als auch die Aussage seiner Allmacht.
- source_word: coturnix
  choice: die Wachtel
  rationale: Der lateinische Singular wird als Singular wiedergegeben; gemeint sein kann dabei zugleich die Wachtel als kollektives Zeichen.
- source_word: in signo fuit
  choice: war euch ein Zeichen
  rationale: Natürliches Deutsch für die lateinische Wendung, ohne die Zeichenaussage näher auszudeuten.
- source_word: castra
  choice: ein Lager
  rationale: »Castra« ist formal Plural, wird im Lateinischen jedoch als Pluraletantum sehr häufig für ein einzelnes Lager oder Heerlager gebraucht.
theological_decisions:
- issue: Funktion des Lagers
  choice: war für euch
  alternative: gab ich euch zum Schutz
  rationale: Der erhaltene lateinische Wortlaut nennt weder ein gebendes Subjekt noch ausdrücklich Schutz; diese Deutung wird daher nicht in den Haupttext aufgenommen.
- issue: Numerus von »castra«
  choice: ein Lager
  alternative: Lager
  rationale: Der idiomatische Singular gibt den üblichen Sinn des lateinischen Pluraletantums wieder; die formale Mehrzahl bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt am Versende bewusst unvollständig, weil auch der bereitgestellte lateinische Ausschnitt nach »castra uobis« abbricht. Das vorangestellte »uobis.« gehört erkennbar zum Ende des vorherigen Satzes und wurde nicht erneut aufgenommen.
