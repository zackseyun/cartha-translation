  to: die Gnade[a] des kommenden Volkes, dessen Kinder voller Freude jubeln; ohne mich mit leiblichen Augen zu sehen, werden sie im Geist[b] glauben, was ich gesagt habe. Und nun, Vater, blicke in Herrlichkeit und sieh das kommende Volk.
  rationale: Die Revision beschränkt sich auf die notwendige Wiedergabe des lateinischen Futurs credent als „werden ... glauben“. Die Formulierung „ohne mich ... zu sehen“ bewahrt zugleich die partizipiale Verneinung me non videntes, ohne eine nicht ausdrücklich vorliegende abgeschlossene Vergangenheit („gesehen haben“) einzutragen. Die Fußnotenanker und ihre Bezugspunkte bleiben erhalten.
