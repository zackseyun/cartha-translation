  source_fidelity: Die Wiedergabe des einleitenden, vom Vorkontext abhängigen Akkusativfragments („die Gnade des kommenden Volkes“) ist quellentreu. „Kinder“, „voller Freude jubeln“, „mit leiblichen Augen“ und die abschließende Anrede entsprechen dem Latein angemessen. Jedoch ist credent eindeutig Futur und sollte nicht als Präsens „glauben“ wiedergegeben werden.
  naturalness: Der Text ist insgesamt modernes, würdevolles Standarddeutsch. Die Umformung der lateinischen Partizipialfügung in einen eigenen Hauptsatz ist zwar verständlich, verdeckt aber zusammen mit dem Präsens die künftige Perspektive. Eine Konstruktion mit „werden ... glauben“ ist natürlich und genauer.
  terminology: „Gnade“ für gratia ist möglich; die Alternative „Gunst“ ist sinnvoll vermerkt. „Leibliche Augen“ bewahrt den Kontrast zu spiritu gut. „Im Geist“ erhält die beim lateinischen Ablativ bestehende Auslegungsbreite; die Fußnote darf die instrumentale Möglichkeit nennen. „In Herrlichkeit“ gibt cum gloria formal zurück, ohne die schwierige Verbindung näher auszudeuten.
