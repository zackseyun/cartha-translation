source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populi uenientis gratiam, cuius paruuli exultant cum laetitia, me non uidentes oculis carnalibus, sed spiritu credent quae dixi. Et nunc, pater, aspice cum gloria et uide populum uenientem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/037.yaml
  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: de
  text: die Gnade[a] des kommenden Volkes, dessen Kinder voller Freude jubeln; ohne mich mit leiblichen Augen zu sehen, werden sie im Geist[b] glauben, was ich gesagt habe. Und nun, Vater, blicke in Herrlichkeit und sieh das kommende Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Gunst.'
    reason: Das lateinische „gratia“ kann sowohl „Gnade“ als auch „Gunst“ bedeuten.
  - marker: b
    text: 'Oder: durch den Geist.'
    reason: Der lateinische Ablativ „spiritu“ lässt sowohl eine örtlich-sphärische als auch eine instrumentale Wiedergabe zu.
lexical_decisions:
- source_word: gratiam
  choice: Gnade
  rationale: Bewahrt den religiösen und zugleich wohlwollenden Bedeutungsraum von lateinisch „gratia“; „Gunst“ bleibt als mögliche Lesart in der Fußnote erhalten.
- source_word: populi uenientis
  choice: des kommenden Volkes
  rationale: Gibt den Genitiv und das Partizip eng wieder, ohne das zeitliche oder heilsgeschichtliche Verhältnis näher festzulegen.
- source_word: paruuli
  choice: Kinder
  rationale: Im Kontext natürlicher als „die Kleinen“ und mit der Grundbedeutung von „parvuli“ vereinbar.
- source_word: oculis carnalibus
  choice: mit leiblichen Augen
  rationale: Natürliches, würdevolles Deutsch; „leiblich“ bewahrt den Gegensatz zur geistigen Wahrnehmung besser als das missverständliche „fleischlich“.
- source_word: spiritu credent
  choice: glauben aber im Geist
  rationale: Bewahrt die knappe lateinische Formulierung und lässt offen, ob der menschliche Geist oder Gottes Geist gemeint ist.
- source_word: aspice cum gloria
  choice: blicke in Herrlichkeit
  rationale: Gibt die ungewöhnliche Verbindung möglichst direkt wieder, ohne „Herrlichkeit“ eigenmächtig als Art und Weise, Begleitumstand oder Besitzverhältnis auszudeuten.
theological_decisions:
- issue: Bezug von „spiritu“
  choice: im Geist
  alternative: durch den Geist
  rationale: Der lateinische Ablativ kann unterschiedlich verstanden werden. Die Hauptfassung erhält die Mehrdeutigkeit und legt weder ausdrücklich den Heiligen Geist noch ausschließlich den menschlichen Geist fest.
- issue: Bedeutung von „gratia“
  choice: Gnade
  alternative: Gunst
  rationale: „Gnade“ entspricht dem religiösen Sprachraum des Abschnitts, während „Gunst“ lexikalisch ebenfalls möglich ist und daher als Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der überlieferte Vers setzt mit einem grammatisch vom vorausgehenden Zusammenhang abhängigen Akkusativ ein; deshalb beginnt auch die Übersetzung bewusst mit dem kleingeschriebenen Satzfragment „die Gnade …“. Die Partizipialkonstruktion wurde zur besseren Verständlichkeit in zwei Hauptsätze aufgelöst.
