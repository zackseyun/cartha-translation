  text: And you judged the earth not with truth.
translation:
  language: de
  text: Und du hast die Erde nicht in Wahrheit gerichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier angeführte lateinische Ausschnitt bricht nach „non“ („nicht“) ab; „in Wahrheit“ folgt dem fortlaufenden Text und wird auch durch die überlieferte englische Konsultationsfassung bestätigt.
    reason: Kennzeichnet transparent, dass die abschließende Wendung im bereitgestellten Ausschnitt nicht vollständig sichtbar ist.
lexical_decisions:
- source_word: iudicasti
  choice: hast … gerichtet
  rationale: Gibt das lateinische Perfekt und die richterliche Bedeutung des Verbs direkt und natürlich wieder.
- source_word: terram
  choice: die Erde
  rationale: Entspricht dem lateinischen Akkusativ und bewahrt den umfassenden Bezug.
- source_word: cum veritate
  choice: in Wahrheit
  rationale: Bewahrt die knappe lateinische Wendung und lässt offen, ob vor allem wahrhaftiges oder gerechtes Richten gemeint ist.
theological_decisions:
- issue: Bedeutung von „in Wahrheit richten“
  choice: Die Formulierung wird wörtlich-offen beibehalten.
  alternative: „nicht gerecht gerichtet“
  rationale: Die Alternative würde Wahrheit ausdrücklich als Gerechtigkeit auslegen und damit die Bedeutung stärker festlegen, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; die knappe Anklageform des lateinischen Satzes bleibt erhalten.
