  text: Are you not the one who prevailed over the four beasts that I had made[a]
translation:
  language: de
  text: Bist du nicht derjenige, der von den vier Tieren, die ich geschaffen hatte, übrig geblieben ist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das lateinische „superasti“ kann auch bedeuten: „die anderen übertroffen hast“ oder „über sie gesiegt hast“. In Verbindung mit „von den vier Tieren“ liegt hier jedoch „übrig geblieben bist“ näher.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: superasti de quattuor animalibus
  choice: das eine von den vier Tieren …, das übrig geblieben ist
  rationale: Im Zusammenhang mit „de quattuor animalibus“ bezeichnet „superasti“ am natürlichsten das Überleben beziehungsweise Übrigbleiben aus einer Gruppe. Die Formulierung gibt zugleich verständlich wieder, dass nur dieses eine der vier Tiere geblieben ist.
- source_word: quae feceram
  choice: die ich geschaffen hatte
  rationale: Der Plusquamperfekt „feceram“ wird als Vorvergangenheit wiedergegeben; „schaffen“ ist für Gottes Hervorbringen der Tiere würdig und idiomatisch.
theological_decisions:
- issue: Bedeutung von „superasti“
  choice: übrig geblieben ist
  alternative: die anderen übertroffen oder besiegt hat
  rationale: „superare“ kann „übertreffen/besiegen“ bedeuten, doch die Verbindung mit „de quattuor animalibus“ legt hier „von den vier übrig bleiben/überleben“ nahe. Die alternative Bedeutung wird wegen der lexikalischen Mehrdeutigkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das eine …, das“ bewahrt den sachlichen Bezug auf das Tier und vermeidet eine unnötige Personalisierung. Die verschachtelte Struktur bleibt nahe am Latein, ist aber im Deutschen gut verständlich.
