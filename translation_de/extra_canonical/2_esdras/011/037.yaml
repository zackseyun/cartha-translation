    rationale: Im Deutschen richtet man gewöhnlich Worte, eine Frage oder eine Rede an jemanden, nicht eine Stimme. Die vorgeschlagene Formulierung bewahrt das Bild des Aussendens einer menschlichen Stimme und den Adressaten.
  - severity: low
