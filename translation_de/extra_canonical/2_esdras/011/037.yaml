source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'mugiens, et audiui quomodo emisit uocem hominis ad aquilam et dixit dicens : Audi tu et loquar ad te ; dicit altissimus tibi :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/037.yaml
  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: de
  text: 'brüllend; und ich hörte, wie es eine menschliche Stimme an den Adler ergehen ließ und sagte: »Höre du, und ich will zu dir reden; der Höchste sagt dir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mugiens
  choice: brüllend
  rationale: Das Partizip setzt die Beschreibung des löwenähnlichen Wesens aus dem vorherigen Vers fort; »brüllen« ist für einen Löwen im Deutschen idiomatisch.
- source_word: emisit uocem hominis ad aquilam
  choice: richtete eine menschliche Stimme an den Adler
  rationale: Gibt das Aussenden der Stimme und ihre Ausrichtung auf den Adler natürlich wieder, ohne das ungewöhnliche Bild einer menschlichen Stimme aufzulösen.
- source_word: dixit dicens
  choice: sagte und sprach
  rationale: Bewahrt die semitisch geprägte Doppelung des lateinischen Ausdrucks in einer geläufigen biblischen deutschen Form.
- source_word: Audi tu
  choice: Höre du
  rationale: Das ausdrücklich gesetzte Pronomen tu wird durch »du« bewahrt und trägt den Nachdruck des Befehls.
- source_word: loquar ad te
  choice: ich will zu dir reden
  rationale: Die voluntative Zukunftsform wird als beabsichtigtes unmittelbar folgendes Reden wiedergegeben.
- source_word: altissimus
  choice: der Höchste
  rationale: Traditionelle und zugleich verständliche Wiedergabe des Gottesprädikats.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Klang bei »sagte und sprach«. Der Vers beginnt als syntaktische Fortsetzung des vorherigen Verses und endet mit einem Doppelpunkt, da die Rede im folgenden Vers weitergeht.
