  text: 'wurde ihr zugesandt und sagte: »Hör zu, du, der du die Erde die ganze Zeit über beherrscht hast,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emissa est illi
  choice: wurde zu ihm gesandt
  rationale: Gibt die finite Passivform und den Dativ illi unmittelbar wieder; das grammatische Geschlecht des nicht genannten Subjekts wird im Deutschen nicht festgelegt.
- source_word: Audi tu
  choice: Hör zu, du
  rationale: Bewahrt den betonten Imperativ mit ausdrücklich gesetztem Pronomen in natürlichem Deutsch.
- source_word: tenuisti terram
  choice: die Erde … in deiner Gewalt hattest
  rationale: tenere bezeichnet hier im Zusammenhang Herrschaft oder Kontrolle, nicht bloß körperliches Festhalten.
- source_word: toto tempore
  choice: die ganze Zeit über
  rationale: Entspricht wörtlich »während der gesamten Zeit« und vermeidet die abweichende Bedeutung »so lange«.
theological_decisions:
- issue: Art der Herrschaft über die Erde
  choice: in deiner Gewalt hattest
  alternative: die Erde festgehalten/besessen hast
  rationale: Die Formulierung lässt die negative oder positive Bewertung der Herrschaft offen, macht aber den im Kontext naheliegenden Herrschaftssinn von tenere verständlich.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Vers beginnt als grammatische Fortsetzung des vorangehenden Zusammenhangs; deshalb bleibt das ungenannte Subjekt von »wurde … gesandt« auch in der Übersetzung unausgesprochen. Die Anrede ist wegen des lateinischen maskulinen Relativpronomens qui männlich formuliert.
