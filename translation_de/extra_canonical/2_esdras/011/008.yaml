lexical_decisions:
- source_word: Nolite omnes simul uigilare
  choice: Wacht nicht alle gleichzeitig
  rationale: Gibt den verneinten Imperativ und »simul« natürlich und genau wieder.
- source_word: dormite unusquisque in loco suo
  choice: schlaft, jeder an seinem Platz
  rationale: Bewahrt den Wechsel vom Pluralimperativ zum einzeln betrachteten »unusquisque« sowie die räumliche Angabe.
- source_word: per tempus uigilate
  choice: wacht jeweils eine Zeit lang
  rationale: »Eine Zeit lang« bildet die zeitliche Begrenzung von »per tempus« ab; »jeweils« macht im Zusammenhang deutlich, dass nicht alle zugleich wachen sollen, ohne ein streng geregeltes Ablösen ausdrücklich in den Text hineinzulesen.
