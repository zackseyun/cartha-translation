  source_fidelity: 'Die Übersetzung gibt „Et sic contingebat omnibus alis singulatim principatum“ zutreffend wieder: „so erging es“ entspricht contingebat, „allen Flügeln“ omnibus alis, und „einem nach dem anderen“ wahrt die sukzessive Einzelheit von singulatim. „Sie übten die Herrschaft aus“ gibt principatum idiomatisch und ohne inhaltliche Ergänzung wieder. Das am Satzanfang stehende ipsa ist nach dem Kontext zutreffend als zum vorherigen Satz gehörig behandelt.'
