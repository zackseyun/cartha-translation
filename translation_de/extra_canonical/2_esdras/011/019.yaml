- source_word: singulatim
  choice: einem nach dem anderen
  rationale: Natürliches modernes Deutsch für das sukzessive, jeweils einzelne Auftreten.
- source_word: principatum
  choice: Sie übten die Herrschaft aus
  rationale: Das lateinische Akkusativobjekt hängt sinngemäß an einem aus dem Zusammenhang ergänzten Verb; die Formulierung bewahrt den Sinn von Herrschaftsausübung, ohne zusätzliche Ereignisse einzutragen.
