  rationale: Die alleinige Änderung ersetzt die zu spezifische, anatomisch einengende Wiedergabe „kleine Schwungfedern“ durch „kleine Flügel“. Dadurch bleibt das lateinische Diminutiv pennacula ebenso wie die englische Prüffassung „little pinions“ angemessen abgebildet. Die kontextuell erforderliche Wiedergabe „verschwanden“ bleibt bestehen.
