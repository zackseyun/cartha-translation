  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: de
  text: Die zwölf Flügel und die beiden kleinen Flügel verschwanden. Am Körper des Adlers blieben nur die drei ruhenden Köpfe und sechs kleine Flügel übrig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennae
  choice: Flügel
  rationale: Im Bild des Adlers bezeichnet das Wort die zwölf großen Flügel und entspricht dem wiederkehrenden Symbolvokabular des Abschnitts.
- source_word: pennacula
  choice: kleine Schwungfedern
  rationale: Das Diminutiv bezeichnet kleinere flügel- oder federartige Teile. „Kleine Schwungfedern“ unterscheidet sie verständlich von den großen Flügeln, ohne sie als voll ausgebildete Flügel darzustellen.
- source_word: conparuerunt
  choice: verschwanden
  rationale: Die überlieferte Form bedeutet für sich genommen gewöhnlich „erschienen“. Der unmittelbare Folgesatz („nichts blieb … außer“) verlangt hier jedoch das Verschwinden der zwölf Flügel und zweier kleiner Schwungfedern; die Wiedergabe folgt diesem klaren Satzzusammenhang und der geprüften englischen Konsultationsfassung.
- source_word: quiescentia
  choice: ruhenden
  rationale: Bewahrt die Aussage, dass die drei Köpfe in einem Zustand der Ruhe waren, ohne diese Ruhe weiter zu deuten.
- source_word: superauit
  choice: blieben … übrig
  rationale: Gibt den kontextuellen Sinn von „verblieb/überdauerte“ in natürlichem modernem Deutsch wieder.
- source_word: sex
  choice: sechs kleine Schwungfedern
  rationale: Das lateinische Fragment endet elliptisch mit „sechs“; das Bezugswort „kleine Schwungfedern“ wird aus dem unmittelbaren Bildzusammenhang ergänzt.
