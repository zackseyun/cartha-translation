review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von conparuerunt als „verschwanden“ folgt zwingend dem unmittelbaren Kontrast in der zweiten Satzhälfte („nichts blieb ... außer“), auch wenn die erhaltene lateinische Form für sich genommen gewöhnlich „erschienen“ bedeutet. Die drei ruhenden Köpfe und die sechs verbleibenden kleineren Anhänge werden vollständig wiedergegeben.
  naturalness: 'Der Satzbau ist klar und idiomatisch. „Kleine Flügel“ ist im Deutschen für pennacula natürlicher und bildlogisch präziser als „kleine Schwungfedern“: Es bewahrt die Unterscheidung zwischen den zwölf großen Flügeln und den kleineren flügelartigen Teilen, ohne sie auf einzelne Federn einzuengen.'
  terminology: „Flügel“ für pennae und „kleine Flügel“ für pennacula wahrt das wiederkehrende Bildvokabular der Adlervision. „Ruhenden Köpfe“ und „blieben ... übrig“ sind sachgerecht und ohne interpretierende Zusätze.
  issues:
