  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: de
  text: die dir nichts zuleide getan haben. Und deine Vermessenheit ist zum Höchsten emporgestiegen und dein Hochmut zum Mächtigen. Und der Höchste sah auf seine Zeiten, und siehe, sie sind zu Ende, und seine Zeitalter sind vollendet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui te non nocuerunt
  choice: die dir nichts zuleide getan haben
  rationale: Bewahrt den Relativsatz als Anschluss an den vorausgehenden Kontext; die idiomatische Wendung gibt das lateinische nocere präzise und natürlich wieder.
- source_word: contumelia
  choice: Vermessenheit
  rationale: Bezeichnet hier anmaßenden Frevel beziehungsweise Übermut; „Vermessenheit“ passt zum parallelen „Hochmut“, ohne beide Begriffe gleichzusetzen.
- source_word: altissimum
  choice: der Höchste
  rationale: Gängige und würdevolle Wiedergabe des göttlichen Titels.
- source_word: superbia
  choice: Hochmut
  rationale: Gibt den Stolz mit negativer moralischer Wertung klar wieder.
- source_word: fortem
  choice: der Mächtige
  rationale: Bewahrt den eigenständigen göttlichen Titel und die Parallelität zu „der Höchste“.
- source_word: respexit ... super sua tempora
  choice: blickte ... auf seine Zeiten
  rationale: Folgt der räumlichen Bildsprache des Lateinischen und lässt die mögliche Bedeutung von „seinen Zeiten“ bewusst offen.
- source_word: saecula eius
  choice: seine Zeitalter
  rationale: Gibt saecula im zeitlich-eschatologischen Sinn wieder und erhält das Possessivpronomen des Ausgangstextes.
- source_word: conpleta sunt
  choice: sind vollendet
  rationale: Bewahrt gegenüber „zu Ende“ die Nuance des zur Fülle beziehungsweise zum Abschluss Gelangens.
theological_decisions:
- issue: Bezug der Possessivpronomen in „sua tempora“ und „saecula eius“
  choice: „seine Zeiten“ und „seine Zeitalter“
  alternative: „ihre Zeiten“ und „ihre Zeitalter“ mit Bezug auf die angesprochene Macht
  rationale: Der lateinische Wortlaut verwendet maskuline beziehungsweise reflexive Possessivformen mit dem „Höchsten“ als naheliegendem grammatischem Bezug. Die ungewöhnliche Formulierung wird nicht interpretierend aufgelöst.
- issue: Verhältnis von „Zeiten“ und „Zeitaltern“
  choice: Zwei unterschiedliche deutsche Begriffe beibehalten
  alternative: Beide mit „Zeiten“ wiedergeben
  rationale: Die Unterscheidung zwischen tempora und saecula bleibt sichtbar und bewahrt die mögliche eschatologische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetisch-eschatologischem Ton. Das einleitende Relativgefüge bleibt wegen des Versanschlusses bewusst fragmentarisch; „siehe“ erhält das markante Aufmerksamkeitssignal des lateinischen ecce.
