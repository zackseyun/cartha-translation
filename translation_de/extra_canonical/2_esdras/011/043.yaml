  source_fidelity: Der Entwurf gibt sämtliche Bestandteile des lateinischen Textes wieder. Die Gottesbezeichnungen „der Höchste“ und „der Mächtige“ entsprechen altissimus und fortem, und die Unterscheidung von tempora und saecula bleibt erhalten. „Da“ ist jedoch als konsekutiver bzw. zeitlicher Anschluss stärker als das schlichte lateinische et.
  naturalness: Der Ton ist würdig und gut verständlich. „Sah auf seine Zeiten“ ist im Deutschen etwas unmittelbarer und zugleich quellennahe als „blickte auf seine Zeiten“.
  terminology: „Vermessenheit“, „Hochmut“, „der Höchste“, „der Mächtige“, „Zeiten“ und „Zeitalter“ sind passende, konsistente Wiedergaben. Die Possessivbezüge werden nicht über das Lateinische hinaus festgelegt.
