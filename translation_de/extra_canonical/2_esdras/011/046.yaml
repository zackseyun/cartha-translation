id: 2ES.11.46
reference: 2 Esdras 11:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: de
  text: und deine bösartigen Klauen und deinen ganzen nichtigen Leib, damit die ganze Erde aufatmen und Erleichterung finden kann, von deiner Gewalt befreit, und auf das Gericht und die Barmherzigkeit dessen hoffen kann, der sie geschaffen hat.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ungues tui pessimi
  choice: deine bösartigen Klauen
  rationale: „Klauen“ passt zum Adlerbild; „bösartig“ gibt pessimi hier natürlicher wieder als das mehrdeutige „schlimmste“.
- source_word: omne corpus tuum uanum
  choice: deinen ganzen nichtigen Leib
  rationale: „Nichtig“ bewahrt die wertende Bedeutung von uanum und den würdevoll-prophetischen Ton.
- source_word: refrigeret
  choice: aufatmen
  rationale: Das lateinische Verb bezeichnet Erfrischung beziehungsweise Erholung; „aufatmen“ drückt im Deutschen natürlich die Erholung der bedrängten Erde aus.
- source_word: releuetur
  choice: Erleichterung finden
  rationale: Gibt das passive Entlastetwerden idiomatisch wieder und bleibt von refrigeret unterscheidbar.
- source_word: liberata de tua ui
  choice: von deiner Gewalt befreit
  rationale: Direkte Wiedergabe der Befreiung von der gewaltsamen Macht des angeredeten Wesens.
- source_word: speret iudicium et misericordiam
  choice: auf das Gericht und die Barmherzigkeit hoffen
  rationale: Bewahrt die spannungsreiche Verbindung von Gericht und Erbarmen als gemeinsame Hoffnung.
- source_word: eius qui fecit eam
  choice: dessen, der sie geschaffen hat
  rationale: Das feminine Pronomen eam bezieht sich auf terra; „geschaffen“ ist in diesem Gottesbezug angemessener als lediglich „gemacht“.
theological_decisions:
- issue: Gericht und Barmherzigkeit
  choice: Beide Begriffe bleiben gleichgeordnet als Gegenstand der Hoffnung stehen.
  alternative: Gericht im Sinn rettender Gerechtigkeit auslegen oder sprachlich der Barmherzigkeit unterordnen.
  rationale: Der lateinische Text verbindet iudicium und misericordiam ausdrücklich mit et; die theologische Spannung darf nicht aufgelöst werden.
- issue: Bezeichnung des Schöpfers
  choice: „dessen, der sie geschaffen hat“ ohne ergänzenden Gottesnamen
  alternative: „Gottes, der sie geschaffen hat“
  rationale: Die Umschreibung des Quellenwortlauts wird bewahrt, ohne eine explizite Benennung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Der Vers beginnt entsprechend der vorgelegten lateinischen Versgliederung mitten in einer fortlaufenden Aufzählung mit „und“. Keine Fußnote nötig; die frühere Alternative „Ruhe finden“ wird durch das quellennähere und idiomatische „aufatmen“ ersetzt.
