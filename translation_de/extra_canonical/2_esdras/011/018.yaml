lexical_decisions:
- source_word: tenebit tempus tuum
  choice: wird deine Zeit einhalten
  rationale: Gibt die ungewöhnliche lateinische Verbindung eng wieder, ohne die im vorliegenden Quellenausschnitt bestehende Spannung zum folgenden Halbsatz aufzulösen.
- source_word: sed nec dimidium eius
  choice: doch nicht einmal ihre Hälfte
  rationale: Bewahrt den Gegensatz durch sed und bezieht eius grammatisch auf tempus.
- source_word: tenuit principatum
  choice: übte die Herrschaft aus
  rationale: Natürliches modernes Deutsch für das Ausüben der Herrschaft, ohne principatus unnötig als konkretes Reich oder Amt festzulegen.
- source_word: sicut et priores
  choice: wie die früheren
  rationale: Das substantivierte priores bleibt hinsichtlich des im Kontext ergänzten Bezugs offen.
- source_word: non apparuit
  choice: sie verschwand
  rationale: Gibt das Nicht-mehr-Sichtbarsein im Erzählzusammenhang idiomatisch wieder.
