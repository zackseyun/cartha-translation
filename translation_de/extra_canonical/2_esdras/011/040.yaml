- from: Und das vierte Tier, das auftrat, überwältigte alle Tiere, die vor ihm gekommen waren[a]. Durch seine Macht hielt es das Zeitalter in großem Schrecken und die ganze Welt in schwerster Bedrückung[b]; so lange wohnte es mit Trug in der Welt.
  to: Und das vierte Tier, das auftrat, überwältigte alle Tiere, die vor ihm gekommen waren[a]. Durch seine Macht hielt es das Zeitalter in großem Schrecken und die ganze Welt in schwerster Bedrückung[b]; und es bewohnte die Welt so lange mit Trug.
  rationale: Die Revision verbessert nur den textlich schwierigen Schlusssatz und glättet die alternative Fußnote. Die Wiedergabe von potentatu, die Unterscheidung von saeculum und orbis sowie die markierte Unsicherheit des lateinischen Schlusses bleiben erhalten.
