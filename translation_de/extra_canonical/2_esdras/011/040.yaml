  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: de
  text: Und das vierte Tier, das auftrat, überwältigte alle Tiere, die vor ihm gekommen waren[a]. Durch seine Macht hielt es das Zeitalter in großem Schrecken und die ganze Welt in schwerster Bedrückung[b]; und es bewohnte die Welt so lange mit Trug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Text dieses Verses ist an mehreren Stellen beschädigt oder sprachlich rau. Die Übersetzung folgt dem erkennbaren Sinn: Das vierte Tier übertraf die früheren Tiere und hielt das Zeitalter und die Welt in Schrecken, Bedrückung und Trug.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: »und hielt durch seine Macht das Zeitalter in großem Schrecken und die ganze Welt in schwerster Mühsal.«'
    reason: previous_rendering
lexical_decisions:
- source_word: quartus
  choice: das vierte Tier
  rationale: Das lateinische Adjektiv steht substantiviert; aus dem unmittelbaren Zusammenhang mit den »Tieren« ist das ergänzte Bezugswort eindeutig und macht den deutschen Satz verständlich.
- source_word: deuicit
  choice: überwältigte
  rationale: Gibt den Sieg und die Überlegenheit des vierten Tieres wieder, ohne mehr als das textlich unsichere lateinische Verb festzulegen.
- source_word: potentatu
  choice: durch seine Macht
  rationale: Der instrumentale Ablativ wird ausdrücklich wiedergegeben und bewahrt die in der jüngsten Revision wiederhergestellte Nuance.
- source_word: saeculum
  choice: das Zeitalter
  rationale: Bewahrt den zeitlich-weltgeschichtlichen Sinn von saeculum, statt es vorschnell mit »Welt« gleichzusetzen.
- source_word: tremore multo
  choice: in großem Schrecken
  rationale: Natürliches Deutsch für den Zustand von Furcht und Erschütterung, in dem das Zeitalter gehalten wird.
- source_word: labore pessimo
  choice: in schwerster Bedrückung
  rationale: Im Herrschaftskontext bezeichnet labor nicht bloß Arbeit, sondern schwere Not und bedrückende Mühsal.
- source_word: inhabitabant
  choice: wohnte es
  rationale: Die überlieferte Pluralform ist im Satz textlich auffällig; die Übersetzung folgt dem naheliegenden Singularsinn, markiert die Unsicherheit jedoch in Fußnote [a].
theological_decisions:
- issue: Identität des vierten Tieres
  choice: Keine geschichtliche oder konfessionelle Identifikation im Text
  alternative: Explizite Gleichsetzung mit einem bestimmten Reich
  rationale: Der Vers selbst beschreibt das Tier, identifiziert es hier aber nicht ausdrücklich; die Übersetzung soll diese Auslegungsfrage nicht vorentscheiden.
- issue: Bedeutung von saeculum
  choice: Zeitalter
  alternative: Welt
  rationale: »Zeitalter« erhält die mögliche apokalyptische und zeitliche Spannung des lateinischen Ausdrucks, während orbis im selben Satz bereits die ganze Welt bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache und die Unterscheidung zwischen »Zeitalter« und »Welt« bleiben erhalten. Wegen des bruchstückhaften lateinischen Schlusses wurde eng am erschließbaren Sinn formuliert und die Unsicherheit in Fußnote [a] offengelegt.
