source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cogitabant se erigere et tenere principatus. Et uidi et ecce una erecta est, sed statim non conparuit ; Et secunda, et haec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/026.yaml
  text: And I looked, and behold, one rose up, but immediately disappeared; then the second, and this one also
translation:
  language: de
  text: 'Sie dachten daran, sich zu erheben und die Herrschaft innezuhaben. Und ich sah, und siehe: Eines erhob sich, verschwand aber sogleich; dann das Zweite, und auch dieses …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene lateinische Text bricht hier mitten im Satz nach „und auch dieses“ ab.
    reason: Kennzeichnet die materielle Unvollständigkeit der Quelle und verhindert, dass die Auslassungspunkte als bloße Stilfigur missverstanden werden.
lexical_decisions:
- source_word: cogitabant se erigere et tenere principatus
  choice: Sie dachten daran, sich zu erheben und die Herrschaft zu übernehmen
  rationale: Gibt sowohl die Absicht als auch den Herrschaftsanspruch des lateinischen Satzes natürlich und eng am Wortlaut wieder.
- source_word: una erecta est
  choice: Eines erhob sich
  rationale: Das neutrale „Eines“ bezieht sich auf ein zuvor genanntes Bildelement; „erhob sich“ bewahrt die Bildsprache und vermeidet eine unnötige Präzisierung.
- source_word: statim non conparuit
  choice: verschwand aber sogleich
  rationale: Idiomatiche Wiedergabe des unmittelbaren Nicht-mehr-Erscheinens; „sogleich“ entspricht statim.
- source_word: Et secunda, et haec
  choice: dann das zweite, und auch dieses …
  rationale: Bewahrt den abrupt abbrechenden Text, ohne den fehlenden Fortgang aus späterer Überlieferung oder der englischen Konsultationsfassung zu ergänzen.
theological_decisions:
- issue: Identität der sich erhebenden Elemente
  choice: Neutrale Formen „Eines“ und „das zweite“
  alternative: Ausdrückliche Benennung, etwa „ein Flügel“ oder „ein Kopf“
  rationale: Der vorgelegte lateinische Ausschnitt nennt das Bezugswort nicht; eine Ergänzung würde die genuine Kontextabhängigkeit des Textes auflösen.
- issue: Abgebrochener Schluss
  choice: Durch Auslassungspunkte kenntlich gemacht
  alternative: Den Satz sinngemäß vervollständigen
  rationale: Die Quelle endet bei „et haec“; eine inhaltliche Ergänzung wäre textlich nicht gestützt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende „Und ich sah, und siehe“ erhält den visionären biblischen Erzählton; die Satzfragmente am Ende spiegeln bewusst den beschädigten lateinischen Text.
