  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: de
  text: 'Und dieses Haupt hatte die ganze Erde in seiner Gewalt und herrschte mit großer Bedrückung über ihre Bewohner. Seine Herrschaft über den Erdkreis war größer als die aller Flügel, die vor ihm gewesen waren. Danach sah ich, und siehe:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput
  choice: Haupt
  rationale: Bewahrt das Bild des lateinischen Textes und passt zum visionären Zusammenhang.
- source_word: percontinuit omnem terram
  choice: beherrschte die ganze Erde
  rationale: Gibt die umfassende Machtausübung idiomatisch wieder, ohne eine unnötig konkrete räumliche Bedeutung einzutragen.
- source_word: cum labore multo
  choice: mit großer Bedrückung
  rationale: Im Herrschaftskontext bezeichnet labor die schwere Belastung beziehungsweise Bedrängnis der Bewohner; „Bedrückung“ gibt diese Wirkung natürlich wieder.
- source_word: potentatum tenuit orbis terrarum
  choice: übte Macht über den Erdkreis aus
  rationale: Versteht orbis terrarum als Bereich der Herrschaft und gibt potentatum tenere in natürlichem Deutsch wieder.
- source_word: alas
  choice: Flügel
  rationale: Behält die Bildsprache der Vision unverändert bei.
- source_word: ecce
  choice: siehe
  rationale: Bewahrt das visionäre Aufmerksamkeitssignal in würdigem, bibelsprachlich vertrautem Deutsch.
