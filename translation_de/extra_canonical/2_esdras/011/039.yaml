source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: regnare in saeculo meo, et ut per ea ueniret finis temporum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: de
  text: Bist du nicht derjenige, der von den vier Tieren übrig geblieben ist, die ich in meinem Zeitalter[a] herrschen ließ, damit durch sie das Ende der Zeiten käme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in meiner Weltzeit.'
    reason: Das lateinische „saeculum“ kann sowohl „Zeitalter“ als auch „Weltzeit“ bedeuten.
lexical_decisions:
- source_word: regnare
  choice: herrschen ließ
  rationale: Der lateinische Infinitiv bezeichnet das Herrschen; zusammen mit dem im weiteren Satz bezeugten Veranlassungsverb wird er im Deutschen natürlich mit „herrschen ließ“ wiedergegeben.
- source_word: in saeculo meo
  choice: in meinem Zeitalter
  rationale: „Saeculum“ kann eine Zeitspanne, ein Zeitalter oder eine Weltzeit bezeichnen. „Zeitalter“ ist hier verständlich und bewahrt den zeitgeschichtlichen Sinn.
- source_word: per ea
  choice: durch sie
  rationale: Das sächliche Pluralpronomen verweist auf die vier Tiere; deutsches „sie“ gibt diesen Rückbezug natürlich wieder.
- source_word: finis temporum
  choice: das Ende der Zeiten
  rationale: Die wörtliche Pluralform bewahrt die apokalyptische Wendung, ohne sie zu „Endzeit“ zu verengen.
theological_decisions:
- issue: Beziehung zwischen der Herrschaft der Tiere und dem Ende der Zeiten
  choice: „damit durch sie das Ende der Zeiten käme“
  alternative: „sodass durch sie das Ende der Zeiten kommen sollte“
  rationale: Die finale Konstruktion „ut ... veniret“ wird als Absicht beziehungsweise vorgesehener Zweck wiedergegeben; die Formulierung lässt die Spannung zwischen göttlicher Bestimmung und geschichtlicher Vermittlung bestehen.
- issue: Deutung von „saeculum“
  choice: „Zeitalter“
  alternative: „Weltzeit“
  rationale: „Zeitalter“ ist im modernen Standarddeutsch zugänglicher, ohne den Ausdruck auf die räumliche „Welt“ oder auf die Ewigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rhetorische Fragesatz und die apokalyptische Bildsprache bleiben erhalten; der Konjunktiv „käme“ bildet das lateinische „veniret“ in der abhängigen Finalkonstruktion ab.
