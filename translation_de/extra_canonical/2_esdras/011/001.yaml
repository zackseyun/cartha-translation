  rationale: Bewahrt Richtung und imperfektiven Verlauf des Aufsteigens.
- source_word: duodecim alae pennarum
  choice: zwölf gefiederte Flügel
  rationale: Gibt die ungewöhnliche lateinische Verbindung verständlich wieder, ohne »pennarum« auszulassen.
- source_word: capita tria
  choice: drei Köpfe
  rationale: Direkte und unzweideutige Wiedergabe.
