  source_fidelity: Die Übersetzung gibt den überlieferten Sinn von „[rem]an... aber zwei Köpfe“ zutreffend als „Doch zwei Köpfe blieben übrig“ wieder. „herrschten über die Erde und über die Menschen, die auf ihr wohnen“ entspricht regnauerunt super terram et super eos qui inhabitant in ea. Die abschließende Visionsformel „Et uidi et ecce“ ist vollständig enthalten und ihr offener Anschluss durch den Doppelpunkt sachgerecht markiert.
  naturalness: Modernes, gut verständliches Standarddeutsch bei angemessen würdig-apokalyptischem Register. „Und ich sah, und siehe:“ ist bewusst formelhaft, aber im Kontext einer Vision idiomatisch und stilistisch vertretbar.
  terminology: „Köpfe“ bewahrt das Bildwort capita. „herrschten“ trifft regnauerunt ohne eine unnötige Festlegung auf einen Königstitel. „Menschen, die auf ihr wohnen“ ist eine natürliche und sinngerechte Wiedergabe der Erdbewohner.
