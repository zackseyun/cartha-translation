source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: auerunt autem duo capita quae et ipsa regnauerunt super terram et super eos qui inhabitant in ea. Et uidi et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/034.yaml
  text: But two heads remained, and they too reigned over the earth and over those who dwell in it. And I saw, and behold,
translation:
  language: de
  text: 'Doch zwei Köpfe blieben übrig; auch sie herrschten über die Erde und über die Menschen, die auf ihr wohnen. Und ich sah, und siehe:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auerunt
  choice: blieben übrig
  rationale: Der überlieferte Text dürfte den Sinn von lateinisch „remanserunt“ oder einer entsprechenden Form bewahren; im Zusammenhang und gemäß der gesicherten Lesetradition sind zwei noch verbleibende Köpfe gemeint.
- source_word: capita
  choice: Köpfe
  rationale: Gibt das Bildwort des lateinischen Textes direkt und im Deutschen natürlich wieder.
- source_word: regnauerunt
  choice: herrschten
  rationale: Entspricht dem politischen Herrschaftssinn von „regnare“, ohne zwingend ein formales Königtum auszudrücken.
- source_word: super terram
  choice: über die Erde
  rationale: Bewahrt die räumlich und herrschaftlich deutbare Wendung des Lateinischen.
- source_word: super eos qui inhabitant in ea
  choice: über die Menschen, die auf ihr wohnen
  rationale: „eos“ bezeichnet hier die Bewohner; „Menschen“ macht den Bezug im Deutschen verständlich, ohne den Umfang näher einzuschränken.
- source_word: Et uidi et ecce
  choice: 'Und ich sah, und siehe:'
  rationale: Bewahrt die visionäre Doppelformel. Der Doppelpunkt zeigt an, dass der Satz in den folgenden Vers hineinführt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die apokalyptische Bildsprache bleibt erhalten; der fragmentarische Übergang am Versende wird durch einen Doppelpunkt kenntlich gemacht.
