source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: de
  text: Denn[a] seine Köpfe ruhten, und der mittlere Kopf war größer als die anderen Köpfe; doch auch er ruhte mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Allerdings.'
    reason: Dokumentiert eine mögliche, kontextuell stärker abtönende Wiedergabe von „Nam“, ohne die bevorzugte erklärende Bedeutung aufzugeben.
lexical_decisions:
- source_word: Nam
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung oder Erläuterung ein; das adversative Moment folgt erst mit „sed“.
- source_word: capita eius erant quiescentia
  choice: seine Köpfe ruhten
  rationale: Die verbale deutsche Formulierung gibt den Zustand der Untätigkeit natürlich und knapp wieder.
- source_word: medium caput
  choice: der mittlere Kopf
  rationale: Wörtliche und im Deutschen klare Wiedergabe der räumlichen Bezeichnung.
- source_word: maius aliorum capitum
  choice: größer als die anderen Köpfe
  rationale: Der lateinische Vergleich wird in idiomatischem Deutsch ausdrücklich mit „als“ wiedergegeben.
- source_word: sed et ipsa quiescebat cum eis
  choice: doch auch er ruhte mit ihnen
  rationale: „doch“ bewahrt den Gegensatz, während „auch“ hervorhebt, dass selbst der größere mittlere Kopf denselben Ruhezustand teilte.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aussage über das Ruhen der Köpfe bleibt erhalten, ebenso der Kontrast zwischen der besonderen Größe des mittleren Kopfes und seiner gemeinsamen Ruhe mit den übrigen.
