id: 2ES.11.42
reference: 2 Esdras 11:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: de
  text: Denn du hast die Sanftmütigen bedrängt und denen geschadet, die in Ruhe lebten; du hast die gehasst, die die Wahrheit sagten, und die Lügner geliebt; du hast die Wohnungen derer zerstört, die Frucht brachten, und ihre Mauern erniedrigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihre Mauern niedergelegt“; wörtlich steht im Lateinischen: „erniedrigt“.'
    reason: Das lateinische humiliare ist bei Mauern ungewöhnlich und kann bildhaft das Herabsetzen oder Niederlegen bezeichnen.
lexical_decisions:
- source_word: mansuetos
  choice: die Sanftmütigen
  rationale: Gibt die Haltung der mansueti würdig und in vertrauter biblischer Sprache wieder.
- source_word: quiescentes
  choice: die in Ruhe lebten
  rationale: Bewahrt den Grundsinn von quiescere („ruhen, unbehelligt leben“), ohne die aktivere Bedeutung von „friedfertig“ einzutragen.
- source_word: uerum dicentes
  choice: die, die die Wahrheit sagten
  rationale: Entspricht der substantivierten lateinischen Wendung und wahrt die Vergangenheitsform des Zusammenhangs.
- source_word: mendaces
  choice: die Lügner
  rationale: Direkte und natürliche Wiedergabe der Personenbezeichnung.
- source_word: fructificabant
  choice: Frucht brachten
  rationale: Bewahrt das konkrete Bild des Fruchtbringens, statt es vorschnell als Wohlstand oder Nutzen auszulegen.
- source_word: humiliasti muros eorum
  choice: ihre Mauern erniedrigt
  rationale: Erhält das ungewöhnliche Bild des lateinischen Verbs und vermeidet die stärkere Festlegung auf vollständiges Niederreißen.
theological_decisions:
- issue: Deutung des Fruchtbringens
  choice: Das Bild „Frucht bringen“ bleibt stehen.
  alternative: „die erfolgreich waren“ oder „die Gutes hervorbrachten“
  rationale: Der lateinische Text lässt offen, ob materieller Ertrag, sittliche Frucht oder allgemeines Gedeihen gemeint ist.
- issue: Grad der Zerstörung der Mauern
  choice: Das metaphorisch-offene „erniedrigt“ wird beibehalten.
  alternative: „niedergerissen“ oder „geschleift“
  rationale: humiliare bezeichnet zunächst Erniedrigung beziehungsweise Herabsetzung; eine eindeutige Aussage über vollständige Zerstörung wäre interpretierend.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltenen biblischen Bildern. Das vorangestellte „cum ueritate“ wird nicht aufgenommen, da es nach Stellung und Zeichensetzung als Abschluss des vorausgehenden Satzes zu verstehen ist.
