  text: and the second did not appear[a], but disappeared more quickly than the former. And I saw, and behold, two that
translation:
  language: de
  text: 'Und die zweite erschien nicht, sondern verschwand schneller als die erste. Und ich sah, und siehe: zwei, die'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non conparuit
  choice: verschwand
  rationale: Die lateinische Wendung bezeichnet hier das Verschwinden beziehungsweise Nicht-mehr-sichtbar-Sein. „Verschwand“ gibt den Sinn im Zusammenhang natürlich wieder, ohne die Wendung doppelt als „erschien nicht, sondern verschwand“ auszudrücken.
- source_word: uelocius quam prior
  choice: schneller als die erste
  rationale: Komparativisch und kontextgerecht; „prior“ bezeichnet den zuvor genannten Flügel und wird im Deutschen passend mit „die erste“ wiedergegeben.
- source_word: Et uidi et ecce
  choice: Und ich sah, und siehe
  rationale: Bewahrt die wiederkehrende visionäre Formel und ihren feierlichen Ton.
- source_word: duae quae
  choice: zwei, die
  rationale: Die feminine Form verweist auf die im Kontext genannten Flügel; da der Satz im überlieferten Ausschnitt weiterläuft, bleibt auch die deutsche Fassung bewusst offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die am Ende in den nächsten Satz hineinführende unvollständige Formulierung wird entsprechend dem bereitgestellten Quellenausschnitt beibehalten. „Siehe“ erhält den visionären biblischen Sprachklang, ohne unnötig altertümlich zu wirken.
