lexical_decisions:
- source_word: numeraui
  choice: ich zählte
  rationale: Gibt das lateinische Verb unmittelbar und natürlich wieder.
- source_word: contrarias pennas
  choice: gegenüberstehenden Flügel
  rationale: Bewahrt den räumlichen beziehungsweise relationalen Sinn von contrarias, ohne ihn unnötig als feindlich oder widerstrebend zu deuten; pennae bezeichnet im Zusammenhang die Flügel.
- source_word: ecce
  choice: siehe
  rationale: Erhält das markierende, visionäre Signalwort in würdiger und vertrauter biblischer Sprache.
theological_decisions:
- issue: Bedeutung von contrarias
  choice: gegenüberstehenden
  alternative: entgegengesetzten; widerstreitenden
  rationale: Der lateinische Ausdruck kann Gegensatz oder Gegenüberstellung bezeichnen. Die gewählte Fassung wahrt die Bildsprache und vermeidet es, einen theologischen oder feindseligen Konflikt einzutragen, den der Satz nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bewusst bewahrtem visionär-biblischem „siehe“. Der Satzbau bleibt nah an der lateinischen Vorlage.
