lexical_decisions:
- source_word: statim non conparescebant
  choice: Sofort waren sie nicht mehr zu sehen
  rationale: Das lateinische imperfective „non conparescebant“ bezeichnet, dass sie nicht mehr sichtbar bzw. nicht mehr wahrnehmbar waren. Die Formulierung ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „erschienen nicht“ und vermeidet, über den Vorgang ihres Verschwindens mehr auszusagen als der Text.
- source_word: Nam et
  choice: Denn auch
  rationale: „Denn“ bewahrt die erklärende bzw. begründende Anschlussfunktion von „nam“, während „auch“ die additive Kraft von „et“ wiedergibt.
- source_word: aliquae ex eis
  choice: einige von ihnen
  rationale: Dies entspricht der partitiven Wendung; das feminine Genus von „aliquae“ nimmt auf ein feminines Bezugswort im Kontext Bezug, das im deutschen Pronomen nicht eigens markiert werden muss.
- source_word: erigebantur
  choice: richteten sich auf
  rationale: Das passive Imperfekt von „erigere“ kann hier idiomatisch-reflexiv als ein Sich-Aufrichten wiedergegeben werden. Das Präteritum passt zum fortlaufenden Erzählstil, ohne die genaue Aktionsart übermäßig festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss mit „Denn auch“ erhält sowohl die erklärende als auch die additive Nuance des lateinischen „Nam et“. Das abschließende Komma bleibt stehen, da der Quellenausschnitt syntaktisch in den folgenden Vers bzw. Satzteil weiterführt.
