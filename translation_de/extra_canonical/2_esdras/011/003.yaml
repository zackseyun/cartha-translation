source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et de pennis eius nascebantur contrariae pennae, et ipsae fiebant in pennaculis minutis et modicis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: de
  text: 'Und ich sah: Aus seinen Flügeln[a] wuchsen entgegengesetzte Flügel hervor, und diese wurden zu winzigen, kleinen Flügelchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Aus seinen Federn wuchsen entgegengesetzte Flügel hervor.«'
    reason: Das lateinische »penna« kann sowohl »Flügel« als auch »Feder« bedeuten; im Bildzusammenhang ist »Flügel« wahrscheinlicher.
lexical_decisions:
- source_word: pennis / pennae
  choice: Flügeln / Flügel
  rationale: Beide Formen gehen auf dasselbe lateinische Wort »penna« zurück. Im Zusammenhang der Adlervision bezeichnet es am ehesten Flügel; die mögliche Bedeutung »Federn« wird in der Fußnote offengehalten.
- source_word: contrariae
  choice: entgegengesetzte
  rationale: Gibt die räumliche oder relationale Gegenüberstellung wieder, ohne sie eindeutig als feindseligen Widerstand auszulegen.
- source_word: pennaculis
  choice: Flügeln
  rationale: Das Diminutiv bezeichnet kleine Flügel beziehungsweise Flügelchen. Im Deutschen vermittelt die Verbindung mit den Adjektiven die Verkleinerung natürlicher als das ungebräuchliche »Flügelchen«.
- source_word: minutis et modicis
  choice: winzigen, kleinen
  rationale: Bewahrt die nahezu synonyme Doppelbestimmung des Lateinischen, statt eines der beiden Adjektive aus stilistischen Gründen auszulassen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Doppelanschluss mit »und« wurde nach dem einleitenden »Und ich sah« durch einen Doppelpunkt geglättet; die Wiederholung von »Flügel« und die Größenabstufung des lateinischen Textes bleiben erhalten.
