  source_fidelity: 'Die Übersetzung gibt die Struktur und den Kontrast des lateinischen Textes zuverlässig wieder: „Und ich sah“ entspricht „Et uidi“, das einleitende „Da“ vermittelt die hinweisende Funktion von „ecce“, und „eine Stimme kam nicht aus seinen Köpfen, sondern aus der Mitte seines Körpers“ bewahrt sowohl die Verneinung als auch den Gegensatz mit „sed“. Der Plural „Köpfen“ und die räumliche Aussage von „medietate corporis“ bleiben erhalten.'
  naturalness: Das Deutsch ist modernes, gut verständliches Standarddeutsch mit einem angemessen knappen visionär-erzählenden Ton. Die Stellung in „Da kam eine Stimme nicht aus …“ ist leicht literarisch, aber idiomatisch und unterstützt den hervorgehobenen Gegensatz.
  terminology: „Eine Stimme“ ist für das artikellose lateinische „uox“ sachgerecht. „Mitte seines Körpers“ ist eine natürliche und semantisch genaue Wiedergabe von „medietate corporis eius“. Die Possessivformen beziehen sich klar auf das zuvor geschilderte Wesen, ohne dessen Identität zusätzlich auszudeuten.
