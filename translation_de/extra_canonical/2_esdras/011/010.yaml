  text: Et uidi et ecce uox non exiebat de capitibus eius, sed de medietate corporis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/010.yaml
  text: And I looked, and behold, a voice did not come out from its heads, but from the middle of its body.
translation:
  language: de
  text: 'Und ich sah: Da kam eine Stimme nicht aus seinen Köpfen, sondern aus der Mitte seines Körpers.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'Und ich sah: Da'
  rationale: Gibt die erneute Schau und das aufmerksamkeitslenkende „ecce“ in natürlichem, würdigem Deutsch wieder, ohne das im Deutschen schwerfällige „siehe“ zu erzwingen.
- source_word: uox
  choice: eine Stimme
  rationale: Das artikellose lateinische Substantiv wird hier entsprechend dem erstmals eingeführten, nicht näher bestimmten Schallereignis indefinit wiedergegeben.
- source_word: non exiebat ... sed
  choice: kam nicht ... sondern
  rationale: Bewahrt den ausdrücklich verneinten Ursprung und den kontrastierenden Satzbau des Lateinischen.
- source_word: de capitibus eius
  choice: aus seinen Köpfen
  rationale: Erhält den Plural „capitibus“ und bezieht das Possessivpronomen auf das zuvor beschriebene Wesen.
- source_word: de medietate corporis eius
  choice: aus der Mitte seines Körpers
  rationale: Gibt „medietas“ räumlich und ohne zusätzliche Deutung als „Mitte“ wieder.
theological_decisions: []
