id: 2ES.11.6
reference: 2 Esdras 11:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi quomodo subiecti erant ei omnia sub caelo, et nemo illi contradicebat neque unus de creatura, quae est super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
translation:
  language: de
  text: Und ich sah, wie ihm alles unter dem Himmel unterworfen war. Niemand widersetzte sich ihm, auch nicht ein einziges Geschöpf auf der Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subiecti erant ei omnia
  choice: ihm alles … unterworfen war
  rationale: Gibt die universale Unterordnung bzw. Unterwerfung unter den Adler natürlich und eng am Lateinischen wieder.
- source_word: nemo illi contradicebat
  choice: Niemand widersetzte sich ihm
  rationale: Im Zusammenhang uneingeschränkter Herrschaft bezeichnet contradicere mehr als bloßen verbalen Widerspruch; „sich widersetzen“ bewahrt den Gedanken fehlenden Widerstands, ohne ihn unnötig militärisch zuzuspitzen.
- source_word: neque unus de creatura
  choice: auch nicht ein einziges Geschöpf
  rationale: Idiomatiche deutsche Wiedergabe der verstärkenden lateinischen Formulierung.
- source_word: quae est super terram
  choice: auf der Erde
  rationale: Natürliches modernes Deutsch für die räumliche Bestimmung; der Bezug gilt sinngemäß dem Geschöpf.
theological_decisions:
- issue: Personaler Bezug des Pronomens auf den Adler
  choice: ihm
  alternative: ihn / ihm mit sachlichem Bezug
  rationale: Der Adler ist im Deutschen grammatisch maskulin; das Pronomen bezieht sich auf ihn als apokalyptische Herrschaftsgestalt, ohne seine symbolische Deutung im Vers auszuschreiben.
- issue: Bedeutungsumfang von contradicere
  choice: sich widersetzen
  alternative: widersprechen
  rationale: Der unmittelbare Kontext der allgemeinen Unterwerfung spricht für wirklichen Widerstand gegen die Herrschaft. „Widersetzen“ erfasst dies, während „widersprechen“ im heutigen Deutsch leicht nur verbal verstanden würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Hauptaussagen sind zur besseren Lesbarkeit in zwei Sätze gegliedert; die umfassende und unangefochtene Herrschaft bleibt erhalten.
