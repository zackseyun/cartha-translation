lexical_decisions:
- source_word: Et vidi et ecce
  choice: 'Da sah ich: Siehe'
  rationale: Gibt die erzählerische Folge und den hervorhebenden Schauhinweis des Lateinischen würdig und verständlich wieder.
- source_word: sicut leo
  choice: etwas wie ein Löwe
  rationale: Bewahrt den Vergleichscharakter von „sicut“, ohne die Erscheinung schlicht mit einem Löwen gleichzusetzen.
- source_word: suscitatus
  choice: aufgescheucht worden war
  rationale: Das passive Partizip bezeichnet einen Löwen, der aufgestört beziehungsweise aufgerüttelt wurde; „aufgescheucht“ passt natürlich zur Herkunft aus dem Wald und erhält das Passiv.
- source_word: de silua
  choice: aus dem Wald
  rationale: Direkte und idiomatische Wiedergabe der Herkunftsangabe.
