  text: But let the heads be reserved for the end.
translation:
  language: de
  text: Die Köpfe aber sollen für das Ende vorbehalten bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Capita
  choice: die Köpfe
  rationale: Im Zusammenhang der Adlergestalt bezeichnet das lateinische „capita“ konkret die Köpfe; die wörtliche Wiedergabe bewahrt das Bild.
- source_word: in nouissimo
  choice: bis zum Ende
  rationale: Die Wendung bezeichnet hier den letzten Abschnitt beziehungsweise Zeitpunkt. „Bis zum Ende“ ist im Deutschen natürlich und gibt die zeitliche Zurückstellung wieder.
- source_word: seruentur
  choice: sollen … aufbewahrt werden
  rationale: Der passive Konjunktiv drückt eine Anweisung aus. „Sollen … aufbewahrt werden“ erhält sowohl den Aufforderungscharakter als auch das Passiv.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die adversative Hervorhebung durch „aber“ bleibt erhalten; das apokalyptische Bild wird nicht auslegend aufgelöst.
