source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et respexit Altissimus super sua tempora, et ecce finita sunt et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: de
  text: Und der Höchste hat auf seine Zeiten geblickt, und siehe, sie sind zu Ende, und seine Zeitalter sind vollendet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respexit
  choice: blickte auf
  rationale: Gibt das lateinische Verb in seiner Grundbedeutung wieder und bewahrt die bewusste Hinwendung des Höchsten zu den betreffenden Zeiten.
- source_word: tempora
  choice: Zeiten
  rationale: Formale und im Kontext natürliche Entsprechung; der Plural des Ausgangstextes bleibt erhalten.
- source_word: finita sunt
  choice: waren zu Ende gegangen
  rationale: Gibt den abgeschlossenen Zustand der Zeiten idiomatisch wieder und vermeidet das im Deutschen schwerfällige „waren beendet“.
- source_word: saecula
  choice: Zeitalter
  rationale: Bewahrt den zeitgeschichtlichen Sinn von saecula und unterscheidet den Ausdruck von tempora.
- source_word: conpleta sunt
  choice: waren erfüllt
  rationale: Erhält die Vorstellung, dass die bestimmten Zeitalter ihr volles Maß beziehungsweise ihr vorgesehenes Ende erreicht hatten.
theological_decisions:
- issue: Bezug der Possessivpronomen sua und eius
  choice: „seine Zeiten“ und „seine Zeitalter“, entsprechend der grammatisch naheliegenden Rückbeziehung auf den zuvor behandelten männlichen Bezugsträger
  alternative: Bezug auf den Höchsten oder unpersönliche Wiedergabe als „die ihm bestimmten Zeiten/Zeitalter“
  rationale: Der lateinische Wortlaut lässt den Bezug im isolierten Vers nicht völlig spannungsfrei erkennen. Die Übersetzung bewahrt daher die Pronomen, statt die Identität ihres Bezugsträgers ausdrücklich festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Anlehnung an die lateinische Satzstruktur. „Und siehe“ bewahrt den biblisch-markierenden ecce-Ruf; die beiden zeitlichen Ausdrücke werden bewusst unterschieden.
