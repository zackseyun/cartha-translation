  yaml_path: translation/extra_canonical/2_esdras/011/024.yaml
  text: And I looked, and behold, two of the six little pinions were separated and remained under the head that was on the right side; for
translation:
  language: de
  text: 'Und ich sah, und siehe: zwei von den sechs kleinen Flügeln sonderten sich ab und blieben unter dem Kopf, der auf der rechten Seite war; denn'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennaculis
  choice: kleinen Flügeln
  rationale: Das lateinische Diminutiv bezeichnet hier die kleineren Flügel beziehungsweise Schwingen des Adlers. „Kleine Flügel“ ist im Deutschen anschaulich und hält die Bildsprache verständlich.
- source_word: diuisa sunt
  choice: sonderten sich ab
  rationale: Die reflexive deutsche Form gibt den Vorgang des Sich-Trennens natürlich wieder, ohne einen im Lateinischen nicht genannten Handelnden einzuführen.
- source_word: sub capite, quod est ad dexteram partem
  choice: unter dem Kopf, der sich auf der rechten Seite befand
  rationale: Die räumliche Zuordnung wird eindeutig und in natürlichem Deutsch wiedergegeben.
- source_word: nam
  choice: denn
  rationale: „Denn“ bewahrt die begründende Funktion der lateinischen Konjunktion und lässt wie die Quelle erkennen, dass der Satz im folgenden Vers weitergeht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit der biblisch geprägten Schauformel „Und ich sah, und siehe“. Der unabgeschlossene Schluss mit „denn“ wird entsprechend der Versgrenze und dem fortlaufenden lateinischen Satz bewahrt.
