base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/035.yaml
  text: The head on the right side devoured the one on the left. And I heard a voice saying to me, “Look before you, and—”
translation:
  language: de
  text: 'Der Kopf auf der rechten Seite verschlang den auf der linken. Und ich hörte eine Stimme zu mir sagen: »Schau vor dich und …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text bricht an dieser Stelle mitten im Satz ab.
    reason: Der überlieferte Quellenausschnitt endet mit dem unvollständigen »et con-«; die Auslassungspunkte machen den Abbruch sichtbar, und die Fußnote erklärt ihn.
lexical_decisions:
- source_word: deuorauit
  choice: verschlang
  rationale: Gibt das gewaltsame lateinische Verb prägnant und natürlich wieder.
- source_word: caput a dextera parte
  choice: der Kopf auf der rechten Seite
  rationale: Bewahrt die räumliche Zuordnung des lateinischen Ausdrucks, ohne eine darüber hinausgehende Deutung einzutragen.
- source_word: conspice contra te
  choice: Schau vor dich
  rationale: Gibt die Aufforderung idiomatisch wieder; »contra te« bezeichnet hier den Bereich gegenüber beziehungsweise vor dem Angesprochenen.
