  text: And I looked, and behold, the eagle flew on its wings to reign over the earth and over those who dwell in it.
translation:
  language: de
  text: 'Und ich sah, und siehe: Der Adler flog auf seinen Flügeln, um über die Erde und über die zu herrschen, die auf ihr wohnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'Und ich sah: Siehe'
  rationale: Bewahrt die visionäre Wahrnehmungsformel und das hervorgehobene „ecce“ in würdigem, verständlichem Deutsch.
- source_word: aquila
  choice: der Adler
  rationale: Direkte und kontextgemäße Wiedergabe des lateinischen Substantivs.
- source_word: uolauit in pennis suis
  choice: flog mit seinen Flügeln
  rationale: „in“ bezeichnet hier das Mittel; „mit seinen Flügeln“ ist im Deutschen natürlich und bleibt nahe am lateinischen Bild.
- source_word: ut regnaret
  choice: um … zu herrschen
  rationale: Gibt den finalen Sinn von „ut“ mit Konjunktiv wieder, ohne über die Art der Herrschaft hinauszugehen.
- source_word: super terram et super eos qui habitant in ea
  choice: über die Erde und über ihre Bewohner
  rationale: Die zweite Präpositionalfügung wird idiomatisch verdichtet; der Bezug von „ea“ auf die Erde bleibt eindeutig erhalten.
theological_decisions:
- issue: Zweck oder Folge des Fliegens
  choice: um … zu herrschen
  alternative: sodass er … herrschte
  rationale: Die lateinische Konstruktion „ut regnaret“ lässt sich hier am naheliegendsten final verstehen; die Übersetzung kennzeichnet das Fliegen als auf Herrschaft ausgerichtet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem visionärem Signalwort „Siehe“. Die verkürzte Formulierung „ihre Bewohner“ vermeidet schwerfälliges Deutsch, ohne Inhalt einzubüßen.
