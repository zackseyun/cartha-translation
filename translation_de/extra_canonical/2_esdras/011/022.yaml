lexical_decisions:
- source_word: tenebant principatum
  choice: sie behielten die Herrschaft
  rationale: „Herrschaft behalten“ gibt das fortdauernde Innehaben von „principatus“ natürlich und präzise wieder.
- source_word: Et uidi post haec
  choice: Danach sah ich
  rationale: Eine idiomatische Wiedergabe der zeitlichen Folge; das lateinische verbindende „Et“ muss im Deutschen nicht eigens mit „Und“ abgebildet werden.
- source_word: ecce
  choice: siehe
  rationale: Das traditionelle, würdige Aufmerksamkeitswort bewahrt den visionären Erzählton.
- source_word: non
  choice: Nicht
  rationale: Das am Versende überlieferte Wort wird sichtbar wiedergegeben, obwohl seine syntaktische Ergänzung erst im folgenden Vers steht.
