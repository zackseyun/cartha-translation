  yaml_path: translation/extra_canonical/2_esdras/011/007.yaml
  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
translation:
  language: de
  text: 'Und ich sah, und siehe: Der Adler erhob sich auf seinen Krallen und richtete seine Stimme an seine Flügel und sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surrexit aquila super ungues suos
  choice: Der Adler erhob sich auf seinen Krallen
  rationale: „Sich erheben“ bildet surrexit genau und würdevoll ab; „Krallen“ ist für ungues beim Adler die natürliche deutsche Bezeichnung.
- source_word: misit uocem pennis suis
  choice: ließ seine Stimme an seine Flügel ergehen
  rationale: Die Formulierung bewahrt das Bild des lateinischen misit vocem und gibt pennis suis als Ziel der Stimme wieder, ohne den idiomatischen Ausdruck als buchstäbliches Versenden misszuverstehen.
- source_word: dicens
  choice: indem er sprach
  rationale: Die Wendung erhält den zum folgenden Inhalt hinführenden Charakter des Partizips und vermeidet das im Deutschen schwerfällige „sagend“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das einleitende „Und ich sah, und siehe“ bewahrt den visionären Erzählrhythmus und die doppelte lateinische Verknüpfung. Die ungewöhnliche Personifizierung des Adlers und seiner Flügel wird nicht geglättet.
