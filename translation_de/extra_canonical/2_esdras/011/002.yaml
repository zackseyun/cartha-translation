source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce expandebat alas suas in omnem terram, et omnes uenti caeli insufflabant ad eam et [nubes ad eam] colligebantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: de
  text: 'Und ich sah: Siehe, der Adler breitete seine Flügel über die ganze Erde aus. Alle Winde des Himmels wehten auf ihn zu,[a] und die Wolken zogen sich zu ihm zusammen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wehten gegen ihn.'
    reason: translation_alternative
  - marker: b
    text: Die Worte »und die Wolken zogen sich zu ihm zusammen« sind im bereinigten lateinischen Text Benslys vorhanden, stehen jedoch in Klammern und sind textlich unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: expandebat alas suas in omnem terram
  choice: breitete seine Flügel über die ganze Erde aus
  rationale: Gibt die räumliche Ausdehnung von »in omnem terram« natürlich wieder; der Adler ist aus dem Kontext ergänzt und im Deutschen maskulin.
- source_word: insufflabant ad eam
  choice: wehten auf ihn zu
  rationale: Bewahrt mit »auf ihn zu« die Richtungsbedeutung von »ad« und gibt »insufflabant« idiomatisch als Windbewegung wieder.
- source_word: ad eam colligebantur
  choice: zogen sich zu ihm zusammen
  rationale: Verbindet die Sammelbewegung von »colligebantur« mit der durch »ad« bezeichneten Richtung zum Adler hin.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige Erzählsprache. Das eröffnende »Und ich sah: Siehe« bewahrt den visionären Stil des Lateinischen, ohne unnötig altertümlich zu wirken. Wegen des im Deutschen maskulinen Substantivs »Adler« stehen die Pronomen im Maskulinum.'
