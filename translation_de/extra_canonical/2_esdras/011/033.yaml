lexical_decisions:
- source_word: medium caput
  choice: der mittlere Kopf
  rationale: Direkte und natürliche Wiedergabe des lateinischen Ausdrucks.
- source_word: subito non conparuit
  choice: verschwand plötzlich
  rationale: Das wörtliche »war plötzlich nicht mehr zu sehen« bezeichnet hier idiomatisch ein plötzliches Verschwinden.
- source_word: et hoc sicut alae
  choice: ebenso wie die Flügel
  rationale: Die elliptische Wendung nimmt »verschwand« sinngemäß wieder auf und vergleicht das Geschehen mit dem Verschwinden der Flügel.
