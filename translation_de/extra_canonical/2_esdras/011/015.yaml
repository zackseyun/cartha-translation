lexical_decisions:
- source_word: ueniebat finis eius
  choice: Sein Ende nahte
  rationale: Die Wendung wird im Deutschen natürlich und zugleich bildhaft wiedergegeben; das imperfektische ueniebat bezeichnet ein herannahendes Ende.
- source_word: ut non appareret sicut prior
  choice: sodass es nicht wie das vorige erschien
  rationale: Die Wiedergabe bleibt nahe an appareret und bewahrt den Vergleich mit dem Vorherigen. „Sodass“ gibt hier den naheliegenden Folgesinn von ut wieder, ohne den Satz unnötig zu erklären.
- source_word: Et ecce uox
  choice: Und siehe, eine Stimme
  rationale: Die bewusst unvollständige Formulierung entspricht der Versgrenze der Quelle; die Fortsetzung gehört zum folgenden Vers.
