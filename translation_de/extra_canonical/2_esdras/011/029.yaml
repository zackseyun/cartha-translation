  text: the one that was in the middle awoke[a], for it was larger than the two heads. And I saw how it drew the two heads to itself,
translation:
  language: de
  text: Da erwachte der Kopf in der Mitte, denn er war größer als die beiden Köpfe. Und ich sah, wie der Adler die beiden Köpfe an sich zog.[a]
