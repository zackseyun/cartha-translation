lexical_decisions:
- source_word: quod erat medium
  choice: der Kopf in der Mitte
  rationale: Das lateinische Relativgefüge bezeichnet im Kontext den mittleren der drei Köpfe; die ausdrückliche Wiederaufnahme von „Kopf“ ist im Deutschen natürlicher und eindeutig.
- source_word: euigilabat
  choice: erwachte
  rationale: Gibt das inchoative Aufwachen des mittleren Kopfes unmittelbar und ohne zusätzliche Deutung wieder.
- source_word: maius
  choice: größer
  rationale: Bewahrt die konkrete Größenangabe; „mächtiger“ wäre eine interpretierende Übertragung.
- source_word: conplexa est ... secum
  choice: mit sich vereinte
  rationale: Die Wendung bezeichnet ein Zusammennehmen beziehungsweise Verbinden mit sich selbst. „Vereinte“ passt zum Bild und lässt offen, ob ein Bündnis oder ein körperliches Zusammenziehen gemeint ist.
