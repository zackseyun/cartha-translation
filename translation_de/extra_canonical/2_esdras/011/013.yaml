source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: de
  text: 'Und es geschah: Während sie herrschte, kam ihr Ende, und sie war nicht mehr sichtbar, sodass auch ihr Platz nicht mehr sichtbar war. Dann erhob sich die Nächste, herrschte und blieb lange Zeit bestehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum regnaret
  choice: Während er herrschte
  rationale: Gibt den temporalen Zusammenhang des lateinischen cum mit dem Imperfekt natürlich und eng am Ausgangstext wieder.
- source_word: non apparuit ... non appareret
  choice: war nicht mehr zu sehen ... nicht mehr zu sehen war
  rationale: Bewahrt die auffällige Wiederholung von apparere und vermeidet die stärker deutende Wiedergabe „verschwand“.
- source_word: sequens exsurrexit
  choice: Dann erhob sich der nächste
  rationale: „Der nächste“ erhält die Reihenfolge, während „erhob sich“ exsurrexit formal und im Bildzusammenhang angemessen wiedergibt.
- source_word: multum tenuit tempus
  choice: behauptete sich lange Zeit
  rationale: Die idiomatisch schwierige Wendung wird als langes Fortbestehen beziehungsweise langes Halten der Herrschaft wiedergegeben, ohne ein ausdrückliches Objekt wie „Macht“ einzufügen.
theological_decisions:
- issue: Geschlecht der Herrschergestalten
  choice: Maskuline Pronomen und „der nächste“
  alternative: Neutrale oder feminine Wiedergabe
  rationale: Die lateinischen Formen regnaret und non apparuit bestimmen kein Genus; sequens ist ebenfalls formal mehrdeutig. Im Zusammenhang einer Reihe von Herrschern ist das generische Maskulinum im Deutschen natürlich, ohne die Identität der Gestalten näher festzulegen.
- issue: Art des Endes der ersten Herrschaft
  choice: „kam sein Ende“ und „war nicht mehr zu sehen“
  alternative: „starb“ oder „verschwand“
  rationale: Der Text lässt offen, worin das Ende besteht. Die Übersetzung wahrt diese Spannung und legt weder Tod noch eine bestimmte übernatürliche Entrückung fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung „zu sehen“ ist bewusst beibehalten, da sie die Wiederholung des lateinischen apparere trägt. Der letzte Satz ist leicht idiomatisiert, um verständliches Deutsch zu bieten, ohne „Macht“ als im Lateinischen nicht ausdrücklich genanntes Objekt einzuführen.
