revisions:
- from: 'Und es geschah: Während er herrschte, kam sein Ende, und er war nicht mehr zu sehen, sodass auch sein Platz nicht mehr zu sehen war. Dann erhob sich der nächste, herrschte und behauptete sich lange Zeit.'
  to: 'Und es geschah: Während sie herrschte, kam ihr Ende, und sie war nicht mehr sichtbar, sodass auch ihr Platz nicht mehr sichtbar war. Dann erhob sich die Nächste, herrschte und blieb lange Zeit bestehen.'
  rationale: Die Revision korrigiert die grammatische Geschlechtsmarkierung des lateinischen ipsa und ersetzt die interpretierende Wendung „behauptete sich“ durch eine neutrale Aussage über langes Fortbestehen. Die ambige Art des Endes bleibt offen; die auffällige Wiederholung von apparere wird weiterhin abgebildet.
