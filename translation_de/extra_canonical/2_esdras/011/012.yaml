lexical_decisions:
- source_word: Et uidi et ecce
  choice: Und ich sah, und siehe
  rationale: Bewahrt die wiederholte visionäre Wahrnehmungsformel und den hervorgehobenen Neueinsatz des lateinischen Textes in würdiger, verständlicher Sprache.
- source_word: a dextera parte
  choice: auf der rechten Seite
  rationale: Gibt die räumliche Angabe unmittelbar wieder, ohne eine symbolische Bedeutung hinzuzufügen.
- source_word: surrexit
  choice: erhob sich
  rationale: Trifft das Aufsteigen beziehungsweise Hervortreten des Flügels im visionären Bild natürlicher als das hier missverständliche „stand auf“.
- source_word: una penna
  choice: ein Flügel
  rationale: Im Zusammenhang des Adlerbildes bezeichnet penna einen Flügel; una wird schlicht und ohne zusätzliche Betonung mit „ein“ wiedergegeben.
- source_word: regnauit super omnem terram
  choice: herrschte über die ganze Erde
  rationale: Bewahrt den königlichen Herrschaftssinn von regnare und den umfassenden Geltungsbereich von omnis terra.
