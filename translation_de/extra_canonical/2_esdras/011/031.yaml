  source_fidelity: '„verschlang“ gibt comedit im Adlerbild treffend wieder; „die beiden Unterflügel“ entspricht duas subalares angemessen, und die Relativklausel wahrt die bloße Absicht von cogitabant regnare. Der Satzansatz Hoc autem ist jedoch nicht mit „Damit aber“ wiedergegeben: hoc ist ein demonstratives Pronomen, nicht ein instrumentales „damit“.'
  naturalness: Der Hauptsatz ist idiomatisch. „Damit aber“ bleibt im Deutschen sowohl semantisch als auch syntaktisch unklar; „Dies aber …“ bildet den überlieferten, abgebrochenen Weiteransatz verständlich und knapp nach.
  terminology: „Unterflügel“ erhält die besondere Bildsprache der subalares ohne zusätzliche historische oder theologische Deutung. „zu herrschen beabsichtigten“ gibt cogitabant präzise als erwogene bzw. beabsichtigte Herrschaft wieder.
