  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hoc annuntio antequam incipias non parere. Nemo post te
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: de
  text: '„Das kündige ich dir an, bevor du zu verschwinden beginnst: Nach dir wird niemand es ebenso lange innehaben, nicht einmal halb so lange.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorgelegte lateinische Textausschnitt bricht nach „Nemo post te“ („Nach dir niemand“) ab. Der restliche Satz folgt der geprüften englischen Konsultationsfassung, die eine längere Textüberlieferung wiedergibt.
    reason: Kennzeichnet transparent, dass der bereitgestellte lateinische Ausgangstext nicht den gesamten Vers enthält.
lexical_decisions:
- source_word: hoc annuntio
  choice: Das kündige ich dir an
  rationale: Gibt die demonstrative Wendung und das feierliche Verb annuntio natürlich und unmittelbar wieder.
- source_word: antequam incipias non parere
  choice: bevor du zu verschwinden beginnst
  rationale: Bewahrt sowohl den Beginn des Vorgangs (incipias) als auch den Sinn von non parere, nicht mehr in Erscheinung zu treten.
- source_word: Nemo post te
  choice: Nach dir wird niemand
  rationale: Entspricht der lateinischen Wortfolge und bezeichnet den nachfolgenden Herrscher beziehungsweise Träger, ohne ihn näher auszudeuten.
- source_word: hold it for as long
  choice: es ebenso lange innehaben
  rationale: Das neutrale Pronomen bewahrt den unausgesprochenen Bezug des konsultierten Textes; innehaben drückt eine zeitweilige Herrschaft oder Stellung natürlicher aus als wörtliches halten.
theological_decisions:
- issue: Unausgesprochener Bezug von „es“
  choice: Das Pronomen „es“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Den Bezug ausdrücklich als Herrschaft, Macht oder Stellung benennen.
  rationale: Der vorgelegte Wortlaut bestimmt den Bezug nicht ausdrücklich. Eine Präzisierung würde die Auslegung stärker festlegen, als es die Quellenlage erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu verschwinden beginnst“ hält die ungewöhnliche lateinische Formulierung erkennbar fest; „innehaben“ passt zum Herrschaftskontext, ohne eine bestimmte politische oder theologische Deutung einzutragen.
