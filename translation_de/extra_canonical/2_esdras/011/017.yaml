  source_fidelity: „Das kündige ich dir an“ entspricht hoc annuntio angemessen. „Bevor du zu verschwinden beginnst“ gibt antequam incipias non parere idiomatisch wieder und bewahrt den aspektuellen Beginn. „Nach dir wird niemand“ entspricht dem erhaltenen Nemo post te. Der anschließende Gedanke zur Dauer ist im bereitgestellten lateinischen Ausschnitt nicht enthalten, wird aber durch die ausdrücklich gekennzeichnete Konsultationsfassung transparent ausgewiesen.
  naturalness: Der Text ist modernes, verständliches Standarddeutsch in einem passenden würdevollen Register. „Es ebenso lange innehaben“ ist im Herrschafts- bzw. Abfolgekontext gut verständlich; die bewusst nicht spezifizierte Bezugnahme wahrt die Vorlage.
  terminology: „Ankündigen“, „verschwinden“ und „innehaben“ sind terminologisch neutral und legen weder eine bestimmte politische Identifikation noch eine konfessionelle Auslegung fest. Die Formulierung erhält die offene Referenz des englischen Audit-Trails.
