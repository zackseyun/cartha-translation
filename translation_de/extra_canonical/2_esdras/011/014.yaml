lexical_decisions:
- source_word: ipsa
  choice: sie
  rationale: Das feminine Pronomen nimmt das im Zusammenhang bezeichnete feminine Herrschaftsgebilde auf; die Übersetzung bewahrt Genus und Rückbezug.
- source_word: multum ... tempus
  choice: lange Zeit
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Dauerangabe.
- source_word: tenuit
  choice: behauptete sich
  rationale: Das absolut gebrauchte tenere bezeichnet hier das Fortbestehen beziehungsweise die anhaltende Machtausübung; „behauptete sich“ gibt dies idiomatisch wieder, ohne ein nicht genanntes Objekt zu ergänzen.
- source_word: Et factum est
  choice: Und es geschah
  rationale: Bewahrt die erzählerische Übergangsformel des Lateinischen in würdigem, bibelnahem Deutsch.
- source_word: cum regnaret
  choice: als sie herrschte
  rationale: Gibt den temporalen Nebensatz und den andauernden Charakter des Imperfekt-Konjunktivs sachgerecht wieder.
theological_decisions:
- issue: Versgrenze und mögliche Doppelung des ersten Satzes
  choice: Die gesamte vom Nutzer vorgelegte lateinische Textzeile wird übersetzt.
  alternative: Mit „Und es geschah, als sie herrschte und“ beginnen, wenn ipsa multum tenuit tempus aufgrund einer korrigierten Versabgrenzung ausschließlich zu Vers 13 gerechnet wird.
  rationale: Die jüngsten Revisionsangaben widersprechen einander. Da der ausdrücklich angegebene Originalsprachentext beide Satzteile enthält, wird nichts stillschweigend ausgelassen; die Übersetzung bleibt quellennah.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bibelnaher Erzählformel. Der Satz endet bewusst offen bei „und“, weil auch der bereitgestellte lateinische Ausschnitt mit et abbricht.
