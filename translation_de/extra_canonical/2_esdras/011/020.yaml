  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: de
  text: 'Und ich sah[a], und siehe: Zu gegebener Zeit erhoben sich auch die nachfolgenden Flügel auf der rechten Seite, um die Herrschaft zu übernehmen. Unter ihnen waren einige, die sie innehatten, doch …'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich sah, und siehe: Die nachfolgenden Flügel erhoben sich auch auf der rechten Seite.“'
    reason: Die Satzgliederung und die Zuordnung der Zeitangabe sind in der Überlieferung bzw. bisherigen Wiedergabe unterschiedlich aufgefasst worden.
lexical_decisions:
- source_word: in tempore
  choice: zu gegebener Zeit
  rationale: Gibt den zeitlichen Sinn idiomatisch wieder, ohne eine genauere Bestimmung des Zeitpunkts in den Text hineinzulesen.
- source_word: sequentes pennae
  choice: die nachfolgenden Flügel
  rationale: Bewahrt die Bildsprache und bezeichnet die Flügel, die in der Abfolge als Nächste auftreten.
- source_word: erigebantur
  choice: richteten sich … auf
  rationale: Entspricht dem passivisch-reflexiven Vorgang des lateinischen Imperfekts und passt zur Bildsprache der Flügel.
- source_word: et ipsae
  choice: auch
  rationale: 'Bewahrt den einschließenden bzw. hervorhebenden Sinn: Diese Flügel richteten sich ebenfalls auf.'
- source_word: tenerent principatum
  choice: um die Herrschaft zu übernehmen
  rationale: Gibt Zweck und Herrschaftsausübung in natürlichem Deutsch wieder.
- source_word: quae tenebant
  choice: die sie innehatten
  rationale: Nimmt „die Herrschaft“ als Bezugswort auf und bewahrt den Wechsel von beabsichtigter zu tatsächlich ausgeübter Herrschaft.
theological_decisions:
- issue: Art und Umfang der Herrschaft
  choice: die Herrschaft
  alternative: die Oberherrschaft / die Regierungsgewalt
  rationale: „principatus“ bezeichnet hier im Visionsbild eine führende Herrschaftsstellung; die allgemeinere Wiedergabe vermeidet eine nicht ausdrücklich festgelegte politische oder theologische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die visionäre Formel „und siehe“ sowie der am Versende durch „doch …“ offenbleibende Satzanschluss wurden bewahrt.
