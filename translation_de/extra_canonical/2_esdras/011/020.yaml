review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des lateinischen Textes zutreffend wieder: die Wahrnehmungsformel, den zeitlichen Einsatz (in tempore), die nachfolgenden Flügel, den einschließenden Akzent von et ipsae („auch“), die rechte Seite, den Zweck des Herrschens sowie den Gegensatz zwischen beabsichtigter und tatsächlich ausgeübter Herrschaft. Der unvollendete Anschluss bei sed wird angemessen durch „doch …“ bewahrt.'
  naturalness: „richteten sich ... auf der rechten Seite auf“ enthält im Deutschen eine störende doppelte Verwendung von „auf“ und lässt die Ortsbestimmung unnötig schwer lesbar werden. „erhoben sich ... auf der rechten Seite“ ist idiomatisch, wahrt das bildhafte Verb erigebantur und kann dessen imperfektiven Verlauf in diesem Kontext ohne Bedeutungsverlust wiedergeben.
  terminology: „Flügel“, „Herrschaft“ und „innehatten“ sind sachgerecht und registerangemessen. Die Formulierung „zu gegebener Zeit“ ist als idiomatische Wiedergabe von in tempore vertretbar und legt keinen bestimmten Zeitpunkt fest.
