  text: superauerunt apud semetipsas cogitabant et ipsae regnare ; Et in eo cum cogitarent, ecce unum de quiescentium capitum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/028.yaml
  text: those that remained were planning among themselves to reign as well; and while they were planning this[a], behold, one of the resting heads,
translation:
  language: de
  text: Die Übrigen planten miteinander, auch selbst zu herrschen; und während sie dies planten, siehe, eines der ruhenden Häupter,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauerunt
  choice: die Übriggebliebenen
  rationale: Das substantivierte Partizip gibt die im Zusammenhang verbleibenden Adlerteile als handelndes Subjekt wieder; das grammatische Geschlecht des lateinischen Ausdrucks muss im Deutschen nicht nachgebildet werden.
- source_word: apud semetipsas cogitabant
  choice: überlegten untereinander
  rationale: Bewahrt sowohl den inneren Entschlussprozess als auch den gegenseitigen Bezug der Mehrzahl, ohne das Latein unnötig wörtlich nachzuahmen.
- source_word: et ipsae regnare
  choice: ebenfalls zu herrschen
  rationale: „ebenfalls“ gibt et ipsae im Sinne von „auch sie selbst“ natürlich wieder; „herrschen“ entspricht regnare.
- source_word: quiescentium capitum
  choice: den ruhenden Häuptern
  rationale: „ruhend“ wahrt die Bildsprache und legt nicht vorzeitig fest, dass das Haupt schlief oder bereits erwachte.
theological_decisions:
- issue: Unvollständiger Satz am Versende
  choice: Den Satz mit Komma offen lassen
  alternative: Material aus Vers 29 ergänzen und den Satz abschließen
  rationale: Der vorgelegte lateinische Vers endet nach „unum de quiescentium capitum“. Das offene Satzgefüge bewahrt die überlieferte Versgrenze und zieht keinen Text des folgenden Verses vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Häupter“ erhält den visionär-symbolischen Ton, während die Syntax gegenüber dem Latein maßvoll geglättet wird.
