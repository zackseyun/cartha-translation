revisions:
- from: Die Übriggebliebenen überlegten untereinander, ebenfalls zu herrschen. Während sie dies überlegten, siehe, da war eines von den ruhenden Häuptern,
  to: Die Übrigen planten miteinander, auch selbst zu herrschen; und während sie dies planten, siehe, eines der ruhenden Häupter,
  rationale: Die Revision entfernt die nicht im Vers enthaltene Ergänzung „da war“, gestaltet die Absichtsaussage idiomatischer und lässt die von der Quelle vorgegebene offene Konstruktion am Versende unverändert stehen. Eine Fußnote ist nicht erforderlich, da keine textkritische oder semantische Mehrdeutigkeit im deutschen Wortlaut erläutert werden muss.
