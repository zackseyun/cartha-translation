  source_fidelity: Der Entwurf gibt die beiden Satzteile grundsätzlich zutreffend wieder und wahrt die offene Versgrenze. „Da war“ fügt jedoch eine im lateinischen Text noch nicht vorhandene Prädikation ein; ecce leitet lediglich die noch unvollständige Ankündigung ein.
  naturalness: „Überlegten untereinander, ebenfalls zu herrschen“ ist verständlich, aber „planten miteinander, auch selbst zu herrschen“ ist im modernen Standarddeutsch idiomatischer. Das Satzfragment am Ende ist hier absichtlich und aufgrund der Versgrenze beizubehalten.
  terminology: „Häupter“ ist für capita im visionären Bildfeld angemessen. „Die Übrigen“ gibt superauerunt knapp und natürlich wieder, ohne über die im Kontext gemeinten verbleibenden Gestalten hinaus zu spezifizieren.
