revisions:
- from: Darum sollst du nie wieder erscheinen, du Adler – auch nicht deine schrecklichen Flügel, deine überaus bösen Schwungfedern, deine bösartigen Köpfe, deine boshaften Klauen und dein ganzer nichtiger Leib.
  to: Darum mögest du nie wieder erscheinen, Adler – weder du noch deine schrecklichen Flügel, deine überaus bösen Schwungfedern, deine bösen Köpfe, deine boshaften Klauen und dein ganzer nichtiger Leib.
  rationale: Die Revision glättet ausschließlich den Satzbau und die Registerwirkung. Der optative Gerichtswunsch bleibt erhalten; weder–noch bezieht die gesamte Aufzählung klar auf das Nicht-Erscheinen. Die Bildsprache, die Superlativwirkung und die im Audittext bezeugten abschließenden Aufzählungsglieder bleiben bewahrt.
