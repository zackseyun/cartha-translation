review_pass:
  verdict: revise
  source_fidelity: Die Anrede an den Adler, die emphatische Verneinung von apparere sowie die abwertende Aufzählung werden zutreffend wiedergegeben. „Nie wieder erscheinen“ gibt den nachdrücklichen Gerichtswunsch von non apparens non appareas idiomatisch wieder. Die über den vorliegenden lateinischen Ausschnitt hinausgehenden Glieder (Klauen, ganzer Leib) entsprechen dem englischen Audittext; der lateinische Ausschnitt ist nach et offenbar unvollständig.
  naturalness: Die Fassung ist insgesamt verständlich und würdig. Die Verbindung „du Adler – auch nicht deine …“ ist jedoch syntaktisch etwas holprig, weil die nachfolgenden Körperteile ohne klaren Anschluss an den Wunsch stehen. Eine weder–noch-Konstruktion stellt den gemeinsamen Verneinungsbereich natürlich und eindeutig her.
  terminology: „Adler“, „Flügel“, „Schwungfedern“ und „nichtiger Leib“ sind passend. Für maligna ist „böse Köpfe“ im anklagenden Bildzusammenhang unmittelbarer und weniger klinisch als „bösartige Köpfe“. Die superlativische Wertung von pessima bleibt mit „überaus bösen“ erhalten.
  issues:
  - severity: low
    issue: Unklarer syntaktischer Anschluss von „auch nicht“
    rationale: Nach „Darum sollst du nie wieder erscheinen, du Adler“ wirkt „auch nicht deine …“ elliptisch und weniger flüssig. „Weder du noch deine …“ bindet Adler und Körperteile eindeutig an denselben Gerichtswunsch.
  - severity: low
    issue: „bösartigen Köpfe“ klingt medizinisch bzw. dispositionell
    rationale: Maligna ist hier Teil einer moralisch abwertenden Bildsprache. „Böse Köpfe“ ist im modernen Deutschen unmittelbarer und wahrt die Wertung ohne zusätzliche Konnotation.
  revised_text: Darum mögest du nie wieder erscheinen, Adler – weder du noch deine schrecklichen Flügel, deine überaus bösen Schwungfedern, deine bösen Köpfe, deine boshaften Klauen und dein ganzer nichtiger Leib.
