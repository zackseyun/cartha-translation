  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: de
  text: Darum mögest du nie wieder erscheinen, Adler – weder du noch deine schrecklichen Flügel, deine überaus bösen Schwungfedern, deine bösen Köpfe, deine boshaften Klauen und dein ganzer nichtiger Leib.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non apparens non appareas
  choice: sollst du nie wieder erscheinen
  rationale: Die emphatische Wiederholung wird als nachdrücklicher Wunsch beziehungsweise Urteilsspruch wiedergegeben, nicht als Zweck- oder Folgesatz.
- source_word: aquila
  choice: Adler
  rationale: Direkte und im Bildzusammenhang natürliche Entsprechung.
- source_word: alae tuae horribiles
  choice: deine schrecklichen Flügel
  rationale: Bewahrt sowohl das Körperbild als auch die wertende Bedeutung von horribiles.
- source_word: pennacula tua pessima
  choice: deine überaus bösen Schwungfedern
  rationale: Schwungfedern unterscheidet pennacula verständlich von alae; überaus bösen gibt den verstärkenden Superlativ pessima wieder, ohne eine nicht gemeinte Größenangabe einzuführen.
- source_word: capita tua maligna
  choice: deine bösartigen Köpfe
  rationale: Maligna bezeichnet hier moralisch verderbte beziehungsweise schädliche Köpfe; bösartig erhält diese Wertung.
- source_word: omne corpus tuum vanum
  choice: dein ganzer nichtiger Leib
  rationale: Nichtig gibt vanum als wertlos und dem Untergang verfallen wieder; Leib passt zum Bild eines einzelnen Adlerkörpers.
theological_decisions:
- issue: Kraft und Funktion von non apparens non appareas
  choice: 'Nachdrücklicher Wunsch beziehungsweise Gerichtsspruch: „sollst du nie wieder erscheinen“'
  alternative: „Verschwinde völlig“
  rationale: Die semitisch geprägte Wiederholung verstärkt die Aussage. Die gewählte Form bleibt nahe am Verb erscheinen und vermeidet, aus der Wendung einen Zweck- oder Folgesatz zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt bildhaft und anklagend; „auch nicht“ bindet die Körperteile idiomatisch an die singularische Anrede des Adlers an. Der vorgelegte lateinische Ausschnitt bricht nach „et“ ab; die abschließenden Glieder werden entsprechend der auditierten Konsultationsschicht wiedergegeben.
