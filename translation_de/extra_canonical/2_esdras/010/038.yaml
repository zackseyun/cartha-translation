  source_fidelity: Die Wiedergabe folgt dem lateinischen Satzbau und Inhalt insgesamt genau. „was dir Angst macht“ verschiebt jedoch den Bezug von de quibus times („über das, was du fürchtest“) hin zu den Ursachen von Angst. Die unmittelbarere Formulierung bewahrt den Gegenstand der Furcht besser.
