  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixit: audi me, et doceam te et dicam tibi de quibus times, quoniam altissimus reuelauit tibi mysteria multa. Vidit enim'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: de
  text: 'Und er sagte: „Hör mir zu! Ich will dich unterweisen und dir sagen, was du fürchtest; denn der Höchste hat dir viele Geheimnisse offenbart.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: audi me
  choice: Hör mir zu!
  rationale: Gibt die direkte Aufforderung idiomatisch und würdig wieder.
- source_word: doceam te
  choice: Ich will dich unterweisen
  rationale: Bewahrt den lehrenden Sinn von docere in natürlichem, gehobenem Deutsch.
- source_word: de quibus times
  choice: was dir Angst macht
  rationale: Gibt den inhaltlichen Bezug der Furcht natürlich wieder, ohne den unklaren Gegenstand näher festzulegen.
- source_word: altissimus
  choice: der Höchste
  rationale: Entspricht dem etablierten Gottesprädikat und dem lateinischen Superlativ.
- source_word: mysteria multa
  choice: viele Geheimnisse
  rationale: Bewahrt sowohl die Mehrzahl als auch den Offenbarungscharakter von mysteria.
theological_decisions:
- issue: Art der offenbarten mysteria
  choice: Geheimnisse
  alternative: Mysterien
  rationale: „Geheimnisse“ ist im modernen Standarddeutsch verständlicher und legt keine bestimmte kultische oder konfessionelle Bedeutung nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das am Ende der Quellenzeile stehende „Vidit enim“ gehört syntaktisch offenbar zum folgenden Satz und wurde daher in diesem Vers nicht wiedergegeben.
