  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: de
  text: Denn er hat deinen rechten Weg[a] gesehen, weil du unablässig um dein Volk betrübt warst und tief um Zion trauertest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deinen geraden Weg.'
    reason: Die Alternative gibt „rectam uiam“ wörtlicher wieder, kann im Deutschen jedoch stärker räumlich verstanden werden; im Kontext ist vor allem moralische Rechtschaffenheit gemeint.
lexical_decisions:
- source_word: rectam uiam tuam
  choice: deinen rechten Weg
  rationale: Die Formulierung bewahrt das Wegbild des Lateinischen und bezeichnet im Zusammenhang zugleich einen moralisch rechtschaffenen Lebenswandel. „Rechter Weg“ ist im Deutschen natürlicher als „aufrichtiger Weg“ und weniger rein räumlich als „gerader Weg“.
- source_word: sine intermissione contristabaris
  choice: du unablässig … betrübt warst
  rationale: Gibt sowohl den fortdauernden Aspekt von contristabaris als auch sine intermissione wieder.
- source_word: ualde lugebas
  choice: du tief … getrauert hast
  rationale: „Tief getrauert“ drückt die Intensität von ualde idiomatisch und würdig aus.
