translation:
  language: de
  text: den ich mit Kummer gebar und unter Schmerzen zur Welt brachte; doch die Erde geht nach dem Weg der Erde dahin, die Menge, die jetzt auf ihr ist[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Satz ist hier stark verkürzt. Er kann auch so verstanden werden: „Doch nach dem Weg der Erde geht die Menge dahin, die jetzt auf ihr ist.“'
    reason: Bewahrt die echte syntaktische Mehrdeutigkeit hinsichtlich des Subjekts von „abiit“, ohne die alternative Lesart im Haupttext festzulegen.
lexical_decisions:
- source_word: cum meroribus
  choice: unter Kummer
  rationale: Gibt den begleitenden tiefen Schmerz bzw. die Trauer natürlich und würdevoll wieder, ohne ihn auf körperliche Schmerzen zu verengen.
- source_word: cum doloribus genui
  choice: unter Schmerzen zur Welt brachte
  rationale: Bewahrt den Geburtsbezug und unterscheidet doloribus von dem zuvor genannten Kummer.
- source_word: secundum uiam terrae
  choice: wie es der Lauf der Erde ist
  rationale: Überträgt die wörtliche Wendung ‚gemäß dem Weg der Erde‘ in verständliches modernes Deutsch und erhält den Gedanken eines der Erde eigenen, vergänglichen Verlaufs.
- source_word: abiit
  choice: geht dahin
  rationale: Das lateinische Perfekt kann hier den feststehenden bzw. allgemeinen Gang ausdrücken; ‚geht dahin‘ passt zur Aussage über Erde und gegenwärtige Menge und wahrt den Vergänglichkeitsklang.
- source_word: multitudo praesens
  choice: die Menge, die jetzt auf ihr ist
  rationale: Gibt praesens zeitlich und in ea räumlich wieder, ohne ‚Menge‘ unnötig als bestimmte Menschengruppe auszudeuten.
theological_decisions:
- issue: Bezug und Subjekt von „abiit“ in der gedrängten lateinischen Satzfügung
  choice: Die Erde geht dahin, und ebenso die gegenwärtig auf ihr befindliche Menge.
  alternative: Nur die Menge, die sich gegenwärtig auf der Erde befindet, ist das Subjekt von „abiit“.
  rationale: Die überlieferte Wortfolge ist syntaktisch gedrängt. Die gewählte Fassung folgt der naheliegenden Gliederung mit „Terra“ als ausdrücklichem Subjekt und versteht die Menge als parallel einbezogen; eine Fußnote hält die alternative syntaktische Zuordnung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, klagendem Ton. Die Wiederholung der Geburtsvorstellung bleibt erhalten; die ungewöhnlich gedrängte lateinische Syntax wird im Haupttext lesbar entfaltet, ohne ihre alternative Deutung zu verschweigen.
