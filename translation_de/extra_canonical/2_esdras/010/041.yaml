lexical_decisions:
- source_word: uidisti lugentem
  choice: du hast sie trauern sehen
  rationale: Gibt die Konstruktion mit dem als Objekt verstandenen Partizip natürlich und vollständig wieder; das feminine Bezugswort ergibt sich aus dem vorangehenden Vers.
- source_word: inchoasti consolare eam
  choice: und angefangen, sie zu trösten
  rationale: Bewahrt den Beginn der Handlung und gibt das ausdrücklich gesetzte feminine Objekt „eam“ wieder.
- source_word: Nunc autem iam
  choice: nun aber
  rationale: „Nun aber“ bildet den einleitenden Gegensatz idiomatisch ab; das verstärkende „iam“ ist im Deutschen hier in „nun“ mit enthalten.
