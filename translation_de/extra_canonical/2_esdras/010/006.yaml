  text: In anger at her, I said, “Most foolish of all women, do you not see our mourning and what has happened to us?
translation:
  language: de
  text: 'Zornig über sie sagte ich: »Du Törichteste aller Frauen, siehst du nicht unsere Trauer und was uns widerfahren ist?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iracundia ad eam
  choice: Zornig über sie
  rationale: Gibt die gegen die Frau gerichtete Zornesregung natürlich und knapp wieder; der deutsche Satz vermeidet die schwerfällige Formulierung „im Zorn gegen sie“.
- source_word: Stulta super omnes mulieres
  choice: Du törichtste aller Frauen
  rationale: Bewahrt den zugespitzten Superlativ und die direkte Anrede des lateinischen Textes.
- source_word: luctum nostrum
  choice: unsere Trauer
  rationale: Bezeichnet hier die gemeinsame Trauer angesichts des erlittenen Unglücks; „Trauer“ ist im heutigen Deutsch natürlicher als „Klage“.
- source_word: quae contigerunt nobis
  choice: was uns widerfahren ist
  rationale: Gibt das Geschehene in würdigem, verständlichem Deutsch wieder, ohne seine Art näher festzulegen.
