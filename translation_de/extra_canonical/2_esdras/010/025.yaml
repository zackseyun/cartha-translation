  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: de
  text: 'Und es geschah, während ich zu ihr sprach: Siehe, plötzlich strahlte ihr Gesicht überaus hell, und der Anblick ihres Gesichts wurde funkelnd, sodass sogar [ich mich sehr vor ihr fürchtete].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene lateinische Text bricht nach „sodass sogar“ ab. Die eingeklammerte Fortsetzung wird durch alte Tochterversionen gestützt; eine davon lautet sinngemäß: „sodass ich mich sehr fürchtete, mich ihr zu nähern“.'
    reason: textual_variant
lexical_decisions:
- source_word: Et factum est cum loquebar ad eam
  choice: Und während ich zu ihr sprach, geschah es
  rationale: Gibt die lateinische Ereignisformel und den gleichzeitigen Nebensatz eng, aber in natürlichem Deutsch wieder.
- source_word: ecce
  choice: Siehe
  rationale: Bewahrt den ausdrücklichen apokalyptischen Aufmerksamkeitsruf.
- source_word: fulgebat ualde subito
  choice: plötzlich strahlte … überaus hell
  rationale: Gibt subito, fulgebat und ualde jeweils erkennbar wieder; die deutsche Wortstellung bleibt idiomatisch.
- source_word: species coruscus fiebat uultus eius
  choice: das Aussehen ihres Gesichts begann zu leuchten
  rationale: Versteht species … vultus eius als eine zusammengehörige Wendung statt Gesicht und Aussehen zu zwei getrennten Subjekten zu machen. Das inkongruente coruscus des bereinigten lateinischen Textes bezeichnet den leuchtenden beziehungsweise aufblitzenden Eindruck; fiebat wird als einsetzende Veränderung wiedergegeben.
- source_word: ut etiam
  choice: sodass sogar
  rationale: Bewahrt den am Versende abbrechenden lateinischen Folgesatz sichtbar; die Ergänzung wird gekennzeichnet.
theological_decisions:
- issue: Ergänzung des im Lateinischen abgebrochenen Folgesatzes
  choice: '[ich große Angst vor ihr bekam]'
  alternative: Den Text nach „sodass sogar“ abbrechen lassen oder nach einer Tochterversion „ich mich sehr fürchtete, mich ihr zu nähern“ ergänzen.
  rationale: Der lateinische Leittext bricht nach ut etiam ab. Die eingeklammerte Ergänzung folgt der durch Tochterversionen bezeugten allgemeinen Aussage, dass Esra große Angst vor ihr bekam, ohne die spezifischere Variante über das Sich-Nähern in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ bleibt als markierter apokalyptischer Aufmerksamkeitsruf erhalten. Die Wiederholung von „Gesicht“ ist zugunsten der Quellennähe bewusst nicht vollständig geglättet; die unsichere Ergänzung ist durch eckige Klammern und eine Fußnote offengelegt.
