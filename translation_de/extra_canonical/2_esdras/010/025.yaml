  - severity: low
    issue: Intensität der ergänzten Reaktion
    rationale: Die Tochterversionen stützen ausdrücklich starke Furcht. „Ich mich sehr vor ihr fürchtete“ bringt dies direkter zum Ausdruck und bleibt gegenüber der näheren Annäherungsvariante zurückhaltend.
