id: 2ES.10.2
reference: 2 Esdras 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et evertimus omnes lumina, et surrexerunt omnes cives mei ad consolandam me, et quievi usque in alium diem usque noctem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: de
  text: Dann löschten wir alle die Lampen aus, und alle meine Mitbürger standen auf, um mich zu trösten. Und ich ruhte bis zum nächsten Tag, bis in die Nacht hinein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evertimus ... lumina
  choice: löschten ... die Lampen
  rationale: Im Zusammenhang bezeichnet die Wendung das Auslöschen der Lampen; »Lampen« gibt lumina hier natürlich und konkret wieder.
- source_word: omnes
  choice: wir alle
  rationale: Omnes ist maskuliner beziehungsweise femininer Nominativ Plural und bezieht sich daher auf das Subjekt, nicht auf das neutrale Akkusativobjekt lumina.
- source_word: cives mei
  choice: meine Mitbürger
  rationale: Die direkte Entsprechung bewahrt den gemeinschaftlich-städtischen Sinn von cives, ohne ihn zu verallgemeinern.
- source_word: ad consolandam me
  choice: um mich zu trösten
  rationale: Die finale Gerundivkonstruktion wird im Deutschen idiomatisch als Absichtssatz wiedergegeben.
- source_word: quievi
  choice: ich ruhte
  rationale: »Ruhte« bildet quievi genauer ab als bloßes Schweigen oder Stillsein und bleibt hinsichtlich Schlaf oder allgemeiner Ruhe offen.
- source_word: usque in alium diem usque noctem
  choice: bis zum nächsten Tag, bis zur Nacht
  rationale: Die auffällige doppelte Zeitangabe des lateinischen Textes bleibt erhalten, statt sie interpretierend zu glätten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die ungewöhnliche abschließende Zeitangabe werden quellennah bewahrt; zugleich sorgen zwei deutsche Hauptsätze für natürliche Lesbarkeit.
