review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Sinn im Wesentlichen. Die Stellung von »alle« in »wir alle« sollte jedoch eindeutig machen, dass lateinisch omnes das Subjekt bezeichnet. »Bis zur Nacht« bezeichnet eher den Zeitpunkt des Nachtbeginns, während usque noctem eine Erstreckung bis/in die Nacht ausdrückt.
  naturalness: Modernes, würdiges Deutsch. »Wir alle löschten die Lampen aus« ist eindeutiger und idiomatischer als »löschten wir alle die Lampen«. Die abschließende doppelte Zeitangabe bleibt bewusst auffällig, aber verständlich.
  terminology: »Lampen«, »Mitbürger« und »trösten« sind angemessene, quellennah-neutrale Wiedergaben. »Ruhten« bewahrt die Offenheit von quievi hinsichtlich Schlafen oder allgemeinem Ausruhen.
  issues:
  - severity: low
    issue: Stellung von »alle«
    rationale: In »Dann löschten wir alle die Lampen« kann »alle« im Deutschen leicht als Quantifizierung des Objekts verstanden werden. Der lateinische Nominativ Plural omnes bezieht sich hingegen auf das Subjekt.
  - severity: low
    issue: Wiedergabe von usque noctem
    rationale: »Bis zur Nacht« kann bedeuten, dass die Ruhe beim Einsetzen der Nacht endete. »Bis in die Nacht hinein« gibt die zeitliche Erstreckung von usque noctem genauer wieder, ohne die ungewöhnliche doppelte Zeitangabe aufzulösen.
  revised_text: Dann löschten wir alle die Lampen aus, und alle meine Mitbürger standen auf, um mich zu trösten. Und ich ruhte bis zum nächsten Tag, bis in die Nacht hinein.
  revised_footnotes: []
