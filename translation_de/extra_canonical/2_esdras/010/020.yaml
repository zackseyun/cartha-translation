source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: de
  text: Sag das nicht, sondern lass dich überzeugen – wie groß ist doch Zions Fall![a] – und lass dich wegen Jerusalems Schmerz trösten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die lateinische Wendung ist knapp und elliptisch; wörtlich etwa: »Was für ein Fall Zions!«'
    reason: Bewahrt die ungewöhnliche Form von quid enim casus Sion und macht kenntlich, dass die rhetorische Ausgestaltung im Haupttext eine notwendige syntaktische Deutung ist.
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: Rede nicht so
  rationale: Die lateinische Wendung bedeutet wörtlich etwa »Mach diese Rede nicht«; im heutigen Deutsch gibt »Rede nicht so« den gemeinten Sprechakt natürlich und prägnant wieder.
- source_word: consenti persuaderi
  choice: lass dich überzeugen
  rationale: Das passive persuaderi und die Aufforderung consenti werden idiomatisch wiedergegeben, ohne den Gedanken des Einwilligens in die Überzeugung unnötig schwerfällig auszudrücken.
- source_word: casus Sion
  choice: Zions Fall
  rationale: »Fall« bewahrt die Bildlichkeit und Bedeutungsbreite von casus besser als eine stärker deutende Wiedergabe wie »Unglück« oder »Untergang«.
- source_word: consolare propter dolorem Hierusalem
  choice: lass dich wegen Jerusalems Schmerz trösten
  rationale: Die Wiedergabe erhält sowohl den passivisch-reflexiven Aufforderungssinn als auch die auffällige kausale beziehungsweise bezügliche Verbindung durch propter, ohne die inhaltliche Spannung aufzulösen.
theological_decisions:
- issue: Beziehung zwischen Zions Fall, Jerusalems Schmerz und dem Trost
  choice: Die abrupte Klage über Zions Fall und die Aufforderung zum Trost bleiben nebeneinander stehen.
  alternative: Die Aussage als logisch geglättete Begründung oder als Trost »über« Jerusalems Leid formulieren.
  rationale: Der lateinische Text ist rhetorisch abgebrochen und inhaltlich spannungsvoll. Eine Glättung würde eine nicht ausdrücklich markierte Auslegung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche erhalten den abrupten Einschub des lateinischen Satzes; die Formulierung vermeidet konfessionell geprägte Zusätze.
