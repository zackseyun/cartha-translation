- from: Denn wenn du Gottes Urteil als gerecht anerkennst, wirst du deinen Sohn zur rechten Zeit wiederbekommen und unter den Frauen Anerkennung finden.
  to: Denn wenn du Gottes Bestimmung als gerecht anerkennst, wirst du deinen Sohn zu gegebener Zeit zurückerhalten und unter den Frauen gelobt werden.
