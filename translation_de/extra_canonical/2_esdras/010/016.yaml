source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: de
  text: Denn wenn du Gottes Bestimmung als gerecht anerkennst, wirst du deinen Sohn zu gegebener Zeit zurückerhalten und unter den Frauen gelobt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: als gerecht anerkennst
  rationale: Das lateinische Verb bedeutet hier, Gottes Entscheidung Recht zu geben beziehungsweise sie als gerecht anzuerkennen; die Formulierung vermeidet den missverständlichen Eindruck, der Mensch mache Gottes Urteil erst gerecht.
- source_word: terminum Dei
  choice: Gottes Urteil
  rationale: terminus bezeichnet in diesem Zusammenhang wahrscheinlich Gottes Festsetzung oder Entscheid. „Urteil“ gibt den Sinn natürlich und würdevoll wieder, ohne die Aussage unnötig einzuengen.
- source_word: recipies
  choice: wiederbekommen
  rationale: Das Verb bezeichnet das erneute Empfangen des verlorenen Sohnes und wird im Deutschen idiomatisch mit „wiederbekommen“ ausgedrückt.
- source_word: in tempore
  choice: zur rechten Zeit
  rationale: Die Wendung meint das Eintreten zum bestimmten oder angemessenen Zeitpunkt, nicht bloß allgemein „mit der Zeit“.
- source_word: in mulieribus conlaudaberis
  choice: unter den Frauen Anerkennung finden
  rationale: conlaudari bezeichnet Lob oder rühmende Anerkennung. Die gewählte Formulierung ist im modernen Deutsch natürlich und bewahrt den Vergleichs- beziehungsweise Gemeinschaftsrahmen von in mulieribus.
theological_decisions:
- issue: Gottes terminus als Dekret, Festsetzung oder Urteil
  choice: Gottes Urteil
  alternative: Gottes Beschluss
  rationale: Der Kontext fordert die Anerkennung von Gottes Gerechtigkeit. „Urteil“ hält diesen forensischen Akzent fest, ohne eine besondere Lehre über göttliche Dekrete einzutragen.
- issue: Art der Wiedererlangung des Sohnes
  choice: wirst du deinen Sohn zur rechten Zeit wiederbekommen
  alternative: wirst du deinen Sohn zu seiner Zeit aufnehmen
  rationale: Der Vers lässt die genaue Weise und den Zeitpunkt der Wiedervereinigung offen. Die Übersetzung bewahrt diese Offenheit und ergänzt weder Auferstehung noch unmittelbare Rückkehr ausdrücklich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Satzbau folgt der lateinischen Begründungs- und Verheißungsstruktur, während idiomatische deutsche Wendungen verwendet werden.
