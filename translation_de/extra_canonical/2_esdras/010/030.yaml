source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelus qui in principio uenerat ad me, et uidit me, Et ecce eram positus ut mortuus, et intellectus meus alienatus erat, et tenuit dexteram meam et confortauit me et statuit me super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: de
  text: Und siehe, ich lag da wie tot, und mein Verstand war mir entschwunden. Da ergriff er meine rechte Hand, stärkte mich und stellte mich auf die Füße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: positus ut mortuus
  choice: ich lag da wie tot
  rationale: Gibt den Zustand natürlich wieder und bewahrt den ausdrücklichen Vergleich »wie tot«.
- source_word: intellectus meus alienatus erat
  choice: mein Verstand war mir entschwunden
  rationale: Bewahrt das Bild eines zeitweilig entzogenen oder entrückten Bewusstseins, ohne es medizinisch oder theologisch enger festzulegen.
- source_word: tenuit dexteram meam
  choice: ergriff er meine rechte Hand
  rationale: Entspricht dem lateinischen Wortlaut und ergibt idiomatisches modernes Deutsch.
- source_word: confortauit me
  choice: stärkte mich
  rationale: Schlichte, quellennahe Wiedergabe der körperlich und innerlich möglichen Stärkung.
- source_word: statuit me super
  choice: stellte mich auf die Füße
  rationale: Der überlieferte lateinische Ausschnitt endet elliptisch bei »super«; der unmittelbare Sinn ist das Aufrichten. Die Formulierung folgt der plausiblen Ergänzung, die auch in der konsultierten englischen Fassung vorliegt.
theological_decisions:
- issue: Art des verlorenen Erkenntnisvermögens
  choice: mein Verstand war mir entschwunden
  alternative: mein Bewusstsein war mir genommen
  rationale: »intellectus« bezeichnet eher Verstand oder Erkenntnisvermögen als ausschließlich Bewusstsein; die gewählte Wendung hält den Zustand offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Wendung »Und siehe« bewahrt den visionären Erzählton. Das im Quellenausschnitt vorangestellte Satzfragment über den Engel gehört syntaktisch offenbar zum vorausgehenden Kontext; übersetzt wird entsprechend der Versabgrenzung der konsultierten Fassung ab »Et ecce«.
