  revision_rationale: Keine sichere Korrektur erforderlich. Die elliptische lateinische Überlieferung bei »statuit me super« wird im Kontext zutreffend als Aufrichten auf die Füße wiedergegeben; eine Fußnote ist dafür in dieser knappen Versübersetzung nicht nötig.
