  source_fidelity: 'Die Übersetzung gibt die Abfolge und Syntax des lateinischen Textes zuverlässig wieder: das gleichzeitige Sprechen, das hervorgehobene Auftreten des Engels, dessen früheres Kommen „am Anfang“ sowie dessen Sehen des Sprechers. Das Plusquamperfekt „gekommen war“ bildet venerat angemessen ab.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit passend zurückhaltender biblischer Färbung. „Siehe, da kam“ ist verständlich und bewahrt die markierende Funktion von et ecce. Die Wiederholung von „zu mir“ ist stilistisch vertretbar und quellennah.
  terminology: „Engel“ ist die sachgerechte und etablierte Wiedergabe von angelus. Es werden keine theologisch interpretierenden Zusätze eingeführt. „Am Anfang“ lässt den im lateinischen in principio nicht näher bestimmten Bezug offen.
