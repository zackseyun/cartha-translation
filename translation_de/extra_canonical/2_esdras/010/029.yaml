source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum essem loquens ego haec, et ecce venit ad me angelus qui in principio venerat ad me et vidit me,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: de
  text: Und während ich dies sagte, siehe, da kam der Engel zu mir, der am Anfang zu mir gekommen war, und er sah mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  choice: Und während ich dies sagte
  rationale: Gibt die gleichzeitige Handlung des lateinischen cum mit Imperfekt natürlich wieder; das ausdrücklich gesetzte ego muss im Deutschen nicht eigens betont werden.
- source_word: et ecce
  choice: siehe, da
  rationale: Bewahrt das aufmerksamkeitslenkende ecce in würdigem, verständlichem Deutsch; „da“ führt zugleich das plötzliche Eintreten ein.
- source_word: qui in principio venerat ad me
  choice: der am Anfang zu mir gekommen war
  rationale: Das Plusquamperfekt „war gekommen“ wahrt die zeitliche Vorzeitigkeit von venerat; „am Anfang“ entspricht in principio, ohne den Bezug näher festzulegen.
- source_word: et vidit me
  choice: und er sah mich
  rationale: Formale Wiedergabe des schlichten lateinischen Ausdrucks; eine Deutung als „bemerkte“ oder „erblickte“ wird nicht erzwungen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Färbung durch „siehe“. Die Wiederholung „zu mir“ bleibt erhalten, da sie auch im lateinischen Text steht.
