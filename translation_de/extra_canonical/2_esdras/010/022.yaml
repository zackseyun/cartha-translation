source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
translation:
  language: de
  text: Unsere Harfe ist erniedrigt worden[a], unser Loblied ist verstummt, unser Jubel hat sich aufgelöst. Das Licht unseres Leuchters ist erloschen, die Lade unseres Bundes ist geplündert, unsere heiligen Dinge sind entweiht, und der Name, der über uns genannt worden ist, ist beinahe entweiht worden. Unsere Kinder haben Schmach erlitten, unsere Priester sind verbrannt worden, und unsere Leviten sind in Gefangenschaft geraten. Unsere Jungfrauen sind geschändet worden, unseren Frauen ist Gewalt angetan worden, unsere Gerechten sind verschleppt, unsere Kleinen ausgeliefert[b], unsere jungen Männer versklavt, und unsere Starken sind kraftlos geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unser Saiteninstrument ist erniedrigt worden.“'
    reason: Das lateinische psalterium bezeichnet ein Saiteninstrument; seine genaue moderne Entsprechung ist nicht sicher. Die ungewöhnliche Personifikation durch „erniedrigt“ bleibt erhalten.
  - marker: b
    text: 'Oder: „verraten“.'
    reason: Das lateinische proditi sunt kann sowohl „ausgeliefert/übergeben“ als auch „verraten“ bedeuten; der Zusammenhang entscheidet nicht eindeutig.
lexical_decisions:
- source_word: psalterium
  choice: Harfe
  rationale: Das lateinische Wort bezeichnet hier am ehesten ein Saiteninstrument. „Harfe“ ist im modernen Deutschen verständlich und bewahrt das konkrete Bild.
- source_word: humiliatum est
  choice: ist erniedrigt worden
  rationale: Die Wiedergabe erhält die ungewöhnliche Personifikation und das Bild des Herabgebrachtwerdens, statt es zu einem bloßen Verstummen umzudeuten.
- source_word: hymnus
  choice: Loblied
  rationale: „Loblied“ gibt den kultischen Charakter natürlicher wieder als das im heutigen Deutschen enger oder anders gebrauchte „Hymne“.
- source_word: sancta nostra
  choice: unsere Heiligtümer
  rationale: Der substantivierte Plural bezeichnet die heiligen Dinge oder heiligen Stätten des Volkes; „Heiligtümer“ ist knapp und lässt diesen Umfang offen.
- source_word: nomen quod nominatum est super nos
  choice: der Name, der über uns ausgerufen wurde
  rationale: Diese Formulierung bewahrt das biblische Bild, dass Gottes Name über einem Volk genannt oder ausgerufen wird, ohne die Beziehung erklärend aufzulösen.
- source_word: proditi sunt
  choice: ausgeliefert
  rationale: Im Zusammenhang von Eroberung und Gefangenschaft kann das Partizip die Übergabe an Feinde bezeichnen. Die ebenfalls mögliche Bedeutung „verraten“ bleibt in der Fußnote erhalten.
- source_word: servierunt
  choice: versklavt
  rationale: Das schlichte „dienten“ wäre im Deutschen zu neutral; im Kontext bezeichnet es erzwungenen Dienst beziehungsweise Knechtschaft.
- source_word: invalidi facti sunt
  choice: sind kraftlos geworden
  rationale: Dies gibt den Zustandswandel natürlich wieder und erhält den Gegensatz zu den zuvor „Starken“.
theological_decisions:
- issue: Der über dem Volk ausgerufene Name
  choice: Die semitisch-biblische Redeweise bleibt bildhaft stehen.
  alternative: „Der Name Gottes, den wir tragen“
  rationale: Der Text nennt Gott in diesem Satzteil nicht ausdrücklich. Eine erklärende Ausformulierung würde die Aussage vereindeutigen und zusätzliches Material einführen.
- issue: Art der Schändung der Jungfrauen
  choice: „geschändet“
  alternative: eine ausdrücklich sexuelle Formulierung
  rationale: Das lateinische coinquinatae bedeutet verunreinigt oder befleckt und kann im Kontext sexuelle Gewalt einschließen, legt deren genaue Form aber nicht ausdrücklich fest. Die Spannung zur folgenden Aussage über die Frauen bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rhythmischen Parallelismen. Die lange Klagefolge wurde zur besseren Lesbarkeit in mehrere Sätze gegliedert, ohne ihre Reihenfolge oder Steigerung zu verändern. Ungewöhnliche Quellbilder wie die erniedrigte Harfe und der über dem Volk ausgerufene Name bleiben erhalten.
