review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Klageabfolge, die Bildsprache und die meisten lateinischen Ausdrücke zuverlässig wieder. Korrekturbedarf besteht bei sancta nostra, das eher „heilige Dinge“ als räumlich bestimmte „Heiligtümer“ bezeichnet, bei nomen quod nominatum est super nos, das „über uns genannt“ und nicht speziell „ausgerufen“ meint, sowie bei profanatum, das mit „entweiht“ präziser als mit „geschändet“ wiederzugeben ist. Bei in captivitate abierunt vermeidet „in Gefangenschaft geraten“ den im Deutschen möglichen Eindruck eines freiwilligen Ziehens.
  naturalness: Die Parallelismen sind würdevoll und gut verständlich. „Der Name, der über uns genannt worden ist“ ist als bewusst biblische Formel natürlich genug und dem Ausgangstext näher. Die gegliederte Satzfolge bleibt gut lesbar.
  terminology: „Harfe“ ist als verständliche, vorsichtige Annäherung an psalterium vertretbar; die Fußnote muss die nicht sicher bestimmbare Instrumentenart klar erläutern. „Loblied“, „Lade unseres Bundes“, „Schmach“, „ausgeliefert“ und „versklavt“ sind angemessen. Für sancta ist „heilige Dinge“ vorzuziehen, damit weder Kultgegenstände noch Kultstätten ausgeschlossen werden.
  issues:
  - severity: medium
    issue: „Heiligtümer“ für sancta nostra
    rationale: Das Neutrum Plural sancta bezeichnet primär heilige Dinge beziehungsweise Heiligtümer im weiten Sinn. Das deutsche Wort „Heiligtümer“ lenkt stärker auf Orte oder Gebäude und verengt daher die Aussage.
  - severity: medium
    issue: „ausgerufen wurde“ für nominatum est super nos
    rationale: Nominare super bedeutet in dieser biblischen Formel, dass ein Name über jemandem genannt wird. „Ausrufen“ fügt ein Verkündigungsereignis hinzu, das im lateinischen Text nicht ausdrücklich vorliegt.
  - severity: medium
    issue: „geschändet“ für profanatum est
    rationale: Der Name wird im Ausgangstext als profaniert beziehungsweise entweiht beschrieben. Da „geschändet“ bereits für coinquinatae bei den Jungfrauen verwendet wird, verwischt die Wiederholung zudem die unterschiedliche Wortwahl des Textes.
  - severity: low
    issue: „sind in die Gefangenschaft gezogen“ für in captivitate abierunt
    rationale: Die Formulierung kann im modernen Deutsch ein eigenes, aktives Gehen nahelegen. „Sind in Gefangenschaft geraten“ bewahrt die knappe Aussage ohne diesen Beiklang.
