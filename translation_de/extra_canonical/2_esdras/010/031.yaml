    rationale: Die lateinische Wiederholung ist rhetorisch auffällig und kann ohne unnatürliches Deutsch mit derselben deutschen Wortfamilie wiedergegeben werden.
  - severity: low
    issue: „so“ fügt in beiden Fragen eine im Lateinischen nicht ausdrücklich vorhandene Intensivierung hinzu.
    rationale: Die Intensität liegt bereits in den Fragen und im Verb; die Auslassung ist näher am Ausgangstext.
