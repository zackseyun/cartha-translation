  source_fidelity: Die drei Fragen und die beiden koordinierten inneren Größen sind zutreffend wiedergegeben. Die Wiederholung von conturbare sollte jedoch auch im Deutschen möglichst erkennbar bleiben. Das einleitende „pedes meos“ ist in der bereitgestellten lateinischen Verszeile syntaktisch ein Rest des vorherigen Zusammenhangs; die englische Audit-Fassung behandelt die Zeile ebenfalls ab „and said to me“.
  naturalness: „Was ist mit dir?“ ist natürliches modernes Deutsch. „Aufgewühlt“ und das hinzugefügte „so“ sind zwar verständlich, verstärken und emotionalisieren aber die Aussage gegenüber dem Lateinischen. Eine einheitliche Wiedergabe mit „verwirrt“ ist klar, idiomatisch und enger am Wortlaut.
  terminology: „Verstand“ für intellectus und „Empfinden deines Herzens“ für sensus cordis tui sind angemessen. Die Formulierung wahrt die Unterscheidung beider Ausdrücke, ohne ihr Verhältnis dogmatisch festzulegen.
