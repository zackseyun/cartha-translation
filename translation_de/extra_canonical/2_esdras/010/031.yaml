source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: de
  text: 'und sagte zu mir: »Was ist mit dir, und warum bist du verwirrt? Warum sind dein Verstand und das Empfinden deines Herzens verwirrt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris / conturbatus est
  choice: bist du so aufgewühlt / sind … so verwirrt
  rationale: Das wiederholte lateinische Verb bezeichnet innere Unruhe oder Verwirrung. Im Deutschen erfordern Person und innere Fähigkeiten unterschiedliche, natürlich klingende Wiedergaben.
- source_word: intellectus tuus
  choice: dein Verstand
  rationale: Gibt die Fähigkeit des Begreifens in allgemein verständlichem, modernem Deutsch wieder.
- source_word: sensus cordis tui
  choice: das Empfinden deines Herzens
  rationale: Bewahrt die Verbindung von innerer Wahrnehmung und Herz, ohne sie auf bloßes Gefühl oder Denken einzuengen.
- source_word: Quid tibi est
  choice: Was ist mit dir
  rationale: Natürliche deutsche Entsprechung der Frage nach dem Zustand der angesprochenen Person.
theological_decisions:
- issue: Verhältnis von Verstand und Empfinden des Herzens
  choice: Als zwei koordinierte innere Größen wiedergegeben
  alternative: Als ein einziger zusammengesetzter Ausdruck oder als erläuternde Wiederholung verstehen
  rationale: Das lateinische „intellectus tuus et sensus cordis tui“ nennt beide ausdrücklich und lässt ihr genaues Verhältnis offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und die dreifache Frage bleiben erhalten; die Wiederholung von „conturbare“ wird idiomatisch variiert. Das am Ende der Quellenzeile stehende „et“ gehört offenbar zum Anschluss des folgenden Verses und wird hier nicht wiedergegeben.
