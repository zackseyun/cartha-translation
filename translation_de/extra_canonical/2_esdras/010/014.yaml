  source_fidelity: 'Die Übersetzung bildet die lateinische Satzstruktur und Aussage zuverlässig ab: „cum dolore peperisti“ ist als „unter Schmerzen geboren hast“ treffend wiedergegeben; „terra dedit fructum suum hominem“ bewahrt das Bild von der Erde, deren Frucht der Mensch ist; „ab initio“ bleibt zutreffend unbestimmt als „von Anfang an“; und der Dativ „ei qui fecit eam“ wird als Empfängerbeziehung („dem … gegeben“) erhalten. Die ungewöhnliche Aussage wird nicht harmonisierend umgedeutet.'
