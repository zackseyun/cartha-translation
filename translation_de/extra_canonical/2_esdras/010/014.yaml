  terminology: „Erde“, „Frucht“, „Mensch“ und „geschaffen“ sind sachgerecht. Die feminine Rückverweisung in „der sie geschaffen hat“ bezieht sich eindeutig auf die Erde und entspricht dem lateinischen „eam“.
