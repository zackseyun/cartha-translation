source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: de
  text: und der Höchste wird dir jene Traumgesichte über das zeigen, was der Höchste in den letzten Tagen für die Bewohner der Erde bewirken wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… über das, was der Höchste in den letzten Tagen an denen tun wird, die auf der Erde wohnen.“'
    reason: Die Verbindung von quae faciet mit dem Dativ his qui habitant super terram kann, je nach zugrunde gelegter Konstruktion, entweder das den Erdbewohnern zugedachte Geschehen oder Handlungen an ihnen bezeichnen.
lexical_decisions:
- source_word: altissimus
  choice: der Höchste
  rationale: Die traditionelle und zugleich allgemein verständliche Gottesbezeichnung gibt den lateinischen Superlativ würdig wieder; die Wiederholung des Ausgangstextes bleibt erhalten.
- source_word: uisiones somniorum
  choice: Traumgesichte
  rationale: Die kompakte deutsche Wiedergabe bezeichnet Offenbarungsvisionen im Traum und bewahrt den apokalyptischen Ton.
- source_word: in nouissimis diebus
  choice: in den letzten Tagen
  rationale: Entspricht der geläufigen eschatologischen Bedeutung und bleibt nah am lateinischen Wortlaut.
- source_word: his qui habitant super terram
  choice: für die Bewohner der Erde
  rationale: Gibt den substantivierten Relativsatz natürlich wieder; „für“ folgt der naheliegenden dativischen Lesart, während die mögliche Bedeutung „an ihnen“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezug von „quae“ und Bedeutung von „faciet ... his“
  choice: „die erkennen lassen, was ... für die Bewohner der Erde tun wird“
  alternative: „von dem, was ... an denen tun wird, die auf der Erde wohnen“
  rationale: Die Formulierung vermeidet die missverständliche Vorstellung, Gott ‚tue‘ Traumgesichte. Zugleich wird die Dativkonstruktion nicht ohne Hinweis auf eine ausschließlich wohltätige oder ausschließlich gerichtliche Handlung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Traumgesichte“ bewahrt den biblisch-apokalyptischen Klang, bleibt aber verständlich. Die syntaktische Entfaltung mit „die erkennen lassen“ macht den wahrscheinlichen Sinn der schwierigen lateinischen Relativkonstruktion deutlich, ohne ihre Mehrdeutigkeit zu verdecken.
