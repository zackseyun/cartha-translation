base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: de
  text: 'Und was sie dir sagte: »Unter Mühen habe ich ihn großgezogen« – das war die Zeit, als Jerusalem bewohnt war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nutrivi eum
  choice: habe ich ihn großgezogen
  rationale: „Nutrire“ bezeichnet hier im Zusammenhang mit dem Sohn nicht nur Ernährung, sondern seine fürsorgliche Aufzucht.
- source_word: cum labore
  choice: unter Mühen
  rationale: Gibt die mit der Aufzucht verbundene Anstrengung natürlich und würdig wieder.
- source_word: habitatio Hierusalem
  choice: dass Jerusalem bewohnt war
  rationale: „Habitatio“ meint hier den Zustand beziehungsweise die Zeit des Bewohntseins, nicht ein Wohngebäude Jerusalems. Die verbale Fassung verhindert dieses Missverständnis.
- source_word: haec erat
  choice: das stand dafür
  rationale: Der Kontext deutet die Worte der Frau als Sinnbild für die Geschichte Jerusalems; „stand dafür“ macht diese Zuordnung im Deutschen verständlich, ohne ihren Inhalt weiter auszudeuten.
theological_decisions:
- issue: Allegorische Zuordnung der mühevollen Aufzucht
  choice: Die Aussage der Frau steht dafür, dass Jerusalem bewohnt war.
  alternative: „Dies war die Wohnung Jerusalems“ beziehungsweise „dies war das Wohnen Jerusalems“.
  rationale: Die gewählte Fassung bewahrt die im Text vorgenommene symbolische Zuordnung und vermeidet zugleich, „habitatio“ als Gebäude oder Wohnstätte misszuverstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt und der Gedankenstrich gliedern die angeführte Rede und ihre allegorische Deutung klar; die etwas abstrakte lateinische Nominalform wird zugunsten natürlicher Verständlichkeit verbal wiedergegeben.
