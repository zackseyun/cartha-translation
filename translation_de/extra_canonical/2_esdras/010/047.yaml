  source_fidelity: 'Die Wiedergabe von „nutrivi eum cum labore“ als „habe ich ihn unter Mühen großgezogen“ trifft den Sinn gut. „Habitatio Hierusalem“ bezeichnet jedoch das Bewohntsein bzw. die Zeit des Bewohntseins Jerusalems. Die Formulierung „das stand dafür“ fügt eine Deutungssprache hinzu, wo das Latein direkt identifiziert: „haec erat“ = „das war“.'
