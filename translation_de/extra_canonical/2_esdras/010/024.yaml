id: 2ES.10.24
reference: 2 Esdras 10:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: de
  text: Darum schüttle deine große Traurigkeit ab und lege die Fülle deiner Schmerzen von dir, damit der Mächtige dir wieder gnädig sei und der Höchste dir Ruhe schenke, Erholung von deinen Mühen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: schüttle ... ab
  rationale: Gibt das konkrete und eindringliche Bild des lateinischen Verbs natürlich wieder.
- source_word: multitudinem dolorum
  choice: die Fülle deiner Schmerzen
  rationale: Bewahrt die Vorstellung einer großen Menge, ohne im Deutschen schwerfällig zu klingen.
- source_word: repropitietur
  choice: wieder gnädig sei
  rationale: Das Präfix re- wird mit »wieder« wiedergegeben; »gnädig sein« trifft den religiösen Sinn von propitiari, ohne eine bestimmte Sühnetheorie einzutragen.
- source_word: fortis
  choice: der Mächtige
  rationale: Als substantiviertes Gottesprädikat verstanden; »der Mächtige« ist im Deutschen würdig und entspricht der Stärke- bzw. Machtbedeutung.
- source_word: requiem ... requietionem laborum
  choice: Ruhe ... Erholung von deinen Mühen
  rationale: Bewahrt die Wiederholung des Wortfeldes und versteht den zweiten Ausdruck als nähere Bestimmung der geschenkten Ruhe.
theological_decisions:
- issue: Bedingungs- bzw. Zweckzusammenhang zwischen dem Ablegen der Trauer und Gottes erneuter Gnade
  choice: »damit ... wieder gnädig sei«
  alternative: »sodass ... wieder gnädig wird«
  rationale: Der lateinische ut-Satz bleibt als Ziel bzw. erhoffte Folge offen, ohne einen mechanischen Verdienstzusammenhang zu behaupten.
- issue: Gottesbezeichnungen fortis und altissimus
  choice: »der Mächtige« und »der Höchste«
  alternative: »der Starke« und »der Allerhöchste«
  rationale: Die zwei unterschiedlichen Titel werden erhalten; die gewählten Formen sind geläufig, würdig und nicht konfessionell geprägt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Aufforderung und die beiden Gottesbezeichnungen bleiben erhalten; die abschließende Apposition verdeutlicht die Art der Ruhe, ohne die leichte Wiederholung des lateinischen Textes einzuebnen.
