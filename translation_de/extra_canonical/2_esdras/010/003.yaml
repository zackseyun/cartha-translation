id: 2ES.10.3
reference: 2 Esdras 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum omnes quievissent ut me consolarentur ut quiescerem, et surrexi nocte et fugi et veni, sicut vides, in hoc campo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/003.yaml
  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: de
  text: 'Und es geschah, als alle aufgehört hatten, mich zu trösten, damit ich zur Ruhe käme: Da stand ich in der Nacht auf, floh und kam, wie du siehst, auf dieses Feld.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: aufgehört hatten
  rationale: Im Zusammenhang bezeichnet das Verb das Aufhören der Trostversuche; diese natürliche deutsche Formulierung erhält den zeitlichen Sinn des lateinischen Konjunktiv Plusquamperfekt.
- source_word: ut me consolarentur
  choice: mich zu trösten
  rationale: Gibt Zweck beziehungsweise Tätigkeit der anderen direkt und idiomatisch wieder.
- source_word: ut quiescerem
  choice: damit ich zur Ruhe käme
  rationale: Bewahrt die finale Bedeutung und unterscheidet sie sprachlich vom vorausgehenden Aufhören; „zur Ruhe kommen“ kann sowohl körperliche Ruhe als auch innere Beruhigung umfassen.
- source_word: surrexi nocte
  choice: stand ich in der Nacht auf
  rationale: Entspricht dem erzählerischen Ablauf und gibt „nocte“ als Zeitpunkt wieder.
- source_word: in hoc campo
  choice: auf dieses Feld
  rationale: Im Deutschen ist bei einer gerichteten Bewegung „auf dieses Feld“ idiomatisch; „dieses“ erhält den deiktischen Bezug von „hoc“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der eröffnende biblische Erzählrhythmus „Und es geschah“ bleibt erhalten; der Doppelpunkt macht den langen lateinischen Satz im Deutschen gut verständlich.
