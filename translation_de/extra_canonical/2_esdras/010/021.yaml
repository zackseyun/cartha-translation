  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: de
  text: Denn du siehst, dass unser Heiligtum verwüstet, unser Altar niedergerissen und unser Tempel zerstört worden ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio
  choice: Heiligtum
  rationale: Obwohl das lateinische Wort wörtlich auch „Heiligung“ bedeuten kann, bezeichnet es hier parallel zu Altar und Tempel den geheiligten Ort beziehungsweise den Heiligtumsbereich.
- source_word: deserta effecta est
  choice: ist verwüstet
  rationale: Die Formulierung beschreibt, dass das Heiligtum öde beziehungsweise verlassen gemacht wurde; „verwüstet“ gibt das Ergebnis im natürlichen Deutschen knapp wieder.
- source_word: demolitum est
  choice: niedergerissen
  rationale: Das Verb bezeichnet den baulichen Abbruch oder das Einreißen des Altars und wird daher konkret wiedergegeben.
- source_word: destructum est
  choice: zerstört worden
  rationale: Die passive resultative Aussage über den Tempel wird direkt und in Abgrenzung zu „niedergerissen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Dreiklang „Heiligtum – Altar – Tempel“ sowie die parallele Satzstruktur des lateinischen Textes bleiben erhalten.
