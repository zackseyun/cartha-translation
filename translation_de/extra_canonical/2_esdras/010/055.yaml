  source_fidelity: 'Die Übersetzung gibt die Satzglieder des lateinischen Textes zuverlässig wieder: „Darum“ entspricht ergo, die doppelte Aufforderung gegen Furcht wahrt noli ... neque, „geh ... hinein“ gibt ingredere wieder, und „Glanz oder die Größe“ erhält die mit vel markierte, nicht weiter aufzulösende Alternative. „Soweit deine Augen es erfassen können“ vermittelt angemessen die Begrenzung des Sehens in quantum capax est tibi visu oculorum videre.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählregister. Die Formulierung „dein Herz erschrecke nicht“ ist leicht gehoben, aber idiomatisch und für den Kontext passend. „Geh vielmehr hinein“ stellt den Kontrast zu Furcht natürlich heraus.
  terminology: „Bauwerk“ ist eine präzise und kontextangemessene Wiedergabe von aedificium. „Glanz“ und „Größe“ sind treffende Entsprechungen für splendor und magnitudo. Es werden keine theologischen oder konfessionellen Deutungen hinzugefügt.
