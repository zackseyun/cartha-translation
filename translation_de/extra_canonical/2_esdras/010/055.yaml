id: 2ES.10.55
reference: 2 Esdras 10:55
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo noli timere neque expavescat cor tuum, sed ingredere et vide splendorem vel magnitudinem aedificii, quantum capax est tibi visu oculorum videre.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: de
  text: Darum fürchte dich nicht, und dein Herz erschrecke nicht. Geh vielmehr hinein und sieh den Glanz oder die Größe des Bauwerks, soweit deine Augen es erfassen können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expavescat cor tuum
  choice: dein Herz erschrecke nicht
  rationale: Bewahrt das Bild des Herzens und gibt den verstärkten Schrecken des lateinischen Verbs in natürlichem, würdigem Deutsch wieder.
- source_word: ingredere
  choice: geh hinein
  rationale: Gibt die räumliche Aufforderung unmittelbar und idiomatisch wieder.
- source_word: splendorem vel magnitudinem
  choice: den Glanz oder die Größe
  rationale: Bewahrt vel als „oder“ und löst die mögliche Alternative beziehungsweise erläuternde Beziehung zwischen den Begriffen nicht stillschweigend auf.
- source_word: aedificii
  choice: des Bauwerks
  rationale: „Bauwerk“ ist im Kontext eines eindrucksvollen Gebäudes natürlich und gibt aedificium präzise wieder.
- source_word: quantum capax est tibi visu oculorum videre
  choice: soweit deine Augen es erfassen können
  rationale: Gibt die umständliche lateinische Wendung verständlich wieder, ohne die Begrenztheit des menschlichen Sehens zu verlieren.
theological_decisions:
- issue: Beziehung zwischen „Glanz“ und „Größe“
  choice: „Glanz oder die Größe“
  alternative: „Glanz und Größe“ oder „Glanz, das heißt die Größe“
  rationale: Das lateinische vel bezeichnet hier formal eine Alternative oder mögliche Erläuterung. Die Übersetzung bewahrt diese Mehrdeutigkeit, statt beide Eigenschaften zusammenzuziehen oder vel eindeutig auszulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählton. Der parataktische Aufbau der Ermahnung bleibt erhalten; „vielmehr“ markiert den Gegensatz zwischen Furcht und Hineingehen natürlich.
