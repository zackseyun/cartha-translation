lexical_decisions:
- source_word: non faciam
  choice: Ich werde es nicht tun
  rationale: Gibt die knappe, entschiedene Verweigerung des lateinischen Futurs natürlich und genau wieder.
- source_word: neque ingrediar civitatem
  choice: und auch nicht in die Stadt gehen
  rationale: Bewahrt die koordinierte Verneinung; »in die Stadt gehen« ist im modernen Deutsch natürlicher als das formellere »die Stadt betreten«.
- source_word: sed hic moriar
  choice: sondern hier sterben
  rationale: Das adversative »sed« wird nach der vorausgehenden Verneinung idiomatisch mit »sondern« wiedergegeben; »hier« behält die örtliche Hervorhebung bei.
