revisions:
- from: 'Und siehe, die Frau war für mich nicht mehr zu sehen; stattdessen wurde eine Stadt erbaut, und ein Ort mit mächtigen Fundamenten wurde sichtbar. Da fürchtete ich mich, schrie laut und sagte:'
