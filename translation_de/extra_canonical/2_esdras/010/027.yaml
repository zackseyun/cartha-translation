base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: de
  text: 'Und siehe, die Frau erschien mir nicht mehr, doch eine Stadt wurde gebaut, und ein Ort mit großen Fundamenten wurde sichtbar. Da fürchtete ich mich, schrie mit lauter Stimme und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: siehe
  rationale: Bewahrt das präsentierende und überraschende Signal des lateinischen Textes in würdiger, bibelsprachlich vertrauter Form.
- source_word: non conparebat mihi
  choice: war für mich nicht mehr zu sehen
  rationale: Gibt das unvollständige Erscheinen beziehungsweise Wahrnehmbarsein idiomatisch wieder, ohne ein aktives Verschwinden hinzuzufügen.
- source_word: civitas aedificabatur
  choice: eine Stadt wurde erbaut
  rationale: Bewahrt das Passiv und den im Gang befindlichen visionären Vorgang; im Deutschen kann das Präteritum Passiv diesen Verlauf im Erzählzusammenhang tragen.
- source_word: locus demonstrabatur
  choice: ein Ort wurde sichtbar
  rationale: Gibt das passive Offenbarwerden im visionären Kontext natürlich wieder, ohne einen menschlichen Zeigenden einzuführen.
- source_word: de fundamentis magnis
  choice: mit mächtigen Fundamenten
  rationale: Versteht das spät- beziehungsweise übersetzungslateinische de mit Ablativ als Qualitätsbeschreibung. „Mächtig“ bezeichnet sowohl Größe als auch Eindruck und klingt natürlicher als „groß“ bei Fundamenten.
- source_word: clamavi voce magna
  choice: schrie laut
  rationale: Natürliches modernes Deutsch für die idiomatische Wendung, während Intensität und hörbarer Ausruf erhalten bleiben.
theological_decisions:
- issue: Beziehung von „de fundamentis magnis“ zu „locus“
  choice: 'Qualitätsbeschreibung: „ein Ort mit mächtigen Fundamenten“'
  alternative: 'Herkunfts- oder Ausgangsangabe: „ein Ort wurde von mächtigen Fundamenten her sichtbar“'
  rationale: Im spätlateinischen und übersetzungslateinischen Sprachgebrauch kann de + Ablativ eine Eigenschaft ausdrücken. Diese Deutung passt zudem sachlich zum Aufbau der visionären Stadt und vermeidet eine schwer verständliche räumliche Aussage.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge und die passiven Visionseindrücke des lateinischen Textes bleiben erhalten; „stattdessen“ macht den Gegensatz nach non … sed im Deutschen klar.
