id: 2ES.10.52
reference: 2 Esdras 10:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: de
  text: 'auf einem Feld, wo kein Haus gebaut ist. Denn ich wusste, dass der Höchste begann, dir dies zu zeigen.[a] Deshalb sagte ich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Begriff war, dir dies zu zeigen“.'
    reason: Die Verbindung von incipiebat mit dem Infinitiv kann neben dem einsetzenden Vorgang auch einen unmittelbar bevorstehenden Vorgang ausdrücken.
lexical_decisions:
- source_word: campo
  choice: auf einem Feld
  rationale: Der lateinische Ablativ setzt den aus dem vorherigen Zusammenhang stammenden Satz fort; die fragmentarische Versgrenze wird nicht künstlich geglättet.
- source_word: altissimus
  choice: der Höchste
  rationale: Die substantivierte Gottesbezeichnung wird in ihrer üblichen, würdevollen Form wiedergegeben.
- source_word: incipiebat ... ostendere
  choice: begann, ... zu zeigen
  rationale: Dies bildet den imperfektischen Beginn des Zeigens formal und natürlich ab, ohne die Handlung als bereits abgeschlossen darzustellen.
- source_word: haec
  choice: dies
  rationale: Das neutrale Demonstrativpronomen verweist zusammenfassend auf die betreffenden Dinge beziehungsweise Erscheinungen.
- source_word: Propterea dixi
  choice: 'Deshalb sagte ich:'
  rationale: Der kausale Anschluss wird direkt wiedergegeben; der Doppelpunkt zeigt an, dass die Rede im folgenden Vers weitergeht.
theological_decisions:
- issue: Zeitliche Bedeutung von incipiebat mit Infinitiv
  choice: begann, dir dies zu zeigen
  alternative: im Begriff war, dir dies zu zeigen
  rationale: Der lateinische Wortlaut bezeichnet zunächst ein beginnendes Geschehen. Da die Wendung im Übersetzungslatein auch prospektiv verstanden werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
- issue: Explizites ego
  choice: ich wusste
  alternative: ich selbst wusste
  rationale: Das deutsche Personalpronomen ist bereits erforderlich; eine Verstärkung durch „selbst“ würde einen stärkeren Gegensatz eintragen, als der Kontext sicher verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der am Versanfang stehende syntaktische Anschluss an den vorherigen Satz bleibt als Fragment erhalten, weil auch die lateinische Vorlage hier mitten in der Konstruktion einsetzt.
