lexical_decisions:
- source_word: Nocte autem quae in crastinum futura est
  choice: Doch morgen Nacht
  rationale: Die lateinische Umschreibung bezeichnet natürlich die kommende Nacht des nächsten Tages. »Morgen Nacht« gibt den zeitlichen Sinn in heutigem Deutsch knapp und idiomatisch wieder; »doch« entspricht autem im fortlaufenden Zusammenhang.
- source_word: hic manebis
  choice: sollst du hierbleiben
  rationale: Manebis ist formal Futur (»du wirst bleiben«), kann im Kontext aber eine Anweisung bzw. Festlegung ausdrücken. »Sollst du hierbleiben« folgt der Aussagefunktion und der konsultierten englischen Fassung.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der vorgelegte lateinische Ausschnitt bricht nach »in crastinum« ab; die im konsultierten Text vorausgesetzte Fortsetzung »futura est hic manebis« wurde transparent berücksichtigt.
