  text: This woman whom you saw is Zion[a], whom you now see
translation:
  language: de
  text: Diese Frau, die du gesehen hast, ist Zion, die du jetzt siehst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec mulier
  choice: Diese Frau
  rationale: Direkte und natürliche Wiedergabe der demonstrativen Nominalgruppe.
- source_word: quam uidisti
  choice: die du gesehen hast
  rationale: Das Perfekt gibt das vorausgegangene Sehen der Frau wieder.
- source_word: haec est Sion
  choice: ist Zion
  rationale: Das wiederholte lateinische Demonstrativpronomen wird im Deutschen nicht eigens wiederholt, da die Identifikation so natürlicher klingt und vollständig erhalten bleibt.
- source_word: quam nunc conspicis
  choice: die du jetzt vor dir siehst
  rationale: conspicere bezeichnet hier das gegenwärtige, deutliche Erblicken Zions; „vor dir siehst“ macht den Kontrast zum früheren Sehen verständlich, ohne zusätzliche Deutung einzuführen.
theological_decisions:
- issue: Identifikation der Frau mit Zion
  choice: Die Frau wird unmittelbar als Zion bezeichnet.
  alternative: Die Frau lediglich als Sinnbild oder Vertreterin Zions bezeichnen.
  rationale: Der lateinische Text formuliert eine direkte Identifikation („haec est Sion“); eine Abschwächung zu „steht für“ wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Seh-Aussage des Lateinischen bleibt erhalten, während die demonstrative Wiederholung idiomatisch geglättet wird.
