  source_fidelity: 'Die feminine Form von »resignata est« und »tradita est« bezieht sich eindeutig auf Sion. »in manibus eorum« ist treffend als Übergabe in die Gewalt der Hassenden wiedergegeben. »signaculum Sion« bleibt im Lateinischen schwierig und sollte nicht ausdeutend paraphrasiert werden. Die Wendung »ihrer Herrlichkeit entsiegelt« ist jedoch im Deutschen semantisch und idiomatisch nicht tragfähig: »entsiegeln« verlangt gewöhnlich ein Siegel bzw. einen Verschluss als Objekt und kann nicht natürlich eine Trennung von Herrlichkeit ausdrücken. Der Kontext und »de gloria sua« rechtfertigen die klare, natürliche Wiedergabe als Beraubung der Herrlichkeit, ohne die unsichere Bedeutung von »signaculum« festzulegen.'
