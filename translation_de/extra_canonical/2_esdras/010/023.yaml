source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc et tradita est in manibus eorum qui nos oderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: de
  text: 'Und was das Größte von allem ist: das Siegel Zions[a] – denn nun ist sie ihrer Herrlichkeit beraubt und in die Hände derer ausgeliefert worden, die uns hassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck »das Siegel Zions« ist schwer zu deuten. Gemeint sein könnten Zions unverwechselbare Herrlichkeit, ihr beglaubigter Status oder ein sinnbildliches Ehrenzeichen. Das lateinische Bild wird daher beibehalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: signaculum Sion
  choice: das Siegel Zions
  rationale: Bewahrt das schwierige und bildhafte lateinische »signaculum«, ohne seine mögliche Bedeutung als Kennzeichen, Beglaubigung oder Ehrenzeichen vorschnell festzulegen.
- source_word: resignata est de gloria sua
  choice: sie ist ihrer Herrlichkeit entsiegelt
  rationale: Gibt die feminine Verbform mit Bezug auf Zion wieder und erhält zugleich die Wortbildbeziehung zwischen »signaculum« und »resignata«. Die ungewöhnliche Formulierung spiegelt die Schwierigkeit des Lateins.
- source_word: tradita est in manibus eorum
  choice: in die Hände derer ausgeliefert worden
  rationale: Natürliche deutsche Wiedergabe der Übergabe in feindliche Gewalt; »ausgeliefert« bringt den bedrohlichen Zusammenhang zum Ausdruck.
theological_decisions:
- issue: Bedeutung des Siegels Zions
  choice: Die Siegelmetaphorik wird im Haupttext beibehalten.
  alternative: Zions besondere Herrlichkeit, beglaubigter Status oder Ehrenzeichen
  rationale: Der lateinische Ausdruck ist mehrdeutig; eine ausdeutende Paraphrase würde eine mögliche theologische oder symbolische Bedeutung festschreiben.
- issue: Bezugswort der femininen Prädikate
  choice: »sie« bezieht sich auf Zion.
  alternative: Bezug auf das neutrale »Siegel«
  rationale: »resignata est« und »tradita est« stehen feminin Singular und beziehen sich grammatisch auf Sion, nicht auf signaculum.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst ungewöhnliche Wendung »ihrer Herrlichkeit entsiegelt« bewahrt sowohl die Mehrdeutigkeit als auch das Siegel-Wortspiel des lateinischen Textes.
