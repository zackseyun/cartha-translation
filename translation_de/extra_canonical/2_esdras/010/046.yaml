  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: de
  text: 'Drei Dinge: Salomo baute die Stadt und brachte Opfer dar; damals war es, als die Unfruchtbare einen Sohn gebar. Und das, was sie dir sagte: dass'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tres
  choice: Drei Dinge
  rationale: Gibt die überlieferte Lesart wörtlich wieder, obwohl der Satz inhaltlich schwierig bleibt; eine zeitliche Deutung wird nicht in den Text hineingetragen.
- source_word: aedificauit Salomon ciuitatem
  choice: baute Salomo in der Stadt
  rationale: Folgt der durch die englische Prüfschicht bezeugten syntaktischen Auffassung; das Latein selbst könnte formal auch »baute Salomo die Stadt« bedeuten, ergäbe dann aber mit »Drei Dinge« eine noch härtere Konstruktion.
- source_word: obtulit oblationes
  choice: brachte Opfer dar
  rationale: Natürliches und würdiges Deutsch für die etymologische Wiederholung des Lateinischen.
- source_word: sterilis
  choice: die unfruchtbare Frau
  rationale: Das substantivierte feminine Adjektiv bezeichnet eine kinderlose beziehungsweise unfruchtbare Frau.
- source_word: peperit
  choice: gebar
  rationale: Bewahrt den konkreten Geburtsvorgang und den gehobenen biblischen Ton.
- source_word: Et quod tibi dixit quoniam
  choice: Und was sie dir sagte, nämlich dass
  rationale: Bewahrt den unvollständigen Übergang zum folgenden Vers; das feminine Subjekt wird aus dem unmittelbaren Kontext aufgenommen.
theological_decisions:
- issue: Schwierige Eröffnungslesart
  choice: »Drei Dinge« wird beibehalten.
  alternative: Eine zeitliche Aussage wie »nach dreitausend Jahren« oder eine emendierte Lesart.
  rationale: Die vorgelegte lateinische Quelle liest eindeutig tres; eine spekulative Korrektur würde die echte Textschwierigkeit verdecken.
- issue: Bezug der unfruchtbaren Frau
  choice: Keine ausdrückliche Identifizierung oder allegorische Deutung.
  alternative: Die Frau ausdrücklich mit Zion, Jerusalem oder einer bestimmten biblischen Gestalt gleichsetzen.
  rationale: Der Vers selbst nennt diese Identifizierung nicht; die Spannung wird für den Zusammenhang offengehalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die syntaktische Härte am Versanfang und der am Ende abbrechende Nebensatz werden bewusst nicht geglättet, da sie zur überlieferten Form beziehungsweise zum versübergreifenden Zusammenhang gehören.
