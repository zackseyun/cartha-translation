  source_fidelity: 'Die Grundentsprechungen sind sachgerecht: annis triginta wird als „dreißig Jahre“, saeculo als „in der Welt“ und oblatio oblata kultisch als „Opfergabe dargebracht“ wiedergegeben. Die im lateinischen Text schwierige und offenbar komprimierte Zeitangabe wird entsprechend der englischen Audit-Trail-Entscheidung mit „dreitausend Jahre“ übersetzt und transparent annotiert. Das Pronomen in ea bleibt im Deutschen bewusst als „ihr“ stehen und legt den Bildbezug nicht ausdrücklich fest.'
  naturalness: Die Konstruktion „Und dass sie dir sagte ... bedeutet:“ ist im modernen Deutsch unnötig schwerfällig. „Dass sie dir sagte ..., bedeutet“ ist eine natürliche, präzise Satzführung. Die Stellung von „in ihr“ vor dem Relativsatz vermeidet zudem, dass das Pronomen durch die nähere Bezugsgröße „Welt“ vorschnell auf diese festgelegt wird.
  terminology: „Unfruchtbar“, „Welt“ und „Opfergabe“ passen zu einem würdevollen modernen Bibelregister. Die Alternativangabe „im Zeitalter“ ist als Hinweis auf den möglichen Sinn von saeculum angemessen.
