  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: de
  text: 'Dass sie dir sagte, sie sei dreißig Jahre lang unfruchtbar gewesen, bedeutet: Dreitausend Jahre waren in der Welt[a], als in ihr noch keine Opfergabe dargebracht worden war.[45]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Zeitalter“.'
    reason: previous_rendering
  - marker: '45'
    text: Der lateinische Wortlaut hinter „dreitausend Jahre“ ist knapp und schwierig. Die Wiedergabe folgt der symbolischen Zeitrechnung des Kapitels, in der die dreißig Jahre der Frau einer viel längeren Epoche entsprechen, bevor in Zion Opfergaben dargebracht wurden.
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: in der Welt
  rationale: Hier bezeichnet saeculum den zeitlichen Verlauf der Weltgeschichte; „in der Welt“ gibt diesen historischen Sinn natürlicher wieder als „im Zeitalter“.
- source_word: oblatio oblata
  choice: eine Opfergabe dargebracht
  rationale: Die deutsche Wortwahl bewahrt sowohl den kultischen Sinn von oblatio als auch die figura etymologica des lateinischen Ausdrucks, soweit dies idiomatisch möglich ist.
- source_word: in ea
  choice: in ihr
  rationale: Das feminine Pronomen bleibt bewusst mehrdeutig und verweist im Bildzusammenhang auf die Frau beziehungsweise die durch sie dargestellte Stadt Zion.
theological_decisions:
- issue: Symbolische Entsprechung zwischen den dreißig Jahren der Frau und der Weltchronologie
  choice: „dreitausend Jahre“ im Haupttext
  alternative: 'Wörtlich nach dem erhaltenen lateinischen Wortlaut: „drei Jahre“'
  rationale: Der knappe lateinische Wortlaut ist schwierig, doch der Kapitelzusammenhang setzt die dreißig Jahre der Frau zu einer wesentlich längeren Epoche vor dem Opferkult in Zion in Beziehung. Die Auslegung wird durch eine textkritische Fußnote offengelegt, statt die Schwierigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unfruchtbar“ und „Opfergabe“ sind allgemein verständlich und zugleich dem biblischen Register angemessen; die genuine Unsicherheit der chronologischen Formulierung wird in der Fußnote transparent gemacht.
