base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
translation:
  language: de
  text: Darum sagte ich dir, auf das Feld[a] zu kommen, wo kein Fundament eines Gebäudes vorhanden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufs freie Land“.'
    reason: Das lateinische agrum kann neben einem konkreten Feld auch offenes Land bezeichnen; der Kontext spricht jedoch eher für den bestimmten Ort.
lexical_decisions:
- source_word: agrum
  choice: auf das Feld
  rationale: Das lateinische agrum bezeichnet hier das konkrete Feld beziehungsweise Grundstück, zu dem Esra kommen sollte. „Auf das Feld“ wahrt den örtlichen Bezug und klingt im Deutschen natürlich.
- source_word: fundamentum aedificii
  choice: Fundament eines Gebäudes
  rationale: Die Wiedergabe bildet die singuläre lateinische Genitivverbindung eng ab, ohne sie zu „kein Gebäudefundament“ zu verdichten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konsekutive Zusammenhang von propterea wird mit „Darum“ wiedergegeben; die indirekte Aufforderung ut venires erscheint idiomatisch als „du sollst … kommen“.
