review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt propterea, dixi tibi, ut venires in agrum und ubi non est fundamentum aedificii grundsätzlich zutreffend wieder. „Feld“ entspricht agrum im konkreten örtlichen Kontext. Die Formulierung „du sollst“ legt jedoch leicht eine gegenwärtige Verpflichtung nahe, während das lateinische Imperfekt im ut-Satz den Zweck bzw. Inhalt der damaligen Aufforderung bezeichnet.
  naturalness: „Wo kein Fundament eines Gebäudes ist“ ist verständlich, klingt im modernen Standarddeutsch aber etwas unidiomatisch. „Wo kein Fundament eines Gebäudes vorhanden ist“ ist natürlicher und wahrt die existentielle Aussage des Lateinischen.
  terminology: „Fundament eines Gebäudes“ bildet fundamentum aedificii mit Singular und Genitiv sachgerecht ab. Die Fußnote ist als mögliche, aber kontextuell weniger genaue Weite von agrum vertretbar.
