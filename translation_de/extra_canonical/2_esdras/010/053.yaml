    rationale: Die Wendung kann als gegenwärtige Anweisung verstanden werden. Ein Infinitivanschluss an „sagte ich dir“ gibt die frühere Aufforderung und den finalen ut-Satz unmarkierter wieder.
  - severity: low
    issue: Etwas unnatürliche Existenzformulierung
    rationale: Für lateinisch non est fundamentum ist im Deutschen „kein Fundament … vorhanden ist“ idiomatischer als „kein Fundament … ist“.
