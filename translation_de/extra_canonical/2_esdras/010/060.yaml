  text: Und ich schlief jene Nacht und eine weitere, wie er mir gesagt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aliam
  choice: noch eine weitere
  rationale: Das substantivisch gebrauchte feminine „aliam“ bezieht sich sinngemäß auf eine weitere Nacht. „Noch eine weitere“ bewahrt diese Bedeutung und klingt im Deutschen natürlich.
- source_word: sicut dixerat mihi
  choice: wie er mir gesagt hatte
  rationale: Gibt die Vergleichskonjunktion „sicut“, das Plusquamperfekt „dixerat“ und den Dativ „mihi“ unmittelbar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdevolle Erzählsprache. „In jener Nacht“ wahrt den rückblickenden Bezug von „illam noctem“; das im Lateinischen bei „aliam“ ausgelassene „Nacht“ wird im Deutschen durch „eine weitere“ verständlich ergänzt.
