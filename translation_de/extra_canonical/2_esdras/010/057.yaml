  naturalness: „mehr als viele andere glücklich zu preisen“ ist unnötig umständlich und weniger natürlich als „gesegneter als viele andere“. „vor dem Höchsten berufen worden“ ist in würdigem modernem Standarddeutsch verständlich und bewahrt zugleich die leicht markierte Sprache der Vorlage.
  terminology: „gesegnet“ ist für „beatus“ in diesem Kontext treffender als die potenziell emotional verstandene Wendung „glücklich zu preisen“. „der Höchste“ ist als Gottesbezeichnung passend. Die Fußnote sollte die mögliche agentive Deutung nennen, aber nicht behaupten, „apud“ sei hier eindeutig eine Agensangabe.
