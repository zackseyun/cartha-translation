  text: audire. Tu autem beatus es prae multis, et uocatus es apud
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: de
  text: Du aber bist gesegneter als viele andere und vor dem Höchsten berufen worden, wie nur wenige.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und vom Höchsten berufen worden, wie nur wenige.“ Das lateinische „apud“ bedeutet gewöhnlich „bei“ oder „in der Gegenwart von“; im Zusammenhang kann es auch so verstanden werden, dass der Höchste der Berufende ist.'
    reason: Bewahrt die durch „apud“ bestehende Spannung zwischen einer Berufung in der Gegenwart beziehungsweise vor dem Höchsten und einer möglichen agentiven Deutung.
lexical_decisions:
- source_word: beatus
  choice: glücklich zu preisen
  rationale: Gibt den Zustand und die anerkennende Aussage von „beatus“ in würdigem, heutigem Deutsch wieder, ohne es vorschnell auf eine rein innerliche Gefühlslage zu verengen.
- source_word: prae multis
  choice: mehr als viele andere
  rationale: Bewahrt den vergleichenden Sinn von „prae“; gemeint ist, dass Esra gegenüber vielen besonders begünstigt ist.
- source_word: uocatus es
  choice: bist du berufen
  rationale: Das Perfekt wird im Deutschen natürlich als Zustandsperfekt wiedergegeben; „berufen“ lässt sowohl Erwählung als auch Berufung in die Gegenwart des Höchsten anklingen.
- source_word: apud
  choice: beim
  rationale: „Apud“ bezeichnet primär Nähe, Gegenwart oder Geltung bei jemandem und nicht eindeutig den Handelnden. „Beim Höchsten“ erhält diese Offenheit besser als „vom Höchsten“.
theological_decisions:
- issue: Verhältnis der Berufung zum Höchsten
  choice: beim Höchsten bist du berufen
  alternative: vom Höchsten bist du berufen
  rationale: Der lateinische Text hat „apud“, nicht die übliche Agensangabe „ab“. Daher wird die Vorstellung von Berufung beziehungsweise Anerkennung in der Gegenwart oder vor dem Angesicht des Höchsten im Haupttext bewahrt; die kausale Deutung bleibt als mögliche Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wendung „beim Höchsten berufen“ ist bewusst quellennah und bewahrt die Mehrdeutigkeit von „apud“. Der im Eingabefeld abgeschnittene lateinische Wortlaut wird anhand der angegebenen englischen Konsultationsschicht und der bekannten Fortsetzung „Altissimum sicut pauci“ vervollständigt.
