  yaml_path: translation/extra_canonical/2_esdras/010/017.yaml
  text: Therefore go into the city to your husband.” And he said to me:[a]
translation:
  language: de
  text: »Geh also in die Stadt zu deinem Mann.« Da sagte sie zu mir:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Lateinischen steht nur: „Da sagte [er/sie] zu mir“; das Subjekt „sie“ ergibt sich aus dem Zusammenhang.'
    reason: Das Geschlecht des im Deutschen erforderlichen Pronomens ist im lateinischen Verb nicht ausdrücklich markiert.
lexical_decisions:
- source_word: ingredere
  choice: Geh
  rationale: Der lateinische Imperativ bezeichnet hier das Hineingehen in die Stadt; im natürlichen Deutschen genügt „Geh … in die Stadt“.
- source_word: ad virum tuum
  choice: zu deinem Mann
  rationale: „virum“ bezeichnet im Kontext den Ehemann der Frau; „zu deinem Mann“ gibt die Zielrichtung von „ad“ idiomatisch wieder.
- source_word: Et dixit ad me
  choice: Da sagte sie zu mir
  rationale: Das lateinische Verb nennt kein grammatisches Geschlecht; aus dem unmittelbaren Erzählzusammenhang ist jedoch die zuvor angesprochene Frau das naheliegende Subjekt. „Da“ stellt den Erzählfortgang im Deutschen natürlich dar.
theological_decisions:
- issue: Geschlecht des unausgesprochenen Subjekts von „dixit“
  choice: sie
  alternative: er / geschlechtsneutrale Umschreibung
  rationale: „dixit“ ist formal hinsichtlich des Geschlechts unbestimmt, doch der Kontext weist auf die Frau als antwortende Sprecherin. Diese kontextuelle Ergänzung betrifft die Erzählkohärenz, nicht eine theologische Festlegung.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Der Doppelpunkt bleibt erhalten, weil der folgende Vers die angekündigte direkte Rede fortsetzt.
