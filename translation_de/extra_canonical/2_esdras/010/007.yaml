  yaml_path: translation/extra_canonical/2_esdras/010/007.yaml
  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: de
  text: Siehst du unsere Trauer und was uns widerfahren ist? Denn Zion, unser aller Mutter, trauert in Kummer und Erniedrigung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: luctum
  choice: Trauer
  rationale: Gibt den Zustand gemeinschaftlicher Trauer natürlich und quellennah wieder.
- source_word: quae nobis contigerunt
  choice: was uns widerfahren ist
  rationale: Bewahrt den Sinn des Geschehenen bzw. Erlittenen in würdigem, heutigem Deutsch.
- source_word: Sion mater nostra omnium
  choice: Zion, unser aller Mutter
  rationale: Versteht „nostra omnium“ als „von uns allen“ und vermeidet die im Latein nicht vorhandene Verdopplung „unsere Mutter, die Mutter von uns allen“.
- source_word: in tristitia contristatur
  choice: trauert in Kummer
  rationale: Gibt die verstärkende Wiederholung von „tristitia/contristatur“ verständlich wieder, ohne sie durch ein deutendes Adverb wie „bitterlich“ aufzulösen.
- source_word: humilitate
  choice: Erniedrigung
  rationale: Bewahrt den Zustand von Demütigung bzw. Niedrigkeit; „Erniedrigung“ passt hier zur leidenden, personifizierten Stadt.
theological_decisions:
- issue: Personifizierung Zions als Mutter
  choice: Zion, unser aller Mutter
  alternative: Zion, unsere Mutter von allen
  rationale: Die natürliche deutsche Formulierung bewahrt die mütterliche Personifizierung und bezieht „aller“ auf die Gemeinschaft, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die personifizierte Rede von Zion bleiben erhalten; die lateinische Verstärkung wird leicht geglättet, aber nicht interpretierend zugespitzt.
