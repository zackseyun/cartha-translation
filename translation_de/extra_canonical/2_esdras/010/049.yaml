  source_fidelity: 'Die Übersetzung gibt den vorgelegten lateinischen Text präzise wieder: luget filium, inchoasti consolare eam, de his quae contigerunt und haec erant tibi aperienda sind vollständig und ohne Sinnverschiebung erfasst. Die in der englischen Audit-Fassung vorausgehenden Elemente („And behold“, das Sehen ihrer Gestalt) stehen im bereitgestellten lateinischen Textausschnitt nicht und werden daher zu Recht nicht ergänzt.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und gut lesbar. „Sie trauert um ihren Sohn“ sowie „über das, was geschehen ist“ sind idiomatisch. Die Konstruktion „du hast begonnen, sie … zu trösten“ bewahrt die aspektuelle Nuance von inchoasti.
  terminology: „offenbart werden“ trifft aperienda im apokalyptischen Kontext angemessen. Die Fußnote dokumentiert mit „geöffnet“ die konkrete Grundbedeutung, ohne die kontextgerechte Hauptübersetzung zu beeinträchtigen.
