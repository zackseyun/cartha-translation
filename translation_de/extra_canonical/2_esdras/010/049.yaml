id: 2ES.10.49
reference: 2 Esdras 10:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: de
  text: Sie trauert um ihren Sohn, und du hast begonnen, sie über das zu trösten, was geschehen ist. Dies musste dir offenbart werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Dies musste dir geöffnet werden.«'
    reason: Bewahrt die konkrete Grundbedeutung von aperienda neben der kontextgemäßen Wiedergabe „offenbart“.
lexical_decisions:
- source_word: filium luget
  choice: Sie trauert um ihren Sohn
  rationale: Gibt das lateinische Verb luget und das Akkusativobjekt filium natürlich und genau wieder.
- source_word: inchoasti consolare eam
  choice: du hast begonnen, sie … zu trösten
  rationale: Bewahrt sowohl den Beginn der Handlung als auch deren Gegenstand.
- source_word: de his quae contigerunt
  choice: über das, was geschehen ist
  rationale: Eine natürliche deutsche Wiedergabe des Bezugs auf die eingetretenen Ereignisse.
- source_word: haec erant tibi aperienda
  choice: Dies musste dir offenbart werden
  rationale: Im apokalyptischen Zusammenhang bezeichnet aperire hier am ehesten das Enthüllen beziehungsweise Offenbaren; die lateinische Verpflichtungskonstruktion wird mit „musste“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von aperienda im Offenbarungskontext
  choice: offenbart werden
  alternative: geöffnet beziehungsweise erschlossen werden
  rationale: „Offenbart“ vermittelt den apokalyptischen Sinn, ohne näher festzulegen, auf welche Weise die Erkenntnis zugänglich gemacht wurde; die wörtlichere Bildsprache bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorgelegte lateinische Vers setzt mitten im Gedankengang ein; nicht im lateinischen Text belegte Zusätze der englischen Konsultationsfassung wurden nicht übernommen. Das anschließende unvollständige „Et nunc uidens altissimus“ wurde als Beginn des nächsten Satzes beziehungsweise Verses nicht in diesen abgeschlossenen Vers aufgenommen.
