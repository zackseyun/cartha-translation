  source_fidelity: Die direkte Rede ist zutreffend erkannt; »Mein Sohn« muss der Frau zugeordnet bleiben. »stand für« schwächt jedoch die ausdrückliche Identifikation in »haec erat quae facta est ruina Hierusalem« unnötig ab. Der Satz bezeichnet das geschilderte Ereignis als den Untergang Jerusalems, nicht nur als ein Symbol dafür.
  naturalness: Der Entwurf ist gut verständlich. »Und weil sie zu dir sagte« gibt die kausale Einleitung »Et quoniam dixit tibi« natürlicher und unmittelbarer wieder als »Und dass sie zu dir sagte«.
