source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: de
  text: 'Und weil sie zu dir sagte: »Mein Sohn starb, als er sein Hochzeitsgemach betrat, und ein Unglück traf ihn«, das war der Untergang Jerusalems.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: thalamo
  choice: Hochzeitsgemach
  rationale: Gibt den hochzeitlichen Sinn von lateinisch „thalamus“ natürlich und würdevoll wieder.
- source_word: casus
  choice: Unglück
  rationale: Bewahrt die allgemeine Bedeutung eines schweren Unglücks, ohne Art oder Ursache näher festzulegen.
- source_word: ruina Hierusalem
  choice: Untergang Jerusalems
  rationale: Bezeichnet hier nicht bloß baulichen Einsturz, sondern die geschichtliche Katastrophe der Stadt.
theological_decisions:
- issue: quod als Einleitung direkter oder indirekter Rede
  choice: 'Direkte Rede: »Mein Sohn …«'
  alternative: 'Indirekte Rede: „dass mein Sohn …“'
  rationale: Das erste Person anzeigende „meus“ spricht dafür, „quod“ als Einleitung eines wörtlichen Zitats der Frau zu verstehen; so wird zudem vermieden, den Sohn fälschlich dem redenden Ausleger zuzuordnen.
- issue: Symbolische Zuordnung der Erzählung
  choice: „das stand für den Untergang Jerusalems“
  alternative: „das war der Untergang, der über Jerusalem kam“
  rationale: Der Kontext erklärt die Einzelheiten der Erscheinung als Sinnbilder. „stand für“ macht diese Deutung auf Deutsch klar, ohne die Identifikation übermäßig wörtlich zu formulieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird klar markiert; die Reihenfolge und Aussage des lateinischen Satzes bleiben gewahrt.
