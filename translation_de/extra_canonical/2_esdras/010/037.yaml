  text: Therefore I beg you to show your servant the meaning of this departure.” And he answered me and[a]
translation:
  language: de
  text: 'Darum bitte ich dich: Zeige deinem Diener, was dieses Fortgehen[a] bedeutet.« Da antwortete er mir und'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was es mit diesem entrückten Zustand auf sich hat“.'
    reason: Das lateinische excessus kann sowohl ein Fortgehen als auch ein Außersichsein beziehungsweise einen visionären Trancezustand bezeichnen.
lexical_decisions:
- source_word: demonstres
  choice: Zeige
  rationale: Der lateinische Konjunktiv steht nach der Bitte und wird im Deutschen natürlich als höflich eingebetteter Imperativ wiedergegeben.
- source_word: seruo tuo
  choice: deinem Diener
  rationale: Bewahrt die demütige Selbstbezeichnung und die direkte Anrede.
- source_word: excessu hoc
  choice: dieses Fortgehen
  rationale: Excessus kann ein Weggehen oder Verlassen bezeichnen. Die konkrete, im Kontext naheliegende Bedeutung bleibt im Haupttext erhalten; die mögliche Bedeutung eines visionären Außersichseins wird in der Fußnote kenntlich gemacht.
- source_word: Et respondit ad me et
  choice: Da antwortete er mir und
  rationale: Das zweite et wird trotz des am Versende unvollständigen Satzes bewahrt, da es in der Quelle steht und in den folgenden Vers hinüberführt.
theological_decisions:
- issue: Bedeutung von excessus
  choice: Fortgehen
  alternative: entrückter Zustand / Trance
  rationale: Die Übersetzung legt excessus nicht ausschließlich als prophetische Ekstase aus. Sie wahrt die konkrete Lesart im Haupttext und dokumentiert die visionäre Lesart als echte lexikalische Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abrupte Fortsetzung mit „und“ bleibt erhalten, weil der lateinische Vers an dieser Stelle syntaktisch in den nächsten Vers übergeht.
