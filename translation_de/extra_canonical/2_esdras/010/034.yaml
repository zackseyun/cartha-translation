  text: And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.
translation:
  language: de
  text: 'Und ich sagte: »Sprich, mein Herr; nur verlass mich nicht, damit ich nicht umsonst sterbe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquere
  choice: verlass mich nicht
  rationale: Das lateinische Verb bedeutet hier »verlassen« beziehungsweise »im Stich lassen«. Die persönliche Form ergibt sich aus dem überlieferten Zusammenhang und der konsultierten englischen Fassung.
- source_word: ut non frustra moriar
  choice: damit ich nicht umsonst sterbe
  rationale: »Umsonst« gibt frustra knapp und natürlich wieder; der Konjunktiv moriar wird als befürchtete Folge beziehungsweise zu vermeidender Ausgang ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die im vorgelegten lateinischen Ausschnitt anschließenden Wörter »Quoniam uidi quae non« bilden einen unvollständigen neuen Satz und werden entsprechend der angegebenen Versabgrenzung und der geprüften englischen Konsultationsfassung nicht in den Haupttext aufgenommen.
