source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: de
  text: „Wo ist der Engel Uriel, der am Anfang zu mir kam? Denn er hat mich in dieses überwältigende Außersichsein[a] versetzt, und mein Ende ist dem Verderben anheimgefallen und mein Gebet zum Hohn geworden.“ Während ich dies sagte, siehe, da kam er zu mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in die Fülle dieses Außersichseins des Geistes/Verstandes“. Gemeint ist ein überwältigender Ausnahmezustand; die Wendung kann visionäres Entrücktsein oder tiefe Verstörung bezeichnen, nicht freudige Ekstase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: in multitudinem excessus mentis huius
  choice: in diesen überwältigenden Zustand geistiger Entrückung
  rationale: Das lateinische excessus mentis bezeichnet ein Außersichsein beziehungsweise einen visionären Ausnahmezustand, nicht freudige Ekstase oder bloße Verwirrung. multitudinem verstärkt hier das Ausmaß; „überwältigend“ gibt diese Wirkung in natürlichem Deutsch wieder.
- source_word: factus est finis meus in corruptione
  choice: Nun endet es für mich im Verderben
  rationale: Die Wendung ist im Lateinischen ungewöhnlich. Die Übersetzung bewahrt den Gedanken, dass Esras Ausgang im Verderben liegt, ohne „corruptio“ auf körperliche Verwesung einzuengen.
- source_word: oratio mea in inproperium
  choice: mein Gebet wird zum Hohn
  rationale: inproperium kann Schmach, Vorwurf oder Hohn bezeichnen. Im Zusammenhang beklagt Esra, dass sein Gebet ihm nicht Ehre oder Hilfe, sondern Beschämung einbringt.
- source_word: et ecce uenit ad me
  choice: siehe, da kam er zu mir
  rationale: Die präsentative Formel et ecce wird mit dem würdevollen, biblisch vertrauten „siehe“ wiedergegeben. Das unausgesprochene Subjekt bezieht sich im Zusammenhang auf Uriel.
theological_decisions:
- issue: Art des von Uriel ausgelösten Geisteszustands
  choice: visionärer Ausnahmezustand („geistige Entrückung“)
  alternative: gewöhnliche Verwirrung oder freudige Ekstase
  rationale: excessus mentis beschreibt hier ein Herausgerücktsein des Geistes unter dem Eindruck der Offenbarung. Der Kontext ist von Überwältigung und Not, nicht von Freude, geprägt.
- issue: Bedeutung von corruptio
  choice: Verderben
  alternative: Verwesung oder moralische Verderbtheit
  rationale: „Verderben“ lässt offen, ob Esra Untergang, Tod oder einen sonstigen verhängnisvollen Ausgang meint, und wahrt damit die semantische Breite des lateinischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildkraft des lateinischen Textes bleibt erhalten, während eine im heutigen Deutsch irreführende Assoziation von „Ekstase“ mit Freude vermieden wird. Der im vorgelegten lateinischen Quelltext enthaltene abschließende Satz wurde mitübersetzt.
