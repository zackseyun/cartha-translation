- from: „Wo ist der Engel Uriel, der am Anfang zu mir kam? Denn er hat mich in diesen überwältigenden Zustand geistiger Entrückung[a] versetzt. Nun endet es für mich im Verderben, und mein Gebet wird zum Hohn.“ Während ich dies sagte, siehe, da kam er zu mir.
