  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: de
  text: Denn weil du in deiner Seele betrübt warst und weil du von ganzem Herzen um sie leidest, zeigte er dir den Glanz ihrer Herrlichkeit und die Schönheit ihrer Pracht. Deshalb sagte ich dir, du solltest in …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird erst im folgenden Vers fortgesetzt.
    reason: Der vorliegende Vers endet im lateinischen Ausgangstext mitten in der Wendung „maneres in“.
lexical_decisions:
- source_word: ex animo contristatus es
  choice: tief in deiner Seele betrübt warst
  rationale: Gibt die innere, seelische Tiefe des Kummers natürlich wieder, ohne das lateinische Bild aufzugeben.
- source_word: ex toto corde pateris pro ea
  choice: von ganzem Herzen um sie leidest
  rationale: Bewahrt den Wechsel ins Präsens und gibt pro ea idiomatisch als auf sie bezogenes Leiden wieder.
- source_word: claritatem gloriae eius
  choice: den Glanz ihrer Herrlichkeit
  rationale: Unterscheidet claritas als sichtbaren Glanz von gloria als Herrlichkeit.
- source_word: pulchritudinem decoris eius
  choice: die Schönheit ihrer Pracht
  rationale: Bewahrt die verstärkende Verbindung zweier verwandter, aber nicht identischer Begriffe, ohne sie zu einem einzigen Ausdruck einzuebnen.
- source_word: ut maneres in
  choice: du solltest in …
  rationale: Gibt die Aufforderung mit deutschem Konjunktiv wieder und lässt den im überlieferten Vers unvollständigen Anschluss offen.
theological_decisions:
- issue: Subjekt von ostendit
  choice: „er zeigte dir“
  alternative: „der Höchste zeigte dir“
  rationale: Das lateinische Subjekt ist lediglich in der Verbform enthalten; eine ausdrückliche Identifizierung mit dem Höchsten würde dem vorliegenden Wortlaut etwas hinzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Kausalsätze und der Tempuswechsel des lateinischen Textes bleiben erhalten; die abgebrochene Satzkonstruktion am Versende wird sichtbar bewahrt.
