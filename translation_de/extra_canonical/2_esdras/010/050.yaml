  source_fidelity: Der Entwurf gibt Satzbau, die beiden Begründungssätze, den Tempuswechsel (contristatus es / pateris), die Bildsprache von claritas gloriae und pulchritudo decoris sowie den unvollständigen Versschluss zuverlässig wieder. „tief“ in „tief in deiner Seele“ verstärkt jedoch ex animo ohne ausdrückliche Grundlage im lateinischen Text.
  naturalness: Die Formulierung ist würdiges, gut verständliches modernes Standarddeutsch. „Deshalb sagte ich dir, du solltest …“ ist eine natürliche Wiedergabe von dixi tibi ut maneres. Die sichtbar belassene Auslassung mit Fußnotenanker ist bei diesem versübergreifend abgebrochenen Satz angemessen.
  terminology: „Herrlichkeit“ für gloria, „Glanz“ für claritas und „Pracht“ für decor sind angemessen differenziert. „um sie leidest“ gibt pro ea idiomatisch wieder, ohne die im Kontext vorausgesetzte Bezugsperson näher zu bestimmen.
