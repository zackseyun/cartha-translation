  yaml_path: translation/extra_canonical/2_esdras/010/035.yaml
  text: For I knew[a], and I hear what I do not know; or is my understanding
translation:
  language: de
  text: Ich wusste, und ich höre, was ich nicht weiß; oder ist etwa mein Verstand …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sciebam
  choice: Ich wusste
  rationale: Das Imperfekt von scire bezeichnet Wissen; die ungewöhnliche, objektlose Formulierung und die Vergangenheitsform werden beibehalten.
- source_word: audio
  choice: ich höre
  rationale: Gibt das lateinische Präsens unmittelbar wieder und bewahrt den Tempuswechsel gegenüber sciebam.
- source_word: quae non scio
  choice: was ich nicht weiß
  rationale: Bewahrt die Wiederholung desselben Wissensverbs (scio) und vermeidet die interpretierende Wiedergabe „nicht verstehe“.
- source_word: Aut numquid
  choice: oder ist etwa
  rationale: „Etwa“ gibt den fragenden, Zweifel andeutenden Charakter von numquid natürlich wieder, ohne die erwartete Antwort ausdrücklich festzulegen.
- source_word: sensus meus
  choice: mein Verstand
  rationale: Sensus kann Wahrnehmung, Sinn oder Verstand bezeichnen; hier passt „Verstand“ zur Aussage über Wissen, während die unvollständige Klausel offenbleibt.
theological_decisions:
- issue: Unvollständiger Satz am Versende
  choice: Die Klausel „oder ist etwa mein Verstand …“ bleibt ausdrücklich unvollständig.
  alternative: Den Satz durch eine aus dem Kontext erschlossene Ergänzung abschließen.
  rationale: Der bereitgestellte lateinische Quelltext bricht nach sensus meus ab; eine Ergänzung würde nicht belegten Inhalt einführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Folge von „wusste“, „höre“ und „nicht weiß“ sowie der Satzabbruch werden als Merkmale des lateinischen Textes bewahrt.
