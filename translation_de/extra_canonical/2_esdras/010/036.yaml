  yaml_path: translation/extra_canonical/2_esdras/010/036.yaml
  text: Or is my mind deceived, and is my soul dreaming?
translation:
  language: de
  text: Oder wird mein Verstand getäuscht, und träumt meine Seele?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  choice: täusche ich mich
  rationale: Das überlieferte Passiv bedeutet wörtlich „wird getäuscht“, doch wegen des offenbar am Versanfang fehlenden Bezugs und entsprechend dem Sinnzusammenhang wird die natürliche deutsche Wendung „täusche ich mich“ gewählt.
- source_word: anima mea
  choice: meine Seele
  rationale: „Seele“ bewahrt die anthropologische Ausdrucksweise des lateinischen Textes und unterscheidet sie nicht unnötig in „Geist“ oder „Verstand“ um.
- source_word: somniatur
  choice: träumt
  rationale: Die ungewöhnliche lateinische Form wird sinngemäß als „träumt“ wiedergegeben; die mögliche Passivnuance lässt sich im Deutschen nicht natürlich erhalten.
theological_decisions:
- issue: Verhältnis von Selbsttäuschung und Traumzustand
  choice: Beide Fragen bleiben als offene, parallele Möglichkeiten stehen.
  alternative: Die Aussage als Vision, Wahn oder göttliche Täuschung näher bestimmen.
  rationale: Der lateinische Wortlaut benennt keine Ursache und löst die Unsicherheit der Sprecherfigur nicht auf.
translation_notes:
  register: Modernes, schlichtes und zugleich würdevolles Deutsch. Der unmittelbar folgende, unvollständige Satzanfang „Nunc ergo deprecor te ut“ gehört sachlich zum nächsten Vers und wird hier nicht aufgenommen.
