source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: de
  text: Und ich bin, wie du siehst, auf dieses Feld gekommen. Ich habe vor, nicht mehr in die Stadt zurückzukehren, sondern hierzubleiben. Ich werde weder essen noch trinken, sondern unaufhörlich trauern und fasten, bis ich sterbe.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogito … reuerti … sed … consistere
  choice: Ich habe vor, … zurückzukehren, sondern hierzubleiben
  rationale: Mit folgendem Infinitiv bezeichnet »cogito« hier eine Absicht oder einen festen Vorsatz, nicht bloß einen unverbindlichen Gedanken. Die Wiedergabe bleibt natürlich, ohne den Ausdruck stärker als nötig zu »ich habe beschlossen« zu verschärfen.
- source_word: iam non
  choice: nicht mehr
  rationale: Die Verbindung bezeichnet hier, dass die Sprecherin künftig nicht mehr in die Stadt zurückkehren will; »nicht mehr« gibt diesen zeitlichen Sinn idiomatisch wieder.
- source_word: in hoc campo
  choice: auf dieses Feld
  rationale: »Campus« bezeichnet eine offene Feldfläche. Mit dem Bewegungsverb »veni« ist im Deutschen »auf dieses Feld gekommen« die natürliche Wiedergabe.
- source_word: sine intermissione
  choice: unaufhörlich
  rationale: Der Ausdruck bedeutet ohne Unterbrechung oder ohne aufzuhören; »unaufhörlich« wahrt die nachdrückliche Aussage in würdigem, aktuellem Deutsch.
- source_word: usque dum moriar
  choice: bis ich sterbe
  rationale: Der Konjunktiv »moriar« steht nach »usque dum« zukunftsbezogen; im Deutschen ist der Indikativ in einem Bis-Satz idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Das Futur in »Ich werde weder essen noch trinken« bewahrt den entschlossenen Charakter des angekündigten Fastens. Das abschließende Anführungszeichen setzt voraus, dass der Vers Teil einer bereits begonnenen direkten Rede ist.
