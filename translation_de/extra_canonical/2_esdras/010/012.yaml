source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uno doles ? Si autem dices mihi, quoniam non est similis planctus meus terrae, quoniam ego fructum uentris mei perdidi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/012.yaml
  text: But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,’
translation:
  language: de
  text: 'Wenn du aber zu mir sagst: »Meine Klage ist nicht mit der der Erde vergleichbar, denn ich habe die Frucht meines Leibes verloren«,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: planctus meus
  choice: meine Klage
  rationale: „Klage“ gibt den Ausdruck natürlichen und würdevollen Schmerzes wieder; „Wehklage“ wäre möglich, klingt im modernen Deutsch jedoch stärker markiert.
- source_word: terrae
  choice: der der Erde
  rationale: Der elliptische lateinische Genitiv bezeichnet die Klage der Erde; die deutsche Stellvertretung mit „der“ erhält den Vergleich knapp und eindeutig.
- source_word: fructum uentris mei
  choice: die Frucht meines Leibes
  rationale: Die traditionelle Körpermetapher wird formal bewahrt und bezeichnet hier das verlorene Kind, ohne die Bildsprache aufzulösen.
theological_decisions:
- issue: Vergleich zwischen der persönlichen Klage und der Klage der Erde
  choice: „nicht mit der der Erde vergleichbar“
  alternative: „nicht wie die der Erde“
  rationale: Die gewählte Fassung erhält die personifizierte Klage der Erde und lässt die genaue Art der Unvergleichbarkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängiger, mit Komma endender Bedingungssatz stehen, da der Gedankengang im folgenden Vers fortgesetzt wird.
