  source_fidelity: 'Die Übersetzung folgt dem vorliegenden lateinischen Wortlaut genau: commonebo als „ich werde dich ermahnen“, et dixi als „und ich sagte“, loquere als Imperativ und domine meus als ehrerbietige Anrede. Der abgebrochene Ausdruck tantum me noli wird nicht unzulässig aus dem folgenden Vers ergänzt.'
