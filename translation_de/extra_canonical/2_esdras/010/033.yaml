lexical_decisions:
- source_word: commonebo
  choice: Ich werde dich ermahnen
  rationale: Das lateinische commonere kann je nach Zusammenhang „erinnern“, „mahnen“, „ermahnen“ oder „belehren“ bedeuten. „Ermahnen“ bewahrt hier die mahnend-anleitende Bedeutungsbreite und passt natürlich zur vorausgehenden Aufforderung.
- source_word: Loquere, domine meus
  choice: Rede, mein Herr
  rationale: Direkte, würdevolle Wiedergabe des Imperativs loquere und der Anrede domine meus.
- source_word: tantum me noli
  choice: nur tu mir nicht …
  rationale: Der überlieferte Versabschnitt bricht mitten in der Konstruktion noli mit noch folgendem Infinitiv ab. Die deutsche Fassung lässt den Satz deshalb ausdrücklich offen, statt die Ergänzung vorwegzunehmen.
theological_decisions:
- issue: Bedeutung von commonebo
  choice: ermahnen
  alternative: erinnern / belehren
  rationale: Keine der Möglichkeiten begründet hier eine eigenständige Lehrentscheidung. „Ermahnen“ gibt die semantische Spannung zwischen erinnerndem Mahnen und Unterweisung wieder, ohne den Ausdruck auf bloßes Erinnern oder formale Belehrung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche offene Schlussformulierung ist durch die Versgrenze im lateinischen Ausgangstext bedingt und wird mit Auslassungspunkten kenntlich gemacht. Die englische Fußnote mit der früheren Wiedergabe wurde nicht übernommen, da sie Text aus dem Ende von 10,32 enthält und keine echte Lesart für den vorliegenden lateinischen Abschnitt von 10,33 darstellt.
