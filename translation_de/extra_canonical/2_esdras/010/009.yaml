source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: de
  text: Du aber trauerst um einen einzigen Sohn. Denn frage die Erde, und sie wird dir sagen, dass sie es ist, die um so viele auf ihr trauern müsste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contristaris
  choice: du trauerst
  rationale: Gibt die gegenwärtige Trauer natürlich und unmittelbar wieder.
- source_word: in uno filio
  choice: um einen einzigen Sohn
  rationale: Das lateinische in bezeichnet hier den Gegenstand der Trauer; »einzigen« bringt den Kontrast zu den vielen deutlich zum Ausdruck.
- source_word: Interroga enim terram
  choice: Frag doch die Erde
  rationale: Der Imperativ bleibt direkt; »doch« gibt enim in diesem begründenden, auffordernden Zusammenhang idiomatisch wieder.
- source_word: debeat lugere
  choice: trauern müsste
  rationale: Bewahrt den modalen Sinn von debere, ohne die Verpflichtung stärker als im Lateinischen festzulegen.
- source_word: tantorum super eam
  choice: um so viele auf ihr
  rationale: Folgt der knappen und etwas offenen lateinischen Formulierung, ohne ein nicht ausdrücklich genanntes Verb wie »hervorgehen« hinzuzufügen.
theological_decisions:
- issue: Personifikation der Erde
  choice: »sie es ist, die … trauern müsste«
  alternative: »die Erde … trauern müsste«
  rationale: Bewahrt die feminine Personifikation und die Hervorhebung des lateinischen haec est quae.
- issue: Nicht näher bezeichnete »viele«
  choice: »so viele auf ihr«
  alternative: »so viele Menschen auf ihr«
  rationale: Das Latein nennt die Betrauerten nicht ausdrücklich; die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Schlussformulierung bleibt bewusst erhalten, damit keine im lateinischen Text fehlende Deutung ergänzt wird.
