  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: de
  text: Darum behalte deinen Schmerz bei dir und ertrage tapfer die Schicksalsschläge, die dich getroffen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam dolorem tuum
  choice: behalte deinen Schmerz für dich
  rationale: Gibt die Aufforderung, den eigenen Schmerz bei sich zu behalten, natürlich und präzise wieder; die feminine Anrede ist im Deutschen am Pronomen nicht sichtbar.
- source_word: fortiter fer
  choice: ertrage tapfer
  rationale: Bewahrt sowohl den Imperativ als auch den Gedanken standhaften, mutigen Ertragens.
- source_word: quaetibi contigerunt casus
  choice: das Unglück, das dich getroffen hat
  rationale: Das überlieferte, zusammengeschriebene „quae tibi“ bezeichnet die widerfahrenen Unglücksfälle; der deutsche Singular „Unglück“ fasst sie idiomatisch als erlittenes Geschick zusammen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nun also“ wahrt den folgernden Anschluss von „nunc ergo“, ohne unnötig steif zu wirken.
