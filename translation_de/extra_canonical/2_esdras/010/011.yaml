  text: fit multitudo eorum. Quis ergo debet lugere magis nisi haec quae tam magnam multitudinem perdidit, quam tu quae pro
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/011.yaml
  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: de
  text: 'Wer sollte also mehr trauern: sie, die eine so große Menge verloren hat, oder du, die du um einen Einzigen trauerst?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugere
  choice: trauern
  rationale: Gibt das lateinische Verb in natürlichem, würdigem Deutsch wieder.
- source_word: tam magnam multitudinem
  choice: eine so große Menge
  rationale: Bewahrt Umfang und Nachdruck des lateinischen Ausdrucks, ohne ihn näher zu bestimmen.
- source_word: pro [uno]
  choice: um einen Einzigen
  rationale: Der vorgelegte lateinische Ausschnitt bricht nach „pro“ ab; die aus dem überlieferten Zusammenhang erschlossene Ergänzung bezeichnet den einen Sohn und wird geschlechtsneutral hinsichtlich der angesprochenen Person, aber zahlenmäßig betont wiedergegeben.
theological_decisions:
- issue: Vergleich zwischen dem gemeinschaftlichen und dem persönlichen Verlust
  choice: 'Die rhetorische Spannung bleibt bestehen: Der Verlust der großen Menge wird dem Verlust eines Einzigen gegenübergestellt.'
  alternative: Den persönlichen Schmerz ausdrücklich als geringer oder unangemessen bewerten.
  rationale: Der lateinische Vergleich fragt, wer mehr Grund zur Trauer hat, ohne den persönlichen Schmerz grundsätzlich zu verneinen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung „mehr als“ macht den im Lateinischen verschachtelten Vergleich klar, ohne die rhetorische Frage aufzulösen.
