source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixi: Quoniam derelinquens dereliquisti me: ego quidem feci secundum sermones tuos et exiui in campum et ecce uidi et uideo quod non possum enarrare. et dixit ad me: Sta ut uir et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: de
  text: 'Da sagte ich: „Weil du mich völlig verlassen hast! Ich habe doch nach deinen Worten gehandelt und bin hinaus auf das Feld gegangen. Und sieh: Ich sah und sehe noch immer etwas, das ich nicht beschreiben kann.“ Da sagte er zu mir: „Steh wie ein Mann und …“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquens dereliquisti me
  choice: du mich völlig verlassen hast
  rationale: Die lateinische figura etymologica verstärkt das Verlassen; im natürlichen Deutschen gibt „völlig“ diese nachdrückliche Wirkung wieder.
- source_word: secundum sermones tuos
  choice: nach deinen Worten
  rationale: Bewahrt den Bezug auf die vorausgegangene Weisung, ohne „sermones“ unnötig technisch wiederzugeben.
- source_word: exiui in campum
  choice: bin hinaus auf das Feld gegangen
  rationale: Direkte und idiomatische Wiedergabe der Bewegung in den offenen Bereich.
- source_word: ecce
  choice: sieh
  rationale: Erhält das aufmerksamkeitslenkende und staunende Signal des lateinischen Textes.
- source_word: uidi et uideo
  choice: Ich sah und sehe noch immer
  rationale: Bewahrt den auffälligen Wechsel von Vergangenheit zu Gegenwart und macht dessen fortdauernden Sinn im Deutschen verständlich.
- source_word: quod non possum enarrare
  choice: etwas, das ich nicht beschreiben kann
  rationale: „Beschreiben“ gibt enarrare hier natürlich als sprachlich nicht darstellbare Vision wieder.
- source_word: Sta ut uir
  choice: Steh da wie ein Mann
  rationale: Formnahe Wiedergabe; der Ausdruck fordert Standhaftigkeit beziehungsweise Mut, ohne diese Deutung an die Stelle des Bildes zu setzen.
theological_decisions:
- issue: Vorwurf des Verlassenseins
  choice: Als direkte Klage Esras beibehalten
  alternative: Als Frage oder abgeschwächte Äußerung formulieren
  rationale: Der lateinische Wortlaut enthält einen nachdrücklichen Vorwurf; die Spannung zwischen Esras Klage und Gottes Handeln darf nicht geglättet werden.
- issue: Fortdauernde Vision
  choice: Tempuswechsel „sah und sehe noch immer“ bewahren
  alternative: Einheitlich in der Vergangenheit wiedergeben
  rationale: Der Wechsel uidi/uideo zeigt, dass das Gesehene weiterhin vor Esra steht, und ist für die Szene inhaltlich bedeutsam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, emotionaler Rede. Der am Versende abbrechende lateinische Satz wird durch Auslassungspunkte sichtbar offengehalten.
