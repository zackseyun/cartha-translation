  source_fidelity: 'Der deutsche Text gibt die vollständigen, semantisch auswertbaren Teile des vorgelegten lateinischen Textes genau wieder: „dereliqui“ als Abbruch der bisherigen Rede, „sermones in quibus adhuc eram“ ohne Hinzufügung eines Gegenübers und „respondi“. Das abschließende lateinische „cum“ ist im bereitgestellten Text unvollständig; der Doppelpunkt markiert angemessen, dass die Rede fortgesetzt wird, ohne die in der englischen Audit-Fassung ergänzten Angaben „im Zorn“ und „sagte“ als gesicherten Text auszugeben.'
  naturalness: „Da brach ich die Worte ab, mit denen ich noch beschäftigt war, und antwortete:“ ist verständliches, modernes und zugleich würdiges Standarddeutsch. Die Formulierung wahrt die leicht ungewöhnliche Ausdrucksweise der Vorlage, ohne im Deutschen ungrammatisch zu werden.
  terminology: „Worte“ für „sermones“ und „antwortete“ für „respondi“ sind kontextgerecht. Es werden keine theologischen oder personenbezogenen Zusätze eingeführt.
