  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: brach … ab
  rationale: Das lateinische Perfekt bezeichnet hier, dass Esra seine bisherige Rede beendet bzw. unterbricht; „abbrach“ ist im Deutschen natürlich und prägnant.
- source_word: sermones
  choice: die Worte
  rationale: „Sermones“ bezeichnet im Kontext die Äußerungen bzw. die laufende Rede, nicht notwendig ein formelles Gespräch.
- source_word: in quibus adhuc eram
  choice: mit denen ich noch beschäftigt war
  rationale: Die ungewöhnliche lateinische Wendung wird nah am Wortlaut wiedergegeben, ohne einen nicht ausdrücklich genannten Gesprächspartner oder Gegenstand einzufügen.
- source_word: respondi
  choice: antwortete
  rationale: Direkte und idiomatische Entsprechung des lateinischen Verbs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der überlieferte lateinische Text endet mit „cum“, das syntaktisch unvollständig ist. Anders als die englische Konsultationsfassung enthält der vorgelegte lateinische Wortlaut weder „im Zorn“ noch „und sagte“; diese Elemente wurden daher nicht in den Haupttext aufgenommen.
