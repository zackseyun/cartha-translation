lexical_decisions:
- source_word: thalamo suo
  choice: sein Brautgemach
  rationale: Der Kontext bezeichnet das Hochzeitsgemach; „Brautgemach“ gibt dies im Deutschen präzise und in würdigem, verständlichem Stil wieder.
- source_word: cecidit
  choice: fiel zu Boden
  rationale: Gibt den konkreten Vorgang natürlicher wieder als das bloße „fiel“, ohne eine im Lateinischen nicht genannte Ursache hinzuzufügen.
