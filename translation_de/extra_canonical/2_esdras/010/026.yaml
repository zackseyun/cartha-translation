  yaml_path: translation/extra_canonical/2_esdras/010/026.yaml
  text: and behold[a], suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound. And I saw,
translation:
  language: de
  text: 'Und siehe[a], plötzlich stieß sie einen lauten, von Schrecken erfüllten Schrei aus, sodass die Erde von dem Schall erbebte. Und ich sah:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ohne den Aufmerksamkeitsruf: „Und plötzlich stieß sie einen lauten, von Schrecken erfüllten Schrei aus, sodass die Erde von dem Schall erbebte.“'
    reason: Bewahrt die dokumentierte alternative Wiedergabe, obwohl „siehe“ dem lateinischen ecce ausdrücklich entspricht.
lexical_decisions:
- source_word: ecce
  choice: siehe
  rationale: Gibt den lateinischen Aufmerksamkeitsruf knapp und in einem würdigen biblischen Register wieder.
- source_word: emisit sonum vocis magnum
  choice: stieß sie einen lauten … Schrei aus
  rationale: Natürliches modernes Deutsch für das Ausstoßen eines mächtigen Lautes; „Schrei“ passt zum folgenden Schrecken.
- source_word: timore plenum
  choice: von Schrecken erfüllt
  rationale: Bewahrt die Aussage, dass der Laut beziehungsweise Schrei von Furcht oder Entsetzen geprägt ist.
- source_word: commoveretur terra a sono
  choice: die Erde von dem Schall erbebte
  rationale: Gibt die durch den Laut verursachte Erschütterung der Erde anschaulich und quellennah wieder.
- source_word: et vidi
  choice: 'Und ich sah:'
  rationale: Entspricht vidi lexikalisch und lässt durch den Doppelpunkt erkennen, dass die Wahrnehmung im folgenden Vers inhaltlich fortgesetzt wird.
