source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: germinantium. Et ex ipsa initia omnes nacti, et alii ueniunt, et ecce pene omnes in perditionem ambulant et in exterminium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: de
  text: Von ihr haben alle ihren Anfang genommen, und andere kommen. Und siehe, fast alle gehen dem Verderben und der Vernichtung entgegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: von ihr
  rationale: Gibt den weiblichen lateinischen Rückbezug knapp wieder, ohne die Referenz innerhalb dieses Einzelverses eigenmächtig zu bestimmen.
- source_word: initia omnes nacti
  choice: haben alle ihren Anfang genommen
  rationale: Natürliches, zugleich formnahes Deutsch für den Gedanken, dass alle von ihr ihren Ursprung beziehungsweise Anfang empfangen haben.
- source_word: alii ueniunt
  choice: weitere kommen hinzu
  rationale: „Weitere“ bewahrt den fortlaufenden Zuwachs; „hinzukommen“ ist im Deutschen idiomatischer als das isolierte „kommen“.
- source_word: ecce
  choice: siehe
  rationale: Bewahrt das markierende und eindringliche Signalwort in würdigem biblischem Register.
- source_word: pene omnes
  choice: fast alle
  rationale: Direkte Wiedergabe der Mengenangabe, ohne sie zu verstärken oder abzuschwächen.
- source_word: in perditionem ambulant et in exterminium
  choice: gehen dem Verderben und der Vernichtung entgegen
  rationale: Bewahrt die parallelen Zielbegriffe und den Bewegungscharakter von „ambulant“ in natürlichem Deutsch.
theological_decisions:
- issue: Verhältnis von „Verderben“ und „Vernichtung“
  choice: Beide Begriffe bleiben als koordinierte Zielangaben erhalten.
  alternative: Die Ausdrücke zu einem einzigen Begriff zusammenziehen oder „exterminium“ als zusätzliche Aussage über eine Menge deuten.
  rationale: Der lateinische Text nennt zwei parallele Ziele desselben Gehens; eine dogmatische Präzisierung ihres Verhältnisses wäre unbegründet.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. „Siehe“ erhält die rhetorische Hervorhebung; Satzbau und Wortwahl vermeiden unnötige Archaismen.
