lexical_decisions:
- source_word: propterea enim
  choice: Denn deshalb
  rationale: Gibt sowohl die begründende Partikel „enim“ als auch den rückverweisenden Ausdruck „propterea“ wieder.
- source_word: maneres
  choice: du sollst … bleiben
  rationale: Der Konjunktiv Imperfekt steht nach „dixi tibi“ in einer abhängigen Aufforderung; im natürlichen Deutschen wird sie mit „sollst“ wiedergegeben.
- source_word: in campo
  choice: auf dem Feld
  rationale: Natürliche deutsche Ortsangabe für ein offenes, unbebautes Gelände.
- source_word: ubi domus non est aedificata
  choice: wo kein Haus gebaut worden ist
  rationale: Bewahrt das Perfekt Passiv und den daraus folgenden gegenwärtigen Zustand, ohne die Aussage unnötig ins Plusquamperfekt zurückzuversetzen.
