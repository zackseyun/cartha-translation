  text: For this reason I told you to remain in the field where no house has been built[a].
translation:
  language: de
  text: Denn aus diesem Grund habe ich dir gesagt, auf dem Feld zu bleiben, wo kein Haus gebaut worden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo kein Haus gebaut ist“.'
