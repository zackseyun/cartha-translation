  source_fidelity: 'Der Satzbau und die wesentlichen Begriffe entsprechen dem Latein: „speciem mulieris“, „apparuit tibi“, „casu filii sui“ und „absolutio“ sind treffend wiedergegeben. Allerdings bezeichnet „aedificari“ einen laufenden passiven Bauvorgang. „die gerade erbaut wurde“ kann im Deutschen vor allem als soeben abgeschlossener Bau verstanden werden und verwischt diesen Aspekt.'
