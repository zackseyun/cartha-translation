  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: de
  text: 'Du siehst nicht mehr die Gestalt einer Frau[a], sondern dir erschien eine Stadt, die gerade gebaut wurde. Und dass sie dir vom Unglück ihres Sohnes erzählte, hat folgende Deutung:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du siehst nicht die Gestalt einer Frau“. „Nicht mehr“ ergibt sich aus dem Wechsel der Erscheinung im Zusammenhang.'
    reason: Das lateinische „non“ bedeutet unmittelbar „nicht“; die zeitliche Nuance „nicht mehr“ ist kontextuell begründet.
lexical_decisions:
- source_word: speciem mulieris
  choice: die Gestalt einer Frau
  rationale: „Gestalt“ gibt das lateinische „species“ in diesem visionären Zusammenhang natürlich wieder, ohne es auf Gesicht oder äußeres Aussehen zu verengen.
- source_word: apparuit tibi ciuitas aedificari
  choice: dir erschien eine Stadt, die gerade erbaut wurde
  rationale: Die Formulierung bewahrt sowohl den Erscheinungscharakter von „apparuit tibi“ als auch den im passiven Infinitiv „aedificari“ bezeichneten Bauvorgang.
- source_word: casu filii sui
  choice: vom Unglück ihres Sohnes
  rationale: „Unglück“ bildet den hier erzählten schweren Schicksalsschlag ab, ohne „casus“ vorschnell ausschließlich als Tod zu bestimmen.
- source_word: absolutio
  choice: Deutung
  rationale: Im Kontext der Auslegung einer Vision bezeichnet „absolutio“ die Auflösung beziehungsweise Deutung des zuvor geschilderten Bildes.
theological_decisions:
- issue: Identität der Frau und der Stadt
  choice: Der Text lässt den Übergang vom Frauenbild zur Stadtvision stehen.
  alternative: Die Frau ausdrücklich mit der Stadt gleichsetzen.
  rationale: Der Vers beschreibt die veränderte Erscheinungsform; die ausdrückliche Identifizierung gehört zur folgenden Auslegung und soll hier nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular und der visionäre Charakter bleiben erhalten; der abschließende Doppelpunkt leitet die folgende Auslegung ein.
