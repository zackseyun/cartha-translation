source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: humiliata est, lugete ualidissime. Et nunc quoniam omnes lugemus, et tristes estis, quoniam omnes contristati sumus, tu
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: de
  text: Sie ist gedemütigt worden; trauert bitterlich. Und nun, da wir alle trauern und ihr traurig seid, da wir alle betrübt sind – du aber …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: humiliata est
  choice: Sie ist erniedrigt worden
  rationale: Gibt das feminine Perfekt Passiv formal und ohne Ergänzung eines nicht genannten Subjekts wieder.
- source_word: lugete ualidissime
  choice: trauert aufs Heftigste
  rationale: Bewahrt den überlieferten Pluralimperativ und den verstärkenden Superlativ; die auffällige Lesart wird nicht stillschweigend emendiert.
- source_word: tristes estis
  choice: ihr traurig seid
  rationale: Entspricht der überlieferten zweiten Person Plural, auch wenn sie im Kontext auffällig ist.
- source_word: contristati sumus
  choice: wir alle betrübt sind
  rationale: Bewahrt Person, Numerus und den parallelen Gedanken des lateinischen Textes.
- source_word: tu
  choice: du aber
  rationale: Der Singular und der einsetzende Gegensatz werden wiedergegeben; der Satz bleibt entsprechend dem bereitgestellten Fragment offen.
theological_decisions:
- issue: Textkritisch auffällige Personen- und Numeruswechsel
  choice: Die überlieferte lateinische Form wird übersetzt
  alternative: 'luget und tristes sumus konjizieren: „Sie trauert aufs Bitterste … und wir traurig sind“'
  rationale: Die Vorlage bietet ausdrücklich lugete und tristes estis. Da keine Varianten im Quelldatensatz angegeben sind, wird die Spannung bewahrt statt durch eine Konjektur beseitigt.
- issue: Abgebrochener Versschluss
  choice: „du aber …“
  alternative: 'Aus dem Folgekontext ergänzen: „du aber trauerst um einen einzigen Sohn“'
  rationale: Die bereitgestellte Quelle endet mit tu. Eine Ergänzung wäre zwar kontextuell plausibel, stünde aber nicht im gegebenen Quelltext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abrupten Wechsel zwischen „wir“, „ihr“ und „du“ sowie der unvollständige Schluss spiegeln bewusst die vorgelegte lateinische Textgestalt wider.
