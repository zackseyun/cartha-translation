  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: de
  text: Denn kein von Menschen errichtetes Bauwerk konnte an dem Ort Bestand haben, an dem die Stadt des Höchsten sichtbar zu werden begann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: von Menschen errichtetes Bauwerk
  rationale: Gibt die menschliche Herkunft des Bauwerks natürlich und präzise wieder, ohne das lateinische Genitivgefüge steif nachzubilden.
- source_word: sustinere
  choice: Bestand haben
  rationale: Trifft hier den Sinn von standhalten beziehungsweise fortbestehen und passt idiomatisch zu einem Bauwerk.
- source_word: incipiebat ... ostendi
  choice: sichtbar zu werden begann
  rationale: Bewahrt sowohl den Beginn des Vorgangs als auch die passive Bedeutung von ostendi, ohne ausdrücklich festzulegen, wer die Stadt zeigt.
- source_word: altissimi
  choice: des Höchsten
  rationale: Die etablierte substantivische Gottesbezeichnung gibt den lateinischen Superlativ würdig und knapp wieder.
theological_decisions:
- issue: Handelnder beim Sichtbarwerden der Stadt
  choice: sichtbar zu werden begann
  alternative: sich zu zeigen begann / offenbart zu werden begann
  rationale: Die Formulierung wahrt die passive Offenheit des lateinischen ostendi. Sie schreibt der Stadt keine Eigenhandlung zu und deutet den Vorgang nicht ausdrücklich als Offenbarungshandeln aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am lateinischen Gedankengang, während „von Menschen errichtetes Bauwerk“ und „Bestand haben“ natürlich und allgemein verständlich formuliert sind.
