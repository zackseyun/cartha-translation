  source_fidelity: 'Die Übersetzung gibt den lateinischen Text vollständig und in seiner Satzfolge wieder: die anredende Charakterisierung Gottes (terribilis), aspectus, abyssos im Plural, indignatio, das Kausativ von tabescere facit, die offene Personifikation in ueritas testificatur sowie die anschließende Bitte Exaudi, domine, orationem. Die Auslassung eines abschließenden Satzzeichens entspricht dem fragmentarisch fortlaufenden Satz.'
  naturalness: Die Formulierung ist würdevoll und für gegenwärtige deutsche Gebetssprache verständlich. Die dreifache Folge von „dessen“ bildet die rhetorische Struktur des Lateinischen angemessen nach. „du Ehrfurchtgebietender“ ist bewusst gehoben, aber in diesem Anredekontinuum idiomatisch vertretbar.
  terminology: „Ehrfurchtgebietender“ trifft terribilis im Sinn furchteinflößender göttlicher Majestät ohne die im modernen Alltagsdeutsch vorherrschende negative Wertung von „schrecklich“. „Anblick“, „Abgründe“, „Zorn“, „zerschmelzen lässt“, „Wahrheit Zeugnis ablegt“ und „Erhöre, Herr“ sind quellennah und terminologisch konsistent. Die inhaltliche Offenheit von „dessen Wahrheit Zeugnis ablegt“ bleibt zu Recht erhalten.
