id: 2ES.8.23
reference: 2 Esdras 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: de
  text: 'du Ehrfurchtgebietender, dessen Anblick die Abgründe austrocknet, dessen Zorn die Berge zerschmelzen lässt und dessen Wahrheit Zeugnis ablegt: Erhöre, Herr, das Gebet'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: du Ehrfurchtgebietender
  rationale: Gibt die direkte Anrede und die furchterregende Majestät wieder, ohne das im heutigen Deutsch oft moralisch negative »schrecklich« zu verwenden.
- source_word: aspectus
  choice: Anblick
  rationale: Bezeichnet hier die machtvolle Erscheinung beziehungsweise Gegenwart Gottes; »Anblick« ist natürlich und wahrt die Bildsprache.
- source_word: abyssos
  choice: Abgründe
  rationale: Entspricht dem Plural des lateinischen Textes und lässt die kosmische Bedeutung offen.
- source_word: indignatio
  choice: Zorn
  rationale: Natürliches deutsches Wort für göttlichen Unwillen; stärker und idiomatischer als »Entrüstung«.
- source_word: tabescere facit
  choice: zerschmelzen lässt
  rationale: Bewahrt das Kausativ und das Bild des Dahinschmelzens der Berge.
- source_word: ueritas testificatur
  choice: Wahrheit Zeugnis ablegt
  rationale: Folgt der ungewöhnlichen Personifikation des Ausgangstextes, ohne ihren Bezug näher zu bestimmen.
- source_word: Exaudi
  choice: Erhöre
  rationale: Traditionelle, weiterhin verständliche Gebetssprache für die Bitte, nicht nur zu hören, sondern wohlwollend zu antworten.
theological_decisions:
- issue: Funktion von »terribilis«
  choice: 'Als direkte Anrede Gottes: »du Ehrfurchtgebietender«'
  alternative: »Furchtbar ist er« oder »Schrecklicher«
  rationale: Der anschließende Imperativ »Erhöre, Herr« zeigt den Gebetszusammenhang; die Wiedergabe wahrt Gottes furchteinflößende Majestät, ohne eine moralische Wertung einzutragen.
- issue: Aussage »dessen Wahrheit Zeugnis ablegt«
  choice: Die offene Formulierung des Lateinischen wird beibehalten.
  alternative: Ergänzung eines Gegenstands wie »für ihn« oder »davon«
  rationale: Der Ausgangstext nennt weder den Inhalt noch den Empfänger des Zeugnisses; eine Ergänzung würde die echte syntaktische und theologische Offenheit auflösen.
translation_notes:
  register: Dignitäre, gegenwärtig verständliche Gebetssprache. Die anaphorische Folge »dessen … dessen … dessen …« erhält den feierlichen Rhythmus des lateinischen Textes; der Vers bleibt als fortlaufender Gebetssatz ohne ergänzenden Schlusspunkt wiedergegeben.
