source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
translation:
  language: de
  text: 'Es geschieht auf deinen Befehl, in einem einfachen Ablauf – und wozu geschah es? Und nun will ich sprechen und sagen: Über jeden Menschen weißt du mehr, über dein Volk aber …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Wortlaut dieses Verses endet mitten im Satz; der Gedanke wird im folgenden Vers fortgeführt.
    reason: Das Auslassungszeichen und die Fußnote machen transparent, dass die Unvollständigkeit dem vorgegebenen lateinischen Verswortlaut entspricht und keine Auslassung der Übersetzung ist.
lexical_decisions:
- source_word: tuo iussu
  choice: auf deinen Befehl
  rationale: Gibt den instrumentalen Ablativ natürlich und unmittelbar wieder.
- source_word: facili ordine
  choice: in müheloser Ordnung
  rationale: Bewahrt sowohl den Gedanken der Leichtigkeit als auch den einer geordneten Abfolge; die knappe lateinische Fügung bleibt dabei erkennbar.
- source_word: utquid fiebat?
  choice: wozu geschah es?
  rationale: „Wozu“ wahrt die mögliche finale beziehungsweise fragende Nuance von „utquid“, während das Imperfekt „fiebat“ mit „geschah“ wiedergegeben wird.
- source_word: dicens dicam
  choice: will ich sprechen und sagen
  rationale: Bewahrt die auffällige Doppelung des Lateinischen, ohne sie durch eine nicht ausdrücklich markierte Verstärkung wie „gewiss“ aufzulösen.
- source_word: de omni homine tu magis scis
  choice: Über jeden Menschen weißt du besser Bescheid
  rationale: „Besser Bescheid wissen“ ist modernes, verständliches Deutsch und erhält den im Fragment nicht ergänzten Vergleich von „magis“.
- source_word: de populo autem tuo
  choice: über dein Volk aber …
  rationale: Gibt die adversative Wendung wieder und lässt den am Versende unvollständigen Gedanken bewusst offen.
theological_decisions:
- issue: Unvollständiger Gedanke am Versende
  choice: Keine Aussage über Gottes Volk aus dem Folgevers ergänzen
  alternative: Eine Fortsetzung wie „um das ich Schmerz empfinde“ aus dem anschließenden Kontext vorwegnehmen
  rationale: Der bereitgestellte lateinische Text endet bei „de populo autem tuo“. Eine Ergänzung würde die Versgrenze überschreiten und Text in diesen Vers importieren.
- issue: Mögliche emphatische Kraft von „dicens dicam“
  choice: Die formale Doppelung „sprechen und sagen“ bewahren
  alternative: „Ich werde gewiss sprechen“
  rationale: Die lateinische Form kann eine semitische Verstärkung spiegeln, doch die genaue Funktion bleibt mehrdeutig. Die Übersetzung bewahrt diese Spannung, statt sie eindeutig als Bekräftigung auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Syntax des fragmentarischen lateinischen Ausgangstextes wird lesbar gestaltet, ohne seine Brüche, den offenen Vergleich oder die unvollständige Schlusswendung stillschweigend zu glätten.
