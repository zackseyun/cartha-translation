  rationale: Die Revision bewahrt die Ellipsen, den Tempuswechsel und die auffällige Doppelung von dicens dicam. Sie ersetzt lediglich die semantisch verengende Wiedergabe von magis durch „mehr“ und formuliert facili ordine natürlicher, ohne den Gedanken einer einfachen geordneten Abfolge zu verlieren.
