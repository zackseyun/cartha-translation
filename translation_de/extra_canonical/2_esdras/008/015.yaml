    issue: „magis scis“ mit „weißt du besser Bescheid“ wiedergegeben
    rationale: „Besser Bescheid wissen“ legt nahe, dass Gottes Wissen zutreffender oder genauer sei. Das unergänzte Komparativwort magis bedeutet zunächst „mehr“ und soll, wie im lateinischen Fragment, ohne ausgeschriebenen Vergleichsmaßstab stehen bleiben.
  - severity: low
    issue: „facili ordine“ als „in müheloser Ordnung“
    rationale: „Mühelos“ ist stärker als facile und die Wortverbindung klingt im modernen Deutsch steif. „in einem einfachen Ablauf“ gibt die leichte/geordnete Abfolge idiomatischer wieder.
