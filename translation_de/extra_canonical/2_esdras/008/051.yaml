  verdict: revise
  source_fidelity: „Du aber“ gibt tu autem passend wieder. „pro te intellege“ ist als persönliche Aufforderung zu verstehen; „verstehe für dich selbst“ bewahrt dies unmittelbarer als „gewinne Einsicht für dich selbst“. Bei „de similibus tuis inquire gloriam“ bezeichnet de die Personen, hinsichtlich deren Herrlichkeit nachzuforschen ist. Die vorgeschlagene Fassung sollte daher das Nachfragen/Erkundigen ausdrücken, statt eine Suche nach einer bereits als Besitz dieser Personen festgelegten Herrlichkeit nahezulegen.
  naturalness: „Gewinne Einsicht für dich selbst“ ist verständlich, aber gegenüber dem knappen Imperativ unnötig umschreibend. „Verstehe für dich selbst und erkundige dich nach …“ ist modernes, würdiges Deutsch und hält die Satzstruktur klar.
  terminology: „Herrlichkeit“ ist für gloria angemessen und wahrt den religiös gewichtigen, aber nicht weiter spezifizierten Ausdruck. „Denen, die dir ähnlich sind“ gibt similibus tuis natürlich wieder, ohne die Gruppe theologisch zu bestimmen.
