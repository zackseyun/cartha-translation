    issue: Die Wendung „suche nach der Herrlichkeit derer“ verschiebt inquire in Richtung des aktiven Erwerbs bzw. Aufsuchens einer als Eigentum der Vergleichsgruppe dargestellten Herrlichkeit.
    rationale: inquire gloriam de ist hier sachgerecht als Erkundigung beziehungsweise Nachfrage hinsichtlich der Herrlichkeit von Personen wie dem Angeredeten wiederzugeben. Die revidierte Formulierung lässt offen, worin diese Herrlichkeit besteht.
  - severity: low
    issue: Die Fußnote aus dem englischen Prüfpfad gehört sachlich zu dem vorhergehenden Vers und hat für 2 Esdras 8,51 keinen Anker.
    rationale: Der lateinische Wortlaut dieses Verses enthält die zitierte Aussage über künftige Nöte nicht. Eine deutsche Fußnote ist daher nicht zu übernehmen.
