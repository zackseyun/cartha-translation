  text: But understand for yourself[a], and seek glory among those like you.
translation:
  language: de
  text: Du aber verstehe für dich selbst und erkundige dich nach der Herrlichkeit derer, die dir ähnlich sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu autem
  choice: Du aber
  rationale: Bewahrt den kontrastierenden Übergang und die direkte Anrede.
- source_word: pro te intellege
  choice: gewinne Einsicht für dich selbst
  rationale: Gibt den Imperativ von intellegere und den persönlichen Bezug von pro te verständlich wieder, ohne ihn auf bloßes Selbstverständnis einzuengen.
- source_word: de similibus tuis inquire gloriam
  choice: suche nach der Herrlichkeit derer, die dir ähnlich sind
  rationale: de mit Ablativ wird hier als Bezug auf die Gruppe verstanden, über deren Herrlichkeit Esra nachforschen beziehungsweise nach der er suchen soll. Die Formulierung vermeidet das weniger naheliegende räumliche Verständnis „unter Menschen wie dir“.
theological_decisions:
- issue: Bezug von „Herrlichkeit“ und Funktion von „de similibus tuis“
  choice: „die Herrlichkeit derer, die dir ähnlich sind“
  alternative: „Herrlichkeit unter Menschen wie dir“
  rationale: Die lateinische Konstruktion kann knapp und mehrdeutig wirken. Im Kontext der an Esra gerichteten Ermutigung liegt eine auf seinesgleichen bezogene Herrlichkeit näher als eine Suche innerhalb einer Gruppe; die Ambiguität wird nicht dogmatisch weiter aufgelöst.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Herrlichkeit“ bewahrt den religiösen Bedeutungsumfang von gloria; „gewinne Einsicht“ klingt im Deutschen natürlicher als das wörtliche „verstehe“ mit „für dich selbst“.
