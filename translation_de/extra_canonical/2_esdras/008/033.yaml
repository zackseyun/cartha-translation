review_pass:
  verdict: revise
  source_fidelity: „Denn die Gerechten“ gibt Iusti enim sachgerecht als begründende Fortsetzung wieder. Die Relativkonstruktion sollte jedoch näher bei quibus bleiben, und ex propriis operibus ist im Deutschen nicht idiomatisch mit „aus ihren eigenen Werken“ wiedergegeben.
  naturalness: „für die viele Werke bei dir hinterlegt sind“ ist verständlich, klingt aber verwaltungssprachlich und lässt das im Lateinischen personenbezogene quibus etwas indirekt erscheinen. „denen viele Werke bei dir aufbewahrt sind“ ist natürlicher und bewahrt das Bild des Verwahrtseins. „für ihre eigenen Werke Lohn empfangen“ ist im heutigen gehobenen Standarddeutsch klar und präzise.
  terminology: „Gerechten“ und „Lohn“ sind angemessene, traditionsfähige Wiedergaben von Iusti und mercedem. Die Formulierung vermeidet eine konfessionell-systematisierende Deutung des Verhältnisses von Werken und Lohn.
  issues:
  - severity: low
    issue: Unidiomatische Wiedergabe von ex propriis operibus
    rationale: „aus ihren eigenen Werken Lohn empfangen“ kann im Deutschen eine stoffliche Herkunft des Lohnes nahelegen. Das Latein meint, dass die eigenen Werke die Grundlage beziehungsweise Bezugsgröße des Lohnes sind.
  - severity: low
    issue: Register von „hinterlegt“ und Bezug von quibus
    rationale: „hinterlegt“ wirkt hier unnötig geschäftlich; außerdem ist „denen“ als Bezug auf die Gerechten unmittelbarer als „für die“.
  revised_text: Denn die Gerechten, denen viele Werke bei dir aufbewahrt sind, werden für ihre eigenen Werke Lohn empfangen.
