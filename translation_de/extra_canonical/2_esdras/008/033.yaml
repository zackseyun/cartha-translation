  yaml_path: translation/extra_canonical/2_esdras/008/033.yaml
  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: de
  text: Denn die Gerechten, denen viele Werke bei dir aufbewahrt sind, werden für ihre eigenen Werke Lohn empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iusti enim
  choice: Denn die Gerechten
  rationale: „Denn“ gibt das begründende beziehungsweise erläuternde lateinische „enim“ im fortlaufenden Gedankengang wieder; „die Gerechten“ entspricht substantivisch „Iusti“.
- source_word: quibus sunt operae multae repositae apud te
  choice: für die viele Werke bei dir hinterlegt sind
  rationale: Die Formulierung bewahrt das Bild von Werken, die bei Gott für die Gerechten verwahrt oder gutgeschrieben sind, ohne den Satz unnötig auszudeuten.
- source_word: ex propriis operibus recipient mercedem
  choice: werden aus ihren eigenen Werken Lohn empfangen
  rationale: Die Übersetzung erhält die enge Beziehung zwischen den eigenen Werken und dem empfangenen Lohn sowie die theologische Spannung der Aussage.
theological_decisions:
- issue: Verhältnis von Werken und Lohn
  choice: „aus ihren eigenen Werken Lohn empfangen“
  alternative: „aufgrund ihrer eigenen Werke belohnt werden“
  rationale: Die gewählte Fassung bleibt näher an „ex propriis operibus“ und „mercedem“ und vermeidet es, die Aussage durch eine stärker systematisierende Formulierung festzulegen.
- issue: Funktion von „enim“
  choice: „Denn“
  alternative: „Die Gerechten nämlich …“
  rationale: Im Zusammenhang leitet „enim“ eine Begründung oder Erläuterung ein, keinen Gegensatz; daher ist „Denn“ gegenüber „Aber“ vorzuziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des Hinterlegens und der Lohn aus den eigenen Werken bleiben bewusst erhalten.
