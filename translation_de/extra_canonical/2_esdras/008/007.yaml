  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: de
  text: wird die Stelle eines Menschen einnehmen.[a] Denn du bist allein, und wir sind ein einziges Werk deiner Hände, wie du gesagt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige alte Tochterübersetzungen weisen auf eine griechische Lesart mit der Bedeutung „wird die Gestalt eines Menschen tragen“ hin; die lateinische Überlieferung hat jedoch locum, „Stelle, Ort“.
    reason: Die lateinische Lesart locum („Stelle, Ort“) könnte auf einer frühen Verwechslung der griechischen Wörter für „Stelle“ und „Gestalt“ beruhen. Die Fußnote bewahrt beide ernst zu nehmenden Textzeugnisse.
lexical_decisions:
- source_word: portabit locum hominis
  choice: wird die Stelle eines Menschen einnehmen
  rationale: Das lateinische Futur portabit wird beibehalten; locum ... portare wird im Deutschen idiomatisch mit „die Stelle ... einnehmen“ wiedergegeben, ohne den überlieferten Text stillschweigend zu emendieren.
- source_word: Solus enim es
  choice: Denn du bist allein
  rationale: Gibt solus ohne eine im Lateinischen nicht ausdrücklich genannte Ergänzung wie „Gott“ oder „einer“ wieder und bewahrt die knappe Aussage.
- source_word: una plasmatio
  choice: ein einziges Gebilde
  rationale: plasmatio bezeichnet hier das Geformte beziehungsweise Geschaffene; „Gebilde“ wahrt den Bezug auf Gottes gestaltende Hände.
- source_word: manuum tuarum
  choice: deiner Hände
  rationale: Die konkrete Körpermetapher des lateinischen Textes bleibt erhalten.
theological_decisions:
- issue: Mögliche Aussage über Gottes Einzigkeit in solus enim es
  choice: du bist allein
  alternative: du allein bist einer / du bist der Einzige
  rationale: Der lateinische Wortlaut enthält solus, aber kein ausdrückliches unus. Die Übersetzung ergänzt daher weder eine formale Einheit Aussage noch ein Prädikatsnomen und lässt die theologische Tragweite offen.
- issue: Textkritische Deutung von locum als verderbte Wiedergabe von griechisch typon
  choice: „Stelle“ im Haupttext, textkritische Möglichkeit in der Fußnote
  alternative: „Gestalt“ oder „Bild“ im Haupttext
  rationale: Die angegebene lateinische Leitquelle liest eindeutig locum. Da die angenommene Lesart „Gestalt“ auf Rückübersetzung und Tochterversionen beruht, wird sie transparent als textkritische Alternative genannt, nicht stillschweigend in den Haupttext gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt entsprechend dem vorgelegten Versfragment kleingeschrieben und syntaktisch an den vorhergehenden Kontext angeschlossen. Die ungewöhnliche Knappheit von „du bist allein“ wird bewusst bewahrt.
