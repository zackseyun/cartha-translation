  text: erunt. Neque adtendas impie agentium studia, sed qui tua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
translation:
  language: de
  text: sondern auf die, die dir in Wahrheit gedient haben. Richte deine Aufmerksamkeit nicht auf die Bestrebungen derer, die gottlos handeln,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schenke den Bestrebungen derer, die gottlos handeln, keine Beachtung.'
    reason: Alternative natürliche Wiedergabe von neque adtendas; sie betont das Nichtbeachten statt der bildhaften Ausrichtung der Aufmerksamkeit.
lexical_decisions:
- source_word: adtendas
  choice: Richte deine Aufmerksamkeit … auf
  rationale: Gibt das lateinische attendo im Sinn von »den Sinn auf etwas richten, etwas beachten« klar und in modernem Deutsch wieder.
- source_word: impie agentium
  choice: derer, die gottlos handeln
  rationale: Bewahrt die handelnde, fortdauernde Ausdrucksweise des lateinischen Partizips und übersetzt impie ohne konfessionelle Zuspitzung.
- source_word: studia
  choice: Bestrebungen
  rationale: Erfasst hier die Ziele, Bemühungen oder das Trachten der Gottlosen; »Studien« wäre im heutigen Deutsch irreführend.
- source_word: in veritate servierunt
  choice: dir in Wahrheit gedient haben
  rationale: Die im konsultierten Versanfang bezeugte Wendung wird würdig und formal nah wiedergegeben; der bereitgestellte lateinische Ausschnitt enthält davon nur den Wortausgang »-erunt«.
theological_decisions:
- issue: Bedeutung von impie
  choice: gottlos
  alternative: frevelhaft
  rationale: »Gottlos« entspricht dem religiös-ethischen Gehalt von impie, ohne die Art des Fehlverhaltens enger festzulegen.
- issue: Bezug von studia
  choice: Bestrebungen
  alternative: Trachten
  rationale: »Bestrebungen« lässt offen, ob konkrete Vorhaben, Eifer oder innere Ausrichtung gemeint sind; »Trachten« wäre stärker biblisch-traditionell gefärbt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang ist ein aus dem vorherigen Zusammenhang fortgesetzter Gegensatz; der gelieferte lateinische Ausschnitt setzt erst mit dem Ende des vorausgehenden Verbs (»erunt«) ein. Das abschließende Komma wahrt den im lateinischen Text mit »sed qui tua« weiterlaufenden, hier abgebrochenen Satz.
