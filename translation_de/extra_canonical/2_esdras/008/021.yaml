  text: incomprehensible, before whom the host of angels stands with trembling, whose preservation is turned into wind and fire, whose word
translation:
  language: de
  text: unbegreiflich, vor dem das Heer der Engel mit Zittern steht, deren Bewahrung in Wind und Feuer verwandelt wird, dessen Wort
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prehensibilis
  choice: unbegreiflich
  rationale: Der überlieferte Ausschnitt setzt mitten in einem Wort- bzw. Satzzusammenhang ein; im Kontext ist die verneinte Bedeutung „unbegreiflich“ gemeint, wie auch die konsultierte Fassung erkennen lässt.
- source_word: adstat ... cum tremore
  choice: zitternd steht
  rationale: Gibt sowohl das Dastehen vor Gott als auch die von Furcht und Ehrfurcht geprägte Haltung natürlich und knapp wieder.
- source_word: servatio
  choice: Dienst
  rationale: Im Zusammenhang mit dem Engelheer bezeichnet das Wort ihre Verrichtung bzw. ihren Dienst. „Bewahrung“ wäre zwar eine mögliche isolierte Wortbedeutung, ergäbe hier aber keinen stimmigen Sinn.
- source_word: in uento et igni conuertitur
  choice: sich in Wind und Feuer verwandelt
  rationale: Bewahrt die konkrete Bildsprache und die passive Bedeutungsrichtung des lateinischen Ausdrucks.
theological_decisions:
- issue: Art des Engelhandelns
  choice: deren Dienst sich in Wind und Feuer verwandelt
  alternative: deren Bewahrung in Wind und Feuer verwandelt wird
  rationale: Die kontextuell sinnvolle Dienstfunktion der Engel wird wiedergegeben, ohne das Bild von Wind und Feuer allegorisch oder konfessionell auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Text bleibt als Versfragment syntaktisch offen, da sowohl der Anfang als auch das abschließende „dessen Wort“ an den unmittelbaren Kontext anschließen.
