id: 2ES.8.50
reference: 2 Esdras 8:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Propter quod miseriae multae miserabiles efficientur qui habitant saeculum in nouissimis, quia in multa superbia ambulaūerunt. Tu autem pro te intellege et de similibus tuis inquire
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: de
  text: Darum werden viele schwere Nöte über die kommen, die in den letzten Zeiten die Welt bewohnen, denn sie sind in großem Hochmut ihren Weg gegangen. Du aber gewinne Einsicht für dich selbst und forsche nach denen, die dir gleichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miseriae multae miserabiles
  choice: viele schwere Nöte
  rationale: Gibt die emphatische lateinische Verbindung natürlich und würdevoll wieder, ohne die im Deutschen unbeholfene Wiederholung „elendes Elend“.
- source_word: saeculum
  choice: die Welt
  rationale: Bezeichnet hier den bewohnten gegenwärtigen Weltbereich; „die Welt bewohnen“ entspricht dem Zusammenhang und der lateinischen Wendung.
- source_word: in nouissimis
  choice: in den letzten Zeiten
  rationale: Bewahrt den eschatologischen Zeitsinn der substantivierten Wendung, ohne ihren Umfang näher festzulegen.
- source_word: in multa superbia ambulauerunt
  choice: sie sind in großem Hochmut ihren Weg gegangen
  rationale: Erhält sowohl „superbia“ als Hochmut als auch die bildhafte Lebenswandel-Metapher von „ambulare“.
- source_word: pro te intellege
  choice: gewinne Einsicht für dich selbst
  rationale: Gibt den Imperativ und die auf Esra selbst gerichtete Wendung verständlich wieder, ohne sie als bloß intellektuelles Begreifen zu verengen.
- source_word: de similibus tuis inquire
  choice: forsche nach denen, die dir gleichen
  rationale: Bewahrt die offene Bezugnahme auf Menschen, die Esra ähnlich sind, ohne eine bestimmte Gruppe einzusetzen.
theological_decisions:
- issue: Bezug von „in nouissimis“
  choice: in den letzten Zeiten
  alternative: am Ende
  rationale: Die gewählte Fassung wahrt den pluralischen und zeitlich offenen eschatologischen Ausdruck des Lateins.
- issue: Identität der „similes tui“
  choice: denen, die dir gleichen
  alternative: deinesgleichen / den Menschen, die so sind wie du
  rationale: Der Ausgangstext benennt weder Gerechte noch eine andere theologische Gruppe ausdrücklich; die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige lateinische Häufung bei „miseriae multae miserabiles“ wird idiomatisch verdichtet; die Bildsprache des Wandelns und die offene Bezeichnung der Esra Gleichenden bleiben erhalten. Die überlieferte englische Fußnote gehört inhaltlich zum vorhergehenden Vers und wurde daher nicht übernommen.
