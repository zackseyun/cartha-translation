base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: de
  text: 'Denn wahrhaftig: Unter allen, die geboren sind, gibt es keinen, der nicht gottlos gehandelt hat, und unter denen, die bekennen,[a] keinen, der nicht gesündigt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise ist der lateinische Text hier verderbt. Nach einer vorgeschlagenen Textverbesserung und dem Zeugnis alter Übersetzungen: „unter allen, die leben“ oder „unter allen, die existieren“.'
    reason: textual_variant
lexical_decisions:
- source_word: in veritate enim
  choice: Denn wahrhaftig
  rationale: Gibt sowohl die begründende Funktion von „enim“ als auch die Bekräftigung durch „in veritate“ in natürlichem, würdigem Deutsch wieder.
- source_word: de genitis
  choice: unter allen, die geboren sind
  rationale: Bewahrt den umfassenden Sinn der substantivierten lateinischen Form und klingt im Deutschen natürlicher als „unter den Geborenen“.
- source_word: impie gessit
  choice: gottlos gehandelt hätte
  rationale: „Gottlos“ trifft den religiös-moralischen Gehalt von „impie“, während „gehandelt“ das Verhalten bezeichnet, ohne die Aussage auf einzelne Taten zu verengen.
- source_word: de confitentibus
  choice: unter denen, die bekennen
  rationale: Übersetzt den überlieferten lateinischen Wortlaut „confitentibus“ formal und lässt das im Lateinischen nicht genannte Objekt des Bekennens offen.
- source_word: deliquit
  choice: gesündigt hätte
  rationale: Gibt das moralisch-religiöse Verfehlen im Kontext idiomatisch wieder.
theological_decisions:
- issue: Objekt des Bekennens
  choice: 'Kein Objekt ergänzt: „die bekennen“'
  alternative: „die dich bekennen“ oder „die ihre Sünden bekennen“
  rationale: Der lateinische Text nennt kein Objekt. Eine Ergänzung würde die genuine Mehrdeutigkeit ohne ausreichende Grundlage auflösen.
- issue: Mögliche Textverderbnis bei „confitentibus“
  choice: Den überlieferten lateinischen Wortlaut im Haupttext übersetzen und die Konjektur in einer Fußnote nennen
  alternative: Die konjizierte Lesart „consistentibus“ („die leben/existieren“) in den Haupttext setzen
  rationale: Die vorgelegte lateinische Edition liest „confitentibus“. Da die Tochterübersetzungen nach den Revisionsangaben eine abweichende Vorlage nahelegen, wird die textkritische Alternative transparent gemacht, aber nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Lateinischen bleibt erhalten; die Ellipse „gibt es“ im zweiten Glied ist im Deutschen klar und vermeidet unnötige Wiederholung.
