id: 2ES.8.2
reference: 2 Esdras 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dicam autem coram te similitudinem, Ezra. quomodo autem interrogas terram et dicet tibi quoniam dabit terram multam magis unde fiat fictile, paruum autem puluerem unde aurum fit,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/002.yaml
  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: de
  text: Doch ich will vor dir ein Gleichnis darlegen, Esra.[a] Wenn du nämlich die Erde fragst, wird sie dir sagen, dass sie weit mehr Lehm hervorbringt, aus dem Tongefäße gemacht werden, aber nur wenig Staub, aus dem Gold entsteht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch ich will dir einen Vergleich nennen, Esra.“'
    reason: Die Verbindung aus dicam, coram te und similitudinem lässt sowohl eine stärker formale Wiedergabe mit „darlegen/Gleichnis“ als auch eine idiomatischere mit „nennen/Vergleich“ zu.
  - marker: b
    text: 'Wörtlich: „weit mehr Erde“; gemeint ist Erde beziehungsweise Lehm, aus dem Tongefäße hergestellt werden.'
    reason: Das lateinische terra wird kontextbedingt als „Lehm“ wiedergegeben; die Fußnote bewahrt die wörtliche Bildsprache.
lexical_decisions:
- source_word: similitudinem
  choice: Gleichnis
  rationale: Das lateinische Wort bezeichnet hier einen veranschaulichenden Vergleich; „Gleichnis“ ist im biblischen Register natürlich und wahrt diese Bildfunktion.
- source_word: coram te
  choice: vor dir
  rationale: Die ausdrückliche Gegenwarts- bzw. Adressatenformel des Lateinischen bleibt erhalten.
- source_word: terram multam magis
  choice: weit mehr Lehm
  rationale: „Lehm“ erschließt sich aus dem folgenden Hinweis auf Tongefäße; „weit mehr“ gibt die vergleichende Kraft von multam magis und das Missverhältnis zu paruum wieder.
- source_word: fictile
  choice: Tongefäße
  rationale: Das substantivierte fictile bezeichnet aus Ton geformte Ware; der Plural ist im Deutschen die natürlichste kollektive Wiedergabe.
- source_word: puluerem unde aurum fit
  choice: Staub, aus dem Gold entsteht
  rationale: Die Formulierung bleibt nahe an der bildhaften Aussage des Lateinischen und legt den genaueren Vorgang der Goldgewinnung nicht über den Text hinaus fest.
theological_decisions:
- issue: Missverhältnis zwischen gewöhnlichem Ton und seltenem Gold
  choice: „weit mehr … aber nur wenig“
  alternative: „viel … aber wenig“
  rationale: Die vergleichende Aussage des lateinischen magis ist für die Pointe des Gleichnisses bedeutsam und wird daher ausdrücklich bewahrt, ohne ihre theologische Anwendung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Ton. Die etwas feierliche Wendung „vor dir … darlegen“ bewahrt coram te, während die Satzführung für heutige Leser verständlich bleibt.
