  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Lateins zuverlässig wieder: dicam ... coram te („will vor dir ... darlegen“), similitudinem („Gleichnis“), die hypothetische Anrede an die Erde und den Kontrast zwischen der großen Menge an Material für Tongefäße und der kleinen Menge goldbringenden Staubs. „weit mehr“ bewahrt die vergleichende Kraft von multam magis.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und bleibt gut verständlich. „Ein Gleichnis darlegen“ ist leicht gehoben, aber im biblischen Register natürlich. „Lehm“ und „Tongefäße“ bilden im Deutschen eine klare, idiomatische Verbindung.
  terminology: „Gleichnis“ ist für similitudinem hier vertretbar, da ein bildhafter Vergleich eingeführt wird. „Lehm“ ist eine kontextuelle Konkretisierung von terra, die durch die Fußnote transparent gemacht wird. „Staub, aus dem Gold entsteht“ hält die bildhafte, nicht technisch erklärte Formulierung von puluerem unde aurum fit offen.
