  source_fidelity: 'Die Übersetzung gibt den im bereitgestellten lateinischen Text enthaltenen Imperativsatz vollständig und ohne Zusatz wieder: „Neque indigneris“ ist angemessen als „Sei ... nicht zornig“, „eis qui“ als „auf die, die“, und „bestiis peius sunt“ als „schlimmer sind als Tiere“ übertragen. Der im englischen Audit erwähnte Zusatz „iudicati“ ist im hier maßgeblichen Quelltext nicht vorhanden und wird zu Recht nicht ergänzt.'
