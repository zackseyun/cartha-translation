  yaml_path: translation/extra_canonical/2_esdras/008/030.yaml
  text: Do not be angry with those who are worse than beasts,[a]
translation:
  language: de
  text: Sei auch nicht zornig auf die, die schlimmer sind als Tiere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Neque indigneris
  choice: Sei auch nicht zornig
  rationale: Der lateinische verneinte Konjunktiv drückt eine Bitte bzw. Aufforderung aus; „auch“ gibt neque in seinem fortführenden Sinn natürlich wieder.
- source_word: eis qui
  choice: auf die, die
  rationale: indignari mit Dativ bezeichnet die Personen, gegen die sich der Zorn oder Unwille richtet.
- source_word: bestiis peius sunt
  choice: schlimmer sind als Tiere
  rationale: Bewahrt den Vergleich und die wertende Aussage des Lateinischen ohne den im vorgelegten Quelltext nicht enthaltenen Gedanken des Beurteilens.
theological_decisions:
- issue: Beurteilung oder unmittelbare Charakterisierung
  choice: „die schlimmer sind als Tiere“
  alternative: „die als schlimmer als Tiere gelten/beurteilt worden sind“
  rationale: Der bereitgestellte lateinische Text enthält kein iudicati, sondern unmittelbar bestiis peius sunt. Daher ist keine Beurteilungsinstanz in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das vorangestellte „splendide docuerunt“ wurde nicht aufgenommen, da es syntaktisch als Abschluss des vorausgehenden Kontexts erscheint und die angegebene englische Versabgrenzung 8,30 mit „Neque indigneris“ beginnt.
