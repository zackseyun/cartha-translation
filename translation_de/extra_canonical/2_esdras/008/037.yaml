  yaml_path: translation/extra_canonical/2_esdras/008/037.yaml
  text: According to your words, so it will be. For truly I will not think
translation:
  language: de
  text: Nach deinen Worten wird es so geschehen. Denn wahrlich, ich werde nicht meinen
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuxta sermones tuos
  choice: Nach deinen Worten
  rationale: Gibt die Übereinstimmung mit den zuvor geäußerten Worten natürlich und quellennah wieder.
- source_word: sic et fiet
  choice: wird es so geschehen
  rationale: Bewahrt den Zukunftsbezug und die bekräftigende Bedeutung von „sic et“.
- source_word: uere
  choice: wahrlich
  rationale: Entspricht dem bekräftigenden Adverb und wahrt den würdevollen Ton.
- source_word: non cogitabo
  choice: ich werde nicht meinen
  rationale: Gibt das futurische „cogitabo“ als beginnenden, im vorliegenden Vers unvollendeten Gedankengang wieder; „meinen“ bleibt im Deutschen anschlussfähig, ohne ein nicht überliefertes Objekt zu ergänzen.
theological_decisions:
- issue: Unvollständiger Satz am Versende
  choice: Den Satz ohne ergänztes Objekt offen enden lassen
  alternative: Ein aus dem Folgevers erschlossenes Objekt oder einen Gedanken ergänzen
  rationale: Die vorgelegte lateinische Quelle endet bei „non cogitabo“. Eine Ergänzung würde die fragmentarische Syntax stillschweigend auflösen und möglicherweise Deutung importieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abrupte Unvollständigkeit des zweiten Satzes wird entsprechend der überlieferten Versabgrenzung bewahrt.
