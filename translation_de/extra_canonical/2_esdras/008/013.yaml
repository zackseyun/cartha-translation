source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et mortificabis eum ut tuam creaturam et uiuificabis eum ut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/013.yaml
  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: de
  text: Und du wirst ihn als dein Geschöpf töten und ihn als dein Geschöpf[a] lebendig machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Wortlaut bricht nach dem zweiten „als“ ab; „dein Geschöpf“ ist entsprechend dem parallelen ersten Satzglied ergänzt.
    reason: Die Ergänzung muss kenntlich gemacht werden, da die vorgelegte lateinische Quelle am Versende unvollständig ist.
lexical_decisions:
- source_word: mortificabis
  choice: wirst … töten
  rationale: Gibt das kausative lateinische Verb direkt und verständlich wieder; es bezeichnet hier das Herbeiführen des Todes.
- source_word: tuam creaturam
  choice: dein Geschöpf
  rationale: Bewahrt die Aussage, dass der Betreffende Gottes erschaffenes Wesen ist, ohne einen vom Ausgangstext nicht nahegelegten anderen Begriff einzuführen.
- source_word: uiuificabis
  choice: wirst … lebendig machen
  rationale: Entspricht dem kausativen Sinn des lateinischen Verbs und hält den Gegensatz zu „töten“ klar fest.
theological_decisions:
- issue: Gottes Verhältnis zu Tod und Leben seines Geschöpfes
  choice: Die parallelen Aussagen „töten“ und „lebendig machen“ bleiben unmittelbar nebeneinander stehen.
  alternative: Die erste Aussage abschwächen, etwa zu „sterben lassen“, oder die zweite als bloße Bewahrung deuten.
  rationale: Der lateinische Text verwendet zwei kausative Verben und lässt die theologische Spannung ausdrücklich bestehen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die enge Parallelstruktur des lateinischen Satzes wird bewahrt; die Wiederholung von „als dein Geschöpf“ ist bewusst beibehalten.
