  text: but remember those who have willingly acknowledged your fear. Do not be willing to destroy those who have had the ways of cattle[a], but look upon those who
translation:
  language: de
  text: die sich vor deinen Augen falsch verhalten haben. Gedenke vielmehr derer, die freiwillig die Furcht vor dir erkannt haben. Wolle auch nicht diejenigen vernichten, die sich wie Vieh verhalten haben[a], sondern sieh auf die, die dein Gesetz
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die die Verhaltensweisen des Viehs hatten“.'
    reason: Die Fußnote bewahrt die ungewöhnliche konkrete Ausdrucksweise pecorum mores habuerunt neben der natürlicheren deutschen Wiedergabe.
lexical_decisions:
- source_word: false conuersati sunt
  choice: sich … falsch verhalten haben
  rationale: Gibt das adverbiale false und das auf den Lebenswandel bezogene conversari unmittelbar wieder, ohne die Art des Fehlverhaltens enger festzulegen.
- source_word: memorare
  choice: Gedenke
  rationale: Der Imperativ bezeichnet hier ein erinnerndes, zugewandtes Berücksichtigen; „Gedenke“ ist würdig und im Gebetsregister verständlich.
- source_word: ex uoluntate
  choice: freiwillig
  rationale: Gibt die eigene Willensentscheidung idiomatisch wieder, ohne einen Zwang oder bloße Kenntnis anzudeuten.
- source_word: tuum timorem cognouerunt
  choice: die Furcht vor dir erkannt haben
  rationale: „Furcht vor dir“ macht den objektiven Bezug von tuum timorem im Deutschen deutlich; „erkannt“ bewahrt die Grundbedeutung von cognoscere und lässt die mögliche Bedeutung „anerkannt“ mitschwingen.
- source_word: pecorum mores habuerunt
  choice: die sich wie Vieh verhalten haben
  rationale: Überträgt das konkrete Tierbild in natürliches Deutsch. Die Wendung beschreibt tierähnliche Verhaltensweisen, ohne ausdrücklich über Wesen oder Wert der Personen zu urteilen.
- source_word: respicias
  choice: sieh auf
  rationale: Bewahrt sowohl die wörtliche Blickmetaphorik als auch den Sinn gnädiger Beachtung.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: die Furcht vor dir erkannt haben
  alternative: dir Ehrfurcht entgegengebracht haben
  rationale: „Furcht“ wahrt die Spannung des lateinischen timor und vermeidet eine stillschweigende Abschwächung zu bloßer Ehrfurcht; „vor dir“ verhindert zugleich das Missverständnis, es gehe um eine von Gott empfundene Furcht.
- issue: Wille Gottes in neque uolueris perdere
  choice: Begehre auch nicht, … zu vernichten
  alternative: Will nicht … vernichten
  rationale: Die Formulierung bewahrt den voluntativen Gehalt und die bittende Anrede an Gott, ohne eine dogmatische Aussage über einen feststehenden göttlichen Ratschluss daraus zu machen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit direkter Du-Anrede. Der Satzanfang und das Satzende bleiben fragmentarisch, weil der gelieferte lateinische Ausschnitt mitten im Zusammenhang beginnt und nach „legem tuam“ abbricht. Das Tierbild und die semantische Spannung von timor werden nicht geglättet.
