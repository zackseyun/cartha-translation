id: 2ES.8.34
reference: 2 Esdras 8:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: de
  text: Denn was ist der Mensch, dass du ihm zürnst, oder das vergängliche Menschengeschlecht, dass du ihm gegenüber so erbittert bist?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo
  choice: der Mensch
  rationale: Gibt die allgemeine anthropologische Bezeichnung im Singular natürlich und würdig wieder.
- source_word: indigneris
  choice: zürnst
  rationale: Drückt den gegen eine Person gerichteten Unwillen prägnant aus und bewahrt den feierlichen Ton.
- source_word: genus corruptibile
  choice: das vergängliche Geschlecht
  rationale: Bewahrt sowohl den Kollektivbegriff genus als auch die Sterblichkeit bzw. dem Verfall ausgesetzte Natur von corruptibile, ohne die Aussage auf moralische Verdorbenheit zu verengen.
- source_word: amariceris de ipso
  choice: so erbittert über es bist
  rationale: Gibt den Zustand des Verbittert- bzw. Erbittertseins und den Bezug auf das zuvor genannte Geschlecht möglichst eng wieder.
theological_decisions:
- issue: Bedeutung von corruptibile
  choice: vergänglich
  alternative: verderbt
  rationale: Im Zusammenhang mit Mensch und Geschlecht bezeichnet corruptibile wahrscheinlich die dem Verfall und Tod unterworfene Natur; „verderbt“ würde die mögliche physische bzw. ontologische Bedeutung unnötig moralisch festlegen.
- issue: Intensität und Ausrichtung des göttlichen Unwillens
  choice: dass du so erbittert über es bist
  alternative: dass du ihm gegenüber so verbittert bist
  rationale: Die Formulierung bewahrt die Spannung der direkten Frage an Gott und schwächt amariceris nicht ab; zugleich wird keine Erklärung für den Unwillen hinzugefügt.
translation_notes:
  register: Moderne, würdige Standardsprache mit weitgehend erhaltener lateinischer Parallelstruktur. „Geschlecht“ ist hier kollektiv im Sinn des Menschengeschlechts gebraucht.
