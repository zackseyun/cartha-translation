  text: Sie zeigten Verachtung und verließen seine Wege. Darüber hinaus auch …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contempserunt
  choice: sie zeigten Verachtung
  rationale: Das lateinische Verb steht in diesem Ausschnitt ohne sein zuvor genanntes Objekt. Diese natürliche deutsche Wiedergabe bewahrt die Aussage, ohne ein im vorliegenden Quelltext nicht enthaltenes Objekt einzufügen oder „seine Wege“ fälschlich zum gemeinsamen Objekt beider Verben zu machen.
- source_word: uias eius dereliquerunt
  choice: verließen seine Wege
  rationale: Gibt die Wegmetapher und das possessive „eius“ knapp und formal nah wieder.
- source_word: Adhuc autem et
  choice: Außerdem haben sie auch
  rationale: Bewahrt sowohl den weiterführenden Gedanken als auch das verstärkende „auch“. Die grammatisch offene Form entspricht dem mitten im Satz abbrechenden lateinischen Ausschnitt.
theological_decisions:
- issue: Bezug des Possessivpronomens „eius“
  choice: seine
  alternative: Gottes
  rationale: Das Pronomen wird nicht ausdrücklich zu „Gottes“ aufgelöst; dadurch bleibt der anaphorische Bezug des lateinischen Textes erhalten.
- issue: Nicht genanntes Objekt von „contempserunt“
  choice: kein Objekt ergänzt
  alternative: „sein Gesetz“ ergänzen
  rationale: Obwohl der weitere Kontext ein Objekt erkennen lassen kann, enthält der vorgelegte Quellausschnitt es nicht. Die Übersetzung vermeidet deshalb eine kontextuelle Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Schluss bleibt bewusst unvollständig, weil auch der bereitgestellte lateinische Text mit „et“ abbricht. Die überholte englische Fußnote wurde nicht übernommen, da sie zu einem früher falsch zugeordneten Textabschnitt gehört und für diesen lateinischen Wortlaut keine Variante belegt.
