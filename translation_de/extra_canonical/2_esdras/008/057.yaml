  naturalness: Die Mischung aus Präteritum („zeigten“, „verließen“) und Perfekt („haben“) ist ohne erkennbaren Grund uneinheitlich. Ein bewusst offener, satzfragmentarischer Anschluss ist wegen des Quelltextabbruchs besser als ein unvollständiger Verbalsatz.
  terminology: „Wege“ bewahrt die Metapher von „uias“, und „seine“ erhält den nicht explizit aufgelösten Bezug von „eius“. „Verachtung zeigen“ ist hier eine natürliche Lösung, ohne ein Objekt hinzuzufügen.
