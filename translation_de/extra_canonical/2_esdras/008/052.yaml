  source_fidelity: 'Die Übersetzung folgt der lateinischen Reihung und den sieben prädikativen Perfektpassiven sehr genau: Paradies, Baum des Lebens, kommende Zeit, Fülle, Stadt, Ruhe und Güte sind vollständig und ohne Zusatz wiedergegeben. „Denn“ bildet enim angemessen ab; „für euch“ gibt vobis klar als Plural wieder. „Die kommende Zeit“ ist für futurum tempus sachlich und lässt die genauere eschatologische Einordnung offen.'
