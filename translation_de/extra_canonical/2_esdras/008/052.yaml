  terminology: „Paradies“, „Baum des Lebens“, „Ruhe“ und „Güte“ sind passende, bibelsprachlich verständliche Entsprechungen. „Bestätigt“ ist für probata zwar nicht die einzig mögliche Nuance, aber im Rahmen von „anerkannt/bewährt/geprüft“ vertretbar; die Fußnote dokumentiert die relevante Ambiguität ohne sie dogmatisch aufzulösen.
