id: 2ES.8.52
reference: 2 Esdras 8:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: de
  text: Denn für euch ist das Paradies geöffnet, der Baum des Lebens ist gepflanzt, die kommende Zeit ist vorbereitet, die Fülle steht bereit, die Stadt ist erbaut, die Ruhe ist bestätigt[a], die Güte ist vollendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ruhe ist erprobt“ oder „als bewährt erwiesen“.'
    reason: Das lateinische „probata“ kann bestätigt, geprüft oder als bewährt erwiesen bedeuten.
lexical_decisions:
- source_word: Vobis enim
  choice: Denn für euch
  rationale: Gibt sowohl die begründende Funktion von „enim“ als auch den Plural von „vobis“ natürlich wieder.
- source_word: paradisus
  choice: das Paradies
  rationale: Die direkte und im biblischen Sprachgebrauch geläufige Entsprechung.
- source_word: arbor uitae
  choice: der Baum des Lebens
  rationale: Bewahrt die traditionelle und transparente biblische Bezeichnung.
- source_word: futurum tempus
  choice: die kommende Zeit
  rationale: Folgt dem lateinischen Ausdruck wörtlicher als „die zukünftige Weltzeit“, ohne dessen eschatologischen Bezug festzulegen.
- source_word: habundantia
  choice: die Fülle
  rationale: Gibt den Sinn von Überfluss und reichlichem Vorhandensein knapp und würdig wieder.
- source_word: probata est
  choice: ist bestätigt
  rationale: Bewahrt die passive Form und gibt den Grundsinn von „probata“ wieder, ohne die Ruhe als bloß geprüft oder erfahren darzustellen.
- source_word: perfecta est bonitas
  choice: die Güte ist vollendet
  rationale: Entspricht der parallelen Passivkonstruktion und lässt offen, ob „bonitas“ Güte, Gutheit oder das Gute bezeichnet.
theological_decisions:
- issue: Bedeutung von „futurum tempus“
  choice: die kommende Zeit
  alternative: die zukünftige Weltzeit / das kommende Zeitalter
  rationale: Der lateinische Text spricht von einer kommenden Zeit, ohne die stärker systematisierende Vorstellung eines bestimmten „Zeitalters“ ausdrücklich festzulegen.
- issue: Mehrdeutigkeit von „probata est requies“
  choice: die Ruhe ist bestätigt
  alternative: die Ruhe ist erprobt / als bewährt erwiesen / anerkannt
  rationale: „Probata“ kann Prüfung, Bewährung oder Anerkennung bezeichnen. Die Hauptfassung bleibt knapp und passiv; eine Fußnote weist auf die Spannweite hin.
- issue: Bedeutung von „bonitas“
  choice: die Güte
  alternative: das Gute / die Gutheit
  rationale: „Güte“ ist im Deutschen natürlich und bewahrt die abstrakte Qualität, ohne eine zusätzliche dogmatische Bestimmung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Reihung der sieben passiven Aussagen. Das wiederholte „ist“ erhält den feierlichen Parallelismus des lateinischen Textes; bei „steht bereit“ wurde zugunsten natürlichen Deutschen die idiomatische Entsprechung für „parata est“ gewählt.
