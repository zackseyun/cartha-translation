source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'plantat, sed non in tempore omnia quae seminata sunt saluabuntur, sed nec omnia quae plantata sunt radicabunt, sic et qui in saeculo seminati sunt non omnes saluabuntur. Et respondi et dixi : si inueni gratiam coram te loquar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/041.yaml
  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: de
  text: 'pflanzt; doch nicht alles, was ausgesät worden ist, wird zu seiner Zeit gerettet werden, und auch nicht alles, was gepflanzt worden ist, wird Wurzeln schlagen. So werden auch von denen, die in der Welt[a] ausgesät worden sind, nicht alle gerettet werden.« Da antwortete ich: »Wenn ich vor dir Gnade gefunden habe, lass mich reden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Zeitalter«.'
    reason: Das lateinische saeculum kann sowohl den Weltbereich als auch ein Zeitalter bezeichnen; der Demonstrativzusatz »diesem« ist im Ausgangstext nicht vorhanden.
lexical_decisions:
- source_word: plantat
  choice: pflanzt
  rationale: Gibt den fragmentarischen Anschluss an den vorangehenden Vers wieder, ohne den dortigen Satzanfang in diesen Vers hineinzuziehen.
- source_word: saluabuntur
  choice: werden … gerettet werden
  rationale: Die gleiche Wiedergabe an beiden Stellen bewahrt die ausdrückliche sprachliche Parallele zwischen dem Ausgesäten und den Menschen, auch wenn das Verb im landwirtschaftlichen Bild ungewöhnlich klingt.
- source_word: in tempore
  choice: zu seiner Zeit
  rationale: Nahe Wiedergabe des zeitlichen Ausdrucks, bezogen auf das Ausgesäte und dessen vorgesehene Zeit.
- source_word: radicabunt
  choice: werden Wurzeln schlagen
  rationale: Natürliche deutsche Entsprechung des botanischen Bildes.
- source_word: in saeculo
  choice: in der Welt
  rationale: Im Kontext bezeichnet saeculum den gegenwärtigen Lebens- und Weltbereich; die mögliche Nuance »Zeitalter« bleibt in einer Fußnote erhalten.
- source_word: si inueni gratiam coram te loquar
  choice: Wenn ich vor dir Gnade gefunden habe, lass mich reden
  rationale: Gibt die höfliche Bitte idiomatisch und würdevoll wieder; der lateinische Konjunktiv beziehungsweise die parataktische Form wird als Bitte verstanden.
theological_decisions:
- issue: Wiederholung von saluabuntur im landwirtschaftlichen und menschlichen Vergleich
  choice: Beide Vorkommen mit »gerettet werden« wiedergeben
  alternative: Das erste mit »bewahrt werden«, das zweite mit »gerettet werden« übersetzen
  rationale: Die einheitliche Wiedergabe wahrt die vom lateinischen Text geschaffene theologische und bildhafte Spannung, statt sie durch unterschiedliche deutsche Verben aufzulösen.
- issue: Bedeutungsumfang von saeculum
  choice: »Welt« im Haupttext
  alternative: »Zeitalter«
  rationale: »Welt« ist im Deutschen für den Bereich menschlicher Existenz natürlicher; »Zeitalter« ist lexikalisch möglich und wird als Alternative kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt bewusst fragmentarisch, weil »pflanzt« den Satz aus dem vorhergehenden Vers fortsetzt. Die Wiederholung von »gerettet werden« erhält die auffällige Wortwahl und den inneren Vergleich des lateinischen Textes.
