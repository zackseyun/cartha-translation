  yaml_path: translation/extra_canonical/2_esdras/008/049.yaml
  text: you[a], and have not judged yourself among the righteous, so that you might be more greatly glorified.
translation:
  language: de
  text: dich und hast dich nicht zu den Gerechten gezählt, damit du umso mehr verherrlicht wirst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicasti te inter iustos
  choice: hast dich zu den Gerechten gezählt
  rationale: Die Wendung bezeichnet hier die Selbsteinordnung unter die Gerechten; „gezählt“ ist im Deutschen natürlicher als das wörtliche „gerichtet“, ohne den Sinn zu erweitern.
- source_word: ut plurimum
  choice: damit du umso mehr
  rationale: „Umso mehr“ gibt den steigernden Sinn von „plurimum“ wieder und lässt den von „ut“ ausgedrückten Ziel- oder Folgezusammenhang bestehen.
- source_word: glorificeris
  choice: verherrlicht wirst
  rationale: Das Passiv und der Konjunktiv der lateinischen Form werden im deutschen Nebensatz sachgerecht wiedergegeben.
theological_decisions:
- issue: Bezeichnung der iusti
  choice: die Gerechten
  alternative: die Rechtschaffenen
  rationale: „Die Gerechten“ ist die etablierte und sachlich passende biblische Bezeichnung, ohne näher festzulegen, worauf ihre Gerechtigkeit beruht.
- issue: Zusammenhang zwischen Selbsteinschätzung und Verherrlichung
  choice: damit du umso mehr verherrlicht wirst
  alternative: sodass du umso mehr verherrlicht wirst
  rationale: Das finale „damit“ entspricht „ut“ gut; die im Lateinischen mögliche Nähe zu einer Folge bleibt jedoch sprachlich erkennbar und wird nicht dogmatisch ausgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das einleitende „dich“ bleibt als an den vorausgehenden Satz anschließendes Objekt erhalten, obwohl der vorgelegte Versausschnitt dadurch fragmentarisch beginnt. Die frühere alternative Wiedergabe wird nicht als Fußnote übernommen, da sie Text aus dem vorangehenden Vers betrifft und nicht den hier vorgelegten lateinischen Wortlaut.
