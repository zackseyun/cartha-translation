  source_fidelity: 'Die Übersetzung gibt den lateinischen Satzbau und die Semantik zuverlässig wieder: „Denn wahrlich“ entspricht super, die Zukunftsformen sind erhalten, und der durch eorum nahegelegte Bezug von Tod, Gericht und Verderben auf die Sünder wird mit „ihren“ klar und zutreffend ausgedrückt. Der Gegensatz von plasma/figmentum ist mit der wiederholten „Erschaffung“ nachvollziehbar gewahrt.'
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. Die Reihung „weder ... noch ... oder ...“ ist idiomatisch; die Wiederholung von „Erschaffung“ ist angesichts der bewussten Wiederaufnahme im Ausgangstext angemessen.
  terminology: „Gerechte“ und „Verderben“ sind registergerecht und theologisch nicht einengend. „Gericht“ gibt iudicium präzise wieder. „Erschaffung“ ist für plasma und figmentum eine vertretbare, konsistente Wiedergabe.
