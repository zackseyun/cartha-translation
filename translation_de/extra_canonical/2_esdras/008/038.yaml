source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super plasma eorum qui peccauerunt aut mortem aut iudicium aut perditionem ; Sed iocundabor super iustorum figmentum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: de
  text: Denn wahrlich, ich werde weder an die Erschaffung derer denken, die gesündigt haben, noch an ihren Tod, ihr Gericht oder ihr Verderben; sondern ich werde mich über die Erschaffung der Gerechten freuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plasma / figmentum
  choice: Erschaffung
  rationale: Beide lateinischen Wörter bezeichnen hier das von Gott Geformte beziehungsweise dessen Hervorbringung. „Erschaffung“ ist im Deutschen natürlich und bewahrt den bewussten Gegensatz zwischen den Sündern und den Gerechten.
- source_word: qui peccauerunt
  choice: die gesündigt haben
  rationale: Gibt das Perfektpartizip mit einer klaren, nicht überdeutenden Relativkonstruktion wieder.
- source_word: mortem ... iudicium ... perditionem
  choice: ihren Tod, ihr Gericht oder ihr Verderben
  rationale: Die Possessivpronomen machen den im Lateinischen durch eorum mitgetragenen Bezug auf diejenigen deutlich, die gesündigt haben; „Verderben“ wahrt die mögliche Bedeutung von endgültigem Untergang, ohne sie enger festzulegen.
- source_word: iocundabor super
  choice: ich werde mich über ... freuen
  rationale: Natürliche deutsche Wiedergabe der lateinischen Konstruktion und ihrer Zukunftsform.
theological_decisions:
- issue: Reichweite von eorum bei Tod, Gericht und Verderben
  choice: „ihren Tod, ihr Gericht oder ihr Verderben“ bezieht alle drei Begriffe auf diejenigen, die gesündigt haben.
  alternative: Tod, Gericht und Verderben ohne Possessivbezug als allgemeine Größen verstehen.
  rationale: Die parallelen Akkusative stehen unter derselben gedanklichen Abhängigkeit wie plasma eorum. Der eingeschränkte Bezug vermeidet die sachlich irreführende Aussage, Tod oder Gericht überhaupt würden nicht bedacht.
- issue: Bedeutung von perditionem
  choice: Verderben
  alternative: Vernichtung oder Untergang
  rationale: „Verderben“ erhält die theologische Spannung zwischen Untergang, Verlust und möglicher Vernichtung, ohne eine bestimmte Auslegung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Wiederholung von „Erschaffung“ bewahrt den rhetorischen Gegensatz des lateinischen Textes; die Aufzählung bleibt knapp und feierlich.
