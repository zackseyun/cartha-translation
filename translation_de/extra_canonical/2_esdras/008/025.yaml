  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/025.yaml
  text: Do not look upon the offenses of your people[a], but upon those who have served you in truth.
translation:
  language: de
  text: Sieh nicht auf die Verfehlungen deines Volkes[a], sondern auf die, die dir in Wahrheit gedient haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Fassung lautete hier: „Denn solange ich lebe, will ich reden, und solange ich Einsicht habe, will ich antworten. Sieh nicht auf die Verfehlungen deines Volkes.“ Der erste Satz gehört nach der zugrunde gelegten lateinischen Ausgabe jedoch zu Vers 24.'
    reason: previous_rendering
lexical_decisions:
- source_word: aspicias
  choice: sieh … auf
  rationale: Gibt den verneinten Aufforderungssatz natürlich wieder und erlaubt, das beim zweiten Satzglied ausgelassene Verb sinngemäß mitzudenken.
- source_word: delicta
  choice: Verfehlungen
  rationale: Bezeichnet schuldhafte Übertretungen, ohne den Begriff unnötig auf eine bestimmte Art von Sünde einzuengen.
- source_word: qui tibi in ueritate seruierunt
  choice: die, die dir in Wahrheit gedient haben
  rationale: Bewahrt sowohl den Dienst an Gott als auch die offene Bedeutung von „in Wahrheit“, die Wahrhaftigkeit oder Treue einschließen kann.
theological_decisions:
- issue: Bedeutung von „in ueritate“
  choice: in Wahrheit
  alternative: treu
  rationale: Die wörtlichere Formulierung erhält die mögliche Spannung zwischen wahrhaftigem und treuem Dienst, statt sie auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Konstruktion „Sieh nicht auf …, sondern auf …“ bildet die lateinische Gegenüberstellung klar und natürlich ab.
