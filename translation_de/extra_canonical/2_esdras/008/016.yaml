  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle im lateinischen Versabschnitt enthaltenen Glieder wieder und bewahrt sowohl den Rückbezug von „quod mihi dolet“ als auch den offenen Anschluss am Versende. „Nachkommen Jakobs“ trifft den kollektiven Sinn von „semen Iacob“ gut. Die mehrfach gewählte Präposition „um“ ist jedoch nicht in allen Fällen semantisch passend: Sie klingt bei „um Israel“ nach Gegenstand der Trauer und verwischt die im Lateinischen ausgedrückte kausale Beziehung von „propter quem tristis sum“.'
  naturalness: „dessentwegen“ ist zwar verständlich, wirkt im modernen Standarddeutsch aber deutlich antiquiert und innerhalb der ansonsten modernen Formulierung unnatürlich. Eine formale, aber flüssige Wiedergabe mit „hinsichtlich“ und „über das ich traurig bin“ erhält die Satzstruktur und die Bedeutungsunterscheidung.
  terminology: „Erbe“ ist für „hereditas“ angemessen und bewahrt die Metapher. „trauere“ für „lugeo“ sowie „traurig bin“ für „tristis sum“ unterscheiden die Ausdrücke sinnvoll. „Nachkommenschaft Jakobs“ gibt „semen Iacob“ idiomatisch und kollektiv wieder.
  issues:
