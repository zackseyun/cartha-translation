  text: quod mihi dolet, Et de hereditate tua propter quam lugeo, et de Israel propter quem tristis sum, et de semine Iacob
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/016.yaml
  text: which causes me pain[a], and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am sorrowful, and concerning the seed of Jacob,
translation:
  language: de
  text: was mir weh tut, und hinsichtlich deines Erbes, um das ich trauere, und hinsichtlich Israels, über das ich traurig bin, und hinsichtlich der Nachkommenschaft Jakobs,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod mihi dolet
  choice: was mir weh tut
  rationale: Gibt die unpersönliche lateinische Wendung natürlich wieder und wahrt den Rückbezug auf das Volk im vorhergehenden Vers.
- source_word: hereditate tua
  choice: dein Erbe
  rationale: Entspricht dem Grundsinn von hereditas und bewahrt die biblische Bezeichnung für Gottes Eigentumsvolk.
- source_word: propter quam lugeo
  choice: um das ich trauere
  rationale: Das Relativpronomen bezieht sich auf das Erbe; »trauern« gibt lugeo präzise und idiomatisch wieder.
- source_word: propter quem tristis sum
  choice: dessentwegen ich traurig bin
  rationale: Bewahrt den ausdrücklichen kausalen Bezug auf Israel und unterscheidet tristis sum von lugeo.
- source_word: semine Iacob
  choice: die Nachkommen Jakobs
  rationale: »Nachkommen« vermittelt den kollektiven Sinn von semen in natürlichem modernem Deutsch besser als das wörtliche »Same«.
theological_decisions:
- issue: Bezug von quod mihi dolet
  choice: Als rückbezüglichen Relativsatz »was mir weh tut« stehen lassen
  alternative: Als selbstständige Aussage oder auf das Erbe im selben Vers beziehen
  rationale: Das lateinische Neutrum quod verweist über die Versgrenze zurück, wahrscheinlich auf populum; die Übersetzung wahrt diesen syntaktischen Anschluss, ohne den Bezug im Vers selbst erklärend festzulegen.
- issue: Bedeutung von hereditas
  choice: »Erbe«
  alternative: »Erbteil« oder ausdrücklich »Volk«
  rationale: Die traditionelle Metapher bleibt erhalten; eine Auflösung zu »Volk« würde die Bildsprache und mögliche theologische Spannung unnötig vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fragmentarische, über die Versgrenzen laufende Satzstruktur des lateinischen Textes wird bewusst bewahrt; insbesondere endet der Vers offen mit einem Komma. Die wiederholte Wendung »und um« bildet die parallelen Klageglieder verständlich nach.
