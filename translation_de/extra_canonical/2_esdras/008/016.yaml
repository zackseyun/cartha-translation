    issue: Veraltete und stilistisch harte Formulierung „dessentwegen ich traurig bin“
    rationale: Die Wendung ist in modernem Standarddeutsch kaum noch üblich. Außerdem ist „um Israel“ als Einleitung weniger präzise für die kausale Wendung „propter quem“ als „über Israel ... traurig bin“.
  revised_text: was mir weh tut, und hinsichtlich deines Erbes, um das ich trauere, und hinsichtlich Israels, über das ich traurig bin, und hinsichtlich der Nachkommenschaft Jakobs,
