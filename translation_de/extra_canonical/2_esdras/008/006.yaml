  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: de
  text: O Herr über uns, wenn du deinem Diener erlaubst, dass wir vor dir beten und uns Samen für das Herz und Kultivierung des Verstandes gibst, aus denen Frucht hervorgehen möge, durch sie jeder vergängliche Mensch leben kann,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super nos
  choice: über uns
  rationale: Gibt die Herrschaftsbezeichnung wörtlich und im Deutschen verständlich wieder.
- source_word: semen cordis
  choice: Samen für das Herz
  rationale: Bewahrt das landwirtschaftliche Bild und versteht den Genitiv idiomatisch als Bestimmung des Samens.
- source_word: sensui culturam
  choice: Pflege für den Verstand
  rationale: Bewahrt die Vorstellung des Kultivierens, ohne das im Deutschen unnatürliche „Bebauung des Verstandes“ zu verwenden.
- source_word: omnis corruptus
  choice: jeder vergängliche Mensch
  rationale: Bezeichnet hier am ehesten den sterblichen, dem Verfall unterworfenen Menschen und vermeidet die moderne moralische Bedeutung von „verdorben“.
theological_decisions:
- issue: Wechsel vom singularischen „deinem Diener“ zum pluralischen „wir“
  choice: „deinem Diener erlaubst, dass wir vor dir beten“
  alternative: „deinem Diener erlaubst, vor dir zu beten“
  rationale: Das lateinische „servo tuo“ steht im Singular, „oremus“ dagegen ausdrücklich in der ersten Person Plural. Die Übersetzung bewahrt diesen möglicherweise gemeinschaftlich bedeutsamen Wechsel.
- issue: Bedeutung von „corruptus“
  choice: „vergängliche Mensch“
  alternative: „verdorbene Mensch“
  rationale: Der Zusammenhang zielt auf Sterblichkeit und Verfall; eine moralische Festlegung würde die Aussage unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Saat-und-Pflege-Metaphorik bleibt erkennbar; zugleich wird die ungewöhnliche Numerusverschiebung der lateinischen Vorlage nicht geglättet. Das abschließende Komma signalisiert, wie in der Vorlage und der konsultierten englischen Fassung, den syntaktischen Fortgang in den nächsten Vers.
