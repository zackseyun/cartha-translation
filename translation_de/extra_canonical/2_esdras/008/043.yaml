  text: deinen Regen zu seiner Zeit. Und wenn es durch die Menge des Regens verdorben wird, vergeht es. Doch der Mensch, der von deinen Händen geformt worden ist und …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorgelegte lateinische Text bricht an dieser Stelle nach „und“ ab.
    reason: Kennzeichnet die Unvollständigkeit der maßgeblichen Quellenangabe und erklärt den Auslassungspunkt.
lexical_decisions:
- source_word: pluuiam tuam in tempore
  choice: deinen Regen zu seiner Zeit
  rationale: Gibt die zeitliche Wendung eng und natürlich wieder, ohne »tempore« deutend zu »zur rechten Zeit« zu erweitern.
- source_word: corruptum fuerit
  choice: verdorben wird
  rationale: Bewahrt die breite Bedeutung von »corrumpere«; im Zusammenhang kann damit eine Schädigung oder Zerstörung durch übermäßigen Regen gemeint sein.
- source_word: multitudine pluuiae
  choice: durch die Menge des Regens
  rationale: Folgt der konkreten Ausdrucksweise des Lateinischen und bezeichnet ein Übermaß an Regen.
- source_word: plasmatus est
  choice: geformt worden ist
  rationale: Gibt das handwerklich-schöpferische Bild des Verbs »plasmare« wieder und passt zu »von deinen Händen«.
theological_decisions:
- issue: Fortsetzung über den erhaltenen lateinischen Wortlaut hinaus
  choice: Der Satzabbruch nach »und« wird sichtbar bewahrt.
  alternative: Die englische Konsultationsfassung mit »dein Bild genannt wird« ergänzen.
  rationale: Der vorgelegte lateinische Quelltext endet mit »et« und belegt die englische Fortsetzung nicht. Eine theologisch bedeutsame Aussage über die Gottebenbildlichkeit darf nicht ohne entsprechende Quelle in den Text eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt wegen des fragmentarischen Ausgangstextes bewusst unvollständig; die Mehrdeutigkeit des nicht ausdrücklich genannten Bezugs von »es« wird nicht aufgelöst.
