id: 2ES.8.8
reference: 2 Esdras 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: de
  text: Und weil du Leben gibst, belebst du nun im Mutterleib den geformten Körper und gibst ihm Glieder. Deine Schöpfung wird in Feuer und Wasser bewahrt, und neun Monate lang trägt[a] dein Gebilde dein Geschöpf, das darin[b] erschaffen worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erträgt“.'
    reason: Das lateinische patitur kann sowohl das Tragen im Sinne der Schwangerschaft als auch das Erdulden oder Ertragen bezeichnen.
  - marker: b
    text: 'Wahrscheinlich: in dem Körper; der Bezug des lateinischen Ausdrucks ist jedoch nicht völlig eindeutig.'
    reason: Das neutrale eo kann auf corpus zurückweisen, steht aber in einer syntaktisch schwierigen Schlussklausel.
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: du Leben gibst, belebst du
  rationale: Bewahrt die rhetorische Wiederholung desselben lateinischen Wortstamms, ohne im Deutschen unnatürlich zu klingen.
- source_word: in matrice
  choice: im Mutterleib
  rationale: Gibt den gemeinten Ort der vorgeburtlichen Entwicklung in natürlichem modernem Deutsch wieder.
- source_word: plasmatum corpus
  choice: den geformten Körper
  rationale: Formale und zugleich verständliche Wiedergabe des bereits gestalteten Körpers.
- source_word: praestas membra
  choice: gibst ihm Glieder
  rationale: Das im Lateinischen implizite Bezugswort wird durch „ihm“ verdeutlicht; „Glieder“ wahrt den körperlichen Sinn von membra.
- source_word: in igni et aqua tua creatio
  choice: Deine Schöpfung wird in Feuer und Wasser bewahrt
  rationale: Das feminine tua stimmt grammatisch mit creatio überein, nicht mit igni oder aqua; daher sind Feuer und Wasser nicht als „dein“ gekennzeichnet.
- source_word: tua plasmatio
  choice: dein Gebilde
  rationale: Bezeichnet hier plausibel das von Gott Geformte beziehungsweise den tragenden Körper; „Gebilde“ erhält den Bezug zum Formen, ohne den schwierigen Ausdruck vorschnell auszudeuten.
- source_word: patitur
  choice: trägt
  rationale: Im Zusammenhang der neunmonatigen Schwangerschaft ist „trägt“ idiomatisch und lässt zugleich die Grundvorstellung des Ertragens anklingen.
theological_decisions:
- issue: Bezug von tua in „in igni et aqua tua creatio“
  choice: „Deine Schöpfung“
  alternative: „dein Feuer und Wasser“
  rationale: Kasus, Genus und Numerus verbinden tua eindeutig mit der femininen Singularform creatio; eine Zuordnung zu igni und aqua ist grammatisch nicht haltbar.
- issue: Bedeutung von patitur im Schwangerschaftskontext
  choice: „trägt“
  alternative: „erträgt“ oder „hält aus“
  rationale: „Trägt“ passt zur neunmonatigen Schwangerschaft und wahrt das Bild, ohne Leiden als ausdrücklich theologische Aussage einzutragen.
- issue: Bezug von „in eo“
  choice: „darin“ ohne ausdrückliche Auflösung des Bezugs
  alternative: „in ihm“ mit eindeutigem Bezug auf den Körper
  rationale: Das lateinische Neutrum eo weist wahrscheinlich auf corpus zurück, doch die Satzfügung ist schwierig. Die neutrale deutsche Form bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Leben geben/beleben“ spiegelt die lateinische Wortfigur; die schwerfällige lateinische Konstruktion wird in zwei Hauptsätze gegliedert, ohne ihren Gedankengang oder ihre Mehrdeutigkeiten zu glätten.
