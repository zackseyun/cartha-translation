  text: Ich habe es allen gezeigt[a], nur nicht dir und den wenigen, die dir ähnlich sind. Und …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte lateinische Text lautet: „omnibus demonstraui nisi tibi et tibi similibus paucis. et re-“. Er bricht nach dem Beginn des folgenden Wortes ab. Die Aussage, dass es allen außer dir und wenigen dir Ähnlichen gezeigt wurde, wird daher im Haupttext nach dem erhaltenen Wortlaut wiedergegeben.'
    reason: Dokumentiert den tatsächlichen fragmentarischen Befund und die auffällige, aber überlieferte Ausschlussformulierung, ohne eine unbelegte Negation oder einen längeren rekonstruierten Kontext einzufügen.
lexical_decisions:
- source_word: omnibus demonstraui
  choice: Ich habe dies allen gezeigt
  rationale: Gibt die überlieferte Wortfolge und den Perfektcharakter direkt wieder; „dies“ nimmt den nicht ausdrücklich genannten Gegenstand aus dem Zusammenhang auf.
- source_word: nisi tibi et tibi similibus paucis
  choice: außer dir und wenigen, die dir ähnlich sind
  rationale: Bewahrt die normale ausschließende Bedeutung von „nisi“ und die knappe Formulierung des lateinischen Fragments, obwohl dadurch im überlieferten Wortlaut eine inhaltliche Spannung entsteht.
- source_word: et re-
  choice: Und …
  rationale: Der Quellenausschnitt bricht nach „et“ mitten im folgenden Wort ab; die Auslassungspunkte machen den unvollständigen Fortgang sichtbar, ohne ihn zu ergänzen.
theological_decisions:
- issue: Ob der Satz eine eingeschränkte Offenbarung nur an Esra und wenige Gleichgesinnte meint
  choice: Die erhaltene Formulierung wird im Haupttext formal bewahrt; die wahrscheinlich gemeinte Gegenlesart wird in der Fußnote genannt.
  alternative: „… das ich nicht allen gezeigt habe, sondern nur dir und wenigen, die dir ähnlich sind.“
  rationale: 'Das vorhandene lateinische Fragment lautet ohne „non“: „omnibus demonstraui nisi …“. Eine stillschweigende Ergänzung von „nicht“ würde die theologisch bedeutsame Reichweite der Offenbarung eindeutig festlegen, obwohl der vorgelegte Wortlaut beschädigt oder syntaktisch unvollständig sein kann.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Spannung des beschädigten lateinischen Wortlauts wird nicht stillschweigend geglättet; der abgebrochene Anschluss bleibt durch „Und …“ erkennbar.
