lexical_decisions:
- source_word: in ea creata fuerint
  choice: die in ihr geschaffen worden sind
  rationale: Gibt den passivischen lateinischen Ausdruck und den Rückverweis des femininen Pronomens ea eng wieder; der vorliegende Text ist ein satzübergreifendes Fragment.
- source_word: Imperasti
  choice: hast du geboten
  rationale: Das lateinische Perfekt wird im natürlichen modernen Deutsch als Perfekt wiedergegeben.
- source_word: ex ipsis membris
  choice: aus eben diesen Gliedern
  rationale: „aus“ bewahrt die Herkunftsangabe von ex; „eben diesen“ gibt die hervorhebende Kraft von ipsis wieder, und „Glieder“ lässt den körperlichen Bezug von membris bestehen.
- source_word: hoc est
  choice: das heißt
  rationale: Natürliche und genaue deutsche Entsprechung der erläuternden Formel.
