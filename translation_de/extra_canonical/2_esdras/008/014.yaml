    issue: Mehrdeutige deutsche Fügung „unter so großen Mühen“
    rationale: Die Präposition „unter“ kann die Mühen dem Geformten zuschreiben. Das lateinische „tantis laboribus“ bezeichnet hier den Aufwand des Formens; „mit so großer Mühe“ macht dies klarer.
