  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: de
  text: dein Werk. Wenn du also den vernichtest, der mit so großer Mühe geformt wurde …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuum opus
  choice: dein Werk
  rationale: Gibt die knappe Nominalphrase wörtlich und in natürlichem Deutsch wieder; der Satzanfang setzt offenbar den vorhergehenden Vers fort.
- source_word: perdideris
  choice: vernichtest
  rationale: Bewahrt die starke Bedeutung von perdere und passt zum rhetorischen Gegensatz zwischen Formen und Vernichten.
- source_word: tantis laboribus
  choice: unter so großen Mühen
  rationale: Gibt sowohl das Ausmaß von tantis als auch den Aufwand von laboribus idiomatisch wieder.
- source_word: plasmatus
  choice: geformt wurde
  rationale: Entspricht dem bildhaften Schöpfungsverb plasmare, ohne eine bestimmte Art der Formung hinzuzufügen.
theological_decisions:
- issue: Bezugswort des nicht ausdrücklich genannten Objekts bei perdideris
  choice: den …, der
  alternative: es …, das
  rationale: Das maskuline Relativpronomen qui verweist auf eine männlich gedachte Person; die Übersetzung macht diesen grammatischen Bezug sichtbar, ohne die Person näher zu bestimmen.
- issue: Im englischen Beratungstext ergänzte Schlussfrage
  choice: nicht aufgenommen
  alternative: „warum wurde er dann geschaffen?“
  rationale: Die bereitgestellte lateinische Quelle endet bei plasmatus und enthält diese Frage nicht. Die Auslassungspunkte bewahren den fragmentarischen Charakter der vorliegenden Quelle, statt nicht belegten Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Kleinschreibung am Anfang und die Auslassungspunkte spiegeln wider, dass der überlieferte Ausschnitt sowohl an einen vorausgehenden Satz anschließt als auch unvollständig endet.
