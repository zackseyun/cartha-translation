source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: peregrinationis quoque et saluationis et mercedis receptionis. Quomodo ergo locutus sum, sic et est. Sicut enim agricola
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/039.yaml
  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: de
  text: Doch ich werde mich über die Erschaffung der Gerechten[a] freuen, ebenso über ihre Pilgerschaft, ihre Rettung und den Empfang ihres Lohnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das Gebilde der Gerechten“; das zugrunde liegende Wort kann sowohl das Formen als auch das Geformte bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: plasma iustorum
  choice: die Erschaffung der Gerechten
  rationale: „Plasma“ bezeichnet das Formen beziehungsweise das daraus hervorgegangene Gebilde. „Erschaffung“ gibt hier den Vorgang würdig und verständlich wieder, ohne die Gerechten bloß als abstrakte „Formung“ zu bezeichnen.
- source_word: peregrinationis
  choice: ihre Pilgerschaft
  rationale: Das lateinische Wort bezeichnet den Aufenthalt in der Fremde beziehungsweise die irdische Wanderschaft. „Pilgerschaft“ bewahrt sowohl den konkreten Wegcharakter als auch den religiösen Klang.
- source_word: saluationis
  choice: ihre Rettung
  rationale: „Rettung“ ist eine natürliche moderne Wiedergabe von „salus/saluatio“ und lässt sowohl Bewahrung als auch endzeitliches Heil zu.
- source_word: mercedis receptionis
  choice: den Empfang ihres Lohnes
  rationale: Die Genitivverbindung wird im Deutschen idiomatisch mit „Empfang ihres Lohnes“ wiedergegeben; „Lohn“ bewahrt den Vergeltungs- beziehungsweise Belohnungsgedanken von „merces“.
theological_decisions:
- issue: Bezug der Genitive auf die Gerechten
  choice: Possessivpronomen „ihre/ihres“ ergänzt
  alternative: 'unbestimmte Abstrakta: „Pilgerschaft, Rettung und Empfang des Lohnes“'
  rationale: Die Genitive beziehen sich sinngemäß auf die zuvor genannten Gerechten. Die Possessivformen machen diesen konkreten Bezug im Deutschen sichtbar, ohne zusätzliche Lehraussagen einzutragen.
- issue: Bedeutung von „plasma“
  choice: Erschaffung
  alternative: Formung oder Geschöpf
  rationale: Der Ausdruck kann Vorgang oder Ergebnis des Formens bezeichnen. Im Haupttext steht die im Zusammenhang natürliche Vorgangslesart; die sachliche Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufzählung bleibt erhalten; „ebenso“ gibt „quoque“ natürlich wieder. Der adversative Einstieg „Doch“ folgt der konsultierten Versfassung, obwohl der bereitgestellte lateinische Ausschnitt erst innerhalb der Aufzählung einsetzt.
