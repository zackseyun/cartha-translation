source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: inquirendo de multitudine eorum qui pereunt. Nam et ipsi accipientes libertatem spreuerunt altissimum et legem eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/056.yaml
  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: de
  text: nach der Menge derer zu fragen, die zugrunde gehen. Denn auch sie selbst haben, nachdem sie Freiheit empfangen hatten, den Höchsten und sein Gesetz verachtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inquirendo de multitudine
  choice: nach der Menge … zu fragen
  rationale: Gibt das lateinische Gerundium und de als fortlaufende, vom vorherigen Zusammenhang abhängige Wendung wieder, ohne einen eigenständigen Hauptsatz zu ergänzen.
- source_word: pereunt
  choice: zugrunde gehen
  rationale: Bewahrt den umfassenden Sinn von perire, ohne ihn vorschnell auf körperliches Sterben oder endgültige Verdammnis festzulegen.
- source_word: accipientes libertatem
  choice: nachdem sie Freiheit empfangen hatten
  rationale: Drückt die dem Verachten vorausliegende Einräumung von Freiheit natürlich aus; »Freiheit« bleibt bewusst allgemein und wird nicht deutend zu »Willensfreiheit« erweitert.
- source_word: spreuerunt
  choice: haben … verachtet
  rationale: 'Entspricht dem starken Sinn von spernere: geringschätzen, verschmähen oder verachten.'
- source_word: altissimum
  choice: den Höchsten
  rationale: Die substantivierte Gottesbezeichnung wird in der im Deutschen üblichen ehrwürdigen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung der empfangenen libertas
  choice: Freiheit
  alternative: Willensfreiheit / freien Willen
  rationale: Der lateinische Text nennt libertas, erläutert aber ihre genaue theologische Bedeutung nicht. Die allgemeinere Wiedergabe bewahrt diese Offenheit.
- issue: Reichweite von pereunt
  choice: die zugrunde gehen
  alternative: die verdammt werden / die sterben
  rationale: Die Übersetzung vermeidet es, die Art oder Endgültigkeit ihres Verderbens über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anschluss mit »nach … zu fragen« bleibt erhalten, weil inquirendo syntaktisch an den vorherigen Verszusammenhang gebunden ist. Die englische Fußnote wurde nicht übernommen, da sie eine frühere, nachweislich versfremde Wiedergabe enthält und keine echte Textvariante zu diesem lateinischen Ausgangstext darstellt.
