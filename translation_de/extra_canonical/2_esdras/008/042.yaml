  text: For if the farmer’s seed does not come up[a], for it did not receive,
translation:
  language: de
  text: Denn wenn die Saat eines Bauern nicht aufgeht – sie hat ja nicht empfangen …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Satz bricht hier unvollständig ab; was die Saat nicht empfangen hat, wird im vorliegenden Text nicht genannt.
