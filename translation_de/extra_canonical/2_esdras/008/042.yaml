lexical_decisions:
- source_word: Quoniam
  choice: Denn
  rationale: Bewahrt den begründenden Anschluss an den vorausgehenden Gedankengang.
- source_word: semen agricolae
  choice: die Saat des Bauern
  rationale: Gibt sowohl das Saatgut als auch seinen Bezug zum Bauern natürlich und ohne unnötige Präzisierung wieder.
- source_word: si non ascenderit
  choice: wenn … nicht aufgeht
  rationale: „Aufgehen“ ist die übliche deutsche Bezeichnung für das Keimen und Hervorkommen ausgesäter Saat.
- source_word: non enim accepit
  choice: sie hat ja nichts empfangen
  rationale: „Ja“ bildet die begründende Funktion von enim ab; „nichts“ macht den im Lateinischen ausgelassenen Gegenstand im Deutschen knapp kenntlich, ohne ihn etwa als Regen zu bestimmen.
theological_decisions:
- issue: Unvollständiger überlieferter Satz
  choice: Den Abbruch durch Auslassungspunkte sichtbar bewahren
  alternative: Den Satz mit Angaben über Regen ergänzen
  rationale: Der angegebene lateinische Text endet mit dem transitiven Verb „accepit“, ohne dessen Gegenstand zu nennen. Eine Ergänzung mit Regen oder dessen rechter Zeit würde nicht aus dieser Quelle stammen und könnte die Aussage unzulässig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich und die Auslassungspunkte lassen die bruchstückhafte Syntax der lateinischen Vorlage erkennen, ohne fehlenden Inhalt zu ergänzen.
