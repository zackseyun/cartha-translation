source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: serui tui et auribus percipe precationem figmenti tui, intende uerba mea. Dum enim uiuo loquar et dum sapio respondeam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: de
  text: Höre, Herr, das Gebet deines Dieners, und schenke dem Flehen deines Geschöpfes Gehör; achte auf meine Worte. Denn solange ich lebe, werde ich reden, und solange ich Einsicht habe, werde ich antworten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auribus percipe
  choice: schenke … Gehör
  rationale: Gibt die lateinische Wendung idiomatisch, würdig und mit ihrem ausdrücklichen Hörmotiv wieder.
- source_word: figmenti tui
  choice: deines Geschöpfes
  rationale: Bezeichnet das von Gott geformte Wesen und bewahrt den Gedanken geschöpflicher Abhängigkeit, ohne das unnatürliche „Gebilde“ zu verwenden.
- source_word: intende
  choice: achte auf
  rationale: Entspricht dem Aufmerksamsein auf die Worte in natürlichem modernem Deutsch.
- source_word: dum sapio
  choice: solange ich bei Verstand bin
  rationale: Gibt sapio hier als vorhandenes Verständnis beziehungsweise geistige Besonnenheit wieder und passt zum parallelen dum vivo.
- source_word: respondeam
  choice: will ich antworten
  rationale: Bewahrt die Grundbedeutung des lateinischen Verbs und die offene Frage, wem oder worauf geantwortet wird.
theological_decisions:
- issue: figmentum als Bezeichnung des Betenden
  choice: Geschöpf
  alternative: Gebilde / von dir Geformter
  rationale: „Geschöpf“ vermittelt Gottes Schöpferhandeln und die demütige Abhängigkeit des Menschen, ohne über den lateinischen Text hinaus eine bestimmte Anthropologie festzulegen.
- issue: Modalität von loquar und respondeam
  choice: will ich reden / will ich antworten
  alternative: werde ich reden / werde ich antworten
  rationale: Der Kontext einer Gebetsbitte lässt eine willentliche beziehungsweise entschlossene Nuance zu; „will ich“ wahrt diese, ohne eine Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit klarer Parallelstruktur. „Schenke … Gehör“ hält den liturgischen Ton, während „achte auf“ und „bei Verstand“ für heutige Leser unmittelbar verständlich bleiben.
