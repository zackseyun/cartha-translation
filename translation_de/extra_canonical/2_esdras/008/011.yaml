source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: de
  text: Aus den Brüsten wird Milch gereicht, die Frucht der Brüste, damit das, was geformt worden ist, eine gewisse Zeit lang ernährt wird; danach wirst du es durch dein Erbarmen führen. Du hast es in deiner Gerechtigkeit genährt, es in deinem Gesetz unterwiesen und es durch deine Einsicht zurechtgewiesen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeberi lac
  choice: wird Milch gereicht
  rationale: Gibt den passiven Infinitiv der fragmentarisch einsetzenden lateinischen Konstruktion natürlich und ohne zusätzliche Ergänzungen wieder.
- source_word: fructum mamillarum
  choice: die Frucht der Brüste
  rationale: Bewahrt das konkrete, wiederholende Bild des lateinischen Ausdrucks.
- source_word: id quod plasmatum est
  choice: das, was geformt worden ist
  rationale: Entspricht der sachlichen Passivform und vermeidet, das Geformte ausdrücklich als Kind oder Mensch zu bestimmen.
- source_word: dispones
  choice: wirst du … lenken
  rationale: Das Futur wird erhalten; „lenken“ gibt hier die Bedeutung des Ordnens und Leitens wieder.
- source_word: Enutristi
  choice: Du hast … aufgezogen
  rationale: Bezeichnet mehr als bloße Ernährung und passt natürlich zur Entwicklung des geformten Wesens.
- source_word: corripuisti
  choice: zurechtgewiesen
  rationale: Gibt den erzieherisch-korrigierenden Sinn wieder, ohne unnötig eine körperliche Züchtigung anzudeuten.
theological_decisions:
- issue: Funktion von tuae misericordiae bei dispones
  choice: durch dein Erbarmen
  alternative: deinem Erbarmen anvertrauen
  rationale: Die instrumentale Deutung passt zum parallelen Gebrauch von tuae iusticiae und tuo intellectu und bewahrt Gottes aktives Lenken; die Dativkonstruktion lässt jedoch auch die alternative Zuordnungsdeutung zu.
- issue: Geschlechtlicher Wechsel von id zu eum
  choice: durchgehend „es“
  alternative: nach „das, was geformt worden ist“ zu „ihn“ wechseln
  rationale: Das Deutsche verlangt beim substantivierten Neutrum einen entsprechenden Rückbezug. Die einheitliche Form vermeidet einen künstlichen Geschlechtswechsel, ohne das Wesen näher zu bestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der fragmentarische Einsatz des Verses und das abschließende Komma der fortlaufenden Satzperiode bleiben erkennbar; die konkreten Bilder des Ausgangstextes werden nicht geglättet.
