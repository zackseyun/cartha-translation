source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: de
  text: Denn darin werden deine Gerechtigkeit und deine Güte verkündet werden, Herr, wenn du dich über die erbarmst, die keinen Vorrat an guten Werken haben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: In hoc
  choice: darin
  rationale: Bewahrt den rückbezüglichen Sinn knapp und natürlich.
- source_word: adnuntiabitur
  choice: werden … verkündet werden
  rationale: Gibt das lateinische Futur Passiv und den öffentlichen Bekanntmachungsaspekt wieder.
- source_word: iusticia tua et bonitas tua
  choice: deine Gerechtigkeit und deine Güte
  rationale: Entspricht den beiden ausdrücklich genannten göttlichen Eigenschaften, ohne sie deutend zusammenzuziehen.
- source_word: cum misertus fueris
  choice: wenn du dich … erbarmst
  rationale: Gibt den zeitlich-bedingenden Zusammenhang idiomatisch wieder; das Futurperfekt bezeichnet die vorausgesetzte Erweisung des Erbarmens.
- source_word: non habent substantiam operum bonorum
  choice: keinen Bestand an guten Werken haben
  rationale: Bewahrt die ungewöhnliche, möglicherweise quantitative Metapher von substantia näher als eine freie Umschreibung wie „keine guten Werke vorzuweisen haben“.
theological_decisions:
- issue: Verhältnis von Gottes Gerechtigkeit und Erbarmen gegenüber Menschen ohne gute Werke
  choice: Die Aussage bleibt stehen, dass gerade Gottes Erbarmen seine Gerechtigkeit und Güte kundmacht.
  alternative: Gerechtigkeit als strafende Vergeltung deuten oder das Erbarmen von unausgesprochenen Voraussetzungen abhängig machen.
  rationale: Der lateinische Text verbindet iusticia, bonitas und misericordia ausdrücklich und bietet hier keine Grundlage, diese Spannung durch dogmatische Zusätze aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgestalt folgt der argumentativen Betonung des lateinischen Textes; „Bestand an guten Werken“ erhält dessen markante Ausdrucksweise.
