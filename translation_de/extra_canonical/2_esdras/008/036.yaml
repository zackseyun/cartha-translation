review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des Lateins zuverlässig wieder: „in hoc“, die beiden göttlichen Eigenschaften, das Futurpassiv von „adnuntiabitur“ sowie das Erbarmen gegenüber Menschen ohne „substantia operum bonorum“. „Bestand“ ist jedoch für „substantia“ hier weniger treffend als die quantitative Metapher „Vorrat“.'
  naturalness: „Keinen Bestand an guten Werken haben“ wirkt im modernen Standarddeutsch sachlich-administrativ und ist in diesem Kontext nicht idiomatisch. „Keinen Vorrat an guten Werken haben“ bleibt bildhaft und ist klar verständlich. Der Doppelinfinitiv im Futurpassiv ist grammatisch korrekt; die Kommasetzung fügt den wenn-Satz natürlicher an als ein Doppelpunkt.
  terminology: „Gerechtigkeit“, „Güte“, „Herr“ und „sich erbarmen“ sind registergerecht und terminologisch angemessen. „Vorrat an guten Werken“ wahrt die ungewöhnliche quantitative Ausdrucksweise von „substantia“, ohne eine dogmatisch stärker bestimmte Deutung einzutragen.
  issues:
  - severity: low
    issue: „Bestand an guten Werken“ für „substantia operum bonorum“
    rationale: „Bestand“ kann zwar Menge bedeuten, klingt hier aber unnatürlich und nach Lager- oder Verwaltungsbestand. „Vorrat“ bildet den gemeinten verfügbaren Fundus bzw. die Ansammlung guter Werke idiomatischer ab.
  - severity: low
    issue: Doppelpunkt vor dem wenn-Satz
    rationale: Der lateinische cum-Satz ist eng in den Gedankengang eingebunden. Ein Komma ist im Deutschen die natürlichere und weniger stark gliedernde Zeichensetzung.
  revised_text: Denn darin werden deine Gerechtigkeit und deine Güte verkündet werden, Herr, wenn du dich über die erbarmst, die keinen Vorrat an guten Werken haben.“
