lexical_decisions:
- source_word: fecit
  choice: geschaffen hat
  rationale: Im Zusammenhang mit Menschen bezeichnet facere Gottes Erschaffen; das Perfekt wird im Deutschen natürlich mit dem Perfekt wiedergegeben.
- source_word: ingrati fuerunt
  choice: sie waren undankbar
  rationale: Gibt die ausdrücklich benannte Undankbarkeit direkt wieder.
- source_word: praeparauit eis uitam
  choice: ihnen das Leben bereitet hat
  rationale: Bewahrt das Bild des Bereitens und vermeidet eine weitergehende Deutung von vita.
- source_word: iudicium meum modo adpropinquat
  choice: jetzt naht mein Gericht
  rationale: Gibt das Präsens und die unmittelbar bevorstehende Nähe des Gerichts knapp und würdig wieder.
theological_decisions:
- issue: Bezug von „qui fecit eos“
  choice: „der sie geschaffen hat“ als fortgesetzter Relativsatz
  alternative: ein selbstständiger Satz wie „Er hat sie geschaffen“
  rationale: Der lateinische Text beginnt mitten in einer syntaktischen Verbindung; die fragmentarische Fortsetzung soll nicht künstlich zu einem eigenständigen Satz umgebaut werden.
- issue: Unvollständiger Schluss „Quod non“
  choice: „das ich nicht“ ohne Ergänzung
  alternative: den Satz aus dem Folgevers vervollständigen
  rationale: Die überlieferte Versportion endet unvollständig. Eine Ergänzung würde nicht im bereitgestellten Ausgangstext stehen und die offene Satzgrenze verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text bleibt am Anfang und Ende bewusst fragmentarisch, entsprechend der vorgegebenen lateinischen Versabgrenzung. Das Semikolon macht den Gegensatz zwischen Schöpfungshandeln und menschlicher Undankbarkeit gut lesbar, ohne den Inhalt zu erweitern.
