  yaml_path: translation/extra_canonical/2_esdras/008/048.yaml
  text: But in this also you will be marvelous before the Most High,[a]
translation:
  language: de
  text: Aber auch darin wirst du vor dem Höchsten wunderbar sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aber auch darin wirst du vor dem Höchsten etwas Staunenswertes sein.“'
    reason: Die Alternative verdeutlicht den starken Sinn von mirabilis als „staunenswert, außergewöhnlich“, ohne ihn auf bloße Bewunderungswürdigkeit einzuengen.
lexical_decisions:
- source_word: mirabilis
  choice: wunderbar
  rationale: Das lateinische Adjektiv bezeichnet etwas Staunenswertes, Außerordentliches oder Wunderbares. „Wunderbar“ bewahrt dieses Gewicht besser als das im heutigen Deutsch meist nur lobend verstandene „bewundernswert“.
- source_word: coram Altissimo
  choice: vor dem Höchsten
  rationale: Die geläufige und würdige Wendung gibt sowohl coram („vor, in Gegenwart von“) als auch den substantivierten Superlativ Altissimo präzise wieder.
theological_decisions:
- issue: Sinn von mirabilis in Bezug auf die angesprochene Person
  choice: wunderbar
  alternative: bewundernswert
  rationale: Der Text lässt offen, worin genau das Staunenswerte besteht. Die Übersetzung wahrt diese Spannung und reduziert die Aussage nicht auf moralische Anerkennung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wortstellung bleibt natürlich; „der Höchste“ wird als Gottesbezeichnung beibehalten.
