  text: propter quod conturbor. Ideo incipiam orare coram te pro me et pro eis, quoniam uideo lapsos nostros qui inhabitamus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: de
  text: Darum bin ich bestürzt. Deshalb will ich beginnen, vor dir für mich und für sie zu beten, denn ich sehe uns, die wir wohnen, als Gefallene.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Formulierung lapsos nostros ist ungewöhnlich und kann wörtlich etwa „uns als Gefallene“ heißen; auch ein Verständnis im Sinn von „unseren Fall“ ist möglich. Der Relativsatz sagt nur „die wir wohnen“ und nennt im vorliegenden lateinischen Text keinen Ort.
    reason: Bewahrt die grammatische und semantische Unsicherheit von lapsos nostros und vermeidet die unbelegte Ergänzung eines Wohnorts.
lexical_decisions:
- source_word: propter quod
  choice: Darum
  rationale: Gibt den rückbezüglichen kausalen Anschluss knapp und idiomatisch wieder.
- source_word: conturbor
  choice: bin ich bestürzt
  rationale: Bewahrt die starke innere Beunruhigung des lateinischen Verbs in würdigem, heutigem Deutsch.
- source_word: coram te
  choice: vor dir
  rationale: Entspricht der räumlich-relationalen Gebetssprache des lateinischen Ausdrucks.
- source_word: lapsos nostros
  choice: dass wir … gefallen sind
  rationale: Die lateinische Formulierung ist elliptisch und ungewöhnlich. Die Wiedergabe versteht lapsos als partizipiale Aussage über die Gemeinschaft des Sprechers und erhält die stärkere Bedeutung des Gefallenseins statt sie zu bloßen Verfehlungen abzuschwächen.
- source_word: qui inhabitamus
  choice: die wir die Erde bewohnen
  rationale: Der lateinische Relativsatz nennt kein ausdrückliches Objekt; „die Erde“ wird aus dem unmittelbaren Sinnzusammenhang und der Überlieferungstradition ergänzt, damit der Satz im Deutschen vollständig und verständlich ist.
theological_decisions:
- issue: Bedeutungsstärke von lapsos nostros
  choice: gefallen sind
  alternative: Verfehlungen begangen haben / unser Versagen
  rationale: „Gefallen“ wahrt das Gewicht des Ausdrucks und lässt offen, ob vor allem Sünde, Verderben oder der gefallene Zustand der Menschen gemeint ist. Eine Wiedergabe als bloße „Verfehlungen“ würde die Aussage wahrscheinlich abschwächen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetsregister. Der Satzbau bleibt nah an der lateinischen Gedankenfolge, wird aber an natürliches Deutsch angepasst.
