source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: absorbe ergo anima sensum et deuoret quod sapit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/004.yaml
  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: de
  text: 'Da antwortete ich und sagte: »Verschlinge also, Seele, die Einsicht, und sie soll verschlingen, was weise ist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was Geschmack hat« beziehungsweise »was schmeckt«. Das lateinische sapere kann sowohl „weise sein/verstehen“ als auch „schmecken“ bedeuten und setzt hier möglicherweise das Bild des Verschlingens fort.'
    reason: Bewahrt die echte lexikalische Mehrdeutigkeit und das mögliche Wortspiel von quod sapit.
lexical_decisions:
- source_word: absorbe
  choice: verschlinge
  rationale: Der Imperativ bezeichnet wörtlich ein Hinunterschlucken oder Verschlingen und eröffnet das im zweiten Satzteil fortgesetzte Bild des Essens.
- source_word: anima
  choice: Seele
  rationale: Wegen des Imperativs absorbe ist anima am besten als direkte Anrede (Vokativ) zu verstehen, nicht als Subjekt einer unpersönlichen Aufforderung.
- source_word: sensum
  choice: die Einsicht
  rationale: Sensus kann Wahrnehmung, Verstand oder Einsicht bezeichnen; im Kontext gibt „Einsicht“ den geistigen Sinn natürlich wieder.
- source_word: deuoret
  choice: sie soll verschlingen
  rationale: Die Konstruktion bewahrt den auffälligen Wechsel vom Imperativ der zweiten Person zum Konjunktiv der dritten Person und führt zugleich das Essensbild fort.
- source_word: quod sapit
  choice: was weise ist
  rationale: Sapere kann „weise sein/verstehen“ und zugleich „schmecken“ bedeuten. Die Hauptfassung gibt den geistigen Sinn wieder, ohne die substantivische Abstraktion „Weisheit“ in den lateinischen Relativsatz einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede der Seele und der ungewöhnliche Personenwechsel des lateinischen Satzes bleiben sichtbar; die Fußnote erschließt das nicht vollständig auf Deutsch reproduzierbare Wortspiel.
