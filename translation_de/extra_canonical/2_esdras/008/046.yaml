  yaml_path: translation/extra_canonical/2_esdras/008/046.yaml
  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: de
  text: 'Und er antwortete mir und sagte: „Was gegenwärtig ist, ist für die Gegenwärtigen bestimmt, und was zukünftig ist, für die Zukünftigen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was zur Gegenwart gehört, ist für die Gegenwart bestimmt, und was zur Zukunft gehört, für die Zukunft.“'
    reason: Das Lateinische lässt neben dem personalen Verständnis der Dative im Plural auch eine auf gegenwärtige und zukünftige Verhältnisse beziehungsweise Zeiten bezogene Deutung zu.
lexical_decisions:
- source_word: quae sunt praesentia
  choice: was gegenwärtig ist
  rationale: Gibt das substantivierte lateinische Neutrum natürlich wieder und bewahrt die abstrakte Weite des Ausdrucks.
- source_word: praesentibus
  choice: für die Gegenwärtigen
  rationale: Der Dativ Plural bezeichnet am naheliegendsten diejenigen, die in der Gegenwart leben; die ungewöhnliche Formulierung erhält zugleich den Parallelismus des Lateinischen.
- source_word: quae futura
  choice: was zukünftig ist
  rationale: Entspricht der elliptischen Parallelkonstruktion, in der „sunt“ aus dem ersten Glied mitzudenken ist.
- source_word: futuris
  choice: für die Zukünftigen
  rationale: Spiegelt den Dativ Plural und den apokalyptischen Gegensatz zwischen gegenwärtigen und zukünftigen Menschen beziehungsweise Generationen.
theological_decisions:
- issue: Bezug von praesentibus und futuris
  choice: 'personale Wiedergabe: „die Gegenwärtigen“ und „die Zukünftigen“'
  alternative: 'temporale Wiedergabe: „für die Gegenwart“ und „für die Zukunft“'
  rationale: Die lateinischen Formen sind Dative im Plural und können substantivierte Personenbezeichnungen sein. Da eine rein temporale Übersetzung den Plural einebnet, steht die personale Lesart im Text; die sachlich mögliche temporale Deutung wird in der Fußnote bewahrt.
- issue: Abgebrochener Quellenzusatz „Multum enim tibi restat ut“
  choice: nicht in den Vers aufgenommen
  alternative: als unvollständigen Satz übersetzen
  rationale: Die vorgelegte lateinische Zeichenfolge bricht syntaktisch nach „ut“ ab, während der geprüfte englische Vers an der vorherigen Aussage endet. Ohne den fehlenden Fortgang wäre eine Veröffentlichung dieses Fragments unverständlich oder spekulativ.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der knappe Parallelismus der lateinischen Aussage bleibt erhalten; „bestimmt“ wird im zweiten Glied natürlich mitgedacht. Die ungewohnten Substantivierungen „die Gegenwärtigen“ und „die Zukünftigen“ sind bewusst gewählt, um den Plural und die mögliche personale Aussage der Quelle sichtbar zu halten.
