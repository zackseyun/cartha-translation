source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: de
  text: Denn das Vorausgesagte wird euch aufnehmen; ebenso werden Durst und Qualen, die bereitet sind, sie aufnehmen. Denn der Höchste wollte nicht, dass der Mensch zugrunde geht; vielmehr haben diejenigen selbst, die geschaffen wurden, seinen Namen befleckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: susipient
  choice: wird … aufnehmen / werden … aufnehmen
  rationale: Bewahrt die personifizierende Bildsprache des lateinischen Verbs, obwohl „erwarten“ im Deutschen idiomatischer wäre.
- source_word: quae praedicta sunt
  choice: was vorausgesagt wurde
  rationale: Gibt die unbestimmte neutrale Wendung wieder, ohne ihren Inhalt näher festzulegen.
- source_word: sitis et cruciatus
  choice: der Durst und die Qualen
  rationale: Bewahrt sowohl den konkreten „Durst“ als auch den Plural von „cruciatus“.
- source_word: disperdi
  choice: zugrunde geht
  rationale: Natürliches modernes Deutsch für das passive lateinische „vernichtet werden/umkommen“, ohne die Art des Verderbens festzulegen.
- source_word: coinquinauerunt
  choice: befleckt
  rationale: Entspricht dem Bild des Beschmutzens oder Entweihens eines Namens und wahrt den würdigen Ton.
theological_decisions:
- issue: Gottes Wille hinsichtlich des Verderbens des Menschen
  choice: der Höchste wollte nicht, dass der Mensch zugrunde geht
  alternative: der Höchste wollte den Menschen nicht vernichten
  rationale: 'Die gewählte Fassung wahrt die Konstruktion „hominem disperdi“: Gott will nicht, dass der Mensch vernichtet wird; sie sagt nicht, Gott selbst sei unmittelbar der Vernichtende.'
- issue: Verantwortung der Geschaffenen
  choice: diejenigen selbst, die geschaffen wurden
  alternative: seine Geschöpfe
  rationale: Bewahrt die emphatische Selbstverantwortung in „ipsi“ und den Relativsatz „qui creati sunt“, ohne einen nicht ausdrücklich genannten Schöpferbezug in die Nominalform einzubauen.
- issue: Verhältnis der beiden Empfängergruppen
  choice: sie dagegen
  alternative: ebenso sie
  rationale: Das überlieferte „sic“ kann eine Entsprechung anzeigen, doch der Satz stellt das für „euch“ Vorausgesagte dem für „sie“ bereiteten Durst und den Qualen gegenüber. „dagegen“ macht diesen inhaltlichen Kontrast verständlich, ohne dessen theologischen Grund auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Personifikation, wonach das Vorausgesagte beziehungsweise Durst und Qualen Menschen „aufnehmen“, bleibt bewusst erhalten. Die frühere alternative Wiedergabe „Mehr noch, sie traten seine Gerechten mit Füßen“ wurde nicht als Fußnote übernommen, da sie nach dem angegebenen lateinischen Text zum vorhergehenden Satz gehört und keine Variante dieses Verses darstellt.
