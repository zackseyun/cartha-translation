  yaml_path: translation/extra_canonical/2_esdras/008/032.yaml
  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: de
  text: Wegen uns, die wir Sünder sind, bist du barmherzig genannt worden. Denn wenn du Erbarmen mit uns haben willst, wirst du barmherzig genannt werden — denn uns …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte lateinische Text bricht hier mit „nobis enim“ („denn uns“) ab; der Satz bleibt unvollständig.
    reason: Kennzeichnet den tatsächlichen fragmentarischen Schluss, statt ihn stillschweigend aus dem weiteren Kontext zu ergänzen.
lexical_decisions:
- source_word: propter nos peccatores
  choice: Wegen uns Sündern
  rationale: Gibt die kausale Wendung und die ausdrückliche Bezeichnung der Sprecher als Sünder wieder, ohne sie entgegen der lateinischen Satzgliederung an den Folgesatz anzuschließen.
- source_word: misericors
  choice: barmherzig
  rationale: Die geläufige und würdige deutsche Entsprechung für göttliches Erbarmen.
- source_word: uocatus es
  choice: bist du … genannt worden
  rationale: Bewahrt das lateinische Perfekt Passiv und unterscheidet es vom folgenden Futur „uocaberis“.
- source_word: desideraueris ut nostri miserearis
  choice: wenn du dich unser erbarmen willst
  rationale: Natürliches modernes Deutsch für das Verlangen beziehungsweise den Willen, Erbarmen zu erweisen; „unser“ bewahrt die Genitivrektion von „misereri“.
- source_word: uocaberis
  choice: wirst du … genannt werden
  rationale: Gibt das Futur Passiv formal und verständlich wieder.
- source_word: nobis enim
  choice: uns nämlich …
  rationale: Spiegelt den unvollständigen Anschluss des überlieferten Ausschnitts, ohne den fehlenden Gedanken aus späterem Kontext zu ergänzen.
theological_decisions:
- issue: Verhältnis zwischen menschlicher Sünde und Gottes Bezeichnung als barmherzig
  choice: 'Die Aussage bleibt als paradoxe Begründung stehen: Wegen der Sünder wird Gott barmherzig genannt.'
  alternative: „Denn wir sind Sünder“ als Begründung des folgenden Erbarmenssatzes
  rationale: Die Alternative der englischen Konsultationsfassung verschiebt „propter nos peccatores“ in den Folgesatz. Die lateinische Syntax verbindet die Wendung jedoch unmittelbar mit „misericors uocatus es“.
- issue: Unvollständiger Schluss „nobis enim“
  choice: Als Textabbruch kenntlich machen
  alternative: Aus dem weiteren Überlieferungskontext ergänzen, etwa „denn wir haben keine Werke der Gerechtigkeit“
  rationale: Die angegebene lateinische Quelle enthält diese Ergänzung in dem vorgelegten Versabschnitt nicht. Eine stille Vervollständigung würde nicht vorhandenen Text importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „barmherzig genannt“ folgt bewusst dem lateinischen Wortlaut; der Gedankenstrich markiert den abrupten, fragmentarischen Schluss.
