  naturalness: Der Entwurf ist insgesamt verständlich und hat einen passenden gehobenen Gebetston. Die Wortstellung „wolle nicht die vernichten“ wirkt im modernen Standarddeutsch jedoch unnötig sperrig. Mit „diejenigen“ und der Stellung des Infinitivs nach dem Objekt wird der Satz klarer, ohne den Ton oder die Bedeutung zu verändern.
  terminology: „Vieh“ gibt pecora angemessen wieder und vermeidet eine euphemistische Abschwächung. „Gesetz“ für legem tuam ist etabliert. „In hervorragender Weise“ ist für splendide idiomatischer als „vorzüglich“ und wahrt dessen positive, gehobene Wertung.
