source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: de
  text: Und wolle nicht diejenigen vernichten, die wie das Vieh gelebt haben[a], sondern sieh auf diejenigen, die dein Gesetz in hervorragender Weise gelehrt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die die Lebensweise des Viehs gehabt haben“.'
    reason: Die Fußnote bewahrt die konkrete lateinische Konstruktion pecorum mores habuerunt, während der Haupttext sie in natürliches Deutsch überträgt.
lexical_decisions:
- source_word: neque volueris perdere
  choice: Und wolle nicht … vernichten
  rationale: Der lateinische perfektische Konjunktiv steht hier als verneinte Bitte beziehungsweise Mahnung. „Wolle nicht“ bewahrt den Willensaspekt von volueris und den würdevollen Gebetston.
- source_word: pecorum mores habuerunt
  choice: die wie das Vieh gelebt haben
  rationale: Mores bezeichnet Lebensweise oder Verhalten, nicht bloß Umgangsformen. Die idiomatische Formulierung gibt das Bild eines viehischen Lebens wieder, ohne im Deutschen unnatürlich zu klingen.
- source_word: respicias eos
  choice: sieh auf die
  rationale: Die Bitte richtet sich an Gott, diesen Menschen Beachtung und Zuwendung zu schenken. „Sieh auf“ wahrt das Bild des lateinischen respicere.
- source_word: legem tuam splendide docuerunt
  choice: dein Gesetz vorzüglich gelehrt haben
  rationale: Docuerunt bedeutet „gelehrt“; splendide beschreibt hier die hervorragende Art ihres Lehrens. „Vorzüglich“ ist natürlich und wahrt die positive, gehobene Wertung.
theological_decisions:
- issue: Verhältnis zwischen den viehisch Lebenden und den Gesetzeslehrern
  choice: Der Satz lässt beide Gruppen im Kontrast nebeneinanderstehen, ohne ihre genaue Identität oder ihr endgültiges Geschick näher zu bestimmen.
  alternative: Die Gesetzeslehrer als Grund dafür darstellen, auch die erste Gruppe zu verschonen.
  rationale: Der lateinische Text fordert zunächst, die erste Gruppe nicht zu vernichten, und anschließend, auf die zweite zu sehen. Eine ausdrücklich vermittlerische oder stellvertretende Funktion der zweiten Gruppe wird grammatisch nicht erklärt und daher nicht ergänzt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die direkte Anrede bleibt im Singular; die parallelen Aufforderungen und der scharfe Gegensatz des lateinischen Satzes werden erhalten.
