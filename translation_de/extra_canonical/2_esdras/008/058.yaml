source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iustos eius conculcauerunt. Et dixerunt in corde suo non esse deum, et quidem scientes sciunt quoniam moriuntur. Sicut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/058.yaml
  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: de
  text: 'Sie zertraten seine Gerechten. Und sie sagten in ihrem Herzen: »Es gibt keinen Gott«, obwohl sie sehr wohl wissen, dass sie sterben werden. Wie'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustos eius
  choice: seine Gerechten
  rationale: Gibt den substantivisch gebrauchten Akkusativ Plural von iustus und den Bezug auf Gott knapp und sachgerecht wieder.
- source_word: conculcauerunt
  choice: zertraten
  rationale: Bewahrt das starke Bild des Nieder- oder Zertretens, statt es zu einem allgemeineren Unterdrücken abzuschwächen.
- source_word: in corde suo
  choice: in ihrem Herzen
  rationale: Folgt dem lateinischen Singular und bewahrt die biblische Rede vom Herzen als Zentrum des Denkens und Wollens.
- source_word: non esse deum
  choice: Es gibt keinen Gott
  rationale: Natürliche deutsche Wiedergabe der abhängigen Aussage, als direkte innere Behauptung formuliert.
- source_word: et quidem scientes sciunt
  choice: obwohl sie sehr wohl wissen
  rationale: Gibt die emphatische Wiederholung scientes sciunt idiomatisch wieder; sehr wohl bewahrt den Nachdruck, ohne unnatürliche Doppelung.
- source_word: quoniam moriuntur
  choice: dass sie sterben werden
  rationale: Im Kontext bezeichnet das Präsens moriuntur ihr gewisses künftiges Sterben; die deutsche Zukunftsform macht diesen Sinn natürlich deutlich.
- source_word: Sicut
  choice: Wie
  rationale: Bewahrt den am Versende abbrechenden Vergleich und verbindet ihn mit dem Folgenden, ohne ihn vorzeitig zu ergänzen.
theological_decisions:
- issue: Leugnung Gottes
  choice: »Es gibt keinen Gott«
  alternative: dass Gott nicht existiert
  rationale: Die direkte Rede erhält die Schärfe der inneren Gottesleugnung, ohne sie dogmatisch weiter auszulegen.
- issue: Bezeichnung der Betroffenen als iusti
  choice: seine Gerechten
  alternative: seine rechtschaffenen Menschen
  rationale: Gerechte ist die etablierte, zugleich offene biblische Bezeichnung und legt weder einen besonderen Stand noch eine Konfession fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang setzt den überlieferten Fragmentcharakter fort; das abschließende »Wie« bleibt bewusst unvollständig, weil der Vergleich erst im folgenden Vers weitergeführt wird.
