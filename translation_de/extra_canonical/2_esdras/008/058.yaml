  source_fidelity: 'Die Übersetzung folgt dem lateinischen Text genau: „zertraten“ gibt conculcauerunt treffend wieder; „seine Gerechten“ entspricht iustos eius; die Gottesleugnung wird als direkte innere Rede natürlich wiedergegeben. „obwohl sie sehr wohl wissen“ bewahrt sowohl den konzessiven Zusammenhang als auch den Nachdruck von et quidem scientes sciunt. Das abschließende „Wie“ erhält den bewusst fortgesetzten Vergleich von Sicut.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Das Präteritum passt zum erzählenden biblischen Register. „in ihrem Herzen“ ist als distributiver Singular idiomatisch und bewahrt die Bildsprache.
  terminology: „Gerechte“ ist für iusti bibelsprachlich etabliert und theologisch nicht einengend. „Es gibt keinen Gott“ ist eine prägnante, sachgerechte Wiedergabe von non esse deum. Es sind keine Fußnoten erforderlich; die englische Fußnote dokumentiert eine frühere, nicht zum vorliegenden lateinischen Vers gehörende Fassung und hat keinen textkritischen Anker im deutschen Text.
