review_pass:
  verdict: approve
  source_fidelity: Der Satz gibt lat. „Sed audiui celeritatem iudicii quod futurum est“ vollständig und zutreffend wieder. „Aber“ entspricht dem adversativen „Sed“, und „ich habe von … gehört“ ist eine im Deutschen idiomatische Wiedergabe von „audiui“ mit dem abstrakten Gegenstand „celeritatem“. „des kommenden Gerichts“ bewahrt den Zukunftsbezug von „quod futurum est“, ohne den Ablauf oder die genaue Bedeutung der Schnelligkeit weiter zu bestimmen.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Verbindung „von der Schnelligkeit … gehört“ ist bei einer berichteten Kunde natürlich; der Satz ist knapp und dem Kontext angemessen.
  terminology: „Gericht“ ist die etablierte und quellennah passende Wiedergabe von „iudicium“. „Schnelligkeit“ gibt „celeritas“ neutral wieder und legt weder bloß die Ankunft noch eine bestimmte Art des Gerichtsvollzugs fest.
  issues: []
