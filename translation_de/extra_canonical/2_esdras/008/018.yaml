  text: Aber ich habe von der Schnelligkeit des kommenden Gerichts gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sed
  choice: Aber
  rationale: Gibt den adversativen Übergang des lateinischen Textes natürlich und knapp wieder.
- source_word: audiui
  choice: ich habe … gehört
  rationale: Entspricht dem lateinischen Perfekt und bewahrt die Aussage als empfangene Kunde.
- source_word: celeritatem
  choice: Schnelligkeit
  rationale: Gibt den Kernbegriff formal wieder; gemeint ist, wie rasch das Gericht eintritt beziehungsweise vollzogen wird.
- source_word: iudicii quod futurum est
  choice: des kommenden Gerichts
  rationale: Eine natürliche deutsche Wiedergabe der Umschreibung „des Gerichts, das sein wird/kommen wird“, ohne den Zukunftsbezug abzuschwächen.
theological_decisions:
- issue: Art und Zeitpunkt des Gerichts
  choice: des kommenden Gerichts
  alternative: des Gerichts, das kommen wird
  rationale: Die kompakte Form bewahrt den eschatologischen Zukunftsbezug, ohne näher festzulegen, worin die Schnelligkeit besteht oder wie das Gericht abläuft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorangestellte Rest „terram.“ gehört syntaktisch zum vorherigen Vers und wird daher hier nicht aufgenommen.
