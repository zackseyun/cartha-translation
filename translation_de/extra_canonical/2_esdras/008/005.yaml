id: 2ES.8.5
reference: 2 Esdras 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: de
  text: Denn du hast eingewilligt, zu gehorchen, und bist wider Willen aufgebrochen[a]; denn dir ist nur eine ganz kurze Zeit zum Leben gegeben worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bist wider Willen fortgegangen«.'
    reason: profecta es kann sowohl das Aufbrechen als auch das Fortgehen bzw. Abreisen bezeichnen; das Ziel bleibt unausgesprochen.
lexical_decisions:
- source_word: obaudire
  choice: zu gehorchen
  rationale: Das lateinische Verb bezeichnet hier nicht nur das Hören, sondern das Folge-Leisten bzw. Gehorchen.
- source_word: profecta es
  choice: bist … aufgebrochen
  rationale: Perfekt von proficiscor; die gewöhnliche Bedeutung ist „aufbrechen“ oder „sich auf den Weg machen“, nicht primär „voranschreiten“.
- source_word: spatium … uiuere
  choice: Lebenszeit
  rationale: Die idiomatische Verdichtung gibt den zum Leben gewährten Zeitraum natürlich und präzise wieder.
- source_word: nisi solum modicum
  choice: außer einer ganz kurzen
  rationale: Bewahrt die verstärkende Einschränkung durch nisi, solum und modicum in natürlichem Deutsch.
theological_decisions:
- issue: Bezug und Bildsprache von profecta es
  choice: Das Bild des widerwilligen Aufbruchs wird bewahrt.
  alternative: „Du bist wider Willen vorangeschritten“ oder eine ausdrückliche Deutung als Eintritt ins Leben bzw. Aufbruch zum Tod.
  rationale: Der lateinische Text benennt das Ziel des Aufbruchs nicht. Eine explizite theologische Festlegung würde die genuine Offenheit des Bildes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Form von profecta es ist im Deutschen formal nicht sichtbar; der Vers behält die direkte Anrede und die knappe, eindringliche Begründungsstruktur des Lateinischen bei.
