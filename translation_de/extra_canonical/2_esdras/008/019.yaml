source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ideo audi meam uocem et intellege sermonum meorum, et loquar coram te. Initium uerborum orationis Ezrae priusquam adsumeretur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/019.yaml
  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: de
  text: Darum höre meine Stimme und verstehe meine Worte, und ich will vor dir reden. Beginn der Worte des Gebets Esras, bevor er aufgenommen wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlussklausel wirkt wie eine redaktionelle oder abschreiberseitige Übergangsnotiz. Sie bleibt im Text stehen, weil sie in dem hier zugrunde gelegten lateinischen Zeugen enthalten ist. Möglich ist auch die ergänzende Wiedergabe: „Dies ist der Beginn der Worte des Gebets Esras, bevor er aufgenommen wurde.“'
    reason: compositional_layer_and_previous_rendering
lexical_decisions:
- source_word: Ideo
  choice: Darum
  rationale: Gibt die folgernde Verbindung knapp und natürlich wieder.
- source_word: intellege sermonum meorum
  choice: verstehe meine Worte
  rationale: Das bereinigte Latein bietet zwar die auffällige Form „sermonum“, doch der syntaktische Sinn ist eine Aufforderung, Esras Worte zu verstehen; die deutsche Wiedergabe bewahrt diesen Sinn ohne die Unebenheit nachzuahmen.
- source_word: loquar coram te
  choice: will ich vor dir reden
  rationale: „Vor dir“ wahrt coram te und den feierlichen Gebetskontext; die deutsche Modalform gibt den lateinischen Konjunktiv natürlich wieder.
- source_word: Initium uerborum orationis Ezrae
  choice: Beginn der Worte von Esras Gebet
  rationale: Als verbloser Rubriktitel wiedergegeben, ohne ein nicht vorhandenes „Dies ist“ zu ergänzen.
- source_word: adsumeretur
  choice: aufgenommen wurde
  rationale: Bewahrt die passive und hinsichtlich Ziel oder Art der Aufnahme offene Formulierung.
theological_decisions:
- issue: Bedeutung von Esras „Aufnahme“
  choice: bevor er aufgenommen wurde
  alternative: bevor er entrückt wurde
  rationale: „Aufgenommen“ erhält die Unbestimmtheit des lateinischen adsumeretur und legt weder ausdrücklich eine Himmelfahrt noch eine besondere Art der Entrückung fest.
- issue: Status des Schlusssatzes
  choice: als verbloser Übergangs- oder Rubriksatz im Haupttext
  alternative: „Dies ist der Beginn ...“ oder Auslassung
  rationale: Der lateinische Zeuge enthält die nominale Formulierung; ihre abrupte, redaktionelle Gestalt soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eigentliche Gebetssatz wird flüssig formuliert; die abschließende nominale Rubrik bleibt bewusst knapp und ohne ergänzendes Verb, um ihre textgeschichtliche Eigenart zu bewahren.
