  text: But both what preserves and what is preserved will be preserved by your preservation. And when the womb again gives back
translation:
  language: de
  text: Doch sowohl das, was bewahrt, als auch das, was bewahrt wird, wird durch dein Bewahren bewahrt werden. Und wenn der Mutterleib wieder zurückgibt, was …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruat / seruatur / seruabuntur / seruatione
  choice: bewahrt / bewahrt wird / bewahrt werden / Bewahren
  rationale: Die Wiederholung desselben deutschen Wortstamms bildet das auffällige lateinische Wortspiel und die wechselseitige Beziehung möglichst genau ab.
- source_word: matrix
  choice: Mutterleib
  rationale: Im Kontext bezeichnet das lateinische Wort den gebärenden Leib; „Mutterleib“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: reddit
  choice: zurückgibt
  rationale: Die Grundbedeutung „wiedergeben/zurückgeben“ wird erhalten; „wieder“ gibt zusätzlich das lateinische iterum wieder.
theological_decisions:
- issue: Bezug von „dein“ in „seruatione tua“
  choice: dein Bewahren
  alternative: deine Bewahrung / dein Schutz
  rationale: Die Anrede und die Mehrdeutigkeit zwischen Gottes bewahrendem Handeln und der dadurch gewährten Bewahrung bleiben bestehen.
- issue: Unvollständiger Satz am Versende
  choice: Offener Anschluss mit „was …“
  alternative: Satz ohne Ergänzung bei „zurückgibt“ abbrechen
  rationale: Der lateinische Ausschnitt endet mit dem Relativpronomen „quae“ und weist ausdrücklich in den folgenden Text; die Auslassungspunkte machen den fragmentarischen Anschluss transparent, ohne Inhalt vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Latein stark hervorgehobene Wiederholung des Wortfelds „bewahren“ wurde bewusst beibehalten, auch wenn sie stilistisch markant wirkt. Das Versende bleibt als syntaktisch offener Übergang erhalten.
