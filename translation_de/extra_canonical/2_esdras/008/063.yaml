source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tudinem signorum quae incipies facere in nouissimis, sed non demonstrasti mihi quo tempore.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/063.yaml
  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: de
  text: Du hast mir eine Vielzahl von Zeichen gezeigt, die du in den letzten Zeiten zu wirken beginnen wirst[a]; aber du hast mir nicht gezeigt, zu welchem Zeitpunkt.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die du in den letzten Zeiten wirken wirst.'
    reason: Die lateinische Verbindung »incipies facere« kann wörtlich inzeptiv (»zu wirken beginnen wirst«), im Übersetzungslatein aber möglicherweise auch als einfache Zukunftsumschreibung verstanden werden.
lexical_decisions:
- source_word: multitudinem signorum
  choice: eine Vielzahl von Zeichen
  rationale: Die lateinische artikellose Wendung bezeichnet idiomatisch eine große, unbestimmte Menge von Zeichen; »eine Vielzahl von Zeichen« ist im Deutschen natürlich und wahrt diesen Sinn.
- source_word: incipies facere
  choice: zu tun beginnen wirst
  rationale: Die Wiedergabe erhält zunächst die inzeptive Bedeutung von »incipies« (»du wirst beginnen«), ohne die Handlung näher zu bestimmen. Da die Wendung im Übersetzungslatein auch als Umschreibung des Futurs verstanden werden kann, wird die Alternative in einer Fußnote genannt.
- source_word: in nouissimis
  choice: in den letzten Zeiten
  rationale: Die substantivierte Wendung verweist auf die endzeitliche Schlussphase. Der Plural »Zeiten« bewahrt die Form und vermeidet eine unbegründete Verengung auf einen einzelnen Zeitpunkt.
- source_word: quo tempore
  choice: zu welchem Zeitpunkt
  rationale: Diese natürliche deutsche Formulierung gibt die Frage nach dem genauen zeitlichen Eintreten wieder und greift den Gegensatz zu den allgemein genannten »letzten Zeiten« auf.
theological_decisions:
- issue: Inzeptiver oder rein zukünftiger Sinn von »incipies facere«
  choice: »zu tun beginnen wirst« im Haupttext
  alternative: »tun wirst«
  rationale: Der Haupttext folgt der ausdrücklichen lateinischen Form »incipies«, während die Fußnote berücksichtigt, dass »incipio« mit Infinitiv im Übersetzungslatein bisweilen eine Zukunftsumschreibung sein kann. So bleibt die sachlich möglicherweise bedeutsame Spannung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der Gegensatz zwischen allgemeinen endzeitlichen Zeichen und dem nicht offenbarten genauen Zeitpunkt bleiben klar erhalten.
