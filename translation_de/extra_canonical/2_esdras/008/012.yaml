source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enutristi eum tuae iustitiae, et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/012.yaml
  text: You nourished him with your righteousness, and instructed him in your law, and corrected him by your understanding.
translation:
  language: de
  text: Du hast ihn mit deiner Gerechtigkeit genährt, ihn in deinem Gesetz unterwiesen und ihn durch deine Einsicht zurechtgewiesen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enutristi
  choice: hast … genährt
  rationale: Gibt das Bild des Ernährens und Heranziehens natürlich wieder.
- source_word: tuae iustitiae
  choice: mit deiner Gerechtigkeit
  rationale: Der lateinische Genitiv kann den Inhalt oder das Mittel des Nährens bezeichnen; „mit“ bewahrt das Bild in idiomatischem Deutsch.
- source_word: erudisti
  choice: unterwiesen
  rationale: Bezeichnet hier lehrende Bildung und passt zur folgenden Wendung „in deinem Gesetz“.
- source_word: corripuisti
  choice: zurechtgewiesen
  rationale: Bewahrt den korrigierenden, mahnenden Sinn ohne unnötige Verschärfung.
- source_word: tuo intellectu
  choice: durch deine Einsicht
  rationale: Gibt den Ablativ plausibel instrumental wieder; „Einsicht“ bezeichnet verständige Erkenntnis.
theological_decisions:
- issue: Verhältnis von Gottes Gerechtigkeit zum Nähren
  choice: mit deiner Gerechtigkeit
  alternative: in deiner Gerechtigkeit
  rationale: Das lateinische „tuae iustitiae“ ist formal mehrdeutig; im Zusammenhang mit „enutristi“ ist eine inhaltliche beziehungsweise instrumentale Wiedergabe im Deutschen verständlicher, ohne eine besondere Lehrdeutung einzutragen.
- issue: Funktion von Gottes Einsicht bei der Zurechtweisung
  choice: durch deine Einsicht
  alternative: mit deinem Verständnis
  rationale: Der instrumentale Ablativ wird mit „durch“ klar wiedergegeben; „Einsicht“ bleibt sachlich und vermeidet die mögliche moderne Bedeutung von „Verständnis“ als Nachsicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei parallelen Verben und die wiederholten Possessivformen des lateinischen Satzes bleiben erhalten; die Pronomen werden zur flüssigen deutschen Syntax gesetzt.
