source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sic et actus praesentis saeculi: Multi quidem creati sunt, pauci autem saluabuntur.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/003.yaml
  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
translation:
  language: de
  text: 'So ist es auch mit dem Lauf des gegenwärtigen Zeitalters: Viele sind zwar geschaffen worden, aber nur wenige werden gerettet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: actus
  choice: Lauf
  rationale: Das lateinische Substantiv steht hier im Singular und bezeichnet im Zusammenhang den Verlauf bzw. die Ordnung des gegenwärtigen Zeitalters, nicht menschliche Taten.
- source_word: praesentis saeculi
  choice: des gegenwärtigen Zeitalters
  rationale: Gibt die zeitlich-eschatologische Bedeutung von saeculum präzise und in würdigem modernem Deutsch wieder.
- source_word: Multi quidem ... pauci autem
  choice: Viele sind zwar ... aber nur wenige
  rationale: Bewahrt den ausdrücklichen lateinischen Gegensatz; „nur“ macht die einschränkende Kraft von pauci im Deutschen natürlich deutlich.
- source_word: creati sunt
  choice: sind ... geschaffen worden
  rationale: Das Passiv wird beibehalten und lässt den im Kontext vorausgesetzten Schöpfer unausgesprochen, wie im Lateinischen.
- source_word: saluabuntur
  choice: werden gerettet werden
  rationale: Bewahrt Futur und Passiv sowie die theologische Offenheit hinsichtlich des handelnden Retters.
theological_decisions:
- issue: Verhältnis von Erschaffung und Rettung
  choice: Viele sind zwar geschaffen worden, aber nur wenige werden gerettet werden
  alternative: Viele wurden geschaffen, aber wenige werden selig werden
  rationale: Die gewählte Formulierung hält den Kontrast und die Passivformen des Ausgangstextes fest, ohne durch „selig werden“ eine stärker konfessionell geprägte oder zustandsbezogene Deutung einzutragen.
- issue: Bedeutung von actus praesentis saeculi
  choice: Lauf des gegenwärtigen Zeitalters
  alternative: Taten des gegenwärtigen Zeitalters
  rationale: Der Kontext verlangt eine Aussage über Verlauf oder Ordnung des Zeitalters; „Taten“ würde den Bezug unberechtigt auf moralische Handlungen verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur und der scharfe Gegensatz des lateinischen Textes bleiben erhalten.
