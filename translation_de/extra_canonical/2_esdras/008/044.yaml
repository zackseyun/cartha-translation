translation:
  language: de
  text: dein Abbild genannt, weil er dir ähnlich gemacht worden ist, für den du alles geformt hast[a], und du hast ihn dem Samen eines Bauern gleichgemacht. Nein, Herr
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Lateinischen: „durch den“. Nach dem Zusammenhang und der zugrunde liegenden griechischen Lesart: „für den“ oder „um dessentwillen du alles geformt hast“.'
    reason: Die lateinische Form per quem ist formal mehrdeutig. Die Anmerkung hält die wörtliche lateinische Form fest und erklärt zugleich die im Kontext erforderliche finale bzw. begünstigende Hauptwiedergabe.
lexical_decisions:
- source_word: tua imago nominatus
  choice: dein Abbild genannt
  rationale: Gibt die prädikative Wendung und nominatus ausdrücklich wieder; „Abbild“ ist im heutigen Deutsch natürlich und wahrt den Bezug auf Gottes Bild.
- source_word: similatus est
  choice: ist dir ähnlich gemacht worden
  rationale: Bewahrt das Passiv und den Gedanken verliehener Ähnlichkeit, ohne ihn als bloße Wesensgleichheit umzudeuten.
- source_word: per quem omnia plasmasti
  choice: durch den du alles geformt hast
  rationale: Entspricht der unmittelbar vorliegenden lateinischen Konstruktion per quem und gibt plasmasti mit dem handwerklich-schöpferischen „geformt“ wieder. Die kontextuell mögliche Zweckdeutung wird in der Fußnote offengehalten.
- source_word: similasti eum semini agricolae
  choice: du hast ihn mit dem Samen des Bauern verglichen
  rationale: Gibt die Vergleichskonstruktion verständlich wieder; „Samen des Bauern“ wahrt die konkrete landwirtschaftliche Bildsprache.
- source_word: Non, domine
  choice: Nein, Herr
  rationale: Bewahrt den abrupt abbrechenden Wortlaut des überlieferten Ausschnitts, ohne eine nicht belegte Ergänzung einzuführen.
theological_decisions:
- issue: Bedeutung von per quem im Schöpfungssatz
  choice: durch den du alles geformt hast
  alternative: für den du alles geformt hast / um dessentwillen du alles geformt hast
  rationale: Das erhaltene Latein bezeichnet formal eher Vermittlung oder Mittel. Der weitere Gedankengang von 4 Esra kann jedoch eine Zweck- beziehungsweise Begünstigtenlesart nahelegen. Die Hauptübersetzung folgt dem Wortlaut; die Fußnote bewahrt die theologisch bedeutsame Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang und das Ende bleiben als Fragmente erkennbar. Keine Ergänzung über den lateinisch überlieferten Wortlaut hinaus.
