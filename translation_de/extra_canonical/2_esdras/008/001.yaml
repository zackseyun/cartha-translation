id: 2ES.8.1
reference: 2 Esdras 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: de
  text: 'Und er antwortete mir und sagte: „Der Höchste hat dieses Zeitalter[a] für viele geschaffen, das kommende aber für wenige.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Weltzeit“.'
    reason: Saeculum kann sowohl den zeitlichen Sinn „Zeitalter“ als auch den umfassenderen Sinn „Weltzeit“ tragen.
lexical_decisions:
- source_word: hoc saeculum
  choice: dieses Zeitalter
  rationale: Gibt das demonstrative hoc und den zeitlich-weltgeschichtlichen Sinn von saeculum direkt wieder, ohne das im Lateinischen nicht vorhandene Wort „gegenwärtig“ einzufügen.
- source_word: altissimus
  choice: der Höchste
  rationale: Die im Deutschen geläufige und würdevolle Gottesbezeichnung entspricht dem substantivierten lateinischen Superlativ.
- source_word: propter multos … propter paucos
  choice: für viele … für wenige
  rationale: Bewahrt die knappe Parallelstruktur und gibt propter in diesem Zusammenhang natürlich als Zweck- beziehungsweise Bezugsangabe wieder.
- source_word: futurum
  choice: das kommende
  rationale: Das substantivierte Adjektiv nimmt das zuvor genannte Zeitalter auf; die elliptische Form bleibt auch im Deutschen verständlich und bewahrt die Prägnanz des Ausgangstextes.
theological_decisions:
- issue: Gegensatz zwischen den Vielen dieses Zeitalters und den Wenigen des kommenden
  choice: Die Aussage wird ohne erklärenden Zusatz als „für viele … für wenige“ wiedergegeben.
  alternative: Den Gegensatz durch Zusätze wie „bestimmt“, „gerettet“ oder „würdig“ näher auszulegen.
  rationale: Der lateinische Text nennt weder Rettung noch Erwählung oder Würdigkeit ausdrücklich. Die theologische Spannung soll daher nicht durch eine konfessionelle oder spekulative Deutung aufgelöst werden.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Die einleitende Doppelwendung „antwortete … und sagte“ bleibt als Merkmal des Ausgangstextes erhalten; „dieses Zeitalter“ wahrt zudem die lexikalische Unterscheidung zu einer ausdrücklich als „gegenwärtig“ bezeichneten Zeit.
