  language: de
  text: das Verderben dem Vergessen preisgegeben. Die Leiden sind vergangen, und es ist gezeigt worden
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptio
  choice: das Verderben
  rationale: Gibt den umfassenden Sinn von moralischem und leiblichem Verfall wieder; „Verwesung“ wäre zu eng, „Vergänglichkeit“ schwächer.
- source_word: in obliuionem
  choice: dem Vergessen anheimgegeben
  rationale: Das elliptische lateinische Fragment wird in würdigem, verständlichem Deutsch wiedergegeben, ohne einen neuen inhaltlichen Gedanken einzuführen.
- source_word: dolores
  choice: die Leiden
  rationale: Bezeichnet hier umfassender schmerzliche Nöte; „Schmerzen“ könnte rein körperlich verstanden werden.
- source_word: Transierunt
  choice: sind vergangen
  rationale: Entspricht dem perfektischen Sinn und klingt im Deutschen natürlich.
- source_word: ostensus est
  choice: es ist gezeigt worden
  rationale: Bewahrt die passive Aussage und den nach vorn weisenden, im vorliegenden Ausschnitt noch ungenannten Bezug.
theological_decisions:
- issue: Unvollständiger Satz- und Versausschnitt
  choice: Den nach vorn offenen Schluss beibehalten
  alternative: Ein Subjekt aus dem Folgevers ergänzen
  rationale: Der gelieferte lateinische Text endet mit „ostensus est“ und nennt das maskuline Subjekt offenbar erst anschließend; eine Ergänzung würde über die vorgelegte Quelle hinausgehen.
- issue: Elliptischer Anfang „corruptio in obliuionem“
  choice: Mit einer knappen deutschen Passivellipse wiedergeben
  alternative: „Das Verderben ist in Vergessenheit geraten“
  rationale: Die gewählte Fassung wahrt den fragmentarischen Anschluss an den vorausgehenden Kontext und vermeidet, „in oblivionem“ als selbstständigen Zustandswechsel auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Anfang und Ende bleiben bewusst syntaktisch an den umgebenden Kontext gebunden, weil der bereitgestellte lateinische Versausschnitt beidseitig fragmentarisch ist.
