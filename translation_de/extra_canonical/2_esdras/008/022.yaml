  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: de
  text: deren Dienst sich in Wind und Feuer verwandelt[a], dessen Wort zuverlässig ist und dessen Aussprüche Bestand haben, dessen Ordnung kraftvoll und dessen Befehl furchtgebietend ist[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lateinisch steht hier seruatio („Bewahrung“ oder „Erhaltung“); im Zusammenhang mit den Engeln wird das Wort gewöhnlich im Sinn von „Dienst“ oder „Wirken“ verstanden.
    reason: textual_variant
  - marker: b
    text: 'Eine mögliche, aber das lateinische Verb conuertitur abschwächende Wiedergabe lautet: „deren Dienst in Wind und Feuer geschieht“.'
    reason: previous_rendering
lexical_decisions:
- source_word: seruatio
  choice: Dienst
  rationale: Wörtlich bezeichnet das lateinische Wort eine Bewahrung oder Erhaltung; im Zusammenhang mit den zuvor genannten Engeln ist jedoch ihr Dienst beziehungsweise Wirken gemeint. Die textliche Schwierigkeit wird in einer Fußnote offengelegt.
- source_word: conuertitur
  choice: sich verwandelt
  rationale: Gibt die im lateinischen Verb ausdrücklich bezeichnete Veränderung wieder und vermeidet die Abschwächung zu einem bloßen Sein in Wind und Feuer.
- source_word: firmum
  choice: feststeht
  rationale: Natürliches modernes Deutsch für die Aussage, dass Gottes Wort fest, zuverlässig und gültig ist.
- source_word: dicta perseuerantia
  choice: Aussprüche Bestand haben
  rationale: Bewahrt den parallelen Gedanken dauerhafter, fortbestehender Worte in idiomatischem Deutsch.
- source_word: dispositio fortis
  choice: Ordnung kraftvoll
  rationale: Dispositio kann Anordnung, Ordnung oder Fügung bedeuten; „Ordnung“ lässt die Reichweite offen, während „kraftvoll“ fortis eng wiedergibt.
- source_word: iussio terribilis
  choice: Befehl furchtgebietend
  rationale: „Furchtgebietend“ vermittelt Ehrfurcht und Schrecken, ohne den Ausdruck auf moralisch negatives „schrecklich“ festzulegen.
theological_decisions:
- issue: Bezug der Relativpronomen
  choice: Plural „deren“ für den Engel-Dienst, danach Singular „dessen“ für Gott
  alternative: Alle Relativsätze einheitlich auf Gott beziehen
  rationale: Der Numeruswechsel im lateinischen Zusammenhang unterscheidet den Dienst der Engel von Gottes Wort, Ordnung und Befehl.
- issue: Gestalt von Wind und Feuer
  choice: Der Dienst verwandelt sich in Wind und Feuer
  alternative: Der Dienst geschieht in Wind und Feuer
  rationale: Die Übersetzung erhält das Verb conuertitur und damit das Motiv einer Verwandlung, ohne näher zu bestimmen, ob die Engel selbst oder ihr Dienst diese Gestalt annehmen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Satzstruktur bleibt erhalten. „Aussprüche“ und „furchtgebietend“ heben den feierlichen Gebetsstil hervor, ohne altertümlich zu wirken; die Textschwierigkeit in der ersten Klausel wird nicht verdeckt.
