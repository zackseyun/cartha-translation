  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: de
  text: Kannst du meine Schöpfung mehr lieben, als ich sie liebe? Du aber hast dich oft den Ungerechten zugerechnet.[a] Tu das niemals. Doch auch darin wirst du vor dem Höchsten bewundernswert sein, denn du hast dich gedemütigt, wie es sich gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du hast dich den Ungerechten genähert“ oder „nahegestellt“.'
    reason: Das lateinische „temetipsum proximasti iniustis“ kann sowohl die bildliche Selbsteinordnung als auch ein allgemeineres Sich-Nahestellen ausdrücken.
lexical_decisions:
- source_word: pos(s)is diligere meam creaturam super me
  choice: Kannst du meine Schöpfung mehr lieben als ich?
  rationale: Die lateinische Frage wird direkt und natürlich wiedergegeben; „super me“ bezeichnet hier den Vergleich mit Gottes eigener Liebe zu seiner Schöpfung.
- source_word: temetipsum proximasti iniustis
  choice: hast dich … den Ungerechten zugerechnet
  rationale: Das reflexive „proximasti“ bezeichnet ein Sich-Nahestellen. Im Zusammenhang ist nicht bloß räumliche Nähe, sondern Ezras Einordnung seiner selbst bei den Ungerechten gemeint; die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: numquam
  choice: Tu das niemals
  rationale: Das alleinstehende „numquam“ wird als knappe, aus dem vorherigen Satz ergänzte Aufforderung verstanden, entsprechend der lateinischen Satzfolge.
- source_word: mirabilis
  choice: bewundernswert
  rationale: Gibt die positive Bewertung vor dem Höchsten in natürlichem Deutsch wieder, ohne das im heutigen Deutsch missverständliche „wunderbar“ im Sinn eines Wunders zu verwenden.
- source_word: humiliasti te, sicut decet
  choice: du hast dich gedemütigt, wie es sich gehört
  rationale: Bewahrt sowohl den reflexiven Sinn von „humiliare“ als auch die normative Wendung „sicut decet“.
theological_decisions:
- issue: Verhältnis von Esras Liebe zu Gottes Liebe zur Schöpfung
  choice: als echte rhetorische Frage erhalten
  alternative: als Feststellung formulieren, dass Esra Gottes Liebe nicht übertreffen kann
  rationale: Das lateinische „possis“ stützt die Frageform; sie lässt die im Text angelegte Spannung bestehen, ohne sie erklärend aufzulösen.
- issue: Esras Nähe zu den Ungerechten
  choice: als Selbsteinordnung unter die Ungerechten verstanden
  alternative: als bloßes Sich-Nähern oder als Vergleichen mit ihnen
  rationale: Das reflexive „temetipsum proximasti iniustis“ spricht wörtlich vom Sich-Nahestellen; die kontextuelle Selbsteinordnung wird im Haupttext klar, während die formal nähere Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die knappen Sätze folgen dem lateinischen Duktus; „der Höchste“ bewahrt den traditionellen Gottesbezug.
