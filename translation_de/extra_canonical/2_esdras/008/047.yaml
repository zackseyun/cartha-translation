  terminology: „Schöpfung“, „die Ungerechten“, „der Höchste“ und „sich demütigen“ sind angemessen und registergerecht. „bewundernswert“ gibt „mirabilis“ hier gut wieder, ohne eine spezifische theologische Deutung einzutragen.
