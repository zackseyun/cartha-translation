source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit : domine qui inhabitas seculum, cuius oculi elati et superiora in aerem, Cuius thronus inextimabilis et gloria incon-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/020.yaml
  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
translation:
  language: de
  text: 'Und er sagte: „Herr, der du die Ewigkeit bewohnst, dessen Augen erhaben sind und dessen obere Gemächer in der Luft liegen, dessen Thron unermesslich ist und dessen Herrlichkeit …“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inhabitas seculum
  choice: die Ewigkeit bewohnst
  rationale: Das lateinische saeculum kann einen Weltzeitraum oder die Ewigkeit bezeichnen; in der Anrede ist »die Ewigkeit bewohnen« eine natürliche, traditionsnahe Wiedergabe.
- source_word: oculi elati
  choice: dessen Augen erhaben sind
  rationale: Bewahrt die prädikative Aussage und die Bildsprache des lateinischen Textes, ohne ein nicht ausgedrücktes Objekt des Sehens einzufügen.
- source_word: superiora in aerem
  choice: dessen obere Gemächer in der Luft liegen
  rationale: Superiora steht parallel zu oculi und bezeichnet hier am plausibelsten die oberen Räume beziehungsweise himmlischen Gemächer; »liegen« gibt die elliptische Nominalkonstruktion natürlich wieder.
- source_word: thronus inextimabilis
  choice: dessen Thron unermesslich ist
  rationale: Inextimabilis bezeichnet etwas, dessen Größe oder Wert nicht abgeschätzt werden kann; »unermesslich« ist im Deutschen würdig und verständlich.
theological_decisions:
- issue: Deutung von superiora
  choice: obere Gemächer
  alternative: Höhen
  rationale: Die grammatische Parallelität spricht gegen »auf die Höhen blicken«. »Obere Gemächer« wahrt das kosmologische Wohnungsbild, während »Höhen« zwar wörtlicher, aber im Deutschen weniger eindeutig ist.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die im gelieferten Quellenausschnitt am Wortanfang abgebrochene Fortsetzung »gloria incon-« wird durch Auslassungspunkte kenntlich gemacht, ohne sie spekulativ zu ergänzen.
