  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: de
  text: sondern derer, die deine Weisungen[a] in Leiden bewahrt haben. Gedenke nicht derer, die vor dir treulos gehandelt haben,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Bundesverpflichtungen; möglicherweise auch: deine Zeugnisse. Das lateinische testamenta kann in diesem Zusammenhang verschiedene Bezeichnungen für Gottes verbindliche Weisungen wiedergeben.'
    reason: Die Anmerkung erhält die lexikalische Offenheit von testamenta, ohne die im Kontext fernliegende Bedeutung „letztwillige Verfügungen“ nahezulegen.
lexical_decisions:
- source_word: testamenta
  choice: Bündnisse
  rationale: Der lateinische Plural bezeichnet hier die von Gott gegebenen verbindlichen Zusagen beziehungsweise Ordnungen; „Bündnisse“ entspricht dem Kontext und der englischen Konsultationsfassung.
- source_word: cum doloribus
  choice: unter Schmerzen
  rationale: Gibt die begleitenden Leiden idiomatisch wieder, ohne ausdrücklich eine Ursache oder ein zeitliches Nacheinander festzulegen.
- source_word: custodierunt
  choice: bewahrt haben
  rationale: Bewahrt den Sinn von treuem Festhalten und Beachten, ohne ihn auf bloßen Gehorsam zu verengen.
- source_word: Neque cogites
  choice: Gedenke nicht
  rationale: Eine natürliche, würdige Gebetsformulierung für die Bitte, jemanden nicht in Betracht zu ziehen oder seiner zu gedenken.
theological_decisions:
- issue: Bedeutungsumfang von testamenta
  choice: Bündnisse
  alternative: Verfügungen / Zeugnisse
  rationale: „Bündnisse“ passt zur Anrede Gottes und lässt den verbindlichen Charakter bestehen; die mögliche breitere lateinische Bedeutung wird in der Fußnote kenntlich gemacht.
- issue: Art des Schmerzes in cum doloribus
  choice: unter Schmerzen
  alternative: mit Schmerzen / durch Leiden hindurch
  rationale: Die Formulierung wahrt die offene Beziehung zwischen dem Bewahren und den Schmerzen und legt weder Mittel noch Ursache fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gedenke nicht derer“ wahrt den Gebetscharakter; das abschließende Komma zeigt, dass der überlieferte Versausschnitt syntaktisch weiterführt.
