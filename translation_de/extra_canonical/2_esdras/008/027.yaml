  naturalness: „Gedenke nicht derer“ ist würdig und verständlich. „die sich vor dir falsch verhalten haben“ bleibt gegenüber falso egerunt unnötig unbestimmt; „treulos gehandelt“ ist idiomatischer und gibt das ethisch-religiöse Fehlhandeln klar wieder.
  terminology: „Weisungen“ gibt testamenta im Kontext des Bewahrens göttlicher Vorgaben natürlich wieder, ohne die umstrittene genaue Vorlage oder eine spezifische Bundeslehre festzulegen. Die Fußnote sollte die mögliche Wiedergabe als „Bundesverpflichtungen“ bzw. „Zeugnisse“ nennen, nicht die hier nicht gemeinte Bedeutung als letztwillige Verfügung.
