  source_fidelity: 'Der Entwurf gibt den erhaltenen lateinischen Fragmenttext zutreffend wieder: „iudicati“ bleibt als Anschluss „gerichtet werden“, „sed diligas“ als an Gott gerichtete Bitte „sondern liebe“, „in tua gloria confiderunt“ als Vertrauen auf Gottes Herrlichkeit und „mortalibus moribus egimus“ ohne unzulässige Gleichsetzung mit ausdrücklich sündigem Handeln. „du aber“ entspricht dem abgebrochenen „tu autem“; es wird kein nicht im bereitgestellten Text enthaltener Abschluss ergänzt.'
