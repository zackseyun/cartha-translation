  text: judged, but love those who have always trusted in your glory. For we and our fathers have lived in mortal ways, but you, however,
translation:
  language: de
  text: gerichtet werden, sondern liebe die, die stets auf deine Herrlichkeit vertraut haben. Denn wir und unsere Väter haben nach der Art Sterblicher gelebt; du aber …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier zugrunde gelegte lateinische Text bricht an dieser Stelle nach „du aber“ ab.
    reason: Kennzeichnet transparent, dass die Unvollständigkeit auf der bereitgestellten Textgrundlage beruht.
lexical_decisions:
- source_word: diligas
  choice: liebe
  rationale: Gibt den lateinischen Konjunktiv im fortlaufenden Gebetszusammenhang als Aufforderung wieder und bewahrt die Stärke von „diligere“.
- source_word: in tua gloria confiderunt
  choice: auf deine Herrlichkeit vertraut haben
  rationale: Natürliches modernes Deutsch für das vollendete lateinische „confiderunt“; „Herrlichkeit“ wahrt den theologischen Gehalt von „gloria“.
- source_word: mortalibus moribus egimus
  choice: haben nach der Art Sterblicher gelebt
  rationale: Gibt „mortalibus moribus“ idiomatisch wieder, ohne es vorschnell als ausdrücklich sündiges Verhalten auszulegen; „egimus“ bezeichnet hier die gelebte Lebensführung.
theological_decisions:
- issue: Bedeutung von „mortalibus moribus“
  choice: nach der Art Sterblicher
  alternative: in sündiger Weise
  rationale: Der lateinische Wortlaut spricht ausdrücklich von sterblicher, nicht unmittelbar von sündiger Lebensweise. Die offenere Formulierung bewahrt die mögliche theologische Spannung.
- issue: Abgebrochener Gegensatz bei „tu autem“
  choice: du aber …
  alternative: den Satz aus dem weiteren Überlieferungszusammenhang ergänzen
  rationale: Die bereitgestellte Quellenstelle endet mit „tu autem“. Die Auslassungspunkte kennzeichnen den unvollständigen Satz, ohne unbelegten Inhalt einzufügen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der Beginn bleibt als Fortsetzung des vorhergehenden Satzes erkennbar; das Satzende wird wegen des abgebrochenen lateinischen Ausgangstextes nicht ergänzt.
