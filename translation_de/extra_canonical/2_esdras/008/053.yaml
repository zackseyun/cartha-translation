lexical_decisions:
- source_word: ante perfecta sapientia
  choice: Die Weisheit ist im Voraus vollendet worden
  rationale: Bewahrt die vorangestellte zeitliche Angabe „ante“ und gibt das elliptische lateinische Passiv als vollständigen deutschen Satz wieder.
- source_word: Radix
  choice: die Wurzel
  rationale: Die konkrete Metapher des Ausgangstextes bleibt ohne auslegende Präzisierung erhalten.
- source_word: signata est a uobis
  choice: ist von euch versiegelt worden
  rationale: Das lateinische Passiv mit „a vobis“ bezeichnet grammatisch die handelnde Instanz; „versiegelt“ bewahrt die Bildsprache von „signare“.
- source_word: infirmitas extincta est a uobis
  choice: die Schwachheit [ist] von euch ausgelöscht [worden]
  rationale: „Schwachheit“ ist eine natürliche, hinreichend breite Wiedergabe von „infirmitas“; die Passivkonstruktion und die Urheberschaft durch „euch“ bleiben erhalten.
- source_word: infernus fugit
  choice: die Unterwelt ist geflohen
  rationale: „Unterwelt“ gibt den Totenbereich von „infernus“ wieder, ohne ihn als späteren theologischen Begriff „Hölle“ zu verengen.
theological_decisions:
- issue: Bezug von „a vobis“
  choice: von euch im Sinn der handelnden Instanz
  alternative: vor euch / von euch weg
  rationale: Beim lateinischen Passiv ist „a/ab“ mit Ablativ regulär eine Agensangabe. Die ungewöhnliche theologische Aussage wird nicht durch eine kontextuell glattere Deutung ersetzt.
- issue: Wiedergabe von „infernus“
  choice: Unterwelt
  alternative: Hades oder Hölle
  rationale: „Unterwelt“ wahrt die Vorstellung vom Totenreich und vermeidet sowohl eine griechische Transliteration als auch die mögliche Verengung auf einen Ort endzeitlicher Strafe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Passivformen spiegeln die feierliche Struktur des lateinischen Textes; das abschließende „und …“ macht sichtbar, dass der überlieferte Versausschnitt syntaktisch weiterführt.
