base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/045.yaml
  text: let it not be upon us[a], but spare your people and have mercy on your inheritance, for you have mercy on your own creation.”
translation:
  language: de
  text: Lass es nicht über uns kommen,[a] sondern verschone dein Volk und erbarme dich deines Erbteils; denn du erbarmst dich deiner eigenen Schöpfung.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »über uns«; die Verneinung steht im vorhergehenden Vers.'
    reason: Die lateinische Formulierung ist versübergreifend und elliptisch; die Ergänzung »Lass es … kommen« macht den Zusammenhang im Deutschen deutlich.
lexical_decisions:
- source_word: super nos
  choice: über uns kommen
  rationale: Die Wendung ergänzt die Verneinung aus dem vorhergehenden Vers. Im Deutschen macht »kommen« die im Lateinischen elliptische Bitte verständlich, ohne »super nos« als Gottesbezeichnung misszuverstehen.
- source_word: parce populo tuo
  choice: verschone dein Volk
  rationale: »parcere« bezeichnet hier die Bitte, das Volk vor dem angekündigten Unheil zu bewahren.
- source_word: haereditati tuae
  choice: dein Erbteil
  rationale: »Erbteil« bewahrt das biblisch-theologische Bild eines Volkes, das Gott als sein Eigentum zugehört.
- source_word: tuae ... creaturae
  choice: deine eigene Schöpfung
  rationale: »Schöpfung« gibt das singularische »creatura« natürlich wieder; »eigene« bildet die emphatische Wiederholung von »tuae« ab.
theological_decisions:
- issue: Bezug von »super nos«
  choice: 'Als Fortsetzung der verneinten Bitte aus 8,44: »Lass es nicht über uns kommen«'
  alternative: »über uns« als isolierte Wendung oder als Gottesbezeichnung auffassen
  rationale: Der lateinische Satzbau verbindet »super nos« mit »Non, domine« aus dem vorhergehenden Vers; gemeint ist die Abwendung des angedrohten Geschehens.
- issue: Umfang des göttlichen Erbarmens in »creatura«
  choice: »deine eigene Schöpfung«
  alternative: »dein eigenes Geschöpf«
  rationale: Der lateinische Singular kann sowohl kollektiv als »Schöpfung« als auch individuell als »Geschöpf« verstanden werden. Der Kontext mit Volk und Erbteil legt die kollektive Wiedergabe nahe, ohne den Schöpferbezug einzuengen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. »Erbteil« bleibt als verständlicher biblischer Bildbegriff erhalten; die elliptische lateinische Konstruktion wird behutsam vervollständigt.
