source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dinem earum quae collectae sunt gentes, proteget qui superauerit populum, Et tunc ostendet eis multa plurima portenta. Et dixi ego : dominator domine, hoc mihi ostende, propter quod uidi uirum ascendentem de corde maris. et dixit mihi : Sicut non potest hoc uel scrutinare uel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram uidere filium meum uel eos qui cum eo sunt nisi in tempore diei. Haec est interpretatio somnii quod uidisti, et propter hoc inluminatus es haec solus. Dereliquisti enim tua, et circa mea uacasti, et legem meam exquisisti ; Vitam enim tuam disposuisti in sapientiam, et sensum tuum uocasti matrem. Et propter hoc ostendi tibi haec, merces enim apud altissimum. erit enim post alios tres dies ad te alia loquar, et exponam tibi grauia et mirabilia. Et profectus sum et transii in campum, multum glorificans et laudans altissimum de mirabilibus quae per tempus faciebat, Et quoniam gubernat tempora et quae sunt in temporibus inlata : et sedi
    ibi tribus diebus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/049.yaml
  text: Then it will be, when he begins to destroy the gathered multitude of the nations, that he will protect the people who survive.
translation:
  language: de
  text: Wenn er dann beginnt, die versammelte Menge der Völker zu vernichten, wird er das Volk beschützen, das überlebt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae collectae sunt gentes
  choice: die versammelte Menge der Völker
  rationale: Die Formulierung gibt die Zusammenkunft der Völker wieder und bewahrt zugleich den kollektiven Singular „Menge“ aus dem nur teilweise erhaltenen Satzanfang.
- source_word: proteget
  choice: wird er … beschützen
  rationale: Das Futur wird direkt wiedergegeben; „beschützen“ ist natürliches modernes Deutsch für den zugesagten Schutz.
- source_word: qui superauerit populum
  choice: das Volk, das übrig geblieben ist
  rationale: Im Kontext bezeichnet die schwierige lateinische Formulierung das nach der Vernichtung der versammelten Völker verbleibende Volk. Die Übersetzung folgt diesem kontextuell gesicherten Sinn, ohne ein militärisches Überwinden durch das Volk einzutragen.
theological_decisions:
- issue: Identität des geschützten Volkes
  choice: das Volk
  alternative: sein Volk / Gottes Volk
  rationale: Der lateinische Text sagt lediglich „populum“. Ein Possessivzusatz würde die Identität stärker bestimmen, als es der Wortlaut dieses Verses tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Der zeitliche Zusammenhang und der Gegensatz zwischen der Vernichtung der versammelten Völker und dem Schutz des verbliebenen Volkes bleiben erhalten.
