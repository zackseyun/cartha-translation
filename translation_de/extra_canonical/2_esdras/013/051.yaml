source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixi ego: Dominator Domine, hoc mihi ostende, propter quod vidi virum ascendentem de corde maris. et dixit mihi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/051.yaml
  text: 'And I said[a], “Lord Master, show me this: why did I see the man coming up from the heart of the sea?” And he said to me:'
translation:
  language: de
  text: 'Und ich sagte: »Gebieter, Herr, zeige mir dies: Warum sah ich den Mann aus dem Herzen des Meeres emporsteigen?« Und er sagte zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominator Domine
  choice: Gebieter, Herr
  rationale: Die doppelte Anrede und ihre Reihenfolge werden bewahrt. »Gebieter« gibt Dominator als Hoheitstitel wieder, während »Herr« Domine entspricht.
- source_word: propter quod
  choice: Warum
  rationale: Im Kontext leitet die Wendung eine direkte Frage nach dem Grund beziehungsweise der Bedeutung der Vision ein.
- source_word: ascendentem
  choice: emporsteigen
  rationale: Das Verb bezeichnet eine nach oben gerichtete Bewegung und passt natürlich zum Hervorkommen aus dem Meer.
- source_word: de corde maris
  choice: aus dem Herzen des Meeres
  rationale: Die bildhafte Formulierung des Lateinischen wird bewahrt, statt sie deutend zu »aus der Mitte des Meeres« abzuflachen.
theological_decisions:
- issue: Wiedergabe der feierlichen Doppelanrede Dominator Domine
  choice: Gebieter, Herr
  alternative: Souveräner Herr; Herr und Gebieter
  rationale: Die gewählte Fassung bildet beide Titel ohne konfessionelle Zusatzdeutung ab und erhält die asyndetische Anrede des Quelltexts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher »Herz des Meeres« und der abschließende, in den folgenden Vers überleitende Doppelpunkt bleiben erhalten.
