source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: de
  text: 'Danach sah ich, und siehe: Eine unzählbare Menge von Menschen sammelte sich aus den vier Winden des Himmels, um gegen den Menschen Krieg zu führen, der aus dem Meer heraufgestiegen war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi post haec, et ecce
  choice: 'Danach sah ich:'
  rationale: Gibt die neue Visionseinheit natürlich und würdig wieder; der Doppelanschluss mit „und“ sowie das lateinische Schauwort „ecce“ werden durch die präsentierende Doppelpunktkonstruktion ausgedrückt.
- source_word: multitudo hominum, quorum non erat numerus
  choice: eine unzählbare Menge von Menschen
  rationale: Bewahrt den Sinn einer nicht zu zählenden Menschenmenge in idiomatischem modernem Deutsch.
- source_word: de quattuor ventis caeli
  choice: aus den vier Winden des Himmels
  rationale: Die bildhafte kosmologische Ausdrucksweise des Lateinischen bleibt erhalten, statt sie deutend zu „aus allen Himmelsrichtungen“ aufzulösen.
- source_word: ut debellarent
  choice: um … Krieg zu führen
  rationale: Gibt die feindliche kriegerische Absicht klar wieder, ohne einen bereits errungenen Sieg anzudeuten.
- source_word: hominem qui ascenderat de mari
  choice: den Menschen, der aus dem Meer heraufgestiegen war
  rationale: Behält die einfache Bezeichnung „Mensch“ und das Plusquamperfekt des lateinischen Relativsatzes bei.
theological_decisions:
- issue: Identität der Gestalt aus dem Meer
  choice: „den Menschen“ ohne christologischen oder sonstigen Deutungszusatz
  alternative: „den Menschensohn“ oder eine ausdrücklich messianische Bezeichnung
  rationale: Der lateinische Text hat lediglich „hominem“; die Identität darf an dieser Stelle nicht durch eine theologische Auslegung festgelegt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die knappe Schauformel wird durch einen Doppelpunkt markiert; die symbolische Wendung „vier Winde des Himmels“ bleibt formal erhalten.
