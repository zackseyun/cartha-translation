  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: de
  text: Und ich brach auf und ging hinaus auf das Feld. Dabei pries und lobte ich den Höchsten sehr für die Wunder, die er im Laufe der Zeit vollbrachte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum
  choice: ich brach auf
  rationale: Gibt den Aufbruch natürlich und zugleich eng am lateinischen Ausdruck wieder.
- source_word: transii in campum
  choice: ging hinaus auf das Feld
  rationale: „campus“ bezeichnet hier das offene Feld; „hinaus“ entspricht im Deutschen dem erzählerischen Übergang aus dem bisherigen Aufenthaltsort.
- source_word: multum glorificans et laudans
  choice: pries und lobte ich … überschwänglich
  rationale: Bewahrt beide lateinischen Verben und gibt „multum“ idiomatisch als starke Intensivierung wieder.
- source_word: Altissimum
  choice: den Höchsten
  rationale: Etablierte und genaue Gottesbezeichnung für den lateinischen Superlativ.
- source_word: de mirabilibus
  choice: für die Wunder
  rationale: „für“ gibt den Anlass beziehungsweise Gegenstand des Preisens im modernen Deutschen natürlich wieder.
- source_word: per tempus
  choice: zu ihrer Zeit
  rationale: Wahrt den Zeitbezug des Lateinischen, ohne die nicht belegte Vorstellung eines bloß gelegentlichen Handelns einzutragen.
theological_decisions:
- issue: Zeitlicher Sinn von „per tempus“
  choice: die er zu ihrer Zeit vollbrachte
  alternative: die er von Zeit zu Zeit vollbrachte
  rationale: Die gewählte Formulierung hält offen, dass die Wunder jeweils in der für sie bestimmten Zeit geschahen; die Alternative würde stärker ein intermittierendes Handeln behaupten.
translation_notes:
  register: Modernes, würdevolles Erzählregister. Die Satzteilung erhöht die Verständlichkeit, ohne den gedanklichen Zusammenhang oder die Partizipialbeziehung des Lateinischen aufzugeben.
