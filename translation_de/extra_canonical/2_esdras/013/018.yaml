  verdict: revise
  source_fidelity: Die Wiedergabe von reposita in novissimis diebus als „für die letzten Tage aufbewahrt“ verschiebt die lateinische Zeitangabe zu einer Zweckbestimmung. Näher am Wortlaut ist „in den letzten Tagen aufbewahrt“. Das plurale eis wird angemessen durch „ihnen“ aufgenommen. Die Bedeutungsalternative von occurrentes („erreichen/gelangen zu“) sollte als Fußnote erhalten bleiben.
  naturalness: Die Satzfragmentierung entspricht dem anschließenden und vorausgehenden Kontext. „Welche Dinge“ ist in diesem Register möglich; die Umstellung zu „welche Dinge in den letzten Tagen aufbewahrt sind“ ist etwas flüssiger. Das im Latein nicht vorhandene „aber“ innerhalb des ersten Satzes wird entfernt; „Doch auch“ gibt sed et passend wieder.
  terminology: „Zurückgelassen worden sind“ gibt derelicti sachlich und ohne zusätzliche theologische Festlegung wieder. „Begegnen“ ist für occurrentes als Hauptlesart vertretbar; die alternative Bedeutung „erreichen“ bleibt markiert.
  issues:
  - severity: medium
    issue: „für die letzten Tage“ statt „in den letzten Tagen“
    rationale: in novissimis diebus ist hier eine zeitliche Angabe. Die Formulierung mit „für“ legt eine nicht ausdrücklich bezeichnete Zweckbestimmung nahe.
  - severity: low
    issue: Zusätzliches „aber“ vor „nicht begegnen“
    rationale: Der kontrastierende Anschluss sed et steht erst vor dem folgenden Satzteil. Ein „aber“ im ersten Teilsatz ist im Deutschen nicht erforderlich und verändert leicht die Gliederung.
