  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
translation:
  language: de
  text: die verstehen, welche Dinge in den letzten Tagen aufbewahrt sind und ihnen nicht begegnen.[a] Doch auch die, die zurückgelassen worden sind
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie nicht erreichen.“'
    reason: Das lateinische occurrere kann hier neben „begegnen“ auch im Sinn von „erreichen“ oder „gelangen zu“ verstanden werden; eis ist Plural und bezieht sich auf die aufbewahrten Dinge.
lexical_decisions:
- source_word: reposita
  choice: aufbewahrt
  rationale: Gibt das lateinische Partizip im Sinn von für einen späteren Zeitpunkt bereitgehalten oder zurückgelegt wieder.
- source_word: in novissimis diebus
  choice: für die letzten Tage
  rationale: Der Kontext verlangt eher eine zeitliche Bestimmung dessen, wofür die Dinge aufbewahrt sind, als lediglich ihren Aufbewahrungsort oder -zeitpunkt.
- source_word: occurrentes eis
  choice: ihnen … begegnen
  rationale: Bewahrt die naheliegende Bedeutung von occurrere mit Dativ und gibt das plurale eis durch „ihnen“ wieder; die mögliche Bedeutung „sie erreichen“ bleibt in der Fußnote erhalten.
- source_word: derelicti
  choice: zurückgelassen
  rationale: Entspricht dem passiven Sinn des lateinischen Ausdrucks, ohne näher zu bestimmen, von wem oder unter welchen Umständen sie zurückgelassen wurden.
theological_decisions:
- issue: Bezug und Bedeutung von „occurrentes eis“
  choice: ihnen aber nicht begegnen
  alternative: sie aber nicht erreichen
  rationale: Der lateinische Wortlaut lässt offen, ob diese Menschen den aufbewahrten Dingen nicht begegnen beziehungsweise sie nicht erleben oder ob sie sie nicht erreichen. Diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fragmentarische Syntax des Verses bleibt erhalten, da der Satz inhaltlich an den vorhergehenden und folgenden Zusammenhang gebunden ist.
