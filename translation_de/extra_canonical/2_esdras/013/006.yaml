  yaml_path: translation/extra_canonical/2_esdras/013/006.yaml
  text: And I looked, and behold, he carved out for himself a great mountain and flew upon it.
translation:
  language: de
  text: 'Und ich sah, und siehe: Er meißelte für sich selbst einen großen Berg und flog über ihm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vidi
  choice: ich sah
  rationale: Die schlichte Wahrnehmungsformel wird direkt und idiomatisch wiedergegeben.
- source_word: ecce
  choice: siehe
  rationale: Das traditionelle, weiterhin verständliche Aufmerksamkeitssignal bewahrt den visionären und würdevollen Ton.
- source_word: sibimet ipso
  choice: sich selbst
  rationale: Gibt die verstärkte lateinische Reflexivform wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: sculpsit
  choice: formte
  rationale: Das Grundbild des gestaltenden Hervorbringens bleibt erhalten; „meißelte“ wäre bei einem ganzen Berg im Deutschen unnötig konkret und missverständlich.
- source_word: montem magnum
  choice: einen großen Berg
  rationale: Direkte und natürliche Entsprechung.
- source_word: volavit super eum
  choice: flog auf ihn
  rationale: Bewahrt die räumliche Bewegung auf den Berg hin; „über ihn“ könnte bloßen Überflug bedeuten, während der Kontext hier das Gelangen auf den Berg nahelegt.
theological_decisions:
- issue: Art und Ursprung des Berges
  choice: „formte sich selbst einen großen Berg“
  alternative: „meißelte für sich einen großen Berg heraus“
  rationale: Die Übersetzung lässt das visionäre Hervorbringen des Berges stehen, ohne dessen Stoff, Entstehungsweise oder symbolische Bedeutung theologisch festzulegen.
- issue: Bezug und Bedeutung von super eum
  choice: „auf ihn“
  alternative: „über ihn“ / „auf ihn hinauf“
  rationale: Das maskuline Pronomen bezieht sich grammatisch auf den Berg. „Auf ihn“ wahrt die mögliche Ziel- oder Aufwärtsbewegung, ohne das im Latein nicht ausdrücklich vorhandene „hinauf“ hinzuzufügen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bewusst beibehaltener biblisch-visionärer Formel „und siehe“. Die ungewöhnliche Bildsprache wird nicht geglättet oder erklärt.
