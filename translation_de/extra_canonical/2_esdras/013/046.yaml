source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'usque in nouissimo tempore: et nunc iterum coeperunt uenire; Iterum altissimus statuit uenas fluminis, ut possint transire.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/046.yaml
  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: de
  text: Dort blieben sie bis zur Endzeit. Nun haben sie wieder begonnen zu kommen. Wieder brachte der Höchste die Wasserläufe des Flusses zum Stillstand[a], damit sie hinüberziehen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielt die Wasseradern des Flusses an“. Das lateinische Bild bezeichnet die Rinnen oder Strömungswege des Flusses.'
    reason: translation_alternative
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: bis zur Endzeit
  rationale: Die Wendung bezeichnet hier die äußerste, letzte Zeit und ist eschatologisch zu verstehen; „Endzeit“ gibt dies im modernen Deutsch klar wieder, ohne die Singularform unnötig aufzulösen.
- source_word: coeperunt uenire
  choice: haben sie begonnen zu kommen
  rationale: Das Perfekt coeperunt wird als vollendeter Beginn wiedergegeben; der Infinitiv uenire bleibt bewusst allgemein und wird nicht etwa zu „heimzukehren“ präzisiert.
- source_word: altissimus
  choice: der Höchste
  rationale: Traditionelle und zugleich allgemein verständliche Wiedergabe des lateinischen Gottesprädikats.
- source_word: uenas fluminis
  choice: die Wasserläufe des Flusses
  rationale: Wörtlich sind es die „Adern“ des Flusses; „Wasserläufe“ bezeichnet verständlich dessen Rinnen oder Strömungswege.
- source_word: statuit
  choice: ließ … zum Stillstand
  rationale: Im Zusammenhang mit dem ermöglichten Übergang ist ein Anhalten des Flusswassers gemeint. Die Formulierung bewahrt jedoch eher das Bild des Stillstands als die stärkere Deutung „legte trocken“.
- source_word: transire
  choice: hinüberziehen
  rationale: Das Verb bezeichnet das Überschreiten beziehungsweise Hinübergehen; „hinüberziehen“ passt zum gemeinsamen Zug des Volkes.
theological_decisions:
- issue: Eschatologische Bedeutung von nouissimum tempus
  choice: Endzeit
  alternative: letzte Zeit
  rationale: „Letzte Zeit“ könnte im heutigen Deutsch als die jüngst vergangene Zeit missverstanden werden. „Endzeit“ macht den im Kontext naheliegenden Bezug auf die abschließende Weltzeit deutlich.
- issue: Art des göttlichen Eingriffs am Fluss
  choice: ließ die Wasserläufe des Flusses zum Stillstand
  alternative: verstopfte die Flussrinnen
  rationale: Das lateinische statuit bezeichnet nicht ausdrücklich ein Verstopfen. Die gewählte Fassung wahrt die Aussage, dass Gott den Flussübergang ermöglicht, ohne den konkreten Vorgang über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dort blieben sie“ ergänzt den im versübergreifenden lateinischen Satz vorausgesetzten Aufenthalt entsprechend dem unmittelbaren Zusammenhang. Kurze Hauptsätze bewahren den erzählerisch-apokalyptischen Ton.
