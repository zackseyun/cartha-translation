  yaml_path: translation/extra_canonical/2_esdras/013/027.yaml
  text: And because you saw breath and fire and storm coming out from his mouth,[a]
translation:
  language: de
  text: Und weil du sahst, wie etwas, das Atem, Feuer und Sturm glich, aus seinem Mund hervorkam,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas, das Wind, Feuer und Sturm glich“; auch „Geist“ ist möglich.'
    reason: Das lateinische spiritum kann „Atem“, „Wind“ oder „Geist“ bedeuten. Die Vergleichskonstruktion gibt ut wieder.
lexical_decisions:
- source_word: quoniam
  choice: weil
  rationale: Gibt die begründende Verknüpfung des lateinischen Satzes natürlich und direkt wieder.
- source_word: ut
  choice: gleichsam wie
  rationale: Bewahrt das Vergleichs- bzw. Erscheinungsmoment der Vision, das in einer Wiedergabe ohne Vergleichspartikel verloren ginge.
- source_word: spiritum
  choice: Atem
  rationale: Im Zusammenhang mit dem Hervorgehen aus dem Mund und neben Feuer und Sturm bezeichnet das Wort am ehesten Atem bzw. einen ausgeatmeten Hauch; die mögliche Bedeutung „Geist“ bleibt in der Fußnote erhalten.
- source_word: tempestatem
  choice: Sturm
  rationale: Eine klare, idiomatische Wiedergabe der gewaltigen atmosphärischen Erscheinung.
- source_word: de ore eius exire
  choice: aus seinem Mund hervorging
  rationale: Folgt der Bewegungsrichtung des Lateinischen und klingt in gehobenem modernem Deutsch natürlich.
theological_decisions:
- issue: Bedeutung von spiritum
  choice: Atem
  alternative: Geist oder Wind
  rationale: Der unmittelbare Bildzusammenhang spricht für etwas, das aus dem Mund hervorgeht. Da das lateinische Wort mehrdeutig ist, wird die Alternative nicht dogmatisch ausgeschlossen, sondern vermerkt.
- issue: Funktion von ut
  choice: vergleichende visionäre Annäherung („gleichsam wie“)
  alternative: ut unübersetzt lassen und die Dinge unmittelbar benennen
  rationale: Die Vergleichspartikel ist im Quelltext ausdrücklich vorhanden und kennzeichnet die Erscheinung als visionäre Ähnlichkeit; sie darf daher nicht stillschweigend entfallen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gleichsam wie“ erhält die apokalyptische Vergleichssprache; „hervorging“ entspricht dem visionären Erzählregister.
