  text: quibus incipient cruciari, Quae adsimilatae sunt flammae, et perdet eos sine labore et legem quae igni adsimilata est. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: de
  text: mit denen sie gequält zu werden beginnen, die mit einer Flamme verglichen worden sind; und er wird sie mühelos vernichten und das Gesetz, das mit Feuer verglichen worden ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cruciari
  choice: gequält zu werden
  rationale: Das lateinische Passiv bezeichnet das Erleiden von Qual; die Formulierung bewahrt zusammen mit „beginnen“ den aspektuellen Gehalt von „incipient cruciari“.
- source_word: adsimilatae sunt flammae
  choice: mit einer Flamme verglichen werden
  rationale: „adsimilare“ bezeichnet hier eine bildhafte Gleichsetzung beziehungsweise Ähnlichkeit; das Präsens im Deutschen gibt den bestehenden Vergleich natürlich wieder.
- source_word: sine labore
  choice: ohne Mühe
  rationale: Gibt die Bedeutung wörtlich und zugleich idiomatisch wieder, ohne eine zusätzliche Vorstellung von Kampf oder Anstrengung einzutragen.
- source_word: legem quae igni adsimilata est
  choice: das Gesetz, das mit Feuer verglichen wird
  rationale: Bewahrt sowohl „lex“ als Gesetz als auch den ausdrücklich formulierten Vergleich mit Feuer.
theological_decisions:
- issue: Syntaktische Stellung von „et legem“
  choice: „und auch das Gesetz“ wird als weiteres Objekt von „vernichten“ wiedergegeben.
  alternative: „durch das Gesetz“ als Mittel seiner Vernichtung
  rationale: Der überlieferte lateinische Text hat den Akkusativ „legem“ mit koordinierendem „et“ und keine instrumentale Konstruktion. Die ungewöhnliche und theologisch spannungsreiche Aussage wird daher nicht stillschweigend geglättet.
translation_notes:
  register: Moderne, verständliche und würdevolle Standardsprache. Der Vers beginnt als Fortsetzung des vorangehenden Satzes; deshalb bleibt der Anfang kleingeschrieben. Die auffällige Koordination am Versende wird trotz ihrer inhaltlichen Schwierigkeit bewahrt.
