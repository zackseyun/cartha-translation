  yaml_path: translation/extra_canonical/2_esdras/013/054.yaml
  text: For you have forsaken what belongs to you and have devoted yourself to what belongs to me, and have searched out my law.
translation:
  language: de
  text: Denn du hast deine eigenen Angelegenheiten aufgegeben, dich meinen Angelegenheiten gewidmet und mein Gesetz sorgfältig erforscht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti ... tua
  choice: du hast das Deine aufgegeben
  rationale: Gibt die Aufgabe der eigenen Angelegenheiten natürlich und prägnant wieder; „das Deine“ bewahrt die Gegenüberstellung zu „dem Meinen“.
- source_word: circa mea vacasti
  choice: dich dem Meinen gewidmet
  rationale: Das spätlateinische „vacare circa“ bezeichnet, sich einer Sache frei und mit Hingabe zuzuwenden; die Formulierung klingt im modernen Deutsch würdig und verständlich.
- source_word: legem meam exquisisti
  choice: mein Gesetz eifrig erforscht
  rationale: „Exquirere“ meint sorgfältiges Suchen, Erforschen oder Ergründen. „Eifrig erforscht“ bewahrt den intensiven Charakter, ohne ein bestimmtes Ergebnis vorwegzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Gegenüberstellung „das Deine“ / „dem Meinen“ bildet die Struktur des lateinischen Textes ab; die drei Handlungen bleiben klar koordiniert.
