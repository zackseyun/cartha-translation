lexical_decisions:
- source_word: ecce
  choice: siehe
  rationale: Bewahrt den visionären Aufmerksamkeitssignalton des lateinischen Textes in würdigem, geläufigem Bibeldeutsch.
- source_word: de mari
  choice: vom Meer her
  rationale: Gibt die Herkunftsangabe natürlich wieder, ohne über die räumliche Beziehung hinauszugehen.
- source_word: ventus exsurgebat
  choice: ein Wind erhob sich
  rationale: Entspricht dem inchoativen Vorgang von exsurgebat und bewahrt das Bild des aufkommenden Windes.
- source_word: conturbaret
  choice: aufzuwühlen
  rationale: Gibt die starke Bewegung beziehungsweise Unruhe der Wellen idiomatisch wieder.
- source_word: omnes fluctus eius
  choice: alle seine Wellen
  rationale: Bewahrt sowohl omnes als auch den Rückbezug des Possessivpronomens auf das Meer.
