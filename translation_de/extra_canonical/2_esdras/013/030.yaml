lexical_decisions:
- source_word: incipiet
  choice: wird … beginnen
  rationale: Gibt das lateinische Futur und den Beginn der Handlung ausdrücklich wieder.
- source_word: altissimus
  choice: der Höchste
  rationale: Die etablierte und würdevolle Gottesbezeichnung entspricht dem lateinischen Superlativ.
- source_word: liberare
  choice: zu befreien
  rationale: Bewahrt die breite Bedeutung von Rettung beziehungsweise Befreiung, ohne die Art der Bedrängnis näher festzulegen.
- source_word: eos qui super terram sunt
  choice: die, die auf der Erde sind
  rationale: Folgt der umfassenden und bewusst unbestimmten Formulierung des lateinischen Textes.
theological_decisions:
- issue: Reichweite der Befreiung
  choice: die, die auf der Erde sind
  alternative: die Bewohner der Erde
  rationale: Die substantivierte Relativkonstruktion wahrt die Offenheit des Ausgangstextes und legt weder Universalität noch eine bestimmte Menschengruppe zusätzlich fest.
translation_notes:
