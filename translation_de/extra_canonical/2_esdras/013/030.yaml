  source_fidelity: Der Entwurf gibt das lateinische Futur „incipiet“ mit „wird ... beginnen“ präzise wieder und erhält ausdrücklich den aspektuellen Beginn der Befreiung. „der Höchste“ entspricht „altissimus“, und „die auf der Erde sind“ bildet „eos qui super terram sunt“ ohne zusätzliche Eingrenzung oder theologische Festlegung ab. Das einleitende „Dann“ ist im fortlaufenden Kontext eine vertretbare natürliche Wiedergabe von „Et“.
