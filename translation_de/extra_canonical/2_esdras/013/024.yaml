source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: scito ergo, quoniam magis beatificati sunt qui derelicti super eos qui mortui sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/024.yaml
  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: de
  text: 'Darum wisse: Diejenigen, die übrig geblieben sind, sind glücklicher zu preisen als diejenigen, die gestorben sind.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  choice: Darum wisse
  rationale: Bewahrt den folgernden Charakter von „ergo“ und gibt den singularischen Imperativ „scito“ knapp und würdevoll wieder.
- source_word: magis beatificati sunt
  choice: sind glücklicher zu preisen
  rationale: Gibt die vergleichende Aussage und den Sinn von „beatificati“ als beglückwünschens- bzw. seligzupreisenden Zustand wieder, ohne sie auf bloß subjektives Glück zu reduzieren.
- source_word: qui derelicti
  choice: diejenigen, die übrig geblieben sind
  rationale: Im Gegensatz zu den Gestorbenen bezeichnet „derelicti“ hier die Zurückgebliebenen beziehungsweise Überlebenden; „übrig geblieben“ ist im Deutschen natürlich und kontextgerecht.
- source_word: super eos qui mortui sunt
  choice: als diejenigen, die gestorben sind
  rationale: Das komparative „super“ wird idiomatisch mit „als“ wiedergegeben; der vollendete Zustand von „mortui sunt“ bleibt erhalten.
theological_decisions:
- issue: Art der Seligpreisung der Übriggebliebenen
  choice: glücklicher zu preisen
  alternative: seliger
  rationale: Die Formulierung bewahrt die wertende Seligpreisung, legt aber nicht über den lateinischen Wortlaut hinaus eine bestimmte Lehre über Heil oder ewige Seligkeit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am lateinischen Ausgangstext, während der Vergleich idiomatisch deutsch formuliert ist.
