    issue: Zusatznuance in „herausgemeißelt“
    rationale: sculptus esset bezeichnet, dass der Berg gemeißelt bzw. gehauen worden war; „heraus-“ ist im lateinischen Text nicht ausgedrückt.
  - severity: low
    issue: Relativanschluss „aus dem“ verengt die Alternative
    rationale: Das Maskulinum „dem“ knüpft formal an „Ort“ an, während der lateinische Relativausdruck unde sowohl regionem als auch locum umfasst.
