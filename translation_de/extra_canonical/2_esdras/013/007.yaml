  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: de
  text: Ich aber suchte die Gegend oder den Ort zu sehen, woher der Berg gemeißelt worden war, konnte es aber nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaesivi videre
  choice: versuchte, … zu sehen
  rationale: Gibt das lateinische Bemühen idiomatisch wieder, ohne bloßes Fragen oder Suchen nahezulegen.
- source_word: regionem vel locum
  choice: die Gegend oder den Ort
  rationale: Bewahrt beide räumlichen Begriffe und die Alternative vel.
- source_word: unde sculptus esset mons
  choice: aus dem der Berg herausgemeißelt worden war
  rationale: Bewahrt das Herkunftsmotiv von unde und die bildhauerische Bedeutung von sculptus; das Plusquamperfekt entspricht der Vorzeitigkeit des lateinischen Konjunktiv Plusquamperfekt.
- source_word: et non potui
  choice: doch es gelang mir nicht
  rationale: Natürliches Deutsch für das Unvermögen im Kontext des versuchten Sehens; doch gibt den faktischen Gegensatz idiomatisch wieder.
