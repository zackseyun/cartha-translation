source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Wie niemand erforschen oder wissen kann, was in der Tiefe des Meeres ist, so wird niemand auf Erden meinen Sohn oder die, die bei ihm sind, sehen können — außer zur Zeit jenes Tages.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare
  choice: erforschen
  rationale: Gibt das prüfende, gründliche Erkunden des lateinischen Verbs in natürlichem modernem Deutsch wieder.
- source_word: in profundo maris
  choice: in der Tiefe des Meeres
  rationale: Bewahrt das räumliche Bild des lateinischen Singulars und klingt zugleich idiomatisch.
- source_word: Filium meum
  choice: meinen Sohn
  rationale: Entspricht direkt dem lateinischen Ausdruck und bewahrt dessen christologische Bezeichnung.
- source_word: eos qui cum eo sunt
  choice: die, die bei ihm sind
  rationale: Gibt die Zugehörigkeit beziehungsweise Gegenwart bei ihm wieder, ohne die Identität der Gruppe näher festzulegen.
- source_word: in tempore diei
  choice: zur Zeit jenes Tages
  rationale: Bewahrt den zeitlichen Ausdruck und gibt den im Kontext bestimmten eschatologischen Tag natürlich wieder, ohne ihn als »seinen Tag« umzudeuten.
theological_decisions:
- issue: Sichtbarkeit des Sohnes und seiner Begleiter
  choice: »wird ... sehen können — außer zur Zeit jenes Tages«
  alternative: »kann ... nur zur Zeit jenes Tages sehen«
  rationale: Die gewählte Form bewahrt die ausdrückliche Ausnahmeform des lateinischen nisi und lässt offen, wie das Sehen an jenem Tag genau zu verstehen ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Satzbau »Wie ... so ...« spiegelt die lateinische Vergleichsstruktur; der Gedankenstrich macht die abschließende Ausnahme verständlich, ohne den Sinn zu erweitern.
