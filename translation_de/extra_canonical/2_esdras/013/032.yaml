source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et gens ad gentem et regnum aduersus regnum. Et erit cum fient haec, et contingent signa quae ante ostendi tibi, et tunc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/032.yaml
  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
translation:
  language: de
  text: 'Nation gegen Nation[a] und Königreich gegen Königreich. Und es wird geschehen: Wenn dies geschieht und die Zeichen eintreten, die ich dir zuvor gezeigt habe, dann'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Volk gegen Volk“.'
    reason: Gens kann sowohl „Nation“ als auch „Volk“ bezeichnen; die Alternative bewahrt diese echte lexikalische Spannweite.
lexical_decisions:
- source_word: gens
  choice: Nation
  rationale: Das lateinische gens bezeichnet hier im apokalyptischen Gegensatz eine ethnisch-politische Gemeinschaft; „Nation“ bewahrt die feste Wendung und entspricht dem anschließenden „Königreich“.
- source_word: regnum
  choice: Königreich
  rationale: Gibt den politischen Herrschaftsbereich von regnum unmittelbar und im etablierten biblischen Sprachgebrauch wieder.
- source_word: contingent
  choice: eintreten
  rationale: Bei angekündigten Zeichen bezeichnet contingere ihr tatsächliches Eintreffen; „eintreten“ klingt im Deutschen natürlich und wahrt den Zukunftsbezug.
- source_word: ante ostendi tibi
  choice: die ich dir zuvor gezeigt habe
  rationale: Bewahrt Zeitbezug, Handlung und Adressaten des lateinischen Ausdrucks in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutungsumfang von gens
  choice: Nation
  alternative: Volk
  rationale: „Nation“ erhält den apokalyptischen Ausdruck einer kollektiven Auseinandersetzung und die Parallelität zu regnum, ohne moderne Einzelpersonen in den Vordergrund zu rücken; die mögliche Wiedergabe „Volk“ bleibt in der Fußnote sichtbar.
- issue: Unvollständiger Satzschluss mit et tunc
  choice: Der Vers endet mit „dann“ und bleibt syntaktisch offen.
  alternative: Den Gedanken durch Ergänzung aus dem Folgevers abschließen.
  rationale: Der lateinische Vers endet selbst mit et tunc. Eine Ergänzung würde über den gegebenen Quelltext hinausgehen und möglicherweise die Versgliederung oder Deutung vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener apokalyptischer Parallelformel. Der mit „dann“ offene Schluss folgt der unvollständigen Syntax des lateinischen Verses und führt in den nächsten Vers weiter.
