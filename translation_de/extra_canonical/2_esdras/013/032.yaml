  verdict: approve
  source_fidelity: Die Übersetzung gibt die lateinische Parallelformel „gens ad gentem et regnum adversus regnum“ präzise als „Nation gegen Nation und Königreich gegen Königreich“ wieder. „Wenn dies geschieht“ entspricht dem pluralischen „cum fient haec“, „die Zeichen eintreten“ trifft „contingent signa“, und „die ich dir zuvor gezeigt habe“ bildet „quae ante ostendi tibi“ vollständig ab. Der offene Abschluss „dann“ bewahrt das im überlieferten Text ebenfalls unabgeschlossene „et tunc“, ohne Inhalt aus dem Folgevers vorwegzunehmen.
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die mit Doppelpunkt eingeleitete Bedingungskonstruktion ist natürlich; der bewusst offene Schluss ist aufgrund der Quelltextgrenze angemessen.
  terminology: „Nation“ ist für gens im apokalyptisch-politischen Parallelismus sachgerecht und stimmt mit der englischen Audit-Entscheidung überein. „Königreich“ gibt regnum im etablierten biblischen Register treffend wieder. Die Fußnote mit „Volk“ markiert die mögliche lexikalische Alternative, ohne die Hauptübersetzung zu verwässern.
