lexical_decisions:
- source_word: uolentes uenire
  choice: die kommen … wollen
  rationale: Gibt die Absichtskonstruktion mit dem Infinitiv natürlich und nah am lateinischen Wortlaut wieder.
- source_word: expugnare
  choice: bezwingen
  rationale: Das Verb bezeichnet mehr als den bloßen Beginn eines Angriffs und kann ‚erstürmen‘, ‚überwältigen‘ oder ‚besiegen‘ bedeuten. „Bezwingen“ wahrt hier das Ziel des feindlichen Vorgehens, ohne einen bereits eingetretenen Sieg zu behaupten.
- source_word: eum
  choice: ihn
  rationale: Das männliche Singularpronomen wird entsprechend wiedergegeben.
