  text: but I only saw how he sent out from his mouth like a wave of fire, and from his lips a breath of flame, and from his tongue he shot out sparks of storm.
translation:
  language: de
  text: sondern ich sah nur, wie er aus seinem Mund gleichsam eine Feuerwelle ausstieß, aus seinen Lippen einen Flammenhauch und aus seiner Zunge Sturmfunken hervorschießen ließ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut fluctum ignis
  choice: gleichsam eine Feuerwelle
  rationale: Bewahrt den ausdrücklich vergleichenden Charakter von sicut und gibt das starke Bild des lateinischen Ausdrucks natürlich wieder.
- source_word: spiritum flammae
  choice: einen Flammenhauch
  rationale: Spiritus bezeichnet hier einen ausgehenden Hauch; das Kompositum ist im Deutschen knapp und erhält das Flammenbild.
- source_word: scintillas tempestatis
  choice: Sturmfunken
  rationale: Die ungewöhnliche Bildverbindung wird bewusst nicht geglättet; „Sturm“ kann sowohl heftige Bewegung als auch Unwetter anklingen lassen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Das einleitende „sondern“ führt den Gegensatz des syntaktisch vorausgehenden lateinischen Satzteils fort. Das am Ende der Quellenzeile stehende „et“ gehört zum anschließenden Satz und wird daher in diesem Vers nicht wiedergegeben.
