revisions:
- from: Er ist es, den der Höchste seit vielen Zeitaltern bewahrt. Er wird aus eigener Kraft seine Schöpfung befreien, und er selbst wird denen, die übrig geblieben sind, den Weg weisen.
  to: Dieser ist es, den der Höchste seit vielen Zeiten bewahrt. Er wird durch sich selbst seine Schöpfung befreien und selbst die Zurückgelassenen leiten.
  rationale: Die Revision ersetzt zwei interpretativere Formulierungen durch nähere, weiterhin natürliche Entsprechungen und stellt die passive Nuance bei derelicti sunt wieder her. Die Identität der Gestalt und der Umfang von „seine Schöpfung“ bleiben bewusst unbestimmt.
