source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: de
  text: Dieser ist es, den der Höchste seit vielen Zeiten bewahrt. Er wird durch sich selbst seine Schöpfung befreien und selbst die Zurückgelassenen leiten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conservat
  choice: bewahrt
  rationale: Das lateinische Präsens kann im Zusammenhang einen bis zur Gegenwart andauernden Vorgang bezeichnen; „seit vielen Zeitaltern bewahrt“ gibt diesen Sinn natürlich wieder, ohne die zeitliche Aussage abzuschwächen.
- source_word: multis temporibus
  choice: seit vielen Zeitaltern
  rationale: „Zeitalter“ vermittelt die lange heilsgeschichtliche Zeitspanne besser als das allgemeinere „Zeiten“; „seit“ macht die fortdauernde Bewahrung im Deutschen idiomatisch.
- source_word: per semet ipsum
  choice: aus eigener Kraft
  rationale: Die Wendung betont, dass er selbst und ohne fremde Hilfe handelt. „Aus eigener Kraft“ ist natürliches modernes Deutsch und bewahrt diesen Nachdruck.
- source_word: liberabit
  choice: befreien
  rationale: „Befreien“ entspricht dem zukünftigen rettenden Handeln, ohne über den lateinischen Ausdruck hinaus eine spezifische Erlösungslehre einzutragen.
- source_word: creaturam suam
  choice: seine Schöpfung
  rationale: „Schöpfung“ wahrt die mögliche kollektive Weite von creatura und klingt im Deutschen natürlicher als „sein Geschöpf“.
- source_word: disponet
  choice: den Weg weisen
  rationale: Disponere kann ordnen, lenken oder anweisen bedeuten. Im Bezug auf Personen gibt „den Weg weisen“ eine leitende Tätigkeit verständlich wieder, ohne ein starres administratives Ordnen zu unterstellen.
- source_word: qui derelicti sunt
  choice: denen, die übrig geblieben sind
  rationale: Die passive Form und der Gedanke eines verbliebenen Restes werden gewahrt; die Formulierung lässt offen, wodurch oder nach welchem Ereignis sie übrig geblieben sind.
theological_decisions:
- issue: Identität und Eigenhandeln der bewahrten Gestalt
  choice: Die wiederholte Hervorhebung „Er ist es“ und „er selbst“ bleibt erhalten.
  alternative: Die Wiederholung stilistisch glätten oder die Gestalt ausdrücklich als Messias bezeichnen.
  rationale: Der lateinische Text betont die Person, nennt hier jedoch keinen Titel. Die Übersetzung wahrt den Nachdruck, ohne die Identität über den Wortlaut hinaus festzulegen.
- issue: Umfang von „creaturam suam“
  choice: „seine Schöpfung“
  alternative: „sein Geschöpf“ oder „sein Volk“
  rationale: Der lateinische Singular kann kollektiv verstanden werden. „Schöpfung“ erhält die größere Bedeutungsweite; „sein Volk“ wäre eine unbelegte theologische Einengung.
- issue: Art der Leitung der Übriggebliebenen
  choice: „den Weg weisen“
  alternative: „ordnen“, „lenken“ oder „anweisen“
  rationale: Die genaue Nuance von disponet bleibt auslegungsfähig. Die gewählte Form bezeichnet wirksame Leitung, ohne eine bestimmte Herrschafts- oder Gemeindeordnung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei Sätze vermeiden eine überladene Relativsatzkette und bewahren zugleich die dreifache Hervorhebung der handelnden Person. Keine Fußnoten erforderlich.
