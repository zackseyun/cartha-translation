  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/025.yaml
  text: 'For this is the interpretation of the vision: because you saw a man coming up from the heart of the sea,[a]'
translation:
  language: de
  text: 'Denn[a] dies ist die Deutung der Vision: Weil du einen Mann aus dem Herzen des Meeres aufsteigen sahst,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und dies ist die Deutung der Vision.«'
    reason: Alternative, fortsetzende Wiedergabe von lateinisch enim; dies ist keine abweichende Textüberlieferung.
lexical_decisions:
- source_word: enim
  choice: Denn
  rationale: Das postpositive »enim« leitet eine Erklärung ein; »denn« gibt diesen Zusammenhang im Deutschen natürlich und präzise wieder.
- source_word: interpretatio visionis
  choice: Deutung der Vision
  rationale: »Deutung« bezeichnet hier die Erklärung des Sinngehalts der Vision und klingt im modernen Deutsch natürlicher als »Interpretation«.
- source_word: virum
  choice: einen Mann
  rationale: Die unbestimmte Form des Lateinischen wird ohne zusätzliche christologische Festlegung wiedergegeben.
- source_word: ascendentem de corde maris
  choice: aus dem Herzen des Meeres aufsteigen
  rationale: Bewahrt sowohl die Bewegungsrichtung des Partizips »ascendentem« als auch das bildhafte »cor maris«.
theological_decisions:
- issue: Identität des Mannes
  choice: »einen Mann« ohne deutende Ergänzung
  alternative: eine ausdrücklich messianische Benennung
  rationale: Der Vers selbst nennt die Gestalt lediglich »virum«; ihre Identität soll nicht vorwegnehmend festgelegt werden.
- issue: Logische Funktion von »enim«
  choice: 'erklärend: »Denn«'
  alternative: 'fortsetzend: »Und«'
  rationale: »Enim« trägt gewöhnlich erklärende oder begründende Bedeutung und ist nicht die normale lateinische Entsprechung für ein schlichtes »und«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Wendung »Herz des Meeres« bleibt erhalten. Der mit »Weil« eröffnete Nebensatz und das abschließende Komma bewahren den über die Versgrenze hinausführenden Satzbau des Ausgangstextes.
