source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: de
  text: Und dies alles vermischte sich miteinander – die Feuerwoge, der Flammenhauch und der gewaltige Sturm – und fiel auf den Ansturm der Menge herab, die sich zum Kampf bereitgemacht hatte, und verbrannte sie alle, sodass von der unzählbaren Menge plötzlich nichts mehr zu sehen war als Aschenstaub und Rauchgeruch. Und ich sah es und war erstaunt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo tempestatis
  choice: die gewaltige Sturmmasse
  rationale: Bewahrt das ungewöhnliche Bild einer geballten, großen Sturmmenge, statt es zu einem bloßen „großen Sturm“ zu glätten.
- source_word: concidit super multitudinis impetum
  choice: stürzte auf den Ansturm der Menge nieder
  rationale: Gibt sowohl die heftige Abwärtsbewegung von „concidit“ als auch den angreifenden Vorstoß in „impetum“ wieder.
- source_word: puluis cineris
  choice: Aschenstaub
  rationale: Natürliches deutsches Kompositum, das beide Bestandteile des lateinischen Ausdrucks knapp erhält.
- source_word: et uidi et extiti
  choice: Als ich das sah, war ich außer mir
  rationale: „extiti“ bezeichnet hier am ehesten eine überwältigte, aus der Fassung geratene Reaktion; die Formulierung wahrt die Intensität, ohne eine konkrete Emotion hinzuzufügen.
theological_decisions:
- issue: Art und Wirkung des gerichtartigen Geschehens
  choice: Die Bilder von Feuer, Flamme und Sturm bleiben als visionäre Kräfte nebeneinander stehen.
  alternative: Die Bilder als eine einzige konkrete Naturerscheinung oder als ausdrücklich übernatürliche Waffe erklären.
  rationale: Der Text schildert die Vision bildhaft, deutet aber an dieser Stelle weder ihren genauen physikalischen Charakter noch ihre theologische Zuordnung aus.
translation_notes:
  register: Modernes, würdevolles Erzählregister. Die auffällige Bildsprache des lateinischen Textes wird beibehalten; Satzbau und Bezüge sind für heutige Leser behutsam geklärt.
