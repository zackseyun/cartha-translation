source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: de
  text: 'Und weil er weder ein Schwert noch eine Kriegswaffe hielt, dennoch aber den Angriff der Menge zunichtemachte, die gekommen war, um ihn anzugreifen, das ist die Deutung:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: ein Schwert
  rationale: Das lateinische „framea“ kann je nach Kontext eine Hieb- oder Stichwaffe bezeichnen; hier folgt die Wiedergabe „Schwert“ der im überlieferten Kontext und in der geprüften Konsultationsschicht bevorzugten Bedeutung.
- source_word: vas bellicosum
  choice: eine Kriegswaffe
  rationale: Wörtlich bezeichnet „vas“ ein Gerät oder Werkzeug; zusammen mit „bellicosum“ ist die natürliche deutsche Entsprechung „Kriegswaffe“.
- source_word: corrumpit … impetum
  choice: machte … den Angriff zunichte
  rationale: „Corrumpere“ bedeutet hier nicht bloß beschädigen, sondern den Ansturm unwirksam machen bzw. vernichten; „zunichtemachen“ bewahrt diese Stärke in natürlichem Deutsch.
- source_word: ad expugnare eum
  choice: um ihn zu bekämpfen
  rationale: Das nichtklassische „ad“ mit Infinitiv drückt den Zweck aus. „Bekämpfen“ hält offen, ob das Ziel Niederwerfung, Eroberung oder Vernichtung ist.
- source_word: haec interpretatio
  choice: hat folgende Bedeutung
  rationale: Die elliptische lateinische Wendung leitet die Deutung des Visionszeichens ein; idiomatisches Deutsch verlangt eine ergänzte Verbform.
theological_decisions:
- issue: Art und Weise des Sieges ohne Waffen
  choice: Keine Ursache oder übernatürliche Wirkweise ergänzen
  alternative: Ausdrücklich sagen, er habe die Menge durch göttliche Macht oder durch sein Wort vernichtet
  rationale: Der Vers stellt lediglich den Kontrast zwischen Waffenlosigkeit und der Vereitelung des Angriffs fest. Eine nähere theologische Erklärung folgt erst in der Auslegung und darf hier nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Übergang zur nachfolgenden Auslegung erhalten; „in der Hand hielt“ gibt „tenebat“ natürlich wieder, ohne eine zusätzliche Fußnote zu erfordern.
