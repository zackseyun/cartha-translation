source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad Fortissimum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: de
  text: Derjenige, der zu jener Zeit die Gefahr herbeiführt, wird selbst diejenigen bewahren, die in Gefahr geraten und Werke und Glauben an den Stärksten haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui adferet periculum
  choice: Derjenige, der … die Gefahr herbeiführt
  rationale: Gibt das futurische adferet und periculum direkt wieder, ohne die Aussage über den Urheber der Gefahr abzuschwächen.
- source_word: custodibit
  choice: wird … bewahren
  rationale: Bewahren entspricht dem Schutz- und Erhaltungsaspekt von custodire und passt zum erhöhten, aber verständlichen Register.
- source_word: operas et fidem
  choice: Werke und Glauben
  rationale: Bewahrt die beiden ausdrücklich genannten Größen und ihre theologische Spannung, ohne ihr Verhältnis näher zu bestimmen.
- source_word: ad Fortissimum
  choice: an den Stärksten
  rationale: ad mit fidem wird natürlich als »Glauben an« wiedergegeben; »den Stärksten« wahrt die substantivierte Superlativform des göttlichen Titels Fortissimum.
theological_decisions:
- issue: Verhältnis zwischen dem Urheber der Gefahr und dem Bewahrer
  choice: Dasselbe Subjekt führt die Gefahr herbei und bewahrt die Gefährdeten.
  alternative: Die Gefahr lediglich als zeitliches Ereignis darstellen, vor dem Gott schützt.
  rationale: Das wiederholte qui und ipse betonen, dass der Handelnde selbst sowohl die Gefahr herbeiführt als auch die Betroffenen bewahrt.
- issue: Werke und Glaube als Kennzeichen der Bewahrten
  choice: Beide Begriffe bleiben unverbunden nebeneinander stehen.
  alternative: Werke als Frucht des Glaubens oder Glauben als Grundlage der Werke erklären.
  rationale: Der lateinische Text nennt operas et fidem, erläutert aber weder Rangfolge noch genaues Verhältnis.
- issue: Göttlicher Titel Fortissimus
  choice: der Stärkste
  alternative: der Mächtige
  rationale: Die gewählte Form erhält die superlativische Kraft des lateinischen Titels; die Alternative würde sie abschwächen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Satzbau. Der Gedankenstrich verdeutlicht, dass »diejenigen« die zuvor genannten Menschen in Gefahr näher bestimmt. Der göttliche Titel wird als Superlativ und nicht bloß als positive Eigenschaft wiedergegeben.
