  text: 'quoniam dixisti de his qui derelicti sunt, et de his qui non derelicti sunt haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/022.yaml
  text: 'For you said about those who are left, and about those who are not left, this is the interpretation:'
translation:
  language: de
  text: 'Denn du hast von denen gesprochen, die übrig geblieben sind, und von denen, die nicht übrig geblieben sind. Dies ist die Deutung:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: Denn
  rationale: Gibt die begründende Verknüpfung zum vorausgehenden Zusammenhang unmittelbar wieder.
- source_word: dixisti de
  choice: du hast von … gesprochen
  rationale: Natürliches modernes Deutsch für die lateinische Wendung, ohne ihren Bezug auf die zuvor erwähnte Aussage abzuschwächen.
- source_word: derelicti sunt
  choice: übrig geblieben sind
  rationale: Bewahrt den sachlichen Sinn des Zurück- beziehungsweise Übrigbleibens, ohne vorschnell eine theologische Deutung wie »gerettet« einzutragen.
- source_word: interpretatio
  choice: Deutung
  rationale: Passt zum Kontext der Erklärung einer Vision und ist im Deutschen natürlicher als das enger sprachbezogene »Übersetzung«.
theological_decisions:
- issue: Bedeutung der Übriggebliebenen
  choice: die übrig geblieben sind
  alternative: die gerettet wurden / die zurückgelassen wurden
  rationale: Das Latein legt den endgültigen heilsgeschichtlichen Status der betreffenden Personen nicht ausdrücklich fest. Die neutrale Formulierung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der beiden gegensätzlichen Gruppen und der abschließende Doppelpunkt bleiben erhalten, da der folgende Text die angekündigte Deutung entfaltet.
