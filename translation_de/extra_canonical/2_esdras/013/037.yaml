source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: de
  text: Er aber, mein Sohn,[37] wird die Gottlosigkeiten der herangekommenen Völker tadeln – jene, die sich dem Sturm genähert haben – und wird ihnen ihre bösen Gedanken und Qualen vorhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '37'
    text: In der Deutung werden der »Berg Zion« und der »ohne Hände herausgehauene« Berg miteinander verbunden. Die Bildsprache erinnert bewusst an einen von Gott geschaffenen oder offenbarten heiligen Ort, nicht an einen gewöhnlichen, durch menschliche Arbeit geformten Berg.
    reason: cross_reference
  - marker: a
    text: 'Oder: »und ihnen ihre bösen Gedanken und Qualen vor Augen stellen«.'
    reason: previous_rendering
lexical_decisions:
- source_word: Ipse autem filius meus
  choice: Er selbst aber, mein Sohn
  rationale: Bewahrt die Hervorhebung durch »ipse«, den Gegensatz durch »autem« und die ausdrückliche Bezeichnung »mein Sohn«.
- source_word: arguet
  choice: wird … anklagen
  rationale: Gibt die richterlich-tadelnde Bedeutung von »arguere« wieder, ohne sie auf bloßes Belehren zu reduzieren.
- source_word: impietates
  choice: Gottlosigkeiten
  rationale: Entspricht dem religiös-moralischen Gehalt von »impietas« und bleibt im Plural des lateinischen Textes.
- source_word: quae aduenerunt gentes
  choice: der herangekommenen Völker
  rationale: Gibt das Partizipialgefüge idiomatisch wieder; die Völker sind bereits angekommen beziehungsweise herangezogen.
- source_word: tempestati adpropiauerunt
  choice: wie ein Sturm herangezogen sind
  rationale: Folgt der naheliegenden stürmischen Bildsprache der schwierigen lateinischen Formulierung und bewahrt die Bewegung des Herannahens.
- source_word: inproperabit coram eis
  choice: wird ihnen … vorhalten
  rationale: »Vorhalten« bewahrt die vorwurfsvolle Kraft von »inproperare« und nimmt zugleich »coram eis« idiomatisch auf.
- source_word: mala cogitamenta eorum et cruciamenta
  choice: ihre bösen Gedanken und Qualen
  rationale: Übersetzt beide Akkusativobjekte eng am Wortlaut; bei »Qualen« wird keine im Latein nicht ausdrücklich markierte Besitzzuordnung ergänzt.
theological_decisions:
- issue: Bezeichnung der endzeitlichen Gestalt als »mein Sohn«
  choice: mein Sohn
  alternative: mein Knecht
  rationale: Das lateinische »filius meus« ist eindeutig und soll nicht durch eine traditionsgebundene Deutung ersetzt werden.
- issue: Art des Gerichts über die Völker
  choice: anklagen … vorhalten
  alternative: verurteilen … bestrafen
  rationale: Der Vers beschreibt zunächst entlarvendes und vorwurfsvolles Reden; eine ausdrücklich vollstreckte Strafe sollte nicht in die Verben hineingelesen werden.
- issue: Bezug von »jene« im schwierigen lateinischen Satzbau
  choice: Bezug auf die herangekommenen Völker
  alternative: Bezug auf ihre Gottlosigkeiten
  rationale: Der Zusammenhang und die Sturmmetapher sprechen eher für die heranziehenden Völker; die grammatische Unebenheit des überlieferten Lateins lässt den Bezug jedoch nicht völlig zweifelsfrei erscheinen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde behutsam geglättet, ohne die richterliche Schärfe oder die Spannung der schwer verständlichen lateinischen Konstruktion aufzulösen. Sämtliche Fußnotenmarker stehen im Haupttext.
