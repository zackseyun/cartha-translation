id: 2ES.13.36
reference: 2 Esdras 13:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cacumen montis Sion. Sion autem ueniet et ostendetur omnibus parata et aedificata, sicut uidisti montem sculpi sine manibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: de
  text: Doch er wird auf dem Gipfel des Berges Zion stehen. Zion aber wird kommen und allen sichtbar werden, bereit und erbaut, so wie du gesehen hast, dass der Berg ohne Menschenhand herausgemeißelt wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen montis Sion
  choice: auf dem Gipfel des Berges Zion
  rationale: „cacumen“ bezeichnet den Gipfel oder höchsten Punkt; die Präposition und das Verb ergeben sich aus dem im Englischen bewahrten Satzanschluss, da der vorgelegte lateinische Ausschnitt mitten im Satz beginnt.
- source_word: ueniet
  choice: wird kommen
  rationale: Die auffällige Personifizierung Zions wird entsprechend dem lateinischen Wortlaut beibehalten und nicht erklärend aufgelöst.
- source_word: ostendetur omnibus
  choice: wird allen sichtbar werden
  rationale: Gibt das passive „wird allen gezeigt werden“ in natürlichem Deutsch wieder, ohne den ungenannten Handelnden festzulegen.
- source_word: parata et aedificata
  choice: bereit und erbaut
  rationale: Bewahrt beide Zustandsangaben knapp und würdevoll; „bereit“ entspricht „parata“, „erbaut“ dem architektonischen „aedificata“.
- source_word: sculpi sine manibus
  choice: ohne Menschenhand herausgemeißelt wurde
  rationale: „herausgemeißelt“ bildet das bildhafte „sculpi“ ab; „ohne Menschenhand“ ist die natürliche deutsche Wiedergabe der semitisch geprägten Wendung „sine manibus“.
theological_decisions:
- issue: Personifizierung und wunderbares Erscheinen Zions
  choice: Zion selbst „wird kommen“ und sichtbar werden
  alternative: Zion wird lediglich offenbart oder sein Bau wird vollendet
  rationale: Der lateinische Text spricht ausdrücklich von Zions Kommen. Diese theologisch aufgeladene Bildsprache wird nicht rationalisiert.
- issue: Ungenannter Urheber des Bauens und Sichtbarwerdens
  choice: Die Passivformen bleiben ohne ausdrückliche Nennung Gottes stehen
  alternative: Gott wird Zion zeigen und erbauen
  rationale: Der Urheber mag im Kontext göttlich verstanden werden, wird in diesem Vers aber grammatisch nicht genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die ungewöhnliche Bewegung Zions und das Bild des ohne Menschenhand herausgemeißelten Berges bleiben bewusst erhalten.
