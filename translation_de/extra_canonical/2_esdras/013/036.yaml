  source_fidelity: 'Der Entwurf gibt die lateinischen Kernelemente präzise wieder: das Stehen auf dem Gipfel des Berges Zion, das personifiziert ausgedrückte Kommen Zions, sein Sichtbarwerden für alle sowie die Zustände „bereit und erbaut“. Auch „ohne Menschenhand herausgemeißelt“ bildet „sculpi sine manibus“ sachgerecht und bildkräftig ab. Die passive bzw. ungenannte Handlungsmacht bei „ostendetur“ wird nicht unzulässig ergänzt.'
