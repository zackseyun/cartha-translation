  source_fidelity: 'Die Übersetzung folgt dem lateinischen Satzbau und Sinn zuverlässig: „impetum multitudinis venientis“ ist treffend als „den Ansturm der herannahenden Menge“ wiedergegeben; „non levavit manum suam“ bleibt ohne interpretierende Ergänzung bei „hob er seine Hand nicht“. Die koordinierte Verneinung zu „frameam tenebat, neque …“ wird sachgerecht durch „weder … noch irgendeine Kriegswaffe“ ausgedrückt. Das abschließende Semikolon wahrt den im zugrunde gelegten Text und im englischen Audit vorhandenen offenen Fortgang.'
  naturalness: Modernes, würdiges Standarddeutsch. „Und siehe“ ist als bewusst erzählerisch-biblischer Auftakt idiomatisch vertretbar. „Ansturm“, „herannahend“ und die Negativkonstruktion sind klar und flüssig.
  terminology: „Speer“ ist für „framea“ im Kontext eine gut vertretbare Hauptwiedergabe und stimmt mit dem englischen Audit überein. Die Fußnote weist angemessen und nicht überdehnend auf die lexikalische Unsicherheit hin. „Kriegswaffe“ gibt „weapon of war“ bzw. die erwartete Fortsetzung der lateinischen Negativreihe sachlich wieder.
