source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pugnare. Et ecce ut uidit impetum multitudinis uenientis, non leuauit manum suam, neque frameam tenebat, neque
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: de
  text: Und siehe, als er den Ansturm der herannahenden Menge sah, hob er seine Hand nicht; auch hielt er weder einen Speer[a] noch irgendeine Kriegswaffe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das lateinische Wort kann einen Speer, aber auch eine andere Hieb- oder Stichwaffe bezeichnen.
    reason: Die genaue Waffenart von „framea“ ist lexikalisch nicht eindeutig.
lexical_decisions:
- source_word: impetum
  choice: Ansturm
  rationale: Gibt den gewaltsamen Angriff oder das Vordringen der Menge natürlich und prägnant wieder.
- source_word: multitudinis uenientis
  choice: der herannahenden Menge
  rationale: Bewahrt die attributive Verbindung des Lateinischen und bezeichnet die Menge als auf ihn zukommend.
- source_word: non leuauit manum suam
  choice: hob er seine Hand nicht
  rationale: Formnahe und im Deutschen verständliche Wiedergabe, ohne eine nicht ausdrücklich genannte Angriffsbewegung zu ergänzen.
- source_word: frameam
  choice: Speer
  rationale: Folgt der im konsultierten englischen Text gewählten, im Kontext plausiblen Bedeutung; das lateinische Wort kann jedoch auch eine andere Hieb- oder Stichwaffe bezeichnen.
- source_word: neque … neque
  choice: weder … noch
  rationale: Bildet die koordinierte Verneinung idiomatisch im Deutschen ab.
theological_decisions:
- issue: Art der Waffenlosigkeit der Gestalt
  choice: Die konkrete Aussage bleibt darauf beschränkt, dass er weder die Hand hebt noch eine Waffe hält.
  alternative: Die Wendung als ausdrücklichen Verzicht auf Gewalt oder als übernatürliche Kampfweise auslegen.
  rationale: Der Vers schildert zunächst nur das sichtbare Verhalten; seine theologische Bedeutung soll nicht vorweggenommen oder konfessionell festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ erhält den markanten erzählerischen Auftakt; „herannahend“ und „Ansturm“ wahren die Dringlichkeit des Bildes. Das Semikolon gliedert die eng verbundenen Negativa klar.
