source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: reuelabitur filius meus quem uidisti uirum ascendentem. Et erit, quando audierint omnes gentes uocem eius, et derelinquet unusquisque regionem suam et bellum quod habent in alterutro,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: de
  text: Und es wird geschehen, wenn alle Völker seine Stimme hören, wird jeder sein eigenes Land und den Krieg, den sie gegeneinander führen, verlassen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur
  choice: wird offenbart werden
  rationale: Bewahrt die passive Form und den Offenbarungscharakter des lateinischen Verbs.
- source_word: filius meus
  choice: mein Sohn
  rationale: Direkte und theologisch unaufgelöste Wiedergabe der lateinischen Wendung.
- source_word: uirum ascendentem
  choice: als einen Mann emporsteigen
  rationale: Gibt sowohl die menschliche Erscheinungsform als auch die aufwärts gerichtete Bewegung von ascendentem wieder.
- source_word: omnes gentes
  choice: alle Völker
  rationale: Im biblischen Kontext ist „Völker“ die natürliche Entsprechung für gentes.
- source_word: derelinquet
  choice: wird … verlassen
  rationale: Das Verb regiert im Lateinischen sowohl „sein eigenes Land“ als auch „den Krieg“; diese syntaktische Verbindung bleibt erhalten.
- source_word: bellum quod habent in alterutro
  choice: den Krieg, den sie gegeneinander führen
  rationale: Natürliches modernes Deutsch für die wörtliche Vorstellung eines Krieges, den die Völker untereinander haben.
theological_decisions:
- issue: Identität und Erscheinungsweise des Sohnes
  choice: „mein Sohn … den du als einen Mann emporsteigen sahst“
  alternative: „mein Sohn, der Mann, den du emporsteigen sahst“
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen der Bezeichnung „mein Sohn“ und seiner Wahrnehmung als Mann, ohne beide ausdrücklich gleichzusetzen oder voneinander zu trennen.
- issue: Art des Verlassens des Krieges
  choice: „den Krieg … verlassen“
  alternative: „von ihrem Krieg … ablassen“
  rationale: Die ungewöhnliche, aber verständliche Formulierung wahrt die gemeinsame Abhängigkeit beider Objekte von derelinquet und deutet nicht näher aus, wie das Aufgeben des Krieges geschieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die lateinische Satzstruktur. Das abschließende Komma bleibt stehen, weil der Vers syntaktisch in den folgenden Vers übergeht.
