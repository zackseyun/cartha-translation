    issue: „Dann wird“ statt „Und es wird geschehen“
    rationale: Lateinisch „Et erit, quando“ enthält eine eigenständige Zukunftsankündigung. „Dann wird“ macht daraus eine bloße Folgeangabe und lässt die Formel „es wird geschehen“ aus.
  revised_text: Und es wird geschehen, wenn alle Völker seine Stimme hören, wird jeder sein eigenes Land und den Krieg, den sie gegeneinander führen, verlassen,
