source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ab initio demonstrasti servo tuo mirabilia haec et dignum me habuisti, ut susciperes deprecationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: de
  text: Von Anfang an hast du deinem Diener diese Wunder gezeigt und mich für würdig erachtet, dass du mein Flehen[a] annimmst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mein Bittgebet.'
    reason: Die lateinische deprecatio kann sowohl das inständige Flehen als auch das entsprechende Bittgebet bezeichnen.
lexical_decisions:
- source_word: ab initio
  choice: von Anfang an
  rationale: Entspricht der zeitlichen Wendung knapp und idiomatisch.
- source_word: servo tuo
  choice: deinem Diener
  rationale: Gibt den Dienst- und Abhängigkeitsbezug von servus in natürlichem modernem Deutsch wieder.
- source_word: mirabilia haec
  choice: diese Wunder
  rationale: Mirabilia bezeichnet hier außergewöhnliche, von Gott gezeigte Wunder; die demonstrative Bestimmung bleibt erhalten.
- source_word: dignum me habuisti
  choice: mich für würdig erachtet
  rationale: Bewahrt die wertende Aussage des Lateinischen in würdigem, gegenwärtigem Deutsch.
- source_word: deprecationem meam
  choice: mein Flehen
  rationale: Gibt die inständige Bitte prägnant wieder und bewahrt den Gebetscharakter; „Bittgebet“ ist ebenfalls möglich.
- source_word: susciperes
  choice: annimmst
  rationale: Das Verb bezeichnet hier das wohlwollende Entgegennehmen beziehungsweise Erhören des Flehens. Der deutsche dass-Satz erhält eindeutig Gott als handelndes Subjekt.
theological_decisions:
- issue: Wer das Flehen annimmt
  choice: „dass du mein Flehen annimmst“
  alternative: „mein Flehen anzunehmen“
  rationale: Das lateinische susciperes steht in der zweiten Person Singular und bezeichnet Gott als denjenigen, der das Flehen annimmt. Ein deutscher Infinitivanschluss könnte missverständlich so gelesen werden, als solle der Sprecher selbst sein Flehen annehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, wird jedoch durch einen dass-Satz syntaktisch eindeutig und natürlich wiedergegeben.
