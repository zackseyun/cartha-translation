  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: de
  text: 'Und er antwortete mir: »Ich werde dir die Deutung der Vision sagen, aber dir auch erklären, worüber du gesprochen hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  choice: die Deutung der Vision
  rationale: Gibt die lateinische Genitivverbindung präzise und in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: dicam tibi
  choice: Ich werde dir … sagen
  rationale: Bewahrt die Zukunftsform und die direkte Anrede des lateinischen Textes.
- source_word: adaperiam tibi
  choice: dir … erklären
  rationale: Das bildhafte Grundmotiv des Öffnens bezeichnet hier das Erschließen bzw. Klarlegen eines Sachverhalts; »erklären« ist im Deutschen idiomatisch.
- source_word: de quibus locutus es
  choice: worüber du gesprochen hast
  rationale: Entspricht dem lateinischen Bezug mit de und klingt natürlicher als eine Konstruktion mit »von denen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das redundante lateinische »antwortete … und sagte« wird natürlich zu »antwortete« verdichtet; der gesamte Inhalt der Antwort bleibt erhalten.
