source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quoniam gubernat tempora et quae sunt in temporibus inlata. et sedi ibi tribus diebus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: de
  text: und weil er die Zeiten lenkt und was in den Zeiten geschieht.[a] Und ich saß dort drei Tage lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Wiedergabe bezog hier auch den vorausgehenden Satz ein: „Und ich ging fort und hinaus aufs Feld und verherrlichte und pries den Höchsten sehr wegen der Wunder, die er zu ihren Zeiten tat, und weil er die Zeiten lenkt und was in den Zeiten geschieht. Und ich saß dort drei Tage lang.“ Dieser vorausgehende Satz gehört jedoch zu Vers 57.'
    reason: Dokumentiert die frühere Wiedergabe und erläutert die anhand der lateinischen Quelle korrigierte Versabgrenzung.
lexical_decisions:
- source_word: gubernat
  choice: lenkt
  rationale: Gibt das aktive Leiten und Ordnen der Zeiten natürlich und würdevoll wieder; „regiert“ wäre möglich, klingt hier im Deutschen jedoch weniger idiomatisch.
- source_word: tempora
  choice: die Zeiten
  rationale: Bewahrt den wiederholten und theologisch gewichtigen Zeitbegriff des lateinischen Textes.
- source_word: quae sunt in temporibus inlata
  choice: das, was in den Zeiten herbeigeführt wird
  rationale: Bildet die passive Bedeutung von „inlata“ ab, ohne den nicht genannten Urheber ausdrücklich einzusetzen.
- source_word: sedi ibi tribus diebus
  choice: ich saß dort drei Tage lang
  rationale: Nahe Wiedergabe des lateinischen Wortlauts in natürlichem modernem Deutsch.
theological_decisions:
- issue: Urheber dessen, was in den Zeiten herbeigeführt wird
  choice: Passivform ohne ausdrücklich genannten Urheber
  alternative: „was er in den Zeiten herbeiführt“
  rationale: Der lateinische Text nennt im Passiv keinen Urheber; die Übersetzung vermeidet es, den Bezug auf Gott ausdrücklich festzulegen.
- issue: Versabgrenzung
  choice: Nur der für Vers 58 überlieferte Text steht im Haupttext
  alternative: Den vorausgehenden Satz aus Vers 57 einbeziehen
  rationale: Die angegebene lateinische Quelle für 13,58 beginnt mit „et quoniam“; der frühere längere Wortlaut vermischte die Versgrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den lateinischen Wortlaut. Die auffällige Wiederholung von „Zeiten“ bleibt als Merkmal des Ausgangstextes erhalten.
