  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: de
  text: Deshalb wehe ihnen, denn sie haben große Gefahren und viele Bedrängnisse erlebt, wie diese Träume zeigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc vae
  choice: 'Darum: Wehe ihnen!'
  rationale: „Darum“ gibt den Folgerungszusammenhang von „propter hoc“ wieder. Das im Deutschen idiomatisch ergänzte „ihnen“ bezeichnet die aus dem Zusammenhang bekannte betroffene Gruppe, ohne sie im Vers eigens neu zu benennen.
- source_word: viderunt
  choice: sie haben … erlebt
  rationale: Das lateinische Perfekt wird als Perfekt wiedergegeben. Bei Gefahren und Bedrängnissen ist „erleben“ im Deutschen natürlicher als das wörtliche „sehen“.
- source_word: pericula magna
  choice: große Gefahren
  rationale: Direkte und natürliche Entsprechung des lateinischen Ausdrucks.
- source_word: necessitates multas
  choice: viele Bedrängnisse
  rationale: „Bedrängnisse“ erfasst hier die durch Not und Zwang geprägten schwierigen Lagen besser als das moderne deutsche „Notwendigkeiten“.
- source_word: sicut ostendunt somnia haec
  choice: wie diese Träume zeigen
  rationale: Formnahe Wiedergabe, die „somnia“ als Träume beziehungsweise Traumgesichte bezeichnet, ohne den Ausdruck auszudeuten.
theological_decisions:
- issue: Zeitbezug von „viderunt“
  choice: 'Perfekt: „haben … erlebt“'
  alternative: 'Futurisch: „werden … erleben“'
  rationale: Obwohl der apokalyptische Zusammenhang eine künftige Erfüllung nahelegen kann, steht im vorgelegten lateinischen Text eindeutig das Perfekt. Die Übersetzung bewahrt diese grammatische Spannung, statt sie stillschweigend aufzulösen.
- issue: Bezug des Weherufs
  choice: Das im Deutschen erforderliche „ihnen“ wird kontextuell ergänzt.
  alternative: 'Unpersönlich: „Darum: Wehe!“ oder ausdrückliche Wiederaufnahme „Wehe denen, die übrig bleiben!“'
  rationale: Der lateinische Vers nennt die Betroffenen nicht ausdrücklich. „Ihnen“ sorgt für verständliches Deutsch, ohne die kontextuell gemeinte Gruppe im Haupttext genauer festzulegen, als es die vorgelegte Quelle tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Weheruf bleibt erhalten; die Wortstellung ist für heutige Leser geglättet. Die im englischen Beratungstext ausdrücklich genannten „Übriggebliebenen“ werden nicht in den Vers eingefügt, da sie im vorgelegten lateinischen Wortlaut nicht genannt sind.
