  text: Also show me the interpretation of this dream[a]. For as I think
translation:
  language: de
  text: Zeige mir auch die Deutung dieses Traums.[a] Denn wie ich meine
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zeige mir auch noch die Deutung dieses Traums.«'
    reason: Das lateinische adhuc et kann neben dem schlichten additiven »auch« ausdrücklich im Sinn von »auch noch« verstanden werden.
lexical_decisions:
- source_word: adhuc et
  choice: auch
  rationale: Die Verbindung fügt die erbetene Traumdeutung dem vorausgehenden Anliegen hinzu. Das natürliche deutsche »auch« gibt diese additive Funktion wieder; alternativ kann »auch noch« gesagt werden.
- source_word: interpretationem somnii huius
  choice: die Deutung dieses Traums
  rationale: »Deutung« ist im Deutschen die übliche und genaue Wiedergabe von interpretatio im Zusammenhang mit einem Traum; huius bezeichnet den konkret vorliegenden Traum.
- source_word: Sicut enim existimo
  choice: Denn wie ich meine
  rationale: Die unvollständige, in den folgenden Vers übergreifende Begründung wird entsprechend der lateinischen Versgrenze bewahrt, ohne sie vorzeitig zu ergänzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das aus dem vorhergehenden Zusammenhang ergänzte Verb »Zeige« folgt der fortwirkenden Konstruktion. Der am Versende offene Satzteil »Denn wie ich meine« bleibt bewusst unabgeschlossen.
