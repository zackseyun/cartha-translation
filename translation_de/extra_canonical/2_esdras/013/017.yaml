lexical_decisions:
- source_word: derelicti
  choice: zurückgelassen worden
  rationale: Gibt das lateinische Passiv und die Grundbedeutung von „derelinquere“ unmittelbar wieder, ohne die im Kontext mögliche Bedeutung vorschnell näher zu bestimmen.
- source_word: tristes erunt
  choice: werden traurig sein
  rationale: Bewahrt die futurische Aussage und gibt „tristes“ in natürlichem, schlichtem Deutsch wieder.
theological_decisions:
- issue: Bedeutung des Nicht-Zurückgelassenseins
  choice: nicht zurückgelassen worden sind
  alternative: übrig geblieben sind / nicht verlassen worden sind
  rationale: Die wörtliche Formulierung erhält die Mehrdeutigkeit zwischen räumlichem Zurücklassen, Verlassenwerden und möglichem Übrigbleiben, statt sie theologisch oder erzählerisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; die Wiederholung „die, die“ ist idiomatisch und hält den Satz eng am lateinischen Relativgefüge.
