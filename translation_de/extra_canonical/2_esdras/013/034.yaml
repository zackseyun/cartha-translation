translation:
  language: de
  text: und eine unzählbare Menge wird zu einem Ganzen versammelt werden, wie du gesehen hast,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: colligetur
  choice: wird versammelt werden
  rationale: Gibt das lateinische Futur Passiv formal und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: in unum
  choice: zu einer Einheit
  rationale: Bewahrt gegenüber dem bloßen „zusammen“ ausdrücklich die Zielrichtung auf Einheit hin, ohne die Art dieser Einheit näher festzulegen.
- source_word: multitudo innumerabilis
  choice: eine unzählbare Menge
  rationale: Entspricht der lateinischen Wortverbindung eng und ist im modernen Standarddeutsch gut verständlich.
- source_word: sicut uidisti
  choice: wie du gesehen hast
  rationale: Direkte, idiomatische Wiedergabe des Rückverweises auf die Vision.
theological_decisions:
- issue: Bedeutung von „in unum“
  choice: zu einer Einheit
  alternative: an einem Ort / zusammen
  rationale: Der lateinische Ausdruck kann räumliches Zusammenkommen oder das Entstehen einer Einheit bezeichnen. Die gewählte Formulierung erhält diese Spannung besser als eine rein räumliche Festlegung.
translation_notes:
  register: Modernes, verständliches und würdevolles Standarddeutsch; der Satz bleibt als fortlaufender Teilsatz kleingeschrieben und endet entsprechend der Vorlage mit einem Komma.
