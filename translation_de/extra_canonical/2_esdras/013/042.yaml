  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruantes
  choice: gehalten hatten
  rationale: Das Partizip bezeichnet hier das Befolgen bzw. Einhalten dessen, worauf der vorangehende Kontext verweist; die deutsche Wiedergabe lässt dieses im Fragment nicht ausdrücklich genannte Objekt ebenso unausgesprochen.
- source_word: regione sua
  choice: in ihrem eigenen Land
  rationale: „regio“ bezeichnet hier das Gebiet bzw. Land, aus dem die betreffende Gruppe stammt; „eigenen“ gibt das possessive „sua“ natürlich wieder.
- source_word: Per introitus
  choice: durch die Zugänge
  rationale: Die wörtliche räumliche Bedeutung von „introitus“ wird gewahrt. Da der Satz im folgenden Vers weiterläuft und der genaue Bezug hier offenbleibt, wird nicht präzisierend „Eingänge“, „Pässe“ oder „Zugangswege“ eingesetzt.
- source_word: autem
  choice: Doch
  rationale: Markiert den Übergang bzw. leichten Gegensatz zum vorausgehenden Satz, ohne die Verbindung stärker zu bestimmen.
theological_decisions: []
