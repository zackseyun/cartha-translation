  yaml_path: translation/extra_canonical/2_esdras/013/055.yaml
  text: For you have ordered your life in wisdom, and have called understanding your mother.
translation:
  language: de
  text: Denn du hast dein Leben in Weisheit geordnet und die Einsicht deine Mutter genannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vitam enim tuam disposuisti
  choice: Denn du hast dein Leben … geordnet
  rationale: Gibt die begründende Partikel „enim“ sowie das bewusste Ordnen und Ausrichten des eigenen Lebens direkt und natürlich wieder.
- source_word: in sapientiam
  choice: in Weisheit
  rationale: Bewahrt die lateinische Formulierung und bezeichnet Weisheit als den Bereich beziehungsweise die bestimmende Haltung, in der das Leben geordnet wurde.
- source_word: sensum
  choice: die Einsicht
  rationale: Im Zusammenhang mit „sapientia“ bezeichnet „sensus“ hier am ehesten geistige Einsicht oder verständiges Urteilsvermögen, nicht bloß einen Sinneseindruck.
- source_word: vocasti matrem
  choice: deine Mutter genannt
  rationale: Bewahrt die personifizierende Metapher und gibt die prädikative Konstruktion idiomatisch wieder.
theological_decisions:
- issue: Personifizierung der Einsicht als Mutter
  choice: Die Metapher bleibt unverändert stehen.
  alternative: Die Aussage erklärend als enge Bindung an Einsicht umschreiben.
  rationale: Der lateinische Text personifiziert „sensus“ ausdrücklich; eine Auflösung würde Bildkraft und mögliche theologische Spannung vermindern.
translation_notes:
  register: Knappe, würdige und moderne Standardsprache. Die parallele Struktur des lateinischen Satzes bleibt erhalten; keine Fußnote ist erforderlich.
