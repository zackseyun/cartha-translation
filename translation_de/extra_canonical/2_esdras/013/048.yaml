  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: de
  text: Doch die aus deinem Volk übrig geblieben sind, die in meinem heiligen Gebiet gefunden werden, werden gerettet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im überlieferten lateinischen Text fehlt hier offenbar ein Prädikat. Die syrische Version hat „werden leben“, die äthiopische und die arabische „werden gerettet werden“.
    reason: textual
lexical_decisions:
- source_word: derelicti sunt de populo tuo
  choice: die von deinem Volk Übriggebliebenen
  rationale: Gibt die passive Bedeutung von „derelicti sunt“ wieder und bezeichnet diejenigen aus dem Volk, die übrig geblieben sind.
- source_word: intra terminum meum Sanctum
  choice: innerhalb meines heiligen Gebietes
  rationale: „Terminus“ kann Grenze oder abgegrenztes Gebiet bezeichnen; mit „innerhalb“ ist hier das von der heiligen Grenze umschlossene Gebiet gemeint.
- source_word: '[in der lateinischen Überlieferung ausgefallenes Prädikat]'
  choice: werden gerettet werden
  rationale: Das gereinigte Latein ist an dieser Stelle offenbar lückenhaft. Tochterübersetzungen bewahren ein Prädikat mit dem Sinn „leben“ beziehungsweise „gerettet werden“; die Formulierung folgt der durch Äthiopisch und Arabisch bezeugten Wiedergabe und dem englischen POB.
theological_decisions:
- issue: Ergänzung eines im lateinischen Text fehlenden Hauptprädikats
  choice: „werden gerettet werden“ im Haupttext, mit textkritischer Fußnote
  alternative: Den Satz mit „sind übrig geblieben“ abschließen oder das ergänzte Prädikat als „werden leben“ wiedergeben
  rationale: Der lateinische Überlieferungstext ist syntaktisch beziehungsweise inhaltlich verkürzt; die alten Tochterversionen bezeugen, dass ein Prädikat ausgefallen ist. Die Ergänzung stellt den wahrscheinlich ursprünglichen Sinn her, während die Fußnote die Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Übriggebliebenen“ wahrt den biblisch-apokalyptischen Ton, ohne konfessionelle Deutung; „heiliges Gebiet“ ist im Deutschen natürlicher als das missverständliche „heilige Grenze“.
