revisions:
- from: Und über die Bewohner der Erde wird Verwirrung des Geistes kommen. Einer wird gegen den anderen Krieg zu führen beabsichtigen, Stadt gegen Stadt und Ort gegen Ort.
  to: Und Verwirrung des Verstandes wird über die Bewohner der Erde kommen. Die einen werden planen, gegen die anderen Krieg zu führen, Stadt gegen Stadt und Ort gegen Ort.
  rationale: Die Revision korrigiert die pluralisch-reziproke Aussage des zweiten Satzes und präzisiert die mentale Bedeutung von *mens*, ohne den Grad oder die genaue Art der Verwirrung über die Vorlage hinaus festzulegen. Der abschließende Parallelismus bleibt eng am lateinischen Text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:31Z'
review_pass:
  verdict: revise
  source_fidelity: Die erste Satzhälfte gibt *ueniet ... super eos* und *excessus mentis* im Wesentlichen zutreffend wieder. In der zweiten Satzhälfte schwächt die Singularform „Einer wird gegen den anderen“ jedoch das plurale und wechselseitige *in alios alii* ab. Die Revision erhält ausdrücklich die Gruppen-Gegenüberstellung.
  naturalness: „Verwirrung wird über die Bewohner der Erde kommen“ ist natürliches, würdiges modernes Bibeldeutsch. „Die einen werden planen, gegen die anderen Krieg zu führen“ ist klarer und idiomatischer als die singuläre Umschreibung.
  terminology: Für *mens* ist „Verstand“ präziser als „Geist“, da „Geist“ im Deutschen zusätzlich spirituelle Konnotationen haben kann. „Verwirrung des Verstandes“ wahrt die bewusst nicht weiter spezifizierte Bedeutung von *excessus mentis*.
  issues:
  - severity: medium
    issue: Singularische Wiedergabe von „in alios alii“
    rationale: '„Einer ... gegen den anderen“ individualisiert die Formulierung. Das lateinische *alii ... in alios* bezeichnet dagegen gegeneinander gerichtete Gruppen: „die einen gegen die anderen“.'
  - severity: low
    issue: „Geist“ für *mentis*
    rationale: Die Übersetzung ist möglich, aber „Geist“ kann im Deutschen religiös-geistlich gelesen werden. „Verstand“ trifft die mentale Bedeutung von *mens* unmittelbarer.
  revised_text: Und Verwirrung des Verstandes wird über die Bewohner der Erde kommen. Die einen werden planen, gegen die anderen Krieg zu führen, Stadt gegen Stadt und Ort gegen Ort.
