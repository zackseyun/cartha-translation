source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ueniet excessus mentis super eos qui inhabitant terram. Et in alios alii cogitabunt bellare, ciuitates ciuitatem et locus locum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/031.yaml
  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: de
  text: Und Verwirrung des Verstandes wird über die Bewohner der Erde kommen. Die einen werden planen, gegen die anderen Krieg zu führen, Stadt gegen Stadt und Ort gegen Ort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: Verwirrung des Geistes
  rationale: Die Wendung bezeichnet einen Zustand, in dem der Verstand aus seiner gewöhnlichen Ordnung gerät. »Verwirrung des Geistes« bewahrt die mentale Dimension, ohne vorschnell auf Wahnsinn, Entsetzen oder Ekstase festzulegen.
- source_word: ueniet ... super eos
  choice: wird über ... kommen
  rationale: Gibt die lateinische Bewegungs- und Gerichtssprache eng wieder und klingt im biblischen Deutsch natürlich.
- source_word: in alios alii
  choice: einer ... gegen den anderen
  rationale: Drückt die wechselseitige Feindschaft idiomatisch aus.
- source_word: cogitabunt bellare
  choice: Krieg zu führen beabsichtigen
  rationale: Bewahrt sowohl den Gedanken des Planens oder Beabsichtigens als auch den Infinitiv »kämpfen/Krieg führen«.
- source_word: ciuitates ciuitatem et locus locum
  choice: Stadt gegen Stadt und Ort gegen Ort
  rationale: Folgt dem erkennbaren Parallelismus; die schwankende Kasus- beziehungsweise Numerusform des überlieferten Lateins wird nicht künstlich im Deutschen nachgebildet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblischem Rhythmus. Die Satzstruktur bleibt nahe am Latein, wird aber für heutige Leser idiomatisch geglättet.
