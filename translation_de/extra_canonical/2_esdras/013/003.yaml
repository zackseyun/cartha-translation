source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: de
  text: 'Und ich sah: Siehe, der Mensch selbst flog mit den Wolken des Himmels. Wohin er sein Gesicht auch wandte, um hinzusehen, zitterte alles, was unter ihm sichtbar war.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was von ihm gesehen wurde“. Der überlieferte lateinische Wortlaut bedeutet wörtlich „was unter ihm sichtbar war“; möglicherweise gibt er jedoch eine zugrunde liegende Formulierung wieder, die auch im Sinn von „von ihm gesehen“ verstanden werden konnte.'
    reason: Bewahrt die Spannung zwischen dem unmittelbaren lateinischen Wortlaut und der aufgrund der möglichen griechischen Vorlage sowie anderer alter Versionen vertretenen agentiven Deutung.
lexical_decisions:
- source_word: convolabat
  choice: flog
  rationale: Gibt die fortdauernde Bewegung des lateinischen Imperfekts natürlich wieder, ohne eine im Ausgangstext nicht ausdrücklich genannte Richtung hinzuzufügen.
- source_word: ipse homo
  choice: der Mensch selbst
  rationale: Bewahrt die Hervorhebung durch ipse und bezeichnet die Gestalt schlicht als Mensch, ohne den Ausdruck christologisch auszudeuten.
- source_word: cum nubibus caeli
  choice: mit den Wolken des Himmels
  rationale: Entspricht der lateinischen Präposition cum und erhält die biblisch-visionäre Bildsprache.
- source_word: vultum suum convertebat ut consideraret
  choice: sein Gesicht wandte, um hinzusehen
  rationale: Gibt sowohl die körperliche Wendung als auch die Absicht des Betrachtens in natürlichem modernem Deutsch wieder.
- source_word: tremebant omnia
  choice: zitterte alles
  rationale: Das deutsche Singularverb stimmt idiomatisch mit dem Kollektivpronomen alles überein und bewahrt die Aussage des lateinischen tremebant.
- source_word: quae sub eo videbantur
  choice: was unter ihm sichtbar war
  rationale: Folgt dem überlieferten lateinischen Wortlaut sub eo und gibt videbantur idiomatisch wieder; die mögliche Deutung als Agens wird in der Fußnote offengehalten.
theological_decisions:
- issue: Identität der visionären Gestalt
  choice: „der Mensch selbst“ ohne Großschreibung oder ergänzenden Titel
  alternative: „jener Mensch“, „der Menschensohn“ oder „der Mensch“ mit christologischer Großschreibung
  rationale: Der lateinische Text sagt ipse homo und verwendet hier nicht ausdrücklich den Titel „Menschensohn“. Die Übersetzung soll eine mögliche theologische Identifikation weder ausschließen noch vorwegnehmen.
- issue: Bezug von sub eo bei videbantur
  choice: 'räumlich: „unter ihm sichtbar war“'
  alternative: 'agentiv: „von ihm gesehen wurde“'
  rationale: Die räumliche Wiedergabe entspricht unmittelbar dem erhaltenen lateinischen Text. Da eine agentive Deutung aufgrund einer möglichen zugrunde liegenden griechischen Konstruktion und anderer Überlieferungszeugen vertreten wird, wird sie in einer Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper visionärer Satzführung. „Siehe“ bleibt als traditionelles und weiterhin verständliches Aufmerksamkeitssignal erhalten. Die Wiederholung „Und … und siehe“ wurde leicht geglättet, ohne den erzählerischen Ablauf zu verändern.
