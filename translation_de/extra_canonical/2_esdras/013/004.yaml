source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: de
  text: Und überall, wo eine Stimme aus seinem Mund hervorging, begannen alle, die seine Stimme[a] hörten, zu brennen, wie Wachs schmilzt, wenn es Feuer spürt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Stimmen“; möglicherweise „seine Laute“ oder „seine Äußerungen“.'
    reason: Das Lateinische wechselt von vox („eine Stimme“) zu voces („Stimmen“). Der deutsche Haupttext verwendet die idiomatische singularische Fassung, während die Fußnote den Numeruswechsel und die mögliche Bedeutung von voces offenlegt.
lexical_decisions:
- source_word: ubicumque exiebat vox de ore eius
  choice: wo immer eine Stimme aus seinem Mund hervordrang
  rationale: „Wo immer“ gibt ubicumque räumlich wieder; „hervordrang“ ist im Deutschen eine natürliche Entsprechung für das Herausgehen der Stimme aus dem Mund. Der unbestimmte Artikel wahrt, dass das artikellose lateinische vox auch als einzelner Laut bzw. eine Äußerung verstanden werden kann.
- source_word: ardescebant
  choice: begannen … zu brennen
  rationale: Das Imperfekt des inchoativen ardescere bezeichnet aktiv den Beginn des Brennens; die Wiedergabe vermeidet daher eine unbegründete Passivform wie „wurden in Brand gesetzt“.
- source_word: sicut liquescit cera quando senserit ignem
  choice: so wie Wachs schmilzt, wenn es Feuer spürt
  rationale: Die bildhafte Personifizierung des Wachses in senserit („spürt/wahrnimmt“) bleibt erhalten; der artikellose Ausdruck ignem wird im Deutschen natürlich mit „Feuer“ wiedergegeben.
theological_decisions:
- issue: Art und Ursache des Brennens
  choice: begannen … zu brennen
  alternative: wurden in Brand gesetzt / verbrannten
  rationale: Der lateinische Text beschreibt den einsetzenden Vorgang, legt aber weder ausdrücklich einen äußeren Verursacher noch das vollständige Ergebnis des Verbrennens fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des Originals wird bewahrt, ohne die Stimme ausdrücklich mit Feuer gleichzusetzen oder eine passive Verursachung einzutragen.
