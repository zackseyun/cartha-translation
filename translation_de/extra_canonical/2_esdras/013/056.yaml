source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: de
  text: Darum habe ich dir dies gezeigt; denn beim Höchsten gibt es Lohn. Nach weiteren drei Tagen werde ich weiter mit dir reden und dir gewichtige und wunderbare Dinge erklären.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: darum
  rationale: Gibt die folgernde Begründung knapp und natürlich wieder.
- source_word: merces apud Altissimum
  choice: beim Höchsten gibt es Lohn
  rationale: Bewahrt sowohl den Lohnbegriff als auch die Aussage, dass dieser beim Höchsten zu finden ist, ohne die Art oder den Empfänger des Lohns näher festzulegen.
- source_word: post alios tres dies
  choice: nach weiteren drei Tagen
  rationale: Gibt alios im zeitlichen Zusammenhang idiomatisch als »weitere« wieder.
- source_word: gravia
  choice: gewichtige
  rationale: Bewahrt die übertragene Bedeutung von gravia als ernst, bedeutend oder schwerwiegend.
- source_word: mirabilia
  choice: wunderbare Dinge
  rationale: Gibt den substantivierten Plural als außergewöhnliche, Staunen erregende Dinge wieder.
theological_decisions:
- issue: Bezug und Art des Lohns
  choice: »beim Höchsten gibt es Lohn« ohne nähere Bestimmung
  alternative: »dein Lohn ist beim Höchsten«
  rationale: Der lateinische Text nennt weder ausdrücklich einen Besitzer noch einen Empfänger des Lohns; die offenere Formulierung vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die etwas sperrige lateinische Satzfolge wurde behutsam geglättet; »wieder zu dir sprechen« gibt alia loquar im Kontext als weiteres Reden wieder.
