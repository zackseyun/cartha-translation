  footnotes:
  - marker: a
    text: Der lateinische Text dieses Verses endet nach „aus“; der Satz wird im folgenden Vers fortgesetzt.
    reason: Die Vorlage bricht mit der Präposition „de“ ab, die eine Ergänzung im nächsten Vers verlangt.
lexical_decisions:
- source_word: colligentem ad se
  choice: bei sich versammelt
  rationale: Gibt das Sammeln zu sich hin natürlich und zugleich quellennah wieder.
- source_word: aliam multitudinem pacificam
  choice: eine andere, friedliche Menge
  rationale: Bewahrt sowohl den Kontrast durch „andere“ als auch die Charakterisierung „friedlich“.
- source_word: decem tribus
  choice: die zehn Stämme
  rationale: Die übliche und sachlich passende Wiedergabe im Zusammenhang mit den Stämmen Israels.
- source_word: captiuae factae sunt
  choice: in die Gefangenschaft geführt wurden
  rationale: Natürliches Deutsch für das lateinische Passiv und den historischen Kontext der Verschleppung.
theological_decisions:
- issue: Bezug der friedlichen Menge
  choice: Die Menge wird ausdrücklich mit den zehn Stämmen identifiziert.
  alternative: Die Identifikation nur lose oder als Vergleich formulieren.
  rationale: „Haec sunt“ ist eine direkte Identifikationsaussage.
- issue: Unvollständiger Satz am Versende
  choice: Die durch „de“ eröffnete Herkunftsangabe wird mit Auslassungspunkten als unvollständig markiert.
  alternative: Den Satz ohne Kennzeichnung abbrechen oder Material aus Vers 40 ergänzen.
  rationale: Der bereitgestellte lateinische Vers endet mitten in der Konstruktion; die Übersetzung wahrt diese Textgrenze, ohne den fehlenden Anschluss zu erfinden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Deutungskonstruktion wird verständlich wiedergegeben; der syntaktische Abbruch der lateinischen Versabgrenzung bleibt transparent.
