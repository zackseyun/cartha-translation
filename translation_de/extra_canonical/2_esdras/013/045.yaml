source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dimidii, nam regio illa uocatur Arzareth. Tunc inhabitauerunt ibi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/045.yaml
  text: For through that region there was a long way to travel, of a year and a half; and that region is called Arzareth.
translation:
  language: de
  text: Der Weg durch jene Gegend dauerte anderthalb Jahre; denn jene Gegend heißt Arzareth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimidii
  choice: anderthalb Jahre
  rationale: Das überlieferte „und eines halben“ schließt die im vorangehenden Satzteil genannte Dauer von einem Jahr ab; im Deutschen wird die Gesamtdauer natürlich als „anderthalb Jahre“ wiedergegeben.
- source_word: nam
  choice: denn
  rationale: Die kausale Verknüpfung des lateinischen „nam“ wird gewahrt, ohne sie wie die englische Konsultationsfassung bloß additiv mit „und“ wiederzugeben.
- source_word: regio illa
  choice: jene Gegend
  rationale: „Gegend“ ist hier eine natürliche und sachlich passende Wiedergabe von „regio“.
- source_word: uocatur Arzareth
  choice: heißt Arzareth
  rationale: Die idiomatische deutsche Form gibt die Benennung der Gegend knapp und genau wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der im bereitgestellten lateinischen Ausschnitt nur teilweise erhaltene erste Satzteil wurde anhand seines unmittelbar vorausgesetzten Zusammenhangs und der geprüften englischen Konsultationsfassung vollständig wiedergegeben. Das am Ende folgende „Tunc inhabitauerunt ibi“ gehört syntaktisch zum nächsten Satz und wurde nicht in Vers 45 aufgenommen.
