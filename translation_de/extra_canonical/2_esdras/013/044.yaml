source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: altissimus signa, et statuit uenas fluminis usquequo transirent. Per eam enim regionem erat uia multa itineris anni unius et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/044.yaml
  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: de
  text: Denn damals tat der Höchste Zeichen und brachte die Wasserläufe des Flusses zum Stillstand, bis sie hinübergezogen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: der Höchste
  rationale: Die traditionelle und zugleich allgemein verständliche Gottesbezeichnung gibt den lateinischen Superlativ substantivisch wieder.
- source_word: signa
  choice: Zeichen
  rationale: Bewahrt den weiten Bedeutungsumfang von »signa«, ohne die Zeichen ausdrücklich als Wunder zu deuten.
- source_word: statuit
  choice: hielt … auf
  rationale: Gibt in diesem Zusammenhang das Zum-Stillstand-Bringen der Wasserläufe natürlich wieder.
- source_word: uenas fluminis
  choice: die Wasserläufe des Flusses
  rationale: Das bildhafte »Adern des Flusses« bezeichnet hier dessen Wasserläufe oder Rinnen; »Wasserläufe« ist verständlich und vermeidet eine zu enge Festlegung auf Flussarme.
- source_word: usquequo transirent
  choice: bis sie hinübergezogen waren
  rationale: Gibt die zeitliche Grenze und den vollendeten Übergang der betreffenden Menschen idiomatisch wieder.
theological_decisions:
- issue: Art der göttlichen Zeichen
  choice: Zeichen
  alternative: Wunder
  rationale: Der lateinische Text benennt »signa« und legt nicht ausdrücklich fest, dass der Begriff enger als »Wunder« zu verstehen ist.
- issue: Nicht ausdrücklich genanntes Objekt der Zeichen
  choice: ohne Zusatz »für sie«
  alternative: »tat für sie Zeichen«
  rationale: Im vorgelegten lateinischen Wortlaut steht kein entsprechendes indirektes Objekt; daher wird es nicht ergänzt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung bleibt nahe am lateinischen Satzbau, klingt aber auf Deutsch natürlich. Der anschließende, unvollständige lateinische Satzanfang »Per eam enim regionem …« wurde nicht in Vers 44 aufgenommen, entsprechend der angegebenen Versabgrenzung und der englischen Konsultationsfassung.
