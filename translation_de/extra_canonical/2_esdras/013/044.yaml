  verdict: revise
  source_fidelity: 'Der Entwurf gibt die extante Aussage sachgerecht wieder: „der Höchste“ für altissimus, „Zeichen“ für signa und die zeitliche Grenze „bis sie hinübergezogen waren“ für usquequo transirent. Ein nicht im Latein stehendes Objekt wie „für sie“ wird zu Recht nicht ergänzt. Die überlieferte lateinische Klausel ist am Anfang verkürzt; die deutsche Wiedergabe „tat“ folgt dabei der auch im englischen Audit Trail vorausgesetzten Satzergänzung, ohne zusätzlichen Sinngehalt einzutragen.'
  naturalness: „Die Wasserläufe des Flusses aufhalten“ ist zwar verständlich, klingt im Deutschen aber weniger idiomatisch und kann bei Wasserläufen missverständlich sein. „Zum Stillstand bringen“ gibt die beabsichtigte Unterbrechung des Flusslaufs klar und natürlich wieder.
  terminology: Die Gottesbezeichnung „der Höchste“ und „Zeichen“ sind angemessen, würdig und konfessionell nicht verengend. „Wasserläufe des Flusses“ bewahrt die Offenheit von uenas fluminis besser als eine Festlegung auf einzelne Flussarme.
