id: 2ES.13.41
reference: 2 Esdras 13:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: de
  text: 'Sie fassten aber untereinander diesen Plan: Sie wollten die Menge der Völker verlassen und in ein ferner gelegenes Gebiet ziehen, in dem noch nie Menschen gewohnt hatten, damit sie wenigstens dort ihre Satzungen einhalten könnten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: consilium hoc
  choice: diesen Plan
  rationale: Gibt die konkrete, gemeinsam gefasste Absicht natürlich und genau wieder.
- source_word: multitudinem gentium
  choice: die Menge der Völker
  rationale: Bewahrt sowohl den kollektiven Ausdruck „multitudo“ als auch den Plural „gentes“, ohne ihn auf ein einzelnes Reich oder eine bestimmte Volksgruppe einzuengen.
- source_word: ulteriorem regionem
  choice: ein ferner gelegenes Gebiet
  rationale: Drückt die räumliche Entfernung beziehungsweise das Weiterziehen aus, ohne eine im Lateinischen nicht ausdrücklich genannte Himmelsrichtung einzutragen.
- source_word: ubi nunquam inhabitauit genus humanum
  choice: in dem noch nie Menschen gewohnt hatten
  rationale: Natürliches modernes Deutsch für die kollektive lateinische Aussage, dass dort zuvor keine Menschen ansässig gewesen waren.
- source_word: Vt uel ibi
  choice: damit sie wenigstens dort
  rationale: „Wenigstens“ bewahrt die Nuance von „uel“, die über ein bloßes „dort“ hinausgeht.
- source_word: obseruarent legitima sua
  choice: ihre Satzungen einhalten könnten
  rationale: „Satzungen“ wahrt den rechtlich-religiösen Sinn von „legitima“, ohne den Ausdruck vorschnell mit einem bestimmten Gesetzeskorpus gleichzusetzen; der Konjunktiv wird als Zweck beziehungsweise beabsichtigte Möglichkeit wiedergegeben.
theological_decisions:
- issue: Bezug von „legitima sua“
  choice: ihre Satzungen
  alternative: ihr Gesetz / ihre gesetzlichen Vorschriften
  rationale: Die gewählte Formulierung lässt offen, ob einzelne überlieferte Ordnungen oder das Gesetz als Ganzes gemeint sind, und vermeidet dadurch eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den langen lateinischen Satz lesefreundlich; „wenigstens“ erhält die im lateinischen „uel“ liegende Einschränkung.
