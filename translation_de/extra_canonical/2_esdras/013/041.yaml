  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des lateinischen Satzes wieder: den gefassten Plan, das Verlassen der Menge der Völker, das Weiterziehen in eine fernere Gegend, ihre bisherige Unbewohntheit und den Zweck, dort die eigenen Satzungen zu halten. „Wenigstens“ gibt die einschränkende Nuance von vel angemessen wieder. Der finale Konjunktiv „einhalten könnten“ entspricht dem lateinischen Zwecksatz obseruarent.'
