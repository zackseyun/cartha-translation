  register: Modernes, verständliches Standarddeutsch mit würdigem visionärem Ton. Das einleitende „Siehe“ bleibt als bewusstes biblisches Aufmerksamkeitssignal erhalten; die Spannung des lateinischen „tamen“ wird nicht geglättet.
