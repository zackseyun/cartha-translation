  yaml_path: translation/extra_canonical/2_esdras/013/008.yaml
  text: And after this I looked, and behold, all those who had gathered against him to attack him were greatly afraid, yet they still dared to fight.
translation:
  language: de
  text: 'Danach sah ich: Siehe, alle, die sich gegen ihn versammelt hatten, um ihn zu bekämpfen, fürchteten sich sehr; dennoch wagten sie zu kämpfen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec vidi
  choice: Danach sah ich
  rationale: Gibt die zeitliche Abfolge und die Visionserfahrung knapp und natürlich wieder.
- source_word: et ecce
  choice: Siehe
  rationale: Bewahrt das visionäre Aufmerksamkeitssignal des lateinischen Textes in würdigem biblischem Register.
- source_word: congregati sunt ad eum
  choice: sich gegen ihn versammelt hatten
  rationale: Der feindliche Zweck des Zusammenkommens wird durch den folgenden Finalsatz deutlich; „gegen ihn“ gibt diese Ausrichtung idiomatisch wieder.
- source_word: ut expugnarent eum
  choice: um ihn zu bekämpfen
  rationale: „Bekämpfen“ erfasst hier den feindlichen Angriff, ohne einen im Kontext nicht ausdrücklich festgelegten Ausgang wie „besiegen“ vorwegzunehmen.
- source_word: timebant valde
  choice: fürchteten sich sehr
  rationale: Formnahe Wiedergabe von Verb und Verstärkung.
- source_word: tamen audebant pugnare
  choice: dennoch wagten sie zu kämpfen
  rationale: Bewahrt die Spannung zwischen großer Furcht und trotzdem vorhandenem Kampfesmut.
theological_decisions: []
