  text: 'attamen facilius est periclitantem venire in haec, quam pertransire sicut nubem a saeculo et non videre quae contigerunt in novissimo. Et respondit ad me et dixit:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: de
  text: 'Doch für jemanden, der in Gefahr ist, ist es leichter, in dies alles zu gelangen, als wie eine Wolke aus der Welt zu scheiden und nicht zu sehen, was am Ende geschehen ist.« Da antwortete er mir und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periclitantem
  choice: einen, der in Gefahr ist
  rationale: Gibt das substantivierte Partizip verständlich und ohne nähere Festlegung der Art der Gefahr wieder.
- source_word: venire in haec
  choice: in all dies hineinzugeraten
  rationale: Bewahrt die Bewegungsvorstellung der lateinischen Wendung und bezeichnet die zuvor geschilderten Ereignisse, ohne sie bloß mit »erleben« zu paraphrasieren.
- source_word: pertransire sicut nubem a saeculo
  choice: wie eine Wolke aus der Welt zu scheiden
  rationale: Das »a« bezeichnet am ehesten eine Trennung beziehungsweise ein Weggehen aus der Welt; »wie eine Wolke« erhält das Bild des raschen Verschwindens. Eine alternative Deutung von saeculum als Zeitalter wird in der Fußnote genannt.
- source_word: in novissimo
  choice: am Ende
  rationale: Die singularische lateinische Form bezeichnet hier offen das Letzte beziehungsweise das Ende; »am Ende« vermeidet die unbelegte Präzisierung zu »in den letzten Tagen«.
- source_word: Et respondit ad me et dixit
  choice: Da antwortete er mir
  rationale: Natürliches modernes Deutsch; das lateinische formelhafte »antwortete ... und sagte« wird ohne Bedeutungsverlust idiomatisch zusammengezogen.
theological_decisions:
- issue: Bedeutung von saeculum im Zusammenhang mit Tod und Endzeit
  choice: Welt
  alternative: Zeitalter
  rationale: Die Verbindung mit »a« spricht für das Scheiden aus der gegenwärtigen Welt; zugleich bleibt »Zeitalter« lexikalisch möglich und wird deshalb als Alternative ausgewiesen.
- issue: Zeitliche Bedeutung von in novissimo
  choice: am Ende
  alternative: in der letzten Zeit / in den letzten Tagen
  rationale: Die knappe Formulierung bewahrt die endzeitliche Offenheit des lateinischen Singulars, statt einen bestimmten eschatologischen Fachausdruck einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wolkenbild und die Spannung zwischen gegenwärtiger Gefahr und einem Scheiden vor dem Ende bleiben erhalten; schwerfällige lateinische Satzformeln werden behutsam idiomatisiert.
