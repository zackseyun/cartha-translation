  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen: periclitantem bezeichnet eine gefährdete Person, a saeculo kann im Kontext idiomatisch als „aus der Welt“ wiedergegeben werden, und in novissimo bleibt mit „am Ende“ offen. „Hineinzugeraten“ fügt jedoch eine unbeabsichtigte, eher unglückliche oder zufällige Nuance hinzu, die venire nicht hat. Außerdem sollte die vollständige abschließende Redeformel im Text stehen, nicht nur in einer Fußnote.'
  naturalness: Die vorgeschlagene Fassung ist überwiegend modernes, würdiges Deutsch. „in dies alles zu gelangen“ ist neutraler und näher am lateinischen venire. „Da antwortete er mir und sagte“ ist als knappe erzählerische Formel zwar leicht semitisierend, in diesem Schriftregister aber verständlich und angemessen.
  terminology: „aus der Welt zu scheiden“ gibt die Trennung in a saeculo gut wieder, ohne eine konfessionell geprägte Deutung einzutragen. „Am Ende“ wahrt gegenüber „in den letzten Tagen“ die knappe, nicht weiter spezifizierte Form von in novissimo.
