  source_fidelity: 'Der Sinngehalt wird weitgehend getroffen: „Und danach“ gibt et post haec wieder, „vom Berg herabstieg“ und „zu sich rief“ sind präzise. Die Konstruktion „sah ich, wie“ ist jedoch eine leicht freiere Umformung der lateinischen Akkusativ-mit-Partizip-Konstruktion; die deutsche Infinitivkonstruktion bildet beide gleichgeordneten, von vidi abhängigen Handlungen unmittelbarer ab.'
  naturalness: Die vorgeschlagene Fassung ist verständlich und würdig. „Sah ich den Mann … herabsteigen und … rufen“ ist ebenso idiomatisch und zugleich knapper. „Jener Mann“ ist möglich, wirkt im modernen Standarddeutsch aber stärker demonstrativ-distanzierend als das hier anaphorisch gebrauchte ipsum verlangt.
  terminology: „friedliche Menschenmenge“ gibt multitudinem aliam pacificam angemessen wieder. Eine zusätzliche theologische Deutung ist nicht vorhanden.
