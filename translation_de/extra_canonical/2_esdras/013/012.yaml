- from: Und danach sah ich, wie jener Mann vom Berg herabstieg und eine weitere friedliche Menschenmenge zu sich rief.[a]
  to: Und danach sah ich den Mann vom Berg herabsteigen und eine weitere friedliche Menschenmenge zu sich rufen.
  rationale: Die Überarbeitung erhält sämtliche Elemente des lateinischen Satzes, bildet die beiden Partizipien unmittelbar durch koordinierte Infinitive nach und vermeidet eine nicht quellenbezogene Fußnote. „Den Mann“ verweist im Deutschen natürlich auf die zuvor genannte Gestalt; eine stärkere demonstrative Nuance von „jenen“ ist für ipsum hier nicht erforderlich.
