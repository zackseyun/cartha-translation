  text: And after this I saw that man coming down from the mountain and calling to himself another peaceful multitude[a].
translation:
  language: de
  text: Und danach sah ich den Mann vom Berg herabsteigen und eine weitere friedliche Menschenmenge zu sich rufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec
  choice: Und danach
  rationale: Gibt sowohl die Konjunktion „et“ als auch die zeitliche Folge von „post haec“ wieder und bewahrt den parataktischen Erzählstil.
- source_word: ipsum hominem
  choice: jener Mann
  rationale: Verweist natürlich auf den bereits erwähnten Mann zurück, ohne „ipsum“ unnötig als betontes „selbst“ zu verstehen.
- source_word: descendentem de monte
  choice: vom Berg herabstieg
  rationale: Der lateinische Partizipialausdruck wird in idiomatischem Deutsch als finites Verb wiedergegeben; die Abwärtsbewegung bleibt ausdrücklich erhalten.
- source_word: multitudinem aliam pacificam
  choice: eine weitere friedliche Menschenmenge
  rationale: „weitere“ gibt die zusätzliche, andere Menge wieder; „Menschenmenge“ macht den im Kontext eindeutigen Personenbezug natürlich verständlich, und „friedlich“ bewahrt „pacificam“.
- source_word: advocantem ad se
  choice: zu sich rief
  rationale: Bewahrt sowohl den Ruf als auch dessen Richtung auf den Mann hin und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lateinischen Partizipien werden zur besseren Verständlichkeit in eine „wie“-Konstruktion mit finiten Verben überführt, ohne die Abfolge oder die Beziehungen der Handlungen zu verändern.
