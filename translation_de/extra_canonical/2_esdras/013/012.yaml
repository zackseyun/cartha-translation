    rationale: Sie dokumentiert lediglich eine frühere deutsche/englische Wiedergabe, nicht eine abweichende Lesart des lateinischen Ausgangstextes. Ohne textkritischen oder übersetzerischen Mehrwert soll der Anker entfallen.
