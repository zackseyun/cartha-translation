source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terra sua in diebus Iosiae regis, quem captiuum duxit Salmanassar rex Assyriorum, et transtulit eos trans flumen, et translati sunt in terram aliam. Ipsi autem sibi dederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/040.yaml
  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: de
  text: Das sind die zehn Stämme, die zur Zeit König Hoscheas[a] aus ihrem Land in die Gefangenschaft geführt wurden. Salmanassar, der König der Assyrer, führte ihn gefangen fort; er brachte sie über den Strom[b], und sie wurden in ein anderes Land versetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Text lautet hier „in den Tagen König Josias“. Alte syrische, äthiopische und arabische Fassungen haben jedoch „Hoschea“, was zum assyrischen Exil der nördlichen Stämme passt.
    reason: textual_variant
  - marker: b
    text: Gemeint ist wahrscheinlich der Euphrat.
    reason: clarification
lexical_decisions:
- source_word: terra sua
  choice: aus ihrem Land
  rationale: Gibt den Ablativ im Zusammenhang der Wegführung natürlich wieder; „ihr eigenes Land“ wäre möglich, aber unnötig betont.
- source_word: captiuum duxit / transtulit eos
  choice: führte sie gefangen fort; er brachte sie
  rationale: Bewahrt die zweifache Aussage des lateinischen Textes, glättet aber den grammatischen Numerusfehler bei „quem“ entsprechend dem gemeinten Bezug auf die zehn Stämme.
- source_word: trans flumen
  choice: über den Strom
  rationale: Der bestimmte Ausdruck bezeichnet wahrscheinlich den Euphrat, doch der Eigenname steht nicht im Text; die traditionelle Bezeichnung „der Strom“ wahrt diese Offenheit.
- source_word: translati sunt in terram aliam
  choice: sie wurden in ein anderes Land versetzt
  rationale: Bildet das Passiv und den Ortswechsel eng nach, ohne einen im Satz nicht ausdrücklich genannten Handelnden einzufügen.
theological_decisions:
- issue: Königsname beim assyrischen Exil der zehn Stämme
  choice: Hoschea im Haupttext
  alternative: Josia nach dem erhaltenen lateinischen Wortlaut „Iosiae“
  rationale: „Iosiae“ ist im historischen Zusammenhang offenkundig gestört; die alten syrischen, äthiopischen und arabischen Tochterübersetzungen bewahren Hoschea, den König beim Untergang des Nordreichs. Die lateinische Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hoschea“ folgt der wahrscheinlich ursprünglichen, durch alte Tochterübersetzungen bezeugten Lesart; die problematische lateinische Überlieferung wird nicht verschwiegen. „Der Strom“ bewahrt die knappe, traditionsgeprägte Ausdrucksweise des Lateinischen.
