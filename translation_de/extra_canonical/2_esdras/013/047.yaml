  text: Again the Most High will hold back the channels of the river, so that they may cross. Therefore you saw the multitude gathered in peace.
translation:
  language: de
  text: Darum hast du die Menge gesehen, die in Frieden versammelt war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte lateinische Text fährt mit den unvollständigen Worten „Aber auch die, welche …“ fort; sie gehören syntaktisch zum folgenden Zusammenhang. Der englische Konsultationstext enthält hier zusätzlich einen Satz über das Zurückhalten der Flussläufe, der im für diesen Vers bereitgestellten lateinischen Text nicht steht.
    reason: Dokumentiert sowohl den am Versende abbrechenden lateinischen Anschluss „Sed et qui“ als auch die Abweichung des englischen Konsultationstextes von der vorliegenden Quellenbasis.
lexical_decisions:
- source_word: propter hoc
  choice: Darum
  rationale: Gibt den folgernden Zusammenhang knapp und natürlich wieder.
- source_word: multitudinem
  choice: die Menge
  rationale: Entspricht dem lateinischen Kollektivbegriff, ohne näher zu bestimmen, aus welchen Menschen die Gruppe besteht.
- source_word: collectam
  choice: die sich … versammelt hatte
  rationale: Gibt das passive Partizip in idiomatischem Deutsch wieder; der vorangehende Visionsbericht legt die vorzeitige Form nahe.
- source_word: cum pace
  choice: in Frieden
  rationale: Bewahrt die mögliche Bedeutung eines friedlichen Zustands beziehungsweise einer friedlichen Sammlung, ohne sie näher auszudeuten.
theological_decisions:
- issue: Bezug und Charakter der versammelten Menge
  choice: Die Menge bleibt unbestimmt; ihre Versammlung wird lediglich als friedlich beschrieben.
  alternative: Die Menge ausdrücklich als endzeitliches Gottesvolk oder als bestimmte Volksgruppe identifizieren.
  rationale: Der lateinische Wortlaut dieses Verses nimmt keine solche ausdrückliche Identifikation vor.
- issue: Im englischen Konsultationstext enthaltener Satz über das Zurückhalten der Flussläufe
  choice: Nicht in den Haupttext dieses Verses aufgenommen.
  alternative: „Wieder wird der Höchste die Wasserläufe des Flusses zurückhalten, damit sie hinüberziehen können.“ voranstellen.
  rationale: Dieser Satz ist im bereitgestellten lateinischen Wortlaut von 2 Esdras 13,47 nicht enthalten und darf daher nicht gegen die Originalsprachen-Evidenz importiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Folgerungsstruktur des Lateinischen bleibt erhalten; nicht im Quellentext belegte Ergänzungen werden vermieden.
