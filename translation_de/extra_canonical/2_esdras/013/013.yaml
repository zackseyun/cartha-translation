  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Bilder des lateinischen Textes zuverlässig wieder: die herankommenden Gesichter, die gegensätzlichen Reaktionen, die Gefesselten, das Herbeiführen der Vorgestellten sowie das Erwachen aus überwältigendem Schrecken. „Vorgeführt wurden“ ist für offerebantur im Kontext gut vertretbar; die Fußnote bewahrt die mögliche Bedeutung „dargebracht“.'
