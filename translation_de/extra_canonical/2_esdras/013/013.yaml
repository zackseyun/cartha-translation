source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et accedebant ad eum vultus hominum multorum, quorumdam gaudentium, quorumdam tristantium, aliqui vero alligati, aliqui adducentes ex eis qui offerebantur. et egoa multitudine pavoris expergefactus sum et deprecatus sum Altissimum et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: de
  text: 'Und die Gesichter vieler Menschen kamen auf ihn zu: Die einen freuten sich, die anderen waren traurig; manche waren gefesselt, andere führten einige von denen herbei, die vorgeführt wurden.[a] Da erwachte ich vor lauter Schrecken, flehte den Höchsten an und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das lateinische Wort kann auch bedeuten: »dargebracht wurden«.'
    reason: Bewahrt die lexikalische Mehrdeutigkeit von offerebantur, ohne im Haupttext eine möglicherweise kultische Deutung aufzudrängen.
lexical_decisions:
- source_word: vultus hominum multorum
  choice: die Gesichter vieler Menschen
  rationale: Bewahrt das auffällige Bild des lateinischen Textes, in dem ausdrücklich die Gesichter auf ihn zukommen, statt es zu den Menschen selbst zu glätten.
- source_word: gaudentium … tristantium
  choice: Die einen freuten sich, die anderen waren traurig
  rationale: Gibt die kontrastierenden Partizipien in natürlichem, klarem Deutsch wieder.
- source_word: alligati
  choice: gefesselt
  rationale: Entspricht der konkreten Grundbedeutung und passt zu Personen, die herbeigeführt werden.
- source_word: adducentes
  choice: führten … herbei
  rationale: Gibt die zielgerichtete Bewegung zu der genannten Gestalt wieder.
- source_word: offerebantur
  choice: vorgeführt wurden
  rationale: Offerre kann hier das Heranbringen oder Vorführen von Personen bezeichnen; die Wiedergabe vermeidet eine unbegründete Festlegung auf eine kultische Opferhandlung.
- source_word: a multitudine pavoris
  choice: vor lauter Schrecken
  rationale: Natürliches modernes Deutsch für die große, überwältigende Intensität des Schreckens.
- source_word: deprecatus sum Altissimum
  choice: flehte zum Höchsten
  rationale: Bringt die eindringliche Bitte an Gott knapp und würdig zum Ausdruck.
theological_decisions:
- issue: Ob offerebantur eine kultische Opferung oder ein Vorführen bezeichnet
  choice: vorgeführt wurden
  alternative: dargebracht/geopfert wurden
  rationale: Im unmittelbaren Zusammenhang mit gefesselten und herbeigeführten Personen ist ein Vorführen wahrscheinlicher. Die mögliche kultische Nuance wird jedoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das ungewöhnliche visionäre Bild der herankommenden Gesichter bleibt bewusst erhalten; schwerfällige lateinische Genitiv- und Partizipialkonstruktionen werden behutsam in natürliche deutsche Sätze überführt.
