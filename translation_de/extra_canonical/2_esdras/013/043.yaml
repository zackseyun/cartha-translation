  text: Und sie betraten die schmalen Durchgänge des Euphrat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angustos
  choice: die schmalen
  rationale: Gibt den Akkusativ Plural von „angustus“ unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: fluminis Eufratis
  choice: des Euphrat
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Durchgänge zum Fluss; im Deutschen ist der Flussname ohne zusätzliches „Flusses“ idiomatisch.
- source_word: introierunt
  choice: betraten
  rationale: Drückt die Bewegung in einen räumlichen Bereich hinein knapp und natürlich aus.
- source_word: angustos … introierunt
  choice: betraten die schmalen Durchgänge
  rationale: Das substantivisch gebrauchte Adjektiv setzt im Kontext ein ausgelassenes Wort wie „Durchgänge“ oder „Engstellen“ voraus; „Durchgänge“ bewahrt die räumliche Vorstellung der englischen Konsultationsfassung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der überlieferte lateinische Satz bricht nach „tunc“ ab; da die Versabgrenzung und die englische Konsultationsfassung nur den ersten vollständigen Satzteil wiedergeben, endet auch die Übersetzung nach „Euphrat“.
