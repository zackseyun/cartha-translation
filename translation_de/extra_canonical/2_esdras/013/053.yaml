id: 2ES.13.53
reference: 2 Esdras 13:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: haec est interpretatio somnii quem vidisti, et propter quod inluminatus es haec solus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: de
  text: Dies ist die Deutung des Traums, den du gesehen hast, und der Grund, weshalb allein du über diese Dinge erleuchtet worden bist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatio
  choice: Deutung
  rationale: Im Zusammenhang mit einem Traum bezeichnet das lateinische Wort dessen Auslegung beziehungsweise erschlossenen Sinn; „Deutung“ ist im modernen Deutsch natürlich und präzise.
- source_word: inluminatus es
  choice: du … erleuchtet worden bist
  rationale: Die passive Form und das Offenbarungsmotiv des lateinischen Textes bleiben erhalten, ohne den nicht genannten Handelnden ausdrücklich zu benennen.
- source_word: haec
  choice: über diese Dinge
  rationale: Das abschließende „haec“ bezieht sich sachlich auf den Inhalt der Offenbarung. „Über diese Dinge“ gibt diesen Bezug idiomatisch wieder.
- source_word: solus
  choice: allein du
  rationale: Die hervorgehobene Exklusivität wird bewahrt; die Wortstellung klingt auf Deutsch natürlich und betont zugleich „du“.
theological_decisions:
- issue: Urheber der Erleuchtung
  choice: Passivform ohne ausdrückliche Nennung Gottes
  alternative: Gott hat allein dich über diese Dinge erleuchtet
  rationale: Der lateinische Text nennt den Handelnden nicht ausdrücklich. Die Übersetzung bewahrt dieses sogenannte göttliche Passiv und vermeidet eine interpretierende Ergänzung.
- issue: Bezug von „propter quod“
  choice: „der Grund, weshalb“ als Erklärung der besonderen Erleuchtung
  alternative: „und deshalb“ als bloße Folgeangabe
  rationale: „propter quod“ leitet hier am natürlichsten den Grund beziehungsweise die Erklärung dafür ein, warum nur der Seher diese Einsicht erhalten hat; die etwas gedrängte lateinische Syntax wird verständlich wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der lateinischen Syntax, glättet sie jedoch so weit, dass der Satz für heutige Leser klar und natürlich ist. Die im englischen Konsultationstext vorhandene Fußnote [53] passt inhaltlich offenbar nicht zu diesem Vers und wurde daher nicht übernommen.
