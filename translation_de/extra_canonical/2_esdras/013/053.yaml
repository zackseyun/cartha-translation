  source_fidelity: 'Die Übersetzung gibt den lateinischen Satz vollständig und sinngemäß genau wieder: „interpretatio somnii“ erscheint treffend als „Deutung des Traums“, „solus“ als hervorgehobenes „allein du“, und das ungenannte Passiv von „inluminatus es“ bleibt gewahrt. „über diese Dinge“ vermittelt den sachlichen Bezug von „haec“, ohne einen Handelnden oder eine weitergehende Deutung hinzuzufügen.'
