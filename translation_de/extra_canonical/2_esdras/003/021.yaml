source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: de
  text: Denn der erste Adam, der ein böses Herz trug, verging sich und wurde besiegt; so erging es auch allen, die von ihm abstammten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Cor enim malignum baiolans
  choice: Denn der erste Adam, der ein böses Herz trug
  rationale: „trug“ gibt baiolans direkt wieder, ohne die stärkere Deutung „war mit … belastet“ einzutragen. „Böses Herz“ bewahrt die konkrete anthropologische Ausdrucksweise des Lateinischen.
- source_word: transgressus
  choice: verging sich
  rationale: Das absolute lateinische Partizip bezeichnet eine Übertretung, nennt hier aber kein ausdrückliches Objekt. „Verging sich“ ist im Deutschen natürlich und ergänzt weder „Gesetz“ noch „Gebot“.
- source_word: uictus est
  choice: wurde besiegt
  rationale: Die passive Form und das Bild des Unterliegens bleiben erhalten; das Lateinische nennt nicht, wodurch oder von wem Adam besiegt wurde.
- source_word: qui ex eo nati
  choice: die von ihm abstammten
  rationale: Wörtlich heißt es „die aus/von ihm geboren wurden“. „Von ihm abstammten“ ist idiomatisches modernes Deutsch und bewahrt den genealogischen Sinn.
theological_decisions:
- issue: Reichweite der Aussage über Adams Nachkommen
  choice: „ebenso auch alle“ lässt die Ellipse des Lateinischen bestehen und bezieht sowohl das Sich-Vergehen als auch das Besiegtwerden auf Adams Nachkommen.
  alternative: Nur das Besiegtwerden ausdrücklich auf alle Nachkommen beziehen.
  rationale: Die koordinierende Wendung sed et omnes qui ex eo nati setzt die gesamte vorausgehende Aussage elliptisch fort. Die Übersetzung vermeidet eine zusätzliche dogmatische Erklärung der Art oder Übertragung dieser Gemeinsamkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die nicht näher erklärte Rede vom „bösen Herz“ und vom Besiegtwerden bewahren die Spannung des Ausgangstextes.
