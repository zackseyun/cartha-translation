  text: eius ex Aegypto, et adduxisti eos super montem Sina. Et inclinasti caelos, et statuisti terram, et commouisti orbem, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/018.yaml
  text: you bent down the heavens[a], established the earth, and moved the world,
translation:
  language: de
  text: Du neigtest die Himmel herab, gründetest die Erde[a] und bewegtest den Erdkreis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alte syrische und äthiopische Übersetzungen lassen hier eine Lesart erkennen, die »erschüttertest die Erde« bedeutet.
    reason: textual_variant
lexical_decisions:
- source_word: inclinasti caelos
  choice: neigtest die Himmel herab
  rationale: Gibt das aktive Herabneigen der Himmel natürlich und bildkräftig wieder, ohne das Bild abzuschwächen.
- source_word: statuisti terram
  choice: gründetest die Erde
  rationale: Folgt dem überlieferten lateinischen Text mit dem Sinn »fest hinstellen, errichten, gründen«; »gründetest« ist im kosmischen Zusammenhang würdig und verständlich.
- source_word: commouisti orbem
  choice: bewegtest den Erdkreis
  rationale: Bewahrt den Unterschied zu statuisti und gibt orbis als bewohnte Welt beziehungsweise Erdkreis wieder.
theological_decisions:
- issue: Textvariante bei statuisti terram
  choice: Im Haupttext »gründetest die Erde« nach dem vorgelegten lateinischen Text
  alternative: »erschüttertest die Erde« nach alten orientalischen Übersetzungen und einer vermuteten griechischen Lesart
  rationale: Die Vorlage liest eindeutig statuisti. Die abweichende, kontextuell plausible Überlieferung wird nicht stillschweigend in den Haupttext eingesetzt, sondern transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die kosmische Bildsprache bleiben erhalten; die textkritische Unsicherheit wird offengelegt.
