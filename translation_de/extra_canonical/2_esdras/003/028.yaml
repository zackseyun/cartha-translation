  text: 'Et dixi ego tunc in corde meo: numquid meliora faciunt qui habitant in Babylone, et propter hoc dominabit Sion?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: de
  text: 'Da sagte ich in meinem Herzen[a]: »Handeln die, die in Babylon wohnen, etwa besser, und wird deshalb Zion herrschen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der lateinische Wortlaut ist hier ungewöhnlich und könnte auf eine in der Überlieferung gestörte Textzeile zurückgehen. Er lautet formal: „… und wird deshalb Zion herrschen?“ Im Zusammenhang von Esras Klage wäre eher ein Gegensatz zwischen Babylons scheinbarem Wohlergehen und Zions Unterwerfung zu erwarten. Die Übersetzung bewahrt jedoch die überlieferte rhetorische Frage, ohne eine Rekonstruktion festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: numquid meliora faciunt
  choice: Handeln ... etwa besser
  rationale: Gibt die rhetorische Frage natürlich wieder, ohne ihre erwartete Verneinung ausdrücklich festzulegen.
- source_word: qui habitant in Babylone
  choice: die Bewohner Babylons
  rationale: Eine knappe, idiomatische Wiedergabe der in Babylon Wohnenden.
- source_word: dominabit Sion
  choice: wird ... über Zion geherrscht
  rationale: Bewahrt die überlieferte passive beziehungsweise unpersönliche Aussage über Zions Beherrschung, ohne Babylon ausdrücklich als handelndes Subjekt einzusetzen.
theological_decisions:
- issue: Verhältnis zwischen Babylons Wohlergehen und Zions Unterwerfung
  choice: Die rhetorische Verknüpfung durch „deshalb“ bleibt bestehen.
  alternative: Babylon ausdrücklich als Herrscher über Zion benennen oder den kausalen Zusammenhang glätten.
  rationale: Der lateinische Text stellt die vermeintlich besseren Taten der Babylonier und Zions Beherrschung spannungsvoll nebeneinander, nennt im zweiten Satzteil aber kein ausdrückliches handelndes Subjekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In meinem Herzen“ erhält die biblische Denk- und Innensprache; „wird über Zion geherrscht“ bildet die schwierige lateinische Form möglichst offen ab.
