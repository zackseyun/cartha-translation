id: 2ES.3.12
reference: 2 Esdras 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: de
  text: 'Und es geschah: Als diejenigen, die auf der Erde wohnten, sich zu vermehren begannen, vermehrten sie Kinder, Völker und viele Nationen. Und sie begannen erneut, gottlos zu handeln, mehr noch als die Früheren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicari / multiplicauerunt
  choice: sich zu vermehren / vermehrten
  rationale: Die Wiederholung des lateinischen Verbs wird bewahrt. Das ungewöhnliche „vermehrten sie Kinder“ folgt der unspezifischen Ausdrucksweise der Quelle, ohne sie durch „zeugten“ enger festzulegen.
- source_word: populos et gentes multas
  choice: Völker und viele Nationen
  rationale: Gibt beide lateinischen Begriffe wieder und erhält ihre mögliche Bedeutungsüberschneidung.
- source_word: iterato
  choice: erneut
  rationale: Natürliche moderne Entsprechung für die Wiederaufnahme des gottlosen Handelns.
- source_word: impietatem facere
  choice: gottlos zu handeln
  rationale: Idiomatiche Wiedergabe des lateinischen Ausdrucks, die sowohl religiöse Missachtung als auch entsprechendes Tun umfasst.
- source_word: plus quam priores
  choice: mehr noch als ihre Vorfahren
  rationale: „Vorfahren“ macht den im Kontext gemeinten Vergleich mit den früheren Menschen verständlich; „mehr noch“ bewahrt den Steigerungscharakter.
theological_decisions:
- issue: Bedeutungsumfang von impietas
  choice: gottlos handeln
  alternative: Frevel begehen / ruchlos handeln
  rationale: „Gottlos handeln“ ist verständlich und erhält den religiösen Gehalt, ohne eine bestimmte Art von Sünde einzutragen.
- issue: Referenz von priores
  choice: ihre Vorfahren
  alternative: die Früheren / diejenigen vor ihnen
  rationale: Der Zusammenhang legt frühere Generationen nahe. „Vorfahren“ ist natürliches Deutsch, ohne die Aussage konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung von „vermehren“ und die ungewöhnliche Verbindung mit „Kinder, Völker und viele Nationen“ bleiben aus Quelltreue erhalten; die lange lateinische Periode wird zur besseren Lesbarkeit in zwei Sätze gegliedert.
