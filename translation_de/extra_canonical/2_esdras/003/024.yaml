  source_fidelity: 'Die Übersetzung gibt den lateinischen Satz vollständig und präzise wieder: „sagtest ihm, er solle“ entspricht dixisti ei + Infinitiv; „eine Stadt für deinen Namen“ bildet ciuitatem nominis tui idiomatisch ab; „dir darin Opfergaben ... darbringen“ wahrt offerre tibi in ea ... oblationes. „von dem, was dir gehört“ gibt de tuis bewusst offen wieder.'
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. Die Stellung von „dir darin“ ist natürlich; „Opfergaben darbringen“ ist im kultischen Kontext angemessen und nicht unnötig archaisch.
  terminology: „Opfergaben“ trifft oblationes im Kontext besser als ein allgemeines „Gaben“. Die Formulierung „für deinen Namen“ bewahrt die biblisch-kultische Namensformel, ohne sie interpretierend auszubauen.
