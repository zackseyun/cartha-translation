  rationale: Bewahrt das konkrete und theologisch geprägte Bild des lateinischen Textes.
- source_word: antequam terra adueṅtaret
  choice: bevor die Erde entstand
  rationale: Gibt die zeitliche Aussage im Schöpfungskontext idiomatisch wieder, ohne das weniger natürliche Bild eines bloßen Erscheinens der Erde einzutragen.
theological_decisions:
- issue: Zeitliche Einordnung der Pflanzung des Paradieses
  choice: bevor die Erde entstand
  alternative: bevor die Erde erschien
  rationale: Der Wortlaut stellt die Pflanzung vor den Beginn der Erde; die Übersetzung bewahrt diese auffällige kosmologische Aussage, ohne sie mit anderen Schöpfungsvorstellungen harmonisierend abzuschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache; die Satzstruktur bleibt eng am lateinischen Ausgangstext und ist zugleich im Deutschen flüssig.
