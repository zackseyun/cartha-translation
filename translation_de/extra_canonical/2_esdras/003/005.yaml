id: 2ES.3.5
reference: 2 Esdras 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: de
  text: Und du gabst Adam einen toten Körper? Doch auch er war ein Gebilde deiner Hände, und du hauchtest ihm den Geist des Lebens ein, sodass er vor dir lebendig wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der lateinische Wortlaut des ersten Satzteils ist unsicher beziehungsweise syntaktisch auffällig; möglich wäre auch eine abweichende Zuordnung von Subjekt und Objekt.
    reason: Das Fragezeichen in der Edition und die ungewöhnliche Konstruktion „dedit tibi Adam“ begründen einen transparenten textkritischen Hinweis.
lexical_decisions:
- source_word: corpus mortuum
  choice: einen toten Körper
  rationale: Gibt die lateinische Wortfolge unmittelbar und in modernem Standarddeutsch wieder; das Fragezeichen der Edition bleibt erhalten.
- source_word: figmentum manuum tuarum
  choice: ein Gebilde deiner Hände
  rationale: „Gebilde“ bewahrt den Gedanken des von Gott Geformten, ohne das Bild auf ein bestimmtes Herstellungsverfahren einzuengen.
- source_word: spiritum uitae
  choice: den Geist des Lebens
  rationale: Die formnahe Wiedergabe erhält die biblische Ausdrucksweise und die mögliche Bedeutungsweite von „spiritus“.
- source_word: factus est uiuens coram te
  choice: sodass er vor dir lebendig wurde
  rationale: Natürliches Deutsch, das sowohl das Lebendigwerden als auch „coram te“ ausdrücklich wiedergibt.
theological_decisions:
- issue: Bedeutung und Interpunktion von „Et dedit tibi Adam, corpus mortuum ?“
  choice: „Und du gabst Adam einen toten Körper?“
  alternative: „Und Adam gab dir einen toten Körper?“ / „Und du gabst dir Adam, einen toten Körper?“
  rationale: Die überlieferte lateinische Formulierung ist syntaktisch auffällig. Der englische Konsultationstext versteht „dedit“ sinngemäß mit Gott als Subjekt und Adam als indirektem Objekt; diese Lesart wird übernommen, aber wegen der Textunsicherheit durch eine Fußnote kenntlich gemacht.
- issue: Verhältnis von eingehauchtem Lebensgeist und Lebendigwerden
  choice: kausal mit „sodass“ verbunden
  alternative: 'rein koordinierend: „und er wurde vor dir lebendig“'
  rationale: Die Satzfolge legt den Zusammenhang nahe, ohne weiter zu bestimmen, wie „Geist des Lebens“ anthropologisch oder dogmatisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede Gottes bleibt im vertrauten Singular „du“. Biblisch geprägte Wendungen wie „Geist des Lebens“ und „Gebilde deiner Hände“ werden bewahrt; unnötige Archaismen werden vermieden.
