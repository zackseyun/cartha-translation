lexical_decisions:
- source_word: multitudine magna
  choice: großer Menge
  rationale: Gibt die quantitative Bedeutung der lateinischen Wendung knapp und ohne Ergänzung eines im Fragment nicht vorhandenen Bezugsworts wieder.
- source_word: semen
  choice: Nachkommenschaft
  rationale: Das wörtliche „Same“ bezeichnet hier kollektiv die Nachkommen; „Nachkommenschaft“ ist im modernen Deutschen verständlich und bewahrt den Kollektivsingular.
- source_word: educeres
  choice: herausführtest
  rationale: Bewahrt Bedeutung, zweite Person Singular und den imperfektischen Charakter des lateinischen Konjunktivs im mit „als“ eingeleiteten Temporalsatz.
