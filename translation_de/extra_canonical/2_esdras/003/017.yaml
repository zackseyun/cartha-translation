  source_fidelity: 'Der Text gibt das vorliegende lateinische Fragment vollständig und ohne unzulässige Ergänzungen wieder: „in multitudine magna“ als „in großer Menge“ sowie „Et factum est cum educeres semen“ als „Und es geschah, als du die Nachkommenschaft herausführtest“. Die offene Satzstruktur entspricht dem fragmentarisch bereitgestellten Quellsegment.'
