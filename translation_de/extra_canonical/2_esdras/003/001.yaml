source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: de
  text: Im dreißigsten Jahr nach dem Untergang der Stadt[a] war ich in Babylon – ich, Salathihel, der auch Esra heißt. Als ich auf meinem Bett lag, wurde ich innerlich aufgewühlt, und Gedanken stiegen in meinem Herzen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im dreißigsten Jahr des Untergangs der Stadt“. Die Übersetzung versteht die Wendung als Zeitrechnung seit dem Untergang der Stadt.'
    reason: Die Fußnote macht die im Latein nicht ausdrücklich bezeichnete zeitliche Beziehung transparent, ohne die kontextuell naheliegende Übersetzung zu verwerfen.
lexical_decisions:
- source_word: ruinae civitatis
  choice: nach dem Untergang der Stadt
  rationale: Der lateinische Genitiv bezeichnet hier den Untergang beziehungsweise die Zerstörung der ungenannten Stadt als zeitlichen Bezugspunkt. „Untergang“ bewahrt die Bildkraft von ruina, während „nach“ die im Zusammenhang gemeinte Zeitrechnung natürlich wiedergibt.
- source_word: Salathihel qui et Ezras
  choice: Salatiël, der auch Esra heißt
  rationale: Die Namensgleichsetzung wird klar und idiomatisch wiedergegeben; „Salatiël“ folgt einer geläufigen deutschen Form des Namens.
- source_word: conturbatus sum
  choice: wurde ich innerlich aufgewühlt
  rationale: conturbari bezeichnet starke innere Beunruhigung oder Erschütterung. „Innerlich aufgewühlt“ ist verständlich und wahrt die emotionale Intensität.
- source_word: super cubili meo recumbens
  choice: als ich auf meinem Bett lag
  rationale: Dies gibt die begleitende Körperhaltung natürlich und eng am lateinischen Sinn wieder, ohne das schwerfällige „auf meinem Lager ruhend“.
- source_word: cogitationes meae ascendebant super cor meum
  choice: Gedanken stiegen in meinem Herzen auf
  rationale: Die Formulierung bewahrt die Bewegungsmetapher ascendebant und das Herz als Ort des Denkens und inneren Erwägens, klingt dabei im Deutschen natürlich.
theological_decisions:
- issue: Identität Salatiëls mit Esra
  choice: der auch Esra heißt
  alternative: der auch Esra ist
  rationale: Das lateinische qui et kennzeichnet hier einen weiteren Namen beziehungsweise eine Identifikation. Die Wiedergabe als Namensangabe vermeidet unnötige ontologische Zuspitzung.
- issue: Bedeutung von cor als Zentrum des Denkens
  choice: in meinem Herzen
  alternative: in meinem Sinn
  rationale: „Herz“ erhält die anthropologische Bildsprache des Quelltexts und lässt deren Verbindung von Denken, Empfinden und innerem Erwägen bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenfluss bleibt erzählerisch und persönlich; die semitisch geprägte Herzmetapher wird bewahrt, ohne im Deutschen unnötig fremd zu wirken.
