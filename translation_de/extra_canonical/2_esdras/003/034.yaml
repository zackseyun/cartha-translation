base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: de
  text: Wäge nun unsere Verfehlungen und die der Bewohner der Welt auf der Waage; dann wird sich zeigen, wohin der Ausschlag geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Dann wird sich zeigen, wohin sich der Ausschlag neigt.« Das lateinische momentum puncti kann die Bewegung beziehungsweise den Ausschlag des Anzeigepunkts einer Waage bezeichnen.'
    reason: Die knappe lateinische Waagenmetaphorik ist semantisch und grammatisch nicht völlig eindeutig.
lexical_decisions:
- source_word: iniquitates
  choice: Verfehlungen
  rationale: Gibt moralische Schuld und unrechtes Handeln in natürlichem modernem Deutsch wieder, ohne den Sinn unnötig auf einzelne Taten oder einen bestimmten dogmatischen Begriff einzuengen.
- source_word: in statera
  choice: auf der Waage
  rationale: Bewahrt das konkrete Bild des Abwägens.
- source_word: qui habitant in saeculo
  choice: Bewohner der Welt
  rationale: Gibt die im Kontext gemeinten Menschen der gegenwärtigen Weltzeit idiomatisch wieder.
- source_word: momentum puncti ... declinet
  choice: wohin der Ausschlag geht
  rationale: Versteht momentum puncti als Bewegung beziehungsweise Ausschlag des Waagenanzeigers und ubi als indirekte Frage nach der Richtung; vermeidet zugleich die ausdrückliche Ergänzung eines im Latein nicht genannten Zeigers.
theological_decisions:
- issue: Vergleich der Schuld Israels mit der Schuld der Weltbewohner
  choice: Beide Gruppen werden ohne erläuternde Wertung als Gegenstände desselben Wägens genannt.
  alternative: Den Ausschlag ausdrücklich zugunsten oder zulasten einer Gruppe deuten.
  rationale: Der Vers fordert den Vergleich, nennt dessen Ergebnis aber nicht vorweg; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am lateinischen Vergleichsbild, während »wohin der Ausschlag geht« die Schlussklausel natürlich und verständlich wiedergibt.
