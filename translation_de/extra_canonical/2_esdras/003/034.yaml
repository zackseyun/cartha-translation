  source_fidelity: Die Übersetzung gibt iniquitates, statera und die elliptische Verbindung »unsere Verfehlungen und die [Verfehlungen] der Bewohner der Welt« zutreffend wieder. »Wohin der Ausschlag geht« ist eine gut begründbare, idiomatische Auslegung von momentum puncti ... ubi declinet. Die Anmerkung wahrt zu Recht die verbleibende Unsicherheit der knappen lateinischen Waagenmetaphorik.
