theological_decisions:
- issue: Göttliche Verantwortlichkeit für die Preisgabe der Stadt
  choice: Die aktive Form „du gabst“ bleibt erhalten.
  alternative: Eine abschwächende passive oder zulassende Formulierung wie „du ließest deine Stadt fallen“.
  rationale: Der lateinische Text schreibt die Handlung ausdrücklich Gott zu; diese theologische Spannung darf nicht geglättet werden.
translation_notes:
  register: Knappe, würdevolle Standardsprache; die biblisch vertraute Wendung „in die Hände“ ist auch im heutigen Deutsch verständlich.
