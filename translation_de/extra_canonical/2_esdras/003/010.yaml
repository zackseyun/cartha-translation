source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est in uno casus corum, sicut Adac mors, sic et his diluuium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/010.yaml
  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: de
  text: 'Und es geschah: Ein Geschick traf sie alle. Wie Adam der Tod traf, so traf auch diese die Sintflut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus corum
  choice: ein einziges Geschick traf sie alle
  rationale: Der offenbar schwierige bzw. verderbte lateinische Wortlaut wird im Einklang mit dem Kontext als gemeinsames Geschick aller wiedergegeben; „ein einziges“ bewahrt den Gedanken von „uno“, ohne „dasselbe“ einzutragen.
- source_word: sicut Adac mors
  choice: wie Adam der Tod traf
  rationale: Gibt die knappe lateinische Vergleichskonstruktion idiomatisch und mit klarer Zuordnung wieder; „Adac“ wird als Textform für Adam verstanden.
- source_word: sic et his diluuium
  choice: so traf auch diese die Sintflut
  rationale: „his“ wird demonstrativ als „diese“ wiedergegeben und „et“ durch „auch“ bewahrt. „Sintflut“ bezeichnet im biblischen Kontext eindeutig die große Flut.
theological_decisions:
- issue: Verhältnis von Adams Tod und der Flutgeneration
  choice: Parallele zweier Gerichte als gemeinsames Geschick
  alternative: Identifizierung von Tod und Sintflut als genau dasselbe Gericht
  rationale: Das lateinische „sicut … sic et“ stellt eine Analogie her. Die Übersetzung wahrt diese Spannung, ohne beide Ereignisse theologisch gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eröffnende Formel „Und es geschah“ bewahrt den biblisch-erzählenden Ton; der zweite Satz bildet die knappe Parallelstruktur des Lateins nach.
