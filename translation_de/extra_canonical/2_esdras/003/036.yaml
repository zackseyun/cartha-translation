source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: homines quidem per nomina invenies servasse mandata tua, gentes autem non invenies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: de
  text: Einzelne Menschen wirst du zwar namentlich finden, die deine Gebote gehalten haben; Völker aber wirst du nicht finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  choice: einzelne Menschen
  rationale: „Menschen“ gibt den lateinischen Ausdruck wieder; „einzelne“ verdeutlicht den durch „per nomina“ bezeichneten Gegensatz zu ganzen Völkern, ohne ihn auf Männer zu verengen.
- source_word: quidem ... autem
  choice: zwar ... aber
  rationale: Das natürliche deutsche Gegensatzpaar bildet die lateinische Gegenüberstellung präzise ab.
- source_word: per nomina
  choice: namentlich
  rationale: Bewahrt den Gedanken, dass sich Gebotstreue bei konkret benennbaren Einzelpersonen finden lässt.
- source_word: servasse mandata tua
  choice: deine Gebote gehalten haben
  rationale: Idiomatiche und inhaltlich genaue Wiedergabe des lateinischen Perfektinfinitivs und von „mandata“.
- source_word: gentes
  choice: ganze Völker
  rationale: „Völker“ ist die direkte Entsprechung; „ganze“ macht den Gegensatz zu namentlich auffindbaren Einzelmenschen im Deutschen deutlich.
- source_word: non invenies
  choice: wirst du nicht finden
  rationale: Bewahrt Futur, direkte Anrede und die parallele Formulierung des Ausgangstextes.
theological_decisions:
- issue: Gebotstreue Einzelner gegenüber der Gebotstreue von Völkern
  choice: Der Satz stellt konkret benennbare Menschen ganzen Völkern gegenüber.
  alternative: „Männer“ gegenüber „Nationen“ oder eine absolute Aussage, dass niemand die Gebote gehalten habe
  rationale: Das Latein sagt „homines“ und räumt ausdrücklich ein, dass einzelne Gebotstreue gefunden werden können; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt die pointierte Gegenüberstellung, während „namentlich“ und „ganze Völker“ den knappen lateinischen Kontrast natürlich verständlich machen.
