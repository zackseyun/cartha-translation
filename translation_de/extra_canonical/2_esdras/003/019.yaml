- from: Du ließest die Tiefen erbeben und brachtest die Weltzeit in Aufruhr. Und deine Herrlichkeit durchschritt die vier Tore – Feuer, Erdbeben, Wind und Frost[a] –, damit du den Nachkommen Jakobs das Gesetz und dem Geschlecht Israels dein Gebot gäbest.
  to: Du ließest die Tiefen erbeben und brachtest die Weltzeit in Aufruhr. Und deine Herrlichkeit durchschritt die vier Tore – Feuer, Erdbeben, Wind und Frost –, damit du der Nachkommenschaft Jakobs das Gesetz gabst – und der Generation Israels.[a]
