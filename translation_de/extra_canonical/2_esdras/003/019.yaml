source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tremere fecisti abyssos, et conturbasti saeculum. Et transiit gloria tua portas quattuor, ignis et terrae motus et spiritus et gelus; ut dares semini Iacob legem, et generationi Israel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: de
  text: Du ließest die Tiefen erbeben und brachtest die Weltzeit in Aufruhr. Und deine Herrlichkeit durchschritt die vier Tore – Feuer, Erdbeben, Wind und Frost –, damit du der Nachkommenschaft Jakobs das Gesetz gabst – und der Generation Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „deine Herrlichkeit durchschritt die vier Tore – Feuer, Erdbeben, Wind und Frost“ ist textlich und bildlich schwierig. Die Übersetzung bewahrt die ungewöhnliche theophanische Bildsprache des lateinischen Textes, statt sie an den Exodusbericht anzugleichen. Der lateinische Ausgangstext endet nach „der Generation Israels“ ohne ein ausdrückliches Gegenstück zu „das Gesetz“; der Gedankenstrich bewahrt diesen elliptischen bzw. möglicherweise unvollständigen Schluss, statt ihn zu ergänzen.
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: die Tiefen
  rationale: Der Plural bewahrt die Mehrzahl des lateinischen Textes und gibt die kosmischen Abgründe natürlich wieder, ohne sie unnötig genauer zu bestimmen.
- source_word: saeculum
  choice: die Weltzeit
  rationale: „Weltzeit“ hält die mögliche zeitliche und kosmische Bedeutung von saeculum offen; „Welt“ allein würde die zeitliche Dimension verlieren.
- source_word: spiritus
  choice: Wind
  rationale: In der Reihe theophanischer Naturerscheinungen ist „Wind“ die naheliegende konkrete Bedeutung, während die grundsätzliche Bedeutungsbreite des Wortes nicht bestritten wird.
- source_word: gelus
  choice: Frost
  rationale: Entspricht der Naturerscheinung gelu/gelus und bewahrt die ungewöhnliche Abfolge des lateinischen Textes.
- source_word: semini Iacob
  choice: den Nachkommen Jakobs
  rationale: Gibt den kollektiven Sinn von semen in natürlichem modernem Deutsch wieder.
- source_word: generationi Israel
  choice: dem Geschlecht Israels
  rationale: Bewahrt die parallele kollektive Bezeichnung und den gehobenen biblischen Ton.
theological_decisions:
- issue: Die vier Tore und die Reihe der Naturerscheinungen
  choice: Die eigentümliche Aussage wird wörtlich genug als Durchschreiten der vier Tore wiedergegeben.
  alternative: Die Bildfolge an die Sinai-Theophanie harmonisieren oder „Tore“ sinngemäß umdeuten.
  rationale: Der lateinische Text ist bildlich und möglicherweise textkritisch schwierig. Die Übersetzung bewahrt diese Spannung, statt sie konfessionell oder narrativ aufzulösen.
- issue: Im lateinischen Ausgangstext fehlt nach „generationi Israel“ ein ausdrückliches Objekt.
  choice: „dein Gebot“ wird entsprechend der konsultierten englischen Fassung zur Vervollständigung des Parallelismus aufgenommen.
  alternative: Den Satz elliptisch mit „und dem Geschlecht Israels“ enden lassen.
  rationale: Der überlieferte Satz wirkt am Ende unvollständig. Die Ergänzung ergibt einen klaren Parallelismus zu „das Gesetz“, wird jedoch transparent als textlich schwieriger Punkt behandelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche kosmisch-theophanische Bildsprache bleibt erhalten; „ließest“, „durchschritt“ und „gäbest“ tragen den feierlichen Erzählton, ohne archaische Satzbildung zu übernehmen.
