  text: Denn ich sah die Verlassenheit Zions und den Überfluss derer, die in Babylon wohnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam
  choice: Denn
  rationale: Gibt den begründenden Anschluss an den vorhergehenden Satz natürlich wieder, ohne den Vers als selbstständigen Weil-Nebensatz erscheinen zu lassen.
- source_word: desertionem
  choice: Verwüstung
  rationale: Bezeichnet hier den zerstörten und verödeten Zustand Zions; „Verwüstung“ bewahrt sowohl die konkrete als auch die klagende Aussage.
- source_word: habundantiam
  choice: Überfluss
  rationale: Bewahrt den deutlichen Gegensatz zur Verwüstung Zions und bleibt näher am lateinischen Ausdruck als eine stärker deutende Wiedergabe wie „Wohlstand“.
- source_word: qui habitabant
  choice: die … lebten
  rationale: Natürliches modernes Deutsch für die Bewohner Babylons; das lateinische Imperfekt wird als andauernder Zustand in der Vergangenheit wiedergegeben.
