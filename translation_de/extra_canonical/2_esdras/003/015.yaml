source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: temporum finem solo secrete noctu. Et disposuisti ei testamentum aeternum, et dixisti ei ut non unquam derelinqueres semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/015.yaml
  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: de
  text: Und du hast mit ihm einen ewigen Bund geschlossen und gesagt, du würdest seine Nachkommen niemals verlassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: disposuisti ... testamentum aeternum
  choice: hast ... einen ewigen Bund geschlossen
  rationale: „Testamentum“ bezeichnet hier einen Bund; die natürliche deutsche Wendung „einen Bund schließen“ gibt den Sinn von „disponere“ im Zusammenhang treffend wieder.
- source_word: semen
  choice: Nachkommen
  rationale: Das lateinische Singularwort „Same“ wird kollektiv für die Nachkommenschaft gebraucht; „Nachkommen“ ist im modernen Deutsch klar und bewahrt diesen kollektiven Sinn.
theological_decisions:
- issue: Reichweite der Zusage an Abrahams „Samen“
  choice: seine Nachkommen
  alternative: seinen Samen
  rationale: Die Übersetzung lässt offen, wie die Nachkommenschaft heilsgeschichtlich zu bestimmen ist, und legt keine konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorangestellte Text „temporum finem solo secrete noctu“ wurde nicht aufgenommen, da er syntaktisch zum vorausgehenden Kontext gehört und auch die geprüfte englische Fassung den Vers mit „Et disposuisti“ beginnen lässt.
