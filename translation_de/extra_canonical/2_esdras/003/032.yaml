  naturalness: „Den Bundesschlüssen geglaubt“ ist im modernen Deutsch schwerfällig und idiomatisch weniger passend. „An die Bündnisse geglaubt“ ist natürlich und wahrt die mit dem lateinischen Dativ bei credere ausgedrückte Glaubensbeziehung.
