source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut alia gens cognovit te praeter Israhel? aut quae tribus crediderunt testamentis sicut haec Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: de
  text: Oder hat irgendein anderes Volk dich erkannt außer Israel? Oder welche Stämme haben an die Bündnisse geglaubt wie diese Stämme Jakobs?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die lateinische Schlussformulierung „sicut haec Iacob“ ist grammatisch auffällig. „Haec“ wird hier wahrscheinlich im Sinn von „diese [Stämme]“ auf „Stämme“ bezogen; formal ist auch eine sächliche Deutung möglich, die im Zusammenhang jedoch kaum verständlich ist.
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: gens
  choice: Volk
  rationale: „Volk“ ist im Deutschen für eine ethnisch-religiöse Gemeinschaft natürlicher als „Nation“ und entspricht hier dem Gegenüber Israel.
- source_word: cognovit
  choice: hat … erkannt
  rationale: Das Perfekt gibt das lateinische Perfekt wieder; „erkennen“ bewahrt den Beziehungs- und Offenbarungsgehalt von cognoscere, ohne ihn näher auszulegen.
- source_word: testamentis
  choice: den Bundesschlüssen
  rationale: Der Plural und der Dativ werden bewahrt. „Bundesschlüsse“ bezeichnet hier göttliche Bundesverfügungen deutlicher als das im modernen Deutsch missverständliche „Testamente“.
- source_word: crediderunt
  choice: haben … geglaubt
  rationale: Der Dativanschluss wird formal bewahrt. Die Wiedergabe lässt offen, ob vor allem Glauben, Vertrauen oder Annahme gemeint ist.
- source_word: haec Iacob
  choice: diese Stämme Jakobs
  rationale: Das unregelmäßige haec wird im Zusammenhang auf tribus zurückbezogen; Iacob wird als nicht flektierte Genitivform verstanden.
theological_decisions:
- issue: Bezeichnung der testamenta
  choice: Bundesschlüsse
  alternative: Bünde; Testamente
  rationale: „Bundesschlüsse“ bewahrt den Plural und den Bundesgedanken, ohne die Aussage auf eine bestimmte Anzahl oder heilsgeschichtliche Systematik festzulegen.
- issue: Bezug von haec Iacob
  choice: diese Stämme Jakobs
  alternative: dieses Jakob
  rationale: Der Kontext verlangt am ehesten einen Rückbezug auf die zuvor genannten Stämme. Da die lateinische Form grammatisch auffällig ist, wird die Unsicherheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Fragen und der Kontrast zwischen Israel und anderen Völkern bzw. Stämmen bleiben erhalten; die etwas sperrige zweite Frage folgt bewusst eng der lateinischen Vorlage.
