  source_fidelity: 'Die Satzstruktur und die Ergänzung „das Böse blieb“ entsprechen dem naheliegenden antithetischen Sinn und dem englischen Audit-Trail; die Fußnote macht jedoch korrekt kenntlich, dass das Subjekt von „mansit“ in der erhaltenen lateinischen Verszeile nicht ausdrücklich steht. Korrekturbedarf besteht bei „cum malignitate radicis“: Das Lateinische nennt die „Bosheit/Schlechtigkeit der Wurzel“, nicht unmittelbar eine „böse Wurzel“.'
