  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: de
  text: So wurde die Schwachheit dauerhaft, und das Gesetz war im Herzen des Volkes zusammen mit der Bosheit der Wurzel. Das Gute schwand, und das Böse blieb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich endet der erhaltene lateinische Text knapp mit: „und es blieb“; das Subjekt wird nicht ausdrücklich genannt. Aus dem Gegensatz zu „das Gute“ ist wahrscheinlich „das Böse“ zu ergänzen.'
    reason: Kennzeichnet die im deutschen Haupttext zur Verständlichkeit ergänzte, im überlieferten lateinischen Satzende nicht ausdrücklich genannte Bezugsgröße.
lexical_decisions:
- source_word: permanens infirmitas
  choice: die Schwachheit dauerhaft
  rationale: Gibt sowohl „infirmitas“ als Schwachheit als auch „permanens“ als bleibenden Zustand natürlich und eng am Lateinischen wieder.
- source_word: cum malignitate radicis
  choice: zusammen mit der bösen Wurzel
  rationale: Das lateinische Genitivattribut lautet wörtlicher „mit der Bosheit der Wurzel“; im Zusammenhang bezeichnet es jedoch die vom Bösen geprägte Wurzel. Die Formulierung folgt dieser naheliegenden Sinnstruktur, ohne ihr Verhältnis zum Gesetz näher zu deuten.
- source_word: discessit quod bonum est
  choice: Das Gute schwand
  rationale: „Schwand“ drückt das Weggehen beziehungsweise Verschwinden des Guten würdig und idiomatisch aus.
- source_word: et mansit
  choice: und das Böse blieb
  rationale: Das überlieferte lateinische Satzende nennt ausdrücklich nur das Bleiben; „das Böse“ wird aus dem Gegensatz zum Guten und aus der zuvor genannten bösen Wurzel ergänzt.
theological_decisions:
- issue: Verhältnis von Gesetz und böser Wurzel im Herzen
  choice: „zusammen mit der bösen Wurzel“
  alternative: „mit der Bosheit der Wurzel“
  rationale: Die Übersetzung bewahrt das gleichzeitige Vorhandensein beider Größen, ohne zu behaupten, das Gesetz selbst sei böse oder habe die böse Wurzel beseitigt.
- issue: Unausgesprochenes Subjekt am Versende
  choice: „das Böse“ im Haupttext ergänzt und durch eine Fußnote kenntlich gemacht
  alternative: „und es blieb“
  rationale: Der parallele Gegensatz „das Gute … das Böse“ ist im Kontext sehr wahrscheinlich, doch die knappe lateinische Form wird nicht verschwiegen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Das am Anfang der gelieferten Quellzeile stehende „sunt“ gehört syntaktisch zum vorausgehenden Vers und wurde daher für 3,22 nicht aufgenommen.
