source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dereliquisti autem unum ex his, id Noe cum domo sua, ex eo iustos omnes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: de
  text: 'Doch einen von ihnen ließest du übrig: Noach mit seinem Haus; von ihm stammen alle Gerechten ab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: ließest du übrig
  rationale: Gibt die direkte Anrede und den Sinn des Zurücklassens beziehungsweise Bewahrens nach dem Gericht natürlich und nah am lateinischen Text wieder.
- source_word: domo sua
  choice: mit seinem Haus
  rationale: Bewahrt den biblischen Kollektivbegriff für Noachs Hausgemeinschaft; im Kontext ist seine Familie eingeschlossen.
- source_word: ex eo
  choice: von ihm
  rationale: Bezieht das Pronomen entsprechend dem lateinischen Singular unmittelbar auf Noach.
- source_word: iustos omnes
  choice: alle Gerechten
  rationale: Erhält die umfassende und theologisch offene Formulierung des Ausgangstextes, ohne sie näher zu bestimmen.
theological_decisions:
- issue: Aussage über die Herkunft „aller Gerechten“
  choice: von ihm stammen alle Gerechten ab
  alternative: aus ihm gingen alle Gerechten hervor
  rationale: Die Übersetzung bewahrt die weitreichende Aussage des lateinischen Textes und lässt offen, ob vor allem leibliche Abstammung oder Noach als Ursprung der nachsintflutlichen gerechten Menschheit im Blick ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Präteritalform „ließest“ wahrt die feierliche direkte Gottesanrede, während „stammen … ab“ die knappe lateinische Ellipse verständlich ausdrückt.
