source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: de
  text: Doch ihr Lohn ist nicht erschienen, und ihre Mühe hat keine Frucht getragen. Denn ich zog durch die Völker und sah, dass sie im Überfluss lebten[a], obwohl sie sich nicht an deine Gebote erinnerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass es ihnen gut ging“.'
    reason: Das lateinische „abundantes“ kann allgemein Fülle, Wohlstand oder Gedeihen bezeichnen, ohne die genaue Art näher zu bestimmen.
lexical_decisions:
- source_word: merces
  choice: Lohn
  rationale: Die gewöhnliche Bedeutung von „merces“ wird direkt und im Zusammenhang mit „Mühe“ natürlich wiedergegeben.
- source_word: non conparuit
  choice: ist nicht sichtbar geworden
  rationale: Bewahrt das Bild eines Lohns, der nicht in Erscheinung getreten ist, ohne es als bloßes Ausbleiben umzudeuten.
- source_word: labor fructificavit
  choice: Mühe hat … Frucht getragen
  rationale: Erhält die Fruchtmetapher des lateinischen Verbs „fructificare“.
- source_word: pertransiens enim pertransivi
  choice: Denn ich zog durch
  rationale: Die lateinische figura etymologica lässt sich im Deutschen nicht ohne Schwerfälligkeit nachbilden; „zog durch“ gibt die nachdrückliche Durchquerung natürlich wieder.
- source_word: abundantes
  choice: im Überfluss lebten
  rationale: Das absolut gebrauchte Partizip bezeichnet ein Leben in Fülle beziehungsweise Wohlergehen; die Formulierung ist im modernen Deutsch natürlich und legt die Art des Überflusses nicht unnötig fest.
- source_word: non memorantes mandatorum tuorum
  choice: deine Gebote nicht im Gedächtnis behielten
  rationale: Gibt „memorari“ enger wieder als bloßes Nichtbefolgen und bewahrt so den Unterschied zwischen Erinnern und Gehorchen.
theological_decisions:
- issue: Wohlergehen der Völker trotz fehlender Erinnerung an Gottes Gebote
  choice: „obwohl sie deine Gebote nicht im Gedächtnis behielten“
  alternative: „ohne deine Gebote zu beachten“
  rationale: Die gewählte Fassung bewahrt die Spannung des Textes und erweitert „Erinnern“ nicht stillschweigend zu einer Aussage über Gehorsam.
- issue: Sichtbarwerden des Lohns
  choice: „ist nicht sichtbar geworden“
  alternative: „ist ausgeblieben“
  rationale: Die konkretere lateinische Aussage wird beibehalten, ohne zu entscheiden, ob der Lohn endgültig verweigert oder lediglich noch nicht offenbar geworden ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Fruchtmetapher und die Aussage über das Erinnern an die Gebote bleiben erhalten; die emphatische lateinische Wiederholung bei „pertransiens … pertransivi“ wird zugunsten natürlicher deutscher Syntax nicht mechanisch nachgebildet.
