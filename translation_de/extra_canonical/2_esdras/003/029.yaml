  revision_rationale: Die Revision korrigiert die Orthografie, ersetzt die abschwächende und unnatürliche Umschreibung von delinquentes durch „Sünder“ und glättet die deutsche Wiedergabe von excessit cor meum. Die Fußnote bewahrt die im lateinischen Ausdruck bestehende Bedeutungsweite, ohne eine Deutung als allein maßgeblich festzulegen.
