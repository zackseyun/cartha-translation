    issue: Getrenntschreibung von „hierher kam“
    rationale: „hierherkommen“ wird bei finitem Verb getrennt geschrieben.
  - severity: medium
    issue: „Menschen, die sich verfehlten“ für delinquentes
    rationale: Die Wendung ist unidiomatisch und schwächt die Bedeutung von delinquentes als „Sünder“ bzw. „Menschen, die sündigen“ ab.
  - severity: low
    issue: Schlussformulierung „geriet mein Herz außer sich“
    rationale: Die Formulierung ist verständlich, aber „mein Herz war außer sich“ ist im Deutschen idiomatischer und erhält die lexikalische Offenheit von excessit.
  revised_text: Als ich aber hierher kam und die zahllosen Freveltaten sah, sah meine Seele in diesem dreißigsten Jahr viele Sünder. Und mein Herz war außer sich.[a]
