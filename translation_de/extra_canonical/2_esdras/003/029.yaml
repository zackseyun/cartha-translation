revisions:
- from: Als ich aber hierherkam und die zahllosen Freveltaten sah, sah meine Seele in diesem dreißigsten Jahr viele Menschen, die sich verfehlten. Da geriet mein Herz außer sich.[a]
  to: Als ich aber hierher kam und die zahllosen Freveltaten sah, sah meine Seele in diesem dreißigsten Jahr viele Sünder. Und mein Herz war außer sich.[a]
  rationale: Die Revision korrigiert die Orthografie, ersetzt die abschwächende und unnatürliche Umschreibung von delinquentes durch „Sünder“ und glättet die deutsche Wiedergabe von excessit cor meum. Die Fußnote bewahrt die im lateinischen Ausdruck bestehende Bedeutungsweite, ohne eine Deutung als allein maßgeblich festzulegen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:05:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzfolge und die auffällige Wiederholung von „sah“ im Lateinischen grundsätzlich gut wieder. „Freveltaten“ trifft impietates angemessen, und „in diesem dreißigsten Jahr“ bewahrt die zeitliche Angabe. Bei delinquentes ist „Menschen, die sich verfehlten“ jedoch semantisch zu abgeschwächt und im Deutschen unnatürlich; das Partizip bezeichnet hier Menschen, die sündigen bzw. sich vergehen. Excessit cor meum ist mehrdeutig; eine Formulierung mit „außer sich“ kann diese Offenheit besser wahren, wenn sie idiomatisch gefasst wird.
  naturalness: '„hierherkam“ muss nach geltender deutscher Rechtschreibung getrennt geschrieben werden: „hierher kam“. „Menschen, die sich verfehlten“ klingt im heutigen Standarddeutsch unerquicklich und euphemistisch. „Mein Herz war außer sich“ ist als bildhafte, würdige Wiedergabe flüssiger als „geriet mein Herz außer sich“ und bewahrt den besonderen Ton.'
  terminology: „Freveltaten“ ist als Wiedergabe von impietates passend. „Sünder“ ist für delinquentes im biblischen Register die natürliche und hinreichend offene Entsprechung; sie legt keine über den Ausdruck hinausgehende theologische Deutung fest. Die Fußnote zu excessit cor meum soll die möglichen Richtungen „versagen/erschrecken“ und „überwallen“ weiterhin kenntlich machen.
  issues:
