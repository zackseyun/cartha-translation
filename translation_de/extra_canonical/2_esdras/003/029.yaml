source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Factum est autem cum venissem huc, et vidi impietates quorum non est numerus, et delinquentes multos vidit anima mea hoc tricesimo anno. et excessit cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: de
  text: Als ich aber hierher kam und die zahllosen Freveltaten sah, sah meine Seele in diesem dreißigsten Jahr viele Sünder. Und mein Herz war außer sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herz versagte mir.“ Möglich ist auch: „Mein Herz wallte über.“'
    reason: Das lateinische „excessit cor meum“ kann das Außer-sich-Geraten bzw. Versagen des Herzens bezeichnen; eine Deutung als Überwältigtsein oder Überwallen bleibt ebenfalls möglich.
lexical_decisions:
- source_word: impietates
  choice: Freveltaten
  rationale: Bezeichnet gottloses bzw. ruchloses Handeln; „Freveltaten“ ist im Deutschen würdig und konkreter als das ungebräuchliche „Gottlosigkeiten“.
- source_word: quorum non est numerus
  choice: zahllosen
  rationale: Gibt die lateinische Wendung „deren Zahl nicht [feststeht]“ natürlich und prägnant wieder.
- source_word: delinquentes
  choice: Menschen, die sich verfehlten
  rationale: Bewahrt den verbalen Charakter des Partizips und vermeidet, den Ausdruck vorschnell mit dem stärker kategorisierenden Substantiv „Sünder“ wiederzugeben.
- source_word: vidit anima mea
  choice: sah meine Seele
  rationale: Bewahrt die auffällige, semitisch geprägte Formulierung und die Wiederholung des Sehens im Ausgangstext.
- source_word: excessit cor meum
  choice: geriet mein Herz außer sich
  rationale: Gibt die Vorstellung wieder, dass das Herz seinen gewöhnlichen Zustand verlässt, und lässt Schock, Bestürzung und Überwältigung anklingen, ohne die mehrdeutige Wendung auf ein bloßes „Überfließen“ festzulegen.
theological_decisions:
- issue: Bedeutung von „excessit cor meum“
  choice: Da geriet mein Herz außer sich.
  alternative: 'Und mein Herz versagte mir; oder: Mein Herz wallte über.'
  rationale: Das lateinische „excessit“ kann ein Hinausgehen über den gewöhnlichen Zustand und damit Bestürzung oder Versagen ausdrücken. Die Hauptfassung wahrt diese Spannung; die Fußnote nennt die wichtigsten möglichen Sinnrichtungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von „sah“ und die Wendung „meine Seele“ bleiben als Merkmale des Ausgangstextes erhalten; ein neuer Satz vor der Schlusswendung sorgt für gute Lesbarkeit.
