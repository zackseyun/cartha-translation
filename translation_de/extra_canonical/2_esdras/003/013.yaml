source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: impietatem facere plus quam priores. Et factum est cum iniquitatem facerent coram te, elegisti tibi ex his unum, cui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: de
  text: 'Und es geschah: Als sie vor dir Unrecht taten, erwähltest du dir einen von ihnen, dem'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem facerent
  choice: Unrecht taten
  rationale: Gibt die wiederholte bzw. fortdauernde Ausübung von »iniquitas« natürlich und ohne unnötige dogmatische Zuspitzung wieder.
- source_word: coram te
  choice: vor dir
  rationale: Entspricht der räumlich-forensischen Wendung im Lateinischen und bewahrt den Gedanken, dass das Handeln in Gottes Gegenwart geschah.
- source_word: elegisti tibi
  choice: erwähltest du dir
  rationale: Bewahrt sowohl den bewussten Wahlakt als auch das reflexive »tibi«; »erwählen« ist würdig und im biblischen Zusammenhang geläufig.
- source_word: ex his unum
  choice: einen aus ihrer Mitte
  rationale: Vermeidet den unbelegten Zusatz »Mann« und gibt die Auswahl eines Einzelnen aus der zuvor genannten Gruppe idiomatisch wieder.
- source_word: cui
  choice: dem
  rationale: Der Relativsatz setzt im folgenden Vers fort; »dem« bildet diesen syntaktisch offenen Anschluss im Deutschen ab.
theological_decisions:
- issue: Identität und Geschlecht des Erwählten
  choice: »einen« ohne ergänzendes Substantiv
  alternative: »einen Mann«
  rationale: Das lateinische »unum« bezeichnet hier eine einzelne Person, nennt aber kein Substantiv. Ein ausdrückliches »Mann« wäre eine sachlich naheliegende, jedoch nicht im vorliegenden Wortlaut enthaltene Ergänzung.
- issue: Wiedergabe von »iniquitas«
  choice: »Unrecht«
  alternative: »Sünde« oder »Frevel«
  rationale: »Unrecht« erhält die moralische Breite des Ausdrucks, ohne ihn stärker zu theologisieren oder stilistisch zu verschärfen als der Kontext verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Satz bleibt wegen des abschließenden lateinischen Relativpronomens »cui« bewusst offen und führt in den nächsten Vers weiter.
