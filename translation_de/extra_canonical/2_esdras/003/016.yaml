lexical_decisions:
- source_word: segregasti tibi
  choice: sondertest du für dich aus
  rationale: Bewahrt sowohl das Aussondern als auch die ausdrückliche Zuordnung zu Gott.
- source_word: separasti
  choice: trenntest du ab
  rationale: Gibt das vom vorherigen Verb unterschiedene lateinische Wort wieder, ohne den nicht genannten Bezug der Trennung zu ergänzen.
- source_word: factus est
  choice: wurde
  rationale: Bewahrt den unvollständigen Satzschluss der überlieferten Passage.
theological_decisions:
- issue: Unterschiedliche Behandlung Jakobs und Esaus
  choice: Die beiden verschiedenen lateinischen Verben werden mit „aussondern“ und „abtrennen“ unterschieden.
  alternative: Beide Verben mit „aussondern“ oder „trennen“ wiedergeben.
  rationale: So bleibt die sprachliche und mögliche theologische Spannung des Quelltexts erhalten, ohne Esaus Trennung näher zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text beginnt und endet absichtlich als Satzfragment, entsprechend der vorgelegten lateinischen Versabgrenzung.
