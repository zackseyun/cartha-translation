  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des lateinischen Textes zuverlässig wieder: Gottes Weisung an Adam, dessen Übertretung, die unmittelbare Festsetzung des Todes für ihn und seine Nachkommenschaft sowie die daraus hervorgehende unzählbare Vielfalt menschlicher Gruppen. »Seine Nachkommen« ist eine kontextgerechte, idiomatische Wiedergabe von *in nationibus eius*, ohne eine weitergehende theologische Aussage einzutragen.'
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen würdigem biblischem Ton. Die Aufteilung in kurze Sätze unterstützt die Verständlichkeit. »Von ihm gingen … hervor« ist für *natae sunt ex eo* idiomatisch und erhält die Abstammungsaussage.
  terminology: »Gebot«, »übertrat«, »Tod«, »Nationen«, »Stämme«, »Völker« und »Geschlechter« sind sachgerecht. Die viergliedrige Aufzählung des Ausgangstextes bleibt erkennbar bewahrt. »Bestimmtest du … den Tod« gibt die göttliche Festsetzung zurück, ohne deren Mechanismus dogmatisch zu präzisieren.
