id: 2ES.3.7
reference: 2 Esdras 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: de
  text: Ihm gabst du dein Gebot; doch er übertrat es. Da bestimmtest du sogleich den Tod für ihn und seine Nachkommen. Von ihm gingen Nationen und Stämme, Völker und Geschlechter hervor, ohne Zahl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: diligentiam tuam
  choice: dein Gebot
  rationale: Im Zusammenhang bezeichnet die ungewöhnliche lateinische Wendung die Adam auferlegte Weisung beziehungsweise das Gebot. »Dein Gebot« gibt den Sinn klar wieder, ohne die im Ausgangstext nicht ausdrücklich vorhandene Betonung »das eine Gebot« hinzuzufügen.
- source_word: praeteriit eam
  choice: er übertrat es
  rationale: Das lateinische praeterire bezeichnet hier das Überschreiten beziehungsweise Verletzen des zuvor genannten Gebots; »übertreten« ist im Deutschen präzise und würdig.
- source_word: instituisti ... mortem
  choice: bestimmtest du ... den Tod
  rationale: »Bestimmen« bewahrt den Gedanken einer göttlichen Festsetzung, ohne genauer festzulegen, auf welche Weise der Tod eingesetzt oder verhängt wurde.
- source_word: in nationibus eius
  choice: seine Nachkommen
  rationale: Wörtlich etwa »in/unter seinen Geschlechtern/Völkern«; im Kontext ist die von Adam abstammende Menschheit gemeint. »Seine Nachkommen« ist natürlich und entspricht dem Sinn der Überlieferung.
- source_word: gentes et tribus, populi et cognationes
  choice: Nationen und Stämme, Völker und Geschlechter
  rationale: Die viergliedrige Aufzählung wird bewahrt. »Geschlechter« gibt cognationes als Abstammungs- oder Sippenverbände wieder.
- source_word: natae sunt ex eo
  choice: Von ihm gingen ... hervor
  rationale: Das lateinische »wurden aus ihm geboren« wird idiomatisch wiedergegeben; zugleich bleibt die Abstammungsaussage erhalten.
theological_decisions:
- issue: Einsetzung beziehungsweise Verhängung des Todes nach Adams Übertretung
  choice: »bestimmtest du sogleich den Tod für ihn und seine Nachkommen«
  alternative: »setztest du sogleich den Tod über ihn und seine Nachkommen ein«
  rationale: Die gewählte Formulierung wahrt die ausdrückliche göttliche Festsetzung und die unmittelbare Folge der Übertretung, ohne eine über den Text hinausgehende Theorie zur Weitergabe von Schuld oder Sterblichkeit einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem biblischem Register. Die Satzfolge wurde zur besseren Lesbarkeit gegliedert; die parallele Völkeraufzählung und die theologische Spannung zwischen menschlicher Übertretung und göttlicher Todesbestimmung bleiben erhalten.
