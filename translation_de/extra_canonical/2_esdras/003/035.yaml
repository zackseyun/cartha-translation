base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: de
  text: Oder wann haben die Bewohner der Erde nicht vor deinen Augen gesündigt? Oder welches Volk hat deine Gebote so gehalten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in conspectu tuo
  choice: vor deinen Augen
  rationale: Gibt die räumlich-ethische Bildsprache des Lateinischen natürlich und würdevoll wieder.
- source_word: qui habitant terram
  choice: die Bewohner der Erde
  rationale: Bewahrt den allgemeinen Bezug auf alle Menschen, die auf der Erde wohnen, in knapper deutscher Form.
- source_word: quae gens
  choice: welches Volk
  rationale: „Volk“ ist im Kontext natürlicher als „Nation“ und deckt den Sinn von gens angemessen ab.
- source_word: sic observavit mandata tua
  choice: hat deine Gebote so gehalten
  rationale: „Gehalten“ ist die geläufige biblische Wiedergabe für das treue Befolgen von Geboten; „so“ bewahrt das ausdrücklich vorhandene sic und seine mögliche rück- oder graduelle Beziehung.
theological_decisions:
- issue: Universalität menschlicher Sünde
  choice: Die rhetorische Frage bleibt uneingeschränkt formuliert.
  alternative: Eine abschwächende Wiedergabe wie „kaum jemand“ oder „welches Volk hat alle deine Gebote gehalten?“
  rationale: Der lateinische Text fragt allgemein, wann die Erdbewohner nicht gesündigt hätten; eine ausdrückliche Einschränkung oder Ergänzung wäre nicht quellengestützt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die beiden parallelen rhetorischen Fragen und die Spannung des lateinischen „sic“ bleiben erhalten.
