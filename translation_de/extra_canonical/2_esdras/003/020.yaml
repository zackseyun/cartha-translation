  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: de
  text: Doch du nahmst ihnen das böse Herz nicht weg, damit dein Gesetz in ihnen Frucht bringe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cor malignum
  choice: das böse Herz
  rationale: Gibt die lateinische Wendung formal und verständlich wieder; „Herz“ bezeichnet hier das innere Zentrum des Wollens und Handelns.
- source_word: non abstulisti ab eis
  choice: du nahmst ihnen … nicht weg
  rationale: Natürliches modernes Deutsch, das die Bedeutung des lateinischen Ausdrucks genau bewahrt.
- source_word: ut faceret … fructum in eis
  choice: damit dein Gesetz in ihnen Frucht brächte
  rationale: Folgt der im überlieferten Zusammenhang und in der konsultierten Fassung bezeugten Zweckkonstruktion und erhält das Bild des Fruchtbringens.
theological_decisions:
- issue: Gottes Handeln gegenüber dem bösen Herzen
  choice: 'Die Aussage bleibt als direkte Feststellung formuliert: Gott nahm es ihnen nicht weg.'
  alternative: Eine abschwächende Wiedergabe wie „du ließest zu, dass ihr Herz böse blieb“
  rationale: Die direkte Form bewahrt die theologische Spannung des lateinischen „non abstulisti“, ohne sie durch eine erklärende Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende „Doch“ gibt den fortführenden Gegensatz von „Et“ im Kontext idiomatisch wieder. Das isolierte „diligentiam“ am Beginn des bereitgestellten Ausschnitts gehört syntaktisch zum vorausgehenden Text und wurde daher nicht in diesen Vers aufgenommen.
