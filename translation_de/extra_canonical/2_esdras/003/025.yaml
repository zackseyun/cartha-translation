- from: Und so geschah es viele Jahre lang. Und die Bewohner der Stadt verließen sie,
  to: Und dies geschah viele Jahre lang. Und die in der Stadt wohnten, verließen sie,
  rationale: „Dies“ gibt hoc genauer wieder. Die Umschreibung „die in der Stadt wohnten“ folgt der lateinischen Personenbeschreibung, während „verließen sie“ den impliziten Bezug auf die Stadt beibehält. Das Schlusskomma bleibt erhalten, da der Satz im folgenden Vers fortgesetzt wird.
