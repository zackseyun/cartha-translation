  yaml_path: translation/extra_canonical/2_esdras/003/025.yaml
  text: And this happened for many years. And those who lived in the city forsook it,
translation:
  language: de
  text: Und dies geschah viele Jahre lang. Und die in der Stadt wohnten, verließen sie,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est hoc annis multis
  choice: so geschah es viele Jahre lang
  rationale: Gibt die Dauerangabe und das relativ allgemeine lateinische factum est eng und zugleich natürlich wieder.
- source_word: dereliquerunt
  choice: verließen sie
  rationale: Der lateinische Text nennt kein ausdrückliches Objekt; das feminine Pronomen bezieht sich naheliegend auf die Stadt. „Verließen“ wahrt den konkreten Sinn, ohne das im Lateinischen nicht vorhandene „sündigten“ einzutragen.
- source_word: qui habitabant civitatem
  choice: die Bewohner der Stadt
  rationale: Idiomatiche deutsche Wiedergabe der im gereinigten lateinischen Text ungewöhnlichen Konstruktion; gemeint sind diejenigen, die in der Stadt wohnten.
theological_decisions:
- issue: Mögliche moralische Deutung von dereliquerunt
  choice: verließen sie
  alternative: verließen/vernachlässigten sie; sündigten
  rationale: Der Vers sagt ausdrücklich dereliquerunt, nicht peccaverunt. Deshalb wird keine zusätzliche moralisch-theologische Aussage eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Und“ bildet die parataktische Struktur des lateinischen Textes ab; das abschließende Komma signalisiert den fortlaufenden Satz des nächsten Versabschnitts.
