  text: quoniam vidi quomodo sustines eos peccantes et pepercisti impie agentibus, et perdidisti populum tuum et conservasti inimicos tuos, et non significasti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: de
  text: Denn ich sah, wie du diejenigen, die sündigen, erträgst und diejenigen, die gottlos handeln, verschont hast, dein Volk aber vernichtet und deine Feinde bewahrt hast und nicht deutlich gemacht hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das lateinische „und“ vor „dein Volk aber vernichtet“ kann auch rein additiv verstanden werden: „und dein Volk vernichtet und deine Feinde bewahrt hast“ statt „dein Volk aber vernichtet ...“.'
    reason: Das lateinische et kann hier sowohl additiv als auch im Kontext gegensätzlich aufgefasst werden.
lexical_decisions:
- source_word: sustines
  choice: du ... erträgst
  rationale: Gibt das lateinische Präsens wieder und bewahrt den Gegensatz zu den folgenden Perfektformen.
- source_word: eos peccantes
  choice: die Sünder
  rationale: Natürliche deutsche Wiedergabe der substantivierten lateinischen Partizipialfügung.
- source_word: impie agentibus
  choice: die, die gottlos handeln
  rationale: Bewahrt den handlungsbezogenen Sinn von agere und gibt impie verständlich und würdig mit „gottlos“ wieder.
- source_word: pepercisti
  choice: verschont hast
  rationale: Das Perfekt bezeichnet eine bereits vollzogene Schonung und wird nicht zum Präsens eingeebnet.
- source_word: perdidisti
  choice: vernichtet ... hast
  rationale: Gibt die starke Aussage von perdere und ihren vollendeten Charakter wieder.
- source_word: conservasti
  choice: bewahrt hast
  rationale: Entspricht dem Sinn von conservare, ohne eine zusätzliche Deutung wie „gerettet“ einzutragen.
- source_word: non significasti
  choice: nicht deutlich gemacht hast
  rationale: Bewahrt die auffällige, im vorliegenden Quelltext ohne genanntes Objekt endende Aussage, statt ihren Inhalt aus einem möglichen Fortgang zu ergänzen.
theological_decisions:
- issue: Gottes unterschiedlicher Umgang mit Sündern, seinem Volk und seinen Feinden
  choice: Die anklagende Spannung bleibt unverändert stehen.
  alternative: Den Gegensatz durch eine erklärende oder rechtfertigende Ergänzung abschwächen.
  rationale: Der Vers formuliert Esras Klage; der Quelltext bietet an dieser Stelle keine theologische Auflösung.
- issue: Verknüpfung von Schonung und Vernichtung durch et
  choice: Im Haupttext wird der inhaltliche Gegensatz mit „aber“ sichtbar gemacht.
  alternative: Alle Glieder ausschließlich mit „und“ verbinden.
  rationale: Lateinisches et kann in diesem Zusammenhang adversativ verstanden werden; die wörtlich additive Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Wechsel vom Präsens zum Perfekt sowie der offene, unvollständige Schluss der lateinischen Vorlage bleiben erhalten.
