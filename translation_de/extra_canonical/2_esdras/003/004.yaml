revisions:
- from: 'Und ich sagte: »O Herrscher, Herr, hast du nicht von Anfang an gesprochen, als du die Erde formtest – und zwar du allein – und dem Staub gebotest'
  to: 'Und ich sagte: »O Herrscher, Herr, hast du nicht am Anfang gesprochen, als du die Erde formtest – und dies allein tatest –, und dem Staub geboten'
  rationale: Die Fassung setzt beide koordinierten Handlungen ins Perfekt („hast ... gesprochen“ / „hast ... geboten“), wobei das Hilfsverb bei der zweiten Handlung ausgelassen wird. „Am Anfang“ passt zum punktuellen Schöpfungskontext. Die ergänzte finite Wiedergabe „tatest“ macht die elliptische Bezugnahme von et hoc solus im Deutschen verständlich, ohne den Sinn zu erweitern. Der Satz bleibt wie die Vorlage am Versende offen.
