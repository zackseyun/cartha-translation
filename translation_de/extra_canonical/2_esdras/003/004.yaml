  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: de
  text: 'Und ich sagte: »O Herrscher, Herr, hast du nicht am Anfang gesprochen, als du die Erde formtest – und dies allein tatest –, und dem Staub geboten'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O dominator domine
  choice: O Herrscher, Herr
  rationale: Bewahrt die ungewöhnliche doppelte Anrede und gibt sowohl dominator als auch domine wieder, ohne sie zu einer einzigen Gottesbezeichnung einzuebnen.
- source_word: ab initio
  choice: von Anfang an
  rationale: Entspricht dem zeitlichen Ausgangspunkt des lateinischen Ausdrucks und hält einen möglichen Anklang an die Schöpfungssprache offen.
- source_word: plasmasti
  choice: formtest
  rationale: Gibt das handwerkliche Formen oder Gestalten wieder und passt zur anschließenden Erwähnung des Staubs.
- source_word: et hoc solus
  choice: und zwar du allein
  rationale: Macht die emphatische Aussage natürlichen deutschen Lesern verständlich, ohne mehr zu bestimmen, als der knappe lateinische Ausdruck sagt.
- source_word: imperasti pulveri
  choice: dem Staub gebotest
  rationale: Bewahrt die Dativkonstruktion und die Vorstellung eines an den Staub gerichteten göttlichen Befehls.
theological_decisions:
- issue: Aussage über Gottes alleiniges Schöpfungshandeln
  choice: und zwar du allein
  alternative: und dies allein
  rationale: solus bezieht sich grammatisch am ehesten auf das angesprochene göttliche Gegenüber. Die Wiedergabe bewahrt die Aussage, dass Gott beim Formen der Erde allein handelte, ohne daraus eine weitergehende dogmatische Formulierung zu machen.
- issue: Verhältnis der Verben in der rhetorischen Frage
  choice: hast du nicht ... gesprochen ... und ... gebotest
  alternative: hast du nicht ... gesprochen ... und ... geboten
  rationale: Das lateinische dixisti und imperasti stehen als koordinierte finite Verben. Die gewählte leicht gehobene Konstruktion hält beide Handlungen parallel und bewahrt zugleich den unabgeschlossenen Anschluss an den folgenden Vers.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht gehobenem biblischem Ton. Der Vers bleibt entsprechend der Quelle syntaktisch offen, da der Befehl an den Staub erst im folgenden Text inhaltlich ergänzt wird.
