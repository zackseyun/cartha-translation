  text: nothing to anyone about how this way should be abandoned[a]. Does Babylon do better than Zion?
translation:
  language: de
  text: niemandem etwas darüber, wie dieser Weg verlassen werden soll. Vollbringt Babylon Besseres als Zion?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Handelt Babylon besser als Zion?'
    reason: „Facit meliora“ kann sowohl näher an der Form als „vollbringt Besseres“ als auch idiomatischer als „handelt besser“ wiedergegeben werden.
lexical_decisions:
- source_word: nihil nemini
  choice: niemandem etwas
  rationale: Die doppelte Verneinung steht in einem von Vers 30 abhängigen Satz („du hast nicht deutlich gemacht …“). Im natürlichen Deutschen ergibt sich daher „niemandem etwas“, ohne die negative Aussage des Gesamtzusammenhangs aufzuheben.
- source_word: via haec
  choice: dieser Weg
  rationale: Direkte und im Deutschen natürliche Wiedergabe; die mögliche bildliche Bedeutung von „Weg“ bleibt offen.
- source_word: debeat derelinqui
  choice: verlassen werden soll
  rationale: Bewahrt die passive Konstruktion und den verpflichtenden beziehungsweise notwendigen Beiklang von „debeat“, ohne ihn stärker festzulegen.
- source_word: facit meliora
  choice: vollbringt Besseres
  rationale: Gibt die wörtliche Struktur „tut/macht bessere Dinge“ idiomatisch und würdig wieder. Zugleich bleibt offen, ob konkrete Taten oder ein allgemeines besseres Handeln gemeint sind.
theological_decisions:
- issue: Vergleich zwischen Babylon und Zion
  choice: Vollbringt Babylon Besseres als Zion?
  alternative: Handelt Babylon besser als Zion?
  rationale: Die Hauptfassung folgt dem substantivisch gebrauchten Komparativ „meliora“ enger und lässt die provokante theologische Spannung des Vergleichs bestehen, ohne Babylon moralisch oder heilsgeschichtlich näher zu bestimmen.
- issue: Satzfragment am Versanfang
  choice: Beginn mit kleingeschriebenem „niemandem“
  alternative: Nichts für niemanden darüber …
  rationale: Der lateinische Text setzt syntaktisch den vorherigen Vers fort. Die Kleinschreibung macht diese Versgrenzen übergreifende Abhängigkeit sichtbar und vermeidet einen künstlich vollständigen deutschen Satz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der ungewöhnliche fragmentarische Beginn wird beibehalten, weil der lateinische Satz über die Versgrenze hinweg aus Vers 30 weiterläuft.
