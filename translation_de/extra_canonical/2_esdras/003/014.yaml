lexical_decisions:
- source_word: nomen erat Abraham
  choice: dessen Name Abraham war
  rationale: Gibt die lateinische Nominalkonstruktion im Zusammenhang natürlich und genau wieder; der relative Anschluss entspricht dem überlieferten Satzfragment.
- source_word: dilexisti
  choice: liebtest
  rationale: Bewahrt die direkte Bedeutung von diligere im Präteritum und die Anrede an Gott.
- source_word: demonstrasti ei
  choice: offenbartest ihm
  rationale: Im religiösen Kontext bezeichnet demonstrare hier ein kundtuendes Zeigen; „offenbartest“ ist idiomatisch und lässt den im folgenden Text zu erwartenden Gegenstand offen.
