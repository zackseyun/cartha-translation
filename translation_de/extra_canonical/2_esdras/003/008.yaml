id: 2ES.3.8
reference: 2 Esdras 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: de
  text: Und jedes Volk ging nach seinem eigenen Willen; sie handelten gottlos vor dir und verachteten dich, und du hieltest sie nicht davon ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ambulauit ... in uoluntate sua
  choice: ging seinen eigenen Weg
  rationale: Die natürliche deutsche Wendung bewahrt das Bild des Gehens und gibt zugleich wieder, dass jedes Volk nach seinem eigenen Willen lebte.
- source_word: impie agebant
  choice: handelte gottlos
  rationale: „Gottlos handeln“ gibt das religiös-moralische Gewicht von „impie agere“ klar und würdig wieder.
- source_word: spernebant
  choice: verachtete dich
  rationale: Das im Lateinischen ohne wiederholtes Objekt stehende Verb bezieht sich im Zusammenhang auf Gott; „verachten“ entspricht der starken Geringschätzung von „spernere“.
- source_word: non prohibuisti eos
  choice: du hindertest sie nicht daran
  rationale: Diese idiomatische Formulierung gibt das Unterlassen eines Eingreifens wieder, ohne auszusagen, Gott habe ihr Tun gebilligt.
theological_decisions:
- issue: Gottes Nichteingreifen gegenüber dem gottlosen Handeln der Völker
  choice: doch du hindertest sie nicht daran
  alternative: doch du verboten es ihnen nicht
  rationale: „Prohibere“ kann „hindern“ oder „abwehren“ bedeuten. Die gewählte Fassung wahrt die Spannung, dass Gott ihr Handeln nicht aufhielt, ohne daraus Zustimmung oder fehlendes Gebot abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Wechsel vom singularischen „jedes Volk“ zu den pluralischen Pronomen des lateinischen Textes wird im Deutschen durch den Singular geglättet; der Sinn bleibt unverändert.
