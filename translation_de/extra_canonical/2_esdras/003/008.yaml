revisions:
- from: Und jedes Volk ging seinen eigenen Weg[a], handelte gottlos vor dir und verachtete dich; doch du hindertest sie nicht daran.
  to: Und jedes Volk ging nach seinem eigenen Willen; sie handelten gottlos vor dir und verachteten dich, und du hieltest sie nicht davon ab.
  rationale: Die Revision stellt den eigenen Willen ausdrücklich wieder her, entfernt die nicht im Ausgangstext markierte adversative Nuance und bewahrt die pluralischen Folgeprädikate sowie das plurale Objekt des lateinischen Satzes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:05:10Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von „impie agebant“, „coram te“, „spernebant“ und „non prohibuisti eos“ ist grundsätzlich zutreffend. „Ging seinen eigenen Weg“ ist jedoch gegenüber „ambulauit ... in uoluntate sua“ zu deutend, weil der eigene Wille im Haupttext nicht mehr ausdrücklich erscheint. Das adversative „doch“ hat im Lateinischen keine Entsprechung und sollte nicht ergänzt werden.
  naturalness: „Nach seinem eigenen Willen gehen“ ist im modernen Standarddeutsch verständlich und bewahrt sowohl das Bild des Gehens als auch den Bezug auf den eigenen Willen. Der Wechsel zu „sie handelten ... verachteten“ bildet die pluralischen lateinischen Verben und das folgende „eos“ natürlich ab.
  terminology: „Gottlos handeln“ und „dich verachten“ treffen das religiös-moralische Gewicht von „impie agere“ und die Geringschätzung von „spernere“ angemessen. „Hieltest sie nicht davon ab“ gibt „non prohibuisti eos“ idiomatisch und ohne theologische Zusatzdeutung wieder.
  issues:
  - severity: medium
    issue: „ging seinen eigenen Weg“ ersetzt den im Ausgangstext ausdrücklich genannten eigenen Willen durch eine allgemeinere Redewendung.
    rationale: Die Formulierung kann zwar eigensinniges Handeln nahelegen, lässt aber „in uoluntate sua“ nicht hinreichend transparent erkennen. Eine Fassung mit „eigenem Willen“ ist ebenso natürlich und quellennäher.
  - severity: low
    issue: „doch“ fügt einen nicht markierten Gegensatz hinzu.
    rationale: Das lateinische „et ... et ... et“ reiht die Aussagen ohne adversative Konjunktion an. „Und“ wahrt diese Verknüpfung.
  revised_text: Und jedes Volk ging nach seinem eigenen Willen; sie handelten gottlos vor dir und verachteten dich, und du hieltest sie nicht davon ab.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „ging in seinem eigenen Willen“.'
    reason: Bewahrt die im Lateinischen ungewöhnliche Präposition „in“; der Haupttext gibt die Wendung idiomatisch wieder.
  revision_rationale: Die Revision stellt den eigenen Willen ausdrücklich wieder her, entfernt die nicht im Ausgangstext markierte adversative Nuance und bewahrt die pluralischen Folgeprädikate sowie das plurale Objekt des lateinischen Satzes.
