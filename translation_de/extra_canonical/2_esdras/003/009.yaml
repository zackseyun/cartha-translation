source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iterum autem in tempore induxisti diluuium super habitantes saeculum, et perdidisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/009.yaml
  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: de
  text: Wiederum brachtest du zu seiner Zeit die Flut über die Bewohner der Welt und vernichtetest sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  choice: Wiederum
  rationale: Gibt die erneute göttliche Handlung im Fortgang der Rede knapp und würdig wieder; das schwach weiterführende „autem“ muss im Deutschen nicht eigens markiert werden.
- source_word: in tempore
  choice: zu seiner Zeit
  rationale: Bewahrt den zeitlichen Ausdruck, ohne das im Deutschen unnatürliche „in der Zeit“ zu verwenden. Die Wendung wird nicht näher theologisch festgelegt.
- source_word: induxisti diluuium
  choice: ließest du … die Flut … kommen
  rationale: Natürliches Deutsch für das Veranlassen bzw. Heranführen der Flut; „die Flut“ bezeichnet hier die Sintflut.
- source_word: super habitantes saeculum
  choice: über die Bewohner der Welt
  rationale: „saeculum“ hat hier räumlich-kosmischen Sinn („Welt“), während „habitantes“ als substantiviertes „Bewohner“ wiedergegeben wird.
- source_word: perdidisti eos
  choice: vernichtetest sie
  rationale: Gibt die starke Bedeutung von „perdere“ und den vollständigen Untergang der genannten Bewohner wieder.
theological_decisions:
- issue: Göttliches Handeln bei der Flut
  choice: ließest du … kommen
  alternative: brachtest du die Flut
  rationale: Die Formulierung wahrt die Aussage, dass Gott die Flut herbeiführte, ohne über den im lateinischen Verb enthaltenen Kausativ hinaus die Art seines Handelns näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede. Die Verbformen „ließest“ und „vernichtetest“ passen zum gehobenen Gebetskontext, bleiben jedoch gut verständlich.
