  text: in omnibus facientes sicut fecit Adam et omnes generationes eius; utebantur enim et ipsi cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/026.yaml
  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: de
  text: In allem handelten sie so, wie Adam und alle seine Nachkommen gehandelt hatten; denn auch sie hatten ein böses Herz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in omnibus facientes
  choice: In allem handelten sie
  rationale: Gibt die umfassende Wendung natürlich und zugleich quellennah wieder; das Partizip wird für einen flüssigen deutschen Satz finit aufgelöst.
- source_word: omnes generationes eius
  choice: alle seine Nachkommen
  rationale: Lateinisch generationes bezeichnet hier die auf Adam folgenden Menschengeschlechter; „Nachkommen“ ist im heutigen Deutsch klarer als „Generationen“.
- source_word: utebantur ... cor malignum
  choice: sie hatten ein böses Herz
  rationale: Das spätlateinische uti mit einer Eigenschaft oder einem Zustand kann „haben/besitzen“ bedeuten. „Gebrauchten ein böses Herz“ würde ein bewusstes instrumentelles Nutzen nahelegen und wäre im Deutschen unnatürlich.
theological_decisions:
- issue: Charakter des bösen Herzens
  choice: ein böses Herz
  alternative: das böse Herz / machten vom bösen Herzen Gebrauch
  rationale: Der unbestimmte Ausdruck folgt cor malignum ohne Artikel und wahrt die Aussage als Zustand der Betroffenen, ohne eine ausgearbeitete Lehre von einem bestimmten ererbten „bösen Herzen“ in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „handelten/gehandelt“ bewahrt die Struktur und den Vergleich des lateinischen Textes, ohne unnötige Auslegung.
