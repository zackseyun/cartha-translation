    issue: „ehrfürchtigen Worten“ für *uerba timorata*
    rationale: „Ehrfürchtig“ kann im Kontext zwar naheliegen, bezeichnet aber vor allem Verehrung und schwächt bzw. ersetzt die im lateinischen Wort enthaltene Furcht/Ängstlichkeit. Damit wird die Ambiguität zu stark zugunsten einer theologischen Kontextdeutung aufgelöst.
  revised_text: Und mein Geist wurde sehr aufgewühlt, und ich begann, Worte voller Furcht an den Höchsten zu richten.
