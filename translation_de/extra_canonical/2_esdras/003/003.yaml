revisions:
- from: Da wurde mein Geist heftig aufgewühlt, und ich begann, mit ehrfürchtigen Worten zum Höchsten zu sprechen.
  to: Und mein Geist wurde sehr aufgewühlt, und ich begann, Worte voller Furcht an den Höchsten zu richten.
  rationale: Die Revision ersetzt die einengende Deutung „ehrfürchtig“ durch „voller Furcht“. So bleibt der affektive Gehalt von *timorata* erhalten, ohne die Worte als furchterregend zu verstehen oder eine bestimmte religiöse Auslegung vorzugeben. Die übrige Formulierung bleibt quellennah und natürlich.
