source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uentilatus est spiritus meus ualde, et coepi loqui ad altissimum uerba timorata,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: de
  text: Und mein Geist wurde sehr aufgewühlt, und ich begann, Worte voller Furcht an den Höchsten zu richten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uentilatus est spiritus meus ualde
  choice: mein Geist wurde heftig aufgewühlt
  rationale: Das lateinische Passiv bezeichnet hier eine starke innere Erregung. „Heftig aufgewühlt“ ist im modernen Deutschen natürlich und bewahrt die Intensität von „ualde“.
- source_word: uerba timorata
  choice: mit ehrfürchtigen Worten
  rationale: „timorata“ beschreibt Worte, die von Furcht oder Scheu geprägt sind. Im Kontext einer Anrede an den Höchsten gibt „ehrfürchtig“ diese Haltung wieder, ohne das missverständliche „ängstliche Worte“ zu erzwingen.
- source_word: altissimum
  choice: zum Höchsten
  rationale: Die substantivierte Gottesbezeichnung wird traditionsgemäß und quellennah mit „der Höchste“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „timorata“ in der Rede zu Gott
  choice: ehrfürchtige Worte
  alternative: ängstliche / furchtsame Worte
  rationale: Die Formulierung kann persönliche Angst oder religiöse Scheu ausdrücken. „Ehrfürchtig“ wahrt den Gottesbezug und lässt die spannungsvolle, von Furcht geprägte Haltung erkennen, ohne die Worte als erschreckend zu charakterisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am lateinischen Ablauf, klingt aber idiomatisch; „Geist“ bezeichnet hier das innere Wesen beziehungsweise Gemüt.
