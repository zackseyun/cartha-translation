translation:
  language: de
  text: 'Israel wäre gewiss nicht schon zu Anfang aufgesucht worden, um aus dem Land Ägypten, aus dem Haus der Knechtschaft, gerettet zu werden, wenn es nicht zu Gott geseufzt und über die Gewaltherrschaft seiner Sklaverei geklagt hätte.


    Weiter steht in den Psalmen geschrieben:


    »Ich bin völlig erschöpft von meinem Seufzen.

    Nacht für Nacht überflute ich mein Bett

    und tränke mein Lager mit meinen Tränen.

    Inmitten all meiner Feinde bin ich alt geworden.

    Weicht von mir, ihr alle, die ihr Böses tut!

    Denn seht: Der Herr hat mein lautes Weinen gehört,

    und der Herr hat mein Gebet angenommen.« (Psalm 6,7–10)[a]


    Wenn wir umkehren, wird Gott uns gewiss erhören – er, der geduldig und reich an Erbarmen ist. Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit. Amen!


    Die Auslegung über die Seele'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verszählung folgt hier der in heutigen deutschen Bibeln üblichen Zählung Psalm 6,7–10; die englische Vorlage nennt Psalm 6,6–9. Der Wortlaut wird nach der im Werk überlieferten Zitatform wiedergegeben und kann von modernen Bibelübersetzungen abweichen.
    reason: Die Vorlage und moderne deutsche Ausgaben zählen die Verse unterschiedlich; außerdem ist das Zitat keine wörtliche Übernahme einer bestimmten modernen deutschen Bibelausgabe.
lexical_decisions:
- source_word: visited
  choice: aufgesucht
  rationale: Bewahrt den biblischen Gedanken eines rettenden göttlichen Eingreifens, ohne ihn enger als »heimgesucht« oder ausschließlich als »befreit« festzulegen.
- source_word: house of bondage
  choice: Haus der Knechtschaft
  rationale: Erhält die traditionsreiche Exodus-Formulierung und bleibt im modernen Deutsch verständlich.
- source_word: tyranny of its slavery
  choice: Gewaltherrschaft seiner Sklaverei
  rationale: Gibt sowohl den Zwangscharakter der Herrschaft als auch den Zustand der Versklavung wieder.
- source_word: repent
  choice: umkehren
  rationale: Bezeichnet eine grundlegende Hinwendung zu Gott und vermeidet die Verengung auf bloße Reuegefühle.
- source_word: patient and richly merciful
  choice: geduldig und reich an Erbarmen
  rationale: Bewahrt beide göttlichen Eigenschaften in würdigem, natürlichem Deutsch.
theological_decisions:
- issue: Bedingungszusammenhang zwischen Israels Klage und Gottes Rettung
  choice: 'Die irreale Bedingung bleibt ausdrücklich erhalten: Ohne Israels Seufzen und Klagen wäre es nicht aufgesucht worden.'
  alternative: Den Satz allgemein als Aussage über Gottes unbedingte Initiative wiederzugeben.
  rationale: Der überlieferte Wortlaut stellt die Klage Israels als Voraussetzung des rettenden Eingreifens dar; diese theologische Spannung darf nicht geglättet werden.
- issue: Gottes Reaktion auf Umkehr
  choice: »wird Gott uns gewiss erhören«
  alternative: »kann Gott uns erhören« oder »wird Gott uns vergeben«
  rationale: Die Gewissheit des Textes wird bewahrt, ohne »listen to« eigenmächtig auf Vergebung zu verengen.
- issue: Doxologie
  choice: »Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit«
  alternative: »Dem sei Ehre in alle Ewigkeit«
  rationale: Die pronominale Rückbindung auf Gott bleibt erhalten; die Formulierung entspricht dem feierlichen Schlussregister.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit biblischem Klang. Die Übersetzung ist vorläufig, da eine direkte Prüfung des koptischen Textes noch aussteht und der Entwurf auf dem bereitgestellten gemeinfreien englischen Zeugnis beruht. Navigation, Kontaktdaten und Werbehinweis der Website wurden als nicht zum Werk gehörendes Material ausgeschlossen.
