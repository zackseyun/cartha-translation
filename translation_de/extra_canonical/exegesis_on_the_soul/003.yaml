  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: de
  text: 'Wenn sie jedoch erkennt, in welcher Not sie sich befindet, vor dem Vater aufschreit und umkehrt, wird der Vater sich ihrer erbarmen. Er wird bewirken, dass ihr Schoß sich vom äußeren Reich abwendet und wieder nach innen kehrt, sodass die Seele ihr gutes Wesen zurückgewinnt. Denn bei einer Frau verhält es sich nicht so: Der leibliche Schoß liegt innen wie die anderen inneren Organe des Körpers.


    Der Schoß der Seele hingegen liegt nach außen gewendet, wie die äußeren Geschlechtsteile des Mannes. Wenn nun der Schoß der Seele durch den Willen des Vaters nach innen gekehrt wird, wird er getauft und sogleich von der äußeren Verunreinigung gereinigt, die ihm aufgezwungen wurde – wie schmutzige [Kleider], die [in Wasser] eingeweicht und hin und her bewegt werden, bis der Schmutz verschwunden ist und sie sauber sind.[a] So besteht die Reinigung der Seele darin, dass sie die Erneuerung ihrer früheren Natur zurückgewinnt und zu sich selbst zurückkehrt.[b] Das ist ihre Taufe.


    Dann wird sie außer sich über sich selbst geraten. Wie eine Frau in den Wehen wird sie sich in der Stunde der Geburt winden und rasen. Weil sie jedoch weiblich ist, kann sie aus sich selbst kein Kind empfangen. Aus dem Himmel sandte der Vater ihr einen Mann – ihren Bruder, den Erstgeborenen. Da stieg der Bräutigam zur Braut hinab. Sie ließ ihre frühere Prostitution hinter sich und reinigte sich von den Verunreinigungen der Ehebrecher. Sie wurde sogar erneuert, um eine Braut zu werden. Sie reinigte sich im Brautgemach, erfüllte es mit Duft und saß dort, während sie ihren wahren Bräutigam erwartete. Sie lief nicht länger auf dem Marktplatz umher und schlief mit jedem, den sie begehrte. Stattdessen wartete sie beharrlich auf ihn: »Wann wird er kommen?« Zugleich fürchtete sie sich weiterhin vor ihm, denn sie wusste nicht, wie er aussah. Sie erinnerte sich auch nicht mehr an die Zeit, als sie aus dem Haus ihres Vaters gefallen war. Doch nach dem Willen des Vaters […] Und sie träumte von ihm
    wie eine Frau, die einen Mann liebt.[c]


    Dann aber stieg der Bräutigam, dem Willen des Vaters entsprechend, zu ihr in das vorbereitete Brautgemach hinab und schmückte es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen im zugrunde liegenden englischen Text ergänzte Wörter; eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Die editorischen Ergänzungssignale der Vorlage müssen sichtbar und erklärt bleiben.
  - marker: b
    text: Die englische Vorlage enthält an dieser Stelle leere eckige Klammern vor „ihrer früheren Natur“. Da kein ergänzbarer Wortlaut überliefert ist, wurden sie im Fließtext nicht als scheinbares Satzzeichen wiederholt; die Textlücke bleibt sachlich unsicher.
    reason: Die problematische leere Ergänzungsmarke wird transparent dokumentiert, ohne einen unverständlichen deutschen Satz zu erzeugen.
  - marker: c
    text: Vor „Und sie träumte von ihm“ weist die Vorlage eine Textlücke […] auf; der Zusammenhang zwischen den beiden Satzteilen ist daher unsicher.
    reason: Die Lücke unterbricht Syntax und Gedankengang und darf nicht stillschweigend überbrückt werden.
lexical_decisions:
- source_word: womb
  choice: Schoß
  rationale: „Schoß“ bewahrt die körperliche und zugleich bildhafte Bedeutung besser als das rein anatomische „Gebärmutter“ und lässt die durchgehende Metapher von Seele, Empfängnis und Geburt natürlich klingen.
- source_word: repents
  choice: kehrt um
  rationale: „Umkehren“ gibt die religiös-ethische Richtungsänderung wieder, ohne die Stelle unnötig mit späterer kirchlicher Terminologie festzulegen.
- source_word: good character
  choice: gutes Wesen
  rationale: „Wesen“ bezeichnet hier den wiedergewonnenen guten Zustand bzw. die Beschaffenheit der Seele; „Charakter“ wäre enger und moderner-psychologisch gefärbt.
- source_word: pollution / pollutions
  choice: Verunreinigung / Verunreinigungen
  rationale: Die Wortwahl erhält das Reinheitsmotiv und vermeidet das heute primär ökologische Verständnis von „Verschmutzung“.
- source_word: become mad at herself
  choice: außer sich über sich selbst geraten
  rationale: Die Formulierung bewahrt sowohl die heftige innere Erregung als auch den Rückbezug auf die Seele, ohne vorschnell eine klinische Bedeutung von „wahnsinnig“ einzutragen.
- source_word: prostitution
  choice: Prostitution
  rationale: Die direkte, würdige Bezeichnung erhält die Härte des sexuellen Bildfeldes; verhüllende Ausdrücke würden den Text abschwächen.
- source_word: having sex with
  choice: schlief mit
  rationale: Natürliches modernes Deutsch, das die sexuelle Aussage klar wiedergibt, ohne unnötig technisch oder vulgär zu wirken.
- source_word: adorned
  choice: schmückte
  rationale: „Schmücken“ entspricht dem Brautgemach-Motiv und lässt offen, worin das Ausschmücken bestand.
theological_decisions:
- issue: Taufe als innere Umkehr und Reinigung
  choice: Die Aussage „Das ist ihre Taufe“ bleibt ohne dogmatische Erläuterung stehen.
  alternative: Die Taufe ausdrücklich sakramental oder nur symbolisch deuten.
  rationale: Der Text verbindet Taufe, Reinigung und Wiederherstellung der Seele, entscheidet aber in diesem Ausschnitt nicht eindeutig über ein späteres sakramentales Verständnis.
- issue: Identität des Bräutigams und Erstgeborenen
  choice: Die Titel „Bruder“, „Erstgeborener“ und „Bräutigam“ werden bewahrt, ohne die Gestalt ausdrücklich zu identifizieren.
  alternative: Den Mann ausdrücklich als Christus bezeichnen.
  rationale: Eine Identifikation mag im weiteren Werk naheliegen, wird in der vorliegenden Passage jedoch nicht ausdrücklich vollzogen.
- issue: Geschlechtssymbolik der Seele
  choice: Die weibliche Personifikation und die körperliche Bildsprache werden unverändert erhalten.
  alternative: Die Aussagen geschlechtsneutralisieren oder allegorisch erklären.
  rationale: Die Spannung zwischen weiblicher Seele, nach außen gekehrtem Schoß und männlichem Bräutigam gehört wesentlich zur Argumentation des Textes.
- issue: Erzwungene äußere Verunreinigung
  choice: „die ihm aufgezwungen wurde“
  alternative: Die Verunreinigung als freiwillige Schuld der Seele formulieren.
  rationale: Die Vorlage verbindet zuvor Prostitution und Umkehr mit einer Verunreinigung, die zugleich als von außen erzwungen beschrieben wird; diese Spannung darf nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, aber nicht beschönigender Wiedergabe der sexuellen und körperlichen Metaphorik. Die weibliche Personifikation der Seele wird durchgehend mit „sie“, der Schoß grammatisch mit „er“ aufgenommen. Der Entwurf ist ausdrücklich vorläufig, da nur der angegebene gemeinfreie englische Zeuge vorliegt und die direkte Prüfung des koptischen Textes noch aussteht.
