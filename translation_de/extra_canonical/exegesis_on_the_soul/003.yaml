  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. „gutes Wesen“ ist hier etwas zu ontologisch und weniger treffend als „gute Wesensart“ für „good character“. Die bewusst fragmentarische Passage nach der Auslassung bleibt als solche erhalten.
  terminology: „Schoß“, „umkehren“, „Verunreinigung“, „Taufe“, „Erstgeborener“ und „Brautgemach“ sind angemessen. „Gute Wesensart“ gibt den ethisch-dispositionellen Sinn von „good character“ genauer wieder, ohne eine dogmatische Deutung einzutragen.
