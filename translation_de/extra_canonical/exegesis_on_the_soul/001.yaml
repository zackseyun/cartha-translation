    rationale: Nach dem komplexen „Als“-Satz mit dem Vater als durchgehendem Subjekt kann „sie“ in „begann sie“ irrtümlich auf den Vater bezogen werden. Der englische Zeuge besagt ausdrücklich, dass die Seele anfängt, seinen Namen anzurufen. Eine Umstellung stellt dies ohne Bedeutungsänderung klar.
