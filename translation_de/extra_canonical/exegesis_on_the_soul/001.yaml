lexical_decisions:
- source_word: soul / female in her nature
  choice: Seele / ihrem Wesen nach weiblich
  rationale: Bewahrt die Aussage, dass die Weiblichkeit nicht nur vom grammatischen Geschlecht des deutschen Wortes »Seele« herrührt, sondern als Wesensmerkmal behauptet wird.
- source_word: womb
  choice: Mutterleib
  rationale: Gibt das körperlich-reproduktive Bild würdevoll und eindeutig wieder; »Schoß« wäre mehrdeutiger.
- source_word: androgynous
  choice: androgyn
  rationale: Erhält die ausdrückliche Doppelgeschlechtlichkeit der Gestalt, ohne sie als bloß symbolisch oder geschlechtslos umzudeuten.
- source_word: fellprostitution / prostitution
  choice: Unzucht treiben / Unzucht
  rationale: Passt zum antiken religiös-sexuellen Bildfeld und vermeidet die stärker moderne, gewerblich geprägte Bedeutung von »Prostitution«.
- source_word: weak-minded
  choice: ohne Verstand
  rationale: Gibt die negative Aussage des Zeugen verständlich wieder, ohne eine moderne medizinische Diagnose einzuführen.
- source_word: maiden’s quarters
  choice: Mädchenkammer
  rationale: Bewahrt das Bild eines geschützten Wohnraums der unverheirateten jungen Frau; die ungewöhnliche Bildsprache wird nicht harmonisiert.
theological_decisions:
- issue: Fall der Seele in einen Körper
  choice: »in einen Körper fiel«
  alternative: »in einen Körper gelangte«
  rationale: Der Zeuge verwendet ausdrücklich die Sprache des Fallens. Die Übersetzung bewahrt die negative Wertung der Verkörperung in diesem Text, ohne sie mit einer bestimmten späteren Lehre gleichzusetzen.
- issue: Verhältnis der Seele zum Vater
  choice: »allein beim Vater wohnte« und »Nimm mich wieder zu dir zurück«
  alternative: »mit dem Vater vereint war«
  rationale: Eine metaphysische Wesenseinheit wird nicht ergänzt; das räumlich-familiäre Bild und seine eigene Spannung bleiben erhalten.
- issue: Gewalt und eigenes Handeln der Seele
  choice: Sowohl erlittene Gewalt als auch freiwillige Hingabe werden ausdrücklich wiedergegeben
  alternative: Die Seele ausschließlich als Opfer oder ausschließlich als Schuldige darstellen
  rationale: Der Text hält Fremdgewalt, Verführung, eigenes Handeln, Scham und Reue nebeneinander. Diese theologische und moralische Spannung darf nicht aufgelöst werden.
- issue: Grund des göttlichen Erbarmens
  choice: »wird er sie für würdig erachten, ihr sein Erbarmen zu schenken«
  alternative: »wird er ihr wegen ihrer Reue zwangsläufig vergeben«
  rationale: Die eigenartige Verbindung von Würdigkeit, Erbarmen und erlittenem Leid wird bewahrt, ohne ein geschlossenes Erlösungsschema einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener antiker Bildsprache. Gewalt, sexuelle Ausbeutung, Unzucht, Reue und Erbarmen werden klar, aber nicht sensationsheischend formuliert. Die Fassung ist vorläufig, da sie auf dem angegebenen gemeinfreien englischen Zeugen beruht und noch nicht unmittelbar am koptischen Text von Nag Hammadi Codex II,6 geprüft werden konnte.
