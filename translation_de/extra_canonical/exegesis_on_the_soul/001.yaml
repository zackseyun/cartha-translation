  naturalness: 'Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Im vorletzten Absatz erzeugt jedoch die Abfolge „Als aber der ... Vater sie besuchte ... begann sie seinen Namen anzurufen“ einen falschen bzw. mindestens stark irritierenden Subjektanschluss: Grammatisch kann der Vater als Subjekt von „begann“ gelesen werden. Die Satzfügung muss so geändert werden, dass eindeutig die Seele den Namen anruft.'
  terminology: „Seele“, „Mutterleib“, „androgyn“, „Unzucht“, „Ehebrecher“, „Erbarmen“ und „Mädchenkammer“ sind im gegebenen Kontext tragfähige Wiedergaben. „schändeten“ wahrt die durch die Klammern signalisierte Unsicherheit und wird durch die Fußnote zutreffend als sexueller Übergriff erläutert. Die wertende Beschreibung der Kinder bleibt als übersetzte Stimme des Zeugen erkennbar und wird nicht diagnostisch modernisiert.
  issues:
