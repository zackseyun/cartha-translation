translation:
  language: de
  text: '**Der Fall der Seele**


    [][a] Vor langer Zeit gaben Weise der Seele einen weiblichen Namen. Tatsächlich ist sie auch ihrem Wesen nach weiblich. Sie besitzt sogar einen Mutterleib.


    Solange sie allein beim Vater wohnte, war sie Jungfrau, und ihrer Gestalt nach war sie androgyn. Als sie jedoch in einen Körper fiel und in dieses Leben eintrat, geriet sie in die Hände vieler Räuber. Die grausamen Wesen reichten sie untereinander weiter und [schändeten] sie.[b] Manche gebrauchten sie mit Gewalt, andere verführten sie mit einem Geschenk. Kurz gesagt: Sie entehrten sie, und sie [verlor] ihre [] Jungfräulichkeit.


    In ihrem Körper trieb sie Unzucht und gab sich ausnahmslos allen hin. Jeden, den sie zu umarmen bereit war, hielt sie für ihren Ehemann. Nachdem sie sich grausamen, treulosen Ehebrechern ausgeliefert hatte, damit sie sie missbrauchen konnten, stöhnte sie tief auf und bereute.


    Doch selbst wenn sie ihr Gesicht von diesen Ehebrechern abwandte, lief sie zu anderen. Diese zwangen sie, bei ihnen zu leben und ihnen in ihrem Bett zu dienen, als wären sie ihre Herren. Aus Scham wagte sie schließlich nicht mehr, sie zu verlassen. Sie ihrerseits täuschten sie lange Zeit: Sie gaben sich als treue, echte Ehemänner aus, als würden sie sie hoch achten. Nach all dem verließen sie sie und gingen fort.


    Da wurde sie zu einer hilflosen, armen und verlassenen Witwe. In der Zeit ihrer Not blieb ihr nicht ein Bissen zu essen. Alles, was sie je von ihnen bekam, war die Befleckung durch den Geschlechtsverkehr. Und ihre Kinder von den Ehebrechern sind stumm, blind, krank und ohne Verstand.


    Als aber der erhabene Vater sie besuchte, sie ansah und bemerkte, wie sie in ihren Schmerzen und ihrer Schande stöhnte und die Unzucht bereute, die sie getrieben hatte, begann sie seinen Namen anzurufen, damit er ihr helfe. [Sie stöhnte] von ganzem Herzen und sagte: »Rette mich, mein Vater! Sieh mich an, denn ich werde [dir Rechenschaft ablegen],[c] weil ich mein Haus verlassen habe und [] aus meiner Mädchenkammer geflohen bin. Nimm mich wieder zu dir zurück.«


    Wenn er sie in diesem Zustand sieht, wird er sie für würdig erachten, ihr sein Erbarmen zu schenken; denn zahlreich sind die Leiden, die sie trafen, weil sie ihr Haus verlassen hatte.'
