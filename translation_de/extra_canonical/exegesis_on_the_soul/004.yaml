translation:
  language: de
  text: '**Auslegung über die Seele — Die Hochzeit der Seele**


    Denn jene Hochzeit ist nicht wie eine fleischliche Ehe. Menschen, die miteinander geschlechtlich verkehren, finden an dieser Art Verkehr Genüge. Wie eine Last lassen sie die Plage der leiblichen Begierde hinter sich und [wenden ihre Gesichter] voneinander ab.[a] Diese Hochzeit aber [ist anders]. Wenn sie sich [miteinander] verbunden haben, werden sie ein einziges Leben.


    […] Deshalb sagte der Prophet über den ersten Mann und die erste Frau: »Sie werden ein Fleisch werden.« (1. Mose 2,24)


    Denn anfangs waren sie miteinander verbunden, als sie beim Vater wohnten, bevor die Frau den Mann, ihren Bruder, in die Irre führte. Diese Hochzeit hat sie wieder miteinander verbunden, und die Seele ist mit ihrer wahren Liebe, ihrem ursprünglichen Herrn, vereint worden. So steht geschrieben: »Denn der Herr der Frau ist ihr Mann.« (1. Mose 3,16; Epheser 5,23)[b]


    Nach und nach erkannte sie ihn. Sie freute sich wieder und weinte in seiner Gegenwart, als sie sich ihrer früheren Schande als Witwe erinnerte. Und sie schmückte sich noch mehr, damit es ihm Freude bereitete, bei ihr zu bleiben.


    Und der Prophet sagte in den Psalmen:


    »Höre, meine Tochter, sieh her und neige dein Ohr;

    vergiss dein Volk und das Haus deines Vaters.

    Dann wird der König deine Schönheit begehren,

    denn er ist dein Herr.« (Psalm 45,11–12)[c]


    Denn er gebietet ihr, den Blick von ihrem Volk und von der Menge ihrer Ehebrecher abzuwenden, unter denen sie einst wohnte, und sich allein ihrem König, ihrem wahren Herrn, zu weihen. Sie soll das Haus ihres irdischen Vaters vergessen, wo es ihr entsetzlich ergangen war, und sich stattdessen an ihren Vater im Himmel erinnern.


    Dementsprechend wurde auch zu Abraham gesagt: »Zieh fort aus deinem Land, aus deiner Verwandtschaft und aus dem Haus deines Vaters.« (1. Mose 12,1)


    Nachdem die Seele sich auf diese Weise wieder [in ihrer Herrlichkeit geschmückt hatte], [verlangte sie danach], ihren Geliebten anzubeten; und [auch er] liebte sie. Als sie sich mit ihm vereinte, empfing sie […] von ihm den Samen des lebendig machenden Geistes. Durch ihn bringt sie rechtschaffene Kinder zur Welt und zieht sie groß; denn dies ist das große, vollkommene Wunder der Geburt. So wird diese Hochzeit nach dem Willen des Vaters vollendet.


    Es ist angemessen, dass die Seele sich erneuert und wieder das wird, was sie früher war. Dann setzt sie sich aus eigenem Willen in Bewegung und empfängt vom Vater die göttliche Natur zu ihrer Erneuerung, damit sie an den Ort zurückgebracht wird, an dem sie anfangs war:


    Dies ist die Auferstehung von den Toten.

    Dies ist die Erlösung aus der Sklaverei.

    Dies ist die aufwärtsführende Reise, der Aufstieg zum Himmel.

    Dies ist der Weg hinauf zum Vater.


    Darum sagte der Prophet:


    »Lobe den Herrn, meine Seele,

    und alles, was in mir ist, lobe seinen heiligen Namen.

    Meine Seele, lobe Gott,

    der dir alle deine Verfehlungen vergibt,

    der alle deine Krankheiten heilt,

    der dein Leben vom Tod loskauft,

    der dich mit Erbarmen krönt,

    der dein Verlangen mit Gutem sättigt.

    Deine Jugend wird erneuert wie die des Adlers.« (Psalm 103,1–5)[d]


    Nachdem sie wieder jung geworden ist, wird sie emporsteigen und dabei den Vater und ihren Bruder preisen, der sie gerettet hat. Auf diese Weise wird die Seele gerettet, indem sie von Neuem geboren wird. Dies geschieht nicht durch das Wiederholen von Formeln, nicht durch gelehrte Sachkenntnis und nicht durch das Lernen aus Büchern, sondern durch die Gnade des [Geistes]; es ist die Gabe des barmherzigen [Gottes]. Dies ist der Weg dieser himmlischen Wirklichkeit.


    Darum ruft der Retter: […] »Niemand kann zu mir kommen, wenn nicht mein Vater ihn zieht und zu mir bringt; und ich werde ihn am letzten Tag auferwecken.« (Johannes 6,44)[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eckige Klammern kennzeichnen ergänzten beziehungsweise unsicher überlieferten Wortlaut; […] bezeichnet eine Lücke. Diese Signale folgen dem bereitgestellten englischen Textzeugen. Eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Die materielle Unsicherheit und der vorläufige Charakter der Ausgangsbasis müssen sichtbar bleiben.
  - marker: b
    text: Die kombinierte Stellenangabe folgt dem Textzeugen. Der zitierte Satz entspricht keiner der beiden Stellen im üblichen Bibelwortlaut vollständig.
    reason: Verhindert eine stillschweigende Harmonisierung der zusammengesetzten biblischen Anspielung.
  - marker: c
    text: Die Verszählung kann je nach Psalmenausgabe als Psalm 45,10–11 erscheinen.
    reason: Der englische Zeuge und deutschsprachige Bibelausgaben können aufgrund unterschiedlicher Zählweisen voneinander abweichen.
  - marker: d
    text: Das Psalmzitat folgt der Fassung des vorliegenden Werkes und wurde nicht an eine bestimmte deutsche Bibelübersetzung angeglichen.
    reason: Kennzeichnet die eigenständige Zitationsform des antiken Werkes.
  - marker: e
    text: Der Zusatz „und zu mir bringt“ steht im vorliegenden Textzeugen; er gehört nicht zum üblichen Wortlaut von Johannes 6,44.
    reason: Bewahrt eine relevante Textabweichung und verhindert Harmonisierung.
lexical_decisions:
- source_word: marriage
  choice: Hochzeit / Ehe
  rationale: Für die geistliche Vereinigung wird überwiegend „Hochzeit“ gewählt, weil der Abschnitt ein vollziehendes Vereinigungsereignis schildert; „fleischliche Ehe“ bezeichnet dagegen die gewöhnliche menschliche Institution. Die Variation wahrt den Kontrast.
- source_word: carnal
  choice: fleischlich
  rationale: „Fleischlich“ bewahrt die religiös-anthropologische Spannung des Zeugnisses besser als das enger wertende „sinnlich“.
- source_word: sex
  choice: geschlechtlich verkehren / Verkehr
  rationale: Die sachliche, moderne Formulierung gibt den körperlichen Vorgang deutlich wieder, ohne vulgär oder unnötig klinisch zu klingen.
- source_word: one life
  choice: ein einziges Leben
  rationale: Nicht zu „ein Wesen“ oder „eine Seele“ harmonisiert; das ungewöhnliche Bild des Zeugnisses bleibt erhalten.
- source_word: master / lord
  choice: Herr
  rationale: „Herr“ ist in den Beziehungs- und Schriftzitaten idiomatischer als „Gebieter“, lässt aber die Bedeutungsnähe von Herrschaft und Zugehörigkeit bestehen.
- source_word: upright children
  choice: rechtschaffene Kinder
  rationale: Gibt die ethisch-religiöse Qualität wieder, ohne sie als bloß „aufrecht“ körperlich missverständlich zu machen.
- source_word: regenerates herself
  choice: sich erneuert
  rationale: Die reflexive Eigenbewegung der Seele bleibt erhalten; „wiedergebiert sich selbst“ wäre im Deutschen schwer verständlich und könnte die anschließende Aussage von der Geburt von Neuem vorwegnehmend verengen.
- source_word: rising journey of ascent
  choice: aufwärtsführende Reise, der Aufstieg
  rationale: Bewahrt die im Zeugnis vorhandene, emphatische Doppelung statt sie stilistisch zu beseitigen.
- source_word: educated expertise
  choice: gelehrte Sachkenntnis
  rationale: Bezeichnet erworbene Bildung beziehungsweise Expertise, ohne Bildung an sich polemisch umzudeuten.
theological_decisions:
- issue: Verhältnis von eigenem Willen der Seele und göttlicher Gabe
  choice: Beide Aussagen unvermittelt nebeneinander bewahrt
  alternative: Den Eigenwillen als Wirkung der vorausgehenden Gnade erklären
  rationale: Der Text spricht sowohl von der eigenen Willensbewegung der Seele als auch vom Empfang der göttlichen Natur und von Gnade. Eine systematische Auflösung würde die Spannung des Zeugnisses beseitigen.
- issue: Bräutigam als Bruder, Herr und Retter
  choice: Alle drei Bezeichnungen beibehalten
  alternative: Die Gestalt ausdrücklich mit Christus identifizieren
  rationale: Obwohl die christologische Deutung naheliegt, benennt der Abschnitt die Gestalt hier mit mehreren Beziehungsbildern. Die Übersetzung fügt keine eindeutige dogmatische Gleichsetzung hinzu.
- issue: „göttliche Natur“
  choice: wörtlich als „göttliche Natur“ wiedergegeben
  alternative: „göttliches Wesen“ oder „Anteil am Göttlichen“
  rationale: Die Formulierung soll weder ontologisch verstärkt noch zu bloßer Teilhabe abgeschwächt werden.
- issue: Rettung durch Wiedergeburt
  choice: „indem sie von Neuem geboren wird“
  alternative: „durch Wiedergeburt“ als feststehender Lehrbegriff
  rationale: Die verbale Form bleibt näher am Geburtsbild und vermeidet eine konfessionell vorgeprägte Systematisierung.
- issue: Johannes 6,44 im zitierten Wortlaut
  choice: Die erweiterte Fassung „zieht und … bringt“ bewahrt
  alternative: An den üblichen Bibelwortlaut harmonisieren
  rationale: Der Textzeuge bietet eine gegenüber dem kanonischen Standardwortlaut erweiterte Form; sie wird nicht stillschweigend korrigiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Sätzen und erkennbar poetischer Gestaltung der Schriftzitate. Weibliche Pronomen für die Seele werden beibehalten, weil die allegorische Handlung sie durchgehend als Frau, Braut und Witwe gestaltet. Die Übersetzung ist ein vorläufiger, quellensensibler Entwurf auf Grundlage des bereitgestellten gemeinfreien englischen Zeugnisses; eine direkte koptologische Prüfung von Nag-Hammadi-Codex II,6 steht aus.
