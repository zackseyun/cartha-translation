status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt eng und bewahrt Ergänzungen und Lücken grundsätzlich. Eine sinnverändernde Abweichung liegt jedoch in „wenden ihre Gesichter voneinander ab“ vor: Der Zeuge sagt ausdrücklich, dass sie ihre Gesichter voneinander abwenden, nicht nur, dass sie sich voneinander abwenden. Die biblischen Anspielungen bleiben überwiegend unharmanisiert; die Psalmreferenz sollte jedoch wie im Zeugen als Psalm 45,10–11 stehen, da der deutsche Entwurf selbst keine abweichende Psalmenzählung verwendet.'
  naturalness: Der Text ist weitgehend modernes, würdiges Standarddeutsch. „bei ihr zu bleiben“ ist für „abide with her“ möglich, aber etwas flacher als „bei ihr zu wohnen“. Die Formulierung „setzt sie sich aus eigenem Willen in Bewegung“ ist verständlich, aber unnötig technisch; „bewegt sie sich aus eigenem Willen“ ist näher und natürlicher.
  terminology: 'Die Begriffe „fleischlich“, „Herr“, „göttliche Natur“, „rechtschaffene Kinder“ und „von Neuem geboren“ sind sachgerecht und vermeiden dogmatische Festlegungen. „Hochzeit“ für marriage ist im gesamten Abschnitt vertretbar. Die textkritischen Klammerzeichen müssen exakt beibehalten werden: leere eckige Klammern sind nicht dasselbe wie eine Auslassungslücke […] und dürfen nicht ersetzt werden.'
  issues:
  - severity: high
    issue: Leere eckige Klammern wurden zweimal zu […] umgeformt.
    rationale: Der englische Zeuge hat vor „Because of this“ und vor dem Johanneszitat jeweils []; bei „she obtained [] from him“ steht ebenfalls []. Der Entwurf verwendet dort […] bzw. kennzeichnet nur allgemein eine Lücke. [] und […] sind unterschiedliche Überlieferungssignale und müssen unterschieden bleiben.
  - severity: medium
    issue: „[wenden ihre Gesichter] voneinander ab“ verschiebt die Zuordnung von „from each other“.
    rationale: 'Im Zeugen gehört „from each other“ zu der ergänzten Handlung: „[turning away their faces] from each other“. Deutsch muss daher „[wenden ihre Gesichter voneinander ab]“ lauten.'
  - severity: low
    issue: Psalmstellenangabe wurde von Psalm 45,10–11 auf Psalm 45,11–12 geändert.
    rationale: Der Auftrag verlangt, die Referenzen des Zeugen beizubehalten und nicht zu harmonisieren. Eine Fußnote zur möglichen Zählung ersetzt nicht die im Zeugen gebotene Referenz.
  - severity: low
    issue: „bei ihr zu bleiben“ schwächt „abide with her“ leicht ab.
    rationale: „bei ihr zu wohnen“ gibt das Bild des Bleibens/Verweilens präziser wieder, ohne es auszudeuten.
