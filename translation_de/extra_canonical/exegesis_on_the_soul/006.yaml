base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/006.yaml
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: de
  text: 'Dementsprechend steht bei dem Dichter geschrieben:[a]


    Odysseus saß auf der Insel, litt und trauerte

    und wandte sein Gesicht von Kalypsos Worten und ihren Reizen ab;

    er sehnte sich danach, sein Dorf wiederzusehen und den Rauch, der von dort aufstieg.

    Und hätte er nicht Hilfe vom Himmel [empfangen],

    [hätte er nicht] in sein Dorf [zurückkehren können].[b] (Homer, Odyssee 1,48–1,59)


    Auch [Helena] sagt:


    Mein Herz wandelte sich in mir;

    [] in meine Heimat wollte ich zurückkehren. (Homer, Odyssee 4,260–261)


    Denn sie klagte und sagte:


    Aphrodite ist es, die mich irregeführt

    und aus meinem Dorf fortgebracht hat.

    Meine eigene Tochter verließ ich

    und meinen Mann, der gut, verständig und schön ist. (Homer, Odyssee 4,261–264)


    Denn wenn die Seele ihren vollkommenen Mann wegen der Treulosigkeit Aphrodites verlässt, die hier durch den Akt der Zeugung ins Dasein tritt, dann wird sie Schaden erleiden. Wenn sie jedoch klagt und umkehrt, wird sie in ihr Haus zurückgebracht werden.'
