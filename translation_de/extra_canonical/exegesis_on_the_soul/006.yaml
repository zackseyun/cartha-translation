    reason: Kennzeichnung von Rekonstruktionen, Schäden und überlieferten Referenzangaben.
lexical_decisions:
- source_word: village
  choice: Dorf
  rationale: Gibt den konkreten Ortsbegriff des vorliegenden Zeugen wieder; im Vers über Helen wird daneben „Heimat“ verwendet, wo das englische Zeugnis ausdrücklich „home“ hat.
- source_word: home / house
  choice: Heimat / Haus
  rationale: Bewahrt den Wechsel im Zeugnis zwischen dem ersehnten Zuhause und dem abschließenden Bild der Rückkehr in das eigene Haus.
- source_word: Heaven
  choice: Himmel
  rationale: Bewahrt die religiöse Offenheit und Personifikation des Ausdrucks, ohne ausdrücklich „Gott“ einzusetzen.
- source_word: repents
  choice: umkehrt
  rationale: „Umkehren“ ist verständlich und gibt die Richtungsänderung im Kontext der Heimkehr wieder, ohne Reue auf ein bloßes Gefühl zu reduzieren.
- source_word: disloyalty
  choice: Treulosigkeit
  rationale: Erhält den Beziehungs- und Untreueaspekt des Ausdrucks, ohne ihn dogmatisch näher zu bestimmen.
- source_word: act of begetting
  choice: Akt der Zeugung
  rationale: Formnahe Wiedergabe, die die anthropologische beziehungsweise kosmologische Aussage nicht interpretierend auflöst.
theological_decisions:
- issue: Bezug der Seele auf den „vollkommenen Mann“
  choice: Die eheliche Bildsprache bleibt wörtlich erhalten.
  alternative: „vollkommener Gemahl“ oder eine ausdrückliche Identifizierung mit einer göttlichen Gestalt
  rationale: Der vorliegende Text identifiziert den Mann an dieser Stelle nicht ausdrücklich; eine konfessionelle oder systematische Deutung wird daher nicht ergänzt.
- issue: Aphrodites Entstehung durch Zeugung
  choice: Der grammatische Bezug auf Aphrodite und die ungewöhnliche Aussage werden bewahrt.
  alternative: Umdeutung auf die Treulosigkeit, Begierde oder die Seele
  rationale: Die Formulierung des Zeugen ist theologisch und syntaktisch spannungsreich; sie soll nicht stillschweigend harmonisiert werden.
- issue: Rückkehr der Seele
  choice: 'Passiv: „wird sie … zurückgebracht werden“'
  alternative: „kehrt sie … zurück“
  rationale: Das Passiv lässt offen, wer die Rückführung bewirkt, und wahrt damit die Aussage des Zeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Ton für die poetischen Zitate. Die Wiederholungen von „Dorf“, „Haus“, „klagen“ und „zurückbringen“ bleiben erhalten, weil sie die Auslegung über Heimkehr und Umkehr tragen. Wegen der noch ausstehenden Prüfung des koptischen Ausgangstextes sind alle Entscheidungen als vorläufig zu behandeln.
