  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/005.yaml
  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: de
  text: 'Daher ist es recht, zum Vater zu beten und ihn mit unserer ganzen Seele anzurufen. Dabei sollen wir seufzen, nicht äußerlich mit den Lippen, sondern mit dem inneren Geist, der aus der Tiefe kommt. Wir sollen das frühere Leben bereuen, das wir geführt haben, unsere Sünden bekennen und erkennen, in welch nichtiger Lüge wir lebten und wie hohl unser Eifer war. Wir sollen klagen über die Finsternis und die Woge, die uns verschlungen hat, und über uns selbst weinen, damit er Erbarmen mit uns hat; wir sollen uns selbst hassen wegen dessen, was wir jetzt sind.


    Der Retter sagte wiederum:


    »Glückselig sind die Trauernden,


    denn man wird Erbarmen mit ihnen haben.


    Glückselig sind die Hungernden,


    denn sie werden gesättigt werden.«


    (Matthäus 5,4.6; Lukas 6,21)


    Weiter sagte er: »Wer seine Seele[a] nicht hasst, kann mir nicht folgen.« (Lukas 14,26)


    Denn die Umkehr ist der Anfang der Rettung. Deshalb heißt es: »Bevor Christus erschien, kam Johannes und verkündete die Taufe der Umkehr.« (Apostelgeschichte 13,24)


    Die Umkehr aber geschieht unter Schmerz und Trauer. Der Vater jedoch ist gut und liebt die Menschen. Er hört auf die Seele, die ihn anruft, und sendet ihr das Licht der Rettung. Daher sprach er durch den Geist zu dem Propheten:


    Sage zu den Kindern meines Volkes:


    »[Wenn] eure Sünden [von der Erde bis] zum Himmel reichen,


    und wenn sie [rot] sind wie Scharlach


    und schwärzer als Sackleinen,


    [und wenn] […] ihr mit eurer ganzen Seele zu mir zurückkehrt


    und zu mir sagt: ›Mein Vater!‹,


    werde ich euch erhören wie ein heiliges Volk.«[b]


    (1. Clemensbrief 8,3)


    An einer anderen Stelle heißt es: »So spricht der Herr, der Heilige Israels: ›Wenn ihr umkehrt und weint, werdet ihr gerettet werden; und ihr werdet erkennen, wo ihr wart, als ihr auf das Nichtige hofftet.‹« (Jesaja 30,15)


    Und an einer anderen Stelle sagte er:


    Jerusalem weinte sehr und sprach: »Hab Erbarmen mit mir!« Beim Klang deines Weinens wird er dir gnädig sein. Als er sah, antwortete er dir. Der Herr wird euch Brot der Bedrängnis und Wasser der Trübsal geben. Von nun an werden die, die euch belügen, nicht mehr zu euch kommen. Eure Augen werden die sehen, die euch belügen.[c] (Jesaja 30,19–20)


    Daher ist es recht, Tag und Nacht zu Gott zu beten und unsere Hände zu ihm auszubreiten wie Menschen, die mitten auf dem Meer fahren. Sie beten mit ganzem Herzen und ohne Falschheit zu Gott; denn wer mit doppeltem Herzen[d] betet, belügt nur sich selbst. Tatsächlich prüft Gott das Innerste und erforscht die Tiefen des Herzens, um zu erkennen, wer der Rettung würdig ist. Denn niemand, der den Ort der Lüge noch immer liebt, ist der Rettung würdig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seele“ kann hier zugleich das eigene Leben oder Selbst bezeichnen. Die wörtliche Wiedergabe bewahrt den Leitbegriff des Werkes.
    reason: Lexikalische und theologische Mehrdeutigkeit.
  - marker: b
    text: Die eckigen Klammern und die Auslassung kennzeichnen unsicheren beziehungsweise fehlenden Text in der zugrunde gelegten Textgestalt. Das Zitat wird hier 1. Clemens 8,3 zugeordnet und verbindet Formulierungen aus prophetischer Überlieferung.
    reason: Textkritischer Hinweis und auffällige Zitatform.
  - marker: c
    text: Dieses Zitat stimmt in Wortlaut und Abfolge nur teilweise mit den heute üblichen Fassungen von Jesaja 30,19–20 überein; wiedergegeben ist die Gestalt, in der es in diesem Werk erscheint.
    reason: Verhindert eine stillschweigende Harmonisierung des Zitats.
  - marker: d
    text: 'Wörtlich geht es um „Doppelheit“: ein geteiltes, nicht aufrichtiges Inneres.'
    reason: Erklärung der bildhaften Wendung und ihrer möglichen Bedeutungsbreite.
lexical_decisions:
- source_word: soul
  choice: Seele
  rationale: Bewahrt den Leitbegriff des Traktats und lässt bei Lukas 14,26 die mögliche Bedeutung von Leben bzw. Selbst bewusst offen.
- source_word: repentance
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Hinwendung zu Gott natürlicher und umfassender als bloße Reue; Schmerz und Trauer werden im Folgesatz ausdrücklich genannt.
- source_word: salvation
  choice: Rettung
  rationale: Gibt den wiederkehrenden soteriologischen Begriff verständlich wieder, ohne eine bestimmte konfessionelle Terminologie aufzudrängen.
- source_word: duplicity
  choice: Falschheit / doppeltes Herz
  rationale: Die erste Wendung wird idiomatisch wiedergegeben; die Wiederholung konkretisiert das innere Geteiltsein, ohne es auf bloße Unehrlichkeit zu verengen.
- source_word: vacuous lie / what is empty
  choice: nichtige Lüge / das Nichtige
  rationale: Erhält das Motiv von Leere und Unwirklichkeit in würdiger, verständlicher Sprache.
- source_word: hollow zealotry
  choice: wie hohl unser Eifer war
  rationale: Vermeidet das modern-politisch verengte Wort Fanatismus und bewahrt die Kritik an einem substanzlosen religiösen Eifer.
- source_word: inward parts
  choice: das Innerste
  rationale: Natürliches modernes Deutsch für die verborgenen inneren Bereiche des Menschen.
theological_decisions:
- issue: Bedeutung von „seine Seele hassen“
  choice: Wörtliche Formulierung im Haupttext beibehalten
  alternative: „sein Leben“ oder „sich selbst hassen“
  rationale: Der Traktat verwendet „Seele“ als theologischen Leitbegriff; eine Glättung würde die Spannung des Zitats und seine Verbindung zum Thema abschwächen.
- issue: „Wer der Rettung würdig ist“
  choice: Würdigkeitsformulierung bewahren
  alternative: „wer gerettet werden soll/kann“
  rationale: Die Vorlage spricht ausdrücklich von Würdigkeit. Die Übersetzung löst die mögliche Spannung zu anderen Heilsvorstellungen nicht stillschweigend auf.
- issue: Selbsthass als Bestandteil der Buße
  choice: „uns selbst hassen wegen dessen, was wir jetzt sind“ beibehalten
  alternative: „unseren gegenwärtigen Zustand verabscheuen“
  rationale: Die scharfe asketische Aussage des Textes darf nicht psychologisierend abgeschwächt werden; „wegen dessen“ markiert zugleich ihren begründenden Bezug.
- issue: Biblische und frühchristliche Zitate
  choice: Nach der im Traktat überlieferten Gestalt übersetzen
  alternative: An den Wortlaut einer modernen kanonischen Bibel angleichen
  rationale: Die Zitate weichen teils deutlich von bekannten Bibelfassungen ab. Als Bestandteil dieses antiken Werkes sollen sie nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die eindringliche Bußsprache und die wiederkehrenden Motive Seele, Tiefe, Lüge, Weinen und Rettung bleiben erhalten. Zitate sind typografisch abgesetzt; beschädigte oder ergänzte Stellen bleiben durch eckige Klammern sichtbar. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich auf den bereitgestellten öffentlichen englischen Zeugen gegründet.
