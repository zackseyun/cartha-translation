  terminology: Die konsequente Wiedergabe von „soul“ als „Seele“, „repentance“ als „Umkehr“ und „salvation“ als „Rettung“ ist sachgerecht. Die Anmerkungen erläutern die wichtigen Mehrdeutigkeiten und die abweichenden Zitatformen angemessen, ohne sie dogmatisch festzulegen.
  issues:
  - severity: low
    issue: 'Im Zitat zu Jesaja 30,19–20 wird ein nicht vorhandenes Objekt ergänzt: „Als er es sah“.'
    rationale: Der englische Zeuge lautet lediglich „And when he saw, he answered you.“ Die Ergänzung „es“ legt fest, was gesehen wird, obwohl der überlieferte Wortlaut dies offenlässt. „Als er sah“ bewahrt die Ellipse.
