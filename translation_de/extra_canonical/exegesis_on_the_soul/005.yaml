    werde ich euch erhören wie ein heiliges Volk.«[b]


    (1. Clemensbrief 8,3)


    An einer anderen Stelle heißt es: »So spricht der Herr, der Heilige Israels: ›Wenn ihr umkehrt und weint, werdet ihr gerettet werden; und ihr werdet erkennen, wo ihr wart, als ihr auf das Nichtige hofftet.‹« (Jesaja 30,15)


    Und an einer anderen Stelle sagte er:


    Jerusalem weinte sehr und sprach: »Hab Erbarmen mit mir!« Beim Klang deines Weinens wird er dir gnädig sein. Als er sah, antwortete er dir. Der Herr wird euch Brot der Bedrängnis und Wasser der Trübsal geben. Von nun an werden die, die euch belügen, nicht mehr zu euch kommen. Eure Augen werden die sehen, die euch belügen.[c] (Jesaja 30,19–20)


    Daher ist es recht, Tag und Nacht zu Gott zu beten und unsere Hände zu ihm auszubreiten wie Menschen, die mitten auf dem Meer fahren. Sie beten mit ganzem Herzen und ohne Falschheit zu Gott; denn wer mit doppeltem Herzen[d] betet, belügt nur sich selbst. Tatsächlich prüft Gott das Innerste und erforscht die Tiefen des Herzens, um zu erkennen, wer der Rettung würdig ist. Denn niemand, der den Ort der Lüge noch immer liebt, ist der Rettung würdig.'
