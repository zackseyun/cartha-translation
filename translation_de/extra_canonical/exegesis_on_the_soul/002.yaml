lexical_decisions:
- source_word: prostitution / played the harlot
  choice: Prostitution / sich prostituieren
  rationale: Bewahrt das durchgehende sexuelle und zugleich geistliche Bild des Zeugnisses in gegenwärtigem, verständlichem Deutsch; „Unzucht“ wäre allgemeiner, „Hurerei“ stärker altertümlich.
- source_word: shepherds
  choice: Hirten
  rationale: Die auffällige Bildsprache des überlieferten Zitats wird nicht zu „Liebhabern“ oder „Herrschern“ harmonisiert.
- source_word: perceptible realm
  choice: die sinnlich wahrnehmbare Welt
  rationale: Gibt den philosophischen Gegensatz zum Geistigen verständlich wieder, ohne ihn konfessionell auszudeuten.
- source_word: men great of flesh
  choice: Männer von gewaltigem Fleisch
  rationale: Erhält die ungewöhnliche, körperbetonte Formulierung und vermeidet eine glättende Festlegung auf sexuelle Potenz oder Körpergröße.
- source_word: senseless external things
  choice: vernunftlose äußere Dinge
  rationale: Bewahrt die negative anthropologische Wertung des Textes; „sinnlos“ könnte irrtümlich bloß „zwecklos“ bedeuten.
- source_word: having sex with everyone
  choice: mit jedem … sexuell verkehrt
  rationale: Gibt die ausdrückliche sexuelle Aussage klar wieder, ohne sie euphemistisch abzuschwächen oder unnötig derb zu formulieren.
theological_decisions:
- issue: Verhältnis von körperlicher und seelischer Prostitution
  choice: Die ausdrückliche Vorrangstellung der seelischen Prostitution und die Behauptung, die körperliche gehe aus ihr hervor, bleiben unverändert.
  alternative: Die Aussagen als bloße Metapher oder als allgemeine moralische Mahnung abmildern.
  rationale: Der Text legt selbst diese theologische Deutung vor; eine Harmonisierung mit späteren Lehrsystemen wäre sachfremd.
- issue: Geistliche Deutung von 1. Korinther 5 und Epheser 6
  choice: Die Deutung des Verfassers wird als seine Aussage wiedergegeben.
  alternative: Die Zitate an einen kanonischen Bibeltext angleichen oder die Auslegung korrigieren.
  rationale: Die Schriftzitate sind Bestandteil des antiken Werkes und müssen in dessen überlieferter Gestalt und Argumentation erscheinen.
- issue: Personifizierung der Seele
  choice: Die Seele wird durchgehend mit femininen Pronomen und als handelnde Frau dargestellt.
  alternative: Neutrale oder unpersönliche Formulierungen verwenden.
  rationale: Das grammatische Geschlecht im Deutschen unterstützt hier die ausdrücklich weibliche Personifizierung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Direktheit der sexuellen Bildsprache. Die biblischen Zitate wurden in der im Werk bezeugten Form übersetzt und nicht an eine moderne deutsche Bibelausgabe harmonisiert. Da die direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Zeugen.
