  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorgelegten englischen Zeugen insgesamt eng und bewahrt dessen auffällige Schriftzitate, Bildsprache, textkritische Klammern und geistliche Argumentation. Eine kleine Anpassung ist angezeigt: Die Ergänzung in Hosea bezeichnet ein Verlangen bzw. Sehnen in Kinderlosigkeit, nicht ein Sichverzehren.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Der Eingang wird geglättet, damit die Einleitung ohne die etwas stolpernde Doppelung „weissagt … sagt er“ funktioniert. Die direkte sexuelle Sprache bleibt sachlich und dem Zeugen entsprechend erhalten.
  terminology: „Prostitution“, „sich prostituieren“, „Hirten“, „sinnlich wahrnehmbare Welt“, „Männer von gewaltigem Fleisch“ und „vernunftlose äußere Dinge“ geben die bewusst ungewöhnliche Terminologie des Zeugen angemessen wieder. Die beschädigten bzw. ergänzten Stellen bleiben sichtbar markiert.
  issues:
  - severity: low
    issue: Hosea-Ergänzung „[sich in Kinderlosigkeit verzehrt]“
    rationale: Der englische Zeuge lautet „[yearn in childlessness]“. „Sich verzehren“ verschiebt das Semantische von Sehnsucht/Verlangen zu Aufzehrung. „[sich nach Kindern sehnt]“ ist im Deutschen natürlich und wahrt den ergänzten Status.
  - severity: low
    issue: Einleitung mit „weissagt … Durch den Propheten Jeremia sagt er“
    rationale: Die Formulierung ist verständlich, aber stilistisch redundant. „indem er durch den Propheten Jeremia spricht“ erhält Aussage und Register in flüssigerer Form.
