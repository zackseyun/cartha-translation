  text: 'Now, concerning the prostitution of the soul, the Holy Spirit prophesies in many places, saying through the prophet Jeremiah:


    “If a husband divorces his wife, and she goes and takes another man, can she return to him again? Has that woman not completely defiled herself? ‘And you prostituted yourself to many shepherds, and you returned to me,’ said the Lord. ‘Look carefully and see where you prostituted yourself. Were you not sitting in the streets, polluting the land with your prostitution and wickedness? And you took many shepherds as a stumbling block for yourself. You were shameless with everyone. You did not call on me as a relative, or as a father, or as the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, it is written in the prophet Hosea:


    “Come, bring charges against your mother, for she will not be a wife to me, and I will not be a husband to her. I will remove her prostitution from before me, and I will remove her adultery from between her breasts. I will strip her naked as on the day she was born, and I will make her a wilderness, like a land without water, and I will make her [yearn in childlessness]. I will not have compassion on her children, for they are children of prostitution, because their mother prostituted herself and [acted shamefully toward her children]. [] For she said, ‘I will prostitute myself to my lovers. They gave me my bread and my water, my clothing and my garments, my wine and my oil, and everything I needed.’ Therefore, look: I will close them in so that she cannot run after her lovers. When she seeks them but does not find them, she will say, ‘I will return to my former husband; I was better off then than I am now.’” (Hosea 2:2–7)


    Again, he says in Ezekiel:


    “‘After much wickedness,’ said the Lord, ‘you built a brothel and made a place for your beauty in the streets. You built brothels on every street, squandered your beauty, spread your legs in every alley, and multiplied your acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors, men great in flesh.’” (Ezekiel 16:23–26)


    What, then, does “the sons of Egypt, men great in flesh” mean, except the kingdom of the flesh, the perceptible realm, and earthly affairs? These defile the soul here, as she obtains from them bread, as well as wine, oil, garments, and other senseless external things surrounding the body—things she believes are necessary for her.


    Concerning this prostitution, however, the Savior’s apostles insisted, “Guard yourselves from it; purify yourselves from it.” This applies not only to bodily prostitution, but especially to the prostitution of the soul. For this reason, the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] concerns the prostitution [] of the soul. Bodily prostitution also originates from it. Therefore Paul, writing to the Corinthians, said, “I wrote to you in the letter, ‘Do not associate with prostitutes’—not at all referring to the prostitutes of this world, or the greedy, or robbers, or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9–10) In this case he is speaking spiritually: “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
translation:
  language: de
  text: 'Was nun die Prostitution der Seele betrifft, so weissagt der Heilige Geist an vielen Stellen. Durch den Propheten Jeremia sagt er:


    „Wenn ein Mann sich von seiner Frau scheiden lässt und sie fortgeht und einen anderen Mann nimmt, kann sie dann wieder zu ihm zurückkehren? Hat jene Frau sich nicht völlig verunreinigt? ‚Du aber hast dich vielen Hirten prostituiert und bist zu mir zurückgekehrt‘, sprach der Herr. ‚Schau genau hin und sieh, wo du dich prostituiert hast. Saßest du nicht auf den Straßen und hast das Land durch deine Prostitution und deine Bosheit verunreinigt? Du hast dir viele Hirten zum Stolperstein genommen. Bei jedem warst du schamlos. Du hast mich nicht als Verwandten angerufen, auch nicht als Vater oder als Hüter deiner Jungfräulichkeit.‘“ (Jeremia 3,1–4)


    Weiter steht beim Propheten Hosea geschrieben:


    „Kommt, führt einen Rechtsstreit mit eurer Mutter; denn sie wird nicht meine Frau sein, und ich werde nicht ihr Mann sein. Ich werde ihre Prostitution von meinem Angesicht entfernen und ihren Ehebruch zwischen ihren Brüsten wegnehmen. Ich werde sie nackt ausziehen wie am Tag ihrer Geburt. Ich werde sie zu einer Wüste machen, wie ein Land ohne Wasser, und ich werde bewirken, dass sie [sich in Kinderlosigkeit verzehrt]. Ich werde mit ihren Kindern kein Erbarmen haben, denn sie sind Kinder der Prostitution. Ihre Mutter hat sich nämlich prostituiert und [an ihren Kindern schändlich gehandelt]. [] Denn sie sagte: ‚Ich werde mich meinen Liebhabern prostituieren. Sie gaben mir mein Brot und mein Wasser, meine Kleidung und meine Gewänder, meinen Wein und mein Öl und alles, was ich brauchte.‘ Darum seht: Ich werde sie einschließen, sodass sie ihren Liebhabern nicht nachlaufen kann. Wenn sie sie sucht, aber nicht findet, wird sie sagen: ‚Ich werde zu meinem früheren Mann zurückkehren; damals ging
    es mir besser als jetzt.‘“[a] (Hosea 2,2–7)


    Weiter sagt er bei Ezechiel:


    „‚Nach all der Bosheit geschah es‘, sprach der Herr, ‚dass du ein Bordell bautest und dir auf den Straßen einen Ort für deine Schönheit machtest. Du bautest an jeder Straße Bordelle, vergeudetest deine Schönheit, spreiztest in jeder Gasse deine Beine und vermehrtest deine Prostitution. Du prostituiertest dich den Söhnen Ägyptens, deinen Nachbarn, Männern von gewaltigem Fleisch.‘“ (Ezechiel 16,23–26)


    Was aber bedeutet „die Söhne Ägyptens, Männer von gewaltigem Fleisch“ anderes als das Reich des Fleisches, die sinnlich wahrnehmbare Welt und die irdischen Angelegenheiten? Diese verunreinigen hier die Seele, wenn sie von ihnen Brot bezieht, außerdem Wein, Öl, Gewänder und weitere vernunftlose äußere Dinge rings um den Körper – Dinge, die sie für notwendig hält.


    Im Blick auf diese Prostitution mahnten die Apostel des Retters eindringlich: „Hütet euch vor ihr; reinigt euch von ihr.“ Das bezieht sich nicht nur auf die körperliche Prostitution, sondern vor allem auf die Prostitution der Seele. Aus diesem Grund schreiben die Apostel [an die Gemeinden] Gottes, damit [diese Art von Prostitution] unter uns nicht vorkommt.[a]


    Die schwierigste [Herausforderung] betrifft jedoch die Prostitution [] der Seele.[a] Aus ihr geht auch die körperliche Prostitution hervor. Deshalb sagte Paulus, als er an die Korinther schrieb: „Ich habe euch in dem Brief geschrieben: ‚Habt keinen Umgang mit Prostituierten‘ – damit meinte ich keineswegs die Prostituierten dieser Welt oder die Habgierigen oder Räuber oder Götzendiener; denn dann müsstet ihr die Welt verlassen.“ (1. Korinther 5,9–10) Hier spricht er geistlich: „Denn unser Kampf richtet sich nicht gegen Fleisch und Blut“, wie er sagte, „sondern gegen die Weltherrscher dieser Finsternis und die Geister der Bosheit.“ (Epheser 6,12)


    Denn solange die Seele weiterhin überall umherläuft, mit jedem, dem sie begegnet, sexuell verkehrt und sich selbst verunreinigt, erleidet sie, was sie verdient.'
