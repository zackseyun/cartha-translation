base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: de
  text: 'Wenn ihr euch diesen Wahrheiten stellt und aufmerksam auf sie hört, werdet ihr erkennen, wie viel Gott denen schenkt, die ihn in rechter Weise lieben. Sie werden zu einem Garten der Wonne, zu einem Baum, der in ihnen wächst, gedeiht, Früchte aller Art trägt und mit vielfältigen Früchten geschmückt ist.


    Denn in diesem Garten sind ein Baum der Erkenntnis und ein Baum des Lebens gepflanzt. Doch nicht der Baum der Erkenntnis tötet; der Ungehorsam tötet.


    Denn die Schriften erklären deutlich, dass Gott von Anfang an mitten im Paradies einen Baum [der Erkenntnis und einen Baum][a] des Lebens pflanzte und durch Erkenntnis das Leben offenbarte. Weil unsere ersten Eltern ihn aber nicht in rechter Weise gebrauchten, wurden sie durch den Betrug der Schlange entblößt.


    Denn weder gibt es Leben ohne Erkenntnis noch rechte Erkenntnis ohne wahres Leben. Darum ist der eine Baum nahe beim anderen gepflanzt.


    Der Apostel erkannte die Tragweite dessen und tadelte eine Erkenntnis, die losgelöst von der Wahrheit des Gebotes ausgeübt wird, das zum Leben führt. Deshalb sagt er: »Die Erkenntnis bläht auf, die Liebe aber baut auf.«[b]


    Wer nämlich meint, etwas zu wissen, ohne die wahre Erkenntnis zu besitzen, die durch das Leben bezeugt wird, ist unwissend. Er ist von der Schlange getäuscht, weil er das Leben nicht geliebt hat. Wer aber in Ehrfurcht erkennt und nach dem Leben verlangt, pflanzt in Hoffnung und erwartet Frucht.


    Dein Herz sei Erkenntnis und dein Leben wahre Einsicht, recht erfasst.[c]


    Wenn du diesen Baum trägst und seine Frucht pflückst, wirst du stets die Ernte einbringen, die Gott erwartet. Die Schlange rührt sie nicht an, und kein Betrug befleckt sie. Eva wird nicht verdorben, sondern als Jungfrau geglaubt,[d]


    und das Heil wird verkündet, die Apostel werden mit Einsicht erfüllt, das Passa des Herrn schreitet voran, die Gemeinden werden versammelt, und [alles][e] wird geordnet. Während er die Heiligen lehrt, freut sich das Wort; durch ihn wird der Vater verherrlicht. Ihm sei die Herrlichkeit in alle Ewigkeit. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter »der Erkenntnis und einen Baum« stehen im überlieferten englischen Zeugen in eckigen Klammern und kennzeichnen eine Ergänzung beziehungsweise unsichere Textwiederherstellung.
    reason: Textkritische Unsicherheit des verlorenen Manuskriptzeugen transparent machen.
  - marker: b
    text: Vgl. 1. Korinther 8,1.
    reason: Das ausdrückliche Apostelzitat kenntlich machen.
  - marker: c
    text: 'Die genaue Bedeutung der zugrunde liegenden Wendung ist unsicher; möglich ist auch: »und dein Leben sei wahre Vernunft, recht begriffen«.'
    reason: Die semantische Unsicherheit von »true reason, duly comprehended« bewahren.
  - marker: d
    text: Die ungewöhnliche Aussage über Eva wird nach dem vorliegenden Zeugen wiedergegeben und nicht stillschweigend auf Maria bezogen. Wortlaut und Sinn bedürfen einer Prüfung am griechischen Text.
    reason: Echte textliche und theologische Spannung offenlegen.
  - marker: e
    text: »Alles« ist im vorliegenden Zeugen als Ergänzung gekennzeichnet.
    reason: Den Restaurationshinweis der Vorlage erhalten.
lexical_decisions:
- source_word: knowledge
  choice: Erkenntnis
  rationale: Bewahrt die wiederkehrende Verbindung zum Baum der Erkenntnis und zum Zitat aus 1 Kor 8,1; »Wissen« wäre stellenweise flacher.
- source_word: charity
  choice: Liebe
  rationale: Entspricht im apostolischen Zitat dem griechischen agapē und ist im heutigen Deutsch natürlich.
- source_word: injunction
  choice: Gebot
  rationale: Gibt die lebensführende göttliche Weisung knapp und verständlich wieder, ohne sie konfessionell auszudeuten.
- source_word: fear
  choice: Ehrfurcht
  rationale: Im religiösen Zusammenhang ist nicht bloße Angst gemeint; »Ehrfurcht« wahrt den Gottesbezug.
- source_word: true reason
  choice: wahre Einsicht
  rationale: Die genaue griechische Grundlage ist noch zu prüfen; »Einsicht« ist verständlich und passt zum Erkenntnismotiv, ohne eine technische philosophische Bedeutung festzulegen.
- source_word: Passover
  choice: Passa
  rationale: Bewahrt den biblisch-frühchristlichen Begriff und lässt die mögliche Spannung zwischen Passafest und Ostergeschehen offen.
- source_word: congregations
  choice: Gemeinden
  rationale: Natürliches modernes Deutsch für die versammelten christlichen Gemeinschaften.
- source_word: the Word
  choice: das Wort
  rationale: Behält die mögliche personale Logos-Aussage und ihre theologische Offenheit bei.
theological_decisions:
- issue: Verhältnis von Erkenntnis und Leben
  choice: Beide werden als untrennbar dargestellt; Erkenntnis selbst tötet nicht, sondern Ungehorsam.
  alternative: Erkenntnis grundsätzlich als gefährlich oder sündhaft deuten.
  rationale: Der Text weist ausdrücklich dem Ungehorsam, nicht dem Baum der Erkenntnis, die tödliche Wirkung zu.
- issue: Aussage über Eva
  choice: Die ungewöhnliche Formulierung »Eva wird nicht verdorben, sondern als Jungfrau geglaubt« bleibt stehen.
  alternative: Die Stelle mariologisch harmonisieren oder frei auf Maria beziehen.
  rationale: Der überlieferte Zeuge nennt Eva; die sachliche und textgeschichtliche Schwierigkeit darf nicht stillschweigend beseitigt werden.
- issue: Personaler Bezug von »das Wort«
  choice: Das Pronomen wird maskulin als »durch ihn« wiedergegeben.
  alternative: Neutrum »durch es« oder ausdrückliche Ergänzung »Christus«.
  rationale: Der Zusammenhang legt eine personale Logos-Aussage nahe; die Ergänzung »Christus« stünde jedoch nicht ausdrücklich im vorliegenden Zeugen.
- issue: Doxologischer Bezug
  choice: »Ihm sei die Herrlichkeit« bleibt in seiner Bezugsrichtung offen.
  alternative: Explizit »dem Vater« oder »dem Wort« einsetzen.
  rationale: Die Satzfolge erlaubt ohne griechische Prüfung keine sichere Vereindeutigung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überwiegend kurzen, klaren Perioden. Bildsprache und Wiederholungen des Erkenntnis-/Lebensmotivs bleiben erhalten. Da eine direkte Prüfung des griechischen Textes noch aussteht und nur ein englischer gemeinfreier Zeuge vorliegt, werden problematische Stellen vorsichtig und mit Fußnoten wiedergegeben.
