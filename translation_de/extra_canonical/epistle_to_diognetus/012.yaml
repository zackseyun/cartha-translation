    Denn in diesem Garten sind ein Baum der Erkenntnis und ein Baum des Lebens gepflanzt. Doch nicht der Baum der Erkenntnis tötet; der Ungehorsam tötet.


    Denn die Schriften erklären deutlich, dass Gott von Anfang an mitten im Paradies einen Baum [der Erkenntnis und einen Baum][a] des Lebens pflanzte und durch Erkenntnis das Leben offenbarte. Weil unsere ersten Eltern die Erkenntnis aber nicht in rechter Weise gebrauchten, wurden sie durch den Betrug der Schlange entblößt.


