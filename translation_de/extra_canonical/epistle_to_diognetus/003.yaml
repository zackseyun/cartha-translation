lexical_decisions:
- source_word: practice their religion / worship
  choice: Gottesverehrung ausüben / Verehrung darbringen
  rationale: Unterscheidet die allgemeine religiöse Praxis von der konkreten kultischen Handlung und vermeidet das heute missverständliche „Religion praktizieren“.
- source_word: one God of the universe
  choice: der eine Gott des Weltalls
  rationale: Bewahrt den monotheistischen und kosmischen Anspruch des Zeugnisses in würdiger, verständlicher Sprache.
- source_word: Master
  choice: Herr
  rationale: „Herr“ ist im religiösen Register natürlich und gibt die Aussage über Gottes Herrschaft wieder, ohne einen modernen sozialen Titel aufzudrängen.
- source_word: senseless and deaf images
  choice: empfindungslose und taube Bilder
  rationale: Bewahrt beide polemischen Eigenschaften; „empfindungslos“ bezeichnet hier fehlende Wahrnehmungsfähigkeit, nicht emotionale Härte.
- source_word: whole burnt offerings
  choice: Ganzbrandopfer
  rationale: Präziser kultischer Ausdruck für Opfer, die vollständig verbrannt werden; verständlicher und sachgerechter als eine bloße Umschreibung.
- source_word: unable to participate in the honor
  choice: an der Ehre keinen Anteil haben können
  rationale: Erhält die ungewöhnliche begriffliche Spannung des Satzes, statt sie auf bloßes „Empfangen“ zu verengen.
theological_decisions:
- issue: Verhältnis zur jüdischen Gottesverehrung
  choice: Die polemische Argumentation des antiken Autors wird deutlich, aber ohne zusätzliche Verallgemeinerung wiedergegeben.
  alternative: Die Aussagen abschwächen oder als pauschales Urteil über das Judentum aktualisieren.
  rationale: Der Text kritisiert bestimmte Opferpraktiken aus seiner eigenen antiken Perspektive. Die Übersetzung soll diese Spannung bewahren, aber keine über den Wortlaut hinausgehende konfessionelle oder antijüdische Zuspitzung einführen.
- issue: Gottes Bedürfnislosigkeit
  choice: „der nichts nötig hat“
  alternative: „der keiner Opfer bedarf“
  rationale: Die weitere Formulierung entspricht dem Argument des Abschnitts und beschränkt Gottes Bedürfnislosigkeit nicht nur auf Opfer.
- issue: Bezug von „die einen“ und „die anderen“
  choice: Die einen beziehen sich auf Verehrer von Bildern, die anderen auf diejenigen, die dem bedürfnislosen Gott Opfer bringen.
  alternative: Beide Gruppen ausdrücklich ethnisch als Griechen und Juden bezeichnen.
  rationale: Die pronominale Gegenüberstellung des Zeugnisses bleibt erhalten und vermeidet eine unnötige Wiederholung oder Verschärfung.
translation_notes:
  register: Moderne standarddeutsche Prosa mit würdigem frühchristlichem Ton. Das vertrauliche Singularpronomen „du“ folgt der direkten Anrede des Zeugnisses. Satzbau und Terminologie bleiben argumentativ präzise, ohne unnötige Archaismen. Da kein griechischer Ausgangstext vorgelegt wurde und die Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf quellenkritisch als Übertragung auf Grundlage des angegebenen englischen Zeugnisses zu verstehen.
