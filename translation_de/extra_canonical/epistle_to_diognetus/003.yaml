base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: de
  text: 'Als Nächstes, so denke ich, möchtest du vor allem hören, warum sie ihre Gottesverehrung nicht auf dieselbe Weise ausüben wie die Juden.


    Die Juden handeln nun zwar richtig, wenn sie die zuvor beschriebene Art der Verehrung meiden und den einen Gott des Weltalls zu verehren und als Herrn anzuerkennen beanspruchen. Wenn sie ihm aber ihre Verehrung auf ähnliche Weise darbringen wie die zuvor Genannten, irren sie völlig.


    Denn die Griechen stellen ihre Torheit zur Schau, indem sie solche Gaben empfindungslosen und tauben Bildern darbringen. Die Juden aber meinen, sie brächten sie Gott dar, als hätte er sie nötig; daher sollten sie dies vernünftigerweise für Torheit halten und nicht für Gottesverehrung.


    Denn der, welcher Himmel und Erde und alles darin geschaffen hat und uns alle mit dem versorgt, was wir brauchen, kann selbst nichts von dem nötig haben, was er denen schenkt, die sich einbilden, es ihm zu geben.


    Diejenigen aber, die meinen, ihm mit Blut, Fett und Ganzbrandopfern Opfer darzubringen und ihn durch solche Ehrengaben zu ehren, unterscheiden sich meines Erachtens in nichts von denen, die tauben Bildern dieselbe Ehre erweisen. Denn die einen halten es für angemessen, Dingen Gaben darzubringen, die an der Ehre keinen Anteil haben können; die anderen bringen sie dem dar, der nichts nötig hat.'
