base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: de
  text: 'Doch ihre Bedenken hinsichtlich der Speisen, ihr Aberglaube in Bezug auf den Sabbat, die Nichtigkeit ihrer Beschneidung und die Verstellung bei ihrem Fasten und ihren Neumondfeiern sind lächerlich und keiner Beachtung wert; ich glaube [nicht],[a] dass du dies erst von mir erfahren musst.


    Denn von dem, was Gott zum Gebrauch für den Menschen geschaffen hat, das eine als gut geschaffen anzunehmen, das andere aber als nutzlos und überflüssig abzulehnen – ist das nicht gottlos?


    Und wiederum Gott etwas Unwahres zuzuschreiben, als hätte er verboten, am Sabbat irgendetwas Gutes zu tun – ist das nicht frevelhaft?


    Und sich der Verstümmelung des Fleisches als Zeichen der Erwählung zu rühmen, als wären sie gerade deshalb von Gott besonders geliebt – ist das nicht lächerlich?


    Und Sterne und Mond zu beobachten, Monate und Tage einzuhalten und Gottes Ordnungen und den Wechsel der Zeiten nach eigenem Gutdünken einzuteilen, indem man die einen zu Festzeiten, die anderen zu Trauerzeiten macht – wer würde darin einen Ausdruck von Gottesfurcht sehen und nicht vielmehr von Torheit?


    Dass die Christen also recht daran tun, sich von der allgemeinen Torheit und Verirrung der Juden sowie von ihrer übertriebenen Kleinlichkeit und ihrem Stolz fernzuhalten, darüber bist du meines Erachtens hinreichend unterrichtet worden.[b] Was jedoch das Geheimnis ihres eigenen Glaubens betrifft, so erwarte nicht, dass ein Mensch dich darüber belehren könne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das in eckigen Klammern stehende „nicht“ ist im überlieferten englischen Textzeugen als Ergänzung gekennzeichnet; eine unmittelbare Prüfung am griechischen Wortlaut steht noch aus.
    reason: Textkritische Unsicherheit muss sichtbar bleiben.
  - marker: b
    text: Die pauschale und scharf abwertende Darstellung jüdischer Bräuche gehört zur Polemik des antiken Verfassers und gibt nicht die redaktionelle Haltung dieser Ausgabe wieder.
    reason: Historischen Wortlaut bewahren und zugleich den problematischen Charakter der Verallgemeinerung kenntlich machen.
lexical_decisions:
- source_word: meats (Greek source review pending)
  choice: Speisen
  rationale: Im Kontext geht es um religiöse Speisevorschriften; „Speisen“ ist würdevoll und im heutigen Deutsch klarer als „Fleisch“.
- source_word: superstition
  choice: Aberglaube
  rationale: Bewahrt die ausdrücklich polemische Wertung des antiken Autors, ohne sie abzuschwächen.
- source_word: dissimulation
  choice: Verstellung
  rationale: Gibt den Vorwurf des unechten oder nur vorgetäuschten Vollzugs wieder; die genaue griechische Grundlage ist noch zu prüfen.
- source_word: token of election
  choice: Zeichen der Erwählung
  rationale: Bewahrt die theologische Begrifflichkeit und lässt offen, wie der Autor Erwählung im Einzelnen versteht.
- source_word: arrangements of God
  choice: Gottes Ordnungen
  rationale: Bezeichnet die von Gott gesetzte Ordnung von Zeiten und Jahreslauf, ohne eine weitergehende Lehre einzutragen.
- source_word: religion
  choice: Glauben
  rationale: Natürliches modernes Deutsch im Zusammenhang mit dem „Geheimnis“ der christlichen Gottesverehrung; „Religion“ wäre möglich, klingt hier aber distanzierter.
theological_decisions:
- issue: Polemik gegen jüdische Praxis
  choice: Die scharfen Urteile des historischen Autors werden sachgetreu bewahrt und nicht als redaktionelle Aussagen verallgemeinert.
  alternative: Die Polemik durch neutralere Formulierungen abzuschwächen.
  rationale: Eine Übersetzung soll die historische Stimme erkennbar wiedergeben, darf ihre problematische Pauschalisierung aber nicht verschleiern.
- issue: Gutes tun am Sabbat
  choice: „irgendetwas Gutes zu tun“
  alternative: „ein gutes Werk zu tun“
  rationale: Die Formulierung bewahrt den umfassenden Sinn und vermeidet eine konfessionell geprägte Kategorie von „guten Werken“.
- issue: Unterweisung im Geheimnis des christlichen Glaubens
  choice: „dass ein Mensch dich darüber belehren könne“
  alternative: „dass du von einem Menschen unterrichtet werden kannst“
  rationale: Bewahrt die Spannung der Aussage, ohne vorwegzunehmen, auf welche Weise die folgende Offenbarung oder Unterweisung erfolgt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die rhetorischen Fragen und die argumentative Zuspitzung bleiben erhalten. Da ein unmittelbarer griechischer Ausgangstext nicht mitgeliefert wurde und die Prüfung der Ausgangssprache ausdrücklich noch aussteht, ist dies ein vorläufiger, am öffentlichen englischen Textzeugen kontrollierter Entwurf. Die Anrede erfolgt mit „du“, entsprechend der singularischen Anrede des Zeugen.
