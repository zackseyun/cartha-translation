review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem englischen Zeugnis überwiegend eng. Mehrere Formulierungen verschieben jedoch den Sinn: „questions“ ist hier nicht einfach „Fragen“, „as they present themselves“ bedeutet nicht „sich erweisen“, und „believed in by the Gentiles“ ist nicht bloß „unter den Völkern geglaubt“. Die personalen Bezüge des Logos sollten im Deutschen, wo der Kontext ausdrücklich den Sohn nennt, nicht durch konsequent sächliches „es“ verwischt werden. Die griechische Direktprüfung steht laut Kontext weiterhin aus; die Revision bleibt daher bewusst zeugnisgebunden.'
  naturalness: Der Stil ist würdig und gut verständlich. „in Freundschaft mit dem Wort getreten“ wirkt etwas schwerfällig; „Freundschaft mit dem Wort geschlossen hat“ ist idiomatischer. „in den Herzen der Heiligen wird es stets jung hervorgebracht“ ist unnatürlich und suggeriert ein Hervorbringen durch andere; „in den Herzen der Heiligen immer neu geboren wird“ bildet die Bildsprache klarer ab. „zu Teilhabern mit euch“ sollte zu „zu euren Teilhabern“ geglättet werden.
  terminology: „das Wort“, „die Völker“, „Geheimnisse“, „Ehrfurcht vor dem Gesetz“ und „Überlieferung der Apostel“ sind angemessen. „Unterpfänder“ ist im heutigen Standarddeutsch unnötig archaisch und semantisch enger als „pledges“; „Bürgschaften des Glaubens“ bewahrt das ungewöhnliche Bild. Die Großschreibung personaler Pronomina für das Wort dient hier der eindeutigen Referenz und ist als ehrender frühchristlicher Registergebrauch vertretbar, ohne eine zusätzliche Lehraussage einzutragen.
  issues:
  - severity: medium
    issue: „meine Fragen“ für „perverse questionings“
    rationale: „Questionings“ bezeichnet hier eher problematisierende bzw. verkehrte Streitfragen/Spekulationen als neutrale Fragen. Die Verbindung mit „strange discourses“ verlangt eine parallele Bezeichnung für Lehrrede bzw. Untersuchung.
  - severity: medium
    issue: „die sich als Schüler der Wahrheit erweisen“
    rationale: 'Das englische Zeugnis sagt „as they present themselves [as] disciples of truth“: Es geht um diejenigen, die sich als solche darbieten bzw. dazu bereitfinden, nicht um eine bereits erwiesene Echtheit.'
  - severity: medium
    issue: „unter den Völkern geglaubt“
    rationale: Die passive Konstruktion „was believed in by the Gentiles“ besagt, dass die Völker an ihn glaubten. „Unter den Völkern geglaubt“ kann unpersönlich und deutlich schwächer verstanden werden.
  - severity: medium
    issue: Sächliche Pronomina bei ausdrücklicher Sohn- und Lehrertätigkeit
    rationale: 'Das deutsche Neutrum von „Wort“ ist grammatisch möglich, verdeckt aber in diesem Abschnitt die im Zeugnis klar personale Referenz: Das Wort erscheint, spricht, wird verachtet, verkündigt und geglaubt; anschließend wird es als Sohn bezeichnet. Personale Pronomina schaffen Klarheit.'
  - severity: low
    issue: „heute wurde es als Sohn anerkannt“
    rationale: „Accounted“ ist eher „galt/wurde als ... angesehen“ als eine formale Anerkennung. Die zeitlich auffällige Aussage bleibt mehrdeutig und benötigt weiterhin eine zurückhaltende Anmerkung.
  - severity: low
    issue: „Unterpfänder des Glaubens“
    rationale: Das Wort ist heute selten und kann einen Pfandgegenstand meinen. „Bürgschaften des Glaubens“ bewahrt die bildhafte und möglicherweise technische Offenheit besser.
  revised_text: 'Meine Darlegungen sind weder fremdartig noch verkehrte Streitfragen. Vielmehr trete ich, nachdem ich ein Schüler der Apostel geworden bin, als Lehrer der Völker hervor und vermittle in angemessener Weise denen, die sich als Schüler der Wahrheit darbieten, die überlieferten Lehren.


    Denn wer, recht unterwiesen und mit dem Wort in Freundschaft getreten, sucht nicht, die Lehren klar zu erkennen, die das Wort den Jüngern offen enthüllt hat? Ihnen erschien das Wort und legte sie dar, indem es offen sprach. Von den Ungläubigen wurde es nicht erkannt; den Jüngern aber teilte es sie mit. Sie galten Ihm als treu und wurden in die Geheimnisse des Vaters eingeweiht.


    Deshalb sandte Er das Wort aus, damit Es der Welt erscheine. Vom Volk wurde Es verachtet, durch die Apostel verkündigt und von den Völkern geglaubt.


    Dieses Wort, das von Anfang an war, das als neu erschien und sich doch als alt erwies und in den Herzen der Heiligen immer neu geboren wird,


    ist, sage ich, ewig; heute galt Es als Sohn.[a] Durch Ihn wird die Kirche reich gemacht, und die Gnade entfaltet und vervielfacht sich unter den Heiligen: eine Gnade, die Einsicht schenkt, Geheimnisse offenbart, Zeiten ankündigt, sich über die Gläubigen freut und denen zuteilwird, die sie suchen – denen, die die Bürgschaften des Glaubens nicht brechen und die Grenzen der Väter nicht überschreiten.[b]


    Darum wird die Ehrfurcht vor dem Gesetz besungen, die Gnade der Propheten erkannt, der Glaube der Evangelien gefestigt, die Überlieferung der Apostel bewahrt, und die Freude der Kirche jubelt.


    Wenn du diese Gnade nicht betrübst, wirst du die Darlegungen verstehen, die das Wort durch den Mund derer vorträgt, die Es will, wann immer Es will.


    Denn in allem, was wir nach dem Willen des gebietenden Wortes unter großer Mühe auszusprechen bewegt wurden, werden wir durch die Liebe zu dem, was uns offenbart worden ist, zu euren Teilhabern.'
  revised_footnotes:
  - marker: a
    text: Die Formulierung „heute galt Es als Sohn“ ist im überlieferten Wortlaut auffällig. Sie lässt sich hier nicht sicher auf einen bestimmten Zeitpunkt oder eine bestimmte Art der Sohnschaft festlegen; die direkte Prüfung des griechischen Textes steht noch aus.
    reason: Bewahrt die zeitlich und theologisch gewichtige, im zugrunde gelegten Zeugnis mehrdeutige Aussage, ohne sie dogmatisch zu harmonisieren.
  - marker: b
    text: „Bürgschaften des Glaubens“ und „Grenzen der Väter“ geben ungewöhnliche Bilder des überlieferten Wortlauts wieder. Gemeint sein können verbindliche Zusagen des Glaubens und von den Vorgängern überlieferte Grenzen; der genaue Bezug bleibt offen.
    reason: Erläutert die schwierige Bildsprache, ohne eine konfessionell bestimmte Deutung festzulegen.
  revision_rationale: Die Revision korrigiert sichere Sinnverschiebungen gegenüber dem bereitgestellten englischen Zeugnis, insbesondere bei „questionings“, der Selbstpräsentation der Lernenden und dem Glauben der Völker. Sie macht die im Absatz eindeutig personale Referenz des Wortes im Deutschen nachvollziehbar, ohne die problematische Aussage über das „Heute“ auszudeuten. Zugleich werden einzelne unidiomatische oder unnötig archaische Formulierungen modernisiert und die vorhandenen Fußnoten an die revidierte Wortwahl angepasst.
