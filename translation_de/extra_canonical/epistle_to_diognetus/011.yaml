base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: de
  text: 'Meine Darlegungen sind weder fremdartig noch meine Fragen verkehrt. Vielmehr trete ich, nachdem ich ein Schüler von Aposteln gewesen bin, als Lehrer der Völker hervor und vermittle denen, die sich als Schüler der Wahrheit erweisen, in angemessener Weise die überlieferten Lehren.


    Denn wer, der recht unterwiesen worden und in Freundschaft mit dem Wort getreten ist, sucht nicht, die Lehren klar zu erkennen, die das Wort den Jüngern offen enthüllt hat? Ihnen erschien das Wort und verkündete sie, indem es frei und offen sprach. Von den Ungläubigen wurde es nicht erkannt; den Jüngern aber teilte es diese Dinge mit. Sie wurden von ihm als treu angesehen und in die Geheimnisse des Vaters eingeweiht.


    Deshalb sandte er das Wort aus, damit es der Welt erscheine. Vom Volk wurde es verachtet, durch die Apostel verkündigt und unter den Völkern geglaubt.


    Dieses Wort war von Anfang an. Es erschien als neu und erwies sich doch als alt; und in den Herzen der Heiligen wird es stets jung hervorgebracht.


    Dieses Wort, sage ich, ist ewig; heute wurde es als Sohn anerkannt.[a] Durch es wird die Kirche reich gemacht, und die Gnade entfaltet und vervielfacht sich unter den Heiligen: eine Gnade, die Einsicht schenkt, Geheimnisse offenbart, Zeiten ankündigt, sich über die Gläubigen freut und denen zuteilwird, die sie suchen – denen, die die Unterpfänder des Glaubens nicht brechen und die Grenzen der Väter nicht überschreiten.[b]


    So wird die Ehrfurcht vor dem Gesetz besungen, die Gnade der Propheten erkannt, der Glaube der Evangelien gefestigt, die Überlieferung der Apostel bewahrt, und die Freude der Kirche jubelt.


    Wenn du diese Gnade nicht betrübst, wirst du die Darlegungen verstehen, die das Wort durch den Mund derer vorträgt, die es erwählt, wann immer es will.


    Denn in allem, was wir nach dem Willen des gebietenden Wortes unter großer Mühe auszusprechen bewegt wurden, werden wir aus Liebe zu dem, was uns offenbart worden ist, zu Teilhabern mit euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „heute wurde es als Sohn anerkannt“ ist im überlieferten Wortlaut auffällig. Sie kann hier nicht sicher auf einen bestimmten Zeitpunkt oder eine bestimmte Art der Sohnschaft festgelegt werden; die direkte Prüfung des griechischen Textes steht noch aus.
    reason: Bewahrt eine theologisch gewichtige und textlich schwierige Aussage, ohne sie vorschnell zu harmonisieren.
  - marker: b
    text: „Unterpfänder des Glaubens“ und „Grenzen der Väter“ geben ungewöhnliche Bilder des überlieferten Wortlauts wieder. Gemeint sein können die verbindlichen Zusagen des Glaubens und die von den Vorgängern überlieferten Grenzen; der genaue Bezug bleibt offen.
    reason: Erklärt schwer verständliche Bildsprache und kennzeichnet echte semantische Unsicherheit.
lexical_decisions:
- source_word: 'Word (Greek source presumed: Logos)'
  choice: das Wort
  rationale: Bewahrt den etablierten johanneischen und frühchristlichen Titel und lässt die personale Bedeutung durch den Zusammenhang hervortreten.
- source_word: Gentiles
  choice: die Völker / unter den Völkern
  rationale: Das natürliche deutsche frühchristliche Äquivalent vermeidet die heute häufig abwertend klingende Bezeichnung „Heiden“.
- source_word: discourses
  choice: Darlegungen
  rationale: Passt sowohl zu mündlicher Unterweisung als auch zum vorliegenden schriftlichen Lehrtext, ohne den Sinn auf Predigten einzuengen.
- source_word: mysteries
  choice: Geheimnisse
  rationale: Gibt den Offenbarungscharakter wieder, ohne unnötig einen späteren sakramentalen Fachbegriff einzutragen.
- source_word: pledges of faith
  choice: Unterpfänder des Glaubens
  rationale: Bewahrt die ungewöhnliche und möglicherweise technische Bildsprache des überlieferten Zeugnisses, statt sie spekulativ zu glätten.
- source_word: fear of the law
  choice: Ehrfurcht vor dem Gesetz
  rationale: „Ehrfurcht“ vermittelt im modernen Deutsch die religiöse Bedeutung besser als bloße Angst, ohne die Spannung der Formulierung aufzulösen.
theological_decisions:
- issue: Referenz des Sendenden in „He sent forth the Word“
  choice: „er sandte das Wort aus“ mit kleingeschriebenem Pronomen
  alternative: „Er sandte das Wort aus“, ausdrücklich auf Gott den Vater bezogen
  rationale: Das englische Zeugnis lässt den Bezug syntaktisch offen. Die Übersetzung vermeidet eine zusätzliche explizite Identifikation, während der Kontext die Beziehung zwischen Vater und Wort erkennen lässt.
- issue: „Today He was accounted a Son“
  choice: „heute wurde es als Sohn anerkannt“
  alternative: „heute gilt es als Sohn“ oder „heute wurde es Sohn genannt“
  rationale: Die auffällige zeitliche Aussage wird nicht zu einer dogmatisch eindeutigen Aussage über ewige Sohnschaft oder zeitliche Zeugung umgedeutet. Eine Fußnote weist auf die Unsicherheit hin.
- issue: Personales Genus des Wortes
  choice: Das grammatisch sächliche „es“ für „das Wort“
  alternative: Personalisierendes „er“ trotz des deutschen Neutrums
  rationale: Das deutsche Genus wird natürlich beibehalten; die Titel „Sohn“ und „ewig“ sichern zugleich die personale Aussage.
- issue: Grenzen der Väter
  choice: Bildhafte Formulierung unverändert bewahrt
  alternative: Auslegung als apostolische Tradition oder kirchliche Lehrgrenzen
  rationale: Der Ausdruck kann überlieferte Glaubensgrenzen meinen, doch eine konfessionell bestimmte Präzisierung wäre nicht durch das Zeugnis gedeckt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit frühchristlichem Lehrton. Die Anrede wechselt entsprechend dem Zeugnis vom einzelnen „du“ zum gemeinschaftlichen „euch“. Wegen des verlorenen Codex Argentoratensis und der noch ausstehenden direkten Prüfung des griechischen Quelltexts ist der Entwurf ausdrücklich zeugnisgebunden und vorläufig; ungesicherte syntaktische und theologische Fragen wurden nicht stillschweigend geglättet.
