base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: de
  text: 'Wenn auch du diesen Glauben wünschst, dann erlange zuerst die volle Erkenntnis des Vaters.


    Denn Gott liebte die Menschen, um derentwillen er die Welt erschuf. Ihnen unterwarf er alles auf der Erde; ihnen gab er Vernunft und Verstand; allein ihnen gestattete er, zum Himmel aufzublicken; sie erschuf er nach seinem eigenen Bild; zu ihnen sandte er seinen einziggezeugten Sohn; ihnen verhieß er das Reich im Himmel, und er wird es denen geben, die ihn geliebt haben.


    Und wenn du zu dieser vollen Erkenntnis gelangt bist: Von welcher Freude, meinst du, wirst du erfüllt werden? Und wie wirst du den lieben, der dich zuerst so sehr geliebt hat?


    Indem du ihn liebst, wirst du seine Güte nachahmen. Wundere dich nicht darüber, dass ein Mensch Gott nachahmen kann. Er kann es, wenn Gott es will.


    Denn das Glück besteht nicht darin, über seine Mitmenschen zu herrschen, mehr besitzen zu wollen als die Schwächeren, Reichtum zu haben oder gegen Unterlegene Gewalt anzuwenden. Darin kann niemand Gott nachahmen; vielmehr liegt all dies außerhalb seiner Größe.


    Wer aber die Last seines Mitmenschen auf sich nimmt, wer einem schlechter Gestellten mit dem helfen will, worin er selbst bessergestellt ist, und wer Bedürftige mit Gütern versorgt, die er von Gott empfangen hat, und so für die Empfänger zu einem Gott wird – der ahmt Gott nach.[a]


    Dann wirst du, obwohl du auf der Erde lebst, erkennen, dass Gott im Himmel lebt. Dann wirst du beginnen, die Geheimnisse Gottes zu verkünden. Dann wirst du jene lieben und bewundern, die bestraft werden, weil sie Gott nicht verleugnen wollen. Dann wirst du den Betrug und den Irrtum der Welt verurteilen: wenn du das wahre Leben erkennst, das im Himmel ist; wenn du den scheinbaren Tod verachtest, der hier auf der Erde ist; und wenn du den wirklichen Tod fürchtest, der denen vorbehalten ist, die zum ewigen Feuer verurteilt werden – dem Feuer, das die ihm Ausgelieferten bis ans Ende bestrafen wird.[b]


    Dann wirst du jene bewundern, die um der Gerechtigkeit willen das Feuer ertragen, das nur eine Zeit lang währt, und du wirst sie glücklich preisen, wenn du jenes Feuer erkennst …[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die Empfänger zu einem Gott wird“. Die Formulierung ist eine starke bildhafte Aussage über denjenigen, der von Gott empfangene Güter den Bedürftigen weitergibt; der Text erläutert das Verhältnis nicht weiter.'
    reason: Bewahrt die auffällige Metapher des Ausgangstextes, ohne sie durch eine theologische Festlegung abzuschwächen oder auszudeuten.
  - marker: b
    text: Der Text verbindet „ewiges Feuer“ mit der Wendung „bis ans Ende“. Diese zeitliche Spannung wird hier nicht aufgelöst.
    reason: Bewahrt die semantische und theologische Spannung der Vorlage.
  - marker: c
    text: Der überlieferte Abschnitt bricht an dieser Stelle ab; die Auslassungspunkte kennzeichnen den unvollständigen Schluss.
    reason: Signalisiert den im vorgelegten Text nicht erhaltenen Fortgang.
lexical_decisions:
- source_word: full knowledge
  choice: volle Erkenntnis
  rationale: Gibt den erkenntnisbezogenen und religiösen Gehalt würdig und verständlich wieder, ohne ihn auf bloßes Wissen zu reduzieren.
- source_word: only begotten Son
  choice: einziggezeugten Sohn
  rationale: Bewahrt die traditionelle christologische Aussage des Zeugen genauer als das bloße „einzigen Sohn“, ohne eine konfessionelle Auslegung hinzuzufügen.
- source_word: imitator
  choice: ahmt … nach / nachahmen
  rationale: Natürliches modernes Deutsch, das die ethische Nachfolge beziehungsweise Angleichung ausdrückt.
- source_word: becomes a God to those who receive
  choice: für die Empfänger wie ein Gott wird
  rationale: Bewahrt die auffällige Bildsprache, während „wie“ im Deutschen verdeutlicht, dass eine funktionale Analogie und keine Wesensvergöttlichung ausgesagt wird.
- source_word: mysteries
  choice: Geheimnisse
  rationale: „Geheimnisse Gottes“ ist allgemeinverständlich und erhält die religiöse Tiefe, ohne unnötig den fachsprachlichen Ausdruck „Mysterien“ zu verwenden.
- source_word: righteousness’ sake
  choice: um der Gerechtigkeit willen
  rationale: Bewahrt die biblisch-frühchristliche Formulierung und ihre mögliche ethische wie theologische Weite.
theological_decisions:
- issue: Fehlendes oder unklar überliefertes Objekt in „For God loved …“
  choice: „Gott liebte die Menschen“ mit Fußnote
  alternative: „Gott liebte diejenigen“ oder eine syntaktisch fragmentarische Wiedergabe
  rationale: Der folgende Relativsatz beschreibt offenkundig die Menschheit. „Die Menschen“ macht den deutschen Satz verständlich, wird aber wegen der unsicheren Textgrundlage ausdrücklich als Ergänzung kenntlich gemacht.
- issue: Nachahmung Gottes
  choice: Die Spannung „Ein Mensch kann Gott nachahmen, wenn Gott es will“ bleibt unverändert bestehen.
  alternative: Ausdeutung als ausschließlich moralische Nachfolge oder als Vergöttlichung
  rationale: Der Text selbst verbindet göttliche Ermöglichung und menschliches Handeln, ohne das Verhältnis systematisch zu erklären.
- issue: „wie ein Gott“ gegenüber Bedürftigen
  choice: Bildhafte Aussage beibehalten und durch „wie“ als Analogie formulieren
  alternative: Abschwächung zu „wird zum Wohltäter“ oder wörtlich „wird ein Gott“
  rationale: Die starke theologische Rhetorik soll hörbar bleiben, ohne im modernen Deutsch eine ontologische Gleichsetzung nahezulegen.
- issue: Ewiges Feuer und „bis ans Ende“
  choice: Beide Formulierungen nebeneinander bewahren
  alternative: „für immer“ harmonisierend einsetzen oder die zeitliche Spannung auflösen
  rationale: Der Zeuge enthält sowohl „ewig“ als auch „bis ans Ende“. Die mögliche Spannung wird nicht dogmatisch entschieden.
- issue: Abgebrochener Schluss
  choice: Auslassungspunkte erhalten und textkritisch erläutern
  alternative: Den vermuteten Fortgang ergänzen
  rationale: Der vorgelegte Zeuge endet unvollständig; eine Rekonstruktion wäre ohne griechische Quellenprüfung spekulativ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular („du“), entsprechend dem antiken Adressatenbezug. Die langen rhetorischen Reihen wurden weitgehend bewahrt, aber durch moderne Zeichensetzung lesbar gegliedert. Der Entwurf beruht mangels bereitgestellten griechischen Wortlauts auf dem öffentlichen englischen Zeugen; eine direkte Prüfung der griechischen Überlieferung bleibt erforderlich.
