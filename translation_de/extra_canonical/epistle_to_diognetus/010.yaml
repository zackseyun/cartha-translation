    rationale: Im griechischen Text steht ἀνθρώπους („Menschen“) als Objekt von „Gott liebte“. Die Auslassung betrifft den vorliegenden englischen Zeugen, nicht die maßgebliche griechische Formulierung.
  - severity: low
    issue: „begehrst“
    rationale: Das Wort ist verständlich, klingt im anvisierten modernen Standarddeutsch aber unnötig altertümlich.
