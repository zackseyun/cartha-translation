base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: de
  text: 'Christen unterscheiden sich von den übrigen Menschen weder durch ihren Wohnort noch durch ihre Sprache oder ihre Lebensgewohnheiten.


    Denn sie wohnen nicht in eigenen Städten, bedienen sich keiner besonderen Sprache und führen auch keine außergewöhnliche Lebensweise.


    Ebenso beruht ihre Lehre nicht auf einer Erfindung, die aus dem Scharfsinn oder den Forschungen einfallsreicher Menschen hervorgegangen wäre; auch treten sie nicht wie manche andere als Vertreter einer menschlichen Lehrmeinung auf.


    Vielmehr wohnen sie in griechischen und nichtgriechischen Städten, wie es sich für jeden ergeben hat, und richten sich in Kleidung, Nahrung und der übrigen Lebensführung nach den örtlichen Bräuchen. Dabei zeigen sie eine Lebensordnung als Bürger, die erstaunlich ist und offenkundig allen Erwartungen widerspricht.


    Sie wohnen in ihrem jeweiligen Heimatland, doch nur wie Menschen auf der Durchreise. Als Bürger haben sie an allem Anteil, und doch ertragen sie alles wie Fremde. Jedes fremde Land ist ihnen Heimat, und jede Heimat ist ihnen fremd.


    Sie heiraten wie alle anderen und bekommen Kinder; doch sie setzen ihre Kinder nicht aus.[a]


    Sie teilen den Tisch, nicht aber das Bett.[b]


    Sie leben im Fleisch, doch nicht nach dem Fleisch.[c]


    Sie leben auf der Erde, doch ihr Bürgerrecht ist im Himmel.


    Sie gehorchen den geltenden Gesetzen und übertreffen zugleich durch ihr eigenes Leben, was die Gesetze fordern.


    Sie lieben alle Menschen und werden von allen verfolgt.


    Man kennt sie nicht, und doch verurteilt man sie. Sie werden getötet, und doch werden sie mit Leben beschenkt.


    Sie sind arm und machen doch viele reich. Ihnen fehlt alles, und doch haben sie an allem Überfluss.


    Sie werden entehrt und gerade in ihrer Entehrung verherrlicht. Man redet schlecht über sie, und doch wird ihre Unschuld erwiesen.


    Sie werden beschimpft und segnen; sie werden beleidigt und erweisen Achtung.


    Sie tun Gutes und werden dafür wie Übeltäter bestraft. Wenn sie bestraft werden, freuen sie sich, als würden sie dadurch zum Leben erweckt.


    Die Juden bekämpfen sie als Fremde, und die Griechen verfolgen sie; doch keiner von denen, die sie hassen, kann den Grund für diese Feindschaft nennen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die in der Antike bekannte Praxis, unerwünschte Neugeborene auszusetzen und ihrem Schicksal zu überlassen.
    reason: Historischer Kontext ist nötig, weil „aussetzen“ heute leicht nur als Verlassen an einem Ort verstanden wird.
  - marker: b
    text: Die Gegenüberstellung betont gemeinsame Mahlzeiten, nicht aber sexuelle oder eheliche Gemeinschaft.
    reason: Der knappe antike Kontrast lautet „Tisch“ und „Bett“; die Erläuterung verhindert eine Fehllektüre, ohne das Bild auf eine einzelne moderne Formulierung einzuengen.
  - marker: c
    text: „Fleisch“ bezeichnet hier nicht bloß den Körper. Die Wendung stellt das leibliche Leben einer Lebensweise gegenüber, die sich nicht vom „Fleisch“ bestimmen lässt; der genaue Bedeutungsumfang bleibt bewusst offen.
    reason: Bewahrt die genuine theologische Mehrdeutigkeit und verhindert eine körperfeindliche Engführung.
lexical_decisions:
- source_word: barbarians
  choice: nichtgriechisch
  rationale: Im antiken griechischen Sprachgebrauch bezeichnet der Ausdruck vor allem Menschen beziehungsweise Städte außerhalb der griechischen Sprach- und Kulturwelt. „Nichtgriechisch“ vermeidet die heute abwertende Bedeutung von „barbarisch“.
- source_word: constitution of their own citizenship
  choice: Lebensordnung als Bürger
  rationale: Die Formulierung wahrt sowohl den Gedanken einer geordneten Lebensweise als auch das wiederkehrende Motiv von Bürgerschaft und Bürgerrecht.
- source_word: sojourners
  choice: Menschen auf der Durchreise
  rationale: Gibt den vorläufigen, nicht voll heimischen Status in verständlichem modernem Deutsch wieder, ohne eine rein touristische Bedeutung nahezulegen.
- source_word: cast away their offspring
  choice: setzen ihre Kinder nicht aus
  rationale: Bezeichnet die antike Praxis der Kindesaussetzung konkreter und historisch zutreffender als das allgemeinere „verstoßen“.
- source_word: in the flesh / after the flesh
  choice: im Fleisch / nach dem Fleisch
  rationale: Die bewusst parallele, theologisch aufgeladene Ausdrucksweise bleibt erhalten; eine freie Auflösung würde die Mehrdeutigkeit beseitigen.
- source_word: citizenship
  choice: Bürgerrecht
  rationale: Bewahrt das politische Bild der himmlischen Zugehörigkeit und klingt im Deutschen natürlicher als „Bürgerschaft“ in diesem Satz.
- source_word: Greeks
  choice: Griechen
  rationale: Der historische Ausdruck wird beibehalten; im Schlusskontrast kann er je nach Kontext nichtjüdische Bewohner der griechisch-römischen Welt bezeichnen.
theological_decisions:
- issue: Himmlisches Bürgerrecht bei irdischem Leben
  choice: „Sie leben auf der Erde, doch ihr Bürgerrecht ist im Himmel.“
  alternative: „Ihr Dasein ist auf Erden, ihr Gemeinwesen aber im Himmel.“
  rationale: Die Übersetzung bewahrt die Spannung zwischen gegenwärtigem irdischem Dasein und himmlischer Zugehörigkeit, ohne daraus eine Abwertung des irdischen Lebens abzuleiten.
- issue: Leben im beziehungsweise nach dem Fleisch
  choice: Die traditionelle Bildsprache wird wörtlich bewahrt.
  alternative: „Sie haben einen Körper, leben aber nicht nach körperlichen Begierden.“
  rationale: Die Alternative würde „Fleisch“ vorschnell auf Körperlichkeit oder Begierde verengen. Der Text lässt eine breitere moralisch-theologische Bedeutung zu.
- issue: Tod und verliehenes Leben
  choice: „Sie werden getötet, und doch werden sie mit Leben beschenkt.“
  alternative: „Sie werden getötet und dennoch lebendig gemacht.“
  rationale: „Mit Leben beschenkt“ wahrt die passive, empfangene Dimension und lässt offen, ob Auferstehung, geistliches Leben oder die paradoxe Lebenskraft der Gemeinschaft im Vordergrund steht.
- issue: Pauschale Aussagen über Juden, Griechen und Verfolger
  choice: Die historische Rhetorik wird übersetzt, ohne sie zu verallgemeinern oder zu verschärfen.
  alternative: Die Gruppenbezeichnungen durch allgemeinere Wörter wie „manche Gegner“ ersetzen.
  rationale: Eine Ersetzung würde den überlieferten historischen Wortlaut verdecken. Der Satz beschreibt die Perspektive des antiken Verfassers und darf nicht als zeitlose Zuschreibung an ganze heutige Bevölkerungsgruppen gelesen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, rhythmischem Ton. Die Folge kurzer antithetischer Sätze wurde bewahrt. Archaismen wurden vermieden, während zentrale frühchristliche Bilder wie „Fleisch“, „Bürgerrecht“ und „Heimat/Fremde“ erhalten bleiben. Da kein griechischer Text bereitgestellt wurde und die direkte Prüfung der antiken Sprache ausdrücklich noch aussteht, ist der Entwurf quellenkritisch vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Zeugen sowie die auditierte englische POB-Konsultationsschicht.
