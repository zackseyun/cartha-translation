  verdict: revise
  source_fidelity: Eine sichere Korrektur ist bei „Sie teilen ihren Tisch, aber nicht ihre Frauen“ nötig. Der überlieferte griechische Kontrast lautet wörtlich Tisch gegenüber Bett (τράπεζα / κοίτη), nicht Tisch gegenüber Frauen. Die revidierte Fassung wahrt die prägnante Antithese, ohne den Begriff voreilig auf „Frauen“ einzuengen. Im Übrigen folgt der Text dem vorliegenden englischen Zeugen zuverlässig; die Benennung „nichtgriechisch“ gibt den antiken Gegenbegriff zu „Griechen“ sachgerecht und ohne die moderne abwertende Nebenbedeutung von „barbarisch“ wieder.
  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch und bewahrt die knappe antithetische Struktur. „Sie teilen den Tisch, nicht aber das Bett“ ist idiomatisch, prägnant und dem Register angemessen.
  terminology: Die Leitbegriffe „Fleisch“, „Bürgerrecht“, „Heimat“ und „Fremde“ sind konsistent und ohne konfessionelle Einengung wiedergegeben. Die Fußnote zu „Fleisch“ bewahrt den offenen Bedeutungsumfang. Die Fußnote zur Tisch-/Bett-Antithese wird sachlich korrigiert, da kein Wortspiel behauptet werden sollte.
  issues:
  - severity: medium
    issue: „Frauen“ statt „Bett“ in der Tisch-Antithese
    rationale: Der Quelltext kontrastiert τράπεζα („Tisch“) mit κοίτη („Bett“). „Frauen“ ist eine interpretierende Verschiebung und die zugehörige Fußnote behauptet zudem unzutreffend ein Wortspiel. „Bett“ erhält die rhetorische und semantische Offenheit des Originals.
