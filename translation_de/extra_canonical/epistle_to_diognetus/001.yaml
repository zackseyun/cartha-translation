  english_witness: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: de
  text: 'Hochgeehrter Diognetus! Ich sehe, wie sehr du danach verlangst, die Gottesverehrung der Christen zu verstehen, und wie klar und sorgfältig du dich über sie erkundigst: Welchem Gott vertrauen sie, und wie verehren sie ihn? Dass sie alle die Welt geringachten und den Tod verachten, dass sie diejenigen nicht achten, die bei den Griechen als Götter gelten, und ebenso wenig den Aberglauben der Juden befolgen; welche Liebe sie füreinander haben; und warum dieses neue Volk oder diese neue Lebensweise erst jetzt und nicht schon früher in das Leben der Menschen getreten ist.[a] Diesen deinen Eifer begrüße ich mit Freude. Und ich bitte Gott, der uns sowohl das Reden als auch das Hören schenkt, mir zu gewähren, so zu reden, dass du durch das Hören besser wirst, und dir, so zuzuhören, dass ich als Redender nicht enttäuscht werde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „dieses neue Geschlecht/Volk oder diese neue Lebensführung/Praxis“. Die alternative Formulierung bleibt erhalten, weil γένος sowohl eine Menschengruppe als auch deren besondere Art bezeichnen kann, während ἐπιτήδευμα eine Lebensweise oder Praxis meint.
    reason: Die Fußnote sichert die im griechischen Text ausdrücklich gesetzte Alternative γένος ἢ ἐπιτήδευμα und erläutert sie, ohne eine der Deutungen dogmatisch festzulegen.
lexical_decisions:
- source_word: religion / worship (Greek review pending)
  choice: Gottesverehrung
  rationale: Gibt den Zusammenhang von Glauben und kultischer Verehrung natürlicher und weniger institutionell wieder als „Religion“, ohne die anschließende Frage nach der Art der Verehrung vorwegzunehmen.
- source_word: trust
  choice: ihr Vertrauen setzen
  rationale: Bewahrt den personalen und religiösen Sinn des Vertrauens, statt lediglich „glauben an“ zu sagen.
- source_word: disregard the world
  choice: die Welt gering achten
  rationale: Erhält die wertende Distanz des Zeugnisses, ohne daraus eine metaphysische Verwerfung der Schöpfung zu machen.
- source_word: despise death
  choice: den Tod verachten
  rationale: Die starke und rhetorisch zugespitzte Aussage des Zeugnisses wird beibehalten.
- source_word: affection
  choice: Liebe
  rationale: Im Kontext der gegenseitigen christlichen Zuneigung ist „Liebe“ das natürliche und sachlich passende deutsche Wort.
- source_word: new development or interest
  choice: neue Lebensweise oder dieses neue Interesse
  rationale: Da die englische Überlieferung an dieser Stelle zwei Deutungsmöglichkeiten signalisiert und die griechische Prüfung aussteht, bleibt die Alternative ausdrücklich erhalten.
- source_word: supplieth both the speaking and the hearing
  choice: der uns sowohl das Reden als auch das Hören schenkt
  rationale: Natürliches, würdevolles Deutsch, das Gott als Geber beider Fähigkeiten darstellt.
theological_decisions:
- issue: Bezeichnung jüdischer Praxis als „superstition“
  choice: Aberglauben der Juden
  alternative: religiöse Sonderpraxis der Juden
  rationale: Die polemische Wertung des antiken Zeugnisses wird transparent wiedergegeben und nicht beschönigt; sie wird jedoch nicht erweitert oder als redaktionelle Zustimmung dargestellt.
- issue: Verhältnis der Christen zur Welt
  choice: die Welt gering achten
  alternative: die Welt missachten / sich nicht um die Welt kümmern
  rationale: Die Formulierung bewahrt die Spannung der Aussage, vermeidet aber eine unnötig eindeutige Lehre von der grundsätzlich bösen Schöpfung.
- issue: Wirkung des Hörens
  choice: dass du durch das Hören besser wirst
  alternative: dass dir das Gehörte zum Guten dient
  rationale: Die unmittelbare Aussage des Zeugnisses wird bewahrt, ohne genauer festzulegen, ob moralische, geistliche oder intellektuelle Besserung gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, brieflichem Ton. Die Anrede mit „du“ folgt dem persönlichen antiken Briefstil; „hochgeehrt“ gibt die ehrende Anrede natürlich wieder. Die lange Ausgangsperiode wurde durch rhetorische Fragen gegliedert, ohne die Gedankenfolge zu verändern. Der Entwurf bleibt wegen der noch ausstehenden griechischen Quellenprüfung vorläufig.
