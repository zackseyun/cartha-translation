revisions:
- from: 'Hochgeehrter Diognetus! Ich sehe, wie außerordentlich sehr du danach verlangst, die Gottesverehrung der Christen zu verstehen, und wie klar und sorgfältig du dich über sie erkundigst: Auf welchen Gott setzen sie ihr Vertrauen, und wie verehren sie ihn? Warum achten sie alle die Welt gering und verachten den Tod? Warum halten sie nichts von denen, die bei den Griechen als Götter gelten, und folgen ebenso wenig dem Aberglauben der Juden? Was ist das für eine Liebe, die sie füreinander haben? Und warum ist diese neue Lebensweise oder dieses neue Interesse erst jetzt und nicht schon früher in das Leben der Menschen getreten?[a] Diesen deinen Eifer begrüße ich mit Freude. Und ich bitte Gott, der uns sowohl das Reden als auch das Hören schenkt, mir zu gewähren, so zu reden, dass du durch das Hören besser wirst, und dir, so zuzuhören, dass ich als Redender nicht enttäuscht werde.'
  to: 'Hochgeehrter Diognetus! Ich sehe, wie sehr du danach verlangst, die Gottesverehrung der Christen zu verstehen, und wie klar und sorgfältig du dich über sie erkundigst: Welchem Gott vertrauen sie, und wie verehren sie ihn? Dass sie alle die Welt geringachten und den Tod verachten, dass sie diejenigen nicht achten, die bei den Griechen als Götter gelten, und ebenso wenig den Aberglauben der Juden befolgen; welche Liebe sie füreinander haben; und warum dieses neue Volk oder diese neue Lebensweise erst jetzt und nicht schon früher in das Leben der Menschen getreten ist.[a] Diesen deinen Eifer begrüße ich mit Freude. Und ich bitte Gott, der uns sowohl das Reden als auch das Hören schenkt, mir zu gewähren, so zu reden, dass du durch das Hören besser wirst, und dir, so zuzuhören, dass ich als Redender nicht enttäuscht werde.'
  rationale: Die Revision ersetzt die sachlich nicht gedeckte Wiedergabe „Interesse“ durch die im griechischen Text belegte Alternative „Volk oder Lebensweise“. Sie glättet zudem Redundanz und vermeidet eine unnötige kausale Zuspitzung der Aufzählung. Die polemische Benennung der jüdischen Praxis bleibt als Stimmenaussage des antiken Autors erhalten.
