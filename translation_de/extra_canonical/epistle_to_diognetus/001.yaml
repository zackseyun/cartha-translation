    issue: „neue Lebensweise oder dieses neue Interesse“ verfehlt die überlieferte Alternative.
    rationale: 'Die einschlägige griechische Formulierung lautet γένος ἢ ἐπιτήδευμα: „Geschlecht/Volk oder Lebensführung/Praxis“. „Interesse“ hat hierfür keine tragfähige Grundlage und lässt den Gruppenbezug von γένος aus.'
  - severity: medium
    issue: Die wiederholten Fragen mit „Warum“ können die Aufzählung kausal verengen.
    rationale: Der Text beschreibt die Gegenstände von Diognetus’ Erkundigungen. Eine Formulierung mit „weshalb“ ist hier möglich, aber eine integrierte Aufzählung ohne zusätzliche kausale Akzentuierung entspricht der Struktur genauer.
  - severity: low
    issue: „wie außerordentlich sehr“ ist stilistisch redundant.
    rationale: „Wie sehr“ gibt die Intensivierung natürlich und ausreichend wieder.
