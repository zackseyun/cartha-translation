review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gedankengang, die Gegenüberstellungen und die Lösegeld- sowie Rechtfertigungssprache im Wesentlichen zuverlässig wieder. Zwei Stellen sollten jedoch enger am überlieferten Wortlaut bleiben: δικαιωθῆναι ist am besten mit „gerechtfertigt werden“ wiederzugeben, und δημιουργία sollte nicht im Haupttext zu „Werk“ abgeschwächt werden, da gerade das auffällige Bild von „Schöpfung“ zu bewahren ist. Auch die modale Satzform im Ausruf vom „Tausch“ ist wiederherzustellen.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. Die Formulierung „aus beidem seiner Güte vertrauen“ ist jedoch nicht idiomatisch; „aus beiden Gründen an seine Güte glauben“ ist klar und natürlich. „Ernährer“ bleibt in der ungewöhnlichen Schlussreihe möglich, sollte aber erklärt werden, weil es heute auch den bloßen materiellen Versorger bezeichnen kann.
  terminology: „Lösegeld“, „Gerechtigkeit“, „Ungerechtigkeit“, „Gesetzlose“, „Unvergängliche“ und „Unsterbliche“ sind treffend. „Gerechtfertigt“ wahrt die Bedeutung von δικαιωθῆναι präziser als „gerecht gemacht“, ohne einen konfessionellen Mechanismus festzulegen. „Schöpfung“ bewahrt δημιουργία und sollte nicht als bloße interpretierende Paraphrase ersetzt werden.
  issues:
  - severity: medium
    issue: „gerecht gemacht werden“ für δικαιωθῆναι
    rationale: Die Formulierung legt im Deutschen eher eine innere Umgestaltung nahe. „Gerechtfertigt werden“ ist die etablierte, semantisch weitere Wiedergabe und lässt die im Text nicht erklärte Weise der Rechtfertigung offen.
  - severity: medium
    issue: „unergründliches Werk“ statt „unergründliche Schöpfung“
    rationale: Der Ausgangstext verwendet δημιουργία. Das Bild ist absichtlich ungewöhnlich und darf im Haupttext nicht zu einer glättenden Deutung abgeschwächt werden.
  - severity: low
    issue: Indikativ im Satz über den einen Gerechten
    rationale: „wird verhüllt“ und „macht ... gerecht“ geben die rhetorisch-modale Satzführung weniger genau wieder. Die Form „verhüllt werde ... gerecht mache“ bildet die Aussageform des Zeugen besser ab.
  - severity: low
    issue: „aus beidem seiner Güte vertrauen“
    rationale: Die Wendung ist im modernen Deutsch holprig. „aus beiden Gründen an seine Güte glauben“ entspricht dem Sinn und ist idiomatisch.
  revised_text: 'Nachdem Gott also schon zuvor alles bei sich zusammen mit seinem Sohn[a] geplant hatte, ließ er uns in der früheren Zeit nach unserem eigenen Willen von ungeordneten Regungen treiben, von Vergnügungen und Begierden in die Irre geführt. Das tat er keineswegs, weil er an unseren Sünden Gefallen hatte, sondern weil er uns ertrug; nicht weil er die damalige Zeit der Ungerechtigkeit billigte, sondern weil er die jetzige Zeit der Gerechtigkeit vorbereitete. So sollten wir, nachdem unsere eigenen Taten uns damals als des Lebens unwürdig erwiesen hatten, nun durch Gottes Güte für würdig erachtet werden. Und nachdem offenbar geworden war, dass wir aus eigener Kraft nicht in das Reich Gottes gelangen konnten, sollten wir durch Gottes Kraft dazu befähigt werden.



    Als aber unsere Ungerechtigkeit ihr volles Maß erreicht hatte und vollkommen offenbar geworden war, dass als ihr Lohn Strafe und Tod zu erwarten waren, kam die von Gott bestimmte Zeit, in der er fortan seine Güte und Macht offenbaren wollte. O übergroße Freundlichkeit und Menschenliebe Gottes! Er hasste uns nicht, verstieß uns nicht und trug uns nichts nach. Vielmehr war er langmütig und geduldig; aus Erbarmen nahm er selbst unsere Sünden auf sich und gab seinen eigenen Sohn als Lösegeld für uns hin: den Heiligen für die Gesetzlosen, den Schuldlosen für die Bösen, den Gerechten für die Ungerechten, den Unvergänglichen für die Vergänglichen, den Unsterblichen für die Sterblichen.



