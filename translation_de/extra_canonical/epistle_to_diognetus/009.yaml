  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: de
  text: 'Nachdem Gott also schon zuvor alles bei sich zusammen mit seinem Sohn[a] geplant hatte, ließ er uns in der früheren Zeit nach unserem eigenen Willen von ungeordneten Regungen treiben, von Vergnügungen und Begierden in die Irre geführt. Das tat er keineswegs, weil er an unseren Sünden Gefallen hatte, sondern weil er uns ertrug; nicht weil er die damalige Zeit der Ungerechtigkeit billigte, sondern weil er die jetzige Zeit der Gerechtigkeit vorbereitete. So sollten wir, nachdem unsere eigenen Taten uns damals als des Lebens unwürdig erwiesen hatten, nun durch Gottes Güte für würdig erachtet werden. Und nachdem offenbar geworden war, dass wir aus eigener Kraft nicht in das Reich Gottes gelangen konnten, sollten wir durch Gottes Kraft dazu befähigt werden.


    Als aber unsere Ungerechtigkeit ihr volles Maß erreicht hatte und vollkommen offenbar geworden war, dass als ihr Lohn Strafe und Tod zu erwarten waren, kam die von Gott bestimmte Zeit, in der er fortan seine Güte und Macht offenbaren wollte. O übergroße Freundlichkeit und Menschenliebe Gottes! Er hasste uns nicht, verstieß uns nicht und trug uns nichts nach. Vielmehr war er langmütig und geduldig; aus Erbarmen nahm er selbst unsere Sünden auf sich und gab seinen eigenen Sohn als Lösegeld für uns hin: den Heiligen für die Gesetzlosen, den Schuldlosen für die Bösen, den Gerechten für die Ungerechten, den Unvergänglichen für die Vergänglichen, den Unsterblichen für die Sterblichen.


    Denn was anderes als seine Gerechtigkeit hätte unsere Sünden bedecken können?


    In wem sonst hätten wir, die Gesetzlosen und Gottlosen, gerecht gemacht werden können als allein im Sohn Gottes?[b]


    O wunderbarer Tausch! O unergründliches Werk! O unerwartete Wohltaten! Die Ungerechtigkeit vieler wird in dem einen Gerechten verhüllt, und die Gerechtigkeit des Einen macht viele Ungerechte gerecht![c]


    Nachdem Gott also in der früheren Zeit gezeigt hatte, dass unsere Natur aus eigener Kraft das Leben nicht erlangen kann, und nun einen Retter offenbart hatte, der selbst die Kraftlosen retten kann, wollte er, dass wir aus beidem seiner Güte vertrauen und ihn ansehen als Ernährer, Vater, Lehrer, Ratgeber, Arzt, Verstand, Licht, Ehre, Herrlichkeit, Kraft und Leben.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende alte Formulierung kann je nach griechischer Lesart und Zusammenhang „Sohn“, „Kind“ oder „Diener“ bezeichnen. Der weitere Abschnitt spricht ausdrücklich vom „Sohn Gottes“.
    reason: Bewahrt eine mögliche lexikalische Mehrdeutigkeit, da die direkte Prüfung des griechischen Quellenbestands noch aussteht.
  - marker: b
    text: „Gerecht gemacht“ kann auch „als gerecht erwiesen“ oder „gerechtfertigt“ wiedergegeben werden.
    reason: Die deutsche Formulierung soll die rechtliche und verwandelnde Bedeutungsnähe offenhalten, statt sie konfessionell festzulegen.
  - marker: c
    text: Wörtlicher wäre an dieser Stelle möglicherweise „unergründliche Schöpfung“ oder „unergründliches Wirken“; gemeint ist hier Gottes nicht auszulotendes Werk.
    reason: Erklärt die Entscheidung für idiomatisches Deutsch, ohne die Bildkraft des Ausgangsausdrucks zu verlieren.
  - marker: d
    text: Die abschließende Reihe ist bewusst ungewöhnlich. „Ernährer“ kann auch jemanden meinen, der nährt und aufzieht; für „Verstand“ ist auch „Sinn“ möglich.
    reason: Bewahrt die markante Prädikatsfolge und weist auf semantische Alternativen hin.
lexical_decisions:
- source_word: παῖς (mutmaßliche griechische Lesart; Quellenprüfung ausstehend)
  choice: Sohn
  rationale: Der überlieferte englische Zeuge bietet „Son“, und der spätere Zusammenhang spricht ausdrücklich vom Sohn Gottes. Eine Fußnote hält die mögliche Bedeutungsbreite „Kind/Diener“ offen.
- source_word: λύτρον
  choice: Lösegeld
  rationale: Bewahrt das konkrete Bild eines Preises zur Freilassung, ohne eine bestimmte spätere Sühnetheorie einzutragen.
- source_word: δικαιοσύνη / δίκαιος
  choice: Gerechtigkeit / gerecht
  rationale: Die wiederkehrende Wortfamilie wird im Deutschen sichtbar gehalten, besonders in der Gegenüberstellung von Ungerechtigkeit und Gerechtigkeit.
- source_word: δημιουργία (nach der überlieferten griechischen Textgestalt)
  choice: Werk
  rationale: „Schöpfung“ wäre hier im Deutschen leicht kosmologisch missverständlich; „Werk“ bewahrt den Sinn eines göttlichen Wirkens und wird in der Fußnote erläutert.
- source_word: τροφεύς (nach der überlieferten griechischen Textgestalt)
  choice: Ernährer
  rationale: Das Bild bezeichnet jemanden, der nährt und aufzieht. „Ernährer“ klingt im heutigen Deutsch natürlicher als „Amme“, ohne den Fürsorgeaspekt ganz aufzugeben.
- source_word: νοῦς (nach der überlieferten griechischen Textgestalt)
  choice: Verstand
  rationale: Die auffällige Prädikatsreihe wird nicht geglättet. „Verstand“ gibt den intellektuellen Leitungsaspekt wieder, auch wenn „Sinn“ möglich ist.
theological_decisions:
- issue: Gottes Zulassen der früheren Ungerechtigkeit
  choice: Gott ließ die Menschen treiben, ohne Gefallen an der Sünde zu haben oder sie zu billigen.
  alternative: Gott verursachte oder bestimmte ihre sündigen Regungen.
  rationale: Der Text unterscheidet ausdrücklich zwischen geduldigem Zulassen und Billigung; eine göttliche Verursachung der Sünde wird nicht eingetragen.
- issue: Würdigkeit und göttliche Befähigung
  choice: „durch Gottes Güte für würdig erachtet“ und „durch Gottes Kraft dazu befähigt“
  alternative: Der Mensch verdient sich durch eigene Werke den Eintritt in Gottes Reich.
  rationale: 'Die Spannung des Textes bleibt erhalten: Er spricht von Würdigkeit, verankert sie jedoch ausdrücklich in Gottes Güte und Kraft statt in menschlicher Selbstbefähigung.'
- issue: Aufnahme der Sünden und Hingabe des Sohnes
  choice: „nahm ... unsere Sünden auf sich“ und „gab ... seinen eigenen Sohn als Lösegeld ... hin“
  alternative: Ausformulierung einer bestimmten konfessionellen Sühnetheorie
  rationale: Die starken Stellvertretungs- und Lösegeldbilder werden bewahrt, aber nicht über die Aussagen des Textes hinaus systematisiert.
- issue: Der „wunderbare Tausch“
  choice: Die Ungerechtigkeit vieler wird im einen Gerechten verhüllt; seine Gerechtigkeit macht viele gerecht.
  alternative: Präzisierung als ausschließlich zugerechnete oder ausschließlich eingegossene Gerechtigkeit
  rationale: Der Text verbindet Bedecken und Rechtfertigen, legt aber den späteren dogmatischen Mechanismus nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung und bewahrter rhetorischer Steigerung. Die Parallelismen, Ausrufe und Gegenüberstellungen des Abschnitts bleiben sichtbar. Der Entwurf ist wegen des verlorenen Codex Argentoratensis und der noch ausstehenden direkten Prüfung der griechischen Überlieferung ausdrücklich vorläufig; der bereitgestellte gemeinfreie englische Zeuge wurde als kontrollierbare Konsultationsgrundlage verwendet.
