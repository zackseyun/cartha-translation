lexical_decisions:
- source_word: prepossessions / preconceptions
  choice: vorgefasste Vorstellungen
  rationale: Gibt die gedanklichen Vorprägungen natürlich und ohne moderne psychologische Überfrachtung wieder.
- source_word: intellect
  choice: Verstand
  rationale: Ein allgemein verständlicher Ausdruck für die geistige Einsicht im Kontrast zum bloßen Sehen.
- source_word: new story / account
  choice: neue Botschaft
  rationale: Bewahrt den Sinn einer neu zu hörenden Darlegung; „Geschichte“ könnte irreführend nach Erzählfiktion klingen.
- source_word: earthenware
  choice: Ton
  rationale: Bezeichnet hier den Werkstoff der Götterbilder; beim Vergleich wird entsprechend „Geschirr“ für das Gebrauchsgut verwendet.
- source_word: soul-less, senseless, motionless
  choice: ohne Seele, ohne Wahrnehmung und reglos
  rationale: Erhält die dreigliedrige Steigerung und vermeidet die mögliche Nebenbedeutung von „sinnlos“.
- source_word: victims
  choice: Opfertieren
  rationale: Macht im Deutschen klar, dass die geschlachteten Opfer gemeint sind, ohne zusätzliche kultische Einzelheiten einzutragen.
- source_word: enslaved
  choice: als Sklaven dienen
  rationale: Bewahrt die scharfe Sklavereimetaphorik des Zeugnisses statt sie zu „dienen“ abzuschwächen.
theological_decisions:
- issue: Bezeichnung der verehrten Gegenstände als Götter
  choice: Die polemische Bezeichnung „Götter“ bleibt stehen, während „Götterbildern“ nur dort verwendet wird, wo die stofflich geformten Abbilder im Vergleich ausdrücklich gemeint sind.
  alternative: Durchgehend „Götzen“ oder „Götterbilder“
  rationale: „Götzen“ würde die Wertung vorwegnehmen; die Argumentation des Textes soll selbst zeigen, warum diese Dinge keine Götter sind.
- issue: Paradoxer Schlusssatz über die Empfindungsfähigkeit des Steins
  choice: „Damit beweist ihr also, dass er empfindet“ wird beibehalten und mit einer textkritischen Fußnote versehen.
  alternative: „Damit widerlegt ihr also seine Empfindungsfähigkeit“ oder eine sinnglättende Konjektur
  rationale: Das überlieferte englische Zeugnis steht in Spannung zum unmittelbaren Kontext. Da die Prüfung am griechischen Ausgangstext noch aussteht, wird die Spannung nicht stillschweigend aufgelöst.
- issue: Christen und Dienst an den Göttern
  choice: „solchen Göttern nicht als Sklaven dienen“
  alternative: „solche Götter nicht verehren“
  rationale: Die Fassung wahrt sowohl den theologischen Gegensatz als auch die ausdrücklich soziale Metapher der Versklavung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter rhetorischer Ansprache. Der Wechsel zwischen Singular am Anfang und Plural in der allgemeinen Anklage folgt dem vorgelegten Zeugnis. Die langen Fragen wurden lesbar gegliedert, ihre argumentative Wiederholung und Schärfe jedoch bewahrt. Da kein griechischer Text mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist dies ein vorläufiger, am öffentlichen englischen Zeugen kritisch orientierter Entwurf.
