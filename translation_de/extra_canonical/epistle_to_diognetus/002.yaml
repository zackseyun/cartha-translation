  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are servants; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: de
  text: 'Komm also: Befreie deinen Sinn von all den vorgefassten Vorstellungen, die ihn gefangen halten, lege die Gewohnheit ab, die dich in die Irre führt, und werde gleichsam von Anfang an ein neuer Mensch, bereit, eine neue Botschaft zu hören, wie du selbst erklärt hast. Betrachte nicht nur mit deinen Augen, sondern auch mit deinem Verstand, aus welchem Stoff und von welcher Gestalt jene sind, die ihr Götter nennt und dafür haltet.


    Ist nicht der eine aus Stein wie das, worauf wir treten, ein anderer aus Bronze, nicht besser als die Gefäße, die für unseren Gebrauch geschmiedet werden, ein anderer aus Holz, das bereits verfault ist, ein anderer aus Silber, das einen Wächter braucht, damit es nicht gestohlen wird, ein anderer aus Eisen, das der Rost zerfrisst, und wieder ein anderer aus Ton, nicht ansehnlicher als das Geschirr, das für den unehrenhaftesten Dienst bereitgestellt wird?


    Bestehen sie nicht alle aus vergänglichem Stoff? Werden sie nicht mit Eisen und Feuer bearbeitet? Hat nicht den einen der Bildhauer gemacht, den anderen der Bronzegießer, einen weiteren der Silberschmied und wieder einen anderen der Töpfer? Bevor die Fertigkeit dieser verschiedenen Handwerker ihnen diese Gestalt gab, hätte nicht jeder von ihnen umgeformt werden und die Gestalt der genannten Gebrauchsgegenstände erhalten können? Und könnten nicht die Gefäße, die heute aus demselben Stoff bestehen, solchen Götterbildern gleichgemacht werden, wenn sie in die Hände derselben Handwerker kämen?


    Könnten nicht auch diese Dinge, die ihr jetzt verehrt, von Menschenhand wieder zu Gefäßen wie die übrigen gemacht werden? Sind sie nicht alle taub und blind, ohne Seele, ohne Wahrnehmung und reglos? Verfaulen und vergehen sie nicht alle?


    Diese Dinge nennt ihr Götter; ihnen dient ihr als Sklaven, sie verehrt ihr, und schließlich werdet ihr ihnen völlig gleich.


    Darum hasst ihr die Christen, weil sie diese Dinge nicht für Götter halten.


    Doch verachtet nicht gerade ihr selbst, die ihr sie jetzt für Götter haltet und verehrt, sie noch viel mehr? Verspottet und misshandelt ihr sie nicht vielmehr, indem ihr die aus Stein und Ton unbewacht lasst, die aus Silber und Gold aber nachts einschließt und tagsüber bewachen lasst, damit sie nicht gestohlen werden?


    Was die Ehren betrifft, die ihr ihnen nach eurer Meinung erweist: Wenn sie etwas wahrnehmen können, bestraft ihr sie dadurch vielmehr; wenn sie aber nichts wahrnehmen können, verhöhnt ihr sie, indem ihr sie mit dem Blut und Fett von Opfertieren zu besänftigen sucht.


    Einer von euch soll sich doch so behandeln lassen; er soll zulassen, dass man dies mit ihm tut. Nein, kein einziger Mensch würde sich einer solchen Qual freiwillig unterziehen, denn er besitzt Empfindung und Vernunft. Ein Stein aber lässt es geschehen, weil er nichts empfindet. Damit beweist ihr also, dass er empfindet.[a]


    Nun, ich könnte noch vieles darüber sagen, dass die Christen solchen Göttern nicht als Sklaven dienen. Wenn aber jemand das Gesagte für unzureichend hält, erachte ich es für überflüssig, noch mehr zu sagen.'
