    text: 'Der überlieferte Wortlaut lautet sinngemäß: „Damit beweist ihr seine Empfindungsfähigkeit.“ Das steht offenbar in Spannung zur unmittelbar vorherigen Aussage, der Stein empfinde nichts. Eine Prüfung am griechischen Text steht noch aus.'
