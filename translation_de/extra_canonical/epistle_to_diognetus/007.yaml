base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: de
  text: '**An Diognet 7**


    Denn es ist keine irdische Einsicht, wie ich schon sagte, die ihnen anvertraut wurde. Auch sind sie nicht darauf bedacht, irgendeine Erfindung sterblicher Menschen so gewissenhaft zu hüten; ebenso wenig ist ihnen die Verwaltung menschlicher Geheimnisse anvertraut worden.


    Vielmehr hat der allmächtige Schöpfer des Weltalls, der unsichtbare Gott selbst, vom Himmel her die Wahrheit und die heilige Lehre, die den menschlichen Verstand übersteigt, unter den Menschen eingepflanzt und fest in ihren Herzen verankert. Das tat er nicht, wie man meinen könnte, indem er den Menschen einen Untergebenen sandte oder einen Engel, einen Herrscher, einen von denen, die die Angelegenheiten der Erde lenken, oder einen von denen, denen die Verwaltungen im Himmel anvertraut sind. Nein, er sandte den Werkmeister und Schöpfer des Weltalls selbst: den, durch den er die Himmel schuf; durch den er das Meer in seine ihm gesetzten Grenzen einschloss; dessen Geheimnisse alle Elemente treu einhalten; von dem selbst die Sonne[a] das Maß ihrer täglichen Bahnen empfangen hat, damit sie es wahrt; dem der Mond gehorcht, wenn er ihm befiehlt, in der Nacht zu leuchten; dem die Sterne gehorchen, indem sie der Bahn des Mondes folgen; durch den alles geordnet, begrenzt und unterworfen ist: die
    Himmel und was in den Himmeln ist, die Erde und was auf der Erde ist, das Meer und was im Meer ist, Feuer, Luft und Abgrund, was in den Höhen, was in den Tiefen und was dazwischen ist. Ihn sandte er zu ihnen.


    Wurde er etwa, wie man meinen könnte, dazu gesandt, eine Herrschaft aufzurichten und Furcht und Schrecken zu verbreiten?


    Keineswegs. Vielmehr sandte er ihn in Güte und[b] Sanftmut, wie ein König seinen Sohn senden könnte, der selbst König ist. Er sandte ihn als Gott; er sandte ihn als Mensch[c] zu den Menschen; er sandte ihn als Retter. Er wollte überzeugen, nicht zwingen, denn Zwang ist Gott nicht eigen.


    Er sandte ihn, um zu rufen, nicht um zu verfolgen; er sandte ihn liebend, nicht richtend.


    Denn er wird ihn zum Gericht senden – und wer wird seine Gegenwart ertragen?


    … Siehst du nicht[d], wie man sie wilden Tieren vorwirft, damit sie den Herrn verleugnen, und sie dennoch nicht besiegt werden?


    Siehst du nicht, dass umso mehr andere hinzukommen, je mehr von ihnen bestraft werden?


    Dies sind nicht die Werke eines Menschen; sie sind die Kraft Gottes; sie sind Beweise seiner Gegenwart.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Sonne“ ist im überlieferten Text ergänzt; der Zusammenhang legt dieses Subjekt nahe.
    reason: Kennzeichnet eine editorische Ergänzung im zugrunde gelegten Zeugen.
  - marker: b
    text: Das „und“ zwischen „Güte“ und „Sanftmut“ ist textkritisch unsicher beziehungsweise ergänzt.
    reason: Bewahrt das Unsicherheitssignal der englischen Textausgabe.
  - marker: c
    text: „Mensch“ ist im zugrunde gelegten Zeugen ergänzt.
    reason: Macht die editorische Ergänzung transparent, die den Parallelismus verständlich macht.
  - marker: d
    text: Vor diesem Satz weist die Überlieferung eine Lücke auf; auch „Siehst du nicht“ ist als Wiederherstellung gekennzeichnet.
    reason: Markiert den beschädigten Übergang und die ergänzte Anrede.
lexical_decisions:
- source_word: earthly discovery / mortal invention
  choice: irdische Entdeckung / Erfindung sterblicher Menschen
  rationale: Die Unterscheidung des Zeugen zwischen einer aufgefundenen Lehre und einer menschlich hervorgebrachten Erfindung bleibt erhalten.
- source_word: dispensation / administration
  choice: Verwaltung / Ordnungen
  rationale: „Verwaltung“ passt zu den anvertrauten menschlichen Geheimnissen; bei den himmlischen Beauftragungen gibt „Ordnungen“ den kosmischen Zusammenhang idiomatischer wieder, ohne eine kirchliche Amtslehre einzutragen.
- source_word: Artificer and Creator
  choice: Werkmeister und Schöpfer
  rationale: „Werkmeister“ bewahrt neben „Schöpfer“ den Gedanken kunstvoller Gestaltung und den rhetorischen Doppelausdruck.
- source_word: mysteries
  choice: geheimnisvolle Ordnungen
  rationale: Im kosmologischen Zusammenhang meint der Ausdruck offenbar verborgene, zuverlässig eingehaltene Bestimmungen; die Wiedergabe vermeidet den missverständlichen Eindruck, die Elemente vollzögen Kultmysterien.
- source_word: gentleness and meekness
  choice: Güte und Sanftmut
  rationale: Natürliches modernes Deutsch mit würdigem Ton; beide Aspekte des milden, nicht gewaltsamen Sendens bleiben erhalten.
- source_word: summoning
  choice: rufen
  rationale: Das knappe Verb wahrt den Gegensatz zu „verfolgen“ und lässt offen, ob Einladung oder autoritativer Ruf im Vordergrund steht.
- source_word: presence
  choice: Gegenwart
  rationale: Bewahrt die mögliche Bedeutung persönlicher Anwesenheit beziehungsweise Erscheinung, ohne sie ausschließlich als Wiederkunft auszulegen.
theological_decisions:
- issue: Identität und Sendung des Gesandten
  choice: „den Werkmeister und Schöpfer des Weltalls selbst“; „Er sandte ihn als Gott“
  alternative: 'Abschwächend: „einen göttlichen Gesandten“'
  rationale: Die starke Aussage des überlieferten Zeugen wird nicht abgeschwächt oder konfessionell umformuliert.
- issue: Verhältnis von Sender und Gesandtem
  choice: Die wechselnden Bezüge von „er“ und „ihn“ bleiben bestehen.
  alternative: Durchgehend „der Vater“ und „der Sohn“ einsetzen
  rationale: Die trinitarische Lesbarkeit bleibt erhalten, doch nicht ausdrücklich im Text genannte Bezeichnungen werden nicht ergänzt.
- issue: Erste Sendung und künftiges Gericht
  choice: „in Liebe, nicht zum Gericht“ und danach „zum Gericht senden“
  alternative: Den ersten Satz als bloßen Aufschub des Gerichts erklären
  rationale: Die rhetorische und theologische Spannung des Zeugen bleibt unvermittelt stehen.
- issue: „Zwang ist Gott nicht eigen“
  choice: Als allgemeine Aussage beibehalten
  alternative: Auf die konkrete Bekehrungsmethode beschränken
  rationale: Der absolute Klang der Vorlage wird nicht durch eine auslegende Einschränkung gemildert.
- issue: Bezug von „seiner Gegenwart“ im Schlusssatz
  choice: Pronomenbezug offenlassen
  alternative: Eindeutig „Gottes Gegenwart“ oder „Christi Gegenwart“ schreiben
  rationale: Der Zeuge lässt den unmittelbaren Bezug mehrdeutig; diese Mehrdeutigkeit ist theologisch bedeutsam.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, öffentlich lesbarem Register. Lange kosmologische Perioden wurden weitgehend bewahrt, aber durch klare Zeichensetzung gegliedert. Die Anrede bleibt im Singular („du“), wie es der persönliche Briefcharakter verlangt. Da der griechische Ausgangstext noch nicht zur direkten Prüfung vorlag, ist dies ein ausdrücklich vorläufiger, quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Textzeugen; textkritische Ergänzungen und die Lücke sind sichtbar ausgewiesen.
