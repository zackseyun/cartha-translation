revisions:
- from: '**An Diognet 7**


    Denn es ist keine irdische Entdeckung, wie ich schon sagte, die ihnen anvertraut wurde. Auch sind sie nicht darauf bedacht, irgendeine Erfindung sterblicher Menschen so gewissenhaft zu hüten; ebenso wenig ist ihnen die Verwaltung menschlicher Geheimnisse anvertraut worden.


    Vielmehr hat der allmächtige Schöpfer des Weltalls, der unsichtbare Gott selbst, vom Himmel her die Wahrheit und die heilige Lehre, die den menschlichen Verstand übersteigt, unter den Menschen eingepflanzt und fest in ihren Herzen verankert. Das tat er nicht, wie man meinen könnte, indem er den Menschen einen Untergebenen sandte oder einen Engel, einen Herrscher, einen von denen, die über die Angelegenheiten der Erde wachen, oder einen von denen, denen die Ordnungen im Himmel anvertraut sind. Nein, er sandte den Werkmeister und Schöpfer des Weltalls selbst: den, durch den er die Himmel schuf; durch den er das Meer in seine ihm gesetzten Grenzen einschloss; dessen geheimnisvolle Ordnungen alle Elemente treu einhalten; von dem selbst die Sonne[a] das Maß ihrer täglichen Bahnen empfangen hat, damit sie es wahrt; dem der Mond gehorcht, wenn er ihm befiehlt, in der Nacht zu leuchten; dem die Sterne gehorchen, indem sie der Bahn des Mondes folgen; durch den alles geordnet, begrenzt und unterworfen
    ist: die Himmel und was in den Himmeln ist, die Erde und was auf der Erde ist, das Meer und was im Meer ist, Feuer, Luft und Abgrund, was in den Höhen, was in den Tiefen und was dazwischen ist. Ihn sandte er zu ihnen.


    Wurde er etwa, wie man meinen könnte, dazu gesandt, eine Herrschaft aufzurichten und Furcht und Schrecken zu verbreiten?


    Keineswegs. Vielmehr sandte er ihn in Güte und[b] Sanftmut, wie ein König seinen Sohn senden könnte, der selbst König ist. Er sandte ihn als Gott; er sandte ihn als Mensch[c] zu den Menschen; er sandte ihn als Retter. Er wollte überzeugen, nicht zwingen, denn Zwang ist Gott nicht eigen.


    Er sandte ihn, um zu rufen, nicht um zu verfolgen; er sandte ihn in Liebe, nicht zum Gericht.


    Denn er wird ihn zum Gericht senden – und wer wird seine Gegenwart ertragen?


    … Siehst du nicht[d], wie man sie wilden Tieren vorwirft, damit sie den Herrn verleugnen, und sie dennoch nicht besiegt werden?


    Siehst du nicht, dass umso mehr andere hinzukommen, je mehr von ihnen bestraft werden?


    Das sieht nicht nach den Werken eines Menschen aus; darin zeigt sich die Kraft Gottes; es sind Beweise seiner Gegenwart.'
