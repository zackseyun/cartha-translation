base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: de
  text: '**8**


    Denn welcher Mensch wusste überhaupt, was Gott ist, bevor er kam?[a]


    Oder willst du etwa die leeren und unsinnigen Behauptungen jener selbstgefälligen Philosophen gelten lassen? Einige von ihnen sagten, Gott sei Feuer – sie nennen also das Gott, wohin sie selbst einmal gelangen werden –, andere, er sei Wasser, und wieder andere, er sei eines der übrigen Elemente, die doch von Gott geschaffen wurden.


    Wenn aber irgendeine dieser Behauptungen annehmbar wäre, könnte man ebenso gut jedes beliebige andere Geschöpf für Gott ausgeben.


    Nein, das alles ist nichts als Scharlatanerie und Täuschung von Zauberern.


    Kein Mensch hat ihn gesehen oder erkannt; vielmehr hat er selbst sich offenbart.


    Er offenbarte sich durch den Glauben; allein durch ihn wird es geschenkt, Gott zu sehen.[b]


    Denn Gott, der Herr und Schöpfer des Alls, der alles geschaffen und wohlgeordnet hat, erwies sich nicht nur als menschenfreundlich, sondern auch als langmütig.


    So war er schon immer, so ist er, und so wird er sein: gütig und gut, keinen Leidenschaften unterworfen[c] und wahrhaftig. Er allein ist gut.


    Er fasste einen großen, unaussprechlichen Plan und teilte ihn allein seinem Sohn mit.


    Solange er seinen weisen Ratschluss als Geheimnis bewahrte und hütete, schien es, als vernachlässige er uns und kümmere sich nicht um uns.


    Als er ihn aber durch seinen geliebten Sohn offenbarte und kundtat, was er von Anfang an vorbereitet hatte, schenkte er uns alles zugleich: Anteil an seinen Wohltaten sowie Einsicht und Verständnis in Geheimnisse[d], die keiner von uns jemals erwartet hätte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden Zeugen: „bevor er kam“. Auf wen sich „er“ bezieht, wird hier nicht ausdrücklich aufgelöst.'
    reason: Bewahrt eine mögliche christologische beziehungsweise theologische Mehrdeutigkeit des Pronomenbezugs.
  - marker: b
    text: Die Wendung „durch den Glauben“ kann den Glauben als Weg oder Mittel des Sehens Gottes bezeichnen. Der knappe Wortlaut bleibt bewusst offen.
    reason: Verhindert, dass das Verhältnis von Offenbarung, Glaube und Gotteserkenntnis dogmatisch vereindeutigt wird.
  - marker: c
    text: Gemeint ist, dass Gott Leidenschaften nicht unterworfen ist; nicht, dass er gefühllos oder teilnahmslos wäre.
    reason: Die deutsche Wiedergabe eines antiken philosophisch-theologischen Begriffs kann sonst modern missverstanden werden.
  - marker: d
    text: „Geheimnisse“ steht im überlieferten englischen Zeugen ergänzend in Klammern; der genaue griechische Wortlaut muss noch geprüft werden.
    reason: Kennzeichnet eine im zugrunde gelegten Zeugen ausdrücklich als Ergänzung markierte Lesart.
lexical_decisions:
- source_word: what God was
  choice: was Gott ist
  rationale: Bewahrt die ungewöhnliche Was-Formulierung des Zeugen, ohne sie deutend zu „wer Gott ist“ oder „wie Gott beschaffen ist“ umzuschreiben.
- source_word: pretentious philosophers
  choice: selbstgefällige Philosophen
  rationale: Gibt die polemische Charakterisierung natürlich wieder, ohne eine bestimmte philosophische Schule einzutragen.
- source_word: quackery
  choice: Scharlatanerie
  rationale: Bewahrt den Vorwurf betrügerischer Scheinweisheit in aktuellem, verständlichem Deutsch.
- source_word: Master and Creator of the Universe
  choice: Herr und Schöpfer des Alls
  rationale: „Herr“ ist hier idiomatischer als „Meister“; „des Alls“ erfasst den umfassenden kosmischen Bezug knapp und würdig.
- source_word: friendly to men
  choice: menschenfreundlich
  rationale: Bewahrt den traditionellen theologischen Sinn von Menschenliebe beziehungsweise Menschenfreundlichkeit und vermeidet eine bloß gesellige Bedeutung.
- source_word: long-suffering
  choice: langmütig
  rationale: Der etablierte Ausdruck bezeichnet geduldiges Ertragen und ist in diesem theologischen Register präziser als nur „geduldig“.
- source_word: scheme / design / purpose
  choice: Plan / Ratschluss / was er … vorbereitet hatte
  rationale: Die abgestufte Wiedergabe vermeidet monotone Wiederholung und wahrt zugleich den Gedanken eines verborgenen, von Anfang an vorbereiteten Vorhabens Gottes.
- source_word: benefits
  choice: Wohltaten
  rationale: Bezeichnet empfangene gute Gaben Gottes, ohne den Sinn auf materiellen Nutzen zu verengen.
theological_decisions:
- issue: Bezug des Pronomens in „before He came“
  choice: „bevor er kam“ mit Fußnote
  alternative: „bevor Gott kam“ oder „bevor Christus kam“
  rationale: Der vorgelegte Zeuge enthält nur ein Pronomen. Die Übersetzung legt dessen Bezug nicht stillschweigend fest.
- issue: Offenbarung und Glaube
  choice: „Er offenbarte sich durch den Glauben“
  alternative: „Er wird im Glauben erkannt“
  rationale: Die kausale beziehungsweise instrumentale Spannung des Zeugen bleibt erhalten; sie wird nicht in eine eindeutig subjektive Erkenntnisformel umgedeutet.
- issue: Gottes Unberührtheit von Leidenschaften
  choice: „keinen Leidenschaften unterworfen“
  alternative: „leidenschaftslos“, „unberührt“ oder „unempfindlich“
  rationale: Die Formulierung vermeidet den modernen Eindruck von Gefühlskälte, behauptet aber auch nicht näher, worin diese göttliche Eigenschaft besteht.
- issue: Exklusive Mitteilung an den Sohn
  choice: „teilte ihn allein seinem Sohn mit“
  alternative: „beriet ihn allein mit seinem Sohn“
  rationale: Der Zeuge spricht von einer Mitteilung, nicht ausdrücklich von Beratung; die Exklusivität wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular („du“), passend zur Briefform. Die polemische Schärfe gegen Philosophen und Zauberer bleibt erhalten, wird aber nicht zusätzlich verschärft. Da für diesen Arbeitsgang nur der öffentliche englische Übersetzungszeuge bereitgestellt wurde und die Prüfung des verlorenen griechischen Überlieferungsträgers anhand seiner Abschriften noch aussteht, ist dies ein vorläufiger, quellensensibler Publikationsentwurf; insbesondere Pronominalbezüge, die Formulierung zu Glaube und Sehen sowie die ergänzte Bezeichnung „Geheimnisse“ bedürfen der direkten griechischen Kontrolle.
