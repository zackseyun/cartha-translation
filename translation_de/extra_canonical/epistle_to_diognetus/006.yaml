review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Revision ist nötig. Der Entwurf gibt die Leitmetapher und die meisten Kontraste treffend wieder. Gegenüber dem griechischen Text sind jedoch besonders δύο Punkte zu präzisieren: πληθύνονται bezeichnet bei den Christen ein Mehrwerden bzw. Zahlreicherwerden, nicht offen auch bloß inneres Erstarken; und τάξις bezeichnet die von Gott zugewiesene Stellung/Ordnung, nicht primär eine „Aufgabe“. Außerdem sollte die Mehrzahl ἐν οὐρανοῖς („in den Himmeln“) im Text stehen bleiben.'
  naturalness: Der Text ist überwiegend klares, würdiges modernes Standarddeutsch. „bei Speise und Trank karg gehalten“ klingt jedoch unnötig indirekt; „unter Hunger und Durst“ ist natürlicher und näher am griechischen Ausdruck. „in den Himmeln“ ist bewusst quellennahe, leicht markierte Sprache, aber im Kontext verständlich.
  terminology: „Seele“, „Fleisch“, „nicht von der Welt“, „Gottesverehrung“, „Unvergänglichkeit“ und „als Fremde leben“ sind angemessen. „Gottesverehrung“ entspricht θεοσέβεια gut. Für τάξις ist „Stellung“ hier genauer als „Aufgabe“.
  issues:
  - severity: medium
    issue: Die Anmerkung c erklärt „zunehmen“ als möglicherweise inneres Erstarken.
    rationale: Der griechische Ausdruck πληθύνονται meint hier, dass die Christen zahlreicher werden bzw. sich vermehren. Die behauptete Mehrdeutigkeit ist daher nicht zu bewahren.
  - severity: medium
    issue: „Aufgabe“ für die göttliche τάξις ist zu eng funktional.
    rationale: τάξις bezeichnet die zugewiesene Stellung bzw. Ordnung. „Stellung“ gibt die Metaphorik eines von Gott bestimmten Platzes wieder, ohne ein kirchliches Amt zu unterstellen.
  - severity: low
    issue: „im Himmel“ glättet die Pluralform ἐν οὐρανοῖς.
    rationale: Die Formulierung „in den Himmeln“ bewahrt die quellensprachliche Mehrzahl; eine erläuternde Fußnote ist dann nicht erforderlich.
  - severity: low
    issue: Fußnote a ist in sich widersprüchlich und aufgrund des überprüfbaren Begriffs θεοσέβεια nicht mehr nötig.
    rationale: Sie führt „Gottesverehrung“ zugleich als gewählte und als bloß mögliche Wiedergabe an. θεοσέβεια wird sachgerecht mit „Gottesverehrung“ wiedergegeben.
