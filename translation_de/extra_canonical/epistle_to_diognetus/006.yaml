base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: de
  text: 'Kurz gesagt: Was die Seele im Körper ist, das sind die Christen in der Welt.


    Die Seele ist über alle Glieder des Körpers verteilt, und die Christen über die verschiedenen Städte der Welt.


    Die Seele wohnt im Körper und ist doch nicht vom Körper. Ebenso wohnen die Christen in der Welt und sind doch nicht von der Welt.


    Die Seele ist unsichtbar und wird im sichtbaren Körper bewahrt. Ebenso erkennt man, dass die Christen in der Welt sind, doch ihre Gottesverehrung bleibt unsichtbar.


    Das Fleisch hasst die Seele und führt Krieg gegen sie, obwohl es von ihr kein Unrecht erfährt, denn sie hindert es daran, sich den Vergnügungen hinzugeben. Ebenso hasst die Welt die Christen, obwohl sie von ihnen kein Unrecht erfährt, denn sie widersetzen sich ihren Vergnügungen.


    Die Seele liebt das Fleisch, das sie hasst, und auch seine Glieder. Ebenso lieben die Christen die, die sie hassen.


    Die Seele ist im Körper eingeschlossen und hält doch selbst den Körper zusammen. Ebenso werden die Christen in der Welt wie in einem Gefängnis festgehalten, und doch halten gerade sie die Welt zusammen.


    Die Seele ist selbst unsterblich und wohnt doch in einem sterblichen Zelt. Ebenso leben die Christen als Fremde unter vergänglichen Dingen und erwarten die Unvergänglichkeit in den Himmeln.


    Unter Hunger und Durst wird die Seele besser. Ebenso werden die Christen, wenn sie bestraft werden, von Tag zu Tag zahlreicher.


    Eine so große Stellung hat Gott ihnen zugewiesen, und sie dürfen sie nicht aufgeben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: soul (Greek source review pending)
  choice: Seele
  rationale: Bewahrt den tragenden Seele-Körper-Vergleich des überlieferten Zeugnisses und entspricht dem üblichen frühchristlichen Sprachgebrauch.
- source_word: religion (Greek source review pending)
  choice: Gottesverehrung
  rationale: Bezeichnet die sichtbarer Feststellung entzogene religiöse Lebenspraxis natürlicher und konkreter als das moderne, institutionell klingende „Religion“; die genaue griechische Entsprechung muss noch geprüft werden.
- source_word: mortal tabernacle (Greek source review pending)
  choice: sterbliches Zelt
  rationale: Erhält das biblisch-frühchristliche Bild einer vorläufigen, vergänglichen Behausung, ohne es erklärend aufzulösen.
- source_word: sojourn
  choice: als Fremde leben
  rationale: Gibt den Gedanken eines vorläufigen Aufenthalts ohne dauernde Zugehörigkeit in verständlichem modernem Deutsch wieder.
- source_word: office / role
  choice: Aufgabe
  rationale: „Aufgabe“ ist im Deutschen natürlich und umfasst sowohl göttliche Zuweisung als auch Verantwortung, ohne ein kirchliches Amt zu unterstellen.
- source_word: increase more and more daily
  choice: von Tag zu Tag immer mehr zunehmen
  rationale: Bewahrt die offene Aussage des Zeugnisses, die sowohl zahlenmäßiges Wachstum als auch Erstarken anklingen lassen kann.
theological_decisions:
- issue: „Nicht von der Welt“
  choice: Die johanneisch klingende Spannung bleibt wörtlich erhalten.
  alternative: „gehören nicht zur Welt“
  rationale: Die Formulierung lässt Herkunft, Zugehörigkeit und Wesensverschiedenheit bewusst offen und löst die theologische Mehrdeutigkeit nicht einseitig auf.
- issue: Christen halten die Welt zusammen
  choice: Die starke kosmische Aussage wird ohne Abschwächung wiedergegeben.
  alternative: „tragen zum Bestand der Welt bei“
  rationale: Eine abschwächende Paraphrase würde die zugespitzte Analogie des Textes und ihren theologischen Anspruch mindern.
- issue: Unvergänglichkeit im Himmel
  choice: „die Unvergänglichkeit im Himmel erwarten“
  alternative: „auf ewiges Leben im Himmel hoffen“
  rationale: Die abstrakte und offene Ausdrucksweise bleibt erhalten; sie wird nicht vorschnell mit einer bestimmten Jenseitslehre gleichgesetzt.
- issue: Wachstum unter Verfolgung
  choice: „zunehmen“ bleibt unbestimmt.
  alternative: „zahlenmäßig wachsen“ oder „im Glauben stärker werden“
  rationale: Das Zeugnis legt die Art der Zunahme nicht eindeutig fest; beide engeren Deutungen wären interpretierende Festlegungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst parallelem Satzbau, damit die fortlaufende Seele-Körper-/Christen-Welt-Analogie hörbar bleibt. Archaismen wie „allhier“, „darinnen“ oder „es ist ihnen nicht erlaubt“ wurden vermieden. Da kein griechischer Wortlaut bereitgestellt wurde und die Quellenangabe selbst eine ausstehende Prüfung vermerkt, ist der Entwurf ausdrücklich am öffentlichen englischen Zeugnis source-kritisch orientiert; besonders „Gottesverehrung“, „Zelt“, „Aufgabe“ und die Wachstumsformulierung sollten bei direkter griechischer Kollation überprüft werden.
