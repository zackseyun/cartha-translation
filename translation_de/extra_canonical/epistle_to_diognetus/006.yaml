  rationale: 'Die Revision folgt dem griechischen Wortlaut, soweit die entscheidenden Ausdrücke überprüfbar sind: θεοσέβεια wird konsistent als „Gottesverehrung“ wiedergegeben; ἐν οὐρανοῖς bleibt pluralisch; die Behandlung der Seele „unter Hunger und Durst“ und das Zahlreicherwerden der Christen entsprechen dem Text ohne zusätzliche Deutung. Die abschließende τάξις wird als von Gott zugewiesene „Stellung“ wiedergegeben. Da die bisherigen Fußnoten entweder überholte Prüfvorbehalte enthalten oder eine nicht vorhandene Mehrdeutigkeit behaupten, werden sie nicht übernommen.'
