  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: de
  text: 'Da ich nun in den zuvor genannten Personen eure ganze Gemeinde im Glauben gesehen und umarmt habe, ermahne ich euch: Seid eifrig bemüht, alles in göttlicher Eintracht zu tun, wobei der Bischof an der Stelle Gottes vorsteht, die Presbyter an der Stelle der Ratsversammlung der Apostel und auch die Diakone, die mir besonders lieb sind und denen der Dienst Jesu Christi anvertraut ist, der vor den Weltzeiten beim Vater war und am Ende der Zeiten erschienen ist.


    Darum richtet euch alle in eurem Verhalten nach Gott und erweist einander Ehrerbietung. Niemand soll seinen Nächsten nach dem Fleisch ansehen, sondern liebt einander allezeit in Jesus Christus. Nichts soll unter euch sein, das die Macht hätte, euch zu entzweien; vielmehr vereint euch mit dem Bischof und mit denen, die euch vorstehen, zum Vorbild und zur Lehre der Unvergänglichkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aforementioned persons
  choice: die zuvor genannten Personen
  rationale: Gibt den Rückverweis des überlieferten englischen Zeugnisses klar und ohne zusätzliche Identifizierung wieder.
- source_word: whole people
  choice: eure ganze Gemeinde
  rationale: Im kirchlichen Briefkontext bezeichnet die Wendung eher die gesamte örtliche Gemeinschaft als ein Volk im ethnischen oder politischen Sinn.
- source_word: godly concord
  choice: gottgemäße Eintracht
  rationale: Bewahrt sowohl die Ausrichtung an Gott als auch den Gedanken eines harmonischen gemeinsamen Handelns.
- source_word: bishop
  choice: Bischof
  rationale: Der etablierte deutsche Ausdruck für das frühkirchliche Amt; die historische Ausgestaltung des Amtes wird nicht näher festgelegt.
- source_word: presbyters
  choice: Presbyter
  rationale: Bewahrt die frühkirchliche Amtsbezeichnung und vermeidet eine vorschnelle Gleichsetzung mit späteren konfessionellen Amtsformen.
- source_word: council of the Apostles
  choice: Ratsversammlung der Apostel
  rationale: Gibt den kollegialen Beratungscharakter wieder, ohne eine technisch spätere Institution zu unterstellen.
- source_word: deacons / diaconate
  choice: Diakone / Dienst
  rationale: Für die Personen bleibt die geläufige Amtsbezeichnung erhalten; beim anvertrauten Auftrag macht „Dienst“ den Bedeutungsgehalt verständlich und vermeidet unnötige Wortwiederholung.
- source_word: before the worlds
  choice: vor den Weltzeiten
  rationale: Bewahrt die zeitlich-kosmische Weite der Aussage und legt sie nicht eindeutig auf „vor der Schöpfung“ oder „vor allen Zeitaltern“ fest.
- source_word: after the flesh
  choice: nach dem Fleisch beurteilen
  rationale: Erhält die frühchristliche Ausdrucksweise, ergänzt jedoch das im Kontext gemeinte wertende Ansehen durch „beurteilen“.
- source_word: incorruptibility
  choice: Unvergänglichkeit
  rationale: Bewahrt den eschatologischen und ethischen Bedeutungsraum besser als das engere „Unbestechlichkeit“.
theological_decisions:
- issue: Vergleich des Bischofs und der Presbyter mit Gott beziehungsweise den Aposteln
  choice: „nach dem Bild Gottes“ und „nach dem Bild der Ratsversammlung der Apostel“
  alternative: „an der Stelle Gottes“ und „an der Stelle des Apostelrates“
  rationale: „Nach dem Bild“ bewahrt den Vergleichscharakter des Zeugnisses und vermeidet die stärkere Behauptung einer unmittelbaren Stellvertretung.
- issue: Präexistenz Christi
  choice: „der vor den Weltzeiten beim Vater war“
  alternative: „der vor Erschaffung der Welt beim Vater war“
  rationale: Die Formulierung lässt die überlieferte zeitlich-kosmologische Aussage stehen, ohne ihren genauen metaphysischen Umfang enger zu bestimmen.
- issue: „conformity to God“
  choice: „danach, Gott gleichförmig zu werden“
  alternative: „Gott nachzuahmen“ oder „in Übereinstimmung mit Gott zu leben“
  rationale: Die ungewöhnliche, theologisch dichte Formulierung wird bewahrt, ohne sie auf bloße Nachahmung oder ethische Übereinstimmung zu reduzieren.
- issue: Bezug von „als Vorbild und Lehre der Unvergänglichkeit“
  choice: Satzschluss mit Gedankenstrich, der den Bezug zur vereinten Gemeinschaft offenhält
  alternative: Eindeutiger Bezug allein auf die Vorsteher oder allein auf die Einheit
  rationale: Das englische Zeugnis lässt den syntaktischen Bezug unscharf; die Übersetzung löst diese Mehrdeutigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühkirchlich passenden Amtsbezeichnungen. Archaismen wurden vermieden; markante theologische Wendungen wie „nach dem Fleisch“, „Weltzeiten“ und „Unvergänglichkeit“ blieben erhalten. Da keine griechische Textgestalt mitgeliefert wurde und die direkte Quellensprachenprüfung ausdrücklich noch aussteht, ist der Entwurf als sorgfältige, aber vorläufige Übertragung des öffentlichen englischen Zeugnisses gekennzeichnet.
