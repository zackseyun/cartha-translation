revisions:
- from: 'Da ich nun in den zuvor genannten Personen eure ganze Gemeinde im Glauben gesehen und umarmt habe, ermahne ich euch: Seid eifrig darauf bedacht, alles in gottgemäßer Eintracht zu tun. Dabei steht der Bischof nach dem Bild Gottes vor, die Presbyter nach dem Bild der Ratsversammlung der Apostel und ebenso die Diakone, die mir besonders lieb sind. Ihnen ist der Dienst Jesu Christi anvertraut, der vor den Weltzeiten beim Vater war und am Ende der Zeiten erschienen ist.[a]


    Strebt daher alle danach, Gott gleichförmig zu werden, und erweist einander Ehrerbietung. Niemand soll seinen Nächsten nach dem Fleisch beurteilen; liebt einander vielmehr allezeit in Jesus Christus. Nichts, was euch entzweien könnte, soll unter euch Raum haben. Seid vielmehr mit dem Bischof und mit denen, die euch vorstehen, vereint – als Vorbild und Lehre der Unvergänglichkeit.[b]'
  to: 'Da ich nun in den zuvor genannten Personen eure ganze Gemeinde im Glauben gesehen und umarmt habe, ermahne ich euch: Seid eifrig bemüht, alles in göttlicher Eintracht zu tun, wobei der Bischof an der Stelle Gottes vorsteht, die Presbyter an der Stelle der Ratsversammlung der Apostel und auch die Diakone, die mir besonders lieb sind und denen der Dienst Jesu Christi anvertraut ist, der vor den Weltzeiten beim Vater war und am Ende der Zeiten erschienen ist.


    Darum richtet euch alle in eurem Verhalten nach Gott und erweist einander Ehrerbietung. Niemand soll seinen Nächsten nach dem Fleisch ansehen, sondern liebt einander allezeit in Jesus Christus. Nichts soll unter euch sein, das die Macht hätte, euch zu entzweien; vielmehr vereint euch mit dem Bischof und mit denen, die euch vorstehen, zum Vorbild und zur Lehre der Unvergänglichkeit.'
  rationale: Die Fassung wird am griechischen Text der mittleren Rezension ausgerichtet, besonders bei εἰς τόπον θεοῦ und εἰς τόπον συνεδρίου ἀποστόλων. Die Abweichung vom englischen Audit-Zeugnis wird damit nicht fortgeschrieben. Die historische Amtssprache bleibt erhalten, ohne spätere kirchenrechtliche oder konfessionelle Deutungen einzutragen. Nicht notwendige Vorläufigkeits- und Mehrdeutigkeitsfußnoten werden entfernt.
