  to: 'Aus diesem Grund empfing der Herr Salböl auf seinen Kopf, damit er der Kirche Unvergänglichkeit einhauche. Lasst euch nicht mit dem üblen Geruch der Lehre des Herrschers dieses Zeitalters salben, damit er euch nicht gefangen nimmt und euch von dem Leben wegführt, das vor euch liegt.


    Warum leben wir nicht alle verständig, nachdem wir die Erkenntnis Gottes empfangen haben, die Jesus Christus ist? Warum gehen wir in unserer Torheit zugrunde, ohne die Gnadengabe zu kennen, die der Herr wahrhaftig gesandt hat?'
  rationale: Die Revision folgt vorrangig dem griechischen Wortlaut der mittleren Rezension und berücksichtigt die englische POB-Fassung als Audit-Trail. Sie korrigiert die zeitliche Nuance von αἰών, stellt bei ἀπάγω die konkrete Wegführungsmetapher wieder her und gibt ἀγνοέω als Unkenntnis wieder. Die knappe, theologisch gewichtige Aussage „die Jesus Christus ist“ bleibt bewusst unverändert; sie wird nicht zu einer konfessionell engeren Erklärung umgeformt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:51:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Eine Prüfung gegen den überlieferten griechischen Wortlaut legt zwei Korrekturen nahe: ἄρχων τοῦ αἰῶνος τούτου bezeichnet den „Herrscher dieses Zeitalters“ (nicht ausdrücklich „dieser Welt“), und ἀπαγάγῃ ... τοῦ προκειμένου βίου meint, dass er die Angeredeten von dem vor ihnen liegenden Leben wegführt. Das Atembild bei πνέῃ ... ἀφθαρσίαν sowie die prädikative Gleichsetzung der Gotteserkenntnis mit Jesus Christus bleiben erhalten.'
  naturalness: Der Entwurf ist insgesamt würdig und gut verständlich. „auf seinem Haupt“ und besonders „euch des Lebens beraubt“ wirken jedoch weniger natürlich bzw. geben die zugrunde liegende Bewegungsmetapher nicht präzise wieder. Die Überarbeitung verwendet modernes Standarddeutsch, ohne die Bildsprache zu glätten.
  terminology: „Unvergänglichkeit“, „Gnadengabe“ und „Erkenntnis Gottes“ sind angemessen. „Herrscher dieses Zeitalters“ gibt den griechischen Ausdruck genauer wieder und bewahrt dessen apokalyptisch-zeitliche Nuance. „Salböl“ ist als Wiedergabe von μύρον vertretbar.
  issues:
  - severity: medium
    issue: „Herrscher dieser Welt“
    rationale: Der griechische Text hat τοῦ αἰῶνος τούτου, wörtlich „dieses Zeitalters/dieser Weltzeit“. Die englische Zeugenübersetzung glättet dies zu „world“; für die Quelltreue sollte die zeitliche Bedeutung im Deutschen stehen bleiben.
  - severity: medium
    issue: „euch des Lebens beraubt“
    rationale: ἀπαγάγῃ ... τοῦ προκειμένου βίου bedeutet eher „euch von dem vor euch liegenden Leben wegführt/fortführt“ als ein allgemeines Berauben. Die Korrektur bewahrt die Bewegungsmetapher und den Bezug auf das vorgelegte Leben.
  - severity: low
    issue: „erkennen die Gnadengabe nicht“
    rationale: ἀγνοοῦντες bezeichnet Nichtwissen bzw. Unkenntnis. „ohne ... zu kennen“ ist unmittelbarer und vermeidet die mögliche Bedeutung von „nicht als solche erkennen“.
