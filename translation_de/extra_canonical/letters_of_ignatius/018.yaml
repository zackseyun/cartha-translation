revisions:
- from: 'Aus diesem Grund empfing der Herr Salböl auf seinem Haupt, damit er der Kirche Unvergänglichkeit einhauche. Lasst euch nicht mit dem üblen Geruch der Lehre des Herrschers dieser Welt salben, damit er euch nicht gefangen wegführt und euch des Lebens beraubt, das vor euch liegt.


