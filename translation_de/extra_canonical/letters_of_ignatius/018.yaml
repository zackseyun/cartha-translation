base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: de
  text: 'Aus diesem Grund empfing der Herr Salböl auf seinen Kopf, damit er der Kirche Unvergänglichkeit einhauche. Lasst euch nicht mit dem üblen Geruch der Lehre des Herrschers dieses Zeitalters salben, damit er euch nicht gefangen nimmt und euch von dem Leben wegführt, das vor euch liegt.


    Warum leben wir nicht alle verständig, nachdem wir die Erkenntnis Gottes empfangen haben, die Jesus Christus ist? Warum gehen wir in unserer Torheit zugrunde, ohne die Gnadengabe zu kennen, die der Herr wahrhaftig gesandt hat?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ointment
  choice: Salböl
  rationale: Gibt das Bild einer Salbung natürlicher und konkreter wieder als das allgemeinere „Salbe“.
- source_word: breathe incorruption upon
  choice: Unvergänglichkeit einhauche
  rationale: Bewahrt das auffällige Atembild und den theologischen Begriff der Unvergänglichkeit, ohne ihn erklärend aufzulösen.
- source_word: prince of this world
  choice: Herrscher dieser Welt
  rationale: „Herrscher“ ist im heutigen Deutsch verständlich und wahrt den traditionellen theologischen Titel ohne unnötig feudale Färbung.
- source_word: walk prudently
  choice: verständig unseren Weg gehen
  rationale: Erhält die Weg-Metapher und gibt prudent als besonnenes, einsichtsvolles Handeln wieder.
- source_word: gift of grace
  choice: Gnadengabe
  rationale: Ein geläufiger, kompakter theologischer Ausdruck, der sowohl Gabe als auch Gnade abbildet.
theological_decisions:
- issue: Beziehung zwischen der Erkenntnis Gottes und Jesus Christus
  choice: „die Jesus Christus ist“
  alternative: „nämlich Jesus Christus“
  rationale: Die prädikative Form wahrt die starke Identifikation und ihre theologische Spannung, statt sie lediglich erläuternd abzuschwächen.
- issue: Bedeutung von „Unvergänglichkeit“
  choice: Der abstrakte Begriff bleibt unbestimmt stehen.
  alternative: Auslegung als Unsterblichkeit, ewiges Leben oder Schutz vor Verderben
  rationale: Der überlieferte Wortlaut lässt die genaue Reichweite offen; eine konfessionell oder dogmatisch engere Deutung wird daher nicht eingetragen.
- issue: Subjekt des Sendens im Schlusssatz
  choice: „die der Herr wahrhaftig gesandt hat“
  alternative: „die uns der Herr wahrhaftig gesandt hat“
  rationale: Kein indirektes Objekt wird ergänzt; die knappe und potenziell offene Form des Zeugnisses bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten Bildern und theologischen Schlüsselbegriffen. Der Entwurf ist wegen der noch ausstehenden unmittelbaren Prüfung des griechischen Textes vorläufig; er folgt dem bereitgestellten englischen Textzeugen und nutzt die englische POB-Fassung nur als konsultative Schicht.
