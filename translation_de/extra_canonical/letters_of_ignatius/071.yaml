base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: de
  text: 'Denn selbst wenn einige mich auf menschliche Weise täuschen wollten, lässt sich der Geist, der von Gott ist, nicht täuschen. Er weiß nämlich, woher er kommt und wohin er geht, und er erforscht das Verborgene. Als ich bei euch war, rief ich laut; mit Gottes Stimme sprach ich: „Achtet auf den Bischof, die Ältestenschaft und die Diakone!“


    Allerdings vermuteten einige, ich hätte dies gesagt, weil ich im Voraus von der Spaltung mancher wusste. Doch der, in dem ich gebunden bin, ist mein Zeuge: Von menschlicher Seite habe ich es nicht erfahren.[a] Vielmehr war es die Verkündigung des Geistes, der so sprach: „Tut nichts ohne den Bischof. Bewahrt euren Leib als Tempel Gottes. Pflegt die Einheit. Meidet Spaltungen. Ahmt Jesus Christus nach, wie auch er selbst seinen Vater nachahmte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nicht von Menschenfleisch habe ich es erfahren.“'
    reason: Die ungewöhnliche körperbezogene Ausdrucksweise des Zeugen wird dokumentiert; die Hauptübersetzung gibt ihren wahrscheinlichen Sinn in verständlichem Deutsch wieder.
lexical_decisions:
- source_word: after the flesh
  choice: auf menschliche Weise
  rationale: Gibt den semitisch-paulinisch geprägten Gegensatz verständlich wieder, ohne hier vorschnell eine rein körperliche Täuschung anzunehmen.
- source_word: spirit
  choice: Geist
  rationale: Bewahrt die mögliche Spannung zwischen dem menschlichen Geist des Sprechers und dem von Gott wirkenden Geist; die Kleinschreibung des griechischen Ausgangstextes lässt sich im Deutschen nicht abbilden.
- source_word: presbytery
  choice: Ältestenschaft
  rationale: Bezeichnet das Kollegium der Presbyter und vermeidet die im Deutschen enger konfessionell geprägte Bedeutung von „Presbyterium“.
- source_word: keep your flesh
  choice: Bewahrt euren Leib
  rationale: Natürliches Deutsch im Tempelbild; „Leib“ gibt den körperlichen Bezug würdig wieder, während ein wörtliches „Fleisch“ hier missverständlich wäre.
- source_word: cherish union
  choice: Pflegt die Einheit
  rationale: Erfasst den aktiven, dauerhaften Einsatz für Eintracht in natürlicher deutscher Sprache.
theological_decisions:
- issue: Identität des Geistes im ersten Absatz
  choice: „der Geist, der von Gott ist“ ohne weitere Präzisierung
  alternative: ausdrücklich „der Heilige Geist“ oder „mein Geist“
  rationale: Die überlieferte Formulierung lässt die Beziehung zwischen dem Geist des Sprechers und Gottes Geist in gewissem Maß offen; die Übersetzung bewahrt diese Spannung.
- issue: „mit Gottes Stimme“
  choice: Die starke Formulierung wird unmittelbar beibehalten
  alternative: „mit einer von Gott gegebenen Stimme“ oder „im Auftrag Gottes“
  rationale: Die Abschwächungen würden eine Deutung eintragen, die im vorliegenden Zeugen nicht ausdrücklich steht.
- issue: kirchliches Leitungsamt
  choice: Bischof, Ältestenschaft und Diakone
  alternative: konfessionell angepasste Amtsbezeichnungen
  rationale: Die historisch bezeugten Amtsbegriffe werden wiedergegeben, ohne spätere konfessionelle Amtslehren einzutragen.
- issue: Christus als Nachahmer des Vaters
  choice: „wie auch er selbst seinen Vater nachahmte“
  alternative: „wie er selbst dem Vater gehorsam war“
  rationale: Bewahrt die auffällige Parallelität und theologische Spannung des Zeugen, statt sie erklärend auf Gehorsam zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen. Wegen der noch ausstehenden direkten Prüfung des griechischen Textes bleibt der Entwurf ausdrücklich am angegebenen englischen Zeugen orientiert; besonders die Wendungen zu „Geist“, „Fleisch“ und „Gottes Stimme“ sollten bei der Quellenprüfung erneut bewertet werden.
