base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: de
  text: 'Denn wenn ich in so kurzer Zeit eine solche Gemeinschaft mit eurem Bischof hatte – nicht auf rein menschliche Weise, sondern im Geist –, wie viel mehr beglückwünsche ich euch, die ihr so eng mit ihm verbunden seid, wie die Kirche mit Jesus Christus und wie Jesus Christus mit dem Vater, damit alles in einträchtiger Einheit zusammenklingt.


    Niemand lasse sich täuschen: Wer außerhalb des Altars[a] ist, dem fehlt das Brot Gottes.[b] Denn wenn schon das Gebet von ein oder zwei Menschen eine solche Kraft hat, wie viel mehr das Gebet des Bischofs und der ganzen Kirche!


    Wer daher nicht zur Versammlung kommt, zeigt damit seinen Hochmut und hat sich selbst abgesondert; denn es steht geschrieben: »Gott widersteht den Hochmütigen.«[c] Achten wir also darauf, uns dem Bischof nicht zu widersetzen, damit wir uns durch unsere Unterordnung Gott hingeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im vorliegenden Zeugen eine Wendung wie »außerhalb des Altarbereichs«. Gemeint sein kann die Gemeinschaft der versammelten Kirche, möglicherweise mit eucharistischem Anklang.
    reason: Die kultische Metapher ist mehrdeutig und soll nicht stillschweigend auf eine einzige kirchenrechtliche oder sakramentale Deutung festgelegt werden.
  - marker: b
    text: Die Worte »Gottes« sind im zugrunde gelegten englischen Zeugen als textlich unsicher gekennzeichnet. Eine unmittelbare Prüfung der griechischen Überlieferung steht noch aus.
    reason: Dokumentiert die Unsicherheit der zugrunde liegenden Lesart.
  - marker: c
    text: Vgl. Sprüche 3,34 in der griechischen Fassung; der Satz wird auch in Jakobus 4,6 und 1. Petrus 5,5 angeführt.
    reason: Weist die Schriftquelle und ihre neutestamentliche Rezeption aus.
lexical_decisions:
- source_word: converse / fellowship (Greek source review pending)
  choice: Gemeinschaft
  rationale: Gibt die persönliche geistliche Verbundenheit natürlicher und umfassender wieder als bloßes „Gespräch“, ohne die genaue griechische Nuance endgültig festzulegen.
- source_word: closely joined
  choice: eng verbunden
  rationale: Bewahrt das Bild fester Verbindung in idiomatischem modernem Deutsch.
- source_word: harmonious in unity
  choice: in einträchtiger Einheit zusammenklingt
  rationale: Erhält sowohl den Harmoniegedanken als auch die Einheit und macht das musikalische Bild im Deutschen hörbar.
- source_word: precinct of the altar
  choice: außerhalb des Altars
  rationale: Bewahrt die auffällige kultische Metapher, statt sie vorschnell als Kirchenmitgliedschaft oder Eucharistiezulassung auszudeuten.
- source_word: bread [of God]
  choice: Brot Gottes
  rationale: Übernimmt die durch den Zeugen angezeigte Lesart, markiert aber ihre textliche Unsicherheit in einer Fußnote.
- source_word: congregation
  choice: Versammlung
  rationale: Bezeichnet hier das konkrete Zusammenkommen der Gemeinde und vermeidet eine unnötige institutionelle Verengung.
- source_word: submission
  choice: Unterordnung
  rationale: Gibt den sachlichen Gehalt deutlich wieder; „Gehorsam“ wäre interpretierend enger.
theological_decisions:
- issue: Bedeutung des Altars
  choice: Die Altarformulierung bleibt als Metapher stehen.
  alternative: Auslegung als eucharistische Gemeinschaft, kirchlicher Binnenraum oder Gemeinschaft mit dem Bischof.
  rationale: Der Ausdruck trägt ekklesiale und eucharistische Anklänge, doch der vorgelegte englische Zeuge erlaubt keine sichere Festlegung auf nur eine Deutung.
- issue: Verhältnis von Bischof und ganzer Kirche im Gebet
  choice: „das Gebet des Bischofs und der ganzen Kirche“
  alternative: „das Gebet des Bischofs, ja der ganzen Kirche“ oder getrennte Gebete.
  rationale: Bewahrt die koordinierte Formulierung des Zeugen, ohne die Autorität des Bischofs gegen die Gemeinde auszuspielen.
- issue: Unterordnung unter den Bischof als Hingabe an Gott
  choice: Die gedankliche Verknüpfung wird direkt erhalten.
  alternative: Abschwächung zu bloßem Respekt oder Gleichsetzung des Bischofs mit Gott.
  rationale: Ignatius verbindet beides eng, setzt den Bischof aber nicht ausdrücklich mit Gott gleich; die Übersetzung soll weder abschwächen noch übersteigern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung des mittelrezensionellen griechischen Textes vorläufig und folgt quellennah dem bereitgestellten gemeinfreien englischen Zeugen. Archaismen wurden vermieden; markante ignatianische Bilder und ekklesiologische Spannungen blieben erhalten.
