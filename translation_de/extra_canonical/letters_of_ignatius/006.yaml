review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere sachliche Korrektur ist erforderlich: Der mittelrezensionelle griechische Text lautet an der ersten Stelle nicht „im Geist“, sondern „nicht nach Menschenart, sondern gemäß Jesus Christus“ (οὐ κατὰ ἄνθρωπον, ἀλλὰ κατὰ Ἰησοῦν Χριστόν). Der englische POB-Audit-Text folgt dort dem bereitgestellten Lightfoot-Zeugen, weicht jedoch vom griechischen Wortlaut ab. Außerdem gibt „glücklich preisen“ μακαρίζω genauer wieder als „beglückwünschen“, und die Ortsmetapher beim Altar sollte als „innerhalb des Bereichs des Altars“ präziser erhalten bleiben. Die eckige Markierung bei [Gottes] ist im Text beizubehalten, da die Lesart im vorliegenden Zeugen unsicher ist.'
  naturalness: Der Entwurf ist überwiegend klares, würdiges modernes Standarddeutsch. „Zusammenklingt“ ist verständlich, aber „in Einheit zusammenstimmt“ ist in diesem argumentativen Kontext natürlicher. „Umgang“ ist für die persönliche Begegnung/Vertrautheit mit dem Bischof weniger interpretierend als „Gemeinschaft“.
  terminology: „Kirche“, „Bischof“, „Altar“, „Versammlung“ und „Unterordnung“ sind angemessen. Die Formulierung über den Altar bleibt bewusst bildhaft und legt weder eine ausschließlich sakramentale noch eine kirchenrechtliche Deutung fest. „Gemäß Jesus Christus“ wahrt die ungewöhnliche, aber theologisch nicht zu glättende Bezugsformulierung des griechischen Textes.
  issues:
  - severity: high
    issue: „im Geist“ statt „gemäß Jesus Christus“
    rationale: Die deutsche Fassung übernimmt hier die Abweichung des englischen Audit-Zeugen. Der griechische mittelrezensionelle Wortlaut hat κατὰ Ἰησοῦν Χριστόν, nicht „im Geist“. Die Änderung ist für die Quellenbindung wesentlich.
  - severity: medium
    issue: „beglückwünsche“ für μακαρίζω
    rationale: Das Verb bedeutet hier eher „glücklich preisen/preisen selig“ als jemandem zu einem Erfolg zu gratulieren.
  - severity: medium
    issue: „außerhalb des Altars“ und fehlende Textklammern bei Gottes
    rationale: Die Vorlage spricht vom Innerhalbsein im Bereich/Bezirk des Altars; die präzisere deutsche Metapher vermeidet ein allzu buchstäbliches räumliches Missverständnis. Die Klammern bei [Gottes] sollen die im Zeugen markierte textliche Unsicherheit sichtbar im Haupttext abbilden.
  revised_text: 'Denn wenn ich in so kurzer Zeit einen solchen Umgang mit eurem Bischof hatte – nicht nach Menschenart, sondern gemäß Jesus Christus –, wie viel mehr preise ich euch glücklich, die ihr so eng mit ihm verbunden seid, wie die Kirche mit Jesus Christus und Jesus Christus mit dem Vater, damit alles in Einheit zusammenstimmt.


    Niemand lasse sich täuschen. Wenn jemand nicht innerhalb des Bereichs des Altars[a] ist, fehlt ihm das Brot [Gottes].[b] Denn wenn schon das Gebet von einem oder zwei Menschen so große Kraft hat, wie viel mehr das des Bischofs und der ganzen Kirche!


    Wer daher nicht zur Versammlung kommt, zeigt dadurch seinen Hochmut und hat sich selbst abgesondert. Denn es steht geschrieben: »Gott widersteht den Hochmütigen.«[c] Achten wir also darauf, uns dem Bischof nicht zu widersetzen, damit wir uns durch unsere Unterordnung Gott hingeben.'
  revised_footnotes:
  - marker: a
    text: Die Formulierung bezeichnet wörtlich das Innerhalbsein im Bereich des Altars. Gemeint sein kann die Gemeinschaft der versammelten Kirche, möglicherweise mit eucharistischem Anklang.
    reason: Die kultische Metapher ist mehrdeutig und soll nicht stillschweigend auf eine einzige kirchenrechtliche oder sakramentale Deutung festgelegt werden.
  - marker: b
    text: Die Worte »Gottes« sind im zugrunde gelegten englischen Zeugen als textlich unsicher gekennzeichnet. Eine unmittelbare Prüfung der griechischen Überlieferung steht noch aus.
    reason: Die eckigen Klammern im Haupttext und diese Anmerkung dokumentieren die Unsicherheit der zugrunde gelegten Lesart.
  - marker: c
    text: Vgl. Sprüche 3,34 in der griechischen Fassung; der Satz wird auch in Jakobus 4,6 und 1. Petrus 5,5 angeführt.
    reason: Weist die Schriftquelle und ihre neutestamentliche Rezeption aus.
  revision_rationale: Die Revision korrigiert vor allem die erste christologische Wendung anhand des griechischen mittelrezensionellen Wortlauts und markiert damit zugleich eine Abweichung im englischen Audit-Trail. Sie verbessert zudem die Wiedergabe von μακαρίζω, erhält die metaphorische Reichweite des Altarbildes und macht die bereits dokumentierte Unsicherheit von [Gottes] im Haupttext sichtbar. Die Aussage über die Unterordnung unter den Bischof wird weder abgeschwächt noch zu einer Gleichsetzung des Bischofs mit Gott erweitert.
