revisions:
- from: 'Wenn also diejenigen, die nach den alten Ordnungen gelebt hatten, zu einer neuen Hoffnung gelangten und nun nicht mehr den Sabbat hielten, sondern ihr Leben nach dem Tag des Herrn ausrichteten[a] – dem Tag, an dem auch unser Leben durch ihn und durch seinen Tod aufging, den einige leugnen –, wenn wir durch dieses Geheimnis zum Glauben kamen und deshalb geduldig ausharren, damit wir als Jünger von Jesus Christus, unserem einzigen Lehrer, erfunden werden: Wie könnten wir dann ohne ihn leben? Selbst die Propheten waren ja seine Jünger und erwarteten ihn durch den Geist als ihren Lehrer. Und deshalb kam der, auf den sie mit Recht warteten, und weckte sie von den Toten auf.[b]'
