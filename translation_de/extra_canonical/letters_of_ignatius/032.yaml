    if this be so, how shall we be able to live apart from Him? seeing that even the prophets, being His disciples, were expecting Him as their teacher through the Spirit. And for this cause He whom they rightly awaited, when He one, raised them from the dead.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: de
  text: 'Wenn nun diejenigen, die in alten Ordnungen lebten, zu einer neuen Hoffnung gelangt sind und nicht mehr den Sabbat halten, sondern nach dem Tag des Herrn leben[a] – an dem auch unser Leben durch ihn und durch seinen Tod aufging, den einige leugnen –, durch dieses Geheimnis zum Glauben gelangt sind und deshalb geduldig ausharren, damit wir als Jünger Jesu Christi, unseres einzigen Lehrers, erfunden werden: Wie werden wir dann ohne ihn leben können? Denn auch die Propheten erwarteten ihn durch den Geist als ihren Lehrer, da sie seine Jünger waren. Deshalb weckte der, den sie mit Recht erwarteten, sie, als er gegenwärtig war, von den Toten auf.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sondern nach dem Herrentag lebten«. Die griechische Wendung ist elliptisch; möglich ist auch: »sondern gemäß dem Tag des Herrn lebten«.'
    reason: Kennzeichnet die sprachliche Kürze und die Auslegungsbreite der Wendung κατὰ κυριακὴν ζῶντες.
  - marker: b
    text: 'Wörtlich: »als er gegenwärtig war, weckte er sie von den Toten auf«. Das Partizip παρών bedeutet primär »gegenwärtig/anwesend«; kontextuell kann es auch das Gekommensein des Erwarteten andeuten.'
    reason: Bewahrt die griechische Formulierung παρὼν ἤγειρεν αὐτοὺς ἐκ νεκρῶν und vermeidet eine alleinige Festlegung auf »kam«.
lexical_decisions:
- source_word: ἐν παλαιοῖς πράγμασιν ἀναστραφέντες
  choice: die nach den alten Ordnungen gelebt hatten
  rationale: Gibt die Lebensführung in den früheren, überlieferten Verhältnissen wieder, ohne den Ausdruck abwertend als bloß veraltete Bräuche festzulegen.
- source_word: μηκέτι σαββατίζοντες
  choice: nun nicht mehr den Sabbat hielten
  rationale: Das Verb bezeichnet das Begehen beziehungsweise Einhalten des Sabbats; die Formulierung bleibt verständlich und vermeidet eine unnötige konfessionelle Zuspitzung.
- source_word: κατὰ κυριακὴν ζῶντες
  choice: ihr Leben nach dem Tag des Herrn ausrichteten
  rationale: Bewahrt sowohl den Bezug auf den Herrentag als auch den Aspekt der Lebensführung; die elliptische griechische Formulierung wird in der Fußnote kenntlich gemacht.
- source_word: ἀνέτειλεν
  choice: aufging
  rationale: Erhält das Bild vom Aufgehen oder Anbrechen des Lebens, statt es auf ein rein sachliches »entstand« zu reduzieren.
- source_word: ὑπομένομεν
  choice: geduldig ausharren
  rationale: Vermittelt standhaftes Ertragen und beharrliches Bleiben unter Bedrängnis.
- source_word: παρών
  choice: kam
  rationale: Der griechische Ausdruck bedeutet wörtlich »gegenwärtig/anwesend geworden«; im Zusammenhang ist das Kommen des Erwarteten im Blick.
theological_decisions:
- issue: Bezug von »den einige leugnen«
  choice: Bezug auf den Tod Christi
  alternative: Bezug auf das zuvor genannte Leben oder auf den gesamten vorausgehenden Gedanken
  rationale: Das Relativpronomen steht unmittelbar beim Tod und kann sich grammatisch darauf beziehen; die Formulierung bewahrt dennoch die knappe Syntax des Ausgangstextes.
- issue: Auferweckung der Propheten
  choice: Christus weckte die erwartenden Propheten von den Toten auf
  alternative: Bildliche Belebung oder Befreiung der Propheten
  rationale: Der Wortlaut sagt ausdrücklich »aus den Toten«; eine nähere dogmatische Erklärung wird nicht in den Text eingetragen.
- issue: Tag des Herrn und Sabbat
  choice: Als Gegenüberstellung zweier Weisen der Lebensausrichtung wiedergegeben
  alternative: Als ausdrückliche kirchenrechtliche Abschaffung oder Ersetzung des Sabbats formulieren
  rationale: Der Text stellt Sabbatfeier und Leben nach dem Herrentag gegenüber, formuliert aber keine umfassende Lehrbestimmung über das Gesetz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überschaubaren Satzgliedern. Die lange hypotaktische Gedankenführung des griechischen Textes bleibt erkennbar, wird aber durch Gedankenstriche und Doppelpunkt lesbar gegliedert. Theologisch aufgeladene Aussagen werden weder abgeschwächt noch über den Wortlaut hinaus systematisiert.
