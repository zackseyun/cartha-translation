review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem gelieferten englischen Zeugen im Wesentlichen zuverlässig. Die Ergänzung [Christ] muss jedoch im Deutschen grammatisch als Genitiv-Apposition wiedergegeben werden. „Davon“ in „Nichts davon wird euch verloren gehen“ grenzt den offenen Aussagegehalt des Zeugen unnötig auf die zuvor genannte Hilfe ein und sollte entfallen.
  naturalness: Der Ton ist überwiegend würdig und verständlich. „als Diener [Christi], Gottes“ ist jedoch keine natürliche oder klare deutsche Konstruktion. Die überarbeitete Fassung wahrt die textkritisch markierte, theologisch gewichtige Benennung und bleibt zugleich syntaktisch lesbar.
  terminology: „Diener“ bewahrt den nicht weiter spezifizierten Dienstbegriff. „Erquickung verschafft“ ist angemessen gehoben; „vollkommene Treue“ erhält die auffällige abstrakte Prädikation. Die Formulierung „des [Christus,] Gottes“ bildet die im englischen Zeugen durch Klammern markierte unsichere Lesart ab, ohne sie als unmarkierte dogmatische Glättung auszugeben.
  issues:
  - severity: medium
    issue: Unklare und grammatisch missglückte Wiedergabe von „ministers of [Christ] God“
    rationale: „als Diener [Christi], Gottes“ trennt zwei Genitive in einer im modernen Deutschen unklaren Weise. „als Diener des [Christus,] Gottes“ macht die appositionelle Lesart grammatisch erkennbar und bewahrt die Klammermarkierung der Ergänzung.
  - severity: low
    issue: Zusatz „davon“ bei „Nothing shall be lost to you“
    rationale: Der Zusatz legt den Bezug ausdrücklich auf die konkrete erwiesene Hilfe fest. Der Zeuge formuliert offener; „Nichts wird euch verlorengehen“ bewahrt diese Offenheit.
  - severity: low
    issue: Fußnotenanker steht nicht unmittelbar an der textkritisch markierten Lesart
    rationale: Der Anker soll die eckig geklammerte Ergänzung direkt dokumentieren, nicht allgemein den gesamten Satzabschluss.
  revised_text: 'Ihr habt gut daran getan, Philo und Rhaius Agathopus, die mir um der Sache Gottes willen gefolgt sind, als Diener des [Christus,] Gottes aufzunehmen[a]. Auch sie danken dem Herrn für euch, weil ihr ihnen in jeder Hinsicht Erquickung verschafft habt. Nichts wird euch verlorengehen.


    Mein Geist ist für euch hingegeben, ebenso meine Fesseln, die ihr weder verachtet noch euch ihrer geschämt habt. Auch der, der vollkommene Treue ist, Jesus Christus, wird sich euer nicht schämen.'
  revised_footnotes:
  - marker: a
    text: Die Wiedergabe folgt an dieser Stelle dem überlieferten englischen Zeugen. Die eckigen Klammern kennzeichnen „Christus“ als textkritische Ergänzung. Die Formulierung „des [Christus,] Gottes“ gibt die dortige Wortfolge „[Christ] God“ als deutsche Genitiv-Apposition wieder; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Dokumentiert die nur im englischen Zeugen bezeugte, textkritisch markierte Ergänzung unmittelbar an der betreffenden Stelle und erklärt die notwendige deutsche Syntax.
  revision_rationale: Die Revision korrigiert ausschließlich sichere deutsche Form-, Klarheits- und Ankerfragen. Sie erhält die vorläufige Abhängigkeit vom öffentlichen englischen Zeugen, die eckig markierte textkritische Unsicherheit, den offenen Sinn der Zusage und die ungewöhnlich substantivische Aussage über Jesus Christus.
