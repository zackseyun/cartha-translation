base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: de
  text: 'Ihr habt gut daran getan, Philo und Rhaius Agathopus, die mir um der Sache Gottes willen gefolgt sind, als Diener [Christi], Gottes, aufzunehmen.[a] Auch sie danken dem Herrn für euch, weil ihr ihnen in jeder Hinsicht Erquickung verschafft habt. Nichts davon wird euch verloren gehen.


    Mein Geist ist euch hingegeben, ebenso meine Fesseln, die ihr nicht verachtet und deren ihr euch nicht geschämt habt. Auch der, der vollkommene Treue ist, Jesus Christus, wird sich euer nicht schämen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wiedergabe folgt hier dem überlieferten englischen Zeugen. Die eckigen Klammern um „Christi“ kennzeichnen eine textkritische Ergänzung; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die Quellenangabe erklärt ausdrücklich, dass die griechische Prüfung noch aussteht, und der englische Zeuge markiert „Christ“ als Ergänzung.
lexical_decisions:
- source_word: in the cause of God
  choice: um der Sache Gottes willen
  rationale: Gibt den im englischen Zeugen bezeugten Sinn natürlich und würdevoll wieder, ohne mangels direkter griechischer Prüfung eine engere Bedeutung festzulegen.
- source_word: ministers
  choice: Diener
  rationale: Bewahrt den allgemeinen Dienstbegriff und vermeidet eine vorschnelle Festlegung auf ein kirchliches Amt.
- source_word: refreshed
  choice: Erquickung verschafft
  rationale: Drückt fürsorgliche Stärkung und Unterstützung aus und wahrt den gehobenen Ton des Zeugen.
- source_word: My spirit is devoted for you
  choice: Mein Geist ist euch hingegeben
  rationale: Bewahrt die ungewöhnliche, intensive Formulierung, statt sie zu einer bloßen Gruß- oder Zuneigungsformel abzuschwächen.
- source_word: perfect faithfulness
  choice: vollkommene Treue
  rationale: Erhält die abstrakte Prädikation und ihre theologische Spannung.
theological_decisions:
- issue: Lesart bzw. Ergänzung in „ministers of [Christ] God“
  choice: als Diener [Christi], Gottes
  alternative: als Diener Christi, unseres Gottes / als Diener Gottes
  rationale: Die eckigen Klammern bleiben als Signal einer textkritischen Ergänzung erhalten. Die Zeichensetzung bildet den gelieferten Zeugen möglichst eng ab, ohne die noch ausstehende Prüfung des Griechischen vorzutäuschen.
- issue: Bezug von „he who is perfect faithfulness“
  choice: der, der vollkommene Treue ist, Jesus Christus
  alternative: Jesus Christus, der vollkommen treu ist
  rationale: Die Identifikation mit Jesus Christus wird bewahrt, zugleich aber die markante substantivische Aussage „Treue ist“ nicht zu einem gewöhnlichen Adjektiv geglättet.
- issue: Vergeltung für die erwiesene Hilfe
  choice: Nichts davon wird euch verloren gehen
  alternative: Euch wird nichts verloren gehen
  rationale: „Davon“ verdeutlicht vorsichtig den Bezug auf ihre Wohltaten, ohne Art oder Zeitpunkt des Lohnes dogmatisch zu bestimmen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, brieflichem Ton. Die Anrede steht im Plural. Ungewöhnliche Aussagen wie „Mein Geist ist euch hingegeben“ und „vollkommene Treue ist“ wurden bewusst nicht eingeebnet. Da nur ein englischer gemeinfreier Zeuge vorliegt und die direkte Prüfung der mittelrezensionalen griechischen Überlieferung aussteht, bleibt der Entwurf ausdrücklich vorläufig.
