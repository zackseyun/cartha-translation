source:
  text: Forasmuch then as I was permitted to see you in the person of Damas your godly bishop and your worthy presbyters Bassus and Apollonius and my fellow-servant the deacon Zotion, of whom I would fain have joy, for that he is subject to the bishop as unto the grace of God and to the presbytery as unto the law of Jesus Christ:--
