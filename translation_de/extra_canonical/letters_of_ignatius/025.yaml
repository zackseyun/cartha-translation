base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: de
  text: Da es mir nun vergönnt war, euch durch Damas, euren überaus gottverbundenen Bischof, sowie durch eure würdigen Ältesten Bassus und Apollonius und meinen Mitdiener, den Diakon Zotion, zu sehen, mit dem ich mich gern freuen möchte, weil er sich dem Bischof wie der Gnade Gottes und dem Ältestenrat wie dem Gesetz Jesu Christi unterordnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly
  choice: Gott ergebenen
  rationale: Gibt die Frömmigkeit bzw. Gottesbezogenheit in natürlichem modernem Deutsch wieder, ohne eine stärkere Aussage wie „göttlich“ nahezulegen.
- source_word: presbyters / presbytery
  choice: Ältesten / Ältestenrat
  rationale: Bewahrt die frühchristliche Amtsbezeichnung verständlich und unterscheidet die einzelnen Amtsträger vom Kollegium.
- source_word: fellow-servant
  choice: Mitknecht
  rationale: Erhält das gemeinsame Dienstverhältnis, das in der traditionellen frühchristlichen Ausdrucksweise anklingt.
- source_word: be subject
  choice: sich … unterordnet
  rationale: Gibt die institutionelle Unterordnung klar wieder, ohne sie durch zusätzliche Wertungen zu verstärken.
- source_word: law of Jesus Christ
  choice: Gesetz Jesu Christi
  rationale: Bewahrt die markante und theologisch spannungsreiche Gesetzessprache des Zeugnisses unverändert.
theological_decisions:
- issue: Vergleich der Unterordnung unter den Bischof mit der Gnade Gottes
  choice: „wie der Gnade Gottes“
  alternative: „als wäre er die Gnade Gottes“
  rationale: Die knappe Vergleichsform bleibt erhalten; eine Identifizierung des Bischofs mit der Gnade Gottes wird nicht ausdrücklich behauptet.
- issue: Vergleich des Ältestenrats mit dem Gesetz Jesu Christi
  choice: „wie dem Gesetz Jesu Christi“
  alternative: „als wäre er das Gesetz Jesu Christi“
  rationale: Bewahrt die Parallelstruktur und die genuine theologische Spannung, ohne den Vergleich dogmatisch auszudeuten.
- issue: Fortlaufender Satzanschluss
  choice: Abschluss mit Gedankenstrich und Komma
  alternative: Abschluss als vollständiger Satz
  rationale: Der Abschnitt ist syntaktisch als Einleitung zum folgenden Gedankengang überliefert; die offene Konstruktion wird sichtbar gehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Da eine direkte Prüfung des griechischen Textes noch aussteht, ist der Entwurf bewusst eng am angegebenen öffentlichen englischen Zeugen gehalten. Keine Fußnoten erforderlich; daher stehen auch keine Fußnotenmarker im Haupttext.
