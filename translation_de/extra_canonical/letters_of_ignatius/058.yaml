base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: de
  text: 'Von Syrien bis nach Rom kämpfe ich mit wilden Tieren, zu Land und zu Wasser, bei Nacht und bei Tag, gefesselt inmitten von zehn Leoparden – das heißt, einer Abteilung Soldaten –, die nur noch schlimmer werden, wenn man sie freundlich behandelt. Doch durch ihr Unrecht werde ich immer mehr zum Jünger; dadurch bin ich allerdings nicht gerechtfertigt.


    Möge ich Freude an den Tieren haben, die für mich bereitstehen. Ich bete darum, dass ich sie bereitwillig finde; ja, ich werde sie sogar anlocken, damit sie mich rasch verschlingen – anders als einige, die sie aus Furcht nicht anzurühren wagten. Und sollten sie nicht von selbst wollen, obwohl ich bereit bin, werde ich sie dazu zwingen.


    Habt Geduld mit mir. Ich weiß, was mir guttut. Jetzt beginne ich, ein Jünger zu sein. Möge mir nichts Sichtbares und nichts Unsichtbares den Zugang zu Jesus Christus missgönnen. Mögen Feuer und Kreuz über mich kommen, Kämpfe mit wilden Tieren, [Zerschneiden und Zerfleischen],[a] das Auseinanderreißen der Knochen, das Abhacken der Glieder, das Zermalmen meines ganzen Körpers; mögen die grausamen Foltern des Teufels über mich kommen. Wenn ich nur zu Jesus Christus gelange.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerten Worte sind in der zugrunde gelegten Textüberlieferung unsicher beziehungsweise als Ergänzung gekennzeichnet.
