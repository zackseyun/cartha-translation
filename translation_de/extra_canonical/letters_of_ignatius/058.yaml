- from: 'Von Syrien bis nach Rom kämpfe ich mit wilden Tieren, zu Land und zu Wasser, bei Nacht und bei Tag, gefesselt inmitten von zehn Leoparden – das heißt, einer Abteilung Soldaten –, die nur noch schlimmer werden, wenn man sie freundlich behandelt. Doch durch ihr Unrecht werde ich immer mehr zum Jünger; dadurch bin ich allerdings nicht gerechtfertigt.


