lexical_decisions:
- source_word: 'θηριομαχῶ (durch den englischen Zeugen belegt: „I fight with wild beasts“)'
  choice: „kämpfe ich mit wilden Tieren“
  rationale: Bewahrt das konkrete Bild des Kampfes und vermeidet, es vorschnell nur metaphorisch auf die Bewacher zu beziehen.
- source_word: δέκα λεοπάρδοις
  choice: „zehn Leoparden“
  rationale: Die auffällige Tiermetapher wird wörtlich erhalten und unmittelbar durch Ignatius’ eigene Erläuterung als Soldatenabteilung verständlich gemacht.
- source_word: μαθητεύομαι / μαθητής (sinngemäß im Zeugen)
  choice: „werde ich immer mehr zum Jünger“ / „beginne ich, ein Jünger zu sein“
  rationale: Gibt den Prozesscharakter wieder und bewahrt die Spannung, dass Ignatius sein Jüngersein trotz seines bisherigen Weges als erst beginnend beschreibt.
- source_word: δεδικαίωμαι (durch „justified“ belegt)
  choice: „bin ich … nicht gerechtfertigt“
  rationale: Behält die theologisch gewichtige Rechtfertigungssprache bei, ohne sie als bloße moralische Bewährung abzuschwächen.
- source_word: 'ἐπιτυχεῖν Ἰησοῦ Χριστοῦ (sinngemäß im Zeugen: „attain unto Jesus Christ“)'
  choice: „zu Jesus Christus gelangen“
  rationale: Natürliches Deutsch, das das Zielmotiv wahrt, ohne eine genauere metaphysische Deutung festzulegen.
theological_decisions:
- issue: Verhältnis von Leiden, Jüngerschaft und Rechtfertigung
  choice: „durch ihr Unrecht werde ich immer mehr zum Jünger; dadurch bin ich allerdings nicht gerechtfertigt“
  alternative: „durch ihre Misshandlungen lerne ich besser, ein Jünger zu sein; doch das macht mich nicht gerecht“
  rationale: Die gewählte Fassung hält Jüngerschaft als Reifungsprozess und Rechtfertigung als davon unterschiedene Kategorie auseinander, ohne ein konfessionelles Rechtfertigungsmodell einzutragen.
- issue: Ignatius’ Wunsch nach dem Martyrium
  choice: Die drastische Bereitschaft wird direkt wiedergegeben.
  alternative: Abschwächung zu allgemeiner Standhaftigkeit im Leiden
  rationale: Der Text formuliert ausdrücklich den Wunsch, von Tieren verschlungen zu werden. Eine Abschwächung würde seine historische und theologische Spannung beseitigen.
- issue: „Foltern des Teufels“
  choice: „die grausamen Foltern des Teufels“
  alternative: „teuflische Foltern“
  rationale: Der Genitiv bleibt erhalten, da offenbleiben soll, ob der Teufel als Urheber, Veranlasser oder hinter den Leiden wirkende Macht verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, eindringlicher Satzführung. Die drastischen Körperbilder und die paradoxe Sprache über Jüngerschaft, Leiden und Rechtfertigung bleiben erhalten. Da eine direkte Prüfung des griechischen Textes noch aussteht, sind die Entscheidungen ausdrücklich am bereitgestellten englischen Public-Domain-Zeugen und den darin erkennbaren griechischen Schlüsselbegriffen orientiert.
