review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen im Ganzen, verschiebt jedoch mehrere Nuancen: »wache ich frühzeitig« ist im Deutschen weniger idiomatisch als ein vorsorgliches Wachen; »Groll hegen« verengt »have anything against«; und »grundlos« fügt dem überlieferten Wortlaut von »vainly blasphemed« eine nicht gesicherte Begründungsnuance hinzu. »Bei einigen« sollte zudem als »unter manchen« bzw. »bei manchen« wiedergegeben werden, nicht im Sinn eines bloßen Adressatenkreises.'
  naturalness: Die Anrede und die Bildsprache sind überwiegend gut. »meine Geliebten« wirkt im modernen Deutschen jedoch leicht romantisch; »meine Lieben« ist hier die natürliche gemeinschaftliche Anrede. »die gottgefällige Menge« bleibt bewusst etwas markiert, bildet aber den kollektiven und religiös qualifizierten Ausdruck genauer ab als »gottesfürchtige Gemeinschaft«.
  terminology: »Nichtjuden«, »Sanftmut«, »Fleisch des Herrn«, »Liebe« und »Blut Jesu Christi« sind angemessen. Die auffälligen Gleichsetzungen von Glaube/Fleisch und Liebe/Blut bleiben ohne dogmatische Auslegung erhalten. Für die qualifizierte »Menge« ist eine knappe Anmerkung sinnvoll, weil die deutsche Formulierung ungewohnt ist und keine Gleichsetzung mit einer institutionell abgegrenzten Gemeinde nahelegen soll.
  issues:
  - severity: medium
    issue: »Keiner von euch hege Groll« ist enger als der Ausgangstext.
    rationale: Das englische »bear a grudge« kann zwar Groll meinen, doch die zugrunde liegende breite Wendung lässt jede gegnerische Haltung bzw. Beschwerde gegen den Nächsten offen. »Habe etwas gegen seinen Nächsten« bewahrt diese Weite.
  - severity: medium
    issue: »grundlos verlästert« ist als Wiedergabe von »vainly blasphemed« zu interpretierend.
    rationale: »Grundlos« legt speziell fehlende Rechtfertigung bzw. Ursache fest. Der vorliegende Zeuge bietet keine ausreichende Grundlage, diese Nuance gegenüber dem schlichteren »gelästert wird« festzuschreiben.
  - severity: low
    issue: »meine Geliebten« ist registerbedingt missverständlich.
    rationale: Die Form kann im modernen Deutsch romantisch klingen. »Meine Lieben« ist als gemeindliche Anrede natürlich und ohne Bedeutungsverlust.
  - severity: low
    issue: »gottesfürchtige Gemeinschaft« glättet sowohl die Größenbezeichnung als auch die besondere Gottesqualifikation.
    rationale: Der Kontrast zu »einigen wenigen törichten Menschen« betrifft eine Menge; »Gemeinschaft« kann institutionell und enger wirken. Die überarbeitete Fassung erhält den kollektiven Ausdruck und erläutert die ungewohnte Formulierung.
  revised_text: 'Nicht, weil ich unter euch etwas Derartiges erfahren hätte; vielmehr wache ich vorsorglich über euch, meine Lieben, denn ich sehe die Nachstellungen des Teufels voraus. Rüstet euch daher mit Sanftmut aus und findet wieder zu euch selbst – im Glauben, der das Fleisch des Herrn ist, und in der Liebe, die das Blut Jesu Christi ist.


    Keiner von euch habe etwas gegen seinen Nächsten. Gebt den Nichtjuden keinen Anlass, damit nicht wegen einiger weniger törichter Menschen die gottgefällige Menge[a] gelästert wird. Denn: »Wehe dem, durch den mein Name unter manchen gelästert wird.«[b]'
  revised_footnotes:
  - marker: a
    text: Die Formulierung gibt den religiös qualifizierten kollektiven Ausdruck des Zeugen wieder. Sie bezeichnet nicht notwendig eine institutionell abgegrenzte Gemeinde.
    reason: Bewahrt die markierte, aber quellentreue Formulierung und vermeidet eine zu enge institutionelle Deutung.
  - marker: b
    text: Der vorliegende Zeuge kennzeichnet den Satz als Zitat, nennt jedoch keine bestimmte Schriftstelle. Daher wird hier keine Quelle oder Harmonisierung festgelegt.
    reason: Erhält den Zitatstatus, ohne eine nicht gesicherte Schriftidentifikation vorzunehmen.
  revision_rationale: Die Revision verbessert idiomatisches modernes Deutsch und korrigiert Einengungen bzw. Zusätze, ohne die bildhafte und theologisch offene Sprache zu erklären. Insbesondere bleiben die parallelen Gleichsetzungen unverändert; der Schluss wird von der zusätzlichen Nuance »grundlos« befreit und räumlich-sozial mit »unter manchen« wiedergegeben.
