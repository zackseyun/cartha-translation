base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: de
  text: 'Nicht etwa, dass ich von etwas Derartigem unter euch erfahren hätte; vielmehr wache ich frühzeitig über euch als über meine Geliebten, denn ich sehe die Fallen des Teufels voraus. Wappnet euch daher mit Sanftmut und richtet euch wieder auf im Glauben, der das Fleisch des Herrn ist, und in der Liebe, die das Blut Jesu Christi ist.


    Keiner von euch hege Groll gegen seinen Nächsten. Gebt den Nichtjuden keinen Anlass, damit nicht wegen einiger weniger Unverständiger die gottesfürchtige Gemeinschaft[a] verlästert wird. Denn: »Wehe dem, durch den mein Name bei einigen grundlos verlästert wird.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher nach dem englischen Zeugen: »die gottesfürchtige Menge«; die genaue griechische Formulierung ist noch zu prüfen.'
    reason: Kennzeichnet eine idiomatische Glättung und den vorläufigen Status der Quellenprüfung.
  - marker: b
    text: Die Formulierung wird hier nach dem überlieferten englischen Zeugen wiedergegeben. Wortlaut, Anspielung und mögliche Schriftquelle bedürfen noch der Prüfung am griechischen Text.
    reason: Verhindert eine ungesicherte Identifikation oder Harmonisierung des Zitats.
lexical_decisions:
- source_word: keep watch over you betimes
  choice: wache ich frühzeitig über euch
  rationale: Gibt den zeitlichen bzw. vorbeugenden Sinn des englischen Zeugnisses wieder, ohne eine genauere griechische Nuance vorzutäuschen, solange die Prüfung des griechischen Textes aussteht.
- source_word: arm yourselves with gentleness
  choice: Wappnet euch daher mit Sanftmut
  rationale: Bewahrt das paradoxe Bild militärischer Ausrüstung zusammen mit der christlichen Tugend der Sanftmut.
- source_word: recover yourselves
  choice: richtet euch wieder auf
  rationale: Natürliches modernes Deutsch, das Erholung, Wiederherstellung oder innere Festigung offenhält.
- source_word: faith which is the flesh of the Lord
  choice: Glauben, der das Fleisch des Herrn ist
  rationale: Erhält die auffällige sakramentale bzw. metaphorische Gleichsetzung, ohne sie erklärend abzuschwächen.
- source_word: love which is the blood of Jesus Christ
  choice: Liebe, die das Blut Jesu Christi ist
  rationale: Bewahrt die parallele Form und die theologische Spannung des Zeugnisses.
- source_word: Gentiles
  choice: Nichtjuden
  rationale: Im frühchristlichen Kontext verständlicher und sachlich genauer als das heute missverständliche »Heiden«.
- source_word: godly multitude
  choice: gottesfürchtige Gemeinschaft
  rationale: Gibt den kollektiven Bezug idiomatisch wieder; die genaue Lesart bleibt mangels abgeschlossener griechischer Prüfung in einer Fußnote kenntlich.
- source_word: vainly blasphemed
  choice: grundlos verlästert
  rationale: Bewahrt sowohl den Gedanken des ungerechtfertigten Anlassgebens als auch den starken Sinn von Lästerung.
theological_decisions:
- issue: Verhältnis von Glaube zum Fleisch des Herrn und Liebe zum Blut Jesu Christi
  choice: Die Gleichsetzungen werden wörtlich und ohne dogmatische Erläuterung beibehalten.
  alternative: Paraphrase als bloßer Hinweis auf Eucharistie, Inkarnation oder ethische Teilhabe.
  rationale: Der Text lässt metaphorische, gemeinschaftliche und sakramentale Resonanzen zu; eine Festlegung würde die echte theologische Spannung reduzieren.
- issue: Reichweite von »die gottesfürchtige Gemeinschaft«
  choice: Kollektiver, positiver Bezug auf die größere Gemeinschaft der Gottesfürchtigen.
  alternative: »die Menge der Frommen« oder »die große Zahl der Gottesfürchtigen«.
  rationale: Die gewählte Form ist im Deutschen natürlicher, ohne den Kontrast zwischen wenigen Unverständigen und der Gesamtheit aufzugeben.
- issue: Zitat über die Lästerung des Namens
  choice: Als Zitat markiert und in der überlieferten Ich-Form »mein Name« belassen.
  alternative: Als direkte, eindeutig identifizierte Schriftquotation mit namentlicher göttlicher Sprecherzuweisung.
  rationale: Das vorgelegte Zeugnis kennzeichnet den Satz als Zitat, bietet aber keine sichere Quellenangabe; daher wird keine zusätzliche Identifikation eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Archaische Formen wurden vermieden, die markanten Bilder und Parallelismen jedoch bewahrt. Da nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die Prüfung der mittelrezensionellen griechischen Überlieferung ausdrücklich noch aussteht, ist der Entwurf quellenkritisch als vorläufig zu behandeln.
