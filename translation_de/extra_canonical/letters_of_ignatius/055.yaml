    text: 'Wörtlich und bildhaft: „Es ist gut, von der Welt weg unterzugehen und zu Gott hin, damit ich zu ihm aufgehe.“ Die Formulierung spielt wahrscheinlich mit Westen und Osten sowie mit dem Untergang und Aufgang eines Gestirns.'
