base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: de
  text: 'Denn ich möchte nicht, dass ihr Menschen zu gefallen sucht, sondern Gott, wie ihr ihm ja tatsächlich gefallt. Denn ich selbst werde nie wieder eine solche Gelegenheit finden, zu Gott zu gelangen; und auch ihr könnt, wenn ihr schweigt, für kein edleres Werk Anerkennung erlangen. Denn wenn ihr schweigt und mich gewähren lasst, bin ich ein Wort Gottes; wenn ihr aber mein Fleisch begehrt, werde ich wieder nur ein bloßer Ruf sein.


    Nein, gewährt mir nichts weiter, als dass ich Gott als Trankopfer ausgegossen werde, solange noch ein Altar bereitsteht. So könnt ihr euch in Liebe zu einem Chor vereinen und dem Vater in Jesus Christus ein Lied singen, weil Gott gnädig gewährt hat, dass der Bischof aus Syrien im Westen gefunden wurde, nachdem er ihn aus dem Osten herbeigerufen hatte. Es ist gut, aus der Welt unterzugehen hin zu Gott, damit ich zu ihm aufgehe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bildhaft: „Es ist gut, aus der Welt unterzugehen hin zu Gott, damit ich zu ihm aufgehe.“ Die Formulierung spielt wahrscheinlich mit Westen und Osten sowie mit dem Untergang und Aufgang eines Gestirns.'
    reason: Das Wortspiel ist in natürlichem Deutsch nicht vollständig zugleich zu bewahren und unmittelbar verständlich; die Fußnote macht die bewusst ungewöhnliche Übersetzung transparent.
lexical_decisions:
- source_word: ἀνθρωπάρεσκοι / θεῷ ἀρέσκειν (as reflected in the witness)
  choice: Menschen zu gefallen sucht / Gott [zu gefallen]
  rationale: Gibt den Gegensatz idiomatisch und zugleich eng am überlieferten Sinn wieder; „Menschengefällige“ wäre im modernen Deutsch unnötig substantivisch und steif.
- source_word: ἐπιτυχεῖν θεοῦ (as reflected in the witness)
  choice: zu Gott zu gelangen
  rationale: Bewahrt Ignatius’ Ziel- und Begegnungssprache, ohne sie als bloßes Verdienen oder Erlangen des Heils auszulegen.
- source_word: λόγος θεοῦ / φωνή (as reflected in the witness)
  choice: ein Wort Gottes / ein bloßer Ruf
  rationale: Erhält den pointierten Gegensatz zwischen einem bedeutungstragenden „Wort“ und einer vergänglichen „Stimme/Ruf“. „Ruf“ passt natürlicher zum Kontext, ohne die Metapher zu erklären.
- source_word: σπονδισθῆναι (as reflected in the witness)
  choice: als Trankopfer ausgegossen werde
  rationale: Bewahrt die kultische Opfermetapher ausdrücklich und ist im biblisch geprägten Deutsch verständlich.
- source_word: χορός (as reflected in the witness)
  choice: Chor
  rationale: Die gemeinschaftliche Gesangsmetapher bleibt direkt erhalten.
- source_word: δύσις / ἀνατολή wordplay (as reflected in the witness)
  choice: unterzugehen / aufgehe
  rationale: Bewahrt das wahrscheinlich beabsichtigte Wortspiel mit Westen, Osten, Sonnenuntergang und Aufgang, auch wenn die deutsche Formulierung bewusst ungewöhnlich bleibt.
theological_decisions:
- issue: Martyrium als Weg, „zu Gott zu gelangen“
  choice: Die Zielaussage bleibt ungemildert stehen.
  alternative: „zu Gott heimzukehren“ oder „bei Gott anzukommen“
  rationale: Die zugespitzte frühchristliche Martyriumsfrömmigkeit soll weder konfessionell systematisiert noch durch eine harmonisierende Erklärung abgeschwächt werden.
- issue: Selbstbezeichnung als „Wort Gottes“
  choice: „bin ich ein Wort Gottes“
  alternative: „werde ich Gottes Botschaft sein“
  rationale: Die auffällige und theologisch spannungsreiche Aussage wird nicht paraphrasierend aufgelöst. Der unbestimmte Artikel verhindert zugleich eine Gleichsetzung mit dem einzigartigen Logos.
- issue: Opfer- und Altarsprache
  choice: Trankopfer und Altar werden wörtlich bewahrt.
  alternative: Allgemeinere Wiedergabe als „mein Leben Gott hingeben“
  rationale: Ignatius’ kultische Bildsprache ist zentral für den Abschnitt; eine Entmetaphorisierung würde seine Aussage verflachen.
- issue: Gottes Handeln bei der Überführung des Bischofs
  choice: „gnädig gewährt“ und „herbeigerufen“
  alternative: „es zugelassen“ und „gebracht“
  rationale: Die starke Deutung des Geschehens als göttliche Fügung bleibt erhalten, ohne daraus eine weitergehende Lehre über Verfolgung oder Martyrium abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Anrede im Plural. Die dichte Märtyrer-, Opfer- und Himmelsrichtungsmetaphorik wurde bewahrt. Da eine direkte Prüfung des mittelrezensionellen griechischen Textes laut Datensatz noch aussteht, folgt der Entwurf vorsichtig dem öffentlichen englischen Zeugen und kennzeichnet insbesondere das Schlusswortspiel transparent.
