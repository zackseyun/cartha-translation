review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bewahrt die wesentlichen Kontraste und Bilder des Zeugen: Menschen- bzw. Gottesgefälligkeit, Schweigen, „Wort Gottes“ gegenüber „Ruf“, Trankopfer, Chor, Altar sowie die Richtungs- und Sonnenmetaphorik. „nie wieder“ fügt jedoch eine zeitliche Wiederholung hinzu, die der Vorlage nicht ausdrücklich sagt. Die Umformung mit „So könnt ihr“ schwächt zudem den zweckbezogenen Anschluss der Chormetapher ab.'
  naturalness: Weitgehend modernes, würdiges Deutsch. „mich gewähren lasst“ ist hier weniger präzise und idiomatisch als „mich in Ruhe lasst“. Der Schlusssatz muss wegen des absichtlichen Wortspiels leicht markiert bleiben, kann aber syntaktisch klarer gefasst werden.
  terminology: „Trankopfer“, „Altar“, „Bischof“, „Chor“, „Wort Gottes“ und „Ruf“ sind treffend. Die unbestimmte Formulierung „ein Wort Gottes“ erhält die Aussage, ohne sie dogmatisch zu harmonisieren.
  issues:
  - severity: medium
    issue: „nie wieder“
    rationale: Die Vorlage sagt, dass Ignatius selbst niemals eine Gelegenheit wie diese finden werde; „wieder“ setzt zusätzlich voraus, dass es bereits eine solche Gelegenheit gab.
  - severity: medium
    issue: „So könnt ihr euch ... vereinen“
    rationale: Der englische Zeuge formuliert den Chorgesang als Ziel bzw. Folge des erbetenen Schweigens. Die modale Hauptsatzform „So könnt ihr“ verschiebt diese Verknüpfung.
  - severity: low
    issue: „mich gewähren lasst“
    rationale: Für „leave me alone“ ist „mich in Ruhe lasst“ im heutigen Standarddeutsch direkter und näher am Sinn.
  - severity: low
    issue: Schlussformulierung „aus der Welt unterzugehen hin zu Gott“
    rationale: Die ungewöhnliche Bildsprache soll bleiben, aber „von der Welt weg unterzugehen und zu Gott hin“ bildet die beiden Richtungen klarer ab.
  revised_text: 'Denn ich möchte nicht, dass ihr Menschen zu gefallen sucht, sondern Gott, wie ihr ihm ja tatsächlich gefallt. Denn ich selbst werde niemals eine solche Gelegenheit finden, zu Gott zu gelangen; und auch ihr könnt, wenn ihr schweigt, für kein edleres Werk Anerkennung erlangen. Denn wenn ihr schweigt und mich in Ruhe lasst, bin ich ein Wort Gottes; wenn ihr aber mein Fleisch begehrt, werde ich wieder nur ein bloßer Ruf sein.


    Nein, gewährt mir nichts weiter, als dass ich Gott als Trankopfer ausgegossen werde, solange noch ein Altar bereitsteht, damit ihr euch in Liebe zu einem Chor zusammenschließt und dem Vater in Jesus Christus singt, weil Gott gnädig gewährt hat, dass der Bischof aus Syrien im Westen gefunden wurde, nachdem er ihn aus dem Osten herbeigerufen hatte. Es ist gut, von der Welt weg unterzugehen und zu Gott hin, damit ich zu ihm aufgehe.[a]'
  revised_footnotes:
