base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: de
  text: 'Meidet daher diese üblen Schösslinge, die eine todbringende Frucht hervorbringen. Wer davon kostet, stirbt sogleich. Denn diese Menschen sind keine Pflanzung des Vaters.


    Wären sie es, so würden sie sich als Zweige des Kreuzes erweisen, und ihre Frucht wäre unvergänglich. Durch dieses Kreuz ruft er euch in seinem Leiden zu sich, da ihr seine Glieder seid. Ein Haupt kann nicht ohne Glieder sein, da Gott Einheit verheißt – und diese Einheit ist er selbst.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vile offshoots
  choice: üble Schösslinge
  rationale: Bewahrt das Bild eines schädlichen Pflanzenwuchses und klingt im modernen Deutschen verständlich und würdig.
- source_word: gender a deadly fruit
  choice: eine todbringende Frucht hervorbringen
  rationale: Gibt das Ursache-Wirkungs-Bild formal nah und natürlich wieder.
- source_word: the Father’s planting
  choice: Pflanzung des Vaters
  rationale: Erhält das biblisch geprägte Pflanzenbild, ohne es erklärend aufzulösen.
- source_word: branches of the Cross
  choice: Zweige des Kreuzes
  rationale: Bewahrt die auffällige und theologisch dichte Metapher des Zeugen.
- source_word: passion
  choice: Leiden
  rationale: Im Deutschen ist „Leiden“ hier klarer als „Passion“ und umfasst den Leidensweg Christi.
- source_word: members
  choice: Glieder
  rationale: Erhält das traditionelle organische Bild von Haupt und Leib.
- source_word: union
  choice: Einheit
  rationale: „Einheit“ ist im Kontext von Haupt und Gliedern idiomatisch; die mögliche Nuance von Vereinigung bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bezug und syntaktische Verknüpfung von Kreuz, Leiden und Einladung
  choice: „Durch das Kreuz lädt er uns durch sein Leiden ein“
  alternative: „Das Kreuz, durch das er uns in seinem Leiden einlädt“
  rationale: Der englische Zeuge ist syntaktisch gedrängt und der griechische Wortlaut wurde noch nicht direkt geprüft. Die Fassung hält Kreuz, Leiden und Einladung eng zusammen, ohne das Ziel der Einladung hinzuzufügen.
- issue: Aussage „diese Einheit ist er selbst“
  choice: Wörtlich beibehalten
  alternative: Erklärende Deutung als Einheit mit Gott oder Einheit der Gemeinde
  rationale: Die theologische Spannung und ungewöhnliche Identifikation sollen nicht konfessionell oder interpretierend aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die Pflanzen- und Leibmetaphorik wurde bewusst erhalten. Der Entwurf ist vorläufig, da als unmittelbare Grundlage nur der gemeinfreie englische Zeuge vorliegt und die direkte Prüfung der mittelgriechischen Überlieferung noch aussteht.
