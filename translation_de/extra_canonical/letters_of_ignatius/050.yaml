revisions:
- from: 'Meidet daher diese üblen Schösslinge, die eine todbringende Frucht hervorbringen. Wer davon kostet, stirbt sogleich. Denn diese Menschen sind keine Pflanzung des Vaters.


    Wären sie es, so wären sie als Zweige des Kreuzes zu erkennen, und ihre Frucht wäre unvergänglich. Durch das Kreuz lädt er uns durch sein Leiden ein, denn wir sind seine Glieder.[a] Ein Haupt kann nun nicht ohne Glieder sein, da Gott Einheit verheißt – und diese Einheit ist er selbst.[b]'
  to: 'Meidet daher diese üblen Schösslinge, die eine todbringende Frucht hervorbringen. Wer davon kostet, stirbt sogleich. Denn diese Menschen sind keine Pflanzung des Vaters.


    Wären sie es, so würden sie sich als Zweige des Kreuzes erweisen, und ihre Frucht wäre unvergänglich. Durch dieses Kreuz ruft er euch in seinem Leiden zu sich, da ihr seine Glieder seid. Ein Haupt kann nicht ohne Glieder sein, da Gott Einheit verheißt – und diese Einheit ist er selbst.'
  rationale: 'Die Revision stellt die im griechischen Satz enthaltene Beziehung wieder her: Das Kreuz ist das Mittel, durch das Christus die Adressaten in seinem Leiden zu sich ruft. Der Adressatenbezug wird mit „euch“ beibehalten, und „da ihr seine Glieder seid“ gibt die partizipiale Aussage ohne zusätzliche theologische Deutung wieder. Nicht mehr nötige Vorläufigkeitsfußnoten werden entfernt.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:52:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gedankengang und die Metaphern weitgehend treffend wieder. Eine sichere Präzisierung ist jedoch nötig: Im griechischen Satz bezieht sich „durch das“ auf das Kreuz; Christus ruft die Adressaten „in/bei seinem Leiden zu sich“. Die vorliegende Fassung lässt das Ziel des Rufes aus und glättet die syntaktische Verbindung zu stark.'
  naturalness: Das Deutsch ist überwiegend natürlich und dem frühchristlichen Register angemessen. „so wären sie als Zweige des Kreuzes zu erkennen“ ist verständlich, aber „würden sie sich als Zweige des Kreuzes erweisen“ bildet die kontrafaktische Aussage idiomatischer ab. „Pflanzung des Vaters“ darf als bewusst dichtes Bild stehen bleiben.
  terminology: „Schösslinge“, „todbringende Frucht“, „Pflanzung des Vaters“, „Zweige“, „Kreuz“, „Leiden“, „Glieder“ und „Einheit“ sind angemessen. „Einheit“ gibt ἕνωσις sachgerecht wieder; die ungewöhnliche Aussage, dass Gott selbst diese Einheit ist, wird nicht deutnd aufgelöst.
  issues:
  - severity: medium
    issue: Der Ruf durch das Kreuz ist unvollständig wiedergegeben.
    rationale: Die griechische Konstruktion δι’ οὗ … προσκαλεῖται ὑμᾶς enthält die Richtung „ruft euch zu sich“. „lädt er uns … ein“ unterschlägt „zu sich“ und wechselt zudem gegenüber dem griechischen Adressatenbezug zu „uns“.
  - severity: low
    issue: Die Fußnote a beschreibt eine vermeidbare Mehrdeutigkeit als fortbestehend.
    rationale: 'Die syntaktische Zuordnung lässt sich am griechischen Text ausreichend bestimmen: Das Relativpronomen bezieht sich auf das Kreuz; die Adressaten sind seine Glieder. Eine Unsicherheitsfußnote ist daher nicht erforderlich.'
  - severity: low
    issue: Die Fußnote b ist für den fortlaufenden Text nicht erforderlich.
    rationale: „Einheit“ ist eine angemessene offene Wiedergabe von ἕνωσις. Die Aussage wird im Text weder konfessionell eingeengt noch lexikalisch unzulässig festgelegt.
