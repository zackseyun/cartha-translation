base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: de
  text: 'Meine Brüder und Schwestern, mein Herz strömt über vor Liebe zu euch. In übergroßer Freude wache ich über eure Sicherheit – doch nicht ich, sondern Jesus Christus. Da ich seine Fesseln trage, bin ich umso mehr in Sorge, weil ich noch nicht vollendet bin. Aber euer Gebet wird mich [für Gott][a] vollenden, damit ich das Erbe erlange, in dem ich Erbarmen gefunden habe. Dabei nehme ich meine Zuflucht zum Evangelium wie zum Fleisch Jesu und zu den Aposteln wie zum Ältestenrat der Kirche.


    Ja, auch die Propheten lieben wir, weil auch sie in ihrer Verkündigung auf das Evangelium hinwiesen, ihre Hoffnung auf ihn setzten und ihn erwarteten. Weil sie an ihn glaubten, wurden auch sie in der Einheit Jesu Christi gerettet. Als heilige Männer sind sie aller Liebe und Bewunderung würdig, von Jesus Christus als bewährt anerkannt und dem Evangelium unserer gemeinsamen Hoffnung zugerechnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „für Gott“ stehen im zugrunde liegenden englischen Textzeugen in eckigen Klammern und kennzeichnen dort eine ergänzte beziehungsweise textlich unsichere Lesart. Eine unmittelbare Prüfung an der griechischen Überlieferung steht noch aus.
    reason: Die im Zeugen sichtbare Unsicherheit darf nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: brethren
  choice: Brüder und Schwestern
  rationale: Die natürliche inklusive Anrede gibt den gemeinschaftlichen Sinn des antiken Ausdrucks im heutigen Deutsch wieder.
- source_word: safety
  choice: Sicherheit
  rationale: Bewahrt die Bedeutung des vorliegenden englischen Zeugen, ohne sie enger als Heil oder Rettung theologisch festzulegen.
- source_word: perfected / make me perfect
  choice: vollendet / vollenden
  rationale: Erhält den Zusammenhang und den geistlichen Reifungs- beziehungsweise Zielgedanken, ohne bloße moralische Fehlerlosigkeit zu behaupten.
- source_word: Gospel as the flesh of Jesus
  choice: Evangelium wie zum Fleisch Jesu
  rationale: Die auffällige und theologisch spannungsreiche Metapher wird bewusst formal bewahrt.
- source_word: presbytery of the Church
  choice: Ältestenrat der Kirche
  rationale: Gibt das kollegiale Gremium wieder, ohne eine spätere konfessionelle Amtsstruktur vorauszusetzen.
- source_word: numbered together in the Gospel
  choice: dem Evangelium ... zugerechnet
  rationale: Bewahrt die Vorstellung der Einordnung beziehungsweise Zugehörigkeit, soweit sie aus dem englischen Zeugen erkennbar ist.
theological_decisions:
- issue: Handelndes Subjekt bei der Sorge um die Gemeinde
  choice: „doch nicht ich, sondern Jesus Christus“
  alternative: Die Aussage abschwächen oder als bloße Hilfe Christi wiedergeben
  rationale: Die zugespitzte Selbstkorrektur des Zeugen bleibt erhalten.
- issue: Errettung der Propheten und Christusbezug
  choice: „Weil sie an ihn glaubten, wurden auch sie in der Einheit Jesu Christi gerettet“
  alternative: Den Glauben nur allgemein auf Gott oder das Evangelium beziehen
  rationale: Der unmittelbare Bezug des Zeugen auf Christus wird bewahrt, ohne die zeitliche oder heilsgeschichtliche Spannung zu erklären.
- issue: Textlich unsicheres „unto God“
  choice: „[für Gott]“ mit Fußnote
  alternative: Auslassen oder unmarkiert in den Text aufnehmen
  rationale: Die Ergänzungsmarkierung des überlieferten englischen Zeugen wird sichtbar erhalten; eine direkte Prüfung am griechischen Text steht noch aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Aufgrund der noch ausstehenden Prüfung des mittelgriechischen Rezensionstextes ist dies ein vorläufiger, am öffentlichen englischen Zeugen kontrollierter Entwurf. Ungewöhnliche Metaphern und christologische Spannungen wurden nicht geglättet.
