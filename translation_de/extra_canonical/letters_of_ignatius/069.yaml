review_pass:
  verdict: revise
  source_fidelity: Die wesentlichen Aussagen des vorliegenden englischen Zeugen werden wiedergegeben, einschließlich der auffälligen Gleichsetzungen von Evangelium und Fleisch Jesu sowie Aposteln und Presbyterium. „I am the more afraid“ bezeichnet jedoch Furcht, nicht lediglich Sorge. Die Zufluchtsmetapher sollte im Deutschen syntaktisch näher an die beiden durch „als“ erläuterten Bezugsgrößen gebunden werden. Die eckig markierte, noch nicht direkt am Griechischen geprüfte Ergänzung bleibt sichtbar erhalten.
  naturalness: Der Entwurf ist überwiegend verständlich und würdig. „in Sorge“ schwächt den Sinn von „afraid“ ab; „zum Evangelium wie zum Fleisch Jesu“ ist außerdem idiomatisch und semantisch weniger klar als eine Fassung mit „als dem Fleisch Jesu“.
  terminology: „Ältestenrat der Kirche“ ist als nicht-konfessionell festgelegte Wiedergabe von „presbytery of the Church“ vertretbar. „Vollenden“, „Erbe“, „Erbarmen“, „Einheit Jesu Christi“ und die Christusbezüge bleiben erhalten. Die inklusive Anrede „Brüder und Schwestern“ ist eine zulässige moderne kommunikative Wiedergabe, auch wenn der Zeuge wörtlich nur „Brüder“ hat.
  issues:
  - severity: medium
    issue: „bin ich umso mehr in Sorge“ gibt „I am the more afraid“ zu schwach wieder.
    rationale: Der englische Zeuge spricht ausdrücklich von Furcht. „Fürchte ich mich umso mehr“ erhält Intensität und Aussagegehalt ohne zusätzliche Deutung.
  - severity: medium
    issue: Die Formulierung „nehme ich meine Zuflucht zum Evangelium wie zum Fleisch Jesu und zu den Aposteln wie zum Ältestenrat“ verwischt die prädikative Metapher des Zeugen.
    rationale: Der Zeuge bezeichnet das Evangelium als Fleisch Jesu und die Apostel als Presbyterium der Kirche. „zum Evangelium als dem Fleisch Jesu“ und „zu den Aposteln als dem Ältestenrat der Kirche“ bildet diese Struktur im Deutschen klarer ab.
  - severity: low
    issue: Die Selbstkorrektur nach „wache ich über eure Sicherheit“ bleibt elliptisch.
    rationale: „doch nicht ich tue dies, sondern Jesus Christus“ macht im Deutschen explizit, worauf sich die Korrektur bezieht, ohne den Sinn zu verändern.
  revised_text: 'Meine Brüder und Schwestern, mein Herz strömt ganz über vor Liebe zu euch. In übergroßer Freude wache ich über eure Sicherheit – doch nicht ich tue dies, sondern Jesus Christus. Da ich seine Fesseln trage, fürchte ich mich umso mehr, weil ich noch nicht vollendet bin. Aber euer Gebet wird mich [für Gott][a] vollenden, damit ich das Erbe erlange, in dem ich Erbarmen gefunden habe. Dabei nehme ich meine Zuflucht zum Evangelium als dem Fleisch Jesu und zu den Aposteln als dem Ältestenrat der Kirche.


    Ja, auch die Propheten lieben wir, weil auch sie in ihrer Verkündigung auf das Evangelium hinwiesen, ihre Hoffnung auf ihn setzten und ihn erwarteten. Weil sie an ihn glaubten, wurden auch sie in der Einheit Jesu Christi gerettet. Als heilige Männer sind sie aller Liebe und Bewunderung würdig, von Jesus Christus als bewährt anerkannt und dem Evangelium unserer gemeinsamen Hoffnung zugerechnet.'
  revised_footnotes:
  - marker: a
    text: Die Worte „für Gott“ stehen im zugrunde liegenden englischen Textzeugen in eckigen Klammern und kennzeichnen dort eine ergänzte beziehungsweise textlich unsichere Lesart. Eine unmittelbare Prüfung an der griechischen Überlieferung steht noch aus.
    reason: Die im Zeugen sichtbare Unsicherheit wird nicht stillschweigend beseitigt.
  revision_rationale: Die Revision korrigiert die Abschwächung von „afraid“ und klärt die im Deutschen missverständliche Zufluchtsmetapher. Sie bewahrt die textkritische Kennzeichnung von „[für Gott]“, die christologischen Bezüge und die nicht an spätere Amtslehren gebundene Wiedergabe von „presbytery“.
