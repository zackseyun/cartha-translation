base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: de
  text: 'Dies sind die letzten Zeiten. Lasst uns daher Scham empfinden; lasst uns Gottes Langmut fürchten, damit sie uns nicht zum Gericht werde. Denn entweder sollen wir den kommenden Zorn fürchten oder die gegenwärtige Gnade lieben – eines von beidem –, wenn wir nur in Christus Jesus zum wahren Leben erfunden werden.


    Nichts soll euch ohne Jesus Christus erscheinen, in dem ich meine Fesseln umhertrage, meine geistlichen Perlen. In ihnen hoffe ich, durch euer Gebet aufzuerstehen; möge es mir vergönnt sein, stets daran Anteil zu haben, damit ich am Anteil der Christen von Ephesus erfunden werde, die auch stets mit den Aposteln in der Kraft Jesu Christi übereinstimmten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: last times
  choice: die letzten Zeiten
  rationale: Bewahrt die eschatologische Aussage des Zeugnisses, ohne sie durch eine engere Deutung wie „Endzeit“ zu präzisieren.
- source_word: long-suffering of God
  choice: Gottes Langmut
  rationale: „Langmut“ ist eine würdevolle und noch allgemein verständliche Wiedergabe für Gottes geduldiges Zurückhalten des Gerichts.
- source_word: judgment
  choice: Gericht
  rationale: Gibt den theologischen und forensischen Sinn knapper und natürlicher wieder als „Urteil“.
- source_word: provided only that we be found in Christ Jesus
  choice: wenn wir nur in Christus Jesus … erfunden werden
  rationale: Das passivische „erfunden werden“ bewahrt die prüfungs- und gerichtsbezogene Bildsprache, statt sie zu „uns befinden“ abzuschwächen.
- source_word: glitter in your eyes
  choice: als herrlich vor Augen stehen
  rationale: Vermittelt die Vorstellung anziehenden Glanzes in natürlichem Deutsch und erhält zugleich den wertenden Sinn.
- source_word: spiritual pearls
  choice: geistliche Perlen
  rationale: Die auffällige Metapher für die Fesseln wird unverändert bewahrt.
- source_word: rise again
  choice: auferstehen
  rationale: Erhält den möglichen Auferstehungsbezug, statt ihn allgemein mit „wieder aufstehen“ wiederzugeben.
- source_word: of one mind with the Apostles
  choice: eines Sinnes mit den Aposteln
  rationale: Bewahrt die Aussage von Übereinstimmung und Verbundenheit, ohne eine institutionelle oder konfessionelle Zusatzbedeutung einzutragen.
theological_decisions:
- issue: Verhältnis von kommendem Zorn und gegenwärtiger Gnade
  choice: Die zugespitzte Alternative „entweder … oder … – eines von beidem“ bleibt stehen.
  alternative: 'Beides zu einer harmonisierten Doppelaufforderung verbinden: „Wir sollen den Zorn fürchten und die Gnade lieben.“'
  rationale: Das Zeugnis formuliert eine echte rhetorische Spannung, die nicht stillschweigend aufgelöst werden soll.
- issue: „In Christus Jesus … erfunden werden“ und wahres Leben
  choice: Die gerichtliche Passivform und die Zielangabe „zum wahren Leben“ werden beibehalten.
  alternative: „Damit wir in Christus Jesus das wahre Leben finden.“
  rationale: Die Alternative würde das handelnde Subjekt und damit die theologische Blickrichtung verändern.
- issue: Auferstehung durch das Gebet der Gemeinde
  choice: „durch euer Gebet auferstehen“
  alternative: „durch euer Gebet wieder aufgerichtet werden“
  rationale: Die stärkere eschatologische Lesart des englischen Zeugnisses bleibt sichtbar; ihre genaue griechische Grundlage muss noch geprüft werden.
- issue: Christen von Ephesus und Apostel
  choice: „eines Sinnes mit den Aposteln“
  alternative: „der Lehre der Apostel gehorsam“
  rationale: Die Übersetzung vermeidet es, eine bloße Gesinnungs- oder Übereinstimmungsaussage in eine spezifische Lehrautoritätsformel umzudeuten.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit bewusst erhaltener frühchristlicher Bildsprache. Der Entwurf ist vorläufig: Da kein griechischer Wortlaut bereitgestellt wurde und die direkte Prüfung der mittelrezensionellen griechischen Überlieferung ausdrücklich noch aussteht, beruht diese Fassung auf dem angegebenen gemeinfreien englischen Zeugen von J. B. Lightfoot unter konsultativer Berücksichtigung der englischen POB-Fassung. Insbesondere die Bezüge in „in ihm … in ihnen“, die Wendung „als herrlich vor Augen stehen“ und der Auferstehungsbezug sollten am griechischen Text überprüft werden.'
