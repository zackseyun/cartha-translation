review_pass:
  verdict: revise
  source_fidelity: Die Vorlage folgt dem beigebrachten englischen Zeugen im Wesentlichen zuverlässig. Eine direkte Kontrolle am griechischen Text ist nach den Metadaten weiterhin ausstehend. Die Bildsprache („Augen der Liebe“), die Namensliste und die bewusste Wiederholung von „verherrlichen“ bleiben erhalten. „Erleichterung verschafft“ ist jedoch gegenüber „relieved/refresh“ unnötig abstrakt; „Erquickung“ bzw. „erquicklich gestärkt“ bildet die Wortverbindung besser ab.
  naturalness: Der Text ist insgesamt würdevoll und verständlich. „bei mir bleiben darf“ klingt allerdings, als hinge das Bleiben von einer Erlaubnis ab, während der Wunsch des Autors gemeint ist. Ferner macht „So sollt ihr“ aus der folgenden Zweck-/Folgeaussage eine zusätzliche selbständige Aufforderung. Eine engere, zugleich natürliche Satzfügung ist vorzuziehen.
  terminology: „Diakon“, „Bischof“, „Ältestenrat“ und die erklärende Fußnote sind sachgerecht. „Ältestenrat“ ist eine verständliche Wiedergabe von Presbyterium, ohne die historische Amtsbezeichnung zu verschleiern. „Mitknecht“ bewahrt das traditionelle Bild des gemeinsamen Dienstes; die gewählte Registerhöhe ist für Ignatius vertretbar.
  issues:
  - severity: medium
    issue: „bei mir bleiben darf“
    rationale: Die Formulierung fügt den Gedanken einer Erlaubnis hinzu. Der Zeuge gibt einen Fürbittewunsch wieder; „bei mir bleiben möge“ ist genauer.
  - severity: medium
    issue: „So sollt ihr ...“ im Schlusssatz
    rationale: Die Vorlage verbindet das Vollkommen-verbunden-Sein und die Unterordnung als Grundlage bzw. Zielbezug mit der Heiligung. Das eingefügte „So sollt ihr“ gestaltet dies zu einer eigenständigen Aufforderung um und schwächt den syntaktischen Zusammenhang.
  - severity: low
    issue: „hat mir ... Erleichterung verschafft“
    rationale: Die abstrakte Wendung ist möglich, trifft aber die konkrete, mit dem folgenden Segenswunsch korrespondierende Sprache von Erquickung/Stärkung weniger gut.
  revised_text: 'Was aber meinen Mitknecht Burrhus betrifft, der nach Gottes Willen euer in allem gesegneter Diakon ist, so bitte ich darum, dass er bei mir bleiben möge – zu eurer und eures Bischofs Ehre. Auch Krokus, der Gottes und eurer würdig ist und den ich als Beispiel für eure Liebe zu mir empfangen habe, hat mich in jeder Hinsicht erquickt. Ebenso möge der Vater Jesu Christi ihn erquicken, zusammen mit Onesimus, Burrhus, Euplus und Fronto. In ihnen allen sah ich euch mit den Augen der Liebe.


    Möge ich mich allezeit an euch freuen, wenn ich dessen wirklich würdig bin. Daher ist es angemessen, dass ihr Jesus Christus, der euch verherrlicht hat, in jeder Hinsicht verherrlicht, damit ihr, in einmütiger Unterordnung vollkommen miteinander verbunden und eurem Bischof und dem Ältestenrat[a] untergeordnet, in jeder Hinsicht geheiligt werdet.'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich bzw. als kirchlicher Fachausdruck: „Presbyterium“, das Kollegium der Ältesten (Presbyter).'
    reason: Erklärt die historisch-kirchliche Amtsbezeichnung hinter dem verständlicheren Ausdruck „Ältestenrat“.
  revision_rationale: 'Die Revision beschränkt sich auf sichere sprachliche und syntaktische Korrekturen: Der Fürbittecharakter des Bleibens wird wiedergegeben, die Sprache von Erquickung wird in beiden korrespondierenden Aussagen angeglichen, und der finale Zusammenhang der Heiligung bleibt ohne zusätzliches Satzgefüge erhalten. Namen, Amtsbegriffe, Bildsprache und die offen gehaltene theologische Aussage bleiben unverändert.'
