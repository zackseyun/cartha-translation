    May I have joy of you always, if so be I an worthy of it. It is therefore meet for you in every way to glorify Jesus Christ who glorified you; that being perfectly joined together in one submission, submitting yourselves to your bishop and presbytery, ye may be sanctified in all things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: de
  text: 'Was aber meinen Mitknecht Burrhus betrifft, der nach Gottes Willen euer in jeder Hinsicht gesegneter Diakon ist, so bitte ich darum, dass er bei mir bleiben darf – euch und eurem Bischof zur Ehre. Auch Krokus, der Gottes und eurer würdig ist und den ich als Beispiel für eure Liebe zu mir empfangen habe, hat mir in jeder Hinsicht Erleichterung verschafft. Ebenso möge der Vater Jesu Christi ihn erquicken, zusammen mit Onesimus, Burrhus, Euplus und Fronto. In ihnen allen sah ich euch mit den Augen der Liebe.


    Möge ich mich allezeit an euch freuen, wenn ich dessen wirklich würdig bin. Daher ist es angemessen, dass ihr Jesus Christus, der euch verherrlicht hat, in jeder Hinsicht verherrlicht. So sollt ihr in einträchtiger Unterordnung vollkommen miteinander verbunden sein und euch eurem Bischof und dem Ältestenrat[a] unterordnen, damit ihr in jeder Hinsicht geheiligt werdet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. als kirchlicher Fachausdruck: „Presbyterium“, das Kollegium der Ältesten (Presbyter).'
    reason: Erklärt die historisch-kirchliche Amtsbezeichnung hinter dem verständlicheren Ausdruck „Ältestenrat“.
lexical_decisions:
- source_word: fellow servant (likely σύνδουλος)
  choice: Mitknecht
  rationale: Bewahrt das Bild gemeinsamen Dienstes, klingt im heutigen Deutsch jedoch verständlicher als „Mitsklave“ und bleibt dem kirchlichen Kontext angemessen.
- source_word: deacon (διάκονος)
  choice: Diakon
  rationale: Gibt die erkennbare Amtsbezeichnung wieder, ohne sie auf das allgemeinere „Diener“ zu reduzieren.
- source_word: presbytery (πρεσβυτέριον)
  choice: Ältestenrat
  rationale: Bezeichnet das Kollegium der Presbyter und vermeidet, dass der Ausdruck als bloßes Gebäude oder moderne Konfessionsbezeichnung missverstanden wird.
- source_word: refresh / relieve
  choice: erquicken / Erleichterung verschaffen
  rationale: Unterscheidet den Segenswunsch über Krokus von der konkreten Hilfe, die er Ignatius erwiesen hat.
- source_word: with the eyes of love
  choice: mit den Augen der Liebe
  rationale: Erhält das prägnante Bild des Zeugnisses.
- source_word: glorify / glorified
  choice: verherrlichen / verherrlicht
  rationale: Bewahrt die bewusste Wortwiederholung und ihre theologische Spannung.
- source_word: one submission
  choice: einträchtige Unterordnung
  rationale: Gibt sowohl die gemeinsame Einheit als auch das Moment der Unterordnung natürlich wieder, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Kirchliche Leitungsstruktur
  choice: „Bischof und Ältestenrat“
  alternative: „Bischof und Presbyterium“
  rationale: Die personale und kollegiale Leitungsstruktur bleibt erkennbar; „Ältestenrat“ ist für heutige Leser transparenter, während die Fußnote den Fachbegriff nennt.
- issue: Wechselseitige Verherrlichung
  choice: „Jesus Christus, der euch verherrlicht hat“
  alternative: „Jesus Christus, der euch Ehre erwiesen hat“
  rationale: Die stärkere und theologisch offene Formulierung des Zeugnisses wird nicht erklärend abgeschwächt.
- issue: Heiligung als Zielaussage
  choice: „damit ihr ... geheiligt werdet“
  alternative: „sodass ihr ... geheiligt seid“
  rationale: Die finale Ausrichtung des Satzes wird bewahrt, ohne festzulegen, ob Ignatius einen einmaligen oder fortdauernden Vorgang meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formnaher Syntax. Die Übersetzung folgt mangels vorgelegten griechischen Wortlauts vorläufig dem angegebenen öffentlichen englischen Zeugen und der ausgewiesenen mittelgriechischen Überlieferungslage; eine direkte Prüfung am griechischen Text bleibt erforderlich. Eigennamen sind in geläufiger deutscher Form wiedergegeben.
