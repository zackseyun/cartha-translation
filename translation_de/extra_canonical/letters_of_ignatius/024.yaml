base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: de
  text: 'Als ich von der gottgemäßen Ordnung eurer Liebe erfuhr, war ich überaus erfreut und beschloss, euch im Glauben Jesu Christi anzureden.


    Denn weil ich für würdig erachtet worden bin, in den Fesseln, die ich umhertrage, einen im höchsten Maß gottgemäßen Namen zu tragen, besinge ich die Gemeinden. In ihnen bete ich um die Einheit von Fleisch und Geist Jesu Christi, der unser Leben allezeit ist, sowie um Glauben und Liebe, vor der nichts Vorrang hat, und – was alles überragt – um Jesus Christus und den Vater. In ihm werden wir, wenn wir alle Misshandlungen durch den Herrscher dieses Zeitalters geduldig ertragen und ihm entkommen, zu Gott gelangen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exceeding good order
  choice: überaus gute Ordnung
  rationale: Bewahrt die wertende und ordnungsbezogene Aussage des Zeugnisses, ohne sie als bloße Frömmigkeit oder Disziplin umzudeuten.
- source_word: in the faith of Jesus Christ
  choice: im Glauben an Jesus Christus
  rationale: Natürliches modernes Deutsch; die englische Formulierung lässt zwar auch eine Zuordnung zu Christus zu, doch der Zusammenhang beschreibt die Sphäre bzw. Grundlage des Schreibens.
- source_word: most godly name
  choice: höchst göttlichen Namen
  rationale: Hält die auffällige, gesteigerte religiöse Bezeichnung offen, statt den gemeinten Namen ohne griechische Prüfung ausdrücklich als »Christ« oder »Christus« festzulegen.
- source_word: I sing the praise of the churches
  choice: stimme ich den Gemeinden ein Loblied an
  rationale: Gibt den poetischen Charakter wieder und vermeidet die mögliche Fehlbedeutung, Ignatius lobe lediglich die Gemeinden.
- source_word: never-failing life
  choice: unvergänglichen Leben
  rationale: Drückt die Dauerhaftigkeit und Unerschöpflichkeit des Lebens in idiomatischem, dignifiziertem Deutsch aus.
- source_word: prince of this world
  choice: Herrscher dieser Welt
  rationale: Entspricht dem traditionellen johanneischen Ausdruck, ist aber im heutigen Deutsch verständlicher als »Fürst«.
- source_word: attain unto God
  choice: zu Gott gelangen
  rationale: Bewahrt die Zielbewegung der Aussage, ohne eine speziell konfessionelle Heilslehre einzutragen.
theological_decisions:
- issue: Zuordnung von Fleisch und Geist zu Jesus Christus
  choice: »des Fleisches und des Geistes …, die Jesus Christus gehören«
  alternative: »Einheit von Fleisch und Geist, die Jesus Christus ist« bzw. »die in Jesus Christus besteht«
  rationale: Das englische Zeugnis hat eine echte grammatische und theologische Spannung. Die gewählte Fassung folgt möglichst formal der Besitzanzeige und löst sie nicht christologisch-systematisch auf.
- issue: Bezug des Pronomens in »in whom«
  choice: »in ihnen« mit Fußnote
  alternative: »in ihm« mit Bezug auf den Vater
  rationale: Das englische »whom« kann im Satzbau auf Jesus und den Vater gemeinsam oder insbesondere auf den Vater bezogen werden. Die Pluralfassung folgt der unmittelbar genannten Verbindung mit beiden, während die Alternative dokumentiert wird.
- issue: Misshandlungen und Entkommen
  choice: »Misshandlungen … geduldig ertragen und ihnen entkommen«
  alternative: »jeden Angriff … ertragen und dem Herrscher entkommen«
  rationale: Das Zeugnis lässt offen, ob sich das Entkommen grammatisch auf die Anfeindungen oder auf den Herrscher bezieht; die Übersetzung hält den nächstliegenden Bezug fest, ohne die andere Deutung dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht gehobenem Ton für einen frühchristlichen Brief. Der Entwurf beruht mangels bereitgestellten griechischen Wortlauts auf dem gemeinfreien englischen Zeugen; direkte Prüfung der mittelrezensionellen griechischen Überlieferung ist weiterhin erforderlich.
