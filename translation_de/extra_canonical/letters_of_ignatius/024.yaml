revisions:
- from: 'Als ich von der überaus guten Ordnung eurer Liebe auf den Wegen Gottes erfuhr, freute ich mich und beschloss, euch im Glauben an Jesus Christus anzusprechen.


    Denn da ich für würdig erachtet wurde, in diesen Fesseln, die ich mit mir trage, einen höchst göttlichen Namen zu tragen, stimme ich den Gemeinden ein Loblied an. Und ich bete darum, dass in ihnen die Einheit des Fleisches und des Geistes bestehe, die Jesus Christus gehören, unserem unvergänglichen Leben; ebenso die Einheit des Glaubens und der Liebe, die allem anderen vorzuziehen ist; und vor allem die Einheit mit Jesus und mit dem Vater. Wenn wir in ihnen[a] alle Misshandlungen durch den Herrscher dieser Welt geduldig ertragen und ihnen entkommen, werden wir zu Gott gelangen.'
  to: 'Als ich von der gottgemäßen Ordnung eurer Liebe erfuhr, war ich überaus erfreut und beschloss, euch im Glauben Jesu Christi anzureden.


    Denn weil ich für würdig erachtet worden bin, in den Fesseln, die ich umhertrage, einen im höchsten Maß gottgemäßen Namen zu tragen, besinge ich die Gemeinden. In ihnen bete ich um die Einheit von Fleisch und Geist Jesu Christi, der unser Leben allezeit ist, sowie um Glauben und Liebe, vor der nichts Vorrang hat, und – was alles überragt – um Jesus Christus und den Vater. In ihm werden wir, wenn wir alle Misshandlungen durch den Herrscher dieses Zeitalters geduldig ertragen und ihm entkommen, zu Gott gelangen.'
  rationale: Die Revision richtet die deutsche Fassung am griechischen Satzbau aus und korrigiert zugleich irreführende Deutungen des englischen Brückenzeugen. Der Singularbezug von »in ihm« wird im Text beibehalten; eine Fußnote ist nicht nötig, da die grammatische Nähe zum Vater klar ist. Die dichte Aufzählung des Schlusses wird nicht durch eine theologisch interpretierende Wiederholung von »Einheit« erweitert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:51:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem englischen Zeugen in mehreren Punkten, weicht jedoch dort vom griechischen Satzbau und den Akzenten ab: Das Adverb der starken Freude wird fälschlich auf die »Ordnung« bezogen; ἐν ᾧ ist im Griechischen Singular und kann nicht »in ihnen« (Jesus und Vater zusammen) heißen; außerdem ergänzt der Entwurf zweimal »Einheit«, wo der griechische Wortlaut dies im letzten Glied nicht ausdrücklich wiederholt.'
  naturalness: 'Der Ton ist insgesamt würdig und verständlich. »stimme ich den Gemeinden ein Loblied an« ist jedoch semantisch verfehlt und im Deutschen unnatürlich: ᾄδω τὰς ἐκκλησίας bedeutet, dass der Verfasser die Gemeinden besingt. Die revidierte Fassung bleibt modernes Standarddeutsch, ohne den knappen, reihenden Stil zu glätten.'
  terminology: »Herrscher dieses Zeitalters« gibt ἄρχων τοῦ αἰῶνος τούτου genauer wieder als »Herrscher dieser Welt«. Der Genitiv in »Glauben Jesu Christi« und die Formulierung »Fleisch und Geist Jesu Christi« werden nicht dogmatisch aufgelöst. »gottgemäß« gibt θεοπρεπής idiomatisch wieder.
  issues:
  - severity: high
    issue: Fehlbezug von »überaus«
    rationale: Im griechischen Satz charakterisiert ὑπερχαίρων die Freude des Schreibers, nicht die εὐταξία (Ordnung) der Liebe.
  - severity: high
    issue: Pluralischer Bezug »in ihnen« samt Fußnote
    rationale: Der griechische Relativausdruck ἐν ᾧ steht im Singular; nach der unmittelbaren Syntax bezieht er sich auf »den Vater«. Die Fußnote behauptet eine gemeinschaftliche Bezugsoption, die der Singular nicht trägt.
  - severity: medium
    issue: »Einheit mit Jesus und mit dem Vater« ist eine interpretierende Ergänzung
    rationale: Im letzten Reihenglied nennt der griechische Text ausdrücklich »Jesus Christus und den Vater«, nicht nochmals ἕνωσις. Die Gebetsrichtung kann aus dem Satz erschlossen werden, sollte aber nicht als zusätzliches Substantiv in den Text eingetragen werden.
  - severity: medium
    issue: »den Gemeinden ein Loblied anstimmen«
    rationale: Dies kann heißen, Ignatius stimme gemeinsam mit den Gemeinden ein Lied an. Gemeint ist, dass er die Gemeinden besingt.
  - severity: low
    issue: »dieser Welt« für αἰών
    rationale: αἰών bezeichnet hier genauer das gegenwärtige Zeitalter bzw. Weltzeitalter.
