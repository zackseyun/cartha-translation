base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: de
  text: 'Achtet auf den Bischof, damit auch Gott auf euch achtet. Für alle, die sich dem Bischof, den Presbytern und den Diakonen unterordnen, setze ich mein Leben ein.[a] Möge mir gewährt werden, mit ihnen meinen Anteil bei Gott zu haben. Müht euch miteinander ab, kämpft miteinander, lauft miteinander, leidet miteinander, legt euch miteinander nieder und steht miteinander auf – als Gottes Verwalter, Beisitzer und Diener.


    Sucht dem zu gefallen, für den ihr Kriegsdienst leistet und von dem ihr auch euren Sold empfangt. Keiner von euch soll als Fahnenflüchtiger befunden werden. Eure Taufe bleibe euch als Schutzwaffe, euer Glaube als Helm, eure Liebe als Speer und eure Geduld als volle Rüstung.[b] Eure Werke seien eure Einlagen, damit ihr das euch zustehende Guthaben ausgezahlt bekommt.[c] Seid daher miteinander geduldig und begegnet einander mit Sanftmut, wie auch Gott mit euch ist. Möge ich mich allezeit an euch freuen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine schwer knapp wiederzugebende Wendung, die persönliche Hingabe bis zum Einsatz des eigenen Lebens ausdrückt.
    reason: Die ignatianische Formel ἀντίψυχον hat keine genaue, zugleich natürliche deutsche Entsprechung.
  - marker: b
    text: Das hier mit „Schutzwaffe“ wiedergegebene Wort kann allgemein „Waffen“ oder „Ausrüstung“ bedeuten; „volle Rüstung“ bezeichnet die gesamte Kampfausrüstung.
    reason: Die militärischen Ausdrücke sind im griechischen Wortlaut breiter als die im englischen Zeugen gewählten Begriffe „shield“ und „body armor“.
  - marker: c
    text: Der Satz verwendet offenbar aus dem Lateinischen übernommene kaufmännische Begriffe für Einlagen und das, was daraus ausgezahlt oder empfangen wird.
    reason: Das Wortspiel ist im Deutschen nicht formgleich nachzubilden und seine genaue technische Nuance bleibt unsicher.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: setze ich mein Leben ein
  rationale: Die ignatianische Wendung bezeichnet eine persönliche, bis zur Lebenshingabe reichende Verbundenheit. Die Formulierung bleibt verständlich, ohne sie technisch als Opferlehre festzulegen.
- source_word: πρεσβύτεροι
  choice: Presbyter
  rationale: Der historische Amtsbegriff wird beibehalten, statt ihn vorschnell mit einer heutigen Konfessionsbezeichnung gleichzusetzen.
- source_word: πάρεδροι
  choice: Beisitzer
  rationale: Gibt die Vorstellung von Personen wieder, die jemandem zur Seite sitzen und an seiner Aufgabe mitwirken; vermeidet eine überpräzise moderne Amtsbezeichnung.
- source_word: ὀψώνια
  choice: Sold
  rationale: Passt zum ausdrücklich militärischen Bild des Kriegsdienstes.
- source_word: δεσέρτωρ
  choice: Fahnenflüchtiger
  rationale: Natürliches deutsches Wort für einen Deserteur und klare Fortführung der Militärmetaphorik.
- source_word: ὅπλα
  choice: Schutzwaffe
  rationale: Das griechische Wort kann Waffen beziehungsweise Ausrüstung bezeichnen. Im Kontext der folgenden Rüstungsteile vermittelt „Schutzwaffe“ die defensive Funktion, ohne den Ausdruck ausschließlich auf einen Schild festzulegen.
- source_word: πανοπλία
  choice: volle Rüstung
  rationale: Bezeichnet die vollständige Bewaffnung beziehungsweise Rüstung, nicht bloß einen einzelnen Brustpanzer.
- source_word: δεπόσιτα / ἄκκεπτα
  choice: Einlagen / Guthaben ausgezahlt
  rationale: Die latinisierten kaufmännischen Ausdrücke werden als zusammenhängendes Bild von hinterlegten Einlagen und späterer Auszahlung wiedergegeben.
- source_word: μακροθυμεῖτε
  choice: Seid ... geduldig
  rationale: Natürliches modernes Deutsch für langmütiges Ertragen im zwischenmenschlichen Umgang.
theological_decisions:
- issue: Verhältnis zur kirchlichen Leitung
  choice: „Achtet auf“ und „sich ... unterordnen“
  alternative: „Gehorcht“ beziehungsweise „unterwerft euch“
  rationale: Die Übersetzung gibt die verschiedenen Ausdrücke differenziert wieder und verstärkt die Aussage nicht zu einer unbeschränkten Gehorsamsforderung.
- issue: Anteil bei oder in Gott
  choice: „meinen Anteil bei Gott“
  alternative: „meinen Anteil in Gott“
  rationale: „Bei Gott“ ist im Deutschen idiomatischer und lässt offen, ob Gegenwart, Gemeinschaft oder eschatologische Zugehörigkeit im Vordergrund steht.
- issue: Vergeltung nach Werken
  choice: Bankbild von Einlagen und zustehender Auszahlung
  alternative: freie Deutung als Verdienstlehre oder bloße Belohnungsmetapher
  rationale: Das ökonomische Bild wird bewahrt, ohne eine bestimmte systematische Lehre über Verdienst, Gnade und Lohn einzutragen.
- issue: Gottes Geduld mit den Adressaten
  choice: „wie auch Gott mit euch ist“
  alternative: „wie auch Gott mit euch geduldig ist“
  rationale: Die knappe Vergleichsform bleibt erhalten und wird nicht auf nur eine göttliche Eigenschaft verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konsequentem Plural der Anrede. Die auffällige Reihe der mit „mit-“ gebildeten Handlungen und der Wechsel von Verwaltungs-, Militär- und Geschäftsmetaphorik bleiben erkennbar. Der Entwurf berücksichtigt den überlieferten griechischen Wortlaut der mittleren Rezension, kennzeichnet jedoch besonders schwierige Lexeme vorsichtig, da laut Datensatz die abschließende direkte Quellenprüfung noch aussteht.
