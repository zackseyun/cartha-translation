review_pass:
  verdict: revise
  source_fidelity: 'Eine Korrektur ist nötig: ὅπλα bedeutet hier allgemein „Waffen/Ausrüstung“ und nicht spezifisch eine defensive „Schutzwaffe“. Die militärische Bildfolge soll daher nicht einseitig umgedeutet werden. Die übrigen Leitbilder (kirchliche Ordnung, gemeinsames Mühen, Dienst im Heer, Rüstung und Geschäftsmetaphorik) werden sachgerecht bewahrt.'
  naturalness: Der Text ist überwiegend idiomatisches modernes Standarddeutsch. „Gefallt dem, unter dem ihr Kriegsdienst leistet“ ist natürlicher als „Sucht dem zu gefallen, für den ihr Kriegsdienst leistet“. „Ruht miteinander“ trifft συναναπαύεσθε natürlicher als „legt euch miteinander nieder“.
  terminology: „Bischof“, „Presbyter“, „Diakone“, „Verwalter“, „Beisitzer“ und „Diener“ sind angemessen. „Waffen“ für ὅπλα und „vollständige Rüstung“ für πανοπλία bewahren die unterschiedliche Wortwahl. Die unsicheren latinisierten Finanzbegriffe bleiben mit einer vorsichtigen Fußnote markiert.
  issues:
  - severity: medium
    issue: „Schutzwaffe“ für ὅπλα
    rationale: ὅπλα ist ein allgemeiner militärischer Ausdruck für Waffen beziehungsweise Ausrüstung. Die Übersetzung als ausschließlich defensive Schutzwaffe engt den Begriff ohne Grundlage ein; die anschließende Fußnote begründet diese Einengung zudem mit einer nicht im griechischen Wortlaut liegenden defensiven Funktion.
  - severity: low
    issue: „legt euch miteinander nieder“ für συναναπαύεσθε
    rationale: Das Verb bezeichnet gemeinsames Ruhen beziehungsweise Ausruhen. Die vorliegende Formulierung ist möglich, legt aber stärker den bloßen Vorgang des Niederlegens nahe.
  - severity: low
    issue: Umständliche Wiedergabe von ἀρέσκετε ᾧ στρατεύεσθε
    rationale: Die Aufforderung lautet knapp „Gefallt dem, unter dem/ihr für den ihr Kriegsdienst leistet“. Die überarbeitete Form ist idiomatischer, ohne einen im Griechischen nicht ausdrücklich genannten militärischen Rang hinzuzufügen.
