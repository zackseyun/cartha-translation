revisions:
- from: '[Doch] meidet Spaltungen, denn sie sind der Anfang allen Übels. Folgt alle eurem Bischof, wie Jesus Christus dem Vater folgte, und dem Ältestenrat wie den Aposteln. Achtet die Diakone wie Gottes Gebot. Niemand soll ohne den Bischof etwas tun, was die Gemeinde betrifft. Als gültige Eucharistie[a] soll die gelten, die unter der Verantwortung des Bischofs gefeiert wird oder unter der Verantwortung dessen, den er damit beauftragt hat.


    Wo immer der Bischof erscheint, dort soll auch die Gemeinde sein; ebenso ist dort, wo Jesus Christus ist, die universale Kirche[b]. Ohne den Bischof ist es nicht erlaubt, zu taufen oder ein Liebesmahl[c] zu halten. Was immer er gutheißt, ist auch Gott wohlgefällig, damit alles, was ihr tut, verlässlich und gültig ist.'
  to: '[Doch] meidet Spaltungen, denn sie sind der Anfang allen Übels. Folgt alle eurem Bischof, wie Jesus Christus dem Vater folgt, und folgt dem Ältestenrat wie den Aposteln. Achtet die Diakone wie Gottes Gebot. Niemand soll ohne den Bischof etwas tun, was die Gemeinde betrifft. Als verbindlich soll die Eucharistie[a] gelten, die unter dem Bischof gefeiert wird oder bei der Person, der er es anvertraut hat.


