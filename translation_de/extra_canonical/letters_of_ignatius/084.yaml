  rationale: Die Revision folgt dem griechischen Wortlaut enger, indem sie „Christus Jesus“ wiederherstellt, die doppelte Aufforderung zum Folgen syntaktisch verdeutlicht und die offene Wendung ὑπὸ τὸν ἐπίσκοπον nicht durch „unter der Verantwortung“ ausdeutet. „Verbindlich“ bildet βεβαία beziehungsweise βέβαιον in beiden Vorkommen konsistent ab; „sicher“ gibt ἀσφαλές wieder. Die normative Schärfe der Aussagen zur bischöflichen Ordnung, Taufe und Agape bleibt unverändert erhalten.
