base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: de
  text: '[Doch] meidet Spaltungen, denn sie sind der Anfang allen Übels. Folgt alle eurem Bischof, wie Jesus Christus dem Vater folgt, und folgt dem Ältestenrat wie den Aposteln. Achtet die Diakone wie Gottes Gebot. Niemand soll ohne den Bischof etwas tun, was die Gemeinde betrifft. Als verbindlich soll die Eucharistie[a] gelten, die unter dem Bischof gefeiert wird oder bei der Person, der er es anvertraut hat.


    Wo immer der Bischof erscheint, dort soll auch die Gemeinde sein; ebenso ist dort, wo Christus Jesus ist, die universale Kirche[b]. Ohne den Bischof ist es nicht erlaubt, zu taufen oder ein Liebesmahl[c] zu halten. Was immer er gutheißt, ist auch Gott wohlgefällig, damit alles, was ihr tut, sicher und verbindlich ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Eucharistie“ bezeichnet hier die frühchristliche Feier des Herrenmahls.
    reason: Der griechische Fachbegriff εὐχαριστία wird beibehalten und knapp erklärt.
  - marker: b
    text: 'Wörtlich beziehungsweise traditionsgemäß auch: „die katholische Kirche“. „Universal“ gibt hier den Sinn „allgemein, das Ganze umfassend“ wieder, nicht notwendig eine spätere Konfessionsbezeichnung.'
    reason: Bewahrt die Bedeutungsbreite von καθολικός und dokumentiert die traditionelle Terminologie.
  - marker: c
    text: Das „Liebesmahl“ (Agape) war ein gemeinschaftliches Mahl frühchristlicher Gemeinden; sein genaues Verhältnis zur Eucharistie konnte je nach Zeit und Ort verschieden sein.
    reason: Der historische Ausdruck benötigt für heutige Leser eine knappe Erklärung.
lexical_decisions:
- source_word: ἐπίσκοπος (über den englischen Zeugen erschlossen)
  choice: Bischof
  rationale: Der etablierte frühchristliche Amtstitel bewahrt den historischen und kirchlichen Bezug besser als das allgemeinere „Aufseher“.
- source_word: πρεσβυτέριον (über den englischen Zeugen erschlossen)
  choice: Ältestenrat
  rationale: Bezeichnet hier ein Kollegium, nicht einen einzelnen Ältesten; „Ältestenrat“ ist verständlich und wahrt den korporativen Sinn.
- source_word: διάκονοι (über den englischen Zeugen erschlossen)
  choice: Diakone
  rationale: Der frühchristliche Amtstitel wird präzise und ohne konfessionelle Umdeutung wiedergegeben.
- source_word: εὐχαριστία (über den englischen Zeugen erschlossen)
  choice: Eucharistie
  rationale: Bewahrt den historischen Fachbegriff und vermeidet eine vorschnelle Gleichsetzung mit später konfessionell geprägten Benennungen.
- source_word: καθολικὴ ἐκκλησία (über den englischen Zeugen erschlossen)
  choice: universale Kirche
  rationale: Gibt den ursprünglichen Sinn „allgemein, das Ganze umfassend“ wieder, ohne den Ausdruck ausschließlich als spätere Konfessionsbezeichnung zu lesen.
- source_word: ἀγάπη (über den englischen Zeugen erschlossen)
  choice: Liebesmahl
  rationale: Im Kontext bezeichnet der Ausdruck wahrscheinlich das gemeindliche Agapemahl; die Wiedergabe macht diese historische Bedeutung verständlich.
- source_word: βέβαιος / βεβαία (über den englischen Zeugen erschlossen)
  choice: verlässlich und gültig
  rationale: Die wiederholte Begrifflichkeit betrifft sowohl feste Verlässlichkeit als auch anerkannte Geltung; im Deutschen erfordert der jeweilige Kontext leicht unterschiedliche Formulierungen.
theological_decisions:
- issue: Verhältnis von Bischof und Jesus Christus beziehungsweise Vater
  choice: „wie Jesus Christus dem Vater folgte“
  alternative: „wie Jesus Christus dem Vater untergeordnet war“
  rationale: „Folgte“ bleibt nahe am überlieferten englischen Zeugen und vermeidet, eine weitergehende metaphysische oder trinitätstheologische Aussage in den Satz einzutragen.
- issue: Geltung der Eucharistie
  choice: „unter der Verantwortung des Bischofs“
  alternative: „vom Bischof geleitet“ oder „unter dem Bischof“
  rationale: Der Satz umfasst sowohl die Feier beim Bischof als auch bei einer von ihm beauftragten Person. „Unter der Verantwortung“ bildet diese Autorisierung natürlich ab, ohne eine bestimmte liturgische Leitungsform festzulegen.
- issue: Bedeutung von „katholische Kirche“
  choice: „universale Kirche“
  alternative: „katholische Kirche“ oder „allgemeine Kirche“
  rationale: Die Übersetzung wahrt die Aussage über die umfassende Kirche bei Christus und vermeidet eine anachronistische Verengung auf eine spätere Konfessionsbezeichnung.
- issue: Bindung von Taufe und Liebesmahl an den Bischof
  choice: Die starke normative Aussage wird unverändert beibehalten.
  alternative: Abschwächung zu einer bloßen Empfehlung kirchlicher Ordnung
  rationale: Der Text formuliert ausdrücklich „nicht erlaubt“; diese historische ekklesiologische Spannung darf nicht harmonisiert oder abgeschwächt werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede im Plural. Die Fassung ist wegen der noch ausstehenden direkten Prüfung der griechischen mittelrezensionellen Überlieferung ausdrücklich vorläufig. Eckige Klammern um „Doch“ bewahren die Unsicherheit beziehungsweise redaktionelle Kennzeichnung des gelieferten Zeugen.
