review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung gibt den Gedankengang der griechischen Mittelrezension im Wesentlichen zutreffend wieder. Eine sichere Korrektur ist jedoch bei „wo Jesus Christus ist“ nötig: Der griechische Text lautet „wo Christus Jesus ist“, nicht lediglich „Jesus“. Außerdem ist die Wiederaufnahme von „folgt“ beim Ältestenrat im Deutschen sinnvoll, weil sie die griechische Parallelkonstruktion klar abbildet. „Unter der Verantwortung“ ist als Deutung von ὑπὸ τὸν ἐπίσκοπον weiter als nötig; „unter dem Bischof“ bewahrt die knappe, nicht näher spezifizierte Abhängigkeitsrelation des Ausgangstextes besser.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „Folgt alle eurem Bischof“ wirkt gegenüber „Folgt alle eurem Bischof“ zwar möglich, aber die explizite Wiederholung „folgt dem Ältestenrat“ erhöht Klarheit und Lesbarkeit. „Als gültige Eucharistie soll die gelten“ ist verständlich, aber „Als verbindlich soll die Eucharistie gelten“ gibt βεβαία idiomatischer wieder, ohne eine moderne juristisch-sakramentale Kategorie einzutragen.
  terminology: „Bischof“, „Ältestenrat“, „Diakone“, „Eucharistie“, „Liebesmahl“ und „universale Kirche“ sind tragfähige Wiedergaben. „Universale Kirche“ ist für καθολικὴ ἐκκλησία vertretbar, sofern die Fußnote die mögliche traditionelle Übersetzung „katholische Kirche“ dokumentiert. Die Fußnote zur Eucharistie sollte nicht pauschal eine noch ausstehende Prüfung der griechischen Textgestalt behaupten, da der vorgelegte griechische Wortlaut die Verwendung von εὐχαριστία bestätigt.
  issues:
  - severity: medium
    issue: „Jesus“ statt „Christus Jesus“ im zweiten Absatz
    rationale: Der griechische Wortlaut hat ὅπου ἂν ᾖ Χριστὸς Ἰησοῦς. Die Auslassung von „Christus“ verringert die explizite Übereinstimmung mit dem Quelltext.
  - severity: medium
    issue: „unter der Verantwortung des Bischofs“ interpretiert ὑπὸ τὸν ἐπίσκοπον zu stark
    rationale: Die Präposition bezeichnet eine Beziehung der Unterordnung bzw. Zuordnung zum Bischof, ohne ausdrücklich die moderne Kategorie „Verantwortung“ zu benennen. „unter dem Bischof“ wahrt die Offenheit des Ausdrucks.
  - severity: low
    issue: Die Parallelität bei Bischof und Ältestenrat bleibt im Deutschen zu elliptisch
    rationale: ἀκολουθεῖτε regiert beide Vergleichsglieder. Die Wiederholung von „folgt“ macht den Sinn ohne inhaltliche Ergänzung deutlich.
  - severity: low
    issue: Fußnote a verweist unnötig auf eine ausstehende Prüfung der griechischen Textgestalt
    rationale: Im bereitgestellten griechischen Text steht εὐχαριστία eindeutig. Eine Sachanmerkung zum historischen Begriff genügt.
