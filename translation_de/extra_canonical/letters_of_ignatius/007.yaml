    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: de
  text: 'Je mehr jemand wahrnimmt, dass sein Bischof schweigt, desto mehr soll er ihn achten.[a] Denn jeden, den der Hausherr als Verwalter über sein eigenes Haus sendet, sollen wir so aufnehmen wie den, der ihn gesandt hat. Offenbar sollen wir daher den Bischof so ansehen wie den Herrn selbst.[b]


    Onesimus lobt aus eigenem Antrieb eure von Gott geprägte gute Ordnung sehr. Denn ihr alle lebt der Wahrheit gemäß, und keine Irrlehre findet bei euch eine Heimat. Ja, ihr hört nicht einmal auf jemanden, wenn er von etwas anderem spricht als von Jesus Christus in Wahrheit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „desto mehr soll er ihn fürchten“; gemeint sein kann ehrfürchtige oder respektvolle Scheu.'
    reason: Bewahrt die Bedeutungsbreite des griechischen Verbs und die im englischen Zeugnis ausdrücklich erhaltene Spannung.
  - marker: b
    text: Der Vergleich bezieht sich auf die Aufnahme des vom Hausherrn gesandten Verwalters; er muss keine Gleichsetzung des Bischofs mit Christus bedeuten.
    reason: Verhindert eine unnötige dogmatische Festlegung, ohne die starke Aussage des Textes abzuschwächen.
  - marker: c
    text: 'Die Wendung kann auch so verstanden werden: „wenn jemand nicht wahrheitsgemäß über Jesus Christus spricht“.'
    reason: Kennzeichnet die mögliche syntaktische Mehrdeutigkeit der Schlussformulierung.
lexical_decisions:
- source_word: σιωπῶντα
  choice: schweigt
  rationale: Bewahrt das konkrete Bild des schweigenden beziehungsweise zurückhaltenden Bischofs, ohne es deutend auf bestimmte Amtspraktiken einzuengen.
- source_word: φοβείσθω
  choice: achten
  rationale: Das griechische Verb kann je nach Zusammenhang Furcht, Ehrfurcht oder respektvolle Scheu bezeichnen. Im Zusammenhang der Aufnahme eines Gesandten ist „achten“ im Deutschen natürlich, während die stärkere Grundbedeutung in der Fußnote erhalten bleibt.
- source_word: οἰκοδεσπότης / οἰκονομίαν
  choice: Hausherr / Verwalter
  rationale: Gibt das zusammenhängende Bildfeld von Hausleitung und anvertrauter Verwaltung klar wieder.
- source_word: εὐταξίαν
  choice: gute Ordnung
  rationale: Bezeichnet geordnetes, angemessenes Verhalten oder eine geordnete Lebensführung; „gute Ordnung“ bleibt verständlich und wertet nicht übermäßig aus.
- source_word: αἵρεσις
  choice: Irrlehre
  rationale: Im vorliegenden Zusammenhang geht es um eine von der Wahrheit über Jesus Christus abweichende Lehre, nicht bloß neutral um eine Partei oder Schule.
theological_decisions:
- issue: Vergleich des Bischofs mit dem Herrn
  choice: „so ansehen wie den Herrn selbst“
  alternative: „als den Herrn selbst ansehen“
  rationale: Die Formulierung bewahrt die starke rhetorische Analogie, ohne eine ontologische Gleichsetzung von Bischof und Christus ausdrücklich festzuschreiben.
- issue: Bedeutung von φοβεῖσθαι gegenüber dem schweigenden Bischof
  choice: „achten“ mit Fußnote zur Bedeutungsbreite
  alternative: „fürchten“ oder „Ehrfurcht vor ihm haben“
  rationale: Die Aussage soll weder zu bloßer Angst verschärft noch zu unverbindlichem Respekt abgeschwächt werden; die Fußnote hält die genuine Spannung offen.
- issue: Schlussformel über Jesus Christus und Wahrheit
  choice: „von etwas anderem spricht als von Jesus Christus in Wahrheit“
  alternative: „wenn er anders als wahrheitsgemäß über Jesus Christus spricht“
  rationale: Die syntaktische Mehrdeutigkeit wird im Haupttext möglichst bewahrt und in einer Fußnote kenntlich gemacht, statt sie stillschweigend zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Satzbau. Amts- und Haushaltsmetaphorik bleiben erhalten. Da keine griechische Textgestalt mitgeliefert wurde und die direkte Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf anhand des angegebenen mittelrezensionellen englischen Zeugnisses und der bekannten griechischen Wortlauttradition vorsichtig formuliert.
