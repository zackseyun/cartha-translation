review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe des ersten Abschnitts folgt dem Zeugnis insgesamt gut. Jedoch schwächt „achten“ das griechische φοβείσθω bzw. das englische „fear“ im Haupttext merklich ab. Entscheidend ist im zweiten Abschnitt die Bedingung am Schluss: Sie besagt, dass man niemandem zuhört, sofern dieser nicht wahrheitsgemäß etwas über Jesus Christus sagt; sie bedeutet nicht, dass nur Aussagen über Jesus Christus, im Gegensatz zu allen anderen Themen, gehört würden.'
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. „eure von Gott geprägte gute Ordnung“ ist etwas umständlich; „eure gottgemäße Ordnung“ ist knapper und wahrt das „in Gott“ besser. Die überarbeitete Schlusssatzstruktur ist zugleich natürlicher und genauer.
  terminology: „Bischof“, „Hausherr“, „Verwalter“, „Irrlehre“ und „Herr“ sind im Register passend. „fürchten“ sollte im Haupttext stehen, mit einer Fußnote zur möglichen Nuance ehrfürchtiger Scheu. Die Aussage über den Bischof ist als starke Vergleichs- bzw. Empfangsanweisung zu übersetzen, ohne ergänzende dogmatische Behauptung.
  issues:
  - severity: medium
    issue: „achten“ ersetzt „fürchten“ im Haupttext.
    rationale: Die Fußnote dokumentiert zwar die stärkere Bedeutung, doch der Haupttext sollte die bewusst scharfe Formulierung des Zeugnisses und die Bedeutungsspannung von φοβείσθαι nicht vorentscheiden oder abschwächen.
  - severity: high
    issue: Die Schlussklausel wird syntaktisch und inhaltlich verschoben wiedergegeben.
    rationale: '„wenn er von etwas anderem spricht als von Jesus Christus in Wahrheit“ macht Jesus Christus zum ausschließlichen Gesprächsthema. Die überlieferte Formulierung ist eine negative Bedingung: Man hört niemandem zu, außer wenn er wahrheitsgemäß etwas über Jesus Christus sagt. Die Fußnote c bietet zudem keine gleichwertige Alternative, sondern folgt derselben Verschiebung.'
  revised_text: 'Je mehr jemand wahrnimmt, dass sein Bischof schweigt, desto mehr soll er ihn fürchten.[a] Denn jeden, den der Hausherr als Verwalter über sein eigenes Haus sendet, sollen wir so aufnehmen wie den, der ihn gesandt hat. Offenbar sollen wir daher den Bischof als den Herrn selbst ansehen.[b]


    Onesimus lobt aus eigenem Antrieb eure gottgemäße Ordnung sehr. Denn ihr alle lebt der Wahrheit gemäß, und keine Irrlehre hat bei euch eine Heimat. Ja, ihr hört nicht einmal auf jemanden, wenn er nicht wahrheitsgemäß etwas über Jesus Christus sagt.[c]'
  revised_footnotes:
  - marker: a
    text: Das Verb kann neben „fürchten“ auch ehrfürchtige oder respektvolle Scheu bezeichnen.
    reason: Bewahrt die Bedeutungsbreite von φοβείσθαι, ohne die stärkere Formulierung im Haupttext abzuschwächen.
  - marker: b
    text: Die Aussage steht im Zusammenhang mit dem Empfang eines vom Hausherrn gesandten Verwalters und formuliert eine starke Analogie.
    reason: Verortet die Aussage im Bildzusammenhang, ohne eine dogmatische Gleichsetzung zu behaupten oder auszuschließen.
  - marker: c
    text: 'Wörtlicher: „wenn er nicht etwas über Jesus Christus in Wahrheit sagt“.'
    reason: 'Macht die negative Bedingung sichtbar: Die Formulierung grenzt nicht allgemein andere Gesprächsthemen aus, sondern falsche Rede über Jesus Christus.'
