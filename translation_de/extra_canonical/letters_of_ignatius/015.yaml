base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: de
  text: 'Nichts davon bleibt euch verborgen, wenn ihr im Glauben und in der Liebe zu Jesus Christus vollkommen seid; denn sie sind Anfang und Ende des Lebens: Der Glaube ist der Anfang, die Liebe das Ende. Beide sind, wenn sie in Einheit bestehen, Gott; alles Übrige aber folgt ihnen auf dem Weg zu wahrer Vortrefflichkeit.


    Wer sich zum Glauben bekennt, sündigt nicht, und wer die Liebe besitzt, hasst nicht. An seiner Frucht wird der Baum erkannt; ebenso werden diejenigen, die sich zu Christus bekennen, an ihren Taten zu erkennen sein. Denn das Werk erweist sich nicht im bloßen Bekenntnis, sondern darin, dass jemand bis zum Ende in der Kraft des Glaubens befunden wird.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus; besonders die Formulierungen „Beide … sind Gott“, „wahre Vortrefflichkeit“ und „das Werk“ sollten dabei überprüft werden.
    reason: Die bereitgestellten Daten enthalten keinen griechischen Wortlaut und kennzeichnen die quellensprachliche Prüfung ausdrücklich als ausstehend.
lexical_decisions:
- source_word: perfect / complete (Greek review pending)
  choice: vollkommen
  rationale: Bewahrt die starke Aussage des englischen Zeugen und den frühchristlichen, würdigen Ton, ohne sie auf bloße Reife oder Aufrichtigkeit abzuschwächen.
- source_word: beginning and end of life
  choice: Anfang und Ende des Lebens
  rationale: Formnahe Wiedergabe der antithetischen Aussage.
- source_word: true nobility
  choice: wahre Vortrefflichkeit
  rationale: Gibt die ethisch-qualitative Bedeutung wieder, ohne einen gesellschaftlichen Adelsbegriff nahezulegen.
- source_word: professing faith / profess to be Christ's
  choice: sich zum Glauben bekennen / sich zu Christus bekennen
  rationale: Natürliches modernes Deutsch; der zweite Ausdruck bewahrt die Zugehörigkeitsbehauptung, ohne mehr Präzision vorzutäuschen, als der englische Zeuge bietet.
- source_word: the Work
  choice: das Werk
  rationale: Die auffällige Singularform des Zeugen bleibt erhalten; die Großschreibung ist im Deutschen beim Substantiv ohnehin regulär.
- source_word: found in the power of faith
  choice: in der Kraft des Glaubens befunden wird
  rationale: Bewahrt die passive Prüfungs- beziehungsweise Bewährungsformulierung und die theologische Dichte.
theological_decisions:
- issue: Aussage über Glaube, Liebe und Gott
  choice: „Beide sind, wenn sie in Einheit bestehen, Gott“
  alternative: „Beide zusammen führen zu Gott“ oder „Gott ist bei ihnen“
  rationale: Die überlieferte, theologisch spannungsreiche Gleichsetzung wird nicht harmonisiert oder abgeschwächt.
- issue: Absolute Aussagen über Sünde und Hass
  choice: „Wer sich zum Glauben bekennt, sündigt nicht, und wer die Liebe besitzt, hasst nicht“
  alternative: „soll nicht sündigen / soll nicht hassen“
  rationale: Der indikativische und absolute Charakter des Zeugen bleibt erhalten; eine Umdeutung in Ermahnungen würde die Aussage entschärfen.
- issue: Verhältnis von Bekenntnis und Taten
  choice: „das Werk erweist sich nicht im bloßen Bekenntnis“
  alternative: „es geht jetzt nicht um ein Bekenntnis“
  rationale: „bloß“ macht den Gegensatz idiomatisch deutlich, ohne das Bekenntnis als solches abzuwerten; entscheidend ist seine Bewährung in Taten und Ausdauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die knappen Parallelismen und absoluten Aussagen des Zeugen wurden bewahrt. Wegen des fehlenden griechischen Ausgangstextes bleibt der Entwurf ausdrücklich vorläufig und orientiert sich eng, aber idiomatisch, am öffentlichen englischen Zeugen.
