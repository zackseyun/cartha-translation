review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Textzeugen im Wesentlichen eng. Die absolute Form der Aussagen über Sünde und Hass sowie die bewusst spannungsreiche Aussage, dass Glaube und Liebe in Einheit „Gott“ sind, bleiben erhalten. Da kein griechischer Wortlaut bereitgestellt ist, kann die direkte quellensprachliche Kontrolle nur als ausstehend vermerkt werden.
  naturalness: 'Das Deutsch ist überwiegend würdig und gut verständlich. Zwei Stellen profitieren von einer idiomatischeren und zugleich präziseren Formulierung: Die Christuszugehörigkeit sollte ausdrücklich als solche benannt werden, und „an ihren Taten zu erkennen sein“ sollte durch die normale Passivform „an ihren Taten erkannt werden“ ersetzt werden. Im Schlusssatz sollte die Gegenüberstellung von Bekenntnis und erkennbarer Bewährung syntaktisch klarer hervortreten.'
  terminology: „Vollkommen“, „Anfang und Ende des Lebens“, „wahre Vortrefflichkeit“ und „das Werk“ sind im gegebenen Rahmen vertretbar. „Wahre Vortrefflichkeit“ gibt die ethisch-qualitative Aussage wieder, ohne einen irreführenden Standesadel anzudeuten. Die Formel „Beide sind, wenn sie in Einheit bestehen, Gott“ wird nicht theologisch harmonisiert.
  issues:
  - severity: medium
    issue: Die Wendung „diejenigen, die sich zu Christus bekennen“ kann ein bloßes Bekenntnis zu Christus bezeichnen, während der englische Zeuge „profess to be Christ’s“ ausdrücklich eine beanspruchte Christuszugehörigkeit ausdrückt.
    rationale: „die sich dazu bekennen, Christus anzugehören“ bewahrt die Zugehörigkeitsnuance und bleibt modernes, natürliches Deutsch.
  - severity: low
    issue: „an ihren Taten zu erkennen sein“ ist unnötig umständlich.
    rationale: „an ihren Taten erkannt werden“ ist idiomatischer und gibt „will be recognized by their actions“ unmittelbar wieder.
  - severity: low
    issue: Der Schlusssatz „das Werk erweist sich nicht im bloßen Bekenntnis, sondern darin, dass …“ verschiebt die Aussage leicht in eine abstrakte Erklärung.
    rationale: „besteht nicht in …, sondern zeigt sich, wenn …“ bildet den im Zeugen gesetzten Kontrast zwischen Bekenntnis und sichtbarer Bewährung klarer ab.
  revised_text: 'Nichts davon bleibt euch verborgen, wenn ihr in eurem Glauben und eurer Liebe zu Jesus Christus vollkommen seid; denn sie sind Anfang und Ende des Lebens: Der Glaube ist der Anfang, die Liebe das Ende. Beide sind, wenn sie in Einheit bestehen, Gott; alles Übrige aber folgt ihnen auf dem Weg zu wahrer Vortrefflichkeit.


    Wer sich zum Glauben bekennt, sündigt nicht, und wer die Liebe besitzt, hasst nicht. An seiner Frucht wird der Baum erkannt; ebenso werden diejenigen, die sich dazu bekennen, Christus anzugehören, an ihren Taten erkannt werden. Denn das Werk besteht jetzt nicht in einem bloßen Bekenntnis, sondern zeigt sich, wenn jemand bis zum Ende in der Kraft des Glaubens befunden wird.[a]'
  revised_footnotes:
  - marker: a
    text: Diese Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus; besonders die Formulierungen „Beide … sind Gott“, „wahre Vortrefflichkeit“ und „das Werk“ sollten dabei überprüft werden.
    reason: Die bereitgestellten Daten enthalten keinen griechischen Wortlaut und kennzeichnen die quellensprachliche Prüfung ausdrücklich als ausstehend.
  revision_rationale: Die Revision behebt kleinere semantische und idiomatische Ungenauigkeiten, ohne die Bedeutung, den absoluten Duktus oder die absichtlich nicht harmonisierte theologische Aussage des Textzeugen zu verändern. Die vorhandene Vorläufigkeitsanmerkung und ihr Anker bleiben erhalten.
