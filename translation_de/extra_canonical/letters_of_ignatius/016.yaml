base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: de
  text: 'Es ist besser, zu schweigen und zu sein, als zu reden und nicht zu sein. Lehren ist etwas Gutes, wenn der Redende auch danach handelt. Nun gibt es den einen Lehrer, der sprach, und es geschah. Ja, auch was er schweigend getan hat, ist des Vaters würdig.


    Wer das Wort Jesu wirklich besitzt, vermag auch auf sein Schweigen zu hören, damit er vollkommen werde: damit er durch sein Reden handelt und durch sein Schweigen erkannt wird.


    Nichts ist dem Herrn verborgen; selbst unsere Geheimnisse sind ihm nahe. Lasst uns daher alles in dem Wissen tun, dass er in uns wohnt, damit wir seine Tempel seien und er selbst als unser Gott in uns sei. So ist es, und es wird auch vor unseren Augen offenbar werden durch die Liebe, die wir ihm in rechter Weise entgegenbringen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen der mittleren Rezension. Eine unmittelbare Prüfung am griechischen Text steht noch aus; besonders die genaue Fügung des Schlusssatzes sollte dabei überprüft werden.
    reason: Die bereitgestellten Metadaten kennzeichnen die direkte Prüfung der griechischen Überlieferung ausdrücklich als noch ausstehend; die Publikationsfassung muss diese quellenkritische Einschränkung transparent machen.
lexical_decisions:
- source_word: to keep silence and to be
  choice: zu schweigen und zu sein
  rationale: Bewahrt die zugespitzte Gegenüberstellung von Sein und bloßem Reden, ohne sie erklärend aufzulösen.
- source_word: if the speaker practice
  choice: wenn der Redende auch danach handelt
  rationale: Gibt den Gegensatz zwischen Lehre und gelebter Praxis in natürlichem modernem Deutsch wieder.
- source_word: one teacher
  choice: der eine Lehrer
  rationale: Der bestimmte Ausdruck bewahrt die christologische Einzigkeitsaussage des Textes.
- source_word: hearken unto His silence
  choice: auf sein Schweigen zu hören
  rationale: Bewahrt das absichtliche Paradox, statt es als bloßes Verstehen unausgesprochener Lehre zu deuten.
- source_word: possesseth the word of Jesus
  choice: das Wort Jesu wirklich besitzt
  rationale: Bleibt nahe an der überlieferten Formulierung und lässt offen, ob »Wort« Jesu Botschaft, Lehre oder eine umfassendere Wirklichkeit bezeichnet.
- source_word: temples
  choice: Tempel
  rationale: Der Plural und die kultische Bildsprache werden erhalten; eine Angleichung an den Singular »Tempel« als Gemeinschaft wird vermieden.
- source_word: rightly bear towards Him
  choice: ihm in rechter Weise entgegenbringen
  rationale: Bewahrt den normativen Sinn von »rightly«, ohne eine bestimmte Frömmigkeitsform einzutragen.
theological_decisions:
- issue: Bezug der Pronomen beim einen Lehrer
  choice: Kleinschreibung im Deutschen, aber eindeutiger Rückbezug auf »der eine Lehrer«
  alternative: Großschreibung der göttlichen Pronomen oder ausdrückliche Nennung »Jesus Christus«
  rationale: Der Zusammenhang legt Christus nahe, doch die Vorlage nennt ihn an dieser Stelle nicht erneut; die deutsche Standardschreibung vermeidet eine zusätzliche konfessionelle Markierung.
- issue: »worthy of the Father«
  choice: »des Vaters würdig«
  alternative: »vom Vater anerkannt« oder »dem Vater wohlgefällig«
  rationale: Die knappe, spannungsreiche Aussage wird formal bewahrt und nicht auf Anerkennung oder Wohlgefallen verengt.
- issue: Vollkommenheit
  choice: »damit er vollkommen werde«
  alternative: »damit er zur Reife gelangt«
  rationale: »Vollkommen« erhält die theologische und ethische Spannung des Ausdrucks; »Reife« wäre verständlicher, aber interpretierender.
- issue: Göttliches Wohnen im Menschen
  choice: »dass er in uns wohnt ... als unser Gott in uns sei«
  alternative: symbolische Abschwächung als bloße Gegenwart oder Wirksamkeit
  rationale: Die starke Tempel- und Einwohnungssprache der Vorlage wird nicht abgeschwächt oder systematisch präzisiert.
- issue: Schlusssatz und Erkenntnis durch Liebe
  choice: »es wird auch vor unseren Augen offenbar werden durch die Liebe«
  alternative: »wir werden es an unserer Liebe erkennen«
  rationale: Die etwas offene Beziehung zwischen göttlicher Einwohnung, Offenbarwerden und rechter Liebe bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper, sentenzenhafter Form. Paradoxe Wendungen wie »auf sein Schweigen hören« sowie die starke Tempel- und Einwohnungssprache bleiben erhalten. Archaismen werden vermieden; die Syntax folgt dennoch dem rhetorischen Rhythmus des frühchristlichen Schreibens.
