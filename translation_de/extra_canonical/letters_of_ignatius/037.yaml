review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt eng: „von Gott erfüllt“, „ermahnt“, „zu Gott gelange“, „Liebe in Gott“ und das Taubild bleiben erhalten. Da eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension laut Quelldaten noch aussteht, darf die vorliegende Prüfung keine griechisch-spezifischen Bedeutungsentscheidungen behaupten.'
  naturalness: 'Der Schlusssatz ist in der vorliegenden Fassung unnötig schwerfällig: „damit es der Gemeinde … geschenkt wird, … erquickt zu werden“ enthält ein unpersönliches „es“ und eine gehäufte Passiv-Infinitivkonstruktion. Eine Umformung zu „dass … Erquickung zuteilwird“ ist im modernen Standarddeutsch klarer und bewahrt die Aussage, dass die Erquickung der Gemeinde gewährt wird.'
  terminology: „Gemeinde“, „Glied“, „Liebe in Gott“, „Gebet“ und „Erquickung“ sind im Kontext angemessen. „Erquickung“ wahrt den gehobenen, bildhaften Charakter des Zeugen; „inständig“ gibt „fervent“ gut wieder. Die Formulierung „gemeinsames Gebet“ kann für „united prayer“ beibehalten werden, ohne eine weitergehende institutionelle oder dogmatische Deutung einzutragen.
  issues:
  - severity: low
    issue: Unnatürliche und missverständliche Satzfügung im letzten Teilsatz
    rationale: Das unpersönliche „es“ hat keinen klaren Bezugsgegenstand, und „geschenkt wird, … erquickt zu werden“ wirkt im Deutschen syntaktisch überladen. „… dass der Gemeinde in Syrien durch den Tau eures inständigen Gebets Erquickung zuteilwird“ ist idiomatisch und erhält die gewährte, nicht näher spezifizierte Gabe.
  revised_text: Da ich weiß, dass ihr von Gott erfüllt seid, habe ich euch nur kurz ermahnt. Denkt in euren Gebeten an mich, damit ich zu Gott gelange. Denkt auch an die Gemeinde in Syrien, deren Glied genannt zu werden ich nicht würdig bin. Denn ich brauche euer gemeinsames Gebet und eure Liebe in Gott, damit der Gemeinde in Syrien durch den Tau eures inständigen Gebets Erquickung zuteilwird.[a]
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus.
    reason: Die bereitgestellten Quelldaten kennzeichnen den englischen Zeugen ausdrücklich als vorläufige Grundlage und die Prüfung der griechischen Überlieferung als noch ausstehend.
  revision_rationale: Die Revision beschränkt sich auf eine sichere stilistisch-syntaktische Glättung des letzten Satzes. Sie wahrt die passive bzw. gewährte Perspektive des Textzeugen, das Taubild und die Offenheit hinsichtlich dessen, von wem die Erquickung gewährt wird. Der vorhandene Fußnotenanker und sein Hinweis auf die noch ausstehende griechische Prüfung bleiben erforderlich und korrekt verknüpft.
