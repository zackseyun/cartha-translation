base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: de
  text: Da ich weiß, dass ihr von Gott erfüllt seid, habe ich euch nur kurz ermahnt. Denkt in euren Gebeten an mich, damit ich zu Gott gelange. Denkt auch an die Gemeinde in Syrien, deren Glied genannt zu werden ich nicht würdig bin. Denn ich brauche euer gemeinsames Gebet und eure Liebe in Gott, damit es der Gemeinde in Syrien geschenkt wird, durch den Tau eures inständigen Gebets erquickt zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus.
    reason: Die bereitgestellten Quelldaten kennzeichnen den englischen Zeugen ausdrücklich als vorläufige Grundlage und die Prüfung der griechischen Überlieferung als noch ausstehend.
lexical_decisions:
- source_word: full of God
  choice: von Gott erfüllt
  rationale: Bewahrt die starke theologische Bildsprache des englischen Zeugen in natürlichem modernem Deutsch, ohne sie weiter auszudeuten.
- source_word: exhorted
  choice: ermahnt
  rationale: Gibt den auffordernden und zugleich seelsorgerlichen Charakter genauer wieder als das schwächere „ermutigt“.
- source_word: attain unto God
  choice: zu Gott gelange
  rationale: Erhält die zielgerichtete, im Zusammenhang vermutlich auf das Martyrium bezogene Formulierung, ohne diese Deutung ausdrücklich in den Text einzutragen.
- source_word: member
  choice: Glied
  rationale: „Glied der Gemeinde“ ist im kirchlichen Zusammenhang würdig und idiomatisch und bewahrt die organische Konnotation.
- source_word: refreshed by the dew
  choice: durch den Tau … erquickt
  rationale: Bewahrt das poetische Taubild und dessen belebende Wirkung.
- source_word: fervent supplication
  choice: inständiges Gebet
  rationale: „Inständig“ vermittelt Ernst und Nachdruck; „Gebet“ vermeidet ein unnötig altertümliches „Flehen“.
theological_decisions:
- issue: Bedeutung von „zu Gott gelangen“
  choice: Die offene Zielformulierung wird beibehalten.
  alternative: „durch das Martyrium zu Gott gelangen“
  rationale: Der Zusammenhang kann auf Ignatius’ erwartetes Martyrium weisen, doch der vorliegende Wortlaut nennt es nicht ausdrücklich; die Spannung darf nicht aufgelöst werden.
- issue: „Liebe in Gott“
  choice: Liebe in Gott
  alternative: göttliche Liebe
  rationale: Die präpositionale Wendung bleibt erhalten, weil sie sowohl den Grund als auch den Bereich der Liebe bezeichnen kann; „göttliche Liebe“ würde stärker interpretieren.
- issue: Wirksamkeit des gemeinsamen Gebets für die Gemeinde in Syrien
  choice: „damit es … geschenkt wird“
  alternative: „damit ihr … Erquickung verschafft“
  rationale: Die passive Form wahrt, dass die Erquickung als gewährte Gabe erscheint, ohne den Handelnden ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gemeindlichem „ihr“. Die Bildsprache und theologische Offenheit des Textzeugen wurden bewahrt; unnötige Archaismen wurden vermieden.
