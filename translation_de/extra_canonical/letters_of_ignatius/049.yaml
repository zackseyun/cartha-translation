review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird gut getroffen: Die Gegner behaupten ein nur scheinbares Leiden Christi, und Ignatius antwortet mit dem Verweis auf seine Fesselung, seinen Wunsch zum Kampf mit wilden Tieren und seinen Tod. Gegenüber dem überlieferten griechischen Wortlaut ist jedoch die Schlussaussage genauer als „gegen den Herrn lügen“ wiederzugeben. „Ein falsches Zeugnis ablegen“ führt ein forensisches Element ein, das der knappe Ausdruck ψεύδομαι κατὰ τοῦ κυρίου nicht ausdrücklich enthält. Auch „wahrhaftig“ entspricht nicht der folgernden Partikel ἄρα („also/folglich“).'
  naturalness: Das Deutsch ist insgesamt klar und angemessen nachdrücklich. „Warum bin ich dann in Fesseln?“ ist für die Zustandsaussage δέδεμαι unmittelbarer und idiomatischer als „Warum trage ich dann Fesseln?“. Die umgestellte Konditionalkonstruktion macht zudem den Umfang von „wie ... sagen“ klarer.
  terminology: „gottlose Menschen – das heißt Ungläubige“, „nur zum Schein gelitten“ und „bloßer Schein“ bewahren sowohl die polemische Benennung als auch das Wortspiel des Textes. „Herr“ ist als Wiedergabe von κύριος beizubehalten. Die Übersetzung vermeidet zu Recht eine zusätzliche dogmengeschichtliche Etikettierung.
  issues:
  - severity: medium
    issue: „wahrhaftig“ und „ein falsches Zeugnis gegen den Herrn ablegen“ in der Schlusssatzübersetzung
    rationale: Das griechische ἄρα ist inferenziell („also“, „folglich“), nicht affirmativ im Sinn von „wahrhaftig“. ψεύδομαι κατὰ τοῦ κυρίου bedeutet direkt „gegen den Herrn lügen“; „falsches Zeugnis ablegen“ konkretisiert die Aussage unnötig als Zeugenaussage.
  - severity: low
    issue: „Warum trage ich dann Fesseln?“
    rationale: Die zugrunde liegende Formulierung bezeichnet primär Ignatius’ Gefesseltsein. „Warum bin ich dann in Fesseln?“ gibt diesen Zustand natürlicher und genauer wieder.
  revised_text: Wenn er aber, wie gewisse gottlose Menschen – das heißt Ungläubige – behaupten, nur zum Schein gelitten hat, während sie selbst bloßer Schein sind, warum bin ich dann in Fesseln? Und warum wünsche ich mir auch, mit wilden Tieren zu kämpfen? Dann sterbe ich vergeblich. Dann lüge ich also gegen den Herrn.
  revised_footnotes: []
