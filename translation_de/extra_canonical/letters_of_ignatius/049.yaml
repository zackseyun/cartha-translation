base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: de
  text: Wenn er aber, wie gewisse gottlose Menschen – das heißt Ungläubige – behaupten, nur zum Schein gelitten hat, während sie selbst bloßer Schein sind, warum bin ich dann in Fesseln? Und warum wünsche ich mir auch, mit wilden Tieren zu kämpfen? Dann sterbe ich vergeblich. Dann lüge ich also gegen den Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless, that is unbelievers
  choice: gottlose Menschen – das heißt Ungläubige
  rationale: Bewahrt die ausdrückliche Gleichsetzung des Zeugen und formuliert sie in natürlichem, würdevollem Deutsch.
- source_word: suffered only in semblance
  choice: nur zum Schein gelitten hat
  rationale: Gibt die doketische Behauptung klar wieder, ohne zusätzliche dogmengeschichtliche Terminologie einzuführen.
- source_word: being themselves mere semblance
  choice: während sie selbst bloßer Schein sind
  rationale: Erhält Ignatius’ zugespitztes Wortspiel zwischen dem vermeintlichen Scheinleiden Christi und der Unwirklichkeit seiner Gegner.
- source_word: in bonds
  choice: trage ich dann Fesseln
  rationale: Das idiomatische Bild bewahrt die konkrete Gefangenschaft und klingt im Deutschen natürlicher als eine rein örtliche Formulierung.
- source_word: fight with wild beasts
  choice: mit wilden Tieren zu kämpfen
  rationale: Bewahrt das konkrete Bild des Kampfes in der Arena, ohne es interpretierend auszuweiten.
- source_word: I die in vain
  choice: Dann sterbe ich vergeblich
  rationale: Gibt die Folgerung knapp und mit dem argumentativen Gewicht des Zeugen wieder.
- source_word: I lie against the Lord
  choice: lege ich wahrhaftig ein falsches Zeugnis gegen den Herrn ab
  rationale: Macht den relationalen Sinn von „gegen den Herrn lügen“ in verständlichem Deutsch deutlich, ohne die Aussage zu verharmlosen.
theological_decisions:
- issue: Wirklichkeit des Leidens Christi
  choice: „nur zum Schein gelitten“ als zurückgewiesene Behauptung
  alternative: „scheinbar gelitten“
  rationale: Die gewählte Formulierung erhält den Gegensatz zwischen wirklichem Leiden und bloßem Anschein und lässt Ignatius’ Argument unverändert stehen.
- issue: Selbstbeschreibung des möglichen Todes
  choice: „Dann sterbe ich vergeblich“
  alternative: „Dann sterbe ich für nichts“
  rationale: „Vergeblich“ bewahrt den Sinn der Nichtigkeit beziehungsweise Zwecklosigkeit, ohne festzulegen, ob ausschließlich Märtyrertod, Heilsertrag oder Zeugniswirkung gemeint ist.
- issue: Falschaussage über den Herrn
  choice: „ein falsches Zeugnis gegen den Herrn ablegen“
  alternative: „gegen den Herrn lügen“
  rationale: Die Formulierung bewahrt den Vorwurf einer gegen den Herrn gerichteten Unwahrheit und ist zugleich natürliches modernes Deutsch; sie fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, nachdrücklichem Ton. Die rhetorischen Fragen und die scharfe Ironie des Abschnitts bleiben erhalten. Da die direkte Prüfung des griechischen Ausgangstextes noch aussteht, folgt der Entwurf vorsichtig dem angegebenen öffentlichen englischen Zeugen; echte Mehrdeutigkeiten werden nicht durch zusätzliche Fachbegriffe aufgelöst.
