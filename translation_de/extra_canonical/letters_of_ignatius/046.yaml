    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: de
  text: 'Seid daher vor solchen Menschen auf der Hut. So wird es gewiss sein, wenn ihr euch nicht überhebt und untrennbar mit [Gott][a] Jesus Christus, mit dem Bischof und mit den Anordnungen der Apostel verbunden bleibt.



    Wer innerhalb des Altars ist, ist rein; wer aber außerhalb des Altars ist, ist nicht rein. Das heißt: Wer etwas ohne den Bischof, das Presbyterium und die Diakone tut, dessen Gewissen ist nicht rein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Überlieferung ist bei „[Gott]“ unsicher; die Klammern bewahren dieses Textsignal. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die bereitgestellte Grundlage kennzeichnet „[Gott]“ als unsichere Lesart; diese Unsicherheit darf in der deutschen Übersetzung nicht verdeckt werden.
lexical_decisions:
- source_word: be ... on your guard
  choice: seid ... auf der Hut
  rationale: Eine natürliche, zugleich eindringliche deutsche Wiedergabe der Warnung.
- source_word: puffed up
  choice: euch ... überhebt
  rationale: Bewahrt den Gedanken hochmütiger Selbstüberhebung, ohne unnötig altertümlich zu klingen.
- source_word: inseparable from
  choice: untrennbar mit ... verbunden bleibt
  rationale: Macht die fortdauernde enge Bindung im Deutschen idiomatisch deutlich.
- source_word: ordinances of the Apostles
  choice: Anordnungen der Apostel
  rationale: Gibt den normativen Sinn wieder, ohne den Ausdruck auf eine bestimmte spätere kirchenrechtliche Kategorie festzulegen.
- source_word: sanctuary
  choice: Heiligtum
  rationale: Erhält die kultisch-räumliche Metapher und vermeidet eine vorschnelle Gleichsetzung mit einem konkreten Kirchengebäude.
- source_word: presbytery
  choice: Presbyterium
  rationale: Bezeichnet hier das kollegiale Gremium der Presbyter und wahrt den frühkirchlichen Amtsbezug.
- source_word: clean in his conscience
  choice: dessen Gewissen ist nicht rein
  rationale: Bewahrt die Reinheitssprache und ihren ausdrücklichen Bezug auf das Gewissen.
theological_decisions:
- issue: Textsignal bei [Gott] vor Jesus Christus
  choice: Die eckigen Klammern um [Gott] werden beibehalten.
  alternative: „Gott Jesus Christus“ ohne Klammern oder Weglassung von „Gott“
  rationale: Die Vorlage kennzeichnet das Wort als textkritisch unsicher; die Übersetzung darf diese Unsicherheit nicht stillschweigend auflösen.
- issue: Verhältnis von Heiligtumsmetapher und kirchlichen Ämtern
  choice: Die Metapher bleibt stehen und wird anschließend durch Ignatius’ eigene Erläuterung entfaltet.
  alternative: Das „Heiligtum“ unmittelbar als institutionelle Kirche paraphrasieren
  rationale: So bleibt die Bildsprache samt ihrer theologischen Spannung erhalten, ohne mehr zu bestimmen, als der überlieferte Text sagt.
- issue: Handeln ohne Bischof, Presbyterium und Diakone
  choice: „Wer etwas ohne ... tut“
  alternative: „Wer eigenmächtig gegen ... handelt“
  rationale: Die engere Formulierung vermeidet es, Opposition oder Ungehorsam ausdrücklich einzutragen, obwohl die Aussage eine starke gemeinschaftliche Bindung voraussetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die frühkirchlichen Amtsbegriffe „Bischof“, „Presbyterium“ und „Diakone“ sowie die kultische Metapher „Heiligtum“ werden bewusst erhalten. Da die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, ist die Fassung als quellennahe, aber vorläufige Übersetzung auf Grundlage der angegebenen gemeinfreien englischen Zeugin zu verstehen.
