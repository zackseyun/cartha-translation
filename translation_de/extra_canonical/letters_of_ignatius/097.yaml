review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung nötig. Der Entwurf folgt dem englischen Zeugen meist zuverlässig, gibt aber zwei griechisch relevante Wendungen zu eng beziehungsweise unzutreffend wieder: ἀμέριμνος ἐν θεῷ meint eher „in Gott ohne Sorge“ als dass Gott die Sorge aktiv weggenommen habe; σχολάζει τῷ θεῷ bezeichnet Hingabe/Verfügbarkeit für Gott, nicht das Zur-Verfügung-Stellen von Zeit. τὸ θερμὸν τῆς ἀληθείας sollte den Bezug zur „Wahrheit“ behalten.'
  naturalness: Der Ton ist überwiegend gutes modernes Standarddeutsch. „einen Gott wohlgefälligen Rat“ ist jedoch unidiomatisch; „eine gottgefällige Versammlung“ ist klarer. „jemanden …, der euch besonders lieb … ist“ ist missverständlich und wird besser als „einen, der euch besonders lieb ist“ formuliert.
  terminology: „Gemeinde“, „Fürbitte“, „Jünger“ und „Gottesbote“ sind tragfähig. „Gottesbote“ bleibt eine verständliche Wiedergabe der zugespitzten Botenbezeichnung θεοδρόμος. Die Wendung „die Glut eurer Wahrheit“ bewahrt die griechische Bildsprache und den Begriff ἀλήθεια, ohne ihn konfessionell aufzuladen.
  issues:
  - severity: medium
    issue: „seit Gott mir die Sorge genommen hat“
    rationale: Die zugrunde liegende Wendung ist als „ohne Sorge/in Gott sorgenfrei seiend“ zu verstehen. Die deutsche Formulierung macht daraus eine ausdrücklich kausative Handlung Gottes, die im Wortlaut nicht nötig ist.
  - severity: high
    issue: „stellt seine Zeit Gott zur Verfügung“
    rationale: χολάζει τῷ θεῷ bezieht sich auf die Person und ihre ungeteilte Verfügbarkeit bzw. Hingabe an Gott, nicht spezifisch auf Zeit.
  - severity: medium
    issue: „die Glut eurer aufrichtigen Gesinnung“
    rationale: Die griechische Überlieferung enthält „Wahrheit“ (ἀλήθεια); „aufrichtige Gesinnung“ interpretiert und ersetzt diesen Schlüsselbegriff.
  - severity: low
    issue: „einen Gott wohlgefälligen Rat“
    rationale: Die Konstruktion ist im heutigen Deutsch nicht natürlich; außerdem bezeichnet der Kontext eine einzuberufende Versammlung bzw. Beratung.
  revised_text: 'Da mir berichtet wurde, dass die Gemeinde in Antiochia in Syrien durch eure Gebete Frieden hat, bin auch ich umso mehr getröstet, da ich in Gott ohne Sorge bin – wenn ich nur durch das Leiden zu Gott gelange, damit ich durch eure Fürbitte als Jünger erfunden werde.


    Dir, hochseliger Polykarp, steht es zu, eine gottgefällige Versammlung einzuberufen und einen aus eurer Mitte auszuwählen, der euch besonders lieb und zugleich eifrig ist und geeignet ist, den Namen »Gottesbote« zu tragen. Beauftrage ihn, nach Syrien zu reisen und dort eure eifrige Liebe zur Ehre Gottes kundzutun.


    Ein Christ verfügt nicht über sich selbst, sondern steht Gott zur Verfügung. Dies ist Gottes Werk und auch eures, wenn ihr es vollendet. Denn ich vertraue auf die göttliche Gnade, dass ihr zu einer guten Tat bereit seid, die Gottes würdig ist. Weil ich die Glut eurer Wahrheit kenne, habe ich euch in einem kurzen Brief ermahnt.[a]'
  revised_footnotes:
  - marker: a
    text: Diese Übersetzung ist vorläufig. Sie folgt dem überlieferten englischen Textzeugen; eine unmittelbare Prüfung der griechischen Handschriftentradition steht noch aus.
    reason: Die bereitgestellte Quellengrundlage kennzeichnet die Prüfung des mittelrezensionellen griechischen Textes ausdrücklich als noch ausstehend; die Einschränkung muss für die Veröffentlichung transparent bleiben.
  revision_rationale: Die Änderungen stellen die griechisch naheliegenden Bedeutungen von „in Gott ohne Sorge“, der ungeteilten Verfügbarkeit für Gott und der „Wahrheit“ wieder her. Zugleich werden zwei unnatürliche deutsche Formulierungen geglättet. Die bedingte, demütige Hoffnung des Verfassers sowie die Spannung zwischen Gottes Werk und dem Handeln der Gemeinde bleiben unverändert erhalten.
