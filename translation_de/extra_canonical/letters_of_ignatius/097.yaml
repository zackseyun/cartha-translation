base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: de
  text: 'Da mir berichtet wurde, dass die Gemeinde in Antiochia in Syrien durch eure Gebete Frieden hat, bin auch ich umso mehr getröstet, seit Gott mir die Sorge genommen hat – sofern ich durch mein Leiden zu Gott gelangen darf, damit ich durch eure Fürbitte als Jünger erfunden werde.


    Dir, hochseliger Polykarp, kommt es zu, einen Gott wohlgefälligen Rat einzuberufen und jemanden aus eurer Mitte auszuwählen, der euch besonders lieb und zugleich eifrig ist. Er soll geeignet sein, den Namen »Gottesbote« zu tragen. Beauftrage ihn, nach Syrien zu reisen und dort eure eifrige Liebe zur Ehre Gottes kundzutun.


    Ein Christ verfügt nicht über sich selbst, sondern stellt seine Zeit Gott zur Verfügung. Dies ist Gottes Werk und auch eures, wenn ihr es vollendet. Denn im Vertrauen auf die göttliche Gnade bin ich überzeugt, dass ihr zu einer guten Tat bereit seid, die Gottes würdig ist. Weil ich die Glut eurer aufrichtigen Gesinnung kenne, habe ich euch in einem kurzen Brief ermahnt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung ist vorläufig. Sie folgt dem überlieferten englischen Textzeugen; eine unmittelbare Prüfung der griechischen Handschriftentradition steht noch aus.
    reason: Die bereitgestellte Quellengrundlage kennzeichnet die Prüfung des mittelrezensionellen griechischen Textes ausdrücklich als noch ausstehend; die Einschränkung muss für die Veröffentlichung transparent bleiben.
lexical_decisions:
- source_word: ἡ ἐκκλησία ἡ οὖσα ἐν Ἀντιοχείᾳ τῆς Συρίας (reconstructed underlying Greek)
  choice: die Gemeinde in Antiochia in Syrien
  rationale: „Gemeinde“ ist im modernen Deutsch natürlich und bewahrt den konkreten örtlichen Bezug von ekklēsia.
- source_word: εἰς θεὸν ἐπιτυχεῖν (reconstructed underlying Greek)
  choice: zu Gott gelangen
  rationale: Bewahrt Ignatius’ charakteristische, theologisch gespannte Formulierung, ohne sie als bloßes Sterben oder als sicheren Heilsanspruch auszudeuten.
- source_word: θεοδρόμος (likely underlying Greek)
  choice: Gottesbote
  rationale: Die englische Wiedergabe „God’s courier“ weist auf eine zugespitzte Bezeichnung für den entsandten Überbringer hin; „Gottesbote“ klingt würdig und verständlich.
- source_word: σχολάζει τῷ θεῷ (likely underlying Greek)
  choice: stellt seine Zeit Gott zur Verfügung
  rationale: Gibt den Gedanken wieder, für Gott frei bzw. verfügbar zu sein, ohne das missverständliche moderne „Freizeit“ zu verwenden.
- source_word: τὸ θερμὸν τῆς ἀληθείας ὑμῶν (reconstructed underlying Greek)
  choice: die Glut eurer aufrichtigen Gesinnung
  rationale: Bewahrt sowohl die Wärme bzw. den Eifer als auch den Gedanken der Echtheit oder Lauterkeit.
theological_decisions:
- issue: Ignatius’ Hoffnung, durch Leiden zu Gott zu gelangen
  choice: „sofern ich durch mein Leiden zu Gott gelangen darf“
  alternative: „wenn ich durch mein Leiden Gott erreiche“
  rationale: Die bedingte Form wahrt seine demütige Ungewissheit und macht aus dem Leiden weder automatisch ein Verdienst noch eine garantierte Heilsursache.
- issue: Fürbitte und Jüngerschaft
  choice: „damit ich durch eure Fürbitte als Jünger erfunden werde“
  alternative: „damit ich dank eurer Fürbitte ein Jünger werde“
  rationale: „Als Jünger erfunden werden“ erhält den prüfenden, eschatologisch offenen Klang und vermeidet die Aussage, die Fürbitte erzeuge unmittelbar seine Jüngerschaft.
- issue: Verhältnis von Gottes Werk und menschlichem Handeln
  choice: „Dies ist Gottes Werk und auch eures“
  alternative: „Dies ist sowohl Gottes als auch euer Werk“
  rationale: Die Spannung zwischen göttlichem Wirken und menschlicher Mitwirkung bleibt stehen, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, brieflichem Ton. Archaismen wie „habet“, „euch geziemt“ oder „Fürsprache“ wurden vermieden, während ignatianische Leitformulierungen und ihre theologische Spannung erhalten blieben. Polykarp wird im Singular, die Gemeinde im Plural angeredet.
