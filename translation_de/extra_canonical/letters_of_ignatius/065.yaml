    reason: Die Quellenangabe erklärt ausdrücklich, dass die direkte Prüfung der griechischen Überlieferung noch aussteht; besonders die wiederholte Charakterbezeichnung sollte deshalb nicht mit falscher lexikalischer Sicherheit präsentiert werden.
  revision_rationale: Die Überarbeitung entfernt eine nicht ausdrücklich bezeugte Aussage über „Vollmacht“, glättet die Anrede und stellt das musikalische Bild sowie den Bezug der abschließenden Charakterbeschreibung genauer wieder her. Die Vorläufigkeitsfußnote bleibt unverändert, da eine unmittelbare Prüfung des griechischen Textes weiterhin aussteht.
