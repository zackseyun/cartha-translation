    whose silence is more powerful than others speech. For he is attuned in harmony with the commandments, as a lyre with its strings. Wherefore my soul blesseth his godly mind, for I have found that it is virtuous and perfect--even the imperturbable and calm temper which he hath, while living in all godly forbearance.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: de
  text: 'Ich habe festgestellt, dass dieser euer Bischof den Dienst für das Gemeinwohl nicht aus eigener Vollmacht oder durch Menschen und auch nicht aus eitler Ruhmsucht innehat, sondern in der Liebe Gottes, des Vaters, und des Herrn Jesus Christus. Ich staune über seine Geduld: Sein Schweigen ist kraftvoller als das Reden anderer. Denn er stimmt mit den Geboten harmonisch überein wie eine Leier mit ihren Saiten. Darum preist meine Seele seine gottgefällige Gesinnung; denn ich habe erkannt, dass sie tugendhaft und vollkommen ist – ebenso seine unerschütterliche und ruhige Haltung, mit der er in aller gottgefälligen Geduld lebt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung ist vorläufig, da für diesen Entwurf nur das angegebene gemeinfreie englische Übersetzungszeugnis ausgewertet werden konnte; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus. Das mit „Geduld“ wiedergegebene Wort kann je nach griechischem Befund auch „Langmut“ oder „Nachsicht“ bedeuten.
    reason: Die Quellenangabe erklärt ausdrücklich, dass die direkte Prüfung der griechischen Überlieferung noch aussteht; besonders die wiederholte Charakterbezeichnung sollte deshalb nicht mit falscher lexikalischer Sicherheit präsentiert werden.
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: Dienst für das Gemeinwohl
  rationale: Bewahrt sowohl den Amts- bzw. Dienstcharakter als auch die Ausrichtung auf das gemeinsame Wohl, ohne eine moderne Verwaltungsbezeichnung einzutragen.
- source_word: not of himself or through men
  choice: nicht aus eigener Vollmacht oder durch Menschen
  rationale: Gibt die doppelte Verneinung der Herkunft bzw. Beauftragung wieder und vermeidet die missverständliche Lesart, der Bischof handle überhaupt nicht persönlich oder mit menschlicher Mitwirkung.
- source_word: vain glory
  choice: eitle Ruhmsucht
  rationale: Bezeichnet das Streben nach leerem persönlichem Ansehen in natürlichem, würdigem Deutsch.
- source_word: forbearance / patience
  choice: Geduld
  rationale: Passt an beiden Stellen zum bezeugten Charakterzug; mögliche Bedeutungsnuancen wie Langmut oder Nachsicht bleiben durch die Fußnote kenntlich.
- source_word: godly mind
  choice: gottgefällige Gesinnung
  rationale: Vermeidet das im heutigen Deutsch missverständliche „göttlicher Geist“ und bezeichnet eine auf Gott ausgerichtete innere Haltung.
- source_word: imperturbable and calm temper
  choice: unerschütterliche und ruhige Haltung
  rationale: Gibt emotionale Festigkeit und Gelassenheit idiomatisch wieder, ohne philosophische Fachsprache aufzudrängen.
theological_decisions:
- issue: Ursprung oder Legitimation des bischöflichen Dienstes
  choice: nicht aus eigener Vollmacht oder durch Menschen
  alternative: nicht von sich selbst oder durch Menschen
  rationale: Die Formulierung wahrt die Spannung zwischen nichtmenschlicher Berufung und menschlicher Amtsausübung, ohne eine bestimmte Lehre von Ordination oder Sukzession festzuschreiben.
- issue: Beschreibung der inneren Haltung als „godly“
  choice: gottgefällig
  alternative: göttlich
  rationale: „Gottgefällig“ bezeichnet Frömmigkeit bzw. Ausrichtung auf Gott und vermeidet die Aussage, die menschliche Gesinnung selbst sei göttlicher Natur.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, frühchristlichem Briefstil. Der bildhafte Vergleich mit der Leier bleibt erhalten. Satzbau und Zeichensetzung wurden für heutige Leser geglättet, ohne die argumentativen Verknüpfungen und Wiederholungen aufzugeben.
