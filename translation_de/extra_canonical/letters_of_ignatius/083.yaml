revisions:
- from: 'Wer also der guten Gabe Gottes widerspricht, geht an seinen Streitfragen zugrunde. Es wäre jedoch gut für sie, Liebe zu haben, damit auch sie auferstehen.


    Darum ist es richtig, dass ihr euch von solchen Menschen fernhaltet und weder unter vier Augen noch öffentlich über sie sprecht. Richtet eure Aufmerksamkeit vielmehr auf die Propheten und besonders auf das Evangelium: Darin wird uns das Leiden vor Augen gestellt und die Auferstehung vollendet.'
  to: 'Diejenigen also, die der Gnade Gottes widersprechen, gehen durch ihre Überlegungen zugrunde. Es wäre jedoch gut für sie, zu lieben, damit auch sie auferstehen.


    Darum ist es richtig, dass ihr euch von solchen Menschen fernhaltet und weder unter vier Augen noch öffentlich über sie sprecht. Richtet eure Aufmerksamkeit vielmehr auf die Propheten und besonders auf das Evangelium, in dem uns das Leiden offenbar geworden ist und die Auferstehung vollendet worden ist.'
  rationale: Die Revision folgt, soweit anhand des mittelrezensionellen griechischen Wortlauts prüfbar, der Quelle vor der englischen Audit-Fassung. Sie ersetzt die aus dem englischen Zeugen übernommene Umschreibung „gute Gabe“ durch „Gnade“, behebt den Numerusfehler und bildet die griechischen Perfektpassive im Schlusssatz ab. Der Bezug der Gnade und die Bedeutung der Auferstehung werden nicht weiter ausgelegt.
