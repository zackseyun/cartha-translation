base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: de
  text: 'Diejenigen also, die der Gnade Gottes widersprechen, gehen durch ihre Überlegungen zugrunde. Es wäre jedoch gut für sie, zu lieben, damit auch sie auferstehen.


    Darum ist es richtig, dass ihr euch von solchen Menschen fernhaltet und weder unter vier Augen noch öffentlich über sie sprecht. Richtet eure Aufmerksamkeit vielmehr auf die Propheten und besonders auf das Evangelium, in dem uns das Leiden offenbar geworden ist und die Auferstehung vollendet worden ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: widerspricht
  rationale: Gibt den Widerstand gegen Gottes Gabe klar und würdig wieder, ohne die Aussage unnötig auf ein bloßes Leugnen zu verengen.
- source_word: good gift of God
  choice: gute Gabe Gottes
  rationale: Bewahrt die schlichte, theologisch offene Formulierung des Zeugnisses.
- source_word: questionings
  choice: Streitfragen
  rationale: Erfasst den polemischen Zusammenhang besser als das neutrale „Fragen“, ohne sicher vorausgesetzten griechischen Wortlaut zu überpräzisieren.
- source_word: passion
  choice: Leiden
  rationale: Natürliches modernes Deutsch für das Leiden Christi; vermeidet das heute missverständliche Fremdwort „Passion“.
- source_word: is shown unto us
  choice: wird uns vor Augen gestellt
  rationale: Gibt den präsentierenden Sinn idiomatisch und anschaulich wieder.
- source_word: is accomplished
  choice: wird ... vollendet
  rationale: Bewahrt die auffällige passivische Aussage und ihre theologische Spannung.
theological_decisions:
- issue: Bezug der „guten Gabe Gottes“
  choice: Die Wendung bleibt ohne nähere Bestimmung stehen.
  alternative: Die Gabe ausdrücklich als Eucharistie, Gnade oder Christus identifizieren.
  rationale: Der vorgelegte Text benennt die Gabe nicht ausdrücklich; eine konfessionelle oder kontextuelle Festlegung wäre ohne direkte griechische Prüfung zu weitgehend.
- issue: „damit auch sie auferstehen“
  choice: Die Aussage wird unverändert auf die Gegner bezogen und nicht erklärt.
  alternative: Sie als geistliche Umkehr oder ausschließlich als endzeitliche Auferstehung auslegen.
  rationale: Die mögliche soteriologische und eschatologische Spannung soll erhalten bleiben.
- issue: „die Auferstehung wird vollendet“
  choice: Die ungewöhnliche Formulierung wird formal bewahrt.
  alternative: „die Auferstehung wird verkündet/berichtet“ oder „hat sich erfüllt“.
  rationale: Das englische Zeugnis unterscheidet bewusst zwischen dem dargestellten Leiden und der vollendeten Auferstehung; diese Spannung darf nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Wegen der noch ausstehenden Prüfung des griechischen Ausgangstextes bleibt die Fassung eng am öffentlichen englischen Zeugen und vermeidet unnötige lexikalische oder konfessionelle Festlegungen.
