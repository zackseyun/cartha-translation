base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: de
  text: Dies sage ich, meine innig Geliebten, nicht weil ich erfahren hätte, dass jemand von euch so denkt. Vielmehr möchte ich, der ich geringer bin als jeder von euch, dass ihr euch rechtzeitig in Acht nehmt, damit ihr nicht in die Schlingen einer nichtigen Lehre geratet. Seid vielmehr völlig gewiss hinsichtlich der Geburt, des Leidens und der Auferstehung – der Auferstehung, die zur Zeit der Statthalterschaft des Pontius Pilatus geschah.[a] Denn dies alles wurde durch Jesus Christus, unsere Hoffnung, wahrhaftig und gewiss vollbracht. Möge sich keiner von euch von dieser Hoffnung abbringen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Relativsatz „die … geschah“ bezieht sich der griechischen Satzform nach wahrscheinlich auf die Auferstehung. Die zugrunde liegende ältere englische Übersetzung kann dagegen so verstanden werden, als beziehe sich die Zeitangabe auf Geburt, Leiden und Auferstehung zusammen. Eine abschließende Prüfung am griechischen Text steht noch aus.
    reason: Kennzeichnet eine syntaktisch und historisch bedeutsame Abweichung von der bereitgestellten englischen Zeugenübersetzung und macht den vorläufigen Stand der Quellenprüfung transparent.
lexical_decisions:
- source_word: my dearly beloved
  choice: meine innig Geliebten
  rationale: Bewahrt die herzliche Anrede in würdigem, noch heute verständlichem Deutsch.
- source_word: being less than any of you
  choice: der ich geringer bin als jeder von euch
  rationale: Gibt die ausdrückliche Selbsterniedrigung wieder, ohne sie psychologisch umzudeuten.
- source_word: snares of vain doctrine
  choice: Schlingen einer nichtigen Lehre
  rationale: „Schlingen“ erhält das Bild der Falle; „nichtig“ bezeichnet die Lehre als gehaltlos und irreführend, ohne eine bestimmte Irrlehre einzutragen.
- source_word: be fully persuaded
  choice: seid völlig gewiss
  rationale: Natürliches modernes Deutsch für eine feste, vollständige Überzeugung.
- source_word: passion
  choice: Leiden
  rationale: Im christologischen Zusammenhang bezeichnet der Ausdruck Jesu Leiden; „Passion“ wäre weniger allgemeinverständlich.
- source_word: our hope
  choice: unsere Hoffnung
  rationale: Bewahrt die unmittelbare christologische Bezeichnung und ihre theologische Dichte.
theological_decisions:
- issue: Bezug der Zeitangabe auf Geburt, Leiden und Auferstehung
  choice: Die Zeitangabe wird unmittelbar auf die Auferstehung bezogen.
  alternative: Die Zeitangabe auf Geburt, Leiden und Auferstehung insgesamt beziehen.
  rationale: Die überlieferte griechische Syntax der mittleren Rezension lässt den Relativsatz grammatisch am ehesten „Auferstehung“ bestimmen; zugleich vermeidet diese Wiedergabe die historisch problematische Aussage, Jesu Geburt sei unter der Statthalterschaft des Pontius Pilatus geschehen. Da die bereitgestellte Datengrundlage eine direkte griechische Prüfung noch als ausstehend bezeichnet, wird die Entscheidung in einer Fußnote offengelegt.
- issue: Art der geschichtlichen Bekräftigung
  choice: „wahrhaftig und gewiss vollbracht“
  alternative: „wirklich und sicher geschehen“
  rationale: Bewahrt sowohl die Behauptung tatsächlichen Geschehens als auch die nachdrückliche Gewissheit, ohne die christologische Spannung näher zu systematisieren.
- issue: Abwendung von der Hoffnung
  choice: „von dieser Hoffnung abbringen lassen“
  alternative: „sich von dieser Hoffnung abwenden“
  rationale: Die gewählte Formulierung wahrt den passiven Gefährdungsaspekt des Zeugnisses und verbindet den Schluss eindeutig mit „Jesus Christus, unsere Hoffnung“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die Bildsprache der Falle und die dreigliedrige christologische Bekenntnisformel bleiben erhalten. Veraltete Formen und konfessionell geprägte Zusatzbegriffe wurden vermieden. Der Entwurf stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen sowie auf eine vorläufige Beurteilung der bekannten griechischen Satzstruktur; eine vollständige direkte Quellenprüfung ist noch erforderlich.
