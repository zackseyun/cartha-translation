review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gedankengang insgesamt zuverlässig wieder. Eine Korrektur ist jedoch nötig: Die griechische Konstruktion verbindet den Relativsatz grammatisch mit „Auferstehung“ (fem. Sg.); entsprechend bezieht sich auch die folgende Partizipialkonstruktion zunächst auf die Auferstehung. Die deutsche Fassung sollte dies nicht durch „dies alles“ wieder verallgemeinern. Die im englischen Zeugen mögliche weiter gefasste Lesart bleibt als textgeschichtliche Unsicherheit in einer Fußnote kenntlich.'
  naturalness: Mehrere Formulierungen sind verständlich, aber unnötig steif oder semantisch abgeschwächt. „Meine Lieben“, „voll überzeugt“, „Fallstricke“ und „euch rechtzeitig warnen“ sind modernes, würdiges Standarddeutsch. „Meine innig Geliebten“ klingt im heutigen Deutsch unnatürlich, und „möchte ich“ verwischt den rückblickenden aoristischen Ausdruck.
  terminology: „Leiden“, „Auferstehung“, „Pontius Pilatus“ und „unsere Hoffnung“ sind sachgerecht. „Haltlose Lehre“ gibt die im bereitgestellten Zeugen bezeugte Warnung vor inhaltsleerer bzw. irreführender Lehre idiomatischer wieder als „nichtige Lehre“. Die Formulierung „durch Jesus Christus ... vollbracht“ bleibt nahe an der passiven Aussage des Zeugen und vermeidet zusätzliche dogmatische Deutung.
  issues:
  - severity: medium
    issue: Der Satz „Denn dies alles wurde durch Jesus Christus ... vollbracht“ weitet den Bezug gegenüber der griechischen Satzkonstruktion aus.
    rationale: Der Relativsatz und das anschließende feminine Partizip stehen grammatisch im Singular und beziehen sich am nächsten auf „Auferstehung“. Der deutsche Text soll diese engere grammatische Bindung nicht ohne Kennzeichnung in eine Aussage über alle drei Ereignisse umformen.
  - severity: medium
    issue: „Vielmehr möchte ich ... dass ihr euch rechtzeitig in Acht nehmt“ gibt die Aussage über das beabsichtigte vorherige Warnen nur ungenau wieder.
    rationale: Die Aussage lautet nicht primär, der Verfasser wünsche gegenwärtig ihre Vorsicht, sondern er habe sie als der Geringere vorsorglich warnen wollen.
  - severity: low
    issue: „Meine innig Geliebten“ und „nichtige Lehre“ wirken im modernen Standarddeutsch unnatürlich.
    rationale: Die Anrede und die Warnung können ohne Bedeutungsverlust idiomatischer formuliert werden.
  revised_text: Dies sage ich, meine Lieben, nicht weil ich erfahren habe, dass jemand von euch so denkt. Vielmehr wollte ich euch, weil ich geringer bin als jeder von euch, rechtzeitig warnen, damit ihr nicht in die Fallstricke haltloser Lehre geratet. Seid vielmehr völlig überzeugt von der Geburt, dem Leiden und der Auferstehung, die unter der Statthalterschaft des Pontius Pilatus geschah.[a] Denn sie wurde durch Jesus Christus, unsere Hoffnung, wahrhaftig und gewiss vollbracht. Möge keiner von euch von dieser Hoffnung abgebracht werden.
  revised_footnotes:
  - marker: a
    text: Im griechischen Satz steht der Relativsatz grammatisch im femininen Singular und bezieht sich daher am unmittelbarsten auf „die Auferstehung“. Die bereitgestellte ältere englische Zeugenübersetzung lässt die Zeitangabe dagegen auch als auf Geburt, Leiden und Auferstehung insgesamt bezogen verstehen. Da eine endgültige Prüfung der maßgeblichen griechischen Textbasis noch aussteht, wird die abweichende Auslegungsmöglichkeit hier kenntlich gemacht.
    reason: Bewahrt die grammatisch naheliegende Bezugnahme im deutschen Text und dokumentiert zugleich die vom englischen Zeugen ausgehende, historisch bedeutsame alternative Lesemöglichkeit.
  revision_rationale: Die Überarbeitung folgt der griechischen Singularkongruenz, ohne die durch den englischen Zeugen belegte weiter gefasste Deutungsmöglichkeit zu verschweigen. Sie verbessert zugleich das heutige deutsche Idiom, wahrt den würdigen paränetischen Ton und erhält die zurückhaltende christologische Terminologie des Textes.
