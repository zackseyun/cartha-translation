base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: de
  text: 'Bemüht euch also, häufiger zusammenzukommen, um Gott zu danken und ihn zu verherrlichen. Denn wenn ihr häufig zusammenkommt, werden die Mächte Satans niedergeworfen, und sein verderbliches Wirken wird durch die Eintracht eures Glaubens zunichtegemacht.



    Nichts ist besser als Frieden; in ihm wird jeder Krieg himmlischer und irdischer Dinge aufgehoben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung folgt der offenen, elliptischen Aussage des vorliegenden englischen Zeugen („aller Krieg der Dinge im Himmel und der Dinge auf der Erde“) und entspricht auch der griechischen Verbindung „himmlischer und irdischer [Dinge]“. Ob dabei Wesen, Bereiche oder allgemeiner das Himmlische und Irdische gemeint sind, wird nicht näher festgelegt; ein Krieg „zwischen Mächten“ ist nicht ausdrücklich gesagt.
    reason: Die Fußnote bewahrt und erklärt die syntaktische und referenzielle Offenheit des kosmischen Schlusses, statt eine nicht ausdrücklich belegte Deutung einzutragen.
lexical_decisions:
- source_word: thanksgiving to God
  choice: um Gott zu danken
  rationale: Gibt den Zweck der Versammlung in natürlichem, modernem Deutsch wieder, ohne den Ausdruck auf eine bestimmte liturgische Feier festzulegen.
- source_word: for His glory
  choice: ihn zu verherrlichen
  rationale: Eine idiomatische deutsche Wiedergabe des Handelns zur Ehre Gottes.
- source_word: powers of Satan
  choice: die Mächte Satans
  rationale: Bewahrt die personhaft-kosmische Aussage des Zeugnisses und vermeidet eine abschwächende Psychologisierung.
- source_word: mischief
  choice: sein verderbliches Wirken
  rationale: Erfasst sowohl das böse Handeln als auch dessen schädliche Wirkung, ohne eine einzelne konkrete Tat zu unterstellen.
- source_word: concord of your faith
  choice: die Eintracht eures Glaubens
  rationale: Bewahrt die Verbindung von gemeinsamer Übereinstimmung und Glauben; „Eintracht“ entspricht dem gehobenen, aber verständlichen Register.
- source_word: peace
  choice: Frieden
  rationale: Die schlichte, theologisch offene Entsprechung wahrt den umfassenden Sinn.
theological_decisions:
- issue: Bedeutung von „thanksgiving“
  choice: allgemeines Danken an Gott
  alternative: Bezeichnung der Eucharistie
  rationale: Der vorliegende englische Zeuge lässt einen liturgischen Anklang zu, erzwingt aber keine ausschließliche sakramentale Deutung; wegen der noch ausstehenden griechischen Prüfung wird die Offenheit bewahrt.
- issue: Reichweite des abschließenden kosmischen Satzes
  choice: Krieg zwischen den Mächten im Himmel und auf der Erde
  alternative: alles Kriegsgeschehen von himmlischen und irdischen Dingen
  rationale: Das Zeugnis spricht elliptisch von „warfare of things in heaven and things on earth“. Die Formulierung macht den kosmischen Bezug verständlich, kennzeichnet aber wegen der sprachlichen Ungewissheit die Stelle mit einer Fußnote.
- issue: Wirkung der Glaubenseintracht
  choice: Satans Wirken wird durch die Eintracht zunichtegemacht
  alternative: Satans Wirken verschwindet lediglich zeitgleich mit der Eintracht
  rationale: „in the concord“ bezeichnet hier plausibel den Bereich oder das Mittel, in dem die Wirkung aufgehoben wird; die Formulierung vermeidet eine weitergehende dogmatische Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Der Text bleibt bewusst vorläufig, da nur ein gemeinfreier englischer Zeuge bereitgestellt wurde und die direkte Prüfung der mittelrezensionellen griechischen Überlieferung noch aussteht.
