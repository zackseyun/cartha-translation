  verdict: revise
  source_fidelity: Der Entwurf gibt den Gedankengang und die meisten Einzelaussagen zuverlässig wieder. Die Bezeichnung der Grußsender sollte jedoch nicht durch „Gläubige“ erweitert werden, sondern die im Zeugnis genannten Gruppen unmittelbar benennen. Das als redaktionelle Ergänzung markierte „[also]“ muss im deutschen Text sichtbar als editorisch unsicher gekennzeichnet bleiben. Bei der Bitte an den Vater vermeidet die Revision die im Entwurf hinzugefügte indikativische Zukunftsgewissheit („wird ... erfüllen“) und gibt die bittende bzw. wunschförmige Aussage wieder. Die Opfer-/Hingabe-Metaphorik für den Geist bleibt bewusst offen.
  naturalness: Die Revision verwendet modernes, würdiges Standarddeutsch. „Ältestenkollegium“ erläutert das gemeinte kollegiale Gremium verständlich, ohne den historischen Ausdruck als bloßes Gebäude oder einen modernen Verwaltungsrat misszuverstehen. Die Satzstellung der Schlussbitte ist im Deutschen klarer.
  terminology: „Bischof“ bleibt als Amtsbezeichnung erhalten. „Ältestenkollegium“ gibt „presbytery“ als Gremium wieder. „Geist“, „Vater“, „Jesus Christus“ und „untadelig“ werden beibehalten. Die Formel „Die Liebe der Smyrnäer und Epheser“ wahrt die absichtlich personale und zugleich abstrakte Grußformel des Zeugnisses.
