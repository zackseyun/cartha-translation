  - severity: medium
    issue: Die editorische Markierung von „[also]“ ist im deutschen Lauftext nicht als eckige Klammer erhalten.
    rationale: Die Fußnote erklärt die Unsicherheit, ersetzt aber nicht die im englischen Audit-Trail sichtbare editorische Kennzeichnung. Das deutsche „[auch]“ macht sie unmittelbar nachvollziehbar.
  - severity: medium
