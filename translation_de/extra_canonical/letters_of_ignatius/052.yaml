  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: de
  text: 'Die Liebe der Smyrnäer und Epheser grüßt euch. Denkt in euren Gebeten an die Gemeinde in Syrien. Ich bin es nicht wert, [auch][a] ihr Mitglied genannt zu werden, da ich der Allerletzte von ihnen bin.


    Lebt wohl in Jesus Christus! Ordnet euch dem Bischof unter wie dem Gebot und ebenso dem Ältestenkollegium. Liebt einander, jeder Einzelne von euch, mit ungeteiltem Herzen.


    Mein Geist wird für euch dargebracht[b] – nicht nur jetzt, sondern auch dann, wenn ich zu Gott gelange. Denn noch bin ich in Gefahr. Möge der Vater, der in Jesus Christus treu ist, meine Bitte und eure erfüllen. Mögen wir in ihm als untadelig befunden werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde gelegte englische Zeugnis kennzeichnet das entsprechende „also“ als redaktionelle Ergänzung. Eine direkte Prüfung am griechischen Text steht noch aus.
    reason: Die editorische Unsicherheit der bereitgestellten Vorlage bleibt durch die eckigen Klammern im Text und durch die Anmerkung sichtbar.
  - marker: b
    text: 'Wörtlich nach dem englischen Zeugnis: „Mein Geist wird für euch dargebracht.“ Die Formulierung kann eine hingebungsvolle Weihe oder ein Opferbild ausdrücken; die direkte Prüfung des griechischen Ausdrucks steht noch aus.'
    reason: Die mögliche kultische beziehungsweise opferbezogene Nuance wird nicht auf eine einzige Deutung festgelegt.
lexical_decisions:
- source_word: the love of the Smyrnaens and Ephesians
  choice: Die Liebe der Gläubigen in Smyrna und Ephesus
  rationale: Die abstrakte Grußformel „die Liebe“ bleibt erhalten; „der Gläubigen in“ macht die Ortsbezeichnungen im modernen Deutschen verständlich, ohne eine bestimmte Amtsträgerschaft anzunehmen.
- source_word: presbytery
  choice: Ältestenrat
  rationale: Gibt das kollegiale Gremium wieder und vermeidet, den Begriff bloß als Gebäude oder abstraktes Amt misszuverstehen.
- source_word: with undivided heart
  choice: mit ungeteiltem Herzen
  rationale: Bewahrt Bildsprache und ethischen Nachdruck der Vorlage.
- source_word: attain unto God
  choice: zu Gott gelange
  rationale: Bewahrt die zielgerichtete Formulierung, ohne die genaue Art dieses Gelangens dogmatisch auszudeuten.
- source_word: offered up
  choice: hingegeben
  rationale: Eine bewusst zurückhaltende Wiedergabe, die Weihe- beziehungsweise Opferanklänge zulässt, ohne sie auf eine einzige Deutung festzulegen.
theological_decisions:
- issue: Unterordnung unter den Bischof „wie unter das Gebot“
  choice: Ordnet euch dem Bischof unter wie dem Gebot
  alternative: Gehorcht dem Bischof wie einem göttlichen Gebot
  rationale: Die ungewöhnliche und theologisch spannungsvolle Vergleichsform bleibt stehen; eine ausdrückliche Gleichsetzung des Bischofs mit einem göttlichen Gebot wird nicht hinzugefügt.
- issue: Ignatius’ Zugehörigkeit zur Gemeinde in Syrien
  choice: Ich bin nicht würdig, auch nur zu ihr gezählt zu werden
  alternative: Ich bin nicht würdig, ihr Mitglied genannt zu werden
  rationale: Die Demutsaussage wird natürlich wiedergegeben, ohne einen modernen vereinsrechtlichen Mitgliedschaftsbegriff in den Text einzutragen.
- issue: Erfüllung „meiner und eurer Bitte“
  choice: meine Bitte und eure Bitte erfüllen
  alternative: unsere Bitten erfüllen
  rationale: Die getrennte Nennung beider Seiten bleibt erhalten und wird nicht zu einer gemeinsamen Bitte harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzstrukturen. Archaische Wendungen wie „seid gegrüßt“ oder „Presbyterium“ wurden vermieden, soweit sie nicht für die sachliche Genauigkeit nötig sind. Der Entwurf ist ausdrücklich vorläufig, da laut Datensatz die direkte Prüfung der mittelrezensionellen griechischen Überlieferung noch aussteht.
