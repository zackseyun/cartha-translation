  source_fidelity: 'Überarbeitung nötig: Der griechische Wortlaut der mittleren Rezension bezeichnet Christus als „aus Davids Geschlecht“ und „aus Maria“ (ἐκ Μαρίας), nicht ausdrücklich als „Sohn Marias“. Die Formulierung „Jesus Christus außer Acht lässt“ ist zudem enger als ἄνευ Ἰησοῦ Χριστοῦ („ohne Jesus Christus“ / Christus ausklammernd). Die Wiederholung von „wirklich“, die Benennung des Vaters als Handelndem und die kosmische Dreigliederung sind ansonsten sachgerecht bewahrt.'
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch. „Wenn jemand zu euch redet und Jesus Christus dabei ausklammert“ ist natürlich und wahrt die pointierte Aufforderung. „aus Maria hervorgegangen ist“ gibt die knappe Herkunftsaussage idiomatisch wieder, ohne die spezifischere Bezeichnung „Sohn Marias“ einzutragen.
  terminology: „Geschlecht Davids“, „wirklich“, „von den Toten auferweckt“ und „das wahre Leben“ sind passend. „Pontius Pilatus“ und „Christus Jesus“ sind korrekt. Die Herkunftsformel wird auf „aus Maria hervorgegangen“ berichtigt, um die griechische Präposition ἐκ ohne zusätzliche Titulierung wiederzugeben.
  issues:
  - severity: medium
    issue: „ist der Sohn Marias“ erweitert die Herkunftsaussage der griechischen Vorlage.
    rationale: Der maßgebliche griechische Text hat τοῦ ἐκ Μαρίας, wörtlich etwa „der aus Maria [ist/stammt]“. „Sohn Marias“ ist zwar inhaltlich naheliegend und im bereitgestellten englischen Zeugen enthalten, aber als ausdrückliche Bezeichnung nicht der Formulierung des griechischen Textes entsprechend.
  - severity: low
    issue: „Jesus Christus außer Acht lässt“ beschreibt eher eine bewusste Nichtbeachtung als die offene Formel „ohne Jesus Christus“.
    rationale: Die Wendung ἄνευ Ἰησοῦ Χριστοῦ lässt offen, ob Christus ausgelassen, ausgeschlossen oder von der Rede getrennt wird. „Jesus Christus dabei ausklammert“ bewahrt diese Funktion ohne eine innere Haltung zu unterstellen.
