base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: de
  text: 'Seid daher taub, wenn jemand zu euch redet und Jesus Christus dabei ausklammert: ihn, der aus dem Geschlecht Davids stammt und aus Maria hervorgegangen ist; der wirklich geboren wurde und aß und trank; der unter Pontius Pilatus wirklich verfolgt, wirklich gekreuzigt wurde und starb vor den Augen derer im Himmel, auf der Erde und unter der Erde.


    Auch wurde er wirklich von den Toten auferweckt, denn sein Vater auferweckte ihn. Ebenso wird sein Vater auch uns, die wir an ihn glauben, in Christus Jesus auferwecken – sein Vater, sage ich, wird uns auferwecken. Ohne Christus Jesus haben wir das wahre Leben nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Be ye deaf
  choice: Seid ... taub
  rationale: Bewahrt das eindringliche Bild und den imperativischen Ton des Zeugnisses, ohne es zu einer bloßen Aufforderung wie „Hört nicht hin“ abzuschwächen.
- source_word: apart from Jesus Christ
  choice: Jesus Christus außer Acht lässt
  rationale: Gibt den Sinn wieder, dass die betreffende Rede von Christus getrennt ist bzw. ihn ausklammert; ein räumlich klingendes „außerhalb von“ wäre im Deutschen weniger natürlich.
- source_word: race of David
  choice: Geschlecht Davids
  rationale: „Geschlecht“ ist eine verständliche, traditionsnahe Bezeichnung für Abstammung und vermeidet das moderne biologische Missverständnis von „Rasse“.
- source_word: truly
  choice: wirklich
  rationale: Die wiederholte Bekräftigung der realen Geburt, Passion, Kreuzigung, des Todes und der Auferweckung wird konsequent erhalten.
- source_word: raised from the dead / raised
  choice: von den Toten auferweckt / auferwecken
  rationale: Das Passiv und die ausdrückliche Handlung des Vaters bleiben erkennbar; „auferweckt“ entspricht dem sachlichen frühchristlichen Sprachgebrauch.
- source_word: true life
  choice: das wahre Leben
  rationale: Erhält die qualitative Bestimmung des Lebens, ohne sie als „ewiges Leben“ enger auszulegen.
theological_decisions:
- issue: Wirklichkeit der Menschwerdung und des Leidens
  choice: Die wiederholten Aussagen mit „wirklich“ wurden vollständig bewahrt.
  alternative: Die Wiederholungen stilistisch zusammenzuziehen.
  rationale: Die Wiederholung trägt die antidozetische Aussagekraft des Abschnitts und darf nicht geglättet werden.
- issue: Urheber der Auferweckung
  choice: Der Vater wird ausdrücklich als derjenige genannt, der Christus auferweckte und die Glaubenden auferwecken wird.
  alternative: Unpersönlich „Christus ist auferstanden“ bzw. „wir werden auferstehen“.
  rationale: Die kausale und theologische Struktur des überlieferten Zeugnisses bleibt so erhalten.
- issue: „in Christus Jesus“ bei der künftigen Auferweckung
  choice: Die Wendung wurde an „uns ... auferwecken“ angeschlossen, zugleich aber als eigener Nachsatz stehen gelassen.
  alternative: Sie ausschließlich auf „glauben“ oder ausschließlich auf „wahres Leben“ zu beziehen.
  rationale: Die syntaktische Reichweite ist im englischen Zeugen nicht völlig spannungsfrei; die Übersetzung vermeidet eine zusätzliche dogmatische Festlegung.
- issue: Die Wesen „unter der Erde“
  choice: Wörtlich „derer ... unter der Erde“.
  alternative: Deutend „die Toten“ oder „die Mächte der Unterwelt“.
  rationale: Die dreifache kosmische Formulierung wird ohne Festlegung der gemeinten Wesen bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter rhetorischer Eindringlichkeit. Die Vorlage ist ausdrücklich nur ein gemeinfreier englischer Zeuge; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus. Deshalb wurden keine textkritischen oder griechisch-lexikalischen Präzisierungen vorgetäuscht.
