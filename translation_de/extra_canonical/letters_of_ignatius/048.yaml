revisions:
- from: 'Seid daher taub, wenn jemand zu euch redet und dabei Jesus Christus außer Acht lässt. Er stammt aus dem Geschlecht Davids und ist der Sohn Marias. Er wurde wirklich geboren, aß und trank; er wurde unter Pontius Pilatus wirklich verfolgt, wirklich gekreuzigt und starb vor den Augen derer im Himmel, auf der Erde und unter der Erde.


    Auch wurde er wirklich von den Toten auferweckt, denn sein Vater hat ihn auferweckt. Ebenso wird sein Vater auch uns, die wir an ihn glauben, in Christus Jesus auferwecken – sein Vater, sage ich, wird uns auferwecken. Ohne Christus Jesus haben wir das wahre Leben nicht.'
  to: 'Seid daher taub, wenn jemand zu euch redet und Jesus Christus dabei ausklammert: ihn, der aus dem Geschlecht Davids stammt und aus Maria hervorgegangen ist; der wirklich geboren wurde und aß und trank; der unter Pontius Pilatus wirklich verfolgt, wirklich gekreuzigt wurde und starb vor den Augen derer im Himmel, auf der Erde und unter der Erde.


    Auch wurde er wirklich von den Toten auferweckt, denn sein Vater auferweckte ihn. Ebenso wird sein Vater auch uns, die wir an ihn glauben, in Christus Jesus auferwecken – sein Vater, sage ich, wird uns auferwecken. Ohne Christus Jesus haben wir das wahre Leben nicht.'
  rationale: Die Revision folgt bei der Herkunftsaussage dem griechischen Wortlaut vor dem englischen Audit-Zeugen und vermeidet dessen explizitere Fassung „Son of Mary“. Sie präzisiert ferner die einleitende Warnung, ohne deren bildhaften Imperativ oder die semantische Offenheit von „ohne Jesus Christus“ aufzugeben. Alle wiederholten Wirklichkeitsaussagen sowie die Aussage, dass der Vater Christus und die Glaubenden auferweckt, bleiben erhalten. Für die kosmische Dreigliederung und „in Christus Jesus“ ist keine erläuternde Fußnote erforderlich, da eine solche die bewusst nicht festgelegte Referenz bzw. syntaktische Reichweite einengen könnte.
