base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: de
  text: '**Ignatius an die Epheser 20**


    Wenn Jesus Christus mich durch euer Gebet für würdig hält und es Gottes Wille ist, werde ich euch in einer zweiten Schrift, die ich euch zu schreiben beabsichtige, die Heilsordnung, von der ich zu sprechen begonnen habe, noch ausführlicher darlegen. Sie besteht im Glauben an ihn und in der Liebe zu ihm, in seinem Leiden und seiner Auferstehung – besonders, falls der Herr mir etwas offenbart.


    Kommt alle gemeinsam zusammen, jeder Einzelne von euch, in Gnade, in dem einen Glauben und in dem einen Jesus Christus, der dem Fleisch nach aus dem Geschlecht Davids stammt und Menschensohn und Sohn Gottes ist. So sollt ihr dem Bischof und dem Ältestenrat mit ungeteilter Aufmerksamkeit gehorchen und dabei das eine Brot brechen. Dieses Brot ist Arznei der Unsterblichkeit und ein Gegenmittel gegen das Sterben, damit wir nicht sterben, sondern für immer in Jesus Christus leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'οἰκονομία (im englischen Zeugen: “dispensation”)'
  choice: Heilsordnung
  rationale: Bewahrt den Gedanken einer geordneten göttlichen Heilsführung, ohne das Wort auf eine moderne Verwaltung oder eine bestimmte dispensationalistische Lehre festzulegen.
- source_word: καινὸς ἄνθρωπος
  choice: der neue Mensch
  rationale: Nahe, traditionsfähige Wiedergabe, welche die christologische Aussage in ihrer knappen und spannungsvollen Form erhält.
- source_word: πάθος
  choice: Leiden
  rationale: Im christologischen Zusammenhang bezeichnet das Wort Jesu Passion; „Leiden“ ist im modernen Deutsch klar und würdig.
- source_word: πρεσβυτέριον
  choice: Ältestenrat
  rationale: Gibt das kollegiale Gremium wieder und vermeidet, es bloß als abstraktes „Priestertum“ zu verstehen.
- source_word: ἀπερίσπαστος διάνοια
  choice: ungeteilte Aufmerksamkeit
  rationale: Drückt einen nicht abgelenkten, innerlich gesammelten Sinn natürlicher aus als eine wörtliche Rede vom „unabgelenkten Denken“.
- source_word: φάρμακον ἀθανασίας
  choice: Arznei der Unsterblichkeit
  rationale: Erhält die markante medizinische Metapher und ihre sachliche Beziehung zur Unsterblichkeit.
- source_word: ἀντίδοτος
  choice: Gegenmittel
  rationale: Entspricht der medizinischen Bildsprache und ist im heutigen Deutsch unmittelbar verständlich.
theological_decisions:
- issue: Bezug von Glaube und Liebe
  choice: „den Glauben an ihn und die Liebe zu ihm“
  alternative: „in seinem Glauben und in seiner Liebe“
  rationale: Der überlieferte griechische Ausdruck mit αὐτοῦ kann grammatisch unterschiedlich nuanciert werden. Der Kontext und der frühe englische Zeuge stützen hier den objektiven Bezug auf Christus; die Formulierung vermeidet dennoch weitergehende dogmatische Auslegung.
- issue: Christologische Titel und davidische Abstammung
  choice: „dem Fleisch nach aus dem Geschlecht Davids und … Menschensohn und Sohn Gottes“
  alternative: „leiblich aus Davids Geschlecht, der Sohn eines Menschen und Sohn Gottes“
  rationale: Die traditionelle Titelform „Menschensohn“ wahrt die christologische Dichte; „dem Fleisch nach“ erhält die ausdrückliche Unterscheidung des Textes.
- issue: Brot als Arznei der Unsterblichkeit
  choice: Die Aussage wird direkt auf „das eine Brot“ bezogen und metaphorisch unverändert belassen.
  alternative: Eine erklärende Deutung als ausschließlich symbolische oder als technisch-sakramentale Aussage
  rationale: Der Text verwendet eine starke eucharistische Heilsmetapher, legt deren dogmatische Reichweite hier aber nicht systematisch fest. Die Übersetzung soll diese Spannung nicht konfessionell auflösen.
- issue: Wechsel der grammatischen Person im Schlusssatz
  choice: „damit wir nicht sterben“
  alternative: „damit ihr nicht sterbt“
  rationale: Die erste Person Plural entspricht der überlieferten Form des Satzes und schließt den Verfasser in die Hoffnung auf ewiges Leben ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut lesbarem Satzbau. Die Übersetzung orientiert sich soweit rekonstruierbar an der mittelrezensionellen griechischen Textgestalt; da die bereitgestellte Datengrundlage ausdrücklich eine noch ausstehende direkte Quellenprüfung vermerkt, werden unsichere Einzelheiten nicht durch zusätzliche Konjekturen erweitert. Kirchliche Amtsbegriffe werden historisch verständlich, aber ohne konfessionelle Zuspitzung wiedergegeben.
