  naturalness: Würdevolles modernes Standarddeutsch. Die Satzgliederung ist gut lesbar; die Revision glättet lediglich einzelne Bezüge und erhält zugleich den dichten, paränetischen Stil.
  terminology: „Heilsordnung“, „neuer Mensch“, „Menschensohn“, „Ältestenrat“, „Arznei der Unsterblichkeit“ und „Gegenmittel“ sind hier tragfähige, nicht konfessionell einengende Wiedergaben. „Dem Fleisch nach“ wahrt die ausdrückliche Qualifikation der davidischen Abstammung.
  issues:
  - severity: low
    issue: „noch etwas offenbart“
    rationale: Weder der griechische Ausdruck noch der englische Zeuge enthalten ein zeitliches „noch“. „Etwas offenbart“ gibt die offene Bedingung ohne Zusatz wieder.
  - severity: low
    issue: „Dieses Brot ist ... ein Gegenmittel gegen den Tod“
    rationale: Die Konstruktion ἀντίδοτος τοῦ μὴ ἀποθανεῖν ist näher als „Gegenmittel gegen das Sterben“ wiederzugeben. So bleibt die Aussage auf das Nichtsterben bezogen.
  - severity: low
    issue: Verhältnis des Brotbrechens zum Gehorsam
    rationale: Die griechische Partizipialkonstruktion verbindet das Brechen des einen Brotes mit der Aufforderung zum einmütigen Gehorsam. „Dabei“ macht diesen Zusammenhang sichtbar, ohne eine weitergehende sakramentale Deutung einzutragen.
