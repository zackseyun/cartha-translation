    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: de
  text: 'Doch ich warne euch davor, meine Geliebten, obwohl ich weiß, dass ihr selbst so denkt. Dennoch wache ich schon im Voraus über euch, damit ihr euch vor wilden Tieren in Menschengestalt hütet. Solche Menschen sollt ihr nicht nur nicht aufnehmen, sondern ihnen, wenn möglich, nicht einmal begegnen. Betet lediglich für sie, damit sie vielleicht umkehren. Das ist freilich schwer; doch Jesus Christus, unser wahres Leben, hat die Macht dazu.


    Denn wenn unser Herr dies alles nur zum Schein getan hat, dann bin auch ich nur zum Schein ein Gefangener. Warum habe ich mich dann dem Tod ausgeliefert, dem Feuer, dem Schwert und den wilden Tieren? Doch: dem Schwert nahe, Gott nahe; unter wilden Tieren, bei Gott. Es geschehe nur im Namen Jesu Christi, damit wir mit ihm leiden. Ich ertrage alles, weil er selbst mir Kraft gibt – er, der vollkommene Mensch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wiedergabe folgt hier dem bereitgestellten englischen Zeugen. Die Wendung „der vollkommene Mensch“ bedarf noch der unmittelbaren Prüfung an der griechischen Überlieferung; in verbreiteten Ausgaben steht an dieser Stelle sinngemäß „er, der ein vollkommener Mensch geworden ist“, während andere Textfassungen kürzer lauten können.
    reason: Der Auftrag weist ausdrücklich darauf hin, dass die direkte Prüfung des griechischen Ausgangstextes noch aussteht; die christologisch bedeutsame Formulierung sollte daher nicht ohne Transparenz als textlich gesichert erscheinen.
lexical_decisions:
- source_word: wild beasts in human form (English witness; Greek review pending)
  choice: wilde Tiere in Menschengestalt
  rationale: Bewahrt das scharfe Bild des Zeugen und klingt zugleich natürlich und würdevoll.
- source_word: receive
  choice: aufnehmen
  rationale: Lässt offen, ob gastliche, gemeindliche oder lehrmäßige Aufnahme gemeint ist, statt den Sinn vorschnell einzuengen.
- source_word: repent
  choice: umkehren
  rationale: Gibt den religiös-ethischen Richtungswechsel in heutigem Deutsch verständlich wieder.
- source_word: in semblance / in appearance
  choice: nur zum Schein
  rationale: Stellt die antizetische Aussage klar dar, ohne zusätzliche dogmatische Terminologie einzuführen.
- source_word: in the name of Jesus Christ
  choice: im Namen Jesu Christi
  rationale: Bewahrt die traditionelle und theologisch offene Formulierung.
- source_word: perfect Man
  choice: der vollkommene Mensch
  rationale: Gibt die christologische Aussage inklusiv und sachlich wieder; die mögliche textliche Unsicherheit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Wirklichkeit des Leidens Christi
  choice: „wenn unser Herr dies alles nur zum Schein getan hat“
  alternative: „wenn dies von unserem Herrn nur scheinbar getan wurde“
  rationale: Die aktive Form ist im Deutschen unmittelbarer, bewahrt aber die Polemik gegen ein lediglich scheinbares Leiden.
- issue: Mit Christus leiden
  choice: „damit wir mit ihm leiden“
  alternative: „damit ich mit ihm leide“
  rationale: Der überlieferte englische Zeuge hat die inklusive Mehrzahl; sie wird nicht stillschweigend individualisiert.
- issue: Christus als vollkommener Mensch
  choice: „er, der vollkommene Mensch“
  alternative: „der vollkommene Mensch“ nicht als Bestandteil des Haupttextes
  rationale: Der bereitgestellte Zeuge enthält die Wendung; wegen einer möglichen Abweichung innerhalb der griechischen Überlieferung wird sie beibehalten, aber gekennzeichnet.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, eindringlichem Ton. Die knappen Parallelismen „dem Schwert nahe, Gott nahe; unter wilden Tieren, bei Gott“ wurden bewusst erhalten. Grundlage ist mangels direkter griechischer Quellenprüfung der angegebene gemeinfreie englische Zeuge; die Übersetzung ist daher als vorläufig quellenorientierter Entwurf zu behandeln.
