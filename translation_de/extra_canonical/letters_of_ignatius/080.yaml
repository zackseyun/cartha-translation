review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bildet die Argumentation und die bildhafte Polemik des bereitgestellten englischen Zeugen weitgehend zuverlässig ab. Korrekturbedarf besteht bei „obwohl ich weiß“: Der Zusammenhang ist begründend („da/weil ich weiß“), nicht einräumend. „hat die Macht dazu“ ist außerdem weniger präzise als „hat Macht darüber“, und „Es geschehe nur“ fügt einen imperativischen Sinn hinzu, den die elliptische Wendung des Zeugen nicht verlangt.'
  naturalness: Der Ton ist insgesamt gutes modernes Standarddeutsch. Die Reihung am Schluss gewinnt an Klarheit und rhythmischer Nähe zum Ausgangstext durch „Nahe beim Schwert, nahe bei Gott“. Die Formulierung „wenn es nur im Namen Jesu Christi geschieht“ macht die im Zeugen elliptische Voraussetzung idiomatisch verständlich, ohne ihren Sinn zu erweitern.
  terminology: „wilde Tiere in Menschengestalt“, „aufnehmen“, „umkehren“, „nur zum Schein“, „im Namen Jesu Christi“ und „der vollkommene Mensch“ sind angemessene, registergerechte Wiedergaben. „Der vollkommene Mensch“ wird nicht dogmatisch ausgelegt. Die Fußnote wird auf die tatsächlich gegebene vorläufige Quellenlage beschränkt; die Behauptung konkreter abweichender Textfassungen ist ohne hier vorliegende griechische Kollation nicht abzusichern.
  issues:
  - severity: medium
    issue: „obwohl ich weiß“ gibt den logischen Zusammenhang falsch wieder.
    rationale: Der englische Zeuge sagt „knowing that“ und verbindet die Warnung begründend mit der bereits vorhandenen Haltung der Adressaten. „Obwohl“ erzeugt dagegen einen unnötigen Gegensatz.
  - severity: medium
    issue: „Es geschehe nur im Namen Jesu Christi“ ist zu stark interpretierend.
    rationale: Die englische Wendung „Only let it be in the name of Jesus Christ“ ist elliptisch und setzt eine Bedingung bzw. Einschränkung. Die deutsche Imperativform „Es geschehe“ fügt einen ausdrücklichen Aufforderungssinn hinzu.
  - severity: low
    issue: Die vorhandene Fußnote behauptet nicht verifizierte Angaben zu verbreiteten Ausgaben und Textfassungen.
    rationale: Der Kontext bestätigt nur, dass die direkte griechische Prüfung noch aussteht. Konkrete textkritische Varianten sollten ohne Nachweis nicht als Fußnoteninformation stehen.
  revised_text: 'Doch ich warne euch davor, meine Geliebten, da ich weiß, dass ihr selbst so denkt. Dennoch wache ich schon im Voraus über euch, damit ihr euch vor wilden Tieren in Menschengestalt hütet. Solche Menschen sollt ihr nicht nur nicht aufnehmen, sondern ihnen, wenn möglich, nicht einmal begegnen. Betet lediglich für sie, damit sie vielleicht umkehren. Das ist freilich schwer; doch Jesus Christus, unser wahres Leben, hat Macht darüber.


    Denn wenn unser Herr dies alles nur zum Schein getan hat, dann bin auch ich nur zum Schein ein Gefangener. Warum habe ich mich dann dem Tod ausgeliefert, dem Feuer, dem Schwert und den wilden Tieren? Doch: Nahe beim Schwert, nahe bei Gott; unter wilden Tieren, bei Gott. Wenn es nur im Namen Jesu Christi geschieht, damit wir mit ihm leiden. Ich ertrage alles, weil er selbst mir Kraft gibt – er, der vollkommene Mensch.[a]'
  revised_footnotes:
  - marker: a
    text: Die Wiedergabe folgt an dieser Stelle dem bereitgestellten englischen Zeugen. Eine unmittelbare Prüfung an der griechischen Überlieferung steht noch aus.
    reason: Die christologisch gewichtige Schlussformulierung wird transparent als vorläufig kenntlich gemacht, ohne unbelegte Aussagen über Varianten zu machen.
