base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: de
  text: 'Da ich nicht allen Gemeinden schreiben konnte, weil ich nach Gottes Willen plötzlich von Troas nach Neapolis absegeln musste, sollst du den vor uns liegenden Gemeinden schreiben, als einer, der Gottes Sinn besitzt, damit auch sie dasselbe tun: Wer dazu in der Lage ist, soll Boten senden; die Übrigen sollen durch die von dir Entsandten Briefe schicken. So werdet ihr durch eine unvergessliche Tat geehrt werden – denn das ist deiner würdig.


    Ich grüße alle mit Namen, besonders die Frau des Epitropus mit ihrem ganzen Haus und den Hausgemeinschaften ihrer Kinder.[a] Ich grüße meinen geliebten Attalus. Ich grüße den, der dazu bestimmt werden wird, nach Syrien zu reisen. Die Gnade sei allezeit mit ihm und mit Polykarp, der ihn entsendet.


    Ich nehme für alle Zeit Abschied von euch in unserem Gott Jesus Christus. Bleibt in ihm, in der Einheit und unter Gottes Aufsicht.[b] Ich grüße Alke, einen mir sehr lieben Namen.[c] Lebt wohl im Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zugrunde liegende Formulierung kann auch verstanden werden als: „mit ihrem ganzen Haus und dem ihrer Kinder“. Gemeint sind wahrscheinlich die jeweiligen Hausgemeinschaften.'
    reason: Der englische Zeuge ist an dieser Stelle grammatisch auffällig; ohne abgeschlossene griechische Quellenprüfung sollte die genaue Beziehung nicht verdeckt werden.
  - marker: b
    text: „Aufsicht“ gibt einen Ausdruck wieder, der auch „Fürsorge“, „Obhut“ oder „Beaufsichtigung“ bedeuten kann. Hier wird er ausdrücklich auf Gott bezogen.
    reason: Die theologisch und kirchenamtlich mögliche Mehrdeutigkeit soll erhalten bleiben.
  - marker: c
    text: 'Wörtlich etwa: „Alke, den mir teuren Namen“. Wahrscheinlich ist die namentlich genannte Person selbst gemeint.'
    reason: Die ungewöhnliche Ausdrucksweise des Zeugnisses wird erklärt, ohne sie im Haupttext unnatürlich wörtlich wiederzugeben.
lexical_decisions:
- source_word: the churches in front (ταῖς ἔμπροσθεν ἐκκλησίαις, probable Greek)
  choice: den vor uns liegenden Gemeinden
  rationale: Bewahrt die räumliche beziehungsweise reisebezogene Aussage, ohne vorschnell eine bestimmte Himmelsrichtung oder Rangordnung anzunehmen.
- source_word: mind of God (γνώμη θεοῦ, probable Greek)
  choice: Gottes Sinn
  rationale: Gibt die mögliche Bedeutung von γνώμη als Denken, Urteil oder Absicht knapp wieder und vermeidet die stärkere Behauptung einer vollständigen Kenntnis des göttlichen Willens.
- source_word: messengers (πεζούς, probable Greek)
  choice: Boten
  rationale: Im Zusammenhang sind entsandte Personen gemeint; die deutsche Wiedergabe bleibt natürlich, auch wenn der griechische Ausdruck möglicherweise ausdrücklich Fußreisende bezeichnet.
- source_word: supervision (ἐπισκοπή, probable Greek)
  choice: Aufsicht
  rationale: Erhält den Bezug auf Gottes beaufsichtigende Fürsorge beziehungsweise Leitung und harmonisiert den Ausdruck nicht mit einem bestimmten kirchlichen Amt.
- source_word: household (οἶκος, probable Greek)
  choice: Haus
  rationale: „Haus“ kann im antiken Kontext Familie, Angehörige und Hausgemeinschaft umfassen und bleibt näher am Ausdruck als das modern engere „Haushalt“.
theological_decisions:
- issue: Der göttliche Wille und die plötzliche Abreise
  choice: „weil ich nach Gottes Willen plötzlich … absegeln musste“
  alternative: „weil ich plötzlich … absegelte, wie der göttliche Wille gebietet“
  rationale: Die Formulierung macht den syntaktischen Bezug verständlich, ohne eine weitergehende Lehre über Vorsehung oder unmittelbare Offenbarung einzutragen.
- issue: Einheit und Gottes ἐπισκοπή
  choice: „in der Einheit und unter Gottes Aufsicht“
  alternative: „in der Einheit und im Bischofsamt Gottes“
  rationale: Der Ausdruck wird als göttliche Aufsicht beziehungsweise Fürsorge wiedergegeben; eine amtstheologische Festlegung wäre durch die vorliegende Evidenz nicht gerechtfertigt.
- issue: „unser Gott Jesus Christus“
  choice: unverändert als „unserem Gott Jesus Christus“
  alternative: „Gott und Jesus Christus“
  rationale: Die enge christologische Aussage des Zeugnisses wird nicht abgeschwächt oder syntaktisch aufgeteilt.
- issue: Numerus des Adressaten im Schlussabschnitt
  choice: „von euch“ und „Bleibt“
  alternative: 'Singular: „von dir“ und „Bleib“'
  rationale: Der überlieferte englische Zeuge wechselt hier zum Plural; diese Spannung zwischen Polykarp als direktem Adressaten und der Gemeinde wird bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit brieflichem Ton. Die Anrede unterscheidet bewusst zwischen dem Singular an Polykarp („sollst du“, „deiner“) und dem im Schluss bezeugten Plural an die Empfängergemeinschaft („euch“, „Bleibt“). Da die direkte Prüfung des mittelrezensionellen griechischen Textes laut Datensatz noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorsichtig und stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen sowie die auditierte englische POB-Fassung.
