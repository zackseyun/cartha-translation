    text: 'Die zugrunde liegende Formulierung ist elliptisch und kann auch verstanden werden als: „mit ihrem ganzen Haus und dem ihrer Kinder“. Wahrscheinlich sind die jeweiligen Hausgemeinschaften gemeint.'
