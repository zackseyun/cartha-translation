review_pass:
  verdict: revise
  source_fidelity: 'Eine Überarbeitung ist angezeigt. Die deutsche Fassung folgt dem englischen Zeugen überwiegend zuverlässig, verschiebt jedoch an einzelnen Stellen Aussage oder Modus: Die Abreise wird zu stark als durch Gottes Willen erzwungen dargestellt, „Gnade sei“ gibt die futurische Zusage weniger genau wieder, und „für alle Zeit Abschied“ kann einen endgültigen Abschied ausdrücken. Die schwierige elliptische Wendung zu Epitropus’ Frau und ihren Kindern sollte im Haupttext nicht durch „Hausgemeinschaften“ interpretierend ausgeweitet werden.'
  naturalness: Der Briefstil ist im Allgemeinen modern und würdevoll. „den vor uns liegenden Gemeinden“ und besonders „Hausgemeinschaften ihrer Kinder“ wirken jedoch unnötig erklärend bzw. räumlich zu eng. Die revidierte Fassung bleibt idiomatisch, ohne die überlieferte Ellipse aufzulösen.
  terminology: „unserem Gott Jesus Christus“, „Gottes Sinn“, „Boten“ und „Aufsicht Gottes“ bewahren die christologische und begriffliche Gestalt des Zeugen ohne konfessionelle Harmonisierung. Personennamen werden als Epitropus, Attalus, Polykarp und Alke wiedergegeben. Die Mehrdeutigkeit von ἐπισκοπή wird in einer Anmerkung kenntlich gemacht.
  issues:
  - severity: medium
    issue: Der Bezug des göttlichen Willens wird in der ersten Satzhälfte verengt.
    rationale: „weil ich nach Gottes Willen ... absegeln musste“ macht den göttlichen Willen unmittelbar zur Ursache eines Zwangs zur Abreise. Der Zeuge formuliert knapper „as the divine will commands“. „wie es der göttliche Wille gebietet“ wahrt diese Formulierung und ihre syntaktische Spannung.
  - severity: medium
    issue: Die Ellipse bei Epitropus’ Frau und ihren Kindern wird zu stark ausgelegt.
    rationale: „den Hausgemeinschaften ihrer Kinder“ setzt mehrere eigenständige Hausgemeinschaften voraus. Der Zeuge bietet nur die auffällige Ergänzung „and her children’s“. „und dem ihrer Kinder“ bewahrt die Ellipse; die Anmerkung erläutert die wahrscheinliche Ergänzung.
  - severity: medium
    issue: Der Modus bei der Gnadenzusage ist verändert.
    rationale: „Grace shall be with him“ ist eine Zukunftsaussage. „Die Gnade wird allezeit mit ihm sein“ gibt dies genauer wieder als ein deutscher Wunschmodus („sei“).
  - severity: medium
    issue: „für alle Zeit Abschied“ kann endgültigen Abschied bedeuten.
    rationale: Das kann im Deutschen ein Abschiednehmen auf Dauer nahelegen. „Ich verabschiede mich allezeit von euch“ gibt die fortdauernde bzw. wiederholte Grußformel wieder, ohne Endgültigkeit einzutragen.
  revised_text: 'Da ich nicht allen Gemeinden schreiben konnte, weil ich plötzlich von Troas nach Neapolis absegelte, wie es der göttliche Wille gebietet, sollst du den vorausliegenden Gemeinden schreiben, als einer, der Gottes Sinn hat, damit auch sie dasselbe tun: Die dazu Fähigen sollen Boten senden, die Übrigen Briefe durch die von dir Entsandten. So werdet ihr durch eine unvergessliche Tat geehrt werden – denn das ist deiner würdig.



    Ich grüße alle mit Namen, besonders die Frau des Epitropus mit ihrem ganzen Haus und dem ihrer Kinder.[a] Ich grüße meinen geliebten Attalus. Ich grüße den, der dazu bestimmt werden wird, nach Syrien zu reisen. Die Gnade wird allezeit mit ihm sein und mit Polykarp, der ihn entsendet.



    Ich verabschiede mich allezeit von euch in unserem Gott Jesus Christus. Bleibt in ihm, in der Einheit und unter Gottes Aufsicht.[b] Ich grüße Alke, einen mir sehr lieben Namen.[c] Lebt wohl im Herrn.'
  revised_footnotes:
