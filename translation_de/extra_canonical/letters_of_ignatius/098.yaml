source:
  text: 'Since I have not been able to write to all the churches, by reason of my sailing suddenly from Troas to Neapolis, as the Divine will enjoineth, thou shalt write to the churches in front, as one possessing the mind of God, to the intent that they also may do this same thing--let those who are able send messengers, and the rest letters by the persons who are sent by thee, that ye may be glorified by an ever memorable deed--for this is worthy of thee.


    I salute all by name, and especially the wife of Epitropus with her whole household and her children''s. I salute Attalus my beloved. I salute him that shall be appointed to go to Syria. Grace shall be with him always, and with Polycarp who sendeth him.


    I bid you farewell always in our God Jesus Christ, in whom abide ye in the unity and supervision of God. I salute Alce, a name very dear to me. Fare ye well in the Lord.'
