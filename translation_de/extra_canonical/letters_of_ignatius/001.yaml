base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: de
  text: 'Ignatius, der auch Theophorus genannt wird, an die Gemeinde, die durch die Fülle Gottes, des Vaters, in reichem Maß gesegnet ist; die vor den Weltzeiten dazu bestimmt wurde, für immer in bleibender und unveränderlicher Herrlichkeit zu sein; die vereint und erwählt ist im wahren Leiden, nach dem Willen des Vaters und Jesu Christi, unseres Gottes: an die Gemeinde in Ephesus [in Asia], die jedes Glückwunsches würdig ist. Herzliche Grüße in Christus Jesus und in untadeliger Freude.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεοφόρος (Theophorus, via witness)
  choice: Theophorus
  rationale: Der Beiname wird transliteriert und nicht als »Gottesträger« oder »von Gott getragen« gedeutet, da seine genaue Bedeutung hier offenbleiben soll.
- source_word: plentitude / πλήρωμα
  choice: Fülle
  rationale: »Fülle« bewahrt den gehobenen und möglicherweise theologischen Sinn besser als eine bloße Mengenangabe.
- source_word: foreordained before the ages
  choice: vor den Weltzeiten dazu bestimmt
  rationale: Die zeitliche Aussage und der Gedanke göttlicher Vorherbestimmung werden bewahrt, ohne eine bestimmte dogmatische Systematik einzutragen.
- source_word: true passion / ἐν πάθει ἀληθινῷ
  choice: im wahren Leiden
  rationale: »Leiden« gibt den christologisch geprägten Ausdruck formal wieder; die knappe Formulierung lässt offen, wie genau die Gemeinde mit dem wirklichen Leiden Christi verbunden ist.
- source_word: felicitation
  choice: Glückwunsch
  rationale: Die ungewöhnliche, lobende Grußformel wird verständlich wiedergegeben, ohne sie in allgemeines Lob umzudeuten.
- source_word: Asia
  choice: Asia
  rationale: Die antike römische Provinz ist gemeint; die Form »Asia« verhindert die moderne Gleichsetzung mit dem Kontinent Asien.
theological_decisions:
- issue: Bezeichnung Jesu Christi als »unser Gott«
  choice: Jesu Christi, unseres Gottes
  alternative: Gottes, des Vaters, und unseres Herrn Jesus Christus
  rationale: Die im überlieferten Wortlaut erkennbare direkte Gottesbezeichnung Jesu wird nicht abgeschwächt oder syntaktisch umgedeutet.
- issue: Bezug von »im wahren Leiden«
  choice: die vereint und erwählt ist im wahren Leiden
  alternative: die durch das wahre Leiden vereint und erwählt ist
  rationale: Die Präposition bleibt semantisch offen; eine eindeutige instrumentale Deutung würde die Spannung des Ausdrucks vorschnell auflösen.
- issue: Personifikation der Gemeinde
  choice: an die Gemeinde ... die
  alternative: an sie ... welche
  rationale: Die grammatisch feminine Anrede des Zeugnisses wird im Deutschen natürlich über »Gemeinde« fortgeführt, ohne eine zusätzliche ekklesiologische Aussage daraus abzuleiten.
translation_notes:
  register: Moderner, würdiger Briefstil mit langen, aber gegliederten Perioden. Die Fassung ist wegen der noch ausstehenden direkten Prüfung des griechischen Textes als vorläufig zu behandeln. Eckige Klammern um »in Asia« bewahren das textkritische bzw. ergänzende Signal des englischen Zeugnisses.
