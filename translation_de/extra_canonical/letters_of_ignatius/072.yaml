revisions:
- from: 'Ich nun tat meinen Teil als ein Mensch, der auf Einheit ausgerichtet ist. Wo aber Spaltung und Zorn herrschen, da wohnt Gott nicht. Der Herr vergibt nun allen, die umkehren, wenn sie in ihrer Umkehr zur Einheit Gottes und zum Rat des Bischofs zurückkehren.[a] Ich vertraue auf die Gnade Jesu Christi, die jede Fessel von euch lösen wird. Und ich bitte euch:


    Tut nichts aus Streitsucht, sondern handelt nach der Lehre Christi. Denn ich hörte einige sagen: »Wenn ich es nicht in den Urkunden finde, glaube ich es nicht im Evangelium.«[b] Als ich ihnen sagte: »Es steht geschrieben«, antworteten sie mir: »Genau das ist strittig.« Für mich aber ist Jesus Christus die Urkunde; die unverletzliche Urkunde sind sein Kreuz, sein Tod und seine Auferstehung sowie der Glaube, der durch ihn kommt.[c] Darin möchte ich durch eure Gebete gerechtfertigt werden.'
  to: 'Ich nun tat meinen Teil als ein Mensch, der auf Einheit ausgerichtet ist. Wo aber Spaltung und Zorn sind, da wohnt Gott nicht. Der Herr vergibt allen, die umkehren, wenn sie in ihrer Umkehr zur Einheit Gottes und zum Rat des Bischofs zurückkehren.[a] Ich vertraue auf die Gnade Jesu Christi, die jede Fessel von euch lösen wird. Und ich bitte euch:


    Tut nichts aus Streitsucht, sondern handelt nach der Lehre Christi. Denn ich hörte einige sagen: »Wenn ich es nicht in den Archiven finde, glaube ich es nicht im Evangelium.«[b] Als ich ihnen sagte: »Es steht geschrieben«, antworteten sie mir: »Genau das ist strittig.« Für mich aber sind Jesus Christus die Archive; die unverletzlichen Archive sind sein Kreuz, sein Tod, seine Auferstehung und der Glaube durch ihn.[c] Darin möchte ich durch eure Gebete gerechtfertigt werden.'
