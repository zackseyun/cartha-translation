base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: de
  text: 'Ich nun tat meinen Teil als ein Mensch, der auf Einheit ausgerichtet ist. Wo aber Spaltung und Zorn sind, da wohnt Gott nicht. Der Herr vergibt allen, die umkehren, wenn sie in ihrer Umkehr zur Einheit Gottes und zum Rat des Bischofs zurückkehren.[a] Ich vertraue auf die Gnade Jesu Christi, die jede Fessel von euch lösen wird. Und ich bitte euch:


    Tut nichts aus Streitsucht, sondern handelt nach der Lehre Christi. Denn ich hörte einige sagen: »Wenn ich es nicht in den Archiven finde, glaube ich es nicht im Evangelium.«[b] Als ich ihnen sagte: »Es steht geschrieben«, antworteten sie mir: »Genau das ist strittig.« Für mich aber sind Jesus Christus die Archive; die unverletzlichen Archive sind sein Kreuz, sein Tod, seine Auferstehung und der Glaube durch ihn.[c] Darin möchte ich durch eure Gebete gerechtfertigt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Rat des Bischofs« kann hier auch ein mit dem Bischof verbundenes Ratsgremium oder eine beratende Versammlung bezeichnen. Die genaue institutionelle Nuance bedarf einer Prüfung des griechischen Wortlauts und Kontextes.
    reason: Das englische »council« und das griechische institutionelle Vokabular lassen mehrere Nuancen zu; die Fußnote legt keine bestimmte Kirchenordnung fest.
  - marker: b
    text: Mit »Archive« wird das wiederholte Bild archivierter bzw. beglaubigender Schriftstücke bewahrt. Gemeint sein können schriftliche Belege oder maßgebliche Schriften; der genaue Bezug ist umstritten.
    reason: Die plurale Bildsprache wird gegenüber »Urkunden« genauer wiedergegeben, ohne eine bestimmte kanongeschichtliche Deutung festzulegen.
  - marker: c
    text: Die Formulierung »der Glaube durch ihn« lässt offen, wie die Beziehung zu Christus genauer zu verstehen ist. Auch die Zuordnung dieses Ausdrucks zur Reihe der »unverletzlichen Archive« beziehungsweise zur abschließenden Aussage über die Rechtfertigung bleibt syntaktisch nicht weiter festgelegt.
    reason: Bewahrt die knappe syntaktische und theologische Mehrdeutigkeit der Überlieferung.
lexical_decisions:
- source_word: composed unto union
  choice: auf Einheit ausgerichtet
  rationale: Gibt die persönliche Haltung zur Einheit natürlich wieder, ohne den ungewöhnlichen Ausdruck des englischen Zeugen mechanisch nachzubilden.
- source_word: division and anger
  choice: Spaltung und Zorn
  rationale: Bewahrt beide deutlichen Gegenbegriffe zur Einheit in würdigem, verständlichem Deutsch.
- source_word: council of the bishop
  choice: Rat des Bischofs
  rationale: Erhält die mögliche Bedeutung von Rat, Beschluss oder beratender Instanz; »Ratsversammlung« wäre ohne griechische Prüfung zu eng.
- source_word: charters
  choice: Urkunden
  rationale: Bewahrt das wiederholte Rechts- und Beglaubigungsbild. »Schriften« wäre geläufiger, würde aber die Metapher abschwächen.
- source_word: It is written
  choice: Es steht geschrieben
  rationale: Entspricht der festen schriftbezogenen Formel und wahrt zugleich den Streit darüber, was als maßgebliche Schrift gilt.
- source_word: faith through Him
  choice: der Glaube, der durch ihn kommt
  rationale: Bewahrt die instrumentale bzw. vermittelnde Bedeutung von »durch ihn«, ohne sie vorschnell als Glauben »an ihn« aufzulösen.
theological_decisions:
- issue: Vergebung, Umkehr und Rückkehr zur Einheit
  choice: »Der Herr vergibt ... wenn sie ... zurückkehren«
  alternative: Die Rückkehr zur kirchlichen Einheit nur als Folge bereits gewährter Vergebung formulieren
  rationale: Der überlieferte Zeuge verbindet die Vergebung ausdrücklich konditional mit Umkehr und Rückkehr; diese Spannung darf nicht geglättet werden.
- issue: »Einheit Gottes«
  choice: Genitiv unverändert als »Einheit Gottes« bewahren
  alternative: »Einheit mit Gott«
  rationale: Die Formulierung kann Gottes eigene Einheit, eine von Gott gestiftete Einheit oder Einheit mit Gott bezeichnen. Die Übersetzung lässt diese Mehrdeutigkeit offen.
- issue: Autorität von Evangelium, Schrift und Christusereignis
  choice: Die Urkundenmetapher und die Gegenüberstellung vollständig bewahren
  alternative: Den Abschnitt als schlichte Debatte über den neutestamentlichen Kanon erläutern
  rationale: Der Text setzt Christus, Kreuz, Tod und Auferstehung als maßgebliche Beglaubigung ein; eine präzise kanongeschichtliche Deutung wäre ohne griechische Prüfung und Kontextentscheidung zu eng.
- issue: Rechtfertigung durch Gebete
  choice: »durch eure Gebete gerechtfertigt werden«
  alternative: »durch eure Gebete als gerecht erfunden werden« oder »das Heil erlangen«
  rationale: Bewahrt die auffällige theologische Formulierung des Zeugen, ohne ihre genaue soteriologische Bedeutung festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die Anrede bleibt im Plural. Rechtliche Bildsprache wird konsequent mit »Urkunde(n)« wiedergegeben. Da nur ein englischer gemeinfreier Zeuge vorliegt und die direkte griechische Quellenprüfung noch aussteht, ist der Entwurf ausdrücklich vorläufig; auffällige Ambiguitäten wurden nicht stillschweigend aufgelöst.
