base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: de
  text: 'Lasst euch also von niemandem täuschen – wie ihr euch ja auch nicht täuschen lasst –, denn ihr gehört ganz Gott. Wenn sich nämlich keine Begierde in euch festgesetzt hat, die Macht hat, euch zu quälen, dann lebt ihr wahrhaftig nach Gottes Willen. Ich gebe mich für euch hin und weihe mich als Opfer für eure Gemeinde in Ephesus, die durch alle Zeitalter hindurch berühmt ist.


    Diejenigen, die vom Fleisch bestimmt sind, können nicht tun, was dem Geist entspricht; ebenso können diejenigen, die vom Geist bestimmt sind, nicht tun, was dem Fleisch entspricht. Genauso wenig kann der Glaube tun, was der Untreue entspricht, oder die Untreue, was dem Glauben entspricht. Ja, selbst das, was ihr dem Fleisch nach tut, ist geistlich; denn ihr tut alles in Jesus Christus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lust (Greek review pending)
  choice: Begierde
  rationale: Gibt das innere, potenziell beherrschende Verlangen des englischen Zeugen würdig und ohne unnötige Verengung auf Sexualität wieder.
- source_word: live after God
  choice: nach Gottes Willen leben
  rationale: Natürliches modernes Deutsch; kennzeichnet eine an Gott ausgerichtete Lebensweise, ohne eine Aussage über Gottes Wesen zu unterstellen.
- source_word: flesh
  choice: Fleisch
  rationale: Bewahrt den frühchristlichen theologischen Schlüsselbegriff und die Spannung im Gegensatz zu »Geist«; »menschliche Natur« wäre bereits auslegend.
- source_word: Spirit
  choice: Geist
  rationale: Bewahrt die mögliche Mehrdeutigkeit zwischen Gottes Geist und der geistlichen Sphäre; die Großschreibung folgt dem naheliegenden theologischen Bezug.
- source_word: unfaithfulness
  choice: Untreue
  rationale: Erhält den Gegensatz zu »Glaube« und vermeidet eine vorschnelle Festlegung ausschließlich auf intellektuellen Unglauben.
- source_word: in Jesus Christ
  choice: in Jesus Christus
  rationale: Bewahrt die charakteristische relationale Formel wörtlich und theologisch offen.
theological_decisions:
- issue: Gegensatz von Fleisch und Geist
  choice: »vom Fleisch/Geist bestimmt« und »dem Fleisch/Geist entspricht«
  alternative: »fleischliche/geistliche Menschen« beziehungsweise »Werke des Fleisches/Geistes«
  rationale: Die Formulierung macht den Gedankengang im Deutschen verständlich, ohne feste Personengruppen oder einen ausgearbeiteten späteren Lehrrahmen in den Text einzutragen.
- issue: Aussage, dass Handlungen »nach dem Fleisch« geistlich sind
  choice: Die paradoxe Aussage wird unverändert bewahrt.
  alternative: »Selbst eure leiblichen Handlungen«
  rationale: Eine Auflösung in bloß körperliche Handlungen würde die echte Spannung des Textes abschwächen.
- issue: Opfersprache des Ignatius
  choice: »Ich gebe mich für euch hin und weihe mich als Opfer«
  alternative: »Ich bin euer Lösegeld« oder »Sühneopfer«
  rationale: Der englische Zeuge trägt deutliche Opfersprache, legt aber weder Lösegeld noch sühnende Funktion eindeutig fest; eine konfessionelle oder dogmatische Präzisierung wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Gemeindeanrede. Da eine unmittelbare Prüfung des mittelrezensionellen griechischen Textes noch aussteht und nur der angegebene englische Zeuge vorliegt, ist der Entwurf ausdrücklich vorläufig; syntaktische und lexikalische Feinentscheidungen sollten nach griechischer Quellenprüfung erneut auditiert werden.
