review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den überlieferten Gedankengang insgesamt zuverlässig wieder. Einzelne Umschreibungen schwächen jedoch die absichtlich parallele, prägnante Terminologie von »Fleisch«, »Geist« und deren »Dingen« ab. »Nach Gottes Willen« ist gegenüber »nach Gott« bzw. »gottgemäß« eine leichte interpretierende Präzisierung.
  naturalness: Das Deutsch ist klar und würdevoll. »Gottgemäß leben« sowie »die Dinge des Geistes/Fleisches tun« sind modernes, verständliches Deutsch und bilden die rhetorischen Gegenüberstellungen des Textes unmittelbarer ab.
  terminology: »Fleisch«, »Geist«, »Glaube«, »Untreue« und »in Jesus Christus« sollen als wiederkehrende Schlüsselbegriffe möglichst wörtlich und symmetrisch stehen bleiben. »Gemeinde der Epheser« ist näher an der Adressatenbezeichnung als »eure Gemeinde in Ephesus«.
  issues:
  - severity: medium
    issue: Die Wendungen »was dem Geist/Fleisch entspricht« ersetzen die im Zeugen wiederholte Formulierung »die Dinge des Geistes/Fleisches tun«.
    rationale: Die Umschreibung ist verständlich, glättet aber die antithetische Parallelität und verschiebt den Akzent von Tun/Handeln zu bloßer Entsprechung.
  - severity: low
    issue: »Nach Gottes Willen leben« legt »nach Gott leben« stärker als Willensgehorsam aus.
    rationale: »Gottgemäß leben« ist im Deutschen natürlich und wahrt die offenere Beziehungsaussage.
  - severity: low
    issue: »Eure Gemeinde in Ephesus« ist freier als die Bezeichnung der Gemeinde der Epheser.
    rationale: Die revidierte Formulierung hält die im Zeugen angesprochene ephesische Gemeinde genauer fest, ohne den Sinn zu verändern.
  revised_text: 'Lasst euch also von niemandem täuschen, wie ihr euch ja auch nicht täuschen lasst; denn ihr gehört ganz Gott. Wenn sich nämlich keine Begierde in euch festgesetzt hat, die Macht hat, euch zu quälen, dann lebt ihr wahrhaftig gottgemäß. Ich gebe mich für euch hin und weihe mich als Opfer für die Gemeinde der Epheser, die durch alle Zeitalter hindurch berühmt ist.


    Diejenigen, die vom Fleisch bestimmt sind, können die Dinge des Geistes nicht tun; ebenso können diejenigen, die vom Geist bestimmt sind, die Dinge des Fleisches nicht tun. Genauso wenig kann der Glaube die Dinge der Untreue tun oder die Untreue die Dinge des Glaubens. Ja, selbst das, was ihr dem Fleisch nach tut, ist geistlich; denn ihr tut alles in Jesus Christus.'
  revised_footnotes: []
  revision_rationale: Die Revision beschränkt sich auf sichere, quellennahe Anpassungen. Sie stellt die wiederholte Formel »die Dinge des Geistes/Fleisches tun« wieder her, übersetzt die Gottesbeziehung weniger auslegend mit »gottgemäß« und präzisiert die Adressatenbezeichnung. Die paradoxe Schlussaussage sowie die Opfersprache bleiben unangetastet. Da die unmittelbare griechische Kollation laut Kontext noch aussteht, wird keine weitergehende lexikalische oder dogmatische Festlegung vorgenommen.
