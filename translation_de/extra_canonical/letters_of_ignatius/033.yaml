review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung bewahrt die Argumentationsfolge und die auffälligen Bilder weitgehend gut. Bei ὀσμή/ἐλέγχω ist „wird man euch erkennen“ jedoch zu eng und verschiebt die passivische Prüf- bzw. Überführungsnuance. Der Schlusssatz ergänzt mit „zum Glauben gelangten“ einen Vorgang, den der zugrunde liegende Wortlaut nicht ausdrücklich enthält. Die Formulierung zum neuen Sauerteig folgt sinnvoll der in den Entscheidungen dokumentierten griechischen Lesart; sie weicht allerdings von der geglätteten Formulierung „turn to“ im englischen POB-Audit ab.
  naturalness: Das Deutsch ist insgesamt modernes, würdiges Standarddeutsch. „Lasst euch in ihm salzen“ bleibt absichtlich ungewöhnlich, ist aber als beibehaltenes Bild verständlich. „An eurem Geruch werdet ihr geprüft“ ist zugleich natürlicher und semantisch genauer als die bisherige aktive Umschreibung.
  terminology: „Güte“, „Sauerteig“, „Christsein/Christentum“ und „jüdisch leben“ sind angemessen. Die polemische historische Aussage wird nicht zu einer pauschalen Aussage über jüdische Menschen ausgeweitet; die kontextualisierende Anmerkung ist daher sinnvoll. Im letzten Satz sollte „Menschen jeder Sprache“ die kollektive Wendung πᾶσα γλῶσσα klar wiedergeben, ohne eine zusätzliche Bekehrungsentwicklung einzutragen.
  issues:
  - severity: medium
    issue: Prüfmetapher in Absatz 2 abgeschwächt
    rationale: „Denn an eurem Geruch wird man euch erkennen“ macht aus der passivischen Aussage über Prüfung bzw. Überführung lediglich ein Erkanntwerden. „An eurem Geruch werdet ihr geprüft“ wahrt Bild und Funktion besser.
  - severity: medium
    issue: Zusätzlicher Sinn im Schlusssatz
    rationale: „alle, die mit ihren verschiedenen Sprachen zum Glauben gelangten“ fügt „gelangten“ als Entwicklungs- bzw. Bekehrungsvorgang hinzu. Der Satz sagt vielmehr, dass Menschen jeder Sprache glaubten und zu Gott versammelt wurden.
  - severity: low
    issue: Abweichung zwischen englischem Audit und dokumentierter griechischer Entscheidung bei μεταβάλεσθε
    rationale: Das englische POB glättet zu „turn to“, während die deutsche Fassung und die lexikalische Entscheidung das stärkere Bild einer Verwandlung bewahren. Da die direkte griechische Prüfung laut Kontext noch aussteht, sollte diese Entscheidung als vorläufig dokumentiert bleiben, nicht aber zugunsten der englischen Glättung aufgegeben werden.
  revised_text: 'Darum wollen wir nicht unempfänglich für seine Güte sein. Denn wenn er mit uns so verfahren würde, wie wir handeln, wäre es um uns geschehen. Weil wir nun seine Jünger geworden sind, wollen wir lernen, dem Christsein entsprechend zu leben. Denn wer mit einem anderen Namen als diesem bezeichnet wird, gehört nicht zu Gott.[a]


    Legt daher den schlechten Sauerteig ab, der alt und sauer geworden ist, und lasst euch in neuen Sauerteig verwandeln, nämlich in Jesus Christus.[b] Lasst euch in ihm salzen, damit niemand unter euch verdirbt; denn an eurem Geruch werdet ihr geprüft.[c]


    Es ist widersinnig, von Jesus Christus zu reden und zugleich jüdisch zu leben.[d] Denn nicht das Christentum glaubte an das Judentum, sondern das Judentum an das Christentum; in ihm glaubten Menschen jeder Sprache und wurden zu Gott hin versammelt.[e]'
