base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: de
  text: 'Darum wollen wir nicht unempfänglich für seine Güte sein. Denn wenn er mit uns so verfahren würde, wie wir handeln, wäre es um uns geschehen. Weil wir nun seine Jünger geworden sind, wollen wir lernen, dem Christsein entsprechend zu leben. Denn wer mit einem anderen Namen als diesem bezeichnet wird, gehört nicht zu Gott.[a]


    Legt daher den schlechten Sauerteig ab, der alt und sauer geworden ist, und lasst euch in neuen Sauerteig verwandeln, nämlich in Jesus Christus.[b] Lasst euch in ihm salzen, damit niemand unter euch verdirbt; denn an eurem Geruch wird man euch erkennen.[c]


    Es ist widersinnig, von Jesus Christus zu reden und zugleich jüdisch zu leben.[d] Denn nicht das Christentum setzte sein Vertrauen auf das Judentum, sondern das Judentum auf das Christentum; in ihm kamen alle, die mit ihren verschiedenen Sprachen zum Glauben gelangten, bei Gott zusammen.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher näher: „Wer mit einem anderen Namen über diesen hinaus genannt wird, ist nicht von Gott.“ Gemeint ist wahrscheinlich der Name „Christ“ beziehungsweise die Zugehörigkeit zu Christus; die genaue Reichweite bleibt offen.'
    reason: Der griechische Vergleichsausdruck und der Bezug des Namens sind mehrdeutig.
  - marker: b
    text: Der überlieferte griechische Wortlaut spricht nicht nur vom Hinwenden, sondern davon, „in neuen Sauerteig verwandelt“ zu werden. Das paradoxe Bild bezeichnet Jesus Christus selbst als den neuen Sauerteig.
    reason: Das ungewöhnliche Metapherngemisch soll nicht geglättet werden.
  - marker: c
    text: 'Auch möglich: „an eurem Geruch werdet ihr geprüft beziehungsweise überführt werden“. Das Bild verbindet Salz, Verderben und Geruch in bewusst zugespitzter Weise.'
    reason: Das Verb ἐλέγχω kann erkennen, prüfen, aufdecken oder überführen bedeuten.
  - marker: d
    text: „Jüdisch leben“ gibt ein Verb wieder, das hier offenbar die Übernahme oder Beibehaltung jüdischer religiöser Praxis im Gegensatz zum Bekenntnis zu Christus bezeichnet. Die Aussage ist eine frühchristliche innerreligiöse Polemik und keine pauschale Bewertung jüdischer Menschen.
    reason: Historischer Kontext und Schutz vor einer antisemitischen Fehlanwendung.
  - marker: e
    text: 'Wörtlicher: „in das jede Zunge glaubte und zu Gott hin versammelt wurde“. „Jede Zunge“ meint Menschen aus allen Sprach- und Völkergruppen. Der Satzbau lässt offen, ob sich „in ihm“ auf das Christentum beziehungsweise Christsein oder auf Christus als dessen Mitte bezieht.'
    reason: Die bildhafte Wendung und die mögliche Bezugsmehrdeutigkeit sollen transparent bleiben.
lexical_decisions:
- source_word: χρηστότης
  choice: Güte
  rationale: Gibt die wohlwollende Güte Gottes knapp und würdig wieder.
- source_word: χριστιανισμός
  choice: Christsein / Christentum
  rationale: Im ersten Zusammenhang bezeichnet der Ausdruck die christliche Lebensweise, im letzten den christlichen Glaubensweg als Gegenüber zum Judentum. Die kontextabhängige Variation vermeidet ein unnatürlich abstraktes Deutsch.
- source_word: μεταβάλεσθε εἰς νέαν ζύμην
  choice: lasst euch in neuen Sauerteig verwandeln
  rationale: Bewahrt das auffällige Bild und die passive beziehungsweise mediale Offenheit des griechischen Ausdrucks, statt es zum bloßen Hinwenden abzuschwächen.
- source_word: ἁλίσθητε ἐν αὐτῷ
  choice: Lasst euch in ihm salzen
  rationale: Erhält das ungewöhnliche Salzbild und seine Verbindung mit Bewahrung vor Verderb.
- source_word: ὀσμή
  choice: Geruch
  rationale: Ist die direkte Bildentsprechung; „Wohlgeruch“ würde eine positive Wertung eintragen, die der Prüf- beziehungsweise Erkennungszusammenhang nicht ausdrücklich festlegt.
- source_word: ἰουδαΐζειν
  choice: jüdisch leben
  rationale: Gibt das Verb als Praxis beziehungsweise Lebensweise wieder und vermeidet die missverständliche Aussage, jüdische Identität als solche sei gemeint.
- source_word: πᾶσα γλῶσσα
  choice: alle, die mit ihren verschiedenen Sprachen
  rationale: Entfaltet die semitisch-biblische Wendung verständlich als Menschen aller Sprachen, ohne sie auf anatomische „Zungen“ zu reduzieren.
theological_decisions:
- issue: Zugehörigkeit zu Gott und der Name „Christ“
  choice: „wer mit einem anderen Namen als diesem bezeichnet wird, gehört nicht zu Gott“
  alternative: „wer einen anderen Namen über diesen hinaus trägt, ist nicht von Gott“
  rationale: Die Fassung bewahrt den scharfen Zugehörigkeitsanspruch, ohne genauer festzulegen, ob Ignatius Selbstbezeichnung, Gruppennamen oder religiöse Loyalität meint.
- issue: Verhältnis von Christentum und Judentum
  choice: Die antithetische Aussage wird ohne dogmatische Erweiterung wiedergegeben.
  alternative: Eine ersatztheologische oder heilsgeschichtliche Ausdeutung ausdrücklich in den Text einzubauen.
  rationale: Der polemische historische Wortlaut soll erkennbar bleiben, darf aber nicht stillschweigend zu einer umfassenden Aussage über jüdische Menschen oder ihre bleibende Würde ausgeweitet werden.
- issue: Sammlung bei Gott
  choice: „bei Gott zusammen“
  alternative: „zu Gott versammelt“
  rationale: Das griechische εἰς θεόν kann Zielrichtung oder Bezugsbereich ausdrücken. „Bei Gott zusammen“ ist im Deutschen verständlich, ohne den Vorgang institutionell oder endzeitlich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten frühchristlichen Bildern und pointierter Argumentation. Die Übersetzung stützt sich auf die angegebene mittelrezensionale griechische Textgestalt, soweit sie aus der überlieferten Standardfassung rekonstruierbar ist; wegen des ausdrücklich noch ausstehenden direkten Quellenreviews bleiben textkritische und syntaktische Entscheidungen als vorläufig zu prüfen markiert.
