    issue: Ungepaarte eckige Klammer vor »aß«
    rationale: Die Klammer ist ein Überlieferungs- bzw. Editionsartefakt des bereitgestellten englischen Zeugen. Der zugrunde liegende griechische Satz ist vollständig; im deutschen Zieltext erzeugt das Zeichen einen formalen Defekt und eine unbegründete textkritische Unsicherheit.
  - severity: low
    issue: »wie einer, der im Fleisch lebt« für ὡς σαρκικός
    rationale: Die Formulierung fügt »lebt« hinzu. Gemeint ist, dass er als leiblicher bzw. aus Fleisch bestehender Mensch mit ihnen aß und trank, nicht eine Aussage über fortdauerndes Leben im Fleisch.
