review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gedankengang des griechischen Textes insgesamt zuverlässig wieder: die bleibende Leiblichkeit nach der Auferstehung, die Aufforderung zum Anfassen, die Verbindung mit Fleisch und Blut sowie die geistliche Einheit mit dem Vater. Die ungeschlossene Klammer stammt jedoch nicht aus dem überlieferten griechischen Satz; der griechische Text ist an dieser Stelle vollständig. Außerdem gibt »wie einer, der im Fleisch lebt« ὡς σαρκικός weniger genau wieder, da es ein zusätzliches Moment des Lebens einträgt, statt die leibliche Beschaffenheit auszudrücken.'
  naturalness: Modernes, würdiges Deutsch. »wie ein Mensch aus Fleisch« ist in diesem Zusammenhang idiomatischer als »wie einer, der im Fleisch lebt« und bewahrt die beabsichtigte Gegenüberstellung von leiblichem Essen und Trinken und geistlicher Einheit.
  terminology: »im Fleisch«, »Auferstehung«, »Fleisch und Blut« und »geistlich mit dem Vater vereint« sind angemessen und theologisch nicht überbestimmt. »körperloser Dämon« trifft δαιμόνιον ἀσώματον gut.
  issues:
