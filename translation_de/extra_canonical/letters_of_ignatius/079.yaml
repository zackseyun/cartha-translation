base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: de
  text: 'Denn ich weiß und glaube, dass er auch nach der Auferstehung im Fleisch war.


    Als er zu Petrus und seinen Gefährten kam, sagte er zu ihnen: »Fasst mich an, berührt mich und seht, dass ich kein körperloser Dämon bin.« Sofort berührten sie ihn und glaubten; dabei wurden sie mit seinem Fleisch und seinem Blut verbunden. Deshalb verachteten auch sie den Tod; ja, sie erwiesen sich dem Tod überlegen. Nach seiner Auferstehung aß und trank er mit ihnen wie ein Mensch aus Fleisch, obwohl er geistlich mit dem Vater vereint war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in the flesh
  choice: im Fleisch
  rationale: Bewahrt die körperliche Aussage und ihre christologische Zuspitzung, ohne sie erklärend abzuschwächen.
- source_word: Peter and his company
  choice: Petrus und seine Gefährten
  rationale: Natürliches modernes Deutsch; bezeichnet die Menschen um Petrus, ohne eine institutionelle Bedeutung einzutragen.
- source_word: Lay hold and handle me
  choice: Fasst mich an, berührt mich
  rationale: Gibt die beiden Aufforderungen körperlich und konkret wieder, ohne unnötig altertümliche Sprache.
- source_word: bodiless demon
  choice: körperloser Dämon
  rationale: Formnahe und verständliche Wiedergabe der antiken Aussage.
- source_word: being joined unto his flesh and his blood
  choice: dabei wurden sie mit seinem Fleisch und seinem Blut verbunden
  rationale: Folgt dem bereitgestellten englischen Zeugen und lässt Art und Reichweite der Verbindung bewusst offen.
- source_word: proved superior to death
  choice: erwiesen sich dem Tod überlegen
  rationale: Bewahrt die rhetorische Steigerung gegenüber dem bloßen Verachten des Todes.
- source_word: as one in the flesh
  choice: wie einer, der im Fleisch lebt
  rationale: Natürliches Deutsch, das die Aussage realer Leiblichkeit festhält.
- source_word: spiritually ... united with the Father
  choice: geistlich mit dem Vater vereint
  rationale: Bewahrt die Spannung zwischen leiblichem Handeln und geistlicher Einheit, ohne das Verhältnis dogmatisch näher zu bestimmen.
theological_decisions:
- issue: Leiblichkeit Christi nach der Auferstehung
  choice: Die wiederholte Formulierung »im Fleisch« bleibt erhalten.
  alternative: 'Freier: »wirklich körperlich« oder »mit einem echten Leib«.'
  rationale: Die traditionelle Ausdrucksweise trägt die antitdoketische Pointe und lässt zugleich die genaue Beschaffenheit des auferstandenen Leibes unbestimmt.
- issue: Verbindung der Jünger mit Fleisch und Blut Christi
  choice: »mit seinem Fleisch und seinem Blut verbunden«
  alternative: Eine sakramentale, mystische oder rein physische Deutung ausdrücklich benennen.
  rationale: Der bereitgestellte Zeuge erklärt die Art der Verbindung nicht; die Übersetzung löst diese theologische Mehrdeutigkeit daher nicht auf.
- issue: Geistliche Einheit mit dem Vater
  choice: »geistlich mit dem Vater vereint«
  alternative: »im Geist eins mit dem Vater« oder eine trinitarische Präzisierung.
  rationale: Die Fassung wahrt die Aussage des Zeugen, ohne eine bestimmte spätere dogmatische Terminologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Zentrale frühchristliche Begriffe wie »im Fleisch«, »Auferstehung« und »mit dem Vater vereint« bleiben formnah erhalten. Wegen der noch ausstehenden direkten Prüfung des mittelrezensionellen griechischen Textes ist der Entwurf ausdrücklich vorläufig; insbesondere die Wendung »Fleisch und Blut« ist hier nach dem gelieferten englischen Zeugen wiedergegeben.
