base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: de
  text: 'Da mir berichtet worden ist, dass die Gemeinde in Antiochia in Syrien als Antwort auf euer Gebet und eure herzliche Verbundenheit in Christus Jesus Frieden hat, geziemt es euch, als Gemeinde Gottes einen Diakon zu bestimmen, der als Gesandter Gottes dorthin reist, um ihnen, wenn sie versammelt sind, zu gratulieren und den Namen zu verherrlichen.



    Selig in Jesus Christus ist, wer eines solchen Dienstes für würdig erachtet wird; und auch ihr selbst werdet verherrlicht werden. Wenn ihr es also wollt, ist es euch nicht unmöglich, dies um des Namens Gottes willen zu tun. Denn die nächstgelegenen Gemeinden haben teils Bischöfe, teils Presbyter und Diakone entsandt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tender sympathy (Greek review pending)
  choice: innige Anteilnahme
  rationale: Gibt die herzliche, mitfühlende Verbundenheit natürlich und würdig wieder, ohne sie auf bloßes Mitleid zu verengen.
- source_word: hath peace
  choice: Frieden gefunden hat
  rationale: Im Zusammenhang der Gemeinde von Antiochia bezeichnet die Wendung wahrscheinlich die eingetretene Befriedung; die Formulierung bleibt dennoch nah am überlieferten Zeugnis.
- source_word: God’s ambassador
  choice: Gesandter Gottes
  rationale: Bewahrt den offiziellen Repräsentationscharakter, ohne den Ausdruck anachronistisch politisch auszudeuten.
- source_word: ministration
  choice: Dienst
  rationale: Modernes, allgemein verständliches kirchliches Deutsch; vermeidet das heute missverständliche „Amt“, wo der konkrete Auftrag im Vordergrund steht.
- source_word: bishops … presbyters and deacons
  choice: Bischöfe … Presbyter und Diakone
  rationale: Behält die frühchristlichen Amtsbezeichnungen bei und vermeidet eine konfessionell geprägte Umdeutung von presbyteros als „Priester“ oder bloß „Ältester“.
theological_decisions:
- issue: „den Namen“ ohne ausdrückliche nähere Bestimmung
  choice: den Namen
  alternative: den Namen Gottes
  rationale: Das erste Vorkommen wird entsprechend dem Zeugnis in seiner ehrfürchtigen, möglicherweise bewusst offenen Form bewahrt; eine stillschweigende Präzisierung würde die überlieferte Ausdrucksweise glätten.
- issue: Verherrlichung der Gemeinde
  choice: auch ihr selbst werdet verherrlicht werden
  alternative: auch ihr selbst werdet Ehre empfangen
  rationale: Die stärkere theologische Sprache des Zeugnisses bleibt erhalten, statt sie zu bloßer menschlicher Anerkennung abzuschwächen.
- issue: Amtsbezeichnungen in den Gemeinden
  choice: Bischöfe, Presbyter und Diakone
  alternative: Aufseher, Älteste und Diener
  rationale: Die transliterierten, etablierten Bezeichnungen geben die institutionelle Sprache des frühchristlichen Textes wieder, ohne eine bestimmte spätere Kirchenordnung hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit frühchristlichem Briefcharakter. Der Entwurf stützt sich mangels bereitgestellten griechischen Wortlauts vorläufig auf das gemeinfreie englische Zeugnis; daher wurden keine nicht belegbaren griechischen Einzelheiten behauptet. Satzbau und Wortstellung wurden für heutige Leser behutsam geglättet, während Wiederholungen, Amtsbezeichnungen und theologische Spannungen erhalten bleiben.
