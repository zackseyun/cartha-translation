revisions:
- from: 'Da mir berichtet worden ist, dass die Gemeinde in Antiochia in Syrien als Antwort auf euer Gebet und auf eure innige Anteilnahme in Christus Jesus Frieden gefunden hat, geziemt es euch, als Gemeinde Gottes einen Diakon zu bestimmen, der als Gesandter Gottes dorthin reist. Er soll ihnen, wenn sie versammelt sind, seine Glückwünsche aussprechen und den Namen verherrlichen.[a]


    Selig in Jesus Christus ist, wer eines solchen Dienstes für würdig erachtet wird; und auch ihr selbst werdet verherrlicht werden. Wenn ihr es also wollt, ist es euch nicht unmöglich, dies um des Namens Gottes willen zu tun. So haben auch die nächstgelegenen Gemeinden Bischöfe entsandt, andere wiederum Presbyter und Diakone.[b]'
