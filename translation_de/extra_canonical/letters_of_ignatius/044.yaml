base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: de
  text: 'Bin ich etwa nicht imstande, euch über himmlische Dinge zu schreiben? Doch ich fürchte, euch damit zu schaden, weil ihr noch unmündig seid. Habt also Nachsicht mit mir, damit ihr nicht daran erstickt, weil ihr es noch nicht aufnehmen könnt.


    Denn auch ich kann, obwohl ich gefesselt bin, himmlische Dinge erfassen: die Ordnungen der Engel und die Aufstellungen der Mächte, Sichtbares und Unsichtbares. Doch allein deshalb bin auch ich noch kein Jünger. Denn uns fehlt vieles, damit uns Gott nicht fehlt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly things
  choice: himmlische Dinge
  rationale: Bewahrt die offene, umfassende Bedeutung des überlieferten englischen Zeugnisses und vermeidet eine spekulative Präzisierung.
- source_word: babes
  choice: noch unmündig
  rationale: Gibt das Bild geistlicher Unreife in natürlichem modernem Deutsch wieder, ohne einen wörtlich-biologischen Sinn in den Vordergrund zu stellen.
- source_word: arrays of the angels
  choice: die Ordnungen der Engel
  rationale: „Ordnungen“ vermittelt gegliederte himmlische Formationen in würdigem Deutsch; die genaue griechische Terminologie muss noch am Ausgangstext geprüft werden.
- source_word: musterings of the principalities
  choice: die Aufstellungen der Mächte
  rationale: Bewahrt den militärisch-kosmischen Klang und gibt „principalities“ neutral als überirdische „Mächte“ wieder, ohne eine ausgearbeitete Engelhierarchie einzutragen.
- source_word: disciple
  choice: Jünger
  rationale: Entspricht der frühchristlichen religiösen Bedeutung und bewahrt die pointierte Aussage, dass Erkenntnis allein keinen Jünger ausmacht.
theological_decisions:
- issue: Verhältnis von himmlischer Erkenntnis und Jüngerschaft
  choice: „Doch allein deshalb bin auch ich noch kein Jünger.“
  alternative: „Dennoch bin ich noch kein Jünger.“
  rationale: Die Formulierung hält ausdrücklich fest, dass das Erfassen himmlischer Wirklichkeiten für sich genommen keine Jüngerschaft begründet.
- issue: Paradoxe Schlussaussage über menschlichen Mangel und Gottes Gegenwart
  choice: „Denn uns fehlt vieles, damit uns Gott nicht fehlt.“
  alternative: „Denn vieles mangelt uns, damit es uns nicht an Gott mangelt.“
  rationale: Bewahrt das theologisch gespannte Paradox des Zeugnisses, ohne es erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Da eine unmittelbare Prüfung des griechischen Textes ausdrücklich noch aussteht, folgt der Entwurf vorsichtig dem öffentlichen englischen Zeugen und vermeidet unnötige dogmatische Festlegungen.
