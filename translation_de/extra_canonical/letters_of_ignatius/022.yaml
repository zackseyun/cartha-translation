base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: de
  text: 'Ich gebe mich ganz für euch hin und für die, die ihr zur Ehre Gottes nach Smyrna gesandt habt. Von dort schreibe ich euch auch und danke dem Herrn; Polykarp liebe ich ebenso wie euch. Denkt an mich, wie auch Jesus Christus an euch denken möge.


    Betet für die Gemeinde in Syrien, von wo ich als Gefangener nach Rom geführt werde. Ich bin der Allerletzte unter den dortigen Gläubigen, wurde aber für würdig erachtet, zur Ehre Gottes befunden zu werden.[a] Lebt wohl in Gott, dem Vater, und in Jesus Christus, unserer gemeinsamen Hoffnung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zugrunde liegende englische Zeugenübersetzung lautet wörtlich sinngemäß: „gemäß dem Umstand, dass ich für würdig erachtet wurde, zur Ehre Gottes befunden zu werden“. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Die überlieferte englische Formulierung ist syntaktisch und semantisch ungewöhnlich; die Fußnote kennzeichnet den vorläufigen Charakter der Wiedergabe.
lexical_decisions:
- source_word: I am devoted to you
  choice: Ich gebe mich ganz für euch hin
  rationale: Die hingebungsvolle, opferbereite Haltung wird in natürlichem, würdigem Deutsch wiedergegeben, ohne eine spezifische kultische Bedeutung festzulegen.
- source_word: church
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die örtliche Gemeinschaft der Glaubenden idiomatisch und ohne konfessionelle Verengung.
- source_word: the very last of the faithful
  choice: der Allerletzte unter den dortigen Gläubigen
  rationale: Bewahrt die starke Selbsterniedrigung des Zeugen und versteht „faithful“ als Personenbezeichnung.
- source_word: our common hope
  choice: unserer gemeinsamen Hoffnung
  rationale: Gibt den gemeinschaftlichen und christologisch bezogenen Charakter der Hoffnung unmittelbar wieder.
theological_decisions:
- issue: Bitte um das Erinnern durch Jesus Christus
  choice: wie auch Jesus Christus an euch denken möge
  alternative: wie ich wünsche, dass auch Jesus Christus an euch denkt
  rationale: Der Wunsch- beziehungsweise Gebetscharakter bleibt erhalten, ohne die Aussage in eine sichere Zusage umzudeuten.
- issue: Würdigkeit und Ehre Gottes
  choice: wurde aber für würdig erachtet, zur Ehre Gottes befunden zu werden
  alternative: da ich für würdig befunden wurde, Gott Ehre zu bereiten
  rationale: Die schwerfällige und mehrdeutige Beziehung zwischen Würdigkeit, Befundenwerden und Gottes Ehre wird nicht stillschweigend kausal oder verdienstlich aufgelöst.
translation_notes:
  register: Modernes Standarddeutsch in würdigem brieflichem Ton. Die Übersetzung ist vorläufig, da für diesen Entwurf nur der gemeinfreie englische Zeuge vorliegt und die direkte Prüfung der mittelrezensionellen griechischen Überlieferung noch aussteht.
