review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von „I am devoted to you“ als „Ich gebe mich ganz für euch hin“ schwächt die prägnante, lebensverpflichtende Bildsprache des griechischen Ausdrucks ἀντίψυχον ab. „Ich setze mein Leben für euch ein“ bringt diese Aussage im heutigen Deutsch klarer zur Geltung, ohne eine bestimmte Sühne- oder Stellvertretungslehre einzutragen. Die adversative Ergänzung „aber“ im zweiten Absatz ist im Zeugen nicht begründet. Die Schlusswendung über das Würdigbefundenwerden sollte als Zweck-/Zielangabe formuliert bleiben.
  naturalness: Der Entwurf ist überwiegend verständlich und angemessen würdig. „wurde aber für würdig erachtet, zur Ehre Gottes befunden zu werden“ ist jedoch sowohl syntaktisch schwerfällig als auch durch „aber“ unnötig interpretierend. Die revidierte Fassung ist flüssiger, ohne den gehobenen Briefstil aufzugeben.
  terminology: „Gemeinde“, „Gläubige“, „Jesus Christus“ und „unsere gemeinsame Hoffnung“ sind sachgerecht. Polykarp ist die im Deutschen übliche Namensform. Die Fußnote erläutert die markante Eingangsformulierung philologisch und zurückhaltend.
  issues:
  - severity: medium
    issue: Die Eingangsformulierung ist semantisch abgeschwächt.
    rationale: „Ich gebe mich ganz für euch hin“ beschreibt allgemeine Hingabe, während ἀντίψυχον eine besonders starke Lebensverpflichtung bzw. Einstehensformel ausdrückt.
  - severity: medium
    issue: „aber“ im Satz über das Würdigbefundenwerden fügt einen unbelegten Gegensatz ein.
    rationale: Weder der englische Zeuge noch die überlieferte Satzführung erfordern einen adversativen Zusammenhang.
  - severity: low
    issue: Die bisherige Fußnote fokussiert eine unnötig wörtliche, im Deutschen kaum verständliche Konstruktion.
    rationale: Eine idiomatische Zielangabe kann den überlieferten Sinn angemessen wiedergeben; hilfreicher ist eine Anmerkung zur markanten Eingangsmetapher.
  revised_text: 'Ich setze mein Leben für euch ein[a] und für diejenigen, die ihr zur Ehre Gottes nach Smyrna gesandt habt. Von dort aus schreibe ich euch auch, danke dem Herrn und liebe Polykarp ebenso wie euch. Denkt an mich, so wie ich wünsche, dass auch Jesus Christus an euch denkt.


    Betet für die Gemeinde in Syrien, von wo ich als Gefangener nach Rom geführt werde – ich, der ich der Allerletzte unter den dortigen Gläubigen bin –, damit ich zur Ehre Gottes für würdig befunden werde. Lebt wohl in Gott, dem Vater, und in Jesus Christus, unserer gemeinsamen Hoffnung.'
  revised_footnotes:
  - marker: a
    text: Wörtlich steht hier eine besonders nachdrückliche Formulierung, die etwa ein Einstehen mit dem eigenen Leben ausdrückt. Die Übersetzung gibt ihre verpflichtende Bildsprache wieder, ohne eine bestimmte theologische Deutung festzulegen.
    reason: Erläutert die ungewöhnlich starke Eingangsformulierung, deren Bedeutung über bloße persönliche Zuneigung hinausgeht.
  revision_rationale: Die Revision stärkt die Wiedergabe der ersten, im griechischen Wortlaut besonders markanten Selbstverpflichtung, beseitigt den unbegründeten Gegensatz im zweiten Absatz und glättet die Schlusskonstruktion in idiomatisches modernes Standarddeutsch. Satzbau, Gebetscharakter und der zurückhaltend-briefliche Registerton bleiben erhalten.
