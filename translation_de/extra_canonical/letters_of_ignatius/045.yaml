base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: de
  text: 'Darum ermahne ich euch – doch nicht ich, sondern die Liebe Jesu Christi: Nehmt nur christliche Nahrung zu euch und haltet euch von fremdartigem Gewächs fern, das heißt von Irrlehre.


    Denn diese Leute mischen sogar Gift unter Jesus Christus und täuschen andere durch den Anschein von Redlichkeit. Sie gleichen Menschen, die ein tödliches Mittel in Honigwein verabreichen, sodass jemand, der nichts davon weiß und nichts Böses ahnt, mit verderblichem Genuss den Tod in sich hineintrinkt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: christliche Nahrung
  rationale: Bewahrt das Bild der Nahrung und gibt den Gegensatz zum fremdartigen Gewächs natürlich wieder.
- source_word: strange herbage
  choice: fremdartiges Gewächs
  rationale: Erhält die Pflanzenmetapher, ohne sie vorschnell auf eine bestimmte botanische Vorstellung festzulegen.
- source_word: heresy
  choice: Irrlehre
  rationale: Eine verständliche, konfessionell möglichst unbelastete Wiedergabe des kirchengeschichtlichen Begriffs.
- source_word: mingle poison with Jesus Christ
  choice: Gift unter Jesus Christus mischen
  rationale: Bewahrt die schroffe und theologisch spannungsvolle Mischmetapher, statt sie erklärend aufzulösen.
- source_word: show of honesty
  choice: Anschein von Redlichkeit
  rationale: Gibt die vorgetäuschte Vertrauenswürdigkeit in würdigem, modernem Deutsch wieder.
- source_word: honeyed wine
  choice: Honigwein
  rationale: Erhält das antike Getränkebild knapp und verständlich.
- source_word: drinketh in death with a baneful delight
  choice: mit verderblichem Genuss den Tod in sich hineintrinkt
  rationale: Bewahrt sowohl den sinnlichen Reiz als auch die tödliche Folge des Bildes.
theological_decisions:
- issue: Verhältnis der Ermahnung zur Liebe Jesu Christi
  choice: „doch nicht ich, sondern die Liebe Jesu Christi“
  alternative: „nicht ich ermahne euch, sondern die Liebe Jesu Christi“
  rationale: Die knappe Gegenüberstellung des Zeugnisses bleibt erhalten, ohne näher zu bestimmen, ob Christi eigene Liebe oder die auf Christus gerichtete Liebe gemeint ist.
- issue: Identifizierung des fremdartigen Gewächses
  choice: „das heißt von Irrlehre“
  alternative: „welches Irrlehre ist“
  rationale: Macht die Apposition im Deutschen verständlich, ohne den Begriff weiter dogmatisch einzugrenzen.
- issue: Jesus Christus in der Giftmetapher
  choice: Wörtlich-bildhafte Formulierung beibehalten
  alternative: „sie vermischen ihre Irrlehre mit Lehren über Jesus Christus“
  rationale: Eine erklärende Paraphrase würde die absichtlich befremdliche Spannung des überlieferten Bildes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Nahrungs-, Pflanzen-, Gift- und Getränkemetaphorik wurde konsequent bewahrt. Da nur ein gemeinfreier englischer Zeuge vorliegt und die direkte Prüfung des griechischen Textes noch aussteht, ist die Fassung als quellennahe vorläufige Übersetzung zu behandeln.
