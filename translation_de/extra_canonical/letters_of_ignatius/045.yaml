source:
  text: 'I exhort you therefore-yet not I, but the love of Jesus Christ-take ye only Christian food, and abstain from strange herbage, which is heresy:


    for these men do even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who knoweth it not, fearing nothing, drinketh in death with a baneful delight.'
