- from: 'Haltet euch fern von schädlichen Pflanzen, die Jesus Christus nicht anbaut; denn sie sind keine Pflanzung des Vaters. Nicht als hätte ich bei euch Spaltung gefunden, sondern vielmehr Sichtung.[a]


