base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: de
  text: 'Haltet euch von schädlichen Kräutern fern, die nicht von Jesus Christus angebaut werden; denn sie sind keine Pflanzung des Vaters. Nicht, dass ich bei euch Spaltung vorgefunden hätte, sondern vielmehr Sichtung.[a]


    Denn alle, die zu Gott und Jesus Christus gehören, halten zum Bischof; und alle, die umkehren und zur Einheit der Gemeinde kommen, werden ebenfalls zu Gott gehören, damit sie nach Jesus Christus leben. Lasst euch nicht täuschen, meine Brüder!


    Wer einem folgt, der Spaltung verursacht, wird das Reich Gottes nicht erben. Wer nach einer fremden Auffassung lebt, stimmt dem Leiden Christi nicht zu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene Wort kann ein Durchseihen oder Aussondern bezeichnen. Dem Satz zufolge liegt bei den Adressaten nicht „Spaltung“, sondern eine solche unterscheidende Sichtung vor; die genaue Nuance bleibt unsicher.
    reason: Bewahrt die ungewöhnliche und mehrdeutige Wortwahl, ohne sie weiter auszulegen.
  - marker: b
    text: 'Wörtlich: „stimmt dem Leiden nicht zu“ bzw. „ist nicht mit dem Leiden einverstanden“. Mit „dem Leiden“ ist im Zusammenhang das Leiden Christi gemeint. Die bereitgestellte englische Zeugenfassung hat hier weiter gefasst: „has no fellowship with the passion“.'
    reason: Dokumentiert die genauere Bedeutung von συγκατατίθεται und die Abweichung der englischen Zeugenfassung.
lexical_decisions:
- source_word: κακαὶ βοτάναι (im griechischen Überlieferungstext; Quellenprüfung noch ausstehend)
  choice: schädliche Pflanzen
  rationale: Bewahrt das landwirtschaftliche Bild und gibt die negative Wertung natürlich wieder, ohne sie vorschnell auf bestimmte Personen oder Lehren festzulegen.
- source_word: γεωργεῖ
  choice: anbaut
  rationale: Setzt das Bild von Ackerbau und Pflanzung im Deutschen konsequent fort.
- source_word: ἀποδιϋλισμός
  choice: Sichtung
  rationale: Der seltene Ausdruck bezeichnet ein Durchseihen beziehungsweise Ausscheiden. „Sichtung“ wahrt den Kontrast zu „Spaltung“, bleibt aber wie der Ausgangsausdruck erklärungsbedürftig.
- source_word: μετὰ τοῦ ἐπισκόπου
  choice: stehen zum Bischof
  rationale: Gibt die Zugehörigkeit oder Verbundenheit wieder, ohne bloße räumliche Nähe auszudrücken.
- source_word: ἑνότης τῆς ἐκκλησίας
  choice: Einheit der Gemeinde
  rationale: „Gemeinde“ ist im modernen Deutsch verständlich und lässt den örtlichen Zusammenhang erkennen; der umfassendere Sinn von „Kirche“ bleibt grundsätzlich möglich.
- source_word: ἀλλοτρία γνώμη
  choice: fremde Lehre
  rationale: Im polemischen Zusammenhang ist eine fremde Auffassung oder Lehrmeinung gemeint; „Lehre“ ist idiomatisch, während die Fremdheit ausdrücklich erhalten bleibt.
- source_word: πάθος
  choice: Leiden Christi
  rationale: Der Kontext verweist auf das Leiden Jesu; die Ergänzung „Christi“ macht den deutschen Bezug eindeutig, ohne das Motiv weiter auszudeuten.
theological_decisions:
- issue: Verhältnis zum Bischof als Kennzeichen der Zugehörigkeit zu Gott und Christus
  choice: 'Die starke Aussage des Textes wird unmittelbar wiedergegeben: „stehen zum Bischof“.'
  alternative: „sind beim Bischof“ oder „halten sich an den Bischof“
  rationale: Die Fassung wahrt den kirchlichen Einheitsgedanken, ohne daraus eine über den Wortlaut hinausgehende Amtslehre abzuleiten.
- issue: Rückkehr zur Einheit der ἐκκλησία
  choice: „zur Einheit der Gemeinde kommen“
  alternative: „in die Einheit der Kirche eintreten“
  rationale: „Kommen“ entspricht der Bewegungsmetapher und vermeidet, die Aussage technisch-sakramental oder konfessionell festzulegen.
- issue: Beziehung zum Leiden Christi
  choice: „steht nicht in Gemeinschaft mit dem Leiden Christi“
  alternative: „stimmt dem Leiden Christi nicht zu“ oder „hat keinen Anteil am Leiden Christi“
  rationale: Die überlieferte englische Zeugnisfassung spricht von fellowship; die deutsche Formulierung bewahrt den Gedanken fehlender Verbundenheit. Wegen der noch ausstehenden direkten griechischen Quellenprüfung wird die mögliche Nuance von Zustimmung in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Sätzen. Die Agrarmetaphorik bleibt erhalten. Archaische Formen wie „ein jeglicher“ oder „wandeln“ werden vermieden. Da die bereitgestellte Datengrundlage ausdrücklich eine noch ausstehende direkte Prüfung des griechischen Textes nennt, werden besonders unsichere Stellen transparent markiert.
