base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: de
  text: 'Denn wenn ihr euch dem Bischof unterordnet wie Jesus Christus, wird mir deutlich, dass ihr nicht nach menschlicher Art lebt, sondern nach Jesus Christus. Er ist für uns gestorben, damit ihr durch den Glauben an seinen Tod dem Sterben entgeht.


    Darum ist es notwendig, dass ihr, wie ihr es ja tut, nichts ohne den Bischof unternehmt. Ordnet euch aber auch dem Ältestenrat unter wie den Aposteln Jesu Christi, unserer Hoffnung. Wenn wir in ihm leben, werden wir auch in ihm erfunden werden.[a]


    Auch die Diakone, die mit den Geheimnissen Jesu Christi betraut sind,[b] müssen darauf bedacht sein, allen in jeder Hinsicht zu gefallen. Denn sie sind nicht Diakone von Speisen und Getränken, sondern Diener der Gemeinde Gottes. Darum müssen sie sich vor Anschuldigungen hüten wie vor Feuer.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn wir in ihm leben, werden wir uns auch in ihm wiederfinden.“'
    reason: Das griechische „gefunden werden“ kann sowohl eschatologisch-passiv als auch idiomatischer im Sinn von „sich erweisen/wiederfinden“ verstanden werden.
  - marker: b
    text: 'Wörtlich: „die Diakone der Geheimnisse Jesu Christi sind“. „Geheimnisse“ ist hier nicht ohne Weiteres auf die später so bezeichneten Sakramente zu beschränken.'
    reason: Bewahrt die lexikalische und historische Offenheit von μυστήρια.
  - marker: c
    text: „Anschuldigungen“ kann auch „Anklagen“ oder „Vorwürfe“ bedeuten; möglicherweise ist sowohl eigenes Fehlverhalten als auch der daraus entstehende Vorwurf im Blick.
    reason: ἐγκλήματα besitzt einen forensischen Beiklang und ist breiter als bloßes „Tadeln“.
lexical_decisions:
- source_word: ὑποτάσσησθε / ὑποτάσσεσθε
  choice: euch … unterordnet / Ordnet euch … unter
  rationale: Gibt den Gedanken freiwilliger Einordnung genauer wieder als das allgemeinere „gehorchen“ und bewahrt die parallele Beziehung zum Bischof und zum Ältestenrat.
- source_word: ἐπίσκοπος
  choice: Bischof
  rationale: Der historisch und kirchlich etablierte deutsche Ausdruck für das Leitungsamt; die frühchristliche Ausprägung des Amtes wird dadurch nicht weiter definiert.
- source_word: πρεσβυτέριον
  choice: Ältestenrat
  rationale: Bezeichnet hier das Kollegium der Presbyter und nicht ein Gebäude; „Ältestenrat“ ist für heutige Leser verständlicher als das fachsprachliche „Presbyterium“.
- source_word: κατὰ ἄνθρωπον … κατὰ Ἰησοῦν Χριστόν
  choice: nach menschlicher Art … nach Jesus Christus
  rationale: Bewahrt den auffälligen Gegensatz und die christologische Ausrichtung, ohne „nach Menschen“ unnatürlich wörtlich wiederzugeben.
- source_word: τὸ ἀποθανεῖν
  choice: dem Sterben
  rationale: Spiegelt den verbal formulierten Ausdruck und erhält die Spannung zwischen Christi Tod und dem eigenen Sterben; „dem Tod“ wäre glatter, aber weniger genau.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: Bewahrt die semantische Weite des griechischen Ausdrucks und vermeidet die spätere, enger umrissene Bedeutung von „Sakramente“.
- source_word: ἐκκλησία θεοῦ
  choice: Gemeinde Gottes
  rationale: „Gemeinde“ bezeichnet die versammelte Gemeinschaft hier natürlich, ohne den Ausdruck vorschnell auf eine spätere institutionelle Gestalt einzuengen.
- source_word: ἐγκλήματα
  choice: Anschuldigungen
  rationale: Der Ausdruck kann Anklagen oder Vorwürfe bezeichnen. Diese Wiedergabe vermeidet die moralische Verengung des englischen „blame“ auf bloße Tadelnswürdigkeit.
theological_decisions:
- issue: Unterordnung unter den Bischof „wie Jesus Christus“
  choice: Die Vergleichsform bleibt ohne erklärende Ergänzung stehen.
  alternative: „als wäre er Jesus Christus“ oder „wie ihr euch Jesus Christus unterordnet“
  rationale: Der knappe griechische Vergleich ist auslegungsfähig. Eine Ergänzung würde entweder eine Identifikation oder nur die Art der Unterordnung festlegen, die der Wortlaut selbst nicht ausdrücklich ausführt.
- issue: „Jesus Christus, unsere Hoffnung“ und der Bezug von „in ihm“
  choice: „Jesus Christus, unserer Hoffnung. Wenn wir in ihm leben …“
  alternative: Den Bezug auf „Hoffnung“ oder auf die Apostel umdeuten
  rationale: Der nächstliegende personale Bezug ist Jesus Christus. Die Formulierung wahrt zugleich die syntaktische Dichte des Satzes.
- issue: Entrinnen vor dem Sterben durch Glauben an Christi Tod
  choice: „damit ihr durch den Glauben an seinen Tod dem Sterben entgeht“
  alternative: „damit ihr durch seinen Tod ewiges Leben habt“
  rationale: Die paradoxe Form des Ausgangstextes wird bewahrt, ohne Art und Zeitpunkt des gemeinten Entrinnens dogmatisch auszudeuten.
- issue: Dienst der Diakone an den „Geheimnissen“
  choice: Keine Gleichsetzung mit einem bestimmten späteren Sakramentsverständnis
  alternative: „Spender der Sakramente Jesu Christi“
  rationale: Der frühchristliche Ausdruck ist weiter und soll nicht durch spätere konfessionelle Terminologie eingeengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Amtsbezeichnungen „Bischof“ und „Diakone“ bleiben traditionell, während „Ältestenrat“ das kollegiale πρεσβυτέριον allgemeinverständlich wiedergibt. Der Entwurf berücksichtigt die rekonstruierbare griechische Fassung der mittleren Rezension; da die bereitgestellten Metadaten die direkte Quellenprüfung als noch ausstehend kennzeichnen, sollten Wortlaut und Interpunktion vor der Endpublikation nochmals anhand einer kritischen griechischen Ausgabe kollationiert werden.
