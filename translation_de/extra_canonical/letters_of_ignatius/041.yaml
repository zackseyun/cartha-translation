review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des überlieferten englischen Zeugen zutreffend wieder: die Zuordnung zum Bischof und Presbyterium, Christi Tod und das Entrinnen vor dem Sterben, den Dienst der Diakone sowie die Warnung vor Vorwürfen. Eine sichere Korrektur ist jedoch bei „wie Jesus Christus“ nötig: Dies kann im Deutschen bedeuten, Jesus selbst sei das Vorbild des Sich-Unterordnens. Der Vergleich betrifft hier vielmehr den Maßstab bzw. die Weise des Gehorsams gegenüber dem Bischof. Ferner ist „in ihm erfunden werden“ kein heutiger deutscher Ausdruck für „be found in him“.'
  naturalness: Der Text ist überwiegend klar und würdig. „Wie Jesus Christus“ und „in ihm erfunden werden“ sind jedoch missverständlich beziehungsweise unnatürlich. „In ihm gefunden werden“ ist zugleich idiomatischer und näher am Zeugen. „Vorwürfen“ ist im Kontext einer zu meidenden negativen Beurteilung natürlicher als „Anschuldigungen“, ohne den möglichen forensischen Beiklang völlig auszuschließen.
  terminology: „Bischof“, „Ältestenrat“, „Diakone“, „Geheimnisse“ und „Gemeinde Gottes“ sind vertretbar. „Ältestenrat“ verdeutlicht den kollegialen Charakter von πρεσβυτέριον. „Geheimnisse“ wahrt die historische Offenheit von μυστήρια und legt kein späteres Sakramentsverständnis fest. Die englische POB-Fassung bestätigt insbesondere „in his death“, „every way“ und „blame“; die deutsche Fassung bleibt bei diesen Punkten ohne zusätzliche dogmatische Deutung.
  issues:
  - severity: medium
    issue: „wie Jesus Christus“ nach „euch dem Bischof unterordnet“
    rationale: Die deutsche Konstruktion kann aussagen, Jesus Christus habe sich selbst untergeordnet. Gemeint ist nach dem englischen Zeugen der Gehorsam gegenüber dem Bischof in Analogie zum Gehorsam gegenüber Christus. „als ob es Jesus Christus gälte“ stellt diese Bezugsrichtung klar, ohne eine Identifikation von Bischof und Christus zu behaupten.
  - severity: medium
    issue: „werden wir auch in ihm erfunden werden“
    rationale: „Erfunden werden“ bedeutet im modernen Deutsch gewöhnlich „ausgedacht/entwickelt werden“ und verfehlt „be found“. „in ihm gefunden werden“ ist die übliche und quellentreue Formulierung.
  - severity: low
    issue: Fußnote a bietet „wiederfinden“ als Alternative
    rationale: „Sich wiederfinden“ fügt eine reflexive Nuance hinzu, die der englische Zeuge nicht verlangt. Die korrigierte Hauptformulierung ist verständlich; eine Fußnote ist hierfür nicht nötig.
  - severity: low
    issue: „Anschuldigungen“ für „blame“
    rationale: „Anschuldigungen“ ist möglich, klingt aber enger forensisch. „Vorwürfen“ deckt den breiteren Sinn des englischen Zeugen natürlicher ab.
  revised_text: 'Denn wenn ihr dem Bischof gehorcht, als ob es Jesus Christus gälte, wird mir deutlich, dass ihr nicht nach menschlicher Art lebt, sondern nach Jesus Christus, der für uns gestorben ist, damit ihr durch den Glauben an seinen Tod dem Sterben entgeht.


    Darum ist es notwendig, dass ihr, wie ihr es ja tut, nichts ohne den Bischof unternehmt. Ordnet euch aber auch dem Ältestenrat unter wie den Aposteln Jesu Christi, unserer Hoffnung. Denn wenn wir in ihm leben, werden wir auch in ihm gefunden werden.


    Auch die Diakone der Geheimnisse Jesu Christi müssen allen in jeder Hinsicht gefallen. Denn sie sind nicht Diakone von Speisen und Getränken, sondern Diener der Gemeinde Gottes. Darum müssen sie sich vor Vorwürfen hüten wie vor Feuer.'
  revised_footnotes: []
  revision_rationale: Die Revision beseitigt zwei sichere deutsche Fehl- bzw. Missverständnisse, ohne den Gedankengang zu erweitern. Sie folgt vorrangig dem bereitgestellten englischen Zeugen und seiner POB-Audit-Fassung. Da eine unmittelbare Kollation mit einer kritischen griechischen Ausgabe laut Kontext noch aussteht, werden keine weitergehenden textkritischen oder dogmatischen Festlegungen vorgenommen. Die nicht erforderlichen Fußnoten werden entfernt, weil sie entweder eine nicht notwendige alternative Sinngebung einführen oder lediglich bereits im Text ausreichend offene Terminologie erläutern.
