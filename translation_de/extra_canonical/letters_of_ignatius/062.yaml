base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: de
  text: 'Denkt in euren Gebeten an die Gemeinde in Syrien, die an meiner Stelle Gott zum Hirten hat. Jesus Christus allein wird ihr Bischof sein – er und eure Liebe.


    Ich aber schäme mich, einer von ihnen genannt zu werden; denn ich bin es nicht wert, da ich der Allerletzte von ihnen und eine Fehlgeburt bin. Doch ich habe Erbarmen gefunden, damit ich jemand werde, wenn ich wirklich zu Gott gelange.


    Mein Geist grüßt euch, ebenso die Liebe der Gemeinden, die mich im Namen Jesu Christi aufgenommen haben, nicht wie einen bloßen Durchreisenden. Denn selbst die Gemeinden, die nicht auf meinem Weg dem Fleisch nach lagen, zogen mir von Stadt zu Stadt voraus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »dem Fleisch nach« bezeichnet hier wohl den äußeren, leiblichen Reiseweg. Gemeint ist, dass auch Gemeinden außerhalb seiner unmittelbaren Reiseroute ihm von Stadt zu Stadt vorausgingen; in welcher Weise dies geschah, bleibt offen.
    reason: Die wörtlich bewahrte Wendung ist im modernen Deutschen erklärungsbedürftig. Die Erläuterung beschränkt sich auf das im Text Gesagte und ergänzt keine nicht belegte Form der Unterstützung oder Vermittlung.
lexical_decisions:
- source_word: ποιμήν / ποιμαίνειν (im griechischen Überlieferungshintergrund; Quellenprüfung ausstehend)
  choice: Gott zum Hirten hat
  rationale: Bewahrt das pastorale Bild des Zeugen und formuliert zugleich natürlich auf Deutsch.
- source_word: ἐπίσκοπος (im griechischen Überlieferungshintergrund; Quellenprüfung ausstehend)
  choice: als Bischof vorstehen
  rationale: Erhält den frühchristlichen Amtstitel, vermeidet aber die im Deutschen schwer verständliche Aussage, Christus werde die Gemeinde schlicht »bischöflich verwalten«.
- source_word: ἔκτρωμα (wahrscheinlicher griechischer Ausdruck; Quellenprüfung ausstehend)
  choice: Fehlgeburt
  rationale: Gibt die schroffe paulinisch geprägte Selbstbezeichnung wieder, ohne sie zu beschönigen.
- source_word: καταντήσω εἰς θεόν (wahrscheinlicher griechischer Ausdruck; Quellenprüfung ausstehend)
  choice: zu Gott gelange
  rationale: Bewahrt das Zielmotiv und lässt offen, wie dieses Gelangen im Zusammenhang von Martyrium und Vollendung genau zu verstehen ist.
- source_word: κατὰ σάρκα (wahrscheinlicher griechischer Ausdruck; Quellenprüfung ausstehend)
  choice: dem Fleisch nach
  rationale: Bewahrt die markierte, theologisch aufgeladene Ausdrucksweise statt sie stillschweigend zu »meine Reiseroute« zu verflachen.
theological_decisions:
- issue: Gott als Hirte und Christus als Bischof der syrischen Gemeinde
  choice: Die beiden Bilder und ihre Spannung bleiben nebeneinander stehen.
  alternative: Die Aussage zu einer allgemeinen göttlichen Leitung der Gemeinde harmonisieren.
  rationale: Der Text unterscheidet die Hirten- und Bischofsaussage; eine Harmonisierung würde seine ungewöhnliche Ekklesiologie glätten.
- issue: »er und eure Liebe«
  choice: Die syntaktische Spannung wird wörtlich bewahrt.
  alternative: »Jesus Christus allein, zusammen mit eurer Liebe« oder »eure Liebe wird ihm dabei helfen«.
  rationale: Der überlieferte Gedankengang verbindet Christi alleinige Aufsicht überraschend mit der Liebe der Adressaten; eine eindeutige funktionale Deutung wäre spekulativ.
- issue: »wenn ich wirklich zu Gott gelange«
  choice: Die Bedingtheit bleibt erhalten.
  alternative: »wenn ich durch das Martyrium zu Gott komme«.
  rationale: Der Zusammenhang legt das Martyrium nahe, doch der vorliegende Wortlaut nennt es hier nicht ausdrücklich.
- issue: Selbstbezeichnung als Fehlgeburt
  choice: Das harte Bild bleibt ungemildert.
  alternative: »zu spät Geborener« oder »unzeitig Geborener«.
  rationale: »Fehlgeburt« wahrt die Demut und Anstößigkeit des Bildes, die an 1 Korinther 15,8 erinnert, ohne die Anspielung im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Fassung orientiert sich mangels vorgelegten griechischen Wortlauts am öffentlichen englischen Zeugen; alle rückerschlossenen griechischen Bezüge sind daher ausdrücklich vorläufig und bedürfen direkter Prüfung an der mittleren griechischen Rezension. Archaismen wie »hath« werden nicht nachgebildet, markierte frühchristliche Bilder und Amtssprache jedoch bewahrt.
