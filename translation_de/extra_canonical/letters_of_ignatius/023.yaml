base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: de
  text: 'Ignatius, der auch Theophorus heißt, an die Gemeinde in Magnesia am Mäander, die durch die Gnade Gottes, des Vaters, in Christus Jesus, unserem Retter, gesegnet ist: In ihr grüße ich die Gemeinde und wünsche ihr in Gott, dem Vater, und in Jesus Christus reichen Gruß.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die Quellenangabe kennzeichnet ausdrücklich die begrenzte Grundlage des Entwurfs und verhindert den Eindruck einer bereits abgeschlossenen Übersetzung aus dem Griechischen.
lexical_decisions:
- source_word: Theophorus
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname bewahrt; seine mögliche Bedeutung wird wegen der noch ausstehenden Prüfung des griechischen Wortlauts nicht im Haupttext festgelegt.
- source_word: blessed
  choice: gesegnete
  rationale: Gibt den Segenscharakter der Aussage natürlich und würdig wieder, ohne näher zu bestimmen, worin dieser Segen besteht.
- source_word: Savior
  choice: Retter
  rationale: Modernes, allgemein verständliches deutsches Wort mit dem theologischen Gehalt des überlieferten Ausdrucks.
- source_word: abundant greeting
  choice: herzliche Grüße
  rationale: Eine natürliche deutsche Briefformel; das etwas ungewöhnliche englische Zeugnis wird nicht mechanisch als mengenmäßiger Überfluss wiedergegeben.
- source_word: Magnesia on the Maeander
  choice: Magnesia am Mäander
  rationale: Die im Deutschen übliche geografische Bezeichnung unterscheidet die Stadt von anderen Orten namens Magnesia.
theological_decisions:
- issue: Bezug von „in whom“
  choice: „In ihm“ bezieht sich im Satz unmittelbar auf Christus Jesus.
  alternative: Die Wendung könnte allgemeiner als Gruß innerhalb der Gemeinschaft mit Christus verstanden werden.
  rationale: Der nächstliegende grammatische Bezug im überlieferten englischen Zeugnis ist Christus; die knappe Formulierung bewahrt zugleich die inhaltliche Weite.
- issue: Empfängerin des Briefes
  choice: „Gemeinde“ wird ausdrücklich ergänzt.
  alternative: Eine feminine pronominale Form wie „an sie, die …“ könnte die Form des Zeugnisses enger nachbilden.
  rationale: Im Deutschen macht die ausdrückliche Nennung der Gemeinde den Satz klar und natürlich; das Zeugnis selbst identifiziert die Empfängerin anschließend als Gemeinde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in der Form eines antiken Briefpräskripts. Die lange Satzstruktur bleibt erkennbar, wird aber durch Doppelpunkt und klaren Gemeindebezug lesbarer gestaltet.
