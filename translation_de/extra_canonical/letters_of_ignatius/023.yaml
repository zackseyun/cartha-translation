revisions:
- from: 'Ignatius, der auch Theophorus heißt, an die durch die Gnade Gottes des Vaters in Christus Jesus, unserem Retter, gesegnete Gemeinde: In ihm grüße ich die Gemeinde in Magnesia am Mäander und wünsche ihr herzliche Grüße in Gott dem Vater und in Jesus Christus.[a]'
  to: 'Ignatius, der auch Theophorus heißt, an die Gemeinde in Magnesia am Mäander, die durch die Gnade Gottes, des Vaters, in Christus Jesus, unserem Retter, gesegnet ist: In ihr grüße ich die Gemeinde und wünsche ihr in Gott, dem Vater, und in Jesus Christus reichen Gruß.[a]'
  rationale: 'Die Satzglieder wurden für ein klares deutsches Präskript umgestellt. Entscheidend ist die Korrektur von „In ihm“ zu „In ihr“: Sie folgt dem femininen griechischen ἐν ᾗ und bewahrt die Selbstbezeichnung der Empfängergemeinde. Die Stellung von „Gemeinde in Magnesia am Mäander“ zu Beginn erleichtert im Deutschen den anschließenden anaphorischen Bezug, ohne den Inhalt zu ändern.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:52:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Revision erforderlich: Der griechische Wortlaut der mittleren Rezension hat hier ἐν ᾗ („in der / in welcher“), mit femininem Bezug auf ἐκκλησία („Gemeinde“), nicht einen maskulinen Bezug auf Christus. Das englische Audit-Trail „in whom“ verwischt bzw. verfehlt diesen Bezug. Die Fassung stellt daher den Gemeindebezug her. πλεῖστα χαίρειν wird mit einer idiomatischen, zugleich die Verstärkung bewahrenden Grußformel wiedergegeben.'
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch und erhält den Charakter eines antiken Briefpräskripts. Die Wiederaufnahme von „Gemeinde“ in „in ihr grüße ich die Gemeinde“ ist wegen des im griechischen Text ausdrücklich vorliegenden Bezugs sachlich erforderlich und im Deutschen verständlich.
  terminology: „Theophorus“ bleibt als Beiname unverändert. „Christus Jesus, unserem Retter“, „Gott, dem Vater“ und „Gemeinde“ sind terminologisch angemessen. „reichen Gruß“ gibt die verstärkende Schlussformel πλεῖστα χαίρειν besser wieder als bloß „herzliche Grüße“, ohne eine unhaltbar wörtliche Mengenangabe zu erzwingen.
  issues:
  - severity: high
    issue: Falscher Bezug von „In ihm“
    rationale: Das griechische Relativpronomen ᾗ ist feminin und bezieht sich auf die Gemeinde (ἐκκλησία). „In ihm“ macht Christus zum Bezug und verändert damit den Wortlaut. Das englische POB-Audit-Trail bietet an dieser Stelle keine ausreichende Grundlage gegen die griechische Syntax.
  - severity: low
    issue: „herzliche Grüße“ gibt die Intensivierung nur abgeschwächt wieder
    rationale: πλεῖστα χαίρειν ist eine verstärkte antike Grußformel. „reichen Gruß“ bewahrt den gesteigerten Charakter in einer natürlichen deutschen Briefformel.
