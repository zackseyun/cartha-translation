review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die wesentlichen Elemente des vorliegenden englischen Zeugen wieder, schwächt jedoch die partizipiale Beschreibung der Gemeinde („having peace ... through the passion“) zu einer eigenständigen kausalen Aussage ab („Durch ... hat sie Frieden“). Die revidierte Fassung bewahrt die syntaktische Zuordnung als Kennzeichnung der Gemeinde. Die ungewöhnliche Wendung „durch unsere Auferstehung zu ihm“ bleibt ausdrücklich unaufgelöst.
  naturalness: Die Revision verbindet die im Zeugen aufeinanderfolgenden Anreden zu einem im Deutschen klaren, würdevollen Briefeingang. „in Asia“ vermeidet die nicht ausdrücklich im englischen Zeugen enthaltene Ergänzung „Provinz“, bleibt aber als antiker Ortsname verständlich.
  terminology: „Gemeinde“, „Fleisch und Geist“, „Leiden Jesu Christi“, „göttliche Fülle“ und „auf apostolische Weise“ sind registergerecht und ohne konfessionelle Einengung. Theophorus bleibt als Beiname unübersetzt.
  issues:
  - severity: medium
    issue: Die Friedensaussage wurde kausal und als eigener Satz umgeformt.
    rationale: Das vorliegende Zeugnis beschreibt die Gemeinde als eine, die durch das Leiden Jesu Christi Frieden in Fleisch und Geist hat. „Durch das Leiden ... hat sie Frieden“ ist zwar nahe, verändert aber die Satzstruktur und verstärkt den Kausalzusammenhang.
  - severity: low
    issue: „Provinz“ ist eine nicht im vorliegenden englischen Zeugen ausgedrückte Ergänzung.
    rationale: Die historische Einordnung ist plausibel, sollte bei einer nur vorläufigen Prüfung am englischen Zeugen jedoch nicht in den Übersetzungstext eingetragen werden.
  revised_text: Ignatius, der auch Theophorus genannt wird, an die von Gott, dem Vater Jesu Christi, geliebte, heilige Gemeinde in Tralles in Asia, erwählt und Gottes würdig, die durch das Leiden Jesu Christi Frieden in Fleisch und Geist hat. Er ist unsere Hoffnung durch unsere Auferstehung zu ihm.[a] Auch grüße ich diese Gemeinde in göttlicher Fülle auf apostolische Weise und wünsche ihr reichen Gruß.[b]
  revised_footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugnis: „durch unsere Auferstehung zu ihm“. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Die ungewöhnliche Wendung darf ohne Prüfung des griechischen Wortlauts weder zu „durch seine Auferstehung“ geändert noch näher ausgelegt werden.
  - marker: b
    text: Die Wendungen „in göttlicher Fülle“, „auf apostolische Weise“ und „reichen Gruß“ folgen eng dem vorliegenden englischen Zeugnis; ihre genaue griechische Gestalt ist noch zu prüfen.
    reason: Kennzeichnet die vorläufige Quellenlage bei den eigentümlichen Grußformeln.
  revision_rationale: Die Revision stellt die Beschreibung der angeredeten Gemeinde wieder als zusammenhängenden Satz her, vermeidet die zusätzliche geografisch-administrative Präzisierung „Provinz“ und glättet die Briefsyntax, ohne die offenen beziehungsweise ungewöhnlichen Formulierungen des Zeugen theologisch aufzulösen.
