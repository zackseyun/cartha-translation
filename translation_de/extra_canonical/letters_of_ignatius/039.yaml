base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: de
  text: 'Ignatius, der auch Theophorus genannt wird, an die von Gott, dem Vater Jesu Christi, geliebte Gemeinde: an die heilige Gemeinde in Tralles in der Provinz Asia, die erwählt und Gottes würdig ist. Durch das Leiden Jesu Christi hat sie Frieden in Fleisch und Geist. Er ist unsere Hoffnung durch unsere Auferstehung zu ihm.[a] Auch ich grüße diese Gemeinde in göttlicher Fülle nach apostolischer Weise und wünsche ihr reichen Gruß.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugnis: „durch unsere Auferstehung zu ihm“. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Die Formulierung ist ungewöhnlich und darf ohne griechische Quellenprüfung weder in „seine Auferstehung“ geändert noch stärker ausgelegt werden.
  - marker: b
    text: Die Wendungen „in göttlicher Fülle“, „nach apostolischer Weise“ und „reichen Gruß“ folgen eng dem vorliegenden englischen Zeugnis; ihre genaue griechische Gestalt ist noch zu prüfen.
    reason: Kennzeichnet die vorläufige Quellenlage bei mehreren eigentümlichen Grußformeln.
lexical_decisions:
- source_word: Theophorus
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname transliteriert, da seine mögliche Bedeutung („Gottesträger“ bzw. „von Gott getragen“) im vorliegenden, noch nicht direkt am Griechischen geprüften Zeugnis nicht eindeutig festgelegt ist.
- source_word: church
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet hier natürlich und verständlich die örtliche christliche Gemeinschaft; „Kirche“ bleibt als mögliche Alternative bestehen.
- source_word: Asia
  choice: Provinz Asia
  rationale: Die Ergänzung „Provinz“ verhindert die moderne geografische Fehlauffassung, während der antike Eigenname Asia erhalten bleibt.
- source_word: passion
  choice: Leiden
  rationale: „Leiden“ ist im Deutschen die natürliche, traditionsfähige Wiedergabe des Leidens und Sterbens Jesu, ohne zusätzliche Deutung einzutragen.
- source_word: flesh and spirit
  choice: Fleisch und Geist
  rationale: Die spannungsreiche anthropologische beziehungsweise gemeinschaftliche Formulierung wird formal bewahrt und nicht auf „Leib und Seele“ festgelegt.
- source_word: Divine plenitude
  choice: göttlicher Fülle
  rationale: Die ungewöhnliche und theologisch offene Formulierung wird eng am Zeugnis wiedergegeben, statt sie erklärend aufzulösen.
- source_word: abundant greeting
  choice: reichen Gruß
  rationale: Die feierliche Grußformel wird knapp und würdig bewahrt; eine freiere Wiedergabe wie „alles Gute in Fülle“ wäre interpretierender.
theological_decisions:
- issue: Bezug von „our resurrection unto Him“
  choice: „durch unsere Auferstehung zu ihm“
  alternative: „durch seine Auferstehung“ oder „in der Hoffnung, zu ihm aufzuerstehen“
  rationale: Das gelieferte Zeugnis hat ausdrücklich „our resurrection unto Him“. Die ungewohnte Aussage und ihre eschatologische Spannung werden daher nicht stillschweigend korrigiert oder geglättet.
- issue: Frieden „in flesh and spirit“
  choice: „Frieden in Fleisch und Geist“
  alternative: „leiblichen und geistlichen Frieden“
  rationale: Die koordinierte Formulierung bleibt erhalten, ohne festzulegen, ob sie den einzelnen Menschen oder die Gemeinde als Ganze beschreibt.
- issue: „God the Father of Jesus Christ“
  choice: „Gott, dem Vater Jesu Christi“
  alternative: „Gott, dem Vater, und Jesus Christus“
  rationale: 'Die syntaktische Zuordnung des überlieferten englischen Zeugnisses wird bewahrt: Gott wird als Vater Jesu Christi bezeichnet.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit frühchristlichem Briefton. Wegen der ausdrücklich noch ausstehenden Prüfung des mittelrezensionellen griechischen Textes ist der Entwurf bewusst quellennah zum öffentlichen englischen Zeugen gehalten. Ungewöhnliche Aussagen wurden nicht konfessionell harmonisiert; erklärende Ergänzungen sind auf das zur historischen Verständlichkeit nötige Maß beschränkt.
