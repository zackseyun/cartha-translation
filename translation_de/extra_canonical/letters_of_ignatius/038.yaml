revisions:
- from: Die Epheser aus Smyrna grüßen euch; von hier aus schreibe auch ich euch. Sie sind zur Ehre Gottes hier bei mir, ebenso wie auch ihr, und haben mich in jeder Hinsicht ermutigt, zusammen mit Polykarp, dem Bischof der Smyrnäer. Ja, auch alle anderen Gemeinden grüßen euch in der Ehre Jesu Christi. Lebt wohl in der Eintracht Gottes und bewahrt einen unerschütterlichen Geist – dieser ist Jesus Christus.[a]
  to: Die Epheser aus Smyrna grüßen euch; von dort schreibe auch ich euch. Sie sind hier bei mir zur Ehre Gottes, ebenso wie auch ihr, und sie haben mich in allem gestärkt, zusammen mit Polykarp, dem Bischof der Smyr­näer. Ja, auch alle anderen Gemeinden grüßen euch zur Ehre Jesu Christi. Lebt wohl in der Eintracht Gottes und habt einen ungeteilten Geist – dieser ist Jesus Christus.[a]
  rationale: Die Revision korrigiert das zentrale Bedeutungsproblem bei „unerschütterlich“ zu „ungeteilt“, präzisiert die Grußformel als „zur Ehre Jesu Christi“ und gibt die von den Ephesern erfahrene Stärkung umfassender wieder. Die überlieferte Mehrdeutigkeit des Schlussrelativsatzes und der Genitivverbindung „Eintracht Gottes“ bleibt bewusst erhalten.
