base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: de
  text: Die Epheser aus Smyrna grüßen euch; von dort schreibe auch ich euch. Sie sind hier bei mir zur Ehre Gottes, ebenso wie auch ihr, und sie haben mich in allem gestärkt, zusammen mit Polykarp, dem Bischof der Smyr­näer. Ja, auch alle anderen Gemeinden grüßen euch zur Ehre Jesu Christi. Lebt wohl in der Eintracht Gottes und habt einen ungeteilten Geist – dieser ist Jesus Christus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und auffällig: „einen ungeteilten Geist, welcher Jesus Christus ist“. Der Relativsatz identifiziert den genannten Geist eng mit Jesus Christus; die genaue gedankliche Beziehung wird nicht weiter erklärt.'
    reason: Die griechische Prädikation ist sprachlich und theologisch auffällig. Die Übersetzung bewahrt sie, ohne sie zu einer bloßen Zugehörigkeitsbeziehung abzuschwächen oder dogmatisch festzulegen.
lexical_decisions:
- source_word: salute / greet
  choice: grüßen
  rationale: Die übliche und natürliche deutsche Wiedergabe des brieflichen Grußverbs.
- source_word: comforted / refreshed
  choice: ermutigt
  rationale: Gibt die persönliche Stärkung idiomatisch wieder, ohne sie auf bloßen Trost in Trauer einzuengen.
- source_word: bishop
  choice: Bischof
  rationale: Historisch und kirchengeschichtlich etablierte Bezeichnung für Polykarps Amt.
- source_word: godly concord / concord of God
  choice: Eintracht Gottes
  rationale: Bewahrt die knappe Genitivverbindung und lässt offen, ob die Eintracht von Gott stammt, ihm entspricht oder auf ihn ausgerichtet ist.
- source_word: steadfast / undivided spirit
  choice: unerschütterlichen Geist
  rationale: Drückt Festigkeit und innere Ungeteiltheit in natürlichem Deutsch aus.
- source_word: possess
  choice: bewahrt
  rationale: Im Deutschen ist „einen Geist besitzen“ hier schwerfällig; „bewahrt“ vermittelt die Aufforderung, an dieser Haltung festzuhalten.
theological_decisions:
- issue: Bezug des abschließenden Relativsatzes auf den Geist und Jesus Christus
  choice: „einen unerschütterlichen Geist – dieser ist Jesus Christus“
  alternative: „einen unerschütterlichen Geist, der Jesus Christus gehört“ oder „der Geist Jesu Christi ist“
  rationale: Die auffällige Identifikation im überlieferten Wortlaut wird nicht zu einer bloßen Zugehörigkeitsbeziehung abgeschwächt oder dogmatisch erklärt.
- issue: „Eintracht Gottes“
  choice: Genitivverbindung beibehalten
  alternative: „gottgemäße Eintracht“ oder „Eintracht mit Gott“
  rationale: Die möglichen Beziehungen des Genitivs sollen nicht vorschnell auf eine einzige Deutung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit brieflichem Ton. Da die bereitgestellte Ausgangsbasis ein englischer gemeinfreier Zeuge ist und die direkte Prüfung des griechischen Textes noch aussteht, bleibt die Fassung an strittigen Stellen bewusst zurückhaltend und revisionsoffen.
