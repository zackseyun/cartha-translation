  source_fidelity: 'Eine sichere Korrektur ist nötig: Das griechische ἀδιαίρετον bedeutet „ungeteilt/unteilbar“, nicht „unerschütterlich“. Außerdem trifft „zur Ehre Jesu Christi“ die finale Zweckbestimmung des Grußes besser als „in der Ehre Jesu Christi“. Die Orts- und Personenangaben sowie die auffällige Prädikation des Geistes mit Jesus Christus bleiben erhalten.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „in allem gestärkt“ ist hier näher an der Bedeutung von ἀναπαύειν („Erquickung/Stärkung verschaffen“) als „ermutigt“ und zugleich natürlich. Die Schlussformel „Lebt wohl“ wahrt den epistolarischen Ton.
  terminology: „Bischof“, „Gemeinden“, „Eintracht Gottes“ und „Jesus Christus“ sind angemessen. „Ungeteilter Geist“ gibt die semantische Spannung von πνεῦμα ἀδιαίρετον präzise wieder, ohne sie dogmatisch auszudeuten.
  issues:
