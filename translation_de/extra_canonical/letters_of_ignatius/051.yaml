review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung nötig: Die Personifikation der Fesseln muss auch beim flehenden Partizip erhalten bleiben; der Entwurf macht daraus ein Flehen des Verfassers. Außerdem ist „die Seele eures Bischofs“ nicht durch den griechischen Wortlaut gedeckt, der den Bischof selbst als Objekt der Ermutigung/Erquickung bezeichnet. Die textkritisch markierte Ergänzung wird beibehalten.'
  naturalness: Die Fassung ist überwiegend modernes, würdiges Deutsch. „Es ziemt sich für jeden“ und „die Seele eures Bischofs stärken“ sind jedoch weniger natürlich bzw. unnötig bildhaft. Die Revision glättet dies, ohne den kirchlichen und paränetischen Registerton zu verlieren.
  terminology: „Älteste“ für πρεσβύτεροι, „Bischof“ für ἐπίσκοπος, „Eintracht“, „Los“ und „als unbewährt befunden“ sind angemessen. „Fesseln“ bewahrt die konkrete Gefangenschaft und die beabsichtigte Personifikation.
  issues:
  - severity: medium
    issue: Subjekt des Flehens verschoben
    rationale: Die Fesseln sind im Ausgangstext sowohl die Mahnenden als auch die Flehenden. „während ich darum flehe“ verschiebt das Flehen auf Ignatius und schwächt die rhetorisch auffällige Personifikation.
  - severity: medium
    issue: „Seele“ beim Bischof eingefügt
    rationale: Die griechische Formulierung fordert zur Erquickung bzw. Stärkung des Bischofs auf; „Seele“ ist keine sichere Wiedergabe des griechischen Objekts und sollte nicht aus der englischen Formulierung übernommen werden.
  - severity: low
    issue: Unnatürliche Verpflichtungsformel
    rationale: „Jedem Einzelnen ... kommt es zu“ ist schwerfällig. „Es gehört sich, dass ...“ gibt die Angemessenheitsformel idiomatischer wieder.
  revised_text: 'Ich grüße euch aus Smyrna zusammen mit den Gemeinden Gottes, die bei mir anwesend sind; sie haben mich in jeder Hinsicht erquickt, leiblich wie geistlich.


    Meine Fesseln, die ich um Jesu Christi willen trage, mahnen euch und flehen darum, dass ich zu Gott gelange: Bleibt in eurer Eintracht und im Gebet miteinander. Denn es gehört sich, dass jeder von euch, besonders aber die Ältesten, euren Bischof stärkt — zur Ehre des Vaters [und zur Ehre][a] Jesu Christi und der Apostel.


    Ich bitte euch, in Liebe auf mich zu hören, damit ich nicht durch das, was ich geschrieben habe, zum Zeugen gegen euch werde. Betet auch ihr für mich; denn in Gottes Barmherzigkeit bedarf ich eurer Liebe, damit mir das Los zuteilwird, das ich so sehnsüchtig zu erreichen strebe, und ich nicht als unbewährt befunden werde.'
  revised_footnotes:
  - marker: a
    text: Die eingeklammerten Wörter kennzeichnen eine Ergänzung im zugrunde liegenden englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text steht noch aus.
    reason: Bewahrt das im gelieferten Zeugen ausdrücklich markierte textkritische Signal und behandelt den ergänzten Wortlaut nicht als unbestritten.
  revision_rationale: Die Revision stellt die im Ausgangstext vorhandene Personifikation der Fesseln wieder her und folgt beim Bischof dem griechischen Objekt statt einer nicht gesicherten Ausweitung mit „Seele“. Sie bewahrt die überlieferten Mehrdeutigkeiten von „zu Gott gelangen“, „Los“ und „unbewährt“ und lässt die eckig markierte Ergänzung samt Anmerkung unverändert sichtbar.
