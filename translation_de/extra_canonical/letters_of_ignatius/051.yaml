base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: de
  text: 'Ich grüße euch aus Smyrna, zusammen mit den Gemeinden Gottes, die hier bei mir sind. Sie haben mich in jeder Hinsicht erquickt, leiblich wie geistlich.


    Meine Fesseln, die ich um Jesu Christi willen trage, ermahnen euch, während ich darum flehe, zu Gott zu gelangen: Bleibt in eurer Eintracht und im gemeinsamen Gebet füreinander. Denn jedem Einzelnen von euch, besonders aber den Ältesten, kommt es zu, die Seele eures Bischofs zu stärken — zur Ehre des Vaters [und zur Ehre][a] Jesu Christi und der Apostel.


    Ich bitte euch, in Liebe auf mich zu hören, damit ich nicht durch das, was ich euch geschrieben habe, zum Zeugen gegen euch werde. Betet auch ihr für mich; denn in Gottes Barmherzigkeit brauche ich eure Liebe, damit mir das Los zuteilwird, das ich so sehnsüchtig zu erreichen suche, und ich nicht als unbewährt befunden werde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerten Wörter kennzeichnen eine Ergänzung im zugrunde liegenden englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text steht noch aus.
    reason: Bewahrt das im gelieferten Zeugen ausdrücklich markierte textkritische Signal und legt den ergänzten Wortlaut nicht als unbestritten fest.
lexical_decisions:
- source_word: refreshed
  choice: erquickt
  rationale: Gibt die umfassende Stärkung und Erholung des Zeugen würdig und knapp wieder; „leiblich wie geistlich“ bewahrt die Zweigliedrigkeit.
- source_word: bonds
  choice: Fesseln
  rationale: Bezeichnet konkret die Gefangenschaft und erhält zugleich die personifizierte Mahnung der Fesseln.
- source_word: attain unto God
  choice: zu Gott gelangen
  rationale: Bewahrt die frühchristliche, auf Tod und mögliches Martyrium bezogene Zielaussage, ohne sie durch eine auslegende Umschreibung festzulegen.
- source_word: concord
  choice: Eintracht
  rationale: Bewahrt den gemeinschaftlichen und ethischen Sinn stärker als ein bloß organisatorisches „Zusammenhalten“.
- source_word: presbyters
  choice: Älteste
  rationale: Ist im modernen Deutsch verständlich und gibt den kirchlichen Amtstitel wieder, ohne eine spätere konfessionelle Amtsordnung einzutragen.
- source_word: cheer the soul
  choice: die Seele … stärken
  rationale: Natürliches Deutsch, das Ermutigung und innere Erquickung ausdrückt, ohne den auffälligen Bezug auf die Seele des Bischofs zu tilgen.
- source_word: lot
  choice: Los
  rationale: Erhält die bildhafte Rede von dem ihm bestimmten Anteil oder Geschick und vermeidet eine vorschnelle dogmatische Präzisierung.
- source_word: reprobate
  choice: als unbewährt befunden
  rationale: Bewahrt den Prüfungshintergrund und ist weniger theologisch überladen als „verworfen“.
theological_decisions:
- issue: Das Ziel der Wendung „zu Gott gelangen“
  choice: Die Wendung bleibt ohne erklärende Gleichsetzung mit Martyrium, Tod oder endgültigem Heil stehen.
  alternative: „durch das Martyrium zu Gott gelangen“
  rationale: Der Zusammenhang legt das Martyrium nahe, doch die vorliegende Formulierung nennt es an dieser Stelle nicht ausdrücklich.
- issue: Kirchlicher Titel „presbyters“
  choice: Älteste
  alternative: Priester / Presbyter
  rationale: „Älteste“ ist quellennah und allgemein verständlich; „Priester“ könnte eine spätere Amtsvorstellung eintragen, während „Presbyter“ weniger zugänglich ist.
- issue: „nicht als unbewährt befunden“
  choice: Die Prüfungsmetaphorik wird erhalten.
  alternative: „nicht verworfen werden“
  rationale: „Verworfen“ könnte eine endgültige Heilsverwerfung behaupten, während der Zeuge auch das Nichtbestehen einer Bewährung ausdrücken kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzstruktur wurde behutsam geglättet, während Personifikation, Wiederholungen und theologische Spannung erhalten bleiben. Da kein griechischer Wortlaut mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist die Fassung als vorläufiger, am öffentlichen englischen Zeugen orientierter Entwurf zu behandeln.
