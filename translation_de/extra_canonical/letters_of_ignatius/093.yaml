    rationale: „Entscheidend“ legt eine mögliche Nuance von καιροί fest, während der Ausdruck allgemein bedeutsame, günstige oder angemessene Zeiten/Gelegenheiten meinen kann. καταμάνθανε verlangt sorgfältiges Beachten bzw. Verstehen.
