    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: de
  text: 'Lass dich nicht von denen erschrecken, die als glaubwürdig gelten und doch eine fremde Lehre verbreiten. Steh fest wie ein Amboss, auf den eingeschlagen wird. Es zeichnet einen großen Wettkämpfer aus, Schläge einzustecken und zu siegen. Vor allem aber müssen wir um Gottes willen alles ertragen, damit auch er uns erträgt.[a]



    Wachse über das hinaus, was du bist. Achte genau auf die Zeiten.[b] Erwarte den, der über aller Zeit steht: den Zeitlosen, den Unsichtbaren, der um unseretwillen sichtbar wurde; den Unberührbaren, den Leidensunfähigen, der um unseretwillen Leiden auf sich nahm; den, der um unseretwillen auf jede Weise ertragen hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bewusst auffällig: „damit auch er uns erträgt“. Gemeint sein kann auch: „damit auch er uns geduldig trägt“; der Text erklärt die Beziehung zwischen unserem Ausharren und Gottes Ertragen nicht näher.'
    reason: Bewahrt die echte semantische und theologische Spannung, die eine flüssigere Übersetzung verdecken würde.
  - marker: b
    text: Das zugrunde liegende Wort bezeichnet bedeutsame, geeignete oder entscheidende Zeiten und Gelegenheiten, nicht nur den Ablauf der Zeit.
    reason: Erläutert die Bedeutungsweite von καιροί, ohne sie im Haupttext unnötig festzulegen.
lexical_decisions:
- source_word: οἱ δοκοῦντες ἀξιόπιστοι εἶναι
  choice: die als glaubwürdig gelten
  rationale: Gibt den Anschein beziehungsweise Ruf der Vertrauenswürdigkeit wieder, ohne zu behaupten, diese Personen seien tatsächlich glaubwürdig.
- source_word: ἑτεροδιδασκαλοῦντες
  choice: eine fremde Lehre verbreiten
  rationale: Bewahrt den Gedanken einer andersartigen, vom empfangenen Glauben abweichenden Lehre, ohne eine spätere konfessionelle Kategorie einzutragen.
- source_word: ἄκμων τυπτόμενος
  choice: ein Amboss, auf den eingeschlagen wird
  rationale: Erhält das anschauliche Bild und formuliert es in natürlichem modernem Deutsch.
- source_word: ὑπομένειν / ὑπομείνῃ
  choice: ertragen / erträgt
  rationale: Die Wiederholung desselben Wortstamms und die auffällige Gegenseitigkeit bleiben sichtbar; eine glättende Deutung wird der Fußnote überlassen.
- source_word: τοὺς καιρούς
  choice: die entscheidenden Zeiten
  rationale: καιροί bezeichnet hier eher bedeutsame oder geeignete Zeitpunkte als bloß chronologische Zeit.
- source_word: τὸν ὑπὲρ καιρόν / τὸν ἄχρονον
  choice: der über aller Zeit steht / den Zeitlosen
  rationale: Bewahrt die aufeinander bezogenen Aussagen von Transzendenz über die Zeit und Zeitlosigkeit.
- source_word: τὸν ἀψηλάφητον
  choice: den Unberührbaren
  rationale: Gibt die Unfassbarkeit für den Tastsinn in verständlicher, würdiger Sprache wieder.
- source_word: τὸν ἀπαθῆ, τὸν δι’ ἡμᾶς παθητόν
  choice: den Leidensunfähigen, der um unseretwillen Leiden auf sich nahm
  rationale: Erhält die bewusste Spannung zwischen Leidensunfähigkeit und wirklichem Leiden, ohne sie dogmatisch aufzulösen.
- source_word: κατὰ πάντα τρόπον ... ὑπομείναντα
  choice: auf jede Weise standhielt
  rationale: Bewahrt die Weite der Aussage und vermeidet die schwerfällige Formulierung „in jeder Hinsicht ertrug“.
theological_decisions:
- issue: Gottes Ertragen der Glaubenden
  choice: damit auch er uns erträgt
  alternative: damit auch er uns geduldig trägt / bei uns ausharrt
  rationale: Die ungewöhnliche Formulierung und die lexikalische Entsprechung zum menschlichen Ertragen werden bewahrt, statt die Aussage stillschweigend als Beistand, Annahme oder Duldung festzulegen.
- issue: Leidensunfähigkeit und Leiden Christi
  choice: den Leidensunfähigen, der um unseretwillen Leiden auf sich nahm
  alternative: den Unberührbaren, der um unseretwillen litt
  rationale: Die paradoxe Gegenüberstellung des Textes bleibt ausdrücklich bestehen; weder wird die Leidensunfähigkeit gestrichen noch das Leiden abgeschwächt.
- issue: Verhältnis Christi zur Zeit
  choice: 'der über aller Zeit steht: den Zeitlosen'
  alternative: 'der über jedem Zeitpunkt steht: den Ewigen'
  rationale: Die Fassung wahrt das Wortspiel zwischen καιρός und ἄχρονος und vermeidet eine vorschnelle Gleichsetzung beider Ausdrücke mit nur einem theologischen Begriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die sportliche und handwerkliche Bildsprache bleibt kräftig. Die Übersetzung wurde anhand der bekannten griechischen Form des Abschnitts aus der mittleren Rezension geprüft; da die bereitgestellten Metadaten die direkte Quellenprüfung als noch ausstehend bezeichnen, sollten Wortlaut und Zeichensetzung vor der endgültigen Publikation nochmals an der maßgeblichen kritischen griechischen Ausgabe kontrolliert werden.
