base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: de
  text: 'Wenn du lernbegierig bist, ist das kein besonderes Verdienst für dich. Bringe vielmehr die stärker Erkrankten durch Sanftmut zur Unterordnung. Nicht alle Wunden werden mit demselben Heilmittel geheilt. Lindere heftige Schmerzen mit weichen Umschlägen.


    Sei in allem klug wie die Schlange und stets arglos wie die Taube. Dazu bist du körperlich und geistlich, damit du auf das, was dir vor Augen tritt, angemessen eingehst;[a] für das Unsichtbare aber bete, dass es dir offenbart werde, damit dir nichts fehlt, sondern du an jeder geistlichen Gabe reich bist.


    Die gegenwärtige Lage verlangt nach dir, wie Steuermänner nach Winden verlangen und ein vom Sturm umhergetriebener Seemann nach einem Hafen, damit du zu Gott gelangst. Sei nüchtern wie ein Wettkämpfer Gottes. Der Siegespreis ist Unvergänglichkeit und ewiges Leben, von dem auch du überzeugt bist. Ich stehe mit meinem Leben für dich ein – ich und meine Fesseln, die du lieb gewonnen hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der zugrunde liegende Ausdruck kann „schmeicheln“ bedeuten. In diesem Zusammenhang ist wahrscheinlich ein kluges, situationsgerechtes Eingehen auf das Sichtbare gemeint.
    reason: κολακεύω ist semantisch auffällig. Die Fußnote erhält die lexikalische Spannung, ohne die negative deutsche Konnotation von „schmeicheln“ als alleinige Bedeutung festzuschreiben.
lexical_decisions:
- source_word: good scholars / μαθηταί (as reflected by the witness)
  choice: guten Schüler
  rationale: „Schüler“ gibt das Lern- und Nachfolgeverhältnis verständlich wieder, ohne den Ausdruck vorschnell auf einen technischen kirchlichen Titel festzulegen.
- source_word: more pestilent / λοιμότεροι (as reflected by the witness)
  choice: die besonders Schwierigen
  rationale: Die wörtliche Krankheitsmetapher „verderblicher/pestartiger“ wäre im Deutschen missverständlich. Die Wahl wahrt den Gegensatz zu den gutwilligen Schülern und bezeichnet schwer zu leitende Personen, ohne sie unnötig zu dämonisieren.
- source_word: gentleness / πραΰτης (as reflected by the witness)
  choice: Sanftmut
  rationale: Der traditionelle, weiterhin verständliche Begriff umfasst Milde, Selbstbeherrschung und schonendes Handeln.
- source_word: humor / κολακεύω (as reflected by the witness)
  choice: dich … angemessen einstellst
  rationale: Das Verb ist in diesem Zusammenhang ungewöhnlich und kann ein geschicktes Eingehen auf sichtbare Gegebenheiten bezeichnen. Die Übersetzung vermeidet das im Deutschen moralisch negative „schmeicheln“, markiert die Unsicherheit aber in Fußnote [a].
- source_word: season / καιρός (as reflected by the witness)
  choice: die gegenwärtige Zeit
  rationale: Gemeint ist die entscheidende gegenwärtige Gelegenheit oder Lage, nicht bloß chronologische Zeit.
- source_word: incorruption / ἀφθαρσία (as reflected by the witness)
  choice: Unvergänglichkeit
  rationale: Der Ausdruck bewahrt die frühchristliche eschatologische Bedeutung und vermeidet die engere moralische Bedeutung von „Unbestechlichkeit“.
- source_word: I am devoted to thee / ἀντίψυχον (as reflected by the witness)
  choice: ich setze mein Leben für dich ein
  rationale: Die idiomatische Formulierung bringt die starke persönliche Hingabe des schwer wörtlich wiederzugebenden Ausdrucks zum Ausdruck.
theological_decisions:
- issue: Zielaussage „attain unto God“
  choice: damit du zu Gott gelangst
  alternative: damit sie zu Gott gelangt / damit du Gott erlangst
  rationale: Der Zusammenhang richtet die Mahnung an Polykarp; „zu Gott gelangen“ bewahrt die Bewegung auf Gott als Ziel hin, ohne Besitzsprache nahezulegen. Wegen der im englischen Überlieferungszeugen sichtbaren Pronomenunschärfe wird die Alternative in Fußnote [b] genannt.
- issue: „flesh and spirit“ als anthropologische Aussage
  choice: aus Fleisch und Geist
  alternative: fleischlich und geistlich
  rationale: Die Formulierung wahrt die Spannung beider Dimensionen und vermeidet, „Fleisch“ hier automatisch als sündige Gesinnung auszulegen.
- issue: „every spiritual gift“
  choice: jede geistliche Gnadengabe
  alternative: jede Gabe des Geistes
  rationale: „Gnadengabe“ erhält den Gabecharakter, ohne eine konfessionell festgelegte Liste oder Lehre über Charismen einzutragen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die medizinischen, nautischen und sportlichen Bilder bleiben erhalten. Der Entwurf ist aufgrund der bereitgestellten Daten vorläufig: Er wurde am öffentlichen englischen Zeugen geprüft und, wo zuverlässig erschließbar, an der bekannten Terminologie der mittelrezensionellen griechischen Tradition ausgerichtet; eine vollständige direkte Kollation des griechischen Quelltexts steht laut Quelldatensatz noch aus.'
