revisions:
- from: 'Wenn du die guten Schüler liebst, ist das kein Verdienst für dich. Bring vielmehr die besonders Schwierigen durch Sanftmut zur Unterordnung. Nicht jede Wunde wird mit derselben Salbe geheilt. Lindere heftige Schmerzen mit feuchten Umschlägen.


    Sei in allem klug wie die Schlange und stets arglos wie die Taube. Denn dazu bist du aus Fleisch und Geist, dass du dich auf das, was sichtbar vor deinen Augen liegt, angemessen einstellst;[a] was aber unsichtbar ist, darum bitte, dass es dir offenbart wird. So soll dir nichts fehlen, sondern du sollst an jeder geistlichen Gnadengabe Überfluss haben.


    Die gegenwärtige Zeit fordert dich, wie Steuermänner Winde brauchen und ein vom Sturm umhergetriebener Seemann einen Hafen, damit du zu Gott gelangst.[b] Sei nüchtern wie ein Wettkämpfer Gottes. Der Siegespreis ist Unvergänglichkeit und ewiges Leben; davon bist auch du überzeugt. In allem setze ich mein Leben für dich ein – ich und meine Fesseln, die du lieb gewonnen hast.'
