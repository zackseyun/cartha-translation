review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Die Aussage μη θέλητέ με ἀποθανεῖν bzw. „do not desire me to die“ richtet sich gegen den Wunsch, dass Ignatius sterbe; „wünscht nicht meinen Tod“ verschiebt dies leicht zu einem substantivischen Wunschobjekt. Außerdem ist bei ἄνθρωπος ἔσομαι keine Verstärkung wie „wahrhaft“ ausgedrückt. Die Gott-Bezeichnung in „wenn jemand ihn in sich hat“ sollte explizit bleiben.'
  naturalness: Die Fassung ist insgesamt würdiges, modernes Standarddeutsch. „Wollt nicht, dass ich sterbe“ und „Dann werde ich ein Mensch sein“ sind klar und idiomatisch. „Überlasst der Welt nicht den, der Gott gehören will“ gibt die Aufforderung natürlich wieder, ohne die stärkere Nuance von „ausliefern“ einzutragen.
  terminology: „Leiden meines Gottes“, „reines Licht“ und die eingeklammerte Formulierung „[um unseretwillen]“ bewahren die theologisch und textkritisch relevante Wortwahl. „Ein Mensch“ wird ohne interpretierende Ergänzung wiedergegeben.
  issues:
  - severity: medium
    issue: „werde ich wahrhaft Mensch sein“ ergänzt „wahrhaft“.
    rationale: Der überlieferte Wortlaut lautet lediglich „then shall I be a man“ (griechisch ἄνθρωπος ἔσομαι). Eine Vollendungsdeutung kann erläutert werden, darf aber nicht als Bestandteil der Übersetzung erscheinen.
  - severity: medium
    issue: „wünscht nicht meinen Tod“ ist gegenüber „do not desire me to die“ weniger unmittelbar.
    rationale: Die Quelle formuliert einen Wunsch hinsichtlich des Sterbens der sprechenden Person. Der dass-Satz bildet dies genauer ab.
  - severity: low
    issue: „ihn in sich hat“ lässt den Bezug von „God“ nur pronominal erkennen.
    rationale: Die explizite Wiederholung „Gott in sich hat“ vermeidet unnötige Referenzunschärfe und entspricht dem Wortlaut besser.
  revised_text: 'Die äußersten Grenzen des Weltalls nützen mir nichts, ebenso wenig die Königreiche dieser Welt. Es ist gut für mich, für Jesus Christus zu sterben, statt über die äußersten Grenzen der Erde zu herrschen. Ihn suche ich, der für uns gestorben ist; nach ihm verlange ich, der [um unseretwillen] auferstanden ist.[a]


    Die Wehen einer neuen Geburt sind über mich gekommen. Habt Geduld mit mir, Brüder. Hindert mich nicht daran zu leben; wollt nicht, dass ich sterbe. Überlasst der Welt nicht den, der Gott gehören will, und lockt ihn nicht mit materiellen Dingen. Lasst mich das reine Licht empfangen. Wenn ich dorthin gelangt bin, dann werde ich ein Mensch sein.


    Erlaubt mir, das Leiden meines Gottes nachzuahmen. Wenn jemand Gott in sich hat, soll er verstehen, wonach ich verlange, und mit mir mitfühlen; denn er kennt das, was mich bedrängt.'
  revised_footnotes:
  - marker: a
    text: Die Worte »um unseretwillen« stehen im zugrunde gelegten Zeugen in eckigen Klammern; ihre textkritische Prüfung am griechischen Überlieferungsbestand steht noch aus.
    reason: Der editorische Unsicherheitsmarker der Vorlage muss sichtbar bleiben.
  revision_rationale: Die Revision entfernt zwei nicht ausdrücklich im Wortlaut enthaltene Deutungen („wahrhaft“ und die substantivierende Form von „meinen Tod“) und macht den Bezug auf Gott im letzten Absatz explizit. Nicht erforderliche Erläuterungsfußnoten wurden entfernt, damit die Übersetzung selbst weder eine spezifische Vollendungslehre noch eine zusätzliche christologische Auslegung einträgt. Die textkritisch markierte Klammerphrase bleibt mitsamt Fußnote erhalten.
