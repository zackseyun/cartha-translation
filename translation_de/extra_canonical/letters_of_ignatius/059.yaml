base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: de
  text: 'Die äußersten Grenzen des Weltalls nützen mir nichts, ebenso wenig die Königreiche dieser Welt. Es ist gut für mich, für Jesus Christus zu sterben, statt über die äußersten Grenzen der Erde zu herrschen. Ihn suche ich, der für uns gestorben ist; nach ihm verlange ich, der [um unseretwillen] auferstanden ist.[a]


    Die Wehen einer neuen Geburt sind über mich gekommen. Habt Geduld mit mir, Brüder.[b] Hindert mich nicht daran zu leben; wünscht nicht meinen Tod. Liefert den, der Gott gehören will, nicht der Welt aus und lockt ihn nicht mit materiellen Dingen. Lasst mich das reine Licht empfangen. Wenn ich dorthin gelangt bin, werde ich wahrhaft Mensch sein.[c]


    Erlaubt mir, das Leiden meines Gottes nachzuahmen.[d] Wenn jemand ihn in sich hat, soll er verstehen, wonach ich verlange, und mit mir mitfühlen; denn er kennt das, was mich bedrängt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »um unseretwillen« stehen im zugrunde gelegten Zeugen in eckigen Klammern; ihre textkritische Prüfung am griechischen Überlieferungsbestand steht noch aus.
    reason: Der editorische Unsicherheitsmarker der Vorlage muss sichtbar bleiben.
  - marker: b
    text: Das griechische Anredewort kann je nach Kontext auch die gesamte Gemeinschaft einschließen; hier wird die traditionelle, im Zeugen vorliegende Anrede »Brüder« beibehalten.
    reason: Hinweis auf den möglichen inklusiven Umfang ohne Veränderung des historischen Wortlauts.
  - marker: c
    text: 'Wörtlich: »Dann werde ich ein Mensch sein.« Die Formulierung bezeichnet hier offenbar die erhoffte Vollendung, lässt deren genaue theologische Bestimmung aber offen.'
    reason: Die idiomatische Verdeutlichung »wahrhaft« soll transparent gemacht werden.
  - marker: d
    text: 'Wörtlich und auffällig: »das Leiden meines Gottes«. Die Formulierung wird wegen ihres christologischen Gewichts nicht geglättet.'
    reason: Bewahrung einer echten theologischen Spannung des Textes.
lexical_decisions:
- source_word: τὰ πέρατα τοῦ κόσμου / kingdoms of this world (witness)
  choice: die äußersten Grenzen des Weltalls / die Königreiche dieser Welt
  rationale: Die kosmische Weite und der Kontrast mit weltlicher Herrschaft bleiben erhalten; »Weltall« gibt κόσμος hier räumlich wieder.
- source_word: ὠδῖνές μοι ἐπίκεινται
  choice: Die Wehen einer neuen Geburt sind über mich gekommen
  rationale: Die Geburtsmetaphorik wird ausdrücklich bewahrt; die Formulierung folgt wegen ausstehender griechischer Detailprüfung vorsichtig dem überlieferten englischen Zeugen.
- source_word: καθαρὸν φῶς
  choice: das reine Licht
  rationale: Wörtliche und theologisch offene Wiedergabe ohne das Bild auf eine bestimmte Jenseitslehre festzulegen.
- source_word: ἄνθρωπος ἔσομαι
  choice: werde ich wahrhaft Mensch sein
  rationale: »Wahrhaft« verdeutlicht im Deutschen den gemeinten Vollendungssinn des prädikativen Ausdrucks, ohne ihn dogmatisch näher zu bestimmen.
- source_word: μιμητὴς τοῦ πάθους τοῦ θεοῦ μου
  choice: das Leiden meines Gottes nachzuahmen
  rationale: πάθος wird als »Leiden« statt als missverständliche »Passion« wiedergegeben; die auffällige Gottesbezeichnung bleibt unverändert bestehen.
- source_word: τὰ συνέχοντά με / things that constrain me (witness)
  choice: das, was mich bedrängt
  rationale: Bewahrt die Mehrdeutigkeit zwischen innerem Druck, Bedrängnis und äußerem Zwang besser als eine engere Festlegung.
theological_decisions:
- issue: Bracketed phrase after the resurrection statement
  choice: '[um unseretwillen]'
  alternative: Auslassung der eingeklammerten Worte
  rationale: Das Klammerzeichen des vorgelegten Zeugen wird bewahrt und macht sichtbar, dass die Worte textkritisch beziehungsweise editorisch unsicher sind.
- issue: Life and death paradox
  choice: »Hindert mich nicht daran zu leben; wünscht nicht meinen Tod.«
  alternative: Die Aussagen als bloße Umschreibung seines Martyriums auflösen
  rationale: 'Ignatius’ bewusstes Paradox bleibt stehen: Das erwartete Sterben wird als Zugang zum eigentlichen Leben bezeichnet.'
- issue: »the passion of my God«
  choice: »das Leiden meines Gottes«
  alternative: »das Leiden Christi«
  rationale: Die christologisch starke und spannungsreiche Formulierung wird nicht durch eine erklärende Ersetzung abgeschwächt.
- issue: Becoming human upon arrival
  choice: »werde ich wahrhaft Mensch sein«
  alternative: »werde ich ein Mensch sein«
  rationale: Die idiomatische deutsche Fassung bringt Vollendung zum Ausdruck, ohne festzulegen, worin diese ontologisch oder soteriologisch besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, eindringlicher Satzführung. Archaismen wie »begehren«, »hienieden« oder »dünken« wurden vermieden. Da die unmittelbare Prüfung des mittelrezensionellen griechischen Textes laut Datensatz noch aussteht, folgt der Entwurf vorsichtig dem öffentlichen englischen Zeugen und kennzeichnet besonders unsichere oder erklärungsbedürftige Stellen durch Fußnoten.
