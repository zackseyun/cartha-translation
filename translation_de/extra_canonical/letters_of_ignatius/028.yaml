review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Münzmetapher entsprechen dem bereitgestellten englischen Zeugen gut. Zwei Stellen gehen jedoch über ihn hinaus bzw. schwächen ihn ab: „der ihm bestimmte Ort“ deutet ἴδιος/„own“ als vorherbestimmt, und „seinem Leiden entsprechend zu sterben“ ersetzt die im Zeugen ausdrücklich erhaltene Bewegungsrichtung „unto/hinein in sein Leiden“ durch einen bloß vergleichenden Bezug.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Gepräge“ ist innerhalb der Münzmetapher idiomatischer und präziser als der Wechsel von „aufgeprägtes Bild“ zu „Bild“. Die abschließende Fortsetzungsmarkierung kann erhalten bleiben.
  terminology: „Münzprägungen“, „Gepräge“, „Ungläubige“, „Gläubige“, „Gott, der Vater“ und „Jesus Christus“ sind sachgerecht. „In Liebe“ bleibt absichtlich in seiner Zuordnung offen. Die Formulierung zum Sterben sollte die enge, ohne weitere dogmatische Auslegung belassene Verbindung zum Leiden Christi ausdrücken.
  issues:
  - severity: medium
    issue: „der ihm bestimmte Ort“ für „his own place“
    rationale: „Bestimmt“ fügt einen Gedanken der Vorherbestimmung hinzu, der im bereitgestellten Zeugen nicht ausgedrückt ist. „sein eigener Ort“ bewahrt die Offenheit der Vorlage.
  - severity: high
    issue: „seinem Leiden entsprechend zu sterben“ für „accept to die unto his passion“
    rationale: „Entsprechend“ verändert die Richtung und Teilhabeform der Vorlage zu einem bloßen Vergleich. Eine Formulierung mit „in sein Leiden hinein“ bewahrt die markierte, ungewöhnliche Beziehung, ohne sie dogmatisch zu erklären.
  - severity: low
    issue: Uneinheitliche Wiedergabe der Prägungsmetapher mit „aufgeprägtes Bild“ und anschließend „Bild“
    rationale: „Gepräge“ hält das Bildfeld der Münze konsistent und gibt „stamp“ präzise wieder.
  revised_text: 'Da nun alles ein Ende hat und uns beides zugleich vor Augen steht – Leben und Tod –, wird jeder an seinen eigenen Ort gelangen. Denn wie es zwei Münzprägungen gibt, die eine von Gott und die andere von der Welt, und jede ihr eigenes Gepräge trägt, so tragen die Ungläubigen das Gepräge dieser Welt, die Gläubigen aber in Liebe das Gepräge Gottes, des Vaters, durch Jesus Christus. Wenn wir nicht aus freiem Entschluss annehmen, in sein Leiden hinein zu sterben, ist sein Leben nicht in uns: –'
  revised_footnotes: []
  revision_rationale: Die Revision entfernt die nicht belegte Bestimmung des jeweiligen Ortes, vereinheitlicht die Münzmetapher und stellt in der letzten Aussage die im Zeugen vorhandene Bewegung „unto his passion“ wieder her. Das bewusst markierte „in sein Leiden hinein zu sterben“ ist im Deutschen ungewöhnlich, bewahrt aber die Vorlage genauer als eine glättende Umschreibung und legt keine konfessionelle Deutung fest.
