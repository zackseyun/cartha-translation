base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: de
  text: 'Da nun alles ein Ende hat und uns beides zugleich vor Augen steht – Leben und Tod –, wird jeder an den ihm bestimmten Ort gelangen. Denn wie es zwei Münzprägungen gibt, die eine von Gott und die andere von der Welt, und jede ihr eigenes aufgeprägtes Bild trägt, so tragen die Ungläubigen das Bild dieser Welt, die Gläubigen aber in Liebe das Bild Gottes, des Vaters, durch Jesus Christus. Wenn wir nicht aus freiem Entschluss bereit sind, seinem Leiden entsprechend zu sterben, ist sein Leben nicht in uns: –'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέλος / end (as reflected in the supplied witness)
  choice: Ende
  rationale: Bewahrt die allgemeine Aussage über die Begrenztheit beziehungsweise das Ziel aller Dinge, ohne die mangels direkter griechischer Prüfung bestehende Bedeutungsbreite unnötig festzulegen.
- source_word: δύο νομίσματα / two coinages (as reflected in the supplied witness)
  choice: zwei Münzprägungen
  rationale: Erhält das antike Bild zweier verschiedener Prägungen und klingt im Deutschen verständlicher als das abstrakte „Münzwesen“.
- source_word: χαρακτήρ / stamp (as reflected in the supplied witness)
  choice: aufgeprägtes Bild; Bild
  rationale: Macht die Münzmetapher natürlich verständlich und bewahrt zugleich den Gedanken eines kennzeichnenden Gepräges.
- source_word: ἴδιος τόπος / own place (as reflected in the supplied witness)
  choice: der ihm bestimmte Ort
  rationale: Gibt den eschatologischen Sinn idiomatisch wieder, ohne den Ort genauer zu bestimmen, als es die Textgrundlage erlaubt.
- source_word: ἐν ἀγάπῃ / in love (as reflected in the supplied witness)
  choice: in Liebe
  rationale: 'Belässt die syntaktische Zuordnung bewusst offen: Die Wendung kann die Gläubigen beziehungsweise ihr Tragen des göttlichen Bildes näher bestimmen.'
- source_word: αὐθαιρέτως / of our own free choice (as reflected in the supplied witness)
  choice: aus freiem Entschluss bereit sind
  rationale: Drückt Freiwilligkeit und bewusste Zustimmung in natürlichem modernem Deutsch aus.
- source_word: ἀποθανεῖν εἰς τὸ πάθος αὐτοῦ / die unto his passion (as reflected in the supplied witness)
  choice: seinem Leiden entsprechend zu sterben
  rationale: Bewahrt den Bezug zu Christi Leiden, ohne ein im Deutschen missverständliches „in sein Leiden hinein sterben“ zu erzwingen.
theological_decisions:
- issue: Verhältnis des freiwilligen Sterbens zu Christi Leiden
  choice: „bereit sind, seinem Leiden entsprechend zu sterben“
  alternative: „freiwillig in sein Leiden hinein sterben“ oder „um seines Leidens willen sterben“
  rationale: Die Formulierung wahrt die enge Verbindung zwischen dem Tod der Gläubigen und Christi Leiden, legt aber weder eine rein mystische Vereinigung noch ausschließlich Martyrium als einzige Deutung fest.
- issue: Das Bild beziehungsweise Gepräge Gottes in den Gläubigen
  choice: „das Bild Gottes, des Vaters, durch Jesus Christus“
  alternative: „das Siegel Gottes“
  rationale: „Bild“ hält die Münzmetapher zusammen und vermeidet eine zusätzliche sakramentale Festlegung, die „Siegel“ nahelegen könnte.
- issue: Folge fehlender freiwilliger Teilhabe am Leiden
  choice: „ist sein Leben nicht in uns“
  alternative: „haben wir sein Leben nicht in uns“
  rationale: Die prädikative Form folgt der überlieferten Aussage eng und bewahrt ihre zugespitzte theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Münzmetapher. Der Doppelpunkt mit Gedankenstrich am Ende signalisiert, dass der Satz im folgenden Abschnitt weitergeführt wird. Da die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, wurde die Übersetzung eng am angegebenen öffentlichen englischen Zeugen ausgerichtet und interpretative Präzisierung vermieden.
