base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: de
  text: 'Darum: Wie der Herr nichts ohne den Vater tat – [mit ihm vereint] –, weder durch sich selbst noch durch die Apostel, so tut auch ihr nichts ohne den Bischof und die Ältesten.[a] Versucht auch nicht, für euch allein etwas für richtig zu halten, unabhängig von den anderen. Vielmehr soll es ein gemeinsames Gebet geben, ein Flehen, einen Sinn, eine Hoffnung, in untadeliger Liebe und Freude: Jesus Christus, über den hinaus es nichts Besseres gibt.


    Beeilt euch, alle zusammenzukommen wie zu einem einzigen Tempel, nämlich Gott; wie zu einem einzigen Altar, nämlich zu dem einen Jesus Christus. Er ging aus dem einen Vater hervor, war bei dem Einen und kehrte zu dem Einen zurück.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise als kirchliche Amtsbezeichnung auch: »die Presbyter«.'
    reason: Kennzeichnet die wichtige lexikalische Alternative zu »Ältesten«.
  - marker: b
    text: 'Die englische Textgrundlage lautet wörtlicher: »der aus dem einen Vater hervorging, bei dem Einen ist und zu dem Einen fortging«. Die Übersetzung »kehrte … zurück« gibt die Bewegungsrichtung idiomatisch wieder. Eine unmittelbare Prüfung am griechischen Text steht noch aus.'
    reason: Legt die vorläufige Quellengrundlage offen und bewahrt die Unsicherheit bei der letzten Verbfolge.
lexical_decisions:
- source_word: presbyters (πρεσβύτεροι, nach der griechischen Überlieferung zu erwarten)
  choice: Ältesten
  rationale: Gibt die Amtsbezeichnung verständlich und relativ traditionsneutral wieder; »Presbyter« wäre formnäher, aber für viele heutige Leser weniger unmittelbar verständlich.
- source_word: one mind
  choice: einen Sinn
  rationale: Bewahrt den Gedanken gemeinsamer innerer Ausrichtung, ohne ihn auf bloße Meinungseinheit zu verengen.
- source_word: supplication
  choice: Flehen
  rationale: Unterscheidet das dringliche Bitten vom allgemeineren »Gebet«.
- source_word: altar
  choice: Altar
  rationale: Erhält das kultische Bild und seine theologische Spannung, statt es erklärend abzuschwächen.
- source_word: came forth … is/was with … departed unto
  choice: ging … hervor, war bei … und kehrte … zurück
  rationale: Bildet die dreigliedrige Bewegung natürlich ab. »Kehrte zurück« macht das Ziel verständlich, ohne die Aussage dogmatisch weiter auszugestalten.
theological_decisions:
- issue: Zusammenwirken des Herrn mit dem Vater und den Aposteln
  choice: »weder durch sich selbst noch durch die Apostel«
  alternative: »weder aus eigener Vollmacht noch durch die Apostel«
  rationale: Die gewählte Fassung wahrt die eigentümliche Parallelstruktur und vermeidet eine zusätzliche Aussage über Vollmacht, die im vorliegenden Zeugen nicht ausdrücklich steht.
- issue: Identifikation von Hoffnung beziehungsweise untadeliger Liebe und Freude mit Jesus Christus
  choice: Doppelpunkt vor »Jesus Christus«
  alternative: 'Relativsatz: »die Jesus Christus ist«'
  rationale: Der griechische Ausgangstext ist noch nicht direkt geprüft. Der Doppelpunkt erhält die mögliche appositionelle Identifikation, ohne grammatisch stärker festzulegen, worauf »welches« genau zurückweist.
- issue: Einheitssprache vom Vater
  choice: »der eine Vater … bei dem Einen … zu dem Einen«
  alternative: »ein Vater … bei einem … zu einem«
  rationale: Die Großschreibung in den letzten beiden Wendungen signalisiert den personalen Bezug auf den Vater und bewahrt zugleich die rhetorische Wiederholung des Einen.
- issue: Kirchliche Leitungsämter
  choice: »Bischof und die Ältesten«
  alternative: »Bischof und Presbyter«
  rationale: Die Übersetzung bleibt historisch erkennbar, ohne die Begriffe vorschnell mit einer bestimmten späteren Konfessionsordnung gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Die eckigen Klammern um »mit ihm vereint« bleiben als textkritisches beziehungsweise ergänzendes Signal des englischen Zeugen erhalten. Da keine griechische Lesart mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf bewusst quellenkritisch vorläufig; ungewöhnliche Syntax und theologische Spannung wurden nicht stillschweigend harmonisiert.
