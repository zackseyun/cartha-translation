review_pass:
  verdict: revise
  source_fidelity: 'Eine Korrektur ist nötig: Die Vorlage hat im letzten Christussatz Gegenwartsform („is“) und lediglich „departed unto“, nicht „war“ und nicht ausdrücklich „kehrte ... zurück“. Diese zeitliche und semantische Festlegung sollte im Deutschen nicht hinzugefügt werden. Die Aufzählung nach „es soll ... geben“ benötigt zudem durchgehend den Nominativ. Die Stellung von „untadelig“ ist so zu ordnen, dass sie wie in der englischen Zeugenvorlage die Liebe qualifiziert und der Bezug von „die Jesus Christus ist“ bei der Freude verbleibt.'
  naturalness: Die revidierte Fassung bleibt würdevoll und gut verständlich. „Haltet ... für richtig“ und „Drängt darauf, alle zusammenzukommen“ sind im modernen Standarddeutsch natürlicher als die bisherigen, teils schwerfälligen Formulierungen, ohne den paränetischen Charakter abzuschwächen.
  terminology: „Bischof und Älteste“ ist als verständliche, nicht konfessionell festgelegte Wiedergabe vertretbar; die Fußnote sichert „Presbyter“ als fachsprachliche Alternative. „Flehen“, „Sinn“, „Altar“ und die bewusste Wiederholung von „dem Einen“ bewahren die Terminologie und Bildsprache der Vorlage.
  issues:
  - severity: medium
    issue: „war bei dem Einen und kehrte zu dem Einen zurück“
    rationale: Die englische Vorlage liest „is with One and departed unto One“. „war“ verändert die Gegenwartsform; „kehrte zurück“ ergänzt eine Rückkehrbedeutung, die „departed unto“ nicht ausdrücklich enthält.
  - severity: medium
    issue: „ein Flehen, einen Sinn, eine Hoffnung“ nach „es soll ... geben“
    rationale: 'Die Reihung muss syntaktisch im Nominativ stehen: „ein Flehen, ein Sinn, eine Hoffnung“.'
  - severity: low
    issue: Zuordnung von „untadelig“ und „Jesus Christus“
    rationale: 'Die Zeichensetzung mit Doppelpunkt kann den Bezug unnötig verlagern. Die revidierte Satzfügung gibt die Abfolge der englischen Vorlage transparent wieder: untadelige Liebe; Freude, die Jesus Christus ist.'
  revised_text: 'Darum: Wie der Herr nichts ohne den Vater tat – [mit ihm vereint] –, weder selbst noch durch die Apostel, so tut auch ihr nichts ohne den Bischof und die Ältesten.[a] Versucht auch nicht, unabhängig von den anderen für euch selbst etwas für richtig zu halten. Vielmehr soll es ein gemeinsames Gebet geben, ein Flehen, ein Sinn, eine Hoffnung in untadeliger Liebe und in Freude, die Jesus Christus ist, über den hinaus es nichts Besseres gibt.


    Drängt darauf, alle zusammenzukommen wie zu einem Tempel, nämlich zu Gott; wie zu einem Altar, nämlich zu dem einen Jesus Christus. Er ging aus dem einen Vater hervor, ist bei dem Einen und ging zu dem Einen hin.[b]'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise als kirchliche Amtsbezeichnung auch: »die Presbyter«.'
    reason: Kennzeichnet die fachsprachliche lexikalische Alternative zu »Ältesten«, ohne eine spätere konfessionelle Ämterordnung vorauszusetzen.
  - marker: b
    text: 'Die englische Textgrundlage lautet: »who came forth from One Father and is with One and departed unto One«. Daher bewahrt die Übersetzung die Gegenwartsform bei »ist« und gibt die letzte Bewegung ohne die zusätzliche Deutung einer Rückkehr wieder. Eine unmittelbare Prüfung am griechischen Text steht noch aus.'
    reason: Korrigiert die bisherige Fußnote, die die Gegenwartsform und die vorsichtigere Bewegungsrichtung der vorliegenden Zeugenvorlage nicht vollständig wahrte.
  revision_rationale: Die Revision behebt den Kasusfehler und entfernt zwei nicht durch die vorliegende Textgrundlage gedeckte Präzisierungen im abschließenden Christussatz. Sie hält die eckige Klammer als Signal der englischen Zeugenvorlage bei, bewahrt die rhetorische Einheitsfolge und erklärt die weiterhin vorläufige Quellensituation ausschließlich in der Fußnote.
