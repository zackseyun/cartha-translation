  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/002.yaml
  text: 'While I welcomed in God [your] well beloved name, which ye bear by natural right, [in an upright and virtuous mind], by faith and love in Christ Jesus our Savior—being imitators of God, and having your hearts kindled in the blood of God, ye have perfectly fulfilled your congenial work—


    for when ye heard that I was on my way from Syria, in bonds for the sake of the common Name and hope, and was hoping through your prayers to succeed in fighting the wild beasts in Rome, that by so succeeding I might have power to be a disciple, ye were eager to visit me—


    seeing then in God''s name I have received your whole multitude in the person of Onesimus, whose love passeth utterance and who is moreover your bishop [in the flesh], and I pray that ye may love him according to Jesus Christ and that ye all may be like him; for blessed is He that granted unto you according to your deserving to have such a bishop.'
translation:
  language: de
  text: 'Als ich in Gott euren vielgeliebten Namen empfing, den ihr von Natur aus besitzt – [in aufrechter und tugendhafter Gesinnung] – durch Glauben und Liebe in Christus Jesus, unserem Retter, habt ihr als Nachahmer Gottes, nachdem ihr im Blut Gottes euer euch entsprechendes Werk neu entfacht habt,[a] dieses vollkommen erfüllt.


    Denn als ihr hörtet, dass ich, um des gemeinsamen Namens und der gemeinsamen Hoffnung willen gefesselt, von Syrien unterwegs war und hoffte, durch eure Gebete den Kampf mit den wilden Tieren in Rom bestehen zu können, damit es mir, wenn ich ihn bestehe, möglich sei, ein Jünger zu sein, habt ihr euch bemüht, mich zu sehen.


    So habe ich denn im Namen Gottes eure ganze Gemeinde in Onesimus empfangen, einem Mann von unaussprechlicher Liebe, der zudem euer Bischof [dem Fleisch nach] ist. Ich bete darum, dass ihr ihn nach Jesus Christus liebt und dass ihr alle ihm ähnlich seid. Denn selig ist der, der euch gewährt hat, einen solchen Bischof zu haben, wie ihr es verdient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nachdem ihr im Blut Gottes euer euch entsprechendes Werk neu entfacht habt“. Die ungewöhnliche Wendung „Blut Gottes“ ist bewusst nicht zu „Blut Christi“ geglättet.'
    reason: Die Fußnote erläutert die syntaktische Zuordnung von „neu entfacht“ zum „Werk“ und erhält zugleich die christologisch markante, nicht zu harmonisierende Formulierung.
lexical_decisions:
- source_word: ὄνομα
  choice: Name
  rationale: Bewahrt die ignatianische Mehrdeutigkeit zwischen dem Namen der Gemeinde beziehungsweise ihrem Ruf und dem gemeinsam bekannten göttlich-christlichen Namen.
- source_word: συγγενικόν ἔργον
  choice: das euch entsprechende Werk
  rationale: Gibt die Vorstellung eines wesensverwandten oder der eigenen Art gemäßen Handelns wieder, ohne die schwer verständliche Wendung unnötig festzulegen.
- source_word: θηριομαχῆσαι
  choice: den Kampf mit den wilden Tieren ... bestehen
  rationale: Bezeichnet den erwarteten Kampf in der römischen Arena; die Formulierung wahrt sowohl das konkrete Geschehen als auch Ignatius’ Sicht auf dessen Ausgang.
- source_word: μαθητής
  choice: Jünger
  rationale: Erhält den religiösen Sinn der Nachfolge und reduziert ihn nicht auf den neutraleren Begriff „Schüler“.
- source_word: ἐπίσκοπος
  choice: Bischof
  rationale: Der konventionelle frühchristliche Amtsbegriff ist im Deutschen verständlich und entspricht Onesimus’ ausdrücklich genannter Gemeindefunktion.
theological_decisions:
- issue: „im Blut Gottes entflammt“
  choice: Die auffällige Gottesprädikation bleibt im Haupttext erhalten.
  alternative: „im Blut Christi entflammt“ oder eine metaphorisch abgeschwächte Formulierung
  rationale: Die überlieferte Wendung trägt eine starke christologische Spannung und darf nicht durch eine dogmatisch glättende Identifikation oder Abschwächung ersetzt werden.
- issue: Martyrium und Jüngerschaft
  choice: „damit es mir ... vergönnt sei, ein Jünger zu sein“
  alternative: „damit ich mich als wahrer Jünger erweise“
  rationale: Ignatius verbindet den bestandenen Tierkampf mit der Möglichkeit beziehungsweise Befähigung zur Jüngerschaft. Die Übersetzung vermeidet es, daraus ausdrücklich einen Verdienstbeweis zu machen.
- issue: „wie ihr es verdient“
  choice: Die Vergeltungs- oder Würdigkeitsaussage wird bewahrt.
  alternative: „in seiner Gnade“ oder „weil ihr dessen würdig seid“
  rationale: Die Spannung zwischen göttlichem Gewähren und der Würdigkeit der Gemeinde bleibt bestehen und wird nicht konfessionell harmonisiert.
- issue: „dem Fleisch nach“
  choice: Die textkritisch beziehungsweise überlieferungsgeschichtlich unsichere Wendung bleibt in eckigen Klammern.
  alternative: Auslassung oder unmarkierte Aufnahme
  rationale: Die gelieferten Quelldaten kennzeichnen die Worte als ergänzend oder unsicher; diese Transparenz muss erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Briefcharakter. Lange Perioden wurden behutsam gegliedert. Die eckigen Klammern der Vorlage bleiben als Unsicherheitssignale erhalten. Da eine direkte Prüfung des griechischen Textes laut Datensatz noch aussteht, ist der Entwurf als quellenbewusste, aber vorläufige Fassung zu behandeln.
