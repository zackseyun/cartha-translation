base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: de
  text: 'Möge ich in jeder Hinsicht Freude an euch haben, wenn ich dessen würdig bin. Denn obwohl ich in Fesseln liege, kann ich mich doch mit keinem von euch vergleichen, die ihr frei seid. Ich weiß, dass ihr nicht überheblich seid; denn ihr habt Jesus Christus in euch. Und wenn ich euch lobe, weiß ich, dass ihr euch nur umso mehr schämt, wie geschrieben steht: »Der Gerechte klagt sich selbst an.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung erinnert an Sprüche 18,17 in der griechischen Überlieferung. Die genaue Gestalt des Zitats und der griechische Wortlaut dieses Abschnitts müssen noch unmittelbar an der griechischen Textüberlieferung geprüft werden.
    reason: Der Entwurf beruht laut Datensatz vorläufig auf einem englischen Übersetzungszeugen; eine direkte Prüfung des Griechischen steht aus.
lexical_decisions:
- source_word: have joy of you
  choice: Freude an euch haben
  rationale: Gibt die relationale Freude idiomatisch und zugleich eng am überlieferten englischen Zeugen wieder.
- source_word: in bonds
  choice: in Fesseln liege
  rationale: Bewahrt das konkrete Bild der Gefangenschaft in natürlichem Deutsch.
- source_word: not puffed up
  choice: nicht überheblich
  rationale: Drückt fehlenden Hochmut in allgemein verständlicher, würdiger Sprache aus.
- source_word: have Jesus Christ in yourselves
  choice: Jesus Christus in euch haben
  rationale: Erhält die innere, christologische Aussage ohne sie näher auszudeuten.
- source_word: a self-accuser
  choice: klagt sich selbst an
  rationale: Bewahrt die forensische Bildsprache und die mögliche Spannung des Zitats.
theological_decisions:
- issue: Christus in den Glaubenden
  choice: ihr habt Jesus Christus in euch
  alternative: Jesus Christus wohnt in euch
  rationale: Die gewählte Fassung bleibt beim vorliegenden Zeugen und vermeidet, durch »wohnt« eine zusätzliche metaphorische Präzisierung einzuführen.
- issue: Selbstanklage des Gerechten
  choice: Der Gerechte klagt sich selbst an
  alternative: Der Gerechte ist sein eigener Ankläger
  rationale: Die verbale Form ist im modernen Deutsch klar und lässt offen, ob Selbstprüfung, Bekenntnis oder eine gerichtliche Metapher im Vordergrund steht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem frühchristlichem Briefton. Die direkte Anrede im Plural und die knappen Gegensätze zwischen Fesseln, Freiheit, Lob und Scham bleiben erhalten. Wegen der noch ausstehenden Prüfung des griechischen Ausgangstextes ist die Fassung ausdrücklich vorläufig.
