review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung folgt dem vorliegenden englischen Zeugen insgesamt eng. Die griechische Überlieferung bestätigt wesentliche Punkte: Gefangenschaft gegenüber den „Befreiten/Freien“, fehlenden Hochmut, Christus „in“ den Adressaten sowie das Selbstanklagewort. In „wenn ich dessen würdig bin“ fügt „dessen“ jedoch einen im Wortlaut nicht bezeichneten Bezug hinzu; „wenn ich würdig bin“ wahrt die offene Bedingung.'
  naturalness: Modernes, würdiges Standarddeutsch. „Keinem von euch ... kann ich mich ... vergleichen“ ist verständlich, aber „keinem ... gleich“ gibt die knappe Gegenüberstellung idiomatischer und näher am Sinn wieder.
  terminology: „Fesseln“, „überheblich“, „Jesus Christus in euch“ und „klagt sich selbst an“ sind angemessen. Das Schlusswort entspricht dem griechischen Zitat aus Sprüche 18,17 in der Septuaginta; die Fußnote sollte dies als Bezug ausweisen, statt nur von einer bloßen Erinnerung zu sprechen.
  issues:
  - severity: low
    issue: Zusätzlicher Bezug in „dessen würdig“
    rationale: Die Bedingung nennt im zugrunde liegenden Wortlaut kein ausdrückliches Bezugsobjekt. Die verkürzte Form „wenn ich würdig bin“ erhält diese Offenheit.
  - severity: low
    issue: Fußnote zum Zitat zu zurückhaltend und zugleich unnötig unsicher formuliert
    rationale: „Der Gerechte klagt sich selbst an“ entspricht dem Anfang von Sprüche 18,17 nach der Septuaginta. Die Fußnote kann den Bezug klar benennen und die noch ausstehende Gesamtprüfung der griechischen Ignatius-Überlieferung sachlich einordnen.
  revised_text: 'Möge ich in jeder Hinsicht Freude an euch haben, wenn ich würdig bin. Denn obwohl ich in Fesseln liege, bin ich doch keinem von euch gleich, die ihr frei seid. Ich weiß, dass ihr nicht überheblich seid; denn ihr habt Jesus Christus in euch. Und wenn ich euch lobe, weiß ich, dass ihr euch nur umso mehr schämt, wie geschrieben steht: »Der Gerechte klagt sich selbst an.«[a]'
  revised_footnotes:
  - marker: a
    text: 'Zitat bzw. Anspielung auf Sprüche 18,17 nach der Septuaginta: »Der Gerechte ist am Anfang seiner Rede sein eigener Ankläger.« Die genaue Textgestalt in der griechischen Überlieferung des Ignatiusbriefes ist noch unmittelbar zu prüfen.'
    reason: Benennt den erkennbaren alttestamentlich-griechischen Bezug und wahrt den Vorbehalt wegen der ausstehenden direkten Prüfung des Ignatius-Textes.
  revision_rationale: Die Revision beseitigt eine kleine interpretierende Ergänzung, glättet die Vergleichsformulierung und präzisiert den Zitatnachweis. Aussagegehalt, frühchristlicher Briefton und die im Entwurf bewahrte Offenheit der christologischen und forensischen Sprache bleiben erhalten.
