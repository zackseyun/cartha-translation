base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: de
  text: 'Auch die Priester waren gut; besser aber ist der Hohe Priester, dem das Allerheiligste anvertraut ist. Denn ihm allein sind die verborgenen Dinge Gottes anvertraut. Er selbst ist die Tür des Vaters, durch die Abraham, Isaak und Jakob eintreten, ebenso die Propheten, die Apostel und die ganze Kirche. Dies alles kommt in der Einheit Gottes zusammen.


    Das Evangelium aber hat einen einzigartigen Vorrang: Es verkündet das Kommen des Retters, unseres Herrn Jesus Christus, sein Leiden und seine Auferstehung.[a] Denn die geliebten Propheten wiesen in ihrer Verkündigung auf ihn hin; das Evangelium aber ist die Vollendung der Unsterblichkeit.[b] Alles zusammen ist gut, wenn ihr durch Liebe glaubt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Wortlaut kann enger auch verstanden werden: „Das Evangelium hat einen einzigartigen Vorrang im Kommen des Retters …, in seinem Leiden und seiner Auferstehung.“'
    reason: Die syntaktische Beziehung der Aufzählung zu „Evangelium“ und „Vorrang“ ist im zugrunde gelegten englischen Zeugen nicht völlig eindeutig; eine direkte Prüfung des Griechischen steht noch aus.
  - marker: b
    text: 'Auch möglich: „die Erfüllung der Unsterblichkeit“. Die ungewöhnliche Wendung bleibt bewusst ohne nähere dogmatische Auslegung.'
    reason: „Completion“ kann je nach griechischem Ausgangswort sowohl Vollendung als auch Erfüllung bezeichnen; die griechische Quellenprüfung ist noch ausstehend.
lexical_decisions:
- source_word: High-priest
  choice: Hohe Priester
  rationale: Bewahrt den kultischen Titel und den erkennbaren Bezug auf Christus; im Satz als Titel großgeschrieben.
- source_word: holy of holies
  choice: Allerheiligste
  rationale: Die geläufige und würdige deutsche Bezeichnung für den innersten Heiligtumsbereich.
- source_word: hidden things of God
  choice: verborgenen Dinge Gottes
  rationale: Hält die offene Bedeutung des Zeugnisses fest, ohne sie als bestimmte Geheimlehren auszudeuten.
- source_word: door of the Father
  choice: Tür des Vaters
  rationale: Bewahrt das johanneisch anmutende Bild direkt und verständlich.
- source_word: combine in the unity of God
  choice: kommt in der Einheit Gottes zusammen
  rationale: Gibt die Bewegung auf Einheit hin natürlich wieder, ohne genauer festzulegen, ob institutionelle, heilsgeschichtliche oder metaphysische Einheit gemeint ist.
- source_word: Gospel
  choice: Evangelium
  rationale: Behält den etablierten frühchristlichen Begriff bei; der Kontext kann sowohl Botschaft als auch ihre heilsgeschichtliche Wirklichkeit umfassen.
- source_word: passion
  choice: Leiden
  rationale: Im heutigen Deutsch verständlicher als „Passion“ und in christlichem Kontext sachgerecht.
- source_word: completion of immortality
  choice: Vollendung der Unsterblichkeit
  rationale: Bewahrt die ungewöhnliche und theologisch spannungsreiche Formulierung, statt sie erklärend aufzulösen.
- source_word: believe through love
  choice: durch Liebe glaubt
  rationale: Erhält die instrumentale oder vermittelnde Beziehung zwischen Glauben und Liebe und glättet sie nicht zu „in Liebe glauben“.
theological_decisions:
- issue: Identität des Hohen Priesters
  choice: Das maskuline Pronomen und der christologische Zusammenhang bleiben erhalten, ohne im Text ausdrücklich „Christus“ einzusetzen.
  alternative: „Christus, der Hohe Priester“
  rationale: Der Abschnitt legt die Identität nahe, doch die vorliegende Form nennt sie an dieser Stelle nicht ausdrücklich; die Übersetzung soll keine zusätzliche Explikation in den Haupttext eintragen.
- issue: Die Tür des Vaters
  choice: Das Bild wird wörtlich als „Tür des Vaters“ bewahrt.
  alternative: „der Zugang zum Vater“
  rationale: Die metaphorische Spannung und mögliche Anspielung auf johanneische Sprache sollen nicht durch eine Deutung ersetzt werden.
- issue: Verhältnis von Propheten und Evangelium
  choice: „Vollendung der Unsterblichkeit“ wird beibehalten.
  alternative: „vollendete Botschaft von der Unsterblichkeit“ oder „Erfüllung, die zur Unsterblichkeit führt“
  rationale: Die Alternativen würden festlegen, wie der Genitiv und „Vollendung“ zu verstehen sind; das Zeugnis bleibt mehrdeutig.
- issue: Glaube und Liebe
  choice: „wenn ihr durch Liebe glaubt“
  alternative: „wenn ihr in Liebe glaubt“
  rationale: „Durch“ bewahrt die im englischen Zeugnis erkennbare vermittelnde Kraft der Liebe, ohne das Verhältnis systematisch zu definieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Ton. „Kirche“, „Evangelium“, „Hoher Priester“ und „Allerheiligstes“ bleiben als etablierte Begriffe erhalten. Die Anrede „ihr“ entspricht dem pluralischen „ye“. Da nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die direkte griechische Prüfung ausdrücklich noch aussteht, ist der Entwurf als quellenbewusste, vorläufige Übersetzung formuliert; Unsicherheiten werden nicht verdeckt.
