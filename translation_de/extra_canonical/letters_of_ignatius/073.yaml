review_pass:
  verdict: revise
  source_fidelity: Die erste Hälfte folgt dem vorliegenden englischen Zeugen im Wesentlichen genau. In der zweiten Hälfte fügt „Es verkündet“ jedoch eine Aussagehandlung hinzu, die weder der englische Zeuge („has ... preeminence“) noch die dort wiedergegebene Aufzählungsstruktur verlangt. Das Evangelium wird als etwas charakterisiert, das mit dem Kommen, Leiden und der Auferstehung Christi einen besonderen Vorzug bzw. etwas Einzigartiges hat; es wird nicht ausdrücklich als deren Verkündigung bezeichnet. Die Neufassung wahrt diese Struktur. Die Wiedergaben „Allerheiligstes“, „verborgene Dinge Gottes“, „Tür des Vaters“ und „durch Liebe glaubt“ bleiben quellentreu und ohne zusätzliche dogmatische Festlegung.
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch und bewahrt einen angemessen würdigen Ton. „Dies alles“ kann sich im Deutschen sachlich auf Dinge statt auf die zuvor genannten Personen beziehen; „Sie alle“ macht den Bezug klarer. „Einen einzigartigen Vorzug“ ist in diesem Kontext natürlich und ermöglicht die anschließende Aufzählung ohne die interpretierende Ergänzung „verkündet“.
  terminology: Die etablierten Begriffe „Hoher Priester“, „Allerheiligstes“, „Evangelium“, „Propheten“, „Apostel“ und „Auferstehung“ sind passend. „Vollendung der Unsterblichkeit“ lässt die auffällige Formulierung des englischen Zeugen bestehen. Da die direkte griechische Prüfung laut Kontext noch aussteht, bleibt die alternative Wiedergabe „Erfüllung“ sinnvoll als textkritisch-lexikalische Vorsicht, ohne eine dogmatische Deutung zu bieten.
  issues:
  - severity: medium
    issue: Interpretierende Hinzufügung „Es verkündet“ im Satz über das Evangelium.
    rationale: Der vorliegende Zeuge beschreibt einen besonderen Vorrang bzw. eine besondere Eigenheit des Evangeliums in Bezug auf Kommen, Leiden und Auferstehung. Die Aussage, das Evangelium „verkünde“ diese Ereignisse, ist zwar naheliegend, wird aber nicht explizit gesagt und verändert die Prädikation.
  - severity: low
    issue: „Dies alles“ ist als Rückbezug auf die aufgezählten Personen weniger präzise.
    rationale: Die englische Wendung „all these things“ kann zwar pauschal wiedergegeben werden, doch der unmittelbare Bezug gilt Abraham, Isaak, Jakob, Propheten, Aposteln und der ganzen Kirche. „Sie alle“ ist im Deutschen klarer.
  - severity: low
    issue: Fußnote a erläutert eine durch die Haupttextfassung selbst erzeugte syntaktische Umformung.
    rationale: Nach Entfernung von „Es verkündet“ ist kein zusätzlicher Hinweis auf diese Lesart nötig; die Haupttextfassung kann die Struktur offen und unmittelbar wiedergeben.
  revised_text: 'Auch die Priester waren gut; besser aber ist der Hohe Priester, dem das Allerheiligste anvertraut ist. Denn ihm allein sind die verborgenen Dinge Gottes anvertraut. Er selbst ist die Tür des Vaters, durch die Abraham, Isaak und Jakob eintreten, ebenso die Propheten, die Apostel und die ganze Kirche. Sie alle kommen in der Einheit Gottes zusammen.


    Das Evangelium aber hat einen einzigartigen Vorzug: das Kommen des Retters, unseres Herrn Jesus Christus, sein Leiden und seine Auferstehung. Denn die geliebten Propheten wiesen in ihrer Verkündigung auf ihn hin; das Evangelium aber ist die Vollendung der Unsterblichkeit.[a] Alles zusammen ist gut, wenn ihr durch Liebe glaubt.'
  revised_footnotes:
  - marker: a
    text: 'Auch möglich: „die Erfüllung der Unsterblichkeit“. Die ungewöhnliche Wendung bleibt bewusst ohne nähere dogmatische Auslegung.'
    reason: „Completion“ kann je nach griechischem Ausgangswort sowohl Vollendung als auch Erfüllung bezeichnen; die griechische Quellenprüfung ist noch ausstehend.
  revision_rationale: Die sichere Korrektur entfernt die nicht ausdrücklich bezeugte Aussage „Es verkündet“ und gibt die besondere Stellung bzw. Eigenheit des Evangeliums als offene Aufzählung wieder. Der Personenbezug im vorangehenden Satz wird mit „Sie alle“ verdeutlicht. Die verbleibende Fußnote markiert die lexikalische Unsicherheit bei „Vollendung der Unsterblichkeit“, ohne den Haupttext zu überfrachten.
