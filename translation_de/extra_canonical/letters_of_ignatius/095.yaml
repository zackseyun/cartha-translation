review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng. Die Wiedergabe von „beyond the bishop“ als Begrenzung der Kenntnis auf den Bischof ist vertretbar, muss wegen der noch ausstehenden direkten Prüfung der griechischen Überlieferung als vorläufig markiert bleiben. „in flesh and in spirit“ sollte im Deutschen enger an der zweigliedrigen Form des Zeugen bleiben.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „dem Fleisch und dem Geist nach“ wirkt jedoch unnötig sperrig und weniger idiomatisch als „im Fleisch und im Geist“. „in Keuschheit bleiben“ ist verständlich, aber „in Keuschheit leben“ ist im Deutschen natürlicher, ohne den Sinn zu verändern.
  terminology: „böse Machenschaften“, „Keuschheit“, „Begierde“, „dem Herrn gemäß“ und „Bischof“ sind angemessen. „Kirche“ gibt die im englischen Zeugen stehende ekklesiale Bezeichnung sachgerecht wieder. Die Formulierung „Fleisch des Herrn“ ist bewusst beizubehalten und nicht zu „Leib“ zu harmonisieren.
  issues:
  - severity: low
    issue: Unidiomatische Wiedergabe von „in flesh and in spirit“
    rationale: „dem Fleisch und dem Geist nach“ ist zwar möglich, klingt im modernen Deutsch aber abstrakt und schwerfällig. „im Fleisch und im Geist“ bewahrt die formale Zweigliedrigkeit und ist lesbarer.
  - severity: low
    issue: „in Keuschheit bleiben“
    rationale: „in Keuschheit leben“ entspricht dem gemeinten fortdauernden Verbleiben und ist im modernen Standarddeutsch natürlicher.
  - severity: low
    issue: Vorläufigkeit der Deutung von „beyond the bishop“
    rationale: Die Fußnote soll ausdrücklich festhalten, dass die deutsche Satzauflösung dem englischen Arbeitszeugen folgt und am griechischen Wortlaut zu überprüfen ist; daraus darf keine feste Regel über eine geheime Verpflichtung abgeleitet werden.
