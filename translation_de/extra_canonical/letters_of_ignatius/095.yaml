base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: de
  text: 'Fliehe böse Machenschaften – oder vielmehr: Sprich darüber. Sage meinen Schwestern, sie sollen den Herrn lieben und mit ihren Männern zufrieden sein, dem Fleisch und dem Geist nach. Ebenso ermahne auch meine Brüder im Namen Jesu Christi, ihre Frauen zu lieben, wie der Herr die Kirche geliebt hat.


    Wenn jemand zur Ehre des Fleisches des Herrn in Keuschheit bleiben kann, soll er so bleiben, ohne sich dessen zu rühmen. Rühmt er sich, ist er verloren; und wird es außer dem Bischof noch jemandem bekannt, ist er befleckt.[a] Wenn Männer und Frauen heiraten, sollen sie ihre Verbindung mit Zustimmung des Bischofs eingehen, damit die Ehe dem Herrn gemäß geschlossen wird und nicht aus Begierde. Alles soll zur Ehre Gottes geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung dieses Satzes ist unsicher. Der vorliegende englische Zeuge versteht ihn offenbar so, dass die persönliche Verpflichtung zur Enthaltsamkeit nur dem Bischof bekannt sein soll. Eine Prüfung am griechischen Wortlaut steht noch aus.
    reason: Die syntaktische und sachliche Mehrdeutigkeit soll sichtbar bleiben, da nur ein englischer Übersetzungszeuge als unmittelbare Arbeitsgrundlage vorliegt.
lexical_decisions:
- source_word: evil arts
  choice: böse Machenschaften
  rationale: Gibt den vorliegenden englischen Zeugen natürlich und mit ausreichender Bedeutungsbreite wieder; eine genauere Bestimmung muss die noch ausstehende Prüfung des griechischen Wortlauts leisten.
- source_word: be content with
  choice: mit … zufrieden sein
  rationale: Bewahrt die Aussage des englischen Zeugen, ohne sie zu Gehorsam oder Unterordnung umzudeuten.
- source_word: in flesh and in spirit
  choice: dem Fleisch und dem Geist nach
  rationale: Erhält die zweigliedrige anthropologische Formulierung und ihre mögliche Spannung.
- source_word: chastity
  choice: Keuschheit
  rationale: Der Ausdruck kann hier sexuelle Enthaltsamkeit beziehungsweise ehelosen Verzicht bezeichnen; „Keuschheit“ lässt die genaue Reichweite offen.
- source_word: concupiscence
  choice: Begierde
  rationale: Modern verständlich und gegenüber dem stärker konfessionell geprägten „Konkupiszenz“ vorzuziehen.
- source_word: after the Lord
  choice: dem Herrn gemäß
  rationale: Natürliches Deutsch, das die normative Ausrichtung am Herrn wiedergibt.
theological_decisions:
- issue: Bezug von „Fleisch des Herrn“
  choice: wörtlich als „Fleisch des Herrn“ bewahrt
  alternative: „Leib des Herrn“ oder eine erklärende Deutung auf Christi Ehelosigkeit
  rationale: Die ungewöhnliche Formulierung trägt theologische Spannung und darf ohne Prüfung des griechischen Textes nicht vereindeutigt werden.
- issue: Kenntnis des Bischofs
  choice: „wird es außer dem Bischof noch jemandem bekannt“
  alternative: „wenn er sich über den Bischof hinaus bekannt macht“ oder „wenn es ohne den Bischof bekannt wird“
  rationale: Der englische Zeuge ist an dieser Stelle mehrdeutig; die Übersetzung bewahrt die wahrscheinlich gemeinte Begrenzung der Kenntnis, kennzeichnet sie aber mit einer Fußnote als vorläufig.
- issue: Rolle der bischöflichen Zustimmung bei der Ehe
  choice: „mit Zustimmung des Bischofs“
  alternative: „unter Mitwirkung des Bischofs“ oder „mit Wissen des Bischofs“
  rationale: Folgt dem vorliegenden Zeugen, ohne daraus eine spätere sakramentale oder kirchenrechtliche Lehre abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Imperativ. Archaismen des englischen Zeugen wurden vermieden. Der Entwurf ist ausdrücklich vorläufig, weil die direkte Prüfung der griechischen Überlieferung noch aussteht.
