base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: de
  text: 'Ich befehle euch nicht, als wäre ich jemand von Bedeutung. Denn auch wenn ich um des Namens willen in Fesseln liege, bin ich in Jesus Christus noch nicht vollendet. [Denn][a] jetzt beginne ich erst, ein Jünger zu sein, und ich spreche zu euch wie zu meinen Mitschülern. Denn ich sollte von euch für den Wettkampf geschult werden: im Glauben, in der Ermahnung, im Ausharren und in der Langmut.


    Doch weil die Liebe mich nicht schweigen lässt, wenn es um euch geht, war es mir ein Anliegen, euch zu ermahnen, im Einklang mit dem Denken Gottes zu laufen. Denn auch Jesus Christus, unser untrennbares Leben, ist das Denken des Vaters; ebenso sind die Bischöfe, die bis in die fernsten Gegenden der Erde eingesetzt sind, im Einklang mit dem Denken Jesu Christi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das eingeklammerte „Denn“ folgt dem überlieferten Textzeugen als gekennzeichneter Textergänzung; eine direkte Prüfung am griechischen Text steht noch aus.
    reason: Bewahrt transparent das im bereitgestellten Ausgangszeugnis markierte textkritische Signal.
  - marker: b
    text: „Denken“ kann hier auch „Gesinnung“, „Absicht“, „Urteil“ oder „Wille“ bedeuten. Die Formulierung „im Einklang mit“ gibt die Beziehung wieder, ohne diese Bedeutungsbreite auf eine einzige Lesart zu verengen.
    reason: Macht die für den Gedankengang und seine theologische Deutung wichtige lexikalische Offenheit sichtbar.
lexical_decisions:
- source_word: ὄνομα / “the Name” (as reflected in the supplied witness)
  choice: der Name
  rationale: Bewahrt die frühchristliche ehrfürchtige Kurzbezeichnung, ohne den Bezug ausdrücklich aufzulösen.
- source_word: μαθητής / “disciple”
  choice: Jünger
  rationale: Gibt die religiöse Schüler- und Nachfolgebeziehung angemessen wieder und passt zum anschließenden Bild der Mitschüler.
- source_word: συμμαθηταί / “school-fellows”
  choice: Mitschüler
  rationale: Erhält Ignatius’ demütige Darstellung, nach der Absender und Empfänger gemeinsam Lernende sind.
- source_word: ἀγών / “contest”
  choice: Wettkampf
  rationale: Bewahrt das agonistische Bild von Übung, Anstrengung und Bewährung.
- source_word: ὑπομονή / “endurance”
  choice: Ausharren
  rationale: Bezeichnet standhaftes Bleiben unter Belastung, ohne es mit bloßer Passivität gleichzusetzen.
- source_word: μακροθυμία / “long-suffering”
  choice: Langmut
  rationale: Unterscheidet die geduldige Nachsicht gegenüber Belastungen oder Menschen vom vorhergehenden Ausharren.
- source_word: γνώμη / “mind”
  choice: Denken; im Einklang mit dem Denken
  rationale: Hält die Bedeutungsbreite von Gesinnung, Absicht, Urteil und Willen offen. Wo die deutsche Syntax es erfordert, wird die relationale Wendung natürlich als „im Einklang mit“ formuliert.
- source_word: τρέχειν / “run”
  choice: laufen
  rationale: Erhält das Bewegungs- und Wettkampfbild, statt es zu „leben“ oder „handeln“ zu verflachen.
- source_word: ἀχώριστος ζωή / “inseparable life”
  choice: unser untrennbares Leben
  rationale: Folgt der markanten christologischen Formulierung und vermeidet eine erklärende Paraphrase.
- source_word: ἐπίσκοποι / “bishops”
  choice: Bischöfe
  rationale: Verwendet die etablierte frühkirchliche Amtsbezeichnung, ohne spätere konfessionelle Amtskonzepte in den Text einzutragen.
theological_decisions:
- issue: „Jesus Christus … ist das Denken des Vaters“
  choice: Die Identitätsaussage wird wörtlich und spannungsvoll beibehalten.
  alternative: „Jesus Christus entspricht dem Willen des Vaters“ oder „offenbart den Willen des Vaters“
  rationale: Die erklärenden Alternativen würden die starke Aussage abschwächen und ihre christologische Offenheit vorzeitig festlegen.
- issue: „um des Namens willen“
  choice: „der Name“ bleibt ohne ausdrückliche Ergänzung stehen.
  alternative: „um des Namens Jesu willen“
  rationale: Der unmittelbare Bezug ist wahrscheinlich, doch die ehrfürchtige Kurzform des Zeugnisses soll nicht stillschweigend erweitert werden.
- issue: Beziehung der Bischöfe zum Denken Jesu Christi
  choice: „im Einklang mit dem Denken Jesu Christi“
  alternative: „Vertreter des Willens Jesu Christi“
  rationale: Die gewählte Fassung wahrt die Aussage über Übereinstimmung, ohne daraus eine weitergehende Lehre über Repräsentation oder Autorität abzuleiten.
- issue: Stand der Vollendung und Jüngerschaft des Ignatius
  choice: „noch nicht vollendet“ und „beginne … erst“ werden ohne Harmonisierung nebeneinandergestellt.
  alternative: Eine abschwächende Deutung als bloße rhetorische Bescheidenheit
  rationale: Die geistliche Spannung zwischen Gefangenschaft um des Namens willen und noch ausstehender Vollendung gehört zur Aussage des Textes.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer frühchristlicher Bildsprache. Archaismen wurden vermieden; etablierte Begriffe wie „Jünger“, „Langmut“ und „Bischöfe“ bleiben erhalten. Da keine griechische Textgestalt mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf quellenbewusst, aber vorläufig: Er stützt sich auf den angegebenen öffentlichen englischen Zeugen und kennzeichnet besonders unsichere oder mehrdeutige Stellen.'
