  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt zentrale Bilder und Spannungen: Gefangenschaft „im Namen“, ausstehende Vollendung, gemeinsames Lernen, Wettkampf sowie die markante Aussage über Christus als γνώμη des Vaters. Zwei Formulierungen sollten jedoch näher an die Aussage herangeführt werden: ὀφείλω bezeichnet hier eine Verpflichtung („muss“), nicht bloß ein abgeschwächtes „sollte“; und die Ortsbestimmung bei den Bischöfen bezieht sich auf ihre Einsetzung in den fernsten Gegenden, nicht auf ein Ausgreifen der Einsetzung „bis in“ diese Gegenden. Eine unmittelbare Kontrolle an einer griechischen Edition bleibt nach den Metadaten ausstehend.'
