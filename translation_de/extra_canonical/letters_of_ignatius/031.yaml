  terminology: „Judentum“, „Gnade“, „Wort“, „Schweigen“ und „offenbart“ sind sachgerecht. „göttliche Propheten“ ist für θεῖοι vertretbar. Die christologisch markante Wendung vom Wort, das aus dem Schweigen hervorging, bleibt ohne dogmatische Deutung erhalten.
