base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: de
  text: 'Lasst euch nicht durch fremdartige Lehren oder durch alte, nutzlose Fabeln irreführen. Denn wenn wir bis zum heutigen Tag nach Art des Judentums leben, gestehen wir damit ein, dass wir die Gnade nicht empfangen haben.


    Denn die göttlichen Propheten lebten gemäß Christus Jesus.[a] Deshalb wurden auch sie verfolgt. Seine Gnade beseelte sie, damit sie die Ungehorsamen völlig davon überzeugten, dass es einen Gott gibt, der sich durch Jesus Christus, seinen Sohn, offenbart hat. Dieser ist sein Wort, das aus dem Schweigen hervorging, und er gefiel dem, der ihn gesandt hatte, in allem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlicher lässt sich die überlieferte Formulierung auch mit „lebten nach Christus Jesus“ wiedergeben. Gemeint ist hier wahrscheinlich, dass die Propheten ihr Leben an Christus ausrichteten oder auf ihn hin lebten, nicht dass sie zeitlich erst nach ihm lebten.
    reason: Die Formulierung „lived after Christ Jesus“ ist ohne direkte Prüfung des griechischen Textes mehrdeutig und könnte im Deutschen irrtümlich rein zeitlich verstanden werden.
lexical_decisions:
- source_word: strange doctrines
  choice: fremdartige Lehren
  rationale: Bewahrt den abwertenden Sinn des Zeugnisses, ohne bloße Neuheit pauschal zu verurteilen.
- source_word: antiquated fables
  choice: alte, nutzlose Fabeln
  rationale: Gibt Alter und ausdrücklich genannte Nutzlosigkeit natürlich wieder; „Fabeln“ bewahrt den polemischen Charakter.
- source_word: after the manner of Judaism
  choice: nach Art des Judentums
  rationale: Eine relativ formnahe Wiedergabe, die nicht unnötig konkretisiert, welche jüdischen Praktiken gemeint sind.
- source_word: lived after Christ Jesus
  choice: lebten gemäß Christus Jesus
  rationale: „Gemäß“ gibt die wahrscheinlich gemeinte Ausrichtung an Christus wieder, während die schwierige Formulierung in einer Fußnote kenntlich bleibt.
- source_word: being inspired by His grace
  choice: Seine Gnade beseelte sie
  rationale: Natürliches Deutsch für eine innere Befähigung oder Eingebung durch Gnade, ohne eine technische Inspirationslehre festzulegen.
- source_word: proceeded from silence
  choice: aus dem Schweigen hervorging
  rationale: Bewahrt die auffällige und theologisch offene Aussage, ohne sie spekulativ auszudeuten.
- source_word: well-pleasing
  choice: gefiel ... in allem
  rationale: Idiomatiche und würdevolle Wiedergabe der umfassenden Zustimmung des Sendenden.
theological_decisions:
- issue: Verhältnis der Propheten zu Christus
  choice: „lebten gemäß Christus Jesus“ mit Fußnote
  alternative: „lebten nach Christus Jesus“ oder „lebten auf Christus Jesus hin“
  rationale: Die Aussage ist sprachlich und sachlich spannungsvoll. Die Hauptfassung vermeidet eine rein chronologische Fehllektüre, während die Fußnote die wörtlichere Mehrdeutigkeit offenlegt.
- issue: Gottes Selbstoffenbarung durch den Sohn
  choice: „der sich durch Jesus Christus, seinen Sohn, offenbart hat“
  alternative: „der durch seinen Sohn Jesus Christus offenbar wurde“
  rationale: Bewahrt Gott als handelndes Subjekt und Jesus Christus als den Mittler der Offenbarung, ohne das genaue Verhältnis weiter zu definieren.
- issue: Das Wort aus dem Schweigen
  choice: unaufgelöst beibehalten
  alternative: als ewige Zeugung, geschichtliche Sendung oder Offenbarung ausdrücklich deuten
  rationale: Der Ausdruck ist theologisch markant, aber im vorliegenden Zeugnis nicht näher erklärt; eine konfessionelle oder metaphysische Präzisierung wäre ein Import.
- issue: „seine Gnade“
  choice: Bezug auf Christus Jesus
  alternative: Bezug auf Gott
  rationale: Der nächstliegende grammatische Bezug im englischen Zeugnis ist Christus Jesus; die Formulierung bleibt dennoch ohne dogmatische Ausarbeitung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Polemische Begriffe wurden beibehalten, aber nicht verschärft. Da die direkte Prüfung der griechischen mittelrezensionellen Überlieferung noch aussteht, ist die Fassung als quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses zu verstehen.
