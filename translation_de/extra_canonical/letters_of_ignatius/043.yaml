review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng. „das mir gesetzte Maß“ fügt jedoch eine nicht ausdrücklich belegte äußere Setzung des Maßes hinzu; die Selbstbegrenzung sollte ohne diese Zusatznuance formuliert werden. Außerdem ist die pluralische Bezugsgröße bei „diejenigen, die … sagen“ beizubehalten.
  naturalness: Würdevolles, modernes Standarddeutsch. „Ich wünsche zu leiden“ und „ist vielen zwar unsichtbar“ sind klarer und idiomatischer als die bisherigen Formulierungen. Die Bildsprache bleibt angemessen erhalten.
  terminology: „Sanftmut“, „Geißel“ und „Herrscher dieser Welt“ sind tragfähige, registergerechte Wiedergaben. „zunichtegemacht“ gibt die starke Aussage wieder, ohne sie lehrmäßig zu spezifizieren.
  issues:
  - severity: medium
    issue: „an das mir gesetzte Maß“
    rationale: Die Formulierung kann ein von außen gesetztes Maß nahelegen. Der Zeuge spricht von Selbstbemessung bzw. Selbstbegrenzung; diese Nuance sollte nicht ergänzt werden.
  - severity: low
    issue: Singular in „wer so zu mir redet“
    rationale: Der Ausgangstext und der vorausgehende Relativsatz beziehen sich auf mehrere Personen. Die Pluralform bewahrt die Referenz klarer.
  - severity: low
    issue: „bleibt zwar vielen verborgen“
    rationale: Dies ist möglich, verschiebt „unseen by many“ aber leicht in Richtung eines andauernden Verborgenseins. „ist vielen zwar unsichtbar“ entspricht unmittelbarer dem bezeugten Ausdruck.
  revised_text: 'Ich habe viele tiefe Gedanken in Gott. Doch ich halte mich selbst in den rechten Grenzen, damit ich nicht durch mein Rühmen zugrunde gehe. Denn jetzt muss ich mich umso mehr fürchten und darf nicht auf diejenigen hören, die mich überheblich machen wollen; denn diejenigen, die so zu mir reden, sind mir eine Geißel.


    Obwohl ich wünsche zu leiden, weiß ich nicht, ob ich dessen würdig bin. Der Neid des Teufels ist vielen zwar unsichtbar, doch gegen mich führt er einen umso heftigeren Krieg. Darum sehne ich mich nach Sanftmut, durch die der Herrscher dieser Welt zunichtegemacht wird.[a]'
  revised_footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem überlieferten englischen Zeugnis von J. B. Lightfoot; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus.
    reason: Die bereitgestellte Grundlage weist ausdrücklich darauf hin, dass die quellen­sprachliche Überprüfung noch aussteht; die Fußnote macht diesen textkritischen Vorbehalt transparent.
  revision_rationale: Die Revision entfernt die unbelegte Nuance eines von außen „gesetzten“ Maßes, stellt die pluralische Referenz wieder her und bildet „unseen indeed by many“ unmittelbarer ab. Im Übrigen werden die prägnanten Bilder und die vorsichtige, nicht dogmatisierende Terminologie beibehalten.
