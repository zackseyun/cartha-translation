    For though I desire to suffer, yet I know not whether I am worthy: for the envy of the devil is unseen indeed by many, but against me it wages the fiercer war. So then I crave gentleness, whereby the prince of this world is brought to nought.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: de
  text: 'Ich habe viele tiefe Gedanken in Gott. Doch ich halte mich an das mir gesetzte Maß, damit ich nicht durch mein Rühmen zugrunde gehe. Denn jetzt muss ich mich umso mehr fürchten und darf nicht auf diejenigen hören, die mich überheblich machen wollen; denn wer so zu mir redet, wird mir zur Geißel.


    Obwohl ich zu leiden wünsche, weiß ich nämlich nicht, ob ich dessen würdig bin. Der Neid des Teufels bleibt zwar vielen verborgen, doch gegen mich führt er einen umso heftigeren Krieg. Darum sehne ich mich nach Sanftmut, durch die der Herrscher dieser Welt zunichtegemacht wird.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem überlieferten englischen Zeugnis von J. B. Lightfoot; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus.
    reason: Die bereitgestellte Grundlage weist ausdrücklich darauf hin, dass die quellen­sprachliche Überprüfung noch aussteht; die Fußnote macht diesen textkritischen Vorbehalt transparent.
lexical_decisions:
- source_word: deep thoughts in God
  choice: tiefe Gedanken in Gott
  rationale: Bewahrt die ungewöhnliche geistliche Wendung und ihre mögliche Mehrdeutigkeit, ohne sie als Offenbarungen oder Einsichten näher festzulegen.
- source_word: take the measure of myself
  choice: halte mich an das mir gesetzte Maß
  rationale: Gibt den Gedanken bewusster Selbstbegrenzung wieder und vermeidet die im Deutschen missverständliche wörtliche Formulierung „ich messe mich selbst“.
- source_word: boasting
  choice: Rühmen
  rationale: „Rühmen“ ist würdig und lässt offen, ob eigenes Prahlen oder das Sich-Rühmen aufgrund fremden Lobes gemeint ist.
- source_word: puff me up
  choice: mich überheblich machen
  rationale: Überträgt das Bild sinngemäß als innere Aufgeblasenheit bzw. Hochmut in natürliches modernes Deutsch.
- source_word: scourge
  choice: Geißel
  rationale: Erhält das starke Bild für etwas, das schmerzt, züchtigt oder gefährdet.
- source_word: gentleness
  choice: Sanftmut
  rationale: Bewahrt den ethisch-geistlichen Gehalt stärker als das allgemeinere „Freundlichkeit“ oder „Milde“.
- source_word: prince of this world
  choice: Herrscher dieser Welt
  rationale: Entspricht dem johanneisch geprägten Ausdruck in verständlichem Deutsch, ohne den Rang durch „Fürst“ unnötig zu verengen.
- source_word: brought to nought
  choice: zunichtegemacht wird
  rationale: Gibt die starke Aussage von Entmachtung bzw. Wirkungslosigkeit wieder, ohne ihre genaue Art dogmatisch festzulegen.
theological_decisions:
- issue: Würdigkeit zum Leiden
  choice: „ob ich dessen würdig bin“
  alternative: „ob ich dafür geeignet bin“
  rationale: Die Formulierung bewahrt Ignatius’ Spannung zwischen Leidenswunsch und demütiger Ungewissheit, ohne Würdigkeit als Verdienstsystem auszudeuten.
- issue: Wirksamkeit der Sanftmut gegen den Herrscher dieser Welt
  choice: „durch die der Herrscher dieser Welt zunichtegemacht wird“
  alternative: „durch die die Macht des Herrschers dieser Welt gebrochen wird“
  rationale: Die kürzere Fassung hält die auffällige Aussage des Zeugnisses fest und erklärt nicht zusätzlich, ob Person, Herrschaft oder Wirksamkeit gemeint ist.
- issue: Identität des Herrschers dieser Welt
  choice: Titel ohne erläuternde Einfügung wiedergegeben
  alternative: „der Teufel, der Herrscher dieser Welt“
  rationale: Obwohl der Kontext auf den Teufel weist, wird die eigenständige Bezeichnung nicht ausdrücklich mit einer Glosse gleichgesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, klar gegliederten Sätzen. Bildhafte Schlüsselbegriffe wie „Geißel“, „Sanftmut“ und „Herrscher dieser Welt“ bleiben erhalten. Wegen der noch ausstehenden griechischen Quellenprüfung wurden mögliche Feinunterschiede nicht spekulativ aufgelöst.
