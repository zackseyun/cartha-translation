    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: de
  text: 'Da mir als Antwort auf mein Gebet zu Gott gewährt worden ist, eure Gott zugewandten Angesichter zu sehen, habe ich sogar mehr empfangen, als ich erbeten hatte. Denn in Fesseln, die ich um Jesu Christi willen trage,[a] hoffe ich, euch begrüßen zu können, wenn es Gottes Wille ist, dass ich für würdig erachtet werde, bis ans Ende zu gelangen.


    Der Anfang ist ja gut geordnet – wenn ich nur das Ziel erreiche und mein Erbe ungehindert empfange. Gerade eure Liebe macht mir Sorge, sie könnte mir schaden. Denn für euch ist es leicht, zu tun, was ihr wollt; für mich aber ist es schwer, zu Gott zu gelangen, wenn ihr mich nicht verschont.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher beziehungsweise enger am überlieferten Ausdruck: „in Christus Jesus Fesseln tragend“. Eine Prüfung am griechischen Wortlaut steht noch aus.'
    reason: Die Vorlage beruht auf einem englischen Übersetzungszeugen; die genaue syntaktische und theologische Nuance sollte bis zur direkten griechischen Prüfung kenntlich bleiben.
  - marker: b
    text: 'Gemeint ist offenbar: Wenn ihr davon abseht, zugunsten meiner Freilassung oder Rettung einzugreifen. Der Satz selbst lässt die konkrete Handlung unausgesprochen.'
    reason: Erklärt den historischen Zusammenhang, ohne ihn als ausdrücklichen Bestandteil des Haupttextes auszugeben.
lexical_decisions:
- source_word: godly countenances (Greek review pending)
  choice: Gott zugewandten Angesichter
  rationale: Bewahrt den religiösen Gehalt von „godly“, ohne die Personen selbst schlicht als „göttlich“ zu bezeichnen; „Angesichter“ trägt den würdigen Ton des antiken Briefes.
- source_word: wearing bonds in Christ Jesus
  choice: in Fesseln, die ich um Jesu Christi willen trage
  rationale: Macht die konkrete Gefangenschaft und ihre Beziehung zu Christus in natürlichem Deutsch verständlich; die mögliche engere Nuance „in Christus Jesus“ wird in der Fußnote offengehalten.
- source_word: reach unto the end / attain unto the goal
  choice: bis ans Ende zu gelangen / das Ziel erreiche
  rationale: Erhält die aufeinander bezogenen Bilder von Vollendung und Ziel, ohne ihre mögliche Bedeutung als Martyrium ausdrücklich in den Haupttext einzutragen.
- source_word: receive mine inheritance
  choice: mein Erbe … empfange
  rationale: Gibt die biblisch-theologische Erbschaftssprache formal wieder und lässt den genauen Bezug offen.
- source_word: unless ye shall spare me
  choice: wenn ihr mich nicht verschont
  rationale: Bewahrt die zugespitzte Bitte, nicht rettend einzugreifen, ohne die im Abschnitt nur vorausgesetzte Situation auszuformulieren.
theological_decisions:
- issue: Bedeutung von „bis ans Ende gelangen“ und „zu Gott gelangen“
  choice: Die Ziel- und Gottesnähe-Sprache bleibt unaufgelöst stehen.
  alternative: Ausdrücklich mit dem Martyrium oder dem Tod gleichsetzen.
  rationale: Der Zusammenhang legt Ignatius’ erwartetes Martyrium nahe, doch die Formulierung verbindet dieses zugleich mit Vollendung und Gottesgemeinschaft. Eine explizite Gleichsetzung würde die theologische Spannung verengen.
- issue: Beziehung der Fesseln zu Christus
  choice: „um Jesu Christi willen“ im Haupttext, mit Hinweis auf die engere Formulierung in der Fußnote.
  alternative: „in Christus Jesus Fesseln tragend“ oder „mit Fesseln in Christus Jesus“.
  rationale: Die gewählte Fassung ist idiomatisch und macht den ursächlichen Bezug deutlich, während die Fußnote die mögliche partizipative Nuance schützt.
- issue: Die Liebe der römischen Gemeinde als mögliche Schädigung
  choice: Die paradoxe Aussage wird wörtlich-sachlich bewahrt.
  alternative: Im Haupttext erklären, dass ihre Liebe durch eine Befreiungsaktion sein Martyrium verhindern könnte.
  rationale: Der Text nennt die konkrete Handlung hier nicht ausdrücklich. Die offene Formulierung wahrt sowohl den historischen Sinn als auch die rhetorische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht brieflich-antiker Färbung. Archaismen wie „sofern es denn sei“ wurden vermieden; „Angesichter“, „Fesseln“ und „Erbe“ bewahren bewusst die bildhafte und biblisch geprägte Sprache. Da noch keine direkte Prüfung des griechischen Textes vorliegt, ist der Entwurf ausdrücklich vorläufig und folgt kritisch dem angegebenen öffentlichen englischen Zeugen.
