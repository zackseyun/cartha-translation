revisions:
- from: 'Meidet daher als Kinder [des Lichts] der Wahrheit Spaltungen und falsche Lehren. Wo der Hirte ist, da folgt ihm wie Schafe.


    Denn viele verführerische Wölfe nehmen mit verderblichen Vergnügungen die gefangen, die in Gottes Wettlauf laufen. Wo ihr aber eins seid, werden sie keinen Platz finden.'
  to: 'Meidet daher als Kinder [des Lichts] der Wahrheit die Spaltung und die falsche Lehre. Wo der Hirte ist, folgt ihm dort als Schafe.


    Denn viele glaubwürdig wirkende Wölfe nehmen die Läufer in Gottes Wettlauf durch verderbliche Vergnügungen gefangen. Wo ihr aber eins seid, werden sie keinen Platz finden.'
  rationale: Die Revision wahrt die sichtbare Klammerunsicherheit der Eingangsformel und bleibt eng beim englischen Zeugen sowie bei der überlieferten griechischen Aussage. Sie verbessert Singularbezug, die Bedeutung des nur scheinbar vertrauenswürdigen Auftretens der Wölfe und die deutsche Idiomatik, ohne eine kirchliche oder dogmatische Deutung hinzuzufügen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:52:27Z'
review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt Mahnung, Hirtenbild, Warnung vor den Wölfen und die Schutzfunktion der Einheit insgesamt zutreffend wieder. Eine Revision ist angezeigt, weil die griechisch bzw. im englischen Zeugen singularisch gefassten Begriffe für „Spaltung“ und „falsche Lehre“ im Entwurf pluralisiert werden. Bei den Wölfen trifft „glaubwürdig wirkend“ den Sinn von „specious“ bzw. des dahinterstehenden Ausdrucks für vertrauenswürdig/überzeugend auftretend genauer als „verführerisch“.
  naturalness: Der Entwurf ist überwiegend gut verständlich. „folgt ihm wie Schafe“ ist im Deutschen jedoch weniger idiomatisch und kann den Vergleich verschieben; „folgt ihm dort als Schafe“ bewahrt das Bild klarer. Die umgestellte Formulierung zum Gefangennehmen wird geglättet.
  terminology: „Hirte“, „Schafe“, „falsche Lehre“ und „eins sein“ sind angemessen und ohne konfessionelle Einengung wiedergegeben. Die eckigen Klammern um „des Lichts“ bleiben erhalten, damit die im Ausgangszeugen markierte textliche Unsicherheit nicht verdeckt wird.
  issues:
  - severity: medium
    issue: Pluralisierung von „Spaltung“ und „falscher Lehre“
    rationale: Der Ausgangszeuge hat „division“ und „wrong doctrines“; die zugrunde liegende griechische Formulierung ist hierbei singularisch. „die Spaltung und die falsche Lehre“ wahrt die knappe, begriffliche Mahnung besser als die nicht notwendige Pluralisierung.
  - severity: low
    issue: „verführerische Wölfe“ ist für „specious“ nicht ganz präzise
    rationale: Gemeint sind Wölfe, die überzeugend oder glaubwürdig erscheinen; „glaubwürdig wirkende Wölfe“ bringt diese täuschende Anscheinqualität genauer zum Ausdruck.
  - severity: low
    issue: Formulierung „folgt ihm wie Schafe“
    rationale: „als Schafe“ ist im modernen Deutschen die natürlichere Wiedergabe der Rollenmetapher und hält den Bezug zum Hirten klar.
