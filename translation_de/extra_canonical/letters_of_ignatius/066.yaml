base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: de
  text: 'Meidet daher als Kinder [des Lichts] der Wahrheit die Spaltung und die falsche Lehre. Wo der Hirte ist, folgt ihm dort als Schafe.


    Denn viele glaubwürdig wirkende Wölfe nehmen die Läufer in Gottes Wettlauf durch verderbliche Vergnügungen gefangen. Wo ihr aber eins seid, werden sie keinen Platz finden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: Kinder [des Lichts] der Wahrheit
  rationale: Bewahrt die ungewöhnliche, im überlieferten englischen Zeugen erkennbare Verbindung und kennzeichnet den unsicheren bzw. ergänzten Ausdruck »des Lichts« durch Klammern.
- source_word: shun division
  choice: Meidet … Spaltungen
  rationale: Gibt die Aufforderung klar und natürlich wieder; der Plural lässt einzelne trennende Bestrebungen mitklingen.
- source_word: wrong doctrines
  choice: falsche Lehren
  rationale: Eine verständliche und sachlich angemessene Wiedergabe ohne konfessionelle Zuspitzung.
- source_word: specious wolves
  choice: verführerische Wölfe
  rationale: Betont, dass diese Wölfe anziehend oder überzeugend auftreten, nicht lediglich äußerlich stattlich erscheinen.
- source_word: baneful delights
  choice: verderbliche Vergnügungen
  rationale: Erhält sowohl den lustvollen Reiz als auch seine schädliche Wirkung.
- source_word: the runners in God's race
  choice: die … in Gottes Wettlauf laufen
  rationale: Bewahrt das athletische Bild und seinen Bezug auf Gott, ohne das Gemeinte erklärend einzuengen.
- source_word: where ye are at one
  choice: Wo ihr aber eins seid
  rationale: Gibt die gemeinschaftliche Einigkeit knapp wieder und wahrt den Kontrast zur Spaltung.
theological_decisions:
- issue: Zuordnung von Wahrheit und Licht in der Eingangsformulierung
  choice: Kinder [des Lichts] der Wahrheit
  alternative: Kinder des Lichts und der Wahrheit
  rationale: Die sperrige Genitivfolge des bereitgestellten Zeugen wird nicht zu einer eindeutigen Zweierformel geglättet; die Klammern bleiben sichtbar.
- issue: Bild vom Hirten und den Schafen
  choice: Wo der Hirte ist, da folgt ihm wie Schafe
  alternative: Folgt als Schafe dorthin, wo der Hirte ist
  rationale: Bewahrt den Hirten als Bezugspunkt des Folgens, ohne seine Identität über den vorliegenden Text hinaus ausdrücklich festzulegen.
- issue: Einheit als Abwehr falscher Lehrer
  choice: Wo ihr aber eins seid, werden sie keinen Platz finden
  alternative: Wenn ihr euch versammelt, werden sie keinen Platz finden
  rationale: Der Zeuge spricht von Einigkeit; eine institutionelle oder liturgische Deutung wird nicht hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar frühchristlichem Mahnton. Wegen der noch ausstehenden direkten Prüfung des griechischen Textes ist die Fassung bewusst eng am angegebenen öffentlichen englischen Übersetzungszeugen orientiert. Die eckigen Klammern gehören zum Haupttext und markieren die bereits im Zeugen angezeigte Unsicherheit.
