base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: de
  text: 'Und betet auch unablässig für die übrigen Menschen – denn in ihnen ist Hoffnung auf Umkehr –, damit sie Gott finden. Lasst sie daher wenigstens aus euren Taten lernen.


    Begegnet ihren Wutausbrüchen mit Sanftmut, ihren hochmütigen Worten mit Demut, ihren Schmähungen, indem ihr eure Gebete entgegensetzt, ihren Irrtümern mit Standhaftigkeit im Glauben und ihrer Wildheit mit Milde. Und eifert nicht danach, sie durch Vergeltung nachzuahmen.


    Lasst uns durch unsere Langmut als ihre Brüder erwiesen werden. Doch lasst uns eifrig danach streben, Nachahmer des Herrn zu sein, und miteinander darin wetteifern, wer größeres Unrecht erleidet, wer übervorteilt wird und wer zurückgesetzt wird, damit sich unter euch kein Unkraut des Teufels findet. Bleibt vielmehr in aller Reinheit und Selbstbeherrschung in Christus Jesus, leiblich und geistlich.[a]'
  philosophy: optimal-equivalence
