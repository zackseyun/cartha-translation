  source_fidelity: 'Der Entwurf gibt Aufbau, paränetischen Ton und die meisten Kontraste des überlieferten griechischen Textes zuverlässig wieder. Eine sichere Korrektur ist jedoch bei ζιζάνιον nötig: Es bezeichnet nicht allgemein ein „Gewächs“, sondern ein schädliches Unkraut bzw. Taumellolch. Ferner ist ἀδελφοί hier mit „Brüder“ enger und textnäher als das interpretierend inklusive „Geschwister“ wiederzugeben. Die adverbiale Schlussformel σαρκικῶς καὶ πνευματικῶς wird treffender mit „leiblich und geistlich“ als mit „mit Leib und Geist“ abgebildet.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die antithetische Reihung wird mit einer geringfügig idiomatischeren, zugleich näheren Formulierung („setzt eure Gebete entgegen“) klarer. „Sich verachten lässt“ kann missverständlich aktiv wirken; „zurückgesetzt wird“ gibt die passive Bedeutung von ἀθετηθῆναι natürlich wieder.
  terminology: „Umkehr“, „Sanftmut“, „Langmut“, „Reinheit“ und „Selbstbeherrschung“ sind angemessen. „Unkraut des Teufels“ bewahrt das auffällige Bild und dessen schädliche Konnotation besser als „Gewächs des Teufels“. „Brüder“ folgt der markierten Bezeichnung des Textes, ohne daraus eine Aussage über die heutige geschlechtliche Zusammensetzung der Adressaten abzuleiten.
  issues:
  - severity: medium
    issue: „Gewächs des Teufels“ für ζιζάνιον
    rationale: ζιζάνιον bezeichnet spezifisch schädliches Unkraut/tares, nicht ein neutrales Gewächs. Die neutrale deutsche Formulierung schwächt das Bild ab.
  - severity: low
    issue: „Geschwister“ für „Brüder“
    rationale: Die inklusive Sammelbezeichnung ist modernes Deutsch, aber der griechische Text verwendet ἀδελφοί. „Brüder“ wahrt die konkrete Bildsprache und den Wortlaut enger.
  - severity: low
    issue: „mit Leib und Geist“ für σαρκικῶς καὶ πνευματικῶς
    rationale: Der Ausgangstext formuliert adverbial („leiblich und geistlich“). Diese Form erhält die syntaktische und semantische Offenheit besser.
