revisions:
- from: 'Und betet auch unablässig für die übrigen Menschen – denn für sie besteht Hoffnung auf Umkehr –, damit sie Gott finden. Lasst sie daher wenigstens von euren Taten lernen.


    Begegnet ihren Wutausbrüchen mit Sanftmut, ihren hochmütigen Worten mit Demut, ihren Schmähungen mit euren Gebeten, ihren Irrtümern mit Festigkeit im Glauben und ihrer Wildheit mit Milde. Und eifert nicht danach, es ihnen mit Gleichem zu vergelten.


    Erweisen wir uns durch unsere Langmut als ihre Geschwister. Doch lasst uns eifrig danach streben, den Herrn nachzuahmen, und miteinander darin wetteifern, wer größeres Unrecht erträgt, wer sich übervorteilen und wer sich verachten lässt, damit sich unter euch kein Gewächs des Teufels findet. Bleibt vielmehr in aller Reinheit und Selbstbeherrschung in Christus Jesus – mit Leib und Geist.[a]'
  to: 'Und betet auch unablässig für die übrigen Menschen – denn in ihnen ist Hoffnung auf Umkehr –, damit sie Gott finden. Lasst sie daher wenigstens aus euren Taten lernen.


    Begegnet ihren Wutausbrüchen mit Sanftmut, ihren hochmütigen Worten mit Demut, ihren Schmähungen, indem ihr eure Gebete entgegensetzt, ihren Irrtümern mit Standhaftigkeit im Glauben und ihrer Wildheit mit Milde. Und eifert nicht danach, sie durch Vergeltung nachzuahmen.


    Lasst uns durch unsere Langmut als ihre Brüder erwiesen werden. Doch lasst uns eifrig danach streben, Nachahmer des Herrn zu sein, und miteinander darin wetteifern, wer größeres Unrecht erleidet, wer übervorteilt wird und wer zurückgesetzt wird, damit sich unter euch kein Unkraut des Teufels findet. Bleibt vielmehr in aller Reinheit und Selbstbeherrschung in Christus Jesus, leiblich und geistlich.[a]'
  rationale: Die Revision korrigiert das Pflanzenbild zu „Unkraut“, folgt bei „Brüder“ der sprachlich markierten Vorlage und stellt die Schlusswendung adverbial dar. Zugleich werden die Gebete ausdrücklich als Gegenantwort auf Schmähungen und die Ablehnung/Zurücksetzung als passiv erlittenes Unrecht formuliert. Die Aussage über die Hoffnung auf Umkehr bleibt bewusst offen und nicht dogmatisch eingeengt.
