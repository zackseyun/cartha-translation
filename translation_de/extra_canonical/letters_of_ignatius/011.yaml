lexical_decisions:
- source_word: repentance (Greek source review pending)
  choice: Umkehr
  rationale: „Umkehr“ gibt den gemeinten Sinn natürlicher und umfassender wieder als das enger oder altertümlich wirkende „Buße“.
- source_word: works
  choice: Taten
  rationale: „Taten“ ist im modernen Deutsch idiomatischer als „Werke“ und bewahrt den Gegensatz zu bloßen Worten.
- source_word: meek / gentle
  choice: Sanftmut / Milde
  rationale: Die zwei parallelen Ausdrücke werden differenziert wiedergegeben, ohne ihren gemeinsamen Gedanken gewaltloser, beherrschter Haltung einzuebnen.
- source_word: forbearance
  choice: Langmut
  rationale: „Langmut“ bewahrt den ethischen und frühchristlichen Ton und bezeichnet geduldiges Ertragen von Kränkung.
- source_word: herb of the devil
  choice: Gewächs des Teufels
  rationale: Das auffällige Pflanzenbild wird beibehalten; „Gewächs“ klingt im Deutschen natürlicher als das wörtliche „Kraut“.
- source_word: temperance / self-control
  choice: Selbstbeherrschung
  rationale: Der Ausdruck bezeichnet kontrollierte, maßvolle Lebensführung; „Selbstbeherrschung“ ist gegenwärtig und verständlich.
- source_word: flesh
  choice: Leib
  rationale: Im abschließenden Paar bezeichnet der Ausdruck den leiblichen Menschen; „Leib“ ist hier würdevoller und weniger missverständlich als „Fleisch“.
theological_decisions:
- issue: Hoffnung auf Umkehr bei den übrigen Menschen
  choice: „für sie besteht Hoffnung auf Umkehr“
  alternative: „in ihnen ist Hoffnung auf Umkehr“
  rationale: Die gewählte Form bewahrt die Aussage, dass Umkehr noch möglich ist, ohne eine bereits in jedem Menschen innewohnende Heilsqualität festzuschreiben.
- issue: „Gott finden“
  choice: Die offene Formulierung bleibt unverändert.
  alternative: „zum Glauben an Gott kommen“
  rationale: Der Text sagt „Gott finden“; eine nähere dogmatische Bestimmung würde die Aussage unnötig verengen.
- issue: Nachahmung des Herrn durch das Ertragen von Unrecht
  choice: Der paradoxe Aufruf zum Wetteifern im Ertragen bleibt erhalten.
  alternative: Als bloße allgemeine Gewaltlosigkeit paraphrasieren
  rationale: Die zugespitzte asketisch-ethische Spannung des Textes soll nicht geglättet werden.
- issue: Leib und Geist
  choice: „mit Leib und Geist“
  alternative: „körperlich und geistlich“
  rationale: Das substantivische Paar bewahrt die anthropologische Offenheit des Zeugnisses, ohne ein ausgearbeitetes dualistisches Schema zu unterstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Rhythmik. Die parallelen Gegenüberstellungen des zweiten Absatzes und die auffälligen Bilder des Textes wurden bewahrt. Inklusives „Geschwister“ vermeidet eine unnötige geschlechtliche Verengung. Wegen der noch ausstehenden direkten griechischen Quellenprüfung bleibt der Entwurf ausdrücklich vorläufig.
