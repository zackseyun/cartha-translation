  to: 'Von nun an ist es angemessen, dass wir wach werden und besonnen sind, solange wir [noch] Zeit haben, umzukehren und uns Gott zuzuwenden. Es ist gut, Gott und den Bischof anzuerkennen. Wer den Bischof ehrt, wird von Gott geehrt; wer etwas ohne Wissen des Bischofs tut, dient dem Teufel.



