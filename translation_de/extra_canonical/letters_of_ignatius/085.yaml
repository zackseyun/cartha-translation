base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: de
  text: 'Von nun an ist es angemessen, dass wir wach werden und besonnen sind, solange wir [noch] Zeit haben, umzukehren und uns Gott zuzuwenden. Es ist gut, Gott und den Bischof anzuerkennen. Wer den Bischof ehrt, wird von Gott geehrt; wer etwas ohne Wissen des Bischofs tut, dient dem Teufel.



    Möge euch daher alles in Gnade reichlich zuteilwerden, denn ihr seid dessen würdig. Ihr habt mich in jeder Hinsicht erquickt, und Jesus Christus wird euch erquicken. Sowohl in meiner Abwesenheit als auch in meiner Gegenwart habt ihr mir eure Zuneigung erwiesen. Möge Gott es euch vergelten: Wenn ihr um seinetwillen alles ertragt, werdet ihr zu ihm gelangen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness
  choice: wach und besonnen werden
  rationale: Gibt sowohl das Bild des Erwachens als auch den Aufruf zu geistiger Nüchternheit in natürlichem modernem Deutsch wieder.
- source_word: repent and turn to God
  choice: umzukehren und uns Gott zuzuwenden
  rationale: Bewahrt die zwei eng verbundenen Bewegungen des Sinneswandels und der Hinwendung zu Gott.
- source_word: recognize
  choice: anzuerkennen
  rationale: Drückt nicht bloßes Erkennen, sondern gebührende Anerkennung aus, ohne den Gedanken weiter dogmatisch festzulegen.
- source_word: without the knowledge of the bishop
  choice: ohne Wissen des Bischofs
  rationale: Bewahrt die Aussage des überlieferten englischen Zeugen, ohne sie stärker als ausdrückliche Erlaubnis oder Zustimmung zu deuten.
- source_word: refreshed
  choice: erquickt
  rationale: Erhält das wiederholte Verb und seinen Sinn von Stärkung und Wohltat in einem würdigen, noch verständlichen Register.
- source_word: cherished
  choice: liebevoll umsorgt
  rationale: Natürliches heutiges Deutsch, das die persönliche Fürsorge des Ausdrucks wiedergibt.
- source_word: attain unto Him
  choice: zu ihm gelangen
  rationale: Bewahrt die zielgerichtete Bewegung auf Gott hin, ohne eine darüber hinausgehende soteriologische Präzisierung einzutragen.
theological_decisions:
- issue: Verhältnis der Anerkennung Gottes zur Anerkennung des Bischofs
  choice: „Gott und den Bischof anzuerkennen“
  alternative: „Gott und den Bischof zu kennen“
  rationale: Die koordinierte Formulierung bleibt erhalten; „anerkennen“ vermeidet, beide Gegenstände in exakt demselben Sinn des persönlichen Erkennens zu behandeln, und entspricht dem ethisch-kirchlichen Kontext.
- issue: Handeln ohne Wissen des Bischofs
  choice: „dient dem Teufel“
  alternative: „leistet dem Teufel einen Dienst“
  rationale: Die direkte und starke Aussage wird ohne konfessionelle Abschwächung oder Erweiterung bewahrt.
- issue: Bezug von „um seinetwillen“
  choice: Bezug auf Gott im unmittelbar vorausgehenden Satz
  alternative: Bezug auf Jesus Christus oder bewusst unbestimmter Bezug
  rationale: Der nächste grammatische Bezug im englischen Zeugen ist Gott; die Formulierung lässt zugleich die christologische Nähe des Abschnitts stehen, ohne eine neue Erklärung einzufügen.
- issue: Erlangen Gottes
  choice: „werdet ihr zu ihm gelangen“
  alternative: „werdet ihr ihn erlangen“
  rationale: „Zu ihm gelangen“ ist idiomatischer und vermeidet die Vorstellung, Gott werde wie ein Besitz erworben.
translation_notes:
  register: Modernes Standarddeutsch in würdigem frühchristlichem Briefstil. Die eckigen Klammern um „[noch]“ bewahren das Restaurationssignal des vorliegenden englischen Textzeugen. Da die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, wurden keine unbelegten griechischen Feinheiten ergänzt; echte Spannungen, besonders in der bischöflichen Mahnung, bleiben ungemildert erhalten.
