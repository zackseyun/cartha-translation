base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: de
  text: Ignatius, der auch Theophorus heißt, an die Gemeinde, die durch die Großzügigkeit des höchsten Vaters und Jesu Christi, seines einzigen Sohnes, Erbarmen gefunden hat; an die Gemeinde, die geliebt und erleuchtet ist durch den Willen dessen, der alles Seiende gewollt hat, aufgrund des Glaubens und der Liebe zu Jesus Christus, unserem Gott; ja, an die Gemeinde, die im Gebiet der Region der Römer den Vorsitz hat, die Gottes würdig, der Ehre würdig, des Glückwunsches würdig, des Lobes würdig, des Erfolges würdig und in Reinheit würdig ist, die den Vorsitz in der Liebe hat, nach dem Gesetz Christi lebt und den Namen des Vaters trägt. Diese Gemeinde grüße ich auch im Namen Jesu Christi, des Sohnes des Vaters. Denen, die in Fleisch und Geist mit jedem seiner Gebote vereint sind, die ohne Wanken mit Gottes Gnade erfüllt und von jedem fremden Makel klar herausgefiltert sind, gilt überreicher Gruß in Jesus Christus, unserem Gott, in Untadeligkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen englischen gemeinfreien Textzeugen; eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus. Besonders die Formulierungen über den „Vorsitz“ und das „Herausfiltern“ wurden deshalb bewusst eng und ohne weitergehende Deutung wiedergegeben.
    reason: Die Quelldaten kennzeichnen die direkte Prüfung der griechischen Überlieferung ausdrücklich als noch ausstehend; die Fußnote macht die textkritische und sprachliche Vorläufigkeit transparent.
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname transliteriert, statt seine mögliche Bedeutung („Gottesträger“ beziehungsweise „von Gott getragen“) im Haupttext festzulegen.
- source_word: prokathēmenē / presidency language (προκαθημένη)
  choice: den Vorsitz hat / den Vorsitz in der Liebe hat
  rationale: Die auffällige Wiederholung und die institutionell wie relational deutbare Ausdrucksweise bleiben erhalten, ohne Art oder Reichweite des Vorsitzes näher zu bestimmen.
- source_word: agapē (ἀγάπη)
  choice: Liebe
  rationale: Die gewöhnliche und theologisch offene Bedeutung wird bewahrt; eine mögliche konkrete Bedeutung wie „Liebesmahl“ wird nicht in den Text eingetragen.
- source_word: apodiēthēmenois (ἀποδιηθημένοις)
  choice: klar herausgefiltert
  rationale: Das ungewöhnliche Bild des Durchseihens beziehungsweise Herausfilterns wird sichtbar gehalten und nicht zur bloßen Aussage „frei von“ geglättet.
- source_word: amōmōs / blamelessness (ἀμώμως)
  choice: in Untadeligkeit
  rationale: Die substantivische beziehungsweise adverbiale Schlusswendung bleibt knapp und semantisch offen.
- source_word: kata sarka kai pneuma (κατὰ σάρκα καὶ πνεῦμα)
  choice: in Fleisch und Geist
  rationale: Die anthropologische Spannung der Paarformel wird nicht durch „ganz und gar“ paraphrasiert.
theological_decisions:
- issue: Bezeichnung Jesu Christi als Gott
  choice: „Jesus Christus, unserem Gott“ an beiden Stellen
  alternative: Abschwächung oder Umstellung, sodass „Gott“ nicht eindeutig auf Jesus Christus bezogen wäre
  rationale: Die überlieferte Formulierung des Zeugnisses setzt die Apposition ausdrücklich; diese hohe Christologie wird nicht abgeschwächt.
- issue: Vorsitz der römischen Gemeinde
  choice: „im Gebiet der Region der Römer den Vorsitz hat“ und „den Vorsitz in der Liebe hat“
  alternative: „die führende Gemeinde“ oder eine ausdrücklich universale kirchenrechtliche Vorrangstellung
  rationale: Die konkrete Metapher wird bewahrt, ihre ekklesiologische Tragweite aber weder minimiert noch konfessionell ausgelegt.
- issue: Bezug von „seiner Gebote“
  choice: Das Pronomen bleibt stehen
  alternative: Explizite Festlegung auf Gottes, Christi oder des Vaters Gebote
  rationale: Der vorausgehende komplexe Satz lässt den Bezug im konsultierten Zeugen nicht völlig spannungsfrei erkennen; die Übersetzung löst ihn nicht eigenmächtig auf.
- issue: „bearing the Father’s name“
  choice: „den Namen des Vaters trägt“
  alternative: Deutung als besondere Amts-, Bundes- oder Gotteskindschaftsaussage
  rationale: Das Bild wird wörtlich und ohne zusätzliche dogmatische Bestimmung wiedergegeben.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem langen, feierlichen Periodenbau des antiken Prologs. Wiederholungen wie „würdig“ und „den Vorsitz hat“ sind absichtlich erhalten. Ungewöhnliche Bildsprache wird nicht eingeebnet; zugleich werden veraltete Formen wie „allhier“, „Flecken“ oder „Glückseligkeit“ vermieden.
