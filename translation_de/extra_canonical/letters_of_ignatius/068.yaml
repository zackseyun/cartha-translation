base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: de
  text: Seid daher darauf bedacht, eine einzige Eucharistie zu feiern. Denn es gibt nur ein Fleisch unseres Herrn Jesus Christus und nur einen Kelch zur Vereinigung in seinem Blut; es gibt nur einen Altar, wie es auch nur einen Bischof gibt, zusammen mit dem Ältestenrat und den Diakonen, meinen Mitdienern. So sollt ihr alles, was ihr tut, in Übereinstimmung mit Gott tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach der angegebenen gemeinfreien englischen Textfassung; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus.
    reason: Die bereitgestellten Quelldaten kennzeichnen die direkte Prüfung der Ausgangssprache ausdrücklich als ausstehend; dies muss für die Publikation transparent bleiben.
lexical_decisions:
- source_word: one eucharist
  choice: eine einzige Eucharistie
  rationale: „Eucharistie“ bewahrt den frühchristlichen Fachbegriff; „eine einzige“ gibt den betonten Einheitsgedanken natürlich wieder.
- source_word: one flesh
  choice: nur ein Fleisch
  rationale: Die konkrete sakramentale Ausdrucksweise wird bewahrt und nicht deutend zu „Leib“ umformuliert.
- source_word: one cup unto union in His blood
  choice: nur einen Kelch zur Vereinigung in seinem Blut
  rationale: Die ungewöhnliche Verbindung von Kelch, Vereinigung und Blut bleibt bewusst erhalten, ohne die Art der Vereinigung näher festzulegen.
- source_word: presbytery
  choice: Ältestenrat
  rationale: Bezeichnet hier das Kollegium der Presbyter und ist für heutige Leser verständlicher als das potenziell missverständliche „Presbyterium“.
- source_word: after God
  choice: in Übereinstimmung mit Gott
  rationale: Gibt den Sinn von gottgemäßem Handeln idiomatisch wieder, ohne ihn auf Gottes Willen, Gebot oder Vorbild einzuengen.
theological_decisions:
- issue: Einheit von Eucharistie und kirchlichem Amt
  choice: Die parallele Einheitsstruktur von Eucharistie, Fleisch, Kelch, Altar und Bischof wird eng bewahrt.
  alternative: Die Aussage als allgemeine Mahnung zu kirchlicher Harmonie paraphrasieren.
  rationale: Der Text verknüpft sakramentale und amtliche Einheit ausdrücklich; eine Verallgemeinerung würde seine theologische Spannung abschwächen.
- issue: Bedeutung der Vereinigung im Blut
  choice: „zur Vereinigung in seinem Blut“
  alternative: „zur Gemeinschaft durch sein Blut“ oder „als Zeichen der Einheit in seinem Blut“
  rationale: Die Vorlage lässt Verhältnis und Art der Vereinigung offen. Weder instrumentale noch rein symbolische Deutung soll ergänzt werden.
- issue: Wiedergabe von „one altar“
  choice: „nur einen Altar“
  alternative: „nur eine Opferstätte“ oder eine metaphorische Umschreibung
  rationale: „Altar“ wahrt die kultische Sprache, ohne eine bestimmte spätere Eucharistielehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Satzführung. Die liturgischen und amtlichen Begriffe bleiben erkennbar frühchristlich. Wegen der noch ausstehenden griechischen Quellenprüfung sind textnahe Detailentscheidungen ausdrücklich vorläufig.
