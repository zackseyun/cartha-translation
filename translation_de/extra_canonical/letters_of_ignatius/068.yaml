review_pass:
  verdict: revise
  source_fidelity: Die Einheitsreihe wird im Entwurf grundsätzlich gut bewahrt. Für die griechische Formulierung ist jedoch „Einheit“ die nähere und im Deutschen idiomatischere Wiedergabe von ἕνωσις als „Vereinigung“. Außerdem bezeichnet πρεσβυτέριον den technischen frühkirchlichen Begriff „Presbyterium“; „Ältestenrat“ verschiebt ihn unnötig in ein modernes bzw. kommunal-administratives Register. Die Schlusswendung κατὰ θεόν ist mit „nach Gottes Maßgabe“ sinngemäß genau und wahrt die Offenheit gegenüber engeren Deutungen wie Gottes Wille oder Gebot.
  naturalness: Der Text ist insgesamt verständlich und würdevoll. Die überlange Aufteilung des ursprünglich eingeschobenen Begründungssatzes lässt sich im Deutschen klarer als Klammerstruktur führen. „eine einzige Eucharistie zu feiern“ ist verständlich; „eine Eucharistie zu feiern“ genügt, da die anschließende Reihe den Einheitsakzent ausdrücklich entfaltet.
  terminology: „Eucharistie“, „Fleisch“, „Kelch“, „Altar“, „Bischof“, „Presbyterium“ und „Diakone“ bewahren die kultische und kirchenamtliche Terminologie, ohne ihre theologische Tragweite auszudeuten. „Mitdiener“ bleibt auf die Diakone bezogen, wie es die griechische Apposition nahelegt.
  issues:
  - severity: medium
    issue: „zur Vereinigung in seinem Blut“ für εἰς ἕνωσιν τοῦ αἵματος αὐτοῦ
    rationale: „Vereinigung“ ist möglich, klingt aber prozesshaft und weniger idiomatisch. „zur Einheit in seinem Blut“ gibt ἕνωσις als Ergebnis bzw. Zustand enger wieder und fügt keine konfessionelle Deutung hinzu.
  - severity: medium
    issue: „Ältestenrat“ für πρεσβυτέριον
    rationale: Die Formulierung ist zwar verständlich, aber kein präziser Äquivalent des frühkirchlichen Amtsbegriffs und erzeugt einen modernen Verwaltungsbeiklang. „Presbyterium“ ist hier der etablierte, quellennahe Fachbegriff.
  - severity: low
    issue: Schlussformulierung „in Übereinstimmung mit Gott“
    rationale: Sie ist vertretbar, kann aber abstrakt wirken. „nach Gottes Maßgabe“ ist im Deutschen flüssiger und hält die griechische Wendung κατὰ θεόν offen.
  revised_text: Bemüht euch daher, eine Eucharistie zu feiern. Denn es gibt ein Fleisch unseres Herrn Jesus Christus und einen Kelch zur Einheit in seinem Blut; es gibt einen Altar, wie es auch einen Bischof gibt, zusammen mit dem Presbyterium und den Diakonen, meinen Mitdienern. Damit ihr alles, was ihr tut, nach Gottes Maßgabe tut.[a]
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach der angegebenen gemeinfreien englischen Textfassung; eine unmittelbare Prüfung des griechischen Textes der mittleren Rezension steht noch aus.
    reason: Die bereitgestellten Quelldaten kennzeichnen die direkte Prüfung der Ausgangssprache ausdrücklich als ausstehend; dies muss für die Publikation transparent bleiben.
  revision_rationale: Die Revision präzisiert zwei zentrale frühchristliche Fachbegriffe und glättet die deutsche Syntax, ohne die Verbindung von eucharistischer, kultischer und amtlicher Einheit abzuschwächen. Die wiederholte Einheitsstruktur bleibt erhalten, während keine bestimmte Sakraments- oder Amtslehre ergänzt wird. Der Transparenzhinweis zur noch ausstehenden unmittelbaren griechischen Prüfung bleibt als Anmerkung verankert.
