  witness_license: Public domain witness
  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: de
  text: 'Ich verherrliche Jesus Christus, den Gott, der euch solche Weisheit geschenkt hat. Denn ich habe erkannt, dass ihr unerschütterlich im Glauben gegründet seid, gleichsam an das Kreuz des Herrn Jesus Christus genagelt an Fleisch und Geist und fest verwurzelt in der Liebe durch das Blut Christi. Ihr seid völlig überzeugt, was unseren Herrn betrifft: Er stammt dem Fleisch nach wahrhaftig aus dem Geschlecht Davids, ist aber durch göttlichen Willen und göttliche Macht Gottes Sohn; er wurde wahrhaftig von einer Jungfrau geboren und von Johannes getauft, damit durch ihn alle Gerechtigkeit erfüllt würde.


    Er wurde unseretwegen unter Pontius Pilatus und dem Tetrarchen Herodes wahrhaftig im Fleisch ans Kreuz genagelt. Die Frucht davon sind wir – nämlich die Frucht seines überaus gesegneten Leidens. Durch seine Auferstehung sollte er für alle Zeitalter ein Feldzeichen aufrichten für seine Heiligen und Gläubigen, seien sie unter den Juden oder unter den Völkern, vereint in dem einen Leib seiner Kirche.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen der mittleren Rezension. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus; insbesondere die Präposition in „Liebe durch das Blut Christi“ und einzelne syntaktische Bezüge können sich dadurch noch ändern.
    reason: Die bereitgestellten Metadaten kennzeichnen die direkte Prüfung der griechischen Quelle ausdrücklich als ausstehend; die Editionslage soll transparent bleiben.
lexical_decisions:
- source_word: the God
  choice: den Gott
  rationale: Bewahrt die ausdrücklich hohe christologische Aussage des überlieferten Zeugen, statt sie abzuschwächen oder syntaktisch umzudeuten.
- source_word: according to the flesh
  choice: dem Fleisch nach
  rationale: Gibt die frühchristliche, paulinisch geprägte Unterscheidungsformel knapp und formal nah wieder.
- source_word: race of David
  choice: aus dem Geschlecht Davids
  rationale: „Geschlecht“ bezeichnet hier natürliche Abstammung und klingt im Deutschen würdig und verständlich.
- source_word: in the blood of Christ
  choice: durch das Blut Christi
  rationale: Der englische Zeuge bietet formal „in“; im Deutschen macht „durch“ den instrumentalen beziehungsweise begründenden Zusammenhang verständlich. Wegen ausstehender griechischer Prüfung bleibt dies vorläufig.
- source_word: ensign
  choice: Feldzeichen
  rationale: Bewahrt das Bild eines weithin sichtbaren Sammel- und Siegeszeichens besser als das allgemeinere „Zeichen“.
- source_word: Gentiles
  choice: Völkern
  rationale: Gibt den jüdisch-frühchristlichen Gegensatz zu „Juden“ idiomatisch wieder, ohne die heute oft abwertend klingende Bezeichnung „Heiden“.
- source_word: Church
  choice: Kirche
  rationale: Entspricht dem frühchristlichen Gesamtleib der Glaubenden; die Großschreibung des englischen Zeugen muss im Deutschen nicht eigens markiert werden.
theological_decisions:
- issue: Bezeichnung Jesu als Gott
  choice: „Jesus Christus, den Gott“
  alternative: „Jesus Christus, Gott“ oder eine abschwächende Lesart
  rationale: Der vorgelegte Textzeuge bezeichnet Jesus grammatisch ausdrücklich als Gott; diese christologische Spannung wird nicht geglättet.
- issue: Davidsabstammung und Gottessohnschaft
  choice: Beide Aussagen mit „aber“ nebeneinandergestellt
  alternative: Die Gottessohnschaft kausal oder zeitlich als erst durch göttlichen Willen entstanden zu deuten
  rationale: Der Wortlaut verbindet wahre menschliche Abstammung und Gottessohnschaft, legt aber keine ausgearbeitete ontologische Erklärung vor.
- issue: „durch göttlichen Willen und göttliche Macht“
  choice: unmittelbar auf „Gottes Sohn“ bezogen
  alternative: Auf Geburt oder Offenbarung der Sohnschaft bezogen
  rationale: Folgt der Syntax des überlieferten englischen Zeugen, ohne die genaue dogmatische Beziehung weiter festzulegen.
- issue: Erfüllung aller Gerechtigkeit
  choice: „damit durch ihn alle Gerechtigkeit erfüllt würde“
  alternative: „damit er alle Gerechtigkeit erfüllte“
  rationale: Bewahrt die im Zeugen vorhandene passive Form und damit die mögliche Mehrdeutigkeit der handelnden Instanz.
- issue: Ein Leib der Kirche
  choice: „vereint in dem einen Leib seiner Kirche“
  alternative: „im einen Leib seiner Kirche“ ohne ergänzendes Partizip
  rationale: „Vereint“ macht die Zugehörigkeit von Juden und Völkern im Deutschen syntaktisch klar, ohne eine konfessionelle Ekklesiologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlicher Bildsprache. Lange Satzgefüge wurden maßvoll gegliedert, ohne die Bekenntnisstruktur und ihre wiederholte Betonung von „wahrhaftig“ aufzulösen. Archaismen wurden vermieden; „Tetrarch“ und „Feldzeichen“ bleiben als sachlich präzise historische beziehungsweise bildhafte Begriffe erhalten.
