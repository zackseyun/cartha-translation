review_pass:
  verdict: revise
  source_fidelity: 'Eine Revision ist erforderlich. Der Entwurf verschiebt an zwei Stellen den überlieferten Sinn bzw. die Syntax: „durch das Blut Christi“ ersetzt die zweimalige lokative Einbindung („in Liebe, im Blut Christi“) durch ein instrumentales Verhältnis, und die deutsche Wiedergabe der Erfüllung aller Gerechtigkeit sollte die ausdrückliche Urheberschaft Jesu klar wiedergeben. Auch die parenthetische Verbindung von Kreuzigung, Leiden und deren „Frucht“ sowie der Zweck des Aufrichtens eines Feldzeichens sollten enger am Satzgefüge bleiben.'
  naturalness: Der Text ist überwiegend würdig und verständlich. „Jesus Christus, den Gott“ wirkt im modernen Deutschen jedoch als Apposition schwerfällig; „Jesus Christus, Gott, der …“ ist idiomatischer und behält die Prädikation bei. „an Fleisch und Geist genagelt“ ist nicht idiomatisch; „im Fleisch und im Geist“ erhält die bildhafte und syntaktisch offene Formulierung. „unter Pontius Pilatus und dem Tetrarchen Herodes“ wird natürlich als Zeitangabe mit Apposition formuliert.
  terminology: „Geschlecht Davids“, „dem Fleisch nach“, „Gottes Sohn“, „Tetrarch“, „Feldzeichen“, „Juden“ und „Völker“ sind tragfähige Entscheidungen. „Feldzeichen“ bewahrt das Bild des Sammelzeichens; „Völker“ vermeidet für ein modernes deutsches Publikum die unnötig belastete Bezeichnung „Heiden“, ohne den Juden–Völker-Gegensatz aufzugeben. Die Wiederholung von „wahrhaftig“ ist beizubehalten.
  issues:
  - severity: medium
    issue: „durch das Blut Christi“ statt „im Blut Christi“
    rationale: Der Zeuge hat „firmly grounded in love in the blood of Christ“; die griechische Formulierung ist ebenfalls durch aufeinanderfolgende Präpositionalgruppen geprägt. „Durch“ macht daraus eine instrumentale oder kausale Aussage und engt den Bezug unnötig ein.
  - severity: medium
    issue: „damit durch ihn alle Gerechtigkeit erfüllt würde“ bleibt im Deutschen unnötig unklar
    rationale: Das zugrunde liegende passive Ziel der Erfüllung und Jesus als Handelnder sind beide wiederzugeben. „damit er alle Gerechtigkeit erfüllte“ ist klar, ohne eine zusätzliche theologische Erklärung einzutragen.
  - severity: low
    issue: Satzbau bei Kreuzigung, deren Frucht und Auferstehung
    rationale: Die Abtrennung der Klammerbemerkung in zwei Hauptsätze schwächt den Bezug von „dessen Frucht wir sind“ auf das selige Leiden. Außerdem gibt „sollte er“ den finalen Sinn weniger unmittelbar wieder als „damit er … aufrichte“.
  - severity: low
    issue: Unnatürliche Apposition und Kasusführung
    rationale: „Jesus Christus, den Gott“ und „unter Pontius Pilatus und dem Tetrarchen Herodes“ sind zwar verständlich, aber stilistisch bzw. syntaktisch weniger glatt als eine deutsche Apposition mit „Gott, der“ beziehungsweise „Herodes, dem Tetrarchen“.
  revised_text: 'Ich verherrliche Jesus Christus, Gott, der euch solche Weisheit geschenkt hat. Denn ich habe erkannt, dass ihr im unerschütterlichen Glauben gegründet seid, gleichsam im Fleisch und im Geist an das Kreuz des Herrn Jesus Christus genagelt, und fest gegründet in Liebe, im Blut Christi. Ihr seid hinsichtlich unseres Herrn völlig überzeugt: Er stammt dem Fleisch nach wahrhaftig aus dem Geschlecht Davids, ist aber durch göttlichen Willen und göttliche Macht Gottes Sohn; er wurde wahrhaftig von einer Jungfrau geboren und von Johannes getauft, damit er alle Gerechtigkeit erfüllte.


    Er wurde wahrhaftig unseretwegen im Fleisch unter Pontius Pilatus und Herodes, dem Tetrarchen, ans Kreuz genagelt – dessen Frucht wir sind, nämlich die Frucht seines überaus gesegneten Leidens –, damit er durch seine Auferstehung für alle Zeiten ein Feldzeichen aufrichte für seine Heiligen und Gläubigen, seien sie unter den Juden oder unter den Völkern, in dem einen Leib seiner Kirche.[a]'
  revised_footnotes:
  - marker: a
    text: Diese Übersetzung bleibt vorläufig, da die bereitgestellten Editionsdaten die unmittelbare Prüfung des griechischen Wortlauts als noch ausstehend kennzeichnen. Sie folgt dem angegebenen gemeinfreien englischen Textzeugen der mittleren Rezension; einzelne syntaktische Bezüge und textkritische Fragen können bei einer direkten Prüfung der griechischen Überlieferung erneut zu bewerten sein.
    reason: Die Editions- und Quellenlage soll transparent bleiben. Die Fußnote behauptet nicht mehr, die Wendung „im Blut Christi“ sei als instrumentales „durch das Blut Christi“ zu verstehen.
  revision_rationale: Die Revision bewahrt die hohe christologische Prädikation „Gott“, die Gegenüberstellung von Davidsabstammung und Gottessohnschaft sowie die wiederholte Betonung der wirklichen Menschwerdung, Taufe und Kreuzigung. Sie korrigiert zugleich vermeidbare semantische Einengungen, glättet das moderne Standarddeutsch und erhält die überlieferte bildhafte und syntaktische Dichte, ohne konfessionelle Folgerungen einzutragen.
