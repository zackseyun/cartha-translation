base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a servant even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: de
  text: 'Ich schreibe an alle Gemeinden und lasse alle wissen: Aus freiem Willen sterbe ich für Gott – wenn ihr es mir nicht missgönnt. Ich ermahne euch: Erweist mir nicht zur Unzeit einen Gefallen. Lasst mich den wilden Tieren vorgeworfen werden; denn durch sie kann ich zu Gott gelangen. Ich bin Gottes Weizen und werde von den Zähnen wilder Tiere zermahlen, damit ich als reines Brot [Christi][a] befunden werde.


    Lockt die wilden Tiere vielmehr an, damit sie zu meinem Grab werden und nichts von meinem Körper übrig lassen. So werde ich, wenn ich entschlafen bin, niemandem zur Last fallen. Dann werde ich wahrhaft ein Jünger Jesu Christi sein, wenn die Welt nicht einmal mehr meinen Körper sieht. Fleht den Herrn für mich an, damit ich durch diese Werkzeuge als ein Opfer für Gott befunden werde.


    Ich gebiete euch nicht wie Petrus und Paulus. Sie waren Apostel, ich bin ein Verurteilter; sie waren frei, ich aber bin bis zu dieser Stunde ein Sklave. Doch wenn ich leide, werde ich ein Freigelassener Jesu Christi sein und in ihm als Freier auferstehen. Jetzt lerne ich in meinen Fesseln, jedes Verlangen abzulegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Christi“ steht in der zugrunde liegenden englischen Textzeugin in eckigen Klammern und ist damit als textkritisch ergänzte beziehungsweise unsichere Lesart gekennzeichnet.
    reason: Bewahrt das im Ausgangsmaterial sichtbare textkritische Signal.
lexical_decisions:
- source_word: ἀποθανεῖν / die (as reflected in the witness)
  choice: sterbe
  rationale: Bewahrt die direkte, ungeschönte Aussage über den freiwillig angenommenen Tod.
- source_word: ἐπιτυχεῖν θεοῦ / attain unto God
  choice: zu Gott gelangen
  rationale: Gibt die Zielbewegung wieder, ohne die genaue Art dieses Gelangens dogmatisch festzulegen.
- source_word: σῖτος θεοῦ / God's wheat
  choice: Gottes Weizen
  rationale: Erhält das prägnante Bild und seine Verbindung mit dem anschließenden Zermahlen und Brotwerden.
- source_word: καθαρός / pure
  choice: rein
  rationale: Bewahrt die mögliche kultische und moralische Resonanz, ohne sie näher zu bestimmen.
- source_word: μαθητής / disciple
  choice: Jünger
  rationale: Entspricht dem frühchristlichen Sprachgebrauch und klingt im Deutschen natürlich und würdig.
- source_word: κατάκριτος / convict
  choice: Verurteilter
  rationale: Bezeichnet klar den rechtlichen Status; „Sträfling“ wäre stärker institutionell-modern gefärbt.
- source_word: δοῦλος / slave
  choice: Sklave
  rationale: Bewahrt den scharfen Gegensatz zu „frei“ und „Freigelassener“; „Diener“ würde ihn abschwächen.
- source_word: ἀπελεύθερος / freedman
  choice: Freigelassener
  rationale: Erhält die soziale und rechtliche Metapher der Freilassung im Gegensatz zur Sklaverei.
- source_word: ἐπιθυμία / desire
  choice: Verlangen
  rationale: Lässt offen, ob allgemein menschliches Begehren oder eine konkretere Begierde gemeint ist.
theological_decisions:
- issue: Ziel des Martyriums in der Wendung „zu Gott gelangen“
  choice: Die teleologische Aussage bleibt unmittelbar stehen.
  alternative: Als bloße Hoffnung oder als Aussage über das Erlangen des Heils umformulieren.
  rationale: Der Text verbindet das Leiden ausdrücklich mit dem Gelangen zu Gott; eine systematische Präzisierung würde die Spannung des Zeugnisses auflösen.
- issue: „reines Brot [Christi]“
  choice: Die eckigen Klammern um „Christi“ werden bewahrt und mit einer Fußnote erklärt.
  alternative: „Christi“ ohne Kennzeichnung in den Haupttext aufnehmen oder ganz weglassen.
  rationale: Die gelieferte Textgrundlage signalisiert hier eine textkritische Ergänzung; diese Unsicherheit darf nicht verschwiegen werden.
- issue: „wahrhaft ein Jünger“ erst nach dem Tod
  choice: Die zugespitzte Aussage wird ohne Abschwächung wiedergegeben.
  alternative: „mich als wahrer Jünger erweisen“ oder „meine Jüngerschaft vollenden“.
  rationale: Die paradoxe und theologisch spannungsreiche Formulierung soll nicht harmonisiert werden.
- issue: Opfersprache
  choice: „als ein Opfer für Gott erfunden werde“
  alternative: „Gott als Opfer dargebracht werde“.
  rationale: „Erfunden werden“ bewahrt die wiederkehrende Feststellungs- bzw. Bewährungssprache und vermeidet eine zusätzliche Aussage über den Handelnden.
- issue: Auferstehung „in ihm“
  choice: „in ihm als Freier auferstehen“
  alternative: „durch ihn frei auferstehen“.
  rationale: Die personale Christusverbindung bleibt erhalten, ohne das Verhältnis kausal umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Bildsprache, juristische Gegensätze und die scharfe Martyriumsrhetorik wurden bewusst beibehalten. Da eine direkte Prüfung des griechischen Textes noch aussteht, ist der Entwurf ausdrücklich an die bereitgestellte gemeinfreie englische Textzeugin und deren Hinweise gebunden.
