- from: Ignatius, der auch Theophorus genannt wird, grüßt Polykarp, den Bischof der Gemeinde von Smyrna – oder vielmehr einen, der Gott, den Vater, und Jesus Christus zum Bischof hat – in reicher Fülle.
  to: Ignatius, der auch Theophorus genannt wird, an Polykarp, den Bischof der Gemeinde der Smyrnäer – oder vielmehr an einen, der Gott, den Vater, und den Herrn Jesus Christus zum Bischof hat –, vielfachen Gruß.
  rationale: Die Fassung ergänzt den im griechischen Prolog vorhandenen Titel „Herr“ und gestaltet die Anrede als natürliche deutsche Briefüberschrift. Die Selbstkorrektur („oder vielmehr“), die Wiederholung von „Bischof“ sowie die grammatisch absichtliche Einzahl bleiben unverändert in ihrer Aussage erhalten.
