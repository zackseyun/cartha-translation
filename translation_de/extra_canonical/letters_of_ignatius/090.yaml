    rationale: Der griechische Text bezeugt κύριον Ἰησοῦν Χριστόν. Der englische Brückentext lässt diesen Bestandteil aus, doch der Abgleich mit der Originalsprache hat Vorrang.
  - severity: low
    issue: „grüßt … in reicher Fülle“ ist für die Grußformel stilistisch unnatürlich.
    rationale: πλεῖστα χαίρειν ist eine knappe briefliche Grußformel; „vielfachen Gruß“ bewahrt ihre Verstärkung in idiomatischem Deutsch.
