base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: de
  text: Ignatius, der auch Theophorus genannt wird, an Polykarp, den Bischof der Gemeinde der Smyrnäer – oder vielmehr an einen, der Gott, den Vater, und den Herrn Jesus Christus zum Bischof hat –, vielfachen Gruß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname transliteriert; seine mögliche Bedeutung („Gottesträger“ bzw. „von Gott getragen“) wird wegen der noch ausstehenden Prüfung des griechischen Wortlauts nicht im Haupttext festgelegt.
- source_word: church of the Smyrnaens
  choice: Gemeinde von Smyrna
  rationale: „Gemeinde“ bezeichnet hier natürlich und verständlich die örtliche christliche Gemeinschaft, ohne unnötig an ein Gebäude denken zu lassen.
- source_word: bishop
  choice: Bischof
  rationale: Der frühchristliche Amtstitel wird mit dem etablierten deutschen Ausdruck wiedergegeben und in der pointierten Wiederholung beibehalten.
- source_word: abundant greeting
  choice: grüßt … in reicher Fülle
  rationale: Bewahrt die ungewöhnliche Steigerung des Grußes in würdiger, verständlicher deutscher Form.
theological_decisions:
- issue: Gott der Vater und Jesus Christus als Bischof Polykarps
  choice: „der Gott, den Vater, und Jesus Christus zum Bischof hat“
  alternative: „dessen Bischof Gott, der Vater, und Jesus Christus ist“
  rationale: Die zugespitzte Aussage und die Spannung zwischen Polykarps kirchlichem Amt und seiner Unterordnung unter Gott und Christus bleiben erhalten. Der Singular „zum Bischof“ folgt dem bezeugten Wortspiel, ohne das Verhältnis von Vater und Sohn näher zu systematisieren.
- issue: Korrekturformel „or rather“
  choice: „oder vielmehr“
  alternative: „genauer gesagt“
  rationale: Die rhetorische Selbstkorrektur des Zeugen wird sichtbar bewahrt, statt beide Aussagen glatt miteinander zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Da ein direkter Abgleich mit dem griechischen Text noch aussteht und nur ein gemeinfreier englischer Zeuge vorliegt, ist die Fassung bewusst zurückhaltend; insbesondere wird die Etymologie von „Theophorus“ nicht ausgedeutet.
