base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: de
  text: 'Denn all dies erlitt er um unseretwillen, [damit wir gerettet würden][a]. Und er litt wirklich, ebenso wie er sich wirklich selbst auferweckte.[b] Es war nicht so, wie gewisse Ungläubige sagen: Er habe nur zum Schein gelitten — dabei sind sie selbst bloßer Schein. Entsprechend ihren Auffassungen wird es ihnen auch ergehen; denn sie sind körperlos und dämonengleich.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen eine im zugrunde liegenden englischen Textzeugen als Ergänzung beziehungsweise textlich unsichere Wendung markierte Passage.
    reason: Das Wiederherstellungssignal des bereitgestellten Zeugnisses soll sichtbar bleiben.
  - marker: b
    text: 'Wörtlich nach dem vorliegenden englischen Zeugnis: »ebenso wie er sich wirklich selbst auferweckte«. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Die ungewöhnliche reflexive Aussage wird transparent bewahrt, ohne sie vorschnell umzudeuten.
  - marker: c
    text: Die Ausdrücke »körperlos« und »dämonengleich« gehören zur scharfen Polemik des antiken Textes gegen die Leugnung des wirklichen Leidens Jesu.
    reason: Hilft heutigen Lesenden, den historischen und rhetorischen Charakter der Aussage einzuordnen, ohne ihren Wortlaut abzuschwächen.
lexical_decisions:
- source_word: suffered truly
  choice: litt wirklich
  rationale: Gibt die nachdrückliche Behauptung eines realen Leidens in natürlichem, würdigem Deutsch wieder und bewahrt den Gegensatz zu »nur zum Schein«.
- source_word: raised Himself truly
  choice: sich auch wirklich selbst auferweckte
  rationale: Bewahrt die reflexive Form des vorliegenden Zeugnisses und löst die mögliche theologische Spannung nicht durch eine passive Formulierung auf.
- source_word: in semblance
  choice: nur zum Schein
  rationale: Drückt die behauptete bloße Erscheinung idiomatisch aus und erhält die ant-doketische Pointe.
- source_word: mere semblance
  choice: bloßer Schein
  rationale: Bewahrt das Wortspiel zwischen dem scheinbaren Leiden und der polemischen Charakterisierung seiner Leugner.
- source_word: without body
  choice: körperlos
  rationale: Entspricht knapp und direkt der Aussage des englischen Zeugnisses.
- source_word: demon-like
  choice: dämonengleich
  rationale: Bewahrt den scharfen polemischen Vergleich, ohne ihn zu verstärken oder abzuschwächen.
theological_decisions:
- issue: Subjekt der Auferweckung
  choice: »er sich ... selbst auferweckte«
  alternative: »er ... auferweckt wurde« beziehungsweise »auferstand«
  rationale: Das bereitgestellte Zeugnis verwendet ausdrücklich eine reflexive aktive Form. Diese wird trotz ausstehender griechischer Prüfung beibehalten, statt sie stillschweigend an geläufigere neutestamentliche Formulierungen anzugleichen.
- issue: Realität des Leidens
  choice: »er litt wirklich«
  alternative: »er litt wahrhaftig«
  rationale: »Wirklich« stellt in modernem Deutsch den sachlichen Gegensatz zum bloßen Schein klar heraus.
- issue: Folge ihrer Auffassung
  choice: »Wie sie denken, so wird es ihnen auch ergehen«
  alternative: »Entsprechend ihren Ansichten wird es ihnen widerfahren«
  rationale: Die natürliche Formulierung erhält die absichtlich zugespitzte Vergeltungslogik, ohne deren genaue metaphysische Bedeutung weiter festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Parallelismus »wirklich ... wirklich« und das Wortspiel mit »Schein« bleiben erhalten. Da eine direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, folgt der Entwurf vorsichtig dem angegebenen gemeinfreien englischen Zeugnis und kennzeichnet dessen Ergänzungssignal.
