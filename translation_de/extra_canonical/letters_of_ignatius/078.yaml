  to: 'Denn all dies erlitt er um unseretwillen, [damit wir gerettet würden][a]. Und er litt wirklich, ebenso wie er sich wirklich selbst auferweckte.[b] Es war nicht so, wie gewisse Ungläubige sagen: Er habe nur zum Schein gelitten — dabei sind sie selbst bloßer Schein. Entsprechend ihren Auffassungen wird es ihnen auch ergehen; denn sie sind körperlos und dämonengleich.[c]'
  rationale: 'Zwei geringfügige, sichere Anpassungen verbessern Präzision und Gestaltung: »Entsprechend ihren Auffassungen« entspricht dem Bezug auf ihre Ansichten genauer, und der Anker [a] wird direkt an die markierte Ergänzung gesetzt. Die Aussage, dass Christus sich selbst auferweckte, bleibt ausdrücklich erhalten; wegen der ausstehenden unmittelbaren griechischen Prüfung wird sie weiterhin erläutert statt harmonisiert.'
