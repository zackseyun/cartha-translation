  to: 'Dies schreibe ich euch aus Smyrna durch die Epheser, die aller Glückseligpreisung würdig sind. Auch Krokus – ein mir sehr lieber Name – ist bei mir, zusammen mit vielen anderen.


    Was diejenigen betrifft, die mir von Syrien nach Rom zur Herrlichkeit Gottes vorausgegangen sind: Ich vertraue darauf, dass ihr Anweisungen erhalten habt. Benachrichtigt auch sie, dass ich nahe bin; denn sie alle sind Gottes und eurer würdig, und es geziemt euch, sie in jeder Hinsicht zu erquicken.


    Dies schreibe ich euch am neunten Tag vor den Kalenden des September.[a] Lebt wohl bis ans Ende in der Geduld Jesu Christi.'
  rationale: Die Revision folgt vorrangig dem griechischen Wortlaut, soweit er für die kritischen Wendungen sicher feststellbar ist, und kontrolliert anschließend die englische Überlieferungsfassung. Sie korrigiert insbesondere die interpretierende Schlusswendung, wahrt die Mehrdeutigkeit des Genitivs bei „Jesus Christus“ und verbessert einzelne lexikalische sowie stilistische Entsprechungen. Die Datierung und ihre korrekt verankerte Erläuterung bleiben unverändert.
  reviewer_model: gpt-5.6-terra
