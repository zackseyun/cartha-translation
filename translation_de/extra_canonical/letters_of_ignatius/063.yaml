base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: de
  text: 'Dies schreibe ich euch aus Smyrna durch die Epheser, die aller Glückseligpreisung würdig sind. Auch Krokus – ein mir sehr lieber Name – ist bei mir, zusammen mit vielen anderen.


    Was diejenigen betrifft, die mir von Syrien nach Rom zur Herrlichkeit Gottes vorausgegangen sind: Ich vertraue darauf, dass ihr Anweisungen erhalten habt. Benachrichtigt auch sie, dass ich nahe bin; denn sie alle sind Gottes und eurer würdig, und es geziemt euch, sie in jeder Hinsicht zu erquicken.


    Dies schreibe ich euch am neunten Tag vor den Kalenden des September.[a] Lebt wohl bis ans Ende in der Geduld Jesu Christi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach römischer inklusiver Zählung entspricht der neunte Tag vor den Kalenden des September dem 24. August.
    reason: Die historische Datierungsform bleibt im Text erhalten; die Fußnote erschließt sie modernen Lesern.
lexical_decisions:
- source_word: by the hand of
  choice: durch die Hand
  rationale: Bewahrt die mögliche Bedeutung einer persönlichen Überbringung oder schriftlichen Mitwirkung, ohne sie näher festzulegen.
- source_word: worthy of all felicitation
  choice: jedes Glückwunsches würdig
  rationale: Gibt die ungewöhnliche, ehrende Wendung des Zeugnisses möglichst eng wieder.
- source_word: refresh them
  choice: sie … zu erquicken
  rationale: Bewahrt den weiten Sinn fürsorglicher Stärkung und Unterstützung; eine engere Festlegung auf Beherbergung wäre nicht ausreichend gesichert.
- source_word: patient waiting
  choice: geduldigen Warten
  rationale: Drückt sowohl Ausdauer als auch erwartungsvolle Ausrichtung aus.
- source_word: Calends of September
  choice: Kalenden des September
  rationale: Die römische Datierungsweise wird entsprechend dem Zeugnis beibehalten und in einer Fußnote erläutert.
theological_decisions:
- issue: Wendung „zur Ehre Gottes“
  choice: zur Ehre Gottes
  alternative: zur Herrlichkeit Gottes
  rationale: „Ehre“ ist im Deutschen hier natürlich und lässt offen, ob Anerkennung Gottes oder Anteil an seiner Herrlichkeit gemeint ist.
- issue: „Gottes würdig“
  choice: Gottes … würdig
  alternative: Gott würdig
  rationale: Die genitivische Form bewahrt die auffällige Parallelität „Gottes und eurer würdig“, ohne sie theologisch zu glätten.
- issue: Schlussformel und Christushoffnung
  choice: im geduldigen Warten auf Jesus Christus
  alternative: in der standhaften Erwartung Jesu Christi
  rationale: Die gewählte Form bewahrt den Bezug auf die erwartete Person und vermeidet eine Festlegung auf eine bestimmte eschatologische Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht brieflich-antiker Färbung. Da eine direkte Prüfung des griechischen Textes noch aussteht, folgt der Entwurf eng dem angegebenen gemeinfreien englischen Zeugen und vermeidet unbelegte Präzisierungen.
