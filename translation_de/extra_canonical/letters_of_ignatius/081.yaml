  source_fidelity: Der Entwurf folgt dem vorgelegten englischen Zeugen insgesamt eng und erhält die polemische Antithese zwischen Christus als „Träger von Fleisch“ und den Gegnern als „Träger eines Leichnams“. Die Satzverbindung „während er selbst … trägt“ gibt jedoch das begründende bzw. prädikative Bild weniger genau wieder; sie sollte nicht temporal verstanden werden. Da kein griechischer Wortlaut im Datensatz bereitgestellt ist, bleibt die Prüfung der griechischen Formulierungen vorläufig und am englischen Zeugen orientiert.
  naturalness: Die Sprache ist überwiegend modernes Standarddeutsch. „Habe ich … nicht für gut befunden niederzuschreiben“ ist unnötig schwerfällig; „hielt ich … nicht für richtig, sie aufzuschreiben“ ist idiomatischer. „Ohne zu bekennen“ bildet die partizipiale Anbindung an die Lästerung klarer ab als das potenziell kausale „weil er nicht bekennt“.
  terminology: „verleugnen“, „Fleisch getragen hat“, „Leichnam trägt“, „umkehren“ und „Leiden“ bewahren die Bilder und Schlüsselbegriffe des Zeugen. Die Fußnoten sollen die Bildsprache erläutern, aber nicht weitergehend behaupten, die Aussage lege eine bestimmte spätere dogmatische Deutung fest.
