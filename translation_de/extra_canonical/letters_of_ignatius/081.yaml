    issue: Temporale Anbindung von „während er selbst einen Leichnam trägt“
    rationale: Das englische „being himself a bearer of a corpse“ charakterisiert bzw. begründet die vollständige Verleugnung; „während“ legt im Deutschen primär ein zeitliches Verhältnis nahe. „Denn er selbst trägt einen Leichnam“ gibt die Aussage präziser und natürlicher wieder.
  - severity: low
    issue: Unnötig schwerfällige Formulierung bei der Nichtnennung der Namen
    rationale: „Habe ich … nicht für gut befunden niederzuschreiben“ ist verständlich, aber für modernes Standarddeutsch weniger idiomatisch. Eine schlichtere Formulierung wahrt Sinn und Register.
  - severity: low
    issue: „weil er nicht bekennt“ kann kausal gelesen werden
    rationale: Die englische Vorlage verbindet das Nichtbekennen als begleitende Beschreibung mit dem Lästern. „ohne zu bekennen“ bildet dies im Deutschen eindeutiger ab.
