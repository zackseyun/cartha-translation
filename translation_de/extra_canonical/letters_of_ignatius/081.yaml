base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: de
  text: 'Einige jedoch verleugnen ihn in ihrer Unwissenheit – oder vielmehr: Sie sind von ihm verleugnet worden. Sie treten für den Tod ein statt für die Wahrheit. Weder die Prophezeiungen noch das Gesetz des Mose haben sie überzeugt, ja, bis zu dieser Stunde nicht einmal das Evangelium oder die Leiden eines jeden von uns; denn auch über uns denken sie genauso.


    Denn was nützt es [mir], wenn jemand mich lobt, aber meinen Herrn lästert, ohne zu bekennen, dass er Fleisch getragen hat? Wer dies nicht bejaht, verleugnet ihn damit völlig. Denn er selbst trägt einen Leichnam.[a]


    Ihre Namen aber habe ich, weil sie ungläubig sind, nicht für richtig gehalten, sie aufzuschreiben. Ja, es sei mir fern, mich auch nur an sie zu erinnern, bis sie umkehren und zu dem Leiden zurückkehren, das unsere Auferstehung ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich-bildhaft steht dem Herrn, der „Fleisch getragen hat“, der Mensch gegenüber, der „einen Leichnam trägt“. Das drastische Gegenbild verbindet die Leugnung von Christi Fleischlichkeit mit dem Tod.
    reason: Erläutert die ungewöhnliche Bildsprache, ohne sie im Haupttext zu glätten oder eine spätere dogmatische Auslegung festzulegen.
  - marker: b
    text: Mit „dem Leiden“ ist die Passion Christi gemeint. Die zugespitzte Wendung nennt dieses Leiden „unsere Auferstehung“, ohne das Verhältnis näher zu erklären.
    reason: Kennzeichnet den historischen Bezug von „Leiden“ und bewahrt die unaufgelöste Identitätsaussage.
lexical_decisions:
- source_word: ἀρνοῦνται / ἠρνήθησαν (as reflected in the witness)
  choice: „verleugnen“ / „sind … verleugnet worden“
  rationale: Bewahrt das zugespitzte Wortspiel zwischen ihrer Verleugnung Christi und ihrem Verleugnetwordensein durch ihn.
- source_word: σάρκα φορεῖν / σαρκὸς φορέα (as reflected in the witness)
  choice: „Fleisch getragen hat“
  rationale: Gibt das konkrete Trägerbild wieder und vermeidet eine dogmatisch glättende Umschreibung wie „wirklich Mensch war“.
- source_word: νεκροφόρος (as reflected in the witness)
  choice: „einen Leichnam trägt“
  rationale: Erhält den drastischen Kontrast zwischen Christus als Träger des Fleisches und dem Gegner als Träger eines Leichnams.
- source_word: πάθος
  choice: „Leiden“
  rationale: Im Zusammenhang bezeichnet das Wort Christi Passion; „Leiden“ ist verständlich und lässt die prägnante Aussage „unsere Auferstehung“ unaufgelöst stehen.
- source_word: μετανοήσωσιν (as reflected in the witness)
  choice: „umkehren“
  rationale: Drückt Sinnesänderung und praktische Rückkehr aus, ohne das Wort auf bloßes Bedauern zu verengen.
theological_decisions:
- issue: Christi Fleischlichkeit
  choice: „dass er Fleisch getragen hat“
  alternative: „dass er im Fleisch war“ oder „wirklich Mensch geworden ist“
  rationale: Die bildhafte, anti-doketische Formulierung wird bewahrt, ohne ihre Aussage durch spätere dogmatische Terminologie zu ersetzen.
- issue: Göttliches Verleugnen der Irrlehrer
  choice: 'Passivisch: „Sie sind von ihm verleugnet worden“'
  alternative: „Er hat sie verworfen“
  rationale: Das Passiv erhält die sprachliche und theologische Spannung des Gegenstücks zu „sie verleugnen ihn“.
- issue: Verhältnis von Passion und Auferstehung
  choice: „das Leiden, das unsere Auferstehung ist“
  alternative: „das Leiden, durch das wir auferstehen“
  rationale: Die Identitätsaussage des Zeugnisses bleibt erhalten; eine kausale Deutung würde die zugespitzte Formulierung stillschweigend erklären.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, klaren Sätzen. Die polemische Schärfe und die körperlichen Bilder des Textes bleiben erhalten. Da eine direkte Prüfung des griechischen Ausgangstextes laut Datensatz noch aussteht, folgt der Entwurf vorsichtig dem vorgelegten öffentlichen englischen Zeugen; rekonstruierte griechische Lexeme werden nur als durch den Zeugen reflektiert behandelt.
