id: IGN.081
reference: Letters of Ignatius — IgnSmyrn. 5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: 'But certain persons ignorantly deny Him, or rather have been denied by Him, being advocates of death rather than of the truth; and they have not been persuaded by the prophecies nor by the law of Moses, nay nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if a man praiseth me, but blasphemeth my Lord, not confessing that He was a bearer of flesh? Yet he that affirmeth not this, doth thereby deny Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing--nay, far be it from me even to remember them, until they repent and return to the passion, which is our resurrection.'
