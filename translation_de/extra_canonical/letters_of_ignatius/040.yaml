base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: de
  text: 'Ich habe erfahren, dass eure Gesinnung untadelig und in Geduld standhaft ist – nicht aus Gewohnheit, sondern eurem Wesen nach. So berichtete mir Polybius, euer Bischof, der mich nach dem Willen Gottes und Jesu Christi in Smyrna besuchte. Er freute sich so sehr mit mir über meine Fesseln in Christus Jesus, dass ich in ihm eure ganze Gemeinde vor mir sah.


    Da ich nun durch ihn euer von Gott geprägtes Wohlwollen empfangen hatte, pries ich Gott; denn ich hatte euch so vorgefunden, wie ich erfahren hatte: als Nachahmer Gottes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind (Greek source review pending)
  choice: Gesinnung
  rationale: Gibt die innere Haltung einer Gemeinschaft natürlicher und würdevoller wieder als das enger verstandene „Verstand“.
- source_word: steadfast in patience
  choice: in Geduld standhaft
  rationale: Bewahrt sowohl das geduldige Ausharren als auch dessen Beständigkeit.
- source_word: not from habit, but by nature
  choice: nicht aus Gewohnheit, sondern eurem Wesen nach
  rationale: Erhält den Gegensatz des Zeugnisses, ohne „von Natur aus“ psychologisch oder dogmatisch zu überdeuten.
- source_word: bonds
  choice: Fesseln
  rationale: Konkrete, traditionsnahe Bezeichnung für die Gefangenschaft des Ignatius.
- source_word: whole multitude
  choice: eure ganze Gemeinde
  rationale: Im brieflichen Kontext ist die versammelte Gemeinschaft gemeint; „Menge“ wäre im modernen Deutsch unnatürlich und potenziell abwertend.
- source_word: godly benevolence
  choice: von Gott geprägtes Wohlwollen
  rationale: Vermeidet das heute missverständliche „göttliches Wohlwollen“, das eine Gott selbst zukommende Eigenschaft nahelegen könnte, und erhält den religiösen Bezug.
- source_word: gave glory
  choice: pries ich Gott
  rationale: Macht die im Deutschen sonst unvollständige Wendung idiomatisch und legt den aus dem Kontext naheliegenden Empfänger des Lobpreises offen.
- source_word: imitators of God
  choice: Nachahmer Gottes
  rationale: Bewahrt die markante frühchristliche Aussage direkt, ohne sie zu „Vorbildern“ oder bloßer Ähnlichkeit abzuschwächen.
theological_decisions:
- issue: Der gemeinsame Wille Gottes und Jesu Christi
  choice: nach dem Willen Gottes und Jesu Christi
  alternative: nach Gottes Willen durch Jesus Christus
  rationale: Die koordinierte Formulierung des Zeugnisses bleibt erhalten; eine hierarchisierende oder trinitarisch systematisierende Auflösung wird vermieden.
- issue: „Nachahmer Gottes“ als starke theologische Aussage
  choice: als Nachahmer Gottes
  alternative: als Menschen, die Gottes Beispiel folgen
  rationale: Die Spannung und Kühnheit der Aussage werden nicht durch eine erklärende Paraphrase abgeschwächt.
- issue: Bezug der Freude auf die Gefangenschaft
  choice: freute sich so sehr mit mir über meine Fesseln in Christus Jesus
  alternative: freute sich in meinen Fesseln mit mir
  rationale: Die Fesseln werden als christusbezogene Gefangenschaft verstanden, ohne Leiden an sich als uneingeschränktes Gut darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemeindlichem Briefstil. Wegen der noch ausstehenden direkten Prüfung des griechischen Textes ist der Entwurf ausdrücklich auf das angegebene öffentliche englische Zeugnis gestützt; besonders die Begriffe hinter „mind“, „by nature“ und „godly benevolence“ sollten bei der griechischen Kollation erneut geprüft werden.
