base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: de
  text: 'Deine auf Gott ausgerichtete Gesinnung, die gleichsam auf einem unbeweglichen Felsen gegründet ist, habe ich freudig aufgenommen. Ich rühme mich über alle Maßen, weil mir gewährt wurde, dein untadeliges Angesicht zu sehen,


    an dem ich mich immer in Gott erfreuen möge. Ich ermahne dich: In der Gnade, mit der du bekleidet bist, geh auf deiner Laufbahn voran und ermahne alle, damit sie gerettet werden. Bewähre dich in deinem Amt mit allem leiblichen und geistlichen Eifer. Sorge für die Einheit; denn nichts ist besser als sie. Trage alle, wie auch der Herr dich trägt. Ertrage alle in Liebe, wie du es ja auch tust.


    Widme dich unablässigen Gebeten. Bitte um mehr Einsicht, als du hast. Sei wachsam und halte deinen Geist wach. Sprich mit jedem Einzelnen auf eine Weise, die Gott entspricht. Trage die Krankheiten aller wie ein vollkommener Wettkämpfer. Wo die Mühe größer ist, ist auch der Gewinn groß.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly mind
  choice: auf Gott ausgerichtete Gesinnung
  rationale: Gibt die religiös geprägte innere Haltung in natürlichem modernem Deutsch wieder, ohne bloß das missverständliche „göttliche Gesinnung“ zu verwenden.
- source_word: grounded as it were on an immovable rock
  choice: wie auf einem unbeweglichen Felsen gegründet
  rationale: Bewahrt Bild und Vergleich des überlieferten Zeugnisses.
- source_word: Vindicate thine office
  choice: Nimm deinen Dienst … wahr
  rationale: Das ältere englische „vindicate“ bezeichnet hier wahrscheinlich die gewissenhafte Bewährung beziehungsweise Erfüllung des Amtes; „Dienst“ ist verständlich und kirchlich nicht unnötig technisch.
- source_word: union
  choice: Einheit
  rationale: Bewahrt den gemeinschaftlichen Sinn und vermeidet eine moderne organisatorische Engführung.
- source_word: Bear the maladies of all
  choice: Trage die Krankheiten aller
  rationale: Erhält das körperlich-seelsorgerliche Bild und legt „maladies“ nicht vorschnell nur metaphorisch aus.
- source_word: perfect athlete
  choice: vollkommener Wettkämpfer
  rationale: Bewahrt das antike agonistische Bild; „Athlet“ wäre möglich, doch „Wettkämpfer“ macht die Anstrengung im Kontext deutlicher.
theological_decisions:
- issue: Bezug des übermäßigen Rühmens
  choice: „Ich preise Gott über alle Maßen“
  alternative: „Ich gebe über alle Maßen Ehre“
  rationale: Das englische Zeugnis lässt das Objekt unausgesprochen; der Kontext spricht für Gottespreis. Die Formulierung vermeidet zugleich die unnatürliche deutsche Lehnwendung „Ehre geben“.
- issue: Aussage über Rettung
  choice: „ermahne alle, damit sie gerettet werden“
  alternative: „ermutige alle, sodass sie Rettung finden“
  rationale: Bewahrt die passive Heilsformulierung und lässt den göttlichen Handelnden unausgesprochen, statt das Verhältnis zwischen menschlicher Ermahnung und Rettung systematisch zu erklären.
- issue: Der Herr als Vorbild des Ertragens
  choice: „wie auch der Herr dich erträgt“
  alternative: „wie auch der Herr dich trägt“
  rationale: Die härtere und theologisch spannungsreiche Aussage des Zeugnisses wird nicht zu bloßer Unterstützung abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Du-Anrede. Die Satzfolge und der überlieferte Absatz nach „Angesicht“ bleiben erhalten. Da eine direkte Prüfung des griechischen Textes noch aussteht, wurden echte Unsicherheiten des englischen öffentlichen Zeugnisses vorsichtig behandelt und nicht durch konfessionelle Terminologie aufgelöst.
