  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: de
  text: 'Daher ist es angemessen, dass ihr euch im Einklang mit der Gesinnung des Bischofs zusammenschließt, wie ihr es ja auch tut. Denn euer ehrwürdiges Ältestenkollegium, das Gottes würdig ist, ist mit dem Bischof verbunden wie die Saiten mit einer Leier. So wird in eurer Eintracht und harmonischen Liebe Jesus Christus besungen.


    Ihr aber sollt euch, jeder Einzelne, zu einem Chor zusammenschließen, damit ihr in Eintracht harmonisch vereint seid, den Ton Gottes aufnehmt[a] und in Einheit mit einer Stimme durch Jesus Christus dem Vater singt, damit er euch höre und anhand eurer guten Taten erkenne, dass ihr Glieder seines Sohnes seid. Darum ist es gut für euch, in untadeliger Einheit zu leben, damit ihr immer an Gott teilhabt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise sinngemäß auch: „die Tonart Gottes“ oder „den Grundton Gottes“. Der griechische Ausdruck χρῶμα θεοῦ steht in einer durchgehenden musikalischen Metapher; seine genaue technische Bedeutung ist nicht völlig eindeutig.'
    reason: „Ton Gottes“ hält die musikalische Bildsprache aufrecht, ohne die umstrittene Nuance von χρῶμα zu eng festzulegen.
  - marker: b
    text: „An Gott teilhaben“ kann auch mit „Anteil an Gott haben“ wiedergegeben werden.
    reason: Die starke Aussage des griechischen μετέχω soll bewahrt werden, ohne ihren genauen theologischen Gehalt festzulegen.
lexical_decisions:
- source_word: γνώμη
  choice: Gesinnung
  rationale: Das Wort bezeichnet hier Sinn, Haltung oder Absicht. „Gesinnung“ bewahrt diese Breite besser als das enger wirkende „Meinung“.
- source_word: πρεσβυτέριον
  choice: Ältestenkollegium
  rationale: Gemeint ist die gemeinschaftliche Körperschaft der Presbyter beziehungsweise Ältesten, nicht nur das abstrakte Amt.
- source_word: συνήρμοσται
  choice: ist ... abgestimmt
  rationale: Die musikalische Metapher der auf die Leier abgestimmten Saiten wird im Deutschen natürlich fortgeführt.
- source_word: χρῶμα θεοῦ
  choice: den Grundton Gottes
  rationale: Im musikalischen Zusammenhang bezeichnet χρῶμα wohl Ton, Klangfarbe oder Tonart. „Grundton“ nimmt das Bild verständlich auf, ohne die schwierige Wendung als bloßen Befehl Gottes umzudeuten.
- source_word: μέλη
  choice: Glieder
  rationale: Bewahrt das organische Bild der Zugehörigkeit zum Sohn und zugleich den traditionellen biblisch-frühchristlichen Sprachgebrauch.
- source_word: μετέχητε
  choice: an Gott teilhabt
  rationale: Gibt die starke, aber nicht näher erklärte Aussage der Teilhabe wieder, ohne sie konfessionell oder metaphysisch auszudeuten.
theological_decisions:
- issue: Verhältnis der Gemeinde zum Bischof
  choice: „mit der Gesinnung des Bischofs im Einklang geht“
  alternative: „der Meinung des Bischofs folgt“
  rationale: Der Text betont Eintracht durch ein musikalisches Bild. Die Übersetzung vermeidet es, daraus ausdrücklich unbedingten Gehorsam zu machen.
- issue: Erkennen durch gute Taten
  choice: „an euren guten Taten erkennen“
  alternative: „aufgrund eurer guten Werke als Glieder seines Sohnes anerkennen“
  rationale: Die Formulierung wahrt den Zusammenhang zwischen gelebtem Handeln und göttlichem Erkennen, ohne eine ausgearbeitete Lehre über Verdienst oder Rechtfertigung einzutragen.
- issue: Teilhabe an Gott
  choice: „an Gott teilhabt“
  alternative: „Gemeinschaft mit Gott habt“
  rationale: „Teilhabe“ entspricht der stärkeren und zugleich offenen Bedeutung von μετέχω; die theologische Spannung wird nicht auf bloße Gemeinschaft reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konsequent erhaltener Chor-, Stimmungs- und Saitenmetaphorik. „Bischof“ und „Ältestenkollegium“ geben die frühchristlichen Amtsbezeichnungen verständlich wieder. Der Entwurf stützt sich auf die angegebene mittelrezensionale griechische Lesart, soweit sie aus der überlieferten Textgestalt erschließbar ist; da die direkte Quellenprüfung laut Datensatz noch aussteht, werden besonders χρῶμα θεοῦ und andere mögliche textkritische Fragen vorsichtig behandelt.
