base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be servants of lust.'
translation:
  language: de
  text: 'Witwen dürfen nicht vernachlässigt werden. Sei nach dem Herrn ihr Fürsorger.[a] Nichts soll ohne dein Einverständnis geschehen; auch du sollst nichts ohne Gottes Einverständnis tun, wie du es ja auch nicht tust. Sei standhaft.


    Die Versammlungen sollen häufiger stattfinden. Suche alle mit Namen.[b]


    Verachte weder Sklaven noch Sklavinnen.[c] Doch sollen auch sie nicht überheblich werden, sondern umso mehr zur Ehre Gottes dienen, damit sie von Gott eine bessere Freiheit erlangen. Sie sollen nicht danach verlangen, aus gemeinsamen Mitteln freigelassen zu werden, damit sie nicht als Sklaven der Begierde befunden werden.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Nach dem Herrn“ drückt eine Rangfolge aus: Der Herr bleibt der Erste; danach soll der Adressat für die Witwen sorgen. Die knappe Formulierung legt die genaue Beziehung nicht näher fest.'
    reason: Bewahrt die offene Zuordnung der griechischen Formel, ohne eine bestimmte Stellvertretungslehre einzutragen.
  - marker: b
    text: 'Wörtlich: „Suche alle mit Namen.“ Die Aufforderung zielt auf persönliche Kenntnis und Zuwendung zu allen; sie verlangt nicht zwingend, jede Person körperlich aufzusuchen.'
    reason: Erläutert die knappe, potenziell idiomatische Wendung ohne den Kreis von „allen“ einzuengen.
  - marker: c
    text: Der Text spricht aus einer Gesellschaft, in der Menschen rechtlich versklavt waren. Die Bezeichnung benennt diesen historischen Status, ohne ihn zu billigen.
    reason: Bietet den notwendigen historischen Hinweis, ohne den Haupttext umzudeuten.
  - marker: d
    text: „Aus gemeinsamen Mitteln“ gibt die offene Wendung für gemeinschaftliche Ressourcen wieder; sie kann insbesondere Mittel der Gemeinde meinen. „Sklaven der Begierde“ bewahrt den Kontrast zwischen äußerer Freilassung und innerer Unfreiheit.
    reason: Vermeidet die nicht ausdrücklich genannte Vorstellung eines Freikaufs und erhält das antithetische Wortspiel des Textes.
lexical_decisions:
- source_word: widows
  choice: Witwen
  rationale: Die sozial und kirchlich erkennbare Gruppe wird direkt und ohne erläuternde Erweiterung bezeichnet.
- source_word: protector
  choice: Beschützer
  rationale: Gibt die persönliche Fürsorge- und Schutzpflicht würdig und allgemein verständlich wieder.
- source_word: meetings
  choice: Versammlungen
  rationale: Bewahrt die offene Bezeichnung gemeinschaftlicher Zusammenkünfte, ohne sie enger als Gottesdienste zu bestimmen.
- source_word: seek out all men by name
  choice: Suche jeden Einzelnen mit Namen auf
  rationale: Drückt persönliche, individuelle Zuwendung aus und vermeidet das heute missverständliche generische „alle Männer“.
- source_word: slaves, whether men or women
  choice: weder Sklaven noch Sklavinnen
  rationale: Benennt den antiken Rechts- und Sozialstatus unverharmlost und macht beide Geschlechter ausdrücklich sichtbar.
- source_word: better freedom
  choice: eine bessere Freiheit
  rationale: Bewahrt den wertenden Vergleich und seine mögliche geistliche beziehungsweise eschatologische Spannung.
- source_word: public cost
  choice: auf Kosten der Gemeinschaft
  rationale: Bezeichnet wahrscheinlich gemeinschaftliche Mittel, ohne vorschnell einen modernen Staatshaushalt oder eine bestimmte Kirchenkasse vorauszusetzen.
- source_word: slaves of lust
  choice: Sklaven ihrer Begierde
  rationale: Erhält das pointierte Wortspiel zwischen äußerer Versklavung und innerer Knechtschaft; der Singular fasst begehrliches Verlangen kollektiv.
theological_decisions:
- issue: Rangfolge in „After the Lord“
  choice: „nach dem Herrn“
  alternative: „an der Stelle des Herrn“ oder „dem Herrn gemäß“
  rationale: Die knappe Rang- beziehungsweise Zuordnungsformel bleibt bewusst offen und wird nicht als Stellvertretungslehre ausgelegt.
- issue: Gottes Zustimmung
  choice: „ohne Gottes Zustimmung“
  alternative: „ohne Gott“ oder „ohne Gottes Willen“
  rationale: Bewahrt die Parallelität zur Zustimmung des Adressaten und vermeidet eine weitergehende Systematisierung des göttlichen Willens.
- issue: Bessere Freiheit von Gott
  choice: „von Gott eine bessere Freiheit erlangen“
  alternative: „die wahre Freiheit bei Gott erlangen“
  rationale: Der Komparativ wird erhalten; weder eine rein innerliche noch ausschließlich endzeitliche Freiheit wird festgelegt.
- issue: Dienst versklavter Menschen
  choice: Historische Aufforderung direkt wiedergegeben
  alternative: Durch eine moderne ethische Distanzierung im Haupttext umformulieren
  rationale: Der schwierige Gedankengang des antiken Textes wird nicht beschönigt oder durch heutige Schlussfolgerungen ersetzt; die Fußnote schafft den nötigen historischen Hinweis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter singularischer Anrede („du/deine“). Die Satzstruktur bleibt knapp und mahnend. Historisch belastete Begriffe werden weder euphemistisch abgeschwächt noch unnötig modernisiert. Da nur ein englisches gemeinfreies Zeugnis vorliegt und die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, sind besonders die Formulierungen „nach dem Herrn“, „Zustimmung“, „auf Kosten der Gemeinschaft“ und „Begierde“ als vorläufig quellennahe Entscheidungen zu behandeln.
