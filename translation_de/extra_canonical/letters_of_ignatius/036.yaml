- from: 'Bemüht euch also mit aller Sorgfalt darum, in den Ordnungen des Herrn und der Apostel gefestigt zu sein, damit euch alles gelingt, was ihr tut, nach Fleisch und Geist, in Glauben und Liebe, im Sohn und im Vater und im Geist, am Anfang und am Ende, zusammen mit eurem hochgeachteten Bischof, mit dem würdig bekränzten geistlichen Kranz eurer Ältestenschaft und mit den Diakonen, die nach Gottes Willen leben.


