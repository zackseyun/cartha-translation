  source_fidelity: 'Eine Überarbeitung ist angezeigt. Die deutsche Fassung gibt den Gedankengang weitgehend zutreffend wieder, doch „würdig bekränzten ... Kranz“ verschiebt das Bild: Der geistliche Kranz der Ältestenschaft ist selbst als kunstvoll/angemessen geflochten charakterisiert, nicht als gekrönt. Ferner gibt „Lehren“ das hier zugrunde liegende δόγματα bzw. die englischen „ordinances“ in diesem frühchristlichen Kontext weiter und ist weniger institutionell verengt als „Ordnungen“. Die abschließende Formulierung sollte die Einheit ausdrücklich als eine solche „im Fleisch und im Geist“ ausdrücken.'
  naturalness: „Ordnet euch dem Bischof und einander unter“ ist für den Aufforderungssatz idiomatischer und trifft die Unterordnungsnuance besser als „Gehorcht ... und einander“. „Im Fleisch und im Geist“ bewahrt die wiederholte, bewusst auffällige Ausdrucksweise und ist im würdigen frühchristlichen Register verständlich. Die Reihung „im Sohn und im Vater und im Geist“ bleibt unangetastet.
  terminology: „Bischof“, „Ältestenschaft“ und „Diakone“ sind angemessen. „Kunstvoll geflochtener geistlicher Kranz“ erhält das ungewöhnliche Bild, ohne es institutionell aufzulösen. Die Klammern bei „dem Fleisch nach“ und die erläuternde Fußnote bleiben als Signal der vorläufigen textkritischen Lage erhalten.
  issues:
  - severity: medium
    issue: „würdig bekränzten geistlichen Kranz“
    rationale: Die Formulierung kann besagen, der Kranz sei bekränzt, und verfehlt damit das Bild eines kunstvoll bzw. passend geflochtenen Kranzes.
  - severity: medium
    issue: „Ordnungen“ für „ordinances“/δόγματα
    rationale: „Ordnungen“ kann im modernen Deutsch primär institutionelle Regeln oder Satzungen nahelegen. „Lehren“ wahrt den frühchristlichen Sinnbereich besser, ohne ihn auf bloße Information zu reduzieren.
  - severity: low
    issue: „Gehorcht dem Bischof und einander“
    rationale: Die Verbindung mit „einander“ wirkt im Deutschen unnatürlich; „Ordnet euch ... unter“ gibt die gegenseitige Unterordnung klar und idiomatisch wieder.
