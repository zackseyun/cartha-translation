base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: de
  text: 'Setzt daher alles daran, in den Lehren des Herrn und der Apostel gefestigt zu sein, damit euch in allem gelingt, was ihr tut, im Fleisch und im Geist, durch Glauben und Liebe, im Sohn und im Vater und im Geist, am Anfang und am Ende, zusammen mit eurem hochgeachteten Bischof, mit dem kunstvoll geflochtenen geistlichen Kranz eurer Ältestenschaft und mit den Diakonen, die nach Gottes Willen leben.


    Ordnet euch dem Bischof und einander unter, wie Jesus Christus dem Vater untertan war [dem Fleisch nach][a] und wie die Apostel Christus und dem Vater untertan waren, damit eine Einheit im Fleisch und im Geist bestehe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „dem Fleisch nach“ stehen im zugrunde gelegten englischen Zeugen in eckigen Klammern; damit wird eine Unsicherheit der Textüberlieferung bzw. Textgestalt angezeigt. Eine unmittelbare Prüfung des griechischen Textes steht noch aus.
    reason: Der überlieferte Klammerhinweis muss sichtbar bleiben, und die vorläufige Grundlage der Übersetzung soll transparent gemacht werden.
lexical_decisions:
- source_word: ordinances
  choice: Ordnungen
  rationale: Gibt den überlieferten Sinn als verbindliche Weisungen bzw. Ordnungen wieder, ohne ihn vorschnell auf Gebote, Lehren oder kirchliche Satzungen einzuengen.
- source_word: prosper
  choice: gelingt
  rationale: Natürliches modernes Deutsch für erfolgreiches Vorankommen in allem Tun; vermeidet die vorwiegend wirtschaftliche Bedeutung von „gedeihen“.
- source_word: in flesh and spirit
  choice: nach Fleisch und Geist
  rationale: Bewahrt die frühchristliche Gegenüberstellung und ihre mögliche anthropologische wie praktische Weite.
- source_word: presbytery
  choice: Ältestenschaft
  rationale: Bezeichnet das Kollegium der Presbyter und ist für heutige Leser verständlicher als das institutionell missverständliche „Presbyterium“.
- source_word: fitly wreathed spiritual circlet
  choice: würdig bekränzten geistlichen Kranz
  rationale: Erhält das auffällige Kranzbild des Zeugen, statt es zu einer bloßen Beschreibung des Leitungsgremiums zu glätten.
- source_word: walk after God
  choice: nach Gottes Willen leben
  rationale: Überträgt die semitisch-biblische Metapher „wandeln“ in verständliches modernes Deutsch, ohne die Ausrichtung auf Gott abzuschwächen.
- source_word: union
  choice: Einheit
  rationale: „Einheit“ ist im Deutschen idiomatischer als „Vereinigung“ und lässt offen, ob vor allem gemeinschaftliche Eintracht oder eine umfassendere Einheit gemeint ist.
theological_decisions:
- issue: Gehorsam Jesu gegenüber dem Vater
  choice: „wie Jesus Christus dem Vater gehorsam war [dem Fleisch nach]“
  alternative: „wie Jesus Christus dem Vater gemäß dem Fleisch untertan war“
  rationale: Die Aussage wird nicht dogmatisch harmonisiert. Das bracketierte Qualifikativ bleibt als textkritisches bzw. überlieferungsgeschichtliches Signal sichtbar.
- issue: Trinitarische Reihung
  choice: „im Sohn und im Vater und im Geist“
  alternative: „im Sohn, im Vater und im Geist“
  rationale: Die ungewöhnliche Reihenfolge und die wiederholte Konjunktion werden bewahrt; eine später vertrautere trinitarische Formel wird nicht eingetragen.
- issue: Einheit von Fleisch und Geist
  choice: „Einheit ... sowohl dem Fleisch als auch dem Geist nach“
  alternative: „leibliche und geistliche Einheit“
  rationale: Die parallele Form wahrt die Spannung des Textes und vermeidet, „Fleisch“ vorschnell nur als „Leib“ auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlich-kirchlichem Ton. Die Übersetzung ist vorläufig, da als Ausgangspunkt der bereitgestellte gemeinfreie englische Zeuge der griechischen mittleren Rezension dient und eine direkte Prüfung des Griechischen noch aussteht. Auffällige Bilder, ungewöhnliche Reihungen und theologische Spannungen wurden möglichst erhalten.
