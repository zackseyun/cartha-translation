revisions:
- from: 'Lasst euch nicht täuschen, meine Geschwister. Wer ganze Hausgemeinschaften verdirbt, wird das Reich Gottes nicht erben.


    Wenn nun schon diejenigen, die solche Dinge im Bereich des Fleisches tun, mit dem Tod bestraft werden, wie viel mehr gilt das für jemanden, der durch eine böse Lehre den Glauben Gottes verdirbt, für den Jesus Christus gekreuzigt wurde.[a] Ein solcher Mensch hat sich selbst befleckt und wird in das unauslöschliche Feuer kommen; ebenso auch, wer auf ihn hört.'
  to: 'Lasst euch nicht täuschen, meine Geschwister. Verderber von Haushalten werden das Reich Gottes nicht erben.


    Wenn nun diejenigen, die nach dem Fleisch solche Dinge tun, sterben, wie viel mehr gilt das für jemanden, der durch böse Lehre den Glauben Gottes verdirbt, für den Jesus Christus gekreuzigt wurde.[a] Ein solcher Mensch, der sich befleckt hat, wird in das unauslöschliche Feuer kommen; ebenso auch, wer auf ihn hört.'
