review_pass:
  verdict: revise
  source_fidelity: 'Die griechische mittlere Rezension bestätigt den Grundsinn, verlangt aber mehrere Präzisierungen: οἰκοφθόροι bezeichnet „Verderber/Zerstörer von Haushalten“, ohne dass „ganze“ im Text steht; κατὰ σάρκα ist besser als „nach dem Fleisch“ wiederzugeben; ἀποθνῄσκουσιν sagt unmittelbar „sterben“, nicht ausdrücklich eine staatlich verhängte Todesstrafe. Der Relativsatz ὑπὲρ ἧς bezieht sich grammatisch auf πίστιν und die Mehrdeutigkeit des Genitivs θεοῦ bleibt bestehen.'
  naturalness: Der Entwurf ist insgesamt würdig und gut verständlich. „Wer ganze Hausgemeinschaften verdirbt“ erweitert jedoch den Wortlaut; „im Bereich des Fleisches“ ist weniger idiomatisch und weniger formnah als „nach dem Fleisch“.
  terminology: „Reich Gottes erben“ und „unauslöschliches Feuer“ sind treffend. „Glauben Gottes“ bewahrt zwar die Form, ist im Deutschen sperrig; „den Glauben, der mit Gott verbunden ist“ würde die genitivische Offenheit nicht gleichwertig bewahren. Daher bleibt die formnahe Wendung mit einer sachlichen Anmerkung vertretbar.
  issues:
  - severity: medium
    issue: „ganze Hausgemeinschaften“ erweitert οἰκοφθόροι.
    rationale: Weder „ganze“ noch eine ausdrückliche Aussage über den Umfang der betroffenen Gemeinschaft steht im griechischen Begriff. „Verderber von Haushalten“ hält die Aussage offen und formnäher.
  - severity: medium
    issue: „mit dem Tod bestraft werden“ ist stärker als ἀποθνῄσκουσιν.
    rationale: Das Verb besagt „sterben“; eine juristische Bestrafung wird an dieser Stelle nicht ausdrücklich benannt.
  - severity: low
    issue: „im Bereich des Fleisches“ glättet κατὰ σάρκα zu stark.
    rationale: „Nach dem Fleisch“ ist im modernen religiösen Register verständlich und erhält die prägnante ethische Kategorie des griechischen Textes.
  - severity: low
    issue: Die Fußnote beschreibt die griechische Prüfung weiterhin als ausstehend.
    rationale: Für diese Rezension kann der griechische Wortlaut geprüft werden; die Anmerkung sollte nur die tatsächlich verbleibende Genitivmehrdeutigkeit erläutern.
