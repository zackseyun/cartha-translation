base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: de
  text: 'Lasst euch nicht täuschen, meine Geschwister. Verderber von Haushalten werden das Reich Gottes nicht erben.


    Wenn nun diejenigen, die nach dem Fleisch solche Dinge tun, sterben, wie viel mehr gilt das für jemanden, der durch böse Lehre den Glauben Gottes verdirbt, für den Jesus Christus gekreuzigt wurde.[a] Ein solcher Mensch, der sich befleckt hat, wird in das unauslöschliche Feuer kommen; ebenso auch, wer auf ihn hört.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck „Glauben Gottes“ (pistin theou) lässt offen, wie der Genitiv genauer zu verstehen ist. Der folgende Relativsatz bezieht sich grammatisch auf „Glauben“.
    reason: Bewahrt die grammatische und theologische Mehrdeutigkeit des griechischen Textes, ohne sie durch eine bestimmte Auslegung aufzulösen.
lexical_decisions:
- source_word: my brethren
  choice: meine Geschwister
  rationale: Natürliches, inklusives Standarddeutsch für die angeredete Glaubensgemeinschaft, ohne den gemeinschaftlichen Ton abzuschwächen.
- source_word: Corrupters of houses
  choice: Wer ganze Hausgemeinschaften verdirbt
  rationale: „Hausgemeinschaften“ gibt den antiken sozialen Umfang von Häusern bzw. Haushalten besser wieder als das bloße Gebäude „Häuser“; „ganze“ verdeutlicht idiomatisch die Reichweite, ohne eine neue Gruppe einzuführen.
- source_word: inherit the kingdom of God
  choice: das Reich Gottes erben
  rationale: Bewahrt die traditionelle biblische Erbmetaphorik und den theologischen Bezug.
- source_word: after the flesh
  choice: im Bereich des Fleisches
  rationale: Erhält die körperlich-sittliche Kategorie des Zeugnisses, klingt aber im Deutschen verständlicher als „nach dem Fleisch“.
- source_word: evil doctrine
  choice: eine böse Lehre
  rationale: Gibt sowohl den schädlichen Inhalt als auch den lehrhaften Charakter wieder, ohne die Aussage konfessionell einzuengen.
- source_word: the faith of God
  choice: den Glauben Gottes
  rationale: Bewahrt bewusst die im englischen Zeugen vorhandene Genitivmehrdeutigkeit, statt sie als „Glauben an Gott“ oder „von Gott gegebenen Glauben“ festzulegen.
- source_word: unquenchable fire
  choice: das unauslöschliche Feuer
  rationale: Formnahe, im religiösen Register verständliche Wiedergabe des Bildes.
- source_word: hearkeneth unto him
  choice: wer auf ihn hört
  rationale: Natürliches modernes Deutsch, das sowohl Zuhören als auch Gefolgschaft anklingen lässt.
theological_decisions:
- issue: Genitiv in „the faith of God“
  choice: „den Glauben Gottes“
  alternative: „den Glauben an Gott“ oder „den von Gott gegebenen Glauben“
  rationale: Da eine direkte Prüfung des griechischen Wortlauts noch aussteht, wird die echte theologische und grammatische Spannung nicht stillschweigend aufgelöst.
- issue: Bezug von „for which Jesus Christ was crucified“
  choice: Relativsatz unmittelbar nach „den Glauben Gottes“
  alternative: Umdeutung auf Menschen, Gemeinde oder Erlösungszweck
  rationale: Die syntaktische Zuordnung des vorliegenden Zeugnisses bleibt erhalten, auch wenn die Formulierung ungewöhnlich ist.
- issue: Eschatologische Strafe
  choice: „wird in das unauslöschliche Feuer kommen“
  alternative: Abschwächung zu einem bloßen Bild gegenwärtiger Folgen
  rationale: Die ausdrückliche Gerichtssprache des Zeugnisses wird weder abgeschwächt noch dogmatisch weiter ausgebaut.
- issue: Mitverantwortung des Hörenden
  choice: „ebenso auch, wer auf ihn hört“
  alternative: „wer ihm gehorcht“
  rationale: „Auf ihn hört“ erhält die Spannweite zwischen Anhören, Beachtung und Gefolgschaft, ohne den Grad der Beteiligung enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit paränetischem Ernst. Die Übersetzung beruht mangels abgeschlossener griechischer Quellenprüfung vorläufig auf dem angegebenen gemeinfreien englischen Zeugen. Archaismen wurden vermieden; biblisch geprägte Schlüsselbilder wie „das Reich Gottes erben“ und „unauslöschliches Feuer“ wurden bewahrt.
