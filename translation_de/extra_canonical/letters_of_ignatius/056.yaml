    Nichts Sichtbares ist gut.[a] Denn unser Gott Jesus Christus, der im Vater ist, zeigt sich umso deutlicher.[b] Das Werk ist keine Sache der Überredung; vielmehr ist das Christsein eine Sache der Größe, wenn es von der Welt gehasst wird.[c]'
