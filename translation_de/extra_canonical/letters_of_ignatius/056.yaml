base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: de
  text: 'Ihr habt niemals jemandem etwas missgönnt; andere habt ihr unterwiesen. Ich aber wünsche, dass auch das Bestand hat, was ihr als Lehrende einschärft.


    Betet nur darum, dass mir Kraft gegeben wird, innerlich wie äußerlich, damit ich es nicht nur sage, sondern auch will; damit ich nicht nur Christ genannt werde, sondern auch als einer befunden werde. Denn wenn ich als einer befunden werde, kann ich auch so genannt werden und dann treu sein, wenn ich für die Welt nicht mehr sichtbar bin.


    Nichts, was sichtbar in Erscheinung tritt, ist gut.[a] Denn unser Gott Jesus Christus, der im Vater ist, tritt umso deutlicher in Erscheinung.[b] Die Sache beruht nicht auf Überredung; vielmehr erweist sich das Christsein in Kraft, wenn es von der Welt gehasst wird.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bewusst zugespitzt: „Nichts Erscheinendes ist gut.“ Gemeint sein kann insbesondere das, was sich öffentlich zeigt oder auf äußere Anerkennung zielt; der knappe Satz lässt den Bezug offen.'
    reason: Die Aussage ist ohne Kontext leicht als pauschale Abwertung alles Sichtbaren misszuverstehen.
  - marker: b
    text: „Tritt umso deutlicher in Erscheinung“ gibt dieselbe griechische Wortfamilie wieder wie „sichtbar“ im vorigen Satz. Der paradoxe Gegensatz zwischen der Unsichtbarkeit gegenüber der Welt und dem Offenbarwerden Christi soll erhalten bleiben.
    reason: Die Wortwiederholung und das Paradox sind für die Argumentation wesentlich.
  - marker: c
    text: 'Der letzte Gegensatz lässt sich auch näher am Wortlaut wiedergeben: „Das Werk ist keine Sache der Überredung, sondern das Christsein ist eine Sache der Größe/Macht, wenn es von der Welt gehasst wird.“'
    reason: Die griechischen Begriffe für „Werk/Sache“, „Überredung“ und „Größe/Macht“ erlauben mehrere Nuancierungen; die alternative Form erhält die lexikalische Unsicherheit.
lexical_decisions:
- source_word: ἐβασκάνατε
  choice: habt … etwas missgönnt
  rationale: Gibt den Gedanken von Neid, Missgunst oder neidischem Vorenthalten natürlich wieder, ohne eine speziell magische Bedeutung des Verbs einzutragen.
- source_word: βέβαια ᾖ
  choice: Bestand hat
  rationale: Bewahrt den Sinn von fest, gültig oder wirksam bleiben in idiomatischem Deutsch.
- source_word: δύναμις
  choice: Kraft
  rationale: Passt sowohl zur inneren Entschlossenheit als auch zur äußeren Bewährung und verbindet den Ausdruck mit dem späteren Gegensatz zur Überredung.
- source_word: εὑρεθῶ
  choice: als einer befunden werde
  rationale: 'Die etwas markierte Formulierung erhält den forensisch-prüfenden Sinn: Die christliche Identität soll sich als wirklich erweisen und nicht bloß behauptet werden.'
- source_word: φαίνωμαι / φαινόμενον / φαίνεται
  choice: sichtbar sein / sichtbar in Erscheinung treten / in Erscheinung treten
  rationale: Die wiederkehrende Wortfamilie wird möglichst erkennbar gehalten, obwohl der Kontext jeweils eine leicht andere deutsche Form verlangt.
- source_word: Χριστιανισμός
  choice: das Christsein
  rationale: Bezeichnet hier eher gelebte christliche Existenz als eine Institution oder ein abstraktes Lehrsystem.
- source_word: πεισμονή
  choice: Überredung
  rationale: Bewahrt den Gegensatz zwischen bloßer rhetorischer Überzeugungskraft und wirksamer Kraft, ohne jede vernünftige Überzeugungsarbeit abzuwerten.
- source_word: μέγεθος
  choice: Kraft
  rationale: Der griechische Ausdruck kann Größe oder Macht meinen. Im Satzgefüge gibt „Kraft“ den Gegensatz zur Überredung verständlich wieder; die Fußnote hält die wörtlichere Möglichkeit offen.
theological_decisions:
- issue: Bezeichnung Jesu Christi als „unser Gott“
  choice: unser Gott Jesus Christus
  alternative: Jesus Christus, unser Gott
  rationale: Die ausdrückliche Gottesbezeichnung wird ohne Abschwächung bewahrt; zugleich wird die Aussage „im Vater“ nicht dogmatisch paraphrasiert.
- issue: Aussage, dass nichts Sichtbares gut sei
  choice: wörtlich zugespitzt stehen lassen
  alternative: „Nichts, was nur äußerlich sichtbar ist, ist gut“
  rationale: Der Zusatz „nur äußerlich“ würde die Spannung des Textes vorschnell auflösen. Eine Fußnote weist auf den möglichen Bezug zu Selbstdarstellung und öffentlicher Anerkennung hin.
- issue: „nicht mehr sichtbar für die Welt“
  choice: wenn ich für die Welt nicht mehr sichtbar bin
  alternative: wenn ich aus der Welt verschwunden bin / gestorben bin
  rationale: Der Wortlaut kann auf Ignatius’ erwarteten Tod zielen, sagt dies hier aber indirekt. Die Übersetzung bewahrt diese Indirektheit.
- issue: Christsein unter dem Hass der Welt
  choice: erweist sich … in Kraft, wenn es von der Welt gehasst wird
  alternative: ist groß, wenn es von der Welt gehasst wird
  rationale: Der Hass wird nicht als Selbstzweck oder allgemeines Echtheitskriterium erklärt; der Satz bleibt als situationsbezogene, zugespitzte Bewährungsaussage stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knappen und teilweise paradoxen Sätzen. Archaismen wurden vermieden; zentrale Wiederholungen und die Spannung zwischen Bekenntnis, wirklichem Christsein, Unsichtbarkeit und Offenbarwerden blieben erhalten. Da die bereitgestellte Quellenangabe die direkte Prüfung der mittelrezensionellen griechischen Überlieferung als noch ausstehend bezeichnet, ist der Entwurf vorsichtig formuliert und dokumentiert strittige Stellen in den Fußnoten.
