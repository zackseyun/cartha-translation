base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: de
  text: 'Wenn euch aber jemand das Judentum lehrt, dann hört nicht auf ihn. Denn es ist besser, das Christentum von einem Beschnittenen zu hören als das Judentum von einem Unbeschnittenen. Wenn aber weder der eine noch der andere über Jesus Christus spricht, sind sie für mich Grabsteine und Gräber der Toten, auf denen nur Menschennamen stehen.


    Meidet daher die bösen Künste und Ränke des Herrschers dieser Welt, damit ihr nicht etwa durch seine Machenschaften zermalmt werdet und in eurer Liebe schwach werdet. Kommt vielmehr alle mit ungeteiltem Herzen zusammen. Und[a]


    Ich danke meinem Gott, dass ich euch gegenüber ein gutes Gewissen habe. Niemand kann sich, weder im Verborgenen noch öffentlich, damit rühmen, dass ich irgendjemandem, sei es in Kleinem oder Großem, zur Last gefallen bin. Und für alle, unter denen ich gesprochen habe, bete ich, dass dies ihnen nicht zum Zeugnis gegen sie selbst gereicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das unvermittelt stehende »Und« ist im zugrunde gelegten englischen Textzeugen erhalten; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Kennzeichnet den auffälligen Textanschluss und die begrenzte Quellenlage, ohne ihn stillschweigend zu glätten.
lexical_decisions:
- source_word: propound Judaism
  choice: das Judentum lehrt
  rationale: Gibt den Sinn des englischen Zeugen klar und würdig wieder, ohne die Aussage durch »judaisieren« unnötig zu deuten.
- source_word: Christianity
  choice: das Christentum
  rationale: Entspricht der begrifflichen Gegenüberstellung im überlieferten Zeugen.
- source_word: tombstones and graves of the dead
  choice: Grabsteine und Gräber der Toten
  rationale: Bewahrt das harte, doppelte Bild und glättet es nicht zu einer allgemeinen Metapher.
- source_word: prince of this world
  choice: Herrscher dieser Welt
  rationale: Natürliches modernes Deutsch; »Fürst« wäre möglich, wirkt aber stärker traditionell geprägt.
- source_word: undivided heart
  choice: mit ungeteiltem Herzen
  rationale: Bewahrt die anthropologische Bildsprache und den Aufruf zur Einmütigkeit.
- source_word: was burdensome
  choice: zur Last gefallen sei
  rationale: Idiomatiche deutsche Wiedergabe, die sowohl materielle als auch allgemein persönliche Belastung offenlässt.
theological_decisions:
- issue: Gegenüberstellung von Judentum und Christentum
  choice: Die polemische Gegenüberstellung wird unverändert bewahrt.
  alternative: Die Aussage durch erklärende oder versöhnende Zusätze abzuschwächen.
  rationale: Der historische Text soll in seiner Spannung sichtbar bleiben; redaktionelle Korrekturen würden seine Aussage verfälschen.
- issue: Identität des »Herrschers dieser Welt«
  choice: Keine ausdrückliche Identifizierung im Haupttext.
  alternative: »Teufel« oder »Satan« einzusetzen.
  rationale: Die bildhafte Bezeichnung des Zeugen bleibt erhalten, ohne eine mögliche Referenz stillschweigend auszulegen.
- issue: »Zeugnis gegen sich selbst«
  choice: Die forensische und geistliche Mehrdeutigkeit bleibt bestehen.
  alternative: Als ausdrückliches Verdammungsurteil oder konkrete Anklage zu erklären.
  rationale: Der vorliegende Zeuge legt die genaue Art des Zeugnisses nicht fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die Übersetzung ist vorläufig, da der bereitgestellte Arbeitsstand auf einem gemeinfreien englischen Zeugen beruht und die direkte Prüfung der griechischen mittelrezensionalen Überlieferung noch aussteht.
