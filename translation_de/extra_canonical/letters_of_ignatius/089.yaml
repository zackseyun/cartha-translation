base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: de
  text: 'Ich grüße die Häuser meiner Brüder mit ihren Frauen und Kindern sowie die Jungfrauen, die Witwen genannt werden.[a] Lebt wohl in der Kraft des Vaters. Philo, der bei mir ist, grüßt euch.


    Ich grüße das Haus der Tavia und bete darum, dass sie im Glauben und in leiblicher wie geistlicher Liebe gefestigt wird.[b] Ich grüße Alke, einen mir sehr lieben Namen,[c] den unvergleichlichen Daphnus und Euteknus sowie alle einzeln mit Namen. Lebt wohl in der Gnade Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung »Jungfrauen, die Witwen genannt werden« ist ungewöhnlich. Ob »Witwen« hier einen besonderen kirchlichen Stand bezeichnet, bleibt offen.
    reason: Die historische und semantische Unklarheit wird sichtbar gehalten, ohne den Ausdruck konfessionell festzulegen.
  - marker: b
    text: Die griechischen Adjektive entsprechen »leiblich« und »geistlich« und beziehen sich grammatisch auf die Liebe. »Leiblich« ist hier nicht wertend gemeint.
    reason: Sichert die syntaktische Zuordnung und vermeidet eine modern missverständliche negative Konnotation von »fleischlich«.
  - marker: c
    text: 'Wörtlich: »Alke, einen mir sehr lieben Namen«. Wahrscheinlich ist die Trägerin dieses Namens liebevoll gemeint.'
    reason: Die auffällige Ausdrucksweise wird quellennahe beibehalten und knapp erläutert.
lexical_decisions:
- source_word: households
  choice: Hausgemeinschaften / Hausgemeinschaft
  rationale: Gibt den antiken Haushalt einschließlich der zugehörigen Personen natürlicher und weiter wieder als das bloße Gebäude »Haus«.
- source_word: brethren
  choice: Brüder
  rationale: Bewahrt die frühchristliche Anrede und den im Zeugen ausdrücklich genannten Bezug auf deren Frauen und Kinder.
- source_word: virgins who are called widows
  choice: Jungfrauen, die Witwen genannt werden
  rationale: Bewahrt die auffällige und möglicherweise amtlich-asketische Bezeichnung, ohne sie deutend aufzulösen.
- source_word: in the power of the Father
  choice: in der Kraft des Vaters
  rationale: Formnahe, im Deutschen verständliche Wiedergabe der Abschiedsformel.
- source_word: grounded
  choice: gefestigt
  rationale: Natürliches modernes Deutsch, das den Gedanken eines festen Fundaments bewahrt.
- source_word: both of flesh and of spirit
  choice: dem Leib wie dem Geist nach
  rationale: Bewahrt die doppelte Zuordnung, vermeidet jedoch im Deutschen die missverständliche Vorstellung von »Liebe des Fleisches«.
- source_word: all by name
  choice: alle Einzelnen
  rationale: Bringt zum Ausdruck, dass Ignatius jeden persönlich beziehungsweise namentlich grüßt, ohne nicht überlieferte Namen zu ergänzen.
theological_decisions:
- issue: Status der »Jungfrauen, die Witwen genannt werden«
  choice: Die ungewöhnliche Benennung wird wörtlich beibehalten.
  alternative: »die als Witwen bezeichneten Jungfrauen« oder eine Erklärung als kirchlicher Witwenstand
  rationale: Der Quellenzeuge lässt offen, ob »Witwen« eine Amts-, Standes- oder Ehrenbezeichnung ist; diese Spannung darf nicht konfessionell oder historisch voreilig aufgelöst werden.
- issue: Bezug von »sie« im Gebet um Festigung
  choice: Das feminine Singularpronomen bezieht sich auf Tavia.
  alternative: Bezug auf die Hausgemeinschaft Tavias
  rationale: Die grammatische Gestalt des englischen Quellenzeugen legt Tavia nahe, doch der weitere Kontext bleibt knapp; die Übersetzung folgt der bezeugten Syntax.
- issue: »Leib/Fleisch und Geist«
  choice: »dem Leib wie dem Geist nach«
  alternative: »in fleischlicher und geistlicher Liebe«
  rationale: Die gewählte Form wahrt die anthropologische Doppelperspektive, ohne »fleischlich« moralisch negativ zu färben oder zwei verschiedene Arten von Liebe dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Briefton. Namen werden in geläufiger deutscher Umschrift wiedergegeben. Da die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht, vermeidet der Entwurf unbelegte Präzisierungen und kennzeichnet besonders unsichere Stellen durch Fußnoten.
