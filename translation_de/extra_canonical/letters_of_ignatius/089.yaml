  naturalness: Der Text hat einen würdigen, modernen Briefton. „Hausgemeinschaften“ ist möglich, aber „Häuser“ ist in diesem brieflichen Kontext die näherliegende und idiomatisch unauffällige Wiedergabe für Haushalte. Die ungewöhnliche Namensformel zu Alke soll bewusst markiert bleiben.
  terminology: '„Jungfrauen, die Witwen genannt werden“, „Kraft des Vaters“, „Glauben“ und „Gnade Gottes“ sind sachgerecht. Für σαρκικός ist hier „leiblich“ vorzuziehen: Es wahrt den körperlichen Bezug ohne die im heutigen Deutsch häufig wertende Nebenbedeutung von „fleischlich“.'
