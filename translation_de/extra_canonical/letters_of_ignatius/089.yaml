  to: 'Ich grüße die Häuser meiner Brüder mit ihren Frauen und Kindern sowie die Jungfrauen, die Witwen genannt werden.[a] Lebt wohl in der Kraft des Vaters. Philo, der bei mir ist, grüßt euch.


