base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: de
  text: 'Was aber Philo betrifft, den Diakon aus Kilikien, einen Mann mit gutem Ruf, der mir nun zusammen mit Rhaius Agathopus im Wort Gottes dient: Dieser Auserwählte folgt mir aus Syrien, nachdem er dem gegenwärtigen Leben Lebewohl gesagt hat. Auch sie legen für euch Zeugnis ab. Ich selbst danke Gott für euch, weil ihr sie aufgenommen habt, wie, so hoffe ich, der Herr auch euch aufnehmen wird. Mögen aber diejenigen, die sie verächtlich behandelt haben, durch die Gnade Jesu Christi erlöst werden.


    Die Liebe der Geschwister in Troas grüßt euch. Von dort schreibe ich euch auch durch Burrhus, den die Epheser und Smyrnäer mir als Ehrenerweis mitgesandt haben. Der Herr Jesus Christus wird sie ehren. Auf ihn setzen sie ihre Hoffnung an Leib, Seele und Geist, durch Glauben, Liebe und Eintracht. Lebt wohl in Christus Jesus, unserer gemeinsamen Hoffnung.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deacon
  choice: Diakon
  rationale: Die etablierte deutsche Amtsbezeichnung bewahrt den frühchristlichen Kontext, ohne die Funktion genauer festzulegen, als es die vorliegende Zeugengrundlage erlaubt.
- source_word: in the word of God
  choice: im Wort Gottes
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Bedeutung als Verkündigungs- oder Evangeliumsdienst.
- source_word: elect one
  choice: Auserwählte
  rationale: Bewahrt die religiöse Prägung und die mögliche formelle Auszeichnung des Ausdrucks.
- source_word: received
  choice: aufgenommen
  rationale: Passt sowohl zur gastfreundlichen Aufnahme der Gesandten als auch zur parallelen erhofften Aufnahme durch den Herrn.
- source_word: redeemed
  choice: erlöst
  rationale: Bewahrt die starke soteriologische Aussage des Zeugnisses, statt sie zu einem bloßen Wunsch nach Vergebung abzuschwächen.
- source_word: flesh and soul and spirit
  choice: Leib, Seele und Geist
  rationale: Natürliches modernes Deutsch; die dreigliedrige anthropologische Formulierung bleibt erhalten, ohne daraus ein Lehrsystem abzuleiten.
- source_word: concord
  choice: Eintracht
  rationale: Gibt die gemeinschaftliche Harmonie würdig und verständlich wieder.
theological_decisions:
- issue: Bezug von „having bidden farewell to this present life“
  choice: Der Satz wird an Rhaius Agathopus angeschlossen und als Lossagung vom gegenwärtigen Leben formuliert.
  alternative: Die Wendung könnte allgemeiner als Verzicht auf das weltliche Leben oder als Bereitschaft zum Tod verstanden und entsprechend freier wiedergegeben werden.
  rationale: Die vorliegende englische Zeugengrundlage ordnet die Wendung grammatisch Rhaius zu; die Übersetzung bewahrt die bildhafte und theologisch offene Formulierung.
- issue: Wer in „the Lord shall honor them, even Jesus Christ“ handelt
  choice: „Der Herr Jesus Christus wird sie ehren.“
  alternative: „Der Herr wird sie ehren – Jesus Christus ...“ oder eine Lesart, in der Jesus Christus näher zur Hoffnungsaussage gehört.
  rationale: Die Apposition wird im Deutschen natürlich zusammengeführt, ohne die Identifikation des Herrn mit Jesus Christus abzuschwächen.
- issue: Anthropologische Dreierformel
  choice: „an Leib, Seele und Geist“ bleibt vollständig erhalten.
  alternative: Idiomatistische Zusammenfassung wie „mit ihrem ganzen Sein“.
  rationale: Die Dreigliederung kann theologisch bedeutsam sein; sie wird nicht harmonisiert oder systematisch ausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Briefcharakter. Da eine direkte Prüfung des griechischen Textes der mittleren Rezension ausdrücklich noch aussteht, ist der Entwurf anhand des angegebenen gemeinfreien englischen Zeugnisses und der auditierten POB-Konsultationsschicht erstellt. Eigennamen folgen der gelieferten Form; syntaktische Mehrdeutigkeiten wurden möglichst bewahrt und nicht konfessionell aufgelöst.
