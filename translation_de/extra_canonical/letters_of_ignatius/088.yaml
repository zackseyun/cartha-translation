base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: de
  text: 'Die Liebe der Geschwister in Troas grüßt euch. Von dort schreibe ich euch auch durch Burrhus, den ihr zusammen mit euren Geschwistern, den Ephesern, als meinen Begleiter gesandt habt. Er hat mich in jeder Hinsicht erquickt. Ich wünschte, alle würden seinem Beispiel folgen; denn er ist ein Vorbild im Dienst Gottes. Die göttliche Gnade wird es ihm in allem vergelten.


    Ich grüße euren gottgefälligen Bischof, euren ehrwürdigen Ältestenrat [und][a] die Diakone, meine Mitknechte, ebenso euch alle, jeden Einzelnen und die ganze Gemeinde, im Namen Jesu Christi, in seinem Fleisch und Blut, in seinem Leiden und seiner Auferstehung, die leiblich und geistlich war,[b] in der Einheit Gottes und in eurer Einheit. Gnade, Erbarmen, Friede und Geduld seien immer mit euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „und“ ist im zugrunde liegenden englischen Text als ergänzte Lesart gekennzeichnet. Eine unmittelbare Prüfung des griechischen Textes steht noch aus.
    reason: Bewahrt das überlieferte Signal einer textkritischen beziehungsweise editorischen Ergänzung.
  - marker: b
    text: Der überlieferte Wortlaut kann möglicherweise auch so verstanden werden, dass „leiblich und geistlich“ sich auf Leiden und Auferstehung gemeinsam bezieht. Die direkte Prüfung der griechischen Überlieferung steht noch aus.
    reason: Macht die syntaktische und theologische Mehrdeutigkeit transparent, ohne sie im Haupttext zu überladen.
lexical_decisions:
- source_word: love of the brethren
  choice: Liebe der Geschwister
  rationale: Gibt die gemeinschaftliche Anrede in natürlichem modernem Deutsch wieder, ohne sie auf männliche Mitglieder zu beschränken.
- source_word: by the hand of Burrhus
  choice: durch Burrhus
  rationale: Die Wendung bezeichnet Burrhus als Überbringer beziehungsweise Vermittler des Schreibens; eine wörtliche Wiedergabe mit „durch die Hand“ wäre im heutigen Deutsch missverständlich.
- source_word: presbytery
  choice: Ältestenrat
  rationale: Bezeichnet hier das Kollegium der Presbyter und ist für heutige Leser verständlicher als das kirchengeschichtlich stärker vorgeprägte „Presbyterium“.
- source_word: ministry of God
  choice: Dienst Gottes
  rationale: Bewahrt die mögliche Beziehung des Dienstes zu Gott, ohne enger festzulegen, ob Gott Ursprung, Gegenstand oder Auftraggeber dieses Dienstes ist.
- source_word: patience
  choice: Geduld
  rationale: Entspricht dem überlieferten englischen Zeugnis und bewahrt die eigenständige Tugend im abschließenden Segenswunsch.
theological_decisions:
- issue: Leibliche und geistliche Auferstehung
  choice: „in seinem Leiden und seiner Auferstehung, die leiblich und geistlich war“
  alternative: „in seinem leiblichen und geistlichen Leiden und seiner leiblichen und geistlichen Auferstehung“
  rationale: Die grammatische Reichweite der beiden Adjektive ist im vorliegenden Zeugnis nicht völlig eindeutig. Die gewählte Fassung folgt dessen nächstem Bezug zur Auferstehung und markiert die Spannung in einer Fußnote, statt sie dogmatisch aufzulösen.
- issue: Einheit Gottes und der Gemeinde
  choice: „in der Einheit Gottes und in eurer Einheit“
  alternative: „in der Einheit mit Gott und miteinander“
  rationale: Die formalere Fassung bewahrt die Genitivbeziehungen und vermeidet es, „Einheit Gottes“ stillschweigend als Einheit mit Gott umzudeuten.
- issue: Fleisch und Blut Christi
  choice: „in seinem Fleisch und Blut“
  alternative: „durch seinen Leib und sein Blut“
  rationale: Die Präposition und die konkrete frühchristologische Ausdrucksweise werden bewahrt; eine sakramentale oder rein metaphorische Deutung wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Briefcharakter. Die Anrede „euch“ bleibt dem pluralischen Originalregister entsprechend erhalten. Da keine griechische Textgestalt mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf bewusst eng am öffentlichen englischen Zeugen gehalten; unsichere Ergänzungen und syntaktische Mehrdeutigkeiten werden offengelegt.
