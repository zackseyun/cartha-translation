review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen zuverlässig. Die Formulierung „als meinen Begleiter gesandt“ fügt jedoch gegenüber „whom ye sent with me“ eine spezifischere Rollenbestimmung hinzu. Ferner legt „die leiblich und geistlich war“ durch den femininen Singular die Aussage allein auf die Auferstehung fest, obwohl der englische Zeuge die syntaktische Reichweite nicht eindeutig ausweist.
  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „jeden Einzelnen und die ganze Gemeinde“ ist allerdings weniger nah an „severally and in a body“ und führt „Gemeinde“ als nicht ausdrücklich vorhandene Bezeichnung ein. „jeden einzelnen und gemeinsam“ ist zugleich natürlicher und genauer.
  terminology: „Geschwister“, „Bischof“, „Ältestenrat“ und „Diakone“ sind angemessen. „Mitknechte“ gibt „fellow-servants“ zwar traditionsnah wieder, klingt aber unnötig altertümlich; „Mitdiener“ bewahrt den Dienstcharakter in modernerer Sprache. Die textkritische Markierung von [und] muss erhalten bleiben.
  issues:
  - severity: medium
    issue: Zusatz in „als meinen Begleiter gesandt“
    rationale: Der englische Zeuge bezeichnet Burrhus als jemanden, den die Adressaten „mit mir“ und gemeinsam mit den ephesischen Geschwistern gesandt haben; „als meinen Begleiter“ interpretiert seine Funktion enger als der vorliegende Wortlaut.
  - severity: medium
    issue: Eindeutige Zuordnung von „leiblich und geistlich“ zur Auferstehung
    rationale: Die Form „die ... war“ bezieht sich im Deutschen zwangsläufig auf „Auferstehung“. Der vorliegende Zeuge lässt jedoch offen, ob die Charakterisierung nur die Auferstehung oder Leiden und Auferstehung zusammen betrifft. Die Anmerkung korrigiert diese Festlegung nicht vollständig.
  - severity: low
    issue: „die ganze Gemeinde“ für „in a body“
    rationale: „Gemeinde“ ist hier eine zusätzliche institutionelle bzw. gruppenbezogene Benennung. „Gemeinsam“ gibt den Gegensatz zu „jeden einzelnen“ ohne Zusatz wieder.
  revised_text: 'Die Liebe der Geschwister in Troas grüßt euch. Von dort schreibe ich euch auch durch Burrhus, den ihr gemeinsam mit euren Geschwistern, den Ephesern, mit mir gesandt habt. Er hat mich in jeder Hinsicht erquickt. Ich wünschte, alle würden seinem Beispiel folgen; denn er ist ein Vorbild im Dienst Gottes. Die göttliche Gnade wird es ihm in allem vergelten.


    Ich grüße euren gottgefälligen Bischof, euren ehrwürdigen Ältestenrat [und][a] die Diakone, meine Mitdiener, ebenso euch alle, jeden einzelnen und gemeinsam, im Namen Jesu Christi und in seinem Fleisch und Blut, in seinem Leiden und seiner Auferstehung, leiblich und geistlich,[b] in der Einheit Gottes und in eurer Einheit. Gnade, Erbarmen, Friede und Geduld seien immer mit euch.'
  revised_footnotes:
  - marker: a
    text: Das „und“ ist im zugrunde liegenden englischen Text als ergänzte Lesart gekennzeichnet. Eine unmittelbare Prüfung des griechischen Textes steht noch aus.
    reason: Bewahrt das überlieferte Signal einer textkritischen beziehungsweise editorischen Ergänzung.
  - marker: b
    text: 'Die syntaktische Reichweite von „leiblich und geistlich“ ist im überlieferten Wortlaut nicht eindeutig: Die Worte können sich auf die Auferstehung allein oder auf Leiden und Auferstehung zusammen beziehen. Die direkte Prüfung der griechischen Überlieferung steht noch aus.'
    reason: Bewahrt die im englischen Zeugen vorhandene Mehrdeutigkeit, ohne eine christologische Deutung festzulegen.
  revision_rationale: Die Überarbeitung entfernt eine nicht ausdrücklich bezeugte Einengung von Burrhus’ Rolle, vermeidet die zusätzliche Bezeichnung „Gemeinde“ und gestaltet die Aussage „leiblich und geistlich“ so, dass ihre unsichere syntaktische Reichweite nicht im deutschen Haupttext vorentschieden wird. Die eckig markierte Ergänzung und ihre Fußnote bleiben erhalten.
