base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: de
  text: 'Mein Geist ist wie Unrat um des Kreuzes willen[a]. Für die Ungläubigen ist es ein Anstoß, für uns aber Rettung und ewiges Leben. Wo ist der Weise? Wo ist der Wortstreiter? Wo bleibt das Rühmen derer, die als verständig gelten?


    Denn unser Gott, Jesus, der Christus, wurde nach Gottes Heilsordnung[b] von Maria im Mutterleib empfangen: aus dem Samen Davids und zugleich aus dem Heiligen Geist. Er wurde geboren und ließ sich taufen, damit er durch sein Leiden das Wasser reinigte[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bzw. sinngemäß steht hier ein drastischer Ausdruck für Kehricht, Abfall oder den Auswurf, der für etwas hingegeben wird. Die genaue Wiedergabe ist bei der noch ausstehenden Prüfung des griechischen Textes zu bestätigen.
    reason: Die Vorlage beruht ausdrücklich auf einem englischen Zeugen; der seltene und bildhafte Ausgangsausdruck verlangt Transparenz.
  - marker: b
    text: Das zugrunde liegende Wort kann eine Ordnung, einen Plan oder Gottes heilsgeschichtliches Handeln bezeichnen.
    reason: „Heilsordnung“ ist erklärungsbedürftig und darf nicht mit einem späteren theologischen System gleichgesetzt werden.
  - marker: c
    text: Gemeint ist offenbar, dass Christus durch seine Taufe und sein Leiden dem Wasser eine reinigende Bedeutung oder Wirkung gab; der knappe Satz lässt das genaue Verhältnis offen.
    reason: Bewahrt die Mehrdeutigkeit der ungewöhnlichen Aussage, statt eine bestimmte Tauftheologie festzuschreiben.
lexical_decisions:
- source_word: περίψημα (as reflected by “offscouring” in the witness)
  choice: wie Unrat
  rationale: Bewahrt die drastische Selbsterniedrigung des Ausdrucks in verständlichem modernem Deutsch; die genaue griechische Lesart ist noch direkt zu prüfen.
- source_word: σκάνδαλον (as reflected by “stumbling-block”)
  choice: Anstoß
  rationale: Gibt das paulinisch geprägte Bild idiomatisch wieder, ohne es zu einer bloßen Beleidigung abzuschwächen.
- source_word: συζητητής (as reflected by “disputer”)
  choice: Wortstreiter
  rationale: Erhält die rhetorische Anspielung auf 1 Kor 1,20 und bezeichnet jemanden, der sich in gelehrter Auseinandersetzung hervortut.
- source_word: οἰκονομία (as reflected by “dispensation”)
  choice: Gottes Heilsordnung
  rationale: Macht den Sinn eines göttlichen Plans oder geordneten Heilshandelns verständlich, ohne eine spätere dispensationalistische Bedeutung einzutragen.
- source_word: σπέρμα Δαυίδ (as reflected by “seed of David”)
  choice: Samen Davids
  rationale: Bewahrt das biblische Abstammungsbild und dessen christologische Resonanz.
- source_word: πάθος (as reflected by “passion”)
  choice: Leiden
  rationale: Im Kontext bezeichnet der Ausdruck Jesu Leiden, nicht allgemein Leidenschaft.
theological_decisions:
- issue: Bezeichnung Jesu als Gott
  choice: „unser Gott, Jesus, der Christus“
  alternative: „Jesus Christus, unser Gott“
  rationale: Folgt der im überlieferten Zeugnis sichtbaren Syntax und bewahrt die ausdrückliche hohe Christologie, ohne sie abzuschwächen.
- issue: Empfängnis aus davidischer Abstammung und Heiligem Geist
  choice: „aus dem Samen Davids und zugleich aus dem Heiligen Geist“
  alternative: „vom Geschlecht Davids, aber durch den Heiligen Geist“
  rationale: Bewahrt die ungewöhnliche parallele Formulierung und löst das Verhältnis biologischer Abstammung und Geistwirkung nicht stillschweigend auf.
- issue: Wirkung von Taufe und Leiden auf das Wasser
  choice: „damit er durch sein Leiden das Wasser reinigte“
  alternative: „damit er das Wasser reinigte, indem er litt“
  rationale: Erhält die theologisch spannungsreiche Kausalverknüpfung des Zeugnisses, ohne sie sakramental weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhetorischer Kraft. Die Vorlage ist nur ein gemeinfreier englischer Übersetzungszeuge der griechischen mittleren Rezension; alle Entscheidungen, besonders zu „Unrat“, „Heilsordnung“ und „reinigte das Wasser“, bleiben bis zur direkten griechischen Quellenprüfung vorläufig.
