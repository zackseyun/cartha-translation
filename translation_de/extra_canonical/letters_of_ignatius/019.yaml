review_pass:
  verdict: revise
  source_fidelity: Die Überarbeitung folgt dem griechisch bezeugten Wortlaut, soweit er im bereitgestellten Zeugen erkennbar ist. „Um des Kreuzes willen“ gibt den Genitiv bei „offscouring of the Cross“ als Grundangabe wieder und verändert dadurch die Beziehung; „Auswurf des Kreuzes“ bewahrt sie bewusst offen. „gemäß einer Heilsordnung“ vermeidet den nicht ausdrücklich im Satz stehenden Zusatz „Gottes“. Der finalen Konstruktion entspricht im Deutschen „damit ... reinige“ besser als das indikativische Präteritum „reinigte“.
  naturalness: Der Text bleibt modernes, würdiges Standarddeutsch. „Auswurf des Kreuzes“ ist absichtlich bildhaft und ungewohnt, weil auch der Ausgangsausdruck drastisch und semantisch nicht völlig eindeutig ist; die Fußnote erläutert dies. Die übrigen Formulierungen sind idiomatisch und erhalten die rhetorischen Fragen.
  terminology: „Anstoß“, „Wortstreiter“, „Heilsordnung“, „Samen Davids“, „Heiliger Geist“ und „Leiden“ sind sachgerecht. Die hoheitliche Bezeichnung „unser Gott, Jesus, der Christus“ bleibt unverändert. Die Formulierung zur Reinigung des Wassers wird nicht konfessionell ausgelegt.
  issues:
  - severity: medium
    issue: „wie Unrat um des Kreuzes willen“
    rationale: Die Vergleichsform („wie“) und besonders die Kausalformel „um ... willen“ stehen nicht im bezeugten Ausdruck „offscouring of the Cross“ und legen dessen Genitivbeziehung einseitig aus.
  - severity: medium
    issue: „nach Gottes Heilsordnung“
    rationale: Der bereitgestellte Wortlaut sagt nur „according to a dispensation“. „Gottes“ ist als Deutung naheliegend, aber nicht ausdrücklich Teil der Formulierung und sollte nicht in den Übersetzungstext eingefügt werden.
  - severity: medium
    issue: „damit er ... das Wasser reinigte“
    rationale: Nach „damit“ verlangt die deutsche Wiedergabe der Zweckbestimmung den Konjunktiv („reinige“). Das Präteritum stellt die Reinigung unnötig als bloß abgeschlossene Erzählhandlung dar.
  revised_text: 'Mein Geist ist ein Auswurf des Kreuzes[a]. Für die Ungläubigen ist es ein Anstoß, für uns aber Rettung und ewiges Leben. Wo ist der Weise? Wo ist der Wortstreiter? Wo ist das Rühmen derer, die verständig genannt werden?


    Denn unser Gott, Jesus, der Christus, wurde gemäß einer Heilsordnung[b] im Mutterleib Marias empfangen: aus dem Samen Davids, aber auch aus dem Heiligen Geist. Er wurde geboren und ließ sich taufen, damit er durch sein Leiden das Wasser reinige[c].'
  revised_footnotes:
  - marker: a
    text: Der zugrunde liegende drastische Ausdruck kann Kehricht, Auswurf oder einen verachteten Menschen bezeichnen. Die Beziehung „des Kreuzes“ wird im knappen griechischen Ausdruck nicht weiter erklärt.
    reason: Bewahrt die bildhafte Härte und die nicht näher bestimmte Genitivbeziehung, ohne sie zu einer Aussage „um des Kreuzes willen“ umzudeuten.
  - marker: b
    text: Das zugrunde liegende Wort kann eine Ordnung, einen Plan oder ein geordnetes Heilshandeln bezeichnen.
    reason: „Heilsordnung“ ist erklärungsbedürftig; die Fußnote vermeidet, den Ausdruck mit einem späteren theologischen System gleichzusetzen.
  - marker: c
    text: Der knappe Satz verbindet Jesu Leiden mit der Reinigung des Wassers, ohne das genaue Verhältnis dieser Aussage näher zu bestimmen.
    reason: Bewahrt die ungewöhnliche Formulierung, ohne eine bestimmte Tauf- oder Sakramentstheologie festzuschreiben.
  revision_rationale: 'Die Revision beseitigt drei vermeidbare Sinnverschiebungen: die kausale Umdeutung des Kreuzesgenitivs, den Zusatz „Gottes“ bei „Heilsordnung“ und den nicht finalen deutschen Satzschluss. Sie wahrt zugleich die prägnante, hohe Christologie sowie die absichtlich nicht aufgelöste Aussage über das Wasser.'
