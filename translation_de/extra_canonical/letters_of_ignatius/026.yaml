revisions:
- from: 'Ja, auch euch steht es gut an, die Jugend eures Bischofs nicht auszunutzen, sondern ihm gemäß der Macht Gottes, des Vaters, jede Ehrerbietung zu erweisen. Wie ich erfahren habe, haben auch die heiligen Ältesten seinen augenscheinlich jugendlichen Stand nicht zum Anlass genommen, sondern räumen ihm seinen Platz ein wie einem, der in Gott verständig ist — doch nicht ihm, sondern dem Vater Jesu Christi, dem Bischof aller.


    Zur Ehre dessen, der euch gewollt hat,[a] steht es euch daher gut an, ohne Heuchelei zu gehorchen. Denn wer diesen sichtbaren Bischof täuscht, hintergeht vielmehr den Unsichtbaren.[b] Bei einem solchen Tun hat man es nicht mit Fleisch zu tun, sondern mit Gott, der das Verborgene kennt.'
