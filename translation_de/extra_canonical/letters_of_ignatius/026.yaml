  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: de
  text: 'Ja, auch euch ziemt es, euch die Jugend eures Bischofs nicht zunutze zu machen, sondern ihm entsprechend der Macht Gottes, des Vaters, jede Ehrerbietung zu erweisen. Wie ich erfahren habe, haben auch die heiligen Ältesten seinen offenbar jugendlichen Stand nicht ausgenutzt, sondern sich ihm gefügt, als einem, der in Gott weise ist — vielmehr nicht ihm, sondern dem Vater Jesu Christi, dem Bischof aller.



    Zur Ehre dessen, der euch gewollt hat,[a] ziemt es euch daher, ohne Heuchelei zu gehorchen. Denn man täuscht nicht so sehr diesen sichtbaren Bischof, als vielmehr den Unsichtbaren hintergeht.[b] In einem solchen Fall hat man nicht Fleisch, sondern Gott Rechenschaft abzulegen, der das Verborgene kennt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der euch erwählt hat“. Der Ausdruck lässt sowohl seine genaue Bedeutung als auch den unmittelbaren Bezug offen.'
    reason: Bewahrt die im Ausgangstext vorhandene Mehrdeutigkeit, statt sie im Haupttext dogmatisch festzulegen.
  - marker: b
    text: 'Die Formulierung steigert den Gedanken: Wer den sichtbaren Bischof täuscht, richtet sein Handeln letztlich gegen den unsichtbaren Gott und hat ihm Rechenschaft abzulegen.'
    reason: Erläutert die rhetorische Gegenüberstellung und den im folgenden Satz ausdrücklich genannten Rechenschaftsgedanken, ohne eine unsichere Rückübersetzung als wörtlich auszugeben.
lexical_decisions:
- source_word: συγχρῆσθαι τῇ ἡλικίᾳ
  choice: die Jugend … nicht auszunutzen
  rationale: Gibt die Warnung wieder, aus dem jungen Alter des Bischofs keinen Vorteil zu ziehen oder ihn deshalb unangemessen zu behandeln.
- source_word: κατὰ δύναμιν θεοῦ πατρός
  choice: gemäß der Macht Gottes, des Vaters
  rationale: Bewahrt die formale und theologisch offene Beziehung zwischen der Ehrerbietung gegenüber dem Bischof und der Macht Gottes des Vaters.
- source_word: πᾶσαν ἐντροπὴν
  choice: jede Ehrerbietung
  rationale: Bezeichnet respektvolle Scheu beziehungsweise Achtung; „Ehrerbietung“ trifft den würdigen Kontext ohne übermäßige Sakralisierung.
- source_word: πρεσβυτέρους
  choice: Ältesten
  rationale: Verwendet die verständliche kirchliche Amtsbezeichnung und vermeidet die konfessionell enger wirkende Wiedergabe „Priester“.
- source_word: φαινομένην νεωτερικὴν τάξιν
  choice: augenscheinlich jugendlichen Stand
  rationale: Bewahrt sowohl das Moment des sichtbaren jungen Alters als auch die schwer eindeutig zu bestimmende Bedeutung von τάξις als Stand oder Stellung.
- source_word: φρονίμῳ ἐν θεῷ
  choice: einem, der in Gott verständig ist
  rationale: Erhält die ungewöhnliche Verbindung „in Gott“ und glättet sie nicht zu einer bloß allgemeinen menschlichen Klugheit.
- source_word: ἀνυποκρίτως
  choice: ohne Heuchelei
  rationale: Gibt den Gedanken ungeheuchelten, aufrichtigen Gehorsams direkt wieder.
- source_word: τὰ κρύφια
  choice: das Verborgene
  rationale: Natürliche deutsche Wiedergabe für die verborgenen Dinge beziehungsweise Geheimnisse, die Gott kennt.
theological_decisions:
- issue: Gott als „Bischof aller“
  choice: dem Vater Jesu Christi, dem Bischof aller
  alternative: dem Vater Jesu Christi, dem Aufseher über alle
  rationale: Erhält Ignatius’ bewusstes Wortspiel zwischen dem sichtbaren kirchlichen Bischof und Gott als dem höchsten, unsichtbaren Bischof.
- issue: Identität dessen, „der euch gewollt hat“
  choice: dessen, der euch gewollt hat
  alternative: dessen, der euch erwählt hat
  rationale: Die Formulierung bewahrt die semantische und referenzielle Offenheit des Ausdrucks, statt seine Bedeutung oder seinen Bezug stillschweigend festzulegen.
- issue: Täuschung des sichtbaren und unsichtbaren Bischofs
  choice: wer diesen sichtbaren Bischof täuscht, hintergeht vielmehr den Unsichtbaren
  alternative: man täuscht nicht so sehr den sichtbaren Bischof, sondern betrügt den unsichtbaren
  rationale: 'Bewahrt die theologische Zuspitzung: Täuschung gegenüber dem sichtbaren Amtsträger richtet sich letztlich gegen den unsichtbaren Gott, ohne beide gleichzusetzen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kirchengeschichtlich passender, aber allgemein verständlicher Amtssprache. Die Satzstruktur wurde maßvoll geglättet; markante Wiederholungen und theologische Spannungen bleiben erhalten. Wegen des Hinweises, dass die direkte griechische Quellenprüfung noch aussteht, ist der Text als publikationsnaher, jedoch quellenphilologisch nochmals zu prüfender Entwurf zu behandeln.
