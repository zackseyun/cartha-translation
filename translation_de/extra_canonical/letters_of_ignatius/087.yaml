base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: de
  text: 'Euer Gebet ist zur Gemeinde in Antiochia in Syrien gelangt. Von dort grüße ich als Gefangener in überaus gottwürdigen Fesseln alle. Ich bin es nicht wert, zu ihr zu gehören, denn ich bin der Letzte von ihnen. Nach dem göttlichen Willen wurde ich dieser Ehre gewürdigt – nicht aufgrund eines Verdienstes, dessen ich mir bewusst wäre,[a] sondern durch Gottes Gnade. Ich bete darum, dass sie mir in vollkommener Weise geschenkt wird, damit ich durch eure Gebete zu Gott gelange.[b]


    Damit nun euer Werk sowohl auf Erden als auch im Himmel vollendet wird, ist es angemessen, dass eure Gemeinde zur Ehre Gottes einen Gesandten Gottes bestimmt. Er soll bis nach Syrien reisen und ihnen dazu Glück wünschen, dass sie Frieden haben, ihre gebührende Größe wiedererlangt haben und ihre volle Gestalt wiederhergestellt worden ist.[c]


    Darum hielt ich es für angemessen, dass ihr einen aus eurer Mitte mit einem Brief entsendet. Er soll gemeinsam mit ihnen Gott für die Ruhe verherrlichen, die sie nach Gottes Willen erreicht hat, und dafür, dass sie durch eure Gebete bereits einen Hafen erreichten. Da ihr vollkommen seid, sollen auch eure Entschlüsse vollkommen sein. Denn wenn ihr das Gute tun wollt, ist Gott bereit, euch die Möglichkeit dazu zu geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der zugrunde liegende griechische Ausdruck ist knapp und mehrdeutig; möglich ist auch: »nicht durch mein eigenes Zutun« oder »nicht, weil ich mir dessen bewusst gewesen wäre«.'
    reason: Kennzeichnet eine echte lexikalische Unsicherheit, die im englischen Zeugen mit »not of my own complicity« nur schwer verständlich wiedergegeben ist.
  - marker: b
    text: 'Wörtlich sinngemäß: »damit ich Gott erreiche«; ob Ignatius dabei besonders an sein bevorstehendes Martyrium denkt, wird hier nicht ausdrücklich gesagt.'
    reason: Bewahrt die theologische Offenheit der ignatianischen Wendung.
  - marker: c
    text: Die bildhafte Formulierung bezeichnet offenbar die Wiederherstellung der Gemeinde nach einer Zeit der Unruhe. Die genaue Gestalt der beiden parallelen Ausdrücke sollte noch unmittelbar anhand der griechischen Überlieferung geprüft werden.
    reason: Die bereitgestellten Angaben erklären die griechische Quellenprüfung ausdrücklich als noch ausstehend; die englischen Ausdrücke »proper stature« und »proper fullness/bulk« lassen mehrere deutsche Wiedergaben zu.
lexical_decisions:
- source_word: θεοπρεπεστάτοις δεσμοῖς
  choice: in überaus gottwürdigen Fesseln
  rationale: Bewahrt die auffällige sakrale Wertung der Gefangenschaft, ohne sie als bloß subjektiv »Gott wohlgefällig« auszudeuten.
- source_word: ἐκ συνειδότος
  choice: aufgrund eines Verdienstes, dessen ich mir bewusst wäre
  rationale: Der schwer verständliche Ausdruck wird im Sinn bewusster eigener Würdigkeit wiedergegeben; eine Fußnote weist auf die Unsicherheit hin.
- source_word: θεοπρεσβευτήν
  choice: einen Gesandten Gottes
  rationale: Erhält das theologisch geprägte Wortspiel beziehungsweise die Amtsbezeichnung des Ausgangstextes.
- source_word: εἰς θεὸν ἐπιτυχεῖν
  choice: zu Gott gelange
  rationale: Bewahrt Ignatius’ prägnante Zielaussage, ohne sie ausdrücklich als Tod, Martyrium oder Heil auszulegen.
- source_word: γαλήνη
  choice: Ruhe
  rationale: Gibt das Bild der Windstille beziehungsweise der beendeten Unruhe wieder und passt zum anschließenden Hafenbild.
- source_word: λιμήν
  choice: Hafen
  rationale: Erhält die maritime Metaphorik des Abschnitts.
theological_decisions:
- issue: Bedeutung des Gelangens zu Gott
  choice: damit ich … zu Gott gelange
  alternative: damit ich das Martyrium erlange und so zu Gott komme
  rationale: Der Text nennt das Martyrium hier nicht ausdrücklich; die offene eschatologische und biografische Spannung bleibt erhalten.
- issue: Grund von Ignatius’ Würdigung
  choice: nicht aufgrund eines Verdienstes, dessen ich mir bewusst wäre
  alternative: nicht durch mein eigenes Zutun
  rationale: Die gewählte Formulierung vermeidet sowohl eine Behauptung völliger Passivität als auch eine konfessionell aufgeladene Lehre über Verdienst und Gnade.
- issue: Vollkommenheit der Adressaten
  choice: Da ihr vollkommen seid
  alternative: Da ihr reif seid
  rationale: Die starke Aussage des Zeugnisses wird nicht abgeschwächt; zugleich wird sie nicht als dogmatische Behauptung sündloser Vollkommenheit erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Syntax und erhaltener frühchristlicher Bildsprache. Die Anrede steht durchgehend im Plural »ihr/euer«. Der Entwurf berücksichtigt rekonstruierbare griechische Wendungen, bleibt wegen der laut Datensatz noch ausstehenden direkten Prüfung der mittelrezensionellen griechischen Überlieferung jedoch besonders bei [a] und [c] vorläufig.
