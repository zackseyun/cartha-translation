review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung nötig. Der Entwurf trifft den Grundgedanken, schwächt jedoch mehrfach konkrete Bilder und Ausdrücke ab: Das Gebet „eilte voraus“, die Windstille „kam über sie“, und neben der wiedergewonnenen Größe ist ausdrücklich ihr „eigener Leib/Körper“ wiederhergestellt. „Volle Gestalt“ ist dafür keine hinreichend genaue Wiedergabe. „Gebührende Größe“ fügt zudem eine nicht ausgedrückte Wertung hinzu.'
  naturalness: 'Der Text ist überwiegend würdevoll und verständlich. Einige Formulierungen wirken jedoch unnötig interpretierend oder unpräzise: „dieser Ehre gewürdigt“, „Verdienst“ und „volle Gestalt“. Die Revision formuliert diese Stellen klarer, ohne den frühchristlichen Ton zu verlieren.'
  terminology: „gottwürdige Fesseln“, „Gesandter Gottes“, „zu Gott gelange“, „vollkommen“ und das Hafenbild sind angemessen. Für das wiederhergestellte σῶμα ist „Leib“ die sachnähere, zugleich im Gemeindekontext natürliche Wiedergabe. Die schwer deutbare Wendung ἐκ συνειδότος bleibt mit einer zurückhaltenden Fußnote offen.
  issues:
  - severity: medium
    issue: Die Wiedergabe von „proper stature“ und „proper bulk/body“ als „gebührende Größe“ und „volle Gestalt“ ist zu frei.
    rationale: Die griechisch bezeugten parallelen Begriffe sprechen von eigener/angestammter Größe und wiederhergestelltem eigenem Leib bzw. Körper. „Gebührend“ ist eine zusätzliche Wertung; „Gestalt“ verdeckt das konkrete σώμα-Bild.
  - severity: medium
    issue: „Nicht aufgrund eines Verdienstes, dessen ich mir bewusst wäre“ ist als Haupttext zu stark ausdeutend.
    rationale: ἐκ συνειδότος bezieht sich auf eigenes Bewusstsein bzw. eigenes Wissen/Zutun; „Verdienst“ ist nicht ausdrücklich gesagt und kann unnötige theologische Konnotationen erzeugen.
  - severity: low
    issue: Das Eilen des Gebets und das Über-die-Gemeinde-Kommen der Windstille sind abgeschwächt bzw. verschoben.
    rationale: ἀπέδραμεν lässt sich natürlich als „eilte voraus“ wiedergeben; die Windstille hat die Gemeinde erreicht bzw. ist über sie gekommen, nicht umgekehrt.
  - severity: low
    issue: „Ihre volle Gestalt wiederhergestellt worden ist“ ist syntaktisch und semantisch weniger klar als die körperliche Metapher des Ausgangstextes.
    rationale: „Ihr eigener Leib ist wiederhergestellt worden“ bewahrt Parallelismus und Bildsprache.
  revised_text: 'Euer Gebet eilte voraus zur Gemeinde in Antiochia in Syrien. Von dort her grüße ich als Gefangener in überaus gottwürdigen Fesseln alle, obwohl ich nicht würdig bin, zu ihr zu gehören, da ich der Letzte von ihnen bin. Nach Gottes Willen ist mir dies zuteilgeworden, nicht weil ich mir dessen selbst bewusst gewesen wäre,[a] sondern durch Gottes Gnade. Ich bete darum, dass sie mir in Vollkommenheit geschenkt werde, damit ich durch eure Gebete zu Gott gelange.[b]


    Damit nun euer Werk sowohl auf Erden als auch im Himmel vollendet werde, ist es angemessen, dass eure Gemeinde zur Ehre Gottes einen Gesandten Gottes bestimmt, der bis nach Syrien reist und sich mit ihnen darüber freut, dass sie Frieden haben, ihre eigene Größe wiedererlangt haben und ihr eigener Leib wiederhergestellt worden ist.


    Darum hielt ich es für angemessen, dass ihr einen aus eurer Mitte mit einem Brief entsendet, damit er gemeinsam mit ihnen Gott für die Windstille verherrliche, die nach Gottes Willen über sie gekommen ist, und dafür, dass sie durch eure Gebete bereits einen Hafen erreichen. Da ihr vollkommen seid, sollen auch eure Entschlüsse vollkommen sein. Denn wenn ihr das Gute tun wollt, ist Gott bereit, euch die Möglichkeit dazu zu geben.'
  revised_footnotes:
  - marker: a
    text: Der knappe Ausdruck kann auch „nicht aus eigenem Zutun“ oder „nicht aus eigenem Bewusstsein“ bedeuten. Er nennt nicht ausdrücklich eigenes Verdienst.
    reason: Bewahrt die lexikalische Offenheit von ἐκ συνειδότος und vermeidet eine im Haupttext nicht erforderliche Deutung als Verdienstlehre.
  - marker: b
    text: 'Wörtlich sinngemäß: „damit ich Gott erreiche“. Ob dabei besonders an Ignatius’ bevorstehendes Martyrium gedacht ist, wird hier nicht ausdrücklich gesagt.'
    reason: Die prägnante Zielaussage bleibt offen und wird nicht auf eine einzelne theologische oder biografische Deutung festgelegt.
  revision_rationale: Die Revision stellt die konkreten Bilder und den Parallelismus des Textes wieder her, insbesondere „eigene Größe“ und „eigener Leib“, und vermeidet interpretierende Zusätze zu Gottes Gnade und eigenem Verdienst. Die Fußnoten beschränken sich auf tatsächlich schwierige bzw. theologisch offen zu haltende Wendungen; eine Vorbehaltsnote zur bereits im Haupttext sicher wiedergegebenen Körpermetapher ist nicht erforderlich.
