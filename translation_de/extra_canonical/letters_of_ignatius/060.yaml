base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: de
  text: 'Der Herrscher dieser Welt will mich zerreißen und meine auf Gott gerichtete Gesinnung verderben. Darum soll keiner von euch Anwesenden ihm helfen. Stellt euch vielmehr auf meine Seite – das heißt: auf Gottes Seite. Redet nicht von Jesus Christus und begehrt zugleich die Welt. Lasst den Neid nicht bei euch heimisch werden.


    Selbst wenn ich euch, sobald ich bei euch bin, inständig bitten sollte, gehorcht mir nicht. Vertraut vielmehr dem, was ich euch schreibe. Denn ich schreibe euch, während ich lebe, und sehne mich doch nach dem Tod. Mein Begehren ist gekreuzigt, und in mir brennt kein Feuer eines irdischen Verlangens. In mir ist vielmehr lebendiges Wasser, das spricht und mir im Innern sagt: »Komm zum Vater!«


    Ich finde keine Freude an der vergänglichen Speise oder an den Genüssen dieses Lebens. Ich begehre das Brot Gottes: das Fleisch Jesu Christi, der aus dem Geschlecht Davids stammt. Und als Trank begehre ich sein Blut: unvergängliche Liebe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince/ruler of this world (Greek source review pending)
  choice: Herrscher dieser Welt
  rationale: Bewahrt die johanneisch geprägte Titulatur in natürlichem Deutsch, ohne den Bezug durch eine ausdrückliche Identifikation zu vereindeutigen.
- source_word: mind to Godward
  choice: meine auf Gott gerichtete Gesinnung
  rationale: Gibt sowohl die innere Haltung als auch ihre Ausrichtung auf Gott wieder; »Sinn« allein wäre im heutigen Deutsch weniger klar.
- source_word: lust/desire
  choice: Begehren
  rationale: Wahrt den starken und mehrdeutigen Ausdruck, ohne ihn ausschließlich sexuell zu verstehen. Das später folgende »sehne mich« wird kontextgerecht für das Verlangen nach dem Tod verwendet.
- source_word: fire of material longing
  choice: Feuer materiellen Verlangens
  rationale: Erhält die Spannung zwischen stofflich-weltlichem Verlangen und dem lebendigen Wasser; »materiell« folgt mangels abgeschlossener griechischer Prüfung vorsichtig dem Zeugen.
- source_word: food of corruption
  choice: vergängliche Speise
  rationale: Natürliches Deutsch, das den Gegensatz zur Unvergänglichkeit bewahrt; »Speise des Verderbens« könnte fälschlich moralische Verderbtheit statt Vergänglichkeit nahelegen.
- source_word: seed of David
  choice: Geschlecht Davids
  rationale: Gibt die genealogische Herkunft idiomatisch wieder und vermeidet den im modernen Deutsch missverständlichen Ausdruck »Same Davids«.
- source_word: love incorruptible
  choice: unvergängliche Liebe
  rationale: Bewahrt die knappe Gleichsetzung mit dem Blut Christi und löst ihre sakramentale beziehungsweise metaphorische Spannung nicht auf.
theological_decisions:
- issue: Ignatius fordert, einer möglichen späteren persönlichen Bitte nicht zu folgen.
  choice: 'Der scheinbare Widerspruch bleibt ausdrücklich stehen: »gehorcht mir nicht« und »vertraut ... dem, was ich euch schreibe«.'
  alternative: Die spätere Bitte als Bitte um Rettung oder Verhinderung des Martyriums ausdrücklich erläutern.
  rationale: Der überlieferte Text lässt die konkrete Bitte in diesem Abschnitt unausgesprochen; eine Ergänzung würde interpretierend eingreifen.
- issue: »Mein Begehren ist gekreuzigt«
  choice: Die Aussage wird wörtlich und ohne ausdrückliche Identifikation ihres Gegenstands wiedergegeben.
  alternative: »Meine weltlichen Begierden sind gekreuzigt« oder »Meine Liebe zur Welt ist gekreuzigt«.
  rationale: So bleiben die genuine Mehrdeutigkeit und die asketisch-theologische Spannung erhalten.
- issue: 'Lebendiges Wasser spricht im Innern: »Komm zum Vater!«'
  choice: Die personale Bildsprache wird beibehalten, ohne das Wasser ausdrücklich mit dem Heiligen Geist gleichzusetzen.
  alternative: »Der Heilige Geist, das lebendige Wasser, spricht ...«
  rationale: Eine solche Identifikation ist theologisch möglich, steht aber nicht ausdrücklich im vorliegenden Wortlaut.
- issue: Brot, Fleisch, Blut und unvergängliche Liebe
  choice: Die appositionellen Gleichsetzungen bleiben bestehen.
  alternative: Sie rein symbolisch oder ausdrücklich eucharistisch auslegen.
  rationale: Die Übersetzung soll die dichte sakramentale Sprache vermitteln, ohne eine konfessionelle Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Bildhafte und theologisch spannungsreiche Formulierungen wurden möglichst eng bewahrt. Da die unmittelbare Prüfung der griechischen mittelrezensionalen Überlieferung noch aussteht, folgt der Entwurf vorsichtig dem angegebenen gemeinfreien englischen Zeugen und kennzeichnet dessen editorische Ergänzung.
