- from: 'Der Herrscher dieser Welt will mich zerreißen und meine auf Gott gerichtete Gesinnung verderben. Darum soll keiner von euch, die ihr in der Nähe seid, ihm dabei helfen. Stellt euch vielmehr auf meine Seite – das heißt auf Gottes Seite. Redet nicht von Jesus Christus und begehrt zugleich die Welt. Lasst den Neid nicht bei euch heimisch werden.


