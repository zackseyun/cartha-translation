    There is one only physician, of flesh and of spirit, generate and in- generate, God in man, true Life in death, Son of Mary and Son of God, first passible and then impassible, Jesus Christ our Lord.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: de
  text: 'Denn einige pflegen in böswilliger Täuschung den Namen anzupreisen, während sie anderes tun, was Gottes unwürdig ist. Solchen Menschen müsst ihr aus dem Weg gehen wie wilden Tieren; denn sie sind tollwütige Hunde, die heimlich zubeißen. Vor ihnen müsst ihr euch hüten, denn sie sind schwer zu heilen.


    Es gibt nur einen Arzt, aus Fleisch und aus Geist, gezeugt und ungezeugt, Gott im Menschen, wahres Leben im Tod, Sohn Marias und Sohn Gottes, zuerst leidensfähig und dann leidensunfähig: Jesus Christus, unser Herr.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Gegensatzpaare „gezeugt und ungezeugt“ sowie „zuerst leidensfähig und dann leidensunfähig“ geben die paradoxe Ausdrucksweise der überlieferten Fassung möglichst unmittelbar wieder. Ihre genaue griechische Textgestalt und Nuancierung bedürfen noch der direkten Prüfung an der mittelgriechischen Handschriftentradition.
    reason: Der bereitgestellte Ausgangstext ist ein englischer gemeinfreier Zeuge; laut Datensatz steht die direkte Prüfung des griechischen Quelltexts noch aus.
lexical_decisions:
- source_word: τὸ ὄνομα (reconstructed from the middle-recension Greek tradition; direct review pending)
  choice: den Namen
  rationale: Die bestimmte und großgeschriebene Form bewahrt den christologischen Bezug, ohne ihn durch eine ausdrückliche Ergänzung wie „den Namen Christi“ festzulegen.
- source_word: ἰατρός
  choice: Arzt
  rationale: Das schlichte, gegenwärtige Wort erhält die medizinische Metapher und den Gegensatz zu den „schwer zu heilenden“ Irrlehrern.
- source_word: σαρκικός τε καὶ πνευματικός
  choice: aus Fleisch und aus Geist
  rationale: Die parallele Formulierung bewahrt die christologische Spannung und vermeidet eine vorschnelle dogmatische Ausdeutung.
- source_word: γεννητὸς καὶ ἀγέννητος
  choice: gezeugt und ungezeugt
  rationale: Die eng aufeinander bezogenen Gegenbegriffe werden formal erhalten; „gezeugt“ gibt den personalen beziehungsweise herkunftsbezogenen Sinn besser wieder als das allgemeinere „entstanden“.
- source_word: παθητὸς καὶ ἀπαθής
  choice: leidensfähig und leidensunfähig
  rationale: Die Übersetzung wahrt den Gegensatz zwischen der Fähigkeit zu leiden und der Unfähigkeit zu leiden, ohne „unberührt“ oder „unvergänglich“ interpretierend einzutragen.
theological_decisions:
- issue: Christologische Gegensatzpaare
  choice: „aus Fleisch und aus Geist, gezeugt und ungezeugt … zuerst leidensfähig und dann leidensunfähig“
  alternative: Die Paare erklärend auf menschliche und göttliche Natur verteilen
  rationale: Der Text formuliert bewusst paradoxe Prädikate. Die Übersetzung erhält diese Spannung, statt sie durch eine spätere dogmatische Systematisierung aufzulösen.
- issue: „Gott im Menschen“
  choice: Gott im Menschen
  alternative: Gott, der Mensch geworden ist
  rationale: Die knappere Form entspricht dem überlieferten Zeugnis und lässt dessen genaue Verhältnisbestimmung offen.
- issue: Zeitliche Aussage „zuerst … dann“
  choice: zuerst leidensfähig und dann leidensunfähig
  alternative: im Leiden und danach jenseits des Leidens
  rationale: Die zeitliche Abfolge wird ausdrücklich bewahrt, obwohl ihre genaue Beziehung zu Leiden, Tod und Auferstehung auslegungsbedürftig bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Bildhafte Härte („tollwütige Hunde“, „heimlich zubeißen“) und die knappe, hymnisch-bekenntnishafte Reihung des zweiten Absatzes bleiben erhalten. Wegen der noch ausstehenden griechischen Quellenprüfung ist der Entwurf als quellenbewusste, aber vorläufige Publikationsfassung zu behandeln.
