    text: Die Gegensatzpaare „gezeugt und ungezeugt“ sowie „zuerst leidensfähig und dann leidensunfähig“ geben die paradoxe Ausdrucksweise der überlieferten Fassung möglichst unmittelbar wieder. Ihre genaue griechische Textgestalt und Nuancierung bedürfen noch der direkten Prüfung an der griechischen Handschriftenüberlieferung.
    reason: Der bereitgestellte Ausgangstext ist ein englischer gemeinfreier Zeuge; laut Datensatz steht die direkte Prüfung des griechischen Quelltexts noch aus.
  revision_rationale: Die Revision stellt die knappen griechischen Prädikats- und Herkunftsformulierungen wieder her, beseitigt eine sachlich missverständliche Beschreibung in der Fußnote und glättet die erste Mahnung idiomatisch. Die spannungsvolle Reihung der Prädikate bleibt unverändert und wird nicht konfessionell ausgelegt.
