review_pass:
  verdict: revise
  source_fidelity: Eine Revision ist nötig. Die griechische Formel lautet an dieser Stelle „καὶ ἐκ Μαρίας καὶ ἐκ θεοῦ“ („und aus Maria und aus Gott“); „Sohn Marias und Sohn Gottes“ folgt zwar dem bereitgestellten englischen Zeugen, erweitert die knappe Herkunftsformel jedoch. Auch σαρκικός καὶ πνευματικός wird genauer als „fleischlich und geistlich“ wiedergegeben, nicht als „aus Fleisch und aus Geist“.
  naturalness: Der Text ist insgesamt gut verständlich und im angemessen würdigen Register gehalten. „Diese sollt ihr meiden wie wilde Tiere“ ist idiomatischer und eindeutiger als „Solchen Menschen müsst ihr aus dem Weg gehen wie wilden Tieren“. „In böswilliger Täuschung“ wird mit „in böser Arglist“ knapper und näher an der pointierten Ausdrucksweise wiedergegeben.
  terminology: „Arzt“, „gezeugt und ungezeugt“, „Gott im Menschen“, „wahres Leben im Tod“ sowie „leidensfähig und leidensunfähig“ bewahren die paradoxe christologische Reihung ohne dogmatische Auflösung. Die Fußnote soll die noch ausstehende Prüfung an der griechischen Handschriftenüberlieferung benennen, nicht an einer „mittelgriechischen“ Textgestalt.
  issues:
  - severity: medium
    issue: „Sohn Marias und Sohn Gottes“ statt „aus Maria und aus Gott“
    rationale: Der griechische Wortlaut formuliert die Herkunft mit ἐκ („aus“). Die Sohnschaft ist im Kontext naheliegend, aber an dieser Stelle nicht die wörtliche Formulierung; der englische Audit-Zeuge hat sie bereits interpretierend ausgeweitet.
  - severity: medium
    issue: „aus Fleisch und aus Geist“ für σαρκικός καὶ πνευματικός
    rationale: Die griechischen Prädikatsadjektive bedeuten unmittelbar „fleischlich und geistlich“. Die bisherige deutsche Fassung verschiebt sie in eine Herkunfts- bzw. Stoffformel.
  - severity: low
    issue: Fußnote nennt eine „mittelgriechische Handschriftentradition“
    rationale: Die ausstehende Prüfung betrifft die griechische Handschriftenüberlieferung; „mittelgriechisch“ ist als Charakterisierung der Textgestalt missverständlich.
  revised_text: 'Denn einige tragen den Namen in böser Arglist umher, während sie anderes tun, was Gottes unwürdig ist. Diese sollt ihr meiden wie wilde Tiere; denn sie sind tollwütige Hunde, die heimlich zubeißen. Nehmt euch vor ihnen in Acht, denn sie sind schwer zu heilen.


    Es gibt nur einen Arzt: fleischlich und geistlich, gezeugt und ungezeugt, Gott im Menschen, wahres Leben im Tod, aus Maria und aus Gott, zuerst leidensfähig und dann leidensunfähig: Jesus Christus, unser Herr.[a]'
  revised_footnotes:
