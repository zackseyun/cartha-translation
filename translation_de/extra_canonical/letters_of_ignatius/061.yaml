base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: de
  text: 'Ich will nicht länger nach Menschenart leben; und das wird geschehen, wenn ihr es wollt. Wollt es, damit auch ihr selbst gewollt werdet.[a] Mit diesem kurzen Brief flehe ich euch an: Glaubt mir!


    Jesus Christus wird euch offenbar machen, dass ich die Wahrheit sage – Jesus Christus, der untrügliche Mund, durch den der Vater [wahrhaftig] gesprochen hat.[b]


    Bittet für mich, dass ich ans Ziel gelange [durch den Heiligen Geist].[c] Ich schreibe euch nicht nach dem Fleisch, sondern nach Gottes Sinn. Wenn ich leide, habt ihr es gewollt; wenn ich abgewiesen werde, habt ihr mich gehasst.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bewusst mehrdeutig: „Wollt, damit auch ihr gewollt werdet.“ Wer die Wollenden beziehungsweise der Handelnde im Passiv ist, wird im vorliegenden Zeugen nicht ausdrücklich gesagt.'
    reason: Das Wortspiel ist im Deutschen ungewöhnlich und könnte sonst vorschnell theologisch aufgelöst werden.
  - marker: b
    text: „Wahrhaftig“ steht im zugrunde gelegten englischen Zeugen in eckigen Klammern; die griechische Textgrundlage muss hierzu noch unmittelbar geprüft werden.
    reason: Kennzeichnet die textliche Unsicherheit der Ergänzung.
  - marker: c
    text: Auch „durch den Heiligen Geist“ ist im zugrunde gelegten Zeugen als unsichere oder ergänzte Lesart gekennzeichnet. Das nicht näher bezeichnete Ziel dürfte im Zusammenhang Ignatius’ Vollendung durch das Martyrium meinen, wird hier aber nicht in den Text eingesetzt.
    reason: Bewahrt sowohl die textkritische Unsicherheit als auch die Offenheit des Verbs.
  - marker: d
    text: 'Der Schluss ist eine zugespitzte Gegenüberstellung: Lassen die Adressaten Ignatius leiden, erfüllen sie seinen Wunsch; weisen sie seinen Weg zurück, deutet er dies als Hass gegen ihn.'
    reason: Hilft beim Verständnis der harten Rhetorik, ohne sie im Haupttext abzuschwächen.
lexical_decisions:
- source_word: after the manner of men
  choice: nach Menschenart
  rationale: Bewahrt den Gegensatz zwischen gewöhnlicher menschlicher Lebensweise und Ignatius’ angestrebtem Ziel in knapper, natürlicher Form.
- source_word: desire / be desired
  choice: wollen / gewollt werden
  rationale: Erhält das auffällige Wortspiel und die passivische Mehrdeutigkeit, ohne ein nicht ausdrücklich genanntes Subjekt einzusetzen.
- source_word: unerring mouth
  choice: untrügliche Mund
  rationale: Gibt die starke christologische Aussage formal und würdevoll wieder, ohne sie zu einer bloßen Aussage über Wahrhaftigkeit abzuschwächen.
- source_word: attain
  choice: ans Ziel gelange
  rationale: Lässt das Ziel im Haupttext unausgesprochen, wie es auch der vorliegende Zeuge tut, und klingt im Deutschen natürlicher als ein bloßes „gelange“.
- source_word: after the flesh
  choice: nach dem Fleisch
  rationale: Bewahrt die frühchristliche, theologisch spannungsreiche Ausdrucksweise statt sie interpretierend auf „aus menschlichen Motiven“ zu verengen.
- source_word: mind of God
  choice: Gottes Sinn
  rationale: Natürliches Deutsch, das sowohl Denken als auch Absicht umfassen kann und die genaue Beziehung nicht überbestimmt.
theological_decisions:
- issue: Subjekt des passivischen „gewollt werden“
  choice: Das Passiv bleibt ohne ausdrücklich genanntes handelndes Subjekt stehen.
  alternative: „damit Gott auch euch begehrt“ oder „damit auch ihr das Gewünschte erlangt“
  rationale: Der vorliegende englische Zeuge lässt die Aussage mehrdeutig; eine theologische Festlegung wäre ohne direkte griechische Prüfung nicht gerechtfertigt.
- issue: Christus als Mund des Vaters
  choice: „der untrügliche Mund, durch den der Vater ... gesprochen hat“
  alternative: „in dem der Vater ... gesprochen hat“
  rationale: „Durch den“ ist im Deutschen idiomatischer und wahrt Christus als vermittelnden Sprecher, ohne die Aussage weiter dogmatisch auszulegen.
- issue: Mittel des Erlangens
  choice: „[durch den Heiligen Geist]“ bleibt als textkritisch unsichere Ergänzung in eckigen Klammern.
  alternative: Auslassung oder Aufnahme ohne Kennzeichnung
  rationale: Die Klammern des überlieferten Arbeitszeugen werden transparent bewahrt, da die direkte Prüfung der griechischen Überlieferung noch aussteht.
- issue: Verantwortung der römischen Gemeinde
  choice: Die scharfe Gegenüberstellung von erwünschtem Leiden und hassbedingter Abweisung bleibt bestehen.
  alternative: Abmilderung zu „wenn ihr mich hindert, wäre das lieblos“
  rationale: Ignatius’ rhetorische Zuspitzung und die darin liegende Spannung dürfen nicht harmonisiert oder pastoral abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper frühchristlicher Brief-Rhetorik. Wiederholungen und harte Gegensätze wurden bewusst erhalten. Der Entwurf ist vorläufig, weil nur der angegebene gemeinfreie englische Zeuge vorliegt und die direkte Prüfung des mittelrezensionellen griechischen Textes noch aussteht.
