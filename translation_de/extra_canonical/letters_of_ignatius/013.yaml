review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist bei „convict“ nötig: Die Vorlage bezeichnet Ignatius als Verurteilten, nicht lediglich als Gefangenen. Auch die Wunschformel im Satz über das Folgen der Spuren sollte ausdrücklich als persönlicher Wunsch wiedergegeben werden. Die Richtung von „unto God“ und der Gehalt von „mysteries“ bleiben angesichts der noch ausstehenden unmittelbaren griechischen Kontrolle vorsichtig markiert.'
  naturalness: „Straße für die“ ist im Deutschen als Bild unnatürlich. „Weg derer“ ist idiomatischer. „Möge sich zeigen, dass ich ... folge“ verschiebt den Sinn; „Ich möchte gern ... gefunden werden“ gibt die Wunschformel klarer wieder. „Würdig, seliggepriesen zu werden“ trifft den ehrenden Duktus besser als „allen Glückwunsch verdient“.
  terminology: „Verurteilter“ wahrt die rechtliche Zuspitzung. „in die Geheimnisse eingeweiht“ gibt die initiatorische Sprache wieder, ohne sie sakramental festzulegen. „seliggepriesen“ bewahrt die besondere Form der Anerkennung für Paulus.
  issues:
  - severity: medium
    issue: „Gefangener“ schwächt „convict“ ab.
    rationale: Die englische Vorlage lautet „a convict“; die deutsche Fassung sollte die Verurteilung, nicht nur die Haft, ausdrücken.
  - severity: medium
    issue: Die Formulierung über das Folgen in Paulus’ Spuren gibt die Wunschformel nicht treffend wieder.
    rationale: „Would fain be found treading“ ist ein persönlicher Wunsch, nicht die Bitte, dass etwas sichtbar werde.
  - severity: low
    issue: „Straße für die“ ist als Metapher im modernen Deutsch holprig.
    rationale: „Weg derer“ bewahrt das Wegbild und liest sich natürlich.
  revised_text: 'Ich weiß, wer ich bin und an wen ich schreibe. Ich bin ein Verurteilter; ihr habt Erbarmen erfahren. Ich bin in Gefahr; ihr steht fest.


    Ihr seid der Weg derer, die unterwegs sind, um zu Gott hin zu sterben.[a] Ihr seid zusammen mit Paulus in die Geheimnisse eingeweiht,[b] der geheiligt wurde, ein gutes Zeugnis empfing und würdig ist, seliggepriesen zu werden. Ich möchte gern in seinen Fußspuren gehend gefunden werden, wenn ich zu Gott gelange. In jedem Brief erwähnt er euch in Christus Jesus.'
  revised_footnotes:
  - marker: a
    text: 'Auch möglich: „um für Gott zu sterben“. Die Formulierung kann eine Zielrichtung zu Gott hin oder Hingabe für Gott ausdrücken; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Bewahrt die in der englischen Zeugenübersetzung erkennbare Mehrdeutigkeit von „unto God“.
  - marker: b
    text: „Geheimnisse“ kann hier eine gemeinsame Einweihung oder Teilhabe bezeichnen. Der Ausdruck legt ohne unmittelbare Prüfung des griechischen Wortlauts keine bestimmte sakramentale oder kultische Deutung fest.
    reason: Bewahrt die religiöse und terminologische Offenheit des Ausdrucks.
  revision_rationale: Die Revision stellt die Verurteilung des Schreibers wieder her, verbessert mehrere unidiomatische oder sinnverschiebende Formulierungen und hält die noch nicht unmittelbar am Griechischen geprüften Deutungsfragen knapp in Fußnoten offen. Die nicht erforderliche Fußnote zu „in jedem Brief“ entfällt, da die Aussage die vorliegende englische Zeugenübersetzung direkt wiedergibt.
