    Ye are the high-road of those that are on their way to die unto God. Ye are associates in the mysteries with Paul, who was sanctified, who obtained a good report, who is worthy of all felicitation; in whose foot-steps I would fain be found treading, when I shall attain unto God; who in every letter maketh mention of you in Christ Jesus.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: de
  text: 'Ich weiß, wer ich bin und an wen ich schreibe. Ich bin ein Gefangener; ihr habt Erbarmen erfahren. Ich bin in Gefahr; ihr steht fest.


    Ihr seid die Straße für die, die unterwegs sind, um für Gott zu sterben.[a] Ihr teilt die Geheimnisse mit Paulus,[b] der geheiligt wurde, ein gutes Zeugnis empfing und allen Glückwunsch verdient. Möge sich zeigen, dass ich seinen Spuren folge, wenn ich zu Gott gelange. In jedem Brief erwähnt er euch in Christus Jesus.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die unterwegs sind, um zu Gott hin zu sterben“. Eine Prüfung am griechischen Wortlaut steht noch aus.'
    reason: Bewahrt die mögliche Zielrichtung der Formulierung „die unto God“.
  - marker: b
    text: „Geheimnisse“ kann hier gemeinsame Teilhabe oder Einweihung bezeichnen; der genaue Sinn ist ohne Prüfung des griechischen Wortlauts nicht sicher.
    reason: Verhindert eine vorschnelle sakramentale oder kultische Festlegung.
  - marker: c
    text: So die zugrunde liegende englische Zeugenübersetzung. Ob „in jedem Brief“ oder eine andere Nuance gemeint ist, muss noch am Griechischen geprüft werden.
    reason: Kennzeichnet eine auffällige Aussage, deren direkte quellensprachliche Kontrolle ausdrücklich noch aussteht.
lexical_decisions:
- source_word: convict
  choice: Gefangener
  rationale: Die englische Zeugenübersetzung bezeichnet Ignatius als Inhaftierten; „Gefangener“ ist natürlich und vermeidet die möglicherweise zu enge Festlegung auf einen rechtskräftig Verurteilten.
- source_word: received mercy
  choice: Erbarmen erfahren
  rationale: Bewahrt den theologischen Klang des Erbarmens und formuliert zugleich idiomatisch.
- source_word: established
  choice: steht fest
  rationale: Gibt den Gegensatz zu Ignatius’ Gefährdung knapp und verständlich wieder, ohne die Art der Festigung näher festzulegen.
- source_word: high-road
  choice: Straße
  rationale: Bewahrt das Wegbild. „Hochstraße“ wäre im heutigen Deutsch missverständlich, „Hauptstraße“ könnte eine nicht belegte Rangordnung nahelegen.
- source_word: associates in the mysteries
  choice: teilt die Geheimnisse
  rationale: Hält die religiöse Mehrdeutigkeit von „mysteries“ offen und vermeidet eine konfessionell enggeführte sakramentale Deutung.
- source_word: obtained a good report
  choice: ein gutes Zeugnis empfing
  rationale: Bewahrt die Aussage, dass Paulus Anerkennung beziehungsweise ein gutes Zeugnis zuteilwurde, ohne die gebende Instanz festzulegen.
- source_word: attain unto God
  choice: zu Gott gelange
  rationale: Gibt Ignatius’ wiederkehrende Zielvorstellung wörtlich-nah und würdig wieder, ohne sie auszudeuten.
theological_decisions:
- issue: „für Gott sterben“ beziehungsweise „zu Gott hin sterben“
  choice: um für Gott zu sterben
  alternative: um zu Gott hin zu sterben
  rationale: Die zugrunde liegende englische Zeugenübersetzung „die unto God“ kann Zielrichtung oder Hingabe ausdrücken. Die Hauptfassung ist natürliches Deutsch; die Fußnote bewahrt die mögliche Zielrichtung.
- issue: „Geheimnisse“ mit Paulus teilen
  choice: Ihr teilt die Geheimnisse mit Paulus
  alternative: Ihr seid mit Paulus in die Geheimnisse eingeweiht
  rationale: Die gewählte Fassung lässt offen, ob gemeinsame Teilhabe, Einweihung oder sakramentale Gemeinschaft gemeint ist.
- issue: Paulus erwähnt die Epheser „in jedem Brief“
  choice: In jedem Brief erwähnt er euch
  alternative: In seinem ganzen Brief erwähnt er euch
  rationale: Die englische Überlieferungsgrundlage bietet „in every letter“. Da der Wortlaut sachlich auffällig und die griechische Prüfung noch aussteht, wird er beibehalten und mit einem textkritischen Vorbehalt versehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im traditionellen Plural „ihr“, passend zu einem frühchristlichen Gemeindebrief. Der Entwurf bleibt bewusst vorläufig, weil nur eine gemeinfreie englische Zeugenübersetzung vorliegt und die direkte Prüfung der mittelgriechischen Überlieferung noch aussteht.
