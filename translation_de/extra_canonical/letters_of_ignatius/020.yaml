review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist bei der Ortsangabe des Sterns nötig: Das Zeugnis sagt, der Stern leuchtete »im Himmel über allen Sternen« auf, nicht dass er heller als alle Sterne am Himmel leuchtete. Die spätere Aussage bezeichnet ausdrücklich sein Überstrahlen aller anderen. Die übrigen zentralen Aussagen, einschließlich der absichtlich starken Inkarnationsformulierung und des prozesshaften Beginns der Todesaufhebung, werden sachgerecht wiedergegeben. Die direkte Prüfung des griechischen Wortlauts bleibt nach den vorliegenden Metadaten ausstehend.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. »über allen Sternen« ist sowohl quellentreuer als auch idiomatisch. »geriet alles in Unruhe« gibt die Störung beziehungsweise Erschütterung klarer wieder als »geriet alles in Bewegung«, das im Deutschen auch neutral oder positiv klingen kann.
  terminology: »Herrscher dieser Welt«, »Jungfräulichkeit«, »Gebären«, »alte Herrschaft« und »Aufhebung des Todes« sind tragfähige, nicht konfessionell einengende Lösungen. »Zauberbann« macht die Unterscheidung von allgemeiner Zauberei und einem einzelnen magischen Bann deutlicher. Die Fußnote zu »zur Neuheit ewigen Lebens« ist angesichts der noch nicht erfolgten direkten griechischen Prüfung sinnvoll und korrekt am betreffenden Ausdruck verankert.
  issues:
  - severity: medium
    issue: »am Himmel heller als alle Sterne« verschiebt die Bedeutung von »in the heaven above all the stars«.
    rationale: Die Vorlage beschreibt zunächst die Position beziehungsweise Einzigartigkeit des Sterns »über allen Sternen«; erst danach wird gesagt, dass er alle anderen überstrahlte. Die deutsche Fassung zieht diese beiden Aussagen unzulässig zusammen.
  - severity: low
    issue: »geriet alles in Bewegung« ist für »all things were perturbed« zu schwach und semantisch offen.
    rationale: Gemeint ist eine Erschütterung oder Beunruhigung angesichts der begonnenen Aufhebung des Todes, nicht bloß eine allgemeine Bewegung.
  revised_text: 'Dem Herrscher dieser Welt blieben Marias Jungfräulichkeit, ihr Gebären und ebenso der Tod des Herrn verborgen – drei Geheimnisse, die laut verkündet werden sollen und die in Gottes Stille vollbracht wurden. Wie wurden sie nun den Zeitaltern offenbar?


    Ein Stern erstrahlte am Himmel über allen Sternen. Sein Licht war unaussprechlich, und seine Fremdartigkeit rief Staunen hervor. Alle übrigen Gestirne bildeten zusammen mit Sonne und Mond einen Chor um den Stern; doch der Stern selbst überstrahlte sie alle bei Weitem. Ratlos fragte man sich, woher diese fremdartige Erscheinung kam, die ihnen so unähnlich war.


    Von da an lösten sich jede Zauberei und jeder Zauberbann auf. Die Unwissenheit der Bosheit verschwand, und die alte Herrschaft wurde niedergerissen, als Gott in menschlicher Gestalt erschien, um die Neuheit ewigen Lebens zu bringen.[a] Was in Gottes Ratschluss zur Vollendung gebracht worden war, begann wirksam zu werden. Von da an geriet alles in Unruhe, denn die Aufhebung des Todes wurde in Angriff genommen.'
  revised_footnotes:
