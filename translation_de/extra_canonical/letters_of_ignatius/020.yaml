base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: de
  text: 'Dem Herrscher dieser Welt blieben Marias Jungfräulichkeit, ihr Gebären und ebenso der Tod des Herrn verborgen – drei Geheimnisse, die laut verkündet werden sollen und die in Gottes Stille vollbracht wurden. Wie wurden sie nun den Zeitaltern offenbar?


    Ein Stern erstrahlte am Himmel heller als alle Sterne. Sein Licht war unaussprechlich, und seine Fremdartigkeit rief Staunen hervor. Alle übrigen Gestirne bildeten zusammen mit Sonne und Mond einen Chor um den Stern; doch der Stern selbst überstrahlte sie alle bei Weitem. Ratlos fragte man sich, woher diese fremdartige Erscheinung kam, die ihnen so unähnlich war.


    Von da an lösten sich jede Zauberei und jeder Bann auf. Die Unwissenheit der Bosheit verschwand, und die alte Herrschaft wurde niedergerissen, als Gott in menschlicher Gestalt erschien, um die Neuheit ewigen Lebens zu bringen.[a] Was in Gottes Ratschluss zur Vollendung gebracht worden war, begann wirksam zu werden. Von da an geriet alles in Bewegung, denn die Aufhebung des Todes wurde in Angriff genommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise alternativ: „hin zur Neuheit ewigen Lebens“ oder „in der Neuheit ewigen Lebens“. Da die direkte Prüfung des griechischen Textes noch aussteht, bleibt die genaue Beziehung der Wendung vorläufig offen.'
    reason: Die zugrunde liegende englische Zeugenübersetzung „unto newness of everlasting life“ ist syntaktisch und semantisch mehrdeutig.
lexical_decisions:
- source_word: prince of this world (Greek witness likely ἄρχων τοῦ αἰῶνος τούτου)
  choice: Herrscher dieser Welt
  rationale: Bewahrt die politische und geistliche Bedeutung von ἄρχων, ohne durch „Fürst“ einen unnötig altertümlichen Klang einzuführen.
- source_word: virginity
  choice: Jungfräulichkeit
  rationale: Gibt den abstrakten Ausdruck präzise wieder und unterscheidet ihn von der Personbezeichnung „Jungfrau“.
- source_word: child-bearing
  choice: ihr Gebären
  rationale: Bewahrt den parallelen nominalen Ausdruck und bezeichnet den Vorgang der Geburt, ohne ihn mit Mutterschaft gleichzusetzen.
- source_word: mysteries to be cried aloud
  choice: Geheimnisse, die laut verkündet werden sollen
  rationale: Erhält den bewussten Gegensatz zwischen öffentlicher Verkündigung und der Stille Gottes.
- source_word: constellations
  choice: Gestirne
  rationale: Passt im Deutschen natürlich zu Sonne, Mond und Sternen; „Sternbilder“ wäre im beschriebenen kosmischen Chor zu eng.
- source_word: spell
  choice: Bann
  rationale: Gibt neben „Zauberei“ die Vorstellung einer bindenden magischen Einwirkung knapp und idiomatisch wieder.
- source_word: ancient kingdom
  choice: alte Herrschaft
  rationale: „Herrschaft“ lässt offen, ob ein Reich, eine Machtordnung oder die Herrschaft des Bösen gemeint ist.
- source_word: abolishing of death
  choice: Aufhebung des Todes
  rationale: Bewahrt die starke, prozesshaft formulierte Aussage, ohne sie in eine bereits vollständig abgeschlossene Vernichtung umzudeuten.
theological_decisions:
- issue: Identität des „Herrschers dieser Welt“
  choice: Die Bezeichnung bleibt ohne erklärende Identifikation stehen.
  alternative: Im Text ausdrücklich „der Teufel“ oder „Satan“ schreiben.
  rationale: Der Titel trägt seinen eigenen johanneisch-frühchristlichen Bedeutungsraum; eine explizite Gleichsetzung würde eine Auslegung in den Text einsetzen.
- issue: „Gott erschien in menschlicher Gestalt“
  choice: Die Aussage wird direkt und ohne christologische Abschwächung wiedergegeben.
  alternative: „Gott offenbarte sich durch einen Menschen“ oder ausdrückliche Ergänzung des Namens Jesus Christus.
  rationale: Die starke Inkarnationsaussage des Zeugnisses soll erhalten bleiben; zugleich wird kein im Abschnitt nicht genannter Name ergänzt.
- issue: Bezug von „unto the newness of everlasting life“
  choice: „um die Neuheit ewigen Lebens zu bringen“ mit Fußnote zur grammatischen Offenheit.
  alternative: „in der Neuheit ewigen Lebens“ oder „hin zur Neuheit ewigen Lebens“.
  rationale: Die englische Zeugenübersetzung lässt Ziel, Wirkung oder Sphäre offen. Die Hauptfassung muss im Deutschen syntaktisch verständlich sein, während die Fußnote die Unsicherheit wahrt.
- issue: Status der Todesaufhebung
  choice: „wurde in Angriff genommen“
  alternative: „hatte begonnen“ oder „wurde vollendet“.
  rationale: Die Formulierung bezeichnet den Beginn eines entscheidenden Unternehmens und sollte nicht zu einer rein abgeschlossenen Aussage geglättet werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst rhythmischem Satzbau. Kosmische und theologische Bildsprache bleibt erhalten; altertümliche Formen wie „ward“, „Fürst“ oder „Ratschlüsse“ werden vermieden. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung der mittelrezensionellen griechischen Überlieferung ausdrücklich vorläufig.
