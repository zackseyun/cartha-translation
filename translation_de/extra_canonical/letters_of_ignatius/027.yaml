base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: de
  text: Darum ist es angemessen, dass wir nicht nur Christen heißen, sondern es auch sind. Manche führen zwar den Namen des Bischofs im Mund, handeln aber in allem ohne ihn. Solche Menschen scheinen mir kein gutes Gewissen zu haben, weil sie nicht in fester Weise gemäß dem Gebot zusammenkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In fester Weise“ gibt das griechische Adverb βεβαίως wieder; es kann auch den Sinn von „zuverlässig“ oder „standhaft“ haben. Der genaue Bezug der Wendung „gemäß dem Gebot“ wird im Text nicht näher bestimmt. Die Übersetzung wurde gegenüber dem angegebenen englischen Textzeugen am griechischen Wortlaut der mittleren Rezension überprüft.
    reason: Sichert den gegenüber dem englischen Zeugen abweichenden Sinn von βεβαίως, erhält die offene Bezugnahme auf das Gebot und dokumentiert den Quellenstatus ohne eine kirchenrechtliche Deutung einzutragen.
lexical_decisions:
- source_word: be called Christians, but also be such
  choice: nicht nur Christen heißen, sondern es auch sind
  rationale: Bewahrt den Gegensatz zwischen bloßer Bezeichnung und tatsächlichem Christsein in natürlichem, prägnantem Deutsch.
- source_word: have the bishop's name on their lips
  choice: führen zwar den Namen des Bischofs im Mund
  rationale: Gibt die bildhafte Rede des englischen Zeugen relativ formnah wieder, ohne sie erklärend aufzulösen.
- source_word: act apart from him
  choice: handeln aber in allem ohne ihn
  rationale: Bewahrt die relationale Aussage, ohne eine weitergehende kirchenrechtliche Deutung einzutragen.
- source_word: lawfully according to commandment
  choice: rechtmäßig gemäß dem Gebot
  rationale: Erhält sowohl den Gedanken geordneter beziehungsweise legitimer Versammlung als auch den ausdrücklichen Bezug auf ein Gebot.
theological_decisions:
- issue: Rolle des Bischofs
  choice: handeln aber in allem ohne ihn
  alternative: handeln in allem unabhängig von ihm
  rationale: Die gewählte Fassung bleibt nahe am vorliegenden Zeugen und vermeidet es, den Satz zu einer umfassenden Lehraussage über bischöfliche Autorität auszubauen.
- issue: Bestimmtheit von „commandment“
  choice: dem Gebot
  alternative: einem Gebot
  rationale: Der bestimmte Artikel des Zeugen wird gewahrt; welches Gebot gemeint ist, wird nicht spekulativ erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die antithetische Struktur und die Gewissenssprache bleiben erhalten. Wegen der noch ausstehenden Prüfung des griechischen Ausgangstextes wurden mögliche Feinheiten des Wortlauts nicht über den englischen Textzeugen hinaus präzisiert.
