review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist bei „rechtmäßig“ erforderlich. Der griechische Text der mittleren Rezension hat hier βεβαίως („fest, zuverlässig, standhaft“) in Verbindung mit „gemäß dem Gebot“, nicht primär den rechtlich-legitimen Sinn von „rechtmäßig“. Der Gegensatz von bloßem Namen und tatsächlichem Christsein sowie das Handeln „getrennt von/ohne“ dem Bischof sind im Entwurf im Wesentlichen gewahrt.
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. „Kein gutes Gewissen zu bewahren“ klingt jedoch weniger unmittelbar als die Aussage über eine vorhandene bzw. fehlende gute Gewissenshaltung. „Kein gutes Gewissen zu haben“ ist natürlicher und wahrt die Aussage.
  terminology: „Christen“, „Bischof“, „gutes Gewissen“ und „Gebot“ sind angemessen und ohne konfessionelle Überdeutung wiedergegeben. „ohne ihn“ bleibt für χωρὶς αὐτοῦ ausreichend offen. Die Formulierung zur Versammlung wird auf den griechischen Adverbsinn hin berichtigt.
  issues:
  - severity: medium
    issue: „rechtmäßig“ für βεβαίως
    rationale: „Rechtmäßig“ übernimmt die Deutung des englischen Zeugen („lawfully“), trifft aber den griechischen Wortlaut nicht präzise. βεβαίως bezeichnet hier eher ein festes, zuverlässiges bzw. standhaftes Zusammenkommen; der Text behauptet nicht ausdrücklich rechtliche Zulässigkeit.
  - severity: low
    issue: „kein gutes Gewissen zu bewahren“
    rationale: Die Formulierung ist verständlich, legt aber einen fortlaufenden Erhaltungsakt nahe. Der griechische Ausdruck beschreibt die Personen als nicht guten Gewissens; „kein gutes Gewissen zu haben“ ist idiomatischer und näher.
  revised_text: Darum ist es angemessen, dass wir nicht nur Christen heißen, sondern es auch sind. Manche führen zwar den Namen des Bischofs im Mund, handeln aber in allem ohne ihn. Solche Menschen scheinen mir kein gutes Gewissen zu haben, weil sie nicht in fester Weise gemäß dem Gebot zusammenkommen.[a]
