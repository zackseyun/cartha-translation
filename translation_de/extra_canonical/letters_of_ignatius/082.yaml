base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: de
  text: 'Niemand soll sich täuschen. Selbst die himmlischen Wesen, die Herrlichkeit der Engel und die sichtbaren wie unsichtbaren Mächte — wenn sie nicht an das Blut Christi [der Gott ist][a] glauben, erwartet auch sie das Gericht. Wer es fassen kann, der fasse es.[b] Niemand soll sich wegen seines Amtes überheben; denn Glaube und Liebe sind alles, und nichts hat Vorrang vor ihnen.


    Achtet aber auf diejenigen, die in Bezug auf die Gnade Jesu Christi, die zu uns gekommen ist, fremde Lehren vertreten: Ihr könnt sehen, wie sehr sie dem Willen Gottes widersprechen. Ihnen liegt nichts an der Liebe, nichts an der Witwe, nichts an der Waise, nichts an dem Bedrängten, nichts an dem Gefangenen, nichts an dem Hungrigen oder Durstigen. Sie halten sich von der Eucharistie (Danksagung)[c] und vom Gebet fern, weil sie nicht anerkennen, dass die Eucharistie das Fleisch unseres Retters Jesus Christus ist — jenes Fleisch, das für unsere Sünden gelitten hat und das der Vater in seiner Güte auferweckt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „der Gott ist“ stehen in der zugrunde liegenden englischen Überlieferungsfassung in eckigen Klammern und werden hier als textkritisch unsicher beziehungsweise ergänzt gekennzeichnet; eine unmittelbare Prüfung am griechischen Text steht noch aus.
    reason: Bewahrt das sichtbare Unsicherheitssignal der Vorlage und vermeidet falsche Gewissheit über den griechischen Wortlaut.
  - marker: b
    text: 'Wörtlich nach dem englischen Zeugen: „Wer empfängt, der empfange.“ Gemeint sein kann: Wer diese Aussage aufnehmen oder fassen kann, soll es tun. Der genaue griechische Wortlaut muss noch geprüft werden.'
    reason: Die isolierte Wendung ist mehrdeutig; die Übersetzung bietet einen verständlichen Sinn, ohne die Unsicherheit zu verschweigen.
  - marker: c
    text: „Eucharistie“ geht auf das griechische Wort für „Danksagung“ zurück und bezeichnet hier die eucharistische Feier beziehungsweise deren Mahlgabe.
    reason: Erhält die etymologische Erläuterung der Vorlage, ohne den Begriff konfessionell einzuengen.
lexical_decisions:
- source_word: heavenly beings / glory of the angels / rulers visible and invisible
  choice: die himmlischen Wesen, die Herrlichkeit der Engel und die sichtbaren wie unsichtbaren Mächte
  rationale: Bewahrt die gestufte Aufzählung des Zeugnisses; „Mächte“ ist im Deutschen für überirdische Herrschaftswesen natürlicher als das missverständliche „Herrscher“.
- source_word: office
  choice: Amt
  rationale: Gibt eine kirchliche oder gemeinschaftliche Stellung wieder, ohne ein bestimmtes Amtssystem in den Text hineinzulesen.
- source_word: mind of God
  choice: Willen Gottes
  rationale: Natürliches modernes Deutsch für eine Haltung, die Gottes Absicht widerspricht; die Bedeutung wird nicht auf bloßes Denken verengt.
- source_word: afflicted
  choice: Bedrängten
  rationale: Deckt Leiden und Not breit ab und vermeidet eine unnötige medizinische Festlegung.
- source_word: eucharist (thanksgiving)
  choice: Eucharistie (Danksagung)
  rationale: Erhält sowohl den frühchristlichen Fachbegriff als auch dessen wörtliche Bedeutung aus dem überlieferten Zeugen.
- source_word: allow not / acknowledge
  choice: nicht anerkennen
  rationale: Drückt die Zurückweisung der behaupteten Identität klar aus, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Göttliche Bezeichnung Christi in der eckigen Klammer
  choice: '[der Gott ist] beibehalten und mit einer textkritischen Fußnote markieren'
  alternative: die Worte ohne Klammern in den Haupttext aufnehmen oder auslassen
  rationale: Die Vorlage kennzeichnet die Wendung als unsicher beziehungsweise ergänzt. Ihre Beibehaltung wahrt sowohl die christologische Aussage als auch den Überlieferungsvorbehalt.
- issue: Aussage über die Eucharistie als Fleisch Christi
  choice: direkt und ohne erklärende Umdeutung wiedergeben
  alternative: symbolisch paraphrasieren oder sakramental weiter ausdeuten
  rationale: Ignatius’ pointierte Aussage und ihre theologische Spannung sollen erhalten bleiben, ohne eine spätere konfessionelle Lehrformel einzutragen.
- issue: Auferweckung des Fleisches
  choice: das grammatische Bezugswort „Fleisch“ ausdrücklich durch „jenes Fleisch“ aufnehmen
  alternative: allgemein sagen, der Vater habe „ihn“ auferweckt
  rationale: Die vorliegende Satzführung bezieht Leiden und Auferweckung ausdrücklich auf das Fleisch; diese körperliche Betonung ist für den Argumentationsgang wesentlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzstrukturen. Die anaphorische Reihe „nichts an …“ wurde zur Wahrung der rhetorischen Schärfe beibehalten. Der Entwurf bleibt ausdrücklich vorläufig, da laut Metadaten noch keine direkte Prüfung des mittelgriechischen Überlieferungstextes vorliegt; deshalb wurden erkennbare textliche und semantische Unsicherheiten in Fußnoten offengelegt.
