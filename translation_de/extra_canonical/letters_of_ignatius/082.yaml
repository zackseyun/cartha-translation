review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung nötig: Der Entwurf fügt in „Ihr könnt sehen, wie sehr“ ein nicht belegtes Subjekt und eine Verstärkung hinzu. Außerdem ist „sich täuschen“ reflexiv und trifft die passive Warnung nicht genau. Die Wendung „Wer es fassen kann“ ist als verständliche Wiedergabe vertretbar, sollte jedoch nicht mit dem ungenauen Fußnotenzitat „Wer empfängt“ erklärt werden. „wegen seines Amtes“ verengt die Aussage über eine Stellung/Position unnötig.'
  naturalness: Der Text ist überwiegend gut lesbares modernes Standarddeutsch. „Lasse sich niemand irreführen“, „sich aufgrund seiner Stellung aufblähen“ und eine direkte Wiedergabe von „wie sie dem Denken Gottes entgegenstehen“ sind zugleich natürlicher und quellennäher.
  terminology: „Eucharistie (Danksagung)“, „Fleisch“, „Glaube und Liebe“ sowie die markierte christologische Klammerformulierung sind angemessen. „Herrscher“ gibt die Aufzählung von Herrschaftswesen unmittelbarer wieder als die etwas interpretierende Wahl „Mächte“. Die eckigen Klammern und eine vorsichtige textkritische Fußnote bleiben erforderlich.
  issues:
  - severity: medium
    issue: Zusatz in „Ihr könnt sehen, wie sehr sie dem Willen Gottes widersprechen“
    rationale: Das englische Zeugnis sagt direkt, dass sie dem „mind of God“ entgegenstehen; es enthält weder ein angesprochenes „ihr“ noch die Verstärkung „wie sehr“.
  - severity: medium
    issue: „Niemand soll sich täuschen“
    rationale: Die Warnung richtet sich gegen Irreführung durch andere bzw. gegen Getäuschtwerden, nicht gegen Selbsttäuschung.
  - severity: low
    issue: „wegen seines Amtes“
    rationale: Die zugrunde liegende Aussage bezieht sich allgemeiner auf Stellung/Position; „Amt“ kann ein späteres oder fest umrissenes kirchliches Amt nahelegen.
  - severity: low
    issue: Fußnote b paraphrasiert den englischen Zeugen als „Wer empfängt, der empfange“
    rationale: Die englische Formulierung lautet zwar „He that receiveth ...“, doch die Aussage betrifft erkennbar das Aufnehmen/Fassen. Die Fußnote sollte diese mögliche Bedeutung erklären, ohne ein irreführendes angebliches Wortzitat zu setzen.
  revised_text: 'Lasse sich niemand irreführen. Auch die himmlischen Wesen, die Herrlichkeit der Engel und die sichtbaren und unsichtbaren Herrscher: Wenn sie nicht an das Blut Christi [der Gott ist][a] glauben, erwartet auch sie das Gericht. Wer es fassen kann, der fasse es.[b] Niemand soll sich aufgrund seiner Stellung aufblähen; denn Glaube und Liebe sind alles in allem, und nichts geht ihnen voraus.


    Achtet aber auf die, die über die Gnade Jesu Christi, die zu uns gekommen ist, fremde Lehren vertreten: Sie stehen dem Denken Gottes entgegen. Ihnen liegt nichts an der Liebe, nichts an der Witwe, nichts an der Waise, nichts an dem Bedrängten, nichts an dem Gefangenen, nichts an dem Hungrigen oder Durstigen. Sie enthalten sich der Eucharistie (Danksagung)[c] und des Gebets, weil sie nicht anerkennen, dass die Eucharistie das Fleisch unseres Retters Jesus Christus ist, jenes Fleisch, das für unsere Sünden gelitten hat und das der Vater in seiner Güte auferweckt hat.'
