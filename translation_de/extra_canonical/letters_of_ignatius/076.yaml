base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: de
  text: 'Ignatius, der auch Theophorus heißt, an die Gemeinde Gottes, des Vaters, und Jesu Christi, des Geliebten, die in jeder Gnadengabe Erbarmen erfahren hat, erfüllt ist von Glauben und Liebe, keiner Gnadengabe ermangelt, in höchstem Maß gottwürdig und Heiliges tragend ist: an die Gemeinde in Smyrna in der Provinz Asia. In untadeligem Geist und im Wort Gottes entbiete ich überreichen Gruß.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung am griechischen Text der mittleren Rezension steht noch aus.
    reason: Die bereitgestellten Ausgangsdaten kennzeichnen die Quellenlage ausdrücklich als noch nicht direkt am Griechischen geprüft; dies muss für eine publikationsfähige Fassung transparent bleiben.
lexical_decisions:
- source_word: Theophorus
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname transliteriert, da seine mögliche Bedeutung („Gottesträger“ bzw. „von Gott getragen“) ohne gesicherte griechische Prüfung nicht in den Haupttext eingetragen werden sollte.
- source_word: church
  choice: Gemeinde
  rationale: „Gemeinde“ ist im modernen Deutsch natürlich und bezeichnet hier die örtliche christliche Gemeinschaft, ohne institutionelle Konnotationen unnötig zu verstärken.
- source_word: grace
  choice: Gnade / Gnadengabe
  rationale: Beim ersten Vorkommen passt „Gnade“ zur umfassenden göttlichen Zuwendung; beim zweiten macht „Gnadengabe“ den konkreteren Sinn von Ausstattung oder Gabe verständlich, wobei die Differenz mangels direkter griechischer Prüfung vorläufig bleibt.
- source_word: most reverend
  choice: höchster Ehre würdig
  rationale: Diese Formulierung bewahrt den ehrenden Sinn, ohne das moderne Amtsprädikat „hochwürdig“ zu verwenden.
- source_word: bearing holy treasures
  choice: trägt heilige Schätze
  rationale: Die auffällige Bildsprache des Zeugnisses wird formal bewahrt und nicht interpretierend auf Personen, Ämter oder Sakramente festgelegt.
- source_word: Asia
  choice: Provinz Asia
  rationale: Der Zusatz „Provinz“ verhindert die moderne geografische Fehlinterpretation als Kontinent; „Asia“ erhält den antiken Eigennamen.
- source_word: abundant greeting
  choice: überreichen Gruß
  rationale: Bewahrt die ungewöhnliche Intensivierung des Grußes in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Zuordnung der Gemeinde zu Gott dem Vater und Jesus Christus
  choice: „an die Gemeinde Gottes, des Vaters, und Jesu Christi, des Geliebten“
  alternative: „an die Gemeinde Gottes des Vaters und des geliebten Jesus Christus“
  rationale: Die Zeichensetzung folgt der überlieferten englischen Satzstruktur und lässt die Beziehung der Genitive sichtbar, ohne sie dogmatisch zu glätten.
- issue: Bedeutung der „heiligen Schätze“
  choice: Bildhafte Wendung unverändert beibehalten
  alternative: Konkretisierung als Heilige, Sakramente oder geistliche Gaben
  rationale: Das Zeugnis legt den Referenten nicht eindeutig fest; eine Konkretisierung würde eine mögliche theologische Deutung in den Text importieren.
- issue: „in untadeligem Geist und im Wort Gottes“
  choice: Als modale bzw. sphärische Bestimmung beim Gruß belassen
  alternative: Auf die Gemeinde als deren Eigenschaften beziehen
  rationale: Die syntaktische Beziehung ist im englischen Zeugen nicht völlig eindeutig. Die deutsche Stellung wahrt diese Spannung weitgehend, statt sie ausdrücklich auf Absender oder Empfänger festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Briefeingangsformel wurde zur besseren Verständlichkeit in mehrere Sätze gegliedert, ohne ihre inhaltlichen Glieder aufzulösen. Archaische Amtsanreden und konfessionell geprägte Präzisierungen wurden vermieden.
