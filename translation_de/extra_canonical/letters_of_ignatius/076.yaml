revisions:
- from: Ignatius, der auch Theophorus heißt, an die Gemeinde Gottes, des Vaters, und Jesu Christi, des Geliebten. Ihr ist in Barmherzigkeit jede Gnade geschenkt worden; sie ist erfüllt von Glauben und Liebe, ermangelt keiner Gnadengabe, ist höchster Ehre würdig und trägt heilige Schätze. Der Gemeinde in Smyrna in der Provinz Asia entbiete ich in untadeligem Geist und im Wort Gottes überreichen Gruß.[a]
  to: 'Ignatius, der auch Theophorus heißt, an die Gemeinde Gottes, des Vaters, und Jesu Christi, des Geliebten, die in jeder Gnadengabe Erbarmen erfahren hat, erfüllt ist von Glauben und Liebe, keiner Gnadengabe ermangelt, in höchstem Maß gottwürdig und Heiliges tragend ist: an die Gemeinde in Smyrna in der Provinz Asia. In untadeligem Geist und im Wort Gottes entbiete ich überreichen Gruß.[a]'
  rationale: Die Revision vereinheitlicht die beiden Belege von χάρισμα als „Gnadengabe“, bewahrt die auf Gott bezogene Ehrenbezeichnung und belässt das Bild des Heiligentragens offen. Zugleich ersetzt sie eine im Deutschen unnatürliche Konstruktion durch eine eng am Sinn von ἠλεημένῃ orientierte Formulierung. Die mögliche syntaktische Mehrdeutigkeit von „in untadeligem Geist und im Wort Gottes“ bleibt erhalten; die Vorläufigkeitsfußnote bleibt erforderlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:52:31Z'
review_pass:
  verdict: revise
  source_fidelity: Eine Revision ist nötig. Die Prologadresse beschreibt durchgehend die Gemeinde; die deutsche Fassung macht dies zwar überwiegend sichtbar, differenziert aber zweimal ohne Grundlage zwischen „Gnade“ und „Gnadengabe“. Das griechische χάρισμα steht in beiden Fällen. Ferner gibt „trägt heilige Schätze“ die Bildbildung ἁγιοφόρος bzw. den englischen Brückentext interpretierend wieder; „Heiliges tragend“ wahrt die offene Aussage besser. „höchster Ehre würdig“ ist zudem eine zu allgemeine Umschreibung für die traditionsgebundene, auf Gott bezogene Ehrenbezeichnung (θεοπρεπεστάτῃ).
  naturalness: Der Entwurf ist insgesamt gut verständlich und würdig. „in Barmherzigkeit ... geschenkt worden“ klingt im Deutschen jedoch unidiomatisch; „in jeder Gnadengabe Erbarmen erfahren hat“ ist näher am Sinn und natürlich. Die Anrede lässt sich als ein Satz mit klaren Relativ- und Partizipialprädikaten gestalten, ohne den formelhaften Charakter zu verlieren.
  terminology: „Gemeinde“, „Theophorus“, „Asia“ und „überreichen Gruß“ sind angemessen. „Gnadengabe“ sollte beide Vorkommen von χάρισμα einheitlich wiedergeben. Die Formulierung „in höchstem Maß gottwürdig“ ist ungewohnt, erhält aber die auf Gott bezogene Wertung, statt sie zum bloß sozialen „höchster Ehre würdig“ abzuschwächen. „Heiliges tragend“ bewahrt die absichtlich offene Bildsprache ohne sachliche oder sakramentale Festlegung.
  issues:
  - severity: medium
    issue: Uneinheitliche und sachlich nicht gedeckte Wiedergabe von χάρισμα
    rationale: Der Entwurf übersetzt das erste Vorkommen mit „Gnade“, das zweite mit „Gnadengabe“. Im überlieferten griechischen Wortlaut steht in beiden Fällen χάρισμα. Die einheitliche Wiedergabe „Gnadengabe“ bewahrt die lexikalische Verbindung und den Gabenaspekt.
  - severity: medium
    issue: „trägt heilige Schätze“ konkretisiert die offene Bildsprache
    rationale: Die Formulierung fügt „Schätze“ als Gegenstand ein. Das griechische Bild bezeichnet die Gemeinde als heilig-tragend und spezifiziert nicht, was sie trägt. „Heiliges tragend“ ist genauer und lässt den Referenten offen.
  - severity: medium
    issue: „höchster Ehre würdig“ schwächt die Gottesbezogenheit der Ehrenbezeichnung ab
    rationale: Die griechische Bezeichnung θεοπρεπεστάτῃ ist nicht lediglich eine allgemeine soziale Ehrenformel. „in höchstem Maß gottwürdig“ erhält die Gottesbezogenheit, ohne sie konfessionell auszuformulieren.
  - severity: low
    issue: „in Barmherzigkeit ... geschenkt worden“ ist idiomatisch und semantisch weniger präzise
    rationale: Für ἠλεημένῃ passt „Erbarmen erfahren hat“ besser; die Ausstattung „in jeder Gnadengabe“ bleibt dabei als eigene Bestimmung erkennbar.
