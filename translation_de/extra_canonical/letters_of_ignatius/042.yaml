review_pass:
  verdict: revise
  source_fidelity: 'Die Amtsreihe und die abschließende Selbstbeschränkung werden im Wesentlichen zutreffend wiedergegeben. Eine sichere Korrektur ist jedoch bei ἀντίτυπον nötig: „Beispiel“ glättet den prägnanten Ausdruck zu stark. Zudem sollte die Aussage ἐκκλησία οὐ καλεῖται näher an der Benennungsform des griechischen Textes bleiben.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „habe ich ein Beispiel eurer Liebe empfangen und bei mir“ ist jedoch syntaktisch und semantisch missglückt. Die revidierte Fassung ist flüssiger, ohne den historischen Registercharakter zu verlieren.
  terminology: „Diakone“, „Bischof“ und „Presbyter“ sind angemessen. „Abbild des Vaters“, „Rat Gottes“ und „Verbindung der Apostel“ geben die griechischen Ausdrücke ohne konfessionelle Überbestimmung wieder. „Verbindung“ ist für σύνδεσμος genauer als „Gemeinschaft“.
  issues:
  - severity: medium
    issue: ἀντίτυπον wird als „Beispiel“ wiedergegeben.
    rationale: ἀντίτυπον bezeichnet hier eher ein entsprechendes Gegenbild, Abbild oder eine Verkörperung. „Beispiel“ ist möglich als kontextuelle Paraphrase, verliert aber den bildhaften und ungewöhnlichen Wortlaut.
  - severity: medium
    issue: Der zweite Satz des zweiten Absatzes ist sprachlich unvollständig bzw. unklar.
    rationale: „habe ich ein Beispiel eurer Liebe empfangen und bei mir“ lässt offen, was Ignatius bei sich hat. Der Bischof selbst ist das Objekt von „empfangen“ und „bei mir haben“.
  - severity: low
    issue: „Ohne diese kann man nicht einmal von einer Gemeinde sprechen“ ist weiter vom griechischen Benennungsprädikat entfernt als nötig.
    rationale: χωρὶς τούτων ἐκκλησία οὐ καλεῖται besagt wörtlich, dass es ohne diese nicht „Kirche/Gemeinde“ genannt wird. Eine nähere Formulierung bewahrt die möglicherweise zugespitzte ekklesiologische Aussage.
  revised_text: 'Ebenso sollen alle die Diakone achten wie Jesus Christus, ebenso den Bischof, der ein Abbild des Vaters ist, und die Presbyter wie den Rat Gottes und die Verbindung der Apostel. Ohne diese wird es nicht Gemeinde genannt.[a]



    Ich bin aber überzeugt, dass ihr in diesen Dingen so denkt. Denn als Gegenbild eurer Liebe habe ich euren Bischof empfangen und bei mir. Schon sein ganzes Auftreten ist eine große Unterweisung, seine Sanftmut aber ist Kraft. Ich meine, dass selbst die Gottlosen ihm Ehrfurcht erweisen.



    Weil ich euch liebe, schone ich euch auf diese Weise, obwohl ich seinetwegen eindringlicher schreiben könnte. Doch ich hielt mich nicht dafür geeignet, euch als ein Verurteilter wie ein Apostel Anweisungen zu geben.[b]'
  revised_footnotes:
  - marker: a
    text: 'Wörtlicher: „Ohne diese wird es nicht Gemeinde/Kirche genannt.“ Das griechische Wort ekklēsia kann sowohl „Gemeinde“ als auch „Kirche“ bedeuten.'
    reason: Bewahrt die sprachliche Form und den Bedeutungsumfang der ekklesiologischen Aussage.
  - marker: b
    text: Gemeint ist ein Mensch unter einem gerichtlichen Todesurteil; Ignatius befand sich nach der überlieferten Situation auf dem Weg zu seiner Hinrichtung.
    reason: Konkretisiert κατάκριτος im historischen Kontext, ohne daraus ein allgemeines moralisches Selbsturteil zu machen.
  revision_rationale: Die Revision korrigiert den sachlich und sprachlich problematischen zweiten Absatz anhand des griechischen ἀντίτυπον und stellt klar, dass Ignatius den Bischof selbst bei sich hat. Sie gibt σύνδεσμος präziser als „Verbindung“ wieder und rückt die Aussage über ekklēsia näher an den Wortlaut, ohne die Begriffe „Gemeinde“ und „Kirche“ einseitig festzulegen. Die historische Erklärung zu κατάκριτος bleibt als Fußnote abgesichert.
