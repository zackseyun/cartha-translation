base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: de
  text: 'Ebenso sollen alle die Diakone achten wie Jesus Christus, den Bischof als Abbild des Vaters und die Presbyter wie den Rat Gottes und wie die Gemeinschaft der Apostel. Ohne diese kann man nicht einmal von einer Gemeinde sprechen.[a]


    Ich bin überzeugt, dass ihr in diesen Dingen ebenso denkt. Denn in der Person eures Bischofs habe ich ein Beispiel eurer Liebe empfangen und bei mir. Schon sein ganzes Auftreten ist eine eindrucksvolle Unterweisung, und seine Sanftmut ist Kraft. Ich glaube, dass selbst die Gottlosen Ehrfurcht vor ihm haben.


    Weil ich euch liebe, schone ich euch, obwohl ich seinetwegen eindringlicher schreiben könnte. Doch ich hielt mich nicht für berechtigt, euch wie ein Apostel Anweisungen zu geben, da ich ein Verurteilter bin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ohne diese wird es nicht Gemeinde/Kirche genannt.“ Das griechische Wort ekklēsia kann sowohl „Gemeinde“ als auch „Kirche“ bedeuten.'
    reason: Bewahrt die sprachliche Form und den Bedeutungsumfang der ekklesiologischen Aussage.
  - marker: b
    text: 'Gemeint ist: ein zum Tod Verurteilter; Ignatius befand sich auf dem Weg zu seiner Hinrichtung.'
    reason: Verhindert, dass „Verurteilter“ lediglich als allgemeines moralisches Selbsturteil verstanden wird.
lexical_decisions:
- source_word: ἐντρεπέσθωσαν
  choice: sollen … achten
  rationale: Gibt die Aufforderung zu ehrerbietiger Achtung in natürlichem, gegenwärtigem Deutsch wieder, ohne eine kultische Verehrung anzudeuten.
- source_word: τύπον τοῦ πατρός
  choice: Abbild des Vaters
  rationale: Bewahrt die repräsentative Vergleichssprache von τύπος, ohne eine Wesensgleichheit zwischen Bischof und Vater zu behaupten.
- source_word: πρεσβυτέρους
  choice: Presbyter
  rationale: Der historische Amtsbegriff bleibt erhalten; „Älteste“ wäre ebenfalls möglich, könnte hier aber die frühkirchliche Amtsstruktur weniger deutlich erkennen lassen.
- source_word: συνέδριον θεοῦ
  choice: Rat Gottes
  rationale: Entspricht der Vorstellung eines beratenden oder versammelten Gremiums und klingt auf Deutsch würdig und verständlich.
- source_word: σύνδεσμον ἀποστόλων
  choice: Gemeinschaft der Apostel
  rationale: Das griechische Wort bezeichnet eine Verbindung oder einen Zusammenschluss. „Gemeinschaft“ wahrt den kollektiven Sinn, ohne eine spätere institutionelle Form festzulegen.
- source_word: ἐκκλησία οὐ καλεῖται
  choice: kann man nicht einmal von einer Gemeinde sprechen
  rationale: Gibt die idiomatische Aussage wieder, dass ohne die genannten Amtsträger die Bezeichnung ἐκκλησία nicht zutrifft; die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: κατάστημα
  choice: ganzes Auftreten
  rationale: Erfasst Haltung, Lebensführung und Erscheinungsweise umfassender als das engere „Benehmen“.
- source_word: μεγάλη μαθητεία
  choice: eine eindrucksvolle Unterweisung
  rationale: Bewahrt den Gedanken, dass die Person beziehungsweise Lebenshaltung des Bischofs selbst lehrend wirkt.
- source_word: πραότης … δύναμις
  choice: Sanftmut ist Kraft
  rationale: Erhält die knappe, spannungsreiche Gegenüberstellung des Ausgangstextes.
- source_word: κατάκριτος
  choice: Verurteilter
  rationale: Bezeichnet Ignatius im Blick auf sein gerichtliches Todesurteil präziser als das moderne, oft kriminalbiografisch verstandene „Sträfling“.
- source_word: διατάσσωμαι
  choice: Anweisungen zu geben
  rationale: Drückt autoritatives Anordnen aus, ohne unnötig militärisch oder bürokratisch zu klingen.
theological_decisions:
- issue: Vergleich der Diakone mit Jesus Christus
  choice: „die Diakone achten wie Jesus Christus“
  alternative: „die Diakone als Jesus Christus achten“
  rationale: Der Vergleich bleibt bewusst stark und ungelöst erhalten; die Formulierung vermeidet jedoch, eine schlichte Identifizierung der Diakone mit Christus zu behaupten.
- issue: Bischof als τύπος des Vaters
  choice: „als Abbild des Vaters“
  alternative: „als Stellvertreter des Vaters“
  rationale: „Abbild“ wahrt die typologische Repräsentation, während „Stellvertreter“ eine stärker ausgearbeitete Amtslehre in den Text eintragen könnte.
- issue: Bedingung für die Bezeichnung ἐκκλησία
  choice: „Ohne diese kann man nicht einmal von einer Gemeinde sprechen“
  alternative: „Ohne diese gibt es keine Kirche“
  rationale: Die gewählte Fassung folgt dem Wortlaut über die Benennung und vermeidet es, die Aussage ohne Weiteres in eine umfassende spätere Ekklesiologie umzudeuten.
- issue: Autorität des Ignatius gegenüber apostolischer Autorität
  choice: Ignatius verweigert sich als Verurteilter apostelgleicher Weisungsgewalt
  alternative: Ignatius erklärt sich grundsätzlich für völlig unbefugt zu lehren
  rationale: Der Text kontrastiert seine Lage mit apostolischem Anordnen; er leugnet nicht jede eigene Lehr- oder Mahnbefugnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühkirchlicher Amtsterminologie. Die knappen Parallelismen und theologischen Spannungen des Textes bleiben erhalten. Da die bereitgestellte Ausgangsbasis ausdrücklich als englischer gemeinfreier Zeuge mit noch ausstehender direkter griechischer Quellenprüfung gekennzeichnet ist, orientiert sich der Entwurf zusätzlich vorsichtig am bekannten Wortlaut der mittelrezensionalen griechischen Überlieferung; vor der endgültigen Veröffentlichung sollte die konkrete kritische Edition nochmals kollationiert werden.
