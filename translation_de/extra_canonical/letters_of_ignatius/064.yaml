  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/064.yaml
  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: de
  text: Ignatius, der auch Theophorus heißt, an die Gemeinde Gottes, des Vaters, und Jesu Christi in Philadelphia in Asia. Sie hat Erbarmen gefunden, ist fest gegründet in der Eintracht Gottes und freut sich ohne Wanken über das Leiden unseres Herrn und über seine Auferstehung, in vollem Vertrauen auf alle Barmherzigkeit. Ich grüße diese Gemeinde im Blut Jesu Christi, das ewige und bleibende Freude ist – besonders dann, wenn ihre Glieder mit dem Bischof, den Presbytern bei ihm und den Diakonen eins sind. Diese sind nach dem Willen Jesu Christi eingesetzt; er hat sie nach seinem eigenen Willen durch seinen Heiligen Geist gefestigt und bestätigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung am griechischen Text steht noch aus. Der griechische Satzbau kann insbesondere beim Bezug des letzten Relativsatzes weitere Präzisierung erfordern.
    reason: Die bereitgestellten Quelldaten kennzeichnen die Prüfung der griechischen Überlieferung ausdrücklich als noch ausstehend; diese Einschränkung ist für eine quellenkritisch verantwortete Veröffentlichung wesentlich.
lexical_decisions:
- source_word: Theophorus
  choice: Theophorus
  rationale: Der Beiname wird als Eigenname transliteriert, da sowohl die aktive Bedeutung »Gottesträger« als auch die passive Bedeutung »von Gott getragen« möglich ist.
- source_word: church
  choice: Gemeinde
  rationale: »Gemeinde« bezeichnet hier natürlich und verständlich die örtliche christliche Gemeinschaft, ohne den institutionellen Sinn von »Kirche« auszuschließen.
- source_word: passion
  choice: Leiden
  rationale: Im christologischen Zusammenhang meint der Ausdruck das Leiden Jesu; »Passion« wäre im heutigen Deutsch weniger unmittelbar verständlich.
- source_word: presbyters
  choice: Presbyter
  rationale: Der historische Amtsbegriff bleibt erhalten und wird nicht vorschnell mit einer später konfessionell geprägten Amtsbezeichnung gleichgesetzt.
- source_word: according to the mind of Jesus Christ
  choice: nach dem Willen Jesu Christi
  rationale: »Wille« gibt den gemeinten Sinn im Deutschen idiomatisch wieder; »Gesinnung« wäre ebenfalls möglich, klingt bei einer Einsetzung jedoch weniger natürlich.
theological_decisions:
- issue: Bezug von »whom ... He confirmed and established«
  choice: Das Pronomen wird auf Bischof, Presbyter und Diakone als gemeinsam genannte Amtsträger bezogen.
  alternative: Der Relativsatz könnte enger nur auf die unmittelbar zuvor genannten Diakone bezogen werden.
  rationale: Die überlieferte englische Satzstruktur lässt den Bezug nicht völlig eindeutig erkennen; der weitere Kontext der ignatianischen Amtstrias legt den gemeinsamen Bezug nahe, ohne die Alternative auszuschließen.
- issue: Subjekt von »he confirmed and established«
  choice: »er« wird auf Jesus Christus bezogen.
  alternative: Ein unausgesprochener Bezug auf Gott könnte erwogen werden.
  rationale: Jesus Christus ist das nächstliegende ausdrücklich genannte maskuline Bezugswort und wird unmittelbar zuvor mit seinem Willen verbunden.
- issue: »in the blood of Jesus Christ«
  choice: Die metaphorisch-sakramentale Formulierung bleibt wörtlich als »im Blut Jesu Christi« erhalten.
  alternative: Eine erklärende Wiedergabe wie »kraft des Blutes Jesu Christi« wäre möglich.
  rationale: Die offene theologische Bildsprache soll nicht auf eine einzige Deutung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Grußsatz wurde zur besseren Verständlichkeit behutsam gegliedert. Historische Amtsbezeichnungen und theologisch dichte Bilder wurden bewahrt; altertümliche Formen wurden vermieden.
