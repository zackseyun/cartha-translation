review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Der abschließende Relativsatz folgt im englischen Zeugen unmittelbar auf »die Diakone« und sollte nicht ohne Kennzeichnung auf Bischof, Presbyter und Diakone insgesamt ausgedehnt werden. Die vorliegende Fassung macht diese strittige bzw. noch nicht direkt am Griechischen geprüfte Zuordnung zu bestimmt. Außerdem ist »in vollem Vertrauen auf alle Barmherzigkeit« semantisch und syntaktisch weniger nah am Zeugen als eine Formulierung des Sich-gewiss-Seins.'
  naturalness: Die Gliederung des langen Grußes ist grundsätzlich gut und der Registerton angemessen. »in vollem Vertrauen auf alle Barmherzigkeit« klingt jedoch im Deutschen unidiomatisch. »die Presbyter bei ihm« kann ohne Relativsatz missverständlich wirken; »die bei ihm sind« ist klarer. Die Umstellung des letzten Satzes verbessert zugleich Lesbarkeit und Anschluss.
  terminology: »Gemeinde«, »Leiden«, »Presbyter« und »Diakone« sind angemessen. »Eintracht Gottes« ist verständlich, aber »Einklang Gottes« gibt concord näher und idiomatischer wieder. »Erbarmen« wird für mercy beibehalten; die Formulierung vermeidet eine dogmatisch einengende Deutung.
  issues:
  - severity: medium
    issue: Der Bezug von »Diese ... er hat sie« wird auf die gesamte Amtstrias festgelegt.
    rationale: Der öffentliche englische Text setzt den Relativsatz direkt bei den Diakonen an. Ohne direkte griechische Prüfung ist eine Ausweitung auf alle drei Gruppen nicht sicher; die Übersetzung soll den unmittelbaren Bezug wiedergeben und die Vorläufigkeit dokumentieren.
  - severity: medium
    issue: »in vollem Vertrauen auf alle Barmherzigkeit« gibt »being fully assured in all mercy« nur ungenau wieder.
    rationale: Das englische Zeugnis spricht von voller Gewissheit, nicht primär von Vertrauen. »sich aller Barmherzigkeit völlig gewiss« ist im Deutschen näher am Sinn und natürlich.
  - severity: low
    issue: Der Ausdruck »Eintracht Gottes« ist weniger idiomatisch und weniger nah an concord als möglich.
    rationale: »Einklang Gottes« wahrt die bildhafte bzw. relationale Offenheit von concord und klingt im modernen Standarddeutsch flüssiger.
  revised_text: Ignatius, der auch Theophorus heißt, an die Gemeinde Gottes, des Vaters, und Jesu Christi in Philadelphia in Asia. Sie hat Erbarmen gefunden, ist fest im Einklang Gottes gegründet und freut sich ohne Wanken über das Leiden unseres Herrn und über seine Auferstehung; sie ist sich aller Barmherzigkeit völlig gewiss. Diese Gemeinde grüße ich im Blut Jesu Christi, das ewige und bleibende Freude ist, besonders wenn ihre Glieder mit dem Bischof, den Presbytern, die bei ihm sind, und den Diakonen eins sind. Die Diakone sind nach dem Willen Jesu Christi eingesetzt; er hat sie nach seinem eigenen Willen durch seinen Heiligen Geist gefestigt und bestätigt.[a]
  revised_footnotes:
  - marker: a
    text: Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung am griechischen Text steht noch aus. Der letzte Relativsatz wird entsprechend seinem unmittelbaren Anschluss auf die Diakone bezogen. Der griechische Satzbau und seine Bezüge bedürfen noch einer direkten Prüfung.
    reason: Die Quelldaten weisen die griechische Prüfung als ausstehend aus. Da der letzte Relativsatz in der englischen Satzfolge direkt an »die Diakone« anschließt, bildet die Übersetzung diesen unmittelbaren Bezug ab, ohne eine weitergehende Auslegung der Amtstrias festzuschreiben.
  revision_rationale: Die Überarbeitung korrigiert den nicht ausreichend abgesicherten Bezug des letzten Relativsatzes, verbessert die Wiedergabe von »fully assured in all mercy« und glättet einzelne Formulierungen, ohne den Inhalt des Grußes zu verändern. Die nötige Vorläufigkeitsangabe bleibt als Fußnote am betroffenen Satz verankert.
