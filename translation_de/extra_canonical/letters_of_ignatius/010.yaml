base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: de
  text: 'Ich habe erfahren, dass einige Leute von dort durch eure Stadt gezogen sind und eine üble Lehre mitbrachten. Ihr habt ihnen aber nicht erlaubt, bei euch zu säen, sondern eure Ohren verschlossen, damit ihr den Samen, den sie säten, nicht annehmt. Denn ihr seid Steine eines Tempels des Vaters, im Voraus für ein Bauwerk Gottes, des Vaters, vorbereitet. Durch das Hebewerk Jesu Christi, das heißt das Kreuz, werdet ihr zur Höhe emporgehoben; dabei gebraucht ihr den Heiligen Geist als Seil, euren Glauben als Winde, und die Liebe ist der Weg, der zu Gott hinaufführt.


    So seid ihr alle Weggefährten: Gottesträger, Heiligtumsträger, Christusträger und Träger heiliger Dinge, in jeder Hinsicht mit den Geboten Jesu Christi geschmückt. Auch ich tanze durch den Brief mit euch und freue mich mit euch, damit ihr eure Liebe auf nichts nach der gewöhnlichen Lebensweise der Menschen setzt, sondern allein auf Gott.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evil doctrine (Greek review pending)
  choice: üble Lehre
  rationale: Gibt die moralisch und geistlich negative Wertung klar wieder, ohne mit „Irrlehre“ eine spätere dogmatische Fachkategorie einzutragen.
- source_word: engine / lifting device (Greek review pending)
  choice: Hebewerk
  rationale: Bewahrt das zusammenhängende Bild einer antiken Hebevorrichtung mit Seil und Winde und bleibt zugleich verständlich.
- source_word: windlass (Greek review pending)
  choice: Winde
  rationale: Bezeichnet das mechanische Zuggerät präzise und erhält die technische Metapher.
- source_word: companions in the way (Greek review pending)
  choice: Weggefährten
  rationale: Natürliches modernes Deutsch, das sowohl gemeinsames Unterwegssein als auch den möglicherweise geistlichen Sinn des Weges offenhält.
- source_word: shrine (Greek review pending)
  choice: Heiligtum
  rationale: Bewahrt den sakralen Sinn, ohne voreilig zwischen Tempel, Schrein oder einem innerlich getragenen Heiligtum zu entscheiden.
- source_word: holy things (Greek review pending)
  choice: heilige Güter
  rationale: Erhält die sachliche Mehrzahl und vermeidet eine konfessionell festgelegte sakramentale Deutung.
- source_word: festivity / celebration (Greek review pending)
  choice: Fest
  rationale: Gibt die freudige gemeinschaftliche Bildwelt knapp und würdig wieder.
theological_decisions:
- issue: Das Kreuz als Mittel der Erhöhung
  choice: „Durch das Hebewerk Jesu Christi – das Kreuz – werdet ihr zur Höhe emporgezogen“
  alternative: „durch die Maschine Jesu Christi, nämlich das Kreuz“
  rationale: Die Übersetzung erhält die ausdrückliche Gleichsetzung mit dem Kreuz und das Bau- beziehungsweise Hebebild, ohne daraus eine ausgearbeitete Erlösungslehre abzuleiten.
- issue: Die Gemeinde trägt Gott, Christus und Heiliges
  choice: Die auffällige Reihung bleibt wörtlich-sinnnah stehen.
  alternative: Umdeutung als bloßes Tragen Gottes im Herzen
  rationale: Die dichte sakrale Metaphorik soll nicht durch eine erklärende, theologisch verengende Paraphrase aufgelöst werden.
- issue: Abkehr vom gewöhnlichen menschlichen Leben
  choice: „weil ihr eure Liebe nicht auf etwas richtet, das zum gewöhnlichen menschlichen Leben gehört“
  alternative: „weil ihr nicht nach menschlicher Art lebt“
  rationale: Bewahrt den Gegenstand der Liebe und die Spannung zum gemeinsamen beziehungsweise gewöhnlichen Menschenleben, ohne Weltflucht oder eine bestimmte asketische Lehre ausdrücklich hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konsequenter Anrede im Plural. Die technische Hebemetaphorik wurde bewusst erhalten. Da nur ein englischer gemeinfreier Zeuge vorliegt und die Prüfung am mittelrezensionellen griechischen Text noch aussteht, sind besonders „von dort“, „Hebewerk“, „Heiligtum“, „heilige Güter“ und die Schlussformulierung als vorläufig zu überprüfen.
