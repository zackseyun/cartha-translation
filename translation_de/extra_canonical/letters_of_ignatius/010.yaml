revisions:
- from: 'Ich habe erfahren, dass einige Leute von dort bei euch durchgezogen sind und eine üble Lehre mitbrachten. Ihr habt ihnen jedoch nicht gestattet, in euch Samen auszustreuen; vielmehr habt ihr eure Ohren verschlossen, damit ihr den von ihnen ausgestreuten Samen nicht aufnehmt. Denn ihr seid Steine eines Tempels, im Voraus für den Bau Gottes, des Vaters, bereitet. Durch das Hebewerk Jesu Christi – das Kreuz – werdet ihr zur Höhe emporgezogen; als Seil dient euch der Heilige Geist, als Winde euer Glaube, und die Liebe ist der Weg, der zu Gott hinaufführt.


    So seid ihr alle Weggefährten und tragt euren Gott und euer Heiligtum, euren Christus und eure heiligen Güter mit euch; von Kopf bis Fuß seid ihr mit den Geboten Jesu Christi bekleidet. Auch ich darf an eurem Fest teilnehmen, euch durch diesen Brief begleiten und mich mit euch freuen, weil ihr eure Liebe nicht auf etwas richtet, das zum gewöhnlichen menschlichen Leben gehört, sondern allein auf Gott.'
  to: 'Ich habe erfahren, dass einige Leute von dort durch eure Stadt gezogen sind und eine üble Lehre mitbrachten. Ihr habt ihnen aber nicht erlaubt, bei euch zu säen, sondern eure Ohren verschlossen, damit ihr den Samen, den sie säten, nicht annehmt. Denn ihr seid Steine eines Tempels des Vaters, im Voraus für ein Bauwerk Gottes, des Vaters, vorbereitet. Durch das Hebewerk Jesu Christi, das heißt das Kreuz, werdet ihr zur Höhe emporgehoben; dabei gebraucht ihr den Heiligen Geist als Seil, euren Glauben als Winde, und die Liebe ist der Weg, der zu Gott hinaufführt.


    So seid ihr alle Weggefährten: Gottesträger, Heiligtumsträger, Christusträger und Träger heiliger Dinge, in jeder Hinsicht mit den Geboten Jesu Christi geschmückt. Auch ich tanze durch den Brief mit euch und freue mich mit euch, damit ihr eure Liebe auf nichts nach der gewöhnlichen Lebensweise der Menschen setzt, sondern allein auf Gott.'
  rationale: Die Revision stellt die ausdrücklich auf den Vater bezogenen Bauausdrücke wieder her, bewahrt die technische Metapher und macht die rhetorische Reihe der griechischen -φόροι-Komposita sichtbar. Sie korrigiert ferner den festlich-tänzerischen Sinn von συγχορεύω und den finalen Anschluss mit ἵνα. „Träger heiliger Dinge“ bleibt absichtlich offen, weil ἅγια hier ohne weiteren Kontext nicht konfessionell oder gegenständlich eingeengt werden sollte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:51:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Bau-/Hebemetaphorik sind gut bewahrt. Gegenüber dem griechischen Text der Mittelrezension sind jedoch mehrere Präzisierungen nötig: ναοῦ πατρός/οἰκοδομὴν θεοῦ πατρός sollte ausdrücklich den Vater als Bezug des Tempels und des Bauwerks erkennen lassen; συνοδίται meint Weggefährten; θεοφόροι, ναοφόροι, χριστοφόροι und ἁγιοφόροι sind eine absichtliche Reihe von Komposita mit der Bedeutung „-träger“. Besonders ἁγιοφόροι sollte nicht als bloßes Mitführen von „Gütern“ verflacht werden. συγχορεύω bezeichnet ursprünglich das Mittanzen bzw. den gemeinsamen Festtanz und darf nicht einfach zu einer Teilnahme an „eurem Fest“ umgedeutet werden. Der Schlusssatz hat ἵνα („damit“), nicht kausales „weil“.'
  naturalness: Das Deutsch ist überwiegend klar und würdig. „in euch Samen auszustreuen“ ist jedoch weniger idiomatisch als „bei euch zu säen“. Die Umstellung der technischen Bildglieder in einen einzigen Satz ist zwar verständlich, macht aber den Bezug von Seil, Winde und Weg etwas weniger transparent. „Heilige Güter“ klingt im heutigen Deutsch materiell und verwaltungssprachlich.
  terminology: '„Üble Lehre“, „Hebewerk“, „Winde“, „Heiliger Geist“ und „Heiligtum“ sind im gegebenen Kontext vertretbar. Für die vierfache σειρά der Träger-Komposita ist eine formnahe Wiedergabe vorzuziehen: „Gottesträger, Heiligtumsträger, Christusträger und Träger heiliger Dinge“. Das erhält die ungewöhnliche Rhetorik, ohne festzulegen, ob ἅγια kultische Gegenstände, Heiliges im Allgemeinen oder gegebenenfalls Heilige meint.'
  issues:
  - severity: medium
    issue: Tempel und Bauwerk werden nicht ausdrücklich Gott dem Vater zugeordnet.
    rationale: Der griechische Wortlaut enthält sowohl ναοῦ πατρός als auch οἰκοδομὴν θεοῦ πατρός. „Steine eines Tempels ... für den Bau Gottes, des Vaters“ schwächt den ersten Bezug ab und ist syntaktisch weniger eindeutig.
  - severity: medium
    issue: Die Reihe der „Träger“-Komposita ist paraphrasiert und bei ἁγιοφόροι semantisch verengt.
    rationale: θεοφόροι, ναοφόροι, χριστοφόροι, ἁγιοφόροι bilden eine bewusst parallele Reihe. „tragt ... mit euch“ gibt die Grundidee wieder, aber „heilige Güter“ führt eine materielle Lesart ein, die der griechische Ausdruck nicht erzwingt.
  - severity: medium
    issue: „Auch ich darf an eurem Fest teilnehmen“ gibt συγχορεύω zu frei wieder.
    rationale: Das Verb bezeichnet gemeinsames Tanzen, insbesondere im festlichen Kontext. Der Brief ist das Mittel, durch das Ignatius sich ihnen anschließt; er wird nicht als Einladung zur Teilnahme an ihrem Fest dargestellt.
  - severity: high
    issue: „weil ihr eure Liebe nicht ... richtet“ ersetzt den finalen Sinn von ἵνα durch eine Begründung.
    rationale: 'Der Satz drückt Zweck bzw. Ermahnungsziel aus: „damit ihr eure Liebe auf nichts ... richtet/auf nichts ... setzt“. Dies ist eine sinnrelevante syntaktische Änderung.'
  - severity: low
    issue: „in euch Samen auszustreuen“ ist unnatürlich.
    rationale: Für σπεῖραι εἰς ὑμᾶς ist „bei euch zu säen“ im modernen Deutsch idiomatischer und bewahrt das Bild.
  revised_text: 'Ich habe erfahren, dass einige Leute von dort durch eure Stadt gezogen sind und eine üble Lehre mitbrachten. Ihr habt ihnen aber nicht erlaubt, bei euch zu säen, sondern eure Ohren verschlossen, damit ihr den Samen, den sie säten, nicht annehmt. Denn ihr seid Steine eines Tempels des Vaters, im Voraus für ein Bauwerk Gottes, des Vaters, vorbereitet. Durch das Hebewerk Jesu Christi, das heißt das Kreuz, werdet ihr zur Höhe emporgehoben; dabei gebraucht ihr den Heiligen Geist als Seil, euren Glauben als Winde, und die Liebe ist der Weg, der zu Gott hinaufführt.


