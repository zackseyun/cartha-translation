translation:
  language: de
  text: '1. Sie wurde zum allumfassenden Mutterschoß, denn sie ist diejenige, die vor ihnen allen da ist: der Mutter-Vater, der Urmensch, der heilige Geist, die dreifach männliche, dreifach mächtige, dreifach benannte androgyne Gestalt, der ewige Äon unter den Unsichtbaren, ja, die Erste, die hervorging.


    2. ‹Sie› bat den unsichtbaren, jungfräulichen Geist – das heißt Barbelo –, ihr Vorerkenntnis zu gewähren, und der Geist stimmte zu.


    3. Als er [zugestimmt hatte], trat die Vorerkenntnis hervor und gesellte sich zur Vorsehung, die aus dem Gedanken des unsichtbaren, jungfräulichen Geistes hervorgeht.


    4. Sie pries ihn [und] seine vollkommene Kraft, Barbelo, weil sie ihretwegen ins Dasein gekommen waren.[a]


    5. Wieder bat sie ihn, ihr [Unvergänglichkeit] zu gewähren, und er stimmte zu.


    6. Als er [zugestimmt hatte], trat die Unvergänglichkeit [hervor] und gesellte sich zum Gedanken und zur Vorerkenntnis.


    7. Sie pries den Unsichtbaren und Barbelo, um derentwillen sie ins Dasein gekommen waren.[b]


    8. Barbelo bat ihn auch, ihr ewiges Leben zu gewähren, und der unsichtbare Geist stimmte zu. Als er zugestimmt hatte, trat das Ewige Leben hervor,


    9. und sie [gesellten sich hinzu] und priesen den unsichtbaren [Geist] und Barbelo, um derentwillen sie ins Dasein gekommen waren.


    10. Wieder bat sie ihn, ihr Wahrheit zu gewähren. Und [er stimmte zu]; als [er] zugestimmt hatte,


    11. trat die Wahrheit hervor, und sie gesellten sich hinzu und priesen den unsichtbaren, bewundernswerten Geist und seine Barbelo, um derentwillen sie ins Dasein gekommen waren.


    12. Dies ist die äonische Fünfheit des Vaters, die der Urmensch ist, das Abbild des unsichtbaren Geistes.[c]


    13. Dies sind die Vorsehung – das heißt Barbelo –, der Gedanke, die Vorerkenntnis, die Unvergänglichkeit, das Ewige Leben und die Wahrheit.[d]


    14. Dies ist die androgyne äonische Fünfheit, die äonische Zehnheit, die der Vater ist.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezüge der Pronomen sind im überlieferten Wortlaut nicht durchgehend eindeutig. Die Übersetzung bewahrt den Wechsel zwischen Barbelo („sie“) und dem Geist („er“).
    reason: Bewahrt eine echte referenzielle und geschlechtliche Mehrdeutigkeit.
  - marker: b
    text: Wörtlich kann die Formulierung sowohl Barbelo allein als auch den Unsichtbaren und Barbelo gemeinsam als Ursprung meinen; der Zusammenhang lässt dies offen.
    reason: Kennzeichnet die mögliche Mehrzahlbeziehung von „um derentwillen“.
  - marker: c
    text: „Äonisch“ bezeichnet hier nicht nur zeitliche Ewigkeit, sondern die Zugehörigkeit zur unsichtbaren göttlichen Äonenwelt.
    reason: Erläutert einen für heutige Leser ungewohnten kosmologischen Fachbegriff.
  - marker: d
    text: Die Aufzählung nennt neben Barbelo fünf weitere Größen. Wie genau diese Liste als „Fünfheit“ gezählt wird, erklärt der Text nicht ausdrücklich.
    reason: Macht auf eine überlieferte Zählspannung aufmerksam, ohne sie zu harmonisieren.
  - marker: e
    text: Die „Zehnheit“ kann die androgyne Doppelgestalt der fünf Äonen voraussetzen; der vorliegende Wortlaut entfaltet diese Zählweise jedoch nicht.
    reason: Bietet eine vorsichtige Verständnishilfe und wahrt zugleich die Unsicherheit.
lexical_decisions:
- source_word: universal womb
  choice: allumfassender Mutterschoß
  rationale: „Mutterschoß“ wahrt die gebärende Bildsprache und klingt im Deutschen würdiger und natürlicher als das anatomisch engere „Gebärmutter“.
- source_word: Mother-Father
  choice: Mutter-Vater
  rationale: Die ungewöhnliche Doppelform wird beibehalten, um die androgyne Spannung des Titels nicht aufzulösen.
- source_word: Primal Man / Primal Human
  choice: Urmensch
  rationale: Der etablierte, geschlechtsübergreifend deutbare religionsgeschichtliche Ausdruck gibt die archetypische menschliche Gestalt wieder, ohne sie zu einem gewöhnlichen „Mann“ zu verengen.
- source_word: aeon / aeonic
  choice: Äon / äonisch
  rationale: Der Fachbegriff bleibt erhalten, da „Zeitalter“ die hier personhaft-kosmologische Bedeutung nicht ausreichend trägt.
- source_word: Precognition
  choice: Vorerkenntnis
  rationale: Bezeichnet vorgängiges Wissen beziehungsweise Erkennen und bleibt von „Vorsehung“ klar unterschieden.
- source_word: Providence
  choice: Vorsehung
  rationale: Gängige deutsche Entsprechung für eine personifizierte lenkende Fürsorge; die Großschreibung ergibt sich ohnehin aus der Substantivierung.
- source_word: Idea
  choice: Gedanke
  rationale: „Gedanke“ ist natürlich verständlich und lässt die personifizierte geistige Hervorbringung erkennen; „Idee“ wäre möglich, klänge aber abstrakter und stärker platonisierend.
- source_word: Indestructibility
  choice: Unvergänglichkeit
  rationale: Gibt die Eigenschaft dauernden, nicht dem Vergehen unterworfenen Seins in idiomatischem theologischen Deutsch wieder.
- source_word: pentad / decad
  choice: Fünfheit / Zehnheit
  rationale: Die deutschen Bildungen bewahren die technische Zählstruktur, sind aber verständlicher als bloß transkribierte Fremdwörter.
- source_word: attended
  choice: gesellte sich zu / gesellten sich hinzu
  rationale: Der Kontext beschreibt das Hinzutreten zu einer geordneten Gruppe; „diente“ oder „wartete auf“ würde eine nicht gesicherte Unterordnung eintragen.
theological_decisions:
- issue: Wechselnde Geschlechtsbezüge bei Barbelo und dem Geist
  choice: Die femininen Bezüge auf Barbelo und die maskulinen Bezüge auf den Geist werden entsprechend dem Zeugen bewahrt.
  alternative: Alle Pronomen an das grammatische Geschlecht von „Geist“ oder an eine einheitliche Identität angleichen.
  rationale: Der Text verbindet Barbelo, Mutter-Vater und jungfräulichen Geist in spannungsvoller Weise. Eine Vereinheitlichung würde die androgyne und relationale Mehrdeutigkeit dogmatisch glätten.
- issue: Identifikation des unsichtbaren, jungfräulichen Geistes mit Barbelo in Vers 2
  choice: Die Apposition „das heißt Barbelo“ bleibt unverändert stehen.
  alternative: Sie als Erklärung des Gebetsadressaten umformulieren oder aufgrund möglicher textlicher Spannung korrigieren.
  rationale: Die überlieferte Aussage ist in sich spannungsvoll und gegenüber den folgenden Rollen nicht leicht aufzulösen; die Übersetzung darf diese Spannung nicht beseitigen.
- issue: „Vater“ als Bezeichnung der androgynen Fünfheit/Zehnheit
  choice: Die Aussagen „die der Vater ist“ werden formal bewahrt.
  alternative: „die zum Vater gehört“ oder „die vom Vater stammt“ übersetzen.
  rationale: Der Ausgangstext formuliert Identität, nicht bloß Zugehörigkeit oder Herkunft. Eine abschwächende Paraphrase würde die kosmologische Aussage verändern.
- issue: Zählung der Fünfheit und Zehnheit
  choice: Die scheinbar schwierige Aufzählung und die Gleichsetzung von Fünfheit und Zehnheit bleiben erhalten.
  alternative: Die Liste rechnerisch harmonisieren oder einzelne Größen als Untergliederungen kennzeichnen.
  rationale: Die Zählweise hängt vermutlich mit androgynen Paarungen beziehungsweise äonischer Struktur zusammen, wird im vorliegenden Abschnitt aber nicht ausdrücklich erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Ergänzungszeichen ‹…› und […] wurden bewahrt. Wegen der noch ausstehenden direkten Prüfung des koptischen Textes ist der Entwurf ausdrücklich zeugenbasiert; syntaktische und pronominale Spannungen wurden nicht stillschweigend harmonisiert.
