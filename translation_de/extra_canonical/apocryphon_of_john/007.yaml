translation:
  language: de
  text: '**Apokryphon des Johannes — Die vier Lichter**


    1. Auch das ewige Leben mit seinem Willen sowie der Verstand mit dem Vorherwissen dienten dem unsichtbaren Geist und Barbelo und priesen sie, denn sie waren um ihretwillen ins Dasein gekommen.[a]


    2. Gemeinsam mit Barbelo vollendete der heilige Geist auch den selbsterzeugten Gott, seinen Sohn, damit er dem großen, unsichtbaren, jungfräulichen Geist diene: dem selbsterzeugten Gott, dem Christus, den er mit lauter Stimme gepriesen hatte.[b]


    3. Durch die Vorsehung ging er hervor, und der unsichtbare, jungfräuliche Geist setzte den wahrhaft selbsterzeugten Gott über das All.


    4. Er unterwarf ihm auch jede Macht und ließ die Wahrheit in ihm sein, damit er das All erkenne — er, der mit einem Namen benannt worden war, der über jeden Namen erhaben ist. Denn dieser Name wird denen genannt werden, die seiner würdig sind.


    5. Denn aus dem Licht, das Christus ist, und aus der Unvergänglichkeit, durch die Gabe des Geistes und die vier [großen] Lichter von dem selbsterzeugten Gott [...].[c] Er wartete darauf, dass sie ihm dienten:


    6. die drei: Wille, Gedanke und Leben;


    7. und die vier Kräfte: Erkenntnis, Gnade, Wahrnehmung und Unterscheidungsvermögen.


    8. Die Gnade wiederum gehört zum Licht-Äon[d] Armozel — er ist der erste Engel. Mit diesem Äon sind drei weitere Äonen verbunden: Gnade, Wahrheit und Gestalt.


    9. Dann kommt das zweite Licht, Oriael, das über den zweiten Äon eingesetzt worden war.


    10. Mit ihm sind drei weitere Äonen verbunden: Nachdenken, Wahrnehmung und Erinnerung.


    11. Das dritte Licht wiederum ist Daveithai, das über den dritten Äon eingesetzt worden ist. Mit ihm sind drei weitere Äonen verbunden: Erkenntnis, Liebe und Urgestalt.


    12. Der vierte Äon wiederum wurde über das vierte Licht, Eleleth, eingesetzt.


    13. Mit ihm sind drei weitere Äonen verbunden: Vollkommenheit, Friede und Sophia.[e]


    14. Dies sind die vier Lichter, die dem selbsterzeugten Gott dienen.


    15. Dies sind die zwölf Äonen, die durch den Willen und die Gabe des unsichtbaren Geistes dem Sohn des Mächtigen dienen, dem Selbsterzeugten, Christus. Und die zwölf Äonen gehören zum selbsterzeugten Sohn.


    16. Alles wurde durch den Willen des heiligen Geistes mittels des Selbsterzeugten geordnet.


    **Fußnoten**


    [a] Die Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des koptischen Textes steht noch aus.


    [b] Die syntaktische Zuordnung von „dem selbsterzeugten Gott, dem Christus“ und des anschließenden Relativsatzes ist im vorliegenden Textzeugen mehrdeutig. Die Übersetzung lässt diese Spannung bestehen.


    [c] Der Satz ist im überlieferten Text beschädigt beziehungsweise unvollständig. Eckige Klammern kennzeichnen eine Ergänzung, die Auslassungspunkte eine Lücke.


    [d] Ein „Äon“ bezeichnet hier eine überweltliche Größe oder einen Bereich der göttlichen Wirklichkeit; das Wort wird als Fachbegriff beibehalten.


    [e] „Sophia“ ist das griechische Wort für „Weisheit“ und wird hier als Name beziehungsweise personifizierte Größe beibehalten.'
