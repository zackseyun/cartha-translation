lexical_decisions:
- source_word: self-generated
  choice: selbsterzeugt / der Selbsterzeugte
  rationale: Bewahrt den kosmologischen Fachbegriff und unterscheidet ihn von gewöhnlicher Zeugung oder Schöpfung, ohne ihn konfessionell umzudeuten.
- source_word: the All
  choice: das All
  rationale: Gibt die umfassende kosmologische Gesamtheit knapp und traditionsnah wieder.
- source_word: attend
  choice: dienen
  rationale: Passt sowohl zu den personifizierten Kräften als auch zu den vier Lichtern und zwölf Äonen; die relationale Unterordnung bleibt erkennbar.
- source_word: Mind
  choice: Verstand
  rationale: Bezeichnet eine personifizierte geistige Größe, ohne sie mit dem benachbarten Begriff Erkenntnis gleichzusetzen.
- source_word: Precognition
  choice: Vorherwissen
  rationale: Gibt das Wissen um Zukünftiges beziehungsweise Vorauswissen transparent wieder.
- source_word: Providence
  choice: Vorsehung
  rationale: Etablierter deutscher Ausdruck für eine personifizierte ordnende Fürsorge in antiken religiösen Texten.
- source_word: Idea
  choice: Gedanke
  rationale: Natürliches modernes Deutsch; vermeidet die zu stark philosophisch festgelegte Wiedergabe „Idee“, ohne die Personifikation aufzulösen.
- source_word: Understanding
  choice: Erkenntnis
  rationale: Markiert eine geistige Erkenntniskraft; die genaue Abgrenzung zu Mind und Perception bleibt aufgrund der indirekten Textgrundlage vorläufig.
- source_word: Discretion
  choice: Unterscheidungsvermögen
  rationale: Drückt prüfende geistige Unterscheidung verständlich aus und vermeidet das moderne Missverständnis von „Diskretion“.
- source_word: Form / Ideal Form
  choice: Gestalt / Urgestalt
  rationale: Bewahrt die begriffliche Verwandtschaft und unterscheidet zugleich die ideale oder ursprüngliche Form von bloßer äußerer Form.
- source_word: aeon
  choice: Äon
  rationale: Der Fachbegriff deckt hier sowohl personifizierte überweltliche Größen als auch deren Bereiche ab; eine eindeutige Festlegung auf „Zeitalter“ wäre irreführend.
- source_word: Sophia
  choice: Sophia
  rationale: Als Eigenname oder personifizierte Größe beibehalten; die Bedeutung „Weisheit“ wird in der Fußnote erläutert.
theological_decisions:
- issue: Identität und grammatische Zuordnung in Vers 2
  choice: Die Appositionen und der Relativsatz bleiben syntaktisch offen.
  alternative: Christus eindeutig mit dem Sohn, dem jungfräulichen Geist oder dem selbsterzeugten Gott identifizieren.
  rationale: Der bereitgestellte Textzeuge ist syntaktisch mehrdeutig; eine eindeutige dogmatische Zuordnung wäre nicht textlich gesichert.
- issue: Status des Selbsterzeugten
  choice: Der Ausdruck wird als Titel beziehungsweise Wesensbezeichnung wiedergegeben.
  alternative: Mit „der Eingeborene“, „der Ungezeugte“ oder „der Schöpfer“ übersetzen.
  rationale: Diese Alternativen würden andere theologische Kategorien eintragen und die besondere Terminologie des Textes verwischen.
- issue: Kosmologische Bedeutung der Äonen
  choice: „Äon“ wird nicht abschließend als Person, Ort oder Zeitraum festgelegt.
  alternative: Durchgehend „Wesen“, „Welt“ oder „Zeitalter“ verwenden.
  rationale: Der Abschnitt verwendet den Begriff in einer Weise, die mehrere dieser Aspekte berühren kann; die echte Spannung soll erhalten bleiben.
- issue: Beschädigter Zusammenhang in Vers 5
  choice: Das Fragment bleibt als grammatisch unvollständiger Satz stehen.
  alternative: Den fehlenden Gedankengang konjektural ergänzen und syntaktisch glätten.
  rationale: Ohne direkte Prüfung der koptischen Handschriften wäre eine Ergänzung spekulativ und könnte die kosmologische Aussage verändern.
- issue: Geist-Terminologie und Großschreibung
  choice: „heiliger Geist“ und „unsichtbarer Geist“ werden substantivisch, aber nicht konfessionell vereinheitlicht wiedergegeben.
  alternative: Alle Vorkommen als feste trinitarische Eigennamen großschreiben und identifizieren.
  rationale: Der Text besitzt seine eigene kosmologische Terminologie; eine spätere dogmatische Systematisierung wird nicht vorausgesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überschaubaren Sätzen und beibehaltenen kosmologischen Fachbegriffen. Wiederholungen des Ausgangstextes wurden weitgehend bewahrt, während Aufzählungen und Übergänge behutsam idiomatisiert wurden. Die textliche Beschädigung in Vers 5 und die syntaktische Mehrdeutigkeit in Vers 2 wurden nicht stillschweigend geglättet. Da eine direkte Prüfung des Koptischen noch aussteht, ist der Entwurf ausdrücklich vorläufig.
