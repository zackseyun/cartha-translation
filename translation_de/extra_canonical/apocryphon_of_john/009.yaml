translation:
  language: de
  text: 'Weiter dachte Sophia der Besinnung, da sie ein Äon war, aus sich selbst heraus einen Gedanken, zusammen mit dem Gedanken des unsichtbaren Geistes und der Vorerkenntnis.


    Sie wollte aus sich selbst ein Abbild hervorbringen, ohne die Zustimmung des Geistes, der es nicht gebilligt hatte, und ohne ihren Gefährten und ohne seine Beratung, obwohl die Seite ihrer Männlichkeit dem nicht zugestimmt hatte.


    So brachte sie hervor, obwohl sie ihren Gefährten nicht gefunden und ohne die Zustimmung des Geistes und ohne das Wissen ihres Gefährten überlegt hatte. Wegen der unverwundbaren Kraft, die in ihr wohnte,


    blieb ihr Gedanke nicht unfruchtbar. Sie brachte aus sich selbst etwas hervor, das unvollkommen war und sich von ihrer eigenen Gestalt unterschied; denn sie hatte ihn ohne ihren Gefährten erschaffen. Er unterschied sich von der Gestalt seiner Mutter, weil er eine andere Form besaß.


    Als sie nun das Ergebnis ihres eigenen Willens sah, nahm er die Gestalt eines Drachen mit Löwengesicht an,[a]


    und seine Augen glichen flammenden Blitzen, die aufzucken.


    Sie stieß ihn von sich fort, hinaus aus jenen Bereichen, damit keiner der Unsterblichen ihn sehen konnte; denn sie hatte ihn in Unwissenheit erschaffen.


    Dann umgab sie ihn mit einer leuchtenden Wolke und errichtete mitten in der Wolke einen Thron, damit niemand ihn sehen konnte außer dem heiligen Geist, dessen Name »Mutter der Lebenden« ist. Und sie gab ihm den Namen Jaldabaoth.[b]


    Dieser ist der oberste Archon.[c] Er erlangte von seiner Mutter eine gewaltige Kraft,


    löste sich von ihr und entfernte sich von den Bereichen, in denen er geboren worden war.'
