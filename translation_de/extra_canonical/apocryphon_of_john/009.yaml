    reason: Der Fachbegriff wird im Haupttext bewahrt und für gewöhnliche Leser erklärt.
lexical_decisions:
- source_word: Sophia of Reflection
  choice: Sophia der Besinnung
  rationale: Der Eigenname Sophia bleibt erhalten; »Besinnung« gibt die reflektierende geistige Tätigkeit natürlicher wieder als das missverständliche »Reflexion«.
- source_word: aeon
  choice: Äon
  rationale: Der kosmologische Fachbegriff wird transliteriert, statt ihn vorschnell als bloßen Zeitraum zu deuten.
- source_word: likeness
  choice: Abbild
  rationale: »Abbild« bezeichnet eine hervorgebrachte Entsprechung, ohne vollständige Gleichheit zu behaupten.
- source_word: companion
  choice: Gefährte
  rationale: Die relationale Bedeutung bleibt gewahrt, ohne eine eheliche oder sexuelle Beziehung festzulegen.
- source_word: face of her maleness
  choice: Seite ihrer Männlichkeit
  rationale: Die schwierige Wendung wird bewusst nicht geglättet; »Seite« bewahrt die Vorstellung eines männlichen Aspekts, ohne »Gesicht« im Deutschen unverständlich wörtlich zu reproduzieren.
- source_word: lion-faced dragon form
  choice: Gestalt eines Drachen mit Löwengesicht
  rationale: Beide Bildelemente des Zeugen werden erhalten und zu einer verständlichen deutschen Nominalgruppe verbunden.
- source_word: chief archon
  choice: oberster Archon
  rationale: »Archon« bleibt als technischer kosmologischer Titel stehen; »oberster« gibt den Rang an.
- source_word: procured
  choice: erlangte
  rationale: Die Formulierung bezeichnet den Erwerb der Kraft, ohne genauer festzulegen, ob er sie empfing oder an sich nahm.
theological_decisions:
- issue: Sophias Hervorbringen ohne Zustimmung
  choice: Die wiederholten Hinweise auf fehlende Zustimmung, Beratung und Kenntnis werden beibehalten.
  alternative: Die Passage zu einer eindeutigen moralischen Verfehlung oder Rebellion zusammenzufassen.
  rationale: Der Text beschreibt ein eigenmächtiges und unwissendes Hervorbringen, legt dessen dogmatische Bewertung aber nicht vollständig fest.
- issue: Geschlechtssprache für Sophia und ihr Hervorgebrachtes
  choice: Sophia wird feminin, das hervorgebrachte Wesen anschließend maskulin bezeichnet.
  alternative: Durchgehend sächliche oder geschlechtsneutrale Bezeichnungen zu verwenden.
  rationale: Damit bleiben die mütterliche Bildsprache und der Wechsel zum männlich bezeichneten Jaldabaoth erhalten.
- issue: Identität des heiligen Geistes
  choice: »der heilige Geist, dessen Name ›Mutter der Lebenden‹ ist«
  alternative: Die Aussage an eine trinitarische Standardformel anzugleichen oder »Geist« feminin wiederzugeben.
  rationale: Die ungewöhnliche Benennung des Textes wird ohne konfessionelle Harmonisierung bewahrt.
- issue: Unvollkommenheit des hervorgebrachten Wesens
  choice: »unvollkommen«
  alternative: »missgestaltet«, »böse« oder »mangelhaft«
  rationale: »Unvollkommen« wahrt die ontologische Unvollständigkeit, ohne ausdrücklich moralische Bosheit einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenen gnostisch-kosmologischen Fachbegriffen. Die syntaktischen Wiederholungen des Zeugen wurden soweit erhalten, wie sie den eigenmächtigen Vorgang betonen, zugleich aber für flüssiges Deutsch gegliedert. Der Entwurf ist vorläufig, da eine direkte Prüfung der koptischen Handschriften noch aussteht; die eingeschobene Seitenzahl des Zeugen wurde nicht übernommen.
