review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf bewahrt die Abfolge und die wesentlichen gnostisch-kosmologischen Begriffe weitgehend. Mehrere Eingriffe entfernen sich jedoch unnötig vom vorliegenden Zeugen: »Seite ihrer Männlichkeit« ersetzt das explizite »Gesicht«, »Dann« ersetzt das additive »auch«, und die Namensform »Jaldabaoth« weicht im Haupttext von »Yaltabaoth« ab. Die Verknüpfung der unverwundbaren Kraft mit der Nicht-Unfruchtbarkeit des Gedankens sollte zudem syntaktisch klar erhalten bleiben.'
  naturalness: Die Sprache ist im Ganzen gut verständlich und angemessen würdig. Einige Formulierungen können zugleich genauer und idiomatisch bleiben, insbesondere durch »Gesicht ihrer Männlichkeit«, »jenseits jener Orte« und eine weniger stark umgestaltete Satzverknüpfung in der dritten Einheit.
  terminology: »Äon«, »Archon«, »Abbild«, »Gefährte«, »unvollkommen« und »Mutter der Lebenden« sind sachgerecht. »Yaltabaoth« sollte entsprechend dem zugrunde gelegten Zeugen im Text stehen; die verbreitete Variante »Jaldabaoth« kann in einer Anmerkung genannt werden. Die Fußnote zur Drachengestalt sollte nur den tatsächlich dokumentierten editorischen Vorbehalt des englischen Zeugen benennen, nicht pauschal eine komplexe handschriftliche Lage behaupten.
  issues:
  - severity: medium
    issue: »face of her maleness« ist als »Seite ihrer Männlichkeit« wiedergegeben.
    rationale: »Seite« ist keine naheliegende Entsprechung von »face« und verschiebt die schwierige, aber ausdrücklich bildhafte Formulierung. »Gesicht ihrer Männlichkeit« bewahrt die Fremdheit ohne zusätzliche Deutung.
  - severity: medium
    issue: Im Haupttext steht »Jaldabaoth« statt »Yaltabaoth«.
    rationale: Der vorliegende englische Zeuge bietet durchgehend »Yaltabaoth«. Eine alternative wissenschaftliche Transkription kann erläutert werden, soll aber nicht ohne textliche Grundlage den Haupttext ersetzen.
  - severity: low
    issue: Die Fußnote a behauptet eine komplexe handschriftliche Überlieferung.
    rationale: Aus den bereitgestellten Daten folgt lediglich ein redaktioneller Marker bei »dragon« im englischen Zeugen und eine noch ausstehende koptische Prüfung. Die Anmerkung sollte diesen engeren Befund transparent machen.
  - severity: low
    issue: »Dann« und die Satztrennung bei der unverwundbaren Kraft glätten die additive und kausale Verknüpfung des Zeugen.
    rationale: »Auch« sowie die direkte Verbindung von Kraft und nicht unfruchtbar bleibendem Gedanken geben den Aufbau des Zeugen präziser wieder.
  revised_text: 'Weiter fasste Sophia der Besinnung, da sie ein Äon war, für sich einen Gedanken, zusammen mit der Vorstellung des unsichtbaren Geistes und der Vorerkenntnis.



    Sie wollte aus sich selbst ein Abbild hervorbringen, ohne die Zustimmung des Geistes, der dies nicht gebilligt hatte, und ohne ihren Gefährten und ohne seine Beratung, obwohl das Gesicht ihrer Männlichkeit dies nicht gebilligt hatte.



    Weiter brachte sie hervor, obwohl sie ihren Gefährten nicht hatte finden können und ohne die Zustimmung des Geistes und das Wissen ihres Gefährten nachgedacht hatte; und wegen der unverwundbaren Kraft, die in ihr wohnte,



    blieb ihr Gedanke nicht unfruchtbar, und sie brachte aus sich selbst etwas hervor, das unvollkommen war und sich von ihrer eigenen Gestalt unterschied; denn sie hatte ihn ohne ihren Gefährten erschaffen, und er unterschied sich von der Gestalt seiner Mutter, weil er eine andere Form besaß.



    Als sie nun das Ergebnis ihres eigenen Willens sah, nahm er die Gestalt eines Drachen mit Löwengesicht an,[a]



    und seine Augen glichen Blitzen, die aufleuchteten.



    Sie stieß ihn von sich fort, hinaus aus jenen Orten, damit keiner der Unsterblichen ihn sehen konnte; denn sie hatte ihn in Unwissenheit erschaffen.



    Auch umgab sie ihn mit einer leuchtenden Wolke und errichtete inmitten der Wolke einen Thron, damit niemand außer dem heiligen Geist ihn sehen konnte, dessen Name »Mutter der Lebenden« ist; und sie gab ihm den Namen Yaltabaoth.[b]



    Dieser ist der oberste Archon.[c] Er erlangte von seiner Mutter eine gewaltige Kraft



    und löste sich von ihr und entfernte sich von den Orten, an denen er geboren worden war.'
