  revision_rationale: 'Die Revision ist auf zwei sichere Korrekturen beschränkt: V. 2 vermeidet eine übermäßig bestimmte Referenzzuweisung für „his powers“, und V. 7 gibt das zeitweilige Fortbestehen der Unbußfertigkeit ohne ergänztes Bezugsobjekt wieder. Die übrigen schwierigen Appositionen, Reihungen und Identifikationen werden nicht dogmatisch oder stilistisch harmonisiert.'
