translation:
  language: de
  text: '1. Ferner ging aus der Vorerkenntnis des vollkommenen Geistes durch die Offenbarung des Willens des unsichtbaren Geistes und des Willens des Selbsterzeugten der vollkommene Mensch hervor, die erste Offenbarung, nämlich die Wahrheit.


    2. Er ist es, den der jungfräuliche Geist Pigera-Adamas[a] nannte. Und er setzte ihn über den ersten Äon ein, zusammen mit dem Mächtigen, dem Selbsterzeugten, Christus, beim ersten Licht, Armozel, begleitet von dessen Mächten.[b]


    3. Ferner verlieh ihm der Unsichtbare eine geistige, unverletzliche Kraft.


    4. Da sprach er, erhob und pries den unsichtbaren Geist und sagte: »Deinetwegen ist das All ins Dasein hervorgegangen, und zu dir wird das All zurückkehren.


    5. Ich werde dich und den Selbsterzeugten erheben und preisen, ebenso die drei Äonen: den Vater, die Mutter, den Sohn, die vollkommene Kraft.«


    6. Auch seinen Sohn Seth setzte er über den zweiten Äon ein, vor dem zweiten Licht, Oroiel. Und im dritten Äon wurde der Same Seths über das dritte Licht, Daveithai, eingesetzt; darin wurden die Seelen der Heiligen untergebracht.


    7. Ferner wurden im vierten Äon die Seelen derer untergebracht, die die Fülle nicht kannten und nicht sogleich umkehrten, sondern eine Zeit lang darin verharrten und erst später umkehrten.


    8. Diese sind das vierte Licht, Eleleth.[c]


    9. Diese sind Geschöpfe, die den unsichtbaren Geist erheben.


    [a] Der Name wird in der Überlieferung auch als »Pigera-Adama(s)« wiedergegeben.

    [b] Die genaue syntaktische Zuordnung von »beim ersten Licht, Armozel« und »begleitet von dessen Mächten« ist im zugrunde liegenden Zeugnis unsicher.

    [c] Die ungewöhnliche Gleichsetzung im Plural (»Diese«) mit dem Singular »das vierte Licht« wurde bewahrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird in der Überlieferung auch als »Pigera-Adama(s)« wiedergegeben.
    reason: Die Namensform ist im bereitgestellten Zeugnis unsicher markiert.
  - marker: b
    text: Die genaue syntaktische Zuordnung von »beim ersten Licht, Armozel« und »begleitet von dessen Mächten« ist im zugrunde liegenden Zeugnis unsicher.
    reason: Verhindert, dass die deutsche Satzstruktur eine nicht gesicherte Beziehung als eindeutig erscheinen lässt.
  - marker: c
    text: Die ungewöhnliche Gleichsetzung im Plural (»Diese«) mit dem Singular »das vierte Licht« wurde bewahrt.
    reason: Dokumentiert eine bewusst nicht harmonisierte grammatische und sachliche Spannung.
lexical_decisions:
- source_word: Precognition
  choice: Vorerkenntnis
  rationale: Bewahrt den technischen Sinn einer vorausliegenden Erkenntnis besser als das stärker alltagssprachliche »Vorahnung«.
- source_word: Perfect Mind
  choice: vollkommener Geist
  rationale: »Geist« ist im religiös-philosophischen Kontext natürlicher als »Verstand«; die mögliche Nähe zu anderen Geistbezeichnungen bleibt erhalten.
- source_word: self-generated one
  choice: der Selbsterzeugte
  rationale: Gibt den technischen Titel substantiviert und ohne zusätzliche dogmatische Deutung wieder.
- source_word: aeon
  choice: Äon
  rationale: Der gnostische Fachbegriff wird beibehalten, da »Zeitalter« oder »Welt« die hier personell-räumliche Bedeutung verengen würde.
- source_word: the All
  choice: das All
  rationale: Bewahrt den kosmologischen Sammelbegriff und vermeidet eine vorschnelle Auflösung zu »alles« oder »die Schöpfung«.
- source_word: Fullness
  choice: die Fülle
  rationale: Traditionelle und verständliche Wiedergabe des technischen Begriffs, ohne ihn durch »Pleroma« unnötig zu verfremden.
- source_word: seed of Seth
  choice: Same Seths
  rationale: Erhält die kollektive und genealogische Metapher; »Nachkommen Seths« wäre eindeutiger, aber interpretierender.
- source_word: repent
  choice: umkehren
  rationale: »Umkehren« gibt die religiöse Sinnes- und Richtungsänderung natürlich wieder, ohne den Begriff auf bloße Reue zu beschränken.
- source_word: extol
  choice: erheben
  rationale: Unterscheidet das Verb soweit möglich von »preisen« und bewahrt den gehobenen hymnischen Ton.
theological_decisions:
- issue: Verhältnis des vollkommenen Menschen zu Wahrheit und erster Offenbarung
  choice: 'Apposition bewahrt: »der vollkommene Mensch …, die erste Offenbarung, nämlich die Wahrheit«'
  alternative: Die Ausdrücke als getrennte Hervorgänge oder als bloße Eigenschaften lesen
  rationale: Das Zeugnis legt eine appositionelle Identifikation nahe, bleibt aber syntaktisch schwierig; die Übersetzung glättet sie nicht zu einer systematischen Lehrformel.
- issue: Titel »Vater, Mutter, Sohn, die vollkommene Kraft«
  choice: Die Reihung und mögliche Spannung zwischen drei Äonen und vier Nominalausdrücken bleibt stehen
  alternative: »die vollkommene Kraft« eindeutig auf den Sohn oder auf die Dreiheit beziehen
  rationale: Eine eindeutige Zuordnung wäre theologisch interpretierend und wird vom vorliegenden Zeugnis nicht erzwungen.
- issue: Status der Seelen im vierten Äon
  choice: Das zeitweilige Verharren und die spätere Umkehr werden wörtlich bewahrt
  alternative: Das Verharren ausdrücklich als Unbußfertigkeit oder Sünde bezeichnen
  rationale: Der Ausgangstext deutet dies an, benennt aber den Gegenstand des Verharrens nicht ausdrücklich; eine Ergänzung würde die Ambiguität auflösen.
- issue: Identifikation mit Eleleth
  choice: »Diese sind das vierte Licht, Eleleth«
  alternative: »Sie gehören zum vierten Licht, Eleleth«
  rationale: Die ungewöhnliche Identifikation wird nicht harmonisiert, obwohl eine Zugehörigkeitslesart idiomatischer wäre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit beibehaltenen gnostischen Fachbegriffen. Der Entwurf ist vorläufig, da nur ein englisches Public-Domain-Zeugnis vorliegt und die direkte Prüfung der koptischen Handschriften noch aussteht. Die isolierte Seitenzahl »9« wurde als Manuskript-/Seitenangabe nicht in den Lesetext übernommen.
