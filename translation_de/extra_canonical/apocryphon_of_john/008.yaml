review_pass:
  verdict: revise
  source_fidelity: Im Wesentlichen folgt der Entwurf dem bereitgestellten englischen Zeugnis und bewahrt technische Begriffe sowie die Spannungen in V. 5 und 8. In V. 7 fügt jedoch „darin“ einen nicht ausdrücklich genannten Bezug hinzu und schwächt zugleich das ausdrücklich markierte fortgesetzte Nicht-Umkehren ab. V. 2 legt mit „dessen Mächten“ eine im Zeugnis gerade unsichere Zuordnung fest.
  naturalness: Der Text ist überwiegend klares, würdiges modernes Standarddeutsch. „eine Zeit lang darin verharrten“ ist ohne eindeutiges Bezugswort weniger präzise als eine Formulierung, die das fortgesetzte Nicht-Umkehren direkt ausdrückt.
  terminology: „Vorerkenntnis“, „Selbsterzeugter“, „Äon“, „das All“, „die Fülle“ und „Same Seths“ sind als behutsame Fachtermini angemessen. Die Namensformen und die nicht harmonisierte Aussage zu Eleleth bleiben gewahrt.
  issues:
  - severity: medium
    issue: 'V. 2: „begleitet von dessen Mächten“ bindet die Mächte an Armozel.'
    rationale: Das englische Zeugnis bietet lediglich „escorted by his powers“, während seine syntaktische Referenz unsicher ist. Das Demonstrativpronomen „dessen“ entscheidet diese Referenz im Deutschen stärker, als die Vorlage es erlaubt.
  - severity: medium
    issue: 'V. 7: „darin verharrten“ ergänzt einen Bezug und gibt das Fortfahren in Unbußfertigkeit nur indirekt wieder.'
    rationale: Die Vorlage sagt, dass die Betreffenden eine Zeit lang unrepentant fortfuhren und erst danach umkehrten. Ein nicht näher bestimmtes „darin“ ist weder im Zeugnis vorhanden noch semantisch nötig.
  revised_text: '1. Ferner ging aus der Vorerkenntnis des vollkommenen Geistes durch die Offenbarung des Willens des unsichtbaren Geistes und des Willens des Selbsterzeugten der vollkommene Mensch hervor, die erste Offenbarung, nämlich die Wahrheit.


    2. Er ist es, den der jungfräuliche Geist Pigera-Adamas[a] nannte. Und er setzte ihn über den ersten Äon ein, zusammen mit dem Mächtigen, dem Selbsterzeugten, Christus, beim ersten Licht, Armozel, begleitet von seinen Mächten.[b]


    3. Ferner verlieh ihm der Unsichtbare eine geistige, unverletzliche Kraft.


    4. Da sprach er, erhob und pries den unsichtbaren Geist und sagte: »Deinetwegen ist das All ins Dasein hervorgegangen, und zu dir wird das All zurückkehren.


    5. Ich werde dich und den Selbsterzeugten erheben und preisen, ebenso die drei Äonen: den Vater, die Mutter, den Sohn, die vollkommene Kraft.«


    6. Auch seinen Sohn Seth setzte er über den zweiten Äon ein, vor dem zweiten Licht, Oroiel. Und im dritten Äon wurde der Same Seths über das dritte Licht, Daveithai, eingesetzt; darin wurden die Seelen der Heiligen untergebracht.


    7. Ferner wurden im vierten Äon die Seelen derer untergebracht, die die Fülle nicht kannten und nicht sogleich umkehrten, sondern noch eine Zeit lang unbußfertig blieben und erst später umkehrten.


    8. Diese sind das vierte Licht, Eleleth.[c]


    9. Diese sind Geschöpfe, die den unsichtbaren Geist erheben.


    [a] Der Name wird in der Überlieferung auch als »Pigera-Adama(s)« wiedergegeben.


    [b] Die genaue syntaktische Zuordnung von »beim ersten Licht, Armozel« und »begleitet von seinen Mächten« ist im zugrunde liegenden Zeugnis unsicher.


    [c] Die ungewöhnliche Gleichsetzung im Plural (»Diese«) mit dem Singular »das vierte Licht« wurde bewahrt.'
