  language: de
  text: '**Apokryphon des Johannes – Das Schicksal der Seelen**


    1. Ich fragte den Erlöser auch: „Herr, werden dann alle Seelen sicher in das reine Licht geleitet werden?“


    2. Er antwortete mir: „Große Gedanken sind in dir aufgekommen; denn es ist schwer, sie anderen zu erklären – außer denen, die aus dem unbeweglichen Geschlecht stammen.[a]


    3. Diejenigen, auf die der Geist des Lebens herabkommt und denen er Kraft verleiht, werden gerettet und vollkommen werden. Sie werden der Größe würdig sein, und dort werden sie von allem Bösen und auch von jeder Beteiligung am Bösen gereinigt werden.


    4. Denn von nun an gilt ihre ganze Sorge allein der Unvergänglichkeit, auf die sie sich ausrichten. Zorn, Neid, Eifersucht, Begierde oder Habgier nach irgendetwas erfüllen sie nicht. Nichts bedrängt sie außer dem Zustand des Daseins im Fleisch. Diesen ertragen sie, während sie erwartungsvoll auf die Zeit warten, in der die Aufnehmenden sie willkommen heißen werden.[b]


    5. Solche Menschen sind also des unvergänglichen, ewigen Lebens und der Erwählung würdig; denn sie widerstehen allem und ertragen alles, damit sie den Wettkampf vollenden und das ewige Leben erben können.“


    6. Ich fragte ihn: „Herr, werden die Seelen derer, die diese Werke nicht vollbracht haben, auf die aber die Kraft ‹und› der Geist des Lebens herabgekommen waren, [verworfen] werden?“[c]


    7. Er antwortete mir: „Wenn der Geist auf sie herabgekommen ist, werden sie dennoch gerettet werden und sich bessern. Denn die Kraft wird auf alle Menschen herabkommen; ohne sie kann niemand standhalten.


    8. Wenn aber nach ihrer Geburt der Geist des Lebens zunimmt, die Kraft kommt und jene Seele stärkt, wird niemand sie durch böse Taten in die Irre führen können.


    9. Diejenigen dagegen, auf die der falsche Geist herabkommt, werden von ihm fortgerissen und in die Irre geführt.“


    10. Ich fragte: „Herr, wohin werden ihre Seelen gehen, wenn sie ihr Fleisch verlassen haben?“


    11. Er lächelte und sagte zu mir: „Die Seele, in der die Kraft stärker wird als der niederträchtige Geist, ist stark und flieht vor dem Bösen. Durch das Eingreifen des Unvergänglichen wird sie gerettet und zur Ruhe der Äonen emporgebracht werden.“[d]


    12. Ich fragte: „Herr, wo werden die Seelen derer bleiben, die nicht erkannt haben, wem sie gehören?“


    13. Er sagte zu mir: „Wenn in ihnen der niederträchtige Geist an Stärke zunahm, gerieten sie in die Irre. Er beschwert die Seele, zieht sie zu bösen Taten hinab und stürzt sie in die Vergessenheit. Nachdem sie den Leib verlassen hat, wird sie den Mächten übergeben, die durch den Archon entstanden sind. Sie fesseln sie mit Ketten, werfen sie ins Gefängnis und bewachen sie, bis sie aus der Vergessenheit erwacht und Erkenntnis erlangt. Wenn sie auf diese Weise vollkommen wird, wird sie gerettet werden.“


    14. Ich fragte: „Herr, wie kann die Seele kleiner werden und in den natürlichen Zustand ihrer Mutter oder in den Menschen zurückkehren?“[e]


    15. Er freute sich über meine Frage und sagte zu mir: „Wahrlich, du bist gesegnet; denn du hast verstanden, dass eine solche Seele einer anderen nachfolgen wird, in der der Geist des Lebens wohnt.[f]


    16. Durch ihn wird sie gerettet werden.


    17. Sie wird nicht noch einmal in ein anderes Fleisch geworfen werden.“


    18. Ich fragte auch: „Herr, wohin werden die Seelen derer gehen, die erkannt hatten, sich dann aber abgewandt haben?“


    19. Er sagte zu mir: „Sie werden an den Ort gebracht werden, an den die Engel der Armut gehen – an den Ort, an dem es keine Umkehr gibt. Dort werden sie bis zu dem Tag festgehalten, an dem diejenigen gepeinigt werden, die den Geist gelästert haben; und sie werden mit einer äonenlangen Strafe bestraft werden.“[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unbewegliches Geschlecht“ ist eine eigentümliche Bezeichnung dieses Werkes. Gemeint ist eine Gruppe, die als feststehend oder nicht ins Wanken zu bringen beschrieben wird.
    reason: Der technische Ausdruck ist im modernen Deutsch erklärungsbedürftig, soll aber nicht paraphrasierend aufgelöst werden.
  - marker: b
    text: Wer mit den „Aufnehmenden“ gemeint ist, wird an dieser Stelle nicht näher bestimmt.
    reason: Die unbestimmte Rollenbezeichnung des Zeugen wird transparent gemacht.
  - marker: c
    text: Das Wort „und“ ist im zugrunde liegenden englischen Zeugen als redaktionelle Ergänzung gekennzeichnet; „verworfen“ ist dort als unsichere Wiederherstellung markiert. Eine unmittelbare Prüfung des koptischen Textes steht noch aus.
    reason: Überlieferungs- und Editionssignale müssen sichtbar bleiben.
  - marker: d
    text: Der Satzbau des zugrunde liegenden Zeugen ist an dieser Stelle unsicher. Möglich ist auch, die Stärke ausdrücklich auf den niederträchtigen Geist zu beziehen. Die Übersetzung folgt dem Zusammenhang, in dem die Kraft in der Seele stärker wird.
    reason: Eine echte syntaktische Mehrdeutigkeit darf nicht verschwiegen werden.
  - marker: e
    text: Die Frage ist im zugrunde liegenden Zeugen dunkel; besonders die Wendungen „kleiner werden“, „natürlicher Zustand ihrer Mutter“ und „in den Menschen“ bleiben unsicher.
    reason: Die vorläufige, nur über einen englischen Zeugen vermittelte Textgrundlage erlaubt keine sichere Glättung.
  - marker: f
    text: „Einer anderen nachfolgen“ kann auch bedeuten, dass die Seele an die Stelle einer anderen tritt. Der folgende Satz schließt jedoch aus, dass sie erneut in ein anderes Fleisch geworfen wird.
    reason: Bewahrt die Spannung zwischen den Versen 15 und 17.
  - marker: g
    text: 'Wörtlich dem Zeugen entsprechend: eine „zeitalterlange“ oder „äonenlange“ Strafe. Die Formulierung entscheidet für sich allein nicht eindeutig, ob eine unbegrenzte Dauer gemeint ist.'
    reason: Vermeidet eine theologisch vorentscheidende Wiedergabe.
lexical_decisions:
- source_word: unmoving race
  choice: unbewegliches Geschlecht
  rationale: Bewahrt die eigentümliche, wahrscheinlich technische Bezeichnung der Überlieferung, ohne sie durch eine konfessionelle oder interpretierende Umschreibung aufzulösen.
- source_word: Greatness
  choice: die Größe
  rationale: Die substantivierte Bezeichnung bleibt als möglicher Titel einer transzendenten Wirklichkeit erkennbar.
- source_word: receivers
  choice: die Aufnehmenden
  rationale: Gibt die Funktion wieder, ohne vorschnell festzulegen, ob Menschen, Engel oder andere Mächte gemeint sind.
- source_word: indestructibility
  choice: Unvergänglichkeit
  rationale: Natürliches theologisches Deutsch, das den Gegensatz zu vergänglicher fleischlicher Existenz wahrt.
- source_word: false spirit / vile spirit
  choice: falscher Geist / niederträchtiger Geist
  rationale: Die im Zeugen vorhandene terminologische Unterscheidung wird nicht eingeebnet.
- source_word: aeons
  choice: Äonen
  rationale: Der technische kosmologische Begriff wird als Fremdwort beibehalten; eine Wiedergabe mit „Zeitalter“ würde in Vers 11 wahrscheinlich irreführen.
- source_word: archon
  choice: Archon
  rationale: Der technische Titel wird beibehalten, statt ihn deutend mit „Herrscher“ oder einer bestimmten geistlichen Macht gleichzusetzen.
- source_word: age-long punishment
  choice: äonenlange Strafe
  rationale: Bewahrt den Bezug zu aiōn/Äon und legt die Dauer nicht stillschweigend als mathematisch endlos oder bloß vorübergehend fest.
theological_decisions:
- issue: Rettung der Seelen, auf die der Geist herabkam, obwohl sie die genannten Werke nicht vollbrachten
  choice: „werden sie dennoch gerettet werden und sich bessern“
  alternative: „werden sie gerettet werden, weil sie umkehren“
  rationale: Die Aussage des Zeugen wird wiedergegeben, ohne eine bestimmte Reihenfolge von Gnade, Umkehr und Werken einzutragen.
- issue: Verhältnis von Kraft, Geist und Seele
  choice: Die wechselnden Bezeichnungen „Kraft“, „Geist des Lebens“, „falscher Geist“ und „niederträchtiger Geist“ bleiben unterscheidbar.
  alternative: Alle positiven beziehungsweise negativen Größen terminologisch vereinheitlichen
  rationale: Die begriffliche Spannung des Textes darf nicht durch eine systematische Pneumatologie aufgelöst werden.
- issue: Rückkehr der Seele und Nachfolge einer anderen Seele
  choice: Die dunkle Formulierung wird eng am vorliegenden Zeugen belassen und erläutert, aber nicht als Reinkarnation festgeschrieben.
  alternative: „Die Seele wird in einem anderen Menschen wiedergeboren“
  rationale: Vers 17 scheint eine erneute Verkörperung zugleich auszuschließen; deshalb muss die Spannung zwischen den Aussagen erhalten bleiben.
- issue: Dauer der abschließenden Strafe
  choice: „äonenlange Strafe“
  alternative: „ewige Strafe“
  rationale: Die Übersetzung wahrt die lexikalische und theologische Mehrdeutigkeit der überlieferten Zeitangabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Technische Begriffe der apokryphon-gnostischen Vorstellungswelt („Äonen“, „Archon“, „unbewegliches Geschlecht“) bleiben erhalten und werden knapp erläutert. Die Übersetzung ist vorläufig, weil als unmittelbare Grundlage nur der bereitgestellte gemeinfreie englische Zeuge vorliegt; eine direkte Prüfung der koptischen Handschriften steht aus.
