review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Die personifizierte »Reflection of Light« ist im englischen Zeugen durchgehend feminin. Die Wahl »(Licht-)Gedanke« erzwingt dagegen maskuline Pronomen und verändert damit die Figurenreferenz. Ferner fügt »der Mensch« bei »er sah die Frau« einen nicht ausdrücklich genannten Bezug hinzu. Die problematische Formel »the mother or the living« darf im Lauftext nicht zugunsten von »Mutter der Lebenden« festgelegt werden.'
  naturalness: Der Entwurf ist überwiegend gut lesbares modernes Standarddeutsch. »Reflexion des Lichts« ist als personifizierter Fachausdruck etwas ungewohnt, wahrt aber Geschlecht und Terminologie des Zeugen besser als »Lichtgedanke«. Die absichtlich schwierige Syntax im letzten Satz bleibt als solche erkennbar.
  terminology: »oberster Archon«, »Form«, »Gegenstück seines eigenen Bildes« und »vollkommene Erkenntnis« sind angemessen. »Reflexion des Lichts« und »strahlende Reflexion« halten die wiederholte Terminologie sowie die feminine Personifikation konsistent. Die textkritische Ergänzung bleibt sichtbar in eckigen Klammern.
  issues:
  - severity: high
    issue: Geschlechtswechsel bei »Reflection of Light«
    rationale: Der Zeuge verwendet für diese Gestalt feminine Pronomen (»herself/her/she«). Das maskuline »Lichtgedanke« mit »ihn/der« ändert diese Referenz; eine feminine deutsche Bezeichnung ist erforderlich.
  - severity: medium
    issue: Unbelegte Spezifizierung als »der Mensch«
    rationale: Bei »he beheld the woman« steht im Zeugen nur ein Pronomen. »Der Mensch« legt den Referenten stärker fest, als die vorliegende englische Grundlage erlaubt.
  - severity: medium
    issue: Mehrdeutigkeit von »the mother or the living« im Lauftext aufgelöst
    rationale: »die Mutter der Lebenden« ist nur eine mögliche Deutung. Die Fußnote weist zwar darauf hin, doch der Haupttext sollte die überlieferte Alternative selbst bewahren.
  - severity: low
    issue: Umfang der eckigen Klammern syntaktisch angepasst
    rationale: Deutsch verlangt für eine verständliche Stellung von »ihm« eine leicht andere Klammerung. Die Fußnote soll ausdrücklich erklären, dass weiterhin eine wiederhergestellte Lesart markiert wird.
  revised_text: '1. Dann verbarg sich die Reflexion des Lichts in ihm. Der oberste Archon wollte sie aus seiner Rippe herausziehen, doch die Reflexion des Lichts lässt sich nicht ergreifen.


    2. Obwohl die Finsternis sie verfolgte, konnte sie sie nicht fassen. Er zog aus ihm einen Teil seiner Kraft heraus und schuf eine weitere Form in Gestalt einer Frau, nach dem Abbild der Reflexion, die ihm erschienen war. Den Teil, den er aus der Kraft des Menschen herausgezogen hatte, brachte er in die weibliche Form hinein – und nicht, wie Mose sagte, »seine Rippe«. Und er sah die Frau neben sich.


    3. In diesem Augenblick erschien auch die strahlende Reflexion. Sie hob den Schleier, der seinen Verstand bedeckt hatte, und er kam nach dem Rausch der Finsternis wieder zur Besinnung. Er erkannte das Gegenstück seines eigenen Bildes und sagte: »Das ist gewiss Gebein von meinem Gebein und Fleisch von meinem Fleisch.


    4. Darum wird der Mann seinen Vater und seine Mutter verlassen, sich mit seiner Frau verbinden, und die beiden werden ein Fleisch werden«, denn seine Gefährtin wird ihm gesandt werden. Und er wird seinen Vater und seine Mutter verlassen – nämlich Sophia, unsere Schwester, die in Unschuld herabstieg, um ihren Mangel zu beheben. Deshalb wurde sie »Leben« genannt, die »die Mutter oder die Lebenden« ist[a] – durch die Vorsehung der Herrschaft des Himmels und durch [die ihm erschienene Reflexion].[b] Durch sie haben sie vollkommene Erkenntnis geschmeckt.'
  revised_footnotes:
  - marker: a
