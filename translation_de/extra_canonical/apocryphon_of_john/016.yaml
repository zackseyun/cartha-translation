base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: de
  text: '1. Da verbarg sich der Lichtgedanke in ihm. Der oberste Archon wollte ihn aus seiner Rippe herausziehen, doch der Lichtgedanke lässt sich nicht ergreifen.


    2. Obwohl die Finsternis ihm nachjagte, konnte sie ihn nicht fassen. Da zog der Archon einen Teil seiner Kraft aus ihm heraus und schuf eine weitere Form in Gestalt einer Frau, nach dem Abbild des Gedankens, der ihm erschienen war. Den Teil, den er aus der Kraft des Menschen herausgezogen hatte, brachte er in die weibliche Form hinein – und nicht etwa »seine Rippe«, wie Mose sagte. Da sah der Mensch die Frau neben sich.


    3. In diesem Augenblick erschien auch der strahlende Gedanke. Er hob den Schleier, der den Verstand des Menschen bedeckt hatte, und dieser kam nach dem Rausch der Finsternis wieder zur Besinnung. Er erkannte das Gegenstück seines eigenen Bildes und sagte: »Das ist nun wirklich Gebein von meinem Gebein und Fleisch von meinem Fleisch.


    4. Darum wird der Mann seinen Vater und seine Mutter verlassen, sich mit seiner Frau verbinden, und die beiden werden ein Fleisch werden.« Denn seine Gefährtin wird zu ihm gesandt werden. Und er wird seinen Vater und seine Mutter verlassen – ja sogar Sophia, unsere Schwester, die arglos herabstieg, um ihren Mangel zu beheben. Deswegen wurde sie »Leben« genannt, das heißt »die Mutter der Lebenden«[a] – durch die Vorsehung der Herrschaft des Himmels und durch [den Gedanken, der] ihm erschien.[b] Durch sie haben sie die vollkommene Erkenntnis geschmeckt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die zugrunde liegende Wendung auch »die Mutter oder die Lebenden« bedeuten; der vorliegende englische Textzeuge ist an dieser Stelle mehrdeutig.
    reason: Die Alternative »mother or the living« ist syntaktisch unsicher und sollte nicht ohne Hinweis auf eine einzige Deutung festgelegt werden.
  - marker: b
    text: Die Wörter »der Gedanke, der« stehen im vorliegenden Textzeugen in eckigen Klammern und kennzeichnen eine ergänzte beziehungsweise wiederhergestellte Lesart. Der Satzbau des gesamten Abschnitts ist unsicher.
    reason: Bewahrt das Restaurationssignal und macht auf die außergewöhnlich schwierige Syntax aufmerksam.
lexical_decisions:
- source_word: Reflection of Light
  choice: Lichtgedanke
  rationale: Der Ausdruck bezeichnet im Kontext eine personifizierte geistige Wirklichkeit. »Lichtgedanke« ist im Deutschen natürlicher und begrifflich klarer als das missverständliche »Lichtreflexion«, ohne die Personifikation aufzulösen.
- source_word: chief archon
  choice: oberster Archon
  rationale: »Archon« bleibt als technischer kosmologischer Titel erhalten; »oberster« gibt die Rangstellung wieder, ohne ihn konfessionell als »Herrscher« oder »Fürst« umzudeuten.
- source_word: mold
  choice: Form
  rationale: »Form« bewahrt das Bild eines gestalteten Gefäßes oder Modells und klingt im Deutschen weniger industriell als »Gussform«.
- source_word: counterpart of his own image
  choice: Gegenstück seines eigenen Bildes
  rationale: Die eigentümliche Beziehung von Entsprechung und Abbild wird möglichst eng bewahrt.
- source_word: recovered his sobriety after the inebriation of darkness
  choice: kam nach dem Rausch der Finsternis wieder zur Besinnung
  rationale: Die Rauschmetaphorik bleibt erhalten; »wieder zur Besinnung kommen« ist idiomatisches modernes Deutsch.
- source_word: cleave to his wife
  choice: sich mit seiner Frau verbinden
  rationale: Gibt die enge Bindung würdig und verständlich wieder, ohne altertümliches »anhangen«.
- source_word: perfect knowledge
  choice: vollkommene Erkenntnis
  rationale: »Erkenntnis« entspricht dem religiös-intellektuellen Sinn besser als bloßes Faktenwissen.
theological_decisions:
- issue: Geschlecht der personifizierten »Reflection of Light«
  choice: Das grammatische Maskulinum von »Gedanke« wird mit männlichen Pronomen aufgenommen.
  alternative: Eine feminine Benennung wie »Lichtreflexion« oder »Licht-Epinoia« mit weiblichen Pronomen.
  rationale: Die deutsche Wortwahl verlangt grammatische Kongruenz; die personifizierte Identität bleibt dennoch erhalten. Eine technische Transliteration wäre für gewöhnliche Leser weniger zugänglich.
- issue: Polemik gegen Moses Rippenbericht
  choice: »und nicht etwa ›seine Rippe‹, wie Mose sagte«
  alternative: Die Aussage harmonisierend als alternative Deutung der Rippe formulieren.
  rationale: Der Text widerspricht ausdrücklich der Mose zugeschriebenen Darstellung; diese theologische Spannung darf nicht geglättet werden.
- issue: Sophia als Vater und Mutter
  choice: Die syntaktisch schwierige Gleichsetzung bleibt mit »ja sogar Sophia« sichtbar.
  alternative: Sophia eindeutig nur als Mutter identifizieren oder den Satz in mehrere Lehrsätze auflösen.
  rationale: Der überlieferte Satz ist theologisch und grammatisch gespannt; eine eindeutige Systematisierung wäre interpretierend.
- issue: Singular oder Plural beim Kosten der Erkenntnis
  choice: »Durch sie haben sie ... geschmeckt«
  alternative: »Durch sie hat er ... geschmeckt«
  rationale: Der vorgelegte Zeuge bietet ausdrücklich den Plural »they«; dieser wird trotz unklaren Bezugs bewahrt.
- issue: Restaurierter Wortlaut am Satzende
  choice: Die Ergänzung bleibt in eckigen Klammern sichtbar.
  alternative: Die Ergänzung stillschweigend in den Lauftext aufnehmen.
  rationale: Die Klammern signalisieren textkritische Ergänzung und dürfen nicht verborgen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Satzführung. Technische Kosmologie wird nur dort transliteriert, wo der Titel »Archon« als Eigenbegriff wichtig ist. Die Genesis-Anklänge bleiben erkennbar, ohne konsequent eine bestimmte deutsche Bibelübersetzung nachzuahmen. Da eine direkte Prüfung des koptischen Quelltexts noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Textzeugen orientiert; dessen echte Mehrdeutigkeiten und Ergänzungszeichen wurden bewahrt.
