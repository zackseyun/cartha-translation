  text: '2. Further, they created by means of their individual powers, in accordance with their allotted attributes. Each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension).


    9. However, the host of angels attended him, and they obtained from the authorities the seven substances of the life-soul, so that they could create the sizes of the limbs and the sizes of the torso, and the proper functioning of all the parts with one another.


    10. … However, those especially at work in the limbs are these: the head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shinbone, Aroer; the left shinbone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: de
  text: '2. Weiter erschufen sie mithilfe ihrer jeweiligen Kräfte, entsprechend den ihnen zugeteilten Eigenschaften. Jede Macht verlieh eine Eigenschaft nach der Gestalt des Bildes, das sie in dessen psychischer Dimension[a] gesehen hatte.


    9. Das Heer der Engel aber stand ihm bei. Von den Mächten empfingen sie die sieben Substanzen der Lebensseele, damit sie die Maße der Glieder und des Rumpfes sowie das geordnete Zusammenwirken aller Körperteile gestalten konnten.


    10. … Besonders wirksam in den Gliedern aber sind diese: für den Kopf Diolimodraza; für den Hals Yammeax; für die rechte Schulter Yakoubib; für die linke Schulter Yerton; für die rechte Hand Oudidi; für die linke Hand Arbao; für die Finger der rechten Hand Lampno; für die Finger der linken Hand Leekaphar; für die rechte Brust Barbar; für die linke Brust Imae; für den Brustkorb Pisandraptes; für das rechte Schultergelenk Koade; für das linke Schultergelenk Odeor; für die rechten Rippen Asphixix; für die linken Rippen Synogchouta; für den Bauch Arouph; für den Mutterleib Sabalo; für den rechten Oberschenkel Charcharb; für den linken Oberschenkel Chthaon; für sämtliche Geschlechtsteile Bathinoth; für das rechte Bein Choux; für das linke Bein Charcha; für das rechte Schienbein Aroer; für das linke Schienbein Toechtha; für das rechte Knie Aol; für das linke Knie Charaner; für den rechten Fuß Bastan und für dessen Zehen Archentechtha; für den linken Fuß Marephnounth und für dessen Zehen Abrana.


    17. Die Mutter von ihnen allen aber ist Esthensis-Ouch-Epi-Ptoe.


    23. Einsicht in ihre wahre Beschaffenheit aber kommt von Anaro, dem Oberhaupt der hylischen Seele[b]; denn dies gehört zu den sieben Sinnen, zu Ouch-Epi-Ptoe.[c]


    27. Ich habe sie dir zwar nicht aufgezählt; wenn du jedoch wissen willst, wer sie sind: Dies alles steht im Buch des Zoroaster geschrieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Psychisch“ ist hier ein kosmologischer Fachbegriff und bezeichnet eine seelische beziehungsweise psychische Daseinsebene.
    reason: Der technische Gebrauch ist für heutige Leser nicht ohne Weiteres erkennbar.
  - marker: b
    text: „Hylisch“ bedeutet hier „der Materie zugehörig“ und wird als Fachbegriff beibehalten.
    reason: Erläutert den seltenen technischen Ausdruck, ohne ihn im Haupttext interpretierend zu ersetzen.
  - marker: c
    text: Der Wortlaut und die Zuordnung der Satzglieder sind an dieser Stelle unsicher. Insbesondere bleibt offen, worauf sich „dies“ bezieht und wie Ouch-Epi-Ptoe mit den sieben Sinnen verbunden ist.
    reason: Bewahrt die echte syntaktische und kosmologische Unklarheit des zugrunde gelegten Zeugnisses.
lexical_decisions:
- source_word: authority
  choice: Macht
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck personifizierte Herrschaftsgewalten; „Macht“ ist verständlich und vermeidet die moderne institutionelle Bedeutung von „Behörde“.
- source_word: psychic
  choice: psychisch
  rationale: Der technische kosmologische Begriff wird bewusst nicht zu „seelisch“ oder „geistig“ normalisiert; dadurch bleibt die besondere Schichtung des Textes erkennbar.
- source_word: life-soul
  choice: Lebensseele
  rationale: Die transparente Zusammensetzung bewahrt die ungewöhnliche Terminologie des Zeugnisses, ohne sie mit einem geläufigeren theologischen Seelenbegriff gleichzusetzen.
- source_word: hylic
  choice: hylisch
  rationale: Der Fachausdruck für das Stofflich-Materielle bleibt erhalten, da „materiell“ die technische kosmologische Kategorie vorschnell auslegen würde.
- source_word: proper functioning of all the parts with one another
  choice: das geordnete Zusammenwirken aller Körperteile
  rationale: Natürliches modernes Deutsch, das sowohl Funktionsfähigkeit als auch wechselseitige Abstimmung ausdrückt.
- source_word: womb
  choice: Mutterleib
  rationale: Gibt das bezeichnete Körperorgan in würdigem, allgemein verständlichem Deutsch wieder, ohne das Geschlecht des geschaffenen Körpers interpretierend zu harmonisieren.
theological_decisions:
- issue: Kosmologische Fachbegriffe „psychic“ und „hylic“
  choice: Als „psychisch“ und „hylisch“ beibehalten und erläutert
  alternative: Mit „seelisch“ und „materiell“ übersetzen
  rationale: Die technische Unterscheidung des Textes soll nicht in vertraute spätere theologische Kategorien eingeebnet werden.
- issue: Personifizierte Schöpferinstanzen
  choice: „Mächte“ und „Engel“ gemäß dem überlieferten Zeugnis unterschieden
  alternative: Beide Gruppen vereinheitlichend als Engelwesen bezeichnen
  rationale: Die Spannung zwischen den verschiedenen kosmischen Akteuren gehört zur Darstellung des Textes und darf nicht konfessionell oder systematisch aufgelöst werden.
- issue: Unklare Beziehung der Satzglieder in Abschnitt 23
  choice: Die syntaktische Uneindeutigkeit mit „dies“ und einer textkritischen Fußnote bewahrt
  alternative: Ouch-Epi-Ptoe eindeutig als Herrscherin über die sieben Sinne oder Anaro eindeutig als deren Haupt bestimmen
  rationale: Das englische Zeugnis ist an dieser Stelle grammatisch und inhaltlich unsicher; eine eindeutige Zuordnung wäre spekulativ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Die lange Namensliste ist durch wiederholtes „für“ syntaktisch gegliedert, ohne die Reihenfolge oder Zuständigkeiten zu verändern. Die Auslassung in Abschnitt 10 bleibt als Ellipse sichtbar. Der Entwurf beruht mangels abgeschlossener koptischer Quellenprüfung vorläufig auf dem angegebenen gemeinfreien englischen Zeugnis und sollte vor der Veröffentlichung direkt an den koptischen Handschriften beziehungsweise kritischen Editionen geprüft werden.
