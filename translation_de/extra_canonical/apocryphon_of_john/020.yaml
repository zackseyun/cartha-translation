translation:
  language: de
  text: '**Apokryphon des Johannes — Der Retter betritt den Bereich der Finsternis**


    1. Darum verwandelte ich, die vollkommene Vorsehung des Alls, mich in meinen eigenen Samen[a], denn ich war die Erste, die existierte. Ich durchwanderte alle Wege, denn ich bin der Reichtum des Lichts.


    2. Ich bin die Erinnerung der Fülle[b]. Doch ich trat in den Bereich der Finsternis ein und harrte aus, bis ich in die Mitte des Gefängnisses gelangte. Da erbebten die Grundfesten des Chaos. Wegen ihrer Bosheit verbarg ich mich vor ihnen, und sie erkannten mich nicht.


    3. Dann kehrte ich ein zweites Mal zurück und zog umher.


    4. Ich ging aus denen hervor, die aus dem Licht sind – dem Licht, das ich bin –, als die Erinnerung der Vorsehung.


    5. Ich trat mitten in die Finsternis und in das Innere der Totenwelt[c] ein, denn ich kümmerte mich um meinen Auftrag. Die Grundfesten des Chaos erbebten und drohten über den Bewohnern des Chaos einzustürzen und sie zu vernichten. Da eilte ich wieder hinauf zu meiner Lichtwurzel, damit sie nicht vor der bestimmten Zeit vernichtet würden.


    6. Auch ein drittes Mal ging ich hinaus: Ich bin das Licht im Licht, ich bin die Erinnerung der Vorsehung. Ich ging mitten in die Finsternis und in das Innere der Totenwelt hinein. Mein Angesicht erfüllte ich mit dem Licht der Vollendung ihres Äons. Dann trat ich mitten in ihr Gefängnis ein, nämlich in das Gefängnis ‹des› Körpers[d], und sagte: »Wer hört, soll aus dem tiefen Schlaf aufstehen!« Da weinte er, und seine Tränen flossen.


    7. Er wischte die bitteren Tränen von sich ab und sagte: »Wer ruft meinen Namen? Und woher ist diese Hoffnung zu mir gekommen, während ich in den Fesseln des Gefängnisses liege?«


    8. Ich sagte weiter: »Ich bin die Vorsehung des reinen Lichts.


    9. Ich bin der Gedanke des jungfräulichen Geistes, der dich zum rühmenswerten Ort emporhebt.


    10. Steh auf und erinnere dich daran, dass du derjenige bist, der aufgemerkt hat. Folge deiner Wurzel – mir, der Barmherzigen – und hüte dich vor den Engeln des Mangels[e], vor den Dämonen des Chaos und vor allen, die dir Fallen stellen. Nimm dich vor dem tiefen Schlaf und vor der Gefangenschaft im Inneren der Totenwelt in Acht.«


    11. Dann hob ich ihn empor und versiegelte ihn mit dem Licht des Wassers der fünf Siegel, damit der Tod von nun an keine Macht über ihn hätte. Und sieh: Nun werde ich zum vollkommenen Äon hinaufsteigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Samen« kann sowohl Saat als auch Ursprung oder Nachkommenschaft anklingen lassen; der genaue Bildbezug bleibt offen.
    reason: Lexikalische Mehrdeutigkeit des zugrunde liegenden englischen Zeugen.
  - marker: b
    text: »Fülle« entspricht dem kosmologischen Begriff, der häufig auch mit dem griechischen Lehnwort »Pleroma« bezeichnet wird.
    reason: Fachbegriff erläutern, ohne ihn im Haupttext unnötig zu verfremden.
  - marker: c
    text: Der konsultierte Zeuge hat hier »Hades«; gemeint ist die Toten- oder Unterwelt.
    reason: Transparenz über die Wiedergabe eines antiken Ortsbegriffs.
  - marker: d
    text: Die Spitzklammern zeigen an, dass »des« in der zugrunde liegenden Edition ergänzt ist.
    reason: Textkritische Ergänzung sichtbar halten.
  - marker: e
    text: Wörtlich steht im konsultierten Zeugen ein Ausdruck für äußerste Bedürftigkeit oder Mangel; möglicherweise bildet er einen Gegenbegriff zur »Fülle« in Vers 2.
    reason: Semantische und theologische Spannung kenntlich machen.
lexical_decisions:
- source_word: Providence
  choice: Vorsehung
  rationale: Bewahrt die personifizierte kosmologische Größe und ist zugleich in modernem Deutsch verständlich.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den gnostischen Vollständigkeitsbegriff wieder, ohne ihn durch eine konfessionelle Deutung zu ersetzen.
- source_word: Hades
  choice: Totenwelt
  rationale: Vermittelt den gemeinten unterweltlichen Bereich in allgemein verständlichem Deutsch; die Fußnote nennt die Form des Zeugen.
- source_word: aeon
  choice: Äon
  rationale: Bewahrt den kosmologischen Fachbegriff, der sowohl einen Weltzeitraum als auch einen überweltlichen Bereich bezeichnen kann.
- source_word: destitution
  choice: Mangel
  rationale: Stellt den begrifflichen Gegensatz zur Fülle heraus, ohne das Wort auf materielle Armut zu verengen.
- source_word: seed
  choice: Samen
  rationale: Erhält das konkrete und zugleich abstammungsbezogene Bild des Zeugen, statt es erklärend aufzulösen.
theological_decisions:
- issue: Person und grammatisches Geschlecht der Vorsehung
  choice: Die Ich-Stimme wird als »die Erste« und »die Barmherzige« feminin wiedergegeben.
  alternative: Generisches Maskulinum oder geschlechtsneutrale Umformulierung.
  rationale: Das deutsche Substantiv »Vorsehung« ist feminin, und die personifizierte Ich-Stimme soll in ihrer Bildsprache erkennbar bleiben; daraus wird keine weitergehende dogmatische Aussage abgeleitet.
- issue: Unterbrechung der Vernichtung der Chaosbewohner
  choice: Das mehrdeutige »sie« bleibt erhalten.
  alternative: Ausdrückliche Festlegung, ob die Bewohner oder die Grundfesten vernichtet würden.
  rationale: Der konsultierte Zeuge lässt den Bezug offen; die Übersetzung löst die Spannung nicht eigenmächtig auf.
- issue: Gefängnis des Körpers
  choice: Die Ergänzung »‹des›« bleibt durch Spitzklammern als textkritische Wiederherstellung gekennzeichnet.
  alternative: Die Ergänzung unmarkiert in den Text aufnehmen oder die Wendung auslassen.
  rationale: So bleibt sichtbar, dass der Ausdruck in der zugrunde liegenden Edition ergänzt wurde.
- issue: Wasser und fünf Siegel
  choice: »das Licht des Wassers der fünf Siegel«
  alternative: »das Lichtwasser mit fünf Siegeln« oder eine sakramentale Ausdeutung.
  rationale: Die verschachtelte Zuordnung des Zeugen wird bewahrt und nicht auf einen bestimmten Ritus festgelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzgliederung. Wiederholungen der Ich-Rede und zentrale kosmologische Bilder wurden bewusst bewahrt. Die bloße Manuskriptseitenzahl »31« wurde nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist dies ein vorläufiger, quellentransparenter Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugen.
