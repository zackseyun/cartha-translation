review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die kosmologische Terminologie sowie wesentliche Mehrdeutigkeiten. Eine sichere Korrektur ist in V. 11 erforderlich: »damit der Tod ... keine Macht über ihn hätte« klingt im Deutschen kontrafaktisch, während der Zeuge eine künftig fortdauernde Bewahrung ausdrückt. In V. 10 gibt »zugehört hat« das ausdrücklich hörbezogene »gave heed« klarer wieder als »aufgemerkt hat«. Die Prüfung beruht aufgrund der angegebenen Quellenlage auf dem englischen öffentlichen Zeugen; eine unmittelbare koptische Kontrolle steht weiterhin aus.'
  naturalness: Die Sprache ist überwiegend würdig, modern und gut lesbar. »Zu der bestimmten Zeit« wird zu »vor der Zeit« gestrafft, da keine Bestimmtheit im Zeugen markiert ist. Die absichtlich bildhafte, ungewohnte Formulierung in V. 6 wird nicht weiter geglättet, um das Bild des Zeugen nicht auszudeuten.
  terminology: »Vorsehung«, »Fülle«, »Äon«, »Totenwelt«, »Mangel« und »Samen« sind konsistent und sachgerecht. Die Erläuterungen sind zurückhaltend und legen keine konfessionelle Deutung fest. Die textkritische Ergänzung ‹des› bleibt korrekt markiert.
  issues:
  - severity: medium
    issue: 'V. 11: Kontrafaktischer Konjunktiv in »keine Macht über ihn hätte«'
    rationale: Der Konjunktiv II lässt eine irreale oder nur hypothetische Folge anklingen. Der Zeuge besagt, dass der Tod ihn von diesem Zeitpunkt an nicht mehr überwältigen soll bzw. kann.
  - severity: low
    issue: 'V. 10: »derjenige ..., der aufgemerkt hat«'
    rationale: »Gave heed« steht im Kontext des Hörens und wird mit »der zugehört hat« im modernen Deutsch präziser und natürlicher wiedergegeben.
  - severity: low
    issue: 'V. 5: »vor der bestimmten Zeit«'
    rationale: Das englische »before the time« enthält keine ausdrückliche Bestimmung. »Vor der Zeit« wahrt die Offenheit des Zeugen.
