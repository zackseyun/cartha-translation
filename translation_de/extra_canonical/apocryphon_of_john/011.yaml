review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den englischen Zeugen insgesamt sorgfältig wieder und wahrt die wichtigen textkritischen Klammern. Eine sichere Korrektur ist jedoch nötig, weil die Schreibung zentraler Eigennamen uneinheitlich vom Zeugen abweicht (Jaltabaoth/Jao statt Yaltabaoth/Yao) und weil die rätselhafte Notation {move:3} in Vers 18 im Haupttext durch eine Deutung ersetzt wurde. Vers 1 wird zudem syntaktisch so geglättet, dass die zusätzlichen fünf Herrscher über der Abyssostiefe klar erkennbar bleiben, ohne ihre Zuordnung weiter zu bestimmen.
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Kleinere Anpassungen verbessern idiomatische Präzision, insbesondere „böse in seinem Stolz“, „glühenden Feuers“ und „nicht mit ihr übereingestimmt hatte“. Die bewusst knappe und ungewöhnliche Aussage in Vers 6 bleibt mit einer erläuternden Fußnote behutsam lesbar.
  terminology: 'Archon, Äon, Sophia, Mächte und Gewalten sind sachgerecht und konsistent. Die Namensformen werden an den vorliegenden Zeugen angeglichen: Yaltabaoth und Yao. „Himmelsgewölbe“ und „Unvergängliche“ bewahren den kosmologischen bzw. substantivischen Charakter des Textes.'
  issues:
  - severity: medium
    issue: Die Namensformen „Jaltabaoth“ und „Jao“ weichen von „Yaltabaoth“ und „Yao“ im bereitgestellten Zeugen ab.
    rationale: Bei Eigennamen ist eine abweichende Umschrift nur dann angezeigt, wenn sie dokumentiert oder redaktionell festgelegt ist. Hier besteht innerhalb des Textes zudem Inkonsistenz, da Vers 7 „Jaltabaoth“, der Zeuge aber durchgehend „Yaltabaoth“ bietet.
  - severity: high
    issue: Vers 18 ersetzt die überlieferte unsichere Notation „{move:3}“ im Haupttext durch eine sichere Lesung.
    rationale: Die Fußnote weist zwar auf die Unsicherheit hin, doch der Lesetext muss die im Zeugen erhaltene Ungewissheit sichtbar bewahren, statt die Notation vollständig zu interpretieren.
  - severity: medium
    issue: Vers 1 ist in der vorliegenden deutschen Satzfügung missverständlich.
    rationale: Die Formulierung „von denen jeder ... und fünf“ lässt offen, wie die fünf über der Abyssostiefe syntaktisch zu den sieben Königen stehen. Die Revision bewahrt die knappe Vorlage, macht aber die zusätzliche Einsetzung von fünf Herrschern verständlich.
  - severity: low
    issue: Einzelne Formulierungen glätten oder verschieben Nuancen des Zeugen.
    rationale: „handelt er böse“ statt „er ist böse“, „loderndes“ statt „glühendes“ und „zugestimmt“ statt „übereingestimmt“ sind nicht gravierend, können aber näher und natürlicher am Zeugen formuliert werden.
  revised_text: '1. Weiter setzte er sieben Könige ein, die den Himmelsgewölben über den sieben Himmeln entsprechen, und fünf über der Tiefe des Abgrunds, damit sie herrschten.


    2. Auch teilte er sein Feuer mit ihnen. Doch von der Kraft des Lichts, das er von seiner Mutter erlangt hatte, sandte er nichts aus, denn er ist unwissende Finsternis. Als sich das Licht mit der Finsternis verband, ließ es die Finsternis leuchten; und als sich die Finsternis mit dem Licht verband, verdunkelte sie das Licht. So wurde es weder Licht noch Finsternis, sondern trüb.


    3. Der schwache Archon hat drei Namen. Der erste Name ist Yaltabaoth, der zweite Saklas und der dritte Samael. Er ist böse in dem Stolz, der in ihm ist, denn er sagte: »Ich bin Gott, und außer mir gibt es keinen Gott.« Denn er kennt weder seine eigene Kraft noch den Ort, aus dem er hervorgegangen ist.


    4. Weiter erschufen die Archonten für sich sieben Mächte, und jede Macht erschuf für sich sechs Engel, sodass sie insgesamt 365 Engel zählten. Dies sind die Gestalten, die zu den Namen gehören:


    5. Der erste ‹ist› Athoth – er hat das Gesicht eines Schafes; der zweite ist Eloaiou – er hat das Gesicht eines Esels; der dritte ist Astaphaios – er hat das Gesicht einer [Hyäne]; der vierte ist Yao – er hat das Gesicht eines siebenköpfigen [Drachen]; der fünfte ist Sabaoth – er hat das Gesicht eines Drachen; der sechste ist Adonin – er hat das Gesicht eines Affen; der siebte ist Sabbede – er hat das Gesicht eines glühenden Feuers.


    6. Diese bilden die siebenfache Gestalt der Woche.[a]


    7. Yaltabaoth aber hatte mehr Gesichter als alle anderen. So konnte er, wenn er unter den Seraphim war, vor ihnen allen jedes beliebige Gesicht annehmen, wie er wollte.


    8. Weil er sein Feuer mit ihnen teilte, wurde er ihr Oberherr.


    9. Wegen der herrlichen Kraft, die er durch das Licht seiner Mutter besaß, nannte er sich Gott und war dem Ort, aus dem er hervorgegangen war, ungehorsam.


    10. Weiter verband er in seinem Denken die sieben Mächte mit den Gewalten, die bei ihm waren. Als er sprach, geschah es, und er gab jeder Macht einen Namen, angefangen bei der höchsten:


    11. Die erste ist Güte, zusammen mit der ersten Gewalt, Athoth; die zweite ist Vorsehung, zusammen mit der zweiten Gewalt, Eloaio; die dritte ist Göttlichkeit, zusammen mit der dritten Gewalt, Astraphaio; die vierte ist Herrschaft, zusammen mit der vierten Gewalt, Yao; die fünfte ist Königtum, zusammen mit der fünften Gewalt, Sabaoth; die sechste ist Eifersucht, zusammen mit der sechsten Gewalt, Adonein; die siebte ist Sophia, zusammen mit der siebten Gewalt, Sabbateon.


    12. Auch sie haben jeweils ein Himmelsgewölbe, das einem himmlischen Äon entspricht.


    13. Man gab ihnen Namen, die der Herrlichkeit der himmlischen Wesen entsprechen, um die [Vernichtung der] Mächte herbeizuführen. In den Namen jedoch, die ihr Urheber [ihnen] gegeben hatte, wohnte Macht; die Namen dagegen, die ihnen entsprechend der Herrlichkeit der himmlischen Wesen gegeben wurden, werden für sie Vernichtung und Schwäche bedeuten.[b]


    14. Auf diese Weise haben sie jeweils zwei Namen.


    15. [Weiter, nachdem] er [alles] erschaffen hatte, [ordnete er] sie nach dem Abbild der ersten Äonen, die entstanden waren, damit er sie nach dem Abbild der Unvergänglichen erschaffen konnte.[c]


    16. Nicht weil er die Unvergänglichen gesehen hätte, sondern aufgrund der Kraft in ihm, die er von seiner Mutter erlangt hatte, brachte er in seinem Inneren das Abbild der Welt hervor. Als er die Schöpfung um sich her und das Heer der Engel sah, das aus ihm hervorgegangen war, erklärte er ihnen: »Ich bin ein eifersüchtiger Gott, und außer mir gibt es keinen Gott.«


    17. Mit dieser Erklärung zeigte er jedoch den Engeln, die ihm dienten, dass es einen anderen Gott gibt. Denn wenn es keinen anderen gäbe, wie könnte er auf einen anderen eifersüchtig sein?


    18. Da begann die Mutter, »sich {move:3} hin und her zu bewegen«, [d] wobei sie den Mangel erkannte, als die Leuchtkraft ihres Lichts abnahm. Und sie wurde dunkel, weil ihr Gefährte nicht mit ihr übereingestimmt hatte.'
