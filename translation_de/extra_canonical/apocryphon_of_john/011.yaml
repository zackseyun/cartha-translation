base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/011.yaml
  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: de
  text: '1. Weiter setzte er sieben Könige ein, von denen jeder einem Himmelsgewölbe über den sieben Himmeln entspricht, und fünf über der Tiefe des Abgrunds, damit sie herrschten.


    2. Auch teilte er sein Feuer mit ihnen. Doch von der Kraft des Lichts, das er von seiner Mutter erlangt hatte, gab er nichts weiter, denn er ist unwissende Finsternis. Als sich das Licht mit der Finsternis verband, ließ es die Finsternis leuchten; und als sich die Finsternis mit dem Licht verband, verdunkelte sie das Licht. So wurde es weder Licht noch Finsternis, sondern trüb.


    3. Der schwache Archon hat drei Namen. Der erste Name ist Jaltabaoth, der zweite Saklas und der dritte Samael. In dem Stolz, der in ihm ist, handelt er böse, denn er sagte: »Ich bin Gott, und außer mir gibt es keinen Gott.« Er kennt nämlich weder seine eigene Kraft noch den Ort, aus dem er hervorgegangen ist.


    4. Weiter erschufen die Archonten für sich sieben Mächte, und jede Macht erschuf für sich sechs Engel, sodass sie insgesamt 365 Engel zählten. Dies sind die Gestalten, die zu den Namen gehören:


    5. Der erste ‹ist› Athoth – er hat das Gesicht eines Schafes; der zweite ist Eloaiou – er hat das Gesicht eines Esels; der dritte ist Astaphaios – er hat das Gesicht einer [Hyäne]; der vierte ist Jao – er hat das Gesicht eines siebenköpfigen [Drachen]; der fünfte ist Sabaoth – er hat das Gesicht eines Drachen; der sechste ist Adonin – er hat das Gesicht eines Affen; der siebte ist Sabbede – er hat das Gesicht eines lodernden Feuers.


    6. Diese bilden die siebenfache Gestalt der Woche.[a]


    7. Jaltabaoth aber hatte mehr Gesichter als alle anderen. So konnte er, wenn er unter den Seraphim war, vor ihnen allen jedes beliebige Gesicht annehmen, wie er wollte.


    8. Weil er sein Feuer mit ihnen teilte, wurde er ihr Oberherr.


    9. Wegen der herrlichen Kraft, die er durch das Licht seiner Mutter besaß, nannte er sich Gott und widersetzte sich dem Ort, aus dem er hervorgegangen war.


    10. Weiter verband er in seinem Denken die sieben Mächte mit den Gewalten, die bei ihm waren. Als er sprach, geschah es, und er gab jeder Macht einen Namen, angefangen bei der höchsten:


    11. Die erste ist Güte, zusammen mit der ersten Gewalt, Athoth; die zweite ist Vorsehung, zusammen mit der zweiten Gewalt, Eloaio; die dritte ist Göttlichkeit, zusammen mit der dritten Gewalt, Astraphaio; die vierte ist Herrschaft, zusammen mit der vierten Gewalt, Jao; die fünfte ist Königtum, zusammen mit der fünften Gewalt, Sabaoth; die sechste ist Eifersucht, zusammen mit der sechsten Gewalt, Adonein; die siebte ist Sophia, zusammen mit der siebten Gewalt, Sabbateon.


    12. Auch sie haben jeweils ein Himmelsgewölbe, das einem himmlischen Äon entspricht.


    13. Man gab ihnen Namen, die der Herrlichkeit der himmlischen Wesen entsprechen, um die [Vernichtung der] Mächte herbeizuführen. In den Namen jedoch, die ihr Urheber [ihnen] gegeben hatte, wohnte Macht; die Namen dagegen, die ihnen entsprechend der Herrlichkeit der himmlischen Wesen gegeben wurden, werden für sie Vernichtung und Schwäche bedeuten.[b]


    14. Auf diese Weise haben sie jeweils zwei Namen.


    15. [Weiter, nachdem] er [alles] erschaffen hatte, [ordnete er] sie nach dem Abbild der ersten Äonen, die entstanden waren, damit er sie nach dem Abbild der Unvergänglichen erschaffen konnte.[c]


    16. Nicht weil er die Unvergänglichen gesehen hätte, sondern aufgrund der Kraft in ihm, die er von seiner Mutter erlangt hatte, brachte er in seinem Inneren das Abbild der Welt hervor. Als er die Schöpfung um sich her und das Heer der Engel sah, das aus ihm hervorgegangen war, erklärte er ihnen: »Ich bin ein eifersüchtiger Gott, und außer mir gibt es keinen Gott.«


    17. Mit dieser Erklärung zeigte er jedoch den Engeln, die ihm dienten, dass es einen anderen Gott gibt. Denn wenn es keinen anderen gäbe, wie könnte er auf einen anderen eifersüchtig sein?


    18. Da begann die Mutter, »sich hin und her zu bewegen«,[d] denn sie erkannte den Mangel, als die Leuchtkraft ihres Lichts abnahm. Und sie wurde dunkel, weil ihr Gefährte ihr nicht zugestimmt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise sinngemäß unsicher: »Diese sind die siebenfache (Gestalt) der Woche.« Gemeint ist offenbar die Zuordnung der sieben Herrscher zur Siebenzahl der Woche.'
    reason: Die Formulierung des Zeugen ist knapp und grammatisch ungewöhnlich.
  - marker: b
    text: Der überlieferte Wortlaut dieses Satzes ist schwer verständlich. Er unterscheidet offenbar zwischen den Namen des Urhebers, in denen Macht wohnt, und Namen nach dem Vorbild himmlischer Wesen, die den Mächten Vernichtung und Schwäche bringen.
    reason: Bewahrt die syntaktische und sachliche Unsicherheit, ohne den Haupttext unlesbar zu machen.
  - marker: c
    text: Die eckigen Klammern kennzeichnen ergänzten oder beschädigten Text. »Die Unvergänglichen« kann unvergängliche Wesen oder Wirklichkeiten bezeichnen.
    reason: Transparenz über Textlücken und die offene Referenz des substantivierten Ausdrucks.
  - marker: d
    text: Die zugrunde liegende Lesart ist unsicher; der englische Zeuge bewahrt hier die rätselhafte Notation »{move:3}«. Gemeint sein könnte eine Bewegung hin und her, doch die genaue Bedeutung bleibt offen.
    reason: Die obskure textkritische Notation wird nicht unbemerkt als sichere Lesart ausgegeben.
lexical_decisions:
- source_word: archon
  choice: Archon
  rationale: Der in gnostischen Texten fachsprachlich geprägte Titel bleibt als verständliches Lehnwort erhalten; »Herrscher« würde die besondere kosmologische Funktion einebnen.
- source_word: powers / authorities
  choice: Mächte / Gewalten
  rationale: Die zwei Gruppen werden terminologisch unterschieden, um die Struktur der Aufzählung zu bewahren.
- source_word: firmament
  choice: Himmelsgewölbe
  rationale: Die konkrete antike kosmologische Vorstellung wird natürlicher wiedergegeben als mit dem heute missverständlichen »Firmament«.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff bleibt erhalten und wird nicht vorschnell als »Zeitalter« oder »Welt« gedeutet.
- source_word: Sophia
  choice: Sophia
  rationale: Der Eigenname wird beibehalten; eine Übersetzung als »Weisheit« könnte die benannte Gestalt mit der abstrakten Eigenschaft verwechseln.
- source_word: feeble
  choice: schwach / Schwäche
  rationale: Die wiederkehrende Aussage über mangelnde Kraft wird in klarem modernem Deutsch wiedergegeben.
- source_word: bodies
  choice: Gestalten
  rationale: Im Kontext der tier- und feuerartigen Gesichter bezeichnet der Ausdruck offenbar Erscheinungsformen; »Körper« wäre im Deutschen unnötig physisch festgelegt.
- source_word: glowing fire
  choice: loderndes Feuer
  rationale: Natürliche, bildkräftige Wiedergabe, ohne das Feuer als bloß leuchtend oder glühend näher festzulegen.
theological_decisions:
- issue: Jaltabaoths Behauptung, allein Gott zu sein
  choice: »Ich bin Gott, und außer mir gibt es keinen Gott.«
  alternative: »Ich bin ein Gott, und neben mir gibt es keinen anderen.«
  rationale: Die absolute Selbstbehauptung und ihre anschließende ironische Widerlegung werden bewahrt, ohne sie mit konfessioneller Terminologie zu harmonisieren.
- issue: Beziehung von Licht und Finsternis
  choice: Beide Verbindungen werden parallel und spannungsvoll wiedergegeben.
  alternative: Die Passage als moralische Vermischung oder kosmischen Dualismus erklären.
  rationale: Der Text lässt die genaue Metaphysik offen; die Übersetzung löst die Spannung nicht kommentierend auf.
- issue: Namen der Mächte und ihre Vernichtung
  choice: Die widersprüchliche Gegenüberstellung krafttragender und vernichtender Namen bleibt bestehen.
  alternative: Die himmlischen Namen eindeutig als rettend oder zerstörerisch deuten.
  rationale: Die überlieferte Aussage ist in Syntax und Bezug schwierig und soll nicht dogmatisch vereindeutigt werden.
- issue: Der eifersüchtige Gott
  choice: »eifersüchtiger Gott«
  alternative: »leidenschaftlich eifernder Gott«
  rationale: Die anschließende Argumentation setzt Eifersucht auf einen anderen voraus; diese Pointe muss im Deutschen hörbar bleiben.
- issue: Ursprung des Weltabbilds
  choice: Das Abbild entsteht kraft der von der Mutter erlangten inneren Kraft, nicht durch unmittelbare Schau.
  alternative: Jaltabaoth als eigenständig schöpferisch darstellen.
  rationale: Die Abhängigkeit von der mütterlichen Lichtkraft ist ein ausdrücklicher theologischer Gegensatz des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Sätzen. Technische Begriffe der spätantiken Kosmologie wie »Archon«, »Äon« und »Sophia« bleiben erhalten. Eigennamen werden überwiegend in einer im Deutschen naheliegenden Umschrift wiedergegeben. Bloße Seitenzahlen des Manuskripts wurden nicht in den Lesetext aufgenommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen ausgerichtet; Ergänzungen und erkennbare Unsicherheiten werden markiert.
