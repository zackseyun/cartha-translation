translation:
  language: de
  text: 'Sofort, [während ich über diese Dinge nachsann], siehe, da [öffnete sich der Himmel, und] die [ganze] Schöpfung unter dem Himmel erstrahlte, und [die Welt] erbebte.


    [Da fürchtete ich mich, und siehe,] ich sah im [Licht ein Kind, das] nahe bei mir [stand].


    Während ich es ansah, [wurde es] einem alten Mann ähnlich; dann [veränderte es sein] Aussehen und wurde einem Sohn[a] ähnlich.


    Es war [nicht ein verschiedenartiges Wesen], das vor mir stand. Vielmehr war da im [Licht] eine [Erscheinung] mit mehreren Gestalten. [Die Gestalten] traten eine durch die andere hervor, und die [Erscheinung] hatte drei Formen.


    Er fragte mich: »Johannes, Johannes, warum staunst du, und warum [fürchtest du dich]?


    Ist euch allen diese Erscheinung unbekannt?


    Ich meine: Seid nicht kleinmütig.


    Ich bin der, der [immer bei euch allen] ist.


    Ich [bin der Vater], ich bin die Mutter, ich bin der Sohn.


    Ich bin der Unbefleckte und Unverdorbene.


    [Ich bin nun gekommen, um dich darüber zu unterrichten,] was ist, [was war] und was [geschehen] wird, damit [du verstehst, was] noch nicht offenbar [ist und was offenbar ist, und damit ich dich unterrichte über] das [unerschütterliche Geschlecht] des [vollkommenen Menschen].


    [Erhebe daher] dein [Angesicht, damit] du aufnimmst, was ich dir heute [sagen werde], und es deinen [Geistesgefährten] aus dem [unerschütterlichen] Geschlecht des vollkommenen [Menschen] [weitergibst].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende englische Textausgabe kennzeichnet »Sohn« mit einer Anmerkung, deren Inhalt in den bereitgestellten Daten nicht überliefert ist. Die Lesart muss noch am koptischen Text und an den Handschriften geprüft werden.
    reason: Der Marker {son:1} im gelieferten Zeugen weist auf eine textliche oder übersetzerische Anmerkung hin; mangels ihres Inhalts darf keine bestimmte Variante erfunden werden.
lexical_decisions:
- source_word: glowed
  choice: erstrahlte
  rationale: Gibt das sichtbare Aufleuchten der Schöpfung in natürlichem, würdigem Deutsch wieder, ohne eine bestimmte Lichtmetaphysik hinzuzufügen.
- source_word: child
  choice: Kind
  rationale: Bewahrt die Altersbezeichnung des englischen Zeugen und den Kontrast zum alten Mann.
- source_word: old man
  choice: alter Mann
  rationale: Eine direkte, nicht deutende Wiedergabe; »Greis« wäre stilistisch stärker und könnte ein sehr hohes Alter nahelegen.
- source_word: appearance
  choice: Erscheinung
  rationale: Passt sowohl zur sichtbaren Manifestation als auch zu deren wechselnden Formen, ohne sie als bloßen Schein abzuwerten.
- source_word: multiple forms / three forms
  choice: mehrere Gestalten / drei Formen
  rationale: Die leichte lexikalische Variation sorgt für natürliches Deutsch und erhält zugleich die Aussage einer einzigen Erscheinung mit mehrfacher Gestalt.
- source_word: weak heart
  choice: kleinmütig
  rationale: Gibt die idiomatische Bedeutung als Mutlosigkeit wieder; eine wörtliche Rede von einem »schwachen Herzen« wäre im Deutschen missverständlich.
- source_word: unpolluted and untainted
  choice: Unbefleckte und Unverdorbene
  rationale: Bewahrt die doppelte Reinheitsaussage mit zwei unterscheidbaren deutschen Begriffen.
- source_word: unmoving race
  choice: unerschütterliches Geschlecht
  rationale: »Unerschütterlich« vermittelt Beständigkeit natürlicher als »unbeweglich«; »Geschlecht« wahrt den antiken kollektiv-genealogischen Sinn von race.
- source_word: Perfect Man
  choice: vollkommener Mensch
  rationale: »Mensch« lässt die anthropologische Bedeutung offen und vermeidet eine unnötige Festlegung auf ausschließlich männliches Geschlecht.
- source_word: companion spirits
  choice: Geistesgefährten
  rationale: Bewahrt die ungewöhnliche Verbindung, ohne vorschnell zu entscheiden, ob »Geister« oder geistlich verbundene Gefährten gemeint sind.
theological_decisions:
- issue: Einheit und dreifache Gestalt der Erscheinung
  choice: Eine einzige »Erscheinung« mit mehreren Gestalten und drei Formen
  alternative: Mehrere voneinander getrennte Wesen oder Personen
  rationale: Der Zeuge verneint ausdrücklich ein verschiedenartiges beziehungsweise getrenntes Gegenüber und beschreibt zugleich drei Formen. Die Übersetzung erhält diese Spannung, ohne sie trinitarisch oder anders systematisch aufzulösen.
- issue: Selbstbezeichnung als Vater, Mutter und Sohn
  choice: Die drei Titel werden parallel und ohne Erklärung wiedergegeben
  alternative: Dogmatische Harmonisierung, metaphorische Abschwächung oder Umformulierung
  rationale: Die auffällige dreifache Selbstbezeichnung gehört zur theologischen Eigenart des Textes und darf nicht konfessionell geglättet werden.
- issue: Das »Geschlecht des vollkommenen Menschen«
  choice: Traditionsnah als »Geschlecht« und »vollkommener Mensch« wiedergegeben
  alternative: »Volk des vollkommenen Mannes« oder eine identifizierende Auslegung
  rationale: Die Formulierung bleibt kollektiv und anthropologisch offen; eine präzisere Identifikation wäre ohne koptische Prüfung spekulativ.
- issue: Ergänzte beziehungsweise rekonstruierte Textteile
  choice: Alle im Zeugen geklammerten Ergänzungen bleiben in eckigen Klammern
  alternative: Stillschweigende Eingliederung in den Fließtext
  rationale: So bleibt für Leserinnen und Leser sichtbar, welche Formulierungen aufgrund beschädigter oder lückenhafter Überlieferung ergänzt sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlicher Syntax. Die eckigen Klammern des Zeugen wurden konsequent als Kennzeichnung ergänzten Textes bewahrt. Die störende Seitenzahl »2« wurde nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Ausgangstextes noch aussteht, ist dies ein quellenbewusster vorläufiger Entwurf auf Grundlage des bereitgestellten gemeinfreien englischen Zeugen.
