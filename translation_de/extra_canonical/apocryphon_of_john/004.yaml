    2. Er ist es, der sein Verlangen in sein [Wasserlicht] legt, [das in der] Quelle des [reinen Lichtwassers wohnt], die ihn umgibt. Und [sein zunächst möglicher Gedanke wurde] Wirklichkeit, und sie näherte sich, [nämlich] diejenige, die vor ihm [im Leuchten] seines Lichtes [erschienen war].


    3. Dies ist die erste [Kraft, die] vor dem All [existierte] und aus seinem Denken [hervorging].


    4. Sie [ist die Vorsehung des Alls] – ihr Licht [leuchtet wie sein] Licht –, die [vollkommene] Kraft, die das Bild des vollkommenen, unsichtbaren, jungfräulichen Geistes ist.


    5. [Die erste Kraft] ist die Herrlichkeit Barbelo, die vollkommene Herrlichkeit in den Äonen, die Herrlichkeit der Offenbarung.


