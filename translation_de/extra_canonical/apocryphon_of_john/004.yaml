translation:
  language: de
  text: '1. Denn [wir können] das [Unaussprechliche nicht verstehen, und wir] verstehen das [Unermessliche] nicht, außer durch den, der aus ihm hervorgegangen ist, nämlich [den] Vater. Denn er [allein] ist es, der es uns [erklärt] hat, weil er sich selbst in seinem Licht betrachtet, das ihn umgibt, nämlich in der Quelle [lebendigen] Wassers. Er ist es, der [jeden Äon] versorgt, und zugleich schaut er in alle Richtungen sein Bild, indem er in die Quelle des [Geistes] blickt.


    2. Er ist es, der sein Verlangen in sein [Wasserlicht] legt, [das in der] Quelle des [reinen Lichtwassers wohnt], die ihn umgibt. Und [sein zunächst möglicher Gedanke wurde] Wirklichkeit, und sie trat hervor, [nämlich] diejenige, die vor ihm [im Leuchten] seines Lichtes [erschienen war].


    3. Dies ist die erste [Kraft, die] vor dem All [existierte] und aus seinem Denken [hervorging].


    4. Sie [ist die Vorsehung des Alls] – ihr Licht [leuchtet wie sein] Licht –, die [vollkommene] Kraft, die das Bild des vollkommenen, unsichtbaren, jungfräulichen Geistes ist.


    5. [Die erste Kraft] ist die Herrlichkeit Barbelo, die vollkommene Herrlichkeit inmitten der Äonen, die Herrlichkeit der Offenbarung.


    6. Sie pries den jungfräulichen Geist und verherrlichte ihn, denn seinetwegen war sie hervorgegangen.


    7. Dies ist der erste Gedanke, sein Bild.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aeon
  choice: Äon
  rationale: Der fachsprachliche Ausdruck bewahrt die kosmologische Bedeutung; eine Wiedergabe als „Zeitalter“ würde hier den personifiziert-räumlichen Sinn verengen.
- source_word: the All
  choice: das All
  rationale: Bewahrt die technische Bezeichnung für die Gesamtheit der Wirklichkeit, ohne sie vorschnell als „Schöpfung“ auszulegen.
- source_word: Providence
  choice: Vorsehung
  rationale: Natürliche deutsche Entsprechung, die den personifizierten Charakter durch das feminine Pronomen im Zusammenhang erkennen lässt.
- source_word: power
  choice: Kraft
  rationale: Gibt die kosmologische Größe angemessen wieder und vermeidet die stärker herrschaftlich klingende Festlegung auf „Macht“.
- source_word: virginal Spirit
  choice: jungfräulicher Geist
  rationale: Formnahe Wiedergabe der kultisch-theologischen Bezeichnung, ohne eine zusätzliche dogmatische Deutung einzuführen.
- source_word: thought
  choice: Gedanke
  rationale: Bewahrt die Spannung zwischen dem Denken des Geistes und der weiblich personifizierten Hervorbringung; das feminine Pronomen verweist auf die zuvor genannte Kraft beziehungsweise Vorsehung.
- source_word: water-light / light-water
  choice: Wasserlicht / Lichtwasser
  rationale: Die ungewöhnlichen Komposita bleiben erhalten, da ihre Bildsprache und mögliche technische Bedeutung nicht durch glättende Paraphrase ersetzt werden sollen.
- source_word: Barbelo
  choice: Barbelo
  rationale: Der Eigenname wird unverändert übernommen.
theological_decisions:
- issue: Ursprung und Identität des Offenbarers in Satz 1
  choice: „der aus ihm hervorgegangen ist, nämlich [den] Vater“
  alternative: „der von ihm gezeugt wurde, das heißt [der] Vater“
  rationale: „Hervorgegangen“ bleibt gegenüber der Art des Ursprungs zurückhaltend; die syntaktisch und theologisch schwierige Gleichsetzung wird nicht stillschweigend korrigiert.
- issue: Selbstbetrachtung des höchsten Geistes
  choice: „weil er sich selbst in seinem Licht betrachtet“
  alternative: „weil er ihn in dem Licht erforscht“
  rationale: Die reflexive Lesart des Zeugen wird bewahrt, ohne daraus eine ausgearbeitete Lehre der Selbsterkenntnis abzuleiten.
- issue: Entstehung des personifizierten Gedankens
  choice: „sein zunächst möglicher Gedanke wurde Wirklichkeit“
  alternative: „sein Gedanke trat in Wirksamkeit“
  rationale: Die im Zeugen ausdrücklich markierte Spannung zwischen Möglichkeit und Aktualität bleibt sichtbar.
- issue: Barbelo als Bild des Geistes
  choice: „das Bild des vollkommenen, unsichtbaren, jungfräulichen Geistes“
  alternative: „ein Abbild des vollkommenen … Geistes“
  rationale: Der bestimmte Charakter der Aussage wird erhalten; weder Identität noch bloße Ähnlichkeit wird über den Wortlaut hinaus behauptet.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Registerton. Die eckigen Klammern markieren weiterhin beschädigten Text beziehungsweise editorische Ergänzungen. Ungewöhnliche kosmologische Fachwörter und Bildkomposita wurden bewusst nicht geglättet. Die isolierte Seitenzahl «5» wurde als nicht zum Satz gehörige Manuskript-/Seitenmarkierung ausgelassen. Da eine direkte Prüfung des koptischen Textes noch aussteht, bleibt der Entwurf ausdrücklich am bereitgestellten englischen Zeugen orientiert.
