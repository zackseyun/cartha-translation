review_pass:
  verdict: revise
  source_fidelity: Eine unmittelbare koptische Kontrolle steht nach den Metadaten noch aus; geprüft wurde daher gegen den bereitgestellten englischen öffentlichen Zeugen. Die Übersetzung bewahrt weitgehend dessen beschädigungsmarkierte, teils schwierige Syntax und die technischen Begriffe. In V. 1 verschiebt „außer durch den“ jedoch die Aussage von „apart from him“; außerdem ist die im Zeugen vorhandene Ambiguität bei „studies him[self]“ nicht sicher als Selbstbetrachtung aufzulösen. V. 2 macht aus „she approached“ mit „sie trat hervor“ eine andere Bewegung. V. 5 gibt „inside the aeons“ besser räumlich-neutral mit „in den Äonen“ wieder.
  naturalness: 'Der Ton ist modernes, würdiges Standarddeutsch und die bewusst fremdartigen Komposita sind vertretbar. Einige Korrekturen erhöhen die Natürlichkeit, ohne die schwierige Vorlage zu glätten: „abgesehen von“, „in den Äonen“ und „sie näherte sich“.'
  terminology: „Äon“, „das All“, „Kraft“, „Vorsehung“, „jungfräulicher Geist“, „Wasserlicht/Lichtwasser“ und „Barbelo“ sind angemessen und konsistent. „Herrlichkeit“ für „glory“ ist möglich. Die ausgelassene isolierte Seitenzahl «5» folgt der dokumentierten englischen Bearbeitung und braucht nicht wiederhergestellt zu werden.
  issues:
  - severity: medium
    issue: 'V. 1: „außer durch den“ für „apart from him“'
    rationale: „Durch“ macht den aus ihm Hervorgegangenen zu einem Mittel des Verstehens. Der Zeuge formuliert dagegen eine Ausschließung bzw. Ausnahme. „Abgesehen von dem“ hält sich enger an die Vorlage.
  - severity: medium
    issue: 'V. 1: „er sich selbst ... betrachtet“ legt die zweifelhafte Referenz fest'
    rationale: Das „him[self]“ des Zeugen kennzeichnet eine textliche bzw. referenzielle Unsicherheit. Die reflexive deutsche Fassung entscheidet diese Unsicherheit. „ihn [sich selbst] erforscht“ bewahrt die Markierung und die offenbleibende Bezugnahme.
  - severity: medium
    issue: 'V. 2: „sie trat hervor“ statt „she approached“'
    rationale: Hervortreten bezeichnet Erscheinung oder Ausgehen; „approached“ beschreibt Annäherung. „Sie näherte sich“ ist die direkte, sichere Entsprechung.
  - severity: low
    issue: 'V. 5: „inmitten der Äonen“ für „inside the aeons“'
    rationale: „Inmitten“ kann eine zentrale Position unter den Äonen nahelegen. „In den Äonen“ bleibt neutraler und formnäher.
