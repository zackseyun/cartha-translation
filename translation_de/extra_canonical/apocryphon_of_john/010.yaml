translation:
  language: de
  text: '1. Er ergriff und schuf sich weitere Äonen mit einem leuchtenden Funken, der (noch) jetzt existiert. Und er staunte in seinem Stolz, der in ihm war, und zeugte sich Mächte.


    4. Der erste trägt den Namen Athoth, den die Geschlechter [den Schnitter] nennen.[a]


    5. Der zweite ist Harmas, [das] böse [{Auge:1}].[b]


    6. Der dritte ist Kalila-Oumbri.


    7. Der vierte ist Yabel.


    8. Der fünfte ist Adonaiou, der Sabaoth genannt wird.


    9. Der sechste ist Kain, den die Geschlechter der Menschen die Sonne nennen.


    10. Der siebte ist Abel.


    11. Der achte ist Abrisene.


    12. Der neunte ist Yobel.


    13. Der zehnte ist Armoupieel.


    14. Der elfte ist Melcheir-Adonein.


    15. Der zwölfte ist Belias, der über den Tiefen des Hades steht.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern um „den Schnitter“ kennzeichnen eine Ergänzung beziehungsweise unsichere Textgestalt im zugrunde gelegten Übersetzungszeugen.
    reason: Textkritische Unsicherheit des nur indirekt geprüften Wortlauts sichtbar halten.
  - marker: b
    text: Die ungewöhnliche Zeichenfolge „[{Auge:1}]“ gibt die im englischen Übersetzungszeugen enthaltene Restaurierungs- oder Variantenmarkierung sinngemäß auf Deutsch wieder; eine Prüfung am Koptischen steht noch aus.
    reason: Die problematische Überlieferungs- und Editionsnotation darf nicht stillschweigend geglättet werden.
  - marker: c
    text: „Hades“ bezeichnet hier den Bereich der Toten beziehungsweise die Unterwelt; die Wiedergabe vermeidet eine Festlegung auf den späteren Begriff „Hölle“.
    reason: Begriffliche und theologische Mehrdeutigkeit bewahren.
lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte Fachbegriff bewahrt die kosmologische Bedeutung und vermeidet die Verengung auf bloße Zeitabschnitte.
- source_word: authorities
  choice: Mächte
  rationale: Im vorliegenden kosmologischen Zusammenhang bezeichnet das Wort personifizierte Herrschaftswesen; „Mächte“ ist verständlich und traditionsnah.
- source_word: generations
  choice: Geschlechter
  rationale: Bewahrt den kollektiven und generationenübergreifenden Sinn; in Vers 9 wird die nähere Bestimmung „der Menschen“ ausdrücklich wiedergegeben.
- source_word: Reaper
  choice: Schnitter
  rationale: Gibt die Benennung als erntende beziehungsweise vernichtende Gestalt knapp und würdevoll wieder.
- source_word: deeps
  choice: Tiefen
  rationale: Bewahrt den Plural und die kosmisch-räumliche Bildsprache.
- source_word: Hades
  choice: Hades
  rationale: Der Eigenname bleibt erhalten und wird nicht vorschnell mit „Hölle“ gleichgesetzt.
theological_decisions:
- issue: Ontologischer Status der geschaffenen Wesen
  choice: „Äonen“ und „Mächte“
  alternative: „Weltzeiten“ und „Gewalten/Autoritäten“
  rationale: Die Fachbegriffe lassen die eigenartige Kosmologie des Textes stehen, ohne sie in ein späteres dogmatisches System einzuordnen.
- issue: Identifizierung Kains mit der Sonne
  choice: Die Aussage wird ohne Erklärung oder Harmonisierung direkt wiedergegeben.
  alternative: Als Beiname oder mythologische Entsprechung erläutern
  rationale: Der überlieferte Text setzt die Identifizierung; eine nähere Deutung wäre interpretierend.
- issue: Hades
  choice: Als Eigenname transliteriert
  alternative: „Unterwelt“ oder „Hölle“
  rationale: „Hades“ erhält die Mehrdeutigkeit zwischen Ort, Bereich und mythologischer Größe und vermeidet konfessionelle Festlegungen.
- issue: Rätselhafte Formulierung beim bösen Auge
  choice: Die eckigen Klammern und die eingebettete Notation werden sichtbar bewahrt.
  alternative: Glättung zu „das böse Auge“
  rationale: Da die direkte koptische Prüfung aussteht und der englische Zeuge eine unsichere beziehungsweise technische Markierung überliefert, wäre eine Glättung nicht hinreichend abgesichert.
