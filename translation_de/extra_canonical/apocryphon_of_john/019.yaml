lexical_decisions:
- source_word: vile spirit
  choice: verwerflicher Geist
  rationale: »Verwerflich« gibt die moralische Abwertung würdig und verständlich wieder; »abscheulich« wäre stärker emotionalisiert, »niederträchtig« stärker personal charakterisierend.
- source_word: Mother-Father
  choice: Mutter-Vater
  rationale: Die paradoxe, zusammengesetzte Gottesbezeichnung wird formal bewahrt und nicht konfessionell aufgelöst.
- source_word: Reflection of Radiant Providence
  choice: Reflexion der leuchtenden Vorsehung
  rationale: »Reflexion« bewahrt die mögliche Bedeutung von Spiegelbild, Widerschein oder gedanklicher Selbstbetrachtung; eine Festlegung auf nur eine Lesart wird vermieden.
- source_word: chief archon
  choice: oberster Archon
  rationale: Der fachsprachliche Titel »Archon« bleibt erhalten; »oberster« macht die Rangstellung verständlich.
- source_word: Destiny
  choice: Schicksal
  rationale: Die Personifikation wird durch Großschreibung im Satzkontext und wiederholte bestimmte Bezugnahme erkennbar, ohne einen künstlichen Eigennamen zu schaffen.
- source_word: unmoving race
  choice: unbewegliches Geschlecht
  rationale: Die terminologische Fremdheit wird bewahrt und in einer Fußnote semantisch erläutert.
- source_word: age-long slavery
  choice: äonenlange Knechtschaft
  rationale: »Äonenlang« erhält den kosmologischen Klang und die mögliche Mehrdeutigkeit von langer Dauer und Äonsbezug.
theological_decisions:
- issue: Geschlechtliche Gottesmetaphorik und wechselnde Pronomen
  choice: »Mutter-Vater« sowie die Spannung zwischen der Bezeichnung und maskulinen Bezügen beibehalten
  alternative: Pronomen angleichen oder die Bezeichnung paraphrasieren
  rationale: Die ungewöhnliche Verbindung ist theologisch und literarisch bedeutsam und darf nicht harmonisiert werden.
- issue: Polemik gegen die mosaische Fluterzählung
  choice: Die ausdrückliche Aussage »Es war nicht so, wie Mose sagte« unverändert wiedergeben
  alternative: Als bloße abweichende Tradition abschwächen
  rationale: Der Text formuliert einen echten Widerspruch, der nicht apologetisch geglättet werden soll.
- issue: Personifiziertes Schicksal als kosmische Herrschaft
  choice: Das Schicksal als handelnde beziehungsweise herrschende Macht darstellen
  alternative: Als unpersönlichen Ablauf oder Vorsehungsbegriff deuten
  rationale: Die kosmologische Spannung des Textes verlangt die personifizierte Darstellung.
- issue: Himmlischer »Mensch«
  choice: »Mensch« großgeschrieben und mit erläuternder Fußnote
  alternative: »himmlischer Mensch« direkt im Haupttext
  rationale: Die Übersetzung ergänzt keine im Zeugnis nicht ausdrücklich vorhandene Qualifikation, gibt aber Orientierung.
- issue: Ehebruch mit Sophia
  choice: Die drastische sexuelle Metaphorik formal bewahren
  alternative: Als Verunreinigung oder widerrechtliche Verbindung paraphrasieren
  rationale: Eine Abschwächung würde die polemische und mythologische Aussage des Textes verändern.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrten gnostisch-kosmologischen Fachbegriffen. Lange Perioden wurden behutsam gegliedert, ohne die Argumentationsfolge zu verändern. Die Seitenzahlen des Manuskripts wurden nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, werden unsichere Syntax und Pronomenbezüge in Fußnoten ausdrücklich markiert.
