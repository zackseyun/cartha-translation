  language: de
  text: '**Das Apokryphon des Johannes — Der verwerfliche Geist**


    1. Ich aber fragte: »Herr, woher stammt der verwerfliche Geist?«


    2. Da sagte er zu mir: »Der Mutter-Vater, reich an Erbarmen, der heilige Geist in jeder Gestalt, der barmherzig ist und mit euch allen Mitleid hat — das heißt: die Reflexion der leuchtenden Vorsehung — ließ den Samen des vollkommenen Geschlechts, dessen Verstand und das ewige Licht des Menschen hervortreten.[a]


    3. Als der oberste Archon erkannte, dass sie in der Höhe über ihm standen und ihn an Verstand übertrafen, wollte er ihr Ziel erfassen. Er wusste nicht, dass sie ihn an Verstand übertrafen und dass er sie nicht würde erfassen können.[b]


    4. Er schmiedete mit seinen Herrschaftsmächten, die seine Kräfte sind, einen Plan, und gemeinsam begingen sie mit Sophia Ehebruch. Aus ihnen wurde das bittere Schicksal gezeugt, die letzte, unbeständige Fessel. Es ist seinem Wesen nach schwankend und doch dauerhafter und stärker als jene, mit der sich die Götter ehebrecherisch verbanden, ebenso die Engel, die Dämonen und alle Geschlechter bis auf den heutigen Tag.[c] Denn aus diesem Schicksal gingen alle Übertretung, Ungerechtigkeit und Lästerung hervor, die Fessel des Vergessens und der Unwissenheit, jedes harte Gebot samt schweren Übertretungen und überwältigenden Ängsten.


    5. Auf diese Weise wurde auch die ganze Schöpfung verblendet, sodass sie den Gott über ihnen allen nicht erkennen sollte. Wegen der Fessel des Vergessens blieben ihre Sünden verborgen; denn sie sind an Maße, Zeiten und Augenblicke gebunden, weil das Schicksal über das All herrscht.[d]


    6. Da bereute er alles, was durch ihn geschehen war.


    7. Diesmal plante er, eine Flut über die Hervorbringungen der Menschheit zu bringen. Doch die Größe der leuchtenden Vorsehung setzte Noah davon in Kenntnis. Noah verkündete es der ganzen Nachkommenschaft der Menschenkinder; aber diejenigen, die ihm fremd waren, hörten nicht auf ihn.


    8. Es war nicht so, wie Mose sagte: »Sie verbargen sich in einer Arche.« Vielmehr verbargen sie sich an einem Ort — nicht nur Noah, sondern auch viele andere Menschen aus dem unbeweglichen Geschlecht.[e]


    9. Sie gingen an einen Ort und verbargen sich in einer leuchtenden Wolke. Er war sich seiner Vollmacht bewusst, und diejenige, die zum Licht gehört, begleitete ihn.[f]


    10. Sie hatte über ihnen geleuchtet, weil er Finsternis über die ganze Erde hatte kommen lassen. Und er schmiedete gemeinsam mit seinen Mächten einen Plan.


    11. Er sandte seine Engel zu den Töchtern der Menschen, damit sie einige von ihnen für sich nähmen und zu ihrem Vergnügen Nachkommen hervorbrächten. Zunächst hatten sie jedoch keinen Erfolg.


    12. Als es ihnen nicht gelungen war, versammelten sie sich erneut und schmiedeten gemeinsam einen Plan.


    13. Sie erschufen einen verwerflichen Geist, der dem herabgekommenen Geist glich, um dadurch die Seelen zu beflecken. Die Engel verwandelten ihre Gestalt in die Gestalt der Gefährten dieser Frauen und erfüllten sie mit dem Geist der Finsternis, den sie für sie mit dem Bösen vermischt hatten.[g]


    14. Sie boten Gold und Silber dar, dazu Gaben aus Kupfer und Eisen sowie Gegenstände aus jeder Art von Metall. Mit einer Fülle von Täuschungen führten sie die Menschen, die ihnen folgten, in die Irre und stürzten sie in große Bedrängnisse.


    15. Sie wurden alt, ohne irgendwelche Freuden genossen zu haben.


    16. Ohne die Wahrheit entdeckt und ohne den wahren Gott erkannt zu haben, starben sie. So geriet die ganze Schöpfung in eine äonenlange Knechtschaft, die von der Grundlegung der Welt bis heute andauert.[h]


    17. Außerdem wählten sie Frauen aus und zeugten aus der Finsternis Kinder nach dem Abbild ihres eigenen Geistes. Sie verschlossen ihre Herzen und verhärteten sich durch die Härte des verwerflichen Geistes — bis auf den heutigen Tag.«


    [a] »Mutter-Vater« und die wechselnden grammatischen Bezüge werden beibehalten, da sie zur Bild- und Begriffswelt des Textes gehören. »Mensch« bezeichnet hier offenbar eine himmlische Gestalt.

    [b] »Ziel« kann auch »Absicht« oder »Vorhaben« bedeuten; die Aussage bleibt im überlieferten Wortlaut mehrdeutig.

    [c] Die syntaktische Beziehung von »jene, mit der …« sowie von »Engel«, »Dämonen« und »Geschlechter« ist in der vorliegenden Textgrundlage unsicher.

    [d] Wörtlich ist der Bezug des Pronomens nicht eindeutig; dem Zusammenhang nach ist hier das Schicksal gemeint.

    [e] »Unbeweglich« bezeichnet hier Beständigkeit beziehungsweise Unerschütterlichkeit, nicht körperliche Regungslosigkeit.

    [f] Die Bezüge von »er«, »seiner« und »ihn« sind in der vorliegenden Textgrundlage nicht eindeutig.

    [g] »Gefährten« kann hier die jeweiligen Männer oder Partner der Frauen bezeichnen. Auch die Pronomenbezüge im letzten Satzteil sind unsicher.

    [h] »Äonenlang« kann sowohl eine sehr lange Weltzeit als auch eine auf einen Äon bezogene Dauer bezeichnen.'
