  text: 'He also peered into Barbelo with the pure light that surrounds the unseen Spirit, and his spark, and from him she conceived.


    He begot a light-spark by means of a light similar to blessedness, but (the latter) is not equal to his greatness.


    Such was an only-begotten one of the Mother-Father who had issued forth, he being his only offspring, the only-begotten one of the Father, the pure light.


    The unseen, virginal Spirit also rejoiced because of the light who had come into being, who had issued forth from the first power of his Providence—which is Barbelo—


    and he anointed him with his anointing until he became perfect, lacking nothing of the anointing because he had anointed him with the anointing of the unseen Spirit, and he attended him as he poured onto him, and as soon as he had received of the Spirit, he extolled the holy Spirit and the perfect Providence on whose account he had issued forth.


    He also entreated to give him a companion laborer, which is Mind, and he agreed gladly.


    And when the unseen Spirit had agreed, «7» Mind approached, and he attended Christ (the anointed), extolling him and Barbelo, and all of these came to dwell inside silence.


    Mind also willed to make something by means of the Logos of the unseen Spirit, and his (potential) will became actual, and approached with Mind and Light extolling him.


    And the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All.'
translation:
  language: de
  text: '1. Er blickte auch auf Barbelo mit dem reinen Licht, das den unsichtbaren Geist umgibt, und mit seinem Lichtfunken; und von ihm empfing sie.


    2. Er zeugte einen Lichtfunken durch ein Licht, das der Seligkeit glich, doch dieses kam seiner Größe nicht gleich.


    3. So entstand ein Einziggezeugter aus dem Mutter-Vater. Er war aus ihm hervorgegangen, sein einziger Spross, der Einziggezeugte des Vaters, das reine Licht.


    4. Auch der unsichtbare, jungfräuliche Geist freute sich über das Licht, das ins Dasein gekommen und aus der ersten Kraft seiner Vorsehung – das ist Barbelo – hervorgegangen war.


    5. Er salbte es mit seiner Salbung, bis es vollkommen war und ihm nichts von der Salbung fehlte; denn er hatte es mit der Salbung des unsichtbaren Geistes gesalbt. Er stand ihm bei, während er über es ausgoss. Sobald es vom Geist empfangen hatte, pries es den heiligen Geist und die vollkommene Vorsehung, um derentwillen es hervorgegangen war.


    6. Es bat auch darum, ihm einen Mitarbeiter zu geben, nämlich den Verstand; und er stimmte freudig zu.


    7. Als der unsichtbare Geist zugestimmt hatte, trat der Verstand hervor. Er stand Christus – dem Gesalbten – bei und pries ihn und Barbelo. Sie alle kamen in der Stille zur Ruhe.


    8. Auch der Verstand wollte durch den Logos des unsichtbaren Geistes etwas hervorbringen. Sein Wille wurde Wirklichkeit und trat zusammen mit Verstand und Licht hervor, wobei er ihn pries.


    9. Und der Logos folgte dem Willen; denn durch den Logos erschuf Christus, der selbstentstandene Gott, das All.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Barbelo
  choice: Barbelo
  rationale: Der Eigenname der ersten Vorsehung beziehungsweise Kraft wird unübersetzt bewahrt.
- source_word: light-spark
  choice: Lichtfunken
  rationale: Bewahrt die Bildlichkeit des englischen Zeugen und ist im Deutschen unmittelbar verständlich.
- source_word: only-begotten
  choice: Einziggezeugter
  rationale: Gibt die Zeugungssemantik ausdrücklich wieder, ohne sie durch das geläufigere, aber weniger präzise »eingeboren« zu verdecken.
- source_word: Mother-Father
  choice: Mutter-Vater
  rationale: Die spannungsreiche, beide Geschlechtsbezeichnungen verbindende Benennung wird formal bewahrt.
- source_word: Providence
  choice: Vorsehung
  rationale: Entspricht der personifiziert-kosmologischen Funktion im Text und bleibt gegenüber Barbelo appositionell bestimmt.
- source_word: Mind
  choice: Verstand
  rationale: Kennzeichnet die personifizierte geistige Instanz; die Großschreibung signalisiert ihren titelartigen Gebrauch.
- source_word: Logos
  choice: Logos
  rationale: Der vieldeutige Fachbegriff wird transliteriert, statt ihn vorschnell ausschließlich als »Wort« oder »Vernunft« festzulegen.
- source_word: Christ (the anointed)
  choice: Christus – der Gesalbte
  rationale: Bewahrt sowohl den Titel »Christus« als auch seine im Zeugen ausdrücklich gegebene Bedeutung.
- source_word: self-generated God
  choice: selbstentstandene Gott
  rationale: Gibt die Aussage über eigenständiges Hervorgehen wieder, ohne eine weitergehende dogmatische Deutung einzutragen.
- source_word: the All
  choice: das All
  rationale: Bewahrt den kosmologischen Gesamtbegriff als substantivierte Einheit.
theological_decisions:
- issue: Pronominale Bezüge beim hervorgegangenen Licht
  choice: Das Licht wird überwiegend mit dem sächlichen deutschen Pronomen »es« aufgenommen.
  alternative: Durchgehend männliche Pronomen verwenden und das Licht unmittelbar mit Christus identifizieren.
  rationale: Das deutsche Genus von »Licht« verlangt zunächst sächliche Bezüge; so wird die im Zeugen erst später ausdrücklich benannte Christus-Identifikation nicht vorzeitig harmonisiert.
- issue: Vollkommenwerden durch die Salbung
  choice: Die Aussage wird wörtlich als ein Werden zur Vollkommenheit wiedergegeben.
  alternative: Abschwächen zu einer bloßen Bestätigung bereits vorhandener Vollkommenheit.
  rationale: Die theologische Spannung des Zeugen soll erhalten bleiben und nicht konfessionell geglättet werden.
- issue: Schöpferische Vermittlung durch den Logos
  choice: Christus erschafft das All »durch den Logos«.
  alternative: Christus mit dem Logos gleichsetzen oder den Logos lediglich als gesprochenes Wort auffassen.
  rationale: Die im Abschnitt unterscheidbaren Gestalten beziehungsweise Prinzipien Christus, Logos, Wille und Verstand bleiben unterschieden.
- issue: Bezug des Ausgießens in Absatz 5
  choice: 'Die mehrdeutige Pronomenfolge wird möglichst eng am Zeugen belassen: Der Geist steht bei, während er über das Licht ausgießt.'
  alternative: Ein bestimmtes Objekt wie »die Salbung« oder »den Geist« ausdrücklich ergänzen.
  rationale: Der englische Zeuge benennt das Ausgegossene nicht eindeutig; eine Ergänzung würde die Überlieferung interpretierend festlegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrten kosmologischen Fachbegriffen. Wegen der noch ausstehenden direkten Prüfung des koptischen Textes ist die Fassung als quellennaher Entwurf auf Grundlage des angegebenen englischen Public-Domain-Zeugen zu verstehen. Die isolierte Seitenzahl »7« wurde entsprechend der Konsultationsfassung nicht in den Haupttext übernommen.
