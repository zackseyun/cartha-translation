translation:
  language: de
  text: '**Das Apokryphon des Johannes — Die Monade**


    1. [Auch ich] bat darum, [es zu verstehen; und er sagte] zu mir: »Die Monade [ist eine Einheit, über der nichts] steht.


    2. [Sie ist das, was] als [Gott] und als Vater des Alls [existiert]: der [Unsichtbare], der über [dem All steht, der als] Unvergänglichkeit, [als] reines Licht existiert, das kein [Auge] anschauen kann.


    3. Er [ist der] unsichtbare [Geist]. Es ist unangebracht, [ihn sich] als einen Gott oder als etwas Ähnliches [vorzustellen], denn er ist mehr als ein Gott, weil nichts über ihm existiert und niemand über ihn herrscht.


    4. [Das liegt daran, dass er] nicht in etwas existiert, das [ihm] untergeordnet ist, [denn alles] existiert in ihm; er ist es ja, der sich selbst [begründet] hat.


    5. [Er ist ewig], denn er braucht [nichts], weil [er] vollkommene Vollkommenheit ist.


    6. [Ihm fehlte nichts], sodass er es nötig gehabt hätte, dadurch vollendet zu werden.


    7. [Vielmehr] ist er für immer vollkommen vollendet im [Licht].


    8. Er ist [grenzenlos], denn niemand existiert [vor ihm], der ihm Grenzen setzen könnte.


    9. Er ist unergründlich, [denn] vor ihm existiert niemand, der [ihn ergründen] könnte.


    10. [Er ist] unermesslich, denn niemand [existierte vor ihm, der] ihn [hätte messen können].


    11. [Er ist unsichtbar, denn niemand] hat [ihn] gesehen.


    12. [Er ist ewig], denn er [existiert] ewig.


    13. Er ist [unaussprechlich, denn] niemand existierte, der ihn hätte erfassen können, um [von ihm] zu sprechen.


    14. Er kann nicht benannt werden, denn [niemand existierte vor ihm], der [ihm] einen Namen hätte geben können.


    15. Er ist [Licht ohne Maß], rein, heilig und [unbefleckt].


    16. Er ist unaussprechlich und [existiert in vollkommener] Unvergänglichkeit.


    17. Er existiert [nicht], eingeschlossen in Vollkommenheit, auch nicht in Seligkeit oder in Göttlichkeit, sondern er ist weit über sie erhaben.


    18. Er ist weder körperlich [noch] unkörperlich.


    19. Er ist weder groß [noch] klein.


    20. [Es ist unmöglich] zu sagen, er habe eine Quantität oder [eine Qualität], denn niemand kann [ihn verstehen].


    21. Er ist kein Seiendes unter [Seienden, sondern] weit erhaben — [nicht] so, [als wäre er höher], sondern er ist in sich selbst erhaben.


    22. Er hat weder [Anteil] an den Äonen noch an der Zeitlichkeit; denn wer an [einem Äon] Anteil hat, der zuvor errichtet wurde, [...].


    23. Ihm [wurde nicht] kein zeitliches Maß zugewiesen,[a] [denn] er empfängt nichts von einem anderen; [denn er würde es] wie eine Leihgabe [empfangen]. Wer vor einem anderen existiert, [hat es nicht nötig], etwas von [einem anderen] anzunehmen.


    24. Denn er ist es, der sich selbst betrachtet und in [seinem] Licht wartet, weil das [...] herrlich ist.


    25. Ihm gehört Reinheit ohne Maß.


    26. Er ist ein Äon, der Äonen schenkt.


    27. Er ist [Leben], das Leben schenkt.


    28. Er ist ein Seliger, der Seligkeit schenkt.


    29. Er ist Erkenntnis, die Erkenntnis schenkt.


    30. [Er ist] Güte, die Güte schenkt.


    31. [Er ist] Erbarmen und Erlösung, [die Erbarmen schenken].


    32. Er ist Gnade, die Gnade schenkt —


    33. [nicht] weil sie ihm gehört, sondern weil er [das Licht] schenkt, das ohne Maß und unbegreiflich ist.


    34. [Wie kann ich] mit dir von ihm [sprechen], da sein [Äon] unvergänglich ist, in Ruhe und in [Schweigen verweilt, ruhend] und vor [allem] existiert? [Denn er] ist das Oberhaupt [aller] Äonen, [und] er ist es, der ihnen durch seine Güte Kraft verleiht.«


    [a] Die doppelte Verneinung gibt die schwierige Formulierung der zugrunde gelegten Übersetzung wieder; ihr genauer Sinn bleibt unsicher.'
