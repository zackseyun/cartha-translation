review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die apophatischen Aussagen, den Fachbegriff »Äon« sowie die schwierige Doppelverneinung in § 23. Einzelne Ergänzungsmarkierungen und die in der Vorlage ausdrücklich gesetzten runden Klammern wurden jedoch nicht durchgängig erhalten. In § 6 fehlt insbesondere die Markierung für »[it]«; § 17 glättet die parenthetisch markierten Bestandteile der Überlieferung zu stark.
  naturalness: 'Weitgehend würdiges, modernes Standarddeutsch. Einige Formulierungen werden mit minimalen Änderungen idiomatischer und zugleich näher am Zeugen: »vollkommen vollendet« wird zu »vollkommen«; »ein Seliger« zu »ein Glückseliger«; »Oberhaupt« zu »Leiter«. Die absichtlich sperrige Doppelverneinung bleibt mit Anmerkung erhalten.'
  terminology: »Monade«, »All«, »Unvergänglichkeit«, »Äon«, »körperlich/unkörperlich« und »Erkenntnis« sind sachgerecht. »Sich selbst begründet hat« kann den offen gehaltenen Ausdruck self-established unnötig kausal und vergangenheitsbezogen zuspitzen; »in sich selbst gegründet ist« wahrt die Selbstbegründetheit besser. Die Wiedergabe von »blessed one/blessedness« als »Glückseliger/Glückseligkeit« ist im philosophisch-religiösen Register präziser.
  issues:
  - severity: medium
    issue: Überlieferungsmarkierungen in §§ 6 und 17 nicht vollständig bewahrt
    rationale: Der zugrunde gelegte Zeuge kennzeichnet Ergänzungen mit eckigen und unsichere bzw. editorische Satzbestandteile mit runden Klammern. Das Weglassen bzw. Auflösen dieser Markierungen verringert die Transparenz der Textgestalt.
  - severity: low
    issue: § 7 »vollkommen vollendet«
    rationale: Die Wendung ist im Deutschen unnötig tautologisch. »Für immer vollkommen« gibt den Sinn von »forever completely perfect« natürlich wieder.
  - severity: low
    issue: § 4 »sich selbst begründet hat«
    rationale: Das Perfekt und die kausale Nuance können einen einmaligen Ursprungsvorgang nahelegen. »in sich selbst gegründet ist« ist näher an der prädikativen, offen gehaltenen Aussage.
  - severity: low
    issue: § 34 »Oberhaupt«
    rationale: »Leiter« entspricht dem neutralen »leader« besser und vermeidet eine zusätzliche institutionell-hierarchische Konnotation.
  revised_text: '**Das Apokryphon des Johannes — Die Monade**


    1. [Auch ich] bat darum, [es zu verstehen; und er sagte] zu mir: »Die Monade [ist eine Einheit, über der nichts] steht.


    2. [Sie ist das, was] als [Gott] und als Vater des Alls [existiert]: der [Unsichtbare], der über [dem All steht, der als] Unvergänglichkeit, [als] reines Licht existiert, das kein [Auge] anschauen kann.


    3. Er [ist der] unsichtbare [Geist], den man sich nicht geziemend als einen Gott oder als etwas Ähnliches [vorstellen] kann, denn er ist mehr als ein Gott, weil nichts über ihm existiert und niemand über ihn herrscht.


    4. [Das liegt daran, dass er] nicht in etwas existiert, das [ihm] untergeordnet ist, [denn alles] existiert in ihm, weil er derjenige ist, der in sich selbst [gegründet] ist.


    5. [Er ist ewig], denn er braucht [nichts], weil [er] vollkommene Vollkommenheit ist.


    6. [Ihm fehlte nichts], sodass er es nötig gehabt hätte, durch [es] vollendet zu werden.


    7. [Vielmehr] ist er für immer vollkommen im [Licht].


    8. Er ist [grenzenlos], denn niemand existiert [vor ihm], der ihm Grenzen setzen könnte.


    9. Er ist unergründlich, [denn] vor ihm existiert niemand, der [ihn ergründen] könnte.


    10. [Er ist] unermesslich, denn niemand [existierte vor ihm, der] ihn [hätte messen können].


    11. [Er ist unsichtbar, denn niemand] hat [ihn] gesehen.


    12. [Er ist ewig], denn er [existiert] ewig.


    13. Er ist [unaussprechlich, denn] niemand existierte, der ihn hätte erfassen können, um [von ihm] zu sprechen.


    14. Er kann nicht benannt werden, denn [niemand existierte vor ihm], der [ihm] einen Namen hätte geben können.


    15. Er ist [Licht ohne Maß], rein, heilig und [unbefleckt].


    16. Er ist unaussprechlich und [existiert in vollkommener] Unvergänglichkeit.


    17. (Er existiert) [nicht] (eingeschlossen) in Vollkommenheit, auch nicht in Glückseligkeit oder in Göttlichkeit, sondern er ist (über diese) weit erhaben.


    18. Er ist weder körperlich [noch] unkörperlich.


    19. Er ist weder groß [noch] klein.


    20. [Es ist unmöglich] zu sagen, er habe eine Quantität oder [eine Qualität], denn niemand kann [ihn verstehen].


    21. Er ist kein Seiendes unter [Seienden, sondern] weit erhaben, [nicht] so, [als wäre er höher], sondern (er ist in) sich selbst erhaben.


