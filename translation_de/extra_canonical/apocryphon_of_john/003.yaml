lexical_decisions:
- source_word: monad
  choice: Monade
  rationale: Der etablierte philosophische und religionsgeschichtliche Fachbegriff bewahrt die Vorstellung der ungeteilten Einheit; die unmittelbar folgende Erklärung macht ihn allgemein verständlich.
- source_word: the All
  choice: das All
  rationale: Bewahrt den kosmologischen Gesamtbegriff und seine personähnliche Verwendung als »Vater des Alls«, ohne ihn enger als »Schöpfung« zu deuten.
- source_word: indestructibility
  choice: Unvergänglichkeit
  rationale: Klingt im Deutschen würdig und idiomatisch und bezeichnet einen unzerstörbaren, dem Verfall entzogenen Zustand.
- source_word: aeon
  choice: Äon
  rationale: Der transliterierte Fachbegriff erhält die mögliche Spannung zwischen Zeitalter, überzeitlichem Bereich und hypostasierter Wirklichkeit.
- source_word: somatic / non-somatic
  choice: körperlich / unkörperlich
  rationale: Gibt die ontologische Gegenüberstellung klar und ohne moderne medizinische Nebenbedeutung wieder.
- source_word: knowledge
  choice: Erkenntnis
  rationale: Im kontemplativ-metaphysischen Zusammenhang ist »Erkenntnis« treffender als bloßes Faktenwissen.
- source_word: self-established
  choice: sich selbst begründet
  rationale: Bringt Selbstursprünglichkeit beziehungsweise Unabhängigkeit zum Ausdruck, ohne eine spezifische metaphysische Lehrformel einzutragen.
theological_decisions:
- issue: Aussage, der unsichtbare Geist sei »mehr als ein Gott«
  choice: Wörtlich als »mehr als ein Gott« bewahrt
  alternative: »höher als Gott« oder »der wahre Gott«
  rationale: Die apophatische Steigerung soll nicht durch eine monotheistische Systematisierung oder eine konfessionelle Deutung geglättet werden.
- issue: Verneinung gegensätzlicher Kategorien in Abschnitten 17–21
  choice: Die Paradoxien und kategorialen Verneinungen bleiben stehen
  alternative: Positiv erklärende Umschreibung der Transzendenz
  rationale: Der Text bestreitet ausdrücklich, dass das höchste Prinzip selbst durch positive Prädikate wie Göttlichkeit, Körperlichkeit oder Sein unter Seienden begrenzt wird.
- issue: Doppelte Verneinung in Abschnitt 23
  choice: Als »[wurde nicht] kein zeitliches Maß zugewiesen« erhalten und angemerkt
  alternative: Zu »Ihm wurde kein zeitliches Maß zugewiesen« normalisieren
  rationale: Da die direkte Prüfung des koptischen Textes noch aussteht, darf die im Zeugen ausdrücklich überlieferte Schwierigkeit nicht stillschweigend beseitigt werden.
- issue: Geschlecht der Monade und anschließende männliche Pronomina
  choice: Die Monade zunächst grammatisch feminin, den als Vater und Geist bezeichneten Referenten danach maskulin wiedergegeben
  alternative: Durchgehend feminine oder neutrale Pronomina
  rationale: So bleibt sowohl das deutsche Genus von »Monade« als auch der im Text erfolgende Übergang zu »Vater« und »Geist« sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem apophatischem und litaneiartigem Rhythmus. Eckige Klammern und Auslassungspunkte markieren die im bereitgestellten Zeugen ausgewiesenen Ergänzungen und Lücken; runde Klammern wurden, soweit sie nur englische Glättungen markierten, idiomatisch in den Satzbau integriert. Bloße Manuskriptseitenzahlen wurden nicht in den Lesetext übernommen. Der Entwurf beruht mangels direkter koptischer Prüfung vorläufig auf dem bereitgestellten gemeinfreien englischen Textzeugen; eine Prüfung an den koptischen Handschriften bleibt erforderlich.
