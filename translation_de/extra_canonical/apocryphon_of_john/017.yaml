  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: de
  text: 'Ich erschien in Gestalt eines Adlers auf dem Baum der Erkenntnis, der das Spiegelbild der Vorsehung des reinen Lichts ist. So konnte ich sie unterweisen und aus ihrem tiefen Schlaf wecken; denn beide waren gefallen und erkannten ihre Nacktheit.


    Das Spiegelbild erschien ihnen als Licht und weckte ihr Denken. Als Jaldabaoth[a] jedoch erkannte, dass sie sich ihm entzogen hatten, verfluchte er seine Erde.


    Er traf die Frau an, als sie sich für ihren Mann bereitmachte.


    Er war ihr Gebieter, obwohl er das Geheimnis nicht kannte, das sich durch den heiligen Beschluss vollzogen hatte. Sie fürchteten sich, ihn anzuklagen. Er zeigte seinen Engeln die Unwissenheit, die in ihm war, vertrieb sie aus dem Paradies und kleidete sie in finstere Dunkelheit.


    Der oberste Archon[b] sah auch die Jungfrau, die bei Adam stand, und erkannte, dass das leuchtende Spiegelbild des Lebens in ihr erschienen war. Jaldabaoth war von Unwissenheit erfüllt. Als die Vorsehung des Alls dies sah, sandte sie Boten aus, und sie nahmen das Leben rasch aus Eva heraus.


    Dann befleckte der oberste Archon sie und zeugte mit ihr zwei Söhne, den ersten und den zweiten: Eloim und Jave.[c]


    Eloim hat das Gesicht eines Bären, Jave aber das Gesicht einer Katze.


    Jave ist gerecht, Eloim aber ungerecht.


    Jave wurde über Feuer und Wind gesetzt, Eloim dagegen über Wasser und Erde. Doch in betrügerischer Absicht gab er ihnen die Namen Kain und Abel.


    Bis heute besteht der Geschlechtsverkehr wegen des obersten Archons fort. Er war es, der die sexuelle Begierde in die Frau pflanzte, die zu Adam gehört. Durch den Geschlechtsverkehr schuf er Abbilder der Körper und hauchte ihnen seinen falschen Geist ein.


    Die beiden Archonten setzte er über mehrere Herrschaftsbereiche, damit sie über das Grab herrschten.[d]


    Als Adam aber das Abbild seiner eigenen Vorerkenntnis wahrnahm, zeugte er das Abbild des Menschensohnes, den er Seth nannte, entsprechend der Art, wie das Geschlecht unter den Äonen besteht.[e]


    Ebenso sandte auch die Mutter ihren Geist herab, der ihr eigenes Abbild ist, zusammen mit einem Abbild dessen, der in der Fülle wohnt. Denn sie wird den Äonen, die herabkommen werden, eine Wohnstätte bereiten.


    Er ließ sie auch das Wasser des Vergessens trinken, das vom obersten Archon kam, damit sie den Ort ihres Ursprungs nicht erkennen sollten.[f]


    So blieb der Same eine Zeit lang, um Hilfe zu empfangen,[g] damit der Geist, wenn er aus den heiligen Äonen hervorgeht, ihn aufrichtet und von seinem Mangel heilt, sodass die ganze Fülle heilig und ohne Fehl wird.«'
