  footnotes:
  - marker: a
    text: Der Name wird in den Handschriften und modernen Ausgaben unterschiedlich geschrieben, unter anderem Jaldabaoth beziehungsweise Yaldabaoth.
    reason: Namensvariante und unsichere Transliteration transparent machen.
  - marker: b
    text: „Archon“ bezeichnet hier einen kosmischen Herrscher oder Machthaber.
    reason: Technischen Begriff für heutige Leser knapp erläutern.
  - marker: c
    text: Die Namensformen Eloim und Jave folgen dem vorliegenden Textzeugnis; sie erinnern an biblische Gottesnamen, werden hier jedoch als Namen der beiden Söhne verwendet.
    reason: Ungewöhnliche Namensverwendung erklären, ohne sie theologisch gleichzusetzen.
  - marker: d
    text: Was mit „dem Grab“ genau gemeint ist, bleibt offen; möglicherweise bezeichnet es die vergängliche körperliche Welt.
    reason: Echte Bildmehrdeutigkeit bewahren und eine verbreitete Deutungsmöglichkeit kennzeichnen.
  - marker: e
    text: „Äonen“ sind in diesem Text nicht nur Zeiträume, sondern überweltliche Bereiche oder Wesen der göttlichen Ordnung.
    reason: Kosmologischen Fachgebrauch erläutern.
  - marker: f
    text: Das Subjekt „Er“ ist im Satzanschluss nicht eindeutig bestimmt.
    reason: Pronominale Mehrdeutigkeit des Zeugnisses ausweisen.
  - marker: g
    text: 'Die Formulierung kann auch verstanden werden: „So blieb der Same eine Zeit lang als Hilfe bestehen.“'
    reason: Die syntaktische Mehrdeutigkeit von „to help“ offenlegen.
lexical_decisions:
- source_word: Reflection
  choice: Spiegelbild
  rationale: Bewahrt die Bild- und Entsprechungssemantik besser als das abstraktere „Reflexion“ und bleibt in den wiederkehrenden Wendungen verständlich.
- source_word: Providence
  choice: Vorsehung
  rationale: Die etablierte deutsche Entsprechung trägt hier die personifizierte kosmologische Bedeutung, ohne sie konfessionell weiter auszudeuten.
- source_word: chief archon / archons
  choice: oberster Archon / Archonten
  rationale: Der fachsprachliche Titel wird transliteriert, da „Herrscher“ allein die besondere kosmologische Funktion des Begriffs verdecken würde.
- source_word: precognition
  choice: Vorerkenntnis
  rationale: Gibt den Erkenntnisaspekt formal wieder und vermeidet die stärkere zeitliche Festlegung von „Vorherwissen“.
- source_word: Fullness
  choice: Fülle
  rationale: Traditionelle und semantisch direkte Wiedergabe des pleromatischen Begriffs.
- source_word: aeons
  choice: Äonen
  rationale: Bewahrt den technischen kosmologischen Begriff, statt ihn auf bloße Zeitzeitalter zu reduzieren.
- source_word: simulacrum / likeness
  choice: Abbild
  rationale: Das deutsche Wort hält die Bedeutung einer abgeleiteten Gestalt offen, ohne vorschnell zwischen Bild, Doppel und Nachbildung zu entscheiden.
- source_word: race
  choice: Geschlecht
  rationale: Entspricht dem kosmologisch-genealogischen Sinn besser als das moderne und missverständliche „Rasse“.
- source_word: deficiency
  choice: Mangel
  rationale: Bewahrt den gnostischen Gegensatz zur Fülle in knapper, natürlicher Sprache.
theological_decisions:
- issue: Identität von Jaldabaoth und dem obersten Archon
  choice: Beide Bezeichnungen bleiben im jeweiligen Wortlaut erhalten.
  alternative: Alle Vorkommen unter einem einzigen Namen vereinheitlichen.
  rationale: Der Text legt die Identität nahe, wechselt aber bewusst zwischen Eigenname und Titel; diese Variation wird nicht eingeebnet.
- issue: Geschlecht der personifizierten Vorsehung und des Spiegelbilds
  choice: Die Vorsehung wird entsprechend dem deutschen Substantiv feminin aufgenommen; das Spiegelbild bleibt grammatisch neutral.
  alternative: Beide Gestalten durchgehend mit weiblichen Pronomen bezeichnen.
  rationale: So bleibt die Personifikation sichtbar, ohne dem neutralen deutschen Ausdruck „Spiegelbild“ ein nicht ausdrücklich markiertes natürliches Geschlecht aufzuzwingen.
- issue: Referent des Pronomens in „He also caused them to drink“
  choice: Das Subjekt bleibt als „Er“ unbestimmt.
  alternative: Jaldabaoth oder der oberste Archon ausdrücklich einsetzen.
  rationale: Der überlieferte Satzanschluss ist mehrdeutig; eine namentliche Auflösung würde den Text interpretierend festlegen.
- issue: Numerus und Referenz des Samens im Schlusssatz
  choice: „der Same“ wird singularisch mit „ihn“ aufgenommen.
  alternative: Kollektivisch mit „sie“ oder unpersönlich wiedergeben.
  rationale: Dies folgt der grammatischen Gestalt des konsultierten Zeugnisses und bewahrt zugleich die kollektive Deutungsmöglichkeit von „Same“.
- issue: Sexualität als Wirkung des obersten Archons
  choice: Die kausale Aussage wird direkt und ohne Abschwächung wiedergegeben.
  alternative: Sie als bloße zeitliche Folge oder als wertneutrale Entstehung umformulieren.
  rationale: Die polemische theologische Spannung des Textes darf nicht harmonisiert werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, klaren Sätzen. Kosmologische Fachbegriffe wie „Archon“, „Äon“ und „Fülle“ bleiben erhalten und werden bei Bedarf erläutert. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes als vorläufiger, quellenbewusster Entwurf zu behandeln; die störenden bloßen Seitenzahlen 24 und 25 wurden nicht in den Lesetext aufgenommen.
