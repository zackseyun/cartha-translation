lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der etablierte Fachbegriff bewahrt die besondere kosmologische Funktion dieser Herrschermächte, ohne sie vereinfachend mit gewöhnlichen Herrschern gleichzusetzen.
- source_word: intellect
  choice: Verstand
  rationale: Natürliches modernes Deutsch; umfasst hier Denk- und Erkenntnisvermögen. »Intellekt« wäre enger und stilistisch technischer.
- source_word: Reflection of Light
  choice: Lichtgedanke
  rationale: Eine verständliche, würdige Wiedergabe der personifizierten Lichtinstanz; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: mold of the body
  choice: körperliche Gestalt
  rationale: Bewahrt die Vorstellung einer geformten Leibgestalt, ohne das missverständliche deutsche Wort »Form« oder die zu konkrete »Gussform« zu erzwingen.
- source_word: odium
  choice: Hass
  rationale: Gängiges modernes Deutsch mit der erforderlichen negativen Stärke.
- source_word: Hades
  choice: Hades
  rationale: Der antike kosmologische Begriff bleibt stehen; eine Fußnote erklärt ihn knapp als Totenreich.
- source_word: trance
  choice: Entrückung
  rationale: Bewahrt den markierten, erklärungsbedürftigen Zustand und vermeidet eine vorschnelle Gleichsetzung mit normalem Schlaf; Alternativen stehen in der Fußnote.
- source_word: perception
  choice: Wahrnehmung
  rationale: Entspricht der ausdrücklichen Unterscheidung zwischen körperlichem Schlaf und dem Ruhen des Erkenntnisvermögens.
theological_decisions:
- issue: Identität und Rolle des »Lichtgedankens«
  choice: Als weiblich personifizierte, in Adam wohnende Lichtinstanz wiedergegeben
  alternative: Unpersönliche »Reflexion des Lichtes«
  rationale: Der Zeuge bezeichnet die Gestalt ausdrücklich mit einem weiblichen Pronomen und schreibt ihr aktives Erwecken zu; die Übersetzung bewahrt dies, ohne zusätzliche dogmatische Identifikation.
- issue: Bewertung des archontischen Paradieses und Lebensbaums
  choice: Die polemische Umkehrung der Genesis-Motive unverändert bewahrt
  alternative: An die kanonische Genesis harmonisieren
  rationale: Der Text deutet Paradies, Lebensbaum und Erkenntnisbaum bewusst in eigener theologischer Spannung; diese darf nicht aufgelöst werden.
- issue: Pronomen und Beteiligte in Vers 9–12
  choice: Die überlieferte Schwankung zwischen Singular und Plural weitgehend beibehalten und angemerkt
  alternative: Alle Bezüge eindeutig Adam, Eva, der Schlange oder dem obersten Archonten zuweisen
  rationale: Die englische Zeugenvorlage ist an diesen Stellen mehrdeutig; eine eindeutige Auflösung wäre ohne abgeschlossene koptische Quellenprüfung spekulativ.
- issue: Die Schlange und das Essen
  choice: Die Aussage als sexuelle Begierde, Verderben und Ausbeutung wiedergegeben
  alternative: Die Schlange pauschal als Befreierin oder ausschließlich als Verführerin deuten
  rationale: 'Der Abschnitt enthält eine spannungsvolle Doppelbewegung: Der Sprecher veranlasst das Essen, während die Schlange zur verderblichen Begierde anweist. Die Übersetzung hält beides nebeneinander.'
- issue: Moseskritik und »Schlaf« Adams
  choice: Den Gegensatz zwischen körperlichem Schlaf und eingeschläferter Wahrnehmung ausdrücklich erhalten
  alternative: Als gewöhnlichen Tiefschlaf paraphrasieren
  rationale: Die exegetische Korrektur des Genesisberichts bildet den Kern der Aussage und darf nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax und gezielt beibehaltenen Fachbegriffen wie »Archonten« und »Hades«. Die Versgliederung wurde erhalten, störende Manuskriptseitenangaben und technische Klammermarker wurden ausgelassen. Da die direkte Prüfung des koptischen Textes ausdrücklich noch aussteht, ist die Fassung als quellenbewusster Publikationsentwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugen zu behandeln; besonders unsichere Lexeme und Pronomenbezüge wurden nicht stillschweigend vereindeutigt.
