  language: de
  text: '1. Als sie hinabblickten, erkannten sie, dass sein Verstand den ihren übertraf. Da versammelten sie sich mit der Schar der Archonten und allen Engeln zu einer Beratung.


    2. Sie nahmen Feuer, Erde und Wasser, verbanden sie miteinander und mit den vier feurigen Winden, mengten alles unter großem Getöse zusammen und brachten ihn in den Schatten des Todes. So wollten sie ihn erneut aus Erde, Wasser, Feuer und Wind formen – aus dem, dessen Ursprung in der Materie liegt: der Unwissenheit der Finsternis, der Begierde und ihrem falschen Geist.


    3. Dies ist das Grab der körperlichen Gestalt, mit der die Räuber den Menschen bekleideten, die Fessel des Vergessens. So wurde er zu einem sterblichen Menschen.


    4. Dies ist der Erste, der herabstieg, und die erste Trennung. Doch der Lichtgedanke[a], der in ihm wohnte, weckte seinen Verstand.


    5. Dann brachten ihn die Archonten ins Paradies und setzten ihn dort hinein. Sie sagten zu ihm: »Iss!« – das heißt: »in Trägheit«. Denn ihre Wonne ist bitter, ihre Schönheit verdorben; ihre Wonne ist Täuschung, ihre Bäume sind Gottlosigkeit, ihre Frucht ist unheilbares Gift und ihre Verheißung ist Sterblichkeit.


    6. Ihren Baum des Lebens aber hatten sie mitten ins Paradies gesetzt. Ich werde euch allen das Geheimnis ihres Lebens lehren: Es ist der Anschlag, den sie gemeinsam ersonnen haben, und das Abbild ihres Geistes.


    7. Seine Wurzel ist bitter, seine Zweige sind Sterblichkeit, sein Schatten ist Hass, und in seinen Blättern wohnt Täuschung. Seine Blüte ist die böse Salbung, seine Frucht ist Sterblichkeit, seine Saat ist Begierde, und er treibt in der Finsternis aus.


    8. Wer davon kostet, dessen Wohnort ist der Hades[b], und die Finsternis ist seine Ruhestätte.


    9. Damit er jedoch nicht zu seiner Vollkommenheit hinaufblicken und die Schande seiner Nacktheit erkennen konnte, stellten sie sich vor das, was sie »den Baum der Erkenntnis von Gut und Böse« nennen: den Lichtgedanken. Ich aber war es, der sie zum Essen veranlasste.«[c]


    10. Ich fragte den Erlöser auch: »Herr, war es nicht die Schlange, die Adam anwies zu essen?«


    11. Der Erlöser lächelte und sagte: »Die Schlange wies sie an, von der Bosheit sexueller Begierde und des Verderbens zu essen, damit sie ihn ausbeuten konnte.


    12. Ferner wusste er, dass er ihm wegen des Lichtgedankens, der in ihm wohnt, ungehorsam war. Dieser ließ seinen Verstand klarer urteilen als den des obersten Archonten. Und er wollte die Kraft wieder aus ihm herausziehen, die er selbst ihm gegeben hatte; deshalb ließ er eine ›Entrückung‹ über Adam kommen.«[d]


    13. Da fragte ich den Erlöser weiter: »Was ist die ›Entrückung‹?«


    14. Er sagte: »Es ist nicht so, wie Mose geschrieben hat oder wie ihr gehört habt. Denn in seinem ersten Buch sagte er: ›Er ließ ihn schlafen.‹ Vielmehr ließ er seine Wahrnehmung schlafen. Tatsächlich sagte er durch den Propheten: ›Ich werde ihre Herzen schwer machen, damit sie nicht achtgeben und nicht sehen.‹«


    [a] Wörtlich bzw. als Fachbegriff auch: »Reflexion des Lichtes«. Die weibliche Personifikation des Ausdrucks ist im Zusammenhang mitzuhören.

    [b] Das Totenreich.

    [c] Die wechselnden Ein- und Mehrzahlformen sowie die Zuordnung der handelnden Personen sind in der Überlieferung bzw. Vorlage nicht eindeutig.

    [d] Auch möglich: »Betäubung«, »Ekstase« oder »tiefer Schlaf«. Der folgende Abschnitt deutet den Zustand als ein Einschläfern der Wahrnehmung.'
