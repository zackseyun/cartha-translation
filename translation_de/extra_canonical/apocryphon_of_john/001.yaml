translation:
  language: de
  text: '1. Die Lehre [des] Retters und [die Offenbarung] der Geheimnisse und [die] in Schweigen verborgenen Worte, [nämlich die Worte, die] er Johannes, [seinen] Jünger, lehrte.


    2. [Eines Tages] aber geschah es, als Johannes, [der Bruder] des Jakobus – sie waren die Söhne des Zebedäus –, zum Tempel hinaufgegangen war, dass ein Pharisäer namens Arimanios [zu] ihm [kam und] ihn fragte: „[Wo] ist dein Lehrer, [dem] du gefolgt bist?“


    3. Er [antwortete] ihm: „Er ist an den [Ort] zurückgekehrt, von dem er [kam].“


    4. Der Pharisäer [sagte zu ihm: „Durch Täuschung hat dieser Nazarener] euch alle irregeführt. Er hat [eure Ohren mit Lügen gefüllt] und [eure Herzen verschlossen und euch so] von den Überlieferungen [eurer Väter] abgebracht.“


    5. [Als] ich, [Johannes], diese Worte gehört hatte, [wandte ich mich] vom Tempel ab [und ging in eine gebirgige Wüstengegend]. In meinem Herzen klagte ich [sehr und fragte]:


    6. „Wie [wurde] der Retter [eingesetzt], und warum wurde er von [seinem Vater in die Welt] gesandt? Und wer ist [sein] Vater, der [ihn gesandt hat? Und welcher Art] ist der Äon[a], [in den wir eingehen werden]?


    7. Denn was meinte er, als er [zu uns sagte]: ‚Jener Äon, in den [ihr eingehen werdet], ist ein [unvergänglicher] Äon‘?


    8. [Er hat] uns jedoch nicht erklärt, [welcher Art er ist].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Äon: ein Zeitalter oder eine überweltliche, kosmische Wirklichkeit; der genaue Sinn bleibt hier offen.'
    reason: Der griechische Lehnbegriff trägt in diesem Werk eine besondere und mehrdeutige kosmologische Bedeutung, die „Zeitalter“ allein nicht vollständig wiedergibt.
lexical_decisions:
- source_word: savior
  choice: Retter
  rationale: „Retter“ ist im modernen Deutsch natürlich und wahrt die soteriologische Bedeutung, ohne einen späteren konfessionellen Titelgebrauch aufzudrängen.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff bleibt erhalten, da „Zeitalter“ oder „Welt“ die im Text angelegte Mehrdeutigkeit und den besonderen Vorstellungsrahmen verengen würden.
- source_word: appointed
  choice: eingesetzt
  rationale: Die Formulierung bewahrt die offene Bedeutung einer Bestimmung oder Einsetzung und legt nicht unnötig „erschaffen“, „erwählt“ oder „gesalbt“ fest.
- source_word: dispatched
  choice: gesandt
  rationale: „Gesandt“ ist idiomatisch, würdevoll und entspricht dem Botenmotiv, ohne die im Englischen etwas administrative Färbung wörtlich nachzubilden.
- source_word: traditions
  choice: Überlieferungen
  rationale: „Überlieferungen“ bezeichnet weitergegebene religiöse Lehren und Bräuche neutraler und textnäher als das allgemeinere „Traditionen“.
- source_word: sealed off your hearts
  choice: eure Herzen verschlossen
  rationale: Die Bildsprache des Verschließens bleibt erhalten; eine Deutung als Verhärtung wird nicht ausdrücklich in den Text eingeführt.
theological_decisions:
- issue: Bedeutung von „Äon“
  choice: Der Begriff „Äon“ bleibt im Haupttext unübersetzt und wird in einer Fußnote knapp erläutert.
  alternative: „Zeitalter“, „Welt“ oder „Ewigkeit“
  rationale: Der Abschnitt lässt offen, ob ein Zeitalter, eine jenseitige Sphäre oder eine kosmische Wirklichkeit gemeint ist. Ein deutscher Einzelbegriff würde diese Spannung vorschnell auflösen.
- issue: Einsetzung des Retters
  choice: „Wie wurde der Retter eingesetzt?“
  alternative: „Wie wurde der Retter bestimmt/erwählt?“
  rationale: „Eingesetzt“ wahrt den passiven, auftragbezogenen Sinn und vermeidet Aussagen über Präexistenz, Schöpfung oder Adoption, die der beschädigte Wortlaut hier nicht eindeutig trägt.
- issue: Rückkehr an den Herkunftsort
  choice: „an den Ort zurückgekehrt, von dem er kam“
  alternative: „zu dem zurückgekehrt, von dem er kam“
  rationale: Das ergänzte „place“ wird als Ort wiedergegeben; zugleich wird nicht ausdrücklich festgelegt, ob damit der Vater, der Himmel oder eine besondere Äonensphäre gemeint ist.
- issue: Kennzeichnung rekonstruierter Passagen
  choice: Alle im Zeugen durch eckige Klammern gekennzeichneten Ergänzungen bleiben auch in der deutschen Fassung geklammert.
  alternative: Glättung ohne Klammern
  rationale: So bleibt für Leserinnen und Leser sichtbar, wo der überlieferte Text beschädigt ist oder editorisch ergänzt wurde.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählführung. Die eckigen Klammern des zugrunde gelegten englischen Textzeugen wurden als Kennzeichen beschädigter oder ergänzter Stellen beibehalten. Da eine direkte Prüfung des koptischen Quellentextes noch aussteht, ist die Fassung als quellenbewusster, aber vorläufiger Übersetzungsentwurf formuliert.
