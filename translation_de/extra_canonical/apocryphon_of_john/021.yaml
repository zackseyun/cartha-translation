translation:
  language: de
  text: 'Ich habe in deinem Beisein alles um deinetwillen vollendet. Doch ich habe dir alles gesagt, damit du es aufschreibst und im Verborgenen an die dir verbundenen Geistwesen[a] weitergibst; denn dies ist das Geheimnis des unbeweglichen Geschlechts[b].«


    Auch der Retter vertraute ihm diese Worte an, damit er sie aufschrieb und unter Verschluss hielt. Er sagte zu ihm: »Verflucht sei jeder, der diese Worte gegen eine Gabe eintauscht – sei es Essen oder Trinken oder Kleidung oder irgendetwas Vergleichbares.«


    Diese Worte wurden ihm auch im Geheimnis[c] anvertraut. Plötzlich entschwand der Retter ihm. Da ging er zu seinen Mitjüngern und berichtete ihnen, was der Retter zu ihm gesagt hatte.


    Jesus Christus. Amen.


    Die geheime Schrift nach Johannes'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem englischen Textzeugen etwa: »deinen Mit-Geistern«; die genaue Beziehung bleibt unklar.'
    reason: Die zugrunde liegende englische Wiedergabe ist mehrdeutig, und eine direkte Prüfung des koptischen Textes steht noch aus.
  - marker: b
    text: »Geschlecht« meint hier eine Gemeinschaft oder Abstammungslinie; auch eine Wiedergabe als »unerschütterliches Geschlecht« wäre denkbar.
    reason: Die ungewöhnliche Bezeichnung soll nicht stillschweigend moralisch oder konfessionell gedeutet werden.
  - marker: c
    text: 'Oder: »auf geheimnisvolle Weise«.'
    reason: Die Wendung kann entweder einen Bereich religiöser Geheimüberlieferung oder die verborgene Art der Übergabe bezeichnen.
lexical_decisions:
- source_word: companion spirits
  choice: die dir verbundenen Geistwesen
  rationale: Gibt die personale Verbundenheit wieder, ohne die schwer bestimmbare Beziehung als bloße Freundschaft, Gleichgesinntheit oder feste gnostische Kategorie einzuengen.
- source_word: unmoving race
  choice: unbewegliches Geschlecht
  rationale: Bewahrt die auffällige und traditionsgeschichtlich bedeutsame Bildsprache des Zeugnisses. „Geschlecht“ bezeichnet hier eine Gruppe oder Abstammungslinie und nicht das biologische Geschlecht.
- source_word: keep them locked away
  choice: sie … unter Verschluss hielt
  rationale: Natürliches modernes Deutsch, das sowohl die materielle Verwahrung als auch die beabsichtigte Geheimhaltung ausdrücken kann.
- source_word: trade these sayings for a gift
  choice: diese Worte gegen eine Gabe eintauscht
  rationale: Bewahrt den Tauschcharakter und vermeidet die stärkere, im Zeugnis nicht ausdrücklich festgelegte Formulierung „verkauft“.
- source_word: vanished from him
  choice: entschwand der Retter ihm
  rationale: Gibt das plötzliche Verschwinden würdig und verständlich wieder; das Subjekt wird zur Klarheit erneut genannt.
- source_word: companion disciples
  choice: Mitjünger
  rationale: Bezeichnet knapp und idiomatisch die anderen Jünger, denen Johannes als Gleichgestellter verbunden ist.
theological_decisions:
- issue: Identität der „companion spirits“
  choice: die dir verbundenen Geistwesen
  alternative: deine gleichgesinnten Geister / deine geistlichen Gefährten
  rationale: Die Übersetzung hält offen, ob Geistwesen, geistlich verbundene Menschen oder Angehörige derselben geistigen Gemeinschaft gemeint sind.
- issue: Deutung des „unmoving race“
  choice: unbewegliches Geschlecht
  alternative: unerschütterliches Geschlecht / unverrückbares Volk
  rationale: Die fremdartige technische Wendung wird nicht deutend in eine moralische Eigenschaft wie Standhaftigkeit umgeformt.
- issue: Art der geheimen Überlieferung
  choice: im Geheimnis anvertraut
  alternative: auf geheimnisvolle Weise anvertraut
  rationale: Bewahrt die Möglichkeit, dass „Geheimnis“ nicht nur die Art der Übergabe, sondern auch einen religiösen Offenbarungszusammenhang bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener esoterischer Bildsprache. Die Fassung ist vorläufig, da nur der angegebene gemeinfreie englische Textzeuge vorliegt und die direkte Prüfung der koptischen Handschriften noch aussteht. Die bloße Seitenzahl des Manuskripts wurde wie in der englischen POB-Fassung nicht in den Lesetext aufgenommen.
