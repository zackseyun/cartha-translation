    Auch der Retter vertraute ihm diese Worte an, damit er sie aufschreibe und unter Verschluss halte. Er sagte zu ihm: »Verflucht sei jeder, der diese Worte gegen eine Gabe eintauscht – sei es Essen oder Trinken oder Kleidung oder irgendetwas Vergleichbares.«


    Diese Worte wurden ihm auch im Geheimnis[c] anvertraut. Plötzlich entschwand der Retter ihm. Da ging er zu seinen Mitjüngern und berichtete ihnen, was der Retter zu ihm gesagt hatte.


    Jesus Christus. Amen.


