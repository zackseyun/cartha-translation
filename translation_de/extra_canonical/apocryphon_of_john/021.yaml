review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem vorliegenden englischen Textzeugen weitgehend genau. „unter Verschluss hielt“ gibt jedoch als Indikativ eine vollzogene Handlung wieder, während die Vorlage den Zweck der anvertrauten Worte ausdrückt („so that he would …“). Die Zweckbestimmung sollte im Deutschen entsprechend markiert werden. „Mitgeister“ bewahrt zudem die auffällige, nicht näher bestimmbare Bezeichnung „companion spirits“ genauer als „dir verbundene Geistwesen“, das eine Ontologie von nichtmenschlichen Wesen nahelegt.
  naturalness: Der Registerton ist würdig und gut verständlich. „Mitgeister“ ist außerhalb eines fachlich-religiösen Kontextes ungewohnt, ist hier aber als bewusst fremde, durch eine Fußnote erläuterte Bezeichnung die natürlichere und zugleich weniger festlegende Lösung. Die Änderung zu „aufschreibe und unter Verschluss halte“ ist idiomatisch in einem gehobenen erzählenden Register.
  terminology: „Retter“, „Geheimnis“, „unbewegliches Geschlecht“ und „Mitjünger“ sind konsistent und ohne konfessionelle Überdeutung wiedergegeben. „Geschlecht“ erhält die gruppen- bzw. abstammungsbezogene Mehrdeutigkeit von „race“. Die Schlussbezeichnung „Die geheime Schrift nach Johannes“ entspricht dem englischen Zeugen „The Secret Writing According to John“.
  issues:
  - severity: medium
    issue: Die Zweckbestimmung in Satz 2 wird als Indikativ formuliert.
    rationale: „damit er sie aufschrieb und unter Verschluss hielt“ stellt die Handlung als berichtetes Faktum dar. Der englische Zeuge formuliert hingegen den Zweck der Übergabe. Konjunktiv I („aufschreibe und … halte“) bewahrt diese Funktion.
  - severity: low
    issue: „dir verbundene Geistwesen“ legt die Bedeutung von „companion spirits“ stärker fest als der Textzeuge.
    rationale: „Geistwesen“ kann im Deutschen speziell nichtmenschliche spirituelle Entitäten bezeichnen, während die Beziehung und Referenzgruppe der „spirits“ im Zeugen offenbleiben. „Mitgeister“ erhält die terminologische Fremdheit und Mehrdeutigkeit.
