  text: 'However, all the angels and demons labored until they had formed the psychic body. Their creation was entirely inert and without movement for a prolonged time.


    When, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.


    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: de
  text: '**Der Geist wird Adam eingehaucht**


    1 Doch alle Engel und Dämonen mühten sich, bis sie den seelischen Leib[a] geformt hatten. Lange Zeit blieb ihr Geschöpf völlig reglos und ohne jede Bewegung.


    2 Als aber die Mutter die Kraft zurückerlangen wollte, die sie dem obersten Archon[b] verliehen hatte, flehte sie zum allbarmherzigen Mutter-Vater[c] des Alls.


    3 Aufgrund des heiligen Beschlusses sandte er die fünf Lichter hinab an den Ort der Engel des obersten Archons. Sie rieten ihm, die Kraft der Mutter hervorzubringen, und sagten zu Jaltabaoth: »Hauche etwas von deinem Geist in sein Gesicht, dann wird sein Leib sich aufrichten.« Da hauchte er seinen Geist in dessen Gesicht – die Kraft seiner Mutter.


    4 Er erkannte es nicht, denn er lebt in Unwissenheit. So ging die Kraft der Mutter aus Jaltabaoth hervor und in den seelischen Leib hinein, den sie nach dem Bild dessen geformt hatten, der vom Anfang her ist.[d]


    5 Der Leib bewegte sich, gewann Kraft und strahlte. Da wurden die übrigen Mächte neidisch. Denn der Mensch war durch sie alle ins Dasein gekommen, und sie hatten ihm ihre Kraft verliehen; doch sein Verstand übertraf den seiner Schöpfer und auch den des obersten Archons.


    6 Als sie sahen, dass er strahlte, besser denken konnte als sie und vom Bösen unbelastet war, ergriffen sie ihn und stießen ihn hinab in den untersten Bereich aller Materie.


    7 Doch der Gesegnete, der Mutter-Vater, der Gütige und Barmherzige, erbarmte sich der Kraft der Mutter, die aus dem obersten Herrscher hervorgegangen war, denn sie könnten Macht über den seelischen und sinnlich wahrnehmbaren Leib gewinnen.[e] Durch seinen gütigen Geist und in seinem großen Erbarmen sandte er Adam eine Helferin: die Leuchtende Reflexion[f], die aus ihm hervorgeht und »Leben« genannt wird.


    8 Sie hilft jedoch der ganzen Schöpfung, indem sie mit ihm zusammenwirkt, ihn wieder zu seiner Vollkommenheit führt und ihn über das Herabkommen seiner Nachkommenschaft belehrt. Auch unterweist sie ihn über den Weg des Aufstiegs – den Weg, auf dem sie herabkam.[g]


    9 Außerdem wurde die Reflexion des Lichts in Adam verborgen, damit die Archonten nichts davon erfuhren. Diese Reflexion sollte den Mangel der Mutter beheben. Durch den Lichtschatten[h] in seinem Inneren trat der Mensch sichtbar hervor, und sein Verstand übertraf den all seiner Schöpfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Seelischer Leib« gibt den technischen Ausdruck des Zeugen wieder. Gemeint ist eine belebte, aber noch nicht als geistig vollendete Leiblichkeit.
    reason: Der Ausdruck »psychic body« ist im modernen Deutsch ohne Erläuterung leicht psychologisch misszuverstehen.
  - marker: b
    text: »Archon« bedeutet »Herrscher« und bezeichnet hier eine kosmische Macht. Der oberste Archon wird im Folgenden Jaltabaoth genannt.
    reason: Technischen kosmologischen Titel erklären, ohne ihn zu ersetzen.
  - marker: c
    text: 'Wörtlich eine zusammengesetzte Bezeichnung: »Mutter-Vater«; sie wird hier nicht zu »Mutter und Vater« aufgelöst.'
    reason: Die eigentümliche Gottesbezeichnung und ihre theologische Spannung bewahren.
  - marker: d
    text: »Der vom Anfang her ist« bezeichnet im vorliegenden Zeugen eine uranfängliche Gestalt; der genaue Bezug bedarf der Prüfung am koptischen Text.
    reason: Die Formulierung ist semantisch und referenziell unsicher.
  - marker: e
    text: 'Wer mit »sie« gemeint ist, ist im vorliegenden englischen Zeugen nicht eindeutig: möglich sind die Archonten beziehungsweise Mächte oder ein anderer zuvor genannter Bezug. Direkte Prüfung des koptischen Wortlauts steht aus.'
    reason: Echte syntaktische und theologische Mehrdeutigkeit offenlegen.
  - marker: f
    text: Auch möglich wäre »Leuchtender Abglanz«. »Reflexion« hält sowohl die Bedeutung eines Lichtwiderscheins als auch die eines inneren Gedankens offen.
    reason: Die doppelte Bild- und Denkbedeutung des Ausdrucks bewahren.
  - marker: g
    text: Das letzte Pronomen kann sich möglicherweise auf die Helferin, die Nachkommenschaft oder den zuvor genannten Abstieg beziehen. Die Übersetzung folgt der nächstliegenden femininen Referenz, ohne die Alternative auszuschließen.
    reason: Pronominale Mehrdeutigkeit kennzeichnen.
  - marker: h
    text: »Lichtschatten« ist eine absichtlich ungewöhnliche Wiedergabe der paradoxen Formulierung »light-shadow« im Zeugen.
    reason: Das paradoxe Quellenbild nicht harmonisieren.
lexical_decisions:
- source_word: psychic body
  choice: seelischer Leib
  rationale: Bewahrt die im Text vorausgesetzte Unterscheidung zwischen seelischer, sinnlicher und geistiger Wirklichkeit; »psychischer Körper« klänge im heutigen Deutsch klinisch und missverständlich.
- source_word: chief archon / chief ruler
  choice: oberster Archon / oberster Herrscher
  rationale: »Archon« bleibt als technischer kosmologischer Titel erhalten; die Variation des Zeugen wird bei »chief ruler« als »oberster Herrscher« wiedergegeben.
- source_word: Mother-Father
  choice: Mutter-Vater
  rationale: Erhält die bewusst spannungsvolle, geschlechtsübergreifende Gottesbezeichnung, ohne sie dogmatisch zu glätten.
- source_word: Radiant Reflection / Reflection of Light
  choice: Leuchtende Reflexion / Reflexion des Lichts
  rationale: Bewahrt die begriffliche Nähe der beiden Formulierungen und vermeidet eine vorschnelle Gleichsetzung mit geläufigeren theologischen Begriffen wie »Erleuchtung« oder »Gedanke«.
- source_word: Life
  choice: Leben
  rationale: Gibt den Eigennamen beziehungsweise Titel schlicht wieder; der technische Platzhalter des englischen Zeugen wird nicht in den Lesetext übernommen.
- source_word: light-shadow
  choice: Lichtschatten
  rationale: Die ungewöhnliche Zusammensetzung erhält das paradoxe Bild des Zeugen, statt es deutend aufzulösen.
theological_decisions:
- issue: Herkunft der belebenden Kraft
  choice: Die Kraft geht unwissentlich aus Jaltabaoth hervor und in Adam ein.
  alternative: Jaltabaoth belebt Adam aus eigener souveräner Macht.
  rationale: Der Text identifiziert seinen Geist ausdrücklich mit der Kraft seiner Mutter und betont seine Unwissenheit; diese Spannung muss erhalten bleiben.
- issue: Geschlecht der Adam gesandten Hilfe
  choice: »eine Helferin« mit weiblichen Pronomen
  alternative: geschlechtsneutrale »Hilfe«
  rationale: Der Zeuge verwendet anschließend »she«; die feminine Personifikation wird daher im Deutschen sichtbar gemacht.
- issue: Zwecksatz in Abschnitt 7
  choice: Die mehrdeutige Wendung bleibt als »denn sie könnten Macht … gewinnen« stehen.
  alternative: Eindeutige Zuordnung des Subjekts zu den Archonten oder zur Kraft der Mutter
  rationale: Das Pronomen und der logische Bezug sind im vorliegenden Zeugen unsicher. Eine eindeutige theologische Zuordnung wäre ohne koptische Prüfung voreilig.
- issue: Der Weg des Abstiegs in Abschnitt 8
  choice: »den Weg, auf dem sie herabkam«
  alternative: »den Weg, auf dem die Nachkommenschaft herabkam«
  rationale: Das Bezugswort des Pronomens ist im englischen Zeugen nicht eindeutig; die feminine Form nimmt am natürlichsten die personifizierte Helferin beziehungsweise Reflexion auf, wird aber als textkritisch prüfbedürftig markiert.
- issue: Sichtbarwerden des Menschen
  choice: »trat der Mensch sichtbar hervor«
  alternative: physisches Sichtbarwerden oder bloßes Leuchten ausdrücklich festlegen
  rationale: Der Zeuge verbindet Sichtbarkeit mit dem »Lichtschatten«, ohne den ontologischen Vorgang näher zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Technische Begriffe der spätantiken Kosmologie werden dort bewahrt, wo eine alltagssprachliche Ersetzung Bedeutungsverlust verursachen würde. Grundlage ist der bereitgestellte gemeinfreie englische Übersetzungszeuge; eine direkte Prüfung der koptischen Handschriften steht ausdrücklich noch aus. Die eingefügte Seitenzahl »20« wurde als handschriftliches Seitensignal nicht in den Lesetext aufgenommen.
