  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: de
  text: '1. Ich aber sagte: „Herr, was bedeutet: ‚Sie bewegte sich hin und her‘?“ Er lächelte und sagte: „Denke nicht, dass dies dem entspricht, was Mose sagte: ‚über den {Wassern:2}‘. Nein!


    2. Vielmehr bereute sie, als sie das Böse sah, das geschehen war, und den Raub, den ihr Sohn begangen hatte. In der Finsternis der Unwissenheit wurde sie von Vergessenheit überwältigt und begann sich zu schämen. [Und sie wagte nicht], zurückzukehren, sondern [bewegte sich] umher.


    3. Diese Bewegung aber ist das ‚Hin-und-her-Gehen‘. Und der Hochmütige erlangte von seiner Mutter eine Macht, denn er war unwissend und nahm an, außer seiner Mutter existiere niemand.


    4. Als er jedoch das Heer der Engel sah, das er erschaffen hatte, erhob er sich über sie.


    5. Als die Mutter ferner erkannte, dass das Gewand der Finsternis mangelhaft war, verstand sie, dass ihr Gefährte ihr nicht zugestimmt hatte.


    6. Sie bereute und weinte heftig. Die gesamte Fülle hörte auf ihr Gebet der Reue, und sie priesen für sie den unsichtbaren, jungfräulichen Geist.


    7. Und [er] stimmte zu. Als aber [der unsichtbare Geist] zugestimmt hatte, ergoss sich der heilige Geist aus ihrer gesamten Fülle über sie. Denn nicht ihr Gefährte allein näherte sich ihr, sondern er näherte sich ihr durch die Fülle, damit er ihren Mangel beheben konnte. Sie wurde emporgehoben – jedoch nicht in ihren eigenen Äon, sondern über ihren Sohn –, damit sie im Neunten wohnen sollte, bis sie ihren Mangel behoben hätte.


    8. Auch erging eine Stimme aus dem hohen himmlischen Äon: „Der Mensch existiert und der Sohn des Menschen.“ Der oberste Archon Jaltabaoth hörte sie und nahm an, die Stimme sei von seiner Mutter gekommen; doch er wusste nicht, woher sie gekommen war.


    9. Er offenbarte ihnen auch – das heißt: die heilige und vollkommene Mutter-Vater-Gestalt, die vollkommene Vorsehung, das Bild des Unsichtbaren, der der Vater des Alls ist und durch den alles entstand, den Urmenschen –, denn in männlicher Gestalt machte er sein Ebenbild sichtbar.[a]


    10. Da erbebte der gesamte Äon des obersten Archons, und die Grundfesten des Abgrunds gerieten in Bewegung. Der Grund der Wasser über der Materie wurde durch die Erscheinung dieses sichtbar gewordenen Bildes erleuchtet. Als alle Mächte und der oberste Archon hinsahen, sahen sie das ganze Gebiet unter ihnen erleuchtet.'
