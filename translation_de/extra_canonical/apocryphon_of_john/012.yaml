  footnotes:
  - marker: a
    text: Der Satzbau und die Zuordnung der Titel und Pronomen sind in diesem Abschnitt unsicher. Möglich ist auch eine engere Verbindung von „Mutter-Vater“, „Vorsehung“, „Bild des Unsichtbaren“ und „Urmensch“.
    reason: Kennzeichnet eine echte syntaktische und theologische Mehrdeutigkeit des vorliegenden Zeugen.
lexical_decisions:
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den gnostischen Fachbegriff verständlich und traditionsnah wieder, ohne den griechischen Terminus „Pleroma“ unmarkiert einzuführen.
- source_word: aeon
  choice: Äon
  rationale: Bewahrt den kosmologischen Fachbegriff; „Zeitalter“ wäre an mehreren Stellen sachlich irreführend.
- source_word: chief archon
  choice: oberster Archon
  rationale: Erhält den technischen Rangtitel und macht die Hierarchie deutlich.
- source_word: deficiency
  choice: Mangel
  rationale: Bewahrt sowohl den Zustand des Fehlens als auch die kosmologische Unvollständigkeit, ohne sie dogmatisch auszudeuten.
- source_word: Mother-Father
  choice: Mutter-Vater-Gestalt
  rationale: Bewahrt die paradoxe Doppelbezeichnung; „Gestalt“ macht die deutsche Konstruktion lesbar, ohne sie auf ein Geschlecht festzulegen.
- source_word: Primal Man
  choice: Urmensch
  rationale: Natürliches deutsches Kompositum für die ursprüngliche himmlische Menschengestalt; vermeidet eine Gleichsetzung mit einem gewöhnlichen ersten Menschen.
theological_decisions:
- issue: Unklares Subjekt in Abschnitt 7
  choice: Die Ergänzungen [er] und [der unsichtbare Geist] bleiben sichtbar markiert.
  alternative: Das Subjekt ohne Markierung eindeutig als unsichtbaren Geist oder Gefährten bestimmen.
  rationale: Die überlieferte bzw. rekonstruierte Syntax ist unsicher; eine eindeutige Identifizierung würde die theologische Spannung glätten.
- issue: Verhältnis des Gefährten zur Fülle in Abschnitt 7
  choice: „nicht ihr Gefährte allein … sondern … durch die Fülle“
  alternative: „nicht ihr Gefährte … vielmehr die Fülle“
  rationale: Die inklusive Lesart bewahrt die Aussage des Zeugen, dass der Gefährte handelt, jedoch vermittelt durch die gesamte Fülle.
- issue: „Der Mensch“ und „Sohn des Menschen“ in Abschnitt 8
  choice: Beide Titel werden wörtlich und mit bestimmtem Artikel wiedergegeben.
  alternative: Christologische Identifizierung oder Umschreibung als „Menschensohn“.
  rationale: Der Text nennt zwei koordinierte Größen; die Übersetzung soll weder ihre Beziehung noch ihre Identität vorentscheiden.
- issue: Pronomen und Appositionen in Abschnitt 9
  choice: Die verschachtelte Aufzählung bleibt erhalten und wird als Offenbarung der genannten Gestalten/Titel verstanden.
  alternative: Die Titel auf mehrere eindeutig identifizierte Wesen verteilen.
  rationale: Der englische Zeuge ist syntaktisch mehrdeutig; die Übersetzung vermeidet eine nicht belegte ontologische Aufteilung.
translation_notes:
  register: Moderne, würdige Standardsprache mit behutsam beibehaltenen gnostischen Fachbegriffen. Eckige Klammern und der überlieferte Marker {Wassern:2} bleiben erhalten; die bloße Seitenzahl «14» wird nicht in den Lesetext übernommen. Da eine direkte Prüfung des koptischen Quelltexts noch aussteht, ist dies ein quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugen.
