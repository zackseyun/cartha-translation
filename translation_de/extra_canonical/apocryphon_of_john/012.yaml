    9. Er lehrte sie auch – nämlich die heilige und vollkommene Mutter-Vater, die vollkommene Vorsehung, das Bild des Unsichtbaren, der der Vater des Alls ist und durch den alles entstand, den Urmenschen –, denn in männlicher Gestalt machte er sein Ebenbild sichtbar.[a]


