  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist in Abschnitt 9 nötig: Der Entwurf gibt „He also taught them“ fälschlich als „Er offenbarte ihnen auch“ wieder. Die revidierte Fassung bewahrt das Verb „lehrte“ sowie die unsichere syntaktische Zuordnung der anschließenden Titel. Kleinere Anpassungen erhöhen zudem die Nähe zum englischen Zeugen („grinste“, „verschaffte sich“, „erhabenen“, „offenbart worden war“), ohne die vorläufige, vom Koptischen noch nicht direkt geprüfte Grundlage zu überschreiten.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. Fachbegriffe wie „Fülle“, „Äon“ und „Archon“ sind konsistent; die schwierige Reihung in Abschnitt 9 wird lesbar, aber nicht künstlich eindeutig gemacht.
  terminology: „Mutter-Vater“ wird ohne den sachlich nicht belegten Zusatz „-Gestalt“ wiedergegeben. „Urmensch“, „Vorsehung“, „Fülle“, „Äon“, „oberster Archon“ und „Mangel“ bewahren die technischen bzw. kosmologischen Begriffe des Zeugen. Die Titel „Der Mensch“ und „der Sohn des Menschen“ bleiben voneinander unterschieden.
  issues:
  - severity: high
    issue: Abschnitt 9 übersetzt „He also taught them“ als „Er offenbarte ihnen auch“.
    rationale: „Lehren“ und „offenbaren“ sind hier nicht austauschbar. Die Änderung verschiebt die im Zeugen ausgedrückte Handlung und muss daher korrigiert werden.
  - severity: medium
    issue: „Mutter-Vater-Gestalt“ ergänzt „Gestalt“, das im vorliegenden Zeugen nicht steht.
    rationale: Die Ergänzung ist zwar erklärend gemeint, kann die ontologische Aussage aber enger festlegen. „Mutter-Vater“ bewahrt die ungewöhnliche Doppelbezeichnung ohne Zusatz.
  - severity: low
    issue: Mehrere Formulierungen sind gegenüber dem Zeugen leicht abgeschwächt oder weniger genau.
    rationale: „lächelte“ statt „grinste“, „erlangte“ statt „verschaffte sich“ und „sichtbar gewordenes Bild“ statt eines Bildes, das „offenbart worden war“, sind nicht zwingend sinnverändernd, lassen sich aber quellentreuer formulieren.
  revised_text: '1. Ich aber sagte: „Herr, was bedeutet: ‚Sie bewegte sich hin und her‘?“ Er grinste und sagte: „Denke nicht, dass dies dem entspricht, was Mose sagte: ‚über den {Wassern:2}‘. Nein!


    2. Vielmehr bereute sie, als sie das Böse sah, das geschehen war, und den Raub, den ihr Sohn begangen hatte. In der Finsternis der Unwissenheit wurde sie von Vergessenheit überwältigt und begann sich zu schämen. [Und sie wagte nicht], zurückzukehren, sondern [bewegte sich] umher.


    3. Diese Bewegung aber ist das ‚Hin-und-her-Gehen‘. Und der Hochmütige verschaffte sich von seiner Mutter eine Macht, denn er war unwissend und nahm an, außer seiner Mutter existiere niemand.


    4. Als er jedoch das Heer der Engel sah, das er erschaffen hatte, erhob er sich über sie.


    5. Als die Mutter ferner erkannte, dass das Gewand der Finsternis fehlerhaft war, verstand sie, dass ihr Gefährte ihr nicht zugestimmt hatte.


    6. Sie bereute und weinte heftig. Die gesamte Fülle hörte auf ihr Gebet der Reue, und sie priesen für sie den unsichtbaren, jungfräulichen Geist.


    7. Und [er] stimmte zu. Als aber [der unsichtbare Geist] zugestimmt hatte, ergoss sich der heilige Geist aus ihrer gesamten Fülle über sie. Denn nicht ihr Gefährte allein näherte sich ihr, sondern er näherte sich ihr durch die Fülle, damit er ihren Mangel beheben konnte. Sie wurde emporgehoben – jedoch nicht in ihren eigenen Äon, sondern über ihren Sohn –, damit sie im Neunten wohnen sollte, bis sie ihren Mangel behoben hätte.


