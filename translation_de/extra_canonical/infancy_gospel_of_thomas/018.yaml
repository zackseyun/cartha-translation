review_pass:
  verdict: revise
  source_fidelity: Auf Grundlage der vorliegenden englischen Zeugnisübersetzung ist der Handlungsablauf getreu wiedergegeben. Da eine direkte Prüfung des griechischen Wortlauts noch aussteht, bleibt insbesondere die genaue semantische Reichweite von »worshipped« und »souls« vorläufig. »Menschen vor dem Tod gerettet« gibt »saved many souls from death« idiomatisch wieder, ohne eine körperlose Bedeutung von »Seelen« festzulegen.
  naturalness: Der Erzählton ist modernes Standarddeutsch. »Großer Tumult« trifft »a great commotion« präziser und idiomatischer als »große Aufregung«. »Verrichte deine Arbeit« ist in der direkten Aufforderung natürlicher als »tu deine Arbeit«.
  terminology: »Vom Himmel«, »niederwerfen« und »vor dem Tod retten« bewahren die Aussage und vermeiden konfessionell einengende Deutungen. Die Fußnote zu »niederwerfen« wahrt die mögliche Spannweite zwischen Huldigung und Anbetung. Die Fußnote zu »Seelen« wird an die revidierte Formulierung angepasst.
  issues:
  - severity: medium
    issue: »viele Menschenleben vor dem Tod gerettet«
    rationale: 'Die Formulierung ist im Deutschen semantisch und idiomatisch weniger passend: Gerettet werden hier die Personen, nicht ihre einzelnen »Menschenleben«. »viele Menschen vor dem Tod gerettet« gibt den kontextuell personalen Sinn klar wieder und lässt die sprachliche Ambiguität von »souls« nicht zu einer dogmatischen Aussage werden.'
  - severity: low
    issue: »Es entstand große Aufregung«
    rationale: Die Wendung ist verständlich, trifft aber das als »great commotion« bezeichnete öffentliche Gedränge bzw. den Tumult weniger genau als »Es entstand großer Tumult«.
  - severity: low
    issue: »tu deine Arbeit«
    rationale: Die Formulierung ist möglich, aber »verrichte deine Arbeit« ist als feierlich-knappe Aufforderung im modernen deutschen Erzählregister natürlicher.
  revised_text: '(1) Nach einiger Zeit wurde ein Gebäude errichtet. Es entstand großer Tumult, und Jesus stand auf und ging dorthin.


    Als Jesus einen Mann tot daliegen sah, ergriff er dessen Hand und sagte: »Ich sage dir, Mann: Steh auf und verrichte deine Arbeit!« Sofort stand der Mann auf und warf sich vor ihm nieder.[a]


    (2) Die Menge sah es und staunte. Die Leute sagten: »Dieses Kind ist vom Himmel, denn es hat viele Menschen vor dem Tod gerettet[b] und wird dies sein Leben lang weiter tun.«'
  revised_footnotes:
  - marker: a
    text: 'Oder: »betete ihn an« beziehungsweise »huldigte ihm«. Die zugrunde liegende Wendung kann Niederwerfung als Verehrung oder Anbetung bezeichnen.'
    reason: Bewahrt die mögliche christologische Bedeutungsbreite der Handlung.
  - marker: b
    text: 'Wörtlich nach der vorliegenden englischen Zeugnisübersetzung: »viele Seelen vom Tod gerettet«. Im Zusammenhang können damit Menschen beziehungsweise Personen gemeint sein.'
    reason: Dokumentiert die wörtlichere Form und die kontextbezogene, idiomatische Wiedergabe.
  revision_rationale: Die Revision verbessert zwei idiomatische Formulierungen und ersetzt »Menschenleben« durch »Menschen«, weil die Rettung im Satz Personen gilt. Inhalt, Erzählreihenfolge, Ambiguität der Verehrungsgeste und die offene Tragweite der Aussage »vom Himmel« bleiben erhalten.
