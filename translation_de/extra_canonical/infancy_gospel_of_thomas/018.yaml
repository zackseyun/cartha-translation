base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: de
  text: '(1) Nach einiger Zeit wurde ein Gebäude errichtet. Es entstand große Aufregung, und Jesus stand auf und ging dorthin.


    Als Jesus einen Mann tot daliegen sah, ergriff er seine Hand und sagte: »Ich sage dir, Mann: Steh auf und tu deine Arbeit!« Sofort stand der Mann auf und warf sich vor ihm nieder.[a]


    (2) Die Menge sah es und staunte. Die Leute sagten: »Dieses Kind ist vom Himmel, denn es hat viele Menschenleben vor dem Tod gerettet[b] und wird dies sein Leben lang weiter tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »betete ihn an« beziehungsweise »huldigte ihm«. Die zugrunde liegende Wendung kann Niederwerfung als Verehrung oder Anbetung bezeichnen.'
    reason: Bewahrt die mögliche christologische Bedeutungsbreite der Handlung.
  - marker: b
    text: 'Wörtlich nach der vorliegenden englischen Zeugnisübersetzung: »viele Seelen vom Tod gerettet«; gemeint sein können hier Menschen beziehungsweise Menschenleben.'
    reason: Dokumentiert die wörtlichere Form und die kontextbezogene Übersetzungsentscheidung.
lexical_decisions:
- source_word: building
  choice: Gebäude
  rationale: Die englische Zeugnisübersetzung bezeichnet das im Bau befindliche Objekt; »Gebäude« bewahrt die allgemeine Bedeutung.
- source_word: great commotion
  choice: große Aufregung
  rationale: Natürliches modernes Deutsch, das ein auffälliges, durch den Todesfall ausgelöstes Geschehen ausdrückt, ohne die Art des Tumults näher festzulegen.
- source_word: seized
  choice: ergriff
  rationale: Gibt die kräftige, unmittelbare Handlung würdig und prägnant wieder.
- source_word: worshipped
  choice: warf sich vor ihm nieder
  rationale: Bewahrt die sichtbare Geste von Verehrung beziehungsweise Huldigung, ohne ihre genaue theologische Reichweite festzulegen.
- source_word: souls
  choice: Menschenleben
  rationale: Im Zusammenhang mit Rettung »vom Tod« bezeichnet das Wort wahrscheinlich Personen beziehungsweise Leben; »Menschenleben« vermeidet im Deutschen die irreführende Vorstellung körperloser Seelen.
- source_word: all the days of his life
  choice: sein Leben lang
  rationale: Idiomatiche, inhaltlich genaue Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Bedeutung der Niederwerfung vor Jesus
  choice: »warf sich vor ihm nieder« mit Fußnote zur Bedeutungsbreite
  alternative: »betete ihn an«
  rationale: Die Handlung kann Verehrung, Huldigung oder Anbetung ausdrücken. Die Übersetzung soll die christologische Deutung nicht stillschweigend auf eine einzige Möglichkeit verengen.
- issue: Rettung vieler »Seelen« vom Tod
  choice: »hat viele Menschenleben vor dem Tod gerettet«
  alternative: »hat viele Seelen vom Tod gerettet«
  rationale: Der unmittelbare Kontext handelt von körperlichem Tod und Wiederbelebung. Die gewählte Formulierung wahrt diesen Sinn, ohne eine Lehre über die vom Körper getrennte Seele einzutragen.
- issue: Herkunft »vom Himmel«
  choice: wörtlich »vom Himmel«
  alternative: »himmlischen Ursprungs«
  rationale: Die knappe Aussage der Menge bleibt in ihrer theologischen Tragweite bewusst unkommentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Wegen der noch ausstehenden Prüfung des griechischen Wortlauts ist der Entwurf ausdrücklich vorläufig und stützt sich auf die angegebene gemeinfreie englische Zeugnisübersetzung.
