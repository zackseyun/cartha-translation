base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: de
  text: '(1) Das Kind Jesus lachte und sagte: »Nun sollen die Unfruchtbaren Frucht bringen, die Blinden sehen und die Unverständigen im Herzen begreifen, dass ich von oben her hier bin, um die dort unten zu befreien und nach oben zu rufen, so wie der, der mich zu euch gesandt hat, es mir aufgetragen hat.«


    (2) Und sofort wurden alle gerettet, die unter seinen Fluch geraten waren. Von da an wagte niemand mehr, ihn herauszufordern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: barren
  choice: die Unfruchtbaren
  rationale: Bewahrt die bildhafte und möglicherweise mehrdeutige Aussage des vorliegenden Zeugen, ohne sie auf unfruchtbare Frauen oder unfruchtbares Land festzulegen.
- source_word: foolish in heart
  choice: die Unverständigen im Herzen
  rationale: Gibt die antike Verbindung von mangelnder Einsicht und dem Herzen als innerem Erkenntniszentrum verständlich und würdig wieder.
- source_word: deliver
  choice: befreien
  rationale: Trägt hier den Sinn von Rettung beziehungsweise Befreiung, ohne eine bestimmte soteriologische Deutung festzuschreiben.
- source_word: call them up
  choice: nach oben rufen
  rationale: Erhält die räumliche Gegenüberstellung von oben und unten sowie die mögliche weitergehende Bedeutung, statt sie erklärend aufzulösen.
- source_word: provoke
  choice: herauszufordern
  rationale: Bezeichnet natürlich im Deutschen ein absichtliches Reizen oder Sich-Anlegen mit Jesus.
theological_decisions:
- issue: Herkunft Jesu »von oben«
  choice: dass ich von oben her hier bin
  alternative: dass ich von oben gekommen bin
  rationale: Die gewählte Fassung folgt der im Zeugen ungewöhnlichen Verbindung von Gegenwart und Herkunft und vermeidet, die Aussage unnötig zu glätten.
- issue: Rettung der vom Fluch Betroffenen
  choice: wurden ... gerettet
  alternative: wurden ... geheilt / wiederhergestellt
  rationale: Bewahrt die breite Aussage des Zeugen und legt nicht fest, ob körperliche Heilung, Wiederbelebung oder umfassende Wiederherstellung gemeint ist.
- issue: Bezeichnung des Sendenden
  choice: der, der mich zu euch gesandt hat
  alternative: mein Vater
  rationale: Nennt den Sendenden nicht ausdrücklich Gott oder Vater, da der vorliegende Textzeuge dies an dieser Stelle offenlässt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung des griechischen Wortlauts vorläufig und hält sich eng an den angegebenen gemeinfreien englischen Zeugen.
