review_pass:
  verdict: revise
  source_fidelity: Überwiegend nah am bereitgestellten englischen Zeugnis. Sichere Korrekturen betreffen jedoch die Wiedergabe von »excellent«, die pluralische Bezugnahme auf die Wasser sowie »squawking«. »zwitschernd« ist für das hörbare, eher laute Rufen der wegfliegenden Vögel zu spezifisch und zu mild. Die ungewöhnliche Gegenüberstellung von Wort und Tat bleibt bewusst erkennbar.
  naturalness: Der Erzählton ist modern und gut lesbar. »Er hat ... Ton zubereitet« ist als Vorwurf verständlich; »Geht! Fliegt davon ...« gibt den direkten Imperativ ohne die zusätzliche schroffe Färbung von »Fort mit euch!« wieder. »laut rufend« ist natürlich und semantisch offener als »zwitschernd«.
  terminology: »Furt«, »Sabbat«, »Ton«, »Spatzen«, »Josef« und »Pharisäer« sind angemessen. Die Bezeichnungen »ein Jude« und später »der Pharisäer« werden nicht harmonisiert; die Fußnote ist hierfür sachgerecht. »verleumdete« folgt dem audit trail genauer als das abschwächende »beschuldigte«, ohne die im Text behauptete Übertretung als Übersetzerurteil auszugeben.
  issues:
  - severity: medium
    issue: »sauber und klar« lässt »excellent« unberücksichtigt und verschiebt die Aussage zu einer bloßen Wasserbeschreibung.
    rationale: Das Zeugnis sagt ausdrücklich, dass Jesus die Wasser »clean and excellent« machte. »rein und vortrefflich« bewahrt beide Prädikate, auch wenn die Formulierung absichtlich leicht markiert wirkt.
  - severity: medium
    issue: Die Bezüge auf die gesammelten Wasser werden im Entwurf singularisch gefasst (»es«, »ihm«).
    rationale: Das Zeugnis spricht nach dem Sammeln in Becken von mehreren Wassern und verwendet »them«. Der Plural sollte erhalten bleiben.
  - severity: low
    issue: »zwitschernd« ist keine angemessene Entsprechung von »squawking«.
    rationale: »Squawking« bezeichnet einen auffälligen, rauen oder lauten Vogelruf. »laut rufend« bewahrt den Sinn ohne unnötig genaue Artbestimmung.
  - severity: low
    issue: »Fort mit euch!« verstärkt den schlichten Bewegungsbefehl »Go« zu einer abweisenden Wegjagung.
    rationale: »Geht! Fliegt davon ...« ist näher am Wortlaut und im Deutschen idiomatisch.
  revised_text: '(1) Das Kind Jesus war fünf Jahre alt. Nachdem es geregnet hatte, spielte er an der Furt eines fließenden Baches. Er rührte das schmutzige Wasser auf, sammelte es in Becken und machte es rein und vortrefflich, indem er es allein durch sein Wort ordnete – und nicht durch eine Tat.


    (2) Dann nahm er weichen Ton aus dem Schlamm und formte daraus zwölf Spatzen. Es war aber Sabbat, als er dies tat, und viele Kinder waren bei ihm.


    (3) Ein Jude sah, wie das Kind Jesus dies mit den anderen Kindern tat. Er ging zu Josef, seinem Vater, und verleumdete das Kind Jesus mit den Worten: »Er hat am Sabbat Ton zubereitet, obwohl das nicht erlaubt ist, und zwölf Spatzen geformt.«


    (4) Da ging Josef zu Jesus, wies ihn zurecht und sagte: »Warum tust du diese Dinge am Sabbat?«


    Jesus aber klatschte in die Hände, gebot den Vögeln vor allen Anwesenden mit einem Schrei und sagte: »Geht! Fliegt davon wie lebendige Wesen!« Da flogen die Spatzen auf und flogen laut rufend davon.


    (5) Als der Pharisäer[a] das sah, staunte er und berichtete allen seinen Freunden davon.'
  revised_footnotes:
  - marker: a
    text: Zuvor wird der Beobachter lediglich als »ein Jude« bezeichnet; hier nennt ihn die Überlieferung »den Pharisäer«.
    reason: Kennzeichnet den auffälligen Wechsel der Personenbezeichnung, ohne ihn im Haupttext zu harmonisieren.
  revision_rationale: Die Revision folgt dem bereitgestellten englischen Zeugnis, ohne eine noch ausstehende Prüfung des griechischen Wortlauts vorwegzunehmen. Sie stellt die ausgelassene Wertungsnuance von »excellent« wieder her, erhält bei den Wassern die Pluralreferenz beziehungsweise deren sachliche Mehrzahl, korrigiert den Vogelruf und vermeidet eine zusätzliche abweisende Nuance im Befehl. Die auffällige Figurenbezeichnung und die überlieferte, syntaktisch markierte Gegenüberstellung von Wort und Tat bleiben erhalten.
