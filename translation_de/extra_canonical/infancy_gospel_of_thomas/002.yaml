base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: de
  text: '(1) Das Kind Jesus war fünf Jahre alt. Nachdem es geregnet hatte, spielte er an der Furt eines fließenden Baches. Er rührte das schlammige Wasser auf, sammelte es in Becken und machte es sauber und klar, indem er ihm allein durch sein Wort gebot – und nicht durch eine Tat.


    (2) Dann nahm er weichen Ton aus dem Schlamm und formte daraus zwölf Spatzen. Es war aber Sabbat, als er dies tat, und viele Kinder waren bei ihm.


    (3) Ein Jude sah, wie das Kind Jesus dies mit den anderen Kindern tat. Er ging zu Josef, seinem Vater, und beschuldigte das Kind Jesus mit den Worten: »Er hat am Sabbat Ton zubereitet, obwohl das nicht erlaubt ist, und zwölf Spatzen geformt.«


    (4) Da ging Josef zu Jesus, wies ihn zurecht und sagte: »Warum tust du so etwas am Sabbat?«


    Jesus aber klatschte in die Hände, rief den Vögeln vor allen Anwesenden einen Befehl zu und sagte: »Fort mit euch! Fliegt davon wie lebendige Wesen!« Da flogen die Spatzen auf und verschwanden zwitschernd.


    (5) Als der Pharisäer[a] das sah, staunte er und berichtete allen seinen Freunden davon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zuvor wird der Beobachter lediglich als »ein Jude« bezeichnet; hier nennt ihn die Überlieferung »den Pharisäer«.
    reason: Kennzeichnet den auffälligen Wechsel der Personenbezeichnung, ohne ihn im Haupttext zu harmonisieren.
lexical_decisions:
- source_word: ford
  choice: Furt
  rationale: Bewahrt die konkrete Ortsangabe des Zeugnisses und ist im modernen Standarddeutsch verständlich.
- source_word: clean and excellent
  choice: sauber und klar
  rationale: »Klar« ergibt im Zusammenhang mit Wasser einen natürlichen Sinn; die vorläufige englische Quelle erlaubt mangels griechischer Prüfung keine präzisere Festlegung von »excellent«.
- source_word: ordering them by word alone
  choice: indem er ihm allein durch sein Wort gebot
  rationale: Bewahrt den Kontrast zwischen wirksamem Wort und äußerer Handlung; der Singular bezieht sich natürlich auf das gesammelte Wasser.
- source_word: soft clay
  choice: weichen Ton
  rationale: »Ton« bezeichnet formbare Erde idiomatisch und passt zum Formen der Vögel.
- source_word: slandered
  choice: beschuldigte
  rationale: Vermeidet die möglicherweise zu starke rechtliche oder moralische Festlegung von »verleumdete«, da der Mann eine konkrete Sabbatübertretung meldet.
- source_word: squawking
  choice: zwitschernd
  rationale: Gibt den hörbaren Vogelruf natürlich wieder, ohne die eher schrille Konnotation von »kreischend« aufzuzwingen.
theological_decisions:
- issue: Sabbath activity and alleged prohibition
  choice: »obwohl das nicht erlaubt ist« bleibt als Aussage des Anklägers stehen
  alternative: Die Aussage durch einen erklärenden Zusatz als verbindliche Sabbatlehre bestätigen
  rationale: Der Text berichtet die Einschätzung der Figur; die Übersetzung entscheidet nicht zusätzlich über deren halachische Geltung.
- issue: Animation of the clay sparrows
  choice: »Fliegt davon wie lebendige Wesen!«
  alternative: »Werdet lebendig und fliegt davon!«
  rationale: Die überlieferte Formulierung vergleicht beziehungsweise kennzeichnet ihren Flug als den lebendiger Wesen, ohne ausdrücklich einen separaten Schöpfungsbefehl »Werdet lebendig« zu formulieren.
- issue: Identity shift from a Jew to the Pharisee
  choice: Beide Bezeichnungen werden entsprechend dem Zeugnis bewahrt
  alternative: Beide Stellen zu »Pharisäer« harmonisieren
  rationale: Die Spannung innerhalb der Erzählung wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdiges und gut verständliches Erzählregister. Die Verszählung und die markante Gegenüberstellung von Wort und Tat bleiben erhalten. Da eine direkte Prüfung des griechischen Wortlauts noch aussteht, ist die Fassung ausdrücklich am bereitgestellten gemeinfreien englischen Zeugnis orientiert; unsichere Nuancen wurden nicht durch konfessionelle oder dogmatische Deutungen ergänzt.
