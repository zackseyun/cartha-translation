base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: de
  text: '(1) Das Kind Jesus war etwa sieben Jahre alt. Seine Mutter Maria schickte ihn, Wasser zu holen. Am Wasserbecken herrschte jedoch großes Gedränge; der Krug wurde angestoßen und zerbrach.


    (2) Da breitete Jesus den Umhang aus, den er trug, füllte ihn mit Wasser und brachte es seiner Mutter. Als Maria sah, welches Zeichen Jesus getan hatte, küsste sie ihn und sagte: »Herr, mein Gott, segne unser Kind.« Denn sie fürchteten, jemand könnte ihn verhexen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung der griechischen Handschriftentradition steht noch aus. Der Personenkreis von »sie fürchteten« wird im vorliegenden Zeugen nicht näher bestimmt.
    reason: Kennzeichnet die begrenzte Quellenlage und bewahrt die genuine Unbestimmtheit des Plurals.
lexical_decisions:
- source_word: water cistern
  choice: Wasserbecken
  rationale: Gibt den im englischen Zeugen bezeichneten gemeinschaftlichen Ort der Wasserentnahme natürlich wieder, ohne aufgrund der noch ausstehenden Prüfung des Griechischen eine engere Bauform festzulegen.
- source_word: pitcher
  choice: Krug
  rationale: Ein geläufiges, würdiges Wort für ein tragbares Wassergefäß.
- source_word: cloak
  choice: Umhang
  rationale: Bezeichnet natürlich ein getragenes äußeres Kleidungsstück und bewahrt den Kern des Wunderzeichens.
- source_word: sign
  choice: Zeichen
  rationale: Bewahrt die religiöse und erzählerische Bedeutung von »sign«, statt es lediglich als Wunder zu erklären.
- source_word: bewitch
  choice: verhexen
  rationale: Gibt die Furcht vor schädlicher magischer Einwirkung in verständlichem modernem Deutsch wieder.
theological_decisions:
- issue: Anrede »Lord, my God«
  choice: »Herr, mein Gott« als an Gott gerichtete Bitte
  alternative: 'Als Anrede an Jesus verstehen: »Herr, mein Gott, segne unser Kind.«'
  rationale: Die englische Zeichensetzung lässt den Bezug formal offen. Im Zusammenhang bittet Maria um den Segen für »unser Kind«, was eine Anrede an Gott nahelegt; die Formulierung selbst bleibt jedoch unverändert und löst die mögliche Spannung nicht durch einen erklärenden Zusatz auf.
- issue: Plural in »they were afraid«
  choice: »sie fürchteten«
  alternative: »Maria fürchtete«
  rationale: Der überlieferte englische Zeuge bietet einen nicht näher bestimmten Plural. Dieser wird bewahrt, statt den Personenkreis stillschweigend festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze, klare Sätze tragen die schlichte Wundererzählung; unnötige altertümliche Wendungen und konfessionelle Deutungen wurden vermieden.
