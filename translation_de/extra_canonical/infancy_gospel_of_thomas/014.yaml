review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng: die Abfolge von Unterricht, Herausforderung, Schlag, Fluch, Tod und Josefs Schutzanweisung bleibt erhalten. Die Zweckangabe in V. 3 gibt die Sorge wieder, dass Personen, die Jesus provozieren, nicht sterben. In V. 1 ist die doppelte Negation zwar semantisch richtig, aber unnötig schwer verständlich und stilistisch weniger präzise als eine positive idiomatische Formulierung.'
  naturalness: Modernes Standarddeutsch wird weitgehend erreicht. »dass Jesus die Buchstaben nicht kannte« ist wegen der doppelten Negation und der Vergangenheitsform im Kontext holprig. »Der Lehrer schrieb Jesus das Alphabet auf« ist verständlich, aber »schrieb für Jesus das Alphabet auf« entspricht der gemeinten Handlung klarer.
  terminology: »Buchstaben«, »Alphabet«, »Alpha« und »Beta« sind sachgerecht. »verfluchte« gibt cursed direkt wieder. »reizen« bewahrt die offene Bedeutung von provoke, ohne sie auslegend einzuengen. Die Namen Josef und Jesus sind in dieser modernen deutschen Fassung angemessen.
  issues:
  - severity: low
    issue: Schwerfällige doppelte Negation in V. 1
    rationale: »Er wollte nicht, dass Jesus die Buchstaben nicht kannte« gibt den Zeugen grundsätzlich wieder, ist aber im Deutschen unnötig umständlich. »dass Jesus mit den Buchstaben unvertraut blieb« ist idiomatischer und bewahrt die Bedeutung.
  - severity: low
    issue: Unklare Stellung von »auf« bei der Schreibhandlung
    rationale: »schrieb Jesus das Alphabet auf« kann vorübergehend so gelesen werden, als schreibe Jesus selbst. »schrieb für Jesus das Alphabet auf« verdeutlicht, dass der Lehrer handelt und Jesus der Adressat ist.
  revised_text: '(1) Josef sah Jesu Weisheit und Verständnis. Er wollte nicht, dass Jesus mit den Buchstaben unvertraut blieb, und vertraute ihn deshalb einem anderen Lehrer an.


    Der Lehrer schrieb für Jesus das Alphabet auf und sagte: »Sag Alpha.«


    (2) Das Kind sagte: »Sag du mir zuerst, was Beta ist, dann sage ich dir, was Alpha ist.«


    Da wurde der Lehrer ärgerlich und schlug ihn. Jesus verfluchte ihn, und der Lehrer fiel zu Boden und starb.


    (3) Das Kind ging zu seinen Eltern nach Hause. Josef rief Jesu Mutter und befahl ihr, ihn nicht aus dem Haus zu lassen, damit diejenigen, die ihn reizen, nicht sterben.'
  revised_footnotes: []
  revision_rationale: Die Revision glättet ausschließlich zwei sprachliche Formulierungen. Sie ändert weder die Ereignisfolge noch die offene Kausalität zwischen Fluch, Fall und Tod oder den im Schluss bewahrten Zweck von Josefs Anordnung. Da die unmittelbare Kontrolle an der griechischen Handschriftentradition weiterhin aussteht, bleibt die Fassung hinsichtlich dieses Textbefunds vorläufig.
