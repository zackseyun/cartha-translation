base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: de
  text: '(1) Josef sah die Weisheit und das Verständnis Jesu. Er wollte nicht, dass Jesus die Buchstaben nicht kannte, und vertraute ihn deshalb einem anderen Lehrer an.


    Der Lehrer schrieb Jesus das Alphabet auf und sagte: »Sag Alpha.«


    (2) Das Kind sagte: »Sag du mir zuerst, was Beta ist, dann sage ich dir, was Alpha ist.«


    Da wurde der Lehrer ärgerlich und schlug ihn. Jesus verfluchte ihn, und der Lehrer fiel zu Boden und starb.


    (3) Das Kind ging zu seinen Eltern nach Hause. Josef rief die Mutter Jesu und befahl ihr, ihn nicht aus dem Haus zu lassen, damit diejenigen, die ihn reizen, nicht sterben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: letters
  choice: die Buchstaben
  rationale: Im Zusammenhang mit Alpha und Beta bezeichnet der Ausdruck die Schriftzeichen beziehungsweise elementare Lese- und Schreibkenntnisse; »Buchstaben« erhält den konkreten Bezug.
- source_word: gave him over to another teacher
  choice: vertraute ihn deshalb einem anderen Lehrer an
  rationale: Gibt die Übergabe zur Unterweisung natürlich wieder, ohne einen unnötig harten Beiklang.
- source_word: provoke
  choice: reizen
  rationale: Bewahrt die offene Bedeutung eines Verhaltens, das Zorn oder eine Reaktion hervorruft, ohne genauer zu bestimmen, ob es sich um Widerspruch, Kränkung oder körperliche Gewalt handelt.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen Jesu Fluch und dem Tod des Lehrers
  choice: Die Ereignisfolge wird direkt und ohne erklärenden Zusatz wiedergegeben.
  alternative: Den Tod ausdrücklich als unmittelbare Wirkung des Fluches erklären.
  rationale: Der vorliegende Zeuge stellt Fluch, Fall und Tod nebeneinander, erläutert aber den Wirkmechanismus nicht.
- issue: Möglichkeitsgrad im Schlusssatz
  choice: »damit diejenigen, die ihn reizen, nicht sterben«
  alternative: »damit diejenigen, die ihn reizen, nicht etwa sterben« oder »nicht sterben könnten«
  rationale: Die schlichte Zweckkonstruktion erhält Josefs Sorge und die im Text angelegte Gefahr, ohne sie als sichere Gesetzmäßigkeit oder bloße Möglichkeit umzudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählführung. Die Namen Jesus und Josef ersetzen mehrdeutige Pronomen dort, wo dies im Deutschen der Verständlichkeit dient. Der Entwurf ist wegen der noch ausstehenden direkten Prüfung der griechischen Handschriftentradition als vorläufig anzusehen.
