    (2) Er lag ausgestreckt da und war im Sterben. Da lief das Kind Jesus zu Jakobus und blies auf die Bissstelle. Sofort war die Bisswunde geheilt. Das Tier wurde vernichtet, und Jakobus wurde gerettet.[a]'
  revised_footnotes:
