translation:
  language: de
  text: '**16. Jesus heilt Jakobus nach einem Schlangenbiss**


    (1) Jakobus ging in das Wäldchen, um Reisig zu bündeln, damit sie Brot backen konnten. Jesus ging mit ihm. Während sie das Reisig sammelten, biss eine gefährliche Schlange Jakobus in die Hand.


    (2) Er lag ausgestreckt da und war im Sterben. Da lief das Kind Jesus zu Jakobus und blies auf die Bissstelle. Sofort war der Biss geheilt. Das Tier ging zugrunde, und Jakobus wurde gerettet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift Hagios Saba 259 enthält die Kapitel 17 und 18 nicht. Diese beiden folgenden Kapitel beruhen daher auf späteren griechischen Handschriften.
    reason: Überlieferungsgeschichtlicher Hinweis aus der bereitgestellten Textgrundlage; er betrifft die nachfolgenden Kapitel, nicht die Zugehörigkeit von Kapitel 16.
lexical_decisions:
- source_word: grove
  choice: Wäldchen
  rationale: Gibt den bewaldeten Sammelort natürlich wieder, ohne einen Obstgarten oder eine bestimmte Baumart vorauszusetzen.
- source_word: tie up sticks
  choice: Reisig bündeln
  rationale: Bezeichnet idiomatisch das Sammeln und Zusammenbinden dünner Zweige als Brennmaterial zum Brotbacken.
- source_word: terrible snake
  choice: gefährliche Schlange
  rationale: Drückt die im Zusammenhang tödliche Bedrohung in natürlichem Deutsch aus; eine direkte Prüfung des griechischen Adjektivs steht noch aus.
- source_word: blew on the bite
  choice: blies auf die Bissstelle
  rationale: Bewahrt die konkrete Handlung und macht zugleich deutlich, worauf Jesus bläst.
- source_word: the beast was destroyed
  choice: das Tier ging zugrunde
  rationale: Bewahrt die Aussage vom Ende der Schlange, ohne eine nicht ausdrücklich genannte Art der Vernichtung hinzuzufügen.
- source_word: was saved
  choice: wurde gerettet
  rationale: Erhält die mögliche Spannung zwischen körperlicher Rettung und der breiteren Bedeutung des Rettens, statt auf „überlebte“ zu verengen.
theological_decisions:
- issue: Art und Ursache der Heilung
  choice: Die unmittelbare Folge von Jesu Handlung wird erzählt, ohne den Mechanismus näher zu erklären.
  alternative: Die Heilung ausdrücklich als Wunder oder als göttliche Machttat bezeichnen.
  rationale: Der überlieferte Wortlaut schildert Handlung und Ergebnis, liefert aber in diesem Abschnitt keine ausdrückliche theologische Deutung.
- issue: Bedeutung von Jakobus’ Rettung
  choice: „wurde gerettet“
  alternative: „überlebte“ oder „wurde geheilt“
  rationale: „Gerettet“ bewahrt den weiteren Bedeutungsumfang der Vorlage und vermeidet eine unnötige Einschränkung auf bloßes Überleben oder Heilung.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzählungsdeutsch. Die Übersetzung ist vorläufig, da nur ein gemeinfreier englischer Übersetzungszeuge bereitgestellt wurde und die direkte Prüfung des griechischen Wortlauts noch aussteht. Der handschriftliche Hinweis wurde als Fußnote mit Marker im Haupttext aufgenommen.
