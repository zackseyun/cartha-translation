review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Textzeugen sehr eng. Die ungewöhnliche Begründung des Fluchs bleibt zu Recht unharmonisiert und ist angemessen erläutert. Die Abfolge von Fluchwort und sofortigem Tod sowie die offen formulierte Klage der Eltern werden ohne dogmatische Zusätze wiedergegeben. Eine kleine Präzisierung bei der Frage nach der Geburt und bei der Kennzeichnung Josefs als Vater Jesu erhöht die Textnähe und Klarheit.
  naturalness: Das Deutsch ist überwiegend klar, modernes Standarddeutsch und wahrt einen würdigen Erzählton. »Wo wurde dieses Kind geboren« bildet die ausdrücklich auf Geburt zielende Frage unmittelbarer ab als »Woher stammt dieses Kind«. »Josef, seinem Vater« vermeidet, dass der Bezug von »seinem« im Satz mit den Eltern des toten Kindes kurz missverstanden werden kann.
  terminology: Die Namen Jesus und Josef sind konsistent. »Verflucht seist du« und »segnen/verfluchen« sind registergerecht. »Anführer« ist als möglichst direkte, aber ungewöhnliche Entsprechung von »leader« vertretbar, solange die vorhandene Fußnote die Unsicherheit transparent macht.
  issues:
  - severity: low
    issue: Die Herkunftsfrage wird leicht verallgemeinert wiedergegeben.
    rationale: 'Der englische Zeuge fragt ausdrücklich: »From where was this child born?« Die Formulierung »Wo wurde dieses Kind geboren?« erhält den Bezug auf die Geburt, ohne eine weitergehende Herkunftsdeutung einzutragen.'
  - severity: low
    issue: Der Bezug von Josef als Vater kann syntaktisch klarer markiert werden.
    rationale: In »machten sie seinem Vater Josef Vorwürfe« kann das Possessivpronomen nach »die Eltern des toten Kindes« kurz stocken lassen. »Josef, seinem Vater« gibt die Apposition des Zeugen klar wieder.
  revised_text: '**(1)** Von dort ging Jesus mit seinem Vater Josef weiter. Da stieß ihn jemand, der herbeilief, an der Schulter. Jesus sagte zu ihm: »Verflucht seist du wegen deines Anführers!«[a]


    Und augenblicklich starb er.


    Als die Leute sahen, dass er augenblicklich gestorben war, riefen sie: »Wo wurde dieses Kind geboren, dass sein Wort zur Tat wird?«


    **(2)** Als die Eltern des toten Kindes sahen, was geschehen war, machten sie Josef, seinem Vater, Vorwürfe und sagten: »Woher auch immer du dieses Kind hast: Du kannst nicht mit uns in diesem Dorf leben. Wenn du hier sein willst, dann bring ihm bei, zu segnen und nicht zu verfluchen; denn unser Kind ist uns genommen worden.«'
  revised_footnotes:
  - marker: a
    text: Die Wendung »wegen deines Anführers« ist im zugrunde gelegten englischen Textzeugen ungewöhnlich und möglicherweise textlich oder übersetzerisch unsicher. Eine Prüfung anhand der griechischen Handschriften steht noch aus.
    reason: Die auffällige Formulierung wird transparent bewahrt, ohne eine nicht belegte Deutung in den Text einzutragen.
  revision_rationale: 'Die Revision beschränkt sich auf zwei sichere Klarstellungen: Die Frage der Menge wird ausdrücklich als Frage nach dem Geburtsort formuliert, und Josef wird eindeutig als Jesu Vater appositiv gekennzeichnet. »Woher auch immer du dieses Kind hast« und »wenn du hier sein willst« geben die ungewöhnliche beziehungsweise knappe Ausdrucksweise des englischen Zeugen idiomatisch wieder, ohne deren Sinn festzulegen. Die Fußnote zur problematischen Wendung »wegen deines Anführers« bleibt unverändert erforderlich.'
