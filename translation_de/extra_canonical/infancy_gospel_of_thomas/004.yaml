translation:
  language: de
  text: '**(1)** Von dort ging Jesus mit seinem Vater Josef weiter. Da stieß ihn jemand, der herbeilief, an der Schulter. Jesus sagte zu ihm: »Verflucht seist du wegen deines Anführers!«[a]


    Und augenblicklich starb er.


    Als die Leute sahen, dass er augenblicklich gestorben war, riefen sie: »Woher stammt dieses Kind, dass sein Wort zur Tat wird?«


    **(2)** Als die Eltern des toten Kindes sahen, was geschehen war, machten sie seinem Vater Josef Vorwürfe und sagten: »Woher du dieses Kind auch hast: Du kannst nicht mit uns in diesem Dorf leben. Wenn du hierbleiben willst, dann bring ihm bei zu segnen und nicht zu verfluchen; denn unser Kind ist uns genommen worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »wegen deines Anführers« ist im zugrunde gelegten englischen Textzeugen ungewöhnlich und möglicherweise textlich oder übersetzerisch unsicher. Eine Prüfung anhand der griechischen Handschriften steht noch aus.
    reason: Die auffällige Formulierung wird transparent bewahrt, ohne eine nicht belegte Deutung in den Text einzutragen.
lexical_decisions:
- source_word: someone running struck his shoulder
  choice: Da stieß ihn jemand, der herbeilief, an der Schulter.
  rationale: Die Handlung wird in natürlichem Gegenwartsdeutsch wiedergegeben, ohne aus dem nicht näher bezeichneten Laufenden ausdrücklich ein Kind zu machen oder die Stärke des Stoßes auszudeuten.
- source_word: his word becomes deed
  choice: sein Wort zur Tat wird
  rationale: Die prägnante Verbindung von Ausspruch und unmittelbarer Wirkung bleibt erhalten.
- source_word: From wherever you have this child
  choice: Woher du dieses Kind auch hast
  rationale: Die ungewöhnliche, vorwurfsvolle Formulierung des Zeugnisses wird bewahrt, ohne eine bestimmte Herkunft oder Elternschaft zu unterstellen.
- source_word: has been taken away from us
  choice: ist uns genommen worden
  rationale: Das Passiv wahrt die Offenheit darüber, wer oder was den Tod verursacht beziehungsweise das Kind genommen hat.
theological_decisions:
- issue: Ursache und Tragweite des Fluchworts Jesu
  choice: Die Abfolge von Fluchwort und sofortigem Tod wird ohne erklärenden Zusatz wiedergegeben.
  alternative: Den Tod ausdrücklich als von Jesus bewirkt oder als göttliches Gericht bezeichnen.
  rationale: Der Text stellt einen unmittelbaren Zusammenhang her, benennt aber keine ausgearbeitete Lehre über Ursache, Gericht oder Vollmacht.
- issue: Ungewöhnliche Begründung des Fluchs
  choice: »wegen deines Anführers« wird im Haupttext beibehalten und mit einer textkritischen Fußnote versehen.
  alternative: Die Wendung sinngemäß glätten oder durch eine vermutete Lesart ersetzen.
  rationale: Da die direkte Prüfung am griechischen Quellentext noch aussteht, darf die auffällige Aussage des vorliegenden Zeugnisses nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Der Entwurf ist vorläufig, da als Grundlage nur der bereitgestellte gemeinfreie englische Textzeuge vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht. »Augenblicklich« nimmt die auffällige Wiederholung des Zeugnisses auf; die direkte Rede bleibt scharf und ungemildert.
