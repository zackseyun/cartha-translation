  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/019.yaml
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: de
  text: '(1) Als Jesus zwölf Jahre alt war, gingen seine Eltern wie üblich zum Passafest nach Jerusalem. Doch auf dem Rückweg blieb Jesus in Jerusalem zurück, ohne dass seine Eltern es wussten.


    (2) Weil sie annahmen, er sei bei der Reisegesellschaft, gingen sie eine Tagesreise weit und suchten ihn unter ihren Verwandten und Bekannten. Als sie ihn nicht fanden, kehrten sie nach Jerusalem zurück und suchten dort nach ihm.


    Nach drei Tagen fanden sie ihn im Tempel. Er saß mitten unter den Lehrern, hörte ihnen zu und stellte ihnen Fragen. Alle, die ihn hörten, staunten darüber, wie er die Ältesten befragte und die Hauptpunkte des Gesetzes, die Rätsel und die Gleichnisse der Propheten erklärte.


    (3) Seine Mutter sagte zu ihm: »Kind, was hast du uns angetan? Sieh doch, voller Schmerz und Kummer haben wir dich gesucht.«


    Jesus sagte: »Warum habt ihr mich gesucht? Wusstet ihr nicht, dass ich an dem Ort meines Vaters sein muss?«[a]


    (4) Die Schriftgelehrten und die Pharisäer fragten Maria: »Bist du die Mutter dieses Kindes?«


    Sie sagte: »Ja.«


    Da sagten sie zu ihr: »Gesegnet bist du, denn Gott, der Herr, hat die Frucht deines Leibes gesegnet. Noch nie haben wir eine solche Weisheit des Lobpreises und Herrlichkeit der Tugend gesehen.«[b]


    (5) Jesus stand auf, ging von dort mit seiner Mutter fort und gehorchte seinen Eltern. Sie bewahrte all diese Dinge und bewegte sie in ihrem Herzen.


    Jesus nahm zu an Weisheit, Reife und Gnade vor Gott und den Menschen. Ihm sei die [Herrlichkeit …].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »dass ich im Haus meines Vaters sein muss« oder »dass ich bei dem sein muss, was meinem Vater gehört«. Die vorliegende Zeugnisgrundlage lautet wörtlich »an dem Ort meines Vaters«; die griechische Überlieferung ist noch direkt zu prüfen.'
    reason: Bewahrt eine theologisch bedeutsame mögliche Mehrdeutigkeit und kennzeichnet die vorläufige Quellenlage.
  - marker: b
    text: Der Wortlaut »Weisheit des Lobpreises und Herrlichkeit der Tugend« ist ungewöhnlich; die genaue Verknüpfung der Begriffe bleibt ohne unmittelbare Prüfung des griechischen Textes unsicher.
    reason: Verhindert, dass eine schwierige Formulierung stillschweigend geglättet oder theologisch umgedeutet wird.
  - marker: c
    text: Die eckigen Klammern und die Auslassungspunkte geben den unvollständigen beziehungsweise ergänzten Charakter der Schlussformel in der Vorlage wieder.
    reason: Erhält das textkritische Signal der bereitgestellten Quelle.
lexical_decisions:
- source_word: Passover
  choice: Passafest
  rationale: Bezeichnet das jüdische Fest in geläufigem, modernem Deutsch und bewahrt ausdrücklich den Festcharakter.
- source_word: traveling company
  choice: Reisegesellschaft
  rationale: Gibt die gemeinsam reisende Gruppe verständlich wieder, ohne eine militärische oder moderne touristische Bedeutung nahezulegen.
- source_word: teachers
  choice: Lehrer
  rationale: Bewahrt die allgemeine Bezeichnung des Zeugnisses; eine Präzisierung zu Gesetzeslehrern wäre möglich, steht aber nicht ausdrücklich in der vorliegenden Grundlage.
- source_word: elders
  choice: Ältesten
  rationale: Hält die Unterscheidung gegenüber den zuvor genannten Lehrern aufrecht.
- source_word: law
  choice: Gesetz
  rationale: Die traditionelle und sachlich angemessene Wiedergabe im jüdisch-schriftgelehrten Zusammenhang.
- source_word: maturity
  choice: Reife
  rationale: Bewahrt neben Weisheit und Gnade eine eigenständige Kategorie und vermeidet die Verengung auf bloßes körperliches Wachstum.
- source_word: grace
  choice: Gnade
  rationale: Erhält die religiöse Bedeutung und die erkennbare Nähe zur entsprechenden Tempelerzählung im Lukasevangelium.
theological_decisions:
- issue: Ort des Vaters
  choice: an dem Ort meines Vaters
  alternative: im Haus meines Vaters / bei dem, was meinem Vater gehört
  rationale: Die vorliegende englische Zeugnisgrundlage bietet ausdrücklich „in the place of my Father“. Die räumliche Formulierung wird beibehalten, ohne die bekannte Mehrdeutigkeit verwandter Überlieferungen dogmatisch aufzulösen.
- issue: Weisheit, Lobpreis, Herrlichkeit und Tugend
  choice: eine solche Weisheit des Lobpreises und Herrlichkeit der Tugend
  alternative: eine solche lobenswerte und ruhmreiche Weisheit und Tugend
  rationale: Die ungewöhnliche Genitivstruktur des Zeugnisses bleibt erkennbar, weil ihre genaue syntaktische und theologische Zuordnung ohne direkte Prüfung des Griechischen unsicher ist.
- issue: Schlussdoxologie
  choice: Ihm sei die [Herrlichkeit …].
  alternative: Dem sei die [Herrlichkeit …].
  rationale: Das männliche Bezugswort wird natürlich auf Jesus bezogen; Klammern und Auslassungspunkte bleiben als Signal eines unvollständigen oder ergänzten Textes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Erzählprosa. Die häufigen Satzanfänge mit »Und« wurden teilweise natürlich geglättet, ohne die Abfolge zu verändern. Wegen der noch ausstehenden direkten Prüfung der griechischen Handschriftentradition ist die Fassung ausdrücklich als quellennaher, vorläufiger Publikationsentwurf auf Grundlage des bereitgestellten gemeinfreien englischen Zeugnisses gestaltet.
