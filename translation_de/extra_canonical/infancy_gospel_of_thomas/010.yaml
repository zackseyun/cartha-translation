  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/010.yaml
  text: 'In Hagios Saba 259, this passage appears after Chapter 16.


    (1) Again, a certain young man was splitting wood into equal parts. And he split the bottom of his foot, bled out, and died.


    (2) A commotion arose, and Jesus ran there. Forcing his way through the crowd, he seized the stricken foot, and immediately it was healed. And he said to the young man, “Go, split your wood.”


    (3) And the crowds saw and were amazed and said, “For he saved many souls from death, and he will continue to save all the days of his life.”'
translation:
  language: de
  text: 'Im Codex Hagios Saba 259 steht dieser Abschnitt nach Kapitel 16.[a]


    (1) Wieder einmal war ein junger Mann dabei, Holz in gleich große Stücke zu spalten. Dabei spaltete er sich die Fußsohle, verblutete und starb.


    (2) Es entstand ein Aufruhr, und Jesus lief dorthin. Er drängte sich durch die Menge, ergriff den verletzten Fuß, und augenblicklich war er geheilt. Dann sagte er zu dem jungen Mann: »Geh und spalte dein Holz.«


    (3) Als die Menschenmengen das sahen, staunten sie und sagten: »Denn er hat viele Seelen vor dem Tod gerettet, und er wird weiterhin alle Tage seines Lebens retten.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Codex Hagios Saba 259 steht dieser Abschnitt nach Kapitel 16; seine Stellung in der Überlieferung weicht daher von der hier verwendeten Kapitelzählung ab.
    reason: Die handschriftliche Einordnung ist für die Textgeschichte wesentlich und steht ausdrücklich im vorliegenden Zeugen.
  - marker: b
    text: Die Formulierung »Seelen« gibt den Wortlaut des zugrunde gelegten englischen Textzeugen wieder. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus. Auch der Umfang des abschließenden »retten« bleibt daher vorsichtig offen.
    reason: Die Vorlage beruht vorläufig auf einem gemeinfreien englischen Übersetzungszeugen; die Fußnote kennzeichnet die lexikalische und syntaktische Unsicherheit transparent.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: Holz in gleich große Stücke zu spalten
  rationale: Gibt die konkrete Tätigkeit und den Gedanken gleichmäßiger Teile in natürlichem modernem Deutsch wieder.
- source_word: split the bottom of his foot
  choice: spaltete er sich die Fußsohle
  rationale: Bewahrt die drastische Wiederholung des Verbs »spalten« und bezeichnet die Unterseite des Fußes präzise.
- source_word: bled out
  choice: verblutete
  rationale: Ist die knappe und eindeutige deutsche Entsprechung für einen tödlichen Blutverlust.
- source_word: commotion
  choice: Aufruhr
  rationale: Vermittelt eine laute, aufgeregte Ansammlung, ohne die Ursache genauer festzulegen.
- source_word: forcing his way through the crowd
  choice: Er drängte sich durch die Menge
  rationale: Natürliches Deutsch für ein energisches Vordringen durch dicht stehende Menschen.
- source_word: stricken foot
  choice: verletzten Fuß
  rationale: Bezeichnet den betroffenen, schwer verwundeten Fuß verständlich, ohne zusätzliche medizinische Einzelheiten einzutragen.
- source_word: souls
  choice: Seelen
  rationale: Bewahrt den überlieferten theologischen und anthropologischen Ausdruck, statt ihn stillschweigend mit »Menschen« wiederzugeben.
theological_decisions:
- issue: Bedeutung von »Seelen« in der Aussage über die Rettung vor dem Tod
  choice: »viele Seelen vor dem Tod gerettet«
  alternative: »viele Menschen vor dem Tod gerettet«
  rationale: Die wörtlichere Form bewahrt die mögliche Spannung zwischen dem Leben ganzer Personen und einer stärker theologischen Bedeutung von »Seele«, ohne sie aufzulösen.
- issue: Zeitliche Reichweite der abschließenden Aussage
  choice: »er wird weiterhin alle Tage seines Lebens retten«
  alternative: »er wird sein ganzes Leben lang alle retten«
  rationale: Die gewählte Fassung lässt offen, ob »alle« ein ausdrückliches Objekt ist oder ob die Aussage allgemein das fortgesetzte Retten beschreibt; sie vermeidet eine unnötige universalistische Präzisierung.
translation_notes:
  register: Modernes, würdiges und gut verständliches Standarddeutsch. Die knappe Erzählweise und die Wiederholung von »spalten« wurden bewahrt. Wegen der noch ausstehenden direkten Prüfung des griechischen Ausgangstextes vermeidet der Entwurf übermäßige Präzisierung und kennzeichnet textkritisch relevante Unsicherheiten.
