    reason: Bewahrt die mögliche Bedeutungsbreite von Niederwerfung, Huldigung und religiöser Verehrung.
lexical_decisions:
- source_word: roof of an upstairs room
  choice: Dach eines Obergeschosses
  rationale: Gibt die räumliche Angabe des englischen Zeugen verständlich und ohne unnötige architektonische Festlegung wieder.
- source_word: body
  choice: Leichnam
  rationale: Der Zusammenhang bezeichnet ausdrücklich den Körper des gestorbenen Kindes; »Leichnam« ist präzise und würdevoll.
- source_word: Rise
  choice: steh auf
  rationale: Natürlicher deutscher Imperativ, der sowohl das körperliche Aufstehen als auch im Kontext die Totenerweckung ausdrückt.
- source_word: Fall asleep
  choice: Schlaf ein
  rationale: Bewahrt den Euphemismus und löst nicht ausdrücklich auf, ob damit erneutes Sterben bezeichnet wird.
- source_word: worshipped
  choice: warfen sich ... nieder
  rationale: Bewahrt die sichtbare Handlung und vermeidet eine vorschnelle Festlegung auf ausschließlich kultische Anbetung; die mögliche Bedeutung »verehren« wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung des erneuten Einschlafens
  choice: »Schlaf ein!« ohne erklärende Ergänzung
  alternative: »Stirb wieder!«
  rationale: Der überlieferte Wortlaut verwendet nach dem englischen Zeugen ein Schlafbild. Die Übersetzung bewahrt dessen theologische und erzählerische Spannung.
- issue: Ehrerbietung gegenüber dem Jesuskind
  choice: »warfen sich vor dem Jesuskind nieder« mit Fußnote
  alternative: »beteten das Jesuskind an« oder »verehrten das Jesuskind«
  rationale: Die konkrete Gebärde wird wiedergegeben, ohne die kultische Tragweite vor einer Prüfung des griechischen Wortlauts abschließend festzulegen.
- issue: Anrede Zenos an Jesus
  choice: »Nein, Herr« mit Fußnote
  alternative: »Nein, mein Herr« oder »Nein, Gebieter«
  rationale: »Herr« bewahrt die mögliche respektvolle wie auch theologisch weitergehende Bedeutung, ohne sie eindeutig festzulegen.
