  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
translation:
  language: de
  text: '**Kindheitsevangelium nach Thomas 9 – Jesus erweckt Zeno**


    (1) Wieder einmal, viele Tage später, spielte Jesus mit anderen Kindern auf dem Dach eines Obergeschosses. Da stürzte eines der Kinder hinunter und starb. Als die anderen Kinder das sahen, gingen sie in ihre Häuser und ließen Jesus allein zurück.


    (2) Die Eltern des verstorbenen Kindes kamen und beschuldigten Jesus: »Du hast unser Kind hinuntergestoßen!«


    Jesus aber sagte: »Ich habe es nicht hinuntergestoßen.«


    (3) Da gerieten sie in Wut und schrien laut. Jesus stieg vom Dach hinunter, stellte sich neben den Leichnam und rief mit lauter Stimme: »Zeno, Zeno« – so hieß das Kind –, »steh auf und sag, ob ich dich hinuntergestoßen habe!«


    Da stand es auf und sagte: »Nein, Herr[a].«


    Als sie das sahen, staunten sie.


    Dann sagte Jesus wieder zu ihm: »Schlaf ein!«


    Und die Eltern des Kindes priesen Gott und warfen sich vor dem Jesuskind nieder.[b]


    [a] Oder: »Nein, mein Herr.« Die Anrede kann je nach zugrunde liegendem griechischem Wort und Kontext auch mit »Herr« oder »Gebieter« wiedergegeben werden; eine abschließende Prüfung am griechischen Text steht noch aus.


    [b] Oder: »und verehrten das Jesuskind«. Die Formulierung lässt offen, ob eine ehrerbietige Niederwerfung oder ausdrücklich religiöse Verehrung gemeint ist; eine abschließende Prüfung am griechischen Text steht noch aus.'
  philosophy: optimal-equivalence
  footnotes:
