translation:
  language: de
  text: '**17. Jesus heilt ein kleines Kind**


    (1) Nach diesen Ereignissen wurde in Josefs Nachbarschaft ein kleines Kind krank und starb. Seine Mutter weinte sehr.


    Als Jesus aber hörte, dass dort große Trauer und Aufregung herrschten, lief er schnell hin. Er fand das Kind tot vor, berührte seine Brust und sagte: »Ich sage dir, kleines Kind: Stirb nicht, sondern lebe und bleib bei deiner Mutter!«


    Sofort blickte das Kind auf und lachte. Jesus sagte zu der Mutter: »Nimm dein Kind, gib ihm Milch und erinnere dich an mich.«


    (2) Die Menschen, die dabeistanden, staunten und sagten: »Wahrhaftig, dieses Kind ist ein Gott oder ein Engel, denn jedes seiner Worte wird zur Tat!«[a]


    Dann ging Jesus wieder fort und spielte mit den Kindern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wiedergabe folgt hier dem vorliegenden englischen Textzeugen. Eine unmittelbare Prüfung der griechischen Handschriften steht noch aus; insbesondere die Formulierung »ein Gott oder ein Engel« sollte dabei überprüft werden.
    reason: Die Quellenangabe erklärt ausdrücklich, dass die direkte Sichtung des griechischen Textes noch aussteht, und die theologisch auffällige Wendung hängt deshalb vorläufig am englischen Zeugen.
lexical_decisions:
- source_word: baby / child (Greek review pending)
  choice: kleines Kind / Kind
  rationale: „Kleines Kind“ ist in modernem Deutsch natürlich und lässt das genaue Alter offen; im weiteren Verlauf vermeidet „Kind“ unnötige Wiederholungen.
- source_word: great grief and commotion
  choice: große Trauer und Aufregung
  rationale: Die Übersetzung bewahrt sowohl die emotionale Trauer als auch die hörbare oder sichtbare Unruhe der Szene.
- source_word: touched his chest
  choice: berührte seine Brust
  rationale: Die konkrete körperliche Geste wird ohne interpretierende Erweiterung wiedergegeben.
- source_word: remember me
  choice: erinnere dich an mich
  rationale: Die offene Bedeutung der Aufforderung bleibt erhalten; sie wird weder als Dank noch als kultisches Gedenken präzisiert.
- source_word: every word becomes a deed
  choice: jedes seiner Worte wird zur Tat
  rationale: Die pointierte Verbindung zwischen Jesu Wort und dessen unmittelbarer Wirksamkeit bleibt erhalten.
- source_word: a god or an angel
  choice: ein Gott oder ein Engel
  rationale: Die auffällige, unbestimmte Aussage der Menge wird formal bewahrt und nicht zu einer eindeutigen christologischen Aussage umgedeutet.
theological_decisions:
- issue: Aussage der Menge über Jesu Identität
  choice: „dieses Kind ist ein Gott oder ein Engel“
  alternative: „dieses Kind ist Gott oder ein Engel“
  rationale: Der gelieferte Zeuge hat den unbestimmten Ausdruck „a god“. Die Übersetzung bewahrt diese irritierende Alternative, statt sie konfessionell zu glätten.
- issue: Wirksamkeit von Jesu Worten
  choice: „jedes seiner Worte wird zur Tat“
  alternative: „jedes Wort von ihm erfüllt sich“
  rationale: „Wird zur Tat“ hält die Bildlichkeit und die unmittelbare Wirksamkeit fest, ohne eine spezielle Lehre über Verheißung oder Erfüllung einzutragen.
- issue: Aufforderung zum Erinnern
  choice: „erinnere dich an mich“
  alternative: „gedenke meiner“
  rationale: Die moderne Formulierung ist allgemein verständlich und wahrt die semantische Offenheit, ohne einen liturgischen Sinn festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählweise und natürlicher direkter Rede. Die Übersetzung ist ein vorläufiger, quellenbewusster Entwurf auf Grundlage des bereitgestellten gemeinfreien englischen Textzeugen; eine direkte Überprüfung der griechischen Überlieferung steht noch aus.
