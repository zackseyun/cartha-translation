base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: de
  text: '(1) Jesus war damals etwa acht Jahre alt. Sein Vater war Zimmermann und stellte Pflüge und Joche her. Er hatte von einem reichen Mann ein Bett übernommen, um es sehr groß und passend anzufertigen. Doch einer der Balken, der sogenannte […][a], war kürzer und hatte nicht die richtige Länge. Josef war bekümmert und wusste nicht, was er tun sollte.


    Das Kind kam zu seinem Vater und sagte: „Leg die beiden Bretter hin und richte sie an deinem Ende bündig aus.“


    (2) Josef tat genau, was Jesus ihm gesagt hatte. Das Kind Jesus stellte sich ans andere Ende, ergriff das kurze Brett und zog es in die Länge. So machte er es genauso lang wie das andere Brett.


    Dann sagte er zu seinem Vater: „Sei nicht bekümmert, sondern fertige an, was du willst.“


    Josef umarmte und küsste ihn und sagte: „Gesegnet bin ich, dass Gott mir dieses Kind gegeben hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung dieses Balkens ist in der zugrunde liegenden Überlieferung nicht sicher erhalten beziehungsweise noch nicht geklärt.
    reason: Der gelieferte Zeuge kennzeichnet hier ausdrücklich einen ungelösten oder beschädigten Begriff; die Lücke darf nicht stillschweigend ergänzt werden.
lexical_decisions:
- source_word: carpenter
  choice: Zimmermann
  rationale: Die geläufige, würdige deutsche Berufsbezeichnung passt zum ausdrücklich genannten Herstellen hölzerner Pflüge und Joche.
- source_word: bed
  choice: Bett
  rationale: Bewahrt die allgemeine Bezeichnung des überlieferten englischen Zeugen, ohne eine genauere antike Möbelkonstruktion vorauszusetzen.
- source_word: beams / boards
  choice: Balken / Bretter
  rationale: 'Die wechselnden Bezeichnungen des Zeugen bleiben erkennbar: Zunächst wird das Konstruktionsteil als Balken eingeführt, in der Handlungsanweisung als Brett bezeichnet.'
- source_word: line them up on your end
  choice: richte sie an deinem Ende bündig aus
  rationale: „Bündig ausrichten“ gibt die praktische Tätigkeit natürlich und präzise wieder.
- source_word: stretched it
  choice: zog es in die Länge
  rationale: Drückt das Wunder klar aus, ohne einen technischen Vorgang hinzuzudichten.
- source_word: Blessed am I
  choice: Gesegnet bin ich
  rationale: Bewahrt die feierliche, theologisch offene Seligpreisungsform des Zeugen.
theological_decisions:
- issue: Art des Wunders
  choice: Das Brett wird tatsächlich in die Länge gezogen.
  alternative: Das Brett wird lediglich verschoben oder passend ausgerichtet.
  rationale: Der Zeuge beschreibt ausdrücklich, dass Jesus das kurze Brett ergreift, streckt und dem anderen gleich macht; diese übernatürliche Aussage wird nicht abgeschwächt.
- issue: Gottes Gabe des Kindes
  choice: „dass Gott mir dieses Kind gegeben hat“
  alternative: „weil Gott mir dieses Kind gegeben hat“
  rationale: Die eng am Zeugen bleibende Formulierung wahrt Josefs Aussage, ohne eine weitergehende Lehre über Jesu Herkunft oder Josefs Vaterschaft einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in schlichter, würdiger Erzählweise. Wegen der noch ausstehenden Prüfung des griechischen Ausgangstextes ist die Fassung ausdrücklich vorläufig und folgt primär dem bereitgestellten gemeinfreien englischen Übersetzungszeugen. Die unklare technische Bezeichnung wird sichtbar offengehalten.
