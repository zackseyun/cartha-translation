  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: de
  text: '(1) Einige Tage später sagte wieder ein anderer Lehrer zu Josef, dem Vater Jesu: „Komm, Bruder, gib ihn mir mit in die Schule, damit ich ihn mit freundlichem Zureden die Buchstaben lehren kann.“


    Josef sagte zu ihm: „Wenn du den Mut hast, Bruder, dann nimm ihn wohlbehalten mit.“[a]


    Der Lehrer nahm das Kind bei der Hand und führte es voller Furcht und Sorge fort. Das Kind aber ging gern mit.


    (2) Als Jesus in die Schule kam, fand er ein Buch, das auf dem Lesepult lag. Er nahm es, las aber nicht vor, was darin geschrieben stand, denn es stammte nicht aus Gottes Gesetz.[b] Stattdessen öffnete er den Mund und sprach so eindrucksvolle Worte, dass der Lehrer, der ihm gegenübersaß, mit großer Freude zuhörte und ihn ermunterte weiterzusprechen. Die Menschen, die dort standen, staunten über seine heiligen Worte.


    (3) Josef lief schnell zur Schule, denn er vermutete, dass auch dieser Lehrer inzwischen seine Erfahrung gemacht und Schaden erlitten hatte.[c] Doch der Lehrer sagte zu Josef: „Du sollst wissen, Bruder: Ich habe dein Kind zwar als Schüler aufgenommen, aber es ist von großer Gnade und Weisheit erfüllt. Darum, Bruder, führe es wohlbehalten in dein Haus zurück.“[d]


    (4) Jesus sagte zu dem Lehrer: „Weil du richtig gesprochen und richtig Zeugnis abgelegt hast, wird deinetwegen auch der Niedergeschlagene gerettet werden.“[e] Sofort wurde auch jener Lehrer gerettet.[f] Josef nahm das Kind und führte es in sein Haus zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher beziehungsweise formelhafter lautet die Wendung „mit Rettung“ oder „mit Heil“. Gemeint sein kann: „Nimm ihn sicher und unversehrt mit.“'
    reason: Die Ausgangsformulierung ist ungewöhnlich und möglicherweise semitisch geprägt; die Fußnote bewahrt ihre formale Eigenart.
  - marker: b
    text: 'Die Formulierung kann auch bedeuten: „weil es nicht zum Gesetz Gottes gehörte“. Welches Buch gemeint ist, bleibt offen.'
    reason: Die Beziehung des Buches zu Gottes Gesetz ist semantisch mehrdeutig.
  - marker: c
    text: 'Die zugrunde liegende Formulierung ist schwer verständlich: etwa „dass dieser Lehrer nicht mehr unerfahren war und gelitten hatte“. Vermutlich denkt Josef an die schlimmen Erfahrungen früherer Lehrer; der genaue Sinn bleibt unsicher.'
    reason: Die direkte griechische Quellenprüfung steht aus, und schon der englische Zeuge markiert eine syntaktisch auffällige Aussage.
  - marker: d
    text: 'Hier steht dieselbe ungewöhnliche Wendung wie in Vers 1: wörtlich „mit Rettung“ oder „mit Heil“.'
    reason: Hebt die bewusste Wiederholung der formelhaften Wendung hervor.
  - marker: e
    text: Wer mit „der Niedergeschlagene“ gemeint ist, wird nicht ausdrücklich gesagt. Auch „der zu Fall Gebrachte“ oder „der Geschlagene“ ist möglich.
    reason: Bewahrt die personale und semantische Unbestimmtheit der Wendung.
  - marker: f
    text: „Gerettet“ kann hier auch Wiederherstellung oder Befreiung von einem zuvor erlittenen Zustand bezeichnen.
    reason: Verhindert eine vorschnelle Beschränkung auf ausschließlich geistliches Heil oder körperliche Heilung.
lexical_decisions:
- source_word: with flattery
  choice: mit freundlichem Zureden
  rationale: Gibt das ungewöhnliche Mittel des Lehrens natürlich wieder, ohne den möglichen negativen Beiklang von Schmeichelei völlig festzuschreiben.
- source_word: letters
  choice: die Buchstaben
  rationale: Bewahrt den konkreten Bezug auf elementaren Lese- und Schreibunterricht.
- source_word: with salvation
  choice: wohlbehalten
  rationale: Eine idiomatische deutsche Wiedergabe für die offenbar formelhafte Wendung; die Wiederholung in V. 1 und V. 3 bleibt erhalten.
- source_word: lectern
  choice: Lesepult
  rationale: Bezeichnet verständlich die Ablage, auf der das Buch liegt, ohne einen spezifisch kirchlichen Kontext vorauszusetzen.
- source_word: from God’s law
  choice: aus Gottes Gesetz
  rationale: Bewahrt die mögliche Mehrdeutigkeit zwischen Herkunft, Inhalt und Autorität des Buches.
- source_word: the one struck down
  choice: der Niedergeschlagene
  rationale: Erhält die ungewöhnliche substantivierte und passive Bezeichnung, ohne die Identität oder Art seines Zustands zu erklären.
- source_word: was saved
  choice: wurde gerettet
  rationale: Bewahrt die soteriologische wie auch körperlich-restaurative Offenheit des Ausdrucks.
theological_decisions:
- issue: Bedeutung von „Gottes Gesetz“
  choice: Keine Gleichsetzung mit einem bestimmten kanonischen Text
  alternative: „die Tora“ oder „ein Buch der Heiligen Schrift“
  rationale: Der vorliegende Zeuge erlaubt weder eine sichere Identifikation des Buches noch eine eindeutige Aussage darüber, worin seine Nichtzugehörigkeit besteht.
- issue: Identität des „Niedergeschlagenen“
  choice: Unbestimmt lassen
  alternative: Als früher bestraften Lehrer oder als eine andere zuvor geschädigte Person identifizieren
  rationale: Der Text nennt den Betroffenen nicht ausdrücklich; eine Identifikation würde die erzählerische Spannung auflösen.
- issue: Art der Rettung des Lehrers
  choice: „gerettet“ ohne nähere Bestimmung
  alternative: „geheilt“, „wiederhergestellt“ oder „vom Gericht befreit“
  rationale: Die Formulierung kann körperliche, existentielle oder heilsgeschichtliche Bedeutung tragen und soll nicht eingeengt werden.
- issue: Jesu Worte in der Schule
  choice: Als „heilige Worte“ wiedergeben, ohne ihren Inhalt zu ergänzen
  alternative: Sie als Auslegung des Gesetzes oder Offenbarungsrede bestimmen
  rationale: Der Text lobt Wirkung und Qualität der Worte, überliefert aber ihren Inhalt nicht.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klaren Satzstrukturen. Auffällige Wiederholungen und theologisch bedeutsame Mehrdeutigkeiten bleiben erhalten. Da eine direkte Prüfung des griechischen Textes noch aussteht und nur ein englischer öffentlicher Übersetzungszeuge vorliegt, werden besonders unsichere Stellen transparent in Fußnoten ausgewiesen.
