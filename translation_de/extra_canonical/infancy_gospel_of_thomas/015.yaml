    Der Lehrer nahm das Kind bei der Hand und führte es voller Furcht und Sorge fort. Das Kind aber ging gern mit.


    (2) Als Jesus die Schule betrat, fand er ein Buch, das auf dem Lesepult lag. Er nahm es zur Hand, las aber nicht, was darin geschrieben stand, denn es war nicht aus Gottes Gesetz.[b] Stattdessen öffnete er den Mund und sprach so eindrucksvolle Worte, dass der Lehrer, der ihm gegenübersaß, ihm mit großer Freude zuhörte und ihn ermunterte, mehr zu sagen. Die dort stehende Menge staunte über seine heiligen Worte.


    (3) Josef lief schnell zur Schule, weil er vermutete, dass dieser Lehrer nicht mehr unerfahren war und litt.[c] Doch der Lehrer sagte zu Josef: „Damit du es weißt, Bruder: Ich habe dein Kind zwar als Schüler aufgenommen, aber es ist voll großer Gnade und Weisheit. Darum, Bruder, führe es mit Heil in dein Haus.“[d]


    (4) Jesus sagte zu dem Lehrer: „Weil du richtig gesprochen und richtig Zeugnis abgelegt hast, wird auch der Niedergeschlagene deinetwegen gerettet werden.“[e] Sofort wurde auch jener Lehrer gerettet.[f] Josef nahm das Kind und führte es in sein Haus.'
