translation:
  language: de
  text: '(1) Josef sagte zu Jesus: »Warum sagst du solche Dinge, sodass sie leiden und uns hassen?«


    Das Kind sagte zu Josef: »Da du weise Worte kennst, weißt du auch, woher sie kamen; sie wurden über einen Fünfjährigen gesprochen.[a] Und sie werden nicht wieder aufgerichtet werden, und diese hier werden ihre Strafe erhalten.«[b]


    Sofort wurden diejenigen, die ihn beschuldigten, blind.


    (2) Josef packte Jesus am Ohr und zog kräftig daran.


    (3) Jesus sagte zu ihm: »Es genügt dir, mich zu suchen und zu finden; darüber hinaus sollst du mich nicht züchtigen, indem du einer angeborenen Unwissenheit folgst.[c] Du hast nicht klar erkannt, warum ich zu dir gehöre.[d] Sieh! Ich habe mich dir unterworfen.«[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz ist im überlieferten Wortlaut schwierig. Auch die genaue Beziehung zwischen den »weisen Worten«, ihrer Herkunft und dem Fünfjährigen bleibt unsicher.
    reason: Kennzeichnet eine erhebliche textliche und syntaktische Unsicherheit des zugrunde gelegten englischen Zeugen.
  - marker: b
    text: Wer mit »sie« und wer mit »diese hier« gemeint ist, ist nicht eindeutig; ebenso kann »wieder aufgerichtet« körperliches Aufstehen, Wiederherstellung oder Auferweckung bezeichnen.
    reason: Bewahrt Pronomen- und Bedeutungsambiguität.
  - marker: c
    text: 'Wörtlich nach dem verfügbaren Zeugen etwa: »indem du eine natürliche Unwissenheit angenommen hast«. Der Sinn ist unsicher.'
    reason: Die direkte Prüfung des griechischen Ausgangstextes steht noch aus.
  - marker: d
    text: 'Auch möglich: »Du hast mich nicht klar erkannt, dass/warum ich dein bin.« Die Syntax und der genaue Sinn sind unsicher.'
    reason: Verhindert eine vorschnelle Festlegung der Aussage über Jesus und Josef.
  - marker: e
    text: 'Auch möglich: »Sieh, ich bin vor dir bezwungen worden« oder »dir gegenüber gebändigt worden«.'
    reason: Zeigt die Spannweite der schwierigen Schlussformulierung.
lexical_decisions:
- source_word: five-year-old (Greek wording pending review)
  choice: Fünfjährigen
  rationale: Bewahrt die ausdrücklich genannte Altersangabe und die substantivische, auf das Kind bezogene Form des verfügbaren Zeugen.
- source_word: raised
  choice: wieder aufgerichtet werden
  rationale: Lässt offen, ob körperliches Aufstehen, Wiederherstellung oder eine stärkere Bedeutung wie Auferweckung gemeint ist.
- source_word: scourge
  choice: züchtigen
  rationale: Passt zur körperlichen Maßregelung im Kontext, ohne eine bestimmte Form der Bestrafung stärker festzulegen als der Zeuge.
- source_word: natural ignorance
  choice: angeborenen Unwissenheit
  rationale: Gibt die ungewöhnliche Formulierung möglichst direkt wieder und glättet ihre Schwierigkeit nicht vorschnell.
- source_word: subdued
  choice: mich dir unterworfen
  rationale: Drückt freiwillige oder tatsächliche Unterordnung aus, ohne die rätselhafte Aussage psychologisch auszudeuten.
theological_decisions:
- issue: Möglicher Bezug von »wieder aufgerichtet« auf Auferstehung oder Wiederherstellung
  choice: Die mehrdeutige Formulierung »wieder aufgerichtet werden« bleibt erhalten.
  alternative: »Sie werden nicht auferweckt werden« oder »Sie werden nicht wieder gesund werden«
  rationale: Mangels abgeschlossener Prüfung des griechischen Wortlauts darf die theologische oder körperliche Bedeutung nicht festgelegt werden.
- issue: Jesu Verhältnis zu Josef in »warum ich zu dir gehöre«
  choice: Die Zugehörigkeitsaussage wird ohne Erklärung wiedergegeben.
  alternative: »Wer ich für dich bin« oder »dass ich dein Sohn bin«
  rationale: Eine ausdrückliche Sohnschafts- oder Identitätsdeutung würde die schwierige Syntax des Zeugen unzulässig vereindeutigen.
- issue: Jesu Unterordnung unter Josef
  choice: »Ich habe mich dir unterworfen«
  alternative: »Ich bin vor dir bezwungen worden«
  rationale: Die personale Unterordnung bleibt sichtbar, ohne daraus eine weitergehende christologische Aussage abzuleiten.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit natürlicher direkter Rede. Wegen der noch ausstehenden griechischen Quellenprüfung wurden ungewöhnliche Aussagen und unklare Pronomen nicht stillschweigend harmonisiert; die deutsche Fassung ist daher ausdrücklich vorläufig.
