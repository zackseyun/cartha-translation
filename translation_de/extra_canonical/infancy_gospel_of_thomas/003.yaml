review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng: Annas’ Sohn handelt mit einem Weidenzweig gegen die Wasserbecken; Jesu Pflanzenspruch und das unmittelbare Verdorren des Kindes bleiben erhalten. Die Wiedergabe „seine Ansammlungen“ legt jedoch den im Zeugen ausdrücklich unklaren Bezug von „their gatherings“ auf Jesus fest. Diese Auflösung ist angesichts der ausstehenden Prüfung am griechischen Überlieferungstext nicht sicher.'
  naturalness: Das Deutsch ist klar, idiomatisch und im angemessen knappen, würdevollen Erzählregister gehalten. „Sogleich“ ist hier gut verständlich und stilistisch passend. „Heftiger Wind“ gibt „violent wind“ natürlicher wieder als das etwas markierte Kompositum „Sturmwind“.
  terminology: „Hohepriester“, „Sabbat“, „Weidenzweig“, „Becken“, „Frucht“, „Wurzel“, „Trieb“ und „verdorren“ sind treffend. Die bildhafte Wiederaufnahme von „verdorren“ in Vers 3 bleibt erhalten. Die Fußnote muss mit dem Text übereinstimmen und die Ambiguität tatsächlich bewahren.
  issues:
  - severity: medium
    issue: Der unklare Possessivbezug in „their gatherings“ wird im Haupttext als „seine Ansammlungen“ festgelegt.
    rationale: „Seine“ verweist im Deutschen regulär auf Jesus und ist damit keine offene Wiedergabe der englischen Vorlage. Da der Zeuge die Wendung als mehrdeutig ausweist und keine griechische Kontrolle vorliegt, sollte der Bezug nicht entschieden werden.
  - severity: low
    issue: „Sturmwind“ ist enger und bildhafter als „violent wind“.
    rationale: Ein Sturmwind ist möglich, aber „heftiger Wind“ entspricht der vorliegenden englischen Formulierung unmittelbarer und vermeidet eine unnötige Spezifizierung.
  revised_text: '(1) Der Sohn des Hohenpriesters Annas sagte zu Jesus: »Warum tust du so etwas am Sabbat?« Dann nahm er einen Weidenzweig, zerstörte die Becken, ließ das Wasser abfließen, das Jesus gesammelt hatte, und trocknete ihre Ansammlungen[a] aus.


    (2) Als Jesus sah, was geschehen war, sagte er zu ihm: »Deine Frucht wird keine Wurzel haben, und dein Trieb wird verdorren wie ein versengter Zweig in heftigem Wind!«


    (3) Und sogleich verdorrte dieses Kind.'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugen: »ihre Ansammlungen«. Der Bezug von »ihre« ist unklar; gemeint sein können die zuvor genannten Wasseransammlungen. Der genaue Wortlaut und Bezug müssen noch am griechischen Überlieferungstext geprüft werden.'
    reason: Die Vorlage kennzeichnet die Wendung als mehrdeutig. Die Fußnote bewahrt diese Unsicherheit, ohne den Possessivbezug im Haupttext auf Jesus festzulegen.
  revision_rationale: Die Revision beschränkt sich auf die sichere Bewahrung einer ausdrücklich markierten Mehrdeutigkeit und eine geringfügig nähere, natürliche Wiedergabe von „violent wind“. Inhalt, harte Gerichtswirkung und die knappe Erzählweise werden nicht abgeschwächt oder theologisch umgedeutet.
