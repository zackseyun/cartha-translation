base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: de
  text: '(1) Der Sohn des Hohenpriesters Annas sagte zu Jesus: »Warum tust du so etwas am Sabbat?« Dann nahm er einen Weidenzweig, zerstörte die Becken, ließ das Wasser abfließen, das Jesus gesammelt hatte, und trocknete seine Ansammlungen[a] aus.


    (2) Als Jesus sah, was geschehen war, sagte er zu ihm: »Deine Frucht wird keine Wurzel haben, und dein Trieb wird verdorren wie ein versengter Zweig im Sturmwind!«


    (3) Und sogleich verdorrte dieses Kind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugen: »ihre Ansammlungen«. Gemeint sind wohl die Ansammlungen des Wassers; der genaue Wortlaut muss noch am griechischen Überlieferungstext geprüft werden.'
    reason: Die Vorlage kennzeichnet die Wendung als mehrdeutig, und eine direkte Prüfung der griechischen Quelle steht noch aus.
lexical_decisions:
- source_word: pools
  choice: Becken
  rationale: Bezeichnet hier natürlich und anschaulich die angelegten Wasserbecken, ohne ihre genaue Form festzulegen.
- source_word: willow twig
  choice: Weidenzweig
  rationale: Direkte, geläufige Entsprechung der im Zeugen gebotenen Pflanzenbezeichnung.
- source_word: fruit / root / shoot
  choice: Frucht / Wurzel / Trieb
  rationale: Bewahrt das zusammenhängende Pflanzenbild und seine drohende Aussage.
- source_word: withered / withered away
  choice: verdorren / verdorrte
  rationale: Erhält die auffällige Verbindung zwischen Jesu Bildwort und dem unmittelbaren Schicksal des Kindes.
- source_word: their gatherings
  choice: seine Ansammlungen
  rationale: Die unklare Wendung wird mit Bezug auf das zuvor genannte gesammelte Wasser wiedergegeben; ihre genaue Bedeutung bleibt in einer Fußnote offen.
theological_decisions:
- issue: Jesu Ausspruch als Fluch beziehungsweise Gerichtswort
  choice: Die harte Drohrede und das unmittelbare Verdorren des Kindes werden ohne Abschwächung wiedergegeben.
  alternative: Den Vorgang euphemistisch als Krankheit, Ohnmacht oder bloße Weissagung formulieren.
  rationale: Der überlieferte Wortlaut stellt bewusst einen engen Zusammenhang zwischen Jesu Aussage und dem sofortigen Geschehen her; die Spannung darf nicht harmonisiert werden.
- issue: Zeitbezug der Aussage über Frucht und Trieb
  choice: 'Futur: »wird keine Wurzel haben« und »wird verdorren«.'
  alternative: 'Präsens oder Wunsch-/Fluchformel: »soll keine Wurzel haben« beziehungsweise »möge verdorren«.'
  rationale: Folgt dem vorgelegten englischen Zeugen, während eine direkte Prüfung des griechischen Wortlauts noch aussteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. »Sogleich« bewahrt den knappen, altertümlich-biblischen Erzählton, ohne unverständlich zu wirken. Der Entwurf ist ausdrücklich vorläufig, da nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die Prüfung am griechischen Text noch aussteht.
