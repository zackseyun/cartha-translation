lexical_decisions:
- source_word: good familiarity
  choice: mit welch sicherer Kenntnis
  rationale: Die schwerfällige Formulierung des englischen Textzeugen bezeichnet offenbar Jesu bemerkenswerte Vertrautheit mit dem Gegenstand. Die Wiedergabe bleibt zurückhaltend, da die Prüfung des griechischen Wortlauts noch aussteht.
- source_word: lines of the first letter / lines of the first element
  choice: Linien des ersten Buchstabens / Linien des ersten Elements
  rationale: Die wechselnde Terminologie des Zeugen wird bewahrt und durch Fußnote erläutert, statt beide Ausdrücke ohne griechische Textprüfung anzugleichen.
- source_word: his defense
  choice: seiner Verteidigung
  rationale: Bewahrt die mögliche Bedeutung einer Rechtfertigung oder argumentativen Erwiderung, ohne sie einengend als bloße Erklärung wiederzugeben.
- source_word: clarity of his word
  choice: Klarheit seiner Worte
  rationale: Natürliches modernes Deutsch; der Singular des englischen Zeugen kann kollektiv den sprachlichen Ausdruck bezeichnen.
- source_word: tame fire
  choice: das Feuer bändigen
  rationale: Erhält das kraftvolle Bild und vermeidet eine rationalisierende Umschreibung.
- source_word: with salvation
  choice: wohlbehalten
  rationale: Im Zusammenhang ist eine sichere Heimführung wahrscheinlich; die ungewöhnlich wörtliche Bedeutung wird in einer Fußnote offengelegt.
- source_word: a great thing
  choice: etwas Großes
  rationale: Bewahrt die auffällige und unbestimmte Aussage des Lehrers, ohne sie christologisch zu präzisieren.
theological_decisions:
- issue: Mögliche Präexistenz Jesu
  choice: »Vielleicht hat dieses Kind schon vor der Erschaffung der Welt existiert.«
  alternative: Eine eindeutige Aussage, dass Jesus vor der Schöpfung existierte
  rationale: Der Lehrer äußert eine Vermutung. Das Modalwort »vielleicht« muss erhalten bleiben.
- issue: Einordnung des Kindes als Gott oder Engel
  choice: »ob ein Gott oder ein Engel oder was ich sonst sagen könnte«
  alternative: »ob Gott oder ein Engel« beziehungsweise eine eindeutige Identifikation Jesu als Gott
  rationale: Die unbestimmte Form und die Ratlosigkeit des Sprechers werden bewahrt. Der Text formuliert hier keine abschließende dogmatische Bestimmung.
- issue: »nicht von dieser Erde«
  choice: bildlich-offene Aussage beibehalten
  alternative: »nicht menschlich« oder »vom Himmel«
  rationale: Die Aussage kann Herkunft, Wesen oder außergewöhnliche Fähigkeiten betreffen. Eine theologische Konkretisierung wäre nicht durch den vorliegenden Zeugen gedeckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit emotionaler Direktheit in der Klage des Lehrers. Wiederholungen und rhetorische Fragen bleiben erhalten. Der Entwurf ist vorläufig, da nur ein gemeinfreier englischer Textzeuge vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht.
