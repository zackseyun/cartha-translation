translation:
  language: de
  text: '**Kindheitsevangelium nach Thomas 7 – Die Klage des Zachäus**


    (1) Als der Lehrer hörte, mit welch sicherer Kenntnis Jesus über die Linien des ersten Buchstabens[a] sprach, war er angesichts einer solchen Lehre und seiner Verteidigung völlig ratlos. Der Lehrer sagte: »Wehe mir! Wehe mir! Ich bin ratlos und elend. Ich habe Schande über mich gebracht, weil ich dieses Kind als Schüler angenommen habe.


    (2) »Nimm ihn von mir weg, Bruder, denn ich ertrage weder seinen Blick noch die Klarheit seiner Worte. Dieses Kind ist einfach nicht von dieser Erde. Es kann sogar das Feuer bändigen! Vielleicht hat dieses Kind schon vor der Erschaffung der Welt existiert. Was für ein Schoß hat es getragen? Was für eine Mutter hat es aufgezogen? Ich weiß es nicht. Wehe mir, Bruder! Es versetzt mich in Erstarrung. Mein Verstand vermag ihm nicht zu folgen. Ich habe mich selbst getäuscht, dreifach unglücklich, wie ich bin. Ich meinte, einen Schüler zu gewinnen, und nun zeigt sich, dass ich einen Lehrer habe.


    (3) »Freunde, ich denke über meine Schande nach: Als alter Mann bin ich von einem Kind besiegt worden. Man sollte mich ausstoßen und sterben lassen – oder ich müsste wegen dieses Kindes aus diesem Dorf fliehen. Ich kann mich nicht länger unter den Leuten sehen lassen, besonders nicht unter denen, die gesehen haben, dass ich von einem ganz kleinen Kind besiegt wurde. Doch was kann ich irgendjemandem über die Linien des ersten Elements[a] sagen oder erzählen? Die Wahrheit ist: Ich weiß es nicht, Freunde, denn ich verstehe weder den Anfang noch das Ende!


    (4) »Darum, Bruder Josef, bring ihn wohlbehalten[b] in dein Haus. Denn dieses Kind ist etwas Großes – ob ein Gott oder ein Engel oder was ich sonst sagen könnte, ich weiß es nicht.«


    [a] Der englische Textzeuge spricht zunächst vom »ersten Buchstaben« und später vom »ersten Element«. Gemeint ist wahrscheinlich der erste Buchstabe des Alphabets; die unterschiedliche Ausdrucksweise bleibt bis zur Prüfung des griechischen Textes erhalten.


    [b] Wörtlich nach dem vorliegenden englischen Textzeugen: »mit Heil/Rettung«. Gemeint sein kann, dass Josef Jesus sicher beziehungsweise wohlbehalten nach Hause bringen soll.'
