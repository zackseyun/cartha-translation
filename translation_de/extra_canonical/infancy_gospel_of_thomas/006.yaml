  text: '(1) A teacher named Zacchaeus was standing there. He heard Jesus saying these things to his father Joseph, and he was greatly amazed.


    (2) He said to Joseph, “Come, brother, give him to me so that he may be taught letters, know all knowledge, learn to love those his own age, honor old age, and respect elders, so that he may develop a yearning for children and teach them in return.”


    (3) But Joseph said to the teacher, “Who can control this child and teach him? Do not think of him as a small person, brother.”


    But the teacher said, “Give him to me, brother, and do not let him concern you.”


    (4) The child Jesus looked at them and addressed the teacher: “Being a teacher comes naturally to you, but you are a stranger to the name by which you are called, because I am outside you and within you on account of the nobility of my birth in the flesh. But you, a lawyer, do not know the law.”


    Then he said to Joseph, “When you were born, I already existed, standing beside you, so that you, as a father, might be taught by me a teaching that no one else knows or can teach. And you will bear the name of salvation.”


    (5) The Jews cried out and said to him, “Oh, what a new and incredible wonder! The child is perhaps five years old, and oh, what words he speaks! We have never known such words. No one—neither a lawyer nor a Pharisee—has spoken like this child.”


    (6) The child answered them, “Why are you amazed? Or rather, why do you not believe the things I have told you? The truth is that I, who was created before this world, know precisely when you were born, as well as your fathers and their fathers.”


    (7) All the people who heard this were speechless and could no longer speak to him. But he went up to them, skipped around, and said, “I was playing with you because I know that you are small-minded and amazed by small things.”


    (8) When they seemed comforted by the child’s encouragement, the teacher said to his father, “Come, bring him into the school. I will teach him letters.”


    Joseph took his hand and led him into the school. The teacher flattered him and brought him into the school. Zacchaeus wrote out the alphabet for him and began to teach him, repeating the same letter frequently. But the child did not answer him.


    The teacher became irritated and struck him on the head.


    The child became irritated and said to him, “I want to teach you rather than be taught by you, since I know the letters you are teaching more precisely. To me, these things are like a noisy gong or a clanging cymbal that produces neither the sound, nor the glory, nor the power of understanding.”


    (9) When the child’s anger had ceased, he recited all the letters by himself, from alpha to omega, with great skill. Looking directly at the teacher, he said, “If you do not know the nature of the alpha, how can you teach someone else the beta? Hypocrite! If you know, first teach me the alpha, and then I will trust you to speak about the beta.” Then he began to teach the teacher about the first element, and the teacher could say nothing to him.


    (10) While many people listened, he said to the teacher, “Listen, Teacher, and understand the arrangement of the first element. Notice how it has sharp lines and a middle stroke, which you see pointing, standing with its legs apart, coming together, going out, dragging behind, lifting up, dancing around, <…>, in triple rhythm, two-cornered, of the same form, of the same thickness, of the same family, raised, balanced, isometric, and of equal proportions. These are the lines of the alpha.”'
translation:
  language: de
  text: '(1) Ein Lehrer namens Zachäus stand dort. Er hörte, wie Jesus dies zu seinem Vater Josef sagte, und staunte sehr.


    (2) Er sagte zu Josef: „Komm, Bruder, gib ihn mir, damit er die Buchstaben lernt, zu aller Erkenntnis gelangt und lernt, Gleichaltrige zu lieben, das Alter zu ehren und Älteren Achtung entgegenzubringen. So soll er Zuneigung zu Kindern entwickeln und sie seinerseits unterrichten.“


    (3) Josef aber sagte zu dem Lehrer: „Wer kann dieses Kind im Zaum halten und unterrichten? Halte ihn nicht für einen unbedeutenden Menschen[a], Bruder.“


    Der Lehrer erwiderte: „Gib ihn mir, Bruder, und mach dir seinetwegen keine Sorgen.“


    (4) Das Kind Jesus sah sie an und sagte zu dem Lehrer: „Lehrer zu sein liegt dir zwar von Natur aus; doch dem Namen, den du trägst, bist du fremd. Denn aufgrund der hohen Herkunft meiner leiblichen Geburt bin ich außerhalb von dir und in dir.[b] Du aber bist ein Gesetzeslehrer und kennst das Gesetz nicht.“


    Dann sagte er zu Josef: „Als du geboren wurdest, war ich schon da und stand neben dir, damit du als Vater von mir eine Lehre empfängst, die kein anderer kennt oder lehren kann. Und du wirst den Namen des Heils tragen.“[c]


    (5) Da riefen die Juden aus und sagten zu ihm: „Was für ein neues und unglaubliches Wunder! Das Kind ist vielleicht fünf Jahre alt – und was für Worte es spricht! Solche Worte haben wir noch nie gehört. Niemand, weder ein Gesetzeslehrer noch ein Pharisäer, hat je so gesprochen wie dieses Kind.“


    (6) Das Kind antwortete ihnen: „Warum staunt ihr? Oder vielmehr: Warum glaubt ihr nicht, was ich euch gesagt habe? In Wahrheit weiß ich, der ich vor dieser Welt erschaffen wurde,[d] genau, wann ihr geboren wurdet – ebenso eure Väter und deren Väter.“


    (7) Alle, die das hörten, waren sprachlos und vermochten ihm nichts mehr zu erwidern. Er aber ging auf sie zu, hüpfte umher und sagte: „Ich habe mit euch gespielt, denn ich weiß, dass ihr kleingeistig seid und über Kleinigkeiten staunt.“


    (8) Als sie durch den Zuspruch des Kindes offenbar wieder beruhigt waren, sagte der Lehrer zu seinem Vater: „Komm, bring ihn in die Schule. Ich werde ihn die Buchstaben lehren.“


    Josef nahm ihn bei der Hand und führte ihn in die Schule. Der Lehrer redete ihm freundlich zu und brachte ihn hinein. Zachäus schrieb ihm das Alphabet auf und begann ihn zu unterrichten, indem er denselben Buchstaben immer wieder vorsagte. Das Kind aber antwortete ihm nicht.


    Da wurde der Lehrer zornig und schlug ihm auf den Kopf.


    Das Kind wurde ebenfalls zornig und sagte zu ihm: „Ich will lieber dich unterrichten, als mich von dir unterrichten zu lassen, denn ich kenne die Buchstaben, die du lehrst, genauer als du. Für mich sind diese Dinge wie ein dröhnender Gong oder eine lärmende Zimbel, die weder den Klang noch die Herrlichkeit noch die Kraft des Verstehens hervorbringen.“


    (9) Als der Zorn des Kindes nachgelassen hatte, sagte es alle Buchstaben selbstständig auf, vom Alpha bis zum Omega, und zwar mit großer Gewandtheit. Dann sah es den Lehrer fest an und sagte: „Wenn du das Wesen des Alpha nicht kennst, wie kannst du dann einen anderen das Beta lehren? Du Heuchler! Wenn du es weißt, dann lehre mich zuerst das Alpha; danach werde ich dir zutrauen, über das Beta zu sprechen.“ Darauf begann es, den Lehrer über das erste Schriftzeichen zu belehren, und dieser konnte ihm nichts erwidern.


    (10) Während viele zuhörten, sagte es zu dem Lehrer: „Hör zu, Lehrer, und begreife die Anordnung des ersten Schriftzeichens. Achte darauf, wie es spitze Linien und einen Mittelstrich hat: Du siehst, wie es zeigt, mit gespreizten Beinen dasteht, zusammenläuft, hinausgeht, etwas hinter sich herzieht, sich erhebt, umhertanzt, <…>, einen dreifachen Rhythmus hat, zwei Ecken besitzt, gleichgestaltet, gleich stark und von derselben Art ist, aufgerichtet, ausgewogen, gleichmäßig bemessen und von gleichen Proportionen. Dies sind die Linien des Alpha.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Halte ihn nicht für einen kleinen Menschen.“ Gemeint sein kann: Halte ihn nicht für gering, gewöhnlich oder unbedeutend.'
    reason: Die Ausgangsformulierung ist semantisch mehrdeutig und darf nicht auf körperliche Größe verengt werden.
  - marker: b
    text: Die Aussage „außerhalb von dir und in dir“ ist im überlieferten Wortlaut rätselhaft; auch ihr Zusammenhang mit der „hohen Herkunft“ der leiblichen Geburt ist unsicher.
    reason: Bewahrt eine echte textliche und begriffliche Schwierigkeit, ohne eine spekulative Erklärung in den Haupttext einzutragen.
  - marker: c
    text: „Den Namen des Heils tragen“ ist eine unsichere, möglicherweise auf einen Namen oder dessen Bedeutung anspielende Formulierung.
    reason: Die Aussage ist ohne direkte Prüfung der griechischen Überlieferung nicht sicher aufzulösen.
  - marker: d
    text: 'So lautet das hier zugrunde gelegte Zeugnis: „erschaffen“. Die Formulierung wird nicht an spätere christologische Bekenntnissprache angeglichen.'
    reason: Kennzeichnet eine theologisch gewichtige Lesart und bewahrt deren Spannung.
lexical_decisions:
- source_word: letters / alphabet (γράμματα, presumed)
  choice: Buchstaben / Alphabet
  rationale: Im Schulkontext bezeichnet der Ausdruck zunächst die Schriftzeichen und dann deren geordnete Folge; die Wiedergabe bleibt für heutige Leser unmittelbar verständlich.
- source_word: small person
  choice: unbedeutender Mensch
  rationale: Der Zusammenhang warnt nicht lediglich davor, Jesu Körpergröße falsch einzuschätzen. Die Formulierung bewahrt den möglichen Sinn von gering, gewöhnlich oder unbedeutend; eine Fußnote weist auf die wörtlichere Alternative hin.
- source_word: lawyer
  choice: Gesetzeslehrer
  rationale: „Jurist“ wäre modern-anachronistisch. „Gesetzeslehrer“ bezeichnet einen Kenner und Ausleger des religiösen Gesetzes, ohne eine konfessionelle Deutung einzutragen.
- source_word: first element
  choice: erstes Schriftzeichen
  rationale: Gemeint ist das Alpha als erstes Element des Alphabets. „Schriftzeichen“ ist im Deutschen natürlicher als das missverständliche „Element“.
- source_word: noisy gong / clanging cymbal
  choice: dröhnender Gong / lärmende Zimbel
  rationale: Die markante Klangbildlichkeit bleibt erhalten; „Zimbel“ wahrt zudem die erkennbare Nähe zur antiken religiösen Sprachwelt.
- source_word: encouragement
  choice: Zuspruch
  rationale: Die Szene spricht eher von tröstender oder beruhigender Ansprache als von moderner Motivation.
theological_decisions:
- issue: Jesu Aussage über seine Existenz vor Josef
  choice: „war ich schon da“
  alternative: „existierte ich bereits“
  rationale: Die Aussage der Präexistenz bleibt klar erhalten, klingt aber als Rede eines Kindes natürlich und würdevoll.
- issue: Jesu Aussage, vor der Welt erschaffen worden zu sein
  choice: „der ich vor dieser Welt erschaffen wurde“
  alternative: „der ich vor dieser Welt war“
  rationale: Das explizite „created“ des vorliegenden Zeugnisses wird nicht christologisch harmonisiert oder abgeschwächt. Die Spannung zu späteren dogmatischen Formulierungen bleibt sichtbar.
- issue: „outside you and within you“
  choice: „außerhalb von dir und in dir“
  alternative: deutende Umschreibungen wie „dir überlegen und dir innerlich gegenwärtig“
  rationale: Die rätselhafte Gegenüberstellung wird formal bewahrt, statt spekulativ erklärt zu werden.
- issue: „name of salvation“
  choice: „den Namen des Heils tragen“
  alternative: „den Namen Jesus tragen“ oder „Retter heißen“
  rationale: Der schwer verständliche Wortlaut wird nicht stillschweigend als Namensdeutung aufgelöst. Eine Fußnote markiert die Unsicherheit.
- issue: Bezeichnung „die Juden“
  choice: „die Juden“
  alternative: „die jüdischen Anwesenden“
  rationale: Die kollektive Bezeichnung des Zeugnisses bleibt erhalten; der unmittelbare Kontext beschreibt die anwesende Gruppe und gibt keinen Anlass zu einer pauschalen Ausweitung.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerischer Klarheit. Wiederholungen wurden dort bewahrt, wo sie die schulische Szene und den Streit prägen. Die schwer verständliche Beschreibung des Alpha wurde bewusst nur leicht geglättet; der Auslassungsmarker <…> bleibt als Hinweis auf beschädigten oder fehlenden Text erhalten. Da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorläufig.
