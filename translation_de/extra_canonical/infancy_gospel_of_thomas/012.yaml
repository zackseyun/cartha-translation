base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: de
  text: '(1) Zur Zeit der Aussaat säte Josef Saatgut aus, und das Kind Jesus säte ein Maß Weizen.


    (2) Sein Vater erntete hundert große Maße. Großzügig gab er den Armen und den Waisen davon. Josef aber nahm von dem, was Jesus gesät hatte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Textzeugen: „Josef aber nahm von Jesu Saat/Samen.“ Der genaue Sinn des abschließenden Satzes ist unklar; möglicherweise soll gesagt werden, dass die reiche Ernte aus dem von Jesus gesäten Weizen hervorging.'
    reason: Die Formulierung des Zeugen ist elliptisch und semantisch mehrdeutig. Da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht, wird die Unsicherheit offengelegt.
lexical_decisions:
- source_word: one measure of wheat
  choice: ein Maß Weizen
  rationale: Bewahrt die unbestimmte antike Maßeinheit, ohne eine moderne Mengeneinheit einzutragen.
- source_word: a hundred great measures
  choice: hundert große Maße
  rationale: Gibt sowohl die Zahl als auch die auffällige Größenangabe des überlieferten englischen Zeugen wieder; die genaue antike Maßeinheit bleibt offen.
- source_word: the poor and the orphans
  choice: den Armen und den Waisen
  rationale: Natürliche und zugleich eng am Zeugnis orientierte deutsche Wiedergabe.
- source_word: graciously / generously
  choice: großzügig
  rationale: Drückt die freigebige Art des Gebens in modernem Standarddeutsch klar aus.
theological_decisions:
- issue: Außergewöhnlicher Ernteertrag
  choice: Der hundertfache, in großen Maßen angegebene Ertrag bleibt ohne erklärenden Zusatz stehen.
  alternative: Den Ertrag ausdrücklich als Wunder bezeichnen.
  rationale: Der Erzählzusammenhang legt ein Wunder nahe, doch der Text selbst formuliert keine ausdrückliche Deutung; diese Spannung wird bewahrt.
- issue: Bezug von „sein Vater“ und „er“
  choice: „Sein Vater“ wird auf Josef bezogen; der folgende Satz lässt das Pronomen im Deutschen durch „er“ auf Josef zurückverweisen.
  alternative: Jesus als Geber an die Armen und Waisen verstehen.
  rationale: Die unmittelbare Satzfolge des vorliegenden Zeugen spricht grammatisch eher für Josef, auch wenn die knappe Überlieferung nicht völlig spannungsfrei ist.
