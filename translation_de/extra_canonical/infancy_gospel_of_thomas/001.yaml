lexical_decisions:
- source_word: Thomas the Israelite
  choice: Thomas, der Israelit
  rationale: Bewahrt die Selbstbezeichnung des überlieferten Zeugen in natürlichem, würdigem Deutsch.
- source_word: Gentile brothers (and sisters)
  choice: Brüdern und Schwestern aus den Völkern
  rationale: „Aus den Völkern“ gibt den Gegensatz zu Israel wieder, ohne das im heutigen Deutsch leicht abwertend wirkende „Heiden“ zu verwenden; die ausdrücklich angegebene inklusive Aussage bleibt erhalten.
- source_word: all the things done by our Lord Jesus Christ
  choice: alles …, was unser Herr Jesus Christus … tat
  rationale: Aktive, idiomatische Wiedergabe, die Jesus eindeutig als Handelnden bezeichnet und den umfassenden Anspruch von „alles“ wahrt.
- source_word: in our region of Bethlehem
  choice: in unserer Gegend, in Bethlehem
  rationale: Folgt der räumlichen Formulierung des bereitgestellten Zeugen, ohne eine genauere geografische Beziehung zu behaupten, als die Grundlage hergibt.
- source_word: This is the beginning
  choice: Dies ist der Anfang
  rationale: Schlichte, formnahe Wiedergabe der Einleitungsformel.
theological_decisions:
- issue: Bezeichnung Jesu
  choice: unser Herr Jesus Christus
  alternative: unser Herr, Jesus Christus
