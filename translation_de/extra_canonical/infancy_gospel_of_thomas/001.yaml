- issue: Adressaten außerhalb Israels
  choice: Brüder und Schwestern aus den Völkern
  alternative: heidnische Brüder und Schwestern
  rationale: Erhält die Zugehörigkeits- und Herkunftsaussage, vermeidet aber eine moderne abwertende Nebenbedeutung.
