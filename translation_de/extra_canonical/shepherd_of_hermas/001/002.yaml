base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: de
  text: 'Da lachte sie und sagte zu mir: „Das Verlangen nach dem Bösen ist in deinem Herzen aufgekommen. Oder scheint es dir nicht eine böse Sache zu sein, wenn einem gerechten Mann ein böses Verlangen ins Herz steigt? Es ist tatsächlich Sünde, und zwar eine große“, sagte sie. „Denn ein gerechter Mann sinnt auf das, was gerecht ist. Indem er also auf das Gerechte sinnt, wird seine Herrlichkeit im Himmel gefestigt, und der Herr lässt sich in all seinen Angelegenheiten leicht versöhnen.[a] Die aber in ihren Herzen auf Böses sinnen, ziehen Tod und Gefangenschaft auf sich – besonders jene, die sich dieses gegenwärtige Zeitalter sichern, mit ihrem Reichtum prahlen und sich nicht an die kommenden Güter halten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „er hat den Herrn leicht versöhnlich“. Die griechische Wendung besagt, dass der Herr leicht zu versöhnen ist.'
    reason: εὐκατάλλακτον ist ungewöhnlich formuliert; die Fußnote erläutert die wörtliche Konstruktion und verhindert, dass „leicht versöhnen“ als Verharmlosung oder als Aussage über menschliche Leistung missverstanden wird.
lexical_decisions:
- source_word: ἡ ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: das Verlangen nach dem Bösen / ein böses Verlangen
  rationale: Gibt sowohl das Begehren als auch seine moralische Ausrichtung wieder, ohne es unnötig auf sexuelles Begehren einzuengen.
- source_word: δίκαια βουλεύεται
  choice: sinnt auf das, was gerecht ist
  rationale: Bewahrt den inneren, überlegenden Charakter von βουλεύομαι und den Gegensatz zum bösen Sinnen im Herzen.
- source_word: κατορθοῦται ἡ δόξα αὐτοῦ
  choice: wird seine Herrlichkeit … gefestigt
  rationale: κατορθόω bezeichnet hier ein Aufrichten, Festigen oder erfolgreiches Herstellen; „gefestigt“ ist idiomatisch und lässt die genaue Wirkweise offen.
- source_word: τὸν αἰῶνα τοῦτον περιποιούμενοι
  choice: die sich dieses gegenwärtige Zeitalter sichern
  rationale: Erhält die ungewöhnliche Verbindung von περιποιέομαι mit αἰών und vermeidet eine vorschnelle Verengung auf bloßen weltlichen Besitz.
- source_word: μὴ ἀντεχόμενοι τῶν ἀγαθῶν τῶν μελλόντων
  choice: sich nicht an die kommenden Güter halten
  rationale: ἀντέχομαι bedeutet festhalten oder sich an etwas halten; „kommende Güter“ bewahrt die eschatologische Offenheit.
theological_decisions:
- issue: Sündhaftigkeit eines innerlich aufkommenden bösen Verlangens
  choice: 'Die Aussage bleibt ausdrücklich: Schon das Aufkommen des bösen Verlangens im Herzen wird als große Sünde bezeichnet.'
  alternative: Die Sünde erst in einer bewussten Zustimmung oder äußeren Tat verorten.
  rationale: Der griechische Text formuliert die Bewertung des im Herzen aufkommenden Verlangens ausdrücklich und bietet hier keine solche Einschränkung.
- issue: εὐκατάλλακτον ἔχει τὸν Κύριον
  choice: „findet er den Herrn zur Versöhnung bereit“ mit Fußnote
  alternative: „steht der Herr ihm wohlwollend bei“ oder „ist ihm der Herr gnädig“
  rationale: Die Übersetzung wahrt die konkrete Versöhnungssprache und ihre theologische Spannung, statt sie in allgemeines Wohlwollen umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lehrhafte Ton und die wiederholte Gegenüberstellung von gerechtem und bösem Sinnen bleiben erhalten; unnötige konfessionelle Fachsprache wurde vermieden.
