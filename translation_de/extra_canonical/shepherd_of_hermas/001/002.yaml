revisions:
- from: 'Da lachte sie und sagte zu mir: „Das Verlangen nach dem Bösen ist in deinem Herzen aufgekommen. Oder meinst du etwa, es sei für einen gerechten Mann nichts Böses, wenn in seinem Herzen ein böses Verlangen aufkommt? Es ist sehr wohl Sünde, und zwar eine große“, sagte sie. „Denn ein gerechter Mann sinnt auf das, was gerecht ist. Indem er also auf das Gerechte sinnt, wird seine Herrlichkeit im Himmel gefestigt, und in allem, was er tut, findet er den Herrn zur Versöhnung bereit.[a] Die aber in ihren Herzen auf Böses sinnen, ziehen Tod und Gefangenschaft auf sich – besonders jene, die sich dieses gegenwärtige Zeitalter sichern, mit ihrem Reichtum prahlen und sich nicht an die kommenden Güter halten.“'
  to: 'Da lachte sie und sagte zu mir: „Das Verlangen nach dem Bösen ist in deinem Herzen aufgekommen. Oder scheint es dir nicht eine böse Sache zu sein, wenn einem gerechten Mann ein böses Verlangen ins Herz steigt? Es ist tatsächlich Sünde, und zwar eine große“, sagte sie. „Denn ein gerechter Mann sinnt auf das, was gerecht ist. Indem er also auf das Gerechte sinnt, wird seine Herrlichkeit im Himmel gefestigt, und der Herr lässt sich in all seinen Angelegenheiten leicht versöhnen.[a] Die aber in ihren Herzen auf Böses sinnen, ziehen Tod und Gefangenschaft auf sich – besonders jene, die sich dieses gegenwärtige Zeitalter sichern, mit ihrem Reichtum prahlen und sich nicht an die kommenden Güter halten.“'
