base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: de
  text: »Habe ich so etwas gesagt? Habe ich dich nicht immer wie eine Göttin angesehen? Habe ich dich nicht immer wie eine Schwester geachtet? Warum beschuldigst du mich fälschlich, Frau, solcher bösen und unreinen Dinge?«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: Habe ich so etwas gesagt?
  rationale: Das isolierte Aoristverb bedeutet wörtlich „Habe ich gesprochen/gesagt?“. „so etwas“ stellt im Deutschen den aus dem unmittelbaren Zusammenhang erschließbaren Bezug natürlich her, ohne einen bestimmten Wortlaut hinzuzufügen.
- source_word: ὡς θεὰν ἡγησάμην
  choice: wie eine Göttin angesehen
  rationale: ἡγέομαι bezeichnet hier das Betrachten oder Einschätzen; die ungewöhnliche Bezeichnung „Göttin“ wird als genuine Aussage des Textes bewahrt.
- source_word: ἐνετράπην
  choice: mit Ehrfurcht begegnet
  rationale: ἐντρέπομαι kann Achtung, Scheu oder ehrerbietigen Respekt ausdrücken. Die Formulierung bewahrt die stärkere Nuance gegenüber bloßem „respektiert“, klingt aber im modernen Deutschen natürlich.
- source_word: καταψεύδῃ
  choice: beschuldigst du mich fälschlich
  rationale: Das Verb bezeichnet eine unwahre Aussage gegen jemanden beziehungsweise eine falsche Anschuldigung; diese relationale Bedeutung wird ausdrücklich wiedergegeben.
- source_word: τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα
  choice: solcher bösen und unreinen Dinge
  rationale: Die substantivierten Adjektive bleiben bewusst allgemein, da der griechische Text an dieser Stelle die vorgeworfenen Gedanken oder Handlungen nicht genauer benennt.
- source_word: ὦ γύναι
  choice: Frau
  rationale: Die direkte Anrede wird schlicht wiedergegeben. „O Frau“ wäre formaler, wirkt im heutigen Deutsch jedoch unnötig altertümlich.
theological_decisions:
- issue: Vergleich der Frau mit einer Göttin
  choice: „wie eine Göttin“ wörtlich bewahren
  alternative: „wie eine Herrin“ oder „mit göttlicher Verehrung“
  rationale: θεά bedeutet eindeutig „Göttin“. Eine Abschwächung würde die auffällige rhetorische Aussage und mögliche frühchristliche Spannung des Textes verdecken.
- issue: Art der angeblichen Verfehlung
  choice: „böse und unreine Dinge“ unbestimmt lassen
  alternative: als unreine Gedanken, Begierden oder Handlungen konkretisieren
  rationale: Der vorliegende Satz nennt die Sache nur substantivisch; ihre genauere Deutung folgt aus dem weiteren Kontext und soll nicht vorweggenommen werden.
translation_notes:
  register: Moderne, würdige direkte Rede mit klarer rhetorischer Steigerung. Das ungewöhnliche „Göttin“ und die Unbestimmtheit der Anschuldigung bleiben quellengetreu erhalten; die Syntax wurde für gewöhnliche heutige Leser behutsam geglättet.
