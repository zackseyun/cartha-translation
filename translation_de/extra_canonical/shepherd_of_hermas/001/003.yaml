base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: de
  text: „Die Seelen derer, die keine Hoffnung haben, sondern an sich selbst und an ihrem Leben verzweifelt sind, werden umkehren. Du aber bete zu Gott, und er wird deine Sünden heilen, ebenso die deines ganzen Hauses und die aller Heiligen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: werden es bereuen
  rationale: Das Futur von μετανοέω bezeichnet hier eine künftige Reue beziehungsweise Umkehr. „Es bereuen“ bewahrt im Zusammenhang mit Hoffnungslosigkeit den warnenden Ton, ohne eine erfolgreiche Umkehr ausdrücklich vorauszusetzen.
- source_word: ἑαυτοὺς ἀπηγνώκασι καὶ τὴν ζωὴν αὐτῶν
  choice: sich selbst und ihr Leben aufgegeben haben
  rationale: ἀπαγινώσκω meint hier, alle Hoffnung hinsichtlich seiner selbst und seines Lebens verloren zu haben. Die idiomatische deutsche Wendung gibt diesen Sinn verständlich wieder.
- source_word: ἰάσεται
  choice: wird … heilen
  rationale: Die konkrete Heilungsmetapher des griechischen Verbs wird erhalten und nicht zu „vergeben“ oder „beseitigen“ verengt.
- source_word: τοῦ οἴκου σου
  choice: deines ganzen Hauses
  rationale: „Haus“ wahrt die mögliche Bedeutungsspanne zwischen Hausgemeinschaft und Familie besser als das engere „Familie“.
- source_word: τῶν ἁγίων
  choice: aller Heiligen
  rationale: Die frühchristliche Bezeichnung für die Gott Zugehörigen wird wörtlich und in traditionell verständlicher Form wiedergegeben.
theological_decisions:
- issue: Heilung von Sünden
  choice: „er wird deine Sünden heilen“
  alternative: „er wird deine Sünden vergeben“
  rationale: Der Ausgangstext verwendet ausdrücklich ἰάομαι („heilen“). Die ungewöhnliche Verbindung soll als theologisch aussagekräftige Metapher erhalten bleiben.
- issue: Reue der Hoffnungslosen
  choice: „werden es bereuen“
  alternative: „werden umkehren“
  rationale: Der Satz kann drohende spätere Reue oder Umkehr bezeichnen. „Bereuen“ vermeidet es, eine rettende Umkehr sicher in den Text hineinzulesen, und wahrt damit die Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der direkte Anredeton und die parallele Satzstruktur bleiben erhalten; ungewöhnliche Quellmetaphern werden nicht geglättet.
