  text: Listen to me, children. I reared you in great simplicity and innocence and dignity, through the mercy of the Lord, who caused righteousness to drip upon you, so that you might be justified and …
translation:
  language: de
  text: Hört auf mich, Kinder. Ich habe euch wegen der Barmherzigkeit des Herrn, der Gerechtigkeit auf euch herabträufelte, in großer Lauterkeit, Unschuld und Würde aufgezogen, damit ihr gerechtfertigt werdet und …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Hört auf mich
  rationale: Gibt den direkten, eindringlichen Imperativ natürlich wieder; μου bezeichnet hier die Person, auf die gehört werden soll.
- source_word: τέκνα
  choice: Kinder
  rationale: Bewahrt die familiäre Anrede des griechischen Textes.
- source_word: ἐξέθρεψα
  choice: habe … aufgezogen
  rationale: Das Verb bezeichnet Ernährung und Heranziehen; im Zusammenhang ist „aufgezogen“ idiomatisch und umfassend.
- source_word: ἁπλότητι
  choice: Aufrichtigkeit
  rationale: Bewahrt den positiven Sinn von Lauterkeit und ungeteilter Gesinnung, ohne den modernen Beiklang mangelnder Intelligenz von „Einfalt“.
- source_word: ἀκακίᾳ
  choice: Arglosigkeit
  rationale: Bezeichnet das Freisein von Bosheit oder Schädlichkeit; „Arglosigkeit“ ist in diesem Tugendkatalog natürlich.
- source_word: σεμνότητι
  choice: Würde
  rationale: Gibt den Sinn ehrbarer, achtungsgebietender Haltung in gehobenem, verständlichem Deutsch wieder.
- source_word: στάξαντος τὴν δικαιοσύνην
  choice: der Gerechtigkeit auf euch herabträufeln ließ
  rationale: Erhält das auffällige Bild des Träufelns und die kausative Nuance des Aoristpartizips.
- source_word: δικαιωθῆτε
  choice: gerecht würdet
  rationale: Bewahrt das Passiv und die mögliche forensische wie transformative Spannung, statt es eindeutig als „für gerecht erklärt“ oder „rechtschaffen gemacht“ festzulegen.
theological_decisions:
- issue: Bedeutung von δικαιωθῆτε
  choice: damit ihr gerecht würdet
  alternative: damit ihr gerechtfertigt würdet / damit ihr für gerecht erklärt würdet
  rationale: Die gewählte Formulierung lässt offen, ob das Passiv vorwiegend Feststellung, Rechtfertigung oder ein Gerechtwerden bezeichnet, und importiert keine konfessionelle Festlegung.
- issue: Verhältnis von Barmherzigkeit und Gerechtigkeit
  choice: durch die Barmherzigkeit des Herrn, der Gerechtigkeit auf euch herabträufeln ließ
  alternative: durch die Barmherzigkeit des Herrn, die Gerechtigkeit auf euch träufelte
  rationale: Der Relativsatz wird auf „Herrn“ bezogen, wie es die Form des griechischen Partizips nahelegt; zugleich bleibt das bildhafte Zusammenspiel von Barmherzigkeit und Gerechtigkeit erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der unvollständige Schluss des gelieferten Quellsegments wird durch „und …“ sichtbar bewahrt. Keine Fußnoten erforderlich.
