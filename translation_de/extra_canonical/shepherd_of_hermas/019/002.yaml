  naturalness: Die Formulierung ist überwiegend modernes, verständliches Deutsch. „Herr“ sollte jedoch an die Frage angeschlossen werden. „das Bild der ersten Vision“ ist als knappe, natürliche Wiedergabe von τύπος weniger deutend als „Sinnbild“.
  terminology: „Stuhl“ gibt καθέδρα in diesem Zusammenhang angemessen wieder. „Vision“ ist im literarischen Kontext passend. Die Wendung „damit die Schwäche seines Körpers gestützt wird“ folgt dem griechischen Bild und ist verständlich.
