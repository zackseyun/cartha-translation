base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/002.yaml
  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: de
  text: „Warum saß sie nun auf einem Stuhl?“, wollte ich wissen, Herr. „Weil jeder Schwache wegen seiner Schwäche auf einem Stuhl sitzt, damit die Schwäche seines Körpers gestützt wird. Damit hast du das Bild der ersten Vision.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: Stuhl
  rationale: Bezeichnet hier einen Sitz, der dem geschwächten Körper Halt gibt; „Stuhl“ ist im modernen Deutsch natürlich und weniger institutionell als „Sitz“ oder „Lehrstuhl“.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird formal und ohne zusätzliche Deutung wiedergegeben.
- source_word: συνκρατηθῇ
  choice: gestützt wird
  rationale: Im Zusammenhang geht es darum, dass der schwache Körper durch das Sitzen Halt erhält.
- source_word: τύπον
  choice: Sinnbild
  rationale: Gemeint ist die bildhafte Bedeutung beziehungsweise Deutung der ersten Erscheinung, nicht lediglich ein äußeres Muster.
- source_word: ὁράσεως
  choice: Vision
  rationale: Der etablierte Gattungsbegriff passt zum literarischen Kontext und gibt die Schau als Offenbarungserlebnis wieder.
theological_decisions:
- issue: Bedeutung von τύπος
  choice: Sinnbild
  alternative: Muster
  rationale: „Sinnbild“ lässt die typologische beziehungsweise symbolische Funktion erkennen, ohne eine bestimmte dogmatische Auslegung festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Frageform des griechischen Satzes wird natürlich wiedergegeben; die respektvolle Anrede „Herr“ bleibt erhalten.
