  - severity: low
    issue: Erneuerungsbild bei ἀνανεῶσαι
    rationale: „Wieder neue Kraft zu gewinnen“ konkretisiert die Erneuerung als Kraftgewinn. „auf Erneuerung hoffen“ bewahrt das allgemeiner gehaltene Bild des griechischen Wortlauts.
