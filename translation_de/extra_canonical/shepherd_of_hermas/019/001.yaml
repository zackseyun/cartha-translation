  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: de
  text: „Höre“, sagt er, „was die drei Gestalten betrifft, nach denen du fragst. Warum erschien sie dir in der ersten Vision als ältere Frau und auf einem Stuhl sitzend? Weil euer Geist alt und schon verwelkt ist und wegen eurer Schwächen und eurer Unentschlossenheit keine Kraft mehr hat. Denn wie alte Menschen, die nicht mehr auf Erneuerung hoffen, nichts anderes erwarten als ihren Schlaf, so habt auch ihr euch, geschwächt durch die Angelegenheiten des täglichen Lebens, der Gleichgültigkeit hingegeben. Ihr habt eure Sorgen nicht auf den Herrn geworfen; vielmehr ist euer Denken zerrüttet worden, und durch eure Leiden seid ihr alt geworden.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: Gestalten
  rationale: Bezeichnet hier die unterschiedlichen Erscheinungsformen der Frau und ist im Deutschen natürlicher als „Formen“.
- source_word: τὸ πνεῦμα ὑμῶν
  choice: euer Geist
  rationale: Bewahrt die direkte und theologisch offene Entsprechung zu πνεῦμα, ohne es psychologisch einzuengen.
- source_word: μαλακιῶν
  choice: Schwächen
  rationale: Der Kontext bezeichnet Erschlaffung bzw. Kraftlosigkeit; „Schwächen“ ist verständlich und vermeidet die missverständliche moderne Nebenbedeutung von „Weichlichkeit“.
- source_word: διψυχιῶν
  choice: Unentschlossenheit
  rationale: Gibt das Schwanken eines „doppelten Sinnes“ idiomatisch wieder, ohne die Stelle stärker als nötig dogmatisch zu bestimmen.
- source_word: βιωτικῶν πραγμάτων
  choice: Angelegenheiten des täglichen Lebens
  rationale: Erfasst die Belastungen und Geschäfte des irdischen Alltags in natürlichem modernem Deutsch.
- source_word: ἀκηδίας
  choice: Gleichgültigkeit
  rationale: Bezeichnet Nachlässigkeit, innere Teilnahmslosigkeit oder Mutlosigkeit; „Gleichgültigkeit“ bewahrt die moralisch-geistliche Dimension verständlich.
- source_word: διάνοια
  choice: Denken
  rationale: Bezeichnet Sinn, Verstand oder innere Haltung; „Denken“ bleibt weit genug und klingt natürlich.
- source_word: κοίμησιν
  choice: Schlaf
  rationale: Bewahrt das Bild des griechischen Textes und seine mögliche verhüllende Anspielung auf den Tod.
theological_decisions:
- issue: Bedeutung von διψυχία
  choice: Unentschlossenheit
  alternative: Doppelherzigkeit
  rationale: „Unentschlossenheit“ erhält den Gedanken des inneren Schwankens, ohne ausdrücklich moralische Heuchelei zu unterstellen.
- issue: Bild des Schlafes
  choice: ihren Schlaf
  alternative: ihren Tod
  rationale: Die Bildsprache des Originals bleibt erhalten; eine mögliche Todesanspielung wird nicht stillschweigend aufgelöst.
- issue: Bezug von πνεῦμα
  choice: euer Geist
  alternative: eure geistliche Verfassung
  rationale: Die formale Offenheit bleibt gewahrt, statt πνεῦμα interpretierend auf einen psychischen oder geistlichen Zustand zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Rede und klarer Satzführung. Der Wechsel zwischen Singular („du“) und Plural („euer/ihr“) folgt dem griechischen Text. Der eingereichte Leserabschnitt umfasst entsprechend dem englischen POB nur den ersten Teil des überlieferten griechischen Elternabschnitts und endet vor Hermas’ anschließender Frage.
