  terminology: „Geist“, „Schwächen“, „Gleichgültigkeit“, „Denken“ und „Schlaf“ sind als offene, verständliche Entsprechungen tragfähig. „Unentschlossenheit“ gibt διψυχία zwar etwas verengt wieder, ist im gegebenen Kontext jedoch noch vertretbar und legt keine konfessionelle Deutung fest.
