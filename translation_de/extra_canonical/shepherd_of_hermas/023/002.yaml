base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: de
  text: Ich wusste, dass ich ihr entkommen würde,[a] wenn euer Herz rein und makellos wird und ihr dem Herrn während der übrigen Tage eures Lebens untadelig dient. Werft eure Sorgen auf den Herrn, und er selbst wird sie zurechtbringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr entkommen“. Das feminine Pronomen bezieht sich auf etwas im weiteren Zusammenhang; im vorliegenden Ausschnitt bleibt der Bezug unausgesprochen.'
    reason: Das grammatische Geschlecht und die im Ausschnitt bestehende Unbestimmtheit des Bezugs bleiben sichtbar.
  - marker: b
    text: 'Oder: „wird sie in Ordnung bringen“ bzw. „wird sie recht lenken“.'
    reason: κατορθόω bezeichnet hier das erfolgreiche Ordnen oder Zurechtbringen, ohne die Art des Ergebnisses näher festzulegen.
lexical_decisions:
- source_word: ἐκφυγεῖν αὐτήν
  choice: ihr entkommen würde
  rationale: Das feminine Pronomen wird bewahrt, obwohl sein Bezug innerhalb des vorgegebenen Segments nicht ausdrücklich genannt ist. Die futurische Wiedergabe folgt dem konditionalen Zusammenhang mit ἐάν.
- source_word: καθαρὰ καὶ ἄμωμος
  choice: rein und makellos
  rationale: Gibt beide moralisch-kultischen Qualitätsbegriffe knapp und würdig wieder, ohne sie zu verschmelzen.
- source_word: δουλεύσητε τῷ Κυρίῳ
  choice: ihr dem Herrn … dient
  rationale: „Dienen“ ist im Deutschen natürlich und wahrt die religiöse Bindung des Verbs, ohne unnötig mit „Sklavendienst“ zu verschärfen.
- source_word: μερίμνας
  choice: Sorgen
  rationale: Die geläufige deutsche Entsprechung erfasst belastende Besorgnisse und passt zum Bild des Werfens auf den Herrn.
- source_word: κατορθώσει αὐτάς
  choice: wird sie zum Guten wenden
  rationale: κατορθόω bezeichnet hier das In-Ordnung-Bringen bzw. gute Lenken der Sorgen/Angelegenheiten; die Formulierung bleibt verständlich, ohne eine konkrete Art der Lösung festzulegen.
theological_decisions:
- issue: Bedingung von Reinheit und untadeligem Dienst
  choice: Die Wenn-Bedingung bleibt ausdrücklich erhalten.
  alternative: Die Aussage als bloße Ermahnung oder als bedingungslose Zusicherung formulieren.
  rationale: Der griechische Text verbindet das Entkommen grammatisch mit ἐάν und zwei Konjunktiven; diese Spannung darf nicht abgeschwächt werden.
- issue: Handeln des Herrn an den Sorgen
  choice: „er selbst wird sie zum Guten wenden“
  alternative: „er wird sie beseitigen“ oder „er wird alles gelingen lassen“
  rationale: Der Text verheißt göttliches Ordnen oder Lenken, aber nicht ausdrücklich die vollständige Beseitigung aller Sorgen oder allgemeinen Erfolg.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die direkte Anrede im Plural und der auffällige Singular „euer Herz“ entsprechen dem griechischen Text. Sämtliche Fußnotenmarker stehen im Haupttext.
