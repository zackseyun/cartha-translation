base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: de
  text: 'Vertraut dem Herrn, ihr Zwiespältigen! Denn er vermag alles: Er wendet seinen Zorn von euch ab und schickt euch Zwiespältigen Plagen. Wehe denen, die diese Worte gehört und nicht darauf gehört haben! Es wäre besser für sie gewesen, nicht geboren zu werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε
  choice: Vertraut
  rationale: Der Dativ τῷ Κυρίῳ bezeichnet hier die Person, der Vertrauen geschenkt werden soll. „Vertraut dem Herrn“ klingt im modernen Deutsch natürlicher als „Glaubt dem Herrn“ und bewahrt den Aufforderungscharakter.
- source_word: οἱ δίψυχοι / τοῖς διψύχοις
  choice: ihr Unentschlossenen / euch Unentschlossenen
  rationale: δίψυχος bedeutet wörtlich „doppelseelig“ und bezeichnet einen innerlich geteilten, schwankenden Menschen. „Unentschlossen“ gibt dies verständlich wieder, ohne eine ungewöhnliche deutsche Wortbildung einzuführen.
- source_word: πάντα δύναται
  choice: er vermag alles
  rationale: Die umfassende Aussage über das Können des Herrn wird knapp und würdig wiedergegeben.
- source_word: ἀποστρέφει τὴν ὀργὴν αὐτοῦ
  choice: Er wendet seinen Zorn von euch ab
  rationale: Die räumliche Bildlichkeit von ἀποστρέφει ... ἀφ’ ὑμῶν bleibt erhalten.
- source_word: μάστιγας
  choice: Plagen
  rationale: μάστιξ kann „Geißel“, „Schlag“ oder übertragen eine strafende Plage bedeuten. Der Plural „Plagen“ ist hier natürlich und lässt den Charakter göttlicher Züchtigung erkennen.
- source_word: παρακούσασιν
  choice: nicht darauf gehört haben
  rationale: παρακούω kann das Nichtbeachten beziehungsweise den Ungehorsam gegenüber Gehörtem ausdrücken. Die Formulierung nimmt das vorherige „gehört“ auf und bildet das Wortspiel verständlich ab.
- source_word: αἱρετώτερον
  choice: besser
  rationale: Der Komparativ bezeichnet das Vorzuziehende; die idiomatische deutsche Wendung lautet „es wäre besser gewesen“.
theological_decisions:
- issue: Verhältnis zwischen dem Abwenden des Zorns und dem Senden von Plagen
  choice: Die griechische Verbindung mit καί wird als „und“ bewahrt.
  alternative: „aber er schickt … Plagen“, wie in der englischen Konsultationsfassung
  rationale: Der griechische Text stellt beide Handlungen ohne ausdrücklichen Gegensatz nebeneinander. Die mögliche Spannung zwischen abgewendetem Zorn und gesandten Plagen soll nicht durch ein ergänztes „aber“ aufgelöst werden.
- issue: Adressaten der Plagen
  choice: „euch Unentschlossenen“
  alternative: Eine unpersönliche oder allgemein gehaltene Wiedergabe
  rationale: Der Dativ ὑμῖν τοῖς διψύχοις spricht dieselben Angeredeten ausdrücklich an und soll in seiner warnenden Direktheit erhalten bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Mahnwortcharakter. Der Imperativ und das zweimalige direkte Anreden der innerlich Schwankenden bleiben erhalten. Keine Fußnoten erforderlich.
