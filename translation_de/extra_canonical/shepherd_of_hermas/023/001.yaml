  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: de
  text: Nachdem das Tier an mir vorübergegangen war und ich etwa dreißig Fuß weitergegangen war, siehe, da kam mir eine Jungfrau entgegen. Sie war geschmückt wie eine, die aus einem Brautgemach hervortritt, ganz in Weiß gekleidet und mit weißen Sandalen. Sie war bis zur Stirn verhüllt; ihre Verhüllung bestand aus einer Mitra, und ihr Haar war weiß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: Gibt den allgemeinen griechischen Ausdruck wieder, ohne durch „Ungeheuer“ eine zusätzliche Wertung einzutragen.
- source_word: ὡσεὶ πόδας τριάκοντα
  choice: etwa dreißig Fuß
  rationale: Bewahrt die antike Maßeinheit und den Näherungscharakter von ὡσεὶ.
- source_word: παρθένος
  choice: Jungfrau
  rationale: Die direkte und im visionären Kontext natürliche Entsprechung.
- source_word: κεκοσμημένη ὡς ἐκ νυμφῶνος ἐκπορευομένη
  choice: geschmückt wie eine Braut, die aus dem Brautgemach kommt
  rationale: „Braut“ ist im Griechischen impliziert und macht den Vergleich im Deutschen verständlich; das Brautgemach bleibt als kulturelles Bild erhalten.
- source_word: ἐν μίτρᾳ δὲ ἦν ἡ κατακάλυψις αὐτῆς
  choice: ihre Kopfbedeckung war wie ein Turban
  rationale: μίτρα bezeichnet eine gewundene Kopfbedeckung; „wie“ wahrt angesichts der ungewohnten Konstruktion und der sachlichen Unsicherheit angemessene Zurückhaltung.
theological_decisions: []
