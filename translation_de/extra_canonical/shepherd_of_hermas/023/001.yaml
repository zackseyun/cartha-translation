  to: Nachdem das Tier an mir vorübergegangen war und ich etwa dreißig Fuß weitergegangen war, siehe, da kam mir eine Jungfrau entgegen. Sie war geschmückt wie eine, die aus einem Brautgemach hervortritt, ganz in Weiß gekleidet und mit weißen Sandalen. Sie war bis zur Stirn verhüllt; ihre Verhüllung bestand aus einer Mitra, und ihr Haar war weiß.
