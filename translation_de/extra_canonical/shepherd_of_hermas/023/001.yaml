review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird gut getroffen. Die explizite Bezeichnung der Jungfrau als „Braut“ geht jedoch über den griechischen Wortlaut hinaus: Das Partizip beschreibt sie als geschmückt, „wie [eine], die aus einem Brautgemach hervortritt“. Zudem ist μίτρα nicht nur einem Turban ähnlich, sondern bezeichnet hier die konkrete Art ihrer Verhüllung bzw. Kopfbedeckung.'
  naturalness: Die Sprache ist klar, modern und dem visionären Erzählton angemessen. Die behutsame Umstellung im letzten Satz macht die Beschreibung idiomatisch, ohne den knappen Charakter des Originals zu verlieren.
  terminology: „Tier“, „Jungfrau“, „Brautgemach“, „Sandalen“ und „verhüllt“ sind passende Wiedergaben. „Mitra“ ist als genaue, nicht unnötig spezifizierende Bezeichnung für μίτρα vorzuziehen; eine kurze Erklärung ist im laufenden Text nicht erforderlich.
  issues:
  - severity: medium
    issue: „wie eine Braut, die aus dem Brautgemach kommt“
    rationale: Das griechische ὡς ἐκ νυμφῶνος ἐκπορευομένη nennt keine Braut. Die Ergänzung ist zwar naheliegend, legt das Bild aber stärker fest als der Wortlaut.
  - severity: medium
    issue: „ihre Kopfbedeckung war wie ein Turban“
    rationale: ἐν μίτρᾳ ἦν ἡ κατακάλυψις αὐτῆς besagt, dass ihre Verhüllung in einer Mitra bestand. Das eingefügte „wie“ schwächt die Aussage ohne textlichen Anlass ab.
  revised_text: Nachdem das Tier an mir vorübergegangen war und ich etwa dreißig Fuß weitergegangen war, siehe, da kam mir eine Jungfrau entgegen. Sie war geschmückt wie eine, die aus einem Brautgemach hervortritt, ganz in Weiß gekleidet und mit weißen Sandalen. Sie war bis zur Stirn verhüllt; ihre Verhüllung bestand aus einer Mitra, und ihr Haar war weiß.
