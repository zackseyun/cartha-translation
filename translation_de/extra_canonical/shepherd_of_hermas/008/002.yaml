  source_fidelity: 'Der Entwurf gibt den griechischen Text inhaltlich zuverlässig wieder: μετέπειτα, ἤδη, die Übergabe an die πρεσβύτεροι, die hinzuzufügenden ῥήματα und die Bekanntmachung an alle ἐκλεκτοί sind vollständig erfasst. Das Passiv von γνωρισθήσεται bleibt angemessen gewahrt.'
  naturalness: Die Formulierung „Ich verneinte“ ist im heutigen Standarddeutsch ohne ergänzten Infinitivsatz unvollständig bzw. stilistisch hart. „Ich verneinte, es gegeben zu haben“ entspricht dem griechischen ἠρνησάμην δεδωκέναι und ist idiomatisch. „Zu Ende gebracht“ ist für ἀποτελέσω τὰ ῥήματα etwas natürlicher als „alle Worte vollendet“, ohne den Sinn zu verändern.
  terminology: „die ältere Frau“ gibt ἡ πρεσβυτέρα neutral und kontextgerecht wieder. „Älteste“ ist hier als Gemeindebezeichnung passend. „alle Erwählten“ bewahrt die Terminologie von τοῖς ἐκλεκτοῖς πᾶσιν, ohne die Aussage lehrmäßig einzuengen.
