  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: de
  text: 2. Danach sah ich in meinem Haus eine Vision. Die ältere Frau kam und fragte mich, ob ich das Buch bereits den Ältesten gegeben hätte. Ich verneinte, es gegeben zu haben. »Das hast du gut gemacht«, sagte sie, »denn ich habe noch Worte hinzuzufügen. Wenn ich dann alle Worte zu Ende gebracht habe, werden sie durch dich allen Erwählten bekannt gemacht werden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέπειτα
  choice: Danach
  rationale: Gibt die zeitliche Fortsetzung schlicht und natürlich wieder.
- source_word: ἡ πρεσβυτέρα
  choice: die ältere Frau
  rationale: Bewahrt die Bezeichnung aus dem Kontext und vermeidet die im Deutschen abwertend klingende Formulierung „die alte Frau“.
- source_word: τὸ βιβλίον
  choice: das Buch
  rationale: Entspricht dem griechischen Ausdruck und hält die Verbindung zu dem zuvor genannten Schriftstück aufrecht.
- source_word: τοῖς πρεσβυτέροις
  choice: den Ältesten
  rationale: Bezeichnet hier die leitenden Ältesten der Gemeinde, wie Vers 3 ausdrücklich erkennen lässt.
- source_word: ῥήματα
  choice: Worte
  rationale: Gibt den Plural formal wieder, ohne ihn vorschnell als Botschaften oder Aussprüche zu deuten.
- source_word: τοῖς ἐκλεκτοῖς πᾶσιν
  choice: allen Erwählten
  rationale: Bewahrt den religiös geprägten Ausdruck und die umfassende Stellung von πᾶσιν.
theological_decisions:
- issue: Bedeutung von „Erwählte“
  choice: allen Erwählten
  alternative: allen Auserwählten
  rationale: „Erwählten“ ist verständlich und wahrt die theologische Offenheit des griechischen ἐκλεκτοί, ohne eine bestimmte Lehre von Erwählung einzutragen.
- issue: Passivform γνωρισθήσεται
  choice: werden sie durch dich ... bekannt gemacht werden
  alternative: wirst du sie ... bekannt machen
  rationale: Die Passivform bleibt erhalten; dadurch wird nicht ausdrücklich festgelegt, wer letztlich als Handelnder hinter der Bekanntmachung steht.
translation_notes:
  register: Natürliche, würdige Standardsprache. Die direkte Rede ist flüssig gestaltet, während Wiederholungen und theologisch bedeutsame Passivformen des griechischen Textes weitgehend erhalten bleiben.
