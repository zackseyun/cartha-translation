  to: 3. »Du sollst nun zwei kleine Büchlein schreiben und eines an Klemens und eines an Grapte schicken. Klemens wird es dann an die Städte außerhalb senden, denn dies ist ihm anvertraut. Grapte aber wird die Witwen und die Waisen ermahnen. Du aber sollst es in dieser Stadt zusammen mit den Ältesten vorlesen, die der Gemeinde vorstehen.«
  rationale: Die Revision entfernt nicht belegte Ergänzungen, lässt den anaphorischen Singular („es“) wie im griechischen Text stehen und gibt βιβλαρίδια materialneutral wieder. Die Aufgaben, Zukunftsformen und lokale Gemeindeleitung bleiben erhalten.
