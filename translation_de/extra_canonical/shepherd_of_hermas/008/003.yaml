  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: de
  text: 3. »Du sollst nun zwei kleine Büchlein schreiben und eines an Klemens und eines an Grapte schicken. Klemens wird es dann an die Städte außerhalb senden, denn dies ist ihm anvertraut. Grapte aber wird die Witwen und die Waisen ermahnen. Du aber sollst es in dieser Stadt zusammen mit den Ältesten vorlesen, die der Gemeinde vorstehen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδια
  choice: kleine Schriftrollen
  rationale: Das Diminutiv bezeichnet kleine Schriftstücke bzw. Büchlein; „Schriftrollen“ vermittelt die antike materielle Form natürlicher als das moderne „Büchlein“.
- source_word: τὰς ἔξω πόλεις
  choice: die auswärtigen Städte
  rationale: Bewahrt den räumlichen Gegensatz zur unmittelbar danach genannten „dieser Stadt“, ohne unnötig „im Ausland“ zu suggerieren.
- source_word: νουθετήσει
  choice: soll ... ermahnen
  rationale: Gibt den Sinn von anleitendem, zurechtweisendem Zuspruch wieder und erhält den imperativischen Zukunftston.
- source_word: ἀναγνωσῇ
  choice: sollst ... öffentlich vorlesen
  rationale: ἀναγινώσκω bedeutet im Kontext eines Textes und der versammelten Gemeindeleitung das laute Vorlesen; „öffentlich“ macht die kommunikative Funktion idiomatisch deutlich.
- source_word: πρεσβυτέρων τῶν προϊσταμένων
  choice: Ältesten, die der Gemeinde vorstehen
  rationale: Unterscheidet die Amtsbezeichnung πρεσβύτεροι von ihrer leitenden Tätigkeit προΐσταμαι und vermeidet konfessionell engere Titel.
- source_word: ἐκκλησίας
  choice: Gemeinde
  rationale: Im lokalen Kontext bezeichnet ἐκκλησία die konkrete christliche Versammlung bzw. Ortsgemeinde.
theological_decisions:
- issue: Art der Beauftragung Klemens’
  choice: denn das ist ihm anvertraut
  alternative: denn er ist dazu bevollmächtigt
  rationale: ἐπιτέτραπται bezeichnet eine übertragene Aufgabe oder Verantwortung; „anvertraut“ wahrt dies, ohne ein genaueres kirchliches Amt zu behaupten.
- issue: Adressaten von Graptes Dienst
  choice: die Witwen und die Waisen
  alternative: Witwen und Waisenkinder
  rationale: Die substantivierten griechischen Bezeichnungen werden formal bewahrt; der Text legt Alter und Geschlecht der Waisen nicht näher fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die Satzfolge und die wiederholten Gegenüberstellungen von Klemens, Grapte und Hermas bleiben sichtbar. „Abschrift“ ist bei Klemens ergänzt, um idiomatisch zu verdeutlichen, dass von den zwei angefertigten Exemplaren eines weiterverbreitet wird; der Referenzbezug des griechischen Singulars bleibt dabei sachlich erhalten.
