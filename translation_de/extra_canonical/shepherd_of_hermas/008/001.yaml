revisions:
- from: 'Mir aber wurde, Brüder, im Schlaf durch einen überaus ansehnlichen jungen Mann eine Offenbarung zuteil. Er sagte zu mir: »Für wen hältst du die ältere Frau, von der du das Büchlein erhalten hast?« Ich sagte: »Für die Sibylle.« »Du irrst dich«, sagte er, »sie ist es nicht.« »Wer ist sie dann?«, fragte ich. »Die Gemeinde«, sagte er. Ich fragte ihn: »Warum ist sie dann so alt?« »Weil sie als Erste von allem erschaffen wurde«, sagte er. »Darum ist sie alt, und ihretwegen wurde die Welt geordnet.«'
  to: 'Mir wurde aber, Brüder, im Schlaf durch einen überaus schönen jungen Mann etwas offenbart. Er sagte zu mir: »Wer, meinst du, ist die alte Frau, von der du das Büchlein erhalten hast?« Ich sagte: »Die Sibylle.« Er sagte: »Du irrst dich; sie ist es nicht.« Ich fragte: »Wer ist sie denn?« Er sagte: »Die Gemeinde.« Ich sagte zu ihm: »Warum ist sie also alt?« Er sagte: »Weil sie vor allem anderen erschaffen wurde. Deshalb ist sie alt, und ihretwegen wurde die Welt geordnet.«'
  rationale: Die Revision glättet die deutsche Satzführung, gibt den Superlativ εὐειδεστάτου direkter wieder und macht die Wiederaufnahme von πρεσβυτέρα im Dialog konsistent. »Vor allem anderen« verdeutlicht den Vorrang von πάντων πρώτη. Die Übersetzung bewahrt sowohl die personifizierte Gemeinde als auch die auffällige Aussage ihrer Erschaffung und die kausale/finale Wendung διὰ ταύτην, ohne sie theologisch aufzulösen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:40Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Inhalt von §1 im Wesentlichen zuverlässig wieder. Die Formulierung »als Erste von allem« ist im Deutschen jedoch syntaktisch und semantisch weniger klar als das griechische πάντων πρώτη („vor allem anderen / als Erste von allen Dingen“).
  naturalness: Die Sprache ist überwiegend natürlich und würdig. »Für wen hältst du die ältere Frau?« ist idiomatisch, aber πρεσβυτέρα wird im anschließenden Dialog ausdrücklich mit „alt“ erklärt; eine konsistentere Wiedergabe als „alte Frau“ ist hier vorzuziehen. Die Verschachtelung des ersten Satzes lässt sich glatter gestalten.
  terminology: »Sibylle«, »Büchlein« und die personifizierte »Gemeinde« sind angemessen. »Überaus ansehnlich« ist möglich, aber für εὐειδεστάτου trifft »überaus schön« die Aussage über die auffallende äußere Erscheinung unmittelbarer. Die ungewöhnliche Aussage über die vor aller Schöpfung erschaffene Gemeinde und die Beziehung der Welt zu ihr bleibt ohne dogmatische Harmonisierung erhalten.
  issues:
  - severity: medium
    issue: Inkonsistente und abgeschwächte Wiedergabe von πρεσβυτέρα
    rationale: Die Übersetzung wechselt von »ältere Frau« zu »so alt«, obwohl der Text gerade die Bezeichnung und ihr Alter begründet. »die alte Frau« / »Warum ist sie also alt?« erhält die Wiederaufnahme klarer.
  - severity: low
    issue: Unklare deutsche Fügung »als Erste von allem«
    rationale: Diese Formulierung kann missverständlich wirken. »vor allem anderen« gibt πάντων πρώτη idiomatischer und präziser wieder, ohne den Vorrang abzuschwächen.
  - severity: low
    issue: εὐειδεστάτου wird etwas zurückhaltend wiedergegeben
    rationale: »Ansehnlich« kann auch bloß respektabel bedeuten. »Überaus schön« bildet den Superlativ der ansprechenden äußeren Erscheinung deutlicher ab.
