base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: de
  text: 'Mir wurde aber, Brüder, im Schlaf durch einen überaus schönen jungen Mann etwas offenbart. Er sagte zu mir: »Wer, meinst du, ist die alte Frau, von der du das Büchlein erhalten hast?« Ich sagte: »Die Sibylle.« Er sagte: »Du irrst dich; sie ist es nicht.« Ich fragte: »Wer ist sie denn?« Er sagte: »Die Gemeinde.« Ich sagte zu ihm: »Warum ist sie also alt?« Er sagte: »Weil sie vor allem anderen erschaffen wurde. Deshalb ist sie alt, und ihretwegen wurde die Welt geordnet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκαλύφθη
  choice: wurde … eine Offenbarung zuteil
  rationale: Gibt den Offenbarungscharakter des Passivs natürlich und würdevoll wieder, ohne eine bestimmte Art von Vision über den griechischen Wortlaut hinaus festzulegen.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Entspricht der direkten Anrede im griechischen Maskulinum plural und wahrt den frühchristlichen Sprachgebrauch.
- source_word: νεανίσκου εὐειδεστάτου
  choice: überaus ansehnlichen jungen Mann
  rationale: Der Superlativ bezeichnet eine besonders ansprechende oder schöne Erscheinung; »ansehnlich« klingt im Deutschen würdig und bezieht sich klar auf das Äußere.
- source_word: πρεσβυτέραν
  choice: ältere Frau / alt
  rationale: Im ersten Auftreten bezeichnet das substantivierte Femininum die ältere Frau; die anschließende Frage und Begründung sprechen ausdrücklich von ihrem Alter.
- source_word: βιβλίδιον
  choice: Büchlein
  rationale: Bewahrt das Diminutiv des griechischen Ausdrucks.
- source_word: Σίβυλλαν
  choice: Sibylle
  rationale: Übliche deutsche Form der antiken prophetischen Gestalt.
- source_word: Ἐκκλησία
  choice: Gemeinde
  rationale: Gibt ἐκκλησία als versammelte Glaubensgemeinschaft verständlich wieder und bewahrt zugleich ihre Personifikation als Frau.
- source_word: πάντων πρώτη ἐκτίσθη
  choice: als Erste von allem erschaffen wurde
  rationale: Bewahrt sowohl den zeitlichen Vorrang als auch die ungewöhnliche Aussage, dass die Gemeinde erschaffen wurde.
- source_word: διὰ ταύτην
  choice: ihretwegen
  rationale: Gibt die kausale Bedeutung »um ihretwillen / ihretwegen« knapp wieder, ohne sie abzuschwächen.
- source_word: ὁ κόσμος κατηρτίσθη
  choice: die Welt wurde geordnet
  rationale: καταρτίζω kann einrichten, zurichten oder ordnen bedeuten. »Geordnet« wahrt den Unterschied zu ἐκτίσθη, »erschaffen wurde«, im vorangehenden Satz.
theological_decisions:
- issue: Präexistenz beziehungsweise ursprüngliche Erschaffung der Ἐκκλησία
  choice: »sie als Erste von allem erschaffen wurde«
  alternative: »sie vor allem anderen erschaffen wurde«
  rationale: Die Übersetzung lässt die auffällige Aussage des Textes stehen und deutet sie weder als bloßen göttlichen Plan noch als Aussage über eine konkrete historische Institution um.
- issue: Zweckbeziehung zwischen Gemeinde und Welt
  choice: »ihretwegen wurde die Welt geordnet«
  alternative: »um ihretwillen wurde die Welt geschaffen«
  rationale: »Ihretwegen« erhält die theologische Spannung der final-kausalen Wendung; »geordnet« bildet κατηρτίσθη ab, ohne es mit dem zuvor verwendeten Schöpfungsverb gleichzusetzen.
- issue: Wiedergabe von Ἐκκλησία
  choice: »die Gemeinde«
  alternative: »die Kirche«
  rationale: »Gemeinde« ist im modernen Deutsch unmittelbar verständlich und vermeidet, dem frühchristlichen Text spätere institutionelle oder konfessionelle Nebenbedeutungen aufzudrängen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Dialogführung. Die Wiederholungen von »sagte ich / sagte er« bleiben weitgehend erhalten, da sie den schlichten Erzählstil des griechischen Textes prägen. Der eingereichte Abschnitt folgt dem angegebenen reader_segment 1 und übersetzt daher nur §1, nicht die ebenfalls im parent_section_source enthaltenen §§2–3.
