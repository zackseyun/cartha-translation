base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: de
  text: 'Den Heiligen Geist, der präexistent war und die ganze Schöpfung erschuf, ließ Gott in dem Fleisch wohnen, das er wollte. Dieses Fleisch nun, in dem der Heilige Geist wohnte, diente dem Geist gut: Es führte ein ehrbares und reines Leben und befleckte den Geist in keiner Weise. Weil es also gut und rein gelebt, gemeinsam mit dem Geist Mühe auf sich genommen und in allem mitgewirkt hatte, weil es sich stark und mutig verhalten hatte, erwählte er es zu einem Partner mit dem Heiligen Geist. Denn der Lebenswandel dieses Fleisches gefiel [dem Herrn],[a] weil es sich auf der Erde nicht befleckt hatte, während es den Heiligen Geist in sich hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „dem Herrn“ ist in der griechischen Textüberlieferung unsicher.
    reason: Die herangezogene Edition setzt τῷ Κυρίῳ in eckige Klammern und kennzeichnet die Lesart damit als textkritisch unsicher.
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἅγιον τὸ προόν
  choice: den Heiligen Geist, der schon vorher da war
  rationale: Gibt προόν verständlich als Präexistenz wieder, ohne über den griechischen Ausdruck hinaus eine genauere zeitliche oder dogmatische Bestimmung einzutragen.
- source_word: κατῴκισεν ... εἰς σάρκα
  choice: ließ ... in dem Fleisch wohnen
  rationale: Bewahrt die kausative Aussage und das konkrete Bild des Wohnens; „Fleisch“ bleibt wegen seiner theologischen und argumentativen Bedeutung erhalten.
- source_word: ἐδούλευσε τῷ πνεύματι καλῶς
  choice: diente dem Geist treu
  rationale: „Dienen“ bildet δουλεύω ab; „treu“ vermittelt καλῶς im Kontext natürlichen deutschen Sprachgebrauchs.
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα
  choice: Es führte ein ehrbares und reines Leben
  rationale: Gibt das idiomatische Bild des Wandelns als Lebensführung wieder; σεμνότης wird hier als ehrbares Verhalten verstanden.
- source_word: συγκοπιάσασαν τῷ πνεύματι
  choice: gemeinsam mit dem Geist Mühe auf sich genommen
  rationale: Erhält sowohl das gemeinsame Handeln als auch den Aspekt anstrengender Mühe.
- source_word: κοινωνόν
  choice: zum Teilhaber
  rationale: Bewahrt die offene Bedeutung einer gewährten Teilhabe oder Gemeinschaft, ohne sie als Gleichrangigkeit oder bloße Mitarbeit festzulegen.
- source_word: ἡ πορεία τῆς σαρκὸς ταύτης
  choice: der Lebenswandel dieses Fleisches
  rationale: „Lebenswandel“ gibt πορεία im ethischen Sinn wieder und hält zugleich die wiederholte Bezeichnung „Fleisch“ fest.
theological_decisions:
- issue: Verhältnis von Heiligem Geist und Fleisch
  choice: Die grammatische Unterscheidung zwischen dem präexistenten Geist und dem Fleisch, in dem er wohnt, wird konsequent beibehalten.
  alternative: Die Aussagen ausdrücklich christologisch als Inkarnation des Sohnes formulieren.
  rationale: Der griechische Text spricht an dieser Stelle ausdrücklich vom Heiligen Geist und vom Fleisch. Seine ungewöhnliche und theologisch spannungsreiche Ausdrucksweise darf nicht durch eine spätere dogmatische Terminologie ersetzt werden.
- issue: Subjekt von εἵλατο
  choice: Das im Griechischen unausgesprochene Subjekt bleibt im Deutschen als „er“ stehen und wird nicht namentlich festgelegt.
  alternative: „Gott erwählte es“ oder „der Herr erwählte es“.
  rationale: Der Kontext legt Gott beziehungsweise den Herrn nahe, doch der Satz selbst nennt das Subjekt nicht ausdrücklich. Die Übersetzung wahrt diese begrenzte Mehrdeutigkeit.
- issue: Textkritische Lesart τῷ Κυρίῳ
  choice: „dem Herrn“ wird im Text in eckigen Klammern wiedergegeben und mit einer Fußnote erklärt.
  alternative: Ohne Kennzeichnung „Gott“ oder „dem Herrn“ lesen oder die Worte auslassen.
  rationale: Die Ausgangsedition kennzeichnet τῷ Κυρίῳ als textkritisch unsicher. Die Klammern bewahren Transparenz, während der Satz verständlich bleibt.
- issue: Personifizierung des Fleisches
  choice: Das Fleisch wird als handelnd, dienend und erwählt dargestellt.
  alternative: Die Aussagen auf einen ausdrücklich genannten Menschen oder Leib umformulieren.
  rationale: Diese auffällige Personifizierung gehört zur Argumentation des Textes und sollte nicht geglättet oder dogmatisch aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Begriffe „Heiliger Geist“ und „Fleisch“ bleiben wegen ihrer argumentativen Bedeutung erhalten. Lange griechische Partizipialgefüge sind behutsam in finite deutsche Sätze aufgelöst, ohne die Reihenfolge der Begründung oder die theologische Spannung zu beseitigen.
