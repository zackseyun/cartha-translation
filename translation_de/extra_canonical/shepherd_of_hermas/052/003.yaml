revisions:
- from: 'Den Heiligen Geist, der schon vorher da war und die ganze Schöpfung erschaffen hatte, ließ Gott in dem Fleisch wohnen, das er erwählt hatte. Dieses Fleisch nun, in dem der Heilige Geist wohnte, diente dem Geist treu: Es führte ein ehrbares und reines Leben und befleckte den Geist in keiner Weise. Weil es also gut und rein gelebt, gemeinsam mit dem Geist Mühe auf sich genommen und in allem mitgewirkt hatte, weil es sich stark und mutig bewährt hatte, erwählte er es zusammen mit dem Heiligen Geist zum Teilhaber. Denn der Lebenswandel dieses Fleisches gefiel [dem Herrn],[a] weil es sich auf der Erde nicht befleckt hatte, während es den Heiligen Geist in sich trug.'
  to: 'Den Heiligen Geist, der präexistent war und die ganze Schöpfung erschuf, ließ Gott in dem Fleisch wohnen, das er wollte. Dieses Fleisch nun, in dem der Heilige Geist wohnte, diente dem Geist gut: Es führte ein ehrbares und reines Leben und befleckte den Geist in keiner Weise. Weil es also gut und rein gelebt, gemeinsam mit dem Geist Mühe auf sich genommen und in allem mitgewirkt hatte, weil es sich stark und mutig verhalten hatte, erwählte er es zu einem Partner mit dem Heiligen Geist. Denn der Lebenswandel dieses Fleisches gefiel [dem Herrn],[a] weil es sich auf der Erde nicht befleckt hatte, während es den Heiligen Geist in sich hatte.'
  rationale: Die Revision unterscheidet das von Gott gewollte Fleisch (ἠβούλετο) vom anschließenden Erwählen dieses Fleisches (εἵλατο). Sie verdeutlicht außerdem, dass das Fleisch als Partner des Heiligen Geistes erwählt wird, ohne das nicht ausdrücklich genannte Subjekt von εἵλατο dogmatisch festzulegen. Die textkritische Unsicherheit von [dem Herrn] bleibt transparent markiert.
  reviewer_model: gpt-5.6-terra
