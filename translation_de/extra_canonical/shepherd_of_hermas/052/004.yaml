base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: de
  text: Darum nahm er den Sohn und die herrlichen Engel zu Ratgebern, damit auch dieses Fleisch, das dem Geist untadelig gedient hatte, einen Ort zum Wohnen erhielte und nicht den Anschein erweckte, den Lohn für seinen Dienst verloren zu haben. Denn jedes Fleisch, das unbefleckt und makellos befunden wird und in dem der Heilige Geist gewohnt hat, wird Lohn empfangen. Damit hast du auch die Deutung dieses Gleichnisses.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ... τὸν υἱὸν ... καὶ τοὺς ἀγγέλους
  choice: den Sohn und die herrlichen Engel zu Ratgebern
  rationale: Bewahrt das Beratungsbild und gibt die im Griechischen sinngemäß auf mehrere Personen bezogene Bezeichnung im deutschen Plural wieder.
- source_word: ἡ σὰρξ αὕτη
  choice: dieses Fleisch
  rationale: Die wörtliche Wiedergabe wahrt den argumentativen Gegensatz zwischen Fleisch und Geist; »Leib« würde diese auffällige Terminologie abschwächen.
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: einen Ort zum Wohnen
  rationale: Gibt die Vorstellung eines Wohn- oder Aufenthaltsortes natürlich wieder, ohne die Art dieses Ortes näher festzulegen.
- source_word: μισθὸν τῆς δουλείας αὐτῆς
  choice: den Lohn für seinen Dienst
  rationale: »Dienst« vermittelt δουλεία hier verständlich; das Possessivpronomen bezieht sich im Deutschen auf das grammatisch sächliche »Fleisch«.
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: unbefleckt und makellos
  rationale: Erhält die beiden nahezu synonymen Reinheitsbezeichnungen des Ausgangstextes.
- source_word: ἐπίλυσιν
  choice: Deutung
  rationale: Im Zusammenhang der Gleichnisauslegung ist »Deutung« natürlicher und präziser als »Auflösung«.
theological_decisions:
- issue: Verhältnis von Gott, dem Sohn, den Engeln, dem Fleisch und dem Heiligen Geist
  choice: Die verschiedenen Größen bleiben entsprechend dem griechischen Text ausdrücklich unterschieden.
  alternative: Die Bezüge christologisch oder trinitätstheologisch harmonisieren und »Fleisch« etwa unmittelbar mit »Sohn« gleichsetzen.
  rationale: Die ungewöhnliche und theologisch spannungsreiche Darstellung des Hermas darf nicht durch spätere Lehrbegriffe oder konfessionelle Deutungen stillschweigend geglättet werden.
- issue: Der verheißene Wohnort und Lohn
  choice: »einen Ort zum Wohnen« und »Lohn empfangen« bleiben unbestimmt.
  alternative: Den Ort ausdrücklich als Himmel, ewige Wohnung oder besondere Erhöhung deuten.
  rationale: Der Ausgangstext legt weder die genaue Art des Ortes noch die konkrete Gestalt des Lohnes fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Fleisch-Geist-Terminologie. Die Satzstruktur wurde leicht gegliedert, die argumentativen Verknüpfungen und die genuine theologische Spannung des griechischen Textes bleiben erhalten.
