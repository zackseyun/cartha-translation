base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: de
  text: 'Er sagt: »Ich habe dir doch eben gesagt, dass du gerissen und eigensinnig bist, der du nach den Deutungen der Gleichnisse fragst. Weil du aber so hartnäckig bist, werde ich dir das Gleichnis vom Acker und die übrigen Dinge, nach denen du mich fragst,[a] deuten. Er vertraute sie den Engeln an, damit diese sie bewahrten; und er selbst reinigte sie von ihren Sünden, indem er sich sehr abmühte und viele Strapazen ertrug. Denn niemand kann umgraben, ohne Mühe und Anstrengung.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorliegende normalisierte OCR-Vorlage ist hier beschädigt. Der ergänzte Wortlaut folgt dem naheliegenden überlieferten Zusammenhang: Gemeint sind die weiteren Dinge, nach denen Hermas fragt.'
    reason: Kennzeichnet die Beschädigung der bereitgestellten Vorlage, ohne die „übrigen Dinge“ als Bestandteile des Ackergleichnisses zu bestimmen.
lexical_decisions:
- source_word: πανοῦργος
  choice: gerissen
  rationale: Gibt die tadelnde Bedeutung von Klugheit bzw. Verschlagenheit wieder, ohne das stärkere moderne Wort „hinterlistig“ aufzudrängen.
- source_word: αὐθάδης
  choice: eigensinnig
  rationale: Bezeichnet hier eine selbstbestimmte, schwer nachgiebige Haltung; „eigensinnig“ ist verständlich und passt zum vorwurfsvollen Ton.
- source_word: ἐπιλύσεις
  choice: Deutungen
  rationale: Im Zusammenhang mit Gleichnissen geht es um deren erklärende Auslegung, nicht bloß um eine wörtliche „Auflösung“.
- source_word: παράμονος
  choice: hartnäckig
  rationale: Bewahrt sowohl den Gedanken beharrlichen Drängens als auch den leicht tadelnden Unterton.
- source_word: συντηρεῖν
  choice: bewahrten
  rationale: Deckt das Hüten, Erhalten und Beschützen durch die Engel ab.
- source_word: ἐκαθάρισε
  choice: reinigte
  rationale: Bewahrt die kultisch-moralische Bildsprache des griechischen Verbs im Zusammenhang mit Sünden.
- source_word: σκαφεῦσαι
  choice: umgraben
  rationale: Gibt die konkrete landwirtschaftliche Tätigkeit im Bild des Ackers natürlich wieder.
theological_decisions:
- issue: Bezug der Pronomen in „Er vertraute sie den Engeln an“
  choice: Die Pronomen bleiben wie in der überlieferten Passage stehen.
  alternative: Die gemeinten Personen ausdrücklich als „das Volk“ benennen.
  rationale: Der vorgelegte Textausschnitt setzt einen Bezug aus dem weiteren Kontext voraus. Eine ausdrückliche Identifikation würde die im Segment vorhandene Anknüpfung interpretierend ergänzen.
- issue: Reinigung von Sünden
  choice: „reinigte sie von ihren Sünden“
  alternative: „tilgte ihre Sünden“ oder „reinigte ihre Sünden“
  rationale: Die Formulierung bewahrt das Reinigungsmotiv und ist zugleich in modernem Deutsch idiomatisch, ohne eine bestimmte Sühnetheorie einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede und der wiederholte Vorwurf des Sprechers bleiben deutlich; unnötig altertümliche Wendungen wurden vermieden.
