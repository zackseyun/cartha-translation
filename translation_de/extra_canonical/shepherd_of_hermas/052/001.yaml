revisions:
- from: 'Er sagt: »Ich habe dir doch gerade gesagt, dass du gerissen und eigensinnig bist, weil du immer wieder nach den Deutungen der Gleichnisse fragst. Weil du aber so hartnäckig bist, werde ich dir das Gleichnis vom Acker und von den übrigen Dingen[a] deuten. Er vertraute sie den Engeln an, damit diese sie bewahrten; und er selbst reinigte sie von ihren Sünden, wobei er sich sehr abmühte und viele Mühen auf sich nahm. Denn niemand kann umgraben, ohne sich abzumühen und anzustrengen.«'
  to: 'Er sagt: »Ich habe dir doch eben gesagt, dass du gerissen und eigensinnig bist, der du nach den Deutungen der Gleichnisse fragst. Weil du aber so hartnäckig bist, werde ich dir das Gleichnis vom Acker und die übrigen Dinge, nach denen du mich fragst,[a] deuten. Er vertraute sie den Engeln an, damit diese sie bewahrten; und er selbst reinigte sie von ihren Sünden, indem er sich sehr abmühte und viele Strapazen ertrug. Denn niemand kann umgraben, ohne Mühe und Anstrengung.«'
  rationale: Die Revision berücksichtigt die textkritisch erkennbare Lücke, ohne die Sache der „übrigen Dinge“ interpretierend einzugrenzen. Sie glättet außerdem zwei kleine stilistische bzw. syntaktische Punkte und bewahrt den vorwurfsvollen, erzählerischen Ton des griechischen Textes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:05:44Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den erhaltenen Text im Wesentlichen treffend wieder. Der Übergang nach „τῶν λοιπῶν“ ist in der OCR-Vorlage zwar beschädigt, doch die Fortsetzung „He entrusted them …“ setzt sehr wahrscheinlich die im überlieferten Text fehlenden Wörter „ὧν σύ μοι ἐρωτᾷς“ („nach denen du mich fragst“) voraus. Daher darf „den übrigen Dingen“ nicht als Bestandteil des Gleichnisses konkretisiert werden. Außerdem ist die deutsche Verbindung mit „weil“ leicht kausal missverständlich; das Partizip bezeichnet das wiederholte Fragen.
  naturalness: Modernes, flüssiges Deutsch. „umgraben“ ist für σκαφεῦσαι passend. „viele Mühen auf sich nahm“ neben „sich sehr abmühte“ ist allerdings etwas redundant; „viele Strapazen ertrug“ bildet ἠντληκώς klarer ab.
  terminology: „gerissen“, „eigensinnig“, „Deutungen“, „hartnäckig“, „bewahrten“ und „reinigte sie von ihren Sünden“ sind angemessen. „Bestandteile des Gleichnisses“ in der Fußnote ist zu spezifisch und sollte durch eine neutralere Kennzeichnung der Textlücke ersetzt werden.
  issues:
  - severity: medium
    issue: Die Ergänzung „von den übrigen Dingen“ und die Fußnote „Bestandteilen des Gleichnisses“ konkretisieren den beschädigten Text über das Erhaltene hinaus.
    rationale: Die übliche Fortsetzung lautet wahrscheinlich „und der übrigen [Dinge], nach denen du mich fragst“; die „übrigen“ sind somit nicht zwingend Teile des gerade genannten Gleichnisses. Die Ungewissheit sollte neutral markiert werden.
  - severity: low
    issue: „weil du immer wieder … fragst“ verschiebt die partizipiale Konstruktion leicht in eine Kausalbegründung.
    rationale: ἐπερωτῶν beschreibt das insistierende Fragen als nähere Charakterisierung. „der du immer wieder … fragst“ ist näher am Satzbau und vermeidet die mögliche Kausalnuance.
  - severity: low
    issue: „viele Mühen auf sich nahm“ wiederholt „sich sehr abmühte“.
    rationale: πολλοὺς κόπους ἠντληκώς bezeichnet das Ertragen bzw. Durchstehen vieler Mühen; „viele Strapazen ertrug“ ist idiomatischer und differenzierter.
