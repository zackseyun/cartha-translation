  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/002.yaml
  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the servant—listen.
translation:
  language: de
  text: 'Nachdem er also die Sünden des Volkes gereinigt hatte, zeigte er ihnen die Wege des Lebens und gab ihnen das Gesetz, das er von seinem Vater empfangen hatte. »Du siehst«, sagt er, »dass er selbst der Herr des Volkes ist, denn er hat alle Vollmacht von seinem Vater empfangen. Und höre nun: Der Herr zog seinen Sohn und die herrlichen Engel über das Erbe des Knechtes zu Rate.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσας
  choice: gereinigt hatte
  rationale: Gibt den vorausgehenden Aoristpartizipialsatz natürlich wieder und bewahrt das Bild der Reinigung von Sünden.
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: die Wege des Lebens
  rationale: Eine geläufige, würdevolle Wiedergabe des metaphorischen Ausdrucks; der Plural bleibt erhalten.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Entspricht dem bestimmten griechischen Ausdruck, ohne seine genaue heilsgeschichtliche Einordnung näher festzulegen.
- source_word: ἐξουσίαν πᾶσαν
  choice: alle Vollmacht
  rationale: Vollmacht bezeichnet hier übertragene Herrschaftsbefugnis treffender als bloße Macht.
- source_word: τοὺς ἐνδόξους ἀγγέλους
  choice: die herrlichen Engel
  rationale: Bewahrt die wertende Bedeutung von ἐνδόξους in natürlichem, gehobenem Deutsch.
- source_word: σύμβουλον ἔλαβε
  choice: zu Ratgebern nahm
  rationale: Gibt die beratende Rolle direkt wieder; der deutsche Plural folgt den beiden genannten Gruppen beziehungsweise Personen.
- source_word: κληρονομίας τοῦ δούλου
  choice: des Erbes des Knechtes
  rationale: Bewahrt die Genitivfügung und legt nicht vorschnell fest, ob das dem Knecht bestimmte Erbe oder ein anderer Bezug gemeint ist.
theological_decisions:
- issue: Bezeichnung des Handelnden als κύριος des Volkes
  choice: der Herr des Volkes
  alternative: Gebieter des Volkes
  rationale: Herr wahrt die titulare und theologische Tragweite von κύριος, ohne über den Wortlaut hinaus eine genauere Identifikation einzutragen.
- issue: Verhältnis von Sohn, Engeln und Herr im Rat über das Erbe
  choice: wörtlich als Beratungsszene wiedergegeben
  alternative: als bloße Zustimmung oder richterliche Versammlung paraphrasieren
  rationale: Der Text spricht ausdrücklich vom Nehmen des Sohnes und der Engel als Ratgeber; die eigentümliche theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton. Direkte Rede und emphatisches αὐτός werden bewahrt; unnötige dogmatische Präzisierungen werden vermieden.
