  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: de
  text: '„Hör also“, sagt er, „du Unverständiger, wie die Traurigkeit den Heiligen Geist zermürbt und wiederum rettet. Wenn ein innerlich zerrissener Mensch etwas in Angriff nimmt und wegen seiner inneren Zerrissenheit damit scheitert, dringt diese Traurigkeit in ihn ein, betrübt den Heiligen Geist und zermürbt ihn. Wenn sich dann wiederum der Jähzorn wegen irgendeiner Sache an einen Menschen heftet und dieser äußerst verbittert wird, dringt die Traurigkeit erneut in das Herz des jähzornig gewordenen Menschen ein. Er ist über seine Tat betrübt und kehrt um, weil er Böses getan hat. Diese Traurigkeit scheint also Rettung zu bringen, weil der Mensch umgekehrt ist, nachdem er Böses getan hat. Somit betrüben beide Vorgänge den Geist: die innere Zerrissenheit, weil sie ihr Vorhaben nicht verwirklicht hat, und der Jähzorn, weil er Böses getan hat. Beide sind also für den Heiligen Geist schmerzlich: die innere Zerrissenheit und der Jähzorn. Entferne daher die Traurigkeit aus dir und bedränge nicht
    den Heiligen Geist, der in dir wohnt, damit er sich nicht an Gott wendet[a] und von dir weicht. Denn der Geist Gottes, der diesem Fleisch gegeben wurde, erträgt weder Traurigkeit noch Bedrängnis.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei Gott Klage erhebt“. Das griechische Verb bezeichnet hier ein Sichwenden an Gott; ob ausdrücklich eine Klage gegen den Menschen gemeint ist, bleibt unausgesprochen.'
    reason: Bewahrt die lexikalische und kontextuelle Mehrdeutigkeit von ἐντεύξηται, ohne im Haupttext eine nicht ausdrücklich genannte Richtung der Eingabe festzulegen.
lexical_decisions:
- source_word: ἀνόητε
  choice: du Unverständiger
  rationale: Gibt die direkte Zurechtweisung würdevoll und verständlich wieder, ohne die im heutigen Deutsch unnötig grobe Wirkung von „du Narr“ oder „du Dummkopf“.
- source_word: ἡ λύπη
  choice: die Traurigkeit
  rationale: Bewahrt den wiederkehrenden Leitbegriff. Je nach Zusammenhang umfasst er auch Kummer oder Gram, doch ein einheitlicher Ausdruck macht die Argumentationslinie sichtbar.
- source_word: ἐκτρίβει
  choice: zermürbt
  rationale: Gibt das intensive Bild des Aufreibens bzw. Verschleißens wieder, ohne es zur stärkeren Aussage „vernichtet“ zu verschärfen.
- source_word: δίψυχος / διψυχία
  choice: innerlich zerrissener Mensch / innere Zerrissenheit
  rationale: Vermittelt das Bild des Geteiltseins zwischen verschiedenen Haltungen natürlicher als das wörtliche, aber ungebräuchliche „doppelseelig“ und legt den Begriff nicht einseitig auf bloßen Zweifel fest.
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet treffend eine rasch aufflammende, anhaltend verbitternde Zornesneigung und ist im modernen Standarddeutsch klar verständlich.
- source_word: μετανοεῖν
  choice: umkehren
  rationale: Erfasst die sittliche Sinnes- und Verhaltensänderung stärker als bloßes Bedauern; der Zusammenhang nennt ausdrücklich die böse Tat als Anlass.
- source_word: στενοχωρία
  choice: Bedrängnis
  rationale: Bewahrt die Vorstellung innerer Enge und Belastung und unterscheidet den Ausdruck von der zuvor wiederholten „Traurigkeit“.
theological_decisions:
- issue: Die Traurigkeit als zugleich schädlich und rettend
  choice: Die paradoxe Aussage „zermürbt und andererseits rettet“ bleibt bestehen.
  alternative: Zwischen einer schlechten und einer heilsamen Art von Traurigkeit ausdrücklich unterscheiden.
  rationale: Der griechische Text entfaltet die Unterscheidung erst im Folgenden und formuliert zunächst bewusst zugespitzt; sie sollte nicht bereits in der Übersetzung systematisiert werden.
- issue: Bezug von πνεῦμα
  choice: „Heiliger Geist“ bzw. „Geist Gottes“ entsprechend den ausdrücklichen griechischen Bezeichnungen
  alternative: Den Ausdruck als menschlichen Geist oder als bloße geistliche Gesinnung deuten.
  rationale: Der Text selbst nennt τὸ πνεῦμα τὸ ἅγιον und τὸ πνεῦμα τοῦ θεοῦ; eine weitergehende dogmatische Bestimmung wird nicht hinzugefügt.
- issue: Warnung, der Geist könne von dem Menschen weichen
  choice: Die Aussage wird ohne dogmatische Abschwächung wiedergegeben.
  alternative: Sie hypothetisch umdeuten oder durch eine lehrmäßige Erklärung begrenzen.
  rationale: Die Spannung gehört zur Mahnung des Ausgangstextes und darf nicht durch eine konfessionelle Vorentscheidung beseitigt werden.
- issue: ἐντεύξηται τῷ θεῷ
  choice: „sich an Gott wendet“ mit erläuternder Fußnote
  alternative: „bei Gott gegen dich Klage erhebt“ oder „bei Gott für dich eintritt“
  rationale: Das Verb bezeichnet das Herantreten bzw. Sichwenden mit einer Bitte oder Eingabe; ein ausdrücklich gegen den Menschen gerichtetes Klagen steht nicht im griechischen Wortlaut, ist im warnenden Kontext aber möglich.
translation_notes:
  register: Moderne, würdige Standardsprache mit deutlich hörbarer Mahnrede. Die Wiederholungen von „Traurigkeit“, „Geist“, „innere Zerrissenheit“ und „Jähzorn“ wurden als tragende Elemente der Argumentation weitgehend erhalten; schwerfällige griechische Wiederholungen wurden nur dort geglättet, wo der Bezug im Deutschen eindeutig bleibt.
