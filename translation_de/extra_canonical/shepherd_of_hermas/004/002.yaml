  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: de
  text: 'Dann rief sie mich zu sich, berührte meine Brust und sagte zu mir: »Hat dir mein Vorlesen gefallen?« Ich antwortete ihr: »Herrin, das Letzte gefällt mir, das Frühere aber ist schwierig und hart.« Da sagte sie zu mir: »Das Letzte ist für die Gerechten, das Frühere aber für die Völker und die Abtrünnigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: rief sie mich zu sich
  rationale: Gibt das mediale Präsens idiomatisch und mit der Bewegung auf die Sprecherin zu wieder.
- source_word: τοῦ στήθους μου
  choice: meine Brust
  rationale: Konkrete Wiedergabe von στῆθος; vermeidet die anatomisch engere Bedeutung »Brustkorb«.
- source_word: ἡ ἀνάγνωσίς μου
  choice: meine Lesung
  rationale: Bewahrt den Bezug auf das zuvor erfolgte Vorlesen; »Lesung« passt zum würdevollen Erzählregister.
- source_word: τὰ ἔσχατα / τὰ πρότερα
  choice: diese letzten Worte / die vorigen
  rationale: Das substantivierte Neutrum bezeichnet hier die zuletzt beziehungsweise zuvor verlesenen Inhalte. »Worte« macht den Bezug im Deutschen klar, ohne den Inhalt näher festzulegen.
- source_word: χαλεπὰ καὶ σκληρά
  choice: schwer und hart
  rationale: 'Erhält die doppelte Charakterisierung: schwer zu ertragen oder zu verstehen und zugleich streng beziehungsweise schroff.'
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Bewahrt die grundsätzlich mögliche kollektive Bedeutung von ἔθνη und vermeidet eine unnötig konfessionell gefärbte Festlegung auf »Heiden«.
- source_word: τοῖς ἀποστάταις
  choice: den Abtrünnigen
  rationale: Gibt Personen wieder, die abgefallen sind, ohne genauer festzulegen, wovon oder in welchem institutionellen Sinn.
theological_decisions:
- issue: Adressaten der beiden Teile der Lesung
  choice: »gelten den Gerechten … den Völkern und den Abtrünnigen«
  alternative: »sind für die Gerechten … für die Heiden und die Abgefallenen bestimmt«
  rationale: »Gelten« wahrt die knappe Zuordnung des griechischen Dativs, ohne ausdrücklich eine Vorherbestimmung oder ausschließliche Bestimmung zu behaupten.
- issue: Bedeutung von ἔθνη
  choice: Völker
  alternative: Heiden
  rationale: Der griechische Ausdruck kann nichtjüdische beziehungsweise nichtchristliche Menschen bezeichnen, bedeutet wörtlich jedoch »Völker«. Der weitere Kontext trägt eine religiöse Abgrenzung, verlangt hier aber keine terminologische Verengung.
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter Rede. Das historische Präsens des Griechischen wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben. Die respektvolle Anrede κυρία erscheint als »Herrin«.
