- from: 'Dann rief sie mich zu sich, berührte meine Brust und sagte zu mir: »Hat dir meine Lesung gefallen?« Ich antwortete ihr: »Herrin, diese letzten Worte gefallen mir, die vorigen aber sind schwer und hart.« Da sagte sie zu mir: »Diese letzten Worte gelten den Gerechten, die vorigen aber den Völkern und den Abtrünnigen.«'
  to: 'Dann rief sie mich zu sich, berührte meine Brust und sagte zu mir: »Hat dir mein Vorlesen gefallen?« Ich antwortete ihr: »Herrin, das Letzte gefällt mir, das Frühere aber ist schwierig und hart.« Da sagte sie zu mir: »Das Letzte ist für die Gerechten, das Frühere aber für die Völker und die Abtrünnigen.«'
  rationale: Die Revision beseitigt die zusätzliche Festlegung auf »Worte« und gibt die anaphorischen neutralen Pluralformen durch die im Deutschen natürliche, bewusst offene Gegenüberstellung »das Letzte / das Frühere« wieder. »Vorlesen« bildet den konkreten Vorgang der ἀνάγνωσις ab; die übrigen zentralen Begriffe und die knappe Zuordnung der beiden Textteile bleiben erhalten.
