base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: de
  text: 'Während sie mit mir redete, erschienen zwei Männer, hoben sie an den Ellbogen hoch und gingen mit ihr dorthin, wo auch der Stuhl war, nach Osten. Heiter ging sie fort, und als sie wegging, sagte sie zu mir: »Sei mutig, Hermas!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλούσης αὐτῆς μετʼ ἐμοῦ
  choice: Während sie mit mir redete
  rationale: Gibt die Genitivus-absolute-Konstruktion natürlich und zeitlich begleitend wieder.
- source_word: ἦραν αὐτὴν τῶν ἀγκώνων
  choice: fassten sie an den Armen
  rationale: Wörtliches »hoben sie an den Ellenbogen« wäre im Deutschen missverständlich; gemeint ist, dass die Männer sie an den Armen ergriffen und mitnahmen.
- source_word: ἱλαρά
  choice: fröhlich
  rationale: Bewahrt den sichtbaren Ausdruck heiterer, freudiger Stimmung ohne zusätzliche Deutung.
- source_word: Ἀνδρίζου
  choice: Sei mutig
  rationale: Das Imperativverb fordert zu Mut und Standhaftigkeit auf; die idiomatische deutsche Wiedergabe erhält diesen Zuspruch.
