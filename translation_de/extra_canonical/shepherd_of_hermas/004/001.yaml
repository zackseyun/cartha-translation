base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/001.yaml
  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: de
  text: Als sie nun zu Ende gelesen hatte und vom Stuhl aufgestanden war, kamen vier junge Männer, hoben den Stuhl auf und gingen damit nach Osten fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν ἀναγινώσκουσα
  choice: zu Ende gelesen hatte
  rationale: Gibt die aspektuelle Verbindung von ἐτέλεσεν mit dem Partizip natürlich und vollständig wieder.
- source_word: καθέδρα
  choice: Stuhl
  rationale: Bezeichnet hier den Sitz der lesenden Frau; „Stuhl“ ist im modernen Deutsch klarer und weniger institutionell als „Sitz“ oder „Lehrstuhl“.
- source_word: τέσσαρες νεανίαι
  choice: vier junge Männer
  rationale: νεανίαι bezeichnet männliche junge Personen; „junge Männer“ ist präziser als das heute oft altersmäßig engere „Jünglinge“.
- source_word: ἦραν
  choice: hoben ... auf
  rationale: Bewahrt den konkreten Vorgang des Aufhebens beziehungsweise Forttragens, ohne zusätzliche Einzelheiten einzutragen.
- source_word: πρὸς τὴν ἀνατολήν
  choice: nach Osten
  rationale: Gibt die Richtungsangabe idiomatisch und ohne unnötige Deutung wieder.
theological_decisions: []
translation_notes:
  register: Natürliche, würdige Standardsprache mit enger Bindung an den griechischen Satzbau. Das explizite „damit“ macht im Deutschen deutlich, dass die jungen Männer den Stuhl forttragen, ohne dem Ausgangstext inhaltlich etwas hinzuzufügen.
