  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: de
  text: 'Doch sie sagte: „Keineswegs betrifft diese Sache den Diener Gottes. Aber gewiss ist dir ein Gedanke über sie ins Herz gestiegen. Denn eine solche Absicht zieht für die Diener Gottes Sünde nach sich. Denn es ist eine böse und erschreckende Absicht, wenn ein durch und durch ehrwürdiger und bereits bewährter Geist nach einer bösen Tat verlangt – besonders Hermas, der Enthaltsame, der sich von jedem bösen Verlangen fernhält und voller Aufrichtigkeit und großer Arglosigkeit ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρᾶγμα τοῦτο
  choice: diese Sache
  rationale: Bewahrt die allgemeine und rückverweisende Formulierung des Griechischen, ohne den Gegenstand enger festzulegen.
- source_word: βουλή
  choice: Absicht
  rationale: Bezeichnet hier mehr als einen flüchtigen Gedanken, nämlich eine innere Willensregung beziehungsweise ein Vorhaben.
- source_word: ἔκπληκτος
  choice: erschreckend
  rationale: Gibt die ungewöhnliche, schockierende Beschaffenheit der Absicht in natürlichem Deutsch wieder.
- source_word: πάνσεμνον πνεῦμα
  choice: ein ganz ehrfürchtiger Geist
  rationale: σεμνός trägt den Sinn von ehrwürdig, ernst und sittlich achtbar; „ehrfürchtig“ wahrt den religiös-ethischen Ton.
- source_word: δεδοκιμασμένον
  choice: bewährt
  rationale: Drückt den Zustand nach erfolgter Prüfung aus, ohne näher zu bestimmen, durch wen oder wodurch geprüft wurde.
- source_word: ἐγκρατής
  choice: der Enthaltsame
  rationale: Bewahrt die Charakterisierung als jemand, der Selbstbeherrschung übt, und passt zur folgenden Aussage über das Meiden böser Begierde.
- source_word: ἁπλότης
  choice: Aufrichtigkeit
  rationale: Gibt die positive moralische Einfalt beziehungsweise Lauterkeit idiomatisch wieder und vermeidet den modernen negativen Klang von „Einfältigkeit“.
- source_word: ἀκακία
  choice: Arglosigkeit
  rationale: Bezeichnet das Freisein von Bosheit und schädlicher Absicht; „Arglosigkeit“ erhält diese Nuance.
theological_decisions:
- issue: Verhältnis zwischen innerer Absicht und Sünde
  choice: „Eine solche Absicht bringt ... Sünde mit sich“
  alternative: „Ein solcher Gedanke ist ... Sünde“
  rationale: Das Griechische ἁμαρτίαν ἐπιφέρουσα sagt wörtlich, dass die Absicht Sünde herbeiführt beziehungsweise mit sich bringt. Die Übersetzung vermeidet es, die genaue moraltheologische Beziehung stärker festzulegen als der Ausgangstext.
- issue: Bezug von πνεῦμα
  choice: „Geist“ als Bezeichnung der sittlich-religiösen Person beziehungsweise ihres Inneren
  alternative: „Mensch“ oder „Seele“
  rationale: Die wörtliche Wiedergabe wahrt die anthropologische Offenheit des Textes und importiert keine bestimmte Lehre über die Teile des Menschen.
- issue: Aussage „Keineswegs ...“ gegenüber dem eingeräumten Gedanken
  choice: Den spannungsvollen Wechsel unverändert stehen lassen
  alternative: Die erste Aussage als vollständige Entlastung oder als rhetorische Frage erklären
  rationale: Der Text verneint zunächst, dass „diese Sache“ den Diener Gottes trifft, räumt dann aber einen inneren Gedanken ein. Diese Spannung soll nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und gut vorlesbar; charakterisierende Bezeichnungen wie „der Enthaltsame“ bewahren den feierlich-paränetischen Ton des frühchristlichen Textes.
