  terminology: »Angerechnet«, »Gott ... versöhnen« und »mir gnädig sei« geben die jeweiligen Begriffe kontextgerecht wieder. Die Formulierungen legen keine besondere konfessionelle Sühnetheorie fest. Die Fußnote zu »vollendeten Sünden« erläutert die Schwierigkeit zurückhaltend und sinnvoll.
