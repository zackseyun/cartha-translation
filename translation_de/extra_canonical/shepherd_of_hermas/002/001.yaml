base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: de
  text: 'Nachdem sie diese Worte gesprochen hatte, wurden die Himmel verschlossen. Ich aber zitterte am ganzen Körper und war tief betrübt. Ich sagte mir: »Wenn mir diese Sünde angerechnet wird, wie kann ich dann gerettet werden? Wie soll ich Gott wegen meiner vollendeten Sünden[a] versöhnen? Mit welchen Worten soll ich den Herrn bitten, damit er mir gnädig sei?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »vollendeten Sünden«; gemeint sein können Sünden, die vollständig ausgeführt oder tatsächlich begangen wurden. Die griechische Formulierung ist ungewöhnlich.
    reason: Die Bedeutung von τελείων ist an dieser Stelle nicht eindeutig und soll nicht stillschweigend geglättet werden.
lexical_decisions:
- source_word: ἐκλείσθησαν οἱ οὐρανοί
  choice: die Himmel wurden verschlossen
  rationale: Bewahrt den griechischen Plural und die Passivform; die visionäre, biblisch geprägte Ausdrucksweise bleibt erhalten.
- source_word: ὅλος ἤμην πεφρικὼς καὶ λυπούμενος
  choice: ich aber zitterte am ganzen Körper und war tief betrübt
  rationale: Gibt ὅλος und den anhaltenden Zustand der beiden Partizipien in natürlichem modernem Deutsch wieder.
- source_word: ἀναγράφεται
  choice: angerechnet wird
  rationale: Das Verb bezeichnet hier das schriftliche Verzeichnen beziehungsweise das belastende Anrechnen einer Sünde.
- source_word: ἐξιλάσομαι τὸν Θεόν
  choice: Gott … versöhnen
  rationale: Bewahrt die transitive Konstruktion und den Gedanken, Gottes Gunst angesichts der Sünden zu suchen, ohne ihn konfessionell auszudeuten.
- source_word: ἵνα ἱλατευθῇ μοι
  choice: damit er mir gnädig sei
  rationale: Gibt die auf göttliche Huld und Vergebung zielende Wendung idiomatisch wieder, ohne eine bestimmte Sühnetheorie einzutragen.
theological_decisions:
- issue: Bedeutung von τῶν ἁμαρτιῶν μου τῶν τελείων
  choice: meiner vollendeten Sünden[a]
  alternative: meiner vollständig begangenen Sünden / aller meiner Sünden
  rationale: Die ungewöhnliche griechische Formulierung wird im Haupttext eng bewahrt und wegen ihrer möglichen Bedeutungsbreite erläutert, statt die Spannung stillschweigend aufzulösen.
- issue: Verhältnis von ἐξιλάσομαι und ἱλατευθῇ
  choice: versöhnen … gnädig sei
  alternative: Sühne leisten … vergeben werde
  rationale: Die Übersetzung hält die auf Gott gerichtete Bitte um Gnade fest, ohne aus den beiden verwandten Verben eine ausgearbeitete dogmatische Sührelehre abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionär-biblischem Ton. Die direkte Rede ist klar gegliedert; ungewöhnliche Quellensprache wird nur dort geglättet, wo der Sinn dadurch nicht vereindeutigt wird.
