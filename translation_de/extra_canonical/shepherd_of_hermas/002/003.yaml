base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: de
  text: 'Und sie sagte zu mir: »Warum bist du so düster, Hermas – du, der du geduldig und nicht streitsüchtig bist und immer lachst? Warum siehst du so niedergeschlagen aus und bist nicht heiter?« Ich antwortete ihr: »Weil eine überaus gute Frau behauptet, ich hätte gegen sie gesündigt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: finster
  rationale: Gibt die düstere, bedrückte Gemütslage knapp und natürlich wieder; die anschließende Frage entfaltet den sichtbaren Niedergeschlagenheitsaspekt.
- source_word: μακρόθυμος
  choice: geduldig
  rationale: Bezeichnet hier Hermas’ bekannte Langmut; „geduldig“ ist im modernen Deutsch unmittelbar verständlich.
- source_word: ἀστομάχητος
  choice: nicht streitsüchtig
  rationale: Das seltene Wort bezeichnet jemanden, der keinen Streit sucht; die verneinte Form des Griechischen bleibt erhalten.
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: siehst du so niedergeschlagen aus
  rationale: Gibt die sichtbare, vom Gesicht beziehungsweise Erscheinungsbild ablesbare Niedergeschlagenheit idiomatisch wieder.
- source_word: γυναικὸς ἀγαθωτάτης
  choice: einer überaus guten Frau
  rationale: Bewahrt den Superlativ, ohne das mögliche moralische Werturteil durch „vortrefflich“ oder „edel“ unnötig zu spezifizieren.
- source_word: ἥμαρτον εἰς αὐτήν
  choice: ich hätte gegen sie gesündigt
  rationale: Bewahrt die religiös und moralisch gewichtige Sprache sowie den Bezug der Sünde auf die Frau.
theological_decisions:
- issue: Hermas’ Aussage über die gegen die Frau begangene Sünde
  choice: indirekte Rede mit „ich hätte gegen sie gesündigt“
  alternative: „ich habe gegen sie gesündigt“
  rationale: Im Deutschen kennzeichnet der Konjunktiv die von der Frau erhobene Aussage, ohne vorwegzunehmen, ob Hermas sie als objektiv erwiesen anerkennt; „gesündigt“ erhält die theologische Spannung.
translation_notes:
  register: Moderne, würdige Erzählprosa mit natürlicher direkter Rede. Die rhetorische Reihung der älteren Frau und der Kontrast zwischen Hermas’ gewohntem Wesen und seinem jetzigen Aussehen bleiben erhalten.
