base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: de
  text: 'Während ich dies erwog und in meinem Herzen abwog, sah ich vor mir einen großen weißen Sitz, der aus schneeweißer Wolle gefertigt war. Da kam eine alte Frau in überaus leuchtendem Gewand, die ein Buch in den Händen hielt. Sie setzte sich allein hin und grüßte mich: »Sei gegrüßt, Hermas!« Traurig und weinend erwiderte ich: »Sei gegrüßt, Herrin!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου
  choice: erwog
  rationale: Das Medium bezeichnet hier das innere Beraten beziehungsweise Überlegen; »erwog« ist natürlich und bewahrt den reflektierenden Sinn.
- source_word: διακρίνοντος
  choice: abwog
  rationale: Im Zusammenhang mit »im Herzen« meint das Verb ein prüfendes Unterscheiden oder Abwägen; die Wiedergabe hält es von dem vorausgehenden allgemeinen Erwägen unterscheidbar.
- source_word: καθέδραν
  choice: Sitz
  rationale: Das Wort kann einen Stuhl oder Sitz bezeichnen. »Sitz« vermeidet eine unnötig spezifische Form und klingt im visionären Zusammenhang würdig.
- source_word: ἐξ ἐρίων χιονίνων γεγονυῖαν
  choice: aus schneeweißer Wolle gefertigt
  rationale: Gibt Material und Farbbild direkt wieder; »schneeweiß« bezieht sich idiomatisch auf die Wolle.
- source_word: γυνὴ πρεσβῦτις
  choice: eine alte Frau
  rationale: πρεσβῦτις bezeichnet eine ältere beziehungsweise alte Frau; die schlichte deutsche Form ist klar und ohne zusätzliche Wertung.
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: in überaus leuchtendem Gewand
  rationale: Der Superlativ von λαμπρός wird verstärkend wiedergegeben; »Gewand« passt zum würdigen visionären Register.
- source_word: ἀσπάζεταί με / χαῖρε
  choice: grüßte mich / Sei gegrüßt
  rationale: Bewahrt sowohl die erzählende Grußhandlung als auch die direkte, formelhafte Anrede.
- source_word: Κυρία
  choice: Herrin
  rationale: Die respektvolle weibliche Anrede wird wörtlich und ohne konfessionelle Zusatzbedeutung wiedergegeben.
theological_decisions: []
