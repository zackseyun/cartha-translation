  text: 'But I, the angel of repentance, say to you: do not fear the devil. For I was sent," he says, "to be with you who are repenting with all your heart and to streng—'
translation:
  language: de
  text: '„Ich aber, der Engel der Umkehr, sage euch: Fürchtet den Teufel nicht. Denn ich wurde gesandt“, sagt er, „um bei euch, die ihr von ganzem Herzen umkehrt, zu sein und euch zu stär—“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: der Engel der Umkehr
  rationale: μετάνοια bezeichnet hier eine grundlegende Umkehr; die Formulierung bleibt zugleich natürlich und bewahrt den frühchristlichen Titel.
- source_word: μὴ φοβήθητε τὸν διάβολον
  choice: Fürchtet den Teufel nicht
  rationale: Gibt den negierten Aoristimperativ klar und würdig wieder, ohne zusätzliche Nuancierung.
- source_word: τῶν μετανοούντων
  choice: die ihr … umkehrt
  rationale: Das Partizip Präsens bezeichnet Menschen, die Umkehr vollziehen; die deutsche Relativkonstruktion ist verständlich und erhält den Handlungscharakter.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: von ganzem Herzen
  rationale: Natürliche deutsche Wiedergabe des semitisch geprägten Ausdrucks für ungeteilte innere Hingabe.
- source_word: ἰσχυρο-
  choice: zu stär—
  rationale: Die Quelle bricht mitten im Wort ab; der erkennbare Wortansatz wird entsprechend unvollständig wiedergegeben, ohne den Folgetext zu ergänzen.
theological_decisions:
- issue: Bedeutung von μετάνοια
  choice: Umkehr
  alternative: Buße
  rationale: „Umkehr“ bildet die innere und praktische Neuausrichtung breiter ab und vermeidet eine mögliche Verengung auf Reue oder kirchliche Bußpraxis.
- issue: Sprecherwechsel bei φησί
  choice: „sagt er“ als eingeschobene Redeeinleitung
  alternative: Auslassung oder Vereinheitlichung in direkter Rede
  rationale: Der griechische Text enthält den Einschub ausdrücklich; seine Beibehaltung wahrt die literarische Spannung zwischen Erzähler und Engelsrede.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der abrupte Abbruch der überlieferten Texteinheit wird sichtbar bewahrt; es wird kein fehlender Folgetext ergänzt.
