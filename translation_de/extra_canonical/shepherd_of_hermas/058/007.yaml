base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: de
  text: Es gibt aber auch Genüsse, die Menschen retten. Denn viele genießen es, Gutes zu tun, und lassen sich dabei von ihrer eigenen Freude leiten. Dieser Genuss ist für die Diener Gottes nützlich und verschafft einem solchen Menschen Leben. Die zuvor genannten schädlichen Genüsse dagegen verschaffen ihnen Qualen und Strafen; wenn sie aber darin verharren und nicht umkehren, ziehen sie sich selbst den Tod zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: Genüsse / Genuss
  rationale: Bewahrt die wiederholte Leitvokabel des Abschnitts und lässt sowohl schädliche als auch heilsame Formen zu; „Ausschweifungen“ wäre ausschließlich negativ und würde den Kontrast verfälschen.
- source_word: σώζουσαι
  choice: die Menschen retten
  rationale: Gibt die starke soteriologische Formulierung direkt wieder, ohne sie zu „förderlich sein“ abzuschwächen.
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: lassen sich von ihrer eigenen Freude leiten
  rationale: Natürliches Deutsch für das passive Bild des Getragen- bzw. Angetriebenwerdens durch die eigene Freude; im positiven Kontext ist „Freude“ treffender als das missverständliche „Lust“.
- source_word: σύμφορος
  choice: nützlich
  rationale: Entspricht dem Sinn von zuträglich oder vorteilhaft in klarer, moderner Sprache.
- source_word: περιποιεῖται
  choice: bringt … ein
  rationale: Erhält in allen drei Vorkommen den Gedanken, etwas für jemanden zu bewirken oder zu erwerben, und ermöglicht eine natürliche deutsche Formulierung.
- source_word: μετανοήσωσι
  choice: umkehren
  rationale: Bezeichnet eine grundlegende Sinnes- und Lebensänderung; „umkehren“ ist verständlich und wahrt den ethisch-religiösen Gehalt.
theological_decisions:
- issue: Verhältnis guter Werke zur Rettung
  choice: „Genüsse, die Menschen retten“ und „bringt … Leben“ werden ohne Abschwächung wiedergegeben.
  alternative: „heilsame Genüsse“ beziehungsweise „fördert das Leben“
  rationale: Der griechische Text verwendet σώζουσαι und ζωὴν περιποιεῖται ausdrücklich. Die Übersetzung bewahrt diese Spannung, ohne ein bestimmtes Lehrsystem zur Rolle guter Werke einzutragen.
- issue: Bedingtheit des Todesurteils
  choice: Der Tod folgt, wenn Menschen in den schädlichen Genüssen verharren und nicht umkehren.
  alternative: Eine Aussage über unabänderlichen oder bereits endgültig eingetretenen Tod
  rationale: Die Konditionalform ἐὰν … καὶ μὴ … wird beibehalten; der Text verbindet die Folge ausdrücklich mit Beharren und fehlender Umkehr.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie τρυφή wird konsequent mit „Genuss“ wiedergegeben, obwohl das Deutsche den positiven und negativen Sinn weniger selbstverständlich verbindet; der jeweilige Kontext klärt die Wertung. Keine Fußnoten erforderlich.
