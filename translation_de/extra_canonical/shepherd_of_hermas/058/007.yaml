  - severity: low
    issue: Unidiomatische Schlussformulierung
    rationale: „bringen sie sich selbst den Tod ein“ ist zwar verständlich, aber keine natürliche moderne deutsche Wendung für ἑαυτοῖς περιποιοῦνται. „ziehen sie sich selbst den Tod zu“ bewahrt die Selbstverursachung und liest sich idiomatisch.
  - severity: low
    issue: Die eigene Freude als Antrieb kann expliziter hervortreten
    rationale: „finden Freude daran“ ist möglich, doch τῇ ἑαυτῶν ἡδονῇ φερόμενοι beschreibt ausdrücklich, dass sie von ihrem eigenen Vergnügen bzw. ihrer Freude getragen oder geleitet werden. Eine leichte Umstellung bewahrt dies klarer.
  revised_text: Es gibt aber auch Genüsse, die Menschen retten. Denn viele genießen es, Gutes zu tun, und lassen sich dabei von ihrer eigenen Freude leiten. Dieser Genuss ist für die Diener Gottes nützlich und verschafft einem solchen Menschen Leben. Die zuvor genannten schädlichen Genüsse dagegen verschaffen ihnen Qualen und Strafen; wenn sie aber darin verharren und nicht umkehren, ziehen sie sich selbst den Tod zu.
