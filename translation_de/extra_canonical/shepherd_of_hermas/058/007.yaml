revisions:
- from: Es gibt aber auch Genüsse, die Menschen retten. Denn viele finden Freude daran, Gutes zu tun, und lassen sich von ihrer eigenen Freude leiten. Ein solcher Genuss ist für die Diener Gottes nützlich und bringt einem solchen Menschen Leben. Die zuvor genannten schädlichen Genüsse dagegen bringen ihnen Qualen und Strafen ein; wenn sie aber darin verharren und nicht umkehren, bringen sie sich selbst den Tod ein.
  to: Es gibt aber auch Genüsse, die Menschen retten. Denn viele genießen es, Gutes zu tun, und lassen sich dabei von ihrer eigenen Freude leiten. Dieser Genuss ist für die Diener Gottes nützlich und verschafft einem solchen Menschen Leben. Die zuvor genannten schädlichen Genüsse dagegen verschaffen ihnen Qualen und Strafen; wenn sie aber darin verharren und nicht umkehren, ziehen sie sich selbst den Tod zu.
  rationale: 'Die Revision beschränkt sich auf zwei stilistisch und semantisch sichere Verbesserungen: Die motivierende eigene Freude wird näher am griechischen Partizipialausdruck formuliert, und die Schlusswendung wird idiomatisches modernes Deutsch. Die wiederholte Leitvokabel „Genuss“, die starke Aussage vom Retten und Leben sowie die Bedingung von Beharren und fehlender Umkehr bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
