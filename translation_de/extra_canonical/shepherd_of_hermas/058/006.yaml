revisions:
- from: 'Er sagt: »Jede Handlung ist für einen Menschen ein Genuss, wenn er sie mit Vergnügen tut. Denn auch der Jähzornige gibt seiner eigenen Leidenschaft nach Herzenslust nach und genießt es; ebenso geben der Ehebrecher, der Trinker, der Verleumder, der Lügner, der Habgierige, der Betrüger und jeder, der Ähnliches tut, ihrer eigenen Krankheit nach Herzenslust nach. So genießen sie ihr Tun. Alle diese Genüsse sind für die Diener Gottes schädlich. Wegen dieser Täuschungen leiden also diejenigen, die bestraft und gequält werden.«'
  to: 'Er sagt: »Jede Handlung ist für einen Menschen ein Genuss, wenn er sie mit Vergnügen tut. Denn auch der Jähzornige gibt seiner eigenen Leidenschaft freien Lauf und genießt es; ebenso geben der Ehebrecher, der Trinker, der Verleumder, der Lügner, der Habgierige, der Betrüger und jeder, der Ähnliches tut, ihrer eigenen Krankheit freien Lauf. So genießen sie ihr Tun. Alle diese Genüsse sind für die Diener Gottes schädlich. Wegen dieser Täuschungen leiden also diejenigen, die bestraft und gequält werden.«'
  rationale: Die Revision beschränkt sich auf die idiomatische und genauere Wiedergabe der Wendung τὸ ἱκανὸν ποιεῖν. Der metaphorische Ausdruck »Krankheit«, die wiederkehrende Genuss-Terminologie und die offene kausale Aussage über Leiden, Bestrafung und Qual bleiben erhalten.
