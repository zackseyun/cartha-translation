base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the servants of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: de
  text: 'Er sagt: »Jede Handlung ist für einen Menschen ein Genuss, wenn er sie mit Vergnügen tut. Denn auch der Jähzornige gibt seiner eigenen Leidenschaft freien Lauf und genießt es; ebenso geben der Ehebrecher, der Trinker, der Verleumder, der Lügner, der Habgierige, der Betrüger und jeder, der Ähnliches tut, ihrer eigenen Krankheit freien Lauf. So genießen sie ihr Tun. Alle diese Genüsse sind für die Diener Gottes schädlich. Wegen dieser Täuschungen leiden also diejenigen, die bestraft und gequält werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: Genuss / genießen
  rationale: Das Wort bezeichnet hier ein lustvolles Sich-Hingeben, nicht nur Luxus. »Genuss« hält den Zusammenhang zwischen Freude am Tun und schädlicher Ausschweifung verständlich fest.
- source_word: ὀξύχολος
  choice: der Jähzornige
  rationale: Bezeichnet einen Menschen, der schnell und heftig zornig wird.
- source_word: κατάλαλος
  choice: der Verleumder
  rationale: Gibt das schädigende Reden über andere in einer geläufigen deutschen Personenbezeichnung wieder.
- source_word: πλεονέκτης
  choice: der Habgierige
  rationale: Bewahrt den moralischen Sinn ungezügelten Mehr-haben-Wollens.
- source_word: ἀποστερητής
  choice: der Betrüger
  rationale: Bezeichnet jemanden, der anderen vorenthält oder wegnimmt, was ihnen zusteht; »Betrüger« ist hier die natürliche knappe Wiedergabe.
- source_word: ἀπάτας
  choice: Täuschungen
  rationale: Bewahrt die Verbindung zur zuvor behandelten ἀπάτη und lässt offen, ob die Täuschung als Selbsttäuschung, Verführung oder trügerischer Genuss verstanden wird.
- source_word: βάσανος / βασανίζω
  choice: Qual / gequält werden
  rationale: Gibt die starke Sprache des Leidens wieder, ohne unnötig auf eine bestimmte Form körperlicher Folter festzulegen.
theological_decisions:
- issue: Verhältnis von lustvollem Tun, Strafe und Qual
  choice: 'Die kausale Aussage des Textes bleibt unmittelbar stehen: Wegen dieser Täuschungen leiden die Bestraften und Gequälten.'
  alternative: Die Aussage ausdrücklich als göttliches Gericht oder als natürliche Folge der Sünde deuten.
  rationale: Der griechische Text benennt an dieser Stelle nicht ausdrücklich den Handelnden oder den Mechanismus der Bestrafung; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie τρυφή/τρυφᾷ wird durch »Genuss/genießen« sichtbar gehalten. Der parallele Aufbau der Lasterliste bleibt erhalten; beim Wechsel vom einzelnen Beispielsfall zur zusammenfassenden Gruppe wird im Deutschen der Plural verwendet.
