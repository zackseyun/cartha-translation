base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: de
  text: »Denn, Herr, ich habe überhaupt nicht verstanden, was mit der Dauer der Täuschung, des Genusses und der Qual gemeint ist. Erkläre es mir noch deutlicher«, sagte ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπάτης
  choice: Täuschung
  rationale: Bewahrt die Mehrdeutigkeit zwischen Täuschen und Getäuschtwerden, ohne den Begriff vorschnell als bloße Verführung oder Selbsttäuschung festzulegen.
- source_word: τρυφῆς
  choice: Genuss
  rationale: Der weite Begriff passt zum späteren Gegensatz zwischen schädlichem und heilsamem Genuss; „Schwelgerei“ wäre hier zu einseitig negativ.
- source_word: βασάνου
  choice: Qual
  rationale: Gibt das konkrete Erleiden schmerzhafter Pein natürlich und prägnant wieder.
- source_word: τηλαυγέστερόν μοι δήλωσον
  choice: erkläre es mir deutlicher
  rationale: Natürliches modernes Deutsch für die Bitte, den zuvor unklar gebliebenen Zusammenhang klarer darzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede κύριε wird als „Herr“ wiedergegeben. Die eingeschobene Redeeinleitung φημί erscheint idiomatisch als „sagte ich“; „was es mit … auf sich hat“ verdeutlicht den Bezug von περὶ, ohne die Aussage inhaltlich aufzulösen.
