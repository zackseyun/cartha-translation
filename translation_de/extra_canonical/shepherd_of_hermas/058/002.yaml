  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: de
  text: 'Er antwortete mir und sagte: „Deine Torheit ist hartnäckig, und du willst weder dein Herz reinigen noch Gott dienen. Hüte dich“, sagte er,[a] „dass nicht die Zeit erfüllt wird und du als töricht befunden wirst. Höre also“, sagte er,[b] „wie du es wünschst, damit du dies alles verstehst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „sagte er“ sind im griechischen Text an dieser Stelle textkritisch unsicher.
    reason: Die Vorlage setzt φησί in eckige Klammern und kennzeichnet damit textliche Unsicherheit.
  - marker: b
    text: Auch dieses „sagte er“ ist im griechischen Text textkritisch unsicher.
    reason: Die Vorlage setzt das zweite φησί ebenfalls in eckige Klammern; der Marker macht diese Unsicherheit für die Leserschaft sichtbar.
lexical_decisions:
- source_word: ἀφροσύνη
  choice: Torheit
  rationale: Gibt die moralisch-geistliche Unvernunft des griechischen Ausdrucks wieder und bewahrt die Verbindung zu ἄφρων („töricht“).
- source_word: παράμονος
  choice: hartnäckig
  rationale: Bezeichnet hier etwas beharrlich Fortdauerndes; „hartnäckig“ klingt im Deutschen natürlich und bewahrt den tadelnden Ton.
- source_word: βλέπε
  choice: Hüte dich
  rationale: Der Imperativ warnt vor einer drohenden Gefahr; „Hüte dich“ gibt diese Funktion treffender wieder als das wörtlichere „Sieh“.
- source_word: ὁ χρόνος πληρωθῇ
  choice: die Zeit erfüllt wird
  rationale: Bewahrt die passive Formulierung und ihre mögliche eschatologische Färbung, statt sie eindeutig als bloßes Ablaufen einer Frist zu deuten.
- source_word: ἄφρων εὑρεθῇς
  choice: als töricht befunden wirst
  rationale: Folgt der passiven griechischen Wendung und lässt offen, durch wen oder bei welchem Anlass dieses Urteil festgestellt wird.
- source_word: καθὼς βούλει
  choice: wie du es wünschst
  rationale: Bezieht sich natürlich auf die zuvor erbetene deutlichere Erklärung, ohne den knappen griechischen Ausdruck auszudeuten.
- source_word: αὐτά
  choice: dies alles
  rationale: Gibt den pluralischen Rückverweis auf die besprochenen Zusammenhänge idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der erfüllten Zeit
  choice: „dass nicht die Zeit erfüllt wird“
  alternative: „bevor die Zeit abläuft“
  rationale: Die Übersetzung wahrt die genuine Offenheit zwischen dem Ende einer gewährten Frist und einer stärker eschatologisch verstandenen Vollendung der Zeit.
- issue: Passiv in „als töricht befunden werden“
  choice: Das unbestimmte Passiv bleibt erhalten.
  alternative: „und Gott dich für töricht erklärt“
  rationale: Der griechische Text nennt den Urteilenden nicht ausdrücklich; eine Ergänzung Gottes würde die Aussage theologisch stärker festlegen als die Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die leicht biblisch geprägten Formulierungen „die Zeit erfüllt wird“ und „als töricht befunden wirst“ wurden bewusst beibehalten, weil sie Form und Deutungsspielraum des Griechischen tragen.
