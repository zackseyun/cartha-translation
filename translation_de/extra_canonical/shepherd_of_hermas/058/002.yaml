revisions:
- from: 'Er antwortete mir: „Deine Torheit ist hartnäckig, und du willst dein Herz nicht reinigen und Gott dienen. Hüte dich“, sagte er,[a] „dass nicht die Zeit erfüllt wird und du als töricht befunden wirst. Höre also“, sagte er,[b] „wie du es wünschst, damit du dies alles verstehst.“'
  to: 'Er antwortete mir und sagte: „Deine Torheit ist hartnäckig, und du willst weder dein Herz reinigen noch Gott dienen. Hüte dich“, sagte er,[a] „dass nicht die Zeit erfüllt wird und du als töricht befunden wirst. Höre also“, sagte er,[b] „wie du es wünschst, damit du dies alles verstehst.“'
  rationale: 'Die Änderung dient ausschließlich der deutschen Eindeutigkeit der von οὐ θέλεις regierten Infinitivreihe: Beide Handlungen sind im griechischen Text Gegenstand des Nichtwollens. „Er antwortete mir und sagte“ bildet ἀποκριθείς μοι λέγει etwas vollständiger ab als „Er antwortete mir“. Alle textkritischen Markierungen und die Offenheit der Formulierung von der „erfüllten Zeit“ bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:05:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft den überlieferten griechischen Text insgesamt sehr genau: παράμονος ist mit „hartnäckig“ angemessen wiedergegeben, die Infinitive „das Herz reinigen und Gott dienen“ sind erhalten, ebenso die Warnung βλέπε μήποτε, das unbestimmte Passiv in „als töricht befunden wirst“ und der Zwecksatz. Die beiden eingeklammerten φησί werden zutreffend durch Fußnoten als textkritisch unsicher ausgewiesen. Eine kleine syntaktische Anpassung ist ratsam: Das griechische σου steht bei καρδίαν und verlangt im Deutschen die natürlichere Stellung „dein Herz nicht reinigen willst“, nicht „nicht reinigen und Gott dienen“ mit der möglichen, wenn auch schwachen Lesart, dass das Nichtwollen beide Infinitive umfasse. Zudem steht das zweite φησί unmittelbar nach „also“ und ist am besten ohne unnötige Wiederholung des Subjekts als Einschub gesetzt.'
  naturalness: Das Register ist würdig, modern verständlich und für die direkte Rede passend. „Hüte dich“ ist eine natürliche, nachdrückliche Wiedergabe des Warnimperativs. „Die Zeit erfüllt wird“ bewahrt bewusst die prägnante, leicht traditionssprachliche Formel und ist hier vertretbar. Mit der geänderten Wortstellung wird der Satzfluss klarer.
  terminology: „Torheit“ und „töricht“ geben die Wortfamilie ἀφροσύνη / ἄφρων nachvollziehbar wieder. „Gott“ entspricht τῷ Θεῷ. „Als töricht befunden wirst“ erhält das unbestimmte Passiv, ohne einen Urteilenden hinzuzufügen. Die textkritischen Fußnoten sind sachlich und an den richtigen Einschüben verankert.
  issues:
  - severity: low
    issue: Stellung der Negation bei den koordinierten Infinitiven
    rationale: „du willst dein Herz nicht reinigen und Gott dienen“ kann im Deutschen kurz so gelesen werden, als richte sich „nicht“ auch auf „Gott dienen“. „du willst dein Herz nicht reinigen und willst Gott nicht dienen“ wäre eindeutig, aber der griechische Satz hat nur ein οὐ θέλεις vor der Infinitivgruppe. Die Formulierung „du willst weder dein Herz reinigen noch Gott dienen“ macht die durch οὐ θέλεις regierte Koordination klar und natürlich.
