base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: de
  text: Wer sich einen einzigen Tag lang Genüssen hingibt, sich täuschen lässt und tut, was er will, hat sich in große Torheit gekleidet und erkennt nicht, was er da tut. Denn am nächsten Tag hat er schon vergessen, was er am Vortag getan hat. Genuss und Täuschung haben nämlich kein Gedächtnis, weil er sich in Torheit gekleidet hat. Wenn aber Strafe und Qual auch nur einen Tag lang an einem Menschen haften, wird er bis zu einem Jahr bestraft und gequält; denn Strafe und Qual haben ein langes Gedächtnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: sich Genüssen hingeben / Genuss
  rationale: Gibt die lustvolle Selbstverwöhnung im unmittelbaren negativen Zusammenhang natürlich wieder, ohne den Begriff vorschnell auf eine bestimmte Sünde einzuengen.
- source_word: ἀπατώμενος / ἀπάτη
  choice: sich täuschen lassen / Täuschung
  rationale: Bewahrt die passive beziehungsweise mediale Offenheit des Griechischen und vermeidet die unbelegte Festlegung darauf, wer täuscht.
- source_word: πολλὴν ἀφροσύνην ἐνδέδυται
  choice: hat sich in große Torheit gekleidet
  rationale: Erhält das auffällige Bild des Ankleidens und den perfektischen Sinn des griechischen Verbs.
- source_word: οὐ νοεῖ τὴν πρᾶξιν ἣν ποιεῖ
  choice: erkennt nicht, was er da tut
  rationale: Natürliches modernes Deutsch, das den Sinn mangelnder Einsicht in das eigene Handeln wiedergibt.
- source_word: μνήμας οὐκ ἔχει / μνήμας μεγάλας ἔχει
  choice: hat kein Gedächtnis / hat ein langes Gedächtnis
  rationale: Bewahrt die Personifikation und den Kontrast; „langes Gedächtnis“ vermittelt die anhaltende Erinnerungswirkung idiomatisch.
- source_word: μέχρις ἐνιαυτοῦ
  choice: bis zu einem Jahr
  rationale: Erhält die zeitliche Obergrenze des Ausdrucks, statt sie zu „ein ganzes Jahr“ zu verstärken.
theological_decisions:
- issue: Verhältnis zwischen eintägigem Genuss und lang anhaltender Strafe
  choice: Die zeitliche Gegenüberstellung wird ohne Erklärung oder Abschwächung wiedergegeben.
  alternative: Das Jahr ausdrücklich als symbolische oder proportional bemessene Vergeltung deuten.
  rationale: Der griechische Text erläutert hier die Relation bildhaft, legt aber keine dogmatische Theorie über Dauer oder Art der Strafe fest.
- issue: Urheber der Täuschung
  choice: „sich täuschen lässt“ lässt offen, ob die Täuschung von außen kommt oder mit Selbsttäuschung verbunden ist.
  alternative: „sich selbst täuscht“ oder „vom Teufel getäuscht wird“.
  rationale: ἀπατώμενος nennt in diesem Satz keinen Handelnden; eine nähere Bestimmung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Bildsprache. Die wiederholten Leitwörter Genuss, Täuschung, Torheit, Strafe und Qual bleiben erhalten, damit der argumentative Gegensatz des Abschnitts sichtbar bleibt.
