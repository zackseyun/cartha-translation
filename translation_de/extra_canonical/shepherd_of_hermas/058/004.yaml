base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: de
  text: Während er also das ganze Jahr hindurch gequält und bestraft wird, erinnert er sich dann an den Genuss und die Täuschung und erkennt, dass er ihretwegen Schlimmes erleidet. So wird jeder Mensch gequält, der sich dem Genuss hingibt und getäuscht wird; denn obwohl sie Leben haben, haben sie sich selbst dem Tod ausgeliefert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασανιζόμενος
  choice: gequält wird
  rationale: Gibt die fortdauernde leidvolle Wirkung von βασανίζω klar und würdig wieder.
- source_word: τιμωρούμενος
  choice: bestraft wird
  rationale: Bewahrt neben der Qual ausdrücklich den Aspekt der Strafe.
- source_word: τρυφῆς
  choice: Genuss
  rationale: Bezeichnet hier selbstgefälligen bzw. schädlichen Genuss; „Genuss“ hält den Anschluss an den weiteren Kontext offen, in dem auch nützlicher Genuss erwähnt wird.
- source_word: ἀπάτης
  choice: Täuschung
  rationale: Bewahrt die mögliche Doppelrichtung des griechischen Begriffs zwischen Täuschung und Verblendung, ohne sie enger festzulegen.
- source_word: πάσχει τὰ πονηρά
  choice: Schlimmes erleidet
  rationale: Natürliches Deutsch, das die substantivierte Pluralform τὰ πονηρά nicht unnötig als moralisch „Böses“ deutet.
- source_word: τρυφῶν
  choice: sich dem Genuss hingibt
  rationale: Drückt die aktive, fortgesetzte Hingabe an Genuss aus und vermeidet das im Deutschen missverständliche „schwelgen“.
- source_word: ἀπατώμενος
  choice: sich täuschen lässt
  rationale: Erhält die passive Form und lässt offen, wodurch oder von wem die Täuschung ausgeht.
- source_word: παραδεδώκασι
  choice: ausgeliefert haben
  rationale: Spiegelt die starke Übergabeformulierung und ihren resultativen Perfektcharakter.
theological_decisions:
- issue: Wechsel vom Singular πᾶς ... ὁ ... zum Plural ἔχοντες/ἑαυτούς
  choice: „jeder Mensch … weil solche Menschen …“
  alternative: „jeder Mensch … weil er …“
  rationale: Der griechische Text wechselt ausdrücklich vom distributiven Singular zum Plural. Die Übersetzung macht diesen Wechsel verständlich sichtbar, statt ihn stillschweigend zu glätten.
- issue: Bedeutung von ζωή und θάνατος
  choice: „Leben“ und „Tod“ ohne erklärenden Zusatz
  alternative: „ewiges Leben“ und „ewiger Tod“
  rationale: Der Ausgangstext setzt die Begriffe theologisch spannungsvoll, qualifiziert sie hier aber nicht ausdrücklich als ewig; eine konfessionelle Präzisierung wird daher vermieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Lehrton. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber idiomatisch gegliedert. Keine Fußnoten erforderlich.
