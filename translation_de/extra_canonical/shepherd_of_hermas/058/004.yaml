revisions:
- from: Während er also das ganze Jahr hindurch gequält und bestraft wird, erinnert er sich an den Genuss und die Täuschung und erkennt, dass er ihretwegen Schlimmes erleidet. So wird jeder Mensch gequält, der sich dem Genuss hingibt und sich täuschen lässt, weil solche Menschen, obwohl sie Leben haben, sich selbst dem Tod ausgeliefert haben.
  to: Während er also das ganze Jahr hindurch gequält und bestraft wird, erinnert er sich dann an den Genuss und die Täuschung und erkennt, dass er ihretwegen Schlimmes erleidet. So wird jeder Mensch gequält, der sich dem Genuss hingibt und getäuscht wird; denn obwohl sie Leben haben, haben sie sich selbst dem Tod ausgeliefert.
  rationale: Die Revision ergänzt den im griechischen ποτέ liegenden zeitlichen Fortschritt mit „dann“ und ersetzt die potenziell voluntative Umschreibung „sich täuschen lässt“ durch das neutrale Passiv „getäuscht wird“. Die pluralische Rückaufnahme im Schlusssatz bleibt als im Ausgangstext vorhandener Wechsel erhalten, ohne einen theologischen Zusatz einzuführen.
