translation:
  language: de
  text: „Herr“, sage ich, „welche Genüsse sind schädlich?“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί
  choice: Genüsse
  rationale: Der Plural bezeichnet hier lustvoll ausgeübte oder ausgekostete Handlungen, wie die anschließenden Beispiele zeigen. „Genüsse“ bewahrt diesen weiten, zunächst noch näher zu bestimmenden Sinn besser als das stärker moralisch festgelegte „Ausschweifungen“.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an den Gesprächspartner wird direkt und würdig wiedergegeben.
- source_word: φημί
  choice: fragte ich
  rationale: Im Kontext leitet das historische Präsens eine ausdrückliche Frage ein; das natürliche deutsche Erzähltempus „fragte“ gibt die Gesprächssituation klar wieder.
- source_word: βλαβεραί
  choice: schädlich
  rationale: Die Übersetzung entspricht der grundlegenden Bedeutung und lässt offen, ob der Schaden geistlich, moralisch oder umfassender zu verstehen ist.
theological_decisions:
- issue: Moralische Wertung von τρυφαί
  choice: Genüsse
  alternative: Ausschweifungen
  rationale: Da der folgende Abschnitt zwischen schädlichen und rettenden τρυφαί unterscheidet, darf das Grundwort nicht von vornherein ausschließlich sündhaft gefasst werden.
translation_notes:
  register: Moderne, würdige Standardsprache; die Wortstellung wurde für einen natürlichen deutschen Dialog geglättet. Keine Fußnoten erforderlich.
