base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: de
  text: '„Ich möchte wissen, wer die anderen Steine sind, die vom trockenen Land herbeigetragen werden, Herrin.“ Sie sagte: „Diejenigen, die in den Bau eingefügt werden, ohne behauen zu werden, hat der Herr als bewährt anerkannt, weil sie in der Rechtschaffenheit des Herrn ihren Weg gingen und seine Gebote hielten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρά
  choice: trockenes Land
  rationale: Gibt den Gegensatz zum zuvor genannten tiefen Wasser beziehungsweise Abgrund konkret wieder und entspricht dem gewöhnlichen Sinn des substantivierten Adjektivs.
- source_word: κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle direkte Anrede an die weibliche Gestalt der Vision.
- source_word: λατομουμένους
  choice: behauen
  rationale: Bezeichnet im Kontext der Bausteine das Zurichten durch Steinbruch- oder Steinhauerarbeit; die knappe deutsche Form ist bildhaft und verständlich.
- source_word: ἐδοκίμασεν
  choice: als bewährt anerkannt
  rationale: Bewahrt sowohl den Gedanken der Prüfung als auch den des positiven Befunds, ohne lediglich ein allgemeines Gefallen auszudrücken.
- source_word: ἐν τῇ εὐθύτητι
  choice: in der Rechtschaffenheit
  rationale: Gibt die moralische Geradheit und Aufrichtigkeit des Ausdrucks in natürlichem, würdigem Deutsch wieder.
- source_word: κατωρθώσαντο τὰς ἐντολάς
  choice: hielten seine Gebote
  rationale: Der griechische Ausdruck meint hier, die Gebote richtig beziehungsweise erfolgreich auszuführen; „hielten“ ist im Deutschen natürlich und sachlich treffend.
theological_decisions:
- issue: Bedeutung von ἐδοκίμασεν
  choice: hat ... als bewährt anerkannt
  alternative: hat ... geprüft
  rationale: Der Satz begründet mit ihrem Lebenswandel und Gebotsgehorsam einen positiven Prüfungsbefund. Die Übersetzung hält Prüfung und Anerkennung zusammen, ohne eine weitergehende Heilslehre einzutragen.
- issue: Genitiv τοῦ Κυρίου bei εὐθύτης
  choice: Rechtschaffenheit des Herrn
  alternative: dem geraden Weg des Herrn
  rationale: 'Der Genitiv bleibt formal offen: Er kann eine vom Herrn bestimmte oder ihm entsprechende Rechtschaffenheit bezeichnen. Die Übersetzung wahrt diese Spannung, statt sie erläuternd festzulegen.'
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener Steinbau-Metaphorik. Die Anrede „Herrin“ bleibt bewusst stehen. Keine Fußnoten erforderlich.
