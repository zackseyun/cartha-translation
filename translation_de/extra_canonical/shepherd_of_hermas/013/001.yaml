review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Bild- und Sachbezüge sind getroffen: die Steine, die vier Ämter bzw. Dienste, die Verstorbenen und Lebenden sowie die Verbindung von Eintracht und passenden Fugen. Der Dativ τοῖς ἐκλεκτοῖς τοῦ Θεοῦ bezieht sich jedoch am naheliegendsten auf die drei Tätigkeiten; „unter Gottes Erwählten“ schwächt diesen direkten Bezug unnötig ab. Auch κατὰ τὴν σεμνότητα τοῦ Θεοῦ wird mit „in der Ehrwürdigkeit Gottes“ sprachlich und semantisch nicht überzeugend wiedergegeben.'
  naturalness: Der Text ist überwiegend klar und würdig. „führten unter Gottes Erwählten ihren Aufseherdienst, ihren Lehrdienst und ihren Dienst … aus“ wirkt jedoch schwerfällig und künstlich. Eine verbale Wiedergabe ist im modernen Standarddeutsch natürlicher. „Würde“ trifft σεμνότης besser als „Ehrwürdigkeit“.
  terminology: „Aufseher“ und „Diener“ sind als funktionale Wiedergaben von ἐπίσκοποι und διάκονοι vertretbar; die Alternativen in den Fußnoten sichern die geläufigen Amtsbezeichnungen ab. „Entschlafen“ gibt κεκοιμημένοι angemessen wieder. Für σεμνότης/σεμνῶς sollte das Wortfeld „Würde/würdig“ statt „Ehrwürdigkeit/ehrwürdig“ verwendet werden.
  issues:
  - severity: medium
    issue: Der Bezug von τοῖς ἐκλεκτοῖς τοῦ Θεοῦ wird abgeschwächt.
    rationale: 'Das griechische Dativobjekt folgt auf ἐπισκοπήσαντες, διδάξαντες und διακονήσαντες und ist am besten als Bezug zu diesen drei Verben wiederzugeben: Sie beaufsichtigten, lehrten und dienten Gottes Erwählten.'
  - severity: medium
    issue: „in der Ehrwürdigkeit Gottes“ ist keine treffende, natürliche Wiedergabe von κατὰ τὴν σεμνότητα τοῦ Θεοῦ.
    rationale: κατά bedeutet hier „gemäß/nach“, und σεμνότης bezeichnet vor allem Würde, Ernsthaftigkeit oder ehrbares Auftreten. „gemäß der Würde Gottes“ bewahrt die knappe Genitivfügung, ohne sie konfessionell festzulegen.
  - severity: low
    issue: Die dreifache Tätigkeit wird unnötig nominalisiert.
    rationale: Die griechischen Partizipien sind aktiv und lassen sich im Deutschen klarer als Verben wiedergeben; zugleich bleibt die Wiederholung des Dienstwortfeldes durch „dienten“ erhalten.
