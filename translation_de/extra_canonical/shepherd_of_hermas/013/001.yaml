revisions:
- from: Höre nun, was es mit den Steinen auf sich hat, die in den Bau eingefügt werden. Die quadratischen, weißen Steine, deren Fugen zueinander passen, sind die Apostel, die Aufseher,[a] die Lehrer und die Diener.[b] Sie lebten in der Ehrwürdigkeit Gottes und führten unter Gottes Erwählten ihren Aufseherdienst, ihren Lehrdienst und ihren Dienst rein und ehrwürdig aus. Einige von ihnen sind entschlafen, andere leben noch. Sie stimmten stets miteinander überein, hielten untereinander Frieden und hörten aufeinander. Deshalb passen ihre Fugen beim Bau des Turmes zusammen.
  to: Höre nun von den Steinen, die in den Bau eingefügt werden. Die quadratischen, weißen Steine, die mit ihren Fugen zusammenpassen, sind die Apostel, die Aufseher,[a] die Lehrer und die Diener.[b] Sie lebten gemäß der Würde Gottes und beaufsichtigten, lehrten und dienten Gottes Erwählten rein und würdig. Einige von ihnen sind entschlafen, andere leben noch. Sie stimmten stets miteinander überein, hielten untereinander Frieden und hörten aufeinander. Deshalb passen ihre Fugen beim Bau des Turmes zusammen.
  rationale: Die Revision stellt den direkten Bezug der drei Tätigkeiten auf Gottes Erwählte wieder her und ersetzt die unidiomatische, semantisch weniger genaue Wiedergabe von σεμνότης durch „Würde“. Die bewusst offene Genitivverbindung τοῦ Θεοῦ bleibt in „der Würde Gottes“ erhalten. Die funktionalen Amtsbezeichnungen samt Alternativfußnoten werden beibehalten.
  reviewer_model: gpt-5.6-terra
