base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: de
  text: Höre nun von den Steinen, die in den Bau eingefügt werden. Die quadratischen, weißen Steine, die mit ihren Fugen zusammenpassen, sind die Apostel, die Aufseher,[a] die Lehrer und die Diener.[b] Sie lebten gemäß der Würde Gottes und beaufsichtigten, lehrten und dienten Gottes Erwählten rein und würdig. Einige von ihnen sind entschlafen, andere leben noch. Sie stimmten stets miteinander überein, hielten untereinander Frieden und hörten aufeinander. Deshalb passen ihre Fugen beim Bau des Turmes zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bischöfe.'
    reason: ἐπίσκοποι kann sowohl funktional »Aufseher« als auch als kirchliche Amtsbezeichnung »Bischöfe« wiedergegeben werden.
  - marker: b
    text: 'Oder: Diakone.'
    reason: διάκονοι bezeichnet allgemein Diener, wurde aber früh auch als kirchliche Amtsbezeichnung gebraucht.
lexical_decisions:
- source_word: ὑπαγόντων εἰς τὴν οἰκοδομήν
  choice: die in den Bau eingefügt werden
  rationale: Gibt die Bewegung der Steine in den entstehenden Bau natürlich wieder, ohne das Bild durch ein unidiomatisches »hineingehen« zu belasten.
- source_word: ἐπίσκοποι
  choice: Aufseher
  rationale: Bewahrt die Grundbedeutung und vermeidet, die möglicherweise noch nicht vollständig institutionalisierte Amtsbezeichnung vorschnell mit dem späteren kirchlichen Titel »Bischöfe« gleichzusetzen.
- source_word: διάκονοι / διακονήσαντες
  choice: Diener / führten … ihren Dienst … aus
  rationale: Erhält die Wortverbindung zwischen Amts- beziehungsweise Rollenbezeichnung und Tätigkeit im Griechischen.
- source_word: σεμνότης / σεμνῶς
  choice: Ehrwürdigkeit / ehrwürdig
  rationale: Bewahrt die Würde- und Achtungsdimension des Wortfeldes; »Gottesfurcht« wäre stärker deutend.
- source_word: ἁγνῶς
  choice: rein
  rationale: Gibt die moralische Lauterkeit knapp und formal nah wieder.
- source_word: κεκοιμημένοι
  choice: entschlafen
  rationale: Erhält den frühchristlichen Todesschlaf-Euphemismus und seinen würdevollen Ton.
- source_word: συμφωνοῦντες / συμφωνήσαντες
  choice: zueinander passen / miteinander übereinstimmen
  rationale: Bildet die bewusste Doppelverwendung desselben griechischen Wortstamms im Bau-Bild und im zwischenmenschlichen Verhältnis idiomatisch ab.
- source_word: ἀλλήλων ἤκουον
  choice: hörten aufeinander
  rationale: Drückt wechselseitige Aufmerksamkeit beziehungsweise Folgebereitschaft aus und lässt die genaue Nuance offen.
theological_decisions:
- issue: Bezeichnung der ἐπίσκοποι
  choice: Aufseher
  alternative: Bischöfe
  rationale: Die Übersetzung soll weder eine spätere Amtsstruktur voraussetzen noch ausschließen; die Grundbedeutung wahrt die historische und ekklesiologische Offenheit.
- issue: Genitiv in κατὰ τὴν σεμνότητα τοῦ Θεοῦ
  choice: in der Ehrwürdigkeit Gottes
  alternative: in Gottesfurcht / der Würde gemäß, die von Gott kommt
  rationale: Die ungewöhnliche und mehrdeutige Genitivverbindung wird möglichst eng bewahrt, statt sie eindeutig als Gottesfurcht oder als von Gott verliehene Würde auszulegen.
- issue: Objekt der drei Dienste
  choice: unter Gottes Erwählten ihren Aufseherdienst, ihren Lehrdienst und ihren Dienst … aus
  alternative: beaufsichtigten, lehrten und dienten Gottes Erwählten
  rationale: Der griechische Dativ τοῖς ἐκλεκτοῖς kann bei den koordinierten Verben unterschiedlich anschließen. »unter« bewahrt, dass alle Tätigkeiten im Kreis der Erwählten geschahen, ohne jedes Verb mit einem identischen direkten Bezug festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das Turmbau-Bild und die Wiederholungen des griechischen Wortfeldes werden soweit idiomatisch möglich bewahrt. Die Amtsbegriffe werden im Haupttext grundbedeutungsnah wiedergegeben; geläufige kirchliche Titel stehen als Alternativen in den Fußnoten.
