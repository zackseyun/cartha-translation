base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: de
  text: „Wer aber sind die, die aus der Tiefe heraufgezogen und in den Bau eingesetzt werden und deren Fugen zu denen der anderen, bereits eingebauten Steine passen?“ „Das sind die, die um des Namens des Herrn willen gelitten haben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυθός
  choice: Tiefe
  rationale: Bewahrt das Bild des tiefen Wassers bzw. Abgrunds, ohne es unnötig genauer festzulegen.
- source_word: ἑλκόμενοι
  choice: heraufgezogen
  rationale: Gibt das passive Herausziehen aus der Tiefe und die durch den Kontext vorgegebene Aufwärtsbewegung wieder.
- source_word: ἐπιτιθέμενοι εἰς τὴν οἰκοδομήν
  choice: in den Bau eingefügt werden
  rationale: Natürliches Deutsch für das Einsetzen der Steine in das entstehende Bauwerk; das Passiv des Griechischen bleibt erhalten.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: mit ihren Fugen … passen
  rationale: Überträgt die wörtliche Vorstellung des Zusammenstimmens an den Fugen idiomatisch und bewahrt das Steinbau-Bild.
- source_word: τῶν ἤδη ᾠκοδομημένων
  choice: bereits verbauten
  rationale: Bezieht sich im Kontext auf Steine, die schon in den Bau eingesetzt worden sind.
- source_word: παθόντες
  choice: gelitten haben
  rationale: Bewahrt den weiten Sinn von erlittenem Leid und legt die Betroffenen nicht ausdrücklich als Märtyrer im engeren Sinn fest.
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: um des Namens des Herrn willen
  rationale: Dignified, etablierte deutsche Wendung, die den kausalen Bezug auf den Namen des Herrn genau wahrt.
theological_decisions:
- issue: Art und Ausmaß des Leidens
  choice: die … gelitten haben
  alternative: die Märtyrer / die für den Herrn gestorben sind
  rationale: παθόντες bezeichnet Leiden, sagt hier aber nicht ausdrücklich, dass alle den Tod erlitten. Die Übersetzung bewahrt diese theologisch relevante Offenheit.
- issue: Bedeutung des Namens des Herrn
  choice: um des Namens des Herrn willen
  alternative: wegen des Herrn
  rationale: Die ausdrückliche Nennung des ὄνομα bleibt erhalten und wird nicht zu einer allgemeineren Aussage verkürzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage-Antwort-Struktur und das fortlaufende Bild vom Turmbau bleiben klar erkennbar; leicht gehobenes „um … willen“ entspricht dem frühchristlichen Ton, ohne altertümlich zu wirken.
