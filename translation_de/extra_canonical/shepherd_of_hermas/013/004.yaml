  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: de
  text: „Wer sind aber die, die herangeführt und in den Bau gesetzt werden?“ „Sie sind neu im Glauben und gläubig. Die Engel ermahnen sie jedoch, Gutes zu tun, weil Böses in ihnen gefunden wurde.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγόμενοι καὶ τιθέμενοι
  choice: herbeigebracht und in den Bau eingefügt
  rationale: Gibt die beiden passiven Partizipien wieder; „eingefügt“ beschreibt das Setzen der Steine in das Bauwerk im Deutschen natürlicher als bloß „gelegt“.
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: neu im Glauben
  rationale: Direkte und idiomatische Wiedergabe der zeitlich beziehungsweise entwicklungsbezogen jungen Stellung im Glauben.
- source_word: πιστοί
  choice: gläubig
  rationale: Bewahrt die naheliegende Bedeutung als Bezeichnung glaubender Menschen, ohne sie stärker als „treu“ auszulegen.
- source_word: νουθετοῦνται
  choice: werden ermahnt
  rationale: Das Verb bezeichnet zurechtweisende und anleitende Ermahnung; die Passivform bleibt erhalten.
- source_word: εἰς τὸ ἀγαθοποιεῖν
  choice: Gutes zu tun
  rationale: Natürliche deutsche Wiedergabe des finalen Ausdrucks und des Verbs ἀγαθοποιεῖν.
- source_word: πονηρία
  choice: Böses
  rationale: Der abstrakte substantivische Ausdruck lässt offen, ob moralische Schlechtigkeit, Bosheit oder konkretes Fehlverhalten gemeint ist.
theological_decisions:
- issue: Bedeutung von πιστοί neben „neu im Glauben“
  choice: gläubig
  alternative: treu
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Gläubig“ wahrt die unmittelbare Verbindung zu πίστις und vermeidet, den Neuaufgenommenen ausdrücklich bereits bewährte Treue zuzuschreiben.
- issue: Art des in ihnen gefundenen Mangels
  choice: Böses
  alternative: Bosheit
  rationale: „Böses“ erhält die Breite von πονηρία und legt nicht fest, ob eine feste bösartige Gesinnung oder sonstiges moralisches Fehlverhalten gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Frage-und-Antwort-Struktur und das theologisch spannungsvolle Nebeneinander von „gläubig“ und dennoch vorhandenem Bösen bleiben erhalten.
