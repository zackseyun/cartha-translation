revisions:
- from: „Wer sind nun die, die herbeigebracht und in den Bau eingefügt werden?“ „Sie sind neu im Glauben und gläubig. Die Engel ermahnen sie jedoch, Gutes zu tun, weil sich in ihnen Böses gefunden hat.“
  to: „Wer sind aber die, die herangeführt und in den Bau gesetzt werden?“ „Sie sind neu im Glauben und gläubig. Die Engel ermahnen sie jedoch, Gutes zu tun, weil Böses in ihnen gefunden wurde.“
  rationale: Die Revision beschränkt sich auf eine genauere, zugleich natürliche Wiedergabe der beiden passiven Bauverben und des Passivs εὑρέθη. Die im Griechischen bestehende Spannung, dass die Betroffenen sowohl „neu im Glauben“ als auch πιστοί sind, sowie die nicht näher bestimmte πονηρία bleiben erhalten.
