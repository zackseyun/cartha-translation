base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: de
  text: '„Und wer sind die, die sie wegwarfen und fortschleuderten?“ „Das sind Menschen, die gesündigt haben und umkehren wollen. Deshalb wurden sie nicht weit außerhalb des Turms fortgeschleudert; denn wenn sie umkehren, werden sie für den Bau brauchbar sein. Diejenigen also, die umkehren wollen, werden, wenn sie umkehren, stark im Glauben sein, wenn sie jetzt umkehren, solange der Turm gebaut wird. Ist der Bau aber vollendet, haben sie keinen Platz mehr, sondern werden hinausgeworfen werden. Nur dies bleibt ihnen: neben dem Turm zu liegen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: wegwarfen und beiseiteschleuderten
  rationale: Gibt die beiden anschaulichen Verben des Baugeschehens wieder, ohne sie zu einem einzigen Vorgang zu verschmelzen.
- source_word: μετανοῆσαι / μετανοήσωσιν
  choice: umkehren / umkehren
  rationale: „Umkehren“ bezeichnet verständlich die geforderte innere und praktische Sinnesänderung und bewahrt die Wiederholung des griechischen Textes.
- source_word: εὔχρηστοι
  choice: brauchbar
  rationale: Entspricht im Bildfeld des Turmbaus der konkreten Eignung der Steine für den Bau.
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: im Glauben stark
  rationale: Nahe, natürliche Wiedergabe der griechischen Formulierung.
- source_word: ἔκβολοι
  choice: ausgeschlossen
  rationale: Bezeichnet ihren endgültigen Ausschluss vom Bau; das vorangehende „weggeschleudert“ erhält zugleich das räumliche Bild.
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: neben dem Turm zu liegen
  rationale: Bewahrt bewusst das konkrete und theologisch spannungsreiche Schlussbild, ohne seinen Status näher auszudeuten.
theological_decisions:
- issue: Bedingtheit und zeitliche Dringlichkeit der Umkehr
  choice: Die mehrfachen Konditionalsätze und „jetzt ... solange“ werden ausdrücklich bewahrt.
  alternative: Die Aussage zu einer allgemeinen Verheißung der Vergebung glätten.
  rationale: Der griechische Text verbindet die künftige Brauchbarkeit und Glaubensstärke ausdrücklich mit tatsächlicher, rechtzeitiger Umkehr.
- issue: Status nach Vollendung des Baus
  choice: „werden ausgeschlossen sein“ und „neben dem Turm liegen“ bleiben nebeneinander stehen.
  alternative: Das Schlussbild als endgültige Verdammnis oder als spätere Rettungsmöglichkeit erklären.
  rationale: Der Text lässt die genaue theologische Bedeutung dieser Spannung offen; die Übersetzung soll sie nicht konfessionell auflösen.
- issue: μέλλοντες μετανοεῖν
  choice: „die umkehren wollen“
  alternative: „die künftig umkehren werden“
  rationale: Im Kontext entspricht dies dem zuvor genannten θέλοντες μετανοῆσαι und vermeidet, eine sichere zukünftige Umkehr zu behaupten; die nachfolgenden Bedingungssätze zeigen, dass sie nicht als gewiss gilt.
translation_notes:
  register: Moderne, würdige Standardsprache mit konsequent beibehaltenem Turmbau-Bild. Die rhetorische Frage-Antwort-Form und die eindringliche Wiederholung von „umkehren“ bleiben erhalten. Keine Fußnoten erforderlich.
