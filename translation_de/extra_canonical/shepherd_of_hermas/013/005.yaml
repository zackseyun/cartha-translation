  terminology: „umkehren“, „brauchbar“ und „stark im Glauben“ sind treffend. „Fortschleudern“ wahrt bei ἀπέβαλλον/ἔριττον und ἀπερίφησαν die körperlich-räumliche Bau-Metaphorik besser als eine abstrakte Wiedergabe. Für ἔκβολοι sollte ebenfalls ein Bildwort stehen.
