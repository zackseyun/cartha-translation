base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: de
  text: Höre nun, wie sie wirken. Die erste von ihnen, die ihre Hände zusammenhält, heißt Glaube. Durch sie werden die Erwählten Gottes gerettet. Die andere, die gegürtet ist und sich mutig zeigt, heißt Selbstbeherrschung. Sie ist eine Tochter des Glaubens. Wer ihr also folgt, wird in seinem Leben glücklich zu preisen sein; denn er wird sich von allen bösen Taten fernhalten, weil er glaubt, dass er das ewige Leben erben wird, wenn er sich von jedem bösen Verlangen fernhält.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: wie sie wirken
  rationale: Das Wort bezeichnet hier die Wirksamkeiten bzw. Tätigkeiten der personifizierten Tugenden; die verbale Wiedergabe ist im Deutschen natürlich und wahrt den Sinn.
- source_word: κρατοῦσα τὰς χεῖρας
  choice: die ihre Hände zusammenhält
  rationale: Die Formulierung bleibt bewusst allgemein, da der griechische Text nicht eindeutig bestimmt, ob die Hände gefaltet, verschränkt oder ergriffen sind.
- source_word: Πίστις
  choice: Glaube
  rationale: Übliche und sachlich passende Wiedergabe der personifizierten Tugend.
- source_word: περιεζωσμένη καὶ ἀνδριζομένη
  choice: die gegürtet ist und sich mutig zeigt
  rationale: Bewahrt sowohl das sichtbare Gegürtetsein als auch den Gedanken entschlossenen, tapferen Auftretens, ohne die wörtlich männlich konnotierte griechische Form unnatürlich nachzubilden.
- source_word: Ἐγκράτεια
  choice: Selbstbeherrschung
  rationale: Bezeichnet die Herrschaft über Begierden und Handlungen; „Selbstbeherrschung“ ist modern, verständlich und weiter als bloße Enthaltsamkeit.
- source_word: μακάριος γίνεται
  choice: wird … glücklich zu preisen sein
  rationale: Gibt den religiös gewichteten Sinn von μακάριος wieder und vermeidet eine bloß emotionale Deutung als „glücklich werden“.
- source_word: ἀφέξεται
  choice: wird sich … fernhalten
  rationale: Entspricht dem Gedanken bewusster Enthaltung und lässt sich bei Taten wie bei Begierden idiomatisch verwenden.
- source_word: κληρονομήσει ζωὴν αἰώνιον
  choice: wird das ewige Leben erben
  rationale: Erhält die traditionelle und theologisch bedeutsame Erbmetaphorik des griechischen Textes.
theological_decisions:
- issue: Rolle des Glaubens bei der Rettung
  choice: „Durch sie werden die Erwählten Gottes gerettet“
  alternative: „Durch sie sind die Erwählten Gottes gerettet“
  rationale: Das griechische Präsens σώζονται kann gegenwärtigen bzw. allgemeinen Vorgang ausdrücken. Die deutsche Passivform bewahrt die Aussage, ohne das Verhältnis von göttlichem Handeln, Glauben und Erwählung näher zu systematisieren.
- issue: Zusammenhang zwischen Enthaltung und ewigem Leben
  choice: Die konditionale Aussage wird direkt beibehalten.
  alternative: Eine abschwächende Deutung wie „als Zeichen dafür, dass …“
  rationale: Der Text verbindet den Verzicht auf böses Verlangen ausdrücklich mit dem Erben ewigen Lebens. Diese Spannung wird nicht durch eine konfessionelle Erklärung aufgelöst.
- issue: θυγάτηρ mit anarthrosem Πίστεως
  choice: „eine Tochter des Glaubens“
  alternative: „die Tochter des Glaubens“
  rationale: Das Griechische sagt prädikativ „Tochter des Glaubens“ ohne Artikel. „Eine Tochter“ wahrt diese grammatische Offenheit, auch wenn der folgende Zusammenhang eine genealogische Tugendreihe entfaltet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierten Tugenden werden großgeschrieben. Kurze, klare Sätze halten die lehrhafte Bildrede gut verständlich; genuine Unbestimmtheit bei der Handhaltung bleibt erhalten.
