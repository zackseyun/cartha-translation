  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: de
  text: 'Doch nicht dir allein wurde dies offenbart, sondern damit du es allen bekannt machst. Nach drei Tagen – denn du musst es zuerst verstehen; und zunächst gebiete ich dir, Hermas, hinsichtlich der Worte, die ich dir sagen werde: Bring sie alle den Heiligen zu Gehör[a], damit sie, wenn sie sie hören und befolgen, von ihren Bosheiten gereinigt werden und auch du mit ihnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle unsicher. Wörtlich etwa: »sprich sie alle in die Ohren der Heiligen«. Die Überlieferung markiert das Verb für »sprechen« als unsicher; »alle« ist ebenfalls textkritisch unsicher. Die genaue Satzverknüpfung bleibt daher umstritten.'
    reason: Die überlieferte Wortfolge um †λαλῆσαι†, [πάντα], εἰς τὰ ὦτα und τοῖς ἁγίοις ist syntaktisch schwierig und teilweise textkritisch markiert.
lexical_decisions:
- source_word: ἀπεκαλύφθη
  choice: wurde ... offenbart
  rationale: Bewahrt den Offenbarungscharakter des griechischen Passivs in natürlichem Deutsch.
- source_word: τοῖς ἁγίοις
  choice: ihnen allen
  rationale: Der überlieferte Satzbau ist gestört; πάντα und der vorangehende Auftrag, es allen bekannt zu machen, stützen diesen Bezug. Die alternative ausdrückliche Lesart »den Heiligen« wird in der Fußnote dokumentiert.
- source_word: πονηριῶν
  choice: Bosheiten
  rationale: Gibt den Plural und die moralische Bedeutung wieder, ohne ihn vorschnell auf einzelne böse Taten oder eine abstrakte Bosheit zu verengen.
- source_word: καθαρισθῶσιν
  choice: gereinigt werden
  rationale: Entspricht dem passiven Reinigungsmotiv des Ausgangstextes und vermeidet eine konfessionelle Ausdeutung.
theological_decisions:
- issue: Adressatenbezeichnung τοῖς ἁγίοις
  choice: Im Haupttext durch den inhaltlich klaren Bezug »ihnen allen« wiedergegeben und textkritisch angemerkt.
  alternative: »den Heiligen«
  rationale: Das Griechische enthält τοῖς ἁγίοις, doch die Syntax von V. 10–11 ist textlich unsicher. Die Übersetzung bewahrt den universalen Auftrag im Haupttext, ohne die kirchliche Bezeichnung »Heilige« zu verschweigen.
- issue: Zusammenhang von Hören, Tun und Reinigung
  choice: »damit sie sie hören und danach handeln und so ... gereinigt werden«
  alternative: Reinigung allein durch das Hören oder als rein menschliche Selbstreinigung formulieren
  rationale: Die Partizipien ἀκούσαντες und ποιήσαντες gehen dem passiven καθαρισθῶσιν voraus; die Formulierung erhält diesen Zusammenhang, bestimmt aber nicht näher, wer die Reinigung bewirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas eindringliche Wendung »ins Ohr sagen« bleibt als bewusst bildhafte Nähe zum Griechischen erhalten; der unterbrochene Satzbau wird behutsam geglättet. Der Fußnotenmarker [a] steht im Haupttext.
