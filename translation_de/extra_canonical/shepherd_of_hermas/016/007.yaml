  to: 'Doch nicht dir allein wurde dies offenbart, sondern damit du es allen bekannt machst. Nach drei Tagen – denn du musst es zuerst verstehen; und zunächst gebiete ich dir, Hermas, hinsichtlich der Worte, die ich dir sagen werde: Bring sie alle den Heiligen zu Gehör[a], damit sie, wenn sie sie hören und befolgen, von ihren Bosheiten gereinigt werden und auch du mit ihnen.«'
