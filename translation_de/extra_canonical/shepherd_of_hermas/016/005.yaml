base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: de
  text: '„Ich wollte gern wissen“, sagte ich, „Herrin, welche Kraft jede von ihnen hat.“ „Höre“, sagt sie, „welche Kräfte sie haben. Ihre Kräfte werden voneinander beherrscht, und sie folgen einander, entsprechend ihrer Abstammung: Aus dem Glauben wird die Selbstbeherrschung geboren, aus der Selbstbeherrschung die Aufrichtigkeit, aus der Aufrichtigkeit die Arglosigkeit, aus der Arglosigkeit die Ehrwürdigkeit, aus der Ehrwürdigkeit die Erkenntnis und aus der Erkenntnis die Liebe. Ihre Werke nun sind rein, ehrwürdig und göttlich. Wer ihnen dient und imstande ist, an ihren Werken festzuhalten, wird mit den Heiligen Gottes seine Wohnung im Turm haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις / δυνάμεις
  choice: Kraft / Kräfte
  rationale: Bewahrt die personifizierte Wirksamkeit der Tugenden und entspricht dem wiederholten griechischen Ausdruck.
- source_word: Ἁπλότης
  choice: Aufrichtigkeit
  rationale: Ἁπλότης bezeichnet hier eine ungeteilte, lautere Haltung; „Aufrichtigkeit“ ist im modernen Deutschen natürlicher als „Einfalt“ und vermeidet dessen abwertende Nebenbedeutung.
- source_word: Ἀκακία
  choice: Arglosigkeit
  rationale: Gibt das Fehlen von Bosheit oder Schädlichkeit wieder, ohne darüber hinaus vollkommene moralische Unschuld zu behaupten.
- source_word: Σεμνότης / σεμνά
  choice: Ehrwürdigkeit / ehrwürdig
  rationale: Erhält die lexikalische Verbindung zwischen der personifizierten Tugend und der Beschreibung ihrer Werke; der Ausdruck umfasst Würde und achtunggebietenden Ernst.
- source_word: Ἐπιστήμη
  choice: Erkenntnis
  rationale: Bezeichnet hier geistlich-moralisches Erkennen und nicht moderne wissenschaftliche Fachkenntnis.
- source_word: κρατοῦνται ὑπ᾽ ἀλλήλων
  choice: werden durch einander zusammengehalten
  rationale: Bildet das Passiv und die wechselseitige Abhängigkeit der Kräfte möglichst direkt ab.
- source_word: κρατῆσαι τῶν ἔργων αὐτῶν
  choice: an ihren Werken festzuhalten
  rationale: Gibt das Genitivobjekt und den Sinn beharrlicher Bindung an die entsprechenden Werke idiomatisch wieder.
- source_word: κατοίκησις
  choice: Wohnung
  rationale: Bewahrt das konkrete Bild eines Wohnplatzes im Turm.
theological_decisions:
- issue: Verhältnis und Reihenfolge der Tugenden
  choice: Die Aussagen über Geburt und Aufeinanderfolge werden wörtlich als Tugendkette wiedergegeben.
  alternative: Die Reihenfolge als bloße rhetorische Aufzählung zu glätten.
  rationale: Der Text stellt ausdrücklich eine genealogische und gegenseitig tragende Beziehung zwischen den personifizierten Tugenden her.
- issue: Bedingung für die Wohnung im Turm
  choice: „Wer ihnen dient und imstande ist, an ihren Werken festzuhalten“
  alternative: Die Aussage in eine allgemeine Behauptung über Erlösung allein durch Tugendwerke umzudeuten.
  rationale: Die Übersetzung bewahrt die konditionale Formulierung und die Bildwelt des Textes, ohne eine spätere systematisch-theologische Position hineinzulesen.
- issue: οἱ ἅγιοι τοῦ Θεοῦ
  choice: die Heiligen Gottes
  alternative: das heilige Volk Gottes
  rationale: Die traditionelle, verständliche Formulierung wahrt den substantivierten Plural und lässt offen, wie die Gruppe ekklesiologisch näher zu bestimmen ist.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer direkter Rede. Die personifizierten Tugenden stehen als Eigennamen mit Großschreibung. Die wiederholte Geburtsformel und das Turmbild bleiben erhalten; schwer verständliche oder heute missverständliche Wörter wie „Einfalt“ werden vermieden.
