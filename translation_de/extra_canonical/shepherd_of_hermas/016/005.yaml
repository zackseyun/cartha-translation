    issue: κρατοῦνται ὑπ᾽ ἀλλήλων
    rationale: „werden durch einander zusammengehalten“ fügt das Bild eines Zusammenhaltens ein und gibt die passive Beherrschungs- bzw. Bestimmungsrelation von κρατοῦνται nicht präzise wieder. Außerdem ist „durch einander“ in diesem Sinn kein natürliches modernes Deutsch.
  - severity: low
    issue: καθὼς καὶ γεγεννημέναι εἰσίν
    rationale: „so wie sie auch geboren wurden“ ist verständlich, klingt aber unnötig schwerfällig. „Entsprechend ihrer Abstammung“ vermittelt die genealogische Ordnung der Tugendkette idiomatischer.
