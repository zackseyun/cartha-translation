  to: 'Und ich fragte sie weiter nach den Zeiten, ob das Ende schon da sei. Da rief sie mit lauter Stimme: „Unverständiger Mensch! Siehst du nicht, dass der Turm noch gebaut wird? Wenn der Turm im Bau vollendet ist, ist das Ende da. Doch es wird bald weitergebaut werden. Frage mich nichts mehr. Diese Mahnung genügt dir und den Heiligen; ebenso die Erneuerung eurer Geister.“'
