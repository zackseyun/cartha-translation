base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: de
  text: 'Und ich fragte sie weiter nach den Zeiten, ob das Ende schon da sei. Da rief sie mit lauter Stimme: „Unverständiger Mensch! Siehst du nicht, dass der Turm noch gebaut wird? Wenn der Turm im Bau vollendet ist, ist das Ende da. Doch es wird bald weitergebaut werden. Frage mich nichts mehr. Diese Mahnung genügt dir und den Heiligen; ebenso die Erneuerung eurer Geister.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καιρῶν
  choice: Zeiten
  rationale: Bewahrt den eschatologischen, zugleich aber nicht näher bestimmten Plural des griechischen Textes.
- source_word: συντέλεια
  choice: Ende
  rationale: Im Zusammenhang ist der Abschluss der gegenwärtigen Ordnung gemeint; „Ende“ ist natürlich und lässt die genaue eschatologische Tragweite offen.
- source_word: Ἀσύνετε
  choice: Unverständiger
  rationale: Gibt den Vorwurf mangelnden Begreifens wieder, ohne die unnötig schärfere Bedeutung „töricht“ festzulegen.
- source_word: ἐποικοδομηθήσεται
  choice: fertiggebaut werden
  rationale: Im Kontext bezeichnet das Verb die rasche Fortführung beziehungsweise Vollendung des noch im Bau befindlichen Turms.
- source_word: ὑπόμνησις
  choice: Erinnerung
  rationale: Entspricht dem Grundsinn einer erinnernden Mahnung; der mahnende Unterton ergibt sich aus dem Zusammenhang.
- source_word: πνευμάτων
  choice: Geistes
  rationale: Der griechische Plural kann die Geister beziehungsweise das innere geistliche Leben der Angeredeten bezeichnen; im Deutschen klingt der distributive Singular natürlicher.
theological_decisions:
- issue: Verhältnis von Turmvollendung und Ende
  choice: „Sobald der Turm fertig gebaut ist, kommt das Ende.“
  alternative: „Wenn der Turmbau vollendet ist, ist das Ende da.“
  rationale: Die Formulierung bewahrt die enge Verknüpfung, ohne eine über den Text hinausgehende Endzeitchronologie zu formulieren.
- issue: Referenz von πνευμάτων
  choice: „eures Geistes“ mit Fußnote
  alternative: „eurer Geister“
  rationale: Der natürliche deutsche Ausdruck steht im Haupttext, während die formale Mehrzahl des Griechischen transparent dokumentiert wird.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt eindringlich; archaische Wendungen werden vermieden. „Die Heiligen“ folgt der frühchristlichen Bezeichnung der Glaubenden.
