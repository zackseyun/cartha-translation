  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: de
  text: „Und wer sind die anderen, Herrin?“ „Sie sind Töchter voneinander. Sie heißen Schlichtheit, Erkenntnis, Unschuld, Würde und Liebe. Wenn du nun alle Werke ihrer Mutter tust, kannst du leben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυγατέρες ἀλλήλων
  choice: eine nach der anderen Töchter
  rationale: Bewahrt das ungewöhnliche griechische Bild einer aufeinanderfolgenden Abstammung, das im weiteren Kontext ausdrücklich entfaltet wird.
- source_word: Ἁπλότης
  choice: Schlichtheit
  rationale: Gibt die Tugend der ungeteilten, lauteren Einfachheit wieder, ohne sie auf bloße Einfältigkeit zu verengen.
- source_word: Ἐπιστήμη
  choice: Erkenntnis
  rationale: Bezeichnet hier eine personifizierte Tugend des Wissens beziehungsweise Verstehens; „Erkenntnis“ ist im religiös-ethischen Zusammenhang natürlich.
- source_word: Ἀκακία
  choice: Arglosigkeit
  rationale: Drückt die Abwesenheit von Bosheit und schädlicher Absicht aus.
- source_word: Σεμνότης
  choice: Ehrbarkeit
  rationale: Erfasst die sittliche Würde und achtunggebietende Haltung des griechischen Begriffs.
- source_word: δύνασαι ζῆσαι
  choice: kannst du leben
  rationale: Folgt der offenen Formulierung des Griechischen und legt nicht zusätzlich fest, ob ausschließlich gegenwärtiges oder ewiges Leben gemeint ist.
theological_decisions:
- issue: Bedeutung von „leben“
  choice: kannst du leben
  alternative: wirst du das Leben erlangen
  rationale: Das Griechische lässt die Art und den zeitlichen Horizont des Lebens an dieser Stelle unausgeführt; die Übersetzung bewahrt diese Offenheit.
- issue: Bezug von „ihrer Mutter“
  choice: ihrer Mutter
  alternative: der Enthaltsamkeit, ihrer Mutter
  rationale: Der Ausgangstext nennt die Mutter in diesem Satz nicht ausdrücklich. Die Übersetzung ergänzt daher keine identifizierende Deutung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die personifizierten Tugenden werden als Eigennamen großgeschrieben; die bildhafte Abstammungsfolge bleibt bewusst erhalten.
