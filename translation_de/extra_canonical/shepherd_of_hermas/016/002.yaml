  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/002.yaml
  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: de
  text: 'Sie blickte mich an, lächelte und sagte zu mir: »Siehst du die sieben Frauen rings um den Turm?« »Ja, Herrin«, sagte ich. »Dieser Turm wird auf Befehl des Herrn von ihnen getragen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: Sie blickte mich an
  rationale: Gibt den direkten, aufmerksamen Blick natürlich wieder.
- source_word: ὑπεμειδίασεν
  choice: lächelte
  rationale: Das Verb bezeichnet ein Lächeln; eine stärkere Nuance wie „schmunzelte“ ist hier nicht erforderlich.
- source_word: κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle weibliche Anrede und entspricht der Figurenbezeichnung im Kontext.
- source_word: κύκλῳ τοῦ πύργου
  choice: rings um den Turm
  rationale: Natürliche und zugleich präzise Wiedergabe der räumlichen Anordnung.
- source_word: βαστάζεται
  choice: wird … getragen
  rationale: Bewahrt das konkrete Bild des von den Frauen getragenen beziehungsweise gestützten Turms.
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: auf Befehl des Herrn
  rationale: Gibt die verbindliche Anordnung des Herrn unmittelbar wieder.
theological_decisions:
- issue: Art der Unterstützung des Turms
  choice: getragen
  alternative: gestützt
  rationale: „Getragen“ folgt der Grundbedeutung von βαστάζω und lässt offen, ob das Bild körperliches Tragen oder tragende Unterstützung meint.
translation_notes:
  register: Moderne, würdige Standardsprache; die lebhafte historische Präsensform „sagte“ wird im Deutschen als einheitliche Erzählvergangenheit wiedergegeben. Keine Fußnoten erforderlich.
