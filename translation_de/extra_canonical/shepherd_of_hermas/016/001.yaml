  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: de
  text: 'Als ich aufgehört hatte, sie nach all diesen Dingen zu fragen, sagte sie zu mir: »Möchtest du noch etwas sehen?« Weil ich sehr danach verlangte, es zu schauen, war ich überglücklich, es zu sehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεπίθυμος
  choice: sehr danach verlangte
  rationale: Gibt das verstärkte Verlangen des griechischen Ausdrucks natürlich und deutlich wieder.
- source_word: θεάσασθαι / ἰδεῖν
  choice: es zu schauen / über diese Aussicht
  rationale: Bewahrt beim ersten Verb den nachdrücklichen Sinn des betrachtenden Schauens und vermeidet beim zweiten eine im Deutschen schwerfällige Wiederholung von »sehen«.
- source_word: περιχαρής
  choice: überglücklich
  rationale: Entspricht der sehr großen Freude, die das verstärkende Präfix περί- ausdrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter Rede. Der Tempuswechsel des griechischen historischen Präsens λέγει wird im Deutschen aus Gründen des natürlichen Erzählflusses als Präteritum wiedergegeben.
