base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: de
  text: Denk nicht über solche Dinge nach, sondern wende dich mit deinem ganzen Herzen dem Herrn zu und bitte ihn, ohne zu zweifeln. Dann wirst du seine große Barmherzigkeit erkennen; denn er wird dich gewiss nicht verlassen, sondern das Anliegen deiner Seele erfüllen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου ταῦτα
  choice: Denk nicht über solche Dinge nach
  rationale: Gibt die innere, zweifelnde Erwägung im unmittelbaren Zusammenhang natürlich wieder, ohne das Verb als allgemeines Denkverbot zu überdehnen.
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον ἐπὶ τὸν κύριον
  choice: wende dich mit deinem ganzen Herzen dem Herrn zu
  rationale: Bewahrt sowohl die Umkehr- bzw. Hinwendungsbewegung von ἐπίστρεψον als auch die Ganzheit der Herzenshaltung.
- source_word: ἀδιστάκτως
  choice: ohne zu zweifeln
  rationale: Passt zum Leitmotiv der διψυχία und bezeichnet hier ein Bitten ohne inneres Schwanken.
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: große Barmherzigkeit
  rationale: Das geläufige, würdevolle deutsche Wort erfasst das starke mitfühlende Erbarmen des griechischen Ausdrucks.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: das Verlangen deiner Seele erfüllen
  rationale: πληροφορήσει bedeutet hier, das innere Anliegen zur Erfüllung zu bringen; „Verlangen“ vermeidet die schwerfällige Wiederholung von „Bitte“.
theological_decisions:
- issue: Stärke der Verheißung in οὐ μή σὲ ἐγκαταλίπῃ
  choice: er wird dich gewiss nicht verlassen
  alternative: er wird dich keinesfalls verlassen
  rationale: Die emphatische griechische Verneinung bleibt klar erhalten, ohne die Aussage über das Verlassen hinaus systematisch auszuweiten.
- issue: Bezug des erfüllten Anliegens
  choice: das Verlangen deiner Seele erfüllen
  alternative: die Bitte deiner Seele erfüllen
  rationale: Die Formulierung wahrt den persönlichen und inneren Charakter von ψυχή, ohne eine pauschale Lehre über jede beliebige Bitte einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem paränetischem Ton. Die Satzstruktur folgt dem gedanklichen Gang des Griechischen, wurde aber für natürliche deutsche Lesbarkeit moderat gegliedert.
