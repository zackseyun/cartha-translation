  source_fidelity: 'Der Gedankengang und die zentralen Ausdrücke sind zutreffend wiedergegeben: μὴ διαλογίζου ταῦτα wird kontextgemäß als Verbot des grübelnden Erwägens verstanden; ἐπίστρεψον, ἀδιστάκτως, εὐσπλαγχνία und die nachdrückliche Verneinung οὐ μή sind angemessen erfasst. Bei τὸ αἴτημα τῆς ψυχῆς σου ist „Verlangen“ jedoch weniger präzise, da αἴτημα konkret eine Bitte bzw. ein Anliegen bezeichnet.'
  naturalness: Die Sprache ist flüssiges modernes Standarddeutsch und bewahrt einen würdigen, ermahnenden Ton. „Das Anliegen deiner Seele“ ist natürlich genug und gibt die persönliche Innenseite der Formulierung wieder, ohne aus αἴτημα ein bloßes Begehren zu machen.
  terminology: „Herr“, „Barmherzigkeit“ und „ohne zu zweifeln“ sind passend und konsistent. Die Revision ersetzt lediglich „Verlangen“ durch „Anliegen“, um den Charakter einer an Gott gerichteten Bitte zu erhalten.
