base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the servants of God.'
translation:
  language: de
  text: 'Sieh dir diese Zwiespältigkeit an: Sie ist böse und unvernünftig und entwurzelt viele aus dem Glauben, selbst sehr gläubige und starke Menschen. Denn diese Zwiespältigkeit ist eine Tochter des Teufels und geht äußerst bösartig gegen die Diener Gottes vor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: Zwiespältigkeit
  rationale: Bezeichnet hier nicht bloß Zweifel, sondern ein inneres Geteiltsein beziehungsweise Schwanken gegenüber Gott; „Zwiespältigkeit“ bewahrt diesen wiederkehrenden Leitbegriff.
- source_word: ἀσύνετος
  choice: unvernünftig
  rationale: Gibt den Mangel an Einsicht und Verständnis in natürlichem modernem Deutsch wieder.
- source_word: ἐκριζοῖ
  choice: entwurzelt
  rationale: Bewahrt das kräftige Bild des griechischen Verbs und seine Aussage, dass Menschen aus ihrer Verankerung im Glauben gerissen werden.
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: sehr gläubige und starke Menschen
  rationale: Gibt beide Eigenschaften wieder; die Ergänzung „Menschen“ macht den substantivischen Gebrauch der Adjektive im Deutschen eindeutig.
- source_word: λίαν πονηρεύεται εἰς
  choice: treibt ihr böses Spiel mit
  rationale: Eine natürliche, kräftige Wiedergabe des schwer wörtlich abzubildenden Ausdrucks für ausgesprochen böswilliges Handeln gegen die Diener Gottes.
- source_word: δούλους τοῦ θεοῦ
  choice: Dienern Gottes
  rationale: Bewahrt die traditionelle religiöse Dienstbezeichnung, ohne den sozialen Status stärker hervorzuheben, als es der Kontext verlangt.
theological_decisions:
- issue: Personifizierung der Zwiespältigkeit
  choice: „eine Tochter des Teufels“ wörtlich beibehalten
  alternative: „stammt vom Teufel“
  rationale: Der griechische Text personifiziert die Zwiespältigkeit ausdrücklich als Tochter; dieses starke Bild und seine theologische Spannung sollen nicht geglättet werden.
- issue: Gegenstand des Entwurzelns
  choice: „aus dem Glauben“
  alternative: „vom Glauben weg“
  rationale: Die Formulierung folgt ἀπὸ τῆς πίστεως und lässt offen, ob primär Glaubenshaltung, Glaubenstreue oder Glaubensgemeinschaft gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mahnende Ton und die starken Bilder des Ausgangstextes bleiben erhalten; keine Fußnoten erforderlich.
