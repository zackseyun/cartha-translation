revisions:
- from: Reinige also dein Herz von aller Zwiespältigkeit und zieh den Glauben an, denn er ist stark. Vertraue Gott, dass du alles empfangen wirst, worum du ihn bittest. Und wenn du den Herrn um etwas gebeten hast und es erst später empfängst, werde nicht zwiespältig, weil du das Verlangen deiner Seele nicht sogleich erfüllt bekommen hast. Denn gewiss empfängst du das Erbetene erst später wegen einer Prüfung oder einer Verfehlung, die dir selbst nicht bewusst ist.
  to: Reinige also dein Herz von der Zwiespältigkeit und zieh den Glauben an, denn er ist stark. Vertraue auf Gott, dass du alles erhalten wirst, worum du bittest. Und wenn du den Herrn einmal um etwas gebeten hast und es erst später erhältst, werde nicht zwiespältig, weil du die Bitte deiner Seele nicht schnell erhalten hast. Denn gewiss erhältst du das Erbetene erst später wegen einer Prüfung oder einer Verfehlung, die dir nicht bewusst ist.[a]
  rationale: Die Revision behebt den grammatischen Fehler, präzisiert αἴτημα als Bitte beziehungsweise Erbetenes und folgt dem bestimmten Ausdruck τῆς διψυχίας. Die uneingeschränkte Zusage, alle erbetenen Dinge zu erhalten, sowie die nachdrücklich behaupteten Gründe einer Verzögerung bleiben ohne lehrmäßige Abschwächung erhalten. Die Fußnote sichert die syntaktische Offenheit des griechischen Relativsatzes.
