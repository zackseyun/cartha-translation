base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: de
  text: Reinige also dein Herz von der Zwiespältigkeit und zieh den Glauben an, denn er ist stark. Vertraue auf Gott, dass du alles erhalten wirst, worum du bittest. Und wenn du den Herrn einmal um etwas gebeten hast und es erst später erhältst, werde nicht zwiespältig, weil du die Bitte deiner Seele nicht schnell erhalten hast. Denn gewiss erhältst du das Erbetene erst später wegen einer Prüfung oder einer Verfehlung, die dir nicht bewusst ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Relativpronomen („die/was du nicht weißt“) kann sich besonders auf die unmittelbar vorausgehende „Verfehlung“ beziehen, möglicherweise aber auch weiter auf den genannten Grund aus Prüfung oder Verfehlung.
    reason: Die Anmerkung bewahrt die im griechischen Satzbau bestehende Bezugsambiguität, die im Deutschen wegen der grammatischen Kongruenz nicht vollständig im Fließtext abbildbar ist.
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: Zwiespältigkeit / werde nicht zwiespältig
  rationale: Bewahrt das Bild eines innerlich geteilten Menschen und den Zusammenhang mit dem wiederkehrenden δίψυχος, ohne es auf bloßen intellektuellen Zweifel zu verengen.
- source_word: ἔνδυσαι τὴν πίστιν
  choice: zieh den Glauben an
  rationale: Die konkrete Metapher des Anziehens wird formal und zugleich verständlich wiedergegeben.
- source_word: πίστευε τῷ θεῷ
  choice: Vertraue Gott
  rationale: Der griechische Dativ bezeichnet das Vertrauen auf beziehungsweise Glaubenschenken gegenüber Gott; „vertraue“ klingt im modernen Deutschen natürlich.
- source_word: αἴτημα
  choice: das Erbetene / worum du ihn bittest
  rationale: Je nach Satzbau idiomatisch variiert; bezeichnet hier sowohl die Bitte als auch deren erbetenen Inhalt.
- source_word: βραδύτερον
  choice: erst später
  rationale: Gibt den komparativen zeitlichen Sinn wieder, ohne unnötig schwerfälliges „langsamer“.
- source_word: παράπτωμα
  choice: Verfehlung
  rationale: Entspricht dem moralischen Sinn, ohne eine bestimmte dogmatische Kategorie festzulegen.
theological_decisions:
- issue: Umfang der Zusage, alle Bitten zu empfangen
  choice: Die uneingeschränkte Formulierung „alles empfangen wirst“ bleibt stehen.
  alternative: Die Zusage durch einen Zusatz wie „wenn es Gottes Wille ist“ einschränken.
  rationale: Eine solche Einschränkung steht nicht im griechischen Text und würde die Spannung des Abschnitts stillschweigend auflösen.
- issue: Grund für verzögerte Erhörung
  choice: „wegen einer Prüfung oder einer Verfehlung“ wird als Aussage des Textes wiedergegeben.
  alternative: Durch abschwächende Zusätze wie „vielleicht“ oder „kann es sein“ relativieren.
  rationale: πάντως formuliert nachdrücklich; die Übersetzung bewahrt diese Behauptung, ohne sie systematisch auszudeuten.
- issue: Nicht erkannte Verfehlung
  choice: „die dir selbst nicht bewusst ist“
  alternative: 'Das Relativpronomen nur auf die unmittelbar vorhergehende „Verfehlung“ beziehen: „eine Verfehlung, von der du nichts weißt“.'
  rationale: Das griechische neutrale ὃ kann grammatisch auf den Gesamtgrund oder besonders auf παράπτωμα bezogen werden. Die gewählte Fassung lässt den Bezug hinreichend offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Wortfamilie διψυχία/διψυχεῖν wird mit „Zwiespältigkeit/zwiespältig werden“ sichtbar gehalten. Keine Fußnoten erforderlich.
