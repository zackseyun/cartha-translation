review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere sprachliche Korrektur ist nötig: Im Hauptsatz steht im Entwurf fälschlich „dass du alles empfangen wirst“; korrekt lautet es „dass du alles empfangen wirst“ nur bei anderer Wortstellung? Die idiomatisch und grammatisch richtige Form ist „dass du alles empfangen wirst“ nicht möglich; daher wird zu „dass du alles erhalten wirst, worum du bittest“ revidiert. Außerdem bezeichnet αἴτημα hier die Bitte beziehungsweise das Erbetene, nicht ein bloßes „Verlangen“. Der bestimmte Abstraktbegriff τῆς διψυχίας wird mit „der Zwiespältigkeit“ genauer aufgenommen. Das Bezugsfeld von ὃ σὺ ἀγνοεῖς bleibt durch eine Anmerkung als nicht völlig eindeutig ausgewiesen.'
  naturalness: Die Revision bleibt modernes, würdiges Standarddeutsch. „Zieh den Glauben an“ bewahrt die Bildsprache; „Vertraue auf Gott“ ist natürlich und macht die Richtung des Vertrauens klar. „Die Bitte deiner Seele“ ist verständlich und näher am griechischen αἴτημα als „das Verlangen deiner Seele“.
  terminology: „Zwiespältigkeit/zwiespältig“ bewahrt die Wortfamilie διψυχία/διψυχεῖν. „Glauben anziehen“, „auf Gott vertrauen“, „Bitte“, „Prüfung“ und „Verfehlung“ sind quellentreu und vermeiden konfessionelle Einengungen.
  issues:
