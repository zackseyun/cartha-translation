    issue: Fehlerhafte Satzkonstruktion bei der Zusage des Empfangens
    rationale: „dass du alles empfangen wirst“ ist im Deutschen nicht korrekt, weil „empfangen“ hier aktiv gebraucht wird. Der griechische Text sagt, dass der Angesprochene alle seine erbetenen Dinge erhalten wird.
  - severity: medium
    issue: „Verlangen deiner Seele“ ist für αἴτημα zu ungenau
    rationale: αἴτημα bezeichnet im Kontext die vor Gott vorgebrachte Bitte beziehungsweise das Erbetene. „Bitte deiner Seele“ erhält die Gebets- und Bitte-Terminologie des Abschnitts.
  - severity: low
    issue: Unklarer Bezug des Relativsatzes bei Prüfung oder Verfehlung
    rationale: Das neutrale ὃ kann besonders auf die unmittelbar vorausgehende Verfehlung oder weiter auf den genannten Grund bezogen werden. Deutsches Genus macht eine vollständig gleich offene Wiedergabe schwer; eine Fußnote dokumentiert die Ambiguität.
