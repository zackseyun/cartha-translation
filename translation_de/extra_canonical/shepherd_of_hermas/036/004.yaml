base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: de
  text: Reinige also dein Herz von allen Nichtigkeiten dieses Zeitalters und von den Worten, die zuvor zu dir gesprochen wurden, und bitte den Herrn. Dann wirst du alles empfangen und bei keiner deiner Bitten zu kurz kommen, wenn du den Herrn ohne zu zweifeln bittest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων
  choice: Nichtigkeiten
  rationale: Gibt die Vorstellung von leeren, nichtigen Beschäftigungen oder Dingen wieder, ohne sie enger als bloße Eitelkeit zu fassen.
- source_word: τοῦ αἰῶνος τούτου
  choice: dieser Weltzeit
  rationale: Bewahrt den zeitlich-weltbezogenen Sinn von αἰών und den frühchristlichen Kontrast zur kommenden Ordnung.
- source_word: τῶν προειρημένων σοί ῥημάτων
  choice: von den zuvor an dich gerichteten Worten
  rationale: Folgt der syntaktisch naheliegenden Bezugnahme auf zuvor Gesagtes, ohne den im unmittelbaren Zusammenhang schwierigen Ausdruck umzudeuten.
- source_word: ἀπολήψῃ πάντα
  choice: du wirst alles empfangen
  rationale: Gibt die umfassende Zusage direkt wieder.
- source_word: ἀνυστέρητος ἔσῃ
  choice: du wirst ... bei keiner ... leer ausgehen
  rationale: Natürliches Deutsch für das Nicht-Zukurz-Kommen beziehungsweise Nicht-Entbehrensollen.
- source_word: ἀδιστάκτως
  choice: ohne zu zweifeln
  rationale: Entspricht dem Kontext, in dem διστάζειν das innere Zweifeln und Schwanken beim Bitten bezeichnet.
theological_decisions:
- issue: Umfang der Gebetserhörungszusage
  choice: Die uneingeschränkte Formulierung „alles“ und „bei keiner deiner Bitten“ bleibt erhalten.
  alternative: Die Zusage durch Zusätze wie „nach Gottes Willen“ ausdrücklich begrenzen.
  rationale: Solche Einschränkungen stehen nicht in diesem Vers. Die Spannung wird nicht durch importierte dogmatische Präzisierungen aufgelöst.
- issue: Bedingung des Bittens
  choice: ἀδιστάκτως wird als „ohne zu zweifeln“ wiedergegeben.
  alternative: „im festen Glauben“ oder „vertrauensvoll“.
  rationale: Die direkte negative Form bewahrt den Gegensatz zur διψυχία des Gesamtabschnitts deutlicher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Imperativ und Verheißung bleiben klar und unmittelbar; die ungewöhnliche Wendung über die zuvor gesprochenen Worte wird quellennah bewahrt.
