  terminology: „Nichtigkeiten“ ist für ματαιώματα tragfähig. „Zeitalter“ bildet αἰών ab, ohne den Ausdruck zu einer rein räumlichen „Welt“ zu verengen. „Ohne zu zweifeln“ erhält den ausdrücklichen Kontrast zur διψυχία des Abschnitts.
