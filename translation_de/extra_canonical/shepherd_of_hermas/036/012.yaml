review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Gegenüberstellung von Glauben und διψυχία, die beiden attributiven Bestimmungen „Kraft habend/nicht Kraft habend“, die Aufforderung zum Dienst bzw. Abstandhalten sowie die zweimalige Formel ζήσῃ/ζήσονται τῷ θεῷ zuverlässig wieder. „Für Gott leben“ ist als Wiedergabe des offenen Dativs τῷ θεῷ vertretbar. φρονοῦντες ταῦτα bezieht sich unmittelbar auf „diese Dinge“ bzw. diese Haltung; „so denken“ bildet dies genauer ab als „so gesinnt sind“.
  naturalness: „Du nun diene“ ist im modernen Standarddeutsch unnötig invers und wirkt stärker archaisierend, als der würdige Registerbedarf verlangt. „Diene also“ ist natürlich und behält die Folgerung von οὖν. Die Stellung „halte dich von … fern“ ist ebenfalls idiomatischer.
  terminology: „Glaube“, „Kraft“ und „Zwiespältigkeit“ können beibehalten werden. „Zwiespältigkeit“ wahrt die im griechischen Abschnitt personifizierte, innere Gespaltenheit und vermeidet eine einseitige dogmatische Präzisierung. Der Schluss sollte die Denk-/Gesinnungskomponente von φρονοῦντες ausdrücklich erhalten.
  issues:
  - severity: low
    issue: Unnatürliche Wortstellung am Satzanfang
    rationale: Das griechische σὺ οὖν verlangt keine Nachbildung durch „Du nun“. „Diene also“ ist modernes, würdiges Deutsch und gibt οὖν angemessen wieder.
  - severity: low
    issue: φρονοῦντες ταῦτα etwas zu frei wiedergegeben
    rationale: „Die so gesinnt sind“ ist inhaltlich nahe, doch „die so denken“ spiegelt die ausdrückliche Denk-/Haltungsaussage des griechischen φρονοῦντες präziser.
  revised_text: Diene also dem Glauben, der Kraft hat, und halte dich von der Zwiespältigkeit fern, die keine Kraft hat. Dann wirst du für Gott leben; und alle, die so denken, werden für Gott leben.“
