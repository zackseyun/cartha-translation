  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: de
  text: Diene also dem Glauben, der Kraft hat, und halte dich von der Zwiespältigkeit fern, die keine Kraft hat. Dann wirst du für Gott leben; und alle, die so denken, werden für Gott leben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλευε
  choice: diene
  rationale: Gibt den Imperativ im Sinn eines verbindlichen Dienstes wieder, ohne im Deutschen unnötig hart mit „sei Sklave“ zu formulieren.
- source_word: πίστει
  choice: dem Glauben
  rationale: Bewahrt die personifizierende Gegenüberstellung von Glaube und Zwiespältigkeit im Kontext.
- source_word: διψυχίας
  choice: Zwiespältigkeit
  rationale: Bezeichnet hier ein inneres Schwanken beziehungsweise Geteiltsein im Vertrauen; „Zwiespältigkeit“ erhält den abstrakten und personifizierten Charakter.
- source_word: ζήσῃ τῷ θεῷ
  choice: wirst du für Gott leben
  rationale: Gibt den Dativ τῷ θεῷ bewusst offen als Ausrichtung und Zugehörigkeit wieder; die wiederholte Formel bleibt erhalten.
- source_word: φρονοῦντες
  choice: so gesinnt sind
  rationale: Erfasst eine innere Haltung oder Denkweise besser als das engere „dies denken“.
theological_decisions:
- issue: Art der dem Glauben zugeschriebenen Kraft
  choice: Kraft
  alternative: Macht
  rationale: „Kraft“ wahrt die allgemeine Bedeutung von δύναμις, ohne politische oder herrschaftliche Konnotationen von „Macht“ einzutragen.
- issue: Bedeutung von ζῆν τῷ θεῷ
  choice: für Gott leben
  alternative: Gott gegenüber leben / bei Gott leben
  rationale: Die knappe griechische Dativkonstruktion bleibt in ihrer theologischen Weite erhalten und wird nicht auf Jenseitsleben oder bloße moralische Lebensführung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „für Gott leben“ und die Personifizierung von Glaube und Zwiespältigkeit sind dem griechischen Text entsprechend beibehalten.
