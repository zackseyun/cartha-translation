  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/011.yaml
  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: de
  text: „Du siehst also“, sagt er, „dass der Glaube von oben, vom Herrn, kommt und große Kraft besitzt; die Zwiespältigkeit aber ist ein irdischer Geist, der vom Teufel kommt und keine Kraft besitzt.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: der Glaube
  rationale: Die übliche und kontextuell passende Wiedergabe; gemeint ist vertrauender Glaube an Gott.
- source_word: ἄνωθεν
  choice: von oben
  rationale: Bewahrt die räumlich-theologische Bildsprache und den Gegensatz zu ἐπίγειον.
- source_word: διψυχία
  choice: die Zwiespältigkeit
  rationale: Bezeichnet hier ein inneres Geteiltsein beziehungsweise schwankendes Misstrauen; „Zwiespältigkeit“ erhält die personifizierte Gegenüberstellung mit dem Glauben.
- source_word: ἐπίγειον πνεῦμα
  choice: ein irdischer Geist
  rationale: Formale und natürliche Wiedergabe, die den Gegensatz zu „von oben“ wahrt.
- source_word: δύναμις
  choice: Kraft
  rationale: Passt zur wiederholten Aussage über die Wirksamkeit beziehungsweise Macht des Glaubens und der Kraftlosigkeit der Zwiespältigkeit.
theological_decisions:
- issue: Herkunft des Glaubens und der Zwiespältigkeit
  choice: „vom Herrn“ und „vom Teufel“ als Herkunftsangaben beibehalten
  alternative: Die Wendungen lediglich als Zugehörigkeit oder Charakterisierung wiedergeben
  rationale: Das griechische παρά mit Genitiv bezeichnet hier am natürlichsten die Herkunft; die deutliche theologische Gegenüberstellung des Ausgangstextes soll nicht abgeschwächt werden.
- issue: Personifikation der διψυχία
  choice: „Zwiespältigkeit“ als handelnd beziehungsweise geistartig gegenübergestellte Größe wiedergeben
  alternative: „Zweifel“ oder „Unentschlossenheit“
  rationale: Der Kontext personifiziert διψυχία und nennt sie ausdrücklich einen Geist; eine rein psychologische Auflösung würde die Spannung des Textes vermindern.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur folgt der pointierten Gegenüberstellung des Griechischen; „besitzt“ vermeidet eine schwerfällige Wiederholung von „hat“, ohne den Sinn zu verändern.
