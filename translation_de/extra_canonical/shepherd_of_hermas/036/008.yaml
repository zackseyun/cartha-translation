base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: de
  text: Hör also nicht auf, um das zu bitten, was deine Seele begehrt, dann wirst du es erhalten. Wenn du aber beim Bitten mutlos wirst und zweifelst, gib dir selbst die Schuld und nicht dem, der es dir gewährt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς
  choice: Hör nicht auf
  rationale: Gibt das fortgesetzte, nicht nachlassende Bitten natürlich und genau wieder.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: das Anliegen deiner Seele
  rationale: Bewahrt die innere, persönliche Dimension von ψυχή und vermeidet die Verengung auf einen bloßen Einzelwunsch.
- source_word: ἐκκακήσῃς
  choice: den Mut verlierst
  rationale: Bezeichnet hier das Ermüden oder Verzagen im beharrlichen Bitten; die idiomatische deutsche Wendung trifft den Sinn.
- source_word: διψυχήσῃς
  choice: innerlich schwankst
  rationale: Das Verb meint ein Geteiltsein zwischen Vertrauen und Zweifel. Diese Formulierung ist verständlich und erhält die Spannung, ohne eine technische Wortneuschöpfung.
- source_word: τὸν διδόντα σοι
  choice: dem, der dir gibt
  rationale: Bewahrt die substantivierte, nicht ausdrücklich benannte Bezeichnung des Gebers im Griechischen.
theological_decisions:
- issue: Identität des Gebers
  choice: dem, der dir gibt
  alternative: Gott / dem Herrn
  rationale: Obwohl der Zusammenhang Gott beziehungsweise den Herrn meint, nennt Vers 8 ihn nicht ausdrücklich. Die Übersetzung erhält diese Textgestalt.
- issue: Verheißung des Empfangens
  choice: dann wirst du es erhalten
  alternative: und du kannst es erhalten
  rationale: Das griechische Futur λήψῃ ist als feste Zusage formuliert; eine modale Abschwächung wäre nicht quellengerecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Mahnrede und die unbedingte Form der Zusage bleiben erhalten; keine Fußnoten erforderlich.
