review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Textes wird grundsätzlich getroffen: beharrliches Bitten führt zum Empfang; mutloses Zweifeln während des Bittens zieht Selbstverantwortung nach sich. Die Wiedergabe von διψυχήσῃς als „innerlich schwankst“ ist vertretbar, doch „zweifelst“ ist im unmittelbaren Gebetskontext klarer und bewahrt die im Abschnitt zentrale Gegenüberstellung von Vertrauen und Zweifel.'
  naturalness: '„Um das Anliegen deiner Seele zu bitten“ ist zwar verständlich, wirkt im modernen Deutschen aber unnötig schwerfällig und leicht tautologisch. „Um das zu bitten, was deine Seele begehrt“ ist idiomatischer. Beim abschließenden Relativsatz sollte das empfangene Erbetene ausdrücklich aufgenommen werden: „der es dir gewährt“.'
  terminology: Die nicht ausdrücklich genannte Identität des Gebers bleibt gewahrt; der Text setzt weder „Gott“ noch „Herr“ ein. „Was deine Seele begehrt“ gibt τὸ αἴτημα τῆς ψυχῆς σου kontextgemäß als persönliches Gebetsanliegen wieder, ohne eine spezifische theologische Deutung einzutragen.
  issues:
  - severity: low
    issue: Unidiomatische Verbindung „um das Anliegen deiner Seele zu bitten“
    rationale: Das griechische αἰτεῖν τὸ αἴτημα ist in deutscher Wort-für-Wort-Nähe schwerfällig. Eine idiomatische Umschreibung wahrt die Aussage.
  - severity: low
    issue: „dem, der dir gibt“ bleibt im Deutschen elliptisch und unnatürlich
    rationale: Das Griechische kann den Gegenstand durch den Kontext ungesagt lassen. Deutsch klingt mit einem rückverweisenden „es“ natürlicher, ohne den Geber zu identifizieren.
  revised_text: Hör also nicht auf, um das zu bitten, was deine Seele begehrt, dann wirst du es erhalten. Wenn du aber beim Bitten mutlos wirst und zweifelst, gib dir selbst die Schuld und nicht dem, der es dir gewährt.
