revisions:
- from: Hör also nicht auf, um das Anliegen deiner Seele zu bitten, dann wirst du es erhalten. Wenn du aber beim Bitten den Mut verlierst und innerlich schwankst, gib dir selbst die Schuld und nicht dem, der dir gibt.
  to: Hör also nicht auf, um das zu bitten, was deine Seele begehrt, dann wirst du es erhalten. Wenn du aber beim Bitten mutlos wirst und zweifelst, gib dir selbst die Schuld und nicht dem, der es dir gewährt.
  rationale: Die Revision glättet zwei unidiomatische Stellen, ohne den Aussagegehalt, die unbedingte Zukunftszusage oder die im griechischen Vers gewahrte unbenannte Bezeichnung des Gebers zu verändern.
