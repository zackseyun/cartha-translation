base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: de
  text: Denn Gott ist nicht wie die Menschen, die erlittenes Unrecht nachtragen. Vielmehr trägt er Böses nicht nach und hat Erbarmen mit dem, was er geschaffen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακοῦντες
  choice: erlittenes Unrecht nachtragen
  rationale: Das Partizip bezeichnet Menschen, die sich an widerfahrenes Böses erinnern und deshalb Groll hegen; „nachtragen“ gibt diesen Sinn natürlich und präzise wieder.
- source_word: ἀμνησίκακός
  choice: trägt Böses nicht nach
  rationale: Bewahrt den bewussten Gegensatz zu μνησικακοῦντες, ohne die Aussage als buchstäbliches Vergessen Gottes misszuverstehen.
- source_word: σπλαγχνίζεται
  choice: hat Erbarmen
  rationale: Gibt das starke innere Mitgefühl in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: ποίησιν αὐτοῦ
  choice: dem, was er geschaffen hat
  rationale: Das griechische Substantiv bezeichnet hier Gottes Schöpfungswerk beziehungsweise seine Geschöpfe; die Formulierung hält den kollektiven Umfang offen.
theological_decisions:
- issue: Gottes ἀμνησίκακος-Sein
  choice: Gott trägt Böses nicht nach
  alternative: Gott erinnert sich nicht an Böses
  rationale: Die gewählte Fassung wahrt die Aussage von Gottes Vergebungsbereitschaft und vermeidet eine unbeabsichtigte Behauptung über mangelndes Erinnerungsvermögen.
- issue: Bezug von ποίησις
  choice: was er geschaffen hat
  alternative: seine Geschöpfe
  rationale: Die Umschreibung bleibt nahe am griechischen Ausdruck und legt nicht enger fest, ob besonders Menschen oder die gesamte Schöpfung gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antithetische Struktur des griechischen Satzes wird durch „Vielmehr“ und die Wiederholung von „nachtragen“ hörbar bewahrt.
