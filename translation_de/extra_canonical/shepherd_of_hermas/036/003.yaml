  source_fidelity: Die Übersetzung gibt den Gegensatz zwischen menschlichem Nachtragen erlittenen Unrechts (μνησικακοῦντες) und Gottes ἀμνησίκακος-Sein präzise wieder. „hat Erbarmen“ entspricht σπλαγχνίζεται, und „mit dem, was er geschaffen hat“ bewahrt den weiten Bezug von ποίησις αὐτοῦ, ohne ihn unzulässig auf Menschen einzuengen.
  naturalness: Flüssiges, modernes Standarddeutsch in angemessen würdigem Register. Die Wiederaufnahme von „nachtragen“ erhält die antithetische Struktur des griechischen Satzes. „Erlittenes Unrecht nachtragen“ ist idiomatisch und erläutert den im Verb enthaltenen Bezug auf widerfahrenes Böses angemessen.
  terminology: Die gewählten Ausdrücke sind theologisch nicht überdeterminiert. Insbesondere vermeidet „trägt Böses nicht nach“ die missverständliche Vorstellung eines bloßen Vergessens und trifft den kontextuellen Sinn von ἀμνησίκακος. Keine Fußnoten sind erforderlich.
