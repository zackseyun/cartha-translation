  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: de
  text: Die aber im Glauben ganz und ungeteilt sind, bitten um alles im Vertrauen auf den Herrn und empfangen alles, weil sie ohne Zweifel bitten und nicht zwiespältig sind. Denn jeder zwiespältige Mensch wird, wenn er nicht umkehrt, nur schwer gerettet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοτελεῖς
  choice: ganz und ungeteilt
  rationale: Das Wort bezeichnet Ganzheit beziehungsweise vollständige Unversehrtheit. Im Zusammenhang mit πίστει bringt „ganz und ungeteilt“ sowohl die Vollständigkeit als auch den Gegensatz zur folgenden Zwiespältigkeit zum Ausdruck.
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: im Vertrauen auf den Herrn
  rationale: Gibt das vollendete Partizip und die Ausrichtung des Vertrauens natürlich und inhaltlich genau wieder.
- source_word: ἀδιστάκτως
  choice: ohne Zweifel
  rationale: Bezeichnet ein Bitten ohne inneres Schwanken oder Zögern; „ohne Zweifel“ ist im Gebetskontext verständlich und bewahrt den Bezug zum folgenden μηδὲν διψυχοῦντες.
- source_word: διψυχοῦντες / δίψυχος
  choice: zwiespältig / zwiespältiger Mensch
  rationale: Bewahrt das Bild einer innerlich geteilten Haltung, ohne es vorschnell nur als intellektuellen Zweifel zu verengen.
- source_word: μετανοήσῃ
  choice: umkehrt
  rationale: Drückt die geforderte grundlegende Sinnes- und Lebenswendung in natürlichem modernem Deutsch aus.
- source_word: δυσκόλως σωθήσεται
  choice: wird … nur schwer gerettet werden
  rationale: Bewahrt Passiv, Futur und die auffällige Aussage „mit Schwierigkeit“, ohne die theologische Spannung abzuschwächen oder näher zu bestimmen.
theological_decisions:
- issue: Umfang von πάντα in der Aussage über das Bitten
  choice: „bitten um alles“
  alternative: „bitten um alle Dinge“ oder „bitten um alles, was sie erbitten“
  rationale: Die knappe, uneingeschränkte Form des Griechischen bleibt stehen; mögliche Begrenzungen aus dem weiteren theologischen Kontext werden nicht in den Text eingetragen.
- issue: Bedeutung der schwierigen Rettung
  choice: „wird … nur schwer gerettet werden“
  alternative: „kann kaum gerettet werden“
  rationale: Die Übersetzung hält an der passiven Zukunftsaussage fest und vermeidet, „schwer“ in ein stärkeres „kaum“ umzudeuten. Wer rettet und worin die Schwierigkeit besteht, bleibt wie im Ausgangstext unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung rund um Zweifel und Zwiespältigkeit bleibt erhalten, da sie die Argumentation des griechischen Textes trägt. Keine Fußnoten erforderlich.
