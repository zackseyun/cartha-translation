base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: de
  text: Wenn du aber in deinem Herzen zweifelst, wirst du ganz gewiss nichts von dem erhalten, worum du bittest. Denn diejenigen, die im Blick auf Gott zweifeln, sind zwiespältig[a] und erhalten überhaupt nichts von dem, worum sie bitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zweiseelige“ oder „Menschen mit geteiltem Sinn“; gemeint sind Menschen, die innerlich zwischen Vertrauen und Zweifel schwanken.'
    reason: Der bildhafte Ausdruck δίψυχοι wird mit „zwiespältig“ idiomatisch wiedergegeben; die Fußnote bewahrt die wörtliche Metapher.
lexical_decisions:
- source_word: διστάσῃς / διστάζοντες
  choice: zweifelst / zweifeln
  rationale: Das Verb bezeichnet hier inneres Schwanken oder Zögern beim Bitten. „Zweifeln“ ist im modernen Deutsch natürlich und bewahrt den Bezug auf mangelndes Vertrauen.
- source_word: δίψυχοι
  choice: die Unentschlossenen
  rationale: Wörtlich bezeichnet der Ausdruck Menschen mit „geteilter Seele“ beziehungsweise „geteiltem Sinn“. „Unentschlossene“ gibt das innere Schwanken verständlich wieder; die Fußnote bewahrt das markante Bild des griechischen Ausdrucks.
- source_word: αἰτημάτων
  choice: dem, worum … gebeten
  rationale: Im Zusammenhang sind konkrete Bitten an Gott gemeint. Die verbale Wiedergabe klingt natürlicher als „Bittgesuche“ oder „Bitten“ in der wiederholten Konstruktion.
- source_word: οὐδὲν οὐ μὴ λήψῃ
  choice: wirst du ganz gewiss nichts … erhalten
  rationale: Die gehäufte Verneinung mit οὐ μή ist nachdrücklich und wird durch „ganz gewiss nichts“ wiedergegeben.
- source_word: εἰς τὸν θεόν
  choice: im Blick auf Gott
  rationale: Die ungewöhnliche Präpositionalfügung beschreibt das auf Gott bezogene Zweifeln, ohne ausdrücklich festzulegen, ob an Gottes Macht, Güte oder Bereitschaft gezweifelt wird.
- source_word: ἐπιτυγχάνουσι
  choice: erlangen
  rationale: Das Verb bedeutet hier, das Erbetene zu erreichen oder zu erhalten. „Erlangen“ passt zum gehobenen, aber verständlichen Register.
theological_decisions:
- issue: Reichweite der Aussage über nicht erhörte Bitten
  choice: Die kategorische Formulierung des griechischen Textes bleibt stehen.
  alternative: Die Aussage durch Zusätze wie „solange sie zweifeln“ oder „möglicherweise“ abschwächen.
  rationale: Der Ausgangstext formuliert ausdrücklich und absolut; eine dogmatische Harmonisierung oder Einschränkung wäre ein nicht ausgewiesener Zusatz.
- issue: Art des Zweifels gegenüber Gott
  choice: „im Blick auf Gott zweifeln“ bleibt inhaltlich offen.
  alternative: „an Gott zweifeln“ oder „Gott misstrauen“.
  rationale: Die griechische Wendung lässt offen, ob Gottes Existenz, Verlässlichkeit oder die Erhörung der Bitte im Fokus steht. Die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, dignifiziertes Standarddeutsch. Die direkte Anrede und der eindringliche Ton bleiben erhalten; schwerfällige Nominalformulierungen werden vermieden.
