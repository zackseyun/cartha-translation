  naturalness: Die Formulierung ist überwiegend natürliches modernes Standarddeutsch. „Zwiespältig“ ist hier idiomatischer und semantisch präziser als die substantivierte Personenbezeichnung „die Unentschlossenen“.
  terminology: „Zweifeln“ gibt διστάζειν im Kontext angemessen wieder. Die Wiedergabe von δίψυχοι als „zwiespältig“ bewahrt die Bildlichkeit eines geteilten Inneren besser; die Fußnote dokumentiert die wörtliche Metapher, ohne eine dogmatisch engere Deutung festzulegen.
