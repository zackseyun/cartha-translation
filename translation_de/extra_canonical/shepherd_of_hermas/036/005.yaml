  to: Wenn du aber in deinem Herzen zweifelst, wirst du ganz gewiss nichts von dem erhalten, worum du bittest. Denn diejenigen, die im Blick auf Gott zweifeln, sind zwiespältig[a] und erhalten überhaupt nichts von dem, worum sie bitten.
  rationale: Die Revision beseitigt die im Griechischen nicht angelegte zeitliche Festlegung der Bitten und gibt δίψυχοι präziser wieder. Die bewusst offene Wendung „im Blick auf Gott“ bleibt erhalten, da εἰς τὸν θεόν die genaue Ausrichtung des Zweifels nicht näher bestimmt.
