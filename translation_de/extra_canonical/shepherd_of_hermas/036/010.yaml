  to: Darum verachte die Zwiespältigkeit und werde in jeder Angelegenheit Herr über sie, indem du den starken und mächtigen Glauben anziehst. Denn der Glaube verheißt alles und vollbringt alles; die Zwiespältigkeit aber, die kein Vertrauen in sich selbst hat, scheitert bei allen Werken, die sie tut.
