  source_fidelity: 'Der Entwurf gibt Aufbau und zentrale Aussagen des griechischen Textes insgesamt treffend wieder: die Aufforderung, die διψυχία zu verachten und zu beherrschen, die Kleidungsmetapher sowie die umfassenden Aussagen über den Glauben bleiben erhalten. Bei μὴ καταπιστεύουσα ἑαυτῇ ist jedoch „sich selbst nichts zutraut“ eine interpretierende Verschiebung von „sich selbst nicht vertraut“ bzw. „kein Vertrauen in sich selbst hat“; die revidierte Fassung bleibt näher am reflexiven Vertrauensausdruck.'
  naturalness: Die Sprache ist modern und würdig. „Sie hat kein Vertrauen in sich selbst“ ist im Deutschen klar und bewahrt zugleich die im Ausgangstext auffällige Personifizierung. „Bei allen Werken, die sie tut, scheitert“ vermeidet die leicht missverständliche Konstruktion „an allen ihren Werken scheitert“.
  terminology: „Zwiespältigkeit“ ist als konsequente Wiedergabe von διψυχία vertretbar und wahrt den Leitbegriff. „Herr über sie werden“ gibt κατακυριεύειν angemessen wieder. „Verheißt“ und „vollbringt“ entsprechen ἐπαγγέλλεται und τελειοῖ ohne die Absolutheit von πάντα abzuschwächen.
