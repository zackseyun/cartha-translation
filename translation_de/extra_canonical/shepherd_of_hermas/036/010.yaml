base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: de
  text: Darum verachte die Zwiespältigkeit und werde in jeder Angelegenheit Herr über sie, indem du den starken und mächtigen Glauben anziehst. Denn der Glaube verheißt alles und vollbringt alles; die Zwiespältigkeit aber, die kein Vertrauen in sich selbst hat, scheitert bei allen Werken, die sie tut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: Zwiespältigkeit
  rationale: Bezeichnet hier ein inneres Geteiltsein beziehungsweise schwankendes Misstrauen. „Zwiespältigkeit“ bewahrt das wiederkehrende Leitmotiv, ohne es vorschnell auf bloßen Zweifel zu verengen.
- source_word: κατακυρίευσον αὐτῆς
  choice: werde … Herr über sie
  rationale: Gibt den nachdrücklichen Herrschafts- und Überwindungsgedanken des Verbs natürlich wieder.
- source_word: ἐνδυσάμενος
  choice: indem du … anziehst
  rationale: Bewahrt die konkrete Kleidungsmetapher des griechischen Textes.
- source_word: ἐπαγγέλλεται
  choice: verheißt
  rationale: Entspricht dem üblichen Sinn „versprechen/verheißen“ und erhält die auffällige Aussage des Ausgangstextes.
- source_word: τελειοῖ
  choice: vollbringt
  rationale: Drückt aus, dass der Glaube etwas zur Vollendung beziehungsweise Ausführung bringt.
- source_word: μὴ καταπιστεύουσα ἑαυτῇ
  choice: die sich selbst nichts zutraut
  rationale: Gibt die reflexive Form wieder und lässt die ungewöhnliche Aussage bestehen, dass die Zwiespältigkeit kein Vertrauen zu sich selbst hat.
- source_word: ἀποτυγχάνει
  choice: scheitert an
  rationale: Erfasst das Misslingen beziehungsweise Verfehlen der angestrebten Werke.
theological_decisions:
- issue: Absolute Aussagen über den Glauben
  choice: „verheißt alles und vollbringt alles“
  alternative: „sagt alles zu und führt alles aus“
  rationale: Die umfassende Formulierung πάντα wird nicht eingeschränkt oder durch eine konfessionelle Deutung qualifiziert.
- issue: Personifizierung von Glaube und Zwiespältigkeit
  choice: als handelnde Größen beibehalten
  alternative: psychologisch paraphrasieren
  rationale: Der griechische Text personifiziert beide und stellt ihre Macht beziehungsweise Ohnmacht gegenüber; diese Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten Bildfeldern von Herrschaft, Kleidung und Vollendung. Der Satzbau wurde für heutige Lesbarkeit leicht gegliedert, ohne die Parallelität zwischen Glaube und Zwiespältigkeit aufzulösen.
