    rationale: Die Formulierung bedeutet eher mangelndes Zutrauen bzw. fehlende Selbstwirksamkeit. Das Griechische spricht unmittelbar von fehlendem Vertrauen in sich selbst. Eine nähere Wiedergabe bewahrt die ungewöhnliche, personifizierende Aussage.
  - severity: low
    issue: „scheitert an allen ihren Werken“
    rationale: „An etwas scheitern“ kann im Deutschen eine Ursache oder ein Hindernis nahelegen. Der griechische Akkusativ πάντων τῶν ἔργων bezeichnet, dass die Zwiespältigkeit bei sämtlichen eigenen Werken keinen Erfolg hat.
