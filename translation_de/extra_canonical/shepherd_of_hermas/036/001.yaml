base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: de
  text: 'Er sagt zu mir: »Lege die Zwiespältigkeit ab und sei keinesfalls zwiespältig, wenn du Gott um etwas bittest, indem du bei dir sagst: ›Wie kann ich den Herrn um etwas bitten und es empfangen, wo ich doch so viel gegen ihn gesündigt habe?‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: Zwiespältigkeit / zwiespältig sein
  rationale: Das griechische Wort bezeichnet wörtlich ein Geteiltsein der Seele und im Zusammenhang ein inneres Schwanken beim vertrauensvollen Bitten. „Zwiespältigkeit“ bewahrt dieses Bild besser als das enger deutende „Zweifel“.
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Lege ... ab
  rationale: Natürliche deutsche Wiedergabe der Aufforderung, etwas entschieden von sich zu entfernen.
- source_word: αἰτήσασθαί τι παρὰ τοῦ θεοῦ
  choice: Gott um etwas bittest
  rationale: Idiomatiche Wiedergabe des Bittens um etwas von Gott, ohne den Sinn unnötig auszubauen.
- source_word: ἡμαρτηκὼς τοσαῦτα εἰς αὐτόν
  choice: wo ich doch so viel gegen ihn gesündigt habe
  rationale: Gibt das partizipiale Selbstargument und εἰς αὐτόν als gegen Gott gerichtete Sünde klar und natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von διψυχία
  choice: Zwiespältigkeit
  alternative: Zweifel / Wankelmut
  rationale: Der Text spricht nicht notwendig jeden intellektuellen Zweifel an, sondern eine geteilte, schwankende Haltung gegenüber Gott. Die Übersetzung hält diesen weiteren Sinn offen.
- issue: Bezug von κύριος und θεός
  choice: „Gott“ und „der Herr“ entsprechend dem griechischen Wortlaut beibehalten
  alternative: beide Bezeichnungen vereinheitlichen
  rationale: Die wechselnden Gottesbezeichnungen des Ausgangstextes werden nicht harmonisiert; zugleich wird keine weitergehende christologische Identifikation in den Vers hineingelesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die innere Selbstrede werden durch deutsche Anführungszeichen klar gegliedert. „Zwiespältigkeit“ ist bewusst etwas markanter als Alltagssprache, bleibt aber verständlich und wahrt die wiederholte Wortwurzel des Griechischen.
