lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede des Visionärs an seinen Unterweiser, ohne unnötig zwischen „Herr“ und „mein Herr“ zu präzisieren.
- source_word: ἐξομολόγησις
  choice: Bekenntnis
  rationale: Das Wort kann Bekenntnis, Lobpreis oder Danksagung bezeichnen. „Bekenntnis“ erhält die semantische Offenheit und wird nicht stillschweigend auf Sündenbekenntnis verengt.
- source_word: ἔντευξις / ἐντυγχάνειν
  choice: Gebet / beten für
  rationale: Im Kontext ist ein an Gott gerichtetes Eintreten gemeint. „Gebet“ klingt natürlich; bei genanntem Begünstigten verdeutlicht „für ihn beten“ den Fürbittecharakter.
- source_word: πένης
  choice: der Arme
  rationale: Bezeichnet den materiell Bedürftigen im bewussten Gegenüber zum Reichen. „Der Arme“ hält diese durchgehende Gegenüberstellung klar.
- source_word: ἐπιχορηγεῖν / χορηγεῖν
  choice: versorgen / zur Verfügung stellen
  rationale: Gibt die fortgesetzte materielle Unterstützung idiomatisch wieder und wahrt bei der Gabe des Reichtums den Gedanken an anvertraute Mittel.
- source_word: ἀδιάλειπτος γένηται ἐν τῇ ζωῇ αὐτοῦ
  choice: damit es ihm in seinem Leben beständig an nichts fehlt
  rationale: Die griechische Formulierung ist ungewöhnlich; im Kontext bezeichnet sie am ehesten die kontinuierlich gesicherte Lebensführung des Armen. Die Übersetzung bleibt beim Versorgungskontext, ohne Unsterblichkeit einzutragen.
- source_word: συνῆκεν ἐπὶ τῷ πλούτῳ αὐτοῦ
  choice: hat verstanden, wozu sein Reichtum da ist
  rationale: 'Macht den Zweckgedanken im Zusammenhang verständlich: Der Reiche erkennt die rechte Verwendung seines Besitzes.'
- source_word: πτελέα
  choice: Ulme
  rationale: Die traditionelle und lexikalisch direkte Wiedergabe des Baumnamens in der Parabel.
theological_decisions:
- issue: Lohn für Wohltätigkeit
  choice: „bei Gott seinen Lohn finden“
  alternative: „sich bei Gott das Heil verdienen“
  rationale: Der Text spricht ausdrücklich von μισθός, verbindet dies aber nicht ausdrücklich mit einem verdienten Heil. Die Übersetzung erhält die Aussage über göttlichen Lohn, ohne ein weitergehendes Verdienstsystem einzutragen.
- issue: Wirksamkeit des Gebets des Armen
  choice: „sein Gebet hat große Kraft bei Gott“
  alternative: „sein Gebet zwingt Gott zum Handeln“
  rationale: Bewahrt die starke Aussage des Textes über die besondere Wirksamkeit und Annahme des Gebets, ohne Gottes Freiheit aufzuheben.
- issue: Gegenseitigkeit von Arm und Reich
  choice: Beide vollbringen gemeinsam das Werk durch ihre jeweils empfangene Gabe
  alternative: Der Reiche kauft sich mit Almosen das Gebet des Armen
  rationale: Der griechische Text beschreibt eine wechselseitige Verwaltung von Gaben des Herrn, nicht ausdrücklich einen kommerziellen Tausch oder den Kauf geistlicher Leistungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer mündlicher Rahmenerzählung. Die wiederkehrenden Schlüsselbegriffe „der Reiche“, „der Arme“, „Gebet“, „Herr“ und „versorgen“ halten die Argumentation und die Bildparallele zusammen. Der Satzabbruch am Ende bleibt erhalten, da der bereitgestellte Abschnitt mitten im Gedanken endet.
