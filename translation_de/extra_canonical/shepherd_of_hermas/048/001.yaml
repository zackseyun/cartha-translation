base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the servants of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the servants of God, for the poor and the rich.
translation:
  language: de
  text: Denn dazu hat der Gebieter euch reich gemacht, damit ihr diese Dienste für ihn verrichtet. Es ist viel besser, solche Felder [und Landgüter][a] und Häuser zu kaufen, die ihr in eurer Stadt finden werdet, wenn ihr dort ankommt. Dieser Aufwand ist gut und erfreulich; er bringt weder Kummer noch Furcht mit sich, sondern Freude. Lebt also nicht im aufwendigen Stil der Völker; denn er bringt euch, den Dienern Gottes, keinen Nutzen. Übt vielmehr eure eigene Art von Aufwand aus, mit der ihr euch freuen könnt. Denn jeder Aufwand dieser Art bringt Nutzen. Der Aufwand der Völker dagegen ist bitter und hart. Dieses Gleichnis ist also für die Diener Gottes bestimmt, für Arme und Reiche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „und Landgüter“ fehlt in einigen Textzeugen und steht in der griechischen Ausgabe in Klammern.
    reason: Textkritische Unsicherheit des eingeklammerten Ausdrucks καὶ κτήματα transparent machen.
lexical_decisions:
- source_word: δεσπότης
  choice: Gebieter
  rationale: Gibt die Bedeutung eines Herrn mit Verfügungsgewalt wieder und wahrt die Unterscheidung zu κύριος im weiteren Kontext.
- source_word: διακονίας
  choice: Dienste
  rationale: Bezeichnet hier konkrete, Gott erwiesene Dienste, besonders den verantwortlichen Einsatz von Reichtum.
- source_word: πολυτέλεια
  choice: Aufwand / aufwendiger Lebensstil
  rationale: Das Wort kann Luxus oder kostspieligen Aufwand bezeichnen. „Aufwand“ lässt die positive Verwendung für Freigebigkeit zu; beim Lebensstil der Völker verdeutlicht die erweiterte Formulierung den negativen Gebrauch.
- source_word: ἔθνη
  choice: Völker
  rationale: Bewahrt die offene Grundbedeutung; eine Festlegung auf „Heiden“ wäre stärker religiös deutend.
- source_word: ἱλαρά
  choice: macht froh
  rationale: Gibt die heitere, freudige Qualität idiomatisch wieder, statt das missverständliche „heiter“ auf den Aufwand selbst zu beziehen.
- source_word: κεῖται
  choice: gilt
  rationale: Vermittelt im Zusammenhang natürlich, dass das Gleichnis auf Arme und Reiche bezogen ist.
theological_decisions:
- issue: Zweck des Reichtums
  choice: Reichtum wird als anvertrautes Mittel zum Dienst für Gott dargestellt.
  alternative: Reichtum als pauschales Zeichen göttlicher Gunst zu formulieren.
  rationale: Der ἵνα-Satz bindet das Reichmachen ausdrücklich an die Ausführung der Dienste und nicht an eine allgemeine Wohlstandslehre.
- issue: Bild von der künftigen Stadt
  choice: „eure Stadt ... wenn ihr dort ankommt“ bleibt bildhaft und unbestimmt.
  alternative: Die Stadt ausdrücklich als Himmel oder himmlisches Jerusalem zu benennen.
  rationale: Der Text legt eine eschatologische Deutung nahe, benennt sie hier aber nicht ausdrücklich; die Spannung bleibt erhalten.
- issue: Adressaten des Gleichnisses
  choice: „den Armen wie den Reichen“
  alternative: Nur die Reichen als eigentliche Adressaten zu behandeln.
  rationale: Der griechische Text nennt ausdrücklich Arme und Reiche als Diener Gottes, auf die das Gleichnis bezogen ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die absichtliche Wiederholung des Begriffs πολυτέλεια bleibt durch „Aufwand“ beziehungsweise „aufwendiger Lebensstil“ erkennbar, ohne wohltätige Freigebigkeit schlicht mit selbstbezogenem Luxus gleichzusetzen. Der überlieferte Quellenausschnitt ist an einer Stelle beschädigt beziehungsweise springt in einen späteren Abschnitt; der Abschluss folgt dem im Konsultationstext bezeugten Zusammenhang.
