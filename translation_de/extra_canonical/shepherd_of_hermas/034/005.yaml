  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: de
  text: '5 »Warum, Herr«, fragte ich, »hast du von denen, die seine Gebote halten, gesagt: ›Sie werden für Gott leben‹?« Er antwortete: »Weil die ganze Schöpfung den Herrn fürchtet, aber seine Gebote nicht hält. Darum ist das Leben derer, die ihn fürchten und seine Gebote halten, bei Gott; die aber seine Gebote nicht halten, haben nicht einmal Leben in ihm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρούντων / φυλασσόντων
  choice: die … Gebote halten
  rationale: Beide Verben bezeichnen hier das Befolgen bzw. Bewahren der Gebote. Die einheitliche Wiedergabe mit »halten« ist im Deutschen natürlich und wahrt den Gedankengang.
- source_word: ζήσονται τῷ Θεῷ
  choice: sie werden für Gott leben
  rationale: Der griechische Dativ bleibt semantisch offen und kann eine Ausrichtung oder Beziehung zu Gott ausdrücken. »Für Gott leben« bewahrt diese Spannung besser als eine rein räumliche Deutung.
- source_word: πᾶσα ἡ κτίσις
  choice: die ganze Schöpfung
  rationale: κτίσις bezeichnet hier umfassend das Geschaffene bzw. die Schöpfung; die traditionelle und verständliche Wiedergabe passt zum Kontext.
- source_word: ἡ ζωή ἐστι παρὰ τῷ Θεῷ
  choice: das Leben … ist bei Gott
  rationale: παρὰ mit Dativ bezeichnet Nähe bzw. Gegenwart bei Gott. Die wörtlich-nahe Formulierung bewahrt den Wechsel gegenüber ζήσονται τῷ Θεῷ.
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: haben auch kein Leben in ihm
  rationale: Die griechische Nominalkonstruktion lautet wörtlich »ist auch kein Leben in ihm«. Die deutsche Fassung gibt den Sinn idiomatisch wieder und erhält den Bezug von αὐτῷ auf Gott.
theological_decisions:
- issue: Verhältnis von Gottesfurcht, Gebotstreue und Leben
  choice: Die Aussage wird ohne dogmatische Erläuterung als konditionale Gegenüberstellung wiedergegeben.
  alternative: Eine Auslegung im Sinn einer bestimmten Heilslehre ausdrücklich einfügen.
  rationale: Der griechische Text verbindet Gottesfurcht und Gebotstreue eng mit dem Leben bei bzw. in Gott, erklärt aber das systematisch-theologische Verhältnis nicht näher.
- issue: Bedeutung des Lebens »bei Gott« und »in ihm«
  choice: Die unterschiedlichen Präpositionen werden als »bei Gott« und »in ihm« bewahrt.
  alternative: Beide Wendungen vereinheitlichen, etwa als »Leben mit Gott«.
  rationale: Die Variation παρὰ τῷ Θεῷ und ἐν αὐτῷ kann bedeutungsvoll sein und soll nicht eingeebnet werden.
translation_notes:
  register: Moderner, würdevoller Erzähl- und Dialogstil. Die Anrede κύριε wird als »Herr« wiedergegeben. Die Satzstruktur bleibt nah am griechischen Gedankengang, ohne unnatürlich zu wirken.
