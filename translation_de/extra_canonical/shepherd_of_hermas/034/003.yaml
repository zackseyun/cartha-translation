  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: de
  text: 3 Doch fürchte die Werke des Teufels, denn sie sind böse. Wenn du also den Herrn fürchtest, wirst du die Werke des Teufels fürchten und sie nicht tun, sondern dich von ihnen fernhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: fürchte / wenn du ... fürchtest / wirst du ... fürchten
  rationale: Die wiederholte Wortwurzel wird im Deutschen bewahrt, weil der Gedankengang ausdrücklich zwischen der Furcht des Herrn und der Furcht vor den Werken des Teufels unterscheidet.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: die Werke des Teufels
  rationale: „Werke“ gibt ἔργα formal und im ethisch-religiösen Zusammenhang angemessen wieder; gemeint sind die bösen Taten bzw. Wirkungen, die dem Teufel zugeordnet werden.
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: sie nicht tun
  rationale: Natürliches modernes Deutsch; zugleich bleibt das Wortspiel zwischen ἔργα und ἐργάσῃ sinngemäß erkennbar.
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: dich von ihnen fernhalten
  rationale: Gibt das aktive Meiden bzw. Sich-Enthalten idiomatisch wieder, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Bedeutung von „Furcht“ gegenüber den Werken des Teufels
  choice: Das griechische φοβέομαι wird auch hier mit „fürchten“ wiedergegeben.
  alternative: „sich hüten vor“ oder „Abscheu haben vor“
  rationale: Die bewusste Wiederholung desselben Verbs trägt die Argumentation. Eine interpretierende Ersetzung würde die Spannung zwischen Gottesfurcht und der Furcht vor bösen Werken vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, bewahrt aber Wiederholung und logische Folge des griechischen Textes.
