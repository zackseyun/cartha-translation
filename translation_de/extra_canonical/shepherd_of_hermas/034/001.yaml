base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: de
  text: 1. »Fürchte den Herrn«, sagt er, »und halte seine Gebote. Wenn du also Gottes Gebote hältst, wirst du zu jeder Tat fähig sein, und dein Tun wird unvergleichlich sein. Denn wenn du den Herrn fürchtest, wirst du alles gut tun. Das ist die Furcht, die du haben sollst – und du wirst gerettet werden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος / φόβος
  choice: fürchte / wenn du … fürchtest / Furcht
  rationale: Bewahrt das wiederkehrende Leitwort und den ernsten Aufforderungscharakter. „Ehrfurcht“ allein wäre enger und würde die im Kontext bewusst entfaltete Spannung des Begriffs abschwächen.
- source_word: φύλασσε / φυλάσσων
  choice: halte / wenn du … hältst
  rationale: Im Zusammenhang mit Geboten ist „Gebote halten“ natürliches, würdevolles Deutsch und gibt die Bedeutung von bewahren und befolgen angemessen wieder.
- source_word: δυνατὸς ἐν πάσῃ πράξει
  choice: zu jeder Tat fähig
  rationale: Gibt die Befähigung beziehungsweise Wirksamkeit in jedem Handeln wieder, ohne daraus eine absolute weltliche Machtbehauptung zu machen.
- source_word: ἡ πρᾶξίς σου
  choice: dein Tun
  rationale: „Tun“ ist im Deutschen idiomatischer als „Tat“ als Sammelbegriff und bewahrt zugleich den Zusammenhang mit πράξει.
- source_word: ἀσύγκριτος
  choice: unvergleichlich
  rationale: Nahe Entsprechung des griechischen Ausdrucks; die ungewöhnlich starke Aussage wird nicht abgeschwächt.
- source_word: πάντα καλῶς ἐργάσῃ
  choice: wirst du alles gut tun
  rationale: Bewahrt sowohl den umfassenden Ausdruck πάντα als auch den ethisch-praktischen Sinn von καλῶς und ἐργάζομαι.
- source_word: δεῖ σε φοβηθῆναι
  choice: die du haben sollst
  rationale: Natürliches Deutsch für die gebotene Furcht; vermeidet die schwerfällige Wiederholung „die du fürchten musst“, ohne die Verpflichtung aufzuheben.
- source_word: σωθήσῃ
  choice: du wirst gerettet werden
  rationale: Bewahrt das theologisch gewichtige Passiv und lässt den Handelnden unausgesprochen, wie im Griechischen.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: „Furcht“ als Leitbegriff beibehalten
  alternative: durchgehend „Ehrfurcht“
  rationale: Der griechische Text verwendet φόβος und entwickelt im Gesamtabschnitt verschiedene Gegenstände und Wirkungen der Furcht. Eine Festlegung auf bloße Ehrfurcht würde diese begriffliche Spannung vorzeitig auflösen.
- issue: Verhältnis von Gebotehalten und Rettung
  choice: 'Die Abfolge des griechischen Textes unverändert stehen lassen: Gottesfurcht, Gebotehalten und „du wirst gerettet werden“'
  alternative: durch eine erklärende Formulierung ein bestimmtes Gnaden- oder Verdienstschema eintragen
  rationale: Der Ausgangstext formuliert den Zusammenhang direkt, erläutert aber an dieser Stelle nicht dessen dogmatischen Mechanismus. Die Übersetzung bewahrt diese Offenheit.
- issue: Stärke von „unvergleichlich“
  choice: Die absolute Formulierung beibehalten
  alternative: „vorzüglich“ oder „besonders gut“
  rationale: ἀσύγκριτος ist auffällig stark. Eine Abschwächung wäre interpretierend und textlich nicht erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Die Wiederholung von „fürchten“ und „Gebote halten“ bleibt als rhetorische Struktur erhalten. Die Verszählung „1.“ wurde gemäß der angefragten Einheit übernommen.
