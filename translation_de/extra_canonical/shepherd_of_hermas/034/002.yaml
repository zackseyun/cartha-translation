review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem griechischen Text insgesamt eng. κατακυριεύσεις bezeichnet jedoch konkreter das Überwältigen bzw. Herrschaftgewinnen als die etwas umständliche Formulierung „Herr über den Teufel werden“. In der Aussage über Macht und φόβος meint φόβος aufgrund des unmittelbaren Folgesatzes („wer Macht hat, wird gefürchtet“) die von einer Person ausgehende Furcht bzw. dass sie gefürchtet wird.
  naturalness: Der Text ist überwiegend natürliches, würdiges modernes Standarddeutsch. Die unpersönlichen Sätze „Wo keine Macht ist, gibt es auch keine Furcht“ können im Deutschen jedoch nahelegen, Furcht existiere allgemein nicht, statt dass der Machtlose nicht gefürchtet wird. Eine explizite passive Form macht den Gedankengang verständlich und bewahrt die Wiederholung.
  terminology: „Herr“, „Teufel“, „Macht“ und „Furcht“ sind angemessen. „Furcht“ sollte als Leitwort beibehalten werden; die passive Umschreibung „wird gefürchtet“ gibt hier die vom Kontext bestimmte Funktion von φόβος idiomatisch wieder. „Herrliche Macht“ ist als Wiedergabe von ἔνδοξος möglich, klingt aber weniger idiomatisch als „Macht von Ansehen“.
  issues:
  - severity: medium
    issue: Die beiden Sätze über Macht und Furcht sind zu unpersönlich formuliert.
    rationale: ἐν ᾧ ... φόβος ... und besonders der anschließende Satz erklären, dass ein Mächtiger gefürchtet wird, während ein Machtloser verachtet wird. Die deutsche Fassung „gibt es auch keine Furcht“ lässt den Bezug auf die betreffende Person unnötig offen.
  - severity: low
    issue: „wirst du Herr über den Teufel werden“ ist stilistisch schwerfällig.
    rationale: „wirst du den Teufel bezwingen“ gibt κατακυριεύσεις direkt und modern wieder, ohne den Sinn zu verändern.
  revised_text: 2 Doch fürchte dich nicht vor dem Teufel. Denn weil du den Herrn fürchtest, wirst du den Teufel bezwingen, weil keine Macht in ihm ist. Wer keine Macht hat, wird auch nicht gefürchtet; wer aber Macht von Ansehen hat, wird gefürchtet. Denn jeder, der Macht besitzt, wird gefürchtet; wer aber keine Macht besitzt, wird von allen verachtet.
  revised_footnotes: []
