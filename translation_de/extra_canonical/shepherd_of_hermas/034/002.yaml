revisions:
- from: 2 Doch fürchte dich nicht vor dem Teufel. Denn wenn du den Herrn fürchtest, wirst du Herr über den Teufel werden, weil keine Macht in ihm ist. Wo keine Macht ist, gibt es auch keine Furcht; wo aber herrliche Macht ist, da ist auch Furcht. Denn jeder, der Macht besitzt, wird gefürchtet; wer aber keine Macht besitzt, wird von allen verachtet.
  to: 2 Doch fürchte dich nicht vor dem Teufel. Denn weil du den Herrn fürchtest, wirst du den Teufel bezwingen, weil keine Macht in ihm ist. Wer keine Macht hat, wird auch nicht gefürchtet; wer aber Macht von Ansehen hat, wird gefürchtet. Denn jeder, der Macht besitzt, wird gefürchtet; wer aber keine Macht besitzt, wird von allen verachtet.
  rationale: Die Revision verdeutlicht im Deutschen die durch den Kontext geforderte Bedeutung von φόβος als Gefürchtetwerden und ersetzt eine schwerfällige Umschreibung von κατακυριεύσεις. Die absolute Aussage, dass im Teufel keine Macht sei, bleibt unverändert; es wird keine einschränkende theologische Ergänzung eingeführt.
