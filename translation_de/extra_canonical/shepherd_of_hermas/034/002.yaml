  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: de
  text: 2 Doch fürchte dich nicht vor dem Teufel. Denn weil du den Herrn fürchtest, wirst du den Teufel bezwingen, weil keine Macht in ihm ist. Wer keine Macht hat, wird auch nicht gefürchtet; wer aber Macht von Ansehen hat, wird gefürchtet. Denn jeder, der Macht besitzt, wird gefürchtet; wer aber keine Macht besitzt, wird von allen verachtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριεύσεις
  choice: wirst du Herr über … werden
  rationale: Gibt den Gedanken des Überwältigens bzw. Erlangens von Herrschaft wieder und bewahrt zugleich die bewusste Gegenüberstellung zur Furcht des Herrn.
- source_word: δύναμις
  choice: Macht
  rationale: Passt im Zusammenhang besser als „Kraft“, da es um die Fähigkeit geht, Furcht hervorzurufen und Herrschaft auszuüben.
- source_word: φόβος
  choice: Furcht / gefürchtet werden
  rationale: Bewahrt die wiederholte Leitvokabel des griechischen Textes; in der allgemeinen Aussage wird die idiomatische Passivform verwendet.
- source_word: ἔνδοξος
  choice: herrlich
  rationale: Gibt die positive, ehrende Wertung der Macht wieder, ohne sie lediglich als „groß“ oder „ansehnlich“ abzuschwächen.
- source_word: καταφρονεῖται
  choice: wird … verachtet
  rationale: Entspricht der starken negativen Bedeutung des Verbs und wahrt den Gegensatz zum Gefürchtetwerden.
theological_decisions:
- issue: Die Aussage, im Teufel sei keine Macht
  choice: „weil keine Macht in ihm ist“
  alternative: „weil er keine Macht über dich hat“
  rationale: Der griechische Text formuliert uneingeschränkt ὅτι δύναμις ἐν αὐτῷ οὐκ ἔστιν. Eine Ergänzung wie „über dich“ würde die theologische Spannung stillschweigend auflösen.
- issue: Mehrdeutigkeit von φόβος als Angst oder ehrfürchtige Furcht
  choice: Durchgehend „Furcht“
  alternative: Beim Herrn „Ehrfurcht“, beim Teufel „Angst“
  rationale: Der Abschnitt arbeitet bewusst mit demselben griechischen Wort. Eine terminologische Aufspaltung würde das Wortspiel und die Argumentationsstruktur abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber dort idiomatisch geglättet, wo eine wörtliche Wiedergabe („hat Furcht“) im Deutschen missverständlich wäre.
