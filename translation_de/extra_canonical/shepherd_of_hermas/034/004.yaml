base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: de
  text: '4. Es gibt also zweierlei Furcht: Wenn du Böses tun willst, fürchte den Herrn, dann wirst du es nicht tun. Wenn du dagegen Gutes tun willst, fürchte den Herrn, dann wirst du es tun. So ist die Furcht des Herrn stark, groß und herrlich. Fürchte also den Herrn, und du wirst für ihn leben. Und alle, die ihn fürchten, aus der Zahl derer, die seine Gebote halten[a], werden für Gott leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle, die ihn fürchten, von denen, die seine Gebote halten“. Die griechische partitive Fügung ist ungewöhnlich und lässt ihr genaues Verhältnis offen; die Übersetzung erhält die Einschränkung, ohne sie weiter zu deuten.'
    reason: Die Fußnote erläutert die bewusst markierte deutsche Wiedergabe der syntaktisch auffälligen griechischen Genitivfügung.
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: zwei Arten von Furcht
  rationale: Gibt den Plural und die Zweiteilung verständlich wieder, ohne die im Kontext beschriebene Furcht des Herrn in zwei völlig getrennte Gegenstände aufzuspalten.
- source_word: τὸ πονηρόν / τὸ ἀγαθόν
  choice: Böses / Gutes
  rationale: Natürliche substantivierte Wiedergabe der ethischen Gegensätze.
- source_word: ἰσχυρός ... μέγας ... ἔνδοξος
  choice: stark, groß und herrlich
  rationale: Bewahrt die dreigliedrige Steigerung und gibt ἔνδοξος in einem würdigen, religiösen Register wieder.
- source_word: ζήσῃ αὐτῷ / ζήσονται τῷ Θεῷ
  choice: für ihn leben / für Gott leben
  rationale: Der Dativ bezeichnet hier am ehesten die Ausrichtung bzw. Zugehörigkeit des Lebens; die wechselnden Bezeichnungen ‚ihn‘ und ‚Gott‘ bleiben erhalten.
theological_decisions:
- issue: Verhältnis von Gottesfurcht, Gebotstreue und Leben für Gott
  choice: Die partitive Einschränkung des griechischen Satzes bleibt ausdrücklich sichtbar.
  alternative: 'Glätten zu: „Alle, die ihn fürchten und seine Gebote halten, werden für Gott leben.“'
  rationale: Der griechische Genitiv τῶν φυλασσόντων lässt die Gottesfürchtigen als Gruppe innerhalb der Gebotstreuen erscheinen. Die gewählte Fassung löst diese theologische Spannung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Imperative und die parallele Satzstruktur des Griechischen bleiben erhalten; schwer verständliche Satzverschachtelung wird nur behutsam geglättet.
