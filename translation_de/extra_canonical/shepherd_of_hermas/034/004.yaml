    rationale: Der griechische Genitiv τῶν φυλασσόντων ist auffällig und lässt sich nicht eindeutig glatt auflösen. „Aus der Zahl derer“ wahrt die partitive Einschränkung, ohne eine zusätzliche Wenn-dann-Formulierung einzutragen.
