base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: de
  text: Doch mach diese Worte allen deinen Kindern und deiner Frau bekannt, die künftig deine Schwester sein wird. Denn auch sie hält ihre Zunge nicht zurück, durch die sie Böses tut. Wenn sie aber diese Worte hört, wird sie davon ablassen und Erbarmen finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβίῳ
  choice: Frau
  rationale: Das Wort bezeichnet hier die Ehefrau beziehungsweise Lebensgefährtin des Hermas; „Frau“ ist im Deutschen natürlich und im Zusammenhang eindeutig.
- source_word: τῇ μελλούσῃ σου ἀδελφῇ
  choice: die deine Schwester sein soll
  rationale: Bewahrt den Zukunfts- und Sollakzent der griechischen Formulierung, ohne die Art der künftig gedachten geschwisterlichen Beziehung näher festzulegen.
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: hält ihre Zunge nicht zurück
  rationale: Gibt das anschauliche griechische Idiom verständlich wieder und lässt offen, welche konkrete Form sündiger Rede gemeint ist.
- source_word: ἕξει ἔλεος
  choice: Erbarmen finden
  rationale: Natürliches Deutsch für „Erbarmen haben/erlangen“; es vermeidet eine unnötige Festlegung darauf, von wem das Erbarmen ausgeht.
theological_decisions:
- issue: Die Frau als künftige „Schwester“
  choice: die deine Schwester sein soll
  alternative: die künftig wie eine Schwester für dich sein wird
  rationale: Die knappe, auffällige Aussage des Ausgangstextes bleibt erhalten; eine bestimmte asketische oder ehetheologische Deutung wird nicht in die Übersetzung eingetragen.
- issue: Urheber des Erbarmens
  choice: Erbarmen finden
  alternative: Gott wird sich ihrer erbarmen
  rationale: Der griechische Text nennt Gott an dieser Stelle nicht ausdrücklich als Subjekt; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Mahnrede bleibt direkt und klar; die ungewöhnliche Bezeichnung der Ehefrau als künftige Schwester wird nicht geglättet oder konfessionell ausgelegt.
