  naturalness: „Ihre Wege in Gerechtigkeit gerade machen“ ist zwar verständlich, wirkt im heutigen Standarddeutsch jedoch unnötig wörtlich und syntaktisch hart. „Ihre Wege in Gerechtigkeit zurechtbringen“ ist idiomatischer und erhält das Wegbild.
