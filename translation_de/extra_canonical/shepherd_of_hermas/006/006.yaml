  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: de
  text: Darum sollst du denen, die der Gemeinde vorstehen, sagen, dass sie ihre Wege in Gerechtigkeit zurechtbringen sollen, damit sie die Verheißungen in vollem Maß und mit großer Herrlichkeit empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: denen, die der Gemeinde vorstehen
  rationale: Gibt die leitende Funktion natürlich wieder, ohne einen späteren kirchlichen Amtstitel in den Text einzutragen.
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: ihre Wege ... gerade machen
  rationale: Bewahrt das Wegbild und den auffordernden Sinn des griechischen Verbs.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Entspricht der ethisch-theologischen Bedeutung von δικαιοσύνη und erhält die prägnante Formulierung.
- source_word: ἀπολάβωσιν ἐκ πλήρους
  choice: in vollem Maß ... empfangen
  rationale: Drückt den Gedanken eines vollständigen Empfangs idiomatisch aus.
- source_word: μετὰ πολλῆς δόξης
  choice: mit großer Herrlichkeit
  rationale: Gibt δόξα formal und im frühchristlichen theologischen Register angemessen wieder.
theological_decisions:
- issue: Bezeichnung der Gemeindeleitung
  choice: die der Gemeinde vorstehen
  alternative: die Leiter der Kirche
  rationale: Die gewählte Fassung hält die institutionelle Form offen und vermeidet, eine bestimmte spätere Ämterordnung vorauszusetzen.
- issue: Bezug von „mit großer Herrlichkeit“
  choice: Anbindung an das Empfangen der Verheißungen
  alternative: Anbindung an die Verheißungen selbst
  rationale: Die griechische Wortstellung lässt den Begleitumstand am natürlichsten auf ἀπολάβωσιν beziehen, ohne die genaue Art dieser Herrlichkeit näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; das biblisch-frühchristliche Wegbild und der Begriff „Gerechtigkeit“ bleiben erhalten. Keine Fußnoten erforderlich.
