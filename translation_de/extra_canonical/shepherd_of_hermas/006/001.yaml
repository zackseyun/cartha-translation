  verdict: revise
  source_fidelity: Die Zeitangabe, das Fasten, die Offenbarung und die Einleitung des folgenden Schriftwortes sind zutreffend wiedergegeben. Das griechische ἐρωτήσαντος τὸν Κύριον bezeichnet jedoch zunächst, dass Hermas den Herrn „vieles fragte“; „um vieles bat“ legt den Sinn stärker auf bittendes Gebet fest, als der Wortlaut erfordert.
  naturalness: Die Fassung ist klar und modernes Standarddeutsch. „Es stand Folgendes geschrieben“ ist gegenüber „Geschrieben stand Folgendes“ etwas unmittelbarer und idiomatischer.
  terminology: „Verständnis der Schrift“ gibt γνῶσις τῆς γραφῆς im Kontext angemessen wieder. „Schrift“ ist hier als die offenbarte schriftliche Mitteilung zu verstehen und muss nicht kanonisch spezifiziert werden.
  issues:
  - severity: low
    issue: „den Herrn um vieles gebeten“
    rationale: Die Wiedergabe entscheidet die mögliche Bedeutung „bitten“ zugunsten einer Gebetsbitte. „Den Herrn vieles gefragt“ bildet den griechischen Wortlaut und die offene Bedeutung von ἐρωτάω genauer ab.
  - severity: low
    issue: Formulierung der Schrift-Einleitung
    rationale: „Es stand Folgendes geschrieben“ entspricht der unpersönlichen griechischen Formel ἦν δὲ γεγραμμένα ταῦτα direkter und klingt im Deutschen flüssig.
