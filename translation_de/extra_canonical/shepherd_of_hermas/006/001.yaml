  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: de
  text: 'Nachdem ich fünfzehn Tage gefastet und den Herrn vieles gefragt hatte, wurde mir das Verständnis der Schrift offenbart. Es stand Folgendes geschrieben:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ ἐρωτήσαντος τὸν Κύριον
  choice: den Herrn um vieles gebeten hatte
  rationale: ἐρωτάω kann hier sowohl »fragen« als auch »bitten« bedeuten. Im Zusammenhang von Fasten und Offenbarung ist »bitten« im Deutschen natürlicher, während »um vieles« die Offenheit von πολλά wahrt.
- source_word: ἡ γνῶσις τῆς γραφῆς
  choice: das Verständnis der Schrift
  rationale: γνῶσις bezeichnet hier die erschlossene Bedeutung beziehungsweise Erkenntnis des zuvor Geschriebenen, nicht bloß Kenntnis; »Verständnis« gibt dies idiomatisch wieder.
- source_word: ἀπεκαλύφθη μοι
  choice: wurde mir … offenbart
  rationale: Die Passivform und der Offenbarungscharakter des griechischen Verbs werden formal bewahrt.
- source_word: ἦν δὲ γεγραμμένα ταῦτα
  choice: Geschrieben stand Folgendes
  rationale: Eine natürliche, würdige deutsche Wiedergabe der einleitenden Formel, die auf den nun folgenden Wortlaut verweist.
theological_decisions:
- issue: Bedeutung von γραφή
  choice: Schrift
  alternative: das Geschriebene / die Schriftrolle
  rationale: Der Kontext meint eine konkrete schriftliche Botschaft. »Schrift« bewahrt diese Bedeutung, ohne sie ausdrücklich mit dem biblischen Kanon gleichzusetzen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache; der erzählerische Satzbau bleibt nahe am Griechischen, ohne unnatürlich zu wirken.
