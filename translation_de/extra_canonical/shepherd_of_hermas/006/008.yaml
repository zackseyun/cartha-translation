  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: de
  text: 'Denn der Herr schwor bei seinem Sohn: Diejenigen, die ihren Herrn verleugnet haben, sind von ihrem Leben abgeschnitten – nämlich diejenigen, die ihn jetzt in den kommenden Tagen verleugnen werden. Denen aber, die ihn früher verleugnet hatten, ist er wegen seines großen Erbarmens gnädig geworden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: von ihrem Leben ausgeschlossen
  rationale: Gibt das passive ἀπεγνωσθαι als endgültige Zurückweisung und ἀπὸ als Trennung wieder, ohne die mehrdeutige Wendung »ihr Leben« vorschnell als bloßen leiblichen Tod oder als Heil zu deuten.
- source_word: τοὺς νῦν μέλλοντας ἀρνεῖσθαι
  choice: die ihn jetzt … verleugnen werden
  rationale: Drückt die bevorstehende, in der Gegenwart bereits drohende Verleugnung natürlich aus; das Objekt »ihn« ist aus »ihren Herrn« eindeutig erschließbar.
- source_word: πολυσπλαγχνία
  choice: großes Erbarmen
  rationale: Bewahrt die starke Aussage über inniges, reiches Mitgefühl in würdigem modernem Deutsch.
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: ist er … gnädig geworden
  rationale: Folgt der griechischen Konstruktion und wahrt den rückblickenden Gegensatz zu der angekündigten künftigen Verleugnung.
theological_decisions:
- issue: Reichweite der Verurteilung der Verleugner
  choice: Die nähere Bestimmung wird auf diejenigen bezogen, die in den kommenden Tagen verleugnen werden.
  alternative: Alle früheren und künftigen Verleugner unterschiedslos als vom Leben ausgeschlossen darstellen.
  rationale: Der anschließende Gegensatz τοῖς δὲ πρότερον ἀρνησαμένοις zeigt, dass die Warnung speziell den unmittelbar bevorstehenden Verleugnern gilt, während für frühere Verleugner Erbarmen ausgesagt wird.
- issue: Bedeutung von ζωῆς αὐτῶν
  choice: wörtlich-offen als »ihrem Leben« wiedergegeben
  alternative: explizit »ewigem Leben«, »Heil« oder »irdischem Leben«
  rationale: Der griechische Wortlaut spezifiziert die Art des Lebens nicht; die Übersetzung bewahrt diese theologische Spannung.
- issue: Schwurformel κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: »bei seinem Sohn«
  alternative: »gegen seinen Sohn«
  rationale: Im Kontext fungiert κατά mit Genitiv als Schwurformel. »Bei« ist die natürliche deutsche Entsprechung, ohne eine Gegnerschaft zwischen Herr und Sohn zu suggerieren.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Der Satzbau macht die nachgestellte Präzisierung der bedrohten Gruppe sichtbar und erhält den scharfen Gegensatz zwischen künftiger Verleugnung und früher gewährtem Erbarmen.
