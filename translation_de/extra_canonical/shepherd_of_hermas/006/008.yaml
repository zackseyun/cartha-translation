  source_fidelity: Die Übersetzung gibt die Schwurformel, die Unterscheidung zwischen den unmittelbar bevorstehenden Verleugnern und den früheren Verleugnern sowie das Erbarmen zuverlässig wieder. Die offene Bedeutung von ζωῆς αὐτῶν bleibt erhalten. Die ungewöhnliche griechische Verknüpfung von bereits erfolgter Verleugnung und bevorstehender Verleugnung wird nicht harmonisiert.
  naturalness: „Von ihrem Leben ausgeschlossen“ ist im modernen Deutschen zwar verständlich, aber idiomatisch weniger treffend und klingt administrativ. „Von ihrem Leben abgeschnitten“ entspricht der Bildsprache von „cut off“ und lässt weiterhin offen, ob Leben hier leiblich oder in weiterem Sinn gemeint ist.
  terminology: „verleugnen“, „großes Erbarmen“ und „gnädig geworden“ sind sachgerecht und im würdigen modernen Register natürlich. „Bei seinem Sohn“ gibt die Schwurformel κατὰ τοῦ υἱοῦ αὐτοῦ angemessen wieder.
