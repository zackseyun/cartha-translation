base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: de
  text: Bleibt also standhaft, ihr, die ihr Gerechtigkeit übt, und seid nicht innerlich gespalten, damit euer Hinübergang[a] gemeinsam mit den heiligen Engeln geschieht. Selig zu preisen seid ihr alle, die ihr die kommende große Bedrängnis ertragt und euer Leben[b] nicht verleugnen werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euer Weggang«; möglicherweise ist der Übergang beim Tod gemeint.'
    reason: πάροδος kann einen Übergang oder Weggang bezeichnen; der genaue Bezug bleibt offen.
  - marker: b
    text: 'Wörtlich: »ihr Leben«. Die Formulierung ist im Zusammenhang mit dem folgenden Vers auffällig, wird hier aber nicht weiter gedeutet.'
    reason: Der Wortlaut wird bewahrt, ohne aus dem Kontext eine nicht ausdrücklich ausgesagte christologische Bedeutung abzuleiten.
lexical_decisions:
- source_word: ἐμμείνατε
  choice: Bleibt … standhaft
  rationale: Gibt das beharrliche Festhalten wieder und klingt im Deutschen natürlich und eindringlich.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: ihr, die ihr Gerechtigkeit übt
  rationale: Bewahrt den aktiven Sinn von ἐργάζομαι und den ethischen Gehalt von δικαιοσύνη.
- source_word: μὴ διψυχήσητε
  choice: seid nicht innerlich gespalten
  rationale: Das für Hermas wichtige διψυχεῖν bezeichnet ein geteiltes, schwankendes Inneres; die Wiedergabe vermeidet die Verengung auf bloßen intellektuellen Zweifel.
- source_word: πάροδος
  choice: Hinübergang
  rationale: Lässt offen, ob der Ausdruck allgemein den Übergang oder näher den Tod beziehungsweise das Lebensende meint.
- source_word: μακάριοι
  choice: Glücklich zu preisen
  rationale: Gibt eine Seligpreisung wieder, ohne μακάριος auf ein vorübergehendes Glücksgefühl zu reduzieren.
- source_word: θλῖψιν … μεγάλην
  choice: große Bedrängnis
  rationale: Entspricht dem Druck-, Not- und Verfolgungscharakter von θλῖψις, ohne vorschnell ein festes endzeitliches Schema einzutragen.
- source_word: τὴν ζωὴν αὐτῶν
  choice: euer Leben
  rationale: Folgt dem Pronomenbezug der direkten Anrede und wahrt die auffällige Formulierung des griechischen Textes.
theological_decisions:
- issue: Bedeutung von τὴν ζωὴν αὐτῶν
  choice: euer Leben
  alternative: den Herrn beziehungsweise Christus, der ihr Leben ist
  rationale: Der Text nennt ausdrücklich „ihr Leben“. Der unmittelbare Folgevers spricht zwar vom Verleugnen des Herrn und kann eine christologische Deutung nahelegen, doch sollte diese im Haupttext nicht stillschweigend eingesetzt werden.
- issue: Deutung der kommenden großen Bedrängnis
  choice: kommende große Bedrängnis
  alternative: die kommende große Trübsal als fest bestimmtes endzeitliches Ereignis
  rationale: Die bestimmte und verstärkte Formulierung wird bewahrt, ohne sie konfessionell oder systematisch näher festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit paränetischem Klang. Die direkte Anrede und der Wechsel von Aufforderung zu Seligpreisung bleiben erhalten; hermetische Fachprägungen werden verständlich, aber nicht theologisch vereindeutigt wiedergegeben.
