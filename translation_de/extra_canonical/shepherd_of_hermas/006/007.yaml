  terminology: „Gerechtigkeit übt“, „innerlich gespalten“, „große Bedrängnis“ und „heilige Engel“ sind treffend. „Hinübergang“ bewahrt die Mehrdeutigkeit von πάροδος. Die Fußnote zu „Leben“ soll keine christologische Zusatzdeutung nahelegen.
