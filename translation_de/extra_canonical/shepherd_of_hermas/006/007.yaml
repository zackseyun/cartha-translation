revisions:
- from: Bleibt also standhaft, ihr, die ihr Gerechtigkeit übt, und seid nicht innerlich gespalten, damit euer Hinübergang[a] gemeinsam mit den heiligen Engeln geschieht. Glücklich zu preisen seid ihr alle, die ihr die kommende große Bedrängnis ertragt und euer Leben[b] nicht verleugnen werdet.
  to: Bleibt also standhaft, ihr, die ihr Gerechtigkeit übt, und seid nicht innerlich gespalten, damit euer Hinübergang[a] gemeinsam mit den heiligen Engeln geschieht. Selig zu preisen seid ihr alle, die ihr die kommende große Bedrängnis ertragt und euer Leben[b] nicht verleugnen werdet.
  rationale: Der Text benötigt nur eine geringe stilistische Anpassung bei der Seligpreisungsformel. Erforderlich ist vor allem die Korrektur der Fußnote b, damit sie die semantische Offenheit des griechischen Wortlauts wahrt und keine theologische Deutung als mögliche Wortbedeutung ausgibt. Fußnotenanker und Umfang bleiben unverändert.
