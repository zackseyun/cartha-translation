base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: de
  text: „Deine Nachkommen, Hermas, haben Gott verworfen und den Herrn gelästert. In großer Bosheit haben sie ihre Eltern verraten und galten als Verräter ihrer Eltern.[a] Doch obwohl sie sie verrieten, brachte es ihnen keinen Gewinn. Vielmehr fügten sie ihren Sünden noch Ausschweifungen und Mischungen von Bosheit hinzu. So erreichten ihre gesetzlosen Taten das volle Maß.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie wurden als Verräter ihrer Eltern gehört“. Die ungewöhnliche Wendung kann bedeuten, dass sie als Verräter ihrer Eltern bekannt waren oder so bezeichnet wurden.'
    reason: ἤκουσαν προδότας γονέων ist idiomatisch und möglicherweise auch textlich unsicher. Die Fußnote dokumentiert die wörtliche Formulierung und kennzeichnet die vorsichtige Deutung im Text.
lexical_decisions:
- source_word: τὸ σπέρμα σου
  choice: deine Nachkommen
  rationale: Wörtlich »dein Same«; im Zusammenhang bezeichnet der Ausdruck die Kinder beziehungsweise Nachkommenschaft des Hermas. »Nachkommen« ist natürlich und bewahrt den kollektiven Sinn.
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: haben sich von Gott losgesagt
  rationale: ἀθετέω kann verwerfen, missachten oder treulos handeln bedeuten. Die Formulierung gibt den Bruch mit Gott wieder, ohne ihn näher dogmatisch festzulegen.
- source_word: ἀσελγηίας
  choice: Ausschweifungen
  rationale: Der Plural bezeichnet zügellose, schamlose Verhaltensweisen; »Ausschweifungen« wahrt die moralische Breite des Ausdrucks.
- source_word: συμφυρμοὺς πονηρίας
  choice: Verstrickungen in Bosheit
  rationale: συμφυρμός bezeichnet Vermengung oder verworrene Verbindung. »Verstrickungen« klingt im Deutschen natürlich und lässt die genaue Art dieser bösen Verbindungen offen.
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: ihre gesetzlosen Taten erreichten das volle Maß
  rationale: Die wörtliche Aussage, ihre Gesetzlosigkeiten seien »gefüllt worden«, ist idiomatisch als Erreichen eines vollen Maßes wiedergegeben.
theological_decisions:
- issue: Art der Abkehr von Gott in ἠθέτησαν εἰς τὸν Θεόν
  choice: haben sich von Gott losgesagt
  alternative: haben Gott verworfen / sind Gott untreu geworden
  rationale: Der griechische Ausdruck benennt eine schwerwiegende Zurückweisung oder Untreue, legt aber keine ausgearbeitete Lehre über Abfall oder Heilsverlust fest. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede und der anklagende Ton bleiben erhalten; schwer verständliche griechische Wendungen werden idiomatisch wiedergegeben, wobei echte Unsicherheit in einer Fußnote offengelegt wird.
