  to: „Deine Nachkommen, Hermas, haben Gott verworfen und den Herrn gelästert. In großer Bosheit haben sie ihre Eltern verraten und galten als Verräter ihrer Eltern.[a] Doch obwohl sie sie verrieten, brachte es ihnen keinen Gewinn. Vielmehr fügten sie ihren Sünden noch Ausschweifungen und Mischungen von Bosheit hinzu. So erreichten ihre gesetzlosen Taten das volle Maß.“
