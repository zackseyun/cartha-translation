base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: de
  text: 'Denn der Gebieter schwor bei seiner Herrlichkeit im Blick auf seine Erwählten: Wenn nach diesem festgesetzten Tag noch Sünde geschieht, haben sie keine Rettung. Denn für die Gerechten hat die Umkehr ein Ende. Für alle Heiligen sind die Tage der Umkehr erfüllt; für die Völker aber ist Umkehr bis zum letzten Tag möglich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: der Gebieter
  rationale: Gibt den Sinn von δεσπότης als souveränem Herrn wieder und unterscheidet den Ausdruck vom im Kontext ebenfalls vorkommenden κύριος.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Sinnes- und Lebenswendung; das moderne deutsche Wort ist verständlich und vermeidet eine Verengung auf bloße Reue.
- source_word: σωτηρία
  choice: Rettung
  rationale: Bewahrt den umfassenden Sinn des griechischen Begriffs, ohne ihn vorschnell dogmatisch zu spezifizieren.
- source_word: τοῖς ἔθνεσιν
  choice: für die Völker
  rationale: Entspricht formal dem Plural ἔθνη und lässt offen, ob vor allem Nichtjuden, Außenstehende oder die Nationen allgemein gemeint sind.
- source_word: ἐπὶ τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: im Blick auf seine Erwählten
  rationale: Gibt die Bezugnahme des Schwurs wieder, ohne die Präposition übermäßig räumlich oder feindlich als „gegen“ zu deuten.
- source_word: ἐὰν ὡρισμένης τῆς ἡμέρας ταύτης ἔτι ἁμάρτησις γένηται
  choice: Wenn nach diesem festgesetzten Tag noch Sünde geschieht
  rationale: Folgt der wahrscheinlich gemeinten zeitlichen Aussage der schwierigen griechischen Formulierung und bewahrt die unpersönliche Wendung „Sünde geschieht“.
theological_decisions:
- issue: Begrenzung der Umkehr für Gerechte und Heilige
  choice: Die zeitliche Endgültigkeit der Aussage wird unverändert wiedergegeben.
  alternative: Die Aussage als bloße Warnung oder als Begrenzung nur einer besonderen zweiten Buße abschwächen.
  rationale: Der griechische Text formuliert ausdrücklich ein Ende beziehungsweise erfüllte Tage der μετάνοια; eine harmonisierende dogmatische Einschränkung wäre nicht im vorliegenden Wortlaut begründet.
- issue: Folge weiterer Sünde nach dem festgesetzten Tag
  choice: „haben sie keine Rettung“
  alternative: „können sie nicht gerettet werden“ oder „verlieren sie ihr Heil“
  rationale: Die gewählte Form bleibt eng bei μὴ ἔχειν αὐτοὺς σωτηρίαν und entscheidet nicht zusätzlich, ob ein zuvor besessener Zustand verloren geht.
- issue: Identität der „Völker“
  choice: Der Ausdruck bleibt als „Völker“ stehen.
  alternative: „Heiden“ oder „Nichtchristen“
  rationale: Der Kontext legt Außenstehende nahe, doch ἔθνη allein rechtfertigt keine vollständige konfessionelle oder heilsgeschichtliche Präzisierung.
translation_notes:
  register: Dignifizierter, moderner Standarddeutsch-Stil mit kurzen, eindringlichen Sätzen. Die strenge theologische Spannung des Ausgangstextes bleibt erhalten; schwierige Aussagen werden weder abgeschwächt noch systematisch aufgelöst.
