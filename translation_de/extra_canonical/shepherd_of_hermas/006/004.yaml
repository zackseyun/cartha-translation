base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: de
  text: Nachdem du ihnen diese Worte bekannt gemacht hast, die der Gebieter mir aufgetragen hat, dir zu offenbaren, werden ihnen alle Sünden vergeben, die sie zuvor begangen haben – ebenso allen Heiligen, die bis zu diesem Tag gesündigt haben, sofern sie von ganzem Herzen umkehren und den Zwiespalt aus ihrem Herzen beseitigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: Gebieter
  rationale: Bewahrt die Bedeutung eines Herrn mit unumschränkter Autorität und unterscheidet den Ausdruck vom sonstigen κύριος, ohne im Deutschen unnatürlich zu wirken.
- source_word: ἀφίενται
  choice: werden ... vergeben
  rationale: Das Präsens wird im durch τότε eingeleiteten Folgesatz idiomatisch als zukünftige Folge wiedergegeben; die passive Vergebung bleibt erhalten.
- source_word: οἱ ἅγιοι
  choice: die Heiligen
  rationale: Gibt die gemeinschaftliche Bezeichnung formal wieder, ohne sie konfessionell einzuengen.
- source_word: μετανοήσωσιν
  choice: umkehren
  rationale: Erfasst die umfassende Sinnes- und Lebenswende stärker als bloße Reue.
- source_word: διψυχίας
  choice: innere Zerrissenheit
  rationale: Bezeichnet ein geteiltes, schwankendes Herz. Die natürliche deutsche Wendung bewahrt das Bild der inneren Uneinigkeit, ohne es vorschnell als bloßen Zweifel festzulegen.
theological_decisions:
- issue: Bedingung und Reichweite der Vergebung
  choice: Die Vergebung gilt Hermas’ Angehörigen und ebenso allen bis zu diesem Tag sündig gewordenen Heiligen, sofern sie ganzherzig umkehren und ihre innere Zerrissenheit ablegen.
  alternative: Die Bedingung könnte grammatisch nur auf „alle Heiligen“ bezogen werden.
  rationale: Der Satzbau stellt beide Gruppen unter die eine abschließende ἐάν-Bedingung; die Übersetzung lässt diese gemeinsame Reichweite erkennen.
- issue: Zeitpunkt der Vergebung
  choice: „werden ... vergeben“ als Folge der Bekanntmachung
  alternative: „werden ... vergeben sein“ oder präsentisch „sind ... vergeben“
  rationale: τότε markiert die anschließende Folge. Das griechische Präsenspassiv kann in diesem Zusammenhang im Deutschen natürlich futurisch wiedergegeben werden, ohne einen besonderen dogmatischen Zeitpunkt zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte griechische Syntax wurde lesbar gegliedert, während Bedingung, Passivform und theologische Spannung des Satzes erhalten bleiben. Keine Fußnoten erforderlich.
