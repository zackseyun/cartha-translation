revisions:
- from: Wenn sie nun von jeder Art Bedrängnis bedrängt worden sind, werden sie mir zu heilsamer Erziehung übergeben und im Glauben an den Herrn gestärkt. Die übrigen Tage ihres Lebens dienen sie dem Herrn mit reinem Herzen. Wenn sie aber umkehren, kommen ihnen die bösen Taten, die sie begangen haben, zu Bewusstsein. Dann preisen sie Gott und sagen, dass er ein gerechter Richter ist und jeder zu Recht entsprechend seinen Taten gelitten hat. Von da an dienen sie dem Herrn mit reinem Herzen und haben bei allem, was sie tun, Erfolg; denn sie empfangen vom Herrn alles, worum sie bitten. Dann preisen sie den Herrn dafür, dass sie mir übergeben wurden, und müssen nichts Böses mehr erleiden.
  to: Wenn sie nun von allerlei Bedrängnis geplagt werden, werden sie mir zu einer guten Erziehung übergeben und im Glauben an den Herrn gestärkt. Die übrigen Tage ihres Lebens dienen sie dem Herrn mit reinem Herzen. Wenn sie aber umkehren, kommen ihnen die bösen Taten, die sie begangen haben, zu Bewusstsein. Dann preisen sie Gott und sagen, dass er ein gerechter Richter ist und jeder zu Recht entsprechend seinen Taten gelitten hat. Von da an dienen sie dem Herrn mit reinem Herzen und haben bei allem, was sie tun, Erfolg; sie empfangen vom Herrn alles, worum sie bitten. Dann preisen sie den Herrn dafür, dass sie mir übergeben wurden, und müssen keine Übel mehr erleiden.
  rationale: Die Revision korrigiert den zeitlich-aspektuellen Wert der einleitenden Bedingung, vermeidet eine nicht ausdrücklich gegebene Kausalverknüpfung und bewahrt am Schluss den pluralischen Charakter der Übel. Im Übrigen bleibt die Übersetzung in Aussage, Register und theologischer Offenheit beim Entwurf.
