base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: de
  text: Wenn sie nun von allerlei Bedrängnis geplagt werden, werden sie mir zu einer guten Erziehung übergeben und im Glauben an den Herrn gestärkt. Die übrigen Tage ihres Lebens dienen sie dem Herrn mit reinem Herzen. Wenn sie aber umkehren, kommen ihnen die bösen Taten, die sie begangen haben, zu Bewusstsein. Dann preisen sie Gott und sagen, dass er ein gerechter Richter ist und jeder zu Recht entsprechend seinen Taten gelitten hat. Von da an dienen sie dem Herrn mit reinem Herzen und haben bei allem, was sie tun, Erfolg; sie empfangen vom Herrn alles, worum sie bitten. Dann preisen sie den Herrn dafür, dass sie mir übergeben wurden, und müssen keine Übel mehr erleiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῶσι πάσῃ θλίψει
  choice: von jeder Art Bedrängnis bedrängt worden sind
  rationale: Bewahrt die emphatische Wortwiederholung des Griechischen, gibt πάσῃ aber idiomatisch als umfassende Vielfalt wieder.
- source_word: ἀγαθὴν παιδείαν
  choice: heilsamer Erziehung
  rationale: παιδεία bezeichnet formende, korrigierende Erziehung beziehungsweise Zucht; „heilsam“ vermittelt den positiven Zweck von ἀγαθή ohne unnötig strafrechtliche Verengung.
- source_word: ἰσχυροποιοῦνται
  choice: werden … gestärkt
  rationale: 'Natürliche deutsche Wiedergabe des passiven Sinns: Sie werden stark gemacht beziehungsweise gefestigt.'
- source_word: μετανοήσωσι
  choice: umkehren
  rationale: Erfasst die ethisch-religiöse Neuorientierung, ohne den Begriff auf bloßes Bedauern zu reduzieren.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτῶν
  choice: kommen ihnen … zu Bewusstsein
  rationale: 'Gibt das semitisch gefärbte Bild idiomatisch wieder: Die früheren Taten steigen in ihrem Inneren auf und werden bewusst.'
- source_word: εὐοδοῦνται ἐν πάσῃ πράξει αὐτῶν
  choice: haben bei allem, was sie tun, Erfolg
  rationale: Überträgt den Erfolgs- beziehungsweise Gelingenssinn von εὐοδόομαι in natürlichem modernem Deutsch.
- source_word: οὐκέτι οὐδὲν πάσχουσι τῶν πονηρῶν
  choice: müssen nichts Böses mehr erleiden
  rationale: Bewahrt den passiven Leidenssinn von πάσχουσι und lässt offen, ob τῶν πονηρῶν Übel, schlimme Widerfahrnisse oder andere böse Dinge bezeichnet.
theological_decisions:
- issue: Verhältnis von Bedrängnis, Erziehung und Umkehr
  choice: Die Bedrängnisse werden als vorausgehende Erfahrung, die Übergabe als heilsame Erziehung und die Umkehr als konditional dargestellt.
  alternative: Die Bedrängnisse unmittelbar als Gottes Strafurteil oder die Umkehr als zwangsläufige Folge auslegen.
  rationale: Der griechische Text unterscheidet θλῖψις, παιδεία und die Bedingung ἐὰν μετανοήσωσι; diese Spannung darf nicht eingeebnet werden.
- issue: Gerechtes Leiden entsprechend den Taten
  choice: „jeder [hat] zu Recht entsprechend seinen Taten gelitten“
  alternative: Das Leiden als sühnende Bezahlung oder als endgültige Verdammnis bestimmen.
  rationale: Der Text behauptet gerechte Entsprechung, erklärt aber weder einen präzisen Sühnemechanismus noch endgültiges Gericht.
- issue: Erhörung der Bitten nach der Umkehr
  choice: Die umfassende Aussage „alles, worum sie bitten“ bleibt unqualifiziert stehen.
  alternative: Sie durch Bedingungen aus anderen theologischen Texten ausdrücklich einschränken.
  rationale: Die starke Formulierung des Ausgangstextes soll ohne importierte dogmatische Harmonisierung erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die bildhafte Wiederholung bei θλίβω/θλῖψις bleibt maßvoll hörbar; die idiomatisch schwer verständliche Herzformel wird sinngemäß als Bewusstwerden wiedergegeben. Keine Fußnoten erforderlich.
