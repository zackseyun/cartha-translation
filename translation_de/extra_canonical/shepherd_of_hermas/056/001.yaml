  to: 'Als ich nun sah, wie sie so gegeißelt und gequält wurden, war ich über sie betrübt, weil sie auf diese Weise gefoltert wurden und überhaupt keinen Nachlass hatten. Ich sagte zu dem Hirten, der mit mir sprach: »Herr, wer ist dieser Hirte, der so erbarmungslos und hart ist und überhaupt kein Mitgefühl mit diesen Schafen hat?« Er sagte: »Das ist der Engel der Bestrafung. Er gehört zu den gerechten Engeln und ist über die Bestrafung eingesetzt. Er übernimmt diejenigen, die von Gott abgeirrt sind und den Begierden und Täuschungen dieses Zeitalters nachgegangen sind, und bestraft sie, wie sie es verdienen, mit schweren und vielfältigen Strafen.«'
