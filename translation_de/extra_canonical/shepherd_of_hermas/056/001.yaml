base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: de
  text: 'Als ich nun sah, wie sie so gegeißelt und gequält wurden, war ich über sie betrübt, weil sie auf diese Weise gefoltert wurden und überhaupt keinen Nachlass hatten. Ich sagte zu dem Hirten, der mit mir sprach: »Herr, wer ist dieser Hirte, der so erbarmungslos und hart ist und überhaupt kein Mitgefühl mit diesen Schafen hat?« Er sagte: »Das ist der Engel der Bestrafung. Er gehört zu den gerechten Engeln und ist über die Bestrafung eingesetzt. Er übernimmt diejenigen, die von Gott abgeirrt sind und den Begierden und Täuschungen dieses Zeitalters nachgegangen sind, und bestraft sie, wie sie es verdienen, mit schweren und vielfältigen Strafen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα
  choice: gegeißelt
  rationale: Gibt die konkrete und harte Bildsprache des griechischen Verbs wieder.
- source_word: ταλαιπωρούμενα
  choice: gequält
  rationale: Drückt das schwere Leiden natürlich und verständlich aus, ohne es mit dem folgenden βασανίζω gleichzusetzen.
- source_word: ἀνοχήν
  choice: Ruhepause
  rationale: Bezeichnet hier ein Aussetzen beziehungsweise einen Aufschub der Qual; »Ruhepause« ist im Zusammenhang unmittelbar verständlich.
- source_word: ἄσπλαγχνος
  choice: erbarmungslos
  rationale: Bewahrt den starken Vorwurf fehlenden Erbarmens.
- source_word: πικρός
  choice: hart
  rationale: Im Kontext charakterisiert das Wort die strenge, schonungslose Art des Hirten; »hart« klingt im Deutschen natürlicher als das wörtliche »bitter«.
- source_word: ἄγγελος τῆς τιμωρίας
  choice: Engel der Bestrafung
  rationale: Formale Wiedergabe der Genitivverbindung, ohne die Art oder Dauer der Strafe näher festzulegen.
- source_word: παραλαμβάνει
  choice: nimmt … in seine Obhut
  rationale: Gibt die Übernahme der Abgeirrten durch den Strafengel wieder und erhält zugleich das Hirtenbild.
- source_word: αἰών τούτου
  choice: diese Weltzeit
  rationale: Bewahrt den zeitlich-weltlichen Bedeutungsumfang von αἰών besser als das schlichte »Welt«.
- source_word: δειναῖς καὶ ποικίλαις τιμωρίαις
  choice: mit schweren und vielfältigen Strafen
  rationale: »Schwer« vermittelt die furchtbare Härte von δεινός idiomatisch; »vielfältig« erhält den Hinweis auf verschiedene Strafweisen.
theological_decisions:
- issue: Status des Strafengels
  choice: »Er gehört zu den gerechten Engeln«
  alternative: »Er ist von den Engeln der Gerechten«
  rationale: Der griechische Ausdruck bezeichnet am natürlichsten seine Zugehörigkeit zu den gerechten Engeln; die Übersetzung vermeidet, ihn als böse Macht darzustellen.
- issue: Grundlage und Ausmaß der Bestrafung
  choice: »wie sie es verdienen«
  alternative: »entsprechend ihrer Würdigkeit«
  rationale: Gibt καθὼς ἄξιοί εἰσι verständlich wieder, ohne eine über den Text hinausgehende Straftheorie oder Aussage zur Dauer einzutragen.
- issue: Bezeichnung Κύριε in der Anrede an den Hirten
  choice: »Herr«
  alternative: »Mein Herr« oder »Meister«
  rationale: Die formale Anrede bleibt erhalten; der Kontext zeigt, dass hier der Hirte und nicht Gott angesprochen wird.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer direkter Rede. Die drastische Bildsprache und die Spannung zwischen dem als gerecht bezeichneten Engel und seinem scheinbar erbarmungslosen Handeln bleiben bestehen. Der eingeklammerte textkritisch unsichere Zusatz οὕτως wird sinngemäß als »so« wiedergegeben, da er gut bezeugten Kontextinhalt wiederholt; eine Fußnote ist für diesen kurzen Leserabschnitt nicht erforderlich.
