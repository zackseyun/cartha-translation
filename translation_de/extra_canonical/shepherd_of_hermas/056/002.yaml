  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: de
  text: '„Ich wollte, Herr“, sagte ich, „wissen, welcher Art diese verschiedenen Strafen sind.“ Er sagte: „Höre! Die verschiedenen Strafen und Qualen sind Leiden dieses Lebens. Denn die einen werden durch Verluste bestraft, andere durch Entbehrungen, andere durch mancherlei Krankheiten, andere durch allerlei Unordnung[1]; wieder andere werden von unwürdigen Menschen beschimpft und haben auf vielerlei andere Weise zu leiden. Denn viele sind in ihren Plänen unstet, nehmen sich vieles vor, und überhaupt nichts gelingt ihnen. Sie sagen, sie hätten bei ihren Unternehmungen keinen Erfolg; doch es kommt ihnen nicht in den Sinn, dass sie Böses getan haben, sondern sie geben dem Herrn die Schuld.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Die Worte „allerlei“ (griechisch πάσῃ) stehen in der herangezogenen Textausgabe in eckigen Klammern und sind daher textlich unsicher.
    reason: Kennzeichnet die im griechischen Ausgangstext als unsicher ausgewiesene Lesart, ohne die Aussage dogmatisch oder inhaltlich auszuweiten.
lexical_decisions:
- source_word: ποταπαί
  choice: welcher Art
  rationale: Gibt die Frage nach Beschaffenheit beziehungsweise Art der verschiedenen Strafen idiomatisch wieder.
- source_word: βιωτικαί ... βάσανοι
  choice: Leiden dieses Lebens
  rationale: βιωτικός bezeichnet das gegenwärtige irdische Leben; „Leiden“ vermeidet im Deutschen die schwerfällige Wiederholung von „Qualen“.
- source_word: ζημίαις
  choice: durch Verluste
  rationale: Bewahrt den allgemeinen Sinn materieller oder sonstiger Einbußen, ohne ihn unnötig einzuengen.
- source_word: ὑστερήσεσιν
  choice: durch Entbehrungen
  rationale: Drückt Mangel und Vorenthaltung gegenüber ζημίαις unterscheidbar aus.
- source_word: ἀκαταστασίᾳ
  choice: Unbeständigkeit
  rationale: Passt zum anschließenden ἀκαταστατοῦντες und bezeichnet ungeordnete, instabile Lebens- oder Planungslagen; die eingeklammerte Lesart πάσῃ wird mit „völlige“ berücksichtigt.
- source_word: ὑπὸ ἀναξίων
  choice: von unwürdigen Menschen
  rationale: Das substantivierte Adjektiv bezeichnet Personen; „Menschen“ wird zur natürlichen deutschen Verständlichkeit ergänzt.
- source_word: πράξεσι
  choice: Umständen
  rationale: Im Ausdruck ἑτέραις πολλαῖς πράξεσι πάσχοντες ist „Umstände“ im Deutschen natürlicher als das missverständliche „Taten“, während die breite Aussage erhalten bleibt.
- source_word: ἐπιβάλλονται πολλά
  choice: nehmen sich vieles vor
  rationale: Gibt das Beginnen oder Inangriffnehmen vieler Vorhaben im Zusammenhang mit unsteten Plänen idiomatisch wieder.
- source_word: οὐδὲν ... προχωρεῖ
  choice: überhaupt nichts gelingt ihnen
  rationale: Vermittelt, dass ihre Vorhaben nicht vorankommen beziehungsweise keinen Erfolg haben.
- source_word: οὐκ ἀναβαίνει ... ἐπὶ τὴν καρδίαν
  choice: es kommt ihnen nicht in den Sinn
  rationale: Natürliches deutsches Idiom für die semitisch gefärbte Wendung, ohne den Aussagegehalt zu verändern.
theological_decisions:
- issue: Charakter der Strafen
  choice: Die Strafen werden als Leiden dieses Lebens bezeichnet.
  alternative: Die Strafen als jenseitige Qualen oder unmittelbare Einzelakte Gottes auslegen.
  rationale: Der griechische Text bestimmt sie ausdrücklich als βιωτικαί βάσανοι und zählt gegenwärtige Lebensnöte auf; weitergehende dogmatische Festlegungen wären ein Import.
- issue: Zuschreibung der Schuld an den Herrn
  choice: „sie geben dem Herrn die Schuld“
  alternative: „sie klagen den Herrn an“
  rationale: αἰτιῶνται bezeichnet ein Verantwortlichmachen oder Beschuldigen. Die gewählte Form ist klar und wahrt die theologische Spannung, ohne sie abzuschwächen oder zu erklären.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die Anrede κύριε wird traditionsgemäß als „Herr“ wiedergegeben. Wiederholungen des griechischen Textes bleiben dort erhalten, wo sie argumentativ tragen; schwerfällige Wortwiederholungen werden im Deutschen behutsam variiert. Für diesen Leserabschnitt sind keine Fußnoten erforderlich.
