  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/003.yaml
  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: de
  text: Wenn du nun das Fasten so vollendest, wie ich dir geboten habe, wird dein Opfer bei Gott wohlgefällig sein, und dieses Fasten wird verzeichnet werden. Ein auf diese Weise vollzogener Dienst ist gut, freudig und dem Herrn willkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς
  choice: vollendest
  rationale: Gibt den Gedanken wieder, das Fasten in der gebotenen Weise vollständig auszuführen.
- source_word: θυσία
  choice: Opfer
  rationale: Die direkte kultische Entsprechung bewahrt die Bildsprache des Ausgangstextes.
- source_word: δεκτὴ παρὰ τῷ Θεῷ
  choice: bei Gott wohlgefällig
  rationale: Natürliches, würdiges Deutsch für die Annahme des Opfers durch Gott.
- source_word: ἔγγραφος
  choice: verzeichnet
  rationale: Bewahrt die Vorstellung, dass das Fasten schriftlich festgehalten beziehungsweise registriert wird, ohne ein bestimmtes himmlisches Buch ausdrücklich einzuführen.
- source_word: λειτουργία
  choice: Dienst
  rationale: Im Kontext bezeichnet das Wort die auf diese Weise ausgeübte religiöse Leistung oder den Dienst; „Gottesdienst“ wäre hier möglicherweise zu eng institutionell verstanden.
- source_word: ἱλαρά
  choice: freudig
  rationale: Gibt die positive, heitere und bereitwillige Qualität des Dienstes idiomatisch wieder.
- source_word: εὐπρόσδεκτος
  choice: willkommen
  rationale: Drückt die bereitwillige Annahme durch den Herrn aus und unterscheidet sich stilistisch von δεκτή.
theological_decisions:
- issue: Verzeichnung des Fastens
  choice: wird verzeichnet werden
  alternative: wird angerechnet werden
  rationale: Der Ausgangstext enthält ausdrücklich die Schrift- beziehungsweise Registermetapher; „angerechnet“ würde stärker deutend eine Verdienstlehre nahelegen.
- issue: λειτουργία als religiöser Dienst
  choice: Dienst
  alternative: Gottesdienst / Dienstleistung
  rationale: „Dienst“ hält die Bedeutung offen zwischen religiösem Vollzug und tätigem Dienst und importiert keine spätere liturgische Fachbedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für heutige Leser in zwei Sätze gegliedert.
