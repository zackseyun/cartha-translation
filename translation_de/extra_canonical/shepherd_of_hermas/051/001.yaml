lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an den Gesprächspartner wird direkt und würdevoll wiedergegeben; der Kontext unterscheidet ihn vom später ausdrücklich genannten ‚Herrn‘ im göttlichen Sinn.
- source_word: παραβολὰς
  choice: Gleichnisse
  rationale: Die übliche und sachlich passende Wiedergabe für bildhafte Lehrreden oder Vergleiche.
- source_word: οὐ γινώσκω
  choice: ich verstehe … nicht
  rationale: Im Zusammenhang geht es nicht um bloße Kenntnis, sondern um das Erfassen der Bedeutung der Gleichnisse.
- source_word: οὐδὲ δύναμαι νοῆσαι
  choice: und kann sie auch nicht begreifen
  rationale: Bewahrt die verstärkende zweite Aussage und gibt νοεῖν als geistiges Erfassen wieder.
- source_word: ἐπιλύσῃς
  choice: erklärst
  rationale: Das Verb bezeichnet hier das Auflösen beziehungsweise Deuten des Sinns; ‚erklären‘ ist dafür natürliches modernes Deutsch.
