  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: de
  text: 'Er sagt: »Ich werde dir alles erklären, und alles, was ich mit dir rede, werde ich dir zeigen. Wer die Gebote deiner Besonnenheit empfangen hat, wird seine eigene Seele erfüllen und für dich zum Herrn beten.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des letzten Satzes ist ungewöhnlich und möglicherweise textlich gestört. Insbesondere ist die Verbindung „die Gebote deiner Besonnenheit“ (wörtlich: „Gebote … deiner Besonnenheit“) schwer verständlich. Auch bleibt offen, wodurch die eigene Seele erfüllt wird.'
    reason: Die Anmerkung kennzeichnet die sprachliche und mögliche textkritische Schwierigkeit, ohne den überlieferten Bezug „deiner“ oder eine bestimmte Deutung zu unterschlagen.
lexical_decisions:
- source_word: ἐπιλύσω
  choice: erklären
  rationale: Das Verb bezeichnet hier das Auflösen beziehungsweise Deuten der zuvor genannten Gleichnisse; „erklären“ ist im modernen Deutsch natürlich und sachlich genau.
- source_word: δείξω
  choice: zeigen
  rationale: Bewahrt die konkrete Bildlichkeit des griechischen Verbs und unterscheidet es von ἐπιλύσω („erklären“).
- source_word: φρόνησις
  choice: Besonnenheit
  rationale: Gibt praktische Einsicht und verständiges Urteilsvermögen wieder, ohne den Ausdruck auf rein intellektuelle „Klugheit“ zu verengen.
- source_word: ἐμπλήσῃ τὴν ἑαυτοῦ ψυχήν
  choice: wird seine Seele erfüllen
  rationale: Folgt der ungewöhnlichen Formulierung des überlieferten griechischen Textes, statt ein nicht ausdrücklich genanntes Objekt oder Mittel ergänzend einzutragen.
- source_word: εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον
  choice: wird für dich zum Herrn beten
  rationale: „Zum Herrn beten“ gibt die Gebetsrichtung πρὸς τὸν Κύριον wieder; „für dich“ entspricht ὑπὲρ σοῦ.
theological_decisions:
- issue: Verhältnis von empfangenen Geboten, innerer Erfüllung und Fürbitte
  choice: Die Abfolge wird ohne zusätzliche Erklärung oder kausale Ergänzung wiedergegeben.
  alternative: „Wer deine weisen Weisungen angenommen hat, wird davon innerlich erfüllt sein und für dich beten.“
  rationale: Der Ausgangstext lässt offen, wodurch die Seele erfüllt wird. Eine Ergänzung wie „davon“ würde die theologische und syntaktische Spannung stillschweigend auflösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt klar und mündlich, ohne salopp zu wirken. Die auffällige Formulierung des letzten Satzes wird nicht konfessionell oder spekulativ geglättet; ihre textliche Unsicherheit wird ausdrücklich vermerkt.
