  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: de
  text: Dies alles sollst du zusammen mit deinen Kindern und deinem ganzen Haus so befolgen. Wenn du dies befolgt hast, wirst du selig sein. Und alle, die dies hören und befolgen, werden selig sein und vom Herrn Einsicht empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: befolgen
  rationale: Das Verb bezeichnet hier nicht bloß ein Bewahren im Gedächtnis, sondern das gehorsame Einhalten der zuvor gegebenen Weisungen.
- source_word: τέκνων
  choice: Kindern
  rationale: Direkte und natürliche Wiedergabe im Zusammenhang des gesamten Hauses.
- source_word: ὅλου τοῦ οἴκου σου
  choice: deinem ganzen Haus
  rationale: Bewahrt den möglichen weiteren Sinn von Haushalt beziehungsweise Hausgemeinschaft, ohne ihn auf die Kernfamilie zu verengen.
- source_word: μακάριος / μακάριοι
  choice: selig
  rationale: Die traditionsreiche, zugleich verständliche Wiedergabe wahrt den religiösen Sinn einer von Gott gewährten glücklichen Stellung.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: Gibt geistiges Verständnis oder Urteilsvermögen wieder, ohne den Begriff unnötig dogmatisch festzulegen.
theological_decisions:
- issue: Verhältnis von Befolgen und Seligsein
  choice: Die konditionale Folge bleibt entsprechend dem griechischen Wortlaut unmittelbar stehen.
  alternative: Das Seligsein ausdrücklich als Lohn oder als Heil im dogmatischen Sinn auslegen.
  rationale: Der Text verbindet das Befolgen mit dem Seligsein, bestimmt jedoch weder dessen Mechanismus noch dessen genaue heilsgeschichtliche Bedeutung.
- issue: Herkunft der Einsicht
  choice: „vom Herrn Einsicht empfangen“
  alternative: „durch den Herrn verständig werden“
  rationale: Die Formulierung bewahrt den Herrn ausdrücklich als Geber und vermeidet eine weitergehende Deutung der Art dieser Gabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom Singular zur verallgemeinernden Mehrzahl und die Wiederholung von „befolgen“ bleiben erhalten. Das griechische „Haus“ wird nicht erläuternd zu „Haushalt“ verengt.
