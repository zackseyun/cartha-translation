    issue: Vorzeitigkeit von τηρήσας abgeschwächt
    rationale: Das Partizip bedeutet wörtlich „nachdem du dies bewahrt/befolgt hast“. „Wenn du es befolgst“ ist inhaltlich nahe, lässt aber die abgeschlossene bzw. vorausgesetzte Befolgung weniger erkennen.
  - severity: low
    issue: Pluralischer Bezug von ταῦτα geglättet
    rationale: „Das“ und „es“ sind als Sammelbezug möglich, aber „dies alles“ spiegelt die mehreren zuvor genannten Weisungen klarer wider.
