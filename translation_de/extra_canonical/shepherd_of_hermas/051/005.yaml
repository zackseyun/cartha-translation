base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: de
  text: 'Ich sage zu ihm: »Herr, da ich dich bei mir habe, muss ich dich bitten und befragen; denn du zeigst mir alles und redest mit mir. Wenn ich dies aber ohne dich sähe oder hörte, würde ich den Herrn bitten, es mir verständlich zu machen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede des griechischen Textes; der Zusammenhang unterscheidet den angesprochenen Deuter durch das Pronomen »dich« von »dem Herrn« im späteren Satz.
- source_word: ἀνάγκην ἔχω
  choice: muss ich
  rationale: Gibt die idiomatische Bedeutung »ich sehe mich genötigt / es ist für mich nötig« knapp und natürlich wieder.
- source_word: αἰτεῖσθαι καὶ ἐπερωτᾶν
  choice: bitten und befragen
  rationale: 'Erhält die beiden unterschiedlichen Verben: eine Bitte äußern und gezielt Auskunft erfragen.'
- source_word: ἄτερ σοῦ
  choice: ohne dich
  rationale: Natürliche und genaue Wiedergabe der Abwesenheit des Gesprächspartners.
- source_word: δηλωθῇ
  choice: es mir verständlich zu machen
  rationale: Das Passiv bezeichnet, dass der Inhalt offenbar beziehungsweise klar gemacht wird; die Formulierung ist im Deutschen idiomatisch und bewahrt den Sinn.
theological_decisions:
- issue: Unterscheidung zwischen dem angeredeten κύριε und τὸν Κύριον
  choice: Beide mit »Herr« wiedergeben, die referenzielle Unterscheidung aber durch den Satzbau bewahren
  alternative: Die erste Anrede mit »mein Herr« oder »Herr Gebieter« wiedergeben
  rationale: Das Griechische verwendet in beiden Fällen κύριος. Eine lexikalische Differenzierung würde eine im Ausgangstext nicht ausdrücklich markierte Unterscheidung einführen; der Kontext macht hinreichend deutlich, dass zunächst der Gesprächspartner und danach der göttliche Herr gemeint ist.
- issue: Art der erbetenen Offenbarung
  choice: »es mir verständlich zu machen«
  alternative: »damit es mir offenbart würde«
  rationale: δηλόω kann »deutlich, offenbar, bekannt machen« bedeuten. Die gewählte Fassung wahrt den Erkenntnisbezug des Zusammenhangs, ohne eine stärker technische Offenbarungsterminologie aufzudrängen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die leichte Förmlichkeit von »bitten und befragen« entspricht dem antiken Dialog, bleibt aber für heutige Leser klar. Der griechische irreale Bedingungssatz wurde mit deutschem Konjunktiv II wiedergegeben.
