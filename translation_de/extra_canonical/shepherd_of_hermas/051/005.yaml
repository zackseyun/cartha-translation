  source_fidelity: 'Die Übersetzung gibt den griechischen Satzbau und Sinn zuverlässig wieder: ἔχων σὲ μεθ’ ἑαυτοῦ ist treffend als „da ich dich bei mir habe“ gefasst; ἀνάγκην ἔχω wird idiomatisch mit „muss ich“ wiedergegeben. Die Paarung αἰτεῖσθαι καὶ ἐπερωτᾶν bleibt in „bitten und befragen“ erhalten. Der irreale Bedingungssatz mit Konjunktiv II („sähe oder hörte … würde ich“) entspricht εἰ … ἔβλεπον ἢ ἤκουον … ἠρώτων ἄν. „Es mir verständlich zu machen“ ist eine natürliche Wiedergabe von ἵνα μοι δηλωθῇ, ohne unnötig technische Offenbarungssprache einzutragen.'
