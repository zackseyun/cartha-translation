  verdict: revise
  source_fidelity: Der Entwurf gibt den griechischen Satzbau, den Kontrast zwischen den vielen Sünden des Angeredeten und den Vergehen seines Hausverbands sowie Zweck und zeitliche Begrenzung der Bedrängnis insgesamt zuverlässig wieder. »Dein Haus« kann im modernen Deutsch jedoch leicht als Gebäude missverstanden werden, während οἶκος hier den Hausverband bezeichnet. Außerdem ist »wurde … erbittert« zwar nahe am Bild von παρεπικράνθη, im Deutschen aber nicht idiomatisch.
  naturalness: Die direkte Rede ist klar und würdig. »Dein Haushalt«, »geriet … in Bitterkeit« und »dieses Zeitalters« sind im modernen Standarddeutsch verständlicher und bewahren die Aussage präziser als »dein Haus«, »wurde … erbittert« und »Weltzeit«.
  terminology: »Gesetzlosigkeiten« wahrt die Unterscheidung von ἀνομίαι und ἁμαρτίαι. »Umkehren« gibt μετανοεῖν sachgerecht wieder. »Engel der Bestrafung« erhält den Genitiv τῆς τιμωρίας und legt dessen Verhältnis nicht über den Text hinaus fest.
