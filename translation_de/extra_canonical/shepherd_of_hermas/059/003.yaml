revisions:
- from: '2. Er sagt: »Höre: Deine Sünden sind zwar zahlreich, aber nicht so zahlreich, dass du diesem Engel übergeben werden müsstest. Vielmehr hat dein Haus schwere Gesetzlosigkeiten und Sünden begangen, und der herrliche Engel wurde über ihre Taten erbittert. Deshalb befahl er, dass du eine Zeit lang bedrängt wirst, damit auch sie umkehren und sich von jeder Begierde dieser Weltzeit reinigen. Wenn sie nun umkehren und sich gereinigt haben, wird der Engel der Bestrafung weichen.«'
  to: '2. Er sagt: »Höre: Deine Sünden sind zwar zahlreich, aber nicht so zahlreich, dass du diesem Engel übergeben werden müsstest. Vielmehr hat dein Haushalt große Gesetzlosigkeiten und Sünden begangen, und der herrliche Engel geriet über ihre Taten in Bitterkeit. Deshalb befahl er, dass du eine Zeit lang bedrängt wirst, damit auch sie umkehren und sich von jedem Begehren dieses Zeitalters reinigen. Wenn sie nun umkehren und sich gereinigt haben, wird der Engel der Bestrafung weggehen.«'
