base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: de
  text: '2. Er sagt: »Höre: Deine Sünden sind zwar zahlreich, aber nicht so zahlreich, dass du diesem Engel übergeben werden müsstest. Vielmehr hat dein Haushalt große Gesetzlosigkeiten und Sünden begangen, und der herrliche Engel geriet über ihre Taten in Bitterkeit. Deshalb befahl er, dass du eine Zeit lang bedrängt wirst, damit auch sie umkehren und sich von jedem Begehren dieses Zeitalters reinigen. Wenn sie nun umkehren und sich gereinigt haben, wird der Engel der Bestrafung weggehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: dein Haus
  rationale: Bewahrt die im Zusammenhang wichtige Vorstellung vom Hausverband, dessen Haupt Hermas ist; gemeint ist nicht bloß das Gebäude.
- source_word: ἀνομίας
  choice: Gesetzlosigkeiten
  rationale: Gibt den starken moralisch-religiösen Sinn von ἀνομία wieder und hält ihn von dem folgenden allgemeineren »Sünden« unterscheidbar.
- source_word: παρεπικράνθη
  choice: wurde … erbittert
  rationale: Bewahrt das Bild des Bitterwerdens beziehungsweise Erbittertwerdens über die Taten, ohne es zu einem bloßen Ärger abzuschwächen.
- source_word: θλιβῆναι
  choice: bedrängt wirst
  rationale: Entspricht dem Leiden unter Druck und Bedrängnis; das Passiv und die nicht näher bestimmte Art des Leidens bleiben erhalten.
- source_word: μετανοήσωσι
  choice: umkehren
  rationale: Drückt die von μετάνοια bezeichnete innere und praktische Neuausrichtung in natürlichem modernem Deutsch aus.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: Begierde dieser Weltzeit
  rationale: Bewahrt sowohl die starke Bedeutung von ἐπιθυμία als auch den zeitlich-weltordnenden Sinn von αἰών.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: der Engel der Bestrafung
  rationale: Gibt den Genitiv formal und verständlich wieder und lässt offen, ob der Engel die Strafe vollzieht oder ihr zugeordnet ist.
theological_decisions:
- issue: Verhältnis zwischen den Sünden des Hermas und denen seines Hauses
  choice: 'Der Kontrast wird ausdrücklich bewahrt: Seine Sünden sind zahlreich, reichen aber nicht als alleinige Begründung für die Übergabe an diesen Engel aus; die schweren Vergehen seines Hauses bilden den weiteren Grund.'
  alternative: Die Bedrängnis ausschließlich als stellvertretende Strafe für die Familie darstellen.
  rationale: Der griechische Text hält persönliche Schuld und Verantwortung für den Hausverband zugleich fest, ohne eine ausgearbeitete Lehre stellvertretender Bestrafung zu formulieren.
- issue: Ziel der zeitweiligen Bedrängnis
  choice: Die Bedrängnis wird als Anlass zur Umkehr und Reinigung des Hauses wiedergegeben.
  alternative: Sie als vollständige Sühnung oder automatische Vergebung ihrer Sünden deuten.
  rationale: Der Text nennt Umkehr und Reinigung als Ziel, sagt hier aber nichts von automatischer Sühnung oder sakramentaler Vergebung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die Satzstruktur folgt dem argumentativen Gang des Griechischen, wurde jedoch für flüssiges Lesen leicht gegliedert. »Haus« und »Weltzeit« bewahren zentrale antike Begriffe, ohne konfessionelle Deutungen einzutragen.
