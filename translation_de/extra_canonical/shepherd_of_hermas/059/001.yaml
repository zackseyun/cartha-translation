translation:
  language: de
  text: '**Siebtes Gleichnis**


    **59:1** Wenige Tage später sah ich ihn auf demselben Feld, auf dem ich auch die Hirten gesehen hatte. Er fragte mich: »Was willst du?«


    Ich antwortete: »Ich bin gekommen, Herr, damit du dem strafenden Hirten[a] befiehlst, mein Haus zu verlassen; denn er bedrängt mich sehr.«


    Er sagte: »Du musst bedrängt werden. Denn so hat es der herrliche Engel über dich bestimmt: Er will nämlich, dass du auf die Probe gestellt wirst.«


    Da fragte ich: »Was habe ich denn so Böses getan, Herr, dass ich diesem Engel ausgeliefert werde?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem züchtigenden Hirten«. Das griechische Wort kann einen Strafenden, Ahndenden oder Züchtigenden bezeichnen.'
    reason: Erläutert die Bedeutungsbreite von τιμωρητής, ohne die Funktion oder Identität der Gestalt über den Wortlaut hinaus festzulegen.
lexical_decisions:
- source_word: Μετὰ ἡμέρας ὀλίγας
  choice: Wenige Tage später
  rationale: Gibt die zeitliche Fortsetzung idiomatisch und genau wieder.
- source_word: εἰς τὸ πεδίον τὸ αὐτό
  choice: auf demselben Feld
  rationale: Bewahrt den konkreten Schauplatz; »Feld« ist hier natürlicher als das ebenfalls mögliche »Ebene«.
- source_word: Τί ἐπιζητεῖς
  choice: Was willst du?
  rationale: Gibt die kontextuelle Bedeutung von ἐπιζητεῖν als nachdrückliches Suchen oder Begehren in natürlichem Deutsch wieder.
- source_word: τὸν ποιμένα τὸν τιμωρητήν
  choice: den strafenden Hirten
  rationale: Bewahrt sowohl die Hirtenbezeichnung als auch seine strafende beziehungsweise züchtigende Aufgabe, ohne die Figur mit einer auslegenden Amtsbezeichnung festzulegen.
- source_word: θλίβει / θλιβῆναι
  choice: bedrängt / bedrängt werden
  rationale: Die einheitliche Wiedergabe erhält die Wiederholung des griechischen Wortstamms und lässt körperliche, seelische und äußere Bedrängnis offen.
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: der herrliche Engel
  rationale: »Herrlich« entspricht ἔνδοξος, ohne den Rang oder die Identität des Engels näher zu bestimmen.
- source_word: πειρασθῆναι
  choice: auf die Probe gestellt wirst
  rationale: Bewahrt hier den Sinn des Erprobtwerdens; »versucht werden« könnte im modernen Deutsch einseitig zur Verleitung zum Bösen verstanden werden.
- source_word: παραδοθῶ
  choice: ausgeliefert werde
  rationale: Gibt das passive Übergeben in die Gewalt des Engels kräftig und kontextgerecht wieder.
theological_decisions:
- issue: Zweck der Bedrängnis
  choice: »Er will nämlich, dass du auf die Probe gestellt wirst.«
  alternative: »Er will nämlich, dass du versucht wirst.«
  rationale: Die Formulierung wahrt den Prüfungscharakter von πειρασθῆναι, ohne Gott beziehungsweise dem Engel ausdrücklich eine Verleitung zum Bösen zuzuschreiben.
- issue: Bezeichnung des Engels als τιμωρητής
  choice: »strafender Hirte« im Text mit erläuternder Fußnote
  alternative: »Hirte der Strafe« oder »Züchtiger«
  rationale: Die gewählte Form bleibt nahe am griechischen Titel und vermeidet eine konfessionell oder dogmatisch aufgeladene Deutung der Strafe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Die wiederholte Wortgruppe um θλίβω bleibt bewusst als »bedrängen« erhalten. Der Entwurf übersetzt ausschließlich den angeforderten Abschnitt 59:1; der darüber hinaus gelieferte griechische Kontext wurde zur Bedeutungsabsicherung herangezogen.
