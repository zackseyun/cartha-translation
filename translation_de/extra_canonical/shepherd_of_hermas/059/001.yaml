  to: '**Siebtes Gleichnis**


    **59:1** Wenige Tage später sah ich ihn auf demselben Feld, auf dem ich auch die Hirten gesehen hatte. Er fragte mich: »Was willst du?«


    Ich antwortete: »Ich bin gekommen, Herr, damit du dem strafenden Hirten[a] befiehlst, mein Haus zu verlassen; denn er bedrängt mich sehr.«


    Er sagte: »Du musst bedrängt werden. Denn so hat es der herrliche Engel über dich bestimmt: Er will nämlich, dass du auf die Probe gestellt wirst.«


    Da fragte ich: »Was habe ich denn so Böses getan, Herr, dass ich diesem Engel ausgeliefert werde?«'
  rationale: Die Revision korrigiert die potenziell sinnverschiebende Wiedergabe von τὰ περὶ σοῦ zu „über dich bestimmt“, präzisiert πάρειμι als „Ich bin gekommen“ und neutralisiert die erklärende Fußnote. Der übrige Text bleibt unverändert, da er den griechischen Wortlaut, seine Ambiguitäten und den modernen deutschen Registeranspruch gut trifft.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:05:55Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Ablauf und die wesentlichen Begriffe insgesamt zutreffend wieder. Die Wendung „für dich angeordnet“ ist bei τὰ περὶ σοῦ jedoch zu stark begünstigend formuliert; gemeint ist, was Hermas betrifft bzw. was über ihn bestimmt worden ist.
  naturalness: Das Deutsch ist modern, klar und im angemessen würdigen Register gehalten. „Ich bin hier“ ist verständlich, aber „Ich bin gekommen“ gibt πάρειμι im Kontext der Bitte präziser wieder.
  terminology: „strafender Hirte“ ist eine tragfähige Wiedergabe von τὸν ποιμένα τὸν τιμωρητήν. Die Fußnote sollte die semantische Bandbreite erläutern, ohne eine konkrete Funktion der Gestalt als feststehend zu behaupten. „herrlicher Engel“ und „auf die Probe gestellt“ sind angemessen.
  issues:
  - severity: medium
    issue: „für dich angeordnet“ für τὰ περὶ σοῦ
    rationale: Die griechische Wendung bezeichnet die Angelegenheiten, die Hermas betreffen, beziehungsweise eine über ihn getroffene Bestimmung. „Für dich“ kann im Deutschen eine günstige, zu seinem Nutzen erfolgende Anordnung nahelegen, die der Text nicht ausdrückt.
  - severity: low
    issue: „Ich bin hier“ für πάρειμι
    rationale: 'Die Formulierung ist möglich, doch im Bittkontext betont πάρειμι eher das Kommen bzw. Erscheinen: „Ich bin gekommen“ ist genauer und ebenso natürlich.'
  - severity: low
    issue: Fußnote bestimmt die Rolle des Hirten zu konkret
    rationale: Die Aussage, der Hirte sei „beauftragt“, ist eine plausible Kontextdeutung, aber keine ausdrückliche lexikalische Aussage des Titels. Eine rein semantische Erläuterung wahrt die Offenheit besser.
