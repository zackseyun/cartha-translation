revisions:
- from: '**Siebtes Gleichnis**


    **59:1** Wenige Tage später sah ich ihn auf demselben Feld, auf dem ich auch die Hirten gesehen hatte. Er fragte mich: »Was willst du?«


    Ich antwortete: »Ich bin hier, Herr, damit du dem strafenden Hirten[a] befiehlst, mein Haus zu verlassen; denn er bedrängt mich sehr.«


