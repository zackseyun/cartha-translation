review_pass:
  verdict: revise
  source_fidelity: 'Der Text gibt die Argumentation und die zentralen Begriffe des Griechischen insgesamt zutreffend wieder: Die Bedrängnis des Haushalts ist an die des Haushaltsoberhaupts gebunden; ἐξ ἀνάγκης wird angemessen als notwendige Folge ausgedrückt. Die textkritisch unsichere Lesart ὅλου ist korrekt markiert. Eine geringfügige Revision beseitigt jedoch die im Deutschen missverständliche bzw. unnötige Hinzufügung „auch“ bei der Bedingung und gibt Ἄλλως idiomatischer wieder.'
  naturalness: „Anders können sie nicht bedrängt werden“ ist verständlich, aber im modernen Deutschen etwas sperrig. „Sie können nämlich nur dann bedrängt werden, wenn …“ ist natürlich und bewahrt die exklusive Bedingung. „Oberhaupt des Hauses“ ist im heutigen Deutsch für κεφαλή in diesem Haushaltskontext klarer als „Haupt des Hauses“.
  terminology: „Bedrängnis“ bewahrt die Wiederholung der θλιβ-/θλίψις-Wortgruppe gut. „Herrlicher Engel“ ist für ἔνδοξος vertretbar. „Fest stehst“ kann εὐσταθοῦντος in seiner absichtlich nicht weiter ausgelegten Gegenüberstellung zur Bedrängnis angemessen wiedergeben.
  issues:
  - severity: low
    issue: Die Wendung „wenn nicht auch du“ fügt bei der Bedingung ein betontes „auch“ ein.
    rationale: Im Griechischen steht σὺ als hervorgehobenes Subjekt („wenn nicht du“); eine zusätzliche additive Nuance ist nicht erforderlich und kann den Satz leicht verschieben.
  - severity: low
    issue: „Anders können sie nicht bedrängt werden“ ist stilistisch unnötig hart.
    rationale: Ἄλλως ... οὐ δύνανται lässt sich präzise und idiomatischer als exklusive Bedingung formulieren.
