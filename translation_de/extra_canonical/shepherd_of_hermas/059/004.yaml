  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/004.yaml
  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: de
  text: '3. Ich sage zu ihm: »Herr, wenn sie solche Dinge getan haben, dass der herrliche Engel darüber erbittert wurde, was habe ich dann getan?« Er sagt: »Sie können nämlich nur dann bedrängt werden, wenn du, das Oberhaupt des [ganzen][a] Hauses, bedrängt wirst. Denn wenn du bedrängt wirst, werden zwangsläufig auch sie bedrängt werden; stehst du aber fest, können sie keinerlei Bedrängnis haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort »ganzen« steht in einigen Textzeugen beziehungsweise als unsichere Lesart im überlieferten griechischen Text.
    reason: Die Ausgabe kennzeichnet ὅλου durch eckige Klammern als textkritisch unsicher; die deutsche Übersetzung macht diese Unsicherheit sichtbar.
lexical_decisions:
- source_word: παρεπικράνθη
  choice: darüber erbittert wurde
  rationale: Gibt die passive Bedeutung ‚erbittert/aufgebracht werden‘ wieder und bewahrt den Bezug auf die Taten des Hauses.
- source_word: θλιβῆναι / θλιβομένου / θλίψιν
  choice: bedrängt werden / Bedrängnis
  rationale: Bewahrt die wiederholte Wortwurzel und lässt sowohl äußere Not als auch inneren Druck anklingen.
- source_word: ἡ κεφαλὴ τοῦ οἴκου
  choice: das Haupt des Hauses
  rationale: Gibt die metaphorische Leitungsstellung formal und verständlich wieder, ohne sie konfessionell auszudeuten.
- source_word: εὐσταθοῦντος
  choice: stehst du aber fest
  rationale: Erfasst den Gegensatz zur Bedrängnis als standhafte, stabile Lage und vermeidet die zu enge Deutung ‚Wohlergehen‘.
- source_word: ἐξ ἀνάγκης
  choice: zwangsläufig
  rationale: Gibt die logische beziehungsweise notwendige Folge idiomatisch wieder.
theological_decisions:
- issue: Mitbetroffenheit des Haushaltsoberhaupts an der Züchtigung des Hauses
  choice: 'Die kausale Verknüpfung wird unverändert wiedergegeben: Die Bedrängnis des Hauses setzt die Bedrängnis seines Hauptes voraus.'
  alternative: Die Aussage als persönliche Schuld oder stellvertretende Strafe des Haushaltsoberhaupts erklären.
  rationale: Der griechische Text beschreibt die solidarische Verbindung innerhalb des Hauses, legt aber die genaue theologische Art dieser Verbindung nicht ausdrücklich fest.
- issue: Bezeichnung des Engels als ἔνδοξος
  choice: herrlicher Engel
  alternative: ruhmreicher Engel
  rationale: ‚Herrlich‘ wahrt die ehrende Bezeichnung, ohne Identität oder Rang des Engels näher zu bestimmen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit konsequenter Wiedergabe der Leitwörter. Die direkte Rede bleibt lebendig; die etwas zugespitzte Argumentationsform des griechischen Textes wird bewahrt.
