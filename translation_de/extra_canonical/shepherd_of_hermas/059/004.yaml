revisions:
- from: '3. Ich sage zu ihm: »Herr, wenn sie solche Dinge getan haben, dass der herrliche Engel darüber erbittert wurde, was habe dann ich getan?« Er sagt: »Anders können sie nicht bedrängt werden, wenn nicht auch du, das Haupt des [ganzen][a] Hauses, bedrängt wirst. Denn wenn du bedrängt wirst, werden zwangsläufig auch sie bedrängt werden; stehst du aber fest, können sie keinerlei Bedrängnis erfahren.«'
  to: '3. Ich sage zu ihm: »Herr, wenn sie solche Dinge getan haben, dass der herrliche Engel darüber erbittert wurde, was habe ich dann getan?« Er sagt: »Sie können nämlich nur dann bedrängt werden, wenn du, das Oberhaupt des [ganzen][a] Hauses, bedrängt wirst. Denn wenn du bedrängt wirst, werden zwangsläufig auch sie bedrängt werden; stehst du aber fest, können sie keinerlei Bedrängnis haben.«'
  rationale: Die Revision glättet lediglich Syntax und Register und entfernt eine nicht notwendige additive Nuance. Sie erhält die Wiederholung von „bedrängt/Bedrängnis“, die logische Notwendigkeit und die textkritische Markierung von [ὅλου] unverändert.
