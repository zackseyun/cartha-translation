  source_fidelity: Der Text gibt die im überlieferten Ausschnitt vorhandenen Wörter und den Satzabbruch grundsätzlich korrekt wieder. Das initiale ἰδού bedeutet jedoch schlicht „sieh/siehe“; das zusätzliche „doch“ ist nicht erforderlich und verstärkt die Anrede leicht über den griechischen Befund hinaus. Der Abbruch nach ἐξ („von/aus“) muss auch im Deutschen unvollständig bleiben, da der bereitgestellte Quellentext dort endet.
  naturalness: Die Dialogsprache ist modern und würdig. Ein isoliertes „von—“ ist im Deutschen absichtlich unvollständig und daher nur wegen des quellenbedingten Satzabbruchs akzeptabel. „Aber sieh, Herr“ ist idiomatisch und näher am Ausgangstext als „Aber sieh doch, Herr“.
  terminology: „Herr“ gibt κύριε als respektvolle Anrede angemessen wieder. „Von ganzem Herzen bereut“ ist eine natürliche Wiedergabe von μετανενοήκασιν ἐξ ὅλης καρδίας αὐτῶν, ohne die Deutung auf eine bestimmte konfessionelle Terminologie festzulegen. Die Wiederaufnahme „Auch ich weiß“ trifft κἀγώ.
