  text: 4. “But look, sir,” I say, “they have repented with all their heart.” He says, “I also know that they have repented with—”
translation:
  language: de
  text: '4. »Aber sieh, Herr«, sage ich, »sie haben von ganzem Herzen bereut.« Er sagt: »Auch ich weiß, dass sie von—«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Die ehrerbietige Anrede wird in diesem frühchristlichen Dialog natürlich und traditionsnah mit »Herr« wiedergegeben.
- source_word: μετανενοήκασιν
  choice: sie haben bereut
  rationale: Das Perfekt bezeichnet eine vollzogene Umkehr mit fortdauernder Bedeutung; »haben bereut« ist hier verständlich und wahrt den Bezug auf ihr Fehlverhalten.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt die Ganzheit und Aufrichtigkeit der inneren Umkehr idiomatisch wieder.
- source_word: Οἶδα ... κἀγώ
  choice: Auch ich weiß
  rationale: κἀγώ wird ausdrücklich wiedergegeben und betont, dass der Gesprächspartner bereits um ihre Reue weiß.
theological_decisions:
- issue: Bedeutung von μετανοέω
  choice: bereuen
  alternative: umkehren
  rationale: Im unmittelbaren Satz bezeichnet das Perfekt die bereits vollzogene Reaktion auf frühere Verfehlungen. »Bereuen« klingt im Deutschen natürlich; die ethisch-religiöse Umkehr wird dabei nicht konfessionell näher bestimmt.
