    rationale: Das griechische παραδοθῆναι bezeichnet das Übergeben/Ausgeliefertwerden; ein deutsches »müsstest« ist nicht erforderlich und kann die Aussage verschieben.
  - severity: low
    issue: καθαρισθῶσι als »rein geworden sind«
    rationale: Der Aorist Passiv bezeichnet genauer, dass sie gereinigt worden sind. Dies bewahrt zudem die sprachliche Verbindung zur vorherigen aktiven Selbstreinigung.
