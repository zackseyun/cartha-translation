    issue: οὐ τοσαῦται als »nicht so schwer« wiedergegeben
    rationale: τοσαῦται bezieht sich auf die Menge beziehungsweise das Ausmaß der zuvor genannten Sünden (»nicht so viele«). Eine Aussage über ihren Schweregrad steht hier nicht.
  - severity: low
