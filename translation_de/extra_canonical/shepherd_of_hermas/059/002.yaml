  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: de
  text: '2 Er sagte: »Hör zu! Deine Sünden sind zwar zahlreich, aber nicht so viele, dass du diesem Engel ausgeliefert werden solltest. Doch deine Hausgemeinschaft[a] hat schwere Gesetzlosigkeiten und Sünden begangen. Ihre Taten haben den herrlichen Engel erzürnt. Deshalb hat er angeordnet, dass du eine Zeit lang bedrängt wirst, damit auch sie umkehren und sich von jeder Begierde dieser Welt reinigen. Wenn sie nun umgekehrt und gereinigt worden sind, wird der Engel der Strafe weichen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dein Haus«; gemeint ist die häusliche Gemeinschaft beziehungsweise Familie.'
    reason: Der griechische Ausdruck οἶκος kann Haus, Haushalt oder Familie bedeuten; die Fußnote bewahrt diese Bedeutungsbreite.
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: deine Hausgemeinschaft
  rationale: Bezeichnet hier nicht das Gebäude, sondern die zu Hermas gehörende häusliche Gemeinschaft; die Formulierung hält den sozialen Umfang offener als das engere »Familie«.
- source_word: ἀνομίας
  choice: Gesetzlosigkeiten
  rationale: Gibt den Gedanken von Handlungen gegen die göttliche Ordnung wieder und unterscheidet den Ausdruck vom unmittelbar folgenden ἁμαρτίας.
- source_word: παρεπικράνθη
  choice: erzürnt
  rationale: Drückt aus, dass die Taten den Engel schwer provoziert beziehungsweise erbittert haben; »erzürnt« ist im Kontext natürlich und würdevoll.
- source_word: θλιβῆναι
  choice: bedrängt wirst
  rationale: Bewahrt den breiten Sinn von Bedrängnis und Leiden, ohne die Art der Heimsuchung genauer festzulegen als der griechische Text.
- source_word: μετανοήσωσι
  choice: umkehren
  rationale: Gibt die innere und praktische Sinnesänderung wieder und passt idiomatisch zur anschließenden Reinigung.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: Begierde dieser Welt
  rationale: αἰών bezeichnet hier die gegenwärtige Weltzeit beziehungsweise Weltordnung; die Formulierung bewahrt den moralischen Gegensatz, ohne ihn näher auszudeuten.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: der Engel der Strafe
  rationale: Formale Wiedergabe des Genitivs; sie lässt offen, ob der Engel Strafe vollzieht oder personifiziert zu ihr gehört.
theological_decisions:
- issue: Verhältnis zwischen den Sünden des Hermas und der Bedrängnis seiner Hausgemeinschaft
  choice: 'Die kausale Spannung des Textes bleibt bestehen: Hermas hat viele Sünden, doch die angeordnete Bedrängnis hängt hier besonders mit den Taten seiner Hausgemeinschaft und deren Umkehr zusammen.'
  alternative: Die Bedrängnis ausschließlich als Strafe für Hermas selbst oder ausschließlich als stellvertretendes Leiden zu erklären.
  rationale: Der griechische Text verbindet persönliche Schuld, gemeinschaftliche Verantwortung und erzieherische Bedrängnis, ohne diese Beziehung systematisch aufzulösen.
- issue: Ziel der zeitweiligen Bedrängnis
  choice: »damit auch sie umkehren und sich … reinigen«
  alternative: Die Bedrängnis als endgültige Vergeltung wiederzugeben.
  rationale: ἵνα mit Konjunktiv bezeichnet ausdrücklich den auf Umkehr und Reinigung gerichteten Zweck; der zeitliche Charakter wird durch χρόνον τινά und das spätere Weichen des Engels bestätigt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton. Die direkte Rede und die Wiederholung zentraler Begriffe wie Sünde, Umkehr, Reinigung und Bedrängnis bleiben erkennbar; unnötige konfessionelle Fachsprache wird vermieden.
