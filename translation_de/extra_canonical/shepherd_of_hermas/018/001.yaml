    issue: ἀσυνκρασία als „maßloses Ungleichgewicht“
    rationale: Die Formulierung ist interpretierend und verbindet zwei Begriffe, die im Deutschen nicht ganz spannungsfrei zusammenstehen. „Unmäßigkeit“ entspricht dem wahrscheinlichen Sinn direkter; eine Fußnote kann die im Kontext sichtbare Unausgewogenheit erläutern.
  - severity: low
    issue: σκολιότης als „Falschheit“
    rationale: „Falschheit“ kann im Deutschen vorrangig Unaufrichtigkeit meinen. Das griechische Bildfeld bezeichnet moralische Krummheit bzw. Verkehrtheit.
  - severity: medium
    issue: Fußnote b behauptet eine konkrete handschriftliche Lage
    rationale: Die bereitgestellte Quelle setzt ἀσχέτων in textkritische Klammern, nennt aber keine Handschriften oder Varianten. Die Anmerkung sollte nur diese Unsicherheit beschreiben.
