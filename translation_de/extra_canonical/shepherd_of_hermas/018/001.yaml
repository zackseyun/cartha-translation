  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: de
  text: Lasst euch von aller Bosheit und aller Verkehrtheit heiligen. Doch ihr wollt euch von eurer Bosheit nicht abwenden. Hört nun auf mich, haltet Frieden untereinander, kümmert euch umeinander und steht einander bei. Genießt Gottes Schöpfungsgaben nicht allein aus eurem Überfluss, sondern teilt auch mit denen, denen es am Nötigen fehlt. Denn manche ziehen sich durch die Fülle ihrer Speisen körperliche Schwäche zu und schädigen ihren Leib. Der Leib derer aber, die nichts zu essen haben, nimmt Schaden, weil ihnen die nötige Nahrung fehlt, und ihr Körper geht zugrunde. Diese Unmäßigkeit[a] schadet also euch, die ihr habt und denen nichts abgebt, denen es fehlt. Habt das kommende Gericht vor Augen! Ihr Wohlhabenden, sucht daher die Hungernden auf, solange der Turm noch nicht vollendet ist. Denn wenn der Turm vollendet ist, werdet ihr Gutes tun wollen, aber keinen Platz mehr dafür haben. Gebt also acht, die ihr euch eures Reichtums rühmt, damit die Bedürftigen nicht seufzen und ihr Seufzen
    zum Herrn aufsteigt und ihr mitsamt euren nutzlosen Gütern[b] außerhalb der Tür des Turmes ausgeschlossen werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieses mangelnde Gleichmaß“. Das seltene griechische Wort kann eine fehlende Ausgewogenheit oder Unmäßigkeit bezeichnen; im Zusammenhang stehen Überfluss der einen und Mangel der anderen nebeneinander.'
    reason: Die Bedeutung von ἀσυνκρασία ist nicht ganz gesichert; die Alternative erläutert den Kontext, ohne den Haupttext zu überladen.
  - marker: b
    text: Das griechische Wort für „nutzlosen“ ist in der vorliegenden Textausgabe textkritisch unsicher.
    reason: Die Quelle kennzeichnet ἀσχέτων als unsichere Lesart, ohne eine bestimmte handschriftliche Erklärung zu liefern.
lexical_decisions:
- source_word: ἁγιασθῆτε
  choice: Lasst euch … heiligen
  rationale: Der griechische Aoristpassiv-Imperativ wird als passive Aufforderung bewahrt, statt ihn zu einem bloßen reflexiven „heiligt euch“ umzudeuten.
- source_word: σκολιότητος
  choice: Falschheit
  rationale: Bezeichnet wörtlich Krummheit bzw. moralische Verkehrtheit; „Falschheit“ ist im modernen Deutsch natürlich und erhält den ethischen Sinn.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: haltet Frieden untereinander
  rationale: Gibt die gemeinschaftliche Aufforderung idiomatisch wieder; ἐν ἑαυτοῖς meint hier die Beziehungen innerhalb der Gemeinschaft.
- source_word: ἐπισκέπτεσθε
  choice: kümmert euch um
  rationale: Umfasst fürsorgliches Aufsuchen und Nachsehen; „kümmert euch“ ist verständlich und passt zum folgenden gegenseitigen Beistand.
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: Gottes Schöpfungsgaben
  rationale: Gemeint sind im Kontext die geschaffenen Güter, besonders Nahrung. „Schöpfungsgaben“ vermeidet das missverständliche deutsche „Geschöpfe“.
- source_word: ἐκ καταχύματος
  choice: aus eurem Überfluss
  rationale: Die seltene Wendung bezeichnet eine überströmende Fülle; die Übersetzung wahrt das Bild in natürlichem Deutsch.
- source_word: ἀσυνκρασία
  choice: maßloses Ungleichgewicht
  rationale: Das Wort kann Unausgewogenheit, mangelnde Mischung oder Unmäßigkeit bezeichnen. Die Formulierung hält sowohl den Überkonsum der Reichen als auch den Mangel der Armen im Blick.
- source_word: οἱ ὑπερέχοντες
  choice: ihr Wohlhabenden
  rationale: Im unmittelbaren Kontext bezeichnet das Partizip diejenigen, die materiell mehr haben.
- source_word: ἐκζητεῖτε
  choice: sucht … auf
  rationale: Drückt bewusstes, nachdrückliches Suchen aus und nicht nur beiläufiges Beachten.
theological_decisions:
- issue: Heiligung und menschliche Umkehr
  choice: „Lasst euch … heiligen“, gefolgt von „ihr wollt euch … nicht abwenden“
  alternative: „Heiligt euch“
  rationale: Die passive Form des griechischen Textes bleibt erhalten, während der folgende Satz zugleich die menschliche Verantwortung ausdrücklich benennt; die Spannung wird nicht aufgelöst.
- issue: Der vollendete Turm und die Möglichkeit guten Handelns
  choice: „keinen Platz mehr dafür haben“
  alternative: „keine Gelegenheit mehr dazu haben“
  rationale: „Platz“ bewahrt τόπον und die räumliche Turmmetaphorik. Der Text warnt eschatologisch, erklärt aber nicht genauer, warum später kein Platz mehr besteht.
- issue: Gericht über Reiche
  choice: Die direkte Warnung vor Ausschluss bleibt ohne Abschwächung stehen
  alternative: Eine allgemeinere Warnung vor möglichen Folgen
  rationale: Der Ausgangstext verbindet unterlassene Hilfe, das Seufzen der Bedürftigen und das kommende Gericht ausdrücklich miteinander.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Registerton mit direkten Mahnungen. Die wiederholte Leib-Schädigung des Griechischen wird bewusst beibehalten, ohne unnötig medizinisch zu klingen. „Turm“ bleibt als unerklärte Bildsprache des Werkes stehen. Der Entwurf umfasst gemäß reader_segment 1 nur 18:1–6, entsprechend dem bereitgestellten englischen Konsultationstext.
