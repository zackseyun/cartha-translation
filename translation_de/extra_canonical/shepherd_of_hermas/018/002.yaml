base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: de
  text: 'Ich sage euch, die ihr die Gemeinde leitet und die ersten Sitze einnehmt: Werdet nicht wie Giftmischer. Giftmischer tragen ihre Mittel in Behältern; ihr aber tragt euer Giftmittel und euer Gift im Herzen. Ihr seid verhärtet und wollt eure Herzen nicht reinigen und euer Denken in einem reinen Herzen zur Einigkeit bringen, damit ihr beim großen König Erbarmen findet. Gebt also acht, Kinder, dass diese eure Spaltungen euch nicht das Leben rauben. Wie könnt ihr die Erwählten des Herrn unterweisen wollen, wenn ihr selbst keine Unterweisung habt? Unterweist einander und haltet Frieden miteinander, damit auch ich freudig vor dem Vater stehen und eurem Herrn für euch alle Rechenschaft geben kann.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: die ihr die Gemeinde leitet
  rationale: Gibt die leitende Funktion des Partizips natürlich wieder, ohne einen späteren kirchlichen Amtstitel einzutragen.
- source_word: τοῖς πρωτοκαθεδρίταις
  choice: die ersten Sitze einnehmt
  rationale: Bewahrt das konkrete Sitzmotiv und die mögliche Anspielung auf Rang und Vorrang.
- source_word: φαρμακοῖς
  choice: Giftmischer
  rationale: Im Kontext von φάρμακον und ἰός ist die schädliche beziehungsweise giftige Bedeutung gemeint; das deutsche Wort erhält zugleich den Bezug zur Herstellung und Aufbewahrung solcher Mittel.
- source_word: τὰ φάρμακα ... εἰς τὰς πυξίδας
  choice: ihre Mittel in Behältern
  rationale: φάρμακα kann Arznei, Droge oder Giftmittel bezeichnen; „Mittel“ wahrt diese lexikalische Breite, während „Behälter“ πυξίδας verständlich wiedergibt.
- source_word: ἐνεσκιρωμένοι
  choice: verhärtet
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen verhärteten oder verkrusteten Zustand; „verhärtet“ ist im Deutschen natürlich und passt zur geforderten Reinigung des Herzens.
- source_word: συνκεράσαι ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: euer Denken ... zur Einigkeit bringen
  rationale: Gibt das Zusammenmischen beziehungsweise Zusammenführen des Sinnens auf dasselbe Ziel idiomatisch wieder.
- source_word: παιδεύειν / παιδείαν
  choice: unterweisen / Unterweisung
  rationale: Erhält die Wortverbindung und umfasst Lehre, Erziehung und Zurechtweisung, ohne auf bloße Wissensvermittlung verengt zu werden.
- source_word: εἰρηνεύετε ἐν αὐτοῖς
  choice: haltet Frieden miteinander
  rationale: Der überlieferte Ausdruck ist ungewöhnlich; entsprechend dem unmittelbaren Gemeinschaftskontext wird die beabsichtigte gegenseitige Friedfertigkeit natürlich ausgedrückt.
theological_decisions:
- issue: Bezeichnung der Gemeindeleitung
  choice: 'funktionale Beschreibung: „die ihr die Gemeinde leitet“ und „die ersten Sitze einnehmt“'
  alternative: spätere feste Amtsbezeichnungen wie „Bischöfe“, „Priester“ oder „Vorsitzende“
  rationale: Der griechische Text nennt Leitung und Sitzrang, legt aber keine eindeutig spätere konfessionelle Amtsordnung fest.
- issue: τὴν ζωὴν ὑμῶν
  choice: „das Leben“
  alternative: „das ewige Leben“ oder „euer Heil“
  rationale: Die eschatologische Tragweite bleibt möglich, wird aber nicht durch einen im Text fehlenden Zusatz ausdrücklich festgelegt.
- issue: παρὰ τοῦ βασιλέως τοῦ μεγάλου
  choice: „beim großen König Erbarmen findet“
  alternative: „vom großen König Erbarmen empfangt“
  rationale: Die Formulierung bewahrt Gott als den großen König und gibt παρά idiomatisch wieder, ohne die Aussage dogmatisch auszubauen.
- issue: λόγον ἀποδῶ ὑπὲρ ὑμῶν πάντων
  choice: „eurem Herrn für euch alle Rechenschaft geben“
  alternative: „vor eurem Herrn für euch alle Fürsprache einlegen“
  rationale: λόγον ἀποδιδόναι bezeichnet primär Rechenschaft geben; ὑπέρ markiert, dass dies zugunsten beziehungsweise im Namen aller geschieht, ohne reine Fürbitte zu verlangen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Mahnrede. Die wiederholten Herz-, Gift- und Einigkeitsbilder des griechischen Textes bleiben erhalten. Keine konfessionell festgelegten Amtstitel; die weibliche Sprecherfigur ist im letzten Satz durch „freudig“ im Deutschen nicht eigens grammatisch markiert, bleibt aber aus dem Kontext erkennbar.
