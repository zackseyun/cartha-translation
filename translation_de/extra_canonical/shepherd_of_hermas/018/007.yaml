  source_fidelity: 'Die Aussage wird im Wesentlichen zutreffend wiedergegeben: Hermas bittet allein um eine vollständige Offenbarung über die drei Erscheinungsformen der alten Frau; die Antwort tadelt die Adressaten wegen ihrer διψυχίαι und ihrer fehlenden Ausrichtung auf den Herrn. Die beiden letztgenannten Gründe sind im Griechischen jedoch gemeinsam Subjekt von „machen euch ohne Einsicht“ und sollten im Deutschen unmittelbarer parallel stehen.'
  naturalness: Der Entwurf ist gut verständlich und in einem angemessen würdigen modernen Register gehalten. „Ebenso der Umstand, dass …“ ist jedoch schwerfälliger als nötig und schwächt die enge syntaktische Verbindung der beiden griechischen Nominalgedanken.
  terminology: „Herr“, „Gestalten“, „ohne Einsicht“ und „Zwiespältigkeit“ sind hier angemessene, nicht konfessionell verengende Entscheidungen. „Alte Frau“ ist als Bezug auf die zuvor so bezeichnete Gestalt verständlich.
