base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: de
  text: 'Ich antwortete ihm: »Herr, nur darum bitte ich: dass die Offenbarung über die drei Gestalten der alten Frau vollständig werde.« Er antwortete mir: »Wie lange seid ihr noch ohne Einsicht? Eure Zwiespältigkeit und dass euer Herz nicht dem Herrn zugewandt ist, machen euch ohne Einsicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: Gestalten
  rationale: Bezeichnet hier die drei unterschiedlichen Erscheinungsformen der alten Frau; „Gestalten“ ist natürlich und wahrt den visuellen Bezug.
- source_word: ἀσύνετοι
  choice: ohne Einsicht
  rationale: Gibt den Mangel an Verständnis oder geistlicher Einsicht würdig wieder, ohne die Stelle unnötig als Beleidigung zu verschärfen.
- source_word: διψυχίαι
  choice: innere Zwiespältigkeit
  rationale: Bewahrt die Vorstellung eines geteilten Inneren und klingt im modernen Deutschen verständlicher als eine wörtliche Neubildung wie „Doppelseeligkeit“.
- source_word: ἔχειν τὴν καρδίαν ... πρὸς τὸν Κύριον
  choice: das Herz auf den Herrn richten
  rationale: Natürliche deutsche Wiedergabe der räumlich ausgedrückten inneren Ausrichtung auf den Herrn.
theological_decisions:
- issue: Bezug von κύριε beziehungsweise Κύριον
  choice: Beide Vorkommen werden mit „Herr“ wiedergegeben.
  alternative: Das erste als höfliche Anrede („mein Herr“) und das zweite ausdrücklich als Gottesbezeichnung unterscheiden.
  rationale: Der griechische Wortlaut verwendet in beiden Fällen κύριος; die Übersetzung erhält diese mögliche Verbindung, ohne die Identität des angesprochenen Jünglings mit dem Herrn festzulegen.
- issue: Ursachen der Einsichtslosigkeit
  choice: Zwiespältigkeit und fehlende Herzensausrichtung werden als zwei koordinierte Ursachen wiedergegeben.
  alternative: Nur die Zwiespältigkeit als Ursache auffassen und den folgenden Ausdruck lose anschließen.
  rationale: Das wiederholte καί verbindet beide Nominalgedanken und sollte in der Übersetzung erkennbar bleiben.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klar unterscheidbarer direkter Rede. Der Wechsel vom Singular in der Bitte zum Plural in der Zurechtweisung bleibt entsprechend dem griechischen Text erhalten.
