    issue: Die Übersetzung von ἀποκαλύψῃ als »Aufschluss ... geben« unterbricht die im griechischen Text wiederholte Offenbarungsterminologie.
    rationale: Sowohl Hermas’ Bitte als auch die Antwort verwenden ἀποκαλύπτειν. Die einheitliche Wiedergabe ist hier natürlich und quellennäher.
  - severity: low
    issue: »einen anderen« ist im modernen Deutsch weniger idiomatisch.
    rationale: »Jemand anderen« bewahrt die unbestimmte, nicht identifizierte Person (ἕτερον), ohne eine geschlechtliche oder sonstige Identifikation einzutragen.
