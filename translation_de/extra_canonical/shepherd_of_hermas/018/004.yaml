base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: de
  text: 'Als sie fortging, bat ich sie, mir die drei Erscheinungsformen zu offenbaren, in denen sie mir erschienen war. Sie antwortete mir: »Danach musst du jemand anderen fragen, damit es dir offenbart wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγουσαν
  choice: als sie wegging
  rationale: Das Partizip bezeichnet ihr Fortgehen; die temporale Wiedergabe ist im Deutschen natürlich und wahrt den Handlungsablauf.
- source_word: ἀποκαλύψῃ
  choice: Aufschluss ... geben
  rationale: Im Zusammenhang bittet Hermas um eine Erklärung der Erscheinungsformen. Diese idiomatische Wiedergabe vermeidet eine unnatürliche Wiederholung von »offenbaren«, ohne den Offenbarungscharakter des Vorgangs aufzugeben.
- source_word: μορφῶν
  choice: Gestalten
  rationale: »Gestalten« bezeichnet hier die unterschiedlichen sichtbaren Erscheinungsformen der Frau treffend und würdevoll.
- source_word: ἐνεφανίσθη
  choice: erschienen war
  rationale: Das Verb beschreibt ihr Sichtbarwerden in den Visionen; »erschienen war« ist die natürliche deutsche Entsprechung.
- source_word: ἕτερον
  choice: einen anderen
  rationale: Das substantivierte Adjektiv bezeichnet eine andere Person, ohne deren Identität oder Geschlecht über die grammatische Form hinaus näher festzulegen.
- source_word: ἀποκαλυφθῇ
  choice: offenbart wird
  rationale: Das Passiv lässt wie im Griechischen offen, wer die Offenbarung bewirkt, und bewahrt damit die theologische Zurückhaltung des Textes.
theological_decisions:
- issue: Unausgesprochener Urheber der Offenbarung
  choice: Passivform »damit es dir offenbart wird«
  alternative: »damit Gott es dir offenbart«
  rationale: Der griechische Text nennt den Urheber nicht ausdrücklich; eine Ergänzung Gottes würde die genuine Offenheit des Satzes auflösen.
- issue: Identität der zu befragenden Person
  choice: »einen anderen« ohne nähere Bestimmung
  alternative: »jemand anderen« oder eine Identifizierung mit dem später erscheinenden jungen Mann
  rationale: ἕτερον verweist zwar auf eine andere Person, identifiziert sie hier aber nicht. Die Übersetzung nimmt die spätere Erzählung nicht vorweg.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdevolle Erzählsprache. Die direkte Rede bleibt knapp. Keine Fußnoten erforderlich, daher stehen auch keine Fußnotenmarker im Haupttext.
