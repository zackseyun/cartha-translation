base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: de
  text: Brüder, in der ersten Vision – im vergangenen Jahr – erschien sie mir sehr alt und saß auf einem Stuhl. In der zweiten Vision sah sie zwar jünger aus, doch ihr Körper und ihr Haar waren älter; sie stand da und sprach mit mir. Dabei war sie heiterer als zuvor. In der dritten Vision war sie ganz und gar jünger und von außergewöhnlicher Schönheit; nur ihr Haar war älter. Sie war bis zuletzt heiter und saß auf einem gepolsterten Sitz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρα
  choice: sehr alt / alt
  rationale: Gibt die Altersbeschreibung der Frau natürlich wieder; der Komparativ wird hier elativisch beziehungsweise im Vergleich zu ihrem jüngeren Erscheinungsbild verstanden.
- source_word: ὄψιν
  choice: sah … aus
  rationale: Bezeichnet ihr äußeres Erscheinungsbild und wird im Deutschen idiomatisch verbal wiedergegeben.
- source_word: σάρκα
  choice: Körper
  rationale: Im Kontext ist die leibliche Erscheinung im Unterschied zu Gesicht beziehungsweise Aussehen und Haar gemeint; „Fleisch“ wäre im modernen Deutsch missverständlich.
- source_word: ἱλαρωτέρα / ἱλαρά
  choice: heiterer / heiter
  rationale: Bewahrt die Bedeutung von freundlicher, froher Gemüts- beziehungsweise Erscheinungsart ohne die Szene unnötig psychologisch auszudeuten.
- source_word: κάλλει ἐκπρεπεστάτη
  choice: von außergewöhnlicher Schönheit
  rationale: Gibt den sehr starken Superlativ würdig und natürlich wieder.
- source_word: εἰς τέλος
  choice: durch und durch
  rationale: Im Zusammenhang verstärkt die Wendung ihre Heiterkeit; „bis zum Ende“ wäre zwar formal möglich, wirkt hier jedoch sachlich und idiomatisch weniger wahrscheinlich.
- source_word: συμψελίου
  choice: gepolsterter Sitz
  rationale: Das seltene Wort bezeichnet offenbar eine gepolsterte Sitzgelegenheit; die allgemeinere Wiedergabe vermeidet eine nicht gesicherte Festlegung auf Bank oder Liege.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Anrede ἀδελφοί wird als „Brüder“ beibehalten. Die dreifache Gegenüberstellung von Alter, Verjüngung und zunehmender Heiterkeit bleibt ohne allegorische Ausdeutung stehen.
