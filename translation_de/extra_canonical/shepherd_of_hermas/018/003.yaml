base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/003.yaml
  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: de
  text: X. Als sie aufgehört hatte, mit mir zu sprechen, kamen die sechs jungen Männer, die gerade bauten, und trugen sie zum Turm. Vier andere hoben den gepolsterten Sitz auf und trugen auch ihn zum Turm. Ihre Gesichter sah ich nicht, weil sie abgewandt waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἓξ νεανίσκοι
  choice: die sechs jungen Männer
  rationale: Gibt die Personenbezeichnung natürlich und ohne unnötige Altersspezifizierung wieder.
- source_word: οἱ οἰκοδομοῦντες
  choice: die am Bauen waren
  rationale: Bewahrt den substantivierten, fortdauernden Charakter des Partizips und den Bezug auf das bereits bekannte Bauwerk.
- source_word: ἀπήνεγκαν
  choice: trugen … zum Turm
  rationale: Das Verb bezeichnet hier das körperliche Forttragen; die Richtungsangabe wird idiomatisch mit „zum Turm“ wiedergegeben.
- source_word: τὸ συμψέλιον
  choice: den gepolsterten Sitz
  rationale: Das seltene Wort bezeichnet im Kontext eine gepolsterte Sitzgelegenheit; die Wiedergabe bleibt anschaulich, ohne eine ungesicherte genaue Möbelart festzulegen.
- source_word: ἀπεστραμμένοι ἦσαν
  choice: sie abgewandt waren
  rationale: Bewahrt die im Griechischen nicht ausdrücklich genannte Bezugsrichtung und damit die leichte Ambiguität.
