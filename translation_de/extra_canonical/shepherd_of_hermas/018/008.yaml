  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/008.yaml
  text: Answering him again, I said, “But from you, Lord, we shall learn these things more precisely.”
translation:
  language: de
  text: 'Ich antwortete ihm noch einmal: »Aber von dir, Herr, werden wir diese Dinge genauer erfahren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... πάλιν εἶπον
  choice: Ich antwortete ihm noch einmal
  rationale: Gibt die erneute Erwiderung natürlich und zugleich eng am griechischen Ausdruck wieder.
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die direkte ehrerbietige Anrede, ohne die Identität des angesprochenen Jünglings näher festzulegen.
- source_word: ἀκριβέστερον
  choice: genauer
  rationale: 'Entspricht dem komparativischen Sinn: Die erbetene Auskunft soll präziser beziehungsweise eingehender sein.'
- source_word: γνωσόμεθα
  choice: werden wir ... erfahren
  rationale: Der futurische Erkenntnisvorgang wird im Deutschen idiomatisch mit »erfahren« ausgedrückt.
- source_word: αὐτά
  choice: dies
  rationale: Verweist zusammenfassend auf die zuvor genannten drei Erscheinungsformen der alten Frau.
theological_decisions:
- issue: Bedeutung der Anrede κύριε
  choice: Herr
  alternative: mein Herr
  rationale: Die schlichte Anrede des Ausgangstextes bleibt erhalten; weder eine christologische Identifizierung noch eine bloß höfliche Abschwächung wird in die Übersetzung eingetragen.
- issue: Plural in γνωσόμεθα
  choice: werden wir erfahren
  alternative: werde ich erfahren
  rationale: Der griechische Plural wird bewahrt, obwohl Hermas als Einzelner spricht; die mögliche Einbeziehung seiner Leser oder Gemeinschaft wird nicht stillschweigend beseitigt.
translation_notes:
  register: Natürliche, würdige Standardsprache mit enger Bindung an Syntax und Aussage des griechischen Textes. Keine Fußnote erforderlich.
