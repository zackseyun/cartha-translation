base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: de
  text: 'Darüber war ich sehr betrübt, weil ich diese Offenbarung verstehen wollte. Da sah ich die betagte Frau in einer nächtlichen Vision zu mir sagen: »Jede Frage verlangt Demut. Faste also, und du wirst vom Herrn empfangen, worum du bittest.« So fastete ich einen Tag. In derselben Nacht erschien mir ein junger Mann und sagte zu mir: »Weil du im Gebet immer wieder um Offenbarungen bittest, sieh zu, dass du dir nicht schadest, indem du um zu viel bittest. Diese Offenbarungen genügen dir. Kannst du Offenbarungen sehen, die stärker sind als die, die du gesehen hast?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: tief betrübt
  rationale: Gibt die starke seelische Bedrängnis natürlich und würdevoll wieder.
- source_word: ἐρώτησις
  choice: Bitte um Auskunft
  rationale: Im Kontext geht es nicht bloß um eine Frage, sondern um das demütige Erbitten einer Erklärung der Vision.
- source_word: ὑπὸ χεῖρα
  choice: so ohne Weiteres
  rationale: Die idiomatische Wendung bezeichnet hier ein bereitwilliges beziehungsweise rasches Bitten; die deutsche Formulierung bewahrt den mahnenden Ton, ohne eine unsichere räumliche Bedeutung einzutragen.
- source_word: σάρκα
  choice: Körper
  rationale: Gemeint ist hier die leibliche Gesundheit, die durch anhaltendes Fasten und viele Bitten beeinträchtigt werden könnte.
- source_word: ἰσχυροτέρας
  choice: gewaltigere
  rationale: Bewahrt die komparative Stärke des griechischen Ausdrucks und passt zu außergewöhnlichen Visionserfahrungen.
theological_decisions:
- issue: Verhältnis von Fasten, Gebet und Empfang der Offenbarung
  choice: »faste, dann wirst du ... empfangen«
  alternative: »faste, damit du ... empfängst«
  rationale: Die Übersetzung erhält die im Text ausgesprochene Verheißung, ohne daraus eine allgemeine Lehre über einen mechanischen Offenbarungserwerb zu machen.
- issue: Bezeichnung des Offenbarenden
  choice: »vom Herrn« und »ein junger Mann«
  alternative: Identifizierung des jungen Mannes als Christus oder Engel
  rationale: Der griechische Text identifiziert die Gestalt an dieser Stelle nicht ausdrücklich; diese Offenheit bleibt gewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Erzählton. Der Tempuswechsel zu »Da sah ich« glättet das historische Präsens des Griechischen, ohne die Lebendigkeit der Szene zu verlieren. Direkte Rede ist klar gegliedert; konfessionell geprägte Zusatzdeutungen wurden vermieden.
