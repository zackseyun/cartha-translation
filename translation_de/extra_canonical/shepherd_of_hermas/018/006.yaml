  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Erzählablauf, Fastenaufforderung, die nicht näher identifizierte Erscheinung und die rhetorische Schlussfrage insgesamt zuverlässig wieder. Korrigiert werden sollte jedoch die Wiedergabe von ὑπὸ χεῖρα: »so ohne Weiteres« kann nahelegen, Hermas bitte unbedacht oder unberechtigt. Die idiomatische Wendung bezeichnet eher ein wiederholtes bzw. bereitwilliges Bitten und sollte ohne diesen zusätzlichen Vorwurf wiedergegeben werden.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und wahrt einen angemessen würdigen Erzählton. »betagte Frau«, »Frage« und »immer wieder« lesen sich natürlicher und unmittelbarer als die bisherigen Umschreibungen.
  terminology: »Offenbarung«, »Herr«, »fasten« und »Fleisch«/»Leib« sind sachgerecht. »Leib« bildet σάρξ hier als die durch Fasten gefährdete leibliche Existenz präziser ab als das modern-medizinisch klingende »Körper«; eine theologische Sonderdeutung wird damit nicht eingetragen.
