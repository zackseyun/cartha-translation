revisions:
- from: 'Darüber war ich tief betrübt, denn ich wollte diese Offenbarung verstehen. Da sah ich die alte Frau in einer nächtlichen Vision. Sie sagte zu mir: »Jede Bitte um Auskunft erfordert Demut. Darum faste, dann wirst du vom Herrn empfangen, worum du bittest.« Also fastete ich einen Tag. Noch in derselben Nacht erschien mir ein junger Mann und sagte zu mir: »Da du so ohne Weiteres im Gebet um Offenbarungen bittest, sieh dich vor, dass du nicht durch deine vielen Bitten deinem Körper schadest. Diese Offenbarungen genügen dir. Kannst du denn noch gewaltigere Offenbarungen schauen als die, die du bereits gesehen hast?«'
  to: 'Darüber war ich sehr betrübt, weil ich diese Offenbarung verstehen wollte. Da sah ich die betagte Frau in einer nächtlichen Vision zu mir sagen: »Jede Frage verlangt Demut. Faste also, und du wirst vom Herrn empfangen, worum du bittest.« So fastete ich einen Tag. In derselben Nacht erschien mir ein junger Mann und sagte zu mir: »Weil du im Gebet immer wieder um Offenbarungen bittest, sieh zu, dass du dir nicht schadest, indem du um zu viel bittest. Diese Offenbarungen genügen dir. Kannst du Offenbarungen sehen, die stärker sind als die, die du gesehen hast?«'
  rationale: Die Revision beseitigt die unnötig wertende Nuance bei ὑπὸ χεῖρα, hält die nicht weiter erläuterte Identität des jungen Mannes offen und folgt der griechischen Ausdrucksweise bei der Belastung des Leibes sowie beim Komparativ ἰσχυροτέρας. Der Sinn und die Ambiguität des Ausgangstextes bleiben erhalten.
