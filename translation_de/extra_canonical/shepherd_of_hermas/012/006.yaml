base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: de
  text: 'Sie antwortet mir: »Es ist dir nicht offenbart worden, weil du würdiger bist als alle anderen. Denn es gibt andere, die dir vorausgehen und besser sind als du; ihnen hätten diese Visionen offenbart werden sollen. Doch damit der Name Gottes verherrlicht wird, ist es dir offenbart worden und wird dir offenbart werden – um der Zwiespältigen willen, die in ihren Herzen erwägen, ob dies wohl so ist oder nicht. Sage ihnen: All dies ist wahr, und nichts davon weicht von der Wahrheit ab; vielmehr ist alles stark, gewiss und fest gegründet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψύχους
  choice: Unentschlossenen
  rationale: Wörtlich bezeichnet das Wort Menschen mit einer »geteilten Seele«; im Kontext sind solche gemeint, die zwischen Glauben und Zweifel schwanken. »Unentschlossene« gibt dies natürlich wieder, ohne die Bildsprache übermäßig auszudeuten.
- source_word: διαλογιζομένους
  choice: überlegen
  rationale: Das Partizip beschreibt das innere Erwägen oder Abwägen im Herzen; »überlegen« bewahrt den gedanklichen Vorgang in idiomatischem Deutsch.
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: fest, zuverlässig und fest gegründet
  rationale: 'Die dreigliedrige Bekräftigung wird bewahrt: Stärke beziehungsweise Gültigkeit, Gewissheit und ein tragfähiges Fundament.'
- source_word: ὁράματα
  choice: Visionen
  rationale: Das Wort bezeichnet hier offenbarte Schauungen; »Visionen« ist im Deutschen verständlich und entspricht dem literarischen Zusammenhang.
theological_decisions:
- issue: Grund der Offenbarung an Hermas
  choice: Die Offenbarung geschieht zur Verherrlichung des Namens Gottes und zugunsten der Zweifelnden, nicht aufgrund besonderer Würdigkeit des Empfängers.
  alternative: Hermas wird wegen persönlicher geistlicher Überlegenheit erwählt.
  rationale: Der griechische Text weist persönliche Vorrangstellung ausdrücklich zurück und nennt stattdessen Gottes Verherrlichung und die διψύχοι als Zweck.
- issue: Aussage über die Wahrheit der Visionen
  choice: Die starke, dreifache Beglaubigung des Textes bleibt uneingeschränkt stehen.
  alternative: Die Aussage als bloß subjektive Überzeugung des Visionärs abschwächen.
  rationale: Der Ausgangstext erklärt ausdrücklich, alles sei wahr, fest, gewiss und gegründet; eine Abschwächung wäre interpretierend.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Rede. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für flüssiges Deutsch gegliedert. »Weiterhin offenbart werden« macht den futurischen Aspekt von ἀποκαλυφθήσεται deutlich.
