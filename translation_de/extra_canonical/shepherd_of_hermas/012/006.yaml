revisions:
- from: 'Sie antwortete mir: »Nicht weil du von allen der Würdigste bist, ist es dir offenbart worden. Denn andere waren vor dir da und sind besser als du; ihnen hätten diese Visionen offenbart werden sollen. Doch damit der Name Gottes verherrlicht wird, ist es dir offenbart worden und wird es dir weiterhin offenbart werden – um der Unentschlossenen willen, die in ihren Herzen überlegen, ob sich dies wirklich so verhält oder nicht. Sage ihnen: Dies alles ist wahr, und nichts daran liegt außerhalb der Wahrheit; vielmehr ist alles fest, zuverlässig und fest gegründet.«'
  to: 'Sie antwortet mir: »Es ist dir nicht offenbart worden, weil du würdiger bist als alle anderen. Denn es gibt andere, die dir vorausgehen und besser sind als du; ihnen hätten diese Visionen offenbart werden sollen. Doch damit der Name Gottes verherrlicht wird, ist es dir offenbart worden und wird dir offenbart werden – um der Zwiespältigen willen, die in ihren Herzen erwägen, ob dies wohl so ist oder nicht. Sage ihnen: All dies ist wahr, und nichts davon weicht von der Wahrheit ab; vielmehr ist alles stark, gewiss und fest gegründet.«'
  rationale: Die Revision korrigiert die nicht gedeckte Vergangenheitsform bei εἰσιν, glättet einzelne deutsche Wendungen und bewahrt zugleich die Aussageweite von διψύχοι sowie die dreifache Bekräftigung ἰσχυρά, βέβαια, τεθεμελιωμένα. Die an sich mögliche Ambiguität von εἰ ἄρα („ob dies wohl so ist“) bleibt erhalten.
