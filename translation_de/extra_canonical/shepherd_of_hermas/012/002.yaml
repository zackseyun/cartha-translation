base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: de
  text: „Das sind die heiligen Engel Gottes, die zuerst erschaffen wurden. Ihnen hat der Herr seine ganze Schöpfung anvertraut, damit sie sie mehren und aufbauen und über die ganze Schöpfung herrschen. Durch sie wird also der Bau des Turmes vollendet werden.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πρῶτοι κτισθέντες
  choice: die zuerst erschaffen wurden
  rationale: Gibt die zeitliche Vorrangstellung der Engel wieder, ohne weitergehende Aussagen über Rang oder Wesen einzutragen.
- source_word: παρέδωκεν
  choice: hat … anvertraut
  rationale: Drückt die Übertragung von Verantwortung und Vollmacht natürlich aus; „übergeben“ wäre möglich, klänge hier aber sachlicher und weniger idiomatisch.
- source_word: αὔξειν
  choice: mehren
  rationale: Bewahrt den ungewöhnlichen, aber deutlichen Gedanken des griechischen Verbs, dass die Engel die Schöpfung wachsen beziehungsweise zunehmen lassen sollen.
- source_word: οἰκοδομεῖν
  choice: aufbauen
  rationale: Erhält die Bau-Metaphorik und den Zusammenhang mit dem Turmbau.
- source_word: δεσπόζειν
  choice: herrschen
  rationale: Gibt die starke Bedeutung von Herrschaft beziehungsweise Verfügungsgewalt wieder, ohne sie zu einer bloßen Verwaltung abzuschwächen.
- source_word: τελεσθήσεται
  choice: wird … vollendet werden
  rationale: Bewahrt das Passiv und den Gedanken, dass der Turmbau zu seinem vorgesehenen Abschluss gelangt.
theological_decisions:
- issue: Rolle der zuerst erschaffenen Engel gegenüber der gesamten Schöpfung
  choice: 'Die drei Infinitive werden als Auftrag an die Engel wiedergegeben: „damit sie sie mehren und aufbauen und … herrschen“'
  alternative: Die Infinitive unverbunden als Zweck oder Inhalt der Übergabe stehen lassen
  rationale: Die griechische Konstruktion bezieht die Infinitive am natürlichsten auf die Engel. Die Übersetzung bewahrt zugleich die weitreichende Aussage des Textes, ohne sie systematisch-theologisch einzuschränken.
- issue: Bedeutung von „die zuerst erschaffen wurden“
  choice: Wörtlich-zeitliche Formulierung ohne Zusatz
  alternative: „die ranghöchsten“ oder „die ursprünglichen Engel“
  rationale: Der Ausgangstext bezeichnet ausdrücklich eine Erschaffung als erste; eine Deutung als bloßer Rang würde die genuine Aussage abschwächen oder auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache Aufgabenfolge bleibt durch wiederholtes „und“ bewusst markant. Das doppelte Pronomen in „damit sie sie mehren“ ist grammatisch eindeutig, wenn auch stilistisch auffällig; es hält den Bezug auf die Engel und die Schöpfung präzise fest.
