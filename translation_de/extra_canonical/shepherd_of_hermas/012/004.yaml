base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: de
  text: „Auch sie sind heilige Engel Gottes; doch diese sechs stehen über ihnen. So wird der Bau des Turmes vollendet werden, und alle zusammen werden rings um den Turm jubeln und Gott verherrlichen, weil der Bau des Turmes vollendet worden ist.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχοντες
  choice: stehen über ihnen
  rationale: Gibt den Rangvergleich natürlich wieder, ohne genauer festzulegen, worin die Überlegenheit besteht.
- source_word: συντελεσθήσεται
  choice: wird … vollendet werden
  rationale: Bewahrt das Futur und den passivischen Abschlussgedanken.
- source_word: εὐφρανθήσονται
  choice: werden … jubeln
  rationale: Drückt die gemeinschaftliche, freudige Feier kräftig und idiomatisch aus.
- source_word: δοξάσουσιν
  choice: werden … verherrlichen
  rationale: Entspricht dem religiösen Sinn von δοξάζω und wahrt den würdevollen Ton.
- source_word: κύκλῳ τοῦ πύργου
  choice: rings um den Turm
  rationale: Natürliche deutsche Wiedergabe der räumlichen Angabe.
theological_decisions:
- issue: Rangordnung unter den Engeln
  choice: diese sechs stehen über ihnen
  alternative: diese sechs sind ihnen überlegen
  rationale: Die Formulierung bewahrt die ausgesagte Rangordnung, ohne eine bestimmte Engelhierarchie oder die Art ihrer Überlegenheit einzutragen.
- issue: Vollendung des Turmbaus
  choice: wird … vollendet werden
  alternative: wird zum Abschluss kommen
  rationale: Die passive Form bleibt nahe am Griechischen und vermeidet eine zusätzliche Deutung darüber, wer die Vollendung bewirkt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Bau des Turmes“ bleibt erhalten, da sie der griechischen Hervorhebung der Vollendung entspricht.
