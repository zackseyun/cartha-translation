translation_notes:
  register: Moderne, würdige Erzählprosa mit klarer direkter Rede. Die etwas ungewöhnliche Frage nach der »Kraft« der Steine bleibt erhalten, statt deutend als Symbolik, Bedeutung oder Wirkung aufgelöst zu werden.
