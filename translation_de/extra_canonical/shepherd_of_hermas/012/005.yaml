translation:
  language: de
  text: '3. Ich fragte sie: »Herrin, ich wollte gern wissen, was aus den Steinen wird und welcher Art ihre Kraft ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησα
  choice: Ich fragte
  rationale: Gibt das erzählende Aoristverb schlicht und natürlich wieder.
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle weibliche Anrede, ohne sie abzuschwächen oder als Eigennamen zu behandeln.
- source_word: ἤθελον γνῶναι
  choice: ich möchte gern wissen
  rationale: Gibt den höflich beziehungsweise zurückhaltend formulierten Wunsch des Imperfekts in natürlichem modernem Deutsch wieder.
- source_word: τῶν λίθων τὴν ἔξοδον
  choice: was aus den Steinen wird
  rationale: ἔξοδος bezeichnet hier wahrscheinlich Ausgang, weiteres Geschick oder Ergebnis; die Formulierung bewahrt diese Offenheit idiomatisch.
- source_word: τὴν δύναμιν αὐτῶν, ποταπή ἐστιν
  choice: welcher Art ihre Kraft ist
  rationale: Folgt der singularischen Konstruktion und lässt offen, worin die Kraft beziehungsweise Bedeutung der Steine besteht.
