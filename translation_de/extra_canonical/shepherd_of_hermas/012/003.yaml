  text: 2. "And the others who are carrying the stones—who are they?"
translation:
  language: de
  text: 2. »Und wer sind die anderen, die die Steine herbeitragen?«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἕτεροι
  choice: die anderen
  rationale: Gibt die Abgrenzung von den zuvor erwähnten sechs jungen Männern schlicht und unmittelbar wieder.
- source_word: οἱ παραφέροντες
  choice: die … herbeitragen
  rationale: Das Partizip bezeichnet hier diejenigen, die die Steine zum Bauplatz bringen; „herbeitragen“ ist im Deutschen natürlich und bewahrt den konkreten Vorgang.
- source_word: τοὺς λίθους
  choice: die Steine
  rationale: Direkte und kontextgemäße Wiedergabe des Baumaterials im Bild vom Turmbau.
