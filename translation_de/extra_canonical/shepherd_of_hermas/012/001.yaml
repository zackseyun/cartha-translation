  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: de
  text: 'Darauf sagte ich zu ihr: »Herrin, diese Sache ist groß und wunderbar. Doch wer sind die sechs jungen Männer, die da bauen, Herrin?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω αὐτῇ
  choice: Darauf sagte ich zu ihr
  rationale: Gibt die antwortende Reaktion und das historische Präsens in natürlichem deutschem Erzählstil wieder.
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle direkte Anrede an die Frauengestalt, ohne sie durch eine modernere, aber schwächere Anrede einzuebnen.
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει τὸ πρᾶγμα τοῦτο
  choice: diese Sache ist groß und wunderbar
  rationale: Überträgt die idiomatische Wendung verständlich und wahrt beide wertenden Begriffe.
- source_word: οἱ νεανίσκοι οἱ ἓξ οἱ οἰκοδομοῦντες
  choice: die sechs jungen Männer, die da bauen
  rationale: Gibt Personenzahl, Altersbezeichnung und laufende Bautätigkeit klar wieder; »da« verweist natürlich auf die geschilderte Szene.
