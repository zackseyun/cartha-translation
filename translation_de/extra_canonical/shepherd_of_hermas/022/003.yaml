revisions:
- from: Während ich nun allein umherging, bat ich den Herrn, die Offenbarungen und die Visionen, die er mir durch seine heilige Kirche gezeigt hatte, zur Vollendung zu bringen, damit er mich stärke und seinen zu Fall gekommenen Dienern Umkehr schenke, damit sein großer und herrlicher Name verherrlicht werde, weil er mich für würdig erachtet hatte, mir seine Wunder zu zeigen.
  to: Während ich nun allein umherging, bat ich den Herrn, die Offenbarungen und die Visionen, die er mir durch seine heilige Kirche gezeigt hatte, zu vollenden, damit er mich stärke und seinen Dienern, die gestrauchelt sind, Umkehr schenke, damit sein großer und herrlicher Name verherrlicht werde, weil er mich dafür würdig erachtet hatte, mir seine Wunder zu zeigen.
  rationale: Die Revision glättet lediglich drei stilistisch-semantische Punkte. Sie bewahrt die Vermittlung „durch seine heilige Kirche“, die Aussage, dass der Herr Umkehr schenkt, und die im Griechischen angelegte Folge von Zweckbestimmungen. Keine Fußnote ist erforderlich, da keine textkritische oder im Deutschen unauflösbare Mehrdeutigkeit vorliegt.
