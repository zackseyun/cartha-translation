base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: de
  text: Während ich nun allein umherging, bat ich den Herrn, die Offenbarungen und die Visionen, die er mir durch seine heilige Kirche gezeigt hatte, zu vollenden, damit er mich stärke und seinen Dienern, die gestrauchelt sind, Umkehr schenke, damit sein großer und herrlicher Name verherrlicht werde, weil er mich dafür würdig erachtet hatte, mir seine Wunder zu zeigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιπατῶν
  choice: umherging
  rationale: Gibt das fortgesetzte Gehen in der geschilderten Situation natürlich wieder.
- source_word: ἀξιῶ
  choice: bat ich
  rationale: Im Kontext bezeichnet das Verb ein inständiges Bitten an den Herrn; „bat“ ist idiomatisch und würdevoll.
- source_word: τελειώσῃ
  choice: zur Vollendung zu bringen
  rationale: Bewahrt den Gedanken des Vollendens, ohne genauer festzulegen, worin die Vollendung der Offenbarungen besteht.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Sinnes- und Lebensänderung und ist im Deutschen verständlicher als das enger oder kirchlicher klingende „Buße“.
- source_word: ἐσκανδαλισμένοις
  choice: zu Fall gekommenen
  rationale: Bewahrt die bildhafte Bedeutung eines geistlichen oder sittlichen Strauchelns, ohne die Art des Anstoßes näher zu bestimmen.
- source_word: θαυμάσια
  choice: Wunder
  rationale: Entspricht den wunderbaren Taten oder Dingen Gottes und passt zum visionären Zusammenhang.
theological_decisions:
- issue: Vermittlung der Offenbarungen durch die Kirche
  choice: „durch seine heilige Kirche gezeigt hatte“
  alternative: „mittels seiner heiligen Kirche gezeigt hatte“
  rationale: Das griechische διά mit Genitiv wird als Vermittlung wiedergegeben; die Aussage über die Rolle der Kirche wird weder abgeschwächt noch dogmatisch ausgeweitet.
- issue: Empfänger und Geber der Umkehr
  choice: „seinen ... Dienern Umkehr schenke“
  alternative: „seinen ... Dienern die Möglichkeit zur Umkehr gebe“
  rationale: Die direkte Aussage, dass der Herr μετάνοια gibt, bleibt erhalten; sie wird nicht in eine bloße Gelegenheit zur Umkehr umgedeutet.
- issue: Bezug des finalen ἵνα
  choice: „damit sein großer und herrlicher Name verherrlicht werde“
  alternative: „sodass sein großer und herrlicher Name verherrlicht wird“
  rationale: Die Zweckbeziehung wird bewahrt, ohne festzulegen, ob sie sich nur auf die Umkehr der Diener oder auf die gesamte Bitte bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax, soweit sie natürlich bleibt. Die lange Satzperiode des Originals wurde beibehalten, da ihre Gebets- und Zweckstruktur im Deutschen verständlich ist.
