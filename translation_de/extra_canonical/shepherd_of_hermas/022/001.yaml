base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/001.yaml
  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: de
  text: Die Vision, die ich sah, Brüder, hatte ich zwanzig Tage nach der vorherigen Vision; sie war ein Vorbild für die kommende Bedrängnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασις
  choice: Vision
  rationale: Bezeichnet hier eine offenbarende Schau und entspricht dem wiederholten Gattungsbegriff des Werkes.
- source_word: εἰς τύπον
  choice: als Sinnbild für
  rationale: τύπος bezeichnet eine vorbildhafte beziehungsweise bildhafte Darstellung; „Sinnbild“ gibt dies im Deutschen natürlich wieder, ohne eine streng dogmatische Typologie festzulegen.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: Bewahrt den Sinn von schwerem Druck, Not und Verfolgung und lässt den genauen Charakter des kommenden Unheils offen.
- source_word: ἐπερχομένη
  choice: kommende
  rationale: Gibt das präsentische Partizip mit Zukunftsbezug knapp und unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von τύπος für die kommende θλῖψις
  choice: Sinnbild für die kommende Bedrängnis
  alternative: Vorzeichen der kommenden Drangsal
  rationale: Der griechische Text beschreibt die Vision als τύπος, also als bildhafte oder vorbildhafte Darstellung. „Sinnbild“ vermeidet sowohl eine zeitliche Verengung auf ein bloßes Vorzeichen als auch eine konfessionell geprägte Deutung von „Drangsal“.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede „Brüder“ bleibt entsprechend ἀδελφοί erhalten; der knappe erzählerische Satzbau des Griechischen wird bewahrt.
