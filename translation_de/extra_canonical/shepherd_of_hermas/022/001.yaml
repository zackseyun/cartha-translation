revisions:
- from: Die Vision, die ich sah, Brüder, kam zwanzig Tage nach der vorherigen Vision; sie war ein Sinnbild für die kommende Bedrängnis.
  to: Die Vision, die ich sah, Brüder, hatte ich zwanzig Tage nach der vorherigen Vision; sie war ein Vorbild für die kommende Bedrängnis.
  rationale: Die Revision ersetzt die im Deutschen unnatürliche Personifikation der Vision durch eine idiomatische Zeitangabe und gibt εἰς τύπον mit „Vorbild für“ als funktionale, bildhafte Vorausdarstellung wieder. Der Text bleibt knapp, registergerecht und theologisch offen.
