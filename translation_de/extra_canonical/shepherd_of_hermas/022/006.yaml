  source_fidelity: 'Der deutsche Text gibt den griechischen Wortlaut insgesamt zuverlässig wieder: das anwachsende Staubphänomen, Hermas’ unbestimmte Vermutung (τι θεῖον), das sehr große Tier im Vergleich zu einem Meereswesen, die aus dem Maul kommenden feurigen Heuschrecken sowie die ungefähren Maße bleiben erhalten. „Tongefäß“ für κεράμου ist mit der erläuternden Fußnote als vertretbare, nicht überbestimmende Wiedergabe abgesichert.'
  naturalness: Flüssiges modernes Standarddeutsch in einem angemessen würdigen, visionär-erzählenden Register. Die Satzteilung nach dem Tiervergleich erhöht die Verständlichkeit, ohne den Sinn zu verändern. „Und siehe“ bewahrt die markierende Schauformel angemessen.
  terminology: Die zentralen Ausdrücke sind sachgerecht und theologisch zurückhaltend wiedergegeben. „Etwas Göttliches“ wahrt die Unbestimmtheit von τι θεῖον; „riesiges Tier“ legt θηρίον nicht unnötig als Dämon oder Ungeheuer aus. Die Fußnote zu κεράμου macht die lexikalische Bandbreite transparent, ohne eine bestimmte Deutung vorzuschreiben.
