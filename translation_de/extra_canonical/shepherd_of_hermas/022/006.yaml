base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: de
  text: Als die Staubwolke immer größer wurde, vermutete ich, dass es etwas Göttliches sei. Die Sonne brach ein wenig hervor, und siehe, ich erblickte ein riesiges Tier, gleichsam ein Seeungeheuer. Aus seinem Maul kamen feurige Heuschrecken hervor. Das Tier war ungefähr hundert Fuß lang, und sein Kopf glich einem Tongefäß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann allgemein etwas aus gebranntem Ton bezeichnen, etwa ein Tongefäß oder einen Ziegel beziehungsweise Dachziegel.
    reason: Die genaue Gestalt des mit κεράμου bezeichneten Vergleichsgegenstands ist mehrdeutig.
lexical_decisions:
- source_word: κονιορτός
  choice: Staubwolke
  rationale: Gibt die sichtbare, anwachsende Staubmasse im Kontext natürlicher wieder als das bloße „Staub“.
- source_word: τι θεῖον
  choice: etwas Göttliches
  rationale: Bewahrt die unbestimmte Formulierung des Griechischen, ohne sie als eindeutige Gotteserscheinung auszulegen.
- source_word: θηρίον μέγιστον
  choice: ein riesiges Tier
  rationale: Vermittelt die außergewöhnliche Größe und behält die allgemeine Bezeichnung θηρίον bei.
- source_word: ὡσεὶ κῆτός τι
  choice: gleichsam ein Seeungeheuer
  rationale: κῆτος bezeichnet ein großes Meereswesen oder Seeungeheuer; „gleichsam“ bewahrt den vergleichenden, unbestimmten Charakter.
- source_word: ἀκρίδες πύριναι
  choice: feurige Heuschrecken
  rationale: Entspricht der konkreten Bildsprache, ohne zu entscheiden, ob die Tiere aus Feuer bestehen oder nur feurig erscheinen.
- source_word: κεράμου
  choice: Tongefäß
  rationale: Gibt den Bezug auf einen Gegenstand aus gebranntem Ton verständlich wieder; die genaue Gegenstandsform bleibt textkritisch beziehungsweise lexikalisch unsicher und wird in der Fußnote erläutert.
theological_decisions:
- issue: Deutung von τι θεῖον
  choice: etwas Göttliches
  alternative: eine göttliche Erscheinung
  rationale: Der Text benennt Hermas’ Vermutung absichtlich unbestimmt; eine spezifische Offenbarungsform soll nicht in die Übersetzung eingetragen werden.
- issue: Symbolische Deutung des Tieres und der feurigen Heuschrecken
  choice: Keine Deutung im Haupttext
  alternative: Explizite Identifikation mit einer endzeitlichen oder dämonischen Macht
  rationale: Der Abschnitt schildert zunächst die Vision; ihre theologische Bedeutung darf nicht vorweggenommen oder konfessionell festgelegt werden.
translation_notes:
  register: Moderne, würdige Erzählsprache mit anschaulicher Bildlichkeit. Das präsentische „ich erblickte“ gibt das griechische historische Präsens idiomatisch im deutschen Erzähltempus wieder; „und siehe“ bewahrt den visionären Ton.
