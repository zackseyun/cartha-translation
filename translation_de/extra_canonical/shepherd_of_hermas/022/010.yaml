translation:
  language: de
  text: 'Das Tier hatte auf dem Kopf vier Farben: schwarz, dann feuer- und blutrot, dann golden, dann weiß.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: Die neutrale und im Kontext natürliche Wiedergabe wahrt die Bezeichnung des furchterregenden Wesens, ohne eine zoologische Bestimmung hinzuzufügen.
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: Feuerrot und Blutrot
  rationale: Die beiden koordinierten Farbangaben werden knapp und anschaulich wiedergegeben; das griechische καί bleibt als Verbindung erkennbar.
- source_word: χρυσοῦν
  choice: Gold
  rationale: Als parallele Farbbezeichnung ist „Gold“ im Deutschen natürlicher als das substantivierte „Goldenes“ und vermeidet die zusätzliche Festlegung auf „goldfarben“ oder „aus Gold“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Abfolge der vier Farben und die Zweigliedrigkeit der zweiten Farbangabe bleiben erhalten. Das griechische δέ wird nicht eigens mit „nun“ wiedergegeben, da es hier vor allem den Erzählgang fortführt; „schließlich“ macht dagegen die letzte Stufe der ausdrücklich geordneten Reihe im Deutschen natürlich kenntlich.
