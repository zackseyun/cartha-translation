  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: de
  text: Nachdem ich nun, Brüder, den Glauben des Herrn angezogen und mich an das Große erinnert hatte, das er mich gelehrt hatte, fasste ich Mut und ging auf das Tier zu. Das Tier aber kam mit einem solchen Getöse heran, dass es eine Stadt verwüsten konnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος
  choice: angezogen
  rationale: Bewahrt das griechische Bild des Ankleidens und gibt die metaphorische Verbindung mit dem Glauben unmittelbar wieder.
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: den Glauben des Herrn
  rationale: Erhält den mehrdeutigen Genitiv, der sowohl den auf den Herrn gerichteten als auch den vom Herrn ausgehenden Glauben bezeichnen kann.
- source_word: μεγαλείων
  choice: großen Dinge
  rationale: Bezeichnet hier die machtvollen, erhabenen Dinge, von denen Hermas unterwiesen wurde, ohne sie enger als Taten oder Wunder festzulegen.
- source_word: ἐμαυτὸν ἔδωκα
  choice: stellte ich mich
  rationale: Gibt die entschlossene Selbsthingabe beziehungsweise Konfrontation idiomatisch wieder, ohne nahezulegen, Hermas habe sich dem Tier ergeben.
- source_word: ῥοίζῳ
  choice: Getöse
  rationale: Gibt das bedrohliche sausende oder brausende Geräusch natürlich wieder; die genaue Klangart bleibt im Griechischen offen.
- source_word: λυμᾶναι
  choice: verwüsten
  rationale: Drückt zerstörerische Gewalt aus und entspricht dem möglichen Schaden an einer Stadt, ohne zwingend deren vollständige Vernichtung zu behaupten.
theological_decisions:
- issue: Genitiv in πίστιν τοῦ Κυρίου
  choice: Glauben des Herrn
  alternative: Glauben an den Herrn
  rationale: Die formal offene Wiedergabe bewahrt die genuine Mehrdeutigkeit des griechischen Genitivs.
- issue: Bezug von ὧν ἐδίδαξέν με μεγαλείων
  choice: die großen Dinge, die er mich gelehrt hatte
  alternative: die Machttaten, über die er mich belehrt hatte
  rationale: Die gewählte Fassung folgt der grammatischen Form des Textes und vermeidet, μεγαλείων ausschließlich als göttliche Taten oder Wunder zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Brüder“ entspricht dem Quelltext. Das Bild vom Anziehen des Glaubens bleibt bewusst erhalten; der Satzbau wurde für flüssige Lesbarkeit leicht gegliedert.
