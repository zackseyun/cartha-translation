  to: Nachdem ich nun, Brüder, den Glauben des Herrn angezogen und mich an das Große erinnert hatte, das er mich gelehrt hatte, fasste ich Mut und ging auf das Tier zu. Das Tier aber kam mit einem solchen Getöse heran, dass es eine Stadt verwüsten konnte.
  rationale: Die Revision stärkt die Wiedergabe von Hermas’ entschlossenem Sich-Aussetzen gegenüber dem Tier und beseitigt den im Griechischen nicht angelegten hypothetischen Konjunktiv. Das Bild des Anziehens und die Mehrdeutigkeit des Genitivs „des Herrn“ bleiben erhalten; μεγαλείων wird ohne dogmatische oder zu enge Festlegung als „das Große“ wiedergegeben.
