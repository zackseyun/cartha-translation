  source_fidelity: 'Der Text gibt die Abfolge und den Sinn des Griechischen zuverlässig wieder: Hermas beginnt zu weinen, bittet den Herrn um Befreiung von dem Tier und erinnert sich an das zuvor gehörte Wort. Das Pronomen „ihm“ bewahrt den im Kontext eindeutigen, aber im Satz selbst nicht nochmals explizierten Bezug auf das Tier (θηρίον).'
