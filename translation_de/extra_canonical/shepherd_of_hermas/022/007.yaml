  terminology: „erlösen“ ist für λυτρώσηται in diesem bedrohlichen, an den Herrn gerichteten Kontext tragfähig; es bezeichnet Befreiung, ohne zusätzliche theologische Festlegung. „Sei nicht hin- und hergerissen“ gibt διψυχήσεις als Warnung vor innerer Gespaltenheit bzw. Schwanken natürlich wieder und legt es nicht einseitig auf bloßes intellektuelles Zweifeln fest.
