base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: de
  text: 'Da begann ich zu weinen und den Herrn zu bitten, mich von ihm zu erlösen. Und ich erinnerte mich wieder an das Wort, das ich gehört hatte: »Sei nicht hin- und hergerissen, Hermas.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτᾶν
  choice: zu bitten
  rationale: Im Zusammenhang mit einer an den Herrn gerichteten Bitte gibt »bitten« den Sinn natürlicher wieder als das sonst mögliche »fragen«.
- source_word: λυτρώσηται
  choice: zu erlösen
  rationale: Bewahrt die Vorstellung der Befreiung aus drohender Gewalt und den gewichtigen Ton des griechischen Verbs.
- source_word: ἐπανεμνήσθην
  choice: ich erinnerte mich wieder
  rationale: Das Präfix ἐπαν- bezeichnet hier das erneute Sichbesinnen auf das zuvor gehörte Wort.
- source_word: διψυχήσεις
  choice: Sei nicht hin- und hergerissen
  rationale: Das Verb bezeichnet wörtlich ein »Doppelseeligsein«, idiomatisch inneres Schwanken oder Zweifeln. Die gewählte Form ist verständlich und lässt die Spannung zwischen Zweifel und geteilter Entschlossenheit bestehen.
theological_decisions:
- issue: Bedeutung von διψυχέω
  choice: Sei nicht hin- und hergerissen
  alternative: Zweifle nicht
  rationale: »Zweifle nicht« wäre enger und würde die mögliche Bedeutung innerer Zwiespältigkeit vorschnell festlegen. Die Übersetzung bewahrt den weiteren Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der pronominale Rückbezug »von ihm« bleibt wie im Griechischen auf das zuvor genannte Tier bezogen; es wird keine erklärende Ergänzung in den Text eingefügt.
