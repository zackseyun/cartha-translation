base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: de
  text: 'Und ich ging ein kleines Stück weiter, Brüder, und siehe, da sah ich eine Staubwolke bis zum Himmel. Da begann ich bei mir zu sagen: »Vielleicht kommt Vieh und wirbelt Staub auf?« Denn die Staubwolke war ungefähr ein Stadion[a] von mir entfernt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war eine antike Längeneinheit von ungefähr 185 Metern; der genaue Wert konnte regional schwanken.
    reason: Erklärt die beibehaltene antike Maßeinheit, ohne eine Scheingenauigkeit in den Haupttext einzutragen.
lexical_decisions:
- source_word: προσέβην μικρόν
  choice: ich ging ein kleines Stück weiter
  rationale: Gibt die kurze Vorwärtsbewegung natürlich und genau wieder.
- source_word: κονιορτόν
  choice: Staub
  rationale: Im Zusammenhang bezeichnet das Wort eine sichtbare, aufgewirbelte Staubwolke; das schlichte »Staub« bewahrt die Ausdrucksweise des Griechischen.
- source_word: κτήνη
  choice: Viehherden
  rationale: Das Wort meint Nutz- beziehungsweise Herdentiere; »Viehherden« macht den durch ihre Bewegung aufgewirbelten Staub im Deutschen unmittelbar verständlich.
- source_word: στάδιον
  choice: Stadion
  rationale: Die antike Maßeinheit wird beibehalten, da ihr genauer Wert je nach Ort und Zeit schwankte.
