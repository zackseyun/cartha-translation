revisions:
- from: 'Und ich ging ein kleines Stück weiter, Brüder, und siehe, da sah ich Staub, der wie bis zum Himmel aufstieg. Da begann ich bei mir zu sagen: »Vielleicht kommen Viehherden und wirbeln Staub auf?« Denn er war ungefähr ein Stadion[a] von mir entfernt.'
  to: 'Und ich ging ein kleines Stück weiter, Brüder, und siehe, da sah ich eine Staubwolke bis zum Himmel. Da begann ich bei mir zu sagen: »Vielleicht kommt Vieh und wirbelt Staub auf?« Denn die Staubwolke war ungefähr ein Stadion[a] von mir entfernt.'
  rationale: Die Revision glättet die deutsche Wiedergabe der himmelhohen Staubwolke, vermeidet die nicht vom Griechischen geforderte Spezifizierung „Herde“ und klärt den Bezug der Entfernungsangabe. Die anschauliche, leicht feierliche Erzählweise sowie das historische Präsens bleiben erhalten.
