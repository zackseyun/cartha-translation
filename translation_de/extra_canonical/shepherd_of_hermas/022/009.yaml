  to: Ich komme in seine Nähe, und das riesige Seeungeheuer streckt sich auf dem Boden aus und tut nichts weiter, als die Zunge herauszustrecken; es bewegt sich überhaupt nicht, bis ich an ihm vorübergegangen bin.
  rationale: Die Revision beseitigt allein die störende Wortwiederholung. Sie erhält das historische Präsens, die Größe und Unbestimmtheit von κῆτος, χαμαί als Lage auf dem Boden, die ausschließliche Handlung des Zungenherausstreckens sowie die zeitliche Grenze bis zum Vorübergehen.
