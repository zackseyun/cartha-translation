base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: de
  text: Ich komme in seine Nähe, und das riesige Seeungeheuer streckt sich auf dem Boden aus und tut nichts weiter, als die Zunge herauszustrecken; es bewegt sich überhaupt nicht, bis ich an ihm vorübergegangen bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τηλικοῦτο κῆτος
  choice: das riesige Seeungeheuer
  rationale: τηλικοῦτο hebt die gewaltige Größe hervor; κῆτος bezeichnet ein großes Meereswesen bzw. Seeungeheuer. Die Wiedergabe bewahrt das monströse Bild, ohne das Wesen genauer zu bestimmen.
- source_word: ἐκτείνει ἑαυτὸ χαμαί
  choice: streckt sich flach auf dem Boden aus
  rationale: ἐκτείνει ἑαυτό bedeutet, sich auszustrecken; χαμαί bezeichnet die Lage am Boden. „flach“ macht die Bodenlage im natürlichen Deutschen anschaulich.
- source_word: οὐδὲν εἰ μὴ τὴν γλῶσσαν προέβαλλεν
  choice: streckt nur die Zunge heraus
  rationale: Die griechische Ausnahmeformel bedeutet sinngemäß, dass das Tier nichts weiter tut, als die Zunge hervorzustrecken.
- source_word: μέχρις ὅτου παρῆλθον αὐτό
  choice: bis ich an ihm vorübergegangen bin
  rationale: παρέρχομαι mit Akkusativ meint hier das Vorübergehen an dem Tier; das deutsche Perfekt passt zur lebhaften historischen Gegenwart des Abschnitts.
theological_decisions: []
translation_notes:
  register: Lebhafte Erzählung im historischen Präsens, in modernem, würdigem Standarddeutsch. Das ungewöhnliche κῆτος bleibt als „Seeungeheuer“ bildhaft und wird nicht zoologisch festgelegt.
