    issue: Unmittelbare Wiederholung von „streckt“
    rationale: „streckt sich ... aus und streckt nur die Zunge heraus“ ist zwar verständlich, aber stilistisch holprig. Das Griechische kontrastiert das Ausstrecken des ganzen Wesens mit der einzigen Handlung, dem Hervorstrecken der Zunge; „tut nichts weiter, als ...“ gibt dies natürlich und präzise wieder.
  revised_text: Ich komme in seine Nähe, und das riesige Seeungeheuer streckt sich auf dem Boden aus und tut nichts weiter, als die Zunge herauszustrecken; es bewegt sich überhaupt nicht, bis ich an ihm vorübergegangen bin.
