base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: de
  text: 'Während ich ihn pries und ihm dankte, antwortete mir etwas wie der Klang einer Stimme: »Zweifle nicht, Hermas.« Da begann ich, bei mir selbst zu überlegen und zu sagen: »Was sollte mich zweifeln lassen, da ich doch vom Herrn so fest gegründet worden bin und Herrliches gesehen habe?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζοντός
  choice: pries
  rationale: Gibt das aktive Ehren und Verherrlichen Gottes in natürlichem, würdigem Deutsch wieder.
- source_word: ὡς ἦχος φωνῆς
  choice: etwas wie der Klang einer Stimme
  rationale: Bewahrt den vergleichenden und hinsichtlich der Erscheinungsweise zurückhaltenden Ausdruck ὡς.
- source_word: διψυχήσεις / διψυχῆσαι
  choice: unentschlossen sein
  rationale: διψυχέω bezeichnet hier ein inneres Schwanken beziehungsweise Zweifeln. »Unentschlossen« ist verständlich und bewahrt die psychische Spannung, ohne das ungewöhnliche griechische Bild wörtlich als »doppelherzig« festzulegen.
- source_word: τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: Der Herr hat mir doch ein so festes Fundament gegeben
  rationale: Überträgt das Fundamentbild und die göttliche Urheberschaft natürlich; das griechische Perfekt bezeichnet einen gefestigten gegenwärtigen Zustand.
- source_word: ἔνδοξα πράγματα
  choice: Herrliches
  rationale: Knappes, idiomatisches Deutsch für die ruhmreichen beziehungsweise herrlichen Dinge, die Hermas gesehen hat.
theological_decisions:
- issue: Bedeutung von διψυχέω
  choice: »unentschlossen sein«
  alternative: »zweifeln« oder »doppelherzig sein«
  rationale: Das Wort kann zwischen Zweifel, innerem Schwanken und geteilter Gesinnung liegen. Der Kontext betont Hermas’ inneres Fragen angesichts einer göttlichen Mahnung; »unentschlossen« lässt diese Spannung offen und vermeidet eine konfessionell oder moralisch engere Deutung.
- issue: Urheberschaft der Festigung
  choice: »Der Herr hat mir ... ein so festes Fundament gegeben«
  alternative: »vom Herrn so fest gegründet«
  rationale: Beide entsprechen dem Passiv mit ὑπό. Die gewählte aktive Form klingt im modernen Deutsch natürlicher und wahrt zugleich eindeutig den Herrn als Handelnden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt lebendig; die eigentümliche Vergleichsformel bei der Stimme und das Fundamentbild des griechischen Textes werden bewahrt.
