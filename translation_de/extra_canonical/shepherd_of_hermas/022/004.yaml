  to: 'Während ich ihn pries und ihm dankte, antwortete mir etwas wie der Klang einer Stimme: »Zweifle nicht, Hermas.« Da begann ich, bei mir selbst zu überlegen und zu sagen: »Was sollte mich zweifeln lassen, da ich doch vom Herrn so fest gegründet worden bin und Herrliches gesehen habe?«'
