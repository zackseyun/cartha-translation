base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/002.yaml
  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: de
  text: Ich ging auf der Kampanischen Straße hinaus aufs Land. Von der öffentlichen Straße sind es etwa zehn Stadien; der Weg dorthin ist leicht zu begehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπῆγον εἰς ἀγρόν
  choice: Ich ging … hinaus aufs Land
  rationale: Gibt die Bewegung in ländliches Gebiet natürlich wieder, ohne ἀγρός unnötig auf ein einzelnes Feld einzuengen.
- source_word: τῇ ὁδῷ τῇ Καμπανῇ
  choice: auf der Kampanischen Straße
  rationale: Bewahrt den antiken Eigennamen der Route und gibt den Dativ als Wegangabe wieder.
- source_word: τῆς ὁδοῦ τῆς δημοσίας
  choice: der öffentlichen Straße
  rationale: Formale und verständliche Wiedergabe; gemeint ist die öffentliche Hauptstraße, doch diese Präzisierung steht nicht ausdrücklich im Text.
- source_word: ὡσεὶ στάδια δέκα
  choice: etwa zehn Stadien
  rationale: Bewahrt die antike Maßeinheit und den Näherungscharakter von ὡσεί.
- source_word: ῥᾳδίως δὲ ὁδεύεται ὁ τόπος
  choice: der Weg dorthin ist leicht zu begehen
  rationale: Natürliches Deutsch für die unpersönliche Aussage; τόπος bezeichnet hier im Zusammenhang den Zugang beziehungsweise die Strecke zum Ort.
