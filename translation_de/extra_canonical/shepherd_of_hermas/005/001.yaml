  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: de
  text: Als ich nach Cumae unterwegs war, zur selben Jahreszeit wie im Jahr zuvor, erinnerte ich mich beim Gehen an die Vision des Vorjahres. Wieder hebt mich ein Geist[a] empor und trägt mich fort an denselben Ort wie im Jahr zuvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Geist. Im Griechischen steht lediglich »Geist«, ohne nähere Bestimmung.'
    reason: Die Formulierung bewahrt die grammatische und theologische Mehrdeutigkeit des artikellosen πνεῦμα.
lexical_decisions:
- source_word: Πορευομένου μου εἰς Κούμας
  choice: Als ich nach Cumae unterwegs war
  rationale: Gibt die Genitivus-absolute-Konstruktion idiomatisch wieder; der antike Ortsname Κούμας wird als Cumae beibehalten.
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: zur selben Jahreszeit wie im Jahr zuvor
  rationale: καιρός bezeichnet hier den entsprechenden Zeitpunkt beziehungsweise die Jahreszeit, nicht bloß allgemein »Zeit«.
- source_word: περιπατῶν ἀνεμνήσθην
  choice: erinnerte ich mich beim Gehen
  rationale: Bewahrt sowohl die begleitende Handlung des Gehens als auch den intransitiven Sinn von ἀναμιμνῄσκομαι.
- source_word: αἴρει … καὶ ἀποφέρει
  choice: ergriff mich … und trug mich fort
  rationale: Vermittelt die plötzliche, übernatürliche Versetzung natürlich im Deutschen; das griechische historische Präsens wird passend zum Erzählzusammenhang im Präteritum wiedergegeben.
- source_word: εἰς τὸν αὐτὸν τόπον
  choice: an denselben Ort
  rationale: Entspricht der räumlichen Zielangabe, ohne zusätzliche Deutung.
theological_decisions:
- issue: Identität und Bestimmtheit von πνεῦμα
  choice: ein Geist
  alternative: der Geist / der Geist Gottes
  rationale: πνεῦμα steht ohne Artikel und wird im Satz nicht ausdrücklich als Gottes Geist bestimmt. Die gewählte Form wahrt diese Offenheit; eine Fußnote nennt die ebenfalls mögliche bestimmte Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. Die Wiederholung »wie im Jahr zuvor« bildet die Wiederholung von πέρυσι im Ausgangstext ab; »Vision« entspricht ὅρασις im erzählerischen Kontext.
