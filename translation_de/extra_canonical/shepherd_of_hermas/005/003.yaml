  naturalness: Das Deutsch ist insgesamt flüssig und modern. Die direkte Rede lässt sich mit „und du wirst es mir zurückgeben“ natürlich formulieren. „Die ältere Frau“ ist als neutrale Wiedergabe von πρεσβυτέρα angemessen und legt kein Amt nahe.
  terminology: „die Erwählten Gottes“, „kleines Buch“, „abschreiben“ und „Herrin“ sind vertretbare, quellennahe Entscheidungen. „Diese Dinge“ bildet das griechische Pluralpronomen ταῦτα etwas deutlicher ab als das kollektiv gebrauchte „dies“.
