revisions:
- from: 'Nachdem ich vom Gebet aufgestanden war, sehe ich vor mir die ältere Frau, die ich auch im vergangenen Jahr gesehen hatte. Sie ging umher und las in einem kleinen Buch. Sie sagt zu mir: »Kannst du dies den Erwählten Gottes verkünden?« Ich sage zu ihr: »Herrin, so vieles kann ich mir nicht merken. Gib mir aber das kleine Buch, damit ich es abschreiben kann.« Sie sagt: »Nimm es und gib es mir zurück.«'
  to: 'Nachdem ich vom Gebet aufgestanden war, sehe ich vor mir die ältere Frau, die ich auch im vergangenen Jahr gesehen hatte. Sie ging umher und las in einem kleinen Buch. Sie sagt zu mir: »Kannst du diese Dinge den Erwählten Gottes verkünden?« Ich sage zu ihr: »Herrin, so vieles kann ich mir nicht merken. Gib mir aber das kleine Buch, damit ich es abschreiben kann.« Sie sagt: »Nimm es und du wirst es mir zurückgeben.«'
  rationale: 'Die Übersetzung wird nur dort geändert, wo der griechische Wortlaut eine andere Satzfunktion verlangt: Das Futur ἀποδώσεις wird als Zukunftsaussage wiedergegeben. Außerdem wird ταῦτα mit dem expliziten Plural „diese Dinge“ abgebildet. Die übrigen Formulierungen bleiben bestehen, da sie den griechischen Text und den modernen deutschen Registeranspruch angemessen wiedergeben.'
