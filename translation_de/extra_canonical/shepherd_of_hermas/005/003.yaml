  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: de
  text: 'Nachdem ich vom Gebet aufgestanden war, sehe ich vor mir die ältere Frau, die ich auch im vergangenen Jahr gesehen hatte. Sie ging umher und las in einem kleinen Buch. Sie sagt zu mir: »Kannst du diese Dinge den Erwählten Gottes verkünden?« Ich sage zu ihr: »Herrin, so vieles kann ich mir nicht merken. Gib mir aber das kleine Buch, damit ich es abschreiben kann.« Sie sagt: »Nimm es und du wirst es mir zurückgeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: die ältere Frau
  rationale: Gibt die weibliche Komparativform natürlich wieder, ohne durch »Älteste« ein kirchliches Amt nahezulegen.
- source_word: βιβλαρίδιον / βιβλίδιον
  choice: ein kleines Buch / das kleine Buch
  rationale: Bewahrt den Diminutivcharakter; »Büchlein« wäre möglich, wirkt im heutigen Deutsch jedoch etwas altertümlicher.
- source_word: ἀναγγεῖλαι
  choice: verkünden
  rationale: Bezeichnet hier die Weitergabe einer offenbarten Botschaft an Gottes Erwählte und ist stärker als ein bloßes »berichten«.
- source_word: μεταγράψωμαι
  choice: abschreiben
  rationale: Gibt das Anfertigen einer schriftlichen Kopie direkt und idiomatisch wieder.
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle direkte Anrede und die Beziehung zum maskulinen κύριος, ohne sie zu einer bloßen Höflichkeitsformel abzuschwächen.
theological_decisions:
- issue: Bezeichnung der Adressaten als τοῖς ἐκλεκτοῖς τοῦ Θεοῦ
  choice: den Erwählten Gottes
  alternative: den von Gott Erwählten
  rationale: Die knappe Genitivverbindung bleibt erhalten, ohne näher festzulegen, wie Erwählung und Zugehörigkeit zueinander stehen.
- issue: Historisches Präsens in βλέπω, λέγει und λέγω
  choice: sehe / sagt / sage
  alternative: sah / sagte
  rationale: Das griechische Tempus wird bewahrt; es vergegenwärtigt die Vision und entspricht dem bewusst lebhaften Erzählstil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem historischem Präsens. Die Satzfolge folgt dem Griechischen, wurde aber leicht gegliedert, damit sie für heutige Leser natürlich klingt. Keine Fußnoten erforderlich.
