  register: Moderne, würdige Erzählsprache. Der Satzbau wurde maßvoll gegliedert, während der Buchstaben-Silben-Kontrast und die Unbestimmtheit des Handelnden bei der plötzlichen Wegnahme gewahrt bleiben.
