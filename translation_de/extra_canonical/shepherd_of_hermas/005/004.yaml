  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/004.yaml
  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: de
  text: Ich nahm es und zog mich an einen Platz auf dem Feld zurück. Dort schrieb ich alles Buchstabe für Buchstabe ab, denn ich konnte die Silben nicht erkennen. Als ich nun die Buchstaben des Buches abgeschrieben hatte, wurde mir das Büchlein plötzlich aus der Hand gerissen; von wem, sah ich jedoch nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναχωρήσας
  choice: zog mich … zurück
  rationale: Gibt die räumliche Absonderung an einen anderen Ort natürlich und quellennah wieder.
- source_word: πρὸς γράμμα
  choice: Buchstabe für Buchstabe
  rationale: Bewahrt den betonten Gegensatz zwischen einzelnen Buchstaben und den anschließend genannten Silben.
- source_word: οὐχ ηὕρισκον … τὰς συλλαβάς
  choice: ich konnte die Silben nicht erkennen
  rationale: Das idiomatische deutsche »erkennen« erhält die Schwierigkeit des Erzählers, die Schrift zu Silben zusammenzufassen, ohne eine weitergehende Erklärung einzutragen.
- source_word: ἡρπάγη
  choice: wurde … gerissen
  rationale: Die passive, plötzliche und gewaltsame Wegnahme bleibt erhalten; der Handelnde wird wie im Griechischen nicht genannt.
- source_word: βιβλίδιον
  choice: Büchlein
  rationale: Gibt die Diminutivform wieder und knüpft natürlich an den zuvor erwähnten Gegenstand an.
theological_decisions: []
