  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/002.yaml
  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: de
  text: Als ich nun an den Ort gekommen war, kniete ich nieder und begann, zum Herrn zu beten und seinen Namen zu preisen, weil er mich für würdig erachtet und mir meine früheren Sünden zu erkennen gegeben hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: kniete ich nieder
  rationale: Die wörtliche Wendung „die Knie setzen/beugen“ wird im natürlichen modernen Deutsch idiomatisch wiedergegeben.
- source_word: δοξάζειν
  choice: zu preisen
  rationale: Im Gebetskontext bezeichnet das Verb das ehrende Verherrlichen Gottes; „preisen“ ist verständlich und würdevoll.
- source_word: ἄξιον ἡγήσατο
  choice: mich für würdig erachtet
  rationale: Bewahrt die ausdrückliche Würdigkeitsbeurteilung des griechischen Textes, ohne sie weiter auszudeuten.
- source_word: ἐγνώρισέν μοι
  choice: mir … zu erkennen gegeben hatte
  rationale: 'Gibt die kausative Bedeutung wieder: Der Herr ließ ihn seine Sünden erkennen.'
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: meine früheren Sünden
  rationale: „Früher“ bildet πρότερον knapp ab und lässt offen, auf welchen früheren Zeitraum genau Bezug genommen wird.
theological_decisions:
- issue: Würdigkeit vor Gott
  choice: „weil er mich für würdig erachtet“
  alternative: „weil er mich dessen für würdig befunden hatte“
  rationale: Die Formulierung folgt dem Text eng und fügt weder einen Verdienstgedanken noch dessen Zurückweisung hinzu.
- issue: Erkenntnis der Sünden
  choice: „mir meine früheren Sünden zu erkennen gegeben hatte“
  alternative: „mir meine früheren Sünden offenbart hatte“
  rationale: „Zu erkennen gegeben“ wahrt die Bedeutung von ἐγνώρισεν, ohne durch „offenbart“ unnötig eine stärker technische Offenbarungsterminologie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Aussage des griechischen Ausgangstextes. Das historische Präsens τιθῶ wird im Deutschen dem Erzählzusammenhang entsprechend als Präteritum wiedergegeben.
