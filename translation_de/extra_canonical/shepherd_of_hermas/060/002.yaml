    issue: Aspekt von ἐπεδίδου
    rationale: Das Imperfekt schildert ein fortgesetztes bzw. wiederholtes Austeilen; das einfache „gab“ lässt dies weniger deutlich erkennen.
  - severity: low
    issue: Wiedergabe von σκεπαζομένῳ
    rationale: „Schutz fanden“ kann einen Eintritt in den Schutz nahelegen, während der griechische Partizip die Menschen als unter der Weide beschirmt beschreibt.
