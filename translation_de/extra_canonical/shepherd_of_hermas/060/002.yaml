base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: de
  text: Neben der Weide stand ein Engel des Herrn, überaus herrlich und sehr hoch. Er hielt eine große Sichel in der Hand, schnitt Zweige von der Weide ab und reichte sie den Menschen, die im Schutz der Weide standen. Er teilte ihnen kleine Ruten aus, etwa eine Elle lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰτέαν
  choice: Weide
  rationale: Die gewöhnliche und bildlich passende Wiedergabe von ἰτέα.
- source_word: δρέπανον
  choice: Sichel
  rationale: Bezeichnet ein gebogenes Schneidewerkzeug; „Sichel“ ist die natürliche deutsche Entsprechung.
- source_word: κλάδους
  choice: Zweige
  rationale: Im Zusammenhang mit dem Abschneiden und Austeilen kleiner Holzstücke ist „Zweige“ idiomatischer als „Äste“.
- source_word: σκεπαζομένῳ
  choice: Schutz fanden
  rationale: Gibt den passivischen Sinn des Sich-unter-dem-Baum-Befindens bzw. Beschirmtwerdens natürlich wieder, ohne eine weitergehende symbolische Deutung festzulegen.
- source_word: ῥαβδία
  choice: Ruten
  rationale: Das Diminutiv bezeichnet kleine Stäbe oder Ruten; „Ruten“ bewahrt den Bezug zu den abgeschnittenen Zweigen.
- source_word: πηχυαῖα
  choice: eine Elle lang
  rationale: Gibt das antike Längenmaß verständlich und formal nah wieder.
theological_decisions:
- issue: Bezeichnung und Erscheinung des Engels
  choice: „ein Engel des Herrn, überaus herrlich und sehr groß“
  alternative: „der Engel des Herrn, höchst ruhmreich und sehr hochgewachsen“
  rationale: Der griechische Text bezeichnet die Gestalt als Engel des Herrn und beschreibt ihre eindrucksvolle Erscheinung, ohne eine besondere Identifikation nahezulegen. Der unbestimmte Artikel vermeidet den Import einer feststehenden theologischen Titulatur.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die lange griechische Satzfolge wurde zur besseren Verständlichkeit in mehrere Sätze gegliedert; die wiederholten Handlungen und alle konkreten Bilddetails bleiben erhalten.
