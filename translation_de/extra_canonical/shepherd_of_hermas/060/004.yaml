base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: de
  text: Der Engel, der dem Volk die Ruten gegeben hatte, forderte sie wieder von ihnen zurück. So, wie sie sie empfangen hatten, wurden sie auch zu ihm gerufen, und jeder Einzelne gab seine Rute zurück. Der Engel des Herrn nahm sie entgegen und prüfte sie genau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους / ῥάβδους
  choice: Ruten
  rationale: Im Zusammenhang sind abgeschnittene, etwa ellenlange Zweige gemeint. „Ruten“ ist im Deutschen natürlich, hält die Bildsprache durchgehend fest und vermeidet die mögliche Amtsbedeutung von „Stäben“.
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: forderte sie nun wieder von ihnen zurück
  rationale: ἀπαιτέω bezeichnet hier das Zurückfordern dessen, was zuvor ausgehändigt worden war; „nun“ gibt den erzählerischen Fortgang von πάλιν idiomatisch wieder.
- source_word: καθὼς ἔλαβον, οὕτω καὶ ἐκαλοῦντο πρὸς αὐτόν
  choice: In derselben Reihenfolge, in der sie sie empfangen hatten, wurden sie zu ihm gerufen
  rationale: Der Vergleich bezieht sich im Kontext am plausibelsten auf die geordnete Vorladung entsprechend dem Empfang. Die Formulierung macht diesen syntaktisch knappen Sinn verständlich, ohne eine neue Handlung einzuführen.
- source_word: εἷς ἕκαστος αὐτῶν
  choice: jeder Einzelne
  rationale: Bewahrt die betonte individuelle Rechenschaft, die durch εἷς ἕκαστος ausgedrückt wird.
- source_word: κατενόει
  choice: prüfte sie genau
  rationale: κατανοέω bedeutet aufmerksames Betrachten beziehungsweise genaues Untersuchen; „prüfte sie genau“ passt zur anschließenden Einteilung nach ihrem Zustand.
theological_decisions:
- issue: Identität des Engels
  choice: Der Engel des Herrn
  alternative: der Engel des Herrn / der Engel des HERRN
  rationale: Die Übersetzung folgt dem Genitiv τοῦ Κυρίου formal, ohne den Engel mit dem Herrn gleichzusetzen oder durch typografische Konventionen eine besondere dogmatische Identifikation anzudeuten.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholungen des griechischen Textes werden weitgehend bewahrt, während der lange Satz zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert ist. Keine Fußnoten erforderlich.
