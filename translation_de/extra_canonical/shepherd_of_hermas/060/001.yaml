  to: … von ganzem Herzen. Meinst du also, dass denen, die umkehren, ihre Sünden sofort vergeben werden? Nicht vollständig. Vielmehr muss der Umkehrende seiner eigenen Seele Schmerz zufügen, sich bei allem, was er tut, ganz demütig verhalten und allerlei Bedrängnisse erleiden. Wenn er die Bedrängnisse erträgt, die über ihn kommen, wird der, der alles erschaffen und gestärkt hat, gewiss Erbarmen haben und eine gewisse Heilung schenken. Dies wird geschehen, wenn Gott[a] sieht, dass das Herz des Umkehrenden von allem rein ist.
