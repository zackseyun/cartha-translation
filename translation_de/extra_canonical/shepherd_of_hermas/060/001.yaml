base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: de
  text: … von ganzem Herzen. Meinst du also, dass denen, die umkehren, ihre Sünden sofort vergeben werden? Nicht vollständig. Vielmehr muss der Umkehrende seiner eigenen Seele Schmerz zufügen, sich bei allem, was er tut, ganz demütig verhalten und allerlei Bedrängnisse erleiden. Wenn er die Bedrängnisse erträgt, die über ihn kommen, wird der, der alles erschaffen und gestärkt hat, gewiss Erbarmen haben und eine gewisse Heilung schenken. Dies wird geschehen, wenn Gott[a] sieht, dass das Herz des Umkehrenden von allem rein ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gott“ ist im zugrunde liegenden griechischen Text an dieser beschädigten Übergangsstelle redaktionell ergänzt; der Satz bricht nach „von allem“ ab.
    reason: Die Quellenvorlage kennzeichnet ὁ Θεός als Ergänzung und geht anschließend unvermittelt in einen anderen Abschnitt über. Die Fußnote macht die Textunsicherheit sichtbar.
lexical_decisions:
- source_word: μετανοούντων / μετανοοῦντα
  choice: die umkehren / der Umkehrende
  rationale: Gibt die fortdauernde Sinnes- und Lebenswende des Partizips wieder, ohne sie auf bloße Reue zu verengen.
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: seiner eigenen Seele Schmerz zufügen
  rationale: Bewahrt die Härte von βασανίζω, klingt aber im Deutschen natürlicher als die missverständliche wörtliche Formulierung „seine Seele foltern“.
- source_word: ταπεινοφρονῆσαι
  choice: sich … demütigen
  rationale: Bringt die geforderte demütige Haltung und Lebensführung zum Ausdruck; der Kontext betont praktisches Verhalten.
- source_word: θλίψεις ποικίλαις
  choice: vielerlei Bedrängnisse
  rationale: Bewahrt sowohl die Verschiedenartigkeit als auch den Druck und die Not, die θλῖψις bezeichnet.
- source_word: σπλαγχνισθήσεται
  choice: wird … Erbarmen haben
  rationale: Gibt das starke innere Mitleid des Verbs in natürlichem, würdevollem Deutsch wieder.
- source_word: ἴασίν τινα
  choice: eine gewisse Heilung
  rationale: Das unbestimmte τινα wird ausdrücklich bewahrt und nicht zu einer uneingeschränkten oder abschließenden Heilung verstärkt.
theological_decisions:
- issue: Verhältnis von Umkehr, Leiden und Vergebung
  choice: Die Abfolge und Bedingtheit der griechischen Aussage bleibt unverändert stehen.
  alternative: Die Passage als Aussage über verdienstliche Sühne oder umgekehrt als rein pädagogische Folge der Umkehr auslegen.
  rationale: Der Text verbindet Umkehr, Demütigung, Bedrängnis, Erbarmen und Heilung in theologischer Spannung; eine konfessionelle Systematisierung wäre ein Zusatz.
- issue: οὐ παντελῶς
  choice: Keineswegs vollständig
  alternative: Nein, überhaupt nicht
  rationale: παντελῶς kann totale Verneinung oder fehlende Vollständigkeit ausdrücken. Die gewählte Form bewahrt die auffällige, auch im Konsultationstext erkennbare Nuance, ohne den Satz stärker festzulegen.
- issue: ὁ τὰ πάντα κτίσας καὶ ἐνδυναμώσας
  choice: der, der alles erschaffen und gestärkt hat
  alternative: der alles erschaffen und den Umkehrenden gestärkt hat
  rationale: Beim zweiten Partizip fehlt ein ausdrückliches Objekt. Die Übersetzung bewahrt diese syntaktische Offenheit und folgt nicht einer theologischen Ergänzung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die direkte Frageform, die strenge Mahnung und die theologische Spannung des griechischen Textes bleiben erhalten. Der fragmentarische Beginn wird durch die Auslassungspunkte angezeigt.
