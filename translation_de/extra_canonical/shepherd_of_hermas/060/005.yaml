base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: de
  text: Von einigen nahm er die Stäbe trocken und wie von Motten zerfressen entgegen. Der Engel befahl denen, die solche Stäbe abgegeben hatten, sich gesondert aufzustellen. Andere gaben trockene Stäbe ab, die jedoch nicht von Motten zerfressen waren; auch ihnen befahl er, sich gesondert aufzustellen. Andere gaben halb vertrocknete Stäbe ab; auch sie stellten sich gesondert auf. Andere gaben ihre Stäbe halb vertrocknet und mit Rissen ab; auch sie stellten sich gesondert auf. Andere gaben ihre Stäbe grün und mit Rissen ab; auch sie stellten sich gesondert auf. Andere gaben ihre Stäbe zur Hälfte trocken und zur Hälfte grün ab; auch sie stellten sich gesondert auf. Andere brachten ihre Stäbe, deren zwei Drittel grün und ein Drittel trocken waren; auch sie stellten sich gesondert auf. Andere gaben Stäbe ab, deren zwei Drittel trocken und ein Drittel grün waren; auch sie stellten sich gesondert auf. Andere gaben ihre Stäbe fast vollständig grün ab; nur ein ganz kleiner Teil ihrer Stäbe war trocken,
    nämlich die äußerste Spitze. Sie hatten jedoch Risse; auch sie stellten sich gesondert auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: Stäbe
  rationale: Bezeichnet hier die vom Baum ausgeteilten kurzen Zweige bzw. Stäbe; „Stäbe“ hält die wiederkehrende Bildsprache einheitlich und ist im Deutschen natürlich.
- source_word: ξηράς / ἡμιξήρους
  choice: trocken / halb vertrocknet
  rationale: Die abgestufte Zustandsbeschreibung wird bewahrt. Bei ἡμιξήρους macht „halb vertrocknet“ den fortschreitenden Verlust der Frische idiomatisch deutlich.
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: wie von Motten zerfressen
  rationale: Gibt den Vergleich ausdrücklich wieder. σητός bezeichnet einen schädigenden Fraß, traditionell Motten- oder Wurmfraß; „Motten“ folgt dem naheliegenden Bild, ohne einen tatsächlichen Verursacher zu behaupten.
- source_word: χλωράς
  choice: grün
  rationale: Bewahrt die konkrete Farbe und damit das Sinnbild von Frische beziehungsweise Lebendigkeit, ohne es deutend aufzulösen.
- source_word: σχισμάς
  choice: Risse
  rationale: Gibt sichtbare Spaltungen oder Aufrisse im Stab sachlich und bildhaft wieder.
- source_word: χωρὶς ἵστασθαι
  choice: sich gesondert aufzustellen
  rationale: Drückt sowohl die räumliche Absonderung als auch das angeordnete Stehen aus.
theological_decisions:
- issue: Symbolische Bedeutung der verschiedenen Stabzustände
  choice: Die Zustände werden rein bildlich und konkret wiedergegeben, ohne ihre spätere Auslegung vorwegzunehmen.
  alternative: Die Stäbe bereits hier ausdrücklich auf geistliche Zustände oder Personengruppen zu beziehen.
  rationale: Der vorliegende Abschnitt beschreibt zunächst die Sichtung. Eine vorgezogene Deutung würde die Erzählfolge verändern und theologische Eindeutigkeit importieren.
- issue: Vergleichspartikel ὡς beim Schädlingsfraß
  choice: „wie von Motten zerfressen“
  alternative: „von Motten zerfressen“
  rationale: Das griechische ὡς lässt den Verursacher vergleichend beziehungsweise als Erscheinungsbild formuliert; diese Nuance bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst wiederholtem Satzbau, der die katalogartige Struktur des griechischen Textes wahrt. Keine Fußnoten erforderlich; daher erscheinen keine Fußnotenmarker im Haupttext.
