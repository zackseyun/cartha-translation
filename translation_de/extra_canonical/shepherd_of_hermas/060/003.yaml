base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: de
  text: 'Nachdem alle die Ruten erhalten hatten, legte der Engel die Sichel beiseite, und jener Baum war gesund, so wie ich ihn gesehen hatte. Ich wunderte mich bei mir und dachte: »Wie kann der Baum gesund sein, obwohl so viele Zweige abgeschnitten wurden?« Der Hirte sagte zu mir: »Wundere dich nicht, dass der Baum gesund geblieben ist, obwohl so viele Zweige abgeschnitten wurden. Warte ab, bis du alles gesehen hast; dann wird dir gezeigt werden, was es ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία / ῥάβδους
  choice: Ruten
  rationale: Bezeichnet hier die kleinen, etwa ellenlangen abgeschnittenen Zweige, die an das Volk verteilt werden; „Ruten“ hält den Bezug zu den Zweigen fest und passt zum späteren Zurückgeben.
- source_word: ὑγιές
  choice: unversehrt
  rationale: Im Zusammenhang mit einem Baum bedeutet das Wort, dass dieser trotz der abgeschnittenen Zweige heil beziehungsweise ohne sichtbaren Schaden blieb. „Unversehrt“ gibt den überraschenden Gegensatz natürlich wieder.
- source_word: ἐν ἐμαυτῷ λέγων
  choice: sagte bei mir
  rationale: Gibt den inneren Monolog idiomatisch wieder, ohne daraus hörbares Sprechen zu machen.
- source_word: ἄφες δὲ ἕως πάντα ἴδῃς
  choice: Warte vielmehr, bis du alles gesehen hast
  rationale: Das imperativische ἄφες hat hier den Sinn von „lass es vorerst sein / warte ab“; die gewählte Formulierung ist klar und bewahrt die zeitliche Aufforderung.
- source_word: δηλωθήσεταί σοι τὸ τί ἐστιν
  choice: dann wird dir erklärt werden, was dies bedeutet
  rationale: Die Passivform bleibt erhalten; „bedeutet“ passt zur angekündigten Deutung des visionären Zeichens besser als ein rein identifizierendes „ist“.
theological_decisions:
- issue: Deutung des Baumes
  choice: Die symbolische Bedeutung wird noch nicht benannt.
  alternative: Den Baum bereits hier ausdrücklich mit einem theologischen Gegenstand identifizieren.
  rationale: Der griechische Text verschiebt die Erklärung ausdrücklich auf später; die Übersetzung darf diese Spannung nicht vorzeitig auflösen.
- issue: Unausgesprochen Handelnder bei δηλωθήσεται
  choice: 'Unpersönliches Passiv: „wird dir erklärt werden“.'
  alternative: „Gott/der Hirte wird dir erklären“.
  rationale: Der Ausgangstext nennt den Handelnden nicht; eine ausdrückliche Zuschreibung würde zusätzliche Auslegung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Die direkte Rede ist natürlich formuliert; Wiederholungen des griechischen Textes bleiben weitgehend erhalten. Keine Fußnoten erforderlich.
