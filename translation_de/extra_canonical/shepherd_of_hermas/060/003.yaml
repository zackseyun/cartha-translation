revisions:
- from: 'Nachdem alle die Ruten erhalten hatten, legte der Engel die Sichel beiseite. Der Baum aber war unversehrt, so wie ich ihn zuvor gesehen hatte. Da wunderte ich mich und sagte bei mir: »Wie kann der Baum unversehrt sein, obwohl so viele Zweige abgeschnitten wurden?« Der Hirte sagte zu mir: »Wundere dich nicht darüber, dass der Baum unversehrt geblieben ist, obwohl so viele Zweige abgeschnitten wurden. Warte vielmehr, bis du alles gesehen hast; dann wird dir erklärt werden, was dies bedeutet.«'
  to: 'Nachdem alle die Ruten erhalten hatten, legte der Engel die Sichel beiseite, und jener Baum war gesund, so wie ich ihn gesehen hatte. Ich wunderte mich bei mir und dachte: »Wie kann der Baum gesund sein, obwohl so viele Zweige abgeschnitten wurden?« Der Hirte sagte zu mir: »Wundere dich nicht, dass der Baum gesund geblieben ist, obwohl so viele Zweige abgeschnitten wurden. Warte ab, bis du alles gesehen hast; dann wird dir gezeigt werden, was es ist.«'
