  yaml_path: translation/extra_canonical/shepherd_of_hermas/057/001.yaml
  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: de
  text: 'Ich sage zu ihm: »Herr, erkläre mir auch dies noch.« Er sagt: »Was möchtest du wissen?« Ich sage: »Werden also, Herr, diejenigen, die üppig leben und sich täuschen lassen, ebenso lange gequält, wie die Täuschung dauert? Denn die Zeit der Täuschung ist eine Stunde; die Stunde der Qual aber hat die Wirkung von dreißig Tagen. Wenn nun jemand einen Tag lang üppig lebt und sich täuschen lässt und dann einen Tag lang gequält wird, so zählt der Tag der Qual wie ein ganzes Jahr. So viele Tage also jemand üppig lebt, ebenso viele Jahre wird er gequält.« Er sagt: »Du siehst also: Die Zeit des üppigen Lebens und der Täuschung ist äußerst kurz, die Zeit der Strafe und der Qual aber lang.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ
  choice: im Genuss leben
  rationale: Gibt das selbstgefällige, luxuriöse Genießen verständlich wieder, ohne die Bedeutung unnötig auf Ausschweifung oder Schwelgerei zu verengen.
- source_word: ἀπατώμενοι / ἀπατηθῇ
  choice: sich täuschen lassen
  rationale: Bewahrt die passive Form und die mögliche Bedeutung, von etwas oder jemandem irregeführt zu werden.
- source_word: βασανίζονται / βασανισθῇ
  choice: gequält werden
  rationale: Entspricht der starken Bedeutung von βάσανος als Qual beziehungsweise Pein und erhält die Härte des Ausgangstextes.
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: hat die Wirkung / zählt wie
  rationale: Macht die rechnerische Entsprechung im Deutschen klar, ohne eine buchstäbliche zeitliche Identität zu behaupten.
- source_word: τιμωρίας
  choice: Strafe
  rationale: Natürliche und kontextgerechte Wiedergabe der auferlegten Vergeltung oder Züchtigung.
theological_decisions:
- issue: Verhältnis zwischen der Dauer des Genusses und der Dauer der Qual
  choice: Die im Text ausdrücklich genannte Entsprechung von Tagen zu Jahren bleibt unverändert stehen.
  alternative: Die Aussage als bloß allgemeines Bild für eine längere Strafe abschwächen.
  rationale: Der griechische Text formuliert eine konkrete zeitliche Rechnung; eine Harmonisierung oder Abschwächung würde seine Spannung beseitigen.
- issue: Ursache oder Handelnder der Täuschung
  choice: Die passive und unbestimmte Form »sich täuschen lassen« wird beibehalten.
  alternative: Einen bestimmten Verführer, etwa den Teufel, ausdrücklich nennen.
  rationale: Der Ausgangstext nennt keinen Handelnden; eine solche Ergänzung würde eine theologische Deutung importieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Dialogführung. Die wiederholte Terminologie für Genuss, Täuschung, Strafe und Qual bleibt erkennbar; die ungewöhnliche Zeitrechnung wird verständlich, aber nicht geglättet.
