revisions:
- from: 'Wieder sagt er zu mir: „Liebe die Wahrheit, und aus deinem Mund soll nur Wahrheit hervorgehen, damit der Geist, den Gott in diesem Fleisch hat wohnen lassen, vor allen Menschen als wahrhaftig erfunden wird. So wird der Herr verherrlicht werden, der in dir wohnt; denn der Herr ist wahrhaftig in jedem Wort, und bei ihm ist keine Lüge.“'
  to: 'Wieder sagt er zu mir: „Liebe die Wahrheit, und alle Wahrheit soll aus deinem Mund hervorgehen, damit der Geist, den Gott in diesem Fleisch hat wohnen lassen, vor allen Menschen als wahrhaftig befunden wird. So wird der Herr verherrlicht werden, der in dir wohnt; denn der Herr ist wahrhaftig in jedem Wort, und bei ihm ist keine Lüge.“'
  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: Sie gibt πᾶσα mit „alle“ statt mit dem interpretierend-exklusiven „nur“ wieder und ersetzt das im modernen Deutsch missverständliche „erfunden“ durch „befunden“. Die Offenheit des griechischen Bezugs von „Geist“, „Fleisch“ und dem in dir wohnenden Herrn bleibt unverändert erhalten. Der englische POB-Audittext stützt die Wiedergabe von πᾶσα als „all truth“ und von εὑρεθῇ als „may be found true“.'
  reviewer_model: gpt-5.6-terra
