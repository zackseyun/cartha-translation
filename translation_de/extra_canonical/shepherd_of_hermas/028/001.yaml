base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: de
  text: 'Wieder sagt er zu mir: „Liebe die Wahrheit, und alle Wahrheit soll aus deinem Mund hervorgehen, damit der Geist, den Gott in diesem Fleisch hat wohnen lassen, vor allen Menschen als wahrhaftig befunden wird. So wird der Herr verherrlicht werden, der in dir wohnt; denn der Herr ist wahrhaftig in jedem Wort, und bei ihm ist keine Lüge.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα ἀλήθεια
  choice: nur Wahrheit
  rationale: Die griechische Wendung bedeutet wörtlich „alle Wahrheit“, bezeichnet hier im natürlichen deutschen Zusammenhang aber umfassend wahrhaftige Rede. „Nur Wahrheit“ gibt diesen ausschließlichen Sinn klar und idiomatisch wieder.
- source_word: ἐκπορευέσθω
  choice: soll … hervorgehen
  rationale: Bewahrt das Bild des Hervorgehens aus dem Mund und gibt den Imperativ der dritten Person würdig wieder.
- source_word: κατῴκισεν
  choice: hat wohnen lassen
  rationale: 'Gibt den kausativen Aorist wieder: Gott hat den Geist in diesem Fleisch Wohnung nehmen lassen.'
- source_word: ἐν τῇ σαρκὶ ταύτῃ
  choice: in diesem Fleisch
  rationale: Die konkrete und theologisch offene Rede von σάρξ wird beibehalten und nicht erklärend zu „Körper“ oder „Leib“ umgedeutet.
- source_word: ἀληθὲς εὑρεθῇ
  choice: als wahrhaftig erfunden wird
  rationale: Bewahrt sowohl den prüfenden bzw. feststellenden Sinn von εὑρίσκω als auch den Bezug des Adjektivs auf „Geist“.
- source_word: παρὰ πᾶσιν ἀνθρώποις
  choice: vor allen Menschen
  rationale: Entspricht dem Sinn „im Urteil bzw. in den Augen aller Menschen“ und hält die Formulierung knapp.
- source_word: δοξασθήσεται
  choice: wird … verherrlicht werden
  rationale: Gibt das Futur Passiv formal und in angemessenem religiösem Register wieder.
- source_word: οὐδὲν παρ’ αὐτῷ ψεῦδος
  choice: bei ihm ist keine Lüge
  rationale: Nahe Wiedergabe der elliptischen griechischen Aussage, ohne sie dogmatisch auszubauen.
theological_decisions:
- issue: Bezug des in diesem Fleisch wohnenden Geistes
  choice: „der Geist, den Gott in diesem Fleisch hat wohnen lassen“
  alternative: „der Geist Gottes, der in deinem Leib wohnt“
  rationale: Der Ausgangstext sagt weder ausdrücklich „Geist Gottes“ noch „dein Leib“. Die Übersetzung bewahrt daher die genuine Offenheit, ob der menschliche Geist, der von Gott gegebene Geist oder Gottes Geist gemeint ist.
- issue: Wer in der Person wohnt
  choice: „der Herr …, der in dir wohnt“
  alternative: den Herrn ausdrücklich mit dem zuvor genannten Geist gleichsetzen
  rationale: Der Text nennt zunächst den Geist und anschließend den Herrn, ohne ihr Verhältnis ausdrücklich zu bestimmen. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die griechische Satzführung. Die direkte Rede und die Wiederholungen von „Wahrheit/wahrhaftig“ bleiben als prägende Leitbegriffe sichtbar. Keine Fußnoten erforderlich, da keine textkritische Variante oder für das Verständnis zwingende Erläuterung vorliegt.
