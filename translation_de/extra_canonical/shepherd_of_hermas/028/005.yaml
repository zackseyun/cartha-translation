review_pass:
  verdict: revise
  source_fidelity: Eine behutsame Korrektur ist nötig. αὐτά ist pluralisch und bezieht sich auf die eben gehörten Weisungen; »hörst du es« verwischt diesen Bezug. Außerdem ist »bei deinen Geschäften« für ἐν ταῖς πραγματείαις σου etwas zu eng, da der Ausdruck allgemein die eigenen Angelegenheiten bzw. Betätigungen meinen kann.
  naturalness: Der Text ist überwiegend flüssig und registergerecht. »Nun hörst du sie; bewahre sie« ist idiomatisch, präzise und wahrt den pluralischen Rückbezug. »in deinen Angelegenheiten« ist hier natürlicher und weiter als eine ausschließlich geschäftliche Lesart.
  terminology: Die Wiedergabe von πιστά mit »glaubwürdig« bewahrt die absichtliche Paradoxie und die Wiederholung. »das Leben gewinnen« ist eine natürliche, nicht konfessionell festgelegte Wiedergabe von ζωὴν περιποιήσασθαι. »für Gott leben« gibt ζῇν mit Dativ sachgemäß wieder.
  issues:
  - severity: medium
    issue: Singularisches »es« für αὐτά
    rationale: Das griechische αὐτά ist Neutrum Plural und verweist auf die zuvor genannten Worte bzw. Weisungen. Die deutsche Singularform lässt diesen Bezug und die Aufforderung, mehrere Weisungen zu bewahren, undeutlich werden.
  - severity: low
    issue: »bei deinen Geschäften« verengt πραγματείαις
    rationale: πραγματεῖαι kann zwar geschäftliche Vorgänge einschließen, bezeichnet aber nicht zwingend Handel. »in deinen Angelegenheiten« hält die Referenz offen.
  - severity: low
    issue: »diese Worte« ergänzt den Bezug unnötig
    rationale: τούτων kann sich auf die eben gehörten Weisungen bzw. das Gesagte beziehen. Das neutrale »dies« bewahrt die im Text vorhandene Bezugsoffenheit besser.
