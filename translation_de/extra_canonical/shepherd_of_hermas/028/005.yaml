revisions:
- from: »Jetzt also«, sagt er, »hörst du es. Halte dich daran, damit auch die früheren Lügen, die du bei deinen Geschäften ausgesprochen hast, glaubwürdig werden können, wenn sich diese Worte als wahr erweisen; denn auch jene können glaubwürdig werden. Wenn du dich daran hältst und von jetzt an stets die Wahrheit sagst, wirst du dir das Leben erwerben können. Und jeder, der dieses Gebot hört und sich von der überaus bösen Lüge fernhält, wird für Gott leben.«
  to: »Nun also«, sagt er, »hörst du sie; bewahre sie, damit auch die früheren Lügen, die du in deinen Angelegenheiten ausgesprochen hast, glaubwürdig werden, wenn dies sich als wahr erweist; denn auch jene können glaubwürdig werden. Wenn du dies bewahrst und von jetzt an alle Wahrheit sagst, wirst du dir das Leben gewinnen können. Und jeder, der dieses Gebot hört und sich von der überaus bösen Lüge fernhält, wird für Gott leben.«
  rationale: Die Revision stellt den pluralischen Bezug von αὐτά wieder her, vermeidet eine zu enge wirtschaftliche Deutung von πραγματεῖαι und lässt den leicht offenen Bezug von τούτων bestehen. Die auffällige Aussage, frühere Lügen könnten glaubwürdig werden, bleibt ohne Harmonisierung erhalten. Keine Fußnoten sind erforderlich.
