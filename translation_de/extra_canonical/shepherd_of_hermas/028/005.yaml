base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: de
  text: »Nun also«, sagt er, »hörst du sie; bewahre sie, damit auch die früheren Lügen, die du in deinen Angelegenheiten ausgesprochen hast, glaubwürdig werden, wenn dies sich als wahr erweist; denn auch jene können glaubwürdig werden. Wenn du dies bewahrst und von jetzt an alle Wahrheit sagst, wirst du dir das Leben gewinnen können. Und jeder, der dieses Gebot hört und sich von der überaus bösen Lüge fernhält, wird für Gott leben.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε αὐτά
  choice: Halte dich daran
  rationale: Das Verb bezeichnet hier das Beachten und Befolgen des soeben Gehörten; die idiomatische deutsche Wendung bewahrt diesen praktischen Sinn.
- source_word: ἐν ταῖς πραγματείαις σου
  choice: bei deinen Geschäften
  rationale: πραγματεία kann Tätigkeiten, Angelegenheiten oder geschäftliche Betätigung bezeichnen. Der Kontext früherer betrügerischer Rede legt »Geschäfte« nahe, ohne den Ausdruck enger auf Handel zu begrenzen.
- source_word: πιστὰ γένηται
  choice: glaubwürdig werden können
  rationale: πιστός bedeutet hier im Zusammenhang von Wahrheit und geglaubter Rede wahrscheinlich »glaubwürdig« beziehungsweise »verlässlich«, nicht ausdrücklich »treu«.
- source_word: πᾶσαν ἀλήθειαν λαλήσῃς
  choice: stets die Wahrheit sagst
  rationale: Die natürliche deutsche Formulierung gibt den umfassenden Anspruch von πᾶσαν wieder, ohne das schwerfällige »jede Wahrheit sprechen«.
- source_word: ζήσεται τῷ Θεῷ
  choice: wird für Gott leben
  rationale: Der Dativ bleibt in seiner Ausrichtung auf Gott erhalten; »für Gott leben« ist natürlich und vermeidet eine unbegründete Präzisierung als bloßes Erlangen ewigen Lebens.
theological_decisions:
- issue: Wie frühere Lügen durch gegenwärtige Wahrhaftigkeit »glaubwürdig« werden können
  choice: Die paradoxe Aussage wird beibehalten und nicht erklärend harmonisiert.
  alternative: Die früheren Aussagen könnten rückwirkend als wahr erwiesen oder wiedergutgemacht werden.
  rationale: Der griechische Wortlaut spricht tatsächlich davon, dass auch jene πιστά werden können. Die gedankliche Spannung gehört zum Text und sollte nicht durch eine eindeutige Deutung beseitigt werden.
- issue: δυνήσῃ σεαυτῷ ζωὴν περιποιήσασθαι
  choice: wirst du dir das Leben erwerben können
  alternative: wirst du dein Leben bewahren können
  rationale: περιποιεῖσθαι kann erwerben, gewinnen oder bewahren bedeuten. »Das Leben erwerben« bildet die reflexive Konstruktion und die soteriologische Tragweite ab, ohne die Art des Lebens dogmatisch festzulegen.
- issue: πονηροτάτου ψεύσματος
  choice: der überaus bösen Lüge
  alternative: der schlimmsten Lüge
  rationale: Der Superlativ kann elativisch oder streng vergleichend verstanden werden. »Überaus böse« bewahrt die starke Wertung, ohne zwingend eine bestimmte einzelne Lüge als absolut schlimmste zu identifizieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die syntaktische Dichte des Griechischen wurde behutsam gegliedert; die auffällige Wiederholung von »glaubwürdig werden« bleibt erhalten, weil sie die argumentative Spannung des Originals trägt.
