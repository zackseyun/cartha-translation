review_pass:
  verdict: revise
  source_fidelity: Der Sinn und die zentrale Treuhandmetaphorik sind im Entwurf weitgehend getroffen. Der durchgängige Wechsel des griechischen Plurals in einen generischen Singular glättet jedoch die ausdrücklich plurale Aussage unnötig. Außerdem ist „entweiht“ für ἐμίαναν stärker kultisch spezifiziert als „verunreinigt/befleckt“.
  naturalness: Die Umschreibung „zu einem, der den Herrn beraubt“ ist verständlich, aber im Deutschen schwerfällig; „den Herrn betrügen“ ist idiomatischer und wird durch den folgenden Satz über das nicht zurückgegebene anvertraute Gut konkretisiert.
  terminology: „Anvertrautes Gut“ gibt παρακαταθήκη angemessen wieder. „Geist ohne Falschheit“ bewahrt die nicht weiter bestimmte Formulierung πνεῦμα ἄψευστον. Für ψευδὲς ἀποδώσωσιν ist „ihn verfälscht zurückgeben“ als verständliche Wiedergabe der paradoxen Bildsprache vertretbar.
  issues:
  - severity: low
    issue: Numeruswechsel vom Plural zum generischen Singular
    rationale: οἱ ψευδόμενοι, ἀθετοῦσι, γίνονται, ἔλαβον und ἀποδώσωσιν sind pluralisch. Die deutsche Pluralform ist ebenso natürlich und erhält die Form des Ausgangstextes.
  - severity: medium
    issue: „entweiht“ für ἐμίαναν
    rationale: μιαίνω bedeutet „verunreinigen, beflecken“. „Entweihen“ setzt typischerweise einen sakral geweihten Gegenstand voraus und engt die Aussage unnötig ein.
  - severity: low
    issue: Unidiomatische Umschreibung von ἀποστερηταὶ τοῦ Κυρίου
    rationale: „zu einem, der den Herrn beraubt“ wirkt im Deutschen konstruiert. „Den Herrn betrügen“ gibt das Vorenthalten beziehungsweise Schädigen im gegebenen Treuhandkontext natürlich wieder.
  revised_text: Diejenigen also, die lügen, verwerfen den Herrn und betrügen den Herrn, indem sie ihm das anvertraute Gut nicht zurückgeben, das sie empfangen haben. Denn sie haben von ihm einen Geist ohne Falschheit empfangen. Wenn sie ihn verfälscht zurückgeben, haben sie das Gebot des Herrn verunreinigt und den Herrn betrogen.
