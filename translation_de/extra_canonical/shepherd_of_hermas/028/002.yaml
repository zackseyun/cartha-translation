base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: de
  text: Diejenigen also, die lügen, verwerfen den Herrn und betrügen den Herrn, indem sie ihm das anvertraute Gut nicht zurückgeben, das sie empfangen haben. Denn sie haben von ihm einen Geist ohne Falschheit empfangen. Wenn sie ihn verfälscht zurückgeben, haben sie das Gebot des Herrn verunreinigt und den Herrn betrogen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: verwirft
  rationale: Das Verb bezeichnet hier das Zurückweisen beziehungsweise die Missachtung des Herrn. „Verwirft“ bewahrt die Schärfe der Aussage, ohne eine besondere dogmatische Deutung einzutragen.
- source_word: ἀποστερηταὶ τοῦ Κυρίου
  choice: einer, der den Herrn beraubt
  rationale: ἀποστερητής bezeichnet jemanden, der einem anderen etwas vorenthält oder ihn um etwas bringt. Die Umschreibung klingt im Deutschen natürlicher als ein seltenes Substantiv wie „Berauber“ und hält den Bezug zum nicht zurückgegebenen Gut fest.
- source_word: παρακαταθήκην
  choice: das anvertraute Gut
  rationale: Gemeint ist etwas zur treuen Verwahrung Übergebenes, das zurückgegeben werden soll. „Anvertrautes Gut“ bildet dieses Treuhand- und Rückgabemotiv klar ab.
- source_word: πνεῦμα ἄψευστον
  choice: einen Geist ohne Falschheit
  rationale: Die Formulierung wahrt den unmittelbaren Gegensatz zu Lüge und Falschheit. Sie lässt offen, ob vor allem Wahrhaftigkeit, Unverfälschtheit oder die Unfähigkeit zur Lüge betont wird.
- source_word: ψευδὲς ἀποδώσωσιν
  choice: diesen verfälscht zurückgibt
  rationale: Wörtlich wird der empfangene Geist „falsch“ zurückgegeben. „Verfälscht“ macht im Deutschen verständlich, dass das ursprünglich unverfälscht Empfangene durch Lüge verdorben zurückkehrt.
- source_word: ἐμίαναν
  choice: entweiht
  rationale: Das Verb bedeutet beflecken oder verunreinigen. Beim „Gebot des Herrn“ gibt „entweiht“ die religiös-moralische Schwere idiomatisch wieder.
theological_decisions:
- issue: Bezug und Bedeutung des empfangenen Geistes
  choice: „einen Geist ohne Falschheit“ ohne nähere Identifikation
  alternative: „den wahrhaftigen Geist“ oder ausdrückliche Gleichsetzung mit dem Heiligen Geist
  rationale: Der griechische Text spricht ohne Artikel von πνεῦμα ἄψευστον und erläutert die genaue Identität nicht. Die Übersetzung erhält diese Offenheit und vermeidet eine konfessionell geprägte Präzisierung.
- issue: Bild des vorenthaltenen Treuguts
  choice: Den Herrn „berauben“ und das anvertraute Gut nicht zurückgeben
  alternative: „dem Herrn untreu werden“ oder „den Herrn betrügen“
  rationale: Die gewählte Formulierung bewahrt die rechtlich-ökonomische Metaphorik von ἀποστερητής und παρακαταθήκη sowie deren inneren Zusammenhang.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Wechsel vom griechischen Plural zum generischen Singular verhindert schwerfällige Wiederholungen und hält die Aussage allgemein. Die markante Treuhandmetaphorik und die theologische Unbestimmtheit von πνεῦμα bleiben erhalten.
