revisions:
- from: Wer also lügt, verwirft den Herrn und wird zu einem, der den Herrn beraubt, weil er ihm das anvertraute Gut, das er empfangen hat, nicht zurückgibt. Denn von ihm hat er einen Geist ohne Falschheit empfangen. Gibt er diesen verfälscht zurück, so hat er das Gebot des Herrn entweiht und ist zu einem geworden, der den Herrn beraubt.
  to: Diejenigen also, die lügen, verwerfen den Herrn und betrügen den Herrn, indem sie ihm das anvertraute Gut nicht zurückgeben, das sie empfangen haben. Denn sie haben von ihm einen Geist ohne Falschheit empfangen. Wenn sie ihn verfälscht zurückgeben, haben sie das Gebot des Herrn verunreinigt und den Herrn betrogen.
  rationale: Die Revision erhält den Plural des griechischen Textes, formuliert die Metapher vom vorenthaltenen Treugut idiomatisch und ersetzt die kultisch enger gefasste Wiedergabe „entweiht“ durch „verunreinigt“. Die Identität des empfangenen Geistes bleibt bewusst unbestimmt.
  reviewer_model: gpt-5.6-terra
