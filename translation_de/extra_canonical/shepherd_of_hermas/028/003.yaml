base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/003.yaml
  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: de
  text: 'Als ich das hörte, weinte ich sehr. Als er mich weinen sah, sagte er: »Warum weinst du?« Ich sagte: »Weil ich, Herr, nicht weiß, ob ich gerettet werden kann.« »Warum?«, fragte er. Ich sagte: »Denn noch nie in meinem Leben habe ich, Herr, ein wahres Wort gesprochen. Vielmehr habe ich mich allen gegenüber stets betrügerisch verhalten und meine Lüge vor allen Menschen als wahr dargestellt. Nie hat mir jemand widersprochen, sondern man hat meinem Wort geglaubt. Wie kann ich also, Herr«, fragte ich, »leben, nachdem ich dies getan habe?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα λίαν
  choice: weinte ich sehr
  rationale: Gibt die schlichte, intensive Aussage des Griechischen natürlich wieder, ohne sie auszuschmücken.
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede und ihre mögliche religiöse Färbung; das bloße »mein Herr« wäre im heutigen Deutsch weniger natürlich.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Entspricht dem theologischen und eschatologischen Gewicht des Passivs, ohne den gemeinten Heilsbegriff näher festzulegen.
- source_word: πανοῦργος ἔζησα μετὰ πάντων
  choice: habe ich allen gegenüber stets voller Arglist gelebt
  rationale: πανοῦργος bezeichnet hier betrügerische Verschlagenheit; »voller Arglist« ist würdig und verständlich und wahrt den Bezug auf die gesamte Lebensführung.
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: meine Lüge … als Wahrheit hingestellt
  rationale: Gibt den Sinn wieder, dass Hermas seine Lüge anderen erfolgreich als wahr erscheinen ließ.
- source_word: ἐπιστεύθη τῷ λόγῳ μου
  choice: man hat meinem Wort geglaubt
  rationale: Bildet das unpersönliche Passiv idiomatisch ab und hält λόγος im Singular fest.
- source_word: δύναμαι ζῆσαι
  choice: kann ich … leben
  rationale: Bewahrt die bewusste Verbindung von Leben und Rettung, ohne sie ausdrücklich als ewiges Leben auszudeuten.
theological_decisions:
- issue: Verhältnis von Rettung und Leben
  choice: σωθῆναι mit »gerettet werden« und ζῆσαι mit »leben« wiedergeben
  alternative: Beide Wendungen ausdrücklich auf das ewige Heil beziehen
  rationale: Der Zusammenhang legt eine heilsgeschichtliche Bedeutung nahe, doch der griechische Text lässt »leben« unbestimmt. Die Übersetzung bewahrt diese Spannung.
- issue: Identität des angeredeten κύριος
  choice: Die Anrede als »Herr« übersetzen, ohne den Sprecher mit Gott oder Christus gleichzusetzen
  alternative: »mein Herr«, »mein Gebieter« oder eine explizite Benennung
  rationale: Im unmittelbaren Dialog ist κύριε eine respektvolle Anrede an den Unterweiser; der Text dieses Abschnitts bestimmt seine Identität nicht näher.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Wechsel zwischen Erzählung und direkter Rede bleibt eng am griechischen Dialogrhythmus; die wiederholten Redeeinleitungen werden erhalten, soweit sie im Deutschen natürlich wirken.
