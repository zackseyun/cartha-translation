base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a servant of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: de
  text: 'Er sagt: »Du denkst richtig und wahrhaftig. Denn als Diener Gottes hättest du in der Wahrheit leben und nicht dulden sollen, dass ein böses Gewissen mit dem Geist der Wahrheit zusammenwohnt; auch hättest du dem ehrwürdigen und wahrhaftigen Geist keinen Kummer bereiten sollen.« Ich sage: »Herr, noch nie habe ich solche Worte so genau gehört.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς καὶ ἀληθῶς φρονεῖς
  choice: du denkst gut und wahrhaftig
  rationale: Gibt sowohl die positive Bewertung καλῶς als auch das auf Wahrhaftigkeit bezogene ἀληθῶς wieder, ohne die Aussage stärker als nötig auszulegen.
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: in der Wahrheit leben
  rationale: Das semitisch geprägte Bild des Wandelns bezeichnet die Lebensführung; die natürliche deutsche Wendung bewahrt den ethischen Sinn.
- source_word: πονηρὰν συνείδησιν
  choice: ein böses Gewissen
  rationale: Formale und im Deutschen verständliche Entsprechung für die moralisch negative συνείδησις.
- source_word: μετὰ τοῦ πνεύματος τῆς ἀληθείας μὴ κατοικεῖν
  choice: nicht zulassen, dass ein böses Gewissen zusammen mit dem Geist der Wahrheit in dir wohnt
  rationale: Macht die elliptische Konstruktion idiomatisch verständlich und bewahrt das Bild des gemeinsamen Wohnens, ohne die Referenz des Geistes näher festzulegen.
- source_word: τῷ πνεύματι τῷ σεμνῷ καὶ ἀληθεῖ
  choice: dem ehrwürdigen und wahrhaftigen Geist
  rationale: σεμνός bedeutet hier ehrwürdig, erhaben oder hehr; »ehrwürdig« wahrt den würdevollen Ton, ohne ausdrücklich »heilig« zu setzen.
- source_word: ἀκριβῶς
  choice: so deutlich
  rationale: Im Kontext des Hörens bezeichnet das Adverb ein genaues beziehungsweise klares Erfassen; »so deutlich« ist natürliches modernes Deutsch.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an die offenbarende Gestalt wird beibehalten; die Kleinschreibung des englischen »sir« wird nicht als bindende Auslegung übernommen.
theological_decisions:
- issue: Identität des »Geistes der Wahrheit« und des »ehrwürdigen und wahrhaftigen Geistes«
  choice: Geist großgeschrieben, aber ohne explizite Identifikation mit dem Heiligen Geist
  alternative: »heiliger und wahrer Geist« oder Kleinschreibung »Geist« im anthropologischen Sinn
  rationale: Der griechische Text verwendet πνεῦμα mit qualifizierenden Genitiven und Adjektiven, lässt aber die genaue pneumatologische oder anthropologische Zuordnung offen. Die Übersetzung bewahrt diese Spannung und vermeidet die nicht im Wortlaut stehende Wiedergabe von σεμνός als »heilig«.
- issue: Modalität von ἔδει
  choice: »hättest du ... sollen«
  alternative: »du musstest« oder »es war nötig, dass du ... wandeltest«
  rationale: Der Kontext blickt auf das bisherige Fehlverhalten zurück; die kontrafaktisch beziehungsweise vorwurfsvoll klingende deutsche Form gibt die unerfüllte Verpflichtung angemessen wieder.
- issue: Ort des gemeinsamen Wohnens
  choice: »in dir« zur Verdeutlichung ergänzt
  alternative: 'ohne Ortsangabe: »ein böses Gewissen nicht mit dem Geist der Wahrheit wohnen lassen«'
  rationale: κατοικεῖν setzt im Zusammenhang mit dem zuvor im Menschen wohnenden Geist einen inneren Wohnort voraus. Die Ergänzung macht die deutsche Syntax klar, ohne eine neue theologische Behauptung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Der Ton bleibt mahnend und seelsorgerlich. Das seltene, aber präzise »wahrhaftig« unterscheidet die persönliche Wahrhaftigkeit von der abstrakten »Wahrheit«.
