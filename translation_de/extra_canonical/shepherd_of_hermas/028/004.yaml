revisions:
- from: 'Er sagt: »Du denkst gut und wahrhaftig. Denn als Diener Gottes hättest du in der Wahrheit leben und nicht zulassen sollen, dass ein böses Gewissen zusammen mit dem Geist der Wahrheit in dir wohnt, und du hättest dem ehrwürdigen und wahrhaftigen Geist keinen Kummer bereiten sollen.« Ich sage: »Herr, noch nie habe ich solche Worte so deutlich gehört.«'
  to: 'Er sagt: »Du denkst richtig und wahrhaftig. Denn als Diener Gottes hättest du in der Wahrheit leben und nicht dulden sollen, dass ein böses Gewissen mit dem Geist der Wahrheit zusammenwohnt; auch hättest du dem ehrwürdigen und wahrhaftigen Geist keinen Kummer bereiten sollen.« Ich sage: »Herr, noch nie habe ich solche Worte so genau gehört.«'
  rationale: Die Revision entfernt die nicht ausdrücklich belegte Ortsangabe „in dir“ und gibt die Metapher des gemeinsamen Wohnens unmittelbar wieder. „Richtig“ und „so genau“ sind in diesem Kontext nähere moderne Entsprechungen für καλῶς beziehungsweise ἀκριβῶς. Die begriffliche und theologische Offenheit der griechischen Geist-Sprache bleibt gewahrt.
