  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/004.yaml
  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the servants of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: de
  text: '„Solange er nichts davon weiß“, sagt er, „sündigt er nicht. Wenn der Mann aber von ihrer Sünde erfährt und die Frau nicht umkehrt, sondern an ihrer Unzucht festhält, und der Mann weiter mit ihr zusammenlebt, macht er sich ihrer Sünde schuldig und hat Anteil an ihrem Ehebruch.“


    „Was soll der Mann also tun, Herr“, frage ich, „wenn die Frau an dieser Leidenschaft festhält?“


    „Er soll sich von ihr trennen“, sagt er, „und allein bleiben. Wenn er aber, nachdem er sich von seiner Frau getrennt hat, eine andere heiratet, begeht auch er Ehebruch.“


    „Wenn nun die Frau, Herr“, frage ich, „nach der Trennung umkehrt und zu ihrem eigenen Mann zurückkehren will, soll sie dann nicht wieder aufgenommen werden?“


    „Doch“, sagt er. „Wenn der Mann sie nicht wieder aufnimmt, sündigt er und lädt große Sünde auf sich. Wer gesündigt hat und umkehrt, muss vielmehr wieder aufgenommen werden – allerdings nicht immer wieder; denn für die Diener Gottes gibt es nur eine Umkehr. Um der Umkehr willen darf der Mann also nicht wieder heiraten. Diese Regel gilt für die Frau ebenso wie für den Mann.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι τῆς ἀγνοίας
  choice: Solange er nichts davon weiß
  rationale: Gibt den zeitlichen Sinn der griechischen Wendung natürlich wieder und vermeidet das im Deutschen missverständliche abstrakte „bis zur Unwissenheit“.
- source_word: πορνεία
  choice: Unzucht
  rationale: Bewahrt den gegenüber μοιχεία weiteren Ausdruck für sexuelles Fehlverhalten, während μοιχεία eigens mit „Ehebruch“ wiedergegeben wird.
- source_word: συνζῇ
  choice: weiter mit ihr zusammenlebt
  rationale: Drückt das fortgesetzte eheliche Zusammenleben aus, das nach erlangter Kenntnis der Sünde im Mittelpunkt der Aussage steht.
- source_word: ἀπολυσάτω
  choice: sich von ihr trennen
  rationale: Gibt die Auflösung beziehungsweise Beendigung des Zusammenlebens wieder, ohne moderne rechtliche Einzelheiten in den antiken Ausdruck hineinzulesen.
- source_word: πάθος
  choice: Leidenschaft
  rationale: Entspricht dem griechischen Begriff und lässt offen, ob vor allem ein beherrschendes Verlangen oder das fortgesetzte Verhalten gemeint ist.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet die Abkehr von der Sünde und Neuausrichtung klarer und umfassender als bloße Reue.
- source_word: μία
  choice: nur eine
  rationale: Bewahrt die zugespitzte und theologisch spannungsreiche Aussage des Textes, ohne sie abzuschwächen oder systematisch auszudeuten.
- source_word: ἡ πρᾶξις
  choice: Diese Regel
  rationale: Im Zusammenhang bezeichnet πρᾶξις die soeben dargelegte Handlungsordnung; „Regel“ ist im Deutschen verständlich und nicht unnötig technisch.
theological_decisions:
- issue: Fortgesetztes Zusammenleben mit einer nicht umkehrenden ehebrecherischen Person
  choice: „macht er sich ihrer Sünde schuldig und hat Anteil an ihrem Ehebruch“
  alternative: „wird er selbst zum Ehebrecher“
  rationale: Die gewählte Formulierung hält die im Griechischen unterschiedenen Gedanken von Schuldgemeinschaft und Teilhabe fest, ohne die Aussage mit einer weitergehenden Identifikation zu verschärfen.
- issue: Wiederheirat nach der Trennung
  choice: Die Aussage, dass eine weitere Heirat Ehebruch ist, wird uneingeschränkt beibehalten.
  alternative: Eine konfessionell geprägte Ausnahme oder rechtliche Erläuterung ergänzen
  rationale: Der Abschnitt formuliert selbst keine Ausnahme; zusätzliche harmonisierende oder konfessionelle Lehren würden über die Quelle hinausgehen.
- issue: Aufnahme der umkehrenden Ehefrau
  choice: „muss … wieder aufgenommen werden“
  alternative: „kann … wieder aufgenommen werden“
  rationale: Das griechische δεῖ drückt eine Verpflichtung aus; diese wird trotz der daraus entstehenden Spannung mit der Trennungsanweisung bewahrt.
- issue: Einmaligkeit der Umkehr
  choice: „für die Diener Gottes gibt es nur eine Umkehr“
  alternative: Die Aussage als unbegrenzt wiederholbare Vergebung paraphrasieren
  rationale: Die auffällige frühchristliche Formulierung wird quellentreu stehen gelassen und nicht durch eine spätere dogmatische Systematisierung aufgelöst.
- issue: Gleiche Anwendung auf beide Geschlechter
  choice: „Diese Regel gilt für die Frau ebenso wie für den Mann“
  alternative: Die Anweisung ausschließlich auf den Ehemann beziehen
  rationale: Der griechische Text erklärt ausdrücklich, dass die Handlungsordnung auf Frau und Mann bezogen ist.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Ton. Die wiederholte Dialogform bleibt erhalten. „Herr“ gibt die respektvolle Anrede κύριε wieder. Die Begriffe „Unzucht“, „Ehebruch“ und „Umkehr“ werden bewusst unterschieden; moderne familienrechtliche Terminologie wird vermieden.
