  source_fidelity: 'Die Übersetzung gibt den griechischen Gedankengang des vorliegenden Abschnitts zuverlässig wieder: Unwissenheit, fortgesetztes Zusammenleben nach Kenntnis und fehlender Umkehr, Schuld- und Teilhabesprache, Trennung, Verbot einer weiteren Heirat sowie die Verpflichtung zur Wiederaufnahme der umkehrenden Person. Die Unterscheidung von πορνεία („Unzucht“) und μοιχεία („Ehebruch“) bleibt erhalten. Die im überlieferten Quellenausschnitt nach 29:5 OCR-bedingt fehlende Passage wird durch den englischen Audit-Text inhaltlich bestätigt; der deutsche Entwurf folgt ihr ohne zusätzliche Ausdeutung.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen ernstem dialogischem Register. „Sich von ihr trennen“ ist eine idiomatische, nicht unnötig modernrechtliche Wiedergabe von ἀπολυσάτω. Die Formulierung „an dieser Leidenschaft festhält“ ist leicht formell, bildet πάθος aber sachgerecht ab und bewahrt dessen offenere Bedeutung.
  terminology: „Umkehr“ für μετάνοια, „Unzucht“ für πορνεία und „Ehebruch“ für μοιχεία sind konsequent und quellentreu gewählt. „Herr“ als Anrede für κύριε ist passend. Die Formulierung zur einmaligen Umkehr wird weder abgeschwächt noch konfessionell harmonisiert.
