review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt ἀφορμή („Anlass“) sowie ἴασιν δοῦναι („Heilung schenken“) und ἐξουσία („Vollmacht“) im Wesentlichen treffend wieder. Die deutsche Verbindung „sondern dazu“ lässt jedoch fälschlich den Eindruck entstehen, der Sprecher gebe einen Anlass zum Nicht-mehr-Sündigen. Im Griechischen steht nach der Verneinung ein elliptischer Zweckausdruck (ἀλλὰ εἰς τὸ …); dieser sollte im Deutschen als Zielsetzung, nicht als zweites Objekt von „Anlass geben“, formuliert werden. Die unbestimmte Umschreibung dessen, der Heilung geben kann, wahrt die im griechischen Wortlaut nicht explizit ausgesprochene Identifikation.
  naturalness: Die Revision vermeidet die unidiomatische und logisch missverständliche Konstruktion „keinen Anlass …, sondern dazu“. „Dieses Vorgehen“ nimmt ἡ πρᾶξις angemessen auf, ohne den im Kontext gemeinten Vorgang näher dogmatisch oder rechtlich festzulegen.
  terminology: „Anlass“, „Heilung“ und „Vollmacht“ sind angemessen. „Der, der Heilung schenken kann“ bewahrt die indirekte griechische Bezeichnung und vermeidet sowohl die unnötige Großschreibung als göttlichen Eigennamen als auch eine ausdrückliche Ergänzung „Gott“.
