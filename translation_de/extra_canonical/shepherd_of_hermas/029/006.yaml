  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: de
  text: „Ich gebe also“, sagt er, „keinen Anlass dazu, dass dieses Vorgehen auf diese Weise ausgeführt wird. Vielmehr geht es darum, dass der, der gesündigt hat, nicht länger sündigt. Was aber seine frühere Sünde betrifft, so gibt es einen, der Heilung schenken kann; denn er ist es, der über alles Vollmacht hat.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμή
  choice: Anlass
  rationale: Gibt den Gedanken einer Gelegenheit oder eines Ansatzpunkts wieder, ohne bereits Billigung oder Ursache zu unterstellen.
- source_word: ἡ πρᾶξις ... συντελῆται
  choice: dass so verfahren wird
  rationale: Natürliches Deutsch für das schwerfällige griechische »dass diese Handlung so vollzogen wird«; der Bezug auf das zuvor erörterte Vorgehen bleibt bewusst allgemein.
- source_word: ἴασιν δοῦναι
  choice: Heilung schenken
  rationale: Bewahrt das Bild der Heilung für die Folgen beziehungsweise Schuld der früheren Sünde und vermeidet eine Verengung auf bloße Vergebung.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Bezeichnet hier souveräne Befugnis und Autorität, nicht lediglich Kraft oder Fähigkeit.
theological_decisions:
- issue: Identität dessen, der Heilung schenken kann
  choice: „einen, der Heilung schenken kann“; anschließend „er ist es“
  alternative: „den Einen“ beziehungsweise ausdrücklich „Gott“
  rationale: Der Zusammenhang weist auf Gott, doch der griechische Text nennt ihn hier nicht ausdrücklich. Die Übersetzung bewahrt diese indirekte Formulierung, ohne die theologische Aussage abzuschwächen.
- issue: Zweck der gegebenen Anweisung
  choice: Sie soll bewirken, dass der Sünder nicht weiter sündigt.
  alternative: Sie erlaubt oder fördert grundsätzlich die zuvor besprochene Trennungspraxis.
  rationale: Die Konstruktion ἀλλὰ εἰς τὸ μηκέτι ἁμαρτάνειν stellt die Beendigung des Sündigens als Ziel heraus und grenzt dieses Ziel von einer pauschalen Legitimation des Vorgehens ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die argumentierende Satzstruktur des griechischen Textes bleiben erhalten; die unbestimmte Bezeichnung des göttlichen Heilenden wird nicht durch eine ausdrückliche Identifikation ersetzt.
