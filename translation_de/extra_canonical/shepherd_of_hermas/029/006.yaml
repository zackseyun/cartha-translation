    issue: Der Kontrast „keinen Anlass …, sondern dazu“ bindet den zweiten Satzteil syntaktisch an „Anlass geben“.
    rationale: ἀλλὰ εἰς τὸ μηκέτι ἁμαρτάνειν τὸν ἡμαρτηκότα bezeichnet die Zielsetzung der Aussage, nicht einen Anlass, der gegeben würde. Die bestehende Formulierung ist im Deutschen missverständlich und stilistisch holprig.
