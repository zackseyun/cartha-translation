  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: de
  text: „Nicht nur“, sagt er, „ist es Ehebruch, wenn jemand sein Fleisch befleckt; auch wer Bildnisse herstellt wie die Völker, begeht Ehebruch.[a] Wenn also jemand an solchen Taten festhält und nicht umkehrt, halte dich von dieser Person fern und lebe nicht mit ihr zusammen; sonst hast auch du Anteil an ihrer Sünde. Deshalb wurde euch geboten, allein zu bleiben, ob Mann oder Frau; denn in solchen Fällen ist Umkehr möglich.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wer Bildnisse macht wie die Völker“. Im Zusammenhang kann dies auf kultische Bilder beziehungsweise Götzenbilder anspielen; der griechische Ausdruck selbst ist weiter gefasst.'
    reason: Die Anmerkung dokumentiert die offenere Bedeutung von τὰ ὁμοιώματα und erläutert den wahrscheinlichen Kontext, ohne ihn im Haupttext festzulegen.
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: Ehebruch / begeht Ehebruch
  rationale: Bewahrt die bewusst doppelte, sowohl leibliche als auch bildlich-religiöse Verwendung des griechischen Begriffs.
- source_word: μιάνῃ
  choice: befleckt
  rationale: Gibt die kultisch und sittlich gefärbte Bedeutung wieder, ohne sie enger als der Ausgangstext festzulegen.
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  choice: Götzenbilder nach Art der Völker anfertigt
  rationale: ὁμοιώματα bezeichnet hier angesichts des Vergleichs mit den Völkern offenbar kultische Bildnisse; „Götzenbilder“ macht den Zusammenhang im Deutschen verständlich, während die Fußnote die wörtlichere Lesart dokumentiert.
- source_word: ἐμμένῃ
  choice: festhält
  rationale: Vermittelt das fortgesetzte Verharren in den genannten Handlungen natürlich und präzise.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet eine Sinnes- und Lebensänderung und vermeidet eine Verengung auf bloßes Bedauern.
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: für euch zu bleiben
  rationale: Bewahrt die etwas offene Formulierung des Griechischen; im Kontext ist gemeint, ohne einen neuen Partner zu bleiben, damit eine spätere Versöhnung möglich bleibt.
theological_decisions:
- issue: Bildliche Ausweitung des Ehebruchs auf kultische Bildverehrung
  choice: Die Metapher „Ehebruch“ bleibt ausdrücklich erhalten.
  alternative: Den Ausdruck erklärend als „Untreue gegen Gott“ wiederzugeben.
  rationale: Der Text setzt körperliche Verunreinigung und religiöse Untreue bewusst unter denselben Begriff; eine erklärende Auflösung würde diese rhetorische und theologische Spannung abschwächen.
- issue: Trennung und mögliche Wiederaufnahme der Lebensgemeinschaft
  choice: „für euch zu bleiben“ und „Umkehr möglich“ werden ohne ergänzende dogmatische Festlegung wiedergegeben.
  alternative: Ausdrücklich „unverheiratet bleiben“ oder eine Pflicht zur Wiederheirat beziehungsweise Versöhnung formulieren.
  rationale: Der weitere Kontext erläutert den Zweck, doch dieser Leserabschnitt selbst formuliert knapp. Die Übersetzung bewahrt diese Begrenzung und importiert keine spätere konfessionelle Ehelehre.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und die knappe paränetische Schärfe des Griechischen bleiben erhalten. „Völker“ gibt ἔθνη traditionsnah wieder, ohne das heute missverständliche „Heiden“ zu verwenden.
