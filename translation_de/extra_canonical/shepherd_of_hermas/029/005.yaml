revisions:
- from: „Nicht nur“, sagt er, „ist es Ehebruch, wenn jemand sein Fleisch befleckt; auch wer Götzenbilder nach Art der Völker anfertigt, begeht Ehebruch.[a] Wenn also jemand an solchen Taten festhält und nicht umkehrt, halte dich von ihm fern und lebe nicht mit ihm zusammen; sonst hast auch du Anteil an seiner Sünde. Deshalb ist euch geboten worden, für euch zu bleiben, ob Mann oder Frau; denn in solchen Fällen ist Umkehr möglich.“
  to: „Nicht nur“, sagt er, „ist es Ehebruch, wenn jemand sein Fleisch befleckt; auch wer Bildnisse herstellt wie die Völker, begeht Ehebruch.[a] Wenn also jemand an solchen Taten festhält und nicht umkehrt, halte dich von dieser Person fern und lebe nicht mit ihr zusammen; sonst hast auch du Anteil an ihrer Sünde. Deshalb wurde euch geboten, allein zu bleiben, ob Mann oder Frau; denn in solchen Fällen ist Umkehr möglich.“
  rationale: Die Revision bewahrt die doppelte Verwendung von „Ehebruch“ und die Aufforderung zur Absonderung bei andauernder Unumkehrbarkeit. Sie ersetzt die im Deutschen unnatürliche Wendung „für euch zu bleiben“ und vermeidet eine unnötige Verengung von τὰ ὁμοιώματα auf Götzenbilder. Die geschlechtsübergreifende Formulierung „dieser Person/mit ihr“ ist im Deutschen natürlich und gibt den generischen Gebrauch des griechischen Maskulinums wieder.
