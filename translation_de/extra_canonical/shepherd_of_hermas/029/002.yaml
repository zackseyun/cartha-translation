  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a servant of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: de
  text: „Denn wenn dieser Gedanke in deinem Herzen aufsteigt, wirst du sündigen; und wenn andere ebenso böse Dinge [in dein Herz aufsteigen], begehst du Sünde. Denn dieser Gedanke ist für einen Diener Gottes eine große Sünde. Wenn aber jemand diese böse Tat vollbringt, bringt er den Tod über sich selbst. Gib also auf dich acht und halte dich von diesem Gedanken fern. Denn wo Sittsamkeit wohnt, soll Gesetzlosigkeit nicht im Herzen eines gerechten Menschen aufsteigen.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: in dein Herz aufsteigen
    text: Im Griechischen fehlt hier das Verb; die Ergänzung nimmt die Formulierung des vorhergehenden Satzteils auf. „Andere ebenso böse Dinge“ bleibt bewusst allgemein.
    reason: Kennzeichnet die syntaktische Ellipse und bewahrt die im griechischen Neutrum plural enthaltene Offenheit.
lexical_decisions:
- source_word: ἐνθύμησις
  choice: Gedanke
  rationale: Bezeichnet hier einen inneren, begehrlichen Gedanken beziehungsweise eine entsprechende Erwägung; „Gedanke“ bleibt natürlich und bewahrt den Bezug auf das innere Geschehen.
- source_word: διαμαρτήσεις
  choice: wirst du dich verfehlen
  rationale: Gibt das Überschreiten einer sittlichen Grenze wieder, ohne die folgende ausdrückliche Aussage „begehst du Sünde“ unnötig zu verdoppeln.
- source_word: ἁμαρτία μεγάλη
  choice: schwere Sünde
  rationale: Natürliches modernes Deutsch für die wertende Aussage „große Sünde“.
- source_word: θάνατον ἑαυτῷ κατεργάζεται
  choice: bringt er den Tod über sich selbst
  rationale: Bewahrt die starke kausative und reflexive Formulierung des Griechischen, ohne die Art des Todes näher festzulegen.
- source_word: σεμνότης
  choice: Ehrbarkeit
  rationale: Erfasst sittliche Würde und Reinheit in diesem Zusammenhang; „Sittsamkeit“ wäre enger und im heutigen Deutsch stärker geschlechtsspezifisch gefärbt.
- source_word: ἀνομία
  choice: Gesetzlosigkeit
  rationale: Formale und theologisch offene Wiedergabe; bezeichnet das dem göttlichen Gesetz widersprechende Böse.
theological_decisions:
- issue: Sündhaftigkeit des inneren Gedankens
  choice: Der Text bezeichnet bereits den begehrlichen Gedanken als schwere Sünde.
  alternative: Nur die ausgeführte Tat als eigentliche Sünde verstehen.
  rationale: Der griechische Text unterscheidet ausdrücklich zwischen ἐνθύμησις und dem vollbrachten ἔργον, bewertet jedoch schon den Gedanken als ἁμαρτία μεγάλη.
- issue: Bedeutung von „Tod“
  choice: „Tod“ bleibt ohne nähere Bestimmung stehen.
  alternative: „ewiger Tod“, „geistlicher Tod“ oder „Verdammnis“.
  rationale: Das Ausgangswort θάνατος enthält hier keine ausdrückliche Spezifizierung; die theologische Spannung soll erhalten bleiben.
- issue: Bezug von ἕτερα οὕτως πονηρά
  choice: Als weitere ebenso böse Gedanken verstanden und zur Klarheit wiederholt.
  alternative: Allgemein „andere ebenso böse Dinge“.
  rationale: Der unmittelbare syntaktische Zusammenhang setzt ἐνθύμησις als gedankliches Subjekt fort; die Ergänzung macht dies im Deutschen verständlich, ohne einen neuen Gegenstand einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Mahnrede und die Wiederholungen des griechischen Textes bleiben erhalten; unnötig altertümliche Ausdrücke wurden vermieden.
