  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: de
  text: 'Ich sage zu ihm: „Herr, erlaube mir, dich ein paar Dinge zu fragen.“ „Sprich“, sagt er. „Herr“, sage ich, „wenn jemand eine Frau hat, die an den Herrn glaubt, und entdeckt, dass sie Ehebruch begangen hat, sündigt dann der Mann, wenn er mit ihr zusammenlebt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an die lehrende Gestalt wird wörtlich und würdevoll wiedergegeben; im Zusammenhang ist sie nicht zwingend als Gottesbezeichnung zu verstehen.
- source_word: γυναῖκα ... πιστὴν ἐν Κυρίῳ
  choice: eine Frau ... die im Herrn gläubig ist
  rationale: πιστή kann „treu“ oder „gläubig“ bedeuten. Der Zusatz ἐν Κυρίῳ legt hier die Zugehörigkeit zum christlichen Glauben nahe.
- source_word: εὕρῃ ἐν μοιχείᾳ τινί
  choice: sie bei einem Ehebruch ertappt
  rationale: Die idiomatische deutsche Formulierung gibt das Entdecken der Frau in einer ehebrecherischen Handlung natürlich wieder; τινί bleibt durch den unbestimmten Artikel unspezifisch.
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: wenn er weiter mit ihr zusammenlebt
  rationale: συνζάω bezeichnet das gemeinsame Leben. „weiter“ ist im Deutschen kontextuell erforderlich, da die Frage das Zusammenleben nach dem Bekanntwerden des Ehebruchs betrifft.
theological_decisions:
- issue: Bedeutung von πιστή für die Ehefrau
  choice: gläubig
  alternative: treu
  rationale: „Im Herrn“ weist stärker auf den Glaubensstatus als auf eheliche Treue; zugleich wird die Spannung, dass eine gläubige Frau Ehebruch begeht, nicht geglättet.
- issue: Art und Umfang des Ehebruchs
  choice: bei einem Ehebruch
  alternative: in Ehebruch lebend / beim Ehebruch
  rationale: Das Griechische μοιχείᾳ τινί ist unbestimmt und legt weder ausdrücklich einen einmaligen Akt noch einen fortdauernden Zustand fest. Die Übersetzung bewahrt diese Unbestimmtheit möglichst weitgehend.
translation_notes:
  register: Moderner, klarer und würdevoller Dialogstil. Die wiederholte Anrede und die Redeformeln des griechischen Textes bleiben erhalten; die Satzstellung ist für natürliches heutiges Deutsch behutsam angepasst.
