review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe folgt dem griechischen Satzbau und Sinn insgesamt gut. Allerdings schwächt „ähnliche böse Dinge“ das συγκεκριtere ὁμοιώματα („Bilder/Abbilder/ähnliche Erscheinungen“) zu stark ab. Die Formulierung sollte die bildhafte, bewusst offene Bezeichnung erhalten, ohne sie dogmatisch zu deuten.
  naturalness: Der Stil ist klar und modernes Standarddeutsch. „in deinem Herzen aufsteigen“ ist verständlich, klingt jedoch weniger idiomatisch als „in deinem Herzen aufkommen“. „irgendeine Unzucht“ ist möglich, aber „irgendeine Form von Unzucht“ fügt eine nicht erforderliche Konkretisierung hinzu; die vorliegende knappe Form bleibt vertretbar.
  terminology: „Keuschheit“, „Unzucht“ und „Sünde“ passen zum würdevollen ethischen Register und bilden ἁγνεία, πορνεία und ἁμαρτία angemessen ab. „Die Frau eines anderen“ wahrt die knappe relationale Formulierung von γυνὴ ἀλλοτρία, ohne eine weitergehende Auslegung einzutragen.
  issues:
  - severity: medium
    issue: ὁμοιωμάτων πονηρῶν wird als „ähnliche böse Dinge“ wiedergegeben.
    rationale: „Dinge“ lässt das bildhafte Element von ὁμοιώματα aus. „Bilder“ ist näher am Wortlaut und bleibt im Zusammenhang unerwünschter Vorstellungen verständlich; es legt nicht fest, ob konkrete Bilder, innere Vorstellungen oder vergleichbare Erscheinungsformen gemeint sind.
