base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: de
  text: „Ich gebiete dir“, sagt er, „die Keuschheit zu bewahren. Lass keinen Gedanken an die Frau eines anderen, an irgendeine Unzucht oder an irgendwelche ähnlichen bösen Bilder in deinem Herzen aufsteigen. Denn wenn du das tust, begehst du eine große Sünde. Wenn du aber stets an deine eigene Frau denkst, wirst du niemals sündigen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγνείαν
  choice: Keuschheit
  rationale: Bezeichnet hier sexuelle Reinheit und passt zum unmittelbaren Zusammenhang von Ehe, Begehren und Unzucht.
- source_word: γυναικὸς ἀλλοτρίας
  choice: die Frau eines anderen
  rationale: Gibt den relationalen Sinn von ἀλλοτρία natürlich wieder, ohne den Familienstand über den griechischen Wortlaut hinaus ausdrücklich als Ehefrau festzulegen.
- source_word: πορνείας
  choice: Unzucht
  rationale: Bewahrt den breiten Bezug auf unerlaubtes sexuelles Verhalten; „Ehebruch“ wäre im vorliegenden Satz zu eng.
- source_word: ὁμοιωμάτων πονηρῶν
  choice: ähnliche böse Dinge
  rationale: Die wörtliche Wiedergabe „böse Abbilder/Ähnlichkeiten“ wäre im Deutschen unklar. Die Formulierung erhält den offenen Sammelbegriff für vergleichbare verwerfliche Vorstellungen.
- source_word: ἐργάζῃ
  choice: begehst
  rationale: Im Zusammenhang mit ἁμαρτία ist „eine Sünde begehen“ die natürliche deutsche Verbindung.
- source_word: διαμαρτήσεις
  choice: wirst du … sündigen
  rationale: Das Verb bezeichnet hier ein Verfehlen beziehungsweise Sich-Versündigen; „übertreten“ wäre möglich, klingt im modernen Deutsch aber weniger natürlich.
theological_decisions:
- issue: Innere Gedanken als Sünde
  choice: „Lass keinen Gedanken … in deinem Herzen aufsteigen“ und „wenn du das tust, begehst du eine große Sünde“
  alternative: Den Satz nur auf bewusst gepflegtes Begehren oder eine vollzogene Tat beziehen
  rationale: Der griechische Text verbindet bereits das Aufsteigen der genannten Vorstellung im Herzen mit dem Tun der Sünde. Die Übersetzung wahrt diese Spannung, ohne eine spätere dogmatische Unterscheidung einzutragen.
- issue: Bedeutung von „an die eigene Frau denken“
  choice: wörtlich und offen als „stets an deine eigene Frau denkst“
  alternative: „deiner eigenen Frau treu bleibst“
  rationale: Die Alternative würde die Aussage interpretierend auf eheliche Treue verengen. Der Ausgangstext spricht ausdrücklich vom Erinnern beziehungsweise Denken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Rede. Der Satzbau folgt dem argumentativen Verlauf des Griechischen, wird aber für heutige Leser leicht geglättet. Keine Fußnoten sind für dieses Lesersegment erforderlich.
