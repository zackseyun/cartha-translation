base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: de
  text: „Herr“, sage ich, „ich bin unverständig und begreife diese Gleichnisse nicht. Denn wie kann sie zermürben und dann wieder retten? Ich verstehe es nicht.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετος
  choice: unverständig
  rationale: Gibt den Mangel an Einsicht wieder, ohne die Aussage unnötig zu verschärfen.
- source_word: παραβολὰς
  choice: Gleichnisse
  rationale: Entspricht dem üblichen frühchristlichen Sprachgebrauch für bildhafte oder rätselhafte Aussagen.
- source_word: ἐκτρίβειν
  choice: zermürben
  rationale: Bewahrt die kräftige Vorstellung des Aufreibens bzw. Zugrunderichtens und passt zum vorausgehenden καταφθείρει.
- source_word: σῴζειν
  choice: retten
  rationale: Gibt den gewöhnlichen theologischen und allgemeinsprachlichen Sinn des Verbs direkt wieder.
theological_decisions:
- issue: Spannung zwischen ἐκτρίβειν und σῴζειν
  choice: „zermürben und dann wieder retten“
  alternative: Die Aussage durch eine Konjektur oder erklärende Umformulierung harmonisieren
  rationale: Der überlieferte griechische Text stellt die widersprüchlich wirkenden Tätigkeiten ausdrücklich nebeneinander; die Übersetzung bewahrt diese Spannung, die der Sprecher selbst als unverständlich bezeichnet.
- issue: Unausgesprochenes Subjekt von δύναται
  choice: „sie“ als Rückbezug auf die Traurigkeit
  alternative: Ein unpersönliches „das“ oder ein ergänztes Substantiv
  rationale: Im Kontext ist ἡ λύπη das naheliegende grammatische und sachliche Bezugswort.
translation_notes:
  register: Moderne, würdige Standardsprache; die direkte Rede und die bewusste Wiederholung des Nichtverstehens bleiben erhalten.
