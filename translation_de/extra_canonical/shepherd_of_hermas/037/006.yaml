base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: de
  text: Die aber Gottesfurcht haben, über das Göttliche und die Wahrheit forschen und ihr Herz auf den Herrn richten, verstehen und begreifen rasch alles, was ihnen gesagt wird; denn sie tragen die Furcht des Herrn in sich. Wo nämlich der Herr wohnt, da ist auch viel Einsicht. Halte dich also fest an den Herrn, dann wirst du alles verstehen und begreifen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον θεοῦ / φόβον τοῦ κυρίου
  choice: Gottesfurcht / die Furcht des Herrn
  rationale: Bewahrt das religiöse Bedeutungsfeld von ehrfürchtiger Gottesverehrung, ohne den möglichen Aspekt der Furcht auszublenden.
- source_word: ἐρευνῶντες
  choice: forschen
  rationale: Gibt die aktive und eingehende Suche des griechischen Verbs wieder.
- source_word: περὶ θεότητος
  choice: nach dem Göttlichen
  rationale: Das abstrakte θεότης bezeichnet hier den Bereich des Göttlichen; die Formulierung bleibt bewusst weiter als eine systematische Lehre über Gott.
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: ihr Herz auf den Herrn richten
  rationale: Natürliches modernes Deutsch, das die Ausrichtung des Inneren auf den Herrn ausdrückt.
- source_word: νοοῦσι καὶ συνίουσιν
  choice: verstehen und begreifen
  rationale: Erhält die Doppelung zweier weitgehend überlappender Erkenntnisverben.
- source_word: σύνεσις πολλή
  choice: viel Einsicht
  rationale: Entspricht dem quantitativen πολλή und bezeichnet reichlich vorhandenes geistiges Verständnis.
- source_word: κολλήθητι
  choice: Halte dich fest an
  rationale: Vermittelt die nachdrückliche Bindung und enge Hinwendung des Verbs in idiomatischem Deutsch.
theological_decisions:
- issue: Bedeutung von φόβος im Verhältnis zu Gott
  choice: Gottesfurcht / Furcht des Herrn
  alternative: Ehrfurcht vor Gott / Ehrfurcht vor dem Herrn
  rationale: Die traditionelle, verständliche Formulierung wahrt sowohl Ehrfurcht als auch wirkliche Furcht und verengt die Aussage nicht einseitig.
- issue: Wesen von θεότης
  choice: das Göttliche
  alternative: die Gottheit oder die Lehre von Gott
  rationale: Der griechische Ausdruck bleibt abstrakt und kontextuell offen; eine dogmatisch-systematische Präzisierung wäre nicht durch den Text erzwungen.
- issue: Zusammenhang von Gottes Gegenwart und Einsicht
  choice: Wo nämlich der Herr wohnt, da ist auch viel Einsicht.
  alternative: Wo der Herr wohnt, herrscht großes Verständnis.
  rationale: Die Übersetzung lässt die Aussage des Textes stehen, ohne ihre anthropologische oder pneumatologische Funktionsweise weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Erkenntnisverben und die wiederholte Furcht-Terminologie wurden bewusst erhalten; die Syntax wurde für flüssige Lesbarkeit leicht geglättet.
