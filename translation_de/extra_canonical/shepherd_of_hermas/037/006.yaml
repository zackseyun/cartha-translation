    rationale: „Nach dem Göttlichen und der Wahrheit forschen“ verschiebt die Aussage leicht in Richtung eines Suchens nach diesen Gegenständen. Das griechische ἐρευνῶντες περὶ θεότητος καὶ ἀληθείας meint ein Forschen über bzw. hinsichtlich des Göttlichen und der Wahrheit.
