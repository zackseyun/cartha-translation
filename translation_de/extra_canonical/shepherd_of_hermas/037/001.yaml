base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/001.yaml
  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: de
  text: „Leg die Traurigkeit ab“, sagt er, „denn auch sie ist eine Schwester des inneren Zwiespalts und des Jähzorns.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Leg … ab
  rationale: Gibt die Aufforderung, etwas von sich zu entfernen, in natürlichem Deutsch wieder.
- source_word: λύπη
  choice: Traurigkeit
  rationale: Bewahrt die Grundbedeutung von Kummer beziehungsweise Traurigkeit und passt zur personifizierenden Rede von einer „Schwester“.
- source_word: διψυχία
  choice: innerer Zwiespalt
  rationale: Gibt wörtlich das Geteiltsein der Seele beziehungsweise des Inneren wieder, ohne es einseitig als bloßen Zweifel oder Unentschlossenheit festzulegen.
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet eine rasch aufflammende, reizbare Zornesneigung und ist im modernen Deutsch prägnant verständlich.
theological_decisions:
- issue: Bedeutungsumfang von διψυχία
  choice: innerer Zwiespalt
  alternative: Zweifel; Unentschlossenheit; Doppelherzigkeit
  rationale: Die Übersetzung wahrt die moralisch-geistliche Spannung des griechischen Ausdrucks, ohne ihn auf einen einzelnen psychologischen oder lehrmäßigen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die Personifikation der Traurigkeit als „Schwester“ bleibt erhalten.
