revisions:
- from: »Hör zu«, sagt er. »Menschen, die nie nach der Wahrheit geforscht oder nach dem Göttlichen gesucht, sondern lediglich geglaubt haben und sich dabei in Geschäfte, Reichtum, Beziehungen zu Nichtjuden[a] und viele andere Angelegenheiten dieser Weltzeit verstricken – alle, die sich solchen Dingen verschreiben, verstehen die Gleichnisse über das Göttliche nicht. Denn diese Tätigkeiten verdunkeln und verderben sie, sodass sie unfruchtbar werden. Wie gute Weinberge, wenn man sie vernachlässigt, durch Dornen und allerlei Unkraut veröden, so kommen auch die Menschen, die zum Glauben gelangt sind und sich in die vielen eben genannten Angelegenheiten verstricken, von ihrem verständigen Denken ab und begreifen überhaupt nichts mehr von der Gerechtigkeit. Selbst wenn sie vom Göttlichen und von der Wahrheit hören, sind ihre Gedanken mit ihren Geschäften beschäftigt, und sie begreifen überhaupt nichts.«
  to: »Hör zu«, sagt er. »Menschen, die nie nach der Wahrheit geforscht oder nach dem Göttlichen gesucht, sondern lediglich geglaubt haben und sich in Geschäfte, Reichtum, Freundschaften mit Heiden[a] und viele andere Angelegenheiten dieser Weltzeit verstricken – alle, die sich solchen Dingen verschreiben, verstehen die Gleichnisse über das Göttliche nicht. Denn diese Tätigkeiten verdunkeln und verderben sie, sodass sie unfruchtbar werden. Wie gute Weinberge, wenn man sie vernachlässigt, durch Dornen und allerlei Unkraut veröden, so werden auch die Menschen, die zum Glauben gelangt sind und sich in die vielen eben genannten Angelegenheiten verstricken, von ihrer Einsicht abgebracht und begreifen überhaupt nichts von der Gerechtigkeit. Selbst wenn sie vom Göttlichen und von der Wahrheit hören, sind ihre Gedanken mit ihren Geschäften beschäftigt, und sie begreifen überhaupt nichts.«
