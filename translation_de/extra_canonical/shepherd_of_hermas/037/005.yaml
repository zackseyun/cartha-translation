base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: de
  text: »Hör zu«, sagt er. »Menschen, die nie nach der Wahrheit geforscht oder nach dem Göttlichen gesucht, sondern lediglich geglaubt haben und sich in Geschäfte, Reichtum, Freundschaften mit Heiden[a] und viele andere Angelegenheiten dieser Weltzeit verstricken – alle, die sich solchen Dingen verschreiben, verstehen die Gleichnisse über das Göttliche nicht. Denn diese Tätigkeiten verdunkeln und verderben sie, sodass sie unfruchtbar werden. Wie gute Weinberge, wenn man sie vernachlässigt, durch Dornen und allerlei Unkraut veröden, so werden auch die Menschen, die zum Glauben gelangt sind und sich in die vielen eben genannten Angelegenheiten verstricken, von ihrer Einsicht abgebracht und begreifen überhaupt nichts von der Gerechtigkeit. Selbst wenn sie vom Göttlichen und von der Wahrheit hören, sind ihre Gedanken mit ihren Geschäften beschäftigt, und sie begreifen überhaupt nichts.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »heidnische Freundschaften« beziehungsweise »Freundschaften mit Heiden«. Gemeint sind im frühchristlichen Kontext wohl enge gesellschaftliche Bindungen außerhalb der Glaubensgemeinschaft.'
    reason: ἐθνικαῖς kann je nach Kontext ethnisch oder religiös akzentuiert sein. Die Übersetzung vermeidet die zu enge Festlegung auf „Nichtjuden“, ohne die historische Außenkategorie zu verdecken.
lexical_decisions:
- source_word: ἐθνικαῖς
  choice: zu Nichtjuden
  rationale: Gibt den antiken Gegensatz zu Gottes Volk wieder, ohne das missverständliche moderne Wort „heidnisch“ unmittelbar auf die Beziehungen selbst anzuwenden.
- source_word: τοῦ αἰῶνος τούτου
  choice: dieser Weltzeit
  rationale: Bewahrt die zeitlich-eschatologische Färbung von αἰών deutlicher als das bloße „dieser Welt“.
- source_word: περὶ τῆς θεότητος / περὶ θεότητος
  choice: nach dem Göttlichen / über das Göttliche
  rationale: θεότης bezeichnet hier im Kontext den göttlichen Bereich beziehungsweise göttliche Dinge; die substantivierte Form wahrt die Abstraktheit und vermeidet eine unnötige dogmatische Präzisierung.
- source_word: κεχερσωμένοι / χερσοῦνται
  choice: unfruchtbar werden / veröden
  rationale: Erhält das landwirtschaftliche Bild von brachliegendem, verwildertem Boden und variiert im Deutschen natürlich zwischen Menschenbild und Weinbergvergleich.
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: kommen von ihrem verständigen Denken ab
  rationale: Gibt sowohl das Abirren (ἀποπλανῶνται) als auch die geistige Einsicht beziehungsweise Denkfähigkeit (διάνοια) wieder, ohne den schwierigen Ausdruck zu glätten.
- source_word: πρᾶξιν / πραγματείαις
  choice: Geschäfte / Angelegenheiten / Tätigkeiten
  rationale: Die Wortgruppe umfasst Geschäftigkeit, Unternehmungen und weltliche Beschäftigungen; kontextabhängige deutsche Wiedergaben vermeiden eine künstliche Wiederholung.
theological_decisions:
- issue: Bedeutung von θεότης
  choice: das Göttliche
  alternative: Gottheit / Wesen Gottes
  rationale: Der Abschnitt spricht vom Erforschen und Hören göttlicher Dinge und ihrer Gleichnisse. „Das Göttliche“ bewahrt den weiten Sinn, ohne daraus eine technische Aussage über das Wesen Gottes zu machen.
- issue: Identität der ἐθνικοί
  choice: Nichtjuden
  alternative: Heiden
  rationale: Die ethnisch-religiöse Außenkategorie wird sachlich wiedergegeben; die Fußnote weist darauf hin, dass im frühchristlichen Kontext auch nichtchristliche Beziehungen gemeint sein können.
- issue: Verhältnis von Glauben und weltlicher Verstrickung
  choice: „lediglich geglaubt“ neben fortdauernder Verstrickung
  alternative: „nur zum Glauben gekommen“
  rationale: 'Die Spannung des Textes bleibt bestehen: Der Glaube wird nicht verneint, aber als nicht von ernsthafter Suche und ungeteilter Ausrichtung begleitet beschrieben.'
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Das Weinbergbild und die wiederholte Aussage „überhaupt nichts“ bleiben als rhetorische Verstärkung erhalten. Lange griechische Satzgefüge wurden behutsam gegliedert, ohne die Argumentationsfolge zu verändern.
