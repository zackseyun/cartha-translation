base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: de
  text: „Wie kann sie, Herr“, frage ich, „eine Schwester dieser beiden sein? Denn Jähzorn scheint mir etwas anderes zu sein, Zwiespältigkeit etwas anderes und Traurigkeit wieder etwas anderes.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede an den Gebieter; im Zusammenhang ist nicht zwingend eine direkte Gottesbezeichnung gemeint.
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet eine rasch aufflammende Zornesneigung und ist präziser als das allgemeinere „Zorn“.
- source_word: διψυχία
  choice: Zwiespältigkeit
  rationale: Gibt den Zustand eines innerlich geteilten, schwankenden Menschen wieder, ohne ihn vorschnell nur als „Zweifel“ zu deuten.
- source_word: λύπη
  choice: Traurigkeit
  rationale: Entspricht hier dem personifizierten belastenden Gemütszustand; „Trauer“ könnte zu eng an einen Verlust denken lassen.
- source_word: τούτων
  choice: diesen beiden
  rationale: Der Rückverweis gilt den unmittelbar zuvor genannten Größen Zwiespältigkeit und Jähzorn; die Ergänzung „beiden“ macht den deutschen Bezug eindeutig.
theological_decisions:
- issue: Bedeutungsumfang von διψυχία
  choice: Zwiespältigkeit
  alternative: Zweifel / Wankelmut
  rationale: Das griechische Wort bezeichnet wörtlich ein Geteiltsein der Seele und kann Zweifel oder Unbeständigkeit einschließen. „Zwiespältigkeit“ erhält diesen weiteren, anthropologisch-geistlichen Sinn.
- issue: Anrede κύριε
  choice: Herr
  alternative: mein Herr
  rationale: Der griechische Text hat kein Possessivpronomen. Die schlichte Anrede wahrt sowohl Respekt als auch die Offenheit der genauen Funktion des Angeredeten.
translation_notes:
  register: Moderne, würdige Dialogsprache. Die dreigliedrige Gegenüberstellung des Griechischen bleibt erhalten; „wieder“ sorgt im Deutschen für einen natürlichen Rhythmus, ohne einen zusätzlichen Sachinhalt einzuführen.
