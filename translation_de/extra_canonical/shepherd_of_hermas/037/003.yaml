  terminology: „unverständig“, „Traurigkeit“, „böser“, „Diener Gottes“ und „Heiliger Geist“ sind für Register und Aussage des griechischen Textes angemessen. „Zermürbt“ gibt ἐκτρίβει hier als zerstörerisches Aufreiben wieder, ohne die überlieferte Spannung mit dem anschließenden „rettet“ aufzulösen.
  issues:
