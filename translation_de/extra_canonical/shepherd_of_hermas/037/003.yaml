    rationale: Das griechische οὐ νοεῖς, ὅτι leitet den gesamten Inhalt ein; die Frage am Satzende bezieht sich auch auf „zerstört“, „reibt auf“ und „rettet wieder“. Die gegenwärtige Zweiteilung beeinträchtigt Syntax und Nachdruck.
  - severity: low
    issue: „reibt den Heiligen Geist auf“ ist stilistisch rau.
    rationale: Es ist zwar bildnah, doch „zermürbt den Heiligen Geist“ ist im modernen Standarddeutsch idiomatischer und bewahrt die zerstörerische Bedeutung von ἐκτρίβει.
