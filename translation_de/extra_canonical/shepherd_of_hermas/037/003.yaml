  source_fidelity: 'Die Übersetzung gibt die Schlüsselbegriffe und die bewusst paradoxe Verbindung von „aufreiben“ und „retten“ grundsätzlich zutreffend wieder. Die Satzteilung im Entwurf verschiebt jedoch die griechische rhetorische Frage: Sie umfasst den gesamten dass-Satz einschließlich beider Verben, nicht nur den Superlativ über die Diener Gottes.'
