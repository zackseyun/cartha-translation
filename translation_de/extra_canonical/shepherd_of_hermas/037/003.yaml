base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the servants of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: de
  text: „Du bist unverständig, Mensch“, sagt er, „und begreifst nicht, dass die Traurigkeit böser ist als alle Geister und für die Diener Gottes am schrecklichsten, dass sie den Menschen mehr als alle Geister zugrunde richtet, den Heiligen Geist zermürbt und dann wieder rettet?“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „und dann wieder rettet“ ist im griechischen Text ebenso überraschend. Der folgende Abschnitt greift genau diesen scheinbaren Widerspruch auf; daher wird er hier nicht geglättet.
    reason: Bewahrt die überlieferte gedankliche Spannung, ohne sie durch eine harmonisierende Deutung aufzulösen.
lexical_decisions:
- source_word: ἀσύνετος
  choice: unverständig
  rationale: Bezeichnet mangelndes Begreifen und passt zum folgenden οὐ νοεῖς; „töricht“ wäre stärker wertend.
- source_word: λύπη
  choice: Traurigkeit
  rationale: Gibt den seelischen Zustand allgemein und verständlich wieder; „Kummer“ wäre ebenfalls möglich, ist aber stärker an einen konkreten Anlass gebunden.
- source_word: πονηροτέρα
  choice: böser
  rationale: Bewahrt den moralisch-geistlichen Vergleich mit den übrigen „Geistern“, statt ihn nur als „schlimmer“ abzuschwächen.
- source_word: δεινοτάτη
  choice: am schrecklichsten
  rationale: Erhält den starken Superlativ; gemeint ist die besonders furchtbare Wirkung auf Gottes Diener.
- source_word: καταφθείρει
  choice: richtet … zugrunde
  rationale: Drückt die zerstörerische Wirkung idiomatisch aus, ohne zwingend körperliche Vernichtung zu behaupten.
- source_word: ἐκτρίβει
  choice: reibt … auf
  rationale: Bewahrt das Bild des Aufreibens beziehungsweise Zermürbens und entspricht der anschließenden Wiederaufnahme mit ἐκτρίβειν.
- source_word: σώζει
  choice: rettet
  rationale: Gibt das überlieferte Verb wörtlich wieder und lässt die im Zusammenhang ausdrücklich thematisierte Spannung bestehen.
theological_decisions:
- issue: Wirkung der Traurigkeit auf den Heiligen Geist
  choice: „reibt den Heiligen Geist auf“
  alternative: „vertreibt den Heiligen Geist“
  rationale: Das griechische ἐκτρίβει kann ein Aufreiben, Zermürben oder Austreiben bezeichnen. Die gewählte Fassung wahrt die konkrete Bildlichkeit und folgt der im englischen Konsultationstext erkannten Lesart, ohne eine systematische Aussage über Wesen oder Verlierbarkeit des Heiligen Geistes einzutragen.
- issue: Das widersprüchliche „und rettet dann wieder“
  choice: Unverändert als Frage und mit Fußnote wiedergegeben
  alternative: Durch Konjektur oder erklärende Ergänzung harmonisieren
  rationale: Der folgende Satz fragt ausdrücklich, wie die Traurigkeit sowohl aufreiben als auch retten könne. Die erkennbare Spannung gehört daher zum überlieferten Gedankengang und darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, eindringlicher Anrede. Die Satzglieder wurden für deutsche Lesbarkeit gegliedert, während die Wiederholung des Vergleichs mit den Geistern und die paradoxe Schlussfrage erhalten bleiben.
