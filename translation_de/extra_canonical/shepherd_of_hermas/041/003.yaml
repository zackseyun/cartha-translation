base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/003.yaml
  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the servants of God to death.”
translation:
  language: de
  text: 3 »Welche Taten des bösen Begehrens sind es, Herr«, frage ich, »die Menschen dem Tod ausliefern? Zeige sie mir, damit ich mich von ihnen fernhalte.« »Hör zu«, sagt er[a], »durch welche Taten das böse Begehren die Diener Gottes tötet.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „sagt er“ sind im zugrunde gelegten griechischen Text als textlich unsicher gekennzeichnet.
    reason: Die Edition setzt φησίν in eckige Klammern; die Fußnote macht diese Unsicherheit sichtbar, ohne den Lesefluss zu belasten.
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: das böse Begehren
  rationale: „Begehren“ gibt den anhaltenden inneren Drang natürlicher wieder als „Begierde“ und bewahrt zugleich die moralische Kennzeichnung durch „böse“.
- source_word: ἔργα
  choice: Taten
  rationale: Gemeint sind konkrete Betätigungen bzw. Auswirkungen des bösen Begehrens; „Taten“ ist im Deutschen klar und idiomatisch.
- source_word: παραδιδόντα … εἰς θάνατον
  choice: dem Tod ausliefern
  rationale: Die Wendung bildet das griechische Übergabe-Motiv ab, ohne es vorschnell als bloße Todesursache zu paraphrasieren.
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: mich von ihnen fernhalte
  rationale: Gibt die beabsichtigte fortdauernde Meidung dieser Taten verständlich und sachgerecht wieder.
- source_word: θανατοῖ
  choice: tötet
  rationale: Das starke kausative Verb wird direkt wiedergegeben und nicht zu „führt zum Tod“ abgeschwächt.
theological_decisions:
- issue: Verhältnis von bösem Begehren, Taten und Tod
  choice: 'Die wechselnde Aussageweise bleibt erhalten: Die Taten liefern Menschen dem Tod aus, und das böse Begehren tötet durch diese Taten.'
  alternative: Beide Aussagen vereinheitlichen, etwa als „führt durch seine Taten zum Tod“.
  rationale: Der griechische Text variiert bewusst zwischen den Taten als auslieferndem Mittel und dem bösen Begehren als handelnder Macht; diese Spannung soll nicht eingeebnet werden.
- issue: Bezeichnung κύριε
  choice: Herr
  alternative: mein Herr / Gebieter
  rationale: „Herr“ bewahrt die respektvolle Anrede, ohne zusätzliche Besitz- oder Herrschaftsnuancen einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Dialogführung. Die Wiederholung von „böses Begehren“, „Taten“ und „Tod/tötet“ folgt der begrifflichen Dichte des griechischen Textes.
