base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: de
  text: 'Er sagt zu mir: »Lege jedes böse Verlangen ab und kleide dich mit dem guten und ehrbaren Verlangen. Denn wenn du mit diesem Verlangen bekleidet bist, wirst du das böse Verlangen hassen und es zügeln, wie du willst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Das Wort bezeichnet hier ein starkes Begehren bzw. Verlangen und kann durch die Attribute gut oder böse bestimmt werden. Die einheitliche Wiedergabe bewahrt den bewussten Gegensatz im griechischen Text.
- source_word: ἆρον ἀπὸ σεαυτοῦ
  choice: Lege … ab
  rationale: Die Wendung fordert dazu auf, etwas von sich zu entfernen. »Ablegen« klingt im Deutschen natürlich und bereitet zugleich das anschließende Bild des Bekleidens vor.
- source_word: ἔνδυσαι / ἐνδεδυμένος
  choice: kleide dich / bekleidet bist
  rationale: Die konkrete Kleidungsmetapher wird in beiden Vorkommen sichtbar und konsistent bewahrt.
- source_word: σεμνήν
  choice: ehrbar
  rationale: σεμνός bezeichnet etwas Würdiges, Achtbares oder Ehrbares. »Ehrbar« ist verständlich und erhält den moralisch würdevollen Ton.
- source_word: χαλιναγωγήσεις
  choice: zügeln
  rationale: Die Metapher des Lenkens durch einen Zaum wird unmittelbar und idiomatisch wiedergegeben.
- source_word: καθὼς βούλει
  choice: wie du willst
  rationale: Die Formulierung wahrt die Aussage über die beabsichtigte bzw. gewollte Beherrschung, ohne sie zu verstärken oder abzuschwächen.
theological_decisions:
- issue: Personifizierung und Beherrschbarkeit des bösen Verlangens
  choice: Das böse Verlangen wird als etwas dargestellt, das gehasst und gezügelt werden kann.
  alternative: Die Aussage psychologisch auf einzelne sündige Wünsche oder Handlungen einengen.
  rationale: Der griechische Text verwendet durchgehend den Singular ἐπιθυμία und eine bildhafte Sprache. Die Übersetzung bewahrt diese Spannung, ohne eine bestimmte Lehre über Willensfreiheit oder Heiligung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Kleidungsmetapher und die wiederholte Bezeichnung »Verlangen« werden bewusst beibehalten; die direkte Rede bleibt klar und gut vorlesbar.
