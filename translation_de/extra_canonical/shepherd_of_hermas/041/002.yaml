base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a servant of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: de
  text: 2. Denn das böse Verlangen ist wild und lässt sich nur schwer zähmen. Es ist furchterregend und richtet die Menschen durch seine Wildheit äußerst zugrunde. Vor allem aber, wenn ein Diener Gottes ihm verfällt und nicht besonnen ist, wird er von ihm auf schreckliche Weise zugrunde gerichtet. Es richtet solche Menschen zugrunde, die das Gewand des guten Verlangens nicht tragen, sondern mit dieser Weltzeit vermischt sind. Diese liefert es daher dem Tod aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: das böse Verlangen
  rationale: „Verlangen“ gibt ἐπιθυμία neutral als starkes Begehren wieder; πονηρά bestimmt es hier ausdrücklich als böse. So wird der Begriff nicht vorschnell auf Begierde im engeren, etwa sexuellen Sinn beschränkt.
- source_word: δυσκόλως ἡμεροῦται
  choice: lässt sich nur schwer zähmen
  rationale: Bewahrt das Bild eines wilden Wesens, das nur mit Mühe zahm gemacht werden kann.
- source_word: δαπανᾷ / δαπανᾶται
  choice: richtet … zugrunde / wird … zugrunde gerichtet
  rationale: Das Verb bezeichnet hier ein verzehrendes Aufbrauchen. „Zugrunde richten“ ist im Deutschen natürlich und erhält die zerstörerische Steigerung bis zur Auslieferung an den Tod.
- source_word: μὴ ᾖ συνετός
  choice: nicht besonnen ist
  rationale: συνετός meint verständig, einsichtig oder umsichtig. „Besonnen“ passt zum notwendigen Verhalten gegenüber dem wilden Verlangen, ohne eine rein intellektuelle Bedeutung festzulegen.
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: das Gewand des guten Verlangens
  rationale: Erhält die im vorausgehenden Satz eingeführte Metaphorik des Anziehens und vermeidet eine erklärende Auflösung.
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  choice: sich mit dieser Weltzeit vermengt haben
  rationale: ἐμφύρω bezeichnet ein Vermischen oder Verwickeln; αἰών ist hier die gegenwärtige Weltzeit. Die Formulierung bewahrt sowohl das ungewöhnliche Mischbild als auch den zeitlich-weltlichen Sinn.
- source_word: παραδίδωσιν εἰς θάνατον
  choice: liefert … dem Tod aus
  rationale: Nahe Wiedergabe der Übergabeformel; die personifizierte böse Begierde bleibt handelndes Subjekt.
theological_decisions:
- issue: Verhältnis von bösem Verlangen und Tod
  choice: „liefert … dem Tod aus“
  alternative: „bringt sie um“
  rationale: Der griechische Text unterscheidet zwischen dem verzehrenden Wirken des Verlangens und der anschließenden Auslieferung an den Tod. Die Übersetzung wahrt diese Spannung und legt nicht fest, ob Tod physisch, geistlich oder eschatologisch gemeint ist.
- issue: Bedeutung von αἰών
  choice: „diese Weltzeit“
  alternative: „diese Welt“
  rationale: „Weltzeit“ hält die zeitliche Dimension von αἰών offen und vermeidet die Gleichsetzung der geschaffenen Welt als solcher mit dem Bösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Personifikation des bösen Verlangens sowie die Bilder von Wildheit, Gewand, Vermengung und Auslieferung wurden beibehalten. Keine Fußnoten erforderlich.
