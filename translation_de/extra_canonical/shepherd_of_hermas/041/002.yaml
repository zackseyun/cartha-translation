revisions:
- from: '2. Denn das böse Verlangen ist wild und lässt sich nur schwer zähmen. Es ist furchterregend und richtet die Menschen durch seine Wildheit völlig zugrunde. Besonders schlimm ist es, wenn ein Diener Gottes ihm verfällt und nicht besonnen ist: Dann wird er von ihm auf schreckliche Weise zugrunde gerichtet. Es richtet solche Menschen zugrunde, die das Gewand des guten Verlangens nicht tragen, sondern sich mit dieser Weltzeit vermengt haben. Diese liefert es daher dem Tod aus.'
  to: 2. Denn das böse Verlangen ist wild und lässt sich nur schwer zähmen. Es ist furchterregend und richtet die Menschen durch seine Wildheit äußerst zugrunde. Vor allem aber, wenn ein Diener Gottes ihm verfällt und nicht besonnen ist, wird er von ihm auf schreckliche Weise zugrunde gerichtet. Es richtet solche Menschen zugrunde, die das Gewand des guten Verlangens nicht tragen, sondern mit dieser Weltzeit vermischt sind. Diese liefert es daher dem Tod aus.
