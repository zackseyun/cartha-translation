base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: de
  text: 'Ihr nun, die ihr umkehrt: Legt die Bosheiten dieser Weltzeit ab, die euch zermürben. Zieht jede Tugend der Gerechtigkeit an; dann werdet ihr diese Gebote halten können und euren Sünden nichts mehr hinzufügen. Wenn ihr also nichts mehr hinzufügt, werdet ihr euch von euren früheren Sünden abwenden. Lebt daher nach diesen meinen Geboten, und ihr werdet für Gott leben. Dies alles[a] ist euch von mir gesagt worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort „alles“ ist textkritisch unsicher und fehlt in einigen Textzeugen.
    reason: Die zugrunde gelegte Edition setzt πάντα in eckige Klammern.
lexical_decisions:
- source_word: μετανοοῦντες
  choice: die ihr umkehrt
  rationale: Gibt die fortdauernde Umkehr wieder und beschränkt μετάνοια nicht auf ein bloßes Gefühl der Reue.
- source_word: τὰς πονηρίας
  choice: die Bosheiten
  rationale: Bewahrt den Plural und bezeichnet sittlich Böses beziehungsweise böse Verhaltensweisen.
- source_word: τοῦ αἰῶνος τούτου
  choice: dieser Weltzeit
  rationale: Gibt αἰών als gegenwärtige Weltordnung beziehungsweise Zeitalter wieder, ohne es schlicht mit der geschaffenen Welt gleichzusetzen.
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: die euch zermürben
  rationale: Vermittelt das Bild eines aufreibenden, zerstörerischen Wirkens in natürlichem Deutsch.
- source_word: ἐνδυσάμενοι
  choice: Zieht ... an
  rationale: Erhält die Metapher des Ablegens und Anziehens.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: jede Tugend der Gerechtigkeit
  rationale: Folgt der dichten griechischen Genitivverbindung, ohne sie auf eine einzelne konfessionell geprägte Deutung festzulegen.
- source_word: πορεύεσθε ... ταῖς ἐντολαῖς
  choice: Lebt ... nach diesen ... Geboten
  rationale: Überträgt die Wegmetapher idiomatisch als praktische Lebensführung.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: ihr werdet für Gott leben
  rationale: Bewahrt den Dativ und seine mögliche Ziel- oder Beziehungsbedeutung, statt ihn soteriologisch enger auszulegen.
theological_decisions:
- issue: Verhältnis von Umkehr, Gehorsam und früheren Sünden
  choice: Die konditionale und ermahnende Abfolge des griechischen Textes bleibt bestehen.
  alternative: Die Aussage als ausdrückliche Lehre über Verdienst, Sündenvergebung oder Rechtfertigung zu erklären.
  rationale: Der Text verbindet Umkehr mit dem Ablegen des Bösen und dem Halten der Gebote, legt aber den dogmatischen Mechanismus nicht näher fest.
- issue: Bedeutung von ἀποστήσεσθε ἀπὸ τῶν προτέρων ἁμαρτιῶν
  choice: werdet ihr euch von euren früheren Sünden abwenden
  alternative: werden euch eure früheren Sünden vergeben werden
  rationale: Das Verb bezeichnet hier ein Sich-Entfernen oder Abstandnehmen; Vergebung steht nicht ausdrücklich im griechischen Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die Kleidungs- und Wegmetaphorik des griechischen Textes bleibt erkennbar; ungewöhnliche theologische Formulierungen werden nicht konfessionell geglättet.
