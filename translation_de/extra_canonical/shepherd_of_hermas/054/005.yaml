  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: de
  text: 'Nachdem er dies mit mir besprochen hatte, sagte er zu mir: »Lass uns aufs Land gehen, und ich werde dir die Hirten der Schafe zeigen.« »Gehen wir, Herr«, sagte ich. Und wir kamen auf eine Ebene, und er zeigte mir einen Hirten, einen jungen Mann, der ein zusammengesetztes Gewand von safrangelber Farbe trug.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »gekleidet in eine Zusammenstellung von Kleidungsstücken, safranfarben«. Die ungewöhnliche griechische Formulierung lässt die genaue Art des Gewandes offen; gemeint sein kann ein zusammengesetztes oder aus mehreren Teilen bestehendes Gewand.'
    reason: Die Fußnote erklärt die ungewöhnliche Wendung σύνθεσιν ἱματίων, ohne die nicht belegte Annahme verschiedener Stoffe einzutragen.
lexical_decisions:
- source_word: μετὰ τὸ ταῦτα λαλῆσαι αὐτὸν μετ᾽ ἐμοῦ
  choice: Nachdem er dies mit mir besprochen hatte
  rationale: Das reziproke μετ᾽ ἐμοῦ wird natürlich als Gespräch mit Hermas wiedergegeben; »dies« nimmt die vorherigen Worte auf.
- source_word: εἰς ἀγρόν
  choice: aufs Land
  rationale: ἀγρός bezeichnet hier den ländlichen Raum beziehungsweise das freie Land, nicht zwingend einen einzelnen Acker.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird formal bewahrt, ohne die Identität des Angesprochenen näher festzulegen.
- source_word: πεδίον
  choice: Ebene
  rationale: Gibt eine flache, offene Landschaft wieder und unterscheidet den Ausdruck von ἀγρός.
- source_word: σύνθεσιν ἱματίων
  choice: ein aus verschiedenen Stoffen zusammengesetztes Gewand
  rationale: Die ungewöhnliche Wendung wird anschaulich, aber vorsichtig wiedergegeben; gemeint sein kann ein zusammengesetztes oder mehrteiliges Kleidungsstück.
- source_word: κροκώδη
  choice: von safrangelber Farbe
  rationale: Das Adjektiv bezeichnet eine safranartige, gelb-orange Färbung; »safrangelb« ist verständlich und präzise.
theological_decisions:
- issue: Anrede κύριε
  choice: Herr
  alternative: mein Herr / Gebieter
  rationale: »Herr« erhält die ehrerbietige und möglicherweise religiöse Färbung, ohne eine weitergehende christologische Identifikation einzutragen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit erhaltenem historischem Präsens bei »sagte« vereinheitlicht; direkte Rede klar und alltagstauglich. Die ungewöhnliche Gewandbeschreibung bleibt erkennbar und wird durch eine Fußnote abgesichert.
