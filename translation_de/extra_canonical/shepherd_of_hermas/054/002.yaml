review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Satzes insgesamt zuverlässig wieder, einschließlich des historischen Präsens und der Kleidungsmetapher. »im Zweifel / Zweifle« schwächt jedoch διψυχεῖν ab: Das Wort bezeichnet nicht bloß intellektuellen Zweifel, sondern ein inneres Geteilt- bzw. Unentschlossensein. Auch »die Kraft dazu geben« expliziert den Bezug von ἐν αὐταῖς stärker als nötig; die offene Formulierung »darin stärken« entspricht dem griechischen ἐν αὐταῖς genauer.'
  naturalness: Die direkte Rede ist flüssiges modernes Standarddeutsch. »Unentschlossen« ist hier natürlich und vermittelt den konkreten Ermahnungscharakter besser als das zweimalige »zweifeln«. »nach ihnen leben« ist eine idiomatische moderne Wiedergabe von »in ihnen wandeln«.
  terminology: »Gebote«, »den Glauben des Herrn« und »anziehen« sind angemessen. Der Genitiv bei »Glauben des Herrn« bleibt, wie im Ausgangstext, offen und wird nicht konfessionell als Glaube an den Herrn oder als dessen Treue festgelegt.
  issues:
  - severity: medium
    issue: διψυχεῖν ist mit »im Zweifel sein / zweifeln« zu eng wiedergegeben.
    rationale: Das griechische Wort hebt das innere Geteiltsein bzw. Schwanken hervor. »unentschlossen sein« bewahrt diesen Aspekt, ohne den Satz unnatürlich zu machen.
  - severity: low
    issue: »Ich werde dir die Kraft dazu geben« konkretisiert ἐν αὐταῖς.
    rationale: Das griechische »ich werde dich darin stärken« belässt den Bezug bei den Geboten beziehungsweise dem Wandel in ihnen und folgt der Formulierung näher.
