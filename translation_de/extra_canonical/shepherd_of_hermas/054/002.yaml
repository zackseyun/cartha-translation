  to: 'Während ich dies bei mir sagte, sehe ich ihn plötzlich neben mir sitzen und Folgendes sagen: »Warum bist du hinsichtlich der Gebote, die ich dir gegeben habe, so unentschlossen? Sie sind gut. Sei überhaupt nicht unentschlossen, sondern zieh den Glauben des Herrn an, und du wirst nach ihnen leben; denn ich werde dich darin stärken.«'
