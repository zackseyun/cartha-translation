base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: de
  text: 'Während ich dies bei mir sagte, sehe ich ihn plötzlich neben mir sitzen und Folgendes sagen: »Warum bist du hinsichtlich der Gebote, die ich dir gegeben habe, so unentschlossen? Sie sind gut. Sei überhaupt nicht unentschlossen, sondern zieh den Glauben des Herrn an, und du wirst nach ihnen leben; denn ich werde dich darin stärken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: bist du im Zweifel / Zweifle
  rationale: Das Verb bezeichnet wörtlich ein inneres Geteiltsein und kann Schwanken oder Zweifeln ausdrücken. Im unmittelbaren Zusammenhang geht es um Hermas’ Unsicherheit, ob die Gebote erfüllbar sind; modernes »zweifeln« gibt dies verständlich wieder.
- source_word: ἔνδυσαι
  choice: zieh ... an
  rationale: Die konkrete Kleidungsmetapher des griechischen Imperativs bleibt erhalten.
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: den Glauben des Herrn
  rationale: Der Genitiv bleibt bewusst formal offen und wird nicht einseitig als »Glaube an den Herrn« oder »Treue des Herrn« aufgelöst.
- source_word: ἐν αὐταῖς πορεύσῃ
  choice: dann wirst du nach ihnen leben
  rationale: Das semitisch geprägte Bild des Wandelns in Geboten meint die praktische Lebensführung. »Nach ihnen leben« ist im heutigen Deutsch natürlich und bewahrt den ethischen Sinn.
- source_word: ἐνδυναμώσω ... ἐν αὐταῖς
  choice: werde dir die Kraft dazu geben
  rationale: Die idiomatische Wiedergabe macht deutlich, dass die zugesagte Stärkung auf das Leben nach den Geboten bezogen ist, ohne eine zusätzliche theologische Erklärung einzutragen.
theological_decisions:
- issue: Beziehung zwischen Glauben, Befolgung der Gebote und göttlicher Befähigung
  choice: Die Abfolge von Glauben, Lebenswandel und zugesagter Stärkung bleibt unverändert stehen.
  alternative: Den Satz ausdrücklich als Lehre über Verdienst, Rechtfertigung oder Heiligung deuten.
  rationale: Der griechische Text verbindet diese Größen, entwickelt hier aber keine systematische Heilslehre. Die Übersetzung soll diese Spannung nicht konfessionell auflösen.
- issue: Genitiv in πίστιν τοῦ Κυρίου
  choice: »Glauben des Herrn«
  alternative: »Glauben an den Herrn« oder »Treue des Herrn«
  rationale: Beide präzisierenden Alternativen sind grammatisch beziehungsweise sachlich denkbar; die gewählte Form bewahrt die genuine Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Der historische Präsenswechsel in »sehe ich« bleibt entsprechend dem griechischen βλέπω erhalten. Keine Fußnoten erforderlich.
