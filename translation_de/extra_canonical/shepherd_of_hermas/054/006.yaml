base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: de
  text: Er hütete sehr viele Schafe. Diese Schafe schienen im Überfluss zu leben und sehr verschwenderisch zu sein; fröhlich sprangen sie hierhin und dorthin. Auch der Hirte selbst freute sich sehr über seine Herde. Schon sein Aussehen strahlte große Fröhlichkeit aus, und er lief mitten unter den Schafen umher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβοσκε
  choice: hütete
  rationale: Gibt die Tätigkeit des Hirten natürlich und präzise wieder; das Weidenlassen ist mitgemeint.
- source_word: ὡσεὶ τρυφῶντα
  choice: lebten wie im Überfluss
  rationale: Bewahrt das vergleichende ὡσεὶ und den Sinn von üppigem, genussvollem Leben, ohne bereits eine eindeutige moralische Wertung festzulegen.
- source_word: λίαν σπαταλῶντα
  choice: schwelgten ausgelassen
  rationale: σπαταλάω bezeichnet ein üppiges, zügelloses Wohlleben; die Formulierung hält sowohl Genuss als auch Maßlosigkeit hörbar.
- source_word: ἱλαρά
  choice: fröhlich
  rationale: Entspricht dem wiederholten Motiv sichtbarer Heiterkeit und Freude.
- source_word: σκιρτῶντα ὧδε κἀκεῖ
  choice: sprangen sie hierhin und dorthin
  rationale: Gibt die lebhafte Bewegung idiomatisch wieder.
- source_word: ἐπὶ τῷ ποιμνίῳ αὐτοῦ
  choice: über seine Herde
  rationale: Bewahrt die mögliche Nuance, dass seine Freude der Herde gilt beziehungsweise durch sie ausgelöst wird.
- source_word: ἡ ἰδέα τοῦ ποιμένος
  choice: sein Aussehen
  rationale: ἰδέα meint hier die sichtbare Erscheinung oder Gestalt des Hirten, nicht eine abstrakte Idee.
- source_word: ἐν τοῖς προβάτοις περιέτρεχε
  choice: lief mitten unter den Schafen umher
  rationale: Gibt sowohl die Bewegung ringsum als auch die räumliche Einbindung in die Schafherde wieder.
theological_decisions:
- issue: Mögliche moralische Wertung des üppigen Lebens der Schafe
  choice: Die ambivalente Verbindung von Überfluss, Schwelgen und Fröhlichkeit bleibt erhalten.
  alternative: Die Schafe ausdrücklich als ausschweifend oder sündig darstellen.
  rationale: τρυφάω und σπαταλάω können negativ konnotiert sein, doch der Satz schildert zugleich ihre Fröhlichkeit und die Freude des Hirten. Die Übersetzung soll die spätere Deutung nicht vorwegnehmen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit klarer Bildhaftigkeit. Die dreifache Wiederholung des Motivs der Fröhlichkeit wird bewusst beibehalten; leichte Variation verhindert schwerfällige Wiederholung, ohne den rhetorischen Nachdruck abzuschwächen.
