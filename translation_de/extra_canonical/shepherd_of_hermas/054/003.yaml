base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: de
  text: Diese Gebote sind für diejenigen hilfreich, die im Begriff sind umzukehren; denn wenn sie nicht nach ihnen leben, ist ihre Umkehr vergeblich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφοροί
  choice: hilfreich
  rationale: Gibt den Nutzen bzw. die Förderlichkeit der Gebote in natürlichem modernem Deutsch wieder.
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: für diejenigen, die umkehren wollen
  rationale: μέλλω bezeichnet hier eine bevorstehende oder beabsichtigte Umkehr; „wollen“ ist im Kontext idiomatischer als das schwerfällige „im Begriff sind“.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: nach ihnen leben
  rationale: Die wörtliche Wegmetapher „in ihnen wandeln“ wird als gegenwärtiges, allgemein verständliches Deutsch wiedergegeben, ohne den Sinn des gehorsamen Lebensvollzugs zu verändern.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bewahrt den umfassenden Sinn einer inneren und praktischen Neuorientierung besser als das enger oder kirchensprachlich klingende „Buße“.
- source_word: εἰς μάτην
  choice: vergeblich
  rationale: Direkte und idiomatische Wiedergabe der Wirkungslosigkeit bzw. Zwecklosigkeit.
theological_decisions:
- issue: Verhältnis von Umkehr und Befolgung der Gebote
  choice: 'Die konditionale Aussage des griechischen Textes bleibt unverändert stehen: Ohne ein Leben nach den Geboten ist die Umkehr vergeblich.'
  alternative: Die Aussage durch eine Erklärung über die Echtheit oder die Früchte der Umkehr dogmatisch präzisieren.
  rationale: Der Ausgangstext formuliert die Spannung direkt und erklärt nicht näher, ob es um Voraussetzung, Echtheitsnachweis oder bleibende Wirksamkeit der Umkehr geht; diese Offenheit wird nicht konfessionell aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und mahnend; unnötige Kirchensprache wird vermieden.
