  terminology: „Herr“, „Gebote“, „Seele“ und „retten“ sind sachgerecht und registerangemessen. „Glücklich“ ist für μακάριος in diesem nicht ausdrücklich liturgischen Kontext eine vertretbare moderne Wahl und wahrt die allgemein gehaltene Beglückwünschung.
