  source_fidelity: 'Die Übersetzung gibt den Satzbau und die zentralen Aussagen des Griechischen zuverlässig wieder: das Sitzen im Haus, das Preisen des Herrn für das Gesehene, das innere Erwägen der Eigenschaften der Gebote sowie die Selbstzusage über das Leben nach ihnen. „die Seele eines Menschen retten können“ bildet ψυχὴν ἀνθρώπου angemessen ab, ohne den Aussagegehalt theologisch einzuengen.'
