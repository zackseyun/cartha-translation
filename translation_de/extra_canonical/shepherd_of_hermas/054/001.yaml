base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: de
  text: 'Als ich in meinem Haus saß, den Herrn für alles pries, was ich gesehen hatte, und über die Gebote nachdachte – dass sie gut und kraftvoll, erfreulich und herrlich sind und die Seele eines Menschen retten können –, sagte ich mir: »Glücklich werde ich sein, wenn ich nach diesen Geboten lebe; und wer nach ihnen lebt, wird glücklich sein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: pries
  rationale: Gibt das fortdauernde ehrende Preisen Gottes natürlich und würdig wieder.
- source_word: συζητῶν
  choice: nachdachte
  rationale: Im Kontext bezeichnet das Partizip ein inneres Erwägen der Gebote; „nachdachte“ passt zum anschließenden Selbstgespräch.
- source_word: δυναταί
  choice: kraftvoll
  rationale: Bewahrt die Aussage von wirksamer Stärke, ohne die Gebote lediglich als „machbar“ zu deuten.
- source_word: ἱλαραί
  choice: erfreulich
  rationale: Bezeichnet hier eine heitere, Freude weckende Qualität und lässt sich im Deutschen idiomatisch auf die Gebote beziehen.
- source_word: πορευθῶ / πορευθῇ
  choice: nach diesen Geboten lebe / nach ihnen lebt
  rationale: Die wörtliche Wegmetapher „in den Geboten gehen“ wird als verständliche deutsche Wendung wiedergegeben, während der Gedanke einer gelebten Ausrichtung erhalten bleibt.
- source_word: μακάριος
  choice: glücklich
  rationale: Drückt den begünstigten, beneidenswert guten Zustand aus; „selig“ wäre möglich, klingt heute jedoch stärker kirchensprachlich.
theological_decisions:
- issue: Heilswirksamkeit der Gebote
  choice: „die Seele eines Menschen retten können“
  alternative: „einen Menschen retten können“
  rationale: Die ausdrückliche Formulierung ψυχὴν ἀνθρώπου wird bewahrt, ohne zu bestimmen, auf welche Weise die Gebote retten oder wie dies zu anderen Heilslehren ins Verhältnis zu setzen ist.
- issue: Bedeutung des Lebens nach den Geboten
  choice: „wenn ich nach diesen Geboten lebe“
  alternative: „wenn ich in diesen Geboten wandle“
  rationale: Die ethische Wegmetapher wird in modernes, allgemein verständliches Deutsch übertragen, ohne die behauptete Verbindung zwischen Gehorsam und Glück abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die lange griechische Periodenstruktur bleibt in ihrer gedanklichen Bewegung erkennbar, wird aber durch Gedankenstriche und Zeichensetzung lesbar gegliedert. Das innere Selbstgespräch steht in deutschen Anführungszeichen.
