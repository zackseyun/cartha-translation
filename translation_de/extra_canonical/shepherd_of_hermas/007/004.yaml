    issue: Das Wort „Schrift“ wird im Haupttext ergänzt.
    rationale: Der griechische Ausdruck nennt nur „Eldad und Modat“ nach ἐν; ein verlorenes Werk ist wahrscheinlich, seine genaue Gattung wird jedoch nicht ausdrücklich bezeichnet.
  - severity: low
    issue: Die Fußnote formuliert die Nichterhaltung der Quelle zu bestimmt.
    rationale: Die Stelle wird üblicherweise als Bezug auf ein sonst unbekanntes Werk oder eine Überlieferung verstanden; die Formulierung sollte diese Einordnung als wahrscheinlich, nicht als abschließend gesichert darstellen.
  revised_text: 'Und zu Maximus sollst du sagen: »Sieh, Bedrängnis kommt, wenn du es für richtig hältst, wieder zu verleugnen. Der Herr ist denen nahe, die umkehren, wie in ›Eldad und Modat‹ geschrieben steht, die in der Wüste zum Volk prophetisch redeten.«'
  revised_footnotes:
