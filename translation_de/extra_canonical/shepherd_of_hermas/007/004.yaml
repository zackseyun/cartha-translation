base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: de
  text: 'Und zu Maximus sollst du sagen: »Sieh, Bedrängnis kommt, wenn du es für richtig hältst, wieder zu verleugnen. Der Herr ist denen nahe, die umkehren, wie in ›Eldad und Modat‹ geschrieben steht, die in der Wüste zum Volk prophetisch redeten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψις
  choice: Bedrängnis
  rationale: Bezeichnet schweren äußeren oder inneren Druck; „Bedrängnis“ wahrt den ernsten, frühchristlichen Klang natürlicher als das allgemeinere „Not“.
- source_word: ἐάν σοι δοκῇ
  choice: wenn du es für richtig hältst
  rationale: Gibt die ironisch-mahnende Formulierung wörtlich genug wieder, ohne sie zu einer bloßen Möglichkeit abzuschwächen.
- source_word: πάλιν ἀρνεῖσθαι
  choice: wieder zu verleugnen
  rationale: Das Objekt bleibt wie im Griechischen unausgesprochen; dadurch wird die mögliche Bezugnahme auf die Verleugnung des Herrn nicht ausdrücklich ergänzt.
- source_word: τοῖς ἐπιστρεφομένοις
  choice: denen, die umkehren
  rationale: Bewahrt den Sinn von Umkehr und Hinwendung, ohne das im Griechischen nicht ausdrücklich genannte Objekt „zu ihm“ einzufügen.
- source_word: προφητεύσασιν
  choice: prophetisch redeten
  rationale: Natürliches modernes Deutsch, das die Tätigkeit der beiden Männer bezeichnet, ohne den Satz unnötig zu nominalisieren.
theological_decisions:
- issue: Unausgesprochenes Objekt bei „wieder verleugnen“
  choice: Kein Objekt ergänzt
  alternative: „den Herrn wieder zu verleugnen“
  rationale: Der Zusammenhang legt den Herrn als Objekt nahe, doch der griechische Wortlaut lässt es offen; die Übersetzung bewahrt diese Ellipse.
- issue: Bezug der Umkehr
  choice: „die umkehren“
  alternative: „die sich ihm zuwenden“
  rationale: Die Alternative erklärt den theologischen Bezug, ergänzt jedoch ein Pronomen, das im Ausgangstext fehlt.
- issue: Charakter von „Eldad und Modat“
  choice: Als Titel einer Schrift kenntlich gemacht
  alternative: „bei Eldad und Modat“
  rationale: Die Wendung „wie es in … geschrieben steht“ deutet auf eine zitierte Schrift oder Überlieferung, nicht lediglich auf die biblischen Personen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Mahnrede. „Sieh“ erhält den auffordernden Ton von Ἰδού; die elliptischen Formulierungen des Griechischen werden nicht theologisch vereindeutigt.
