    text: Eldad und Modat sind wohl die beiden Männer Eldad und Medad/Modad aus 4. Mose 11,26–29, die im Lager prophetisch redeten. Die Formulierung verweist wahrscheinlich auf ein heute sonst nicht erhaltenes Werk oder eine Überlieferung mit diesem Titel.
