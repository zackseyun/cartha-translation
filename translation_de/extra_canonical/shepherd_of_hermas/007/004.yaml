  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Textes ist insgesamt zutreffend wiedergegeben: θλίψις, die elliptische Wiederholung von ἀρνεῖσθαι, die Umkehrenden und die prophetische Tätigkeit Eldads und Modats bleiben gewahrt. Das in der Übersetzung eingefügte Gattungswort „Schrift“ ist jedoch nicht ausdrücklich im griechischen Wortlaut vorhanden. Die Konstruktion γέγραπται ἐν τῷ Ἐλδὰδ καὶ Μωδάτ verweist wahrscheinlich auf einen Werktitel, lässt dessen genaue Gattung aber offen.'
  naturalness: Die Mahnrede ist modernes, würdiges Deutsch. „Wie es in der Schrift ›Eldad und Modat‹ geschrieben steht“ wirkt allerdings stilistisch schwerfällig und legt die Gattung des genannten Werks stärker fest als nötig. „wie in ›Eldad und Modat‹ geschrieben steht“ ist natürlicher und textnäher.
  terminology: „Bedrängnis“, „verleugnen“, „umkehren“ und „Der Herr“ sind angemessen. Die Namen sind gemäß der griechischen Vorlage als Eldad und Modat wiedergegeben. Die Anmerkung sollte den Bezug auf das biblische Eldad und Medad/Modad erläutern, ohne die literarische Einordnung der im Hermas genannten Quelle als gesichert auszugeben.
  issues:
