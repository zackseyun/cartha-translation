base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: de
  text: Was dich aber rettet, ist, dass du dich nicht vom lebendigen Gott abgewandt hast, sowie deine Aufrichtigkeit und deine große Selbstbeherrschung. Das alles hat dich gerettet, wenn du daran festhältst; und es rettet alle, die so handeln und in Arglosigkeit und Aufrichtigkeit ihren Weg gehen. Diese Menschen überwinden jede Bosheit und haben Bestand bis zum ewigen Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ ἀποστήναι σε
  choice: dass du dich nicht … abgewandt hast
  rationale: Gibt die substantivierte Infinitivkonstruktion natürlich wieder und bewahrt den Gedanken, Gott nicht verlassen beziehungsweise von ihm abgefallen zu sein.
- source_word: ἁπλότης
  choice: Aufrichtigkeit
  rationale: Bezeichnet hier eine ungeteilte, lautere Haltung; „Einfachheit“ wäre im heutigen Deutsch leicht als mangelnde Intelligenz missverständlich.
- source_word: ἐγκράτεια
  choice: Selbstbeherrschung
  rationale: Der geläufige ethische Sinn ist die Herrschaft über die eigenen Begierden und Handlungen.
- source_word: ἀκακία
  choice: Arglosigkeit
  rationale: Bewahrt den Sinn von Bosheitslosigkeit und Unschuld, ohne den Begriff mit ἁπλότης gleichzusetzen.
- source_word: κατισχύουσιν
  choice: überwinden
  rationale: Drückt das Sich-als-stärker-Erweisen gegenüber jeder Bosheit in natürlichem Deutsch aus.
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: bleiben bis zum ewigen Leben
  rationale: Folgt der ungewöhnlichen Richtungs- beziehungsweise Zielkonstruktion eng und vermeidet, sie voreilig als „ewig leben“ zu glätten.
theological_decisions:
- issue: Verhältnis von göttlicher Rettung und menschlicher Haltung
  choice: Die Aussagen „rettet“ und „hat gerettet“ bleiben unmittelbar mit Nichtabfall, Aufrichtigkeit und Selbstbeherrschung verbunden.
  alternative: Die Eigenschaften lediglich als äußere Beweise einer unabhängig davon vollzogenen Rettung wiederzugeben.
  rationale: Der griechische Text formuliert den Zusammenhang ausdrücklich und sollte nicht durch ein späteres konfessionelles System umgedeutet werden.
- issue: Bedingtheit der vollendeten Rettung
  choice: „wenn du daran festhältst“ bleibt als echte Bedingung stehen.
  alternative: Die Wendung abschwächend als bloßen Hinweis auf erwartbare Beharrlichkeit zu formulieren.
  rationale: ἐὰν ἐμμένῃς ist eine klare Konditionalformulierung; ihre theologische Spannung ist zu bewahren.
- issue: Bedeutung von ζωὴ αἰώνιος
  choice: „ewiges Leben“
  alternative: „Leben der kommenden Weltzeit“
  rationale: „Ewiges Leben“ ist die natürliche und traditionsübergreifend verständliche deutsche Wiedergabe; die Zielrichtung der Präposition bleibt durch „bis zum“ sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Rettungsmotivs und der Wechsel zwischen Singular und Plural wurden bewahrt. Keine Fußnoten erforderlich.
