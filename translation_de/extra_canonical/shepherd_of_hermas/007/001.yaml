revisions:
- from: Du aber, Hermas, sollst deinen Kindern nichts mehr nachtragen und auch deine Schwester nicht gewähren lassen, damit sie von ihren früheren Sünden gereinigt werden. Denn sie werden auf gerechte Weise zurechtgewiesen werden, wenn du ihnen nichts nachträgst. Nachtragen führt zum Tod. Du aber, Hermas, hast wegen der Verfehlungen deines Hauses große persönliche Bedrängnisse erlitten, weil du dich nicht um sie gekümmert, sondern sie vernachlässigt und dich in deine üblen Geschäfte verstrickt hast.
  to: Du aber, Hermas, sollst deinen Kindern nichts mehr nachtragen und auch deine Schwester nicht sich selbst überlassen, damit sie von ihren früheren Sünden gereinigt werden. Denn sie werden gerechte Zurechtweisung erfahren, wenn du ihnen nichts nachträgst. Nachtragen führt zum Tod. Du aber, Hermas, hast wegen der Verfehlungen deines Hauses große persönliche Bedrängnisse erlitten, weil du dich nicht um sie gekümmert, sondern sie vernachlässigt und dich in deine üblen Geschäfte verstrickt hast.
