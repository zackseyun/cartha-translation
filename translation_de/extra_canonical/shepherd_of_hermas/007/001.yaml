base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: de
  text: Du aber, Hermas, sollst deinen Kindern nichts mehr nachtragen und auch deine Schwester nicht sich selbst überlassen, damit sie von ihren früheren Sünden gereinigt werden. Denn sie werden gerechte Zurechtweisung erfahren, wenn du ihnen nichts nachträgst. Nachtragen führt zum Tod. Du aber, Hermas, hast wegen der Verfehlungen deines Hauses große persönliche Bedrängnisse erlitten, weil du dich nicht um sie gekümmert, sondern sie vernachlässigt und dich in deine üblen Geschäfte verstrickt hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηκέτι μνησικακήσῃς / μνησικακία
  choice: nichts mehr nachtragen / Nachtragen
  rationale: Gibt das fortgesetzte Festhalten an erlittenem Unrecht idiomatisch wieder und bewahrt die Wiederholung des griechischen Wortstamms.
- source_word: τὴν ἀδελφήν σου ἐάσῃς
  choice: deine Schwester nicht gewähren lassen
  rationale: ἐάω bedeutet hier vermutlich, jemanden ungehindert fortfahren zu lassen; die elliptische Formulierung des Ausgangstextes bleibt erhalten, ohne ein bestimmtes Fehlverhalten zu ergänzen.
- source_word: παιδευθήσονται ... παιδείᾳ δικαίᾳ
  choice: werden auf gerechte Weise zurechtgewiesen werden
  rationale: Vermittelt sowohl erzieherische Korrektur als auch disziplinierende Maßnahme in natürlichem Deutsch; die etymologische Wiederholung wird zugunsten der Verständlichkeit nicht mechanisch nachgebildet.
- source_word: θλίψεις ... ἰδιωτικὰς
  choice: persönliche Bedrängnisse
  rationale: ἰδιωτικάς bezeichnet hier wahrscheinlich das private bzw. häusliche Lebensfeld; „persönliche Bedrängnisse“ wahrt die Breite der Aussage.
- source_word: τοῦ οἴκου σου
  choice: deines Hauses
  rationale: Bewahrt die mögliche Bedeutungsspanne von Haushalt, Hausgemeinschaft und Familie.
- source_word: παρενεθυμήθης
  choice: sie vernachlässigt
  rationale: Der seltene bzw. textkritisch schwierige Ausdruck wird im Kontext als mangelnde Beachtung der Angehörigen verstanden; die Übersetzung folgt dem klaren Kontrast zu οὐκ ἐμέλησέ σοι.
- source_word: ταῖς πραγματείαις σου ... ταῖς πονηραῖς
  choice: deine üblen Geschäfte
  rationale: πραγματεία kann geschäftliche Tätigkeit oder Unternehmungen bezeichnen; „Geschäfte“ passt zum Kontext, ohne die Art der Tätigkeit näher festzulegen.
- source_word: συνανεφύρης
  choice: dich ... verstrickt hast
  rationale: Gibt das Bild des Vermischens bzw. Hineingeratens idiomatisch und moralisch neutral genug wieder.
theological_decisions:
- issue: Zusammenhang zwischen Hermas’ Nachtragen und der Reinigung bzw. Zurechtweisung seiner Kinder
  choice: Die konditionale und finale Verknüpfung des Griechischen wird unverändert wiedergegeben.
  alternative: Den Satz so deuten, dass Hermas selbst ihnen vergeben müsse, damit Gott ihnen vergebe.
  rationale: Der Text nennt den Handelnden der Reinigung und Zurechtweisung nicht ausdrücklich; eine bestimmte Lehre über menschliche oder göttliche Vergebung wird daher nicht ergänzt.
- issue: „Nachtragen führt zum Tod“
  choice: Die unqualifizierte Aussage bleibt stehen.
  alternative: „Nachtragen kann zum geistlichen Tod führen.“
  rationale: Der griechische Text enthält weder „kann“ noch ausdrücklich „geistlich“; die theologische Spannung soll nicht abgeschwächt oder aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Wiederholung „Du aber, Hermas“ und die knappen Mahnsätze bleiben erhalten. Die Ellipse bei der Schwester wird bewusst nicht durch eine spekulative Ergänzung aufgelöst.
