  source_fidelity: 'Die Übersetzung gibt die Mahnung gegen μνησικακία, die bedingte gerechte Disziplinierung, den Tod als Folge des Nachtragens sowie Hermas’ häusliche Bedrängnisse insgesamt zuverlässig wieder. Bei τὴν ἀδελφήν σου ἐάσῃς ist „deine Schwester nicht gewähren lassen“ jedoch im Deutschen semantisch verschoben: Es bedeutet eher, ihr ihren Willen zu lassen, während ἐάω hier elliptisch „lassen/allein lassen“ ausdrückt.'
  naturalness: Der Stil ist überwiegend modernes, würdevolles Standarddeutsch. „Auch deine Schwester nicht sich selbst überlassen“ ist für die Ellipse idiomatischer. „Gerechte Zurechtweisung erfahren“ gibt παιδευθήσονται παιδείᾳ δικαίᾳ flüssiger wieder als die schwerfällige Passivfügung „auf gerechte Weise zurechtgewiesen werden“.
  terminology: „nichts nachtragen“/„Nachtragen“, „Bedrängnisse“, „Haus“ und „üble Geschäfte“ sind tragfähige Wiedergaben. Die Wiederaufnahme von „Nachtragen“ bewahrt die begriffliche Kohärenz von μνησικακέω und μνησικακία. Keine theologische Präzisierung ist einzutragen.
