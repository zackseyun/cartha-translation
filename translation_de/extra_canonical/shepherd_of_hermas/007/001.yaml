    issue: „deine Schwester nicht gewähren lassen“
    rationale: Die deutsche Wendung bezeichnet gewöhnlich, jemandem freie Hand zu lassen, und legt damit eine nicht im griechischen Text genannte Aktivität der Schwester nahe. Die elliptische Aussage von ἐάσῃς wird mit „nicht sich selbst überlassen“ natürlicher und ohne Spezifizierung wiedergegeben.
  - severity: low
    issue: „auf gerechte Weise zurechtgewiesen werden“
    rationale: Die Formulierung ist verständlich, aber unnötig schwerfällig und bildet παιδεία als erzieherisch-disziplinierende Behandlung weniger präzise ab als „gerechte Zurechtweisung erfahren“.
