  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: de
  text: Glücklich zu preisen sind alle, die Gerechtigkeit üben; sie werden niemals zugrunde gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: glücklich zu preisen
  rationale: Gibt die feierliche Seligpreisungsform wieder und bleibt zugleich in modernem Deutsch verständlich.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: alle, die Gerechtigkeit üben
  rationale: Bewahrt den aktiven Sinn von ἐργάζομαι und gibt δικαιοσύνη mit dem etablierten, inhaltlich offenen Begriff „Gerechtigkeit“ wieder.
- source_word: οὐ διαφθαρήσονται ἕως αἰῶνος
  choice: sie werden niemals zugrunde gehen
  rationale: διαφθείρω bezeichnet hier im Passiv Verderben oder Untergang; ἕως αἰῶνος ist idiomatisch als dauerhafte Verneinung wiedergegeben.
theological_decisions:
- issue: Bedeutung von „Gerechtigkeit üben“
  choice: Die handlungsbezogene Formulierung des Griechischen bleibt stehen.
  alternative: „die gerecht leben“
  rationale: Die Übersetzung soll die Spannung zwischen tätiger Gerechtigkeit und endgültiger Bewahrung nicht durch eine stärker ausdeutende Formulierung auflösen.
- issue: Art des verneinten Verderbens
  choice: „zugrunde gehen“ ohne nähere Bestimmung
  alternative: „ewig nicht verdorben werden“
  rationale: Der Kontext kann endgültigen Untergang meinen, doch der griechische Ausdruck legt dessen genaue Art nicht ausdrücklich fest.
translation_notes:
  register: Kurzer, feierlicher Seligpreisungssatz in natürlichem modernem Standarddeutsch; das Semikolon erhält die pointierte Zweiteilung des griechischen Satzes.
