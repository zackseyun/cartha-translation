base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: de
  text: 'Glaube zuallererst, dass Gott einer ist: Er hat alles geschaffen und geordnet und alles aus dem Nichtsein ins Dasein gebracht. Er umfasst alles, doch er allein kann von nichts umfasst werden.[a] Glaube ihm also und fürchte ihn; und weil du ihn fürchtest, übe Selbstbeherrschung. Halte diese Weisungen, dann wirst du alle Bosheit von dir ablegen und jede Tugend der Gerechtigkeit anziehen. Und du wirst für Gott leben, wenn du dieses Gebot hältst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er fasst alles, doch er allein kann von nichts gefasst werden.“ Das Griechische verwendet gegensätzliche Formen desselben Wortstamms.'
    reason: Die räumlich-metaphysische Wendung χωρῶν … ἀχώρητος hat eine Bedeutungsbreite, die eine einzelne deutsche Formulierung nicht vollständig abbildet. Die Alternative erhält den formalen Gegensatz von „fassen“ und „nicht gefasst werden“.
lexical_decisions:
- source_word: καταρτίσας
  choice: geordnet
  rationale: Das Partizip bezeichnet hier das ordnende, zur rechten Gestalt bringende Wirken Gottes; „geordnet“ ist natürlich und wahrt die Abgrenzung zu κτίσας („geschaffen“).
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: aus dem Nichtsein ins Dasein
  rationale: Die philosophisch-theologische Gegenüberstellung von Nichtsein und Sein wird eng am Griechischen und zugleich idiomatisch wiedergegeben.
- source_word: χωρῶν … ἀχώρητος
  choice: umfasst … von nichts umfasst werden
  rationale: Die Wortspielstruktur des griechischen Gegensatzpaares bleibt erhalten. Die Ergänzung „von nichts“ macht die absolute Aussage μόνος δὲ ἀχώρητος im Deutschen verständlich, ohne sie inhaltlich einzuengen.
- source_word: ἐγκράτευσαι
  choice: übe Selbstbeherrschung
  rationale: Der Imperativ meint beherrschtes, enthaltsames Verhalten; „Selbstbeherrschung“ ist hier umfassender und weniger missverständlich als bloß „Enthaltsamkeit“.
- source_word: ἀρετὴν δικαιοσύνης
  choice: Tugend der Gerechtigkeit
  rationale: Die auffällige Genitivverbindung wird formal bewahrt, statt sie vorschnell als „gerechte Tugend“ oder „Rechtschaffenheit“ aufzulösen.
- source_word: ζήσῃ τῷ θεῷ
  choice: für Gott leben
  rationale: Der Dativ wird als Ausrichtung beziehungsweise Zugehörigkeit verstanden. Die Formulierung bleibt bewusst etwas markant und entspricht dem theologischen Ton des Textes.
theological_decisions:
- issue: 'Einheit Gottes: εἷς ἐστὶν ὁ Θεός'
  choice: dass Gott einer ist
  alternative: dass es nur einen Gott gibt
  rationale: „Gott ist einer“ folgt der Prädikatskonstruktion genauer und bewahrt die mögliche Betonung sowohl der Einzigkeit als auch der Einheit Gottes.
- issue: 'Gottes Verhältnis zu allem: χωρῶν / ἀχώρητος'
  choice: Er umfasst alles, doch er allein kann von nichts umfasst werden
  alternative: Er enthält alles, während er allein unendlich ist
  rationale: Die Übersetzung bewahrt den sprachlichen Gegensatz, ohne ἀχώρητος durch eine bestimmte metaphysische Deutung wie „unendlich“ festzulegen.
- issue: 'Gottesfurcht und Selbstbeherrschung: φοβηθεὶς δὲ ἐγκράτευσαι'
  choice: und weil du ihn fürchtest, übe Selbstbeherrschung
  alternative: und nachdem du ihn gefürchtet hast, sei enthaltsam
  rationale: Das Aoristpartizip bezeichnet hier wahrscheinlich die Gottesfurcht als Grundlage der folgenden Selbstbeherrschung, nicht zwingend eine zeitlich abgeschlossene Handlung.
translation_notes:
  register: Moderne, würdige Standardsprache mit imperativischem Weisungston. Die wiederholten Schlüsselwörter „glauben“, „fürchten“, „alles“ und „halten“ bleiben sichtbar; schwerfällige Satzperioden werden moderat gegliedert, ohne die gedankliche Abfolge des Griechischen aufzulösen.
