  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: de
  text: 'Und er sagt zu mir: »Siehst du diesen Hirten?« – »Ja, Herr«, sage ich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: Hirten
  rationale: Die direkte und im Bildzusammenhang natürliche Entsprechung für ποιμήν.
- source_word: κύριε
  choice: Herr
  rationale: Gibt die respektvolle Anrede κύριε wieder, ohne die im Kontext mögliche Anrede eines menschlichen Gegenübers unnötig festzulegen.
- source_word: Βλέπω
  choice: Ja
  rationale: Im Deutschen beantwortet ein idiomatisches »Ja« die vorausgehende Entscheidungsfrage natürlicher als das wörtliche »Ich sehe ihn«; der bejahende Sinn bleibt vollständig erhalten.
theological_decisions:
- issue: Bedeutung der Anrede κύριε
  choice: Herr
  alternative: mein Herr; Gebieter
  rationale: Die formale Anrede bleibt erhalten, ohne die Identität oder den Rang des Angesprochenen über den griechischen Text hinaus theologisch zu bestimmen.
translation_notes:
  register: Kurzer, würdevoller und gegenwärtiger Dialogstil. Der Wechsel der Sprecher wird durch Anführungszeichen und Gedankenstrich klar kenntlich gemacht.
