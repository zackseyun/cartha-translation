base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/003.yaml
  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: de
  text: 5. Wieder gingen wir ein Stück weiter, und er zeigt mir einen großen Hirten, der beinahe wild aussah. Er hatte ein weißes Ziegenfell umgelegt, trug eine Tasche auf den Schultern und hielt einen sehr harten, knotigen Stab und eine große Peitsche. Sein Blick war überaus grimmig, sodass ich mich vor ihm fürchtete – so war sein Blick.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσεὶ ἄγριον τῇ ἰδέᾳ
  choice: der beinahe wild aussah
  rationale: ὡσεὶ wahrt die vergleichende Abschwächung; ἰδέα bezeichnet hier die äußere Erscheinung.
- source_word: περικείμενον δέρμα αἴγειον λευκόν
  choice: Er hatte ein weißes Ziegenfell umgelegt
  rationale: περίκειμαι beschreibt etwas, das man umgelegt beziehungsweise am Körper trägt; die Formulierung ist im Deutschen natürlich und anschaulich.
- source_word: πήραν τινὰ
  choice: eine Tasche
  rationale: πήρα bezeichnet eine Tragetasche oder einen Beutel; der unbestimmte Zusatz τινά muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: einen sehr harten, knotigen Stab
  rationale: Die kompakte Wiedergabe erfasst sowohl die außergewöhnliche Härte als auch die vorhandenen Knoten oder Astansätze.
- source_word: τὸ βλέμμα εἶχε περίπικρον
  choice: Sein Blick war überaus grimmig
  rationale: περίπικρος verstärkt die Härte und Bedrohlichkeit des Blicks; „grimmig“ ist im Kontext eines furchteinflößenden Hirten idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der historische Präsenswechsel in καὶ δεικνύει μοι wird mit „und er zeigt mir“ bewahrt. Die abschließende Wiederholung des Blicks bleibt erhalten, da sie die furchterregende Erscheinung rhetorisch verstärkt.
