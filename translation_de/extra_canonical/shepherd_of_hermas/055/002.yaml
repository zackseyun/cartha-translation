base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: de
  text: „Die Schafe, die du gesehen hast, hüpften nicht umher, sondern weideten an einem einzigen Ort. Das sind diejenigen, die sich zwar dem Wohlleben und den Täuschungen hingegeben, den Herrn aber in keiner Weise gelästert haben. Sie sind also der Wahrheit entfremdet und verdorben. Doch bei ihnen besteht Hoffnung auf Umkehr, in der sie leben können. Diese Verdorbenheit hat also Hoffnung auf eine gewisse Erneuerung; der Tod dagegen bringt ewigen Untergang.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιρτῶντα
  choice: hüpften nicht umher
  rationale: Gibt die sichtbare, ausgelassene Bewegung des Verbs im Bild der Schafe natürlich wieder.
- source_word: τρυφαῖς
  choice: Wohlleben
  rationale: Bezeichnet genussorientierten Luxus beziehungsweise ein verweichlichendes Leben; „Wohlleben“ ist würdig und verständlich.
- source_word: ἀπάταις
  choice: Täuschungen
  rationale: Bewahrt den allgemeinen Sinn von Irreführung und Betrug, ohne die Art der Täuschung näher festzulegen.
- source_word: μετανοίας
  choice: Umkehr
  rationale: Erfasst die geforderte innere und praktische Neuorientierung natürlicher als das stärker kirchlich geprägte „Buße“.
- source_word: καταφθορὰ / κατεφθαρμένοι
  choice: Verderben / ins Verderben geraten
  rationale: Hält die Wortverbindung zwischen Zustand und anschließender Aussage über mögliche Erneuerung erkennbar.
- source_word: ἀπώλειαν αἰώνιον
  choice: ewigen Untergang
  rationale: Unterscheidet ἀπώλεια von καταφθορά und bewahrt die Endgültigkeit der Gegenüberstellung.
theological_decisions:
- issue: Bezug von ἐν ᾗ
  choice: „durch die“ bezieht sich auf die Umkehr
  alternative: Bezug auf die Hoffnung
  rationale: Das feminine Relativpronomen stimmt unmittelbar mit μετάνοια überein; inhaltlich ist die Umkehr das Mittel, durch das sie leben können.
- issue: Gegenüberstellung von Verderben und Tod
  choice: Die Möglichkeit der Erneuerung beim Verderben wird dem ewigen Untergang als Folge des Todes gegenübergestellt.
  alternative: Verderben und Tod als vollständig gleichbedeutend wiedergeben
  rationale: Der griechische Text unterscheidet ausdrücklich καταφθορά und θάνατος und erhält dadurch die theologische Spannung zwischen noch möglicher Umkehr und endgültigem Untergang.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Bildsprache. Die antithetische Struktur und die Wiederholung des Begriffs „Verderben“ bleiben erhalten; unnötig konfessionelle Terminologie wird vermieden.
