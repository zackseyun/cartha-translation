revisions:
- from: „Die Schafe, die du gesehen hast, hüpften nicht umher, sondern weideten an einem einzigen Ort. Das sind diejenigen, die sich zwar dem Wohlleben und den Täuschungen hingegeben, den Herrn aber in keiner Weise gelästert haben. Sie sind also von der Wahrheit weg ins Verderben geraten. Doch bei ihnen besteht Hoffnung auf Umkehr, durch die sie leben können. Für dieses Verderben gibt es also Hoffnung auf eine gewisse Erneuerung; der Tod dagegen hat ewigen Untergang zur Folge.“
  to: „Die Schafe, die du gesehen hast, hüpften nicht umher, sondern weideten an einem einzigen Ort. Das sind diejenigen, die sich zwar dem Wohlleben und den Täuschungen hingegeben, den Herrn aber in keiner Weise gelästert haben. Sie sind also der Wahrheit entfremdet und verdorben. Doch bei ihnen besteht Hoffnung auf Umkehr, in der sie leben können. Diese Verdorbenheit hat also Hoffnung auf eine gewisse Erneuerung; der Tod dagegen bringt ewigen Untergang.“
  rationale: Die Revision ersetzt die prozesshafte und potenziell endgültig klingende Wendung „ins Verderben geraten“ durch eine Formulierung, die den Zustand der Entfremdung von der Wahrheit und des Verdorbenseins ausdrückt. Die Wiederaufnahme als „Diese Verdorbenheit“ hält die lexikalische Verbindung zu καταφθορά aufrecht. Die Präpositionalwendung bei der Umkehr wird näher am griechischen Wortlaut gefasst.
