base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: de
  text: 6. Dieser Hirte übernahm nun von dem jungen Hirten jene Schafe, die ausschweifend und genusssüchtig lebten, aber nicht umhersprangen. Er warf sie in einen steilen, dornigen und distelbewachsenen Ort, sodass die Schafe sich wegen der Dornen und Disteln nicht losmachen konnten, sondern [sich in den Dornen und Disteln verfingen; so] weideten sie, darin verfangen, zwischen Dornen und Disteln. Sie litten große Qual, weil er sie schlug. Er trieb sie hierhin und dorthin und gönnte ihnen keine Ruhe; jene Schafe kamen überhaupt nicht zur Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jene Schafe fanden überhaupt keinen festen Stand« beziehungsweise »waren überhaupt nicht standfest«.'
    reason: οὐκ εὐσταθοῦσαν kann sowohl fehlende Ruhe beziehungsweise Stabilität im konkreten Bild als auch mangelnde Standfestigkeit ausdrücken.
lexical_decisions:
- source_word: σπαταλῶντα καὶ τρυφῶντα
  choice: ausschweifend und genusssüchtig lebten
  rationale: Gibt sowohl verschwenderisch-zügelloses Leben (σπαταλάω) als auch weichlichen, selbstverwöhnenden Genuss (τρυφάω) in natürlichem Deutsch wieder.
- source_word: τόπον κρημνώδη καὶ ἀκανθώδη καὶ τριβολώδη
  choice: einen abschüssigen, mit Dornen und Disteln überwucherten Ort
  rationale: κρημνώδη bezeichnet steiles beziehungsweise abschüssiges Gelände; ἄκανθαι und τρίβολοι werden anschaulich und idiomatisch als Dornen und Disteln wiedergegeben.
- source_word: δαιρόμενα ὑπ' αὐτοῦ
  choice: weil er sie schlug
  rationale: δέρω bedeutet hier schlagen oder prügeln. Die aktive deutsche Form bewahrt ausdrücklich den Hirten als Handelnden und vermeidet die sachlich unpassende Deutung, die Dornen hätten die Schafe zerrissen.
- source_word: οὐκ εὐσταθοῦσαν
  choice: kamen überhaupt nicht zur Ruhe
  rationale: Im Kontext des rastlosen Umhertreibens bezeichnet εὐσταθέω ein ruhiges, festes Verweilen. Die Formulierung ist verständlich, ohne eine unnatürliche Aussage über körperliche Standfestigkeit zu erzwingen.
theological_decisions:
- issue: Charakterisierung der Schafe ohne Umherspringen
  choice: aber nicht umhersprangen
  alternative: aber nicht übermütig umhersprangen
  rationale: Die schlichte Wiedergabe bewahrt die Bildsprache und den im vorangehenden Abschnitt erläuterten Unterschied, ohne eine zusätzliche moralische Deutung in σκιρτάω einzutragen.
- issue: Leiden unter dem strengen Hirten
  choice: weil er sie schlug
  alternative: während sie von ihm geschunden wurden
  rationale: Die direkte Ursache und der handelnde Hirte bleiben sichtbar; eine Deutung der Züchtigung als endgültige Verdammnis wird nicht in den Text hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die eckigen Klammern des griechischen Editionstextes bleiben erhalten und kennzeichnen die textkritisch unsichere beziehungsweise ergänzte Passage; der Fußnotenmarker steht im Haupttext.
