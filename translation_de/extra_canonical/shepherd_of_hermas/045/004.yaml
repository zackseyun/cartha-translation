base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: de
  text: Wenn jemand sehr viele Tonkrüge mit gutem Wein füllt und einige dieser Krüge leer sind, geht er zu den Krügen und prüft nicht die vollen – denn er weiß, dass sie voll sind –, sondern die leeren, weil er fürchtet, sie könnten sauer geworden sein. Denn leere Tonkrüge werden schnell sauer, und der Genuss des Weines geht verloren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: Tonkrüge
  rationale: Das Wort bezeichnet hier irdene Vorratsgefäße; „Tonkrüge“ ist anschaulich und im Deutschen natürlich.
- source_word: ἀπόκενα
  choice: leer / die leeren
  rationale: Der Gegensatz zu πλήρη („voll“) verlangt hier die schlichte Wiedergabe „leer“.
- source_word: κατανοεῖ
  choice: prüft
  rationale: Im Kontext des Weinlagerns ist nicht bloßes Betrachten, sondern prüfendes Beachten gemeint.
- source_word: ὤξισαν / ὀξίζουσι
  choice: sauer geworden sein / werden schnell sauer
  rationale: Die Formulierung bewahrt das konkrete Bild des Säuerlichwerdens, ohne eine bestimmte technische Ursache einzutragen.
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: der Wohlgeschmack des Weines
  rationale: Gemeint ist die angenehme Qualität beziehungsweise der Genuss des Weines; „Wohlgeschmack“ passt zum konkreten Bild und zum würdigen Register.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die Wiederholung von „Krüge“ sowie der Gegensatz zwischen vollen und leeren Gefäßen bleiben erhalten, weil sie für die anschließende geistliche Deutung wesentlich sind.
