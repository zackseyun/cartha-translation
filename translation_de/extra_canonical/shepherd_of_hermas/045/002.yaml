base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: de
  text: »Der Mensch«, sage ich, »ist zwar bereit, die Gebote Gottes zu halten, Herr, und es gibt niemanden, der den Herrn nicht darum bittet, in seinen Geboten gestärkt zu werden und sich ihnen unterzuordnen. Aber der Teufel ist unerbittlich und übt Gewalt über sie aus.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόθυμος
  choice: bereit
  rationale: Bezeichnet willige, ernsthafte Bereitschaft; »bereit« gibt dies in natürlichem modernem Deutsch wieder, ohne den Grad des Eifers zu überzeichnen.
- source_word: φυλάσσειν
  choice: zu halten
  rationale: Bei Geboten bedeutet das Verb, sie zu beachten und zu befolgen; »Gebote halten« ist zugleich verständlich und traditionsnah.
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: in seinen Geboten gestärkt zu werden
  rationale: Die räumlich-instrumentale Offenheit von ἐν bleibt erhalten; eine stärker deutende Wiedergabe wie »Kraft zu bekommen, sie zu halten« würde den Ausdruck verengen.
- source_word: ὑποταγῇ αὐταῖς
  choice: sich ihnen unterzuordnen
  rationale: Bewahrt die passive bzw. reflexive Unterordnung unter die Gebote und glättet sie nicht zu bloßem Gehorsam.
- source_word: σκληρός
  choice: unerbittlich
  rationale: Im Zusammenhang beschreibt das Wort die harte, unnachgiebige Gegnerschaft des Teufels; »unerbittlich« klingt im Deutschen natürlicher als das wörtliche »hart«.
- source_word: καταδυναστεύει
  choice: übt Gewalt über sie aus
  rationale: Gibt die gewaltsame, bedrückende Machtausübung wieder, ohne mit »tyrannisiert« einen unnötig modernen politischen Beiklang aufzudrängen.
theological_decisions:
- issue: Menschliche Bereitschaft und göttliche Befähigung
  choice: 'Beides bleibt nebeneinander stehen: Der Mensch ist bereit, bittet aber darum, gestärkt zu werden.'
  alternative: Die Bereitschaft als bereits von Gott gewirkt oder als völlig unzureichend ausdrücklich erklären.
  rationale: Der griechische Text formuliert die Spannung, ohne ihre dogmatische Beziehung näher zu bestimmen; die Übersetzung fügt daher keine konfessionelle Deutung hinzu.
- issue: Bezug von αὐτῶν in καταδυναστεύει αὐτῶν
  choice: Mit dem Pronomen »sie« wiedergegeben.
  alternative: Explizit »die Menschen« oder »die Diener Gottes« schreiben.
  rationale: Das griechische Pronomen lässt den Bezug im unmittelbaren Satz etwas offen; die pronominale Wiedergabe bewahrt diese Unbestimmtheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die Anrede »Herr« bleibt an ihrer griechischen Position; der Kontrast μὲν … ἀλλά wird mit »zwar … aber« sichtbar gemacht.
