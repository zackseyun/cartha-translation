  source_fidelity: 'Der Entwurf gibt den griechischen Abschnitt insgesamt zuverlässig wieder: ἐκπειράζων wird offen als prüfendes Handeln gefasst, der Gegensatz zwischen Glaubensfülle und Leere bleibt erhalten, und ὑπόδουλοι wird zu Recht nicht abgeschwächt. Die Satzfolge und die Aussage, dass der Teufel bei den Glaubensvollen keinen Zugang findet, entsprechen dem Ausgangstext und dem englischen Audit Trail.'
  naturalness: »im Glauben erfüllt« ist im modernen Standarddeutsch missverständlich und wenig idiomatisch; es kann bedeuten, dass jemand durch Glauben erfüllt oder vollendet wird, statt dass er mit Glauben erfüllt ist. »mit Glauben erfüllt« bewahrt die Gefäßmetapher und ist klarer. »standhaft widerstehen« gibt ἰσχυρῶς natürlich wieder.
  terminology: »Teufel«, »Diener Gottes«, »Glauben« und »Sklaven« sind angemessen. »Sklaven« gibt die starke Unterordnung in ὑπόδουλοι präzise wieder. Keine Fußnoten sind erforderlich.
