revisions:
- from: So kommt auch der Teufel zu allen Dienern Gottes und stellt sie auf die Probe. Alle nun, die im Glauben erfüllt sind, widerstehen ihm mit aller Kraft; und er weicht von ihnen, weil er keinen Ort findet, an dem er eindringen könnte. Dann kommt er zu denen, die leer sind. Weil er dort Raum findet, dringt er in sie ein, tut in ihnen, was er will, und sie werden ihm zu Sklaven.
  to: So kommt auch der Teufel zu allen Dienern Gottes und stellt sie auf die Probe. Alle nun, die mit Glauben erfüllt sind, widerstehen ihm standhaft; und er weicht von ihnen, weil er keinen Ort findet, an dem er eindringen könnte. Dann kommt er zu denen, die leer sind. Weil er dort Raum findet, dringt er in sie ein, tut in ihnen, was er will, und sie werden ihm zu Sklaven.
  rationale: Die Revision beschränkt sich auf zwei stilistisch-semantische Präzisierungen. »Mit Glauben erfüllt« macht die vom griechischen Gefäßbild getragene Fülle ausdrücklich und verständlich; »standhaft« gibt das Adverb ἰσχυρῶς natürlich wieder. Sinn, Metaphorik und die ungemilderte Aussage über die Versklavung bleiben erhalten.
