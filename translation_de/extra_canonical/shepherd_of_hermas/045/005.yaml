base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the servants of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: de
  text: So kommt auch der Teufel zu allen Dienern Gottes und stellt sie auf die Probe. Alle nun, die mit Glauben erfüllt sind, widerstehen ihm standhaft; und er weicht von ihnen, weil er keinen Ort findet, an dem er eindringen könnte. Dann kommt er zu denen, die leer sind. Weil er dort Raum findet, dringt er in sie ein, tut in ihnen, was er will, und sie werden ihm zu Sklaven.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: stellt sie auf die Probe
  rationale: Gibt das prüfende bzw. versuchende Vorgehen wieder, ohne die im Griechischen vorhandene Spannweite unnötig auf moralische Verführung zu verengen.
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: im Glauben erfüllt
  rationale: Bewahrt das Gefäßbild des Zusammenhangs und gibt zugleich die ungewöhnliche griechische Fügung verständlich wieder.
- source_word: ἀποκένους
  choice: die leer sind
  rationale: Erhält den bewussten Gegensatz zu den im Glauben Erfüllten und den Rückbezug auf die zuvor genannten teilweise leeren Gefäße.
- source_word: τόπον
  choice: Ort / Raum
  rationale: Im ersten Satz bezeichnet »Ort« die fehlende Eintrittsmöglichkeit; im zweiten macht »Raum« idiomatisch deutlich, dass der Teufel eine Ansatzstelle findet.
- source_word: ὑπόδουλοι
  choice: zu Sklaven
  rationale: Gibt die starke Aussage vollständiger Unterwerfung wieder und schwächt sie nicht zu bloßer Abhängigkeit oder Dienstbarkeit ab.
theological_decisions:
- issue: Art und Reichweite des teuflischen Prüfens
  choice: »stellt sie auf die Probe«
  alternative: »versucht sie«
  rationale: Die Übersetzung lässt offen, ob Prüfung, Erprobung oder Verführung im Vordergrund steht, und vermeidet eine vorschnelle dogmatische Festlegung.
- issue: Bedingung des Widerstands gegen den Teufel
  choice: »die im Glauben erfüllt sind«
  alternative: »die einen vollen Glauben haben«
  rationale: Bewahrt die Bildsprache von Fülle und Leere, durch die der Text die Widerstandskraft beschreibt, ohne daraus eine systematische Lehre über Sündlosigkeit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Gefäßmetaphorik des vorausgehenden Abschnitts bleibt durch »erfüllt«, »leer« und »Raum« erkennbar; die drastische Schlussaussage wird nicht abgeschwächt.
