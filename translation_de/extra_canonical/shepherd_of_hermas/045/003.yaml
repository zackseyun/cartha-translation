  source_fidelity: 'Der deutsche Text gibt den im englischen Audit-Trail enthaltenen griechischen Abschnitt zuverlässig wieder: καταδυναστεύειν ist angemessen als „unter seine Gewalt bringen“ gefasst; das Gegensatzpaar ἀντιπαλαῖσαι/καταπαλαῖσαι bleibt mit „ringen/niederringen“ erkennbar; νικηθείς und κατῃσχυμμένος sind zutreffend durch „besiegt und beschämt“ wiedergegeben. Die Qualifikation der Diener Gottes als derer, die von ganzem Herzen auf ihn hoffen, bleibt erhalten. „Als hätte er Macht“ gibt ὡς δύναμιν ἔχοντα idiomatisch und ohne Überinterpretation wieder.'
