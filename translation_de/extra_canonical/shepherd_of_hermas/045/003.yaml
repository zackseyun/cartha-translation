base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the servants of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: de
  text: „Er kann“, sagt er, „die Diener Gottes nicht unter seine Gewalt bringen, wenn sie von ganzem Herzen auf ihn hoffen. Der Teufel kann mit ihnen ringen, aber er kann sie nicht niederringen. Wenn ihr ihm also widersteht, wird er besiegt und beschämt vor euch fliehen. Die aber leer sind[a]“, sagt er, „fürchten den Teufel, als hätte er Macht.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: innerlich nicht mit Glauben erfüllt; das Bild der Leere wird im folgenden Vergleich mit Weingefäßen weitergeführt.'
    reason: Die wörtliche Bezeichnung „leer“ ist im Deutschen ohne den anschließenden Bildzusammenhang leicht missverständlich.
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: unter seine Gewalt bringen
  rationale: Gibt die gewaltsame Beherrschung wieder, ohne die Aussage unnötig auf politische Tyrannei einzuengen.
- source_word: ἐλπιζόντων ἐπ᾽ αὐτόν
  choice: auf ihn hoffen
  rationale: Bewahrt sowohl die Grundbedeutung von ἐλπίζω als auch den pronominalen Bezug des griechischen Textes.
- source_word: ἀντιπαλαῖσαι … καταπαλαῖσαι
  choice: mit ihnen ringen … sie niederringen
  rationale: Erhält das griechische Wortspiel aus dem Bild eines Ringkampfs und unterscheidet Angriff von endgültiger Überwältigung.
- source_word: ἀπόκενοι
  choice: leer
  rationale: Bewahrt das Leitbild der inneren Leere, das im unmittelbar folgenden Gleichnis von nur teilweise gefüllten Gefäßen entfaltet wird.
- source_word: κατῃσχυμμένος
  choice: beschämt
  rationale: Entspricht dem Zustand der Schande beziehungsweise Beschämung nach der Niederlage.
theological_decisions:
- issue: Reichweite der Macht des Teufels
  choice: „kann … nicht“ und „als hätte er Macht“
  alternative: Die Aussagen abzuschwächen, etwa zu „kann nur schwer“ oder „als wäre er allmächtig“
  rationale: Der Text bestreitet in diesem Zusammenhang ausdrücklich, dass der Teufel Gottes ganzherzige Diener überwältigen kann; er bestreitet jedoch nicht jede Art von Angriff, wie das Bild des Ringens zeigt.
- issue: Bezugswort von αὐτόν in „auf ihn hoffen“
  choice: Pronomen „ihn“ beibehalten
  alternative: Explizit „auf Gott“ oder „auf den Herrn“
  rationale: Das griechische Pronomen kann aus dem Kontext auf Gott beziehungsweise den Herrn bezogen werden; die Übersetzung vermeidet eine unnötige Festlegung der Formulierung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und die knappe Argumentation bleiben erhalten; das Ringkampf-Wortspiel wird durch „ringen/niederringen“ hörbar gemacht.
