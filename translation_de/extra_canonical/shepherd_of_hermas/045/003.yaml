  terminology: „Diener Gottes“, „Teufel“, „hoffen“, „ringen“ und „niederringen“ sind terminologisch stimmig. Die Fußnote zu „leer“ erläutert das im folgenden Vergleich entfaltete Bild behutsam und legt keine konfessionelle Deutung nahe.
