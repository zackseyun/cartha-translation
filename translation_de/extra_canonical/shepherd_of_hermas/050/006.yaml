base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the servant [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his servant on account of his deed. Summoning again his friends and his son, the master announced to them the deed the servant had done with his portions which he had received; and they approved all the more that the servant should become co-heir with his son."'
translation:
  language: de
  text: Nach einiger Zeit kam der Herr des Knechtes und des Feldes[a] und ging in den Weinberg. Als er sah, dass der Weinberg schön eingezäunt und auch umgegraben war und dass alle[b] Unkräuter ausgerissen waren, freute er sich sehr über seinen Knecht und über das, was dieser getan hatte. Darauf rief der Herr erneut seine Freunde und seinen Sohn zusammen und berichtete ihnen, was der Knecht mit den Speisen getan hatte, die er erhalten hatte. Da stimmten sie erst recht dafür, dass der Knecht zusammen mit seinem Sohn Miterbe werden sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und des Feldes“ fehlen in einigen Textzeugen.
    reason: Kennzeichnet die im griechischen Editionstext eingeklammerte textkritische Variante καὶ τοῦ ἀγροῦ.
  - marker: b
    text: Das Wort „alle“ fehlt in einigen Textzeugen.
    reason: Kennzeichnet die im griechischen Editionstext eingeklammerte textkritische Variante πάσας.
lexical_decisions:
- source_word: δεσπότης
  choice: Herr
  rationale: Bezeichnet hier den verfügungsberechtigten Herrn des Knechtes und des Besitzes; „Herr“ ist im Deutschen würdig und kontextgerecht, ohne die Härte von „Gebieter“.
- source_word: δοῦλος
  choice: Knecht
  rationale: Bewahrt das antike Abhängigkeitsverhältnis deutlicher als „Diener“, klingt in einer Gleichniserzählung jedoch natürlich.
- source_word: κεχαρακωμένον
  choice: eingezäunt
  rationale: Das Verb bezeichnet die Sicherung durch eine Umfriedung beziehungsweise einen Zaun; „eingezäunt“ gibt das konkrete Bild verständlich wieder.
- source_word: βοτάνας
  choice: Unkräuter
  rationale: Im Weinbergskontext sind unerwünschte, die Reben bedrängende Pflanzen gemeint; „Unkräuter“ ist idiomatisch und entspricht dem vorangehenden Bild.
- source_word: ἐδέσμασιν
  choice: Speisen
  rationale: Bezeichnet die dem Knecht zugeteilten Nahrungsmittel. „Speisen“ lässt offen, ob einzelne Rationen oder Lebensmittel allgemein gemeint sind.
- source_word: συγκληρονόμον
  choice: Miterbe
  rationale: Gibt die gemeinsame Erbenstellung präzise wieder; die anschließende Wendung „zusammen mit seinem Sohn“ bewahrt den Bezug zu τῷ υἱῷ αὐτοῦ.
theological_decisions:
- issue: Stellung des Knechtes als συγκληρονόμος
  choice: „dass der Knecht zusammen mit seinem Sohn Miterbe werden sollte“
  alternative: „dass der Knecht Miterbe seines Sohnes werden sollte“
  rationale: Die gewählte Formulierung bewahrt die Aussage einer gemeinsamen Erbschaft, ohne über Umfang, Rang oder theologische Bedeutung dieser Erbenstellung hinauszugehen.
- issue: Bezug von αὐτοῦ in „mit seinen Speisen“
  choice: „mit den Speisen …, die er erhalten hatte“
  alternative: „mit den Speisen seines Herrn, die er erhalten hatte“
  rationale: Der griechische Bezug ist knapp und kann als die dem Knecht zugeteilten Speisen verstanden werden. Die Übersetzung vermeidet eine unnötige Festlegung des Besitzbezugs und hält den Schwerpunkt auf seinem Umgang mit dem Empfangenen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit klarer Gleichnis-Terminologie. Die Satzstruktur wurde für heutiges Deutsch gegliedert, während Wiederholungen wie „Herr“, „Knecht“ und „getan“ den sachlichen Stil des griechischen Textes bewahren. Die textkritisch unsicheren Wörter stehen im Haupttext und sind durch Fußnoten markiert.
