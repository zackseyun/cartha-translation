base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the servant took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: de
  text: 'Er sagt zu mir: „Ich sage dir: Das ist nicht das Fasten, das ihr, wie ihr meint, für den Herrn vollzieht. Höre ein Gleichnis: Ein Weinberg ohne Unkraut wird mehr Frucht bringen, weil kein Unkraut ihn erstickt. Da nahm der Knecht [sein Werkzeug], grub den Weinberg um und riss alles Unkraut aus, das darin wuchs. So wurde jener Weinberg überaus ansehnlich und gedieh prächtig, denn es gab kein Unkraut, das ihn erstickte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: sein Werkzeug
    text: Im griechischen Text steht nur „nahm“ (λαβών); ein Gegenstand ist nicht ausdrücklich überliefert. Die Ergänzung bezeichnet lediglich das zum Umgraben vorausgesetzte Werkzeug.
    reason: Kennzeichnet die textlich nicht ausdrücklich genannte, für die deutsche Satzbildung ergänzte Angabe und entspricht der Klammerung im englischen Audittext.
lexical_decisions:
- source_word: νηστεία
  choice: Fasten
  rationale: Die übliche und kontextuell eindeutige Wiedergabe des religiösen Fastens.
- source_word: βοτάνας
  choice: Unkraut
  rationale: Im Bild vom Weinberg sind unerwünschte Pflanzen gemeint, die das Wachstum und den Ertrag beeinträchtigen; „Kräuter“ wäre im Deutschen missverständlich.
- source_word: λαβὼν ἔσκαψε
  choice: machte sich … an die Arbeit und grub … um
  rationale: λαβών steht hier ohne ausdrückliches Objekt; die Formulierung gibt den Beginn der Tätigkeit wieder, ohne ein im Griechischen nicht genanntes Werkzeug einzuführen.
- source_word: εὐπρεπέστατος καὶ εὐθαλής
  choice: überaus ansehnlich und gedieh prächtig
  rationale: Bewahrt sowohl den Eindruck eines wohlgeordneten, schönen Weinbergs als auch dessen kräftiges Gedeihen in natürlichem Deutsch.
theological_decisions:
- issue: Richtung des Fastens in νηστεύειν τῷ Κυρίῳ
  choice: für den Herrn fasten
  alternative: dem Herrn fasten
  rationale: „Für den Herrn“ ist modernes, verständliches Deutsch und bewahrt die Ausrichtung des Fastens auf den Herrn, ohne die Aussage näher dogmatisch zu bestimmen.
- issue: Wechsel zwischen Singular und Plural
  choice: „Ich sage dir“ und anschließend „ihr meint, ihr fastet“
  alternative: durchgehend Singular
  rationale: Der griechische Text spricht Hermas zunächst im Singular an, verwendet für die verbreitete Fastenpraxis aber den Plural; dieser Wechsel bleibt erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Das Gleichnis bleibt bildhaft und direkt; unnötige Ergänzungen, insbesondere ein nicht ausdrücklich genanntes Werkzeug, wurden vermieden.
