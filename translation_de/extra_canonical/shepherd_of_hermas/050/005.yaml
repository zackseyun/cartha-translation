  terminology: „Fasten“, „Unkraut“, „Weinberg“, „Knecht“ sowie „ansehnlich und gedieh prächtig“ sind im gegebenen Gleichniskontext angemessen. „Für den Herrn“ folgt dem im vorangehenden unmittelbaren Kontext stehenden τῷ Κυρίῳ und dem englischen Audit, ohne eine dogmatische Deutung einzutragen.
