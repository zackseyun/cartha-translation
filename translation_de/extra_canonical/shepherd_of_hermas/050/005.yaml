  to: 'Er sagt zu mir: „Ich sage dir: Das ist nicht das Fasten, das ihr, wie ihr meint, für den Herrn vollzieht. Höre ein Gleichnis: Ein Weinberg ohne Unkraut wird mehr Frucht bringen, weil kein Unkraut ihn erstickt. Da nahm der Knecht [sein Werkzeug], grub den Weinberg um und riss alles Unkraut aus, das darin wuchs. So wurde jener Weinberg überaus ansehnlich und gedieh prächtig, denn es gab kein Unkraut, das ihn erstickte.“'
