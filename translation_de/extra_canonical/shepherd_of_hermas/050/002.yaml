base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: de
  text: '„Was“, fragt er, „ist eine Statio[a]?“ – „Ich faste, Herr“, antworte ich. Er fragt: „Und was ist dieses Fasten, das ihr fastet?[b]“ – „Ich faste so, Herr, wie ich es gewohnt bin“, antworte ich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Statio: ein aus dem Lateinischen übernommener Ausdruck für eine festgesetzte Fastenübung oder einen Fastentag.'
    reason: Der historische Fachausdruck ist ohne Erklärung für heutige Leserinnen und Leser nicht ohne Weiteres verständlich.
  - marker: b
    text: Die gesamte Relativklausel „das ihr fastet“ (griechisch ἣν νηστεύετε) fehlt in einigen Textzeugen.
    reason: Die griechische Edition kennzeichnet die Relativklausel als textlich unsicher; sie wird im Haupttext wiedergegeben und die Überlieferungsvariante wird kenntlich gemacht.
lexical_decisions:
- source_word: στατίων
  choice: Statio
  rationale: Der griechisch transkribierte lateinische Fachausdruck bezeichnet hier eine festgesetzte Fastenübung bzw. einen Fastentag. Die Beibehaltung wahrt den historischen Begriff und erklärt zugleich die anschließende Nachfrage.
- source_word: νηστεύω / νηστεία
  choice: fasten / Fasten
  rationale: Die gewöhnlichen deutschen Entsprechungen geben sowohl die Handlung als auch die religiöse Übung klar und ohne konfessionelle Einengung wieder.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird formal und würdig wiedergegeben; „Herr“ lässt die im Kontext bestehende Rollenbeziehung offen.
- source_word: ὡς εἰώθειν … οὕτω
  choice: so … wie ich es gewohnt bin
  rationale: Natürliches modernes Deutsch für die gewohnheitsmäßige Praxis, ohne den Sinn näher zu bestimmen.
theological_decisions:
- issue: Bedeutung der Fastenpraxis
  choice: Die Art des Fastens bleibt in diesem Vers unbestimmt.
  alternative: Das Fasten bereits als bestimmte kirchliche oder asketische Ordnung auslegen.
  rationale: Der Sprecher verweist nur auf seine Gewohnheit; die Bewertung und nähere Erklärung folgen erst im weiteren Zusammenhang.
- issue: Numerus in ἣν νηστεύετε
  choice: „das ihr haltet“
  alternative: „das du hältst“
  rationale: Der griechische Text verwendet den Plural und weitet die Frage offenbar über den einzelnen Sprecher hinaus aus; diese Spannung wird bewahrt.
translation_notes:
  register: Moderne, würdige Dialogsprache. Der seltene historische Begriff „Statio“ bleibt bewusst stehen und wird in einer Fußnote erklärt. „antwortet“ variiert das wiederholte griechische „sage ich“ leicht idiomatisch, ohne den Gesprächsablauf zu verändern.
