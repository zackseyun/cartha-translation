  text: '"Have you come?" I say, "Because, sir, I am keeping a station."'
translation:
  language: de
  text: „Bist du gekommen?“ – „Weil ich, Herr, einen Stationstag[a] halte“, sagte ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Station“. Gemeint ist ein festgelegter Tag religiöser Observanz, hier ein Fasttag.'
    reason: Der historische Fachbegriff στατίων ist heutigen Leserinnen und Lesern ohne Erläuterung nicht unmittelbar verständlich.
lexical_decisions:
- source_word: στατίωνα
  choice: Stationstag
  rationale: Das griechische Lehnwort bezeichnet hier einen festgelegten Tag religiöser Observanz, insbesondere des Fastens. „Stationstag“ bewahrt den historischen Fachbegriff; die Fußnote erläutert ihn.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird in natürlichem, würdigem Deutsch mit „Herr“ wiedergegeben.
- source_word: ἔχω
  choice: halte
  rationale: Bei einem religiösen Observanztag ist „einen Stationstag halten“ idiomatischer als das wörtliche „haben“.
theological_decisions:
- issue: Art der religiösen Observanz bei στατίων
  choice: Der Haupttext verwendet den historischen Ausdruck „Stationstag“ und erläutert dessen Fastenbezug in einer Fußnote.
  alternative: Direkt „Fasttag“ übersetzen.
  rationale: Der folgende Dialog erklärt erst ausdrücklich, dass Hermas damit fastet. Die gewählte Fassung nimmt diese Erklärung nicht vollständig vorweg und bewahrt den besonderen Terminus.
- issue: Form der Eingangsfrage
  choice: „Warum bist du gekommen?“
  alternative: „Bist du gekommen?“
  rationale: Die Antwort mit ὅτι („weil“) setzt eine Warum-Frage voraus. Der überlieferte Ausschnitt beginnt offenbar innerhalb einer bereits laufenden Frage; die sinngemäße Ergänzung stellt den erkennbaren Zusammenhang her, ohne eine theologische Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der historische Fachbegriff bleibt erhalten, wird aber knapp erklärt.
