  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/003.yaml
  text: He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."
translation:
  language: de
  text: 'Er sagt: „Ihr wisst nicht, wie man für den Herrn fastet; auch ist dieses nutzlose Fasten, das ihr für ihn haltet, kein Fasten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: für den Herrn fastet
  rationale: Der Dativ bezeichnet hier am natürlichsten die Ausrichtung des Fastens auf den Herrn; „für“ bewahrt diese Beziehung in idiomatischem Deutsch.
- source_word: ἀνωφελής
  choice: nutzlos
  rationale: Gibt die ausdrückliche negative Wertung des Fastens direkt und ohne konfessionelle Deutung wieder.
- source_word: ἣν νηστεύετε αὐτῷ
  choice: das ihr für ihn haltet
  rationale: Im Deutschen wird ein Fasten gewöhnlich „gehalten“. „Für ihn“ bildet den Dativ αὐτῷ ab und vermeidet die schwerfällige Wiederholung „fastet“.
theological_decisions:
- issue: Verhältnis zwischen äußerem Fasten und Fasten für den Herrn
  choice: „kein wirkliches Fasten“
  alternative: „kein Fasten“
  rationale: Der griechische Satz bestreitet nicht zwingend jede äußere Nahrungskarenz, sondern ihre Geltung als Fasten für den Herrn. „Wirkliches“ macht diesen pragmatischen Gegensatz verständlich, ohne eine bestimmte Fastenlehre einzuführen.
translation_notes:
  register: Direkte, würdige und gut verständliche Rede. Die Anrede wechselt dem griechischen Text entsprechend zur Mehrzahl „ihr“. Keine Fußnoten erforderlich.
