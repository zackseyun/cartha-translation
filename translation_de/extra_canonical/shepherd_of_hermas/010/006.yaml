base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: de
  text: 6. Alle Steine, die aus der Tiefe heraufgezogen wurden, setzten sie so, wie sie waren, in den Bau ein. Denn sie waren passend zugerichtet und fügten sich genau mit den anderen Steinen zusammen. So schlossen sie sich miteinander zusammen, sodass ihre Fugen nicht sichtbar waren. Der Bau des Turms wirkte, als wäre er aus einem einzigen Stein erbaut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυθός
  choice: Tiefe
  rationale: Gibt den unbestimmten tiefen Ort des griechischen Textes wieder, ohne ihn enger als Meer oder Abgrund festzulegen.
- source_word: ἡρμοσμένοι
  choice: passend geformt
  rationale: Bezeichnet den bereits vorhandenen Zustand der Steine, durch den sie ohne weitere Bearbeitung eingesetzt werden können.
- source_word: ἁρμογή
  choice: Nahtstelle / Fugen
  rationale: Das griechische Wort bezeichnet sowohl das Zusammenpassen als auch die Verbindungsstelle; die kontextgerechten deutschen Ausdrücke vermeiden eine schwerfällige Wiederholung.
- source_word: ἐκολλῶντο
  choice: wurden ... miteinander verbunden
  rationale: Bewahrt den passiven Sinn des engen Zusammenfügens, ohne modernen Klebstoffgebrauch nahezulegen.
- source_word: ἐφαίνετο
  choice: wirkte
  rationale: Gibt den visuellen Eindruck wieder, ohne zu behaupten, der Turm habe tatsächlich aus nur einem Stein bestanden.
