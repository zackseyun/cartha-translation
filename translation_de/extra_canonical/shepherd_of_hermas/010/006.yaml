  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die aus der Tiefe heraufgezogenen Steine, ihr unverändertes Einsetzen, ihr passgenaues Zusammenfügen, die unsichtbaren Fugen und den Eindruck eines aus einem einzigen Stein errichteten Turms. „Tiefe“ bewahrt die Offenheit von βυθός. Die englische POB-Fassung wird inhaltlich ebenfalls zuverlässig getroffen.'
  naturalness: Die Formulierung „fügten sich an der Nahtstelle genau zu den anderen Steinen“ ist im Deutschen unidiomatisch; zudem wirkt der Wechsel von „Nahtstelle“ zu „Fugen“ unnötig technisch und inkonsistent. „So wurden sie miteinander verbunden, dass“ benötigt außerdem die Folgekonstruktion „sodass“ oder eine Umformulierung.
  terminology: „Bau“ und „Turm“ sind angemessen. Für ἡρμοσμένοι ist „passend zugerichtet“ im Baukontext idiomatischer als „passend geformt“ und wahrt, dass die Steine bereits geeignet waren. „Fugen“ gibt ἁρμογή in diesem Kontext natürlich und präzise wieder.
