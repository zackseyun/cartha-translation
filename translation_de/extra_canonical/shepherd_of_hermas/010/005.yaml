  to: 5. Der Turm wurde von den sechs jungen Männern, die mit ihr gekommen waren, mit quadratischem Grundriss gebaut. Unzählige andere Männer brachten Steine herbei, die einen aus der Tiefe, die anderen von der Erde, und reichten sie den sechs jungen Männern. Diese nahmen sie entgegen und bauten damit den Turm.
