base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: de
  text: 5. Der Turm wurde von den sechs jungen Männern, die mit ihr gekommen waren, mit quadratischem Grundriss gebaut. Unzählige andere Männer brachten Steine herbei, die einen aus der Tiefe, die anderen von der Erde, und reichten sie den sechs jungen Männern. Diese nahmen sie entgegen und bauten damit den Turm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τετραγώνῳ
  choice: viereckig
  rationale: Gibt die Formangabe natürlich wieder, ohne über das im Griechischen Gesagte hinaus ausdrücklich einen quadratischen Grundriss zu postulieren.
- source_word: μυριάδες
  choice: viele Tausende
  rationale: Bewahrt die Vorstellung einer unübersehbar großen Menge; das griechische Wort kann wörtlich Zehntausende oder allgemeiner zahllose Mengen bezeichnen.
- source_word: ἐκ τοῦ βυθοῦ
  choice: aus der Tiefe
  rationale: Erhält die räumliche und möglicherweise symbolische Offenheit von βυθός, statt vorschnell »Meeresgrund« einzusetzen.
- source_word: ἐκ τῆς γῆς
  choice: vom Land
  rationale: Im Kontrast zur Tiefe bezeichnet γῆ hier das feste Land; diese Wiedergabe stimmt auch mit der späteren Formulierung ἀπὸ τῆς ξηρᾶς überein.
- source_word: ἐπεδίδουν
  choice: reichten sie
  rationale: Drückt die fortlaufende Übergabe der Steine an die sechs Bauleute idiomatisch aus.
- source_word: ᾠκοδόμουν
  choice: bauten damit weiter
  rationale: Macht im Deutschen deutlich, dass die entgegengenommenen Steine beim fortlaufenden Turmbau verwendet wurden.
