  source_fidelity: Die räumliche Anordnung, die Handlungen, die direkte Rede und die Bildsprache entsprechen dem griechischen Text genau. Das unsichere eingeklammerte Σὺ wird zu Recht nicht als eigenständiges deutsches Wort behandelt; die Aufforderung bleibt dennoch nachdrücklich. Bei καθίζει με bezeichnet der griechische Text jedoch ein tatsächliches Setzen, nicht lediglich das Ermöglichen des Platznehmens.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Setzte mich links auf die Bank“ ist unmittelbarer und idiomatischer als „ließ mich links auf der Bank Platz nehmen“ und gibt die Handlung präziser wieder.
  terminology: „Herrin“ gibt Κυρία als respektvolle Anrede angemessen wieder, ohne die Figur zu deuten. „Bank“, „links/rechts“, „auf den Wassern“ und „quadratischen, glänzenden Steinen“ sind sachgerecht. „Leuchtenden Stab“ ist eine knappe, natürliche Wiedergabe von ῥάβδον ... λαμπράν.
