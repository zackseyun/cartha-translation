  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: de
  text: '4. Wieder ergriff sie meine Hand, richtete mich auf und setzte mich links auf die Bank; sie selbst setzte sich rechts. Dann hob sie einen leuchtenden Stab empor und sagte zu mir: »Siehst du etwas Großes?« Ich sagte zu ihr: »Herrin, ich sehe nichts.« Sie sagte zu mir: »Sieh doch! Siehst du nicht dir gegenüber einen großen Turm, der auf den Wassern aus quadratischen, glänzenden Steinen gebaut wird?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπλέσιον
  choice: Bank
  rationale: Das seltene Wort bezeichnet hier dem Zusammenhang nach eine Sitzbank beziehungsweise einen Sitzplatz; „Bank“ ist im Deutschen natürlich und entspricht der Szene.
- source_word: ἐξ εὐωνύμων / ἐκ δεξιῶν
  choice: links / rechts
  rationale: Die räumlichen Angaben werden knapp und direkt wiedergegeben.
- source_word: ῥάβδον τινα λαμπράν
  choice: einen hell glänzenden Stab
  rationale: λαμπρός beschreibt den Stab als hell beziehungsweise leuchtend; „hell glänzend“ bewahrt das visuelle Moment, ohne das Material näher zu bestimmen.
- source_word: μέγα πρᾶγμα
  choice: etwas Großes
  rationale: Die offene Formulierung des Griechischen bleibt erhalten und wird nicht vorzeitig ausdrücklich mit dem Turm gleichgesetzt.
- source_word: ἐπὶ ὑδάτων
  choice: auf den Wassern
  rationale: Der Plural des Griechischen wird bewahrt; die etwas feierliche Wendung passt zum visionären Bericht.
- source_word: λίθοις τετραγώνοις λαμπροῖς
  choice: aus quadratischen, glänzenden Steinen
  rationale: Die beiden sichtbaren Eigenschaften der Steine werden formal und verständlich wiedergegeben.
theological_decisions:
- issue: Anrede Κυρία
  choice: Herrin
  alternative: Meine Dame / Frau
  rationale: „Herrin“ wahrt die respektvolle Anrede und den erhöhten Ton, ohne die Gestalt theologisch näher festzulegen.
- issue: Textkritisch unsicheres Σὺ vor ἰδού
  choice: nicht eigens wiedergegeben; als nachdrückliches „Sieh doch!“ ausgedrückt
  alternative: „Du, sieh!“ oder Fußnotenmarkierung
  rationale: Das eingeklammerte Pronomen ist textkritisch unsicher und im Deutschen vor dem Imperativ unnatürlich. Die emphatische Wirkung wird durch „doch“ erhalten, ohne einen unsicheren Wortlaut sichtbar in den Haupttext einzutragen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer direkter Rede. Der Tempuswechsel des griechischen visionären Berichts wird zugunsten eines natürlichen deutschen Erzählflusses vereinheitlicht; die Verben der direkten Rede stehen dennoch lebendig und unmittelbar.
