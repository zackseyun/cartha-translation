base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/003.yaml
  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: de
  text: 3. Nachdem sie dies gesagt hatte, wollte sie fortgehen. Doch ich fiel ihr zu Füßen und bat sie beim Herrn, mir die Vision zu zeigen, die sie mir versprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἴπασα
  choice: Nachdem sie dies gesagt hatte
  rationale: Gibt das temporale Partizip natürlich und eng am griechischen Sinn wieder.
- source_word: ἀπελθεῖν
  choice: fortgehen
  rationale: Entspricht dem schlichten Bewegungsverb, ohne einen endgültigen Abschied anzudeuten.
- source_word: ἠρώτησα
  choice: bat
  rationale: Im Zusammenhang bezeichnet das Verb eine eindringliche Bitte, nicht bloß eine Frage.
- source_word: κατὰ τοῦ Κυρίου
  choice: beim Herrn
  rationale: Bewahrt die ungewöhnliche Schwur- bzw. Beschwörungsformel des Griechischen, ohne sie konfessionell auszudeuten.
- source_word: ἐπιδείξῃ
  choice: zu zeigen
  rationale: Gibt die erbetene sichtbare Vorführung der Vision idiomatisch wieder.
- source_word: ὅραμα
  choice: Vision
  rationale: Bezeichnet hier eine offenbarende Schau; „Vision“ ist im modernen Deutschen klar und würdig.
theological_decisions:
- issue: Bedeutung von κατὰ τοῦ Κυρίου
  choice: beim Herrn
  alternative: im Namen des Herrn / um des Herrn willen
  rationale: Die Wendung hat hier wahrscheinlich beschwörenden oder schwurartigen Charakter. „Beim Herrn“ erhält diese Spannung, ohne die Formel zu erklären oder abzuschwächen.
translation_notes:
  register: Moderner, würdiger Erzählstil. Der Satzbau wurde für heutiges Deutsch leicht gegliedert, während Ablauf, Nachdruck und theologisch relevante Formulierungen des griechischen Textes erhalten bleiben.
