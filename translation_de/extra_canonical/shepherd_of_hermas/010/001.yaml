- from: '1. »Was«, fragte ich, »haben sie ertragen?« Sie sagte: »Höre: Geißelhiebe, Gefangenschaft, schwere Bedrängnisse, Kreuzigungen und wilde Tiere – um des Namens willen.[a] Darum gehören ihnen die Plätze auf der rechten Seite des Heiligtums, ebenso jedem, der um des Namens willen leidet; den Übrigen aber gehören die Plätze auf der linken Seite. Doch beide – die rechts und die links sitzen – empfangen dieselben Gaben und dieselben Verheißungen. Nur sitzen jene auf der rechten Seite und besitzen eine besondere Herrlichkeit.«'
  to: '1. »Was«, fragte ich, »haben sie ertragen?« Sie sagte: »Höre zu: Geißelungen, Gefängnisse, schwere Bedrängnisse, Kreuze und wilde Tiere – um des Namens willen. Darum gehören ihnen die rechten Bereiche des Heiligtums, ebenso jedem, der um des Namens willen leidet; den Übrigen aber gehören die linken Bereiche. Doch beide – die rechts und die links sitzen – empfangen dieselben Gaben und dieselben Verheißungen. Nur sitzen jene rechts und haben eine gewisse Herrlichkeit.«'
