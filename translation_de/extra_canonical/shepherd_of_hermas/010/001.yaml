    issue: „Kreuzigungen“ für σταυρούς
    rationale: σταυρούς bedeutet wörtlich „Kreuze“. Im Kontext kann dies Kreuzesstrafen einschließen, doch der griechische Wortlaut benennt dies nicht ausdrücklich; „Kreuzigungen“ legt die Aussage stärker fest.
  - severity: medium
    issue: „eine besondere Herrlichkeit“ für δόξαν τινά
    rationale: τινά bedeutet „eine gewisse“, „irgendeine“ oder „etwas an“; „besondere“ kann eine qualitative Auszeichnung behaupten, die der Text nicht näher bestimmt.
  - severity: low
    issue: „Plätze“ für μέρη
    rationale: μέρη bezeichnet „Teile/Bereiche“. „Plätze“ ist möglich, aber stärker konkretisierend als der räumlich-bildhafte griechische Ausdruck.
