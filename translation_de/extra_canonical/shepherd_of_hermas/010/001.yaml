    rationale: Der Bezug liegt im frühchristlichen Kontext nahe, wird im Satz jedoch nicht genannt. Die Fußnote ergänzt den Referenten stärker, als der Wortlaut es tut; die knappe Formel sollte ohne diese dogmatisch nicht erforderliche Festlegung stehen bleiben.
