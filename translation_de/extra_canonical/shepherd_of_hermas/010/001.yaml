  naturalness: Die direkte Rede ist klar und würdig. „Bereiche“ gibt die räumlichen μέρη natürlicher und näher wieder als die interpretierende Ergänzung „Plätze“. Die plurale Leidensaufzählung wird im Deutschen besser mit „Geißelungen, Gefängnisse“ abgebildet.
  terminology: „Heiligtum“, „der Name“, „Gaben“ und „Verheißungen“ sind sachgerecht. Eine Fußnote, die den nicht ausgesprochenen „Namen“ ausdrücklich als Jesus Christus identifiziert, geht über den Wortlaut hinaus und sollte entfallen.
