base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: de
  text: '1. »Was«, fragte ich, »haben sie ertragen?« Sie sagte: »Höre zu: Geißelungen, Gefängnisse, schwere Bedrängnisse, Kreuze und wilde Tiere – um des Namens willen. Darum gehören ihnen die rechten Bereiche des Heiligtums, ebenso jedem, der um des Namens willen leidet; den Übrigen aber gehören die linken Bereiche. Doch beide – die rechts und die links sitzen – empfangen dieselben Gaben und dieselben Verheißungen. Nur sitzen jene rechts und haben eine gewisse Herrlichkeit.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπήνεγκαν
  choice: haben sie ertragen
  rationale: Gibt die Bedeutung des geduldigen Tragens oder Erduldens von Leiden natürlich und nah am griechischen Ausdruck wieder.
- source_word: μάστιγας
  choice: Geißelhiebe
  rationale: Bezeichnet hier konkrete körperliche Misshandlungen, nicht allgemein Plagen.
- source_word: φυλακάς
  choice: Gefangenschaft
  rationale: Der Plural kann Haftzeiten oder Gefängnisse bezeichnen; die kollektive deutsche Form passt zur Aufzählung erlittener Verfolgungen.
- source_word: σταυρούς
  choice: Kreuzigungen
  rationale: Der griechische Plural nennt Kreuze als erlittene Todes- oder Folterart; im Deutschen macht »Kreuzigungen« den Sinn in der Leidensreihe deutlich.
- source_word: ἁγιάσματος
  choice: Heiligtums
  rationale: Bewahrt die sakrale räumliche Bildsprache des griechischen Wortes.
- source_word: δόξαν τινά
  choice: eine besondere Herrlichkeit
  rationale: »τινά« bezeichnet eine gewisse oder besondere Herrlichkeit, ohne ihren Umfang näher festzulegen.
theological_decisions:
- issue: Die Bedeutung von »dem Namen«
  choice: des Namens
  alternative: des Namens Christi / Jesu willen
  rationale: Der griechische Text nennt nur τὸ ὄνομα. Die unbestimmte, frühchristlich geprägte Formulierung bleibt erhalten, statt den Bezug ausdrücklich zu ergänzen.
- issue: Verhältnis der rechts und links Sitzenden
  choice: dieselben Gaben und dieselben Verheißungen, bei besonderer Herrlichkeit der rechts Sitzenden
  alternative: unterschiedliche Belohnungen oder Heilsstände
  rationale: Der Text betont zugleich Gleichheit der Gaben und Verheißungen sowie eine besondere Herrlichkeit der Leidenden. Diese Spannung wird nicht systematisch aufgelöst.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die rhythmische Leidensaufzählung und die wiederholte Gegenüberstellung von rechts und links bleiben erhalten; altertümliche Satzformen werden vermieden.
