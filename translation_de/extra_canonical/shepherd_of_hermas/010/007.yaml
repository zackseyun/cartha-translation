  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: de
  text: 7 Die anderen Steine aber, die vom trockenen Land herbeigebracht wurden, verwarfen sie zum Teil; andere fügten sie in den Bau ein. Wieder andere zerschlugen sie und warfen sie weit vom Turm fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: vom trockenen Land
  rationale: Gibt den Gegensatz zum zuvor genannten Heraufholen aus der Tiefe sachlich wieder; „Festland“ wäre möglich, würde hier aber eine Küstenperspektive nahelegen, die der Text nicht ausdrücklich setzt.
- source_word: ἀπέβαλλον
  choice: verwarfen
  rationale: Bewahrt sowohl den konkreten Vorgang des Aussortierens als auch die wertende Bedeutung der Zurückweisung.
- source_word: ἐτίθουν εἰς τὴν οἰκοδομήν
  choice: fügten sie in den Bau ein
  rationale: Natürliches Deutsch für das Einsetzen geeigneter Steine in das entstehende Bauwerk.
- source_word: κατέκοπτον
  choice: zerschlugen
  rationale: Das Verb bezeichnet ein gewaltsames Zerschneiden oder Zerschlagen; bei Steinen ist „zerschlugen“ idiomatisch und wahrt die Härte des Vorgangs.
- source_word: μακρὰν ἀπὸ τοῦ πύργου
  choice: weit vom Turm fort
  rationale: Bildet die räumliche Entfernung und die Bewegung weg vom Turm klar ab.
theological_decisions: []
translation_notes:
  register: Knappe, bildhafte und würdige Erzählprosa in modernem Standarddeutsch. Die wiederholte Teilung der Steine in unterschiedliche Gruppen bleibt erhalten, ohne die symbolische Bedeutung an dieser Stelle auszudeuten.
