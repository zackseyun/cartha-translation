  to: 9 Ich sah noch andere Steine, die weit vom Turm weggeworfen wurden und auf den Weg gelangten, aber nicht auf dem Weg blieben, sondern in wegloses Gelände rollten. Andere fielen ins Feuer und verbrannten. Wieder andere fielen nahe beim Wasser, konnten aber nicht ins Wasser rollen, obwohl sie hineinrollen und ins Wasser gelangen wollten.
