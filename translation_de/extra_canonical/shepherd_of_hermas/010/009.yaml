base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: de
  text: 9 Ich sah noch andere Steine, die weit vom Turm weggeworfen wurden und auf den Weg gelangten, aber nicht auf dem Weg blieben, sondern in wegloses Gelände rollten. Andere fielen ins Feuer und verbrannten. Wieder andere fielen nahe beim Wasser, konnten aber nicht ins Wasser rollen, obwohl sie hineinrollen und ins Wasser gelangen wollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοδίαν
  choice: wegloses Gelände
  rationale: Das Wort bezeichnet einen ortlosen bzw. unwegsamen Bereich abseits eines Weges. „Wegloses Gelände“ bewahrt den deutlichen Gegensatz zu ὁδός („Weg“), ohne die Szenerie vorschnell als „Wüste“ festzulegen.
- source_word: πῦρ
  choice: Feuer
  rationale: Direkte und bildkräftige Entsprechung des griechischen Ausdrucks.
- source_word: ὑδάτων / ὕδωρ
  choice: Wasser
  rationale: Im Deutschen ist hier der kollektive Singular natürlich. Er gibt sowohl die Nähe zum Wasser als auch die angestrebte Bewegung hinein klar wieder.
- source_word: θελόντων
  choice: obwohl sie gern … wären
  rationale: Die konzessive Aussage wird auf die Steine bezogen. „Gern“ bringt ihr im Bild personifiziertes Streben idiomatisch zum Ausdruck.
theological_decisions:
- issue: Symbolische Bedeutung der verschiedenen Wege der Steine
  choice: Die Bildsprache wird ohne Auslegung wiedergegeben.
  alternative: Die Steine ausdrücklich mit bestimmten Gruppen von Menschen oder geistlichen Zuständen gleichsetzen.
  rationale: Dieser Abschnitt beschreibt zunächst die Vision; eine auslegende Identifikation würde dem Text vorgreifen und mögliche theologische Spannungen auflösen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Wiederholungen von „Weg“ und „Wasser“ wurden bewusst beibehalten, weil sie die räumlichen und symbolischen Kontraste des griechischen Textes tragen.
