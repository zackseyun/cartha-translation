review_pass:
  verdict: revise
  source_fidelity: 'Die Zukunftsaussagen καθαρισθήσῃ/καθαρισθήσονται, der Kontrast zwischen ὑστερήματα und ἁμαρτήματα sowie die zeitlich offene Wendung εἰς ταύτην τὴν ἡμέραν sind im Entwurf im Wesentlichen zutreffend wiedergegeben. Bei οἱ μὴ διψυχοῦντες ist „nicht zweifeln“ jedoch zu eng: διψυχέω bezeichnet im hermetischen Sprachgebrauch die Haltung des Doppelherzig- bzw. innerlich Geteiltseins, nicht bloß einen einzelnen Zweifel.'
  naturalness: „Auf der rechten Seite zu sitzen“ ist im modernen Standarddeutsch idiomatischer und weniger räumlich missverständlich als „mit ihnen zur Rechten zu sitzen“. „Doppelherzig“ ist zwar leicht gehoben, in diesem religiös-paränetischen Register aber verständlich und angemessen.
  terminology: „Mängel“ kann für ὑστερήματα stehen und hält den Ausdruck bewusst von den anschließend genannten „Sünden“ getrennt. „Doppelherzig“ bewahrt den terminologischen Eigengehalt von διψυχέω besser als „nicht zweifeln“.
  issues:
  - severity: medium
    issue: οἱ μὴ διψυχοῦντες als „alle, die nicht zweifeln“
    rationale: Die Formulierung reduziert διψυχέω auf kognitiven Zweifel. Der griechische Ausdruck bezeichnet umfassender innere Gespaltenheit bzw. Doppelherzigkeit; diese Nuance sollte nicht ohne Not eingeebnet werden.
  - severity: low
    issue: „mit ihnen zur Rechten zu sitzen“
    rationale: Die Wortstellung kann nahelegen, Hermas solle sich rechts von den anderen setzen. Gemeint ist die bevorzugte rechte Seite zusammen mit ihnen.
  revised_text: 2. Du aber sehnst dich danach, mit ihnen auf der rechten Seite zu sitzen; doch deine Mängel sind zahlreich. Du wirst jedoch von deinen Mängeln gereinigt werden; und alle, die nicht doppelherzig sind, werden bis zu diesem Tag von all ihren Sünden gereinigt werden.
