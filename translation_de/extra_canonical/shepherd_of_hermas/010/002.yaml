base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: de
  text: 2. Du aber sehnst dich danach, mit ihnen auf der rechten Seite zu sitzen; doch deine Mängel sind zahlreich. Du wirst jedoch von deinen Mängeln gereinigt werden; und alle, die nicht doppelherzig sind, werden bis zu diesem Tag von all ihren Sünden gereinigt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεπίθυμος
  choice: sehnst dich sehr danach
  rationale: Das verstärkte Begehren wird in natürlichem Deutsch wiedergegeben.
- source_word: τὰ ὑστερήματά σου
  choice: deine Mängel
  rationale: ὑστέρημα bezeichnet hier persönliche Defizite oder Verfehlungen; „Mängel“ bewahrt die Breite des Ausdrucks und unterscheidet ihn vom späteren ἁμαρτήματα.
- source_word: οἱ μὴ διψυχοῦντες
  choice: alle, die nicht zweifeln
  rationale: διψυχέω bezeichnet ein inneres Schwanken bzw. Zweifeln; die verbale Wiedergabe ist verständlich und vermeidet das unnatürliche „nicht doppelherzig“.
- source_word: εἰς ταύτην τὴν ἡμέραν
  choice: bis zu diesem Tag
  rationale: Die zeitliche Wendung bleibt formal offen und wird nicht erläuternd auf einen bestimmten Tag festgelegt.
theological_decisions:
- issue: Reinigung und ihre zeitliche Beziehung
  choice: „Du wirst … gereinigt werden“ und „bis zu diesem Tag“
  alternative: „Du kannst … gereinigt werden“ bzw. „an diesem Tag“
  rationale: Das Futur καθαρισθήσῃ wird als Zusage wiedergegeben; εἰς ταύτην τὴν ἡμέραν bleibt in seiner möglichen zeitlichen Mehrdeutigkeit erhalten.
- issue: διψυχοῦντες als geistliche Haltung
  choice: „die nicht zweifeln“
  alternative: „die nicht doppelherzig sind“ oder „die nicht innerlich schwanken“
  rationale: Die Wahl bringt den im Hermas häufigen Gedanken des Zweifels verständlich zum Ausdruck, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Singular und der Kontrast zwischen „Mängeln“ und „Sünden“ bleiben erhalten; es sind keine Fußnoten erforderlich.
