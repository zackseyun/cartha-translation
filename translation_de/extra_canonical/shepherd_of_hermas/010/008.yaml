base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: de
  text: 8. Viele andere Steine lagen rings um den Turm, doch man verwendete sie nicht für den Bau. Einige von ihnen waren nämlich schorfig, andere hatten Risse, wieder andere waren verstümmelt; andere waren weiß und rund und passten nicht zum Bau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύκλῳ τοῦ πύργου
  choice: rings um den Turm
  rationale: Gibt die räumliche Lage natürlich und präzise wieder.
- source_word: ἐψωριακότες
  choice: schorfig
  rationale: Bewahrt das Bild einer krankhaft rauen beziehungsweise von Schorf befallenen Oberfläche, ohne es zu verallgemeinern.
- source_word: σχισμὰς ἔχοντες
  choice: hatten Risse
  rationale: Direkte und idiomatische Wiedergabe des sichtbaren Mangels der Steine.
- source_word: κεκολοβωμένοι
  choice: verstümmelt
  rationale: Das Partizip bezeichnet beschnittene oder verstümmelte Gestalt; die kräftige Bildsprache des Griechischen bleibt erhalten.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: passten nicht in den Bau
  rationale: Gibt sowohl die fehlende bauliche Passform als auch die Funktion im Gesamtbild wieder.
theological_decisions:
- issue: Symbolische Deutung der mangelhaften Steine
  choice: Keine Deutung in den Vers eingetragen
  alternative: Die Steine ausdrücklich als bestimmte Gruppen von Menschen bezeichnen
  rationale: Der vorliegende Abschnitt schildert zunächst die Vision; ihre allegorische Erklärung soll nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die auffälligen körperlichen Bilder des griechischen Textes werden bewusst beibehalten.
