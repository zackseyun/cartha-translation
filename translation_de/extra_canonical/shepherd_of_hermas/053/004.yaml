base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/004.yaml
  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: de
  text: »Was die früheren Unwissenheiten betrifft«, sagt er, »kann allein Gott Heilung gewähren; denn alle Vollmacht gehört ihm. Doch hüte dich jetzt selbst; und der Herr, der Allmächtige, wird dir in seinem reichen Erbarmen für die früheren Unwissenheiten Heilung gewähren, wenn du von nun an weder dein Fleisch noch den Geist befleckst. Denn beide gehören zusammen und können nicht getrennt voneinander befleckt werden. Halte daher beide rein, und du wirst Gott leben.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγνοήματα
  choice: Verfehlungen aus Unwissenheit
  rationale: Das Wort bezeichnet nicht bloß fehlendes Wissen, sondern aus Unwissenheit begangene Fehler oder Sünden. Die Wendung bewahrt beide Aspekte.
- source_word: ἴασιν δοῦναι
  choice: Heilung schenken
  rationale: Gibt die medizinische Metapher von ἴασις wieder und klingt im Deutschen natürlicher als „Heilung geben“.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: Bezeichnet hier Gottes umfassende Befugnis und Macht zu heilen; „Vollmacht“ wahrt den personalen und autoritativen Sinn.
- source_word: φύλασσε σεαυτόν
  choice: hüte dich
  rationale: Eine natürliche imperativische Wiedergabe, die sowohl Wachsamkeit als auch sittliche Selbstbewahrung ausdrückt.
- source_word: πολύσπλαγχνος
  choice: reich an Erbarmen
  rationale: Gibt die starke Aussage über Gottes tiefes Mitgefühl in würdigem, verständlichem Deutsch wieder.
- source_word: τὸ λοιπὸν
  choice: künftig
  rationale: Bezeichnet die Zeit von jetzt an und fügt sich natürlich in den Bedingungssatz ein.
- source_word: κοινά
  choice: gehören zusammen
  rationale: Im Zusammenhang meint κοινά die enge Verbundenheit von Fleisch und Geist. Eine starre Wiedergabe als „gemeinsam“ wäre im Deutschen missverständlich.
- source_word: ζήσῃ τῷ Θεῷ
  choice: du wirst für Gott leben
  rationale: Bewahrt den Dativ und die theologische Offenheit der Wendung, statt sie vorschnell als „bei Gott“ oder „durch Gott“ zu deuten.
theological_decisions:
- issue: Verhältnis von Gottes Heilung und künftigem reinem Leben
  choice: 'Der Bedingungssatz bleibt ausdrücklich erhalten: Gottes Heilung wird zugesagt, sofern künftig Fleisch und Geist nicht befleckt werden.'
  alternative: Die Heilung als bedingungslose Vergebung wiederzugeben oder die Bedingung lediglich als Folge der Heilung darzustellen.
  rationale: Der griechische Text verbindet die Zusage syntaktisch mit ἐὰν und lässt die daraus entstehende theologische Spannung stehen.
- issue: Bedeutung von „Fleisch“ und „Geist“
  choice: Die konkreten Begriffe „Fleisch“ und „Geist“ werden beibehalten.
  alternative: „Leib und Seele“ oder „Körper und innerer Mensch“.
  rationale: Solche Ersetzungen würden die Begrifflichkeit des Textes interpretierend harmonisieren und könnten den möglichen Bezug auf den im Menschen wohnenden Geist verwischen.
- issue: Die Verbundenheit von Fleisch und Geist
  choice: „Beide gehören zusammen und können nicht getrennt voneinander befleckt werden.“
  alternative: „Beide sind gemeinsames Eigentum“ oder „beide sind gemeinschaftlich“.
  rationale: Der Satz betont ihre untrennbare moralische Betroffenheit. Die gewählte Formulierung wahrt diese Aussage, ohne eine nicht eindeutig ausgesprochene Besitztheologie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die wiederholte Wendung „Verfehlungen aus Unwissenheit“ ist bewusst präzise und bewahrt die ethische Bedeutung von ἀγνοήματα. Keine Fußnoten sind nötig, da die textkritisch eingeklammerte Passage vollständig zum angeforderten Lesersegment gehört und in der konsultierten englischen Fassung ebenfalls enthalten ist.
