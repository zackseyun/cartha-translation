revisions:
- from: »Was die früheren Verfehlungen aus Unwissenheit betrifft«, sagt er, »so kann allein Gott Heilung dafür schenken; denn ihm gehört alle Vollmacht. Doch hüte dich von nun an; dann wird der Herr, der Allmächtige, weil er reich an Erbarmen ist, Heilung für die früheren Verfehlungen aus Unwissenheit schenken, sofern du künftig weder dein Fleisch noch den Geist befleckst. Denn beide gehören zusammen und können nicht getrennt voneinander befleckt werden. Halte daher beide rein, und du wirst für Gott leben.«
  to: »Was die früheren Unwissenheiten betrifft«, sagt er, »kann allein Gott Heilung gewähren; denn alle Vollmacht gehört ihm. Doch hüte dich jetzt selbst; und der Herr, der Allmächtige, wird dir in seinem reichen Erbarmen für die früheren Unwissenheiten Heilung gewähren, wenn du von nun an weder dein Fleisch noch den Geist befleckst. Denn beide gehören zusammen und können nicht getrennt voneinander befleckt werden. Halte daher beide rein, und du wirst Gott leben.«
  rationale: Die Revision wahrt die Satzfolge und die Bedingung des Griechischen, nimmt die medizinische Metapher von ἴασις auf und erhält die Schlüsselbegriffe Fleisch und Geist. Die unsicher überlieferte, aber im englischen Audit-Text enthaltene Passage wird übersetzt und durch eine textkritische Fußnote transparent gemacht. „Frühere Unwissenheiten“ belässt ἀγνοήματα in seiner knappen, nicht weiter dogmatisch oder moralisch festgelegten Form.
