  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: de
  text: '„Wenn es aber, Herr“, sagte ich, „bevor diese Worte gehört wurden, eine frühere Unwissenheit gegeben hat: Wie kann dann der Mensch gerettet werden, der sein Fleisch befleckt hat?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede des griechischen Dialogs; im Kontext ist der Gesprächspartner gemeint, nicht ausdrücklich Gott.
- source_word: ἄγνοια προτέρα
  choice: schon früher … Unwissenheit
  rationale: Gibt sowohl den zeitlichen Rückbezug als auch den Zustand mangelnder Erkenntnis wieder, ohne ihn vorschnell als bloßes Versehen oder bestimmte Sünde auszulegen.
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: bevor diese Worte zu hören waren
  rationale: Die unpersönlich-passive Form wahrt die offene Aussage des Griechischen, statt ein nicht genanntes Subjekt einzuführen.
- source_word: πῶς σωθῇ
  choice: Wie kann dann … gerettet werden?
  rationale: Natürliches modernes Deutsch für den deliberativen Konjunktiv; „dann“ verdeutlicht den logischen Anschluss, ohne neue Sachinformation hinzuzufügen.
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: der sein Fleisch befleckt hat
  rationale: „Fleisch“ erhält die zentrale σώμα/σάρξ-nahe Bild- und Begriffsebene des Abschnitts; „befleckt“ entspricht dem kultisch-moralisch offenen μιαίνω.
theological_decisions:
- issue: Bedeutung von ἄγνοια
  choice: Unwissenheit
  alternative: unwissentlich begangene Verfehlung
  rationale: Der Ausgangstext nennt zunächst den Zustand der Unwissenheit; eine ausdrückliche Verengung auf konkrete Verfehlungen würde die im Text vorhandene Mehrdeutigkeit reduzieren.
- issue: Bedeutung von σάρξ
  choice: Fleisch
  alternative: Leib / Körper
  rationale: Die wörtliche und im unmittelbaren Kontext wiederholte Bezeichnung soll erhalten bleiben. „Körper“ wäre leichter verständlich, könnte aber die theologische Spannung zwischen Fleisch und dem darin wohnenden Geist abschwächen.
- issue: Heilsaussage σωθῇ
  choice: gerettet werden
  alternative: Heil finden
  rationale: „Gerettet werden“ bewahrt Passivform und offene Frage nach dem rettenden Handelnden, ohne ein theologisches System einzutragen.
translation_notes:
  register: Moderne, würdige Dialogsprache. Die leicht markierte Wortstellung der direkten Rede bleibt lesbar; „Herr“ wird als respektvolle Anrede verwendet. Keine Fußnoten erforderlich.
