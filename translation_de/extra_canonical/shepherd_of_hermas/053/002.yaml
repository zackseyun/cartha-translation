  to: „Höre nun“, sagt er. „Bewahre dieses dein Fleisch rein und unbefleckt, damit der Geist, der darin wohnt, ihm Zeugnis gibt und dein Fleisch gerechtfertigt wird. Hüte dich, dass nicht in deinem Herzen der Gedanke aufkommt, dieses dein Fleisch sei vergänglich, und dass du es durch irgendeine Befleckung missbrauchst. Denn wenn du dein Fleisch befleckst, befleckst du auch den Heiligen Geist; und wenn du das Fleisch befleckst, wirst du nicht leben.“[a]
