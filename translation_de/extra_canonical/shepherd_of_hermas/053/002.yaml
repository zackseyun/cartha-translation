base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: de
  text: „Höre nun“, sagt er. „Bewahre dieses dein Fleisch rein und unbefleckt, damit der Geist, der darin wohnt, ihm Zeugnis gibt und dein Fleisch gerechtfertigt wird. Hüte dich, dass nicht in deinem Herzen der Gedanke aufkommt, dieses dein Fleisch sei vergänglich, und dass du es durch irgendeine Befleckung missbrauchst. Denn wenn du dein Fleisch befleckst, befleckst du auch den Heiligen Geist; und wenn du das Fleisch befleckst, wirst du nicht leben.“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung hat hier erneut „das Fleisch“; die Formulierung ist textkritisch unsicher. Teilweise wird stattdessen „den Geist“ vermutet.
    reason: Das Kreuzzeichen der Edition kennzeichnet τὴν σάρκα als verdächtige Lesart; die Fußnote wahrt den überlieferten Text und macht die mögliche Alternative sichtbar.
lexical_decisions:
- source_word: σάρξ
  choice: Fleisch
  rationale: Bewahrt die konkrete, theologisch spannungsreiche Rede vom menschlichen Leib als „Fleisch“, ohne sie durch eine rein körperliche oder moralische Umschreibung einzuengen.
- source_word: φύλασσε
  choice: bewahre / hüte dich
  rationale: Gibt sowohl den positiven Auftrag zum Reinhalten als auch die warnende Konstruktion βλέπε μήποτε in natürlichem Deutsch wieder.
- source_word: μαρτυρήσῃ αὐτῇ
  choice: für es Zeugnis ablegt
  rationale: Wahrt den Dativbezug auf das Fleisch und lässt Art und Inhalt des Zeugnisses entsprechend dem Griechischen offen.
- source_word: δικαιωθῇ
  choice: für gerecht erklärt wird
  rationale: Gibt den passivischen Rechtfertigungsbegriff deutlich wieder, ohne ihn zu „sich als gerecht erweisen“ abzuschwächen.
- source_word: παραχρήσῃ
  choice: missbrauchst
  rationale: Erfasst den Gedanken eines falschen oder zweckwidrigen Gebrauchs in knapper, verständlicher Form.
- source_word: μιασμός / μιαίνω
  choice: Befleckung / beflecken
  rationale: Bewahrt die kultisch-moralische Bildsprache und die wiederholte Wortwurzel des Ausgangstextes.
theological_decisions:
- issue: Verhältnis von Fleisch und Geist
  choice: Die Aussagen über das Zeugnis des Geistes, die Rechtfertigung des Fleisches und die Befleckung des Heiligen Geistes bleiben eng am Wortlaut stehen.
  alternative: „Leib“ verwenden oder die Aussagen als bloße Metapher für sittliches Verhalten erklären.
  rationale: Der Text verbindet Fleisch und Geist ausdrücklich und spannungsreich; eine erklärende Harmonisierung würde seine anthropologische und theologische Offenheit einschränken.
- issue: Textkritisch unsicheres Objekt im letzten Bedingungssatz
  choice: „wenn du das Fleisch befleckst“ gemäß dem überlieferten Wortlaut übersetzen und die Unsicherheit in einer Fußnote anzeigen.
  alternative: Konjektural „wenn du den Geist befleckst“ übersetzen.
  rationale: Die handschriftlich gebotene Lesart soll im Haupttext stehen; die auffällige Wiederholung rechtfertigt jedoch einen transparenten textkritischen Hinweis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die eindringlichen Wiederholungen des griechischen Textes bleiben erhalten. „Dieses dein Fleisch“ ist bewusst leicht feierlich, aber verständlich und bildet die demonstrative Hervorhebung ταύτην τὴν σάρκα σου nach.
