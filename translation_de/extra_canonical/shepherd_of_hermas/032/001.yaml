revisions:
- from: „Sei langmütig“, sagt er, „und verständig; dann wirst du über alle bösen Taten Herr werden und jede Art von Gerechtigkeit üben. Denn wenn du langmütig bist, wird der heilige Geist, der in dir wohnt, rein sein und nicht von einem anderen, bösen Geist verdunkelt werden. Vielmehr wird er, da er in einem weiten Raum wohnt, zusammen mit dem Gefäß, in dem er wohnt, jubeln und sich freuen; und er wird Gott mit großer Freudigkeit dienen, weil es ihm in seinem Inneren wohlergeht.“
  to: „Sei langmütig“, sagt er, „und verständig; dann wirst du über alle bösen Taten Herr werden und jede Gerechtigkeit üben. Denn wenn du langmütig bist, wird der heilige Geist, der in dir wohnt, rein sein und nicht von einem anderen bösen Geist verdunkelt werden. Vielmehr wird er, da er in einem weiten Raum wohnt, zusammen mit dem Gefäß, in dem er wohnt, jubeln und sich freuen; und er wird Gott voll großer Freude dienen und Fülle in sich haben.“
