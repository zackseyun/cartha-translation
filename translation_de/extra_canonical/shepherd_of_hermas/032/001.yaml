base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: de
  text: „Sei langmütig“, sagt er, „und verständig; dann wirst du über alle bösen Taten Herr werden und jede Gerechtigkeit üben. Denn wenn du langmütig bist, wird der heilige Geist, der in dir wohnt, rein sein und nicht von einem anderen bösen Geist verdunkelt werden. Vielmehr wird er, da er in einem weiten Raum wohnt, zusammen mit dem Gefäß, in dem er wohnt, jubeln und sich freuen; und er wird Gott voll großer Freude dienen und Fülle in sich haben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος / μακροθυμία
  choice: langmütig / Langmut
  rationale: Bewahrt den ethischen Leitbegriff des Abschnitts und bezeichnet geduldige, beherrschte Ausdauer statt bloßen Wartens.
- source_word: συνετός
  choice: verständig
  rationale: Gibt praktische Einsicht und Besonnenheit in natürlichem, würdigem Deutsch wieder.
- source_word: κατακυριεύσεις
  choice: wirst du … Herr werden
  rationale: Erhält die starke Vorstellung des Beherrschens beziehungsweise Überwindens, ohne sie auf bloßes Vermeiden abzuschwächen.
- source_word: ἐργάσῃ πᾶσαν δικαιοσύνην
  choice: jede Art von Gerechtigkeit üben
  rationale: Das distributive πᾶσαν wird idiomatisch wiedergegeben; „üben“ bewahrt den tätigen Sinn von ἐργάζομαι.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der heilige Geist
  rationale: Entspricht der griechischen Nominalgruppe; die Kleinschreibung des Adjektivs vermeidet eine unnötige Vorentscheidung darüber, ob hier bereits ein fester Eigenname vorliegt.
- source_word: ἐν εὐρυχώρῳ
  choice: in einem weiten Raum
  rationale: Bewahrt die räumliche Gefäßmetaphorik des Originals.
- source_word: σκεῦος
  choice: Gefäß
  rationale: Die konkrete anthropologische Metapher wird beibehalten und nicht erklärend als „Leib“ aufgelöst.
- source_word: λειτουργήσει τῷ Θεῷ
  choice: wird Gott … dienen
  rationale: Gibt den kultisch-dienstlichen Sinn verständlich wieder, ohne einen spezifisch liturgischen Vollzug zu behaupten.
- source_word: ἱλαρότητι πολλῇ
  choice: mit großer Freudigkeit
  rationale: Bezeichnet bereitwillige, heitere Freude und passt zum vorausgehenden Jubeln und Sichfreuen.
- source_word: εὐθηνίαν ἐν ἑαυτῷ
  choice: weil es ihm in seinem Inneren wohlergeht
  rationale: Gibt den schwer wörtlich übertragbaren Gedanken innerer Fülle beziehungsweise guten Gedeihens natürlich wieder, ohne materiellen Wohlstand zu suggerieren.
theological_decisions:
- issue: Referenz und Personhaftigkeit des heiligen Geistes
  choice: „der heilige Geist … er“
  alternative: „das heilige Pneuma … es“ oder eine unpersönliche Wiedergabe
  rationale: Das Deutsche verlangt ein grammatisches Genus; „Geist“ ist maskulin. Die handelnden Verben des griechischen Textes werden bewahrt, ohne darüber hinaus eine spätere trinitarische Terminologie einzutragen.
- issue: Reinheit des inwendigen Geistes
  choice: „wird … rein sein“
  alternative: „wird rein bleiben“
  rationale: Das Futur ἔσται wird formal als Zustandsaussage wiedergegeben. „Bleiben“ würde eine zeitliche Kontinuität ausdrücklich ergänzen, die der griechische Wortlaut nicht direkt formuliert.
- issue: Zusammenspiel von Geist und menschlichem Gefäß
  choice: „zusammen mit dem Gefäß … jubeln und sich freuen“
  alternative: „sich über das Gefäß freuen“
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft; die wechselseitige beziehungsweise gemeinsame Freude bleibt erhalten, statt in eine Bewertung des Gefäßes umgedeutet zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Bildwelt. Die langen Perioden wurden behutsam gegliedert, ohne Argumentationsfolge oder Parallelismen aufzulösen. Keine Fußnoten erforderlich; daher stehen auch keine Fußnotenmarker im Haupttext.
