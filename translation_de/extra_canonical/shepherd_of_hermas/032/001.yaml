review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Gedankengang und die Gefäßmetaphorik insgesamt zuverlässig wieder. Eine Korrektur ist jedoch bei ἔχον τὴν εὐθηνίαν ἐν ἑαυτῷ nötig: Die kausale, idiomatische Umschreibung „weil es ihm in seinem Inneren wohlergeht“ verschiebt das partizipiale Prädikat und ist zudem in der Pronomenführung missverständlich. „Fülle in sich haben“ bewahrt die Aussage von innerem Gedeihen bzw. Überfluss ohne eine materielle Bedeutung festzulegen.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Voll großer Freude“ ist idiomatischer als „mit großer Freudigkeit“, während der heiter-freudige Ton von ἱλαρότης erhalten bleibt. Die direkte Wiedergabe „jede Gerechtigkeit üben“ vermeidet den im Griechischen nicht ausdrücklich enthaltenen Zusatz „Art von“.
  terminology: „langmütig“, „verständig“, „heiliger Geist“, „böser Geist“ und „Gefäß“ sind quellennahe und im Kontext angemessen. Die maskuline Rückverweisung auf „Geist“ folgt deutscher Grammatik und trifft keine zusätzliche dogmatische Festlegung.
  issues:
  - severity: medium
    issue: Kausale und unklare Wiedergabe von ἔχον τὴν εὐθηνίαν ἐν ἑαυτῷ
    rationale: „Weil es ihm in seinem Inneren wohlergeht“ macht das griechische Partizip kausal und verwendet ein unpersönliches „es“ neben dem maskulinen Bezugswort „Geist“. Der Ausgangstext beschreibt vielmehr, dass der Geist Fülle bzw. Gedeihen in sich hat.
  - severity: low
    issue: „jede Art von Gerechtigkeit“
    rationale: „Art von“ ist als idiomatische Erklärung möglich, fügt aber eine Klassifizierung hinzu, die πᾶσαν δικαιοσύνην nicht verlangt. „jede Gerechtigkeit“ ist enger am Wortlaut.
  - severity: low
    issue: „mit großer Freudigkeit“
    rationale: Die Formulierung ist verständlich, klingt im modernen Standarddeutsch jedoch weniger natürlich als „voll großer Freude“.
  revised_text: „Sei langmütig“, sagt er, „und verständig; dann wirst du über alle bösen Taten Herr werden und jede Gerechtigkeit üben. Denn wenn du langmütig bist, wird der heilige Geist, der in dir wohnt, rein sein und nicht von einem anderen bösen Geist verdunkelt werden. Vielmehr wird er, da er in einem weiten Raum wohnt, zusammen mit dem Gefäß, in dem er wohnt, jubeln und sich freuen; und er wird Gott voll großer Freude dienen und Fülle in sich haben.“
