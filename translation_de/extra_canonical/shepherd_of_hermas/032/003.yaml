base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: de
  text: 'Wenn du nämlich ein wenig Wermut nimmst und ihn in einen Krug Honig schüttest, wird dann nicht der ganze Honig verdorben? Eine so große Menge Honig wird durch die geringste Menge Wermut verdorben: Er zerstört die Süße des Honigs, und dieser findet bei seinem Herrn nicht mehr denselben Gefallen, weil er bitter geworden ist und seine Brauchbarkeit verloren hat. Wird aber kein Wermut in den Honig getan, erweist sich der Honig als süß und wird für seinen Herrn brauchbar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: Wermut
  rationale: Die konkrete bittere Pflanze und das anschauliche Bild des griechischen Textes bleiben erhalten.
- source_word: κεράμιον
  choice: Krug
  rationale: Bezeichnet hier ein irdenes Gefäß; „Krug“ ist natürlich und entspricht dem Behältnis im Vergleich.
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: verdorben / wird verdorben
  rationale: Im Zusammenhang wird der Honig nicht vernichtet, sondern durch Bitterkeit unbrauchbar gemacht; „verdorben“ gibt die Bildaussage idiomatisch wieder.
- source_word: χάριν
  choice: Gefallen
  rationale: Die Wendung bezeichnet hier die Gunst beziehungsweise Wertschätzung beim Herrn, nicht abstrakt „Gnade“.
- source_word: δεσπότῃ
  choice: Herrn
  rationale: Bewahrt die Herr-Eigentümer-Beziehung des Bildes, ohne sie unnötig zu erklären.
- source_word: εὔχρηστον
  choice: brauchbar
  rationale: Gibt die praktische Verwendbarkeit des Honigs für seinen Herrn direkt wieder.
theological_decisions:
- issue: Bezug des Herrn im Gleichnis
  choice: „seinem Herrn“ kleingeschrieben
  alternative: „seinem Herrn“ als ausdrückliche Gottesbezeichnung verstanden
  rationale: Auf der Bildebene ist zunächst der Besitzer des Honigs gemeint. Die geistliche Anwendung auf den Herrn folgt im weiteren Kontext, sollte aber hier nicht typografisch vorweggenommen werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die Wiederholung des Honig-Wermut-Bildes wurden bewahrt; „findet … Gefallen“ gibt die etwas schwierige Wendung χάριν ἔχει παρὰ τῷ δεσπότῃ natürlich wieder.
