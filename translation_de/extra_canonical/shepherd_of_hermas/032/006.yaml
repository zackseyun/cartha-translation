revisions:
- from: Denn wenn alle diese Geister in ein und demselben Gefäß wohnen, in dem auch der Heilige Geist wohnt, kann jenes Gefäß sie nicht fassen, sondern läuft über. Der empfindsame Geist ist es nicht gewohnt, mit einem bösen Geist oder mit Härte zusammenzuwohnen. Darum zieht er sich von einem solchen Menschen zurück und sucht dort zu wohnen, wo Sanftmut und Ruhe sind. Wenn er dann den Menschen verlassen hat, in dem er wohnte, wird jener Mensch leer vom Geist der Gerechtigkeit. Fortan ist er von den bösen Geistern erfüllt, wird in all seinem Tun unstet, von ihnen hierhin und dorthin gezerrt, und sein Sinn wird für das Gute völlig verblendet. So ergeht es allen, die jähzornig sind.
  to: Denn wenn alle diese Geister in einem und demselben Gefäß wohnen, in dem auch der Heilige Geist wohnt, kann jenes Gefäß sie nicht fassen, sondern es läuft über. Der zarte Geist ist es nicht gewohnt, mit einem bösen Geist oder mit Härte zusammenzuwohnen. Darum zieht er sich von einem solchen Menschen zurück und sucht dort zu wohnen, wo Sanftmut und Ruhe sind. Wenn er dann den Menschen verlassen hat, in dem er wohnt, wird jener Mensch leer vom gerechten Geist. Fortan ist er von bösen Geistern erfüllt, wird in all seinem Tun unstet, von ihnen hierhin und dorthin gezerrt, und sein gutes Urteilsvermögen wird ihm völlig verdunkelt. So ergeht es allen, die jähzornig sind.
  rationale: Die Revision behebt den grammatischen Kasusfehler und stellt die Bezeichnung des Geistes wieder als adjektivische Charakterisierung („gerechter Geist“) her. Weitere Anpassungen dienen einer engeren, zugleich natürlichen Wiedergabe von τρυφερόν und διανοίας τῆς ἀγαθῆς. Die Ambiguität hinsichtlich des Verhältnisses von „Heiligem Geist“ und „gerechtem Geist“ bleibt unangetastet.
