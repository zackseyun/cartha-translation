base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: de
  text: Denn wenn alle diese Geister in einem und demselben Gefäß wohnen, in dem auch der Heilige Geist wohnt, kann jenes Gefäß sie nicht fassen, sondern es läuft über. Der zarte Geist ist es nicht gewohnt, mit einem bösen Geist oder mit Härte zusammenzuwohnen. Darum zieht er sich von einem solchen Menschen zurück und sucht dort zu wohnen, wo Sanftmut und Ruhe sind. Wenn er dann den Menschen verlassen hat, in dem er wohnt, wird jener Mensch leer vom gerechten Geist. Fortan ist er von bösen Geistern erfüllt, wird in all seinem Tun unstet, von ihnen hierhin und dorthin gezerrt, und sein gutes Urteilsvermögen wird ihm völlig verdunkelt. So ergeht es allen, die jähzornig sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγος
  choice: Gefäß
  rationale: Bewahrt das konkrete Behälterbild des griechischen Textes und seine anthropologische Metapher.
- source_word: τρυφερὸν πνεῦμα
  choice: der empfindsame Geist
  rationale: τρυφερός bezeichnet hier etwas Zartes beziehungsweise Empfindsames; „empfindsam“ klingt im Deutschen natürlich und erklärt, weshalb dieser Geist Härte nicht erträgt.
- source_word: σκληρότης
  choice: Härte
  rationale: Direkte, kontextgerechte Wiedergabe des Gegensatzes zu Sanftmut und Ruhe.
- source_word: πραότης καὶ ἡσυχία
  choice: Sanftmut und Ruhe
  rationale: Erhält die zwei unterscheidbaren Tugendbegriffe und den würdevollen paränetischen Ton.
- source_word: πνεῦμα τοῦ δικαίου
  choice: Geist der Gerechtigkeit
  rationale: Der Genitiv kann sachlich als Kennzeichnung des gerechten beziehungsweise auf Gerechtigkeit gerichteten Geistes verstanden werden; die Formulierung wahrt diese Offenheit.
- source_word: ἀκαταστατεῖ
  choice: wird … unstet
  rationale: Gibt den Zustand von Unordnung und Instabilität wieder, ohne ihn unnötig psychologisch festzulegen.
- source_word: περισπώμενος
  choice: gezerrt
  rationale: Vermittelt die passive Fremdbestimmung durch die bösen Geister anschaulich.
- source_word: ὀξύχολοι
  choice: die jähzornig sind
  rationale: Bezeichnet Menschen, die rasch in heftigen Zorn geraten; „jähzornig“ ist die prägnante moderne Entsprechung.
theological_decisions:
- issue: Beziehung zwischen „Heiligem Geist“ und „Geist der Gerechtigkeit“
  choice: Die verschiedenen griechischen Bezeichnungen werden jeweils eigenständig übersetzt.
  alternative: Beide Ausdrücke vereinheitlichend als „Heiliger Geist“ wiederzugeben.
  rationale: Der Quelltext wechselt ausdrücklich von τὸ πνεῦμα τὸ ἅγιον zu πνεῦμα τοῦ δικαίου. Eine Vereinheitlichung würde eine mögliche begriffliche Spannung beseitigen.
- issue: Rückzug des Geistes vom jähzornigen Menschen
  choice: Die Aussage wird ohne dogmatische Erläuterung oder Abschwächung wiedergegeben.
  alternative: Den Rückzug nur als Verlust des Einflusses oder der Gemeinschaft des Geistes auszulegen.
  rationale: Der Text spricht bildhaft von Wohnen, Fortgehen und Leersein. Die Übersetzung bewahrt diese Aussagen, ohne eine spätere konfessionelle Lehre hineinzulesen.
- issue: Großschreibung von „Heiliger Geist“
  choice: „Heiliger Geist“ wird großgeschrieben; „Geist der Gerechtigkeit“ bleibt als eigenständige Bezeichnung erhalten.
  alternative: Alle Vorkommen von πνεῦμα kleinschreiben und ausschließlich als menschlichen Geist deuten.
  rationale: Der unmittelbare Kontext spricht vom Geist, der in einem Menschen wohnt und dem bösen Geist gegenübersteht; die traditionelle deutsche Großschreibung ist sachgerecht, legt aber die Identität der unterschiedlichen Wendungen nicht vollständig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das wiederkehrende Bild des Menschen als Gefäß sowie die Abfolge von Einwohnen, Überfülltsein, Rückzug und Verblendung bleiben erhalten. Keine Fußnoten sind für diesen Leserabschnitt erforderlich.
