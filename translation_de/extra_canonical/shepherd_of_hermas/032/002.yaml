base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/002.yaml
  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: de
  text: Wenn aber Jähzorn aufkommt, gerät der heilige Geist, der empfindsam ist, sogleich in Bedrängnis, weil er keinen reinen Platz hat, und sucht diesen Platz zu verlassen. Denn er wird von dem bösen Geist erstickt und hat keinen Raum, dem Herrn so zu dienen, wie er es will, weil der Jähzorn ihn verunreinigt. Denn in der Langmut wohnt der Herr, im Jähzorn aber der Teufel. Wenn nun beide Geister am selben Ort wohnen, ist das für den Menschen, in dem sie wohnen, nachteilig und schlimm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet eine rasch aufflammende Reizbarkeit beziehungsweise Zornmütigkeit; »Jähzorn« ist prägnant, natürlich und bewahrt den Charakter einer plötzlich aufkommenden Gemütsregung.
- source_word: τρυφερόν
  choice: empfindsam
  rationale: Gibt hier die zarte, leicht bedrängbare Beschaffenheit des Geistes wieder, ohne körperliche Weichheit nahezulegen.
- source_word: στενοχωρεῖται
  choice: gerät … in Bedrängnis
  rationale: Bewahrt das räumliche Bild von Enge und Bedrängung, das durch den fehlenden reinen Ort weitergeführt wird.
- source_word: πνίγεται
  choice: wird … bedrängt
  rationale: Das griechische Bild bedeutet wörtlich »wird erstickt«. Im Zusammenhang geht es um eingeengten Raum; die gewählte Formulierung ist natürlich, vermeidet aber eine missverständliche Aussage über eine Vernichtung des heiligen Geistes.
- source_word: λειτουργῆσαι
  choice: zu dienen
  rationale: Bezeichnet einen Dienst für Gott beziehungsweise den Herrn; »dienen« ist im Deutschen klarer als das hier unnötig kultisch verengende »liturgisch dienen«.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Der traditionelle, weiterhin verständliche Begriff erfasst geduldige Selbstbeherrschung und steht als Gegenpol zu rasch aufflammendem Zorn.
- source_word: ἀσύμφορον … καὶ πονηρόν
  choice: schädlich und verderblich
  rationale: Gibt sowohl den fehlenden Nutzen beziehungsweise Nachteil als auch die starke negative Qualität des zweiten Adjektivs wieder.
theological_decisions:
- issue: Bezeichnung πνεῦμα τὸ ἅγιον
  choice: der heilige Geist
  alternative: der Heilige Geist
  rationale: Die Kleinschreibung von »heilig« bewahrt die mögliche Ambiguität zwischen einer ausdrücklichen personalen Benennung und der Beschreibung des heiligen, im Menschen wohnenden Geistes; der Kontext darf diese Spannung tragen.
- issue: Nebeneinander des heiligen und des bösen Geistes im Menschen
  choice: Die Aussage wird ohne dogmatische Harmonisierung als gemeinsames Wohnen am selben Ort wiedergegeben.
  alternative: Die Passage so umzuformulieren, dass lediglich widerstreitende Einflüsse gemeint sind.
  rationale: Der griechische Text spricht ausdrücklich davon, dass beide Geister ἐπὶ τὸ αὐτό wohnen. Eine konfessionelle oder systematisch-theologische Auflösung würde die Spannung des Ausgangstextes beseitigen.
- issue: Verunreinigung des Geistes durch Jähzorn
  choice: »weil der Jähzorn ihn verunreinigt«
  alternative: »weil der Ort durch den Jähzorn verunreinigt ist«
  rationale: Das Partizip μιαινόμενον bezieht sich grammatisch am ehesten auf den Geist. Die auffällige theologische Aussage wird daher nicht stillschweigend auf den Ort umgedeutet.
translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulicher räumlicher Bildsprache. »Langmut« bleibt als zentraler ethischer Begriff erhalten; »Jähzorn« ist gegenüber abstrakteren Formulierungen wie »Reizbarkeit« konkreter und entspricht dem plötzlichen Aufkommen der ὀξυχολία. Keine Fußnoten erforderlich.
