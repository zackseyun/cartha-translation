base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: de
  text: Halte dich also fern vom Jähzorn, dem bösesten Geist. Kleide dich vielmehr in Langmut und widerstehe dem Jähzorn und der Bitterkeit; dann wirst du mit der Würde[a] verbunden sein, die der Herr liebt. Achte also darauf, dieses Gebot niemals außer Acht zu lassen. Denn wenn du dieses Gebot meisterst, wirst du auch die übrigen Gebote halten können, die ich dir noch geben werde. Sei stark in ihnen und lass dich in ihnen stärken; und alle, die in ihnen wandeln wollen, sollen gestärkt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ernsthaftigkeit“ oder „achtbare Haltung“. Das griechische Wort bezeichnet eine würdevolle, achtbare Haltung.'
    reason: σεμνότης umfasst ein breiteres Bedeutungsspektrum, als ein einzelnes modernes deutsches Wort vollständig abdecken kann.
lexical_decisions:
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet eine rasch aufflammende, reizbare Zornesneigung; „Jähzorn“ ist prägnant und hält die Personifikation als böser Geist aufrecht.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bewahrt den ethisch-religiösen Begriff und bildet den ausdrücklichen Gegensatz zum Jähzorn besser ab als das allgemeinere „Geduld“.
- source_word: ἔνδυσαι
  choice: Kleide dich ... in
  rationale: Gibt die konkrete Kleidungsmetapher des griechischen Aoristimperativs wieder.
- source_word: σεμνότης
  choice: Ehrbarkeit
  rationale: Umfasst würdige, achtbare Haltung, ohne den Begriff auf bloßen Ernst oder gesellschaftlichen Rang zu verengen.
- source_word: κυριεύσῃς
  choice: meisterst
  rationale: Erhält das Motiv des Herrwerdens über beziehungsweise Beherrschens eines Gebots in natürlichem Deutsch.
- source_word: πορεύεσθαι
  choice: wandeln
  rationale: Bewahrt die traditionelle Wegmetapher für eine Lebensführung nach den Geboten.
theological_decisions:
- issue: Personifikation des Jähzorns als Geist
  choice: „diesem überaus bösen Geist“
  alternative: „dieser überaus bösen Geisteshaltung“
  rationale: Der Quelltext nennt den Jähzorn ausdrücklich πνεῦμα und behandelt ihn im Zusammenhang als handelnden Geist; eine Psychologisierung zu „Geisteshaltung“ würde diese Spannung auflösen.
- issue: Zusammenspiel von menschlicher Stärke und empfangener Stärkung
  choice: „Werde stark in ihnen und lass dich stärken“
  alternative: „Sei stark und kräftige dich in ihnen“
  rationale: Die zwei Imperative ἰσχυροῦ und ἐνδυναμοῦ werden unterschieden; die Formulierung wahrt die mögliche passive Nuance des zweiten Ausdrucks, ohne ausdrücklich festzulegen, von wem die Stärkung kommt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Imperative und Weg-, Kleidungs- sowie Herrschaftsmetaphern des griechischen Textes bleiben erhalten. Die Anrede steht durchgehend im Singular; erst der letzte Satz wechselt entsprechend der Vorlage zum Plural beziehungsweise zu „alle“.
