  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „bei jener Ehrbarkeit finden“ wirkt jedoch im Deutschen unidiomatisch. „Mit der ... Würde verbunden sein“ gibt die Verbindung durch μετά natürlich wieder, ohne einen zusätzlichen Verweis einzuführen.
  terminology: „Jähzorn“, „Langmut“, „Bitterkeit“ und die Kleidungsmetapher sind angemessen. Für σεμνότης ist „Würde“ im gegenwärtigen Deutsch natürlicher als „Ehrbarkeit“ und wahrt das Spektrum von würdevoller, achtbarer Haltung. Die Fußnote dokumentiert die verbleibende Bedeutungsbreite.
