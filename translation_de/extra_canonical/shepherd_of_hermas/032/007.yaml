revisions:
- from: Halte dich also fern vom Jähzorn, diesem überaus bösen Geist. Kleide dich vielmehr in Langmut und widerstehe dem Jähzorn und der Bitterkeit; dann wird man dich bei jener Ehrbarkeit[a] finden, die der Herr liebt. Achte also darauf, dieses Gebot niemals außer Acht zu lassen. Denn wenn du dieses Gebot meisterst, wirst du auch die übrigen Gebote halten können, die ich dir noch geben werde. Werde stark in ihnen und lass dich stärken; und alle sollen gestärkt werden, die in ihnen wandeln wollen.
  to: Halte dich also fern vom Jähzorn, dem bösesten Geist. Kleide dich vielmehr in Langmut und widerstehe dem Jähzorn und der Bitterkeit; dann wirst du mit der Würde[a] verbunden sein, die der Herr liebt. Achte also darauf, dieses Gebot niemals außer Acht zu lassen. Denn wenn du dieses Gebot meisterst, wirst du auch die übrigen Gebote halten können, die ich dir noch geben werde. Sei stark in ihnen und lass dich in ihnen stärken; und alle, die in ihnen wandeln wollen, sollen gestärkt werden.
  rationale: Die Revision beseitigt die unbelegte demonstrative Zuspitzung, stellt den griechischen Superlativ deutlicher heraus, ersetzt das im heutigen Deutsch weniger passende „Ehrbarkeit“ durch „Würde“ und bindet die abschließende Aufforderung zur Stärkung ausdrücklich an die Gebote zurück. Die Ambiguität der Form von ἐνδυναμοῦ bleibt durch „lass dich ... stärken“ erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:42Z'
