    issue: „überaus bösen Geist“
    rationale: πον ηροτάτου ist ein Superlativ; „dem bösesten Geist“ bildet den Ausdruck unmittelbarer ab.
  - severity: low
    issue: „lass dich stärken“ ohne Bezug auf die Gebote
    rationale: ἐν αὐταῖς bezieht sich auch in der abschließenden Aufforderung auf die Gebote. Die Ergänzung „in ihnen“ verdeutlicht diesen Bezug und wahrt die mögliche passive Nuance von ἐνδυναμοῦ.
