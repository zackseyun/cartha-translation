base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: de
  text: Die Jähzornigkeit ist zunächst töricht, leichtfertig und unverständig. Dann entsteht aus der Unverständigkeit Bitterkeit, aus der Bitterkeit Zorn, aus dem Zorn Wut und aus der Wut Raserei. Schließlich wird diese Raserei, die sich aus so vielen Übeln zusammensetzt, zu einer großen und unheilbaren Sünde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: Jähzornigkeit
  rationale: Bezeichnet eine rasch aufflammende, reizbare Zorneshaltung; „Jähzornigkeit“ gibt den Charakterzug präziser wieder als bloß „Zorn“.
- source_word: μωρά
  choice: töricht
  rationale: Bewahrt die moralisch-intellektuelle Wertung des griechischen Ausdrucks in natürlichem Deutsch.
- source_word: ἐλαφρά
  choice: leichtfertig
  rationale: Im ethischen Zusammenhang meint das Wort Unbeständigkeit beziehungsweise mangelnde Besonnenheit, nicht körperliche Leichtigkeit.
- source_word: ἄφρων / ἀφροσύνη
  choice: unverständig / Unverständigkeit
  rationale: Die verwandten deutschen Formen bilden wie im Griechischen die Wortverbindung ab und unterscheiden diese Stufe von μωρά, „töricht“.
- source_word: θυμός
  choice: Zorn
  rationale: Gibt die aufflammende Gemütsbewegung wieder und lässt eine Steigerung zu den folgenden Begriffen erkennen.
- source_word: ὀργή
  choice: Wut
  rationale: Markiert gegenüber θυμός eine stärkere Stufe der geschilderten Eskalation.
- source_word: μῆνις
  choice: erbitterter Grimm
  rationale: Der starke Ausdruck bezeichnet anhaltenden, schwerwiegenden Zorn; die erweiterte Wiedergabe unterscheidet ihn klar von θυμός und ὀργή.
- source_word: ἀνίατος
  choice: unheilbar
  rationale: Entspricht unmittelbar der Krankheitsmetapher des griechischen Textes.
theological_decisions:
- issue: Die Aussage, dass Grimm zu einer „unheilbaren Sünde“ wird
  choice: wörtlich als „große und unheilbare Sünde“ bewahrt
  alternative: abschächend etwa „eine schwere, kaum heilbare Sünde“
  rationale: Der griechische Text formuliert ausdrücklich μεγάλη καὶ ἀνίατος. Die zugespitzte moralische Aussage soll nicht durch eine dogmatische Harmonisierung gemildert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die stufenweise Eskalation wird durch die wiederholte Satzform des griechischen Textes erhalten; zugleich werden die eng verwandten Zornbegriffe im Deutschen differenziert.
