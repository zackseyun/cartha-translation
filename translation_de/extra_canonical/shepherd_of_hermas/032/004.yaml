base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: de
  text: 'Du siehst also: Langmut ist süßer als Honig und für den Herrn brauchbar, und in ihr wohnt er. Die Jähzornigkeit dagegen ist bitter und nutzlos. Wird nun Jähzornigkeit mit Langmut vermischt, so wird die Langmut verunreinigt und ist für Gott nicht mehr brauchbar. Langmut trägt zu keiner Zeit etwas Bitteres in sich, sondern bleibt stets sanft und ruhig. Diese Langmut wohnt also bei denen, die einen ungeteilten Glauben haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und das lange Ertragen von Belastungen; „Langmut“ bewahrt den ethischen Leitbegriff und den Kontrast zur Jähzornigkeit.
- source_word: ὀξυχολία
  choice: Jähzornigkeit
  rationale: Meint rasch aufwallenden Zorn bzw. Reizbarkeit; „Jähzornigkeit“ gibt sowohl die Plötzlichkeit als auch den charakterlichen Zug wieder.
- source_word: εὔχρηστος / ἄχρηστος
  choice: brauchbar / nutzlos
  rationale: Bewahrt das Bild von etwas, das dem Herrn zum Gebrauch dient oder dafür untauglich ist.
- source_word: πραεῖα καὶ ἡσύχιος
  choice: sanft und ruhig
  rationale: Gibt die beiden komplementären Eigenschaften natürlich und ohne unnötige Deutung wieder.
- source_word: τὴν πίστιν ... ὁλόκληρον
  choice: deren Glaube unversehrt ist
  rationale: ὁλόκληρος bezeichnet Ganzheit oder Unversehrtheit; die Formulierung wahrt diesen Sinn, ohne „vollkommen“ im Sinn moralischer Fehlerlosigkeit zu unterstellen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in „καὶ ἐν αὐτῇ κατοικεῖ“
  choice: „und in ihr wohnt er“, mit Bezug auf den Herrn
  alternative: „und der Herr wohnt in ihr“
  rationale: Der unmittelbare Bezug ist κύριος; die pronominale Wiedergabe erhält die Satzführung des Griechischen, ohne den theologischen Bezug auszuweiten.
- issue: Bedeutung des „unversehrten Glaubens“
  choice: Beschreibung eines ganzen, ungeteilten Glaubens
  alternative: „vollkommener Glaube“
  rationale: Die Übersetzung vermeidet, aus ὁλόκληρος eine Aussage über absolute geistliche Vollkommenheit zu machen, und bewahrt zugleich den Anspruch des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische Bildsprache von Süße und Bitterkeit sowie Brauchbarkeit und Nutzlosigkeit bleibt erhalten. „Langmut“ ist leicht gehoben, aber als zentraler frühchristlicher Tugendbegriff präzise und verständlich.
