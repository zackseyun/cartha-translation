lexical_decisions:
- source_word: ποιῆσαι αὐτοὺς ἐν τῇ πίστει
  choice: um sie im Glauben zu festigen
  rationale: Die wörtliche Fügung »sie im Glauben zu machen« wäre im Deutschen unverständlich. »Im Glauben festigen« gibt die kontextuelle Bedeutung der elliptischen griechischen Wendung natürlich und präzise wieder; der Infinitiv wird als Zwecksatz wiedergegeben.
