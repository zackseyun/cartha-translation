base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: de
  text: 'Ich sage zu ihm: »Herr, jetzt bin ich in allen Weisungen des Herrn gestärkt worden, denn du bist mit mir. Ich weiß, dass du alle Macht des Teufels zerschlagen wirst; wir werden ihn bezwingen und gegen alle seine Werke die Oberhand gewinnen. Und ich hoffe, Herr, dass ich diese Gebote, die du geboten hast, jetzt halten kann, wenn der Herr mich stärkt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιώμασι
  choice: was der Herr als recht festgesetzt hat
  rationale: Die Umschreibung gibt den Sinn von verbindlichen, gerechten Festsetzungen wieder, ohne den Ausdruck vorschnell mit den unmittelbar danach genannten ἐντολαί gleichzusetzen.
- source_word: συγκόψεις
  choice: brechen wirst
  rationale: Das Verb bezeichnet hier das Zerschlagen oder Unwirksammachen einer Macht; „brechen“ ist im Deutschen natürlich und bewahrt das kraftvolle Bild.
- source_word: κατακυριεύσομεν
  choice: wir werden ihn bezwingen
  rationale: Die Form bezeichnet das Erlangen von Herrschaft oder Überlegenheit über den Teufel; „bezwingen“ vermittelt dies idiomatisch, ohne eine dauerhafte absolute Herrschaft zu behaupten.
- source_word: κατισχύσομεν πάντων τῶν ἔργων αὐτοῦ
  choice: alle seine Werke überwinden
  rationale: Die Wiedergabe wahrt den Gedanken, gegenüber sämtlichen Werken des Teufels die Oberhand zu gewinnen.
- source_word: φυλάξαι
  choice: halten kann
  rationale: Bei Geboten bedeutet φυλάσσειν, sie zu beachten und zu befolgen; „Gebote halten“ ist zugleich klar und traditionsnah.
theological_decisions:
- issue: Verhältnis menschlichen Gehorsams zur Stärkung durch den Herrn
  choice: „dass ich … halten kann, wenn der Herr mich stärkt“
  alternative: „dass ich … aus eigener Kraft halten kann“
  rationale: Der griechische Genitivus absolutus τοῦ Κυρίου ἐνδυναμοῦντος macht die Befähigung durch den Herrn ausdrücklich zur Voraussetzung und lässt keinen rein autonomen Gehorsam erkennen.
- issue: Anrede „Herr“ und Bezeichnung „der Herr“
  choice: Beide Vorkommen werden als „Herr“ wiedergegeben, während der bestimmte Artikel in „der Herr“ die sprachliche Unterscheidung des griechischen Textes bewahrt.
  alternative: Die angeredete Gestalt ausdrücklich als „Engel“ oder die zweite Bezeichnung ausdrücklich als „Gott“ identifizieren.
  rationale: Der Ausgangstext nennt in diesem Vers weder die angeredete Gestalt noch „den Herrn“ ausdrücklich anders; eine weitergehende Identifizierung würde die vorhandene Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die Satzstruktur wurde behutsam geglättet, während Wiederholungen wie „Herr“ und die Abfolge von Stärkung, Überwindung und Gebotserfüllung erhalten bleiben.
