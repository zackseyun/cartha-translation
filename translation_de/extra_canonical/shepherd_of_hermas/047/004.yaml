revisions:
- from: 'Ich sage zu ihm: »Herr, jetzt bin ich in allem gestärkt, was der Herr als recht festgesetzt hat, denn du bist bei mir. Ich weiß, dass du die ganze Macht des Teufels brechen wirst; wir werden ihn bezwingen und alle seine Werke überwinden. Und ich hoffe, Herr, dass ich diese Gebote, die du gegeben hast, jetzt halten kann, wenn der Herr mich stärkt.«'
  to: 'Ich sage zu ihm: »Herr, jetzt bin ich in allen Weisungen des Herrn gestärkt worden, denn du bist mit mir. Ich weiß, dass du alle Macht des Teufels zerschlagen wirst; wir werden ihn bezwingen und gegen alle seine Werke die Oberhand gewinnen. Und ich hoffe, Herr, dass ich diese Gebote, die du geboten hast, jetzt halten kann, wenn der Herr mich stärkt.«'
  rationale: Die Revision ersetzt eine unnötig ausdeutende und im Deutschen sperrige Umschreibung von δικαιώματα durch „Weisungen“, ohne den Ausdruck mit den später genannten „Geboten“ gleichzusetzen. Sie glättet zudem die Wiedergabe von κατισχύειν, bewahrt die Zukunftsaussagen sowie die offene Referenz von „Herr/der Herr“ und lässt die im Genitivus absolutus ausgedrückte Stärkung durch den Herrn als Bedingung bestehen.
