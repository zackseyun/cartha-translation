  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/003.yaml
  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: de
  text: Hört mir also zu und fürchtet den, der alles vermag, der retten und vernichten kann. Haltet diese Gebote, und ihr werdet für Gott leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: Hört also auf mich
  rationale: Gibt die Aufforderung zum aufmerksamen Hören und Befolgen natürlich wieder; οὖν wird mit „also“ markiert.
- source_word: τὸν πάντα δυνάμενον
  choice: den, der alles vermag
  rationale: Bewahrt die substantivierte Umschreibung und den umfassenden Sinn von πάντα.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: der retten und vernichten kann
  rationale: Die Infinitive erläutern, was der Genannte vermag. „Vernichten“ wahrt die starke Gegenüberstellung zu „retten“, ohne den Sinn vorschnell auf ewige Verdammnis festzulegen.
- source_word: τηρεῖτε τὰς ἐντολὰς ταύτας
  choice: Haltet diese Gebote
  rationale: „Halten“ ist im Deutschen eine natürliche und traditionsfähige Wiedergabe von τηρεῖν im Sinn von beachten und befolgen.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: dann werdet ihr für Gott leben
  rationale: Der Dativ τῷ Θεῷ wird als Bezugs- bzw. Zielangabe wiedergegeben. „Für Gott leben“ bewahrt die ungewöhnliche Formulierung besser als eine glättende Deutung wie „bei Gott leben“.
theological_decisions:
- issue: Reichweite von σῶσαι καὶ ἀπολέσαι
  choice: retten und vernichten
  alternative: retten und ins Verderben stürzen
  rationale: Die knappe, spannungsreiche Antithese bleibt erhalten; weder körperliches noch endzeitliches Verderben wird exklusiv festgelegt.
- issue: Bedeutung des Dativs in ζήσεσθε τῷ Θεῷ
  choice: für Gott leben
  alternative: bei Gott leben / vor Gott leben
  rationale: Der griechische Dativ ist knapp und mehrdeutig. Die gewählte Fassung bezeichnet Gott als Bezug und Ziel des Lebens, ohne eine bestimmte eschatologische Lesart einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direktem Mahnton. Die Satzteilung erhöht die Verständlichkeit, ohne die logische Folge des griechischen Textes aufzulösen.
