    issue: Wiedergabe von ἀκούσατε μου
    rationale: „Hört also auf mich“ kann auch „gehorcht mir“ nahelegen. „Hört mir also zu“ bildet die Aufforderung zum Hören genauer und idiomatischer ab.
  - severity: low
    issue: Folgernde Partikel „dann“ im Schlusssatz
    rationale: 'Das griechische καί verbindet schlicht: „und ihr werdet ... leben“. „Dann“ verstärkt den konditionalen Folgeschluss leicht über den Wortlaut hinaus.'
