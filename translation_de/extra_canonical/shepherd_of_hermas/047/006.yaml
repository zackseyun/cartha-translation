  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: de
  text: 'Du törichter, zwiespältiger[a] und erbärmlicher Mensch! Begreifst du nicht, dass all dies fremdes Eigentum ist und der Herrschaft eines anderen untersteht? Denn der Herr dieser Stadt wird sagen: »Ich will nicht, dass du in meiner Stadt wohnst. Verlass diese Stadt, denn du richtest dich nicht nach meinen Gesetzen.«


    Du hast nun Felder, Häuser und viele andere Besitztümer. Was wirst du mit deinem Feld, deinem Haus und allem Übrigen tun, was du dir bereitgelegt hast, wenn er dich hinauswirft? Denn der Herr dieses Landes sagt mit Recht zu dir: »Entweder du richtest dich nach meinen Gesetzen, oder du verlässt mein Land.« Was willst du nun tun, da du … hast?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »doppelseeliger«; gemeint ist ein innerlich geteilter und unbeständiger Mensch.'
    reason: Der griechische Ausdruck δίψυχος ist bildhaft und kann sowohl innere Zerrissenheit als auch schwankende Unbeständigkeit bezeichnen.
lexical_decisions:
- source_word: ἄφρον
  choice: törichter
  rationale: Gibt die moralisch-geistige Unvernunft des griechischen Ausdrucks in würdigem, gut verständlichem Deutsch wieder.
- source_word: δίψυχε
  choice: zwiespältiger
  rationale: Bezeichnet einen innerlich geteilten, unbeständigen Menschen; die Fußnote bewahrt zugleich das markante griechische Bild.
- source_word: ἀλλότρια
  choice: fremdes Eigentum
  rationale: Macht deutlich, dass die genannten Güter dem Angesprochenen letztlich nicht gehören, statt nur allgemein von etwas Fremdem zu sprechen.
- source_word: ὑπ᾽ ἐξουσίαν ἑτέρου
  choice: der Herrschaft eines anderen untersteht
  rationale: Bewahrt sowohl den Gedanken fremder Verfügungsgewalt als auch den Zusammenhang mit dem Herrn der Stadt.
- source_word: τοῖς νόμοις μου χρᾶσαι / χρῶ
  choice: dich nach meinen Gesetzen richtest
  rationale: Natürliches modernes Deutsch für das Befolgen beziehungsweise Einhalten der Gesetze; eine wörtliche Wiedergabe als „meine Gesetze gebrauchen“ wäre missverständlich.
- source_word: ὑπάρξεις
  choice: Besitztümer
  rationale: Deckt beweglichen und unbeweglichen Besitz allgemein ab und passt zur anschließenden Aufzählung.
theological_decisions:
- issue: Status irdischen Besitzes
  choice: „fremdes Eigentum“ und „der Herrschaft eines anderen untersteht“
  alternative: „fremd ist und in der Gewalt eines anderen steht“
  rationale: Die Übersetzung lässt die Aussage des Gleichnisses unangetastet, ohne den „anderen“ ausdrücklich mit einer bestimmten theologischen Gestalt gleichzusetzen.
- issue: Bedeutung von δίψυχος
  choice: „zwiespältig“ mit erklärender Fußnote
  alternative: „doppelherzig“ oder „unbeständig“
  rationale: „Zwiespältig“ bleibt verständlich und bewahrt die innere Geteiltheit, ohne sie ausschließlich als Heuchelei oder bloße Unentschlossenheit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, eindringlicher Anrede. Die Wiederholung von Stadt, Land und Besitz bleibt als tragende Bildsprache erhalten. Der Schluss bleibt entsprechend der unvollständig überlieferten beziehungsweise im bereitgestellten Ausschnitt abgebrochenen Form offen.
