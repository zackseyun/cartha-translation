review_pass:
  verdict: revise
  source_fidelity: 'Die vorgelegte griechische Lesart ist an der Bedingung grammatisch beschädigt. Im Zusammenhang ist sehr wahrscheinlich ein ausgefallenes μὴ und eine finite Form von κάμπτω vorauszusetzen (sinngemäß: „wenn du dich nicht deiner eigenen Stadt zuwendest/zurückwendest“). Die Fassung des Entwurfs gibt dagegen eine positive Bedingung wieder und verliert damit vermutlich eine textentscheidende Negation.'
  naturalness: „Gebote halten“ und „sagt er“ sind natürliches, würdiges modernes Standarddeutsch. „Sich einer Stadt zuneigen“ ist jedoch unnötig ungebräuchlich; „sich ... zuwenden“ bewahrt das Bild und ist idiomatischer.
  terminology: φυλάξεις wird mit „du wirst sie halten“ angemessen auf die zuvor genannten Gebote bezogen. „Eigene Stadt“ ist als bewusst nicht ausgelegtes Bild beizubehalten.
  issues:
  - severity: high
    issue: Die wahrscheinliche Negation der Bedingung fehlt in der Übersetzung.
    rationale: Die Sequenz ἐὰν ἡ κάμψαι ist offenbar verderbt. Der Kontext und die naheliegende Wiederherstellung ἐὰν μὴ κάμψῃς sprechen für „wenn du dich nicht ... zuwendest“. Ohne Negation wird der Sinn der Bedingung voraussichtlich umgekehrt.
  - severity: low
    issue: „zuneigst“ ist für die Stadtmetapher unidiomatisch.
    rationale: „Dich deiner eigenen Stadt zuwenden“ ist im modernen Deutsch klarer, ohne den bildhaften und nicht näher bestimmten Ausdruck auszudeuten.
  revised_text: „Du wirst sie halten“, sagt er, „wenn du dich nicht deiner eigenen Stadt zuwendest.“[a]
  revised_footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle offenbar beschädigt oder fehlerhaft überliefert (ἐὰν ἡ κάμψαι). Kontext und Grammatik legen eine Wiederherstellung wie ἐὰν μὴ κάμψῃς nahe: „wenn du dich nicht deiner eigenen Stadt zuwendest“.'
    reason: Die überlieferte Textgestalt lässt sich nicht regulär übersetzen; die deutsche Negation folgt der wahrscheinlichen Wiederherstellung, wird aber transparent als textkritisch unsicher ausgewiesen.
  revision_rationale: Eine sichere Korrektur ist nötig, weil die positive Bedingung des Entwurfs sehr wahrscheinlich auf einer beschädigten griechischen Überlieferung beruht und die vermutete Negation auslässt. Die Korrektur hält das Bild der „eigenen Stadt“ offen und kennzeichnet die Rekonstruktion in der Fußnote, statt sie als völlig gesicherten Wortlaut auszugeben.
