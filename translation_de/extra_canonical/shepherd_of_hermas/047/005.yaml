translation:
  language: de
  text: „Du wirst sie halten“, sagt er, „wenn du dich deiner eigenen Stadt zuneigst.“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist hier offenbar beschädigt oder fehlerhaft überliefert; sinngemäß ist eine Hinwendung zur „eigenen Stadt“ gemeint.
    reason: Die Folge ἐὰν ἡ κάμψαι ist in der vorgelegten griechischen Textgestalt grammatisch unklar, vermutlich infolge einer Text- oder OCR-Störung.
lexical_decisions:
- source_word: φυλάξεις
  choice: du wirst sie halten
  rationale: Das nicht eigens genannte Objekt sind die unmittelbar zuvor erwähnten Gebote; „halten“ gibt den gebotsethischen Sinn von φυλάσσω angemessen wieder.
- source_word: φησίν
  choice: sagt er
  rationale: Schlichte, gegenwartsnahe Wiedergabe der Redeeinleitung.
- source_word: κάμψαι εἰς τὴν ἰδίαν πόλιν
  choice: dich deiner eigenen Stadt zuneigst
  rationale: Gibt die erkennbare Bewegungsrichtung des problematisch überlieferten Ausdrucks wieder und bewahrt das Bild der „eigenen Stadt“, ohne es deutend aufzulösen.
theological_decisions:
- issue: Bedingung für das Halten der Gebote
  choice: Die Bedingungsform mit „wenn“ bleibt bestehen.
  alternative: Die Aussage als bloße Zusicherung oder als moralische Aufforderung umformulieren.
  rationale: Der griechische Bedingungssatz verbindet die verheißene Befähigung ausdrücklich mit einer Ausrichtung auf die „eigene Stadt“; diese Spannung soll nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dialogform und das Bild von der „eigenen Stadt“ bleiben erhalten; die unsichere Textstelle wird nicht stillschweigend geglättet, sondern in einer Fußnote ausgewiesen.
