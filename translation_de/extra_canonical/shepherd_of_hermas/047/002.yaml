  naturalness: Die lange Periode ist insgesamt verständlich und dem würdigen Register angemessen. „An eurem Leben verzweifelt habt“ ist im heutigen Standarddeutsch die natürliche Konstruktion. Ein Doppelpunkt nach „Gott“ bindet den nachfolgenden Konditionalsatz klar an den Glaubensaufruf, ohne die Aussage zu verändern.
  terminology: „Herr“, „Gerechtigkeit“, „Teufel“ und „Sünden“ sind passend und konsistent. „Heilung für eure früheren Sünden“ bewahrt die auffällige Metapher von ἴασις, ohne die Sünden selbst im Deutschen unnötig als unmittelbar heilbare Gegenstände zu behandeln.
