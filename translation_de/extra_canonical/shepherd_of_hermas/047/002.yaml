base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: de
  text: 'Darum glaubt Gott, ihr, die ihr wegen eurer Sünden an eurem Leben verzweifelt habt, weitere Sünden hinzufügt und euer Leben schwer belastet: Wenn ihr euch von ganzem Herzen zum Herrn umkehrt, an den übrigen Tagen eures Lebens Gerechtigkeit übt und ihm recht dient, seinem Willen entsprechend, dann wird er Heilung für eure früheren Sünden schaffen, und ihr werdet die Kraft haben, die Werke des Teufels zu überwinden. Fürchtet euch überhaupt nicht vor der Drohung des Teufels; denn er ist kraftlos wie die Sehnen eines Toten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε ... τῷ Θεῷ
  choice: glaubt Gott
  rationale: Der griechische Dativ bezeichnet hier die Person, der Vertrauen geschenkt wird; die knappe Form wahrt den direkten Aufruf.
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: an eurem Leben verzweifelt seid
  rationale: Gibt die vollendete Verzweiflung über das eigene Leben wieder, ohne sie als ausdrücklichen Verzicht auf das Heil auszudeuten.
- source_word: καταβαρύνοντες τὴν ζωὴν ὑμῶν
  choice: euer Leben schwer belastet
  rationale: Bewahrt das anschauliche Motiv des Niederdrückens durch eine Last in natürlichem Deutsch.
- source_word: ἐπιστραφῆτε πρὸς τὸν Κύριον
  choice: euch ... zum Herrn umkehrt
  rationale: Entspricht dem Bewegungs- und Umkehrsinn des Verbs und ist im religiösen Kontext verständlich.
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: Gerechtigkeit übt
  rationale: Bewahrt δικαιοσύνη als Gerechtigkeit und drückt zugleich das tätige Handeln aus.
- source_word: ποιήσει ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι
  choice: wird er eure früheren Sünden heilen
  rationale: Erhält die ungewöhnliche Heilungsmetapher des griechischen Textes, statt sie vorschnell als Vergebung zu paraphrasieren.
- source_word: κατακυριεῦσαι τῶν ἔργων τοῦ διαβόλου
  choice: die Werke des Teufels zu überwinden
  rationale: Gibt den Gedanken wieder, Gewalt über diese Werke zu gewinnen; „überwinden“ klingt im Deutschen natürlicher als „beherrschen“ und vermeidet den Eindruck, sie auszuüben.
- source_word: ἀπειλὴν τοῦ διαβόλου
  choice: Drohung des Teufels
  rationale: Formale und sachlich offene Wiedergabe; weder eine einzelne konkrete Drohung noch eine allgemeine Schreckensmacht wird ergänzt.
- source_word: ἄτονος
  choice: kraftlos
  rationale: Das Wort bezeichnet fehlende Spannung beziehungsweise Stärke und passt zum folgenden Vergleich mit Sehnen.
- source_word: ὥσπερ νεκροῦ νεῦρα
  choice: wie die Sehnen eines Toten
  rationale: Bewahrt das drastische körperliche Bild und die mögliche Bedeutung von νεῦρα als Sehnen.
theological_decisions:
- issue: Bedingungsgefüge von Umkehr, gerechtem Handeln und Heilung früherer Sünden
  choice: Die im Griechischen formulierte Bedingung bleibt ausdrücklich bestehen.
  alternative: Die Aussage als bedingungslose Vergebungszusage oder als bloßen Beweis bereits geschehener Vergebung formulieren.
  rationale: Der Ausgangstext verbindet die verheißene Heilung mit Umkehr, Gerechtigkeit und rechtem Dienst; diese Spannung darf nicht konfessionell aufgelöst werden.
- issue: Bedeutung der Heilung früherer Sünden
  choice: Die Heilungsmetapher wird wörtlich bewahrt.
  alternative: „Er wird euch eure früheren Sünden vergeben.“
  rationale: ἴασις bedeutet Heilung; „Vergebung“ wäre theologisch plausibel, würde aber das Bild interpretierend verengen.
- issue: Macht über die Werke des Teufels
  choice: Als verliehene Kraft zum Überwinden seiner Werke wiedergegeben.
  alternative: Als absolute Macht über den Teufel selbst formulieren.
  rationale: Der Text nennt ausdrücklich die Werke des Teufels, nicht uneingeschränkte Herrschaft über seine Person.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. Die langen griechischen Satzperioden wurden behutsam gegliedert, ohne ihre logische Folge zu verändern. Die auffällige Heilungsmetapher und das drastische Schlussbild bleiben erhalten.
