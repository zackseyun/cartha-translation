    issue: Unbegründete Konditionalisierung des Partizipialsatzes
    rationale: στεφανωθεὶς ist hier ein vorausgesetzter bzw. begleitender Umstand zu dem Imperativ ἐλθέ, nicht ein mit „wenn“ eingeleiteter Bedingungssatz.
  - severity: medium
    issue: „Errungen“ verstärkt die Aussage über den Sieg
    rationale: ὃ ἔλαβες bezeichnet den Sieg als „erhalten/empfangen“; „errungen“ legt stärker nahe, dass der Angesprochene ihn selbst erworben habe.
