base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: de
  text: 5. Nachdem du also über sie mit dem Siegeskranz gekrönt worden bist,[a] tritt zum Verlangen nach Gerechtigkeit. Übergib ihm den Sieg, den du empfangen hast, und diene ihm, wie es will. Wenn du dem guten Verlangen dienst und dich ihm unterordnest, wirst du das böse Verlangen beherrschen und es dir unterwerfen können, wie du willst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gegen sie gekrönt worden bist“; „sie“ bezieht sich auf das böse Verlangen. Gemeint ist das Bild der Bekränzung eines Siegers nach dem Kampf.'
    reason: Die Fußnote erläutert die im Deutschen ungewohnte Verbindung „über sie ... gekrönt“ und sichert zugleich den Bezug des weiblichen Pronomens auf das personifizierte böse Verlangen.
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: im Kampf gegen das böse Verlangen mit dem Siegeskranz gekrönt worden bist
  rationale: στεφανόω bezeichnet hier im Bild des siegreichen Kampfes das Bekränzen; κατ᾽ αὐτῆς bezieht sich auf das zuvor genannte böse Verlangen. Die Ergänzung „im Kampf“ erschließt das Bild, ohne dessen Siegesmotiv aufzulösen.
- source_word: ἐπιθυμία τῆς δικαιοσύνης
  choice: Verlangen nach Gerechtigkeit
  rationale: „Verlangen“ kann im Deutschen sowohl die gute als auch die böse Ausrichtung von ἐπιθυμία tragen und bewahrt so die absichtliche Gegenüberstellung des Abschnitts.
- source_word: παραδοὺς αὐτῇ τὸ νῖκος
  choice: Übergib ihm den Sieg
  rationale: Die auffällige Personifikation des guten Verlangens und das Bild der Übergabe des errungenen Sieges bleiben erhalten.
- source_word: δούλευσον αὐτῇ
  choice: diene ihm
  rationale: „Dienen“ gibt die bewusste Unterordnung von δουλεύω in würdigem, verständlichem Deutsch wieder.
- source_word: κατακυριεῦσαι
  choice: beherrschen
  rationale: Das Verb bezeichnet das Erlangen beziehungsweise Ausüben von Herrschaft über das böse Verlangen; „beherrschen“ ist hier idiomatisch und bewahrt das Herrschaftsmotiv.
theological_decisions:
- issue: Personifikation und Unterordnung unter das gute Verlangen
  choice: Die Aussagen „diene ihm“ und „ordne dich ihm unter“ werden unmittelbar beibehalten.
  alternative: Das gute Verlangen als göttliche Tugend oder als Heiliger Geist ausdrücklich identifizieren.
  rationale: Der griechische Text personifiziert das Verlangen nach Gerechtigkeit, bestimmt seine genaue theologische Identität aber nicht. Eine weitergehende Identifikation würde die Aussage konfessionell oder dogmatisch verengen.
- issue: Menschliches Handeln und Befähigung
  choice: 'Die konditionale Abfolge des Textes bleibt bestehen: Wer dem guten Verlangen dient, kann das böse beherrschen.'
  alternative: Die Fähigkeit ausdrücklich als ausschließlich göttliches Wirken oder als autonome menschliche Leistung erklären.
  rationale: Der Text hält Aufforderung, Unterordnung und daraus folgende Fähigkeit zusammen, ohne hier das Verhältnis von Gnade und menschlichem Willen systematisch zu erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konsequente Wiedergabe von ἐπιθυμία mit „Verlangen“ erhält die leitende Gegenüberstellung von gutem und bösem Verlangen, ohne beim guten Verlangen die heute meist negative Färbung von „Begierde“ einzutragen.
