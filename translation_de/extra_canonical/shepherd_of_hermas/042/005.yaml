review_pass:
  verdict: revise
  source_fidelity: Der Entwurf bewahrt die zentrale Personifikation von gutem und bösem Verlangen sowie die Abfolge von Sieg, Übergabe und Dienst. Allerdings macht „Wenn du ... gekrönt worden bist“ den einleitenden aoristischen Partizipialsatz zu einer Bedingung; der griechische Text setzt den Sieg vielmehr als gegeben voraus. Außerdem bedeutet ὃ ἔλαβες „den du empfangen/hast erhalten“, nicht ausdrücklich „den du errungen hast“.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch und insgesamt gut lesbar. „Nachdem du über sie den Siegeskranz empfangen hast“ bildet die griechische Voraussetzung ohne unnatürliche Konstruktion ab. Die Personifikation bleibt im Deutschen verständlich.
  terminology: „Verlangen nach Gerechtigkeit“, „gutes Verlangen“ und „böses Verlangen“ geben die wiederholte ἐπιθυμία-Terminologie konsistent wieder. „Dienen“, „unterordnen“, „beherrschen“ und „unterwerfen“ erhalten die Herrschafts- und Unterordnungsbilder, ohne sie dogmatisch auszudeuten.
  issues:
