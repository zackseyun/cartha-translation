base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: de
  text: 4 Du aber zieh das Verlangen nach Gerechtigkeit an und rüste dich mit der Furcht des Herrn; so widerstehe ihnen. Denn die Furcht Gottes wohnt in dem guten Verlangen. Wenn das böse Verlangen sieht, dass du mit der Furcht Gottes gerüstet bist und ihm widerstehst, wird es weit von dir fliehen und sich dir nicht mehr zeigen, weil es sich vor deinen Waffen fürchtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι τὴν ἐπιθυμίαν τῆς δικαιοσύνης
  choice: zieh das Verlangen nach Gerechtigkeit an
  rationale: Bewahrt das anschauliche Bild des Anziehens und gibt den Genitiv als Ausrichtung auf Gerechtigkeit wieder.
- source_word: καθοπλισάμενος τὸν φόβον τοῦ Κυρίου
  choice: rüste dich mit der Furcht des Herrn
  rationale: Gibt das militärische Bild natürlich wieder; die Furcht des Herrn erscheint als Ausrüstung beziehungsweise Waffe.
- source_word: ἀντίστηθι αὐταῖς
  choice: widerstehe ihnen
  rationale: Der Plural verweist auf die zuvor genannten bösen Begierden; deshalb bleibt er trotz des folgenden Singulars erhalten.
- source_word: ἡ ἐπιθυμία ἡ πονηρά
  choice: das böse Verlangen
  rationale: „Verlangen“ bildet ἐπιθυμία in diesem Abschnitt einheitlich ab, ohne den Ausdruck ausschließlich sexuell einzuengen.
- source_word: οὐκ ἔτι σοι ὀφθήσεται
  choice: sich dir nicht mehr zeigen
  rationale: Natürliches Deutsch für das Passiv von ὁράω und näher am Bild einer personifizierten Begierde als eine rein abstrakte Wiedergabe.
theological_decisions:
- issue: φόβος τοῦ Κυρίου / φόβος τοῦ Θεοῦ
  choice: Furcht des Herrn / Furcht Gottes
  alternative: Ehrfurcht vor dem Herrn / vor Gott
  rationale: „Furcht“ bewahrt die starke Sprache sowie die Waffen- und Fluchtmetaphorik; der Wechsel zwischen „Herr“ und „Gott“ wird wie im Griechischen erhalten.
- issue: Personifizierung des bösen Verlangens
  choice: Die personifizierende Rede bleibt durch „sieht“, „fliehen“, „zeigen“ und „fürchtet“ erhalten.
  alternative: Abstrakte Umschreibung als Überwindung innerer Neigungen
  rationale: Der Quelltext stellt das böse Verlangen als handelnden Gegner dar; diese Spannung soll nicht rationalisierend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wortfamilie ἐπιθυμία wird konsequent mit „Verlangen“ wiedergegeben; die Rüstungsmetaphorik und der Wechsel vom pluralischen Rückverweis („ihnen“) zum personifizierten Singular („das böse Verlangen“) bleiben erhalten.
