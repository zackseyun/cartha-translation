source:
  text: Πάντων προέχουσα ἐπιθυμία γυναικὸς ἀλλοτρίας ἢ ἀνδρός, καὶ πολυτελείας πλούτου καὶ ἐδεσμάτων πολλῶν ματαίων καὶ μεθυσμάτων, καὶ ἑτέρων τρυφῶν πολλῶν καὶ μωρῶν· πᾶσα γὰρ τρυφὴ μωρά ἐστι καὶ κενὴ τοῖς δούλοις τοῦ Θεοῦ. 2. αὗται οὖν αἱ ἐπιθυμίαι πονηραί εἰσι, θανατοῦσαι τοὺς δούλους τοῦ Θεοῦ. αὕτη γὰρ ἡ ἐπιθυμία ἡ πονηρὰ τοῦ διαβόλου θυγάτηρ ἐστίν. ἀπέχεσθαι οὖν δεῖ ἀπὸ τῶν ἐπιθυμιῶν τῶν πονηρῶν, ἵνα ἀποσχόμενοι ζήσητε τῷ Θεῷ. 3. ὅσοι δὲ ἂν κατακυριευθῶσιν ὑπ᾽ αὐτῶν καὶ μὴ ἀντισταθῶσιν αὐταῖς, ἀποθανοῦνται εἰς τέλος· θανατώδεις γάρ εἰσιν αἱ ἐπιθυμίαι αὗται. 4. σὺ δὲ ἔνδυσαι τὴν ἐπιθυμίαν τῆς δικαιοσύνης, καὶ καθοπλισάμενος τὸν φόβον τοῦ Κυρίου ἀντίστηθι αὐταῖς. ὁ γὰρ φόβος τοῦ Θεοῦ κατοικεῖ ἐν τῇ ἐπιθυμίᾳ τῇ ἀγαθῇ. ἡ ἐπιθυμία ἡ πονηρά, ἐὰν ἴδῃ σε καθωπλισμένον τῷ φόβῳ τοῦ Θεοῦ καὶ ἀνθεστηκότα αὐτῇ, φεύξεται ἀπὸ σοῦ μακράν, καὶ οὐκ ἔτι σοι ὀφθήσεται φοβουμένη τὰ ὅπλα σου. 5. σὺ οὖν στεφανωθεὶς κατ᾽ αὐτῆς ἐλθὲ πρὸς τὴν ἐπιθυμίαν τῆς δικαιοσύνης, καὶ παραδοὺς αὐτῇ τὸ νῖκος ὃ ἔλαβες, δούλευσον
    αὐτῇ καθὼς αὐτὴ βούλεται. ἐὰν δουλεύσῃς τῇ ἐπιθυμίᾳ τῇ ἀγαθῇ καὶ ὑποταγῇς αὐτῇ, δυνήσῃ τῆς ἐπιθυμίας τῆς πονηρᾶς κατακυριεῦσαι καὶ ὑποτάξαι αὐτὴν καθὼς βούλει.
