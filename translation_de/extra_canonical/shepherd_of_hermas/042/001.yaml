base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the servants of God.
translation:
  language: de
  text: An erster Stelle steht das Verlangen nach der Frau oder dem Mann eines anderen, nach Luxus und Reichtum, nach vielerlei unnützen Speisen und berauschenden Getränken und nach vielen anderen törichten Genüssen. Denn jeder Genuss ist für die Diener Gottes töricht und leer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων προέχουσα
  choice: An erster Stelle steht
  rationale: Gibt den Vorrang innerhalb der aufgeführten bösen Begierden natürlich und prägnant wieder.
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Bezeichnet hier ein begehrendes Streben; „Verlangen“ wahrt den Zusammenhang, ohne bereits mit „Begierde“ stärker zu werten als der Satzanfang selbst.
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: nach der Frau oder dem Mann eines anderen
  rationale: Bewahrt die geschlechtlich parallele Formulierung des Griechischen und macht den Bezug auf eine Person deutlich, die einem anderen verbunden ist.
- source_word: πολυτελείας πλούτου
  choice: nach einem Leben im Luxus und Reichtum
  rationale: Die kompakte und textlich schwierige Genitivverbindung wird als Verlangen nach luxuriösem, wohlhabendem Leben verständlich wiedergegeben, ohne Luxus und Reichtum gleichzusetzen.
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: nach vielerlei unnützen Speisen
  rationale: „Vielerlei“ gibt πολλῶν idiomatisch wieder; „unnütz“ wahrt die Grundbedeutung von ματαίων und die moralische Kritik des Kontexts.
- source_word: μεθυσμάτων
  choice: berauschenden Getränken
  rationale: Bezeichnet Getränke beziehungsweise Trinkgenüsse, die Trunkenheit hervorrufen; diese Wiedergabe ist im Deutschen klarer als ein ungebräuchliches Substantiv.
- source_word: τρυφῶν
  choice: Genüssen
  rationale: Erfasst selbstverwöhnenden, üppigen Genuss in natürlichem Deutsch; „dieser Art“ im Folgesatz hält den Bezug auf die verurteilte Ausschweifung fest.
- source_word: δούλοις τοῦ Θεοῦ
  choice: Diener Gottes
  rationale: Dignified and established German rendering that preserves service and belonging without unnecessary archaism.
theological_decisions:
- issue: Reichweite der Aussage πᾶσα γὰρ τρυφὴ μωρά ἐστι καὶ κενή
  choice: „jeder Genuss dieser Art“
  alternative: „jeder Genuss“
  rationale: Der unmittelbare Kontext spricht von luxuriösen und törichten Ausschweifungen. Die kontextuelle Ergänzung vermeidet die sachlich irreführende Behauptung, ausnahmslos jede Form von Freude oder Genuss sei verwerflich, ohne die asketische Schärfe des Textes aufzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählungsstruktur. Keine Fußnoten erforderlich. Der Text bleibt nahe an der griechischen Syntax, löst jedoch die gedrängten Genitivverbindungen idiomatisch auf.
