  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: de
  text: 3. Alle aber, die von ihnen beherrscht werden und ihnen nicht widerstehen, werden endgültig sterben; denn diese Begierden bringen den Tod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: beherrscht werden
  rationale: Das Verb bezeichnet ein machtvolles Unterwerfen oder Beherrschen; die passive Form wird im Deutschen natürlich wiedergegeben.
- source_word: ἀντισταθῶσιν
  choice: ihnen nicht widerstehen
  rationale: Bewahrt die Vorstellung aktiven Widerstands gegen die zuvor genannten bösen Begierden.
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: werden endgültig sterben
  rationale: εἰς τέλος verstärkt oder qualifiziert das Sterben. »Endgültig« bewahrt den Ernst der Aussage, ohne die genaue theologische Art des Todes näher festzulegen.
- source_word: θανατώδεις
  choice: bringen den Tod
  rationale: Das Adjektiv bedeutet tödlich bzw. todbringend. Die verbale Wendung ist in modernem Deutsch klar und bewahrt die ursächliche Aussage.
- source_word: ἐπιθυμίαι
  choice: Begierden
  rationale: Im Zusammenhang sind schädliche, böse Verlangen gemeint. »Begierden« hält den moralisch negativen Ton und den Bezug zum vorigen Abschnitt fest.
theological_decisions:
- issue: Art und Endgültigkeit des angekündigten Todes
  choice: »werden endgültig sterben« ohne weitere Bestimmung
  alternative: »werden völlig zugrunde gehen« oder eine ausdrückliche Deutung als geistlicher bzw. ewiger Tod
  rationale: Der griechische Text sagt ἀποθανοῦνται εἰς τέλος, bestimmt aber nicht ausdrücklich, ob körperlicher, geistlicher oder eschatologischer Tod gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Knappes, mahnendes und würdiges modernes Standarddeutsch. Das wiederholte Motiv der Begierden als herrschende und todbringende Mächte bleibt erhalten.
