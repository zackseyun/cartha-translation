  terminology: „Begierden“ wahrt den Zusammenhang mit dem wiederholten griechischen ἐπιθυμίαι und den moralisch mahnenden Registerton. „Beherrscht“ und „widerstehen“ bewahren das Bild gegensätzlicher Macht und aktiven Widerstands. Keine Namen, theologischen Fachbegriffe oder Fußnotenanker sind betroffen.
