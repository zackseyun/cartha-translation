  source_fidelity: 'Der Text gibt die Satzstruktur und die zentralen Aussagen des Griechischen zuverlässig wieder: κατακυριευθῶσιν als „beherrscht werden“, ἀντισταθῶσιν als „widerstehen“, ἀποθανοῦνται εἰς τέλος als nachdrücklich-finales Sterben und θανατώδεις als todbringende Eigenschaft der Begierden. Die pronominalen Bezüge („ihnen“, „diese Begierden“) sind eindeutig auf die zuvor genannten bösen Begierden bezogen.'
