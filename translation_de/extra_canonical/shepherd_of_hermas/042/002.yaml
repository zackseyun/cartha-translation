  to: 2. Das also sind böse Begierden, die Gottes Diener töten. Denn diese böse Begierde ist eine Tochter des Teufels. Darum muss man sich der bösen Begierden enthalten, damit ihr, wenn ihr euch ihrer enthaltet, für Gott lebt.
