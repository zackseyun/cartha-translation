base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the servants of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: de
  text: 2. Das also sind böse Begierden, die Gottes Diener töten. Denn diese böse Begierde ist eine Tochter des Teufels. Darum muss man sich der bösen Begierden enthalten, damit ihr, wenn ihr euch ihrer enthaltet, für Gott lebt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι πονηραί
  choice: böse Begierden
  rationale: Gibt sowohl den starken inneren Drang von ἐπιθυμία als auch die moralische Wertung πονηραί prägnant und traditionsnah wieder.
- source_word: θανατοῦσαι
  choice: die … in den Tod führen
  rationale: Bewahrt die tödliche Wirkung des Partizips, klingt im modernen Deutschen jedoch natürlicher als das wörtliche „tötend“.
- source_word: ἀπέχεσθαι
  choice: sich … fernhalten
  rationale: Drückt bewusste Enthaltung beziehungsweise Distanzierung idiomatisch aus.
- source_word: ζήσητε τῷ Θεῷ
  choice: für Gott lebt
  rationale: Bewahrt den Dativbezug zu Gott und die offene theologische Aussage, ohne sie als „durch Gott“ oder „bei Gott“ umzudeuten.
theological_decisions:
- issue: Personifizierung der bösen Begierde
  choice: „diese böse Begierde ist eine Tochter des Teufels“
  alternative: „die böse Begierde stammt vom Teufel“
  rationale: Die ausdrückliche Metapher θυγάτηρ („Tochter“) wird bewahrt und nicht zu einer bloßen Herkunftsaussage abgeschwächt.
- issue: Wechsel zwischen Plural und Singular
  choice: Plural „Begierden“ in den Rahmensätzen, Singular „diese böse Begierde“ im Begründungssatz
  alternative: durchgehend Plural oder Singular
  rationale: Folgt dem griechischen Wortlaut und bewahrt dessen mögliche Zusammenfassung der genannten Begierden als personifizierte böse Begierde.
- issue: Zielbestimmung τῷ Θεῷ
  choice: „für Gott lebt“
  alternative: „Gott lebt“ oder „vor Gott lebt“
  rationale: „Für Gott“ gibt den Dativ am unmittelbarsten wieder und lässt die Beziehungsaussage in ihrer theologischen Spannung stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer paränetischer Sprache. Die generische Bezeichnung „Gottes Diener“ entspricht dem historischen Bildfeld des Textes; der direkte Wechsel zu „ihr“ folgt dem griechischen Numeruswechsel.
