base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: de
  text: '2. »Und die anderen, die du in großer Zahl daliegen sahst und die nicht in den Bau gelangen: Das sind die mit dem Ausschlag. Sie haben die Wahrheit erkannt, sind aber nicht in ihr geblieben und haben sich auch nicht den Heiligen angeschlossen. Deshalb sind sie unbrauchbar.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: die mit dem Ausschlag
  rationale: Das Partizip bezeichnet im Bild der Steine einen schorfigen beziehungsweise von einem Hautausschlag befallenen Zustand. Die konkrete Bildsprache bleibt erhalten, ohne das seltene und missverständliche Wort »räudig« zu verwenden.
- source_word: ἐγνωκότες τὴν ἀλήθειαν
  choice: Sie haben die Wahrheit erkannt
  rationale: Gibt den resultativen Sinn des Perfekts natürlich wieder und bewahrt »die Wahrheit« als bestimmten theologischen Begriff.
- source_word: μὴ ἐπιμείναντες δὲ ἐν αὐτῇ
  choice: sind aber nicht in ihr geblieben
  rationale: Bewahrt die räumliche Metapher von ἐν αὐτῇ und den Gegensatz zwischen Erkenntnis und fehlendem Beharren.
- source_word: μηδὲ κολλώμενοι τοῖς ἁγίοις
  choice: und haben sich auch nicht den Heiligen angeschlossen
  rationale: κολλάομαι bezeichnet ein enges Sich-Anschließen oder Verbinden. »Den Heiligen« lässt die frühchristliche Bezeichnung für die zur Gemeinschaft der Glaubenden Gehörenden stehen.
- source_word: ἄχρηστοί
  choice: unbrauchbar
  rationale: 'Entspricht dem Baukontext: Diese Steine eignen sich nicht zur Verwendung im Turmbau.'
theological_decisions:
- issue: Bedeutung von τοῖς ἁγίοις
  choice: den Heiligen
  alternative: der Gemeinde / den Gläubigen
  rationale: Die wörtliche, im frühen Christentum geläufige Personenbezeichnung wird bewahrt; eine institutionelle Präzisierung würde die Vorlage stärker auslegen.
- issue: Zeitlicher Aspekt von ἐγνωκότες
  choice: haben die Wahrheit erkannt
  alternative: kannten die Wahrheit
  rationale: Das Perfekt hebt die erlangte Erkenntnis hervor, während die folgenden Aoristpartizipien ihr späteres Nichtverbleiben beschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und das Stein-/Baugleichnis bleiben deutlich; ungewöhnliche Bildsprache wird verständlich, aber nicht entbildlicht wiedergegeben.
