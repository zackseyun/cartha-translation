  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: de
  text: 4. Die aber, die verstümmelt sind, das sind diejenigen, die gläubig geworden sind und deren größerer Teil von Gerechtigkeit geprägt ist, die aber auch gewisse Anteile von Gesetzlosigkeit haben. Deshalb sind sie verstümmelt und nicht vollständig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κεκολοβωμένοι / κολοβοί
  choice: die, denen Stücke fehlen / ihnen fehlen Stücke
  rationale: Das Bild beschädigter, unvollständiger Steine bleibt erhalten; das im Deutschen bei Personen missverständliche oder unnötig körperlich wirkende „verstümmelt“ wird vermieden.
- source_word: πεπιστευκότες
  choice: zum Glauben gekommen
  rationale: Das Perfekt bezeichnet einen vollzogenen Glaubensschritt mit fortwirkendem Ergebnis.
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: zum größten Teil in der Gerechtigkeit leben
  rationale: Gibt die ungewöhnliche räumlich-anteilige Formulierung in verständlichem Deutsch wieder, ohne den ethischen Sinn von δικαιοσύνη auf bloßen Besitz zu reduzieren.
- source_word: τινὰ μέρη ἔχουσιν τῆς ἀνομίας
  choice: in einigen Bereichen an der Gesetzlosigkeit festhalten
  rationale: Bewahrt den Gegensatz von überwiegender Gerechtigkeit und verbleibenden Anteilen der Gesetzlosigkeit und formuliert ihn natürlich.
- source_word: ὁλοτελεῖς
  choice: vollständig
  rationale: Entspricht dem Kontrast zu den Steinen, denen Teile fehlen, und vermeidet eine zusätzliche Deutung wie „vollkommen“.
theological_decisions:
- issue: Verhältnis von Glauben, Gerechtigkeit und Gesetzlosigkeit
  choice: Der Text beschreibt Glaubende, deren Leben überwiegend von Gerechtigkeit geprägt ist, während Bereiche der Gesetzlosigkeit fortbestehen.
  alternative: Die Aussage als quantitative Zuteilung von Heilsverdienst oder als völlige sittliche Vollkommenheit zu deuten.
  rationale: Die Bildsprache spricht von unvollständigen Steinen und bewahrt bewusst die Spannung zwischen wirklichem Glauben, überwiegender Gerechtigkeit und verbleibender Gesetzlosigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Steinmetaphorik des Zusammenhangs wird klar gehalten; keine Fußnote ist für diesen kurzen Abschnitt erforderlich.
