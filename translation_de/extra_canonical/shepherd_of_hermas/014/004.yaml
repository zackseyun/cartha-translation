  verdict: revise
  source_fidelity: Die Grundbedeutung ist getroffen, doch die Umschreibungen „denen Stücke fehlen“ und „in einigen Bereichen an der Gesetzlosigkeit festhalten“ entfernen sich unnötig von der konsequenten Bildsprache und von der anteilhaften Formulierung des griechischen Textes. κεκολοβωμένοι/κολοβοί bezeichnet ausdrücklich Verstümmelte bzw. unvollständige Steine; der Kontext trägt dieses Bild.
  naturalness: Die vorliegende Fassung ist gut verständlich. Eine leicht stärker quellennah formulierte Fassung bleibt in modernem Standarddeutsch natürlich, wenn sie die Metapher als solche stehen lässt.
  terminology: „Gerechtigkeit“ und „Gesetzlosigkeit“ geben δικαιοσύνη und ἀνομία angemessen wieder. „Zum Glauben gekommen“ ist möglich, aber „gläubig geworden“ bildet πεπιστευκότες als erreichten und fortdauernden Zustand etwas unmittelbarer ab.
  issues:
  - severity: medium
    issue: Die Steinmetapher wird durch „denen Stücke fehlen“ und „ihnen fehlen Stücke“ paraphrasiert.
    rationale: Das Griechische nennt die Betreffenden „verstümmelt“ bzw. „unvollständig“ und schließt damit an die Steinallegorie des Abschnitts an. Die direkte Metapher sollte nicht ohne Not abgeschwächt werden.
  - severity: low
    issue: „an der Gesetzlosigkeit festhalten“ fügt ein Moment des willentlichen Festhaltens hinzu.
    rationale: τινὰ μέρη ἔχουσιν τῆς ἀνομίας sagt zunächst, dass sie gewisse Anteile der Gesetzlosigkeit haben. Die neutralere anteilhafte Wiedergabe bewahrt diese Aussage genauer.
  revised_text: 4. Die aber, die verstümmelt sind, das sind diejenigen, die gläubig geworden sind und deren größerer Teil von Gerechtigkeit geprägt ist, die aber auch gewisse Anteile von Gesetzlosigkeit haben. Deshalb sind sie verstümmelt und nicht vollständig.
