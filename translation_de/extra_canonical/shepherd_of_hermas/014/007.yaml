base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: de
  text: '7. Nimm zuerst dich selbst als Beispiel: Als du reich warst, warst du unbrauchbar; jetzt aber bist du brauchbar und dem Leben dienlich. Werdet Gott nützlich; denn auch du selbst sollst dieselben Steine verwenden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: Erkenne es zuerst an dir selbst
  rationale: Gibt die Aufforderung idiomatisch wieder; das textkritisch unsichere δέ verlangt im Deutschen keine eigene Entsprechung.
- source_word: ἄχρηστος / εὔχρηστος
  choice: unbrauchbar / brauchbar
  rationale: Bewahrt das Leitmotiv der für den Turmbau ungeeigneten beziehungsweise geeigneten Steine und die bewusste Wiederholung.
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: dem Leben dienlich
  rationale: Lässt den Dativ τῇ ζωῇ in seiner möglichen Beziehung auf das Leben offen und vermeidet eine unbelegte Präzisierung wie „für andere Menschen“.
- source_word: εὔχρηστοι γίνεσθε τῷ Θεῷ
  choice: Werdet für Gott brauchbar
  rationale: Der Pluralwechsel des griechischen Textes wird erhalten, obwohl zuvor Hermas im Singular angesprochen wird.
- source_word: χρᾶσαι ἐκ τῶν αὐτῶν λίθων
  choice: wirst aus eben diesen Steinen gebraucht
  rationale: Bewahrt die schwierige und offenbar bildhafte Formulierung des überlieferten Textes, statt sie stillschweigend zu glätten.
theological_decisions:
- issue: Beziehung von Reichtum, Brauchbarkeit und Leben
  choice: Die Aussage wird eng am Bildfeld von Brauchbarkeit und Bau belassen.
  alternative: „Jetzt aber bist du für das Leben nützlich“ oder eine Auslegung auf Heil beziehungsweise Gemeindedienst.
  rationale: Der griechische Dativ und der unmittelbare Kontext erlauben mehrere Nuancen; eine theologische Präzisierung wäre interpretierend.
- issue: Numeruswechsel vom Singular zum Plural
  choice: „Werdet“ im Plural wird beibehalten.
  alternative: „Werde für Gott brauchbar“ im Singular.
  rationale: Der auffällige Wechsel steht im griechischen Text und kann eine allgemeine Mahnung an die Lesenden darstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Wörter „brauchbar/unbrauchbar“ halten den Zusammenhang mit dem Gleichnis vom Turmbau sichtbar. Der unvermittelte Wechsel zum Plural und die Sperrigkeit des Schlusssatzes werden als Merkmale der Quelle bewahrt.
