  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἄχρηστος/εὔχρηστος als „unbrauchbar/brauchbar“ wahrt das durchgehende Bildfeld. Der Schlusssatz ist jedoch fehlübersetzt: χρᾶσαι ist hier eine Aufforderung an Hermas, dieselben Steine zu verwenden, nicht die Aussage, Hermas werde aus Steinen „gebraucht“.'
  naturalness: Der Text ist insgesamt würdevoll und verständlich. „Nimm zuerst dich selbst als Beispiel“ ist für ἀπὸ σεαυτοῦ πρῶτον γνῶθι im Deutschen natürlicher als „Erkenne es zuerst an dir selbst“. Die direkte Aufforderung am Schluss ist klar und idiomatisch.
  terminology: „brauchbar“ bewahrt die Verbindung zu den für den Bau geeigneten Steinen. „Gott nützlich“ gibt εὔχρηστοι τῷ Θεῷ mit passender deutscher Rektion wieder. „Leben“ bleibt ohne theologische Einengung stehen.
  issues:
  - severity: high
    issue: Der letzte Satz ist als Passiv („wirst ... gebraucht“) übersetzt.
    rationale: 'Das überlieferte χρᾶσαι ist als Aufforderung zu verstehen: Hermas selbst soll ebenfalls dieselben Steine verwenden. Die passive Lesart verändert die Satzfunktion und den Sinn; auch die englische Audit-Fassung scheint diesen Fehler zu teilen.'
  revised_text: '7. Nimm zuerst dich selbst als Beispiel: Als du reich warst, warst du unbrauchbar; jetzt aber bist du brauchbar und dem Leben dienlich. Werdet Gott nützlich; denn auch du selbst sollst dieselben Steine verwenden.'
