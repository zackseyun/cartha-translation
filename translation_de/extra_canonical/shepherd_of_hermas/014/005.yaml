base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: de
  text: '5. »Und wer sind die weißen, runden Steine, die nicht in den Bau passen, Herrin?« Sie antwortete mir: »Wie lange willst du noch töricht und unverständig sein, alles erfragen und nichts begreifen? Das sind diejenigen, die zwar Glauben haben, aber auch den Reichtum dieser Welt besitzen. Wenn Bedrängnis kommt, verleugnen sie ihren Herrn wegen ihres Reichtums und ihrer Geschäfte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: die weißen, runden Steine
  rationale: Die Substantivierung bezieht sich im Kontext eindeutig auf die zuvor besprochenen Steine; die Ergänzung macht das Bild im Deutschen verständlich.
- source_word: οἰκοδομή
  choice: Bau
  rationale: Bewahrt das konkrete Bild des Turmbaus und klingt hier natürlicher als das abstraktere „Erbauung“.
- source_word: κυρία
  choice: Herrin
  rationale: Gibt die respektvolle direkte Anrede wieder, ohne sie mit einem Eigennamen oder theologischen Titel anzureichern.
- source_word: ἕως πότε
  choice: Wie lange willst du noch
  rationale: Natürliche deutsche Wiedergabe der vorwurfsvollen zeitlichen Frage.
- source_word: πίστιν
  choice: Glauben
  rationale: Die unbestimmte Form des Griechischen bleibt erhalten; der Begriff wird nicht konfessionell präzisiert.
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: den Reichtum dieser Weltzeit
  rationale: „Weltzeit“ bewahrt den zeitlich-eschatologischen Sinn von αἰών besser als bloß „Welt“.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: Deckt Not, Druck und Verfolgung ab, ohne die Ursache enger festzulegen.
- source_word: πραγματείας
  choice: Geschäfte
  rationale: Bezeichnet geschäftliche Tätigkeiten beziehungsweise Unternehmungen in knapper, moderner Sprache.
- source_word: ἀπαρνοῦνται
  choice: verleugnen
  rationale: Gibt die bewusste Lossagung vom Herrn deutlich wieder.
theological_decisions:
- issue: Verhältnis von Glauben und Reichtum
  choice: „die zwar Glauben haben, aber auch den Reichtum dieser Weltzeit besitzen“
  alternative: „die glauben und zugleich reich sind“
  rationale: 'Die gewählte Fassung wahrt die Spannung des griechischen μὲν … δὲ: Ihr Glaube wird anerkannt, während ihr Reichtum im folgenden Krisenfall zum Anlass der Verleugnung wird.'
- issue: Art der Bedrängnis
  choice: „Wenn Bedrängnis kommt“
  alternative: „Wenn Verfolgung kommt“
  rationale: θλῖψις ist weiter als „Verfolgung“; die Übersetzung legt nicht fest, ob äußerer Druck, Not oder gezielte Verfolgung gemeint ist.
- issue: Grund der Verleugnung
  choice: „wegen ihres Reichtums und ihrer Geschäfte“
  alternative: „um ihren Reichtum und ihre Geschäfte zu schützen“
  rationale: Die kausale Aussage des Textes bleibt erhalten, ohne ein nicht ausdrücklich genanntes Motiv auszuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter und klarer Bildsprache. Die Anrede „Herrin“ und der scharfe Tadel bleiben erhalten. Keine Fußnoten erforderlich.
