base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: de
  text: „Willst du wissen, wer die sind, die zerhauen und weit vom Turm weggeworfen werden? Das sind die Söhne der Gesetzlosigkeit. Sie glaubten heuchlerisch, und keine Bosheit hatte sie verlassen. Deshalb haben sie keine Rettung, denn wegen ihrer Bosheit sind sie für den Bau nicht brauchbar. Darum wurden sie wegen des Zorns des Herrn zerhauen und weit weggeworfen, weil sie ihn zum Zorn gereizt hatten.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: zerschlagen / wurden zerschlagen
  rationale: Das Verb bezeichnet im Bild der Bausteine ein gewaltsames Zerschlagen oder Zerhauen. Die einheitliche Wiedergabe bewahrt den Rückbezug innerhalb des Absatzes.
- source_word: υἱοὶ τῆς ἀνομίας
  choice: Söhne der Gesetzlosigkeit
  rationale: Die semitisch geprägte Wendung wird formal bewahrt; sie bezeichnet Menschen, die von Gesetzlosigkeit geprägt sind.
- source_word: ἐπίστευσαν δὲ ἐν ὑποκρίσει
  choice: Sie sind nur zum Schein zum Glauben gekommen
  rationale: ἐν ὑποκρίσει kennzeichnet ihren Glauben als heuchlerisch beziehungsweise vorgetäuscht. Die deutsche Formulierung macht dies natürlich verständlich, ohne die Aussage in bloßes Lippenbekenntnis umzudeuten.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: „Rettung“ gibt σωτηρία in diesem Gerichtskontext klar und gegenwartsnah wieder, ohne die theologische Tragweite einzuengen.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: für den Bau brauchbar
  rationale: Die Formulierung erhält das konkrete Gleichnisbild vom Turmbau und zugleich die übertragene Bedeutung der Eignung.
- source_word: διὰ τὰς πονηρίας αὐτῶν
  choice: wegen ihrer bösen Taten
  rationale: Der Plural πονηρίαι kann hier konkrete Äußerungen ihrer Bosheit bezeichnen; „böse Taten“ ist im Deutschen idiomatischer als „Bosheiten“.
- source_word: παρώργισαν
  choice: zum Zorn gereizt
  rationale: Die kausative Bedeutung des Verbs wird präzise wiedergegeben und die Verbindung mit ὀργή sprachlich gewahrt.
theological_decisions:
- issue: Glaube und fehlende Rettung
  choice: Die Spannung zwischen ihrem Glauben und der Aussage, dass sie keine Rettung haben, bleibt ausdrücklich bestehen; der Glaube wird lediglich durch „nur zum Schein“ entsprechend ἐν ὑποκρίσει qualifiziert.
  alternative: Die Personen als grundsätzlich Ungläubige bezeichnen oder „Rettung“ als bloßen zeitlichen Schutz verstehen.
  rationale: Der griechische Text sagt sowohl ἐπίστευσαν als auch οὐκ ἔχουσιν σωτηρίαν. Eine konfessionelle Systematisierung dieser Spannung wäre interpretierend.
- issue: ὀργὴ τοῦ Κυρίου und Wiederholung von ὀργή
  choice: „Der Zorn des Herrn traf sie, weil sie ihn zum Zorn gereizt hatten.“
  alternative: „wegen des Zorns des Herrn, weil sie ihn erzürnt hatten“
  rationale: Die gewählte Fassung bewahrt Ursache und Wortspiel, vermeidet aber im Deutschen eine schwerfällige doppelte Begründung mit „weil“.
- issue: Identität des „Herrn“
  choice: „Herr“ ohne nähere Identifikation
  alternative: „Gott“ oder „Christus“
  rationale: Κύριος wird im unmittelbaren Satz nicht weiter bestimmt; die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit konsequent bewahrtem Turmbau-Bild. Die direkte Rede bleibt klar und eindringlich. Keine Fußnoten sind erforderlich, da keine für das Verständnis wesentliche textkritische oder semantische Alternative im Segment markiert werden muss.
