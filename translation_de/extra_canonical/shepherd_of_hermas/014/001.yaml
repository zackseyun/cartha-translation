  naturalness: Die Fassung ist gut verständliches modernes Standarddeutsch. Mit einer leicht direkteren Wiedergabe von ἐν ὑποκρίσει und der kausalen Schlussformel bleibt sie ebenso natürlich, aber präziser.
  terminology: „Söhne der Gesetzlosigkeit“, „Rettung“, „Bau“ und „Herr“ sind angemessen und bewahren sowohl Bildsprache als auch die Offenheit des griechischen κύριος. „Böse Taten“ verengt πονηρίαι etwas auf einzelne Handlungen; „Bosheit“ hält den weiteren Charakterbegriff offen.
