    rationale: οὐκ ἀπέστη ἀπʼ αὐτῶν steht im erzählenden Rückblick. „Keine Bosheit hatte sie verlassen“ gibt sowohl die zeitliche Perspektive als auch die umfassendere Bedeutung von πονηρία besser wieder.
  - severity: low
