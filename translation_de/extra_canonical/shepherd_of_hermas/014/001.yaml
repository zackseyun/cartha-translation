revisions:
- from: '„Willst du wissen, wer die sind, die zerschlagen und weit vom Turm fortgeworfen werden? Es sind die Söhne der Gesetzlosigkeit. Sie sind nur zum Schein zum Glauben gekommen, und keine Bosheit ist von ihnen gewichen. Deshalb haben sie keine Rettung, denn wegen ihrer bösen Taten sind sie für den Bau nicht brauchbar. Darum wurden sie zerschlagen und weit fortgeworfen: Der Zorn des Herrn traf sie, weil sie ihn zum Zorn gereizt hatten.“'
  to: „Willst du wissen, wer die sind, die zerhauen und weit vom Turm weggeworfen werden? Das sind die Söhne der Gesetzlosigkeit. Sie glaubten heuchlerisch, und keine Bosheit hatte sie verlassen. Deshalb haben sie keine Rettung, denn wegen ihrer Bosheit sind sie für den Bau nicht brauchbar. Darum wurden sie wegen des Zorns des Herrn zerhauen und weit weggeworfen, weil sie ihn zum Zorn gereizt hatten.“
