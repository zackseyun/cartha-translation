  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/006.yaml
  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: de
  text: '6. Ich antwortete ihr: »Herrin, wann werden sie also für den Bau brauchbar sein?« Sie sagte: »Wenn ihr Reichtum, der sie verführt, weggeschnitten wird, dann werden sie für Gott brauchbar sein. Denn wie ein runder Stein nicht vierkantig werden kann, wenn er nicht behauen wird und etwas von sich abwirft, so können auch die, die in diesem Zeitalter reich sind, für den Herrn nicht brauchbar werden, wenn ihr Reichtum nicht weggeschnitten wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔχρηστοι εἰς τὴν οἰκοδομήν
  choice: für den Bau geeignet
  rationale: Gibt die Eignung der Steine für den Bau natürlich wieder und bewahrt das durchgehende Baubild.
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: ihr Reichtum, der sie verführt
  rationale: ψυχαγωγέω kann hier das irreführende Locken oder Verführen durch den Reichtum bezeichnen; die negative Wirkung im Kontext wird gewahrt, ohne eine spezifische Falle in den griechischen Wortlaut einzutragen.
- source_word: περικοπῇ
  choice: beschnitten ist / beschnitten wird
  rationale: Bewahrt die Metapher des Wegschneidens, die anschließend am Behauen des runden Steins erläutert wird.
- source_word: εὔχρηστοι τῷ Θεῷ / τῷ Κυρίῳ
  choice: für Gott / für den Herrn brauchbar
  rationale: „Brauchbar“ entspricht der funktionalen Bedeutung von εὔχρηστος und erhält den Wechsel zwischen Θεός und Κύριος.
- source_word: τετράγωνος
  choice: viereckig
  rationale: Nahe Wiedergabe der für den Bau erforderlichen Form; „quadratisch“ könnte im Deutschen zu ausschließlich zweidimensional wirken.
- source_word: ἐν τούτῳ τῷ αἰῶνι
  choice: in diesem Zeitalter
  rationale: Bewahrt den zeitlich-eschatologischen Klang von αἰών besser als das mögliche, aber weniger genaue „in dieser Welt“.
theological_decisions:
- issue: Bedingung der Brauchbarkeit reicher Glaubender
  choice: Der Reichtum muss „beschnitten“ werden.
  alternative: Die Betroffenen müssen ihren Reichtum vollständig verlieren oder aufgeben.
  rationale: Der griechische Text verwendet die bildhafte passive Form περικοπῇ und bestimmt weder ausdrücklich den Handelnden noch, ob vollständiger Besitzverlust, Verminderung oder Lösung von seiner Macht gemeint ist. Die Übersetzung bewahrt diese Offenheit.
- issue: Bezeichnung des göttlichen Adressaten
  choice: „für Gott“ und anschließend „für den Herrn“
  alternative: Beide Vorkommen vereinheitlichen.
  rationale: Der Wechsel des Ausgangstextes zwischen Θεός und Κύριος wird nicht theologisch geglättet.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Stein- und Bau-Metaphorik bleibt konsequent erhalten. „Herrin“ bildet κυρία im erzählerischen Dialog ab; die direkte Rede wird klar und natürlich gegliedert.
