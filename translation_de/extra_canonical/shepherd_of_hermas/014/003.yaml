base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: de
  text: 3. »Und wer sind die, die Risse haben? Es sind diejenigen, die in ihren Herzen etwas gegeneinander haben und untereinander nicht in Frieden leben. Sie zeigen zwar eine friedliche Miene; doch wenn sie auseinandergehen, bleiben ihre Bosheiten in ihren Herzen. Das also sind die Risse, welche die Steine haben.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς σχισμάς
  choice: die Risse
  rationale: Das konkrete Bild beschädigter Bausteine wird bewahrt; „Spaltungen“ wäre hier trotz möglicher übertragener Bedeutung weniger anschaulich.
- source_word: κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: die in ihrem Herzen etwas gegeneinander tragen
  rationale: Die idiomatische deutsche Wendung gibt das absichtlich unbestimmte Objekt des griechischen Ausdrucks wieder, ohne es auf Hass, Groll oder eine bestimmte Verfehlung festzulegen.
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: eine friedliche Miene zeigen
  rationale: Bewahrt das Bild des sichtbaren Gesichts beziehungsweise äußeren Auftretens und klingt zugleich natürlich im modernen Deutschen.
- source_word: αἱ πονηρίαι αὐτῶν
  choice: ihre Bosheiten
  rationale: Gibt den Plural und die moralische Schärfe von πονηρίαι wieder, ohne den Ausdruck deutend auf bloße Gefühle oder Gedanken zu verengen.
theological_decisions:
- issue: Verhältnis von äußerem Frieden und innerer Haltung
  choice: Der Gegensatz zwischen friedlicher Miene und bleibender Bosheit im Herzen bleibt ausdrücklich bestehen.
  alternative: Den Text allgemein als Heuchelei oder Unversöhnlichkeit zusammenzufassen.
  rationale: Der griechische Text zeichnet selbst das spannungsvolle Bild eines äußerlich friedlichen Auftretens bei fortbestehender innerer Bosheit; eine dogmatische Etikettierung wäre enger als die Quelle.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener Steinmetaphorik. Die direkte Frage-und-Antwort-Struktur und die Wiederholung von „Risse“ bleiben erhalten.
