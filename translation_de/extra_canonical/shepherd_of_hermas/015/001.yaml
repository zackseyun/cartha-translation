base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: de
  text: 'Die anderen Steine aber, die du weit vom Turm weggeworfen sahst, auf die Straße fallen und von der Straße in weglose Gegenden rollen sahst: Das sind diejenigen, die zwar zum Glauben gekommen sind, aber wegen ihrer inneren Zwiespältigkeit ihren wahren Weg verlassen. Weil sie meinen, einen besseren Weg finden zu können, verirren sie sich und leiden Not, während sie in den weglosen Gegenden umhergehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: Unentschlossenheit
  rationale: Bezeichnet ein inneres Geteiltsein beziehungsweise schwankende Haltung; „Unentschlossenheit“ ist verständlich und wahrt den Gedanken mangelnder innerer Festigkeit.
- source_word: ἀνοδίαι
  choice: unwegsames Gelände
  rationale: Das Wort bezeichnet weglose oder schwer gangbare Orte. Die Wiedergabe hält das Weg-Motiv des Bildes aufrecht, ohne künstlich zu klingen.
- source_word: πεπιστευκότες
  choice: zum Glauben gekommen sind
  rationale: Das Perfekt bezeichnet Menschen, die gläubig geworden sind und als Glaubende gelten; die Formulierung gibt diesen Zustandsaspekt natürlich wieder.
- source_word: ταλαιπωροῦσιν
  choice: geraten in Not
  rationale: Vermittelt Elend, Mühsal und leidvolle Bedrängnis in idiomatischem Deutsch.
theological_decisions:
- issue: Charakterisierung der Glaubenden
  choice: „die zwar zum Glauben gekommen sind“
  alternative: „die geglaubt haben“
  rationale: Die Übersetzung lässt den behaupteten Glaubensstatus stehen und erklärt nicht konfessionell, welcher Art oder Dauer dieser Glaube ist.
- issue: Bedeutung von διψυχία
  choice: „Unentschlossenheit“
  alternative: „Doppelherzigkeit“
  rationale: „Doppelherzigkeit“ wäre formnäher, könnte aber vorschnell bewusste Heuchelei suggerieren. Der Kontext beschreibt Schwanken und die Suche nach einem vermeintlich besseren Weg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Weg-Bildsprache des griechischen Textes bleibt erhalten; syntaktische Glättungen dienen der Verständlichkeit, ohne die Aussage zu erweitern.
