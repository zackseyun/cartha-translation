  naturalness: Abgesehen vom ersten, überladenen Satz ist der Text modernes, verständliches Deutsch. „Unwegsame Gegenden“ ist im vorliegenden Wegbild natürlicher und präziser als das eher topographisch-technische „unwegsames Gelände“.
  terminology: „Zum Glauben gekommen sind“ ist als Wiedergabe von πεπιστευκότες vertretbar. Für διψυχία ist „innere Zwiespältigkeit“ vorzuziehen, da es die bildlich und ethisch relevante Doppelgesinntheit bewahrt, ohne Heuchelei zu unterstellen. Die wiederholte Wegmetaphorik bleibt mit „Weg“ und „weglose Gegenden“ erhalten.
