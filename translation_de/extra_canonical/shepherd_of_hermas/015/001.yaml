  to: 'Die anderen Steine aber, die du weit vom Turm weggeworfen sahst, auf die Straße fallen und von der Straße in weglose Gegenden rollen sahst: Das sind diejenigen, die zwar zum Glauben gekommen sind, aber wegen ihrer inneren Zwiespältigkeit ihren wahren Weg verlassen. Weil sie meinen, einen besseren Weg finden zu können, verirren sie sich und leiden Not, während sie in den weglosen Gegenden umhergehen.'
  rationale: Die Revision ordnet die Bildfolge des griechischen Satzes verständlich und quellentreu. „Innere Zwiespältigkeit“ wahrt bei διψυχία die Ambivalenz von Geteiltsein und Schwanken besser als „Unentschlossenheit“. „Weglose Gegenden“ erhält die Wort- und Bildverbindung zu δρόμος/ὁδός und ἀνοδίαι; „leiden Not“ gibt ταλαιπωροῦσιν als andauerndes Elend wieder.
