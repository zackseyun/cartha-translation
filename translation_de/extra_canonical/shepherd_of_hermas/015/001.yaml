  - severity: medium
    issue: διψυχία zu stark abgeschwächt
    rationale: „Unentschlossenheit“ kann situative Unfähigkeit zur Entscheidung bezeichnen. διψυχία meint hier ein inneres Geteiltsein beziehungsweise schwankende Gesinnung, das zum Verlassen des wahren Weges führt.
