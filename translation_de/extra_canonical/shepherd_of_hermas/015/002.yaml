base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: de
  text: Die aber ins Feuer fallen und verbrannt werden, sind diejenigen, die sich endgültig von dem lebendigen Gott abgewandt haben. Wegen ihrer zügellosen Begierden und der bösen Taten, die sie begangen haben, kam ihnen der Gedanke, umzukehren, nicht mehr in den Sinn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: sich endgültig … abgewandt haben
  rationale: Gibt sowohl die vollendete Abkehr (ἀποστάντες) als auch die verstärkende Wendung εἰς τέλος natürlich und präzise wieder.
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: von dem lebendigen Gott
  rationale: Bewahrt die traditionelle und im Deutschen verständliche biblische Gottesbezeichnung.
- source_word: οὐκέτι αὐτοῖς ἀνέβη ἐπὶ τὴν καρδίαν
  choice: ist ihnen der Gedanke … nicht mehr in den Sinn gekommen
  rationale: Die griechische Redewendung bezeichnet, dass etwas im Inneren bzw. Denken aufkommt; eine wörtliche Wiedergabe mit „ins Herz aufsteigen“ wäre im modernen Deutsch unnötig fremd.
- source_word: τοῦ μετανοῆσαι
  choice: umzukehren
  rationale: Μετανοεῖν meint hier eine innere und praktische Abkehr vom bisherigen bösen Weg; „umkehren“ ist verständlicher und umfassender als das enger wirkende „bereuen“.
- source_word: τὰς ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: ihre zügellosen Begierden
  rationale: Ἀσέλγεια bezeichnet Ausschweifung, Zügellosigkeit oder schamloses Verhalten. Die attributive Formulierung ist im Deutschen natürlich und wahrt die moralische Schärfe, ohne die Bedeutung ausschließlich auf Sexualität zu verengen.
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: der bösen Taten, die sie begangen haben
  rationale: Das pluralische πονηρίαι bezeichnet hier konkrete böse Handlungen; „Taten“ macht den Bezug von εἰργάσαντο idiomatisch deutlich.
theological_decisions:
- issue: Tragweite von εἰς τέλος ἀποστάντες
  choice: „sich endgültig … abgewandt haben“
  alternative: „völlig von … abgefallen sind“
  rationale: „Endgültig“ bildet den Wortlaut und die ernste Aussage des Abschnitts ab, ohne über den Text hinaus eine systematische Lehre über unwiderruflichen Abfall zu formulieren.
- issue: Bedeutung von μετανοεῖν
  choice: „umzukehren“
  alternative: „Buße zu tun“
  rationale: „Umkehren“ vermittelt die geforderte Sinnes- und Lebensänderung in allgemein verständlicher Sprache und vermeidet konfessionell geprägte Nebenbedeutungen.
- issue: Kausalzusammenhang mit den Begierden und bösen Taten
  choice: „Wegen … ist ihnen der Gedanke … nicht mehr in den Sinn gekommen“
  alternative: „Sie konnten wegen … nicht mehr umkehren“
  rationale: Der griechische Text sagt nicht ausdrücklich, dass Umkehr unmöglich geworden sei, sondern dass sie ihnen nicht mehr ins Herz bzw. in den Sinn kam. Diese Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzführung. Die Bildsprache von Feuer und Verbrennen bleibt unverändert; die semitisch geprägte Wendung „ins Herz aufsteigen“ wird dagegen idiomatisch als „in den Sinn kommen“ wiedergegeben.
