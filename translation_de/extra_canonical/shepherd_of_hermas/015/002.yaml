review_pass:
  verdict: revise
  source_fidelity: 'Eine kleine, aber relevante Korrektur ist nötig: καιόμενοι ist passiv und bezeichnet, dass die Steine „verbrannt werden“, nicht bloß intransitiv „verbrennen“. Die übrigen zentralen Aussagen werden sachgerecht wiedergegeben, einschließlich der endgültigen Abkehr, der Bezeichnung „lebendiger Gott“ und der Aussage, dass ihnen Umkehr nicht mehr in den Sinn bzw. ins Herz kam.'
  naturalness: Die Übersetzung ist insgesamt klar und modern. Mit „ins Feuer fallen und verbrannt werden“ ist der Satz sowohl genauer als auch im Kontext der Turmvision idiomatisch. Die Präteritumsform „kam“ gibt die erzählende Redeform des griechischen Aorists natürlich wieder.
  terminology: „Umkehren“ ist für μετανοῆσαι eine angemessene, nicht konfessionell verengte Wiedergabe. „Zügellose Begierden“ gibt ἐπιθυμίαι τῆς ἀσελγείας verständlich wieder, ohne die Bedeutung unnötig auf Sexualität einzugrenzen. „Böse Taten“ entspricht den konkreten πονηρίαι.
  issues:
  - severity: medium
    issue: Passiv von καιόμενοι
    rationale: Das Partizip καιόμενοι ist passiv („verbrannt werdend/werden verbrannt“). Das deutsche intransitive „verbrennen“ kann zwar umgangssprachlich ähnlich verstanden werden, lässt aber die im griechischen Text ausgedrückte Einwirkung weniger deutlich erkennen.
  revised_text: Die aber ins Feuer fallen und verbrannt werden, sind diejenigen, die sich endgültig von dem lebendigen Gott abgewandt haben. Wegen ihrer zügellosen Begierden und der bösen Taten, die sie begangen haben, kam ihnen der Gedanke, umzukehren, nicht mehr in den Sinn.
