  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: de
  text: 'Damit schloss sie die Erklärung des Turmes ab. Doch ich fasste mir erneut ein Herz und fragte sie weiter, ob für all diese Steine, die weggeworfen worden waren und nicht in den Bau des Turmes passten, Umkehr möglich sei und ob sie einen Platz in diesem Turm hätten. Sie sagte: „Für sie gibt es Umkehr, aber in diesen Turm können sie nicht eingefügt werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν
  choice: schloss … ab
  rationale: Gibt den Abschluss der Erklärung natürlich und präzise wieder.
- source_word: ἀναιδευσάμενος
  choice: ich wurde wieder kühn
  rationale: Das Partizip kann Unverfrorenheit oder kühne Beharrlichkeit bezeichnen; im Zusammenhang ist eine verständliche, nicht unnötig abwertende Wiedergabe angemessen.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet hier eine innere und praktische Abkehr vom bisherigen sündigen Weg; „Umkehr“ bewahrt diesen umfassenden Sinn besser als bloße Reue.
- source_word: ἁρμόζοντες / ἁρμόσαι
  choice: passten / eingefügt werden
  rationale: Bewahrt das durchgehende Bild der Steine, die in das Bauwerk eingepasst werden.
theological_decisions:
- issue: Möglichkeit der μετάνοια für die verworfenen Steine
  choice: „Umkehr ist für sie möglich“
  alternative: „Sie können Buße tun“
  rationale: Die Formulierung erhält die ausdrückliche Bejahung einer Umkehrmöglichkeit, ohne bereits deren Folgen über die Aussage des Textes hinaus festzulegen.
- issue: Kein Platz im gegenwärtigen Turm
  choice: „in diesen Turm können sie nicht eingefügt werden“
  alternative: „sie können nicht zu diesem Turm passen“
  rationale: Gibt die im Griechischen fortgeführte Bau-Metapher wieder und lässt die Spannung zwischen möglicher Umkehr und verweigerter Einfügung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Bildsprache. Die direkte Rede und die Spannung zwischen möglicher Umkehr und fehlender Einfügung in diesen Turm bleiben erhalten.
