base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: de
  text: Sie werden jedoch an einer anderen, viel kleineren Stelle eingefügt werden, und zwar dann, wenn sie gepeinigt worden sind und die Tage ihrer Sünden erfüllt haben. Deshalb werden sie versetzt werden, weil sie am Wort des Gerechten Anteil erhalten haben. Dann wird es dazu kommen, dass sie aus ihren Qualen heraus versetzt werden, wenn ihnen die bösen Taten, die sie begangen haben, in den Sinn kommen. Kommen sie ihnen aber nicht in den Sinn, werden sie wegen ihrer Herzenshärte nicht gerettet.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέρῳ ... τόπῳ ἁρμόσουσιν πολὺ ἐλάττονι
  choice: an eine andere, viel geringere Stelle eingefügt werden
  rationale: ἁρμόζω führt das Bild der Steine fort, die in einen Bau eingefügt werden; „geringere Stelle“ bewahrt die wertende, aber nicht näher bestimmte Bedeutung von ἐλάττων.
- source_word: βασανισθῶσιν / βασάνων
  choice: gepeinigt worden sind / Qualen
  rationale: Die Wortfamilie bezeichnet hier leidvolle Strafe oder Prüfung. Die abgestimmte Wiedergabe ist im Deutschen natürlich, ohne die genaue Art der Leiden festzulegen.
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: die Tage ihrer Sünden vollendet haben
  rationale: Die bildhafte Zeitangabe des Griechischen bleibt erhalten und wird nicht zu einer dogmatisch präzisierten Strafdauer umgedeutet.
- source_word: μετέλαβον τοῦ ῥήματος τοῦ δικαίου
  choice: am Wort des Gerechten Anteil erhalten haben
  rationale: μετέλαβον bedeutet Teilhabe; τοῦ δικαίου kann als maskulines Substantiv „des Gerechten“ verstanden werden. Die Formulierung wahrt diese naheliegende Lesart.
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: zu Herzen gehen
  rationale: Die griechische Wendung meint, dass etwas ins innere Bewusstsein tritt. „Zu Herzen gehen“ ist idiomatisch und bewahrt den Bezug zum Herzen sowie die ethische Wirkung.
- source_word: σκληροκαρδίαν
  choice: Herzenshärte
  rationale: Eine direkte und im religiös-ethischen Register verständliche Entsprechung.
theological_decisions:
- issue: Bedingung der Rettung nach den Qualen
  choice: 'Die konditionale Aussage bleibt ausdrücklich erhalten: Versetzung geschieht, wenn die bösen Taten zu Herzen gehen; andernfalls erfolgt keine Rettung.'
  alternative: Die Passage als sichere allumfassende Wiederherstellung oder als endgültigen Ausschluss jeder späteren Umkehr formulieren.
  rationale: Der griechische Text hält Möglichkeit und Bedingung in Spannung und darf nicht konfessionell systematisiert werden.
- issue: Identität des „Gerechten“ in τοῦ δικαίου
  choice: „des Gerechten“ ohne ausdrückliche Identifizierung
  alternative: „der Gerechtigkeit“ oder eine ausdrückliche Benennung Christi
  rationale: Der Genitiv ist formal mehrdeutig; die maskuline personale Lesart ist naheliegend, doch eine namentliche Identifizierung wäre eine Auslegung, die der Text selbst nicht ausspricht.
translation_notes:
  register: Würdevolles, modernes Standarddeutsch. Das Bau-Bild wird durch „eingefügt“ fortgeführt; die wiederholte Herzensmetaphorik bleibt in natürlicher deutscher Form erhalten. Keine Fußnoten erforderlich.
