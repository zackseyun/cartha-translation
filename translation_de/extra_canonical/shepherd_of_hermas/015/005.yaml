  terminology: „Qualen“ für βάσανοι, „Herzenshärte“ für σκληροκαρδία und die zurückhaltende Wiedergabe „des Gerechten“ für τοῦ δικαίου sind angemessen. Die Identität des Gerechten wird nicht über den Wortlaut hinaus bestimmt.
