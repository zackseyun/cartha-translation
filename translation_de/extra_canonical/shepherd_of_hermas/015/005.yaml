    rationale: ἐλάττων bedeutet in diesem räumlichen Bild „kleiner“; „geringer“ kann im Deutschen vorrangig eine qualitative oder soziale Minderwertigkeit nahelegen.
  - severity: medium
    issue: „wenn ihnen die bösen Taten … zu Herzen gehen“ für ἐὰν ἀναβῇ ἐπὶ τὴν καρδίαν αὐτῶν
    rationale: Die griechische Wendung bezeichnet, dass die Taten in ihr inneres Bewusstsein bzw. ihren Sinn kommen. „Zu Herzen gehen“ bedeutet eher, dass etwas emotional berührt, und verschiebt daher die Aussage leicht.
