  source_fidelity: Die Grundstruktur und das Stein-/Wasserbild sind zutreffend wiedergegeben. Die Wiedergabe von μετανοοῦσιν als „sie überlegen es sich anders“ legt jedoch einseitig fest, dass der Taufwunsch widerrufen wird. Das Verb kann auch „bereuen“ bzw. „umkehren“ bedeuten; sein nicht ausdrücklich genannter Bezug bleibt im griechischen Satz offen. Die anschließende Rückkehr zu den bösen Begierden beschreibt zwar einen Rückfall, bestimmt aber nicht zwingend die genaue Bedeutung des Verbs selbst.
  naturalness: Der Text ist insgesamt gut lesbar. „nahe beim Wasser niederfallen“ klingt im Deutschen etwas unnötig markiert; „nahe beim Wasser fallen“ bewahrt das Bild und ist natürlicher. „ihren bösen Begierden nachgehen“ ist eine idiomatische, präzise Wiedergabe der Bewegungsmetapher.
  terminology: „das Wort“, „der Herr“, „getauft werden“ und „Reinheit der Wahrheit“ sind angemessen. Die Formulierung „auf den Namen des Herrn“ gibt εἰς τὸ ὄνομα eng wieder und ist als Taufformel vertretbar. Die bisherige Fußnote bewertet μετανοοῦσιν dagegen zu bestimmt und bezeichnet „sie ändern ihren Sinn“ irreführend als wörtliche Wiedergabe.
