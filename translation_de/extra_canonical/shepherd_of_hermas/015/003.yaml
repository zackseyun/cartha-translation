  - severity: low
    issue: Unzutreffende Fußnotenerklärung
    rationale: Die Behauptung, das Wort bezeichne hier einen Sinneswandel „zurück zu den bösen Begierden“, geht über den Wortlaut hinaus; die Rückkehr wird erst im folgenden Verbalsatz ausgesagt.
