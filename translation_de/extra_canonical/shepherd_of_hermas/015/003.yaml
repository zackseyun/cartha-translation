base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: de
  text: Möchtest du wissen, wer die anderen sind, die nahe beim Wasser fallen, aber nicht ins Wasser rollen können? Es sind diejenigen, die das Wort gehört haben und auf den Namen des Herrn getauft werden wollen. Doch dann, wenn ihnen die Reinheit der Wahrheit in den Sinn kommt, bereuen sie[a] und gehen wieder ihren bösen Begierden nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann „bereuen“, „umkehren“ oder, allgemeiner, einen Sinneswandel bezeichnen. Es nennt nicht ausdrücklich, worauf sich dies bezieht; der folgende Satz beschreibt, dass sie zu ihren bösen Begierden zurückkehren.
    reason: Bewahrt die lexikalische und syntaktische Offenheit von μετανοοῦσιν, ohne den dargestellten Rückfall zu verdecken.
lexical_decisions:
- source_word: κυλισθῆναι
  choice: rollen
  rationale: Bewahrt das Bild der als Steine dargestellten Menschen und gibt die konkrete Bewegung zum Wasser hin wieder.
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: auf den Namen des Herrn getauft werden
  rationale: Natürliche deutsche Taufformulierung, die εἰς τὸ ὄνομα eng wiedergibt, ohne die theologische Beziehung weiter auszudeuten.
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: die Reinheit der Wahrheit
  rationale: 'Bewahrt die Genitivverbindung und ihre mögliche Spannung: Gemeint sein kann sowohl die Reinheit der Wahrheit selbst als auch die von ihr verlangte Reinheit.'
- source_word: πορεύονται πάλιν ὀπίσω τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: folgen wieder ihren bösen Begierden
  rationale: Gibt die Bewegung zurück hinter den Begierden idiomatisch wieder und erhält den Rückfallgedanken.
theological_decisions:
- issue: Bedeutung von μετανοοῦσιν in einem negativen Zusammenhang
  choice: sie überlegen es sich anders
  alternative: sie bereuen es / sie kehren um
  rationale: Obwohl μετανοεῖν häufig positive Umkehr bezeichnet, beschreibt es hier das Abrücken vom Taufwunsch und die Rückkehr zu bösen Begierden. Die gewählte Formulierung bewahrt den Sinn eines Sinneswandels, ohne eine positive Buße zu unterstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Steinbild bleibt durch „niederfallen“ und „rollen“ sichtbar; die Satzfolge wurde für klare mündliche Verständlichkeit leicht gegliedert.
