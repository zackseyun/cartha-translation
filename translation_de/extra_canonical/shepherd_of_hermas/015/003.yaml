  to: Möchtest du wissen, wer die anderen sind, die nahe beim Wasser fallen, aber nicht ins Wasser rollen können? Es sind diejenigen, die das Wort gehört haben und auf den Namen des Herrn getauft werden wollen. Doch dann, wenn ihnen die Reinheit der Wahrheit in den Sinn kommt, bereuen sie[a] und gehen wieder ihren bösen Begierden nach.
