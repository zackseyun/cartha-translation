base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: de
  text: Diejenigen aber, die ihre Ruten so grün zurückgaben, wie sie sie empfangen hatten, sind würdig und gerecht. Sie sind mit ganz reinem Herzen ihren Weg gegangen und haben die Gebote des Herrn befolgt. Das Übrige wirst du erfahren, wenn ich diese Ruten untersucht habe, die eingepflanzt und bewässert worden sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χλωρὰς
  choice: grün
  rationale: Bewahrt die konkrete Bildsprache der frischen, unverdorbenen Ruten.
- source_word: ἐπιδεδωκότες
  choice: zurückgaben
  rationale: Im Zusammenhang werden die zuvor empfangenen Ruten zur Prüfung wieder ausgehändigt; „zurückgaben“ macht diesen Vorgang im Deutschen natürlich deutlich.
- source_word: σεμνοὶ
  choice: ehrbare
  rationale: Gibt die sittliche Würde und Achtbarkeit des griechischen Ausdrucks wieder, ohne einen ausschließlich religiösen Fachbegriff zu verwenden.
- source_word: πορευθέντες
  choice: ihren Weg gegangen
  rationale: Erhält die im Griechischen enthaltene Weg-Metaphorik für die Lebensführung.
- source_word: πεφυλακότες
  choice: befolgt
  rationale: Drückt das treue Beachten der Gebote in natürlichem modernem Deutsch aus.
- source_word: κατανοήσω
  choice: untersucht habe
  rationale: Der Kontext verlangt sorgfältiges Prüfen beziehungsweise Betrachten der Ruten; „untersuchen“ ist hier idiomatisch und präzise.
theological_decisions:
- issue: Reinheit des Herzens
  choice: mit ganz reinem Herzen
  alternative: in einem sehr reinen Herzen
  rationale: Die Formulierung wahrt die starke Aussage λίαν ... ἐν καθαρᾷ καρδίᾳ, ohne sie als absolute Sündlosigkeit näher auszudeuten.
- issue: Bewahren der Gebote
  choice: die Gebote des Herrn befolgt
  alternative: die Gebote des Herrn bewahrt
  rationale: „Befolgt“ vermittelt den praktischen Gehorsam klar; die Übersetzung fügt keine Aussage über Verdienst oder Heilsgrund hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Symbolsprache von den grünen, eingepflanzten und bewässerten Ruten bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
