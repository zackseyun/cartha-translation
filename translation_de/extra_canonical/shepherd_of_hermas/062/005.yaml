  - severity: low
    issue: „zum Turm“ gibt εἰς τὸν πύργον zu unbestimmt wieder.
    rationale: εἰς mit Akkusativ kennzeichnet die Bewegung in den Turm. Auch die englische Audit-Fassung hat ausdrücklich „into the tower“.
