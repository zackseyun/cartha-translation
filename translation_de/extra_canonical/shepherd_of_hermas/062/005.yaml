  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/005.yaml
  text: I say to him, “Sir, why did he send some away into the tower, but leave others to you?”
translation:
  language: de
  text: 'Ich sagte zu ihm: »Herr, warum hat er die einen in den Turm geschickt, die anderen aber dir überlassen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an die deutende Gestalt wird in diesem frühchristlichen Kontext würdig und natürlich mit »Herr« wiedergegeben.
- source_word: ἀπέλυσεν
  choice: hat … geschickt
  rationale: Im Zusammenhang bezeichnet das Verb das Entlassen beziehungsweise Wegschicken mit dem Turm als Ziel; »geschickt« ist im Deutschen natürlich und wahrt die Bewegung.
- source_word: εἰς τὸν πύργον
  choice: zum Turm
  rationale: Die Zielrichtung wird idiomatisch mit »zum Turm« ausgedrückt, ohne eine Bewegung in das Innere des Turms zu erzwingen.
- source_word: σοὶ κατέλειψεν
  choice: dir überlassen
  rationale: καταλείπω bezeichnet hier das Zurücklassen beziehungsweise Übergeben unter die Zuständigkeit des Angeredeten; »überlassen« passt zum folgenden Hinweis auf dessen Vollmacht.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts von ἀπέλυσεν und κατέλειψεν
  choice: Das Pronomen »er« bleibt ohne erklärenden Namenszusatz stehen.
  alternative: »Michael« oder »der große Engel« ausdrücklich einsetzen.
  rationale: Der griechische Text setzt die Identität aus dem vorausgehenden Zusammenhang voraus. Eine ausdrückliche Benennung würde die textliche Ellipse auflösen und mehr festlegen als der Vers selbst.
- issue: Bedeutung des Turms
  choice: »Turm« wird ohne Deutung wiedergegeben.
  alternative: Den Turm als Kirche oder Heilsgemeinschaft erklären.
  rationale: Der Satz nennt nur das Bildmotiv. Eine theologische Identifizierung gehört nicht in den Haupttext dieses Segments.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdiger direkter Rede. Der Satzbau folgt dem griechischen Kontrast »die einen … die anderen«, klingt dabei aber natürlich deutsch.
