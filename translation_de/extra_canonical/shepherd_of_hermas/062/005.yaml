  source_fidelity: Das einleitende λέγω αὐτῷ bedeutet wörtlich „ich sage zu ihm“ und nicht spezifisch „ich frage ihn“, auch wenn die folgende Rede eine Frage ist. Zudem bezeichnet εἰς τὸν πύργον eine Bewegung „in den Turm“; „zum Turm“ schwächt die im Griechischen ausgedrückte Zielrichtung ab. Die Kontraststruktur und das unausgesprochene Subjekt bleiben gewahrt.
  naturalness: „Ich sagte zu ihm“ ist modernes, natürliches Erzählprosa-Deutsch; „in den Turm geschickt“ ist idiomatisch und gibt die Zielbewegung klar wieder.
  terminology: „Herr“, „Turm“ und „dir überlassen“ sind passend. Die absichtlich offene Referenz von „er“ wird beibehalten.
