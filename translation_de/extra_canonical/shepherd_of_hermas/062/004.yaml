base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: de
  text: Du siehst die Ruten jedes Einzelnen; denn die Ruten sind das Gesetz. Du siehst also viele Ruten, die unbrauchbar geworden sind; du wirst alle erkennen, die das Gesetz nicht gehalten haben, und du wirst den Wohnort jedes Einzelnen sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: Ruten
  rationale: Im Bildzusammenhang sind abgeschnittene und später eingepflanzte Zweige beziehungsweise Stäbe gemeint. „Ruten“ bewahrt das konkrete Bild und klingt im Deutschen natürlicher als „Stäbe“.
- source_word: ἠχρειωμένας
  choice: unbrauchbar geworden
  rationale: 'Das Perfektpartizip bezeichnet einen eingetretenen Zustand: Die Ruten sind untauglich beziehungsweise wertlos geworden. „Unbrauchbar geworden“ gibt sowohl das Ergebnis als auch den Vorgang wieder.'
- source_word: τηρήσαντας
  choice: bewahrt haben
  rationale: τηρέω kann „halten“, „befolgen“ oder „bewahren“ bedeuten. „Das Gesetz bewahren“ greift die wiederholte Ausdrucksweise des Abschnitts auf, ohne den Sinn auf bloße äußerliche Befolgung zu verengen.
- source_word: κατοικίαν
  choice: wo jeder von ihnen seinen Platz findet
  rationale: Wörtlich bezeichnet κατοικία den Wohn- oder Aufenthaltsort. Die idiomatische Formulierung hält die eschatologische Zuordnung offen und vermeidet die sachlich mögliche, aber im Deutschen missverständliche Wendung „die Wohnung eines jeden“.
theological_decisions:
- issue: Bedeutung der jeweiligen κατοικία
  choice: Nicht näher bestimmter künftiger Aufenthalts- oder Bestimmungsort
  alternative: „die Wohnung eines jeden“ beziehungsweise ausdrückliche Benennung von Heil oder Gericht
  rationale: Der griechische Satz nennt nur die κατοικία jedes Einzelnen und erläutert hier nicht ausdrücklich, welcher Ort gemeint ist. Die Übersetzung wahrt diese Offenheit und fügt keine konfessionelle Eschatologie ein.
- issue: Identifikation von Gesetz und Ruten
  choice: Die bildhafte Gleichsetzung bleibt direkt stehen
  alternative: Erklärende Auflösung als Gebote oder Lebensführung
  rationale: Der Ausgangstext formuliert ausdrücklich αἱ γὰρ ῥάβδοι ὁ νόμος ἐστί. Die Spannung zwischen mehreren Ruten und dem singularischen Gesetz gehört zum Gleichnis und wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Wortlaut. Die anaphorische Wiederholung „Du siehst“ bleibt erhalten; der kurze, auslegende Ton der Figurenrede wird gewahrt.
