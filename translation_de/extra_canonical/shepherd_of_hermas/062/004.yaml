  source_fidelity: Der Entwurf gibt die Bildsprache mit „Ruten“ sowie ἠχρειωμένας zutreffend als eingetretene Unbrauchbarkeit wieder. Die Schlusswendung entfernt sich jedoch unnötig von κατοικία („Wohnort/Wohnstätte“), indem sie einen nicht im griechischen Text ausgedrückten Bestimmungs- bzw. Platzfindungsvorgang formuliert.
  naturalness: Der Ton ist überwiegend modernes, würdiges Deutsch. „Das Gesetz halten“ ist im gegenwärtigen Deutsch für τηρεῖν bei Gesetz/Gebot idiomatischer als „das Gesetz bewahren“. „Wohnort jedes Einzelnen“ ist klar und natürlich.
  terminology: „Ruten“ bewahrt das im Gleichnis verwendete konkrete Bild. „Gesetz“ ist korrekt. κατοικία sollte mit „Wohnort“ direkt wiedergegeben werden; dies wahrt die textliche Offenheit ohne zusätzliche eschatologische Deutung.
  issues:
  - severity: medium
    issue: Die Wiedergabe von κατοικία ist interpretierend erweitert.
    rationale: „wo jeder von ihnen seinen Platz findet“ bezeichnet eine Zuweisung oder Bestimmung, während κατοικία schlicht den Wohn- bzw. Aufenthaltsort nennt. Die Fußnote korrigiert den Haupttext zwar, aber eine direkte, natürliche Wiedergabe ist möglich und vorzuziehen.
  - severity: low
    issue: „das Gesetz bewahrt haben“ ist hier weniger idiomatisch.
    rationale: Für τηρεῖν mit νόμος ist „das Gesetz gehalten haben“ im Deutschen die geläufige Formulierung und gibt das Befolgen des Gesetzes präzise wieder.
