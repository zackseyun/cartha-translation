  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: de
  text: '[»Die mit dem Teufel gerungen und ihn besiegt haben«, sagt er, »sind gekrönt.«][a] Das sind die, die um des Gesetzes willen gelitten haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerten Worte fehlen in einigen Textzeugen und gelten daher als textkritisch unsicher. Das griechische Wort für »gekrönt« bezieht sich auf den Siegeskranz als Ehrenzeichen.
    reason: Die Klammern der maßgeblichen Ausgabe markieren die mögliche Sekundarität des gesamten Satzes. Die kurze Erläuterung bewahrt zugleich das antike Bild, ohne den Haupttext zu erweitern.
lexical_decisions:
- source_word: συμπαλαίσαντες
  choice: mit dem Teufel gerungen
  rationale: Gibt das Bild eines unmittelbaren Ringkampfs natürlich wieder und bewahrt die kämpferische Metapher.
- source_word: ἐνίκησαν
  choice: besiegt haben
  rationale: Entspricht dem klaren Sinn von νικάω und klingt im Deutschen idiomatisch.
- source_word: ἐστεφανωμένοι
  choice: tragen den Siegeskranz
  rationale: Macht die antike Bedeutung des Kranzes als Auszeichnung für einen Sieg verständlich, ohne das Bild aufzugeben.
- source_word: ὑπὲρ τοῦ νόμου
  choice: um des Gesetzes willen
  rationale: Bewahrt den kausalen beziehungsweise loyalitätsbezogenen Sinn von ὑπέρ in würdigem, verständlichem Deutsch.
- source_word: παθόντες
  choice: gelitten haben
  rationale: Gibt den bewusst offenen Umfang des Leidens wieder, ohne ihn auf Martyrium oder Tod einzuengen.
theological_decisions:
- issue: Bezug des Gesetzes
  choice: das Gesetz
  alternative: den Sohn Gottes / die Verkündigung
  rationale: Der unmittelbare griechische Wortlaut nennt νόμος. Obwohl der weitere Kontext das Gesetz eng mit dem Sohn Gottes verbindet, wird diese Spannung nicht durch eine interpretierende Ersetzung aufgelöst.
- issue: Art des Leidens
  choice: gelitten haben
  alternative: als Märtyrer gestorben sind
  rationale: παθόντες bezeichnet Leiden, legt aber für sich genommen keinen Tod fest; die Übersetzung vermeidet daher eine konfessionell oder historisch verengende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ringkampf- und Siegeskranzbilder bleiben erhalten; der abschließende Satz folgt der knappen, feierlichen Form des Griechischen.
