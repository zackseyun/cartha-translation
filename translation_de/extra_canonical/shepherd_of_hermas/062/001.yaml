- from: 'Ich sage zu ihm: »Herr, lass mich wissen, was dieser Baum bedeutet. Denn ich kann mir nicht erklären, wie der Baum unversehrt sein kann, obwohl so viele Äste abgeschnitten worden sind, und wie man ihm nicht ansieht, dass etwas von ihm abgeschnitten wurde. Darüber bin ich ratlos.«'
  to: 'Ich sage zu ihm: »Herr, lass mich wissen, was dieser Baum ist; denn ich bin über ihn ratlos: Obwohl so viele Äste abgeschnitten wurden, ist der Baum gesund, und es scheint nichts von ihm abgeschnitten worden zu sein. Darüber bin ich ratlos.«'
