  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: de
  text: 'Ich sage zu ihm: »Herr, lass mich wissen, was dieser Baum ist; denn ich bin über ihn ratlos: Obwohl so viele Äste abgeschnitten wurden, ist der Baum gesund, und es scheint nichts von ihm abgeschnitten worden zu sein. Darüber bin ich ratlos.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Die ehrerbietige Anrede an die Gestalt wird in würdigem, natürlichem Deutsch mit »Herr« wiedergegeben.
- source_word: γνώρισόν μοι τί ἐστιν
  choice: lass mich wissen, was dieser Baum bedeutet
  rationale: Im Kontext fragt der Sprecher nach der sinnbildlichen Bedeutung des Baumes; »bedeutet« macht den idiomatischen Sinn deutlich, ohne die Deutung vorwegzunehmen.
- source_word: ἀποροῦμαι
  choice: ich kann mir nicht erklären / ich bin ratlos
  rationale: Die Wiederholung im Griechischen wird mit zwei natürlichen deutschen Wendungen erhalten, die Ratlosigkeit und Verständnisnot ausdrücken.
- source_word: κλάδων
  choice: Äste
  rationale: Bei einem großen Baum ist »Äste« im heutigen Deutsch natürlicher als »Zweige« und entspricht den abgeschnittenen Baumteilen.
- source_word: ὑγιές
  choice: unversehrt
  rationale: Das Wort bezeichnet hier den trotz des Abschneidens intakten Zustand des Baumes; »unversehrt« passt genauer als das auf Lebewesen bezogene »gesund«.
- source_word: οὐδὲν φαίνεται κεκομμένον ἀπ' αὐτοῦ
  choice: man sieht ihm nicht an, dass etwas von ihm abgeschnitten wurde
  rationale: Natürliche deutsche Wiedergabe der sichtbaren Ergebnislage des griechischen Perfekts.
