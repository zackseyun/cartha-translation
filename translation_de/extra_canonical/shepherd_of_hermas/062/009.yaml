base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: de
  text: Die anderen aber, die ebenfalls ihre Stäbe grün und mit Seitentrieben, jedoch ohne Frucht abgegeben haben, sind diejenigen, die um des Gesetzes willen bedrängt wurden, aber nicht gelitten und ihr Gesetz auch nicht verleugnet haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: Stäbe
  rationale: Entspricht dem wiederkehrenden Bild der zur Prüfung ausgegebenen und zurückgegebenen Stäbe; „Zweige“ wäre botanisch glatter, würde aber das Bild weniger genau wiedergeben.
- source_word: παραφυάδας
  choice: Seitentriebe
  rationale: Bezeichnet seitlich hervorgewachsene Schösslinge oder Triebe und passt natürlich zum Pflanzenbild.
- source_word: θλιβέντες
  choice: bedrängt wurden
  rationale: Bewahrt den passiven Sinn von Bedrängung oder Druck, ohne ihn vorschnell als Folter oder Martyrium zu bestimmen.
- source_word: παθόντες
  choice: gelitten
  rationale: Gibt das allgemeinere πάσχω formal wieder und erhält die auffällige Abstufung gegenüber θλιβέντες.
theological_decisions:
- issue: Abstufung zwischen Bedrängnis und Leiden
  choice: „bedrängt wurden, aber nicht gelitten“
  alternative: „bedrängt wurden, aber kein schweres Leiden erdulden mussten“
  rationale: Der griechische Text stellt θλιβέντες und μὴ παθόντες bewusst nebeneinander. Die Übersetzung bewahrt diese Spannung, statt eine bestimmte Intensitätsabstufung oder Märtyrertheologie ausdrücklich einzutragen.
- issue: Bezug von „ihr Gesetz“
  choice: „ihr Gesetz“
  alternative: „das Gesetz“
  rationale: Das Possessivpronomen αὐτῶν wird erhalten; dadurch bleibt die im Text betonte Zugehörigkeit der Betroffenen zum Gesetz sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildsprache des griechischen Textes. Die ungewöhnliche Spannung zwischen „bedrängt“ und „nicht gelitten“ bleibt absichtlich bestehen.
