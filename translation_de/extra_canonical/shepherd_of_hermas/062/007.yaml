  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/007.yaml
  text: “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”
translation:
  language: de
  text: „Wer sind nun, Herr“, fragte ich, „die Bekränzten, die in den Turm hineingehen?“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Gibt die ehrerbietige Anrede natürlich und traditionsgemäß wieder, ohne sie ausdrücklich als Gottesbezeichnung festzulegen.
- source_word: οἱ ἐστεφανωμένοι
  choice: die Bekränzten
  rationale: 'Bewahrt das Bild des empfangenen Siegeskranzes und die perfektische Bedeutung: Sie sind bereits bekränzt worden.'
- source_word: εἰς τὸν πύργον ὑπάγοντες
  choice: die in den Turm hineingehen
  rationale: Gibt die gegenwärtige Bewegung zum und in den Turm anschaulich wieder.
theological_decisions:
- issue: Bedeutung der Bekränzung
  choice: Das Bild bleibt ohne erklärenden Zusatz stehen.
  alternative: die mit dem Siegeskranz Ausgezeichneten
  rationale: Der unmittelbare Kontext deutet den Kranz als Auszeichnung für Überwindung und Leiden; die Frage selbst erklärt dies jedoch noch nicht, daher wird die Deutung nicht vorweggenommen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Redeeinleitung λέγω wird idiomatisch als „fragte ich“ wiedergegeben, da die Äußerung ausdrücklich eine Frage ist; die Satzstellung hält die direkte Rede flüssig und klar.
