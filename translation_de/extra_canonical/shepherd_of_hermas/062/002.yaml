base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: de
  text: „Hör zu“, sagt er. „Dieser große Baum, der Ebenen und Berge und die ganze Erde überschattet, ist das Gesetz Gottes, das der ganzen Welt gegeben wurde. Dieses Gesetz aber ist der Sohn Gottes, der bis an die Enden der Erde verkündigt worden ist. Und die Völker unter dem Schatten sind diejenigen, die die Verkündigung gehört haben und an ihn glaubten.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουε
  choice: Hör zu
  rationale: Gibt den direkten, auffordernden Imperativ natürlich und gegenwärtig wieder.
- source_word: σκεπάζον
  choice: überschattet
  rationale: Bewahrt das Bild eines ausgedehnten Baums, der Landflächen mit seinem Schatten bedeckt, und verbindet es mit der folgenden σκέπη.
- source_word: νόμος Θεοῦ
  choice: Gesetz Gottes
  rationale: Formale und kontextuell klare Wiedergabe der theologischen Identifikation des Baums.
- source_word: κηρυχθεὶς
  choice: verkündigt worden ist
  rationale: Der passive Aorist wird als vollzogene Verkündigung wiedergegeben, ohne den nicht genannten Verkündiger zu ergänzen.
- source_word: κήρυγμα
  choice: Verkündigung
  rationale: Bewahrt den Bezug zum vorhergehenden Verb κηρύσσω und vermeidet eine unnötige Einengung auf eine bestimmte Predigtform.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: an ihn glaubten
  rationale: Natürliches Deutsch für die personale Glaubenswendung mit εἰς; das maskuline Pronomen verweist grammatisch auf den Sohn Gottes.
theological_decisions:
- issue: Identifikation des Gesetzes mit dem Sohn Gottes
  choice: „Dieses Gesetz aber ist der Sohn Gottes“
  alternative: „Dieses Gesetz aber bedeutet den Sohn Gottes“
  rationale: Das griechische ἐστίν formuliert eine direkte Gleichsetzung. Die Übersetzung bewahrt diese auffällige theologische Aussage, statt sie deutend abzuschwächen.
- issue: Bezugswort von αὐτόν
  choice: „an ihn glaubten“ mit Bezug auf den Sohn Gottes
  alternative: „daran glaubten“ mit Bezug auf die Verkündigung
  rationale: Die maskuline Form αὐτόν stimmt mit υἱός überein, während κήρυγμα Neutrum ist; daher ist der personale Bezug grammatisch vorzuziehen.
- issue: Reichweite des Gesetzes
  choice: „der ganzen Welt gegeben“
  alternative: „für die ganze Welt gegeben“
  rationale: εἰς ὅλον τὸν κόσμον kann räumliche beziehungsweise zielgerichtete Reichweite ausdrücken. Die gewählte Form folgt eng der Aussage, ohne eine exklusive heilsgeschichtliche Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Bildsprache. Die direkte Gleichsetzung von Gesetz und Sohn Gottes sowie der Wechsel von Baum, Gesetz und Sohn bleiben bewusst unverändert und werden nicht harmonisiert.
