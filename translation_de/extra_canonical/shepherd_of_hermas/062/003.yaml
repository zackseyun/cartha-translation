base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: de
  text: Der große und herrliche Engel aber ist Michael, der Vollmacht über dieses Volk hat und es leitet. Denn er ist es, der ihnen das Gesetz in die Herzen der Glaubenden gibt. Darum sieht er selbst nach denen, denen er es gegeben hat, ob sie es wohl bewahrt haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: Gibt die übertragene Autorität Michaels würdig und präzise wieder, ohne bloßen Machtbesitz zu betonen.
- source_word: διακυβερνῶν
  choice: leitet
  rationale: Bezeichnet das lenkende und verwaltende Handeln in natürlichem modernem Deutsch.
- source_word: νόμος
  choice: Gesetz
  rationale: Entspricht der festen Bilddeutung im unmittelbaren Kontext und bewahrt die theologische Ausdrucksweise des griechischen Textes.
- source_word: ἐπισκέπτεται
  choice: prüft
  rationale: Im Zusammenhang geht es um eine kontrollierende Nachschau, ob das Gesetz bewahrt wurde; „prüft“ macht diese Funktion klar.
- source_word: τετηρήκασιν
  choice: bewahrt haben
  rationale: Bewahrt den Sinn von treuem Festhalten und Befolgen, statt ihn auf bloßes Einhalten zu verengen.
theological_decisions:
- issue: Michaels Verhältnis zum Gesetz und zu den Glaubenden
  choice: 'Die Aussagen werden ohne erklärende Harmonisierung direkt wiedergegeben: Michael gibt das Gesetz in die Herzen und prüft dessen Bewahrung.'
  alternative: Die Handlungen ausdrücklich als bloß vermittelte göttliche Tätigkeiten kennzeichnen.
  rationale: Der griechische Text schreibt diese Funktionen unmittelbar Michael zu. Eine dogmatische Präzisierung wäre ein nicht im Wortlaut stehender Zusatz.
- issue: Bezug von αὐτοῖς und τῶν πιστευόντων
  choice: „ihnen … in die Herzen der Glaubenden“
  alternative: 'Beide Ausdrücke vollständig angleichen: „den Glaubenden in ihre Herzen“'
  rationale: Die leicht unebene Syntax des Originals bleibt erkennbar, während der deutsche Satz verständlich bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und theologischen Zuschreibungen des griechischen Ausgangstextes bleiben erhalten; unnötig altertümliche Formen werden vermieden.
