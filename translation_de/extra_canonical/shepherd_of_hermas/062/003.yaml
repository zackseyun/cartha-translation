  source_fidelity: Der Entwurf gibt Michaels Vollmacht, sein leitendes Handeln, die Gabe des Gesetzes in die Herzen der Glaubenden sowie die anschließende Feststellung, ob es bewahrt wurde, insgesamt zutreffend wieder. „prüft“ ist im Kontext möglich, aber ἐπισκέπτεται bezeichnet vorrangig ein Aufsuchen bzw. Nachsehen. Das griechische ἄρα wird mit „auch“ nicht angemessen erfasst; es markiert hier die fragende Ungewissheit („ob sie es wohl ... haben“).
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „sieht ... nach“ bewahrt die Bildlichkeit und Funktion von ἐπισκέπτεται idiomatischer und genauer als das stärker abstrahierende „prüft“.
  terminology: „Vollmacht“, „Gesetz“ und „bewahrt haben“ sind angemessen. Die direkte Zuordnung der Handlungen zu Michael bleibt ohne dogmatische Umdeutung erhalten.
