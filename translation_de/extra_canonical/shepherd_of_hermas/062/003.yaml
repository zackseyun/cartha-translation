  - severity: low
    issue: „ob sie es auch bewahrt haben“ gibt ἄρα ungenau wieder.
    rationale: „Auch“ fügt einen additiven Akzent ein. ἄρα leitet hier die indirekte Frage mit einem Moment der Erkundigung/Ungewissheit ein; „ob sie es wohl bewahrt haben“ bildet dies ab.
