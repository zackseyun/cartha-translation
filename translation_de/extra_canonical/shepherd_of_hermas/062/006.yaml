base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: de
  text: »Alle, die das Gesetz übertreten haben, das sie von ihm empfangen haben«, sagt er, »hat er meiner Vollmacht zur Umkehr überlassen; alle aber, die dem Gesetz bereits wohlgefällig gewesen sind und es gehalten haben, hält er unter seiner eigenen Vollmacht.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν
  choice: übertreten haben
  rationale: Gibt den Gesetzesverstoß präzise und idiomatisch wieder.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: Bezeichnet hier den übertragenen beziehungsweise eigenen Zuständigkeits- und Herrschaftsbereich; „Vollmacht“ bewahrt diesen personalen Amtscharakter.
- source_word: μετάνοια
  choice: umkehren
  rationale: Die finale Wendung „damit sie umkehren“ gibt εἰς μετάνοιαν natürlich wieder und bezeichnet eine tatsächliche Sinnes- und Lebenswende.
- source_word: εὐηρέστησαν τῷ νόμῳ
  choice: dem Gesetz bereits gefallen
  rationale: Bewahrt die ungewöhnliche Personifizierung des Gesetzes und löst sie nicht stillschweigend als bloßen Gehorsam auf.
- source_word: ὑπὸ τὴν ἰδίαν ἐξουσίαν ἔχει
  choice: behält er unter seiner eigenen Vollmacht
  rationale: Gibt sowohl das fortdauernde ἔχει als auch den Gegensatz zur zuvor übertragenen Vollmacht wieder.
theological_decisions:
- issue: Zweck der Überlassung unter die Vollmacht des Sprechers
  choice: damit sie umkehren
  alternative: zur Buße
  rationale: Die Formulierung wahrt den Zweckcharakter von εἰς μετάνοιαν, ohne den Begriff auf eine bloße Gefühlsregung oder eine bestimmte kirchliche Bußpraxis einzuengen.
- issue: Verhältnis der Bewährten zum Gesetz
  choice: dem Gesetz bereits gefallen und es gehalten haben
  alternative: dem Gesetz bereits Genüge getan und es bewahrt haben
  rationale: Die Übersetzung erhält die Spannung zwischen dem personifiziert dargestellten Gesetz und dem konkreten Halten des Gesetzes, ohne beides zu einer einzigen Aussage zu verschmelzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und ihre eingeschobene Redeeinleitung bleiben erhalten; die ungewöhnliche Rede vom Gefallen des Gesetzes wird bewusst nicht geglättet.
