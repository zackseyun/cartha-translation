review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Gegensatz zwischen den Gesetzesübertretern, die der Sprecher zur Umkehr übernimmt, und denen, die das Gesetz bewahrt haben und unter der eigenen Vollmacht Michaels stehen, insgesamt zutreffend wieder. »Damit sie umkehren« ist als sinngemäße Wiedergabe von εἰς μετάνοιαν möglich. Die Übertragung von εὐηρέστησαν τῷ νόμῳ mit »dem Gesetz bereits gefallen« ist jedoch im Deutschen zu wörtlich und missverständlich.
  naturalness: »Dem Gesetz bereits gefallen« klingt im modernen Standarddeutsch unnatürlich, da »gefallen« hier vor allem als ästhetisches oder persönliches Gefallen verstanden wird. »Dem Gesetz wohlgefällig gewesen« ist idiomatischer, erhält aber die auffällige Personifizierung des Gesetzes.
  terminology: »Gesetz«, »übertreten«, »Vollmacht« und »Umkehr« sind sachgerecht. »Meiner Vollmacht überlassen« gibt κατέλιπεν ... εἰς τὴν ἐμὴν ἐξουσίαν klar wieder; die parallele Formulierung »unter seiner eigenen Vollmacht« wahrt den Kontrast des griechischen Textes.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von εὐηρέστησαν τῷ νόμῳ
    rationale: Die Formulierung »dem Gesetz bereits gefallen« ist zwar formal nah am Griechischen, wirkt aber im Deutschen semantisch schief. »Dem Gesetz wohlgefällig gewesen« bewahrt die Personifizierung und ist verständlicher.
  revised_text: »Alle, die das Gesetz übertreten haben, das sie von ihm empfangen haben«, sagt er, »hat er meiner Vollmacht zur Umkehr überlassen; alle aber, die dem Gesetz bereits wohlgefällig gewesen sind und es gehalten haben, hält er unter seiner eigenen Vollmacht.«
  revised_footnotes: []
