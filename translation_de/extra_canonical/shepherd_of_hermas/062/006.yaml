- from: »Alle, die das Gesetz übertreten haben, das sie von ihm empfingen«, sagt er, »hat er meiner Vollmacht überlassen, damit sie umkehren; alle aber, die dem Gesetz bereits gefallen und es gehalten haben, behält er unter seiner eigenen Vollmacht.«
  to: »Alle, die das Gesetz übertreten haben, das sie von ihm empfangen haben«, sagt er, »hat er meiner Vollmacht zur Umkehr überlassen; alle aber, die dem Gesetz bereits wohlgefällig gewesen sind und es gehalten haben, hält er unter seiner eigenen Vollmacht.«
  rationale: Die Revision beschränkt sich auf eine idiomatische und zugleich quellentreue Wiedergabe von εὐηρέστησαν τῷ νόμῳ. Zusätzlich wird εἰς μετάνοιαν knapp als »zur Umkehr« wiedergegeben, ohne den Zweckbezug oder den Bedeutungsumfang von μετάνοια auf eine konfessionelle Bußpraxis festzulegen.
