  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: de
  text: 'Er sagt: „Im ersten Gebot habe ich dir aufgetragen, den Glauben, die Gottesfurcht und die Selbstbeherrschung zu bewahren.“ „Ja, Herr“, sage ich. „Nun aber“, sagt er, „will ich dir auch ihre Kräfte darlegen, damit du verstehst, welche Kraft und Wirkung jede von ihnen hat. Denn ihre Wirkungen sind zweifach; sie gelten dem Gerechten wie dem Ungerechten. Du nun: Vertraue dem Gerechten, dem Ungerechten aber vertraue nicht. Denn das Rechte hat einen geraden Weg, das Unrechte dagegen einen krummen. Geh du aber auf dem geraden [und ebenen]a Weg und meide den krummen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστιν
  choice: Glauben
  rationale: Gibt den Grundbegriff der ersten Weisung wieder und bewahrt den Zusammenhang mit πιστεύω, auch wenn im weiteren Verlauf je nach Objekt natürlich mit „vertrauen“ übersetzt wird.
- source_word: φόβον
  choice: Gottesfurcht
  rationale: „Furcht“ steht hier in einer religiösen Tugendreihe; die explizierende Wiedergabe verhindert das moderne Missverständnis bloßer Angst, ohne eine konfessionelle Deutung einzutragen.
- source_word: ἐγκράτειαν
  choice: Selbstbeherrschung
  rationale: Natürliche moderne Wiedergabe der beherrschten Zurückhaltung gegenüber Begierden und Genüssen.
- source_word: δυνάμεις / δύναμιν
  choice: Kräfte / Kraft
  rationale: Bewahrt die wiederholte Wortwahl des Griechischen und unterscheidet sie von ἐνέργεια.
- source_word: ἐνέργειαν / ἐνέργειαι
  choice: Wirkung / Wirkungen
  rationale: Bezeichnet das wirksame Tätigsein bzw. die Auswirkungen der genannten Größen; „Wirkung“ ist im Deutschen klarer als das technische „Energie“.
- source_word: δικαίῳ / ἄδικῳ
  choice: dem Gerechten / dem Ungerechten
  rationale: Die substantivierten Neutra bleiben abstrakt und werden nicht vorschnell auf gerechte beziehungsweise ungerechte Personen eingeengt.
- source_word: πίστευε
  choice: Vertraue
  rationale: Mit Dativobjekt bedeutet das Verb hier, sich dem Gerechten anzuvertrauen bzw. ihm Glauben zu schenken; „vertraue“ klingt im Deutschen natürlicher als „glaube an“.
- source_word: πορεύου
  choice: Geh
  rationale: Erhält das Wegbild in knapper, gegenwärtiger Sprache.
- source_word: ἔασον
  choice: meide
  rationale: Gibt die praktische Aufforderung wieder, den krummen Weg zu verlassen beziehungsweise nicht zu beschreiten; „lass ihn“ wäre im Deutschen missverständlich.
theological_decisions:
- issue: Bezug von τῷ δικαίῳ und τῷ ἀδίκῳ
  choice: 'abstrakt: „dem Gerechten“ und „dem Ungerechten“'
  alternative: 'personal: „dem Gerechten“ und „dem Ungerechten“ im Sinn gerechter bzw. ungerechter Menschen'
  rationale: Die grammatisch substantivierten Neutra und der folgende Gegensatz „das Gerechte/das Ungerechte“ sprechen für moralische Größen oder Wirkbereiche. Die Übersetzung bewahrt diese Offenheit.
- issue: φόβος als Tugend
  choice: „Gottesfurcht“
  alternative: „Furcht“
  rationale: Der Kontext des Gebots und die frühchristliche Tugendsprache legen ehrfürchtige Gottesbezogenheit nahe; die Wiedergabe soll nicht den Eindruck gewöhnlicher Angst erwecken.
- issue: διπλαῖ ... αἱ ἐνέργειαι αὐτῶν
  choice: „ihre Wirkungen sind zweifach“
  alternative: „sie haben eine doppelte Wirksamkeit“
  rationale: Die Formulierung bewahrt die knappe Aussage und ihre gewisse Unbestimmtheit, ohne schon die später erläuterten zwei Engel in diesen Satz hineinzulesen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede und bewahrtem Wegbild. Die wiederholten griechischen Schlüsselwörter werden soweit möglich konsistent wiedergegeben; unnatürliche oder missverständliche Wörtlichkeit wird behutsam geglättet.
