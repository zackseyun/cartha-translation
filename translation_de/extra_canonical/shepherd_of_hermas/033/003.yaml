base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/003.yaml
  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s servants. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: de
  text: 'Wenn du also seine Werke erkannt hast, wende dich von ihm ab und schenke ihm keinerlei Vertrauen; denn seine Werke sind böse und für die Diener Gottes nicht zuträglich. Du hast das Wirken beider Engel; verstehe es und vertraue dem Engel der Gerechtigkeit. Vom Engel der Bosheit aber wende dich ab, denn seine Lehre ist bei jedem Tun böse. Denn selbst wenn jemand ein gläubiger Mann ist und der Gedanke dieses Engels in seinem Herzen aufsteigt, muss jener Mann oder jene Frau irgendeine Sünde begehen. Wenn dagegen ein Mann oder eine Frau noch so böse ist und die Werke des Engels der Gerechtigkeit in seinem oder ihrem Herzen aufsteigen, muss dieser Mensch notwendigerweise etwas Gutes tun. »Du siehst also«, sagt er, »dass es gut ist, dem Engel der Gerechtigkeit zu folgen und sich vom Engel der Bosheit loszusagen.«


    Was den Glauben betrifft, macht dieses Gebot Folgendes deutlich: Vertraue den Werken des Engels der Gerechtigkeit, und wenn du sie vollbringst, wirst du für Gott leben. Glaube aber, dass die Werke des Engels der Bosheit hart sind; wenn du sie also nicht vollbringst, wirst du für Gott leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέργειαι / ἔργα
  choice: Wirken / Werke
  rationale: Die Unterscheidung zwischen der wirkenden Tätigkeit der Engel und ihren konkreten Werken bleibt im Deutschen erkennbar.
- source_word: ἀσύμφορα
  choice: nicht zuträglich
  rationale: Gibt den Gedanken des Unnützen beziehungsweise Schädlichen würdig und verständlich wieder, ohne ihn auf bloßen materiellen Schaden zu verengen.
- source_word: ἐνθύμησις
  choice: Gedanke
  rationale: Bezeichnet hier den innerlich aufsteigenden Gedanken oder Impuls des bösen Engels; »Gedanke« wahrt diese Offenheit.
- source_word: ἀποτάξασθαι
  choice: sich lossagen
  rationale: Drückt eine entschiedene Abkehr aus und ist stärker als ein bloßes Meiden.
- source_word: χαλεπά
  choice: verderblich
  rationale: Im Kontext sind die Werke nicht lediglich schwierig oder beschwerlich, sondern unheilvoll; »verderblich« gibt diese ethische Schwere natürlich wieder.
- source_word: ζῆν τῷ Θεῷ
  choice: für Gott leben
  rationale: Bewahrt die knappe, theologisch offene Dativkonstruktion in idiomatischem Deutsch.
theological_decisions:
- issue: Zwangsläufigkeit des Handelns unter dem Einfluss der Engel
  choice: »muss ... begehen« und »muss ... notwendigerweise ... tun«
  alternative: »wird wahrscheinlich« oder »wird dazu verleitet«
  rationale: Das Griechische verwendet δεῖ und zusätzlich ἐξ ἀνάγκης. Die starke Notwendigkeit wird daher bewahrt, ohne sie zugunsten einer bestimmten Lehre über Willensfreiheit abzuschwächen.
- issue: Glaube beziehungsweise Vertrauen gegenüber den Werken und dem Engel
  choice: »vertrauen«
  alternative: »glauben«
  rationale: πιστεύειν mit Dativ bezeichnet hier vor allem das Vertrauen auf beziehungsweise in eine Person oder deren Werke. Im abschließenden Satz steht wegen der Inhaltssatzkonstruktion natürlich »Glaube aber, dass ...«.
- issue: Engel der Bosheit
  choice: »Engel der Bosheit«
  alternative: »böser Engel«
  rationale: Die Genitivformulierung des Ausgangstextes wird beibehalten und nicht vorschnell mit einer später systematisierten Gestalt identifiziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die wiederholte Gegenüberstellung der beiden Engel und die starken Notwendigkeitsformulierungen des griechischen Textes bleiben erhalten. Der Absatzwechsel markiert den Übergang zur abschließenden Erklärung des Gebots.
