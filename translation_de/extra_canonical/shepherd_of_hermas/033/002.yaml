  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: de
  text: Denn der krumme Weg hat keine gebahnten Pfade, sondern nur wegloses Gelände und viele Hindernisse; er ist rau und voller Dornen. Darum bringt er denen Schaden, die ihn gehen. Höre aber auch von den Werken des anderen Weges. Wenn dich zunächst Jähzorn oder Verbitterung überkommt, dann wisse, dass er in dir ist. Danach kommen das Verlangen nach vielerlei Tätigkeiten, kostspielige Speisen und berauschende Getränke, zahlreiche Trinkgelage, verschiedenartige Genüsse und Dinge, die sich nicht gehören, ferner das Verlangen nach Frauen, Habgier, Hochmut und Prahlerei sowie alles, was damit verwandt und ihm ähnlich ist. Wenn dies also in deinem Herzen aufsteigt, dann wisse, dass der Engel der Bosheit bei dir ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεβλὴ ὁδός
  choice: der krumme Weg
  rationale: Bewahrt das konkrete Wegbild und den moralischen Gegensatz zum geraden Weg.
- source_word: ἀνοδίας
  choice: wegloses Gelände
  rationale: Gibt das Fehlen eines gangbaren oder gebahnten Weges natürlich wieder.
- source_word: προσκόμματα
  choice: Hindernisse
  rationale: Bezeichnet Dinge, an denen man anstößt oder zu Fall kommt; „Hindernisse“ passt zum Wegbild.
- source_word: ὀξυχολία
  choice: Jähzorn
  rationale: Bezeichnet rasch aufwallenden Zorn und ist präziser als das allgemeinere „schlechtes Temperament“.
- source_word: πικρία
  choice: Verbitterung
  rationale: Erfasst hier eine innere bittere Haltung, ohne sie auf bloße Schärfe der Rede einzuengen.
- source_word: πράξεων πολλῶν
  choice: vielerlei Unternehmungen
  rationale: Bewahrt die offene Bedeutung von πράξεις als Tätigkeiten oder Vorhaben; eine moralische Bewertung wird nicht hinzugefügt.
- source_word: πολυτέλεια
  choice: verschwenderischer Aufwand
  rationale: Drückt kostspieligen Luxus beziehungsweise Übermaß aus und passt zur folgenden Aufzählung.
- source_word: μεθυσμάτων
  choice: berauschende Getränke
  rationale: Gibt den Bezug auf Getränke wieder, die Trunkenheit hervorrufen, und unterscheidet sie von den anschließenden Trinkgelagen.
- source_word: κραιπαλῶν
  choice: Trinkgelage
  rationale: Bezeichnet ausschweifendes Zechen; die Wiedergabe bleibt konkret und verständlich.
- source_word: τρυφῶν
  choice: Genüsse
  rationale: Bezeichnet luxuriöse oder verweichlichende Vergnügungen; „Genüsse“ wahrt die Breite des Ausdrucks.
- source_word: πλεονεξία
  choice: Habgier
  rationale: Gibt das ungezügelte Mehrhabenwollen in geläufigem modernem Deutsch wieder.
- source_word: ἀλαζονεία
  choice: Prahlerei
  rationale: Erfasst selbstüberhebliches, großsprecherisches Auftreten und hält es von ὑπερηφανία („Hochmut“) auseinander.
- source_word: ἄγγελος τῆς πονηρίας
  choice: Engel der Bosheit
  rationale: Formale Wiedergabe der Gestalt und ihres moralischen Bereichs, ohne sie mit einer anderen theologischen Figur gleichzusetzen.
theological_decisions:
- issue: Bezug des Pronomens in „dass er in dir ist“
  choice: Das maskuline Pronomen bleibt stehen und verweist im Kontext auf den Engel der Bosheit.
  alternative: Explizit „dass der Engel der Bosheit in dir ist“
  rationale: Der griechische Text formuliert pronominal und nennt den Engel erst am Ende ausdrücklich; die Übersetzung bewahrt diese Entwicklung.
- issue: Personale Wirksamkeit böser Impulse
  choice: Die Aussagen „er in dir“ und „der Engel der Bosheit bei dir“ werden ohne Abschwächung wiedergegeben.
  alternative: Psychologisierend als bloße innere Neigungen paraphrasieren
  rationale: Der Text beschreibt die Impulse ausdrücklich im Rahmen einer Engellehre; diese theologische Spannung darf nicht aufgelöst werden.
- issue: „Verlangen nach Frauen“
  choice: Die geschlechtsspezifische Formulierung des Ausgangstextes bleibt erhalten.
  alternative: Verallgemeinernd „sexuelles Begehren“
  rationale: Die konkrete historische Ausdrucksweise des griechischen Textes soll nicht stillschweigend erweitert oder modernisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Sprache. Das fortlaufende Wegbild bleibt anschaulich. Die Lasterreihe wird rhythmisch gegliedert, ohne ihre theologische oder moralische Schärfe abzuschwächen. Aufgrund einer Lücke beziehungsweise Beschädigung im bereitgestellten griechischen OCR-Text wurde der Übergang innerhalb des Absatzes anhand des erhaltenen griechischen Zusammenhangs und der auditierten englischen Konsultationsfassung formuliert.
