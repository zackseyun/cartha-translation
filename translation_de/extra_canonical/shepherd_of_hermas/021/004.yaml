  terminology: „umgekehrt“, „neu“ und „fest gegründet“ geben μετάνοια, νέοι und τεθεμελιωμένοι angemessen und ohne konfessionelle Einengung wieder. „Offenbarung“ ist für ἀποκάλυψις beizubehalten.
