base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: de
  text: Darum werden die, die vollständig umgekehrt sind, neu und fest gegründet sein – die, die von ganzem Herzen umgekehrt sind. Du hast die vollständige Offenbarung. Bitte nicht mehr um irgendetwas in Bezug auf Offenbarung; wenn aber etwas nötig ist, wird es dir offenbart werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: umgekehrt sind
  rationale: Gibt die vollzogene Sinnes- und Lebenswende natürlich wieder; „Buße getan haben“ wäre enger und im heutigen Deutsch stärker kirchensprachlich geprägt.
- source_word: ὁλοτελῶς
  choice: vollständig
  rationale: Bewahrt die Betonung einer umfassenden, nicht nur teilweisen Umkehr.
- source_word: τεθεμελιωμένοι
  choice: fest gegründet
  rationale: Erhält das Bild des gelegten Fundaments und zugleich den Gedanken dauerhafter Festigkeit.
- source_word: ἀπέχεις ὁλοτελῆ τὴν ἀποκάλυψιν
  choice: Du hast die Offenbarung vollständig erhalten
  rationale: ἀπέχεις bezeichnet hier, dass Hermas die Offenbarung nun vollständig besitzt beziehungsweise empfangen hat; die deutsche Formulierung ist klar und idiomatisch.
- source_word: μηκέτι μηδὲν αἰτήσεις
  choice: Bitte künftig um keine weitere Offenbarung
  rationale: Gibt das Verbot weiteren Bittens natürlich wieder; „künftig“ bildet μηκέτι ab, „weitere“ verhindert im Deutschen die missverständliche Vorstellung, er solle überhaupt nichts mehr erbitten.
theological_decisions:
- issue: Bedeutung von μετάνοια
  choice: Umkehr
  alternative: Buße
  rationale: „Umkehr“ hält den umfassenden Wandel von Herz und Leben offen und vermeidet eine Verengung auf Reue oder eine bestimmte kirchliche Bußpraxis.
- issue: Zukunftsaussage über die Umgekehrten
  choice: werden … neu und fest gegründet sein
  alternative: werden … erneuert und gefestigt werden
  rationale: Die gewählte Fassung wahrt das Adjektiv νέοι („neu“) und das Fundamentbild des Partizips τεθεμελιωμένοι, ohne eine zusätzliche handelnde Instanz ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung zur Umkehr bleibt als nachdrückliche Präzisierung des griechischen Satzes erhalten; der Gedankenstrich macht diese Wiederaufnahme lesbar, ohne sie aufzulösen.
