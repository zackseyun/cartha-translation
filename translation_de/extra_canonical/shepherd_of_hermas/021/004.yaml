  source_fidelity: 'Die Aussage über die vollständig Umgekehrten und das Fundamentbild sind im Entwurf zutreffend wiedergegeben. Im abschließenden Weisungsabschnitt verengt „Bitte künftig um keine weitere Offenbarung“ όμως μηκέτι μηδὲν αἰτήσεις περὶ ἀποκαλύψεως: Das Griechische untersagt nicht nur die Bitte um eine weitere Offenbarung, sondern jede weitere Bitte in Fragen der Offenbarung. Außerdem bezeichnet ὁλοτελῆ unmittelbar „die Offenbarung“ als vollständig.'
