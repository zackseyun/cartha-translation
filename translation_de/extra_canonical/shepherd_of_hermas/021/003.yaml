base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: de
  text: Und weil du sie auf einer Bank[a] sitzen sahst, ist ihre Stellung fest; denn die Bank hat vier Füße und steht fest. Denn auch die Welt wird durch vier Elemente zusammengehalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf einem Sitzmöbel.'
    reason: συμψέλιον ist selten und kann allgemein einen gemeinsamen oder breiteren Sitz bezeichnen; der Kontext verlangt jedenfalls ein Möbel mit vier Füßen.
  - marker: b
    text: Gemeint sind die vier Elemente der antiken Weltvorstellung.
    reason: Diese knappe Erläuterung macht den historischen kosmologischen Bezug verständlich, ohne die im Text nicht genannten Elemente aufzuzählen.
lexical_decisions:
- source_word: συμψέλιον
  choice: Bank
  rationale: Das Wort bezeichnet hier ein Sitzmöbel mit vier Füßen; „Bank“ gibt den Gegenstand natürlich und im Einklang mit dem Kontext wieder.
- source_word: ἡ θέσις
  choice: ihr Sitz
  rationale: Im Zusammenhang geht es sowohl um die Sitzposition der Frau als auch um deren sinnbildliche Festigkeit. „Ihr Sitz“ bewahrt diesen konkreten Bezug besser als das abstraktere „die Stellung“.
- source_word: κρατεῖται
  choice: wird … zusammengehalten
  rationale: Das Passiv bezeichnet, dass die Welt durch die vier Elemente Bestand und Halt hat; „zusammengehalten“ bildet diese Vorstellung idiomatisch ab.
- source_word: στοιχείων
  choice: Elemente
  rationale: Gemeint sind in der antiken Kosmologie die vier Grundelemente; der etablierte deutsche Ausdruck ist „Elemente“.
theological_decisions:
- issue: Symbolische Bedeutung der vier Füße und vier Elemente
  choice: Die Aussage bleibt als Begründung der Festigkeit stehen, ohne die Symbolik weiter auszudeuten.
  alternative: Die vier Elemente ausdrücklich als Erde, Wasser, Luft und Feuer benennen oder kirchlich deuten.
  rationale: Der griechische Text nennt die Elemente nicht einzeln und bietet an dieser Stelle keine weitergehende theologische Identifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Festigkeits-Sprache des griechischen Textes wird bewusst erhalten; die Satzstruktur bleibt klar und gut lesbar.
