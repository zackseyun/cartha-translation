  text: But in the third vision you saw her younger, beautiful, and cheerful, and her appearance was beautiful.
translation:
  language: de
  text: Doch in der dritten Vision sahst du sie jünger, schön und heiter, und ihre Gestalt war schön.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  choice: jünger
  rationale: Der Komparativ wird formal und natürlich wiedergegeben; gemeint ist ihr gegenüber den früheren Erscheinungen jüngeres Aussehen.
- source_word: καλὴν
  choice: schön
  rationale: Die übliche Bedeutung passt sowohl zur Person als auch zur anschließend genannten Gestalt und bewahrt die Wiederholung des Griechischen.
- source_word: ἱλαράν
  choice: heiter
  rationale: Bezeichnet eine sichtbar frohe, freundliche Stimmung; „heiter“ ist knapp, würdig und im Kontext natürlich.
- source_word: μορφή
  choice: Gestalt
  rationale: Gibt die sichtbare äußere Erscheinungsform wieder, ohne sie enger auf Gesicht oder Aussehen zu beschränken.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die auffällige Wiederholung von „schön“ im griechischen Text bleibt erhalten.
