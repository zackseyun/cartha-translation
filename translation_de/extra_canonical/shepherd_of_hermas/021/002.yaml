base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: de
  text: Denn wenn einem Menschen, der traurig ist, eine gute Nachricht kommt, vergisst er sogleich seinen früheren Kummer und nimmt nichts anderes mehr an als die Nachricht, die er gehört hat. Von da an wird er für das Gute gestärkt, und sein Geist wird durch die Freude, die er empfangen hat, erneuert. Ebenso habt auch ihr eine Erneuerung eurer Geister empfangen, weil ihr diese guten Dinge gesehen habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπουμένῳ / λυπῶν
  choice: der traurig ist / Sorgen
  rationale: Die kontextbezogene Wiedergabe unterscheidet natürlich zwischen dem Zustand des Menschen und den vorherigen Leiderfahrungen, ohne den Sinn zu verändern.
- source_word: ἀγγελία ἀγαθή
  choice: eine gute Nachricht
  rationale: Dies ist die natürliche moderne Entsprechung; der Ausdruck bezeichnet hier allgemein eine erfreuliche Mitteilung.
- source_word: οὐδὲν ἄλλο προσδέχεται
  choice: nimmt nichts anderes mehr auf
  rationale: Die Formulierung bewahrt den Gedanken, dass die gehörte Nachricht die ganze Aufmerksamkeit des Trauernden beansprucht, ohne ein unpassendes wörtliches »empfängt« zu erzwingen.
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: wird ... zum Guten gestärkt
  rationale: Die zielgerichtete Wendung εἰς τὸ ἀγαθόν bleibt erhalten; »zum Guten« wahrt die mögliche ethische Bedeutung.
- source_word: ἀνανεοῦται ... τὸ πνεῦμα / ἀνανέωσιν ... τῶν πνευμάτων
  choice: sein Geist wird ... erneuert / eine Erneuerung eurer Geister
  rationale: Singular und Plural des griechischen Textes werden ausdrücklich bewahrt, ebenso die Wiederholung des Erneuerungsmotivs.
- source_word: ταῦτα τὰ ἀγαθά
  choice: diese guten Dinge
  rationale: Die offene substantivische Formulierung des Ausgangstextes wird nicht näher bestimmt oder theologisierend eingeengt.
theological_decisions:
- issue: Bedeutung von πνεῦμα und πνεύματα
  choice: Geist / Geister
  alternative: Inneres / neues Leben
  rationale: Die direkte Wiedergabe erhält die anthropologische und möglicherweise geistliche Mehrdeutigkeit des griechischen Ausdrucks.
- issue: Bedeutung von τὸ ἀγαθόν
  choice: das Gute
  alternative: gutes Handeln
  rationale: Die Übersetzung lässt offen, ob allgemein das Gute oder konkret gutes Handeln gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die vergleichende Struktur und die Wiederholungen des griechischen Textes bleiben erkennbar; unnötige konfessionelle oder dogmatische Präzisierungen wurden vermieden.
