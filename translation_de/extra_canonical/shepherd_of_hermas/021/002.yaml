  to: Denn wenn einem Menschen, der traurig ist, eine gute Nachricht kommt, vergisst er sogleich seinen früheren Kummer und nimmt nichts anderes mehr an als die Nachricht, die er gehört hat. Von da an wird er für das Gute gestärkt, und sein Geist wird durch die Freude, die er empfangen hat, erneuert. Ebenso habt auch ihr eine Erneuerung eurer Geister empfangen, weil ihr diese guten Dinge gesehen habt.
