revisions:
- from: 'Halte also dieses Gebot: Wenn du das Gute tust und dich nicht davon zurückhältst, wirst du für Gott leben; und alle, die so handeln, werden für Gott leben. Und wiederum: Wenn du das Böse nicht tust und dich davon zurückhältst, wirst du für Gott leben; und alle werden für Gott leben, die diese Gebote halten und nach ihnen leben.'
  to: 'Halte also dieses Gebot: Wenn du das Gute tust und dich dessen nicht enthältst, wirst du für Gott leben; und alle, die so handeln, werden für Gott leben. Und wiederum: Wenn du das Böse nicht tust und dich dessen enthältst, wirst du für Gott leben; und alle, die diese Gebote halten und nach ihnen leben, werden für Gott leben.'
  rationale: 'Die Revision stellt den für den Abschnitt zentralen Wortstamm ἐγκρατ- durch „sich enthalten“ wieder her, ohne die Aussage zu verändern. Sie bewahrt damit sowohl die Wiederholung als auch den Kontrast: Vom Bösen soll man sich enthalten, vom Guten nicht. Die Stellung von „alle, die“ wird zur klaren deutschen Entsprechung der abschließenden universalen Relativformulierung vereinheitlicht.'
