base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: de
  text: 'Halte also dieses Gebot: Wenn du das Gute tust und dich dessen nicht enthältst, wirst du für Gott leben; und alle, die so handeln, werden für Gott leben. Und wiederum: Wenn du das Böse nicht tust und dich dessen enthältst, wirst du für Gott leben; und alle, die diese Gebote halten und nach ihnen leben, werden für Gott leben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: Halte
  rationale: Gibt im Zusammenhang das fortdauernde Befolgen und Bewahren eines Gebots natürlich wieder.
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: dich davon zurückhältst
  rationale: Bewahrt den Leitgedanken der Selbstbeherrschung, klingt im Deutschen aber idiomatischer als eine wörtliche Formulierung mit „Enthaltsamkeit üben“.
- source_word: ζήσῃ τῷ θεῷ
  choice: wirst du für Gott leben
  rationale: Gibt den griechischen Dativ bewusst eng wieder und lässt offen, ob Zugehörigkeit, Ausrichtung oder ein gottgemäßes Leben im Vordergrund steht.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: nach ihnen leben
  rationale: Die wörtliche Wegmetapher „in ihnen wandeln“ ist im heutigen Standarddeutsch markiert; „nach ihnen leben“ vermittelt den praktischen Lebensvollzug klar.
theological_decisions:
- issue: Bedeutung von ζῆν τῷ θεῷ
  choice: für Gott leben
  alternative: vor Gott leben / bei Gott leben
  rationale: Der griechische Dativ bestimmt die Beziehung nicht genauer. „Für Gott leben“ bleibt quellennah und vermeidet eine vorschnelle Festlegung auf Gegenwart vor Gott oder endzeitliches Leben bei Gott.
- issue: Verhältnis von Tun, Gebotstreue und Leben
  choice: Die konditionale Form des Griechischen bleibt unverändert stehen.
  alternative: Durch erklärende Zusätze abschwächen oder als ausdrückliche Heilsverdienstlehre formulieren.
  rationale: Der Text verbindet gutes Handeln und das Meiden des Bösen unmittelbar mit dem Leben für Gott. Diese theologische Spannung darf weder harmonisiert noch dogmatisch ausgeweitet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an Syntax und Wiederholungen des griechischen Textes. Die parallele Struktur zwischen dem Tun des Guten und dem Unterlassen des Bösen wurde erhalten.
