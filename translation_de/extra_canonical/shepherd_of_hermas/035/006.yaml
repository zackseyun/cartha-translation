  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/006.yaml
  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the servants of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: de
  text: „Scheinen dir diese Dinge nicht böse zu sein?“ „Sie sind sehr böse, Herr, für die Diener Gottes“, sage ich. „Wer Gott dient, muss sich all dieser Dinge enthalten. Enthalte dich also all dieser Dinge, damit du für Gott lebst und zusammen mit denen verzeichnet wirst, die sich dieser Dinge enthalten. Dies sind also die Dinge, deren du dich enthalten musst.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: sich fernhalten / halte dich fern
  rationale: Das Verb bezeichnet hier Selbstbeherrschung durch Enthaltung von den zuvor genannten bösen Taten. Die idiomatische Wendung „sich von etwas fernhalten“ bewahrt den Bezug zu konkretem Fehlverhalten und vermeidet das im Deutschen unnatürliche „Selbstbeherrschung von etwas üben“.
- source_word: τὸν δουλεύοντα τῷ θεῷ
  choice: wer Gott dient
  rationale: Gibt das substantivierte Partizip natürlich und inklusiv wieder, ohne den Sinn des Dienstes für Gott abzuschwächen.
- source_word: ζήσῃ τῷ θεῷ
  choice: für Gott lebst
  rationale: Bewahrt den Dativbezug des griechischen Ausdrucks und seine theologische Offenheit.
- source_word: ἐγγραφήσῃ
  choice: eingetragen wirst
  rationale: Entspricht dem Bild der Aufnahme in ein Verzeichnis oder eine Gemeinschaft, ohne genauer festzulegen, um welches Register es sich handelt.
- source_word: τοῖς δούλοις τοῦ θεοῦ
  choice: für die Diener Gottes
  rationale: Bewahrt den Dativ und die traditionelle Dienst-Metaphorik des Ausgangstextes.
theological_decisions:
- issue: Bedeutung des Lebens für Gott
  choice: „damit du für Gott lebst“
  alternative: „damit du vor Gott leben kannst“
  rationale: Das Griechische ζῆν τῷ θεῷ bezeichnet eine auf Gott ausgerichtete Lebensweise; „für Gott“ hält diese Beziehung offen und führt keine forensische Bedeutung ein.
- issue: Eintragung unter die Enthaltsamen
  choice: „unter denen eingetragen wirst“
  alternative: „zu denen gerechnet wirst“
  rationale: Die konkrete Registermetaphorik von ἐγγραφήσῃ bleibt erhalten, ohne sie als Eintragung in ein bestimmtes himmlisches Buch zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Terminologie des griechischen Abschnitts wird soweit möglich bewahrt; wegen deutscher Idiomatik wird ἐγκρατεύεσθαι mit „sich fernhalten“ statt mit einer sperrigen Formulierung um „Selbstbeherrschung“ wiedergegeben.
