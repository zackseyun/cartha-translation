  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/011.yaml
  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: de
  text: „Scheinen dir diese Dinge gut zu sein?“, fragt er. „Was ist denn besser als diese, Herr?“, antworte ich. „Dann lebe nach ihnen“, sagt er, „und halte dich nicht von ihnen zurück; so wirst du für Gott leben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖ σοι ... ταῦτα ἀγαθὰ εἶναι
  choice: Hältst du das für gut?
  rationale: Gibt die prüfende Frage idiomatisch wieder; das griechische Neutrum Plural verweist gesammelt auf die zuvor genannten guten Werke.
- source_word: Τί γὰρ ... τούτων ἀγαθώτερον;
  choice: Was könnte denn besser sein als das?
  rationale: Bewahrt den rhetorischen Sinn und die verstärkende Funktion von γάρ in natürlichem Deutsch.
- source_word: Πορεύου ... ἐν αὐτοῖς
  choice: richte dein Leben danach aus
  rationale: Das semitisch gefärbte Bild des Wandelns bezeichnet hier die praktische Lebensführung; die Formulierung bleibt würdig und ist für heutige Leser unmittelbar verständlich.
- source_word: μὴ ἐγκρατεύου ἀπ᾿ αὐτῶν
  choice: halte dich nicht davon zurück
  rationale: Bewahrt das im ganzen Mandat entfaltete Wortspiel mit ἐγκράτεια, ohne das im Deutschen missverständliche wörtliche 'übe keine Enthaltsamkeit davon' zu verwenden.
- source_word: ζήσῃ τῷ θεῷ
  choice: wirst du für Gott leben
  rationale: Gibt den Dativ τῷ θεῷ formal nah und verständlich wieder, ohne ihn vorschnell als 'mit Gott' oder 'vor Gott' auszudeuten.
theological_decisions:
- issue: Bedeutung von ζῆν τῷ θεῷ
  choice: für Gott leben
  alternative: vor Gott leben / mit Gott leben
  rationale: Der griechische Dativ lässt die genaue Beziehung offen. 'Für Gott leben' wahrt den Ziel- und Zugehörigkeitsbezug und entspricht dem wiederkehrenden Ausdruck des Werkes, ohne zusätzliche Heilsvorstellungen einzutragen.
- issue: Verhältnis guter Werke zum Leben für Gott
  choice: 'Die konditionale Folge wird unverändert stehen gelassen: entsprechendes Handeln führt zum Leben für Gott.'
  alternative: Eine ausdrückliche dogmatische Erklärung über Verdienst, Gnade oder Rechtfertigung ergänzen
  rationale: Der Ausgangstext formuliert eine ethische Verheißung, erklärt aber an dieser Stelle nicht systematisch deren soteriologischen Mechanismus. Diese Spannung darf nicht konfessionell aufgelöst werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Dialogform bleibt knapp und lebendig. Singularisches „das/danach/davon“ fasst die unmittelbar zuvor aufgezählten guten Handlungen kollektiv zusammen. Keine Fußnoten erforderlich.
