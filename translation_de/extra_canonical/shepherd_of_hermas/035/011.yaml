  to: „Scheinen dir diese Dinge gut zu sein?“, fragt er. „Was ist denn besser als diese, Herr?“, antworte ich. „Dann lebe nach ihnen“, sagt er, „und halte dich nicht von ihnen zurück; so wirst du für Gott leben.“
