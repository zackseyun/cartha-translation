  source_fidelity: Die Wiedergabe von ἐγκρατεύεσθαι ἀπό als „sich ... enthalten“ trifft den hier geforderten Verzicht auf die genannten Handlungen gut. Der Superlativ πάντων πονηρότατα wird im Entwurf jedoch durch „gehören zu den schlimmsten“ abgeschwächt; das Griechische sagt ausdrücklich, dass diese Werke die schlimmsten von allen sind.
  naturalness: Der Text ist insgesamt flüssiges, würdevolles modernes Standarddeutsch. „Diese Taten gehören zu den schlimmsten Übeln“ ist allerdings sowohl semantisch abgeschwächt als auch stilistisch weniger präzise, weil die Taten zu „Übeln“ umgedeutet werden.
  terminology: „Diener Gottes“ gibt δοῦλος τοῦ θεοῦ sachgerecht wieder. „Für Gott leben“ ist als natürliche deutsche Wiedergabe von ζῆσαι τῷ θεῷ vertretbar. Die Wiederaufnahme von „Werken“ in der Folgesatzkonstruktion bewahrt die griechische Terminologie besser.
