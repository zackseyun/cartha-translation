base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the servant of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: de
  text: Diese Taten sind die schlimmsten von allen im Leben der Menschen. Von diesen Werken muss sich der Diener Gottes daher enthalten; denn wer sich von ihnen nicht enthält, kann nicht für Gott leben. Höre nun auch, was darauf folgt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔργα
  choice: Taten
  rationale: Gibt konkrete menschliche Handlungen natürlich und präzise wieder; die Wiederholung im Griechischen wird weitgehend bewahrt.
- source_word: πάντων πονηρότατα
  choice: gehören zu den schlimmsten Übeln
  rationale: Bewahrt den Superlativ und vermeidet die im Deutschen schwerfällige Formulierung „die bösesten von allen“; πάντων kann sich im Kontext allgemein auf die genannten bösen Taten beziehen.
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: sich von … fernhalten / sich ihrer enthalten
  rationale: Die Konstruktion bezeichnet hier Selbstbeherrschung in Form des Verzichts auf böse Handlungen. Die beiden idiomatischen Wendungen bewahren den Sinn ohne unnatürliche Wiederholung.
- source_word: ζῆσαι τῷ θεῷ
  choice: für Gott leben
  rationale: Bewahrt den Dativbezug und klingt im modernen Deutschen natürlicher als „Gott leben“.
- source_word: τὰ ἀκόλουθα τούτων
  choice: was sich daran anschließt
  rationale: Lässt offen, ob weitere Übel oder inhaltlich folgende Ausführungen gemeint sind, und bildet die Übergangsformel natürlich ab.
theological_decisions:
- issue: Bedeutung von ζῆσαι τῷ θεῷ
  choice: für Gott leben
  alternative: vor Gott leben / Gott leben
  rationale: „Für Gott leben“ wahrt die ethisch-relationale Aussage, ohne einen spezifischen soteriologischen Sinn hinzuzufügen; das ungewöhnliche „Gott leben“ wäre im Deutschen unverständlich.
- issue: Reichweite des Superlativs πάντων πονηρότατα
  choice: gehören zu den schlimmsten Übeln
  alternative: sind die allerschlimmsten Taten
  rationale: Die gewählte Formulierung bewahrt die starke Wertung, legt aber nicht unnötig fest, dass jede zuvor genannte Tat ausnahmslos schlimmer als jede andere denkbare Sünde sei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der paränetische Ton und die wiederholte Bezugnahme auf „diese Taten“ bleiben erhalten; die griechische Begriffskette um ἐγκράτεια wird idiomatisch als Sich-Fernhalten beziehungsweise Sich-Enthalten wiedergegeben.
