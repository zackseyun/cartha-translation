review_pass:
  verdict: revise
  source_fidelity: 'Die Aufzählung und ihre Imperativstruktur werden insgesamt treffend wiedergegeben. Eine Korrektur ist bei ἐσκανδαλισμένους ἀπὸ τῆς πίστεως angezeigt: „am Glauben Anstoß genommen“ kann im Deutschen vor allem ein Sich-Ärgern am Glauben bezeichnen, während der griechische Ausdruck hier ein Straucheln bzw. Abirren in Bezug auf den Glauben nahelegt. „Im Glauben gestrauchelt“ bewahrt die bildhafte und nicht weiter spezifizierte Aussage.'
  naturalness: Der Text ist überwiegend flüssig und angemessen würdevoll. „die in ihrer Seele Ermatteten“ und besonders „die Sündigenden“ wirken im modernen Standarddeutsch jedoch unnötig schwerfällig. Die revidierten Formulierungen sind natürlicher, ohne den listenhaften Charakter des Originals zu glätten.
  terminology: „Diener Gottes“, „Gerechtigkeit“, „geschwisterliche Gemeinschaft“ und „freikaufen“ sind sachgerecht. „Ruhig zu sein“ gibt ἡσύχιον unmittelbarer wieder als „friedlich“, ohne die konkrete Bedeutung auf bloße Konfliktvermeidung zu verengen.
  issues:
  - severity: medium
    issue: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
    rationale: „am Glauben Anstoß genommen haben“ verschiebt die Aussage in Richtung eines Ärgernisses, das der Glaube verursacht. Der Kontext und die Wendung mit ἀπό sprechen eher für Menschen, die im Blick auf den Glauben gestrauchelt oder von ihm abgekommen sind. „im Glauben gestrauchelt sind“ lässt den Grad der Abwendung offen.
  - severity: low
    issue: Kάμνοντας τῇ ψυχῇ und ἁμαρτάνοντας
    rationale: „in ihrer Seele Ermatteten“ und „die Sündigenden“ sind verständlich, aber im heutigen Deutsch stilistisch sperrig. „innerlich Ermüdeten“ und „diejenigen, die sündigen“ sind idiomatischer und semantisch gleichwertig.
  - severity: low
    issue: ἡσύχιον εἶναι
    rationale: „friedlich“ ist als Deutung möglich, doch „ruhig zu sein“ entspricht dem Grundsinn von ἡσύχιος direkter und wahrt die knappe Reihung des Ausgangstextes.
