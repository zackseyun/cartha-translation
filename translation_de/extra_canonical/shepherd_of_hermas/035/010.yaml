base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: de
  text: '„Höre nun, was sich daran anschließt: Witwen zu dienen, nach Waisen und Bedürftigen zu sehen, die Diener Gottes aus Notlagen freizukaufen, gastfreundlich zu sein – denn in der Gastfreundschaft bietet sich bisweilen Gelegenheit, Gutes zu tun –, sich niemandem zu widersetzen, ruhig zu sein, sich niedriger zu stellen als alle Menschen, die Älteren zu achten, Gerechtigkeit zu üben, die geschwisterliche Gemeinschaft zu bewahren, Beleidigungen zu ertragen, langmütig zu sein, keinen Groll zu hegen, die innerlich Ermüdeten zu ermutigen, diejenigen, die im Glauben gestrauchelt sind, nicht fallen zu lassen, sondern sie zurückzuführen und ihnen neuen Mut zu geben, diejenigen, die sündigen, zurechtzuweisen, Schuldner und Bedürftige nicht zu bedrängen und alles zu tun, was dem ähnlich ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑστερουμένους
  choice: Bedürftigen
  rationale: Das Partizip bezeichnet Menschen, denen es am Nötigen fehlt; „Bedürftige“ ist natürlich und sachlich.
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: aus Notlagen freizukaufen
  rationale: Bewahrt sowohl den konkreten Loskaufgedanken von λυτροῦσθαι als auch die offene Mehrzahl möglicher Zwangs- und Notlagen.
- source_word: ἀγαθοποίησίς
  choice: Gelegenheit, Gutes zu tun
  rationale: Im Zusammenhang der Gastfreundschaft ist eine idiomatische Wiedergabe sinnvoll; das seltene Substantiv bezeichnet Wohltun beziehungsweise eine gute Tat.
- source_word: ἡσύχιον
  choice: friedlich
  rationale: Kann „ruhig“ oder „still“ bedeuten; in der Reihe sozialer Verhaltensweisen vermittelt „friedlich“ den gemeinten unstreitbaren Lebenswandel natürlich.
- source_word: ἐνδεέστερον γίνεσθαι
  choice: sich geringer zu machen
  rationale: Bewahrt den komparativen und demütigenden Sinn, ohne ihn auf materielle Armut festzulegen.
- source_word: ἀδελφότητα
  choice: geschwisterliche Gemeinschaft
  rationale: Bezeichnet die Gemeinschaft der Glaubensgeschwister, nicht nur eine abstrakte Tugend oder eine institutionelle Bruderschaft.
- source_word: κάμνοντας τῇ ψυχῇ
  choice: die in ihrer Seele Ermatteten
  rationale: Gibt das Bild innerer Ermüdung möglichst direkt und verständlich wieder.
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: diejenigen, die am Glauben Anstoß genommen haben
  rationale: Bewahrt die Bildsprache von σκανδαλίζω und die mögliche Spannung zwischen Straucheln, Anstoßnehmen und Abirren.
- source_word: εὐθύμους ποιεῖν
  choice: ihnen neuen Mut zu geben
  rationale: Das Verbgefüge meint, sie wieder zuversichtlich beziehungsweise guten Mutes zu machen.
- source_word: θλίβειν
  choice: bedrängen
  rationale: Deckt Druck, Bedrückung und harte Behandlung ab und passt sowohl zu Schuldnern als auch zu Bedürftigen.
theological_decisions:
- issue: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως und die Stellung der Betroffenen zum Glauben
  choice: „diejenigen, die am Glauben Anstoß genommen haben“
  alternative: „die vom Glauben abgeirrt sind“ oder „die im Glauben gestrauchelt sind“
  rationale: Der griechische Ausdruck lässt offen, ob ein inneres Straucheln, ein Anstoß am Glauben oder eine weitergehende Abwendung gemeint ist. Die Übersetzung legt keinen endgültigen Glaubensabfall fest.
- issue: ἀδελφότητα als soziale oder ekklesiale Größe
  choice: „die geschwisterliche Gemeinschaft“
  alternative: „die Bruderschaft“
  rationale: Die inklusive, gemeindliche Bedeutung wird wiedergegeben, ohne eine bestimmte Kirchenstruktur einzutragen.
- issue: λυτροῦσθαι als wörtlicher Loskauf oder allgemeine Hilfe
  choice: „freizukaufen“
  alternative: „zu befreien“
  rationale: Der konkrete Erlösungs- beziehungsweise Loskaufbegriff bleibt erhalten; die Art der Notlage wird nicht dogmatisch bestimmt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange parataktische Tugendliste des Griechischen bleibt als zusammenhängende Aufzählung erhalten. Partizipien wurden überwiegend mit Infinitivgruppen wiedergegeben; unnötige kirchliche Fachsprache wurde vermieden.
