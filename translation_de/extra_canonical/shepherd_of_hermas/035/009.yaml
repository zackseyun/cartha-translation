base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: de
  text: 'Vor allem anderen: Glaube, Ehrfurcht vor dem Herrn, Liebe, Eintracht, Worte der Gerechtigkeit, Wahrheit und Standhaftigkeit. Nichts im menschlichen Leben ist besser als diese. Wer diese bewahrt und sich ihrer nicht enthält, wird in seinem Leben selig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: Glaube
  rationale: Die übliche und im Kontext natürliche Wiedergabe; das Griechische lässt sowohl Glauben als Haltung als auch Treue anklingen, ohne hier eindeutig zwischen beiden zu entscheiden.
- source_word: φόβος κυρίου
  choice: Ehrfurcht vor dem Herrn
  rationale: Gibt die religiöse Bedeutung von φόβος natürlich wieder, ohne den Aspekt der Gottesfurcht auf bloße Angst zu verengen.
- source_word: ὁμόνοια
  choice: Eintracht
  rationale: Bezeichnet Übereinstimmung und friedliche Verbundenheit; „Eintracht“ ist knapp, würdig und verständlich.
- source_word: ῥήματα δικαιοσύνης
  choice: Worte der Gerechtigkeit
  rationale: Bewahrt die konkrete Formulierung des Griechischen und vermeidet eine unnötige Umdeutung zu „gerechten Worten“ oder „wahrhaftiger Rede“.
- source_word: ὑπομονή
  choice: Standhaftigkeit
  rationale: Erfasst hier das beharrliche Ausharren als Tugend natürlicher als das im Deutschen leicht passive „Geduld“.
- source_word: φυλάσσῃ
  choice: daran festhält
  rationale: Im Zusammenhang mit Tugenden bedeutet das Verb, sie zu bewahren und im Leben zu beachten; „festhalten“ klingt im Deutschen idiomatisch.
- source_word: μακάριος γίνεται
  choice: wird … glücklich zu nennen sein
  rationale: Bewahrt den Sinn von μακάριος als beglückt bzw. seliggepriesen, ohne eine spezifisch konfessionelle Färbung einzutragen.
theological_decisions:
- issue: Bedeutung von φόβος κυρίου
  choice: Ehrfurcht vor dem Herrn
  alternative: Furcht des Herrn / Gottesfurcht
  rationale: „Ehrfurcht“ vermittelt die religiös-ethische Haltung verständlich, ohne die im Ausdruck liegende Ernsthaftigkeit ganz auf Angst festzulegen.
- issue: Paradoxe Formulierung μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν
  choice: sich dessen nicht enthält
  alternative: sich darin nicht zurückhält
  rationale: Die ungewöhnliche Anwendung von „Enthaltsamkeit/Selbstbeherrschung“ auf gute Dinge gehört zur Argumentation des Abschnitts und wird deshalb nicht geglättet.
translation_notes:
  register: Moderne, würdige Standardsprache. Die aufzählende Struktur und die bewusste Spannung der Formulierung über das Sich-Enthalten von guten Dingen bleiben erhalten; die Ergänzung „zu nennen“ macht μακάριος idiomatisch, ohne den Aussagegehalt zu verstärken.
