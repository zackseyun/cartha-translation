base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: de
  text: '„Sag mir, Herr“, sagte ich, „wovon man sich enthalten muss und wovon nicht.“ Er sagte: „Höre: Vom Bösen enthalte dich und tu es nicht; vom Guten aber enthalte dich nicht, sondern tu es. Denn wenn du dich vom Guten enthältst, indem du es nicht tust, begehst du eine große Sünde; wenn du dich aber vom Bösen enthältst, indem du es nicht tust, vollbringst du große Gerechtigkeit. Enthalte dich also von jeder Bosheit und tu das Gute.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώρισόν μοι
  choice: Lass mich erkennen
  rationale: Gibt die Bitte um Unterweisung natürlich wieder, ohne sie unnötig auf bloße Information zu verengen.
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: sich enthalten / sich zurückhalten
  rationale: Der Kontext verlangt Selbstbeherrschung im Sinn des Abstandnehmens von einer Handlung. Die leichte Variation vermeidet im Deutschen schwerfällige Wiederholungen, bewahrt aber den gedanklichen Gegensatz.
- source_word: τὸ πονηρόν
  choice: das Böse
  rationale: Entspricht dem substantivierten griechischen Adjektiv und hält den moralischen Begriff allgemein.
- source_word: τὸ ἀγαθόν
  choice: das Gute
  rationale: Bewahrt die substantivierte und umfassende Form des Ausgangstextes.
- source_word: ἁμαρτίαν μεγάλην ἐργάζῃ
  choice: begehst du eine große Sünde
  rationale: Natürliches modernes Deutsch für das griechische Idiom, wörtlich etwa ‚wirkst du eine große Sünde‘.
- source_word: δικαιοσύνην μεγάλην ἐργάζῃ
  choice: übst du große Gerechtigkeit
  rationale: Bewahrt δικαιοσύνη als ‚Gerechtigkeit‘ und den aktiven Sinn von ἐργάζῃ, ohne daraus eine Aussage über zugerechnete Rechtfertigung zu machen.
- source_word: ἀπὸ πονηρίας πάσης
  choice: von jeder Bosheit
  rationale: Gibt die umfassende Reichweite von πάσης und den abstrakten Charakter von πονηρία wieder.
theological_decisions:
- issue: Bedeutung von δικαιοσύνην μεγάλην ἐργάζῃ
  choice: übst du große Gerechtigkeit
  alternative: vollbringst du ein großes gerechtes Werk
  rationale: Die gewählte Fassung hält am abstrakten Begriff ‚Gerechtigkeit‘ fest und lässt offen, wie diese Aussage innerhalb einer umfassenderen Soteriologie einzuordnen ist.
- issue: Beziehung von Selbstbeherrschung und gutem Handeln
  choice: 'Der paradoxe Wortgebrauch wird beibehalten: Man soll sich vom Bösen enthalten, aber nicht vom Guten.'
  alternative: Den Gegensatz erklärend als ‚Böses meiden und Gutes tun‘ glätten
  rationale: Die Wiederholung von ἐγκρατεύεσθαι ist ein tragendes rhetorisches Merkmal und soll nicht durch eine theologische oder stilistische Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die anaphorische Gegenüberstellung von Bösem und Gutem sowie die imperativische Unterweisung bleiben erhalten. Keine Fußnoten erforderlich.
