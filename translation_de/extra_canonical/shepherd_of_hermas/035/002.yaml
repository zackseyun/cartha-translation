  to: '„Sag mir, Herr“, sagte ich, „wovon man sich enthalten muss und wovon nicht.“ Er sagte: „Höre: Vom Bösen enthalte dich und tu es nicht; vom Guten aber enthalte dich nicht, sondern tu es. Denn wenn du dich vom Guten enthältst, indem du es nicht tust, begehst du eine große Sünde; wenn du dich aber vom Bösen enthältst, indem du es nicht tust, vollbringst du große Gerechtigkeit. Enthalte dich also von jeder Bosheit und tu das Gute.“'
