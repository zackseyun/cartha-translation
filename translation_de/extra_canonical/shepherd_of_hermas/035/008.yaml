  to: '„Herr“, sagte ich, „zeige mir auch die Kraft der guten Dinge, damit ich in ihnen lebe und ihnen diene und, indem ich sie tue, gerettet werden kann.“ Er sagte: „Höre nun auch von den guten Werken, die du tun und von denen du dich nicht enthalten sollst.“'
  rationale: Die Revision stellt die im Griechischen wiederholten Pluralbezüge wieder her, ohne die bewusst offene Bedeutung von δύναμις oder die Aussage über Rettung konfessionell zu erläutern. „In ihnen lebe“ gibt die ethische Lebensführung von πορευθῶ ἐν αὐτοῖς modern wieder; „ihnen diene“ bewahrt die auffällige, aber eindeutige Konstruktion δουλεύσω αὐτοῖς.
