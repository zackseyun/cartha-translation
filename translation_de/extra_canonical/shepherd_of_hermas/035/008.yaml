  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: de
  text: '„Herr“, sagte ich, „zeige mir auch die Kraft der guten Dinge, damit ich in ihnen lebe und ihnen diene und, indem ich sie tue, gerettet werden kann.“ Er sagte: „Höre nun auch von den guten Werken, die du tun und von denen du dich nicht enthalten sollst.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀγαθῶν / αὐτοῖς / αὐτά
  choice: des Guten / darin / ihm / es
  rationale: Der griechische Plural bezeichnet hier die guten Dinge beziehungsweise guten Taten als zusammengehörige Größe. Im Deutschen wirkt der wiederholte abstrakte Singular „das Gute“ natürlicher und hält den Bezug durchgehend klar.
- source_word: δύναμις
  choice: Kraft
  rationale: „Kraft“ bewahrt sowohl den Gedanken der Wirksamkeit als auch den des sittlichen Vermögens, ohne die Bedeutung auf „Sinn“ oder „Wert“ einzuengen.
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: darin lebe
  rationale: Die wörtliche Wendung „in ihnen wandeln“ bezeichnet die praktische Lebensführung. „Darin leben“ ist modernes, verständliches Deutsch und wahrt den ethischen Sinn.
- source_word: δουλεύσω αὐτοῖς
  choice: ihm diene
  rationale: Das starke Verb δουλεύω wird mit „dienen“ wiedergegeben. Der ungewöhnliche Gedanke, dem Guten zu dienen, bleibt erhalten.
- source_word: τὰ ἔργα
  choice: Werke
  rationale: „Werke“ bewahrt die bewusste Anknüpfung an das konkrete Tun, das im folgenden Abschnitt aufgezählt wird.
- source_word: μὴ ἐγκρατεύεσθαι
  choice: dich nicht von ihnen zurückhalten
  rationale: Im Kontext bedeutet ἐγκρατεύεσθαι nicht allgemein Selbstbeherrschung, sondern sich einer Handlung zu enthalten. Die Formulierung bildet den Gegensatz zum Sichenthalten vom Bösen verständlich ab.
theological_decisions:
- issue: Verhältnis guter Werke zur Rettung
  choice: „indem ich es tue, gerettet werden kann“
  alternative: „damit ich durch ihre Ausübung gerettet werde“
  rationale: Die Übersetzung bewahrt sowohl den Mittelgedanken des Partizips ἐργασάμενος als auch die Möglichkeitsform δυνηθῶ. Sie glättet die Aussage nicht durch eine konfessionelle Erklärung des Verhältnisses von Tun und Rettung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dialogische Form bleibt knapp und mündlich; zugleich werden die ungewohnten ethischen Formulierungen des griechischen Textes nicht theologisch harmonisiert.
