  naturalness: Der Entwurf ist gut verständlich und im würdigen modernen Standarddeutsch formuliert. Die pluralische Fassung lässt sich ohne stilistische Härte natürlich ausdrücken.
  terminology: „Kraft“ ist als Wiedergabe von δύναμις möglich und bewahrt die offene Bedeutung. „Sich von ihnen enthalten“ gibt μὴ ἐγκρατεύεσθαι in diesem Kontext präziser wieder als „sich von ihnen zurückhalten“.
