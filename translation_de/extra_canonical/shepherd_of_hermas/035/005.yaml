base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: de
  text: '„Gibt es denn noch weitere böse Taten, Herr?“, fragte ich. „Ja, sogar viele“, sagte er, „von denen sich ein Diener Gottes fernhalten muss: Diebstahl, Lüge, Vorenthaltung, falsches Zeugnis, Habgier, böse Begierde, Täuschung, eitle Ruhmsucht, Prahlerei und alles, was diesen Dingen ähnlich ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλέμμα
  choice: Diebstahl
  rationale: Bezeichnet konkret das Gestohlene beziehungsweise den Akt des Stehlens; „Diebstahl“ ist im Deutschen die natürliche Entsprechung in dieser Lasterliste.
- source_word: ἀποστέρησις
  choice: Betrug
  rationale: Das Wort bezeichnet das Vorenthalten oder Entziehen dessen, was einem anderen zusteht; „Betrug“ gibt hier die schuldhafte Schädigung knapp und verständlich wieder.
- source_word: πλεονεξία
  choice: Habgier
  rationale: Erfasst das maßlose Habenwollen und ist in einer ethischen Lasterliste präziser als das allgemeinere „Gier“.
- source_word: κενοδοξία
  choice: eitle Ruhmsucht
  rationale: Bewahrt sowohl den Gedanken des leeren, nichtigen Ruhms als auch das Streben nach Anerkennung.
- source_word: ἀλαζονεία
  choice: Prahlerei
  rationale: Gibt das anmaßende Sich-Brüsten und großsprecherische Auftreten wieder und unterscheidet es von κενοδοξία.
- source_word: ἐγκρατεύεσθαι
  choice: sich fernhalten
  rationale: Im Kontext der Enthaltung von bösen Taten ist diese natürliche deutsche Wendung klarer als das missverständliche reflexive „sich beherrschen“, ohne den Gedanken bewusster Selbstdisziplin aufzugeben.
theological_decisions:
- issue: Bezeichnung δοῦλος τοῦ θεοῦ
  choice: Diener Gottes
  alternative: Sklave Gottes
  rationale: „Diener Gottes“ ist im modernen würdigen Deutsch die etablierte und verständliche Wiedergabe der religiösen Selbstbindung; die härtere soziale Bedeutung von δοῦλος wird in diesem kurzen Segment nicht eigens hervorgehoben.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dialogische Form und der katalogartige Rhythmus des griechischen Textes bleiben erhalten; die Lasterbegriffe werden klar voneinander unterschieden.
