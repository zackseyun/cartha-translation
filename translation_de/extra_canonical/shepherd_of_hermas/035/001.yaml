base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: de
  text: „Ich habe dir gesagt“, sagt er, „dass die von Gott geschaffenen Dinge von zweierlei Art sind; denn auch die Enthaltsamkeit ist von zweierlei Art. Bei manchen Dingen muss man sich enthalten, bei anderen dagegen nicht.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: die von Gott geschaffenen Dinge
  rationale: Gibt den Plural κτίσματα weit und sachlich wieder, ohne ihn auf Menschen, Lebewesen oder eine bestimmte Schöpfungsordnung einzuengen.
- source_word: ἐγκράτεια / ἐγκρατεύεσθαι
  choice: Enthaltsamkeit / sich enthalten
  rationale: Bewahrt die Wiederholung derselben griechischen Wortfamilie und passt zum Gegensatz zwischen dem Meiden des Bösen und dem Nicht-Zurückhalten des Guten.
- source_word: διπλᾶ / διπλῆ
  choice: von zweierlei Art
  rationale: Drückt die hier erläuterte Zweiteilung natürlich aus, ohne eine materielle Verdoppelung anzudeuten.
- source_word: φησίν
  choice: sagt er
  rationale: Bewahrt das historische Präsens der dialogischen Erzählung.
theological_decisions:
- issue: Bedeutung von κτίσματα τοῦ θεοῦ
  choice: 'allgemein: „die von Gott geschaffenen Dinge“'
  alternative: „Gottes Geschöpfe“ oder eine nähere Bestimmung der zwei Arten
  rationale: Der Satz lässt offen, worin die Zweiteilung des Geschaffenen genau besteht. Die Übersetzung bewahrt diese Spannung und vermeidet eine nachträgliche dogmatische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und der begriffliche Zusammenhang zwischen ἐγκράτεια und ἐγκρατεύεσθαι bleiben hörbar; es sind keine Fußnoten erforderlich.
