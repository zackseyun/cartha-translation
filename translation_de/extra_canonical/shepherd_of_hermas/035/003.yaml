base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: de
  text: '„Was für Bosheiten, Herr“, fragte ich, „sind es, von denen wir uns enthalten müssen?“ Er sagte: „Höre: Enthalte dich von Ehebruch und Unzucht, von gesetzloser Trunkenheit, von verwerflichem Luxus, von vielen Speisen, von der Pracht des Reichtums, von Prahlerei, Hochmut und Überheblichkeit, von Lüge, Verleumdung und Heuchelei, von Nachtragen und jeder Lästerung.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποταπαί … αἱ πονηρίαι
  choice: Welche Arten von Bosheit
  rationale: Gibt die qualitative Frage ποταπαί und den Plural der einzelnen bösen Verhaltensweisen in natürlichem Deutsch wieder.
- source_word: ἐγκρατεύεσθαι
  choice: sich enthalten
  rationale: Im Kontext bezeichnet das Verb den bewussten Verzicht auf böse Handlungen; „sich enthalten“ bewahrt den wiederkehrenden Gedanken der Selbstbeherrschung.
- source_word: μοιχεία καὶ πορνεία
  choice: Ehebruch und Unzucht
  rationale: Unterscheidet den spezifischen Ehebruch von dem weiteren Begriff sexueller Unmoral, ohne πορνεία unnötig einzuengen.
- source_word: μέθυσμα ἀνομίας
  choice: gesetzlose Trunkenheit
  rationale: Bewahrt die ungewöhnliche Verbindung von Trunkenheit und Gesetzlosigkeit im griechischen Text.
- source_word: τρυφὴ πονηρά
  choice: ausschweifender Luxus
  rationale: τρυφή meint weichliche beziehungsweise schwelgerische Lebensführung; die Formulierung vermittelt ihre moralisch negative Färbung.
- source_word: ἐδέσματα πολλά
  choice: übermäßiges Essen
  rationale: Das wörtliche „viele Speisen“ bezeichnet hier im Katalog eine maßlose Fülle von Nahrung und wird idiomatisch wiedergegeben.
- source_word: πολυτέλεια πλούτου
  choice: Prunk des Reichtums
  rationale: Erfasst kostspielige Pracht beziehungsweise verschwenderische Zurschaustellung, die mit Reichtum verbunden ist.
- source_word: κατάλαλια
  choice: Verleumdung
  rationale: Bezeichnet üble, herabsetzende Rede über andere; „Verleumdung“ ist in diesem Sündenkatalog klar und geläufig.
- source_word: μνησικακία
  choice: Nachtragen
  rationale: Gibt das Festhalten an erlittenem Unrecht und den daraus erwachsenden Groll alltagsnah wieder.
- source_word: βλασφημία
  choice: Lästerung
  rationale: Bewahrt die mögliche Breite von schmähender Rede gegen Gott oder Menschen, ohne sie ausschließlich als Gotteslästerung festzulegen.
theological_decisions:
- issue: Reichweite von βλασφημία
  choice: jede Lästerung
  alternative: jede Gotteslästerung
  rationale: Das griechische Wort kann Gotteslästerung, aber auch allgemein schmähende Rede bezeichnen. Der nicht näher bestimmte Ausdruck lässt diese semantische Offenheit bestehen.
- issue: Bedeutungsumfang von πορνεία
  choice: Unzucht
  alternative: sexuelle Unmoral
  rationale: „Unzucht“ ist knapp und würdevoll und hält den Ausdruck von „Ehebruch“ unterscheidbar; er wird nicht auf eine einzelne sexuelle Handlung verengt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die katalogartige Reihung des Griechischen bleibt erkennbar, wird jedoch durch Kasusführung und Zeichensetzung für heutige Leser geglättet. Keine Fußnoten erforderlich.
