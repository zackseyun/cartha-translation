  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: de
  text: „Hör nun, was du nicht unterlassen, sondern tun sollst“, sagt er. „Halte dich nicht vom Guten zurück, sondern tu es.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύου
  choice: sich zurückhalten / unterlassen
  rationale: Das Verb bezeichnet hier Selbstbeherrschung im Sinn des Abstandnehmens. Im Deutschen wäre „Selbstbeherrschung üben“ beim Guten missverständlich und unnatürlich; die kontextgemäße Wiedergabe bewahrt den bewussten Verzicht als Kern der Aussage.
- source_word: τὸ ἀγαθόν
  choice: das Gute
  rationale: Die substantivische Form wahrt die allgemeine ethische Aussage des Griechischen.
- source_word: ποίει αὐτό
  choice: tu es
  rationale: Die knappe imperativische Wiederaufnahme des Guten wird entsprechend der Vorlage bewahrt.
- source_word: ἄκουε
  choice: Hör nun
  rationale: Der Imperativ leitet die folgende Unterweisung ein; „nun“ stellt im Deutschen den Übergang natürlich her.
