translation_notes:
  register: Moderne, würdevolle und leicht verständliche Standardsprache. Die Wiederholung und der Gegensatz zwischen Zurückhaltung und aktivem Tun bleiben erhalten; die schwerfällige wörtliche Formulierung „sich nicht selbst beherrschen“ wird vermieden.
