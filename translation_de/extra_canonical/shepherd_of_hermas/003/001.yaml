base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: de
  text: Doch nicht deswegen ist Gott zornig auf dich, sondern damit du deine Familie, die gegen den Herrn und gegen uns, ihre Eltern, gesündigt hat, zum Herrn und zu uns zurückführst.[a] Weil du aber deine Kinder zu sehr lieb hast, hast du deine Familie nicht zurechtgewiesen, sondern zugelassen, dass sie schwer zugrunde gerichtet wurde.[b] Deshalb ist der Herr zornig auf dich. Doch er wird alles frühere Böse in deiner Familie heilen. Denn wegen ihrer Sünden und gesetzlosen Taten bist du selbst durch die Angelegenheiten des täglichen Lebens zugrunde gegangen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Herrn und zu uns, ihren Eltern“. Der ungewöhnliche Plural steht so im griechischen Text.'
    reason: Die Sprecherperspektive ist auffällig und soll weder stillschweigend berichtigt noch harmonisiert werden.
  - marker: b
    text: Das griechische Wort kann auch bedeuten, dass sie schwer verdorben oder schwer geschädigt wurde.
    reason: „Zugrunde gerichtet“ gibt die Stärke des Ausdrucks wieder, erschöpft aber nicht dessen Bedeutungsbreite.
  - marker: c
    text: 'Oder: „bist du selbst von den Angelegenheiten des täglichen Lebens zugrunde gerichtet worden“. Der genaue Zusammenhang zwischen dem Verderben und den Angelegenheiten des täglichen Lebens ist sprachlich nicht völlig eindeutig.'
    reason: Die Präposition ἀπό kann hier Ursache, Ausgangspunkt oder vermittelnden Zusammenhang bezeichnen; die Übersetzung soll diese Unsicherheit offenlegen.
lexical_decisions:
- source_word: οἶκος
  choice: Familie
  rationale: Im Zusammenhang bezeichnet das Wort nicht das Gebäude, sondern den Hausverband, besonders die Kinder. „Familie“ ist hier im modernen Deutsch verständlicher als „Haus“ oder „Haushalt“.
- source_word: ἐπιστρέψῃς
  choice: zur Umkehr bringst
  rationale: Die transitive Form fordert Hermas dazu auf, seine Familie zur Umkehr zu führen; „zurückbringst“ wäre ohne genanntes Ziel im Deutschen unklar.
- source_word: φιλότεκνος
  choice: zu sehr an deinen Kindern hingst
  rationale: Das Wort bedeutet wörtlich „kinderliebend“. Der Kontext kritisiert jedoch eine nachsichtige, die Zurechtweisung unterlassende Zuneigung; die Formulierung gibt diese kontextuelle Nuance wieder, ohne Elternliebe an sich abzuwerten.
- source_word: νουθετέω
  choice: zurechtweisen
  rationale: Das Verb umfasst mahnende Unterweisung. „Zurechtweisen“ passt zum Vorwurf und bleibt in heutigem Deutsch natürlich.
- source_word: καταφθαρῆναι / κατεφθάρης
  choice: zugrunde gerichtet wurde / zugrunde gerichtet worden
  rationale: Die starken Passivformen bezeichnen schwere Schädigung oder Verderben. Die parallele Wiedergabe bewahrt die Wiederholung des griechischen Wortstamms.
- source_word: βιωτικὰ πράγματα
  choice: weltliche Angelegenheiten
  rationale: Gemeint sind Belange des gegenwärtigen Lebens, wahrscheinlich wirtschaftliche oder alltägliche Verhältnisse; die allgemeinere Übersetzung vermeidet eine unbelegte Verengung.
theological_decisions:
- issue: Zweck von Gottes Zorn
  choice: „sondern damit du … zur Umkehr bringst“
  alternative: „sondern er ist zornig, weil du … nicht zur Umkehr gebracht hast“
  rationale: Der griechische Finalsatz mit ἵνα stellt Gottes Zorn ausdrücklich in einen auf Umkehr gerichteten Zweckzusammenhang. Diese Spannung wird nicht zu einer bloßen Begründung umgedeutet.
- issue: Heilung vergangenen Bösen
  choice: „er wird alles Böse heilen“
  alternative: „er wird alle früheren Schäden beseitigen“
  rationale: Die auffällige Heilungsmetapher des Verbs ἰάομαι wird beibehalten, ohne genauer festzulegen, ob Schuld, Folgen oder familiäre Schäden gemeint sind.
- issue: „gegen uns, ihre Eltern“
  choice: wörtlich im Haupttext bewahrt
  alternative: „gegen dich, ihren Vater“
  rationale: Der überlieferte griechische Plural „uns … ihre Eltern“ ist ungewöhnlich, aber textlich klar bezeugt. Eine Harmonisierung würde die Identität oder Perspektive der Sprecherin interpretierend festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die langen griechischen Satzketten wurden maßvoll gegliedert. Wiederholungen von „Familie“, „zornig“ und „zugrunde gerichtet“ bleiben erhalten, weil sie die Argumentationsstruktur und Wortverknüpfungen des Ausgangstextes tragen.
