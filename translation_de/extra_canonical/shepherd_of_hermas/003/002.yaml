base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: de
  text: 'Doch das große Erbarmen des Herrn hat sich deiner und deines Hauses erbarmt. Er wird dich stärken und dich in seiner Herrlichkeit fest gründen. Werde du nur nicht nachlässig, sondern fasse Mut und stärke dein Haus. Denn wie ein Schmied sein Werk mit dem Hammer bearbeitet und so das erreicht, was er beabsichtigt, so überwindet auch das gerechte Wort, wenn es täglich gesprochen wird, jede Bosheit. Höre daher nicht auf, deine Kinder zurechtzuweisen. Denn ich weiß: Wenn sie von ganzem Herzen umkehren, werden sie zusammen mit den Heiligen in die Bücher des Lebens eingetragen werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Bücher des Lebens“; der griechische Text verwendet hier den Plural.'
    reason: Der Plural ist gegenüber der geläufigen Wendung „Buch des Lebens“ auffällig und soll ausdrücklich sichtbar bleiben.
lexical_decisions:
- source_word: πολυσπλαγχνία
  choice: das große Erbarmen
  rationale: Gibt die intensive Bedeutung von tiefem, reichem Mitgefühl in natürlichem und würdigem Deutsch wieder.
- source_word: οἶκος
  choice: Haus
  rationale: Bewahrt die mögliche Bedeutungsbreite von Haushalt, Familie und Hausgemeinschaft; aus dem Zusammenhang sind besonders die Kinder eingeschlossen.
- source_word: ἰσχυροποιήσει / ἰσχυροποίει
  choice: stärken / stärke
  rationale: Erhält die bewusste Wiederholung desselben Verbstamms im Griechischen.
- source_word: ῥαθυμήσῃς
  choice: nachlässig werden
  rationale: Bezeichnet hier träges Nachlassen in der verantwortlichen Sorge um das eigene Haus.
- source_word: εὐψύχει
  choice: fasse Mut
  rationale: Natürliche Wiedergabe der Aufforderung, guten Mutes zu sein.
- source_word: περιγίνεται
  choice: erreicht / überwindet
  rationale: Das Verb bezeichnet je nach Ergänzung ein Erlangen beziehungsweise die Oberhand gewinnen; die unterschiedlichen deutschen Verben machen beide kontextuellen Beziehungen verständlich.
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  choice: das gerechte Wort, wenn es täglich gesprochen wird
  rationale: Versteht καθημερινός als tägliche, fortgesetzte Rede bzw. Ermahnung und vermeidet die missverständliche Vorstellung eines bloß alltäglichen Wortes.
- source_word: μετανοήσωσιν
  choice: umkehren
  rationale: Drückt Sinnes- und Lebensänderung aus, ohne den Begriff auf bloßes Bedauern zu verengen.
- source_word: βίβλους τῆς ζωῆς
  choice: Bücher des Lebens
  rationale: Bewahrt den griechischen Plural βίβλους, auch wenn die geläufigere biblische Formulierung oft im Singular steht.
theological_decisions:
- issue: Göttliches Erbarmen und menschliche Verantwortung
  choice: 'Beide Aussagen bleiben unmittelbar nebeneinander stehen: Der Herr erbarmt sich und stärkt, Hermas soll Mut fassen, sein Haus stärken und seine Kinder weiter zurechtweisen.'
  alternative: Die Stärkung ausschließlich als bedingte Folge menschlicher Anstrengung oder ausschließlich als voraussetzungslose Zusage auslegen.
  rationale: Der griechische Text verbindet Zusage und Aufforderung, ohne ihr Verhältnis systematisch aufzulösen.
- issue: Eintragung in die Bücher des Lebens
  choice: Die Eintragung wird als Folge einer Umkehr von ganzem Herzen wiedergegeben.
  alternative: Die Aussage durch eine bestimmte Lehre über Erwählung, Heilsgewissheit oder Verdienst näher bestimmen.
  rationale: Der Text nennt die ernsthafte Umkehr als Bedingung, legt aber keine weitergehende dogmatische Systematik dar.
- issue: οἱ ἅγιοι
  choice: die Heiligen
  alternative: die Gläubigen oder Gottes Volk
  rationale: Die formnahe Wiedergabe bewahrt den frühchristlichen theologischen Ausdruck und seine Bedeutungsweite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die Wiederholung von „stärken“ und die Bildsprache des Schmieds wurden bewahrt; syntaktische Härten des Griechischen wurden behutsam geglättet.
