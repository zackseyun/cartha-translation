  to: „Siehe, der Gott der Mächte, der durch seine unsichtbare und gewaltige Kraft und durch seine große Einsicht die Welt erschaffen, durch seinen herrlichen Ratschluss seine Schöpfung mit Schönheit umkleidet, durch sein machtvolles Wort den Himmel befestigt und die Erde auf den Wassern gegründet und durch seine eigene Weisheit und Fürsorge seine heilige Gemeinde erschaffen hat, die er auch segnete – siehe, er versetzt die Himmel, die Berge, die Hügel und die Meere, und alles wird eben für seine Erwählten, damit er ihnen die Verheißung gibt, die er ihnen mit großer Herrlichkeit und Freude verheißen hat, wenn sie die Satzungen Gottes halten, die sie in großem Glauben empfangen haben.“
  rationale: Die einzige bedeutungsrelevante Änderung ersetzt „die Verheißung erfüllt“ durch „die Verheißung gibt“, um ἀποδῷ direkt wiederzugeben und die Verheißung dennoch als das zu erhalten, was Gott zuvor zugesagt hat. Zusätzlich wird „auf den Wassern“ idiomatisch und näher am bestimmten griechischen Plural formuliert. Die übrigen bewussten offenen und bildhaften Formulierungen bleiben erhalten.
