base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: de
  text: „Siehe, der Gott der Mächte, der durch seine unsichtbare und gewaltige Kraft und durch seine große Einsicht die Welt erschaffen, durch seinen herrlichen Ratschluss seine Schöpfung mit Schönheit umkleidet, durch sein machtvolles Wort den Himmel befestigt und die Erde auf den Wassern gegründet und durch seine eigene Weisheit und Fürsorge seine heilige Gemeinde erschaffen hat, die er auch segnete – siehe, er versetzt die Himmel, die Berge, die Hügel und die Meere, und alles wird eben für seine Erwählten, damit er ihnen die Verheißung gibt, die er ihnen mit großer Herrlichkeit und Freude verheißen hat, wenn sie die Satzungen Gottes halten, die sie in großem Glauben empfangen haben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: der Gott der Mächte
  rationale: Gibt den griechischen Genitiv formal wieder und bewahrt die mögliche Bedeutung himmlischer Mächte, ohne ihn vorschnell auf „Heerscharen“ festzulegen.
- source_word: συνέσει
  choice: Einsicht
  rationale: Entspricht dem schöpferischen Verstehen bzw. Erkenntnisvermögen Gottes und klingt im modernen Deutschen natürlich.
- source_word: τῇ ἐνδόξῳ βουλῇ
  choice: durch seinen herrlichen Ratschluss
  rationale: „Ratschluss“ erfasst hier den planenden Willen besser als das moderne, leicht institutionell klingende „Rat“.
- source_word: περιθεὶς τὴν εὐπρέπειαν
  choice: mit Schönheit umkleidet
  rationale: Bewahrt das bildhafte περιτίθημι („umlegen, umkleiden“) und gibt εὐπρέπεια als sichtbare Schönheit bzw. Pracht wieder.
- source_word: πήξας
  choice: befestigt
  rationale: Gibt das Festmachen oder Fixieren des Himmels wieder, ohne ein unnötig technisches Bild einzuführen.
- source_word: προνοίᾳ
  choice: Fürsorge
  rationale: Bewahrt sowohl den Gedanken vorausschauender Sorge als auch göttlicher Vorsehung, ist aber für heutige Leser unmittelbarer verständlich.
- source_word: ἐκκλησίαν
  choice: Gemeinde
  rationale: Bezeichnet die versammelte Glaubensgemeinschaft; „Gemeinde“ vermeidet, den frühen Text ausschließlich institutionell zu lesen.
- source_word: μεθίστησιν
  choice: versetzt
  rationale: Der Text spricht wörtlich von einem Verändern oder Versetzen; diese ungewöhnliche, kosmische Bildsprache wird nicht zu „beseitigt“ verengt.
- source_word: ὁμαλὰ γίνεται
  choice: alles wird eben
  rationale: 'Bewahrt das Wegbereitungsbild: Hindernisse werden eingeebnet bzw. gangbar gemacht.'
- source_word: τὰ νόμιμα
  choice: die Satzungen
  rationale: Gibt verbindliche göttliche Bestimmungen wieder, ohne sie mit dem gesamten „Gesetz“ gleichzusetzen.
theological_decisions:
- issue: Bedingung der verheißenen Gabe
  choice: „wenn sie die Satzungen Gottes halten“
  alternative: „sofern sie Gottes Gebote bewahren“
  rationale: Die mit ἐάν formulierte Bedingung bleibt ausdrücklich bestehen; ihre Beziehung zu Gnade, Erwählung und Gehorsam wird nicht systematisch aufgelöst.
- issue: Identität der ἐκκλησία
  choice: „seine heilige Gemeinde“
  alternative: „seine heilige Kirche“
  rationale: „Gemeinde“ lässt den gemeinschaftlichen Sinn des griechischen Wortes hervortreten und vermeidet eine spätere konfessionelle Institutionalisierung, ohne die ekklesiologische Aussage abzuschwächen.
- issue: Kosmisches Handeln Gottes
  choice: „er versetzt die Himmel … und alles wird eben“
  alternative: „er wird Himmel … beseitigen und alles ebnen“
  rationale: Das Präsens und die offene Bildsprache des Griechischen bleiben erhalten; der Text wird weder eindeutig endzeitlich-futurisch noch rein metaphorisch festgelegt.
- issue: τὴν ἐπαγγελίαν … ἀποδῷ
  choice: „damit er ihnen die Verheißung erfüllt“
  alternative: „damit er ihnen das Verheißene gibt“
  rationale: Im Deutschen kann eine Verheißung „erfüllt“ werden; damit bleibt der Sinn verständlich, obwohl ἀποδίδωμι wörtlich eher „geben/erstatten“ bedeutet.
translation_notes:
  register: Würdiger, moderner Standardstil mit weitgehend erhaltener griechischer Satzbewegung. Die wiederholte Einleitung „siehe“ und die kosmische Aufzählung bleiben als rhetorische Merkmale bestehen. Keine Fußnoten erforderlich.
