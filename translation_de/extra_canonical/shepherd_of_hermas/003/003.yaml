revisions:
- from: 'Nachdem sie diese Worte beendet hatte, sagte sie zu mir: »Willst du hören, wie ich vorlese?« Ich antwortete: »Ja, Herrin.« Sie sagte zu mir: »Sei ein aufmerksamer Zuhörer und höre von der Herrlichkeit Gottes.« Ich hörte gewaltige und wunderbare Dinge, an die ich mich nicht erinnern konnte; denn alle Worte waren ehrfurchtgebietend – Worte, die kein Mensch ertragen kann. An die letzten Worte jedoch erinnerte ich mich, denn sie waren heilsam und mild für uns:'
  to: 'Nachdem sie diese Worte beendet hatte, sagte sie zu mir: »Willst du hören, wie ich vorlese?« Ich sagte: »Ja, Herrin.« Sie sagte zu mir: »Werde ein Hörer und höre die Herrlichkeiten Gottes.« Ich hörte große und wunderbare Dinge, an die ich mich nicht erinnern konnte; denn alle Worte waren furchteinflößend – Worte, die ein Mensch nicht ertragen kann. Die letzten Worte aber erinnerte ich, denn sie waren für uns nützlich und mild:'
