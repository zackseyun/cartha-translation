base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: de
  text: 'Nachdem sie diese Worte beendet hatte, sagte sie zu mir: »Willst du hören, wie ich vorlese?« Ich sagte: »Ja, Herrin.« Sie sagte zu mir: »Werde ein Hörer und höre die Herrlichkeiten Gottes.« Ich hörte große und wunderbare Dinge, an die ich mich nicht erinnern konnte; denn alle Worte waren furchteinflößend – Worte, die ein Mensch nicht ertragen kann. Die letzten Worte aber erinnerte ich, denn sie waren für uns nützlich und mild:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τὸ παῦσαι αὐτῆς τὰ ῥήματα ταῦτα
  choice: Nachdem sie diese Worte beendet hatte
  rationale: Gibt die ungewöhnliche griechische Fügung natürlich wieder, ohne den Sinn auf bloßes Schweigen zu verengen.
- source_word: κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle direkte Anrede und die Rollenbezeichnung der weiblichen Gestalt.
- source_word: Γενοῦ ἀκροατής
  choice: Sei ein aufmerksamer Zuhörer
  rationale: Das bloße »Sei ein Hörer« wäre im Deutschen unnatürlich; »aufmerksam« bringt den auffordernden Sinn idiomatisch zum Ausdruck.
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: von der Herrlichkeit Gottes
  rationale: Der griechische Plural kann einzelne Offenbarungen oder Erscheinungsweisen göttlicher Herrlichkeit bezeichnen; der deutsche Kollektivsingular ist natürlich und lässt den Umfang offen.
- source_word: μεγάλως καὶ θαυμαστῶς
  choice: gewaltige und wunderbare Dinge
  rationale: Bezieht die adverbiale Formulierung sinngemäß auf das Gehörte, wie es der folgende Relativsatz nahelegt.
- source_word: ἔκφρικτα
  choice: ehrfurchtgebietend
  rationale: Bewahrt die Mischung aus Schrecken und überwältigender Heiligkeit, ohne die Worte einseitig als grausenerregend darzustellen.
- source_word: σύμφορα καὶ ἥμερα
  choice: heilsam und mild
  rationale: »Heilsam« erfasst das Förderliche/Nützliche; »mild« bewahrt den Kontrast zu den zuvor unerträglichen Worten.
theological_decisions:
- issue: Plural τὰς δόξας τοῦ Θεοῦ
  choice: von der Herrlichkeit Gottes
  alternative: die Herrlichkeiten Gottes
  rationale: Der deutsche Singular klingt idiomatischer und vermeidet eine mögliche Vorstellung mehrerer getrennter göttlicher Herrlichkeiten, ohne den griechischen Sinn sachlich einzuengen.
- issue: Charakter der Offenbarungsworte (ἔκφρικτα)
  choice: ehrfurchtgebietend
  alternative: schreckenerregend / furchtbar
  rationale: Die Übersetzung hält heilige Scheu und erschütternden Schrecken zusammen und löst die Spannung nicht einseitig auf.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit klarer direkter Rede. Der Tempuswechsel des griechischen Erzählens wird im Deutschen zugunsten eines flüssigen Präteritums vereinheitlicht. Keine Fußnoten erforderlich.
