review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Anrede κυρία sind zutreffend wiedergegeben. Einige Auslegungen schwächen jedoch den Wortlaut ab: τὰς δόξας steht im Plural und ist nicht bloß ein Hören „von“ Gottes Herrlichkeit; ἔκφρικτα bezeichnet ausdrücklich Erschreckendes/Furchteinflößendes; σύμφορα meint primär das Nützliche bzw. Förderliche.'
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch. „die Herrlichkeiten Gottes“ ist zwar gehoben, in diesem feierlichen Offenbarungskontext aber verständlich und näher am griechischen Plural. „Werde ein Hörer“ bewahrt die knappe, nachdrückliche Aufforderung und ist idiomatisch genug.
  terminology: „Herrin“ gibt κυρία als respektvolle Anrede einer weiblichen Gestalt angemessen wieder. Die Beibehaltung des Plurals „Herrlichkeiten“ vermeidet eine sachlich nicht notwendige Einebnung. „Furchteinflößend“ gibt ἔκφρικτα ohne dogmatische Deutung wieder.
  issues:
  - severity: medium
    issue: τὰς δόξας τοῦ Θεοῦ wird als „von der Herrlichkeit Gottes“ wiedergegeben.
    rationale: Das griechische direkte Objekt steht im Plural. Die Formulierung mit „von“ und Kollektivsingular verschiebt die Aussage von dem, was gehört wird, zu einer allgemeinen Aussage über Gottes Herrlichkeit.
  - severity: medium
    issue: ἔκφρικτα wird mit „ehrfurchtgebietend“ wiedergegeben.
    rationale: Das Wort bezeichnet etwas Erschreckendes oder Furchteinflößendes. „Ehrfurchtgebietend“ kann zwar einen religiösen Rahmen andeuten, lässt aber die ausdrücklich überwältigende Furcht zu stark zurücktreten.
  - severity: low
    issue: σύμφορα wird mit „heilsam“ wiedergegeben.
    rationale: „Heilsam“ kann im Deutschen eine therapeutische oder soteriologische Nuance nahelegen. „Nützlich“ gibt den allgemeinen Sinn von σύμφορα unmittelbarer wieder.
  - severity: low
    issue: „aufmerksamer“ ergänzt Γενοῦ ἀκροατής.
    rationale: Die Ergänzung ist plausibel, aber im Ausgangstext nicht ausgedrückt und kann ohne Verlust entfallen.
