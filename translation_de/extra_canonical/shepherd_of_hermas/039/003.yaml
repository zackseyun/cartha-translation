  to: „Warum“, fragte ich, „steigt das Gebet des Trauernden nicht zum Altar empor?“ – „Weil“, sagte er, „die Traurigkeit sich in seinem Herzen festgesetzt hat. Wenn nun die Traurigkeit mit dem Gebet vermischt ist, lässt sie das Gebet nicht rein zum Altar emporsteigen. Denn wie Essig und Wein, miteinander vermischt, nicht denselben Wohlgeschmack haben, so ist auch das Gebet nicht dasselbe, wenn die Traurigkeit mit dem Heiligen Geist vermischt ist.“[a]
