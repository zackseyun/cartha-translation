  naturalness: Der Dialog und die Satzführung sind modernes, würdiges Standarddeutsch. Die wörtliche Aussage des Schlusssatzes ist auch im Griechischen auffällig; eine knapp erläuterte, syntaktisch geglättete Wiedergabe im Haupttext erhält die Verständlichkeit, ohne die Unbestimmtheit dogmatisch oder psychologisch aufzulösen.
  terminology: „Traurigkeit“, „Gebet“, „Heiliger Geist“ und „Wohlgeschmack“ sind angemessen und konsistent. „Trauernder“ ist als Wiedergabe von λυπουμένου möglich. Die Formulierung zur Mischung mit dem Heiligen Geist muss beibehalten werden, darf aber nicht mit einer zusätzlichen Aussage über das Hervorbringen von Gebet erklärt werden.
