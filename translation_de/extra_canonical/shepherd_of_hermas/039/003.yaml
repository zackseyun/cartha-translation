  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: de
  text: „Warum“, fragte ich, „steigt das Gebet des Trauernden nicht zum Altar empor?“ – „Weil“, sagte er, „die Traurigkeit sich in seinem Herzen festgesetzt hat. Wenn nun die Traurigkeit mit dem Gebet vermischt ist, lässt sie das Gebet nicht rein zum Altar emporsteigen. Denn wie Essig und Wein, miteinander vermischt, nicht denselben Wohlgeschmack haben, so ist auch das Gebet nicht dasselbe, wenn die Traurigkeit mit dem Heiligen Geist vermischt ist.“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So hat auch die mit dem Heiligen Geist vermischte Traurigkeit nicht dasselbe Gebet.“ Der griechische Schlusssatz ist knapp und syntaktisch ungewöhnlich.'
    reason: Die Hauptfassung macht die ungewöhnliche Aussage im Deutschen lesbar, während die Fußnote die formale Zuordnung des griechischen Satzes und seine Mehrdeutigkeit dokumentiert.
lexical_decisions:
- source_word: λύπη / λυπουμένου
  choice: Traurigkeit / des Trauernden
  rationale: Bezeichnet hier einen inneren Zustand von Kummer oder Betrübnis; „Traurigkeit“ wahrt den wiederholten Leitbegriff und klingt im Deutschen natürlich.
- source_word: ἔντευξις
  choice: Gebet
  rationale: Das Wort kann Bitte, Fürsprache oder Gebet bezeichnen. Im Zusammenhang mit dem Emporsteigen zum Altar ist „Gebet“ die klare, nicht unnötig verengende Wiedergabe.
- source_word: ἐγκάθηται
  choice: sich … festgesetzt hat
  rationale: Gibt das Bild eines im Herzen sitzenden und dort verharrenden Zustands idiomatisch wieder.
- source_word: ἡδονή
  choice: Wohlgeschmack
  rationale: Im Vergleich von Essig und Wein meint das Wort den angenehmen Genuss beziehungsweise Geschmack; „Wohlgeschmack“ erhält das konkrete Bild.
theological_decisions:
- issue: Verhältnis von Traurigkeit und Heiligem Geist
  choice: Die ungewöhnliche Aussage, Traurigkeit werde mit dem Heiligen Geist „vermischt“, wird unverändert beibehalten.
  alternative: Die Formulierung als bloße Beeinträchtigung des Gebets durch Traurigkeit erklären.
  rationale: Der griechische Text formuliert bewusst eine spannungsvolle Mischung und erklärt sie an dieser Stelle nicht näher; eine dogmatische Glättung wäre nicht gerechtfertigt.
- issue: Schlusssatz τὴν αὐτὴν ἔντευξιν οὐκ ἔχει
  choice: „bringt … nicht mehr dasselbe Gebet hervor“ mit Fußnote zur wörtlichen Form
  alternative: „hat nicht dieselbe Kraft im Gebet“
  rationale: Die Alternative würde „Kraft“ aus dem vorangehenden Kontext eintragen, obwohl das Wort im Satz nicht steht. Die gewählte Fassung macht die elliptische Aussage verständlich und dokumentiert zugleich den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Dialogführung. Die wiederkehrenden Begriffe „Traurigkeit“ und „Gebet“ bleiben als Leitwörter erhalten; das Bild vom Altar und von der Vermischung wird nicht rationalisiert.
