  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: de
  text: Reinige dich also von dieser bösen Traurigkeit, dann wirst du für Gott leben. Und alle werden für Gott leben, die die Traurigkeit von sich abwerfen und sich mit lauter Fröhlichkeit bekleiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάρισον
  choice: Reinige
  rationale: Gibt den Imperativ und das Bild der Reinigung unmittelbar und natürlich wieder.
- source_word: λύπη
  choice: Traurigkeit
  rationale: Im Zusammenhang bezeichnet das Wort eine belastende innere Traurigkeit; die einheitliche Wiedergabe bewahrt den Gedankengang des Abschnitts.
- source_word: ζήσῃ τῷ θεῷ / ζήσονται τῷ θεῷ
  choice: wirst du für Gott leben / werden für Gott leben
  rationale: Der Dativ τῷ θεῷ wird bewusst als Ausrichtung des Lebens auf Gott wiedergegeben, ohne die knappe theologische Aussage weiter auszudeuten.
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: von sich abwerfen
  rationale: Bewahrt das kräftige Bild des Ablegens beziehungsweise Wegwerfens.
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: sich mit lauter Fröhlichkeit bekleiden
  rationale: Erhält die Bekleidungsmetapher von ἐνδύομαι; „lauter“ gibt πᾶσαν idiomatisch als umfassende, ungeteilte Fröhlichkeit wieder.
theological_decisions:
- issue: Bedeutung des Dativs in ζῆν τῷ θεῷ
  choice: für Gott leben
  alternative: bei Gott leben / vor Gott leben
  rationale: „Für Gott leben“ bewahrt die naheliegende Bedeutung von Hingabe und Ausrichtung, ohne eine Aussage über Aufenthaltsort oder Endzeit ausdrücklich einzutragen.
- issue: Reichweite von πάντες ... ὅσοι ἄν
  choice: alle ... die
  alternative: jeder, der
  rationale: Die Pluralstruktur und die umfassende, zugleich durch den Relativsatz bestimmte Aussage des Griechischen bleiben erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die parallelen Bilder von Abwerfen und Bekleiden sowie die Wiederholung von „für Gott leben“ werden beibehalten.
