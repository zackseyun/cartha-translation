base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: de
  text: Der betrübte Mensch aber handelt immer böse. Erstens handelt er böse, weil er den Heiligen Geist betrübt, der dem Menschen als ein heiterer Geist gegeben wurde. Zweitens begeht er Gesetzlosigkeit, indem er den Heiligen Geist betrübt und weder zum Herrn betet noch ihm bekennt.[a] Denn das Gebet eines betrübten Menschen hat niemals die Kraft, zum Altar Gottes emporzusteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb kann auch bedeuten: „ihm dankt“ oder „ihn preist“.'
    reason: ἐξομολογούμενος kann im frühchristlichen und biblischen Griechisch sowohl „bekennen“ als auch „danken“ oder „preisen“ bedeuten.
lexical_decisions:
- source_word: λυπηρός / λύπη
  choice: betrübt / Betrübnis
  rationale: Das Wortfeld bezeichnet hier nicht bloß momentane Traurigkeit, sondern einen inneren Zustand, der Gebet und Handeln beeinträchtigt. „Betrübt“ wahrt zugleich die Wortverbindung mit „den Heiligen Geist betrüben“.
- source_word: πονηρεύεται
  choice: handelt böse
  rationale: Die mediale Verbform bezeichnet hier böses beziehungsweise verwerfliches Handeln; die aktive deutsche Wendung ist klar und natürlich.
- source_word: ἱλαρόν
  choice: als heiter
  rationale: Die prädikative Beziehung zum gegebenen Geist bleibt erhalten, ohne sie erklärend auf den Menschen oder auf eine bloße Gabe der Freude umzudeuten.
- source_word: ἀνομίαν ἐργάζεται
  choice: begeht Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ gibt ἀνομία formal und theologisch offen wieder, statt den Ausdruck auf eine bestimmte einzelne Sünde zu verengen.
- source_word: ἐντυγχάνων / ἔντευξις
  choice: betet / Gebet
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Wort den an Gott gerichteten Gebetsvollzug. „Gebet“ ist für heutige Leser natürlicher als „Fürsprache“ oder „Anrufung“.
- source_word: ἐξομολογούμενος
  choice: ein Bekenntnis ablegt
  rationale: Die Wendung bewahrt die mögliche Bedeutung von Bekennen, ohne durch einen ausdrücklich ergänzten Gegenstand wie „Sünden“ die Aussage stärker festzulegen als der griechische Text.
theological_decisions:
- issue: Der Heilige Geist wird als ἱλαρόν gegeben bezeichnet.
  choice: „der dem Menschen als heiter gegeben wurde“
  alternative: „der dem Menschen Freude schenkt“
  rationale: Der griechische Satz bezeichnet den Geist selbst als ἱλαρόν. Die Übersetzung bewahrt diese ungewöhnliche und theologisch spannungsreiche Formulierung, statt sie in eine Wirkung des Geistes umzudeuten.
- issue: Die Aussage über die Wirkungslosigkeit des Gebets eines betrübten Menschen ist uneingeschränkt formuliert.
  choice: „hat niemals die Kraft, zum Altar Gottes emporzusteigen“
  alternative: „kann nur schwer zu Gott gelangen“
  rationale: Die absolute Aussage πάντοτε … οὐκ ἔχει δύναμιν wird nicht pastoral abgeschwächt oder systematisch harmonisiert.
- issue: ἐξομολογεῖσθαι kann Bekennen, Danken oder Preisen bezeichnen.
  choice: „ihm ein Bekenntnis ablegt“ mit Fußnote
  alternative: „ihm dankt“ oder „ihn preist“
  rationale: Der Haupttext folgt der naheliegenden Bedeutung „bekennen“, während die Fußnote die genuine lexikalische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „handelt böse“ und „betrübt“ bildet die argumentierende Struktur und die Wortverbindungen des griechischen Textes bewusst nach; ungewöhnliche theologische Formulierungen werden nicht geglättet.
