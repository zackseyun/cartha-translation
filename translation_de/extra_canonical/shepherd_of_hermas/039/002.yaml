- from: Der betrübte Mensch aber handelt immer böse. Erstens handelt er böse, weil er den Heiligen Geist betrübt, der dem Menschen als heiter gegeben wurde. Zweitens begeht er Gesetzlosigkeit, indem er den Heiligen Geist betrübt und weder zum Herrn betet noch ihm ein Bekenntnis ablegt.[a] Denn das Gebet eines betrübten Menschen hat niemals die Kraft, zum Altar Gottes emporzusteigen.
  to: Der betrübte Mensch aber handelt immer böse. Erstens handelt er böse, weil er den Heiligen Geist betrübt, der dem Menschen als ein heiterer Geist gegeben wurde. Zweitens begeht er Gesetzlosigkeit, indem er den Heiligen Geist betrübt und weder zum Herrn betet noch ihm bekennt.[a] Denn das Gebet eines betrübten Menschen hat niemals die Kraft, zum Altar Gottes emporzusteigen.
