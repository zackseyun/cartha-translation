base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: de
  text: Zieh also die Fröhlichkeit an, die bei Gott stets Gunst findet und ihm wohlgefällig ist, und erfreue dich an ihr. Denn jeder fröhliche Mensch tut Gutes, sinnt auf Gutes und verachtet die Traurigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔνδυσαι
  choice: Zieh … an
  rationale: Bewahrt das konkrete Bild des Ankleidens und den imperativischen Charakter.
- source_word: ἱλαρότητα / ἱλαρός
  choice: Fröhlichkeit / fröhlich
  rationale: Gibt die freudige, heitere Grundhaltung natürlich wieder und hält die Wortverbindung im Deutschen sichtbar.
- source_word: ἔχουσαν χάριν παρὰ τῷ θεῷ
  choice: die bei Gott stets Gnade findet
  rationale: Natürliches Deutsch, das die göttliche Gunst bzw. Anerkennung ausdrückt, ohne sie als menschliche Eigenschaft der Fröhlichkeit misszuverstehen.
- source_word: εὐπρόσδεκτον οὖσαν αὐτῷ
  choice: ihm wohlgefällig ist
  rationale: Entspricht der Bedeutung ‚wohl angenommen, annehmbar‘ in einem würdigen religiösen Register.
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: erfreue dich an ihr
  rationale: Vermittelt das genussvolle Verweilen an der Fröhlichkeit idiomatisch, ohne übermäßig sinnliche Konnotation.
- source_word: ἀγαθὰ ἐργάζεται
  choice: tut Gutes
  rationale: Prägnante und natürliche Wiedergabe des praktischen guten Handelns.
- source_word: ἀγαθὰ φρονεῖ
  choice: denkt an Gutes
  rationale: Bewahrt den Bezug auf gute Gedanken bzw. eine auf das Gute gerichtete Gesinnung, ohne die Wendung unnötig zu verengen.
- source_word: καταφρονεῖ τῆς λύπης
  choice: verachtet die Traurigkeit
  rationale: Gibt das starke Verb καταφρονεῖ formal wieder und bewahrt die Spannung des Ausgangstextes.
theological_decisions:
- issue: χάρις als göttliche Gunst oder als anmutige Eigenschaft
  choice: bei Gott Gnade findet
  alternative: bei Gott Ansehen genießt
  rationale: Der Ausdruck παρὰ τῷ θεῷ legt Gottes Gunst bzw. Anerkennung nahe. Die gewählte Formulierung wahrt den theologischen Begriff, behauptet aber keine spezielle Gnadenlehre.
- issue: Umgang mit der starken Abwertung der λύπη
  choice: verachtet die Traurigkeit
  alternative: lässt sich von der Traurigkeit nicht bestimmen
  rationale: Die Alternative wäre pastoraler, würde jedoch das starke καταφρονεῖ interpretierend abschwächen. Die Übersetzung bewahrt die genuine Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem Kleidungsbild. Der Satz bleibt allgemeinverständlich; die Wiederholung von ‚Fröhlichkeit/fröhlich‘ bildet die griechische Wortverwandtschaft ab.
