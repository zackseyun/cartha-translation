  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/003.yaml
  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: de
  text: „Ich habe“, sage ich, „Herr, von einigen Lehrern gehört, dass es keine andere Umkehr gibt als die, die wir erfuhren, als wir ins Wasser hinabstiegen und Vergebung unserer früheren Sünden empfingen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Abkehr von der Sünde und Hinwendung zu einem neuen Leben; „Umkehr“ ist im heutigen Deutsch verständlich und legt den Begriff nicht vorschnell auf eine bestimmte kirchliche Bußpraxis fest.
- source_word: κύριε
  choice: Herr
  rationale: Gibt die respektvolle Anrede an den Gesprächspartner wieder und wahrt die im Kontext mögliche Mehrdeutigkeit, ohne die Anrede mit „mein Herr“ oder „Meister“ stärker auszudeuten.
- source_word: εἰς ὕδωρ κατέβημεν
  choice: ins Wasser hinabstiegen
  rationale: Bewahrt das konkrete Bild des Hinabsteigens ins Wasser und damit den deutlichen, aber nicht weiter erklärten Bezug zur Taufe.
- source_word: ἄφεσιν ἁμαρτιῶν ἡμῶν τῶν προτέρων
  choice: Vergebung unserer früheren Sünden
  rationale: Gibt sowohl ἄφεσις als Vergebung als auch die zeitliche Bestimmung τῶν προτέρων knapp und vollständig wieder.
theological_decisions:
- issue: Verhältnis von Umkehr, Taufe und Sündenvergebung
  choice: 'Die Aussage bleibt in ihrer ausschließlichen Form stehen: Es gebe keine andere Umkehr als jene beim Hinabsteigen ins Wasser und beim Empfang der Vergebung.'
  alternative: Den Satz erläuternd als Lehre von einer nur einmal möglichen kirchlichen Buße oder ausdrücklich als Tauftheologie formulieren.
  rationale: Der griechische Text berichtet zunächst die Aussage bestimmter Lehrer. Eine dogmatische Erklärung oder Einschränkung würde dem folgenden Dialog vorgreifen und die vorhandene Spannung auflösen.
translation_notes:
  register: Natürliche, würdige Standardsprache mit beibehaltenem Dialograhmen. Die etwas markierte Verbindung „als jene, als wir …“ spiegelt die demonstrativ-zeitliche Konstruktion εἰ μὴ ἐκείνη, ὅτε und lässt den gedanklichen Bezug unverengt stehen.
