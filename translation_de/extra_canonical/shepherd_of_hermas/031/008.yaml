base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/008.yaml
  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: de
  text: „Er sündigt nicht“, sagt er. „Wenn aber jemand für sich allein bleibt, erwirbt er sich größere Ehre und große Herrlichkeit beim Herrn. Doch auch wenn er heiratet, sündigt er nicht. Bewahre daher die Reinheit und die Ehrbarkeit, dann wirst du für Gott leben. Alles, was ich dir sage und noch sagen werde, sollst du von nun an bewahren – von dem Tag an, an dem du mir anvertraut wurdest; und ich werde in deinem Haus wohnen. Deine früheren Verfehlungen werden vergeben werden, wenn du meine Gebote hältst. Ebenso werden alle Vergebung finden, wenn sie diese meine Gebote halten und in dieser Reinheit ihren Weg gehen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: für sich allein bleibt
  rationale: Gibt im Zusammenhang mit der Wiederheirat den freiwilligen Verzicht auf eine neue Ehe natürlich wieder, ohne eine weitergehende asketische Deutung einzutragen.
- source_word: τιμὴν καὶ μεγάλην δόξαν
  choice: größere Ehre und große Herrlichkeit
  rationale: Bewahrt die Steigerung und unterscheidet die beiden griechischen Begriffe.
- source_word: ἁγνείαν καὶ σεμνότητα
  choice: Reinheit und Ehrbarkeit
  rationale: Gibt sowohl sittliche beziehungsweise sexuelle Reinheit als auch die würdige, achtbare Lebensführung wieder.
- source_word: ζήσῃ τῷ Θεῷ
  choice: für Gott leben
  rationale: Natürliches modernes Deutsch für den griechischen Dativ mit der Bedeutung eines auf Gott ausgerichteten Lebens.
- source_word: παραπτώμασιν
  choice: Verfehlungen
  rationale: Entspricht dem Sinn von Fehltritten oder Übertretungen, ohne unnötig einen engeren dogmatischen Fachbegriff zu wählen.
- source_word: πορευθῶσιν ἐν τῇ ἁγνότητι ταύτῃ
  choice: in dieser Reinheit ihren Weg gehen
  rationale: Erhält die Wegmetapher von πορεύομαι und klingt zugleich in modernem Deutsch verständlich.
theological_decisions:
- issue: Bewertung der Wiederheirat nach dem Tod des Ehepartners
  choice: „Auch wenn er heiratet, sündigt er nicht“, bei zugleich höherer Würdigung des Alleinbleibens
  alternative: Das Alleinbleiben als verpflichtend oder die Wiederheirat als minder schwere Sünde darstellen
  rationale: Der griechische Text verneint ausdrücklich, dass die Wiederheirat Sünde sei, und spricht dem Alleinbleiben dennoch größere Ehre zu; diese Spannung wird nicht eingeebnet.
- issue: Bedingung der Vergebung
  choice: Die Wenn-Sätze des Textes bleiben ausdrücklich konditional formuliert
  alternative: Die Aussage als bedingungslose Vergebungszusage oder als systematische Lehre von verdienstlicher Vergebung umformulieren
  rationale: Der Text verbindet hier Vergebung sprachlich mit dem Halten der Gebote und dem Wandel in Reinheit; eine dogmatische Auflösung dieses Zusammenhangs würde über die Quelle hinausgehen.
- issue: Bezug von „alle“ in der abschließenden Zusage
  choice: „alle“ bleibt ohne zusätzliche Eingrenzung stehen
  alternative: „alle Gläubigen“, „alle Getauften“ oder eine andere näher bestimmte Gruppe einsetzen
  rationale: Das griechische πᾶσιν ist an dieser Stelle nicht näher qualifiziert; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer direkter Rede. Die Wiederholungen des griechischen Textes werden weitgehend bewahrt, soweit sie im Deutschen natürlich bleiben. Keine konfessionellen Fachformulierungen wurden ergänzt.
