lexical_decisions:
- source_word: Καλῶς ἤκουσας
  choice: Du hast richtig gehört
  rationale: Gibt die bestätigende Bedeutung idiomatisch und in natürlichem modernem Deutsch wieder.
- source_word: οὕτω γὰρ ἔχει
  choice: denn so verhält es sich
  rationale: Bewahrt die sachliche Bekräftigung des griechischen Ausdrucks in würdigem, verständlichem Deutsch.
- source_word: τὸν εἰληφότα ἄφεσιν
