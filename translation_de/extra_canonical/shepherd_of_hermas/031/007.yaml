base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: de
  text: „Wenn eine Frau“, sagte ich, „Herr, oder auch ein Mann stirbt und der jeweils andere heiratet – sündigt dann derjenige, der heiratet?“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοιμηθῇ
  choice: stirbt
  rationale: Wörtlich „einschläft/entschläft“; hier ist das Sterben gemeint. „Stirbt“ gibt den Sinn in natürlichem modernem Deutsch eindeutig wieder.
- source_word: τις ἐξ αὐτῶν
  choice: der jeweils andere
  rationale: Gemeint ist der überlebende Ehepartner. Diese Formulierung macht den Bezug im Deutschen natürlich verständlich, ohne eine Geschlechtszuordnung hinzuzufügen.
- source_word: μήτι ἁμαρτάνει ὁ γαμῶν
  choice: sündigt dann derjenige, der heiratet?
  rationale: Die Fragepartikel μήτι legt eine verneinende Antwort nahe; die deutsche Frage bleibt dennoch offen formuliert und nimmt die folgende Antwort nicht vorweg.
theological_decisions:
- issue: Wiederheirat nach dem Tod eines Ehepartners
  choice: Die Frage wird wertungsfrei wiedergegeben und nicht durch „wieder heiratet“ oder eine vorweggenommene Bewertung ausgelegt.
  alternative: „begeht derjenige, der wieder heiratet, eine Sünde?“
  rationale: Der griechische Text verwendet das gewöhnliche Verb für heiraten und stellt die sittliche Bewertung ausdrücklich als Frage; diese Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdige Dialogsprache. „Herr“ gibt die respektvolle Anrede κύριε wieder; die Satzführung wurde für natürliches gesprochenes Deutsch leicht geglättet.
