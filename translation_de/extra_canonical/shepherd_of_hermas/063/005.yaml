translation:
  language: de
  text: 5. Dann gaben diejenigen ihre Stäbe ab, die trockene, aber nicht zerschnittene Stäbe hatten. Einige von ihnen gaben ihre Stäbe grün ab, andere jedoch trocken und zerschnitten, wie von einem Holzwurm zerfressen. Daraufhin befahl er denen, die grüne Stäbe abgegeben hatten, sich gesondert hinzustellen; denen aber, die trockene …
