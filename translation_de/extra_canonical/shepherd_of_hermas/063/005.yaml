lexical_decisions:
- source_word: ῥάβδοι
  choice: Stäbe
  rationale: Im Bildgeschehen sind abgetrennte bzw. gepflanzte Holzstäbe gemeint; „Stäbe“ ist natürlich und wahrt die wiederkehrende Bildsprache.
- source_word: κεκομμένας
  choice: angeschnittene
  rationale: Das Partizip bezeichnet hier sichtbar beschädigte bzw. eingeschnittene Stäbe. „Angeschnitten“ erhält den Kontrast zu den nicht angeschnittenen Stäben, ohne eine nicht ausdrücklich genannte Ursache festzulegen.
- source_word: χλωράς
  choice: grün
  rationale: Bezeichnet frisches, lebendes Holz und steht im direkten Gegensatz zu ξηράς („trocken“).
- source_word: ὡς ὑπὸ σητός
  choice: wie von einem Holzwurm zerfressen
  rationale: σητός bezeichnet holzzerstörendes Ungeziefer bzw. Wurmfraß; die Vergleichspartikel ὡς wird mit „wie“ bewahrt.
- source_word: χωρὶς σταθῆναι
  choice: sich gesondert hinzustellen
  rationale: Gibt sowohl die räumliche Trennung als auch das angeordnete Stehen idiomatisch wieder.
