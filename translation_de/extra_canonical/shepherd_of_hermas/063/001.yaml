  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: de
  text: 'Und nach wenigen Tagen kamen wir an den Ort. Der Hirte setzte sich auf den Platz des Engels, und ich stand bei ihm. Er sagte zu mir: »Gürte dich mit einem Gewand aus ungebleichtem Leinen und diene mir.« Da gürtete ich mich mit einem reinen Gewand aus ungebleichtem Leinen, das aus Sacktuch gefertigt war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεστάθην αὐτῷ
  choice: ich trat zu ihm
  rationale: Das Verb bezeichnet hier das Herantreten beziehungsweise Bereitstehen bei jemandem; die Formulierung gibt beides natürlich wieder, ohne eine bloß räumliche Position überzubetonen.
- source_word: Περίζωσαι / περιεζωσάμην
  choice: Gürte dich / da gürtete ich mich
  rationale: Die wiederholte Bildsprache des Umgürtens wird formal bewahrt.
- source_word: ὠμόλινον
  choice: Gewand aus ungebleichtem Leinen
  rationale: Das seltene Wort bezeichnet wahrscheinlich rohes beziehungsweise unbearbeitetes Leinen. »Ungebleichtes Leinen« ist im Deutschen verständlich und wahrt den Hinweis auf den unbehandelten Stoff.
- source_word: διακόνει μοι
  choice: diene mir
  rationale: Gibt die persönliche Dienstleistung ohne unnötige kirchliche Spezialisierung wieder.
- source_word: ἐκ σάκκου γεγονὸς
  choice: das aus Sacktuch gefertigt war
  rationale: Bewahrt die auffällige Materialangabe des griechischen Textes, auch wenn ihr Verhältnis zu ὠμόλινον ungewöhnlich bleibt.
- source_word: καθαρόν
  choice: rein
  rationale: Die mögliche Bedeutung »sauber« oder »rein« bleibt in der knappen deutschen Entsprechung offen.
theological_decisions:
- issue: Bedeutung des Dienstens gegenüber dem Hirten
  choice: »diene mir« ohne amtstheologische Präzisierung
  alternative: »verrichte den Dienst für mich« oder »bediene mich«
  rationale: Der Kontext beschreibt eine konkrete Hilfstätigkeit; der Text legt hier kein bestimmtes kirchliches Amt fest.
- issue: Symbolische Bedeutung des Gewandes
  choice: Die Materialbeschreibung wird übersetzt, aber nicht ausgelegt.
  alternative: Eine Deutung als Buß-, Reinheits- oder Dienstgewand in den Haupttext aufzunehmen
  rationale: Die symbolische Spannung zwischen Sacktuch, Leinen und Reinheit soll bestehen bleiben und nicht durch konfessionelle oder spekulative Auslegung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Wiederholung von »gürten«. Die ungewöhnliche Stoffbeschreibung wird nicht geglättet, da sie im Griechischen selbst auffällig ist.
