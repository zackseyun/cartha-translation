translation:
  language: de
  text: 4. Zuerst gaben diejenigen, die trockene und abgeschnittene Stäbe hatten, ihre Stäbe ab; sie erwiesen sich ebenfalls als trocken und abgeschnitten. Er befahl ihnen, sich gesondert hinzustellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: Stäbe
  rationale: Im Bildgeschehen bezeichnet das Wort die zuvor ausgeteilten und eingepflanzten Stäbe; „Stäbe“ ist im Deutschen klar und wahrt die Verbindung zum Kontext.
- source_word: κεκομμένας
  choice: eingeschnitten
  rationale: Das Partizip bezeichnet hier beschädigte beziehungsweise angeschnittene Stäbe. „Eingeschnitten“ bewahrt den Unterschied zu einem vollständig abgetrennten oder bloß gekürzten Gegenstand.
- source_word: ἐπέδωκαν
  choice: gaben … ab
  rationale: Gemeint ist die Rückgabe beziehungsweise Vorlage der zuvor empfangenen Stäbe; „abgeben“ ist in diesem Prüfungszusammenhang natürlich.
- source_word: χωρὶς σταθῆναι
  choice: sich gesondert hinzustellen
  rationale: Gibt sowohl die räumliche Absonderung als auch den Befehl zum Stehen wieder.
theological_decisions: []
translation_notes:
  register: Schlichtes, würdevolles Erzählregister in modernem Standarddeutsch. Die Wiederholung von „trocken und eingeschnitten“ bleibt als bedeutungstragende Entsprechung des griechischen Wortlauts erhalten.
