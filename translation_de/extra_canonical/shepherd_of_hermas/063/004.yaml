revisions:
- from: 4. Zuerst gaben diejenigen ihre Stäbe ab, die sie trocken und eingeschnitten erhalten hatten. Man stellte fest, dass sie noch ebenso trocken und eingeschnitten waren; da befahl er ihnen, sich gesondert hinzustellen.
  to: 4. Zuerst gaben diejenigen, die trockene und abgeschnittene Stäbe hatten, ihre Stäbe ab; sie erwiesen sich ebenfalls als trocken und abgeschnitten. Er befahl ihnen, sich gesondert hinzustellen.
  rationale: Die Revision ersetzt die zu enge Wiedergabe „eingeschnitten“ durch „abgeschnitten“ und gibt das einfache Besitzverhältnis von ἐσχηκότες ohne zusätzliche zeitliche Aussage wieder. Die elliptische Wiederaufnahme der Stäbe im zweiten Teilsatz wird im Deutschen durch „sie“ verständlich beibehalten.
