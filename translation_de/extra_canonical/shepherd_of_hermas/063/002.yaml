  to: '2 Als er sah, dass ich gegürtet und bereit war, ihm zu dienen, sagte er: »Rufe die Männer, deren Ruten eingepflanzt sind, nach der Ordnung, in der jeder seine Ruten abgegeben hatte.« Da begab ich mich aufs Feld, rief sie alle, und alle stellten sich in ihren Gruppen auf.'
