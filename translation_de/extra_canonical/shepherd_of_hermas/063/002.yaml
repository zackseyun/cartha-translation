review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Satzbau, das Bild des Gegürtetseins, den Dienstauftrag und das Feld zutreffend wieder. Bei τάγμα/τάγματα ist jedoch die gruppen- bzw. formationsbezogene Bedeutung besser zu wahren als durch die missverständliche Singularform „jeweiligen Reihe“. Auch die griechischen Pluralformen bei ῥάβδοι sollten in der Anweisung beibehalten werden.
  naturalness: Die Sprache ist insgesamt modern und flüssig. „Begab ich mich aufs Feld“ und „stellten sich … in ihren Gruppen auf“ sind idiomatisch und bilden den erzählerischen Ablauf klar ab.
  terminology: „gegürtet“, „dienen“, „Ruten“ und „Feld“ sind angemessen. „Ruten“ wahrt das konkrete Bild der eingepflanzten ῥάβδοι. „nach der Ordnung“ gibt κατὰ τὸ τάγμα zurück, während „in ihren Gruppen“ κατὰ τὰ τάγματα ohne unnötige militärische Konnotation verständlich wiedergibt.
  issues:
  - severity: medium
    issue: „in ihrer jeweiligen Reihe“ für κατὰ τὰ τάγματα
    rationale: Der griechische Plural bezeichnet die geordneten Gruppen/Abteilungen der Männer. Die deutsche Singularform kann nahelegen, jeder einzelne habe eine eigene Reihe; „in ihren Gruppen“ bewahrt die kollektive Einteilung.
  - severity: low
    issue: Singular „seine Rute“ in der direkten Rede
    rationale: Das Griechische hat ῥάβδους im Plural. „seine Ruten“ erhält die Form des Ausgangstextes und stimmt mit „deren Ruten“ im vorangehenden Relativsatz überein.
