  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: de
  text: '2 Als er sah, dass ich gegürtet und bereit war, ihm zu dienen, sagte er: »Rufe die Männer, deren Ruten eingepflanzt sind, nach der Ordnung, in der jeder seine Ruten abgegeben hatte.« Da begab ich mich aufs Feld, rief sie alle, und alle stellten sich in ihren Gruppen auf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεζωσμένον
  choice: gegürtet
  rationale: Bewahrt das konkrete Bild des umgebundenen Dienstgewands und knüpft unmittelbar an den vorausgehenden Satz an.
- source_word: διακονεῖν
  choice: dienen
  rationale: Gibt den allgemeinen Dienstbegriff natürlich wieder, ohne unnötig ein kirchliches Amt anzudeuten.
- source_word: ῥάβδοι
  choice: Ruten
  rationale: Passt zu den eingepflanzten, später wieder herausgezogenen Zweigen beziehungsweise Stäben; »Ruten« bewahrt das Pflanzenbild besser als »Stäbe«.
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: in derselben Reihenfolge / in ihrer jeweiligen Reihe
  rationale: τάγμα bezeichnet hier die geordnete Einteilung entsprechend der Reihenfolge der Abgabe; die differenzierte Wiedergabe ergibt im Deutschen einen klaren, natürlichen Ablauf.
- source_word: πεδίον
  choice: Feld
  rationale: Direkte und kontextgerechte Entsprechung für den offenen Ort, an dem die Ruten eingepflanzt wurden.
