base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: de
  text: „Der Turm, den du siehst, wie er gebaut wird, bin ich, die Kirche, die dir jetzt und schon früher erschienen ist. Was immer du über den Turm wissen möchtest, werde ich dir offenbaren, damit du dich mit den Heiligen freust.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πύργος ὃν βλέπεις οἰκοδομούμενον
  choice: Der Turm, den du im Bau siehst
  rationale: Gibt das durative Passivpartizip οἰκοδομούμενον natürlich wieder und bewahrt den Gedanken eines noch laufenden Bauvorgangs.
- source_word: ἡ Ἐκκλησία
  choice: die Kirche
  rationale: Im Kontext bezeichnet die personifiziert sprechende Gestalt die gemeinschaftliche Kirche; die Großschreibung im Griechischen wird nicht als eigener Name überinterpretiert.
- source_word: ἡ ὀφθεῖσά σοι
  choice: die dir … erschienen ist
  rationale: Das Passiv von ὁράω bezeichnet hier ihr Sichtbarwerden beziehungsweise Erscheinen gegenüber Hermas.
- source_word: ὃ ἂν … θελήσῃς ἐπερωτᾷν
  choice: Was immer du … fragen möchtest
  rationale: Bewahrt die offene, indefinite Aussage der Konstruktion mit ἄν und Konjunktiv in idiomatischem Deutsch.
- source_word: ἀποκαλύψω
  choice: werde ich … offenbaren
  rationale: Hält den Offenbarungswortschatz des Abschnitts fest und gibt das Futur ausdrücklich wieder.
- source_word: μετὰ τῶν ἁγίων
  choice: mit den Heiligen
  rationale: Gibt den substantivierten Plural wörtlich wieder, ohne näher festzulegen, welche Gruppe von Heiligen gemeint ist.
theological_decisions:
- issue: Identifikation des Turms mit der Ἐκκλησία
  choice: „bin ich, die Kirche“
  alternative: „stellt mich dar, nämlich die Gemeinde“
  rationale: Der griechische Text formuliert eine direkte Identifikation mit ἐγώ εἰμι; diese theologische Bildaussage wird nicht zu einer bloßen Darstellungsaussage abgeschwächt.
- issue: Bedeutung von Ἐκκλησία
  choice: „Kirche“
  alternative: „Gemeinde“
  rationale: Die erscheinende, universale und personifizierte Gestalt geht hier über eine einzelne Ortsgemeinde hinaus; „Kirche“ trägt diesen Sinn im modernen Standarddeutsch am klarsten.
- issue: Identität der ἅγιοι
  choice: nicht näher bestimmt
  alternative: ausdrücklich „Glaubende“, „Erlöste“ oder „Engel“
  rationale: Der Ausgangstext lässt die Referenz offen; daher wird die mögliche heilsgeschichtliche oder gemeinschaftliche Zuordnung nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildsprache des griechischen Textes. Die direkte Rede und die Personifikation der Kirche bleiben erhalten; zugleich wird eine schwerfällige Nachbildung der griechischen Wortstellung vermieden.
