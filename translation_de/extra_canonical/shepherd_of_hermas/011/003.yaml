  to: „Der Turm, den du siehst, wie er gebaut wird, bin ich, die Kirche, die dir jetzt und schon früher erschienen ist. Was immer du über den Turm wissen möchtest, werde ich dir offenbaren, damit du dich mit den Heiligen freust.“
  rationale: Die Revision glättet zwei stilistische Stellen und bildet zugleich den andauernden Bauvorgang sowie die auf den Turm bezogene Frageeinladung idiomatischer ab. Aussagegehalt, Personifikation, eschatologisch bzw. gemeinschaftlich offene Bezeichnung „die Heiligen“ und Offenbarungsregister bleiben unverändert.
