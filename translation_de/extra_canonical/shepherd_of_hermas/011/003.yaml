review_pass:
  verdict: revise
  source_fidelity: Die direkte Gleichsetzung des im Bau befindlichen Turms mit der personifiziert redenden Kirche (ἐγώ εἰμι ἡ Ἐκκλησία), das zweimalige Erscheinen gegenüber Hermas, die offene Einladung zu Fragen, das Futur von ἀποκαλύψω und „mit den Heiligen“ sind sachgerecht wiedergegeben. „Im Bau siehst“ gibt den Vorgang grundsätzlich wieder, ist jedoch weniger unmittelbar als das griechische Partizip „gebaut werdend“.
  naturalness: Der Entwurf ist insgesamt klar und würdig. „Den du im Bau siehst“ wirkt im modernen Standarddeutsch leicht verkürzt bzw. fachsprachlich; „den du siehst, wie er gebaut wird“ ist natürlicher und macht den fortdauernden Bauvorgang eindeutig. Die Frageformulierung lässt sich idiomatischer an den Bezug „über den Turm“ anschließen.
  terminology: „Kirche“ ist für Ἐκκλησία im personifizierten, überörtlichen Bildzusammenhang vertretbar. „Offenbaren“ wahrt den Wortschatz von ἀποκαλύπτω. „Die Heiligen“ lässt ἅγιοι angemessen offen und setzt keine konfessionelle Deutung voraus.
  issues:
  - severity: low
    issue: „den du im Bau siehst“
    rationale: Die Formulierung ist verständlich, klingt aber etwas elliptisch. Das durative Passivpartizip οἰκοδομούμενον wird natürlicher und genauer mit „den du siehst, wie er gebaut wird“ wiedergegeben.
  - severity: low
    issue: „Was immer du also über den Turm fragen möchtest“
    rationale: Im Deutschen ist „über den Turm fragen“ weniger idiomatisch. „Was immer du über den Turm wissen möchtest“ gibt die hier gemeinte Erkundigung (ἐπερωτᾷν περὶ τοῦ πύργου) natürlich wieder, ohne den Umfang der Zusage einzuengen.
  revised_text: „Der Turm, den du siehst, wie er gebaut wird, bin ich, die Kirche, die dir jetzt und schon früher erschienen ist. Was immer du über den Turm wissen möchtest, werde ich dir offenbaren, damit du dich mit den Heiligen freust.“
