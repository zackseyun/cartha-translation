  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/001.yaml
  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: de
  text: 'Nachdem sie mir dies gezeigt hatte, wollte sie davongehen. Ich sagte zu ihr: „Herrin, was nützt es mir, dies gesehen zu haben, wenn ich nicht weiß, was es zu bedeuten hat?“ Sie antwortete mir: „Du bist ein schlauer Mensch und willst wissen, was es mit dem Turm auf sich hat.“ Ich sagte: „Ja, Herrin, damit ich den Brüdern davon berichte und damit sie froher werden und, wenn sie dies hören, den Herrn in großer Herrlichkeit erkennen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Worte ἱλαρώτεροι γένωνται, καὶ ταῦτα („froher werden und dies“) stehen in der Ausgangsausgabe in eckigen Klammern und sind textkritisch unsicher.
    reason: Die Ausgangsausgabe kennzeichnet diese Wortfolge durch eckige Klammern als unsicher überliefert.
lexical_decisions:
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle Anrede und entspricht der als Frau auftretenden Gestalt, ohne den Ausdruck zu modernisieren oder abzuschwächen.
- source_word: τί μοι ὄφελος
  choice: was nützt es mir
  rationale: Gibt die idiomatische Frage nach dem persönlichen Nutzen natürlich und unmittelbar wieder.
- source_word: τί ἐστιν τὰ πράγματα
  choice: was es zu bedeuten hat
  rationale: Das wörtliche „was die Dinge sind“ wäre im Deutschen unnatürlich; gemeint ist die Bedeutung des Geschauten.
- source_word: Πανοῦργος
  choice: schlau
  rationale: Das Wort kann je nach Zusammenhang „gewitzt“, „schlau“ oder „verschlagen“ bedeuten. Hier ist der Ton leicht tadelnd, aber nicht eindeutig moralisch verurteilend; „schlau“ bewahrt diese Spannung.
- source_word: τὰ περὶ τὸν πύργον
  choice: was es mit dem Turm auf sich hat
  rationale: Eine natürliche deutsche Wiedergabe für die Angelegenheiten beziehungsweise die Bedeutung des Turms.
- source_word: ἀναγγείλω
  choice: davon berichte
  rationale: Drückt das Weitergeben der Offenbarung an die Brüder klar aus, ohne einen unnötig technischen Verkündigungsbegriff einzuführen.
- source_word: ἐν πολλῇ δόξῃ
  choice: in großer Herrlichkeit
  rationale: Bewahrt die bewusst offene Beziehung zwischen dem Erkennen des Herrn und der großen Herrlichkeit, statt sie erklärend aufzulösen.
theological_decisions:
- issue: Bezug von „in großer Herrlichkeit“
  choice: den Herrn in großer Herrlichkeit erkennen
  alternative: erkennen, dass der Herr in großer Herrlichkeit ist
  rationale: Die griechische Formulierung lässt offen, ob die Herrlichkeit näher zum Herrn oder zum Vorgang des Erkennens gehört. Die gewählte Fassung erhält diese syntaktische und theologische Offenheit.
- issue: Textkritisch unsichere Aussage über das Frohwerden
  choice: im Haupttext wiedergegeben und mit Fußnote gekennzeichnet
  alternative: aus dem Haupttext weggelassen
  rationale: Die Wörter stehen in der vorgelegten Ausgabe in eckigen Klammern. Ihre Aufnahme folgt dem überlieferten Lesefluss und der konsultierten englischen Fassung, während die Fußnote die Unsicherheit transparent macht.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit erzählerischem Präsens in der direkten Gesprächseinleitung, entsprechend dem griechischen Tempuswechsel. Die Anrede „Herrin“ und die Bezeichnung „Brüder“ bleiben wegen ihrer literarischen und frühchristlichen Funktion erhalten.
