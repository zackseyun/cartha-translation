base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: de
  text: 'Sie sagte: „Viele werden es zwar hören. Doch wenn sie es gehört haben, werden einige von ihnen sich freuen, andere aber werden weinen. Aber auch diese werden sich freuen, wenn sie hören und umkehren. Höre nun die Gleichnisse vom Turm; denn ich werde dir alles offenbaren. Und bereite mir künftig keine Mühe mehr wegen Offenbarungen; denn diese Offenbarungen haben ein Ende, weil sie abgeschlossen sind. Du aber wirst nicht aufhören, um Offenbarungen zu bitten; denn du bist unverschämt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσονται / ἀκούσαντες / ἀκούσωσιν
  choice: werden es hören / es gehört haben / hören
  rationale: Die wiederholte Hör-Terminologie des Griechischen bleibt erhalten; das ergänzte „es“ macht den deutschen Bezug auf die Botschaft natürlich verständlich.
- source_word: μετανοήσωσιν
  choice: umkehren
  rationale: „Umkehren“ gibt die Sinnes- und Lebensänderung wieder, ohne den Ausdruck auf bloße Reue zu verengen.
- source_word: παραβολὰς
  choice: Gleichnisse
  rationale: Der geläufige frühchristliche Ausdruck bewahrt den bildhaft-auslegenden Charakter der Erklärungen zum Turm.
- source_word: κόπους πάρεχε
  choice: bereite mir … keine Mühe mehr
  rationale: Die Wendung bezeichnet das Verursachen von Mühe oder Beschwer; diese Wiedergabe ist würdig und im modernen Deutsch verständlich.
- source_word: ἀποκαλύψεις
  choice: Offenbarungen
  rationale: Die wiederholte formale Entsprechung wahrt den Zusammenhang und den religiösen Bedeutungsgehalt.
- source_word: ἀναιδής
  choice: unverschämt
  rationale: Das Wort bezeichnet dreistes, schamloses Beharren; „unverschämt“ trifft hier den tadelnden, zugleich dialogischen Ton.
theological_decisions:
- issue: Bedingung für die Freude der Weinenden
  choice: „wenn sie hören und umkehren“
  alternative: „wenn sie darauf hören und Buße tun“
  rationale: Die Übersetzung bewahrt beide griechischen Bedingungen, erneutes bzw. wirkliches Hören und Umkehr, ohne das Verhältnis zwischen ihnen dogmatisch auszudeuten.
- issue: Ende und Vollendung der Offenbarungen
  choice: „haben ein Ende, weil sie abgeschlossen sind“
  alternative: „sind begrenzt, denn sie sind erfüllt“
  rationale: τέλος ἔχουσιν und πεπληρωμέναι εἰσιν werden unterschieden wiedergegeben. „Abgeschlossen“ passt im Kontext einer beendeten Offenbarungsreihe, ohne eine weitergehende Lehre über Offenbarung festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton. Die Kontraststruktur und die auffälligen Wiederholungen des griechischen Textes wurden weitgehend bewahrt.
