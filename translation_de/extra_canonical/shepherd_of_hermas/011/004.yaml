  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: de
  text: 'Ich sage zu ihr: »Herrin, da du mich ein für alle Mal für würdig gehalten hast, dass mir alles offenbart werde, so offenbare es mir.« Sie sagt zu mir: »Was dir offenbart werden kann, wird dir offenbart werden. Nur sei dein Herz auf Gott gerichtet, und zweifle nicht an dem, was du siehst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Herrin
  rationale: Gibt die respektvolle Anrede an die als Frau erscheinende Kirche sachlich und würdevoll wieder.
- source_word: ἐπεὶ ἅπαξ ἠξίών με ἠγήσω
  choice: da du mich ein für alle Mal für würdig gehalten hast
  rationale: Bewahrt sowohl den Würdigkeitsgedanken von ἀξιόω als auch den nachdrücklichen Sinn von ἅπαξ.
- source_word: Ὃ ἐὰν ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: Was dir offenbart werden kann
  rationale: Gibt die durch ἐνδέχεται bezeichnete Möglichkeit beziehungsweise Zulässigkeit wieder, ohne festzulegen, wodurch sie begrenzt ist.
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: sei dein Herz auf Gott gerichtet
  rationale: Natürliches modernes Deutsch, das die Ausrichtung des Herzens zu Gott hin erhält.
- source_word: μὴ διψυχήσῃς
  choice: zweifle nicht
  rationale: Der frühchristliche Ausdruck bezeichnet innere Geteiltheit beziehungsweise schwankenden Zweifel; im Kontext des Gesehenen ist »zweifle nicht« klar und idiomatisch.
theological_decisions:
- issue: Umfang der möglichen Offenbarung
  choice: Was dir offenbart werden kann
  alternative: Was dir offenbart werden darf
  rationale: Der griechische Wortlaut lässt offen, ob Möglichkeit, Angemessenheit oder Erlaubnis gemeint ist; die gewählte Formulierung wahrt diese Unbestimmtheit am ehesten.
- issue: Bedeutung von διψυχέω
  choice: zweifle nicht an dem, was du siehst
  alternative: sei nicht geteilten Herzens angesichts dessen, was du siehst
  rationale: Die Alternative bildet die Wortgestalt formaler ab, klingt hier jedoch weniger natürlich. »Zweifle nicht« bewahrt den kontextuellen Sinn, ohne eine besondere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die leicht formelle Anrede »Herrin« entspricht der visionären Szene; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
