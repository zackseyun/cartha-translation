review_pass:
  verdict: revise
  source_fidelity: 'Inhaltlich gibt der Entwurf den griechischen Text sehr genau wieder: die begründete Nachfrage, die Rettung durch Wasser in Vergangenheit und Zukunft, die Gründung des Turms durch das Wort des Namens sowie sein Gehaltenwerden durch die unsichtbare Macht des Gebieters bleiben erhalten. Die instrumentale und theologisch nicht weiter spezifizierte Aussage διὰ ὕδατος ist angemessen offen wiedergegeben.'
  naturalness: »Auf Wassern« ist im heutigen Standarddeutsch trotz der griechischen Pluralform unnötig unidiomatisch. »Auf dem Wasser« ist die natürliche deutsche Entsprechung; der deutsche Singular fungiert hier als Stoff- bzw. Sammelbegriff und verändert die Bildaussage nicht. Auch die Wiederholung von »nachforschen« lässt sich ohne Bedeutungsverlust glätten.
  terminology: »Herrin« gibt κυρία als Anrede sachgerecht wieder. »Der allmächtige und herrliche Name«, »Wort« und »Gebieter« bewahren die Ausdrucksweise und die terminologische Unterscheidung des griechischen Textes. »Gehalten« ist für κρατεῖται vertretbar.
  issues:
