    issue: Unnatürliche Pluralbildung »auf Wassern«
    rationale: Das griechische ὑδάτων steht zwar im Plural, doch modernes Deutsch verwendet in dieser räumlich-symbolischen Wendung idiomatisch »auf dem Wasser«. Ein mechanisch bewahrter Plural wirkt störend, ohne einen zusätzlichen Sinngehalt zu vermitteln.
  - severity: low
    issue: Stilistisch schwere Wiederholung von »nachforschen«
    rationale: Die zweimalige Verwendung im unmittelbaren Zusammenhang ist zwar verständlich, aber »sorgfältig suchen« / »wer sucht, findet« bildet ἐκζητεῖν und εὑρίσκειν klarer und natürlicher ab.
