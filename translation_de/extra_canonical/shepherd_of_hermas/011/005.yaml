revisions:
- from: 'Ich fragte sie: »Warum ist der Turm auf Wassern gebaut worden, Herrin?« Sie sagte: »Ich habe es dir schon früher gesagt, und du forschst gewissenhaft nach. Indem du also nachforschst, findest du die Wahrheit. Höre nun, warum der Turm auf Wassern gebaut worden ist: weil euer Leben durch Wasser gerettet wurde und gerettet werden wird. Der Turm aber ist durch das Wort des allmächtigen und herrlichen Namens gegründet und wird von der unsichtbaren Macht des Gebieters gehalten.«'
  to: 'Ich fragte sie: »Warum ist der Turm auf dem Wasser gebaut worden, Herrin?« Sie sagte: »Ich habe es dir schon früher gesagt, und du suchst sorgfältig danach. Indem du suchst, findest du die Wahrheit. Höre nun, warum der Turm auf dem Wasser gebaut worden ist: weil euer Leben durch Wasser gerettet wurde und gerettet werden wird. Der Turm aber ist durch das Wort des allmächtigen und herrlichen Namens gegründet und wird von der unsichtbaren Macht des Gebieters gehalten.«'
  rationale: Die Revision beschränkt sich auf idiomatisches modernes Deutsch. Sie ersetzt den im Deutschen künstlichen Plural »Wassern« durch den idiomatischen Stoff-/Sammelsingular »Wasser« und glättet die Wiederholung von »nachforschen«. Weder die symbolische Offenheit des Wassers noch die Aussagen über den Namen, das Wort oder den Gebieter werden ausgelegt oder verändert.
