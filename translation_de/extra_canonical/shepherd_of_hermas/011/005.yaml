base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: de
  text: 'Ich fragte sie: »Warum ist der Turm auf dem Wasser gebaut worden, Herrin?« Sie sagte: »Ich habe es dir schon früher gesagt, und du suchst sorgfältig danach. Indem du suchst, findest du die Wahrheit. Höre nun, warum der Turm auf dem Wasser gebaut worden ist: weil euer Leben durch Wasser gerettet wurde und gerettet werden wird. Der Turm aber ist durch das Wort des allmächtigen und herrlichen Namens gegründet und wird von der unsichtbaren Macht des Gebieters gehalten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ ὑδάτων
  choice: auf Wassern
  rationale: Der Plural des griechischen Textes wird bewahrt; die leicht ungewöhnliche deutsche Form erhält den symbolisch-visionären Klang.
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: du forschst gewissenhaft nach
  rationale: Gibt sowohl das intensive Suchen von ἐκζητέω als auch die Sorgfalt von ἐπιμελῶς natürlich wieder.
- source_word: διὰ ὕδατος
  choice: durch Wasser
  rationale: Bewahrt die knappe instrumentale beziehungsweise vermittelnde Aussage, ohne ihre mögliche tauftheologische Bedeutung ausdrücklich festzulegen.
- source_word: τῷ ῥήματι
  choice: durch das Wort
  rationale: Der Dativ wird instrumental verstanden; »Wort« lässt offen, ob eine göttliche Äußerung, Verheißung oder ein wirksamer Befehl gemeint ist.
- source_word: τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος
  choice: des allmächtigen und herrlichen Namens
  rationale: Die Genitivverbindung und die Personifizierung beziehungsweise Hoheit des »Namens« bleiben erhalten.
- source_word: τοῦ δεσπότου
  choice: des Gebieters
  rationale: »Gebieter« bewahrt den Herrschaftsakzent von δεσπότης und unterscheidet den Ausdruck von κύριος.
theological_decisions:
- issue: Rettung durch Wasser
  choice: »durch Wasser gerettet wurde und gerettet werden wird«
  alternative: »im Wasser ...« oder ausdrückliche Deutung als Taufe
  rationale: Die Übersetzung bewahrt Tempus, Wiederholung und Mittelbarkeit des griechischen διὰ ὕδατος, ohne die sakramentale Deutung auszuformulieren oder abzuschwächen.
- issue: Das allmächtige und herrliche »Name« als Genitiv zu »Wort«
  choice: »durch das Wort des allmächtigen und herrlichen Namens«
  alternative: »durch das Wort des allmächtigen und herrlichen Gottes«
  rationale: Der Quelltext nennt ausdrücklich den »Namen«; eine Ersetzung durch »Gott« würde die besondere frühchristliche Namensvorstellung einebnen.
- issue: Unsichtbare erhaltende Macht
  choice: »wird von der unsichtbaren Macht des Gebieters gehalten«
  alternative: »wird getragen« oder »zusammengehalten«
  rationale: »Gehalten« wahrt die semantische Breite von κρατεῖται zwischen Festhalten, Stützen und Sichern.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die ungewöhnliche Wendung »auf Wassern« und die Großbedeutung von »Name« werden inhaltlich bewahrt, ohne durch zusätzliche typografische oder konfessionelle Deutung über den griechischen Text hinauszugehen.
