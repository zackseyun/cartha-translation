  terminology: „Aufrichtigkeit“ ist für ἁπλότης im vorliegenden ethischen Kontext eine vertretbare, nicht abwertende Wiedergabe. „Gott gefallen“, „um des Namens willen“ und „ertragen“ sind treffend. Die nicht näher bestimmte Formulierung „der Name“ darf nicht zu Christus oder Jesus ergänzt werden.
