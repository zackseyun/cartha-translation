  source_fidelity: Der Entwurf gibt die räumliche Gegenüberstellung, die Auszeichnung der bereits Gott Wohlgefälligen sowie ihr Leiden „um des Namens willen“ quellennah wieder. „Des Namens“ bleibt sachgerecht uneingeschränkt. Die Schlusswendung sollte jedoch den ausdrücklich wiederholten Aufruf μένε/ἐμμένειν klarer und idiomatischer wiedergeben.
