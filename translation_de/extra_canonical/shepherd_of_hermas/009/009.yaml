base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: de
  text: 'Als ich mich nun auf die rechte Seite setzen wollte, ließ sie es nicht zu, sondern gab mir mit der Hand ein Zeichen, mich auf die linke Seite zu setzen. Während ich darüber nachdachte und traurig war, weil sie mich nicht auf der rechten Seite hatte sitzen lassen, sagte sie zu mir: „Bist du traurig, Hermas? Der Platz auf der rechten Seite ist für andere bestimmt: für die, die Gott bereits gefallen und um des Namens willen gelitten haben. Dir aber fehlt noch vieles, um bei ihnen zu sitzen. Doch bleib deiner Aufrichtigkeit weiterhin treu, und du wirst bei ihnen sitzen – ebenso alle, die ihre Werke tun und ertragen, was auch sie ertragen haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ δεξιὰ μέρη / τὰ ἀριστερὰ μέρη
  choice: die rechte Seite / die linke Seite
  rationale: Gibt die räumliche Gegenüberstellung natürlich wieder, ohne eine über den Text hinausgehende Symbolik einzutragen.
- source_word: εὐαρεστηκότων τῷ θεῷ
  choice: die Gott bereits gefallen haben
  rationale: Bewahrt die perfektische Bedeutung und die unmittelbare Aussage über ihr Gott wohlgefälliges Handeln.
- source_word: εἵνεκα τοῦ ὀνόματος
  choice: um des Namens willen
  rationale: Erhält die ehrfürchtige, im frühchristlichen Sprachgebrauch bewusst nicht näher bestimmte Bezeichnung „der Name“.
- source_word: ἁπλότης
  choice: Aufrichtigkeit
  rationale: Im Kontext bezeichnet das Wort eine ungeteilte, redliche Haltung; „Einfalt“ wäre im heutigen Deutsch leicht abwertend, „Schlichtheit“ weniger eindeutig ethisch.
- source_word: ἐμμένεις / μενὸν
  choice: festhältst / halte weiter daran fest
  rationale: Bildet die Wiederholung und den Imperativ ab und macht den Bezug auf die Aufrichtigkeit idiomatisch deutlich.
- source_word: ὑπενέγκωσιν
  choice: ertragen
  rationale: Entspricht dem geduldigen Tragen beziehungsweise Durchstehen von Leiden, ohne deren Art enger festzulegen.
theological_decisions:
- issue: Identität „des Namens“
  choice: die verkürzte Formulierung „des Namens“ beibehalten
  alternative: „des Namens Christi/Jesu willen“
  rationale: Der griechische Text nennt nur τὸ ὄνομα. Eine ausdrückliche Ergänzung würde die im frühchristlichen Ausdruck genuine Ellipse auflösen.
- issue: Bedingung und zukünftige Teilhabe
  choice: „halte weiter daran fest; dann wirst du bei ihnen sitzen“
  alternative: „bleibe … und du wirst bei ihnen sitzen“
  rationale: Bewahrt Ermahnung und Zukunftszusage, ohne daraus eine systematische Aussage über Verdienst oder Heilsordnung zu formen.
- issue: Bedeutung von ἁπλότης
  choice: „Aufrichtigkeit“
  alternative: „Einfachheit“ oder „Einfalt“
  rationale: Die ethisch positive Bedeutung bleibt erhalten; eine konfessionelle Deutung als besondere Tugendlehre wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die wiederholten Rechts-/Linksangaben, die Anrede und die Spannung zwischen Hermas und den bereits Bewährten bleiben erhalten. Keine Fußnoten sind nötig, daher stehen im Haupttext keine Marker.
