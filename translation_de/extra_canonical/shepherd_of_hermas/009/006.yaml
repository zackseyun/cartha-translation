review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Handlung, Gebet, Sündenbekenntnis, die sechs jungen Männer und den Anteil an der δικαιοσύνη insgesamt zutreffend wieder. Zwei Nuancen sollten jedoch enger am Griechischen bleiben: ἐπεστάθη μοι bezeichnet hier ihr Dastehen bei Hermas, nicht lediglich ein Herantreten; und πάντα ἐρωτῶν ist mit dem anschließenden ἐρώτα am besten durchgehend als „fragen“ wiederzugeben. „Wegen deiner Sünden zu bitten“ verschiebt die Aussage zu einer Bitte um Vergebung und fügt durch „immer nur“ eine stärkere Exklusivität ein, als der Wortlaut sicher verlangt.'
  naturalness: Die revidierte Fassung bleibt in modernem, würdigem Standarddeutsch flüssig. „Stellte sich zu mir“ und die parallele Formulierung „Hör auf ... zu fragen; frage auch ...“ machen die erzählerische und rhetorische Struktur klar.
  terminology: „Gerechtigkeit“ gibt δικαιοσύνη angemessen und ohne konfessionelle Einengung wieder. „Anteil“ gibt μέρος τι präziser als „etwas davon“ wieder. „Haus“ bewahrt die offene Bedeutung von οἶκος (Haus, Haushalt beziehungsweise Hausgemeinschaft).
  issues:
  - severity: medium
    issue: ἐπεστάθη μοι als „Sie trat zu mir“
    rationale: Das Verb beschreibt im Kontext, dass sie bei ihm stand und seinem Gebet zuhörte. „Sie stellte sich zu mir“ gibt die fortdauernde räumliche Stellung genauer wieder.
  - severity: medium
    issue: πάντα ἐρωτῶν als „immer nur wegen deiner Sünden zu bitten“
    rationale: Der Text verwendet ἐρωτάω sowohl hier als auch in der folgenden Aufforderung ἐρώτα. Die Wiedergabe als „bitten“ statt „fragen“ verschiebt den Gegenstand und die Verbparallele; „immer nur“ kann zudem stärker ausschließend wirken als das Griechische.
