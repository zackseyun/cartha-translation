  to: 'Und sie kam mit sechs jungen Männern, die ich auch schon früher gesehen hatte, stellte sich zu mir und hörte zu, während ich betete und dem Herrn meine Sünden bekannte. Sie berührte mich und sagte: »Hermas, hör auf, ständig nach deinen Sünden zu fragen. Frage auch nach der Gerechtigkeit, damit du für dein Haus einen Anteil daran empfängst.«'
  rationale: 'Die Revision stellt die Verbparallele von ἐρωτῶν/ἐρώτα wieder her und gibt das Dastehen der Frau bei Hermas genauer wieder. Die theologischen und sozialen Begriffe bleiben bewusst offen: δικαιοσύνη als „Gerechtigkeit“ und οἶκος als „Haus“.'
