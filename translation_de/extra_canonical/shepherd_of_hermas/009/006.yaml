  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: de
  text: 'Und sie kam mit sechs jungen Männern, die ich auch schon früher gesehen hatte, stellte sich zu mir und hörte zu, während ich betete und dem Herrn meine Sünden bekannte. Sie berührte mich und sagte: »Hermas, hör auf, ständig nach deinen Sünden zu fragen. Frage auch nach der Gerechtigkeit, damit du für dein Haus einen Anteil daran empfängst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκων ἕξ
  choice: sechs jungen Männern
  rationale: νεανίσκος bezeichnet hier junge Männer; diese natürliche Wiedergabe wahrt die konkrete Personengruppe.
- source_word: ἐπεστάθη μοι
  choice: trat zu mir
  rationale: Das Verb beschreibt ihr Herantreten beziehungsweise Dabeistehen; »trat zu mir« ist im Deutschen natürlich und kontextgerecht.
- source_word: κατηκροᾶτο
  choice: hörte zu
  rationale: Das Imperfekt bezeichnet ihr anhaltendes Zuhören während des Gebets und Sündenbekenntnisses.
- source_word: ἐξομολογουμένου ... τὰς ἁμαρτίας μου
  choice: dem Herrn meine Sünden bekannte
  rationale: ἐξομολογέομαι bezeichnet in diesem Kontext das ausdrückliche Bekennen der Sünden gegenüber dem Herrn.
- source_word: πάντα ἐρωτῶν
  choice: immer nur ... zu bitten
  rationale: πάντα kann adverbial die ausschließliche beziehungsweise fortwährende Ausrichtung seiner Bitten auf die Sünden ausdrücken; die Formulierung passt zum folgenden »auch«.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Die zentrale ethisch-theologische Bedeutung bleibt erhalten, ohne sie enger als Tugend, Rechtfertigung oder rechtes Handeln festzulegen.
- source_word: μέρος τι
  choice: etwas davon
  rationale: Gibt den unbestimmten Anteil idiomatisch wieder und vermeidet eine künstliche Formulierung wie »irgendeinen Teil«.
- source_word: εἰς τὸν οἶκόν σου
  choice: für dein Haus
  rationale: οἶκος kann Haus oder Hausgemeinschaft bezeichnen. »Haus« bewahrt diese im Griechischen vorhandene Offenheit.
theological_decisions:
- issue: Bezug von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit / gerechtes Handeln
  rationale: Der griechische Ausdruck bleibt theologisch und ethisch mehrdeutig; die Übersetzung soll ihn nicht auf eine bestimmte Heils- oder Tugendlehre festlegen.
- issue: Bedeutung von οἶκος
  choice: Haus
  alternative: Hausgemeinschaft / Familie
  rationale: Die konkrete Reichweite ist nicht eindeutig. »Haus« lässt sowohl Haushalt als auch Familie beziehungsweise Hausgemeinschaft anklingen.
- issue: Charakter der Aufforderung ἐρώτα
  choice: Bitte
  alternative: Frage
  rationale: Im Zusammenhang mit Gebet und Bitten an den Herrn ist »bitten« wahrscheinlich; zugleich wird keine Aussage darüber ergänzt, wie Gerechtigkeit empfangen wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. Die direkte Rede bleibt schlicht und eindringlich; genuine Mehrdeutigkeiten bei »Gerechtigkeit« und »Haus« werden nicht aufgelöst.
