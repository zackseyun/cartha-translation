base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: de
  text: 'Nachdem ich viele Male gefastet und den Herrn gebeten hatte, mir die Offenbarung zu zeigen, die er mir durch jene alte Frau zu zeigen versprochen hatte, erschien mir die alte Frau noch in derselben Nacht und sagte zu mir: »Weil du so bedürftig und so eifrig darauf bedacht bist, alles zu erfahren, komm auf das Feld, auf dem du dich gewöhnlich aufhältst. Etwa zur fünften Stunde werde ich dir erscheinen und dir zeigen, was du sehen musst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεηθείς τοῦ Κυρίου
  choice: den Herrn gebeten hatte
  rationale: Gibt die eindringliche Bitte natürlich und würdig wieder, ohne mit »angefleht« eine im Kontext nicht zwingende emotionale Stärke festzulegen.
- source_word: τὴν ἀποκάλυψιν
  choice: die Offenbarung
  rationale: Bewahrt den religiösen und visionären Sinn des griechischen Ausdrucks.
- source_word: τῆς πρεσβυτέρας ἐκείνης
  choice: jener alten Frau
  rationale: πρεσβυτέρα bezeichnet hier die bereits bekannte ältere Frau; »alte Frau« ist im Deutschen klarer als das missverständliche kirchliche »Älteste«.
- source_word: οὕτως ἐνδεὴς εἶ
  choice: du so bedürftig bist
  rationale: Bewahrt die auffällige und möglicherweise mehrdeutige Aussage des Griechischen, statt sie deutend zu »dringend verlangst« oder »wissbegierig bist« umzuschreiben.
- source_word: σπουδαῖος εἰς τὸ γνῶναι πάντα
  choice: so eifrig darauf bedacht bist, alles zu erfahren
  rationale: Gibt den zielgerichteten Eifer idiomatisch wieder; »erfahren« passt zur erbetenen Offenbarung.
- source_word: εἰς τὸν ἀγρὸν ὅπου χρονίζεις
  choice: auf das Feld, auf dem du dich gewöhnlich aufhältst
  rationale: χρονίζεις bezeichnet hier ein längeres oder wiederholtes Verweilen; »gewöhnlich aufhältst« klingt natürlich und wahrt diesen Sinn.
- source_word: περὶ ὥραν πέμπτην
  choice: etwa zur fünften Stunde
  rationale: Erhält die antike Stundenangabe und die ungefähre Bedeutung von περί.
- source_word: ἃ δεῖ σε ἰδεῖν
  choice: was du sehen musst
  rationale: Bewahrt die Notwendigkeit beziehungsweise Bestimmung in δεῖ, ohne sie näher zu erklären.
theological_decisions:
- issue: Vermittlung der Offenbarung durch die alte Frau
  choice: »durch jene alte Frau zu zeigen versprochen hatte«
  alternative: »durch jene alte Frau offenbaren wollte«
  rationale: Die gewählte Fassung bewahrt sowohl das göttliche Versprechen als auch die Frau als Vermittlerin und vermeidet eine theologisierende Verschmelzung von »zeigen« und »offenbaren«.
- issue: Notwendigkeit des zu Sehenden
  choice: »was du sehen musst«
  alternative: »was für dich zu sehen bestimmt ist«
  rationale: Die direkte Wiedergabe lässt offen, ob δεῖ Pflicht, göttliche Bestimmung oder sachliche Notwendigkeit bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Die Wiederholung von »zeigen« folgt bewusst dem griechischen Text. Die rätselhafte Bezeichnung »bedürftig« bleibt erhalten, damit die genuine Mehrdeutigkeit nicht stillschweigend auf bloße Wissbegierde reduziert wird.
