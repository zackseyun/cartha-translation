  source_fidelity: 'Die Übersetzung gibt den Satzbau und die zentralen Aussagen des griechischen Textes zuverlässig wieder: wiederholtes Fasten und Bitten, die verheißene Offenbarung durch die ältere Frau, ihr Erscheinen in jener Nacht sowie die Aufforderung, zum Feld zu kommen. »Bedürftig« erhält die auffällige, nicht weiter festgelegte Aussage von ἐνδεής. »Was du sehen musst« bewahrt die Offenheit von δεῖ.'
  naturalness: Modernes, verständliches und zugleich angemessen würdiges Standarddeutsch. Die direkte Rede ist flüssig. »Auf dem du dich gewöhnlich aufhältst« ist als Wiedergabe von ὅπου χρονίζεις gut vertretbar; es bringt ein länger andauerndes beziehungsweise wiederholtes Verweilen zum Ausdruck.
  terminology: »Herr«, »Offenbarung« und »alte Frau« sind sachgerecht. »Alte Frau« vermeidet zutreffend die kirchlich missverständliche Übersetzung »Älteste«. Die wiederholte Verwendung von »zeigen« entspricht der textlichen Verknüpfung von ἐπηγγείλατο δεῖξαι und δείξω.
