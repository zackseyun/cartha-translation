base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: de
  text: So ging ich nun, Brüder, auf das Feld, berechnete die Stunden und kam zu dem Ort, an den ich sie bestellt hatte. Da sah ich eine elfenbeinerne Liege stehen; auf der Liege lag ein Leinenkissen, und darüber war ein Tuch aus feinem Leinen ausgebreitet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεψήφισα τὰς ὥρας
  choice: berechnete die Stunden
  rationale: Die Wendung bezeichnet das Abzählen beziehungsweise Berechnen der Stunden, damit Hermas zur verabredeten Zeit eintrifft.
- source_word: διεταξάμην αὐτὴν ἐλθεῖν
  choice: an den ich sie bestellt hatte
  rationale: Idiomatiche Wiedergabe der Anweisung beziehungsweise Verabredung, dass sie dorthin kommen solle.
- source_word: συμπέλιον ... ἐλεφάντινον
  choice: elfenbeinerne Liege
  rationale: συμπέλιον bezeichnet hier ein Sitz- oder Liegemöbel; der Kontext des späteren Sitzens spricht für „Liege“ als natürliche, hinreichend offene Wiedergabe.
- source_word: κεβριδάριον λινόῦν
  choice: Leinenkissen
  rationale: Das seltene κεβριδάριον bezeichnet offenbar ein kleines Kissen oder Polster; „Leinenkissen“ gibt Gegenstand und Material knapp wieder.
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: Tuch aus feinem Leinen
  rationale: λεντίον ist ein Tuch; καρπάσιον bezeichnet eine feine Leinenart. Die Übersetzung vermeidet die modern zu enge Vorstellung eines Handtuchs.
- source_word: βλέπω
  choice: Da sah ich
  rationale: Das historische Präsens wird im Deutschen als lebendige Fortführung der Erzählung mit „Da sah ich“ wiedergegeben.
