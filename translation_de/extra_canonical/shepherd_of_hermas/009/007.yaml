  text: And she raised me by the hand and leads me to the couch, and she says to the young men, “Go and build.”
translation:
  language: de
  text: 'Und sie nahm mich bei der Hand, richtete mich auf und führte mich zu der Sitzbank. Zu den jungen Männern sagte sie: »Geht und baut.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: sie nahm mich bei der Hand, richtete mich auf
  rationale: Gibt sowohl das Aufrichten (ἐξήγειρε) als auch die Hand als Mittel bzw. Berührung natürlich wieder.
- source_word: συμπέλιον
  choice: Liege
  rationale: Bezeichnet hier das zuvor beschriebene Möbelstück; »Liege« ist im Zusammenhang natürlicher und weniger modern-funktional als »Sofa«.
- source_word: Ὑπάγετε καὶ οἰκοδομεῖτε
  choice: Geht und baut
  rationale: Bewahrt die knappe Befehlsform und lässt das im Griechischen nicht genannte Bauobjekt offen.
