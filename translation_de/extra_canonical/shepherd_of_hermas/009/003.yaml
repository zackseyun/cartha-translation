base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: de
  text: 'Ich fragte sie: »Herrin, an welchem Ort im Feld?« Sie sagte: »Wohin du willst.« Ich wählte einen schönen, abgelegenen Ort. Doch bevor ich mit ihr sprach und ihr den Ort nannte, sagte sie zu mir: »Ich werde dorthin kommen, wohin du willst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle Anrede und das Verhältnis zur als ältere Frau erscheinenden Gestalt; »Herrin« ist würdevoll und genauer als das heute anders konnotierte »Dame«.
- source_word: ἀγροῦ
  choice: Feld
  rationale: Gibt ἀγρός im unmittelbaren Kontext als ländliches Gelände wieder und entspricht der räumlichen Frage nach einem bestimmten Ort darin.
- source_word: τόπον καλὸν ἀνακεχωρηκότα
  choice: einen schönen, abgelegenen Ort
  rationale: καλός bezeichnet hier einen geeigneten bzw. ansprechenden Ort; ἀνακεχωρηκότα hebt seine zurückgezogene Lage hervor.
- source_word: Ἥξω
  choice: Ich werde kommen
  rationale: Gibt das futurische Eintreffen der Gestalt schlicht und direkt wieder.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdevoller direkter Rede. Der Wechsel zwischen erzählendem Präteritum und direkter Rede wurde natürlich gestaltet; die Wiederholung von »wohin du willst« bleibt erhalten, weil sie die übernatürliche Kenntnis des noch unausgesprochenen Ortes erkennen lässt.
