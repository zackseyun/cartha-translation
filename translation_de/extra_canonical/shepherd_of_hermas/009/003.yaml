  source_fidelity: Der Sinn wird insgesamt zutreffend wiedergegeben. Präziser ist jedoch die Frage nach einer konkreten Stelle »im Feld« (τόπον τοῦ ἀγροῦ) statt »auf dem Feld«. Außerdem besagt πρὶν ... λαλῆσαι αὐτῇ καὶ εἰπεῖν τὸν τόπον, dass Hermas noch nicht mit ihr gesprochen und ihr den Ort genannt hatte; die deutsche Formulierung mit »konnte« fügt unnötig eine Modalnuance hinzu.
  naturalness: Die Sprache ist klar und modern. »An welchem Ort im Feld?« und »bevor ich mit ihr sprach und ihr den Ort nannte« sind idiomatischer und näher am griechischen Satzbau.
  terminology: »Herrin« gibt Κυρία als respektvolle Anrede konsequent wieder und ist im visionsliterarischen Kontext vertretbar. Die Wiederholung von »wohin du willst« bewahrt den erzählerischen Effekt, dass sie den nicht ausgesprochenen Wunsch kennt.
