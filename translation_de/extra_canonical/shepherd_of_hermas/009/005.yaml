base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: de
  text: Als ich dies daliegen sah und niemand an diesem Ort war, geriet ich außer mir vor Staunen. Es war, als ergriffe mich ein Zittern, und mir standen die Haare zu Berge; es war, als überkomme mich ein Schauder, weil ich allein war. Dann kam ich wieder zu mir, erinnerte mich an die Herrlichkeit Gottes und fasste Mut. Ich kniete nieder und bekannte dem Herrn erneut meine Sünden, wie schon zuvor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος ἐγενόμην
  choice: geriet ich außer mir vor Staunen
  rationale: Gibt die starke Bestürzung und das überwältigende Erstaunen der Wendung wieder, ohne sie auf bloße Verwunderung abzuschwächen.
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: Mich ergriff gleichsam ein Zittern
  rationale: Bewahrt sowohl das Vergleichssignal ὡσεί als auch die körperliche Furchtreaktion.
- source_word: αἱ τρίχες μου ὀρθαί
  choice: meine Haare standen zu Berge
  rationale: Natürliches modernes Deutsch für das knappe griechische Bild, dessen Verb sinngemäß zu ergänzen ist.
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: ein Schauder überkam mich
  rationale: φρίκη bezeichnet einen Schauder beziehungsweise ein Frösteln; die idiomatische Formulierung erhält die körperlich-emotionale Wirkung.
- source_word: ἐν ἐμαυτῷ ... γενόμενος
  choice: kam ich wieder zu mir
  rationale: Die feste Wendung bezeichnet die Rückkehr zur Selbstbeherrschung nach der Bestürzung.
- source_word: ἐξωμολογούμην
  choice: bekannte ... meine Sünden
  rationale: Der ausdrückliche Akkusativ τὰς ἁμαρτίας μου legt hier Sündenbekenntnis nahe, nicht allgemein Lobpreis oder Dank.
- source_word: πάλιν
  choice: abermals
  rationale: Dignified but current wording that preserves the explicit repetition in connection with „wie schon zuvor“.
theological_decisions:
- issue: Die Herrlichkeit Gottes als Quelle neuen Mutes
  choice: erinnerte mich an die Herrlichkeit Gottes und fasste Mut
  alternative: gedachte der Herrlichkeit Gottes und wurde zuversichtlich
  rationale: Folgt der Abfolge der griechischen Partizipien, ohne eine zusätzliche theologische Erklärung über die Art der Herrlichkeit oder des Mutes einzutragen.
- issue: Art des Gebets
  choice: bekannte dem Herrn ... meine Sünden
  alternative: legte vor dem Herrn ... ein Bekenntnis über meine Sünden ab
  rationale: Das Objekt „meine Sünden“ macht ein persönliches Sündenbekenntnis deutlich; eine sakramentale oder konfessionelle Deutung wird nicht hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die zweimalige Abschwächung durch ὡσεί wird beim Zittern ausdrücklich mit „gleichsam“ wiedergegeben; beim Schauder trägt die deutsche idiomatische Wendung die bildhafte Wirkung, ohne unnötige Schwerfälligkeit. Keine Fußnoten erforderlich.
