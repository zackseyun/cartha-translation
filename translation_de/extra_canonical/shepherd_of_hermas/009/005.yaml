  to: Als ich dies daliegen sah und niemand an diesem Ort war, geriet ich außer mir vor Staunen. Es war, als ergriffe mich ein Zittern, und mir standen die Haare zu Berge; es war, als überkomme mich ein Schauder, weil ich allein war. Dann kam ich wieder zu mir, erinnerte mich an die Herrlichkeit Gottes und fasste Mut. Ich kniete nieder und bekannte dem Herrn erneut meine Sünden, wie schon zuvor.
