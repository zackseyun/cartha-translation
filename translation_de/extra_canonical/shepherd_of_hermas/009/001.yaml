lexical_decisions:
- source_word: ἣν εἶδον … τοιαύτη
  choice: Die Vision, die ich sah, … war so
  rationale: Das Bezugswort zu ἣν ist im überlieferten Satz ausgelassen und wird aus dem Abschnittskontext als „Vision“ ergänzt. „war so“ gibt τοιαύτη natürlich wieder und leitet die folgende Schilderung ein.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die direkte Anrede wird formal und knapp beibehalten; der historische Wortlaut bezeichnet die angesprochenen Glaubensgeschwister mit dem maskulinen Plural.
