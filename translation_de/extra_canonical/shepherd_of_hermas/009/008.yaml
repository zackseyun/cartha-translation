  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/008.yaml
  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: de
  text: 'Nachdem die jungen Männer weggegangen waren und wir allein waren, sagte sie zu mir: »Setz dich hier.« Ich sagte zu ihr: »Herrin, lass zuerst die Älteren Platz nehmen.« Sie sagte: »Tu, was ich dir sage: Setz dich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναχωρῆσαι
  choice: weggegangen waren
  rationale: Gibt das räumliche Sich-Entfernen natürlich und ohne unnötige Förmlichkeit wieder.
- source_word: Κάθισον
  choice: Setz dich
  rationale: Entspricht dem direkten Imperativ in natürlichem modernem Deutsch.
- source_word: Κυρία
  choice: Herrin
  rationale: Bewahrt die respektvolle weibliche Anrede und vermeidet die moderne gewöhnliche Anrede »Frau«.
- source_word: πρεσβυτέρους
  choice: die Älteren
  rationale: Der Kontext legt ältere beziehungsweise ranghöhere Personen nahe; »Älteste« könnte hier vorschnell ein festes kirchliches Amt bezeichnen.
- source_word: Ὅ σοι λέγω
  choice: Tu, was ich dir sage
  rationale: Gibt die idiomatische Nachdrücklichkeit der Wendung im Deutschen klar wieder.
theological_decisions:
- issue: Bedeutung von πρεσβυτέρους
  choice: die Älteren
  alternative: die Ältesten
  rationale: Der Satz bezeichnet nicht eindeutig ein kirchliches Amt. Die allgemeinere Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter, knapper Rede. Der historische Präsenswechsel des Griechischen wurde für einen flüssigen deutschen Erzählzusammenhang als Vergangenheit wiedergegeben.
