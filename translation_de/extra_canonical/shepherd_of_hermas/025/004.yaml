base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: de
  text: 4. Noch während er redete, veränderte sich seine Gestalt, und ich erkannte, dass er derjenige war, dem ich anvertraut worden war. Sofort war ich zutiefst bestürzt, und Furcht ergriff mich. Vor Kummer war ich völlig niedergeschlagen, weil ich ihm so böse und unverständig geantwortet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: sein Aussehen veränderte sich
  rationale: Gibt die sichtbare Veränderung seiner Gestalt beziehungsweise Erscheinung natürlich wieder, ohne die Art der Veränderung näher zu bestimmen.
- source_word: ᾧ παρεδόθην
  choice: dem ich anvertraut worden war
  rationale: Bewahrt das Passiv und damit die im Satz nicht ausdrücklich genannte handelnde Instanz.
- source_word: συνεχύθην
  choice: geriet ich in Verwirrung
  rationale: Trifft die Bedeutung von innerer Bestürzung und Beschämung im Zusammenhang.
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: Vor Kummer war ich völlig niedergeschlagen
  rationale: Überträgt das starke Bild des inneren Zusammenbrechens idiomatisch und mit der Intensität von ὅλος.
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: böse und unverständig
  rationale: Erhält sowohl die negative sittliche Bewertung als auch den Vorwurf mangelnder Einsicht.
theological_decisions:
- issue: Nicht genannter Urheber des Anvertrauens
  choice: Passivform „dem ich anvertraut worden war“
  alternative: „dem Gott mich anvertraut hatte“
  rationale: Der griechische Text nennt den Handelnden nicht; die Übersetzung ergänzt daher keine ausdrückliche göttliche Urheberschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die emotionale Steigerung von Verwirrung über Furcht bis zur völligen Niedergeschlagenheit bleibt erhalten.
