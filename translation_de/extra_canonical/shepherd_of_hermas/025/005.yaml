    rationale: „Damit du sie stets zur Hand hast, sie lesen und befolgen kannst“ macht das Zur-Hand-Haben zu einem eigenen Ziel. ὑπὸ χεῖρα qualifiziert hier das Lesen im Sinn von „griffbereit/bei der Hand lesen“.
