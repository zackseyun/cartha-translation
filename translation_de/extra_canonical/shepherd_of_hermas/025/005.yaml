  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: de
  text: '5 Doch er antwortete mir: »Sei nicht bestürzt, sondern werde stark in meinen Geboten, die ich dir gleich geben werde. Denn ich bin gesandt worden«, sagte er, »um dir alles, was du früher gesehen hast, noch einmal zu zeigen, und zwar die Hauptpunkte, die euch von Nutzen sind. Schreibe zuallererst meine Gebote und die Gleichnisse auf. Das Übrige sollst du so aufschreiben, wie ich es dir zeigen werde. Deshalb«, sagte er, »gebiete ich dir, zuerst die Gebote und Gleichnisse aufzuschreiben, damit du sie griffbereit lesen und befolgen kannst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: Sei nicht bestürzt
  rationale: Das Passiv bezeichnet hier innere Verwirrung und Beschämung; „bestürzt“ gibt die Reaktion im unmittelbaren Kontext natürlich wieder.
- source_word: ἰσχυροποιοῦ
  choice: werde stark
  rationale: Bewahrt den auffälligen imperativischen Gedanken des Erstarkens, statt ihn bloß als Ermutigung abzuschwächen.
- source_word: ἐν ταῖς ἐντολαῖς μου
  choice: in meinen Geboten
  rationale: Die lokale bzw. sphärische Formulierung des Griechischen bleibt erhalten.
- source_word: τὰ κεφάλαια
  choice: die Hauptpunkte
  rationale: κεφάλαια meint hier die wesentlichen Punkte oder Hauptstücke des zuvor Geschauten.
- source_word: παραβολάς
  choice: Gleichnisse
  rationale: Die etablierte deutsche Wiedergabe passt zur literarischen Abteilung des Werkes, ohne die Gattung enger als nötig festzulegen.
- source_word: ὑπὸ χεῖρα
  choice: stets zur Hand
  rationale: Gibt die idiomatische Bedeutung „griffbereit/verfügbar“ in natürlichem Deutsch wieder.
- source_word: φυλάξαι
  choice: befolgen
  rationale: Im Zusammenhang mit Geboten bedeutet das Verb nicht nur Aufbewahren, sondern ihr Halten und Befolgen.
theological_decisions:
- issue: Bezug von αὐτὰ τὰ κεφάλαια
  choice: und zwar die Hauptpunkte
  alternative: besonders die Hauptpunkte
  rationale: Das Griechische kann appositionell bzw. präzisierend verstanden werden. „Und zwar“ wahrt den Nachdruck, ohne zwingend zu behaupten, nur eine Auswahl werde erneut gezeigt.
- issue: Numeruswechsel bei ὑμῖν
  choice: die euch von Nutzen sind
  alternative: die dir von Nutzen sind
  rationale: Der griechische Plural wird bewahrt und zeigt, dass der Nutzen über Hermas als Empfänger hinaus die angesprochene Gemeinschaft betrifft.
- issue: Gebote halten als φυλάσσειν
  choice: befolgen
  alternative: bewahren
  rationale: „Befolgen“ macht den ethisch-praktischen Sinn deutlich, ohne eine besondere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die Wiederholungen des Ausgangstextes bleiben weitgehend sichtbar; unnötig altertümliche Wendungen werden vermieden.
