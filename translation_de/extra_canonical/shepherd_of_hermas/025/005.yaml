  to: '5 Doch er antwortete mir: »Sei nicht bestürzt, sondern werde stark in meinen Geboten, die ich dir gleich geben werde. Denn ich bin gesandt worden«, sagte er, »um dir alles, was du früher gesehen hast, noch einmal zu zeigen, und zwar die Hauptpunkte, die euch von Nutzen sind. Schreibe zuallererst meine Gebote und die Gleichnisse auf. Das Übrige sollst du so aufschreiben, wie ich es dir zeigen werde. Deshalb«, sagte er, »gebiete ich dir, zuerst die Gebote und Gleichnisse aufzuschreiben, damit du sie griffbereit lesen und befolgen kannst.«'
