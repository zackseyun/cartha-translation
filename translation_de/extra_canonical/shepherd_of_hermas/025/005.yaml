review_pass:
  verdict: revise
  source_fidelity: 'Der Text gibt den Sinn des griechischen Abschnitts insgesamt zuverlässig wieder: die Ermutigung, die angekündigte erneute Darlegung des zuvor Gesehenen, die Gebote und Gleichnisse sowie das Ziel ihres Lesens und Befolgens. Der Plural in „die euch von Nutzen sind“ bewahrt zutreffend das griechische ὑμῖν. Bei ὑπὸ χεῖρα bezeichnet die Wendung jedoch das griffbereite Lesen; die vorliegende Formulierung legt stattdessen nahe, die Texte lediglich bei sich zu haben.'
  naturalness: Modernes, würdiges Deutsch. Die Umstellung zu „griffbereit lesen“ ist idiomatischer und bindet „zur Hand“ klar an den im griechischen Satz gemeinten Vorgang des Lesens.
  terminology: „Gebote“ für ἐντολαί und „Gleichnisse“ für παραβολαί sind angemessen und konsistent. „Hauptpunkte“ ist für κεφάλαια im Kontext vertretbar. „Befolgen“ trifft φυλάξαι im Bezug auf Gebote.
