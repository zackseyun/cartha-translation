base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: de
  text: 7. Wenn ihr sie nun hört, sie befolgt, nach ihnen lebt und sie mit reinem Herzen in die Tat umsetzt, werdet ihr vom Herrn empfangen, was er euch versprochen hat. Wenn ihr sie aber hört und nicht umkehrt, sondern euren Sünden noch weitere hinzufügt, werdet ihr vom Herrn das Gegenteil empfangen. Der Hirte, der Engel der Umkehr, befahl mir, dies alles so niederzuschreiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: sie befolgt
  rationale: Das Verb bezeichnet hier das bewahrende Einhalten der zuvor genannten Gebote und Gleichnisse; „befolgen“ ist im Deutschen natürlich und handlungsbezogen.
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: nach ihnen lebt
  rationale: Die wörtliche Wegmetapher „in ihnen wandelt“ wäre verständlich, wirkt aber altertümlich. „Nach ihnen lebt“ erhält den ethischen Sinn in modernem Standarddeutsch.
- source_word: ἐργάσησθε αὐτάς
  choice: sie in die Tat umsetzt
  rationale: Die Formulierung gibt das aktive Tun wieder und vermeidet das unnatürliche „sie wirkt/tut“.
- source_word: μετανοήσητε
  choice: umkehrt
  rationale: „Umkehren“ bildet die religiös-ethische Neuorientierung von μετανοέω ab und passt zur Bezeichnung des Hirten als Engel der Umkehr.
- source_word: τὰ ἐναντία
  choice: das Gegenteil
  rationale: Die bewusst unbestimmte Gegenüberstellung des Griechischen bleibt erhalten; sie wird nicht zu einer konkreten Straflehre ausgedeutet.
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: der Engel der Umkehr
  rationale: Die genitivische Bezeichnung wird formal und ohne zusätzliche dogmatische Festlegung wiedergegeben.
theological_decisions:
- issue: Verhältnis von Gehorsam, Verheißung und Empfang vom Herrn
  choice: Die konditionale Form des griechischen Textes bleibt ausdrücklich erhalten.
  alternative: Die Aussage als bloßen Hinweis auf sichtbare Früchte des Glaubens oder als Verdienstlehre erläutern.
  rationale: Der Ausgangstext verbindet Befolgen und Tun unmittelbar mit dem Empfang des Verheißenen. Eine konfessionelle Systematisierung würde die genuine Spannung auflösen.
- issue: Folge ausbleibender Umkehr
  choice: „das Gegenteil empfangen“ bleibt unbestimmt.
  alternative: Eine bestimmte zeitliche oder ewige Strafe benennen.
  rationale: τὰ ἐναντία konkretisiert die Folgen nicht; die Übersetzung darf keine nicht ausgesprochene Strafvorstellung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde moderat gegliedert, ohne die Bedingungslogik oder die wiederholten Handlungsaufforderungen des Griechischen abzuschwächen.
