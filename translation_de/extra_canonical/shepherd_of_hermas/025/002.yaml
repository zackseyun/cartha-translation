  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/002.yaml
  text: 2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”
translation:
  language: de
  text: '2. Sofort setzte er sich neben mich und sagte zu mir: »Ich bin von dem ehrwürdigsten Engel gesandt worden, damit ich für die übrigen Tage deines Lebens bei dir wohne.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθύς
  choice: sofort
  rationale: Gibt die unmittelbare zeitliche Abfolge natürlich und präzise wieder.
- source_word: παρεκάθισέν μοι
  choice: setzte er sich neben mich
  rationale: Bewahrt die räumliche Bedeutung des Verbs mit Dativ in idiomatischem Deutsch.
- source_word: σεμνοτάτου
  choice: ehrwürdigsten
  rationale: Der Superlativ bezeichnet höchste Würde oder Verehrungswürdigkeit; „ehrwürdigsten“ wahrt Form und Sinn.
- source_word: μετὰ σοῦ οἰκήσω
  choice: bei dir wohne
  rationale: Gibt dauerhaftes Wohnen in Gemeinschaft wieder, ohne die Aussage zu „bleiben“ abzuschwächen.
- source_word: τὰς λοιπὰς ἡμέρας τῆς ζωῆς σου
  choice: für die übrigen Tage deines Lebens
  rationale: Nahe, klare Wiedergabe der griechischen Zeitangabe.
theological_decisions:
- issue: Identität und Rang des „ehrwürdigsten Engels“
  choice: wörtlich als „der ehrwürdigste Engel“ wiedergegeben
  alternative: deutend als Gott, Christus oder ein bestimmter Erzengel identifizieren
  rationale: Der griechische Text nennt lediglich τὸν σεμνότατον ἄγγελον; die Übersetzung darf die im Kontext nicht ausdrücklich aufgelöste Identität nicht konfessionell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Der historische Präsenswechsel καὶ λέγει μοι wurde zugunsten einer flüssigen deutschen Erzählfolge als „sagte zu mir“ wiedergegeben.
