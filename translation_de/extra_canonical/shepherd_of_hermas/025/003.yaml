  to: '3. Ich dachte, er sei da, um mich auf die Probe zu stellen, und sagte zu ihm: »Wer bist du denn? Ich weiß nämlich, wem ich anvertraut worden bin.« Er sagte zu mir: »Erkennst du mich nicht?« »Nein«, sagte ich. »Ich bin der Hirte, dem du anvertraut worden bist«, sagte er.'
