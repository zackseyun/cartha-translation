  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/003.yaml
  text: 3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was entrusted.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”
translation:
  language: de
  text: '3. Ich dachte, er sei da, um mich auf die Probe zu stellen, und sagte zu ihm: »Wer bist du denn? Ich weiß nämlich, wem ich anvertraut worden bin.« Er sagte zu mir: »Erkennst du mich nicht?« »Nein«, sagte ich. »Ich bin der Hirte, dem du anvertraut worden bist«, sagte er.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: auf die Probe zu stellen
  rationale: Gibt den Gedanken des Prüfens oder Erprobens natürlich wieder, ohne eine böswillige Versuchung zu unterstellen.
- source_word: παρεδόθην
  choice: anvertraut worden bin
  rationale: Bewahrt das passive Übergeben in einen persönlichen Obhuts- oder Verantwortungsbereich; im Schluss wird die gleiche Formulierung wiederholt.
- source_word: ἐπιγινώσκεις
  choice: erkennst
  rationale: Passt zum unmittelbaren Wiedererkennen einer Person und unterscheidet sich sachgerecht vom bloßen Wissen in γινώσκω.
- source_word: ποιμήν
  choice: Hirte
  rationale: Die direkte, traditionsübergreifend verständliche Entsprechung des griechischen Titels.
theological_decisions:
- issue: Identität und Funktion des Hirten
  choice: 'Die Selbstaussage bleibt schlicht: »Ich bin der Hirte«.'
  alternative: Den Hirten ausdrücklich als Engel oder besondere Christusgestalt identifizieren.
  rationale: Der vorliegende Vers nennt ihn nur den Hirten; eine genauere theologische Identifikation würde den unmittelbaren griechischen Wortlaut überschreiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der lebhafte Wechsel zwischen erzählender Vergangenheit und historischem Präsens im Griechischen wird zugunsten eines natürlichen deutschen Erzählflusses überwiegend in der Vergangenheit wiedergegeben; die direkte Rede bleibt knapp und dialogisch.
