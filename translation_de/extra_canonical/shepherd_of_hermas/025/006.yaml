translation:
  language: de
  text: 6. So schrieb ich die Gebote und die Gleichnisse auf, wie er mir befohlen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: schrieb ... auf
  rationale: Das trennbare Verb „aufschreiben“ gibt den konkreten Vorgang des schriftlichen Festhaltens im Deutschen natürlich wieder.
- source_word: τὰς ἐντολὰς
  choice: die Gebote
  rationale: „Gebote“ entspricht dem festen Sinn von ἐντολαί in diesem Werk und bewahrt den verbindlichen Charakter der Weisungen.
- source_word: παραβολάς
  choice: Gleichnisse
  rationale: „Gleichnisse“ ist die geläufige und im frühchristlichen Kontext angemessene Wiedergabe von παραβολαί.
- source_word: καθὼς ἐνετείλατό μοι
  choice: wie er mir befohlen hatte
  rationale: Die Vorzeitigkeit des Aorists wird im deutschen Erzählzusammenhang idiomatisch mit dem Plusquamperfekt ausgedrückt; „befehlen“ bewahrt die Verbindlichkeit von ἐντέλλομαι.
