translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Das konkrete Erscheinungsbild des Hirten bleibt erhalten; altertümliche oder konfessionell geprägte Formulierungen wurden vermieden.
