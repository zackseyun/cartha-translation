base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: de
  text: Nachdem ich im Haus gebetet hatte und mich auf die Liege gesetzt hatte, trat ein Mann von herrlicher Erscheinung ein, in Hirtenkleidung und mit einem weißen Fell bekleidet; er hatte eine Tasche über den Schultern und einen Stab in der Hand. Er grüßte mich, und ich erwiderte seinen Gruß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλίνη
  choice: Ruhebett
  rationale: Das Wort kann ein Bett oder eine Liege bezeichnen. „Ruhebett“ passt zum häuslichen Sitzen und vermeidet die unnötige Festlegung auf ein Schlafbett oder ein modernes Sofa.
- source_word: ἔνδοξος τῇ ὄψει
  choice: dessen Erscheinung herrlich war
  rationale: Die Formulierung gibt die sichtbare Würde und Herrlichkeit des Mannes wieder, ohne sie lediglich als gutes Aussehen abzuschwächen.
- source_word: σχήματι ποιμενικῷ
  choice: die Kleidung eines Hirten
  rationale: σχῆμα bezeichnet hier die äußere Aufmachung beziehungsweise Tracht; die Übersetzung macht die erkennbare Hirtenkleidung natürlich verständlich.
- source_word: δέρμα λευκόν
  choice: ein weißes Fell
  rationale: δέρμα meint wörtlich Haut oder Fell. „Fell“ bezeichnet hier plausibel ein umgelegtes Kleidungsstück und bewahrt das konkrete Bild.
- source_word: πήρα
  choice: Tasche
  rationale: Gemeint ist eine über der Schulter getragene Tasche beziehungsweise ein Beutel, wie er zur Ausstattung eines Hirten oder Wanderers gehört.
- source_word: ἠσπάσατό με … ἀντησπασάμην
  choice: Er grüßte mich, und ich erwiderte seinen Gruß
  rationale: Die beiden Verben bezeichnen Gruß und Gegengruß; die idiomatische deutsche Wendung erhält ihre Gegenseitigkeit.
