  to: Nachdem ich im Haus gebetet hatte und mich auf die Liege gesetzt hatte, trat ein Mann von herrlicher Erscheinung ein, in Hirtenkleidung und mit einem weißen Fell bekleidet; er hatte eine Tasche über den Schultern und einen Stab in der Hand. Er grüßte mich, und ich erwiderte seinen Gruß.
