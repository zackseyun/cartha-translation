base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: de
  text: 12. Zunächst überhebt sich jener Mensch, der den Anschein erweckt, einen Geist zu haben, und will den ersten Platz einnehmen. Sogleich tritt er anmaßend und schamlos auf, redet viel, lebt in großem Luxus und ist in vielerlei andere Täuschungen verstrickt. Für sein prophetisches Reden nimmt er Lohn an; bekommt er keinen, so redet er nicht prophetisch. Kann denn ein göttlicher Geist Lohn annehmen und prophetisch reden? Ein Prophet Gottes kann so etwas unmöglich tun; vielmehr ist der Geist solcher Propheten irdisch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: der den Anschein erweckt, einen Geist zu haben
  rationale: Bewahrt die Distanzierung durch δοκῶν, ohne den behaupteten Geist vorschnell genauer zu bestimmen.
- source_word: πρωτοκαθεδρίαν
  choice: den Ehrenplatz
  rationale: Bezeichnet den bevorzugten, ranghöchsten Sitz; die idiomatische Wiedergabe wahrt den sozialen Anspruch des Ausdrucks.
- source_word: ἰταμός
  choice: anmaßend
  rationale: Gibt das dreiste, vermessene Auftreten im Zusammenhang natürlich wieder.
- source_word: πολύλαλος
  choice: redet viel
  rationale: Eine klare, heutige Wiedergabe für Geschwätzigkeit beziehungsweise übermäßiges Reden.
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: lebt in großem Luxus
  rationale: τρυφή bezeichnet üppigen, genussorientierten Lebenswandel; ἀναστρέφομαι beschreibt hier die Lebensführung.
- source_word: μισθὸν λαμβάνει
  choice: nimmt Lohn an
  rationale: Bewahrt den neutralen Grundbegriff der Vergütung und damit die Kritik am entgeltlichen Prophezeien.
- source_word: προφητείας / προφητεύει
  choice: prophetisches Reden / prophetisch reden
  rationale: Vermeidet im Deutschen die mögliche Verengung von „prophezeien“ auf Zukunftsvoraussage.
- source_word: ἐπίγειον
  choice: irdisch
  rationale: Entspricht dem Gegensatz zwischen dem Geist von oben und dem irdischen Geist im weiteren Kontext.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: „einen Geist“ ohne Zusatz
  alternative: „den göttlichen Geist“ oder „prophetische Geistesgabe“
  rationale: Der griechische Text lässt die behauptete Geistbegabung zunächst unbestimmt; die negative Bewertung folgt aus den Kennzeichen.
- issue: Göttlicher Geist und Bezahlung
  choice: Die rhetorische Frage bleibt als Frage stehen
  alternative: Als direkte Feststellung wiedergeben, dass der göttliche Geist keinen Lohn annimmt
  rationale: So bleiben Argumentationsform und Spannung des Ausgangstextes erhalten.
- issue: Träger des irdischen Geistes
  choice: „solcher Propheten“
  alternative: „solcher Menschen“
  rationale: Der Ausgangstext spricht ausdrücklich von τῶν τοιούτων προφητῶν, obwohl er ihre Echtheit bestreitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Reihung moralischer Kennzeichen bleibt erhalten, wird aber zur besseren Lesbarkeit moderat gegliedert. Keine konfessionell geprägte Terminologie wurde ergänzt.
