  to: 12. Zunächst überhebt sich jener Mensch, der den Anschein erweckt, einen Geist zu haben, und will den ersten Platz einnehmen. Sogleich tritt er anmaßend und schamlos auf, redet viel, lebt in großem Luxus und ist in vielerlei andere Täuschungen verstrickt. Für sein prophetisches Reden nimmt er Lohn an; bekommt er keinen, so redet er nicht prophetisch. Kann denn ein göttlicher Geist Lohn annehmen und prophetisch reden? Ein Prophet Gottes kann so etwas unmöglich tun; vielmehr ist der Geist solcher Propheten irdisch.
