  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/011.yaml
  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: de
  text: 11. »Höre nun«, sagt er, »von dem Geist, der irdisch und leer ist und keine Kraft hat, sondern töricht ist.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄκουε νῦν
  choice: Höre nun
  rationale: Gibt den auffordernden Imperativ und die zeitliche Hervorhebung knapp und würdig wieder.
- source_word: τὸ πνεῦμα τὸ ἐπίγειον
  choice: der Geist, der irdisch ... ist
  rationale: Bewahrt die konkrete Charakterisierung des Geistes als irdisch, ohne sie deutend abzuschwächen.
- source_word: κενός
  choice: leer
  rationale: Entspricht dem wiederkehrenden Leitwort des Abschnitts und erhält dessen bildhafte wie moralische Mehrdeutigkeit.
- source_word: δύναμιν μὴ ἔχοντος
  choice: keine Kraft hat
  rationale: Natürliches modernes Deutsch für das Fehlen wirksamer Macht oder Befähigung.
- source_word: μωρός
  choice: töricht
  rationale: Dignified and contextually apt rendering of moral-spiritual foolishness.
theological_decisions:
- issue: Wesen des als irdisch bezeichneten Geistes
  choice: Geist
  alternative: Geisteskraft / Eingebung
  rationale: Das griechische πνεῦμα wird direkt wiedergegeben; ob eine personale Macht oder eine Eingebung gemeint ist, bleibt dadurch offen.
- issue: Bedeutung von δύναμις
  choice: Kraft
  alternative: Macht
  rationale: Kraft passt zum Kontrast mit der von oben kommenden wirksamen Kraft in den folgenden Versen und vermeidet eine unnötige Festlegung auf Herrschaftsmacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die knappe Reihung der griechischen Charakterisierungen bleibt erhalten; keine Fußnote ist für diese Einheit erforderlich.
