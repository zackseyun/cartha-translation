  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/001.yaml
  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the servants of God—of the double‑minded, not of the faithful.
translation:
  language: de
  text: '1. Er zeigte mir Menschen, die auf einer Bank saßen, und einen anderen Menschen, der auf einem Stuhl saß. Da sagte er zu mir: »Siehst du die, die auf der Bank sitzen?« »Ich sehe sie, Herr«, sagte ich. »Diese«, sagte er, »sind Gläubige; der aber, der auf dem Stuhl sitzt, ist ein falscher Prophet, der das Denken der Diener Gottes zugrunde richtet, nämlich das der Zwiespältigen, nicht das der Gläubigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλλιον
  choice: Bank
  rationale: Bezeichnet hier eine Sitzbank für mehrere Personen und bildet den Kontrast zur einzelnen καθέδρα.
- source_word: καθέδρα
  choice: Stuhl
  rationale: Gibt den erhöhten oder besonderen Einzelsitz natürlich wieder, ohne eine amtliche Bedeutung wie »Lehrstuhl« einzutragen.
- source_word: πιστοί
  choice: treu / Treue
  rationale: Bewahrt in diesem Zusammenhang die charakterliche und glaubensbezogene Bedeutung; substantiviert bezeichnet es die standhaft Glaubenden.
- source_word: ψευδοπροφήτης
  choice: falscher Prophet
  rationale: Die etablierte und sachlich genaue Wiedergabe des griechischen Kompositums.
- source_word: ἀπόλλυσι
  choice: richtet … zugrunde
  rationale: Gibt die starke Bedeutung von ἀπόλλυμι wieder und vermeidet eine Abschwächung zu bloßer Verwirrung.
- source_word: διάνοια
  choice: Verstand
  rationale: Bezeichnet hier das innere Denk- und Urteilsvermögen; »Verstand« ist verständlich und wahrt die Aussage, dass dieses geschädigt wird.
- source_word: δίψυχοι
  choice: Unentschlossene
  rationale: Das wörtliche »Doppelseelige« wäre im modernen Deutsch unverständlich. »Unentschlossene« erfasst die innere Geteiltheit und mangelnde Festigkeit, ohne sie vorschnell als bloßen Zweifel festzulegen.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird formal bewahrt; der Kontext unterscheidet diese Anrede nicht ausdrücklich als Gottesbezeichnung.
theological_decisions:
- issue: Reichweite der zerstörerischen Wirkung des falschen Propheten
  choice: »den der Unentschlossenen, nicht den der Treuen«
  alternative: »er richtet die Unentschlossenen zugrunde, nicht die Treuen«
  rationale: Der griechische Satz wechselt nach »den Verstand … zugrunde richtet« zu einem elliptischen Genitiv. Die gewählte Fassung bezieht die Ergänzung auf διάνοια und bewahrt so die unmittelbare Syntax, ohne die Wirkung auf die vollständige Vernichtung der Personen auszuweiten.
- issue: Bedeutung von πιστοί
  choice: »treu / die Treuen«
  alternative: »gläubig / die Gläubigen«
  rationale: Beides ist möglich. Im Kontrast zu den δίψυχοι steht besonders die feste, verlässliche Haltung im Vordergrund; »treu« erhält diese Spannung.
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter Rede. Die wiederholten Redeeinleitungen des griechischen Textes bleiben erhalten. Keine Fußnoten sind nötig, da keine textkritische Variante für dieses Lesersegment ausgewiesen ist.
