revisions:
- from: '1. Er zeigte mir Männer, die auf einer Bank saßen, und einen anderen Mann, der auf einem Stuhl saß. Da sagte er zu mir: »Siehst du die, die auf der Bank sitzen?« »Ich sehe sie, Herr«, sagte ich. »Diese«, sagte er, »sind treu; der aber, der auf dem Stuhl sitzt, ist ein falscher Prophet, der den Verstand der Diener Gottes zugrunde richtet – den der Unentschlossenen, nicht den der Treuen.«'
  to: '1. Er zeigte mir Menschen, die auf einer Bank saßen, und einen anderen Menschen, der auf einem Stuhl saß. Da sagte er zu mir: »Siehst du die, die auf der Bank sitzen?« »Ich sehe sie, Herr«, sagte ich. »Diese«, sagte er, »sind Gläubige; der aber, der auf dem Stuhl sitzt, ist ein falscher Prophet, der das Denken der Diener Gottes zugrunde richtet, nämlich das der Zwiespältigen, nicht das der Gläubigen.«'
  rationale: Die Revision präzisiert die zentralen Personenbezeichnungen gemäß dem griechischen Kontrast πιστοί/δίψυχοι und macht die syntaktische Reichweite von »zugrunde richtet« im Deutschen eindeutig. Sie bewahrt dabei die Aussage, dass das Denken der zwiespältigen Diener Gottes, nicht aber das der Gläubigen, geschädigt wird.
