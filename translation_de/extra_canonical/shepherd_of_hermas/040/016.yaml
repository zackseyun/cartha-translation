base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: de
  text: '20. Nimm nun die Kraft, die von oben kommt. Ein Hagelkorn ist ein ganz kleines Körnchen; wenn es aber auf den Kopf eines Menschen fällt, wie viel Schmerz verursacht es! Oder nimm wieder einen Tropfen, der vom Dachziegel auf die Erde fällt: Er durchbohrt den Stein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: Betrachte / nimm
  rationale: Das Verb fordert dazu auf, die folgenden Beispiele gedanklich heranzuziehen. Beim ersten Vorkommen klingt „Betrachte“ im Deutschen natürlich, beim zweiten passt das konkrete „nimm“.
- source_word: ἡ χάλαζα ... κοκκάριον
  choice: Ein Hagelkorn ist winzig
  rationale: Gemeint ist ein einzelnes kleines Hagelkorn. Die idiomatische Form bewahrt den Größenkontrast, ohne das griechische Prädikatsnomen mechanisch wiederzugeben.
- source_word: πόνον παρέχει
  choice: wie weh tut es
  rationale: Gibt die rhetorische Frage natürlich und verständlich wieder; πόνος bezeichnet hier den verursachten Schmerz.
- source_word: ἀπὸ τοῦ κεράμου
  choice: vom Dachziegel
  rationale: κέραμος bezeichnet hier im Zusammenhang des herabfallenden Tropfens einen Dachziegel beziehungsweise das Ziegeldach.
- source_word: τρυπᾷ τὸν λίθον
  choice: Er höhlt den Stein aus
  rationale: Bewahrt das Bild eines wiederholt fallenden Tropfens, der den Stein durch seine Wirkung aushöhlt beziehungsweise durchbohrt.
theological_decisions:
- issue: Beispiel für die von oben kommende Kraft
  choice: Die bildhafte Argumentation wird ohne zusätzliche theologische Deutung wiedergegeben.
  alternative: „Kraft Gottes“ ausdrücklich ergänzen
  rationale: Der unmittelbare griechische Text sagt lediglich „die Kraft, die von oben kommt“; die Erklärung als göttlicher Geist folgt im nächsten Absatz und sollte hier nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Bewegung. Die anschaulichen Naturbilder bleiben knapp und alltagssprachlich verständlich.
