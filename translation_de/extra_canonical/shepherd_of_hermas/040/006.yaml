  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: de
  text: 6 Der Geist aber, der befragt wird und nach den Wünschen der Menschen redet, ist irdisch und von geringem Gewicht; er hat keine Kraft und redet überhaupt nicht, wenn er nicht befragt wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: das Geistwesen
  rationale: Hier bezeichnet πνεῦμα ein redendes, befragtes übernatürliches Wesen beziehungsweise einen wirksamen Geist. „Geistwesen“ vermeidet im Deutschen die mögliche Verwechslung mit der menschlichen Gesinnung.
- source_word: ἐπερωτώμενον
  choice: das befragt wird
  rationale: Gibt das passive Partizip direkt wieder und wahrt den Gegensatz zum Geist von Gott, der nach dem Kontext aus eigenem Antrieb redet.
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: nach den Wünschen der Menschen
  rationale: ἐπιθυμίαι kann Begierden oder Wünsche bezeichnen; hier geht es darum, dass der falsche Geist den Erwartungen seiner Fragesteller entspricht. „Wünsche“ ist natürlich und lässt den negativen Kontext wirken.
- source_word: ἐπίγειον
  choice: irdisch
  rationale: Direkte und kontextgerechte Wiedergabe des Gegensatzes zum Geist, der von oben beziehungsweise von Gott kommt.
- source_word: ἐλαφρόν
  choice: oberflächlich
  rationale: Wörtlich „leicht“; im Kontext bezeichnet es mangelndes Gewicht und fehlende Substanz. „Oberflächlich“ vermittelt dies im modernen Deutsch, ohne das folgende „ohne Kraft“ zu verdoppeln.
- source_word: δύναμιν μὴ ἔχον
  choice: es hat keine Kraft
  rationale: Bewahrt die wiederkehrende Aussage über das Fehlen geistlicher Wirkmacht in klarer deutscher Syntax.
- source_word: ὅλως οὐ λαλεῖ
  choice: redet überhaupt nicht
  rationale: Gibt die emphatische Verneinung präzise und idiomatisch wieder.
theological_decisions:
- issue: Identität von πνεῦμα
  choice: Geistwesen
  alternative: Geist
  rationale: Der Text spricht dem πνεῦμα eigenständiges Reden und Reagieren auf Befragung zu. Die Übersetzung legt nicht fest, ob es als Dämon, prophetische Inspiration oder andere geistige Macht systematisch einzuordnen ist.
- issue: Qualität von ἐλαφρόν
  choice: oberflächlich
  alternative: leichtfertig / leicht
  rationale: „Oberflächlich“ bringt die fehlende Substanz zur Sprache, ohne eine spezifische moralpsychologische Deutung wie „leichtfertig“ aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die adversative Struktur und die dreifache Charakterisierung des falschen Geistes — irdisch, substanzlos, kraftlos — bleiben erhalten.
