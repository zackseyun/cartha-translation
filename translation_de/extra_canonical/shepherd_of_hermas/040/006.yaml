  - severity: low
    issue: „oberflächlich“ für ἐλαφρόν
    rationale: „Oberflächlich“ deutet auf eine bestimmte Charaktereigenschaft. Das Bild von „leicht“ hebt eher Gewichtlosigkeit beziehungsweise fehlende Substanz hervor.
