  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: de
  text: '19. »Wie kann das geschehen, Herr? Du hast doch gesagt, dass beides unmöglich ist«, fragte ich. Er sagte: »Wie diese Dinge unmöglich sind, so sind auch die irdischen Geister machtlos[a] und untätig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dasselbe griechische Wort bedeutet zuvor »unmöglich« und hier auch »machtlos« oder »unfähig«.
    reason: Die Wortwiederholung und das Wortspiel des griechischen Textes lassen sich im Deutschen nicht zugleich natürlich und eindeutig wiedergeben.
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird im Deutschen knapp und würdig wiedergegeben.
- source_word: ἀδύνατα
  choice: unmöglich / machtlos
  rationale: Das griechische Wort bezeichnet je nach Bezug sowohl das Unmögliche als auch das Kraft- oder Machtlose. Die wechselnde Wiedergabe bewahrt den Gedankengang im natürlichen Deutschen.
- source_word: ἀδρανῆ
  choice: unwirksam
  rationale: Das Wort bezeichnet hier etwas Untätiges beziehungsweise Wirkungsloses; »unwirksam« passt zum Gegensatz zur von oben kommenden Kraft.
- source_word: τὰ πνεύματα τὰ ἐπίγεια
  choice: die irdischen Geister
  rationale: Die formnahe Wiedergabe erhält den im Abschnitt aufgebauten Gegensatz zwischen irdischem und göttlichem Geist.
theological_decisions:
- issue: Art und Wirksamkeit der irdischen Geister
  choice: »machtlos und unwirksam«
  alternative: »unmöglich und untätig«
  rationale: Der Text bestreitet in diesem Zusammenhang nicht zwingend ihre Existenz, sondern stellt ihre fehlende Kraft und Wirkung der von oben kommenden Kraft gegenüber. Die Mehrdeutigkeit von ἀδύνατα wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Dialogton. Das Präsens φημί wird im erzählenden Zusammenhang idiomatisch als »fragte ich« wiedergegeben; die direkte Rede und die begriffliche Spannung des Originals bleiben erhalten.
