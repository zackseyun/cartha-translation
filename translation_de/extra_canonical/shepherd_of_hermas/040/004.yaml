revisions:
- from: 4 Deshalb schließen sich alle, die im Glauben an den Herrn stark sind und die Wahrheit angezogen haben, solchen Geistern nicht an, sondern halten sich von ihnen fern. Die aber unentschlossen sind und immer wieder bereuen, suchen wie die Völker durch Wahrsagerei Auskunft und laden durch ihren Götzendienst noch größere Sünde auf sich. Denn wer einen falschen Propheten wegen irgendeiner Sache befragt, ist ein Götzendiener, leer an Wahrheit und unverständig.
  to: 4 Deshalb schließen sich alle, die im Glauben an den Herrn stark sind und die Wahrheit angezogen haben, solchen Geistern nicht an, sondern halten sich von ihnen fern. Die aber zwiespältig sind und immer wieder bereuen, betreiben wie die Völker Wahrsagerei und laden sich, indem sie Götzendienst treiben, eine noch größere Sünde auf. Denn wer einen falschen Propheten wegen irgendeiner Sache befragt, ist ein Götzendiener, ohne Wahrheit und töricht.
  rationale: Die Überarbeitung präzisiert die drei semantisch auffälligen Stellen δίψυχοι, μαντεύονται und κενὸς ἀπὸ τῆς ἀληθείας. Sie bewahrt die griechische Satzlogik, die Bekleidungsmetapher für Wahrheit sowie die im Text selbst vertretene Verbindung von Orakelbefragung und Götzendienst. Die offene Weite von περὶ πράξεώς τινος bleibt mit „wegen irgendeiner Sache“ bestehen.
