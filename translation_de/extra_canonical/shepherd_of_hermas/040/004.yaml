  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: de
  text: 4 Deshalb schließen sich alle, die im Glauben an den Herrn stark sind und die Wahrheit angezogen haben, solchen Geistern nicht an, sondern halten sich von ihnen fern. Die aber zwiespältig sind und immer wieder bereuen, betreiben wie die Völker Wahrsagerei und laden sich, indem sie Götzendienst treiben, eine noch größere Sünde auf. Denn wer einen falschen Propheten wegen irgendeiner Sache befragt, ist ein Götzendiener, ohne Wahrheit und töricht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι
  choice: unentschlossen
  rationale: Wörtlich etwa „doppelseelig/zweigespalten“; gemeint sind innerlich geteilte, schwankende Menschen. „Unentschlossen“ gibt dies in natürlichem modernem Deutsch wieder, ohne eine Fachprägung einzuführen.
- source_word: πυκνῶς μετανοοῦσι
  choice: immer wieder bereuen
  rationale: πυκνῶς bezeichnet häufiges oder wiederholtes Handeln. „Bereuen“ bewahrt hier die Spannung, dass die wiederholte Reue offenbar nicht zu beständiger Umkehr führt.
- source_word: μαντεύονται
  choice: suchen … durch Wahrsagerei Auskunft
  rationale: Das Medium bezeichnet das Einholen von Orakeln bzw. divinatorischer Auskunft; die Formulierung macht die Handlung im Deutschen eindeutig.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Formale Wiedergabe des frühchristlichen Ausdrucks für die nichtjüdischen bzw. heidnischen Nationen; der Kontext der Wahrsagerei verdeutlicht die negative Vergleichsfunktion.
- source_word: περὶ πράξεώς τινος
  choice: wegen irgendeiner Sache
  rationale: πρᾶξις kann Handlung, Vorhaben oder Angelegenheit bedeuten. Die weitere Formulierung wahrt den breiten Bezug.
- source_word: ἄφρων
  choice: unverständig
  rationale: Dignified modern equivalent for a person lacking sound judgment; less colloquial and less insulting than „dumm“.
theological_decisions:
- issue: Beziehung zwischen Wahrsagerei und Götzendienst
  choice: „laden durch ihren Götzendienst noch größere Sünde auf sich“
  alternative: „laden größere Sünde auf sich, indem sie Götzendienst treiben“
  rationale: Das Partizip εἰδωλολατροῦντες wird modal bzw. begleitend wiedergegeben. Die Aussage des Textes, dass die Befragung des falschen Propheten als Götzendienst gilt, bleibt ausdrücklich bestehen.
- issue: „die Wahrheit angezogen haben“ als Bekleidungsmetapher
  choice: Metapher beibehalten
  alternative: „von Wahrheit erfüllt sind“
  rationale: ἐνδεδυμένοι τὴν ἀλήθειαν verwendet bewusst das Bild des Anziehens. Die formnahe Wiedergabe vermeidet eine interpretierende Auflösung.
- issue: Wiederholte Reue der innerlich Geteilten
  choice: „immer wieder bereuen“
  alternative: „häufig umkehren“
  rationale: μετανοέω kann bereuen oder umkehren bedeuten. Im polemischen Zusammenhang beschreibt es offenbar instabile Reue; „bereuen“ bewahrt die Spannung, ohne echte Umkehr kategorisch abzusprechen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen; die Bekleidungsmetapher und die scharfe Gleichsetzung von Orakelbefragung mit Götzendienst bleiben erhalten.
