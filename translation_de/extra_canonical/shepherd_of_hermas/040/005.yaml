  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Aussagen des Griechischen zuverlässig wieder: πᾶν πνεῦμα ἀπὸ Θεοῦ δοθέν („kein Geist, der von Gott gegeben ist“), οὐκ ἐπερωτᾶται („lässt sich [nicht] befragen“), ἔχον τὴν δύναμιν τῆς θεότητος („hat die Kraft der Gottheit“), ἀφ’ ἑαυτοῦ λαλεῖ πάντα („redet alles von sich aus“) sowie ἄνωθεν ... ἀπὸ τῆς δυνάμεως τοῦ θείου πνεύματος („von oben ... aus der Kraft des göttlichen Geistes“). Die englische POB-Fassung wird inhaltlich vollständig getroffen.'
