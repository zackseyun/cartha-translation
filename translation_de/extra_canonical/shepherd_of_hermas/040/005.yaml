  terminology: „Gottheit“ entspricht θεότης präzise; „göttlicher Geist“ und „von oben“ bewahren die Terminologie und den Kontrast des Abschnitts. „Von sich aus“ ist sachgerecht, ohne die göttliche Herkunft des Geistes zu leugnen oder erklärend umzuformen.
