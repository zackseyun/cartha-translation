base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: de
  text: 5. Denn kein Geist, der von Gott gegeben ist, lässt sich befragen; vielmehr hat er die Kraft der Gottheit und redet alles von sich aus, weil er von oben ist, aus der Kraft des göttlichen Geistes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτᾶται
  choice: lässt sich befragen
  rationale: Das Passiv bezeichnet hier, dass der echte Gottesgeist nicht auf menschliche Befragung hin Auskunft erteilt. Die reflexive deutsche Form ist natürlich und bewahrt den Gegensatz zum folgenden selbstständigen Reden.
- source_word: τὴν δύναμιν τῆς θεότητος
  choice: die Kraft der Gottheit
  rationale: Eine formnahe Wiedergabe, die den anspruchsvollen theologischen Ausdruck des griechischen Textes nicht abschwächt.
- source_word: ἀφ’ ἑαυτοῦ λαλεῖ πάντα
  choice: redet alles von sich aus
  rationale: Bewahrt die Aussage, dass der Geist ohne vorgängige Befragung redet; ‚von sich aus‘ bezeichnet hier selbsttätiges Reden und nicht eine von Gott unabhängige Quelle.
- source_word: ἄνωθέν
  choice: von oben
  rationale: Gibt die räumlich-theologische Herkunftsangabe unmittelbar wieder und erhält den Kontrast zu den später genannten irdischen Geistern.
theological_decisions:
- issue: Verhältnis zwischen dem Reden ‚von sich aus‘ und der Herkunft aus Gottes Geist
  choice: 'Die Spannung wird wörtlich-nah bewahrt: Der Geist redet ‚von sich aus‘, ist aber ‚von oben‘ und aus der Kraft des göttlichen Geistes.'
  alternative: ‚Er redet aus eigener Initiative alles, was Gott ihm eingibt.‘
  rationale: Die Alternative würde die Aussage erklärend harmonisieren und einen Gedanken hinzufügen, der in diesem Satz nicht ausdrücklich steht.
- issue: Wiedergabe von θεότης
  choice: Gottheit
  alternative: göttliches Wesen
  rationale: ‚Gottheit‘ entspricht dem griechischen Abstraktum genauer und vermeidet eine unnötige interpretierende Umschreibung.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der Satzbau bleibt dem argumentativen Gegensatz des Griechischen nahe, wird aber durch ‚vielmehr‘ für heutige Leser klar gegliedert.
