revisions:
- from: 9. Wenn nun der Mensch, der den göttlichen Geist hat, in eine Versammlung gerechter Männer kommt, die an den göttlichen Geist glauben, und die Versammlung dieser Männer Fürbitte bei Gott einlegt, dann erfüllt der Engel des prophetischen Geistes, der ihm beigegeben ist, den Menschen. Vom Heiligen Geist erfüllt, spricht der Mensch zur versammelten Menge, wie der Herr es will.
  to: 9. Wenn nun der Mensch, der den göttlichen Geist hat, in eine Versammlung gerechter Männer kommt, die an den göttlichen Geist glauben, und die Versammlung dieser Männer zu Gott betet, dann erfüllt der Engel des prophetischen Geistes, der ihm beigegeben ist, den Menschen. Vom Heiligen Geist erfüllt, spricht der Mensch zur versammelten Menge, wie der Herr es will.
  rationale: Die einzige notwendige Änderung ersetzt die zu enge Bezeichnung „Fürbitte“ durch die allgemeinere und im Deutschen natürliche Formulierung „zu Gott betet“. Der Sinn, die Satzfolge sowie die textliche Unterscheidung von göttlichem Geist, Engel des prophetischen Geistes und Heiligem Geist bleiben unverändert.
