base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: de
  text: 9. Wenn nun der Mensch, der den göttlichen Geist hat, in eine Versammlung gerechter Männer kommt, die an den göttlichen Geist glauben, und die Versammlung dieser Männer zu Gott betet, dann erfüllt der Engel des prophetischen Geistes, der ihm beigegeben ist, den Menschen. Vom Heiligen Geist erfüllt, spricht der Mensch zur versammelten Menge, wie der Herr es will.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγή
  choice: Versammlung
  rationale: Bezeichnet hier die Zusammenkunft der Gerechten, ohne notwendig eine institutionelle Synagoge zu meinen.
- source_word: ἔντευξις
  choice: Fürbitte
  rationale: Gibt das an Gott gerichtete gemeinschaftliche Bitten präzise und natürlich wieder.
- source_word: ὁ κείμενος πρὸς αὐτόν
  choice: der ihm beigegeben ist
  rationale: Bewahrt den Gedanken einer dem Propheten zugeordneten geistlichen Gegenwart, ohne die schwerfällige räumliche Grundbedeutung wörtlich nachzubilden.
- source_word: εἰς τὸ πλῆθος
  choice: zur versammelten Menge
  rationale: Macht im Deutschen deutlich, dass der Geistbegabte zur anwesenden Gemeinschaft spricht.
theological_decisions:
- issue: Verhältnis von göttlichem Geist, Engel des prophetischen Geistes und Heiligem Geist
  choice: Die drei Ausdrücke werden jeweils ausdrücklich und ohne Harmonisierung wiedergegeben.
  alternative: Die Bezeichnungen vereinheitlichen oder den Engel als bloße Umschreibung des Heiligen Geistes verstehen.
  rationale: Der griechische Text verwendet unterschiedliche Formulierungen und erklärt ihr Verhältnis nicht abschließend; diese Spannung soll erhalten bleiben.
- issue: πίστιν θείου πνεύματος
  choice: die an den göttlichen Geist glauben
  alternative: die den Glauben des göttlichen Geistes haben
  rationale: Der Genitiv ist knapp und potenziell mehrdeutig. Im Kontext ist der objektive Bezug auf den göttlichen Geist am natürlichsten, während die alternative formale Wiedergabe im Deutschen unklar und missverständlich wäre.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die Abfolge von Versammlung, Fürbitte, Erfüllung und prophetischem Reden bleibt erhalten.
