  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/013.yaml
  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: de
  text: 13 Dann nähert er sich überhaupt keiner Versammlung gerechter Menschen, sondern meidet sie. Er hält sich an die Zwiespältigen und die Leeren, weissagt ihnen abseits und täuscht sie, indem er ihnen alles ganz nach ihren Wünschen inhaltslos vorredet; denn auch den Leeren gibt er Antwort. Denn ein leeres Gefäß, das mit leeren Gefäßen zusammengestellt wird, zerbricht nicht, sondern sie stimmen miteinander überein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι
  choice: die Unentschlossenen
  rationale: Das Wort bezeichnet Menschen mit geteilter innerer Ausrichtung, die im Glauben schwanken. „Unentschlossene“ gibt dies in natürlichem Deutsch wieder, ohne den ungewöhnlichen griechischen Ausdruck mechanisch nachzubilden.
- source_word: κενοί / κενῶς
  choice: innerlich Leere / nur leere Worte
  rationale: Die wiederholte Leerheitsmetapher des griechischen Textes bleibt erhalten; bei κενῶς wird sie idiomatisch auf den Gehalt des Redens bezogen.
- source_word: κατὰ γωνίαν
  choice: im Verborgenen
  rationale: Wörtlich „in einer Ecke“; gemeint ist eine abseitige, nicht öffentliche Tätigkeit außerhalb der Versammlung. „Im Verborgenen“ vermittelt diese Funktion natürlich.
- source_word: κολλᾶται
  choice: hält sich an
  rationale: Gibt das enge Sich-Anschließen wieder, ohne die im Deutschen hier unnatürliche wörtliche Form „klebt an“.
- source_word: συμφωνοῦσιν ἀλλήλοις
  choice: sie stimmen miteinander überein
  rationale: Bewahrt die Aussage gegenseitiger Entsprechung beziehungsweise Harmonie der gleichartig leeren Gefäße.
theological_decisions:
- issue: Bedeutung von δίψυχοι
  choice: die Unentschlossenen
  alternative: die Zwiespältigen / Doppelherzigen
  rationale: Der Kontext beschreibt schwankende Menschen, die den falschen Propheten befragen. Die gewählte Form vermeidet die mögliche moralische Verengung von „Doppelherzigen“, lässt aber die Instabilität ihrer Haltung erkennen.
- issue: Öffentliches oder heimliches Weissagen
  choice: weissagt ihnen im Verborgenen
  alternative: weissagt ihnen in einer Ecke
  rationale: Der Gegensatz zur Versammlung der Gerechten deutet auf eine abseitige, private Praxis. Die Übersetzung wahrt diesen Gegensatz, ohne über den Text hinaus eine bestimmte institutionelle Form festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung des Motivs der Leere und das Gefäßbild wurden bewahrt; die Satzführung wurde für heutige Leser leicht geglättet.
