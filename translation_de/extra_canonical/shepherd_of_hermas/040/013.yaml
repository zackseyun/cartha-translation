    issue: δίψυχοι mit „Unentschlossenen“ wiedergegeben
    rationale: Das Wort bezeichnet hier nicht nur unentschiedene Personen, sondern eine geteilte, im Glauben schwankende Haltung. „Zwiespältige“ wahrt diese Nuance besser.
  - severity: low
    issue: κατὰ γωνίαν als „im Verborgenen“
    rationale: Die Formulierung kann geheimes Handeln implizieren. Der griechische Ausdruck bezeichnet zunächst eine abseitige bzw. private Örtlichkeit; „abseits“ ist weniger interpretierend.
  - severity: low
    issue: κενῶς als „nur leere Worte“
    rationale: „Nur“ und die Beschränkung auf „Worte“ sind nicht ausdrücklich im Text. Eine Formulierung mit „inhaltslos“ gibt die adverbiale Aussage natürlich wieder und erhält den Bezug zur Leerheitsmetapher.
