  text: 10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.
translation:
  language: de
  text: '10. So wird der Geist der Gottheit offenbar werden. Was nun den Geist der Gottheit des Herrn betrifft: Das ist seine Kraft.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φανερὸν ἔσται
  choice: wird offenbar werden
  rationale: Gibt das futurische Prädikat formal und zugleich natürlich wieder.
- source_word: τὸ πνεῦμα τῆς θεότητος
  choice: der Geist der Gottheit
  rationale: Bewahrt die ungewöhnliche Genitivverbindung und vermeidet eine vorschnelle Gleichsetzung mit einer geläufigeren theologischen Formel.
- source_word: ἡ δύναμις αὕτη
  choice: Darin besteht seine Kraft
  rationale: Gibt den elliptischen griechischen Nominalsatz verständlich wieder und bezieht αὕτη auf die zuvor beschriebene Wirkungsweise.
theological_decisions:
- issue: Bezug von τοῦ Κυρίου in der Wendung περὶ τοῦ πνεύματος τῆς θεότητος τοῦ Κυρίου
  choice: „der Geist der Gottheit des Herrn“
  alternative: „der göttliche Geist des Herrn“
  rationale: Die gewählte Fassung bewahrt die gestufte Genitivkonstruktion des griechischen Textes und glättet sie nicht zu einer dogmatisch vertrauteren Bezeichnung.
- issue: Deutung des elliptischen Schlusssatzes
  choice: „Darin besteht seine Kraft“
  alternative: „So groß ist seine Kraft“
  rationale: ὅση kann auf Umfang oder Beschaffenheit weisen; im Kontext fasst der Satz die zuvor geschilderte Manifestation des Geistes als dessen Kraft zusammen. Die Fassung vermeidet eine nicht ausdrücklich genannte Größenangabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Geist der Gottheit“ bleibt wegen ihrer begrifflichen Bedeutung erhalten; der zweite Satz wird nur so weit ergänzt, wie es die griechische Ellipse für ein verständliches Deutsch erfordert.
