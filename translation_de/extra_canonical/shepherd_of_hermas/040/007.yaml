  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/007.yaml
  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: de
  text: '7. »Wie wird ein Mensch also, Herr, erkennen, wer von ihnen ein Prophet und wer ein falscher Prophet ist?«, fragte ich. Er sagte: »Höre, was ich dir über beide Propheten sagen werde. So wie ich es dir sagen werde, sollst du den Propheten und den falschen Propheten prüfen. Prüfe den Menschen, der den göttlichen Geist hat, an seinem Lebenswandel.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Die ehrerbietige Anrede wird in diesem frühchristlichen Dialog traditionell und würdig mit »Herr« wiedergegeben.
- source_word: περὶ ἀμφοτέρων τῶν προφητῶν
  choice: was über beide Arten von Propheten zu sagen ist
  rationale: Gemeint sind die unmittelbar genannten Kategorien Prophet und falscher Prophet; »beide Arten« macht diesen Bezug im Deutschen natürlich deutlich, ohne die Unterscheidung inhaltlich aufzulösen.
- source_word: δοκιμάσεις / δοκίμαζε
  choice: prüfen / Prüfe
  rationale: δοκιμάζω bezeichnet hier das unterscheidende Erproben beziehungsweise Beurteilen anhand eines Kennzeichens.
- source_word: ἀπὸ τῆς ζωῆς
  choice: an seinem Lebenswandel
  rationale: ζωή meint im Kontext nicht bloß biologisches Leben, sondern die gelebte Lebensführung als Kriterium der Prüfung.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: den göttlichen Geist
  rationale: Die attributive Formulierung wird eng am Griechischen wiedergegeben und wahrt die geisttheologische Sprache des Abschnitts.
theological_decisions:
- issue: Kriterium zur Unterscheidung wahrer und falscher Prophetie
  choice: »an seinem Lebenswandel« als ausdrückliches Prüfkriterium
  alternative: »nach seinem Leben«
  rationale: Die Übersetzung bewahrt die Aussage, dass sich göttliche Geistbegabung an der Lebensführung des Menschen prüfen lässt, ohne daraus eine umfassende Lehre über Prophetie abzuleiten.
- issue: Bezeichnung des Geistes
  choice: »der göttliche Geist«
  alternative: »der Geist Gottes« oder »der Heilige Geist«
  rationale: Das Griechische lautet hier τὸ πνεῦμα τὸ θεῖον. Die gewählte Form bleibt dieser Ausdrucksweise verpflichtet und identifiziert sie nicht stillschweigend mit einer stärker festgelegten Formulierung.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Der Dialogcharakter und die Wiederholung von »Prophet« und »falscher Prophet« bleiben erhalten. Keine Fußnoten erforderlich.
