base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/002.yaml
  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: de
  text: 2. Diese innerlich Zwiespältigen kommen also zu ihm wie zu einem Zauberer und fragen ihn, was wohl mit ihnen geschehen wird. Jener falsche Prophet aber, der keinerlei Kraft eines göttlichen Geistes in sich hat, redet mit ihnen ihren Fragen entsprechend [a] und füllt ihre Seelen so, wie sie selbst es wünschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Textzeugen ergänzen: »und den Begierden ihrer Bosheit entsprechend«.'
    reason: Die eingeklammerte griechische Wortgruppe ist textkritisch unsicher und wird deshalb nicht ohne Kennzeichnung in den Haupttext aufgenommen.
lexical_decisions:
- source_word: δίψυχοι
  choice: innerlich Zwiespältigen
  rationale: Gibt den wörtlichen Gedanken des »Doppelseelischen« in verständlichem modernem Deutsch wieder und bewahrt die im Werk wichtige Vorstellung innerer Unentschiedenheit.
- source_word: μάγον
  choice: Zauberer
  rationale: Entspricht dem antiken Begriff für einen Magier beziehungsweise Zauberkundigen, ohne ihn beschönigend als bloßen Wahrsager einzuengen.
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: was wohl mit ihnen geschehen wird
  rationale: Das abwägende ἄρα wird mit »wohl« wiedergegeben; die offene Zukunftsfrage bleibt erhalten.
- source_word: δύναμιν πνεύματος θείου
  choice: Kraft eines göttlichen Geistes
  rationale: Bewahrt die artikellose griechische Formulierung und legt sie nicht stillschweigend eindeutig auf den Heiligen Geist als Eigennamen fest.
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν
  choice: füllt ihre Seelen
  rationale: Erhält das kräftige Bild des griechischen Verbs, ohne einen nicht ausdrücklich genannten Inhalt zu ergänzen.
theological_decisions:
- issue: Bezug von πνεύματος θείου
  choice: eines göttlichen Geistes
  alternative: des göttlichen Geistes / des Heiligen Geistes
  rationale: Der griechische Ausdruck ist hier artikellos. Die Übersetzung wahrt diese sprachliche Offenheit und vermeidet eine überpräzise trinitarische Festlegung.
- issue: Charakterisierung der δίψυχοι
  choice: innerlich Zwiespältige
  alternative: Zweifler / Wankelmütige
  rationale: Die Wahl bewahrt die anthropologische Spannung des Ausgangsworts und reduziert sie weder allein auf intellektuellen Zweifel noch allein auf wechselhaftes Verhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für flüssiges Lesen leicht geglättet; zentrale Bilder und Mehrdeutigkeiten bleiben erhalten.
