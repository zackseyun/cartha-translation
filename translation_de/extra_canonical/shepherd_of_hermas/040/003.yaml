review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist gut getroffen, einschließlich der bewusst wiederholten Wortfamilie um κενός und der Einschränkung, dass der falsche Prophet nur einige wahre Worte spricht. Zwei Nuancen sollten genauer wiedergegeben werden: κενά bezeichnet zunächst „Leeres“ bzw. „leere Dinge“ und nicht ausdrücklich Worte; εἴ τινα δυνήσεται drückt eine offene Möglichkeit aus, nicht unmittelbar einen finalen Zweck.'
  naturalness: Der Text ist verständlich und würdevoll. „Denn weil“ ist jedoch im Deutschen unnötig doppelt begründend, und „um womöglich“ glättet die offene, vom Erfolg abhängige Formulierung des Griechischen zu stark in eine Zweckangabe.
  terminology: „Teufel“, „Geist“ und „die Gerechten“ sind angemessene, nicht konfessionell verengte Wiedergaben. Die Wiederholung von „leer“ sollte erhalten bleiben. „Leeres“ bewahrt dabei die absichtlich allgemeine Form von κενά besser als „leere Worte“.
  issues:
  - severity: low
    issue: Doppelte Begründung „Denn weil“
    rationale: 'γάρ begründet den Satz; das Partizip κενὸς ὤν lässt sich im Deutschen schlicht koordinierend wiedergeben: „Denn er ist leer ...“.'
  - severity: medium
    issue: „leeren Worten“ spezifiziert κενά
    rationale: κενά ist hier substantivisch und allgemein „leere Dinge/Leeres“. Der griechische Text sagt nicht ausdrücklich, dass es nur Worte sind; die allgemeine Form sollte bewahrt werden.
  - severity: medium
    issue: „um womöglich“ bei εἴ τινα δυνήσεται
    rationale: Die Wendung bedeutet „ob er vielleicht einige ... losreißen kann“ und stellt den möglichen Erfolg des Teufels offen dar. Eine finale Konstruktion kann diese Nuance abschwächen.
  revised_text: 3 Denn er ist leer und antwortet leeren Menschen mit Leerem. Was auch immer er gefragt wird, darauf antwortet er entsprechend der Leere des Menschen. Doch spricht er auch einige wahre Worte; denn der Teufel erfüllt ihn mit seinem eigenen Geist, ob er vielleicht einige der Gerechten losreißen kann.
