  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: de
  text: 3 Denn er ist leer und antwortet leeren Menschen mit Leerem. Was auch immer er gefragt wird, darauf antwortet er entsprechend der Leere des Menschen. Doch spricht er auch einige wahre Worte; denn der Teufel erfüllt ihn mit seinem eigenen Geist, ob er vielleicht einige der Gerechten losreißen kann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὸς / κενὰ / κενοῖς / κένωμα
  choice: leer / leere Worte / leere Menschen / Leere
  rationale: Die wiederholte Wortwurzel wird im Deutschen bewahrt, da das griechische Wortspiel die innere Gehaltlosigkeit des falschen Propheten, seiner Antworten und seiner Fragesteller hervorhebt.
- source_word: ῥήματα ἀληθῆ
  choice: wahre Worte
  rationale: Eine direkte und natürliche Wiedergabe, die nicht behauptet, seine gesamte Botschaft sei wahr.
- source_word: ῥῆξαι
  choice: loszureißen
  rationale: Das Verb bezeichnet hier ein gewaltsames Trennen oder Abbringen; „loszureißen“ bewahrt diese Bildhaftigkeit.
- source_word: τῶν δικαίων
  choice: von den Gerechten
  rationale: Die substantivische Bezeichnung bleibt erhalten und wird nicht konfessionell näher bestimmt.
theological_decisions:
- issue: Verhältnis wahrer Aussagen des falschen Propheten zu dämonischem Einfluss
  choice: „Doch spricht er auch einige wahre Worte; denn der Teufel erfüllt ihn mit seinem eigenen Geist“
  alternative: Die wahren Worte als Ausnahme vom oder Gegensatz zum Einfluss des Teufels darstellen
  rationale: Der griechische Text verbindet beides ausdrücklich kausal. Die Spannung, dass ein vom Teufel erfüllter falscher Prophet einzelne wahre Aussagen machen kann, wird nicht abgeschwächt.
- issue: Ziel des dämonischen Wirkens
  choice: „um womöglich einige von den Gerechten loszureißen“
  alternative: „falls er einige der Gerechten vernichten kann“
  rationale: Der Optativgedanke von εἴ τινα δυνήσεται und die Bildlichkeit von ῥῆξαι werden als beabsichtigter, aber nicht sicher erfolgreicher Versuch wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung von „leer“ ist bewusst beibehalten, obwohl sie stilistisch markant wirkt, weil sie die rhetorische Struktur des griechischen Textes trägt.
