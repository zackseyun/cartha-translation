revisions:
- from: 3 Denn weil er selbst leer ist, antwortet er leeren Menschen mit leeren Worten. Was immer man ihn fragt, beantwortet er entsprechend der Leere des Menschen. Doch spricht er auch einige wahre Worte; denn der Teufel erfüllt ihn mit seinem eigenen Geist, um womöglich einige von den Gerechten loszureißen.
  to: 3 Denn er ist leer und antwortet leeren Menschen mit Leerem. Was auch immer er gefragt wird, darauf antwortet er entsprechend der Leere des Menschen. Doch spricht er auch einige wahre Worte; denn der Teufel erfüllt ihn mit seinem eigenen Geist, ob er vielleicht einige der Gerechten losreißen kann.
  rationale: Die Revision erhält das griechische Wortspiel um „leer“ konsequent und vermeidet zugleich eine nicht ausdrücklich im Ausgangstext enthaltene Einschränkung auf „Worte“. Die Schlussformulierung gibt die vom Erfolg abhängige Möglichkeit in εἴ τινα δυνήσεται unmittelbar wieder. Inhalt, Register und die ambivalente Aussage über einzelne wahre Worte bleiben erhalten.
  reviewer_model: gpt-5.6-terra
