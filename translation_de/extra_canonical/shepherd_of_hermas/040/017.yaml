base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: de
  text: '21 Du siehst also: Selbst die kleinsten Dinge, die von oben auf die Erde fallen, haben große Kraft. Ebenso ist auch der göttliche Geist, der von oben kommt, mächtig. Diesem Geist vertraue; von dem anderen aber halte dich fern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν ἐλάχιστα
  choice: selbst die kleinsten Dinge, die von oben …
  rationale: Bewahrt den Vergleich mit Hagelkorn und Wassertropfen aus dem unmittelbaren Kontext und gibt den substantivierten griechischen Ausdruck natürlich wieder.
- source_word: μεγάλην δύναμιν ἔχει
  choice: haben große Kraft
  rationale: Gibt δύναμις direkt und verständlich wieder, ohne die Aussage als bloße Wirkung abzuschwächen.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: der göttliche Geist
  rationale: Entspricht der bestimmten griechischen Wortgruppe und wahrt ihre theologische Offenheit.
- source_word: δυνατόν ἐστι
  choice: ist … mächtig
  rationale: Erhält die Wortverbindung zu δύναμις, klingt im Deutschen aber idiomatischer als »kraftvoll«.
- source_word: πίστευε
  choice: vertraue
  rationale: Im Kontext der Unterscheidung wahrer und falscher Geister bezeichnet das Verb ein vertrauendes Sich-Halten an den göttlichen Geist.
- source_word: ἀπέχου
  choice: halte dich fern
  rationale: Gibt den anhaltenden Abstand vom anderen, irdischen Geist klar und natürlich wieder.
theological_decisions:
- issue: Bezug von »diesem Geist« und »dem anderen«
  choice: Die demonstrativen Bezüge bleiben ausdrücklich als »diesem Geist« und »dem anderen« stehen.
  alternative: »Vertraue dem göttlichen Geist und meide den irdischen Geist.«
  rationale: Die gewählte Fassung folgt der rhetorischen Form des Griechischen und lässt den Rückbezug auf die zuvor beschriebenen Geister bestehen, ohne zusätzliche Benennungen einzutragen.
- issue: Wiedergabe von πνεῦμα
  choice: »Geist« mit kleinem Adjektiv in »der göttliche Geist«
  alternative: »der Geist Gottes« oder »der Heilige Geist«
  rationale: Der Ausgangstext sagt hier θεῖον, nicht ausdrücklich »Gottes« oder »heilig«; daher wird keine engere dogmatische Identifikation ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper paränetischer Schlusswendung. Die Bildsprache und die Wiederholung des Kraftmotivs aus dem griechischen Kontext bleiben erhalten.
