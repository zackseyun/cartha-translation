base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: de
  text: 8. Zunächst ist derjenige, der den göttlichen[a] Geist von oben hat, sanft, still und demütig. Er hält sich von allem Bösen und von der nichtigen Begierde dieser Welt fern und stellt sich selbst unter alle Menschen. Wird er befragt, so antwortet er niemandem etwas; auch redet er nicht im Privaten. Der Heilige Geist redet nämlich nicht dann, wenn ein Mensch will, dass er redet, sondern dann, wenn Gott will, dass er redet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort „göttlichen“ fehlt in einigen Textzeugen.
    reason: Textkritische Kennzeichnung des im Ausgangstext eingeklammerten τὸ θεῖον.
  - marker: b
    text: 'Das letzte „er“ kann sich grammatisch auf den Menschen beziehen: „wenn Gott will, dass der Mensch redet“.'
    reason: Bewahrt die mögliche Bezugsspannung zwischen dem Geist als Redendem und dem vom Geist erfüllten Menschen.
lexical_decisions:
- source_word: πραΰς
  choice: sanft
  rationale: Gibt die milde, nicht anmaßende Haltung im natürlichen modernen Deutsch wieder.
- source_word: ἡσύχιος
  choice: still
  rationale: Bewahrt den Sinn von ruhig und zurückhaltend, ohne völliges Schweigen zu behaupten.
- source_word: ταπεινόφρων
  choice: demütig
  rationale: Entspricht der inneren Haltung niedriger Selbsteinschätzung und ist allgemein verständlich.
- source_word: ἐπιθυμίας ματαίας τοῦ αἰῶνος τούτου
  choice: nichtigen Begierde dieser Welt
  rationale: Bewahrt Singular, Wertung und Gegenwartsweltbezug; vermeidet das unnatürliche „dieses Zeitalters“.
- source_word: ἐνδεέστερον ποιεῖ
  choice: macht sich geringer
  rationale: Gibt die vergleichende Selbsterniedrigung wieder, ohne materielle Bedürftigkeit in den Vordergrund zu rücken.
- source_word: κατὰ μόνας
  choice: im Verborgenen
  rationale: Bezeichnet hier privates, abgesondertes Reden im Gegensatz zum gemeinschaftlichen prophetischen Reden.
theological_decisions:
- issue: Bezeichnung des Geistes als θεῖον
  choice: „göttlichen Geist“ mit textkritischer Fußnote
  alternative: „Geist“ ohne Adjektiv
  rationale: Die Lesart steht im vorgelegten griechischen Text in eckigen Klammern; sie wird lesbar wiedergegeben, ihre Unsicherheit aber offengelegt.
- issue: Bezug des letzten αὐτόν in θελήσῃ αὐτὸν ὁ Θεὸς λαλῆσαι
  choice: Die pronominale Mehrdeutigkeit bleibt in „wenn Gott will, dass er redet“ erhalten
  alternative: „wenn Gott will, dass dieser Mensch redet“
  rationale: Das griechische Pronomen kann kontextuell auf den Menschen bezogen werden, während die unmittelbar vorausgehende Rede den Geist als Redenden nennt. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Satzgrenzen. „Still“ und „im Verborgenen“ halten den frühchristlichen Gegensatz zwischen zurückhaltendem Lebenswandel, privater Auskunft und von Gott ausgelöstem öffentlichem prophetischem Reden fest.
