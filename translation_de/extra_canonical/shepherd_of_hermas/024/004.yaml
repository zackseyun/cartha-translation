  to: Darum höre nicht auf, den Heiligen ins Ohr zu reden. Ihr habt auch ein Bild der kommenden großen Bedrängnis. Wenn ihr aber wollt, wird es nichts sein. Erinnert euch an das, was zuvor geschrieben wurde.
