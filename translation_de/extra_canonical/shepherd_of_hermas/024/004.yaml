review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Gedankengang und bewahrt den im Griechischen vorhandenen Wechsel vom singularischen Imperativ („μὴ διαλίπῃς“) zum pluralischen „ihr“. Bei „οὐδὲν ἔσται“ legt „wird sie nichts sein“ jedoch durch das feminine Pronomen die kommende Bedrängnis als Bezug fest, obwohl das griechische Neutrum keinen ausdrücklichen Bezug nennt. Die Formulierung sollte diese Offenheit bewahren.
  naturalness: „Den Heiligen ins Ohr reden“ ist verständlich und als bildhafte Wendung gut vertretbar. „Bild der kommenden großen Bedrängnis“ ist für τύπος im visionären Zusammenhang etwas unmittelbarer und weniger deutend als „Sinnbild“.
  terminology: „Heilige“, „Bedrängnis“ und „zuvor geschrieben“ sind angemessen. „Bild“ gibt τύπος hier als vor Augen gestellte Darstellung wieder, ohne eine spezifische theologische Deutung einzutragen.
  issues:
  - severity: medium
    issue: Der Bezug von „wird sie nichts sein“ ist gegenüber dem griechischen Text verengt.
    rationale: οὐδὲν ist Neutrum und enthält kein feminin referierendes Pronomen. Die deutsche Fassung sollte nicht entscheiden, ob unmittelbar die Bedrängnis oder der nicht weiter erläuterte Sachverhalt gemeint ist.
  - severity: low
    issue: „Sinnbild“ deutet τύπος stärker als Symbol.
    rationale: Im Kontext verweist τύπος auf die zuvor geschilderte visionäre Darstellung der kommenden Bedrängnis. „Bild“ bewahrt dies neutraler.
  revised_text: Darum höre nicht auf, den Heiligen ins Ohr zu reden. Ihr habt auch ein Bild der kommenden großen Bedrängnis. Wenn ihr aber wollt, wird es nichts sein. Erinnert euch an das, was zuvor geschrieben wurde.
  revised_footnotes: []
