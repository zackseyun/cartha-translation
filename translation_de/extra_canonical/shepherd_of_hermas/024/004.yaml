  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: de
  text: Darum höre nicht auf, den Heiligen ins Ohr zu reden. Ihr habt auch ein Bild der kommenden großen Bedrängnis. Wenn ihr aber wollt, wird es nichts sein. Erinnert euch an das, was zuvor geschrieben wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς λαλῶν εἰς τὰ ὦτα
  choice: höre nicht auf, … ins Ohr zu reden
  rationale: Bewahrt sowohl den fortdauernden Imperativ als auch das anschauliche griechische Bild; im Deutschen bleibt die Wendung verständlich und eindringlich.
- source_word: τῶν ἁγίων
  choice: den Heiligen
  rationale: Die substantivierte Bezeichnung wird formal und ohne konfessionelle Einengung wiedergegeben.
- source_word: τύπον
  choice: Sinnbild
  rationale: Bezeichnet hier die visionäre Gestalt beziehungsweise veranschaulichende Darstellung der kommenden Bedrängnis; „Sinnbild“ ist natürlicher als „Typus“ und enger am Kontext als bloß „Beispiel“.
- source_word: θλίψεως
  choice: Bedrängnis
  rationale: Gibt Not, Druck und Drangsal wieder, ohne den Ausdruck vorschnell auf eine bestimmte endzeitliche Lehrbildung festzulegen.
- source_word: τὰ προγεγραμμένα
  choice: das, was zuvor geschrieben wurde
  rationale: Entspricht dem passiven Partizip und lässt offen, ob auf unmittelbar Vorausgeschriebenes oder auf frühere schriftliche Mahnungen verwiesen wird.
theological_decisions:
- issue: Bezug von οὐδὲν ἔσται („es/sie wird nichts sein“)
  choice: „wird sie nichts sein“, mit Rückbezug auf die kommende große Bedrängnis
  alternative: „wird nichts geschehen“ oder „wird es nichts sein“
  rationale: Der nächste ausdrücklich genannte Bezug ist die Bedrängnis. Die ungewöhnlich starke Aussage und ihre Spannung zur angekündigten Bedrängnis werden nicht erklärend abgeschwächt.
- issue: Bedingung ἐὰν δὲ ὑμεῖς θελήσητε
  choice: „Wenn ihr aber wollt“
  alternative: „Wenn ihr dazu bereit seid“
  rationale: Die direkte Willensaussage des Griechischen bleibt erhalten; es wird nicht ergänzt, worauf sich das Wollen konkret richtet.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Bildhaftigkeit. Der Numeruswechsel vom Singular („höre … auf“) zum Plural („ihr“) folgt dem griechischen Text und bleibt sichtbar.
