base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/005.yaml
  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: de
  text: Nachdem sie dies gesagt hatte, ging sie fort, und ich sah nicht, wohin sie gegangen war; denn es erhob sich ein Geräusch. Da wandte ich mich erschrocken um, weil ich dachte, das Tier komme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging sie fort
  rationale: Gibt die schlichte Bewegung des Weggehens natürlich und ohne zusätzliche Deutung wieder.
- source_word: ποίῳ τόπῳ ἀπῆλθεν
  choice: wohin sie gegangen war
  rationale: Natürliches modernes Deutsch für die wörtlichere Wendung „an welchen Ort sie gegangen war“.
- source_word: ψόφος
  choice: Geräusch
  rationale: Der griechische Ausdruck bezeichnet einen unbestimmten hörbaren Laut; „Geräusch“ bewahrt diese Offenheit.
- source_word: ἐπεστράφην εἰς τὰ ὀπίσω
  choice: wandte ich mich … um
  rationale: Idiomatiches Deutsch für das Sich-nach-hinten-Wenden.
- source_word: φοβηθείς
  choice: erschrocken
  rationale: Drückt die durch das Geräusch ausgelöste Furcht knapp und kontextgerecht aus.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: Bewahrt die neutrale Bezeichnung des visionären Wesens, ohne durch „Ungeheuer“ eine zusätzliche Wertung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die unbestimmte Art des Geräuschs und die subjektive Vermutung des Erzählers bleiben erhalten.
