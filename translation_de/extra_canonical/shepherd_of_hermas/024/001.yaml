base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: de
  text: 'Ich fragte sie nach den vier Farben, die das Tier auf dem Kopf hatte. Sie antwortete mir: »Schon wieder willst du solche Dinge allzu genau wissen.« »Ja, Herrin«, sagte ich. »Lass mich erkennen, was sie bedeuten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: Tier
  rationale: Die neutrale und im Kontext bildhafte Bezeichnung gibt das griechische Wort unmittelbar wieder, ohne es unnötig als »Ungeheuer« zu deuten.
- source_word: περίεργος
  choice: willst du … allzu genau wissen
  rationale: Hier bezeichnet das Wort eine tadelnd angesprochene Neugier beziehungsweise ein übermäßiges Nachforschen. Die idiomatische Wendung bewahrt diesen leichten Vorwurf.
- source_word: κυρία
  choice: Herrin
  rationale: Die respektvolle weibliche Anrede wird formal wiedergegeben und entspricht der Figurenbeziehung im Text.
- source_word: γνώρισόν μοι
  choice: Lass mich erkennen
  rationale: Die Formulierung wahrt den Aufforderungscharakter und die Bedeutung des Offenbarens beziehungsweise Erkennbar-Machens.
- source_word: τί ἐστιν ταῦτα
  choice: was sie bedeuten
  rationale: Im Zusammenhang fragt Hermas nach der Bedeutung der Farben, nicht bloß nach ihrer stofflichen Identität; die natürliche deutsche Formulierung macht den kontextuellen Sinn deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Dialogfluss. Der leichte Tadel in περίεργος bleibt erhalten, ohne ihn zu verschärfen. Tempuswechsel des griechischen Erzählstils wird im Deutschen idiomatisch als Vergangenheit wiedergegeben.
