revisions:
- from: 'Sie sagte: »Hör zu: Das Schwarze ist diese Welt, in der ihr lebt. Das Feuer- und Blutrote bedeutet, dass diese Welt durch Blut und Feuer zugrunde gehen muss. Der goldene Teil aber seid ihr, die ihr dieser Welt entronnen seid. Denn wie das Gold im Feuer geprüft und brauchbar wird, so werdet auch ihr durch sie geprüft.[a] Die nun standhalten und von ihm im Feuer geläutert werden, werden gereinigt werden. Wie das Gold seine Schlacke abstößt, so werdet auch ihr allen Kummer und alle Bedrängnis ablegen; ihr werdet gereinigt werden und für den Bau des Turmes brauchbar sein.«'
  to: 'Sie sagte: »Hör zu: Das Schwarze ist diese Welt, in der ihr lebt. Das Feuer- und Blutrote bedeutet, dass diese Welt durch Blut und Feuer zugrunde gehen muss. Der goldene Teil aber seid ihr, die ihr dieser Welt entronnen seid. Denn wie das Gold im Feuer geprüft wird und brauchbar wird, so werdet auch ihr in ihnen geprüft.[a] Diejenigen, die bleiben und von ihm verbrannt werden,[b] werden gereinigt werden. Wie das Gold seine Schlacke abstößt, so werdet auch ihr allen Kummer und alle Bedrängnis ablegen; ihr werdet gereinigt werden und für den Bau des Turmes brauchbar sein.«'
  rationale: Die Revision beschränkt sich auf sichere philologische Korrekturen. »In ihnen« gibt ἐν αὐτοῖς präzise wieder, ohne dessen unsicheren Bezug aufzulösen. »Von ihm verbrannt werden« gibt πυρωθέντες wieder, ohne die im folgenden Satzteil genannte Reinigung vorwegzunehmen. Die übrige Übersetzung bleibt erhalten, einschließlich der vorsichtigen Wiedergabe des Weltuntergangs und der zentralen Turmbaumetaphorik.
