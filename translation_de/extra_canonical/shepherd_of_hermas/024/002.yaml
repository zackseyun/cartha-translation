base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: de
  text: 'Sie sagte: »Hör zu: Das Schwarze ist diese Welt, in der ihr lebt. Das Feuer- und Blutrote bedeutet, dass diese Welt durch Blut und Feuer zugrunde gehen muss. Der goldene Teil aber seid ihr, die ihr dieser Welt entronnen seid. Denn wie das Gold im Feuer geprüft wird und brauchbar wird, so werdet auch ihr in ihnen geprüft.[a] Diejenigen, die bleiben und von ihm verbrannt werden,[b] werden gereinigt werden. Wie das Gold seine Schlacke abstößt, so werdet auch ihr allen Kummer und alle Bedrängnis ablegen; ihr werdet gereinigt werden und für den Bau des Turmes brauchbar sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in ihnen«. Worauf sich das Pronomen bezieht, ist im griechischen Text nicht eindeutig; wahrscheinlich sind Blut und Feuer oder die damit bezeichneten Bedrängnisse gemeint.'
    reason: Bewahrt die örtliche Formulierung ἐν αὐτοῖς und lässt ihren unsicheren Rückbezug offen.
  - marker: b
    text: 'Wörtlich: »die Bleibenden und von ihm Verbrannten«. Der Bezug von »ihm« ist unsicher; das griechische Wort bezeichnet zunächst Verbranntwerden beziehungsweise Erhitztwerden. Der griechische Text wechselt anschließend auffällig zur zweiten Person: »ihr werdet gereinigt werden«.'
    reason: Bewahrt die Mehrdeutigkeit von αὐτοῦ, trennt das Verbrennen von der nachfolgend genannten Reinigung und dokumentiert den Personenwechsel der Vorlage.
lexical_decisions:
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: das Feuer- und Blutrote
  rationale: Gibt die beiden farblichen Eigenschaften des Tieres knapp und natürlich wieder; πυροειδές bezeichnet feuerartiges beziehungsweise feuerrotes, αἱματῶδες blutartiges beziehungsweise blutrotes Aussehen.
- source_word: ἀπόλλυσθαι
  choice: zugrunde gehen muss
  rationale: Bewahrt die mediale/intransitive Möglichkeit des griechischen Infinitivs, ohne vorschnell einen ausdrücklich handelnden Zerstörer einzuführen.
- source_word: ἐκφυγόντες
  choice: dieser Welt entronnen
  rationale: Drückt das erfolgreiche Entkommen des Aoristpartizips aus und bewahrt die eschatologische Bildsprache.
- source_word: δοκιμάζεται
  choice: geprüft
  rationale: Bezeichnet die Erprobung von Gold im Feuer; der folgende Reinigungsgedanke entfaltet das Ergebnis dieser Prüfung.
- source_word: πυρωθέντες
  choice: im Feuer geläutert werden
  rationale: Verbindet das wörtliche Erhitztwerden mit der im Kontext ausdrücklich gemeinten Reinigung, ohne die Feuermetaphorik aufzugeben.
- source_word: σκωρίαν
  choice: Schlacke
  rationale: Der übliche und im Bild der Goldläuterung präzise deutsche Ausdruck.
- source_word: οἰκοδομὴν τοῦ πύργου
  choice: den Bau des Turmes
  rationale: Bewahrt das zentrale Turmbild des Werkes und gibt οἰκοδομή hier als Bauvorgang wieder.
theological_decisions:
- issue: Art des Untergangs der gegenwärtigen Welt
  choice: »durch Blut und Feuer zugrunde gehen muss«
  alternative: »mit Blut und Feuer vernichtet werden muss«
  rationale: Die gewählte Formulierung lässt offen, wer oder was den Untergang bewirkt, und erhält so die grammatische Zurückhaltung des Passivs/Mediums.
- issue: Bezug von αὐτοῖς und αὐτοῦ
  choice: Die wechselnden Pronomen werden als »durch sie« und »von ihm« wiedergegeben und nicht vereinheitlicht.
  alternative: Beide Bezüge ausdrücklich auf »Blut und Feuer« oder allein auf »das Feuer« festlegen
  rationale: Der griechische Text weist eine echte Spannung im Numerus und einen unsicheren Rückbezug auf. Die Übersetzung bewahrt diese Uneindeutigkeit statt sie theologisch oder redaktionell aufzulösen.
- issue: Reinigung in der Bedrängnis
  choice: Prüfung, Läuterung und Reinigung werden als aufeinander bezogene, aber unterscheidbare Aussagen wiedergegeben.
  alternative: Alle Begriffe einheitlich mit »reinigen« übersetzen
  rationale: 'So bleibt die Abfolge des Bildes erhalten: Erprobung im Feuer, Läuterung und schließlich Brauchbarkeit für den Turmbau.'
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Bildsprache. Die direkte Rede bleibt mündlich und verständlich; »entronnen«, »geläutert« und »Bedrängnis« tragen den frühchristlich-eschatologischen Ton, ohne altertümliche Satzbildung. Der in manchen Textzeugen beziehungsweise Editionen geklammerte Zusatz οἱ κατοικοῦντες wurde nicht in den Haupttext aufgenommen, da er syntaktisch schwierig ist und auch die konsultierte englische Schicht ihn auslässt.
