  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/003.yaml
  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: de
  text: Der weiße Teil aber steht für das kommende Zeitalter, in dem die von Gott Erwählten wohnen werden; denn die von Gott zum ewigen Leben Erwählten werden makellos und rein sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: der weiße Teil
  rationale: Gibt die Farbbezeichnung und μέρος schlicht und bildgerecht wieder; der Bezug ist der zuvor erwähnte Teil am Kopf des Tieres.
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: das kommende Zeitalter
  rationale: Bewahrt den eschatologischen Sinn von αἰών und vermeidet die Verengung auf die räumliche Bedeutung „Welt“.
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ
  choice: die von Gott Erwählten
  rationale: Natürliche deutsche Wiedergabe des Genitivs; sie wahrt Gottes Beziehung zur Erwählung.
- source_word: κατοικήσουσιν
  choice: wohnen werden
  rationale: Entspricht dem konkreten Verb κατοικέω und passt zum Bild des künftigen Zeitalters als Wohnbereich.
- source_word: ἄσπιλοι καὶ καθαροί
  choice: makellos und rein
  rationale: Bewahrt beide bedeutungsnahen, aber nicht völlig identischen Adjektive und damit ihre rhetorische Verstärkung.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: Gibt die Zielrichtung von εἰς idiomatisch wieder, ohne die genaue theologische Beziehung weiter auszudeuten.
theological_decisions:
- issue: Verhältnis von Erwählung, Reinheit und ewigem Leben
  choice: 'Die Satzstruktur bleibt kausal und zukunftsbezogen: Die zum ewigen Leben Erwählten werden makellos und rein sein.'
  alternative: Die Erwählten wohnen dort, weil sie bereits makellos und rein sind.
  rationale: Das griechische ἔσονται ist Futur. Die Übersetzung wahrt diese Zeitform und entscheidet nicht, ob Reinheit Voraussetzung, Folge oder Kennzeichen der Erwählung ist.
- issue: Bedeutung von αἰών
  choice: Zeitalter
  alternative: Welt
  rationale: „Zeitalter“ erhält den zeitlich-eschatologischen Kontrast zwischen dem gegenwärtigen und dem kommenden Äon, ohne ihn zu einer rein räumlichen Gegenwelt umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer eschatologischer Bildsprache. Die Wiederholung von „Erwählten“ bildet die Wiederaufnahme im Griechischen ab und vermeidet eine unnötige interpretierende Auflösung.
