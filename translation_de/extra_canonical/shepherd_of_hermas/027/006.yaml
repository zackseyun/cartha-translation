revisions:
- from: Wer also gibt, ist ohne Schuld. Denn den Dienst, den er vom Herrn zur Ausführung empfangen hat, hat er aufrichtig erfüllt, ohne zu unterscheiden, wem er geben und wem er nicht geben sollte. So wurde dieser aufrichtig erfüllte Dienst bei Gott ruhmvoll. Wer also Gott auf diese Weise aufrichtig dient, wird leben.
  to: Wer also gibt, ist ohne Schuld. Denn wie er vom Herrn den Dienst empfangen hat, ihn auszuführen, so hat er ihn ohne Vorbehalt ausgeführt, ohne zu unterscheiden, wem er geben oder nicht geben sollte. So ist dieser Dienst, der ohne Vorbehalt ausgeführt wurde, bei Gott zu Ehren gekommen. Wer also Gott auf diese Weise ohne Vorbehalt dient, wird leben.
  rationale: Die Revision ersetzt die im Kontext zu enge Wiedergabe „aufrichtig“ durch „ohne Vorbehalt“, das die durch „ohne zu unterscheiden“ konkretisierte Einfachheit bzw. Unvoreingenommenheit des Gebens ausdrückt. Außerdem wird die Bewertung des Dienstes bei Gott idiomatischer formuliert. Die knappe Lebensverheißung bleibt bewusst ohne zusätzliche eschatologische Präzisierung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Textes insgesamt zuverlässig wieder: Der Gebende ist schuldlos, weil er den vom Herrn empfangenen Dienst ohne Auswahl unter den Empfängern ausführt; der Dienst erhält bei Gott eine ehrenvolle Bewertung, und die abschließende Zukunftsaussage bleibt offen. Die Wiedergabe von ἁπλῶς mit „aufrichtig“ ist jedoch etwas zu eng, weil sie im heutigen Deutsch vor allem Wahrhaftigkeit bzw. Ehrlichkeit bezeichnet, während hier vorbehaltloses, nicht unterscheidendes Handeln gemeint ist.'
  naturalness: Die Formulierung „den Dienst ... zur Ausführung empfangen“ und besonders „bei Gott ruhmvoll“ wirken im modernen Standarddeutsch leicht sperrig. Eine kleine stilistische und semantische Anpassung verbessert die Lesbarkeit und erhält zugleich die Wiederholung des griechischen Begriffs für Dienst.
  terminology: „ohne Schuld“, „Dienst/dienen“, „ohne zu unterscheiden“ und „wird leben“ sind sachgerecht. Für ἁπλῶς ist „ohne Vorbehalt“ im vorliegenden Kontext präziser als „aufrichtig“. Für ἔνδοξος παρὰ τῷ Θεῷ ist „bei Gott zu Ehren gekommen“ idiomatischer und wahrt die ehrenvolle bzw. herrliche Wertung, ohne eine bestimmte theologische Deutung hinzuzufügen.
  issues:
  - severity: medium
    issue: ἁπλῶς wird wiederholt mit „aufrichtig“ wiedergegeben.
    rationale: „Aufrichtig“ legt im Deutschen primär Wahrhaftigkeit nahe. Der unmittelbare Zusatz μηθὲν διακρίνων erläutert hier vielmehr ein vorbehaltloses Geben ohne Auswahl. „Ohne Vorbehalt“ trifft diese Nuance besser.
  - severity: low
    issue: „bei Gott ruhmvoll“ ist ungewohnt formuliert.
    rationale: Die Wendung ist zwar verständlich, klingt aber nicht idiomatisch. „Bei Gott zu Ehren gekommen“ gibt ἔνδοξος παρὰ τῷ Θεῷ natürlich und ohne Sinnverlust wieder.
  revised_text: Wer also gibt, ist ohne Schuld. Denn wie er vom Herrn den Dienst empfangen hat, ihn auszuführen, so hat er ihn ohne Vorbehalt ausgeführt, ohne zu unterscheiden, wem er geben oder nicht geben sollte. So ist dieser Dienst, der ohne Vorbehalt ausgeführt wurde, bei Gott zu Ehren gekommen. Wer also Gott auf diese Weise ohne Vorbehalt dient, wird leben.
