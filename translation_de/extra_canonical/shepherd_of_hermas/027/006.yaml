base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: de
  text: Wer also gibt, ist ohne Schuld. Denn wie er vom Herrn den Dienst empfangen hat, ihn auszuführen, so hat er ihn ohne Vorbehalt ausgeführt, ohne zu unterscheiden, wem er geben oder nicht geben sollte. So ist dieser Dienst, der ohne Vorbehalt ausgeführt wurde, bei Gott zu Ehren gekommen. Wer also Gott auf diese Weise ohne Vorbehalt dient, wird leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῷος
  choice: ohne Schuld
  rationale: 'Gibt den forensisch-moralischen Sinn im Zusammenhang präzise und natürlich wieder: Der Gebende ist nicht für einen möglichen Missbrauch der Gabe verantwortlich.'
- source_word: διακονία / διακονῶν
  choice: Dienst / dient
  rationale: Bewahrt die Wortverbindung des griechischen Textes und umfasst sowohl den empfangenen Auftrag als auch dessen Ausführung.
- source_word: ἁπλῶς
  choice: aufrichtig
  rationale: Im Kontext bezeichnet das Wort ein argloses, vorbehaltloses Geben ohne prüfende Unterscheidung. „Einfach“ wäre im heutigen Deutsch missverständlich; „aufrichtig“ greift den ethischen Akzent auf.
- source_word: μηθὲν διακρίνων
  choice: ohne zu unterscheiden
  rationale: Bewahrt die ausdrückliche Anweisung, beim Geben keine Auswahl zwischen Empfängern zu treffen.
- source_word: ἔνδοξος παρὰ τῷ Θεῷ
  choice: bei Gott ruhmvoll
  rationale: Gibt die Bewertung des Dienstes in Gottes Gegenwart möglichst formal wieder, ohne sie zu „von Gott anerkannt“ abzuschwächen.
- source_word: ζήσεται
  choice: wird leben
  rationale: Bewahrt die knappe eschatologisch oder geistlich deutbare Zukunftsaussage und löst ihre Reichweite nicht einseitig auf.
theological_decisions:
- issue: Verantwortung des Gebenden für den Gebrauch der Gabe
  choice: „ohne Schuld“ und „ohne zu unterscheiden“
  alternative: „unschuldig“, weil er die Bedürftigkeit geprüft habe
  rationale: Der unmittelbare Kontext legt die Verantwortung für unredlichen Empfang beim Empfänger ab und entlastet den vorbehaltlos Gebenden; eine Prüfpflicht darf daher nicht eingetragen werden.
- issue: Bedeutung der abschließenden Lebensverheißung
  choice: „wird leben“
  alternative: „wird das ewige Leben erlangen“ oder „wird am Leben bleiben“
  rationale: Das griechische ζήσεται lässt die genaue Art des Lebens unausgeführt. Die Übersetzung erhält diese theologische Offenheit.
- issue: Adressat des Dienens in der Schlussaussage
  choice: „Gott ... dient“
  alternative: „im Auftrag Gottes dient“
  rationale: Der Dativ τῷ Θεῷ bezeichnet unmittelbar denjenigen, dem gedient wird. Eine bloße Auftragsbeziehung wäre enger und würde den Text interpretierend umformen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Schlüsselbegriffe „Dienst/dient“ und „aufrichtig“ bilden die Wiederholungsstruktur des Griechischen ab. Keine Fußnoten erforderlich, daher stehen im Haupttext keine Marker.
