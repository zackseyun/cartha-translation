revisions:
- from: Üble Nachrede ist böse; sie ist ein ruheloser Dämon, der niemals Frieden hält, sondern immer inmitten von Spaltungen wohnt. Halte dich daher von ihr fern, dann wirst du stets mit allen in Wohlergehen leben.
  to: Üble Nachrede ist böse; sie ist ein ruheloser Dämon, der niemals Frieden hat, sondern immer inmitten von Spaltungen wohnt. Halte dich daher von ihr fern, dann wirst du stets bei allen Wohlergehen haben.
