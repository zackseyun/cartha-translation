base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: de
  text: Üble Nachrede ist böse; sie ist ein ruheloser Dämon, der niemals Frieden hat, sondern immer inmitten von Spaltungen wohnt. Halte dich daher von ihr fern, dann wirst du stets bei allen Wohlergehen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: üble Nachrede
  rationale: Bezeichnet abwertendes Reden über andere; anders als »Verleumdung« setzt die Wendung nicht zwingend voraus, dass das Gesagte unwahr ist.
- source_word: ἀκατάστατον
  choice: ruhelos
  rationale: Gibt die Vorstellung eines unsteten, Unruhe stiftenden Wesens natürlich wieder und passt zum folgenden »niemals Frieden hält«.
- source_word: διχοστασίαις
  choice: Spaltungen
  rationale: Bewahrt den starken sozialen Sinn von Zwietracht und Parteiung.
- source_word: εὐθηνίαν
  choice: Wohlergehen
  rationale: Der Ausdruck bezeichnet Gedeihen oder gutes Ergehen; »Wohlergehen« erhält diese Bedeutung, ohne sie ausschließlich als zwischenmenschliche Harmonie auszulegen.
theological_decisions:
- issue: Personifikation der üblen Nachrede als Dämon
  choice: Die ausdrückliche Dämonenmetapher bleibt erhalten.
  alternative: Das Wort abschwächend als »dämonisch« oder bloß als »Unruhestifter« wiedergeben.
  rationale: Der griechische Text sagt unmittelbar, die üble Nachrede sei ein Dämon; die markante geistliche Bildsprache soll nicht rationalisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnrede und die auffällige Personifikation des griechischen Textes bleiben gewahrt; das Bild »inmitten von Spaltungen wohnt« wird bewusst nicht geglättet.
