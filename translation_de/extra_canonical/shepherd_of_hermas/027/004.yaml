base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: de
  text: Bekleide dich aber mit Würde; in ihr gibt es keinen bösen Anstoß, sondern alles ist eben und heiter. Tu das Gute und gib allen Bedürftigen ohne Vorbehalt von dem, was du durch deine Arbeit erwirtschaftest, die Gott dir gibt, ohne abzuwägen, wem du geben und wem du nicht geben sollst. Gib allen; denn Gott will, dass allen aus seinen eigenen Gaben gegeben wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεμνότητα
  choice: Würde
  rationale: Bezeichnet hier eine ehrbare, sittlich ernste Haltung; „Würde“ ist natürlich und bewahrt den ethischen Gehalt.
- source_word: πρόσκομμα
  choice: Anstoß
  rationale: Bewahrt das Bild eines Hindernisses beziehungsweise Anlasses zum Straucheln, ohne es unnötig auszudeuten.
- source_word: ὁμαλὰ καὶ ἱλαρά
  choice: eben und heiter
  rationale: Gibt sowohl die Vorstellung des Unanstößigen und Ausgeglichenen als auch die freundliche, frohe Haltung wieder.
- source_word: ἐκ τῶν κόπων σου
  choice: von dem Ertrag deiner Arbeit
  rationale: κόποι bezeichnet wörtlich Mühen oder Arbeit; im Zusammenhang des Gebens ist der daraus hervorgehende Ertrag gemeint.
- source_word: ἁπλῶς
  choice: mit ungeteiltem Herzen
  rationale: Das Wortfeld umfasst Einfachheit, Aufrichtigkeit und vorbehaltlose Großzügigkeit. Die Formulierung verbindet es mit dem Leitmotiv ἁπλότης und passt zum folgenden Verbot des Abwägens.
- source_word: μὴ διστάζων
  choice: ohne abzuwägen
  rationale: Im Kontext geht es nicht bloß um Unsicherheit, sondern um unterscheidendes Zögern darüber, wer eine Gabe erhalten soll.
- source_word: ὑστερουμένοις
  choice: Bedürftigen
  rationale: Bezeichnet Menschen, denen es an dem Nötigen fehlt.
theological_decisions:
- issue: Reichweite von πᾶσιν und Gottes Willen zum Geben
  choice: „allen“ ohne Einschränkung beibehalten
  alternative: „allen Bedürftigen“ auch im letzten Satz wiederholen
  rationale: Der griechische Text formuliert πᾶσιν ausdrücklich und betont vorbehaltloses Geben; eine zusätzliche Einschränkung im letzten Satz würde die Spannung zum folgenden Abschnitt über die Verantwortung der Empfangenden abschwächen.
- issue: Ursprung der zu verteilenden Mittel
  choice: „aus seinen eigenen Gaben“
  alternative: „von den Gaben, die ihm gehören“
  rationale: 'Das Possessivpronomen verweist auf Gott: Was Menschen weitergeben, stammt letztlich aus Gottes Gaben. Die knappe Form wahrt diese theologische Aussage.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die griechische Bildsprache. Der wiederholte Imperativ „Gib allen“ bleibt zur Wahrung des eindringlichen Tons erhalten; es sind keine Fußnoten erforderlich.
