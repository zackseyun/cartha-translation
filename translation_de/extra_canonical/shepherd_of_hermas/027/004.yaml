revisions:
- from: Bekleide dich aber mit Würde; in ihr gibt es keinen bösen Anstoß, sondern alles ist eben und heiter. Tu das Gute, und gib von dem Ertrag deiner Arbeit, den Gott dir schenkt, allen Bedürftigen mit ungeteiltem Herzen, ohne abzuwägen, wem du geben und wem du nicht geben sollst. Gib allen; denn Gott will, dass allen aus seinen eigenen Gaben gegeben wird.
  to: Bekleide dich aber mit Würde; in ihr gibt es keinen bösen Anstoß, sondern alles ist eben und heiter. Tu das Gute und gib allen Bedürftigen ohne Vorbehalt von dem, was du durch deine Arbeit erwirtschaftest, die Gott dir gibt, ohne abzuwägen, wem du geben und wem du nicht geben sollst. Gib allen; denn Gott will, dass allen aus seinen eigenen Gaben gegeben wird.
  rationale: Die Revision ersetzt eine semantisch zu spezifizierende Wiedergabe von ἁπλῶς durch „ohne Vorbehalt“ und formuliert den Bezug von κόποις auf die zum Geben verfügbaren Arbeitsmittel genauer. Die unbegrenzte Formulierung „Gib allen“ und die Aussage, dass die weitergegebenen Gaben letztlich Gottes Gaben sind, bleiben erhalten. Fußnoten sind nicht erforderlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:25Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur, die universale Aufforderung zum Geben und der Bezug der Gaben auf Gott sind zutreffend wiedergegeben. „Mit ungeteiltem Herzen“ ist für ἁπλῶς jedoch zu eng und verschiebt den Akzent von schlichter, vorbehaltloser Freigebigkeit zu innerer Ganzheit. Auch „Ertrag“ ist gegenüber κόποις eine zulässige kontextuelle Deutung, aber weniger unmittelbar als die Mühe bzw. Arbeit selbst.
  naturalness: Der Text ist überwiegend modernes, würdiges Deutsch. „Eben und heiter“ ist zwar nah am Bild des Griechischen, klingt in dieser abstrakten Zuordnung etwas ungewohnt, bleibt aber verständlich und kann zur Wahrung der Bildsprache stehen.
  terminology: „Würde“ für σεμνότης und „Anstoß“ für πρόσκομμα sind vertretbar. „Bedürftige“ gibt ὑστερούμενοι idiomatisch wieder. „Ohne Vorbehalt“ bildet ἁπλῶς im vorliegenden Gebotszusammenhang genauer und natürlich ab als „mit ungeteiltem Herzen“.
  issues:
  - severity: medium
    issue: „mit ungeteiltem Herzen“ für ἁπλῶς
    rationale: Die Wendung kann im Deutschen vor allem volle Hingabe oder innere Ungeteiltheit ausdrücken. ἁπλῶς meint hier angesichts des anschließenden Verbots, zwischen möglichen Empfängern zu unterscheiden, schlicht bzw. vorbehaltlos zu geben.
  - severity: low
    issue: „Ertrag deiner Arbeit“ für ἐκ τῶν κόπων σου
    rationale: „Ertrag“ setzt ausdrücklich die aus der Arbeit gewonnenen Mittel voraus, während der griechische Wortlaut von den Mühen bzw. der Arbeit spricht. Eine Formulierung mit „dem, was du durch deine Arbeit erwirtschaftest“ macht den im Kontext vorausgesetzten Bezug auf die zu verteilenden Mittel transparent, ohne den Sinn zu verändern.
  revised_text: Bekleide dich aber mit Würde; in ihr gibt es keinen bösen Anstoß, sondern alles ist eben und heiter. Tu das Gute und gib allen Bedürftigen ohne Vorbehalt von dem, was du durch deine Arbeit erwirtschaftest, die Gott dir gibt, ohne abzuwägen, wem du geben und wem du nicht geben sollst. Gib allen; denn Gott will, dass allen aus seinen eigenen Gaben gegeben wird.
  revised_footnotes: []
  revision_rationale: Die Revision ersetzt eine semantisch zu spezifizierende Wiedergabe von ἁπλῶς durch „ohne Vorbehalt“ und formuliert den Bezug von κόποις auf die zum Geben verfügbaren Arbeitsmittel genauer. Die unbegrenzte Formulierung „Gib allen“ und die Aussage, dass die weitergegebenen Gaben letztlich Gottes Gaben sind, bleiben erhalten. Fußnoten sind nicht erforderlich.
