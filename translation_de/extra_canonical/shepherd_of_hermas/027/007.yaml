review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird weitgehend getroffen. Die Wendung „von Aufrichtigkeit geprägt sind“ ersetzt jedoch das passive εὑρεθῇ („befunden werden“) durch eine freiere Zustandsaussage. Außerdem sollte das in der griechischen Ausgabe eingeklammerte σου bei „Herz“ nicht ohne Kennzeichnung als sicherer Text behandelt werden.
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch. „in Lauterkeit befunden werden“ ist etwas gehobener, passt aber zum würdevoll-paränetischen Register und bildet die griechische Formulierung genauer ab.
  terminology: „Umkehr“ ist für μετάνοια angemessen. „Haus“ erhält die weite Bedeutung von οἶκος. Für ἁπλότης ist „Lauterkeit“ im gegebenen ethischen Kontext treffender als die stärker verengende „Aufrichtigkeit“ und wahrt den Anschluss an die vorangehende Mahnung.
  issues:
  - severity: medium
    issue: εὑρεθῇ wird zu stark umgeformt
    rationale: „von Aufrichtigkeit geprägt sind“ gibt nicht die im Griechischen ausgedrückte Aussage wieder, dass die Umkehr „in“ ἁπλότης befunden werde. Die revidierte Fassung bewahrt diese Struktur.
  - severity: low
    issue: Textkritisch unsicheres σου wird unmarkiert festgelegt
    rationale: Die Vorlage setzt σου bei καρδία in Klammern. „das Herz“ bewahrt die Lesart ohne eine unsichere possessive Ergänzung im deutschen Haupttext zu behaupten; die Fußnote dokumentiert den Befund.
  revised_text: Halte also dieses Gebot, wie ich zu dir gesprochen habe, damit deine Umkehr und die deines Hauses in Lauterkeit befunden werden und das Herz[a] rein und unbefleckt ist.
  revised_footnotes:
