revisions:
- from: Halte dich also an dieses Gebot, so wie ich es dir gesagt habe, damit deine Umkehr und die deines Hauses von Aufrichtigkeit geprägt sind und dein Herz rein und unbefleckt ist.
  to: Halte also dieses Gebot, wie ich zu dir gesprochen habe, damit deine Umkehr und die deines Hauses in Lauterkeit befunden werden und das Herz[a] rein und unbefleckt ist.
  rationale: Die Revision hält die Schlussfolgerung und den Zweckcharakter des griechischen Satzes bei, bildet εὑρεθῇ genauer ab und wahrt die textkritische Unsicherheit beim möglichen Possessivpronomen. Sie bleibt dabei idiomatisches, würdiges modernes Deutsch.
