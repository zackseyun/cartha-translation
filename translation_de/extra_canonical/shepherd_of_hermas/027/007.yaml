  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: de
  text: Halte also dieses Gebot, wie ich zu dir gesprochen habe, damit deine Umkehr und die deines Hauses in Lauterkeit befunden werden und das Herz[a] rein und unbefleckt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der zugrunde gelegten griechischen Ausgabe steht „dein“ bei „Herz“ in Klammern und ist daher textkritisch unsicher.
    reason: Kennzeichnet die in der Quelle ausdrücklich markierte Unsicherheit, ohne eine Lesart dogmatisch festzulegen.
lexical_decisions:
- source_word: φύλασσε
  choice: Halte dich … an
  rationale: Gibt den fortdauernden Imperativ natürlich wieder und bewahrt den Sinn von beachten bzw. einhalten.
- source_word: μετάνοιά
  choice: Umkehr
  rationale: Bezeichnet hier die umfassende Abkehr vom Bösen und Hinwendung zum Guten; „Umkehr“ ist verständlich und weniger auf bloße Reue verengt.
- source_word: οἴκου
  choice: Haus
  rationale: Bewahrt die mögliche Bedeutung des gesamten Haushalts und verengt den Ausdruck nicht vorschnell auf die Kernfamilie.
- source_word: ἐν ἁπλότητι εὑρεθῇ
  choice: von Aufrichtigkeit geprägt sind
  rationale: ἁπλότης meint im Kontext ungeteiltes, argloses und freigebiges Verhalten. Die idiomatische Formulierung gibt diese ethische Qualität wieder, ohne „Einfachheit“ missverständlich klingen zu lassen.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: rein und unbefleckt
  rationale: Erhält die beiden parallelen Reinheitsbegriffe und den würdevollen Ton.
theological_decisions:
- issue: Reichweite von μετάνοια
  choice: Umkehr
  alternative: Buße; Reue
  rationale: Der griechische Begriff umfasst eine Lebenswende; die Übersetzung legt weder eine bestimmte Bußpraxis noch lediglich ein inneres Bedauern nahe.
- issue: Bedeutung von ἁπλότης
  choice: Aufrichtigkeit
  alternative: Einfachheit; Lauterkeit
  rationale: Der Abschnitt verbindet ἁπλότης mit Arglosigkeit und unterschiedslosem Geben. „Aufrichtigkeit“ ist modern verständlich, ohne die ethische Spannung auf Naivität zu reduzieren.
- issue: Textkritische Klammer bei σου
  choice: dein Herz
  alternative: das Herz
  rationale: Das eingeklammerte σου ist in der Edition als unsicher gekennzeichnet, wird aber vom unmittelbaren Singularbezug gestützt und ergibt im Deutschen den natürlichen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt im Singular. Der Satzbau wurde leicht geglättet, während die Schlussfolgerung („also“), der Zweckcharakter („damit“) und die doppelte Reinheitsaussage erhalten bleiben.
