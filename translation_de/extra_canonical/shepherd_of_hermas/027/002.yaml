  verdict: revise
  source_fidelity: Der Entwurf gibt den Gedankengang und insbesondere die Bedingung ἐὰν πιστεύσῃς („wenn du ... glaubst“) zutreffend wieder. Die wiederholte Zuordnung der Schuld zur Sünde des Verleumders bleibt erhalten. Eine geringfügige Revision stellt die direkte Bezugnahme auf die Person, über die geredet wird, und die wiederholte Terminologie noch klarer her.
  naturalness: Das Deutsch ist insgesamt modern und gut verständlich. „Sprich über niemanden schlecht“ sowie „der Sünde ... schuldig sein“ sind etwas glatter und idiomatischer als die vorliegenden Formulierungen.
  terminology: „Üble Nachrede“ ist für καταλαλία passend, da es herabsetzendes Reden bezeichnet, ohne die engeren juristischen Konnotationen von „Verleumdung“ zwingend aufzurufen. Die Umschreibung des Verbs mit „schlecht über jemanden reden“ ist natürlich und wahrt die Wiederaufnahme der Wortgruppe.
