base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: de
  text: Sprich vor allem über niemanden schlecht, und höre auch niemandem gern zu, der schlecht über jemanden redet. Sonst wirst auch du als Zuhörer der Sünde dessen schuldig sein, der schlecht über jemanden redet, wenn du der üblen Nachrede glaubst, die du hörst. Denn wenn du ihr glaubst, wirst auch du selbst etwas gegen deinen Bruder haben. So wirst du der Sünde dessen schuldig sein, der schlecht über jemanden redet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: schlecht über andere reden / üble Nachrede
  rationale: Die Wortgruppe bezeichnet herabsetzendes oder verleumderisches Reden gegen eine Person. Die verbale Wendung ist im modernen Deutsch natürlicher als ein durchgehend wiederholtes „verleumden“, während „üble Nachrede“ beim Substantiv den sittlichen Ernst bewahrt, ohne zwingend die juristische Bedeutung von „Verleumdung“ festzulegen.
- source_word: ἡδέως ἄκουε
  choice: höre … gern zu
  rationale: Gibt nicht bloß das Hören, sondern das bereitwillige oder lustvolle Zuhören wieder.
- source_word: ἔνοχος ἔσῃ
  choice: wirst … schuldig sein
  rationale: Bewahrt die Aussage gemeinsamer Schuld beziehungsweise Verantwortlichkeit in klarer, würdiger Sprache.
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: wirst … etwas gegen deinen Bruder haben
  rationale: 'Erhält die knappe und etwas offene griechische Formulierung: Gemeint sein kann, dass der Hörer einen Vorwurf, Groll oder eine feindselige Haltung gegen den Bruder übernimmt.'
theological_decisions:
- issue: Mitschuld des Zuhörers
  choice: Die Schuld wird daran gebunden, dass der Zuhörer der üblen Nachrede glaubt.
  alternative: Jedes bloße Anhören als automatische Mitschuld formulieren.
  rationale: Der griechische Bedingungssatz ἐὰν πιστεύσῃς macht das Glauben an die gehörte Nachrede ausdrücklich zum entscheidenden Moment; diese Bedingung darf nicht abgeschwächt werden.
- issue: Bedeutung von „Bruder“
  choice: Bruder
  alternative: Mitmensch oder Glaubensbruder
  rationale: Die wörtliche Bezeichnung bewahrt die mögliche gemeinschaftliche beziehungsweise geistliche Nuance, ohne ihren Umfang interpretierend festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Die Wiederholung des Schuldmotivs bleibt wie im Griechischen erhalten; die Wortfamilie um καταλαλία wird zur Vermeidung unnatürlicher juristischer Engführung teils verbal, teils nominal wiedergegeben.
