  - severity: low
    issue: „an der Sünde ... schuldig sein“ ist weniger idiomatisch als „der Sünde ... schuldig sein“.
    rationale: Die Revision verbessert die deutsche Konstruktion ohne den Sinngehalt von ἔνοχος τῆς ἁμαρτίας zu verändern.
