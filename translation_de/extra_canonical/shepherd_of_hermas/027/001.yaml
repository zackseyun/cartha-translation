  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Gedankengang des Griechischen zuverlässig wieder: ἁπλότητα ἔχε als Aufforderung zu einer lauteren/ungeteilten Haltung, ἄκακος γίνου als Aufforderung zur Arglosigkeit und den Vergleich mit Kindern, die die lebenszerstörende πονηρία nicht kennen. „Das Leben der Menschen“ bewahrt die unbestimmte Reichweite von ζωή ohne zusätzliche theologische Festlegung.'
  naturalness: Modernes, gut lesbares und zugleich würdiges Deutsch. „Halte an der Aufrichtigkeit fest“ ist idiomatisch und gibt dem Imperativ ἔχε angemessen Dauer. „Arglos“ ist in diesem ethischen Kontext verständlich und passend; der Vergleich mit „kleinen Kindern“ klingt natürlich.
  terminology: „Aufrichtigkeit“ ist für ἁπλότης hier eine vertretbare kontextuelle Wiedergabe, ohne die Aussage auf bloße intellektuelle Schlichtheit zu verengen. „Das Böse“ deckt πονηρία in seiner allgemeinen moralisch-schädlichen Bedeutung. Keine konfessionell lenkende Terminologie und keine problematischen Namens- oder Fachbegriffe.
