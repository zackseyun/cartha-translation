base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: de
  text: 'Er sagt zu mir: »Halte an der Aufrichtigkeit fest, werde arglos, und du wirst wie die kleinen Kinder sein, die das Böse nicht kennen, das das Leben der Menschen zugrunde richtet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητα
  choice: Aufrichtigkeit
  rationale: Bezeichnet hier eine ungeteilte, lautere Haltung. „Einfachheit“ wäre zwar formnäher, klingt im heutigen Deutsch aber leicht nach Schlichtheit oder mangelnder Bildung.
- source_word: ἄκακος
  choice: arglos
  rationale: Gibt die Abwesenheit von Bosheit oder schädlicher Hinterlist wieder und passt zum anschließenden Vergleich mit kleinen Kindern.
- source_word: τὰ νήπια
  choice: die kleinen Kinder
  rationale: νήπια bezeichnet sehr junge Kinder; die natürliche deutsche Wendung bewahrt den Vergleich ohne unnötige Präzisierung auf Säuglinge.
- source_word: πονηρίαν
  choice: das Böse
  rationale: Der Kontext meint schädliche Bosheit beziehungsweise moralische Verderbtheit. Die substantivische Wiedergabe erhält die Breite des griechischen Ausdrucks.
- source_word: ἀπολλύουσαν τὴν ζωὴν
  choice: das das Leben … zugrunde richtet
  rationale: Bewahrt die starke destruktive Bedeutung von ἀπόλλυμι, ohne zwingend festzulegen, ob ausschließlich physischer Tod oder umfassender Ruin gemeint ist.
theological_decisions:
- issue: Reichweite von „Leben“ (ζωή)
  choice: Leben
  alternative: Seele / ewiges Leben
  rationale: Der griechische Text sagt allgemein ζωή. Eine nähere theologische Bestimmung würde die genuine Bedeutungsweite unzulässig einschränken.
- issue: Imperativische Nuance von ἁπλότητα ἔχε
  choice: Halte an der Aufrichtigkeit fest
  alternative: Sei aufrichtig / Habe Einfachheit
  rationale: Die Formulierung gibt den Imperativ und die Vorstellung einer beständig einzunehmenden Haltung natürlich wieder, ohne daraus eine konfessionell geprägte Tugendlehre abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mahnend; „arglos“ wahrt den frühchristlichen Tugendton, ist aber weiterhin allgemein verständlich.
