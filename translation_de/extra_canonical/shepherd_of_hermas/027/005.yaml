  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: de
  text: Diejenigen, die empfangen, werden also Gott Rechenschaft darüber ablegen, warum und wofür sie empfangen haben. Denn diejenigen, die empfangen, während sie bedrängt sind, werden nicht verurteilt werden; die aber in Heuchelei empfangen, werden Strafe erleiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λαμβάνοντες
  choice: die Empfänger / wer … annimmt
  rationale: Die substantivierten Partizipien bezeichnen allgemein diejenigen, die Gaben empfangen. Im zweiten Satz sorgt die singularische, geschlechtsneutrale Formulierung mit „wer“ für natürliches modernes Deutsch.
- source_word: ἀποδώσουσιν λόγον
  choice: Rechenschaft ablegen
  rationale: Gibt die idiomatische Bedeutung der griechischen Wendung präzise und würdig wieder.
- source_word: διατί … καὶ εἰς τί
  choice: warum und wofür
  rationale: Bewahrt die Unterscheidung zwischen dem Grund des Empfangens und dem Verwendungszweck.
- source_word: θλιβόμενοι
  choice: aus Bedrängnis
  rationale: Das Partizip bezeichnet Menschen, die unter Not oder bedrängenden Umständen leiden; „aus Bedrängnis“ stellt den Grund ihres Empfangens dem heuchlerischen Empfang gegenüber.
- source_word: οὐ δικασθήσονται
  choice: werden nicht verurteilt werden
  rationale: δικασθήσονται kann gerichtliches Beurteilen oder Verurteilen bezeichnen; im Kontrast zur ausdrücklich genannten Strafe ist „verurteilt“ im Deutschen am klarsten.
- source_word: ἐν ὑποκρίσει
  choice: aus Heuchelei
  rationale: Bezeichnet einen unaufrichtigen, vorgetäuschten Anspruch auf Hilfe und erhält die moralische Kategorie des Ausgangstextes.
- source_word: τίσουσιν δίκην
  choice: werden ihre Strafe erhalten
  rationale: Natürliches Deutsch für die Wendung „Strafe/Buße zahlen“, ohne die Sanktion näher zu bestimmen, als es der griechische Text tut.
theological_decisions:
- issue: Art des göttlichen Gerichts über Empfänger von Gaben
  choice: Der Text unterscheidet zwischen aus echter Bedrängnis Empfangenden, die nicht verurteilt werden, und heuchlerisch Empfangenden, die Strafe erhalten.
  alternative: Alle Empfangenden werden unterschiedslos verurteilt oder die Strafe wird als bestimmte eschatologische Sanktion ausgelegt.
  rationale: Der griechische Kontrast οἱ μὲν … οἱ δὲ ist ausdrücklich; Art und Zeitpunkt der Strafe bleiben jedoch unbestimmt und werden daher nicht dogmatisch präzisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „annimmt“ hält den Bezug auf materielle Unterstützung aus dem unmittelbaren Kontext sichtbar; die Satzstruktur wahrt den begründenden und kontrastiven Aufbau des Griechischen.
