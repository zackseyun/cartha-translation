review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Rechenschaft, den doppelten Grund/Zweck des Empfangens sowie den Kontrast zwischen Bedrängten und Heuchlern im Wesentlichen zutreffend wieder. „Aus Bedrängnis“ verschiebt jedoch θλιβόμενοι von einer Zustandsbeschreibung („bedrängt/notleidend“) zu einer Motivangabe. Das griechische Partizip besagt, dass die Empfangenden bedrängt sind, nicht ausdrücklich, dass sie gerade deshalb empfangen.
  naturalness: Das Deutsch ist modern, klar und dem würdigen Register angemessen. „Diejenigen, die empfangen“ ist hier etwas unmittelbarer als „Die Empfänger“ und bewahrt die wiederholte Partizipstruktur des Ausgangstextes.
  terminology: „Rechenschaft ablegen“, „verurteilt werden“, „Heuchelei“ und „Strafe erleiden“ geben die einschlägigen griechischen Wendungen sachgerecht wieder. „Strafe erleiden“ ist für τίσουσιν δίκην idiomatisch und lässt Art und Umfang der Strafe offen.
  issues:
  - severity: medium
    issue: „aus Bedrängnis“ macht aus θλιβόμενοι eine Begründung des Empfangens.
    rationale: θλιβόμενοι bezeichnet zunächst die Bedrängten bzw. Notleidenden als Gruppe oder ihren begleitenden Zustand. „Während sie bedrängt sind“ bzw. „die in Bedrängnis empfangen“ erhält diese syntaktische und semantische Offenheit.
  revised_text: Diejenigen, die empfangen, werden also Gott Rechenschaft darüber ablegen, warum und wofür sie empfangen haben. Denn diejenigen, die empfangen, während sie bedrängt sind, werden nicht verurteilt werden; die aber in Heuchelei empfangen, werden Strafe erleiden.
