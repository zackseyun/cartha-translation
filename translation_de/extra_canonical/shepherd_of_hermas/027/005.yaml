revisions:
- from: Die Empfänger werden also Gott Rechenschaft darüber ablegen, warum und wofür sie etwas angenommen haben. Denn wer aus Bedrängnis etwas annimmt, wird nicht verurteilt werden; wer es aber aus Heuchelei annimmt, wird seine Strafe erhalten.
  to: Diejenigen, die empfangen, werden also Gott Rechenschaft darüber ablegen, warum und wofür sie empfangen haben. Denn diejenigen, die empfangen, während sie bedrängt sind, werden nicht verurteilt werden; die aber in Heuchelei empfangen, werden Strafe erleiden.
  rationale: Die Revision beschränkt sich auf die Wiedergabe von θλιβόμενοι. Die Formulierung „während sie bedrängt sind“ vermeidet die im Entwurf hinzugefügte Kausalität und bewahrt die Aussage des griechischen Partizips. Die parallele Wiederholung von „diejenigen, die empfangen“ macht den antithetischen Aufbau οἱ μὲν … οἱ δὲ transparent.
