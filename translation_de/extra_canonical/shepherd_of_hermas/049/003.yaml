base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/003.yaml
  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: de
  text: 10 Glücklich zu preisen sind alle, die Besitz haben und erkennen, dass der Herr sie reich macht. Denn die so denken, werden etwas Gutes tun können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen
  rationale: Gibt die feierliche Seligpreisungsform wieder, bleibt aber in modernem Standarddeutsch verständlich.
- source_word: οἱ ἔχοντες
  choice: alle, die Besitz haben
  rationale: Das substantivierte ‚die Habenden‘ bezieht sich im unmittelbaren Zusammenhang auf Vermögende; ‚Besitz haben‘ macht diesen Bezug natürlich verständlich, ohne Reichtum als solchen weiter auszudeuten.
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: dass der Herr sie reich macht
  rationale: Bewahrt den passiven Sinn und kennzeichnet den Herrn als Ursprung ihres Reichtums.
- source_word: οἱ … ταῦτα φρονοῦντες
  choice: wer dies beherzigt
  rationale: φρονεῖν bezeichnet hier nicht bloß einen flüchtigen Gedanken, sondern eine bestimmende Einsicht oder Haltung; ‚beherzigen‘ gibt dies idiomatisch wieder.
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: etwas Gutes tun
  rationale: Direkte und natürliche Wiedergabe, die die unbestimmte Formulierung τι beibehält.
theological_decisions:
- issue: Ursprung des Reichtums und ethische Verantwortung
  choice: Der Herr macht die Besitzenden reich; diese Einsicht befähigt sie, Gutes zu tun.
  alternative: Reichtum als Beweis göttlicher Begünstigung oder als Selbstzweck zu formulieren.
  rationale: Der griechische Text benennt Gott als Ursprung des Reichtums und verbindet die entsprechende Einsicht mit gutem Handeln, ohne eine allgemeine Wohlstandslehre zu entfalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem Ton einer Seligpreisung. Die knappe ethische Folgerung und die theologische Spannung zwischen Besitz und verantwortlichem Handeln bleiben erhalten.
