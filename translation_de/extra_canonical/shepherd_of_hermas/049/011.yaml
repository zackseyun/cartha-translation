revisions:
- from: 3. Denn wie im Sommer die Früchte jedes einzelnen Baumes sichtbar werden und man erkennt, von welcher Art sie sind, so werden auch die Früchte der Gerechten sichtbar sein, und alle wird man erkennen; selbst die Geringsten unter ihnen[a] werden in jener Weltzeit kräftig gedeihen.
  to: 3. Denn wie im Sommer die Früchte jedes einzelnen Baumes sichtbar werden und man erkennt, von welcher Art sie sind, so werden auch die Früchte der Gerechten sichtbar sein, und alle werden in jener Weltzeit als blühend erkannt werden, auch die Geringsten[a].
  rationale: Die Revision erhält den Vergleich und die eschatologische Zeitangabe, verbindet jedoch das Erkanntwerden mit dem prädikativen „als blühend“, wie es der griechische Satzbau nahelegt. Sie gibt die eingeklammerte Wortgruppe ohne nicht ausdrücklich vorhandene Zusätze wieder und markiert ihre textkritische Unsicherheit in der Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur des Vergleichs und die Wiedergabe von ποταποί („von welcher Art sie sind“) sind treffend. Im Schlussteil verschiebt der Entwurf jedoch die Satzbeziehung: εὐθαλεῖς ὄντες beschreibt, wie die Betreffenden in jener Weltzeit erkannt werden („als blühend/gedeihend“), nicht primär eine zusätzliche Zukunftsaussage, dass sie „kräftig gedeihen werden“. Außerdem enthält οἱ ἐλάχιστοι ὄντες weder ein ausdrückliches „unter ihnen“ noch die verstärkende Partikel „selbst“; beides sollte trotz der textkritischen Unsicherheit nicht ergänzt werden.'
  naturalness: „Alle wird man erkennen“ ist zwar verständlich, klingt in Verbindung mit dem anschließenden Zusatz etwas schwerfällig. Die passive Formulierung „alle werden als blühend erkannt werden“ ist idiomatisch, hält die griechische Aussage zusammen und lässt den Bezug auf die Gerechten im Kontext bestehen.
  terminology: „Gerechte“, „Sommer“ und „jener Weltzeit“ sind angemessen. „Blühend“ gibt εὐθαλεῖς im Bildfeld von Bäumen natürlicher und genauer wieder als „kräftig gedeihen“, da das Griechische hier eine prädikative Zustandsbeschreibung enthält.
  issues:
  - severity: medium
    issue: Der Schlussteil wird als neue Aussage über künftiges Gedeihen formuliert.
    rationale: γνωσθήσονται ... εὐθαλεῖς ὄντες besagt, dass sie als blühend bzw. gedeihend erkannt werden. Die Revision bewahrt diese syntaktische und semantische Verknüpfung.
  - severity: low
    issue: „selbst“ und „unter ihnen“ sind interpretierende Zusätze zur eingeklammerten, textkritisch unsicheren Wortgruppe.
    rationale: οἱ ἐλάχιστοι ὄντες lautet lediglich „die Geringsten/Unbedeutendsten seienden“. Die Ergänzungen sind nicht nötig und engen die knappe, unsichere Überlieferung unnötig ein.
  revised_text: 3. Denn wie im Sommer die Früchte jedes einzelnen Baumes sichtbar werden und man erkennt, von welcher Art sie sind, so werden auch die Früchte der Gerechten sichtbar sein, und alle werden in jener Weltzeit als blühend erkannt werden, auch die Geringsten[a].
  revised_footnotes:
