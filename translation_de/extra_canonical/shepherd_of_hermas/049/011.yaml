  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: de
  text: 3. Denn wie im Sommer die Früchte jedes einzelnen Baumes sichtbar werden und man erkennt, von welcher Art sie sind, so werden auch die Früchte der Gerechten sichtbar sein, und alle werden in jener Weltzeit als blühend erkannt werden, auch die Geringsten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „auch die Geringsten“ sind im griechischen Text textkritisch unsicher.
    reason: Die Edition setzt οἱ ἐλάχιστοι ὄντες in eckige Klammern; die unsichere Überlieferung dieser Wörter wird transparent kenntlich gemacht.
lexical_decisions:
- source_word: θέρος
  choice: Sommer
  rationale: Die konkrete Jahreszeitenmetapher des griechischen Textes wird unmittelbar bewahrt.
- source_word: ποταποί
  choice: von welcher Art sie sind
  rationale: Gibt die qualitative Frage nach Beschaffenheit beziehungsweise Art der Früchte natürlich und genau wieder.
- source_word: εὐθαλεῖς
  choice: kräftig gedeihen
  rationale: Bringt das Bild üppigen, gesunden Wachstums idiomatisch zum Ausdruck, ohne die Baum- und Fruchtmetaphorik zu verlassen.
- source_word: αἰών
  choice: Weltzeit
  rationale: Bewahrt den zeitlich-eschatologischen Sinn und vermeidet eine vorschnelle Gleichsetzung mit einem bloßen Ort oder der Ewigkeit.
theological_decisions:
- issue: Erkennbarkeit der Gerechten in der kommenden Weltzeit
  choice: Die Früchte werden sichtbar, und die Gerechten werden erkannt.
  alternative: Die Gerechten werden aufgrund ihrer Werke gerettet.
  rationale: Der Text spricht von Offenbarwerden und Erkennen der Früchte, nicht ausdrücklich vom Grund ihrer Rettung; eine weitergehende soteriologische Festlegung wäre ein Import.
- issue: οἱ ἐλάχιστοι ὄντες als textkritisch unsichere Wendung
  choice: „selbst die Geringsten unter ihnen“ im Haupttext mit Fußnote
  alternative: Die eingeklammerten Wörter auslassen oder als „die ganz Kleinen“ wiedergeben.
  rationale: Die überlieferte Wendung wird transparent wiedergegeben, während die textliche Unsicherheit ausdrücklich kenntlich bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der periodische Vergleich des Griechischen bleibt erhalten, wird aber durch Semikolon und klare Satzgliederung gut lesbar gemacht. „Weltzeit“ wahrt die Spannung von αἰών besser als eine vereinfachende Wiedergabe mit „Welt“ oder „Ewigkeit“.
