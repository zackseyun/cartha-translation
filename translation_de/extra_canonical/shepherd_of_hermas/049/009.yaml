  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/009.yaml
  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: de
  text: '1. Wieder zeigte er mir viele Bäume, von denen einige ausschlugen, andere aber dürr waren. Er sagte zu mir: »Siehst du diese Bäume?« »Ich sehe sie, Herr«, sagte ich, »die einen schlagen aus, die anderen sind dürr.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: ausschlugen / schlagen aus
  rationale: Das Partizip bezeichnet Bäume, die Knospen oder neue Triebe hervorbringen. »Ausschlagen« ist im Deutschen natürlich und bewahrt das Bild des beginnenden Wachstums.
- source_word: ξηρά
  choice: dürr
  rationale: Bei Bäumen bezeichnet ξηρός trockenes, verdorrtes beziehungsweise lebloses Aussehen. »Dürr« ist knapp, bildhaft und entspricht dem Kontrast zu den ausschlagenden Bäumen.
- source_word: κύριε
  choice: Herr
  rationale: Die Anrede wird formal mit »Herr« wiedergegeben. Sie drückt respektvolle Unterordnung aus, ohne die Identität des Angeredeten über den Kontext hinaus festzulegen.
- source_word: πάλιν
  choice: wieder
  rationale: Bewahrt den erzählerischen Anschluss an die vorangehende Gleichnisvision.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der historische Präsenswechsel des Griechischen wird im Dialog teilweise bewahrt, während die einleitende Visionserzählung natürlich im Präteritum steht. Die Wiederholung des Gegensatzes zwischen ausschlagenden und dürren Bäumen bleibt vollständig erhalten.
