  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: de
  text: 4. Die Völker[a] und die Sünder aber wird man – wie die dürren Bäume, die du gesehen hast – in jener Weltzeit ebenso dürr und ohne Frucht vorfinden, und wie …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Heiden; gemeint sein können die nichtjüdischen Völker.'
    reason: Bewahrt die Bedeutungsbreite von τὰ ἔθνη.
  - marker: b
    text: Der für diesen Abschnitt vorliegende griechische Quelltext bricht hier mitten im Satz ab.
    reason: Kennzeichnet transparent den fragmentarischen Schluss der bereitgestellten Quelle, statt ihn zu ergänzen.
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Gibt den Grundsinn des griechischen Plurals wieder und vermeidet die heute leicht abwertend klingende Wiedergabe „die Heiden“; im frühchristlichen Zusammenhang kann der Ausdruck jedoch ausdrücklich die Nichtjuden bezeichnen.
- source_word: ἄκαρποι
  choice: ohne Frucht
  rationale: Bewahrt das durchgehende Bild der Bäume deutlicher als das abstraktere „unfruchtbar“.
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: in jener Weltzeit
  rationale: Gibt αἰών als eschatologische Zeit- beziehungsweise Weltordnung wieder, ohne es vorschnell nur als räumliche „Welt“ oder als endlose „Ewigkeit“ festzulegen.
- source_word: εὑρεθήσονται
  choice: werden … vorgefunden werden
  rationale: Bewahrt die passive Aussage des Griechischen und den Gedanken, dass ihr wirklicher Zustand dann offenbar festgestellt wird.
theological_decisions:
- issue: Bedeutung von τὰ ἔθνη
  choice: die Völker
  alternative: die Heiden / die Nichtjuden
  rationale: Der griechische Ausdruck kann allgemein „Völker“ und im jüdisch-christlichen Sprachgebrauch „Nichtjuden“ beziehungsweise „Heiden“ bedeuten. Die Übersetzung lässt diese Spannung bestehen und nennt die engere Möglichkeit in der Fußnote.
- issue: Eschatologische Bedeutung von αἰών
  choice: Weltzeit
  alternative: Zeitalter / Welt
  rationale: „Weltzeit“ hält sowohl den zeitlichen als auch den weltordnungsbezogenen Gehalt offen und markiert den Gegensatz zwischen der gegenwärtigen und der kommenden Ordnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Baum-Metaphorik bleibt konkret erhalten. Gedankenstriche gliedern den eingeschobenen Vergleich; die Auslassung wird wegen des abgebrochenen Quelltexts ausdrücklich markiert.
