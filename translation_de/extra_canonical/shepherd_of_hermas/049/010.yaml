base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: de
  text: 2. »Diese Bäume, die austreiben«, sagt er, »sind die Gerechten, die im kommenden Zeitalter wohnen werden. Denn das kommende Zeitalter ist für die Gerechten Sommer, für die Sünder aber Winter. Wenn nun das Erbarmen des Herrn aufleuchtet, werden die offenbar werden, die Gott dienen, und alle werden offenbar werden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: die ausschlagen
  rationale: Gibt das beginnende Wachstum der Bäume natürlich und bildhaft wieder.
- source_word: οἱ δίκαιοι
  choice: die Gerechten
  rationale: Bewahrt den ethisch-theologischen Begriff des griechischen Textes ohne konfessionelle Zuspitzung.
- source_word: ὁ αἰὼν ὁ ἐρχόμενος
  choice: die kommende Weltzeit
  rationale: Gibt αἰών als zeitlich und heilsgeschichtlich geprägten Begriff wieder, ohne ihn vorschnell mit „Ewigkeit“ gleichzusetzen.
- source_word: τὸ ἔλεος τοῦ Κυρίου
  choice: das Erbarmen des Herrn
  rationale: „Erbarmen“ entspricht dem personalen und tätigen Sinn von ἔλεος.
- source_word: ἐπιλάμψῃ
  choice: aufleuchtet
  rationale: Erhält die Lichtmetaphorik des Verbs.
- source_word: φανερωθήσονται
  choice: werden offenbar werden
  rationale: Bewahrt das wiederholte Offenbarwerden als Leitmotiv des Satzes.
- source_word: οἱ δουλεύοντες τῷ Θεῷ
  choice: die Gott dienen
  rationale: Natürliches modernes Deutsch; der Sinn des Dienstverhältnisses bleibt erhalten.
theological_decisions:
- issue: Bedeutung von αἰών
  choice: Weltzeit
  alternative: Zeitalter / Ewigkeit
  rationale: „Weltzeit“ wahrt sowohl den zeitlichen als auch den kosmisch-eschatologischen Gehalt und vermeidet die eindeutige Festlegung auf endlose Dauer.
- issue: Reichweite von πάντες
  choice: und alle werden offenbar werden
  alternative: und sie alle werden offenbar werden
  rationale: Das selbstständige „alle“ bewahrt die grammatische Weite und mögliche Spannung des griechischen Textes, statt den Bezug stillschweigend nur auf die Gott Dienenden zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Die Wiederholung von „offenbar werden“ wurde trotz stilistischer Härte beibehalten, weil sie die emphatische Struktur des griechischen Textes trägt.
