  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/002.yaml
  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: de
  text: 9. So werden beide zu Teilhabern am Werk des Gerechten.[a] Wer dies tut, wird daher von Gott nicht verlassen, sondern in die Bücher der Lebenden eingetragen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Werk der Gerechtigkeit«. Die griechische Wendung kann sich auf »den Gerechten« beziehen oder als Bezeichnung eines gerechten Werkes verstanden werden.'
    reason: Bewahrt die grammatische und theologische Mehrdeutigkeit von τοῦ ἔργου τοῦ δικαίου.
lexical_decisions:
- source_word: κοινωνοὶ
  choice: Teilhaber
  rationale: Gibt die gemeinsame Beteiligung beider Seiten am selben Werk prägnant und würdig wieder.
- source_word: τοῦ ἔργου τοῦ δικαίου
  choice: am Werk des Gerechten
  rationale: Bewahrt die substantivische Form von τοῦ δικαίου und damit den möglichen Bezug auf einen Gerechten, ohne die Wendung abstrakt zu »Werk der Gerechtigkeit« umzudeuten.
- source_word: ἐγκαταλειφθήσεται
  choice: wird … nicht verlassen
  rationale: Entspricht dem Passiv und der ausdrücklichen Urheberschaft Gottes.
- source_word: ἐπιγεγραμμένος
  choice: eingetragen
  rationale: Natürliche deutsche Wiedergabe für das schriftliche Verzeichnetsein in Büchern.
- source_word: τὰς βίβλους τῶν ζώντων
  choice: die Bücher der Lebenden
  rationale: Erhält sowohl den Plural »Bücher« als auch den Genitiv »der Lebenden«.
theological_decisions:
- issue: Bezug von τοῦ δικαίου
  choice: des Gerechten
  alternative: der Gerechtigkeit / des gerechten Werkes
  rationale: Die griechische Form kann substantivisch verstanden werden; die Übersetzung folgt dieser naheliegenden Lesart, während die Fußnote die echte Mehrdeutigkeit offenhält.
- issue: Verhältnis von menschlichem Tun und Gottes Bewahrung
  choice: Die Folgerung des Textes bleibt ohne dogmatische Erklärung stehen.
  alternative: Eine Aussage über Verdienst, Rechtfertigung oder Heilsgewissheit ergänzen
  rationale: Der Ausgangstext verbindet das Tun mit Gottes Nichtverlassen und dem Eintrag in die Bücher, erläutert aber das systematisch-theologische Verhältnis nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton. Die Satzfolge und die Zukunftsaussagen des Griechischen bleiben erhalten.
