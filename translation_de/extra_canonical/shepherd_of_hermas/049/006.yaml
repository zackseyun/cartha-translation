base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: de
  text: 2. »Warum also, Herr«, fragte ich, »sehen sie wie verdorrt aus und gleichen einander?« »Weil«, sagte er, »in dieser Weltzeit weder die Gerechten noch die Sünder als solche zu erkennen sind, sondern einander gleichen. Denn diese Weltzeit ist für die Gerechten Winter, und während sie unter den Sündern wohnen, sind sie nicht als solche zu erkennen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede an die deutende Gestalt wird würdig und traditionsnah wiedergegeben, ohne sie ausdrücklich mit Gott gleichzusetzen.
- source_word: ὡσεὶ ξηρά
  choice: wie verdorrt
  rationale: Das Vergleichssignal ὡσεὶ bleibt erhalten; »verdorrt« ist im Bild von Bäumen natürlicher als das allgemeinere »trocken«.
- source_word: φαίνονται
  choice: als solche zu erkennen sind
  rationale: Im Zusammenhang geht es nicht um physische Unsichtbarkeit, sondern darum, dass Gerechte und Sünder in der gegenwärtigen Weltzeit äußerlich nicht unterschieden werden können.
- source_word: αἰὼν οὗτος
  choice: diese Weltzeit
  rationale: Bewahrt die zeitlich-eschatologische Bedeutung von αἰών deutlicher als das bloße »Welt«, ohne die Stelle übermäßig technisch klingen zu lassen.
- source_word: χειμών
  choice: Winter
  rationale: Die Metapher wird wörtlich bewahrt und knüpft an die wie verdorrt erscheinenden Bäume an.
- source_word: μετὰ τῶν ἁμαρτωλῶν κατοικοῦντες
  choice: während sie unter den Sündern wohnen
  rationale: Gibt die Gleichzeitigkeit des Partizips und das Zusammenleben der Gerechten mit den Sündern natürlich wieder.
theological_decisions:
- issue: Erkennbarkeit von Gerechten und Sündern in der gegenwärtigen Weltzeit
  choice: »weder die Gerechten noch die Sünder als solche zu erkennen sind«
  alternative: »weder die Gerechten noch die Sünder sichtbar sind«
  rationale: Das wiederholte φαίνονται bezeichnet im Baumgleichnis die fehlende Unterscheidbarkeit, nicht das buchstäbliche Unsichtbarsein. Die Formulierung lässt dennoch offen, woran ihr wahrer Zustand schließlich erkannt wird.
- issue: Bedeutung von αἰών
  choice: »Weltzeit«
  alternative: »Zeitalter« oder »Welt«
  rationale: »Weltzeit« hält die Spannung zwischen gegenwärtiger Weltordnung und zeitlichem Abschnitt aufrecht und entspricht dem Kontrast zur kommenden Weltzeit im Kontext.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Die direkte Rede wurde natürlich gegliedert; die wiederholte Aussage des griechischen Textes bleibt erhalten. Keine Fußnoten erforderlich.
