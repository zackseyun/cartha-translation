  source_fidelity: Der Entwurf gibt den griechischen Wortlaut zuverlässig wieder. Die Vergleichsformel ὡσεὶ („wie/als ob“) bleibt erhalten. Die Wiedergabe von φαίνονται als „als solche zu erkennen sind“ trifft im Kontext des Baumgleichnisses die gemeinte fehlende Unterscheidbarkeit und vermeidet eine missverständliche Vorstellung körperlicher Unsichtbarkeit. Der abschließende Partizipialsatz μετὰ τῶν ἁμαρτωλῶν κατοικοῦντες ist angemessen als Wohnen unter den Sündern wiedergegeben.
  naturalness: Die Übersetzung ist modernes, gut lesbares Standarddeutsch. Die Redewechsel und die Anrede „Herr“ sind idiomatisch und würdig. „Weltzeit“ ist leicht literarisch, aber verständlich und im eschatologischen Kontrast des Kontextes vertretbar.
  terminology: „Gerechte“, „Sünder“, „Winter“ und „Herr“ sind sachgerecht. „Weltzeit“ bewahrt die Bedeutung von αἰών als gegenwärtige Weltordnung beziehungsweise Zeitabschnitt, ohne eine konfessionelle Deutung festzulegen.
