  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: de
  text: '1. Er zeigte mir viele Bäume, die keine Blätter hatten, sondern mir wie vertrocknet erschienen; denn sie sahen alle gleich aus. Da sagte er zu mir: »Siehst du diese Bäume?« »Ich sehe, Herr«, sagte ich, »dass sie gleich aussehen und vertrocknet sind.« Er antwortete mir: »Diese Bäume, die du siehst, sind die Menschen, die in diesem Zeitalter leben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἔχοντα φύλλα
  choice: die keine Blätter trugen
  rationale: Gibt den sichtbaren Zustand der Bäume natürlich und genau wieder; »trugen« ist im Deutschen idiomatischer als ein wörtliches »hatten«.
- source_word: ὡσεὶ ξηρά
  choice: wie vertrocknet
  rationale: Bewahrt mit »wie« die vergleichende beziehungsweise wahrnehmungsbezogene Nuance von ὡσεὶ; »vertrocknet« bezeichnet bei Bäumen den gemeinten Zustand klar.
- source_word: ὅμοια
  choice: gleich aus
  rationale: Im Zusammenhang geht es um das nicht unterscheidbare Erscheinungsbild der Bäume; die Formulierung ist natürlich und bewahrt den Vergleich.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird formal wiedergegeben, ohne die Identität des Angeredeten darüber hinaus auszudeuten.
- source_word: οἱ κατοικοῦντες
  choice: die Menschen, die … leben
  rationale: Das substantivierte Partizip bezeichnet die Bewohner; »die Menschen, die … leben« ist im modernen Deutsch verständlich und vermeidet ein schwerfälliges »die Wohnenden«.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: in dieser Weltzeit
  rationale: »Weltzeit« erhält sowohl den zeitlichen als auch den weltbezogenen Gehalt von αἰών besser als das mehrdeutige »Zeitalter« oder das rein räumliche »Welt«.
theological_decisions:
- issue: Bedeutung von αἰών
  choice: Weltzeit
  alternative: Zeitalter / Welt
  rationale: Der Kontext stellt die gegenwärtige Ordnung beziehungsweise Zeit der kommenden gegenüber. »Weltzeit« wahrt diese eschatologische Spannung, ohne sie als bloßen Zeitraum oder bloßen Ort festzulegen.
- issue: Anrede κύριε
  choice: Herr
  alternative: mein Herr / Gebieter
  rationale: Die schlichte respektvolle Anrede des griechischen Textes bleibt erhalten; eine stärkere christologische oder herrschaftliche Präzisierung wird nicht eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerischer Direktheit. Die wiederholten Wahrnehmungs- und Redeverben des griechischen Textes bleiben weitgehend erhalten; kleinere syntaktische Anpassungen sorgen für natürlichen deutschen Lesefluss.
