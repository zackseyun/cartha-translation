base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: de
  text: 3. Denn wie im Winter die Bäume, nachdem sie ihre Blätter abgeworfen haben, gleich aussehen und nicht zu erkennen ist, welche vertrocknet und welche lebendig sind, so sind auch in diesem Zeitalter weder die Gerechten noch die Sünder zu erkennen, sondern alle sehen gleich aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ χειμῶνι
  choice: im Winter
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Metapher.
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: nachdem sie ihre Blätter abgeworfen haben
  rationale: Das griechische Perfektpartizip bezeichnet den eingetretenen Zustand infolge des Blattabwurfs; die temporale Formulierung klingt im Deutschen natürlich.
- source_word: τὰ ξηρά
  choice: welche vertrocknet
  rationale: Im Gegensatz zu „lebendig“ bezeichnet ξηρά hier abgestorbene beziehungsweise ausgetrocknete Bäume; „vertrocknet“ bewahrt das Bild.
- source_word: τὰ ζῶντα
  choice: welche lebendig
  rationale: Formale Entsprechung, die den Kontrast zwischen nur scheinbar toten und tatsächlich lebenden Bäumen erhält.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: in dieser Weltzeit
  rationale: „Weltzeit“ gibt αἰών als gegenwärtige Ordnung beziehungsweise Epoche wieder und hält den eschatologischen Gegensatz zur kommenden Weltzeit offen.
- source_word: οὐ φαίνονται
  choice: sind … nicht zu erkennen
  rationale: Im Kontext meint φαίνονται nicht bloß optische Sichtbarkeit, sondern dass die jeweilige Beschaffenheit nicht offenbar oder unterscheidbar ist.
- source_word: ὅμοιοί εἰσιν
  choice: sehen gleich aus
  rationale: Im Baumvergleich ist die wahrnehmbare Gleichheit gemeint; diese idiomatische Wiedergabe vermeidet die Aussage, Gerechte und Sünder seien ihrem Wesen nach gleich.
theological_decisions:
- issue: Ununterscheidbarkeit von Gerechten und Sündern in der gegenwärtigen Weltzeit
  choice: „weder die Gerechten noch die Sünder zu erkennen“
  alternative: „weder die Gerechten noch die Sünder erscheinen“
  rationale: Die Übersetzung wahrt die Aussage, dass ihr wahrer Zustand gegenwärtig nicht offenbar ist, ohne eine Wesensgleichheit oder ein endgültiges Urteil vorwegzunehmen.
- issue: Bedeutung von αἰών
  choice: „Weltzeit“
  alternative: „Welt“ oder „Zeitalter“
  rationale: „Weltzeit“ bewahrt sowohl den zeitlichen als auch den eschatologischen Sinn und passt zum Kontrast des Abschnitts zwischen der jetzigen und der kommenden Ordnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der wiederholte Vergleich und die Spannung zwischen äußerem Anschein und innerem Zustand bleiben erhalten; keine Fußnoten erforderlich.
