  naturalness: »Zur Fülle bringen« ist verständlich, wirkt in dieser Verbindung mit »Reichtum« und »Seelen« jedoch merklich künstlich. »Vollständig machen« ist modernes Standarddeutsch und kann die parallele, nicht näher spezifizierte Aussage des griechischen Verbs klarer tragen.
  terminology: »die Armen«, »was sie brauchen« und »ihre Seelen« sind treffend. Die wiederholte Wortwahl soll erhalten bleiben, damit die rhetorische und begriffliche Parallelität von πληροφοροῦσι sichtbar bleibt.
