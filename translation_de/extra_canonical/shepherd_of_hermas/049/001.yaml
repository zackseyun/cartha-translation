  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: de
  text: …machen sie ihren Reichtum vollständig, und umgekehrt machen die Reichen ihre Seelen vollständig, indem sie den Armen geben, was sie brauchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier zweimal mit »vollständig machen« wiedergegebene griechische Verb kann je nach Zusammenhang auch »erfüllen«, »vollenden« oder »zur Fülle bringen« bedeuten.
    reason: Die Wiederholung des Verbs ist für die wechselseitige Aussage entscheidend; die deutsche Wiedergabe soll seinen Bedeutungsumfang nicht unnötig auf eine einzige Nuance festlegen.
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: bringen … zur Fülle
  rationale: Bewahrt die zweimalige Verwendung desselben griechischen Verbs und das gegenseitige Ergänzen von Armen und Reichen. Die Formulierung lässt den Bedeutungsraum von »erfüllen«, »vollenden« und »zur Fülle bringen« bestehen.
- source_word: χορηγοῦντες
  choice: indem sie … geben
  rationale: Gibt das versorgende Bereitstellen natürlicher wieder als ein technisch klingendes »gewähren«.
- source_word: τοῖς πένησι τὰ δέοντα
  choice: den Armen …, was sie brauchen
  rationale: 'Entspricht dem konkreten Sinn: den Bedürftigen das Notwendige zukommen lassen.'
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ihre Seelen
  rationale: Behält die ausdrückliche anthropologische Redeweise des griechischen Textes bei, statt sie zu »sich selbst« abzuschwächen.
theological_decisions:
- issue: Wechselseitige Vervollständigung von Armen und Reichen
  choice: Die parallele Aussage wird ohne dogmatische Ausdeutung wiedergegeben.
  alternative: Das Verb als Erlangung von Heilsgewissheit oder als Verdienst vor Gott deuten.
  rationale: Der griechische Wortlaut beschreibt eine gegenseitige Wirkung, legt aber hier weder deren genaue Heilsbedeutung noch einen konfessionellen Lehrsatz fest.
- issue: Bezug von αὐτῶν nach τὸν πλοῦτον
  choice: »deren Reichtum« verweist im gegebenen Zusammenhang auf den Reichtum der Reichen.
  alternative: »ihren Reichtum« mit möglichem Bezug auf das Subjekt des unmittelbar vorausgehenden Satzteils.
  rationale: Der weitere Zusammenhang der Parabel stellt das Gebet der Armen und die materielle Gabe der Reichen als wechselseitige Ergänzung dar; »deren« macht diesen Bezug im Deutschen verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die bewusste Wiederholung von »zur Fülle bringen« bilden die rhetorische Struktur des griechischen Textes ab; »deren« vermeidet im ersten Halbvers einen irreführenden deutschen Pronomenbezug.
