  to: …machen sie ihren Reichtum vollständig, und umgekehrt machen die Reichen ihre Seelen vollständig, indem sie den Armen geben, was sie brauchen.[a]
  rationale: Die Revision glättet die deutsche Ausdrucksweise und ersetzt die stärker interpretierende Form »deren« durch die dem griechischen Pronomen entsprechende Form »ihren«. Die parallele Struktur, die ausdrückliche Rede von den Seelen und die zurückhaltende Fußnote zum Bedeutungsumfang des Verbs bleiben erhalten.
