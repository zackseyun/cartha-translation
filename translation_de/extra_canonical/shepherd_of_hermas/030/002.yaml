  source_fidelity: Der Entwurf gibt die Argumentation, die wiederholte Gleichsetzung von Umkehr und Einsicht sowie die intensiven Verben der Selbsterniedrigung und Bedrängnis insgesamt genau wieder. »für die Umkehr zuständig« ist jedoch für ἐπὶ τῆς μετανοίας εἰμί zu verwaltungssprachlich und schwächt die im Kontext erkennbare Beauftragung bzw. übergeordnete Rolle ab. Die Bildwendung ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ meint idiomatisch, dass die Tat dem Sünder ins Bewusstsein kommt; »steigt ihm ins Herz« ist im heutigen Deutschen nicht natürlich.
  naturalness: Die Rede ist überwiegend klar und würdig. »Der Umkehr vorangestellt« bewahrt einen gehobenen, frühchristlichen Registerton, ohne eine bestimmte Amtslehre festzulegen. »kommt ihm in den Sinn« ist eine natürliche deutsche Entsprechung für die griechische Herz-/Bewusstseinswendung.
  terminology: »Umkehr« und »Einsicht« sind als konsequent wiederholte Schlüsselbegriffe gut gewählt. »Der Umkehr vorangestellt« gibt die Sprecherrolle präziser wieder als »zuständig«, ohne den stärker institutionalisierenden Begriff »Amt« einzutragen. »Seele« für ψυχή bleibt erhalten.
