  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: de
  text: 'Er antwortete mir: »Ich«, sagte er, »bin der Umkehr vorangestellt und gebe allen, die umkehren, Einsicht. Oder meinst du nicht«, sagte er, »dass eben dies – umzukehren – Einsicht ist? Umzukehren«, sagte er, »ist große Einsicht. Denn wer gesündigt hat, erkennt, dass er vor dem Herrn Böses getan hat. Die Tat, die er begangen hat, kommt ihm in den Sinn; und er kehrt um und tut nicht länger Böses, sondern vollbringt reichlich Gutes. Er demütigt seine Seele und plagt sie, weil er gesündigt hat. Du siehst also: Umkehr ist große Einsicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  choice: Umkehr / umkehren
  rationale: Gibt die umfassende Sinnes- und Lebenswende wieder und bewahrt den wiederholten Wortstamm des Griechischen.
- source_word: σύνεσις / συνίει
  choice: Einsicht / erkennt
  rationale: Bezeichnet hier nicht bloß Wissen, sondern sittliches Verstehen, das zur Umkehr führt; im konkreten Satz klingt »erkennt« natürlicher als »versteht«.
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: ich bin für die Umkehr zuständig
  rationale: Die Wendung bezeichnet eine Beauftragung oder Zuständigkeit. Die Übersetzung bleibt natürlich, ohne eine nicht ausdrücklich genannte Einsetzung zu ergänzen.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: steigt ihm ins Herz
  rationale: Bewahrt das anschauliche Bild und den antiken Sitz von Erinnerung und innerer Einsicht.
- source_word: πολυτελῶς
  choice: reichlich
  rationale: Das Adverb beschreibt das Gute als in reichem, großzügigem Maß getan; »reichlich« passt idiomatisch zu »Gutes vollbringen«.
- source_word: βασανίζει
  choice: lässt sie leiden
  rationale: Bewahrt die Schärfe von innerer Peinigung bzw. Züchtigung, ohne im Deutschen vorschnell eine konkrete asketische Praxis festzulegen.
theological_decisions:
- issue: Verhältnis von Umkehr und Einsicht
  choice: Die Identifikation »Umkehr ist große Einsicht« wird unmittelbar beibehalten.
  alternative: Umkehr lediglich als Folge oder Ausdruck von Einsicht wiederzugeben.
  rationale: Der griechische Text setzt μετάνοια und σύνεσις ausdrücklich gleich; diese theologische Spannung darf nicht abgeschwächt werden.
- issue: Sprecherrolle gegenüber der Umkehr
  choice: »für die Umkehr zuständig«
  alternative: »über die Buße gesetzt« oder »der Umkehr vorangestellt«
  rationale: Die genaue Amtsvorstellung in ἐπὶ τῆς μετανοίας εἰμί bleibt etwas offen. Die gewählte Fassung vermittelt Verantwortung, ohne eine bestimmte kirchliche Amtslehre einzutragen.
- issue: Selbsterniedrigung und Leiden nach der Sünde
  choice: »Er demütigt seine Seele und lässt sie leiden«
  alternative: »Er demütigt und quält sich selbst«
  rationale: ψυχή wird ausdrücklich bewahrt; zugleich wird weder körperliche Selbstverletzung behauptet noch die ernste innere Züchtigung verharmlost.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Redezeichnung. Die auffällige Wiederholung »sagte er« und die Schlüsselwortkette Umkehr–umkehren sowie Einsicht–erkennen bleiben soweit im Deutschen natürlich erhalten. Keine Fußnoten erforderlich.
