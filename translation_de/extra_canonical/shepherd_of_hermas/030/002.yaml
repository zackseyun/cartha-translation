  - severity: low
    issue: »steigt ihm ins Herz«
    rationale: Die wörtlich bildnahe Formulierung ist im modernen Deutschen ungebräuchlich. Gemeint ist, dass die begangene Tat ihm in den Sinn bzw. ins Bewusstsein kommt.
