  source_fidelity: 'Der Text gibt den griechischen Ausgangstext vollständig und zutreffend wieder: die vom Herrn gewährte Würdigkeit, das dauerhafte Wohnen, die Bitte um geduldiges Ertragen weiterer Worte, die doppelte Unfähigkeit zu verstehen sowie die durch frühere Taten verursachte Verhärtung des Herzens. Die Verstärkungen λίαν und ὅλως οὐθέν bleiben in „sehr“ und „überhaupt nichts“ erkennbar.'
  naturalness: Die Übersetzung ist gut verständliches, würdiges Standarddeutsch. Die Satzfügung „Da …, so ertrage“ ist leicht gehoben, passt jedoch zum bittenden Charakter der Rede und ist nicht unnatürlich. Die Wiederholung von „verstehe“ und „begreife“ gestaltet das griechische Verstehensmotiv idiomatisch.
  terminology: „für würdig erachtet“, „bei mir wohnst“, „verhärtet“, „Einsicht“ und „unverständig“ sind im Kontext tragfähige Wiedergaben. Insbesondere wird die Ursache der Verhärtung nicht über den Text hinaus theologisch gedeutet. Gegenüber der englischen POB-Fassung besteht keine inhaltliche Abweichung.
