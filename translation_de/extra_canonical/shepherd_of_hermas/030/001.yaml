base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: de
  text: 'Ich fragte ihn wieder: „Da der Herr mich für würdig erachtet hat, dass du immer bei mir wohnst, so ertrage noch einige Worte von mir. Denn ich verstehe nichts, und mein Herz ist durch meine früheren Taten verhärtet worden. Gib mir Einsicht, denn ich bin sehr unverständig und begreife überhaupt nichts.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: mich für würdig erachtet hat
  rationale: Gibt das wertende ἡγέομαι mit prädikativem ἄξιον formal und zugleich idiomatisch wieder.
- source_word: μετ᾽ ἐμοῦ πάντοτε κατοικῇς
  choice: dass du immer bei mir wohnst
  rationale: Bewahrt die konkrete Bedeutung von κατοικέω und den final-konsekutiven Inhalt der ἵνα-Konstruktion.
- source_word: ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ
  choice: so ertrage noch einige Worte von mir
  rationale: ἀνέχομαι bezeichnet hier geduldiges Ertragen beziehungsweise Anhören; die leicht eindringliche Ausdrucksweise des Sprechers bleibt erhalten.
- source_word: οὐ συνίω οὐδέν
  choice: ich verstehe nichts
  rationale: Natürliches modernes Deutsch für die emphatische Verneinung, ohne ihre Aussage abzuschwächen.
- source_word: ἡ καρδία μου πεπώρωται
  choice: mein Herz ist … verhärtet worden
  rationale: Das Perfekt Passiv beschreibt einen eingetretenen und fortbestehenden Zustand der Verhärtung.
- source_word: ἀπὸ τῶν προτέρων μου πράξεων
  choice: durch meine früheren Taten
  rationale: ἀπό bezeichnet hier plausibel Ursache beziehungsweise Ursprung; „Taten“ wahrt den moralischen Bezug von πράξεις.
- source_word: συνέτισόν με
  choice: Gib mir Einsicht
  rationale: Gibt den kausativen Imperativ verständlich wieder und erhält den Wortzusammenhang mit συνίω.
- source_word: ἄφρων
  choice: unverständig
  rationale: Bezeichnet mangelnde Einsicht oder Vernunft; „unverständig“ passt zum wiederholten Motiv des Verstehens besser als das stärker abwertende „töricht“.
- source_word: ὅλως οὐθὲν νοῶ
  choice: ich begreife überhaupt nichts
  rationale: Bewahrt die verstärkende Totalverneinung und variiert entsprechend dem Wechsel von συνίω zu νοῶ.
theological_decisions:
- issue: Ursache der Herzensverhärtung
  choice: „durch meine früheren Taten verhärtet worden“
  alternative: „seit meinen früheren Taten verhärtet“ oder „von meinen früheren Taten her verhärtet“
  rationale: Der Kontext verbindet die Verhärtung moralisch mit den früheren Handlungen. Die Übersetzung hält diese Kausalität fest, ohne eine weitergehende Lehre über göttliche oder menschliche Verhärtung einzutragen.
- issue: Würdigkeit des Sprechers
  choice: „der Herr mich für würdig erachtet hat“
  alternative: „der Herr mich dessen gewürdigt hat“
  rationale: Die Formulierung bewahrt, dass die Würdigkeit als Urteil beziehungsweise gewährte Stellung des Herrn erscheint, und behauptet nicht ausdrücklich einen eigenen Verdienst.
translation_notes:
  register: Direkte, würdige Standardsprache mit bewusst beibehaltenen Wiederholungen des Verstehensmotivs. Der bittende und selbstanklagende Ton bleibt erhalten; unnötig altertümliche Wendungen wurden vermieden.
