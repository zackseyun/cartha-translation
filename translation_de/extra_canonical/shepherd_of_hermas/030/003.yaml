  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: de
  text: '„Darum“, sage ich, „erkundige ich mich bei dir, Herr, genau nach allem: erstens, weil ich ein Sünder bin, und zweitens, weil ich nicht weiß, durch welche Werke ich leben werde; denn meine Sünden sind zahlreich und vielfältig.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξακριβάζομαι
  choice: frage ich … so genau nach
  rationale: Gibt das gründliche, sorgfältige Erkundigen idiomatisch wieder.
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die ehrerbietige Anrede im Dialog; „Herr“ ist hier eine Anrede an den Gesprächspartner, nicht zwingend ein Gottestitel.
- source_word: ποῖα ἔργα ἐργαζόμενος
  choice: welche Werke ich tun muss
  rationale: Gibt die etymologische Verbindung von ἔργα und ἐργαζόμενος verständlich wieder; „Werke tun“ bewahrt zugleich die sachliche Offenheit des Ausdrucks.
- source_word: ζήσομαι
  choice: um zu leben
  rationale: Der futurische Gedanke wird im Deutschen nach der Frage nach den erforderlichen Handlungen natürlich als Ziel ausgedrückt, ohne die im Kontext mögliche religiöse Bedeutung des Lebens näher festzulegen.
- source_word: πολλαί … καὶ ποικίλαι
  choice: zahlreich und vielfältig
  rationale: Bildet sowohl die große Zahl als auch die Verschiedenartigkeit der Sünden ab.
theological_decisions:
- issue: Bedeutung von „leben“ (ζήσομαι)
  choice: leben
  alternative: gerettet werden / ewiges Leben haben
  rationale: Der griechische Text sagt schlicht „leben“. Die theologische Reichweite wird nicht ausdrücklich bestimmt und daher nicht vereindeutigt.
- issue: Verhältnis von Werken und Leben
  choice: welche Werke ich tun muss, um zu leben
  alternative: durch welche Taten ich das Leben erlangen werde
  rationale: Die Formulierung wahrt die im Ausgangstext bestehende Verbindung zwischen Tun und Leben, ohne daraus ein ausgearbeitetes Heilsmodell abzuleiten.
- issue: Anrede κύριε
  choice: Herr
  alternative: mein Herr / Herr Jesus
  rationale: Die respektvolle Anrede wird beibehalten, ohne den angesprochenen Boten mit Christus gleichzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt klar gegliedert; „erstens … und zweitens“ gibt πρῶτον μὲν … εἶτα natürlich wieder. Keine Fußnoten erforderlich.
