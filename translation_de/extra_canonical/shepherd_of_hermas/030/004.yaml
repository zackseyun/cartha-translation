  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/004.yaml
  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: de
  text: »Du wirst leben«, sagt er, »wenn du meine Gebote hältst und nach ihnen lebst. Und jeder, der diese Gebote hört und hält, wird für Gott leben.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃς / φυλάξῃ
  choice: hältst / hält
  rationale: Gibt das Bewahren und Befolgen von Geboten in natürlichem modernem Deutsch wieder.
- source_word: πορευθῇς ἐν αὐταῖς
  choice: nach ihnen lebst
  rationale: Die wörtliche Wendung »in ihnen wandelst« wäre heute ungewohnt; gemeint ist eine Lebensführung gemäß den Geboten.
- source_word: ζήσεται τῷ Θεῷ
  choice: wird für Gott leben
  rationale: Bewahrt den griechischen Dativ und die mögliche theologische Spannung, statt ihn eindeutig als »bei Gott« oder »durch Gott« auszulegen.
theological_decisions:
- issue: Bedingungssatz über Leben und Gebotstreue
  choice: »wenn du meine Gebote hältst«
  alternative: »sofern du meine Gebote hältst«
  rationale: Der einfache Konditionalsatz entspricht ἐάν mit Konjunktiv, ohne eine weitergehende soteriologische Systematisierung einzutragen.
- issue: Bedeutung von ζήσεται τῷ Θεῷ
  choice: »wird für Gott leben«
  alternative: »wird vor Gott leben«
  rationale: »Für Gott leben« bildet den Dativ am unmittelbarsten und idiomatisch ab; »vor Gott« würde eine nicht ausdrücklich markierte relationale Nuance hinzufügen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede und die Wiederholung von »Gebote« und »hält« bleiben erhalten; das idiomatische »nach ihnen leben« ersetzt das heute altertümlich wirkende »in ihnen wandeln«.
