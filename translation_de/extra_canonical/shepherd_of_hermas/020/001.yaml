  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/001.yaml
  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: de
  text: Doch in der zweiten Vision sahst du sie stehen. Ihr Gesicht war jünger und heiterer als zuvor, ihr Körper und ihr Haar dagegen älter. »Höre«, sagt sie, »auch dieses Gleichnis.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: Gesicht
  rationale: Bezeichnet hier das sichtbare Antlitz bzw. Erscheinungsbild; „Gesicht“ ist natürlich und wahrt den Gegensatz zu Körper und Haar.
- source_word: ἱλαρωτέραν
  choice: heiterer
  rationale: Gibt die sichtbar freundlichere, freudigere Erscheinung würdig und idiomatisch wieder.
- source_word: σάρκα
  choice: Körper
  rationale: Im Zusammenhang mit äußerem Alter ist „Körper“ im modernen Deutsch natürlicher als das missverständliche „Fleisch“.
- source_word: πρεσβυτέρας
  choice: älter
  rationale: Wahrt die einfache Vergleichsaussage des Griechischen ohne die Erscheinung als ausdrücklich greisenhaft zu überzeichnen.
- source_word: παραβολήν
  choice: Gleichnis
  rationale: Traditionelle und allgemein verständliche Wiedergabe einer veranschaulichenden Vergleichserzählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffällige Gegensatz zwischen jüngerem, heitererem Gesicht und älterem Körper und Haar bleibt ohne harmonisierende Erklärung erhalten.
