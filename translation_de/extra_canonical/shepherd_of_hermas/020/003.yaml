revisions:
- from: Denn er hatte Erbarmen mit euch und erneuerte euren Geist. Ihr legtet eure Mutlosigkeit ab, neue Kraft kam über euch, und ihr wurdet im Glauben gestärkt. Als der Herr sah, wie ihr erstarktet, freute er sich. Deshalb offenbarte er euch den Bau des Turmes; und er wird euch noch anderes offenbaren, wenn ihr von ganzem Herzen untereinander Frieden haltet.
  to: Denn er hatte Erbarmen mit euch und erneuerte eure Lebensgeister. Ihr legtet eure Schwäche ab, Kraft kam zu euch, und ihr wurdet im Glauben gestärkt. Als der Herr sah, dass ihr stark geworden wart, freute er sich. Deshalb offenbarte er euch den Bau des Turmes; und er wird euch noch anderes offenbaren, wenn ihr von ganzem Herzen untereinander Frieden haltet.
  rationale: Die Revision bewahrt die knappe, paränetische Sprache des Abschnitts, stellt aber Plural, Bedeutungsumfang und Aspekt der griechischen Formulierungen genauer dar. Sie vermeidet sowohl eine zusätzliche Qualifizierung der Kraft als auch eine konfessionell festgelegte Deutung von πνεύματα oder des Turms.
  reviewer_model: gpt-5.6-terra
