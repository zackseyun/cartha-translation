base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: de
  text: Denn er hatte Erbarmen mit euch und erneuerte eure Lebensgeister. Ihr legtet eure Schwäche ab, Kraft kam zu euch, und ihr wurdet im Glauben gestärkt. Als der Herr sah, dass ihr stark geworden wart, freute er sich. Deshalb offenbarte er euch den Bau des Turmes; und er wird euch noch anderes offenbaren, wenn ihr von ganzem Herzen untereinander Frieden haltet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη ἐφ’ ὑμᾶς
  choice: hatte Erbarmen mit euch
  rationale: Gibt die innige, mitfühlende Zuwendung idiomatisch und würdig wieder.
- source_word: ἀνενεώσατο τὰ πνεύματα ὑμῶν
  choice: erneuerte euren Geist
  rationale: Der griechische Plural bezeichnet hier den inneren Lebensmut der Gemeinschaft; der deutsche Kollektivsingular klingt natürlich, ohne einen ausdrücklichen Bezug auf den Heiligen Geist einzutragen.
- source_word: ἀπέθεσθε τὰς μαλακίας ὑμῶν
  choice: legtet eure Mutlosigkeit ab
  rationale: μαλακία meint im Kontext die zuvor geschilderte Schwäche und Niedergeschlagenheit, nicht körperliche Weichheit oder moralische Ausschweifung.
- source_word: προσῆλθεν ὑμῖν ἰσχυρότης
  choice: neue Kraft kam über euch
  rationale: Bewahrt die Bewegung des griechischen Ausdrucks und macht den inhaltlichen Kontrast zur Mutlosigkeit deutlich; „neue“ ist kontextuell erschlossen.
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: ihr wurdet im Glauben gestärkt
  rationale: Nahe, natürliche Wiedergabe des Passivs und der Sphäre der Stärkung.
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: den Bau des Turmes
  rationale: οἰκοδομή kann Bauvorgang oder Bauwerk meinen; im unmittelbaren Kontext der Turmvision passt der offene Ausdruck „Bau“.
- source_word: ἐξ ὅλης καρδίας εἰρηνεύετε ἐν ἑαυτοῖς
  choice: von ganzem Herzen untereinander Frieden haltet
  rationale: Gibt die fortdauernde gemeinschaftliche Friedenshaltung wieder und vermeidet das missverständliche reflexive „in euch selbst“.
theological_decisions:
- issue: Bezug von τὰ πνεύματα ὑμῶν
  choice: euren Geist
  alternative: eure Geister
  rationale: Der Text spricht von der erneuerten inneren Lebenskraft der Adressaten. Die Formulierung bleibt von einer ausdrücklichen Identifikation mit dem Heiligen Geist frei.
- issue: Bedingung weiterer Offenbarung
  choice: wenn ihr von ganzem Herzen untereinander Frieden haltet
  alternative: wenn ihr euch von ganzem Herzen untereinander friedlich verhaltet
  rationale: Die reale Bedingungsstruktur ἐάν mit Konjunktiv bleibt bestehen; sie wird weder als Verdienstlehre erklärt noch abgeschwächt.
- issue: Bedeutung des Turmbaus
  choice: ohne auslegenden Zusatz
  alternative: den Bau der Kirche
  rationale: Obwohl der Turm im größeren Werk symbolisch gedeutet wird, nennt dieser Vers nur den Turm. Die Übersetzung importiert die Deutung nicht in den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Kraft-Terminologie des Griechischen wird durch „Kraft“, „gestärkt“ und „erstarktet“ hörbar gehalten, ohne im Deutschen schwerfällig zu wirken.
