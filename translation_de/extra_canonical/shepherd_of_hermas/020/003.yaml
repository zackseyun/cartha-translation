review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf trifft den Gedankengang und die Satzbezüge insgesamt zuverlässig. Zwei Nuancen sollten jedoch enger am Griechischen bleiben: τὰ πνεύματα ὑμῶν ist Plural und bezeichnet hier am natürlichsten die erneuerten „Lebensgeister“; außerdem fügt „neue Kraft“ mit „neu“ ein im Wortlaut nicht ausgedrücktes Element hinzu. Die Umschreibung von τὴν ἰσχυροποίησιν ὑμῶν als „wie ihr erstarktet“ ist möglich, gibt das resultative Substantiv aber weniger präzise wieder als „dass ihr stark geworden wart“.'
  naturalness: Die Sprache ist klar, würdig und modernes Standarddeutsch. „Lebensgeister“ ist in diesem bildhaften Kontext idiomatisch und verhindert zugleich eine unnötige Singularisierung oder pneumatologische Festlegung von πνεύματα. „Kraft kam zu euch“ ist natürlicher und näher am Bewegungsverb προσῆλθεν als „kam über euch“.
  terminology: „Erbarmen“, „im Glauben gestärkt“, „Bau des Turmes“ und „von ganzem Herzen untereinander Frieden haltet“ sind angemessen. „Schwäche“ bildet μαλακίας neutraler und quellennäher ab als die stärker konkretisierende „Mutlosigkeit“.
  issues:
  - severity: low
    issue: Plural τὰ πνεύματα wird als Singular „euren Geist“ wiedergegeben.
    rationale: Der deutsche Kollektivsingular ist möglich, aber „eure Lebensgeister“ bewahrt den Plural und den Kontext der wiedergewonnenen inneren Lebenskraft besser, ohne den Heiligen Geist einzutragen.
  - severity: low
    issue: „neue Kraft“ ergänzt „neu“.
    rationale: Die Erneuerung steht zuvor ausdrücklich bei den πνεύματα, doch ἰσχυρότης selbst wird nicht als „neu“ qualifiziert.
  - severity: low
    issue: „wie ihr erstarktet“ gibt τὴν ἰσχυροποίησιν ὑμῶν nur angenähert wieder.
    rationale: Der Ausdruck bezeichnet ihre erfolgte Stärkung; „dass ihr stark geworden wart“ gibt dies idiomatisch und resultativ wieder.
  revised_text: Denn er hatte Erbarmen mit euch und erneuerte eure Lebensgeister. Ihr legtet eure Schwäche ab, Kraft kam zu euch, und ihr wurdet im Glauben gestärkt. Als der Herr sah, dass ihr stark geworden wart, freute er sich. Deshalb offenbarte er euch den Bau des Turmes; und er wird euch noch anderes offenbaren, wenn ihr von ganzem Herzen untereinander Frieden haltet.
