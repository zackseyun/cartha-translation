revisions:
- from: Wenn ein alter Mann wegen seiner Schwäche und Armut alle Hoffnung für sich aufgegeben hat, erwartet er nichts anderes mehr als den letzten Tag seines Lebens. Dann wird ihm plötzlich ein Erbe hinterlassen. Als er davon hört, richtet er sich auf; überglücklich geworden, zieht er Kraft an. Er liegt nicht länger da, sondern steht; sein Geist, der durch seine früheren Taten bereits zugrunde gerichtet war, wird erneuert; und er sitzt nicht länger da, sondern fasst Mut. So war es auch bei euch, als ihr die Offenbarung hörtet, die der Herr euch offenbarte.
  to: Wenn ein alter Mann wegen seiner Schwäche und Armut alle Hoffnung für sich aufgegeben hat, erwartet er nichts anderes mehr als den letzten Tag seines Lebens. Dann wird ihm plötzlich eine Erbschaft hinterlassen. Als er davon hört, richtet er sich auf; überglücklich geworden, kleidet er sich in Kraft. Er liegt nicht länger da, sondern steht; sein Geist, der durch seine früheren Taten bereits zugrunde gerichtet war, wird erneuert; und er sitzt nicht länger da, sondern fasst Mut. So war es auch bei euch, als ihr die Offenbarung hörtet, die der Herr euch offenbarte.
  rationale: Die Revision berichtigt κληρονομία zu „Erbschaft“ und ersetzt die unidiomatische Formulierung zur Bekleidungsmetapher durch „kleidet er sich in Kraft“. Im Übrigen bleibt die Übersetzung unverändert, einschließlich der vorsichtigen Wiedergabe von ἐφθαρμένον als „zugrunde gerichtet“ und der deutschen Vervollständigung des über die Abschnittsgrenze laufenden Vergleichs.
