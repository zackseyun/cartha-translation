  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und Bildsprache des Griechischen zuverlässig wieder: Verzweiflung wegen Schwäche und Armut, unerwartete Erbschaft, Aufrichten, Stehen und Erneuerung des durch frühere Taten geschädigten Geistes. Auch die abschließende Anwendung auf die Adressaten ist sachgerecht als im Deutschen notwendige Vervollständigung der im Griechischen über den Abschnittsrand fortlaufenden Konstruktion formuliert.'
  naturalness: Weitgehend modernes, würdiges Deutsch. „zieht er Kraft an“ ist jedoch keine natürliche deutsche Realisierung der Kleidungsmetapher und kann missverständlich wirken. „kleidet er sich in Kraft“ erhält die Metapher bei klarerem Ausdruck.
  terminology: „Erbe“ bezeichnet im heutigen Deutsch gewöhnlich die erbende Person; für κληρονομία ist hier „Erbschaft“ erforderlich. „Offenbarung“, „Glaube“ und „fasst Mut“ sind treffend und legen keine zusätzliche dogmatische Deutung nahe.
  issues:
  - severity: medium
    issue: „Erbe“ statt „Erbschaft“
    rationale: κληρονομία bezeichnet die hinterlassene Erbschaft bzw. das Erbe als Nachlass, nicht den Erben als Person. Die Formulierung „ein Erbe wird ihm hinterlassen“ ist daher semantisch ungenau und im Deutschen missverständlich.
  - severity: low
    issue: Unidiomatische Wendung „zieht er Kraft an“
    rationale: Die griechische Bekleidungsmetapher ἐνεδύσατο τὴν ἰσχύν sollte bewahrt werden, aber in einer im modernen Deutsch verständlichen Form.
