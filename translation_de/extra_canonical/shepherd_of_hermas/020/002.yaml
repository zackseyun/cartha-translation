base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: de
  text: Wenn ein alter Mann wegen seiner Schwäche und Armut alle Hoffnung für sich aufgegeben hat, erwartet er nichts anderes mehr als den letzten Tag seines Lebens. Dann wird ihm plötzlich eine Erbschaft hinterlassen. Als er davon hört, richtet er sich auf; überglücklich geworden, kleidet er sich in Kraft. Er liegt nicht länger da, sondern steht; sein Geist, der durch seine früheren Taten bereits zugrunde gerichtet war, wird erneuert; und er sitzt nicht länger da, sondern fasst Mut. So war es auch bei euch, als ihr die Offenbarung hörtet, die der Herr euch offenbarte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: alle Hoffnung für sich aufgegeben hat
  rationale: Gibt die reflexive Wendung idiomatisch wieder, ohne die Hoffnungslosigkeit abzuschwächen.
- source_word: πτωχότητα
  choice: Armut
  rationale: Die direkte und im Zusammenhang natürliche Entsprechung.
- source_word: ἐξηγέρθη
  choice: richtet er sich auf
  rationale: Bewahrt sowohl die körperliche Bildlichkeit als auch den Sinn eines neuen inneren Aufbruchs.
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: zieht er Kraft an
  rationale: Erhält bewusst die ungewöhnliche griechische Bekleidungsmetapher.
- source_word: ἀνανεοῦται
  choice: wird erneuert
  rationale: Bildet das Passiv und das Motiv der Wiederherstellung genau ab.
- source_word: ἐφθαρμένον
  choice: zugrunde gerichtet
  rationale: Gibt die starke Bedeutung von φθείρω wieder, ohne zwingend moralische Verderbtheit als einzige Nuance festzulegen.
- source_word: ἀνδρίζεται
  choice: fasst Mut
  rationale: Eine natürliche, geschlechtsübergreifend verständliche Wiedergabe der Aufforderung beziehungsweise Entwicklung zu mutigem Handeln.
theological_decisions:
- issue: Art und Wirkung der Offenbarung
  choice: die Offenbarung, die der Herr euch offenbarte
  alternative: die Enthüllung, die der Herr euch enthüllte
  rationale: Bewahrt die etymologische Wiederholung von ἀποκάλυψιν/ἀπεκάλυψεν und vermeidet eine nähere dogmatische Bestimmung ihres Inhalts.
- issue: Zustand des Geistes durch frühere Taten
  choice: durch seine früheren Taten bereits zugrunde gerichtet
  alternative: durch sein früheres Handeln bereits verdorben
  rationale: Lässt offen, ob körperliche Schwächung, moralische Schädigung oder beides gemeint ist, und erhält die Verbindung zu den Taten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Abfolge der körperlichen Bilder — liegen, sich aufrichten, stehen, sitzen — sowie die markante Metapher vom Anziehen der Kraft bleiben erhalten. Der letzte Satz folgt dem griechischen Aorist und bezieht den Vergleich auf das bereits erfolgte Hören.
