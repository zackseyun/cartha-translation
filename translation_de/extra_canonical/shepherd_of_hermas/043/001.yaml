lexical_decisions:
- source_word: Ἤθελον
  choice: Ich wollte
  rationale: Gibt das Imperfekt schlicht und natürlich wieder; im Zusammenhang bezeichnet es den geäußerten Wunsch, etwas zu erfahren.
- source_word: κύριε
  choice: Herr
  rationale: Die respektvolle Anrede wird in würdigem, modernem Standarddeutsch wiedergegeben.
- source_word: ποίοις τρόποις
  choice: auf welche Weisen
  rationale: Bewahrt den Plural und die Frage nach der Art beziehungsweise den verschiedenen Formen des Handelns.
- source_word: δουλεῦσαι
  choice: dienen muss
  rationale: Gibt die Grundbedeutung von δουλεύω mit dem im Deutschen passenden Dativ wieder; δεῖ wird als Notwendigkeit durch „muss“ ausgedrückt.
- source_word: τῇ ἐπιθυμίᾳ
  choice: dem Verlangen
  rationale: „Verlangen“ wahrt die mögliche positive oder negative Bedeutung von ἐπιθυμία und legt sich nicht vorschnell auf „Begierde“ im ausschließlich negativen Sinn fest.
theological_decisions:
- issue: Moralische Bewertung von ἐπιθυμία
  choice: Verlangen
  alternative: Begierde
  rationale: Der vorliegende Ausschnitt nennt das Verlangen, ohne seine moralische Qualität vollständig erkennen zu lassen. Die neutralere Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Direkte, würdige Dialogsprache in modernem Standarddeutsch. Die ungewöhnliche Vorstellung, einem Verlangen zu „dienen“, bleibt erhalten, statt interpretierend geglättet zu werden.
