  source_fidelity: 'Die Übersetzung gibt die im griechischen Text erhaltenen Aussagen zuverlässig wieder: die Nichtbeachtung der Gebote, die problematische bzw. beschädigte Überlieferung beim folgenden Satz, die negativen Eigenschaften der Gebote des Teufels, dessen begrenzte Macht gegen die Angesprochenen sowie die Autorität des Engels der Umkehr. Der Wechsel von Singular zu Plural entspricht der Vorlage. Die Fußnote kennzeichnet die textkritische Unsicherheit angemessen, ohne eine bestimmte Rekonstruktion als gesichert auszugeben.'
  naturalness: Modernes, gut lesbares und würdiges Standarddeutsch. Die Folge aus singularischem »du« und pluralischem »Fürchtet euch« wirkt wegen des in der Vorlage vorliegenden Adressatenwechsels nicht störend. »Der Teufel verfügt nur über Furcht« ist im Kontext verständlich und gibt die bildhafte Aussage idiomatisch wieder.
  terminology: »Gebote«, »Teufel«, »Engel der Umkehr«, »Macht«, »Furcht« und »Kraft« sind sachgerecht und registerangemessen. »Umkehr« für μετάνοια ist neutral, verständlich und vermeidet eine unnötig konfessionelle Engführung. »zügellos« trifft ἀσελγέσι angemessen.
