base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: de
  text: 'Ich sage dir: Wenn du diese Gebote nicht hältst, sondern sie vernachlässigst, dann folge nicht den Geboten des Teufels[a]; sie sind schwer, bitter, grausam und zügellos. Fürchtet euch nicht vor dem Teufel, denn er hat keine Macht über euch. Denn ich werde bei euch sein – ich, der Engel der Umkehr, der über ihn Herr ist. Der Teufel verfügt nur über Furcht, doch seine Furcht hat keine Kraft. Fürchtet ihn also nicht, dann wird er von euch fliehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle offenbar beschädigt. Der Zusammenhang verlangt sinngemäß: »dann folge nicht den Geboten des Teufels«.'
    reason: Die überlieferte Wortfolge οὐχ οἱ ταῖς ἐντολαῖς πορευόμενοι ist grammatisch gestört. Die Übersetzung folgt der durch Kontext und Satzfortgang nahegelegten Rekonstruktion und kennzeichnet diese transparent.
lexical_decisions:
- source_word: παρενθυμηθῇς
  choice: sie vernachlässigst
  rationale: Das seltene Verb bezeichnet hier, dass man die Gebote außer Acht lässt bzw. sich nicht um sie kümmert; »vernachlässigen« gibt dies natürlich und ohne unnötige Spezifizierung wieder.
- source_word: ἐντολαῖς … τοῦ διαβόλου
  choice: Geboten des Teufels
  rationale: Bewahrt den bewussten Gegensatz zwischen den zuvor genannten Geboten und den Weisungen des Teufels.
- source_word: ἀγρίαις
  choice: grausam
  rationale: Im Zusammenhang mit »schwer«, »bitter« und »zügellos« bezeichnet ἀγρίαις etwas Wildes, Rohes oder Grausames; »grausam« ist im Deutschen idiomatisch und trifft die negative ethische Färbung.
- source_word: ἀσελγέσι
  choice: zügellos
  rationale: Gibt den Sinn von moralischer Hemmungslosigkeit wieder, ohne ihn ausschließlich auf sexuelle Ausschweifung einzuengen.
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: der Engel der Umkehr
  rationale: μετάνοια bezeichnet eine innere und praktische Umkehr; »Umkehr« ist hier verständlicher und umfassender als das enger oder kirchensprachlich wirkende »Buße«.
- source_word: ὁ κατακυριεύων αὐτοῦ
  choice: der über ihn Herr ist
  rationale: Drückt die ausgesagte Überlegenheit über den Teufel klar aus, ohne eine weitergehende metaphysische Erklärung einzutragen.
- source_word: τόνον οὐκ ἔχει
  choice: hat keine Kraft
  rationale: τόνος bezeichnet hier Spannkraft, Nachdruck oder Wirksamkeit. »Keine Kraft« bewahrt die pointierte Aussage und klingt natürlich.
theological_decisions:
- issue: Macht des Teufels gegenüber den Angesprochenen
  choice: er hat keine Macht über euch
  alternative: in ihm ist keine Macht gegen euch
  rationale: 'Die idiomatische Wiedergabe wahrt die relationale Begrenzung καθ’ ὑμῶν: Verneint wird seine Macht gegen die Angesprochenen, nicht notwendigerweise jede Macht überhaupt.'
- issue: Identität und Autorität des Engels der Umkehr
  choice: ich, der Engel der Umkehr, der über ihn Herr ist
  alternative: ich, der Engel der Umkehr, der ihn beherrscht
  rationale: Die Apposition und die ausgesagte Überordnung werden bewahrt, ohne die Figur näher zu identifizieren oder eine konfessionelle Engellehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom Singular (»dir«, »du«) zum Plural (»euch«, »ihr«) folgt dem griechischen Text und wurde nicht harmonisiert. Die direkte Rede endet mit dem im Konsultationstext vorausgesetzten Schlusszeichen.
