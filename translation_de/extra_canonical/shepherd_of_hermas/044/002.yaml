base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: de
  text: 'Er antwortete mir: »Wenn du dir vornimmst, dass sie befolgt werden können, wirst du sie leicht befolgen, und sie werden nicht schwer sein. Wenn aber in deinem Herzen bereits der Gedanke aufgekommen ist, dass sie von einem Menschen nicht befolgt werden können, wirst du sie nicht befolgen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: dir vornimmst
  rationale: Gibt den willentlichen inneren Entschluss natürlich wieder, ohne das Verb auf bloßes Denken zu reduzieren.
- source_word: φυλαχθῆναι / φυλάξεις
  choice: befolgt werden / befolgen
  rationale: Im Zusammenhang mit Geboten bezeichnet φυλάσσω das Beachten und Einhalten; „befolgen“ ist im modernen Deutsch idiomatisch und bewahrt den wiederholten Wortstamm.
- source_word: σκληραί
  choice: schwer
  rationale: Hier ist die Schwierigkeit der Gebote gemeint; „schwer“ entspricht dem Kontext natürlicher als das wörtlichere „hart“.
- source_word: ἐπὶ τὴν καρδίαν σου ... ἀναβῇ
  choice: in deinem Herzen ... der Gedanke aufgekommen ist
  rationale: Bewahrt das Bild des Aufsteigens im Herzen in verständlichem Deutsch und macht den im Griechischen elliptischen Gedankeninhalt ausdrücklich.
- source_word: ὑπὸ ἀνθρώπου
  choice: von einem Menschen
  rationale: Erhält die generische Einzahl und die Aussage über menschliche Befähigung, ohne sie geschlechtsspezifisch zu verengen.
theological_decisions:
- issue: Verhältnis von innerer Überzeugung und Gehorsam
  choice: 'Die konditionale Aussage bleibt unverändert stehen: Der innere Entschluss beeinflusst die tatsächliche Befolgung.'
  alternative: Die Aussage als Verheißung göttlicher Befähigung oder als Lehre rein menschlicher Willenskraft erläutern.
  rationale: Der griechische Satz benennt weder ausdrücklich göttliche Gnade noch autonome Willenskraft; die Übersetzung darf diese theologische Spannung nicht auflösen.
translation_notes:
  register: Natürliches, würdiges modernes Standarddeutsch. Die direkte Rede und die Wiederholung von „befolgen“ bilden die argumentative Struktur des griechischen Textes ab.
