  text: But I do not know whether these commandments can be kept by a human being, because they are very hard.
translation:
  language: de
  text: Doch ich weiß nicht, ob diese Gebote von einem Menschen eingehalten werden können, denn sie sind sehr schwer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαί
  choice: Gebote
  rationale: Die übliche und sachlich passende Wiedergabe für verbindliche Weisungen in einem religiös-ethischen Kontext.
- source_word: φυλαχθῆναι
  choice: eingehalten werden
  rationale: Bewahrt den passiven Sinn von ‚beachten/halten‘ und klingt im modernen Deutschen in Verbindung mit Geboten natürlich.
- source_word: σκληραί
  choice: schwer
  rationale: Im Kontext bezeichnet das Wort die Schwierigkeit der Befolgung; ‚hart‘ wäre zwar formnäher, hier aber weniger idiomatisch.
- source_word: λίαν
  choice: sehr
  rationale: Gibt die deutliche Verstärkung schlicht und vollständig wieder.
theological_decisions:
- issue: Menschliche Fähigkeit, die Gebote einzuhalten
  choice: 'Die Aussage bleibt als Unsicherheit formuliert: „ich weiß nicht, ob … können“.'
  alternative: Die Gebote ausdrücklich als unerfüllbar oder als sicher erfüllbar darstellen.
  rationale: Der griechische Text äußert an dieser Stelle Zweifel, entscheidet die Frage aber noch nicht; diese Spannung darf nicht vorweggenommen werden.
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch mit würdigem, schlichtem Ton. Die Satzstruktur bleibt eng am griechischen Ausgangstext.
