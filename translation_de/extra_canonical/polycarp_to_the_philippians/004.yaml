base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: de
  text: 'Brüder und Schwestern,[a] ich schreibe euch dies über die Gerechtigkeit, nicht weil ich mir diese Aufgabe selbst gestellt habe, sondern weil ihr mich darum gebeten habt.


    Denn weder ich noch irgendein anderer meinesgleichen ist imstande, der Weisheit des seligen und herrlichen Paulus zu folgen. Als er zu euch kam, lehrte er den damals lebenden Menschen persönlich, sorgfältig und zuverlässig das Wort der Wahrheit. Auch als er abwesend war, schrieb er euch einen Brief. Wenn ihr ihn aufmerksam lest, könnt ihr in dem euch geschenkten Glauben aufgebaut werden.


    Dieser Glaube ist unser aller Mutter; die Hoffnung folgt ihm, und die Liebe geht ihm voraus – die Liebe zu Gott und Christus und zu unserem Nächsten. Denn wer sich diesen Dingen widmet, hat das Gebot der Gerechtigkeit erfüllt; wer Liebe hat, ist fern von jeder Sünde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“; die Anrede meint hier die ganze Gemeinde.'
    reason: Macht die Form des zugrunde liegenden englischen Zeugnisses transparent und gibt zugleich den inklusiven Adressatenkreis verständlich wieder.
lexical_decisions:
- source_word: brethren
  choice: Brüder und Schwestern
  rationale: Die Anrede bezeichnet die gesamte Gemeinde; die inklusive Wiedergabe macht den gemeinten Personenkreis im heutigen Deutsch deutlich, während die Fußnote die wörtliche Form nennt.
- source_word: righteousness
  choice: Gerechtigkeit
  rationale: Bewahrt den ethisch-theologischen Leitbegriff und den Zusammenhang mit dem später genannten Gebot der Gerechtigkeit.
- source_word: the word which concerneth truth
  choice: das Wort der Wahrheit
  rationale: Eine natürliche deutsche Formulierung, die den sachlichen Bezug von Wort und Wahrheit erhält, ohne ihn weiter auszudeuten.
- source_word: faith given to you
  choice: der euch geschenkte Glaube
  rationale: Gibt den passiven Gedanken des empfangenen beziehungsweise gegebenen Glaubens idiomatisch wieder.
- source_word: mother of us all
  choice: unser aller Mutter
  rationale: Bewahrt das auffällige mütterliche Bild unverändert.
- source_word: be occupied with these
  choice: sich diesen Dingen widmen
  rationale: Natürliches modernes Deutsch für eine beständige Ausrichtung auf Glaube, Hoffnung und Liebe.
theological_decisions:
- issue: Bezug von „welche unser aller Mutter ist“
  choice: Bezug auf den Glauben
  alternative: Bezug auf die unmittelbar zuvor erwähnte briefliche Unterweisung oder eine weiter gefasste Größe
  rationale: Der nächstliegende grammatische und gedankliche Bezug im überlieferten englischen Zeugen ist „Glaube“; die Formulierung bleibt jedoch bildhaft und wird nicht dogmatisch erläutert.
- issue: Reihenfolge von Glaube, Hoffnung und Liebe
  choice: 'Die ungewöhnliche Bewegungsmetaphorik bleibt erhalten: Hoffnung folgt, Liebe geht voraus.'
  alternative: Glättung zu einer bloßen Aufzählung der drei Tugenden
  rationale: Die eigentümliche Reihenfolge und Spannung des Zeugnisses soll nicht harmonisiert werden.
- issue: „fern von jeder Sünde“
  choice: Die umfassende Aussage wird formal bewahrt.
  alternative: Abschwächung zu „meidet viele Sünden“ oder Deutung als vollkommene Sündlosigkeit
  rationale: Der Text spricht stark und aphoristisch; weder eine Abschwächung noch eine systematische Lehre von Sündlosigkeit sollte in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Sätzen. Da eine direkte Prüfung der griechischen und lateinischen Überlieferung noch aussteht, ist dies ein vorläufiger, quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses; strittige Syntax wurde nicht unnötig dogmatisch ausgedeutet.
