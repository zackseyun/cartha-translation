base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: de
  text: '**Polykarp an die Philipper 4**


    Doch die Geldliebe ist der Anfang aller Nöte. Da wir nun wissen, dass wir nichts in die Welt mitgebracht haben und auch nichts aus ihr hinaustragen können, wollen wir uns mit den Waffen der Gerechtigkeit rüsten. Zuerst wollen wir uns selbst lehren, nach dem Gebot des Herrn zu leben.


    Dann sollen wir auch unsere Frauen lehren, in dem Glauben, der ihnen gegeben worden ist, sowie in Liebe und Reinheit zu leben. Sie sollen ihren eigenen Männern in aller Aufrichtigkeit zugetan sein, alle Menschen gleichermaßen in aller Selbstbeherrschung lieben und ihre Kinder in der Zucht der Gottesfurcht erziehen.


    Unsere Witwen sollen im Blick auf den Glauben an den Herrn besonnen sein, unablässig für alle Menschen Fürbitte leisten und sich jeder Verleumdung, üblen Nachrede, falschen Aussage, Geldliebe und alles Bösen enthalten. Sie wissen ja, dass sie Gottes Altar sind, dass alle Opfer sorgfältig auf Fehler geprüft werden[a] und dass ihm nichts entgeht: weder ihre Gedanken noch ihre Absichten noch irgendetwas von dem, was im Herzen verborgen ist.


    [a] Das Bild bezeichnet die sorgfältige Prüfung eines Opfers auf mögliche Mängel; entsprechend liegt das ganze innere und äußere Leben offen vor Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild bezeichnet die sorgfältige Prüfung eines Opfers auf mögliche Mängel; entsprechend liegt das ganze innere und äußere Leben offen vor Gott.
    reason: Erläutert die kultische Prüfmetapher, die bei einer bloßen Wiedergabe als „sorgfältig geprüft“ leicht übersehen wird.
lexical_decisions:
- source_word: φιλαργυρία / love of money
  choice: Geldliebe
  rationale: Gibt die ungeordnete Liebe zum Geld präziser wieder als das allgemeinere „Habgier“ und bewahrt die erkennbare Anspielung auf 1 Tim 6,10.
- source_word: πάντων χαλεπῶν / all troubles
  choice: aller Nöte
  rationale: Das substantivierte Ausdrucksfeld bezeichnet belastende, schlimme oder schwierige Dinge. „Nöte“ ist natürlich und lässt die Breite des Ausdrucks bestehen.
- source_word: ὅπλα τῆς δικαιοσύνης / armor or weapons of righteousness
  choice: Waffen der Gerechtigkeit
  rationale: Der Plural bezeichnet eher Waffen beziehungsweise eine Kampfausrüstung als einen einzelnen Schutzpanzer; die militärische Metapher bleibt erhalten.
- source_word: περιπατεῖν / walk
  choice: leben
  rationale: Das semitisch-biblische Bild des Wandelns bezeichnet die Lebensführung. „Leben“ ist im modernen Deutschen unmittelbar verständlich, ohne den Sinn einzuengen.
- source_word: στεργούσας / cherishing
  choice: zugetan sein
  rationale: Drückt beständige, familiäre Zuneigung aus, ohne einen bloß gefühlsbetonten oder besitzanzeigenden Klang.
- source_word: ἐγκράτεια / chastity, self-control
  choice: Selbstbeherrschung
  rationale: Der Begriff ist weiter als sexuelle Keuschheit und bezeichnet beherrschte, enthaltsame Lebensführung; der Zusammenhang mit Reinheit bleibt bestehen.
- source_word: παιδεία / training, discipline
  choice: Zucht
  rationale: Bewahrt den Gedanken einer formenden Erziehung und entspricht dem würdevollen frühchristlichen Register; „Zucht“ ist hier nicht als körperliche Bestrafung gemeint.
- source_word: νήφειν / be sober-minded
  choice: besonnen sein
  rationale: Überträgt die ethisch-geistige Wachheit idiomatisch und vermeidet die Verengung auf Alkoholabstinenz.
- source_word: θυσιαστήριον θεοῦ / God’s altar
  choice: Gottes Altar
  rationale: Bewahrt die starke kultische Metapher ohne erklärende Abschwächung.
theological_decisions:
- issue: Verhältnis von göttlichem Gebot und menschlicher Unterweisung
  choice: „Zuerst wollen wir uns selbst lehren … Dann sollen wir auch unsere Frauen lehren“
  alternative: „Zuerst wollen wir selbst … leben; ebenso unsere Frauen“
  rationale: Die überlieferte Satzführung verbindet Selbstunterweisung und die Unterweisung der Frauen. Die Übersetzung bewahrt diese Abfolge, ohne daraus eine weitergehende Lehraussage über Autorität abzuleiten.
- issue: „Unsere Witwen“ als gemeindliche Gruppe
  choice: „Unsere Witwen“
  alternative: „Die Witwen unter uns“
  rationale: Die wörtliche, gemeinschaftlich-fürsorgliche Bezeichnung bleibt erhalten und wird nicht vorschnell als festes kirchliches Amt interpretiert.
- issue: Witwen als Gottes Altar
  choice: Metapher unverändert wiedergegeben
  alternative: Erklärende Wiedergabe als Empfängerinnen von Gaben oder als Fürbitterinnen
  rationale: Der Text entfaltet die genaue dogmatische Bedeutung der Metapher nicht. Eine Auflösung würde eine bestimmte Deutung importieren.
- issue: Gottes Prüfung des Verborgenen
  choice: „ihm nichts entgeht“
  alternative: „Gott richtet alles“
  rationale: Die Aussage betrifft Gottes vollständige Kenntnis und Prüfung; sie wird nicht ausdrücklich zu einer Aussage über das Endgericht erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar frühchristlich-biblischem Ton. Satzbau und Absätze wurden für heutige Lesbarkeit behutsam gegliedert. Die Fassung ist angesichts der angegebenen noch ausstehenden direkten Prüfung der griechischen und lateinischen Überlieferung als quellenorientierter Publikationsentwurf zu verstehen.
