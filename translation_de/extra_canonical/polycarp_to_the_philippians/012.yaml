base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: de
  text: 'Ich war tief betrübt über Valens, der früher Ältester unter euch war, weil er das ihm anvertraute Amt so wenig versteht. Darum ermahne ich euch: Haltet euch von Habgier fern und seid rein und wahrhaftig. Meidet alles Böse.


    Wer sich aber in diesen Dingen nicht selbst beherrschen kann – wie kann der es einem anderen gebieten? Wer sich nicht von Habgier fernhält, wird durch Götzendienst befleckt werden und als einer von den Völkern gerichtet werden, die das Gericht des Herrn nicht kennen. Wissen wir denn nicht, dass die Heiligen die Welt richten werden, wie Paulus lehrt?


    Bei euch jedoch habe ich so etwas weder festgestellt noch davon gehört. Unter euch hat der selige Paulus gewirkt, und ihr wart am Anfang seine Briefe.[a] Denn in allen Gemeinden, die damals allein Gott kannten, rühmt er sich euer; wir nämlich kannten ihn noch nicht.


    Darum bin ich tief betrübt über ihn und seine Frau. Möge der Herr ihnen wahre Umkehr schenken. Seid auch ihr selbst in dieser Sache besonnen. Betrachtet solche Menschen nicht als Feinde, sondern bringt sie als schwache und irrende Glieder wieder zurecht, damit ihr euren ganzen Leib rettet. Denn wenn ihr so handelt, baut ihr einander auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. nach der überlieferten ungewöhnlichen Wendung: „ihr wart am Anfang seine Briefe“. Gemeint sein kann, dass die Gemeinde durch ihr Leben wie ein Empfehlungsschreiben für Paulus war. Eine direkte Prüfung des griechischen und lateinischen Wortlauts steht noch aus.'
    reason: Die auffällige Metapher ist textlich und inhaltlich erklärungsbedürftig, soll aber nicht stillschweigend geglättet werden.
lexical_decisions:
- source_word: presbyter
  choice: Ältester
  rationale: Gibt die frühchristliche Amtsbezeichnung verständlich und ohne unnötige konfessionelle Festlegung wieder.
- source_word: covetousness
  choice: Habgier
  rationale: Bezeichnet prägnant das ungeordnete Verlangen nach Besitz oder Gewinn und bewahrt den ethischen Zusammenhang mit Götzendienst.
- source_word: sober
  choice: besonnen
  rationale: Im Kontext ist nüchterne, wachsame Urteilsfähigkeit gemeint, nicht lediglich der Verzicht auf Alkohol.
- source_word: restore
  choice: wieder zurechtbringen
  rationale: 'Bewahrt den heilenden und gemeinschaftlichen Sinn: Irrende Glieder sollen nicht ausgestoßen, sondern wieder in einen geordneten Zustand gebracht werden.'
- source_word: edify
  choice: aufbauen
  rationale: Erhält das paulinisch-frühchristliche Bild vom Aufbau der Gemeinschaft in natürlichem modernem Deutsch.
theological_decisions:
- issue: Verhältnis von Habgier und Götzendienst
  choice: „wird durch Götzendienst befleckt werden“
  alternative: „wird als Götzendiener befleckt“
  rationale: Die vorläufige Überlieferungsgrundlage lässt die genaue syntaktische Beziehung nicht sicher bestimmen; die gewählte Form bewahrt die enge Verbindung, ohne beide Begriffe vollständig gleichzusetzen.
- issue: Die Heiligen richten die Welt
  choice: Die Aussage wird uneingeschränkt als paulinisches Zitatmotiv beibehalten.
  alternative: Eine abschwächende Deutung wie „werden über die Welt urteilen“
  rationale: Die theologische Spannung von 1 Korinther 6,2 soll nicht durch erläuternde Paraphrase aufgelöst werden.
- issue: Rettung des ganzen Leibes
  choice: „damit ihr euren ganzen Leib rettet“
  alternative: „damit eure ganze Gemeinschaft bewahrt wird“
  rationale: Das körperliche Gemeindebild und das starke Verb „retten“ werden erhalten, ohne den soteriologischen Umfang näher festzulegen.
- issue: Adressat der gewährten Umkehr
  choice: Plural „ihnen“ für Valens und seine Frau
  alternative: Singular „ihr“ nur für die Frau
  rationale: Der Zusammenhang der Fürbitte gilt offenbar beiden; zugleich ist die zugrunde liegende Form anhand des bereitgestellten englischen Zeugnisses nicht abschließend prüfbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Die Fassung ist wegen der noch ausstehenden direkten Prüfung der griechischen und lateinischen Überlieferung als vorläufig anzusehen; sie stützt sich auf das bereitgestellte gemeinfreie englische Zeugnis und bewahrt dessen erkennbare Mehrdeutigkeiten.
