source:
  text: 'I exhort you all therefore to be obedient unto the word of righteousness and to practice all endurance, which also ye saw with your own eyes in the blessed Ignatius and Zosimus and Rufus, yea and in others also who came from among yourselves, as well as in Paul himself and the rest of the Apostles;


    being persuaded that all these ran not in vain but in faith and righteousness, and that they are in their due place in the presence of the Lord, with whom also they suffered. For they loved not the present world, but Him that died for our sakes and was raised by God for us.'
