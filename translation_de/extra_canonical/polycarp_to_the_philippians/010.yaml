base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: de
  text: 'Darum ermahne ich euch alle: Gehorcht dem Wort der Gerechtigkeit und übt euch in jeder Standhaftigkeit. Diese habt ihr mit eigenen Augen an den seligen Ignatius, Zosimus und Rufus gesehen, ebenso an anderen aus eurer eigenen Mitte sowie an Paulus selbst und den übrigen Aposteln.


    Seid überzeugt, dass keiner von ihnen vergeblich seinen Lauf vollendet hat, sondern im Glauben und in Gerechtigkeit, und dass sie sich an dem ihnen gebührenden Ort beim Herrn befinden, mit dem sie auch gelitten haben. Denn sie liebten nicht die gegenwärtige Welt, sondern den, der um unseretwillen starb und von Gott für uns auferweckt wurde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem überlieferten englischen Textzeugen; eine unmittelbare Prüfung der griechischen und lateinischen Überlieferung steht noch aus.
    reason: Die bereitgestellten Daten kennzeichnen die quellensprachliche Prüfung ausdrücklich als noch ausstehend; die Fußnote macht diese textkritische Grenze transparent.
lexical_decisions:
- source_word: word of righteousness
  choice: Wort der Gerechtigkeit
  rationale: Bewahrt die prägnante, möglicherweise traditionsgeprägte Wendung, ohne sie als bloße Lehre oder Botschaft auszudeuten.
- source_word: to practice all endurance
  choice: euch in jeder Standhaftigkeit üben
  rationale: Natürliches modernes Deutsch; „Standhaftigkeit“ umfasst geduldiges Ausharren unter Bedrängnis.
- source_word: ran not in vain
  choice: nicht vergeblich seinen Lauf vollendet hat
  rationale: Erhält das Bild eines Wettlaufs und macht im Deutschen deutlich, dass vom vollendeten Lebens- und Glaubenslauf die Rede ist.
- source_word: in their due place in the presence of the Lord
  choice: an dem ihnen gebührenden Ort beim Herrn
  rationale: Gibt sowohl den rechtmäßigen Ort als auch die Nähe zum Herrn wieder, ohne den Zustand näher zu bestimmen.
- source_word: the present world
  choice: die gegenwärtige Welt
  rationale: Bewahrt den Kontrast zur Liebe zu Christus, ohne aufgrund der noch ausstehenden Quellenprüfung vorschnell „Weltzeit“ festzulegen.
- source_word: was raised by God for us
  choice: von Gott für uns auferweckt wurde
  rationale: Erhält Gottes ausdrückliche Urheberschaft und den Heilsbezug „für uns“.
theological_decisions:
- issue: Bezug von „mit whom they also suffered“
  choice: „mit dem sie auch gelitten haben“
  alternative: „für den sie auch gelitten haben“ oder „mit denen sie auch gelitten haben“
  rationale: Die Formulierung wahrt den im englischen Zeugen angelegten Bezug auf den Herrn und vermeidet, „mit“ theologisch erklärend in „für“ umzudeuten.
- issue: Aussage über den Aufenthaltsort der Märtyrer und Apostel
  choice: „an dem ihnen gebührenden Ort beim Herrn“
  alternative: „an ihrer gebührenden Stätte in der Gegenwart des Herrn“
  rationale: Die Übersetzung bekräftigt ihre Nähe zum Herrn, legt aber weder eine besondere Jenseitsgeografie noch eine konfessionelle Zwischenzustandslehre fest.
- issue: Auferweckung Christi
  choice: 'Passiv mit genanntem Handelnden: „von Gott … auferweckt“'
  alternative: „auferstanden“
  rationale: Bewahrt die im Text ausdrücklich ausgesagte Handlung Gottes und glättet sie nicht zur bloßen Zustandsbeschreibung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Der Lauf als Bild, die knappen theologischen Aussagen und mögliche Bezugsspannungen bleiben erhalten; unnötig kirchensprachliche Archaismen wurden vermieden.
