review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Argumentationsgang, Eigennamen, den Kontrast zur gegenwärtigen Welt sowie Gottes Handeln bei der Auferweckung insgesamt zuverlässig wieder. „Seinen Lauf vollendet“ fügt jedoch gegenüber „ran not in vain“ eine Vollendung hinzu, die der vorliegende Zeuge nicht ausdrücklich aussagt. „Beim Herrn“ schwächt zudem die räumlich-präsente Formulierung „in the presence of the Lord“ etwas ab.
  naturalness: Der Stil ist würdig und modernes Standarddeutsch. „Sie haben nicht vergeblich ihren Lauf vollendet, sondern im Glauben und in Gerechtigkeit“ ist jedoch semantisch und syntaktisch weniger klar als eine unmittelbare Wiedergabe des Laufbildes.
  terminology: „Wort der Gerechtigkeit“, „selig“, „gegenwärtige Welt“ und „von Gott für uns auferweckt“ sind angemessen. „In der Gegenwart des Herrn“ ist für die vorliegende Formulierung präziser als „beim Herrn“, ohne weitergehende Aussagen über den jenseitigen Zustand einzutragen.
  issues:
  - severity: medium
    issue: „keiner von ihnen vergeblich seinen Lauf vollendet hat“
    rationale: Das Verb „vollendet“ konkretisiert das Laufbild über den englischen Zeugen hinaus. Die Aussage betrifft, dass sie nicht vergeblich liefen, nicht ausdrücklich den Abschluss ihres Laufes.
  - severity: low
    issue: „beim Herrn“
    rationale: Die Wendung ist verständlich, gibt „in the presence of the Lord“ aber weniger genau wieder als „in der Gegenwart des Herrn“.
  - severity: low
    issue: Satzanschluss bei „sondern im Glauben und in Gerechtigkeit“
    rationale: Die Gegenüberstellung wird im Deutschen klarer, wenn das Verb des Laufens bei der positiven Aussage wieder aufgenommen wird.
  revised_text: 'Darum ermahne ich euch alle: Gehorcht dem Wort der Gerechtigkeit und übt euch in jeder Standhaftigkeit. Diese habt ihr mit eigenen Augen an den seligen Ignatius, Zosimus und Rufus gesehen, ebenso an anderen aus eurer eigenen Mitte sowie an Paulus selbst und den übrigen Aposteln.


    Seid überzeugt, dass keiner von ihnen vergeblich lief, sondern im Glauben und in Gerechtigkeit, und dass sie sich an dem ihnen gebührenden Ort in der Gegenwart des Herrn befinden, mit dem sie auch gelitten haben. Denn sie liebten nicht die gegenwärtige Welt, sondern den, der um unseretwillen starb und von Gott für uns auferweckt wurde.[a]'
  revised_footnotes:
  - marker: a
    text: Die Übersetzung beruht vorläufig auf dem überlieferten englischen Textzeugen; eine unmittelbare Prüfung der griechischen und lateinischen Überlieferung steht noch aus.
    reason: Die bereitgestellten Daten kennzeichnen die quellensprachliche Prüfung ausdrücklich als noch ausstehend; die Fußnote macht diese textkritische Grenze transparent.
  revision_rationale: Die Revision entfernt die nicht ausdrücklich gedeckte Ergänzung „vollendet“, stellt das Laufbild klar und gibt „in the presence of the Lord“ präziser wieder. Die bewusst zurückhaltende Wiedergabe von „mit dem sie auch gelitten haben“ bleibt bestehen, da die vorliegenden Daten keine sichere Grundlage für eine interpretierende Umformung zu „für den“ bieten.
