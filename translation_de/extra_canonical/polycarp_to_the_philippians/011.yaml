    issue: „Barmherzigkeit“ für den Spruch über Rettung vom Tod
    rationale: Der griechische Ausdruck ἐλεημοσύνη steht hier in einem deutlich an Tobit 4,10/12,9 erinnernden Spruch und meint gewöhnlich Almosen bzw. tätige Armenfürsorge. Die allgemeinere abstrakte Wiedergabe verwischt diesen konkreten Bezug.
  - severity: low
    issue: Unidiomatische Rektion bei „Lehrt ... die Besonnenheit“
    rationale: Die Form ist möglich, aber im modernen Standarddeutsch natürlicher als Aufforderung zu einem besonnenen Leben wiederzugeben; dies verändert die Aussage nicht.
