base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: de
  text: 'Haltet daher an diesen Dingen fest und folgt dem Beispiel des Herrn. Seid fest und unerschütterlich im Glauben, einander in geschwisterlicher Liebe herzlich zugetan, mit der Wahrheit verbunden; kommt einander in der Sanftmut des Herrn zuvor und verachtet niemanden.


    Wenn ihr Gutes tun könnt, schiebt es nicht auf; denn Almosen retten vom Tod.[a] Ordnet euch alle einander unter und führt unter den Völkern ein untadeliges Leben, damit ihr wegen eurer guten Werke Anerkennung findet und der Herr nicht euretwegen gelästert wird.[b]


    Doch wehe dem, durch den der Name des Herrn gelästert wird! Lehrt daher alle Menschen zu einem besonnenen Leben, wie auch ihr selbst es führt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck bezeichnet Almosengeben bzw. tätige Armenfürsorge. Der Satz klingt wahrscheinlich an Tobit 4,10 oder 12,9 an. Welche Art von „Tod“ gemeint ist, wird nicht näher bestimmt.
    reason: Gibt die konkrete Bedeutung von ἐλεημοσύνη und den wahrscheinlichen Schriftanklang wieder, ohne die Art der Rettung dogmatisch festzulegen.
  - marker: b
    text: 'Wörtlicher: „und der Herr nicht in euch gelästert wird“; gemeint sein kann: nicht wegen eures Verhaltens.'
    reason: Dokumentiert die idiomatische Auslegung der knappen überlieferten Formulierung.
lexical_decisions:
- source_word: Stand fast
  choice: Haltet … fest
  rationale: Bewahrt das Bild standhaften Festhaltens in natürlichem modernem Deutsch.
- source_word: brotherhood
  choice: geschwisterlicher Liebe
  rationale: Gibt die Gemeinschaft der Glaubenden inklusiv und idiomatisch wieder, ohne den familiären Charakter zu verlieren.
- source_word: partners with the truth
  choice: mit der Wahrheit verbunden
  rationale: Vermeidet eine unbelegte Präzisierung der Art der Teilhabe und klingt im Deutschen natürlich.
- source_word: forestalling one another
  choice: kommt einander … zuvor
  rationale: Erhält den Gedanken, anderen in einer Haltung oder Handlung vorauszugehen.
- source_word: Pitifulness
  choice: Barmherzigkeit
  rationale: Der Spruch greift wahrscheinlich Tobit 4,10 beziehungsweise 12,9 auf; dort ist Almosengeben beziehungsweise Barmherzigkeit gemeint. Die breitere Wiedergabe wahrt die vorliegende Bezeugung.
- source_word: Gentiles
  choice: Völkern
  rationale: Bezeichnet hier die nichtchristliche Umwelt; „unter den Völkern“ wahrt die biblische Ausdrucksweise ohne unnötige Fremdheit.
- source_word: soberness
  choice: Besonnenheit
  rationale: Umfasst Selbstbeherrschung, Nüchternheit und maßvolle Lebensführung besser als das heute oft auf Alkohol beschränkte „Nüchternheit“.
theological_decisions:
- issue: „Barmherzigkeit rettet vom Tod“
  choice: Die Aussage ohne dogmatische Erklärung stehen lassen.
  alternative: „Almosengeben bewahrt vor dem Tod“ oder eine geistliche Deutung des Todes ausdrücklich einsetzen.
  rationale: Der überlieferte Wortlaut lässt sowohl die genaue Handlung als auch die Art des Todes offen; die Übersetzung soll diese Spannung nicht konfessionell auflösen.
- issue: Gegenseitige Unterordnung
  choice: „Ordnet euch alle einander unter“
  alternative: Unterordnung unter bestimmte Amtsträger oder Gruppen.
  rationale: Das gegenseitige Pronomen wird ohne Einfügung einer hier nicht genannten Hierarchie wiedergegeben.
- issue: Lästerung des Herrn
  choice: „der Herr nicht euretwegen gelästert wird“
  alternative: „der Herr in euch nicht gelästert wird“
  rationale: Die kausale Bedeutung ist im Deutschen verständlicher und wird durch den folgenden Satz gestützt; die wörtlichere Form bleibt in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzstruktur wurde behutsam gegliedert, während die paränetische Dichte und die biblischen Anklänge erhalten bleiben. Da eine direkte Prüfung der griechischen und lateinischen Quellen noch aussteht, werden unsichere Stellen zurückhaltend wiedergegeben und in Fußnoten kenntlich gemacht.
