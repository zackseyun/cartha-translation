  source_fidelity: Eine sichere Korrektur ist bei ἐλεημοσύνη geboten. Im Tobit-anklingenden Spruch bezeichnet das Wort primär Almosengeben bzw. tätige Armenfürsorge, nicht die allgemeine Tugend „Barmherzigkeit“. Die übrigen Wendungen geben den überlieferten Sinn angemessen wieder; insbesondere bleiben die gegenseitige Unterordnung und die Aussage über die Lästerung ohne hierarchische oder dogmatische Zusätze erhalten.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Lehrt daher alle Menschen die Besonnenheit“ ist verständlich, wirkt aber weniger idiomatisch als „Lehrt daher alle Menschen zu einem besonnenen Leben.“ Die Satzfügung zu „kommt einander … zuvor“ bleibt bewusst nahe am paränetischen Original und ist verständlich.
  terminology: „Almosen“ ist hier der präzisere traditions- und quellensprachliche Ausdruck für ἐλεημοσύνη; die Fußnote soll nicht länger eine lexikalische Unsicherheit behaupten, sondern den wahrscheinlichen Tobit-Anklang und die nicht näher bestimmte Bedeutung von „Tod“ dokumentieren. „Besonnenheit“, „geschwisterliche Liebe“, „Sanftmut“ und „Völker“ sind im Kontext tragfähig.
  issues:
