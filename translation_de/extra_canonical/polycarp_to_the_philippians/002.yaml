    reason: Die Anmerkung erklärt Hades ohne eine dogmatisch festgelegte Gleichsetzung mit „Hölle“ und macht den biblischen Sprachhintergrund kenntlich.
  revision_rationale: Die Änderungen folgen den im Datensatz ausgewiesenen griechischen Schlüsselbegriffen und gehen zugleich über die freieren Entscheidungen des englischen POB-Audit-Trails hinaus, soweit dies eindeutig möglich ist. Insbesondere werden die Personen als „Nachahmer“ statt als „Vorbilder“ beschrieben, διαδήματα nicht als Siegeskränze festgelegt und Christi Erleiden des Todes unmittelbar ausgedrückt. Die Syntax bei „Gott und unserem Herrn“ bleibt bewusst offen. Die Fußnotenanker a–c bleiben jeweils an den einschlägigen Ausdrücken erhalten.
