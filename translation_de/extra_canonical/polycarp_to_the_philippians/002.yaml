review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist nötig. Der Entwurf trifft den Gedankengang weitgehend, schwächt jedoch μιμήματα zu stark zu „Vorbilder“ ab, gibt διαδήματα ungenau als „Siegeskränze“ wieder und paraphrasiert εἰς αὐτὸν τὸν θάνατον zu frei. Die Revision wahrt die Bildsprache und die mögliche Referenzoffenheit bei „Gott und unserem Herrn“.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. Die Satzperioden bleiben klar, ohne die Verknüpfung der beiden Gründe für Polykarps Freude aufzugeben.
  terminology: „Nachahmer der wahren Liebe“ bildet τὰ μιμήματα τῆς ἀληθινῆς ἀγάπης genauer ab als „Vorbilder“. „Kronen“ ist für διαδήματα angemessener als „Siegeskränze“, die spezifisch στέφανοι nahelegen würden. „Wehen des Totenreichs“ bewahrt das konkrete Bild von ὠδῖνες und vermeidet eine dogmatisch eingeengte Gleichsetzung des Hades mit der Hölle.
  issues:
  - severity: medium
    issue: „Vorbilder der wahren Liebe“ ist für τὰ μιμήματα zu interpretierend.
    rationale: 'Das Wort bezeichnet Nachahmungen, Abbilder oder Nachahmer. „Vorbilder“ kehrt die Blickrichtung um: Ein Vorbild wird nachgeahmt, während μιμήματα gerade die Nachahmenden bzw. Nachbildungen bezeichnet.'
  - severity: medium
    issue: „Siegeskränze“ verengt διαδήματα.
    rationale: διάδημα bezeichnet einen Kronschmuck bzw. ein Diadem, nicht den üblichen Siegeskranz (στέφανος). „Kronen“ bewahrt das Ehrenbild ohne falsche Spezifizierung.
  - severity: medium
    issue: „Er nahm es auf sich, ... dem Tod entgegenzutreten“ ist eine zu freie Wiedergabe von εἰς αὐτὸν τὸν θάνατον ὑπέμεινεν.
    rationale: Der Text betont, dass Christus den Tod selbst erduldete. Die Revision gibt dies unmittelbar wieder.
  - severity: low
    issue: Die Fußnote zu „Vorbilder“ stützt eine Übersetzung, die korrigiert werden sollte.
    rationale: Nach der Korrektur muss auch die Anmerkung die Richtung von μιμήματα zutreffend erklären.
  revised_text: '**Polykarp an die Philipper 1**


    Ich habe mich mit euch sehr gefreut in unserem Herrn Jesus Christus, weil ihr die Nachahmer der wahren Liebe[a] aufgenommen und sie auf ihrem Weg begleitet habt, wie es euch zukam – jene Männer, die von Ketten umschlossen sind, wie es der Heiligkeit entspricht. Diese Ketten sind die Kronen derer, die wahrhaft von Gott und unserem Herrn erwählt sind.[b]


    Ich habe mich auch darüber gefreut, dass die feste Wurzel eures Glaubens, die seit alter Zeit bekannt ist, bis heute fortbesteht und Frucht bringt für unseren Herrn Jesus Christus. Er erduldete für unsere Sünden sogar den Tod; Gott aber hat ihn auferweckt, indem er die Wehen des Totenreichs löste.[c]


    An ihn glaubt ihr, obwohl ihr ihn nicht gesehen habt, und jubelt mit unaussprechlicher und verherrlichter Freude. In diese Freude möchten viele gelangen. Denn ihr wisst: Aus Gnade seid ihr gerettet, nicht aufgrund von Werken, sondern durch den Willen Gottes, durch Jesus Christus.'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „die Nachahmer“ oder „die Abbilder der wahren Liebe“. Gemeint sind offenbar Menschen, die wahre Liebe nachahmen beziehungsweise sichtbar verkörpern.'
    reason: τὰ μιμήματα bezeichnet nicht primär Vorbilder, sondern Nachahmungen, Abbilder oder Nachahmer. Der englische öffentliche Übersetzungszeuge gibt die Wendung freier als „followers of the true Love“ wieder.
  - marker: b
