base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: de
  text: '**Polykarp an die Philipper 1**


    Ich habe mich mit euch sehr gefreut in unserem Herrn Jesus Christus, weil ihr die Vorbilder der wahren Liebe[a] aufgenommen und sie auf ihrem Weg begleitet habt, wie es euch zukam: jene Männer, die von heiligen Ketten umschlossen sind. Diese Ketten sind die Siegeskränze derer, die von Gott und unserem Herrn wahrhaft erwählt sind.[b]


    Ich freute mich auch darüber, dass die feste Wurzel eures Glaubens, die seit alter Zeit bekannt ist, bis heute fortbesteht und Frucht bringt für unseren Herrn Jesus Christus. Er nahm es auf sich, für unsere Sünden sogar dem Tod entgegenzutreten; Gott aber hat ihn auferweckt und die Schmerzen des Totenreichs gelöst.[c]


    An ihn glaubt ihr, obwohl ihr ihn nicht gesehen habt, und jubelt mit unaussprechlicher, von Herrlichkeit erfüllter Freude. In diese Freude möchten viele gelangen. Denn ihr wisst: Aus Gnade seid ihr gerettet, nicht aufgrund von Werken, sondern durch den Willen Gottes, durch Jesus Christus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Nachahmungen“ oder „Verkörperungen der wahren Liebe“. Gemeint sind Menschen, an denen wahre Liebe beispielhaft sichtbar wird.'
    reason: Das Bild ist ungewöhnlich, und der öffentliche englische Übersetzungszeuge gibt es freier als „followers of the true Love“ wieder.
  - marker: b
    text: Die Formulierung kann sowohl „von Gott und unserem Herrn“ als auch „von unserem Gott und Herrn“ verstanden werden.
    reason: Die mögliche Ein- oder Zweireferenz der Titel soll nicht stillschweigend entschieden werden.
  - marker: c
    text: „Totenreich“ gibt Hades wieder, den Bereich der Toten; damit ist nicht ohne Weiteres der Ort endgültiger Strafe gemeint. Die Wendung erinnert an Apostelgeschichte 2,24.
    reason: Verhindert die irreführende Gleichsetzung von Hades und „Hölle“ und weist auf den biblischen Sprachhintergrund hin.
lexical_decisions:
- source_word: τὰ μιμήματα τῆς ἀληθοῦς ἀγάπης
  choice: die Vorbilder der wahren Liebe
  rationale: Das griechische μιμήματα bezeichnet Nachahmungen, Abbilder oder beispielhafte Verkörperungen. „Vorbilder“ ist im Deutschen natürlich und hält den Gedanken fest, dass die aufgenommenen Männer die wahre Liebe sichtbar verkörpern. Der englische Zeuge gibt freier „followers“ wieder.
- source_word: τοῖς ἁγιοπρεπέσιν δεσμοῖς
  choice: von heiligen Ketten
  rationale: δεσμοί bezeichnet hier die Fesseln beziehungsweise Ketten der Gefangenen; ἁγιοπρεπής bedeutet etwa „heilig“, „der Heiligkeit angemessen“. Die knappe Form bewahrt das ehrende Paradox.
- source_word: διαδήματα
  choice: Siegeskränze
  rationale: Das Bild bezeichnet einen ehrenvollen Kopfschmuck beziehungsweise eine Krone. „Siegeskränze“ vermittelt im Deutschen den antiken Ehren- und Siegesgedanken deutlicher als das politisch missverständliche „Diademe“.
- source_word: ἐξ ἀρχαίων χρόνων
  choice: seit alter Zeit
  rationale: Die Wendung blickt auf frühere beziehungsweise alte Zeiten zurück. „Seit alter Zeit“ ist würdig und verständlich, ohne übergenau „seit den frühesten Zeiten“ zu behaupten.
- source_word: λύσας τὰς ὠδῖνας τοῦ ᾅδου
  choice: die Schmerzen des Totenreichs gelöst
  rationale: Die Formulierung greift traditionelle biblische Sprache auf. „Totenreich“ gibt ᾅδης wieder, ohne es vorschnell mit dem Ort endgültiger Strafe gleichzusetzen; „Schmerzen“ bewahrt das Bild von ὠδῖνες.
- source_word: χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ
  choice: mit unaussprechlicher, von Herrlichkeit erfüllter Freude
  rationale: Die Wiedergabe erhält sowohl die Unsagbarkeit als auch den Herrlichkeitscharakter der Freude und klingt in modernem Deutsch natürlich.
theological_decisions:
- issue: Beziehung von „Gott“ und „unserem Herrn“ in der Erwählungsaussage
  choice: von Gott und unserem Herrn wahrhaft erwählt
  alternative: von unserem Gott und Herrn wahrhaft erwählt
  rationale: Die gewählte Form lässt offen, ob die beiden Titel hier einen oder zwei Referenten bezeichnen. Eine eindeutige christologische Identifizierung würde die sprachliche Spannung stärker auflösen, als es die Überlieferung rechtfertigt.
- issue: Bedeutung von Hades
  choice: Totenreich
  alternative: Hölle
  rationale: „Totenreich“ bezeichnet den Bereich der Toten und vermeidet die konfessionell und dogmatisch stärker festgelegte Bedeutung von „Hölle“.
- issue: Verhältnis von Gnade, Werken und Gottes Willen
  choice: Aus Gnade seid ihr gerettet, nicht aufgrund von Werken, sondern durch den Willen Gottes
  alternative: Durch Gnade werdet ihr gerettet, nicht aus Werken
  rationale: Die Form wahrt den feststellenden Charakter der Aussage und lässt die Spannung zwischen göttlicher Gnade, menschlichen Werken und Gottes Willen bestehen, ohne ein späteres Lehrsystem einzutragen.
- issue: Gegenstand des Glaubens im Satz „an ihn glaubt ihr“
  choice: An ihn glaubt ihr, obwohl ihr ihn nicht gesehen habt
  alternative: Obwohl ihr ihn nicht gesehen habt, glaubt ihr an ihn
  rationale: Der Bezug auf Jesus Christus wird ausdrücklich, während die Anspielung auf 1 Petrus 1,8 in natürlichem Deutsch erkennbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die lange Periodenstruktur des Zeugen wurde behutsam in Absätze und kürzere Sätze gegliedert. Archaismen wurden vermieden; zentrale Bilder wie Wurzel, Frucht, Ketten und Siegeskränze bleiben erhalten. Der Entwurf berücksichtigt den geläufigen griechischen Wortlaut, muss jedoch vor der Publikation noch vollständig an der griechischen und lateinischen Handschriftentradition geprüft werden, da die bereitgestellten Metadaten die direkte Quellenprüfung als ausstehend kennzeichnen.
