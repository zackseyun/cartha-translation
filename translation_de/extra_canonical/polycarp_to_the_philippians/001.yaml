review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den vorliegenden englischen Zeugen insgesamt präzise wieder: Absender, mit Polykarp verbundene Älteste, die in Philippi als Fremde lebende Gemeinde sowie die Mehrungsbitte sind erhalten. „sich als Fremde aufhält“ trifft das im Zeugen vorliegende sojourneth, ist jedoch bei Bezug auf die singularische „Gemeinde“ etwas schwerfällig.'
  naturalness: Der feierliche Briefgruß ist gut verständlich und registergerecht. „die in Philippi als Fremde lebt“ ist im modernen Standarddeutsch flüssiger und bewahrt das Fremdlingsmotiv. Die Fußnote ist keine textbezogene Anmerkung und sollte nicht am Ende des Grußes verankert werden.
  terminology: „Älteste“, „Gemeinde Gottes“, „Barmherzigkeit“, „der Allmächtige“ und „unser Retter“ sind angemessen. Die koordinierte Herkunftsangabe bei Gott und Jesus Christus bleibt unverändert gewahrt.
  issues:
  - severity: low
    issue: Die Formulierung „die sich in Philippi als Fremde aufhält“ ist syntaktisch etwas schwerfällig.
    rationale: „Gemeinde“ ist grammatisch Singular; „die in Philippi als Fremde lebt“ formuliert denselben Gedanken idiomatischer, ohne die Aussage abzuschwächen.
  - severity: low
    issue: Die Fußnote dokumentiert den Arbeitsstand statt eine übersetzungsrelevante Textfrage und ist an den Grußtext angehängt.
    rationale: Ohne konkrete Variantenangabe oder erläuterungsbedürftigen Ausdruck bietet sie Lesenden keine textbezogene Hilfe. Die vorläufige Quellengrundlage gehört in redaktionelle Metadaten, nicht als Fußnote zum Satz.
  revised_text: 'Polykarp und die Ältesten, die bei ihm sind, an die Gemeinde Gottes, die in Philippi als Fremde lebt: Barmherzigkeit und Frieden von Gott, dem Allmächtigen, und Jesus Christus, unserem Retter, mögen euch in reichem Maß zuteilwerden.'
  revised_footnotes: []
  revision_rationale: Die Revision glättet ausschließlich die deutsche Wiedergabe des Fremdlingsmotivs und entfernt die nicht textbezogene Arbeitsstandsfußnote. Inhalt, Anredeform, theologischer Sprachgebrauch und die Mehrungsbitte bleiben erhalten. Da eine unmittelbare Einsicht in die griechische und lateinische Überlieferung im bereitgestellten Material weiterhin aussteht, wird keine weitergehende, auf Varianten beruhende Änderung vorgenommen.
