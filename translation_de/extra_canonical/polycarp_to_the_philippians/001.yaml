base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/001.yaml
  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: de
  text: 'Polykarp und die Ältesten, die bei ihm sind, an die Gemeinde Gottes, die sich in Philippi als Fremde aufhält: Barmherzigkeit und Frieden von Gott, dem Allmächtigen, und Jesus Christus, unserem Retter, mögen euch in reichem Maß zuteilwerden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Formulierung bleibt vorläufig, da eine direkte Prüfung der griechischen und lateinischen Überlieferung noch aussteht; Grundlage ist hier der angegebene gemeinfreie englische Übersetzungszeuge.
    reason: Die bereitgestellte Ausgangsbasis weist selbst darauf hin, dass die quellensprachliche Prüfung noch aussteht.
lexical_decisions:
- source_word: presbyters
  choice: Ältesten
  rationale: Gibt die frühchristliche Amts- und Leitungsbezeichnung verständlich wieder, ohne eine spätere konfessionelle Amtsordnung einzutragen.
- source_word: Church of God
  choice: Gemeinde Gottes
  rationale: „Gemeinde“ bezeichnet hier die örtliche christliche Gemeinschaft natürlich und würdevoll.
- source_word: sojourneth
  choice: sich … als Fremde aufhält
  rationale: Bewahrt das Motiv des vorläufigen Aufenthalts beziehungsweise Fremdseins, statt es auf das bloße Wohnen zu reduzieren.
- source_word: mercy
  choice: Barmherzigkeit
  rationale: Entspricht dem religiösen Grußwort und wahrt dessen theologisches Gewicht.
- source_word: Savior
  choice: Retter
  rationale: Ist im modernen Standarddeutsch unmittelbar verständlich und gibt den christologischen Titel ohne konfessionelle Zusatzbedeutung wieder.
- source_word: be multiplied
  choice: in reichem Maß zuteilwerden
  rationale: Gibt die Segensbitte idiomatisch wieder und erhält die Vorstellung der Mehrung.
theological_decisions:
- issue: Bezug der Herkunftsangabe „von“
  choice: „von Gott, dem Allmächtigen, und Jesus Christus“ lässt beide als Quelle von Barmherzigkeit und Frieden stehen
  alternative: Die Segensgaben ausschließlich auf Gott beziehen und Jesus Christus anders syntaktisch einordnen
  rationale: Die überlieferte Satzstruktur verbindet Gott und Jesus Christus in der Herkunftsangabe; diese theologisch bedeutsame Koordination wird nicht abgeschwächt.
- issue: Kirche als Gemeinschaft in der Fremde
  choice: Das Fremdlingsmotiv wird ausdrücklich erhalten
  alternative: „die in Philippi wohnt“
  rationale: Die stärkere Formulierung des Zeugnisses kann eine geistliche beziehungsweise eschatologische Spannung tragen und sollte daher nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Absendergruß bleibt als ein einziger, feierlicher Satz gestaltet. „Älteste“ vermeidet eine konfessionell verengte Amtsbezeichnung; „als Fremde aufhält“ bewahrt die im Zeugnis erkennbare frühchristliche Fremdlingssprache.
