base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: de
  text: 'Auch die Ältesten müssen mitfühlend und allen gegenüber barmherzig sein. Sie sollen die verirrten Schafe zurückbringen, alle Kranken besuchen und eine Witwe, eine Waise oder einen Armen nicht vernachlässigen. Vielmehr sollen sie stets für das sorgen, was vor Gott und den Menschen ehrenhaft ist. Sie sollen sich von allem Zorn, jeder Parteilichkeit und jedem ungerechten Urteil fernhalten, von aller Geldliebe weit entfernt sein, nicht vorschnell etwas zu Ungunsten eines Menschen glauben und nicht übereilt urteilen; denn sie wissen, dass wir alle Schuldner der Sünde sind.[a]


    Wenn wir nun den Herrn bitten, uns zu vergeben, müssen auch wir vergeben. Denn wir stehen vor den Augen unseres Herrn und Gottes, und wir müssen alle vor dem Richterstuhl Christi erscheinen; jeder muss Rechenschaft über sich selbst ablegen.


    Darum wollen wir ihm mit Furcht und mit aller Ehrfurcht dienen, so wie er selbst es geboten hat und wie die Apostel, die uns die gute Botschaft verkündigt haben, und die Propheten, die das Kommen unseres Herrn im Voraus ankündigten. Lasst uns eifrig nach dem Guten streben und uns von Anstößen, von falschen Brüdern und von denen fernhalten, die den Namen des Herrn heuchlerisch tragen und unverständige Menschen in die Irre führen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schuldner der Sünde“. Der Ausdruck kann die persönliche Sündenschuld oder das Gebundensein an die Sünde hervorheben.'
    reason: Die ungewöhnliche Wendung ist auslegungsbedürftig und soll im Haupttext nicht vereindeutigt werden.
lexical_decisions:
- source_word: presbyters
  choice: Ältesten
  rationale: Gibt die frühchristliche Amtsbezeichnung verständlich und ohne spätere konfessionelle Festlegung wieder.
- source_word: respect of persons
  choice: Parteilichkeit
  rationale: Bezeichnet sachgerecht eine ungerechte Bevorzugung aufgrund der Person.
- source_word: love of money
  choice: Geldliebe
  rationale: Bewahrt die moralische Aussage des Ausdrucks knapp und unmittelbar.
- source_word: debtors of sin
  choice: Schuldner der Sünde
  rationale: Behält die auffällige und möglicherweise mehrdeutige Formulierung bei, statt sie als bloße Sündhaftigkeit oder konkrete Sündenschuld auszulegen.
- source_word: judgment-seat of Christ
  choice: Richterstuhl Christi
  rationale: Bewahrt das forensische Bild und den deutlichen biblischen Anklang.
- source_word: offenses
  choice: Anstößen
  rationale: Wahrt die mögliche Bedeutung von Verführungen beziehungsweise Ursachen des Strauchelns, ohne sie auf persönliche Beleidigungen zu verengen.
theological_decisions:
- issue: Bezug von „unser Herr und Gott“
  choice: Die überlieferte Formulierung bleibt ohne ausdrückliche Identifizierung des Titels mit Christus stehen.
  alternative: „unser Herr und Gott Jesus Christus“
  rationale: Der vorliegende Wortlaut nennt an dieser Stelle Jesus Christus nicht ausdrücklich; eine ergänzende Identifizierung würde die syntaktische und theologische Spannung auflösen.
- issue: „Schuldner der Sünde“
  choice: Die Schuldner-Metapher wird wörtlich bewahrt.
  alternative: „wir alle haben gesündigt“ oder „wir alle stehen in der Schuld der Sünde“
  rationale: Die Quelle lässt offen, ob persönliche Sündenschuld, Verpflichtung oder Herrschaft der Sünde im Vordergrund steht.
- issue: Autorität im letzten Absatz
  choice: „wie er selbst es geboten hat, ebenso die Apostel … und die Propheten …“
  alternative: Allein Christus als Subjekt von „geboten“ lesen und Apostel sowie Propheten ausschließlich als zusätzliche Verkündiger auffassen.
  rationale: Die knappe Reihung ist syntaktisch nicht völlig glatt; die Übersetzung bewahrt Christus, Apostel und Propheten als maßgebliche Zeugnisinstanzen, ohne ihre Autorität gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher frühchristlicher Amtssprache. Die paränetischen Reihen wurden rhythmisch gegliedert, ohne ihre Dichte abzuschwächen. Da eine direkte Prüfung des griechischen und lateinischen Wortlauts laut Datensatz noch aussteht, ist der Entwurf ausdrücklich auf das bereitgestellte gemeinfreie englische Zeugnis und die auditierte englische POB-Schicht gestützt.
