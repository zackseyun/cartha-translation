review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Inhalt des vorliegenden englischen Textzeugen insgesamt zuverlässig wieder. Eine kleine Korrektur ist bei „Vielmehr“ angezeigt: Das englische „but for our sakes“ setzt hier nicht zwingend einen starken Gegensatz, sondern stellt Christi Leiden trotz seiner Sündlosigkeit heraus. „Doch“ bewahrt diese Verbindung unaufdringlicher. „An seinem eigenen Leib auf das Holz hinaufgetragen“ entspricht der bildhaften Formulierung des Zeugen und wahrt die Anspielung auf 1 Petrus 2,24.'
  naturalness: Der Text ist überwiegend natürliches, würdiges modernes Standarddeutsch. „Ausdauer“ ist für „endurance“ unmittelbarer und im heutigen Deutsch geläufiger als „Standhaftigkeit“, ohne das aktive Ausharren abzuschwächen. Die Aufforderungsform „Lasst uns“ bildet den paränetischen Ton klar ab.
  terminology: „Unterpfand“, „Gerechtigkeit“, „Holz“, „Sünde“ und „Trug“ sind treffend und behalten den schriftbezogenen Registerklang. Die personale Gleichsetzung des Unterpfands mit Jesus Christus bleibt durch die Apposition erhalten, ohne eine nicht im Zeugen enthaltene theologische Auslegung hinzuzufügen.
  issues:
  - severity: low
    issue: „Vielmehr“ für „but for our sakes“
    rationale: „Vielmehr“ kann einen korrigierenden oder ausschließenden Gegensatz nahelegen. „Doch“ gibt die adversative Verknüpfung wieder, ohne den logischen Zusammenhang stärker festzulegen als der Textzeuge.
  - severity: low
    issue: „Standhaftigkeit“ für „endurance“
    rationale: Die Wahl ist möglich, doch „Ausdauer“ trifft das fortdauernde Ertragen beziehungsweise Ausharren unmittelbarer und ist im modernen Standarddeutsch idiomatischer.
  revised_text: 'Darum wollen wir ohne Unterlass an unserer Hoffnung und an dem Unterpfand unserer Gerechtigkeit festhalten: Jesus Christus. Er hat unsere Sünden an seinem eigenen Leib auf das Holz hinaufgetragen. Er tat keine Sünde, und in seinem Mund wurde kein Trug gefunden. Doch um unseretwillen ertrug er alles, damit wir in ihm leben.


    Darum wollen wir seine Ausdauer nachahmen. Und wenn wir um seines Namens willen leiden, wollen wir ihn verherrlichen. Denn er selbst hat uns dieses Beispiel gegeben, und dies haben wir geglaubt.'
  revised_footnotes: []
  revision_rationale: Die Revision beschränkt sich auf sichere stilistische und semantische Präzisierungen. Der Bezug von „in ihm leben“, die Benennung Jesu als Unterpfand der Gerechtigkeit und das demonstrative „dies“ im Schlusssatz bleiben bewusst ohne erläuternde Einengung. Da lediglich ein englischer öffentlicher Textzeuge als Grundlage vorliegt und die direkte griechisch-lateinische Prüfung noch aussteht, werden keine weitergehenden textkritischen oder lehrmäßigen Entscheidungen vorgenommen.
