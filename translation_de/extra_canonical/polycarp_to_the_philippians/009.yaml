base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: de
  text: 'Darum wollen wir ohne Unterlass an unserer Hoffnung und an dem Unterpfand unserer Gerechtigkeit festhalten: Jesus Christus. Er hat unsere Sünden an seinem eigenen Leib auf das Holz hinaufgetragen. Er tat keine Sünde, und in seinem Mund wurde kein Trug gefunden. Vielmehr ertrug er um unseretwillen alles, damit wir in ihm leben.


    Darum wollen wir seine Standhaftigkeit nachahmen. Und wenn wir um seines Namens willen leiden, wollen wir ihn verherrlichen. Denn er selbst hat uns dieses Beispiel gegeben, und daran haben wir geglaubt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earnest (Greek/Latin source term pending review)
  choice: Unterpfand
  rationale: Gibt den älteren Sinn von „earnest“ als Bürgschaft beziehungsweise garantierende Vorausgabe wieder, ohne ihn auf ein bloßes Versprechen zu reduzieren.
- source_word: tree
  choice: Holz
  rationale: Bewahrt die biblische Kreuzesformulierung „auf das Holz“ und ihre Anklänge an 1 Petrus 2,24, statt ausdrücklich „Kreuz“ einzusetzen.
- source_word: endurance
  choice: Standhaftigkeit
  rationale: Bezeichnet ausdauerndes Tragen unter Leiden in natürlichem modernem Deutsch; „Geduld“ wäre enger und könnte zu passiv wirken.
- source_word: guile/deceit
  choice: Trug
  rationale: Bewahrt den würdevollen biblischen Sprachklang und bezeichnet täuschende Falschheit prägnant.
- source_word: live in Him
  choice: in ihm leben
  rationale: Erhält die theologisch dichte und möglicherweise mehrdeutige Einheitsformulierung, statt sie erklärend aufzulösen.
theological_decisions:
- issue: Bezug von „Unterpfand unserer Gerechtigkeit“ auf Christus
  choice: Jesus Christus wird durch den Doppelpunkt unmittelbar als das Unterpfand bezeichnet.
  alternative: „… an dem Unterpfand unserer Gerechtigkeit festhalten, das Jesus Christus ist“
  rationale: Bewahrt die personale Aussage des Zeugnisses und vermeidet zugleich im Deutschen den unnatürlichen Wechsel zwischen sächlichem Relativpronomen und einer Person.
- issue: Bedeutung von „damit wir in ihm leben“
  choice: Die Wendung bleibt unverändert mehrdeutig.
  alternative: „damit wir durch ihn leben“ oder „damit wir mit ihm leben“
  rationale: Die überlieferte Formulierung kann Gemeinschaft, Lebensquelle und Heilsverbundenheit anklingen lassen; eine eindeutige Auslegung wäre sachlich nicht geboten.
- issue: Schlusssatz „we believed this“
  choice: „daran haben wir geglaubt“
  alternative: „wir haben dies geglaubt“ oder „wir glaubten an ihn“
  rationale: Bewahrt den Bezug auf das zuvor genannte Beispiel beziehungsweise Zeugnis, ohne den Gegenstand des Glaubens enger zu bestimmen, als es die englische Textgrundlage erlaubt.
- issue: Leiden um Christi Namen und Verherrlichung
  choice: „wenn wir … leiden, wollen wir ihn verherrlichen“
  alternative: „sollten wir … leiden, lasst uns ihn verherrlichen“
  rationale: Gibt den ermahnenden Charakter idiomatisch wieder, ohne Leiden als Gewissheit oder als Bedingung des Heils darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltenen biblischen Anklängen. Da eine direkte Prüfung des griechisch-lateinischen Wortlauts noch aussteht, folgt der Entwurf vorsichtig dem angegebenen gemeinfreien englischen Textzeugen und nutzt die englische POB-Fassung nur als Konsultationsschicht. Kurze Hauptsätze sichern gute Verständlichkeit; „Unterpfand“, „Holz“ und „Trug“ bewahren zugleich den historischen und schriftbezogenen Ton.
