source:
  text: 'Let us therefore without ceasing hold fast by our hope and by the earnest of our righteousness, which is Jesus Christ who took up our sins in His own body upon the tree, who did no sin, neither was guile found in His mouth, but for our sakes He endured all things, that we might live in Him.


    Let us therefore become imitators of His endurance; and if we should suffer for His name''s sake, let us glorify Him. For He gave this example to us in His own person, and we believed this.'
