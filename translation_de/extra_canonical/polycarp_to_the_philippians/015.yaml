base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: de
  text: Dies schreibe ich euch durch Crescens, den ich euch vor Kurzem empfohlen habe und jetzt erneut empfehle; denn er hat sich unter uns untadelig verhalten, und ich glaube, dass er es auch bei euch ebenso tun wird. Auch seine Schwester sei euch empfohlen, wenn sie zu euch kommt. Lebt wohl in der Gnade des Herrn Jesus Christus, ihr und alle, die zu euch gehören. Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses. Eine direkte Prüfung der griechischen und lateinischen Textüberlieferung steht noch aus; insbesondere können die genaue Zeitform bei Crescens’ künftigem Verhalten und die syntaktische Zuordnung von „in Gnade“ davon betroffen sein.
    reason: Die bereitgestellte Quellengrundlage ist ein englischer Übersetzungszeuge und keine unmittelbar geprüfte Edition der antiken Sprachen.
lexical_decisions:
- source_word: by/through Crescens
  choice: durch Crescens
  rationale: Gibt Crescens natürlich als Überbringer des Schreibens wieder, ohne über die vorliegende Zeugengrundlage hinauszugehen.
- source_word: commended
  choice: empfohlen
  rationale: Entspricht dem Kontext eines persönlichen Empfehlungsschreibens und bewahrt die Wiederholung.
- source_word: walked blamelessly
  choice: sich … untadelig verhalten
  rationale: Überträgt die semitisch-biblische Lebenswandel-Metapher in verständliches modernes Deutsch, während der ethische Sinn erhalten bleibt.
- source_word: all yours
  choice: alle, die zu euch gehören
  rationale: Bewahrt die offene Reichweite des Ausdrucks, ohne ihn ausdrücklich auf Familienangehörige, Hausgemeinschaften oder Gemeindeglieder festzulegen.
theological_decisions:
- issue: Bezug von „in grace“ im Schlussgruß
  choice: „in der Gnade des Herrn Jesus Christus“
  alternative: „Lebt wohl im Herrn Jesus Christus, in Gnade“
  rationale: Die gewählte Fassung ist im Deutschen natürlich und wahrt den christologischen Gnadenbezug; wegen der ausstehenden Prüfung der griechischen und lateinischen Überlieferung wird die mögliche syntaktische Mehrdeutigkeit in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit brieflichem Ton. Archaismen wie „seid gegrüßt“ oder „die Eurigen“ wurden vermieden. Die Wiederholung von „empfohlen/empfehle“ bleibt als rhetorisches Merkmal erhalten.
