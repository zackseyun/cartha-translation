review_pass:
  verdict: revise
  source_fidelity: 'Eine Korrektur ist nötig: Der Satz über die Schwester ist im griechischen Text als Aufforderung zur Aufnahme/Annahme formuliert (ἀποδέξασθε), nicht als erneute Empfehlung durch den Verfasser. Der Schlussausdruck „in Gnade“ ist syntaktisch knapp und sollte nicht ohne Weiteres zu „in der Gnade des Herrn Jesus Christus“ ausgeweitet werden. „Alle, die bei euch sind“ gibt οἱ σὺν ὑμῖν πάντες offener wieder als „alle, die zu euch gehören“.'
  naturalness: Die Sprache ist insgesamt klar und würdig. „Nehmt auch seine Schwester auf“ ist modernes, idiomatisches Deutsch und trifft die briefliche Aufforderung. Die knappe Stellung „im Herrn Jesus Christus, in Gnade“ bewahrt am Schluss bewusst die Quellenspannung.
  terminology: „empfohlen/empfehle“, „untadelig“ und „Herr Jesus Christus“ sind angemessen. „Aufnehmen“ ist für die an die Gemeinde gerichtete Aufforderung hinsichtlich der Schwester genauer als „sei euch empfohlen“.
  issues:
  - severity: high
    issue: „Auch seine Schwester sei euch empfohlen“ verändert die Handlung gegenüber der Schwester.
    rationale: Die griechische Überlieferung fordert die Adressaten auf, die Schwester aufzunehmen/anzunehmen; die Fassung macht daraus eine Empfehlung des Verfassers.
  - severity: medium
    issue: „in der Gnade des Herrn Jesus Christus“ legt die syntaktische Zuordnung von „in Gnade“ fest und ergänzt eine genitivische Beziehung.
    rationale: Der knappe Schlusswortlaut lässt die nähere Anbindung offen; die deutsche Fassung sollte diese nicht theologisch oder syntaktisch verengen.
  - severity: medium
    issue: „alle, die zu euch gehören“ deutet „alle, die bei euch sind“ als Zugehörigkeitsverhältnis.
    rationale: Der griechische Ausdruck bezeichnet offen alle Anwesenden bzw. bei den Empfängern Befindlichen, ohne deren genaue Beziehung festzulegen.
  revised_text: Dies schreibe ich euch durch Crescens, den ich euch vor Kurzem empfohlen habe und jetzt erneut empfehle; denn er hat sich unter uns untadelig verhalten, und ich glaube, dass er es auch bei euch ebenso tun wird. Nehmt aber seine Schwester auf, wenn sie zu euch kommt. Lebt wohl im Herrn Jesus Christus, in Gnade, ihr und alle, die bei euch sind. Amen.[a]
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses; die griechische und lateinische Textüberlieferung ist für diese Ausgabe noch nicht unmittelbar dokumentiert. Der knappe Schluss „im Herrn Jesus Christus, in Gnade“ bewahrt die syntaktische Offenheit des überlieferten Grußes.
    reason: Die bereitgestellte Quellengrundlage dokumentiert primär einen englischen Übersetzungszeugen. Die Fußnote kennzeichnet dies und vermeidet eine überfestgelegte Zuordnung von „in Gnade“.
  revision_rationale: Die Revision stellt die Aufforderung zur Aufnahme der Schwester wieder her, bewahrt die Wiederholung von „empfohlen/empfehle“ sowie den ethischen Sinn von Crescens’ untadeligem Verhalten und gibt den Schlussgruß ohne zusätzliche Besitz- oder Zugehörigkeitsdeutung wieder.
