    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: de
  text: 'Denn jeder, der nicht bekennt, dass Jesus Christus im Fleisch gekommen ist, ist ein Antichrist. Wer das Zeugnis des Kreuzes nicht bekennt, ist aus dem Teufel. Und wer die Aussprüche des Herrn seinen eigenen Begierden entsprechend verdreht und sagt, es gebe weder Auferstehung noch Gericht, der ist der Erstgeborene Satans.


    Darum wollen wir das nichtige Treiben der vielen und ihre falschen Lehren verlassen und uns dem Wort zuwenden, das uns von Anfang an überliefert wurde. Lasst uns besonnen sein zum Gebet und beharrlich im Fasten. Lasst uns den alles sehenden Gott inständig bitten, dass er uns nicht in Versuchung führt, wie der Herr gesagt hat: »Der Geist ist zwar willig, aber das Fleisch ist schwach.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confess
  choice: bekennen
  rationale: Bewahrt den öffentlichen und inhaltlichen Charakter des christologischen Bekenntnisses.
- source_word: come in the flesh
  choice: im Fleisch gekommen ist
  rationale: Erhält die frühchristliche Formel und ihre Aussage über die wirkliche Menschwerdung, ohne sie auszudeuten.
- source_word: antichrist
  choice: ein Antichrist
  rationale: Gibt die prädikative Bezeichnung wieder, ohne sie stillschweigend mit einer einzigen endzeitlichen Gestalt gleichzusetzen.
- source_word: testimony of the Cross
  choice: das Zeugnis des Kreuzes
  rationale: Formnahe Wiedergabe; die mögliche Bedeutung als Bekenntnis zur Botschaft beziehungsweise Wirklichkeit des Kreuzes bleibt offen.
- source_word: oracles of the Lord
  choice: die Aussprüche des Herrn
  rationale: Bezeichnet autoritative Herrenworte natürlich und würdig, ohne den Ausdruck auf einen festgelegten Kanon einzuengen.
- source_word: vain doing
  choice: das nichtige Treiben
  rationale: Gibt eine leere, wertlose Lebenspraxis wieder und vermeidet die zu enge Beschränkung auf einzelne Bräuche.
- source_word: being sober unto prayer
  choice: besonnen sein zum Gebet
  rationale: Bewahrt den Zusammenhang von geistiger Wachheit und Gebet, ohne bloße Nüchternheit vom Alkohol zu suggerieren.
- source_word: constant in fastings
  choice: beharrlich im Fasten
  rationale: Natürliches modernes Deutsch, das die fortdauernde Praxis ausdrückt.
- source_word: all-seeing God
  choice: den alles sehenden Gott
  rationale: Transparente Wiedergabe des Gottesprädikats ohne zusätzliche theologische Ausdeutung.
theological_decisions:
- issue: Christus »im Fleisch gekommen«
  choice: Die traditionelle Formel bleibt wörtlich erkennbar.
  alternative: »wirklich Mensch geworden ist«
  rationale: Die Alternative erklärt die Formel zutreffend in eine Richtung, würde aber ihre frühchristliche sprachliche Gestalt und mögliche intertextuelle Bezüge abschwächen.
- issue: »ist aus dem Teufel«
  choice: Die Herkunfts- beziehungsweise Zugehörigkeitsformel wird beibehalten.
  alternative: »gehört zum Teufel«
  rationale: Die formnähere Wendung bewahrt die scharfe theologische Aussage, ohne ihre genaue Metaphorik aufzulösen.
- issue: »Erstgeborener Satans«
  choice: Das auffällige Rang- und Verwandtschaftsbild bleibt unverändert.
  alternative: »ein führender Sohn Satans«
  rationale: Eine erklärende Wiedergabe würde die ungewöhnliche Zuspitzung abschwächen und eine bestimmte Deutung festlegen.
- issue: Bitte, nicht in Versuchung geführt zu werden
  choice: »dass er uns nicht in Versuchung führt«
  alternative: »dass er uns nicht der Versuchung aussetzt«
  rationale: Die Fassung wahrt die erkennbare Anspielung auf das Vaterunser und löst die damit verbundene theologische Spannung nicht stillschweigend auf.
- issue: Geist und Fleisch
  choice: »Der Geist ist zwar willig, aber das Fleisch ist schwach.«
  alternative: »Der menschliche Geist ist bereit, doch der Körper ist schwach.«
  rationale: Die traditionelle offene Begrifflichkeit bleibt erhalten; weder »Geist« noch »Fleisch« wird anthropologisch enger bestimmt als die überlieferte Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlich-mahnendem Ton. Aufgrund der noch ausstehenden direkten Prüfung der griechischen und lateinischen Überlieferung ist der Entwurf quellenkritisch vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Zeugen; auffällige Formeln und echte theologische Spannungen wurden bewusst nicht geglättet.
