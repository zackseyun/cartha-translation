review_pass:
  verdict: revise
  source_fidelity: Die inhaltliche Abfolge und die scharfen frühchristlichen Formeln werden im Wesentlichen genau wiedergegeben. Die noch ausstehende Prüfung an der griechisch-lateinischen Überlieferung bleibt jedoch erforderlich; diese Revision stützt sich für die Textkontrolle auf den vorgelegten englischen Zeugen. Die Wiedergabe „vom Teufel“ entspricht der Herkunfts-/Zugehörigkeitsaussage des Zeugen idiomatischer als „aus dem Teufel“, ohne sie abzuschwächen.
  naturalness: Mehrere Formulierungen sind würdig und verständlich. „aus dem Teufel“ ist im modernen Standarddeutsch jedoch nicht idiomatisch, und „besonnen sein zum Gebet“ wirkt syntaktisch und kollokativ unnatürlich. „im Gebet wachsam“ gibt die geforderte geistliche Wachheit in natürlichem Deutsch wieder, ohne den Ausdruck einseitig auf Alkoholnüchternheit zu reduzieren.
  terminology: „im Fleisch gekommen“, „Antichrist“, „Zeugnis des Kreuzes“, „Aussprüche des Herrn“, „Erstgeborene Satans“, „Auferstehung“, „Gericht“, „Versuchung“, „Geist“ und „Fleisch“ bleiben angemessen offen und formnah. Für die substantivierte Gruppenbezeichnung ist „der Vielen“ orthographisch geboten.
  issues:
  - severity: medium
    issue: „ist aus dem Teufel“
    rationale: Die Wendung ist zwar formal nachvollziehbar, im heutigen Standarddeutsch aber unidiomatisch. „ist vom Teufel“ bewahrt die Aussage von Herkunft bzw. Zugehörigkeit und ist die geläufige deutsche Entsprechung.
  - severity: medium
    issue: „besonnen sein zum Gebet“
    rationale: Die Formulierung ist im Deutschen wenig natürlich. „im Gebet wachsam“ gibt die mit dem Gebet verbundene geistliche Wachheit klar und idiomatisch wieder.
  - severity: low
    issue: „der vielen“
    rationale: Als substantiviertes Adjektiv für die Menschengruppe ist „Vielen“ großzuschreiben.
  revised_text: 'Denn jeder, der nicht bekennt, dass Jesus Christus im Fleisch gekommen ist, ist ein Antichrist. Wer das Zeugnis des Kreuzes nicht bekennt, ist vom Teufel. Und wer die Aussprüche des Herrn nach seinen eigenen Begierden verdreht und sagt, es gebe weder Auferstehung noch Gericht, der ist der Erstgeborene Satans.


    Darum wollen wir das nichtige Treiben der Vielen und ihre falschen Lehren verlassen und uns dem Wort zuwenden, das uns von Anfang an überliefert wurde. Lasst uns im Gebet wachsam und im Fasten beharrlich sein. Lasst uns den alles sehenden Gott inständig bitten, dass er uns nicht in Versuchung führt, wie der Herr gesagt hat: »Der Geist ist zwar willig, aber das Fleisch ist schwach.«'
