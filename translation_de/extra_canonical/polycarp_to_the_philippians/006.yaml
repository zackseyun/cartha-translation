base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: de
  text: 'Da wir also wissen, dass Gott sich nicht verspotten lässt, sollen wir so leben, wie es seinem Gebot und seiner Herrlichkeit würdig ist.


    Ebenso sollen die Diakone vor seiner Gerechtigkeit untadelig sein: als Diener Gottes und Christi, nicht als Diener von Menschen. Sie sollen niemanden verleumden, nicht doppelzüngig und nicht geldgierig sein, sondern in allem besonnen, mitfühlend und gewissenhaft. Sie sollen nach der Wahrheit des Herrn leben, der zum Diener aller geworden ist.[a] Denn wenn wir ihm in dieser gegenwärtigen Welt gefallen, werden wir auch die kommende Welt empfangen, wie er uns verheißen hat, uns von den Toten aufzuerwecken. Und wenn wir so leben, wie es seiner würdig ist, werden wir auch mit ihm herrschen – sofern wir wirklich glauben.


    Ebenso müssen auch die jungen Männer in allem untadelig sein. Vor allem sollen sie auf Reinheit bedacht sein und sich von allem Bösen zurückhalten. Denn es ist gut, sich der Begierden in der Welt zu enthalten, weil jede Begierde gegen den Geist kämpft.[b] Weder sexuell Unmoralische noch Verweichlichte noch Männer, die sich mit Männern beflecken, werden das Reich Gottes erben; ebenso wenig diejenigen, die Ungehöriges tun.[c] Darum ist es richtig, sich von all diesen Dingen fernzuhalten und sich den Ältesten und Diakonen unterzuordnen wie Gott und Christus.[d] Die Jungfrauen sollen mit einem untadeligen und reinen Gewissen leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Diener« und »Diakon« geben hier zwei Bedeutungsbereiche desselben frühchristlichen Amts- und Dienstwortes wieder; der Satz spielt offenbar auf diese Verbindung an.
    reason: Bewahrt das Wortspiel zwischen allgemeinem Dienst und dem Amt des Diakons.
  - marker: b
    text: »Geist« kann hier auf Gottes Geist bezogen werden; der knappe Wortlaut lässt ohne direkte Prüfung der Überlieferung jedoch offen, ob auch der menschliche Geist gemeint sein könnte.
    reason: Kennzeichnet eine theologisch bedeutsame Mehrdeutigkeit.
  - marker: c
    text: Die Bezeichnungen dieser Aufzählung sind schwer eindeutig in heutige Kategorien zu übertragen. Die Übersetzung folgt vorläufig dem überlieferten englischen Textzeugen; eine unmittelbare Prüfung des griechischen und lateinischen Wortlauts steht noch aus.
    reason: Vermeidet falsche Präzision bei umstrittener sexualethischer Terminologie und dokumentiert die begrenzte Quellenbasis.
  - marker: d
    text: Der Vergleich »wie Gott und Christus« wird bewusst nicht näher erklärt; er fordert Unterordnung, setzt die Amtsträger aber nicht ausdrücklich mit Gott und Christus gleich.
    reason: Bewahrt die starke Formulierung, ohne eine weitergehende Amtslehre einzutragen.
lexical_decisions:
- source_word: walk / walking
  choice: leben
  rationale: Das semitisch-biblische Bild des »Wandelns« bezeichnet die Lebensführung. »Leben« gibt dies in natürlichem modernem Deutsch wieder, ohne den ethischen Sinn abzuschwächen.
- source_word: deacons / minister (deacon)
  choice: Diakone / Diener
  rationale: »Diakone« bezeichnet das gemeindliche Amt; »Diener« gibt beim Herrn den allgemeineren Sinn wieder. Eine Fußnote bewahrt das im Zeugnis erkennbare Wortspiel.
- source_word: presbyters
  choice: Älteste
  rationale: Die transparente frühchristliche Amtsbezeichnung »Älteste« ist verständlicher als das konfessionell stärker geprägte »Presbyter«.
- source_word: double-tongued
  choice: doppelzüngig
  rationale: Die bildhafte, im Deutschen geläufige Bezeichnung bewahrt den Vorwurf widersprüchlichen oder unaufrichtigen Redens.
- source_word: temperate
  choice: besonnen
  rationale: »Besonnen« bezeichnet Selbstbeherrschung ohne die heute engere Assoziation von »mäßig« mit Alkohol oder Konsum.
- source_word: virgins
  choice: Jungfrauen
  rationale: Die konkrete frühchristliche Gruppenbezeichnung wird formal bewahrt und nicht zu »unverheiratete Frauen« verallgemeinert.
theological_decisions:
- issue: »every desire wages war against the Spirit«
  choice: »jede Begierde gegen den Geist kämpft«
  alternative: »jede Begierde gegen den menschlichen Geist kämpft«
  rationale: Die Großschreibung bewahrt die mögliche Bezugnahme auf Gottes Geist, ohne die im englischen Zeugnis verbleibende Deutungsspannung ausdrücklich aufzulösen.
- issue: Bedingung für das Mitherrschen
  choice: »sofern wir wirklich glauben«
  alternative: »wenn wir nur glauben«
  rationale: Die mahnende Bedingung bleibt erhalten; sie wird weder als bloße rhetorische Bekräftigung noch als ausgearbeitete Heilslehre harmonisiert.
- issue: Unterordnung »wie Gott und Christus«
  choice: Wortlautnahe Wiedergabe mit Fußnote
  alternative: »in einer Weise, die der Unterordnung unter Gott und Christus entspricht«
  rationale: Die auffällige Analogie wird nicht abgeschwächt oder ekklesiologisch ausgelegt.
- issue: Sexualethische Begriffe
  choice: »sexuell Unmoralische … Verweichlichte … Männer, die sich mit Männern beflecken«
  alternative: Vereinheitlichung zu modernen Identitätsbezeichnungen
  rationale: Die drei voneinander unterschiedenen, wertenden Ausdrücke des vorliegenden Zeugnisses werden nicht in heutige Kategorien sexueller Identität umgedeutet. Wegen der ausstehenden direkten Prüfung der griechisch-lateinischen Überlieferung bleibt die Formulierung vorläufig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Satzfolgen. Ethisches »walk« wird überwiegend idiomatisch mit »leben« wiedergegeben. Archaismen wie »wandeln«, »Hurerei« und »Lästerer« werden vermieden. Die Fassung ist ausdrücklich vorläufig, da als unmittelbare Grundlage nur der angegebene gemeinfreie englische Textzeuge vorliegt und die direkte griechisch-lateinische Quellenprüfung noch aussteht.
