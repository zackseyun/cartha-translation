review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung gibt den vorliegenden englischen Textzeugen insgesamt zuverlässig wieder und bewahrt die auffälligen Analogien sowie die konditionale Aussage über das Mitherrschen. Einige Formulierungen verschieben jedoch Nuancen: »Sie sollen niemanden verleumden« beschreibt eine einzelne Handlung statt die geforderte Charaktereigenschaft; außerdem ist die Wendung zu Gottes und Christi Diakonen gegenüber Menschen klarer am Satzbau des Zeugen auszurichten. Die direkte Prüfung an griechischer und lateinischer Überlieferung bleibt nach den vorliegenden Metadaten ausstehend.'
  naturalness: Modernes Standarddeutsch und der würdige Registerton gelingen weitgehend. »so leben, wie es seinem Gebot und seiner Herrlichkeit würdig ist« ist jedoch syntaktisch weniger klar als eine personenbezogene Formulierung. »angesichts seiner Gerechtigkeit« und eine prädikative Reihe der geforderten Eigenschaften lesen sich natürlicher.
  terminology: »Diakone«, »Älteste«, »Jungfrauen« und »Reich Gottes« sind angemessen. »Verweichlichte« und die anschließende Umschreibung bleiben, mit erläuternder Fußnote, eine vorläufige und nicht identitätssprachliche Wiedergabe der wertenden, schwer übertragbaren Aufzählung des Textzeugen. Die Fußnote zum Wortspiel Diener/Diakon ist sinnvoll.
  issues:
  - severity: medium
    issue: Unklare Konstruktion bei »würdig« im ersten Satz
    rationale: Der Textzeuge fordert ein Leben bzw. Wandeln, das Gottes Gebot und Herrlichkeit würdig ist. Die bisherige unpersönliche Konstruktion kann so gelesen werden, als sei das Gebot der Herrlichkeit würdig. Eine explizite Zuordnung zum eigenen Leben ist genauer und idiomatischer.
  - severity: medium
    issue: »Sie sollen niemanden verleumden« verengt »not calumniators«
    rationale: Der Zeuge benennt eine zu meidende Eigenschaft (Verleumder), nicht bloß das Unterlassen einer auf ein Objekt bezogenen Handlung. »nicht verleumderisch« bewahrt die paränetische Eigenschaftsreihe.
  - severity: low
    issue: Kontrast »of God and Christ and not of men«
    rationale: Die Ergänzung »nicht als Diener von Menschen« ist verständlich, aber die knappe Gegenüberstellung als Diakone Gottes und Christi, nicht der Menschen, folgt dem Satzbau und der Amtsbezeichnung des Zeugen enger.
