base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: de
  text: 'Denn ich bin überzeugt, dass ihr in den heiligen Schriften gut geschult seid und euch nichts verborgen bleibt. Mir aber ist dies nicht gegeben. Nur heißt es in diesen Schriften: »Seid zornig und sündigt nicht«, und: »Die Sonne soll über eurem Zorn nicht untergehen.« Glücklich ist, wer daran denkt; und ich vertraue darauf, dass dies bei euch der Fall ist.


    Nun möge der Gott und Vater unseres Herrn Jesus Christus und er selbst, der ewige Hohepriester, der Sohn Gottes, Jesus Christus,[a] euch aufbauen in Glauben und Wahrheit, in aller Sanftmut, in der Meidung allen Zorns, in Nachsicht und Langmut, in geduldigem Ausharren und in Reinheit. Er möge euch ein Los und einen Anteil unter seinen Heiligen gewähren, ebenso uns zusammen mit euch und allen unter dem Himmel, die an unseren Herrn und Gott Jesus Christus und an seinen Vater glauben werden, der ihn von den Toten auferweckt hat.


    Betet für alle Heiligen. Betet auch für Könige, Machthaber und Herrscher, für die, die euch verfolgen und hassen, und für die Feinde des Kreuzes, damit eure Frucht unter allen Menschen sichtbar wird und ihr in ihm vollendet seid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »der Sohn Gottes, Jesus Christus« stehen im konsultierten Textzeugen an einer textkritisch unsicheren beziehungsweise ergänzten Stelle. Die genaue Gestalt ist bei der noch ausstehenden direkten Prüfung der griechischen und lateinischen Überlieferung zu bestätigen.
    reason: Der englische öffentliche Textzeuge kennzeichnet hier mit einer öffnenden eckigen Klammer offenbar eine Lücke oder editorische Ergänzung; die Unsicherheit darf in der deutschen Fassung nicht verschwinden.
lexical_decisions:
- source_word: sacred writings / Greek ταῖς ἱεραῖς γραφαῖς (as preserved in the Greek tradition)
  choice: heiligen Schriften
  rationale: Die etablierte, verständliche Wiedergabe wahrt den Bezug auf autoritative heilige Texte, ohne den Umfang eines später festgelegten Kanons eigens zu bestimmen.
- source_word: Be ye angry and sin not
  choice: Seid zornig und sündigt nicht
  rationale: Die auffällige Spannung des Schriftzitats wird formal bewahrt und nicht zu einer bloßen Warnung vor Zorn umgedeutet.
- source_word: avoidance of wrath
  choice: Meidung allen Zorns
  rationale: Diese Formulierung gibt die aktive Abkehr vom Zorn wieder und vermeidet eine unnötig psychologisierende Deutung.
- source_word: forbearance, long suffering, patient endurance
  choice: Nachsicht, Langmut, geduldiges Ausharren
  rationale: Die drei verwandten Tugendbegriffe bleiben unterscheidbar, statt in einem einzigen Wort zusammenzufallen.
- source_word: lot and portion
  choice: Los und Anteil
  rationale: Das biblisch geprägte Doppelbild von zugewiesenem Erbteil und Zugehörigkeit bleibt erhalten.
- source_word: perfect in Him
  choice: in ihm vollendet
  rationale: „Vollendet“ wahrt den geistlichen Ziel- und Reifungsaspekt besser als das im heutigen Deutsch oft absolute „perfekt“.
theological_decisions:
- issue: Bezeichnung Jesu als „unser Herr und Gott“
  choice: unseren Herrn und Gott Jesus Christus
  alternative: unseren Herrn Jesus Christus
  rationale: Die überlieferte Satzgestalt des konsultierten Zeugen verbindet beide Titel mit Jesus Christus; diese christologische Aussage wird nicht abgeschwächt.
- issue: Verhältnis von Vater und Sohn im Segenswunsch
  choice: Der Vater und Jesus Christus werden beide ausdrücklich genannt; das anschließende „er“ bleibt im Deutschen wie im Zeugen kontextabhängig.
  alternative: Alle folgenden Verben ausdrücklich entweder nur dem Vater oder nur Christus zuordnen
  rationale: Eine eindeutige Zuweisung würde die syntaktische und theologische Spannung des überlieferten Wortlauts vorschnell auflösen.
- issue: „die glauben werden“
  choice: Futurische Aussage beibehalten
  alternative: „die glauben“
  rationale: Der konsultierte Zeuge hat eine auf künftigen Glauben gerichtete Form; sie schließt die gegenwärtig Glaubenden nicht ausdrücklich aus, soll aber nicht stillschweigend verallgemeinert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst schriftgeprägtem Ton. Archaismen wie „zürnet“, „Anteil bei den Heiligen“ oder „auf dass“ wurden vermieden. Der Entwurf ist vorläufig, weil die bereitgestellten Metadaten ausdrücklich angeben, dass die direkte Prüfung der griechischen und lateinischen Quellen noch aussteht; deshalb wurden keine unbelegten source-language Präzisierungen vorgenommen.
