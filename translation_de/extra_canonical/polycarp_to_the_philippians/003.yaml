base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: de
  text: 'Darum macht euch bereit zum Handeln und dient Gott in Ehrfurcht und Wahrheit. Lasst das nichtige, leere Gerede und den Irrtum der vielen hinter euch; denn ihr habt an den geglaubt, der unseren Herrn Jesus Christus von den Toten auferweckt und ihm Herrlichkeit und einen Thron zu seiner Rechten gegeben hat. Ihm wurde alles unterworfen, was im Himmel und auf der Erde ist; ihm dient jedes Geschöpf, das Atem hat. Er kommt als Richter über Lebende und Tote. Sein Blut wird Gott von denen fordern, die ihm nicht gehorchen.[a]


    Der aber, der ihn von den Toten auferweckt hat, wird auch uns auferwecken, wenn wir seinen Willen tun, nach seinen Geboten leben und lieben, was er geliebt hat. Dabei sollen wir uns fernhalten von jeder Ungerechtigkeit, Habgier, Geldliebe, übler Nachrede und falschem Zeugnis. Wir sollen nicht Böses mit Bösem vergelten, nicht Beschimpfung mit Beschimpfung, nicht Schlag mit Schlag und nicht Fluch mit Fluch.


    Erinnert euch vielmehr an die Worte, die der Herr sprach, als er lehrte: »Richtet nicht, damit ihr nicht gerichtet werdet. Vergebt, dann wird euch vergeben werden. Seid barmherzig, damit ihr Barmherzigkeit empfangt. Mit dem Maß, mit dem ihr messt, wird euch wieder zugemessen werden.« Und weiter: »Glückselig sind die Armen und die, die um der Gerechtigkeit willen verfolgt werden; denn ihnen gehört das Reich Gottes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sein Blut wird Gott von denen fordern, die ihm nicht gehorchen.« Gemeint ist eine göttliche Einforderung beziehungsweise Rechenschaft wegen seines vergossenen Blutes; der knappe Wortlaut lässt die genaue Beziehung bewusst offen.'
    reason: Die ungewöhnliche Formulierung kann im Deutschen missverstanden werden und soll weder geglättet noch dogmatisch vereindeutigt werden.
lexical_decisions:
- source_word: gird up your loins
  choice: macht euch bereit zum Handeln
  rationale: Die semitisch-biblische Metapher bezeichnet tatbereite Entschlossenheit; die funktionale Wiedergabe ist im modernen Deutsch unmittelbar verständlich.
- source_word: fear
  choice: Ehrfurcht
  rationale: Im Zusammenhang des Gottesdienstes bezeichnet der Ausdruck nicht bloß Angst, sondern ehrfürchtige Gottesfurcht.
- source_word: truth
  choice: Wahrheit
  rationale: Bewahrt die knappe, theologisch offene Verbindung von Ehrfurcht und Wahrheit.
- source_word: walk in His commandments
  choice: nach seinen Geboten leben
  rationale: Gibt die biblische Wegmetapher natürlich und verständlich wieder, ohne ihren ethischen Sinn abzuschwächen.
- source_word: covetousness / love of money
  choice: Habgier / Geldliebe
  rationale: Die zwei verwandten, aber nicht völlig identischen Laster bleiben als getrennte Begriffe erhalten.
- source_word: evil speaking
  choice: üble Nachrede
  rationale: Bezeichnet schädigendes oder verleumderisches Reden präziser als das allgemeinere »böses Reden«.
- source_word: Blessed
  choice: Glückselig
  rationale: Bewahrt den feierlichen Charakter der Seligpreisung und vermeidet eine bloß subjektive Bedeutung von »glücklich«.
theological_decisions:
- issue: Bezugswort der Pronomen in der christologischen Passage
  choice: Die Pronomen werden entsprechend dem Satzverlauf überwiegend auf Jesus Christus bezogen; »zu seiner Rechten« bezieht sich auf Gott.
  alternative: Explizite Wiederholung von »Christus« oder »Gott« an jeder Stelle.
  rationale: So bleibt die syntaktische Dichte und eine gewisse Referenzoffenheit der überlieferten Formulierung erhalten, ohne den deutschen Satz unverständlich zu machen.
- issue: »whose blood God will require«
  choice: »Sein Blut wird Gott von denen fordern, die ihm nicht gehorchen.«
  alternative: »Gott wird diejenigen für sein Blut zur Rechenschaft ziehen, die ihm nicht gehorchen.«
  rationale: Die formnähere Wendung bewahrt das ungewöhnliche, theologisch spannungsreiche Motiv der Blutschuld und löst es nicht stillschweigend als allgemeine Rechenschaft auf.
- issue: Bedingung der Auferweckung
  choice: »wird auch uns auferwecken, wenn wir seinen Willen tun«
  alternative: Die Bedingung abschwächen oder als bloßes Kennzeichen umformulieren.
  rationale: Die konditionale Aussage des Zeugnisses wird beibehalten und nicht konfessionell harmonisiert.
- issue: Reichsformel in der Seligpreisung
  choice: »Reich Gottes«
  alternative: »Himmelreich«
  rationale: Folgt dem vorliegenden Zeugen und harmonisiert die Formulierung nicht mit einer bestimmten kanonischen Parallelstelle.
- issue: »die Armen« ohne nähere Bestimmung
  choice: »die Armen«
  alternative: »die Armen im Geist«
  rationale: Die kürzere Lesart des vorgelegten Zeugnisses bleibt erhalten; eine kanonische Ergänzung wird nicht importiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Klang, jedoch ohne unnötige Archaismen. Da keine griechische oder lateinische Transkription beziehungsweise kritische Textgrundlage mitgeliefert wurde und die direkte Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf quellenbewusst, aber vorläufig auf den angegebenen englischen Public-Domain-Zeugen und die auditierte POB-Konsultationsschicht gestützt. Die Zitate wurden nicht stillschweigend an moderne Bibelübersetzungen harmonisiert.
