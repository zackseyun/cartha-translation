review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen nicht harmonisierte Zitatfolge sowie die konditionale Auferweckungsaussage. Eine sichere Korrektur ist bei der Thronformel nötig: In der deutschen Fassung verweist »zu seiner Rechten« grammatisch naheliegend auf Jesus Christus, während der Satzbau des Zeugen (und dessen Großschreibung) die rechte Seite Gottes meint. Die ungewöhnliche Aussage über das Blut soll weiterhin nicht in eine dogmatisch festgelegte Deutung aufgelöst werden.'
  naturalness: Modernes, würdiges Deutsch; die Satzperioden und die ethischen Reihungen sind gut lesbar. »Gott wird sein Blut von denen einfordern« ist bewusst ungewöhnlich, aber als formnahe Wiedergabe durch die Anmerkung ausreichend erläutert.
  terminology: »Ehrfurcht«, »Herrlichkeit«, »Gebote«, »Habgier«, »Geldliebe«, »falsches Zeugnis« und »Reich Gottes« sind passend und konsistent. »Glückselig« wahrt den gehobenen Duktus der Seligpreisung. Die explizite Nennung Gottes in der Thronformel verhindert einen ungewollten christologischen Referenzwechsel.
  issues:
  - severity: medium
    issue: Unklarer, im Deutschen wahrscheinlich falscher Bezug von »zu seiner Rechten«
    rationale: Nach »Jesus Christus« wird »seiner« im Deutschen regulär auf Christus bezogen. Der vorgelegte Zeuge meint jedoch die rechte Seite dessen, der Christus auferweckte und ihm Herrlichkeit und einen Thron gab, also Gottes. »zu Gottes Rechten« gibt diesen Bezug eindeutig wieder.
  - severity: low
    issue: Die Fußnote wiederholt derzeit den Wortlaut des Haupttexts als angebliches wörtliches Zitat.
    rationale: Die Anmerkung sollte nicht denselben deutschen Satz erneut zitieren, sondern die semantische Spannung der Wendung erläutern. Dadurch bleibt die Ambiguität erhalten und die Fußnote erfüllt eine klare Funktion.
  revised_text: 'Darum macht euch bereit zum Handeln und dient Gott in Ehrfurcht und Wahrheit. Lasst das nichtige, leere Gerede und den Irrtum der vielen hinter euch; denn ihr habt an den geglaubt, der unseren Herrn Jesus Christus von den Toten auferweckt und ihm Herrlichkeit und einen Thron zu Gottes Rechten gegeben hat. Ihm wurde alles unterworfen, was im Himmel und auf der Erde ist; ihm dient jedes Geschöpf, das Atem hat. Er kommt als Richter über Lebende und Tote. Gott wird sein Blut von denen einfordern, die ihm nicht gehorchen.[a]


    Der aber, der ihn von den Toten auferweckt hat, wird auch uns auferwecken, wenn wir seinen Willen tun, nach seinen Geboten leben und lieben, was er geliebt hat. Dabei sollen wir uns fernhalten von jeder Ungerechtigkeit, Habgier, Geldliebe, übler Nachrede und falschem Zeugnis. Wir sollen nicht Böses mit Bösem vergelten, nicht Beschimpfung mit Beschimpfung, nicht Schlag mit Schlag und nicht Fluch mit Fluch.


    Erinnert euch vielmehr an die Worte, die der Herr sprach, als er lehrte: »Richtet nicht, damit ihr nicht gerichtet werdet. Vergebt, dann wird euch vergeben werden. Seid barmherzig, damit ihr Barmherzigkeit empfangt. Mit dem Maß, mit dem ihr messt, wird euch wieder zugemessen werden.« Und weiter: »Glückselig sind die Armen und die, die um der Gerechtigkeit willen verfolgt werden; denn ihnen gehört das Reich Gottes.«'
  revised_footnotes:
  - marker: a
    text: Die knappe Formulierung spricht davon, dass Gott »sein Blut« von den Ungehorsamen einfordern wird. Sie kann eine Einforderung beziehungsweise Rechenschaft wegen des vergossenen Blutes ausdrücken; die genaue Beziehung wird nicht weiter erläutert.
