  - severity: low
    issue: Bedingtheit der Gelegenheit abgeschwächt
    rationale: „sobald sich ... bietet“ klingt wie eine erwartete künftige Gelegenheit; „if I get a fit opportunity“ ist vorsichtiger bedingt.
