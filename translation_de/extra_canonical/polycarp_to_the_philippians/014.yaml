  verdict: revise
  source_fidelity: Die Fassung gibt den Inhalt der bereitgestellten englischen Zeugenübersetzung weitgehend zuverlässig wieder. „wie ihr es erbeten habt“ schwächt jedoch das ausdrücklich befehlende „according as ye gave charge“ ab. Die Formulierung zur Sendung eines Vertreters kann außerdem enger an die Alternative „entweder ich selbst oder derjenige, den ich sende“ gebunden werden.
  naturalness: Der Ton ist überwiegend modernes, würdiges Standarddeutsch. „sobald sich eine geeignete Gelegenheit bietet“ ist geringfügig stärker als das bedingte „if I get“; „wenn ich eine passende Gelegenheit finde“ bildet dies natürlicher und genauer ab. „in Bezug auf unseren Herrn“ ist bei „Erbauung“ idiomatischer als „die unseren Herrn betrifft“.
  terminology: „Gesandter“, „Ausdauer“ und „Erbauung“ sind hier treffend. „Ausdauer“ ist für endurance etwas knapper und im modernen Deutsch geläufiger als „standhaftes Ausharren“. Die Erbauung wird als auf den Herrn bezogen wiedergegeben, ohne eine weitergehende lehrmäßige Aussage einzutragen.
