revisions:
- from: 'Ihr selbst und Ignatius habt mir geschrieben und darum gebeten, dass jemand, wenn er nach Syrien reisen sollte, eure Briefe dorthin mitnimmt. Das werde ich tun, sobald sich eine geeignete Gelegenheit bietet: entweder werde ich selbst reisen oder jemanden schicken, der auch in eurem Auftrag als Gesandter handelt.


    Die Briefe des Ignatius, die er uns zugesandt hat, sowie alle weiteren, die uns vorlagen, senden wir euch, wie ihr es erbeten habt. Sie sind diesem Brief beigefügt. Aus ihnen werdet ihr großen Nutzen ziehen können; denn sie enthalten Glauben, standhaftes Ausharren und jede Art von Erbauung, die unseren Herrn betrifft.[a] Wenn ihr außerdem zuverlässige Nachrichten über Ignatius selbst und seine Begleiter habt, lasst es uns wissen.'
  to: 'Ihr selbst und Ignatius habt mir geschrieben und darum gebeten, dass jemand, wenn er nach Syrien reist, eure Briefe dorthin mitnimmt. Das werde ich tun, wenn ich eine passende Gelegenheit finde: entweder ich selbst oder derjenige, den ich auch als euren Gesandten senden werde.


    Die Briefe des Ignatius, die er uns gesandt hat, sowie alle weiteren, die wir bei uns hatten, senden wir euch, wie ihr es angeordnet habt. Sie sind diesem Brief beigefügt. Aus ihnen werdet ihr großen Nutzen ziehen können; denn sie enthalten Glauben, Ausdauer und jede Art von Erbauung in Bezug auf unseren Herrn. Wenn ihr außerdem zuverlässige Nachrichten über Ignatius selbst und seine Begleiter habt, lasst es uns wissen.'
  rationale: 'Die Revision stellt die Weisung der Philipper wieder her, wahrt die bedingte Aussage über eine Reisemöglichkeit und glättet mehrere Formulierungen, ohne den Sinn zu verändern. Die im Entwurf gesetzte Fußnote wird nicht beibehalten: Der bereitgestellte Wortlaut verbindet den Bezug auf den Herrn unmittelbar mit „jede Art von Erbauung“; die deutsche Fassung bildet genau diese Bindung ab. Die vorläufige Abhängigkeit von der englischen Zeugenübersetzung ist eine editionsgeschichtliche Einschränkung, aber keine Fußnote zum Sinn des Absatzes.'
