base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: de
  text: 'Ihr selbst und Ignatius habt mir geschrieben und darum gebeten, dass jemand, wenn er nach Syrien reist, eure Briefe dorthin mitnimmt. Das werde ich tun, wenn ich eine passende Gelegenheit finde: entweder ich selbst oder derjenige, den ich auch als euren Gesandten senden werde.


    Die Briefe des Ignatius, die er uns gesandt hat, sowie alle weiteren, die wir bei uns hatten, senden wir euch, wie ihr es angeordnet habt. Sie sind diesem Brief beigefügt. Aus ihnen werdet ihr großen Nutzen ziehen können; denn sie enthalten Glauben, Ausdauer und jede Art von Erbauung in Bezug auf unseren Herrn. Wenn ihr außerdem zuverlässige Nachrichten über Ignatius selbst und seine Begleiter habt, lasst es uns wissen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ambassador
  choice: Gesandter
  rationale: Gibt die beauftragte Vertretung würdig und verständlich wieder, ohne ein modernes diplomatisches Amt vorauszusetzen.
- source_word: endurance
  choice: standhaftes Ausharren
  rationale: Bewahrt sowohl den Gedanken der Beständigkeit als auch den des Durchhaltens unter Belastung.
- source_word: edification
  choice: Erbauung
  rationale: Der geläufige frühchristlich-theologische Ausdruck bezeichnet geistliche Stärkung und Förderung; er passt zum würdigen Register.
- source_word: sure tidings
  choice: zuverlässige Nachrichten
  rationale: Drückt den Gegensatz zu unbestätigten Gerüchten in natürlichem modernem Deutsch aus.
theological_decisions:
- issue: Bezug von „which pertaineth unto our Lord“
  choice: „die unseren Herrn betrifft“
  alternative: '„die zu unserem Herrn gehören“ oder Bezug auf alle drei Glieder: „die unseren Herrn betreffen“'
  rationale: Die überlieferte englische Zeugnisformulierung lässt Reichweite und syntaktischen Bezug offen. Der Singular „betrifft“ bindet den Relativsatz zunächst an „jede Art von Erbauung“, ohne den theologischen Zusammenhang der gesamten Aufzählung auszuschließen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, frühchristlichem Briefton. Veraltete Anredeformen wurden vermieden. Der Entwurf beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Zeugnis; eine direkte Prüfung der griechischen und lateinischen Handschriftentradition steht noch aus.
