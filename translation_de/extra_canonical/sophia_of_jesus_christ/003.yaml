translation:
  language: de
  text: 'Philippus fragte: »Herr, wie ist er denn den Vollkommenen erschienen?«


    Der vollkommene Retter sagte zu ihm: »Bevor irgendetwas Sichtbares sichtbar wurde, waren die Hoheit und die Macht [] in ihm, denn er umfasst die Gesamtheit der Allheiten[a], während ihn nichts umfasst. Denn er ist ganz und gar Geist; und er ist Gedanke und Nachdenken, Erwägung, Vernunft und Kraft. Sie alle sind gleichrangige Kräfte und die Quellen der Allheiten. Und ihr ganzes Geschlecht, vom Ersten bis zum Letzten, ist in seinem Vorauswissen – im Vorauswissen des unendlichen, ungezeugten Vaters.


    Thomas fragte ihn: »Herr und Retter, aus welchem Grund entstanden diese, und warum wurden sie offenbart?«


    Der vollkommene Retter sagte: »Ich bin aus dem Unendlichen hervorgegangen, um euch alles mitzuteilen. Der Geist, der ist[b], war es, der zeugte. Er besaß die Kraft <eines> Zeugenden [] und das Wesen dessen, der [Gestalt verleiht], damit der große Reichtum offenbar würde, der in ihm verborgen war. Aus Erbarmen und Liebe wollte er aus sich selbst Frucht hervorbringen: Er wollte seine Güte nicht ganz allein <genießen>, sondern auch andere Geister des unbewegten Geschlechts[c] sollten Körper und Geister hervorbringen, Herrlichkeit und Ehre in Unvergänglichkeit sowie seine unendliche Gabe. So sollte sein Schatz durch den selbstgezeugten Gott offenbar werden, den Vater aller Unvergänglichkeit und all derer, die danach ins Dasein kommen sollten, aber noch nicht sichtbar erschienen waren. Unter den Unvergänglichen besteht ein großer Unterschied.«


    Er rief laut: »Wer Ohren hat, von den Unendlichen zu hören, der höre!« Und: »Ich habe zu denen gesprochen, die wach sind!«


    Dann fuhr er [] fort: »Alles, was aus dem Vergänglichen hervorgegangen ist, wird vergehen, denn es ist aus dem Vergänglichen hervorgegangen. Was aber aus dem Unvergänglichen hervorgegangen ist, wird nicht vergehen, sondern unvergänglich sein.


    Darum gingen viele in die Irre, weil sie diesen Unterschied nicht kannten, und sie starben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Allheiten« gibt einen technischen kosmologischen Ausdruck wieder, der die Gesamtheit der Wirklichkeitsbereiche oder Ordnungen bezeichnen kann.
    reason: Der ungewohnte Plural soll verständlich gemacht werden, ohne ihn auf »das All« oder »das Universum« zu verengen.
  - marker: b
    text: 'Wörtlich: »der Geist, der ist«; möglicherweise eine titelartige Bezeichnung.'
    reason: Die eigentümliche Formulierung und ihre mögliche Titelfunktion sollen sichtbar bleiben.
  - marker: c
    text: »Unbewegtes Geschlecht« ist ein technischer Ausdruck; gemeint sein kann eine unwandelbare oder unerschütterliche geistige Gemeinschaft.
    reason: Die wörtliche Wiedergabe ist erklärungsbedürftig, während eine eindeutigere Übersetzung die Deutung vorwegnehmen würde.
lexical_decisions:
- source_word: the entirety of the Totalities
  choice: die Gesamtheit der Allheiten
  rationale: Bewahrt die kosmologische Fachsprache und die auffällige Doppelung des Zeugnisses, ohne sie vereinfachend mit »Universum« gleichzusetzen.
- source_word: mind
  choice: Geist
  rationale: Im gegebenen Zusammenhang bezeichnet das Wort ein geistiges Erkenntnisvermögen; »Verstand« wäre enger und könnte die Reihe zu stark psychologisieren.
- source_word: foreknowledge
  choice: Vorauswissen
  rationale: Gibt den Erkenntnisaspekt wieder, ohne mit »Vorherbestimmung« eine zusätzliche theologische Festlegung einzutragen.
- source_word: The Spirit Who Is
  choice: der Geist, der ist
  rationale: Erhält die ungewöhnliche Seinsbezeichnung als Titel beziehungsweise Wesensaussage und glättet sie nicht zu »der lebendige Geist«.
- source_word: unmoving generation
  choice: unbewegtes Geschlecht
  rationale: Bewahrt den technischen und möglicherweise kosmologischen Ausdruck; »unerschütterliches Geschlecht« wäre deutender.
- source_word: self-begotten God
  choice: selbstgezeugter Gott
  rationale: Gibt die Zeugungsmetaphorik direkt wieder und vermeidet die sachlich abweichende Wiedergabe »selbstgeschaffener Gott«.
- source_word: indestructability / imperishable
  choice: Unvergänglichkeit / unvergänglich
  rationale: Verwendet im Deutschen einen würdigen, verständlichen Ausdruck und hält den begrifflichen Zusammenhang im gesamten Abschnitt aufrecht.
theological_decisions:
- issue: Beziehung zwischen den aufgezählten Kräften und dem Vater
  choice: 'Die grammatische Spannung bleibt erhalten: Die Kräfte sind in »seinem« Vorauswissen, anschließend wird der unendliche, ungezeugte Vater appositionell genannt.'
  alternative: Das Pronomen ausdrücklich auf den Vater beziehen oder den Satz in zwei eindeutige Aussagen auflösen.
  rationale: Das Zeugnis lässt die Referenz und Syntax in gewissem Maß offen; eine dogmatische Identifizierung oder Trennung wäre nicht quellengerecht.
- issue: Funktion des Geistes, der ist
  choice: »war es, der zeugte«
  alternative: »war der Erzeuger« oder »brachte alles hervor«
  rationale: Die personale und generative Sprache des Zeugnisses wird bewahrt, ohne den Umfang des Hervorgebrachten über den Text hinaus festzulegen.
- issue: Andere Geister und ihr Hervorbringen
  choice: Die Aussage, dass andere Geister Körper und Geister hervorbringen sollten, bleibt wörtlich spannungsreich stehen.
  alternative: Die Körper und Geister als bloße Empfänger von Herrlichkeit oder als Geschöpfe allein des Vaters darstellen.
  rationale: Die kosmologische Aussage ist ungewöhnlich, darf aber nicht konfessionell oder systematisch geglättet werden.
- issue: »Großer Unterschied« unter den Unvergänglichen
  choice: Die Aussage wird ohne Erklärung oder Hierarchisierung wiedergegeben.
  alternative: Den Unterschied als Rangordnung, Wesensunterschied oder moralische Verschiedenheit bestimmen.
  rationale: Das Zeugnis benennt den Unterschied, erklärt hier aber nicht eindeutig seine Art.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener kosmologischer Fachsprache. Die Zeichen [], < > und [ ] wurden als textkritische Unsicherheits- beziehungsweise Ergänzungssignale des bereitgestellten englischen Zeugnisses beibehalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich vorläufig und quellennah am öffentlichen englischen Übersetzungszeugen ausgerichtet.
