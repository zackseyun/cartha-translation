    „Wie [] ein Tröpfchen aus dem Licht wird jeder, der in die Welt eintritt, von ihm in die Welt des Allmächtigen gesandt, damit dieser über ihn wache. Und nach dem Willen Sophias fesselte das Band seines Vergessens das Licht, damit dadurch die Angelegenheit der ganzen verarmten Welt <offenbart> werden konnte, nämlich der Hochmut und die Blindheit (des Allmächtigen) sowie die Unwissenheit, die ihm seinen Namen gab.[b]


    „Ich aber kam nach dem Willen des großen Lichtes aus den oberen Bereichen hervor, <indem ich mich> aus jener Fessel <löste>, und setzte dem Wirken der Räuber ein Ende. Ich habe jenes von Sophia gesandte Tröpfchen erweckt, damit es durch mich viel Frucht bringe, vollendet werde und nie wieder mangelhaft werde, sondern durch mich, den großen Retter, <verbunden> werde, damit seine Herrlichkeit offenbar werde; damit auch Sophia in Bezug auf jenen Mangel berichtigt werde und ihre [] Kinder nie wieder mangelhaft würden, sondern Ehre und Herrlichkeit erlangten, zu ihrem Vater aufstiegen und die Rede des männlichen Lichtes verstünden.[c]


    „Und ihr wurdet vom Sohn gesandt, der selbst gesandt wurde, damit ihr Licht erlangt und euch vom Vergessen der Mächte trennt und es nicht noch einmal durch euch offenbar werde, nämlich die unreine Reibung, die aus dem furchterregenden Feuer hervorgeht, das ihrem Phallus entströmte. Tretet ihre böse Absicht nieder.“'
