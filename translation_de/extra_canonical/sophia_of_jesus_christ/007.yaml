review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Übersetzungszeugen weitgehend zuverlässig und bewahrt Textlücken ([]), editorische Ergänzungen (<…>) sowie die auffällige kosmologische und sexuelle Bildsprache. Einige Formulierungen glätten jedoch wesentliche Eigenheiten oder sind syntaktisch nicht tragfähig: „unsichtbare Bereiche“ konkretisiert den abstrakten Plural zu stark, „brachte ... hervor“ ist stärker als „manifested“, und „<löste> aus jener Fessel“ lässt die im Zeugen markierte partizipiale Konstruktion unvollständig.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „mannweiblich“ ist verständlich, wirkt aber unnötig archaisierend; „androgyn“ ist im heutigen Deutsch die präzise und natürliche Entsprechung. Die Wendung, Sophia werde „von jenem Mangel berichtigt“, ist nicht idiomatisch. Die Revision verbessert diese Punkte, ohne die bewusst fremde Terminologie des Textes zu normalisieren.
  terminology: „Menschensohn“, „Sophia“, „Pistis“, „der Allmächtige“, „Mächte“, „Phallus“ und die generativen Namensformeln bleiben erhalten. „Unsichtbarkeiten“ gibt den ungewöhnlichen kosmologischen Plural genauer wieder. „offenbarte“ entspricht „manifested“ besser als die schöpfungsstärkere Formulierung „brachte ... hervor“.
  issues:
  - severity: medium
    issue: „unsichtbare Bereiche“ konkretisiert „invisibilities“.
    rationale: Der Zeuge verwendet einen abstrakten, pluralischen kosmologischen Ausdruck. „Unsichtbarkeiten“ erhält diese Fremdheit und Pluralität, während „Bereiche“ räumliche Sphären einträgt.
  - severity: medium
    issue: „brachte ... hervor“ verschärft „manifested“.
    rationale: „Manifested“ bezeichnet zunächst Offenbarung/Erscheinung. „hervorbringen“ kann eine stärkere Erzeugungsaussage nahelegen.
  - severity: medium
    issue: Die Ergänzung „<löste> aus jener Fessel“ ist syntaktisch unvollständig.
    rationale: Das englische „<loosing> from that fetter“ ist als ergänzte begleitende Handlung formuliert. „<indem ich mich ... löste>“ macht die deutsche Konstruktion vollständig und bewahrt die editorische Markierung.
  - severity: medium
    issue: „Sophia von jenem Mangel berichtigt“ ist im Deutschen nicht idiomatisch.
    rationale: Eine Formulierung mit „in Bezug auf“ gibt die schwerfällige, aber erkennbare Korrekturvorstellung wieder, ohne eine spezifische theologische Deutung wie Heilung oder Erlösung einzutragen.
  - severity: low
    issue: „mannweiblich“ ist im modernen Standarddeutsch unnötig altertümlich.
    rationale: „androgyn“ ist die unmittelbare, etablierte deutsche Entsprechung und bewahrt die ausdrücklich männlich-weibliche Charakterisierung.
  revised_text: 'Seine Jünger sprachen erneut: „Sag uns deutlich, wie sie aus den Unsichtbarkeiten herabkamen, aus dem Unvergänglichen in die Welt der Sterblichkeit.“


