translation:
  language: de
  text: 'Seine Jünger fragten erneut: „Sag uns deutlich, wie sie aus den unsichtbaren Bereichen herabkamen, aus dem Unvergänglichen in die Welt der Sterblichkeit.“


    Der vollkommene Retter sagte: „Der Menschensohn verband sich mit seiner Gefährtin Sophia und brachte ein mächtiges mannweibliches Licht hervor. Sein männlicher Name lautet ‚Retter, All-Erzeuger‘. Sein weiblicher Name lautet ‚All-Erzeugerin Sophia‘; manche nennen sie ‚Pistis‘.[a]


    „Wie [] ein Tröpfchen aus dem Licht wird jeder, der in die Welt eintritt, von ihm in die Welt des Allmächtigen gesandt, damit er über ihn wache. Und nach dem Willen Sophias fesselte das Band seines Vergessens das Licht, damit dadurch die Angelegenheit der ganzen verarmten Welt <offenbart> werden konnte: der Hochmut und die Blindheit (des Allmächtigen) sowie die Unwissenheit, die ihm seinen Namen gab.[b]


    „Ich aber kam nach dem Willen des großen Lichtes aus den oberen Bereichen hervor, <löste> aus jener Fessel und setzte dem Wirken der Räuber ein Ende. Ich habe jenes von Sophia gesandte Tröpfchen erweckt, damit es durch mich viel Frucht bringe, vollkommen werde und nie wieder mangelhaft sei, sondern durch mich, den großen Retter, <verbunden> werde, damit seine Herrlichkeit offenbar werde; damit auch Sophia von jenem Mangel berichtigt werde und ihre [] Kinder nie wieder mangelhaft würden, sondern Ehre und Herrlichkeit erlangten, zu ihrem Vater aufstiegen und die Rede des männlichen Lichtes verstünden.[c]


    „Und ihr wurdet vom Sohn gesandt, der selbst gesandt wurde, damit ihr Licht erlangt und euch vom Vergessen der Mächte trennt. Es soll euretwegen nie wieder in Erscheinung treten – nämlich die unreine Reibung, die aus dem furchterregenden Feuer hervorgeht, das ihrem Phallus entströmte. Tretet ihre böse Absicht nieder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Pistis“ ist ein griechischer Name beziehungsweise Begriff und kann je nach Zusammenhang „Glaube“, „Vertrauen“ oder „Treue“ bedeuten.
    reason: Der Eigenname bleibt im Text stehen; die Fußnote erschließt sein Bedeutungsspektrum, ohne es auf eine einzige Übersetzung festzulegen.
  - marker: b
    text: Die eckigen Klammern [] kennzeichnen eine Lücke im überlieferten Text; spitze Klammern <…> eine editorische Ergänzung. Die runden Klammern um „des Allmächtigen“ zeigen eine im Übersetzungszeugen verdeutlichte Bezugnahme an.
    reason: Die materiellen und editorischen Unsicherheiten des zugrunde liegenden Zeugen müssen transparent bleiben.
  - marker: c
    text: Auch hier zeigen [] eine Textlücke und <…> eine editorische Ergänzung an; der genaue Wortlaut und teilweise auch die Satzbezüge bleiben daher unsicher.
    reason: Mehrere beschädigte oder ergänzte Stellen beeinflussen Syntax und Referenz und dürfen nicht als sicherer Text ausgegeben werden.
lexical_decisions:
- source_word: invisibilities
  choice: unsichtbare Bereiche
  rationale: Das abstrakte Pluralwort wird verständlich räumlich wiedergegeben, ohne die Mehrzahl oder kosmologische Offenheit aufzugeben.
- source_word: deathless
  choice: das Unvergängliche
  rationale: Bewahrt den substantivierten kosmologischen Gegensatz zur Welt der Sterblichkeit.
- source_word: consorted with
  choice: verband sich mit
  rationale: Gibt die Verbindung natürlich wieder, ohne ihre genaue sexuelle oder metaphysische Art stärker festzulegen als der Zeuge.
- source_word: androgynous
  choice: mannweiblich
  rationale: Ein traditionsnaher, verständlicher Ausdruck, der die ausdrücklich männlich-weibliche Doppelgestalt des Lichtes wahrt.
- source_word: All-Begetter
  choice: All-Erzeuger / All-Erzeugerin
  rationale: Bewahrt den generativen Sinn und bildet die männliche und weibliche Namensform im Deutschen sichtbar ab.
- source_word: Pistis
  choice: Pistis
  rationale: Der griechisch-koptisch tradierte Eigenname bleibt unübersetzt; eine Festlegung allein auf „Glaube“ oder „Treue“ würde die Namensfunktion verengen.
- source_word: authorities
  choice: Mächte
  rationale: „Mächte“ ist in antiker kosmologischer Sprache idiomatisch und vermeidet die primär moderne Verwaltungsbedeutung von „Autoritäten“.
- source_word: defective / defect
  choice: mangelhaft / Mangel
  rationale: Hält die wiederkehrende Wortfamilie erkennbar zusammen und vermeidet eine unnötig moralische Deutung.
- source_word: rectified
  choice: berichtigt
  rationale: Bewahrt den Gedanken einer Korrektur oder Wiederherstellung, ohne ein ausgearbeitetes Erlösungssystem hineinzulesen.
theological_decisions:
- issue: Bezeichnung „Almighty“ in einer offenbar kritischen kosmologischen Rolle
  choice: der Allmächtige
  alternative: der Allherrscher
  rationale: Die geläufige Titelform wird beibehalten; der Text selbst, nicht eine erklärende Übersetzung, trägt die Spannung zwischen Titel, Hochmut, Blindheit und Unwissenheit.
- issue: Geschlechtlicher Bezug des Lichttröpfchens
  choice: grammatisch sächliche Bezüge („es“), beim Menschen allgemein „er“
  alternative: durchgehend männliche Bezüge
  rationale: Die wechselnden Referenzen des Zeugen bleiben soweit möglich sichtbar, ohne das Tröpfchen vorschnell mit einer bestimmten theologischen Person gleichzusetzen.
- issue: „the ignorance that named him“
  choice: „die Unwissenheit, die ihm seinen Namen gab“
  alternative: „die Unwissenheit, die ihn benannte“
  rationale: Die ungewöhnliche Aussage wird nicht harmonisiert; „ihm seinen Namen gab“ ist im Deutschen verständlich und erhält die theologische Spannung.
- issue: Sexuell-kosmologische Bildsprache
  choice: „unreine Reibung“ und „Phallus“ ausdrücklich bewahrt
  alternative: euphemistische Umschreibung
  rationale: Die befremdliche Bildsprache gehört zum Text und darf nicht konfessionell oder sittlich geglättet werden.
- issue: Sohn als Gesandter und Sendender
  choice: „vom Sohn gesandt, der selbst gesandt wurde“
  alternative: Ausgleich der scheinbaren Hierarchie
  rationale: Die doppelte Sendung wird ohne systematische Harmonisierung erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst erhaltener kosmologischer Fremdheit. Wiederkehrende Begriffe und Namensformeln wurden möglichst konsistent wiedergegeben. Da nur ein öffentlicher englischer Übersetzungszeuge vorliegt und die direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich vorläufig; Schadens- und Ergänzungszeichen wurden beibehalten.
