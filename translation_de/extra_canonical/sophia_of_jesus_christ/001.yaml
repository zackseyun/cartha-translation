lexical_decisions:
- source_word: fundamental nature
  choice: grundlegendes Wesen
  rationale: Gibt die ontologische Fragestellung verständlich wieder, ohne sie durch einen späteren philosophischen Fachbegriff enger festzulegen.
- source_word: plan
  choice: Plan
  rationale: Bewahrt die mögliche kosmologische und heilsgeschichtliche Bedeutung des Ausdrucks, ohne ihn mit »Ratschluss« konfessionell aufzuladen.
- source_word: authorities
  choice: Herrschenden
  rationale: Lässt offen, ob menschliche oder kosmische Mächte gemeint sind; »Obrigkeiten« wäre im heutigen Deutsch stärker politisch geprägt.
- source_word: likeness
  choice: Erscheinung / Gestalt
  rationale: Die kontextabhängige Variation erzeugt natürliches Deutsch und wahrt sowohl die sichtbare Ähnlichkeit als auch die Frage nach Gottes Gestalt.
- source_word: invisible spirit
  choice: der unsichtbare Geist
  rationale: Formale Wiedergabe der paradoxen Erscheinung; die Spannung zwischen Erscheinen und Unsichtbarkeit bleibt bestehen.
- source_word: providence
  choice: Vorsehung
  rationale: Etablierter deutscher Ausdruck für die philosophisch-theologische Kategorie.
- source_word: fate
  choice: Schicksal
  rationale: Natürliche und sachlich offene Wiedergabe der dritten kosmologischen Position.
- source_word: Infinite Light
  choice: unendliches Licht
  rationale: Bewahrt das kosmologische Bild und vermeidet eine unbelegte Deutung als Eigenname; Kleinschreibung folgt modernem Deutsch.
- source_word: knowledge / know
  choice: Erkenntnis / erkennen
  rationale: Markiert die im Text gemeinte tiefere Einsicht deutlicher als bloßes Faktenwissen.
- source_word: impure rubbing
  choice: unreine Reibung
  rationale: Bewahrt die auffällige, möglicherweise sexuelle Bildsprache des Zeugen, statt sie erklärend zu glätten.
theological_decisions:
- issue: Art der Erscheinung des Retters
  choice: »nicht in seiner früheren sichtbaren Gestalt, sondern als der unsichtbare Geist«
  alternative: »nicht in seiner früheren Form, sondern in unsichtbarer geistiger Gestalt«
  rationale: Die gewählte Fassung erhält die Spannung zwischen konkretem Erscheinen und unsichtbarem Geist und harmonisiert sie nicht.
- issue: »reines, vollkommenes Fleisch«
  choice: wörtlich als »reines, vollkommenes Fleisch« bewahrt
  alternative: »reiner, vollkommener Leib«
  rationale: Der ungewöhnliche Ausdruck ist theologisch bedeutsam und soll nicht spiritualisiert oder normalisiert werden.
- issue: Kritik an Selbstentstehung, Vorsehung und Schicksal
  choice: als Kritik an drei philosophischen Auffassungen formuliert
  alternative: als pauschale Verwerfung jeder göttlichen Vorsehung verstanden
  rationale: Der Kontext behandelt konkurrierende kosmologische Theorien. Die Übersetzung vermeidet, die Aussage vorschnell mit späteren Lehrsystemen gleichzusetzen.
- issue: Bezug von »he« im Schlusssatz
  choice: »dieser« bezieht sich möglichst nahe auf den zuerst Gesandten
  alternative: Bezug auf den würdigen Empfänger der Erkenntnis
  rationale: Der englische Zeuge legt den zunächst Gesandten als grammatischen Bezug nahe, doch die Stelle bleibt inhaltlich schwierig; die Übersetzung macht keine weitergehende Identifikation.
- issue: Zeugung durch »unreine Reibung«
  choice: Bildsprache beibehalten
  alternative: als gewöhnliche geschlechtliche Zeugung paraphrasieren
  rationale: Eine Paraphrase würde die anthropologische Aussage stärker auslegen, als die vorläufige Quellenlage erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerisch klarer Syntax. Ungewöhnliche kosmologische und anthropologische Aussagen wurden nicht konfessionell harmonisiert. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist dies ein vorläufiger, quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugen.
