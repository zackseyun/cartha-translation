review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und erhält dessen ungewöhnliche Kosmologie, die dreifache Zurückweisung philosophischer Erklärungsmodelle sowie die auffällige Formulierung über »unreine Reibung«. Die drei Lückenzeichen sind korrekt durch Fußnoten verankert. Eine direkte Prüfung am koptischen Wortlaut ist anhand der vorliegenden Daten nicht möglich und bleibt erforderlich.
  naturalness: 'Der Text ist überwiegend idiomatisches, würdevolles modernes Standarddeutsch. Eine sichere sprachliche Korrektur ist jedoch nötig: »was er wirklich gleicht« ist im Deutschen ungrammatisch und verschiebt die Aussage. Einige kleinere Anpassungen verbessern zudem die Bezugsklarheit und geben »tall radiant angel« genauer wieder.'
  terminology: »Retter«, »Vorsehung«, »Schicksal«, »Erkenntnis«, »unendliches Licht« und »reine[s], vollkommene[s] Fleisch« sind angemessen und nicht konfessionell harmonisierend. »Mächte« für authorities wahrt besser die offene, möglicherweise übermenschliche Bedeutung als »Herrschende«.
  issues:
  - severity: medium
    issue: Unidiomatische und sinnverunklarende Wiedergabe von »what he resembles I must not describe«
    rationale: »Doch was er wirklich gleicht« ist grammatisch nicht möglich. Der Zeuge besagt, dass sein Aussehen bzw. seine Ähnlichkeit nicht beschrieben werden darf; dies sollte ohne zusätzliche Einschränkung wie »wirklich« wiedergegeben werden.
  - severity: low
    issue: »großen, strahlenden Engels« lässt »tall« nur ungenau erkennen
    rationale: »Groß« kann im Deutschen auch Bedeutung oder Macht meinen. »Hochgewachsen« gibt die körperliche Größe des Zeugen präziser wieder.
  - severity: low
    issue: »Macht der Herrschenden« verengt authorities unnötig auf menschliche Herrschende
    rationale: Im vorliegenden kosmologischen Kontext kann authorities auch übermenschliche Gewalten bezeichnen. »Mächte« bewahrt diese Offenheit.
  revised_text: 'Nachdem er von den Toten auferstanden war, blieben seine zwölf Jünger und sieben Frauen seine Nachfolger und zogen nach Galiläa, zu dem Berg [a], der »Ort der Ernte und der Freude« genannt wird. Als sie zusammenkamen, rätselten sie über das grundlegende Wesen der Welt, den Plan, die göttliche Vorsehung, die Macht der Mächte und darüber, wie der Retter im Geheimnis des göttlichen Plans mit ihnen umgeht. Der Retter erschien nicht in seiner früheren sichtbaren Gestalt, sondern als der unsichtbare Geist. Seine Erscheinung glich der eines hochgewachsenen, strahlenden Engels. Doch wie er aussieht, darf ich nicht beschreiben, denn kein sterbliches Wesen könnte es ertragen; sie war ganz und gar reines, vollkommenes Fleisch, so wie er es uns auf dem Berg gelehrt hatte, der in Galiläa »Ölberg« genannt wird.



    Er sagte: »Friede sei mit euch! Meinen Frieden gebe ich euch!« Da wurden sie alle von Ehrfurcht ergriffen und fürchteten sich.



    Der Retter [b] lachte und fragte sie: »Worüber denkt ihr nach? Warum seid ihr ratlos? Was sucht ihr?«



    Philippus sagte: »Wir suchen das grundlegende Wesen der Welt und ihren Plan.«



    Der Retter sagte zu ihnen: »Ihr sollt verstehen: Alle, die seit Grundlegung der Welt bis heute auf Erden geboren wurden, sind Staub. Obwohl sie nach Gott, seinem Wesen und seiner Gestalt geforscht haben, haben sie ihn nicht gefunden. Die größten Weisen unter ihnen haben aus der Ordnung und dem Lauf der Welt Vermutungen angestellt; doch ihre Vermutungen sind nicht zur Wahrheit gelangt.



    Alle Philosophen sagen, die Weltordnung werde auf eine von drei verschiedenen Weisen gelenkt, und deshalb sind sie uneins. Einige behaupten, die Welt lenke sich selbst. [c] Andere behaupten, die Vorsehung lenke sie, und wieder andere, es sei das Schicksal. Doch nichts davon trifft zu.



    Ich sage es noch einmal: Keine der drei Auffassungen, die ich eben genannt habe, kommt der Wahrheit nahe, denn sie sind menschliche Vermutungen. Ich aber bin aus dem unendlichen Licht hervorgegangen. Weil ich ihn kenne, bin ich hier, damit ich euch genau sage, was die Wahrheit ist. Das Leben alles dessen, was aus sich selbst entstanden ist, ist unrein, weil es sich selbst hervorgebracht hat. Die Lehre von der Vorsehung enthält keine Weisheit, und die Lehre vom Schicksal keine Einsicht.



    Euch aber ist es gegeben zu erkennen. Auch jeder andere, der der Erkenntnis würdig ist, wird sie empfangen: jeder, der nicht durch die Aussaat unreiner Reibung gezeugt wurde, sondern durch den, der als Erster gesandt wurde; denn dieser ist ein Unsterblicher unter Sterblichen.«'
