  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: de
  text: 'Maria fragte ihn: „Heiliger Herr, woher stammen deine Jünger, wohin gehen sie, und wie sollen sie sich hier verhalten?“


    Der vollkommene Retter sagte zu ihnen: „Ich will, dass ihr wisst: Sophia, die Mutter der Welt und die Gefährtin, wollte diese aus sich selbst, ohne ihr männliches Gegenstück, ins Dasein bringen. Doch nach dem Willen des Vaters der Welt – damit seine unfassbare Güte offenbar werden konnte – schuf er den Vorhang zwischen den Unsterblichen und denen, die danach kamen, sodass daraus folgen konnte, dass […]


    (Koptische Seiten 115–116 fehlen)[a]


    […] „[…] und Atem und aus zweien eins werden konntet, wie es von Anfang an war, damit ihr viel Frucht hervorbringen und zu dem aufsteigen könnt, der von Anfang an ist, in unaussprechlicher Freude und Herrlichkeit und [Ehre und] der Gabe des [Vaters der Welt].[b]


    „[Folglich wird], wer den [Vater mit vollkommener] Erkenntnis erkennt, zum Vater [gehen und im] ungezeugten [Vater Ruhe finden]. Wer ihn jedoch [unvollkommen erkennt], wird [zum Mangel] und zur Ruhe [der Achtheit gehen].[c]


    „[Nun wird], wer den unsterblichen [Geist] des Lichts in der Stille erkennt, indem er nachsinnt und der Wahrheit zustimmt, wenn er mir Zeichen des Unsichtbaren gibt, zu einem Licht im stillen Geist werden. Wer den Menschensohn in Erkenntnis und Liebe erkennt, kann, wenn er mir ein Zeichen des […] Menschensohnes gibt, zu den Wohnstätten derer in der Achtheit gehen.“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im koptischen Manuskript fehlen hier die Seiten 115–116; der Gedankengang ist daher unterbrochen.
    reason: Kennzeichnet einen erheblichen materiellen Textverlust.
  - marker: b
    text: Eckige Klammern und Auslassungspunkte kennzeichnen beschädigten, fehlenden oder ergänzten Text. Der Satzanfang vor „und Atem“ ist verloren.
    reason: Macht sichtbar, dass Syntax und Zusammenhang nur fragmentarisch erhalten sind.
  - marker: c
    text: „Achtheit“ gibt „Ogdoad“ wieder, einen kosmologischen Bereich oder eine Gruppe von acht; die genaue Bedeutung im beschädigten Zusammenhang bleibt offen.
    reason: Erklärt einen technischen Begriff, ohne eine bestimmte kosmologische Systematik aufzuzwingen.
  - marker: d
    text: Auch in diesem Abschnitt zeigen die eckigen Klammern unsichere Ergänzungen oder Lücken an. Was mit den „Zeichen“ gemeint ist, bleibt unbestimmt.
    reason: Bewahrt die textliche und sachliche Unsicherheit.
lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Der Eigenname und zugleich bedeutungstragende griechische Begriff wird beibehalten, statt ihn auf „Weisheit“ zu reduzieren.
- source_word: consort
  choice: Gefährtin
  rationale: Gibt die partnerschaftliche kosmologische Rolle verständlich wieder, ohne eine Ehebeziehung stärker festzulegen, als der englische Zeuge erlaubt.
- source_word: male (counterpart)
  choice: männliches Gegenstück
  rationale: Bewahrt die Vorstellung eines komplementären männlichen Partners und vermeidet die missverständliche bloße Wiedergabe „Mann“.
- source_word: curtain
  choice: Vorhang
  rationale: Nahe, konkrete Wiedergabe des Bildes einer trennenden kosmischen Grenze.
- source_word: unbegotten
  choice: ungezeugt
  rationale: 'Bewahrt den technischen theologischen Sinn: Der Vater ist nicht durch Zeugung hervorgegangen.'
- source_word: Ogdoad
  choice: Achtheit
  rationale: Ein verständliches deutsches Fachwort für die kosmologische Sphäre der Acht; nicht interpretierend als „achter Himmel“ präzisiert.
- source_word: repose
  choice: Ruhe finden / Ruhe
  rationale: Gibt sowohl den Vorgang als auch den Zustand wieder und lässt den soteriologischen Sinn offen.
- source_word: He Who Is from the beginning
  choice: der, der von Anfang an ist
  rationale: Bewahrt die substantivische Umschreibung und ihren möglichen metaphysischen Nachdruck, ohne sie mit einem anderen Gottesnamen gleichzusetzen.
theological_decisions:
- issue: Sophias eigenständiges Hervorbringen
  choice: „aus sich selbst, ohne ihr männliches Gegenstück“
  alternative: „allein, ohne ihren Mann“
  rationale: Die Übersetzung wahrt die kosmologische Komplementarität und legt weder biologische Zeugung noch eine gewöhnliche Ehe fest.
- issue: Wille des Vaters und Entstehung des Vorhangs
  choice: Der Vater der Welt ist grammatisch das Subjekt von „schuf“
  alternative: Unpersönliche oder passivische Formulierung
  rationale: Dies folgt dem vorliegenden englischen Zeugen, obwohl eine direkte Prüfung des koptischen Textes noch aussteht.
- issue: Vollkommene und unvollkommene Erkenntnis
  choice: Die unterschiedlichen Ziele „Vater“ und „Mangel/Achtheit“ bleiben nebeneinander stehen
  alternative: Harmonisierung zu abgestuften Formen desselben Heils
  rationale: Die theologische Spannung des beschädigten Textes darf nicht stillschweigend aufgelöst werden.
- issue: „Zeichen geben“ als Bedingung
  choice: Die schwer deutbare Wendung wird formal bewahrt
  alternative: Deutung als Bekenntnis, Sakrament, Erkennungszeichen oder Beweis
  rationale: Der Zeuge bestimmt Art und Funktion der Zeichen nicht eindeutig.
- issue: Stiller Geist
  choice: „stiller Geist“
  alternative: „Geist der Stille“
  rationale: Die attributive Mehrdeutigkeit wird möglichst eng bewahrt; eine hypostatische Deutung als Eigenname wird nicht erzwungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Technische kosmologische Begriffe werden entweder beibehalten („Sophia“) oder knapp verdeutscht („Achtheit“). Die Übersetzung ist vorläufig, da nur der angegebene gemeinfreie englische Zeuge vorliegt und die direkte Prüfung des koptischen Ausgangstextes noch aussteht. Beschädigungen, Ergänzungen und Brüche des Manuskripts werden sichtbar bewahrt.
