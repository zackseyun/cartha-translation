review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen im Wesentlichen zuverlässig und bewahrt die Überlieferungslücken. Eine sichere Korrektur ist bei „by herself“ nötig: „aus sich selbst“ legt eine Emanation aus Sophia nahe, während der Zeuge ihre selbstständige Handlung („allein“) ausdrückt. Die leere eckige Klammer vor „Menschensohn“ darf zudem nicht als Auslassungspunkte ersetzt werden, da sie eine anders markierte Textlücke bewahrt.'
  naturalness: Der Registerton ist angemessen und modernes Standarddeutsch. Kleinere Anpassungen verbessern die Lesbarkeit, ohne die bewusst fragmentarische Syntax des Zeugen zu glätten.
  terminology: „Sophia“, „Vater der Welt“, „ungezeugt“, „Achtheit“ und „Menschensohn“ sind sachgerecht und nicht konfessionell vereinnahmend. „schweigend erkennt“ bewahrt „silently knows“ enger als die räumlich beziehungsweise hypostatisch deutbare Formulierung „in der Stille erkennt“.
  issues:
  - severity: medium
    issue: „aus sich selbst“ für „by herself“
    rationale: Die Formulierung kann besagen, dass die hervorgebrachten Dinge aus Sophias Wesen hervorgingen. Der englische Zeuge sagt jedoch, dass Sophia allein und ohne männliches Gegenstück handeln wollte. „allein“ bewahrt dies ohne zusätzliche emanationistische Festlegung.
  - severity: medium
    issue: Leere Klammer vor „Menschensohn“ wurde durch „[…]“ ersetzt
    rationale: Der Zeuge hat „[]“, nicht „[. . .]“. Beide Beschädigungsmarker müssen unterscheidbar bleiben; daher ist „[]“ zu erhalten.
  - severity: low
    issue: „in der Stille erkennt“ für „silently knows“
    rationale: Die Formulierung kann einen Bereich oder einen „Geist der Stille“ nahelegen. „schweigend erkennt“ gibt die adverbiale Aussage des Zeugen unmittelbarer wieder.
