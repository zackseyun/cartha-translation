review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen gut und bewahrt zentrale Fachbegriffe. Doch zwei im Zeugen ausdrücklich durch spitze Klammern gekennzeichnete editoriale Ergänzungen (<and> sowie <and son>) werden im deutschen Text unmarkiert als sicherer Text geboten. Die beschädigten Stellen in eckigen Klammern sind dagegen angemessen durch Anker und Fußnoten sichtbar gemacht. Einige Formulierungen können zudem enger am Zeugen und zugleich idiomatischer gefasst werden, ohne dessen teils schwierige Syntax zu harmonisieren.
  naturalness: Der Registerton ist überwiegend würdig und modern. „aus sich selbst gewachsene“ und besonders die Folge „seinen einzigartigen Verstand und Gedanken, nämlich Gedanke“ wirken im Deutschen jedoch unnötig sperrig. „männlich-weiblich“ ist die natürlichere adjektivische Form. Die notwendige Dunkelheit der Überlieferung bleibt in der Revision bestehen.
  terminology: „der Mensch“, „Sophia“, „Äon“, „Ogdoas“, „Monade“, „Götter“ und „die Ungezeugten“ sind sachgerecht beibehalten. „Unvergänglichkeit“ ist für den gegebenen Zeugen eine gute Wiedergabe. Die editorisch ergänzten Konjunktionen werden mit eigenen Fußnoten ausgewiesen, statt den rekonstruierten Wortlaut als ungesichert auszugeben.
  issues:
  - severity: medium
    issue: Die Ergänzung <and> zwischen „angels“ und „archangels“ ist nicht markiert.
    rationale: Der englische Zeuge kennzeichnet das Bindewort als editoriale Wiederherstellung. Dies muss in der deutschen Fassung oder durch einen eindeutigen Fußnotenanker erkennbar bleiben.
  - severity: medium
    issue: Die Ergänzung <and son> in der Vergleichsreihe ist nicht markiert.
    rationale: Der Entwurf bietet die zweite Vergleichsreihe als unproblematischen Text. Der Zeuge signalisiert jedoch, dass der betreffende Anschluss ergänzt ist; dies darf nicht stillschweigend nivelliert werden.
  - severity: low
    issue: Einzelne Wendungen sind sprachlich rau beziehungsweise leicht umformend.
    rationale: „aus sich selbst erwachsene“ und „männlich-weibliche“ sind im modernen Standarddeutsch natürlicher. Die Wiedergabe von „so that“ mit „damit ... konnten“ vermeidet die im Entwurf hinzugekommene Sollensnuance.
