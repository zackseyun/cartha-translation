translation:
  language: de
  text: 'Matthäus fragte ihn: „Herr und Retter, wie wurde der Mensch offenbart?“


    Der vollkommene Retter sagte: „Ich möchte, dass ihr den erkennt, der vor der Welt erschienen ist.


    „Am Anfang war der unendliche, aus sich selbst gewachsene, [a] von sich selbst geschaffene Vater. Er war von strahlendem, unaussprechlichem Licht erfüllt. Als er wollte, dass sein Ebenbild zu einer großen Macht werde, erschien plötzlich das Ursprungsprinzip jenes Lichtes als der unsterbliche mann-weibliche Mensch. Durch diesen unsterblichen Menschen sollten sie ihre Rettung erlangen und aus dem Vergessen erwachen – durch den, der als Ausleger gesandt wurde und bis zum Ende der verarmten Räuber bei euch wohnt.[b] Seine Gefährtin ist die große Sophia. In ihm wurde sie von Anfang an durch den selbstgezeugten Vater zur Vereinigung bestimmt, ausgehend von dem unsterblichen Menschen, der als Erster erschien, nämlich als Göttlichkeit und Königsherrschaft. Denn dies wurde vom Vater offenbart, [c] der ‚der Mensch‘ und ‚der Selbst-Vater‘ genannt wird. Um seiner eigenen Hoheit willen erschuf er einen mächtigen Äon namens Ogdoas. Ihm wurde große Vollmacht verliehen, sodass er sogar über die verarmte
    Schöpfung herrscht.


    „Aus jenem Licht und dem dreifach männlichen Geist, der Sophia, seiner Gefährtin, gehört, erschuf er Götter und Engel und Erzengel – unzählige Zehntausende zum Dienst. Denn dieser Gott erschuf Göttlichkeit und Königsherrschaft, sodass er ‚Gott der Götter‘ und ‚König der Könige‘ genannt wurde. In ihm besitzt der Urmensch seinen einzigartigen Verstand und Gedanken, nämlich Gedanke, Erwägung und Betrachtung, Vernunft, [d] und Kraft. Alle vorhandenen Eigenschaften sind vollkommen und unsterblich.


    „Was die Unvergänglichkeit betrifft, sind sie tatsächlich gleich. In ihrer Kraft besteht jedoch ein Unterschied, vergleichbar mit dem Unterschied zwischen Vater und Sohn, zwischen Sohn und Gedanken und zwischen dem Gedanken und dem, was danach übrig bleibt. Wie ich schon sagte, steht unter den geschaffenen Wesen die Monade an erster Stelle. Und nach allem Übrigen wurde alles, was erschien, aus seiner Kraft offenbart. Aus den geschaffenen Wesen ging alles hervor, was angefertigt wurde; aus dem Angefertigten ging hervor, was gestaltet wurde; und aus dem Gestalteten ging hervor, was benannt wurde. So entstand vom Anfang bis zum Ende der Unterschied unter den Ungezeugten.“'
  philosophy: optimal-equivalence
