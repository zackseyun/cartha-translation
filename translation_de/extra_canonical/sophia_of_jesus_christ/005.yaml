lexical_decisions:
- source_word: Human
  choice: der Mensch
  rationale: Die substantivische, titelartige Verwendung wird beibehalten; „Mensch“ bleibt gegenüber einer ausschließlich männlichen Deutung offen.
- source_word: androgynous Human
  choice: der mann-weibliche Mensch
  rationale: Die ungewöhnliche Doppelnatur wird ausdrücklich und würdig wiedergegeben; das geläufigere „androgyne“ könnte im Deutschen stärker modern-sexualpsychologisch klingen.
- source_word: Sophia
  choice: Sophia
  rationale: Der traditionsgeschichtlich bedeutsame Eigenname bleibt erhalten, statt ihn stillschweigend nur mit „Weisheit“ wiederzugeben.
- source_word: aeon
  choice: Äon
  rationale: Der kosmologische Fachbegriff wird bewahrt, weil „Zeitalter“ hier die personale beziehungsweise hypostatische Dimension verlieren könnte.
- source_word: Ogdoad
  choice: Ogdoas
  rationale: Die im Deutschen etablierte gräzisierende Form bezeichnet die Achtzahl beziehungsweise achtheitsbezogene kosmologische Größe.
- source_word: monad
  choice: Monade
  rationale: Der philosophisch-kosmologische Terminus bleibt als Fachwort erhalten.
- source_word: indestructability
  choice: Unvergänglichkeit
  rationale: Diese Wahl passt zum ontologischen Zusammenhang und klingt natürlicher als „Unzerstörbarkeit“, ohne die Aussage abzuschwächen.
- source_word: myriads
  choice: Zehntausende
  rationale: Die konkrete antike Zahlbezeichnung wird sichtbar gehalten; „unzählige“ davor vermittelt zugleich den idiomatischen Sinn einer unermesslichen Menge.
theological_decisions:
- issue: Bezeichnung „Human“ als kosmische Gestalt
  choice: Titelartig „der Mensch“
  alternative: „der Menschensohn“ oder „das menschliche Wesen“
  rationale: Der Text sagt nicht „Menschensohn“; diese christologische Präzisierung wäre ein unzulässiger Import. „Menschliches Wesen“ würde den titelartigen Charakter abschwächen.
- issue: Geschlechtliche Doppelgestalt des unsterblichen Menschen
  choice: „mann-weiblich“ ausdrücklich bewahren
  alternative: „androgyn“ oder eine geglättete geschlechtsneutrale Form
  rationale: Die Spannung des Zeugnisses darf weder biologisch noch symbolisch vorschnell aufgelöst werden.
- issue: Götter, Engel und Erzengel
  choice: „Götter“ unverändert im Plural
  alternative: „göttliche Wesen“
  rationale: Eine harmonisierende Umschreibung würde die kosmologische und theologische Eigenart des Textes verdecken.
- issue: „created“ im Zusammenhang mit Vater, Äon und Monade
  choice: mit „erschuf/geschaffen“ wiedergeben
  alternative: „brachte hervor/hervorgegangen“
  rationale: Die vorliegende Zeugenübersetzung unterscheidet mehrere Hervorgangsverben. Diese Unterscheidung wird soweit möglich bewahrt, ohne ein späteres dogmatisches Schöpfungsschema einzutragen.
- issue: Gleichheit in Unvergänglichkeit und Unterschied in Kraft
  choice: Beide Aussagen nebeneinander stehen lassen
  alternative: hierarchisch oder wesensgleichheitlich erklären
  rationale: Die theologische Spannung gehört zum Text und wird nicht konfessionell aufgelöst.
- issue: „unbegotten ones“ am Schluss
  choice: „die Ungezeugten“
  alternative: „die Ungewordenen“ oder „die nicht Hervorgebrachten“
  rationale: Die paradoxe Verbindung mit zuvor geschaffenen beziehungsweise hervorgegangenen Größen bleibt erhalten; eine Glättung würde die schwierige Überlieferung verdecken.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten kosmologischen Fachbegriffen. Die Übersetzung ist vorläufig, da eine direkte Prüfung des koptischen Textes noch aussteht; sie folgt dem bereitgestellten gemeinfreien englischen Zeugen und macht dessen Lücken kenntlich. Ergänzungszeichen aus dem Zeugen wurden in lesbaren deutschen Satzbau überführt, ohne strittige Beziehungen dogmatisch festzulegen.
