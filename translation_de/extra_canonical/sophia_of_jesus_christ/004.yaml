translation:
  language: de
  text: '**Der Vater und das Geschlecht, über dem kein Königreich ist**


    Maria fragte ihn: „Wie können wir das dann erkennen, Herr?“


    Der vollkommene Retter sagte: „Beginnt bei den verborgenen Dingen und geht bis ans Ende der sichtbaren Dinge. Dann wird euch das Ausströmen des Gedankens von selbst offenbaren, wie der Glaube an das Unsichtbare im Sichtbaren zu finden ist – in den Dingen, die dem ungezeugten Vater gehören.[a] Wer Ohren hat zu hören, der höre!


    Der Herr der Welt wird nicht ‚Vater‘ genannt, sondern ‚Urvater‘, ⟨denn der Vater ist⟩ der Ursprung dessen, was sichtbar werden wird; doch er […] ist der anfangslose Urvater.[b] Er schaut sich selbst in sich selbst wie in einem Spiegel. In seinem Ebenbild ist er als der göttliche Selbstvater erschienen und ⟨als⟩ der Widerschein über denen, die widerspiegeln: der zuerst Seiende, der ungezeugte Vater.[c] Er ist nämlich ebenso alt ⟨wie⟩ das Licht, das vor ihm ist, kommt ihm aber an Macht nicht gleich.


    Danach offenbarte er viele widerspiegelnde, selbstgezeugte Wesen, die ihm an Alter und Macht gleich sind und in Herrlichkeit bestehen – zahllos viele. Ihr Geschlecht wird ‚Das Geschlecht, über dem kein Königreich ist‘ genannt, von demjenigen her, in dem ihr selbst unter diesen ⟨Königreichen⟩ sichtbar geworden seid.[d] Und diese ganze Schar, über der kein Königreich ist, wird […] ‚die Kinder des ungezeugten Vaters‘, ‚Gott‘, ‚[Retter]‘ und ‚Sohn Gottes‘ genannt; sein Ebenbild wohnt bei euch.[e]


    Er ist der Unerkennbare, erfüllt von aller unvergänglichen Herrlichkeit und unaussprechlicher Freude. Sie alle ruhen in ihm und freuen sich unablässig mit unaussprechlicher Freude über seine Herrlichkeit, die sich niemals ändert, und mit unermesslichem Jubel. Zuvor war dies in allen Äonen und ihren Welten niemals gehört oder erkannt worden.“[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satzbau lässt offen, ob „die Dinge, die dem ungezeugten Vater gehören“ besonders auf das Sichtbare oder auf den gesamten Erkenntniszusammenhang bezogen sind.
    reason: Bewahrt eine syntaktische und theologische Mehrdeutigkeit des Textzeugen.
  - marker: b
    text: Winkelklammern ⟨…⟩ kennzeichnen im benutzten Textzeugen ergänzten Wortlaut; […] bezeichnet eine Lücke oder beschädigte Stelle.
    reason: Macht die überlieferten textkritischen Unsicherheiten sichtbar.
  - marker: c
    text: Die Formulierungen „Selbstvater“ und „Widerschein über denen, die widerspiegeln“ sind ungewöhnlich und im zugrunde gelegten englischen Textzeugen schwer zu bestimmen.
    reason: Warnt vor einer zu sicheren dogmatischen Auslegung einer unsicheren Passage.
  - marker: d
    text: Der Zusammenhang von „Geschlecht“, „demjenigen“ und den „Königreichen“ ist im Textzeugen unklar; die Übersetzung glättet ihn deshalb nicht zu einer eindeutigen kosmologischen Aussage.
    reason: Kennzeichnet eine echte syntaktische Unklarheit.
  - marker: e
    text: Die eckigen Klammern um „[Retter]“ zeigen eine textkritische Ergänzung an. Der genaue Bezug von „sein Ebenbild“ bleibt offen.
    reason: Dokumentiert Ergänzung und Referenzunsicherheit.
  - marker: f
    text: Diese Fassung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen zu Nag-Hammadi-Kodex III,4 und Berliner Kodex 8502,3; eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Legt die begrenzte Quellengrundlage des Entwurfs offen.
lexical_decisions:
- source_word: Forefather (englischer Textzeuge; Prüfung des Koptischen ausstehend)
  choice: Urvater
  rationale: Bewahrt die ausdrückliche Abgrenzung gegenüber „Vater“ und bezeichnet einen vorausliegenden Ursprung, ohne eine konfessionelle Deutung einzutragen.
- source_word: emanation of Thought
  choice: Ausströmen des Gedankens
  rationale: Gibt die emanative Bildsprache und die mögliche personhafte Bedeutung von „Gedanke“ wieder; die Großschreibung kennzeichnet den terminologischen Gebrauch.
- source_word: unbegotten
  choice: ungezeugt
  rationale: Entspricht der genealogischen und ontologischen Sprache des Textzeugen genauer als das stärker deutende „ungeschaffen“.
- source_word: Self-Father
  choice: Selbstvater
  rationale: Bewahrt den ungewöhnlichen technischen Ausdruck, statt ihn durch eine glättende Erklärung zu ersetzen.
- source_word: reflecting / reflector
  choice: widerspiegelnd / Widerschein
  rationale: Hält die fortlaufende Spiegelmetaphorik fest und unterscheidet dabei die Wesen, die widerspiegeln, von der übergeordneten Erscheinung.
- source_word: Generation Above Which There Is No Kingdom
  choice: Das Geschlecht, über dem kein Königreich ist
  rationale: „Geschlecht“ kann hier eine gemeinsame Herkunft und eine überweltliche Gruppe bezeichnen; die sperrige räumlich-hierarchische Aussage des Titels bleibt erhalten.
- source_word: aeons
  choice: Äonen
  rationale: Der traditionsgeschichtliche Fachbegriff bleibt stehen, weil „Zeitalter“ die hier möglicherweise zugleich räumlich-personale Bedeutung verengen würde.
theological_decisions:
- issue: Verhältnis des Herrn der Welt zum Vater und Urvater
  choice: Die wechselnden Bezeichnungen und Pronomen bleiben ohne harmonisierende Identifikation erhalten.
  alternative: Die Figuren ausdrücklich als ein einziges Wesen oder als klar getrennte Wesen bestimmen.
  rationale: Der zugrunde liegende englische Textzeuge ist syntaktisch und textkritisch unsicher; eine eindeutige Systematisierung würde die echte Spannung beseitigen.
- issue: Singular und Kollektiv in der Benennung der Schar
  choice: Der Wechsel von der ganzen Schar zu den singularischen Titeln „Gott“, „Retter“ und „Sohn Gottes“ wird beibehalten.
  alternative: Alle Titel in den Plural setzen oder ausschließlich auf ein einzelnes Wesen beziehen.
  rationale: Der Text verbindet kollektive und singularische Rede; diese theologisch bedeutsame Unschärfe darf nicht stillschweigend aufgelöst werden.
- issue: Bezug von „sein Ebenbild“
  choice: Das singularische Possessivpronomen bleibt stehen.
  alternative: „Ihr Ebenbild“ auf die ganze Schar beziehen oder „das Ebenbild des Sohnes Gottes“ ausdrücklich ergänzen.
  rationale: Der nächste mögliche Bezug ist singularisch, doch der genaue Referent bleibt unsicher. Die Übersetzung bewahrt diese Mehrdeutigkeit.
- issue: „Er ist der Unerkennbare“ nach der kollektiven Passage
  choice: Der Singular wird unverändert wiedergegeben.
  alternative: Den Satz auf den ungezeugten Vater, den Sohn oder die Schar ausdrücklich festlegen.
  rationale: Der Textzeuge benennt den Referenten nicht eindeutig; eine Festlegung würde zusätzliche Theologie importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen Fachbegriffen und Bildfeldern. Ungewöhnliche Wendungen wurden dort nicht geglättet, wo der Textzeuge selbst unsicher oder theologisch spannungsvoll ist. Direkte Rede und Hörformel sind idiomatisch gestaltet; Ergänzungen und Lücken bleiben sichtbar.
