lexical_decisions:
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff bewahrt sowohl die kosmologische als auch die personale Bedeutung, ohne sie auf bloße Zeiträume zu verengen.
- source_word: Assembly of the Ogdoad
  choice: Versammlung der Ogdoas
  rationale: „Versammlung“ gibt den Namenscharakter verständlich wieder; „Ogdoas“ bleibt als technischer Ausdruck erhalten und wird in einer Fußnote erläutert.
- source_word: androgynous
  choice: mannweiblich
  rationale: Die würdevolle, knappe Formulierung bewahrt die ausdrücklich zugleich männliche und weibliche Erscheinungsweise, die der Folgesatz entfaltet.
- source_word: originative principle
  choice: Ursprungsprinzip
  rationale: Die Wahl bezeichnet einen hervorbringenden Ursprung, ohne ihn vorschnell mit einer bestimmten Person oder Gottheit gleichzusetzen.
- source_word: simulacra / likenesses
  choice: Abbilder
  rationale: „Abbilder“ bewahrt das Verhältnis zu einem Urbild oder Modell und klingt im kosmologischen Zusammenhang natürlicher als „Nachahmungen“.
- source_word: firmaments
  choice: Himmelsgewölbe
  rationale: Die konkrete kosmologische Vorstellung bleibt erkennbar und ist für heutige Leser verständlicher als das Fremdwort „Firmamente“.
- source_word: virgin spirits
  choice: jungfräuliche Geister
  rationale: Die ungewöhnliche Bildsprache wird formal bewahrt und nicht deutend als bloß „reine“ Geister aufgelöst.
- source_word: repose
  choice: Ruhe
  rationale: „Ruhe“ ist natürliches modernes Deutsch und bewahrt den Zustand ungestörter Vollendung, ohne zusätzliche Heilslehre einzutragen.
theological_decisions:
- issue: Geschlechtliche Zuordnung von Versammlung und Leben
  choice: Das Männliche heißt „Versammlung“, das Weibliche „Leben“; das Leben kommt von einem Weiblichen.
  alternative: Die Aussagen geschlechtsneutralisieren oder metaphorisch umdeuten.
  rationale: Die geschlechtliche Polarität trägt die Argumentation des Textes und darf trotz ihrer Fremdheit nicht beseitigt werden.
- issue: Genuswechsel beim Unsterblichen Menschen beziehungsweise Schweigen
  choice: Männlichen und weiblichen Bezug unverändert nebeneinander stehen lassen und in Fußnote [d] kenntlich machen.
  alternative: Alle Pronomen an ein einheitliches grammatisches oder theologisches Geschlecht angleichen.
  rationale: Die Vorlage enthält eine echte Spannung; eine Harmonisierung würde eine nicht gesicherte Identifikation oder Korrektur einführen.
- issue: Status der Mächte, Götter, Herren und Engel
  choice: Die gestufte Hervorbringungsfolge wörtlich erkennbar wiedergeben.
  alternative: Die Bezeichnungen als Attribute eines einzigen Gottes paraphrasieren.
  rationale: Der Text beschreibt eine eigenständige kosmologische Hierarchie, die ohne konfessionelle Korrektur wiederzugeben ist.
- issue: „Mother of the World“
  choice: Mutter der Welt
  alternative: Weltmutter oder göttliche Mutter
  rationale: „Mutter der Welt“ wahrt die syntaktische Beziehung und vermeidet, durch Zusammenschreibung oder Zusatz eine festere dogmatische Titulatur zu schaffen.
- issue: „Immortal Human“
  choice: Unsterblicher Mensch
  alternative: unsterblicher Menschensohn oder Urmensch
  rationale: Die neutrale Grundbedeutung wird bewahrt; christologische oder religionsgeschichtliche Identifikationen werden nicht in den Text eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem dialogischem Ton. Kosmologische Fachbegriffe werden dort bewahrt, wo eine alltagssprachliche Ersetzung die Bedeutung verengen würde. Eckige Klammern, Auslassungspunkte, Winkelklammern und der Hinweis auf die fehlenden koptischen Seiten markieren den unsicheren beziehungsweise verlorenen Textbestand. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich auf den bereitgestellten gemeinfreien englischen Textzeugen gegründet.
