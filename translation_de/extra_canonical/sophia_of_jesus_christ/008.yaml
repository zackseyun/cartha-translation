  language: de
  text: 'Da fragte Thomas [ihn]: „Herr, Retter, wie viele Äonen[a] überragen die Himmel?“


    Der vollkommene Retter sagte: „Ich lobe dich dafür, dass du nach den großen Äonen fragst, denn eure Wurzeln wohnen in den Unendlichkeiten. Als jene offenbart wurden, von denen ich zuvor gesprochen habe, versah er [sie mit …]


    (Koptische Seiten 109 und 110 fehlen.)[b]


    […] [Lücke] und zu einer Einheit gelangen, nennen wir sie die ‚Versammlung der Ogdoas‘.[c] Sie offenbarte sich als mannweiblich und wurde teils männlich, teils weiblich genannt. Das Männliche heißt ‚Versammlung‘, das Weibliche aber ‚Leben‘. So sollte sichtbar werden, dass das Leben für alle Äonen von einem Weiblichen kam.


    „Und alle Namen wurden vom Ursprungsprinzip empfangen. Denn aus seinem Einklang mit seinem Gedanken erschienen sehr rasch die Mächte, die ‚Götter‘ genannt wurden. Aufgrund ihrer Weisheit offenbarten [die] Götter der Götter Götter, <und die Götter> offenbarten aufgrund ihrer Weisheit Herren. Die Herren der Herren offenbarten aufgrund ihrer Denkakte Herren, und die Herren offenbarten aufgrund ihrer Macht Erzengel. Die Erzengel offenbarten aufgrund ihrer Worte Engel. [Lücke] Von ihnen erschienen Abbilder, die Gefüge, Gestalt und Benennung für alle Äonen und ihre Welten besaßen.


    „Und alle Unsterblichen, die ich eben beschrieben habe, üben ihre Macht vom Unsterblichen Menschen her aus. Dieser wird ‚Schweigen‘ genannt; denn als sie schweigend, ohne äußere Rede, betrachteten, wurde die ihr eigene Majestät vollendet.[d] Weil die Unvergänglichen Macht besaßen, erschuf jeder von ihnen in der Ogdoas ein großes Reich sowie Throne, Tempel und Himmelsgewölbe für ihre jeweilige Majestät. Denn sie alle entstanden durch den Willen der Mutter der Welt.“


    Da sagten die heiligen Apostel zu ihm: „Herr, Retter, sprich zu uns über diejenigen, die in den Äonen wohnen; denn wir müssen nach ihnen fragen.“


    Der vollkommene [Lücke] Retter sagte: „Ihr könnt nach allem fragen, und ich werde euch die Antwort geben.


    „Sie erschufen Engelscharen, unzählige Myriaden, zum Dienst und zu ihrer Verherrlichung. Sie erschufen jungfräuliche Geister, die unaussprechlichen und unerschütterlichen Lichter; denn diese erfahren weder Gebrechen noch Schwäche, sondern besitzen Willen.


    „Auf diese Weise wurden die Äonen zusammen mit den Himmeln und den Himmelsgewölben rasch vollendet, in der Herrlichkeit des Unsterblichen Menschen und seiner Gefährtin Sophia. Von dort empfingen alle Äonen und Welten und alle, die danach kamen, das Urbild, nach dem sie ihre Abbilder erschufen – sowohl in den Himmeln des Chaos als auch in ihren Welten. Und jede Natur, angefangen mit der Offenbarung des Chaos, wohnt im schattenlosen Licht, in unbeschreiblicher Freude und in unaussprechlichem Jubel. Unablässig genießen sie ihre Herrlichkeit, die niemals vergeht, [Lücke] und ihre unendliche Ruhe. Diese ist unter allen Äonen und all ihren Mächten, die danach entstanden, unbeschreiblich. Alles, was ich euch jetzt gesagt habe, habe ich gesagt, damit ihr im Licht noch heller leuchtet als diese.“


    [a] „Äonen“ bezeichnet hier überweltliche Ewigkeitsbereiche beziehungsweise die mit ihnen verbundenen Wesen; der Fachbegriff bleibt erhalten.


    [b] Die in der Vorlage vermerkte materielle Textlücke wird ausdrücklich beibehalten.


    [c] „Ogdoas“ bedeutet „Achtheit“ und bezeichnet hier eine aus acht Größen bestehende überweltliche Ordnung.


    [d] Der Wechsel vom männlichen „Unsterblichen Menschen“ zum weiblichen Bezug bei „Schweigen“ steht bereits in der überlieferten Vorlage und wird nicht harmonisiert.'
