  text: 'Matthew said [] to him, “Lord, no one can discover the truth except through you, so teach us the truth.”


    The Savior said, “He Who Is cannot be expressed. No power knew him, no authority, nothing contingent, nor anything created from the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. From this point on, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules over him, he is nameless, since anyone with a name has been created by someone else. And He Who Is has an appearance uniquely his own, [] unlike anything you have seen and understood. Yet it is an enigmatic appearance that transcends everything and surpasses the world. It gazes in every direction (simultaneously) and beholds itself from itself.


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, with nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: de
  text: 'Matthäus sagte [a] zu ihm: „Herr, niemand kann die Wahrheit erkennen außer durch dich. Darum lehre uns die Wahrheit.“


    Der Retter sagte: „Der, der ist, lässt sich nicht in Worte fassen. Keine Macht kannte ihn, keine Gewalt, nichts Vergängliches und nichts Geschaffenes – von der Grundlegung der Welt bis heute. Nur er selbst kannte sich, ebenso jeder, dem er durch den, der aus dem Ersten Licht hervorging, Offenbarung schenken will. Von nun an bin ich der Große Retter. Denn er ist unsterblich und ewig.


    „Er ist ewig und ohne Geburt; denn jeder, der geboren wurde, wird im Tod zugrunde gehen. Er ist ungezeugt und ohne Anfang; denn jeder, der einen Anfang hatte, wird ein Ende haben. Weil niemand über ihn herrscht, ist er namenlos; denn jeder, der einen Namen trägt, wurde von jemand anderem geschaffen. Und der, der ist, besitzt eine ihm allein eigene Gestalt [b], die nichts gleicht, was ihr gesehen und begriffen habt. Dennoch ist sie eine geheimnisvolle Gestalt, die alles übersteigt und die Welt überragt. Sie blickt zugleich in alle Richtungen und schaut sich aus sich selbst heraus.


    „Weil er unendlich ist, kann er niemals begriffen werden.


    Er ist für immer unzerstörbar; nichts ist ihm gleich.


    Er ist das Gute, das sich niemals ändert.


    Er ist ohne Makel.


    Er ist ewig.


    Er ist selig.


    Er kann nicht erkannt werden, doch er erkennt sich selbst.


    Er ist ohne Maß; er kann nicht ergründet werden.


    Er ist vollkommen, ohne Unvollkommenheit.


    Seine Seligkeit ist unzerstörbar.


    Er wird ‚Vater der Welt‘ genannt.“'
  philosophy: optimal-equivalence
