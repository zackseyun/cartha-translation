lexical_decisions:
- source_word: He Who Is
  choice: der, der ist
  rationale: Gibt den als Titel gebrauchten Ausdruck möglichst unmittelbar wieder und vermeidet, ihn durch eine stärker philosophisch geprägte Benennung wie „der Seiende“ festzulegen.
- source_word: inexpressible
  choice: lässt sich nicht in Worte fassen
  rationale: Natürliches modernes Deutsch, das die Aussage der sprachlichen Unausdrückbarkeit bewahrt.
- source_word: nothing contingent
  choice: nichts Vergängliches
  rationale: Gibt im vorläufigen englischen Zeugen den Gegensatz zum unsterblichen und ewigen Gott verständlich wieder; die genaue koptische Lexik muss noch geprüft werden.
- source_word: unbegotten
  choice: ungezeugt
  rationale: Bewahrt die Unterscheidung von „ohne Geburt“ und „ohne Anfang“, ohne beide Begriffe miteinander zu verschmelzen.
- source_word: appearance
  choice: Gestalt
  rationale: „Gestalt“ lässt offen, ob eine sichtbare Erscheinung, Form oder besondere Seinsweise gemeint ist, und klingt im Deutschen weniger oberflächlich als „Aussehen“.
- source_word: cannot be traced out
  choice: kann nicht ergründet werden
  rationale: Vermittelt idiomatisch, dass sein Wesen nicht vollständig erforscht oder ausgelotet werden kann.
- source_word: blessed / blessedness
  choice: selig / Seligkeit
  rationale: Bewahrt den wiederkehrenden Wortstamm und den gehobenen religiösen Registerton.
theological_decisions:
- issue: Wechsel zwischen der ersten Person des Großen Retters und der dritten Person
  choice: Der überlieferte Wechsel bleibt unverändert stehen.
  alternative: „Denn ich bin unsterblich und ewig“ oder eine ausdrückliche Identifikation des Sprechers mit dem Beschriebenen.
  rationale: Der englische Textzeuge liest „I am“ und unmittelbar danach „he is“. Eine Harmonisierung würde eine theologische Beziehung festlegen, die der vorläufigen Textgrundlage nicht eindeutig zu entnehmen ist.
- issue: Selbsterkenntnis des Unaussprechlichen
  choice: „doch er erkennt sich selbst“
  alternative: Eine Umschreibung, nach der nur andere ihn nicht erkennen können.
  rationale: Die Spannung zwischen Unerkennbarkeit und Selbsterkenntnis ist im Text ausdrücklich vorhanden und wird nicht aufgelöst.
- issue: Titel „Vater der Welt“
  choice: wörtlich als „Vater der Welt“ wiedergegeben
  alternative: „Vater des Alls“ oder „Weltenvater“.
  rationale: Die vorliegende Zeugengrundlage bietet „World“; eine kosmologische Präzisierung wäre ohne Prüfung des koptischen Ausdrucks voreilig.
- issue: Pronomenwechsel zwischen „er“ und „sie“ bei der Gestalt
  choice: Das grammatische Femininum „sie“ bezieht sich nur auf „Gestalt“, danach folgt wieder „er“.
  alternative: Durchgehend männliche Pronomen trotz des deutschen Bezugsworts.
  rationale: So bleibt die Referenz des Ausgangstextes verständlich, ohne die Gestalt zu einer eigenständigen weiblichen Wesenheit zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, rhythmischen Aussagezeilen im abschließenden Lobpreis. Der Entwurf beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung der koptischen Handschriften steht noch aus. Die Übersetzung bewahrt deshalb auffällige Pronomenwechsel und gedankliche Spannungen, statt sie stillschweigend zu harmonisieren.
