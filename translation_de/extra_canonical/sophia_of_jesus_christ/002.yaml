id: SOJC.002
reference: Sophia of Jesus Christ — He Who Is
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: 'Matthew said [] to him: “Lord, none are able to discover the truth but through you, so instruct us in the truth.”


    The Savior said: “He Who Is is inexpressible. No power knew him, no authority, nothing contingent, or anything created since the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. Beginning now, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules him, he is nameless, because anyone with a name has been created by someone else. And He Who Is possesses an appearance peculiarly his own, [] unlike anything you have seen and comprehended, yet it is an enigmatic appearance that transcends everything and that excels the world. It gazes at all sides (simultaneously) and beholds itself from itself.”


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
