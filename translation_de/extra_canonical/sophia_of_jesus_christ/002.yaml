review_pass:
  verdict: revise
  source_fidelity: 'Vorläufig gegen den bereitgestellten englischen Textzeugen geprüft; eine unmittelbare koptische Kontrolle steht nach den Angaben noch aus. Die deutsche Fassung verschob in der Aussage über die Erkennbarkeit den Sinn: „Nur er selbst kannte sich“ macht aus der im Zeugen formulierten Ausnahme eine bloße Selbsterkenntnis und lässt die ausdrücklich genannten Empfänger von Offenbarung nicht mehr ihn erkennen. Die Revision stellt die Ausnahme wieder her, ohne die auffällige Vermittlungsformel oder den Wechsel von „ich“ zu „er“ zu harmonisieren.'
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. Die revidierte Satzperiode ist trotz der absichtlich komplexen Vorlage klarer gegliedert. „nichts Kontingentes“ bewahrt den fachsprachlich-philosophischen Charakter von „nothing contingent“ genauer als „nichts Vergängliches“.
  terminology: „Der, der ist“, „ungezeugt“, „Gestalt“, „selig/Seligkeit“ und „Vater der Welt“ sind angemessen und bewahren wesentliche terminologische beziehungsweise stilistische Bezüge. Die beiden Textlücken bleiben sichtbar und mit passenden Ankern versehen.
  issues:
  - severity: high
    issue: Die Ausnahme von der Unkenntnis wurde sinnverschiebend wiedergegeben.
    rationale: Der Zeuge sagt, dass niemand ihn kannte, außer ihm allein und denjenigen, denen er durch den aus dem Ersten Licht Hervorgegangenen Offenbarung gewähren will. „Nur er selbst kannte sich, ebenso jeder …“ beschreibt dagegen ausschließlich Selbsterkenntnis und macht die anschließende Personengruppe syntaktisch und semantisch unklar.
  - severity: medium
    issue: „nothing contingent“ wurde als „nichts Vergängliches“ eingeengt.
    rationale: „Kontingent“ bezeichnet nicht einfach Vergänglichkeit, sondern Nichtnotwendigkeit beziehungsweise Abhängigkeit. „nichts Kontingentes“ wahrt die philosophische Offenheit des vorläufigen Zeugen besser.
