review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die kosmologischen Titel folgen dem vorgelegten englischen Zeugen überwiegend zuverlässig. Eine sichere unmittelbare Prüfung am Koptischen ist nach den Angaben weiterhin nicht möglich. Korrigiert werden müssen vor allem die Auslassung des textkritischen Zeichens „[and]“, die zu glättende Wiedergabe von „androgynous“ sowie eine syntaktisch misslungene Passage zur bislang ungehörten und unoffenbarten Herrlichkeit. Die Klammerung der Eröffnungsfrage wird vollständiger als Signal der unsicheren Überlieferung bewahrt.
  naturalness: Die Revision verwendet modernes, würdiges Standarddeutsch. „Androgyn“ ist als etablierter religionsgeschichtlicher Ausdruck präziser und idiomatischer als das adjektivisch schwerfällige „mann-weiblich“. Die Wiederholung von Freude und Jubel bleibt als Stilmerkmal des Zeugen erhalten.
  terminology: „Urmensch“, „der Erzeuger“, „der in sich vollendete Geist“, „erstzeugend“, „Äonen“ und „Menschensohn“ sind angemessen. Die aktive Titelform „erstzeugend“ bleibt von „der Erstgeborene“ unterschieden. Die männlichen und weiblichen Namen des androgynen Erstgeborenen werden nicht harmonisiert.
  issues:
  - severity: medium
    issue: Textkritisches „[and]“ vor „his ... angels“ fehlt im deutschen Haupttext.
    rationale: Der Entwurf beansprucht, Überlieferungszeichen im Haupttext zu bewahren, lässt aber gerade dieses eckig geklammerte Bindewort aus. Es muss als „[und]“ sichtbar bleiben.
  - severity: medium
    issue: Die Wendung „von der man ... weder gehört hat noch der etwas offenbart worden ist“ ist syntaktisch fehlerhaft und verunklart den Bezug.
    rationale: Das Relativpronomen muss sich auf „Herrlichkeit“ beziehen. „Die ... unerhört und unoffenbart geblieben ist“ gibt die Aussage klar und ohne Bedeutungszugabe wieder.
  - severity: low
    issue: „mann-weiblichen Sohn“ ist weniger präzise und weniger natürlich als „androgynen Sohn“.
    rationale: „Androgyn“ entspricht dem vorgelegten Zeugen unmittelbar und ist im deutschen religionsgeschichtlichen Register etabliert. Die anschließenden männlichen und weiblichen Namen erläutern die Doppelgestalt textintern.
  - severity: low
    issue: Das parenthetische Überlieferungssignal „(is)“ der Eingangsfrage wird nicht abgebildet.
    rationale: Mit „(wird)“ lässt sich die grammatisch notwendige deutsche Entsprechung markieren, ohne die Unsicherheit des Zeugen stillschweigend zu glätten.
  revised_text: 'Bartholomäus fragte ihn daraufhin: »Wie (wird) <er> im Evangelium [] ›der Mensch‹ und ›der Menschensohn‹ genannt? Welcher von ihnen gehört also zum Sohn?«[a]


    Der Heilige sagte zu ihm: »Ich möchte, dass du erkennst: Der Urmensch wird ›der Erzeuger‹ und ›der in sich vollendete Geist‹ genannt. Er betrachtete gemeinsam mit seiner Gefährtin, der großen Sophia, und brachte seinen erstgeborenen, androgynen Sohn hervor. Sein männlicher Name lautet ›Erstzeugender Sohn Gottes‹, sein weiblicher Name ›Erstzeugende Sophia, Mutter des Alls‹; manche nennen sie ›Liebe‹. Der Erstgeborene, der ›Christus‹ genannt wird, erschuf aus dem Geist und dem Licht eine Vielzahl unzähliger [] Engel zum Dienst, denn er besitzt Vollmacht von seinem Vater.«[b]


    Seine Jünger sagten zu ihm: »Herr, offenbare uns etwas über den, der ›der Mensch‹ genannt wird, damit auch wir seine Herrlichkeit genau erkennen können.«


    Der vollkommene Retter sagte: »Wer Ohren hat zu hören, der höre! Weil er aus strahlendem Licht hervorgegangen ist, wird der erstzeugende Vater ›Adam, das Auge des Lichts‹ genannt. [Und] seine unaussprechlichen, schattenlosen heiligen Engel freuen sich beständig und jubeln über die Abbilder, die sie von ihrem Vater empfangen haben. Das ganze Reich des Menschensohnes, der ›Sohn Gottes‹ genannt wird, ist erfüllt von unaussprechlicher, schattenloser Freude und von unveränderlichem Jubel, Jubel über seine unvergängliche [] Herrlichkeit, die in den Äonen und ihren später entstandenen Welten bis heute unerhört und unoffenbart geblieben ist. Ich bin aus dem selbstgezeugten, ursprünglichen, unendlichen Licht hervorgegangen, um euch alles zu offenbaren.«[c]


    [a] Die runden Klammern, die spitzen Klammern und die leeren eckigen Klammern bewahren textkritische Signale des zugrunde liegenden Textzeugen. Die spitzen Klammern kennzeichnen eine Ergänzung; die leeren eckigen Klammern zeigen eine Textlücke oder unsichere Stelle an. Die genaue Gestalt der Frage bleibt daher unsicher.


    [b] »Androgyn« gibt die ausdrücklich männlich-weibliche Doppelgestalt des Erstgeborenen wieder. Der Wechsel zwischen männlichen und weiblichen Bezeichnungen wurde bewusst beibehalten.


    [c] Diese Fassung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung des koptischen Textes steht noch aus.'
