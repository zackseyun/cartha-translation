lexical_decisions:
- source_word: Primal Human
  choice: Urmensch
  rationale: Gibt die kosmologische Vorrangstellung knapp und in der deutschsprachigen religionsgeschichtlichen Terminologie verständlich wieder.
- source_word: Self-Completed Mind
  choice: der in sich vollendete Geist
  rationale: Bewahrt die Vorstellung der Selbstvollendung; »Geist« ist hier für das noetische Prinzip natürlicher als »Verstand«, ohne die Bedeutung dogmatisch festzulegen.
- source_word: androgynous
  choice: mann-weiblich
  rationale: Vermeidet eine rein moderne biologische oder identitätspolitische Verengung und bildet die im Kontext entfaltete männlich-weibliche Doppelbenennung transparent ab.
- source_word: First-Begetting
  choice: erstzeugend
  rationale: Unterscheidet die aktive Bedeutung von »erstgeboren« und bewahrt die ungewöhnliche Titelform.
- source_word: Mother of the Universe
  choice: Mutter des Alls
  rationale: »Das All« entspricht dem kosmologischen Gesamtbegriff würdiger und genauer als das modern naturwissenschaftlich klingende »Universum«.
- source_word: aeons
  choice: Äonen
  rationale: Behält den technischen kosmologischen Begriff bei, statt ihn auf bloße Zeitabschnitte zu reduzieren.
- source_word: reflections
  choice: Abbilder
  rationale: Bewahrt den Gedanken hervorgegangener Entsprechungen; die genaue koptische Lexik muss noch geprüft werden.
theological_decisions:
- issue: Geschlechtliche Doppelbenennung des erstgeborenen Sohnes
  choice: Männliche und weibliche Titel sowie der anschließende Pronomenwechsel bleiben sichtbar.
  alternative: Alle Bezüge grammatisch vereinheitlichen oder »androgyn« ohne weitere Spannung wiedergeben.
  rationale: Der Text macht die Doppelgestalt selbst zum theologischen Aussagekern; eine Harmonisierung würde diese Spannung auflösen.
- issue: Verhältnis von »Menschensohn« und »Sohn Gottes«
  choice: Beide Titel werden nebeneinandergestellt, ohne sie erklärend gleichzusetzen oder zu trennen.
  alternative: Die Titel durch eine dogmatische Paraphrase identifizieren.
  rationale: Die im Dialog gestellte Zuordnungsfrage und die mehrdeutige Titelfolge sollen offenbleiben.
- issue: Hervorgang des Sprechers aus dem Licht
  choice: »Ich bin ... hervorgegangen«
  alternative: »Ich wurde ... gezeugt« oder »Ich kam ... herab«
  rationale: »Hervorgegangen« wahrt die Herkunftsaussage, ohne eine präzisere Hervorgangsweise einzutragen, als der englische Zeuge erkennen lässt.
- issue: Textkritische Unsicherheit
  choice: Überlieferungszeichen werden im Haupttext bewahrt und in einer Fußnote erläutert.
  alternative: Lücken stillschweigend glätten.
  rationale: Die vorhandene Unsicherheit darf nicht als sicherer Wortlaut ausgegeben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Technische kosmologische Titel werden möglichst knapp bewahrt. Die ungewöhnlichen Wiederholungen von Freude und Jubel bleiben als rhetorisches Merkmal erhalten. Da keine direkte koptische Quellenprüfung vorliegt, vermeidet die Fassung überpräzise Festlegungen.
