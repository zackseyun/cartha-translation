translation:
  language: de
  text: 'Bartholomäus fragte ihn daraufhin: »Wie wird <er> im Evangelium [] ›der Mensch‹ und ›der Menschensohn‹ genannt? Welcher von ihnen gehört also zum Sohn?«[a]


    Der Heilige sagte zu ihm: »Ich möchte, dass du erkennst: Der Urmensch wird ›der Erzeuger‹ und ›der in sich vollendete Geist‹ genannt. Gemeinsam mit seiner Gefährtin, der großen Sophia, versenkte er sich in Betrachtung und brachte seinen erstgeborenen, mann-weiblichen Sohn hervor. Sein männlicher Name lautet ›Erstzeugender Sohn Gottes‹, sein weiblicher Name ›Erstzeugende Sophia, Mutter des Alls‹; manche nennen sie ›Liebe‹. Der Erstgeborene, der ›Christus‹ genannt wird, erschuf aus dem Geist und dem Licht eine unzählbare Schar von [] Engeln zum Dienst, denn er besitzt Vollmacht von seinem Vater.«[b]


    Seine Jünger sagten zu ihm: »Herr, offenbare uns etwas über den, der ›der Mensch‹ genannt wird, damit auch wir seine Herrlichkeit genau erkennen können.«


    Der vollkommene Retter sagte: »Wer Ohren hat zu hören, der höre! Weil er aus strahlendem Licht hervorgegangen ist, wird der erstzeugende Vater ›Adam, das Auge des Lichts‹ genannt. Seine unaussprechlichen, schattenlosen heiligen Engel freuen sich beständig und jubeln über die Abbilder, die sie von ihrem Vater empfangen haben. Das ganze Reich des Menschensohnes, der ›Sohn Gottes‹ genannt wird, ist erfüllt von unaussprechlicher, schattenloser Freude und von unveränderlichem Jubel: Jubel über seine unvergängliche [] Herrlichkeit, von der man in den Äonen und ihren später entstandenen Welten bis heute weder gehört hat noch der etwas offenbart worden ist. Ich bin aus dem selbstgezeugten, ursprünglichen, unendlichen Licht hervorgegangen, um euch alles zu offenbaren.«[c]


    [a] Die spitzen Klammern kennzeichnen eine Ergänzung im zugrunde liegenden Textzeugen; die leeren eckigen Klammern zeigen eine Textlücke oder unsichere Stelle an. Die genaue Gestalt der Frage bleibt deshalb unsicher.

    [b] »Mann-weiblich« gibt die ausdrückliche Doppelgestalt des Erstgeborenen wieder. Der Wechsel zwischen männlichen und weiblichen Bezeichnungen wurde bewusst beibehalten.

    [c] Diese Fassung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung des koptischen Textes steht noch aus.'
  philosophy: optimal-equivalence
