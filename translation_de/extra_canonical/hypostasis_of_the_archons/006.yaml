lexical_decisions:
- source_word: knew
  choice: erkannte
  rationale: Bewahrt den biblischen Euphemismus für geschlechtliche Vereinigung und lässt zugleich die wörtliche Bedeutung bestehen.
- source_word: fleshly
  choice: fleischlich
  rationale: Erhält die anthropologische beziehungsweise polemische Spannung des Zeugnisses, ohne sie als bloß »körperlich« oder moralisch »sündig« auszudeuten.
- source_word: keeper
  choice: Hüter
  rationale: Natürliche, würdige Wiedergabe, die den bekannten Anklang an die Kain-und-Abel-Erzählung wahrt.
- source_word: forces
  choice: Mächte
  rationale: Gibt die übermenschlichen Herrschaftswesen des Traktats neutral wieder, ohne ihre genaue kosmologische Stellung vorwegzunehmen.
- source_word: progress
  choice: voranzuschreiten
  rationale: Bewahrt neben zahlenmäßiger Vermehrung auch die im Zeugnis ausgesagte Entwicklung, ohne deren Art näher festzulegen.
theological_decisions:
- issue: Bezeichnung Kains als »fleshly«
  choice: der fleischliche Kain
  alternative: der leibliche Kain
  rationale: »Fleischlich« erhält die mögliche gnostisch-anthropologische Wertung und löst sie nicht zu einer rein biologischen Aussage auf.
- issue: Gottes Rolle bei der Geburt Sets
  choice: »Durch Gott habe ich ... geboren«
  alternative: »Mit Gottes Hilfe habe ich ... geboren«
  rationale: Die instrumentale oder vermittelnde Aussage bleibt offen; eine ausdrückliche Hilfsformel würde die theologische Beziehung stärker festlegen als das Zeugnis.
- issue: Singularisches Blut mit Stimme
  choice: »Die Stimme des Blutes deines Bruders«
  alternative: »Das Blut deines Bruders schreit«
  rationale: Die auffällige Bildsprache des Zeugnisses wird formal bewahrt.
- issue: Unbestimmtes männliches Subjekt bei Noreas Zeugung
  choice: »Er hat mir eine Jungfrau gezeugt«
  alternative: »Gott hat mir eine Jungfrau geschenkt«
  rationale: Das Pronomen und die Zeugungssprache bleiben erhalten; die Identität des Subjekts wird nicht stillschweigend festgelegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die eckigen Klammern im Text kennzeichnen ergänzten beziehungsweise rekonstruierten Wortlaut des zugrunde gelegten Zeugen. Der Entwurf ist vorläufig, da eine unmittelbare Prüfung des koptischen Textes von Nag Hammadi Codex II,4 noch aussteht.
