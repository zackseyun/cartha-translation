  text: 'Next, Eve gave birth to their son Cain, and Cain cultivated the land. Then Adam knew his wife. She became pregnant again and gave birth to Abel, and Abel was a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    The fleshly Cain pursued his brother Abel.


    God said to Cain, “Where is your brother Abel?”


    Cain answered, “Am I my brother’s keeper?”


    God said to Cain, “Listen! The voice of your brother’s blood cries out to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said, “I have given birth to [another] man through God, to replace [Abel].”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And humanity began to multiply and progress.'
translation:
  language: de
  text: 'Danach gebar Eva ihren Sohn Kain, und Kain bebaute das Land. Dann erkannte Adam seine Frau. Sie wurde wieder schwanger und gebar Abel; Abel war ein Hirte. Kain brachte vom Ertrag seines Feldes eine Opfergabe dar, Abel aber brachte eine Opfergabe von seinen Lämmern. Gott sah wohlwollend auf Abels Opfergabe, doch Kains Opfergaben nahm er nicht an.


    Der fleischliche Kain verfolgte seinen Bruder Abel.


    Gott sagte zu Kain: »Wo ist dein Bruder Abel?«


    Kain antwortete: »Bin ich der Hüter meines Bruders?«


    Gott sagte zu Kain: »Hör zu! Die Stimme des Blutes deines Bruders ruft zu mir. Du hast mit deinem Mund gesündigt. Es wird zu dir zurückkehren. Wer Kain tötet, wird siebenfache Rache auslösen, und du wirst stöhnend und zitternd auf der Erde leben.«


    Adam [erkannte] erneut sein weibliches Gegenüber Eva. Sie wurde schwanger und gebar Adam [Set]. Sie sagte: »Durch Gott habe ich einen [anderen] Mann geboren, als Ersatz für [Abel].«


    Eva wurde wieder schwanger und gebar [Norea]. Eva sagte: »Er hat mir eine Jungfrau gezeugt, damit sie vielen Generationen von Menschen hilft.«[a] Sie ist die Jungfrau, welche die Mächte nicht befleckten.


    Und die Menschheit begann, sich zu vermehren und voranzuschreiten.'
