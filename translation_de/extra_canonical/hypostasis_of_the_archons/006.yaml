  - severity: low
    issue: „siebenfache Rache“ singularisiert die pluralischen „seven revenges“ des Zeugen.
    rationale: „Sieben Racheakte“ bewahrt die Mehrzahl und vermeidet die stärker interpretierende Bedeutung einer siebenfach gesteigerten Einzeltat.
  - severity: low
    issue: „welche“ ist in diesem Kontext unnötig altertümlich.
    rationale: „Die“ entspricht modernem Standarddeutsch und wahrt den sachlichen Erzählregister.
