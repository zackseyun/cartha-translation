  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Die in eckigen Klammern stehenden Ergänzungen des Zeugen bleiben sichtbar. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert; semantische Unsicherheiten werden nicht durch konfessionelle Deutung geschlossen.
