translation:
  language: de
  text: 'Ihr Anführer ist blind. [Wegen seiner] Macht, Unwissenheit und seines Hochmuts erklärte er in seiner [Macht]: »Ich bin Gott; es gibt keinen anderen [außer mir].«


    Als er dies aussprach, sündigte er gegen [das All]. Diese Prahlerei stieg zur Unvergänglichkeit empor, [a] und aus der Unvergänglichkeit antwortete eine Stimme und sprach: »Du irrst dich, Samael« – das bedeutet »blinder Gott« –, denn seine Gedanken waren blind. Er ließ seiner Macht freien Lauf, nämlich der Lästerung, die er ausgesprochen hatte, und folgte ihr hinab ins Chaos und zu seiner Mutter, dem Abgrund, angetrieben von Pistis Sophia. Sie setzte jeden seiner Nachkommen seiner jeweiligen Macht entsprechend ein, nach dem Abbild der erhabenen ewigen Äonen; denn das Sichtbare ging aus dem Unsichtbaren hervor.


    Die Unvergänglichkeit blickte hinab auf den Ort der Wasser. Ihr Bild erschien als Spiegelbild auf den Wassern, und die Mächte der Finsternis verliebten sich in sie. Sie konnten jedoch das Bild, das ihnen auf den Wassern erschienen war, nicht festhalten, denn sie waren schwach. Was nur seelisch ist, kann das Geistliche nicht festhalten; denn die Mächte stammten von unten, das Bild der Unvergänglichkeit aber stammte von oben.


    Darum blickte die Unvergänglichkeit auf jenen Ort hinab, damit sie nach dem Willen des Vaters sie alle mit dem Licht vereinen konnte.'
  philosophy: optimal-equivalence
