lexical_decisions:
- source_word: indestructability
  choice: Unvergänglichkeit
  rationale: Als personifizierter kosmologischer Begriff ist »Unvergänglichkeit« im Deutschen natürlicher und traditionsnäher als »Unzerstörbarkeit«; die feminine Pronominalreferenz bleibt erhalten.
- source_word: authorities
  choice: Mächte
  rationale: »Mächte« ist für kosmische Herrschaftswesen verständlich und vermeidet die moderne institutionelle Bedeutung von »Autoritäten«.
- source_word: soulish
  choice: seelisch
  rationale: Bewahrt den Gegensatz zum »Geistlichen« und die anthropologische Fachsprache, ohne ihn deutend auf »natürlich« zu verengen.
- source_word: aeons
  choice: Äonen
  rationale: Der gnostisch-kosmologische Fachbegriff wird transliteriert, da »Zeitalter« hier die personifizierte beziehungsweise überweltliche Bedeutung nicht hinreichend wiedergibt.
- source_word: Abyss
  choice: Abgrund
  rationale: Gibt den kosmologischen Eigennamen verständlich wieder; die Großschreibung im Ausgangszeugen wird im Deutschen durch den Kontext als Bezeichnung kenntlich.
- source_word: the All
  choice: das All
  rationale: Bewahrt den technischen, umfassenden kosmologischen Ausdruck und seine genuine Mehrdeutigkeit.
- source_word: hold onto
  choice: festhalten
  rationale: Erhält die konkrete Bildsprache und lässt offen, ob Aneignung, Erfassung oder Besitz gemeint ist.
theological_decisions:
- issue: Samaels Behauptung einzigartiger Göttlichkeit
  choice: »Ich bin Gott; es gibt keinen anderen [außer mir].«
  alternative: »Ich bin ein Gott, und außer mir gibt es keinen.«
  rationale: Die bestimmte, absolute Selbstaussage des Zeugen bleibt erhalten, ohne sie mit einer dogmatischen Erklärung zu harmonisieren.
- issue: Personifizierung der Unvergänglichkeit
  choice: Femininum und personale Handlungen beibehalten
  alternative: Neutrale Abstraktion ohne personale Pronomen
  rationale: Der Text stellt die Unvergänglichkeit als handelnde weiblich referenzierte Größe dar; diese kosmologische Spannung darf nicht eingeebnet werden.
- issue: Verhältnis von Seelischem und Geistlichem
  choice: »Was nur seelisch ist, kann das Geistliche nicht festhalten«
  alternative: »Der natürliche Mensch kann das Geistliche nicht erfassen«
  rationale: Die abstrakten Kategorien des Zeugen werden bewahrt; eine paulinische oder anthropologische Gleichsetzung wird nicht eingeführt.
- issue: Pistis Sophia als handelnde Gestalt
  choice: Eigenname unverändert; »angetrieben von Pistis Sophia«
  alternative: »auf Veranlassung der gläubigen Weisheit«
  rationale: Der Eigenname wird nicht etymologisch oder konfessionell ausgedeutet; die unsichere genaue Art ihres Einwirkens bleibt offen.
- issue: Vereinigung mit dem Licht
  choice: »sie alle mit dem Licht vereinen«
  alternative: »sie alle ins Licht bringen«
  rationale: Die stärkere Aussage einer Vereinigung wird beibehalten, ohne ihren Heils- oder kosmologischen Mechanismus näher zu bestimmen.
