lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in spätantiken und gnostischen Texten etablierte Fachbegriff bleibt erhalten; »Herrscher« allein würde die spezifische Figurenbezeichnung verwischen.
- source_word: soil of the earth / ground
  choice: Erde vom Erdboden / Boden
  rationale: Die Wortfeldverbindung von Mensch, Erde und Adam wird möglichst sichtbar gehalten, ohne im Deutschen eine nicht belegte Etymologie auszuschreiben.
- source_word: soulish man
  choice: seelischer Mensch
  rationale: Die ungewohnte, aber theologisch bedeutsame Unterscheidung zwischen beseeltem Menschen und dem später einwohnenden Geist wird nicht zu »lebendiger Mensch« geglättet.
- source_word: Father of the All
  choice: Vater des Alls
  rationale: Die kosmologische Titulatur wird knapp und formal wiedergegeben, statt sie als »Vater aller« personal umzudeuten.
- source_word: indestructibility
  choice: Unvergänglichkeit
  rationale: »Unvergänglichkeit« ist im religiös-philosophischen Register natürlich und bewahrt den abstrakten Herkunftsbereich der Stimme.
- source_word: Adamic Land
  choice: adamisches Land
  rationale: Die ungewöhnliche Bezeichnung wird formal bewahrt; wegen ausstehender koptischer Prüfung wird sie nicht spekulativ normalisiert.
theological_decisions:
- issue: Unbestimmtes Subjekt beim Einblasen der Seele
  choice: »Er« bleibt stehen und wird mit einer Fußnote als unbestimmt markiert.
  alternative: Das Subjekt als einen bestimmten Archonten, Gott oder den Geist identifizieren.
  rationale: Die zugrunde liegende Textfassung bietet nur ein maskulines Singularpronomen; eine Identifizierung würde die kosmologische Spannung unzulässig auflösen.
- issue: Verhältnis von Seele und Geist
  choice: »eine Seele erhalten«, »seelischer Mensch« und die spätere Einwohnung des Geistes werden terminologisch unterschieden.
  alternative: Beide Vorgänge als dieselbe Belebung des Menschen wiedergeben.
  rationale: Der Text erzählt ausdrücklich zwei Stufen und verbindet erst die Einwohnung des Geistes mit dem Werden zu einer »lebendigen Seele«.
- issue: Wirksamkeit der Archonten und Wille des Vaters
  choice: Die Machtlosigkeit der Archonten und zugleich das Geschehen nach dem Willen des Vaters werden ohne Harmonisierung nebeneinandergestellt.
  alternative: Den Willen des Vaters als direkte Verursachung oder bloße Zulassung erklären.
  rationale: Der Text lässt das genaue Verhältnis offen; die Übersetzung soll diese theologische Spannung bewahren.
- issue: Geschlechtliche Beschreibung der Archonten
  choice: Die ergänzten Wörter bleiben in eckigen Klammern erhalten.
  alternative: Die Formulierung ohne Kennzeichnung zu einem zweigeschlechtlichen Körperbild glätten.
  rationale: Die Klammern signalisieren editorische Ergänzungen beziehungsweise beschädigte Überlieferung und dürfen nicht als sicher überlieferter Wortlaut erscheinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen Fachwörtern wie »Archonten« und »seelischer Mensch«. Eckige Klammern kennzeichnen Ergänzungen der zugrunde gelegten Textfassung; die Lacuna bleibt sichtbar. Der Entwurf beruht mangels direkter koptischer Kollation auf dem angegebenen gemeinfreien englischen Zeugen und ist deshalb hinsichtlich einzelner Pronomen, Ergänzungen und der Wendung »Adamic Land« vorläufig.
