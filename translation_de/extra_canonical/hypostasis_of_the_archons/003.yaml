  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: de
  text: 'Die Archonten schmiedeten einen Plan und sagten: »Kommt, lasst uns einen Menschen erschaffen, damit er Erde vom Erdboden sei.«


    Sie formten ihr Geschöpf als ein ganz und gar irdisches Wesen.


    Die Archonten haben Körper, die sowohl weiblich [als auch männlich] sind, und ihre Gesichter sind Tiergesichter. Sie nahmen [Erde] vom Erdboden und formten [ihren Menschen] nach ihren eigenen Körpern und [nach dem Bild] Gottes, das ihnen auf dem Wasser erschienen war.


    Sie sagten: »[Kommt], lasst uns durch die Gestalt, die wir geformt haben, das Bild ergreifen, [damit] das Bild sein männliches Gegenstück anschaut [und sich in es verliebt], […][a] und damit wir es in der Gestalt, die wir geformt haben, festhalten können.« Weil sie machtlos waren, verstanden sie die Macht Gottes nicht.


    Er[b] blies ihm ins Gesicht, und der Mensch erhielt eine Seele; doch mehrere Tage blieb er auf dem Boden liegen. Weil die Archonten machtlos waren, konnten sie ihn nicht aufrichten. Sie bliesen unablässig wie Sturmwinde und versuchten, das Bild zu ergreifen, das ihnen auf den Wassern erschienen war; doch sie kannten seine Macht nicht.


    All dies geschah nach dem Willen des Vaters des Alls.


    Danach blickte der Geist auf den seelischen Menschen, der auf dem Boden lag. Der Geist kam aus dem adamischen Land[c] hervor. Er stieg herab und nahm Wohnung in ihm; da wurde jener Mensch zu einer lebendigen Seele. Der Geist gab ihm den Namen Adam, weil man ihn auf dem Boden sich bewegen sah.


    Eine Stimme aus der Unvergänglichkeit kam hervor, um Adam zu helfen. Die Archonten versammelten alle Tiere der Erde und alle Vögel des Himmels und brachten sie vor Adam, um zu erfahren, wie Adam sie nennen würde, sodass er allen Vögeln und allen Tieren Namen geben konnte.


    [a] An dieser Stelle weist die Vorlage eine Textlücke auf.

    [b] Wer mit »Er« gemeint ist, bleibt in der überlieferten Fassung unbestimmt.

    [c] Wörtlich nach der zugrunde gelegten englischen Textfassung: »adamisches Land«; eine Prüfung am koptischen Text steht noch aus.'
  philosophy: optimal-equivalence
