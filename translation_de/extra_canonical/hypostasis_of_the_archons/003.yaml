review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng und bewahrt wichtige Unbestimmtheiten, Fachbegriffe sowie die editorischen Ergänzungen. Korrigiert werden sollten jedoch die Reichweite der eckigen Klammern bei „[and male]“, die Darstellung der leeren Lacuna und einige kleine Bedeutungsnuancen („make him arise“, „found moving“). Eine direkte koptische Kontrolle steht nach wie vor aus.
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. „adamitisches Land“ ist gegenüber „adamisches Land“ die idiomatischere fachsprachliche Adjektivform. „auf dem Boden liegen“ ergänzt gegenüber dem Zeugen eine nicht ausdrücklich genannte Körperhaltung und wird daher vermieden.
  terminology: „Archonten“, „seelischer Mensch“, „Vater des Alls“ und „Unvergänglichkeit“ sind angemessen und konsistent. Die Unterscheidung von Seele und Geist bleibt erhalten. Die ergänzte Geschlechtsangabe muss im Deutschen so geklammert werden, dass nur der im Zeugen ergänzte Bestandteil markiert ist.
  issues:
  - severity: medium
    issue: Klammerumfang bei der Beschreibung der Körper der Archonten
    rationale: Der Zeuge bietet „female [and male]“. „sowohl weiblich [als auch männlich]“ zieht wegen der deutschen Korrelativkonstruktion zusätzliche Wörter in die Ergänzungsmarkierung. „weiblich [und männlich]“ bewahrt den editorischen Status präzise.
  - severity: low
    issue: Leere Lacuna als „[…]“ statt „[]“ wiedergegeben
    rationale: Der englische POB-Zeuge bewahrt ausdrücklich ein leeres Klammerpaar. Die deutsche Fassung sollte dieses Signal unverändert übernehmen; die Fußnote kann die Funktion erläutern.
  - severity: low
    issue: „blieb ... liegen“
    rationale: Die Vorlage sagt nur, dass der Mensch mehrere Tage auf dem Boden blieb; „liegen“ spezifiziert seine Haltung zusätzlich.
  - severity: low
    issue: „konnten sie ihn nicht aufrichten“
    rationale: „Make him arise“ meint eher, ihn dazu zu bringen, sich zu erheben, nicht notwendigerweise ein körperliches Aufrichten durch andere.
  - severity: low
    issue: „weil man ihn ... sich bewegen sah“
    rationale: Die unbestimmte passive Formulierung des Zeugen („he was found moving“) wird genauer durch „angetroffen wurde“ gespiegelt.
  revised_text: 'Die Archonten schmiedeten einen Plan und sagten: »Kommt, lasst uns einen Menschen erschaffen, damit er Erde vom Erdboden sei.«


    Sie formten ihr Geschöpf als ein ganz und gar irdisches Wesen.


    Die Archonten haben Körper, die weiblich [und männlich] sind, und ihre Gesichter sind Tiergesichter. Sie nahmen [Erde] vom Erdboden und formten [ihren Menschen] nach ihren eigenen Körpern und [nach dem Bild] Gottes, das [ihnen] auf dem Wasser erschienen war.


    Sie sagten: »[Kommt], lasst uns durch die Gestalt, die wir geformt haben, das Bild ergreifen, [damit] das Bild sein männliches Gegenstück anschaut [und sich in es verliebt], [][a] und damit wir es in der Gestalt, die wir geformt haben, festhalten können.« Weil sie machtlos waren, verstanden sie die Macht Gottes nicht.


    Er[b] blies ihm ins Gesicht, und der Mensch erhielt eine Seele; doch er blieb mehrere Tage auf dem Boden. Weil die Archonten machtlos waren, konnten sie ihn nicht dazu bringen, sich zu erheben. Sie bliesen weiter wie Sturmwinde und versuchten, das Bild zu ergreifen, das ihnen auf den Wassern erschienen war; doch sie kannten seine Macht nicht.


