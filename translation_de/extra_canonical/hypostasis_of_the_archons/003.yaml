    Danach blickte der Geist auf den seelischen Menschen auf dem Boden. Der Geist kam aus dem adamitischen Land[c] hervor. Er stieg herab und nahm Wohnung in ihm; da wurde jener Mensch zu einer lebendigen Seele. Der Geist gab ihm den Namen Adam, weil er auf dem Boden umhergehend angetroffen wurde.


