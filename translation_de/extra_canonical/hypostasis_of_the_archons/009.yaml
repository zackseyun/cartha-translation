base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: de
  text: 'Der Engel sagte: »Ich bin es, Eleleth, der große Engel Weisheit, der vor dem heiligen Geist steht. Ich bin gesandt worden, um mit dir zu sprechen und dich aus der Hand der Gesetzlosen zu retten. Auch werde ich dich über deine Wurzel unterweisen.«


    Was jenen Engel betrifft, so vermag ich nicht, von seiner Macht zu sprechen. Seine Erscheinung gleicht feinem Gold und sein Gewand dem Schnee. Mein Mund vermag wahrhaftig nicht, von seiner Macht und vom Aussehen seines Angesichts zu sprechen.


    Der große Engel Eleleth sprach zu mir und sagte: »Ich bin Weisheit, eines der Vier Lichter, die vor dem großen unsichtbaren Geist stehen. Meinst du wirklich, diese Archonten[a] könnten irgendeine Macht über dich ausüben? Keiner von ihnen wird die Wurzel der Wahrheit überwältigen können; denn er[b] ist in den letzten Tagen um der Wurzel der Wahrheit willen erschienen, und diese Mächte werden eingeschlossen werden. Auch werden diese Mächte weder dich noch jene Generation[c] beflecken können; denn deine Wohnstätte ist in der Unvergänglichkeit, wo der jungfräuliche Geist wohnt, der über den Mächten des Chaos und über ihrer Welt steht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Archonten: wörtlich »Herrscher«; hier kosmische Mächte, die mit der Welt des Chaos verbunden sind.'
    reason: Der Fachbegriff ist gewöhnlichen Leserinnen und Lesern möglicherweise unbekannt.
  - marker: b
    text: Worauf sich »er« bezieht, ist im vorliegenden Textzusammenhang nicht eindeutig.
    reason: Die echte Mehrdeutigkeit des Pronominalbezugs darf nicht durch eine unbelegte Identifikation beseitigt werden.
  - marker: c
    text: »Jene Generation« kann hier eine bestimmte geistliche Menschengruppe oder ein zugehöriges Geschlecht bezeichnen.
    reason: Der Ausdruck besitzt in diesem Schrifttum eine mögliche Gruppenbedeutung, die das moderne Wort „Generation“ allein nicht vollständig erkennen lässt.
lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in der spätantiken religiösen Literatur etablierte Fachbegriff bewahrt die besondere kosmologische Bedeutung; eine Fußnote erläutert ihn allgemeinverständlich.
- source_word: root
  choice: Wurzel
  rationale: Die konkrete Metapher wird beibehalten, da ihre genaue Bedeutung im Text nicht eindeutig aufgelöst wird.
- source_word: indestructibility
  choice: Unvergänglichkeit
  rationale: Die substantivische Abstraktion gibt den transzendenten, unzerstörbaren Daseinsbereich in würdigem Deutsch wieder.
- source_word: authorities
  choice: Mächte
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck personale Herrschaftsmächte; „Mächte“ ist natürlicher als „Gewalten“ und unterscheidet sie im Deutschen dennoch nicht künstlich von den zuvor genannten Archonten.
- source_word: virgin Spirit
  choice: jungfräulicher Geist
  rationale: Die ungewöhnliche Prädikation wird formal bewahrt und nicht als Eigenname oder Mariologie gedeutet.
- source_word: Four Lights
  choice: Vier Lichter
  rationale: Die offenbar technische Bezeichnung wird mit Großschreibung als benannte Gruppe wiedergegeben.
theological_decisions:
- issue: Bezeichnung Eleleths als Weisheit
  choice: „der große Engel Weisheit“ und später „Ich bin Weisheit“
  alternative: „der große Engel der Weisheit“
  rationale: Die appositionelle Identifikation des Zeugen wird bewahrt, ohne Weisheit lediglich als Zuständigkeitsbereich des Engels auszulegen.
- issue: Unklares männliches Pronomen in „because he has appeared“
  choice: „denn er ist … erschienen“ mit Fußnote
  alternative: Das Pronomen ausdrücklich auf Eleleth, die Wurzel oder eine andere Gestalt beziehen
  rationale: Der vorliegende Zeuge lässt den Bezug offen; die Übersetzung soll diese theologisch bedeutsame Unbestimmtheit nicht stillschweigend auflösen.
- issue: „that generation“
  choice: „jene Generation“ mit Fußnote
  alternative: „jenes Geschlecht“ oder „deine Nachkommenschaft“
  rationale: „Generation“ bewahrt die mögliche Bedeutung einer geistlichen Menschengruppe, ohne sie auf biologische Abstammung festzulegen.
- issue: Überlegenheit des jungfräulichen Geistes
  choice: „der über den Mächten des Chaos und über ihrer Welt steht“
  alternative: „der die Mächte des Chaos und ihre Welt überragt“
  rationale: Die räumlich-hierarchische Sprache bleibt erhalten, ohne eine weitergehende metaphysische Lehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter kosmologischer Fachsprache. Parallelismen und Wiederholungen des Zeugen bleiben weitgehend erhalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist diese Fassung ausdrücklich ein vorläufiger, am bereitgestellten gemeinfreien englischen Zeugen geprüfter Entwurf.
