lexical_decisions:
- source_word: authorities
  choice: Gewalten
  rationale: »Gewalten« bewahrt den kosmologisch-personalen Sinn der Archontenmächte und klingt im Deutschen natürlicher als das abstraktere »Autoritäten«.
- source_word: Indestructibility
  choice: Unvergänglichkeit
  rationale: Die substantivierte Abstraktion wird als Bezeichnung eines transzendenten Bereichs oder Prinzips bewahrt, ohne sie als Person festzulegen.
- source_word: aeons
  choice: Äonen
  rationale: Der etablierte religionsgeschichtliche Fachbegriff erhält die besondere Kosmologie des Textes.
- source_word: androgynous
  choice: mannweiblich
  rationale: Die im Kontext konkrete Doppelgeschlechtlichkeit wird verständlich ausgedrückt; eine Fußnote nennt den Fachbegriff »androgyn«.
- source_word: archon
  choice: Archon
  rationale: Der Fachbegriff wird beibehalten, da »Herrscher« allein die spezifische kosmologische Rolle abschwächen könnte.
- source_word: the All
  choice: das All
  rationale: Die gnostische Bezeichnung für die umfassende göttliche Wirklichkeit bleibt als substantivierter Ausdruck offen und wird nicht mit »Universum« gleichgesetzt.
- source_word: Tartaros
  choice: Tartaros
  rationale: Der Eigenname des mythologischen Straf- bzw. Unterweltsortes wird transliteriert und nicht verallgemeinernd als »Hölle« wiedergegeben.
- source_word: breath
  choice: Hauch
  rationale: »Hauch« lässt sowohl Atem als auch eine wirksame geistige Kraft anklingen, ohne die Mehrdeutigkeit dogmatisch festzulegen.
theological_decisions:
- issue: Status von Sophia, Pistis und Zoe
  choice: Die Namen und Verwandtschaftsangaben werden ohne systematische Harmonisierung wiedergegeben.
  alternative: Sophia, Pistis und Zoe als bloße Eigenschaften oder als fest definierte Gottheiten deuten.
  rationale: Der Text personifiziert diese Gestalten, legt ihre ontologische Stellung im Ausschnitt aber nicht vollständig fest.
- issue: Behauptung des Archonten, Gott zu sein
  choice: »Ich bin Gott, und außer mir gibt es nichts« wird unmittelbar und ohne erklärenden Zusatz übersetzt.
  alternative: Die Aussage ausdrücklich als falsche Schöpfergott-Behauptung kommentieren.
  rationale: Die folgende Erzählung kennzeichnet den Irrtum bereits selbst; zusätzliche konfessionelle Deutung wäre unnötig.
- issue: Ursprung des hervorgebrachten Wesens
  choice: Neutrales Pronomen »es« bis zur späteren Benennung als Archon.
  alternative: Von Anfang an ausschließlich männliche Pronomen verwenden.
  rationale: Das Wesen wird als mannweiblich beschrieben; das Neutrum wahrt diese Spannung, ohne die später männlich geprägten Namen und Rollen zu leugnen.
- issue: »sinned against the All«
  choice: »sich gegen das All versündigt«
  alternative: »das All gelästert« oder »gegen Gott gesündigt«
  rationale: Die Übersetzung erhält sowohl die ethisch-religiöse Aussage als auch die besondere Bezeichnung »das All«, ohne das nicht ausdrücklich genannte Objekt »Gott« einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Religionsgeschichtlich zentrale Eigennamen und Fachwörter wie Sophia, Pistis, Äonen, Archon und Tartaros bleiben erhalten. Da keine direkte koptische Prüfung vorliegt, ist der Entwurf ausdrücklich quellenkritisch vorläufig und folgt dem bereitgestellten gemeinfreien englischen Zeugen; Klammern und Lückenanzeigen wurden bewahrt, bloße Seitenzahlen dagegen nicht.
