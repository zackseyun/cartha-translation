translation:
  language: de
  text: 'Ich sagte: »Mein Herr, unterweise mich über die [Macht] dieser Gewalten. [Wie] sind sie entstanden, aus welcher Art von Substanz und aus […] welchem Stoff? Und wer hat sie und ihre Stärke erschaffen?«[a]


    Der große Engel Eleleth, der Weisheit ist, sagte zu mir: »Die Unvergänglichkeit wohnt in unendlichen Äonen. Sophia, die Pistis genannt wird, wollte unabhängig, ohne ihren Gefährten, etwas erschaffen; und was sie hervorbrachte, hatte seinen Ursprung von oben.


    Zwischen der oberen Welt und den Äonen darunter befindet sich ein Schleier. Unter dem Schleier entstand ein Schatten; der Schatten wurde zu Materie und fiel an einen abgesonderten Ort.


    Was sie hervorgebracht hatte, entwickelte sich zu etwas Materiellem, das einer Fehlgeburt glich. Seine Gestalt wurde aus dem Schatten geformt, und es wurde zu einem hochmütigen Tier, das einem Löwen glich. Es war mannweiblich,[b] wie ich schon erwähnt habe, weil es aus Materie hervorgegangen war.


    Es öffnete seine Augen, blickte auf eine gewaltige, grenzenlose Menge von Materie, wurde hochmütig und sagte: ›Ich bin Gott, und außer mir gibt es nichts.‹


    Mit diesen Worten hatte es sich gegen das All versündigt. Da kam eine Stimme von oben, aus dem Bereich der höchsten Herrschaft, und sagte: ›Du irrst dich, Samael‹ – das bedeutet: ›blinder Gott‹.


    Es sagte: ›Wenn vor mir noch etwas anderes existiert, dann zeige es mir!‹


    Sogleich streckte Sophia ihren Finger aus und brachte Licht in die Materie hinein. Sie verfolgte es hinab bis zum Ort des Chaos. Dann kehrte sie wieder hinauf zu ihrem Licht zurück, während erneut Dunkelheit [auf] die Materie fiel.[c]


    Dieser Archon, der mannweiblich war, schuf sich ein gewaltiges Reich, eine grenzenlose Ausdehnung.


    […] Er fasste den Gedanken, sich Nachkommen zu erschaffen, und erschuf sich sieben Nachkommen, mannweiblich wie ihr Erzeuger.


    Er sagte zu seinen Nachkommen: ›Ich bin der Gott des Alls.‹


    Zoe, die Tochter der Pistis Sophia, rief ihm zu: ›Du irrst dich, Sakla‹ – sein anderer Name ist ›Yaldabaoth‹. Zoe hauchte ihm ins Gesicht. Ihr Hauch wurde für sie zu einem Feuerengel; dieser Engel fesselte Yaldabaoth und warf ihn hinab in den Tartaros, unter den Abgrund.«


    [a] Die eckigen Klammern kennzeichnen ergänzten oder beschädigten Text; […] zeigt eine Lücke in der überlieferten Textgrundlage an.

    [b] Wörtlich bzw. fachsprachlich: »androgyn«; gemeint ist ein Wesen, das männliche und weibliche Merkmale in sich vereint.

    [c] Die Formulierung ist wegen einer Textlücke unsicher.'
