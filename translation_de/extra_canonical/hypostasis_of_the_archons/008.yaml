lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in gnostischen Texten etablierte Fachbegriff bewahrt die kosmologische Funktion und vermeidet die zu enge Festlegung auf „Herrscher“.
- source_word: knew
  choice: erkannt
  rationale: Bewahrt die mögliche Doppeldeutigkeit von Kenntnis und geschlechtlichem Erkennen, die im Zusammenhang mit Eva und dem weiblichen Gegenstück mitschwingt.
- source_word: female counterpart
  choice: weibliches Gegenstück
  rationale: Gibt die relationale kosmologische Vorstellung wieder, ohne sie als Ehefrau, Partnerin oder konkrete Gestalt näher zu bestimmen.
- source_word: world above
  choice: Welt oben
  rationale: Eine schlichte, verständliche Wiedergabe, die den kosmologischen Gegensatz wahrt, ohne zusätzliche Terminologie einzuführen.
- source_word: sexual services
  choice: sexuell zu Diensten sein
  rationale: Macht den erzwungenen sexuellen Anspruch deutlich und bleibt zugleich dem formellen, würdevollen Register des Textes angemessen.
- source_word: God of the All
  choice: Gott des Alls
  rationale: Bewahrt den kosmologischen Titel und vermeidet eine glättende Umformung zu „Gott über allem“.
- source_word: holy Spirit
  choice: heiligen Geist
  rationale: Folgt der überlieferten Formulierung; die Kleinschreibung des Adjektivs entspricht der deutschen Orthografie und entscheidet nicht über eine spätere trinitarische Lesart.
theological_decisions:
- issue: Noreas Herkunft aus der oberen Welt
  choice: „ich komme aus der Welt oben“
  alternative: „ich stamme aus der oberen Welt“
  rationale: Die gewählte Fassung erhält die Aussage als Herkunftsbehauptung, ohne eine genauer definierte Emanations- oder Abstammungslehre einzutragen.
- issue: Bezeichnung des höchsten Gottes
  choice: „der Heilige, der Gott des Alls“
  alternative: „der Heilige, der Gott über allem“
  rationale: Die Apposition und der kosmologische Titel werden bewahrt, ohne die gnostische Begrifflichkeit an eine konfessionelle Systematik anzupassen.
- issue: Vorwurf des Engels an Norea
  choice: „Warum trittst du dem heiligen Geist gegenüber so vermessen auf?“
  alternative: „Warum bist du so dreist gegenüber dem heiligen Geist?“
  rationale: Der irritierende theologische Spannungsbogen bleibt erhalten; der scheinbare Vorwurf wird nicht harmonisiert oder als Zustimmung umgedeutet.
- issue: Ergänzte Gottesbezeichnung in beschädigter Stelle
  choice: „in der Kraft [Gottes]“
  alternative: „in der Kraft Gottes“
  rationale: Die eckigen Klammern kennzeichnen, dass „Gottes“ als textkritische Ergänzung beziehungsweise Wiederherstellung überliefert ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem Fachwort „Archonten“. Die Darstellung sexueller Nötigung ist klar, aber nicht sensationsheischend. Grundlage ist vorläufig der angegebene gemeinfreie englische Zeuge; eine direkte Prüfung des koptischen Textes steht noch aus. Eckige Klammern und Auslassungspunkte bewahren Signale für Ergänzungen und Textverlust; die bloße Seitenzahl des Manuskripts wurde nicht übernommen.
