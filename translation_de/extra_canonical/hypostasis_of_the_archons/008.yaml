  terminology: „Archonten“, „Finsternis“, „Gott des Alls“ und „heiliger Geist“ sind angemessen und ohne konfessionelle Überdeutung wiedergegeben. „erkannt“ wahrt im Kontext die mögliche sexuelle Nebenbedeutung von „knew“.
