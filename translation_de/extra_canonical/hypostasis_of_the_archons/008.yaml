base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: de
  text: 'Die Archonten gingen ihr entgegen und planten, sie zu täuschen. Ihr Anführer sagte zu ihr: „Deine Mutter Eva kam zu uns.“ Doch Norea wandte sich ihnen zu und sagte: „Ihr seid die Archonten der Finsternis. Verflucht seid ihr! Ihr habt meine Mutter nicht erkannt, sondern euer eigenes weibliches Gegenstück. Denn ich bin nicht eure Nachkommin; ich komme aus der Welt oben.“


    In seiner Macht wandte sich der hochmütige Archont um, und sein Gesicht wurde wie ein flammendes [Inferno].[a] Vermessen trat er ihr gegenüber auf und [sagte]: „Du musst uns sexuell zu Diensten sein, wie es deine Mutter Eva war, denn […] ist mir übertragen worden.“[b]


    Norea aber wandte sich in der Kraft [Gottes] um und rief mit lauter Stimme zum Heiligen, dem Gott des Alls: „Rette mich vor den Archonten der Ungerechtigkeit und befreie mich sofort aus ihren Händen!“[c]


    Ein Engel stieg vom Himmel herab und sagte zu ihr: „Warum rufst du Gott an? Warum trittst du dem heiligen Geist gegenüber so vermessen auf?“[d]


    Norea fragte: „Wer bist du?“


    Inzwischen hatten sich die Archonten der Ungerechtigkeit von ihr zurückgezogen.'
