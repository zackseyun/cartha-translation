base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: de
  text: 'Als Sabaoth, der Sohn Jaldabaoths, die Macht jenes Engels sah, kehrte er um und sprach das Urteil über seinen Vater und über die Materie, seine Mutter, die er verabscheute.


    Er sang Loblieder auf Sophia in der Höhe und auf ihre Tochter Zoe. Sophia und Zoe erhoben ihn und setzten ihn über den siebten Himmel, unterhalb des Vorhangs, der die oberen und die unteren Bereiche voneinander trennt. Er wird »Gott der Heerscharen, Sabaoth« genannt, denn er herrscht über die Heerscharen des Chaos, weil Sophia ihn eingesetzt hat.


    Nachdem dies geschehen war, schuf sich Sabaoth einen gewaltigen, viergesichtigen Wagen mit Cherubim, dazu unendlich viele Engel, die ihm dienen sollten, sowie Harfen und Leiern.


    Sophia brachte ihre Tochter Zoe herbei und ließ sie zu seiner Rechten sitzen, damit sie ihn über die Dinge des achten Himmels unterwies. Den Engel des Zorns stellte sie zu seiner Linken.


    [Von] jenem Tag an wurde [seine rechte Hand] »Leben« genannt, […] während die linke Hand zum Sinnbild für die Ungerechtigkeit im oberen Bereich des Selbstherrschers wurde.[a] Noch bevor es dich gab, war dies geschehen.


    Als Jaldabaoth Sabaoth in dieser großen Herrlichkeit und so hoch erhöht sah, wurde er neidisch auf ihn. Sein Neid wurde zu einem zweigeschlechtlichen Wesen. So entstand der Neid, der den Tod gebar. Der Tod brachte Nachkommen hervor und setzte jeden von ihnen über einen eigenen Himmel ein. Und alle Himmel des Chaos wurden von ihren Scharen erfüllt.


    Doch all dies geschah nach dem Willen des Vaters des Alls und nach dem Vorbild von allem, was oben ist, damit das Chaos zu seiner Vollendung gelangen konnte.[b]


    Siehe, ich habe dich über das Gebilde der Archonten unterwiesen, über die Materie, in der es sichtbar wurde, sowie über ihren Ursprung und ihre Welt.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen Ergänzungen des Herausgebers; die Auslassungszeichen stehen für eine Lücke beziehungsweise unleserlichen Text im überlieferten Wortlaut.
    reason: Die Passage ist beschädigt. Die Kennzeichnung verhindert, dass ergänzter oder verlorener Text als sicher überliefert erscheint.
  - marker: b
    text: Die Wendung hinter „Vollendung“ kann auch im Sinn von „Gesamtheit“, „vollständiger Ausgestaltung“ oder „Abschluss“ verstanden werden.
    reason: Der englische Zeuge bietet „summation“, dessen genaue kosmologische Bedeutung ohne unmittelbare Prüfung des koptischen Textes offenbleibt.
  - marker: c
    text: Dieser Entwurf beruht vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugen. Eine unmittelbare Prüfung des koptischen Textes von Nag-Hammadi-Kodex II,4 steht noch aus. Die bloßen Seitenmarker [7] und [8] des Zeugen wurden nicht in den Lesetext übernommen.
    reason: Die Quellenlage verlangt Transparenz über die indirekte Übersetzungsgrundlage und über ausgelassene redaktionelle Seitenangaben.
lexical_decisions:
- source_word: repented
  choice: kehrte um
  rationale: Gibt eine grundlegende Umkehr wieder, ohne ein im Satz nicht genanntes Objekt der Reue hinzuzufügen.
- source_word: Matter
  choice: die Materie
  rationale: Bewahrt die Personifikation und den kosmologischen Fachbegriff; die Großschreibung ergibt sich im Deutschen bereits aus der Substantivschreibung.
- source_word: God of hosts
  choice: Gott der Heerscharen
  rationale: Bewahrt den traditionsreichen Titel und den im Folgesatz ausdrücklich aufgenommenen Zusammenhang mit den Heerscharen des Chaos.
- source_word: four-faced chariot of cherubim
  choice: viergesichtiger Wagen mit Cherubim
  rationale: Gibt die Bildsprache formal nah wieder, ohne vorschnell festzulegen, ob der Wagen selbst oder die Cherubim vier Gesichter tragen.
- source_word: autocrat
  choice: Selbstherrscher
  rationale: Bewahrt den Sinn eines aus eigener Macht herrschenden kosmischen Machthabers und bleibt verständlicher als das Fremdwort „Autokrat“.
- source_word: androgynous entity
  choice: zweigeschlechtliches Wesen
  rationale: Gibt die Verbindung männlicher und weiblicher Geschlechtlichkeit in gegenwärtigem, würdigem Deutsch wieder.
- source_word: summation of chaos
  choice: das Chaos zu seiner Vollendung gelangen
  rationale: Bewahrt den schwer bestimmbaren Gedanken eines Abschlusses beziehungsweise einer vollständigen Ausgestaltung, ohne ihn eindeutig als Vernichtung oder Erlösung auszulegen.
- source_word: mold of the archons
  choice: Gebilde der Archonten
  rationale: „Gebilde“ hält die mögliche Bedeutung von Form, Ausprägung oder Struktur offen; „Archonten“ bleibt als antiker kosmologischer Fachbegriff erhalten.
theological_decisions:
- issue: Status Sabaoths nach seiner Umkehr
  choice: „erhoben“ und „eingesetzt“
  alternative: „gerettet“ oder „vergöttlicht“
  rationale: Der Text beschreibt Erhöhung und Amtsübertragung, spricht hier aber nicht ausdrücklich von Rettung oder Vergöttlichung.
- issue: Personifikation von Neid und Tod
  choice: Neid und Tod in den genealogischen Aussagen als personale Größen formuliert
  alternative: rein abstrakte Eigenschaften
  rationale: Gebären, Nachkommenschaft und Einsetzung zum Herrschen verlangen im Erzählzusammenhang personale Handlungsträger, ohne ihre genaue ontologische Art festzulegen.
- issue: „Vater des Alls“ und das obere Vorbild
  choice: die kosmologische Terminologie wörtlich bewahrt
  alternative: mit dem biblischen Schöpfergott identifiziert oder von ihm abgegrenzt
  rationale: Die Übersetzung soll die eigene Spannung des Textes erhalten und keine spätere konfessionelle Identifikation eintragen.
- issue: Rechte und linke Seite
  choice: Leben und Ungerechtigkeit als textinterne Zuordnungen wiedergegeben
  alternative: um eine allgemeine moralische Lehre über rechts und links ergänzt
  rationale: Der Abschnitt macht eine kosmologische Symbolzuweisung; eine darüber hinausgehende Lehrfolgerung wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Antike Eigennamen und die kosmologischen Fachbegriffe „Sophia“, „Zoe“ und „Archonten“ bleiben erhalten. Personifikationen werden durch bestimmte Artikel und aktive Verben kenntlich gemacht. Beschädigte Stellen werden sichtbar offengehalten; redaktionelle Seitenzahlen werden nicht als Bestandteil des Werktextes behandelt.
