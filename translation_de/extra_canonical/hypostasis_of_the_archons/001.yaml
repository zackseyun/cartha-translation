translation:
  language: de
  text: '[] Über das Wesen der Mächte (woraus sie geschaffen wurden).[a]


    Durch den Geist des Vaters der Wahrheit erwähnte der große Apostel die Mächte der Finsternis und ließ uns wissen: »Unser Kampf richtet sich nicht gegen Fleisch und [Blut], sondern gegen die kosmischen Mächte und die Geister des Bösen.«[b] Ich habe dir diese Schrift gesandt, weil du nach dem Wesen der Mächte gefragt hast (woraus sie geschaffen wurden).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die einleitenden leeren eckigen Klammern geben eine Lücke oder Beschädigung im überlieferten Text wieder. Die Seitenangabe des Manuskripts wurde nicht in den Lesetext aufgenommen.
    reason: Bewahrt die textkritische Kennzeichnung des zugrunde liegenden englischen Zeugen und erklärt die ungewöhnliche Eröffnung.
  - marker: b
    text: Vgl. Epheser 6,12. Die eckigen Klammern in „[Blut]“ kennzeichnen eine Ergänzung an einer beschädigten oder unsicheren Stelle des Manuskripts.
    reason: Kennzeichnet das erkennbare Schriftzitat und bewahrt zugleich die Überlieferungsunsicherheit.
lexical_decisions:
- source_word: substance
  choice: Wesen
  rationale: „Wesen“ gibt die Frage nach der Beschaffenheit bzw. Natur der Mächte in verständlichem, würdigem Deutsch wieder; „Substanz“ wäre zwar formnäher, klingt hier jedoch unnötig technisch und könnte eine später entwickelte metaphysische Begrifflichkeit eintragen.
- source_word: authorities
  choice: Mächte
  rationale: „Mächte“ ist im kosmologisch-religiösen Zusammenhang natürlich und entspricht dem paulinischen Sprachgebrauch besser als das institutionell klingende „Obrigkeiten“.
- source_word: cosmic authorities
  choice: kosmische Mächte
  rationale: Bewahrt die kosmische Dimension des Ausdrucks, ohne sie als rein irdische Herrschaft oder als bestimmte Engelklasse festzulegen.
- source_word: spirits of evil
  choice: Geister des Bösen
  rationale: Die Genitivkonstruktion erhält die mögliche Bedeutungsspannung zwischen bösen Geistern und Geistern, die dem Bösen zugeordnet sind.
- source_word: battle
  choice: Kampf
  rationale: Ein geläufiger und würdiger Ausdruck, der die Auseinandersetzung bezeichnet, ohne unnötig militärische Einzelheiten hinzuzufügen.
theological_decisions:
- issue: Identität und Rang der „Mächte“
  choice: Der allgemeine Ausdruck „Mächte“ bleibt stehen.
  alternative: „Herrschaften“, „Obrigkeiten“ oder eine ausdrücklich dämonologische Benennung
  rationale: Der Text bezeichnet kosmische finstere Gewalten, legt ihre genaue Ordnung oder ontologische Klasse an dieser Stelle aber nicht eindeutig fest.
- issue: Herkunft bzw. Beschaffenheit der Mächte
  choice: Die Klammer „woraus sie geschaffen wurden“ wird bewahrt.
  alternative: Die Klammer glätten oder „aus welcher Substanz sie bestehen“ formulieren
  rationale: Die Wiederholung und die erläuternde Klammer gehören zum überlieferten Zeugen und halten die Spannung zwischen Wesen und stofflicher Herkunft offen.
- issue: Vermittlung durch den Geist
  choice: „Durch den Geist des Vaters der Wahrheit“ wird formal offen wiedergegeben.
  alternative: „Inspiriert vom Geist“ oder „der Geist ließ den Apostel sprechen“
  rationale: So wird weder eine bestimmte Inspirationslehre noch eine eindeutige syntaktische Beziehung hinzugefügt, die der vorläufigen Quellenlage vorausgriffe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Übersetzung bleibt wegen der noch ausstehenden direkten Prüfung des koptischen Textes ausdrücklich vorläufig; sie folgt dem angegebenen gemeinfreien englischen Übersetzungszeugen. Wiederholung, Klammern und textkritische eckige Klammern wurden erhalten.
