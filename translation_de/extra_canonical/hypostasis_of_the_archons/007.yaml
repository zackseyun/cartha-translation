base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: de
  text: 'Die Archonten schmiedeten miteinander einen Plan und sagten: »Kommt, lasst uns mit unseren eigenen Händen eine Flut herbeiführen und alles Fleisch vernichten, Menschen und Tiere.«


    Als der Archont der Mächte von ihrem Plan erfuhr, sagte er zu Noah: »Baue dir eine Arche aus Holz, das nicht verrottet, und verbirg dich darin, du mit deinen Kindern und mit den Tieren und den Vögeln des Himmels, den kleinen wie den großen; setze sie auf den Berg Sir.«


    Da trat Orea [a] an Noah heran, weil sie die Arche betreten wollte. Als er sie abwies, blies sie gegen die Arche, sodass sie vom Feuer verzehrt wurde. Daraufhin baute er ein zweites Mal eine Arche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im zugrunde liegenden englischen Textzeugen steht nach dem Namen Orea die redaktionelle oder handschriftliche Markierung »[3]«. Sie wird hier durch eine Fußnotenmarke wiedergegeben. Die genaue Form des Namens und die Funktion der ursprünglichen Markierung bedürfen noch der Prüfung am koptischen Text.
    reason: Die mitgelieferte Ziffer soll nicht wortlos entfallen, aber auch nicht missverständlich als Bestandteil des Fließtexts stehen bleiben; zugleich ist die Quellenprüfung ausdrücklich noch ausstehend.
lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in gnostischen Texten fachsprachlich geprägte Titel bleibt als Lehnwort erhalten; »Herrscher« wäre verständlicher, könnte aber die besondere kosmologische Rolle einebnen.
- source_word: all flesh
  choice: alles Fleisch
  rationale: Bewahrt die biblisch geprägte, umfassende Formulierung und wird durch »Menschen und Tiere« unmittelbar erläutert.
- source_word: ark
  choice: Arche
  rationale: Die geläufige deutsche Bezeichnung im Noah-Kontext ist zugleich verständlich und traditionsnah.
- source_word: forces
  choice: Mächte
  rationale: Gibt den kosmologischen Plural würdig und relativ offen wieder, ohne ihn vorschnell als Heer oder Naturkräfte festzulegen.
- source_word: blew on the ark
  choice: blies sie gegen die Arche
  rationale: Bewahrt die auffällige, im Zeugnis nicht näher erklärte Handlung, statt eine bestimmte übernatürliche Wirkungsweise einzutragen.
- source_word: Mount Sir
  choice: Berg Sir
  rationale: Der Eigenname wird transliteriert und nicht mit einem bekannteren biblischen Berg gleichgesetzt.
theological_decisions:
- issue: Bezeichnung der kosmischen Herrscher
  choice: Archonten
  alternative: Herrscher
  rationale: Die spezifische Gestaltwelt des Traktats soll erkennbar bleiben, ohne die Wesen durch eine rein politische Bezeichnung umzudeuten.
- issue: Identität des »Archonten der Mächte«
  choice: Die Titulierung bleibt unbestimmt.
  alternative: Identifikation mit einer bestimmten Gottheit oder Figur
  rationale: Der vorliegende Textausschnitt nennt keine eindeutige Identität; eine dogmatische Zuordnung würde die überlieferte Spannung auflösen.
- issue: Ursache des Brandes
  choice: Oreas Blasen und das Verzehrtwerden durch Feuer werden lediglich nacheinander berichtet.
  alternative: Ausdrücklich sagen, Orea habe durch ihren Atem Feuer entfacht
  rationale: Das Zeugnis lässt den genauen Wirkmechanismus offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bibelnaher Bildsprache. Der Entwurf beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Textzeugen; eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex II,4 steht noch aus. Daher wurden ungewöhnliche Formulierungen und mögliche Mehrdeutigkeiten nicht spekulativ geglättet.
