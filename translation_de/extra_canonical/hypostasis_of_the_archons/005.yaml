review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die archontische Kosmologie, die Pluralform »wie Götter«, die Besitzformen »ihr Adam/ihre Menschheit« sowie die textkritischen Klammern. Da kein koptischer Textapparat vorliegt, ist eine unmittelbare Prüfung am koptischen Wortlaut hier nicht möglich. Zwei Formulierungen sollten jedoch näher am Zeugen bleiben: Die lehrende Natur wird passiv »aus der Schlange entfernt«, und der Verlust des Geistigen soll ohne den in »man hatte sie beraubt« eingeführten unbestimmten Täter ausgedrückt werden.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. »Makel« ist hier natürlicher und zugleich näher an »blemish« als »Unzulänglichkeit«. Die passive, absichtlich spannungsvolle Aussage über die Trennung von der Schlange bleibt verständlich, ohne die Vorlage harmonisierend umzudeuten.
  terminology: »Archont(en)«, »fleischlich«, »seelisch«, »geistig«, »Mächte«, »vollkommener Mensch« und »heiliger Geist« sind angemessen und in ihrer terminologischen Spannung beizubehalten. Die feminine Bezeichnung »Lehrerin« bleibt korrekt.
  issues:
  - severity: medium
    issue: Aktivierung der Trennung der lehrenden Natur von der Schlange
    rationale: »Da löste sich ... von der Schlange« gibt dem Subjekt eine eigenständige aktive Trennung. Der englische Zeuge sagt jedoch ausdrücklich, die weibliche lehrende Natur sei »removed from the serpent« worden. Die passive und räumliche Aussage sollte erhalten bleiben.
  - severity: medium
    issue: Einführung eines unbestimmten Akteurs beim Berauben des Geistigen
    rationale: »dass man sie dessen beraubt hatte« kann im Deutschen einen handelnden, wenn auch anonymen Täter nahelegen. Der Zeuge formuliert passiv »they had been stripped«; »dass sie des Geistigen beraubt worden waren« wahrt dies ohne zusätzliche Akteursnuance.
  - severity: low
    issue: »Unzulänglichkeit« für »blemish«
    rationale: »Unzulänglichkeit« klingt nach allgemeiner Schwäche oder Unfähigkeit. »Makel« bewahrt den markierten, möglicherweise ontologischen Defekt des Zeugen offener und präziser.
