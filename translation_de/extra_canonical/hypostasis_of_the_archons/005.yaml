lexical_decisions:
- source_word: female spiritual nature
  choice: weibliche geistige Natur
  rationale: Bewahrt die ungewöhnliche personifizierte und zugleich abstrakte Ausdrucksweise des Zeugen, ohne sie als gewöhnliche Frau oder als benannte Gestalt festzulegen.
- source_word: the teacher / teaching nature
  choice: die Lehrerin / die weibliche lehrende Natur
  rationale: Das feminine Profil bleibt erhalten; zugleich wird der Wechsel zwischen Personenbezeichnung und abstrakter Wesensbezeichnung sichtbar gemacht.
- source_word: archon(s)
  choice: Archont(en)
  rationale: Der etablierte religionsgeschichtliche Fachausdruck bewahrt die besondere kosmologische Bedeutung; »Herrscher« wäre verständlicher, aber weniger präzise.
- source_word: merely soulish
  choice: lediglich seelisch
  rationale: Bewahrt die im Text entscheidende Gegenüberstellung von seelisch und geistig, ohne sie psychologisch zu verengen.
- source_word: blemish
  choice: Unzulänglichkeit
  rationale: Gibt einen offen gehaltenen Mangel wieder; »Makel« wäre wörtlicher, könnte hier aber stärker moralisch oder körperlich klingen.
- source_word: authorities
  choice: Mächte
  rationale: Unterscheidet die allgemeine Herrschaftsbezeichnung von den zuvor ausdrücklich genannten Archonten und passt zum kosmologischen Register.
- source_word: Perfect Man
  choice: der vollkommene Mensch
  rationale: Bewahrt den möglichen titularen Sinn durch Kleinschreibung nach deutscher Orthografie, ohne die Gestalt christologisch oder anderweitig zu identifizieren.
- source_word: holy Spirit
  choice: der heilige Geist
  rationale: Bewahrt die vorliegende Bezeichnung, ohne durch unübliche Großschreibung stillschweigend eine bestimmte trinitarische Deutung festzulegen.
theological_decisions:
- issue: Die geistige Lehrgestalt und die Schlange
  choice: Die weibliche geistige beziehungsweise lehrende Natur wird von der Schlange unterschieden und löst sich später von ihr.
  alternative: Beide durchgehend als ein und dieselbe Gestalt darstellen.
  rationale: Der Zeuge beschreibt zunächst ein Auftreten in Schlangengestalt und anschließend eine Trennung; diese Spannung darf nicht eingeebnet werden.
- issue: Die Aussage »wie Götter«
  choice: Plural »wie Götter«
  alternative: Singular »wie Gott« oder »wie göttliche Wesen«
  rationale: Der gelieferte Zeuge hat ausdrücklich den Plural; eine Angleichung an eine bestimmte Auslegung von Genesis würde die überlieferte Aussage verändern.
- issue: Der geistige Verlust der Menschen
  choice: »dass man sie dessen beraubt hatte, was geistig war«
  alternative: »dass sie den Geist verloren hatten«
  rationale: Die unbestimmte Handlung und der substantivisch-abstrakte Charakter des Geistigen bleiben erhalten; eine präzisere Akteurs- oder Pneumatologie wird nicht ergänzt.
- issue: Unwissenheit des Anführers der Archonten
  choice: Direkt wiedergegeben
  alternative: Als bloß rhetorische Frage oder vorgetäuschte Unwissenheit deuten
  rationale: Der Text behauptet seine Unkenntnis ausdrücklich und nutzt sie offenbar zur Charakterisierung der archontischen Macht.
- issue: »ihr Adam« und »ihre Menschheit«
  choice: Die Possessivformen bleiben stehen.
  alternative: Neutral »Adam« und »die Menschheit«
  rationale: Die Besitzsprache ist theologisch bedeutsam und bezeichnet offenbar die Beziehung der Archonten zu der von ihnen beanspruchten Menschheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltenem kosmologischem Fachwortschatz. Die Übersetzung ist vorläufig, da keine direkte Prüfung des koptischen Textes vorliegt; sie folgt dem bereitgestellten gemeinfreien englischen Zeugen. Eckige Klammern markieren dessen Ergänzungen, während reine Textlücken durch Fußnoten ausgewiesen werden. Der im Zeugen durch einen Seitenumbruch getrennte Satz wurde fortlaufend gesetzt.
