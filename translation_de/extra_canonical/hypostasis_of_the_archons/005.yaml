translation:
  language: de
  text: 'Da kam die weibliche geistige Natur in Gestalt der Schlange, der Lehrerin. Die Schlange unterwies Adam und Eva und sagte: »Was hat Samael [zu] euch gesagt? Hat er etwa gesagt: ›Ihr dürft von allen Bäumen im Garten essen; nur vom [Baum] der Erkenntnis von Gut und Böse dürft ihr nicht essen‹?«


    [a] Die fleischliche Frau sagte: »Er sagte nicht nur: ›Esst nicht davon‹, sondern sogar: ›Berührt ihn nicht; denn an dem Tag, an dem ihr davon esst, werdet ihr ganz gewiss sterben.‹«


    Die Schlange, die Lehrerin, sagte: »Ihr werdet ganz gewiss nicht sterben. Er hat euch das vielmehr aus Eifersucht gesagt. Im Gegenteil: Eure Augen werden geöffnet werden, und ihr werdet wie Götter werden und Gut und Böse erkennen.« Da löste sich die weibliche lehrende Natur von der Schlange und ließ sie zurück, als wäre sie etwas Irdisches.


    Die fleischliche Frau nahm von dem Baum und aß. Sie gab auch ihrem Mann, und so aßen sie – diese Wesen, die lediglich seelisch waren. Ihre Unzulänglichkeit zeigte sich in ihrer Unwissenheit. Sie erkannten, dass man sie dessen beraubt hatte, was geistig war. Da nahmen sie Feigenblätter und befestigten sie um ihre nackten Hüften.


    Weil der Anführer der Archonten nicht wusste, was geschehen war, kam er und sagte: »Adam, wo bist du?«


    Adam sagte: »Ich hörte deine Stimme und bekam Angst, weil ich nackt war; deshalb versteckte ich mich.«


    Der Archont sagte: »Warum hast du dich versteckt, wenn nicht deshalb, weil du von dem einen Baum gegessen hast, von dem zu essen ich dir verboten hatte? Du hast davon gegessen!«


    Adam sagte: »Die Frau, die du mir gegeben hast, [reichte] mir die Frucht, und ich aß.«


    Da verfluchte der hochmütige [Archont] die Frau.


    Die Frau sagte: »Die Schlange hat mich getäuscht; deshalb aß ich.«


    [Die Archonten wandten sich] der Schlange zu und verfluchten ihren Schatten, sodass [er] kraftlos wurde.


    Sie wussten nicht, dass es dieselbe Gestalt war, die sie selbst geformt hatten. Von da an stand die Schlange unter dem Fluch der Mächte; dieser dauerte [b] an, bis der vollkommene Mensch kam.


    Dann wandten sie sich ihrem Adam zu und vertrieben ihn zusammen mit seiner Frau aus dem Garten. Sie besaßen keinen Segen, denn auch sie standen unter dem Fluch.


    Sie stürzten die Menschheit in gewaltige Verwirrung und in ein Leben voller Arbeit, damit ihre Menschheit mit weltlichen Dingen beschäftigt wäre und keine Zeit hätte, sich dem heiligen Geist zuzuwenden.'
