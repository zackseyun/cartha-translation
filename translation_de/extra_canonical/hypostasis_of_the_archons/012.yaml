  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: de
  text: 'Ich sagte: „Mein Herr, stamme auch ich aus ihrer Materie?“


    „Du und auch deine Nachkommen stammen von dem Vater, der von Anfang an da war.


    Die Seelen stammen von oben, aus unvergänglichem Licht. Deshalb können die Mächte ihnen nicht nahekommen, denn der Geist der Wahrheit ist in ihnen. Und jeder, der diesen Weg der Wahrheit kennt, wird unter den sterblichen Menschen unsterblich sein.


    Doch jener Same wird noch nicht erkannt werden. Nach drei Zeitaltern wird er erkannt werden; dann wird er sie aus der Knechtschaft des Irrtums der Mächte befreien.“


    Ich fragte: „Mein Herr, wie lange dauert es noch, bis dies geschieht?“


    Er sagte zu mir: „Bis zu dem Augenblick, in dem der Wahre Mensch in einer formbaren Substanz[a] [den Geist der] Wahrheit offenbart, den der Vater gesandt hat.[b]


    […] Dann wird er sie über alles unterweisen und sie mit dem Öl des ewigen Lebens salben, das ihm von dem königslosen Geschlecht verliehen wurde.


    Dann werden sie vom blinden Denken befreit werden. Sie werden den Tod zertreten, der von den Mächten stammt, und sie werden zu dem grenzenlosen Licht aufsteigen, in dem dieser Same wohnt.


    Dann werden die Mächte ihre Zeiten aufgeben. Ihre Engel werden über ihre Vernichtung weinen, und ihre Dämonen werden über ihren Tod trauern.


    Dann werden alle Söhne des Lichts die Wahrheit wirklich erkennen, ebenso ihre Wurzel, den Vater des Alls und den heiligen Geist. Sie alle werden mit einer Stimme verkünden: ›Die Wahrheit des Vaters ist gerecht. Der Sohn herrscht über das All.‹ Und von allen wird der Ruf erschallen: ›In alle Ewigkeit: heilig, heilig, heilig! Amen.‹“


    Die Substanz der Mächte'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Formbare Substanz“ gibt das griechische Lehnwort plasma wieder.
    reason: Die ungewöhnliche Wendung trägt eine für die Kosmologie des Textes wichtige stofflich-gestaltbare Bedeutung.
  - marker: b
    text: Der überlieferte Wortlaut ist an dieser Stelle unsicher. Die Ergänzung „[den Geist der]“ folgt einer möglichen Wiederherstellung; auch die genaue syntaktische Beziehung von „den der Vater gesandt hat“ bleibt mehrdeutig.
    reason: Kennzeichnet Textschaden beziehungsweise Ergänzung und bewahrt die echte syntaktische Unsicherheit.
lexical_decisions:
- source_word: hyle (über die englische Quellenwiedergabe „matter“ bezeugt)
  choice: Materie
  rationale: Bewahrt den konkreten stofflichen Sinn und den Zusammenhang mit der materiellen Herkunft der Mächte; „Stoff“ wäre natürlicher, aber weniger terminologisch präzise.
- source_word: archons / authorities
  choice: Mächte
  rationale: Im Deutschen verständlich und würdig; bezeichnet die kosmischen Herrschaftsmächte, ohne den erklärungsbedürftigeren Fachausdruck „Archonten“ in den Fließtext zu setzen.
- source_word: plasma
  choice: formbare Substanz
  rationale: Gibt sowohl die stoffliche als auch die gestaltbare Dimension des griechischen Lehnworts wieder und folgt der sachlichen Verbindung mit hypostasis und typos.
- source_word: kingless generation
  choice: königsloses Geschlecht
  rationale: Bewahrt die auffällige, traditionsspezifische Formulierung, statt sie durch eine theologisch glättende Umschreibung aufzulösen.
- source_word: Father of the All
  choice: Vater des Alls
  rationale: Erhält den kosmologischen Titel und vermeidet die normalisierende Wiedergabe „Vater aller“.
- source_word: hypostasis (Titel)
  choice: Substanz
  rationale: Der Kontext beschreibt die konkrete stoffliche Grundlage beziehungsweise Herkunft der Mächte; „Wesen“ oder „Existenz“ würde den Sinn ontologisieren.
theological_decisions:
- issue: Unsterblichkeit unter sterblichen Menschen
  choice: „wird unter den sterblichen Menschen unsterblich sein“
  alternative: „wird den Tod nicht erfahren, obwohl er unter Sterblichen lebt“
  rationale: Die paradoxe Spannung der Aussage wird nicht erklärt oder harmonisiert.
- issue: Der Wahre Mensch und die gesandte Wahrheit
  choice: Die syntaktische Mehrdeutigkeit bleibt nahe an der Quellenwiedergabe erhalten.
  alternative: „bis der vom Vater gesandte Wahre Mensch den Geist der Wahrheit offenbart“
  rationale: Die Alternative würde eindeutig den Menschen als Gesandten bestimmen, während die vorliegende Konstruktion eher die Wahrheit beziehungsweise den Geist der Wahrheit mit „gesandt“ verbindet.
- issue: „Same“ und seine Referenz
  choice: Das maskuline Demonstrativ „jener Same“ und spätere Rückbezüge bleiben ohne Identifikation.
  alternative: Explizite Gleichsetzung mit den Nachkommen Noreas oder den Söhnen des Lichts
  rationale: Der Ausschnitt lässt die genaue Beziehung offen; eine dogmatische Identifikation wäre ein Zusatz.
- issue: Tod der Mächte und ihrer Wesen
  choice: „ihre Vernichtung“ und „ihren Tod“ werden wörtlich nebeneinandergestellt.
  alternative: Beide Ausdrücke vereinheitlichen
  rationale: Die unterschiedlichen Aussagen über Engel und Dämonen bewahren die rhetorische und theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Satzfolgen. Traditionsspezifische kosmologische Begriffe wie „Same“, „königsloses Geschlecht“ und „das All“ wurden nicht modernisierend aufgelöst. Die eckigen Klammern bei „[den Geist der]“ und „[…]“ markieren Ergänzung beziehungsweise eine Lücke im überlieferten Text.
