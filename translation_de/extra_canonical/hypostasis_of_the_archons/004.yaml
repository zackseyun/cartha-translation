  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: de
  text: 'Die Archonten brachten Adam und setzten ihn in den Garten, damit er ihn bearbeitete und bewachte. Sie gaben ihm einen Befehl und sagten: »Von [allen] Bäumen im Garten darfst du essen; doch vom Baum der Erkenntnis von Gut und Böse darfst du nicht essen. Du darfst ihn nicht [berühren], denn an dem Tag, an dem du davon isst, wirst du gewiss sterben.«


    [Dies] [sagten sie zu ihm]; doch sie verstanden nicht, was [sie zu ihm gesagt hatten]. Vielmehr entsprach es dem Willen des Vaters [], dass sie es auf diese Weise sagten, damit Adam tatsächlich davon essen und damit Adam <nicht> so von ihnen denken würde, wie es ein durch und durch materieller Mensch täte.


    Die Archonten schmiedeten miteinander einen Plan und sagten: »Kommt, wir wollen einen tiefen Schlaf über Adam fallen lassen.« Da schlief Adam ein. Der tiefe Schlaf, den sie über ihn fallen ließen und den er schlief, ist Unwissenheit. Sie öffneten seine Seite wie eine lebendige Frau.[a] Dann verschlossen sie seine Seite an dieser Stelle mit Fleisch, und Adam wurde zu einem bloß seelischen Menschen.[b]


    Die geistige Frau trat zu ihm und sprach zu ihm: »Steh auf, Adam!«


    Als er sie erblickte, sagte er: »Du hast mir Leben geschenkt. Du wirst ›Mutter der Lebenden‹ heißen, denn sie ist meine Mutter. Sie ist die Ärztin, die Frau, diejenige, die geboren hat.«[c]


    Die Mächte kamen zu ihrem Adam. Als sie sahen, wie sein weibliches Gegenüber mit ihm sprach, wurden sie erregt und begehrten sie. Sie sagten zueinander: »Kommt, wir wollen unseren Samen in sie säen«, und sie verfolgten sie. Sie aber lachte über ihre Torheit und Blindheit. Als sie sie packten, wurde sie zu einem Baum; zugleich stellte sie ihnen ein schattenhaftes Abbild ihrer selbst hin. Dieses schändeten sie auf abscheulichste Weise und entweihten dabei das Siegel ihrer Stimme.[d] So brachten sie durch die Gestalt, die sie nach ihrem eigenen Bild geformt hatten, das Gericht über sich selbst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung »Sie öffneten seine Seite wie eine lebendige Frau« ist im konsultierten englischen Zeugen syntaktisch und bildlich ungewöhnlich. Eine direkte Prüfung des koptischen Textes steht noch aus.
    reason: Die mögliche Mehrdeutigkeit oder Textunsicherheit soll nicht durch eine glättende Ergänzung verdeckt werden.
  - marker: b
    text: »Seelisch« bezeichnet hier offenbar eine eigene anthropologische Stufe im Gegensatz zu »geistig« und »materiell«; es bedeutet nicht einfach »gefühlsbetont«.
    reason: Verhindert ein modernes Missverständnis eines im Text theologisch gewichteten Begriffs.
  - marker: c
    text: Der Wechsel von der direkten Anrede »du« zur dritten Person »sie« entspricht dem konsultierten Zeugen. Der genaue Bezug bleibt offen.
    reason: Bewahrt eine echte Unklarheit der Überlieferungsgrundlage.
  - marker: d
    text: »Das Siegel ihrer Stimme« gibt die rätselhafte Bildsprache des konsultierten Zeugen wörtlich wieder; ihre genaue Bedeutung ist ungewiss.
    reason: Kennzeichnet eine schwer deutbare Wendung, ohne sie spekulativ aufzulösen.
lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in der Forschung und in deutschen Übersetzungen etablierte Fachbegriff bewahrt die besondere kosmologische Funktion der Herrschermächte, statt sie vorschnell allgemein als »Herrscher« wiederzugeben.
- source_word: authorities
  choice: Mächte
  rationale: Unterscheidet die Bezeichnung an dieser Stelle von »Archonten«, ohne durch »Obrigkeiten« einen modernen politischen Sinn aufzudrängen.
- source_word: soulish
  choice: bloß seelischer Mensch
  rationale: Bewahrt die anthropologische Abstufung des Textes und macht zugleich verständlich, dass Adam hier als nur seelisch, im Gegensatz zur geistigen Frau, beschrieben wird.
- source_word: spiritual woman
  choice: geistige Frau
  rationale: Gibt den Gegensatz zu »seelisch« und »materiell« transparent wieder, ohne die Gestalt konfessionell oder dogmatisch näher zu bestimmen.
- source_word: female counterpart
  choice: weibliches Gegenüber
  rationale: Drückt Entsprechung aus, ohne eine Identität mit einer bestimmten Gestalt stärker festzulegen, als der konsultierte Zeuge erlaubt.
- source_word: signet
  choice: Siegel
  rationale: Erhält die markante, möglicherweise technische Bildsprache und glättet sie nicht zu »Klang« oder »Stimme«.
- source_word: ignorance
  choice: Unwissenheit
  rationale: Gibt die ausdrückliche allegorische Deutung des tiefen Schlafs in natürlichem Deutsch wieder.
theological_decisions:
- issue: Die Absicht hinter dem Verbot
  choice: Die Aussage bleibt als dem Willen des Vaters entsprechend wiedergegeben, damit Adam tatsächlich isst.
  alternative: Das Verbot als aufrichtige Warnung oder als Täuschung der Archonten erklären.
  rationale: Der Text verbindet die Unwissenheit der Archonten mit einer übergeordneten Absicht des Vaters; diese Spannung wird nicht harmonisiert.
- issue: Textkritische Ergänzung <nicht>
  choice: Die Winkelklammern um <nicht> bleiben erhalten.
  alternative: »nicht« stillschweigend in den Fließtext aufnehmen oder auslassen.
  rationale: Die Negation ist für den Sinn entscheidend, gehört aber laut Zeugenangabe zu einer editorischen Korrektur bzw. Ergänzung; die Unsicherheit muss sichtbar bleiben.
- issue: Anthropologische Dreiteilung
  choice: »materiell«, »seelisch« und »geistig« werden als unterscheidbare Kategorien bewahrt.
  alternative: Die Begriffe allgemeinpsychologisch paraphrasieren.
  rationale: Die Kategorien tragen die theologische Spannung des Textes und dürfen nicht in moderne Alltagssprache eingeebnet werden.
- issue: Wechsel der Pronomen in Adams Rede
  choice: Der Wechsel von »du« zu »sie« bleibt bestehen.
  alternative: Die gesamte Rede einheitlich in der zweiten Person formulieren.
  rationale: Der abrupte Personenwechsel steht im konsultierten Zeugen und kann auf Überlieferung, zitierende Rede oder einen Wechsel des Bezugs hindeuten; er wird nicht stillschweigend beseitigt.
- issue: Sexuelle Gewalt und Selbstgericht
  choice: Die drastische Handlung wird klar, aber nicht sensationsheischend wiedergegeben; das daraus folgende Gericht bleibt Selbstgericht.
  alternative: Die Szene euphemistisch abschwächen oder moralisch erweitern.
  rationale: Die Erzählung begründet das Gericht ausdrücklich durch die eigene, nach ihrem Bild geformte Gestalt der Mächte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Etablierte Fachbegriffe wie »Archonten« bleiben erhalten; schwer verständliche anthropologische und bildhafte Wendungen werden nicht dogmatisch geglättet. Eckige Klammern, leere Klammern und Winkelklammern bewahren die textkritischen Signale des zugrunde gelegten öffentlichen englischen Zeugen. Da die direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich vorläufig und quellenkritisch zurückhaltend.
