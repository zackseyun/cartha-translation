base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: de
  text: 'Darum wollen wir Gott mit reinem Herzen dienen, und wir werden gerecht sein. Wenn wir ihm aber nicht dienen, weil wir Gottes Verheißung nicht glauben, werden wir elend sein.


    Denn auch das prophetische Wort sagt: »Elend sind die Unentschlossenen, die in ihrem Herzen zweifeln und sagen: ›Schon vor langer Zeit, auch in den Tagen unserer Väter, haben wir davon gehört. Doch wir haben Tag für Tag gewartet und nichts davon gesehen.‹


    Ihr Unverständigen! Vergleicht euch mit einem Baum; nehmt einen Weinstock: Zuerst wirft er seine Blätter ab, dann kommt ein Trieb, danach eine unreife Beere und schließlich eine vollreife Traube.


    Ebenso erlebte mein Volk Unruhen und Bedrängnisse; danach aber wird es Gutes empfangen.«[a]


    Darum, meine Geschwister,[b] lasst uns nicht unentschlossen sein, sondern in der Hoffnung geduldig ausharren, damit auch wir unseren Lohn empfangen.


    Denn treu ist der, der versprochen hat, jedem Menschen den Lohn für seine Taten zu geben.


    Wenn wir also vor Gott Gerechtigkeit üben, werden wir in sein Reich eingehen und die Verheißungen empfangen, »die kein Ohr gehört und kein Auge gesehen hat, kein Auge gesehen hat und die in keines Menschen Herz gedrungen sind«.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 2–4 werden als prophetisches Wort angeführt. Die genaue Herkunft des Zitats ist nicht sicher bekannt.
    reason: Kennzeichnet das Zitat und bewahrt die Unsicherheit seiner Herkunft.
  - marker: b
    text: 'Wörtlich: »meine Brüder«; die Anrede kann die gesamte Gemeinde einschließen.'
    reason: Macht die Grundlage der inklusiven Wiedergabe transparent.
  - marker: c
    text: Die Wiederholung »kein Auge gesehen hat« steht in der überlieferten englischen Textgrundlage und wurde hier beibehalten. Ein direkter Abgleich mit dem griechischen Text steht noch aus; die Formulierung erinnert an 1 Korinther 2,9.
    reason: Bewahrt die auffällige Wiederholung des gelieferten Zeugen und weist offen auf die noch ausstehende Quellenprüfung hin.
lexical_decisions:
- source_word: καθαρά καρδίᾳ (as reflected by “in/with a pure heart”)
  choice: mit reinem Herzen
  rationale: Natürliche, würdige deutsche Wendung, die die innere Lauterkeit bewahrt.
- source_word: διστάζοντες / δίψυχοι (as reflected by “double-minded”)
  choice: Unentschlossenen
  rationale: Bewahrt den Gedanken innerer Gespaltenheit und schwankenden Vertrauens, ohne eine konfessionell geprägte Deutung einzutragen.
- source_word: θλίψεις / ταραχαί (as reflected by “tumults and afflictions”)
  choice: Unruhen und Bedrängnisse
  rationale: Gibt sowohl äußere Erschütterungen als auch leidvolle Not wieder.
- source_word: ἀποδώσειν ... τὴν ἀντιμισθίαν τῶν ἔργων (as reflected by “pay ... recompense of works”)
  choice: den Lohn für seine Taten zu geben
  rationale: Verständliches modernes Deutsch; der Vergeltungs- beziehungsweise Lohnzusammenhang der Werke bleibt bestehen.
- source_word: ἐργασώμεθα δικαιοσύνην (as reflected by “wrought righteousness”)
  choice: Gerechtigkeit üben
  rationale: Bezeichnet gerechtes Handeln und vermeidet die missverständliche Formulierung, Menschen würden Gerechtigkeit erschaffen.
theological_decisions:
- issue: Zusammenhang zwischen Dienst, gerechtem Handeln und dem Eingang in Gottes Reich
  choice: Die konditionalen Aussagen des Textes werden unverändert als Mahnung wiedergegeben.
  alternative: Die Aussagen ausdrücklich im Sinn einer bestimmten Rechtfertigungs- oder Verdienstlehre erläutern.
  rationale: Der Text verbindet Verhalten, Hoffnung, Lohn und Reichseintritt, ohne hier eine vollständige systematische Lehre zu entfalten; diese Spannung darf nicht aufgelöst werden.
- issue: Gottes Verheißung und menschliches Ausharren
  choice: Sowohl Gottes Treue als auch die Aufforderung zum geduldigen Ausharren bleiben nebeneinander stehen.
  alternative: Eine Seite als bloße Folge oder als allein entscheidend hervorheben.
  rationale: Die paränetische und verheißungsbezogene Doppelperspektive gehört zur Aussage des Abschnitts.
- issue: Anrede ἀδελφοί / “brethren”
  choice: meine Geschwister
  alternative: meine Brüder
  rationale: Die moderne inklusive Anrede gibt die gemeinschaftliche Funktion der antiken maskulinen Pluralform wieder, ohne den Adressatenkreis unnötig auf Männer einzuengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Mahn- und Verkündigungsstil. Die prophetische Rede ist durch deutsche Anführungszeichen gegliedert. Da nur ein englischer gemeinfreier Zeuge mit noch ausstehender Prüfung des griechischen Ausgangstextes vorliegt, bleiben textkritische Aussagen ausdrücklich vorläufig.
