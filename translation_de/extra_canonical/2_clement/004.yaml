base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: de
  text: '4 Darum wollen wir ihn nicht nur »Herr« nennen; denn das wird uns nicht retten.


    Denn er sagt: »Nicht jeder, der zu mir sagt: ›Herr‹, wird gerettet werden, sondern wer Gerechtigkeit tut.«[a]


    So lasst uns ihn nun, Geschwister, durch unsere Taten bekennen: indem wir einander lieben, nicht die Ehe brechen, nicht schlecht übereinander reden und einander nicht beneiden, sondern besonnen, barmherzig und gütig sind. Wir sollen Mitgefühl füreinander haben und nicht habgierig sein. Durch solche Taten wollen wir ihn bekennen und nicht durch das Gegenteil.


    Wir sollen nicht die Menschen fürchten, sondern Gott.


    Denn der Herr sagte: »Auch wenn ihr mit mir an meiner Brust versammelt seid und meine Gebote nicht haltet, werde ich euch von mir stoßen und zu euch sagen: ›Geht weg von mir! Ich weiß nicht, woher ihr seid, ihr Täter des Unrechts.‹«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Matthäus 7,21. Die hier überlieferte Fassung lautet »wird gerettet werden« und »wer Gerechtigkeit tut« und weicht damit vom Wortlaut vieler heutigen Matthäusübersetzungen ab.
    reason: Kennzeichnet die erkennbare Jesusüberlieferung und bewahrt zugleich die eigenständige Textform des 2. Clemensbriefs.
  - marker: b
    text: Das Herrenwort verbindet Motive, die auch in Matthäus 7,23 und Lukas 13,25–27 begegnen. »Bei mir an meiner Brust« bezeichnet besondere Nähe und Geborgenheit.
    reason: Erläutert die zusammengesetzte bzw. eigenständige Überlieferungsform und die heute ungewohnte Bildsprache.
lexical_decisions:
- source_word: 'Lord (Greek: κύριος, as reflected in the witness)'
  choice: Herr
  rationale: Die herkömmliche und sachlich passende Wiedergabe; sie bewahrt sowohl die Anrede als auch den christologischen Titel.
- source_word: 'doeth righteousness (Greek likely: ποιῶν τὴν δικαιοσύνην)'
  choice: Gerechtigkeit tut
  rationale: Die bewusst konkrete, semitisch geprägte Ausdrucksweise wird erhalten und nicht auf bloßes moralisches Wohlverhalten verengt.
- source_word: 'confess (Greek likely: ὁμολογεῖν)'
  choice: bekennen
  rationale: »Bekennen« wahrt den öffentlichen und loyalitätsbezogenen Sinn, der hier ausdrücklich durch Taten verwirklicht wird.
- source_word: temperate
  choice: besonnen
  rationale: Modern verständlich und würdevoll; bezeichnet beherrschtes, maßvolles Verhalten, ohne den Sinn auf Alkohol- oder Sexualethik einzuengen.
- source_word: fellow-feeling
  choice: Mitgefühl
  rationale: Natürliches modernes Deutsch für die geforderte mitfühlende Anteilnahme aneinander.
- source_word: covetous
  choice: habgierig
  rationale: Gibt das ungeordnete Streben nach Besitz klar und allgemeinverständlich wieder.
- source_word: workers of iniquity
  choice: Täter des Unrechts
  rationale: Bewahrt den handlungsbezogenen Charakter der Wendung und vermeidet das weniger natürliche »Übeltäter der Gesetzlosigkeit«.
theological_decisions:
- issue: Verhältnis von Herr-Bekenntnis, Werken und Rettung
  choice: 'Die Aussagen bleiben ungemildert nebeneinander stehen: Die bloße Anrede »Herr« rettet nicht; gefordert wird, Gerechtigkeit zu tun und Christus durch Taten zu bekennen.'
  alternative: Die Passage durch Zusätze über Glauben, Verdienst oder Rechtfertigung systematisch einzuordnen.
  rationale: Der Text formuliert eine ethische Warnung und löst die weitergehende theologische Spannung nicht ausdrücklich auf; eine konfessionelle Harmonisierung wäre ein Import.
- issue: Anrede der Gemeinde
  choice: Geschwister
  alternative: Brüder
  rationale: Das griechische ἀδελφοί kann eine gemischtgeschlechtliche Gemeinde anreden. »Geschwister« gibt diesen inklusiven Adressatenkreis im heutigen Deutsch natürlich wieder.
- issue: Logien des Herrn
  choice: Als direkte Rede des Herrn wiedergegeben, ohne stillschweigende Gleichsetzung mit einer einzelnen kanonischen Evangelienstelle.
  alternative: Die Zitate exakt an Matthäus oder Lukas angleichen.
  rationale: 2 Clemens verbindet bzw. überliefert Jesusworte in einer eigenständigen Form. Diese Textgestalt soll nicht durch Harmonisierung eingeebnet werden.
- issue: Bedingungsgefüge im letzten Absatz
  choice: »Wenn ihr dies tut, aber meine Gebote nicht haltet«
  alternative: »Wenn ihr diese Dinge tut« als ausreichende Bedingung für die folgende Verwerfung lesen.
  rationale: Der Sinnzusammenhang verlangt einen Gegensatz zwischen äußerer Nähe bzw. bestimmten Taten und dem fehlenden Gehorsam gegenüber den Geboten; die deutsche Satzstellung macht diesen Zusammenhang verständlich, ohne die Warnung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit paränetischem Ton. Kurze Hauptsätze erhalten den eindringlichen Charakter. Die Übersetzung stützt sich wegen der ausstehenden direkten Prüfung des griechischen Textes auf den angegebenen englischen Textzeugen; mögliche griechische Rückbezüge werden daher ausdrücklich vorsichtig behandelt.
