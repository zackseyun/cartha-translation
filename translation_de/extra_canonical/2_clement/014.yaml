base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: de
  text: 'Darum, Geschwister, werden wir zur ursprünglichen Gemeinde gehören, die geistlich ist und vor Sonne und Mond geschaffen wurde, wenn wir den Willen Gottes, unseres Vaters, tun. Tun wir aber den Willen des Herrn nicht, wird auf uns das Schriftwort zutreffen: »Mein Haus ist zu einer Räuberhöhle geworden.«[a] Entscheiden wir uns also dafür, zur Gemeinde des Lebens zu gehören, damit wir gerettet werden.


    Ihr wisst doch gewiss, dass die lebendige Gemeinde der Leib Christi ist. Denn die Schrift sagt: »Gott schuf den Menschen als Mann und Frau.«[b] Der Mann ist Christus, und die Frau ist die Gemeinde. Auch die Schriften und die Apostel erklären unmissverständlich, dass die Gemeinde nicht erst jetzt besteht, sondern von Anfang an bestanden hat. Denn sie war geistlich, wie auch unser Jesus geistlich war. In den letzten Tagen aber wurde sie offenbar, damit er uns rette.[c]


    Die Gemeinde, die geistlich ist, wurde nun im Fleisch Christi offenbar. Damit zeigt sie uns: Wenn jemand von uns sie im Fleisch bewahrt und nicht befleckt, wird er sie im Heiligen Geist wieder empfangen. Denn dieses Fleisch ist Gegenbild und Abbild des Geistes.[d] Wer also das Abbild befleckt hat, wird das Urbild nicht als Anteil empfangen. Das ist daher gemeint, Geschwister: »Bewahrt das Fleisch, damit ihr Anteil am Geist bekommt.«


    Wenn wir aber sagen, das Fleisch sei die Gemeinde und der Geist sei Christus, dann gilt: Wer mit dem Fleisch schändlich umgegangen ist, ist mit der Gemeinde schändlich umgegangen. Ein solcher Mensch wird daher keinen Anteil am Geist haben, der Christus ist.


    Ein so herrliches Leben und eine so herrliche Unvergänglichkeit kann dieses Fleisch als Anteil empfangen, wenn der Heilige Geist sich mit ihm verbindet. Niemand kann aussprechen oder erzählen, was der Herr für seine Erwählten bereitet hat.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vgl. Jeremia 7,11; Matthäus 21,13 und Parallelen. Wörtlich heißt es im überlieferten Wortlaut: »Wir werden von der Schrift sein, die sagt …« Gemeint ist wahrscheinlich, dass dieses Gerichtswort auf uns zutrifft.'
    reason: Die Formulierung ist ungewöhnlich und sollte nicht ohne Hinweis geglättet werden.
  - marker: b
    text: Vgl. 1. Mose 1,27. Der Text verwendet die Schöpfung von Mann und Frau allegorisch für Christus und die Gemeinde.
    reason: Kennzeichnet Schriftbezug und Auslegungsweise.
  - marker: c
    text: Der Satz verbindet die geistliche Gemeinde und den ebenfalls geistlichen Jesus eng miteinander. Die genaue Beziehung der Pronomen ist im überlieferten Gedankengang schwierig; eine Prüfung am griechischen Text steht noch aus.
    reason: Bewahrt eine echte syntaktische und theologische Spannung der vorliegenden Quellengrundlage.
  - marker: d
    text: »Gegenbild und Abbild« gibt eine Bildbeziehung zwischen Fleisch und Geist wieder. Der folgende Satz nennt den Geist sinngemäß das Urbild; die genaue griechische Terminologie muss noch direkt geprüft werden.
    reason: Die Übersetzung beruht hier vorläufig auf dem englischen öffentlichen Zeugen.
  - marker: e
    text: Vgl. 1. Korinther 2,9; Jesaja 64,3 nach der griechischen Zählung beziehungsweise 64,4 in vielen deutschen Bibeln.
    reason: Kennzeichnet den abschließenden Schriftanklang.
lexical_decisions:
- source_word: first Church (Greek review pending)
  choice: ursprüngliche Gemeinde
  rationale: Gibt den zeitlichen Vorrang wieder, ohne im Deutschen missverständlich eine nummerierte oder institutionell abgegrenzte »erste Kirche« anzudeuten.
- source_word: Church
  choice: Gemeinde
  rationale: Bewahrt den gemeinschaftlichen und leiblichen Sinn des frühchristlichen ekklesia-Sprachgebrauchs; die feminine Form trägt zudem den folgenden Mann-Frau-Vergleich.
- source_word: Books
  choice: Schriften
  rationale: Natürliches Deutsch für die als autoritativ angeführten schriftlichen Überlieferungen; die Großschreibung des englischen Zeugen wird nicht künstlich nachgebildet.
- source_word: counterpart and copy
  choice: Gegenbild und Abbild
  rationale: Bewahrt die doppelte Bildterminologie und den Gegensatz zwischen sichtbarer Entsprechung und geistlichem Urbild.
- source_word: dealt wantonly with
  choice: schändlich umgegangen
  rationale: Drückt Missbrauch und entehrende Behandlung aus, ohne die im griechischen Ausgangstext noch zu prüfende genaue sexuelle oder moralische Nuance zu verengen.
- source_word: immortality
  choice: Unvergänglichkeit
  rationale: Passt zum frühchristlichen Auferstehungs- und Verwandlungskontext und vermeidet die mögliche Verengung auf bloß endlose Dauer.
- source_word: elect
  choice: Erwählten
  rationale: Traditionell verständliche und theologisch offene Wiedergabe, ohne eine bestimmte Erwählungslehre einzutragen.
theological_decisions:
- issue: Präexistenz der Gemeinde
  choice: Die Aussage von der geistlichen, vor Sonne und Mond geschaffenen Gemeinde bleibt wörtlich und unaufgelöst stehen.
  alternative: Als bloßen göttlichen Plan oder als Vorherbestimmung der historischen Kirche paraphrasieren.
  rationale: Der Text entfaltet eine reale präexistente beziehungsweise geistliche Ekklesiologie; eine dogmatische Harmonisierung würde seine Spannung beseitigen.
- issue: Mann und Frau als Christus und Gemeinde
  choice: Die allegorische Zuordnung wird direkt wiedergegeben.
  alternative: Den Vergleich abschwächen oder lediglich typologisch erklären.
  rationale: Die argumentative Form des Textes soll sichtbar bleiben, auch wo sie moderne Leser überrascht.
- issue: Mehrdeutige Pronomen und Offenbarung in den letzten Tagen
  choice: »sie« bezieht sich auf die Gemeinde; »er« in »damit er uns rette« auf Jesus.
  alternative: Auch das rettende Subjekt als Gemeinde verstehen oder den Satz umformulieren.
  rationale: Dies folgt der Grammatik und Argumentation des englischen Zeugen, bleibt aber wegen ausstehender griechischer Prüfung in einer Fußnote als textlich schwierige Stelle markiert.
- issue: Fleisch, Gemeinde und Geist
  choice: Die wechselnden Gleichsetzungen und Bildrelationen werden beibehalten.
  alternative: Alle Aussagen systematisch als Verhältnis von individuellem Leib und Seele oder von Kirche und Christus vereinheitlichen.
  rationale: Der Abschnitt verbindet Anthropologie, Ethik und Ekklesiologie in einer nicht vollständig geglätteten Weise; diese Spannung ist genuine Textaussage.
- issue: Heil und Bewahrung des Fleisches
  choice: Die konditionale Mahnung bleibt deutlich, ohne ein ausgearbeitetes Verdienstschema zu ergänzen.
  alternative: Die Aussage ausdrücklich in ein bestimmtes Rechtfertigungs- oder Heiligungsmodell einordnen.
  rationale: Der Text betont ethische Bewahrung als Bedingung der Teilhabe, bestimmt aber keine spätere konfessionelle Systematik.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede »Geschwister«. »Gemeinde« wird konsequent verwendet, um die feminine Bildsprache und den Leib-Christi-Zusammenhang zu erhalten. Archaismen wurden vermieden, die dichte und teilweise fremdartige Argumentation jedoch nicht vereinfachend aufgelöst. Da kein griechischer Wortlaut mitgeliefert wurde und die direkte Quellenprüfung ausdrücklich aussteht, ist der Entwurf als vorläufig und am öffentlichen englischen Zeugen kontrolliert zu behandeln.
