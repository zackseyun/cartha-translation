review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: Im Satz über die Offenbarung der geistlichen Gemeinde in den letzten Tagen ist das rettende Subjekt nach der überlieferten Satzgrammatik die Gemeinde (»damit sie uns rette«), nicht Jesus. Die Fassung »damit er uns rette« folgt der kapitalisierenden englischen Zeugenübersetzung, verschiebt aber das feminine griechische Subjekt und glättet die bewusst eigenwillige Ekklesiologie des Abschnitts. Außerdem ist »Gegenbild« für die hier gemeinte Bild-/Entsprechungsrelation irreführend, weil es im Deutschen leicht ein kontrastierendes Gegenbild bezeichnet.'
  naturalness: Die Übersetzung ist insgesamt würdevoll und gut verständlich. »Entsprechung und Abbild« ist für die dichte Bildsprache natürlicher und weniger missverständlich als »Gegenbild und Abbild«. Die ungewöhnliche Aussage über das Schriftwort bleibt als verständliche Deutung mit einer erläuternden Fußnote kenntlich.
  terminology: »Gemeinde«, »Geist«, »Fleisch«, »Unvergänglichkeit« und »Erwählte« sind angemessen und werden konsistent verwendet. »erste Gemeinde« gibt den zeitlichen Vorrang von »first Church« unmittelbarer wieder als »ursprüngliche Gemeinde«, ohne eine institutionelle Deutung einzutragen.
  issues:
  - severity: high
    issue: Das rettende Subjekt wird mit »er« auf Jesus bezogen.
    rationale: Im überlieferten Gedankengang ist die geistliche Gemeinde das feminine Subjekt von »wurde offenbar« und von »damit sie uns rette«. Die Umstellung auf Jesus ist nicht durch den vorliegenden Zeugen gedeckt und verändert die Aussage.
  - severity: medium
    issue: »Gegenbild« kann eine gegensätzliche Darstellung suggerieren.
    rationale: Der Kontext verlangt eine Entsprechungs- und Abbildrelation zwischen Fleisch und Geist; der folgende Kontrast ist vielmehr Abbild versus Urbild/Original.
  - severity: low
    issue: »ursprüngliche Gemeinde« schwächt »first Church« ab.
    rationale: »erste Gemeinde« gibt die zeitliche Priorität direkter wieder; die präexistente Aussage bleibt dadurch klarer sichtbar.
  revised_text: 'Darum, Geschwister, werden wir zur ersten Gemeinde gehören, die geistlich ist und vor Sonne und Mond geschaffen wurde, wenn wir den Willen Gottes, unseres Vaters, tun. Tun wir aber den Willen des Herrn nicht, wird auf uns das Schriftwort zutreffen: »Mein Haus ist zu einer Räuberhöhle geworden.«[a] Entscheiden wir uns also dafür, zur Gemeinde des Lebens zu gehören, damit wir gerettet werden.



    Ihr wisst doch gewiss, dass die lebendige Gemeinde der Leib Christi ist. Denn die Schrift sagt: »Gott schuf den Menschen als Mann und Frau.«[b] Der Mann ist Christus, und die Frau ist die Gemeinde. Auch die Schriften und die Apostel erklären unmissverständlich, dass die Gemeinde nicht erst jetzt besteht, sondern von Anfang an bestanden hat. Denn sie war geistlich, wie auch unser Jesus geistlich war. In den letzten Tagen aber wurde sie offenbar, damit sie uns rette.[c]



    Die Gemeinde, die geistlich ist, wurde nun im Fleisch Christi offenbar. Damit zeigt sie uns: Wenn jemand von uns sie im Fleisch bewahrt und nicht befleckt, wird er sie im Heiligen Geist wieder empfangen. Denn dieses Fleisch ist Entsprechung und Abbild des Geistes.[d] Wer also das Abbild befleckt hat, wird das Urbild nicht als Anteil empfangen. Das ist daher gemeint, Geschwister: »Bewahrt das Fleisch, damit ihr Anteil am Geist bekommt.«



    Wenn wir aber sagen, das Fleisch sei die Gemeinde und der Geist sei Christus, dann gilt: Wer mit dem Fleisch schändlich umgegangen ist, ist mit der Gemeinde schändlich umgegangen. Ein solcher Mensch wird daher keinen Anteil am Geist haben, der Christus ist.



