base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: de
  text: 'Da wir nun so großes Erbarmen empfangen haben – zunächst darin, dass wir Lebenden diesen toten Göttern weder opfern noch sie anbeten, sondern durch ihn den Vater der Wahrheit erkannt haben –, was ist die Erkenntnis ihm gegenüber anderes, als den nicht zu verleugnen, durch den wir ihn erkannt haben?


    Denn er selbst sagt: »Wer sich vor den Menschen zu mir bekennt, zu dem werde auch ich mich vor meinem Vater bekennen.«[a]


    Das also ist unser Lohn, wenn wir uns wirklich zu ihm bekennen, durch den wir gerettet wurden.


    Wodurch aber bekennen wir uns zu ihm? Dadurch, dass wir tun, was er sagt, seinen Geboten nicht ungehorsam sind und ihn nicht nur mit den Lippen ehren, sondern mit unserem ganzen Herzen und unserem ganzen Verstand.


    Auch bei Jesaja sagt er: »Dieses Volk ehrt mich mit den Lippen, doch sein Herz ist weit von mir entfernt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Matthäus 10,32; Lukas 12,8. Die griechische Überlieferung von 2. Clemens enthält hier die Wendung »vor den Menschen« und »vor meinem Vater«, die in dem beigegebenen englischen Textzeugen fehlen.
    reason: Kennzeichnet die Schriftanknüpfung und dokumentiert knapp die gegenüber dem gelieferten englischen Zeugen ausführlichere griechische Fassung.
  - marker: b
    text: Vgl. Jesaja 29,13; auch Markus 7,6 und Matthäus 15,8.
    reason: Weist die ausdrücklich Jesaja zugeschriebene und in frühchristlicher Überlieferung erneut aufgegriffene Schriftstelle nach.
lexical_decisions:
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Gibt die zugewandte, rettende Barmherzigkeit in würdigem und allgemein verständlichem Deutsch wieder.
- source_word: τοῖς νεκροῖς θεοῖς
  choice: diesen toten Göttern
  rationale: Bewahrt die polemische Gegenüberstellung zwischen den Lebenden und den als tot bezeichneten Göttern.
- source_word: τὸν πατέρα τῆς ἀληθείας
  choice: den Vater der Wahrheit
  rationale: Erhält den Genitiv und seine mögliche Bedeutungsfülle, statt ihn als bloß beschreibendes Adjektiv aufzulösen.
- source_word: ὁμολογεῖν
  choice: sich zu jemandem bekennen
  rationale: Passt in beiden Zusammenhängen – dem Christuswort und dem praktischen Bekenntnis – und wahrt den öffentlichen, verbindlichen Sinn.
- source_word: μισθός
  choice: Lohn
  rationale: Entspricht der konkreten Vergeltungs- beziehungsweise Belohnungssprache des Textes, ohne sie abzuschwächen.
- source_word: διάνοια
  choice: Denken
  rationale: Modernes, verständliches Deutsch; bezeichnet die innere Denktätigkeit beziehungsweise Gesinnung, ohne sie einseitig auf den Verstand zu verengen.
theological_decisions:
- issue: Bezug der Pronomen in der Aussage über Erkenntnis und Verleugnung
  choice: „den nicht zu verleugnen, durch den wir ihn erkannt haben“
  alternative: „ihn nicht zu verleugnen, durch den wir ihn erkannt haben“
  rationale: Die Formulierung lässt erkennen, dass Christus als der Mittler nicht verleugnet werden soll, durch den der Vater erkannt wurde, ohne die im griechischen Pronomengebrauch vorhandene Spannung unnötig auszudeuten.
- issue: Bekenntnis als tätiger Gehorsam
  choice: Die folgende Erklärung wird direkt als Antwort auf „Wodurch ...?“ wiedergegeben.
  alternative: Bekenntnis ausschließlich als mündliches Glaubensbekenntnis verstehen
  rationale: Der Text selbst bestimmt das Bekenntnis durch Tun, Gehorsam und ganzheitliche Verehrung; diese ethische Zuspitzung wird nicht abgeschwächt.
- issue: „Vater der Wahrheit“
  choice: Genitivkonstruktion beibehalten
  alternative: „der wahre Vater“
  rationale: Die Alternative würde den theologischen Gehalt verändern und eine mögliche Aussage über Gott als Ursprung beziehungsweise Vater der Wahrheit auf eine Eigenschaft reduzieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut vorlesbarem Register. Die Periodenstruktur wurde behutsam gegliedert, ohne die argumentativen Verknüpfungen des griechischen Textes zu verlieren. Die Übersetzung folgt vorrangig der griechischen Überlieferung, soweit sie für diese Stelle überprüfbar ist; der gelieferte gemeinfreie englische Zeuge und die englische POB-Fassung dienten als Konsultationsschicht.
