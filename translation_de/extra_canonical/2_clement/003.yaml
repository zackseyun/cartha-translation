revisions:
- from: 'Da wir nun durch ihn so großes Erbarmen empfangen haben – vor allem dies: Wir, die wir leben, opfern diesen toten Göttern nicht und beten sie auch nicht an, sondern haben durch ihn den Vater der Wahrheit erkannt –, was bedeutet diese Erkenntnis, die auf ihn gerichtet ist, anderes, als den nicht zu verleugnen, durch den wir ihn erkannt haben?


    Denn er selbst sagt: »Wer sich vor den Menschen zu mir bekennt, zu dem werde auch ich mich vor meinem Vater bekennen.«[a]


    Das also ist unser Lohn, wenn wir uns zu dem bekennen, durch den wir gerettet wurden.


    Wodurch aber bekennen wir uns zu ihm? Dadurch, dass wir tun, was er sagt, seinen Geboten nicht ungehorsam sind und ihn nicht nur mit den Lippen ehren, sondern von ganzem Herzen und mit unserem ganzen Denken.


    Auch bei Jesaja sagt er: »Dieses Volk ehrt mich mit den Lippen, doch sein Herz ist weit von mir entfernt.«[b]'
