  terminology: „Vater der Wahrheit“, „tote Götter“, „Lohn“ und „sich zu ihm bekennen“ sind sachgerecht. Für διάνοια ist „Verstand“ in der festen ganzheitlichen Paarformel mit „Herz“ idiomatischer als „Denken“, ohne den Sinn einzuengen.
