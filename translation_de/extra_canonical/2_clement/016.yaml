base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: de
  text: '**2. Clemens 16**


    Darum, Geschwister: Da sich uns eine nicht geringe Gelegenheit zur Umkehr eröffnet hat und wir noch Zeit haben, wollen wir zu Gott zurückkehren, der uns berufen hat, solange wir noch einen haben, der uns annimmt.


    Denn wenn wir diesen Vergnügungen Lebewohl sagen und unsere Seele bezwingen, indem wir uns weigern, ihre bösen Begierden zu erfüllen, werden wir Anteil am Erbarmen Jesu erhalten.


    Ihr wisst aber, dass der Tag des Gerichts schon jetzt kommt wie ein brennender Ofen. Die Mächte der Himmel werden schmelzen und die ganze Erde wie Blei, das im Feuer schmilzt. Dann werden die verborgenen und die offenkundigen Taten der Menschen sichtbar werden.


    Darum ist das Geben von Almosen etwas Gutes, ebenso wie die Umkehr von der Sünde.[a] Fasten ist besser als Beten, das Geben von Almosen aber besser als beides. Die Liebe bedeckt eine Menge von Sünden; ein Gebet aus gutem Gewissen aber rettet vom Tod. Glücklich ist jeder, der davon erfüllt vorgefunden wird. Denn das Geben von Almosen nimmt die Last der Sünde hinweg.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die gelieferte englische Vorlage enthält nach „sin“ das fehlerhafte Zeichen „&gt;“. Hier wird es, dem Sinnzusammenhang entsprechend, als Satzgrenze behandelt.
    reason: Textkritische Transparenz bei einem offensichtlichen Überlieferungs- oder Digitalisierungsfehler der Arbeitsvorlage.
  - marker: b
    text: Diese Fassung beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Übersetzungszeugnis. Eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die Quellenangabe bezeichnet zwar die griechische Manuskripttradition, liefert aber keinen griechischen Text; daher muss der vorläufige Charakter offengelegt werden.
lexical_decisions:
- source_word: brethren (Greek source term pending direct review)
  choice: Geschwister
  rationale: Natürliche, inklusive Wiedergabe der angeredeten Glaubensgemeinschaft; vermeidet die heute häufig rein männlich verstandene Form „Brüder“.
- source_word: repentance
  choice: Umkehr
  rationale: Gibt die umfassende Hinwendung zu Gott natürlicher wieder als das enger oder kirchlich geprägte „Buße“.
- source_word: conquer our soul
  choice: unsere Seele bezwingen
  rationale: Bewahrt die auffällige, spannungsreiche Bildsprache des Zeugnisses, ohne sie psychologisch umzudeuten.
- source_word: powers of the heavens
  choice: Mächte der Himmel
  rationale: Formnahe Wiedergabe, die offenlässt, ob kosmische Kräfte oder himmlische Wesen gemeint sind.
- source_word: almsgiving
  choice: das Geben von Almosen
  rationale: Verständliche Wiedergabe der konkreten barmherzigen Hilfe für Bedürftige; „Almosengeben“ wäre kompakter, klingt aber weniger natürlich.
- source_word: good conscience
  choice: gutem Gewissen
  rationale: Bewahrt die ethische und geistliche Qualifikation des Gebets.
theological_decisions:
- issue: Erbarmen Jesu und Teilhabe daran
  choice: „Anteil am Erbarmen Jesu erhalten“
  alternative: „am Erbarmen Jesu teilhaben“
  rationale: Bewahrt die zukünftige Aussage und die Teilhabeformulierung, ohne ein bestimmtes Heilsmodell einzutragen.
- issue: Liebe bedeckt eine Menge von Sünden
  choice: Wörtliche Bildsprache beibehalten
  alternative: „Liebe lässt viele Sünden vergeben werden“
  rationale: Die Aussage bleibt bewusst offen hinsichtlich dessen, wessen Sünden bedeckt werden und auf welche Weise.
- issue: Gebet rettet vom Tod
  choice: „rettet vom Tod“
  alternative: „bewahrt vor dem Tod“
  rationale: Die stärkere Rettungsaussage des Zeugnisses wird nicht abgeschwächt; die Art des Todes bleibt unbestimmt.
- issue: Almosen nimmt die Last der Sünde hinweg
  choice: Aussage unverändert spannungsreich wiedergeben
  alternative: soteriologisch erklärende oder abschwächende Paraphrase
  rationale: Der Text verbindet Almosengeben ausdrücklich mit der Sündenlast. Eine konfessionelle Harmonisierung oder dogmatische Präzisierung wäre ein unzulässiger Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Satzführung. Biblische Bildsprache und theologische Spannungen wurden bewahrt. Wegen des fehlenden griechischen Wortlauts ist der Entwurf ausdrücklich vorläufig und eng am bereitgestellten englischen Zeugnis orientiert.
