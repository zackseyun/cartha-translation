base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: de
  text: 'Darum, meine Geschwister, lasst uns den Willen des Vaters tun, der uns berufen hat, damit wir leben. Lasst uns umso mehr nach Tugend streben, das Laster aber als Vorläufer unserer Sünden verlassen, und lasst uns vor der Gottlosigkeit fliehen, damit uns nicht Übel ereilen.


    Denn wenn wir uns eifrig bemühen, Gutes zu tun, wird der Friede uns nachfolgen.


    Aus diesem Grund kann ein Mensch das Glück nicht erlangen: Sie lassen sich von Menschenfurcht bestimmen und ziehen den Genuss des Gegenwärtigen der Verheißung des Zukünftigen vor.[a]


    Denn sie wissen nicht, welch große Qual der gegenwärtige Genuss mit sich bringt und welche Freude die zukünftige Verheißung bringt.


    Und wenn sie dies wirklich nur für sich selbst täten, wäre es noch erträglich. Nun aber fahren sie fort, unschuldige Seelen das Böse zu lehren. Dabei wissen sie nicht, dass sie doppelt verurteilt werden: sie selbst und ihre Zuhörer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der zugrunde liegende englische Zeuge ist an dieser Stelle sprachlich schwierig („they call in the fears of men“). Die Wiedergabe „sie lassen sich von Menschenfurcht bestimmen“ ist daher vorläufig; eine Prüfung am griechischen Text ist erforderlich.
    reason: Kennzeichnet eine erhebliche textliche beziehungsweise übersetzerische Unsicherheit, da die direkte Prüfung der griechischen Vorlage noch aussteht.
lexical_decisions:
- source_word: my brethren
  choice: meine Geschwister
  rationale: Natürliches, inklusives modernes Deutsch für die gemeinschaftliche Anrede, ohne den familiären Charakter aufzugeben.
- source_word: virtue
  choice: Tugend
  rationale: Bewahrt den ethisch geprägten Gegenbegriff zu „Laster“ und den würdevollen Ton.
- source_word: vice
  choice: Laster
  rationale: Entspricht dem ethischen Gegensatz zu Tugend und bleibt näher am Zeugnis als eine allgemeinere Wiedergabe mit „Böses“.
- source_word: ungodliness
  choice: Gottlosigkeit
  rationale: Gibt die religiös-moralische Dimension wieder, ohne sie auf bloß schlechtes Verhalten zu reduzieren.
- source_word: peace will pursue us
  choice: wird der Friede uns nachfolgen
  rationale: Bewahrt die auffällige Personifikation und Bewegungsmetapher des Zeugnisses.
- source_word: attain happiness
  choice: das Glück erlangen
  rationale: Gibt die im englischen Zeugen hervorgehobene Zielvorstellung idiomatisch und ohne zusätzliche theologische Festlegung wieder.
- source_word: the enjoyment which is here
  choice: der Genuss des Gegenwärtigen / der gegenwärtige Genuss
  rationale: Stellt den zeitlichen Gegensatz zur kommenden Verheißung klar heraus und erhält zugleich den Sinn von gegenwärtigem Genuss.
- source_word: innocent souls
  choice: unschuldige Seelen
  rationale: Formnahe Wiedergabe, die den moralischen und pastoralen Ernst der Aussage wahrt.
- source_word: condemnation doubled
  choice: doppelt verurteilt werden
  rationale: Natürliches Deutsch, das die doppelte Verantwortlichkeit von Lehrenden und Hörenden deutlich macht.
theological_decisions:
- issue: Zweck des göttlichen Rufes
  choice: „der uns berufen hat, damit wir leben“
  alternative: „der uns zum Leben berufen hat“
  rationale: Die gewählte Fassung bewahrt die syntaktische Offenheit zwischen Berufung, Gehorsam und Leben, statt „zum Leben“ als alleinigen Inhalt der Berufung festzulegen.
- issue: Friede als Folge guten Handelns
  choice: „wird der Friede uns nachfolgen“
  alternative: „werden wir Frieden finden“
  rationale: Die Personifikation bleibt erhalten; eine Verallgemeinerung zu innerem Wohlbefinden wird vermieden.
- issue: Doppelte Verurteilung
  choice: „sie selbst und ihre Zuhörer“
  alternative: „für sich selbst und für ihre Zuhörer“
  rationale: Bewahrt die knappe Spannung des Zeugnisses, ohne ein ausgearbeitetes Modell stellvertretender Schuld zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit exhortativem Rhythmus. Die wiederholten Aufforderungen und die Kontraste zwischen Tugend und Laster, Gegenwart und Zukunft sowie Genuss und Qual wurden bewahrt. Da nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die Prüfung des Griechischen ausdrücklich noch aussteht, ist der Entwurf besonders in Satz 3 vorläufig.
