review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die ethischen Kontraste des Zeugen sind weitgehend erhalten. In der dritten Einheit ist „sie lassen sich von Menschenfurcht bestimmen“ jedoch eine nicht hinreichend abgesicherte Auslegung von „they call in the fears of men“. Da die griechische Prüfung noch aussteht und die Wendung auch im englischen Zeugen ausdrücklich schwierig ist, sollte die Aussage formnäher und offen wiedergegeben werden. Ferner gibt „nachfolgen“ das bildhafte „pursue“ zu schwach wieder.
  naturalness: Der Text ist insgesamt gutes modernes, würdiges Standarddeutsch. „Der Friede wird uns verfolgen“ ist als bewusst auffällige Personifikation verständlich und dem Ausgangstext näher als „nachfolgen“. Die formnähere Wiedergabe der schwierigen Wendung wird durch eine präzise Fußnote abgesichert.
  terminology: „Geschwister“, „Vater“, „Tugend“, „Laster“, „Gottlosigkeit“, „Verheißung“ und „unschuldige Seelen“ sind angemessen. „Doppelt verurteilt werden“ gibt die Aussage ohne zusätzliche dogmatische Ausgestaltung wieder.
  issues:
  - severity: medium
    issue: Interpretierende Wiedergabe der schwierigen Wendung über die Ängste der Menschen
    rationale: „Sie lassen sich von Menschenfurcht bestimmen“ legt eine psychologische Sinnrichtung fest, die weder der vorliegende englische Zeuge noch der noch ungeprüfte griechische Text sicher verlangt. Die Mehrdeutigkeit soll erhalten bleiben.
  - severity: low
    issue: Abschwächung von „peace will pursue us“ durch „nachfolgen“
    rationale: „Nachfolgen“ bedeutet vor allem hinter jemandem hergehen und bewahrt die aktive, paradoxe Verfolgungsmetapher nicht ausreichend.
  revised_text: 'Darum, meine Geschwister, lasst uns den Willen des Vaters tun, der uns berufen hat, damit wir leben. Lasst uns vielmehr nach Tugend streben, das Laster aber als Vorläufer unserer Sünden verlassen, und lasst uns vor der Gottlosigkeit fliehen, damit uns nicht Übel ereilen.


    Denn wenn wir uns eifrig bemühen, Gutes zu tun, wird der Friede uns verfolgen.


    Aus diesem Grund kann ein Mensch das Glück nicht erlangen: Denn sie rufen die Ängste der Menschen herbei und ziehen den Genuss des Gegenwärtigen der Verheißung des Zukünftigen vor.[a]


    Denn sie wissen nicht, welch große Qual der gegenwärtige Genuss mit sich bringt und welche Freude die zukünftige Verheißung bringt.


    Und wenn sie dies wirklich nur für sich selbst täten, wäre es noch erträglich. Nun aber fahren sie fort, unschuldige Seelen das Böse zu lehren. Dabei wissen sie nicht, dass sie doppelt verurteilt werden: sie selbst und ihre Zuhörer.'
  revised_footnotes:
  - marker: a
    text: Der zugrunde liegende englische Zeuge ist an dieser Stelle sprachlich schwierig („they call in the fears of men“). „Sie rufen die Ängste der Menschen herbei“ gibt die Wendung bewusst formnah wieder; ihre genaue Bedeutung muss am griechischen Text geprüft werden.
    reason: Kennzeichnet die erhebliche, noch nicht durch direkte Prüfung der griechischen Vorlage geklärte Übersetzungsunsicherheit und vermeidet eine vorzeitige Auslegung.
