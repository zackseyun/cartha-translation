base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: de
  text: 'Darum wollen wir von ganzem Herzen umkehren, damit keiner von uns auf dem Weg verloren geht. Denn wenn wir den Auftrag empfangen haben, es uns zur Aufgabe zu machen, Menschen von den Götzen wegzuführen und sie zu unterweisen, wie viel schlimmer ist es dann, wenn ein Mensch verloren geht, der Gott bereits kennt!


    Darum wollen wir einander beistehen und auch die Schwachen zum Guten hinaufführen, damit wir alle gerettet werden. Lasst uns einander zur Umkehr führen und ermahnen.


    Wir wollen nicht meinen, wir müssten nur jetzt, solange wir hier sind, aufmerksam sein und glauben. Wenn wir nach Hause gegangen sind, wollen wir uns an die Gebote des Herrn erinnern und uns nicht von unseren weltlichen Begierden in die entgegengesetzte Richtung fortreißen lassen. Vielmehr wollen wir häufiger hierherkommen und danach streben, in den Geboten des Herrn voranzukommen, damit wir alle eines Sinnes sind und zum Leben versammelt werden.


    Denn der Herr sagte: »Ich komme, um alle Völker, Stämme und Sprachen zu versammeln.«[a] Damit spricht er vom Tag seines Erscheinens, wenn er kommen und uns erlösen wird, jeden nach seinen Werken.[b]


    Auch die Ungläubigen werden seine Herrlichkeit und seine Macht sehen. Sie werden erschrecken, wenn sie sehen, dass Jesus das Reich der Welt übergeben wird, und werden sagen: »Wehe uns! Denn du warst da, und wir erkannten es nicht und glaubten nicht; auch gehorchten wir den Ältesten nicht, als sie uns von unserer Rettung erzählten.« Und: »Ihr Wurm wird nicht sterben, und ihr Feuer wird nicht erlöschen; sie werden ein Schauspiel für alles Fleisch sein.«[c]


    Er spricht von jenem Tag des Gerichts, an dem die Menschen diejenigen unter uns sehen werden, die gottlos leben und mit den Geboten Jesu Christi treulos umgegangen sind.


    Wenn aber die Gerechten, die Gutes getan, Qualen ertragen und die Begierden der Seele gehasst haben, diejenigen sehen, die Unrecht getan und Jesus durch ihre Worte oder ihre Taten verleugnet haben und nun mit schweren Qualen im unauslöschlichen Feuer bestraft werden, dann werden sie Gott die Ehre geben und sagen: »Hoffnung gibt es für den, der Gott von ganzem Herzen gedient hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Jesaja 66,18. Der Wortlaut erscheint hier in einer frühchristlichen Zitierform.
    reason: Kennzeichnet die Schriftanspielung, ohne eine vollständige wörtliche Übereinstimmung mit später standardisierten Textformen vorzutäuschen.
  - marker: b
    text: Die Formulierung verbindet hier das Kommen und Erlösen des Herrn unmittelbar mit der Vergeltung eines jeden nach seinen Werken.
    reason: Macht die syntaktisch-theologische Spannung sichtbar, ohne sie im Haupttext aufzulösen.
  - marker: c
    text: Vgl. Jesaja 66,24; die Aussage »sie werden ein Schauspiel für alles Fleisch sein« gehört zur dortigen Gerichtsszene.
    reason: Weist das Schriftzitat und seinen Kontext nach.
lexical_decisions:
- source_word: repent
  choice: umkehren
  rationale: Gibt den ethisch-religiösen Richtungswechsel natürlich und würdig wieder; im weiteren Verlauf ermöglicht »zur Umkehr führen« eine verständliche Wiedergabe des transitiven Ausdrucks.
- source_word: soul
  choice: Mensch
  rationale: Im ersten Vorkommen bezeichnet der Ausdruck die ganze Person, die verloren gehen kann; »Mensch« vermeidet eine unbeabsichtigte Verengung auf einen abtrennbaren Seelenteil.
- source_word: presbyters
  choice: Ältesten
  rationale: Bewahrt die frühchristliche Amts- bzw. Leitungsbezeichnung, ohne eine spätere konfessionelle Amtsstruktur einzutragen.
- source_word: all flesh
  choice: alles Fleisch
  rationale: Erhält die biblische Zitatprägung und den umfassenden, semitisch gefärbten Ausdruck.
- source_word: dealt falsely
  choice: treulos umgegangen
  rationale: Bringt den Gedanken des unredlichen bzw. ungetreuen Umgangs mit den Geboten idiomatisch zum Ausdruck, ohne ihn auf bloßen verbalen Betrug zu reduzieren.
- source_word: pleasures of the soul
  choice: Begierden der Seele
  rationale: Bewahrt die anthropologische Spannung des überlieferten Wortlauts und vermeidet eine harmonisierende Deutung als allgemein körperliche Vergnügungen.
theological_decisions:
- issue: Erlösung und Werke
  choice: »uns erlösen wird, jeden nach seinen Werken«
  alternative: »uns retten wird, wobei jeder nach seinen Werken beurteilt wird«
  rationale: Die enge Verbindung von Erlösung und Vergeltung im überlieferten Satz wird nicht systematisch aufgelöst oder durch eine eingefügte Gerichtsterminologie erklärt.
- issue: Verlorengehen eines Gott kennenden Menschen
  choice: Die Aussage bleibt als reale Warnung formuliert.
  alternative: Als bloß hypothetische Warnung wiedergeben.
  rationale: Der Text selbst setzt die Warnung ohne dogmatische Einschränkung; diese Spannung ist zu bewahren.
- issue: Gerichtsfeuer
  choice: »unauslöschliches Feuer« und »Qualen« werden direkt beibehalten.
  alternative: Metaphorisch abschwächen oder näher auslegen.
  rationale: Die drastische Gerichtssprache gehört zur Aussage des Abschnitts und darf weder entschärft noch konfessionell ausgedeutet werden.
- issue: Gemeinschaftliche Verantwortung
  choice: »einander zur Umkehr führen und ermahnen«
  alternative: Nur »einander ermutigen«
  rationale: Die aktive gegenseitige Zurechtweisung und Umkehrhilfe des Textes wird bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gemeindlich-paränetischem Ton. Die wiederholten Aufforderungen mit »wir wollen« erhalten den gemeinschaftlichen Charakter. Biblisch geprägte Zitate bleiben leicht feierlich. Da kein griechischer Wortlaut mitgeliefert wurde und die direkte Prüfung der griechischen Überlieferung ausdrücklich noch aussteht, ist der Entwurf quellenkritisch vorläufig und folgt dem bereitgestellten öffentlichen englischen Zeugen unter konsultativer Berücksichtigung der englischen POB-Fassung.
