review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen weitgehend zuverlässig. Eine sichere Korrektur ist jedoch bei „solange wir hier sind“ nötig: Der Zeuge unterscheidet das gegenwärtige Hören und Glauben von der Zeit „wenn wir nach Hause gegangen sind“; „solange wir hier sind“ ersetzt diese Zeitangabe. Ferner sollte ψυχή/„soul“ im ersten Satz nicht ohne Not zu „Mensch“ umgedeutet werden. Die direkte Kollation mit dem griechischen Text bleibt erforderlich, da kein griechischer Wortlaut bereitgestellt wurde.'
  naturalness: Der Ton ist überwiegend modernes, würdiges Standarddeutsch. „Lasst uns einander zur Umkehr führen“ ist weniger idiomatisch als „einander zur Umkehr bewegen“. Die Stellung von „alle eines Sinnes“ wird geglättet. „Du warst da“ fügt gegenüber dem Zeugen ein „da“ hinzu und wird daher zurückgenommen.
  terminology: „Seele“, „Älteste“, „alles Fleisch“, „Gebote“, „unauslöschliches Feuer“ und „Begierden der Seele“ bewahren die Terminologie und Bildsprache des Zeugen. Die Fußnote zu Werken wird neutraler gefasst, da „Vergeltung“ als expliziter theologischer Deutungsbegriff über den Wortlaut hinausgeht.
  issues:
  - severity: medium
    issue: „solange wir hier sind“ ersetzt die im englischen Zeugen vorhandene Abfolge „nur jetzt“ / „wenn wir nach Hause gegangen sind“.
    rationale: Die Fassung verändert die zeitliche Aussage statt sie wiederzugeben.
  - severity: medium
    issue: „ein Mensch“ für „a soul“ im ersten Absatz.
    rationale: Die Verallgemeinerung zu „Mensch“ tilgt die ausdrücklich anthropologische Wortwahl, während „Seele“ im Schlussabsatz beibehalten wird.
  - severity: low
    issue: „Du warst da“ und „wir erkannten es nicht“.
    rationale: Das hinzugefügte „da“ sowie das sachliche „es“ sind im Zeugen nicht angelegt; die Anrede sollte auch im Deutschen durchgehalten werden.
  - severity: low
    issue: Fußnote b spricht von „Vergeltung“.
    rationale: Der Zeuge nennt „jeden nach seinen Werken“, erklärt dies aber nicht ausdrücklich als Vergeltung; die Anmerkung sollte diese Deutung nicht festschreiben.
