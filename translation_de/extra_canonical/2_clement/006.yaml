base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: de
  text: 'Doch der Herr sagt: »Kein Diener kann zwei Herren dienen.«[a] Wenn wir sowohl Gott als auch dem Mammon dienen wollen, bringt uns das keinen Nutzen.


    Denn welchen Gewinn hat ein Mensch, wenn er die ganze Welt gewinnt, dabei aber sein Leben einbüßt?[b]


    Die gegenwärtige Weltzeit und die künftige sind zwei Feinde.


    Die eine redet von Ehebruch, Unreinheit, Habgier und Betrug; die andere aber sagt sich von diesen Dingen los.


    Darum können wir nicht mit beiden befreundet sein. Wir müssen uns von der einen lossagen und uns an die andere halten.


    Bedenken wir: Es ist besser, die Dinge hier zu hassen, denn sie sind gering, vergänglich und nur von kurzer Dauer, und die Dinge dort zu lieben, denn sie sind gut und unvergänglich.


    Denn wenn wir den Willen Christi tun, werden wir Ruhe finden. Wenn wir aber seinen Geboten nicht gehorchen, wird uns nichts vor der ewigen Strafe retten.


    Auch die Schrift sagt bei Ezechiel: »Selbst wenn Noah, Hiob und Daniel aufständen, würden sie ihre Kinder in der Gefangenschaft nicht retten.«[c]


    Wenn aber selbst solche Gerechten ihre Kinder nicht durch ihre gerechten Taten retten können, mit welcher Zuversicht werden dann wir in das Reich Gottes hineinkommen, wenn wir unsere Taufe nicht rein und unbefleckt bewahren? Oder wer wird für uns eintreten, wenn sich nicht zeigt, dass wir heilige und gerechte Werke getan haben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Matthäus 6,24; Lukas 16,13.
    reason: Kennzeichnet das angeführte Herrenwort.
  - marker: b
    text: Vgl. Matthäus 16,26; Markus 8,36; Lukas 9,25. Das hier mit »Leben« wiedergegebene Wort kann auch »Seele« bedeuten.
    reason: Weist die Schriftanspielung und die echte lexikalische Mehrdeutigkeit aus.
  - marker: c
    text: Vgl. Ezechiel 14,14.20. Die hier zitierte Fassung weicht in Einzelheiten von den geläufigen Textformen des Ezechielbuches ab.
    reason: Das Zitat nennt drei Gerechte und ihre fehlende Fähigkeit, andere zu retten; zugleich soll die auffällige Formulierung »aufständen« und »Kinder in der Gefangenschaft« nicht stillschweigend an eine moderne Bibelübersetzung angeglichen werden.
lexical_decisions:
- source_word: mammon
  choice: Mammon
  rationale: Der traditionelle Ausdruck bewahrt die personifizierende Kraft des Herrenwortes und bezeichnet Besitz beziehungsweise Reichtum als konkurrierenden Herrn.
- source_word: soul
  choice: Leben
  rationale: Im zitierten Herrenwort kann psychē sowohl »Seele« als auch »Leben« bezeichnen. »Leben« gibt den Verlust der eigenen Existenz natürlich wieder; die Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: this age and the future
  choice: die gegenwärtige Weltzeit und die künftige
  rationale: »Weltzeit« vermittelt den zeitlich-eschatologischen Gegensatz besser als das im Deutschen missverständliche »Zeitalter« und ergänzt nicht unnötig »Welt« als räumlichen Begriff.
- source_word: hold companionship with
  choice: uns an ... halten
  rationale: Natürliches modernes Deutsch, das dauerhafte Zugehörigkeit und Verbundenheit ausdrückt.
- source_word: rest
  choice: Ruhe
  rationale: Bewahrt den theologischen Resonanzraum des Ausdrucks, ohne ihn näher als Heil, Frieden oder ewige Seligkeit festzulegen.
- source_word: advocate
  choice: für uns eintreten
  rationale: Vermeidet eine unnötig juristische Verengung auf »Anwalt« und gibt die Fürsprache idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Werken, Taufe und Eintritt in das Reich Gottes
  choice: Die konditional-mahnende Aussage wird ohne systematische Abschwächung wiedergegeben.
  alternative: Die Werke lediglich als nachträglichen Beweis eines unabhängig davon sicheren Heils darstellen.
  rationale: Der Abschnitt verbindet ausdrücklich die bewahrte Taufe und heilige, gerechte Werke mit der Zuversicht auf den Eintritt in Gottes Reich. Die Übersetzung soll diese Spannung bewahren, ohne eine konfessionelle Heilslehre einzutragen.
- issue: »Wille Christi«
  choice: Christi wird als Bezugsperson unverändert beibehalten.
  alternative: »Wille Gottes« als vermeintlich geläufigere Formulierung.
  rationale: Die überlieferte Aussage nennt Christus; eine Harmonisierung würde den christologischen Akzent verändern.
- issue: Ewige Strafe
  choice: »ewige Strafe«
  alternative: »Strafe der kommenden Weltzeit« oder eine zeitlich abgeschwächte Wiedergabe.
  rationale: Die vorliegende Zeugnisgrundlage bietet ausdrücklich »eternal punishment«; mangels direkter griechischer Prüfung wird die klare Aussage weder abgeschwächt noch weiter dogmatisch ausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer paränetischer Kraft. Die antithetische Struktur und die wiederholten Bilder des Lossagens, Dienens und Rettens bleiben erhalten. Da die bereitgestellte Grundlage ein englischer gemeinfreier Zeuge ist und die direkte Prüfung des griechischen Textes noch aussteht, werden textkritisch oder lexikalisch unsichere Einzelheiten nicht überpräzisiert.
