  naturalness: Modernes Standarddeutsch, klar und würdig. Die kleine Anpassung im Schlusssatz ist idiomatischer und vermeidet zugleich die unnötige zeitliche Festlegung auf bereits vollbrachte Werke.
  terminology: „Mammon“, „Weltzeit“, „Ruhe“, „ewige Strafe“, „Taufe“ und „Reich Gottes“ sind angemessen und konsistent. Die Fußnoten markieren die Schriftbezüge sowie die lexikalische Offenheit von „Leben/Seele“ sachgerecht.
