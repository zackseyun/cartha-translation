base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: de
  text: '**2. Clemens 15**


    **1** Ich meine nun, keinen unbedeutenden Rat zur Selbstbeherrschung gegeben zu haben. Wer ihn befolgt, wird es nicht bereuen, sondern sowohl sich selbst als auch mich retten, der ihm diesen Rat gegeben hat. Denn es ist kein geringer Lohn, eine umherirrende und zugrunde gehende Seele zur Umkehr zu bringen, damit sie gerettet wird.


    **2** Denn dies ist die Gegengabe, die wir Gott, unserem Schöpfer, geben können: wenn sowohl der Redende als auch der Hörende mit Glauben und Liebe reden und hören.


    **3** Bleiben wir also bei dem, was wir geglaubt haben, in Gerechtigkeit und Heiligkeit, damit wir Gott freimütig bitten können. Er sagt: »Noch während du redest, werde ich sagen: Sieh, ich bin da.«[a]


    **4** Dieses Wort ist nämlich ein Zeichen einer großen Verheißung. Denn der Herr sagt von sich selbst, er sei eher zum Geben bereit als der Bittende zum Bitten.


    **5** Da wir nun an so großer Güte Anteil haben, wollen wir es uns nicht missgönnen, so viele gute Dinge zu erlangen. Denn ebenso groß wie die Freude ist, die diese Dinge denen bringen, die sie getan haben, ebenso groß ist auch das Verdammungsurteil, das sie denen bringen, die ungehorsam gewesen sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Jesaja 58,9; die hier gebotene Form des Zitats entspricht nicht in allen Einzelheiten dem Wortlaut heutiger Ausgaben des Jesajabuchs.
    reason: Kennzeichnet den Schriftbezug und bewahrt die erkennbare Zitatform des frühchristlichen Autors, ohne sie an eine moderne Bibelübersetzung anzugleichen.
lexical_decisions:
- source_word: ἐγκράτεια
  choice: Selbstbeherrschung
  rationale: Der Ausdruck bezeichnet beherrschtes, enthaltsames Verhalten. „Selbstbeherrschung“ ist im modernen Deutsch verständlich und lässt den konkreten Umfang im Kontext offen.
- source_word: συμβουλία
  choice: Rat
  rationale: Das natürliche deutsche Wort gibt eine ernsthafte Ermahnung bzw. Empfehlung wieder, ohne sie zu einem formellen Gebot zu verschärfen.
- source_word: ἐπιστρέψαι
  choice: zur Umkehr bringen
  rationale: Das Verb meint ein Wenden oder Zurückführen; im Zusammenhang einer gefährdeten Seele trägt „zur Umkehr bringen“ die ethische und geistliche Bedeutung.
- source_word: ἀντιμισθία
  choice: Gegengabe
  rationale: Bewahrt den Gedanken einer erwidernden Leistung oder Vergeltung gegenüber Gottes Schöpferhandeln, ohne einen käuflichen Ausgleich anzudeuten.
- source_word: μετὰ παρρησίας αἰτῶμεν
  choice: freimütig bitten können
  rationale: Gibt sowohl die Offenheit bzw. Zuversicht von παρρησία als auch das im griechischen Wortlaut erkennbare Verb „bitten“ wieder.
- source_word: κατάκρισις
  choice: Verdammungsurteil
  rationale: Der Ausdruck bezeichnet nicht bloß Kritik, sondern ein verurteilendes Gericht; die starke Aussage des Textes bleibt erhalten.
- source_word: παρακούω
  choice: nicht auf … hören
  rationale: Gibt die Verbindung von Nichtbeachten und Ungehorsam idiomatisch wieder, ohne die Bedeutung einseitig auf bloßes akustisches Hören zu reduzieren.
theological_decisions:
- issue: Der Ratgeber sagt, der Befolgende werde sowohl sich selbst als auch den Ratgeber retten.
  choice: Die Aussage wird unmittelbar mit „retten“ wiedergegeben.
  alternative: „zum Heil beitragen“ oder „bewahren“
  rationale: Die zugespitzte soteriologische Formulierung des Textes soll nicht durch eine erklärende Abschwächung aufgelöst werden.
- issue: Das Verhältnis von menschlichem Reden und Hören zu einer „Gegengabe“ an Gott
  choice: Die Bedingung wird als Aufforderung an Redenden und Hörenden formuliert.
  alternative: Eine streng konditionale Satzform mit „wenn“
  rationale: Der Sinn bleibt konditional, während die deutsche Form den paränetischen Charakter klar und natürlich ausdrückt; sie behauptet keine Gleichwertigkeit menschlicher Leistung mit Gottes Schöpfungsgabe.
- issue: Freimütigkeit gegenüber Gott
  choice: „damit wir Gott freimütig bitten können“
  alternative: „damit wir freimütig vor Gott sein können“
  rationale: Der griechische Wortlaut enthält nach der überlieferten Form das Bitten; dies ist theologisch bedeutsam und passt zur anschließenden Aussage über Gottes Bereitschaft zu geben.
- issue: Gericht über die Ungehorsamen
  choice: „Verdammungsurteil“
  alternative: „Verurteilung“
  rationale: Die Schärfe von κατάκρισις wird bewahrt, ohne näher festzulegen, wie dieses Gericht dogmatisch zu systematisieren ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Tonlage. Satzbau und Wortwahl wurden geglättet, ohne die Spannungen des Textes – insbesondere das Retten des Ratgebers, die menschliche Gegengabe und das Verdammungsurteil – abzuschwächen. Die Übersetzung folgt soweit rekonstruierbar dem griechischen Wortlaut und korrigiert dabei die englische Wiedergabe von 15,3, die das Verb „bitten“ ausließ.
