base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: de
  text: '**2. Clemens 1**


    Geschwister, wir müssen von Jesus Christus so denken wie von Gott, wie vom Richter der Lebenden und der Toten.[a]


    Wir dürfen auch von unserer Rettung nicht gering denken. Denn wenn wir gering von ihm denken, erwarten wir auch, nur Geringes zu empfangen. Wer zuhört, als ginge es um unbedeutende Dinge, sündigt; und auch wir sündigen, wenn wir nicht erkennen, woher wir berufen wurden, von wem und an welchen Ort – und was Jesus Christus alles um unseretwillen zu erleiden auf sich nahm.


    Welche Gegengabe sollen wir ihm nun geben? Oder welche Frucht wäre der Gabe würdig, die er selbst uns gegeben hat? Und wie viel Heiliges schulden wir ihm![b]


    Denn er schenkte uns das Licht; wie ein Vater redete er uns als seine Söhne an; als wir verloren gingen, rettete er uns.


    Welches Lob sollen wir ihm nun darbringen? Oder wie könnten wir vergelten, was wir empfangen haben?


    Wir waren in unserem Denken verstümmelt und beteten Steine und Holz, Gold und Silber und Bronze an – Werke von Menschen. Unser ganzes Leben war nichts anderes als Tod. Während wir so von Finsternis umgeben waren und dichter Nebel unsere Sicht erfüllte, wurden unsere Augen wieder geöffnet: Durch seinen Willen legten wir die Wolke ab, die uns umhüllte.


    Denn er erbarmte sich über uns und rettete uns aus tiefstem Mitgefühl. Er sah, wie sehr wir in die Irre gegangen und dem Verderben verfallen waren, obwohl wir keine Hoffnung auf Rettung hatten außer der, die von ihm kam.


    Denn er berief uns, als wir nicht waren, und wollte, dass wir aus dem Nichtsein ins Dasein kamen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wir müssen über Jesus Christus so denken wie über Gott, wie über den Richter der Lebenden und der Toten.“ Die Aussage wird weder abgeschwächt noch weiter dogmatisch ausgedeutet.'
    reason: Die ungewöhnlich starke christologische Aussage und die Vergleichskonstruktion sollen transparent bleiben.
  - marker: b
    text: 'Die griechische Wendung ist ungewöhnlich und lautet wörtlich etwa: „Wie viel Heiliges schulden wir ihm!“ Gemeint sein können heilige Pflichten oder Wohltaten beziehungsweise Gnadenerweise.'
    reason: Die lexikalische und möglicherweise textgeschichtliche Schwierigkeit darf nicht durch eine einzige sichere Deutung verdeckt werden.
  - marker: c
    text: 'Wörtlich: „Er berief uns, die wir nicht waren, und wollte, dass wir aus dem Nichtsein seien.“ Ob dies Schöpfung, neue Existenz durch die Berufung oder den früheren Zustand der Angesprochenen bezeichnet, bleibt offen.'
    reason: Die existentielle und heilsgeschichtliche Mehrdeutigkeit des Satzes wird bewahrt.
lexical_decisions:
- source_word: φρονεῖν
  choice: denken
  rationale: Das Verb bezeichnet hier die innere Einschätzung beziehungsweise Auffassung. „Denken“ erhält die wiederholte Gedankenführung des Abschnitts, ohne sie auf bloße Meinung oder Verehrung zu verengen.
- source_word: μικρὰ φρονεῖν
  choice: gering denken
  rationale: Die bewusst wiederholte Formulierung wahrt den Kontrast zwischen der Größe der Rettung und einer unangemessen niedrigen Einschätzung.
- source_word: ἀντιμισθία
  choice: Gegengabe / vergelten
  rationale: Das Wort bezeichnet eine erwidernde Leistung oder Entlohnung. Im Deutschen wird es je nach Satzbau mit „Gegengabe“ und verbal mit „vergelten“ natürlich wiedergegeben.
- source_word: ὅσια
  choice: Heiliges
  rationale: Die schwierige substantivische Form wird nicht vorschnell als „Gnadenerweise“ oder „Pflichten“ festgelegt. „Heiliges“ bewahrt die ungewöhnliche Ausdrucksweise; eine Fußnote erläutert die möglichen Sinnrichtungen.
- source_word: πηροὶ τῇ διανοίᾳ
  choice: in unserem Denken verstümmelt
  rationale: Die starke körperliche Metapher des Ausgangstextes wird beibehalten und auf den Verstand beziehungsweise das Denken bezogen.
- source_word: ἀνεβλέψαμεν
  choice: unsere Augen wurden wieder geöffnet
  rationale: Das Verb kann das Wiedererlangen der Sehkraft oder das Aufblicken bezeichnen. Im Bildzusammenhang von Finsternis, Nebel und eingeschränkter Sicht steht das Sehenkönnen im Vordergrund.
- source_word: οὐκ ὄντας / ἐκ μὴ ὄντος εἶναι
  choice: als wir nicht waren / aus dem Nichtsein ins Dasein
  rationale: Die auffällige Seins-Sprache wird formal bewahrt, statt sie ausschließlich als Bekehrung, Schöpfung oder Berufung der Völker auszulegen.
theological_decisions:
- issue: Jesus Christus wird wie Gott betrachtet
  choice: „von Jesus Christus so denken wie von Gott“
  alternative: „Jesus Christus für Gott halten“ oder eine abgeschwächte Ehrenformel
  rationale: Die Vergleichskonstruktion des griechischen Satzes wird erhalten. Weder wird die Aussage abgeschwächt noch über ihre genaue Syntax hinaus dogmatisch präzisiert.
- issue: Bezug von „ihm“ beim geringen Denken
  choice: Bezug auf Jesus Christus
  alternative: Bezug auf die Rettung
  rationale: Das griechische maskuline Pronomen αὐτοῦ verweist grammatisch am ehesten auf Christus; „Rettung“ ist im Griechischen feminin. Der enge Zusammenhang zwischen Christus und der Rettung bleibt dennoch bestehen.
- issue: Aussage vom Nichtsein zum Sein
  choice: wörtlich-existenzielle Formulierung beibehalten
  alternative: ausschließlich als Heidenberufung, Neuschöpfung oder ursprüngliche Erschaffung erklären
  rationale: Der Text selbst lässt offen, auf welcher Ebene das Nichtsein gemeint ist. Die Übersetzung erhält diese theologische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Satzbau. „Geschwister“ gibt die gemeinschaftliche Anrede inklusiv und gegenwärtig wieder. Kräftige Bilder wie „verstümmelt“, „Tod“, „Nebel“ und „Verderben“ bleiben erhalten. Die rhetorischen Fragen und Wiederholungen des homiletischen Stils werden nicht geglättet.
