base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: de
  text: 'Darum, Geschwister, lasst uns unverzüglich umkehren. Lasst uns uns nüchtern dem Guten zuwenden; denn wir sind voller Torheit und Bosheit. Lasst uns unsere früheren Sünden ablegen und uns nicht als Menschen erweisen, die anderen gefallen wollen. Wir sollen nicht danach streben, nur einander zu gefallen, sondern durch unser gerechtes Leben auch den Außenstehenden, damit der Name nicht unseretwegen gelästert wird.


    Denn der Herr sagt: „Auf jede Weise wird mein Name unter allen Völkern gelästert.“ Und an anderer Stelle: „Wehe dem, durch den mein Name gelästert wird!“ Wodurch wird er gelästert? Dadurch, dass ihr nicht tut, was ich will.


    Wenn nämlich die Völker aus unserem Mund die Aussprüche Gottes hören, staunen sie über deren Schönheit und Größe. Wenn sie dann aber feststellen, dass unsere Taten den Worten, die wir sprechen, nicht entsprechen, beginnen sie sogleich zu lästern und sagen, das sei eine leere Geschichte und ein Trugbild.


    Denn sie hören von uns, dass Gott sagt: „Es ist kein Verdienst für euch, wenn ihr die liebt, die euch lieben. Ein Verdienst ist es vielmehr, wenn ihr eure Feinde und die liebt, die euch hassen.“ Wenn sie das hören, sage ich, staunen sie über die außerordentliche Güte dieser Worte. Wenn sie aber sehen, dass wir nicht nur diejenigen nicht lieben, die uns hassen, sondern nicht einmal diejenigen, die uns lieben,[a] machen sie sich über uns lustig, und der Name wird gelästert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der gelieferte englische Text ist an dieser Stelle unvollständig („we not only do not love us“). Die Übersetzung folgt der in der griechischen Überlieferung bezeugten vollständigen Gegenüberstellung: Wir lieben weder die, die uns hassen, noch die, die uns lieben.'
    reason: Transparenz über einen offenkundigen Ausfall beziehungsweise eine Verstümmelung im bereitgestellten englischen Zeugen und die vorsichtige Wiederherstellung anhand der angegebenen griechischen Überlieferung.
lexical_decisions:
- source_word: brethren
  choice: Geschwister
  rationale: Eine natürliche, inklusive Anrede im modernen Standarddeutsch, ohne den gemeinschaftlichen Charakter des Ausdrucks abzuschwächen.
- source_word: repent
  choice: umkehren
  rationale: Gibt die ethisch-religiöse Sinnes- und Lebensänderung wieder und klingt im Deutschen weniger formelhaft als „Buße tun“.
- source_word: be sober unto that which is good
  choice: uns nüchtern dem Guten zuwenden
  rationale: Bewahrt das Bild geistiger Nüchternheit und formuliert zugleich verständlich die Ausrichtung auf das Gute.
- source_word: men pleasers
  choice: Menschen …, die anderen gefallen wollen
  rationale: Vermeidet das heute missverständliche wörtliche „Menschengefällige“ und erhält die Kritik an einem vom Beifall anderer bestimmten Verhalten.
- source_word: those … without
  choice: die Außenstehenden
  rationale: Bezeichnet verständlich Menschen außerhalb der christlichen Gemeinschaft, ohne sie abwertend darzustellen.
- source_word: oracles of God
  choice: Aussprüche Gottes
  rationale: Bewahrt den Sinn autoritativer göttlicher Worte, ohne das im heutigen Deutsch anders konnotierte Wort „Orakel“ zu verwenden.
- source_word: thank / credit
  choice: Verdienst
  rationale: Gibt den Kontrast des überlieferten englischen Zeugen idiomatisch wieder; „Dank“ wäre im modernen Deutsch an dieser Stelle unklar.
- source_word: the Name
  choice: der Name
  rationale: Die markierte Großschreibung und die bestimmte Form bewahren den ehrfürchtigen Bezug auf Gottes Namen.
theological_decisions:
- issue: Bezug von „der Name“
  choice: Die verkürzte Bezeichnung „der Name“ wird beibehalten.
  alternative: Explizit „Gottes Name“ einsetzen.
  rationale: Die Vorlage verwendet die ehrfürchtige Kurzform; eine Explizierung wäre verständlicher, würde aber die Ausdrucksweise und intertextuelle Spannung glätten.
- issue: Charakter der geforderten Liebe
  choice: „eure Feinde und die …, die euch hassen“
  alternative: Die beiden Gruppen zu „eure Feinde“ zusammenziehen.
  rationale: Die parallelen Bezeichnungen werden erhalten, damit die rhetorische Steigerung und die Nähe zur Jesusüberlieferung sichtbar bleiben.
- issue: Wirkung des gerechten Lebens auf Außenstehende
  choice: „durch unser gerechtes Leben auch den Außenstehenden [gefallen]“
  alternative: 'Freier: „auch bei den Außenstehenden Anerkennung finden“ oder „ihnen ein gutes Zeugnis geben“.'
  rationale: Die ungewöhnliche Spannung zwischen Menschengefälligkeit und einem glaubwürdigen Verhalten gegenüber Außenstehenden soll nicht durch eine theologische Harmonisierung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzstrukturen und hörbarer Mahnrede. Die wiederholten Aufforderungen und der Wechsel zwischen Zitat, Frage und Erklärung bleiben erhalten. Da keine vollständige griechische Transkription mitgeliefert wurde und die direkte Quellenprüfung als ausstehend bezeichnet ist, orientiert sich der Entwurf eng am öffentlichen englischen Zeugen; nur die offenkundig beschädigte Schlusskonstruktion wird transparent gekennzeichnet ergänzt.
