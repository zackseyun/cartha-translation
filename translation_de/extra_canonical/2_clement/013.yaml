review_pass:
  verdict: revise
  source_fidelity: Die Mahnrede, die Zitate, die Abfolge der Argumentation und die wesentlichen Begriffe sind überwiegend treffend wiedergegeben. Die in der englischen Prüfspur ausdrücklich als unvollständig ausgewiesene Schlusskonstruktion darf jedoch ohne vorliegende griechische Lesung nicht zu einer vollständigen antithetischen Aussage ergänzt werden. Die Behauptung, diese Ergänzung sei in der griechischen Überlieferung bezeugt, ist anhand des bereitgestellten Materials nicht überprüfbar.
  naturalness: 'Der Text ist insgesamt modernes, würdiges Standarddeutsch. Einzelne Formulierungen werden gestrafft: „im Blick auf das Gute nüchtern sein“ ist idiomatischer als „uns nüchtern dem Guten zuwenden“; „den Worten nicht würdig sind“ bewahrt zudem die Wertung der Vorlage besser als bloßes „nicht entsprechen“.'
  terminology: „Geschwister“, „umkehren“, „Außenstehende“, „Aussprüche Gottes“ und die ehrfürchtige Kurzform „der Name“ sind angemessen. „Verdienst“ ist als Wiedergabe des im Zeugen wiedergegebenen Kontrasts vertretbar. Die beschädigte Schlussstelle wird nicht theologisch oder textkritisch harmonisiert.
  issues:
  - severity: high
    issue: Konjekturale Vervollständigung der beschädigten Schlusskonstruktion
    rationale: Der englische POB-Audit-Trail verlangt ausdrücklich, „we not only do not love us“ ohne konjekturale Wiederherstellung zu bewahren. Der Entwurf ergänzt hingegen zwei Objektgruppen und eine vollständige Gegenüberstellung. Ohne direkt geprüften griechischen Text ist dies nicht sicher.
  - severity: medium
    issue: Nicht belegbare Aussage in Fußnote a
    rationale: Die Fußnote erklärt die Ergänzung als durch die griechische Überlieferung bezeugt, während der Aufgabenrahmen die direkte griechische Quellenprüfung als ausstehend ausweist und keinen griechischen Wortlaut liefert.
  - severity: low
    issue: Leichte stilistische und semantische Glättungen
    rationale: Einige Anpassungen verbessern den modernen deutschen Lesefluss und erhalten Nuancen wie „würdig“ und die paränetische Aufforderungsform genauer.
  revised_text: 'Darum, Geschwister, lasst uns unverzüglich umkehren. Lasst uns im Blick auf das Gute nüchtern sein; denn wir sind voller Torheit und Bosheit. Lasst uns unsere früheren Sünden tilgen und uns nicht als Menschen erweisen, die anderen gefallen wollen. Lasst uns nicht danach streben, nur einander zu gefallen, sondern auch den Außenstehenden durch unser gerechtes Leben, damit der Name nicht unseretwegen gelästert wird.


    Denn der Herr sagt: „Auf jede Weise wird mein Name unter allen Völkern gelästert.“ Und an anderer Stelle: „Wehe dem, durch den mein Name gelästert wird!“ Worin wird er gelästert? Darin, dass ihr nicht tut, was ich will.


    Wenn nämlich die Völker aus unserem Mund die Aussprüche Gottes hören, staunen sie über deren Schönheit und Größe. Wenn sie dann aber feststellen, dass unsere Taten der Worte, die wir sprechen, nicht würdig sind, beginnen sie sogleich zu lästern und sagen, das sei eine leere Geschichte und ein Trugbild.


    Denn wenn sie von uns hören, dass Gott sagt: „Es ist kein Verdienst für euch, wenn ihr die liebt, die euch lieben. Ein Verdienst ist es vielmehr, wenn ihr eure Feinde und die liebt, die euch hassen“, dann, sage ich, staunen sie über deren außerordentliche Güte. Wenn sie aber sehen, dass wir nicht nur uns nicht lieben …[a], machen sie sich über uns lustig, und der Name wird gelästert.'
