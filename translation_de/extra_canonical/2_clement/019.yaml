base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: de
  text: '**2. Clemens 19**


    Darum, Brüder und Schwestern: Nachdem der Gott der Wahrheit gehört worden ist,[a] lese ich euch eine Ermahnung vor, damit ihr auf das Geschriebene achtet. So könnt ihr sowohl euch selbst retten als auch den, der in eurer Mitte vorliest.[b] Denn als Lohn erbitte ich von euch, dass ihr von ganzem Herzen umkehrt und euch selbst Rettung und Leben schenkt.[c] Wenn wir das tun, geben wir allen jungen Menschen, die sich eifrig um Gottesfurcht und um die Güte Gottes bemühen wollen, ein Ziel vor.[d]


    Lasst uns, unverständig wie wir sind, nicht ungehalten sein und uns nicht ärgern, wenn uns jemand zurechtweist und von der Ungerechtigkeit zur Gerechtigkeit führt. Denn manchmal tun wir Böses, ohne es zu erkennen, weil Zwiespalt und Unglaube in unserer Brust wohnen; und unsere nichtigen Begierden verfinstern unseren Verstand.


    Lasst uns also Gerechtigkeit üben, damit wir bis ans Ende gerettet werden. Glücklich sind alle, die diesen Anordnungen gehorchen. Auch wenn sie in dieser Welt kurze Zeit leiden, werden sie die unvergängliche Frucht der Auferstehung ernten.


    Darum soll ein gottesfürchtiger Mensch nicht traurig sein, wenn er in der gegenwärtigen Zeit Not leidet. Eine glückliche Zeit erwartet ihn: Er wird droben bei unseren Vätern wieder zum Leben kommen und sich in einer Ewigkeit ohne Leid freuen.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. nach der überlieferten Formulierung: „nachdem der Gott der Wahrheit gehört worden ist“. Der knappe Ausdruck ist schwer verständlich; möglicherweise ist das vorherige Hören einer Lesung oder Verkündigung über Gott gemeint.'
    reason: Die Ausgangsformulierung ist syntaktisch und inhaltlich ungewöhnlich; ihre Mehrdeutigkeit soll sichtbar bleiben.
  - marker: b
    text: Gemeint ist vermutlich der öffentliche Vorleser in der versammelten Gemeinde.
    reason: Der antike Vortragssituationsbezug ist heutigen Lesenden nicht selbstverständlich.
  - marker: c
    text: Der Text formuliert zugespitzt, dass die Angesprochenen sich selbst Rettung und Leben schenken. Diese Formulierung wird nicht zu einer passiven Aussage umgedeutet.
    reason: Bewahrt die theologische Spannung und die rhetorische Dringlichkeit des Textes.
  - marker: d
    text: 'Oder: „ein Vorbild geben“. Das zugrunde liegende Wort kann einen Zielpunkt oder ein richtungweisendes Beispiel bezeichnen.'
    reason: Dokumentiert eine echte lexikalische Alternative.
  - marker: e
    text: 'Wörtlicher: „Nachdem er droben mit den Vätern wieder aufgelebt ist, wird er sich an der leidfreien Ewigkeit freuen.“'
    reason: Zeigt die verdichtete eschatologische Bildsprache und vermeidet, dass die flüssigere Haupttextfassung als einzig mögliche Analyse erscheint.
lexical_decisions:
- source_word: ἔντευξις (indirectly attested in the supplied witness)
  choice: Ermahnung
  rationale: In diesem homiletischen Zusammenhang bezeichnet das Wort einen eindringlichen Aufruf; „Ermahnung“ ist natürlich und entspricht der Funktion des vorgelesenen Textes.
- source_word: μετανοῆσαι
  choice: umkehrt
  rationale: „Umkehren“ gibt die ethisch-religiöse Neuorientierung wieder und ist im modernen Deutsch klarer als das enger klingende „Buße tun“.
- source_word: σκοπός
  choice: ein Ziel
  rationale: Bewahrt das Bild eines vor Augen gestellten Zielpunkts; „Vorbild“ wäre möglich, würde das Bild aber stärker interpretieren.
- source_word: διψυχία
  choice: Zwiespalt
  rationale: Bezeichnet ein inneres Geteiltsein bzw. Schwanken. „Zwiespalt“ bewahrt diesen Sinn, ohne eine moderne psychologische Diagnose einzutragen.
- source_word: εὐσέβεια / εὐσεβής
  choice: Gottesfurcht / gottesfürchtig
  rationale: Gibt die auf Gott ausgerichtete Frömmigkeit in allgemein verständlicher, würdiger Sprache wieder; „Frömmigkeit“ wäre ebenfalls möglich.
- source_word: ἀθάνατος
  choice: unvergänglich
  rationale: Bei der „Frucht der Auferstehung“ ist „unvergänglich“ idiomatischer als „unsterblich“ und bewahrt den Gegensatz zur vergänglichen gegenwärtigen Not.
- source_word: ἀναβιώσας
  choice: wieder zum Leben kommen
  rationale: Gibt den Auferstehungs- bzw. Wiederbelebungssinn direkt wieder, ohne die Aussage weiter dogmatisch auszugestalten.
theological_decisions:
- issue: Menschliche Mitwirkung an Rettung und Leben
  choice: „euch selbst retten“ und „euch selbst Rettung und Leben schenken“
  alternative: 'Abschwächend: „zu eurer Rettung beitragen“ oder passivisch „Rettung empfangen“'
  rationale: Die zugespitzte Aufforderung des Textes wird bewahrt. Sie wird nicht durch ein späteres theologisches System harmonisiert oder abgeschwächt.
- issue: Rettung „bis ans Ende“
  choice: „damit wir bis ans Ende gerettet werden“
  alternative: „damit wir schließlich gerettet werden“
  rationale: Die zeitliche und beharrungsbezogene Spannung der Formulierung bleibt erhalten; „schließlich“ könnte ausschließlich das Endergebnis betonen.
- issue: Auferstehung und Leben bei den Vätern
  choice: „droben bei unseren Vätern wieder zum Leben kommen“
  alternative: „im Himmel mit unseren Vätern wieder leben“
  rationale: „Droben“ hält sich näher an die räumliche Aussage, während „im Himmel“ diese ausdrücklich identifizieren würde. Die Verbindung von Wiederaufleben und Gemeinschaft mit den Vätern bleibt bestehen.
- issue: Aussage über eine leidfreie Ewigkeit
  choice: „in einer Ewigkeit ohne Leid“
  alternative: „für immer ohne Trauer“
  rationale: Bewahrt sowohl die Dauer als auch die Abwesenheit von Leid, ohne die eschatologische Aussage näher zu systematisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemeindlicher Vorlesbarkeit. Inklusive Anrede „Brüder und Schwestern“ folgt der ausdrücklich doppelten Anrede. Archaismen werden vermieden; zentrale frühchristliche Begriffe und die teils zugespitzte Heilsrhetorik bleiben erhalten. Da die bereitgestellte Datengrundlage selbst eine direkte Prüfung des griechischen Textes als noch ausstehend bezeichnet, werden besonders unsichere oder mehrdeutige Stellen durch Fußnoten kenntlich gemacht.
