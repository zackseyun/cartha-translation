  - severity: low
    issue: „Glücklich“ für die Seligpreisung
    rationale: „Selig“ ist im modernen religiösen Deutsch weiterhin verständlich und gibt den formelhaften, über bloßes momentanes Glück hinausgehenden Charakter von „Blessed“ präziser wieder.
  - severity: low
    issue: „Anordnungen“ klingt unnötig verwaltungssprachlich
    rationale: „Bestimmungen“ bewahrt den normativen Sinn von „ordinances“ und ist im paränetischen Kontext natürlicher.
