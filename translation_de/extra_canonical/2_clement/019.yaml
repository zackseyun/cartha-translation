  naturalness: 'Der Text ist gut vorlesbares modernes Standarddeutsch. Kleine Anpassungen erhöhen die idiomatische Präzision und wahren zugleich den religiös-mahnenden Registerton: „selig“ entspricht hier besser der traditionellen Seligpreisungsformel als rein psychologisches „glücklich“, und „Bestimmungen“ ist für „ordinances“ weniger administrativ als „Anordnungen“.'
  terminology: „Umkehren“, „Gerechtigkeit“, „Rettung“, „Auferstehung“ und „gottesfürchtig“ sind konsistent und sachgerecht. „Eifrig“ bei „sich bemühen“ fügt eine Nuance hinzu, die der englische Zeuge nicht ausdrücklich enthält, und wird daher entfernt. Die Fußnote zu „Ziel“ erhält die lexikalische Alternative „Vorbild“, ohne sie im Haupttext zu erzwingen.
