base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: de
  text: '**2. Clemens 7**


    Darum, meine Brüder, lasst uns kämpfen. Wir wissen ja, dass der Wettkampf unmittelbar bevorsteht. Zu den vergänglichen Wettkämpfen treten zwar viele an, doch nicht alle erhalten den Siegeskranz, sondern nur diejenigen, die sich mühevoll eingesetzt und tapfer gekämpft haben.


    Lasst uns also kämpfen, damit wir alle den Siegeskranz erhalten.


    Darum lasst uns auf der geraden Bahn im unvergänglichen Wettkampf laufen. Lasst uns in großer Zahl zu ihm antreten und kämpfen, damit auch wir den Siegeskranz erhalten. Und wenn wir nicht alle den Siegeskranz erhalten können, so lasst uns ihm wenigstens nahekommen.


    Wir müssen wissen: Wenn jemand, der an einem vergänglichen Wettkampf teilnimmt, dabei des Betrugs überführt wird, dann wird er zuerst ausgepeitscht, anschließend ausgeschlossen und aus der Wettkampfstätte hinausgetrieben.


    Was meint ihr? Was wird mit dem geschehen, der im unvergänglichen Wettkampf betrügerisch handelt?


    Denn über diejenigen, die das Siegel nicht bewahrt haben,[a] sagt er: »Ihr Wurm wird nicht sterben und ihr Feuer nicht erlöschen, und sie werden für alle Menschen ein abschreckender Anblick sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Was mit dem „Siegel“ genau gemeint ist, wird hier nicht erläutert. Der Ausdruck kann in frühchristlichen Texten unterschiedliche, teils miteinander verbundene Vorstellungen aufrufen.
    reason: Bewahrt die theologische Mehrdeutigkeit und verhindert eine stillschweigende Gleichsetzung mit einer einzelnen Lehrtradition.
  - marker: b
    text: 'Die Aussage greift Jesaja 66,24 auf und erweitert sie um den Gedanken, dass die Betroffenen allen sichtbar sein werden. Wörtlich lautet der letzte Ausdruck: „für alles Fleisch“.'
    reason: Kennzeichnet die Schriftanknüpfung und dokumentiert die idiomatische Wiedergabe von „all flesh“.
lexical_decisions:
- source_word: ἀγών / ἀγωνίζομαι (Wettkampfwortfeld; gemäß griechischer Überlieferung, noch direkt zu prüfen)
  choice: Wettkampf / kämpfen
  rationale: Bewahrt die durchgehende athletische Bildwelt mit Laufbahn, Siegeskranz und Wettkampfstätte, ohne sie vorschnell zu einer rein militärischen Metapher umzudeuten.
- source_word: στέφανος / στεφανόω (Siegeskranzwortfeld; noch direkt zu prüfen)
  choice: Siegeskranz / den Siegeskranz erhalten
  rationale: „Krone“ wäre möglich, doch „Siegeskranz“ macht im sportlichen Zusammenhang die antike Auszeichnung verständlich und erhält ihre symbolische Bedeutung.
- source_word: φθαρτός / ἀφθαρσία (Vergänglichkeit/Unvergänglichkeit; noch direkt zu prüfen)
  choice: vergänglich / unvergänglich
  rationale: Erhält den ausdrücklich gesetzten Gegensatz zwischen gewöhnlichem und eschatologisch gewichtetem Wettkampf.
- source_word: seal
  choice: Siegel
  rationale: Die traditionsreiche, theologisch offene Metapher wird nicht als Taufe, Bekenntnis oder besondere Initiation ausgedeutet.
- source_word: all flesh
  choice: alle Menschen
  rationale: Gibt den semitisch-biblischen Ausdruck in verständlichem Gegenwartsdeutsch wieder; die wörtlichere Form wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung des Siegels
  choice: „das Siegel nicht bewahrt haben“ ohne nähere Identifikation
  alternative: „ihre Taufe nicht bewahrt haben“ oder „Gottes Kennzeichen nicht bewahrt haben“
  rationale: Der Text selbst erklärt das Siegel an dieser Stelle nicht. Eine bestimmte sakramentale oder konfessionelle Deutung würde die vorhandene Offenheit unzulässig einschränken.
- issue: Spannung zwischen „damit wir alle“ und „wenn wir nicht alle“
  choice: Beide Aussagen bleiben unverändert nebeneinander stehen.
  alternative: Die zweite Aussage als bloße rhetorische Übertreibung glätten oder auf andere Teilnehmer beziehen.
  rationale: Die auffällige Spannung gehört zum überlieferten Gedankengang und darf nicht stillschweigend harmonisiert werden.
- issue: Sprecher der abschließenden Schriftankündigung
  choice: „sagt er“
  alternative: „sagt Gott“ oder „heißt es“
  rationale: Die personale Form des Zeugnisses bleibt erhalten, ohne den im unmittelbaren Satz nicht ausdrücklich benannten Sprecher redaktionell festzulegen.
- issue: Gerichtssprache am Schluss
  choice: Wurm, Feuer und öffentlicher Anblick werden als Bilder ungemildert bewahrt.
  alternative: Paraphrase als allgemeine Strafe oder endgültige Vernichtung
  rationale: Der Text verbindet diese Bilder bewusst und lässt ihr genaues Verhältnis unausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konsequent erhaltener Wettkampfmetaphorik. „Siegeskranz“ verbindet historische Anschaulichkeit mit guter Verständlichkeit. Da die vorgelegte Arbeitsgrundlage ausdrücklich nur einen englischen gemeinfreien Zeugen bietet und die direkte Prüfung des griechischen Wortlauts noch aussteht, sind die griechischen Lexemangaben und alle syntaktischen Einzelentscheidungen vor der endgültigen Veröffentlichung am griechischen Text zu verifizieren.
