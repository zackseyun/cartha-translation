review_pass:
  verdict: revise
  source_fidelity: Überwiegend eng am englischen Zeugen und dem erkennbaren griechischen Wortlaut. Korrigiert werden sollten insbesondere πιστεύσωμεν („lasst uns glauben“ statt „vertrauen“), der explizite Bezug auf das künftige Leben sowie ἀρχηγός, das „Urheber“ zu stark auf Verursachung bzw. Ursprung festlegt.
  naturalness: Der Predigtton ist verständlich und würdig. „Geschäftemachen“ ist jedoch etwas umgangssprachlich; „Handel“ bzw. „im Handel tätig sein“ ist neutraler. „Gottesfurcht“ ist möglich, aber in diesem Gegensatz zu Gewinnstreben ist „Frömmigkeit“ die nähere und heute noch verständliche Wiedergabe von εὐσέβεια.
  terminology: „Retter“ und „Unvergänglichkeit“ sind passend. „Wegbereiter der Unvergänglichkeit“ gibt ἀρχηγός idiomatisch wieder, ohne die möglicherweise zu enge Aussage zu treffen, der Retter sei bloß der Urheber der Unvergänglichkeit. Die gerichtliche Bildsprache mit Ketten bleibt erhalten.
  issues:
  - severity: medium
    issue: „Lasst uns also vertrauen“ für „Let us then have faith“ / πιστεύσωμεν
    rationale: „Vertrauen“ kann im Deutschen allgemein Zuversicht oder zwischenmenschliches Vertrauen meinen. „Lasst uns also glauben“ bewahrt den expliziten Glaubensaufruf.
  - severity: low
    issue: „im kommenden [Leben]“ bleibt elliptisch
    rationale: Das Gegenstück zum gegenwärtigen Leben ist im Zeugen ausdrücklich das künftige Leben. Die Ergänzung verhindert, dass „im Kommenden“ unklar auf einen Zeitpunkt oder Zustand bezogen wird.
  - severity: medium
    issue: „Urheber der Unvergänglichkeit“ für „Prince of immortality“ / ἀρχηγός ἀφθαρσίας
    rationale: „Urheber“ behauptet primär eine verursachende oder schöpferische Rolle. Ἀρχηγός kann auch Anführer, Begründer oder Wegbereiter bezeichnen. „Wegbereiter“ lässt diese Titelbedeutung besser offen und ist modernes Standarddeutsch.
  - severity: low
    issue: „Geschäftemachen“ und die unterschiedliche Wiedergabe von „godliness/godly“
    rationale: „Geschäftemachen“ ist leicht umgangssprachlich. Außerdem schwächt „was Gott gefällt“ die Wiederaufnahme derselben Wortfamilie ab. „Handel“ und „Frömmigkeit / was fromm ist“ bewahren den Kontrast und das rhetorische Gefüge.
  - severity: low
    issue: „legt ihn in Ketten“
    rationale: Der Zeuge sagt, dass das Urteil den Geist mit Ketten beschwert. „Beschwert ihn mit Ketten“ bewahrt das Bild genauer, ohne es auszudeuten.
  revised_text: 'Lasst euch auch dadurch nicht beunruhigen, dass wir sehen, wie die Ungerechten Reichtum besitzen, während die Diener Gottes in Bedrängnis leben.


    Lasst uns also glauben, Brüder und Schwestern. Im gegenwärtigen Leben werden wir geschult, damit wir im künftigen Leben gekrönt werden.


    Kein gerechter Mensch hat schnell Frucht geerntet, sondern wartet darauf.


    Denn wenn Gott den Gerechten ihren Lohn schnell gegeben hätte, würden wir uns sogleich im Handel üben statt in der Frömmigkeit. Wir würden den Anschein erwecken, gerecht zu sein, obwohl wir nicht dem nachgingen, was fromm ist, sondern dem, was Gewinn bringt. Darum holt das göttliche Gericht einen ungerechten Geist ein und beschwert ihn mit Ketten.


    Dem einzigen unsichtbaren Gott, dem Vater der Wahrheit, der uns den Retter und Wegbereiter der Unvergänglichkeit gesandt hat und durch ihn auch die Wahrheit und das himmlische Leben offenbarte – ihm sei die Herrlichkeit für immer und ewig. Amen.'
