base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: de
  text: 'Lasst euch auch dadurch nicht beunruhigen, dass wir sehen, wie die Ungerechten Reichtum besitzen, während die Diener Gottes in Bedrängnis leben.


    Lasst uns also vertrauen, Brüder und Schwestern. Im gegenwärtigen Leben werden wir eingeübt, damit wir im kommenden gekrönt werden.


    Kein gerechter Mensch erntet die Frucht sofort, sondern wartet auf sie.


    Denn wenn Gott den Gerechten ihren Lohn sofort gegeben hätte, würden wir uns sogleich im Geschäftemachen üben statt in der Gottesfurcht. Wir würden gerecht erscheinen, obwohl wir nicht dem nachgingen, was Gott gefällt, sondern dem, was Gewinn bringt. Darum holt das göttliche Gericht einen ungerechten Geist ein und legt ihn in Ketten.


    Dem einzigen unsichtbaren Gott, dem Vater der Wahrheit, der uns den Retter und Urheber der Unvergänglichkeit gesandt hat und durch ihn auch die Wahrheit und das himmlische Leben offenbarte – ihm sei die Herrlichkeit für immer und ewig. Amen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: in Bedrängnis leben
  rationale: Gibt Not und bedrängte Lebensumstände in natürlichem, würdigem Deutsch wieder, ohne die Bedrängnis auf Armut allein zu verengen.
- source_word: trained / training ourselves
  choice: eingeübt / uns üben
  rationale: Bewahrt das Bild einer gegenwärtigen Einübung oder Schulung im Blick auf die künftige Krönung.
- source_word: merchandise
  choice: Geschäftemachen
  rationale: Bringt den Gegensatz zwischen eigennützigem Gewinnstreben und Gottesfurcht klar zum Ausdruck.
- source_word: godliness / godly
  choice: Gottesfurcht / was Gott gefällt
  rationale: Vermeidet das heute missverständliche „Frömmigkeit“ und gibt die ethisch-religiöse Ausrichtung idiomatisch wieder.
- source_word: Prince of immortality
  choice: Urheber der Unvergänglichkeit
  rationale: „Urheber“ erfasst die mögliche Bedeutung von ἀρχηγός als Ursprung, Begründer oder Wegbereiter besser als das im Deutschen politisch klingende „Fürst“; die griechische Prüfung steht noch aus.
- source_word: heavenly life
  choice: das himmlische Leben
  rationale: Bewahrt die Bildsprache und den eschatologischen Bezug des Zeugnisses.
theological_decisions:
- issue: Zeitpunkt und Wesen des Lohnes der Gerechten
  choice: Der Lohn wird als künftig und verzögert dargestellt, ohne ihn genauer zu definieren.
  alternative: Den Lohn ausdrücklich als ewiges Leben oder Heil benennen.
  rationale: Der Text spricht vom Lohn und von der künftigen Krönung, legt aber an dieser Stelle keine vollständige Heilslehre dar.
- issue: Bedeutung des göttlichen Gerichts und der Ketten
  choice: Die personale und gerichtliche Bildsprache bleibt erhalten.
  alternative: Die Aussage psychologisch als innere Belastung oder metaphorisch als Folgen des Unrechts erklären.
  rationale: Eine solche Deutung würde die echte Spannung und Offenheit des Textes vorschnell auflösen.
- issue: Titel des Retters
  choice: „Urheber der Unvergänglichkeit“
  alternative: „Fürst der Unsterblichkeit“ oder „Wegbereiter der Unvergänglichkeit“
  rationale: Die gewählte Formulierung ist im modernen Deutschen würdig und theologisch nicht unnötig verengend; wegen der noch ausstehenden direkten Prüfung des Griechischen bleibt sie vorläufig.
- issue: Adressatenformel
  choice: „Brüder und Schwestern“
  alternative: „Brüder“
  rationale: Die inklusive Wiedergabe entspricht dem kommunalen Adressatenkreis des englischen Konsultationstextes; der genaue griechische Wortlaut muss noch geprüft werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Predigtton. Der Entwurf beruht mangels bereitgestellten griechischen Wortlauts auf dem öffentlichen englischen Zeugen und der auditierten englischen POB-Schicht; eine direkte Prüfung der griechischen Handschriftentradition bleibt zwingend erforderlich. Daher wurden keine textkritischen Fußnoten behauptet.
