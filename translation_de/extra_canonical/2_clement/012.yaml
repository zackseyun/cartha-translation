review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die nichtkanonische, rätselhafte Herrenrede samt ihrer abschnittseigenen Auslegung. Eine sichere Korrektur ist bei „betimes“ nötig: „schon jetzt“ fügt einen nicht gesicherten Gegenwartsakzent hinzu. Da der griechische Wortlaut laut Kontext noch unmittelbar zu prüfen ist, wird der Dringlichkeitsausdruck nicht interpretierend wiedergegeben. Außerdem sollte die futurische Aussage über die eine Seele als solche erkennbar bleiben.'
  naturalness: Das Deutsch ist überwiegend modern, klar und würdig. „einander die Wahrheit sagen“ ist idiomatischer als „untereinander die Wahrheit reden“. Die syntaktisch absichtliche Verdichtung des zitierten Spruchs bleibt erhalten, wird aber durch einen Doppelpunkt vor „weder männlich noch weiblich“ lesbarer gegliedert.
  terminology: „Reich Gottes“, „Liebe“, „Gerechtigkeit“, „Seele“, „Körper“, „Verstellung“ sowie „männlich/weiblich“ sind angemessen. Die Begriffe werden weder konfessionell aufgeladen noch harmonisierend umgedeutet. „Erscheinen Gottes“ gibt die Formulierung des Zeugen präziser wieder als ein umschreibendes „an dem Gott erscheinen wird“.
  issues:
  - severity: medium
    issue: „schon jetzt“ für „betimes“
    rationale: „Schon jetzt“ legt einen spezifischen Gegenwartsbezug nahe, den der englische Zeuge mit seinem Dringlichkeitsausdruck nicht eindeutig festlegt. Die zeitliche Nuance sollte bis zur direkten griechischen Prüfung nicht ausgelegt werden.
  - severity: low
    issue: „eine einzige Seele ohne Verstellung ist“
    rationale: Der englische Zeuge formuliert zukunftsbezogen („there shall be“). Die deutsche Fassung sollte den futurischen bzw. als Folge dargestellten Charakter nicht in eine bloße Gegenwartsfeststellung überführen.
  - severity: low
    issue: Umschreibung von „the day of God’s appearing“
    rationale: „den Tag nicht, an dem Gott erscheinen wird“ ist verständlich, aber weniger nah an der nominalen Wendung des Zeugen. „den Tag des Erscheinens Gottes“ bewahrt deren Offenheit.
