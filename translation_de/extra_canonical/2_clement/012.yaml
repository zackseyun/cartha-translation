  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: de
  text: '12 Deshalb lasst uns das Reich Gottes schon jetzt in Liebe und Gerechtigkeit erwarten, denn wir kennen den Tag nicht, an dem Gott erscheinen wird.[a]


    Denn als jemand den Herrn selbst fragte, wann sein Reich kommen werde, sagte er: »Wenn die zwei eins sein werden und das Äußere wie das Innere und das Männliche mit dem Weiblichen weder männlich noch weiblich.«[b]


    Die zwei sind nun eins, wenn wir untereinander die Wahrheit reden und in zwei Körpern eine einzige Seele ohne Verstellung ist.


    Mit dem Äußeren wie dem Inneren meint er Folgendes: Mit dem Inneren meint er die Seele, mit dem Äußeren den Körper. Wie also dein Körper sichtbar ist, so soll auch deine Seele durch ihre guten Werke sichtbar werden.


    Und mit dem Männlichen mit dem Weiblichen, weder männlich noch weiblich, meint er Folgendes: Ein Bruder soll, wenn er eine Schwester sieht, nicht an sie als Frau denken, und eine Schwester soll, wenn sie einen Bruder sieht, nicht an ihn als Mann denken.[c]


    »Wenn ihr dies tut«, sagt er, »wird das Reich meines Vaters kommen.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung dieses Kapitels ist vorläufig, da für den vorliegenden Entwurf nur ein gemeinfreier englischer Übersetzungszeuge bereitgestellt wurde; die unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Transparenz über die eingeschränkte Quellenbasis ist erforderlich, weil die Aufgabenstellung eine quellensprachliche Prüfung ausdrücklich als ausstehend kennzeichnet.
  - marker: b
    text: Dieses dem Herrn zugeschriebene Wort ist in dieser Form nicht in den kanonischen Evangelien überliefert. Die ungewöhnliche Formulierung wurde nicht an ähnliche neutestamentliche Aussagen angeglichen.
    reason: Kennzeichnet den Überlieferungsstatus und erklärt die bewusste Nicht-Harmonisierung.
  - marker: c
    text: Der Text deutet das rätselhafte Wort selbst aus. Die Formulierung wurde bewusst nicht über diese Auslegung hinaus dogmatisch präzisiert.
    reason: Bewahrt die genuine Mehrdeutigkeit und verhindert das Eintragen späterer konfessioneller Deutungen.
  - marker: d
    text: 'Wörtlich nach dem englischen Zeugen: »das Reich meines Vaters wird kommen«; die zukünftige und bedingte Form der Aussage bleibt erhalten.'
    reason: Macht auf die theologisch spannungsreiche Verknüpfung von menschlichem Tun und dem Kommen des Reiches aufmerksam, ohne sie aufzulösen.
lexical_decisions:
- source_word: betimes
  choice: schon jetzt
  rationale: Gibt den zeitlichen Dringlichkeitsakzent des englischen Zeugen natürlich wieder, ohne das veraltete Wort wörtlich nachzuahmen.
- source_word: righteousness
  choice: Gerechtigkeit
  rationale: Bewahrt den ethisch-theologischen Bedeutungsumfang und die traditionelle Begrifflichkeit.
- source_word: appearing
  choice: erscheinen wird
  rationale: Lässt offen, ob eine Erscheinung beziehungsweise Ankunft gemeint ist, statt vorschnell einen technischen Endzeitbegriff einzusetzen.
- source_word: without dissimulation
  choice: ohne Verstellung
  rationale: Bewahrt den Gedanken fehlender Heuchelei oder Doppelzüngigkeit in knapper, verständlicher Sprache.
- source_word: male / female
  choice: das Männliche / das Weibliche; männlich / weiblich
  rationale: Im rätselhaften Zitat werden substantivierte geschlechtliche Kategorien bewahrt; in der anschließenden Auslegung werden die natürlichen deutschen Personenbezeichnungen Bruder, Schwester, Frau und Mann verwendet.
- source_word: manifest
  choice: sichtbar werden
  rationale: Stellt den Gegensatz zwischen sichtbarem Körper und durch Werke erkennbarer Seele verständlich dar.
theological_decisions:
- issue: Herkunft und Status des Herrenwortes
  choice: Das ungewöhnliche, außerkanonisch überlieferte Herrenwort wird unverändert als Zitat wiedergegeben.
  alternative: Das Wort an neutestamentliche Reich-Gottes-Aussagen angleichen oder paraphrasieren.
  rationale: Die Spannung und Eigenart der Überlieferung dürfen nicht durch Harmonisierung beseitigt werden.
- issue: Zeitpunkt des kommenden Reiches
  choice: Die konditionale Formulierung »Wenn ihr dies tut … wird … kommen« bleibt erhalten.
  alternative: Sie als bloßes Sichtbarwerden eines bereits gegenwärtigen Reiches deuten.
  rationale: Der Zeuge formuliert ein zukünftiges Kommen und verknüpft es mit dem genannten Tun; diese theologische Spannung wird nicht aufgelöst.
- issue: Geschlechtliche Aussage
  choice: Die Formulierung »weder männlich noch weiblich« und die eigene ethische Auslegung des Autors werden beide bewahrt.
  alternative: Die Aussage als Aufhebung aller Geschlechtlichkeit oder ausschließlich als sexuelle Enthaltsamkeit auslegen.
  rationale: Der Abschnitt bietet selbst eine begrenzte Auslegung; darüber hinausgehende dogmatische Festlegungen wären nicht quellengedeckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Die altertümliche Redeweise des englischen Zeugen wurde modernisiert, die rätselhafte Parallelstruktur des Herrenwortes jedoch bewahrt. Wegen der noch ausstehenden Prüfung der griechischen Überlieferung ist der Entwurf ausdrücklich vorläufig; mögliche Numerus-, Tempus- und Lexemfragen sollten am griechischen Text kontrolliert werden.
