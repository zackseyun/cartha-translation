translation:
  language: de
  text: 'Solange wir also auf der Erde sind, lasst uns umkehren; denn wir sind Ton in der Hand des Handwerkers.


    Denn wenn ein Töpfer ein Gefäß formt und es sich in seinen Händen verzieht oder zerdrückt wird, formt er es wieder neu. Hat er es aber erst einmal in den Feuerofen gestellt, kann er es nicht mehr ausbessern. So lasst auch uns, solange wir in dieser Welt sind, uns von ganzem Herzen von dem Bösen abwenden, das wir im Fleisch getan haben, damit wir vom Herrn gerettet werden, solange uns noch Zeit zur Umkehr bleibt.


    Denn nachdem wir aus der Welt gegangen sind, können wir dort weder mehr bekennen noch umkehren.


    Darum, Geschwister: Wenn wir den Willen des Vaters tun, das Fleisch rein bewahren und die Gebote des Herrn halten, werden wir ewiges Leben empfangen.


    Denn der Herr sagt im Evangelium: »Wenn ihr das Geringe nicht bewahrt habt, wer wird euch das Große geben? Denn ich sage euch: Wer im Geringsten treu ist, ist auch in vielem treu.«[a]


    Damit ist also gemeint: »Bewahrt das Fleisch rein und das Siegel unbefleckt, damit wir das Leben empfangen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das angeführte Herrenwort entspricht keiner einzelnen Stelle der kanonischen Evangelien wörtlich. Der zweite Satz steht Lukas 16,10 nahe; die Gegenüberstellung von Geringem und Großem erinnert an Lukas 16,10–12.
    reason: Kennzeichnet die unsichere genaue Herkunft des Evangelienzitats, ohne sie künstlich festzulegen.
  - marker: b
    text: Mit dem »Siegel« kann in frühchristlicher Sprache die Taufe oder die durch sie bezeichnete Zugehörigkeit gemeint sein; der Ausdruck bleibt hier jedoch offen.
    reason: Bewahrt die symbolische Mehrdeutigkeit und nennt eine verbreitete historische Deutungsmöglichkeit, ohne sie dem Text aufzuzwingen.
lexical_decisions:
- source_word: repent
  choice: umkehren
  rationale: Gibt den ethischen und geistlichen Richtungswechsel in natürlichem modernem Deutsch wieder; je nach zugrunde liegendem griechischem Ausdruck wäre auch »Buße tun« möglich.
- source_word: clay under the craftsman’s hand
  choice: Ton in der Hand des Meisters
  rationale: Bewahrt das plastische Handwerkerbild; »Meister« lässt die Beziehung zum folgenden Töpfervergleich erkennen, ohne den göttlichen Bezug ausdrücklich festzulegen.
- source_word: in the flesh
  choice: im Fleisch
  rationale: Die frühchristliche anthropologische Ausdrucksweise wird bewusst erhalten und nicht vereinfachend mit »mit unserem Körper« oder »in unserem irdischen Leben« aufgelöst.
- source_word: make confession
  choice: unsere Sünden bekennen
  rationale: Macht den im Zusammenhang gemeinten Gegenstand des Bekennens im Deutschen verständlich, ohne eine bestimmte kirchliche Beichtpraxis vorauszusetzen.
- source_word: seal
  choice: Siegel
  rationale: Das vieldeutige frühchristliche Bild bleibt unverändert und wird weder ausschließlich auf Taufe noch auf eine andere konkrete Praxis gedeutet.
- source_word: brethren
  choice: Geschwister
  rationale: Natürliche inklusive Anrede im modernen Standarddeutsch für die gesamte Gemeinde.
theological_decisions:
- issue: Umkehr und Rettung in der gegenwärtigen Lebenszeit
  choice: Die zeitliche Dringlichkeit der Umkehr und die Formulierung »damit wir vom Herrn gerettet werden« bleiben stehen.
  alternative: Den Satz als systematische Aussage über ein ausschließlich werkbezogenes Heilsverständnis erklären oder abschwächen.
  rationale: Der Text verbindet Umkehr, Handeln und Rettung ausdrücklich; diese Spannung soll übersetzt, nicht konfessionell aufgelöst werden.
- issue: Reinheit des Fleisches
  choice: »das Fleisch rein bewahren«
  alternative: »sexuell rein leben« oder »den Körper rein halten«
  rationale: Der Umfang der Aussage ist ohne direkte griechische Prüfung nicht sicher auf Sexualethik oder Körperpflege einzugrenzen; die traditionelle Mehrdeutigkeit bleibt erhalten.
- issue: Bedeutung des Siegels
  choice: »das Siegel unbefleckt« ohne Deutung im Haupttext
  alternative: »das Taufsiegel unbefleckt«
  rationale: Eine Taufdeutung ist historisch möglich, aber der bereitgestellte Zeuge nennt sie nicht ausdrücklich.
- issue: Evangelienzitat
  choice: Als Herrenwort im Evangelium wiedergegeben und mit einer textgeschichtlichen Fußnote versehen.
  alternative: Einer einzelnen kanonischen Evangelienstelle eindeutig zuordnen.
  rationale: Die Formulierung verbindet Motive, die an Lukas 16,10–12 und weitere synoptische Überlieferungen erinnern, entspricht aber keiner einzelnen kanonischen Stelle wortgleich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzstrukturen und erhaltener frühchristlicher Bildsprache. Die Übersetzung ist vorläufig, da das bereitgestellte Ausgangsmaterial ein englischer gemeinfreier Zeuge ist und die direkte Prüfung des griechischen Textes noch aussteht. Archaismen wurden vermieden; theologisch mehrdeutige Begriffe wie »Fleisch« und »Siegel« wurden nicht paraphrasierend vereindeutigt.
