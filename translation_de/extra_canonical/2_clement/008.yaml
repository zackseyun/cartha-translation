    issue: »Meister« für »craftsman«
    rationale: »Handwerker« bewahrt das allgemeine Handwerksbild des Zeugen genauer und vermeidet eine nicht erforderliche Konnotation von Autorität oder Meisterschaft.
  - severity: medium
    issue: Ergänzung »unsere Sünden« bei »bekennen«
    rationale: Der überlieferte Wortlaut nennt keinen Gegenstand des Bekennens. Die Ergänzung ist zwar kontextuell naheliegend, schränkt die Formulierung aber ohne Not ein.
  - severity: low
    issue: Abgeschwächte und leicht unidiomatische Umkehrformulierung
    rationale: Die Aufforderung sollte als »lasst uns« erhalten bleiben; »uns ... von dem Bösen abwenden« bildet die Wendung natürlich und klar ab.
  - severity: low
    issue: Zu enge Referenz in Fußnote a
    rationale: Die literarische Nähe betrifft Lukas 16,10–12, nicht ausschließlich 16,10.
