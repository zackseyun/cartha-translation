  verdict: revise
  source_fidelity: Die Übersetzung gibt Argumentation, Töpferbild, zeitliche Dringlichkeit der Umkehr, die Rede vom »Fleisch«, das Herrenwort und das mehrdeutige »Siegel« insgesamt getreu wieder. »Meister« ist für »craftsman« jedoch weniger präzise als »Handwerker«. Die Ergänzung »unsere Sünden« bei »bekennen« legt den im Zeugen nicht ausdrücklich genannten Gegenstand unnötig fest.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. »So wollen auch wir« schwächt die paränetische Aufforderung gegenüber »lasst uns« etwas ab; »von ganzem Herzen wegen des Bösen umkehren« klingt zudem weniger idiomatisch als »uns von ganzem Herzen von dem Bösen abwenden«.
  terminology: »umkehren«, »Fleisch«, »Geschwister« und »Siegel« sind angemessen. Die Fußnote zum Herrenwort soll Lukas 16,10–12 statt nur Lukas 16,10 nennen, weil die Gegenüberstellung von Geringem und Großem besonders auch an V. 12 anschließt.
