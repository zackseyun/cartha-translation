  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: de
  text: 'Darum, Brüder und Schwestern,[a] lasst uns unseren Aufenthalt in dieser Welt hinter uns lassen und den Willen dessen tun, der uns berufen hat. Lasst uns keine Angst davor haben, aus dieser Welt fortzugehen.


    Denn der Herr sagt: »Ihr werdet wie Lämmer mitten unter Wölfen sein.«


    Petrus aber antwortete ihm: »Was ist nun, wenn die Wölfe die Lämmer zerreißen?«


    Jesus sagte zu Petrus: »Wenn die Lämmer tot sind, sollen sie die Wölfe nicht fürchten. Auch ihr sollt euch nicht vor denen fürchten, die euch töten und euch danach nichts mehr antun können. Fürchtet vielmehr den, der nach eurem Tod Macht über Seele und Leib hat, sie in die Feuerhölle[b] zu werfen.«


    Ihr wisst ja, Brüder und Schwestern,[a] dass der Aufenthalt dieses Fleisches in dieser Welt gering und nur von kurzer Dauer ist. Doch die Verheißung Christi ist groß und wunderbar: die Ruhe des kommenden Reiches und des ewigen Lebens.[c]


    Was können wir also tun, um dies zu erlangen? Wir sollen in Heiligkeit und Gerechtigkeit leben, die Dinge dieser Welt als etwas betrachten, das uns fremd ist, und sie nicht begehren.


    Denn wenn wir danach verlangen, diese Dinge zu erlangen, kommen wir vom gerechten Weg ab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brüder«; die Anrede meint hier die ganze Glaubensgemeinschaft.'
    reason: Transparenz bei der inklusiven Wiedergabe einer gemeinschaftlichen Anrede.
  - marker: b
    text: 'Wörtlich: »in die Gehenna des Feuers«. Gehenna ist der Name des Hinnomtals bei Jerusalem und wurde zum Bild für den Ort des endzeitlichen Gerichts.'
    reason: Der verständliche Ausdruck »Feuerhölle« soll den zugrunde liegenden Ortsnamen und dessen Bildsprache nicht verdecken.
  - marker: c
    text: 'Auch möglich: »die Ruhe des künftigen Reiches und das ewige Leben«. Der Satzbau lässt offen, wie »Ruhe«, »Reich« und »ewiges Leben« genau aufeinander bezogen sind.'
    reason: Bewahrt eine echte syntaktische und theologische Mehrdeutigkeit des überlieferten Wortlauts.
lexical_decisions:
- source_word: brethren
  choice: Brüder und Schwestern
  rationale: Die Anrede bezeichnet die Glaubensgemeinschaft insgesamt; die inklusive deutsche Wiedergabe ist heute natürlich und wird durch eine Fußnote transparent gemacht.
- source_word: sojourn
  choice: Aufenthalt
  rationale: Bewahrt das Bild eines vorübergehenden Verweilens, ohne mit »Fremdlingschaft« einen altertümlichen oder stärker ausdeutenden Ausdruck zu wählen.
- source_word: depart out of this world
  choice: aus dieser Welt fortzugehen
  rationale: Erhält den verhüllenden Ausdruck für den Tod und die Spannung zwischen irdischem Aufenthalt und Aufbruch.
- source_word: Gehenna of fire
  choice: Feuerhölle
  rationale: Gibt den gemeinten Strafort in verständlichem Gegenwartsdeutsch wieder; der zugrunde liegende Ortsname Gehenna wird in der Fußnote offengelegt.
- source_word: mean
  choice: gering
  rationale: Versteht den Ausdruck im Sinn von unbedeutend beziehungsweise armselig, ohne das Fleisch selbst ausdrücklich moralisch abzuwerten.
- source_word: rest
  choice: Ruhe
  rationale: Bewahrt das traditionsreiche Ruhe-Motiv und vermeidet die Verengung auf bloße Erholung.
- source_word: walk in holiness and righteousness
  choice: in Heiligkeit und Gerechtigkeit leben
  rationale: Überträgt das semitisch-biblische Bild des Wandelns natürlich, ohne seinen ethischen Gehalt abzuschwächen.
theological_decisions:
- issue: Macht über Seele und Leib nach dem Tod
  choice: Die Aussage bleibt auf den nicht ausdrücklich benannten zu Fürchtenden bezogen.
  alternative: Den Handelnden ausdrücklich als Gott bezeichnen.
  rationale: Der vorliegende Zeuge sagt nur »den« beziehungsweise »ihn«; die Identifikation soll nicht in den Haupttext hineingetragen werden.
- issue: Bezug von »sie« beim Werfen in die Gehenna
  choice: Das Pluralpronomen »sie« bleibt erhalten und kann sich auf Seele und Leib beziehen.
  alternative: Singularisch die ganze Person als Gegenstand formulieren.
  rationale: So bleibt die grammatische Spannung des Zeugnisses zwischen Seele, Leib und Person gewahrt.
- issue: Ruhe des Reiches und des ewigen Lebens
  choice: Die koordinierte Formulierung »die Ruhe des kommenden Reiches und des ewigen Lebens« wird bewahrt.
  alternative: Ausdeutend »die Ruhe im kommenden Reich und das ewige Leben« schreiben.
  rationale: Der überlieferte Wortlaut ist syntaktisch mehrdeutig; die Übersetzung soll nicht entscheiden, ob eine oder zwei verheißene Größen gemeint sind.
- issue: Ethische Bedingung des Erlangens
  choice: Die rhetorische Aufforderung zu Heiligkeit und Gerechtigkeit bleibt ohne systematische Erklärung stehen.
  alternative: Sie ausdrücklich als Verdienst, Voraussetzung oder Folge der Erlösung kennzeichnen.
  rationale: Der Abschnitt selbst löst diese theologische Spannung nicht auf; konfessionelle Präzisierungen wären ein Import.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer mündlicher Anrede und zurückhaltend biblischem Klang. Archaismen wie »wandelnd«, »Fremdlingschaft« oder »Gehenna des Feuers« wurden im Haupttext vermieden, aber relevante Ausgangsformen sind in den Fußnoten dokumentiert. Da kein griechischer Wortlaut mitgeliefert wurde und die direkte Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf quellenkritisch vorläufig und eng am angegebenen öffentlichen englischen Zeugen orientiert.
