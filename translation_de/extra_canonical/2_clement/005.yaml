review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt zentrale Mehrdeutigkeiten, besonders bei »Seele und Leib« sowie bei »Ruhe … des ewigen Lebens«. Die Wiedergabe »Feuerhölle« ersetzt jedoch den im Zeugen ausdrücklich beibehaltenen Namen »Gehenna« durch eine interpretierende Sachbezeichnung. Außerdem sollte die rhetorische Frage in 5,5 als solche mit »Was können wir … anderes tun, als …?« erhalten bleiben.
  naturalness: Modernes, gut lesbares und würdiges Standarddeutsch. Die Anpassung der rhetorischen Frage macht den Satz zugleich idiomatischer und näher am Ausgangstext.
  terminology: »Gehenna des Feuers« ist als traditions- und quellennahe Bezeichnung im Haupttext vorzuziehen; die Fußnote kann die historische Ortsbezeichnung und die übertragene Gerichtsbildsprache erläutern. Die inklusive Anrede »Brüder und Schwestern« ist mit transparenter Fußnote vertretbar.
  issues:
  - severity: medium
    issue: »Feuerhölle« statt »Gehenna des Feuers«
    rationale: Der englische Zeuge behält »Gehenna« ausdrücklich als Ortsnamen bei. »Feuerhölle« legt die Bedeutung stärker aus und verdeckt den Namen im Haupttext.
  - severity: low
    issue: Rhetorische Frage in 5,5 in eine direkte Aufforderung umgeformt
    rationale: »Wir sollen …« gibt den Sinn wieder, verliert aber die Form von »What then can we do … but …?«. Eine Frage mit »anderes tun, als« bewahrt diese Form natürlich.
  revised_text: 'Darum, Brüder und Schwestern,[a] lasst uns unseren Aufenthalt in dieser Welt hinter uns lassen und den Willen dessen tun, der uns berufen hat. Lasst uns keine Angst davor haben, aus dieser Welt fortzugehen.


