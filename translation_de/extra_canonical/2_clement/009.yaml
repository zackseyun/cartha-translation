base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: de
  text: 'Keiner von euch soll sagen, dieses Fleisch werde nicht gerichtet und stehe nicht wieder auf.


    Begreift doch: Worin wurdet ihr gerettet? Worin habt ihr euer Augenlicht wiedererlangt, wenn nicht in diesem Fleisch?


    Darum sollen wir das Fleisch als einen Tempel Gottes bewahren.


    Denn so, wie ihr im Fleisch berufen wurdet, werdet ihr auch im Fleisch kommen.[a]


    Wenn Christus, der Herr, der uns gerettet hat, zuerst Geist war, dann Fleisch wurde und uns auf diese Weise berief, so werden auch wir in diesem Fleisch unseren Lohn empfangen.[b]


    Darum lasst uns einander lieben, damit wir alle in das Reich Gottes gelangen.


    Solange wir noch Zeit haben, geheilt zu werden, wollen wir uns in die Hände Gottes, des Arztes, begeben und ihm eine Gegenleistung geben.


    Welche Gegenleistung? Umkehr aus aufrichtigem Herzen.


    Denn er erkennt alles im Voraus und weiß, was in unserem Herzen ist.


    Darum wollen wir ihm ewiges Lob darbringen, nicht nur mit unseren Lippen, sondern auch aus unserem Herzen, damit er uns als Söhne annimmt.[c]


    Denn der Herr sagte auch: »Diese sind meine Brüder: die den Willen meines Vaters tun.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »kommen« bleibt die Formulierung des überlieferten Textes offen; gemeint sein kann das Kommen zur Auferstehung, zum Gericht oder zur Vollendung.
    reason: Genuine Bedeutungsunschärfe nicht stillschweigend auflösen.
  - marker: b
    text: Die Aussage, Christus sei »zuerst Geist« gewesen und dann Fleisch geworden, wird in ihrer ungewöhnlichen frühchristlichen Form bewahrt. Sie wird hier nicht durch eine spätere dogmatische Formel ersetzt.
    reason: Theologische Spannung des Zeugen transparent erhalten.
  - marker: c
    text: Wörtlich steht hier die männliche Kindschaftsbezeichnung »Söhne«; sie trägt im antiken Zusammenhang auch die Vorstellung von Zugehörigkeit und Erbberechtigung.
    reason: Historische Metapher erklären, ohne sie im Haupttext zu verallgemeinern.
  - marker: d
    text: Vgl. Matthäus 12,50; Markus 3,35. Der Wortlaut ist nicht mit nur einer Evangelienfassung völlig identisch.
    reason: Intertextuellen Bezug nennen, ohne ungesicherte Quellenharmonisierung.
lexical_decisions:
- source_word: flesh (Greek source review pending)
  choice: Fleisch
  rationale: Bewahrt die leiblich-theologische Zuspitzung des Abschnitts; »Körper« wäre natürlicher, würde aber den wiederholten Leitbegriff und seine Spannung abschwächen.
- source_word: riseth again
  choice: steht wieder auf
  rationale: Gibt die Auferstehungsaussage klar wieder, ohne sie durch eine erklärende Umschreibung zu erweitern.
- source_word: guard
  choice: bewahren
  rationale: Passt zum Tempelbild und umfasst schützen wie verantwortlich hüten.
- source_word: come
  choice: kommen
  rationale: Die Zielvorstellung bleibt im überlieferten englischen Zeugen unbestimmt; eine Festlegung auf »auferstehen« oder »vor Gericht erscheinen« wurde vermieden.
- source_word: repentance
  choice: Umkehr
  rationale: Modernes, verständliches Deutsch; bezeichnet eine ernsthafte innere und praktische Neuausrichtung, nicht bloß Reuegefühl.
- source_word: sons
  choice: Söhne
  rationale: Bewahrt die antike Kindschafts- und Erbschaftssprache; die Formulierung wird nicht stillschweigend verallgemeinert.
theological_decisions:
- issue: Gericht und Auferstehung des Fleisches
  choice: Die konkrete Aussage über dieses Fleisch wird beibehalten.
  alternative: Allgemeiner von der Auferstehung des Menschen oder des Körpers sprechen.
  rationale: Der Abschnitt argumentiert ausdrücklich mit der gegenwärtigen Leiblichkeit als Ort von Rettung, Berufung und künftigem Lohn.
- issue: Christus war »zuerst Geist« und wurde dann Fleisch
  choice: Die schwierige, spannungsreiche Formulierung wird wörtlichkeitsnah erhalten.
  alternative: 'Sie christologisch glätten, etwa: »Christus war göttlich und nahm Fleisch an.«'
  rationale: Eine Glättung würde eine bestimmte spätere dogmatische Deutung in den Text eintragen; die genuine frühchristliche Ausdrucksweise soll sichtbar bleiben.
- issue: »Gegenleistung« gegenüber Gott
  choice: Die ökonomische Metapher bleibt stehen und wird unmittelbar als Umkehr erklärt.
  alternative: Mit »Antwort« oder »Dank« abschwächen.
  rationale: Die anschließende rhetorische Frage bestimmt selbst, worin die Gegenleistung besteht, und verhindert ein Verständnis als käufliche Heilung.
- issue: Aufnahme als Söhne
  choice: »als Söhne annimmt«
  alternative: »als seine Kinder annimmt«
  rationale: Die traditionelle Sohnschaftssprache wird bewahrt, ohne weitergehende Aussagen über Geschlecht oder Heilsordnung einzuführen.
- issue: Zitat des Herrn
  choice: Als direkte Herrenrede wiedergegeben.
  alternative: Mit einer konkreten Evangelienstelle harmonisieren.
  rationale: Der Wortlaut ähnelt der synoptischen Tradition, sollte aber ohne direkte Prüfung des griechischen Textes nicht auf eine bestimmte Textfassung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren kurzen Absätzen und erhaltener rhetorischer Frageführung. Der Leitbegriff »Fleisch« wurde konsequent beibehalten. Da eine direkte Prüfung der griechischen Handschriftentradition laut Datensatz noch aussteht, kennzeichnen die Fußnoten besonders unsichere oder spannungsreiche Stellen; der Entwurf bleibt insofern vorläufig.
