revisions:
- from: '## 2. Clemens 2


    »Freue dich, du Unfruchtbare, die du nicht gebierst! Brich in Jubel aus und rufe laut, du, die keine Wehen hat! Denn zahlreicher sind die Kinder der Verlassenen als die Kinder der Frau, die einen Mann hat.«[a] Als er sagte: »Freue dich, du Unfruchtbare, die du nicht gebierst«, sprach er von uns. Denn unsere Gemeinde war unfruchtbar, bevor ihr Kinder geschenkt wurden.


    Und als er sagte: »Rufe laut, du, die keine Wehen hat«, meinte er damit: Lasst uns nicht müde werden wie Frauen in den Wehen, sondern unsere Bitten in Aufrichtigkeit vor Gott bringen.


    Und als er sagte: »Denn zahlreicher sind die Kinder der Verlassenen als die Kinder der Frau, die einen Mann hat«, sprach er so, weil unser Volk verlassen und von Gott aufgegeben zu sein schien. Jetzt aber, nachdem wir zum Glauben gekommen sind, sind wir zahlreicher geworden als diejenigen, die Gott zu haben schienen.


    Eine andere Schriftstelle sagt wiederum: »Ich bin nicht gekommen, Gerechte zu rufen, sondern Sünder.«[b]


    Damit ist gemeint: Man muss die retten, die zugrunde gehen.


    Denn gerade dies ist ein großes und staunenswertes Werk: nicht zu festigen, was fest steht, sondern was im Begriff ist zu fallen.


    So wollte auch Christus retten, was zugrunde ging. Er kam, rief uns, als wir bereits zugrunde gingen, und rettete viele.'
