base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: de
  text: '## 2. Clemens 2


    »Freue dich, du Unfruchtbare, die du nicht gebierst! Brich in Jubel aus und rufe laut, du, die keine Wehen hat! Denn zahlreicher sind die Kinder der Verlassenen als die Kinder der Frau, die einen Mann hat.«[a] Als er sagte: »Freue dich, du Unfruchtbare, die du nicht gebierst«, sprach er von uns. Denn unsere Gemeinde war unfruchtbar, bevor ihr Kinder geschenkt wurden.


    Und als er sagte: »Rufe laut, du, die keine Wehen hat«, meinte er damit: Lasst uns nicht, wenn wir Gott in Aufrichtigkeit unsere Bitten darbringen, wie Frauen in den Wehen müde werden.


    Und als er sagte: »Denn zahlreicher sind die Kinder der Verlassenen als die Kinder der Frau, die einen Mann hat«, sprach er so, weil unser Volk verlassen und von Gott aufgegeben zu sein schien. Jetzt aber, nachdem wir zum Glauben gekommen sind, sind wir zahlreicher geworden als diejenigen, die Gott zu haben schienen.


    Eine andere Schriftstelle sagt wiederum: »Ich bin nicht gekommen, Gerechte zu rufen, sondern Sünder.«[b]


    Damit ist gemeint: Es ist recht, die zu retten, die zugrunde gehen.


    Denn gerade dies ist ein großes und staunenswertes Werk: nicht aufzurichten, was steht, sondern was fällt.


    So wollte auch Christus retten, was zugrunde ging. Er kam, rief uns, als wir bereits zugrunde gingen, und rettete viele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zitat nach Jesaja 54,1 in der griechischen Fassung des Alten Testaments.
    reason: Kennzeichnet die angeführte Schriftstelle und erklärt die gegenüber manchen modernen alttestamentlichen Übersetzungen abweichende Formulierung.
  - marker: b
    text: Vgl. Matthäus 9,13; Markus 2,17; Lukas 5,32.
    reason: Weist die als Schrift bezeichnete Jesusüberlieferung nach, ohne die hier verwendete Form vorschnell nur einem Evangelium zuzuordnen.
lexical_decisions:
- source_word: ἐκκλησία
  choice: Gemeinde
  rationale: Im frühchristlichen Kontext bezeichnet das Wort die versammelte Glaubensgemeinschaft; „Gemeinde“ ist im modernen Deutsch natürlicher als „Kirche“, ohne die institutionelle Bedeutung unnötig festzulegen.
- source_word: ἁπλῶς
  choice: in Aufrichtigkeit
  rationale: Bewahrt den Gedanken einer ungeteilten, lauteren Hinwendung zu Gott und vermeidet die heute leicht abwertende Bedeutung von „einfältig“.
- source_word: δεήσεις
  choice: Bitten
  rationale: Gibt die spezifische Bedeutung von flehentlichen Gebeten genauer wieder als das allgemeinere „Gebete“.
- source_word: τὰ ἀπολλύμενα / τοὺς ἀπολλυμένους
  choice: was zugrunde ging / die zugrunde gehen
  rationale: Bewahrt das Bild eines gegenwärtigen Verderbens oder Untergangs, statt vorschnell einen dogmatisch aufgeladenen Begriff wie „die Verlorenen“ einzusetzen.
- source_word: στηρίζειν
  choice: festigen
  rationale: Erhält den Gegensatz zwischen dem Feststehenden und dem Fallenden und klingt zugleich natürlich und würdevoll.
theological_decisions:
- issue: Bezug von „denjenigen, die Gott zu haben schienen“
  choice: Die offene, im Text spannungsvolle Gegenüberstellung bleibt unverändert stehen.
  alternative: Die Gruppe ausdrücklich mit Israel oder einer bestimmten Religionsgemeinschaft identifizieren.
  rationale: Der Abschnitt benennt die Vergleichsgruppe nicht ausdrücklich; eine konkrete konfessionelle oder heilsgeschichtliche Identifikation wäre interpretierende Ergänzung.
- issue: Bedeutung von „retten“ bei den Zugrundegehenden
  choice: Das wiederholte Rettungsmotiv wird ohne systematisch-theologische Ausdeutung wiedergegeben.
  alternative: „Zum ewigen Heil führen“ oder „von der Verdammnis erlösen“.
  rationale: Solche Formulierungen würden mögliche Implikationen explizieren, die der Text an dieser Stelle selbst nicht ausführt.
- issue: Subjekt der Schriftzitate
  choice: Das maskuline „er“ der Auslegung wird beibehalten, ohne es ausdrücklich als Gott, Christus oder den Propheten zu bestimmen.
  alternative: Das Subjekt ausdrücklich als Gott oder den Propheten benennen.
  rationale: So bleibt die im Abschnitt vorhandene Referenzoffenheit erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Absatzstruktur. Die Zitate behalten ihren poetisch-biblischen Klang; die Auslegung ist bewusst zugänglich formuliert. Die Vorlage kennzeichnet die direkte Prüfung der griechischen Überlieferung als noch ausstehend; der Entwurf berücksichtigt daher die überlieferte griechische Wortwahl, vermeidet aber textkritische Festlegungen, die ohne vollständige Kollation nicht abgesichert wären.
