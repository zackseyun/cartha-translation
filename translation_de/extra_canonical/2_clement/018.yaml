base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: de
  text: 'Darum wollen auch wir uns unter denen finden lassen, die Dank sagen, unter denen, die Gott gedient haben, und nicht unter den Gottlosen, die gerichtet werden.


    Denn auch ich selbst bin ein durch und durch sündiger Mensch. Noch bin ich der Versuchung nicht entronnen, sondern befinde mich weiterhin mitten unter den Anschlägen des Teufels. Ich bemühe mich aber, der Gerechtigkeit nachzujagen, damit es mir wenigstens gelingt, ihr nahezukommen, während ich das kommende Gericht fürchte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: give thanks
  choice: Dank sagen
  rationale: Gibt den bezeugten Sinn schlicht und würdig wieder, ohne den Ausdruck auf Lobpreis oder Eucharistie einzuengen.
- source_word: served God
  choice: Gott gedient haben
  rationale: Bewahrt die rückblickende beziehungsweise vollendete Aussage des englischen Zeugen und den religiösen Dienstgedanken.
- source_word: utter sinner
  choice: ein durch und durch sündiger Mensch
  rationale: Natürliches modernes Deutsch, das die starke Selbsteinschätzung wiedergibt, ohne eine substantivische Etikettierung unnötig zu verhärten.
- source_word: engines of the devil
  choice: Anschlägen des Teufels
  rationale: Vermittelt das Bild feindlicher Vorrichtungen beziehungsweise Machenschaften idiomatisch; die genaue griechische Bildlichkeit muss bei der noch ausstehenden Quellenprüfung erneut geprüft werden.
- source_word: follow after righteousness
  choice: der Gerechtigkeit nachzujagen
  rationale: Erhält die aktive, intensive Bewegungsmetapher statt sie lediglich als allgemeines Streben abzuschwächen.
- source_word: judgment to come
  choice: das kommende Gericht
  rationale: Entspricht dem frühchristlichen eschatologischen Sprachgebrauch und lässt Zeitpunkt und Ausgestaltung offen.
theological_decisions:
- issue: Wer unter den Gottlosen das Gericht vollzieht oder empfängt
  choice: die gerichtet werden
  alternative: die richten
  rationale: Der vorliegende englische Zeuge versteht die Gottlosen als Gegenstand des Gerichts. Da die direkte griechische Prüfung noch aussteht, wird keine weitergehende Präzisierung vorgenommen.
- issue: Verhältnis von menschlichem Bemühen und Gerechtigkeit
  choice: damit es mir wenigstens gelingt, ihr nahezukommen
  alternative: damit ich sie erlange
  rationale: Bewahrt die demütige und spannungsvolle Aussage, dass der Sprecher der Gerechtigkeit lediglich nahezukommen hofft; sie wird weder als vollständige sittliche Vollkommenheit noch als ausgearbeitete Rechtfertigungslehre gedeutet.
- issue: Zusammenhang zwischen Gerichtsfurcht und Streben nach Gerechtigkeit
  choice: denn ich fürchte das kommende Gericht
  alternative: während ich das kommende Gericht fürchte
  rationale: Die kausale Lesart folgt dem konsultierten englischen POB, bleibt aber textnah genug; eine direkte griechische Prüfung könnte zeigen, ob eher ein begleitender oder begründender Zusammenhang vorliegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit paränetischem Ton. Wegen der ausdrücklich noch ausstehenden Prüfung des griechischen Wortlauts ist der Entwurf vorläufig und eng am öffentlichen englischen Textzeugen orientiert. Keine konfessionell geprägte Terminologie wurde ergänzt.
