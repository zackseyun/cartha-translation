base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: de
  text: Der selige Polykarp erlitt das Martyrium am zweiten Tag des ersten Monats Xanthikos, am siebten Tag vor den Kalenden des März, an einem großen Sabbat, zur achten Stunde. Er wurde von Herodes festgenommen, als Philippus von Tralles das Amt des Hohen Priesters bekleidete, während Statius Quadratus Prokonsul war, während aber Jesus Christus für immer herrscht. Ihm seien Herrlichkeit, Ehre, Majestät und ein ewiger Thron von Generation zu Generation. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: was martyred
  choice: erlitt das Martyrium
  rationale: Bewahrt den frühchristlichen Zeugnis- und Todesbezug in würdigem, natürlichem Deutsch, ohne die Formulierung auf bloßes Töten zu verengen.
- source_word: Xanthicus
  choice: Xanthikos
  rationale: Der antike Monatsname wird in gebräuchlicher griechischer Umschrift bewahrt und nicht mit einem modernen Monat gleichgesetzt.
- source_word: calends
  choice: Kalenden
  rationale: Der römische Kalenderfachbegriff bleibt erhalten, damit die überlieferte Datierungsweise nicht harmonisiert wird.
- source_word: a great Sabbath
  choice: ein großer Sabbat
  rationale: Die auffällige, möglicherweise technisch oder liturgisch gemeinte Wendung wird bewusst wörtlich und ohne Deutung bewahrt.
- source_word: at the eighth hour
  choice: zur achten Stunde
  rationale: Behält die antike Stundenangabe bei, statt sie spekulativ in eine moderne Uhrzeit umzurechnen.
- source_word: greatness
  choice: Majestät
  rationale: Im doxologischen Zusammenhang gibt „Majestät“ die Bedeutung natürlicher und würdiger wieder als das abstrakte „Größe“.
theological_decisions:
- issue: Kontrast zwischen römischer Amtszeit und Christi Herrschaft
  choice: „während der Amtszeit des Prokonsuls …, doch unter der Herrschaft des ewigen Königs Jesus Christus“
  alternative: „im Prokonsulat …, aber in der Regierungszeit …“
  rationale: Der bewusste Gegensatz zwischen zeitlicher politischer Datierung und der übergeordneten, ewigen Königsherrschaft Christi bleibt deutlich erhalten.
- issue: Bezug der abschließenden Doxologie
  choice: „Ihm seien …“ mit Bezug auf Jesus Christus
  alternative: Unpersönliche oder trinitarisch erweiterte Doxologie
  rationale: Der unmittelbare grammatische Bezug des überlieferten Wortlauts wird gewahrt, ohne eine zusätzliche dogmatische Präzisierung einzuführen.
- issue: Titel „high priest“ für Philippus von Tralles
  choice: „Hoher Priester“
  alternative: „Oberpriester“ oder erklärende Identifikation eines heidnischen Kultamtes
  rationale: Der Titel wird formal bewahrt; seine konkrete institutionelle Bedeutung wird mangels direkter griechischer Prüfung nicht näher festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Antike Kalender- und Zeitangaben sowie die Wendung „großer Sabbat“ bleiben ohne Harmonisierung erhalten. Der Entwurf ist vorläufig, da laut Datensatz eine unmittelbare Prüfung des griechischen Ausgangstextes noch aussteht.
