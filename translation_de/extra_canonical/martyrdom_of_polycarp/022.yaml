revisions:
- from: Der selige Polykarp erlitt das Martyrium am zweiten Tag der ersten Hälfte des Monats Xanthikos, am siebten Tag vor den Kalenden des März, an einem großen Sabbat, zur achten Stunde. Er wurde von Herodes festgenommen, als Philippus von Tralles Hoher Priester war, während der Amtszeit des Prokonsuls Statius Quadratus, doch unter der Herrschaft des ewigen Königs Jesus Christus. Ihm seien Herrlichkeit, Ehre, Majestät und ein ewiger Thron von Generation zu Generation. Amen.
  to: Der selige Polykarp erlitt das Martyrium am zweiten Tag des ersten Monats Xanthikos, am siebten Tag vor den Kalenden des März, an einem großen Sabbat, zur achten Stunde. Er wurde von Herodes festgenommen, als Philippus von Tralles das Amt des Hohen Priesters bekleidete, während Statius Quadratus Prokonsul war, während aber Jesus Christus für immer herrscht. Ihm seien Herrlichkeit, Ehre, Majestät und ein ewiger Thron von Generation zu Generation. Amen.
  rationale: Die Revision korrigiert die eindeutige Verwechslung von „erstem Monat“ und „erster Monatshälfte“. Außerdem wird die parallele, kontrastierende Datierung durch römische Amtszeiten und die bleibende Herrschaft Jesu Christi enger am griechischen Satzbau wiedergegeben. Die auffälligen antiken Kalender- und Zeitbegriffe bleiben ohne erklärende Harmonisierung stehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:53:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere sachliche Abweichung liegt bei „erste Hälfte des Monats“ vor: Das zugrunde liegende griechische „τοῦ πρώτου μηνός“ bezeichnet den ersten Monat, nicht die erste Monatshälfte. Die übrigen Datierungsangaben, einschließlich „siebten Tag vor den Kalenden des März“, „großer Sabbat“ und „achte Stunde“, bleiben bewusst unharmanisiert. Die Schlussformel hebt gegenüber den römischen Amtsträgern Jesu Christi Herrschaft „für immer“ hervor; dies wird im Deutschen genauer als fortdauerndes Herrschen formuliert.'
  naturalness: Der Text ist überwiegend würdiges, modernes Standarddeutsch. „als Philippus von Tralles Hoher Priester war“ ist jedoch etwas steif; „als Philippus von Tralles das Amt des Hohen Priesters bekleidete“ ist natürlicher und gibt die partizipiale Amtsangabe präzise wieder. Die Schlussformel wird mit einer klaren, gut lesbaren Satzfügung wiedergegeben.
  terminology: „Polykarp“, „Xanthikos“, „Kalenden“, „Sabbat“, „Prokonsul“, „Statius Quadratus“ und „Jesus Christus“ sind angemessen. „Majestät“ ist als doxologische Wiedergabe von „Größe“ vertretbar. „Hoher Priester“ wird als Amtsbezeichnung beibehalten, ohne die institutionelle Zugehörigkeit spekulativ zu bestimmen.
  issues:
  - severity: high
    issue: „der ersten Hälfte des Monats Xanthikos“
    rationale: Das griechische „τοῦ πρώτου μηνός“ bedeutet „des ersten Monats“. „Erste Hälfte“ fügt eine im Ausgangstext nicht vorhandene zeitliche Einteilung hinzu und verändert die Datierung.
  - severity: low
    issue: Wiedergabe der ewigen Herrschaft Christi
    rationale: Die Formulierung „unter der Herrschaft des ewigen Königs“ ist verständlich, kann aber den griechischen Kontrast mit dem fortdauernden „Herrschen“ weniger unmittelbar abbilden. „während aber Jesus Christus für immer herrscht“ bewahrt Syntax und Sinn genauer.
  revised_text: Der selige Polykarp erlitt das Martyrium am zweiten Tag des ersten Monats Xanthikos, am siebten Tag vor den Kalenden des März, an einem großen Sabbat, zur achten Stunde. Er wurde von Herodes festgenommen, als Philippus von Tralles das Amt des Hohen Priesters bekleidete, während Statius Quadratus Prokonsul war, während aber Jesus Christus für immer herrscht. Ihm seien Herrlichkeit, Ehre, Majestät und ein ewiger Thron von Generation zu Generation. Amen.
  revised_footnotes: []
  revision_rationale: Die Revision korrigiert die eindeutige Verwechslung von „erstem Monat“ und „erster Monatshälfte“. Außerdem wird die parallele, kontrastierende Datierung durch römische Amtszeiten und die bleibende Herrschaft Jesu Christi enger am griechischen Satzbau wiedergegeben. Die auffälligen antiken Kalender- und Zeitbegriffe bleiben ohne erklärende Harmonisierung stehen.
