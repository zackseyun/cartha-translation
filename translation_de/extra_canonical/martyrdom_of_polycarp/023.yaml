lexical_decisions:
- source_word: God speed
  choice: Gottes Segen
  rationale: Die altertümliche englische Segensformel wird in natürliches, würdevolles Gegenwartsdeutsch übertragen.
- source_word: walk by the word
  choice: nach dem Wort … lebt
  rationale: Das biblische Bild des Wandelns bezeichnet die Lebensführung; die funktionale Wiedergabe ist im modernen Deutsch klar.
- source_word: suffered martyrdom / is martyred
  choice: den Märtyrertod erlitten / erleidet den Märtyrertod
  rationale: Bewahrt den historischen und christlichen Sinn, ohne das im Deutschen unübliche Verb »martyrisiert werden« zu verwenden.
- source_word: papers
  choice: Aufzeichnungen
  rationale: Gemeint sind schriftliche Unterlagen, nicht moderne wissenschaftliche Abhandlungen.
- source_word: gathering it together
  choice: stellte den Bericht wieder zusammen
  rationale: Gibt die Tätigkeit an einem altersbedingt beschädigten Text verständlich wieder, ohne eine bestimmte Rekonstruktionsmethode zu behaupten.
- source_word: catholic rule of the Church
  choice: allgemeine Glaubensregel der Kirche
  rationale: Bewahrt den frühkirchlichen Sinn von »katholisch« als allgemein und vermeidet eine anachronistische konfessionelle Verengung.
- source_word: Recognize us
  choice: Erkenne uns an
  rationale: Gibt die Aufforderung als Verlangen nach Anerkennung wieder; der anschließende Wortwechsel bleibt erhalten.
theological_decisions:
- issue: Doxologie im ersten Absatz
  choice: Durch ihn sei Gott die Herrlichkeit
  alternative: Mit ihm sei Gott die Herrlichkeit
  rationale: Der englische Zeuge ist syntaktisch mehrdeutig. Die gewählte Form ergibt im Deutschen einen verständlichen christologischen Bezug, ohne Christus selbst mit Gott gleichzusetzen oder von ihm zu trennen; die ausstehende griechische Prüfung wird ausdrücklich vermerkt.
- issue: Aufnahme in das himmlische Reich
  choice: damit … auch mich zusammen mit seinen Erwählten … aufnehme
  alternative: damit … auch mich mit seinen Erwählten versammle
  rationale: Das Wortspiel mit dem Zusammenstellen des Berichts lässt sich nicht vollständig natürlich bewahren. »Aufnehme« vermittelt den eschatologischen Sinn, ohne eine bestimmte Heilslehre auszuführen.
- issue: Doxologische Varianten
  choice: Die erste Fassung nennt Vater und Heiligen Geist; die Moskauer Fassung Vater, Sohn und Heiligen Geist
  alternative: Beide Formeln harmonisieren
  rationale: Die handschriftlich bezeugte Spannung wird nicht stillschweigend vereinheitlicht.
- issue: Erwählte
  choice: seine heiligen Erwählten / seine Erwählten
  alternative: seine Heiligen
  rationale: Die Wahl bewahrt die ausdrückliche Erwählungssprache des Zeugen, ohne sie konfessionell zu deuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem frühchristlichem Erzählregister. Altertümliche Formeln wurden behutsam aktualisiert; Eigennamen folgen geläufigen deutschen Formen. Wegen der noch ausstehenden Prüfung des griechischen Textes bleibt der Entwurf ausdrücklich vorläufig und bewahrt die vom englischen Zeugen angezeigten Varianten.
