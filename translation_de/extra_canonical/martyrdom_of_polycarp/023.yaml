  text: 'We bid you God speed, brethren, while you walk by the word of Jesus Christ which is according to the Gospel; with whom be glory to God for the salvation of his holy elect; even as the blessed Polycarp suffered martyrdom, in whose footsteps may it be our lot to be found in the kingdom of Jesus Christ.


    This account Gaius copied from the papers of Irenaeus, a disciple of Polycarp. The same also lived with Irenaeus.


    And I, Socrates, wrote it down in Corinth from the copy of Gaius. Grace be with all men.


    And I, Pionius, again wrote it down from the aforementioned copy, having searched it out (for the blessed Polycarp showed me in a revelation, as I will declare in the sequel), gathering it together when it was now well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Holy Spirit for ever and ever. Amen.


    The three preceding paragraphs as read in the Moscow manuscript: This account Gaius copied from the papers of Irenaeus. The same lived with Irenaeus, who had been a disciple of the holy Polycarp. For this Irenaeus, being in Rome at the time of the martyrdom of the bishop Polycarp, instructed many; and many most excellent and orthodox treatises by him are in circulation. In these he makes mention of Polycarp, saying that he was taught by him. And he ably refuted every heresy, and handed down the catholic rule of the Church just as he had received it from the saint. He mentions this fact also, that when Marcion, after whom the Marcionites are called, met the holy Polycarp on one occasion, and said, “Recognize us, Polycarp,” he said in reply to Marcion, “Yes indeed, I recognize the firstborn of Satan.” The following statement also is made in the writings of Irenaeus, that on the very day and hour when Polycarp was martyred in Smyrna, Irenaeus, being in the city of the Romans, heard a voice
    as of a trumpet saying, “Polycarp is martyred.”


    From these papers of Irenaeus then, as has been stated already, Gaius made a copy, and from the copy of Gaius Isocrates made another in Corinth.


    And I, Pionius, again wrote it down from the copy of Isocrates, having searched for it in obedience to a revelation of the holy Polycarp, gathering it together when it was well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Son and the Holy Spirit for ever and ever. Amen.'
translation:
  language: de
  text: 'Wir wünschen euch Gottes Segen, Geschwister, während ihr nach dem Wort Jesu Christi lebt, das dem Evangelium entspricht. Durch ihn sei Gott die Herrlichkeit für die Rettung seiner heiligen Erwählten. So hat auch der selige Polykarp den Märtyrertod erlitten; möge es uns geschenkt werden, in seinen Fußspuren im Reich Jesu Christi gefunden zu werden.[a]


    Diesen Bericht schrieb Gaius aus den Aufzeichnungen des Irenäus ab, eines Schülers Polykarps. Gaius lebte auch mit Irenäus zusammen.


    Und ich, Sokrates, schrieb ihn in Korinth von der Abschrift des Gaius ab. Die Gnade sei mit allen.


    Und ich, Pionius, schrieb ihn wiederum von der genannten Abschrift ab, nachdem ich sie ausfindig gemacht hatte – denn der selige Polykarp zeigte sie mir in einer Offenbarung, wie ich im Folgenden berichten werde. Ich stellte den Bericht wieder zusammen, als die Abschrift durch ihr Alter schon beinahe unlesbar geworden war, damit der Herr Jesus Christus auch mich zusammen mit seinen Erwählten in sein himmlisches Reich aufnehme. Ihm sei die Herrlichkeit mit dem Vater und dem Heiligen Geist für immer und ewig. Amen.


    Die drei vorangehenden Absätze lauten in der Moskauer Handschrift folgendermaßen:[b]


    Diesen Bericht schrieb Gaius aus den Aufzeichnungen des Irenäus ab. Gaius lebte mit Irenäus zusammen, der ein Schüler des heiligen Polykarp gewesen war. Dieser Irenäus hielt sich zur Zeit des Märtyrertodes des Bischofs Polykarp in Rom auf und unterwies viele. Zahlreiche überaus vorzügliche und rechtgläubige Abhandlungen von ihm sind im Umlauf. Darin erwähnt er Polykarp und sagt, er sei von ihm unterrichtet worden. Er widerlegte überzeugend jede Irrlehre und überlieferte die allgemeine Glaubensregel der Kirche[c] so, wie er sie von dem Heiligen empfangen hatte. Er berichtet auch Folgendes: Als Markion, nach dem die Markioniten benannt sind, einmal dem heiligen Polykarp begegnete und sagte: »Erkenne uns an, Polykarp!«, antwortete Polykarp ihm: »Ja, ich erkenne den Erstgeborenen Satans.« In den Schriften des Irenäus findet sich außerdem die Aussage, Irenäus habe sich in der Stadt der Römer aufgehalten und an genau dem Tag und zu genau der Stunde, als Polykarp in Smyrna den Märtyrertod erlitt,
    eine Stimme wie den Klang einer Trompete gehört, die sagte: »Polykarp erleidet den Märtyrertod.«


    Wie bereits gesagt, fertigte Gaius also von diesen Aufzeichnungen des Irenäus eine Abschrift an, und Isokrates fertigte in Korinth von der Abschrift des Gaius eine weitere an.


    Und ich, Pionius, schrieb den Bericht wiederum von der Abschrift des Isokrates ab. Aufgrund einer Offenbarung des heiligen Polykarp hatte ich nach ihr gesucht. Ich stellte den Bericht wieder zusammen, als die Abschrift durch ihr Alter beinahe unlesbar geworden war, damit der Herr Jesus Christus auch mich zusammen mit seinen Erwählten in sein himmlisches Reich aufnehme. Ihm sei die Herrlichkeit mit dem Vater und dem Sohn und dem Heiligen Geist für immer und ewig. Amen.


    [a] Die Übersetzung dieses Kapitels ist vorläufig, da für den vorliegenden Entwurf nur ein gemeinfreier englischer Übersetzungszeuge zur Verfügung stand; die unmittelbare Prüfung des griechischen Wortlauts steht noch aus.


    [b] Die folgenden drei Absätze bieten eine abweichende Schlussfassung, die der englische Übersetzungszeuge ausdrücklich der Moskauer Handschrift zuordnet.


    [c] »Allgemeine Glaubensregel« gibt hier »catholic rule of the Church« wieder. »Catholic« ist im ursprünglichen Sinn von »allgemein« oder »die ganze Kirche betreffend« zu verstehen und nicht als spätere Konfessionsbezeichnung.'
