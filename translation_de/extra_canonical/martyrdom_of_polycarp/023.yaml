review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die alternative Moskauer Schlussfassung. Zwei Formulierungen gehen jedoch über den Zeugen hinaus bzw. verschieben ihn: Polykarp „zeigte sie mir“ macht die Abschrift zum Gegenstand der Offenbarung, während der Zeuge nur sagt, Polykarp habe dem Schreiber in einer Offenbarung etwas gezeigt; ferner ist „unlesbar“ stärker als „well nigh worn out by age“.'
  naturalness: Der Text ist überwiegend flüssiges, würdiges modernes Standarddeutsch. „zeigte sich mir in einer Offenbarung“ und „fast vom Alter zerrieben“ sind idiomatisch und bleiben näher an der überlieferten Aussage. Die Wiederaufnahme von „versammle“ stellt zudem die Verbindung zum vorherigen Wiederzusammentragen des Textes her.
  terminology: Eigennamen, Märtyrertod, Erwählte und die unterschiedlichen Doxologien sind angemessen wiedergegeben. „allgemeine Glaubensregel der Kirche“ ist als erklärende, nichtkonfessionelle Wiedergabe von „catholic rule of the Church“ vertretbar; die Fußnote erläutert dies sachgerecht.
  issues:
  - severity: medium
    issue: Gegenstand der Offenbarung im Pionius-Kolophon
    rationale: „der selige Polykarp zeigte sie mir in einer Offenbarung“ legt fest, dass Polykarp dem Pionius die Abschrift zeigte. Der englische Zeuge besagt dies nicht; die Formulierung ist mindestens mehrdeutig. „zeigte sich mir“ vermeidet die unbegründete Identifikation mit der Abschrift.
  - severity: low
    issue: Zustand der Abschrift
    rationale: „beinahe unlesbar“ ist eine spezifische Folgerung, die der Zeuge mit „well nigh worn out by age“ nicht ausdrücklich zieht. „fast vom Alter zerrieben“ gibt den materiellen Verfall wieder, ohne Lesbarkeit zu behaupten.
  - severity: low
    issue: Wortspiel bzw. Bild von ‚gathering‘
    rationale: „aufnehme“ gibt den eschatologischen Sinn wieder, verliert aber das im Zeugen wiederholte Bild des Sammelns/Zusammenbringens. „versammle mich ... in sein himmlisches Reich“ bewahrt es ohne lehrmäßige Zuspitzung.
