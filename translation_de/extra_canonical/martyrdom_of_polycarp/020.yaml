base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: de
  text: 'So erging es dem seligen Polykarp, der zusammen mit denen aus Philadelphia in Smyrna den Märtyrertod erlitt – insgesamt waren es zwölf. Mehr als die anderen wird er von allen in Erinnerung gehalten, sodass selbst die Heiden überall von ihm sprechen. Denn er erwies sich nicht nur als ein bedeutender Lehrer, sondern auch als ein herausragender Märtyrer. Sein Martyrium möchten alle nachahmen, weil es dem Vorbild des Evangeliums Christi entsprach.


    Durch sein standhaftes Ausharren überwand er im Kampf den ungerechten Herrscher und empfing so den Siegeskranz der Unsterblichkeit. Nun freut er sich in der Gemeinschaft der Apostel und aller Gerechten, verherrlicht Gott, den allmächtigen Vater, und preist unseren Herrn Jesus Christus, den Retter unserer Seelen, den Steuermann unserer Leiber und den Hirten der weltweiten Kirche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: blessed
  choice: selig
  rationale: Das in frühchristlichen Märtyrertexten übliche Ehrenprädikat wird mit dem würdigen und im Deutschen vertrauten „selig“ wiedergegeben.
- source_word: suffered martyrdom
  choice: den Märtyrertod erlitt
  rationale: Eine natürliche deutsche Wiedergabe, die den gewaltsamen Tod um des Glaubens willen klar bezeichnet.
- source_word: heathen
  choice: Heiden
  rationale: Bewahrt die antike Gegenüberstellung von christlicher Gemeinschaft und nichtchristlicher Umwelt; die historisch geprägte Bezeichnung passt zum Textregister.
- source_word: after the pattern of the Gospel of Christ
  choice: dem Vorbild des Evangeliums Christi entsprach
  rationale: Bewahrt den Gedanken einer am Evangelium beziehungsweise an Christi evangeliumsgemäßem Leiden ausgerichteten Gestalt, ohne die mögliche Beziehung weiter auszudeuten.
- source_word: endurance
  choice: standhaftes Ausharren
  rationale: Vereint Dauerhaftigkeit und bewusste Standfestigkeit im Leiden.
- source_word: crown of immortality
  choice: Siegeskranz der Unsterblichkeit
  rationale: „Siegeskranz“ macht das antike Wettkampf- und Siegesbild sichtbar und vermeidet die moderne Vorstellung einer Königskrone.
- source_word: helmsman of our bodies
  choice: Steuermann unserer Leiber
  rationale: Erhält die ungewöhnliche nautische Metapher und die konkrete körperliche Bezugnahme des Zeugnisses.
- source_word: universal Church which is throughout the world
  choice: weltweite Kirche
  rationale: Gibt die räumliche Universalität knapp und natürlich wieder, ohne eine spätere konfessionelle Eigenbezeichnung einzutragen.
theological_decisions:
- issue: Polykarps gegenwärtiger Zustand und seine Gemeinschaft mit Aposteln und Gerechten
  choice: „Nun freut er sich in der Gemeinschaft der Apostel und aller Gerechten“
  alternative: „Er freut sich zusammen mit den Aposteln und allen Gerechten“
  rationale: Die präsentische Aussage des Zeugnisses bleibt erhalten; „Gemeinschaft“ gibt das Zusammensein wieder, ohne den Zustand nach dem Tod systematisch zu erklären.
- issue: Verhältnis des Martyriums zum Evangelium Christi
  choice: „weil es dem Vorbild des Evangeliums Christi entsprach“
  alternative: „weil es nach dem Vorbild des Evangeliums Christi geschah“
  rationale: Die Formulierung bewahrt die christologische und ethische Vorbildfunktion, ohne festzulegen, ob „Evangelium“ primär die Botschaft, die Überlieferung von Jesu Leiden oder beides meint.
- issue: Titel Jesu für Seele, Leib und Kirche
  choice: Alle drei Titel werden parallel und unverkürzt beibehalten
  alternative: Die Metaphern erklärend auflösen
  rationale: Die auffällige Dreierfolge gehört zur theologischen Aussage des Textes und soll nicht harmonisiert oder abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Erzählton. Die Vorlage ist ein gemeinfreies englisches Zeugnis; eine direkte Prüfung des griechischen Wortlauts steht laut Datensatz noch aus. Deshalb wurden keine textkritischen Fußnoten oder griechisch-spezifischen Behauptungen ergänzt.
