review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorliegenden englischen Zeugen insgesamt zuverlässig. Zwei Nuancen sollten enger am Zeugen bleiben: Das Martyrium geschah „nach dem Vorbild des Evangeliums Christi“, nicht bloß in allgemeiner Entsprechung dazu; außerdem sollte die universale Kirche ausdrücklich als weltweit bezeichnet bleiben.'
  naturalness: Der Ton ist würdig und überwiegend natürlich. „von allen in Erinnerung gehalten“ ist jedoch im modernen Standarddeutsch weniger idiomatisch als „an ihn erinnert man sich ...“.
  terminology: „selig“, „Märtyrertod“, „Heiden“, „Siegeskranz“, „Steuermann“ und „Leiber“ sind registergerecht und sachlich angemessen. „lobpreist“ gibt das im Zeugen von Gott und Christus verwendete Lob-/Segensverb klarer wieder als „preist“.
  issues:
  - severity: low
    issue: Unidiomatische Formulierung zur Erinnerung an Polykarp
    rationale: „Mehr als die anderen wird er von allen in Erinnerung gehalten“ ist verständlich, aber schwerfällig. Eine aktiv-unpersönliche Formulierung ist modernes Standarddeutsch und wahrt den Vergleich.
  - severity: medium
    issue: Das Verhältnis des Martyriums zum Evangelium ist leicht abgeschwächt
    rationale: „dem Vorbild ... entsprach“ beschreibt vor allem Übereinstimmung. Der englische Zeuge sagt, das Martyrium sei „after the pattern“ des Evangeliums Christi geschehen; „nach dem Vorbild“ bewahrt die bildhafte und kausalere Formulierung.
  - severity: low
    issue: Weltweite Ausdehnung der Kirche sollte explizit bleiben
    rationale: „weltweite Kirche“ ist grundsätzlich möglich, doch der Zeuge fügt ausdrücklich „throughout the world“ hinzu. „universalen Kirche in aller Welt“ erhält sowohl Universalität als auch geographische Ausdehnung.
  revised_text: 'So erging es dem seligen Polykarp, der zusammen mit denen aus Philadelphia in Smyrna den Märtyrertod erlitt – insgesamt waren es zwölf. An ihn erinnert man sich unter allen mehr als an die anderen, sodass selbst die Heiden überall von ihm sprechen. Denn er erwies sich nicht nur als ein bedeutender Lehrer, sondern auch als ein herausragender Märtyrer, dessen Martyrium alle nachahmen wollen, weil es nach dem Vorbild des Evangeliums Christi geschah.


    Durch sein standhaftes Ausharren überwand er im Kampf den ungerechten Herrscher und empfing so den Siegeskranz der Unsterblichkeit. Er freut sich in der Gemeinschaft der Apostel und aller Gerechten, verherrlicht Gott, den allmächtigen Vater, und lobpreist unseren Herrn Jesus Christus, den Retter unserer Seelen, den Steuermann unserer Leiber und den Hirten der universalen Kirche in aller Welt.'
  revised_footnotes: []
  revision_rationale: 'Die Revision glättet eine unidiomatische deutsche Konstruktion und stellt zwei im englischen Zeugen ausdrücklich enthaltene Aspekte wieder deutlicher heraus: das Martyrium „nach dem Vorbild“ des Evangeliums Christi und die Kirche als universale Kirche „in aller Welt“. Es werden keine über den Zeugen hinausgehenden griechisch-textkritischen oder dogmatischen Festlegungen vorgenommen.'
