review_pass:
  verdict: revise
  source_fidelity: Die Darstellung folgt dem überlieferten englischen Zeugen insgesamt eng. „sich ... dazu gedrängt hatte“ schwächt jedoch das ausdrücklich wiederholte Moment des Zwangs in „had forced himself“. Die revidierte Fassung gibt dies mit „gezwungen“ wieder und bewahrt zugleich die auffällige Verbindung mit „freiwillig“.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „den Eid abzulegen“ und „Weihrauch darzubringen“ sind im Deutschen idiomatische, sachlich präzise Formulierungen für die beschriebenen kultisch-politischen Handlungen.
  terminology: „Prokonsul“, „Phrygier“, „Eid“, „Weihrauch“ und „Evangelium“ sind angemessen. Die Quellanrede lautet „Brüder“; die inklusive Erweiterung „Brüder und Schwestern“ geht über den belegten Wortlaut hinaus. Da die Anrede hier ohne Weiteres als gemeinschaftsbezogen verstanden werden kann, ist keine Ergänzung im Text oder Fußnote erforderlich.
  issues:
  - severity: medium
    issue: Die Wendung „sich selbst und einige andere dazu gedrängt hatte“ schwächt „had forced himself and some others“.
    rationale: „Drängen“ kann bloßes Anhalten oder Zureden bezeichnen; der Zeuge formuliert ausdrücklich Zwang. „gezwungen“ gibt die Aussage genauer wieder, ohne die paradoxe Verbindung mit freiwilligem Hervortreten aufzulösen.
  - severity: low
    issue: „Brüder und Schwestern“ erweitert die im Zeugen stehende Anrede „brethren“ im Haupttext.
    rationale: Die Fußnote legt die Erweiterung zwar offen, doch eine Übersetzung mit optimaler Äquivalenz sollte die knappe Quellformulierung bewahren und ihre mögliche inklusive Reichweite nicht durch zusätzliche Wörter festlegen.
  revised_text: Ein Mann aber namens Quintus, ein Phrygier, der erst vor Kurzem aus Phrygien gekommen war, verlor beim Anblick der wilden Tiere den Mut. Er war es, der sich selbst und einige andere dazu gezwungen hatte, freiwillig hervorzutreten. Diesen überredete der Prokonsul nach langem Zureden, den Eid abzulegen und Weihrauch darzubringen. Darum, Brüder, loben wir diejenigen nicht, die sich selbst ausliefern; denn das Evangelium lehrt uns das nicht.
  revised_footnotes: []
  revision_rationale: Die Revision stellt die Stärke des im Zeugen ausgedrückten Zwangs wieder her, hält die freiwillige Selbstmeldung als bewusst spannungsvolle Formulierung fest und verwendet für die kultischen Handlungen natürliches modernes Deutsch. Die Anrede wird ohne inhaltliche Erweiterung als „Brüder“ wiedergegeben.
