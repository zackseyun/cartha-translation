  english_witness: But one man, Quintus by name, a Phrygian newly arrived from Phrygia, when he saw the wild beasts, turned coward. He it was who had forced himself and some others to come forward of their own free will. This man the proconsul by much entreaty persuaded to swear the oath and to offer incense. For this cause therefore, brethren, we praise not those who deliver themselves up, since the Gospel doth not so teach us.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: de
  text: Ein Mann aber namens Quintus, ein Phrygier, der erst vor Kurzem aus Phrygien gekommen war, verlor beim Anblick der wilden Tiere den Mut. Er war es gewesen, der sich selbst und einige andere dazu gedrängt hatte, sich freiwillig zu stellen. Ihn überredete der Prokonsul nach langem Zureden, den Eid zu schwören und Weihrauch zu opfern. Darum, Brüder und Schwestern,[a] loben wir diejenigen nicht, die sich selbst ausliefern; denn das Evangelium lehrt uns das nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brüder“; die Anrede kann hier die gesamte christliche Gemeinschaft einschließen.'
    reason: Die inklusive Wiedergabe wird offengelegt, da der griechische Wortlaut noch direkt zu prüfen ist und der vorliegende englische Zeuge „brethren“ bietet.
lexical_decisions:
- source_word: turned coward
  choice: verlor … den Mut
  rationale: Gibt den Sinn in natürlichem, gegenwärtigem Deutsch wieder, ohne Quintus unnötig mit einem festen Schimpfwort zu etikettieren.
- source_word: come forward of their own free will
  choice: sich freiwillig zu stellen
  rationale: Bezeichnet im Kontext die freiwillige Selbstanzeige beziehungsweise Auslieferung an die Obrigkeit klar und idiomatisch.
- source_word: swear the oath
  choice: den Eid zu schwören
  rationale: Bewahrt den bestimmten kultisch-politischen Akt, ohne den nicht überlieferten Wortlaut des Eides zu ergänzen.
- source_word: offer incense
  choice: Weihrauch zu opfern
  rationale: Bringt den religiösen Charakter der verlangten Handlung deutlicher zum Ausdruck als das allgemeinere „Räucherwerk darbringen“.
- source_word: deliver themselves up
  choice: sich selbst ausliefern
  rationale: Bewahrt den warnenden Bezug auf freiwillige Selbstüberstellung und unterscheidet sie von standhaft ertragenem Martyrium.
theological_decisions:
- issue: Bewertung freiwillig gesuchten Martyriums
  choice: „loben wir diejenigen nicht, die sich selbst ausliefern“
  alternative: „verurteilen wir diejenigen, die sich selbst ausliefern“
  rationale: Der Zeuge sagt, dass solche Personen nicht gelobt werden; eine ausdrückliche Verurteilung wäre stärker und würde die Aussage unnötig verschärfen.
- issue: Normative Berufung auf das Evangelium
  choice: „denn das Evangelium lehrt uns das nicht“
  alternative: „denn so lehrt uns das Evangelium nicht“
  rationale: Die gewählte Formulierung macht deutlich, dass die freiwillige Selbstüberstellung gemeint ist, ohne eine zusätzliche Begründung oder Lehrregel einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Wegen der noch ausstehenden direkten Prüfung des griechischen Textes bleibt der Entwurf eng am angegebenen öffentlichen englischen Textzeugen; mögliche Nuancen der griechischen Wortwahl sollten vor der Endredaktion überprüft werden.
