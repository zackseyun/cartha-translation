review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist angezeigt. Der griechische Eröffnungssatz (παροικοῦσα / παροικούσῃ / παροικίαις; ἁγίας καὶ καθολικῆς ἐκκλησίας; πληθυνθείη) bestätigt grundsätzlich das Motiv des Fremdseins, bezeichnet die Adressaten jedoch als örtliche Gemeinden der einen „heiligen und katholischen Kirche“. „Gemeinschaften von Brüdern und Schwestern, die ... gehören“ ist gegenüber παροικίαις und der Genitivverbindung unnötig ausdeutend. „Immer reicher zuteilwerden“ fügt „immer“ hinzu und gibt „sich mehren“ weniger unmittelbar wieder.
  naturalness: Der Satz ist bereits verständlich und würdig. „Gemeinden“ ist im heutigen Standarddeutsch für die örtlichen christlichen Gemeinschaften idiomatischer und präziser als „Gemeinschaften von Brüdern und Schwestern“. Die Schlussformel „mögen sich bei euch mehren“ ist natürlich und bildet den Segenswunsch knapp ab.
  terminology: „Katholische Kirche“ ist hier als Übersetzung von καθολική sachgerecht und nicht als Bezeichnung einer späteren Konfession zu verstehen. Eine erläuternde Fußnote kann dieses historische, umfassende Verständnis absichern. „Brüder und Schwestern“ sollte nicht in den Haupttext eingeführt werden, da es im vorliegenden Satz nicht steht.
  issues:
  - severity: medium
    issue: „Gemeinschaften von Brüdern und Schwestern“ erweitert die Anrede.
    rationale: Die griechischen παροικίαι sind örtliche christliche Gemeinden; eine ausdrückliche geschlechterbezogene Bezeichnung steht hier nicht. Die Erweiterung ist daher nicht quellentreu erforderlich.
  - severity: medium
    issue: „weltweite Kirche“ glättet den etablierten Ausdruck „katholische Kirche“ zu stark.
    rationale: καθολική bedeutet hier tatsächlich universal, ist aber zugleich der frühe kirchliche Fachausdruck. „Katholisch“ sollte mit einer nichtkonfessionellen Erläuterung bewahrt werden.
  - severity: low
    issue: „immer reicher“ ergänzt einen zeitlichen Aspekt.
    rationale: πληθυνθείη erbittet Vermehrung, nicht ausdrücklich fortdauernde Steigerung. „Sich bei euch mehren“ ist näher am Wortlaut.
  revised_text: 'Die Gemeinde Gottes, die als Fremde in Smyrna lebt, an die Gemeinde Gottes, die als Fremde in Philomelion lebt, und an alle Gemeinden der heiligen und katholischen Kirche, die an jedem Ort als Fremde leben: Barmherzigkeit, Friede und Liebe von Gott, dem Vater, und unserem Herrn Jesus Christus mögen sich bei euch mehren.[a][b]'
  revised_footnotes:
  - marker: a
    text: Diese Fassung beruht vorläufig auf der angegebenen gemeinfreien englischen Übersetzung. Eine unmittelbare Prüfung der griechischen Textüberlieferung steht noch aus.
    reason: Die bereitgestellte Quellenlage kennzeichnet den englischen Zeugen ausdrücklich als vorläufige Grundlage und meldet die Prüfung des Griechischen noch als ausstehend.
  - marker: b
    text: „katholisch“ bedeutet hier „umfassend, allgemein“ und ist keine Bezeichnung einer späteren Konfession.
    reason: Der Ausdruck entspricht dem frühen kirchlichen Terminus und vermeidet zugleich eine modern-konfessionelle Fehlassoziation.
  revision_rationale: Die Revision wahrt die dreifache Wiederaufnahme des Motivs des Fremdseins, gibt die örtlichen παροικίαι mit „Gemeinden“ wieder und stellt deren Zugehörigkeit zur einen heiligen und katholischen Kirche syntaktisch näher am Quelltext dar. Die Segensformel wird ohne die zusätzliche Nuance „immer“ übersetzt. Die Ortsnamensform „Philomelion“ kann beibehalten werden.
