base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: de
  text: 'Die Gemeinde Gottes, die in Smyrna als Fremde lebt, an die Gemeinde Gottes, die in Philomelion als Fremde lebt, und an alle Gemeinschaften von Brüdern und Schwestern, die zur heiligen und weltweiten Kirche gehören und überall als Fremde leben: Barmherzigkeit, Friede und Liebe von Gott, dem Vater, und unserem Herrn Jesus Christus mögen euch immer reicher zuteilwerden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Fassung beruht vorläufig auf der angegebenen gemeinfreien englischen Übersetzung. Eine unmittelbare Prüfung der griechischen Textüberlieferung steht noch aus.
    reason: Die bereitgestellte Quellenlage kennzeichnet den englischen Zeugen ausdrücklich als vorläufige Grundlage und meldet die Prüfung des Griechischen noch als ausstehend.
lexical_decisions:
- source_word: sojourneth / sojourning (Greek review pending)
  choice: als Fremde lebt / als Fremde leben
  rationale: Bewahrt das Motiv eines vorläufigen Aufenthalts und der Fremdlingschaft, ohne das altertümliche deutsche „pilgern“ oder das bürokratische „sich aufhalten“ zu verwenden.
- source_word: brotherhoods (Greek review pending)
  choice: Gemeinschaften von Brüdern und Schwestern
  rationale: Gibt den gemeinschaftlichen Sinn natürlich wieder und macht deutlich, dass die angesprochenen christlichen Gemeinschaften Frauen und Männer umfassen.
- source_word: universal Church (Greek review pending)
  choice: weltweite Kirche
  rationale: Gibt den nicht konfessionell verengten Sinn von „universal“ verständlich wieder; „katholisch“ könnte im heutigen Deutsch vorschnell als Konfessionsbezeichnung verstanden werden.
- source_word: be multiplied
  choice: mögen euch immer reicher zuteilwerden
  rationale: Bewahrt den Segenswunsch und den Gedanken der Vermehrung in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Bedeutung der heiligen und universalen Kirche
  choice: heilige und weltweite Kirche
  alternative: heilige und katholische Kirche
  rationale: Die Übersetzung vermeidet eine spätere konfessionelle Engführung, ohne den Anspruch auf die umfassende Kirche abzuschwächen.
- issue: Adressaten der „brotherhoods“
  choice: Gemeinschaften von Brüdern und Schwestern
  alternative: Bruderschaften
  rationale: „Bruderschaften“ bezeichnet im modernen Deutsch oft besondere männliche Vereinigungen und wäre daher enger als die angesprochenen christlichen Gemeinden beziehungsweise Gemeinschaften.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „als Fremde leben“ wurde bewusst beibehalten, weil sie das leitende Motiv des Absenders und der Adressaten trägt. „Philomelion“ folgt einer im Deutschen gut lesbaren griechischen Namensform.
