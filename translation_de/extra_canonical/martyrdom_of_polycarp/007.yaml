base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young servants, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: de
  text: 'Als diejenigen, die nach ihm suchten, nicht nachließen, begab er sich auf ein anderes Landgut. Sogleich trafen seine Verfolger dort ein. Als sie ihn nicht fanden, ergriffen sie zwei junge Sklaven; einer von ihnen gab unter Folter Auskunft.


    Denn es war ihm unmöglich, verborgen zu bleiben, da gerade Menschen aus seinem eigenen Haushalt ihn verrieten. Der Polizeihauptmann, der ausgerechnet Herodes hieß, drängte darauf, ihn ins Stadion zu bringen. So sollte Polykarp das ihm bestimmte Los erfüllen und an Christi Geschick teilhaben, während sie – seine Verräter – die Strafe des Judas selbst erlitten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung dieses Abschnitts ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung der griechischen Überlieferung steht noch aus; besonders Amtsbezeichnung und einzelne Wendungen können danach präzisiert werden.
    reason: Die bereitgestellten Metadaten kennzeichnen die Prüfung des griechischen Ausgangstextes ausdrücklich als noch ausstehend.
lexical_decisions:
- source_word: farm (Greek source review pending)
  choice: Landgut
  rationale: Im antiken Zusammenhang bezeichnet das englische „farm“ eher ein ländliches Anwesen als einen modernen Bauernhof.
- source_word: slave lads (Greek source review pending)
  choice: junge Sklaven
  rationale: Bewahrt den rechtlichen und sozialen Status ausdrücklich; „Diener“ würde die Härte des antiken Verhältnisses abschwächen.
- source_word: confessed under torture (Greek source review pending)
  choice: gab unter Folter Auskunft
  rationale: Vermeidet die im Deutschen naheliegende Deutung eines Schuldbekenntnisses; gemeint ist offenbar die erzwungene Preisgabe von Informationen.
- source_word: captain of the police (Greek source review pending)
  choice: Polizeihauptmann
  rationale: Eine verständliche Funktionsbezeichnung; der genaue antike Amtstitel muss bei unmittelbarer Prüfung des Griechischen geklärt werden.
- source_word: appointed lot (Greek source review pending)
  choice: das ihm bestimmte Los
  rationale: Bewahrt die schicksals- beziehungsweise bestimmungsbezogene Bildsprache, ohne sie dogmatisch genauer festzulegen.
- source_word: partaker with Christ (Greek source review pending)
  choice: an Christi Geschick teilhaben
  rationale: Gibt die Gemeinschaft mit Christus im Leiden und Sterben natürlich wieder, ohne eine weitergehende metaphysische Aussage einzutragen.
theological_decisions:
- issue: Polykarps bestimmtes Los und seine Teilhabe an Christus
  choice: „das ihm bestimmte Los erfüllen und an Christi Geschick teilhaben“
  alternative: „seine Bestimmung erfüllen und Mitteilhaber Christi werden“
  rationale: Die gewählte Fassung erhält sowohl das Motiv der Bestimmung als auch die christologische Teilhabe, ohne deren genaue theologische Art über den Text hinaus festzulegen.
- issue: Die Strafe der Verräter
  choice: „die Strafe des Judas selbst“
  alternative: „dieselbe Strafe wie Judas“
  rationale: Die ungewöhnlich starke Formulierung des Zeugnisses wird bewahrt; sie verbindet die Verräter typologisch mit Judas, ohne die Art der Strafe zu erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Historisch belastete Begriffe wie „Sklaven“ werden nicht beschönigt. Der Eigenname wird in der geläufigen deutschen Form „Herodes“ wiedergegeben. Wegen der noch ausstehenden Prüfung des Griechischen werden textnahe Unsicherheiten in einer Fußnote offengelegt.
