review_pass:
  verdict: revise
  source_fidelity: Die wesentlichen Inhalte des bereitgestellten englischen Textzeugen sind wiedergegeben. „Verfolger“ verschärft jedoch die neutrale Suchbewegung unnötig, und „ausgerechnet“ fügt einen umgangssprachlich-wertenden Akzent hinzu, den „chanced ... being called Herod“ nicht verlangt. Die Zweckbeziehung des Handelns des Polizeihauptmanns sollte klarer markiert werden.
  naturalness: Die Erzählung ist insgesamt flüssig. „Die nach ihm suchten“ und „zufällig Herodes hieß“ sind im modernen Standarddeutsch genauer und unmarkierter als „seine Verfolger“ bzw. „ausgerechnet Herodes hieß“. „Eine Aussage machte“ vermeidet beim Verb „gestehen“ den möglichen falschen Eindruck eines Schuldeingeständnisses.
  terminology: „Landgut“, „junge Sklaven“, „Polizeihauptmann“, „das ihm bestimmte Los“ und „Herodes“ sind im Rahmen der nur indirekt geprüften Vorlage vertretbar. „als Teilhaber Christi“ bewahrt die Teilhabeformulierung enger als „an Christi Geschick teilhaben“, ohne deren Bedeutung auf Leiden oder Sterben einzuengen.
  issues:
  - severity: medium
    issue: „seine Verfolger“ statt der wiederholten Suchenden
    rationale: Der englische Zeuge sagt jeweils lediglich, dass Menschen nach ihm suchten. „Verfolger“ kann eine stärkere, bereits wertend festgelegte Charakterisierung nahelegen.
  - severity: low
    issue: „ausgerechnet Herodes hieß“
    rationale: „Ausgerechnet“ ist umgangssprachlich und legt eine besondere Ironie nahe. „Zufällig Herodes hieß“ gibt die Vorlage sachlicher wieder.
  - severity: medium
    issue: „an Christi Geschick teilhaben“
    rationale: Diese Fassung engt die allgemeinere Teilhabe an Christus auf dessen „Geschick“ ein. „als Teilhaber Christi“ wahrt die offenere Ausdrucksweise des Textzeugen.
  revised_text: 'Als diejenigen, die nach ihm suchten, nicht nachließen, begab er sich auf ein anderes Landgut. Sogleich kamen diejenigen, die nach ihm suchten, dorthin. Als sie ihn nicht fanden, ergriffen sie zwei junge Sklaven; einer von ihnen machte unter Folter eine Aussage.


    Denn es war ihm unmöglich, verborgen zu bleiben, da gerade Menschen aus seinem eigenen Haushalt ihn verrieten. Der Polizeihauptmann, der zufällig Herodes hieß, wollte ihn unbedingt ins Stadion bringen, damit er sein bestimmtes Los erfülle und als Teilhaber Christi Anteil habe, während sie – seine Verräter – die Strafe des Judas selbst erlitten.[a]'
