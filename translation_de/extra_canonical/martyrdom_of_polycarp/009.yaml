revisions:
- from: 'Als er schließlich sein Gebet beendet hatte, nachdem er aller gedacht hatte, denen er je begegnet war — der Kleinen und der Großen, der Angesehenen und der Geringen — sowie der ganzen weltweiten Kirche, war die Stunde des Aufbruchs gekommen. Sie setzten ihn auf einen Esel und brachten ihn in die Stadt; es war nämlich ein hoher Sabbat.[a]


    Herodes, der Polizeihauptmann,[b] und sein Vater Niketes kamen ihm entgegen. Sie ließen ihn in ihren Wagen umsteigen, setzten sich zu ihm und versuchten, ihn zu überreden. Sie sagten: »Was ist denn schon dabei, zu sagen: ›Der Kaiser ist Herr‹, Räucherwerk darzubringen« und Ähnliches mehr, »und dich so zu retten?« Zunächst gab er ihnen keine Antwort. Als sie jedoch nicht nachließen, sagte er: »Ich werde nicht tun, wozu ihr mir ratet.«


    Da es ihnen nicht gelang, ihn zu überreden, stießen sie Drohungen aus und zwangen ihn, schnell auszusteigen, sodass er sich beim Herabsteigen aus dem Wagen das Schienbein verletzte. Ohne sich auch nur umzudrehen, ging er unverzüglich und zügig weiter, als wäre ihm nichts geschehen, während man ihn zum Stadion brachte. Im Stadion herrschte ein solcher Tumult, dass man keine einzelne Stimme mehr hören konnte.'
