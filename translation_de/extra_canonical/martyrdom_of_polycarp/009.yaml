  naturalness: Der Stil ist überwiegend modernes, würdiges Standarddeutsch. „Drohungen ausstoßen“ ist jedoch unidiomatisch; „drohten ihm“ ist natürlich und gleichbedeutend. Die Wiedergabe der Rede lässt sich syntaktisch klarer als zusammenhängende Aufforderung formulieren.
  terminology: „Der Kaiser ist Herr“, „Räucherwerk darbringen“, „hoher Sabbat“ und die nichtkonfessionell verengende Wiedergabe der weltweiten Kirche sind angemessen. „Eirenarch“ mit einer erläuternden Fußnote wahrt den antiken Amtstitel besser als eine modern klingende Rangbezeichnung.
