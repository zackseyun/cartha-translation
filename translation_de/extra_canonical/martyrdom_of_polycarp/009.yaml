    rationale: Der Eirenarch war ein antiker lokaler Ordnungs- bzw. Sicherheitsbeamter. Die transliterierte Amtsbezeichnung mit knapper Erklärung ist quellennäher und vermeidet falsche institutionelle Präzision.
  - severity: low
    issue: „stießen sie Drohungen aus“ ist im Deutschen unnatürlich.
    rationale: „Sie drohten ihm“ gibt die Handlung idiomatisch wieder, ohne die Aussage zu verändern.
  - severity: medium
    issue: „dass man keine einzelne Stimme mehr hören konnte“ schwächt den Schlusssatz ab.
    rationale: Die Vorlage beschreibt einen Lärm, in dem keine Stimme hörbar war; „keine einzelne“ kann dagegen bedeuten, dass Stimmen zwar hörbar, aber nicht unterscheidbar waren.
