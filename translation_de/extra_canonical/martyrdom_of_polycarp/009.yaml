base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: de
  text: 'Als er schließlich sein Gebet beendet hatte, nachdem er aller gedacht hatte, denen er je begegnet war – der Kleinen und der Großen, der Angesehenen und der Geringen – sowie der ganzen weltweiten Kirche, war die Stunde des Aufbruchs gekommen. Sie setzten ihn auf einen Esel und brachten ihn in die Stadt; es war ein hoher Sabbat.[a]


    Herodes, der Eirenarch,[b] und sein Vater Niketes kamen ihm entgegen. Sie ließen ihn in ihren Wagen umsteigen, setzten sich zu ihm und versuchten, ihn zu überreden. Sie sagten: »Was ist denn schon dabei, zu sagen: ›Der Kaiser ist Herr‹, Räucherwerk darzubringen und sich so zu retten?« und Ähnliches dieser Art. Zunächst gab er ihnen keine Antwort. Als sie jedoch nicht nachließen, sagte er: »Ich werde nicht tun, wozu ihr mir ratet.«


    Da es ihnen nicht gelang, ihn zu überreden, drohten sie ihm und zwangen ihn, schnell auszusteigen, sodass er sich beim Herabsteigen aus dem Wagen das Schienbein stieß. Ohne sich auch nur umzudrehen, ging er unverzüglich und zügig weiter, als wäre ihm nichts geschehen, während man ihn zum Stadion brachte. Im Stadion herrschte ein solcher Tumult, dass keine Stimme zu hören war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche Bezeichnung »hoher Sabbat« folgt der überlieferten Formulierung. Welcher besondere Tag oder welche örtliche Bezeichnung damit genau gemeint ist, bleibt hier offen.
    reason: Die historische und sprachliche Referenz soll nicht stillschweigend harmonisiert oder näher bestimmt werden.
  - marker: b
    text: Ein Eirenarch (griechisch εἰρήναρχος) war ein örtlicher Amtsträger für Ordnung und Sicherheit. Eine genaue Gleichsetzung mit einem modernen Polizeirang wäre irreführend.
    reason: Der antike Amtstitel wird bewahrt und zugleich knapp verständlich gemacht.
lexical_decisions:
- source_word: all who at any time had come in his way
  choice: aller …, denen er je begegnet war
  rationale: Gibt die umfassende Erinnerung an alle persönlichen Begegnungen natürlich wieder, ohne die Wendung negativ als bloßes »In-die-Quere-Kommen« zu verstehen.
- source_word: small and great, high and low
  choice: der Kleinen und der Großen, der Angesehenen und der Geringen
  rationale: Bewahrt die paarweise soziale und statusbezogene Spannweite in würdiger, verständlicher Sprache.
- source_word: universal Church throughout the world
  choice: der ganzen weltweiten Kirche
  rationale: Vermeidet die im heutigen Deutschen konfessionell enger klingende Wiedergabe »katholische Kirche« und erhält den Sinn der universalen, über die Welt verbreiteten Kirche.
- source_word: hour of departure
  choice: Stunde des Aufbruchs
  rationale: Bewahrt die mögliche tiefere Konnotation des Abschieds, ohne ausdrücklich den Tod einzutragen; im unmittelbaren Erzählzusammenhang beginnt sein Aufbruch in die Stadt.
- source_word: captain of police
  choice: Polizeihauptmann
  rationale: Eine knappe funktionale Amtsbezeichnung; die historische Institution wird nicht vorschnell mit einem exakt modernen Rang gleichgesetzt.
- source_word: Caesar is Lord
  choice: Der Kaiser ist Herr
  rationale: »Kaiser« ist die natürliche deutsche Wiedergabe von Caesar als Herrschertitel; »Herr« erhält die politisch-religiöse Zuspitzung der Aussage.
- source_word: offering incense
  choice: Räucherwerk darzubringen
  rationale: Bezeichnet die kultische Handlung klar, ohne ein im Text nicht ausdrücklich genanntes Objekt der Verehrung hinzuzufügen.
- source_word: saving thyself
  choice: dich so zu retten
  rationale: Das ergänzte »so« macht den argumentativen Zusammenhang idiomatisch deutlich, lässt aber offen, ob primär die Rettung vor dem Tod oder ein umfassenderer Anspruch gemeint ist.
- source_word: tumult
  choice: Tumult
  rationale: Erhält die Stärke und Unordnung des Lärms; der Folgesatz verdeutlicht dessen akustische Wirkung.
theological_decisions:
- issue: Universale Kirche
  choice: ganze weltweite Kirche
  alternative: ganze katholische Kirche in der ganzen Welt
  rationale: Die Universalität wird vollständig bewahrt, ohne die antike Bezeichnung mit einer heutigen Konfessionsbezeichnung gleichzusetzen.
- issue: Kaiserbekenntnis
  choice: »Der Kaiser ist Herr«
  alternative: »Caesar ist Herr«
  rationale: Die deutsche Titelform ist verständlicher und bewahrt zugleich den bewussten Gegensatz zu christlicher Herr-Sprache, ohne ihn im Text auszulegen.
- issue: Stunde des Aufbruchs
  choice: nicht ausdrücklich als Todesstunde ausgelegt
  alternative: Stunde seines Todes
  rationale: Die mehrdeutige Abschieds- und Aufbruchssprache bleibt erhalten; eine theologische oder narrative Vorwegnahme wird vermieden.
- issue: Hoher Sabbat
  choice: wörtlich beibehalten
  alternative: großer Festtag / besonderer Sabbat
  rationale: Die ungewöhnliche Bezeichnung wird nicht harmonisiert oder historisch erklärt, da die vorliegende Grundlage ihre genaue Referenz nicht sicher klärt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Direkte Rede ist natürlich, aber nicht salopp. Die Vorlage ist ausdrücklich nur ein gemeinfreies englisches Übersetzungszeugnis; eine unmittelbare Prüfung der griechischen Handschriftentradition steht noch aus. Daher wurden auffällige oder mehrdeutige Wendungen bewahrt und nötigenfalls transparent angemerkt.
