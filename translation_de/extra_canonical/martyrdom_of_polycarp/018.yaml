base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: de
  text: 'Doch der eifersüchtige, neidische Böse, der Widersacher der Gemeinschaft der Gerechten, sah die Größe seines Martyriums, seinen von Anfang an untadeligen Lebenswandel, wie er mit dem Kranz der Unvergänglichkeit gekrönt worden war und einen Siegespreis errungen hatte, den niemand bestreiten konnte. Deshalb sorgte er dafür, dass wir nicht einmal Polykarps Leib an uns nehmen konnten, obwohl viele dies tun und an seinem heiligen Fleisch Anteil haben wollten.[a]


    So schickte er Niketes, den Vater des Herodes und Bruder der Alke, vor. Dieser sollte den Statthalter bitten, Polykarps Leib nicht herauszugeben: »Sonst«, so hieß es, »verlassen sie noch den Gekreuzigten und beginnen, diesen Mann zu verehren.« Dazu hatten ihn die Juden angestiftet und nachdrücklich gedrängt. Sie hielten auch Wache, als wir den Leib aus dem Feuer holen wollten. Dabei wussten sie nicht, dass es uns unmöglich ist, Christus jemals zu verlassen – ihn, der für die Rettung der ganzen Welt, für alle, die gerettet werden, gelitten hat,[b] der Schuldlose für die Sünder – oder irgendeinen anderen zu verehren.


    Denn ihn beten wir an, weil er der Sohn Gottes ist. Die Märtyrer aber lieben wir als Jünger und Nachahmer des Herrn, wie sie es wegen ihrer unvergleichlichen Treue zu ihrem eigenen König und Lehrer verdienen. Möge auch uns zuteilwerden, mit ihnen Gemeinschaft zu haben und ihre Mitjünger zu sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier sinngemäß »an seinem heiligen Fleisch teilhaben«. Gemeint sein kann, seinen Leib zu berühren, seine sterblichen Überreste zu bergen oder Anteil an dem zu erhalten, was von ihm blieb.
    reason: Die englische Zeugenübersetzung verengt den griechischen Ausdruck auf „touch“; die Fußnote bewahrt dessen echte Bedeutungsbreite.
  - marker: b
    text: Die griechische Formulierung ist stark verdichtet und lässt sich wörtlich etwa als »für die Rettung der ganzen Welt derer, die gerettet werden« wiedergeben. Wie »ganze Welt« und »die gerettet werden« genau aufeinander zu beziehen sind, bleibt offen.
    reason: Die Fußnote bewahrt eine syntaktische und theologische Spannung, statt sie stillschweigend aufzulösen.
lexical_decisions:
- source_word: γένος τῶν δικαίων
  choice: Gemeinschaft der Gerechten
  rationale: Das griechische γένος kann Geschlecht, Volk oder Gemeinschaft bezeichnen. „Gemeinschaft“ ist im heutigen Deutsch natürlich und vermeidet eine unbeabsichtigte biologische Verengung.
- source_word: μαρτυρία
  choice: Martyrium
  rationale: Im Kontext bezeichnet das Wort Polykarps öffentliches Todeszeugnis. „Martyrium“ bewahrt sowohl den Zeugnis- als auch den Leidensaspekt.
- source_word: πολιτεία
  choice: Lebenswandel
  rationale: Gemeint ist die gesamte Lebensführung, nicht eine politische Verfassung oder bloßes Verhalten in einer Einzelsituation.
- source_word: ἀφθαρσία
  choice: Unvergänglichkeit
  rationale: Bewahrt den eschatologischen Sinn und legt den Begriff nicht ausschließlich als körperliche Unverweslichkeit aus.
- source_word: βραβεῖον
  choice: Siegespreis
  rationale: Gibt das Bild eines im Wettkampf verliehenen Preises wieder und passt zur unmittelbar vorausgehenden Kranzmetaphorik.
- source_word: κοινωνῆσαι τῷ ἁγίῳ αὐτοῦ σαρκίῳ
  choice: an seinem heiligen Fleisch Anteil haben
  rationale: Bewahrt die stärkere und mehrdeutige Sprache des griechischen κοινωνεῖν; ein bloßes „berühren“ wäre zu eng.
- source_word: προσκυνοῦμεν
  choice: beten wir an
  rationale: Markiert im Schlussabsatz die allein dem Sohn Gottes geltende kultische Verehrung deutlich.
- source_word: ἀγαπῶμεν
  choice: lieben wir
  rationale: Bewahrt die ausdrückliche Unterscheidung zwischen der Anbetung Christi und der Liebe zu den Märtyrern.
- source_word: εὔνοια
  choice: Treue
  rationale: Im Verhältnis der Märtyrer zu ihrem König und Lehrer bezeichnet das Wort hingebungsvolle Zuneigung und Loyalität; „Treue“ klingt im Deutschen hier natürlich und würdig.
theological_decisions:
- issue: Verhältnis der Verehrung Christi zur Wertschätzung der Märtyrer
  choice: Christus wird „angebetet“, die Märtyrer werden „geliebt“.
  alternative: Für beide Beziehungen „verehren“ verwenden.
  rationale: Der griechische Text unterscheidet ausdrücklich zwischen προσκυνεῖν für den Sohn Gottes und ἀγαπᾶν für die Märtyrer. Diese theologisch bedeutsame Abgrenzung darf nicht eingeebnet werden.
- issue: Reichweite der Rettungsaussage
  choice: „für die Rettung der ganzen Welt, für alle, die gerettet werden“ mit Fußnote zur gedrängten Syntax
  alternative: „für die Rettung aller Menschen“ oder „nur für die Rettung der Geretteten“
  rationale: Die griechische Formulierung verbindet „ganze Welt“ und „die gerettet werden“ syntaktisch ungewöhnlich. Die Übersetzung erhält beide Elemente, ohne die Spannung universalistisch oder partikularistisch aufzulösen.
- issue: Kollektive Bezeichnung „die Juden“
  choice: Die historische Bezeichnung des Textes bleibt stehen.
  alternative: Verallgemeinernd umformulieren oder die Aussage auf namentlich ungenannte Einzelpersonen beschränken.
  rationale: Die Übersetzung soll die polemische historische Behauptung des antiken Autors weder verschärfen noch stillschweigend umschreiben. Die Formulierung ist als Stimme dieses Dokuments wiedergegeben, nicht als pauschales Urteil über Juden.
- issue: Heiligkeit des Leibes des Märtyrers
  choice: „heiliges Fleisch“ wird als auffällige Quellensprache bewahrt.
  alternative: Neutral „sterbliche Überreste“ schreiben.
  rationale: Die konkrete Körper- und Reliquiensprache gehört zur Aussage des Textes. Ihre Bedeutung wird nicht konfessionell weiterbestimmt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die antike Kranz- und Wettkampfmetaphorik bleibt erhalten. Namen folgen einer geläufigen deutschen Umschrift. Der Entwurf stützt sich auf die rekonstruierbare griechische Textgestalt der Handschriftentradition und berücksichtigt den bereitgestellten englischen Zeugen; abweichende Lesarten der griechischen Überlieferung sollten vor der Endpublikation nochmals textkritisch geprüft werden.
