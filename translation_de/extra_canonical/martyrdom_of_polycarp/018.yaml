review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Gedankengang und die wesentlichen Begriffe überwiegend treffend wieder. Einige Stellen lösen jedoch die griechische Syntax bzw. Zeitstufe zu stark auf: Das futurische „unmöglich sein wird“ sollte erhalten bleiben; die ungewöhnliche Verbindung von „ganze Welt“ und „die gerettet werden“ ist enger abzubilden. Die Fußnote a behauptet zutreffend eine Bedeutungsbreite von κοινωνῆσαι, doch der deutsche Haupttext sollte nicht die missverständliche Wendung „an ... Fleisch Anteil haben“ verwenden.'
  naturalness: Der Stil ist insgesamt modernes, würdiges Standarddeutsch. „Polykarps Leib an uns nehmen“ ist jedoch keine natürliche deutsche Wiedergabe von „den Leib an sich nehmen/wegnehmen“. Auch „Sie hielten Wache“ klingt, als bewachten die genannten Personen den Ort; gemeint ist hier, dass sie den Vorgang beobachteten. Die Schlussformulierung lässt sich idiomatischer und zugleich näher am Ausgangstext fassen.
  terminology: „Martyrium“, „Lebenswandel“, „Kranz der Unvergänglichkeit“, „Siegespreis“ und die Differenzierung zwischen Christus „anbeten“ und die Märtyrer „lieben“ sind angemessen. Für εὔνοια ist „Zuneigung“ genauer als das enger loyale „Treue“. „Heiliges Fleisch“ bewahrt die markante Körpermetaphorik; die Fußnote erläutert sie ohne konfessionelle Festlegung.
  issues:
  - severity: medium
    issue: Unnatürliche und semantisch ungenaue Wiedergabe von ληφθῆναι
    rationale: „wir ... Polykarps Leib an uns nehmen konnten“ ist im Deutschen unidiomatisch. Der Kontext besagt, dass die Gemeinde den Leichnam nicht an sich bzw. aus dem Feuer wegnehmen konnte.
  - severity: medium
    issue: Futurische Aussage wird als Gegenwart wiedergegeben
    rationale: Der Text sagt, dass es der Gemeinde künftig niemals möglich sein wird, Christus zu verlassen oder einen anderen anzubeten. „dass es uns unmöglich ist“ verliert diese Zeitstufe.
  - severity: medium
    issue: Die verdichtete Formulierung zur Rettung wird zu stark geglättet
    rationale: „für die Rettung der ganzen Welt, für alle, die gerettet werden“ macht aus der auffälligen Genitivverbindung zwei koordinierte Aussagen. Die Spannung sollte im Haupttext erkennbar bleiben und in der Fußnote erläutert werden.
  - severity: low
    issue: „Sie hielten auch Wache“ ist zu stark
    rationale: Das Verb bezeichnet hier ihr Beobachten des Versuchs, den Leib aus dem Feuer zu nehmen, nicht notwendig das Bewachen eines Ortes.
  - severity: low
    issue: εὔνοια als „Treue“ verengt
    rationale: Im Kontext meint εὔνοια besonders wohlwollende, hingebungsvolle Zuneigung. „Zuneigung“ bewahrt den affektiven Sinn besser.
  revised_text: 'Doch der eifersüchtige und neidische Böse, der Widersacher des Geschlechts der Gerechten, hatte die Größe seines Martyriums und seinen von Anfang an untadeligen Lebenswandel gesehen, ebenso wie er mit dem Kranz der Unvergänglichkeit gekrönt worden war und den unbestreitbaren Siegespreis empfangen hatte. So bewirkte er, dass nicht einmal sein armer Leib von uns weggenommen werden konnte, obwohl viele dies tun und an seinem heiligen Fleisch teilhaben wollten.[a]


    So schob er Niketes vor, den Vater des Herodes und Bruder der Alke, damit dieser den Statthalter bitte, seinen Leib nicht herauszugeben: »Sonst«, so hieß es, »verlassen sie noch den Gekreuzigten und beginnen, diesen Menschen zu verehren.« Dies geschah auf Betreiben und nachdrückliches Drängen der Juden, die auch beobachteten, als wir im Begriff waren, ihn aus dem Feuer zu nehmen. Sie wussten nicht, dass es uns niemals möglich sein wird, Christus zu verlassen – ihn, der zur Rettung der ganzen Welt derer, die gerettet werden, gelitten hat,[b] der Schuldlose für Sünder – oder irgendeinen anderen zu verehren.


    Denn ihn beten wir an, weil er der Sohn Gottes ist; die Märtyrer aber lieben wir als Jünger und Nachahmer des Herrn, wie sie es wegen ihrer unvergleichlichen Zuneigung zu ihrem eigenen König und Lehrer verdienen. Möge auch uns zuteilwerden, als ihre Teilhaber und Mitjünger befunden zu werden.'
  revised_footnotes:
  - marker: a
    text: Die Formulierung bedeutet wörtlich etwa, »an seinem heiligen Fleisch teilzuhaben«. Im Zusammenhang kann dies das Berühren seines Leibes, die Beteiligung an seiner Bergung oder Anteil an dem bezeichnen, was von ihm zurückblieb.
    reason: κοινωνῆσαι ist weiter als bloßes „berühren“; die Fußnote bewahrt die kontextuell mögliche Bedeutungsbreite.
  - marker: b
    text: Die griechische Formulierung ist stark verdichtet und lässt sich wörtlich etwa als »zur Rettung der ganzen Welt derer, die gerettet werden« wiedergeben. Wie »ganze Welt« und »die gerettet werden« genau aufeinander zu beziehen sind, bleibt offen.
    reason: Die Anmerkung erklärt die ungewöhnliche Syntax, ohne ihre theologische Reichweite festzulegen.
  revision_rationale: Die Revision beseitigt unidiomatische Formulierungen, stellt die futurische Aussage wieder her, bildet die verdichtete Syntax zur Rettung enger nach und präzisiert Beobachten sowie die affektive Bedeutung von εὔνοια. Die Mehrdeutigkeit von κοινωνῆσαι und die offene Reichweite der Rettungsaussage bleiben ausdrücklich erhalten.
