base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: de
  text: 'Als er jedoch darauf beharrte und erneut sagte: »Schwöre beim Glück des Cäsars!«,[a] antwortete Polykarp: »Wenn du dir vergeblich einbildest, ich werde beim Glück des Cäsars schwören, wie du sagst, und so tust, als wüsstest du nicht, wer ich bin, dann höre es klar und deutlich: Ich bin Christ. Wenn du aber die Lehre des Christentums kennenlernen willst, setze einen Tag an und höre mich an.«


    Der Prokonsul sagte: »Überzeuge das Volk!« Polykarp aber erwiderte: »Dich hätte ich eines Gesprächs für würdig gehalten. Denn wir sind gelehrt worden, den von Gott eingesetzten Herrschern und Obrigkeiten die gebührende Ehre zu erweisen, soweit uns das nicht schadet.[b] Diese Leute aber halte ich nicht für würdig, dass ich mich vor ihnen verteidige.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet „Glück“ oder „Fortuna“. In der römischen Kaiserzeit konnte die Fortuna des Cäsars kultisch verehrt und in einer religiös verpflichtenden Schwurformel angerufen werden.
    reason: Erläutert die historische und kultische Tragweite von τύχη Καίσαρος, ohne den Ausdruck als „Schutzgeist“ zu verengen.
  - marker: b
    text: 'Auch möglich: »sofern es uns nicht verletzt«. Die Aussage lässt offen, ob körperlicher, moralischer oder geistlicher Schaden gemeint ist.'
    reason: Die Reichweite von „Schaden“ bleibt im überlieferten Wortlaut offen.
lexical_decisions:
- source_word: 'genius of Caesar (Greek tradition: τύχη Καίσαρος)'
  choice: Schutzgeist Cäsars
  rationale: Die Wendung bezeichnet im römischen Kaiserkult die göttlich gedachte Schutzmacht bzw. das Glück des Kaisers. »Schutzgeist« ist im Deutschen verständlicher als das missverständliche Fremdwort »Genius«, während die Fußnote den kultischen Zusammenhang wahrt.
- source_word: doctrine/teaching of Christianity
  choice: Lehre des Christentums
  rationale: »Lehre« gibt den sachlichen Inhalt wieder und bewahrt den frühchristlichen Sprachcharakter, ohne eine bestimmte Konfession vorauszusetzen.
- source_word: prevail upon / persuade
  choice: überzeuge
  rationale: Der Prokonsul fordert Polykarp knapp dazu auf, sich an die Menge zu wenden und sie für sich einzunehmen.
- source_word: princes and authorities
  choice: Herrschern und Obrigkeiten
  rationale: Die Paarung ist idiomatisch und wahrt die Unterscheidung zwischen regierenden Personen und amtlichen Gewalten.
- source_word: defend myself
  choice: mich ... verteidige
  rationale: Gibt die forensische Bedeutung im Prozesszusammenhang natürlich wieder.
theological_decisions:
- issue: Ehrerweisung gegenüber staatlicher Gewalt
  choice: »den von Gott eingesetzten Herrschern und Obrigkeiten die gebührende Ehre zu erweisen, soweit uns das nicht schadet«
  alternative: »... sofern es uns nicht verletzt« oder »... soweit es uns nicht zum Schaden gereicht«
  rationale: Die Formulierung bewahrt zugleich die Anerkennung staatlicher Ordnung und Polykarps Grenze gegenüber einem kultischen Eid. Sie bestimmt nicht näher, ob der Schaden körperlich, moralisch oder geistlich gemeint ist.
- issue: Polykarps Selbstbezeichnung
  choice: »Ich bin Christ«
  alternative: »Ich bin ein Christ«
  rationale: Die prädikative Form ohne Artikel klingt im modernen Deutsch klar und feierlich und bewahrt den öffentlichen Bekenntnischarakter.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede bleibt knapp und entschieden. Da eine unmittelbare Prüfung des griechischen Wortlauts laut Datensatz noch aussteht, folgt der Entwurf dem bereitgestellten englischen Zeugen unter vorsichtiger Berücksichtigung der bekannten griechischen Wendung τύχη Καίσαρος; strittige Nuancen werden nicht dogmatisch festgelegt.
