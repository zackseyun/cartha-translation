base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: de
  text: 'Als Polykarp das Stadion betrat, kam eine Stimme vom Himmel zu ihm: »Sei stark, Polykarp, und zeige dich als Mann!« Niemand sah den Sprecher; doch die Unseren, die anwesend waren, hörten die Stimme. Als er schließlich vorgeführt wurde, entstand großer Aufruhr, denn man hatte gehört, dass Polykarp ergriffen worden war.


    Als man ihn vor den Prokonsul brachte, fragte dieser ihn, ob er es sei. Nachdem er es bekannt hatte, versuchte der Prokonsul, ihn zum Widerruf zu bewegen. Er sagte: »Nimm Rücksicht auf dein Alter«, und anderes dieser Art, wie sie es gewöhnlich sagen: »Schwöre beim Glück des Kaisers[a], ändere deinen Sinn und sage: ›Fort mit den Gottlosen!‹« Da blickte Polykarp mit ernstem Gesicht auf die ganze Menge gesetzloser Heiden im Stadion, deutete mit der Hand auf sie, seufzte, sah zum Himmel auf und sagte: »Fort mit den Gottlosen!«


    Doch als der Prokonsul weiter in ihn drang und sagte: »Leiste den Eid, dann lasse ich dich frei. Verfluche Christus!«, erwiderte Polykarp: »Sechsundachtzig Jahre diene ich ihm, und er hat mir kein Unrecht getan. Wie könnte ich da meinen König lästern, der mich gerettet hat?«


    [a] Gemeint ist die Fortuna, das Glück beziehungsweise die als göttlich gedachte Schicksalsgunst des römischen Kaisers; die Formel gehört zum Herrscherkult.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Fortuna, das Glück beziehungsweise die als göttlich gedachte Schicksalsgunst des römischen Kaisers; die Formel gehört zum Herrscherkult.
    reason: Korrigiert die Erklärung entsprechend dem griechischen τύχη und erläutert die kultische Formel ohne den unzutreffenden Begriff „Schutzgeist“.
lexical_decisions:
- source_word: ἀνδρίζου
  choice: zeige dich als Mann
  rationale: Bewahrt die konkrete, zeitgeschichtlich geprägte Aufforderung des griechischen Ausdrucks, statt sie vollständig zum allgemeineren »sei mutig« einzuebnen.
- source_word: Καίσαρος τύχην
  choice: Schutzgeist des Kaisers
  rationale: Gibt den römischen Herrscherkult verständlich wieder. Eine Fußnote erklärt den antiken religiösen Bezug; »Glück des Kaisers« wäre im heutigen Deutsch missverständlich.
- source_word: μετανόησον
  choice: ändere deinen Sinn
  rationale: Bewahrt den Grundsinn einer inneren Umkehr, ohne an dieser Stelle vorschnell eine spezifisch christliche Bußformel in den Mund des Prokonsuls zu legen.
- source_word: τοὺς ἀθέους
  choice: die Gottlosen
  rationale: Gibt die antike polemische Bezeichnung wieder und erhält die Ironie, dass Polykarp den Zuruf gegen die heidnische Menge wendet. »Atheisten« würde leicht die moderne weltanschauliche Bedeutung nahelegen.
- source_word: ἠσέβησεν
  choice: hat mir kein Unrecht getan
  rationale: Entspricht im Zusammenhang Polykarps Aussage über die unverbrüchliche Güte Christi; vermeidet die im Deutschen unnatürliche Formulierung »sich gegen mich gottlos verhalten«.
- source_word: βλασφημῆσαι
  choice: lästern
  rationale: Erhält den religiös gewichtigen Sinn einer schmähenden Rede gegen Christus und passt zur Selbstbezeichnung »mein König«.
theological_decisions:
- issue: Gegenstand des vom Prokonsul verlangten Widerrufs
  choice: ihn zum Widerruf zu bewegen
  alternative: ihn dazu zu bewegen, Christus zu verleugnen
  rationale: Der griechische Gedankengang zielt auf Verleugnung, nennt das Objekt an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese Knappheit; die spätere Aufforderung, Christus zu verfluchen, macht den Bezug deutlich.
- issue: Bedeutung der sechsundachtzig Jahre
  choice: »Sechsundachtzig Jahre diene ich ihm«
  alternative: »Seit sechsundachtzig Jahren bin ich sein Diener«
  rationale: Lässt offen, ob Polykarp sein gesamtes Lebensalter oder die Zeit seit seiner Hinwendung zu Christus meint; diese historische und theologische Ambiguität wird nicht aufgelöst.
- issue: Christus als Retter und König
  choice: »meinen König …, der mich gerettet hat«
  alternative: »meinen König und Retter«
  rationale: 'Bewahrt die prädikative Aussage des Zeugnisses: Christus ist Polykarps König und hat ihn gerettet, ohne daraus einen zusammengesetzten Titel zu machen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerischer Klarheit. Die amtliche Bezeichnung »Prokonsul« bleibt erhalten. Direkte Rede ist kraftvoll, aber nicht unnötig archaisiert. Da die bereitgestellten Metadaten eine noch ausstehende direkte Quellenprüfung vermerken, wurde der griechische Wortlaut der überlieferten Texttradition bei zentralen Entscheidungen berücksichtigt, während textkritisch unsichere Einzelheiten nicht künstlich behauptet werden.
