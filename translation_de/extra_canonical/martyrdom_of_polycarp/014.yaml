review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den bereitgestellten englischen Zeugen insgesamt genau wieder. Eine unmittelbare Kontrolle am griechischen Wortlaut bleibt nach den Metadaten noch ausstehend. Zwei Formulierungen sollten näher am Zeugen und an der wahrscheinlichen Aussage bleiben: „früher nicht selbst zu tun“ fügt ein nicht belegtes „selbst“ ein; „zuerst berühren durfte“ verschiebt das einfache „wer ... am schnellsten berühren würde“ in eine Erlaubnis- und Reihenfolgeaussage. Die Anrede „der“ für den göttlichen Handelnden ist möglich, aber „Er“ bildet die bewusst ehrerbietige, nicht namentliche Referenz des Zeugen besser ab.'
  naturalness: Das Deutsch ist flüssig, modern und dem narrativ-würdigen Register angemessen. „Sofort trugen ... zusammen“ ist verständlich, doch „sammelten ... zusammen“ folgt der kollektiven Beschaffung des Brennmaterials idiomatischer. „um ihn herum an“ ist bei den nicht näher bestimmten Vorrichtungen verständlich; „brachte man ... in Stellung“ ist natürlicher und wahrt die Unbestimmtheit.
  terminology: „Holz und Reisig“, „Obergewänder“, „Scheiterhaufen“, „Pfahl“ und „Nägel“ sind sachgerecht. „Leib“ ist als würdige Wiedergabe von „flesh“ vertretbar. Die Fußnote zur kollektivierenden, antijüdischen Erzählerpolemik ist notwendig und sachlich; der Wortlaut sollte klarstellen, dass die Aussage die im Text behauptete Beteiligung einer Gruppe in dieser konkreten Situation verallgemeinert, statt lediglich eine abstrakte Pauschalität zu benennen.
  issues:
  - severity: medium
    issue: Zusatz „selbst“ bei Polykarps Schuhen
    rationale: Der Zeuge sagt nur, dass er dies zuvor nicht zu tun pflegte. „Nicht selbst“ kann nahelegen, andere hätten ihm gewöhnlich die Schuhe ausgezogen; dafür bietet der vorgelegte Zeuge keinen Anhalt.
  - severity: medium
    issue: „zuerst berühren durfte“ für „who should soonest touch“
    rationale: „Durfte“ führt eine Erlaubnis ein, „zuerst“ macht aus zeitlicher Eile eine feste Rangfolge. Der Sinn ist vielmehr, dass die Gläubigen eifrig darum wetteiferten, ihn möglichst rasch zu berühren.
  - severity: low
    issue: Relativpronomen „der“ für die göttliche Referenz
    rationale: Die großgeschriebene Anrede „Er“ erhält im Deutschen besser die im Zeugen markierte ehrerbietige, nicht explizit benannte Gottesreferenz.
  - severity: low
    issue: Fußnote zur Aussage über Juden kann den konkreten Kontext präziser benennen
    rationale: Die Einordnung soll die kollektivierende Aussage als Perspektive des antiken Erzählers kenntlich machen, ohne ihren historischen Aussageanspruch zu verallgemeinern oder den Haupttext abzuschwächen.
