translation:
  language: de
  text: '13


    Dies alles geschah mit einer Schnelligkeit, die sich kaum in Worte fassen lässt. Sofort trugen die Menschen aus den Werkstätten und Bädern Holz und Reisig zusammen; besonders eifrig halfen dabei die Juden mit, wie es bei ihnen üblich ist.[a]


    Als der Scheiterhaufen bereit war, legte Polykarp alle seine Obergewänder ab und löste seinen Gürtel. Er versuchte auch, seine Schuhe auszuziehen, obwohl er dies früher nicht selbst zu tun pflegte: Denn die Gläubigen wetteiferten jederzeit darum, wer seinen Leib zuerst berühren durfte. Schon bevor sein Haar grau geworden war, hatte man ihm wegen seines heiligen Lebens jede Ehre erwiesen.


    Sogleich brachte man die für den Scheiterhaufen vorbereiteten Gerätschaften um ihn herum an. Als man ihn auch noch an den Pfahl nageln wollte, sagte er: »Lasst mich so, wie ich bin. Denn der mir gewährt, das Feuer auszuhalten, wird mir auch gewähren, unbeweglich auf dem Scheiterhaufen zu bleiben – selbst ohne den Halt, den ihr mir durch die Nägel geben wollt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die pauschale Wendung »wie es bei ihnen üblich ist« gibt die polemische Sicht des antiken Erzählers wieder. Sie ist keine sachliche Aussage über Juden im Allgemeinen und darf nicht zur Rechtfertigung von Judenfeindschaft verwendet werden.
    reason: Historische und ethische Einordnung einer kollektivierenden antijüdischen Aussage bei gleichzeitiger Wahrung des überlieferten Textes.
lexical_decisions:
- source_word: timber and faggots
  choice: Holz und Reisig
  rationale: Gibt die beiden Arten von Brennmaterial in natürlichem modernem Deutsch wieder; „Reisig“ bezeichnet gebündelte dünne Zweige.
- source_word: all his upper garments
  choice: alle seine Obergewänder
  rationale: Bewahrt den Bezug auf die äußeren Kleidungsstücke, ohne fälschlich vollständige Nacktheit zu behaupten.
- source_word: touch his flesh
  choice: seinen Leib berühren
  rationale: „Leib“ ist in diesem ehrfürchtigen Zusammenhang natürlicher und würdevoller als das im heutigen Deutsch leicht abwertend wirkende „Fleisch“, ohne den körperlichen Sinn aufzugeben.
- source_word: instruments that were prepared for the pile
  choice: die für den Scheiterhaufen vorbereiteten Gerätschaften
  rationale: Die Art der Gegenstände bleibt im Zeugen unbestimmt; „Gerätschaften“ wahrt diese Unbestimmtheit.
- source_word: stake
  choice: Pfahl
  rationale: Entspricht dem Hinrichtungsaufbau im unmittelbaren Kontext und vermeidet, ohne gesicherte griechische Prüfung ausdrücklich „Kreuz“ einzutragen.
- source_word: security ... from the nails
  choice: den Halt ... durch die Nägel
  rationale: „Halt“ vermittelt die beabsichtigte mechanische Sicherung in klarem modernem Deutsch.
theological_decisions:
- issue: Göttlicher Beistand im Martyrium
  choice: „der mir gewährt … wird mir auch gewähren“
  alternative: „Gott, der mich befähigt …“
  rationale: Die Umschreibung erhält Polykarps Vertrauen auf den göttlichen Geber, ohne den im vorliegenden Zeugen nicht ausdrücklich genannten Namen einzusetzen oder die Aussage dogmatisch auszuweiten.
- issue: Verehrung Polykarps durch die Gläubigen
  choice: „wegen seines heiligen Lebens jede Ehre erwiesen“
  alternative: „als Heiliger verehrt“
  rationale: Die gewählte Formulierung hält sich an Lebensführung und Ehrung und vermeidet, eine später institutionalisierte Form der Heiligenverehrung in den Text zurückzulesen.
- issue: Pauschale Aussage über Juden
  choice: Die historisch überlieferte Aussage bleibt im Haupttext erhalten und wird durch eine Fußnote eingeordnet.
  alternative: Die Wendung auslassen oder verallgemeinern.
  rationale: Die problematische antike Polemik darf weder verschwiegen noch als zeitlose theologische Behauptung bekräftigt werden.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Kurze Absätze und direkte Rede bewahren die erzählerische Dringlichkeit. Der Entwurf beruht mangels bereitgestellten griechischen Wortlauts auf dem angegebenen gemeinfreien englischen Zeugen; eine direkte Prüfung der griechischen Handschriftentradition bleibt erforderlich.
