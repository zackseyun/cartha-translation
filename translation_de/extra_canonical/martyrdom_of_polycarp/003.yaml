base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: de
  text: 'Darum sind alle Martyrien, die nach Gottes Willen geschehen sind, selig und ruhmvoll. Denn wir müssen sehr gewissenhaft sein und Gott die Macht über alles zuschreiben.


    Wer könnte ihre edle Haltung, ihre geduldige Ausdauer und ihre Treue zum Herrn nicht bewundern? Sie wurden von Geißelhieben so zerfetzt, dass der Aufbau ihres Fleisches bis zu den innen liegenden Venen und Arterien sichtbar wurde. Dennoch hielten sie geduldig aus, sodass selbst die Umstehenden Mitleid hatten und weinten. Sie selbst aber bewiesen solchen Mut, dass keiner von ihnen einen Schrei oder ein Stöhnen ausstieß. So zeigten sie uns allen, dass die Märtyrer Christi in jener Stunde, während sie gefoltert wurden, dem Fleisch entrückt waren – oder vielmehr, dass der Herr bei ihnen stand und mit ihnen redete.


    Weil sie auf die Gnade Christi achteten, verachteten sie die Qualen dieser Welt und erkauften sich um den Preis einer einzigen Stunde die Befreiung von ewiger Strafe.[a] Das Feuer ihrer unmenschlichen Peiniger empfanden sie als kalt; denn sie hielten sich die Rettung vor dem ewigen, unauslöschlichen Feuer vor Augen. Mit den Augen ihres Herzens schauten sie auf die guten Dinge, die denen vorbehalten sind, die geduldig ausharren: Dinge, die kein Ohr gehört und kein Auge gesehen hat und die in keines Menschen Herz gekommen sind. Der Herr aber zeigte sie ihnen, denn sie waren nicht länger Menschen, sondern schon Engel.[b]


    Ebenso ertrugen auch diejenigen, die den wilden Tieren vorgeworfen werden sollten, furchtbare Qualen. Man zwang sie, auf scharfen Muschelschalen zu liegen, und setzte ihnen mit vielfältigen weiteren Foltern zu. Durch die fortgesetzte Qual wollte der Teufel sie, wenn möglich, zum Verleugnen bringen; denn er wandte viele Listen gegen sie an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Erkauften sich“ gibt die Kaufmetapher des Textes wieder: Einer kurzen Leidenszeit wird die Befreiung von ewiger Strafe gegenübergestellt.'
    reason: Die starke soteriologische Metapher soll erhalten bleiben, ohne stillschweigend zu einer umfassenden Lehre über Verdienst oder Erlösung ausgebaut zu werden.
  - marker: b
    text: 'Wörtlich und zugespitzt: „denn sie waren nicht mehr Menschen, sondern bereits Engel“. Gemeint ist ihre durch Gottes Offenbarung und Nähe geprägte, über das gewöhnliche menschliche Maß hinausgehende Haltung im Leiden.'
    reason: Die Aussage kann ontologisch missverstanden werden; die Anmerkung erläutert ihren rhetorischen Kontext, ohne den Haupttext abzuschwächen.
lexical_decisions:
- source_word: μαρτύρια / martyrdoms
  choice: Martyrien
  rationale: Der frühchristliche Fachbegriff bezeichnet hier sowohl das leidvolle Zeugnis als auch den Tod um Christi willen. „Martyrien“ wahrt diesen historischen und theologischen Umfang besser als nur „Märtyrertode“.
- source_word: γενναῖα / noble
  choice: ruhmvoll; edle Haltung
  rationale: Je nach syntaktischem Zusammenhang gibt „ruhmvoll“ die Würdigung der Martyrien und „edle Haltung“ die bewunderte Gesinnung der Leidenden natürlich wieder.
- source_word: ὑπομονή / patient endurance
  choice: geduldige Ausdauer; geduldig ausharren
  rationale: Bewahrt sowohl das aktive Standhalten als auch die Geduld unter Leiden.
- source_word: δεσπότης / Master
  choice: Herr
  rationale: „Herr“ ist im modernen deutschen christlichen Sprachgebrauch würdig und verständlich; „Gebieter“ wäre härter und weniger natürlich.
- source_word: οἰκονομία τῆς σαρκός / mechanism of their flesh
  choice: Aufbau ihres Fleisches
  rationale: Die ungewöhnliche anatomische Ausdrucksweise wird erhalten, ohne das mechanistische und im Deutschen befremdliche „Mechanismus“ zu übernehmen.
- source_word: ἀποδημεῖν ἀπὸ τῆς σαρκός / absent from the flesh
  choice: dem Fleisch entrückt
  rationale: Gibt die behauptete Distanz zum leiblichen Schmerz wieder, ohne eine vollständige Trennung von Leib und Seele dogmatisch festzulegen.
- source_word: ἀρνήσις / denial
  choice: Verleugnen
  rationale: Im Verfolgungskontext ist die Verleugnung Christi beziehungsweise des Bekenntnisses gemeint; der Gegenstand bleibt wie im Text unausgesprochen.
theological_decisions:
- issue: Gottes Wille und seine Macht über alle Ereignisse
  choice: „nach Gottes Willen“ und „Gott die Macht über alles zuschreiben“
  alternative: „mit Gottes Zustimmung“ beziehungsweise „Gott die Herrschaft über alles überlassen“
  rationale: Die starke Aussage der Vorlage wird nicht abgeschwächt, aber auch nicht durch zusätzliche Aussagen über unmittelbare göttliche Verursachung erklärt.
- issue: Erkaufen der Befreiung von ewiger Strafe
  choice: Die ökonomische Metapher „erkauften sich um den Preis einer einzigen Stunde“ bleibt erhalten.
  alternative: „gewannen durch eine Stunde Leiden Befreiung“
  rationale: Die auffällige Tausch- beziehungsweise Kaufmetaphorik gehört zum Text und soll nicht durch eine systematisch-theologische Deutung ersetzt werden. Eine Fußnote verhindert, dass sie unbemerkt als ausgearbeitete Verdienstlehre gelesen wird.
- issue: Märtyrer seien „schon Engel“
  choice: Die zugespitzte Formulierung wird unverändert als Aussage des Verfassers wiedergegeben.
  alternative: „sie waren schon wie Engel“
  rationale: Ein abschwächendes „wie“ steht im überlieferten Wortlaut nicht. Die Fußnote weist auf den rhetorischen Charakter hin, ohne die Spannung aufzulösen.
- issue: Wirken des Teufels in den Folterungen
  choice: „Der Teufel ... wollte ... sie zum Verleugnen bringen“
  alternative: Die Peiniger als alleinige handelnde Subjekte nennen
  rationale: Der Text deutet die fortgesetzte Folter ausdrücklich als List des Teufels; diese theologische Perspektive wird bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit frühchristlichem Ton. Lange Perioden wurden behutsam gegliedert, die bildkräftigen und anstößigen Aussagen jedoch bewahrt. Da eine direkte Prüfung des griechischen Wortlauts laut Datensatz noch aussteht, stützt sich der Entwurf auf den ausgewiesenen gemeinfreien englischen Zeugen und auf rekonstruierbare griechische Schlüsselbegriffe; vor der Endpublikation ist eine Kollation mit einer kritischen griechischen Ausgabe erforderlich.
