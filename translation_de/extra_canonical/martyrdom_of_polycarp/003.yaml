    issue: Fußnote [b] legt die Aussage „nicht länger Menschen, sondern schon Engel“ zu bestimmt aus.
    rationale: Die Erklärung, damit sei eine durch Gottes Offenbarung und Nähe geprägte Haltung gemeint, geht über den Wortlaut des Zeugen hinaus und engt eine zugespitzte, potenziell mehrdeutige Aussage interpretativ ein. Eine Fußnote sollte hier auf die wörtliche Formulierung beschränkt bleiben.
