base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: de
  text: 'Während er dies und noch vieles andere sagte, wurde er mit Mut und Freude erfüllt, und sein Gesicht war voller Anmut. Statt angesichts dessen, was man zu ihm sagte, mutlos zu werden, versetzte er vielmehr den Prokonsul in Erstaunen. Da schickte dieser seinen eigenen Herold und ließ mitten im Stadion dreimal ausrufen: »Polykarp hat bekannt, dass er Christ ist.«


    Als der Herold dies verkündet hatte, schrie die ganze Menge der in Smyrna lebenden Nichtjuden und Juden in unbändiger Wut und mit lauter Stimme: »Das ist der Lehrer Asiens, der Vater der Christen, der Zerstörer unserer Götter! Er lehrt viele, weder zu opfern noch anzubeten.« Während sie dies riefen, verlangten sie lautstark von Philippus, dem Asiarchen[a], einen Löwen auf Polykarp loszulassen. Er aber sagte, dazu sei er nicht befugt, da er die Tierkämpfe[b] bereits beendet habe.


    Da riefen sie einmütig, Polykarp solle lebendig verbrannt werden. Denn die Vision von seinem Kopfkissen musste sich erfüllen: Während er betete, hatte er es brennen sehen; daraufhin hatte er sich umgewandt und zu den Gläubigen bei ihm prophetisch gesagt: »Ich muss lebendig verbrannt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Asiarch war ein führender Amtsträger der römischen Provinz Asia, der unter anderem mit öffentlichen Festen und Spielen verbunden sein konnte.
    reason: Der antike Titel ist heutigen Lesern meist unbekannt und lässt sich nicht ohne Bedeutungsverlust durch eine einzelne moderne Amtsbezeichnung ersetzen.
  - marker: b
    text: Wörtlich kann der Ausdruck allgemeiner die Spiele oder Schauspiele bezeichnen; hier sind im Zusammenhang besonders die Tierkämpfe gemeint.
    reason: Macht die kontextuelle Konkretisierung transparent und bewahrt den weiteren Bedeutungsumfang des zugrunde liegenden Zeugnisses.
lexical_decisions:
- source_word: countenance ... filled with grace
  choice: sein Gesicht war voller Anmut
  rationale: Bewahrt die religiös gefärbte, zugleich äußerlich wahrnehmbare Beschreibung, ohne sie zu einer ausdrücklichen theologischen Aussage über Gnade zu verengen.
- source_word: Gentiles
  choice: Nichtjuden
  rationale: Im modernen Deutsch verständlicher und neutraler als das historisch belastete »Heiden«; der Gegensatz zu den Juden bleibt erhalten.
- source_word: teacher of Asia
  choice: Lehrer Asiens
  rationale: »Asien« bezeichnet hier die römische Provinz Asia; die knappe Anklageformel wird bewahrt.
- source_word: Asiarch
  choice: Asiarch
  rationale: Der historische Amtstitel wird transliteriert und durch eine Fußnote erläutert, statt durch eine unsichere moderne Amtsbezeichnung ersetzt zu werden.
- source_word: sports / games
  choice: Tierkämpfe
  rationale: Der Zusammenhang mit dem verlangten Löwen spricht für die bereits abgeschlossenen Tierhetzen; eine Fußnote weist auf den weiteren Bedeutungsumfang hin.
- source_word: must needs
  choice: musste / muss
  rationale: Gibt die im Text behauptete Notwendigkeit wieder, ohne deren theologischen Charakter zusätzlich auszudeuten.
theological_decisions:
- issue: Erfüllungsnotwendigkeit der Vision
  choice: »Denn die Vision ... musste sich erfüllen«
  alternative: »So sollte sich die Vision ... erfüllen«
  rationale: Die starke Notwendigkeitsformulierung des Zeugnisses bleibt erhalten; sie wird weder ausdrücklich als göttliche Vorherbestimmung erklärt noch abgeschwächt.
- issue: Polykarps prophetische Aussage
  choice: »prophetisch gesagt«
  alternative: »vorausgesagt«
  rationale: Bewahrt die religiöse Charakterisierung des Erzählers, ohne die Art oder Autorität der Prophetie näher zu bestimmen.
- issue: »Vater der Christen« als Aussage der Menge
  choice: wörtlich als »Vater der Christen« wiedergegeben
  alternative: »Anführer der Christen«
  rationale: Der historische Vorwurf der Menge bleibt als direkte Rede erhalten und wird nicht in eine kirchenamtliche oder dogmatische Bezeichnung umgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Die direkte Rede bleibt eindringlich, ohne archaische Verbformen. Da eine unmittelbare Prüfung des griechischen Textes noch aussteht, folgt der Entwurf vorsichtig dem angegebenen öffentlichen englischen Textzeugen und kennzeichnet historisch oder lexikalisch erklärungsbedürftige Stellen.
