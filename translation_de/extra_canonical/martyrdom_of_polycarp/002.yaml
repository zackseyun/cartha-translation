base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: de
  text: 'Wir schreiben euch, Brüder, über die Ereignisse bei denen, die das Martyrium erlitten haben, und besonders über den seligen Polykarp, der die Verfolgung beendete, indem er sie durch sein Martyrium gleichsam besiegelte. Denn fast alle vorausgegangenen Ereignisse geschahen, damit der Herr uns wiederum ein Martyrium nach dem Evangelium zeige.


    Denn er blieb, damit er ausgeliefert würde, wie auch der Herr, damit auch wir seine Nachahmer würden, indem wir nicht nur das im Blick haben, was uns selbst betrifft, sondern auch das, was unsere Nächsten betrifft. Denn Aufgabe wahrer und standhafter Liebe ist es, nicht nur zu wünschen, dass man selbst gerettet wird, sondern auch alle Brüder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort adelphoi bedeutet wörtlich „Brüder“. Es bezeichnet hier die Mitglieder der christlichen Gemeinschaft und kann Frauen einschließen.
    reason: Erklärt den sozialen Gruppenbezug, ohne den quellentreuen Wortlaut im Haupttext zu erweitern.
lexical_decisions:
- source_word: brethren / brothers (Greek source review pending)
  choice: Brüder und Schwestern
  rationale: Natürliches, inklusives Deutsch für die angesprochene Glaubensgemeinschaft; die abschließende Fußnote macht transparent, dass die zugrunde liegende antike Form vermutlich wörtlich „Brüder“ lautet.
- source_word: suffered martyrdom
  choice: das Martyrium erlitten
  rationale: Bewahrt den frühchristlichen Sinn eines leidvollen Glaubenszeugnisses und vermeidet die engere Wiedergabe „hingerichtet wurden“.
- source_word: blessed
  choice: selig
  rationale: Entspricht dem frühchristlichen ehrenden Sprachgebrauch und ist im Deutschen traditionsnah, ohne eine spätere formale Seligsprechung vorauszusetzen.
- source_word: stayed the persecution
  choice: brachte die Verfolgung zum Abschluss
  rationale: Gibt den wahrscheinlich gemeinten Abschluss beziehungsweise Höhepunkt der berichteten Verfolgung wieder, ohne zu behaupten, Polykarp habe jede Verfolgung dauerhaft beendet.
- source_word: set his seal upon it
  choice: drückte ihr gleichsam sein Siegel auf
  rationale: Erhält das bildhafte Siegelmotiv und seinen Sinn von Bestätigung und Vollendung.
- source_word: conformable to the Gospel
  choice: dem Evangelium entspricht
  rationale: Natürliches modernes Deutsch; bewahrt den Maßstab des Evangeliums, ohne ihn weiter auszudeuten.
- source_word: lingered
  choice: wartete ab
  rationale: Drückt aus, dass Polykarp nicht vorschnell handelte, sondern die Auslieferung abwartete; die genaue Nuance bedarf noch der Prüfung am Griechischen.
- source_word: delivered up
  choice: ausgeliefert wurde
  rationale: Bewahrt die bewusste Parallele zur Auslieferung Jesu.
- source_word: imitators of him
  choice: seinem Beispiel folgen
  rationale: Idiomatiche Wiedergabe des Nachahmungsmotivs in verständlichem modernem Deutsch.
theological_decisions:
- issue: Nachahmung Polykarps und Nachahmung des Herrn
  choice: „damit auch wir seinem Beispiel folgen“ bezieht sich im unmittelbaren Zusammenhang auf Polykarp, dessen Verhalten zuvor mit dem des Herrn verglichen wird.
  alternative: 'Das Pronomen unmittelbar auf den Herrn beziehen: „damit auch wir ihm, dem Herrn, nachfolgen“.'
  rationale: Die englische Zeugenvorlage lässt den Bezug grammatisch offen. Der fortlaufende Gedankengang stellt Polykarp als evangeliumsgemäßes Beispiel dar, ohne die grundlegende Vorbildrolle Jesu aufzuheben.
- issue: Heilswunsch für die Gemeinschaft
  choice: „will …, dass … gerettet wird“
  alternative: „sucht … das Heil“ oder „wünscht … Rettung“
  rationale: Bewahrt die theologische Offenheit des Verbs „gerettet werden“ und legt weder ausschließlich ewiges Heil noch bloß körperliche Rettung fest.
- issue: Polykarps Verhältnis zur Verfolgung
  choice: „brachte die Verfolgung zum Abschluss“
  alternative: „hielt die Verfolgung auf“
  rationale: Der Zusammenhang mit dem Siegelbild spricht eher für Abschluss oder Vollendung als für ein bloßes zeitweiliges Aufhalten; wegen ausstehender griechischer Prüfung bleibt die Entscheidung vorsichtig formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Briefcharakter. Der Entwurf beruht notgedrungen auf dem bereitgestellten gemeinfreien englischen Textzeugen; eine direkte Prüfung an der griechischen Handschriftentradition steht aus. Daher wurden besonders „stayed“, „lingered“ und die Pronomenbezüge nicht mit übermäßiger Sicherheit geglättet.
