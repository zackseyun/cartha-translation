  source_fidelity: Eine sichere Korrektur ist erforderlich. Der griechische Wortlaut bestätigt ἀδελφοί („Brüder“) und παρέμεινεν („blieb“), während der Entwurf beide Stellen interpretierend erweitert bzw. abschwächt. κατέπαυσεν bezeichnet, im Zusammenhang mit dem Siegelbild, das Beenden/Zum-Ende-Bringen der Verfolgung. Das Nachahmungspronomen αὐτοῦ bezieht sich auf Polykarp.
  naturalness: Der Entwurf ist insgesamt gut verständlich und würdig. „wartete ab“ ist jedoch für παρέμεινεν weniger genau als „blieb“, und „das, was uns selbst betrifft“ ist unnötig umständlich. Die revidierte Fassung bleibt modernes Standarddeutsch und wahrt den Briefcharakter.
  terminology: „Martyrium“, „selig“, „Evangelium“ und „gerettet werden“ sind angemessen. „Brüder und Schwestern“ sollte hier nicht im Lauftext stehen, da die Quelle ausdrücklich ἀδελφοί hat; eine erläuternde Fußnote kann den gemeinschaftlichen Bezug benennen.
  issues:
  - severity: medium
    issue: Inklusive Erweiterung von „Brüder“ zu „Brüder und Schwestern“ im Lauftext
    rationale: Der griechische Text hat in Anrede und Schlussgruppe ἀδελφοί. Die Erweiterung ist als Verständnishilfe möglich, aber keine quellentreue Übersetzung im Haupttext.
  - severity: medium
    issue: „wartete ab“ für παρέμεινεν
    rationale: παρέμεινεν bedeutet primär „blieb“ bzw. „harrte aus“. „Wartete ab“ fügt eine Haltung des Abwartens hinzu, die der Wortlaut nicht ausdrücklich enthält.
  - severity: low
    issue: „brachte die Verfolgung zum Abschluss“
    rationale: Die Formulierung ist vertretbar, aber „beendete die Verfolgung“ gibt κατέπαυσεν unmittelbarer wieder und lässt das anschließende Siegelbild die Vollendungsnuance tragen.
  - severity: low
    issue: „dem Evangelium entspricht“
    rationale: „nach dem Evangelium“ bildet κατὰ τὸ εὐαγγέλιον genauer und knapper ab.
