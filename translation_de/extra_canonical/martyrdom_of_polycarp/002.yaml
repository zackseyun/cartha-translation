revisions:
- from: 'Wir schreiben euch, Brüder und Schwestern, einen Bericht über das, was denen widerfuhr, die das Martyrium erlitten, besonders aber über den seligen Polykarp. Er brachte die Verfolgung zum Abschluss, indem er ihr durch sein Martyrium gleichsam sein Siegel aufdrückte. Denn fast alles, was zuvor geschehen war, ereignete sich, damit der Herr uns noch einmal ein Beispiel für ein Martyrium zeige, das dem Evangelium entspricht.


    Denn Polykarp wartete ab, bis er ausgeliefert wurde, so wie auch der Herr, damit auch wir seinem Beispiel folgen und nicht nur auf das bedacht sind, was uns selbst betrifft, sondern auch auf das, was unsere Nächsten betrifft. Denn wahre und standhafte Liebe will nicht nur, dass man selbst gerettet wird, sondern auch alle Brüder und Schwestern.[a]'
  to: 'Wir schreiben euch, Brüder, über die Ereignisse bei denen, die das Martyrium erlitten haben, und besonders über den seligen Polykarp, der die Verfolgung beendete, indem er sie durch sein Martyrium gleichsam besiegelte. Denn fast alle vorausgegangenen Ereignisse geschahen, damit der Herr uns wiederum ein Martyrium nach dem Evangelium zeige.


    Denn er blieb, damit er ausgeliefert würde, wie auch der Herr, damit auch wir seine Nachahmer würden, indem wir nicht nur das im Blick haben, was uns selbst betrifft, sondern auch das, was unsere Nächsten betrifft. Denn Aufgabe wahrer und standhafter Liebe ist es, nicht nur zu wünschen, dass man selbst gerettet wird, sondern auch alle Brüder.[a]'
  rationale: 'Die Überarbeitung folgt dem griechischen Wortlaut, soweit dieser für die maßgeblichen Stellen überprüfbar ist: ἀδελφοί wird als „Brüder“ wiedergegeben, παρέμεινεν als „blieb“, κατέπαυσεν als „beendete“ und κατὰ τὸ εὐαγγέλιον als „nach dem Evangelium“. Die Aussage, dass Polykarp die Verfolgung durch sein Martyrium gleichsam besiegelte, bewahrt sowohl das Bild als auch die Verbindung von Abschluss und Bestätigung. „Seine Nachahmer“ bezieht sich, entsprechend αὐτοῦ im Satz über Polykarp, auf Polykarp; der Vergleich mit dem Herrn bleibt ausdrücklich erhalten.'
  reviewer_model: gpt-5.6-terra
