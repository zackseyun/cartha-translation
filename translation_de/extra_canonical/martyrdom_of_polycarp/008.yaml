review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die Abfolge, die Gebetsdauer sowie die Aussagen über Gottes Willen und Gottes Gnade. Zwei Formulierungen verschieben jedoch die Bewegungsrichtung bzw. den Schluss der Reueaussage: „eilten herbei“ bedeutet ein Eilen zum Ort hin, während die Bewaffneten laut Zeuge ausziehen und dabei wie gegen einen Räuber vorgehen; ferner wird das Kommen „gegen“ Polykarp nicht ausdrücklich als Festnahmehandlung formuliert.'
  naturalness: Der Text ist überwiegend klares modernes Standarddeutsch mit angemessen würdigem Erzählton. „wollte er es nicht“ ist jedoch elliptisch und weniger natürlich als eine ausdrücklich genannte Handlung. „fragten sich“ ist möglich, gibt das fortdauernde Verwundern aber etwas weniger direkt wieder.
  terminology: „Junge“, „Reiter“, „Standhaftigkeit“, „kleines Haus“, „Gnade Gottes“ und „bereuten“ sind tragfähig. „Polizeikräfte“ ist als moderne Funktionsbezeichnung vertretbar, ohne die historische Institution unnötig festzulegen. „Obergemach“ ist verständlich, aber leicht gehoben; es passt zum erzählerischen Register.
  issues:
  - severity: medium
    issue: „eilten herbei“
    rationale: Die Wendung legt nahe, die Gruppe eile zum bereits genannten Ort. Der Zeuge sagt, dass sie ausziehen und wie gegen einen Räuber eilen. „zogen ... los und eilten, als ginge es gegen einen Räuber“ bewahrt Richtung und Vergleich.
  - severity: low
    issue: „wollte er es nicht“
    rationale: Das Pronomen hat keinen klaren natürlichen Bezug. „wollte er nicht fortgehen“ macht die im Kontext gemeinte, vom Zeugen ausdrücklich genannte Möglichkeit klar.
  - severity: medium
    issue: „um einen so ehrwürdigen alten Mann festzunehmen“
    rationale: Der Zeuge sagt wörtlicher, sie seien „gegen“ einen ehrwürdigen alten Mann gekommen. Die Festnahme ist kontextuell naheliegend, aber nicht in dieser Schlussformel ausdrücklich wiederholt. „dass sie gegen einen so ehrwürdigen alten Mann gekommen waren“ erhält die offenere Formulierung.
  revised_text: 'So nahmen sie den Jungen mit. Am Freitag, etwa zur Zeit des Abendessens, zogen die Polizeikräfte und Reiter mit ihren üblichen Waffen los und eilten, als ginge es gegen einen Räuber. Als sie spät am Abend geschlossen ankamen, fanden sie ihn selbst in einem Obergemach eines kleinen Hauses im Bett. Obwohl er von dort noch an einen anderen Ort hätte gehen können, wollte er nicht fortgehen, sondern sagte: »Gottes Wille geschehe.«


    Als er hörte, dass sie gekommen waren, ging er hinunter und sprach mit ihnen. Die Umstehenden staunten über sein hohes Alter und seine Standhaftigkeit und wunderten sich, weshalb man einen solchen alten Mann mit so großem Eifer festnehmen wollte. Daraufhin ließ er ihnen sofort einen Tisch decken, damit sie zu dieser Stunde essen und trinken konnten, so viel sie wollten. Dann bewog er sie dazu, ihm eine Stunde zu gewähren, in der er ungestört beten könne.


    Als sie einwilligten, stellte er sich hin und betete. Er war so von der Gnade Gottes erfüllt, dass er zwei Stunden lang nicht schweigen konnte. Seine Zuhörer waren erstaunt, und viele bereuten, dass sie gegen einen so ehrwürdigen alten Mann gekommen waren.'
  revised_footnotes: []
  revision_rationale: Die Revision korrigiert ausschließlich sichere Bedeutungs- und Ausdrucksfragen. Sie stellt die Bewegungsrichtung der Verfolger wieder her, ersetzt eine unklare Ellipse durch idiomatisches Deutsch und bewahrt im letzten Satz die weniger eng festgelegte Aussage des Zeugen, dass viele ihr Vorgehen gegen Polykarp bereuten. Da keine Fußnoten im Entwurf angelegt sind und keine textkritische Anmerkung für diese sicheren Korrekturen erforderlich ist, werden keine Fußnoten ergänzt.
