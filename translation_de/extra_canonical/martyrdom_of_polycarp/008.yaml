base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: de
  text: 'So nahmen sie den Jungen mit. Am Freitag, etwa zur Zeit des Abendessens, zogen die Polizeikräfte und Reiter mit ihren üblichen Waffen los und eilten herbei, als ginge es gegen einen Räuber. Als sie spät am Abend geschlossen ankamen, fanden sie ihn selbst in einem Obergemach eines kleinen Hauses im Bett. Obwohl er von dort noch an einen anderen Ort hätte gehen können, wollte er es nicht, sondern sagte: »Gottes Wille geschehe.«


    Als er hörte, dass sie gekommen waren, ging er hinunter und sprach mit ihnen. Die Umstehenden staunten über sein hohes Alter und seine Standhaftigkeit und fragten sich, weshalb man einen solchen alten Mann mit so großem Eifer festnehmen wollte. Daraufhin ließ er ihnen sofort einen Tisch decken, damit sie zu dieser späten Stunde essen und trinken konnten, so viel sie wollten. Dann bewog er sie dazu, ihm eine Stunde zu gewähren, in der er ungestört beten könne.


    Als sie einwilligten, stellte er sich hin und betete. Er war so von der Gnade Gottes erfüllt, dass er zwei Stunden lang nicht schweigen konnte. Seine Zuhörer waren erstaunt, und viele bereuten, dass sie gekommen waren, um einen so ehrwürdigen alten Mann festzunehmen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: Junge
  rationale: Gibt die Altersbezeichnung natürlich wieder, ohne eine nicht belegte Funktion wie Diener oder Sklave festzulegen.
- source_word: gendarmes and horsemen
  choice: Polizeikräfte und Reiter
  rationale: „Polizeikräfte“ vermittelt die Vollzugsfunktion verständlich; „Reiter“ bewahrt die gesondert genannte berittene Gruppe. „Gendarmen“ wäre im modernen Deutsch historisch irreführend.
- source_word: constancy
  choice: Standhaftigkeit
  rationale: Bezeichnet seine feste, unbeirrte Haltung in einer würdigen und geläufigen Form.
- source_word: upper chamber
  choice: Obergemach
  rationale: Bewahrt die räumliche Angabe und den antiken Erzählton, bleibt aber verständlich.
- source_word: cottage
  choice: kleines Haus
  rationale: Vermeidet die modernen oder regionalen Nebenbedeutungen von „Hütte“ und „Landhaus“.
- source_word: repented
  choice: bereuten
  rationale: Bewahrt die moralische Umkehr beziehungsweise Reue, ohne ausdrücklich eine umfassende religiöse Bekehrung hineinzulesen.
theological_decisions:
- issue: Formulierung der Ergebung in Gottes Willen
  choice: »Gottes Wille geschehe.«
  alternative: »Der Wille des Herrn geschehe.«
  rationale: Folgt der gelieferten Quellenbasis mit „God“ und bewahrt die biblisch geprägte Ergebungsformel, ohne ihre theologische Spannung abzuschwächen.
- issue: Gnade Gottes als Ursache beziehungsweise Kennzeichen des langen Gebets
  choice: „Er war so von der Gnade Gottes erfüllt, dass …“
  alternative: „Durch Gottes Gnade konnte er …“
  rationale: Bewahrt die bildhafte Fülle der Gnade und legt nicht enger als die Quelle fest, auf welche Weise die Gnade das Gebet ermöglichte.
- issue: Bedeutung der Reue der Festnehmenden
  choice: „viele bereuten, dass sie gekommen waren“
  alternative: „viele kehrten um“
  rationale: Gibt die konkrete Reue über ihr Kommen wieder, ohne eine ausdrücklich religiöse Bekehrung zu behaupten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählerischem Ton. Wegen der ausstehenden direkten Prüfung des griechischen Textes ist die Fassung bewusst quellenvorsichtig und stützt sich auf den angegebenen englischen Public-Domain-Zeugen sowie die auditierte POB-Konsultationsfassung. Lange Perioden wurden maßvoll gegliedert; die markanten Motive und möglichen theologischen Spannungen bleiben erhalten.
