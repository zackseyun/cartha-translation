  revision_rationale: Die Revision korrigiert die unnatürliche Beschreibung der Handhaltung, entfernt den nicht belegten zeitlichen Zusatz „nun“ und ordnet die Satzteile über Märtyrer, Kelch und Auferstehung behutsam neu. Bildsprache, Anredeform, textkritische Klammern und die bewusst nicht geglättete Doxologie bleiben erhalten. Da nur ein englischer öffentlicher Zeuge bereitgestellt wurde und die direkte griechische Prüfung aussteht, wird diese Einschränkung weiterhin in der Fußnote ausgewiesen.
