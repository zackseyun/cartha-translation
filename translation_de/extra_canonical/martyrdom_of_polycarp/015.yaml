review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt den englischen Zeugen weitgehend getreu wieder und bewahrt die eckigen Klammern bei textkritisch markierten Ergänzungen. Eine sichere sprachliche Korrektur ist jedoch bei der Wiedergabe von „placing his hands behind him“ erforderlich; ferner sollte das im Zeugen nicht vorhandene „nun“ entfernt werden. Die schwierige syntaktische Verbindung von Kelch, Märtyrerschar, Auferstehung und Unvergänglichkeit wird enger und verständlicher gefasst, ohne sie dogmatisch aufzulösen.
  naturalness: Der Gebetsregister ist überwiegend würdevoll und modern. „legte er die Hände auf den Rücken“ ist jedoch im Deutschen nicht die übliche Beschreibung einer Fesselhaltung; „führte er die Hände auf den Rücken“ ist klarer. „Anteil zu erhalten an der Zahl“ und „Auferstehung des ewigen Lebens an Seele und Leib“ wirken unnötig unidiomatisch. Die Revision bewahrt den gehobenen Ton bei besserer Lesbarkeit.
  terminology: „Pfahl“, „Widder“, „Mächte“, „Märtyrer“, „Kelch“, „Unvergänglichkeit“ und „Hohenpriester“ sind passend. Die Anrede Gottes sowie die christologischen und pneumatologischen Bezeichnungen bleiben unverändert. Die Doxologie wird nicht zu einer konfessionell festgelegten Formel umgestaltet; ihre im Zeugen sperrige Beziehung bleibt sichtbar.
  issues:
  - severity: medium
    issue: 'Fesselhaltung: „legte er die Hände auf den Rücken“'
    rationale: Die Vorlage beschreibt, dass Polykarp seine Hände hinter bzw. auf den Rücken brachte. Die deutsche Formulierung kann bedeuten, er habe die Hände lediglich auf seinen Rücken gelegt, und klingt für eine Fesselung unnatürlich. „führte er die Hände auf den Rücken“ gibt den Vorgang klar wieder.
  - severity: low
    issue: Zusatz „nun“ in „und nun vollbracht hast“
    rationale: Der englische Zeuge lautet lediglich „and hast accomplished it“. „Nun“ fügt eine zeitliche Nuance hinzu, die nicht markiert ist und entfallen sollte.
  - severity: medium
    issue: Syntaktisch unklare Wiedergabe von Anteil, Kelch und Auferstehung
    rationale: Die Kombination „Anteil ... an der Zahl ... am Kelch ... zur Auferstehung ... an Seele und Leib“ erschwert das Verständnis stärker als nötig. Eine behutsame Umstellung kann die Bezugsverhältnisse verdeutlichen, ohne die ungewöhnliche anthropologische und eschatologische Aussage zu harmonisieren.
