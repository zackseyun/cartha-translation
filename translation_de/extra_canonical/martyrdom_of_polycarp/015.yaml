base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: de
  text: 'So nagelten sie ihn nicht fest, sondern banden ihn. Dann legte er die Hände auf den Rücken und wurde an den Pfahl gebunden. Wie ein edler Widder aus einer großen Herde, für eine Opfergabe bestimmt, ein bereitetes und Gott wohlgefälliges Brandopfer, blickte er zum Himmel auf und sprach:


    „O Herr, allmächtiger Gott,

    Vater deines geliebten und gesegneten Sohnes Jesus Christus,

    durch den wir dich erkannt haben,

    Gott der Engel und Mächte und der ganzen Schöpfung

    und des ganzen Geschlechts der Gerechten, die vor dir leben:


    Ich preise dich, weil du mich dieses Tages und dieser Stunde gewürdigt hast,

    Anteil zu erhalten an der Zahl der Märtyrer,

    am Kelch [deines] Christus,

    zur Auferstehung des ewigen Lebens an Seele und Leib,

    in der Unvergänglichkeit des Heiligen Geistes.


    Möge ich heute vor dir unter ihnen aufgenommen werden

    als ein reiches und wohlgefälliges Opfer,

    wie du es zuvor bereitet und offenbart

    und nun vollbracht hast,

    du treuer und wahrhaftiger Gott.


    Darum und für alles

    lobe ich dich, preise ich dich,

    verherrliche ich dich durch den ewigen und himmlischen Hohenpriester,

    Jesus Christus, deinen geliebten Sohn.

    Durch ihn sei dir mit ihm und dem Heiligen Geist die Herrlichkeit,

    jetzt [und immerdar] und in den kommenden Zeitaltern. Amen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach der angegebenen gemeinfreien englischen Zeugenübersetzung. Eine unmittelbare Prüfung am griechischen Text steht noch aus. Eckige Klammern im Text kennzeichnen ergänzte oder textkritisch unsichere Wörter der Vorlage.
    reason: Die bereitgestellten Metadaten weisen ausdrücklich darauf hin, dass die Prüfung der griechischen Handschriftentradition noch aussteht; dies muss für eine quellenbewusste Veröffentlichung transparent bleiben.
lexical_decisions:
- source_word: tied / bound to the stake
  choice: banden ihn / wurde an den Pfahl gebunden
  rationale: Bewahrt die Unterscheidung zwischen dem Verzicht auf Annageln und der Befestigung am Hinrichtungsort; „Pfahl“ gibt „stake“ unmittelbar wieder.
- source_word: noble ram
  choice: edler Widder
  rationale: Erhält das ausdrücklich männliche Opfertierbild und dessen würdevollen Charakter.
- source_word: powers
  choice: Mächte
  rationale: Bewahrt die mögliche Bezeichnung himmlischer Wesen, ohne sie erklärend aufzulösen.
- source_word: race of the righteous
  choice: Geschlecht der Gerechten
  rationale: „Geschlecht“ erhält den kollektiven Abstammungs- bzw. Gemeinschaftssinn besser als das moderne, missverständliche „Rasse“.
- source_word: martyrs
  choice: Märtyrer
  rationale: Im frühchristlichen Kontext bezeichnet das Wort die Zeugen, die für Christus sterben; der etablierte deutsche Ausdruck ist angemessen.
- source_word: cup
  choice: Kelch
  rationale: Bewahrt die biblisch-liturgische Bildsprache von Leiden, Teilhabe und Opfer.
- source_word: incorruptibility
  choice: Unvergänglichkeit
  rationale: Gibt den eschatologischen Gegensatz zu Verfall und Tod wieder, ohne ihn nur als moralische Reinheit zu deuten.
- source_word: High-priest
  choice: Hohenpriester
  rationale: Die etablierte christologische Amtsbezeichnung wahrt den kultischen Zusammenhang des Gebets.
theological_decisions:
- issue: „in the cup of [Thy] Christ“
  choice: „am Kelch [deines] Christus“
  alternative: „im Kelch [deines] Christus“
  rationale: „Anteil … am Kelch“ klingt im Deutschen natürlich und bewahrt die Teilhabemetaphorik; die eckigen Klammern bleiben als textkritisches Signal erhalten.
- issue: Auferstehung von Seele und Leib
  choice: „zur Auferstehung des ewigen Lebens an Seele und Leib“
  alternative: „zur Auferstehung zum ewigen Leben, sowohl der Seele als auch des Leibes“
  rationale: Die ungewöhnliche Verbindung wird möglichst eng bewahrt, ohne die Spannung durch eine systematische Erklärung des Verhältnisses von Seele und Leib aufzulösen.
- issue: 'Doxologie: „through whom with Him“'
  choice: „Durch ihn sei dir mit ihm und dem Heiligen Geist die Herrlichkeit“
  alternative: „durch den ihm mit dir und dem Heiligen Geist Herrlichkeit sei“
  rationale: Die überlieferte Syntax ist in der englischen Zeugenübersetzung mehrdeutig bzw. sperrig. Die gewählte Fassung folgt deren Wortbeziehungen so weit wie möglich, ohne eine konfessionell geglättete trinitarische Formel einzusetzen.
- issue: „who live in Thy presence“
  choice: „die vor dir leben“
  alternative: „die in deiner Gegenwart leben“
  rationale: „Vor dir“ bewahrt sowohl den räumlich-gegenwärtigen als auch den theologischen Sinn des Lebens angesichts Gottes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. Archaische Anredeformen wurden vermieden; die Opfer-, Kelch- und Hohepriesterbilder bleiben bewusst erhalten. Die Zeilenstruktur hebt den liturgischen Charakter hervor. Wegen der ausstehenden griechischen Quellenprüfung ist die Fassung ausdrücklich vorläufig.
