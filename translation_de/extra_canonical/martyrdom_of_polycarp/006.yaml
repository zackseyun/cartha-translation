lexical_decisions:
- source_word: glorious
  choice: ruhmreiche
  rationale: Gibt den ehrenden Titel des englischen Zeugen in würdigem, natürlichem Deutsch wieder, ohne ihn als Aussage über göttliche Verherrlichung zu überdeuten.
- source_word: farm
  choice: Landgut
  rationale: Passt zum antiken Kontext besser als das moderne, betriebsbezogene »Farm« und lässt offen, ob Wohnstätte oder landwirtschaftlicher Besitz gemeint ist.
- source_word: churches
  choice: Gemeinden
  rationale: Bezeichnet hier die örtlichen christlichen Gemeinschaften und vermeidet die mögliche Verengung auf Gebäude oder Institutionen.
- source_word: trance
  choice: Verzückung
  rationale: Bewahrt den visionären Charakter des Erlebnisses, ohne einen modernen medizinischen Zustand zu unterstellen.
- source_word: It must needs be
  choice: Ich muss
  rationale: Gibt die im Zeugen ausgedrückte Notwendigkeit knapp und idiomatisch wieder; ob sie als göttliche Bestimmung oder sichere Vorahnung verstanden wird, bleibt offen.
theological_decisions:
- issue: Reichweite des Gebets für »all men«
  choice: für alle Menschen
  alternative: für alle
  rationale: Macht den universalen Bezug ausdrücklich, ohne ihn auf männliche Personen zu beschränken.
- issue: Charakter der angekündigten Verbrennung
  choice: »Ich muss lebendig verbrannt werden.«
  alternative: »Es ist notwendig, dass ich lebendig verbrannt werde.«
  rationale: Bewahrt die Aussage als Vorankündigung einer Notwendigkeit, ohne deren genaue theologische Ursache festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut lesbarer Erzählsyntax. Der historische und hagiografische Ton bleibt erhalten, Archaismen wie »es muss sein, dass« werden jedoch vermieden. Wegen der noch ausstehenden Prüfung der griechischen Überlieferung sind lexikalische Feinentscheidungen bewusst zurückhaltend getroffen.
