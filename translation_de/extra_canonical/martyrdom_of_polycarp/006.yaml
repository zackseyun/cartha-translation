review_pass:
  verdict: revise
  source_fidelity: Der griechische Wortlaut von MartPol. 5 bietet für den visionären Vorgang ὀπτασίαν ἰδών („nachdem/indem er eine Vision gesehen hatte“), nicht ausdrücklich einen Trancezustand. „Geriet in eine Verzückung“ legt daher einen Zustand stärker fest, als der Text verlangt. γενναῖος ist eher „edel, trefflich, tapfer“ als „ruhmreich“. Die übrigen Sinnabschnitte werden zutreffend wiedergegeben, einschließlich des Gebets für alle und die Gemeinden in der ganzen Welt sowie der notwendigen Vorhersage seines Verbrennungstodes.
  naturalness: Der Entwurf ist überwiegend flüssiges modernes Standarddeutsch. „ließ er sich zunächst keineswegs erschrecken“ ist jedoch etwas umständlich; „war zunächst keineswegs erschrocken“ ist direkter. Eine Vision lässt sich natürlich und quellennah mit „hatte er eine Vision“ wiedergeben.
  terminology: „Landgut“ ist für ἀγρίδιον gut vertretbar; „Gemeinden“ gibt ἐκκλησίαι im Kontext angemessen wieder. „Vision“ ist gegenüber „Verzückung“ der quellentreuere und zugleich konfessionell nicht überladene Ausdruck. „lebendig verbrannt werden“ bewahrt die passive Form und die Aussage von δεῖ με ζῶντα καῆναι.
  issues:
  - severity: medium
    issue: „Verzückung“ fügt einen nicht ausdrücklich vorgegebenen ekstatischen Zustand hinzu.
    rationale: Der griechische Text bezeichnet eine Vision (ὀπτασία), während auch der englische Zeuge mit „trance“ eine interpretierende Formulierung bietet. Die deutsche Übersetzung soll die weniger festgelegte Aussage bewahren.
  - severity: low
    issue: „ruhmreiche“ ist für γενναῖος weniger präzise als „edle“ oder „treffliche“.
    rationale: γενναῖος charakterisiert Polykarp primär als edel/tapfer; „ruhmreich“ folgt dem englischen Übersetzungszeugen, entfernt sich aber von der näherliegenden griechischen Bedeutung.
