base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: de
  text: 'Als der edle Polykarp davon hörte, war er zunächst keineswegs erschrocken, sondern wollte in der Stadt bleiben. Doch die meisten überredeten ihn, sich zurückzuziehen. So zog er sich auf ein Landgut unweit der Stadt zurück. Dort hielt er sich mit einigen wenigen Gefährten auf und tat Tag und Nacht nichts anderes, als für alle Menschen und für die Gemeinden in der ganzen Welt zu beten; denn das war seine ständige Gewohnheit.


    Während er betete, hatte er drei Tage vor seiner Festnahme eine Vision: Er sah sein Kopfkissen brennen. Da wandte er sich an die, die bei ihm waren, und sagte: »Ich muss lebendig verbrannt werden.«[a]'
  philosophy: optimal-equivalence
