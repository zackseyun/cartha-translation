revisions:
- from: 'Als der ruhmreiche Polykarp davon hörte, ließ er sich zunächst keineswegs erschrecken, sondern wollte in der Stadt bleiben. Doch die meisten überredeten ihn, sich zurückzuziehen. So zog er sich auf ein Landgut unweit der Stadt zurück. Dort hielt er sich mit einigen wenigen Gefährten auf und tat Tag und Nacht nichts anderes, als für alle Menschen und für die Gemeinden in der ganzen Welt zu beten; denn das war seine ständige Gewohnheit.


    Als er drei Tage vor seiner Festnahme betete, geriet er in eine Verzückung und sah sein Kopfkissen in Flammen stehen. Da wandte er sich an seine Begleiter und sagte: »Ich muss lebendig verbrannt werden.«[a]'
  to: 'Als der edle Polykarp davon hörte, war er zunächst keineswegs erschrocken, sondern wollte in der Stadt bleiben. Doch die meisten überredeten ihn, sich zurückzuziehen. So zog er sich auf ein Landgut unweit der Stadt zurück. Dort hielt er sich mit einigen wenigen Gefährten auf und tat Tag und Nacht nichts anderes, als für alle Menschen und für die Gemeinden in der ganzen Welt zu beten; denn das war seine ständige Gewohnheit.


    Während er betete, hatte er drei Tage vor seiner Festnahme eine Vision: Er sah sein Kopfkissen brennen. Da wandte er sich an die, die bei ihm waren, und sagte: »Ich muss lebendig verbrannt werden.«[a]'
  rationale: Die Revision beseitigt die unnötige Festlegung auf einen Trance- oder Ekstasezustand und gibt die Vision quellenäher wieder. Sie ersetzt außerdem die vom englischen Zeugen beeinflusste Charakterisierung „ruhmreich“ durch das dem griechischen γενναῖος nähere „edel“, ohne den würdigen hagiografischen Registerton zu verlieren. Die Fußnote bleibt bestehen, weil die Projektdaten die formale unmittelbare Prüfung der griechischen Überlieferung weiterhin als ausstehend ausweisen.
