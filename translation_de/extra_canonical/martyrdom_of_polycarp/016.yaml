review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugnis im Wesentlichen zuverlässig. Zwei Stellen sind jedoch unnötig eingeengt bzw. abgeschwächt: „Scheiterhaufen“ konkretisiert das bloße „fire“ über die Vorlage hinaus, und „wir blieben am Leben“ gibt das passive „we were preserved“ nicht angemessen wieder. Die eckig markierte, textkritisch unsichere Vergleichsphrase muss sichtbar erhalten bleiben.'
  naturalness: Das Deutsch ist insgesamt flüssig und würdig. „die Männer, die für das Feuer zuständig waren“ wirkt jedoch administrativ und schwerfällig; „die mit dem Feuer beauftragt waren“ ist natürlicher. Die Beschreibung des Brotvergleichs wird mit einem Relativsatz verständlicher, ohne das Klammerzeichen oder die Unsicherheit aufzuheben.
  terminology: „Märtyrer“, „Weihrauch“ und „geläutert“ sind passend. „bewahrt wurden“ bewahrt sowohl die Passivform als auch die mögliche, aber nicht explizierte theologische Dimension. „Ofen“ gibt „furnace“ neutraler wieder als „Schmelzofen“, der den Bildbereich unnötig technisiert.
  issues:
  - severity: medium
    issue: „Scheiterhaufen“ ergänzt die Vorlage.
    rationale: Das vorliegende Zeugnis sagt nur, dass die Feuerbeauftragten das Feuer anzündeten. Der Hinrichtungskontext legt einen Scheiterhaufen nahe, doch die Übersetzung sollte diese Konkretisierung nicht in den Text eintragen.
  - severity: medium
    issue: „wir blieben am Leben“ schwächt „we were preserved“ ab.
    rationale: Die Vorlage formuliert passiv und offen, dass die Zeugen bewahrt wurden, um berichten zu können. „Wir wurden bewahrt“ erhält diese Form und Offenheit.
  - severity: low
    issue: Die Bezeichnung der Feuerbeauftragten ist unnötig umständlich.
    rationale: „Die Männer, die für das Feuer zuständig waren“ klingt modern-administrativ. Eine knappe Funktionsbezeichnung ist idiomatischer und bleibt neutral.
  revised_text: 'Nachdem er das Amen gesprochen und sein Gebet beendet hatte, zündeten die mit dem Feuer Beauftragten das Feuer an. Da loderte eine gewaltige Flamme auf, und wir, denen es gegeben war, dies zu sehen, erblickten ein Wunder; ja, wir wurden bewahrt, damit wir den Übrigen berichten konnten, was geschehen war.


    Das Feuer wölbte sich wie ein vom Wind geblähtes Schiffssegel und bildete rings um den Körper des Märtyrers eine Wand. Er aber befand sich mitten darin, nicht wie brennendes Fleisch, sondern wie [ein Brotlaib, der im Ofen gebacken wird, oder wie] Gold und Silber, das im Ofen geläutert wird.[a] Denn wir nahmen einen so wohlriechenden Duft wahr, als wehe der Duft von Weihrauch oder einem anderen kostbaren Gewürz zu uns herüber.'
