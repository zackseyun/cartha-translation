base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: de
  text: 'Als er das Amen gesprochen und sein Gebet beendet hatte, entzündeten die Männer, die für das Feuer zuständig waren, den Scheiterhaufen. Eine gewaltige Flamme loderte auf, und wir, denen es gegeben war, dies zu sehen, erblickten ein Wunder. Ja, wir blieben am Leben, damit wir den Übrigen berichten konnten, was geschehen war.


    Das Feuer wölbte sich wie ein vom Wind geblähtes Schiffssegel und bildete rings um den Körper des Märtyrers eine Wand. Er aber befand sich mitten darin, nicht wie brennendes Fleisch, sondern wie [ein Brotlaib im Ofen oder wie] Gold und Silber, das im Schmelzofen geläutert wird.[a] Denn wir nahmen einen so wohlriechenden Duft wahr, als wehe der Geruch von Weihrauch oder einem anderen kostbaren Duftstoff zu uns herüber.'
  philosophy: optimal-equivalence
