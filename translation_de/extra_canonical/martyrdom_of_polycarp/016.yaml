lexical_decisions:
- source_word: the firemen / those tending the fire
  choice: die Männer, die für das Feuer zuständig waren
  rationale: Vermeidet das im Deutschen an moderne Feuerwehrleute erinnernde „Feuermänner“ und gibt die Funktion im Hinrichtungsgeschehen verständlich wieder.
- source_word: lighted the fire
  choice: entzündeten … den Scheiterhaufen
  rationale: „Scheiterhaufen“ macht im Deutschen den konkreten Hinrichtungskontext deutlich; die genaue griechische Formulierung muss bei der ausstehenden Quellenprüfung bestätigt werden.
- source_word: making the appearance of a vault
  choice: wölbte sich
  rationale: Gibt das kuppel- oder gewölbeartige Erscheinungsbild natürlich wieder und verbindet es klar mit dem folgenden Segelvergleich.
- source_word: martyr
  choice: Märtyrer
  rationale: Der etablierte deutsche Ausdruck bewahrt die frühchristliche Zeugnisterminologie.
- source_word: refined in a furnace
  choice: im Schmelzofen geläutert wird
  rationale: Bewahrt das Bild der Reinigung beziehungsweise Läuterung von Edelmetallen im Ofen.
- source_word: frankincense
  choice: Weihrauch
  rationale: Übliche und präzise deutsche Bezeichnung.
theological_decisions:
- issue: Wundercharakter des berichteten Geschehens
  choice: „erblickten ein Wunder“ als Aussage des erzählenden Wir beibehalten
  alternative: Die Erscheinung naturalisierend oder distanzierend als bloßen Eindruck wiedergeben
  rationale: Der Text präsentiert das Geschehen ausdrücklich als Wunder und Augenzeugenbericht; die Übersetzung soll diese Behauptung weder abschwächen noch zusätzlich beglaubigen.
- issue: „denen es gegeben war, dies zu sehen“
  choice: Die passive, theologisch offene Formulierung bewahren
  alternative: Gott ausdrücklich als den Gebenden nennen
  rationale: Die Formulierung kann göttliches Gewähren andeuten, nennt den Handelnden aber nicht ausdrücklich; diese Offenheit bleibt erhalten.
- issue: Bewahrung der Zeugen
  choice: „wir blieben am Leben“
  alternative: „wir wurden gerettet/bewahrt“ mit stärkerem ausdrücklichem Heils- oder Schutzakzent
  rationale: Gibt den erzählerischen Sinn wieder, ohne den theologischen Urheber oder die Art der Bewahrung über die vorliegende englische Quellenbasis hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Rhythmus. Der Entwurf beruht vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugnis; eine direkte Prüfung des griechischen Textes und seiner Varianten steht noch aus. Archaismen wie „siehe“ oder „ja, wahrlich“ wurden vermieden, ohne den feierlichen Märtyrerbericht umgangssprachlich zu glätten.
