    reason: Das überlieferte englische Zeugnis markiert „a loaf in the oven or like“ mit eckigen Klammern; dieses textkritische Signal wird sichtbar bewahrt.
  revision_rationale: Die Revision vermeidet die nicht ausdrücklich belegte Konkretisierung „Scheiterhaufen“, stellt die passive Bewahrung der Zeugen wieder her und glättet einzelne Formulierungen. Der eingeklammerte Text bleibt als unsichere beziehungsweise ergänzte Stelle kenntlich. Da die unmittelbare griechische Handschriftenprüfung noch aussteht, erhebt die Rezension über das bereitgestellte englische Zeugnis hinaus keinen Variantenentscheid.
