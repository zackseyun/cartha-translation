base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: de
  text: '**Martyrium des Polykarp 3**


    Doch Gott sei Dank! Denn er setzte sich gegen alle durch. Der hochherzige Germanikus gab ihrer Verzagtheit nämlich durch die Ausdauer, die in ihm war, Mut und kämpfte auf außergewöhnliche Weise mit den wilden Tieren. Als der Prokonsul ihn umstimmen wollte und ihn aufforderte, seine Jugend zu schonen, zog er das wilde Tier gewaltsam zu sich heran; denn er wollte umso schneller von ihrem ungerechten und gesetzlosen Leben befreit werden.[a]


    Danach staunte die ganze Menge über den Mut des von Gott geliebten und gottesfürchtigen Volkes der Christen und schrie: »Weg mit den Atheisten![b] Polykarp soll gesucht werden!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht eine possessive Form: »von ihrem ungerechten und gesetzlosen Leben«. Auf wen sich »ihrem« genau bezieht, ist nicht völlig klar.'
    reason: Bewahrt die im Ausgangstext bestehende Offenheit des Pronomenbezugs.
  - marker: b
    text: Christen wurden hier von der heidnischen Menge als »Atheisten« beschimpft, weil sie die traditionellen Götter nicht verehrten. Der Ruf steht in bewusster Spannung zur vorherigen Bezeichnung der Christen als gottesfürchtig.
    reason: Erläutert die historische Bedeutung des Begriffs, ohne ihn modern-theologisch umzudeuten.
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Doch Gott sei Dank!
  rationale: Gibt die knappe Danksagung idiomatisch und würdig wieder.
- source_word: ὑπομονή
  choice: Ausdauer
  rationale: Bezeichnet hier standhaftes Ausharren unter Verfolgung, ohne den Ausdruck auf bloße Geduld zu verengen.
- source_word: δειλία
  choice: Verzagtheit
  rationale: Bewahrt den Gedanken von Furcht und fehlendem Mut, klingt aber im Deutschen weniger verurteilend als »Feigheit«.
- source_word: ἐπισήμως ἐθηριομάχησεν
  choice: kämpfte auf außergewöhnliche Weise mit den wilden Tieren
  rationale: Gibt sowohl den öffentlichen Tierkampf als auch seine besonders auffällige Art wieder.
- source_word: γένος τῶν Χριστιανῶν
  choice: Volk der Christen
  rationale: Bewahrt den kollektiven Sinn von γένος, ohne im modernen Deutsch eine biologische »Rasse« zu suggerieren.
- source_word: ἄθεοι
  choice: Gottlosen
  rationale: Der Zuruf bezeichnet aus heidnischer Sicht Menschen, die die anerkannten Götter nicht verehren; »Gottlose« funktioniert als natürlicher Anklageruf.
theological_decisions:
- issue: Bezug von »er erwies sich allen gegenüber als standhaft«
  choice: Das Pronomen »er« bleibt im Haupttext stehen.
  alternative: Explizit »Germanikus überwand sie alle« oder »Gott überwand alle« schreiben.
  rationale: Die zugrunde liegende Formulierung ist in Bezug und genauer Bedeutung nicht völlig eindeutig; eine ausdrückliche Identifikation würde diese Spannung vorschnell auflösen.
- issue: Bedeutung von »Gottlosen« im Ruf der Menge
  choice: Der Ausdruck bleibt als Anklage der heidnischen Menge gegen die Christen stehen und wird erläutert.
  alternative: Mit »Atheisten« übersetzen.
  rationale: »Atheisten« wäre formnäher, kann modern aber eine philosophische Leugnung jeder Gottheit suggerieren. Gemeint ist hier vor allem die Ablehnung der öffentlich verehrten Götter.
- issue: Wunsch nach Befreiung vom ungerechten und gesetzlosen Leben
  choice: Die im Text stehende possessive Form »ihrem« wird bewahrt.
  alternative: Zu »diesem ungerechten und gesetzlosen Leben« glätten.
  rationale: Der mögliche Bezug des Pronomens soll nicht stillschweigend festgelegt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton. Die Ausrufe bleiben kraftvoll, ohne altertümliche Syntax. Da für den Auftrag ausdrücklich vermerkt ist, dass die direkte Prüfung des griechischen Ausgangstextes noch aussteht, ist der Entwurf hinsichtlich textkritischer Einzelheiten als vorläufig zu behandeln.
