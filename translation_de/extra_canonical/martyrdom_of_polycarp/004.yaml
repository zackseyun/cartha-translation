revisions:
- from: '**Martyrium des Polykarp 3**


    Doch Gott sei Dank! Denn er erwies sich allen gegenüber als standhaft.[a] Der überaus tapfere Germanikus half ihnen nämlich durch seine eigene Ausdauer, ihre Verzagtheit zu überwinden, und kämpfte auf außergewöhnliche Weise mit den wilden Tieren. Als der Prokonsul ihn umstimmen wollte und ihn aufforderte, aus Mitleid mit seiner Jugend sein Leben zu schonen, zog Germanikus das wilde Tier gewaltsam zu sich heran; denn er wollte umso schneller von ihrem ungerechten und gesetzlosen Leben befreit werden.[b]


    Darauf staunte die ganze Menge über den Mut des von Gott geliebten und gottesfürchtigen Volkes der Christen und schrie: »Weg mit den Gottlosen![c] Polykarp soll gesucht werden!«'
  to: '**Martyrium des Polykarp 3**


    Doch Gott sei Dank! Denn er setzte sich gegen alle durch. Der hochherzige Germanikus gab ihrer Verzagtheit nämlich durch die Ausdauer, die in ihm war, Mut und kämpfte auf außergewöhnliche Weise mit den wilden Tieren. Als der Prokonsul ihn umstimmen wollte und ihn aufforderte, seine Jugend zu schonen, zog er das wilde Tier gewaltsam zu sich heran; denn er wollte umso schneller von ihrem ungerechten und gesetzlosen Leben befreit werden.[a]


    Danach staunte die ganze Menge über den Mut des von Gott geliebten und gottesfürchtigen Volkes der Christen und schrie: »Weg mit den Atheisten![b] Polykarp soll gesucht werden!«'
  rationale: Eine vollständige Revision ist nötig, weil die Eröffnungsaussage über Gott sachlich falsch wiedergegeben und durch eine irreführende Fußnote abgesichert wurde. Die Revision stellt Gottes Durchsetzung gegen alle wieder her, wahrt bei »ihrem ... Leben« die überlieferte Ambiguität und übersetzt den öffentlichen Ruf formnäher mit einer knappen historischen Erklärung.
