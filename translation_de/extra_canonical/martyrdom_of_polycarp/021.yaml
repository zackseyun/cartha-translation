source:
  text: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
