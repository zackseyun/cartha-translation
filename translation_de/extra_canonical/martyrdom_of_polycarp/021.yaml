review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng. Die unbestimmte Erwählungsformel bleibt zu Recht ohne ergänztes Objekt erhalten. Da keine griechische Lesung vorliegt, werden keine darüber hinausgehenden textkritischen Entscheidungen getroffen.
  naturalness: Die Vorlage ist weitgehend verständlich, doch „gleichsam eine Zusammenfassung gegeben“ ist im Deutschen unidiomatisch und gibt den Mitteilungscharakter von „have certified ... in a summary“ nur abgeschwächt wieder. „einziggezeugten“ ist zwar formal nachvollziehbar, im modernen Standarddeutsch aber ungebräuchlich; „einziggeborenen“ ist die etablierte natürliche Entsprechung für den überlieferten Titel. Die Schlussgrußsyntax wird mit „samt seinem ganzen Haus“ klarer.
  terminology: „Heilige“, „Gnade und Güte“, „ewiges Reich“ sowie die offene Formel „der aus seinen eigenen Dienern erwählt“ sind angemessen. „Brüder und Schwestern“ ist als kontextuelle, inklusive Wiedergabe von „brethren“ vertretbar.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe der zusammenfassenden Mitteilung
    rationale: „haben wir euch ... gleichsam eine Zusammenfassung gegeben“ klingt im Deutschen nicht natürlich und lässt das Verb des Informierens/Berichtens in den Hintergrund treten.
  - severity: low
    issue: Ungebräuchliche Form „einziggezeugten Sohn“
    rationale: „Einziggeborener Sohn“ ist im modernen deutschen theologischen Sprachgebrauch die natürliche und zugleich eng am Titel „only-begotten Son“ bleibende Formulierung.
  - severity: low
    issue: Schlussgruß ist syntaktisch weniger klar
    rationale: „ebenso Euarestus ... mit seinem ganzen Haus“ lässt die Zuordnung des Grußes unnötig schwerfällig erscheinen; „samt seinem ganzen Haus“ stellt klar, dass Euarestus und seine Hausgemeinschaft grüßen.
  revised_text: 'Ihr habt darum gebeten, dass euch die Ereignisse ausführlicher dargestellt werden. Für jetzt aber haben wir euch durch unseren Bruder Marcianus nur kurz darüber informiert. Wenn ihr dies erfahren habt, gebt den Brief auch an die weiter entfernt lebenden Brüder und Schwestern weiter, damit auch sie den Herrn verherrlichen, der aus seinen eigenen Dienern erwählt.


    Ihm nun, der uns alle durch seine Gnade und Güte durch seinen einziggeborenen Sohn Jesus Christus in sein ewiges Reich zu führen vermag, sei Herrlichkeit, Ehre, Macht und Größe in Ewigkeit. Grüßt alle Heiligen. Die bei uns sind, grüßen euch, ebenso Euarestus, der den Brief geschrieben hat, samt seinem ganzen Haus.'
  revised_footnotes: []
  revision_rationale: Die Revision glättet ausschließlich sichere idiomatische Punkte. Sie bewahrt die knappe, vorläufige Berichterstattung durch Marcianus, die offene Erwählungsformel, die doxologische Reihung und die Mehrdeutigkeit von „Haus“ als Hausgemeinschaft/Haushalt. Eine direkte Prüfung der griechischen Überlieferung bleibt erforderlich, ist aber für diese sprachlichen Korrekturen nicht Voraussetzung.
