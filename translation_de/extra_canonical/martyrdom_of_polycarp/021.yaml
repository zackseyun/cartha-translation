  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: de
  text: 'Ihr habt darum gebeten, dass euch die Ereignisse ausführlicher dargestellt werden. Für den Augenblick aber haben wir euch durch unseren Bruder Marcianus gleichsam eine Zusammenfassung gegeben. Wenn ihr euch darüber informiert habt, gebt den Brief auch an die weiter entfernt lebenden Brüder und Schwestern weiter, damit auch sie den Herrn verherrlichen, der aus seinen eigenen Dienern erwählt.


    Ihm nun, der uns alle durch seine Gnade und Güte durch seinen einziggezeugten Sohn Jesus Christus in sein ewiges Reich zu führen vermag, sei Herrlichkeit, Ehre, Macht und Größe in Ewigkeit. Grüßt alle Heiligen. Die bei uns sind, grüßen euch, ebenso Euarestus, der den Brief geschrieben hat, mit seinem ganzen Haus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: certified ... as it were in a summary
  choice: gleichsam eine Zusammenfassung gegeben
  rationale: Gibt die vorsichtige, zusammenfassende Mitteilung des Zeugen natürlich wieder, ohne eine förmliche Beglaubigung hineinzulesen.
- source_word: brethren
  choice: Brüder und Schwestern
  rationale: Bezeichnet in diesem gemeinschaftlichen Kontext die gesamte christliche Geschwisterschaft in verständlichem modernem Deutsch.
- source_word: maketh election from His own servants
  choice: der aus seinen eigenen Dienern erwählt
  rationale: Bewahrt die ungewöhnliche und theologisch offene Aussage, ohne Gegenstand oder Zweck der Erwählung zu ergänzen.
- source_word: grace and bounty
  choice: Gnade und Güte
  rationale: Unterscheidet die beiden Begriffe in einer natürlichen, würdigen deutschen Wortwahl.
- source_word: only-begotten Son
  choice: einziggezeugten Sohn
  rationale: Erhält die traditionelle christologische Aussage enger als bloß „einziger Sohn“, ohne sie weiter auszulegen.
- source_word: saints
  choice: Heiligen
  rationale: Bewahrt die frühchristliche Anrede für die Glaubenden und vermeidet eine spätere institutionelle Verengung.
- source_word: house
  choice: Haus
  rationale: Lässt offen, ob Haushalt, Hausgemeinschaft oder Familie gemeint ist.
theological_decisions:
- issue: Erwählung aus den eigenen Dienern
  choice: „der aus seinen eigenen Dienern erwählt“
  alternative: „der seine Diener erwählt“
  rationale: Die gewählte Fassung bewahrt die im überlieferten Zeugen erkennbare Präposition und löst nicht auf, in welchem Sinn aus der Gruppe der Diener erwählt wird.
- issue: Christologischer Titel
  choice: „einziggezeugten Sohn“
  alternative: „einzigen Sohn“
  rationale: Da eine Zeugungsbezeichnung ausdrücklich belegt ist, wird sie sichtbar erhalten; die Übersetzung legt ihre metaphysische Ausdeutung nicht zusätzlich fest.
- issue: Reichweite von „Brüder“
  choice: „Brüder und Schwestern“
  alternative: „Brüder“
  rationale: Im gemeindlichen Plural ist die ganze Gemeinschaft angesprochen; die inklusive Wiedergabe macht diese pragmatische Bedeutung deutlich, ohne ein Amt oder Geschlecht umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit frühchristlichem Brief- und Doxologiestil. Wegen der noch ausstehenden direkten Prüfung des griechischen Wortlauts sind syntaktisch oder lexikalisch strittige Stellen eng am bereitgestellten öffentlichen englischen Zeugen gehalten; insbesondere die Erwählungsformel wurde nicht geglättet.
