revisions:
- from: 'Als nun der Hauptmann den von den Juden erhobenen Widerstand sah, ließ er Polykarp in die Mitte bringen und ihn nach ihrer Sitte verbrennen.


    Danach nahmen wir seine Gebeine auf, die wertvoller sind als kostbare Steine und edler als geläutertes Gold, und legten sie an einem geeigneten Ort nieder.


    Dort wird der Herr uns, soweit es uns möglich ist, zusammenkommen lassen, damit wir in Jubel und Freude den Geburtstag seines Martyriums[a] feiern: zum Gedenken an die, die den Kampf bereits bestanden haben, und zur Einübung und Vorbereitung derer, die ihn künftig bestehen werden.'
  to: 'Als nun der Hauptmann den von den Juden erhobenen Widerstand sah, stellte er Polykarp in die Mitte und verbrannte ihn nach ihrer Sitte.


    Danach nahmen wir seine Gebeine auf, die wertvoller sind als kostbare Steine und edler als geläutertes Gold, und legten sie an einem geeigneten Ort nieder.


    Dort wird der Herr uns gestatten, uns, soweit es uns möglich ist, in Jubel und Freude zu versammeln und den Geburtstag seines Martyriums[a] zu feiern: zum Gedenken an die, die den Kampf bereits bestanden haben, und zur Einübung und Vorbereitung derer, die ihn künftig bestehen werden.'
  rationale: Die Revision folgt dem griechischen Text an den beiden entscheidenden Stellen enger, ohne dessen historische und syntaktische Mehrdeutigkeiten zu glätten. Insbesondere bleibt offen, auf wen sich „ihrer Sitte“ bezieht. Die Fußnote bleibt bestehen, weil sie die ungewöhnliche Bezeichnung des Todestags erläutert, ohne den Haupttext interpretierend umzuformen.
