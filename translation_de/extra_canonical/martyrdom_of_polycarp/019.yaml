base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: de
  text: 'Als nun der Hauptmann den von den Juden erhobenen Widerstand sah, stellte er Polykarp in die Mitte und verbrannte ihn nach ihrer Sitte.


    Danach nahmen wir seine Gebeine auf, die wertvoller sind als kostbare Steine und edler als geläutertes Gold, und legten sie an einem geeigneten Ort nieder.


    Dort wird der Herr uns gestatten, uns, soweit es uns möglich ist, in Jubel und Freude zu versammeln und den Geburtstag seines Martyriums[a] zu feiern: zum Gedenken an die, die den Kampf bereits bestanden haben, und zur Einübung und Vorbereitung derer, die ihn künftig bestehen werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Geburtstag seines Martyriums“ ist sein Todestag als Märtyrer gemeint, den frühe Christen als Eingang in das neue Leben verstanden und jährlich gedachten.
    reason: Die historische frühchristliche Wendung ist ohne Erklärung für heutige Leser leicht missverständlich.
lexical_decisions:
- source_word: centurion
  choice: Hauptmann
  rationale: Die im Deutschen traditionsreiche und allgemein verständliche Bezeichnung gibt den römischen militärischen Rang hier natürlich wieder.
- source_word: bones
  choice: Gebeine
  rationale: „Gebeine“ ist im Bestattungs- und Reliquienkontext würdevoller und treffender als das alltägliche „Knochen“.
- source_word: birth-day of his martyrdom
  choice: Geburtstag seines Martyriums
  rationale: Die wörtlich anmutende frühchristliche Wendung bezeichnet den Todestag des Märtyrers als Eingang in das neue Leben; eine Fußnote bewahrt diese Bedeutung, ohne sie im Text aufzulösen.
- source_word: contest
  choice: Kampf
  rationale: Das Bild des Wettkampfs beziehungsweise Kampfes bleibt erhalten und klingt im Deutschen natürlicher als „Wettstreit“ in Verbindung mit „bestehen“.
- source_word: training
  choice: Einübung
  rationale: Die Wahl bewahrt den Gedanken praktischer Formung durch das Gedenken und vermeidet den modernen, rein sportlichen Klang von „Training“.
theological_decisions:
- issue: Bezeichnung des Todestages als Geburtstag
  choice: „Geburtstag seines Martyriums“ im Haupttext mit erklärender Fußnote
  alternative: „Jahrestag seines Martyriums“ oder „Geburtstag zum ewigen Leben“
  rationale: Die ungewöhnliche frühchristliche Ausdrucksweise und ihre theologische Spannung werden bewahrt, ohne eine bestimmte Auslegung in den Haupttext einzutragen.
- issue: Wertschätzung der sterblichen Überreste
  choice: Die vergleichende Aussage wird unmittelbar und ohne Abschwächung wiedergegeben.
  alternative: Eine rein symbolische oder relativierende Umschreibung
  rationale: Der Text selbst misst den Gebeinen hohen Wert bei; die Übersetzung soll diese historische Aussage weder konfessionell ausbauen noch modernisierend entschärfen.
- issue: Göttliche Ermöglichung der Versammlung
  choice: „Dort wird der Herr uns … zusammenkommen lassen“
  alternative: „Dort wird der Herr uns erlauben, uns zu versammeln“
  rationale: Die Formulierung bewahrt die Abhängigkeit vom Herrn und ergibt zugleich einen natürlichen deutschen Satz; wegen der ausstehenden griechischen Prüfung bleibt die genaue Nuance vorläufig.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit frühchristlichem Gedenk- und Kampfvokabular. Die Fassung ist aufgrund der bereitgestellten Daten vorläufig: Sie stützt sich auf den gemeinfreien englischen Zeugen; eine unmittelbare Prüfung am griechischen Text steht noch aus. Das Pronomen in „nach ihrer Sitte“ bleibt wie im Zeugen mehrdeutig und wird nicht erklärend aufgelöst.'
