  source_fidelity: 'Der Entwurf gibt den Sinn der vorgelegten englischen Zeugenübersetzung präzise wieder und entspricht auch dem überlieferten griechischen Wortlaut im Wesentlichen: die gegensätzliche Veränderung vom Besseren zum Schlechteren beziehungsweise vom Unrecht zur Gerechtigkeit, das zeitlich begrenzte Feuer und das für die Gottlosen aufbewahrte Feuer des künftigen Gerichts samt ewiger Strafe bleiben erhalten. Die Fußnote kennzeichnet zutreffend, dass die hier bereitgestellte Arbeitsgrundlage noch keine unmittelbare Prüfung der griechischen Handschriftentradition dokumentiert.'
  naturalness: 'Die Sprache ist überwiegend klar und würdig. Zwei Formulierungen lassen sich jedoch ohne Sinnverlust idiomatischer gestalten: „hier wilde Tiere“ ist die natürliche Wortstellung; „dich vom Feuer verzehren lassen“ ist zwar verständlich, aber im modernen Deutsch sperrig. „dich durch Feuer verbrennen lassen“ bildet die veranlasste Tötung durch Feuer klarer ab.'
  terminology: „umkehren/Umkehr“, „Unrecht“, „Gerechtigkeit“, „künftiges Gericht“, „ewige Strafe“ und „Gottlose“ sind angemessen und bewahren die ethisch-theologische Terminologie ohne konfessionelle Einengung. „wilde Tiere“ ist für die im Kontext angedrohten Tiere sachlich und verständlich.
  issues:
