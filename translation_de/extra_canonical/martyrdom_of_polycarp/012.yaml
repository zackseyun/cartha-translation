base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: de
  text: 'Darauf sagte der Prokonsul: »Ich habe hier wilde Tiere und werde dich ihnen vorwerfen, wenn du nicht umkehrst.« Polykarp erwiderte: »Lass sie kommen! Denn eine Umkehr vom Besseren zum Schlechteren ist für uns nicht erlaubt. Wohl aber ist es edel, sich vom Unrecht zur Gerechtigkeit zu wenden.«


    Da sagte er erneut zu ihm: »Wenn du die wilden Tiere verachtest und nicht umkehrst, werde ich dich durch Feuer verbrennen lassen.« Polykarp aber antwortete: »Du drohst mir mit einem Feuer, das nur eine Zeit lang brennt und kurz darauf erlischt. Denn du kennst das Feuer des künftigen Gerichts und der ewigen Strafe nicht, das für die Gottlosen aufbewahrt ist. Doch warum zögerst du? Komm, tu, was du willst!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung auf Grundlage der angegebenen gemeinfreien englischen Textüberlieferung. Eine unmittelbare Prüfung der griechischen Handschriftentradition steht noch aus.
    reason: Die bereitgestellte Quellenlage bezeichnet die griechische Prüfung ausdrücklich als ausstehend; die Anmerkung macht den begrenzten Evidenzstand transparent.
lexical_decisions:
- source_word: repent / repentance (Greek review pending)
  choice: umkehren / Umkehr
  rationale: Das deutsche »umkehren« bewahrt sowohl den moralisch-religiösen Sinn als auch das im Wortwechsel wichtige Motiv eines Richtungswechsels vom Besseren zum Schlechteren beziehungsweise vom Unrecht zur Gerechtigkeit.
- source_word: wild beasts
  choice: wilde Tiere
  rationale: Natürliche, allgemein verständliche Wiedergabe; der römische Hinrichtungskontext bleibt aus dem Zusammenhang erkennbar.
- source_word: untowardness / wrongdoing
  choice: Unrecht
  rationale: Bewahrt den moralischen Gegensatz zu »Gerechtigkeit«, ohne die genaue Art des Fehlverhaltens unnötig festzulegen.
- source_word: righteousness
  choice: Gerechtigkeit
  rationale: Traditionell und sachlich passend; hält die ethisch-theologische Spannweite des Begriffs offen.
- source_word: future judgment
  choice: künftiges Gericht
  rationale: Formale und verständliche Wiedergabe des eschatologischen Bezugs.
- source_word: ungodly
  choice: Gottlose
  rationale: Bewahrt die religiös-moralische Bedeutung, ohne eine bestimmte konfessionelle Deutung einzutragen.
theological_decisions:
- issue: Bedeutung der geforderten Reue beziehungsweise Umkehr
  choice: Durchgehend »umkehren/Umkehr«
  alternative: »bereuen/Reue« oder »widerrufen«
  rationale: Die Replik Polykarps spielt ausdrücklich mit einer Veränderung der Richtung. »Umkehr« erhält dieses Wortspiel und legt zugleich nicht fest, ob der Prokonsul bloß einen Widerruf oder eine umfassendere Abkehr vom christlichen Bekenntnis fordert.
- issue: Ewige Strafe und künftiges Gericht
  choice: Die Aussage wird ohne Abschwächung als Polykarps direkte Rede wiedergegeben.
  alternative: Paraphrase oder dogmatische Erläuterung der Art der Strafe
  rationale: Der Text stellt zeitliches Feuer und das Feuer des künftigen Gerichts samt ewiger Strafe gegenüber. Die Übersetzung bewahrt diese Spannung, ohne darüber hinaus eine Lehre über Wesen oder Vollzug der Strafe einzutragen.
translation_notes:
  register: Moderne deutsche Standardsprache mit würdigem, klar lesbarem Ton. Die Anrede bleibt entsprechend der antiken Einzelsituation beim »du«, ohne archaische Verbformen. Kurze Ausrufe geben Polykarps Entschlossenheit wieder. Wegen der noch ausstehenden griechischen Quellenprüfung ist die Formulierung bewusst textnah zur öffentlichen englischen Zeugenübersetzung gehalten.
