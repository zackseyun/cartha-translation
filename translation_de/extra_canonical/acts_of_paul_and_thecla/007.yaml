base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: de
  text: '**KAPITEL VII**


    **7:1** Darauf schickte Paulus Onesiphorus und seine Familie nach Hause zurück. Er nahm Thekla mit und zog nach Antiochia.


    **7:2** Kaum hatten sie die Stadt betreten, da sah ein Syrer namens Alexander, ein städtischer Amtsträger, Thekla und verliebte sich in sie. Während seiner Amtszeit hatte er der Stadt viele bedeutende Dienste erwiesen. Mit zahlreichen kostbaren Geschenken versuchte er, Paulus für sich zu gewinnen.


    **7:3** Paulus aber sagte zu ihm: »Ich kenne die Frau nicht, von der du sprichst; sie gehört auch nicht zu mir.«


    **7:4** Alexander jedoch, der in Antiochia großen Einfluss besaß, packte sie auf offener Straße und küsste sie. Thekla ließ sich das nicht gefallen. Während sie nach Paulus Ausschau hielt, schrie sie laut in ihrer Not: »Tu mir keine Gewalt an – ich bin eine Fremde! Tu mir keine Gewalt an – ich bin eine Dienerin Gottes! Ich gehöre zu den angesehenen Persönlichkeiten Ikonions und musste die Stadt verlassen, weil ich mich weigerte, Thamyris zu heiraten.«


    **7:5** Da packte sie Alexander, zerriss sein Obergewand, riss ihm den Kranz[a] vom Kopf und machte ihn vor allen Leuten lächerlich.


    **7:6** Alexander aber führte sie vor den Statthalter – teils weil er sie liebte, teils weil er sich für das Geschehene schämte. Nachdem sie eingestanden hatte, was sie getan hatte, verurteilte der Statthalter sie dazu, den wilden Tieren vorgeworfen zu werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kranz: Gemeint ist ein auf dem Kopf getragenes Ehren- oder Amtszeichen; seine genaue Gestalt und Bedeutung bleiben hier offen.'
    reason: Das zugrunde liegende englische Zeugnis bietet „crown“, während eine direkte Prüfung der griechischen und versionalen Überlieferung noch aussteht.
lexical_decisions:
- source_word: magistrate
  choice: städtischer Amtsträger
  rationale: Die Formulierung gibt ein öffentliches Amt wieder, ohne mangels abgeschlossener Prüfung des griechischen Wortlauts eine spezifischere Amtsbezeichnung festzulegen.
- source_word: engage Paul in his interest
  choice: Paulus für sich zu gewinnen
  rationale: Diese idiomatische Wiedergabe bewahrt den Sinn eines Bestechungs- oder Einflussversuchs, ohne ein im Zeugnis nicht ausdrücklich genanntes Geschäft zu unterstellen.
- source_word: force me not
  choice: Tu mir keine Gewalt an
  rationale: Die Wendung erfasst den körperlichen und sexuellen Zwang im Zusammenhang und bleibt zugleich weiter als eine unnötig präzisierende moderne Rechtsbezeichnung.
- source_word: one of the principal persons of Iconium
  choice: eine der angesehenen Persönlichkeiten Ikonions
  rationale: Die gesellschaftliche Stellung Theklas wird ausgedrückt, ohne Rang, Amt oder Adel genauer zu bestimmen, als es das vorliegende englische Zeugnis erlaubt.
- source_word: crown
  choice: Kranz
  rationale: „Kranz“ bezeichnet plausibel einen am Kopf getragenen Ehren- oder Amtskranz; seine genaue Form und Funktion bleiben in der Fußnote offen.
- source_word: beasts
  choice: wilde Tiere
  rationale: Die traditionelle Hinrichtungsform wird verständlich bezeichnet, ohne eine bestimmte Tierart zu ergänzen.
theological_decisions:
- issue: Theklas Selbstbezeichnung als servant of God
  choice: Dienerin Gottes
  alternative: Magd Gottes
  rationale: „Dienerin Gottes“ bewahrt die theologische Selbstbezeichnung in heutigem, würdevollem Deutsch, ohne zusätzliche kirchliche oder ordensbezogene Bedeutung einzutragen.
- issue: Paulus’ Aussage, Thekla gehöre nicht zu ihm
  choice: sie gehört auch nicht zu mir
  alternative: sie steht nicht unter meiner Verfügung
  rationale: Die knappe und spannungsreiche Aussage des Zeugnisses bleibt erhalten; weder eine besitzrechtliche noch eine autoritätsbezogene Deutung wird ausdrücklich festgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit erzählerisch-würdevollem Ton. Direkte Rede ist lebendig, aber nicht umgangssprachlich gestaltet. Der Entwurf ist ausdrücklich vorläufig, da nach den bereitgestellten Metadaten die direkte Prüfung der griechischen und versionalen Überlieferung noch aussteht; deshalb wurden unsichere Amts- und Rangbezeichnungen nicht überpräzisiert.
