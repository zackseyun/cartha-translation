review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng. Einige Eingriffe gehen jedoch über ihn hinaus: In 2:16 fügt »Für euch« eine im Zeugen nicht vorhandene Einschränkung ein; »euren Leib unbefleckt bewahrt« glättet das konkrete Bild von der Befleckung des Fleisches. In 2:3 gibt »sich ... überwältigen ließ« die passive Wendung nur ungenau wieder und klingt unnötig voluntativ. Die Korrekturen bewahren den vorläufigen Charakter, da kein griechischer Wortlaut vorliegt.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. Korrigiert werden sollten besonders »die Gedanken der Menschen verführt« (2:14), das im Deutschen semantisch unscharf ist, sowie einige Formulierungen, die den englischen Satzbau zu eng nachbilden. Die revidierte Fassung bleibt erzählerisch und klar.
  terminology: Die Namen Thekla, Theoklia, Thamyris, Onesiphorus, Demas, Hermogenes und Ikonion sind konsistent. »Jungfrau«, »verlobt«, »Lehren des Glaubens«, »Enthaltsamkeit« und »Auferstehung« sind angemessen. Für 2:16 wird das Bild »euer Fleisch nicht befleckt« beibehalten; es soll nicht durch eine dogmatisch oder stilistisch glättende Umschreibung ersetzt werden.
  issues:
  - severity: medium
    issue: '2:3: »bis sie sich ... von den Lehren des Glaubens überwältigen ließ«'
    rationale: Das englische »was subdued to« beschreibt, dass sie den Glaubenslehren gewonnen bzw. unterworfen wurde; »ließ sich ... überwältigen« verschiebt dies zu einer bewusst zugelassenen Handlung und ist stilistisch weniger präzise.
  - severity: medium
    issue: '2:14: »die Gedanken der Menschen verführt«'
    rationale: Der Zeuge spricht von »minds« und »deludes«; im Deutschen täuscht oder verführt der Mann Menschen bzw. führt sie in die Irre, nicht ihre Gedanken.
  - severity: high
    issue: '2:16: »Für euch kann es keine künftige Auferstehung geben«'
    rationale: Das hinzugefügte »Für euch« steht weder im bereitgestellten Ausgangszeugen noch in der englischen POB-Fassung und individualisiert die Aussage ohne Textgrundlage.
  - severity: medium
    issue: '2:16: »euren Leib unbefleckt bewahrt«'
    rationale: Die Formulierung ist interpretierend geglättet. Der Zeuge hat ausdrücklich »do not defile your flesh«; »euer Fleisch nicht befleckt« erhält das körperlich-moralische Bild.
  - severity: low
    issue: Fußnote e bezeichnet die Wiedergabe als »künftige Frauen/Männer«, während der englische Zeuge die Ergänzung »(intended)« ausdrücklich markiert.
    rationale: Die erläuternde Fußnote sollte die im Zeugen markierte Ergänzung transparent nennen und darf sie nicht als unmarkierten Textbestand behandeln.
