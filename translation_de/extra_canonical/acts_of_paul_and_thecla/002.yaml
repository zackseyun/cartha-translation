translation:
  language: de
  text: '**Kapitel II**


    **2:1** Während Paulus diese Predigt in der Gemeinde hielt, die sich im Haus des Onesiphorus versammelte, saß eine Jungfrau namens Thekla an einem Fenster ihres Hauses. Ihre Mutter hieß Theoklia, und sie war mit einem Mann namens Thamyris verlobt.


    **2:2** Von dort aus konnte sie durch ein Fenster des Hauses, in dem Paulus sich aufhielt, Tag und Nacht seine Predigten über Gott, über die Liebe, über den Glauben an Christus und über das Gebet hören.


    **2:3** Sie wich nicht vom Fenster, bis sie sich mit übergroßer Freude von den Lehren des Glaubens überwältigen ließ.[a]


    **2:4** Als sie schließlich viele Frauen und Jungfrauen zu Paulus hineingehen sah, sehnte sie sich inständig danach, für würdig erachtet zu werden, vor ihn zu treten und das Wort Christi zu hören. Denn sie hatte Paulus selbst noch nicht gesehen, sondern lediglich seine Predigten gehört.


    **2:5** Weil sie sich nicht dazu bewegen ließ, das Fenster zu verlassen, schickte ihre Mutter nach Thamyris. Er kam hocherfreut, weil er hoffte, sie nun heiraten zu können. Er fragte Theoklia: »Wo ist meine Thekla?«


    **2:6** Theoklia antwortete: »Thamyris, ich muss dir etwas höchst Seltsames erzählen. Seit drei Tagen weicht Thekla nicht vom Fenster, nicht einmal um zu essen oder zu trinken. So gebannt hört sie den kunstvollen und trügerischen Reden eines Fremden zu, dass ich mich wirklich wundere, Thamyris, wie eine junge Frau, deren Schamhaftigkeit allgemein bekannt ist, sich derart von ihm einnehmen lassen kann.


    **2:7** Dieser Mann hat nämlich die ganze Stadt Ikonion in Aufruhr versetzt und unter anderen auch deine Thekla. Alle Frauen und jungen Männer strömen zu ihm, um seine Lehre anzunehmen. Vor allem sagt er ihnen, es gebe nur einen Gott, der allein verehrt werden dürfe, und wir müssten in Enthaltsamkeit leben.[b]


    **2:8** Dennoch hängt meine Tochter Thekla wie ein Spinnennetz am Fenster fest. Sie ist von den Reden des Paulus gefesselt und lauscht ihnen mit ungeheurer Begierde und größtem Entzücken. Indem die junge Frau auf seine Worte hört, wird sie verführt. Geh nun zu ihr und rede mit ihr, denn sie ist mit dir verlobt.«


    **2:9** Da ging Thamyris zu ihr. Er begrüßte sie und achtete darauf, sie nicht zu erschrecken. Dann sagte er: »Thekla, meine Braut, warum sitzt du so niedergeschlagen da? Was für seltsame Gedanken haben dich ergriffen? Wende dich Thamyris zu und erröte.«[c]


    **2:10** Ebenso redete ihre Mutter auf sie ein: »Mein Kind, warum sitzt du so niedergeschlagen da und antwortest nicht, als wärst du erstarrt?«


    **2:11** Da weinten sie bitterlich: Thamyris, weil er seine Braut verloren hatte; Theoklia, weil sie ihre Tochter verloren hatte; und die Dienerinnen, weil sie ihre Herrin verloren hatten. Im ganzen Haus herrschte große Trauer.


    **2:12** Doch all das machte auf Thekla nicht den geringsten Eindruck; sie wandte sich ihnen nicht einmal zu und nahm keine Notiz von ihnen, denn sie achtete weiterhin auf die Reden des Paulus.


    **2:13** Darauf lief Thamyris auf die Straße hinaus, um zu beobachten, wer bei Paulus ein- und ausging. Er sah zwei Männer, die heftig miteinander stritten, und sprach sie an:


    **2:14** »Ihr Männer, was habt ihr hier zu tun? Und wer ist dieser Mann dort drinnen, der zu euch gehört und die Gedanken der Menschen verführt – die der jungen Männer ebenso wie die der Jungfrauen –, indem er ihnen einredet, sie sollten nicht heiraten, sondern so bleiben, wie sie sind?


    **2:15** Ich verspreche euch eine beträchtliche Summe, wenn ihr mir zuverlässig Auskunft über ihn gebt; denn ich bin der angesehenste Mann dieser Stadt.«[d]


    **2:16** Demas und Hermogenes antworteten: »Wer er ist, können wir dir nicht genau sagen. Doch eines wissen wir: Er nimmt den jungen Männern ihre künftigen Frauen und den Jungfrauen ihre künftigen Männer, indem er lehrt: ›Für euch kann es keine künftige Auferstehung geben, wenn ihr nicht in Enthaltsamkeit bleibt und euren Leib unbefleckt bewahrt.‹«[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung »von den Lehren des Glaubens überwältigen ließ« folgt dem starken Bild des englischen Zeugnisses. Eine Prüfung am griechischen und versionalen Text steht noch aus.
    reason: Provisorische Quellenlage und auffällige Bildsprache transparent machen.
  - marker: b
    text: »Enthaltsamkeit« bezeichnet hier im Zusammenhang den Verzicht auf Ehe und sexuelle Gemeinschaft; der genaue griechische Ausdruck muss noch am Quellentext geprüft werden.
    reason: Askese-Begriff erläutern, ohne konfessionelle Festlegung.
  - marker: c
    text: Die Aufforderung »erröte« kann Scham, sittsame Zurückhaltung oder die erwartete Reaktion einer Braut bezeichnen. Die Mehrdeutigkeit bleibt erhalten.
    reason: Kulturell fremde und semantisch offene Wendung erklären.
  - marker: d
    text: 'Wörtlich nach dem englischen Zeugen: »der Erste/oberste Mann dieser Stadt«; gemeint sein kann der ranghöchste oder angesehenste Bürger.'
    reason: Mögliche Amts- oder Rangbedeutung offenhalten.
  - marker: e
    text: Diese Aussage wird Demas und Hermogenes in den Mund gelegt und kann eine gegnerische Zuspitzung von Paulus’ Lehre sein. »Künftige Frauen/Männer« gibt den Sinn der im englischen Zeugen ergänzten Angabe »intended« wieder.
    reason: Erzählperspektive, theologische Spannung und Ergänzungscharakter kenntlich machen.
lexical_decisions:
- source_word: charity (English witness; Greek review pending)
  choice: Liebe
  rationale: Im religiösen Kontext ist »Liebe« im modernen Deutsch natürlicher und umfassender als das heute enger verstandene »Wohltätigkeit«.
- source_word: virgin
  choice: Jungfrau
  rationale: Bewahrt den für die Erzählung und ihre asketische Thematik wichtigen Statusbegriff.
- source_word: chastity
  choice: Enthaltsamkeit
  rationale: Gibt hier die geforderte sexuelle Ehelosigkeit bzw. Keuschheit verständlich wieder, ohne sie mit einer späteren konfessionellen Lebensform gleichzusetzen.
- source_word: subdued
  choice: überwältigen ließ
  rationale: Bewahrt das starke, passive Bild des Zeugnisses, klingt aber im Deutschen weniger nach gewaltsamer Unterwerfung als »bezwungen«.
- source_word: mistress
  choice: Herrin
  rationale: Bezeichnet Theklas Stellung gegenüber den Dienerinnen, ohne den modernen Beiklang von »Geliebte«.
- source_word: defile your flesh
  choice: euren Leib unbefleckt bewahrt
  rationale: Natürliches, würdiges Deutsch, das die körperlich-moralische Bildsprache erhält; »Fleisch« wäre hier im Deutschen missverständlich oder unnötig abwertend.
theological_decisions:
- issue: Ein Gott und alleinige Verehrung
  choice: »es gebe nur einen Gott, der allein verehrt werden dürfe«
  alternative: »es gebe einen einzigen Gott, dem allein man dienen müsse«
  rationale: Folgt dem gelieferten Zeugnis eng, ohne »verehren« oder »dienen« durch konfessionelle Terminologie weiter auszudeuten.
- issue: Auferstehung und Enthaltsamkeit in 2:16
  choice: Als Behauptung von Demas und Hermogenes in direkter Rede belassen
  alternative: Als verlässliche Zusammenfassung der Lehre des Paulus formulieren
  rationale: Der Erzählrahmen schreibt diese Aussage Gegnern zu. Die Übersetzung darf ihre polemische Darstellung nicht stillschweigend zur objektiven Lehraussage machen.
- issue: »future resurrection«
  choice: künftige Auferstehung
  alternative: Auferstehung am Jüngsten Tag
  rationale: »Künftig« bewahrt die zeitliche Aussage, ohne eine spezifischere eschatologische Deutung einzutragen.
- issue: Bedingtheit der Auferstehung
  choice: »Für euch kann es keine künftige Auferstehung geben, wenn …«
  alternative: »Es gibt keine künftige Auferstehung, es sei denn …«
  rationale: Die personenbezogene Form macht im Deutschen verständlich, dass nach der polemischen Behauptung die Teilhabe an der Auferstehung betroffen ist, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlichem Erzählfluss. Eigennamen folgen geläufigen deutschen Formen (Thekla, Theoklia, Thamyris, Ikonion). Da kein griechischer Wortlaut bereitgestellt wurde und die direkte Quellenprüfung ausdrücklich noch aussteht, ist der Entwurf quellenkritisch vorläufig und stützt sich auf den öffentlichen englischen Zeugen sowie die auditierte POB-Konsultationsfassung.
