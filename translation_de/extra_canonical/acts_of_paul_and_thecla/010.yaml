    10:8 Bei ihrer Rückkehr fand Thekla Thamyris tot, ihre Mutter aber noch am Leben. Sie rief ihre Mutter zu sich und sagte: »Theokleia, meine Mutter, kannst du zum Glauben daran kommen, dass es nur einen Herrn und Gott gibt, der in den Himmeln wohnt? Wenn du großen Reichtum begehrst, wird Gott ihn dir durch mich geben. Wenn du deine Tochter zurückhaben willst: Hier bin ich.«


    10:9 Dies und vieles andere legte sie ihrer Mutter dar, [wobei sie sich bemühte], sie [für ihre Auffassung] zu gewinnen. Doch ihre Mutter Theokleia schenkte den Worten der Märtyrerin Thekla keinen Glauben.


    10:10 Als Thekla erkannte, dass ihre Worte nichts bewirkten, bezeichnete sie ihren ganzen Körper mit dem Zeichen [des Kreuzes], verließ das Haus und ging nach Daphne. Dort angekommen, begab sie sich zu der Höhle, in der sie Paulus mit Onesiphorus gefunden hatte, warf sich zu Boden und weinte vor Gott.


    10:11 Von dort ging sie nach Seleukia und führte viele zur Erkenntnis Christi.


    10:12 Eine leuchtende Wolke führte sie auf ihrem Weg.


    10:13 Nachdem sie Seleukia erreicht hatte, ging sie an einen Ort außerhalb der Stadt, etwa eine Furlong entfernt.[b] Sie fürchtete sich nämlich vor den Einwohnern, weil sie Götzen verehrten.


    10:14 Und sie wurde [von der Wolke] zu einem Berg namens Kalamon oder Rodeon geführt. Dort blieb sie viele Jahre und erlitt zahlreiche schwere Versuchungen durch den Teufel. Mit der Hilfe, die sie von Christus empfing, ertrug sie diese auf würdige Weise.


    10:15 Schließlich hörten einige vornehme Frauen von der Jungfrau Thekla und kamen zu ihr. Sie wurden von ihr in den Aussprüchen Gottes unterwiesen; viele von ihnen entsagten der Welt und führten mit ihr ein monastisches Leben.[c]


    10:16 So verbreitete sich überall ein guter Ruf über Thekla, und sie vollbrachte mehrere [wunderbare] Heilungen. Daher brachten die Menschen aus der ganzen Stadt und den umliegenden Gegenden ihre Kranken zu jenem Berg. Noch bevor sie bis zur Tür der Höhle kamen, wurden sie sogleich von jeder Krankheit geheilt, an der sie litten.


    10:17 Die unreinen Geister wurden unter lautem Geschrei ausgetrieben. Alle erhielten ihre Kranken geheilt zurück und verherrlichten Gott, der der Jungfrau Thekla solche Vollmacht verliehen hatte.


    10:18 Dadurch genossen die Ärzte von Seleukia kein Ansehen mehr und verloren den gesamten Ertrag ihres Gewerbes, weil niemand mehr auf sie achtete. Da wurden sie von Neid erfüllt und begannen zu überlegen, was sie gegen diese Dienerin Christi unternehmen könnten.'
