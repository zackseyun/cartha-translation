  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: de
  text: '10:1 Paulus aber war sehr erstaunt, als er sie und die Menschen bei ihr sah; denn er meinte, eine neue Prüfung komme über sie.


    10:2 Als Thekla das bemerkte, sagte sie zu ihm: »Ich bin getauft worden, Paulus; denn der, der dir beim Verkündigen beisteht, hat auch mir bei meiner Taufe beigestanden.«[a]


    10:3 Da nahm Paulus sie mit und führte sie in das Haus des Hermes. Thekla erzählte Paulus alles, was ihr in Antiochia widerfahren war. Darüber staunte Paulus überaus; alle, die es hörten, wurden im Glauben gestärkt und beteten für Tryphänas Wohlergehen.


    10:4 Dann stand Thekla auf und sagte zu Paulus: »Ich gehe nach Ikonion.« Paulus antwortete ihr: »Geh und lehre das Wort des Herrn.«


    10:5 Tryphäna aber hatte Paulus durch Thekla große Geldsummen und auch Kleidung zur Unterstützung der Armen senden lassen.


    10:6 So ging Thekla nach Ikonion. Als sie zum Haus des Onesiphorus kam, warf sie sich an der Stelle zu Boden, wo Paulus gesessen und verkündigt hatte. Unter Tränen betete sie und pries und verherrlichte Gott mit folgenden Worten:


    10:7 »Herr, Gott dieses Hauses, in dem du mich zuerst erleuchtet hast; Jesus, Sohn des lebendigen Gottes, der du mein Helfer vor dem Statthalter, mein Helfer im Feuer und mein Helfer unter den wilden Tieren warst: Du allein bist Gott für immer und ewig. Amen.«


    10:8 Bei ihrer Rückkehr fand Thekla Thamyris tot, ihre Mutter aber noch am Leben. Sie rief ihre Mutter zu sich und sagte: »Theokleia, meine Mutter, kannst du zum Glauben daran kommen, dass es nur einen Herrn und Gott gibt, der in den Himmeln wohnt? Wenn du großen Reichtum begehrst, wird Gott ihn dir durch mich geben. Wenn du deine Tochter zurückhaben willst: Hier bin ich.«


    10:9 Dies und vieles andere legte sie ihrer Mutter dar, um sie zu überzeugen. Doch ihre Mutter Theokleia schenkte den Worten der Märtyrerin Thekla keinen Glauben.


    10:10 Als Thekla erkannte, dass ihre Worte nichts bewirkten, bezeichnete sie ihren ganzen Körper mit dem Zeichen des Kreuzes,[b] verließ das Haus und ging nach Daphne. Dort angekommen, begab sie sich zu der Höhle, in der sie Paulus mit Onesiphorus gefunden hatte, warf sich zu Boden und weinte vor Gott.


    10:11 Von dort ging sie nach Seleukia und führte viele zur Erkenntnis Christi.


    10:12 Eine leuchtende Wolke führte sie auf ihrem Weg.


    10:13 Nachdem sie Seleukia erreicht hatte, ging sie an einen Ort außerhalb der Stadt, etwa ein Stadion entfernt.[c] Sie fürchtete sich nämlich vor den Einwohnern, weil sie Götzen verehrten.


    10:14 Die Wolke führte sie auf einen Berg namens Kalamon oder Rodeon.[d] Dort blieb sie viele Jahre und erlitt zahlreiche schwere Versuchungen durch den Teufel. Mit der Hilfe, die sie von Christus empfing, ertrug sie diese auf würdige Weise.


    10:15 Schließlich hörten einige vornehme Frauen von der Jungfrau Thekla und kamen zu ihr. Sie wurden von ihr in den Aussprüchen Gottes unterwiesen; viele von ihnen entsagten der Welt und führten mit ihr ein gemeinschaftliches, asketisches Leben.[e]


    10:16 So verbreitete sich überall ein guter Ruf über Thekla, und sie vollbrachte mehrere Heilungen. Daher brachten die Menschen aus der ganzen Stadt und den umliegenden Gegenden ihre Kranken zu jenem Berg. Noch bevor sie die Tür der Höhle erreichten, wurden sie sogleich von jeder Krankheit geheilt, an der sie litten.


    10:17 Die unreinen Geister wurden unter lautem Geschrei ausgetrieben. Alle erhielten ihre Kranken gesund zurück und verherrlichten Gott, der der Jungfrau Thekla solche Vollmacht verliehen hatte.


    10:18 Dadurch genossen die Ärzte von Seleukia kein Ansehen mehr und verloren den gesamten Ertrag ihres Gewerbes, weil niemand mehr auf sie achtete. Da wurden sie von Neid erfüllt und begannen zu überlegen, was sie gegen diese Dienerin Christi unternehmen könnten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung des zugrunde liegenden englischen Zeugen ist ungewöhnlich und kann auch wörtlicher wiedergegeben werden: »hat mir geholfen, mich zu taufen«. Eine Prüfung des griechischen Wortlauts steht noch aus.'
    reason: Die genaue Aussage über Theklas Taufe und den Handelnden ist anhand der bereitgestellten sekundären Grundlage nicht sicher zu bestimmen.
  - marker: b
    text: »des Kreuzes« steht im zugrunde liegenden englischen Zeugen in eckigen Klammern und ist daher als ergänzte oder unsichere Angabe zu verstehen.
    reason: Bewahrt das überlieferte Unsicherheitssignal, ohne störende eckige Klammern in den Lesetext zu übernehmen.
  - marker: c
    text: Ein Stadion war ein antikes Längenmaß von ungefähr 185 Metern; der genaue Wert konnte regional schwanken.
    reason: Erklärt das antike Maß, das der englische Zeuge mit »furlong« wiedergibt.
  - marker: d
    text: Die beiden überlieferten Namen werden nicht miteinander harmonisiert. Auch der Hinweis, dass die Wolke sie führte, steht im englischen Zeugen in eckigen Klammern.
    reason: Erhält sowohl die Namensalternative als auch die Unsicherheit hinsichtlich des ergänzten Subjekts.
  - marker: e
    text: Der englische Zeuge spricht von einem »monastischen Leben«. Die Wiedergabe beschreibt dies als gemeinschaftliche Askese, ohne eine vollständig entwickelte spätere Klosterordnung vorauszusetzen.
    reason: Kennzeichnet die mögliche historische und begriffliche Spannung der Vorlage.
lexical_decisions:
- source_word: assists ... to baptize (English witness; Greek review pending)
  choice: hat auch mir bei meiner Taufe beigestanden
  rationale: Bewahrt die ungewöhnliche, theologisch offene Aussage, vermeidet aber die im Englischen mögliche Fehlablesung, Thekla habe eine andere Person getauft.
- source_word: enlightened
  choice: erleuchtet / führte ... zur Erkenntnis Christi
  rationale: In 10:7 bleibt die frühchristliche religiöse Metapher erhalten; in 10:11 wird sie zur Verständlichkeit idiomatisch entfaltet, ohne notwendig eine bestimmte sakramentale Bedeutung festzulegen.
- source_word: furlong
  choice: Stadion
  rationale: Gibt das antike Wegmaß sachgerecht wieder; eine erklärende Fußnote nennt den ungefähren modernen Wert.
- source_word: oracles of God
  choice: Aussprüche Gottes
  rationale: Eine würdevolle und relativ formale Wiedergabe, die weder pauschal auf »Heilige Schrift« noch auf eine bestimmte Textsammlung verengt.
- source_word: monastic life
  choice: gemeinschaftliches, asketisches Leben
  rationale: Vermeidet den möglichen Anachronismus eines bereits institutionell ausgeprägten Klosterlebens und bewahrt zugleich den asketischen Sinn des Zeugnisses.
- source_word: power
  choice: Vollmacht
  rationale: Bezeichnet eine von Gott verliehene Befähigung und vermeidet die Vorstellung einer von Gott unabhängigen magischen Kraft.
theological_decisions:
- issue: Theklas Taufe und göttlicher Beistand
  choice: »der ... hat auch mir bei meiner Taufe beigestanden«
  alternative: »hat mir geholfen, mich zu taufen«
  rationale: Die Formulierung bewahrt den göttlichen Beistand und die ungewöhnliche Taufdarstellung, ohne die genaue Taufhandlung oder ihren menschlichen Vollzug dogmatisch festzulegen.
- issue: »Du allein bist Gott« in der Anrede an Jesus
  choice: Die direkte Aussage an Jesus bleibt unverändert erhalten.
  alternative: Auf den zuvor genannten »Herrn, den Gott dieses Hauses« beziehen
  rationale: Die syntaktische und christologische Spannung des überlieferten Gebets darf nicht durch eine erklärende Umformung beseitigt werden.
- issue: Zeichen des Kreuzes
  choice: Im Haupttext wiedergegeben und als Ergänzung des englischen Zeugen kenntlich gemacht
  alternative: Nur »mit dem Zeichen«
  rationale: Der gelieferte Zeuge signalisiert »of the cross« durch eckige Klammern als unsichere oder ergänzte Lesart; die Fußnote wahrt diese textliche Unsicherheit.
- issue: Heilungen durch Thekla
  choice: »sie vollbrachte ... Heilungen«, während die Vollmacht ausdrücklich von Gott verliehen ist
  alternative: »Gott heilte durch sie«
  rationale: Bewahrt sowohl die unmittelbare Erzählweise von 10:16 als auch die theologische Zuschreibung an Gott in 10:17.
- issue: Spätere asketische Lebensform
  choice: »gemeinschaftliches, asketisches Leben«
  alternative: »Klosterleben«
  rationale: Vermeidet, dem Text ungeprüft eine spätere institutionelle Form des Mönchtums aufzuerlegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Eigennamen wurden in geläufigen deutschen Formen wiedergegeben (Thekla, Tryphäna, Theokleia, Ikonion, Seleukia). Aufgrund der ausdrücklich noch ausstehenden Prüfung des griechischen Ausgangstextes ist dies ein vorsichtiger, quellennaher Entwurf auf Grundlage des bereitgestellten gemeinfreien englischen Zeugen; echte Unklarheiten und Ergänzungssignale werden in Fußnoten offengelegt.
