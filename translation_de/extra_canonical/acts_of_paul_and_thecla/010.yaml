review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem englischen Zeugen überwiegend eng und bewahrt die Erzählabfolge, Eigennamen sowie die christologische Spannung in 10:7. In 10:2 wird jedoch die auffällig mehrdeutige Formulierung „has assisted me to baptize“ zu stark als bloßer Beistand bei Theklas Taufe ausgelegt. Zudem wurden mehrere im Zeugen ausdrücklich durch eckige Klammern markierte Ergänzungen im Lesetext geglättet oder ganz ausgelassen (10:9, 10:10, 10:14, 10:16). Diese Unsicherheitssignale müssen im Text selbst erhalten bleiben.
  naturalness: 'Das Deutsch ist insgesamt modernes, würdiges Standarddeutsch. Einige Formulierungen werden geringfügig geglättet: „auf den Boden, auf dem Paulus gesessen ... hatte“ gibt 10:6 genauer wieder; „ihre Kranken geheilt zurück“ ist in 10:17 idiomatischer. „Monastisches Leben“ ist hier als Übersetzung des ausdrücklich vorliegenden Zeugen vertretbar und präziser als die interpretierende Umschreibung „gemeinschaftliches, asketisches Leben“.'
  terminology: „Wort des Herrn“, „Märtyrerin“, „unreine Geister“ und „Vollmacht“ sind registergerecht. „Gottes Aussprüche“ wahrt die Offenheit von „oracles of God“. Das Wegmaß wird nicht ohne griechische Prüfung zu „Stadion“ festgelegt, sondern als „Furlong“ mit Erklärung beibehalten. Die im Zeugen als Ergänzungen gekennzeichneten Elemente bleiben in eckigen Klammern.
  issues:
  - severity: high
    issue: '10:2: Mehrdeutigkeit der Taufformulierung eingeengt'
    rationale: „hat auch mir bei meiner Taufe beigestanden“ legt fest, dass Thekla lediglich bei ihrer eigenen Taufe Unterstützung erhielt. Der Zeuge lautet ungewöhnlich „has assisted me to baptize“ und muss, bis zur griechischen Prüfung, näher an dieser potenziell reflexiven bzw. ungewöhnlichen Aussage bleiben.
  - severity: medium
    issue: '10:9: Eckige Klammern ausgelassen'
    rationale: Die Ergänzungen „[endeavouring]“ und „[to her opinion]“ sind im englischen Zeugen textkritisch markiert. Die glatte Formulierung „um sie zu überzeugen“ lässt beide Markierungen und die spezifische Aussage verschwinden.
  - severity: medium
    issue: '10:10, 10:14 und 10:16: Textkritische Klammern in Fußnoten verlagert oder getilgt'
    rationale: Die Zusätze „[of the cross]“, „[by the cloud]“ und „[miraculous]“ sind Bestandteile der sichtbaren Unsicherheitsmarkierung des Zeugen. Eine Fußnote ersetzt die Klammern im Lesetext nicht.
  - severity: low
    issue: '10:13: „furlong“ ohne gesicherte griechische Grundlage als „Stadion“ bestimmt'
    rationale: Das Stadion kann als möglicher antiker Hintergrund plausibel sein, ist aber auf Grundlage des bereitgestellten englischen Zeugen nicht sicher genug, um das dortige Maß im Text zu ersetzen.
  - severity: low
    issue: '10:15: „gemeinschaftliches, asketisches Leben“ interpretiert „monastic life“ um'
    rationale: Die Umschreibung ist historisch vorsichtig, aber sie ersetzt die im Zeugen vorliegende Bezeichnung. „monastisches Leben“ kann als literarische Aussage übersetzt werden, ohne eine Datierung institutioneller Klosterformen zu behaupten.
