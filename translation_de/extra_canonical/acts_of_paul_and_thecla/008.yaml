base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/008.yaml
  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: de
  text: '8:1 Als die Leute das sahen, sagten sie: „Die Urteile, die in dieser Stadt gefällt werden, sind ungerecht.“ Thekla aber bat den Statthalter darum, dass ihre Keuschheit nicht angetastet, sondern bewahrt werde, bis man sie den wilden Tieren vorwerfe.


    8:2 Darauf fragte der Statthalter, wer sie bei sich aufnehmen wolle. Da bat eine sehr reiche Witwe namens Tryphäna, deren Tochter erst vor Kurzem gestorben war, Thekla in ihre Obhut nehmen zu dürfen. In ihrem Haus begann sie, Thekla wie ihre eigene Tochter zu behandeln.


    8:3 Schließlich kam der Tag, an dem die wilden Tiere öffentlich vorgeführt werden sollten. Thekla wurde ins Amphitheater gebracht und vor den Augen einer großen Zuschauermenge in einen Zwinger mit einer überaus wilden Löwin gesetzt.


    8:4 Tryphäna begleitete Thekla, ohne Furcht zu zeigen, und die Löwin leckte Thekla die Füße. Auf der Tafel, die ihre Anklage bekannt gab, stand: „Tempelraub“.[a] Da rief die Frau: „O Gott, die Urteile dieser Stadt sind ungerecht!“


    8:5 Nachdem man die wilden Tiere vorgeführt hatte, nahm Tryphäna Thekla mit nach Hause, und sie legten sich schlafen. Und siehe, Tryphänas verstorbene Tochter erschien ihrer Mutter und sagte: „Mutter, betrachte die junge Thekla an meiner Stelle als deine Tochter. Bitte sie, für mich zu beten, damit ich an einen Ort des Glücks versetzt werde.“[b]


    8:6 Darauf sagte Tryphäna voller Trauer: „Meine Tochter Falconilla ist mir erschienen und hat mich angewiesen, dich an ihrer Stelle aufzunehmen. Deshalb bitte ich dich, Thekla: Bete für meine Tochter, damit sie an einen Ort des Glücks und zum ewigen Leben versetzt werde.“


    8:7 Als Thekla das hörte, betete sie sogleich zum Herrn: „O Herr, Gott des Himmels und der Erde, Jesus Christus, Sohn des Höchsten, gewähre, dass ihre Tochter Falconilla ewig lebt.“ Als Tryphäna dies hörte, seufzte sie erneut und sagte: „O ungerechte Urteile! O unbegreifliche Bosheit, dass ein solcher Mensch den wilden Tieren vorgeworfen werden soll!“[c]


    8:8 Am nächsten Morgen, bei Tagesanbruch, kam Alexander zu Tryphänas Haus und sagte: „Der Statthalter und das Volk warten. Führt die Verurteilte heraus!“[d]


    8:9 Tryphäna aber stürmte so heftig auf ihn los, dass er erschrak und davonlief. Tryphäna gehörte zur kaiserlichen Familie. Sie gab ihrer Trauer Ausdruck und sagte: „Weh mir! Zweifaches Leid erfüllt mein Haus, und niemand steht mir bei: weder beim Verlust meiner Tochter noch dabei, Thekla zu retten. Doch nun, o Herr und Gott, sei du der Helfer deiner Dienerin Thekla!“


    8:10 Während sie noch so sprach, sandte der Statthalter einen seiner Beamten, um Thekla zu holen. Tryphäna nahm sie bei der Hand, ging mit ihr und sagte: „Ich begleitete Falconilla zu ihrem Grab, und nun muss ich Thekla zu den wilden Tieren begleiten.“


    8:11 Als Thekla das hörte, betete sie unter Tränen: „O Herr und Gott, auf den ich vertraut habe und bei dem ich Zuflucht fand, vergilt Tryphäna ihr Mitgefühl mit mir und dass sie meine Keuschheit bewahrt hat.“


    8:12 Da erhob sich im Amphitheater großer Lärm. Die wilden Tiere brüllten, und das Volk rief: „Führt die Verurteilte herein!“


    8:13 Die Frau aber schrie: „Die ganze Stadt soll für solche Verbrechen büßen! Statthalter, verurteile uns alle zu derselben Strafe! O ungerechtes Urteil! O grausamer Anblick!“


    8:14 Andere riefen: „Die ganze Stadt soll wegen dieser schändlichen Tat zugrunde gehen! Töte uns alle, Statthalter! O grausamer Anblick! O ungerechtes Urteil!“


    [a] Oder: „Gotteslästerung“, „Entweihung eines Heiligtums“ beziehungsweise allgemein „Frevel am Heiligen“. Die genaue Bedeutung der zugrunde liegenden Anklagebezeichnung bedarf der Prüfung am griechischen und versionalen Text.


    [b] Wörtlicher nach dem vorliegenden englischen Zeugen: „in einen Zustand des Glücks versetzt werde“. Die Formulierung lässt offen, wie dieser erhoffte Zustand genauer zu verstehen ist.


    [c] Der ältere englische Zeuge fügt hier in Klammern „wieder“ ein; da die vorausgehende Erzählung an dieser Stelle keine eindeutige zweite Auslieferung an die Tiere erkennen lässt, wurde es nicht in den Haupttext aufgenommen.


    [d] Oder: „die Angeklagte“. Das verwendete Wort des vorliegenden englischen Zeugen bezeichnet sie als „criminal“, doch der genaue Rechtsstatus sollte anhand der älteren Textzeugen geprüft werden.'
