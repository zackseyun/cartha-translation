lexical_decisions:
- source_word: chastity
  choice: Keuschheit
  rationale: Bewahrt den antiken Schwerpunkt auf sexueller Unversehrtheit und entspricht dem wiederholten Motiv des Kapitels, ohne es auf bloße Jungfräulichkeit zu verengen.
- source_word: governor
  choice: Statthalter
  rationale: Natürliche historische Amtsbezeichnung im Deutschen; vermeidet die moderne politische Bedeutung von „Gouverneur“.
- source_word: she-lion
  choice: Löwin
  rationale: Gibt das ausdrücklich weibliche Tier präzise und idiomatisch wieder.
- source_word: Sacrilege
  choice: Tempelraub
  rationale: Als konkrete antike Anklageformel möglich und auf einer Tafel knapp verständlich; die semantische Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: state of happiness
  choice: Ort des Glücks
  rationale: Natürlicher als „Zustand der Glückseligkeit“, ohne die unklare jenseitige Vorstellung konfessionell festzulegen; Fußnote [b] nennt die wörtlichere Fassung.
- source_word: royal family
  choice: kaiserliche Familie
  rationale: Im römisch-imperialen Erzählrahmen verständlicher als „königliche Familie“, wenngleich eine direkte Prüfung des griechischen Ausdrucks noch aussteht.
- source_word: criminal
  choice: Verurteilte
  rationale: Passt zur bereits gefällten Entscheidung und klingt im Ruf der Menge natürlich; Fußnote [d] bewahrt die mögliche Alternative „Angeklagte“.
theological_decisions:
- issue: Gebet für die verstorbene Falconilla
  choice: Die Bitte und Theklas Gebet werden ohne erklärende dogmatische Zusätze wiedergegeben.
  alternative: Die Passage als ausdrückliche Lehre über den Zustand Verstorbener oder eine bestimmte Praxis des Totengebets auszudeuten.
  rationale: Der Text berichtet die Handlung, definiert aber weder den jenseitigen Zustand noch einen allgemeinen Lehrsatz; die Spannung bleibt daher bestehen.
- issue: Anrede Jesu Christi in Theklas Gebet
  choice: „O Herr, Gott des Himmels und der Erde, Jesus Christus, Sohn des Höchsten“ bleibt syntaktisch eng und mehrdeutig.
  alternative: Durch zusätzliche Zeichensetzung oder Ergänzungen mehrere Adressaten eindeutig zu unterscheiden beziehungsweise alle Titel ausdrücklich auf Jesus zu beziehen.
  rationale: Die überlieferte englische Interpunktion erlaubt unterschiedliche syntaktische Beziehungen; eine dogmatische Eindeutigkeit soll nicht künstlich hergestellt werden.
- issue: Ewiges Leben Falconillas
  choice: „gewähre, dass … Falconilla ewig lebt“
  alternative: „rette ihre Seele“ oder eine spezifische Lehre über postmortale Erlösung.
  rationale: Die Formulierung folgt der Bitte des Textes und importiert keine später ausformulierte Soteriologie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerischer Klarheit und maßvoll biblischem Klang, etwa in „Und siehe“ und den Gebetsanreden. Direkte Rede ist lebendig, aber nicht umgangssprachlich. Da kein griechischer Wortlaut mitgeliefert wurde und die Quellenprüfung ausdrücklich noch aussteht, ist dies ein quellenkritisch vorsichtiger Entwurf auf Grundlage des gemeinfreien englischen Zeugen unter Konsultation der englischen POB-Fassung.
