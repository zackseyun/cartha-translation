  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: de
  text: '**Kapitel IV**


    **4:1** Darauf trat Thamyris vor den Richterstuhl des Statthalters und sprach mit lauter Stimme:


    **4:2** »Statthalter, ich weiß nicht, woher dieser Mann kommt. Doch er lehrt, die Ehe sei unerlaubt. Befiehl ihm deshalb, vor dir zu erklären, aus welchem Grund er solche Lehren verbreitet.«


    **4:3** Während er dies sagte, flüsterten Demas und Hermogenes Thamyris zu[a]: »Sag, dass er ein Christ ist; dann wird er sogleich hingerichtet werden.«


    **4:4** Der Statthalter aber ging bedächtiger vor. Er ließ Paulus rufen und fragte ihn: »Wer bist du? Was lehrst du? Diese Männer scheinen dich schwerer Vergehen zu beschuldigen.«


    **4:5** Da sprach Paulus mit lauter Stimme: »Weil ich nun aufgefordert bin, über meine Lehre Rechenschaft abzulegen, Statthalter, bitte ich dich, mich anzuhören.


    **4:6** Gott, der ein Gott der Vergeltung ist[b] und nichts benötigt außer der Rettung seiner Geschöpfe[c], hat mich gesandt, um sie von ihrer Bosheit und Verderbtheit, von allen sündigen Begierden und vom Tod abzubringen und sie dazu zu bewegen, nicht mehr zu sündigen.


    **4:7** Aus diesem Grund sandte Gott seinen Sohn Jesus Christus. Ihn verkündige ich, und ich lehre die Menschen, ihre Hoffnung auf ihn zu setzen. Er allein hatte solches Erbarmen mit der irregeleiteten Welt, damit sie nicht verurteilt würde, Statthalter, sondern Glauben, Gottesfurcht, Erkenntnis der Gottesverehrung[d] und Liebe zur Wahrheit hätte.


    **4:8** Wenn ich also nur das lehre, was ich durch Offenbarung von Gott empfangen habe – worin besteht dann mein Verbrechen?«


    **4:9** Als der Statthalter dies hörte, befahl er, Paulus zu fesseln und ins Gefängnis zu bringen, bis er mehr Zeit hätte, ihn ausführlicher anzuhören.


    **4:10** In der Nacht aber nahm Thekla ihre Ohrringe ab und gab sie dem Gefängniswärter. Der öffnete ihr die Türen und ließ sie hinein.


    **4:11** Nachdem sie dem Kerkermeister einen silbernen Spiegel geschenkt hatte, durfte sie in den Raum gehen, in dem Paulus war. Sie setzte sich zu seinen Füßen und hörte von ihm die großen Taten Gottes[e].


    **4:12** Als sie sah, dass Paulus keine Angst vor dem Leiden hatte, sondern sich mit Gottes Hilfe mutig verhielt, wuchs ihr Glaube so sehr, dass sie seine Fesseln küsste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte englische Zeuge kennzeichnet die Worte über das Zuflüstern durch Klammern. Die genaue griechische Textgestalt ist noch zu prüfen.
    reason: Die auffällige Klammerung und mögliche textliche Unsicherheit sollen transparent bleiben.
  - marker: b
    text: 'Auch möglich: »ein Gott der Rache«. »Vergeltung« betont hier den richtenden Sinn.'
    reason: Die theologisch gewichtige Wortwahl darf nicht stillschweigend verengt werden.
  - marker: c
    text: 'Wörtlich nach dem englischen Zeugen: Gott »bedarf nichts außer der Rettung seiner Geschöpfe«. Die paradoxe Formulierung wurde bewusst beibehalten.'
    reason: Sie bewahrt die Spannung zwischen Gottes Bedürfnislosigkeit und seinem rettenden Anliegen.
  - marker: d
    text: 'Auch möglich: »Erkenntnis der Religion« oder »Erkenntnis der Frömmigkeit«.'
    reason: Die genaue Bedeutung des zugrunde liegenden griechischen Ausdrucks kann erst nach direkter Quellenprüfung festgelegt werden.
  - marker: e
    text: 'Auch möglich: »die großen Dinge Gottes« oder »die Größe Gottes«.'
    reason: Der englische Ausdruck lässt ohne direkte Prüfung des griechischen Wortlauts mehrere Deutungen zu.
lexical_decisions:
- source_word: governor / judgment-seat (English witness; Greek review pending)
  choice: Statthalter / Richterstuhl
  rationale: Die Ausdrücke geben den politischen Amtsträger und den gerichtlichen Schauplatz würdig und im Deutschen verständlich wieder, ohne eine genauer nicht belegte römische Amtsbezeichnung einzuführen.
- source_word: matrimony is unlawful
  choice: die Ehe sei unerlaubt
  rationale: Die indirekte Rede bewahrt den Charakter der Anklage. »Unerlaubt« gibt den rechtlich-moralischen Vorwurf wieder, ohne ihn zu »verboten« oder »sündig« zu verschärfen.
- source_word: God of vengeance
  choice: Gott der Vergeltung
  rationale: »Vergeltung« bewahrt den gerichtlichen Sinn und klingt weniger nach persönlicher Rachsucht als »Rache«, ohne die theologische Härte der Aussage zu beseitigen.
- source_word: sinful pleasures
  choice: sündige Begierden
  rationale: Die Klammerergänzung des englischen Zeugen wird glatt in den Text aufgenommen. »Begierden« bezeichnet hier verderbliche Lust, ohne körperliche Freude allgemein abzuwerten.
- source_word: knowledge of religion
  choice: Erkenntnis der Gottesverehrung
  rationale: »Religion« wäre möglich, klingt im modernen Deutschen jedoch abstrakt-institutionell. »Gottesverehrung« lässt sowohl religiöse Erkenntnis als auch gelebte Frömmigkeit anklingen.
- source_word: great things of God
  choice: die großen Taten Gottes
  rationale: Die idiomatische deutsche Wendung versteht »great things« als Gottes mächtiges Handeln. Wegen möglicher weiterer Bedeutungen wird die Alternative in einer Fußnote kenntlich gemacht.
- source_word: chains
  choice: Fesseln
  rationale: »Fesseln« passt zum erzählten Gefängniskontext und ist natürlicher als das engere »Ketten«, ohne das Material festzulegen.
theological_decisions:
- issue: Ehefeindlichkeit als Anklage gegen Paulus
  choice: 'Als Aussage des Thamyris formuliert: »er lehrt, die Ehe sei unerlaubt«'
  alternative: Paulus lehre tatsächlich ein allgemeines Eheverbot
  rationale: Der Text stellt dies zunächst als Anklage dar. Die Übersetzung macht daraus keine bestätigte Lehre des Paulus und löst die Spannung zur vorausgehenden asketischen Verkündigung nicht auf.
- issue: Gottes Vergeltung und Bedürfnislosigkeit
  choice: 'Die paradoxe Formulierung bleibt bestehen: Gott benötigt nichts außer der Rettung seiner Geschöpfe.'
  alternative: Gott verlangt nur die Rettung seiner Geschöpfe / Gott will allein ihre Rettung
  rationale: Eine Glättung zu »will« wäre theologisch leichter, würde aber die auffällige Spannung des überlieferten englischen Wortlauts beseitigen.
- issue: Heil der Welt durch Jesus Christus
  choice: Der Satz bewahrt die Folge Erbarmen – Nichtverurteilung – Glaube, Gottesfurcht, Erkenntnis und Wahrheitsliebe.
  alternative: Eine systematisch präzisierte Aussage über Rechtfertigung oder universale Erlösung
  rationale: Der Text wird nicht an eine spätere konfessionelle Heilslehre angepasst.
- issue: Offenbarung als Ursprung der Lehre
  choice: »was ich durch Offenbarung von Gott empfangen habe«
  alternative: »was Gott mir offenbart hat«
  rationale: Die gewählte Form hält Art und Vorgang der Offenbarung offen und folgt dem Zeugnis eng.
- issue: Wachsender Glaube Theklas und Kuss der Fesseln
  choice: Die Handlung wird als Folge ihres wachsenden Glaubens erzählt, ohne sie kultisch zu deuten.
  alternative: Verehrung von Reliquien oder bloßer Ausdruck persönlicher Zuneigung
  rationale: Beide weitergehenden Deutungen würden den knappen Erzähltext konfessionell oder psychologisch festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählprosa und leicht gehobener Gerichtsrede. Archaismen wie »allhier«, »Weib« oder konsequente Konjunktivformen wurden vermieden. Der Entwurf ist ausdrücklich vorläufig, da der bereitgestellte Ausgangstext ein gemeinfreier englischer Übersetzungszeuge ist und die direkte Prüfung der griechischen und versionalen Überlieferung noch aussteht.
