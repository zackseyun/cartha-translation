    **1:5** Titus hatte ihnen nämlich das Aussehen des Paulus beschrieben. Persönlich kannten sie ihn noch nicht; sie wussten nur, was für ein Mensch er war.


    **1:6** Sie gingen auf der Königsstraße in Richtung Lystra und warteten dort auf ihn. Jeden Vorübergehenden verglichen sie mit der Beschreibung, die Titus ihnen gegeben hatte.


    **1:7** Schließlich sahen sie einen Mann kommen: Paulus. Er war klein, am Kopf kahl oder rasiert, hatte krumme Oberschenkel, wohlgeformte Beine, tiefliegende Augen und eine gebogene Nase. Er war voller Gnade; denn bisweilen erschien er wie ein Mensch, bisweilen hatte er das Antlitz eines Engels.[b] Als Paulus Onesiphorus sah, freute er sich.


    **1:8** Onesiphorus sagte: »Sei gegrüßt, Diener des gepriesenen Gottes!« Paulus erwiderte: »Die Gnade Gottes sei mit dir und deiner Familie!«


    **1:9** Demas und Hermogenes aber wurden neidisch. Unter dem Anschein großer Frömmigkeit sagte Demas: »Sind nicht auch wir Diener des gepriesenen Gottes? Warum hast du uns nicht gegrüßt?«


    **1:10** Onesiphorus antwortete: »Weil ich an euch keine Früchte der Gerechtigkeit wahrgenommen habe. Wenn ihr aber solche Menschen seid, sollt auch ihr in meinem Haus willkommen sein.«


    **1:11** Darauf ging Paulus in das Haus des Onesiphorus, und darüber herrschte in der ganzen Hausgemeinschaft große Freude. Sie widmeten sich dem Gebet und dem Brechen des Brotes und hörten Paulus zu, wie er das Wort Gottes über Enthaltsamkeit und Auferstehung verkündete:[c]


    **1:12** »Glückselig sind, die ein reines Herz haben; denn sie werden Gott sehen.


    **1:13** Glückselig sind, die ihren Leib unbefleckt (oder rein) bewahren; denn sie werden Gottes Tempel sein.[d]


    **1:14** Glückselig sind die Enthaltsamen (oder Keuschen); denn Gott wird sich ihnen offenbaren.[e]


    **1:15** Glückselig sind, die auf weltliche Genüsse verzichten; denn Gott wird sie annehmen.


    **1:16** Glückselig sind, die Frauen haben, als hätten sie keine; denn sie werden zu Engeln Gottes gemacht werden.[f]


    **1:17** Glückselig sind, die vor dem Wort Gottes erbeben; denn sie werden getröstet werden.


    **1:18** Glückselig sind, die ihre Taufe rein bewahren; denn sie werden Frieden finden bei dem Vater, dem Sohn und dem Heiligen Geist.[g]


    **1:19** Glückselig sind, die nach der Weisheit (oder Lehre) Jesu Christi streben; denn sie werden Söhne des Höchsten genannt werden.[h]


    **1:20** Glückselig sind, die die Weisungen Jesu Christi befolgen; denn sie werden im ewigen Licht wohnen.


    **1:21** Glückselig sind, die aus Liebe zu Christus auf den Glanz der Welt verzichten; denn sie werden Engel richten, zur Rechten Christi gestellt werden und die Bitterkeit des letzten Gerichts nicht erleiden.


    **1:22** Glückselig sind die Leiber und Seelen der Jungfrauen; denn sie sind Gott wohlgefällig und werden den Lohn ihrer Jungfräulichkeit nicht verlieren. Denn das Wort ihres himmlischen Vaters wird sich am Tag seines Sohnes als wirksam für ihre Rettung erweisen; und sie werden in Ewigkeit Ruhe genießen.«[i]'
  revised_footnotes:
  - marker: a
    text: Die genaue Gestalt dieses Satzes bedarf der Prüfung an der griechischen und versionalen Überlieferung. Das zugrunde gelegte englische Zeugnis nennt die Aussprüche und Lehren Christi sowie die Absicht beziehungsweise das Ziel des Evangeliums von Gottes geliebtem Sohn.
    reason: Die direkte Prüfung des ursprünglichen Wortlauts steht aus, und die englische Syntax ist mehrdeutig.
  - marker: b
    text: Die Beschreibung ist nach dem überlieferten englischen Zeugen wiedergegeben. Einzelheiten wie »kahl oder rasiert«, die Form der Beine und der Wechsel zwischen menschlichem und engelhaftem Aussehen sollten am griechischen und versionalen Text geprüft werden.
    reason: Der englische Zeuge bietet selbst eine Alternative und möglicherweise traditionsabhängige Körperbeschreibungen.
  - marker: c
    text: »Brechen des Brotes« kann eine gemeinsame Mahlzeit und/oder eine gottesdienstliche Feier bezeichnen. Der Text legt die genaue Bedeutung hier nicht eindeutig fest.
    reason: Bewahrt die liturgische und alltägliche Deutungsmöglichkeit.
  - marker: d
    text: Der englische Zeuge bietet »unbefleckt« oder »rein«. Beide Begriffe bezeichnen hier körperliche Reinheit, ohne deren genauen Umfang ausdrücklich zu bestimmen.
    reason: Die im Zeugen überlieferte lexikalische Alternative wird transparent gemacht.
  - marker: e
    text: Der Ausdruck kann allgemein Selbstbeherrschung oder speziell sexuelle Enthaltsamkeit beziehungsweise Keuschheit bezeichnen.
    reason: Bewahrt die semantische Spannweite des asketischen Schlüsselbegriffs.
  - marker: f
    text: Die Aussage erinnert sprachlich an 1 Kor 7,29, geht mit der Verheißung, zu Engeln gemacht zu werden, jedoch darüber hinaus. Diese ungewöhnliche Vorstellung wird nicht zu »engelgleich« abgeschwächt.
    reason: Verhindert eine harmonisierende theologische Glättung.
  - marker: g
    text: Was es bedeutet, die Taufe »rein zu bewahren«, wird nicht näher erklärt; möglich ist eine Aussage über ein der Taufe entsprechendes reines Leben.
    reason: Kennzeichnet die genuine theologische Unbestimmtheit.
  - marker: h
    text: Der englische Zeuge bietet »Weisheit« oder »Lehre«. Die genaue Lesart muss anhand der alten Sprachzeugen geprüft werden.
    reason: Erhält die ausdrücklich bezeugte Alternative.
  - marker: i
    text: Die Ergänzung »himmlischen« steht im englischen Zeugen in Klammern. Auch die Bezüge der Pronomen und die genaue Aussage über Rettung am »Tag seines Sohnes« bedürfen einer Prüfung an der alten Überlieferung.
    reason: Markiert eine editorische Ergänzung und syntaktisch-theologische Unsicherheit.
