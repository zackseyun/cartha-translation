  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: de
  text: '**Kapitel 1**


    **1:1** Als Paulus nach seiner Flucht aus Antiochia nach Ikonion hinaufzog, schlossen sich ihm Demas und Hermogenes als Begleiter an; damals waren sie jedoch voller Heuchelei.


    **1:2** Paulus aber blickte allein auf die Güte Gottes, tat ihnen nichts Böses und hatte sie sehr lieb.


    **1:3** Daher bemühte er sich, ihnen alle Aussprüche und Lehren Christi sowie die Botschaft vom Evangelium des geliebten Sohnes Gottes nahezubringen. Dabei unterwies er sie in der Erkenntnis Christi, wie sie ihm offenbart worden war.[a]


    **1:4** Ein Mann namens Onesiphorus hörte, dass Paulus nach Ikonion gekommen war. Da eilte er ihm zusammen mit seiner Frau Lektra und seinen Söhnen Simmias und Zenon entgegen, um ihn in sein Haus einzuladen.


    **1:5** Titus hatte ihnen nämlich das Aussehen des Paulus beschrieben. Persönlich kannten sie ihn noch nicht; sie wussten nur, was für ein Mensch er war.


    **1:6** Sie gingen auf der Königsstraße in Richtung Lystra und warteten dort auf ihn. Jeden Vorübergehenden verglichen sie mit der Beschreibung, die Titus ihnen gegeben hatte.


    **1:7** Schließlich sahen sie einen Mann kommen: Paulus. Er war klein, am Kopf kahl oder rasiert, hatte krumme Oberschenkel, wohlgeformte Beine, tiefliegende Augen und eine gebogene Nase. Er war voller Gnade; denn bisweilen erschien er wie ein Mensch, bisweilen hatte er das Antlitz eines Engels.[b] Als Paulus Onesiphorus sah, freute er sich.


    **1:8** Onesiphorus sagte: »Sei gegrüßt, Diener des gepriesenen Gottes!« Paulus erwiderte: »Die Gnade Gottes sei mit dir und deiner Familie!«


    **1:9** Demas und Hermogenes aber wurden neidisch. Unter dem Anschein großer Frömmigkeit sagte Demas: »Sind nicht auch wir Diener des gepriesenen Gottes? Warum hast du uns nicht gegrüßt?«


    **1:10** Onesiphorus antwortete: »Weil ich an euch keine Früchte der Gerechtigkeit wahrgenommen habe. Wenn ihr aber solche Menschen seid, sollt auch ihr in meinem Haus willkommen sein.«


    **1:11** Darauf ging Paulus in das Haus des Onesiphorus, und darüber herrschte in der ganzen Hausgemeinschaft große Freude. Sie widmeten sich dem Gebet und dem Brechen des Brotes und hörten Paulus zu, wie er das Wort Gottes über Enthaltsamkeit und Auferstehung verkündete:[c]


    **1:12** »Glückselig sind, die ein reines Herz haben; denn sie werden Gott sehen.


    **1:13** Glückselig sind, die ihren Leib unbefleckt, also rein, bewahren; denn sie werden Gottes Tempel sein.[d]


    **1:14** Glückselig sind die Enthaltsamen, das heißt die Keuschen; denn Gott wird sich ihnen offenbaren.[e]


    **1:15** Glückselig sind, die auf weltliche Genüsse verzichten; denn Gott wird sie annehmen.


    **1:16** Glückselig sind, die Frauen haben, als hätten sie keine; denn sie werden zu Engeln Gottes gemacht werden.[f]


    **1:17** Glückselig sind, die vor dem Wort Gottes erbeben; denn sie werden getröstet werden.


    **1:18** Glückselig sind, die ihre Taufe rein bewahren; denn sie werden Frieden finden beim Vater, beim Sohn und beim Heiligen Geist.[g]


    **1:19** Glückselig sind, die nach der Weisheit, das heißt der Lehre, Jesu Christi streben; denn sie werden Söhne des Höchsten genannt werden.[h]


    **1:20** Glückselig sind, die die Weisungen Jesu Christi befolgen; denn sie werden im ewigen Licht wohnen.


    **1:21** Glückselig sind, die aus Liebe zu Christus auf den Glanz der Welt verzichten; denn sie werden Engel richten, zur Rechten Christi gestellt werden und die Bitterkeit des letzten Gerichts nicht erleiden.


    **1:22** Glückselig sind Leib und Seele der Jungfrauen; denn sie sind Gott wohlgefällig und werden den Lohn ihrer Jungfräulichkeit nicht verlieren. Das Wort ihres himmlischen Vaters wird an ihnen am Tag seines Sohnes wirksam werden und ihnen Rettung bringen; und sie werden in Ewigkeit Ruhe genießen.«[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Gestalt dieses Satzes bedarf der Prüfung an der griechischen und versionalen Überlieferung. Das zugrunde gelegte englische Zeugnis kann sowohl den Inhalt als auch die Absicht des Evangeliums meinen.
    reason: Die direkte Prüfung des ursprünglichen Wortlauts steht aus, und die englische Syntax ist mehrdeutig.
  - marker: b
    text: Die Beschreibung ist nach dem überlieferten englischen Zeugen wiedergegeben. Einzelheiten wie »kahl oder rasiert«, die Form der Beine und der Wechsel zwischen menschlichem und engelhaftem Aussehen sollten am griechischen und versionalen Text geprüft werden.
    reason: Der englische Zeuge bietet selbst eine Alternative und möglicherweise traditionsabhängige Körperbeschreibungen.
  - marker: c
    text: »Brechen des Brotes« kann eine gemeinsame Mahlzeit und/oder eine gottesdienstliche Feier bezeichnen. Der Text legt die genaue Bedeutung hier nicht eindeutig fest.
    reason: Bewahrt die liturgische und alltägliche Deutungsmöglichkeit.
  - marker: d
    text: Der englische Zeuge bietet »unbefleckt« oder »rein«. Beide Begriffe bezeichnen hier körperliche Reinheit, ohne deren genauen Umfang ausdrücklich zu bestimmen.
    reason: Die im Zeugen überlieferte lexikalische Alternative wird transparent gemacht.
  - marker: e
    text: Der Ausdruck kann allgemein Selbstbeherrschung oder speziell sexuelle Enthaltsamkeit beziehungsweise Keuschheit bezeichnen.
    reason: Bewahrt die semantische Spannweite des asketischen Schlüsselbegriffs.
  - marker: f
    text: Die Aussage erinnert sprachlich an 1 Kor 7,29, geht mit der Verheißung, zu Engeln gemacht zu werden, jedoch darüber hinaus. Diese ungewöhnliche Vorstellung wird nicht zu »engelgleich« abgeschwächt.
    reason: Verhindert eine harmonisierende theologische Glättung.
  - marker: g
    text: Was es bedeutet, die Taufe »rein zu bewahren«, wird nicht näher erklärt; möglich ist eine Aussage über ein der Taufe entsprechendes reines Leben.
    reason: Kennzeichnet die genuine theologische Unbestimmtheit.
  - marker: h
    text: Der englische Zeuge bietet »Weisheit« oder »Lehre«. Die genaue Lesart muss anhand der alten Sprachzeugen geprüft werden.
    reason: Erhält die ausdrücklich bezeugte Alternative.
  - marker: i
    text: Die Ergänzung »himmlischen« steht im englischen Zeugen in Klammern. Auch die Bezüge der Pronomen und die genaue Aussage über Rettung am »Tag seines Sohnes« bedürfen einer Prüfung an der alten Überlieferung.
    reason: Markiert eine editorische Ergänzung und syntaktisch-theologische Unsicherheit.
lexical_decisions:
- source_word: hypocrisy
  choice: Heuchelei
  rationale: Bewahrt die moralische Wertung des Zeugnisses in geläufigem, würdigem Deutsch.
- source_word: oracles
  choice: Aussprüche
  rationale: Gibt den religiösen Charakter wieder, ohne den Ausdruck unnötig auf Prophezeiungen einzuengen.
- source_word: temperance
  choice: Enthaltsamkeit
  rationale: Passt zum asketischen Kontext des Werkes und lässt den weiter gefassten Gedanken disziplinierter Selbstbegrenzung bestehen.
- source_word: flesh
  choice: Leib
  rationale: Natürliches modernes Deutsch; vermeidet hier die missverständliche moralische Nebenbedeutung von »Fleisch«.
- source_word: pure in heart
  choice: die ein reines Herz haben
  rationale: Bewahrt die erkennbare Nähe zur Seligpreisung und klingt zugleich natürlich.
- source_word: king’s highway
  choice: Königsstraße
  rationale: Formnahe Wiedergabe einer öffentlichen Hauptstraße unter königlicher Verwaltung.
- source_word: breaking of bread
  choice: Brechen des Brotes
  rationale: Bewahrt die frühchristliche feste Wendung, ohne vorschnell eine bestimmte sakramentale Deutung festzulegen.
- source_word: virgins
  choice: Jungfrauen
  rationale: Entspricht dem ausdrücklich geschlechtlich markierten Wortlaut des überlieferten englischen Zeugnisses und dem asketischen Kontext.
theological_decisions:
- issue: Der asketische Sinn von »temperance/chaste«
  choice: »Enthaltsamkeit« im Erzählrahmen und »Enthaltsamen, das heißt die Keuschen« in 1:14
  alternative: »Selbstbeherrschung« beziehungsweise ausschließlich »Keuschheit«
  rationale: Die Fassung hält sowohl die weitere ethische als auch die engere sexuelle Bedeutung sichtbar, statt die Spannung einseitig aufzulösen.
- issue: Ehe in 1:16
  choice: »die Frauen haben, als hätten sie keine«
  alternative: Verallgemeinernd »die verheiratet sind, als wären sie unverheiratet«
  rationale: Die auffällige, männlich formulierte und an 1 Kor 7,29 erinnernde Aussage wird nicht harmonisiert oder modernisierend neutralisiert.
- issue: Zu Engeln gemacht werden
  choice: Wörtlich als künftige Verwandlung beziehungsweise Erhöhung wiedergegeben
  alternative: Abschwächend »engelgleich sein«
  rationale: Das Zeugnis sagt ausdrücklich, sie würden zu Engeln Gottes gemacht; die ungewöhnliche Anthropologie bleibt sichtbar.
- issue: »Taufe rein bewahren«
  choice: Die konkrete Taufmetaphorik bleibt stehen
  alternative: Deutend »dem Taufversprechen treu bleiben«
  rationale: Eine ethische oder sakramentale Auslegung wird nicht in den Haupttext eingetragen.
- issue: Trinitarische Formel in 1:18
  choice: »beim Vater, beim Sohn und beim Heiligen Geist«
  alternative: »mit dem Vater, dem Sohn und dem Heiligen Geist«
  rationale: »Beim« wahrt die im Zeugen vorliegende Relation des Friedens, ohne sie systematisch auszudeuten.
- issue: Heilswirksamkeit des väterlichen Wortes in 1:22
  choice: »wird an ihnen … wirksam werden und ihnen Rettung bringen«
  alternative: »wird sich als wirksam für ihr Heil erweisen«
  rationale: Die natürliche deutsche Formulierung bewahrt die Verbindung zwischen Wort, Wirksamkeit und Rettung, ohne einen präzisen Heilsmechanismus festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Seligpreisungen sind bewusst rhythmisch und mit »Glückselig« formuliert, um ihren traditionsgeprägten Charakter zu erhalten. Archaische Anredeformen wurden vermieden. Eigennamen wurden in geläufige deutsche Formen übertragen. Da eine direkte Sichtung der griechischen und versionalen Manuskripttradition ausdrücklich noch aussteht, ist der Entwurf als quellenkritisch vorläufig gekennzeichnet; Alternativen des englischen öffentlichen Zeugnisses wurden im Text oder in Fußnoten sichtbar gehalten.
