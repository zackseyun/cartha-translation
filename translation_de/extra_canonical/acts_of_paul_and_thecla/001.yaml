review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen asketischen, rhetorischen Charakter. Sichere Korrekturen sind jedoch nötig: In 1:3 fehlt die „Absicht/das Ziel“ des Evangeliums, weil „Botschaft vom Evangelium“ diese Aussage ersetzt; in 1:13–14 und 1:19 werden ausdrücklich überlieferte Alternativen zu erklärenden Gleichsetzungen umgeformt; in 1:22 steht im Zeugen der Plural „bodies and souls“, und die Aussage zur Heilswirksamkeit des väterlichen Wortes sollte weniger paraphrasierend wiedergegeben werden.'
  naturalness: Die deutsche Fassung ist überwiegend flüssig, modern und im angemessen würdigen Register gehalten. Die revidierten Formulierungen bewahren die Wiederholung und den feierlichen Duktus der Seligpreisungen, ohne archaische Anredeformen einzuführen.
  terminology: Namen, „Königsstraße“, „Brechen des Brotes“, „Enthaltsamkeit“, „Taufe“ und die trinitarische Formel sind konsistent und sachgerecht. Die parenthetischen Alternativen des englischen Zeugen werden im revidierten Text als Alternativen und nicht als dogmatisch oder lexikalisch abschließend aufgelöste Synonyme behandelt.
  issues:
  - severity: medium
    issue: '1:3: „die Botschaft vom Evangelium“ ersetzt die im Zeugen genannte „design/purpose of the gospel“.'
    rationale: Der Satz nennt neben Aussprüchen und Lehren Christi ausdrücklich die Absicht bzw. das Ziel des Evangeliums. Diese Komponente muss im Haupttext stehen bleiben.
  - severity: medium
    issue: '1:13, 1:14 und 1:19: Überlieferte Alternativen werden als Gleichsetzungen formuliert.'
    rationale: „also rein“, „das heißt die Keuschen“ und „das heißt der Lehre“ engen beziehungsweise harmonisieren die im englischen Zeugen ausdrücklich offen gelassenen Alternativen ein.
  - severity: medium
    issue: '1:22: „Leib und Seele“ gibt den Plural des Zeugen nicht wieder; „wird ... Rettung bringen“ ist gegenüber „prove effectual to their salvation“ zu stark umgestaltet.'
    rationale: „Leiber und Seelen“ wahrt den Wortlaut. „sich ... als wirksam für ihre Rettung erweisen“ gibt die Aussage präziser wieder, ohne einen Heilsmechanismus auszudeuten.
