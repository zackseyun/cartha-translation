review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Textzeugen insgesamt eng. Einige Stellen glätten jedoch sinntragende Einzelheiten zu stark: In 5:5 fehlt das Sichwälzen; in 5:7 wird aus den „discourses of the holy works of Christ“ eine weniger unmittelbare Umschreibung; in 5:8 ist „ruchlose Frau“ eine stärkere, geschlechtlich spezifizierende Deutung von „unjust creature“; in 5:12 macht das Passiv „wurde ... emporgehoben“ aus dem aktiven Aufsteigen ein anderes Geschehen; und in 5:13 ist der „stake“ ein Pfahl, nicht nur eine allgemein gefasste Hinrichtungsstätte. Eine unmittelbare Kontrolle des griechischen bzw. versionalen Wortlauts ist anhand der gelieferten Daten weiterhin nicht möglich.'
  naturalness: Die Sprache ist überwiegend flüssiges, modernes Standarddeutsch und wahrt einen erzählerisch-würdigen Registerton. „Sich auf dem Boden wälzen“ ist trotz der stärkeren Bildlichkeit natürlich und hier für die Texttreue angemessen. „Pfahl“ ist verständlich und präziser als „Hinrichtungsstätte“.
  terminology: Namen, „Statthalter“, „Richterstuhl“, „Zauberer“, „Herr Jesus“ und „Zeichen des Kreuzes“ sind passend wiedergegeben. „Gesetz der Einwohner von Ikonion“ bewahrt die lokale Zuordnung ohne ein ungebräuchliches Ethnikon. Die Fußnote zu 5:12 muss den aktiven Wortlaut „stieg ... auf“ korrekt beschreiben; sie darf die Identität des Subjekts nicht dogmatisch auflösen.
  issues:
  - severity: medium
    issue: '5:5: Das Sichwälzen Theklas fehlt.'
    rationale: „Lay wallowing on the ground“ enthält mehr als bloßes Liegen auf dem Boden. Die körperlich intensive Handlung soll nicht ausgelassen werden.
  - severity: medium
    issue: '5:7: „Ausführungen ... über die heiligen Werke Christi“ schwächt die Konstruktion des Textzeugen ab.'
    rationale: Eine Formulierung wie „den Reden des Paulus über die heiligen Werke Christi“ gibt sowohl „discourses“ als auch „holy works of Christ“ unmittelbarer wieder, ohne die ungewöhnliche Wendung auszudeuten.
  - severity: medium
    issue: '5:8: „ruchlose Frau“ ist interpretierend und enger als „unjust creature“.'
    rationale: „Ruchlos“ fügt einen spezifisch moralisch-religiösen Vorwurf hinzu; „Frau“ ersetzt zudem das abwertend-unbestimmte „creature“. „Dieses ungerechte Geschöpf“ wahrt den polemischen Wortlaut.
  - severity: high
    issue: '5:12: Das aktive Aufsteigen wird als passives Emporgehobenwerden wiedergegeben.'
    rationale: Der englische Textzeuge sagt, dass das männliche Bezugsobjekt „ascended up to heaven“. Das deutsche Passiv verändert Handlung und Akteur.
  - severity: medium
    issue: '5:13: „Hinrichtungsstätte“ ist ungenauer als „stake“.'
    rationale: Der Text nennt konkret einen Pfahl; diese Einzelheit sollte erhalten bleiben.
