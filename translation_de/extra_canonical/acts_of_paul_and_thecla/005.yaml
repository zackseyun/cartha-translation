base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: de
  text: '**Kapitel 5**


    **5:1** Schließlich bemerkte man, dass Thekla fehlte. Ihre Angehörigen und Thamyris suchten sie in allen Straßen, als wäre sie verloren gegangen. Doch einer von den Mitbediensteten des Torhüters sagte ihnen, sie sei in der Nacht hinausgegangen.


    **5:2** Da befragten sie den Torhüter. Er sagte ihnen, sie sei ins Gefängnis zu dem fremden Mann gegangen.


    **5:3** Sie folgten seiner Auskunft und fanden sie dort. Als sie wieder herauskamen, brachten sie eine Menschenmenge zusammen, gingen zum Statthalter und berichteten ihm alles, was geschehen war.


    **5:4** Daraufhin befahl er, Paulus vor seinen Richterstuhl zu bringen.


    **5:5** Unterdessen lag Thekla im Gefängnis auf dem Boden, genau an der Stelle, an der Paulus gesessen und sie unterwiesen hatte. Deshalb befahl der Statthalter, auch sie vor seinen Richterstuhl zu bringen. Voller Freude nahm sie die Vorladung an und ging hin.


    **5:6** Als Paulus dorthin gebracht wurde, schrie die Menge noch heftiger: »Er ist ein Zauberer! Er soll sterben!«


    **5:7** Dennoch hörte der Statthalter den Ausführungen des Paulus über die heiligen Werke Christi gern zu.[a] Nachdem er den Rat einberufen hatte, ließ er Thekla vorführen und fragte sie: »Warum heiratest du Thamyris nicht, wie es das Gesetz der Einwohner von Ikonion verlangt?«


    **5:8** Sie blieb schweigend stehen und richtete ihren Blick fest auf Paulus. Als sie keine Antwort gab, schrie ihre Mutter Theoklia: »Verbrennt diese ruchlose Frau! Verbrennt sie mitten im Theater, weil sie Thamyris zurückweist! Dann sollen alle Frauen an ihrem Beispiel lernen, sich vor einem solchen Verhalten zu hüten!«


    **5:9** Der Statthalter war darüber zutiefst bekümmert. Er befahl, Paulus auszupeitschen und aus der Stadt zu treiben, Thekla aber zu verbrennen.


    **5:10** Dann erhob sich der Statthalter und ging sogleich ins Theater. Das ganze Volk zog hinaus, um das schreckliche Schauspiel zu sehen.


    **5:11** Wie ein Lamm in der Wildnis sich nach allen Seiten umsieht, um seinen Hirten zu finden, so hielt Thekla nach Paulus Ausschau.


    **5:12** Als sie die Menschenmenge betrachtete, sah sie den Herrn Jesus in der Gestalt des Paulus. Sie sagte sich: »Paulus ist gekommen, um in meiner Not nach mir zu sehen.« Sie richtete ihren Blick fest auf ihn; doch während sie hinsah, wurde er sogleich in den Himmel emporgehoben.[b]


    **5:13** Da brachten die jungen Männer und Frauen Holz und Stroh, um Thekla zu verbrennen. Als man sie nackt zur Hinrichtungsstätte führte, betrachtete der Statthalter staunend ihre außergewöhnliche Schönheit und wurde zu Tränen gerührt.


    **5:14** Nachdem sie das Holz aufgeschichtet hatten, befahl ihr die Menge, daraufzusteigen. Sie machte zuerst das Zeichen des Kreuzes und stieg hinauf.[c]


    **5:15** Dann zündeten die Leute den Holzstoß an. Obwohl die Flammen gewaltig waren, berührten sie Thekla nicht. Denn Gott hatte Erbarmen mit ihr: Aus der Erde unter ihr ließ er einen mächtigen Ausbruch hervorbrechen, und aus einer Wolke über ihr ließ er große Mengen Regen und Hagel herabströmen.


    **5:16** Durch das Aufbrechen der Erde gerieten sehr viele in große Gefahr, und einige kamen ums Leben. Das Feuer erlosch, und Thekla wurde gerettet.


    [a] Die genaue Formulierung ist vorläufig. Der zugrunde gelegte englische Text bietet »the holy works of Christ«; die griechische und sonstige alte Textüberlieferung muss noch unmittelbar geprüft werden.


    [b] Der Text setzt die Erscheinung des Herrn Jesus »in der Gestalt des Paulus« und das anschließende Emporgehobenwerden nebeneinander, ohne das Verhältnis zwischen Jesus und Paulus näher zu erklären.


    [c] Gemeint ist eine kreuzförmige Gebärde. Wie genau sie ausgeführt wurde, sagt der vorliegende Text nicht.'
