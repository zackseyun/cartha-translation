lexical_decisions:
- source_word: porter / gatekeeper
  choice: Torhüter
  rationale: Bezeichnet natürlich und präzise den Bediensteten am Zugang des Hauses; »Pförtner« wäre ebenfalls möglich, klingt hier aber institutioneller.
- source_word: strange man / stranger
  choice: der fremde Mann
  rationale: Bewahrt, dass Paulus aus Sicht der Befragten ein unbekannter beziehungsweise ortsfremder Mann ist, ohne das abwertende moderne Nebenverständnis von »ein Fremder« zu verstärken.
- source_word: judgment seat
  choice: Richterstuhl
  rationale: Gibt den gerichtlichen Amtssitz des Statthalters in würdigem, verständlichem Deutsch wieder.
- source_word: magician
  choice: Zauberer
  rationale: Bewahrt den polemischen Vorwurf übernatürlicher, illegitimer Machtausübung; »Magier« könnte im heutigen Deutsch neutraler wirken.
- source_word: law of the Iconians
  choice: Gesetz der Einwohner von Ikonion
  rationale: Vermeidet das ungebräuchliche Ethnikon »Ikonier« und lässt offen, ob eine förmliche Rechtsnorm oder örtliche Sitte gemeint ist.
- source_word: wallowing on the ground
  choice: lag … auf dem Boden
  rationale: Das englische »wallowing« wirkt im Deutschen mit »sich wälzen« leicht grotesk oder abwertend. Die Formulierung bewahrt die körperliche Hingabe an den Ort, ohne eine nicht gesicherte Bewegung hinzuzufügen.
- source_word: preserved
  choice: gerettet
  rationale: Im Zusammenhang der Hinrichtung bezeichnet das Wort ihre Bewahrung vor dem Tod; »bewahrt« wäre formaler, aber weniger unmittelbar.
theological_decisions:
- issue: Die Erscheinung Jesu in der Gestalt des Paulus
  choice: »sie sah den Herrn Jesus in der Gestalt des Paulus«
  alternative: »sie sah den Herrn Jesus, der wie Paulus aussah«
  rationale: Die gewählte Formulierung erhält die starke, theologisch offene Identifikation des Zeugnisses, ohne sie als bloße Ähnlichkeit oder als Wesensgleichheit auszulegen.
- issue: Das Emporgehobenwerden in 5:12
  choice: Das Pronomen »er« bleibt ohne erklärenden Zusatz stehen.
  alternative: Ausdrücklich »Jesus« oder »die Erscheinung« einsetzen.
  rationale: Der Text lässt den unmittelbaren Bezug im erzählerischen Ablauf bestehen. Eine ausdrückliche Identifikation würde die vorhandene Spannung unnötig auflösen.
- issue: Gottes Eingreifen und die Todesfälle
  choice: Gottes Erbarmen, der Erdausbruch und die Todesfälle werden nacheinander wiedergegeben, ohne eine moralische Erklärung hinzuzufügen.
  alternative: Die Todesfälle ausdrücklich als Gericht Gottes deuten.
  rationale: Das Zeugnis berichtet Ursache und Folge, deutet die Getöteten aber nicht ausdrücklich als Gegenstand göttlichen Gerichts.
- issue: Zeichen des Kreuzes
  choice: Die überlieferte Gebärde wird wörtlich benannt und in einer Fußnote knapp erläutert.
  alternative: Die Handlung konfessionell oder liturgiegeschichtlich näher bestimmen.
  rationale: Der Text nennt die Gebärde, erklärt jedoch weder ihre genaue Ausführung noch ihre spätere kirchliche Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung und direkter Rede. Archaismen wurden vermieden, während gerichtliche und religiöse Schlüsselbegriffe wie »Richterstuhl«, »Statthalter« und »Zeichen des Kreuzes« erhalten bleiben. Da der bereitgestellte Ausgangstext ausdrücklich nur ein gemeinfreier englischer Textzeuge ist und die Prüfung der griechischen sowie versionalen Überlieferung noch aussteht, ist der Entwurf als quellenkritisch vorläufig gekennzeichnet; er beansprucht keine abgeschlossene Übersetzung unmittelbar aus dem Griechischen.
