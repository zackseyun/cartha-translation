  text: '9:1 Then Thecla was taken from Trifina, stripped naked, fitted with a belt, and thrown into the place appointed for fighting wild beasts. The lions and bears were released against her.


    9:2 But the fiercest of them all, a lioness, ran to Thecla and lay down at her feet. At this, the crowd of women shouted loudly.


    9:3 Then a female bear charged fiercely toward her, but the lioness met the bear and tore it to pieces.


    9:4 Again, a male lion that was accustomed to devouring people, and that belonged to Alexander, ran toward her. But the lioness confronted the male lion, and they killed each other.


    9:5 Then the women became even more distressed because the lioness that had helped Thecla was dead.


    9:6 Afterward, they brought out many other wild beasts. But Thecla stood with her hands stretched toward heaven and prayed. When she had finished praying, she turned around, saw a pool of water, and said, “Now is the right time for me to be baptized.”


    9:7 So she threw herself into the water and said, “In your name, O my Lord Jesus Christ, I am baptized on this last day.” When the women and the people saw this, they cried out, “Do not throw yourself into the water!” The governor himself also cried out at the thought that the fish (sea-calves) were likely to devour so much beauty.


    9:8 Despite all this, Thecla threw herself into the water in the name of our Lord Jesus Christ.


    9:9 But when the fish (sea-calves) saw the lighting and fire, they were killed and floated dead on the surface of the water. A cloud of fire surrounded Thecla, so that just as the beasts could not come near her, the people could not see her nakedness.


    9:10 Yet they released other wild beasts against her. At this, the women raised a deeply mournful cry. Some of them scattered spikenard, others cassia, others amomus [a kind of spikenard, or the herb of Jerusalem, or ladies’ rose], and others ointment. The amount of ointment was great, in proportion to the number of people. Then all the beasts lay down as though they were fast asleep and did not touch Thecla.


    9:11 Then Alexander said to the governor, “I have some very terrifying bulls. Let us bind her to them.” The governor replied with concern, “You may do what you think is appropriate.”


    9:12 Then they put a cord around Thecla’s waist that also bound her feet, and with it they tied her to the bulls. They applied red-hot irons to the bulls’ genitals so that, being tormented even more, they might drag Thecla around more violently until they had killed her.


    9:13 The bulls tore around, making a horrifying noise. But the flame surrounding Thecla burned through the cords fastened to the bulls’ members, and she stood in the middle of the arena as calmly as if she had not been bound.


    9:14 Meanwhile, Trifina, who was sitting on one of the benches, fainted and died. At this, the whole city became greatly distressed.


    9:15 Alexander himself was afraid and pleaded with the governor, saying, “I beg you, have compassion on me and on the city, and release this woman who has fought with the beasts, lest you, I, and the whole city be destroyed.


    9:16 For if Caesar receives any report of what has just happened, he will certainly destroy the city at once, because Trifina, a woman of royal descent and his relative, has died in her seat.”


    9:17 Then the governor called Thecla to him from among the beasts and said to her, “Who are you, and what is your condition, that not one of the beasts will touch you?”


    9:18 Thecla answered him, “I am a servant of the living God. As for my condition, I am a believer in Jesus Christ, his Son, in whom God is well pleased. For that reason, none of the beasts could touch me.


    9:19 He alone is the way to eternal salvation and the foundation of eternal life. He is a refuge for those in distress, a support for the afflicted, and hope and defense for the hopeless. In short, all who do not believe in him will not live but will suffer eternal death.”


    9:20 When the governor heard these things, he ordered her clothes to be brought and said to her, “Put on your clothes.”


    9:21 Thecla replied, “May the God who clothed me when I was naked among the beasts clothe your soul with the robe of salvation on the day of judgment.” Then she took her clothes and put them on. The governor immediately issued an order in these words: “I release to you Thecla, the servant of God.”


    9:22 At this, the women cried out together in a loud voice and, with one accord, praised God, saying, “There is only one God, who is the God of Thecla—the one God who has delivered Thecla.”


    9:23 Their voices were so loud that the whole city seemed to be shaken. Trifina herself heard the good news, rose again, and ran with the crowd to meet Thecla. Embracing her, she said, “Now I believe that there will be a resurrection of the dead. Now I am convinced that my daughter is alive. Therefore, come home with me, my daughter Thecla, and I will transfer to you everything I have.”


    9:24 So Thecla went with Trifina and stayed there for a few days, teaching her the word of the Lord. Through this, many young women were converted, and there was great joy in Trifina’s household.


    9:25 But Thecla longed to see Paul. She made inquiries and sent people everywhere to find him. At last, when she was told that he was at Myra in Lycia, she took many young men and women with her. She put on a belt, dressed herself in men’s clothing, and went to him at Myra in Lycia. There she found Paul preaching the word of God, and she stood beside him among the crowd.'
translation:
  language: de
  text: '9:1 Dann wurde Thekla Tryphäna weggenommen, nackt ausgezogen, mit einem Gürtel versehen und in den für Tierkämpfe bestimmten Kampfplatz geworfen. Die Löwen und Bären wurden auf sie losgelassen.


    9:2 Doch eine Löwin, die wildeste von allen, lief auf Thekla zu und legte sich ihr zu Füßen. Da schrie die Menge der Frauen laut auf.


    9:3 Dann stürmte eine Bärin wild auf sie zu; aber die Löwin trat der Bärin entgegen und riss sie in Stücke.


    9:4 Darauf lief ein männlicher Löwe auf sie zu, der Menschen zu verschlingen pflegte und Alexander gehörte. Doch die Löwin stellte sich ihm entgegen, und beide töteten einander.


    9:5 Da gerieten die Frauen in noch größere Sorge, weil die Löwin, die Thekla geholfen hatte, tot war.


    9:6 Danach brachten sie viele weitere wilde Tiere heraus. Thekla aber stand da, streckte die Hände zum Himmel aus und betete. Als sie ihr Gebet beendet hatte, wandte sie sich um, sah ein Wasserbecken und sagte: »Jetzt ist für mich die rechte Zeit, getauft zu werden.«


    9:7 Daraufhin stürzte sie sich ins Wasser und sagte: »In deinem Namen, mein Herr Jesus Christus, werde ich an diesem letzten Tag getauft.« Als die Frauen und das Volk das sahen, riefen sie: »Stürz dich nicht ins Wasser!« Auch der Statthalter schrie auf bei dem Gedanken, die Fische – Meerkälber[a] – könnten so große Schönheit verschlingen.


    9:8 Trotz allem stürzte sich Thekla im Namen unseres Herrn Jesus Christus ins Wasser.


    9:9 Als aber die Fische – die Meerkälber – den Lichtschein und das Feuer sahen, wurden sie getötet und trieben tot auf der Wasseroberfläche. Eine Feuerwolke umgab Thekla, sodass weder die Tiere ihr nahekommen noch die Menschen ihre Nacktheit sehen konnten.


    9:10 Dennoch ließen sie weitere wilde Tiere auf sie los. Da erhoben die Frauen einen tiefen Klageruf. Einige von ihnen streuten Narde aus, andere Kassia, andere Amomum[b] und wieder andere Salböl. Entsprechend der großen Menschenmenge war auch die Menge des Salböls groß. Daraufhin legten sich alle Tiere nieder, als wären sie fest eingeschlafen, und rührten Thekla nicht an.


    9:11 Da sagte Alexander zum Statthalter: »Ich habe einige äußerst furchterregende Stiere. Lasst uns sie an diese binden.« Besorgt erwiderte der Statthalter: »Tu, was du für richtig hältst.«


    9:12 Dann legten sie Thekla ein Seil um die Hüfte, mit dem auch ihre Füße gefesselt wurden, und banden sie damit an die Stiere. An deren Geschlechtsteile hielten sie glühende Eisen, damit die Tiere durch die noch größere Qual Thekla umso heftiger umherschleiften, bis sie sie getötet hätten.


    9:13 Die Stiere rasten unter entsetzlichem Gebrüll umher. Doch die Flamme, die Thekla umgab, brannte die an den Gliedern der Stiere befestigten Seile durch. So stand sie mitten in der Arena, so ruhig, als wäre sie nie gefesselt gewesen.


    9:14 Unterdessen wurde Tryphäna, die auf einer der Sitzreihen saß, ohnmächtig und starb. Darüber geriet die ganze Stadt in große Bestürzung.


    9:15 Auch Alexander selbst bekam Angst und flehte den Statthalter an: »Ich bitte dich: Hab Erbarmen mit mir und mit der Stadt und lass diese Frau frei, die mit den wilden Tieren gekämpft hat, damit nicht du und ich und die ganze Stadt vernichtet werden.


    9:16 Denn wenn der Kaiser erfährt, was hier gerade geschehen ist, wird er die Stadt gewiss sofort vernichten, weil Tryphäna, eine Frau königlicher Herkunft und seine Verwandte, auf ihrem Sitz gestorben ist.«


    9:17 Darauf rief der Statthalter Thekla aus der Mitte der Tiere zu sich und fragte sie: »Wer bist du, und was hat es mit dir auf sich, dass keines der Tiere dich anrührt?«


    9:18 Thekla antwortete ihm: »Ich bin eine Dienerin des lebendigen Gottes. Und was mich betrifft: Ich glaube an Jesus Christus, seinen Sohn, an dem Gott Wohlgefallen hat. Deshalb konnte keines der Tiere mich anrühren.


    9:19 Er allein ist der Weg zum ewigen Heil und der Grund des ewigen Lebens. Er ist eine Zuflucht für die Bedrängten, eine Stütze für die Geplagten, Hoffnung und Schutz für die Hoffnungslosen. Kurz gesagt: Alle, die nicht an ihn glauben, werden nicht leben, sondern den ewigen Tod erleiden.«


    9:20 Als der Statthalter dies hörte, ließ er ihre Kleider bringen und sagte zu ihr: »Zieh deine Kleider an.«


    9:21 Thekla erwiderte: »Der Gott, der mich bekleidete, als ich nackt unter den wilden Tieren war, möge deine Seele am Tag des Gerichts mit dem Gewand des Heils bekleiden.« Dann nahm sie ihre Kleider und zog sie an. Sofort verkündete der Statthalter folgenden Erlass: »Ich gebe euch Thekla, die Dienerin Gottes, frei.«


    9:22 Da riefen die Frauen gemeinsam mit lauter Stimme und priesen einmütig Gott. Sie sagten: »Nur einer ist Gott, der Gott Theklas – der eine Gott, der Thekla gerettet hat!«


    9:23 Ihre Stimmen waren so laut, dass die ganze Stadt zu erbeben schien. Tryphäna selbst hörte die frohe Nachricht, erhob sich wieder und lief mit der Menge Thekla entgegen. Sie umarmte sie und sagte: »Jetzt glaube ich, dass es eine Auferstehung der Toten geben wird. Jetzt bin ich überzeugt, dass meine Tochter lebt. Komm deshalb mit mir nach Hause, meine Tochter Thekla, und ich werde dir alles überschreiben, was ich besitze.«[c]


    9:24 So ging Thekla mit Tryphäna und blieb einige Tage dort. Sie lehrte sie das Wort des Herrn; dadurch kamen viele junge Frauen zum Glauben, und im Haus Tryphänas herrschte große Freude.


    9:25 Thekla aber sehnte sich danach, Paulus zu sehen. Sie erkundigte sich nach ihm und sandte überallhin Leute aus, um ihn zu finden. Als sie schließlich erfuhr, dass er sich in Myra in Lykien aufhielt, nahm sie viele junge Männer und Frauen mit. Sie legte einen Gürtel an, kleidete sich wie ein Mann und ging zu ihm nach Myra in Lykien. Dort fand sie Paulus, wie er das Wort Gottes verkündete, und stellte sich in der Menschenmenge neben ihn.


    [a] Die überlieferte englische Textgrundlage bietet neben »Fische« die erklärende Bezeichnung »Meerkälber«, eine ältere Bezeichnung, die hier vermutlich gefährliche Meerestiere meint. Die genaue zoologische Bestimmung bleibt unsicher.


    [b] Amomum ist die Bezeichnung für einen aromatischen Pflanzenstoff beziehungsweise ein Duftgewürz. Die ältere englische Überlieferung erklärt es alternativ als eine Art Narde, »Kraut von Jerusalem« oder »Frauenrose«; die genaue Identifikation ist unsicher.


    [c] Die Erzählung sagt in 9:14, Tryphäna sei gestorben, und berichtet hier, sie habe die Nachricht gehört und sei wieder aufgestanden. Diese Spannung ist bewusst nicht geglättet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte englische Textgrundlage bietet neben »Fische« die erklärende Bezeichnung »Meerkälber«, eine ältere Bezeichnung, die hier vermutlich gefährliche Meerestiere meint. Die genaue zoologische Bestimmung bleibt unsicher.
    reason: Die direkte Prüfung der griechischen und versionalen Überlieferung steht noch aus; beide Angaben des Zeugen sollen transparent bewahrt werden.
  - marker: b
    text: Amomum ist die Bezeichnung für einen aromatischen Pflanzenstoff beziehungsweise ein Duftgewürz. Die ältere englische Überlieferung erklärt es alternativ als eine Art Narde, »Kraut von Jerusalem« oder »Frauenrose«; die genaue Identifikation ist unsicher.
    reason: Verhindert eine ungesicherte botanische Festlegung und dokumentiert die Erklärung des verfügbaren Zeugen.
  - marker: c
    text: Die Erzählung sagt in 9:14, Tryphäna sei gestorben, und berichtet hier, sie habe die Nachricht gehört und sei wieder aufgestanden. Diese Spannung ist bewusst nicht geglättet.
    reason: Macht die auffällige narrative Spannung transparent, ohne sie als bloße Ohnmacht oder ausdrückliche Auferweckung umzudeuten.
lexical_decisions:
- source_word: Thecla / Trifina
  choice: Thekla / Tryphäna
  rationale: Im Deutschen geläufige, der griechischen Namensform angenäherte Schreibungen; die Personenidentität bleibt klar.
- source_word: governor
  choice: Statthalter
  rationale: Dignified and historically suitable German term without specifying an uncertain exact Roman office.
- source_word: fish (sea-calves)
  choice: Fische – Meerkälber
  rationale: Bewahrt beide Bezeichnungen der bereitgestellten Überlieferung und kennzeichnet die zoologische Unsicherheit in einer Fußnote.
- source_word: amomus
  choice: Amomum
  rationale: Transliteration preserves the uncertain aromatic substance instead of forcing a disputed botanical identification.
- source_word: foundation of eternal life
  choice: Grund des ewigen Lebens
  rationale: Natural German that preserves both the foundational and causal resonance without over-defining it.
- source_word: were converted
  choice: kamen … zum Glauben
  rationale: Modern, ordinary German avoids a potentially technical denominational expression while conveying religious turning.
- source_word: habit of a man
  choice: kleidete sich wie ein Mann
  rationale: Natural contemporary wording that states the narrative action without adding claims about identity or motive.
theological_decisions:
- issue: Theklas Taufe im Wasserbecken
  choice: Die Selbstaussage und Handlung werden ohne erläuternde Bewertung wiedergegeben.
  alternative: Die Szene ausdrücklich als gültige Selbsttaufe oder lediglich als symbolische Handlung bestimmen.
  rationale: Die Erzählung nennt die Handlung Taufe, erklärt aber keine kirchenrechtlichen oder sakramentalen Folgerungen; diese Spannung darf nicht konfessionell aufgelöst werden.
- issue: Tryphänas Tod und Wiederaufstehen
  choice: Beide Aussagen werden unverändert nebeneinandergestellt und durch Fußnote als narrative Spannung benannt.
  alternative: 9:14 als bloße Todesnähe oder 9:23 ausdrücklich als Totenerweckung deuten.
  rationale: Die verfügbare Textgrundlage sagt zunächst, sie sei gestorben, und später, sie habe gehört und sei wieder aufgestanden; eine Harmonisierung wäre nicht quellengerecht.
- issue: Christologische Heilsbehauptung in 9:19
  choice: 'Die Exklusivität der Aussage wird direkt bewahrt: »Er allein ist der Weg zum ewigen Heil«; ebenso der »ewige Tod« für Nichtglaubende.'
  alternative: Die Aussage inklusiver abschwächen oder dogmatisch weiter auslegen.
  rationale: Die starke soteriologische Spannung gehört ausdrücklich zum Text und darf weder gemildert noch systematisch erweitert werden.
