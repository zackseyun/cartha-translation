  source_fidelity: 'Die Handlung, Abfolge und auffälligen Spannungen des englischen Zeugen sind im Wesentlichen zuverlässig bewahrt, einschließlich Tryphänas Tod und anschließendem Wiederaufstehen sowie der unentschiedenen Bezeichnung der Wassertiere. In 9:10 wird die Relation zwischen Salbölmenge und Zahl der Anwesenden jedoch leicht umgeformt: Der Entwurf setzt eine „große Menschenmenge“ voraus, statt die Menge des Salböls als der Zahl der Menschen entsprechend zu bezeichnen.'
