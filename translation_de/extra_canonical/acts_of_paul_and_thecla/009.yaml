  terminology: Die Namensformen Thekla und Tryphäna, „Statthalter“, „Gewand des Heils“ und die zurückhaltende Wiedergabe der Taufszene sind angemessen. Die textkritisch bzw. zoologisch unsichere Doppelbezeichnung „Fische – Meerkälber“ und Amomum bleiben mit sachgerechten Fußnoten transparent. Die direkte Kontrolle griechischer und versionaler Handschriften bleibt für die endgültige Fassung erforderlich.
