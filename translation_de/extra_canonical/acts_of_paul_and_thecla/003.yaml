base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/003.yaml
  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
translation:
  language: de
  text: '**Kapitel 3**


    **3:1** Darauf sagte Thamyris: »Kommt mit mir in mein Haus und stärkt euch.« So gingen sie zu einem überaus prächtigen Festmahl, bei dem es Wein in Fülle und die köstlichsten Speisen gab.


    **3:2** Man führte sie an eine reich gedeckte Tafel, und Thamyris ließ ihnen reichlich zu trinken geben, weil er Thekla liebte und sie heiraten wollte.


    **3:3** Dann sagte Thamyris: »Ich möchte, dass ihr mir erklärt, was dieser Paulus lehrt, damit ich es verstehen kann. Denn ich mache mir große Sorgen um Thekla: Sie findet so viel Gefallen an den Worten dieses Fremden, dass ich Gefahr laufe, meine künftige Frau zu verlieren.«


    **3:4** Demas und Hermogenes antworteten gemeinsam: »Lass ihn vor den Statthalter Castillius bringen und beschuldige ihn, er wolle das Volk dazu überreden, die neue Religion der Christen anzunehmen. Dann wird der Statthalter ihn gemäß dem Erlass des Kaisers hinrichten lassen, und so wirst du deine Frau bekommen.


    **3:5** Zugleich werden wir sie lehren, die Auferstehung, von der er spricht, sei bereits geschehen und bestehe darin, dass wir Kinder bekommen; und wir seien damals auferstanden, als wir zur Erkenntnis Gottes gelangten.«


    **3:6** Als Thamyris dies von ihnen hörte, wurde er von glühendem Zorn erfüllt.


    **3:7** Früh am nächsten Morgen stand er auf und ging zum Haus des Onesiphorus. Amtsträger, der Gefängniswärter und eine große, mit Knüppeln bewaffnete Menschenmenge begleiteten ihn. Er sagte zu Paulus:


    **3:8** »Du hast die Stadt Ikonion in die Irre geführt, darunter auch Thekla, die mit mir verlobt ist, sodass sie mich nun nicht mehr heiraten will. Deshalb musst du mit uns zum Statthalter Castillius kommen.«


    **3:9** Da schrie die ganze Menge: »Weg mit diesem Betrüger – diesem Zauberer![a] Er hat unsere Frauen um den Verstand gebracht, und das ganze Volk hört auf ihn.«


    **Fußnote**


    [a] Der vorliegende englische Textzeuge bietet hier »impostor (magician)«, also »Betrüger (Zauberer)«. Da die direkte Prüfung des griechischen Wortlauts noch aussteht, bleiben beide Bezeichnungen sichtbar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende englische Textzeuge bietet hier »impostor (magician)«, also »Betrüger (Zauberer)«. Da die direkte Prüfung des griechischen Wortlauts noch aussteht, bleiben beide Bezeichnungen sichtbar.
    reason: Der zugrunde gelegte Textzeuge überliefert eine parenthetische Alternative; ohne abgeschlossene Prüfung der griechischen und versionalen Überlieferung darf sie nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: refresh yourselves
  choice: stärkt euch
  rationale: Die natürliche deutsche Wendung bezeichnet Erholung und Stärkung durch Bewirtung, ohne den Sinn unnötig einzuengen.
- source_word: very splendid entertainment
  choice: überaus prächtiges Festmahl
  rationale: Im Zusammenhang mit Wein, Speisen und gedeckter Tafel ist ein festliches Mahl gemeint; »Unterhaltung« wäre im modernen Deutschen missverständlich.
- source_word: doctrines
  choice: was dieser Paulus lehrt
  rationale: Die verbale Form klingt gegenwärtig und verständlich und bewahrt den Bezug auf den Inhalt der Lehre.
- source_word: governor
  choice: Statthalter
  rationale: Der Ausdruck bezeichnet einen regionalen politischen Amtsträger und vermeidet die moderne Bedeutung von »Gouverneur«.
- source_word: perverted / led astray
  choice: in die Irre geführt
  rationale: Die Wendung bewahrt den anklagenden Charakter, ohne eine im Deutschen stärker sexualisierte oder konfessionell aufgeladene Formulierung zu verwenden.
- source_word: imposter (magician)
  choice: Betrüger – diesem Zauberer
  rationale: Beide im überlieferten englischen Zeugen genannten Möglichkeiten werden beibehalten; ihre genaue Beziehung muss anhand des griechischen Textes noch geprüft werden.
theological_decisions:
- issue: Deutung der bereits geschehenen Auferstehung
  choice: 'Die Aussage wird ausdrücklich als die von Demas und Hermogenes vertretene Lehre wiedergegeben: Sie bestehe im Kinderzeugen und in der Gotteserkenntnis.'
  alternative: Die Aussage mit einer späteren orthodoxen oder häretischen Einordnung zu erklären oder zu korrigieren.
  rationale: Der Abschnitt stellt diese Deutung als Figurenrede dar. Die Übersetzung bewahrt die theologische Spannung, ohne sie zu bestätigen, abzuschwächen oder konfessionell zu bewerten.
- issue: Bezeichnung des Christentums als »neue Religion«
  choice: die neue Religion der Christen
  alternative: der neue christliche Glaube oder die christliche Sekte
  rationale: Die Formulierung folgt dem verfügbaren Textzeugen und bewahrt die Außensicht der Ankläger, ohne eine abwertende Zusatzbedeutung einzuführen.
- issue: Kaiserlicher Erlass und Todesstrafe
  choice: gemäß dem Erlass des Kaisers hinrichten lassen
  alternative: durch einen Befehl des Kaisers persönlich zum Tod verurteilen
  rationale: Die Übersetzung gibt die behauptete rechtliche Begründung wieder, lässt aber offen, auf welchen konkreten Erlass sich die Sprecher beziehen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer Erzählführung und natürlicher direkter Rede. Die Eigennamen folgen geläufigen deutschen beziehungsweise textnahen Formen: Paulus, Thekla, Ikonion, Onesiphorus, Thamyris, Demas, Hermogenes und Castillius. Der Entwurf ist ausdrücklich vorläufig, da die direkte Prüfung der griechischen und versionalen Handschriften noch aussteht; Grundlage ist der bereitgestellte gemeinfreie englische Textzeuge, konsultiert zusammen mit der englischen POB-Fassung.'
