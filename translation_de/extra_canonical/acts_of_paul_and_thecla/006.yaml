  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: de
  text: '6:1 Unterdessen fastete Paulus zusammen mit Onesiphorus, dessen Frau und seinen Kindern in einer Höhle am Weg von Ikonion nach Daphne.


    6:2 Nachdem sie mehrere Tage gefastet hatten, sagten die Kinder zu Paulus: »Vater, wir haben Hunger und kein Geld, um Brot zu kaufen.« Onesiphorus hatte nämlich seinen ganzen Besitz zurückgelassen, um Paulus mit seiner Familie zu folgen.


    6:3 Da zog Paulus sein Obergewand aus, gab es dem Jungen und sagte: »Geh, mein Kind, kauf Brot und bring es hierher.«[a]


    6:4 Während der Junge das Brot kaufen wollte, sah er seine Nachbarin Thekla. Er war überrascht und fragte sie: »Thekla, wohin gehst du?«


    6:5 Sie antwortete: »Ich suche Paulus. Ich bin den Flammen entkommen.«


    6:6 Da sagte der Junge: »Ich bringe dich zu ihm. Er ist deinetwegen in großer Sorge und betet und fastet seit sechs Tagen.«


    6:7 Als Thekla zur Höhle kam, fand sie Paulus auf den Knien. Er betete: »Heiliger Vater, Herr Jesus Christus, lass das Feuer Thekla nicht anrühren, sondern steh ihr bei, denn sie ist deine Dienerin.«[b]


    6:8 Thekla stand hinter ihm und rief: »Herrscher und Herr, Schöpfer des Himmels und der Erde, Vater deines geliebten und heiligen Sohnes! Ich preise dich, weil du mich vor dem Feuer bewahrt hast, sodass ich Paulus wiedersehen kann.«


    6:9 Da stand Paulus auf. Als er sie sah, sagte er: »Gott, der du die Herzen erforschst, Vater meines Herrn Jesus Christus, ich preise dich, weil du mein Gebet erhört hast.«


    6:10 In der Höhle waren sie alle in herzlicher Liebe miteinander verbunden. Paulus, Onesiphorus und alle, die bei ihnen waren, wurden von Freude erfüllt.


    6:11 Sie hatten fünf Brote, etwas Gemüse und Wasser. Während sie über die heiligen Werke Christi sprachen, stärkten und trösteten sie einander.[c]


    6:12 Da sagte Thekla zu Paulus: »Wenn es dir recht ist, werde ich dir folgen, wohin du auch gehst.«


    6:13 Er antwortete ihr: »Die Menschen sind heute sehr der Unzucht ergeben. Weil du schön bist, fürchte ich, dass dich eine noch schwerere Versuchung treffen könnte als die vorige und dass du ihr nicht standhältst, sondern von ihr überwältigt wirst.«


    6:14 Thekla erwiderte: »Gib mir nur das Siegel Christi, dann wird keine Versuchung mich antasten.«[d]


    6:15 Paulus antwortete: »Thekla, warte geduldig, dann wirst du die Gabe Christi empfangen.«[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeugt ist, dass Paulus sein Obergewand auszog und den Jungen zum Brotkauf schickte. Dass er ihm das Gewand zum Verkauf oder Tausch gab, ergibt sich aus dem Zusammenhang, wird aber nicht ausdrücklich gesagt.
    reason: Die natürliche deutsche Fassung macht eine kontextuelle Ergänzung nötig; die Fußnote legt sie offen.
  - marker: b
    text: 'Die Anrede kann als Folge zweier Anrufungen verstanden werden: »Heiliger Vater« und »Herr Jesus Christus«. Ihr genaues Verhältnis bleibt im zugrunde liegenden Zeugnis offen.'
    reason: Bewahrt eine genuine syntaktische und theologische Mehrdeutigkeit.
  - marker: c
    text: 'Die ältere englische Wiedergabe kann auch bedeuten: Sie erfreuten oder trösteten einander durch Betrachtungen über die heiligen Werke Christi.'
    reason: Die genaue Nuance der gemeinschaftlichen Tätigkeit ist wegen der nur vorläufig verfügbaren Quellengrundlage unsicher.
  - marker: d
    text: Mit dem »Siegel Christi« könnte die Taufe oder ein anderer Ritus der Zugehörigkeit zu Christus gemeint sein. Der Text selbst erklärt den Ausdruck hier nicht.
    reason: Verhindert eine unbegründete konfessionelle Festlegung.
  - marker: e
    text: Auch die »Gabe Christi« wird nicht näher bestimmt; der Ausdruck kann daher nicht sicher mit dem zuvor genannten Siegel gleichgesetzt werden.
    reason: Erhält die begriffliche Offenheit des Textes.
lexical_decisions:
- source_word: coat
  choice: Obergewand
  rationale: Ein veräußerbares Kleidungsstück ist im Kontext wahrscheinlicher als eine moderne Jacke; die Handlung des Gebens ist aus dem anschließenden Auftrag erschlossen und in einer Fußnote kenntlich gemacht.
- source_word: Father
  choice: Vater
  rationale: Die Anrede der Kinder an Paulus bleibt wörtlich erhalten, ohne sie als biologische Verwandtschaft zu deuten.
- source_word: fornication
  choice: Unzucht
  rationale: Bewahrt den weiten moralisch-sexuellen Sinn und den würdevollen antiken Registerton besser als eine engere moderne Festlegung.
- source_word: seal of Christ
  choice: Siegel Christi
  rationale: Die symbolisch-rituelle Wendung bleibt unaufgelöst, da sie möglicherweise auf Taufe oder eine andere Initiation verweist, dies im vorliegenden Text aber nicht ausdrücklich gesagt wird.
- source_word: gift of Christ
  choice: Gabe Christi
  rationale: Die offene Formulierung wird bewahrt und nicht mit Taufe, Geistgabe oder einem bestimmten Sakrament gleichgesetzt.
- source_word: herbs
  choice: Gemüse
  rationale: Natürliches modernes Deutsch für pflanzliche Speise; die genaue Art der Nahrung bleibt unbestimmt.
theological_decisions:
- issue: Anrede in Paulus’ Gebet in 6:7
  choice: »Heiliger Vater, Herr Jesus Christus« ohne ergänzende syntaktische Harmonisierung
  alternative: Zwei klar getrennte Anrufungen Gottes des Vaters und Jesu oder alleinige Anrede Jesu als heiliger Vater
  rationale: Die überlieferte englische Zeugnisform ist syntaktisch und theologisch mehrdeutig; die Übersetzung bewahrt diese Spannung.
- issue: Das »Siegel Christi«
  choice: Bildhafte Wendung unverändert bewahren
  alternative: Als Taufe erklären oder direkt mit »Taufe« übersetzen
  rationale: Eine taufbezogene Deutung ist möglich, wird in diesem Abschnitt jedoch nicht ausdrücklich festgelegt.
- issue: Die »Gabe Christi«
  choice: Allgemein als »Gabe Christi« wiedergeben
  alternative: Mit dem Siegel, der Taufe oder dem Heiligen Geist identifizieren
  rationale: Der Text lässt die genaue Referenz offen; eine konfessionelle Präzisierung wäre unbegründet.
- issue: Theklas Bewahrung vor dem Feuer
  choice: Als Gottes Bewahrung wiedergeben
  alternative: Den genauen Mechanismus des Wunders erläutern
  rationale: Der Abschnitt bezeugt die Rettung, erklärt aber nicht, wie sie geschah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählweise und direkter Rede. Archaismen wie »all seine Habe« oder »wohin immer du gehest« wurden vermieden. Da eine direkte Prüfung des griechischen und versionalen Befunds noch aussteht, ist die Fassung ausdrücklich quellenkritisch vorläufig; Unsicherheiten des englischen Public-Domain-Zeugnisses werden nicht verdeckt.
