  - marker: a
    text: Diana ist der römische Name der Göttin, die im griechischen Sprachraum gewöhnlich Artemis genannt wird. Der vorliegende englische Übersetzungszeuge hat „Diana“; eine direkte Prüfung der griechischen Lesart steht noch aus.
