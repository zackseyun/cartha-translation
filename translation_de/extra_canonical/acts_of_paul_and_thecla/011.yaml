    reason: Dokumentiert eine ausdrücklich markierte Unsicherheit des zugrunde liegenden Zeugen.
  - marker: c
    text: „Selige Schau“ gibt den Ausdruck „beatific vision“ des englischen Zeugen wieder, also die endgültige, glückselige Schau Gottes. Die genaue Formulierung der griechischen oder versionalen Grundlage ist noch zu prüfen.
    reason: Erläutert einen theologischen Fachausdruck, dessen unmittelbare Quellenform derzeit nicht vorliegt.
  - marker: d
