review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Übersetzungszeugen insgesamt eng und bewahrt dessen hagiographischen sowie teils theologisch geprägten Sprachgebrauch. Eine unmittelbare Kontrolle am griechischen bzw. versionalen Text ist nach den Metadaten weiterhin nicht möglich. In 11:14 sollte die futurische Relativbestimmung des Zeugen ausdrücklich als solche wiedergegeben werden; die Segensvermittlung wird nicht von den später Glaubenden abhängig gemacht, sondern ihnen zugedacht.
  naturalness: Modernes Standarddeutsch und der würdige Erzählton sind überwiegend gelungen. Einige kleine Umstellungen verbessern idiomatische Präzision, insbesondere in 11:13–14. Die explizite Benennung der beabsichtigten Vergewaltigung in 11:8 ist sachlich angemessen und verdeckt die dargestellte Gewalt nicht.
  terminology: „Diana“, „Thekla“, „Ikonion“, „Märtyrerin“, „Apostelin“, „Heiliger Geist“ und „selige Schau“ sind konsistent. „Zu sich nahm“ in 11:15 bewahrt gegenüber „entrückte“ die im englischen Zeugen nicht abschließend geklärte Art von Theklas Lebensende. Die Fußnoten sind sinnvoll, müssen aber bei der Aussage zu 11:14 keine zusätzliche Deutung nahelegen.
  issues:
  - severity: medium
    issue: '11:14: Die Satzfügung „Segen vermitteln, wenn sie ... glaubten“ macht die Segensvermittlung im Deutschen unnötig zu einer Bedingungsfolge.'
    rationale: Der englische Zeuge spricht von Menschen künftiger Zeiten, die glauben würden, als Bezugsgruppe („those ... who should believe“), nicht von einem konditionalen „wenn“. Die Relativkonstruktion bewahrt die Aussage genauer.
  - severity: low
    issue: '11:13: „Sie konnten nur noch ... ergreifen“ verschiebt die knappe adversative Erzählfolge leicht in eine Aussage über ihr verbliebenes Vermögen.'
    rationale: Der Zeuge berichtet schlicht, dass sie den Schleier bzw. die Kopfbedeckung ergriffen und ein Stück abrissen. Eine direkte Wiedergabe ist klarer.
