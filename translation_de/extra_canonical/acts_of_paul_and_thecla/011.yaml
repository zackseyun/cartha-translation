base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/011.yaml
  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: de
  text: '**Kapitel 11**


    **11:1** Da gab der Teufel ihnen einen bösen Gedanken ein. Eines Tages kamen sie zu einer Beratung zusammen und sagten zueinander: »Die Jungfrau ist eine Priesterin der großen Göttin Diana[a]. Alles, worum sie die Göttin bittet, wird ihr gewährt; denn sie ist eine Jungfrau und wird deshalb von allen Göttern geliebt.


    **11:2** Darum wollen wir einige zügellose junge Männer anwerben. Wir machen sie gehörig betrunken, geben ihnen eine große Geldsumme und befehlen ihnen, diese Jungfrau zu schänden. Wenn sie es tun, versprechen wir ihnen eine noch größere Belohnung.«


    **11:3** Sie waren nämlich untereinander zu dem Schluss gekommen: Wenn es ihnen gelänge, sie zu schänden, würden die Götter sie nicht länger beachten, und Diana würde ihretwegen keine Kranken mehr heilen.


    **11:4** Sie führten diesen Plan aus. Die jungen Männer gingen auf den Berg, kamen wild wie Löwen zu der Höhle und klopften an die Tür.


    **11:5** Die heilige Märtyrerin Thekla vertraute auf den Gott, an den sie glaubte, und öffnete die Tür, obwohl sie schon vor ihrem Vorhaben gewarnt worden war. Sie fragte: »Junge Männer, was wollt ihr?«


    **11:6** Sie erwiderten: »Ist hier jemand namens Thekla?« Sie antwortete: »Was wollt ihr von ihr?« Sie sagten: »Wir wollen mit ihr schlafen.«


    **11:7** Die selige Thekla antwortete: »Ich bin zwar eine unbedeutende alte Frau, doch ich bin die Dienerin meines Herrn Jesus Christus. Obwohl ihr etwas Niederträchtiges gegen mich plant, werdet ihr es nicht vollbringen können.« Sie erwiderten: »Es ist unmöglich, dass wir mit dir nicht tun können, was immer wir wollen.«


    **11:8** Während sie dies sagten, packten sie Thekla mit Gewalt und wollten sie vergewaltigen. Da sagte sie mit größter Sanftmut zu ihnen: »Junge Männer, wartet und seht die Herrlichkeit des Herrn!«[b]


    **11:9** Während sie Thekla festhielten, blickte sie zum Himmel auf und sprach: »O höchst ehrwürdiger Gott, mit dem niemand zu vergleichen ist! Du erweist deine Herrlichkeit über deine Feinde. Du hast mich aus dem Feuer gerettet und mich weder Thamyris noch Alexander ausgeliefert. Du hast mich vor den wilden Tieren gerettet und mich in den tiefen Wassern bewahrt. Überall warst du mein Helfer und hast deinen Namen an mir verherrlicht.


    **11:10** Rette mich auch jetzt aus den Händen dieser bösen und unvernünftigen Männer. Lass nicht zu, dass sie meine Keuschheit schänden, die ich bis heute zu deiner Ehre bewahrt habe. Denn ich liebe dich, sehne mich nach dir und bete dich an, Vater, Sohn und Heiliger Geist, in Ewigkeit. Amen.«


    **11:11** Da kam eine Stimme vom Himmel: »Fürchte dich nicht, Thekla, meine treue Dienerin, denn ich bin bei dir. Schau hin und sieh den Ort, der für dich geöffnet worden ist. Dort wird deine ewige Wohnstätte sein; dort wirst du die selige Schau empfangen.«[c]


    **11:12** Die selige Thekla schaute hin und sah, dass sich der Fels weit genug geöffnet hatte, damit ein Mensch hineingehen konnte. Sie tat, wie ihr befohlen worden war, entkam mutig der niederträchtigen Schar und ging in den Fels hinein. Sofort schloss er sich so vollständig, dass an der Stelle, wo er sich geöffnet hatte, nicht einmal ein Spalt zu sehen war.


    **11:13** Die Männer standen völlig bestürzt über dieses gewaltige Wunder da und vermochten die Dienerin Gottes nicht festzuhalten. Sie konnten nur noch ihren Schleier oder ihre Kopfbedeckung ergreifen und rissen ein Stück davon ab.


    **11:14** Selbst dies geschah mit Gottes Erlaubnis: Es sollte den Glauben derer stärken, die kommen würden, um diesen ehrwürdigen Ort zu sehen, und den Menschen späterer Zeiten Segen vermitteln, wenn sie mit reinem Herzen an unseren Herrn Jesus Christus glaubten.


    **11:15** So erlitt Thekla ihr Leiden, die erste Märtyrerin, Apostelin Gottes und Jungfrau.[d] Mit achtzehn Jahren war sie aus Ikonion gekommen. Danach lebte sie zweiundsiebzig Jahre, teils auf Reisen und Wanderungen, teils in einem klösterlichen Leben in der Höhle. So war sie neunzig Jahre alt, als der Herr sie zu sich nahm.[e]


    **11:16** So endet ihr Leben.


    **11:17** Der Tag, der zu ihrem Gedächtnis heilig gehalten wird, ist der vierundzwanzigste September – zur Ehre des Vaters, des Sohnes und des Heiligen Geistes, jetzt und in Ewigkeit. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diana ist der römische Name der Göttin, die im griechischen Sprachraum gewöhnlich Artemis genannt wird. Der vorliegende englische Übersetzungszeuge hat „Diana“; eine direkte Prüfung der griechischen Lesart steht noch aus.
    reason: Kennzeichnet die Namensform des indirekten Übersetzungszeugen und vermeidet eine ungesicherte Rückübersetzung.
  - marker: b
    text: Der ältere englische Zeuge setzt „greatest“ („größter“) in Klammern. Die Übersetzung nimmt das Wort in den Satz auf; die griechische Grundlage muss noch geprüft werden.
    reason: Dokumentiert eine ausdrücklich markierte Unsicherheit des zugrunde liegenden Zeugen.
  - marker: c
    text: „Selige Schau“ gibt den Ausdruck „beatific vision“ des englischen Zeugen wieder, also die endgültige, glückselige Schau Gottes. Die genaue Formulierung der griechischen oder versionalen Grundlage ist noch zu prüfen.
    reason: Erläutert einen theologischen Fachausdruck, dessen unmittelbare Quellenform derzeit nicht vorliegt.
  - marker: d
    text: Die Bezeichnungen „erste Märtyrerin“ und „Apostelin Gottes“ sind Ehrentitel, die der überlieferte Text Thekla ausdrücklich gibt.
    reason: Verhindert, dass die Titel unbemerkt in spätere konfessionelle Amtsbegriffe eingeordnet werden.
  - marker: e
    text: 'Wörtlich nach dem englischen Zeugen: „als der Herr sie versetzte/entrückte“. Ob damit ihr Tod oder eine wunderbare Hinwegnahme bezeichnet wird, bleibt offen.'
    reason: Bewahrt die echte theologische und erzählerische Mehrdeutigkeit des Zeugen.
lexical_decisions:
- source_word: Diana
  choice: Diana
  rationale: Der Name der Göttin wird entsprechend dem vorliegenden englischen Zeugen beibehalten; in griechischem Kontext wäre Artemis zu erwarten, doch die direkte Prüfung der griechischen Überlieferung steht noch aus.
- source_word: debauch / violate
  choice: schänden
  rationale: Die Formulierung bezeichnet hier sexuelle Gewalt und den beabsichtigten Verlust der Keuschheit; „schänden“ bewahrt diese Bedeutung, ohne die Handlung zu beschönigen.
- source_word: lie with her
  choice: mit ihr schlafen
  rationale: Natürliche moderne Wiedergabe der direkten sexuellen Aussage; der gewaltsame Plan wird im Kontext und anschließend ausdrücklich als Vergewaltigungsabsicht benannt.
- source_word: ravished her
  choice: sie vergewaltigen
  rationale: Die explizite moderne Bezeichnung macht die im Zeugen eindeutig dargestellte sexuelle Gewalt unmissverständlich.
- source_word: mean old woman
  choice: unbedeutende alte Frau
  rationale: „Mean“ ist hier im älteren Sinn von niedrig oder gering zu verstehen, nicht als „gemein“ im heutigen Deutschen.
- source_word: translated her
  choice: sie zu sich nahm
  rationale: Bewahrt den ehrfürchtigen euphemistischen Sinn für Theklas Lebensende, ohne eine bestimmte Lehre über ihre leibliche Entrückung festzulegen.
- source_word: apostle of God
  choice: Apostelin Gottes
  rationale: Das feminine deutsche Substantiv gibt die ausdrückliche Ehrenbezeichnung des Zeugen für Thekla direkt wieder.
theological_decisions:
- issue: Anrufung von Vater, Sohn und Heiligem Geist
  choice: Die trinitarische Gebetsformel wird unverändert als Aussage des Textes wiedergegeben.
  alternative: Die Anrede syntaktisch umformen oder harmonisieren.
  rationale: Die ungewöhnliche Verbindung von singularischer Gottesanrede und dreigliedriger Formel soll nicht konfessionell geglättet werden.
- issue: Die „selige Schau“ in 11:11
  choice: „selige Schau“ mit erläuternder Fußnote
  alternative: „Anschauung Gottes“ oder „beseligende Gottesschau“
  rationale: Der überlieferte englische Zeuge enthält einen theologisch geprägten Ausdruck. Die Hauptfassung bleibt knapp und würdevoll; die Fußnote markiert die Bedeutung und die ausstehende Quellenprüfung.
- issue: Thekla als erste Märtyrerin und Apostelin
  choice: Die Titel werden formal bewahrt.
  alternative: Abschwächung zu „Zeugin“ oder „Botin“
  rationale: Die hagiografische Titulatur gehört ausdrücklich zum Text und darf nicht aufgrund späterer konfessioneller Amtsbegriffe umgedeutet werden.
- issue: Gottes Erlaubnis und Segensvermittlung durch den Ort beziehungsweise das Stoffstück
  choice: Die kausale Aussage des Zeugen wird beibehalten, ohne den Mechanismus näher festzulegen.
  alternative: Die Aussage symbolisch deuten oder abschwächen.
  rationale: Der Text verbindet das Geschehen mit Glaubensstärkung und Segen; seine sakrale Spannung soll erhalten bleiben.
- issue: Theklas Lebensende
  choice: „als der Herr sie zu sich nahm“
  alternative: „als der Herr sie entrückte“ oder „als sie starb“
  rationale: Der englische Zeuge lässt offen, ob ein gewöhnlicher Tod oder eine wunderbare Hinwegnahme gemeint ist. Die gewählte Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Direkte Rede ist natürlich formuliert, sexuelle Gewalt jedoch nicht euphemistisch verdeckt. Hagiografische Titel und liturgische Schlussformeln bleiben erhalten. Der Entwurf ist ausdrücklich vorläufig, weil nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die direkte Prüfung der griechischen sowie versionalen Handschriftentradition noch aussteht.
