base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: de
  text: 'Doch was sage ich dir da? Werden die Lebenden sterben? Wie können sie in einer Illusion leben? Die Reichen sind arm geworden, und Könige sind gestürzt worden. Alles ist dem Wandel unterworfen. Die Welt ist eine Illusion – sofern ich die Lage damit nicht übertreibe.


    Die Auferstehung dagegen ist nicht von dieser [a] Art, denn sie ist die Wirklichkeit, die fest bestehen bleibt. Sie ist die Offenbarung dessen, was existiert, ja die Verklärung der Dinge und ihre Verwandlung in das Neue. Denn die Unvergänglichkeit […] [wird herabkommen] auf das Vergängliche.[b] Das Licht wird auf die Finsternis herabströmen und sie verschlingen. Dann wird die Fülle den Mangel ausfüllen.[c] Dies sind Sinnbilder und Abbilder der Auferstehung. Das bewirkt das Gute.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die zuvor beschriebene illusionäre und vergängliche Art der Welt; die ergänzende Erläuterung steht im überlieferten englischen Zeugen in Klammern.
    reason: Macht die Bezugsrichtung deutlich, ohne die erläuternden Wörter unmarkiert in den Haupttext einzufügen.
  - marker: b
    text: Die Auslassungspunkte und eckigen Klammern kennzeichnen eine Lücke beziehungsweise eine editorische Ergänzung im zugrunde liegenden Zeugnis. Eine Prüfung am koptischen Text steht noch aus.
    reason: Bewahrt die Unsicherheit der Überlieferung und legt die Ergänzung »wird herabkommen« nicht als sicher erhaltenen Wortlaut aus.
  - marker: c
    text: »Fülle« und »Mangel« können hier über ihre gewöhnliche Bedeutung hinaus begrifflich geprägte Ausdrücke sein.
    reason: Weist auf möglichen terminologischen Gehalt hin, ohne eine bestimmte kosmologische Auslegung festzuschreiben.
  - marker: d
    text: Der knappe Schlusssatz kann auch in Richtung »Dies führt zum Guten« verstanden werden.
    reason: Dokumentiert die semantische Offenheit der Aussage über das Gute.
lexical_decisions:
- source_word: illusion
  choice: Illusion
  rationale: Bewahrt die begriffliche Spannung des Zeugnisses und vermeidet eine stärkere Deutung als bloßer »Schein« oder »Täuschung«.
- source_word: reality that remains firm
  choice: die Wirklichkeit, die fest bestehen bleibt
  rationale: Gibt sowohl den Wirklichkeitsanspruch als auch den bleibenden, unerschütterlichen Charakter wieder.
- source_word: transfiguration
  choice: Verklärung
  rationale: Ein würdiger und theologisch offener Ausdruck für eine verwandelnde Offenbarung, ohne sie auf bloße Veränderung zu reduzieren.
- source_word: imperishability
  choice: Unvergänglichkeit
  rationale: Entspricht der abstrakten Gegenüberstellung zum Vergänglichen und behält die kosmisch-theologische Sprache bei.
- source_word: Fullness
  choice: Fülle
  rationale: Bewahrt den möglicherweise technischen Sinn, ohne ihn durch eine konfessionelle oder systematische Erklärung festzulegen.
- source_word: Deficiency
  choice: Mangel
  rationale: Stellt den Gegensatz zur Fülle natürlich und zugleich begrifflich prägnant dar.
- source_word: symbols and images
  choice: Sinnbilder und Abbilder
  rationale: Unterscheidet zwei verwandte Bildbegriffe und erhält die doppelte Formulierung des Zeugnisses.
theological_decisions:
- issue: Verhältnis von gegenwärtigem Leben, Tod und Illusion
  choice: Die Fragen bleiben als paradoxe Fragen stehen.
  alternative: Die Aussagen als Behauptungen oder als Erklärung eines bloß uneigentlichen Lebens wiedergeben.
  rationale: Der Text stellt Leben, Tod und Illusion bewusst spannungsvoll nebeneinander; eine Auflösung würde seine Argumentation verengen.
- issue: Ontologischer Status der Auferstehung
  choice: Auferstehung wird als bleibende »Wirklichkeit« bezeichnet.
  alternative: »Wahrheit« oder »wahre Welt«
  rationale: »Wirklichkeit« folgt dem Zeugnis und vermeidet, den Satz ausschließlich erkenntnistheoretisch oder kosmologisch zu deuten.
- issue: Fülle und Mangel
  choice: Die Begriffe bleiben ohne dogmatische Erläuterung stehen.
  alternative: Explizite Identifikation mit Gott, Erlösung oder einer gnostischen Kosmologie.
  rationale: Der Ausschnitt erklärt die Begriffe nicht; eine nähere Identifikation würde zusätzliche Lehrannahmen importieren.
- issue: Schlusssatz
  choice: »Das bewirkt das Gute.«
  alternative: »Dies schafft gute Verhältnisse« oder »Darin besteht das Gute.«
  rationale: Die knappe kausative Aussage des Zeugnisses wird bewahrt, einschließlich ihrer echten Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener paradoxaler und kosmischer Bildsprache. Wegen der noch ausstehenden Prüfung des koptischen Ausgangstextes ist der Entwurf ausdrücklich vorläufig und eng am bereitgestellten gemeinfreien englischen Übersetzungszeugen ausgerichtet. Die Anrede »dir« folgt dem Singular des Zeugnisses; die grammatische Möglichkeit des Fragesatzes »Werden die Lebenden sterben?« bleibt erhalten.
