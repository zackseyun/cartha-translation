  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen auffällige Paradoxien, die Klammerzusätze sowie die offenen kosmologischen und soteriologischen Aussagen. Eine direkte Überprüfung am koptischen Text ist nach den Kontextangaben noch nicht möglich; die textkritischen Vorbehalte in den Anmerkungen bleiben daher erforderlich.
  naturalness: 'Einzelne Formulierungen sind im Deutschen unnötig holprig oder verschieben Nuancen: „Besteht ... zusammen mit dir?“ ist keine natürliche Wiedergabe von „exist with you“, und „das Geringere“ bedeutet nicht zuverlässig „what is worse“. Die Revision glättet nur diese Punkte, ohne die beabsichtigte Fremdheit der Vorlage – insbesondere „Nachgeburt des Körpers“ und „Was dir fehlt, ist ein Gewinn“ – zu harmonisieren.'
  terminology: „Fleisch“, „Äon“, „Nachgeburt“, „das All“ und „Heil“ sind angemessen und konsequent. „Das Schlechtere“ wahrt den wertenden Gegensatz der Vorlage genauer als „das Geringere“.
  issues:
  - severity: medium
    issue: „Das Geringere verfällt“ gibt „What is worse suffers decline“ nicht präzise wieder.
    rationale: „Geringere“ bezeichnet im Deutschen primär ein niedrigeres Maß oder eine kleinere Menge, nicht notwendig eine qualitative Verschlechterung. „Das Schlechtere“ entspricht dem englischen Zeugen und der vorhandenen Fußnote genauer.
  - severity: low
    issue: „Besteht nicht das, was dir gehört, zusammen mit dir?“ ist unidiomatisch.
    rationale: Die Formulierung wirkt im modernen Standarddeutsch semantisch unscharf. „Ist nicht auch das, was dir gehört, bei dir?“ gibt die Aussage des Zeugen natürlicher wieder, ohne sie inhaltlich zu deuten.
  - severity: low
    issue: Die Formulierung zur Gnade ist syntaktisch schwer verständlich.
    rationale: „Doch für es gibt es Gnade“ ist kein natürliches Deutsch. „Doch ihm wird Gnade zuteil“ bewahrt den Bezug auf das neutrale „das Schlechtere“ und lässt dessen genaue Bedeutung offen.
