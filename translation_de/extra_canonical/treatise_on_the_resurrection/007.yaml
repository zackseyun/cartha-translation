translation:
  language: de
  text: 'Zweifle daher niemals an der Auferstehung, mein Sohn Rheginos! Denn wenn du einst nicht im Fleisch lebtest, hast du Fleisch angenommen, als du in diese Welt kamst.


    Warum solltest du nicht Fleisch annehmen, wenn du [zurückkehrst und] in den Äon aufsteigst?[a] Was besser ist als das Fleisch, ist das, was Leben hervorbringt. Was um deinetwillen entstanden ist – gehört es nicht dir? Besteht nicht das, was dir gehört, zusammen mit dir? Doch solange du in dieser Welt bist: Was fehlt dir? Eben das hast du mit so großer Mühe herauszufinden versucht.


    Die Nachgeburt des Körpers ist das Alter, und du befindest dich im Zustand der Sterblichkeit.[b] Was dir fehlt, ist ein Gewinn; denn wenn du fortgehst, wirst du das Beste nicht verlieren. Das Geringere verfällt, doch für es gibt es Gnade.[c]


    So kann uns also nichts aus dieser Welt erlösen.[d] Wir jedoch sind das All; [darum] sind wir gerettet.[e] Vom Anfang bis zum Ende haben wir das Heil erlangt. So wollen wir denken. So wollen wir verstehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Zeuge setzt »return and« in Klammern. Da eine direkte Prüfung des koptischen Textes noch aussteht, stehen die betreffenden Wörter hier in eckigen Klammern. »Äon« kann ein Zeitalter, einen ewigen Bereich oder eine kosmologische Wirklichkeit bezeichnen.
    reason: Kennzeichnet die textliche Unsicherheit und bewahrt die semantische Weite des Fachbegriffs.
  - marker: b
    text: »Nachgeburt des Körpers« gibt ein ungewöhnliches Bild des englischen Zeugen wörtlich wieder. Gemeint sein könnte, dass das Alter als spätes Erzeugnis oder Nachstadium des Körpers erscheint; der genaue koptische Ausdruck muss noch geprüft werden.
    reason: Das auffällige Bild soll nicht durch eine interpretierende Glättung ersetzt werden.
  - marker: c
    text: 'Wörtlich nach dem Zeugen: »Das Schlechtere erleidet Verfall, aber es gibt Gnade für es.« Worauf sich die Gnade genau bezieht, bleibt unsicher.'
    reason: Bewahrt eine grammatische und theologische Mehrdeutigkeit.
  - marker: d
    text: Die Aussage, nichts könne »uns aus dieser Welt erlösen«, steht so im vorläufigen englischen Zeugen. Ihr Verhältnis zum folgenden Satz ist nicht eindeutig.
    reason: Verhindert eine vorschnelle Harmonisierung der argumentativen Spannung.
  - marker: e
    text: Der Zeuge setzt das folgernde »so« in Klammern. »Das All« kann hier ein technischer Ausdruck für die kosmische oder göttliche Gesamtheit sein.
    reason: Dokumentiert den Zusatzstatus des Bindeworts und die mögliche Fachbedeutung von »das All«.
lexical_decisions:
- source_word: flesh
  choice: Fleisch
  rationale: Bewahrt den körperlich-theologischen Leitbegriff und seine Spannung zum »Besseren«; »Leib« würde die Terminologie glätten.
- source_word: aeon
  choice: Äon
  rationale: Der traditionsgeschichtlich geprägte Begriff wird transliteriert, da »Zeitalter« oder »Ewigkeit« die mögliche kosmologische Bedeutung vorschnell festlegen würden.
- source_word: afterbirth
  choice: Nachgeburt
  rationale: Bewahrt das auffällige und möglicherweise metaphorische Bild des Zeugen, statt es als bloße Folge oder Endstadium zu erklären.
- source_word: the All
  choice: das All
  rationale: Erhält den möglicherweise technischen kosmologischen Ausdruck; »Alles« wäre idiomatischer, könnte aber den Begriffscharakter verdecken.
- source_word: salvation
  choice: das Heil
  rationale: Natürliches, würdevolles Deutsch; entspricht dem theologischen Sinn, ohne eine bestimmte konfessionelle Heilslehre einzutragen.
theological_decisions:
- issue: Annahme von Fleisch beim Aufstieg in den Äon
  choice: Die paradoxe Aussage wird unverändert als Frage wiedergegeben.
  alternative: Die Stelle als Wiedererlangung eines geistlichen oder verwandelten Leibes deuten.
  rationale: Der vorläufige Zeuge spricht ausdrücklich von »flesh«; die Spannung zur Auferstehung darf ohne koptische Prüfung nicht aufgelöst werden.
- issue: Identifikation der Glaubenden mit dem All
  choice: »Wir jedoch sind das All« wird formal bewahrt.
  alternative: »Wir gehören jedoch zum All« oder »Wir sind in der Fülle«.
  rationale: Die stärkere Identitätsaussage des Zeugen soll nicht durch eine theologisch weniger anstößige Zugehörigkeitsaussage ersetzt werden.
- issue: Gnade für das Verfallende
  choice: Das Pronomen wird als »für es« wiedergegeben und auf das Geringere bezogen.
  alternative: »doch darin ist Gnade« oder »doch dafür gibt es Gnade«.
  rationale: Die Referenz bleibt zwar ungewöhnlich, doch die vorliegende Satzstruktur legt den Bezug auf »what is worse« nahe; die Ambiguität wird in einer Fußnote angezeigt.
- issue: Rettung aus dieser Welt
  choice: Die Negation »nichts kann uns ... erlösen« bleibt bestehen.
  alternative: Den Satz im Sinn eines außerweltlichen Erlösers oder einer rhetorischen Frage umdeuten.
  rationale: Der unmittelbare Anschluss an »Wir jedoch sind das All« erzeugt eine echte Spannung, die nicht stillschweigend harmonisiert werden darf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede und bewusst bewahrten paradoxen Formulierungen. Wegen der noch ausstehenden Prüfung des koptischen Textes ist die Fassung ausdrücklich vorläufig und eng am bereitgestellten gemeinfreien englischen Zeugen orientiert. Runde Klammern des Zeugen wurden, wo textkritisch relevant, als eckige Klammern samt Fußnote dargestellt.
