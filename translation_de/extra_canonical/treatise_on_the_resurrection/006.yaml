id: TRES.006
reference: Treatise on the Resurrection — Chosen for Salvation
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: de
  text: Was die Geretteten gedacht haben, wird nicht vergehen. Der Sinn derer, die das Heil erkannt haben, wird nicht vergehen. Darum wurden wir zum Heil und zur Erlösung erwählt; denn von Anfang an war vorherbestimmt, dass wir nicht der Torheit der Unwissenden verfallen, sondern in die Weisheit derer eingehen würden, die die Wahrheit kennen. Die Wahrheit, die sie bewahren, kann tatsächlich nicht verloren gehen und wird nicht verloren gehen. Stark ist die Ordnung der Fülle. Schwach ist, was sich losriss und zur Welt wurde. Das All aber ist das, was bewahrt wird. Es ist nicht […] entstanden; es bestand bereits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen eine Lücke beziehungsweise eine unsichere Stelle in der handschriftlichen Überlieferung. Diese Fassung beruht vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugen; eine unmittelbare Prüfung des koptischen Textes steht noch aus.
    reason: Kennzeichnet die Textunsicherheit und die begrenzte Quellenbasis des Entwurfs transparent.
lexical_decisions:
- source_word: those who are saved
  choice: die Geretteten
  rationale: Gibt den passivischen Heilsstatus knapp und natürlich wieder, ohne den Handelnden näher zu bestimmen.
- source_word: mind
  choice: Sinn
  rationale: Bewahrt die mögliche Bedeutung von Denkvermögen, innerer Ausrichtung oder Bewusstsein besser als das engere „Verstand“; die Einzahl des Zeugnisses bleibt erhalten.
- source_word: salvation and redemption
  choice: Heil und Erlösung
  rationale: Verwendet geläufige, voneinander unterscheidbare religiöse Begriffe und ebnet die Doppelung nicht ein.
- source_word: predetermined
  choice: vorherbestimmt
  rationale: Entspricht der zeitlich-logischen Aussage, ohne eine bestimmte konfessionelle Prädestinationslehre einzutragen.
- source_word: enter into the wisdom
  choice: in die Weisheit … eingehen
  rationale: Bewahrt die räumlich-dynamische Metapher des Zeugnisses statt sie zu bloßem Wissen abzuschwächen.
- source_word: system of the Fullness
  choice: Ordnung der Fülle
  rationale: „Ordnung“ ist im Deutschen verständlich und kann sowohl eine strukturierte Gesamtheit als auch eine kosmologische Ordnung bezeichnen; „Fülle“ wahrt den möglichen terminologischen Charakter.
- source_word: broke loose
  choice: sich losriss
  rationale: Erhält das Bild einer Trennung oder Absonderung, ohne deren Ursache oder metaphysischen Vorgang genauer festzulegen.
- source_word: the All
  choice: das All
  rationale: Bewahrt den substantivierten kosmologischen Ausdruck und unterscheidet ihn von „Fülle“.
- source_word: already existed
  choice: bestand bereits
  rationale: Drückt Präexistenz idiomatisch aus, ohne eine genauere Ontologie zu behaupten.
theological_decisions:
- issue: Erwählung und Vorherbestimmung
  choice: „wurden wir … erwählt“ und „war vorherbestimmt“
  alternative: 'Freier: „waren wir … bestimmt“'
  rationale: Die zwei Aussagen des Zeugnisses bleiben unterscheidbar; es wird weder eine konfessionelle Prädestinationslehre erläutert noch die Spannung abgeschwächt.
- issue: Erkenntnis des Heils
  choice: „die das Heil erkannt haben“
  alternative: „die Erkenntnis erlangt haben“
  rationale: Die Ergänzung „salvation“ des Zeugnisses wird transparent in den Satz aufgenommen, ohne „Erkenntnis“ zu einem technischen Erlösungsweg zu erklären.
- issue: Fülle, Welt und All
  choice: Die drei Ausdrücke bleiben terminologisch getrennt
  alternative: Sie unter einem Begriff wie „Ganzheit“ zusammenzuführen
  rationale: Der Text stellt ihre Beziehungen spannungsvoll dar; eine Gleichsetzung oder systematische Deutung wäre sachlich nicht gesichert.
- issue: Entstehung des Alls
  choice: „Es ist nicht […] entstanden; es bestand bereits“
  alternative: Die Lücke durch eine vermutete Negation oder nähere Bestimmung zu schließen
  rationale: Die überlieferte Beschädigung bleibt sichtbar; zugleich folgt die Übersetzung der im englischen Zeugen bezeugten Satzgestalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst leicht gehobenem Ton. Kosmologische Schlüsselbegriffe wie „Fülle“ und „das All“ bleiben erkennbar. Die Syntax wurde geglättet, ohne Wiederholungen, Gegensätze oder metaphysische Mehrdeutigkeiten zu beseitigen.
