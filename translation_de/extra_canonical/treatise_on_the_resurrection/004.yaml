review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen im Wesentlichen zuverlässig. Eine unmittelbare koptische Kontrolle ist nach den Angaben noch nicht möglich. Einzelne Formulierungen weichen jedoch unnötig ab: „ja“ gibt „in fact/truly“ nicht präzise wieder, „Solange“ ersetzt das konditionale „if“, und „verbunden“ deutet das schlichtere „continue with him“ stärker aus. Die Markierung der überlieferten Lücke soll im Text erkennbar bleiben.'
  naturalness: Die Licht- und Untergangsbilder sind in modernem Standarddeutsch gut verständlich. „Diese Welt wie ein Gewand tragen“ ist als bewusst fremdartige, aber transparente Metapher vertretbar. Die revidierte Fassung glättet nur dort, wo dies ohne Bedeutungsverlust möglich ist.
  terminology: „Apostel“, „Himmel“, „geistliche Auferstehung“, „Seele“ und „Fleisch“ sind registergerecht und bewahren die theologisch auffällige, nicht weiter erklärte Aussage. „Geistliche“ sollte hier beibehalten werden; es ist nicht auf eine konfessionelle Auslegung festzulegen.
  issues:
  - severity: low
    issue: „ja“ für „in fact/truly“
    rationale: „Dann sagte der Apostel ja“ klingt im Deutschen gesprächssprachlich und kann bestätigendes „ja“ statt einer Bekräftigung der Aussage meinen. „tatsächlich“ ist genauer.
  - severity: medium
    issue: „Solange wir ... leben“ für „If we visibly live“
    rationale: „Solange“ macht aus der Bedingung eine zeitliche Begrenzung. „Wenn“ bewahrt die konditionale Form des Zeugen.
  - severity: low
    issue: „bleiben mit ihm verbunden“ für „we continue with him“
    rationale: „verbunden“ fügt eine abstrakte Beziehungsdeutung hinzu. „bleiben bei ihm“ ist näher am Wortlaut und im Kontext natürlich.
  - severity: low
    issue: Lacuna nur durch Fußnotenmarker angezeigt
    rationale: Da der englische Zeuge ausdrücklich leere Klammern als Textlücke führt, sollte die Lücke auch im deutschen Lesetext durch „[]“ sichtbar bleiben; der Fußnotenanker erläutert sie.
  revised_text: 'Dann sagte der Apostel tatsächlich: „Wir haben mit ihm gelitten, sind mit ihm auferstanden und mit ihm zum Himmel aufgefahren.“ Wenn wir sichtbar in dieser Welt leben, tragen wir diese Welt wie ein Gewand. Wir sind seine leuchtenden Strahlen und bleiben bei ihm bis zu unserem Untergang, das heißt bis zu unserem Tod in diesem Leben. Durch ihn werden wir zum Himmel emporgezogen, wie Strahlen von der Sonne, durch nichts gehindert. Das ist die geistliche Auferstehung, [a] die die Seele ebenso verschlingt wie das Fleisch.'
  revised_footnotes:
  - marker: a
    text: An dieser Stelle weist die Textüberlieferung eine nicht wiederhergestellte Lücke auf.
    reason: Die leeren eckigen Klammern des zugrunde liegenden englischen Zeugen kennzeichnen eine beschädigte oder fehlende Passage. Der Marker erläutert die im Text beibehaltene Lücke.
  revision_rationale: Die Revision stellt die konditionale Aussage, die Bekräftigung durch den Apostel und das schlichtere Verbleiben „mit/bei ihm“ genauer wieder. Sie erhält alle auffälligen Bilder und die Spannung der Aussage über Seele und Fleisch. Die sichtbare Lückenmarkierung wahrt den provisorischen Charakter des englischen Zeugen, ohne den fehlenden Text zu ergänzen.
