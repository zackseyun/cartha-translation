id: TRES.004
reference: Treatise on the Resurrection — The Spiritual Resurrection
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: de
  text: 'Dann sagte der Apostel ja: „Wir haben mit ihm gelitten, sind mit ihm auferstanden und mit ihm zum Himmel aufgefahren.“ Solange wir nun sichtbar in dieser Welt leben, tragen wir diese Welt wie ein Gewand. Wir sind seine leuchtenden Strahlen und bleiben mit ihm verbunden bis zu unserem Untergang, das heißt bis zu unserem Tod in diesem Leben. Durch ihn werden wir zum Himmel emporgezogen, wie Strahlen von der Sonne, durch nichts gehindert. Das ist die geistliche Auferstehung, [a] die die Seele ebenso verschlingt wie das Fleisch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An dieser Stelle weist die Textüberlieferung eine nicht wiederhergestellte Lücke auf.
    reason: Die leeren eckigen Klammern des zugrunde liegenden englischen Zeugen kennzeichnen offenbar eine beschädigte oder fehlende Passage; ein deutscher Fußnotenmarker macht dies publikationsgerecht sichtbar.
lexical_decisions:
- source_word: we wear this world
  choice: wir tragen diese Welt wie ein Gewand
  rationale: Die Kleidungsmetapher von „wear“ wird ausdrücklich bewahrt und zugleich in natürlichem Deutsch verständlich gemacht.
- source_word: radiant beams
  choice: leuchtende Strahlen
  rationale: Bewahrt das Bild von Lichtstrahlen und vermeidet das weniger natürliche „strahlende Strahlen“.
- source_word: until our setting
  choice: bis zu unserem Untergang
  rationale: Erhält das Sonnenbild des Untergehens, dessen Bedeutung der Text selbst als Tod erklärt.
- source_word: drawn to heaven
  choice: zum Himmel emporgezogen
  rationale: Gibt sowohl die Richtung als auch das passive Gezogenwerden wieder.
- source_word: spiritual resurrection
  choice: geistliche Auferstehung
  rationale: „Geistlich“ bezeichnet hier die auf den Geist bezogene Wirklichkeit und lässt die Spannung zur Auferstehung des Fleisches bestehen.
- source_word: swallowing up
  choice: verschlingt
  rationale: Bewahrt die starke, auffällige Metapher, statt sie deutend abzuschwächen.
theological_decisions:
- issue: Bereits verwirklichte Mitauferstehung und Himmelfahrt
  choice: 'Perfektformen: „haben ... gelitten, sind ... auferstanden ... aufgefahren“'
  alternative: Präteritum oder futurische Deutung
  rationale: Der Zeuge stellt die Teilhabe als bereits geschehen dar; diese Spannung zu einer künftigen Auferstehung wird nicht aufgelöst.
- issue: Beziehung zwischen geistlicher Auferstehung, Seele und Fleisch
  choice: „die die Seele ebenso verschlingt wie das Fleisch“
  alternative: Die geistliche Auferstehung nur auf die Seele beziehen oder „verschlingt“ erklärend umdeuten
  rationale: Die ungewöhnliche Parallelität des Zeugen wird beibehalten, ohne eine systematische Lehre daraus abzuleiten.
- issue: Identität der Strahlen und ihre Verbindung mit Christus
  choice: „Wir sind seine leuchtenden Strahlen und bleiben mit ihm verbunden“
  alternative: „Wir strahlen sein Licht aus“
  rationale: Die direkte Bildaussage wird erhalten; „verbunden“ gibt das fortdauernde Verhältnis wieder, ohne physische Nähe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Licht-, Gewand- und Verschlingungsmetaphorik. Der Entwurf beruht vorläufig auf dem gemeinfreien englischen Übersetzungszeugen; eine direkte Prüfung des koptischen Textes steht noch aus.
