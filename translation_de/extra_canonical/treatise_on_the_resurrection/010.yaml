  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/010.yaml
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing with others. Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
translation:
  language: de
  text: 'Darum, Rheginos, denke nicht in Teilwahrheiten und lebe nicht nach diesem Fleisch, nur um mit anderen übereinzustimmen. Fliehe vielmehr Spaltungen und Bindungen, dann wirst du die Auferstehung schon jetzt erfahren. Denn wenn das Sterbliche weiß, dass es sterben wird, gelangt es zu diesem Punkt, auch wenn es viele Jahre in diesem Leben verbringt: Warum solltest du dich nicht als einen betrachten, der auferstanden und ans Ziel gelangt ist?


    Wenn du die Auferstehung besitzt, warum handelst du dann weiterhin so, als müsstest du noch sterben? Du sollst wissen, dass du bereits gestorben bist. Weil es dir an Einübung fehlt, erkennst du das nicht. Es ist angemessen, dass jeder sich auf verschiedene Weise einübt. Dann werden sie von diesem Element[a] befreit werden, damit sie nicht dem Irrtum verfallen, sondern wieder empfangen, was von Anfang an da war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung von „diesem Element“ ist unklar. Gemeint sein könnte ein Bestandteil der gegenwärtigen Existenz, doch der Ausdruck wird hier bewusst nicht näher bestimmt. Eine Prüfung am koptischen Text steht noch aus.
    reason: Der englische Zeuge bewahrt eine mehrdeutige Wendung; eine eindeutige sachliche oder theologische Identifikation wäre derzeit nicht quellenmäßig abgesichert.
lexical_decisions:
- source_word: partial (truths)
  choice: Teilwahrheiten
  rationale: Bewahrt die Aussage des englischen Zeugen, dass Rheginos nicht in vereinzelten oder unvollständigen Wahrheiten denken soll, ohne den noch nicht geprüften koptischen Ausdruck weiter festzulegen.
- source_word: according to this flesh
  choice: nach diesem Fleisch
  rationale: Die ungewöhnliche, möglicherweise theologisch gewichtige Formulierung wird bewusst nah am Zeugen wiedergegeben.
- source_word: bondages
  choice: Bindungen
  rationale: Deckt sowohl Abhängigkeiten als auch Formen der Knechtschaft ab, ohne die Art der Bindung vorschnell zu bestimmen.
- source_word: experience the resurrection now
  choice: die Auferstehung schon jetzt erfahren
  rationale: Gibt den gegenwärtigen Erfahrungsaspekt klar und natürlich wieder.
- source_word: having arrived
  choice: ans Ziel gelangt
  rationale: Macht die im Englischen elliptische Zielvorstellung im Deutschen verständlich, ohne ein konkretes Ziel dogmatisch zu benennen.
- source_word: lack of training / train
  choice: Mangel an Einübung / sich einüben
  rationale: Erhält den Zusammenhang beider Vorkommen und bezeichnet eine geistige oder praktische Schulung, ohne sie auf bloßes Wissen zu reduzieren.
- source_word: this element
  choice: diesem Element
  rationale: Die auffällige und sachlich unbestimmte Wendung bleibt erhalten, da eine direkte Prüfung des koptischen Textes noch aussteht.
- source_word: what was from the beginning
  choice: was von Anfang an da war
  rationale: Bewahrt die zeitliche und ursprüngliche Dimension, ohne das Gemeinte näher zu identifizieren.
theological_decisions:
- issue: Auferstehung als gegenwärtiger Besitz oder Erfahrung
  choice: Die Aussagen über das gegenwärtige Erfahren und Besitzen der Auferstehung werden unmittelbar beibehalten.
  alternative: Die Auferstehung ausschließlich als zukünftiges Ereignis umdeuten.
  rationale: Der Zeuge stellt die gegenwärtige Erfahrung ausdrücklich heraus; diese Spannung zu zukünftigen Auferstehungsvorstellungen darf nicht eingeebnet werden.
- issue: Aussage, der Angesprochene sei bereits gestorben
  choice: „dass du bereits gestorben bist“
  alternative: Metaphorisch ausdeuten, etwa „der Welt abgestorben“ oder „mit Christus gestorben“.
  rationale: Der vorliegende Wortlaut nennt weder die Welt noch Christus; eine solche Ergänzung würde eine bestimmte theologische Deutung importieren.
- issue: Befreiung von „diesem Element“
  choice: Der Referent bleibt unbestimmt und wird in einer Fußnote als textlich deutungsoffen markiert.
  alternative: „Element“ ausdrücklich als Körper, materielle Welt oder kosmische Macht bestimmen.
  rationale: Die englische Ausgangsbasis löst die Mehrdeutigkeit nicht auf, und die koptische Quellenprüfung steht noch aus.
- issue: Wiederempfang des Anfänglichen
  choice: „wieder empfangen, was von Anfang an da war“
  alternative: Das Gemeinte als ursprüngliche Natur, Erkenntnis oder Erlösung konkretisieren.
  rationale: Der Text benennt den Gegenstand nicht; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Wegen der noch ausstehenden Prüfung des koptischen Textes ist die Fassung ausdrücklich vorläufig und eng am gemeinfreien englischen Übersetzungszeugen orientiert. Ungewöhnliche Schlüsselwendungen und theologische Spannungen wurden nicht harmonisiert.
