review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng. Da keine direkte koptische Prüfung vorliegt, bleiben insbesondere „Teilwahrheiten“ und „diesem Element“ als vorläufige, mehrdeutigkeitserhaltende Wiedergaben zu behandeln. Die explizit gegenwärtige Erfahrung bzw. der Besitz der Auferstehung sowie die Aussage des bereits erfolgten Todes werden ohne dogmatische Harmonisierung bewahrt.
  naturalness: Das Deutsch ist überwiegend klar und würdig. „dich als einen betrachten, der auferstanden und ans Ziel gelangt ist“ ist jedoch unnötig umständlich. Außerdem führt „Dann werden sie“ eine nicht ausgedrückte zeitlich-konsekutive Nuance ein; die Verbindung sollte schlicht koordinierend wiedergegeben werden.
  terminology: „Rheginos“, „Auferstehung“, „Fleisch“, „Bindungen“, „Einübung“ und „Element“ sind konsistent. „ans Ziel gelangt“ bleibt als vorsichtige Auslegung von „having arrived“ vertretbar, sofern kein konkretes Ziel benannt wird.
  issues:
  - severity: low
    issue: Unnatürliche Konstruktion bei „consider yourself as risen and having arrived“
    rationale: Die Relativsatzkonstruktion „als einen betrachten, der ... ist“ klingt schwerfällig. „Dich als auferstanden und ans Ziel gelangt ansehen“ ist idiomatischer und erhält die prädikative Doppelung.
  - severity: low
    issue: Zusätzliche Folgerungsnuance durch „Dann“
    rationale: Der Zeuge verbindet Schulung und Befreiung mit „and“. „Dann“ macht daraus stärker eine zeitliche Folge. „und sie werden“ bleibt näher am gegebenen Wortlaut.
  - severity: low
    issue: „was von Anfang an da war“ ist leicht paraphrasierend
    rationale: „was von Anfang an war“ gibt die knappe Formulierung des Zeugen unmittelbarer wieder und bewahrt ihre Offenheit.
  revised_text: 'Darum, Rheginos, denke nicht in Teilwahrheiten und lebe nicht nach diesem Fleisch, nur um mit anderen übereinzustimmen. Fliehe vielmehr Spaltungen und Bindungen, dann wirst du die Auferstehung schon jetzt erfahren. Denn wenn das Sterbliche weiß, dass es sterben wird, gelangt es zu diesem Punkt, auch wenn es viele Jahre in diesem Leben verbringt: Warum solltest du dich nicht als auferstanden und ans Ziel gelangt ansehen?


    Wenn du die Auferstehung hast, warum handelst du dann weiterhin so, als müsstest du noch sterben? Du sollst wissen, dass du bereits gestorben bist. Weil es dir an Einübung fehlt, erkennst du das nicht. Es ist angemessen, dass jeder sich auf verschiedene Weise einübt, und sie werden von diesem Element[a] befreit werden, damit sie nicht dem Irrtum verfallen, sondern wieder empfangen, was von Anfang an war.'
  revised_footnotes:
