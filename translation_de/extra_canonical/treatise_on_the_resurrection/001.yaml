review_pass:
  verdict: revise
  source_fidelity: 'Die Prüfung erfolgt vorläufig gegen den bereitgestellten englischen öffentlichen Zeugen, da eine unmittelbare Prüfung des Koptischen ausdrücklich noch aussteht. Der Entwurf bewahrt die Satzfolge, die Anrede, die eckigen Klammern, das „Wort der Wahrheit“, die Unterscheidung zwischen Glauben und „Finden“ sowie die offen gehaltene Aussage zur Auferstehung gut. Eine kleine Korrektur ist nötig: „wahre Erfüllung“ deutet das wiederholte satisfaction stärker um als der Zeuge nahelegt und stimmt nicht mit der eigenen Fußnote überein.'
  naturalness: Die Fassung ist überwiegend natürliches, modernes Standarddeutsch und wahrt einen brieflich-lehrhaften Ton. „Manche möchten vieles erfahren“ und „Lasst uns nun über das Thema sprechen“ sind idiomatisch. Die parenthetische Wiedergabe bei „(wahre Befriedigung)“ bildet die editorische Klammerung des Zeugen transparent ab; die Fußnote erklärt sie ohne den Lesetext unnötig zu belasten.
  terminology: „Wort der Wahrheit“, „Retter“, „Herr Christus“, „Ruhe“ und „Auferstehung“ sind angemessen und nicht konfessionell verengt. „Befriedigung“ bewahrt die Wiederaufnahme von satisfaction und damit den Kontrast zwischen eigener und durch Christus empfangener Befriedigung. „Verständnis“ für das geklammerte interpretation bleibt vertretbar; die Alternative „Auslegung“ wird erläutert.
  issues:
  - severity: medium
    issue: „wahre Erfüllung“ für das parenthetische „(true satisfaction)“
    rationale: Die Wiedergabe entfernt sich vom wiederholten Begriff satisfaction/Befriedigung und glättet den im Zeugen erkennbaren Gegensatz interpretierend. Zudem bezeichnet Fußnote a selbst „(wahre Befriedigung)“ als nähere Wiedergabe. Der Lesetext sollte daher ebenfalls „(wahre Befriedigung)“ haben.
  - severity: low
    issue: Fußnote a beschreibt die Klammerung als „textkritisch unsicher“
    rationale: Auf Grundlage des vorliegenden Materials lässt sich sicher nur sagen, dass die Worte im englischen Zeugen in Klammern stehen und damit als editorische Ergänzung bzw. Verdeutlichung markiert sind. Eine weitergehende textkritische Bewertung ohne koptische Prüfung wäre zu stark.
  revised_text: '[] Mein Sohn Rheginos, manche möchten vieles erfahren. Das ist ihr Ziel, wenn sie sich eingehend mit Fragen beschäftigen, auf die ihnen die Antworten fehlen. Wenn sie damit Erfolg haben, neigen sie dazu, sich selbst für recht bedeutend zu halten. Ich jedoch glaube nicht, dass sie zum Wort der Wahrheit gelangt sind. Vielmehr suchen sie ihre eigene Befriedigung, während wir durch unseren Retter, unseren Herrn Christus, (wahre Befriedigung) empfangen haben.[a] [] Wir erlangten sie, als wir die Wahrheit erkannten und in ihr Ruhe fanden.



