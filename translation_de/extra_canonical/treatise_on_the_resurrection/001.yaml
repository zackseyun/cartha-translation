    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
translation:
  language: de
  text: '[] Mein Sohn Rheginos, manche möchten vieles erfahren. Das ist ihr Ziel, wenn sie sich eingehend mit Fragen beschäftigen, auf die ihnen die Antworten fehlen. Wenn sie damit Erfolg haben, neigen sie dazu, sich selbst für recht bedeutend zu halten. Ich jedoch glaube nicht, dass sie zum Wort der Wahrheit gelangt sind. Vielmehr suchen sie ihre eigene Befriedigung, während wir durch unseren Retter, unseren Herrn Christus, wahre Erfüllung empfangen haben.[a] [] Wir erlangten sie, als wir die Wahrheit erkannten und in ihr Ruhe fanden.


    Da du jedoch höflich darum bittest zu erfahren, welches das richtige Verständnis der Auferstehung ist,[b] schreibe ich dir das Wesentliche. Viele schenken ihr gewiss keinen Glauben. Einige wenige aber finden sie.[c] Lasst uns nun über das Thema sprechen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise nach dem englischen Zeugen: »während wir (wahre Befriedigung) durch unseren Retter, unseren Herrn Christus, empfangen haben«. Die in Klammern gesetzte Verdeutlichung ist textkritisch unsicher.'
    reason: Kennzeichnet die im zugrunde liegenden englischen Zeugen ergänzte Formulierung und verhindert, dass sie als sicherer Wortlaut erscheint.
  - marker: b
    text: 'Auch möglich: »wie die Auferstehung richtig auszulegen ist«.'
    reason: Bewahrt die Bedeutungsbreite des im englischen Zeugen geklammerten »interpretation«.
  - marker: c
    text: Der Text sagt auffällig, dass einige wenige die Auferstehung »finden«, nicht lediglich, dass sie an sie glauben.
    reason: Hebt eine echte begriffliche und theologische Spannung hervor, ohne sie aufzulösen.
lexical_decisions:
- source_word: word of truth
  choice: Wort der Wahrheit
  rationale: Bewahrt die mögliche Bedeutungsspannung zwischen wahrer Lehre, wahrer Aussage und einem theologisch verstandenen »Wort«, ohne sie einzuengen.
- source_word: satisfaction
  choice: Befriedigung / wahre Erfüllung
  rationale: Die erste Stelle bezeichnet selbstbezogene Befriedigung; die zweite, im Zeugen ergänzte beziehungsweise verdeutlichte Stelle wird kontextgerecht als »wahre Erfüllung« wiedergegeben. Die Fußnote weist auf die textliche Unsicherheit hin.
- source_word: repose
  choice: Ruhe
  rationale: Das schlichte »Ruhe« erhält sowohl den existenziellen als auch den möglicherweise heilsgeschichtlichen Sinn.
- source_word: interpretation
  choice: Verständnis
  rationale: Natürliches modernes Deutsch; lässt offen, ob Auslegung, Auffassung oder sachlich richtiges Begreifen gemeint ist.
- source_word: resurrection
  choice: Auferstehung
  rationale: Etablierter und sachlich offener deutscher Ausdruck.
- source_word: find it
  choice: finden sie
  rationale: Bewahrt die auffällige Aussage und ihren möglichen Gegensatz zu bloßem Glauben, statt sie als »erkennen« oder »erlangen« auszulegen.
theological_decisions:
- issue: Art der durch Christus empfangenen »satisfaction«
  choice: wahre Erfüllung
  alternative: Befriedigung
  rationale: Der positive Gegensatz zur selbstbezogenen Befriedigung wird verständlich gemacht, aber wegen der ergänzenden Klammerung im englischen Zeugen durch eine Fußnote als unsicher gekennzeichnet.
- issue: »Wort der Wahrheit«
  choice: Wörtlich und mehrdeutig beibehalten
  alternative: wahre Lehre
  rationale: Die Formulierung kann Lehre, Botschaft oder einen stärker personhaft-theologischen Sinn tragen; die Übersetzung entscheidet dies nicht.
- issue: Die Auferstehung »finden«
  choice: Ungewöhnliche Formulierung beibehalten
  alternative: an sie glauben / sie erkennen
  rationale: Der Text unterscheidet ausdrücklich zwischen Glauben und Finden. Diese theologische Spannung darf nicht eingeebnet werden.
- issue: Richtiges Verständnis der Auferstehung
  choice: »welches das richtige Verständnis ... ist«
  alternative: »wie die Auferstehung richtig auszulegen ist«
  rationale: »Verständnis« lässt offen, ob eine Deutung, Lehre oder Wesensbestimmung der Auferstehung erfragt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit brieflichem und lehrhaftem Ton. Die eckigen Klammern [] des überlieferten Zeugen bleiben als Signale für Textlücken oder Wiederherstellungen stehen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich quellennahe und vorläufig; unklare Ergänzungen und mögliche Alternativen werden in Fußnoten kenntlich gemacht.
