id: TRES.003
reference: Treatise on the Resurrection — The Savior Swallowed Up Death
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: de
  text: 'Ich weiß, dass ich [] die Antwort in einer komplexen Sprache gebe.[a] Doch am Wort der Wahrheit ist nichts schwer zu verstehen. Die Antwort erschien jedoch, damit nichts verborgen bliebe, sondern alles über das Seiende offenbar würde. Das Ergebnis war einerseits die Auslöschung des Bösen und andererseits die Offenbarung der Erwählten. All dies ist das Ausströmen von Wahrheit und Geist; die Gnade kommt aus der Wahrheit.


    Man hält dich nicht für unwissend darüber, dass der Retter den Tod verschlungen hat, denn er beseitigte die vergängliche Welt. Er verwandelte [sie] in einen unvergänglichen Äon[b] und richtete sich selbst auf. Dabei verschlang er das Sichtbare durch das Unsichtbare und bahnte uns so den Weg zu unserer Unsterblichkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Leerstelle [] kennzeichnet eine beschädigte oder fehlende Stelle im Manuskript beziehungsweise in der überlieferten Textgrundlage.
    reason: Die unbestimmte Lücke darf nicht stillschweigend ergänzt werden.
  - marker: b
    text: „Äon“ kann je nach Zusammenhang ein Zeitalter oder einen überweltlichen, unvergänglichen Seinsbereich bezeichnen.
    reason: Der mehrdeutige Fachbegriff soll nicht auf nur eine Bedeutung verengt werden.
lexical_decisions:
- source_word: word of truth
  choice: Wort der Wahrheit
  rationale: Bewahrt die prägnante, möglicherweise technische Wendung des Zeugnisses, ohne sie erklärend einzuengen.
- source_word: existence
  choice: das Seiende
  rationale: Gibt den ontologischen Sinn natürlicher wieder als das abstrakte „Existenz“, wobei wegen der noch ausstehenden koptischen Prüfung Zurückhaltung geboten ist.
- source_word: emanation
  choice: Ausströmen
  rationale: Bewahrt die Bewegung des Hervorgehens und vermeidet zugleich, durch das Fremdwort „Emanation“ vorschnell ein festes Lehrsystem vorauszusetzen.
- source_word: dispensed with
  choice: beseitigte
  rationale: Entspricht dem Zusammenhang der Überwindung der vergänglichen Welt, ohne eine genauere Art ihrer Aufhebung zu behaupten.
- source_word: aeon
  choice: Äon
  rationale: Der Fachbegriff bleibt erhalten, da er sowohl ein Zeitalter als auch einen überweltlichen Seinsbereich bezeichnen kann.
- source_word: raised himself up
  choice: richtete sich selbst auf
  rationale: Erhält das Reflexivpronomen und die mögliche Spannung zwischen Auferstehen, Erheben und Sich-Aufrichten.
- source_word: swallowing up
  choice: verschlang
  rationale: Bewahrt das starke Bild der vollständigen Überwindung, das zunächst auf den Tod und danach auf das Sichtbare angewandt wird.
theological_decisions:
- issue: Verwandlung der vergänglichen Welt
  choice: „Er verwandelte [sie] in einen unvergänglichen Äon“
  alternative: „Er verwandelte sich in einen unvergänglichen Äon“
  rationale: Das ergänzte Pronomen wird als Rückbezug auf „die vergängliche Welt“ wiedergegeben; die eckigen Klammern halten sichtbar, dass der Text an dieser Stelle beschädigt oder ergänzt ist.
- issue: Selbsterhebung des Retters
  choice: „richtete sich selbst auf“
  alternative: „erstand auf“ oder „wurde auferweckt“
  rationale: Die Formulierung wahrt die im englischen Zeugen vorhandene Selbstbezüglichkeit und legt den Satz weder eindeutig auf aktive Auferstehung noch auf passives Auferwecktwerden fest.
- issue: Verhältnis von Wahrheit, Geist und Gnade
  choice: „All dies ist das Ausströmen von Wahrheit und Geist; die Gnade kommt aus der Wahrheit.“
  alternative: „All dies geht aus Wahrheit und Geist hervor, wobei die Gnade aus der Wahrheit stammt.“
  rationale: Die knappe Reihung bleibt bestehen, ohne die genaue metaphysische Beziehung zwischen Wahrheit, Geist und Gnade systematisch auszudeuten.
- issue: Das Sichtbare und das Unsichtbare
  choice: „das Sichtbare durch das Unsichtbare“
  alternative: „das Sichtbare im Unsichtbaren“
  rationale: Die instrumentale Beziehung des vorliegenden Zeugnisses wird bewahrt; ihre genaue kosmologische Bedeutung bleibt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter begrifflicher Dichte. Die Fassung ist vorläufig, da nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die direkte Prüfung des koptischen Textes noch aussteht. Eckige Klammern im Haupttext markieren eine Lücke beziehungsweise editorische Ergänzung; runde Erklärungsklammern des englischen Zeugnisses wurden, soweit möglich, in flüssige deutsche Syntax überführt.
