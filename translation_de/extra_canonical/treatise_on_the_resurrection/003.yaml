    issue: „Ausströmen“ für „emanation“
    rationale: Die Wiedergabe ist möglich, klingt hier aber unidiomatisch und kann den Begriff auf ein rein bildhaftes Hervorfließen verengen. „Emanation“ ist im modernen wissenschaftlich-religiösen Deutsch verständlich genug und gibt den englischen Zeugen genauer wieder.
  revised_text: 'Ich weiß, dass ich [] die Antwort in einer komplexen Sprache gebe.[a] Doch am Wort der Wahrheit ist nichts schwer zu verstehen. Die Antwort erschien jedoch, damit nichts verborgen bliebe, sondern alles über das Seiende offenbar würde. Das Ergebnis war einerseits die Auslöschung des Bösen und andererseits die Offenbarung der Erwählten. All dies ist die Emanation von Wahrheit und Geist; die Gnade kommt aus der Wahrheit.



