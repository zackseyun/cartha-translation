  naturalness: Das Deutsch ist überwiegend klar, modern und dem anspruchsvollen Register angemessen. „Ausströmen von Wahrheit und Geist“ ist jedoch als Prädikatsnomen schwerfällig und gegenüber dem ausdrücklich überlieferten Begriff „emanation“ weniger präzise. „Emanation“ ist im Deutschen ein etabliertes Fachwort und wahrt die begriffliche Offenheit besser.
  terminology: „Äon“ ist zutreffend beibehalten und sinnvoll erläutert. „Emanation“ sollte ebenfalls als offener, möglicher Fachbegriff stehen bleiben, statt durch „Ausströmen“ semantisch auf einen bloßen Vorgang reduziert zu werden.
  issues:
