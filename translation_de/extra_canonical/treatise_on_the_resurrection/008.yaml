id: TRES.008
reference: Treatise on the Resurrection — The Resurrection is Real
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  text: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
