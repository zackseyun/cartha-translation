review_pass:
  verdict: revise
  source_fidelity: 'Die Prüfung erfolgt aufgrund des bereitgestellten englischen öffentlichen Zeugen; eine unmittelbare koptische Kontrolle steht nach den Metadaten noch aus. Der Entwurf folgt dem Zeugen insgesamt eng und bewahrt die Ellipse sowie die unsichere/ausgefallene Stelle. Der letzte Vergleichssatz ist jedoch unvollständig: Die abschließende Prädikation, dass die Auferstehung ein „Schein“ sei, fehlt. Dadurch wird der Gegensatz des Satzes nicht vollständig wiedergegeben.'
  naturalness: Weitgehend modernes, würdiges Standarddeutsch. „Schein“ ist im Kontext als Gegenbegriff zu „Wirklichkeit“ gut verständlich und stilistisch stimmig. Der vervollständigte Schlusssatz wird mit „zu behaupten, dass … ein Schein sei“ idiomatisch und klar.
  terminology: „Auferstehung“, „Offenbarung“, „Glieder“, „Herr“, „Retter“ und „Jesus Christus“ sind konsistent und ohne konfessionelle Zusatzdeutung wiedergegeben. Die Reihenfolge „Elija … Mose“ bleibt wie im Zeugen erhalten. Die ambivalente Aussage über die lebendigen Glieder wird nicht anthropologisch präzisiert.
  issues:
  - severity: high
    issue: Unvollständiger letzter Vergleichssatz
    rationale: Der Entwurf endet nach „als die Auferstehung, die durch unseren Herrn, den Retter Jesus Christus, geschehen ist.“ Der englische Zeuge schließt hingegen mit der Aussage, es sei weniger zutreffend, die so geschehene Auferstehung einen Schein zu nennen. Die fehlende Ergänzung verändert die Satzstruktur und lässt die Aussage unvollständig.
  revised_text: 'Es gibt jedoch einige, die im Verlauf ihrer Nachforschungen verstehen möchten, ob jemand, der gerettet wird, unmittelbar gerettet sein wird, sobald er den Körper ablegt. Daran soll niemand zweifeln. […]. Tatsächlich werden die sichtbaren Glieder, die tot sind, [a] nicht gerettet werden; denn dann würden die lebendigen [Glieder], die in ihnen vorhanden sind, auferstehen.


    Was also ist die Auferstehung? Sie ist die fortdauernde Offenbarung derer, die auferstanden sind. Denn wenn ihr euch daran erinnert, im Evangelium gelesen zu haben, dass Elija erschien und Mose mit ihm, dann haltet die Auferstehung nicht für einen Schein. Sie ist kein Schein, sondern Wirklichkeit! Tatsächlich wäre es zutreffender, die Welt einen Schein zu nennen, als zu behaupten, dass die Auferstehung, die durch unseren Herrn, den Retter Jesus Christus, geschehen ist, ein Schein sei.'
  revised_footnotes:
  - marker: a
    text: An dieser Stelle weist die Vorlage eine Textlücke oder ein unsicheres Überlieferungsstück auf.
    reason: Der leere Klammerhinweis des englischen Zeugen wird als textkritisches Signal bewahrt und für Leser verständlich gemacht.
  revision_rationale: Eine sichere, notwendige Ergänzung stellt den im Zeugen vorhandenen Abschluss des letzten Vergleichssatzes wieder her. Im Übrigen bleiben die textkritischen Markierungen, die ungewöhnliche Gegenüberstellung der Glieder und die theologische Offenheit des Zeugen unverändert erhalten.
