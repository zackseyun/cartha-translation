    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: de
  text: 'Es gibt jedoch einige, die im Verlauf ihrer Nachforschungen verstehen möchten, ob jemand, der gerettet wird, unmittelbar gerettet sein wird, sobald er den Körper ablegt. Daran soll niemand zweifeln. […]. Tatsächlich werden die sichtbaren Glieder, die tot sind, [a] nicht gerettet werden; denn dann würden die lebendigen [Glieder], die in ihnen vorhanden sind, auferstehen.


    Was also ist die Auferstehung? Sie ist die fortdauernde Offenbarung derer, die auferstanden sind. Denn wenn ihr euch daran erinnert, im Evangelium gelesen zu haben, dass Elija erschien und Mose mit ihm, dann haltet die Auferstehung nicht für einen Schein. Sie ist kein Schein, sondern Wirklichkeit! Tatsächlich wäre es zutreffender, die Welt einen Schein zu nennen, als die Auferstehung, die durch unseren Herrn, den Retter Jesus Christus, geschehen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An dieser Stelle weist die Vorlage eine Textlücke oder ein unsicheres Überlieferungsstück auf.
    reason: Der leere Klammerhinweis des englischen Zeugen wird als textkritisches Signal bewahrt und für Leser verständlich gemacht.
lexical_decisions:
- source_word: discarding the body
  choice: den Körper ablegt
  rationale: Bewahrt das Bild des Ablegens, ohne die Aussage durch stärker deutende Begriffe wie »verlassen« oder »sterben« festzulegen.
- source_word: limbs
  choice: Glieder
  rationale: Gibt den körperlichen Ausdruck wieder und lässt zugleich die im Satz angelegte Gegenüberstellung sichtbarer und lebendiger Glieder bestehen.
- source_word: continuing revelation
  choice: fortdauernde Offenbarung
  rationale: Bewahrt sowohl den durativen Sinn als auch den Begriff des Offenbarwerdens.
- source_word: illusion
  choice: Schein
  rationale: Natürliches, würdiges Deutsch; bezeichnet einen bloßen Anschein, ohne eine moderne psychologische Bedeutung von »Illusion« aufzudrängen.
- source_word: reality
  choice: Wirklichkeit
  rationale: Bildet den klaren Gegensatz zu »Schein« und erhält die emphatische Aussage.
- source_word: has come to pass through
  choice: durch … geschehen ist
  rationale: Bewahrt die instrumentale bzw. vermittelnde Wendung, ohne genauer festzulegen, auf welche Weise Christus die Auferstehung bewirkt hat.
theological_decisions:
- issue: Zeitpunkt der Rettung nach dem Ablegen des Körpers
  choice: Die Frage und die anschließende Gewissheit werden ohne zusätzliche Erklärung wiedergegeben.
  alternative: Die Stelle ausdrücklich als sofortige Rettung der Seele nach dem Tod deuten.
  rationale: Der beschädigte Kontext erlaubt keine sichere systematische Festlegung; die Spannung zwischen Rettung, Körper und Auferstehung bleibt erhalten.
- issue: Bedeutung der »lebendigen Glieder« in den toten sichtbaren Gliedern
  choice: Die ungewöhnliche Gegenüberstellung wird wörtlich bewahrt.
  alternative: »Seele«, »geistlicher Leib« oder »innerer Mensch« einsetzen.
  rationale: Solche Präzisierungen würden eine bestimmte anthropologische Lehre in den Text eintragen, die der vorliegende Zeuge nicht ausdrücklich nennt.
- issue: Auferstehung als »fortdauernde Offenbarung«
  choice: Die Formulierung bleibt offen und wird nicht als bloße Erinnerung, Vision oder zukünftiges Ereignis erklärt.
  alternative: Die Auferstehung ausschließlich futurisch oder ausschließlich gegenwärtig-spirituell auslegen.
  rationale: Der Text verbindet Auferstandensein, fortdauerndes Offenbarwerden und evangelische Erscheinung; diese theologische Spannung soll sichtbar bleiben.
- issue: Elija und Mose im Evangelium
  choice: Die überlieferte Reihenfolge Elija, dann Mose wird beibehalten.
  alternative: An die geläufigere neutestamentliche Reihenfolge »Mose und Elija« angleichen.
  rationale: Die Reihenfolge des vorliegenden Textzeugen wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zur Vorlage. Die Anrede wechselt entsprechend dem Zeugen von unpersönlichem »niemand« zu pluralischem »ihr«. Ellipse und ergänzte eckige Klammern bleiben als Überlieferungssignale sichtbar. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich als quellennahe Arbeitsübersetzung auf Grundlage des angegebenen gemeinfreien englischen Zeugen zu verstehen.
