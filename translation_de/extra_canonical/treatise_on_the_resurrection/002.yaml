review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt eng. Eine sichere Korrektur ist bei „structure“ nötig: „Gestalt“ legt eine körperliche Form fest, während „Struktur“ die bewusst offen gehaltene kosmologische bzw. ontologische Aussage wahrt. „nahm beides in sich auf“ ist zudem keine natürliche und eindeutige Wiedergabe von „took both to himself“.'
  naturalness: Der Registerton ist überwiegend modernes, würdiges Standarddeutsch. Mit „nahm beides an“ und einer leicht gestrafften Wortstellung wird der Text idiomatischer, ohne seine eigentümliche Argumentation zu glätten.
  terminology: „im Fleisch“, „Sohn Gottes“, „Menschensohn“, „Menschlichkeit und Göttlichkeit“, „Fülle“, „Herrschaftsmächte“ und „Gottheiten“ sind angemessen. „Fülle“ bleibt als möglicher Fachausdruck durch die Anmerkung kenntlich. Die Parenthese zu „(untere) Struktur“ muss als vorläufige, im englischen Zeugen markierte Ergänzung erkennbar bleiben.
  issues:
  - severity: medium
    issue: „Gestalt“ für „structure“
    rationale: „Gestalt“ verengt „structure“ auf äußere oder personale Form. Der Zeuge verwendet einen abstrakten, mehrdeutigen Ausdruck; „Struktur“ bewahrt diese Offenheit besser und stimmt mit der Fußnote überein.
  - severity: low
    issue: „nahm beides in sich auf“
    rationale: Die Formulierung ist im Deutschen ungewohnt und kann ein Aufnehmen bzw. Integrieren statt der Aneignung von Menschlichkeit und Göttlichkeit nahelegen. „nahm beides an“ ist natürlich und bleibt ohne dogmatische Ausdeutung.
  - severity: low
    issue: „seine (niedere) Gestalt“ trotz unklarer Bezugsweite
    rationale: Neben der Bedeutungsverengung durch „Gestalt“ sollte die parenthetisch markierte Bestimmung des Zeugen mit einer möglichst neutralen deutschen Entsprechung wiedergegeben und erläutert werden.
  revised_text: Wie predigte der Herr, als er im Fleisch lebte und nachdem er sich als Sohn Gottes offenbart hatte? Er wohnte an diesem Ort, an dem ihr wohnt, und sprach über das Gesetz der natürlichen Dinge, das ich jedoch »Tod« nenne. Rheginos, der Sohn Gottes war der Menschensohn. Er nahm beides an und hatte Menschlichkeit und Göttlichkeit. So konnte er einerseits als Sohn Gottes den Tod verbannen und brachte andererseits als Menschensohn die Wiederherstellung der Fülle[a]. Das war so, weil sein Ursprung von oben war, als Same der Wahrheit, bevor seine (untere) Struktur[b] entstand. In dieser (unteren) Struktur entstanden viele Herrschaftsmächte und Gottheiten.
  revised_footnotes:
  - marker: a
    text: »Fülle« kann hier ein umfassendes göttliches Ganzes bezeichnen; der genaue koptische Ausdruck muss noch am Quelltext geprüft werden.
    reason: Der zugrunde liegende öffentliche englische Zeuge verwendet den traditionsgeschichtlich gewichtigen Ausdruck »Fullness«; eine direkte Prüfung des Koptischen steht aus.
  - marker: b
    text: Wörtlich nach dem englischen Zeugen etwa »(untere) Struktur«. »Struktur« ist hier bewusst mehrdeutig; die in Klammern stehende Bestimmung »untere« entspricht einer im Zeugen als Ergänzung markierten Angabe. Die Lesart ist vorläufig.
    reason: Der englische Ausdruck »structure« und seine Bezugsweite sind nicht näher festgelegt. Die Ergänzung »lower« darf nicht als gesicherter Wortlaut ausgegeben werden.
  revision_rationale: Die Revision ersetzt die semantisch zu enge Wiedergabe „Gestalt“ durch „Struktur“, verbessert eine unidiomatische Formulierung und erhält die auffällige, nicht harmonisierte Christologie sowie die kosmologische Mehrdeutigkeit des Zeugen. Da die direkte koptische Prüfung noch aussteht, bleiben die problematischen Ausdrücke transparent als vorläufige Zeugenwiedergaben markiert.
