base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: de
  text: Wie predigte der Herr, als er im Fleisch lebte und nachdem er sich als Sohn Gottes offenbart hatte? Er wohnte an diesem Ort, an dem ihr wohnt, und sprach über das Gesetz der natürlichen Dinge, das ich jedoch »Tod« nenne. Rheginos, der Sohn Gottes war der Menschensohn. Er nahm beides in sich auf und besaß Menschlichkeit und Göttlichkeit. So konnte er einerseits als Sohn Gottes den Tod vertreiben und brachte andererseits als Menschensohn die Wiederherstellung der Fülle[a]. Denn sein Ursprung war von oben, als Same der Wahrheit, bevor seine (niedere) Gestalt[b] ins Dasein kam. In dieser (niederen Gestalt) entstanden viele Herrschaftsmächte und Gottheiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Fülle« kann hier ein umfassendes göttliches Ganzes bezeichnen; der genaue koptische Ausdruck muss noch am Quelltext geprüft werden.
    reason: Der zugrunde liegende öffentliche englische Zeuge verwendet den traditionsgeschichtlich gewichtigen Ausdruck »Fullness«; direkte Prüfung des Koptischen steht aus.
  - marker: b
    text: Wörtlich nach dem englischen Zeugen etwa »(niedere) Struktur«; gemeint sein könnte seine Gestalt, Verfassung oder Hervorbringung auf einer unteren Ebene. Die Lesart ist vorläufig.
    reason: »structure« ist mehrdeutig, und die ausdrücklich als Ergänzung markierte Bestimmung »lower« darf nicht als gesicherter Wortlaut ausgegeben werden.
lexical_decisions:
- source_word: lived in the flesh
  choice: im Fleisch lebte
  rationale: Bewahrt die körperbezogene Ausdrucksweise des Zeugen und ihren theologischen Gehalt, ohne sie erklärend aufzulösen.
- source_word: law of natural things
  choice: Gesetz der natürlichen Dinge
  rationale: Formnahe Wiedergabe der ungewöhnlichen Wendung; eine Deutung als bloßes Naturgesetz würde die mögliche antike Begriffsspannung verengen.
- source_word: took both to himself
  choice: nahm beides in sich auf
  rationale: Bezieht »beides« transparent auf Menschlichkeit und Göttlichkeit, ohne eine spätere dogmatische Formel einzutragen.
- source_word: Fullness
  choice: Fülle
  rationale: Gibt den traditionsgeschichtlich aufgeladenen Ausdruck würdig und verständlich wieder; die Großschreibung des englischen Zeugen wird im Deutschen nicht künstlich nachgebildet.
- source_word: dominions
  choice: Herrschaftsmächte
  rationale: Lässt erkennen, dass personale oder kosmische Mächte gemeint sein können, statt nur abstrakte Herrschaftsbereiche zu bezeichnen.
- source_word: divinities
  choice: Gottheiten
  rationale: Bewahrt den Plural und die vom Text behauptete Vielzahl göttlicher Wesen, ohne sie mit »Göttern« oder »Engeln« näher festzulegen.
theological_decisions:
- issue: Verhältnis von Sohn Gottes und Menschensohn
  choice: »der Sohn Gottes war der Menschensohn« sowie »Menschlichkeit und Göttlichkeit«
  alternative: Eine harmonisierende Formulierung wie »wahrer Gott und wahrer Mensch«
  rationale: Die eigentümliche Argumentation des Textes bleibt erhalten und wird nicht durch eine spätere konfessionelle Formel ersetzt.
- issue: Wiederherstellung der Fülle
  choice: Genitivverbindung ohne nähere Erklärung
  alternative: »Wiederherstellung zur Fülle« oder eine kosmologische Ausdeutung
  rationale: Der englische Zeuge lässt Art und Ziel der Wiederherstellung offen; diese Spannung bleibt bestehen.
- issue: Ursprung von oben vor der niederen Gestalt
  choice: Zeitliche und ontologische Aussage möglichst direkt bewahrt
  alternative: Deutung als Präexistenzlehre in festgelegter dogmatischer Sprache
  rationale: Der Text wird nicht über seine eigene Ausdrucksweise hinaus systematisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Die ungewöhnliche Kosmologie und ihre Spannungen werden nicht geglättet. Der Entwurf beruht vorläufig auf dem angegebenen gemeinfreien englischen Übersetzungszeugen; eine direkte Prüfung des koptischen Textes von Nag Hammadi Codex I,4 steht noch aus.
