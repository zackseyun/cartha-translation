review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Textzeugen im Wesentlichen, verschiebt aber zwei Aussagen: „der in dieser Welt lebt“ ergänzt zu „the philosopher who is in this world“ ein nicht bezeugtes „lebt“, und „Er hat den Tod ausgelöscht“ macht aus der prädikativen, absichtlich ungewöhnlichen Aussage „He became the obliteration of death“ eine aktive Handlung. Die Wiederherstellungsmarkierung bei ‹groß› ist korrekt erhalten.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Die Satzverbindung „sodass wenigstens sie auferstehen werden“ ist verständlich, klingt jedoch im Deutschen etwas schwerfällig. „Er wurde zur Auslöschung des Todes“ wahrt die Quelle, bleibt aber bewusst markant; diese Markiertheit entspricht dem Zeugen.
  terminology: „Menschensohn“, „Glaube“ und „Glaubenden“ sind angemessen und konsistent. „Beweisführung“ ist als Wiedergabe von „argumentation“ vertretbar, wenn auch enger als „Argumentation“; im gegebenen Glaubenskontrast ist es nicht sinnentstellend. Die Formulierung zur Selbst-Rückkehr sollte die doppelte Selbstbezüglichkeit ausdrücklich bewahren, ohne eine Rechtfertigungslehre festzulegen.
  issues:
  - severity: medium
    issue: „der in dieser Welt lebt“ ergänzt ein Verb
    rationale: Der Zeuge sagt lediglich „the philosopher who is in this world“. „lebt“ ist zwar naheliegend, aber nicht erforderlich und schwächt die wiederholte, möglicherweise gewichtete Orts-/Weltformulierung ab.
  - severity: high
    issue: Aktive Umformung von „He became the obliteration of death“
    rationale: „Er hat den Tod ausgelöscht“ ersetzt das Werden zur „Auslöschung/Vernichtung des Todes“ durch eine abgeschlossene aktive Tat. Damit gehen Prädikation und ungewöhnliche Bildsprache des Textzeugen verloren.
  - severity: low
    issue: Selbstbezüglichkeit der Rückkehr kann expliziter sein
    rationale: „er bringe sich selbst ... zurück“ gibt den Sinn wieder, aber „dass er selbst ... zurückkehre“ macht das im Zeugen hervorgehobene „by himself“ klarer und bewahrt die Satzstruktur besser.
  revised_text: 'Wenn jedoch einige nicht glauben, dann deshalb, weil sie sich nicht überzeugen lassen können. Denn, mein Sohn, dass die Toten auferstehen werden, gehört zum Glauben und nicht zur Beweisführung.


    Unter den Philosophen in dieser Welt gibt es einige, die glauben, sodass wenigstens sie auferstehen werden. Der Philosoph, der in dieser Welt ist, soll sich aber nicht im Recht glauben, wenn er meint, dass er selbst aus dem Tod zum Leben zurückkehrt. Denn aufgrund unseres Glaubens kennen wir den Menschensohn, und wir glauben, dass er von den Toten auferstanden ist. Von ihm bekennen wir: »Er wurde zur Auslöschung des Todes.« Denn groß ist der Glaube, und ‹groß› sind die Glaubenden.[a]'
