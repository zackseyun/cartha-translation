  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: de
  text: 'Wenn jedoch einige nicht glauben, dann deshalb, weil sie sich nicht überzeugen lassen können. Denn, mein Sohn, dass die Toten auferstehen werden, ist eine Sache des Glaubens und nicht der Beweisführung.


    Unter den Philosophen dieser Welt gibt es einige, die glauben, sodass wenigstens sie auferstehen werden. Der Philosoph, der in dieser Welt lebt, soll sich aber nicht aufgrund seines Glaubens für gerechtfertigt halten, wenn er meint, er bringe sich selbst aus dem Tod ins Leben zurück. Denn aufgrund unseres Glaubens kennen wir den Menschensohn, und wir glauben, dass er von den Toten auferstanden ist. Von ihm bekennen wir: »Er hat den Tod ausgelöscht.« Denn groß ist der Glaube, und ‹groß› sind die Glaubenden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zweite »groß« ist im zugrunde gelegten englischen Textzeugen als ergänzte Wiederherstellung gekennzeichnet. Eine unmittelbare Prüfung am koptischen Text steht noch aus.
    reason: Kennzeichnet die im Zeugen durch Winkelklammern ausgewiesene editorische Ergänzung und den vorläufigen Quellenstatus.
lexical_decisions:
- source_word: cannot be convinced
  choice: sich nicht überzeugen lassen können
  rationale: Bewahrt die passive Bedeutung des englischen Zeugen und vermeidet die stärkere Aussage, sie seien grundsätzlich unfähig, etwas zu verstehen.
- source_word: argumentation
  choice: Beweisführung
  rationale: Gibt den Gegensatz zu Glauben in würdigem, gegenwärtigem Deutsch wieder, ohne vernünftiges Nachdenken allgemein abzuwerten.
- source_word: feel justified
  choice: sich ... für gerechtfertigt halten
  rationale: Erhält die mögliche forensisch-theologische Färbung von »justified«, ohne sie eindeutig festzulegen.
- source_word: returns himself (to life from death) by himself
  choice: er bringe sich selbst aus dem Tod ins Leben zurück
  rationale: Macht die im Zeugen durch Klammern erläuterte Bewegungsrichtung natürlich verständlich und erhält die betonte Selbstverursachung.
- source_word: obliteration of death
  choice: den Tod ausgelöscht
  rationale: Formuliert die ungewöhnliche Prädikation im Deutschen idiomatisch als wirksame Beseitigung des Todes.
- source_word: belief / those who believe
  choice: Glaube / die Glaubenden
  rationale: Bewahrt die Wortverwandtschaft und den feierlichen Schluss, ohne unnötig zwischen subjektivem Glauben und Glaubensinhalt zu unterscheiden.
theological_decisions:
- issue: Verhältnis von Glauben und Beweisführung
  choice: »eine Sache des Glaubens und nicht der Beweisführung«
  alternative: »gehört zum Glauben und nicht zur Diskussion«
  rationale: Die Übersetzung erhält den Gegensatz, behauptet aber nicht, die Auferstehung sei irrational oder dürfe nicht erörtert werden.
- issue: Auferstehung der glaubenden Philosophen
  choice: »sodass wenigstens sie auferstehen werden«
  alternative: »damit wenigstens sie auferstehen«
  rationale: Der Zeuge lässt einen konsekutiven oder finalen Zusammenhang zu. Die gewählte Fassung folgt seiner Oberflächenstruktur, ohne eine umfassende Lehre über die Auferstehung anderer Menschen einzutragen.
- issue: Selbstrechtfertigung und Selbstauferweckung
  choice: Der Philosoph soll sich nicht für gerechtfertigt halten, wenn er meint, sich selbst ins Leben zurückzubringen.
  alternative: Der Philosoph soll seinen Glauben nicht damit rechtfertigen, dass er aus eigener Kraft zurückkehrt.
  rationale: Die syntaktische und theologische Spannung des Zeugen bleibt sichtbar; es wird weder eine bestimmte Rechtfertigungslehre noch eine philosophische Selbsterlösungssystematik ergänzt.
- issue: Titel »Son of Man«
  choice: Menschensohn
  alternative: Sohn des Menschen
  rationale: »Menschensohn« ist die natürliche, traditionsübergreifend verständliche deutsche Wiedergabe des christologischen Titels.
- issue: Wiederherstellung von »great«
  choice: ‹groß› mit Fußnote
  alternative: unmarkiertes »groß« oder Auslassung
  rationale: Die Konjektur des englischen Textzeugen wird transparent bewahrt, da eine direkte Prüfung des koptischen Textes noch aussteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen argumentativen Sätzen. Die Anrede »mein Sohn« und der feierliche Bekenntnissatz bleiben erhalten. Der Entwurf beruht vorläufig auf dem angegebenen gemeinfreien englischen Zeugen; eine direkte koptische Quellenprüfung steht noch aus.
