    reason: Kennzeichnet die im Zeugen durch Winkelklammern ausgewiesene editorische Ergänzung und den vorläufigen Quellenstatus.
  revision_rationale: Die Revision entfernt die unbezeugte Ergänzung „lebt“, bewahrt die Wiederholung von „in dieser Welt“ und stellt die prädikative Form von „became the obliteration of death“ wieder her. Die doppelte Selbstbezüglichkeit der behaupteten Rückkehr wird klarer ausgedrückt. Die überlieferte Ergänzungsmarkierung samt Fußnote bleibt unverändert erhalten. Da die unmittelbare koptische Prüfung aussteht, werden die Eigenheiten und Ambiguitäten des englischen Textzeugen nicht harmonisiert.
