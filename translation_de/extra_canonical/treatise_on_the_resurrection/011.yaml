review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorliegenden englischen Zeugen im Wesentlichen. Einige editorische Signale des Zeugen werden jedoch nicht vollständig bewahrt: Die leere eckige Klammer nach „my“ und die eingeklammerte Ergänzung „[I have]“ sollten im deutschen Text sichtbar bleiben. Zudem ist „Friede sei mit ihnen“ gegenüber „Peace be to them“ leicht verschoben; „Friede sei ihnen“ ist genauer.'
  naturalness: Der Ton ist überwiegend würdig und modernes Standarddeutsch. „Seid ... nicht besorgt“ ist verständlich, aber „Macht euch ... keine Sorgen“ ist idiomatischer. „Ich sende euch Grüße“ entspricht dem brieflichen Gestus der Vorlage besser als „Ich grüße euch“.
  terminology: „Güte“, „Wort“, „Brüder und Schwestern“ sowie „Auferstehung“ sind angemessen und bewahren die theologische Offenheit. Die Textlücke darf nicht spekulativ ergänzt werden.
  issues:
  - severity: medium
    issue: Die leere Textlücke der Vorlage nach „meines“ ist im Haupttext nicht als „[]“ erhalten.
    rationale: Der Marker „[a]“ verweist zwar auf eine Fußnote, ersetzt aber nicht das im englischen Zeugen ausdrücklich überlieferte Zeichen für die Lacuna.
  - severity: medium
    issue: Die eckig gekennzeichnete Ergänzung „[I have]“ wird nicht im deutschen Haupttext markiert.
    rationale: Da die Grundlage nur der englische Zeuge ist und eine direkte koptische Prüfung aussteht, sollte dessen Unsicherheit nicht stillschweigend als gesicherter Text erscheinen.
  - severity: low
    issue: „Friede sei mit ihnen“ fügt gegenüber „Peace be to them“ eine Präposition hinzu.
    rationale: „Friede sei ihnen“ gibt die knappe Segensformel der Vorlage unmittelbarer wieder.
  - severity: low
    issue: „Ich grüße euch“ ist gegenüber „I send greetings“ leicht weniger konkret.
    rationale: „Ich sende euch Grüße“ bewahrt die epistoläre Formulierung und bleibt natürlich.
  revised_text: 'Aus der Güte meines [] Herrn Jesus Christus habe ich all dies empfangen.[a] Über diese Dinge [habe ich] euch und eure [Brüder und Schwestern] unterwiesen, meine Kinder, ohne etwas zu vernachlässigen, was euch stärken könnte. Sollte jedoch in meiner Erklärung des Wortes etwas von dem, was ich geschrieben habe, unklar sein, werde ich es euch erklären, wenn ihr danach fragt.


    Macht euch nun aber keine Sorgen, dies mit jemandem unter euch zu teilen, denn es kann hilfreich sein.[b]


    Viele gehen den Fragen nach, über die ich euch geschrieben habe. Ihnen sage ich: Friede sei ihnen und Gnade.


    Ich sende euch und allen, die euch geschwisterlich lieben, Grüße.


    Die Abhandlung über die Auferstehung'
