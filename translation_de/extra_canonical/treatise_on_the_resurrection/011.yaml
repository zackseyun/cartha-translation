translation:
  language: de
  text: 'Aus der Güte meines [a] Herrn Jesus Christus habe ich dies alles empfangen. Über diese Dinge habe ich euch und eure [Brüder und Schwestern] unterwiesen, meine Kinder, und dabei nichts ausgelassen, was euch stärken könnte. Sollte jedoch in meiner Darlegung des Wortes etwas, das ich geschrieben habe, unklar sein, werde ich es euch erklären, wenn ihr danach fragt.


    Seid nun aber nicht besorgt, dies mit jemandem aus eurer Mitte zu teilen, denn es kann hilfreich sein.[b]


    Viele gehen den Fragen nach, über die ich euch geschrieben habe. Ihnen sage ich: Friede sei mit ihnen und Gnade.


    Ich grüße euch und alle, die euch in geschwisterlicher Liebe lieben.


    Die Abhandlung über die Auferstehung'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Vorlage zeigt an dieser Stelle nach „meines“ eine Textlücke; eine Ergänzung ist auf Grundlage des vorliegenden englischen Zeugen nicht sicher möglich.
    reason: Kennzeichnet Manuskriptschaden beziehungsweise eine nicht rekonstruierte Stelle.
  - marker: b
    text: Der Satz ist im vorliegenden Übersetzungszeugen mehrdeutig beziehungsweise ungewöhnlich formuliert. Er kann bedeuten, dass die Adressaten das Geschriebene ohne Sorge innerhalb ihrer Gemeinschaft weitergeben sollen, weil es hilfreich sein kann.
    reason: Bewahrt die Unsicherheit der Aussage, bis eine direkte Prüfung des koptischen Textes möglich ist.
lexical_decisions:
- source_word: graciousness
  choice: Güte
  rationale: Gibt die wohlwollende Gnade des Herrn in natürlichem, würdigem Deutsch wieder, ohne den Begriff unnötig dogmatisch einzuengen.
- source_word: obtained
  choice: empfangen
  rationale: Passt im Deutschen besser zu einer Gabe aus der Güte Christi als das mechanischere „erlangt“.
- source_word: my children
  choice: meine Kinder
  rationale: Bewahrt die familiäre Anrede und den fürsorglichen Ton des Verfassers.
- source_word: explanation of the word
  choice: Darlegung des Wortes
  rationale: Erhält die mögliche religiöse Bedeutung von „Wort“, ohne festzulegen, ob eine einzelne Aussage, Lehre oder Botschaft gemeint ist.
- source_word: brothers and sisters
  choice: Brüder und Schwestern / geschwisterliche Liebe
  rationale: Gibt die inklusive familiäre Gemeinschaftsbezeichnung idiomatisch wieder.
- source_word: Treatise on the Resurrection
  choice: Die Abhandlung über die Auferstehung
  rationale: Sachgerechter und etablierter deutscher Werktitel.
theological_decisions:
- issue: Bezug von „the word“
  choice: das Wort
  alternative: die Lehre / meine Ausführungen
  rationale: Die wörtlichere Form bewahrt die semantische und mögliche theologische Offenheit des Ausdrucks.
- issue: Ergänzung nach „my“ vor „Lord“
  choice: Textlücke durch Fußnotenmarker sichtbar gemacht
  alternative: eine vermutete Ergänzung in den Haupttext einsetzen
  rationale: Da die Vorlage eine Lücke signalisiert und keine koptische Prüfung vorliegt, wird keine unbelegte Rekonstruktion vorgenommen.
- issue: Aufforderung zur Weitergabe
  choice: nicht als Verbot, sondern als Aufforderung, dabei unbesorgt zu sein
  alternative: „Teilt dies mit niemandem“
  rationale: Folgt der syntaktischen Aussage des englischen Zeugen und bewahrt zugleich dessen etwas schwierigen Zusammenhang mit „denn es kann hilfreich sein“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit brieflichem und seelsorgerlichem Ton. Eckige Klammern aus dem Zeugen werden als Überlieferungs- oder Ergänzungssignale berücksichtigt. Moderne Webseitenbestandteile wie FAQ, Kontaktdaten und Werbung sind nicht Teil des antiken Werkes und wurden ausgeschlossen. Der Entwurf bleibt wegen ausstehender direkter Prüfung des koptischen Textes vorläufig.
