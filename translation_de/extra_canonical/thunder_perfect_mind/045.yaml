base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: de
  text: 'Griechen und Barbaren[a],


    ich bin die, deren Bild in Ägypten groß[b] ist,


    und die, die unter den Barbaren kein Bild hat.


    Ich bin die, die sie überall hassten[c],


    und die, die sie liebten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Barbaren“ bezeichnet in der antiken Gegenüberstellung Menschen, die keine Griechen sind; das Wort ist hier nicht im heutigen Sinn von „brutale Menschen“ gemeint.
    reason: historical_context
  - marker: b
    text: 'Oder: „vielfältig“ beziehungsweise „zahlreich“. Das koptische Wort kann Größe oder Vielzahl bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schreibung ist unsicher; möglich ist auch: „verachteten“. Der Gegensatz zu „liebten“ spricht für „hassten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲛⲉⲗⲗⲏⲛ ⲙⲛ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: Griechen und Barbaren
  rationale: Die griechischen Lehnwörter bilden die geläufige antike Gegenüberstellung. „Barbaren“ bewahrt diese historische Ausdrucksweise; eine Fußnote verhindert, dass das Wort ungeklärt im heutigen abwertenden Sinn gelesen wird.
- source_word: ⲡⲉⲥⲉⲓⲛⲉ
  choice: deren Bild
  rationale: ⲉⲓⲛⲉ bedeutet hier „Bild“, „Gestalt“ oder „Erscheinung“. Der feminine Bezug wird durch „deren“ bewahrt.
- source_word: ⲛⲁϣⲉ
  choice: groß
  rationale: Das Prädikat kann Größe oder Vielzahl ausdrücken. Im Zusammenhang mit „Bild“ ist „groß“ natürlich, ohne die mögliche Bedeutung „vielfältig/zahlreich“ zu verschweigen.
- source_word: ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ
  choice: die kein Bild hat
  rationale: Die Form ist als negative Possessivkonstruktion „sie hat kein Bild“ zu lesen, nicht als Ableitung von einem Wort für „Schweigen“.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: überall
  rationale: Die wahrscheinlich im OCR zusammengezogene Wendung bedeutet wörtlich „an jedem Ort“. „Überall“ gibt das im modernen Deutsch knapp und natürlich wieder.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: die sie hassten
  rationale: Die Lesung „hassten“ passt zum Gegensatz mit dem folgenden „liebten“; wegen der unsicheren Schreibung wird die Alternative „verachteten“ in einer Fußnote genannt.
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: die sie liebten
  rationale: Die Liebesaussage bildet den ausdrücklichen Gegenpol zu „hassten“ und wahrt den femininen Bezug der Sprecherin.
theological_decisions:
- issue: Identität der weiblichen Sprecherstimme
  choice: Die feminine Selbstbezeichnung wird grammatisch sichtbar als „ich bin die“ wiedergegeben.
  alternative: Das neutralere „ich bin diejenige“ oder schlicht „ich bin“ wäre möglich.
  rationale: Der Text identifiziert die Sprecherin feminin. Die Übersetzung bewahrt dies, ohne ihre Identität weiter theologisch festzulegen.
- issue: Paradox von sichtbarem und fehlendem Bild
  choice: Die beiden Aussagen bleiben unaufgelöst nebeneinander stehen.
  alternative: Man könnte „Bild“ deutend als „Ansehen“, „Darstellung“ oder „Kultbild“ konkretisieren.
  rationale: Der koptische Text lässt offen, in welchem Sinn die Sprecherin in Ägypten ein großes Bild und unter den Barbaren kein Bild hat. Eine Präzisierung würde die beabsichtigte Spannung vorschnell auflösen.
translation_notes:
  register: Poetisch-paralleler, würdevoller Gegenwartsstil. Die wiederholte Form „ich bin die“ erhält die feminine Stimme und den litaneiartigen Rhythmus. „Überall“ ist natürlicher als das wörtliche „an jedem Ort“, während „Bild“ bewusst offen bleibt.
