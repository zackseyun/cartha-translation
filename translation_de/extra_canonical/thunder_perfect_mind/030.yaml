lexical_decisions:
- source_word: ⲙⲡⲣⲕⲁⲁⲧ ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ (nach der rekonstruierten Lesung)
  choice: Lasst mich nicht verstoßen zurück
  rationale: Die negative Aufforderung ⲙⲡⲣ- wird mit „lasst … nicht“ wiedergegeben; ⲕⲁⲁⲧ bezeichnet das Zurücklassen, während ⲛⲏϫ ⲉⲃⲟⲗ das Hinausgeworfensein oder Verstoßensein ausdrückt. Die deutsche Formulierung bewahrt beide Aspekte, ohne den schwierigen OCR-Text zu überpräzisieren.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: ihr werdet mich finden
  rationale: Die Futurform der zweiten Person Plural wird direkt und natürlich wiedergegeben.
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: im Reichtum
  rationale: Das koptische Abstraktum bezeichnet Reichtum oder Wohlstand. Der Singular „im Reichtum“ ist im Deutschen idiomatischer als „in den Reichtümern“ und lässt offen, ob materieller Besitz oder ein weiter gefasster Reichtum gemeint ist.
theological_decisions:
- issue: Verhältnis zur überlieferten paradoxen Aussage „Ich bin Krieg und Frieden“
  choice: Die tatsächlich zugeordneten koptischen Zeilen werden übersetzt.
  alternative: „Ich bin Krieg und Frieden.“
  rationale: Die Wendung „Ich bin Krieg und Frieden“ steht an einer früheren Stelle des Werkes und wird vom vorliegenden OCR-Ausschnitt nicht gestützt. Sie hier einzusetzen würde die erkennbare Mahnung des koptischen Textes ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede im Plural. „Verstoßen zurücklassen“ hält die Bildkraft des koptischen Ausdrucks fest; „im Reichtum“ bleibt bewusst semantisch offen.
