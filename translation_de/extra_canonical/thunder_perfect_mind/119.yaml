lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: sie werden mich finden
  rationale: Die futurische Form ⲥⲉⲛⲁ- mit ϭⲓⲛⲉ („finden“) und dem Objektspronomen ⲙⲙⲟⲉⲓ („mich“) ist im OCR-Auszug klar erkennbar.
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: an jenem Ort
  rationale: Die Wendung bezeichnet einen bestimmten, bereits vorausgesetzten Ort; „jenem“ gibt die deiktische Distanz von ⲉⲧⲙⲙⲁⲩ natürlich wieder.
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: und leben
  rationale: ⲱⲛϩ bedeutet „leben“. Die deutsche Koordination mit „und“ gibt die konjunktive Fortsetzung knapp und natürlich wieder.
- source_word: ⲛⲥⲉⲧⲙⲥⲱⲧ (OCR; vermutlich ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ)
  choice: und sie werden nicht wieder sterben
  rationale: Die überlieferte OCR-Lesung ergibt hier keinen tragfähigen Sinn. Die im Revisionsbefund angegebene Rekonstruktion ⲧⲙⲙⲟⲩ ⲟⲛ bedeutet „nicht wieder sterben“ und passt syntaktisch zur vorausgehenden Aussage über das Leben.
theological_decisions:
- issue: Verhältnis von „leben“ und „nicht wieder sterben“
  choice: Beide Aussagen bleiben nebeneinander stehen, ohne die Art des Lebens näher zu bestimmen.
  alternative: Die Aussage ausdrücklich als ewiges oder geistliches Leben deuten.
  rationale: Der erhaltene Wortlaut erklärt nicht, ob körperliches, geistliches oder ewiges Leben gemeint ist. Eine nähere dogmatische Bestimmung wäre ein Zusatz.
