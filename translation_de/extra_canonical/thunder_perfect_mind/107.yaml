base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: de
  text: 'Ich bin das Hören, das allen zugänglich ist[a];


    ich bin die Rede, die niemand erfassen kann;


    der Name des Klangs und der Klang des Namens.


    Ich bin das Zeichen davon[b] und die Offenbarung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende ⲉⲧϣⲏⲡ kann hier im Sinn von „zugänglich“ oder „erreichbar“ verstanden werden; als weitere Möglichkeit ist „groß“ vorgeschlagen worden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „das Zeichen hiervon/dieses“. Worauf der Rückverweis genau zielt, bleibt offen.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: das Hören
  rationale: Das substantivierte „Hören“ bewahrt das akustische Leitmotiv und vermeidet die moralisierende Wiedergabe „Gehorsam“.
- source_word: ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: das allen zugänglich ist
  rationale: „Zugänglich“ gibt die hier wahrscheinlich gemeinte Erreichbarkeit idiomatisch wieder; ⲛϩⲱⲃ ⲛⲓⲙ wird als universale Bestimmung verstanden.
- source_word: ⲡϣⲁϫⲉ
  choice: die Rede
  rationale: „Rede“ bezeichnet die hervorgebrachte Äußerung, ohne die besonderen theologischen Nebenbedeutungen von „Wort“ aufzurufen.
- source_word: ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: die niemand erfassen kann
  rationale: 'Die Buchstabenfolge über den Zeilenumbruch hinweg wird als negativer Relativsatz verstanden: „die sie nicht erfassen können“. Das unbestimmte pluralische Subjekt wird im Deutschen natürlich mit „niemand“ wiedergegeben.'
- source_word: ⲣⲁⲛ
  choice: Name
  rationale: Die direkte Entsprechung erhält die chiastische Verbindung mit „Klang“.
- source_word: ⲥⲙⲏ
  choice: Klang
  rationale: „Klang“ bewahrt die abstrakte akustische Gegenüberstellung zu „Name“; „Stimme“ bleibt lexikalisch möglich.
- source_word: ⲥⲏⲙⲉⲓⲟⲛ
  choice: Zeichen
  rationale: Das griechische Lehnwort σημεῖον bezeichnet ein Zeichen oder Kennzeichen. Das über den Zeilenumbruch verteilte ⲟⲛ gehört zum Wort und ist kein selbstständiges „auch“.
- source_word: ⲙⲡⲁⲓ
  choice: davon
  rationale: Die deiktische Genitivverbindung „von diesem/dieser Sache“ bleibt rückverweisend und hinsichtlich ihres genauen Bezugs offen.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: die Offenbarung
  rationale: Die Wendung bezeichnet ein Offenbarwerden oder Sichtbarwerden, nicht „Licht“. „Offenbarung“ wahrt die substantivische Parallelstruktur.
theological_decisions:
- issue: Mögliche Logos-Anspielung bei ⲡϣⲁϫⲉ
  choice: Rede
  alternative: Wort
  rationale: Der Text identifiziert die Sprecherin mit einer Äußerung, erzwingt aber keine Gleichsetzung mit dem Logos bestimmter theologischer Traditionen.
- issue: Bezug von „davon“ in „das Zeichen davon“
  choice: Bezug offengelassen
  alternative: ausdrücklicher Bezug auf die Rede, den Namen oder den Klang
  rationale: Das Demonstrativpronomen ist im Ausschnitt nicht eindeutig auf nur eines der vorangehenden Glieder festgelegt; eine Präzisierung würde die Ambiguität auflösen.
translation_notes:
  register: Dignitativ-poetischer, aber moderner deutscher Stil. Die wiederholte Selbstvorstellung und der Chiasmus „Name des Klangs / Klang des Namens“ bleiben erhalten. Die Zeilenumbrüche folgen den Sinn- und Rhythmuseinheiten, nicht den zufälligen OCR-Zeilen.
