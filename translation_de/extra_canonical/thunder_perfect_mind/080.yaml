    issue: Die Übersetzung „ist Krieg entstanden“ entfernt sich unnötig vom Bewegungsverb „kommen“.
    rationale: Das zugrunde gelegte Coptische wird in der Audit-Spur als perfektives „to come“ bestimmt. „Ist gekommen“ ist im Deutschen zugleich natürlich und genauer; „entstanden“ bleibt eine mögliche interpretierende Alternative.
