translation:
  language: de
  text: '**5.** Ich bin der Friede, und meinetwegen ist Krieg entstanden[a];

    und ich bin eine Fremde und eine Bürgerin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »ist … gekommen«; möglich ist ebenso: »ist … aufgekommen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hier zugeordnete OCR-Fragment enthält andere griechische Lehnwörter (kolasis, physis, ktisis, psychē) und ist daher wahrscheinlich nicht korrekt auf diesen Abschnitt ausgerichtet. Die Übersetzung folgt der anderweitig bezeugten Textgestalt dieses Satzes.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ (griechisches Lehnwort εἰρήνη)
  choice: der Friede
  rationale: Die geläufige und würdevolle Entsprechung erhält den scharfen Gegensatz zu »Krieg«.
- source_word: ⲡⲟⲗⲉⲙⲟⲥ (griechisches Lehnwort πόλεμος)
  choice: Krieg
  rationale: »Krieg« bewahrt die volle antithetische Kraft; »Konflikt« wäre abschwächend.
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  choice: meinetwegen
  rationale: Gibt die kausale Bedeutung »wegen mir/aufgrund meiner« knapp und idiomatisch wieder, ohne eine positive Zweckbedeutung anzudeuten.
- source_word: ⲝⲉⲛⲟⲥ (griechisches Lehnwort ξένος)
  choice: eine Fremde
  rationale: Bewahrt die Mehrdeutigkeit zwischen einer fremden Person und einer Ausländerin und bildet zugleich einen verständlichen Gegensatz zu »Bürgerin«.
- source_word: ⲡⲟⲗⲓⲧⲏⲥ (griechisches Lehnwort πολίτης)
  choice: eine Bürgerin
  rationale: Der staatsbürgerliche Ausdruck stellt den beabsichtigten Gegensatz zu »Fremde« am deutlichsten heraus; die feminine Form entspricht der weiblichen Sprecherstimme des Werkes.
- source_word: ⲉⲓ (Perfekt/Aorist von »kommen«)
  choice: ist … entstanden
  rationale: Gibt das vollendete Aufkommen des Krieges in natürlichem Deutsch wieder; »ist … gekommen« bleibt als formnähere Möglichkeit in der Fußnote erhalten.
theological_decisions:
- issue: Ursächliche Beziehung zwischen der Sprecherin und dem Krieg
  choice: meinetwegen
  alternative: um meinetwillen
  rationale: »Meinetwegen« lässt die paradoxe Kausalität stehen, ohne ihr eine heilsgeschichtliche oder positive Zweckbestimmung zuzuschreiben.
- issue: Geschlecht der prädikativen Personenbezeichnungen
  choice: Fremde und Bürgerin
  alternative: Fremder und Bürger
  rationale: Die feminine Form folgt der weiblichen Sprecherstimme und ist im Deutschen natürlich; sie macht keine weitergehende Aussage über das Wesen der Sprecherin.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der Parallelismus und die paradoxen Gegensätze »Friede/Krieg« sowie »Fremde/Bürgerin« bleiben unvermittelt erhalten. Wegen der wahrscheinlich fehlerhaften OCR-Zuordnung wird die textkritische Unsicherheit ausdrücklich vermerkt.
