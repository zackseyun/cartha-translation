  naturalness: „Ich bin der Friede“ ist in einem erhöhten poetischen Register natürlich. „Wegen mir ist Krieg gekommen“ ist klar, idiomatisch und bewahrt die direkte Kausalität ohne die mögliche alltagssprachliche Nebenbedeutung von „meinetwegen“.
  terminology: „Friede/Krieg“ und „Fremde/Bürgerin“ erhalten die antithetische und staatsbürgerliche Bildsprache. Die feminine Form ist im Kontext der weiblich sprechenden Gestalt des Werks sprachlich vertretbar. Es wird keine weitergehende theologische Deutung eingeführt.
