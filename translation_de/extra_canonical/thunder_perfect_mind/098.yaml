translation:
  language: de
  text: '**14.** Haltet ihnen allen den Mund zu! Richtet sie, bevor sie euch ergreifen; denn der Richter der Ungerechtigkeit ist unter euch. Wenn ihr beim Kommen dessen, der euch freilassen wird, freigelassen werdet[a] – oder wenn ihr euch selbst freilasst …[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Wortlaut ist an dieser Stelle beschädigt. Möglich ist auch: „Wenn ihr durch das Kommen dessen freigelassen werdet, der euch freilassen wird …“'
    reason: textual_uncertainty
  - marker: b
    text: Der erhaltene Ausschnitt bricht mitten im Satz ab; die Fortsetzung ist daher nicht ergänzt.
    reason: source_fragment
lexical_decisions:
- source_word: ⲭⲣⲟⲉⲓ ⲧⲉⲣⲟⲟⲩ (OCR; wohl verderbt bzw. falsch erkannt)
  choice: Verschließt ihnen allen den Mund!
  rationale: Der überlieferte/OCR-erfasste Wortlaut ist problematisch; im Satzzusammenhang und nach der überprüften Lesung bezeichnet die Wendung das Verschließen ihrer Münder, nicht ein Ich-Wort über lautes Rufen. Die Übersetzung folgt daher dem tatsächlich ausgerichteten Abschnitt statt dem fehlzugeordneten Konsultationstext.
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: Richtet sie
  rationale: Das griechische Lehnverb κρίνειν bedeutet hier „richten/urteilen über“. „Richtet“ bewahrt den direkten Imperativ und die Verbindung zum unmittelbar folgenden „Richter“.
- source_word: ⲉⲙⲡⲁⲧⲟⲩⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: bevor sie euch ergreifen
  rationale: ⲙⲡⲁⲧ- bezeichnet „bevor/noch nicht“, während ⲧⲁϩⲉ mit dem Objektanschluss die gewaltsame Bedeutung „ergreifen, packen“ trägt.
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: der Richter der Ungerechtigkeit
  rationale: Die formale Genitivverbindung bleibt erhalten. Sie kann einen ungerechten Richter oder einen Richter über Ungerechtigkeit bezeichnen; die ungewöhnlichere formale Fassung vermeidet eine vorschnelle Festlegung.
- source_word: ⲕⲁ … ⲉⲃⲟⲗ
  choice: freilassen / freigelassen werden
  rationale: In diesem Zusammenhang bezeichnet die Verbindung Befreiung bzw. Freilassung. „Hinauswerfen“ wäre hier durch die fehlerhafte Ausrichtung auf einen anderen Abschnitt bedingt.
theological_decisions:
- issue: Bedeutung von „Richter der Ungerechtigkeit“
  choice: die Genitivform „Richter der Ungerechtigkeit“ bewahren
  alternative: „der ungerechte Richter“ oder „der Richter über die Ungerechtigkeit“
  rationale: Der koptische Genitiv lässt das genaue Verhältnis offen. Die Übersetzung soll weder die moralische Bewertung des Richters noch sein Gerichtsobjekt dogmatisch festlegen.
- issue: Subjekt im beschädigten Schluss
  choice: „wenn er euch freilässt“
  alternative: „wenn ihr euch selbst freilasst“
  rationale: Der Text bricht innerhalb der Konstruktion ab. Der nächstliegende Bezug ist „der, der euch freilassen wird“, doch wegen des beschädigten Endes wird die Fortsetzung nicht weiter ergänzt und die Unsicherheit in der Fußnote offengelegt.
translation_notes:
  register: Direkte, eindringliche Imperative und ein würdiger moderner Satzbau. Die Übersetzung korrigiert die nachweislich fehlgeleitete Zuordnung zum Ich-Wort „Ich bin die, die ruft“ und folgt dem hier tatsächlich erhaltenen koptischen Abschnitt. Beschädigungen und syntaktische Mehrdeutigkeiten werden durch Fußnoten sichtbar gehalten.
