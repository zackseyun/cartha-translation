  text: For I am the first and the last[a][b].
translation:
  language: de
  text: '**1.** Denn ich bin die Erste und die Letzte.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vgl. Jesaja 44,6 und Offenbarung 22,13 zu ähnlichen Formulierungen: „Ich bin der Erste und ich bin der Letzte.“'
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ kann auch „das Ende“ bedeuten. Wegen der ausgewogenen Gegenüberstellung mit „die Erste“ steht hier „die Letzte“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: Denn
  rationale: Die begründende Partikel knüpft die Selbstaussage an die vorausgehende Mahnung an und wahrt den Gedankengang.
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: ich bin
  rationale: Die deutsche Kopulakonstruktion gibt die Identitätsaussage natürlich wieder; die feminine Form ⲧⲉ und die feminine Sprecherstimme werden in den Prädikatsbezeichnungen sichtbar.
- source_word: ⲧϣⲟⲣⲡ
  choice: die Erste
  rationale: Die feminine substantivierte Ordnungszahl bewahrt sowohl den titelartigen Charakter als auch die Parallelität mit „die Letzte“.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet das gegensätzliche Begriffspaar unmittelbar.
- source_word: ⲑⲁⲉ
  choice: die Letzte
  rationale: Im Gegenüber zu ⲧϣⲟⲣⲡ ergibt sich eine ausgewogene feminine Selbstaussage. Die ebenfalls mögliche Bedeutung „das Ende“ wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Geschlecht der Sprecherstimme in der Selbstaussage
  choice: „die Erste … die Letzte“
  alternative: „der Erste … der Letzte“ oder „das Erste … das Letzte“
  rationale: Die koptische Kopula ⲧⲉ und die Formen mit femininem Artikel kennzeichnen die Sprecherin grammatisch als feminin. Die Übersetzung bewahrt dieses Merkmal, ohne daraus eine weitergehende dogmatische Deutung abzuleiten.
translation_notes:
  register: Knappe, feierliche und rhythmisch ausgewogene Selbstaussage in modernem Standarddeutsch. Die feminine Grammatik des koptischen Textes bleibt ausdrücklich erhalten; die Großschreibung substantivierter Ordnungszahlen unterstreicht den titelartigen Klang.
