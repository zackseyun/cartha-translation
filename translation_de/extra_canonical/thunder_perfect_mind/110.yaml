translation:
  language: de
  text: '**1.** Hört auf mich, ihr, die ihr hört; und lernt meine Worte, ihr, die ihr mich kennt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zuordnung des beschädigten beziehungsweise fehlerhaft erkannten koptischen Ausschnitts zu diesem Satz ist unsicher. Die hier wiedergegebene, editionsübliche Lesung setzt sinngemäß „Hört auf mich, ihr, die ihr hört …“ voraus; der vorliegende OCR-Text zeigt diese Wörter nicht zuverlässig und enthält am Ende möglicherweise „Worte und Stimmen“.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲱⲧⲙ (in der erschlossenen, editionsüblichen Lesung)
  choice: hört / Hört auf mich
  rationale: Das Verb bezeichnet zunächst das Hören beziehungsweise Zuhören und kann im Aufforderungskontext auch den Sinn des Gehorchens annehmen. „Hört auf mich“ wahrt im Deutschen beide Nuancen; die Wiederaufnahme „die ihr hört“ erhält das Wortspiel.
- source_word: ϣⲁϫⲉ
  choice: Worte
  rationale: „Worte“ gibt den belehrenden Inhalt wieder und bildet eine natürliche Verbindung mit „lernt“.
- source_word: ⲥⲟⲩⲛ (in der erschlossenen, editionsüblichen Lesung)
  choice: kennt
  rationale: „Kennt“ bewahrt die persönliche Beziehung des Erkennens zur Sprecherin und entspricht dem Parallelismus mit „die ihr hört“.
theological_decisions:
- issue: Verhältnis von Hören und Gehorchen
  choice: „Hört auf mich“
  alternative: „Gehorcht mir“
  rationale: Die gewählte Form lässt die mögliche Bedeutung „gehorchen“ anklingen, ohne das Motiv des Hörens zu verdecken oder die lexikalische Spannung einseitig aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Anrede „ihr, die ihr …“ erhält den poetischen und eindringlichen Klang. „Hört auf mich“ ist bewusst semantisch offen zwischen aufmerksamem Hören und Gehorchen.
