base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
translation:
  language: de
  text: 'Denn sie ist weise, und sie ist eine Kleine[a].


    Und wende die großen Dinge auch nicht in Teilen


    von der Kleinheit ab[b];


    denn sie kennen die Kleinheit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „eine Kleine“. Das Wort kann je nach Zusammenhang auch Vorstellungen von Geringsein, Unreife oder Unwissenheit anklingen lassen; „eine Törin“ wäre jedoch eine stärkere Deutung.
    reason: lexical_alternative
  - marker: b
    text: 'Die ungewöhnliche Wendung kann auch lauten: „Nimm die großen Dinge nicht stückweise von der Kleinheit weg.“ Der genaue syntaktische Zusammenhang bleibt unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: ϫⲉ
  choice: Denn
  rationale: Die Partikel leitet hier eine begründende oder erläuternde Aussage ein.
- source_word: ⲥⲥⲁⲃⲉ
  choice: sie ist weise
  rationale: Das Präfix ⲥ- bezeichnet die 3. Person Singular Femininum; daher liegt keine Aufforderung, sondern eine Aussage vor.
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  choice: sie ist eine Kleine
  rationale: Die feminine Kopula ⲧⲉ bestätigt die Aussageform. Die wörtliche Wiedergabe bewahrt den Gegensatz zwischen Weisheit und Kleinheit, ohne ihn zu „Torheit“ umzudeuten.
- source_word: ⲙⲡⲣⲧⲥⲧⲟ … ⲉⲃⲟⲗ ϩⲛ
  choice: wende … nicht … von … ab
  rationale: Die negative Aufforderung und die Verb-Präpositions-Verbindung werden idiomatisch als Abwenden von etwas wiedergegeben.
- source_word: ϩⲉⲛⲙⲛⲧⲛⲟϭ
  choice: die großen Dinge
  rationale: Die Pluralmarkierung spricht hier für konkrete oder pluralisierte „große Dinge“ statt des singularischen Abstraktums „Größe“.
- source_word: ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: in Teilen
  rationale: Das griechische Lehnwort μέρος bedeutet „Teil“ oder „Anteil“; die bewusst ungewöhnliche Formulierung des Ausgangstextes bleibt erhalten.
- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: die Kleinheit
  rationale: Die Abstraktbildung mit ⲙⲛⲧ- bezeichnet wörtlich Kleinheit und steht im unmittelbaren Kontrast zu den großen Dingen.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: sie kennen
  rationale: Die Form wird als aoristische bzw. allgemeingültige Aussage verstanden, nicht als limitatives „bis sie erkennen“.
- source_word: ⲅⲁⲣ
  choice: denn
  rationale: Die griechische Lehnpartikel γάρ führt die Begründung der vorausgehenden Aussage ein.
theological_decisions:
- issue: Paradoxe Verbindung von Weisheit und Kleinheit
  choice: „sie ist weise, und sie ist eine Kleine“
  alternative: „sie ist weise und töricht“
  rationale: Die Übersetzung bewahrt die grammatisch feminine Aussage und den wörtlichen Begriff der Kleinheit. Eine Deutung als Torheit würde den paradoxen Sinn stärker festlegen, als es der koptische Wortlaut verlangt.
- issue: Bezug des pluralischen „sie“ im Schlusssatz
  choice: Das Pronomen bleibt unaufgelöst.
  alternative: „denn die großen Dinge kennen die Kleinheit“
  rationale: Der wahrscheinlichste Bezug sind die zuvor genannten großen Dinge; die pronominale Wiedergabe erhält jedoch die syntaktische Offenheit des Textes.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe, paradoxe und teilweise sperrige Gestalt des koptischen Textes wird nicht geglättet; besonders „in Teilen“ und der unaufgelöste Bezug von „sie“ bleiben bewusst offen.
