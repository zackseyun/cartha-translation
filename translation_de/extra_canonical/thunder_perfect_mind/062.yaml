review_pass:
  verdict: reject
  source_fidelity: Der deutsche Haupttext folgt zwar der englischen Audit-Spur, ist jedoch durch den tatsächlich beigegebenen koptischen Ausschnitt nicht gedeckt. Dieser beginnt mit Formulierungen zu »denen, die mich kennen« und »meinen Engeln« und enthält ferner Material zu Groß/Klein, dem Anfang der Schöpfung sowie einem kleinen Kind. Eine eindeutig abgrenzbare Klausel »wenn ihr euch verbergt … [werde] ich sichtbar« ist darin nicht nachweisbar. Bei nur mittlerer Zuordnungssicherheit kann die englische konsultierte Lesung die Primärquelle nicht ersetzen.
  naturalness: Für sich genommen ist »Und wenn ihr euch verbergt, bin ich es, die sichtbar werden wird« verständlich und poetisch angemessen. »bin ich es, die sichtbar werden wird« wirkt allerdings markiert; das ist hier gegenüber dem weitaus schwereren Zuordnungsproblem nachrangig.
  terminology: Die Fußnoten geben lexikalische und textliche Unsicherheit grundsätzlich transparent wieder. Sie können aber nicht beheben, dass der Haupttext eine Klausel übersetzt, die im bereitgestellten Quellenausschnitt nicht erkennbar ist. Die feminine Relativform ist literarisch möglich, sollte bei einer später verifizierten Grundlage jedoch nicht nötig sein; »werde ich sichtbar werden« wäre ohne zusätzliche grammatische Geschlechtsmarkierung möglich.
  issues:
  - severity: high
    issue: Der übersetzte Hauptsatz ist im bereitgestellten koptischen Segment nicht belegbar.
    rationale: Der Quellenausschnitt enthält keine eindeutig erkennbare Entsprechung für »wenn ihr euch verbergt« und weist stattdessen auf anderslautende, offenbar angrenzende Textteile. Die englische Konsultationsfassung ist ausdrücklich nur heuristisch zugeordnet und darf den koptischen Befund nicht übersteuern.
  - severity: high
    issue: Die Fußnoten behandeln die Zuordnungsunsicherheit als Randfrage, obwohl sie die Grundlage des gesamten Haupttexts betrifft.
    rationale: Fußnote b nennt Material des Ausschnitts als benachbart, doch ohne verifizierte Zeilen- bzw. Seitenzuordnung ist nicht sicher, dass überhaupt die übersetzte Klausel zu diesem Segment gehört.
