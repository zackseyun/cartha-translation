translation:
  language: de
  text: 'Und wenn ihr euch verbergt[a][b][c],

    bin ich es, die sichtbar werden wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das koptische ⲥⲙⲓⲛⲉ kann möglicherweise auch »klein werden« oder »sich erniedrigen« bedeuten. Dann wäre zu übersetzen: »Und wenn ihr klein werdet, bin ich es, die sichtbar werden wird.«'
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte Ausschnitt enthält außerdem Wendungen wie »am Anfang der Schöpfung« und »eine sichtbare Erscheinung eines kleinen Kindes«. Sie gehören wahrscheinlich zu benachbarten Zeilen; wegen der unsicheren Zuordnung werden sie hier nicht in den Haupttext aufgenommen.
    reason: alignment_note
  - marker: c
    text: 'Falls das nachfolgende ⲙⲡⲣⲙⲉⲥⲧⲱⲥ zu diesem Satzglied gehört, ist auch eine verneinte Aufforderung möglich: »Und verbergt euch nicht; ich bin es, die sichtbar werden wird.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: euch verbergt
  rationale: Die Wiedergabe bewahrt den im zugeordneten Satz angenommenen Gegensatz zwischen Sichverbergen und Sichtbarwerden. Da das koptische Wort auch im Sinn von »klein werden« oder »sich erniedrigen« verstanden werden kann, wird diese Unsicherheit in einer Fußnote offengehalten.
- source_word: ⲙⲓⲉ
  choice: sichtbar werden
  rationale: Die Form bezeichnet Sichtbarkeit beziehungsweise Offenbarwerden. »Sichtbar werden« erhält den resultativen Sinn und den poetischen Gegensatz zum Verbergen, ohne stärker als nötig »erscheinen« einzutragen.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die einfache verbindende Konjunktion entspricht dem additiven Rhythmus der Rede; ein ausdrücklich adversatives »aber« wäre interpretierend.
- source_word: ⲡⲉⲧⲛ
  choice: bin ich es, die … wird
  rationale: Die Hervorhebung der Sprecherin wird idiomatisch wiedergegeben. Das feminine Relativpronomen »die« folgt der weiblich auftretenden Ich-Stimme des Werkes; die deutsche Formulierung bildet zugleich das futurische Verständnis der konsultierten Satzzuordnung ab.
theological_decisions:
- issue: Identität und Geschlecht der sprechenden Ich-Stimme
  choice: weiblicher Bezug in »die sichtbar werden wird«
  alternative: 'geschlechtsneutraler formulieren: »werde ich sichtbar werden«'
  rationale: Der literarische Zusammenhang präsentiert eine weibliche Ich-Stimme. Die grammatische Markierung dient der Textgestalt und legt keine weitergehende dogmatische Identifikation fest.
- issue: Paradox von Verborgenheit und Offenbarwerden
  choice: als unmittelbaren Gegensatz von »euch verbergt« und »sichtbar werden« bewahren
  alternative: den Gegensatz erklärend als geistliche Offenbarung ausdeuten
  rationale: Der Text lässt die Art des Sichtbarwerdens offen; eine theologische Präzisierung würde die produktive Spannung des Gedichts auflösen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Zeilenbruch erhält den antithetischen Rhythmus. Die Übersetzung folgt der zugeordneten Kurzklausel, kennzeichnet aber wegen der nur mittleren Alignment-Sicherheit sowohl die lexikalische als auch die syntaktische Alternative ausdrücklich.
