  rationale: Bei einer Person als Objekt ist „kennen“ im modernen Deutsch natürlicher als „wissen“ und hält den Bezug auf die Sprecherin unmittelbar fest.
- source_word: ⲙⲁⲣⲟⲩⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ (rekonstruierter Text hinter ⲉⲩⲛⲁⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ)
