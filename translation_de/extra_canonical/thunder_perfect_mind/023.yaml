  rationale: Die Bildung aus Nominalpräfix, Privativpräfix und „kennen/wissen“ bezeichnet das Nichtwissen. „Unwissenheit“ wahrt die knappe Antithese zu „Erkenntnis“.
- source_word: ⲁⲛⲟⲕ ⲅⲁⲣ ⲡⲉ
