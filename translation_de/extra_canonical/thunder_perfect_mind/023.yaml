  rationale: Das substantivierte „Erkenntnis“ entspricht dem abstrakten Nomen und verbindet sich im Deutschen passend mit dem persönlichen Erkennen der Sprecherin.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
