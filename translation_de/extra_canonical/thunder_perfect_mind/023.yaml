  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
translation:
  language: de
  text: '**1.** Diejenigen, die über mich lügen, sagen die Wahrheit über mich.[a]


    Die mich kennen, sollen mich nicht kennen,[b]


    und die mich nicht gekannt haben, sollen mich kennen.


    Denn ich bin die Erkenntnis und die Unwissenheit.


    Ich bin —'
  philosophy: optimal-equivalence
