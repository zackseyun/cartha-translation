base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: de
  text: 'Befreit euch.[a] Oder: Wenn ihr euch von ihm befreit, wer wird euch dann ergreifen können? Denn euer Inneres ist euer Äußeres,[b] und der das Äußere formt, ist der, der das Innere formt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Lasst euch frei“ oder „Gebt euch frei“.'
    reason: lexical_alternative
  - marker: b
    text: „Inneres“ und „Äußeres“ geben die koptischen räumlichen Gegenbegriffe „das Drinnen“ und „das Draußen“ wieder.
    reason: source_clarification
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: Lasst euch los
  rationale: ⲕⲁ … ⲉⲃⲟⲗ bedeutet hier „loslassen/freigeben“; das reflexive Pronomen ergibt „euch selbst loslassen“. Die Formulierung bewahrt den knappen Imperativ und vermeidet die frühere Fehlanalyse als „hinausrufen“.
- source_word: ⲛϩⲏⲧϥ
  choice: von ihm
  rationale: Die Präpositionalverbindung bezeichnet in diesem Zusammenhang die Loslösung „von ihm“. Das maskuline Bezugswort bleibt wie im erhaltenen Ausschnitt unbestimmt.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: ergreifen
  rationale: Das Verb bezeichnet das Ergreifen, Festhalten oder Bemächtigen. „Ergreifen“ passt zur Gegenüberstellung von Loslassen und erneutem Zugriff.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ / ⲡⲉⲧⲛⲥⲁⲃⲃⲟⲗ
  choice: euer Inneres / euer Äußeres
  rationale: ⲥⲁϩⲟⲩⲛ und ⲥⲁⲃⲃⲟⲗ sind räumliche Gegenbegriffe, „innen“ und „außen“. Substantiviert geben „Inneres“ und „Äußeres“ die paradoxe Gleichsetzung natürlich wieder.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: formt
  rationale: Das griechische Lehnverb πλάσσειν bedeutet „formen, gestalten“. „Formt“ wahrt die konkrete Schöpfungs- beziehungsweise Gestaltungssprache, ohne sie theologisch näher festzulegen.
theological_decisions:
- issue: Unbestimmter Bezug von „ihm“
  choice: Das Pronomen „ihm“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Den mutmaßlichen Bezugsgegenstand ausdrücklich benennen.
  rationale: Der vorgelegte Ausschnitt nennt den Bezug nicht eindeutig; eine Ergänzung würde die überlieferte Mehrdeutigkeit auflösen.
- issue: Identität des Formenden
  choice: „wer … formt“ ohne Benennung oder Deutung der handelnden Gestalt
  alternative: „der Schöpfer“ oder eine bestimmte kosmologische Gestalt
  rationale: Der Text spricht partizipial vom Formenden. Eine dogmatische Identifizierung wäre nicht durch diesen Ausschnitt gedeckt.
- issue: Verhältnis von Innerem und Äußerem
  choice: Die direkte paradoxe Gleichsetzung wird beibehalten.
  alternative: Die Aussage als Entsprechung oder Ähnlichkeit erklären.
  rationale: Das Kopulaverhältnis lautet wörtlich „ist“; eine abschwächende Erklärung würde die Spannung des Textes beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Syntax. Der Doppelpunkt gliedert die rhetorische Frage; die Wiederholung von „formt“ bewahrt den Parallelismus. Die Übersetzung folgt dem tatsächlich sichtbaren koptischen Wortlaut und nicht der offenbar fehlzugeordneten kurzen Konsultationszeile.
