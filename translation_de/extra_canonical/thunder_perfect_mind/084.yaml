  yaml_path: translation/extra_canonical/thunder_perfect_mind/084.yaml
  text: '...is the one who sees what comes before me[A]. I am the light.

    I have not gone out — I, I —.B

    a non-darkness and the root of darkness is from within me.

    I am the desire of a vision,

    and the self-control of the heart that exists within me[d][c][b][a][E][D][C][B],

    I am the hearing that is acceptable to everyone.'
translation:
  language: de
  text: '… ist der, der sieht, was vor mich kommt.[a]


    Ich bin das Licht.

    Ich bin nicht hinausgegangen.[b]

    Ich, ich bin eine Nichtfinsternis,

    und die Wurzel der Finsternis stammt aus meinem Inneren.


    Ich bin das Verlangen nach einer Schau

    und die Selbstbeherrschung des Herzens, die in mir ist.


    Ich bin das Hören, das für jeden annehmbar ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Zuordnung dieses Ausschnitts ist unsicher: Der aus dem Seitenverhältnis erschlossene Vergleichstext erwartet hier ein Nah/Fern-Paradox, während der erhaltene OCR-Wortlaut eine Folge über Licht, Finsternis und menschliche Fähigkeiten bietet. Übersetzt ist der vorliegende koptische Wortlaut.'
    reason: alignment_note
  - marker: b
    text: Die koptische Form ⲙⲡⲕⲱ ⲉⲃⲟⲗ kann als vergangene Verneinung (»ich bin nicht hinausgegangen«) oder als Verbot (»geh nicht hinaus«) verstanden werden. Im Zusammenhang der Ich-Aussagen wurde die deklarative Lesart gewählt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉ ⲡⲉⲧⲛⲁⲩ ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: … ist der, der sieht, was vor mich kommt
  rationale: Gibt die substantivierte Wendung mit »sehen« und die räumliche Bewegung wieder, ohne ein im Auszug nicht ausdrücklich genanntes Gegenüber einzufügen. Die Auslassungspunkte markieren, dass der OCR-Ausschnitt mitten im Satz einsetzt.
- source_word: ⲫⲱⲧ
  choice: das Licht
  rationale: Die schlichte, würdige Entsprechung bewahrt die Bildsprache und die identifizierende Ich-bin-Aussage.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: Ich bin nicht hinausgegangen
  rationale: Die deklarative Lesart passt zum Gefüge der Ich-Aussagen; eine prohibitive Analyse bleibt aufgrund der Form möglich und wird in einer Fußnote genannt.
- source_word: ⲟⲩⲁⲧⲛⲟⲕⲉ
  choice: eine Nichtfinsternis
  rationale: Die ungewöhnliche Negativbildung des Koptischen wird bewusst sichtbar gehalten, statt sie glättend mit »Licht« oder »Abwesenheit von Finsternis« wiederzugeben.
- source_word: ⲧⲛⲟⲩⲛⲉ ⲙⲡⲛⲟⲕⲉ
  choice: die Wurzel der Finsternis
  rationale: Liest ⲧⲛⲟⲩⲛⲉ als »Wurzel« und verbindet die folgende Genitivgruppe korrekt damit; dadurch bleibt die paradoxe Aussage scharf.
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧ ⲧⲉ
  choice: stammt aus meinem Inneren
  rationale: Gibt die Herkunft aus dem Inneren idiomatisch wieder und vermeidet die sachlich falsche Aufspaltung in »außen« und »innen«.
- source_word: ⲧⲉⲡⲓⲑⲩⲙⲓⲁ ⲛⲟⲩϩⲟⲣⲁⲥⲓⲥ
  choice: das Verlangen nach einer Schau
  rationale: Versteht ⲛ-ⲟⲩ als Genitivpartikel mit unbestimmtem Artikel, nicht als νοῦς »Geist«. »Schau« wahrt den gehobenen, visionären Sinn von ὅρασις.
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ ⲙⲫⲏⲧ ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  choice: die Selbstbeherrschung des Herzens, die in mir ist
  rationale: Ordnet »des Herzens« der Selbstbeherrschung zu und bezieht den Relativsatz grammatisch auf diese; die innere Lokalisierung bleibt ausdrücklich erhalten.
- source_word: ⲡⲥⲱⲧⲙ ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ
  choice: das Hören, das für jeden annehmbar ist
  rationale: Bewahrt das abstrakte Sinnesvermögen und versteht ϣⲏⲡ als »annehmbar/akzeptabel« sowie ⲛⲟⲩⲟⲛ als »für jeden«, nicht als »in einem«.
theological_decisions:
- issue: Paradoxe Selbstaussage über Licht und Finsternis
  choice: »Ich, ich bin eine Nichtfinsternis, und die Wurzel der Finsternis stammt aus meinem Inneren.«
  alternative: Die Aussage zu einer einfachen Gegenüberstellung von äußerem Dunkel und innerem Licht glätten.
  rationale: Der koptische Wortlaut verbindet die Sprecherin zugleich mit Nichtfinsternis und mit dem Ursprung der Finsternis. Diese Spannung wird nicht metaphysisch oder konfessionell aufgelöst.
- issue: Vision und Herzensdisziplin
  choice: »Verlangen nach einer Schau« und »Selbstbeherrschung des Herzens« als parallele Selbstaussagen
  alternative: »Geist«, »Schau des inneren Herzens« und »Selbstbeherrschung« als dreigliedrige Reihe lesen.
  rationale: Die Morphologie stützt den unbestimmten Genitiv »einer Schau« und die Verbindung von Selbstbeherrschung mit dem Herzen; eine weitergehende Lehre über Geist oder Askese wird nicht eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Ton. Die anaphorischen Ich-bin-Sätze, die Wiederholung »Ich, ich« und die befremdliche Bildung »Nichtfinsternis« bleiben als kennzeichnende rhetorische Formen erhalten. »Schau« ist leicht gehoben, aber im visionären Kontext natürlicher und präziser als das moderne Fremdwort »Vision«.
