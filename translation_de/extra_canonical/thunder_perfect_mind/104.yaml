lexical_decisions:
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: zu einem Abbild machen
  rationale: Das griechische Lehnwort τύπος bezeichnet ein Muster, Gepräge oder Abbild. „Abbild“ ist im Deutschen natürlich und bewahrt den Bezug zwischen äußerer Erscheinung und innerer Wirklichkeit.
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: in euch / was in euch ist
  rationale: Die Wendung bezeichnet hier das Innere beziehungsweise die Innenseite, nicht ein Sich-Nähern. Die Ergänzung „was … ist“ macht die substantivische Verwendung im Deutschen verständlich.
- source_word: ⲥⲁⲛⲃⲟⲗ
  choice: außerhalb von euch
  rationale: Die Form steht im Gegensatz zu ⲥⲁϩⲟⲩⲛ und bezeichnet das Äußere beziehungsweise das, was außerhalb liegt.
- source_word: ⲡⲉⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟϥ
  choice: was ihr seht
  rationale: Die Relativkonstruktion ist als Aussage zu verstehen, nicht als Aufforderung „Seht!“.
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: sichtbar
  rationale: Die Wendung bedeutet hier „offenbar/sichtbar sein“. Sie wird nicht mit dem ähnlich aussehenden Verb „leben“ gleichgesetzt.
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: Hörenden
  rationale: Das griechische Lehnwort ἀκροατής bezeichnet Menschen, die hören oder zuhören. „Hörende“ erhält den feierlichen Anredecharakter und den Wortklang mit „Hört“.
theological_decisions:
- issue: Verhältnis von äußerer Erscheinung und innerem Selbst der Sprecherin
  choice: „das seht ihr in euch als mich“
  alternative: „darin seht ihr mich in euch“
  rationale: Die Formulierung erhält die bewusste Spannung zwischen dem außerhalb Gesehenen und der im Inneren erkannten Sprecherin, ohne diese metaphysisch oder konfessionell auszudeuten.
- issue: Bedeutung von τύπος im Zusammenhang des inneren und äußeren Motivs
  choice: „Abbild“
  alternative: „Muster“ oder „Urbild“
  rationale: „Abbild“ lässt offen, ob eine sichtbare Gestalt, ein Gepräge oder eine Entsprechung gemeint ist. „Urbild“ würde eine hier nicht eindeutig ausgesagte Rangordnung einführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Satzrhythmus. Die Gegenüberstellung von „außerhalb“ und „in euch“ wird ausdrücklich erhalten. Wegen des beschädigten Anfangs und einer wahrscheinlichen OCR-Verlesung wird keine künstliche syntaktische Sicherheit erzeugt.
