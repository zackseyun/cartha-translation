lexical_decisions:
- source_word: ⲓⲥⲭⲩⲥ (griechisches Lehnwort im Koptischen)
  choice: Macht
  rationale: Gibt die Bedeutung von ἰσχύς knapp und würdevoll wieder und bewahrt die zugespitzte Gegenüberstellung; »Stärke« bleibt als mögliche Alternative erhalten.
- source_word: ⲫⲟⲃⲟⲥ (griechisches Lehnwort im Koptischen)
  choice: Furcht
  rationale: Entspricht dem weiten Bedeutungsfeld von φόβος und erhält die theologische wie poetische Spannung, ohne diese zu »Schrecken« zu verschärfen.
theological_decisions:
- issue: Identifikation der Sprecherin zugleich mit Macht und Furcht
  choice: Die paradoxe Selbstaussage bleibt ohne erklärende Auflösung stehen.
  alternative: Die Begriffe als bloße Ursache von Macht beziehungsweise Furcht deuten.
  rationale: Die nominale Parallelstruktur identifiziert die Sprecherin unmittelbar mit beiden Größen; eine kausale Umschreibung würde die echte Spannung des Textes beseitigen.
translation_notes:
  register: Knapp, feierlich und paradox. Die Wiederholung »Ich bin … und ich bin …« wahrt die rhetorische Wucht; geläufige moderne Substantive vermeiden sowohl altertümelnde als auch konfessionell geprägte Sprache.
