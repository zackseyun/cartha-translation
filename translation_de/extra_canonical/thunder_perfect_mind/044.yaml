  text: I am she — the Greek and the barbarian[a][c][d]; I am she who will be manifest[b] in Egypt.
translation:
  language: de
  text: Ich bin sie – die Griechen und die Barbaren[a][c][d]; ich bin sie, die in Ägypten offenbar werden wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Die Griechen und die Barbaren“ bilden ein geläufiges griechisch-römisches Gegensatzpaar: Griechischsprachige stehen dabei allen Nichtgriechen gegenüber. Die Sprecherin nimmt, wie auch sonst in diesem Werk, beide Seiten eines Gegensatzes in sich auf.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „erscheinen“ beziehungsweise „sichtbar werden“. „Offenbar werden“ bewahrt den möglichen Offenbarungsanklang.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Koptischen stehen beide Gruppenbezeichnungen im Plural: „die Griechen … die Barbaren“. Die ungewöhnliche Verbindung mit der einzelnen Sprecherin wurde bewusst beibehalten.'
    reason: parallelism_note
  - marker: d
    text: Vor den hier wiedergegebenen, vergleichsweise klaren Wendungen enthält der OCR-Ausschnitt zwei schwer lesbare Abschnitte. Der beigegebene Konsultationstext entspricht diesen Zeilen nicht; deshalb beschränkt sich die Übersetzung auf den hinreichend sicheren Textbestand.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin sie
  rationale: Die feminine Kopula bezeichnet die Sprecherin grammatisch als weiblich. „Ich bin sie“ bewahrt zugleich den wiederkehrenden, feierlichen Rhythmus ihrer Selbstaussagen.
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: die Griechen
  rationale: Der koptische Pluralartikel bezeichnet „die Griechen“; die Mehrzahl wird im Deutschen quellennah beibehalten.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: die Barbaren
  rationale: Auch hier weist der koptische Artikel auf den Plural. „Barbaren“ gibt den historischen griechisch-römischen Gegenbegriff wieder, ohne ihn modern umzudeuten.
- source_word: ⲥⲉⲓⲛⲉ
  choice: offenbar werden
  rationale: Die Wendung kann ein Erscheinen oder Sichtbarwerden bezeichnen. „Offenbar werden“ erhält den möglichen Offenbarungscharakter, ohne ihn im Haupttext weiter auszudeuten.
- source_word: ⲕⲏⲙⲉ
  choice: Ägypten
  rationale: Der einheimische koptische Landesname wird in seiner geläufigen deutschen Form wiedergegeben.
theological_decisions:
- issue: Identifikation einer einzelnen Sprecherin mit mehreren gegensätzlichen Menschengruppen
  choice: Die grammatisch feminine Selbstaussage und die pluralischen Gruppenbezeichnungen werden nebeneinandergestellt.
  alternative: „Ich bin die Griechin und die Barbarin.“
  rationale: Die Quelle verwendet nach dem vorliegenden Textbestand pluralische Artikel. Die ungewöhnliche Spannung zwischen der einzelnen Sprecherin und den Gruppen soll nicht durch eine singularisierende Deutung aufgelöst werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter poetischer Fremdheit. Der Gedankenstrich markiert die identifizierende Apposition; die Wiederholung „Ich bin sie“ erhält den litaneiartigen Ton. Die historisch belastete Bezeichnung „Barbaren“ bleibt wegen des antiken Gegensatzpaares stehen und wird durch die Fußnote kontextualisiert.
