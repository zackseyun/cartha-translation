base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/024.yaml
  text: 'Know me, let them know me.

    For I am knowledge and ignorance.

    I am shame and boldness.

    I am shameless; I am ashamed.

    I am strength, and'
translation:
  language: de
  text: 'Die Weisen sollen weise sein.[a]


    Denn ich bin das Wissen und die Unwissenheit.


    Ich bin die Scham und der Freimut.[b]


    Ich bin schamlos; ich bin schamhaft.[c]


    Ich bin die Stärke, und …[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Die Weisen sollen weise sein.“ Die erste Form kann auch als Anrede aufgefasst werden: „Ihr Weisen, seid weise.“'
    reason: lexical_alternative
  - marker: b
    text: Das Wort „Freimut“ (ⲡⲁⲣⲣⲏⲥⲓⲁ) kann auch offene Rede, Unerschrockenheit oder selbstbewusstes öffentliches Auftreten bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hier mit „schamhaft“ wiedergegebene ϫⲓⲡⲏⲧ ist nicht dasselbe Wort wie ϣⲓⲡⲉ („Scham“); es kann auch „befangen“ oder „bescheiden“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Der Abschnitt endet im Koptischen mit „und“; die Aussage wird im nächsten Textabschnitt fortgesetzt.
    reason: segment_boundary
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ · ⲙⲁⲣⲟⲩ ⲥⲟⲩⲱⲛⲧ
  choice: Erkennt mich; sie sollen mich erkennen
  rationale: 'ⲥⲟⲩⲱⲛ bedeutet „kennen/erkennen“, und das Suffix -ⲧ bezeichnet hier die Sprecherin als Objekt („mich“). ⲙⲁⲣⲟⲩ trägt jussivische Bedeutung: „sie sollen …“. Die Wiederholung bleibt erhalten.'
- source_word: ⲡⲥⲟⲟⲩⲛ / ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: das Wissen / die Unwissenheit
  rationale: Die geläufigen deutschen Abstrakta geben das paradoxe Gegensatzpaar prägnant und parallel wieder.
- source_word: ⲡϣⲓⲡⲉ
  choice: die Scham
  rationale: „Scham“ ist die direkte, im Kontext passende Entsprechung und wahrt den Gegensatz zum folgenden Freimut.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: der Freimut
  rationale: Das griechische Lehnwort bezeichnet offenes, unerschrockenes und öffentliches Reden. „Freimut“ ist knapp, würdevoll und semantisch weiter als bloße Kühnheit.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: schamlos
  rationale: Die Bildung mit ⲁⲧ- drückt das Fehlen von Scham aus; die adjektivische Wiedergabe erhält die parallele Selbstbezeichnung.
- source_word: ϫⲓⲡⲏⲧ
  choice: schamhaft
  rationale: Das Wort bezeichnet eher Schamhaftigkeit, Befangenheit oder sittsame Zurückhaltung als die zuvor genannte „Scham“. „Schamhaft“ bewahrt sowohl den Unterschied als auch den formalen Gegensatz zu „schamlos“.
- source_word: ⲛⲁϣⲧⲉ
  choice: die Stärke
  rationale: Hier bedeutet das Wort „Stärke/Festigkeit“, nicht „Furcht“. „Stärke“ passt als natürliches deutsches Abstraktum in die Reihe der Identitätsaussagen.
- source_word: ⲁⲩⲱ
  choice: und …
  rationale: Das abschließende „und“ zeigt, dass der Satz im folgenden Abschnitt weitergeht; die Auslassungspunkte machen den fragmentarischen Segmentabschluss sichtbar.
theological_decisions: []
