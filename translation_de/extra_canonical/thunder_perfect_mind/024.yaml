  register: Moderne, würdige Standardsprache mit bewusst knappem, rhythmischem Satzbau. Die wiederholten „Ich bin“-Formeln und die paradoxen Gegenüberstellungen bleiben erhalten. „Freimut“ ist leicht gehoben, aber im Kontext verständlich und sachlich genauer als eine rein psychologische „Kühnheit“.
