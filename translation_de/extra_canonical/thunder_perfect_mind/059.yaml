- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: von
  rationale: 'In Verbindung mit dem Verb des Lernens bezeichnet die Präpositionsverbindung die Quelle: „von jemandem lernen“.'
theological_decisions:
- issue: Paradox der ungelehrten Lehrerin
  choice: Die Spannung zwischen „die Ungelehrte“ und „von mir lernen“ bleibt unvermittelt stehen.
  alternative: Die Sprecherin als verborgen Wissende oder als absichtlich nicht institutionell Gebildete erklären.
  rationale: Der Text entfaltet seine Aussage gerade als Paradox; eine erklärende Auflösung würde eine nicht ausdrücklich formulierte theologische Deutung eintragen.
