lexical_decisions:
- source_word: ⲉⲧϩⲁⲉⲓⲏⲟⲩ
  choice: die Ungelehrte
  rationale: Die feminine substantivierte Form entspricht der weiblichen Sprecherstimme und bewahrt das Paradox einer Person ohne Gelehrsamkeit, von der andere lernen. Wegen der fehleranfälligen OCR stützt sich die Deutung zusätzlich auf den überlieferten Paralleltext.
- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
