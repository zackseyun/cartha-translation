base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/090.yaml
  text: 'Give heed to me in gentleness.[a]

    I am the one who remains upon the face of the earth,[b]

    and I am the one who is cast off the face of the earth.[c]

    I am the preparation of every person.[d][e][f][g]'
translation:
  language: de
  text: '**6.** Achtet in Sanftmut auf mich.[a]


    Ich bin die, die auf der Erde bleibt,[b]


    und ich bin die, die von der Erde weggeworfen wird.[c]


    Ich bin die Vorbereitung jedes Menschen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nehmt in Sanftmut Unterweisung von mir an.“'
    reason: Die koptische Wendung kann sowohl Aufmerksamkeit als auch das Annehmen von Unterweisung ausdrücken.
  - marker: b
    text: 'Die OCR-Lesung dieses Ausdrucks ist fehlerhaft. Nach der korrigierten Lesung heißt es: „die, die bleibt“ oder „fortbesteht“.'
    reason: Textkritischer Hinweis zur erheblichen Abweichung zwischen OCR-Auszug und überprüfter Lesung.
  - marker: c
    text: 'Auch möglich: „verstoßen“ oder „ausgestoßen“. Der Handelnde bleibt im Text ungenannt.'
    reason: Lexikalische Alternative und Wahrung der passiven Offenheit.
  - marker: d
    text: 'Oder: „die Zurüstung jedes Menschen“. Das Ziel oder der Zweck dieser Vorbereitung wird nicht genannt.'
    reason: Lexikalische Alternative und Hinweis auf die echte semantische Offenheit.
lexical_decisions:
- source_word: ⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: Achtet auf mich
  rationale: Die Verbindung aus ϫⲓ („nehmen, empfangen“) und ⲥⲃⲱ („Lehre, Unterweisung“) ist hier als Aufforderung zu aufmerksamer Hinwendung idiomatisch wiedergegeben. Die zweite Person Plural bleibt erhalten.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  choice: in Sanftmut
  rationale: ⲙⲏϣⲉ bezeichnet Sanftmut beziehungsweise Milde. „Sanftmut“ wahrt den würdevollen und ethischen Klang des Ausdrucks.
- source_word: ⲧⲁϣϭⲏⲗ ⲉⲕⲟⲗ (korrigiert nach Handschriftenbefund zu ⲧⲉⲧϭⲱ ⲉⲃⲟⲗ)
  choice: die, die bleibt
  rationale: Der überlieferte OCR-Text ist offenbar verderbt; die revidierte Lesung enthält ϭⲱ ⲉⲃⲟⲗ, „bleiben, fortbestehen“. Die feminine Sprecherstimme wird im Deutschen sichtbar gemacht.
- source_word: ϩⲓϫⲙ ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: auf der Erde / von der Erde
  rationale: Wörtlich „auf dem Angesicht der Erde“. Natürliches Deutsch verkürzt die feste Wendung, während die räumliche Gegenüberstellung erhalten bleibt.
- source_word: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ
  choice: die verstoßen wird
  rationale: ⲛⲟⲩϫⲉ bedeutet „werfen, hinauswerfen“. Die Konstruktion bezeichnet hier ein Weggeworfen- oder Ausgestoßenwerden und bildet den Gegensatz zum Bleiben.
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: die Vorbereitung
  rationale: ⲥⲟⲃⲧⲉ bezeichnet Vorbereitung oder Zurüstung, nicht Furcht. Die substantivische Form wird entsprechend bewahrt.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: jedes Menschen
  rationale: ⲣⲱⲙⲉ meint den Menschen, ⲛⲓⲙ hat distributive Bedeutung („jeder“).
theological_decisions:
- issue: Bedeutung der Aussage „Vorbereitung jedes Menschen“
  choice: Die ungewöhnliche und offene Formulierung wird wörtlich bewahrt.
  alternative: Ich bin die Zurüstung für alle Menschen.
  rationale: Der Text erklärt weder, worauf jeder Mensch vorbereitet wird, noch ob die Sprecherin Vorbereitung als Vorgang, Zustand oder Mittel verkörpert. Diese Spannung soll nicht theologisch aufgelöst werden.
- issue: Aktiv oder passiv beim Verstoßen
  choice: 'Passiv: „die verstoßen wird“'
  alternative: die sich von der Erde wegwirft
  rationale: Die Konstruktion und der revidierte Quellenbefund sprechen für Ausstoßung beziehungsweise Verwerfung; das Passiv lässt den Handelnden ungenannt und wahrt damit die Offenheit des Textes.
translation_notes:
  register: Poetisch-würdiges, zugleich gegenwärtiges Standarddeutsch. Die wiederholte Ich-bin-Formel und der Gegensatz zwischen Bleiben und Verstoßenwerden werden klar hervorgehoben. Das grammatische Femininum der koptischen Sprecherstimme erscheint in den Relativsätzen als „die“.
