lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: sehen
  rationale: Das gewöhnliche sahidische Verb für visuelle Wahrnehmung; „sehen“ bewahrt die schlichte Direktheit und das wiederholte Sehmotiv.
- source_word: ⲉⲃⲟⲗ
  choice: außerhalb von euch
  rationale: Bezeichnet hier die äußere Sphäre und steht im Gegensatz zu ⲉϩⲟⲩⲛ; die Formulierung wahrt diesen räumlichen Kontrast.
- source_word: ⲉϩⲟⲩⲛ
  choice: in euch
  rationale: Bezeichnet im Gegenstück zu ⲉⲃⲟⲗ die innere Sphäre; „in euch“ ist im Deutschen natürlich und lässt die Aussage ungedeutet.
- source_word: ⲟⲣⲁⲧⲟⲛ (griechisches Lehnwort ὁρατόν)
  choice: das Sichtbare
  rationale: Das substantivierte Adjektiv wird knapp und formal entsprechend wiedergegeben und nimmt zugleich das Motiv des Sehens auf.
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (griechisches Lehnwort ἱμάτιον)
  choice: Gewand
  rationale: „Gewand“ entspricht dem konkreten Kleidungsstück und trägt den gehobenen metaphorischen Ton, ohne die Metapher auszulegen.
theological_decisions:
- issue: Verhältnis von äußerer Wahrnehmung, innerer Wahrnehmung und Gewand
  choice: Die drei Aussagen werden ohne erklärende Zusätze nebeneinandergestellt.
  alternative: Das Sichtbare ausdrücklich als äußere Verkörperung oder als geistliches Symbol deuten.
  rationale: Der poetische Text lässt das Verhältnis bewusst spannungsvoll und mehrdeutig; eine metaphysische oder anthropologische Festlegung wäre nicht durch den Wortlaut erzwungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter poetischer Parallelführung. Die Pluralformen „ihr/euch/euer“ entsprechen dem im Material erkennbaren koptischen Pluraladressaten. Semikolon und Wiederholung bewahren den sentenzenhaften Rhythmus.
