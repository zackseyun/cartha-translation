translation:
  language: de
  text: '**3.** Ich bin die Hure[a] und die Heilige[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort ⲡⲟⲣⲛⲏ (pornē) bezeichnet eine Frau, die sexuelle Dienste verkauft. Das neutralere „Prostituierte“ ist ebenfalls möglich; „Hure“ bewahrt hier die stigmatisierende Schärfe des Ausdrucks.
    reason: lexical_alternative
  - marker: b
    text: ⲥⲉⲙⲛⲏ (semnē) bedeutet wörtlich etwa „ehrwürdig“ oder „erhaben“ und kann in diesem Zusammenhang „heilig“ bezeichnen. Möglich wären auch „die Ehrwürdige“ oder „die Erhabene“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: Ich bin
  rationale: Die koptische Kopulakonstruktion bezeichnet eine Identifikation in der ersten Person. „Ich bin“ bewahrt die wiederkehrende Form der Selbstaussagen.
- source_word: ⲡⲟⲣⲛⲏ
  choice: Hure
  rationale: Das griechische Lehnwort bezeichnet eine Frau, die sexuelle Dienste verkauft. „Hure“ bewahrt stärker als das neutralere „Prostituierte“ die stigmatisierende Schärfe und damit den beabsichtigten Gegensatz.
- source_word: ⲥⲉⲙⲛⲏ
  choice: die Heilige
  rationale: Das substantivisch gebrauchte feminine Adjektiv kann „ehrwürdig“, „erhaben“ oder „heilig“ bedeuten. „Die Heilige“ erhält die nominale Parallelität zu „die Hure“ und den religiös zugespitzten Gegensatz.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Schlichte koordinierende Konjunktion ohne erkennbaren zusätzlichen Bedeutungsakzent.
theological_decisions:
- issue: Paradoxe Identität der Sprecherin
  choice: Beide gegensätzlichen Bezeichnungen werden unvermittelt mit „und“ verbunden.
  alternative: Den Gegensatz erklärend abschwächen oder als Wechsel zwischen Rollen auslegen.
  rationale: Der Quelltext lässt die Spannung bewusst stehen und gibt keine Grundlage dafür, sie dogmatisch oder psychologisch aufzulösen.
translation_notes:
  register: Kurze, feierlich-rhythmische Selbstaussage in modernem Standarddeutsch. Die derbe Wirkung von „Hure“ und die sakrale Würde von „die Heilige“ werden bewusst nebeneinandergestellt; die Formulierung bleibt klar und ohne erklärende Zusätze.
