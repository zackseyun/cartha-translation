base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/094.yaml
  text: You hear me in your calling of me[a], in a [...] that you utter. You did not hear[e][d][c][b]. I am the defense.
translation:
  language: de
  text: Ihr hört mich darin, dass ihr mich anruft,[a] in einem […], das ihr äußert.[b] Ihr habt nicht gehört. Ich bin die Verteidigung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in eurem Mich-Anrufen“. Das koptische ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ kann auch „mich rufen“, „nach mir rufen“ oder „mich nennen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Der Text ist in diesem Abschnitt beschädigt. Das Wort nach „in einem“ ist nur mit seinem Anfangsbuchstaben erhalten; der Relativsatz bedeutet wahrscheinlich „das ihr äußert“ oder „das ihr hervorbringt“.
    reason: textual_gap
  - marker: c
    text: Das griechische Lehnwort ⲁⲡⲟⲗⲟⲅⲓⲁ kann „Verteidigung“, „Rechtfertigung“ oder „Antwort“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: Ihr hört mich
  rationale: Die Form ist als Präsens I, nicht als Imperativ, zu verstehen. „Hören“ bewahrt zudem den Bedeutungsumfang von ⲥⲱⲧⲙ und die Wiederaufnahme im negativen Perfekt.
- source_word: 'ⲡⲉⲧⲛⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ (OCR: ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ)'
  choice: dass ihr mich anruft
  rationale: Die Stelle bezeichnet nominalisiert das Rufen beziehungsweise Anrufen der Sprecherin. „Anrufen“ gibt die Ausrichtung auf sie wieder, ohne die Bedeutung auf bloßes Benennen festzulegen.
- source_word: ϩⲛ ⲟⲩⲡ— ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: in einem […], das ihr äußert
  rationale: 'Das Nomen nach dem unbestimmten Artikel ist beschädigt; daher bleibt eine Lücke. Die folgende Form wird als Relativsatz aufgefasst: etwas, das die Angesprochenen hervorbringen oder äußern.'
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: Ihr habt nicht gehört
  rationale: Dies ist ein negatives Perfekt I und kein Bedingungssatz. Das deutsche Perfekt wirkt in gegenwärtiger Standardsprache natürlich und hält den Bezug zum vorherigen „hört“ fest.
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: die Verteidigung
  rationale: Das griechische Lehnwort ἀπολογία kann eine Verteidigung oder verantwortende Antwort bezeichnen. „Verteidigung“ erhält den forensischen Klang und bleibt allgemein verständlich.
theological_decisions:
- issue: Identifikation der Sprecherin mit ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: Ich bin die Verteidigung.
  alternative: Ich bin die Antwort / Rechtfertigung.
  rationale: Die paradoxe Selbstidentifikation wird ohne erklärende Ergänzung beibehalten. „Verteidigung“ macht keine Aussage darüber, vor wem oder wogegen sie erfolgt, und löst die mögliche forensische beziehungsweise antwortende Bedeutung nicht theologisch auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Anrede im Plural wird mit „ihr“ wiedergegeben. Der fragmentarische Zustand des Textes bleibt sichtbar; weder das fehlende Substantiv noch der genaue Sinn der abschließenden Selbstbezeichnung werden ergänzt.
