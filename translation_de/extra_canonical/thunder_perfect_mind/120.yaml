base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/120.yaml
  text: And they will find me in the place that is there, and they will live, and they will not perish. Because of this, do not be disobedient to me.
translation:
  language: de
  text: Und sie werden mich an jenem Ort finden; sie werden leben und nicht zugrunde gehen. Darum zögere nicht, auf mich zu hören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: sie werden mich finden
  rationale: 'Die Form ist futurisch und transitiv: ϭⲓⲛⲉ bedeutet hier „finden“, ⲙⲙⲟⲉⲓ bezeichnet das Objekt „mich“.'
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: an jenem Ort
  rationale: Die idiomatische deutsche Wiedergabe bewahrt die deiktische Bedeutung von ⲉⲧⲙⲙⲁⲩ („dort/jener“), ohne das schwerfällige „an dem Ort, der dort ist“.
- source_word: ⲱⲛϩ
  choice: leben
  rationale: Die Grundbedeutung des Verbs wird knapp und unmittelbar wiedergegeben.
- source_word: ⲥⲱⲧ ⲉⲃⲟⲗ
  choice: zugrunde gehen
  rationale: Die im herangezogenen Textbefund angenommene negative Wendung wird als Gegenpol zu „leben“ wiedergegeben; wegen des beschädigten beziehungsweise unsicheren Wortlauts wird die Unsicherheit in einer Fußnote offengelegt.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: sei mir nicht ungehorsam
  rationale: Die negative Aufforderung wird sinngemäß als verweigerter Gehorsam gegenüber der Sprecherin wiedergegeben. Der Singular von „sei“ bildet die im Koptischen erkennbare singularische Anrede ab.
theological_decisions:
- issue: Bezug und Art des Lebens
  choice: „sie werden leben“ ohne nähere Bestimmung
  alternative: „sie werden ewiges Leben haben“
  rationale: Der Quelltext bestimmt weder Dauer noch theologische Qualität des Lebens ausdrücklich; eine dogmatische Präzisierung wäre ein Zusatz.
- issue: Adressat der Schlussaufforderung
  choice: singularische Anrede „sei“
  alternative: pluralische Anrede „seid“
  rationale: Die Form ⲙⲡⲣ weist auf eine singularische negative Aufforderung. Ein Wechsel zum Plural würde den sichtbaren grammatischen Befund glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An jenem Ort“ wahrt die deiktische Distanz natürlich; das Semikolon erhält den engen Parallelismus der beiden Zukunftsaussagen. Keine im sichtbaren Quelltext nicht belegten Engel- oder Geistergruppen wurden ergänzt.
