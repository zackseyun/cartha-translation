lexical_decisions:
- source_word: ⲡϣⲓⲡⲉ
  choice: die Schande
  rationale: Sahidisch ϣⲓⲡⲉ bezeichnet Scham beziehungsweise Schande, nicht Schweigen. Das wird durch die folgende Gegenüberstellung von Schamlosigkeit und Sich-Schämen bestätigt.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: die Freimütigkeit
  rationale: Das griechische Lehnwort παρρησία bezeichnet offenes, freies und kühnes Reden. „Freimütigkeit“ bewahrt diesen Sinn und bildet einen würdigen Gegensatz zu „Schande“.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: schamlos
  rationale: Die privative Bildung ⲁⲧ- plus ϣⲓⲡⲉ bedeutet „ohne Scham, schamlos“.
- source_word: ⲟⲩϫⲓⲡⲏⲧ (OCR; wahrscheinlich ⲟⲩϫⲓϣⲓⲡⲉ)
  choice: ich schäme mich
  rationale: Die OCR-Form ist wahrscheinlich verderbt. Die im Kontext erwartete Lesung bezeichnet das Sich-Schämen und bildet den ausdrücklichen Gegensatz zu „schamlos“.
- source_word: ⲟⲩⲛⲁϣⲧⲉ
  choice: die Stärke
  rationale: ⲛⲁϣⲧⲉ kann Härte, Kraft oder Stärke bezeichnen. Hier passt die substantivische Wiedergabe „Stärke“ zum parallelen Paar aus abstrakten Gegensätzen.
- source_word: ⲟⲩⲣⲙⲧⲉ (OCR; vermutlich verderbt)
  choice: die Furcht
  rationale: Die überlieferte OCR-Form ist lexikalisch problematisch. Der Textzusammenhang und etablierte Lesungen dieses Gegensatzpaares stützen einen Begriff aus dem Bedeutungsfeld Furcht/Zittern.
- source_word: ⲡⲓⲡⲟⲗⲉⲙⲟⲥ
  choice: der Krieg
  rationale: Das griechische Lehnwort πόλεμος bedeutet klar „Krieg“ und steht im Gegensatz zu εἰρήνη.
- source_word: ϯⲣⲏⲛⲏ
  choice: der Frieden
  rationale: Das griechische Lehnwort εἰρήνη bedeutet „Frieden“.
- source_word: ⲧⲓϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ
  choice: Achtet auf mich!
  rationale: 'Die durch den Zeilenumbruch und die OCR zusammengezogene Wendung ist als Imperativ im Plural zu verstehen: wörtlich etwa „Gebt acht auf mich“.'
- source_word: ⲧⲣⲁⲉⲓⲏⲟⲩ
  choice: die Entehrte
  rationale: Die feminine substantivierte Form bezeichnet die Sprecherin als eine, die entehrt beziehungsweise in Schande gebracht wurde. Die knappe Nominalform erhält den poetischen Ton.
theological_decisions:
- issue: Paradoxe Selbstaussagen der Sprecherin
  choice: Die gegensätzlichen Identitätsaussagen bleiben unaufgelöst nebeneinander stehen.
  alternative: Die Aussagen als innere Zustände, Rollen oder zeitliche Abfolgen erklären.
  rationale: Der Ausgangstext gestaltet die Spannung bewusst durch parallele Ich-bin-Sätze. Eine erklärende Harmonisierung würde die poetische und theologische Offenheit einschränken.
- issue: Geschlecht der letzten Selbstbezeichnung
  choice: „die Entehrte“ in femininer Form
  alternative: geschlechtsneutral „die entehrte Person“ oder maskulin-generisch „der Entehrte“
  rationale: Das koptische feminine Bezugselement und die weibliche Sprecherstimme rechtfertigen die feminine deutsche Form.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen, rhythmisch parallelen Sätzen. Die wiederholten Artikel in „die Stärke“, „die Furcht“, „der Krieg“ und „der Frieden“ tragen den feierlichen Charakter der Selbstaussagen. Der Imperativ ist wegen der koptischen Pluralform mit „Achtet“ wiedergegeben.
