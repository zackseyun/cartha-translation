  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: de
  text: 'Ich bin die Schande und die Freimütigkeit[a].


    Ich bin schamlos; ich schäme mich.


    Ich bin die Stärke, und ich bin die Furcht[b].


    Ich bin der Krieg und der Frieden.


    Achtet auf mich!


    Ich bin die Entehrte[c].'
