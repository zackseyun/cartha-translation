  yaml_path: translation/extra_canonical/thunder_perfect_mind/111.yaml
  text: 'to him who created me[a].

    I am the one who will cry out his name.

    Look then at his words,

    and all the writings that have been completed.

    Listen therefore, you hearers,

    and you yourselves also[c][b], the angels'
translation:
  language: de
  text: '[…] vor dem, der mich erschaffen hat.[a]


    Ich bin diejenige, die seinen Namen ausrufen wird.


    Seht nun auf seine Worte

    und auf alle Schriften, die vollendet worden sind.


    Hört also, ihr Zuhörenden,

    und auch ihr selbst, ihr Engel …[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausschnitt setzt mitten im Satz ein. Wörtlich kann die Wendung auch „bei dem/zu dem, der mich erschaffen hat“ bedeuten.
    reason: fragment_and_lexical_alternative
  - marker: b
    text: Das letzte Wort ist im vorliegenden Ausschnitt abgebrochen; der Text wird nach „Engel“ fortgesetzt. Mehrere Formen in diesen Zeilen sind im OCR entstellt und wurden nach dem erkennbaren koptischen Zusammenhang wiedergegeben.
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲉⲣⲁⲧϥ
  choice: vor dem
  rationale: Die koptische Wendung bezeichnet das Stehen beziehungsweise die Gegenwart vor jemandem. Da der Ausschnitt mitten im Satz einsetzt, markiert die Auslassung den fehlenden Anfang.
- source_word: ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: der mich erschaffen hat
  rationale: ⲧⲁⲙⲓⲟ bedeutet hier „erschaffen/machen“; die Relativform und das Objektsuffix werden im Deutschen natürlich wiedergegeben.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Ich bin es
  rationale: Die betonte Selbstbezeichnung bleibt erhalten; „Ich bin es“ vermeidet eine im Deutschen unnötige Festlegung durch „derjenige/diejenige“.
- source_word: ⲧⲛⲁⲭⲱ ⲙ̄ⲡⲉϥⲣⲁⲛ ⲉⲃⲟⲗ
  choice: die seinen Namen ausrufen wird
  rationale: Die Konstruktion bezeichnet voraussichtlich das laute Äußern oder Ausrufen des Namens. „Ausrufen“ bewahrt den öffentlichen, stimmlichen Charakter.
- source_word: ϣⲁϫⲉ
  choice: Worte
  rationale: Im Zusammenhang mit der Aufforderung zum Hinsehen bezeichnet das Wort hier eher einzelne Worte beziehungsweise Aussagen als den abstrakten Vorgang des Sprechens.
- source_word: ⲛⲉⲥϩⲁⲓ (im OCR offenbar als ⲛⲉⲥⲙⲏ entstellt)
  choice: Schriften
  rationale: Die von der Handschrift und der revidierten Lesung gestützte Form bezeichnet Geschriebenes; „Schriften“ passt zum parallelen „Worte“ und zum Vollendetwerden.
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: Zuhörenden
  rationale: Das griechische Lehnwort ἀκροατής bezeichnet Hörer oder Zuhörer. Die substantivierte Partizipform klingt im modernen Deutsch unmittelbar und inklusiv.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉ…
  choice: ihr Engel …
  rationale: Der am Ausschnittsende abgebrochene Ausdruck beginnt erkennbar mit dem griechischen Lehnwort für „Engel“. Die Auslassung wahrt den fragmentarischen Befund.
theological_decisions:
- issue: Geschlecht der sprechenden Ich-Gestalt
  choice: „Ich bin es, die …“
  alternative: „Ich bin derjenige/diejenige, der/die …“
  rationale: Das Relativpronomen richtet sich im Deutschen nach der im Werk weiblich auftretenden Sprecherstimme, während „Ich bin es“ die koptische Kopula nicht zu einer weitergehenden ontologischen oder geschlechtlichen Aussage ausbaut.
- issue: Bezug von „seinen Namen“
  choice: Das männliche Pronomen bleibt ohne Identifikation stehen.
  alternative: Den Namensträger ausdrücklich als Gott oder Schöpfer bestimmen.
  rationale: Der Ausschnitt identifiziert den Bezug nur durch „der mich erschaffen hat“. Eine präzisere theologische Benennung würde die offene Referenz des Textes unzulässig festlegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen poetischen Zeilen. Imperative und direkte Anrede bewahren den verkündigenden Ton. Auslassungszeichen kennzeichnen ausschließlich die fragmentarischen Ränder des gelieferten Ausschnitts.
