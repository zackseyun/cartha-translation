  yaml_path: translation/extra_canonical/thunder_perfect_mind/042.yaml
  text: For why do you hate me[a], O Greeks? Because I am a barbarian? And I am the knowledge of the Greek and the barbarian[d][c][b]. I am the judgment.
translation:
  language: de
  text: '**7.** Warum hasst ihr mich denn, ihr Griechen?[a] Weil ich eine Barbarin bin? Ich bin die Erkenntnis des Griechen und des Barbaren. Ich bin das Urteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende OCR-Wiedergabe ist an dieser Stelle stark entstellt. Der Zusammenhang und die rekonstruierbaren Buchstaben ergeben die Anrede „ihr Griechen“ sowie im Folgenden den Gegensatz zwischen Grieche und Barbar.
    reason: textual_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ
  choice: Warum … denn
  rationale: Gibt die begründend-nachdrückliche Fragepartikel natürlich wieder, ohne ein im Deutschen schwerfälliges „Denn warum“ zu erzwingen.
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: hasst ihr
  rationale: Die Verbform richtet sich an mehrere Angesprochene; das Präsens wahrt die unmittelbare Anklage.
- source_word: ⲛⲉⲓⲉⲗⲗⲏⲛ (im OCR entstellt)
  choice: ihr Griechen
  rationale: Der rekonstruierbare griechische Volksname steht als Anrede; die deutsche Anrede macht den syntaktischen Bezug deutlich.
- source_word: ⲧⲃⲁⲣⲃⲁⲣⲟⲥ (im OCR entstellt)
  choice: eine Barbarin
  rationale: Bewahrt den antiken Gegensatz „Grieche/Barbar“ und zugleich das grammatisch weibliche Selbstzeugnis der Sprecherin. Eine Glättung zu „Fremde“ würde die zugespitzte Wortwahl abschwächen.
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: die Erkenntnis
  rationale: „Erkenntnis“ gibt das abstrakte Wissen als personifizierte Größe würdig wieder; „Kenntnis“ wäre zu sachlich, „Wissen“ weniger prägnant.
- source_word: ⲡϩⲁⲡ (OCR ⲫⲁⲡ)
  choice: das Urteil
  rationale: Das koptische Wort bezeichnet Urteil beziehungsweise Gericht. „Urteil“ lässt offen, ob der richterliche Spruch oder das Richten als Wirklichkeit im Vordergrund steht.
theological_decisions:
- issue: Identität der Sprecherin mit der Erkenntnis
  choice: „Ich bin die Erkenntnis“
  alternative: „Ich kenne den Griechen und den Barbaren“
  rationale: Die nominale Selbstprädikation des koptischen Textes wird beibehalten. Sie darf nicht zu einer bloßen Aussage über das Wissen der Sprecherin abgeschwächt werden.
- issue: Reichweite von „Urteil/Gericht“
  choice: „Ich bin das Urteil“
  alternative: „Ich bin das Gericht“
  rationale: „Urteil“ ist im Deutschen weniger institutionell und bewahrt die personifizierte, spannungsvolle Selbstaussage. Die mögliche Bedeutung „Gericht“ wird nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzer rhetorischer Satzfolge. Der historisch zugespitzte Ausdruck „Barbarin“ bleibt erhalten, weil er den anschließenden Gegensatz trägt; er bezeichnet hier aus griechischer Sicht eine Nichtgriechin. Die generischen Singularformen „des Griechen und des Barbaren“ folgen der pointierten Parallelstruktur der Quelle.
