base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: de
  text: '**6.** Ich bin der Geist[a]


    und meine Ruhe.


    Ich bin die Erkenntnis meines Suchens nach mir selbst


    und das Suchen derer, die mich suchen,


    und der Befehl derer, die mich bitten,


    und die Stimme der Stimmen am Ort der Götter.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲡⲛⲟⲩⲥ ist ein Lehnwort aus dem Griechischen (νοῦς) und kann auch „Verstand“ oder „Intellekt“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der Schluss des Ausdrucks ist offenbar verkürzt überliefert. Wahrscheinlich ist „der Götter“ zu lesen; möglich wären bei anderer Ergänzung auch „Gottes“ oder „des Gottes“.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: Geist
  rationale: Das griechische Lehnwort νοῦς bezeichnet Geist, Verstand oder Intellekt. „Geist“ ist im Deutschen würdig und zugänglich; die Fußnote hält die stärker kognitive Alternative offen.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: meine Ruhe
  rationale: Das Possessivpräfix ⲧⲁ- ist feminin Singular der ersten Person; daher „meine“, nicht „deine“. Das griechische Lehnwort ἀνάπαυσις umfasst Ruhe und Rast.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: die Erkenntnis
  rationale: Das nominal gebrauchte ⲥⲟⲟⲩⲛ bedeutet Wissen oder Erkennen. „Erkenntnis“ passt zum feierlichen Kontext und bewahrt den nominalen Parallelismus.
- source_word: ⲙⲡⲁϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: meines Suchens nach mir selbst
  rationale: Die zugrunde liegende Lesung enthält ϣⲓⲛⲉ „suchen“ und ⲛⲥⲱⲓ „nach mir“, nicht γένος „Art“ oder „Geschlecht“. Die reflexive Wiedergabe bildet die Wiederaufnahme der Sprecherin ab.
- source_word: ⲡϣⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: das Suchen derer, die mich suchen
  rationale: Die Wiederholung der Wurzel „suchen“ wird erhalten; ⲛⲥⲱⲉⲓ ist hier „nach mir/mich“ und nicht „klein“.
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: der Befehl
  rationale: ⲟⲩⲁϩⲥⲁϩⲛⲉ ist das gebräuchliche koptische Wort für Befehl, Gebot oder Anweisung. „Befehl“ wahrt die starke Aussage, ohne sie zu einer Gemeinschaft umzudeuten.
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: derer, die mich bitten
  rationale: Das griechische Lehnverb αἰτεῖν bedeutet bitten, fordern oder erbitten. „Bitten“ lässt die genaue Art des Verlangens offen.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: die Stimme der Stimmen
  rationale: ⲥⲙⲏ bedeutet „Stimme“ oder „Klang“, nicht „Name“. Die formelhafte Wiederholung wird wörtlich bewahrt.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: am Ort der Götter
  rationale: Der überlieferte Wortlaut scheint am Zeilen- oder Seitenschluss verkürzt zu sein; wahrscheinlich ist griechisch θεῶν „der Götter“ gemeint. Die Ortsangabe wird natürlich mit „am Ort“ wiedergegeben.
theological_decisions:
- issue: Identität der Sprecherin mit νοῦς
  choice: „Ich bin der Geist“
  alternative: „Ich bin der Verstand/Intellekt“
  rationale: Die Identitätsaussage bleibt uneingeschränkt stehen. „Geist“ wird weder als Heiliger Geist bestimmt noch rein psychologisch verengt.
- issue: Genitiv bei „Befehl“
  choice: „der Befehl derer, die mich bitten“
  alternative: „der Befehl für diejenigen, die mich bitten“
  rationale: Der koptische Genitiv wird formal bewahrt, obwohl die Beziehung semantisch ungewöhnlich ist; eine Ziel- oder Empfängerbeziehung wird nicht stillschweigend ergänzt.
- issue: Singular oder Plural im Schlussausdruck
  choice: „der Götter“
  alternative: „Gottes“ oder „des Gottes“
  rationale: Die wahrscheinliche Ergänzung θεῶν und der kritisch revidierte Text sprechen für den Plural. Wegen des verkürzten Befunds wird die Unsicherheit ausdrücklich vermerkt.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit kurzen, parallel gebauten Identitätsaussagen. Die anaphorische Struktur und die absichtlich spannungsreichen Genitive bleiben erhalten; technische koptologische Erläuterungen stehen nur in den Fußnoten.
