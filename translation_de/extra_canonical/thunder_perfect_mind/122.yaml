base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/122.yaml
  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: de
  text: 'Und seid nicht ohne Erkenntnis über mich an einem anderen Ort oder zu einer anderen Zeit.[a] Seid nicht ohne Erkenntnis über mich. Seid nicht ohne Erkenntnis über mich an einem anderen Ort oder zu einer anderen Zeit.


    Denn ich bin die, die geworden ist, und die, die werden wird.[b]


    Ich bin die Nachsicht,[c] und die, die werden wird.


    Ich bin die Nachsicht, und die, die werden wird.


    Ich bin die Nachsicht, und die, die werden wird.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Seid nicht ohne Erkenntnis über mich.“ Möglich ist auch: „Verkennt mich nicht“ oder „Seid nicht unwissend über mich.“'
    reason: lexical_alternative
  - marker: b
    text: Das koptische ϣⲱⲡⲉ kann „geschehen“, „werden“ oder „ins Dasein kommen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Nachsicht“ gibt ein Wort wieder, das auch „Verzeihung“, „Verständnis“ oder „Einverständnis“ bedeuten kann.
    reason: lexical_alternative
  - marker: d
    text: Die dreifache Wiederholung steht im vorliegenden OCR-Auszug. Der Auszug endet anschließend mitten im Satz mit „und“; zudem ist seine Zuordnung zum beigegebenen Konsultationstext unsicher.
    reason: textual_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: seid nicht ohne Erkenntnis über mich
  rationale: ⲙⲡⲣ- bildet den verneinten Imperativ; ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ bedeutet wörtlich „ohne Wissen/Erkenntnis sein“, nicht kausativ „bekannt machen“. Die bewusst leicht fremdartige Formulierung bewahrt das Wortspiel mit Erkenntnis besser als das glattere „verkennt mich nicht“.
- source_word: ⲕⲉⲙⲁ / ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: ein anderer Ort / eine andere Zeit
  rationale: ⲙⲁ bezeichnet einen Ort; ⲟⲩⲟⲉⲓϣ bedeutet hier „Zeit, Zeitpunkt“ und nicht „Menge“.
- source_word: ϣⲱⲡⲉ
  choice: geworden ist / werden wird
  rationale: Das Verb kann „geschehen“, „werden“ oder „ins Dasein kommen“ bedeuten. „Werden“ erhält sowohl den zeitlichen als auch den ontologischen Klang.
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: Nachsicht
  rationale: Das griechische Lehnwort συγγνώμη umfasst Nachsicht, Verzeihung, Verständnis und Einverständnis. „Nachsicht“ eignet sich als personifizierter Selbsttitel, ohne die Bedeutung rein juristisch oder rein erkenntnismäßig festzulegen.
theological_decisions:
- issue: Selbstaussage über Gewordensein und künftiges Werden
  choice: „die geworden ist, und die, die werden wird“
  alternative: „die war und die sein wird“
  rationale: Die Übersetzung vermeidet eine Angleichung an bekannte Gottesformeln und bewahrt das im Quellverb ϣⲱⲡⲉ liegende Werden.
- issue: Personifikation von ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: „Ich bin die Nachsicht“
  alternative: „Ich bin die Vergebung“ oder „Ich bin das Verständnis“
  rationale: Die polyvalente Selbstbezeichnung wird nicht auf eine bestimmte soteriologische oder erkenntnistheoretische Deutung verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anaphorischen Wiederholungen und die paradoxe Selbstrede bleiben erhalten. Die feminine Form „die“ folgt der weiblichen Sprechergestalt und dem femininen deutschen Titelwort „Nachsicht“. Wegen des mutmaßlich maschinell wiederholten und am Ende abgebrochenen OCR-Textes wird der Befund nicht stillschweigend geglättet.
