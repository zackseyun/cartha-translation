translation:
  language: de
  text: '**4.** Ich bin die Frau[a] und die Jungfrau[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort ⲥϩⲓⲙⲉ kann „Frau“ oder „Ehefrau“ bedeuten. „Ehefrau“ würde den Gegensatz zu „Jungfrau“ stärker hervorheben.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ ist ein griechisches Lehnwort und bedeutet gewöhnlich „Jungfrau“; in poetischer Sprache wäre auch „Maid“ möglich.
    reason: lexical_alternative
  - marker: c
    text: Im OCR-Text ist ⲡⲁⲣⲑⲉⲛⲟⲥ durch einen Zeilenumbruch getrennt (ⲡⲁⲣ | ⲑⲉⲛⲟⲥ). Daher sind die genauen Grenzen dieses Abschnitts nur mit mittlerer Sicherheit bestimmt.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin
  rationale: Bewahrt den wiederkehrenden Ich-bin-Rhythmus der Rede und gibt die feminine koptische Kopula im Deutschen natürlich wieder.
- source_word: ⲧⲉⲥϩⲓⲙⲉ
  choice: die Frau
  rationale: ⲥϩⲓⲙⲉ kann sowohl „Frau“ als auch „Ehefrau“ bedeuten. „Frau“ bewahrt diese Mehrdeutigkeit im Haupttext, während „Ehefrau“ als mögliche, den Gegensatz verschärfende Lesart in der Fußnote genannt wird.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die gewöhnliche koordinierende Konjunktion erhält die knappe Parallelstruktur.
- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: die Jungfrau
  rationale: Das griechische Lehnwort bezeichnet gewöhnlich eine Jungfrau; diese Wiedergabe erhält die Spannung zu „Frau“ beziehungsweise „Ehefrau“.
theological_decisions:
- issue: Spannung zwischen sozialer beziehungsweise ehelicher Stellung und Jungfräulichkeit
  choice: Die paradoxe Verbindung bleibt ohne Erklärung oder Harmonisierung stehen.
  alternative: „Ehefrau und Jungfrau“, wodurch der eheliche Gegensatz ausdrücklich verstärkt würde.
  rationale: Der koptische Ausdruck ⲥϩⲓⲙⲉ ist lexikalisch mehrdeutig. Der Haupttext soll weder eine bestimmte symbolische noch eine konfessionelle Deutung festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe anaphorische Form des koptischen Textes bleibt erhalten; die lexikalische Mehrdeutigkeit von ⲥϩⲓⲙⲉ wird im Haupttext nicht vorschnell auf „Ehefrau“ verengt.
