base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: de
  text: 'Überall bin ich die, die man »Tod« nennt.[a]


    Ich bin die, die man »Gesetz« nennt; ihr aber habt mich »Gesetzlosigkeit« genannt.


    Ich bin die, die ihr verfolgt habt, und ich bin die, die ihr ergriffen habt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die erste Aussage ist in dem vorliegenden OCR-Ausschnitt unsicher abgegrenzt. ϩⲛ ⲙⲁ ⲛⲓⲙ bedeutet gewöhnlich »an jedem Ort« oder »überall«; Teile der Benennungsformel könnten durch Zeilen- oder Segmentgrenzen gestört sein.
    reason: textual
lexical_decisions:
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: überall
  rationale: Die reguläre Segmentierung der zusammengezogenen OCR-Form ergibt wörtlich »an jedem Ort«. »Überall« gibt die distributiv-lokale Bedeutung natürlich und präzise wieder; eine Deutung als »unter den Völkern« ist sprachlich weniger wahrscheinlich.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ ϫⲉ
  choice: die man … nennt
  rationale: Die Konstruktion bezeichnet das Benennen einer Person. Das unpersönliche »man« gibt das generische bzw. habituelle dritte Person Plural im Deutschen idiomatisch wieder.
- source_word: ⲡⲙⲟⲩ
  choice: »Tod«
  rationale: Obwohl der bestimmte Artikel im Koptischen steht, fungiert das Wort hier als Benennung oder Titel; daher wird es ohne deutschen Artikel und mit Anführungszeichen wiedergegeben.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: »Gesetz«
  rationale: Das griechische Lehnwort νόμος hat hier den üblichen Sinn »Gesetz« und bildet den beabsichtigten formalen Gegensatz zu ἀνομία.
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: »Gesetzlosigkeit«
  rationale: »Gesetzlosigkeit« bewahrt die Wortverwandtschaft und den Gegensatz zu »Gesetz« deutlicher als Alternativen wie »Unrecht« oder »Frevel«.
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: Ich bin die, die …
  rationale: Die feminine Kopula wird bewahrt; zugleich bleibt die wiederholte »Ich bin«-Formel als prägendes rhetorisches Element erhalten.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: verfolgt habt
  rationale: Die Verbindung bedeutet idiomatisch »hinter jemandem herlaufen, verfolgen«. »Verfolgt« wahrt den zielgerichteten und konfrontativen Sinn.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: ergriffen habt
  rationale: Das Verb kann »ergreifen, festhalten, sich bemächtigen« bedeuten. »Ergriffen« passt zur konkreten Handlung und zum Parallelismus mit »verfolgt«.
theological_decisions:
- issue: Personifikation von Gesetz und Gesetzlosigkeit
  choice: Beide Begriffe bleiben als zitierte Benennungen der Sprecherin stehen.
  alternative: Die Begriffe erklärend als moralische Eigenschaften oder Mächte auslegen.
  rationale: Der Text setzt die gegensätzlichen Benennungen bewusst nebeneinander und löst ihre theologische Spannung nicht auf; die Übersetzung soll dies ebenfalls nicht tun.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer anaphorischer Wiederholung. Die feminine Selbstbezeichnung und der Wechsel zwischen habituellem »man nennt« und abgeschlossenem »ihr habt … genannt« bleiben erhalten.
