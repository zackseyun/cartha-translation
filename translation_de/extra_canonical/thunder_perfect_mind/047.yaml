  source_fidelity: 'Die Übersetzung folgt dem koptischen Wortlaut in den wesentlichen Punkten: ϩⲛ ⲙⲁ ⲛⲓⲙ wird plausibel als „Überall“ wiedergegeben; die weibliche Selbstprädikation bleibt erhalten; die Benennungen „Tod“, „Gesetz“ und „Gesetzlosigkeit“ sind korrekt und der Gegensatz von νόμος und ἀνομία wird gewahrt. Das habituelle generische Benennen („man … nennt“) und das abgeschlossene Anreden der zweiten Person Plural („ihr … habt … genannt“) sind angemessen unterschieden. Auch „verfolgt“ und „ergriffen“ geben die abschließenden Verben idiomatisch und ausreichend genau wieder.'
