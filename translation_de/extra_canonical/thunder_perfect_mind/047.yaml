  terminology: „Gesetz“ / „Gesetzlosigkeit“ bewahrt die formale und semantische Antithese der griechischen Lehnwörter. Die Anführungszeichen markieren die Begriffe zutreffend als zugeschriebene Namen, ohne sie dogmatisch auszudeuten. Die Fußnote ist korrekt an die aufgrund des OCR-Ausschnitts besonders relevante erste Aussage gebunden.
