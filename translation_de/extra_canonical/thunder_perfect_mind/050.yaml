    rationale: Die Bedeutung „deren Gott groß ist“ ist die etablierte Wiedergabe der vorliegenden Wendung. Eine Fußnote, die nur eine angebliche Beschädigung behauptet, schwächt die Übersetzung ohne textlichen Gewinn.
