  source_fidelity: 'Der Entwurf folgt im Wesentlichen dem tatsächlich vorgelegten koptischen Ausschnitt statt der fehlzugeordneten englischen Hass/Liebe-Passage. Die Auslassung „[unleserlich]“ ist jedoch nicht gerechtfertigt: Die überlieferte Sequenz nach „schamlos“ ist lesbar und enthält die Selbstbezeichnung als „gottlos“. Auch „deren Gott groß ist“ entspricht der geläufigen Bedeutung der abschließenden Wendung; die OCR bietet keinen Anlass, diese Stelle als bloß beschädigt auszugeben.'
  naturalness: Die Syntax ist überwiegend natürlich und bewahrt den knappen, paradoxen Duktus. „im Inneren erkannt“ ist verständlich; „innerlich erkannt“ klingt im Deutschen etwas geschlossener. Die Wiederholung „Ich, ich“ soll als stilistische Nachbildung der emphatischen Wiederholung erhalten bleiben.
  terminology: „gottlos“ gibt ⲟⲩⲁⲧⲛⲟⲩⲧⲉ treffend wieder. Die weibliche Form „die“ muss durchgehend bewahrt werden. „Jungfrau“ ist im vorgelegten Coptic-Ausschnitt nicht belegt und darf weder im Haupttext noch als textkritische Behauptung eingeführt werden.
