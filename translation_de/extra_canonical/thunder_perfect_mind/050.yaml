  text: '...outwardly[a], and you knew me inwardly. I am she before whom you were ashamed, and you were shameless. I, I am godless, and I am the virgin[b], her God.'
translation:
  language: de
  text: … nach außen, und ihr habt mich innerlich erkannt. Ich bin die, vor der ihr euch geschämt habt, und ihr seid schamlos geworden. Ich, ich bin gottlos, und ich bin die, deren Gott groß ist.
