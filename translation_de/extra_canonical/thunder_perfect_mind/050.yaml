lexical_decisions:
- source_word: ⲁⲧⲉⲧⲛⲥⲟⲟⲩⲛ
  choice: ihr habt … erkannt
  rationale: Die Perfektform bezeichnet eine bereits vollzogene Erkenntnis; „erkannt“ passt zum inneren Erkennen und bleibt im Deutschen natürlich.
- source_word: ϩⲧⲉϩⲟⲩⲛ
  choice: im Inneren
  rationale: Gibt den räumlich-metaphorischen Gegensatz zum vorausgehenden „nach außen“ wieder, ohne ihn dogmatisch auszudeuten.
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: vor der ihr euch geschämt habt
  rationale: Bewahrt die weibliche Selbstbezeichnung der Sprecherin und gibt die Schamrelation idiomatisch wieder.
- source_word: ⲁⲧⲉⲧⲛⲣⲁⲧϣⲓ
  choice: ihr seid schamlos geworden
  rationale: Die privative Bildung wird als Gegensatz zu „sich schämen“ wiedergegeben; „geworden“ trägt dem verbalen Ausdruck Rechnung.
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: gottlos
  rationale: Die Bildung aus privativem ⲁⲧ- und „Gott“ bedeutet „ohne Gott/gottlos“, nicht „Göttin“.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: ich bin die
  rationale: Erhält die wiederkehrende weibliche Ich-bin-Formel und ihren feierlichen Parallelismus.
theological_decisions:
- issue: Bedeutung von „gottlos“ neben „deren Gott groß ist“
  choice: Beide gegensätzlichen Aussagen bleiben unvermittelt nebeneinander stehen.
  alternative: „ohne Gott“ abschwächen oder den Gegensatz harmonisierend erklären
  rationale: Der paradoxe Selbstpreis ist ein konstitutives Merkmal des Textes; eine theologische Auflösung würde die Spannung des Originals beseitigen.
- issue: Unsichere Zeile vor ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: Als unleserlich kennzeichnen, statt „Jungfrau“ oder die erwartete Hass/Liebe-Antithese einzusetzen.
  alternative: Den englischen Konsultationstext oder eine vermutete Rekonstruktion in den Haupttext übernehmen
  rationale: Die vorgelegte OCR-Zeile stützt diese Ergänzungen nicht hinreichend. Die Übersetzung folgt daher vorrangig dem tatsächlich übermittelten koptischen Ausschnitt.
translation_notes:
  register: Moderner, würdevoller Standarddeutschstil mit bewusst knappem, rhythmischem Parallelismus. Die feminine Sprecherform und die wiederholte Ich-bin-Formel bleiben erhalten. Der Ausschnitt beginnt mitten im Satz; deshalb steht am Anfang eine Auslassungsmarke.
