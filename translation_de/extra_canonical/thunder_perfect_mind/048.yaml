base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: de
  text: 'Und ihr habt mich »Gesetzlosigkeit« genannt.

    Ich bin die, die ihr verfolgt habt;

    und ich bin die, die ihr ergriffen habt.

    Ich bin die, die ihr zerstreut habt,

    und ihr habt erkannt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorgelegte OCR-Text lautet hier »und ihr habt erkannt«. Möglicherweise ist jedoch ein ähnlich geschriebenes koptisches Wort für »sammeln« gemeint; dann entstünde der Gegensatz: »die ihr zerstreut habt, und ihr habt gesammelt«.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: nennen
  rationale: Das gebräuchliche koptische Verb bedeutet »rufen, nennen«. Der affirmative Perfekt des vorliegenden Textes wird beibehalten.
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: Gesetzlosigkeit
  rationale: Das griechische Lehnwort anomia wird wörtlich und ohne zusätzliche konfessionelle Deutung wiedergegeben.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: die ihr verfolgt habt
  rationale: Die Verbindung bezeichnet das Hinterherlaufen beziehungsweise Verfolgen; ⲛⲥⲱⲥ nimmt die feminine Bezugsgröße resumptiv auf.
- source_word: ⲙⲁϩⲧⲉ
  choice: ergreifen
  rationale: »Ergreifen« bewahrt sowohl den körperlichen Zugriff als auch die mögliche übertragene Bedeutung, ohne vorschnell »verhaften« festzulegen.
- source_word: ϫⲟⲟⲩ ⲉⲃⲟⲗ
  choice: zerstreuen
  rationale: Die Wendung bezeichnet hier das Aussenden beziehungsweise Zerstreuen, nicht das ähnlich geschriebene »ausrufen«.
- source_word: ⲥⲟⲟⲩⲛ
  choice: erkennen
  rationale: Der überlieferte OCR-Text bietet das Verb »wissen/kennen/erkennen« im affirmativen Perfekt. Das fehlende ausdrückliche Objekt bleibt wie in der Quelle offen.
theological_decisions:
- issue: Paradoxe Identifikation der Sprecherin als »Gesetzlosigkeit«
  choice: Die Aussage bleibt als zugeschriebene Benennung stehen.
  alternative: 'Die erste Zeile als Verbot zu lesen: »Nennt mich nicht Gesetzlosigkeit.«'
  rationale: Die im vorliegenden Quelltext sichtbare Form ist ein affirmativer Perfekt. Eine Negation wäre textlich nicht ausgewiesen und würde die Spannung eigenmächtig auflösen.
- issue: Schlussverb und möglicher Gegensatz zu »zerstreuen«
  choice: »und ihr habt erkannt« nach dem tatsächlich vorgelegten ⲥⲟⲟⲩⲛ
  alternative: 'Bei einer vermuteten OCR-Korrektur zu ⲥⲱⲟⲩϩ: »und ihr habt gesammelt«'
  rationale: Die plausible Konjektur erzeugt einen eleganten Gegensatz, ist aber nicht die Lesart des bereitgestellten Quellenausschnitts und wird deshalb nur angemerkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, rhythmisch parallelen Zeilen. Das wiederholte feminine »Ich bin die« bildet die grammatische Form und den litaneiartigen Charakter des koptischen Textes ab. Die Anführungszeichen kennzeichnen »Gesetzlosigkeit« als zugeschriebene Bezeichnung.
