  source_fidelity: 'Die Übersetzung folgt dem vorgelegten koptischen Wortlaut: affirmative Anrede („ihr habt ... genannt“), feminines Relativprädikat, Verfolgung, Ergreifen, Zerstreuen sowie affirmatives Schlussverb. Insbesondere wird weder eine nicht belegte Negation in die erste Zeile noch ein negatives Schlussverb eingeführt.'
