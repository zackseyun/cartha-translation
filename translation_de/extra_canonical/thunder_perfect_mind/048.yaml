  terminology: „Gesetzlosigkeit“ gibt das griechische Lehnwort anomia sachlich und ohne konfessionelle Überdeutung wieder. „Verfolgt“, „ergriffen“ und „zerstreut“ sind semantisch passend; die wiederholte feminine Form „die“ trägt die Form des koptischen Textes.
