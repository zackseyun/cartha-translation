base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: de
  text: '**12.** Und stoßt mich nicht hinaus zu denen, denen es an Nutzlosigkeit fehlt.[a] Denn ich, ich bin barmherzig und hartherzig zugleich.[b] Hasst meinen Gehorsam nicht; und meine Selbstbeherrschung – liebt sie in meiner Schwachheit.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter denen, denen es an Nutzlosigkeit/Wertlosigkeit fehlt“. Die Wendung ist bewusst paradox. Im vorliegenden koptischen Wortlaut steht weder ein Verb für „sehen“ noch ein Wort für „Misthaufen“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen ein „weichherziger“ und ein „herzloser/hartherziger“ Mensch einander gegenüber.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „meine Enthaltsamkeit“. „In meiner Schwachheit“ gibt den knappen koptischen Ausdruck wieder, ohne sein Verhältnis zur Selbstbeherrschung näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: stoßt mich nicht hinaus
  rationale: Die prohibitive Form mit ⲙ̄ⲡⲣ̄ und ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ bezeichnet ein Hinauswerfen oder Ausstoßen. Das im Ausschnitt nicht ausdrücklich genannte Objekt wird aus dem Kontext als „mich“ ergänzt.
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: denen es an Nutzlosigkeit fehlt
  rationale: ⲛⲉⲧ ϣⲁⲁⲧ bezeichnet diejenigen, denen etwas fehlt; das griechisch geprägte Abstraktum verweist auf Nutzlosigkeit oder Wertlosigkeit. Die paradoxe Aussage wird nicht zu einem Misthaufenbild umgedeutet.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ … ⲟⲩⲁⲧϩⲏⲧ
  choice: barmherzig … hartherzig
  rationale: Das erste Wort bezeichnet wörtlich eine weichherzige, mitfühlende Person, das zweite eine Person ohne Herz beziehungsweise mit hartem Herzen. Die ethische Spannung bleibt erhalten.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: meinen Gehorsam
  rationale: Die Bildung hängt mit ⲥⲱⲧⲙ („hören, gehorchen“) zusammen und bezeichnet hier Gehorsam, nicht Erniedrigung.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: meine Selbstbeherrschung
  rationale: Das griechische Lehnwort ἐγκράτεια ist ein ethischer Ausdruck für Selbstbeherrschung oder Enthaltsamkeit; „Selbstbeherrschung“ ist im modernen Deutsch klar und umfassend.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: liebt sie
  rationale: Die Form leitet sich vom Verb „lieben“ ab und bezieht sich mit dem femininen Pronomen auf die Selbstbeherrschung; sie bedeutet nicht „ihr werdet sie finden“.
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: meiner Schwachheit
  rationale: Das Abstraktum ist von ϭⲱⲃ („schwach“) gebildet und bedeutet Schwachheit, nicht Königreich.
theological_decisions:
- issue: Paradoxe Selbstaussage über Barmherzigkeit und Hartherzigkeit
  choice: Beide gegensätzlichen Eigenschaften werden unmittelbar nebeneinandergestellt.
  alternative: Die zweite Eigenschaft als bloßen äußeren Anschein oder als Verhalten gegenüber einer bestimmten Gruppe erklären.
  rationale: Der koptische Text bietet keine solche Auflösung; die für das Werk kennzeichnende theologische und rhetorische Spannung soll stehen bleiben.
- issue: Verhältnis von Selbstbeherrschung und Schwachheit
  choice: „liebt sie in meiner Schwachheit“
  alternative: Die Schwachheit als Gegensatz außerhalb der Sprecherin oder als zeitliche Lage explizieren.
  rationale: Die Präposition ϩⲛ̄ erlaubt die knappe räumlich-modale Formulierung „in“; eine genauere dogmatische Deutung wäre nicht textlich abgesichert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die anaphorische Betonung „ich, ich“ und die schroffen Gegensätze des Originals bleiben erhalten. Der Gedankenstrich gliedert den letzten Imperativ, ohne die syntaktische Mehrdeutigkeit theologisch aufzulösen.
