base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: de
  text: 'Schau und Selbstbeherrschung


    des Herzens, die in mir ist —


    ich bin das Hören, das jedem zugänglich ist[c],


    und die Rede, die nicht erfasst werden kann[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Die mit „zugänglich“ wiedergegebene Wendung kann auch „verfügbar“, „zu jemandem kommend“ oder „erreichbar“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: „Erfasst“ kann sowohl „ergriffen“ als auch „begriffen“ bedeuten; diese Doppelbedeutung entspricht der Mehrdeutigkeit des Ausdrucks.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: Schau
  rationale: Das griechische Lehnwort bezeichnet Sehen oder Schau. „Schau“ bewahrt hier den abstrakten, inneren Wahrnehmungssinn und den würdigen poetischen Ton.
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: Selbstbeherrschung
  rationale: Das griechische Lehnwort ἐγκράτεια bezeichnet Selbstbeherrschung oder Enthaltsamkeit; „Selbstbeherrschung“ ist im heutigen Deutsch klar und semantisch breit.
- source_word: ⲙⲫⲏⲧ
  choice: des Herzens
  rationale: Die Verbindung wird am ehesten genitivisch verstanden; der anschließende Ausdruck ⲛϩⲏⲧ trägt die räumliche Bedeutung „in/innerhalb“.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: in mir vorhanden
  rationale: ϣⲟⲟⲡ bedeutet „sein, existieren, vorhanden sein“. Die feminine Relativform verweist syntaktisch auf die vorangehenden femininen Begriffe, nicht auf das maskuline „Herz“. Die elliptische deutsche Fassung vermeidet eine falsche Zuordnung.
- source_word: ⲡⲥⲱⲧⲙ
  choice: das Hören
  rationale: Die substantivierte Form bezeichnet das Hören. Der konkrete Sinn erhält das Paradox mit der nachfolgenden „Rede“.
- source_word: ⲉⲧϣⲏⲡ
  choice: das … zugänglich ist
  rationale: Die unsichere Form kann Verfügbarkeit, Zugänglichkeit oder ein Zukommen ausdrücken. „Zugänglich“ gibt diese Möglichkeit wieder, ohne menschliche Leistung vorauszusetzen.
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: jedem
  rationale: 'Die Wendung bezeichnet uneingeschränkte Allgemeinheit: „jedem“ beziehungsweise „allen“.'
- source_word: ⲡϣⲁϫⲉ
  choice: die Rede
  rationale: Das Substantiv kann „Rede“, „Wort“ oder „Äußerung“ bedeuten. „Rede“ bildet im Deutschen einen natürlichen Gegenpol zu „Hören“.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: die nicht erfasst werden kann
  rationale: „Erfassen“ bewahrt die mögliche körperliche und gedankliche Doppelbedeutung von Ergreifen und Begreifen.
theological_decisions:
- issue: Bezug der femininen Relativform ⲉⲥϣⲟⲟⲡ
  choice: Bezug auf „Schau und Selbstbeherrschung“
  alternative: Bezug auf „Herz“
  rationale: Die feminine Singularmarkierung kann sich nicht auf das im Koptischen maskuline „Herz“ beziehen. Die Übersetzung hält den Bezug zu den vorangehenden femininen Begriffen offen, ohne die ungewöhnliche Numeruskonstruktion künstlich aufzulösen.
- issue: Paradox von zugänglichem Hören und nicht erfassbarer Rede
  choice: Das Spannungsverhältnis bleibt unvermittelt stehen
  alternative: Erklärende Deutung als Offenbarung oder mystische Erkenntnis
  rationale: Der Ausgangstext bietet keine ausdrückliche dogmatische Auflösung; daher wird die poetisch-theologische Spannung nicht konfessionell gedeutet.
translation_notes:
  register: Freie, würdige Verszeilen in modernem Standarddeutsch. Nominalformen und Parallelismus bleiben erhalten; die ungewöhnliche Bildsprache wird nicht geglättet. „Schau“ ist bewusst gehobener als „Sehen“, bleibt aber im religiös-poetischen Kontext verständlich.
