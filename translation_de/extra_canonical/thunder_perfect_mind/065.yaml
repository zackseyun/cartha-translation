  register: Moderne, würdige Standardsprache mit kurzen poetischen Zeilen. Die antithetische und paradoxe Struktur wird beibehalten; ungewöhnliche Formulierungen werden nur dort geglättet, wo das Deutsche sonst missverständlich wäre.
