translation:
  language: de
  text: 'Größe in Teilen aus Kleinheit.[a]


    Denn sie erkennen die Kleinheit von der Größe her.


    Warum[b] verflucht ihr mich und ehrt mich?


    Ihr habt verwundet und Erbarmen gezeigt.


    Werft die ersten Dinge nicht hinaus.[c]'
