- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: die Kleinheit
  rationale: Trotz unsicherer OCR-Schreibung spricht der unmittelbare Gegensatz zu „Größe“ für das Abstraktum „Kleinheit“.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: sie erkennen
  rationale: ⲉϣⲁⲩ- wird als habituelle Verbform der dritten Person Plural mit ⲥⲟⲩⲱⲛ („kennen/erkennen“) gelesen, nicht als Form von „alt werden“.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲛⲟϭ
  choice: von der Größe her
  rationale: Die Herkunftsbeziehung wird idiomatisch und zugleich deutlich wiedergegeben.
- source_word: ⲉⲧⲕⲉ ⲟⲩ
  choice: Warum
  rationale: Die OCR-Folge wird als fehlerhafte Wiedergabe von ⲉⲧⲃⲉ ⲟⲩ verstanden, der üblichen koptischen Frageformel „warum?“.
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ ⲙⲙⲟⲉⲓ
  choice: verflucht ihr mich
  rationale: ⲥⲁϩⲟⲩ bedeutet hier „verfluchen“; Person und Objekt werden direkt wiedergegeben.
- source_word: ⲧⲉⲧⲛⲧⲁⲉⲓⲟ ⲙⲙⲟⲉⲓ
  choice: ehrt mich
  rationale: ⲧⲁⲉⲓⲟ bezeichnet ehren beziehungsweise Ehre erweisen und bildet den beabsichtigten Gegensatz zu „verfluchen“.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  choice: Ihr habt verwundet
  rationale: ⲁ- markiert die vollendete Handlung; ϣⲱϥ wird im Sinn von verwunden beziehungsweise verheeren verstanden. „Verwundet“ wahrt den persönlichen Bezug der Sprecherin.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  choice: Erbarmen gezeigt
  rationale: Die Perfektform von ⲛⲁ wird als „sich erbarmen/Erbarmen zeigen“ gelesen und nicht als Bestandteil des folgenden Verbkomplexes.
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: Werft … nicht hinaus
  rationale: ⲙⲡⲣ- ist der negative Imperativ; das folgende Verb wird als Ausgießen, Auswerfen oder Hinauswerfen verstanden. „hinauswerfen“ bewahrt die konkrete Bewegungsrichtung von ⲉⲃⲟⲗ.
- source_word: ⲛⲛϣⲟⲣⲡ
  choice: die ersten Dinge
  rationale: Die substantivierte Pluralform von ϣⲟⲣⲡ („erst, früher“) bleibt bewusst offen und wird nicht vorschnell als kosmologische „Anfänge“ gedeutet.
theological_decisions:
- issue: Gegensätzliche Handlungen gegenüber der Sprecherin
  choice: „verflucht … und ehrt“ sowie „verwundet und Erbarmen gezeigt“ bleiben unaufgelöst nebeneinander stehen.
  alternative: Die Aussagen als zeitliche Abfolge oder als Handlungen verschiedener Gruppen erklären.
  rationale: Der Text nennt keine zeitliche Ordnung und unterscheidet keine Gruppen. Seine paradoxe Spannung gehört zur Aussageform und darf nicht konfessionell oder systematisch harmonisiert werden.
- issue: Bedeutung der „ersten Dinge“
  choice: Die substantivierte Form wird wörtlich-offen als „die ersten Dinge“ wiedergegeben.
  alternative: „die Anfänge“, „das Ursprüngliche“ oder eine bestimmte Gruppe ursprünglicher Wesen.
  rationale: Der knappe Kontext legt keine bestimmte kosmologische Deutung fest; die Übersetzung wahrt daher die Mehrdeutigkeit.
