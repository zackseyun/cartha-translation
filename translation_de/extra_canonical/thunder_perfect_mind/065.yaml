lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ
  choice: Größe
  rationale: Das Abstraktpräfix ⲙⲛⲧ- bildet zu ⲛⲟϭ („groß“) das Substantiv „Größe“; zugleich bleibt der Gegensatz zu ⲙⲛⲧⲕⲟⲩⲉⲓ („Kleinheit“) erhalten.
