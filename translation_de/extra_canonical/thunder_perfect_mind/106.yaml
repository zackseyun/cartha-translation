  yaml_path: translation/extra_canonical/thunder_perfect_mind/106.yaml
  text: 'And learn from my souls.

    Those who know me — I am

    the hearing that is accessible to all [b];

    I am the speech that no one can grasp [c].[d]'
translation:
  language: de
  text: '**4.** Und lernt von meinen Seelen.[a]


    Die mich kennen – ich bin


    das Hören, das allen zugänglich ist;[b]


    ich bin die Rede, die niemand erfassen kann.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »von meinen Seelen«. Der Possessivbezug »meinen« steht ausdrücklich im Koptischen; der ungewöhnliche Plural »Seelen« bleibt erhalten.
    reason: lexical_and_textual_note
  - marker: b
    text: Das koptische Wort kann auch »allgemein« oder »passend« bedeuten; statt »allen zugänglich« wäre daher etwa »allen gemeinsam« denkbar.
    reason: lexical_alternative
  - marker: c
    text: »Erfassen« kann hier sowohl »ergreifen« als auch »begreifen« bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Am Ende des Ausschnitts steht nochmals bloß »ich bin« (ⲁⲛⲟⲕ ⲡⲉ), vermutlich der Anfang der nächsten Selbstbezeichnung; deren Fortsetzung ist hier nicht mitgeliefert.
    reason: alignment_note
lexical_decisions:
- source_word: ⲭⲓⲥⲃⲱ (OCR; vermutlich ϫⲓⲥⲃⲱ)
  choice: lernt
  rationale: Die überlieferte OCR-Form wird als Fehler für ϫⲓⲥⲃⲱ verstanden, »Unterweisung empfangen, lernen«. Der Pluralimperativ entspricht dem Präfix der 2. Person Plural.
- source_word: ⲉⲛⲁⲯⲩⲭⲏ
  choice: von meinen Seelen
  rationale: ⲉ- bezeichnet hier den Ausgangspunkt beziehungsweise die Quelle, ⲛⲁ- ist der ausdrückliche Possessivartikel der 1. Person Singular vor einem Plural, und ⲯⲩⲭⲏ bedeutet »Seele«. Der auffällige Plural wird nicht geglättet.
- source_word: ⲥⲟⲟⲩⲛ
  choice: kennen
  rationale: Bei einem persönlichen Objekt ist »mich kennen« im Deutschen natürlicher als »von mir wissen« und bewahrt den unmittelbaren Erkenntnisbezug.
- source_word: ⲡⲥⲱⲧⲙ
  choice: das Hören
  rationale: Die substantivierte Wiedergabe erhält die ungewöhnliche Selbstbezeichnung und den Parallelismus mit »die Rede«.
- source_word: ϣⲏⲡ
  choice: zugänglich
  rationale: Das Wort kann unter anderem »zugänglich«, »allgemein« oder »passend« bedeuten. »Zugänglich« bringt im Zusammenhang mit der Totalitätsformel die Verfügbarkeit zum Ausdruck, ohne die Alternativen auszuschließen.
- source_word: ⲛϩⲱⲃ ⲛⲓⲙ
  choice: für alles
  rationale: Die Wendung bezeichnet umfassende Totalität. »Für alles« lässt offen, ob Dinge, Bereiche oder allgemein alles Seiende gemeint sind.
- source_word: ⲡϣⲁϫⲉ
  choice: die Rede
  rationale: »Rede« bewahrt den sprachlichen und geäußerten Charakter und bildet ein würdiges Gegenstück zu »das Hören«.
- source_word: ⲙⲁϩⲧⲉ
  choice: erfassen
  rationale: »Erfassen« kann sowohl das Ergreifen als auch das geistige Begreifen anklingen lassen und erhält damit die Mehrdeutigkeit des koptischen Verbs.
theological_decisions:
- issue: Zuordnung von »Die mich kennen« zur folgenden Selbstbezeichnung
  choice: Als vorangestelltes, syntaktisch schwebendes Element vor »ich bin das Hören« wiedergegeben
  alternative: »Ich bin die, die mich kennen« beziehungsweise Zuordnung zu einem vorangehenden Satz
  rationale: Die Wortfolge und der Ausschnitt erlauben mehr als eine syntaktische Gliederung. Der Gedankenstrich bewahrt den abrupten poetischen Übergang, ohne die Identitätsaussage dogmatisch zu vereindeutigen.
- issue: Abschließendes ⲁⲛⲟⲕ ⲡⲉ (»ich bin«)
  choice: Nicht als vollständige zusätzliche Aussage in den Haupttext aufgenommen, sondern in einer Fußnote dokumentiert
  alternative: Den Abschnitt mit einem unvollständigen »Ich bin …« enden lassen
  rationale: Die nackte Formel gehört wahrscheinlich zum Beginn der nächsten Selbstbezeichnung, deren Prädikat im vorliegenden Ausschnitt fehlt. Die Fußnote wahrt den Textbefund und vermeidet zugleich einen irreführenden deutschen Satzabschluss.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen poetischen Zeilen. Die ungewöhnlichen nominalen Selbstbezeichnungen und der auffällige Plural »meine Seelen« werden nicht geglättet. Der Gedankenstrich markiert die syntaktische Schwebe des koptischen Textes.
