base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: de
  text: 'Die mich verleugnen, bekennen mich[a],


    und die mich bekennen, verleugnen mich.


    Die die Wahrheit über mich sagen, lügen über mich,


    und die über mich lügen, sagen die Wahrheit über mich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der englische Konsultationstext für Segment 16 beginnt mit „I am the voice whose sound is manifold …“. Der hier vorgelegte koptische Ausschnitt enthält dagegen die Gegensatzpaare über Verleugnen und Bekennen sowie Wahrheit und Lüge. Wahrscheinlich liegt in der Segmentzuordnung eine Verschiebung vor; übersetzt wird der angegebene koptische Text.
    reason: alignment_note
  - marker: b
    text: 'Der letzte Satz ist im OCR-Text stark zusammengelaufen. Die erhaltenen Buchstaben und die parallele Satzstruktur stützen die Lesung: „und die über mich lügen, sagen die Wahrheit über mich“.'
    reason: textual_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: verleugnen
  rationale: Das sahidische Lehnwort aus griechisch ἀρνεῖσθαι bezeichnet hier das Leugnen beziehungsweise Verleugnen einer Person. „Verleugnen“ bewahrt den bekenntnishaften und persönlichen Gegensatz zu „bekennen“.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: bekennen
  rationale: Das griechische Lehnwort ὁμολογεῖν kann „bekennen“ oder „anerkennen“ bedeuten. „Bekennen“ erhält das religiös-öffentliche Register und bildet den prägnanten Gegenpol zu „verleugnen“.
- source_word: ⲛⲉⲧ–
  choice: die …
  rationale: Der substantivierte Relativausdruck wird im Deutschen natürlich durch „die …“ wiedergegeben; gemeint sind jeweils diejenigen, die so handeln.
- source_word: ⲙ̄ⲙⲟⲉⲓ / ⲉⲣⲟⲓ
  choice: mich / über mich
  rationale: ⲙ̄ⲙⲟⲉⲓ ist das direkte Objekt der ersten Person Singular. Bei den Redeausdrücken mit ⲉⲣⲟⲓ gibt „über mich“ die Bezugnahme idiomatisch wieder.
- source_word: ϫⲉ ⲙⲉ
  choice: die Wahrheit sagen
  rationale: Die Verbindung aus „sagen“ und „Wahrheit“ wird im Deutschen idiomatisch als „die Wahrheit sagen“ formuliert.
- source_word: ϫⲓϭⲟⲗ
  choice: lügen
  rationale: Das Verb bezeichnet das Lügen beziehungsweise das Äußern von Unwahrem. „Lügen“ bewahrt den direkten paradoxen Gegensatz zur Wahrheitsaussage.
theological_decisions:
- issue: Paradoxe Gleichzeitigkeit von Verleugnen und Bekennen sowie Wahrheit und Lüge
  choice: Die Gegensätze bleiben ohne erklärende Auflösung unmittelbar nebeneinander stehen.
  alternative: Die Aussagen als unterschiedliche Perspektiven, unbeabsichtigtes Zeugnis oder ironische Rede ausdeuten.
  rationale: Der koptische Text formuliert bewusst zugespitzte Antithesen. Eine interpretierende Auflösung würde die genuine Mehrdeutigkeit und theologische Spannung vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, rhythmischer Parallelstruktur. Die wiederholten Formulierungen und die scharfen Antithesen des koptischen Textes werden bewusst bewahrt; „verleugnen/bekennen“ hält den persönlichen und bekenntnishaften Ton.
