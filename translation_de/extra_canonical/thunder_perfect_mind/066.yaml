    reason: textual_damage_note
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: ehren
  rationale: Das koptische Verb bedeutet hier „ehren“; „umarmen“ gehört zu der nachweislich fehlzugeordneten Konsultationsfassung und wird vom vorliegenden Wortlaut nicht getragen.
- source_word: ϣⲱϥ
  choice: verachten
  rationale: 'Nach dem Perfektmorphem ⲁ- und dem Subjekt der 2. Person Plural ist ϣⲱϥ verbal zu lesen: „ihr habt verachtet“. Eine Deutung als privatives „schamlos“ verkennt die Formgrenze.'
- source_word: ⲛⲁ(ⲩ)
  choice: sehen
  rationale: Die am Zeilenende beziehungsweise im OCR verkürzte Form wird als ⲛⲁⲩ „sehen“ verstanden; der Perfekt ergibt „ihr habt mich gesehen“.
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: zerstreuen
  rationale: Mit dem negativen Imperativ ⲙⲡⲣ- bezeichnet die Wendung ein Ausstreuen oder Ausschütten. „Zerstreuen“ passt zum Objekt „die ersten Dinge“, ohne die beschädigte Syntax weiter festzulegen.
- source_word: ⲛϣⲟⲣⲡ
  choice: die ersten Dinge
  rationale: Die substantivierte Pluralform wird bewusst allgemein wiedergegeben; ob Anfänge, frühere Dinge oder Erstes gemeint ist, lässt sich aus dem Fragment nicht sicher entscheiden.
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: über … nachdenken
  rationale: Das griechische Lehnwort kann „nachdenken, sich befassen, üben“ bedeuten. Im beschädigten negativen Imperativ ist „nachdenken“ die zurückhaltendste natürliche Wiedergabe.
- source_word: ⲗⲁⲁⲧⲉ
  choice: Glieder
  rationale: „Glieder“ bewahrt den körperlichen Sinn, ohne das im Deutschen ungewöhnlichere „Körperteile“ zu erzwingen; der unmittelbare syntaktische Zusammenhang ist beschädigt.
- source_word: ⲁⲧⲏⲛ
  choice: inwendig
  rationale: Die Form weist auf Inneres beziehungsweise Innenliegendes. „Inwendig“ hält den fragmentarischen Anschluss offen.
