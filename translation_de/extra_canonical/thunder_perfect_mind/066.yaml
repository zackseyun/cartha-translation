    text: 'Wörtlich und dem vorliegenden Koptisch entsprechend: „ihr ehrt mich“. Die ältere Wiedergabe „ihr umarmt mich“ stammt aus einer fehlzugeordneten Passage.'
    reason: textual_alignment_note
  - marker: b
    text: 'Das Koptische hat Perfektformen der 2. Person Plural: „ihr habt mich verachtet“ und, bei Ergänzung der im OCR verkürzten Form ⲛⲁ(ⲩ), „ihr habt mich gesehen“.'
    reason: morphology_note
  - marker: c
    text: „Zerstreut“ kann auch „schüttet nicht aus“ beziehungsweise „werft nicht hinaus“ bedeuten. „Die ersten Dinge“ könnte ebenso „die Anfänge“ oder „das Frühere“ heißen.
    reason: lexical_alternative
  - marker: d
    text: Der Text ist hier stark beschädigt. Das griechische Lehnwort ⲙⲉⲗⲉⲧⲁ kann neben „nachdenken“ auch „sich befassen“, „einüben“ oder „praktizieren“ bedeuten.
    reason: textual_damage_note
  - marker: e
