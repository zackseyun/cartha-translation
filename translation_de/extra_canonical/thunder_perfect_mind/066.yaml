translation:
  language: de
  text: 'Und ihr ehrt mich.[a]

    Ihr habt mich verachtet, und ihr habt mich gesehen.[b]

    Zerstreut nicht die ersten Dinge …[c]

    Diese, die ich … danach …

    Denkt nicht über … nach …[d]

    eure Glieder …,

    die inwendig sind …[e]'
  philosophy: optimal-equivalence
  footnotes:
