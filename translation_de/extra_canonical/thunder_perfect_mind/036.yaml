base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/036.yaml
  text: It is the utterance according to prudence of my seeking[a], and it is the knowledge of my searching[d][c][b]. But I am she who exists in all fears and in courage.
translation:
  language: de
  text: '**1.** Es ist der Ausspruch gemäß der Einsicht meines Suchens, und es ist die Erkenntnis meines Forschens.[a] Ich aber bin die, die in allen Ängsten und im Mut gegenwärtig ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste koptische Wort ist in der vorliegenden OCR-Lesung unsicher. „Ausspruch“ ist daher eine vorläufige Wiedergabe; möglich wäre auch „Aussage“.
    reason: textkritische Unsicherheit
  - marker: b
    text: Wörtlich steht „in allen Ängsten“; das folgende Wort kann auch „Tapferkeit“, „Kühnheit“ oder, mit älterer geschlechtlicher Färbung, „Mannhaftigkeit“ bedeuten. Der Satz hält die Gegensätze Angst und Mut bewusst zusammen.
    reason: lexikalische Alternative und Parallelismus
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: Ausspruch
  rationale: Die OCR-Lesung ist unsicher. Der Zusammenhang verlangt offenbar ein Nomen, das durch „gemäß der Einsicht“ näher bestimmt wird; „Ausspruch“ bleibt bewusst vorläufig und semantisch zurückhaltend.
- source_word: ⲧⲁⲣⲕⲁⲧⲁ ⲫⲣⲟⲛⲓ
  choice: gemäß der Einsicht
  rationale: Das griechische Lehnwort κατά bezeichnet die Entsprechung oder Maßgabe; φρόνησις hat einen philosophisch-kognitiven Sinn. „Einsicht“ klingt im heutigen Deutsch natürlicher als „Klugheit“, ohne den abstrakten Gehalt aufzugeben.
- source_word: ⲣⲓⲧⲉ
  choice: Suchen
  rationale: Die substantivierte Verbform bewahrt die Tätigkeit und bildet mit „Forschen“ einen parallelen Ausdruck.
- source_word: ⲥⲁϩⲟⲩ
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt den kognitiven Gehalt wieder und wahrt den gehobenen, aber verständlichen Ton.
- source_word: ⲁϣⲟⲩϣⲟⲩ
  choice: Forschen
  rationale: Die Wiedergabe bezeichnet eine intensive Suche und erhält den inneren Parallelismus mit „meines Suchens“.
- source_word: ϣⲟⲟⲡ
  choice: gegenwärtig sein
  rationale: Das Verb kann „sein“, „existieren“ oder „gegenwärtig sein“ bedeuten. Hier bringt „gegenwärtig sein“ die Anwesenheit in den genannten Gegensätzen natürlich zum Ausdruck.
- source_word: ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: alle Ängste
  rationale: ⲧⲏⲣⲟⲩ ist der Universalquantor „alle“ und bezieht sich auf den Plural „Ängste“; es bedeutet hier nicht „ihre“.
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: Mut
  rationale: Das Wort kann wörtlich männlich konnotierte Tapferkeit oder Mannhaftigkeit bezeichnen. „Mut“ bewahrt den Gegensatz zur Angst, ohne unnötig eine geschlechtsspezifische Nuance einzutragen.
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: die, die … gegenwärtig ist
  rationale: Die feminine Relativform ist für die Selbstbezeichnung wesentlich und wird ausdrücklich wiedergegeben.
theological_decisions:
- issue: Gegenwart der Sprecherin in gegensätzlichen Erfahrungsbereichen
  choice: „in allen Ängsten und im Mut gegenwärtig“
  alternative: nur auf der Seite des Mutes stehen
  rationale: Der Text stellt Angst und Mut nebeneinander und behauptet die Gegenwart der Sprecherin in beiden. Diese Spannung darf nicht durch eine harmonisierende Deutung beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffälligen Genitivverbindungen „meines Suchens“ und „meines Forschens“ bleiben erhalten, um den formalen Parallelismus des koptischen Textes nicht zu glätten. Die feminine Selbstbezeichnung wird ausdrücklich bewahrt.
