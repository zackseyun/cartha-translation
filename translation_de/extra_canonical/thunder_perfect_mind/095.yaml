  rationale: Die erhaltene konditionale Konstruktion wird formal wiedergegeben; das beschädigte folgende Verb lässt keine sichere Ergänzung zu.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: das Unrecht
