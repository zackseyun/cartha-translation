translation:
  language: de
  text: 'Ich bin ohne Verstand, und ich bin weise.


    Ich bin die Erkenntnis des Griechen und des Barbaren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: die Erkenntnis
  rationale: Das substantivierte ⲥⲟⲟⲩⲛ bezeichnet Wissen oder Erkenntnis. „Erkenntnis“ wahrt den abstrakten, pointierten Charakter der Selbstaussage.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: das Unwissen
  rationale: Die rekonstruierte Form ist ein Abstraktum mit privativem ⲁⲧ- und bildet den beabsichtigten Gegensatz zu „Erkenntnis“.
- source_word: ⲉⲣⲟⲥ
  choice: darüber
  rationale: Die Präposition mit femininem Rückbezug verweist wahrscheinlich auf die zuvor genannte Erkenntnis; „darüber“ lässt den Bezug im Deutschen bewusst knapp und offen.
- source_word: ϩⲁⲡ (im OCR als ⲫⲁⲡ)
  choice: das Urteil
  rationale: Die Form bezeichnet Urteil oder Rechtsspruch. Das OCR-Bild ⲫⲁⲡ lässt sich als Verbindung des Artikels ⲡ- mit ϩⲁⲡ erklären.
- source_word: ⲛⲉⲗⲗⲏⲛ / ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: der Griechen / der Barbaren
  rationale: Das vorangestellte ⲛ- markiert hier die pluralischen Gruppen. Die historischen Bezeichnungen bewahren den scharfen griechisch-römischen Gegensatz.
theological_decisions:
- issue: Paradoxe Selbstaussage über Erkenntnis und Unwissen
  choice: Beide Pole bleiben unaufgelöst nebeneinander stehen.
  alternative: Den zweiten Pol als persönliche Torheit der Sprecherin deuten.
  rationale: Die rekonstruierte Grammatik bezeichnet abstrakte „Erkenntnis“ und „Unwissen“; eine dogmatische Harmonisierung würde die Spannung des Gedichts abschwächen.
- issue: Bedeutung von ϩⲁⲡ
  choice: Urteil
  alternative: Recht / Rechtsspruch
  rationale: „Urteil“ ist im Deutschen natürlich und wahrt sowohl den richterlichen als auch den wertenden Bedeutungsbereich, ohne festzulegen, ob die Sprecherin urteilt oder selbst Gegenstand des Urteils ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallelen Nominalsätze und die unaufgelösten Gegensätze des koptischen Gedichts bleiben erhalten; „Barbaren“ wird als historische Gruppenbezeichnung bewusst nicht modernisiert.
