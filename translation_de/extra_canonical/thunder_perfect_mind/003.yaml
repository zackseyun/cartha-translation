base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: de
  text: '**3.** Und ihr, die ihr hört, hört auf mich.


    Ihr, die ihr auf mich wartet[a], nehmt mich bei euch auf.


    Verstoßt mich nicht aus eurem Blick[b],


    und lasst weder eure Stimme noch euer Gehör mich hassen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann neben „warten/erwarten“ auch „sich sehnen/verlangen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Werft mich nicht fort aus eurem Gesicht.“ Gemeint sein kann auch: „Entfernt mich nicht aus eurem Blick.“'
    reason: literal_rendering
  - marker: c
    text: 'Die knappe Verbindung von „Stimme“ und „Gehör“ ist ungewöhnlich und personifiziert beide: Wörtlich sollen Stimme und Gehör die Sprecherin nicht hassen.'
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ … ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: ihr, die ihr hört, hört auf mich
  rationale: Bewahrt die absichtliche Wiederholung von „hören“ und gibt den Imperativ als aktives Aufmerken wieder. Das substantivierte „Hörende“ wäre im modernen Deutschen weniger natürlich.
- source_word: ⲧⲟϣⲧ
  choice: auf mich wartet
  rationale: Gibt den Grundsinn des erwartungsvollen Wartens wieder, ohne die ebenfalls mögliche Bedeutung „sich sehnen“ in den Haupttext einzutragen.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: nehmt mich bei euch auf
  rationale: Drückt Aufnahme und Annahme in natürlichem Deutsch aus und bewahrt die Bewegung hin zur angesprochenen Gruppe.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: Verstoßt mich nicht aus eurem Angesicht
  rationale: Folgt dem korrigierten Handschriftenwortlaut „werft/verstoßt mich nicht fort aus eurem Gesicht/Angesicht“ statt den fehlerhaften OCR-Lesungen. „Angesicht“ erhält das konkrete Bild und bleibt würdevoll verständlich.
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: lasst eure Stimme mich nicht hassen
  rationale: Bewahrt die auffällige Personifizierung der Stimme und löst die semantische Spannung nicht zu „verhasst klingen“ oder „mich verachten“ auf.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: euer Gehör
  rationale: Behält die knappe Parallelstellung von Stimme und Hören/Gehör bei. „Gehör“ ist im Deutschen idiomatischer als das nominalisierte „Hören“, ohne die Aussage auszudeuten.
theological_decisions:
- issue: Personifizierung von Stimme und Gehör
  choice: Die Stimme und das Gehör bleiben als handelnde Größen formuliert.
  alternative: „Lasst mich weder eurer Stimme noch eurem Gehör verhasst sein.“
  rationale: Die Quelle enthält eine bewusst spannungsreiche, paradoxe Redeweise. Eine glättende Umformulierung würde die literarische und mögliche theologische Mehrdeutigkeit vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Wiederholung und paradoxaler Bildsprache. „Angesicht“ setzt einen leicht gehobenen Akzent, weil es das konkrete Quellenbild besser wahrt als das abstraktere „Sicht“. Der Entwurf folgt beim beschädigt wiedergegebenen OCR-Abschnitt dem durch die Handschrift bestätigten korrigierten Wortlaut.
