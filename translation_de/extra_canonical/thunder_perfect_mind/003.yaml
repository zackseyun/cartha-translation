  naturalness: '„Aus eurem Angesicht“ ist im heutigen Standarddeutsch trotz der wörtlichen Nähe zu koptisch „Gesicht“ nicht idiomatisch: Man wird nicht aus einem Angesicht verstoßen. „Aus eurem Blick“ bewahrt das Bild und ist klar. Die Negativkoordination „Lasst weder eure Stimme noch euer Gehör mich hassen“ gibt die Personifizierung beider Glieder vollständig und deutlich wieder.'
  terminology: „Hörende“, „auf mich warten“, „bei euch aufnehmen“, „Blick“, „Stimme“ und „Gehör“ sind angemessen. „Gehör“ bleibt als personifizierte Größe absichtlich ungeglättet und entspricht der knappen Parallelität des Textes.
