base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: de
  text: '**2.** Denkt an mich. Und ich fand mich unter denen, die mich suchen.[a]


    Ihr selbst, die ihr nach mir Ausschau haltet,


    und ihr Hörenden, hört auf mich.


    Ihr, deren Herz beunruhigt ist, nehmt mich bei euch auf,


    und flieht nicht vor mir.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorliegende Textgestalt lautet wörtlich etwa: „Und ich fand mich unter denen, die mich suchen.“ Wegen der Reihe von Aufforderungen wird auch erwogen: „Und findet mich unter denen, die mich suchen“ oder „Und ich werde unter denen gefunden, die mich suchen.“'
    reason: textkritische und grammatische Mehrdeutigkeit
  - marker: b
    text: 'Wörtlich: „Lauft oder flieht nicht von mir weg.“ Möglich ist auch: „Wendet euch nicht von mir ab.“'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: Denkt an mich
  rationale: ⲙⲉⲉⲩⲉ bezeichnet Denken, Erwägen oder Bedenken. Der Imperativ eröffnet die direkte, eindringliche Anrede natürlich und ohne zusätzliche religiöse Färbung.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: Und ich fand mich unter denen, die mich suchen
  rationale: Die überlieferte OCR-Lesart ⲁⲓϭⲓⲛⲉ ist ein Perfekt der ersten Person Singular, und ⲙⲙⲟⲓ kann hier reflexiv wiedergegeben werden. Die syntaktisch auffällige Aussage wird nicht stillschweigend in einen Imperativ geändert.
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ … ⲉⲣⲟⲓ
  choice: ihr, die ihr … nach mir Ausschau haltet
  rationale: ⲣⲟⲉⲓⲥ bedeutet wachen, aufmerksam sein oder Ausschau halten, nicht wissen. „Nach mir Ausschau halten“ passt zur gerichteten Aufmerksamkeit auf die Sprecherin.
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: ihr selbst
  rationale: Das selbstständige Pronomen verstärkt die Anrede; „selbst“ bewahrt diesen rhetorischen Nachdruck.
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  choice: ihr Hörenden
  rationale: ⲣⲉϥ- bildet hier eine Personenbezeichnung; der Plural bezeichnet die Hörenden und ist keine Futur- oder Konditionalkonstruktion.
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: hört auf mich
  rationale: Der Imperativ fordert nicht nur akustisches Hören, sondern aufmerksames Beachten. „Hört auf mich“ erhält beides.
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: Ihr, deren Herz beunruhigt ist
  rationale: ⲧⲟϣⲧ bezeichnet Erschrecken oder innere Unruhe, während ϩⲏⲧ das Herz beziehungsweise Innere benennt. Die Formulierung wahrt die emotionale Offenheit.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: nehmt mich bei euch auf
  rationale: 'ϣⲟⲡⲧ ist als Imperativ von ϣⲱⲡ mit Objektsuffix der ersten Person Singular zu verstehen: „Nehmt mich auf“; ⲉⲣⲱⲧⲛ ergänzt „bei/zu euch“.'
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: flieht nicht vor mir
  rationale: ⲙⲡⲣ- bildet den negativen Imperativ, und ⲡⲱⲧ bedeutet wörtlich laufen oder fliehen. Die räumliche und relationale Bildlichkeit bleibt mit „flieht nicht vor mir“ erhalten.
theological_decisions:
- issue: Wechsel zwischen Aufforderung und Aussage im ersten Satz
  choice: Die überlieferte Perfektform wird als „ich fand mich“ wiedergegeben.
  alternative: „und findet mich unter denen, die mich suchen“ beziehungsweise „und ich werde unter denen gefunden, die mich suchen“
  rationale: Der vorliegende koptische Text bietet ausdrücklich ⲁⲓϭⲓⲛⲉ, obwohl die umgebenden Imperative eine textkritische oder kontextuelle Angleichung nahelegen könnten. Die Übersetzung bewahrt diese Spannung und weist die Alternativen in einer Fußnote aus.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter orakelartiger Anrede. Die wiederholten Anreden und Imperative bleiben sichtbar; ungewöhnliche Quellenspannungen werden nicht geglättet. „Hörenden“ ist bewusst leicht gehoben, aber im Deutschen verständlich und bildet die koptische Personenbezeichnung ab.
