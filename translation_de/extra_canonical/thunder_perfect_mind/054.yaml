base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
translation:
  language: de
  text: 'Ich bin die, vor der ihr euch verbergt,

    und ihr offenbart mich.


    Doch sooft ihr euch verbergt,

    werde ich selbst erscheinen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der OCR-Ausschnitt setzt nach diesem Satz mit schwer abzugrenzenden, offenbar bereits zum folgenden Zusammenhang gehörenden Wörtern fort. Übersetzt ist hier der vollständig erkennbare Satz bis „ich selbst werde erscheinen“.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: sich verbergen
  rationale: 'Das Verb bedeutet hier „verbergen“; mit ⲉⲣⲟⲉⲓ bezeichnet die erste Zeile die Sprecherin als diejenige, vor der die Angeredeten sich verbergen. In der Folge steht dasselbe Verb mit reflexivem Objekt ⲙⲙⲱⲧⲛ: „ihr euch verbergt“.'
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: ihr offenbart mich
  rationale: Die Konstruktion mit direktem Objekt bezeichnet hier das Offenbaren beziehungsweise Sichtbarmachen der Sprecherin und steht im paradoxen Gegensatz zum Sich-Verbergen.
- source_word: ϯⲛⲁⲟⲩⲟⲛϩⲧ
  choice: werde ich selbst erscheinen
  rationale: Die verbale Form ist hier auf die Sprecherin selbst bezogen und wird idiomatisch intransitiv als „erscheinen/sichtbar werden“ wiedergegeben; ϩⲱⲱⲧ betont „ich selbst“.
- source_word: ⲉⲧⲉⲧⲛϣⲁⲛ-
  choice: sooft ihr
  rationale: Die konditional-temporale Form bezeichnet einen wiederkehrenden oder unbestimmt eintretenden Fall. „Sooft“ bewahrt diesen Sinn natürlicher als ein rein einmaliges „wenn“.
theological_decisions:
- issue: Paradoxe Beziehung zwischen Verbergen, Offenbaren und Erscheinen
  choice: 'Die Spannung bleibt wörtlich erkennbar: Die Angeredeten verbergen sich und offenbaren zugleich die Sprecherin; wenn sie sich verbergen, erscheint sie selbst.'
  alternative: Die Aussagen zu einer einheitlichen mystischen Lehre über Erkenntnis oder Selbstoffenbarung auszudeuten.
  rationale: Der koptische Wortlaut formuliert das Paradox, erklärt es aber nicht. Eine dogmatische Auflösung würde mehr festlegen, als die Quelle aussagt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feminine Selbstbezeichnung wird mit „die“ bewahrt. Kurze Verszeilen erhalten den antithetischen, feierlichen Rhythmus; „offenbart“ und „erscheinen“ unterscheiden die objektbezogene und die selbstbezogene Verwendung desselben koptischen Verbstamms.
