lexical_decisions:
- source_word: '(ⲥ)ⲙⲙⲟⲥ (OCR: ⲙⲙⲟⲥ)'
  choice: Schweigen
  rationale: Die Lesung setzt ein im OCR vermutlich ausgefallenes anlautendes ⲥ voraus. Sie ergibt zusammen mit ϣⲱⲥ die für das Werk charakteristische paradoxe Verbindung von Schweigen und Stimme.
- source_word: ϣⲱⲥ
  choice: Stimme
  rationale: „Stimme“ ist hier natürlicher als „Laut“ und bewahrt den Gegensatz zum Schweigen.
- source_word: ϯⲣⲏⲛⲏ / ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: Frieden / Krieg
  rationale: Die griechischen Lehnwörter bilden einen klaren Gegensatz. Im Deutschen stehen beide abstrakten Begriffe idiomatisch ohne Artikel.
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: durch mich entstand
  rationale: ϣⲱⲡⲉ bezeichnet Entstehen oder Geschehen; ⲉⲧⲃⲏⲏⲧ gibt den kausalen Bezug auf die Sprecherin wieder.
- source_word: ⲟⲩϣⲙⲙⲱ / ⲟⲩⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: eine Fremde / eine Bürgerin
  rationale: Die beiden Bezeichnungen sind als sozialer Gegensatz formuliert. Die femininen deutschen Formen entsprechen der im Umfeld grammatisch weiblich markierten Sprecherin.
- source_word: ⲟⲩⲥⲓⲁ
  choice: Substanz
  rationale: Das griechische Lehnwort οὐσία kann „Substanz“, „Wesen“ oder „Sein“ bedeuten. „Substanz“ erhält den philosophischen Klang und lässt sich im anschließenden Negativsatz präzise wiederholen.
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: Gemeinschaft
  rationale: Das griechische συνουσία kann Zusammensein, Gemeinschaft, Verbindung oder auch geschlechtliche Vereinigung bezeichnen. „Gemeinschaft“ ist im Satz natürlich, ohne die relationale Bedeutung einzuengen.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: kennen mich nicht
  rationale: Die Form enthält das privative ⲁⲧ- und bedeutet, dass sie hinsichtlich der Sprecherin unwissend sind; sie ist nicht als Kausativ „machen mich bekannt“ zu lesen.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: außerhalb
  rationale: Die Verbindung bezeichnet ein Außerhalbsein, nicht ein Sein innerhalb der Gemeinschaft.
theological_decisions:
- issue: Paradoxe Selbstidentifikation als Substanz und Substanzlose
  choice: Beide Aussagen unvermittelt nebeneinander stehen lassen
  alternative: Den Gegensatz erklärend als Besitz, Wesen oder geistlichen Zustand deuten
  rationale: Der Text formuliert absichtlich widersprüchlich. Eine harmonisierende Erklärung würde die genuine Spannung des Selbstzeugnisses auflösen.
- issue: Mögliche erotische Bedeutung von συνουσία
  choice: Gemeinschaft im Haupttext, Bedeutungsbreite in der Fußnote
  alternative: Verbindung, Zusammensein oder geschlechtliche Vereinigung
  rationale: Der Kontext legt keine einzelne Nuance sicher fest; daher darf die Übersetzung die mögliche relationale und erotische Mehrdeutigkeit nicht dogmatisch festlegen.
translation_notes:
  register: Moderner, würdevoller und rhythmischer Prosastil mit wiederholtem „Ich bin“. Die grammatisch weibliche Sprecherrolle wird bei Personenbezeichnungen sichtbar gemacht. Philosophische Lehnbegriffe bleiben verständlich, während echte textliche und semantische Unsicherheiten in den Fußnoten offengelegt werden.
