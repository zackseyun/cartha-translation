  source_fidelity: 'Die Übersetzung trifft die klar lesbaren Aussagen im Wesentlichen: Schweigen/Stimme, Frieden/Krieg, Fremde/Bürgerin, Substanz/Substanzlosigkeit sowie das Außensein von der συνουσία und das Nichtkennen der Sprecherin. Die abschließende Ergänzung „in meinem …“ ist jedoch nicht durch den überlieferten Rest gedeckt: Der Ausschnitt setzt mit „und die, die mir gehören / die mein sind …“ ein und bricht dann ab.'
