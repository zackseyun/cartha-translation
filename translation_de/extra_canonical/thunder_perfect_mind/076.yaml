  text: and the one they despise in scorn[a]. I am peace[c][b], and because of me war has come to be.
translation:
  language: de
  text: und diejenige, die sie mit Hohn verachten.[a] Ich bin der Frieden, und meinetwegen ist der Krieg entstanden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Ausschnitt setzt vor der hier mit „und“ wiedergegebenen Konjunktion ⲁⲩⲱ mitten in einem Wort ein; deshalb beginnt die Übersetzung als Satzfragment.
    reason: textual_scope
  - marker: b
    text: „Ist entstanden“ kann auch mit „ist geworden“ oder „ist geschehen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: die, die sie … verachten
  rationale: Die feminine Relativkonstruktion bezeichnet die Sprecherin als diejenige, die von ihnen verachtet wird; die Wiederholung von „die“ ist im Deutschen natürlich und bewahrt den Bezug.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: mit Hohn
  rationale: Gibt die modale Wendung knapp und idiomatisch wieder, ohne ihre abwertende Schärfe abzuschwächen.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ϯⲣⲏⲛⲏ
  choice: Ich bin der Frieden
  rationale: Bewahrt die wiederkehrende Selbstoffenbarungsformel; der bestimmte Artikel ist bei der personifizierten Prädikatsbezeichnung im Deutschen natürlich.
- source_word: ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: der Krieg
  rationale: Der griechische Lehnbegriff πόλεμος bezeichnet hier im direkten Gegensatz zum Frieden den Krieg.
- source_word: ϣⲱⲡⲉ
  choice: ist … entstanden
  rationale: Bewahrt den Sinn von Werden beziehungsweise Ins-Dasein-Treten und vermeidet eine bloß ereignishafte Wiedergabe.
- source_word: ⲉⲧⲃⲏⲏⲧ
  choice: meinetwegen
  rationale: Drückt die ausdrücklich kausale Beziehung idiomatisch aus, ohne festzulegen, auf welche Weise die Sprecherin Anlass oder Ursache des Krieges ist.
theological_decisions:
- issue: Paradoxe Beziehung zwischen Frieden und Krieg
  choice: „Ich bin der Frieden, und meinetwegen ist der Krieg entstanden“
  alternative: Die Aussage als bloßen zeitlichen Gegensatz oder als moralische Rechtfertigung des Krieges erklären
  rationale: Der Text stellt Identität und Kausalität spannungsvoll nebeneinander. Die Übersetzung bewahrt dieses Paradox, ohne es dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Stimme bleibt durch „die“ erkennbar. Der fragmentarische Anfang und die paradoxe Aussage werden nicht geglättet.
