review_pass:
  verdict: revise
  source_fidelity: 'Die deutsche Fassung weicht in einem zentralen Punkt vom überlieferten koptischen Wortlaut und auch von der englischen Prüfspur ab: ⲡⲣⲟⲥ ⲡⲉ ist nicht sicher mit ⲟⲩⲉⲓϣ zu „für eine Zeit“ zu verbinden. Im vorliegenden Text folgt vielmehr auf die Vergnügungen ⲡⲣⲟⲥ mit nicht eindeutig ausgedrücktem Bezug, sodann ⲟⲩⲉⲓϣ „eine Macht/Stärke“. Die Entwurfsfassung macht daraus zeitweilige Vergnügungen, die jemanden ergreifen, und verändert damit die Satzglieder. Ferner bietet die Quelle ⲙⲙⲟ („es“), nicht das im Entwurf kommentierte pluralische ⲙⲙⲟⲟⲩ. „wieder“ ist bei ⲛⲏⲫⲉ nicht belegt.'
  naturalness: Die Katalogform mit „und“ ist angemessen. „Unwissenheiten“ ist im heutigen Deutsch markiert, aber als bewusste Wiedergabe des Plurals vertretbar. „euch gegenüber“ gibt die unsichere Richtungsangabe natürlicher wieder als ein ungrammatisches „zu euch hin“, ohne die unbelegte Zeitangabe einzuführen. Die Schlusszeilen bleiben wegen der fragmentarischen und syntaktisch schwierigen Vorlage bewusst knapp.
  terminology: „Leidenschaften“, „Vergnügungen“, „Macht“, „nüchtern“ und „Leere“ sind sachgerechte, nicht konfessionell vorgeprägte Wiedergaben. „nüchtern werden“ wahrt den verbalen Charakter von ⲛⲏⲫⲉ; eine Deutung als bloß geistige Besonnenheit wird nicht in den Haupttext verlegt.
  issues:
  - severity: high
    issue: Unbelegte Umsegmentierung zu „für eine Zeit“
    rationale: Die Fassung verbindet ⲡⲉ und ⲟⲩⲉⲓϣ gegen die vorgelegte Quellsegmentierung und lässt dadurch ⲟⲩⲉⲓϣ „eine Macht/Stärke“ als eigenes Satzglied ausfallen. Die englische Audit-Spur bestätigt dieses Satzglied.
  - severity: high
    issue: Syntaktische Umdeutung von „eine Macht, die ihr ergreifen werdet“
    rationale: Der Entwurf macht die Vergnügungen zum Objekt von „sie ergreifen werden“. Der Quelltext hat hingegen ⲟⲩⲉⲓϣ als Singular und ⲙⲙⲟ als singularisches Objektpronomen; die Macht ist daher als Bezugswort der Relativkonstruktion zu erhalten.
  - severity: medium
    issue: „wieder“ ist hinzugefügt
    rationale: Die koptische Verbform bezeichnet nüchtern/klar werden, enthält aber kein ausdrücklich wiederholendes Element.
  - severity: medium
    issue: Fußnote b zitiert eine nicht vorliegende Form
    rationale: Sie nennt ⲙⲙⲟⲟⲩ, während der bereitgestellte Quelltext ⲙⲙⲟ bietet. Die Anmerkung muss den Singular und dessen Bezug auf „Macht“ berücksichtigen.
  revised_text: '… und Unwissenheiten,


    und Leidenschaften, die kommen werden,


    und Vergnügungen euch gegenüber[a],


    und eine Macht, die ihr ergreifen werdet[b],


    bis sie nüchtern werden[c]


    und hinauf in ihre Leere laufen[d].'
  revised_footnotes:
  - marker: a
    text: ⲡⲣⲟⲥ ⲡⲉ enthält keinen eindeutig ausgedrückten Bezug. „euch gegenüber“ folgt der in der englischen Prüfspur erwogenen kontextuellen Ergänzung; ebenso möglich sind je nach Satzbezug „auf euch zu“ oder „im Blick auf euch“.
    reason: alignment_note
  - marker: b
    text: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟ wird als Relativsatz mit künftigem „ihr“ und singularischem Objekt „es“ verstanden, das sich auf „eine Macht“ bezieht. Die Verbnuance kann auch „empfangen“ oder „an sich nehmen“ sein; eine andere Subjektzuordnung bleibt möglich.
    reason: alternative_reading
  - marker: c
    text: Die Form ⲛⲏⲫⲉ ist verbal und bedeutet „nüchtern werden“; je nach Kontext kann sie auch geistige Wachheit oder Besonnenheit bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: Für ⲡⲟⲩⲕⲏⲛⲏ ist neben „ihre Leere“ auch „ihre Armut“ erwogen worden.
    reason: lexical_alternative
  revision_rationale: 'Die Revision stellt die im Quelltext und in der englischen Audit-Spur erkennbaren Satzglieder wieder her: eine unsicher bezogene Präpositionalgruppe bei den Vergnügungen und anschließend „eine Macht“. Sie entfernt die nicht abgesicherte OCR-Umsegmentierung zu einer Zeitangabe, korrigiert das singularische Objekt und streicht das unbelegte „wieder“. Unsicherheiten bleiben an den betreffenden Ankern transparent vermerkt.'
