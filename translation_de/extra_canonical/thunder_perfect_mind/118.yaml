  yaml_path: translation/extra_canonical/thunder_perfect_mind/118.yaml
  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: de
  text: '… und Unwissenheiten,

    und Leidenschaften, die kommen werden,

    und Vergnügungen für eine Zeit[a], die sie ergreifen werden[b],

    bis sie wieder klaren Sinnes sind[c]

    und hinauf in ihre Leere fliehen[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die OCR trennt ⲡⲉ und ⲟⲩⲉⲓϣ am Zeilenende. Wahrscheinlich ist die Folge als Zeitangabe „für eine Zeit“ zu lesen; eine stärker wörtliche beziehungsweise anders segmentierte Lesung bleibt möglich.
    reason: textual_uncertainty
  - marker: b
    text: Subjekt und genaue Bedeutung von ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ sind unsicher. Möglich sind auch „die sie empfangen/ergreifen werden“ oder eine Konstruktion, in der „sie“ das Subjekt ist.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „bis sie nüchtern werden“. Gemeint sein kann sowohl körperliche Nüchternheit als auch geistige Wachheit oder Besonnenheit.'
    reason: lexical_alternative
  - marker: d
    text: Für ⲡⲟⲩⲕⲏⲛⲏ ist neben „ihre Leere“ auch „ihre Armut“ vorgeschlagen worden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲉⲛⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: Unwissenheiten
  rationale: Das pluralische ϩⲉⲛ wird bewahrt; die Abstraktbildung bezeichnet Zustände des Nichtwissens. Der im Deutschen ungewöhnliche Plural entspricht dem katalogartigen Stil des Ausgangstextes.
- source_word: ϩⲉⲛⲡⲁⲑⲟⲥ
  choice: Leidenschaften
  rationale: Das griechische Lehnwort πάθος bezeichnet in einem ethischen Katalog am ehesten affektive Leidenschaften; „Leiden“ bleibt lexikalisch möglich, passt hier jedoch weniger gut.
- source_word: ⲉⲧϣⲁⲉⲓⲏⲧ
  choice: die kommen werden
  rationale: Die Relativkonstruktion mit Zukunftsbezug wird schlicht futurisch wiedergegeben, ohne die stärkere Nuance „unmittelbar bevorstehen“ festzulegen.
- source_word: ϩⲉⲛⲏⲇⲟⲛⲏ
  choice: Vergnügungen
  rationale: Das griechische Lehnwort ἡδονή bezeichnet Lust oder Vergnügen. „Vergnügungen“ wahrt den pluralischen Katalog und vermeidet eine unnötig sexualisierte Einengung.
- source_word: ⲡⲣⲟⲥ ⲡⲉⲟⲩⲉⲓϣ
  choice: für eine Zeit
  rationale: Die OCR-Zeilentrennung kann ⲡⲉ|ⲟⲩⲉⲓϣ künstlich auseinanderreißen. Als Zeitangabe gelesen ergibt die Folge natürlicher „für eine Zeit“ statt eines ergänzten, im Text nicht ausdrücklichen „zu euch hin“.
- source_word: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ
  choice: die sie ergreifen werden
  rationale: Die Form wird als relative Zukunftsaussage mit pluralischem Objekt verstanden. Da Verbnuance und Subjektzuordnung unsicher sind, wird eine mögliche, aber nicht exklusive Deutung im Text gewählt und in der Fußnote offengelegt.
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: bis sie wieder klaren Sinnes sind
  rationale: 'Die Form ist verbal und geht auf νήφω zurück: nüchtern beziehungsweise klaren Sinnes werden. Anders als die englische Konsultationsfassung wird sie daher nicht zu einem parallelen Substantiv umgebildet.'
- source_word: ⲛⲥⲉⲡⲱⲧ ⲉϩⲣⲁⲓ
  choice: und hinauf … fliehen
  rationale: ⲡⲱⲧ kann „laufen“ oder „fliehen“ bedeuten. „Fliehen“ gibt hier die gerichtete, abrupte Bewegung wieder; ⲉϩⲣⲁⲓ wird ausdrücklich mit „hinauf“ erhalten.
- source_word: ⲡⲟⲩⲕⲏⲛⲏ
  choice: ihre Leere
  rationale: Die Form wird entsprechend der möglichen griechischen Wortfamilie κενός/κένωμα als „Leere“ verstanden. Wegen unsicherer OCR und der möglichen Alternative „Armut“ wird die Entscheidung angemerkt.
theological_decisions:
- issue: Bezug und Wirkung der Vergnügungen
  choice: Die Vergnügungen werden als zeitweilige Mächte dargestellt, die Menschen ergreifen.
  alternative: Die Angeredeten ergreifen oder empfangen eine Macht beziehungsweise die Vergnügungen.
  rationale: Die Worttrennung der OCR ist unsicher. Die gewählte Lesung vermeidet die unbelegte Ergänzung „zu euch“ und folgt der wahrscheinlichen Verbindung von ⲡⲉⲟⲩⲉⲓϣ als Zeitangabe, ohne aus der schwierigen Syntax eine Lehrbehauptung abzuleiten.
- issue: Nüchternheit beziehungsweise Klarheit des Sinnes
  choice: Die verbale Bewegung „bis sie wieder klaren Sinnes sind“ bleibt erhalten.
  alternative: Ein abstraktes Substantiv „Klarheit des Sinnes“ als weiterer Posten im Katalog.
  rationale: Die koptische Form ist verbal. Dadurch bleibt die Spannung zwischen zeitweiliger Verstrickung und anschließendem Klarwerden bestehen, ohne sie systematisch-theologisch auszudeuten.
translation_notes:
  register: Moderner, würdevoller deutscher Prosastil mit bewusst beibehaltener katalogartiger Wiederholung. Der ungewöhnliche Plural „Unwissenheiten“ spiegelt die Form des Koptischen. Wegen der niedrigen OCR- und Alignment-Sicherheit werden syntaktische Unsicherheiten nicht geglättet, sondern knapp in Fußnoten ausgewiesen.
