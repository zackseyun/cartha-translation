  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: de
  text: '**9.** Die Stille[a] der Engel, die im Wort[b] ausgesandt wurden, und der Götter;

    der Götter, die durch den Ratschluss hervorgehen;


    und die Geister der Menschen, die bei mir sind,


    und die Frauen, die im Innern sind.


    Ich bin die – ihr …[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lesung von ⲥⲓⲥ ist unsicher. Möglich sind „Stille/Schweigen“ oder eine Aufforderung wie „Schweigt!“; „Stille“ erhält die reihende Struktur.
    reason: Unsichere Ausgangsform und mögliche alternative Syntax.
  - marker: b
    text: Wörtlich auch „im Logos“; das griechische Lehnwort λόγος kann sowohl „Wort“ als auch einen kosmologischen Fachbegriff bezeichnen.
    reason: Lexikalische und theologische Mehrdeutigkeit.
  - marker: c
    text: Der Textausschnitt bricht nach dem Beginn einer Form der zweiten Person Plural ab; der Satz bleibt daher unvollständig.
    reason: Grenze und Beschädigung des überlieferten OCR-Ausschnitts.
lexical_decisions:
- source_word: ⲥⲓⲥ
  choice: Stille
  rationale: Die Form ist unsicher, bezeichnet aber wahrscheinlich Stille oder Schweigen. Das Substantiv wahrt die reihende Satzstruktur; die Unsicherheit wird kenntlich gemacht.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: der Engel
  rationale: Das griechische Lehnwort bezeichnet hier am ehesten himmlische Engel; „Boten“ bliebe lexikalisch möglich.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟⲟⲩ
  choice: die … ausgesandt wurden
  rationale: Die über den Zeilenumbruch reichende Form wird als Relativkonstruktion mit dem Verb „aussenden“ verstanden, nicht als Bezeichnung der „Ersten“.
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  choice: im Wort
  rationale: ϩⲙ̄ bezeichnet den Bereich oder das Innere; „Wort“ gibt das griechische Lehnwort λόγος verständlich wieder, ohne den möglichen Fachsinn zu beseitigen.
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  choice: der Götter
  rationale: Die wiederholte Form und der Parallelismus sprechen für den Plural; die morphologisch mögliche singularische Deutung wird in einer Fußnote bewahrt.
- source_word: ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ
  choice: die durch den Ratschluss hervorgehen
  rationale: ϣⲟϫⲛⲉ bedeutet „Rat, Ratschluss, Plan“; „Stimme“ wäre hier nicht sachgerecht. ⲉⲃⲟⲗ wird mit „hervorgehen“ wiedergegeben.
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: die Geister der Menschen
  rationale: ⲡⲛⲁ ist hier als abgekürzte Schreibung von ⲡⲛⲉⲩⲙⲁ, „Geist“, zu verstehen; ⲣⲱⲙⲉ ist generisch und wird inklusiv als „Menschen“ wiedergegeben.
- source_word: ⲉⲛⲓⲙⲉⲧ ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: die bei mir sind
  rationale: Die OCR-Folge wird als beschädigte Form von „die existieren/sind“ verstanden; in natürlichem Deutsch genügt „die bei mir sind“.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: die Frauen
  rationale: Die Form ist der Plural von „Frau“ und bedeutet nicht „die Weisen“.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: die im Innern sind
  rationale: ⲛ̄ϩⲏⲧ kann „darin, im Innern, im Herzen“ bedeuten. „Im Innern“ erhält die räumliche und innere Offenheit.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ-
  choice: Ich bin die, die ihr …
  rationale: Die feminine Selbstbezeichnung wird bewahrt. Die letzte Form leitet die zweite Person Plural ein, bricht im vorliegenden Ausschnitt jedoch ab.
theological_decisions:
- issue: Plural oder Singular bei ⲛⲟⲩⲧⲉ
  choice: Götter
  alternative: Gott
  rationale: Wiederholung und syntaktischer Parallelismus begünstigen den Plural. Da Coptic bei der Form syntaktische Mehrdeutigkeit zulassen kann und die Wahl theologisch bedeutsam ist, wird die Alternative ausdrücklich genannt.
- issue: Technischer Sinn von λόγος
  choice: Wort
  alternative: Logos
  rationale: „Wort“ ist allgemein verständlich und lässt einen personifizierten oder kosmologischen Sinn offen; „Logos“ würde diesen stärker festlegen.
