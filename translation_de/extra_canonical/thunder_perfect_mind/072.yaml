  register: Modernes, würdevolles Standarddeutsch mit bewusst reihendem, hymnisch-rätselhaftem Satzbau. Unklare oder abgebrochene Stellen werden nicht ergänzt; die feminine Selbstbezeichnung der Sprecherin bleibt ausdrücklich erhalten.
