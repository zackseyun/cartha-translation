base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/083.yaml
  text: 'I am the division and the stripping[a].

    I am the dwelling[c].

    And I am the robbery; I am

    the one who sees what comes

    down to me.

    I am the flight of the release[d][b][a][d][c][b].

    I am I.'
translation:
  language: de
  text: '**8.** Ich bin die Trennung und die Entblößung.[a]


    Ich bin die Wohnstatt.


    Und ich bin der Raub. Ich bin

    der, der sieht, was zu mir

    herabkommt.


    Ich bin die Flucht der Freilassung.[b]


    Ich bin ich.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden koptischen Ausdrücke sind selten und in diesem Zusammenhang unsicher. Möglich sind Bedeutungen aus den Bereichen „Trennung/Teilung“ und „Entkleidung/Entblößung“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht eine Genitivverbindung: „die Flucht der Freilassung/des Loslassens“. Ob damit eine Flucht vor, aus oder durch die Freilassung gemeint ist, bleibt offen.'
    reason: ambiguity
  - marker: c
    text: 'Wörtlich: „Ich, ich.“ Die Übersetzung versteht die Wiederholung als nachdrückliche Selbstidentifikation.'
    reason: translation_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Ich bin
  rationale: Die sahidische Kopulakonstruktion wird in ihrer wiederholten, für das Gedicht prägenden Selbstprädikation bewahrt.
- source_word: ⲡⲡⲱⲧⲣ
  choice: die Trennung
  rationale: Das Wort bezeichnet hier ein Trennen bzw. eine Teilung; die abstrakte Substantivierung passt zur Reihe gegensätzlicher Selbstaussagen.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: die Entblößung
  rationale: Die Verbindung mit ⲉⲃⲟⲗ wird als Entkleiden bzw. Entblößen verstanden; die lexikalische Unsicherheit wird in einer Fußnote sichtbar gemacht.
- source_word: ⲧⲙⲟⲛⲏ
  choice: die Wohnstatt
  rationale: Das griechische Lehnwort μονή bezeichnet Bleibe, Wohnung oder Wohnstatt. „Wohnstatt“ ist konkret, würdig und erhält das räumliche Bild.
- source_word: ⲡⲕⲱⲗ
  choice: der Raub
  rationale: Das einfache ⲕⲱⲗ wird hier nach der koptischen Bedeutung „stehlen, rauben“ verstanden und nicht mit dem vorausgehenden Ausdruck gleichgesetzt.
- source_word: ⲡⲉⲧⲛⲁⲩ
  choice: der, der sieht
  rationale: Die Relativbildung bezeichnet die sehende Person; die verbale Form bleibt im Deutschen erhalten.
- source_word: ⲉⲧⲛⲏⲟⲩ
  choice: was … herabkommt
  rationale: ⲛⲏⲟⲩ ist als qualitative Form von „kommen“ zu lesen, nicht als „sichtbar“.
- source_word: ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: zu mir herab
  rationale: Die Wendung drückt eine abwärts gerichtete Bewegung zur Sprecherin aus; „zu mir herab“ gibt beide Bestandteile natürlich wieder.
- source_word: ⲫⲱⲧ
  choice: die Flucht
  rationale: Das einheimische koptische Wort bedeutet „Flucht/Fliehen“; es ist nicht mit dem griechischen φῶς „Licht“ gleichzusetzen.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: der Freilassung
  rationale: Die Folge wird als Genitivverbindung mit dem substantivierten Ausdruck ⲕⲱ ⲉⲃⲟⲗ „Freilassen, Loslassen“ aufgefasst, nicht als verneintes Perfekt.
- source_word: ⲁⲛⲟⲕ ⲁⲛⲟⲕ
  choice: Ich bin ich
  rationale: Die wörtliche Wiederholung „Ich, ich“ wird als emphatische Selbstidentifikation idiomatisch wiedergegeben, ohne ihr eine zusätzliche inhaltliche Bestimmung zu geben.
theological_decisions:
- issue: Deutung der paradoxen Selbstprädikationen
  choice: Die gegensätzlichen und teilweise dunklen Prädikate bleiben unaufgelöst nebeneinander stehen.
  alternative: Die Aussagen als festes theologisches System oder als eindeutig positive bzw. negative Eigenschaften auslegen.
  rationale: Der Text entfaltet seine Wirkung durch paradoxe Identifikationen; eine harmonisierende Deutung würde eine nicht ausdrücklich genannte Lehrposition eintragen.
- issue: Genitiv in „Flucht der Freilassung“
  choice: Die formale Mehrdeutigkeit der Beziehung zwischen „Flucht“ und „Freilassung“ bleibt erhalten.
  alternative: „Flucht vor der Freilassung“ oder „Flucht durch die Freilassung“.
  rationale: Die koptische Genitivverbindung bestimmt nicht eindeutig, ob Herkunft, Zugehörigkeit, Ursache oder Ziel gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knappen, parallel gebauten Selbstaussagen. Die Zeilenführung erhält den hymnisch-rätselhaften Rhythmus; ungewöhnliche Formulierungen werden dort bewahrt, wo der koptische Text selbst mehrdeutig oder paradox ist.
