base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: de
  text: '**12.** Ich bin die Geehrte und die, die man segnet, und die, die man voller Verachtung verachtet. Ich bin der Friede, und durch mich gibt es Krieg.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe koptische Form kann auch anders rekonstruiert und als »und ich bin der Krieg« verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: die Geehrte
  rationale: Als Qualitativ von ⲧⲁⲉⲓⲟ, »geehrt«, gelesen; dies entspricht der antithetischen Reihung und vermeidet die frühere Fehlanalyse als Form von »kommen«.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: die, die man segnet
  rationale: ⲥⲙⲟⲩ bedeutet hier »segnen«; das am Zeilenwechsel erhaltene ⲣⲟⲥ gehört wahrscheinlich zu ⲉⲣⲟⲥ und bezeichnet das feminine Objekt, nicht zum rekonstruierten Titel »die Erste«.
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: die, die man … verachtet
  rationale: Das griechische Lehnverb καταφρονεῖν bezeichnet Verachtung; ⲙⲙⲟⲥ markiert die Sprecherin als Objekt.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: voller Verachtung
  rationale: Die adverbiale Wendung verstärkt das Verachten. Die idiomatische deutsche Wiedergabe bewahrt diese ausdrücklich im Ausgangstext vorhandene Nuance.
- source_word: ϯⲣⲏⲛⲏ
  choice: der Friede
  rationale: Das griechische Lehnwort εἰρήνη ist eindeutig. Der bestimmte Artikel erhält die prädikative, personifizierende Aussage.
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: durch mich gibt es Krieg
  rationale: ⲛⲧⲁ- wird kausal als »durch/wegen mich« verstanden; πόλεμος bedeutet »Krieg«. Die elliptische Form bleibt textkritisch nicht völlig sicher.
theological_decisions:
- issue: Paradoxe Selbstaussage über Frieden und Krieg
  choice: Ich bin der Friede, und durch mich gibt es Krieg
  alternative: Ich bin der Friede, und ich bin der Krieg
  rationale: Die kausale Lesart bildet die vorliegende Form ⲛⲧⲁ am ehesten ab und bewahrt zugleich die Spannung, ohne die Sprecherin ausdrücklich mit dem Krieg gleichzusetzen. Die alternative Rekonstruktion wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feminine Form der wiederholten Selbstaussage wird beibehalten. Das markante Paradox und die antithetische Parallelstruktur des koptischen Textes bleiben erhalten; eine unsichere alternative Lesart wird nicht in den Haupttext eingetragen, sondern transparent angemerkt.
