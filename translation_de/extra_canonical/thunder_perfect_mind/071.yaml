base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: de
  text: '**8.** Ich bin die Weisung derer, die mich bitten[a],


    und die Stimme der Stimmen am Ort der Vergöttlichung[b]

    der Engel, die sie im Wort hervorgebracht haben,


    und der Götter der Götter, hervorgegangen durch den Ratschluss.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Befehl“ oder „die Anordnung derer, die mich bitten“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier das griechische Lehnwort „Theosis“, das „Vergöttlichung“ bedeutet. Wegen der unsicheren OCR-Überlieferung bleibt die Lesung mit Vorbehalt.
    reason: textual_uncertainty
  - marker: c
    text: Der Satzbau des OCR-Ausschnitts ist unsicher. Besonders die Bezüge von „die sie hervorgebracht haben“ und „hervorgegangen“ lassen sich nicht eindeutig bestimmen.
    reason: alignment_note
lexical_decisions:
- source_word: ⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: Weisung
  rationale: Das belegte koptische Kompositum bezeichnet einen Befehl, eine Anordnung oder Weisung. „Weisung“ bewahrt den autoritativen Sinn, ohne die falsche Zerlegung als „Gewand der Einheit“ zu übernehmen.
- source_word: ⲁⲓⲧⲉⲓ
  choice: bitten
  rationale: Das aus dem Griechischen entlehnte Verb bedeutet „bitten/verlangen“. Im Bezug auf eine Person klingt „mich bitten“ im Deutschen natürlicher als „mich fragen“.
- source_word: ⲥⲙⲏ
  choice: Stimme
  rationale: „Stimme“ ist die reguläre Bedeutung und erhält die auffällige Wiederholung „Stimme der Stimmen“.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: Vergöttlichung
  rationale: Die OCR-Buchstaben ergeben das griechische Lehnwort θέωσις, „Vergöttlichung“. Diese Lesart ist quellennäher als eine Umdeutung zu „Göttern“.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  choice: Engel
  rationale: Das griechische Lehnwort bezeichnet hier am ehesten himmlische Wesen; „Engel“ entspricht dem religiös-poetischen Kontext.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Wort
  rationale: „Wort“ gibt den Grundsinn wieder und vermeidet, durch „Logos“ ungefragt einen festgelegten theologischen Fachbegriff einzuführen.
- source_word: ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ
  choice: Götter der Götter
  rationale: Die wiederholte Pluralform wird formal bewahrt; eine Harmonisierung zu „Gott“ würde die mythologische und theologische Spannung glätten.
- source_word: ϣⲟϫⲛⲉ
  choice: Ratschluss
  rationale: Das Wort bedeutet „Rat, Plan, Beschluss“, nicht „Schrei“. „Ratschluss“ passt zu einem planvollen Hervorgehen und wahrt den gehobenen Ton.
- source_word: ⲧⲁⲟⲩⲟ
  choice: hervorgebracht
  rationale: Das Verb kann „hervorbringen, aussenden, äußern“ bedeuten. „Hervorgebracht“ lässt offen, ob Hervorsendung oder sprachliche Äußerung im Vordergrund steht.
theological_decisions:
- issue: ⲑⲉⲱⲥⲓⲥ als theologischer Ausdruck
  choice: Vergöttlichung
  alternative: Theosis
  rationale: Die deutsche Bedeutungswiedergabe ist allgemein verständlich und lässt den ungewöhnlichen theologischen Gedanken stehen, ohne ihn konfessionell auszudeuten.
- issue: Pluralische Götterbezeichnung
  choice: Götter der Götter
  alternative: Gott der Götter
  rationale: Die vorliegende Zeichenfolge weist zweimal die Pluralform auf. Der befremdliche Plural wird daher nicht stillschweigend monotheistisch harmonisiert.
- issue: ⲗⲟⲅⲟⲥ
  choice: Wort
  alternative: Logos
  rationale: Der Kontext gestattet sowohl den gewöhnlichen als auch einen technischen Sinn. „Wort“ wahrt diese Offenheit besser.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener hymnischer Wiederholung. Ungewöhnliche Genitivketten und theologische Mehrdeutigkeiten werden nicht geglättet; offenkundig fehlerhafte frühere Zerlegungen und die unzutreffende Deutung von ϣⲟϫⲛⲉ als „Schrei“ werden vermieden.
