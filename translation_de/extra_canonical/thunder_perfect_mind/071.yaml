review_pass:
  verdict: revise
  source_fidelity: Die erste Zeile ist mit „Weisung derer, die mich bitten“ sachgerecht wiedergegeben. Der Entwurf verfehlt jedoch ⲧⲁⲟⲩⲟⲩ, das hier zu ⲧⲁⲓⲟⲟⲩ („ehren/verherrlichen“) gehört, nicht zu „hervorbringen/aussenden“. ⲡϣⲟϫⲛⲉ ist dagegen zutreffend als „Ratschluss“ verstanden. Die Wiederholung von ⲛⲟⲩⲧⲉ ist syntaktisch wegen des OCR-ausgerichteten Ausschnitts nicht sicher aufzulösen und soll sichtbar erhalten bleiben.
  naturalness: 'Die bestehende Fassung ist trotz ihres poetischen Registers syntaktisch irreführend: „der Engel, die sie im Wort hervorgebracht haben“ macht die Engel zu einem unklaren Objekt des Hervorbringens. Die Revision bleibt bewusst knapp und fragmentarisch, ist aber im Deutschen lesbar und gibt die unsichere koptische Reihung nicht künstlich als glatten Satz aus.'
  terminology: „Weisung“, „Stimme“, „Vergöttlichung“, „Engel“, „Wort“, „Götter“ und „Ratschluss“ sind angemessen. „Vergöttlichung“ übersetzt das Lehnwort ⲑⲉⲱⲥⲓⲥ ohne konfessionelle Festlegung. Das in der Vorlage behauptete „Schrei“-Verständnis von ϣⲟϫⲛⲉ wäre nicht haltbar.
  issues:
  - severity: high
    issue: ⲧⲁⲟⲩⲟⲩ wurde als „hervorgebracht“ übersetzt.
    rationale: Die Form ist als ⲧⲁⲓⲟⲟⲩ zu verstehen und bezeichnet ehren bzw. verherrlichen. Die Übersetzung muss daher die Engel als diejenigen wiedergeben, die im Wort geehrt wurden, nicht als Hervorgebrachte.
  - severity: medium
    issue: Der letzte Teil wird zu bestimmt als „Götter der Götter, hervorgegangen“ konstruiert.
    rationale: Die zweimalige Götterbezeichnung und ihre syntaktische Anbindung sind im OCR-Ausschnitt nicht sicher. Eine wiederholende, durch einen Gedankenstrich markierte Wiedergabe wahrt die Unsicherheit besser.
  - severity: low
    issue: Fußnote b beruft sich unnötig auf eine unsichere OCR-Lesung.
    rationale: Die überlieferte Zeichenfolge enthält deutlich ⲑⲉⲱⲥⲓⲥ. Die größere Unsicherheit betrifft die Satzverknüpfung im weiteren Ausschnitt, nicht die Bedeutung des Wortes selbst.
