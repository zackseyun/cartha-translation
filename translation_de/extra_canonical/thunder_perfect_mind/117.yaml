    reason: textual_variant
  - marker: b
    text: Mehrere Wörter der Reihung sind im OCR beschädigt. „Leeren“ und „zeitweiligen“ folgen den wahrscheinlichen Lesungen „leer/nichtig“ beziehungsweise πρόσκαιρος („zeitweilig, vergänglich“).
    reason: source_uncertainty
  revision_rationale: 'Die Überarbeitung beschränkt sich auf sichere idiomatische und quellentreue Anpassungen: Die Zustandsformulierung wird nicht als „leben“ ausgelegt, die abstrakte Lasterbezeichnung wird im Deutschen natürlich gefasst, und das temporäre Attribut wird genauer wiedergegeben. Die umstrittene Lesung νόμος/τέλος wird weder verschwiegen noch im Haupttext zugunsten der Alternativlesung ersetzt.'
