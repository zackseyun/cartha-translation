base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/117.yaml
  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: de
  text: '**1.** Wer mich nach dem Gesetz[a] richten wird – richtet ihn! Ihr, die ihr in vielen Sünden, in Zügellosigkeiten, in nichtigen Leidenschaften und in vergänglichen Vergnügungen lebt![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift ist an dieser Stelle im OCR entstellt. Wahrscheinlich ist „Gesetz“ (griechisch νόμος) zu lesen; nach einer anderen Rekonstruktion heißt es „am Ende“ (griechisch τέλος).
    reason: textual_variant
  - marker: b
    text: Mehrere Wörter dieses Satzes sind im OCR beschädigt. Die Wiedergaben „nichtige“ und „vergängliche“ beruhen auf den wahrscheinlichen Lesungen „leer/nichtig“ und „zeitweilig/vergänglich“.
    reason: source_uncertainty
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: richten
  rationale: Das griechische Lehnwort κρίνειν bezeichnet hier ein urteilendes Richten; die Wiederholung bewahrt das Wortspiel zwischen Relativsatz und Aufforderung.
- source_word: 'ⲛⲟⲙⲟⲥ (im OCR offenbar entstellt: ⲛⲉⲗⲟⲥ)'
  choice: Gesetz
  rationale: Die Rekonstruktion als griechisches Lehnwort νόμος passt zum überlieferten Zusammenhang „nach dem Gesetz richten“ besser als die frühere Vermutung τέλος („Ende“). Wegen des unsicheren OCR-Befunds wird dies in einer Fußnote offengelegt.
- source_word: ⲉⲛⲁϣⲱⲟⲩ
  choice: vielen
  rationale: Die Form gibt die große Zahl beziehungsweise Menge an und bestimmt „Sünden“.
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: Zügellosigkeiten
  rationale: Die Bildung bezeichnet mangelnde Selbstbeherrschung oder Unbeherrschtheit, nicht Unwissenheit. Der abstrakte Plural der Vorlage bleibt erhalten.
- source_word: ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ (im OCR entstellt)
  choice: nichtigen Leidenschaften
  rationale: πάθος hat in diesem Lasterkatalog den ethischen Sinn „Leidenschaft“; das rekonstruierte Attribut bedeutet „leer, nichtig“.
- source_word: ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ (im Ausschnitt abgebrochen)
  choice: vergänglichen Vergnügungen
  rationale: ἡδονή bezeichnet Vergnügen oder Lust; πρόσκαιρος bedeutet zeitweilig beziehungsweise vergänglich. „Vergänglich“ klingt im Deutschen natürlich und wahrt den Gegensatz zum Dauerhaften.
- source_word: ϣⲟⲟⲡ ϩⲛ
  choice: lebt in
  rationale: Wörtlich „seid/befindet euch in“. „In … lebt“ gibt den fortdauernden Zustand in natürlichem Deutsch wieder, ohne die moralische Aussage zu verstärken.
theological_decisions:
- issue: Bezug des Gerichts auf Gesetz oder Ende
  choice: „nach dem Gesetz“ im Haupttext
  alternative: „am Ende“
  rationale: Der sichtbare OCR-Text ist beschädigt. Die kontextuell und paläografisch begründete Rekonstruktion νόμος erklärt die Verbindung mit „richten“ und den vorausgehenden Zusammenhang besser; die verbreitete Rekonstruktion τέλος bleibt als echte textkritische Alternative in der Fußnote erhalten.
- issue: Sprechwechsel vom zukünftigen Richter zur Aufforderung
  choice: 'Relativsatz plus Imperativ: „Wer … richten wird – richtet ihn!“'
  alternative: 'Durchgehender Aussagesatz: „Wer … richten wird, wird jene richten …“'
  rationale: Die rekonstruierte Folge enthält wahrscheinlich einen dramatischen Imperativ und anschließend die Anrede „ihr, die ihr …“. Die Zeichensetzung macht diesen Wechsel sichtbar, ohne die Identität der Angeredeten theologisch festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die anklagende, rhythmische Reihung bleibt durch parallele Präpositionalgruppen erhalten. „Zügellosigkeiten“ ist bewusst kräftig, aber allgemeinverständlich; „Vergnügungen“ vermeidet eine unnötige Verengung auf Sexualität. Die textkritische Unsicherheit wird nicht im Haupttext geglättet, sondern knapp in den Fußnoten ausgewiesen.
