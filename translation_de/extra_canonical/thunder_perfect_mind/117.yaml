review_pass:
  verdict: revise
  source_fidelity: Die Hauptlesung „nach dem Gesetz“ folgt der im Audit-Trail begründeten Rekonstruktion von ⲛⲟⲙⲟⲥ trotz des stark beschädigten OCR-Befunds; die Alternative „am Ende“ bleibt zu Recht als unsichere Rekonstruktion belegt. Der Imperativ „richtet ihn!“ und die anschließende pluralische Anrede bewahren den wahrscheinlichen Sprechwechsel. Die Lasterreihe gibt „viele Sünden“, mangelnde Selbstbeherrschung, leere/nichtige Leidenschaften und zeitweilige Vergnügungen sachgerecht wieder.
  naturalness: „Ihr, die ihr in … lebt“ ist gegenüber dem kopulativen ϣⲟⲟⲡ ϩⲛ unnötig interpretierend. „Ihr, die ihr in … seid“ ist hier zugleich näher an der Vorlage und in einer feierlich-anklagenden Anrede idiomatisch. „Unbeherrschtheiten“ wäre zwar formal parallel, ist aber kein gutes modernes Deutsch; „Zügellosigkeit“ als nicht zählbarer Sammelbegriff klingt natürlicher.
  terminology: „richten“, „Gesetz“, „Sünden“, „Leidenschaften“ und „Vergnügungen“ sind registergerecht. „Leere Leidenschaften“ gibt das rekonstruierte Attribut unmittelbarer wieder als „nichtige“; beide bleiben semantisch möglich. „Zeitweilige“ wahrt bei πρόσκαιρος die temporäre Bedeutung genauer als das stärker theologisch konnotierte „vergängliche“.
  issues:
  - severity: low
    issue: „lebt in“ erweitert die kopulative Zustandsaussage.
    rationale: ϣⲟⲟⲡ ϩⲛ bedeutet primär „sein/sich befinden in“. Die deutsche Wendung „in … sein“ wahrt die Aussage ohne zusätzliche Lebensführungsnuance.
  - severity: low
    issue: „Zügellosigkeiten“ ist im Deutschen schwerfällig.
    rationale: Die Vorlage führt zwar eine abstrakte Kategorie in einer Reihung, doch die singuläre Sammelbezeichnung „Zügellosigkeit“ ist im modernen Deutsch natürlicher und verändert den Sinn nicht.
  - severity: low
    issue: Die Fußnote zu den beschädigten Wörtern nennt die konkrete Rekonstruktion für „zeitweilig“ nicht.
    rationale: Eine knappe Benennung von πρόσκαιρος macht transparent, dass das Attribut nicht bloß stilistisch ergänzt wurde.
