base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: de
  text: '**6.** Und ich bin die, deren Feste zahlreich sind.[a]


    Ich, ich bin eine Gottlose,

    und ich bin die, deren Gott groß ist.


    Ich bin die, über die ihr nachgedacht habt,

    und ihr habt mich verachtet.


    Ich bin eine Ungelehrte,

    und sie lernen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die koptische Zeichenfolge ist in der vorliegenden OCR offenbar beschädigt. Wahrscheinlich ist gemeint: „die, deren Feste zahlreich sind“; der genaue Wortlaut bleibt unsicher.'
    reason: textual_uncertainty
  - marker: b
    text: Wörtlicher liegt eine Wendung wie „Unterweisung empfangen“ vor. Ein ausdrückliches „von mir“ steht im erhaltenen Wortlaut nicht.
    reason: lexical_clarification
lexical_decisions:
- source_word: ⲧⲉⲛϣⲉⲛⲉⲥⲱⲥ
  choice: die, deren Feste zahlreich sind
  rationale: Die OCR-Zeichenfolge ist offenbar fehlerhaft, lässt sich aber plausibel als elliptische Wendung mit ⲛⲁϣⲉ („zahlreich/groß sein“) und einem Ausdruck für ihre Feste verstehen. Die Formulierung bleibt wegen des unsicheren Textbestands in einer Fußnote gekennzeichnet.
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: eine Gottlose
  rationale: Das Privativpräfix ⲁⲧ- mit ⲛⲟⲩⲧⲉ bezeichnet eine Person „ohne Gott“. „Gottlose“ wahrt die feminine Sprecherstimme und den unmittelbaren Gegensatz zur folgenden Aussage, ohne die modernen begrifflichen Konnotationen von „Atheistin“ einzutragen.
- source_word: ⲧⲉ ⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ
  choice: die, deren Gott groß ist
  rationale: Die wahrscheinlich durch OCR entstellte Konstruktion wird als Relativsatz mit ⲛⲁϣⲉ („groß sein“) verstanden. So entsteht der im Kontext beabsichtigte paradoxe Gegensatz zu „eine Gottlose“.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: über die ihr nachgedacht habt
  rationale: Das koptische resumptive Pronomen ⲉⲣⲟⲓ („über mich“) wird im Deutschen idiomatisch in den Relativsatz integriert.
- source_word: ϣⲟⲥⲧ
  choice: verachtet
  rationale: Das Verb bedeutet „verachten, verschmähen, zurückweisen“. „Verachtet“ gibt den Gegensatz zum vorausgehenden Nachdenken knapp und natürlich wieder.
- source_word: ⲁⲧⲥⲃⲱ
  choice: eine Ungelehrte
  rationale: Die privative Bildung aus ⲁⲧ- und ⲥⲃⲱ („Lehre/Unterweisung“) bezeichnet eine ungelehrte oder ununterrichtete Person. „Ungelehrte“ bewahrt die formale Verbindung zum folgenden „lernen“.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: lernen
  rationale: Die Verbindung bedeutet idiomatisch „lernen“ beziehungsweise „Unterweisung empfangen“. Das Richtungselement ⲉⲃⲟⲗ wird nicht gesondert wiedergegeben.
theological_decisions:
- issue: Paradox zwischen Gottlosigkeit und einem großen Gott
  choice: „eine Gottlose … deren Gott groß ist“
  alternative: „eine ohne Gott … deren Gott groß ist“
  rationale: Die paradoxe Spannung des Textes wird nicht erklärt oder harmonisiert. „Gottlose“ ist im Deutschen prägnant und entspricht der substantivierten weiblichen Selbstbezeichnung.
- issue: Schreibung von „Gott“
  choice: Großschreibung
  alternative: „deren gott groß ist“
  rationale: Die deutsche Standardschreibung und der Kontext legen die Bezeichnung einer Gottheit als Eigenbezeichnung nahe; die Großschreibung entscheidet nicht über die Identität oder dogmatische Einordnung dieses Gottes.
- issue: Unausgesprochenes Bezugsobjekt des Lernens
  choice: „und sie lernen“
  alternative: „und sie lernen von mir“
  rationale: Der erhaltene Wortlaut nennt kein ausdrückliches „von mir“. Die mögliche kontextuelle Ergänzung wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Dignitäre, rhythmische Gegenwartssprache mit bewahrter Anapher („Ich bin“) und femininen Selbstbezeichnungen. Die kurzen, paradoxen Aussagen bleiben unaufgelöst; unnötige altertümliche oder konfessionell geprägte Begriffe werden vermieden.
