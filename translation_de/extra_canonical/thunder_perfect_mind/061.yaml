lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: erscheine
  rationale: Das sahidisch-koptische Verb bezeichnet das Erscheinen beziehungsweise Sichtbarwerden. „Erscheine“ bewahrt den Gegensatz zum Sich-Verbergen, ohne eine reflexive oder aktive Bedeutung hinzuzufügen.
- source_word: ϩⲟⲩⲛ ⲉⲣⲱⲧⲛ
  choice: euch
  rationale: Der im vorliegenden OCR-Text erkennbare Ausdruck richtet das Erscheinen auf „euch“; im Deutschen wird diese Richtung idiomatisch mit „jemandem erscheinen“ wiedergegeben.
- source_word: '[Motiv des Verbergens; im Ausschnitt kein sicher lesbares Lexem]'
  choice: vor der ihr euch verborgen habt
  rationale: Das Verbergungselement beruht auf der überlieferten paradoxen Verbindung von Verbergen und Erscheinen, ist im vorliegenden OCR-Ausschnitt jedoch nicht eindeutig nachweisbar; die Fußnote kennzeichnet diese Unsicherheit.
theological_decisions:
- issue: Richtung des Erscheinens
  choice: ich erscheine euch
  alternative: ihr zeigt euch mir / ihr erscheint mir
  rationale: Das sichtbare ⲉⲣⲱⲧⲛ bedeutet „euch/zu euch“ und stützt die Aussage, dass die Sprecherin den Angeredeten erscheint. Die traditionelle Segmentierung kehrt die Richtung um; diese Lesart wird in der Fußnote offengehalten.
- issue: Geschlecht der Ich-Stimme
  choice: die
  alternative: derjenige / diejenige
  rationale: Der Werktitel und die durchgehende weibliche Sprechergestalt legen im Deutschen die feminine Form nahe; die Formulierung soll darüber hinaus keine besondere dogmatische Identifikation festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der knappe paradoxe Parallelismus bleibt erhalten. Die Übersetzung folgt beim Richtungspronomen vorrangig dem sichtbaren koptischen Wortlaut und kennzeichnet sowohl die traditionelle Umkehrung als auch die unsichere Segmentgrenze.
