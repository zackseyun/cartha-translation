  terminology: „Beratungen“ ist für ϣⲟϫⲛⲉ vertretbar. „Barbarin“ soll als historisch pointierte Selbstbezeichnung erhalten bleiben; die Fußnote erklärt sie angemessen, muss jedoch die wegen der beschädigten OCR nur vorsichtige Absicherung beibehalten. Der englische Audit-Text („those who are afraid … strength in trembling“) gehört nach dem sichtbaren Koptisch nicht zu diesem Segment und darf nicht als Grundlage dienen.
