translation:
  language: de
  text: … in euren Beratungen? Denn ich werde unter denen schweigen, die schweigen; dann werde ich hervortreten und reden. Warum also hasst ihr mich, ihr Griechen? Weil ich eine Barbarin[a] bin …?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Barbarin“ gibt das griechische Lehnwort bárbaros wieder: aus griechischer Sicht eine nicht griechisch sprechende Person beziehungsweise eine Fremde. Das Wort ist hier Teil des zugespitzten Gegensatzes zu „ihr Griechen“ und nicht als heutige pauschale Abwertung zu verstehen. Der OCR-Text ist an dieser Stelle stark beschädigt.'
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: ϩⲛ ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: in euren Beratungen
  rationale: ϩⲛ bezeichnet hier den Bereich („in/bei“), und ⲛⲉⲧⲛ- ist als Possessivform der 2. Person Plural zu verstehen. Da der Ausschnitt mitten im Satz beginnt, bleibt der deutsche Anfang offen.
- source_word: ϯⲛⲁⲕⲣⲣⲱ … ϩⲛ ⲛⲉⲧⲕⲗⲏϣⲟⲩ
  choice: ich werde unter denen schweigen, die schweigen
  rationale: Die OCR ist beschädigt; im Zusammenhang ist die sahidische Wendung mit ⲕⲁ ⲣⲱ („schweigen“) und einer auf Personen bezogenen Relativform erkennbar. Das Futur ϯⲛⲁ- wird ausdrücklich als „werde“ wiedergegeben.
- source_word: ϯⲛⲁⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: ich werde hervortreten
  rationale: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ kann „erscheinen“, „offenbar werden“ oder „hervortreten“ bedeuten. „Hervortreten“ bildet den Gegensatz zum vorherigen Schweigen natürlich ab, ohne eine besondere Offenbarungstheologie einzutragen.
- source_word: ⲛⲧⲁϣⲁϫⲉ
  choice: und reden
  rationale: Die Konjunktivform schließt an das Hervortreten an; im Deutschen genügt die koordinierte Infinitivkonstruktion nach dem vorausgehenden Futur.
- source_word: ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ
  choice: Warum also
  rationale: ⲉⲧⲃⲉⲟⲩ fragt nach dem Grund; das griechische Lehnwort ⲅⲁⲣ verbindet folgernd oder begründend. „Also“ passt hier besser als ein steifes „denn“ innerhalb der Frage.
- source_word: ⲛⲗⲏⲛ
  choice: ihr Griechen
  rationale: Die OCR bewahrt erkennbar die Bezeichnung Ἕλλην/„Griechen“. Die direkte Anrede entspricht dem bekannten syntaktischen Zusammenhang, ist im OCR-Ausschnitt jedoch beschädigt.
- source_word: ⲙⲁⲩⲉⲣⲟⲥ
  choice: Barbarin
  rationale: Die beschädigte OCR weist auf das griechische Lehnwort βάρβαρος. „Barbarin“ bewahrt den ausdrücklichen Gegensatz zu „Griechen“; das feminine Deutsch entspricht der weiblichen Sprecherstimme und vermutlich der im Text erkennbaren femininen Kopula.
theological_decisions:
- issue: Schweigen und anschließendes Reden
  choice: Als spannungsvolle zeitliche Gegenüberstellung stehen lassen
  alternative: Das Schweigen bildlich als Verborgenheit und das Reden als Offenbarung ausdeuten
  rationale: Der Text verbindet beide Aussagen paradox, erklärt aber ihre theologische Bedeutung nicht. Die Übersetzung soll diese Spannung nicht konfessionell oder spekulativ auflösen.
- issue: Bezeichnung der Sprecherin als „Barbarin“
  choice: Den historisch-ethnolinguistischen Gegensatz wörtlich bewahren
  alternative: Mit „Fremde“ oder „Nichtgriechin“ glätten
  rationale: Das Lehnwort steht pointiert „Griechen“ gegenüber. Eine neutralisierende Wiedergabe würde die provokative Selbstbezeichnung und ihre soziale Spannung abschwächen.
translation_notes:
  register: Poetisch-rhetorischer, würdevoller Gegenwartston mit klarer Anrede. Das Futur und die Wiederholung von „schweigen“ bleiben erhalten. Auslassungspunkte markieren, dass der gelieferte OCR-Ausschnitt sowohl am Anfang als auch am Ende in einen größeren Satz- beziehungsweise Gedankenzusammenhang hineinragt. Der englische Konsultationstext gehört offenbar zu einem früheren Abschnitt und wurde deshalb nicht als Übersetzungsgrundlage verwendet.
