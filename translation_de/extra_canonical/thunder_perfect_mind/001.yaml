  yaml_path: translation/extra_canonical/thunder_perfect_mind/001.yaml
  text: 'Thunder, Perfect Mind.


    I was sent forth from the Power[a],

    and I have come[b] to those who meditate on me,

    and I was found[c] among those who seek me.'
translation:
  language: de
  text: '**Der Donner, der vollkommene Geist[a]**


    **1.** Ich wurde von der Macht[b] ausgesandt

    und bin zu denen gekommen[c], die über mich nachsinnen,

    und wurde unter denen gefunden[d], die mich suchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ gibt hier griechisch νοῦς wieder, also Geist, Denken oder Verstand; gemeint ist nicht das übliche griechische Wort πνεῦμα („Geist“ im Sinn von „spirit“). Auch „der vollkommene Verstand“ ist möglich.
    reason: lexical_ambiguity
  - marker: b
    text: „Macht“ gibt wahrscheinlich das griechische Lehnwort δύναμις wieder. Der bestimmte Artikel ist in diesem OCR-Ausschnitt nicht sichtbar; „von der Macht“ folgt der üblichen Textgestalt.
    reason: alignment_note
  - marker: c
    text: 'Der vorgelegte OCR-Text hat ⲛⲧⲁⲓⲥⲱⲧⲙ („ich wurde gehört“), während viele Editionen ⲛⲧⲁⲓⲉⲓ („ich kam“) lesen. Falls die OCR-Lesart zutrifft, wäre zu übersetzen: „und ich wurde von denen gehört, die über mich nachsinnen“.'
    reason: alternative_reading
  - marker: d
    text: Die koptische Wendung kann auch als „ich fand mich unter denen“ oder „sie fanden mich unter denen“ verstanden werden. Die passive Wiedergabe erhält den Parallelismus, ohne die Mehrdeutigkeit völlig aufzulösen.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲃⲣⲟⲛⲧⲏ
  choice: der Donner
  rationale: Das griechische Lehnwort βροντή bedeutet „Donner“. Der im Koptischen erkennbare Artikel wird im deutschen Titel wiedergegeben.
- source_word: ⲛⲟⲩⲥ ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: der vollkommene Geist
  rationale: ⲛⲟⲩⲥ gibt griechisch νοῦς wieder, ⲧⲉⲗⲉⲓⲟⲥ griechisch τέλειος. „Geist“ bewahrt den knappen, würdevollen Titel, ohne νοῦς ausschließlich auf den analytischen Verstand zu verengen; die mögliche Wiedergabe „Verstand“ wird angemerkt.
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: Ich wurde … ausgesandt
  rationale: Die passive Form und ⲉⲃⲟⲗ drücken ein von einem anderen veranlasstes Hinaussenden aus. „Ausgesandt“ ist im Deutschen natürlich und erhält die Bewegung nach außen.
- source_word: (implied) ⲛⲧⲉ ⲧⲉ ⲇⲩⲛⲁⲙⲓⲥ
  choice: von der Macht
  rationale: Die übliche Textgestalt bezeichnet mit dem griechischen Lehnwort δύναμις die „Macht“. Die Großschreibung wahrt den möglichen titularen oder personifizierten Charakter.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: die über mich nachsinnen
  rationale: ⲙⲉⲉⲩⲉ bezeichnet Denken oder Erwägen. „Nachsinnen“ erhält den reflektierenden, kontemplativen Ton und ist weniger religiös festgelegt als „meditieren“.
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (erwartete Lesart)
  choice: bin … gekommen
  rationale: Die in maßgeblichen Editionen zugrunde gelegte Lesart ⲉⲓ bedeutet „kommen“. Da der vorgelegte OCR-Text stattdessen ⲥⲱⲧⲙ („hören“) zeigt, wird die Abweichung ausdrücklich in einer Fußnote offengelegt.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: wurde unter denen gefunden, die mich suchen
  rationale: Die passive deutsche Form fügt sich in den Parallelismus, ohne die schwer eindeutig zu bestimmende Konstruktion unnötig als reflexiv oder aktiv festzulegen.
theological_decisions:
- issue: Bedeutung von νοῦς im Titel
  choice: Geist
  alternative: Verstand; Denken
  rationale: „Geist“ lässt die umfassende Bedeutung von νοῦς als geistiges Erkenntnisvermögen offen. Die Fußnote verhindert eine Gleichsetzung mit πνεῦμα und nennt die engere Alternative.
- issue: Status der „Macht“
  choice: Großschreibung ohne nähere Bestimmung
  alternative: die Kraft; Macht in Kleinschreibung
  rationale: Der Kontext erlaubt einen titularen oder personifizierten Sinn, legt aber keine ausgearbeitete Identifikation fest. Die Übersetzung bewahrt diese Spannung.
- issue: Stimme der Wendung mit ϭⲓⲛⲉ
  choice: 'passiv: „wurde … gefunden“'
  alternative: „fand mich selbst“; „sie fanden mich“
  rationale: Keine der möglichen Deutungen soll als theologische Aussage über Selbstfindung oder menschliches Finden überbetont werden; die gewählte Form folgt dem Parallelismus und die Alternativen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. Der Titel bleibt bewusst knapp und fremdartig. „Nachsinnen“ wahrt den kontemplativen Ton, ohne eine bestimmte religiöse Praxis vorauszusetzen. Die Zeilenführung folgt der rhetorischen Gliederung des Textes.
