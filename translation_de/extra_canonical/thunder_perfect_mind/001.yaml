  - severity: medium
    issue: Die Hauptübersetzung „wurde ... gefunden“ verdeckt die explizite erste Person mit ⲙⲙⲟⲓ.
    rationale: Die vorgelegte Form ist am direktesten als „ich fand mich“ wiederzugeben. Eine passive Deutung kann in der Fußnote als kontextuelle bzw. editionsnahe Alternative stehen, sollte aber die im Text sichtbare Selbstreferenz nicht ersetzen.
