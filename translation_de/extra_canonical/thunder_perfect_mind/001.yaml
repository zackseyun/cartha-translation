  source_fidelity: 'Die Übersetzung folgt bei „ausgesandt“ und „Macht“ der konsultierten Textgestalt sinnvoll. Die beiden folgenden Prädikate glättet sie jedoch gegen den tatsächlich vorgelegten koptischen OCR-Text: ⲛⲧⲁⲓⲥⲱⲧⲙ ist aktiv „ich hörte“, nicht „ich kam“ oder „ich wurde gehört“; ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ lautet am unmittelbarsten „ich fand mich“. Da der Zeuge bzw. die OCR-Lesung ausdrücklich unsicher ist, müssen die verbreiteten abweichenden Editionstexte als Alternativen dokumentiert, aber nicht stillschweigend in den Haupttext eingesetzt werden.'
  naturalness: „Der Donner, der vollkommene Geist“, „ausgesandt“ und „über mich nachsinnen“ sind im bewusst feierlich-paradoxen Register gut verständlich. „Ich hörte die, die über mich nachsinnen“ ist natürliches modernes Deutsch. Das reflexive „ich fand mich“ ist absichtlich ungewöhnlich, aber als wörtlichere Wiedergabe der überlieferten Selbstbezüglichkeit vorzuziehen.
  terminology: „Geist“ kann νοῦς als weiten, philosophisch-geistigen Titelbegriff angemessen wiedergeben, sofern die Fußnote eine Gleichsetzung mit πνεῦμα vermeidet. „Macht“ wahrt den möglichen Titelsinn von δύναμις, ohne ihn dogmatisch zu bestimmen.
