  language: de
  text: '**18.** Doch wenn ihr euch zeigt,[a] werde ich mich vor euch verbergen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr sichtbar werdet“; auch möglich: „wenn ihr euch offenbart“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Aussage bildet die zweite Hälfte eines paradoxen Gegensatzpaares: Wenn die Angesprochenen sich verbergen, wird die Sprecherin sichtbar; wenn sie sich zeigen, verbirgt sie sich.'
