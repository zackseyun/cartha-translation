lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: euch zeigt
  rationale: Die Wendung bezeichnet ein Sichtbar- oder Offenbarwerden. „Euch zeigt“ ist im Deutschen natürlich, bewahrt den reflexiven Bezug und bildet einen klaren Gegensatz zu „euch verbergen“.
- source_word: ϩⲱⲡ
  choice: mich … verbergen
  rationale: Das Verb bedeutet „verbergen, verborgen sein“. Mit der Sprecherin als Subjekt gibt die reflexive Form den Sinn knapp und idiomatisch wieder.
- source_word: ⲇⲉ
  choice: Doch
  rationale: Die Partikel ist hier adversativ beziehungsweise weiterführend. Im Zusammenhang mit der vorausgehenden Umkehrung von Verbergen und Sichtbarwerden bringt „Doch“ den Gegensatz deutlich zum Ausdruck.
theological_decisions:
- issue: Paradoxe Wechselbeziehung zwischen Offenbarwerden und Verbergen
  choice: Der Gegensatz bleibt ohne erklärende Auflösung stehen.
  alternative: Die Aussage als Lehre über eine bestimmte Form göttlicher Offenbarung auszudeuten.
  rationale: Der Text formuliert bewusst eine paradoxe Antithese; eine dogmatische Präzisierung würde mehr festlegen, als die sprachliche Gestalt hergibt.
translation_notes:
  register: Modernes, würdiges Deutsch mit knapper poetischer Satzführung. Die Anrede steht im Plural. Die adversative Verbindung und die Spiegelung von Sichzeigen und Sichverbergen bleiben deutlich erhalten. Der im Datensatz abgedruckte OCR-Ausschnitt scheint nicht zuverlässig mit diesem Segment übereinzustimmen; die Übersetzung folgt der in der Revisionsdokumentation angegebenen koptischen Zeile ⲉⲧⲉⲧⲛϣⲁⲛⲟⲩⲱⲛϩ ⲇⲉ ⲉⲃⲟⲗ ϯⲛⲁϩⲱⲡ ⲉⲣⲱⲧⲛ und dem überlieferten antithetischen Zusammenhang.
