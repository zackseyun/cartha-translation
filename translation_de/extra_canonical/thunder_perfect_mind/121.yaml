base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/121.yaml
  text: 'Because of this[a], do not let me be heard[b];

    and do not let me be known by judgment or by any other power.'
translation:
  language: de
  text: '**5.** Darum überhört mich nicht,

    und verkennt mich nicht an irgendeinem anderen Ort oder zu irgendeiner anderen Zeit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene Text lautet wörtlich „an einem anderen Ort oder zu einer anderen Zeit“. Die OCR-Lesart ⲕⲉⲙⲁ ist als „anderer Ort“ verständlich; ⲕⲉⲟⲩⲟⲉⲓϣ bedeutet „andere Zeit“. Danach beginnt die Aufforderung „verkennt mich nicht“ erneut, bricht im vorliegenden Ausschnitt jedoch ab.
    reason: textual_variant
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲡⲁⲓ
  choice: Darum
  rationale: Die Wendung bezeichnet hier eine Folgerung oder einen Grund. „Darum“ gibt die kausale Verknüpfung knapp und natürlich wieder.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: überhört mich nicht
  rationale: Die negative Aufforderung mit ⲁⲧ- („ohne“) und ⲥⲱⲧⲙ („hören“) bezeichnet ein Sich-taub-Stellen beziehungsweise Nicht-Hören. „Überhört mich nicht“ bewahrt den Hörbezug und klingt im Deutschen natürlich.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: verkennt mich nicht
  rationale: ⲥⲟⲟⲩⲛ bedeutet „kennen, erkennen, wissen“. Mit ⲁⲧ- und der negativen Aufforderung ist gemeint, die Sprecherin nicht unerkannt zu lassen; „verkennt mich nicht“ wahrt den Bezug auf Erkennen, ohne eine passive Konstruktion zu erzwingen.
- source_word: ⲛⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: an irgendeinem anderen Ort oder zu irgendeiner anderen Zeit
  rationale: Die überlieferte Zeichenfolge lässt sich unmittelbar als ⲕⲉ- („anderer“) + ⲙⲁ („Ort“) sowie ⲕⲉ- + ⲟⲩⲟⲉⲓϣ („Zeit“) lesen. Im Geltungsbereich der Verneinung erhält „irgendein“ im Deutschen den Sinn von „nirgendwo/niemals“, ohne die parallele Form des Koptischen aufzugeben.
theological_decisions:
- issue: Reichweite der Aufforderung, die Sprecherin zu erkennen
  choice: Die räumliche und zeitliche Universalität bleibt als „an irgendeinem anderen Ort oder zu irgendeiner anderen Zeit“ erhalten.
  alternative: „durch ein Urteil oder durch irgendeine andere Macht“
  rationale: Die Alternative setzt mehrere unbezeugte OCR-Ausfälle voraus und deutet ⲟⲩⲟⲉⲓϣ gegen seine gewöhnliche Bedeutung „Zeit“. Die sichtbare Lesart ergibt dagegen eine klare Parallelbildung aus „anderer Ort“ und „andere Zeit“ und führt keine zusätzliche Aussage über Gericht oder Mächte ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. „Überhört“ und „verkennt“ geben die beiden negierten Wahrnehmungsverben prägnant wieder. Die Übersetzung folgt der sichtbaren koptischen Lesart und nicht der unsicheren englischen Rekonstruktion als „Urteil“ und „Macht“.
