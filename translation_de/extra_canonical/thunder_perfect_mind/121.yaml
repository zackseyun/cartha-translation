  verdict: revise
  source_fidelity: 'Die vorliegende Übersetzung verfehlt die sichtbare Konstruktion ⲙⲡⲣ ⲣⲁⲧ + Infinitiv: Sie bedeutet hier nicht „überhört/verkennt mich nicht“, sondern negativ-kausativ „lasst nicht zu/sorgt nicht dafür, dass man mich hört bzw. erkennt“. Der OCR-Ausschnitt bietet nach ⲙⲙⲟⲓ die Lesung ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ („an einem anderen Ort oder zu einer anderen Zeit“) und anschließend einen erneuten, abgebrochenen Ansatz von „lasst mich nicht erkennen“. Die englische Audit-Rekonstruktion „durch Urteil ... Macht“ ist wegen der ausdrücklich niedrigen Ausrichtungszuversicht und der hierfür nötigen OCR-Ergänzungen nicht sicher genug, um den sichtbaren Wortlaut zu verdrängen.'
  naturalness: „Lasst nicht zu, dass man mich hört/erkennt“ ist modernes, verständliches Standarddeutsch und bildet die kausative Aussage ohne die im Deutschen missverständliche Formulierung „Lasst mich nicht hören“ ab. Die Auslassungspunkte machen den Textabbruch transparent.
  terminology: Keine besonderen theologischen Fachbegriffe sind im sicher lesbaren Text belegt. „erkennen“ gibt ⲥⲟⲟⲩⲛ sachlich wieder; „hören“ bewahrt den Hörbezug von ⲥⲱⲧⲙ. Die Orts- und Zeitangabe wird nach der sichtbaren OCR-Lesung wiedergegeben und als unsicher markiert.
  issues:
  - severity: high
    issue: Die Verben „überhört mich nicht“ und „verkennt mich nicht“ geben die negative Kausativkonstruktion nicht wieder.
    rationale: ⲙⲡⲣ ⲣⲁⲧ ⲥⲱⲧⲙ/ⲥⲟⲟⲩⲛ fordert dazu auf, das Gehört- bzw. Erkanntwerden der Sprecherin nicht zu veranlassen oder zuzulassen. Die Entwürfe machen daraus Aufforderungen, die Sprecherin selbst nicht zu überhören oder zu verkennen.
  - severity: medium
    issue: Der fortlaufende Textabbruch wird nicht im Übersetzungstext abgebildet.
    rationale: Nach der Orts-/Zeitangabe setzt der erhaltene Ausschnitt erneut mit ⲙⲡⲣ ⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ ein und bricht danach ab. Dies soll im Haupttext durch einen erneuten Satzansatz und Auslassungspunkte sichtbar bleiben.
  - severity: medium
    issue: Die Fußnote stellt die OCR-Lesung als gesicherten erhaltenen Wortlaut dar und verwirft die englische Rekonstruktion zu bestimmt.
    rationale: Die Quellenausrichtung ist ausdrücklich als niedrig sicher bewertet; daher muss die räumlich-zeitliche Lesung als Lesung des OCR-Ausschnitts und nicht als abschließend gesicherter Text bezeichnet werden.
  revised_text: '**5.** Darum lasst nicht zu, dass man mich hört,


    und lasst nicht zu, dass man mich an einem anderen Ort oder zu einer anderen Zeit erkennt.[a]


    Lasst nicht zu, dass man mich erkennt …'
