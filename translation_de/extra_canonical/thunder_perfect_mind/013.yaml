base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/013.yaml
  text: 'I am the midwife and the mother.[1]

    I am the virgin[2] and the woman.[1]

    I am the mother of my father[3][2], and the virgin of my—[3]'
translation:
  language: de
  text: '**8.** Ich bin die Braut und die Mutter.


    Ich bin die Schwester und die Frau.[a]


    Ich bin die Mutter meines Vaters und die Schwester meines …[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann sowohl „Frau“ als auch „Ehefrau“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der vorliegende Textausschnitt bricht nach „meines“ ab; das fehlende Bezugswort wird nicht ergänzt.
    reason: textual_variant
lexical_decisions:
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: die Braut
  rationale: Das koptische Substantiv bezeichnet eine Braut; die Wiedergabe als „Hebamme“ in der englischen Konsultationsschicht wird vom vorliegenden Wortlaut nicht gestützt.
- source_word: ⲧⲙⲁⲁⲩ
  choice: die Mutter
  rationale: Die gewöhnliche und im Kontext klare Bedeutung ist „Mutter“; sie bewahrt die paradoxe Selbstbezeichnung.
- source_word: ⲧⲥⲱⲛⲉ
  choice: die Schwester
  rationale: Das sahidisch-koptische Wort bedeutet „Schwester“, nicht „Jungfrau“. Diese Bedeutung passt auch zur folgenden Verwandtschaftsaussage.
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: die Frau
  rationale: Das Wort kann allgemein „Frau“ und je nach Kontext auch „Ehefrau“ bedeuten. „Frau“ lässt diese Mehrdeutigkeit im Haupttext offen.
- source_word: ⲧⲙⲁⲁⲩ ⲛⲧⲉ ⲡⲁⲉⲓⲱⲧ
  choice: die Mutter meines Vaters
  rationale: Die Genitivverbindung wird direkt wiedergegeben und ihre absichtliche familiäre Paradoxie nicht geglättet.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁ—
  choice: die Schwester meines …
  rationale: ⲙⲡⲁ führt einen Genitiv mit „mein“ ein, doch das Bezugswort ist im vorliegenden Ausschnitt nicht erhalten. Die Auslassung wird sichtbar gemacht, ohne eine Ergänzung zu erfinden.
theological_decisions:
- issue: Paradoxe Verbindung familiärer Rollen
  choice: Die Rollen „Braut“, „Mutter“, „Schwester“ und „Frau“ werden ohne Harmonisierung nebeneinandergestellt.
  alternative: Die Aussagen symbolisch ausdeuten oder durch erklärende Zusätze miteinander versöhnen.
  rationale: Der Ausgangstext gestaltet seine Aussage bewusst als spannungsreiche Folge von Ich-Prädikationen; eine dogmatische Auflösung wäre interpretierend und nicht übersetzend.
translation_notes:
  register: Kurze, rhythmische Ich-Sätze bewahren den feierlichen, paradoxen Charakter. Die Sprache ist modern und würdig; die Genitivform „meines Vaters“ bleibt wegen der engen Verwandtschaftsaussage bewusst knapp. Die Übersetzung folgt hier dem koptischen Wortlaut auch dort, wo die englische Konsultationsschicht abweichende und lexikalisch nicht gestützte Deutungen bietet.
