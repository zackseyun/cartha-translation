base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: de
  text: Und ihr werdet mich in der Größe finden. Doch seht mich nicht, wenn ich unter den Geehrten hervortrete, und sucht mich an den geringsten Orten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der letzte Teil ist im vorliegenden OCR-Auszug beschädigt. Wahrscheinlich liegt hier eine koptische Aufforderung im Sinn von „sucht nach mir“ oder „schaut nach mir“ vor. Ältere Wiedergaben wie „am Ort der Stille“ beruhen auf einer anderen Segmentierung. Traditionelle Übersetzungen geben den Abschnitt teils als „Achtet auf meine Armut und meinen Reichtum“ wieder; der hier zugeordnete koptische Text spricht jedoch von „Größe“, „Geehrten“ und den „geringsten Orten“.
    reason: Textkritische und Zuordnungsunsicherheit
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: ihr werdet mich finden
  rationale: Die Futurform der 2. Person Plural mit ϭⲓⲛⲉ bezeichnet hier am direktesten das Finden oder Entdecken.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: in der Größe
  rationale: Das mit ⲙⲛⲧ- gebildete Abstraktum bezeichnet Größe beziehungsweise einen hohen Rang; „Reichtum“ ist kontextuell möglich, lexikalisch aber weniger unmittelbar.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: Doch seht mich nicht danach an
  rationale: Die prohibitive Konstruktion bedeutet wörtlich „seht mich nicht an“. „Danach“ bindet die folgende Partizipialbestimmung natürlich an die Aufforderung, ohne sie zu einer bloßen Ortsangabe umzudeuten.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: dass ich … hervorgehe
  rationale: Die Verbindung bezeichnet eine Bewegung nach außen; „hervorgehen“ wahrt die im Koptischen nicht völlig festgelegte Perspektive besser als nur „hinausgehen“.
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: unter den Geehrten
  rationale: 'Die Form ist als pluralische Relativbildung mit dem Stativ zu „ehren“ zu verstehen: „diejenigen, die geehrt sind“.'
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: an den geringsten Orten
  rationale: Der griechische Lehnwortausdruck verbindet den Superlativ „geringste“ mit dem Pluralbegriff „Orte“; „gering“ bewahrt zugleich räumliche und soziale Untertöne.
- source_word: ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ
  choice: sucht … nach mir
  rationale: Der OCR-Text ist hier offenbar entstellt. Die plausiblere Rekonstruktion entspricht einer Aufforderung, nach der Sprecherin zu schauen beziehungsweise zu suchen.
theological_decisions:
- issue: Paradoxe Gegenüberstellung von Größe, Geehrten und geringsten Orten
  choice: 'Die Spannung bleibt bestehen: Die Sprecherin wird in der Größe gefunden, soll aber nicht aufgrund ihres Hervorgehens unter den Geehrten beurteilt werden; gesucht werden soll sie an den geringsten Orten.'
  alternative: Die Aussage als einfachen Gegensatz von Reichtum und Armut oder von Großen und Geringen glätten.
  rationale: Der erhaltene koptische Wortlaut nennt ausdrücklich „Größe“, „Geehrte“ und „geringste Orte“. Eine Harmonisierung zu Armut und Reichtum würde eine traditionelle Lesart in diesen Abschnitt eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt im Plural. Der Satzbau wurde leicht gegliedert, damit die paradoxe Aussage verständlich bleibt, ohne ihre Mehrdeutigkeit aufzulösen.
