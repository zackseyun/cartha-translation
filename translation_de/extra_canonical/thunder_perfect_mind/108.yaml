translation:
  language: de
  text: '**6.** der Name der Stimme und die Stimme des Namens. Ich bin das Zeichen dafür und das Offenbarwerden der Spaltung.[a] Und ich …[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Spaltung“ wiedergegebene griechische Lehnwort kann auch „Wahl“, „Partei“, „Sekte“ oder „Häresie“ bedeuten.
    reason: lexical_ambiguity
  - marker: b
    text: Der Text ist hier unsicher beziehungsweise bricht in diesem Ausschnitt ab. Im OCR-Rest steht möglicherweise die Aufforderung „Hört (mir) zu!“, doch ihre Zugehörigkeit zu diesem Abschnitt ist wegen der Seitenrand- und Segmentzuordnung ungewiss.
    reason: textual_alignment
lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: der Name
  rationale: Das sahidisch-koptische Wort bedeutet eindeutig „Name“ und steht in einer spiegelbildlichen Wendung mit „Stimme“.
- source_word: ⲧⲥⲙⲏ / ⲥⲙⲏ
  choice: die Stimme
  rationale: In diesem syntaktischen Zusammenhang bezeichnet ⲥⲙⲏ die „Stimme“; so bleibt der Parallelismus „Name der Stimme / Stimme des Namens“ erhalten.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: das Zeichen
  rationale: Das griechische Lehnwort σημεῖον bedeutet „Zeichen“. Die OCR trennt das Wort über zwei Zeilen, doch die Lesung ist gut erkennbar.
- source_word: ⲙⲡⲁⲓ
  choice: dafür
  rationale: Wörtlich etwa „dieses/davon“. „Dafür“ gibt den rückverweisenden Ausdruck in natürlichem Deutsch wieder, ohne ein ungenanntes Bezugswort zu ergänzen.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: das Offenbarwerden
  rationale: Die Verbindung bezeichnet ein Sichtbar- oder Offenbarwerden. Die substantivische Wiedergabe entspricht der parallelen Nominalkonstruktion.
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: der Spaltung
  rationale: Das griechische Lehnwort αἵρεσις kann Wahl, Partei, Sekte oder Spaltung bezeichnen. „Spaltung“ bewahrt hier die negative beziehungsweise trennende Bedeutung, ohne die spätere dogmatische Bedeutung „Häresie“ festzuschreiben.
- source_word: ⲁⲕⲣⲟⲁⲧ
  choice: nicht in den Haupttext aufgenommen
  rationale: Die OCR-Schlusszeile könnte ein griechisches Lehnwort mit der Bedeutung „Hört!“ oder „Hört zu!“ enthalten; wegen der unsicheren Seiten- und Segmentzuordnung wird es nur in der Fußnote erwähnt.
theological_decisions:
- issue: Bedeutung von ⲁϩⲉⲣⲉⲥⲓⲥ
  choice: Spaltung
  alternative: Häresie; Sekte; Wahl
  rationale: „Häresie“ würde eine spätere kirchlich-dogmatische Wertung nahelegen. „Spaltung“ wahrt die semantische Spannung des griechischen Lehnworts und passt zur abstrakten Parallelkonstruktion.
- issue: Unvollständiger Satz nach „Und ich“
  choice: Abbruch durch Auslassungspunkte sichtbar machen
  alternative: den unsicheren OCR-Rest als vollständigen Satz rekonstruieren
  rationale: Der überlieferte OCR-Ausschnitt ist am Seitenrand beziehungsweise an der Segmentgrenze unsicher. Eine Ergänzung würde eine nicht hinreichend belegte Aussage in den Text eintragen.
translation_notes:
  register: Poetisch-feierlicher, aber gegenwärtiger Standardwortschatz. Der chiastische Klang von „Name der Stimme / Stimme des Namens“ wird formal bewahrt. Unsichere und beschädigte Stellen werden nicht stillschweigend ergänzt.
