  terminology: „Erkenntnis“ gibt das hier zugrunde gelegte „knowledge“ präzise wieder, ohne es dogmatisch zu spezifizieren. „Name“ bleibt die schlichte und traditionsnahe Wiedergabe. Die Fußnote unterscheidet klar zwischen dem OCR-Befund und der nur zugeordneten Lesung.
  issues:
  - severity: high
    issue: Der Haupttext kombiniert „Ruf“ aus dem OCR-Ausschnitt mit „meines Namens“ und „Ich bin“, die im vorgelegten Ausschnitt nicht sicher belegt sind.
