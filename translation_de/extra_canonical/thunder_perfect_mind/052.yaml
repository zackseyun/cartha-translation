base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: de
  text: 'Ich bin der, an den ihr gedacht habt[a],

    und ihr habt mich verspottet.


    Ich bin ungelehrt,

    und sie lernen von mir.


    Ich bin die, die ihr verachtet habt[b],

    und ihr denkt an mich.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der koptische Ausdruck ist hier grammatisch maskulin markiert; später bezeichnet sich die Sprecherin ausdrücklich mit einer femininen Form.
    reason: grammatical_gender
  - marker: b
    text: 'Oder: »die ihr geringgeschätzt habt«; das Verb kann sowohl Verachtung als auch Geringschätzung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Der überlieferte Ausschnitt bricht danach mit dem unvollständigen Beginn einer weiteren Aussage ab: »Ich bin der …«. Die konsultierte Zeile »Gesetz / gesetzlos« gehört nicht zu diesem koptischen Abschnitt.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉⲛⲧⲁⲧⲉⲧⲛⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: Ich bin der, an den ihr gedacht habt
  rationale: Die Wendung gibt die Kopula und den maskulin markierten Relativausdruck ⲡⲉⲛⲧ- wieder; »an jemanden denken« ist die natürliche deutsche Entsprechung zu ⲙⲉⲉⲩⲉ ⲉⲣⲟ-.
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: ihr habt mich verspottet
  rationale: Die Form ist ein Perfekt mit Subjekt der 2. Person Plural und Objekt der 1. Person Singular; ϣⲱⲥ bezeichnet Verspotten beziehungsweise verächtliche Behandlung, nicht Verbergen.
- source_word: ⲁⲧⲥⲃⲱ
  choice: ungelehrt
  rationale: Das mit ⲁⲧ- verneinte ⲥⲃⲱ bezeichnet fehlende Bildung oder Unterweisung. »Ungelehrt« bewahrt das Paradox zur folgenden Aussage, ohne die stärkere Abwertung von »unwissend« oder »dumm« einzutragen.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: sie lernen von mir
  rationale: Die idiomatische Verbindung bedeutet, Unterweisung von jemandem zu empfangen; die aktive deutsche Form ist klar und bewahrt die Wiederholung von »lernen/gelehrt«.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: verachtet
  rationale: Das griechische Lehnverb καταφρονεῖν trägt den Sinn »verachten, geringschätzen«; »verachtet« ist im Deutschen direkt und gewichtig.
- source_word: ⲧⲉⲧⲛ̄ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: ihr denkt an mich
  rationale: Die Form ist ein selbstständiger Präsenssatz und kein weiterer Relativsatz. Dieselbe deutsche Wendung wie am Anfang erhält die beabsichtigte lexikalische Wiederaufnahme.
theological_decisions:
- issue: Wechsel der grammatischen Geschlechtsmarkierung
  choice: Zuerst »der«, später ausdrücklich »die«
  alternative: Beide Aussagen geschlechtsneutral oder durchgehend feminin formulieren
  rationale: Der koptische Text bietet zuerst den maskulin markierten Ausdruck ⲡⲉⲛⲧ- und später die feminine Konstruktion ⲧⲉ ⲧⲉⲛⲧ-. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt ihn zugunsten einer einheitlichen Deutung einzuebnen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst kurzen, rhythmischen Zeilen. Das wiederholte »Ich bin« und die Anrede im Plural (»ihr«) bleiben erhalten. Der Wechsel von Perfekt zu Präsens sowie der Bruch zwischen Relativsatz und selbstständigem Hauptsatz werden nicht geglättet.
