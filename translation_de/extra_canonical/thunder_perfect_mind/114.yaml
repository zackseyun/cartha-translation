translation:
  language: de
  text: '**5.** … mit denen, die gesandt wurden[a];


    ich bin die Ausgestoßene[b];


    unter den Toten[c] — denn ich bin die, die allein existiert[d], und die Ewige[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die koptische Form kann auch aktiv verstanden werden: „mit denen, die sie sandten“. Der Anfang des Satzes fehlt im vorliegenden Ausschnitt.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlich auch: „hinausgetrieben“ oder „vertrieben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das koptische Wort bezeichnet Menschen im Zustand des Totseins: „unter den Toten“, nicht „unter denen, die sterben“.'
    reason: grammar_note
  - marker: d
    text: „Allein“ kann hier auch den Sinn „als Einzige“ oder „einzigartig“ tragen. Die Spannung zu „unter den Toten“ ist im Text selbst angelegt.
    reason: semantic_and_parallelism_note
  - marker: e
    text: 'Das letzte Wort ist im Ausschnitt abgebrochen: ⲙⲛⲧⲁⲓ… Wahrscheinlich setzt es sich zu einer Bildung mit der Bedeutung „Ewigkeit/ewig“ fort. Möglich wäre daher auch: „und die Ewigkeit“.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲙⲛ̄
  choice: mit
  rationale: Die Präposition ist hier komitativ und verbindet das abgebrochene Vorhergehende mit der genannten Gruppe.
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: denen, die gesandt wurden
  rationale: ⲧⲛ̄ⲛⲟⲟⲩ bedeutet „senden“. Die passive Wiedergabe passt zum überlieferten Zusammenhang, obwohl die Form auch aktiv als „die sie sandten“ verstanden werden kann.
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: ausgestoßen worden
  rationale: Die Wendung bezeichnet das Hinaustreiben oder Ausstoßen. Die verbale Form vermeidet im Deutschen eine unnötige Festlegung auf ein grammatisches Geschlecht.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: unter den Toten
  rationale: ⲙⲟⲟⲩⲧ ist stativ und bezeichnet Totsein, nicht den Vorgang des Sterbens; bei einer Personengruppe gibt ϩⲛ das Sichbefinden „unter“ ihnen wieder.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: die … existiert
  rationale: ϣⲟⲟⲡ bedeutet „sein, vorhanden sein, existieren“. „Existiert“ bewahrt hier den betonten Aussagegehalt.
- source_word: ⲟⲩⲁⲁⲧ
  choice: allein
  rationale: Das Wort bezeichnet Alleinsein oder Einzigkeit; „allein“ erhält die knappe paradoxe Aussage.
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: die Ewige
  rationale: Die sichtbare Form ist am Ausschnittsende abgebrochen und wird wahrscheinlich zu einer Bildung mit ⲁⲓⲱⲛ fortgesetzt. „Die Ewige“ wahrt die personale Stimme und den überlieferten Satzrhythmus.
theological_decisions:
- issue: Paradox von Anwesenheit unter den Toten und alleinigem, ewigem Existieren
  choice: Die Spannung bleibt unvermittelt stehen.
  alternative: Die Aussagen erklärend auf verschiedene Ebenen oder Personengruppen beziehen.
  rationale: Der Text stellt gegensätzliche Selbstprädikationen bewusst nebeneinander; eine Harmonisierung wäre interpretativ und im Wortlaut nicht begründet.
- issue: Geschlecht der sprechenden Stimme
  choice: Wo möglich geschlechtsneutral formulieren; im letzten Relativsatz und bei „die Ewige“ der weiblichen Sprecherstimme folgen.
  alternative: Durchgehend maskulin „derjenige/der Ewige“ oder abstrakt „das Ewige“ übersetzen.
  rationale: Der koptische Ausschnitt verwendet Formen, die im Deutschen nicht durchgehend geschlechtsneutral nachgebildet werden können. Die weibliche Form entspricht der literarischen Sprecherstimme, ohne die grammatische Gestalt des Koptischen als eigenständige Lehraussage auszudeuten.
translation_notes:
  register: Knappe, feierlich-orakelhafte Gegenwartssprache. Die Zeilenstruktur und die paradoxen Selbstbezeichnungen bleiben erhalten. Der abgebrochene Anfang wird durch Auslassungspunkte sichtbar gemacht; unsichere Stellen werden nicht stillschweigend harmonisiert.
