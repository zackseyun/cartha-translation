base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: de
  text: '**14.** Ich bin die Stimme, deren Klang vielfältig ist,[a] und das Wort, dessen Erscheinung vielfältig ist.[b] Ich bin die Äußerung meines Namens. Warum liebt ihr mich, obwohl ihr mich hasst, und hasst die, die mich lieben?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vielfältig“ kann hier auch „mannigfaltig“, „reich“ oder „vielgestaltig“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht das griechische Lehnwort „Logos“, das hier mit „Wort“ wiedergegeben ist; „Logos“ oder „Rede“ sind je nach Zusammenhang ebenfalls möglich. „Erscheinung“ kann ebenso „Gestalt“ oder „Aussehen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Warum liebt ihr, die ihr mich hasst, mich und hasst die, die mich lieben?“ Die Formulierung hält die paradoxe Verbindung von Liebe und Hass fest.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: die Stimme
  rationale: ⲥⲙⲏ bezeichnet hier die Stimme; der bestimmte Artikel und die Relativkonstruktion werden im Deutschen natürlich wiedergegeben.
- source_word: ⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: deren Klang vielfältig ist
  rationale: Die Wendung beschreibt einen reichen, vielfachen oder vielgestaltigen Klang. „Vielfältig“ bewahrt die Offenheit, ohne eine konkrete Zahl oder Lautstärke einzutragen.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: der Logos
  rationale: Das griechische Lehnwort wird beibehalten, um sein sprachliches und philosophisches Bedeutungsfeld nicht vorschnell auf „Wort“ einzuengen.
- source_word: ⲉⲓⲛⲉ
  choice: Erscheinung
  rationale: Das Wort bezeichnet Gestalt, Aussehen oder Erscheinung; „Erscheinung“ passt zur abstrakten, paradoxen Rede und lässt die genaue Nuance offen.
- source_word: ⲡϣⲁϫⲉ
  choice: die Äußerung
  rationale: „Äußerung“ unterscheidet ⲡϣⲁϫⲉ vom unmittelbar vorausgehenden ⲗⲟⲅⲟⲥ und bewahrt den Gedanken des ausgesprochenen Namens.
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Warum
  rationale: Die feste interrogative Wendung leitet hier eine rhetorische Frage ein.
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: hassen / lieben
  rationale: Die direkten Gegenbegriffe erhalten die scharfe paradoxe Antithese des Textes.
theological_decisions:
- issue: Wiedergabe von ⲡⲗⲟⲅⲟⲥ
  choice: Logos
  alternative: Wort
  rationale: „Logos“ wahrt die mögliche philosophische und theologische Resonanz, ohne den Ausdruck mit einer bestimmten Lehrdeutung gleichzusetzen.
- issue: Beziehung zwischen Hass und Liebe in der rhetorischen Frage
  choice: „obwohl ihr mich hasst“
  alternative: „ihr, die ihr mich hasst“
  rationale: Die konzessive Fassung bildet das Paradox in natürlichem Deutsch ab. Sie erklärt den Widerspruch nicht auf, sondern lässt Hass und Liebe derselben angesprochenen Gruppe nebeneinanderstehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst knapper, rhythmischer Parallelführung. Das wiederholte „Ich bin“ und die schroffe Liebe-Hass-Antithese bleiben erhalten. Ein offenbar fehlerhaft erfasster Rest der vorausgehenden Zeile am Anfang des OCR-Ausschnitts wurde nicht als Bestandteil dieses Abschnitts übersetzt.
