translation:
  language: de
  text: '**11.** Ich bin die, die kein Fest[a] feiert,

    und ich bin die, deren Feste zahlreich sind.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Fest« kann auch mit »Festmahl« oder »Feier« wiedergegeben werden; vermutlich liegt ein griechisches Lehnwort zugrunde.
    reason: lexical_alternative
  - marker: b
    text: 'Wegen der unsicheren Lesung von ⲕⲁϩ ist auch möglich: »deren Feste überreich sind« oder »deren Feste sehr zahlreich sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧ(ⲉⲟⲣⲧⲏ)
  choice: die kein Fest feiert
  rationale: Die privative Bildung ⲙⲛⲧⲁⲧ- in Verbindung mit dem wohl vorauszusetzenden griechischen Lehnwort für »Fest« bezeichnet das Nichtbegehen eines Festes. Die verbale deutsche Wendung ist natürlich und bewahrt den konkreten kultischen Sinn.
- source_word: ϩⲛ ⲟⲩ ⲕⲁϩ
  choice: deren Feste zahlreich sind
  rationale: Die vorläufig als Mengen- oder Fülleangabe verstandene Wendung bildet den paradoxen Gegensatz zum ersten Halbvers. »Zahlreich« bewahrt diesen Gegensatz, ohne zwischen bloßer Anzahl und Überfluss stärker zu entscheiden, als es die unsichere Lesung erlaubt.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die einfache nebenordnende Konjunktion verbindet die beiden gegensätzlichen Selbstaussagen.
- source_word: 'relative construction: ⲡⲁⲓ …'
  choice: Ich bin die, die … / Ich bin die, deren …
  rationale: Die feminine Stimme und die wiederholte Ich-bin-Formel bleiben erhalten; die angepassten Relativkonstruktionen ergeben im Deutschen einen natürlichen Parallelismus.
theological_decisions:
- issue: Paradoxe Verbindung von Festlosigkeit und vielen Festen
  choice: Der Gegensatz bleibt unaufgelöst stehen.
  alternative: Die beiden Aussagen harmonisierend auf verschiedene Arten oder Zeiten von Festen beziehen.
  rationale: Der Text erläutert den Widerspruch nicht. Eine theologische oder kultische Harmonisierung würde eine Deutung in die Übersetzung eintragen, die der überlieferte Wortlaut nicht ausdrücklich vorgibt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feminine Selbstaussage und der antithetische Parallelismus werden deutlich bewahrt; die unsichere Mengenangabe wird knapp im Fußnotenapparat offengelegt.
