base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: de
  text: 'So nehmt mich aus Scham in Schamlosigkeit bei euch auf;


    und weist aus Schamlosigkeit und Scham meine Glieder unter euch zurecht[a];


    und wendet euch nach innen zu euch selbst[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Glieder“ kann Körperteile, aber auch Angehörige oder Teile eines Ganzen bezeichnen. Der koptische Text legt die Beziehung nicht näher fest.
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlich ist die Schlusswendung etwa: „und nähert euch nach innen euch selbst“. Die ungewöhnliche reflexive Formulierung ist auch im koptischen Text schwer aufzulösen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ϣⲓⲡⲉ
  choice: Scham
  rationale: Das Substantiv bezeichnet hier Scham; die Wiederholung bildet mit dem privativ gebildeten Gegenbegriff einen bewussten Gegensatz.
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: Schamlosigkeit
  rationale: Die privative Bildung bedeutet wörtlich den Zustand des Ohne-Scham-Seins. „Schamlosigkeit“ bewahrt den paradoxen Gegensatz zu „Scham“, ohne ihn wertend aufzulösen.
- source_word: ϣⲟⲡⲧ
  choice: nehmt mich … bei euch auf
  rationale: 'Die Form wird als Imperativ von ϣⲱⲡ mit Objektsuffix der ersten Person Singular verstanden: „Nehmt mich auf“. Die Verbindung mit ⲉⲣⲱⲧⲛ wird im Deutschen idiomatisch durch „bei euch“ wiedergegeben.'
- source_word: ϫⲡⲓⲟ
  choice: weist … zurecht
  rationale: Der Imperativ fordert zum Tadeln, Rügen oder Zurechtweisen auf. „Zurechtweisen“ ist verständlich und wahrt die direkte Aufforderung.
- source_word: ⲛⲁⲙⲉⲗⲟⲥ
  choice: meine Glieder
  rationale: Das griechische Lehnwort μέλος bezeichnet ein Glied beziehungsweise einen Körperteil; die Mehrdeutigkeit gegenüber Angehörigen oder Teilen eines Ganzen bleibt im deutschen „Glieder“ erhalten.
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ- … ϩⲟⲩⲛ
  choice: wendet euch nach innen … zu
  rationale: Die idiomatische Wendung bezeichnet ein Sich-Nähern oder Herantreten; ϩⲟⲩⲛ fügt die Richtung nach innen hinzu. Die reflexive Zielangabe wird bewusst beibehalten.
theological_decisions:
- issue: Paradoxer Zusammenhang von Scham und Schamlosigkeit
  choice: Beide Begriffe werden unverändert gegeneinandergestellt.
  alternative: Den Gegensatz als Ehre und Verachtung deuten.
  rationale: Der vorliegende koptische Wortlaut bietet ausdrücklich ϣⲓⲡⲉ und die privative Bildung ⲙⲛⲧⲁⲧϣⲓⲡⲉ. Eine Umdeutung in Ehre und Verachtung würde die Spannung des Textes vorschnell erklären.
- issue: Reflexive Schlussaufforderung
  choice: „wendet euch nach innen euch selbst zu“
  alternative: „nähert euch einander“ oder „prüft euch selbst“
  rationale: Die ungewöhnliche Selbstbezüglichkeit und die Innenrichtung werden bewahrt; eine gemeinschaftliche oder introspektiv-prüfende Deutung ist im Wortlaut nicht eindeutig festgelegt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit imperativischem Rhythmus. Die wiederholten Gegensatzpaare und die ungewöhnliche reflexive Schlusswendung bleiben erhalten; das Deutsche wird nur so weit geglättet, dass der Text verständlich bleibt.
