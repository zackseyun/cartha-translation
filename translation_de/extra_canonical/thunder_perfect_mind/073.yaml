base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: de
  text: Und im Geist jedes Menschen, der mit mir ist, und in den Frauen, die in mir sind, bin ich die Geehrte und die Gepriesene.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ ⲛⲓⲙ
  choice: im Geist jedes Menschen
  rationale: ⲡⲛⲁ bezeichnet hier am ehesten den Geist als innere oder belebende Wirklichkeit; ⲣⲱⲙⲉ ⲛⲓⲙ ist distributiv als „jeder Mensch“ zu verstehen. Das geschlechtsübergreifende deutsche „Mensch“ bleibt möglich, obwohl anschließend ausdrücklich Frauen genannt werden.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: der bei mir ist
  rationale: Die Relativform von ϣⲟⲟⲡ mit ⲛ̄ⲙⲙⲁⲉⲓ bedeutet natürlich „der bei mir ist“; „existiert“ wäre formaler, im Deutschen aber schwerfälliger.
- source_word: ⲛⲓϩⲓⲟⲙⲉ ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: die Frauen, die in mir sind
  rationale: ⲛ̄ϩⲏⲧ ist hier die Präposition „in“ mit Suffix der ersten Person Singular, also „in mir“, nicht „im Herzen“.
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: die Geehrte
  rationale: 'Die Form ist als substantivierte feminine Relativkonstruktion zum Verb „ehren“ zu lesen: „diejenige, die geehrt ist/wird“. „Die Geehrte“ wahrt die feminine Stimme und den feierlichen Parallelismus.'
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: die, die gepriesen wird
  rationale: 'ⲥⲙⲟⲩ ist verbal als „preisen/segnen“ zu verstehen; mit dem unbestimmten pluralischen Subjekt ergibt sich idiomatisch ein Passiv: „die gepriesen wird“.'
theological_decisions:
- issue: Reichweite von ⲣⲱⲙⲉ gegenüber der anschließenden Nennung der Frauen
  choice: „jedes Menschen“
  alternative: „jedes Mannes“
  rationale: ⲣⲱⲙⲉ kann sowohl „Mensch“ als auch „Mann“ bezeichnen. Der unmittelbare Kontrast mit „Frauen“ begünstigt „Mann“, zwingt ihn jedoch nicht; „Mensch“ bewahrt die lexikalische Weite und die auffällige Spannung des Satzes.
- issue: Verhältnis von „geehrt“ und „gepriesen“
  choice: zwei parallele positive Prädikate ohne zusätzliche Deutung
  alternative: eine paradoxe oder kultische Zuspitzung
  rationale: Der vorliegende Wortlaut nennt Ehrung und Preis; eine weitergehende theologische Bestimmung wäre vom Segment allein nicht gedeckt.
translation_notes:
  register: Moderne, würdevolle Prosa mit bewahrter Ich-Stimme und femininem Selbstbezug. Der Satzbau folgt dem koptischen Parallelismus, wird jedoch durch einen Doppelpunkt lesbar gegliedert. Die OCR-nahe Folge bei „jedes Menschen, der …“ wird gemäß der jüngsten sprachlichen Prüfung als ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ verstanden.
