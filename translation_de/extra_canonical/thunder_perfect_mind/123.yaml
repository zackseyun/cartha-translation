- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: die Vergebung
  rationale: Das griechische Lehnwort συγγνώμη kann Vergebung, Begnadigung, Nachsicht oder Entgegenkommen bezeichnen. „Vergebung“ ist im religiösen Kontext die naheliegendste klare Wiedergabe.
- source_word: ⲁⲩⲱ
