lexical_decisions:
- source_word: ⲧⲛ̄ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: Ihr verflucht meinen Ruhm
  rationale: ⲧⲛ̄- bezeichnet hier die zweite Person Plural, ⲥⲁϩⲟⲩ „verfluchen“, und ϣⲟⲩϣⲟⲩ kann Ruhm, Prahlen oder Sich-Rühmen bezeichnen. „Ruhm“ bewahrt die Mehrdeutigkeit zwischen Ansehen und Selbstrühmung besser als „Schwäche“. Im erhaltenen Ausschnitt steht keine sichtbare Verneinung; deshalb wird nicht „Verflucht nicht“ übersetzt.
- source_word: ⲁⲛⲟⲕ ⲇⲉ ⲧⲉⲧϣⲟⲟⲡ
  choice: Ich aber bin die, die … gegenwärtig ist
  rationale: Die feminine Identitätsformel kennzeichnet die Sprecherin. ϣⲟⲟⲡ bezeichnet Sein beziehungsweise Gegenwärtigsein; „gegenwärtig ist“ gibt die konkrete Nuance wieder und bleibt im Deutschen natürlich.
- source_word: ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: in jeder Furcht
  rationale: Das griechische Lehnwort ⲫⲟⲃⲟⲥ bedeutet „Furcht“; ⲧⲏⲣⲟⲩ drückt Gesamtheit aus. „In jeder Furcht“ erhält den distributiven Sinn.
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: die Kraft im Zittern
  rationale: ⲥⲧⲱⲧ bedeutet „Zittern“. Die überlieferte beziehungsweise per OCR erfasste Form ⲡⲛⲏϣⲁⲧ wird kontextuell als Form von „Kraft/Stärke“ verstanden. Die knappe paradoxe Verbindung wird nicht erklärend geglättet.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ
  choice: Ich bin die, die …
  rationale: ⲁⲛⲟⲕ ⲧⲉ setzt die feminine „Ich bin“-Formel fort; das folgende feminine Relativglied ist am Segmentende abgebrochen.
theological_decisions:
- issue: Paradoxe Verbindung von Furcht, Kraft und Zittern
  choice: Die Spannung bleibt als „in jeder Furcht … die Kraft im Zittern“ stehen.
  alternative: Die Sprecherin als Überwinderin der Furcht oder als Kraft gegen das Zittern erklären.
  rationale: Der koptische Wortlaut verbindet die Sprecherin unmittelbar mit Furcht und Zittern. Eine harmonisierende Deutung würde die für das Werk charakteristische theologische und poetische Spannung beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, rhythmischen Zeilen. Die feminine Selbstbezeichnung der Sprecherin und die formelhafte Wiederholung von „Ich bin die, die …“ bleiben ausdrücklich erhalten. Wegen der nur mittleren Segmentausrichtung werden Ergänzungen aus einem vermuteten weiteren Kontext vermieden.
