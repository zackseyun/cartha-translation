lexical_decisions:
- source_word: ⲙⲡⲣⲙⲉⲗⲉⲧⲁ
  choice: Kümmert euch nicht um
  rationale: ⲙⲡⲣ- ist der negative Imperativ; ⲙⲉⲗⲉⲧⲁ wird hier am ehesten als griechisches Lehnverb μελετᾶν im Sinn von „sich kümmern/besorgt sein“ verstanden. Das fragmentarische Objekt folgt offenbar danach.
- source_word: ⲧⲉⲧⲉⲗⲁⲁⲧⲉ ⲉⲃⲟⲗ
  choice: eure Teile, die hinausgeworfen sind
  rationale: Die beschädigte Wortfolge weist eher auf Teile beziehungsweise Anteile und ein Hinauswerfen als auf eine Aufforderung zum Näherkommen. Wegen der Textlücken bleibt die syntaktische Verbindung unsicher.
- source_word: ⲧⲉⲧⲱⲃ︤ⲡ︥
  choice: richtet … auf
  rationale: 'Die OCR-Form dürfte zu ⲧⲟⲃⲥ/ⲧⲱⲃⲥ gehören: „aufrichten, fest hinstellen“. Die deutsche Wiedergabe lässt wegen der Lücke Subjekt und Objekt offen.'
- source_word: ⲛⲛⲉⲧ ⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  choice: unter denen, die klein sind
  rationale: Die Formulierung bewahrt die Selbstverortung der Sprecherin unter den Kleinen, ohne den beschädigten Schluss spekulativ zu ergänzen.
theological_decisions:
- issue: Beziehung der Sprecherin zu den Kleinen
  choice: „denn ich bin unter denen, die klein sind“
  alternative: „denn ich bin unter denen, die unter den Kleinen sind“
  rationale: Die einfachere Fassung gibt den erkennbaren Sinn wieder, ohne aus der unsicheren OCR eine zusätzliche verschachtelte Gruppe oder eine Rangordnung abzuleiten.
- issue: Mögliche Erhöhung oder Vorrangstellung am Schluss
  choice: Der Schluss bleibt als Lücke stehen.
  alternative: „und sie werden erhöht werden“ oder „sie sind die Ersten“
  rationale: Das erhaltene ⲥⲉⲥⲱ ist zu unsicher, um eine theologisch gewichtige Aussage über Erhöhung, Rettung oder Vorrang in den Haupttext aufzunehmen.
translation_notes:
  register: Fragmentarischer, würdevoller deutscher Text. Erhaltene Wörter werden möglichst direkt wiedergegeben; eckige Auslassungszeichen markieren tatsächliche Textverluste beziehungsweise nicht sicher lesbare Stellen. Die ältere, auf dem fehlzugeordneten Konsultationstext beruhende Fassung („Kommt zu mir … meine Glieder …“) wird nicht übernommen.
