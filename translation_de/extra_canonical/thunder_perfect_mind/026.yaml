translation:
  language: de
  text: 'Ihr, die ihr mich kennt[a], kennt mich nicht;


    und die mich nicht gekannt haben, mögen mich kennenlernen[b],


    denn ich bin Erkenntnis und Nichtwissen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Verb kann sowohl „kennen“ als auch „wissen“ bezeichnen. Die Wiederholung von „kennen“ erhält die paradoxe Gegenüberstellung der beiden Aufforderungen.
    reason: lexical_alternative
  - marker: b
    text: Die vorgelegten OCR-Zeilen enthalten offenbar Text aus einem benachbarten Abschnitt, darunter eine Aussage über eine Stimme, die über die Erde ausgeht. Wegen der unsicheren Zuordnung folgt die Übersetzung hier der üblichen Stellung der Strophe über Kennen und Nichtwissen in Der Donner.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (Verb)
  choice: kennen / erkennen
  rationale: Das koptische Grundverb bezeichnet kognitives Kennen oder Wissen. Im ersten Glied bewahrt „kennen“ die direkte Beziehung zu „mich“; im zweiten gibt „erkennen“ den natürlichen deutschen Imperativsinn wieder, ohne einen anderen Quellbegriff vorauszusetzen.
- source_word: ⲁⲅⲛⲟⲉⲓ (Verb; griechisches Lehnwort ἀγνοεῖν)
  choice: nicht kennen
  rationale: Die wörtlich mögliche Wiedergabe „in Unkenntnis sein“ wäre im Deutschen als Aufforderung schwerfällig. „Sollt mich nicht kennen“ erhält den scharfen, beabsichtigten Widerspruch zur vorausgehenden Aussage.
- source_word: ⲅⲛⲱⲥⲓⲥ (Substantiv; griechisches Lehnwort γνῶσις)
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist die geläufige und würdige Wiedergabe von γνῶσις und bewahrt die begriffliche Aussage der Ich-Rede.
- source_word: ⲁⲅⲛⲱⲥⲓⲁ (Substantiv; griechisches Lehnwort)
  choice: Nichtwissen
  rationale: „Nichtwissen“ wahrt die unmittelbare Antithese zu „Erkenntnis“, ohne die stärker abwertende Nebenbedeutung von „Unwissenheit“ zwingend einzutragen.
theological_decisions:
- issue: Paradoxe Identifikation der Sprecherin mit Erkenntnis und Nichtwissen
  choice: Der Gegensatz bleibt unaufgelöst stehen.
  alternative: Den Satz als Gegensatz zwischen menschlicher Unwissenheit und göttlicher Erkenntnis erklärend ausdeuten.
  rationale: Der Quelltext formuliert eine bewusste paradoxe Selbstaussage; eine harmonisierende Erklärung würde eine theologische Deutung in die Übersetzung eintragen.
