  text: '**13.** Hört mich in Sanftmut an,[a] und lernt von mir in Härte.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier vorausgesetzte Verb „hören/anhören“ ist im vorliegenden OCR-Ausschnitt nicht erhalten, wird aber durch die überlieferte parallele Satzform nahegelegt. Die im Ausschnitt sichtbaren Wörter für „richten“, „Richter“ und „Kraft/Gewalt“ gehören wahrscheinlich zu benachbarten Zeilen und sind hier nicht übersetzt.
    reason: alignment_note
  - marker: b
    text: Das koptische Wort kann auch „Rauheit“ oder „Strenge“ bedeuten. „Härte“ bewahrt den scharfen Gegensatz zu „Sanftmut“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲭⲣⲟⲉⲓ
  choice: Sanftmut
  rationale: Das Wort bezeichnet Sanftheit oder Milde. „Sanftmut“ ist im Deutschen verständlich und bewahrt den pointierten Gegensatz zur Härte.
- source_word: ⲕⲁⲁⲥ
  choice: lernt
  rationale: Das Verb kann „lernen“ oder „gelehrt werden“ bedeuten. Im parallelen Aufforderungssatz ist die aktive Wiedergabe „lernt“ natürlich, ohne die mögliche Vorstellung des Belehrtwerdens auszuschließen.
- source_word: ⲧⲉⲣⲟⲟⲩ
  choice: Härte
  rationale: Mögliche Bedeutungen sind Härte, Rauheit und Strenge. „Härte“ bildet im modernen Deutschen den klarsten Gegensatz zu „Sanftmut“.
- source_word: ⲉⲣⲟⲓ
  choice: von mir
  rationale: In Verbindung mit „lernen“ gibt die Präposition mit pronominalem Suffix die Beziehung idiomatisch als „von mir“ wieder.
- source_word: ⲥⲱⲧⲙ (erschlossen)
  choice: Hört … an
  rationale: Das im OCR-Ausschnitt nicht sichtbare Hörverb wird aus der überlieferten Satzstruktur erschlossen. „Hört mich … an“ gibt den imperativischen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Paradoxer Gegensatz zwischen Sanftmut und Härte
  choice: Der Gegensatz bleibt unvermittelt stehen.
  alternative: Die Härte als Zucht, Prüfung oder Strenge deutend erläutern.
  rationale: Der Text stellt beide Erfahrungsweisen spannungsvoll nebeneinander. Eine nähere theologische Deutung wäre im Ausgangstext nicht ausdrücklich begründet.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen Imperative und der knappe, paradoxe Gegensatz des Spruchs bleiben erhalten; die unsichere Rekonstruktion wird in der Fußnote offengelegt.
