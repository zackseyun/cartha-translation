translation:
  language: de
  text: 'das Finden derer, die mich suchen,


    und die Weisung derer, die mich bitten,


    und die Stimme der Stimmen des Ortes der Vergöttlichung der Engel,


    die sie ehrten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲅⲓⲛⲉ
  choice: das Finden
  rationale: Das koptische Verbalnomen bezeichnet das Finden bzw. Auffinden. Die substantivische Form bewahrt die parallele Reihung des Ausgangstextes.
- source_word: ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: derer, die mich suchen
  rationale: ϣⲓⲛⲉ ⲛⲥⲱ= bedeutet in dieser Konstruktion „jemandem nachgehen/suchen“; eine Bedeutung wie „schmähen“ passt hier weder zur Präposition noch zum Satzbau.
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: die Weisung
  rationale: Das Wort kann Befehl, Anordnung oder Weisung bezeichnen. „Weisung“ lässt den genauen Grad der Autorität offen und klingt in der nominalen Reihe natürlich.
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: derer, die mich bitten
  rationale: Das aus dem Griechischen αἰτεῖν entlehnte Verb bedeutet „bitten/verlangen“. „Bitten“ gibt die direkte Ausrichtung auf die Sprecherin wieder, ohne Verehrung in den Text hineinzulesen.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: die Stimme der Stimmen
  rationale: Die wörtliche, emphatische Genitivfügung wird bewahrt; sie sollte nicht vorschnell zu „höchste Stimme“ geglättet werden.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: Vergöttlichung
  rationale: Die OCR-Lesung entspricht dem griechischen Lehnwort θέωσις. Die ungewöhnliche, aber textlich erkennbare Bedeutung wird im Haupttext bewahrt und wegen der unsicheren OCR-Lage erläutert.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: die sie ertönen ließen
  rationale: Die Relativform bezeichnet etwas, das „sie“ hervorbrachten oder äußerten. Im Zusammenhang mit „Stimme“ ist „ertönen ließen“ idiomatisch, ohne den pluralischen Handlungsträger aufzulösen.
theological_decisions:
- issue: ⲑⲉⲱⲥⲓⲥ als theologisch geprägter Ausdruck
  choice: Vergöttlichung
  alternative: Gott / Gottes
  rationale: Die vorgelegte Buchstabenfolge enthält das griechische Lehnwort für „Vergöttlichung“. Eine Normalisierung zu „Gott“ würde eine mögliche theologische Aussage beseitigen und den OCR-Befund stärker emendieren, als die Daten erlauben.
- issue: Bezug des pluralischen „sie“ im letzten Glied
  choice: Der Bezug auf die Engel bleibt grammatisch naheliegend, aber nicht ausdrücklich erklärt
  alternative: 'Explizit: „welche die Engel ertönen ließen“'
  rationale: Die deutsche Pronomenform erhält die syntaktische Offenheit des koptischen Relativsatzes und vermeidet eine interpretierende Wiederholung.
translation_notes:
  register: Dignifizierte, aber verständliche nominale Reihung. Die ungewöhnliche Formel „Stimme der Stimmen“ und der theologisch markierte Ausdruck „Vergöttlichung“ bleiben erhalten, weil eine Glättung die Eigenart und Unsicherheit des koptischen Wortlauts verdecken würde.
