- issue: Abweichung von der verbreiteten Passage „Ich bin gottlos … mein Gott ist groß“
  choice: Übersetzung des tatsächlich vorgelegten koptischen OCR-Ausschnitts
  alternative: Einsetzung der in veröffentlichten Übersetzungen an dieser Stelle gebotenen Gott/Gottlos-Antithese
  rationale: Der übermittelte Ausgangstext enthält die Lexeme für Erde, Erkenntnis und Orte, nicht die erwartete Gott/Gottlos-Aussage. Wegen der nur mittleren Zuverlässigkeit der Ausrichtung wird die Abweichung kenntlich gemacht, aber der vorliegende Quellenausschnitt nicht durch die Konsultationsfassung ersetzt.
- issue: Bild von der „Erde“ im Herzen
  choice: konkrete und mehrdeutige Bildsprache beibehalten
  alternative: metaphorische Deutung als Weltlichkeit, Materie oder innere Beschaffenheit
  rationale: Der knappe Kontext legt keine bestimmte theologische Auslegung fest. Eine explizite Deutung würde die genuine Spannung des Textes einseitig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem pluralischen „ihr“. Die befremdliche Wiederholung „eine Erde“ bleibt als bewusst nicht aufgelöstes Bild stehen. Der Zeilenrhythmus folgt der sentenzenhaften Ich-Rede; erklärende Zusätze wurden vermieden.
