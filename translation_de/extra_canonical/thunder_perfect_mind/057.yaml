  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: de
  text: '**12.** Dies ist mein Wort:[a]


    Ich ging aus einer Erde hervor,

    und ihr wurdet in Erkenntnis offenbar.

    Eine Erde ist in eurem Herzen;

    ihr nehmt die von draußen an, an verschiedenen Orten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende OCR-Lesung ist hier unsicher. Möglich wäre wörtlicher „Dies ist das Meine“; vielleicht ist auch „Dies ist meine Stimme/meine Äußerung“ gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Viele veröffentlichte Übersetzungen bieten an dieser Stelle sinngemäß: „Ich, ich bin gottlos, und ich bin die, deren Gott groß ist.“ Der hier vorgelegte OCR-Ausschnitt enthält dagegen „Erde“, „Erkenntnis“ und „Orte“ und könnte daher falsch ausgerichtet sein.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: Dies ist mein Wort
  rationale: Die OCR-Lesung und Segmentierung sind unsicher. Die Wiedergabe bewahrt den deiktisch-possessiven Sinn und formuliert im Deutschen einen verständlichen Auftakt; die mögliche wörtlichere Lesart wird in der Fußnote offengehalten.
- source_word: ⲉⲓⲉⲃⲟⲗ
  choice: ich ging … hervor
  rationale: ⲉⲓ ⲉⲃⲟⲗ ist eine geläufige koptische Verbindung für das Herausgehen oder Hervorgehen. „Hervorgehen“ passt zum feierlichen Ich-Rede-Stil.
- source_word: ⲕⲁϩ
  choice: Erde
  rationale: ⲕⲁϩ bezeichnet Erde oder Boden, nicht Dunkelheit; Dunkelheit wäre vielmehr ⲕⲁⲕⲉ. Das ungewöhnliche Bild „eine Erde“ wird nicht geglättet.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ
  choice: ihr wurdet … offenbar
  rationale: ϣⲟⲟⲡ bezeichnet Sein oder Werden; ⲉⲃⲟⲗ kann hier das Offenbarwerden ausdrücken. Die zweite Person Plural bleibt erhalten.
- source_word: ⲉⲡⲓⲥⲧⲏⲙ
  choice: in Erkenntnis
  rationale: Das griechische Lehnwort ἐπιστήμη bezeichnet Wissen oder Erkenntnis. „Erkenntnis“ wahrt hier den gehobenen, reflektierenden Ton.
- source_word: ⲕⲁϩ ⲛϩⲏⲧ
  choice: Eine Erde ist in eurem Herzen
  rationale: ⲛϩⲏⲧ bezeichnet das Innere beziehungsweise Herz. Die konkrete Bildsprache des Ausgangstextes wird trotz ihrer Fremdheit bewahrt.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ ⲛⲉⲃⲟⲗ
  choice: ihr nehmt die von draußen an
  rationale: 'Das über den Zeilenumbruch verteilte ϣⲟⲡ gehört zu ϣⲱⲡ, „nehmen, empfangen, annehmen“, nicht zu einem Verb für „suchen“. ⲛⲉⲃⲟⲗ wird als substantivische Mehrzahl verstanden: „die von draußen“.'
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: an verschiedenen Orten
  rationale: Das griechische Lehnwort τόπος bedeutet „Ort“. Der unbestimmte Plural ϩⲉⲛ wird idiomatisch mit „verschiedenen“ wiedergegeben, ohne die räumliche Aussage zu vergeistigen.
