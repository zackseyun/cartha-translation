base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: de
  text: '**13.** Verachtet meine Niedrigkeit nicht;

    und liebt meine Selbstbeherrschung in meiner Schwäche.[a]

    Stellt euch nicht gegen mich.[b]

    Und verachtet meine Verfehlung nicht,

    und verflucht mein Rühmen nicht.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann neben „Schwäche“ auch „Bedürftigkeit“ oder „Armut“ bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die OCR-Lesung dieser Wendung ist unsicher. Wörtlich liegt etwa „stellt/setzt euch nicht gegen mich“ nahe; eine frühere Auswertung verstand die Zeile als „lacht nicht übermäßig über mich“.
    reason: textual_uncertainty
  - marker: c
    text: Die letzten Wörter sind im vorliegenden OCR-Auszug schwer segmentierbar. Die Übersetzung folgt der Lesung „verachtet meine Verfehlung nicht, und verflucht mein Rühmen nicht“; eine ältere Segmentierung ergab sinngemäß „stoßt mich nicht unter die in Gewalt Getöteten aus“.
    reason: alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: Verachtet … nicht
  rationale: Der negative Imperativ mit ⲙ̄ⲡⲣ̄ und ⲙⲉⲥⲧⲉ bezeichnet verachten, verschmähen oder hassen; „verachten“ passt zum Gegenstand „Niedrigkeit“ und wahrt den mahnenden Ton.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: meine Niedrigkeit
  rationale: Das Abstraktum bezeichnet einen niedrigen, unbedeutenden oder verachteten Zustand. „Niedrigkeit“ vermeidet die positive Tugendbedeutung, die „Demut“ nahelegen könnte.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: meine Selbstbeherrschung
  rationale: Das griechische Lehnwort ἐγκράτεια bezeichnet Selbstbeherrschung oder Enthaltsamkeit. „Selbstbeherrschung“ ist im heutigen Deutsch verständlich und lässt den ethischen Bedeutungsumfang offen.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: und liebt … sie
  rationale: ⲛ̄ⲧⲉⲧⲛ̄ wird hier als konjunktive Verbform der zweiten Person Plural verstanden; das feminine Objektsuffix verweist auf ⲉⲅⲕⲣⲁⲧⲉⲓⲁ. Damit lautet die Aufforderung nicht „meine Selbstbeherrschung euch gegenüber“, sondern „und liebt sie“.
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: meine Schwäche
  rationale: Das Abstraktum zu ϭⲱⲃ bezeichnet vor allem Schwäche oder Kraftlosigkeit; je nach Zusammenhang kann es auch Bedürftigkeit oder Armut einschließen.
- source_word: ⲙ̄ⲡⲣ̄ ⲕⲱ ⲧⲏⲛⲉ ⲉⲣⲟⲉⲓ
  choice: Stellt euch nicht gegen mich
  rationale: Die Wendung wird mit ⲕⲱ im Sinn von „stellen, setzen“ und dem auf die Angeredeten bezogenen Element als reflexive Aufforderung verstanden. Dies folgt der sichtbaren Wortgestalt des OCR-Auszuges besser als „lacht nicht über mich“.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲛ̄ⲧⲁⲣⲓⲧⲉ
  choice: verachtet meine Verfehlung nicht
  rationale: Das griechische Lehnverb καταφρονεῖν bedeutet „verachten“; ⲣⲓⲕⲉ kann eine Abweichung, einen Fehltritt oder eine Verfehlung bezeichnen. „Verfehlung“ bewahrt die moralische, aber nicht näher bestimmte Aussage.
- source_word: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: verflucht mein Rühmen nicht
  rationale: ⲥⲁϩⲟⲩ wird als „verfluchen“ und ϣⲟⲩϣⲟⲩ als „sich rühmen/Rühmen“ gelesen. Die nominale Wiedergabe erhält die zugespitzte Spannung zwischen Niedrigkeit, Schwäche und Rühmen.
theological_decisions:
- issue: Spannung zwischen Niedrigkeit, Schwäche, Selbstbeherrschung und Rühmen
  choice: Die gegensätzlichen Selbstaussagen bleiben unaufgelöst nebeneinander stehen.
  alternative: „Rühmen“ als Stolz, Gewalttätigkeit oder als eindeutig positive Herrlichkeit deuten.
  rationale: Der poetische Text arbeitet bewusst mit paradoxen Selbstbezeichnungen. Eine vereinheitlichende Deutung würde mehr festlegen, als die Quelle erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen parallelen Mahnsätzen. Die Wiederholung von „nicht“ und „und“ bildet die koptische Reihung ab. Ungewöhnliche Gegensätze werden nicht geglättet; philologische Unsicherheiten stehen in Fußnoten statt im Haupttext.
