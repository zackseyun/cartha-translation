review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt die erste Mahnung und die abschließende Folge von Verachtung/Fluch im Grundansatz wieder, doch „Stellt euch nicht gegen mich“ ist für ⲙ̄ⲡⲣ̄ ⲕⲱ ⲧⲏⲛⲉ ⲉⲣⲟⲉⲓ nicht tragfähig. Die im englischen Audit belegte Lesung verlangt hier „Lacht nicht über mich, und zwar nicht übermäßig“. Die erhaltene OCR ist im Schlussteil nicht sicher segmentiert; die Übersetzung muss daher die durch die Auditspur gestützte Lesung markieren, statt eine scheinbar sichere alternative Syntax zu behaupten.
  naturalness: Die parallelen Imperative sind im Deutschen klar und würdig. „in meiner Schwäche“ ist möglich, doch „in meiner Armut“ entspricht der in der englischen Auditspur dokumentierten Bedeutung von ⲙⲛ̄ⲧϭⲱⲃ unmittelbarer. „Rühmen“ ist als Substantiv in diesem poetischen Register natürlich.
  terminology: „Niedrigkeit“, „Selbstbeherrschung“, „Verfehlung“ und „Rühmen“ sind angemessene, nicht konfessionell einengende Wiedergaben. Das feminine Pronomen zu „Selbstbeherrschung“ kann im Deutschen idiomatisch mit „sie“ ausgedrückt werden. Die Relation von ⲛ̄ⲧⲉⲧⲛ̄ bleibt unsicher und wird nicht im Haupttext überbestimmt.
  issues:
  - severity: high
    issue: Die dritte Zeile wird als „Stellt euch nicht gegen mich“ übersetzt.
    rationale: Die englische Auditspur dokumentiert für ⲕⲱ ⲧⲏⲛⲉ eine Intensivierung von „lachen“ und für ⲉⲣⲟⲉⲓ „über mich“. Die deutsche Wiedergabe verändert den Sprechakt und muss ersetzt werden.
  - severity: medium
    issue: „meine Selbstbeherrschung in meiner Schwäche“ lässt die syntaktische Beziehung undeutlich und lässt das Objekt von „liebt“ aus.
    rationale: Das feminine Objekt verweist auf die Selbstbeherrschung. „Liebt sie in meiner Armut“ macht den Imperativ und das Objekt im Deutschen verständlich, ohne die umstrittene Funktion von ⲛ̄ⲧⲉⲧⲛ̄ festzulegen.
  - severity: medium
    issue: Die Fußnoten b und c stellen unbelegte OCR-Alternativen in den Vordergrund.
    rationale: Die angeführte Lesung „stellt/setzt euch nicht gegen mich“ ist nicht die auditgestützte Bedeutung; die Fußnote zu einer Ausstoßung unter Gewaltopfer vermischt zudem eine frühere, nachweislich fehlerhafte Segmentierung mit dem Text. Die Unsicherheit soll präzise auf die Relation bei „Selbstbeherrschung“ und die problematische Schlusssegmentierung beschränkt werden.
