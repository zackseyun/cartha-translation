review_pass:
  verdict: revise
  source_fidelity: 'Die zentrale Sinnkorrektur des englischen Audit-Trails ist im Entwurf weitgehend zutreffend berücksichtigt: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ bezeichnet das Ausstoßen/Verstoßen, ⲛⲉⲧϣⲁⲁⲧ Bedürftige bzw. Mangel Leidende, und ⲟⲩϣⲁⲛϩⲧⲏⲥ bedeutet „barmherzig“. Die erste Zeile sollte jedoch die Bewegungsrichtung von ⲉⲃⲟⲗ ϩⲛ („hervor aus/aus der Mitte von“) besser erkennen lassen; „wenn“ fügt zudem eine zeitliche Bedingung ein, die der Text nicht verlangt. Bei ⲉⲃⲟⲗ ϩⲛ in der dritten Zeile ist „unter denen“ weniger genau als „aus der Gemeinschaft derer“.'
  naturalness: „Sieh auf mich“ ist im heutigen Standarddeutsch weniger idiomatisch als „Sieh mich an“. „Verstoße mich nicht unter denen“ ist syntaktisch und semantisch holprig, weil man jemanden nicht „unter“ einer Personengruppe verstößt. Die revidierte Fassung wahrt die knappe poetische Form, bleibt aber klarer.
  terminology: „Geehrte“, „geringste Orte“ und „barmherzig“ sind passend. Die ungewöhnliche Verbindung von Bedürftigkeit und Wertlosigkeit soll nicht zu einer Aussage über den moralischen Wert der Betroffenen geglättet werden. Daher bleibt die wörtlich nahe Wendung im Text und wird in der Fußnote erläutert.
