    issue: Die erste Zeile gibt ⲉⲃⲟⲗ ϩⲛ nicht erkennbar als Bewegung „aus der Mitte von“ wieder und ergänzt „wenn“.
    rationale: Die Formulierung „wenn ich unter den Geehrten hervortrete“ macht aus der Bewegung eine zeitliche Nebenbestimmung und schwächt die Herkunftsrichtung ab.
  - severity: medium
    issue: „Verstoße mich nicht unter denen“ ist keine natürliche und nur eingeschränkt genaue Wiedergabe von ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲛ.
    rationale: Das Präpositionalgefüge bedeutet hier Ausstoßung aus einer Gruppe. „Aus der Gemeinschaft derer“ gibt dies im Deutschen verständlich wieder.
  - severity: low
    issue: Die Fußnote deutet „Wertlosigkeit“ teilweise als Eigenschaft der Menschen selbst.
    rationale: Der schwierige Ausdruck kann einen Zustand der Unbrauchbarkeit/Wertlosigkeit bezeichnen; die Fußnote sollte die Deutung nicht unnötig auf die Menschen als „wertlos“ festlegen.
