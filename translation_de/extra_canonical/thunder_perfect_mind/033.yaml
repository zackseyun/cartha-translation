base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: de
  text: 'Sieh mich an, wie ich aus der Mitte der Geehrten hervortrete;


    an den geringsten Orten wirst du mich finden.


    Verstoße mich nicht aus der Gemeinschaft derer, die in Wertlosigkeit Mangel leiden[a];


    denn ich, ich bin barmherzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »aus der Gemeinschaft derer, die in Wertlosigkeit Mangel leiden«. Die koptische Wendung ist ungewöhnlich. ⲛⲉⲧϣⲁⲁⲧ bezeichnet Menschen, die Mangel leiden oder bedürftig sind; ⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ bezeichnet Wertlosigkeit bzw. Unbrauchbarkeit. Ob die Wendung den Zustand der Betroffenen oder ihre soziale Abwertung akzentuiert, bleibt offen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: die Geehrten
  rationale: Die über den Zeilenumbruch verteilte Form lässt sich als »die Geehrten« verstehen und bildet den hohen Pol des anschließenden Gegensatzes zu den geringsten Orten.
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: die geringsten Orte
  rationale: Die griechischen Lehnwörter λάχιστος und τόπος bezeichnen die niedrigsten beziehungsweise unbedeutendsten Orte; die Mehrzahl und das räumliche Bild bleiben erhalten.
- source_word: ⲛ̄ⲧⲉⲧⲛϭⲓⲛⲉ ⲙ̄ⲙⲟⲓ (im OCR entstellt)
  choice: ihr werdet mich finden
  rationale: Die handschriftliche Lesung hinter dem fehlerhaften OCR ergibt idiomatisch »ihr werdet mich finden«; dadurch entfällt die unbegründete Deutung von ⲱⲕ als »Haus«.
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: verstoße mich nicht
  rationale: ⲛⲟⲩϫⲉ mit Objektsuffix und ⲉⲃⲟⲗ bedeutet hier »mich hinauswerfen/verstoßen«, nicht »dich über mich erheben«.
- source_word: ⲛⲉⲧϣⲁⲁⲧ
  choice: denen es fehlt
  rationale: Die Form gehört zu ϣⲱⲱⲧ, »Mangel haben, entbehren«, und bezeichnet Bedürftige beziehungsweise Mangel Leidende, nicht Menschen, die andere zertreten.
- source_word: ⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: Wertlosigkeit / fehlender Wert
  rationale: Das griechisch geprägte Wort bezeichnet Unbrauchbarkeit oder Wertlosigkeit. Im Haupttext wird die sperrige Verbindung als »denen es an Wert fehlt« natürlich wiedergegeben, ohne die negative Wertung aufzuheben.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: barmherzig
  rationale: Das etablierte koptische Wort bedeutet »mitfühlend, erbarmungsvoll« und ist nicht als futurische Konstruktion »eine, die erniedrigt werden soll« zu zerlegen.
theological_decisions:
- issue: Identität und Geschlecht der sprechenden Ich-Gestalt
  choice: Keine identifizierende Bezeichnung oder geschlechtlich markierte Ergänzung eingefügt
  alternative: Die Sprecherin ausdrücklich als göttliche Frauengestalt kennzeichnen
  rationale: Der Abschnitt nennt die Identität nicht ausdrücklich. Die Übersetzung bewahrt die Ich-Rede und vermeidet eine konfessionelle oder mythologische Festlegung.
- issue: Barmherzigkeit der sprechenden Gestalt
  choice: Die direkte Selbstaussage »ich bin barmherzig« bleibt unqualifiziert stehen
  alternative: Die Aussage abschwächen oder als zukünftige Erniedrigung deuten
  rationale: ⲟⲩϣⲁⲛϩⲧⲏⲥ bezeichnet klar eine barmherzige beziehungsweise mitfühlende Person; die theologische Spannung der Selbstaussage soll nicht aufgelöst werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Zeilenführung. Die Wiederholung »ich, ich« bewahrt die emphatische koptische Konstruktion. »Geringste Orte« hält das konkrete räumliche und soziale Niedrigkeitsmotiv fest; die schwer verständliche Verbindung von Mangel und Wertlosigkeit wird im Text lesbar formuliert und in der Fußnote offengehalten.
