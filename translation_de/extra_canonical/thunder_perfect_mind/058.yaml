  text: I am the one on whom you have set your mind,[a] and you have rejected me.[b]
translation:
  language: de
  text: '**13.** Ich bin die, auf die ihr euer Herz gerichtet habt,[a] und ihr habt mich verworfen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „auf die ihr euer Herz gelegt habt“; auch möglich: „über die ihr nachgedacht habt“ oder „die ihr erwogen habt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und ihr habt mich hinausgeworfen“ oder „weggestoßen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ (mit ϣⲟⲡ)
  choice: euer Herz gerichtet habt
  rationale: Die Wendung bezeichnet bewusstes inneres Erwägen. „Das Herz auf jemanden richten“ bewahrt das körperlich-geistige Bild des Koptischen und bleibt im Deutschen verständlich; „nachdenken über“ wäre glatter, aber weniger bildhaft.
- source_word: ϩⲏⲧ
  choice: Herz
  rationale: Das koptische Wort kann den Sitz von Denken, Wollen und innerer Ausrichtung bezeichnen. „Herz“ erhält die Bildsprache des Ausgangstextes, ohne die Bedeutung auf bloßes Gefühl zu verengen.
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: verworfen
  rationale: Die Verbindung kann aktives Wegstoßen, Hinauswerfen oder Verwerfen ausdrücken. „Verworfen“ gibt den Gegensatz zwischen innerer Beschäftigung mit der Sprecherin und anschließender Zurückweisung prägnant wieder.
theological_decisions:
- issue: Geschlecht der sprechenden Gestalt
  choice: die
  alternative: derjenige / die Person
  rationale: Der literarische Zusammenhang stellt eine weiblich sprechende Ich-Gestalt dar. Das feminine Relativpronomen ist im Deutschen natürlich; darüber hinaus wird keine bestimmte theologische Identifikation der Sprecherin festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität und der scharfe Gegensatz der beiden Aussagen bleiben erhalten. Weitere im OCR-Ausschnitt sichtbare Wendungen, darunter „aus Erkenntnis“ und „an Orten unter dem Himmel“, wurden wegen der nur mittleren Segmentausrichtung nicht in diesen Satz aufgenommen; sie gehören wahrscheinlich zu benachbarten Sinneinheiten.
