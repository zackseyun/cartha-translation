  verdict: approve
  source_fidelity: Die Übersetzung folgt der für dieses Segment herangezogenen Lesung („I am the one on whom you have set your mind … and you have rejected me“) angemessen. „euer Herz gerichtet habt“ bewahrt die Bildlichkeit von ϩⲏⲧ als innerem Sitz von Denken und Wollen, ohne die Aussage auf Gefühl zu verengen. „verworfen“ gibt ⲧⲱⲡ ⲉⲃⲟⲗ im Kontext idiomatisch wieder; die Fußnote hält die stärker räumlich-expulsive Nuance offen. Der OCR-Ausschnitt selbst ist nur mit mittlerer Sicherheit ausgerichtet und enthält offenbar angrenzende Sinneinheiten; die Entscheidung, diese nicht in den Vers einzutragen, ist daher sachgerecht.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die Konstruktion „die, auf die ihr euer Herz gerichtet habt“ ist grammatisch und stilistisch tragfähig; das feminine Relativpronomen ist im literarischen Kontext natürlich. Interpunktion und Fußnotenanker sind korrekt gesetzt.
  terminology: Die Wahl von „Herz“ ist für die koptische Bildsprache vertretbar und wird in der Anmerkung sinnvoll erläutert. „Verworfen“ ist als zentrale kontrastierende Aussage präzise; die Alternativen „hinausgeworfen“ und „weggestoßen“ vermeiden eine unangemessene dogmatische oder interpretative Festlegung. Keine problematischen theologischen Festlegungen.
