base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: de
  text: …[a] mein Vater und die Schwester meines Mannes; und er ist mein Nachkomme. Ich bin die Dienerin[b] meines Mannes, und ich bin die Herrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der zugrunde gelegte Textausschnitt beginnt mit „mein Vater“. Das Auslassungszeichen zeigt an, dass die Verbindung zum vorausgehenden Kontext innerhalb dieses Ausschnitts nicht rekonstruiert wird.
    reason: textual_scope
  - marker: b
    text: 'Auch möglich: „Sklavin“. Das koptische Wort bezeichnet eine Dienerin beziehungsweise eine versklavte Frau und steht im bewussten Gegensatz zu „Herrin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: mein Vater
  rationale: Die Form bezeichnet mit dem Suffix der ersten Person eindeutig „mein Vater“. Da der überlieferte Ausschnitt offenbar mitten in einem Satz einsetzt, wird keine im Ausschnitt fehlende Satzbeziehung ergänzt.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: die Schwester meines Mannes
  rationale: ⲥⲱⲛⲉ bedeutet „Schwester“, und ⲡⲁϩⲁⲓ bezeichnet den Ehemann. Die geschlechtlich bestimmten Bezeichnungen bleiben erhalten.
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: und er ist mein Nachkomme
  rationale: ⲛⲧⲟϥ ist das selbstständige männliche Pronomen „er“; ⲡⲁϫⲡⲟ bedeutet „mein Nachkomme/meine Nachkommenschaft“. „Nachkomme“ passt im Deutschen zum persönlichen männlichen Pronomen und bewahrt das paradoxe Verwandtschaftsverhältnis.
- source_word: ⲧϩⲙϩⲁⲗ ⲛⲧⲉ ⲡⲁϩⲁⲓ
  choice: die Dienerin meines Mannes
  rationale: ϩⲙϩⲁⲗ bezeichnet eine dienende oder versklavte Person, nicht eine Braut. „Dienerin“ ist würdig und verständlich; die stärkere Alternative „Sklavin“ wird in der Fußnote genannt.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: die Herrin
  rationale: Die feminine Form entspricht „Herrin“ und bildet den beabsichtigten Gegensatz zu „Dienerin“. Das moderne „Geliebte“ mitschwingen lassende „Mätresse“ beziehungsweise „Mistress“ wird vermieden.
theological_decisions:
- issue: Paradoxe Verwandtschaftsaussage
  choice: „er ist mein Nachkomme“ wird ohne Erklärung oder Harmonisierung wiedergegeben
  alternative: die Aussage als Zeugungs- oder Geburtsvorgang umzuformen
  rationale: Der koptische Wortlaut bezeichnet den Mann als ihren Nachkommen. Die Spannung zwischen Ehemann und Nachkomme gehört zur Aussage und darf nicht aufgelöst werden.
- issue: Gegensatz von Unterordnung und Autorität
  choice: „Dienerin“ und „Herrin“
  alternative: „Braut“ und „Herrin“
  rationale: Die koptischen Wörter bilden einen Gegensatz zwischen dienender Stellung und Herrschaft. Eine Deutung als Braut ist lexikalisch nicht begründet.
translation_notes:
  register: Moderne, klare und zugleich poetisch-würdige Standardsprache. Die wiederholte Ich-bin-Formel und die paradoxen Beziehungen bleiben knapp und unvermittelt. Der Fragmentcharakter am Anfang wird sichtbar gemacht, statt fehlenden Kontext stillschweigend zu ergänzen.
