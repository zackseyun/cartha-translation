  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
translation:
  language: de
  text: '**12.** Wenn sie mich rufen, ist es nicht meine Verteidigung.[a] Das Unrecht, das ihr erwogen habt,[b] lasst ihr zu, damit sie alle den Mund öffnen, um mich zu richten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des Ausschnitts und das Ende des Verbs sind beschädigt. Wörtlich erkennbar sind „meine Verteidigung“ und eine bedingte Form von „rufen/nennen“; das Objekt „mich“ ist aus dem Zusammenhang ergänzt.
    reason: textual_uncertainty
  - marker: b
    text: ⲡϫⲓⲛϭⲟⲛⲥ bedeutet „Unrecht“, „Gewalttat“ oder „Bedrückung“, nicht „Zahl“ oder „Menge“.
    reason: lexical_alternative
  - marker: c
    text: 'Die Zeilen sind lückenhaft, und die genaue syntaktische Zuordnung der Pronomen ist unsicher. Das sichtbare ⲧⲉⲣⲟⲟⲩ bedeutet wahrscheinlich „alle“. Möglich ist auch eine Konstruktion näher bei: „… ihr lasst es alle ihre Münder öffnen, um mich zu richten.“'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: Verteidigung
  rationale: Das griechische Lehnwort bezeichnet hier am ehesten eine Verteidigungsrede oder Rechtfertigung; „Verteidigung“ bewahrt den gerichtlichen Zusammenhang in natürlichem Deutsch.
- source_word: ⲙⲟⲩⲧⲉ (ergänzt)
  choice: rufen
  rationale: Das sichtbare ⲉⲩϣⲁⲛⲙⲟⲩ[ lässt sich plausibel zu einer Form von ⲙⲟⲩⲧⲉ („rufen, nennen“) ergänzen. „Rufen“ vermeidet die nicht quellengestützte Wiedergabe „sprechen“.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: das Unrecht
  rationale: Die Verbindung bezeichnet Unrecht, Gewalttat oder Bedrückung; sie bedeutet hier nicht „Zahl“. „Unrecht“ passt zum nachfolgenden Richten und lässt die Art des Vergehens offen.
- source_word: ⲉⲓⲙⲟⲉⲓⲛ
  choice: erwägen
  rationale: Das Verb kann „denken, bedenken, erwägen“ bedeuten. „Erwägen“ fügt sich in den juridischen Kontext, ohne bereits ein endgültiges Urteil vorauszusetzen.
- source_word: ⲭⲣⲟⲉⲓ
  choice: den Mund öffnen
  rationale: Im vorliegenden Zusammenhang steht das Verb in einer Wendung vom Öffnen des Mundes; die idiomatische deutsche Wiedergabe erhält das Bild einer Anklage- oder Gerichtsrede.
- source_word: ⲕⲣⲓⲛⲉ
  choice: richten
  rationale: Das griechische Lehnverb kann „urteilen, entscheiden, richten“ heißen. „Richten“ wahrt hier sowohl den gerichtlichen Sinn als auch die mögliche negative Färbung.
theological_decisions:
- issue: Rolle der Sprecherin im Gerichtsmotiv
  choice: Die Sprecherin wird als Gegenstand des Richtens dargestellt, ohne die Rechtmäßigkeit dieses Gerichts zu bestimmen.
  alternative: „verurteilen“ würde das Urteil ausdrücklich als negativ oder schuldigsprechend kennzeichnen.
  rationale: Das Quellverb ⲕⲣⲓⲛⲉ ist weiter als „verurteilen“; die Übersetzung soll die Spannung zwischen Verteidigung, Unrecht und Gericht nicht konfessionell oder dogmatisch auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem juridischem Bildfeld. Wegen der beschädigten und nur heuristisch ausgerichteten OCR-Vorlage werden Ergänzungen knapp markiert; die frühere, auf dem fehlzugeordneten Konsultationstext beruhende Paradoxie vom Nichtsprechen und den vielen Worten wird nicht übernommen.
