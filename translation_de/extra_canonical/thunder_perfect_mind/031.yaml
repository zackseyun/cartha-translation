base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/031.yaml
  text: …leave me as I come forth[a]. And you will seek me in riches[c][b]. And do not look at me as I come forth among those who are honored…
translation:
  language: de
  text: …lasst mich, während ich hervortrete.[a] Und ihr werdet mich im Reichtum finden.[b] Und schaut mich nicht an, während ich unter den Geehrten hervortrete …[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „…lasst mich, während ich herauskomme.“ Der Satzanfang liegt außerhalb dieses Ausschnitts.'
    reason: Der überlieferte Ausschnitt setzt mitten im Satz ein; die deutsche Formulierung ergänzt keinen verlorenen Satzanfang.
  - marker: b
    text: Das koptische Wort kann „Reichtum“ oder „Wohlstand“ bezeichnen.
    reason: Lexikalische Bedeutungsbreite.
  - marker: c
    text: Der Ausschnitt bricht mitten im letzten Wort ab. „Geehrten“ folgt der Ergänzung aus dem fortlaufenden Kodextext.
    reason: Textkritische Ergänzung über die Grenze des OCR-Ausschnitts hinaus.
lexical_decisions:
- source_word: ⲕⲁⲁⲧ
  choice: lasst mich zurück
  rationale: Die Form gehört zu ⲕⲱ („lassen, zurücklassen“) mit einem Objekt der 1. Person Singular; sie bedeutet hier nicht „gebt acht“.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: während ich hervortrete
  rationale: 'Als Umstandssatz mit der 1. Person Singular verstanden: „während/als ich herauskomme“, nicht als pluralischer Imperativ.'
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: ihr werdet mich finden
  rationale: Die Futurform von ϭⲓⲛⲉ bezeichnet das Finden; „suchen“ würde den erreichten Fund unnötig abschwächen.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: im Reichtum
  rationale: Das Abstraktum zu „reich sein/reicher Mensch“ bezeichnet Reichtum oder Wohlstand, nicht allgemein Größe.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: Und schaut mich nicht an
  rationale: ⲙⲡⲣ- markiert einen negativen Imperativ; ⲛⲁⲩ ⲉ- bedeutet „jemanden ansehen“.
- source_word: ⲛⲉⲧⲧⲁ[ⲉⲓⲏⲩ]
  choice: den Geehrten
  rationale: Das am Ausschnittende abgebrochene Wort wird nach dem fortlaufenden Kodextext als Bezeichnung für „die Geehrten“ ergänzt.
theological_decisions:
- issue: Paradoxe Gegenüberstellung von Reichtum und Geehrten
  choice: 'Die Aussagen bleiben unaufgelöst nebeneinander stehen: Die Sprecherin wird im Reichtum gefunden, soll aber unter den Geehrten nicht angesehen werden.'
  alternative: Die Begriffe deutend als „Größe“ und „Niedrige“ einander gegenüberzustellen.
  rationale: Eine solche Deutung beruht auf Fehlsegmentierungen beziehungsweise weniger wahrscheinlichen Wortbestimmungen und würde die Spannung des koptischen Wortlauts verändern.
translation_notes:
  register: Digniges, modernes Standarddeutsch mit direkter Anrede im Plural. Die Ellipsen zeigen an, dass der Ausschnitt am Anfang und Ende unvollständig ist; die wiederholte Wendung „während ich hervortrete“ bewahrt den Rhythmus und die paradoxe Selbstdarstellung.
