base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: de
  text: '**12.** Ich bin die Dienerin dessen, der mich bereitet hat. Ich bin die Herrin meiner Nachkommenschaft. Doch er ist es, der mich vor dem Tag meiner Geburt zeugte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „zeugte“ wiedergegebene Verb ist im koptischen Manuskript nur rekonstruiert; auch „hervorbrachte“ ist möglich.
    reason: textual_reconstruction
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: Dienerin
  rationale: Das koptische Substantiv bezeichnet eine dienende, gegebenenfalls unfreie Person. Die feminine Form und die weibliche Sprecherstimme werden mit „Dienerin“ wiedergegeben, ohne die rechtliche Nuance durch „Sklavin“ stärker festzulegen.
- source_word: ⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: dessen, der mich bereitet hat
  rationale: Das Verb ⲥⲃⲧⲱⲧ bedeutet „vorbereiten, bereitmachen, herrichten“. „Bereitet“ wahrt den gehobenen Ton und lässt offen, in welcher Weise die Sprecherin vorbereitet wurde.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: Herrin
  rationale: Die feminine Form von „Herr/Gebieter“ bezeichnet hier eine Frau in Autoritätsstellung. „Herrin“ erhält sowohl Genus als auch Herrschaftsanspruch.
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: Nachkommenschaft
  rationale: Die Bildung mit ⲙⲛⲧ- und ϣⲏⲣⲉ („Kind“) hat kollektiven beziehungsweise abstrakten Sinn. „Nachkommenschaft“ gibt diesen Sinn wieder und passt zum paradoxen Verwandtschaftsverhältnis.
- source_word: '[ϫⲡⲟⲉⲓ]'
  choice: zeugte
  rationale: Die rekonstruierte Form bezeichnet das Zeugen beziehungsweise Hervorbringen der Sprecherin. „Zeugte“ bewahrt die pointierte Verbindung mit „Geburt“, während die Textrekonstruktion in einer Fußnote kenntlich gemacht wird.
- source_word: ϩⲁⲧⲉϩⲏ ⲙⲡⲉϩⲟⲟⲩ ⲙⲡⲁϫⲡⲟ
  choice: vor dem Tag meiner Geburt
  rationale: Die zeitliche Wendung wird direkt und natürlich wiedergegeben und erhält das Paradox einer Zeugung vor dem eigenen Geburtstag beziehungsweise Geburtstag im wörtlichen Sinn der Geburt.
theological_decisions:
- issue: Bezug des männlichen Pronomens in „Doch er ist es“
  choice: Der Bezug bleibt im Deutschen unbestimmt.
  alternative: Explizite Identifikation mit einem bestimmten Vorfahren, Kind oder göttlichen Wesen.
  rationale: Das Koptische verwendet ein männliches Demonstrativpronomen, benennt dessen Referenten hier jedoch nicht eindeutig. Eine theologische Identifikation würde die im Text angelegte Spannung unzulässig auflösen.
- issue: Paradoxe zeitliche und verwandtschaftliche Aussage
  choice: Die Aussage wird ohne erklärende Harmonisierung wörtlich als Zeugung vor dem Tag der eigenen Geburt wiedergegeben.
  alternative: Sinngemäße Auflösung als vorherige Planung, geistige Hervorbringung oder Präexistenz.
  rationale: Der Text formuliert bewusst paradoxe Identitäts- und Verwandtschaftsaussagen. Die Übersetzung soll diese Spannung erhalten, statt eine bestimmte metaphysische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knapper, rhythmischer Wiederholung. Die feminine Sprecherstimme wird in „Dienerin“ und „Herrin“ sichtbar gemacht. Grundlage ist der für NHC VI,2 14,4–8 korrigierte koptische Wortlaut; der im Datensatz angeführte OCR-Ausschnitt ist mit einem späteren Abschnitt fehlaligniert.
