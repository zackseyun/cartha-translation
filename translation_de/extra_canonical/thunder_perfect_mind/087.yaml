  yaml_path: translation/extra_canonical/thunder_perfect_mind/087.yaml
  text: 'I am the hearing that is acceptable to everyone[a],

    and I am the speech that is [to be spoken][b].

    Believe them: I am your [call][c] for speaking, and great is

    the silence of speech—listen to me in anger[a][d][c][b], and of [...] [d]'
translation:
  language: de
  text: 'Ich bin das Hören, das jedem zugänglich ist,[a]

    und die Rede, die [nicht zu fassen ist].[b]

    Glaubt ihnen: Ich bin dein [Ruf][c] zum Reden,

    und groß ist das Schweigen der Rede.

    Hört auf mich im Zorn, und […][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „das von jedem angenommen wird“. Die Form ⲉⲧϣⲏⲡ lässt in diesem Zusammenhang beide Nuancen zu.'
    reason: lexical_alternative
  - marker: b
    text: Die zugrunde liegende OCR-Lesung ⲉⲧⲉ ⲙⲁⲧϣⲉ ist unsicher. Möglich ist ein Sinn wie „die nicht zu fassen ist“; bei einer anderen Lesung könnte von einer erbetenen oder zu sprechenden Rede die Rede sein.
    reason: textual_uncertainty
  - marker: c
    text: Die als ⲧⲉⲕⲱ gelesene Form ist wahrscheinlich beschädigt oder falsch erkannt. „Ruf“ ist eine vorsichtige kontextuelle Wiedergabe; vorgeschlagen wurden auch Lesungen im Sinn von „dein Ohr“ oder „deine Stimme“.
    reason: textual_uncertainty
  - marker: d
    text: Der Ausschnitt endet mit ⲛⲧⲉ und damit mitten in einer weiterführenden Konstruktion. Der fehlende Text kann aus diesem Segment nicht ergänzt werden.
    reason: incomplete_source
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: das Hören / Hört
  rationale: Das substantivierte ⲥⲱⲧⲙ bezeichnet hier das Hören; das spätere ⲥⲱⲧⲙ ist als Aufforderung wiedergegeben.
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: das jedem zugänglich ist
  rationale: ⲛⲟⲩⲟⲛ ⲛⲓⲙ bedeutet „jedem/allen“. Die qualitative Form ϣⲏⲡ kann in diesem Zusammenhang „angenommen“ beziehungsweise „zugänglich“ ausdrücken; „zugänglich“ ergibt im Deutschen eine natürliche Aussage über das Hören.
- source_word: ⲡϣⲁϫⲉ
  choice: die Rede
  rationale: ⲡϣⲁϫⲉ kann „Wort“, „Rede“ oder „Äußerung“ bedeuten. „Rede“ bewahrt den Gegensatz und zugleich die Verbindung zu „Hören“ und „Schweigen“.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: die [nicht zu fassen ist]
  rationale: Die OCR-Lesung und die genaue Verbform sind unsicher. Die eingeklammerte Wiedergabe folgt dem im Zusammenhang plausiblen Sinn, ohne ihn als textlich sicher auszugeben.
- source_word: ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: Glaubt ihnen
  rationale: Die Form wird als Aufforderung zum Glauben beziehungsweise Vertrauen mit pronominalem Objekt verstanden.
- source_word: ⲧⲉⲕⲱ
  choice: dein [Ruf]
  rationale: Die überlieferte beziehungsweise per OCR erfasste Form ist undurchsichtig. „Ruf“ ist eine vorsichtige, thematisch passende Wiedergabe und wird deshalb in Unsicherheitsklammern gesetzt.
- source_word: ⲉⲙⲁϣⲁϫⲉ
  choice: zum Reden
  rationale: Die Konstruktion bezeichnet hier den Zweck; „zum Reden“ ist eine knappe und natürliche deutsche Wiedergabe.
- source_word: ⲛⲁϣⲉ
  choice: groß ist
  rationale: Die Form gehört zu dem Bedeutungsfeld „zahlreich/groß sein“, nicht zum Substantiv „Ohren“. Im Zusammenhang mit „Schweigen“ passt „groß ist“.
- source_word: ⲧⲙⲛⲧϩⲁⲗⲏ ⲛϣⲁϫⲉ
  choice: das Schweigen der Rede
  rationale: Die Genitivverbindung wird formal bewahrt, einschließlich ihrer beabsichtigten paradoxen Spannung.
- source_word: ϩⲛ ⲟⲩϭⲱⲛ
  choice: im Zorn
  rationale: ϭⲱⲛ ist als Form von ϭⲱⲛⲧ „Zorn“ zu verstehen; eine Wiedergabe als „laute Stimme“ ist lexikalisch nicht begründet.
- source_word: ⲁⲩⲱ ⲛⲧⲉ
  choice: und […]
  rationale: ⲛⲧⲉ eröffnet eine Konstruktion, die jenseits des vorliegenden Ausschnitts weiterläuft. Der Satz wird daher ausdrücklich als Fragment wiedergegeben.
