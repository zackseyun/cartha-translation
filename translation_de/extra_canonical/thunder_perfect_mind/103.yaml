  naturalness: „Ich bin die Gerechtigkeit; ich bin die Fürsprecherin“ ist idiomatisches, würdiges modernes Deutsch. Die feminine Form ist innerhalb einer weiblich codierten Sprecherstimme sprachlich möglich. Die sprachliche Qualität kann jedoch die fehlende Quellengrundlage nicht ausgleichen.
  terminology: „Gerechtigkeit“ ist als mögliche personifizierende Wiedergabe von ⲥⲁⲃⲟⲗ vertretbar, aber in diesem OCR-Ausschnitt nicht als Prädikat einer Ich-bin-Aussage belegt. „Fürsprecherin“ ist gegenüber dem englischen „advocate“ eine plausible, aber stärker personifizierte und nicht quellenbelegte Festlegung. Eine Fußnote, die das Fehlen eines Belegs nennt, genügt nicht, um den unbelegten Haupttext als Übersetzung des vorliegenden Segments auszugeben.
  issues:
  - severity: high
    issue: Der Haupttext ist nicht durch den bereitgestellten koptischen Ausschnitt gedeckt.
    rationale: Die sichtbaren koptischen Wörter und der Satzanfang entsprechen nicht der übersetzten Doppelanrede. Insbesondere sind weder eine ausdrückliche erste Person („Ich bin“) noch eine Bezeichnung für eine Fürsprecherin im Slice erkennbar.
  - severity: high
    issue: Die englische Audit-Fassung beruht nach eigener Anmerkung auf unsicherer Segmentzuordnung und einer erschlossenen Rechtsrolle.
    rationale: Eine deutsche Zielübersetzung darf diese Hypothese nicht als gesicherten Wortlaut präsentieren, zumal die ausgerichtete Quelle ein anderes Textstück erkennen lässt.
  - severity: medium
