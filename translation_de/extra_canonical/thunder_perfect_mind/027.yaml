lexical_decisions:
- source_word: ⲁⲧⲱⲧⲙ
  choice: die Unverschlossene
  rationale: Die Bildung mit ⲁⲧ- verneint ⲱⲧⲙ/ⲧⲱⲧⲙ („schließen, verschließen“). „Unverschlossene“ bewahrt die ungewöhnliche, möglicherweise absichtlich paradoxe Formulierung, ohne sie deutend zu glätten.
- source_word: ⲧⲣⲙⲙⲁⲟ
  choice: die Reiche
  rationale: ⲣⲙⲙⲁⲟ bezeichnet eine reiche bzw. wohlhabende Person. Die substantivierte feminine Form entspricht der weiblichen Sprecherstimme des Werkes.
- source_word: ⲡϫⲓⲥⲉ
  choice: die Erhebung
  rationale: ϫⲓⲥⲉ bezeichnet Höhe bzw. Erhöhung/Erhebung; „Schande“ wäre lexikalisch nicht begründet. „Erhebung“ lässt sowohl einen räumlichen als auch einen übertragenen Sinn offen.
- source_word: ⲛⲍⲏⲧⲉ
  choice: des Suchens
  rationale: Die Form wird als griechisch beeinflusster Ausdruck für „suchen“ verstanden. Der Genitiv wahrt die syntaktische Offenheit des in den folgenden Abschnitt hineinreichenden Fragments.
theological_decisions:
- issue: Geschlecht der Ich-Stimme
  choice: Feminine substantivierte Formen („die Unverschlossene“, „die Reiche“)
  alternative: Geschlechtsneutrale Umschreibung („unverschlossen und reich“)
  rationale: Die weibliche Selbstrede ist ein grundlegendes literarisches Merkmal des Werkes; die feminine Form macht dies im Deutschen sichtbar, ohne eine zusätzliche dogmatische Deutung einzutragen.
- issue: Fragmentarischer Anschluss von „Die Erhebung des Suchens“
  choice: Als unvollendeten, mit Komma auslaufenden Satzteil wiedergeben
  alternative: Zu einem vollständigen Aussagesatz ergänzen
  rationale: Der Ausschnitt führt offenbar in den nachfolgenden Text weiter. Eine Ergänzung würde die syntaktische und inhaltliche Mehrdeutigkeit unzulässig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst ungewöhnlicher Nominalform, welche die rätselhafte Selbstbezeichnung des Originals erhält. Der fragmentarische Schluss wird weder geglättet noch theologisch ergänzt.
