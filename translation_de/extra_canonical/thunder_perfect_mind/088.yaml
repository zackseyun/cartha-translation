translation:
  language: de
  text: '**4.** Ich bin Selbstbeherrschung und Zügellosigkeit.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Selbstbeherrschung“ kann auch mit „Zurückhaltung“, „Disziplin“ oder „Enthaltsamkeit“ wiedergegeben werden; für „Zügellosigkeit“ kommen auch „Unbeherrschtheit“ oder „Ausschweifung“ infrage.
    reason: lexical_alternative
  - marker: b
    text: Die vorausgehenden Zeilen („Hört auf mich … lasst euch von mir belehren …“) gehören offenbar noch zum einleitenden Zusammenhang; hier wird nur die abschließende Aussage „Ich bin …“ wiedergegeben. Das nachfolgende ϩⲓϫⲙ („auf/über“) setzt sich wahrscheinlich in der nächsten Zeile fort.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin
  rationale: Gibt die ausdrückliche Ich-Prädikation natürlich wieder. Das koptische ⲧⲉ kennzeichnet die sprechende Instanz als feminin; dies lässt sich im deutschen Satz ohne einen Zusatz nicht eigens markieren.
- source_word: ⲧⲁϣϭⲏⲗ
  choice: Selbstbeherrschung
  rationale: Bezeichnet Zurückhaltung beziehungsweise Enthaltsamkeit und bildet einen klaren ethischen Gegenpol zum folgenden Ausdruck.
- source_word: ⲉⲕⲟⲗ
  choice: Zügellosigkeit
  rationale: Bewahrt den pointierten Gegensatz zu „Selbstbeherrschung“, ohne die Bedeutung vorschnell auf sexuelle Ausschweifung einzuengen.
- source_word: ϩⲓϫⲙ
  choice: '[hier nicht übersetzt]'
  rationale: Die am Ende stehende Präposition „auf/über“ verlangt offenbar eine Ergänzung in der folgenden, hier nicht enthaltenen Zeile; eine isolierte Wiedergabe wäre irreführend.
theological_decisions:
- issue: Paradoxe Identifikation mit entgegengesetzten Eigenschaften
  choice: Beide Pole werden ohne erklärende Harmonisierung als Ich-Aussage beibehalten.
  alternative: Den zweiten Pol abschwächen oder als Wirkung auf andere deuten.
  rationale: Der koptische Wortlaut stellt die Gegensätze unmittelbar nebeneinander. Die Spannung gehört zur Aussage und darf nicht konfessionell oder systematisch aufgelöst werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Selbstbeherrschung“ und „Zügellosigkeit“ ergeben ein verständliches, formal ausgewogenes Gegensatzpaar und erhalten die absichtliche paradoxe Spannung.
