  rationale: Der Quellentext gestaltet seine Aussage bewusst als Folge widersprüchlich wirkender Selbstbezeichnungen; eine Deutung im Haupttext würde die Mehrdeutigkeit unzulässig festlegen.
- issue: Lesung von ⲡⲁϫⲡⲟ
  choice: „mein Nachkomme“ im Haupttext
  alternative: „mein Herr“
  rationale: Die vorliegende OCR-Lesung und der unmittelbare Zusammenhang der Verwandtschaftsbezeichnungen sprechen für „Nachkomme“, während die mögliche Alternativlesung transparent dokumentiert wird.
