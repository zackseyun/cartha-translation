  rationale: Das Wort bezeichnet allgemein eine Frau und kann kontextabhängig auch „Ehefrau“ bedeuten. „Frau“ hält den Bedeutungsumfang offen und erhält die markante Gegenüberstellung mit „Tochter“.
- source_word: ⲙⲁⲁⲩ
  choice: Mutter
  rationale: Eindeutige Verwandtschaftsbezeichnung; sie bewahrt die paradoxe Aussage „Mutter meines Vaters“.
- source_word: ⲉⲓⲱⲧ
  choice: Vater
  rationale: Die gewöhnliche Verwandtschaftsbezeichnung gibt die paradoxe Genealogie unmittelbar wieder.
- source_word: ϩⲁⲓ (ⲡⲁϩⲁⲓ über den Zeilenumbruch hinweg)
  choice: Mann
  rationale: Mit Possessivpräfix bezeichnet ⲡⲁϩⲁⲓ gewöhnlich „mein Ehemann“. Im Deutschen ist „mein Mann“ die natürliche und eindeutige Wiedergabe.
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: er ist mein Nachkomme
  rationale: Der OCR-Text stützt ⲡⲁϫⲡⲟ und damit eine Aussage über Abstammung, die die Reihe der Verwandtschaftsparadoxa fortsetzt. Wegen möglicher Beschädigung wird die alternative Lesung in einer Fußnote genannt.
- source_word: ϩⲙϩⲁⲗ
  choice: nicht in den Haupttext aufgenommen
  rationale: Die anschließende Aussage bricht nach dem Genitiv ab. Ihre Aufnahme würde entweder einen unvollständigen Satz erzeugen oder eine nicht belegte Ergänzung verlangen.
