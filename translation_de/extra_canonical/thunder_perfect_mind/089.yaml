lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ ϩⲛ ⲟⲩϭⲱⲛ
  choice: auf mich im Zorn
  rationale: ⲉⲣⲟⲉⲓ bezeichnet die Ausrichtung auf die Sprecherin; ϩⲛ ⲟⲩϭⲱⲛ bedeutet „im Zorn“. Das im Ausschnitt fehlende Hörverb wird aus dem unmittelbar vorausgehenden Satzanschluss ergänzt.
- source_word: ⲛⲧⲉⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: lernt von mir
  rationale: Wörtlich geht es darum, Unterweisung in Bezug auf beziehungsweise von der Sprecherin zu empfangen. „Lernt von mir“ gibt dies in natürlichem Deutsch wieder und bewahrt die direkte Anrede im Plural.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ (OCR; vermutlich für ⲟⲩⲙⲛⲧⲣⲙⲣⲁϣ)
  choice: in Sanftmut
  rationale: Die überlieferte Lesart bezeichnet Sanftmut oder Milde. „Sanftmut“ wahrt den pointierten Gegensatz zu „Zorn“ und passt zum würdevollen Register.
theological_decisions:
- issue: Bezug von Zorn und Sanftmut
  choice: Die Präpositionalwendungen bleiben ohne ausdrückliche Zuordnung zu Sprecherin oder Hörenden.
  alternative: „Hört mich, wenn ich zornig bin, und lernt von mir, wenn ich sanft bin“ beziehungsweise eine Zuordnung zu den Angesprochenen.
  rationale: Der koptische Ausdruck lässt offen, wessen Zorn und Sanftmut gemeint sind. Die Übersetzung bewahrt diese Spannung, statt sie auszulegen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit feierlichem Imperativ und pluralischer Anrede. Die parallele Struktur „im Zorn … in Sanftmut“ erhält den rhetorischen Gegensatz des Originals.
