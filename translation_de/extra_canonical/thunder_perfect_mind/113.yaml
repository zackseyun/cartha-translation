base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/113.yaml
  text: 'You yourselves also[1]—the angels and those who have been sent[2]—

    I am the sign[3] that points out[4] among the dead[b][a][5][4][3][2][1]; yet I am the one who—[5]'
translation:
  language: de
  text: '**4.** Auch ihr selbst[a] – die Engel und die, die gesandt worden sind[b] –


    ich bin das Zeichen[c], das unter den Toten nach außen weist[d]; doch ich bin diejenige, die …[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung bedeutet hier wahrscheinlich »auch ihr selbst« oder »ihr selbst ebenfalls«, nicht »ihr allein«.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine Form des Verbs »senden«. Die unpersönliche Mehrzahl lässt sich als »die, die gesandt worden sind« verstehen; formal ist auch »die, die gesandt haben« möglich.
    reason: lexical_alternative
  - marker: c
    text: Für »Zeichen« sind je nach Dialekt und Zusammenhang auch »Kennzeichen« oder »Mal« möglich.
    reason: lexical_alternative
  - marker: d
    text: Die koptische Wendung ist in diesem Ausschnitt unsicher. Möglich sind unter anderem »nach außen weist«, »hervorbringt«, »kenntlich macht« oder »absondert/teilt«.
    reason: textual_variant
  - marker: e
    text: Die mit »diejenige, die …« beginnende Aussage bricht im vorliegenden OCR-Ausschnitt ab und wird offenbar im anschließenden Text fortgesetzt.
    reason: textual_variant
lexical_decisions:
- source_word: ⲧⲱⲧⲛ̄ ϩⲱⲧ ⲧⲏⲩⲧⲛ̄
  choice: Ihr selbst ebenfalls
  rationale: Die Wendung wird als emphatische Anrede in der 2. Person Plural mit dem enklitischen Sinn »auch/ebenfalls« verstanden; sie bedeutet hier nicht »ihr allein«.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: die Engel
  rationale: Das griechische Lehnwort bezeichnet in dieser kosmischen Anrede am ehesten Engel; wörtlich wäre auch »Boten« möglich.
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: die, die gesandt worden sind
  rationale: ⲧⲛ̄ⲛⲟⲟⲩ ist das Verb »senden«, nicht »sehen«. Die unpersönliche 3. Person Plural kann im Deutschen passivisch wiedergegeben werden; formal bleibt auch eine aktive Deutung möglich.
- source_word: ⲡⲓⲛⲁ
  choice: das Zeichen
  rationale: »Zeichen« gibt den semiotischen Sinn natürlich wieder; »Kennzeichen« oder »Mal« bleiben möglich.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: das … nach außen weist
  rationale: Die unsichere Verbindung wird möglichst offen und bildhaft wiedergegeben. Sie kann auch im Sinn von »hervorbringen«, »kenntlich machen« oder »absondern/teilen« verstanden werden.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: unter den Toten
  rationale: Die Präposition bezeichnet hier den Bereich innerhalb einer Mehrzahl; »unter« ist im Deutschen idiomatischer als »in«.
- source_word: ⲭⲉ
  choice: doch
  rationale: Die adversative Wiedergabe markiert den Übergang zur nächsten, im Ausschnitt abgebrochenen Selbstaussage.
- source_word: ⲡⲉⲧ
  choice: diejenige, die …
  rationale: Die substantivierte Relativform eröffnet eine weitere Selbstaussage. Die feminine deutsche Form folgt der weiblichen Sprecherstimme; der Inhalt bleibt wegen des Abbruchs offen.
theological_decisions:
- issue: Identität der gesandten Gruppe
  choice: Keine nähere Bestimmung; »die, die gesandt worden sind«
  alternative: »die, die gesandt haben« oder eine bestimmte religiöse Gesandtengruppe
  rationale: Die knappe Form erlaubt keine sichere Identifikation. Die Übersetzung vermeidet es, Engel, Apostel oder andere Gruppen dogmatisch festzulegen.
- issue: Funktion des Zeichens unter den Toten
  choice: Die räumlich-bildhafte und grammatisch offene Aussage bleibt erhalten.
  alternative: Das Zeichen ausdrücklich als Auferstehungszeichen, Scheidezeichen oder Buchstabenzeichen bestimmen.
  rationale: Der OCR-Ausschnitt und die unsichere Lexik tragen keine eindeutige theologische Auslegung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit der für das Werk typischen feierlichen Ich-bin-Folge. Gedankenstriche und Auslassungspunkte machen den fragmentarischen Aufbau sichtbar, ohne fehlenden Text zu ergänzen. Die ungewöhnliche Formulierung »nach außen weist« bewahrt bewusst die Unsicherheit des koptischen Ausdrucks.
