base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: de
  text: 'Seid wachsam,[a] und was euer Hören betrifft: Seid mir gegenüber an keinem Ort oder in keinem anderen Gedanken taub;[b] und bleibt nicht in Unkenntnis über mich. Denn ich bin die Erste, und ich bin die Letzte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid auf der Hut“ oder „Seid aufmerksam“.'
    reason: lexical_alternative
  - marker: b
    text: Der genaue Anschluss und die Gliederung dieser ungewöhnlichen Wendung sind wegen der unsicheren Zuordnung der Zeilen nicht völlig sicher.
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: Seid wachsam
  rationale: Der Imperativ mahnt zu Wachsamkeit beziehungsweise Aufmerksamkeit; die deutsche Fassung bewahrt den eindringlichen Ton.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: was euer Hören betrifft
  rationale: Die Form bezeichnet „euer Hören“ und nicht „ihr, die ihr hört“; die Herausstellung wird im Deutschen ausdrücklich wiedergegeben.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲉⲣⲟⲉⲓ
  choice: Seid mir gegenüber … nicht taub
  rationale: Die negative Aufforderung mit ⲣ-ⲁⲧ-ⲥⲱⲧⲙ bedeutet, nicht unhörend beziehungsweise taub gegenüber der Sprecherin zu sein.
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: an keinem Ort
  rationale: Im Geltungsbereich der Verneinung gibt die Wendung den Sinn „an irgendeinem Ort“ wieder, idiomatisch deutsch als „an keinem Ort“.
- source_word: ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: in keinem anderen Gedanken
  rationale: Die ungewöhnliche Verbindung von Hören und Gedanken wird nicht geglättet; im Geltungsbereich der Verneinung ist „keinem anderen“ natürlich.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: seid nicht ohne Erkenntnis über mich
  rationale: Die Wiedergabe hält die privative Form „ohne Wissen/Erkenntnis“ fest und vermeidet die schwächere Deutung „ignoriert mich nicht“.
- source_word: ⲧϣⲟⲣⲡ
  choice: die Erste
  rationale: Der feminine Artikel entspricht der weiblichen Sprecherstimme; zugleich bleibt die substantivische Selbstbezeichnung wörtlich.
- source_word: ⲑⲁⲉ
  choice: die Letzte
  rationale: Als paralleles Gegenstück zu „die Erste“ wird die feminine substantivische Form bewahrt.
theological_decisions:
- issue: Geschlecht der Selbstbezeichnungen
  choice: die Erste … die Letzte
  alternative: das Erste … das Letzte / der Erste … der Letzte
  rationale: Die koptischen Prädikatsformen tragen feminine Artikel und beziehen sich auf die weiblich markierte Sprecherin; eine neutralisierende oder maskulinisierende Wiedergabe wäre weniger quellennah.
- issue: Wissen beziehungsweise Erkenntnis der Sprecherin
  choice: nicht ohne Erkenntnis über mich
  alternative: mich nicht ignorieren / mich nicht verkennen
  rationale: Die Formulierung bewahrt die erkenntnisbezogene Aussage und legt nicht fest, ob bloßes Kennen, tieferes Erkennen oder bewusstes Ignorieren gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter poetischer Fremdheit. Der Plural der Aufforderungen wird beibehalten; die weibliche Sprecheridentität wird in „die Erste“ und „die Letzte“ sichtbar.
