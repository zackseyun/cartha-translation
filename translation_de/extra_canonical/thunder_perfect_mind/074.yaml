translation:
  language: de
  text: '[…] die bei mir sind, und die Frauen,


    die im Innern sind.[a]



    Ich bin die Geehrte


    und die, die man preist,[b]


    und die, die man verächtlich behandelt.[c]



    Ich bin […]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Frauen, die innen sind“. Worauf sich „innen“ bezieht, bleibt in diesem Ausschnitt offen; möglich ist auch „die in mir sind“.'
    reason: lexical_alternative
  - marker: b
    text: Das koptische Verb kann sowohl „preisen“ als auch „segnen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Die Wendung kann auch „in Schmach“ oder „mit Hohn“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: die bei mir sind
  rationale: ϣⲟⲟⲡ bezeichnet hier das Sein bzw. Sichbefinden, und ⲛ̄ⲙⲙⲁⲉⲓ bedeutet schlicht „bei/mit mir“. Da der Ausschnitt offenbar mitten im Satz einsetzt, wird die Form als fortgesetzte Relativgruppe wiedergegeben.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: die Frauen
  rationale: Das Wort ist der sahidisch-koptische Plural von „Frau“; die frühere Deutung als „die Armen“ beruht auf einer Verwechslung mit einem anderen Lexem.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: die im Innern sind
  rationale: Die Relativkonstruktion bezeichnet diejenigen, die innen bzw. im Innern sind. Die Form nennt in diesem Ausschnitt kein eindeutiges Bezugsobjekt; deshalb wird nicht erklärend „in mir“ ergänzt.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: Ich bin die Geehrte
  rationale: Die feminine Kopula und die feminine substantivierte Form ergeben eine Selbstbezeichnung als diejenige, die geehrt wird, nicht „meine Erscheinung“.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: die, die man preist
  rationale: ⲥⲙⲟⲩ kann „segnen“ oder „preisen“ bedeuten. „Preisen“ bildet im Zusammenhang den klaren Gegensatz zum anschließenden Verachten.
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙ̄ⲙⲟⲥ ϩⲛ̄ ⲟⲩϣⲱⲥ
  choice: die, die man voller Verachtung verachtet
  rationale: Das griechische Lehnverb καταφρονεῖν bedeutet „verachten“. ϩⲛ̄ ⲟⲩϣⲱⲥ bezeichnet hier Verachtung bzw. Schmach und nicht eine Stimme; die bewusst nachdrückliche deutsche Form bewahrt den paradoxen Gegensatz zur Geehrten und Gepriesenen.
theological_decisions:
- issue: Identität der Sprecherin
  choice: Die femininen Selbstbezeichnungen werden grammatisch sichtbar gehalten.
  alternative: Geschlechtsneutrale Wiedergabe als „die Person“ oder bloß „ich bin geehrt“
  rationale: Die koptischen femininen Formen gehören zur literarischen Gestalt der Rede. Ihre Beibehaltung deutet die Sprecherin nicht theologisch aus, sondern wahrt die grammatische und rhetorische Gestalt des Textes.
- issue: Paradox von Ehre, Lob und Verachtung
  choice: Die widersprüchlichen Zuschreibungen bleiben unaufgelöst nebeneinander stehen.
  alternative: Deutende Harmonisierung, etwa durch verschiedene Sprechergruppen oder Zeitpunkte
  rationale: Der Text nennt keine solche Auflösung; die Spannung ist ein wesentliches Stilmerkmal der Selbstoffenbarung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen, parallel gebauten Zeilen. Die Auslassungszeichen zeigen, dass der OCR-Ausschnitt am Anfang und Ende syntaktisch unvollständig ist. Die feminine Stimme und die paradoxen Selbstbezeichnungen werden ohne dogmatische Erklärung bewahrt.
