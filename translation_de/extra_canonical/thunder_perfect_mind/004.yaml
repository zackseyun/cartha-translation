  text: Do not be unknowing of me anywhere or at any time.[a][b][c]
translation:
  language: de
  text: '**4.** Seid weder irgendwo noch zu irgendeiner Zeit über mich in Unkenntnis.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Seid über mich an keinem Ort und zu keiner Zeit unwissend.“'
    reason: lexical_alternative
  - marker: b
    text: Der hier bereitgestellte OCR-Ausschnitt ist nur heuristisch zugeordnet und scheint teilweise benachbarte Zeilen wiederzugeben; dort stehen unter anderem „hören“ sowie möglicherweise „anderer Gedanke“. Die Übersetzung folgt der anderweitig bezeugten, diesem Abschnitt zugeordneten koptischen Klausel mit „an keinem Ort … zu keiner Zeit“.
    reason: alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣ-
  choice: seid … nicht / nirgends … in Unkenntnis
  rationale: Die negative Imperativform wird als direkte Aufforderung wiedergegeben. Die deutsche Formulierung bewahrt den Gedanken des Nichtwissens, ohne das unnatürliche „seid nicht unwissend von mir“ zu verwenden.
- source_word: ϩⲛ ⲗⲁⲁⲩ ⲛⲙⲁ
  choice: nirgends
  rationale: Die distributive Ortsangabe „an irgendeinem Ort“ steht unter der Verneinung und wird im Deutschen idiomatisch mit „nirgends“ ausgedrückt.
- source_word: ϩⲛ ⲗⲁⲁⲩ ⲛⲟⲩⲟⲉⲓϣ
  choice: zu keiner Zeit
  rationale: Die Zeitangabe bezeichnet jeden Zeitpunkt; „zu keiner Zeit“ erhält die parallele räumlich-zeitliche Struktur.
theological_decisions:
- issue: Art der geforderten Kenntnis der Sprecherin
  choice: in Unkenntnis über mich
  alternative: mich verkennen / mich nicht erkennen
  rationale: „In Unkenntnis“ lässt offen, ob bloßes Wissen, Wahrnehmen oder tiefere Erkenntnis gemeint ist, und vermeidet eine vorschnelle theologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural. Auf ein einleitendes „Und“ wird verzichtet, weil die diesem Satz zugeordnete koptische Klausel nach der Revisionsangabe keine Konjunktion am Anfang hat.
