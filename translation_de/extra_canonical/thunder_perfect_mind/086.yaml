- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: das jedem zugänglich ist
  rationale: Die Wendung beschreibt etwas Erreichbares oder Zugängliches; „jedem“ erhält den distributiven Sinn von ⲟⲩⲟⲛ ⲛⲓⲙ.
- source_word: ⲡϣⲁϫⲉ
  choice: die Rede
  rationale: „Rede“ gibt den Sinn von Wort, Äußerung oder Rede wieder und bildet einen natürlichen Gegensatz zum „Hören“.
- source_word: mutmaßliche Vorlage hinter ⲙⲁⲧϣⲉ ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: die nicht erfasst werden kann
  rationale: Die OCR-Folge ist stark beschädigt. Die textkritisch rekonstruierte Aussage bezeichnet eine Rede, die nicht ergriffen oder erfasst werden kann; die deutsche Formulierung wahrt sowohl den körperlichen als auch den geistigen Bedeutungsbereich von „erfassen“.
- source_word: ⲧⲉⲕⲱ
  choice: der Ruf
  rationale: Das Wort kann einen Ruf, Schrei oder Zuruf bezeichnen. „Ruf“ ist knapp, würdevoll und lässt sowohl Stimme als auch Aufforderung anklingen.
