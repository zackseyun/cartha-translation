- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: ihr, die ihr mich kennt
  rationale: Als parallele vokativische Anrede zu „ihr Hörenden“ aufgefasst; ⲥⲟⲟⲩⲛ bezeichnet hier das Kennen oder Wissen um die Sprecherin.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Ich bin …
  rationale: Die Formel eröffnet nach der revidierten Satzgliederung den nächsten, im Ausschnitt unvollständigen Selbstprädikationssatz. Die Auslassungspunkte zeigen den Abbruch des Segments an, ohne „der Eine/die Eine“ zu ergänzen.
