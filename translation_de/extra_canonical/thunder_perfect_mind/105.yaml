  source_fidelity: 'Die klar lesbaren Teile werden im Entwurf überwiegend zutreffend wiedergegeben: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ ist „ihr seid besiegt/unterliegt“, und ⲥⲱⲧⲙ ⲉⲣⲟⲓ, die Anrede an die ἀκροατής sowie die anschließende Anrede „ihr, die ihr mich kennt“ sind sachgerecht. Die Übersetzung „aus eurer Mitte ausgestoßen“ für ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ ist jedoch durch den vorgelegten koptischen Ausschnitt nicht abgesichert. Da die Worttrennung und Lesung an dieser Stelle unsicher sind, darf die Fußnote keine bestimmte „revidierte Lesart“ behaupten. Die in der Audit-Spur angeführte Korrektur von ⲭⲓⲥⲃⲱ zu „Unterweisung empfangen/lernen“ und von ⲉⲛⲁⲯⲩⲭⲏ zu „meine Worte“ ist plausibel, beruht gegenüber dem OCR-Excerpt aber auf einer emendierten Lesung und muss als solche kenntlich bleiben.'
  naturalness: „Ihr Hörenden“ und „ihr, die ihr mich kennt“ sind in einer poetisch-feierlichen Anrede natürlich genug. „Hört auf mich“ bedeutet im heutigen Deutsch leicht „gehorcht mir“; „Hört mich an“ gibt den Appell zum Zuhören präziser wieder. „und lernt meine Worte“ ist verständlich, aber „und lernt aus meinen Worten“ ist im Deutschen idiomatischer und wahrt die Unsicherheit der mutmaßlich emendierten Anschlussgruppe.
  terminology: Keine konfessionell aufgeladene Terminologie. Die unvollständige Selbstprädikation „Ich bin …“ ist richtig beibehalten; „die Eine“ darf nicht ergänzt werden. Der Ausdruck „aus eurer Mitte ausgestoßen“ wird entfernt, da er keine sichere textliche Grundlage hat.
