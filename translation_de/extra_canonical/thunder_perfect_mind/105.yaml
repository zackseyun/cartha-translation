translation:
  language: de
  text: '**3.** Ihr seht mich, aus eurer Mitte ausgestoßen[a],

    und ihr unterliegt.


    Hört auf mich, ihr Hörenden,

    und nehmt meine Worte an,

    ihr, die ihr mich kennt.


    Ich bin …'
