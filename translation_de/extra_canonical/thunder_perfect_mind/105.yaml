- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: Hört auf mich
  rationale: Gibt die an die Zuhörenden gerichtete Aufforderung idiomatisch und mit angemessener Eindringlichkeit wieder.
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: ihr Hörenden
  rationale: Das griechische Lehnwort ἀκροατής bedeutet „Hörer/Zuhörer“. „Hörende“ bewahrt die formelhafte, poetische Anrede.
- source_word: ⲛⲧⲉⲧⲛⲭⲓⲥⲃⲱ ⲉⲛⲁⲯⲩⲭⲏ
  choice: und nehmt meine Worte an
