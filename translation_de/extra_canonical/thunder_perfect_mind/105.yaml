    issue: Unbelegte Wiedergabe „aus eurer Mitte ausgestoßen“
    rationale: Weder die sichtbare Wortfolge noch die englische Audit-Spur belegen diese Bedeutung zuverlässig. Die vorhandene Fußnote stellt zudem fälschlich eine bestimmte „revidierte Lesart“ als Grundlage dar. An dieser beschädigt beziehungsweise unsicher segmentierten Stelle muss die Übersetzung die Unsicherheit transparent machen statt eine konkrete Ausstoßungs-Aussage zu erzeugen.
