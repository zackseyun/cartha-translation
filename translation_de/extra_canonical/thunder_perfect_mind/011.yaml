lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: Glieder
  rationale: „Glieder“ bewahrt das körperliche Bild und lässt zugleich den weiteren Sinn einzelner Teile eines Ganzen anklingen. „Körperteile“ wäre eindeutiger, aber weniger poetisch.
- source_word: ⲛⲁϣⲉ
  choice: die Unfruchtbare
  rationale: Die substantivierte feminine Form gibt die Bezeichnung einer kinderlosen beziehungsweise unfruchtbaren Frau knapp wieder und erhält den Gegensatz zu ihren vielen Kindern.
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: ihre Kinder
  rationale: Der feminine Possessivbezug wird beibehalten; „Kinder“ ist im Deutschen natürlicher und weniger eng als „Söhne“.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin
  rationale: Die wiederholte Ich-bin-Formel trägt Rhythmus und Selbstoffenbarung des Gedichts und wird deshalb unmittelbar wiedergegeben.
- source_word: ⲁⲩⲱ
  choice: Und
  rationale: Die parataktische Verbindung bleibt erhalten, ohne den paradoxen Zusammenhang erklärend zu glätten.
- source_word: genitivische Wendung für „meiner Mutter“
  choice: meiner Mutter
  rationale: Die überlieferte Zuordnung wird entsprechend der konsultierten Segmentierung als Possessivverhältnis wiedergegeben; wegen der unsicheren OCR-Ausrichtung wird sie in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Paradox zwischen Unfruchtbarkeit und zahlreichen Kindern
  choice: Der Widerspruch bleibt unaufgelöst stehen.
  alternative: Die Kinder metaphorisch oder geistlich näher bestimmen.
  rationale: Der Quellentext erklärt die Spannung nicht; eine Deutung würde eine bestimmte theologische Lesart eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die auffällige Formulierung „die Glieder meiner Mutter“ und der Gegensatz „unfruchtbar – viele Kinder“ werden nicht geglättet.
