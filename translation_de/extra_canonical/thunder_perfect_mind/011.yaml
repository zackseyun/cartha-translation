  language: de
  text: '**6.** Ich bin die Glieder meiner Mutter.[a][b]


    Und ich bin die Unfruchtbare – zahlreich sind ihre Kinder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Glieder“ kann auch mit „Körperteile“ wiedergegeben werden; die Übersetzung bewahrt das anatomische Bild und dessen weiteren poetischen Klang.
    reason: lexical_alternative
