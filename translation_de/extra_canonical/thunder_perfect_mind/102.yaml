translation:
  language: de
  text: '**18.** Ergreift euch selbst[a];



    denn euer Inneres ist euer Äußeres,



    und der, der euer Äußeres gestaltet,



    ist der, der es zum Muster gemacht hat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haltet euch selbst fest.“ Das Verb kann sowohl das Ergreifen als auch das Festhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „es zu einem τύπος gemacht hat“. τύπος kann „Abdruck“, „Prägung“, „Gestalt“ oder „Muster“ bedeuten. Das koptische Pronomen ist grammatisch maskulin und kann dem Zusammenhang nach sachlich („es“) oder persönlich („ihn“) verstanden werden.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: Ergreift euch selbst
  rationale: ⲁⲙⲁϩⲧⲉ ist hier als Imperativ „ergreifen, festhalten“ zu verstehen; ⲙⲙⲱⲧⲛ verweist auf die Angesprochenen selbst. Die Formulierung bewahrt den knappen, auffordernden Ton.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: euer Inneres
  rationale: ⲥⲁϩⲟⲩⲛ bezeichnet die Innen- oder Innenseite. Die OCR-Wiederholung von ⲡⲉⲧⲛ wird nicht als zusätzlicher Text wiedergegeben.
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: euer Äußeres
  rationale: ⲥⲁⲃⲟⲗ bezeichnet die Außen- oder Außenseite und bildet den beabsichtigten Gegensatz zu ⲥⲁϩⲟⲩⲛ.
- source_word: ⲡⲉⲧⲣⲡⲗⲁⲥⲥⲉ
  choice: der, der … gestaltet
  rationale: Das griechische Lehnverb πλάσσειν bezeichnet das Formen oder Gestalten, besonders im Bild handwerklicher Formgebung.
- source_word: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: es geprägt hat
  rationale: τύπος umfasst Abdruck, Prägung, Gestalt und Muster. „Geprägt“ hält das Bild eines hervorgebrachten Abdrucks fest und passt idiomatisch zum vorausgehenden Gestalten, ohne die Stelle ausdrücklich typologisch auszudeuten.
theological_decisions:
- issue: Identität von Innerem und Äußerem
  choice: „euer Inneres ist euer Äußeres“ bleibt als direkte Gleichsetzung stehen
  alternative: eine erklärende Wiedergabe wie „euer Inneres zeigt sich in eurem Äußeren“
  rationale: Der koptische Nominalsatz formuliert eine spannungsvolle Identitätsaussage. Eine erklärende Umschreibung würde die genuine Mehrdeutigkeit und den paradoxen Charakter abschwächen.
- issue: Bedeutung von τύπος im Schlusssatz
  choice: „geprägt“
  alternative: „zum Muster gemacht“ oder „geformt“
  rationale: Die Übersetzung wahrt die Bildwelt von Abdruck und Formung, ohne eine bestimmte Lehre vom Urbild, Siegel oder Abbild in den Text einzutragen.
translation_notes:
  register: Kurze, rhythmische Zeilen und ein würdevoller, gegenwärtiger Sprachgebrauch bewahren den spruchhaften Charakter. Die paradoxe Gegenüberstellung von Innerem und Äußerem wird nicht geglättet; Fachsprache und konfessionelle Deutung werden vermieden.
