base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: de
  text: 'Ich bin die Verbindung[a] und die Auflösung;

    ich bin das Bleiben[b],

    und ich bin die Auflösung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann auch mit „Vereinigung“ oder „Zusammenfügung“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Wohnstätte“, „der Aufenthalt“ oder „die Ruhe“. Das zugrunde liegende monē lässt sowohl einen Vorgang beziehungsweise Zustand als auch einen Aufenthaltsort anklingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: die Verbindung
  rationale: Das koptische Substantiv bezeichnet ein Verbinden oder Zusammenfügen. „Verbindung“ bewahrt den Gegensatz zur folgenden Auflösung, ohne eine besondere metaphysische „Einheit“ vorauszusetzen.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: die Auflösung
  rationale: Die Verbindung aus ⲕⲱⲗ und ⲉⲃⲟⲗ bezeichnet ein Lösen beziehungsweise Auflösen. Die substantivische Wiedergabe entspricht der identifizierenden Formel „Ich bin …“.
- source_word: ⲧⲙⲟⲛⲏ
  choice: das Bleiben
  rationale: Das aus dem Griechischen entlehnte monē kann Bleiben, Aufenthalt, Wohnstätte oder Ruhe bezeichnen. „Das Bleiben“ erhält hier den abstrakten Gegensatz zur „Auflösung“ und vermeidet eine unnötige räumliche Festlegung.
- source_word: ⲡⲕⲱⲗ
  choice: die Auflösung
  rationale: In diesem Zusammenhang bezeichnet ⲕⲱⲗ das Lösen beziehungsweise die Auflösung und nimmt die vorangehende Form ⲡⲕⲱⲗⲉⲃⲟⲗ verkürzt wieder auf.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Der schlichte Anschluss bewahrt die parataktische Reihung des koptischen Textes.
theological_decisions:
- issue: Verhältnis von Verbindung, Bleiben und Auflösung
  choice: Die gegensätzlichen Selbstbezeichnungen bleiben unaufgelöst nebeneinander stehen.
  alternative: Die Ausdrücke als Stationen eines kosmologischen Vorgangs erklären.
  rationale: Der Quellentext formuliert ein bewusstes Paradox, liefert hier aber keine Deutung, die eine bestimmte metaphysische oder konfessionelle Auslegung rechtfertigen würde.
translation_notes:
  register: Kurze, feierliche Ich-bin-Sätze in modernem Standarddeutsch. Die Wiederholung von „Auflösung“ und die Spannung zwischen Verbindung, Bleiben und Auflösung werden bewusst beibehalten. Das abschließende ⲁⲛⲟⲕ des OCR-Ausschnitts wird als Beginn des nächsten Satzes behandelt und daher nicht in dieses Segment aufgenommen.
