base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
translation:
  language: de
  text: 'Ich bin die Hebamme

    und die, die nicht gebiert.

    Ich bin der Trost in meinen Geburtswehen.[a]

    Ich bin die Braut und der Bräutigam.[b]

    Ich bin die Mutter meines Vaters

    und die Schwester meines Mannes.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich bin der Trost meiner Geburtswehen.“'
    reason: Die Beziehung zwischen „Trost“ und „Geburtswehen“ kann im Deutschen als Genitivverbindung oder als Trost mitten in den Wehen ausgedrückt werden.
  - marker: b
    text: Der vorliegende OCR-Auszug ist an dieser Stelle unsicher und zeigt unmittelbar nach „Braut“ ein Wortbild, das wie „Mutter“ aussieht. Die zusammenhängende, textkritisch geprüfte Lesart lautet jedoch „Braut und Bräutigam“.
    reason: Die Abweichung zwischen dem verrauschten OCR-Auszug und der kollationierten Lesart soll sichtbar bleiben.
  - marker: c
    text: Der letzte Satz reicht im vorliegenden OCR-Auszug über dessen abgebrochenes Ende hinaus; seine Fassung folgt der geprüften fortlaufenden Lesart.
    reason: Der Ausschnitt endet nach dem Beginn von „Ich bin die Mutter von …“ und ist deshalb für den vollständigen Satz allein nicht ausreichend.
lexical_decisions:
- source_word: ⲧⲙⲉⲥⲓⲱ
  choice: die Hebamme
  rationale: Das feminine Substantiv bezeichnet hier nach der jüngsten Quellenprüfung die Hebamme; diese Deutung bildet zusammen mit der folgenden Aussage, nicht zu gebären, den beabsichtigten Gegensatz.
- source_word: ⲙⲁⲥⲙⲓⲥⲉ
  choice: die nicht gebiert
  rationale: Die Form wird als verneinte Aussage über das Gebären verstanden. Die knappe deutsche Form bewahrt den paradoxen Gegensatz zur Hebamme.
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: der Trost
  rationale: Das maskulin markierte Substantiv bezeichnet Trost beziehungsweise Linderung; „Trost“ gibt die Aussage würdig und verständlich wieder.
- source_word: ⲛⲛⲁⲛⲁⲁⲕⲉ
  choice: in meinen Geburtswehen
  rationale: Der Ausdruck bezieht sich auf die eigenen Wehen beziehungsweise Geburtsschmerzen. „In meinen Geburtswehen“ klingt im Deutschen natürlicher als die wörtlich mögliche Genitivverbindung und lässt Trost als Erfahrung innerhalb der Schmerzen verstehen.
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: die Braut
  rationale: Das feminine Substantiv bedeutet „Braut“ und gehört zu einer Reihe bewusst spannungsvoller Ich-Aussagen.
- source_word: ⲁⲛⲟⲕ
  choice: Ich bin
  rationale: Das wiederholte selbstidentifizierende „Ich bin“ prägt Rhythmus und Aussagekraft des Textes und wird daher ausdrücklich beibehalten.
theological_decisions:
- issue: Paradoxe Verbindung weiblicher und männlicher sowie familiär gegensätzlicher Rollen
  choice: Die Gegensätze werden ohne Harmonisierung oder allegorische Erklärung wiedergegeben.
  alternative: Die Rollen als bloße Metaphern erläutern oder ihre Spannung sprachlich abschwächen.
  rationale: Der Text gestaltet seine Rede bewusst als Folge paradoxer Selbstbezeichnungen. Eine dogmatische Auflösung würde mehr festlegen, als die Quelle selbst sagt.
- issue: Bräutigam und Ehemann trotz unsicherer OCR-Zeilen
  choice: „Bräutigam“ und „Mann“ folgen der textkritisch geprüften zusammenhängenden Lesart.
  alternative: Den sichtbaren OCR-Auszug mechanisch als „Braut und Mutter“ sowie „Schwester und Frau“ wiedergeben.
  rationale: Der bereitgestellte OCR-Auszug ist verrauscht und offenbar stellenweise fehlausgerichtet; die jüngste Kollation identifiziert hier die bekannte Abfolge „Braut und Bräutigam“ sowie „Schwester meines Mannes“. Die Unsicherheit wird in Fußnoten offengelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen, rhythmischen Zeilen. Die Wiederholung „Ich bin“ und die unaufgelösten Paradoxien bleiben als zentrale Stilmerkmale erhalten. „Gebiert“ ist gehoben, aber allgemein verständlich und entspricht dem feierlichen Ton.
