translation:
  language: de
  text: '**9.** Der Ruf meines Namens – das bin ich.


    Ich bin der Aufschrei, und ich bin das Hören.


    Ihr hört mich in eurem Ruf nach mir; ihr ruft mich mit einem p…, den ihr hervorbringt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Satzende ist am Seitenübergang beschädigt. Erhalten ist „ϩⲛ ⲟⲩⲡ…“, gefolgt von „ⲉⲧⲉⲧⲛⲧⲁⲩⲟ“ („den ihr hervorbringt“). Die Ergänzung zu einem Wort für „Ruf“, „Laut“ oder „Stimme“ ist möglich, aber unsicher.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲱϣ(ⲥ) ⲙ̄ⲡⲁⲣⲁⲛ
  choice: der Ruf meines Namens
  rationale: ⲱϣ bezeichnet das Rufen oder Ausrufen; die Form ist hier substantiviert. „Ruf“ bewahrt sowohl den Klangbezug als auch die mögliche Bedeutung des Anrufens, ohne auf das allgemeinere „Laut“ auszuweichen.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: ich bin es
  rationale: Die emphatische Kopula wird idiomatisch wiedergegeben. Das feminine ⲧⲉ stimmt mit der weiblichen Sprechergestalt überein; im Deutschen lässt sich dieses Genus an dieser Stelle nicht entsprechend markieren.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: der Aufschrei
  rationale: Die Form gehört zu ⲁϣⲕⲁⲕ, „aufschreien, laut rufen“, nicht zu einem Wort für moralische oder rituelle Reinheit. „Aufschrei“ gibt die substantivierte Handlung prägnant wieder.
- source_word: ⲥⲱⲧⲙ̄
  choice: das Hören
  rationale: Der Infinitiv von „hören“ steht in der parallelen nominalen Aussage. „Das Hören“ erhält die bewusst spannungsvolle Gleichsetzung der Sprecherin sowohl mit dem Rufen als auch mit dem Hören.
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: ihr hört mich
  rationale: Direkte Wiedergabe der Anrede in der zweiten Person Plural und des Verbs „hören“.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: mich rufen
  rationale: ⲙⲟⲩⲧⲉ kann „rufen“ oder „nennen“ bedeuten. „Rufen“ passt zum wiederkehrenden Rufmotiv, ohne die Namensbedeutung des Verbs auszuschließen.
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: mit einem Ruf, den ihr hervorbringt
  rationale: Das Satzende ist in der vorliegenden OCR am Seitenübergang beschädigt. „Ruf“ folgt der naheliegenden, aber unsicheren Ergänzung eines mit ⲡ- beginnenden Laut- oder Rufwortes; ⲧⲁⲩⲟ wird als „hervorbringen“ wiedergegeben.
