translation:
  language: de
  text: '**5.** Warum hasst ihr meine Furcht und verflucht meinen Stolz?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für dieses Segment angegebene OCR-Ausschnitt ist offenbar falsch zugeordnet und gehört zu einer späteren Passage. Die dem Abschnitt auf Seite 15, Zeilen 28–30 entsprechende koptische Lesung lautet: ⲉⲧⲃⲉ ⲟⲩ ⲧⲉⲧⲛⲙⲉⲥⲧⲉ ⲧⲁϩⲟⲧⲉ ⲁⲩⲱ ⲧⲉⲧⲛⲥⲁϩⲟⲩ ⲙⲡⲁϣⲟⲩϣⲟⲩ. Danach wurde hier übersetzt.'
    reason: textual_alignment
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Warum
  rationale: Die feste koptische Frageformel bedeutet „weshalb/warum“ und leitet hier eine direkte rhetorische Frage ein.
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: hasst ihr
  rationale: Die Verbform spricht ausdrücklich eine Mehrzahl an; modernes „ihr“ bewahrt diese Anrede.
- source_word: ⲧⲁϩⲟⲧⲉ
  choice: meine Furcht
  rationale: Die wörtliche Wiedergabe bewahrt die mögliche Spannung zwischen der Furcht der Sprecherin und der Furcht, die sie hervorruft.
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: verflucht
  rationale: Das Verb bezeichnet das Aussprechen eines Fluches; „verfluchen“ ist im Deutschen direkt und würdevoll.
- source_word: ⲡⲁϣⲟⲩϣⲟⲩ
  choice: meinen Stolz
  rationale: Das Substantiv kann Stolz, Ruhm oder Sich-Rühmen bezeichnen. „Stolz“ erhält die pointierte Gegenüberstellung mit „Furcht“, ohne die Aussage konfessionell auszudeuten.
theological_decisions:
- issue: Bedeutung von „meine Furcht“
  choice: Die mehrdeutige Genitivverbindung bleibt wörtlich stehen.
  alternative: „die Furcht vor mir“ oder „meine Ehrfurcht“
  rationale: Der koptische Ausdruck entscheidet nicht eindeutig, ob die Sprecherin selbst Furcht empfindet oder Furcht hervorruft. Eine erklärende Auflösung würde die poetische und theologische Spannung beseitigen.
- issue: Wertungsgehalt von ⲡⲁϣⲟⲩϣⲟⲩ
  choice: „meinen Stolz“
  alternative: „meinen Ruhm“ oder „mein Rühmen“
  rationale: „Stolz“ entspricht dem unmittelbaren Sinn und der konsultierten Fassung; die Übersetzung legt nicht fest, ob dieser Stolz positiv, paradox oder anstößig gemeint ist.
translation_notes:
  register: Moderne, klare und zugleich feierliche Standardsprache. Die direkte Anrede im Plural und der parallele Satzbau des koptischen Textes bleiben erhalten. Die nicht eindeutig auflösbaren Ausdrücke „meine Furcht“ und „mein Stolz“ werden bewusst nicht paraphrasiert.
