base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/091.yaml
  text: 'I am the one beneath the earth[b][a],

    and they ascend to me from the lower part of the earth.'
translation:
  language: de
  text: '… die Oberfläche der Erde,

    und man wirft sie von der Oberfläche der Erde fort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der koptische Ausschnitt beginnt mitten im Satz; der vorausgehende Satzteil ist hier nicht erhalten. Sicher lesbar sind „die Oberfläche der Erde“ und anschließend eine Aussage darüber, dass „sie“ von dieser Oberfläche fortgeworfen wird. Die vorgeschlagene englische Fassung „beneath the earth … they ascend to me“ entspricht den vorliegenden koptischen Formen nicht.
    reason: textual_alignment_note
lexical_decisions:
- source_word: ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: die Oberfläche der Erde
  rationale: ⲡϩⲟ bedeutet hier wörtlich „Gesicht“ bzw. „Oberfläche“, und ⲙⲡⲕⲁϩ heißt „der Erde“. Im vorliegenden Zusammenhang bezeichnet die Wendung nicht einen Ort unter der Erde.
- source_word: ⲉⲧⲛⲟⲩϫⲉ
  choice: man wirft … fort
  rationale: ⲛⲟⲩϫⲉ bezeichnet das Werfen oder Fortwerfen. Die unpersönliche deutsche Form gibt die nicht näher bezeichneten Handelnden natürlich wieder; „emporsteigen“ ist durch dieses Verb nicht gestützt.
- source_word: ⲙⲙⲟⲥ
  choice: sie
  rationale: Das pronominale Suffix der 3. Person Singular Femininum bezeichnet „sie“. Für „mich/zu mir“ wäre eine andere Pronominalform zu erwarten.
- source_word: ⲉⲃⲟⲗ ϩⲓϫⲙ
  choice: von … fort
  rationale: Die Verbindung drückt eine Bewegung weg von einer Oberfläche aus und wird im Deutschen idiomatisch mit „von … fort“ wiedergegeben.
theological_decisions:
- issue: Vom englischen Beratungstext vorausgesetzte Unterwelts- oder Aufstiegsaussage
  choice: Keine Aussage über einen Ort unter der Erde oder ein Emporsteigen aufgenommen
  alternative: „Ich bin die unter der Erde, und sie steigen zu mir empor“
  rationale: Der erhaltene koptische Ausschnitt enthält ⲡϩⲟ „Oberfläche/Gesicht“, ⲛⲟⲩϫⲉ „werfen“ und das feminine Objektpronomen ⲙⲙⲟⲥ „sie“. Er trägt die alternative Deutung daher nicht. Eine solche Fassung würde zudem eine kosmologische Vorstellung einführen, die in diesem Ausschnitt nicht ausdrücklich belegt ist.
translation_notes:
  register: Fragmentarische, aber würdige Wiedergabe in modernem Standarddeutsch. Die Auslassungspunkte machen den fehlenden Satzanfang sichtbar. Das feminine Pronomen bleibt erhalten, ohne seine nicht mehr sichtbare Bezugsgröße zu ergänzen.
