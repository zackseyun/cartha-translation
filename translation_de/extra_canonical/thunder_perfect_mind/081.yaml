lexical_decisions:
- source_word: ⲁⲙⲡⲉ (in ⲛⲁⲙⲡⲉ)
  choice: Substanz
  rationale: Das Wort kann Besitz, Vermögen oder Mittel bezeichnen und hier zugleich einen abstrakten Sinn wie Wesenhaftigkeit tragen. „Substanz“ bewahrt diese ontologische Offenheit und die zugespitzte Antithese.
- source_word: ⲁⲧⲁⲙⲡⲉ (wahrscheinlich; ⲁⲧ- + ⲁⲙⲡⲉ)
  choice: die Substanzlose
  rationale: Die substantivierte Form gibt das privative Gegenstück knapp wieder und erhält die paradoxe Selbstbezeichnung. Die feminine Form entspricht der weiblichen Sprecherstimme; wegen des unsicheren OCR-Befunds werden sachlich mögliche Alternativen in der Fußnote genannt.
theological_decisions:
- issue: Ontologische oder besitzbezogene Deutung des Gegensatzes
  choice: Die Mehrdeutigkeit wird im Haupttext mit „Substanz / Substanzlose“ bewahrt.
  alternative: „Besitz / Besitzlose“ oder „Vermögen / Mittellose“
  rationale: Der Kontext der paradoxen Ich-Aussagen legt eine ontologische Lesart nahe, während der koptische Ausdruck auch Besitz oder Mittel bezeichnen kann. Eine eindeutige Festlegung würde die Spannung des Ausgangstextes vorschnell auflösen.
translation_notes:
  register: Knapp, würdevoll und paradox. „Die Substanzlose“ ist im heutigen Deutsch ungewöhnlich, aber verständlich und bildet die formale Gegenüberstellung des mutmaßlichen koptischen Textes deutlicher ab als eine umschreibende Wendung.
