translation:
  language: de
  text: '**15.** Ich bin unter euch, die ihr [...] euch aus dem [...] heraus[a]. Wer ist es, der euch freilassen wird? Oder wenn er euch daraus freilässt,[b] wer wird [...] können?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satz ist an zwei Stellen beschädigt. Erhalten ist sinngemäß: „die ihr [...] euch aus dem [...] heraus“; das Prädikat und das Bezugswort nach „aus dem“ fehlen.'
    reason: textual_gap
  - marker: b
    text: 'Wörtlich steht ein maskuliner Rückverweis: „wenn er euch aus ihm/daraus freilässt“. Wer „er“ ist und worauf sich der Rückverweis bezieht, bleibt wegen der Textlücke offen.'
    reason: referential_ambiguity
  - marker: c
    text: Nach „wer wird ... können“ bricht der vorliegende Ausschnitt ab; die fehlende Handlung wird nicht ergänzt.
    reason: textual_gap
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: Ich bin unter euch
  rationale: Die Wendung bezeichnet das Sein beziehungsweise Sich-Aufhalten inmitten der Angeredeten; „unter euch“ ist im Deutschen natürlich und wahrt den räumlich-relationalen Sinn.
- source_word: ⲧⲏⲛⲉ
  choice: euch
  rationale: Hier liegt das koptische Objektpronomen der 2. Person Plural vor, nicht ein Substantiv mit der Bedeutung „Brot“.
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: euch freilassen
  rationale: ⲕⲁ mit ⲉⲃⲟⲗ bildet hier die Bedeutung „loslassen/freilassen“; „freilassen“ passt sowohl zur Person als Objekt als auch zur anschließenden Herkunftsangabe.
- source_word: ⲛϩⲏⲧϥ
  choice: daraus
  rationale: Die Präposition mit maskulinem Singularsuffix verweist auf etwas zuvor Genanntes, dessen Bezeichnung in der Textlücke verloren ist. „Daraus“ erhält den Rückverweis, ohne das fehlende Bezugswort zu ergänzen.
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ
  choice: wer wird [...] können?
  rationale: ⲛⲓⲙ ⲡⲉⲧ- leitet eine Frage „Wer ist es, der ...?“ ein; ⲛⲁϣ- trägt hier den Sinn des Könnens, doch das folgende Verb ist im Ausschnitt abgebrochen.
theological_decisions:
- issue: Identität des Freilassenden
  choice: „er“ ohne nähere Bestimmung
  alternative: eine ergänzte göttliche, rettende oder menschliche Gestalt
  rationale: Die maskuline Verbform erlaubt „er“, doch der erhaltene Ausschnitt identifiziert die Person nicht. Eine theologische Zuordnung wäre spekulativ.
- issue: Bezug von „daraus“
  choice: offener Rückverweis auf das verlorene Bezugswort
  alternative: eine konkrete Deutung wie Welt, Leib, Gefängnis oder Ort
  rationale: Das Bezugswort steht offenbar in einer Lücke. Die Übersetzung bewahrt deshalb die inhaltliche Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorischen Fragen bleiben knapp und direkt. Sichtbare Lücken werden nicht geglättet; insbesondere werden weder ein Mühlenszenario noch Brot- oder Teigbildlichkeit in den Text eingetragen, da ⲧⲏⲛⲉ hier als Pronomen zu analysieren ist.
