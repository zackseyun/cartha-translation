base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: de
  text: 'und die, die unter den Barbaren kein Ebenbild hat.[a]


    Ich bin die, die sie an jedem Ort gehasst haben,


    und die, die sie an jedem Ort geliebt haben.[b]


    Ich bin die, die sie »der Tod« nennen,


    und ich bin die, die sie »das Gesetz« nennen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kein Bild« beziehungsweise »nichts ihresgleichen«. Der Ausdruck ⲉⲓⲛⲉ kann ein Bild, ein Abbild oder eine Ähnlichkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht in beiden Zeilen »an jedem Ort«; sinngemäß ist auch »überall« möglich.
    reason: translation_clarity
  - marker: c
    text: Das aus dem Griechischen entlehnte Wort ⲛⲟⲙⲟⲥ kann neben »Gesetz« auch »Norm« oder »Brauch« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ
  choice: die … kein Ebenbild hat
  rationale: Die Konstruktion verneint das Vorhandensein eines ⲉⲓⲛⲉ, also eines Bildes, Abbildes oder einer Entsprechung. »Ebenbild« bewahrt sowohl den Bild- als auch den Vergleichsaspekt.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: unter den Barbaren
  rationale: Das griechische Lehnwort bezeichnet Barbaren beziehungsweise Nichtgriechen. Die traditionelle Wiedergabe wahrt die kulturelle Spannung des Ausdrucks, ohne ihn zu verharmlosen.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin die
  rationale: Die feminine Kopula wird ausdrücklich wiedergegeben und der wiederkehrende Rhythmus der Selbstaussagen bleibt erhalten.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: die sie … gehasst haben / die sie … geliebt haben
  rationale: Die aktiven Formulierungen erhalten den scharfen Gegensatz von Hass und Liebe und geben die perfektische Vergangenheitsform wieder.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: an jedem Ort
  rationale: ⲙⲁ ⲛⲓⲙ bedeutet regulär »jeder Ort«. Die Wiederholung wird in beiden parallelen Zeilen bewahrt; »überall« wäre möglich, würde die formale Entsprechung aber etwas glätten.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ / ϣⲁⲩⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: die sie … nennen
  rationale: ⲙⲟⲩⲧⲉ bezeichnet das Nennen oder Benennen. Das Präfix ϣⲁ- ist hier habitual beziehungsweise aoristisch, nicht futurisch; daher steht das deutsche Präsens.
- source_word: ⲡⲙⲟⲩ
  choice: der Tod
  rationale: Der bestimmte Artikel wird bewahrt; die Bezeichnung bleibt als zugeschriebener Name in Anführungszeichen stehen.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: das Gesetz
  rationale: Das griechische Lehnwort νόμος kann Gesetz, Norm oder Brauch bedeuten. »Das Gesetz« ist im Gegensatz zu »der Tod« die unmittelbarste Wiedergabe, ohne eine bestimmte theologische Deutung festzulegen.
theological_decisions:
- issue: Personifizierung von Tod und Gesetz
  choice: »der Tod« und »das Gesetz« als Benennungen in Anführungszeichen
  alternative: Großschreibung als Eigennamen ohne Anführungszeichen
  rationale: Der Text sagt, dass andere die Sprecherin so nennen. Anführungszeichen stellen diese Zuschreibung dar, ohne zu entscheiden, ob Tod und Gesetz hier als metaphysische Mächte, Titel oder polemische Etiketten verstanden werden.
- issue: Bedeutungsumfang von νόμος
  choice: das Gesetz
  alternative: die Norm / der Brauch
  rationale: Die geläufigste rechtlich-religiöse Bedeutung bleibt erhalten; eine speziell jüdische, griechisch-philosophische oder gnostische Auslegung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem Parallelismus. Die feminine Selbstbezeichnung »Ich bin die« folgt der koptischen Grammatik und dem poetischen Refrain. Der eröffnende Anschluss mit »und« bleibt erhalten, weil der Ausschnitt mitten in einer fortlaufenden Rede einsetzt.
