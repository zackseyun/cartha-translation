  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
translation:
  language: de
  text: '**6.** Schaut hinaus auf die Erde, und ihr werdet mich unter denen finden, die kommen.[a] Doch schaut nicht auf den Misthaufen aus Kot.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die koptische Form ⲉⲧⲛⲏⲟⲩ bedeutet hier wahrscheinlich „die kommen“ oder „die unterwegs sind“. Die gelegentlich vorgeschlagene Wiedergabe „die sehen“ beruht auf einer anderen Wortbestimmung.
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck verbindet ein griechisches Lehnwort für einen Mist- oder Dunghaufen mit dem koptischen Wort für Kot oder Unrat. Die ungewöhnliche Doppelung gehört zum Bild des Ausgangstextes.
    reason: cultural_note
  - marker: c
    text: Der zugeordnete Vergleichstext lautet „Ich bin ohne Scham; ich schäme mich“. Er stimmt jedoch nicht mit diesem koptischen Ausschnitt überein; wahrscheinlich ist die automatische Abschnittszuordnung verrutscht.
    reason: alignment_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ (wohl ⲛⲁⲩ ⲉⲃⲟⲗ)
  choice: Schaut hinaus
  rationale: Die OCR-Form lässt sich am plausibelsten als ⲛⲁⲩ ⲉⲃⲟⲗ verstehen, eine Aufforderung zum Hinausschauen. Der folgende Plural in ⲧⲉⲧⲛⲁϭⲓⲛⲉ bestimmt im Deutschen die Anrede im Plural.
- source_word: ϩⲓ ⲡⲕⲁϩ
  choice: auf die Erde
  rationale: ϩⲓ bezeichnet hier die räumliche Ausrichtung, während ⲕⲁϩ sowohl Erde als auch Boden oder Land bedeuten kann. „Erde“ wahrt die mögliche kosmische Weite.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: ihr werdet mich … finden
  rationale: Die Form ist ein Futur der zweiten Person Plural mit einem Objektpronomen der ersten Person Singular.
- source_word: ϩⲛ ⲛⲉⲧⲛⲏⲟⲩ
  choice: unter denen …, die kommen
  rationale: ⲛⲏⲟⲩ ist hier am besten als qualitative Form des Verbs „kommen“ zu bestimmen; ϩⲛ hat bei einer Personengruppe den Sinn „unter/bei“.
- source_word: ⲙⲡⲣⲛⲁⲩ
  choice: schaut nicht
  rationale: ⲙⲡⲣ- mit Infinitiv bildet ein Verbot. Die deutsche Pluralform folgt dem Anredekontext.
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  choice: auf den Misthaufen aus Kot
  rationale: Das griechische Lehnwort κοπρία bezeichnet einen Mist- oder Dunghaufen, während ⲕⲱⲕ Kot oder Unrat bezeichnet. Die auffällige Doppelung wird nicht geglättet.
theological_decisions:
- issue: Identität der Gruppe ⲛⲉⲧⲛⲏⲟⲩ
  choice: denen, die kommen
  alternative: den Sehenden / denen, die sehen
  rationale: Die Lesart „kommen“ entspricht der koptischen Form ⲛⲏⲟⲩ; „sehen“ wäre gewöhnlich mit ⲛⲁⲩ ausgedrückt. Eine symbolische oder theologische Identifikation der Kommenden wird vermieden.
translation_notes:
  register: Würdevolle, unmittelbar verständliche Pluralanrede. Die imperativische Rahmung und die derbe, absichtlich redundante Schlussmetapher bleiben erhalten; archaische Wörter wie „Dunghügel“ werden vermieden.
