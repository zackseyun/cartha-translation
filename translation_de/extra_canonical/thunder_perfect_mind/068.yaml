base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
translation:
  language: de
  text: '**5.** Ihr verachtet mich also unter den Kleinen[a]. Ich bin der Nous[b] und meine Ruhe[c]. Ihr seid die Erkenntnis meiner Art[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Kleinen“ kann hier auch die Jungen oder Kinder beziehungsweise Menschen in Niedrigkeit bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Geist“, „der Verstand“ oder „der Intellekt“. Das koptische ⲡⲛⲟⲩⲥ ist ein Lehnwort aus dem Griechischen νοῦς.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht „meine Ruhe“. Die mit „und“ verbundene Prädikatsfolge ist auffällig und wird wegen der unsicheren OCR-Überlieferung nicht zu „die Ruhe“ geglättet.
    reason: textual_uncertainty
  - marker: d
    text: Die zugrunde liegende OCR ist hier stark entstellt. Die Übersetzung folgt der textkritischen Rekonstruktion „Ihr seid die Erkenntnis meiner Art“; „Art“ kann auch Herkunft, Geschlecht oder Wesensart bedeuten.
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲧⲱⲃⲡ … ⲙⲙⲟⲓ (im OCR entstellt)
  choice: Ihr verachtet mich
  rationale: Die anhand des bekannten Textzusammenhangs rekonstruierte koptische Verbform ist eine Aussage in der 2. Person Plural, keine Aufforderung und keine ausdrücklich markierte Frage.
- source_word: ⲛⲛⲉⲧⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ (rekonstruiert)
  choice: unter den Kleinen
  rationale: Gibt die gemeinte Personengruppe natürlich wieder, ohne die mögliche Bedeutung Kindheit oder Jugend im Haupttext festzulegen.
- source_word: ⲡⲛⲟⲩⲥ
  choice: der Geist
  rationale: Das griechische Lehnwort νοῦς bezeichnet das denkende oder erkennende Vermögen. „Geist“ ist im Deutschen würdig und verständlich; die genaueren Alternativen stehen in der Fußnote.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: meine Ruhe
  rationale: Die Form enthält das Possessivpräfix der 1. Person Singular und das griechische Lehnwort ἀνάπαυσις. Die auffällige Syntax wird nicht stillschweigend geglättet.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: die Erkenntnis
  rationale: „Erkenntnis“ bewahrt hier den gehobenen, erkenntnisbezogenen Sinn besser als das nüchternere „Wissen“.
- source_word: ⲙⲡⲁⲅⲉⲛⲟⲥ (nach textkritischer Rekonstruktion)
  choice: meiner Art
  rationale: Die Rekonstruktion als griechisches γένος entspricht dem bekannten Wortlaut dieser Passage; „Art“ lässt Herkunft, Zugehörigkeit und Wesensart offen.
theological_decisions:
- issue: Identität der Sprecherin mit νοῦς
  choice: „Ich bin der Geist“ als direkte Identitätsaussage
  alternative: „Ich bin der Intellekt“ oder „Ich bin der Nous“
  rationale: Die Aussage wird nicht metaphysisch erklärt oder konfessionell eingeordnet; die philosophische Spannweite des Begriffs wird in der Fußnote offengehalten.
- issue: Beziehung zwischen Sprecherin, Ruhe und Angeredeten
  choice: Die drei Aussagen bleiben in ihrer überlieferten, spannungsvollen Form nebeneinander stehen.
  alternative: Die Syntax zu „Ich bin der Geist und die Ruhe“ oder zu einer anderen eindeutigen Beziehung glätten.
  rationale: Wegen der beschädigten beziehungsweise fehlerhaften OCR-Grundlage wäre eine solche Glättung textkritisch und theologisch übergriffig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, rhythmischen Ich- und Ihr-Aussagen. Die ungewöhnliche Formulierung „und meine Ruhe“ bleibt bewusst stehen, da der Ausgangstext beziehungsweise seine OCR-Wiedergabe unsicher ist und keine eindeutige syntaktische Glättung rechtfertigt.
