base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: de
  text: 'Warum liebt ihr mich, ihr, die ihr mich hasst, und hasst die, die mich lieben?[a]


    Ihr, die ihr mich verleugnet: Bekennt mich![b]


    Und ihr, die ihr mich bekennt: Verleugnet mich!


    Ihr, die ihr sagt—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das unmittelbar vorausgehende ⲡⲁⲣⲁⲛ gehört wahrscheinlich noch zur vorherigen Zeile und wird wegen der unsicheren Abgrenzung hier nicht übersetzt. ⲉⲧⲃⲉ ⲟⲩ bedeutet zusammen „warum?“; ⲙⲉ bedeutet hier „lieben“.
    reason: alignment_note
  - marker: b
    text: Das griechische Lehnverb ϩⲟⲙⲟⲗⲟⲅⲉⲓ kann auch „anerkennen“ oder „bekennen“ bedeuten. Die Formulierung „Bekennt mich!“ bewahrt das im Koptischen ausgedrückte direkte Objekt „mich“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Warum
  rationale: Die feste Verbindung ⲉⲧⲃⲉ ⲟⲩ ist eine kausale Frage („warum?“), nicht bloß eine Themenangabe.
- source_word: ⲙⲟⲥⲧⲉ
  choice: hassen
  rationale: Die schlichte, starke Grundbedeutung wird ohne zusätzliche Färbung wiedergegeben.
- source_word: ⲙⲉ
  choice: lieben
  rationale: Hier bedeutet ⲙⲉ „lieben“; eine Wiedergabe mit „kennen“ wäre lexikalisch unzutreffend.
- source_word: ⲁⲣⲛⲁ
  choice: verleugnen
  rationale: „Verleugnen“ bewahrt den persönlichen Bezug des Verbs; „ablehnen“ oder „sich lossagen von“ wären mögliche, aber weniger direkte Alternativen.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: sich zu mir bekennen
  rationale: Die idiomatische deutsche Wendung gibt das auf eine Person bezogene griechische Lehnverb prägnant wieder; „mich anerkennen“ wäre neutraler.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Der einfache Anschluss bewahrt den additiven, antithetischen Rhythmus.
- source_word: ⲛⲉⲧϫⲉ
  choice: ihr, die ihr sagt
  rationale: Die Relativform wird im Zusammenhang als Anrede verstanden; der Gedankenstrich bewahrt den am Ausschnittende abgebrochenen Satz.
theological_decisions:
- issue: Bekenntnis und Verleugnung als paradoxe Aufforderungen
  choice: 'Die Formen werden als Imperative in direkter Anrede wiedergegeben: „Bekennt euch zu mir!“ und „Verleugnet mich!“'
  alternative: 'Indikativisch: „Die mich verleugnen, bekennen mich; und die mich bekennen, verleugnen mich.“'
  rationale: Das Präfix ⲉⲣ-/ⲣ̄ vor dem griechischen Lehnverb und vor ⲁⲣⲛⲁ stützt hier die imperative Lesart. Dadurch bleibt die absichtliche theologische und rhetorische Spannung stehen, statt als allgemeine Feststellung geglättet zu werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusstem Parallelismus. Die wiederholte direkte Anrede und die paradoxen Imperative bleiben erhalten. Der Gedankenstrich am Ende kennzeichnet den im vorliegenden Ausschnitt unvollständigen Satz.
