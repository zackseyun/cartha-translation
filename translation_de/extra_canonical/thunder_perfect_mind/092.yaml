  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: de
  text: '**8.** Ich bin die Vorbereitung jedes Menschen[a] – mein Geist im Innern.[b]


    Ich bin die Aussprache meines Namens.[c]


    Ich bin der Schrei, der hinausdringt,[d]


    und ich bin die, die hört.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Bereitstellung“ oder „Ausrüstung“. Das koptische ⲧⲥⲟⲃⲧⲉ bedeutet nicht eindeutig „Verständnis“.'
    reason: lexical_alternative
  - marker: b
    text: Der knappe Ausdruck lässt die genaue syntaktische Verbindung von „mein Geist“ und „im Innern“ offen. Auch „mein Denken im Innern“ ist möglich.
    reason: textual_ambiguity
  - marker: c
    text: 'Auch: „die Gliederung“ oder „die Artikulation meines Namens“. „Aussprache“ ist eine kontextuelle Deutung; die ältere Wiedergabe „Kenntnis meines Namens“ ist lexikalisch weniger gut gesichert.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „der Ruf, der hinausgeht“. ⲧⲁϣⲕⲁⲕ bezeichnet einen Schrei oder lauten Ruf; ⲉⲃⲟⲗ gibt die Bewegung nach außen an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: Vorbereitung
  rationale: Das koptische Substantiv bezeichnet primär Vorbereitung, Bereitstellung oder Ausrüstung. „Vorbereitung“ gibt den belegten Sinn verständlich wieder, ohne die nicht lexikalisch gesicherte Deutung „Verständnis“ in den Haupttext einzutragen.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: jedes Menschen
  rationale: ⲣⲱⲙⲉ bezeichnet einen Menschen bzw. eine Person, ⲛⲓⲙ bedeutet in dieser Stellung „jeder“. Die Formulierung ist inklusiv und bewahrt den Singular.
- source_word: ⲡⲁⲛⲟⲩⲥ
  choice: mein Geist
  rationale: Das griechische Lehnwort νοῦς bezeichnet Geist, Sinn oder Verstand; das Präfix ⲡⲁ- ist das Possessiv „mein“. „Geist“ hält die Bedeutung weit und vermeidet eine vorschnelle Festlegung auf bloßen Intellekt.
- source_word: ⲉϩⲟⲩⲛ
  choice: im Innern
  rationale: Die Richtungs- bzw. Ortsangabe bedeutet „hinein, innen, im Innern“. In Verbindung mit „mein Geist“ bleibt die knappe, mehrdeutige Syntax des Koptischen erhalten.
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: die Aussprache meines Namens
  rationale: Das Wortfeld von ⲡⲱϣⲥ umfasst Teilung, Gliederung und Artikulation. Im Zusammenhang mit einem Namen und den folgenden Motiven von Schrei und Hören ist „Aussprache“ naheliegend; die wörtlichere Möglichkeit „Gliederung“ wird vermerkt.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: der Schrei, der hinausdringt
  rationale: ϣⲕⲁⲕ bezeichnet lautes Rufen oder Schreien, während ⲉⲃⲟⲗ die Bewegung nach außen ausdrückt. „Hinausdringt“ klingt im Deutschen natürlich und erhält die nach außen gerichtete Stimme.
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: die, die hört
  rationale: ⲥⲱⲧⲙ bedeutet direkt „hören“. Die feminine Formulierung entspricht der durch ⲧⲉ markierten Sprecherinnenstimme und wahrt den Gegensatz zwischen Schrei und Hören.
theological_decisions:
- issue: Verhältnis von Stimme, Name und Hörender
  choice: Die Aussagen bleiben als paradoxe Selbstidentifikationen nebeneinander stehen.
  alternative: Die Sprecherin als göttliche Offenbarung, Weisheit oder menschliches Bewusstsein ausdrücklich identifizieren.
  rationale: Der Abschnitt benennt die Sprecherin nicht eindeutig. Eine dogmatische Identifikation würde die gewollte Spannung zwischen ausgesprochener Stimme und hörendem Gegenüber auflösen.
- issue: Bedeutung von νοῦς
  choice: „Geist“
  alternative: „Verstand“ oder „Denken“
  rationale: „Geist“ bewahrt die semantische Breite von νοῦς. „Verstand“ wäre stärker rationalistisch, während „Denken“ den Ausdruck zu einem Vorgang verengen könnte.
translation_notes:
  register: Moderne, würdige und bewusst knappe poetische Sprache. Die wiederholte Formel „Ich bin“ sowie die paradoxe Verbindung von Schrei und Hörender bleiben erhalten. Der Gedankenstrich markiert die harte, im Koptischen syntaktisch unsichere Fügung, ohne sie stillschweigend zu glätten.
