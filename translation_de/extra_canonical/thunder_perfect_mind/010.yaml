- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die Konjunktion verbindet beide Prädikatsnomen innerhalb eines einzigen „Ich bin“-Satzes.
theological_decisions:
- issue: Paradoxe Selbstbezeichnung als Mutter und Tochter
  choice: Die Spannung bleibt ohne Erklärung oder Harmonisierung stehen.
  alternative: Die Rollen als Metapher auslegen oder in zwei selbstständige Aussagen auflösen.
  rationale: Der Text gestaltet bewusst eine paradoxe Identität; eine dogmatische oder allegorische Auflösung würde über den Wortlaut hinausgehen.
