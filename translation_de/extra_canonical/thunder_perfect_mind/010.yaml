lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ/ⲧⲉ
  choice: Ich bin
  rationale: Die sahidische prädikative Konstruktion wird im Deutschen natürlich und zugleich formnah mit „Ich bin“ wiedergegeben.
- source_word: ⲧⲙⲁⲁⲩ
  choice: die Mutter
  rationale: Das Wort bezeichnet eindeutig die Mutter; der bestimmte Artikel wird beibehalten.
- source_word: ⲧⲥϩⲓⲙⲉ / überlieferte Lesart ⲧϣⲉⲉⲣⲉ
