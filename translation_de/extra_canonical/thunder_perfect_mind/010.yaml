    rationale: Die Unsicherheit betrifft unmittelbar die Übersetzung von ⲧⲥϩⲓⲙⲉ; der Fußnotenanker sollte deshalb an „Frau“ stehen, nicht erst am gesamten Satzende nach „Tochter“.
