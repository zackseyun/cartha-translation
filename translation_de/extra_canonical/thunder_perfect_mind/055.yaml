translation:
  language: de
  text: '**10.** Ich bin diejenige, vor deren Angesicht ihr euch geschämt habt,[a] und mir gegenüber wart ihr ohne Scham.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vor deren Angesicht: auch „in deren Gegenwart“.'
    reason: lexical_alternative
  - marker: b
    text: 'Ohne Scham: auch „schamlos“.'
    reason: lexical_alternative
  - marker: c
    text: Die OCR-gestützte Lesung des ersten Verbs ist unsicher; bei anderer Worttrennung wäre auch eine Bedeutung wie „hinausgingt“ oder „euch zurückzogt“ denkbar. Der Gegensatz zu „ohne Scham“ spricht jedoch für „euch geschämt habt“.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲁⲓ (im Textausschnitt offenbar fehlerhaft als ⲧⲉ ⲡⲁⲓ erfasst)
  choice: Ich bin diejenige
  rationale: Bewahrt die wiederkehrende Selbstvorstellungsformel und macht zugleich das für die Sprecherinnenstimme bedeutsame grammatische Femininum sichtbar.
- source_word: ϩⲱⲱⲧ / ⲉ ⲧⲟⲟⲧϥ
  choice: vor deren Angesicht
  rationale: Die konkrete Wendung erhält den bildhaften Ton; „in deren Gegenwart“ wäre eine glattere, ebenfalls mögliche Wiedergabe.
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ (mit ⲁⲛⲧⲉⲧⲛ)
  choice: ihr euch geschämt habt
  rationale: Der Zusammenhang verlangt sehr wahrscheinlich ein Schamverb und bildet so den beabsichtigten Gegensatz zur folgenden Schamlosigkeit; die OCR-gestützte morphologische Lesung bleibt jedoch unsicher.
- source_word: ⲙⲛⲧⲁⲧ…
  choice: ohne Scham
  rationale: Gibt das privativ gebildete Abstraktum knapp wieder und bewahrt den scharfen Gegensatz zu „geschämt“.
- source_word: ⲙⲙⲟⲉⲓ
  choice: mir gegenüber
  rationale: Bezeichnet die Ausrichtung auf die Sprecherin, ohne festzulegen, ob diese Haltung lediglich relational oder ausdrücklich feindselig gemeint ist.
theological_decisions:
- issue: Geschlecht der sprechenden Gestalt
  choice: diejenige
  alternative: derjenige / die eine Person
  rationale: Die feminine grammatische Form ist für die Identität und Stimme der Sprecherin textlich bedeutsam und darf nicht neutralisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist bewusst leicht gehoben, aber allgemein verständlich und erhält die konkrete Bildsprache. Die Satzstellung hebt den Gegensatz zwischen Scham und Schamlosigkeit hervor.
