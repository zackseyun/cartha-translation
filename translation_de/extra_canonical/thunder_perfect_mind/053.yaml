base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
translation:
  language: de
  text: '**8.** Ich bin die, die ihr verachtet habt,


    und die, über die ihr nachdenkt.


    Ich bin die, die ihr verborgen habt,


    und die, die ihr offenbart.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Danach beginnt ein im vorliegenden Ausschnitt unvollständiger Satz: „Wenn ihr euch aber verbergt …“ Er wird hier nicht ergänzt.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Ich bin die
  rationale: Der feminine Prädikatsartikel bewahrt die weibliche Stimme der Sprecherin; „die“ ist im Deutschen natürlich und formtreu.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: verachtet
  rationale: Das griechische Lehnverb καταφρονεῖν bedeutet „verachten, geringschätzen“, nicht „verfolgen“.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: über die ihr nachdenkt
  rationale: Die Wendung bezeichnet das Denken oder Nachsinnen über jemanden; „nachdenken“ wahrt die Offenheit, ohne feindseliges Planen vorauszusetzen.
- source_word: ϩⲱⲡ ⲉⲣⲟⲉⲓ
  choice: die ihr verborgen habt
  rationale: ϩⲱⲡ bedeutet hier „verbergen, verstecken“. Diese Bedeutung bildet den ausdrücklichen Gegensatz zum folgenden Offenbaren.
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: die ihr offenbart
  rationale: Das Verb bedeutet in diesem Zusammenhang „offenbaren, sichtbar machen“ und steht als Antithese zu „verbergen“; es ist nicht als „lebendig machen“ zu verstehen.
theological_decisions:
- issue: Antithese von Verborgenheit und Offenbarung
  choice: „verborgen habt“ / „offenbart“
  alternative: „ergriffen habt“ / „lebendig gemacht habt“
  rationale: Die koptischen Verben und ihr paralleler Gegensatz sprechen für Verbergen und Offenbaren. Die Alternative würde die im Ausgangstext erkennbare Antithese beseitigen und beruht auf einer lexikalischen Verwechslung.
translation_notes:
  register: Vier kurze, parallele Zeilen in würdigem, modernem Standarddeutsch. Die wiederholte feminine Form „die“ hält die Selbstvorstellung der Sprecherin sichtbar. Das am Anfang des OCR-Ausschnitts stehende ⲛ̄ⲧⲟⲟⲧ gehört wahrscheinlich zum vorhergehenden Satz („von mir“) und wurde daher nicht als „Was euch betrifft“ in diesen Abschnitt aufgenommen.
