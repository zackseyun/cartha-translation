translation:
  language: de
  text: Und ich bin die, die ihr ergriffen habt. Ich bin die, die ihr zerstreut und zusammengeführt habt. Ich bin die, vor der ihr euch geschämt habt, und mir gegenüber wart ihr schamlos.
