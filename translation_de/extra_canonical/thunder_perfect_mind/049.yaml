lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: die ihr ergriffen habt
  rationale: ⲁⲙⲁϩⲧⲉ bezeichnet hier das Ergreifen oder Sich-Bemächtigen einer Person. „Ergriffen“ ist unmittelbar und lässt offen, ob Gewalt oder Festnahme gemeint ist.
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: die ihr zerstreut habt
  rationale: Die Verbindung drückt ein Aussenden beziehungsweise Auseinandertreiben aus. Im Gegensatz zum anschließenden Sammeln gibt „zerstreut“ den poetischen Sinn natürlich wieder.
- source_word: ⲥⲟⲟⲩⲛ ϩⲧⲉϩⲟⲩⲛ
  choice: wieder zusammengebracht habt
  rationale: Der OCR-Text ist an dieser Stelle unsicher; der erkennbare Gegensatz zum Zerstreuen weist auf ein Sammeln oder Zusammenbringen hin. „Wieder“ verdeutlicht im Deutschen diesen Gegensatz, ohne eine zusätzliche theologische Aussage einzuführen.
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: vor der ihr euch geschämt habt
  rationale: ϣⲓⲡⲉ bezeichnet Scham; die pronominale Verbindung bezieht sie auf die weibliche Sprecherin. „Vor der“ ist idiomatisches Deutsch und bewahrt die relationale Offenheit.
- source_word: ⲣⲁⲧϣⲓ…
  choice: mir gegenüber wart ihr schamlos
  rationale: Die am Ausschnittende abgebrochene Form gehört nach dem überlieferten Zusammenhang zur Wendung „schamlos sein“; „mir gegenüber“ gibt die relationale Ergänzung wieder und bildet den bewussten Gegensatz zu „euch geschämt“.
theological_decisions:
- issue: Paradoxer Gegensatz zwischen Scham und Schamlosigkeit
  choice: Den unmittelbaren Gegensatz ohne Deutung stehen lassen
  alternative: Die Scham als Ehrfurcht oder die Schamlosigkeit als Feindschaft erklären
  rationale: Der poetische Text stellt beide Aussagen spannungsvoll nebeneinander und liefert in diesem Segment keine eindeutige theologische Auflösung.
translation_notes:
  register: Moderne, würdige Standardsprache mit wiederholtem „Ich bin die“ zur Bewahrung der anaphorischen Form. Das feminine Sprecherprofil bleibt ausdrücklich erhalten. Keine Fußnoten nötig; die frühere Egypten-/Barbaren-Lesart gehört aufgrund der korrigierten Segmentzuordnung nicht zu diesem Textabschnitt.
