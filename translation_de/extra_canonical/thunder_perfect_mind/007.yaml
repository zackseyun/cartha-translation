base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/007.yaml
  text: 'Do not be ignorant of me.

    For I am the first and the last;

    I am the honored and the scorned[a];

    I am the whore and the holy one[d];

    I am the wife[b] and the virgin[c][e].'
translation:
  language: de
  text: 'Seid nicht unwissend über mich.


    Denn ich bin die Erste und die Letzte;

    ich bin die Geehrte und die Verachtete[a];

    ich bin die Hure und die Heilige[b];

    ich bin die Frau[c] und die Jungfrau[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der OCR-Text bietet ⲧϣⲏϣ, was gewöhnlich eher „die Große“ oder „die Vielen“ erwarten ließe und keinen klaren Gegensatz zu „die Geehrte“ bildet. Die Übersetzung folgt der von vielen Herausgebern angenommenen Lesart „die Verachtete“; der Wortlaut bleibt unsicher.
    reason: textkritische Unsicherheit
  - marker: b
    text: Das koptische ⲥⲉⲙⲛⲏ kann „heilig“, „rein“, „keusch“ oder „ehrwürdig“ bedeuten.
    reason: lexikalische Mehrdeutigkeit
  - marker: c
    text: Wörtlich „Frau“; im Zusammenhang wird auch „Ehefrau“ erwogen, wodurch der Gegensatz zur Jungfrau schärfer würde.
    reason: lexikalische Alternative
  - marker: d
    text: ⲡⲁⲣ ist eine in Nag-Hammadi-Handschriften gebräuchliche Abkürzung des griechischen παρθένος, „Jungfrau“.
    reason: Schreiberkonvention
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: Seid nicht unwissend über mich
  rationale: Bewahrt den Erkenntnisbezug des negativen Imperativs und gibt das koptische Objektgefüge in verständlichem, würdevollem Deutsch wieder.
- source_word: ⲧϣⲟⲣⲡ / ⲑⲁⲉ
  choice: die Erste / die Letzte
  rationale: Die direkten Gegenbegriffe erhalten die feminine Form der sprechenden Stimme und den feierlichen Parallelismus.
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: die Geehrte
  rationale: Gibt den substantivierten femininen Sinn knapp wieder und wahrt die Symmetrie mit dem folgenden Gegenbegriff.
- source_word: ⲧⲉⲧϣⲏϣ
  choice: die Verachtete
  rationale: Folgt der in Editionen angenommenen antithetischen Lesart, kennzeichnet aber wegen des überlieferten OCR-Wortlauts die Unsicherheit in einer Fußnote.
- source_word: ⲡⲟⲣⲛⲏ
  choice: Hure
  rationale: Der absichtlich schroffe Ausdruck bewahrt die provokante Spannung des griechischen Lehnworts und steht unmittelbar der Heiligen gegenüber.
- source_word: ⲥⲉⲙⲛⲏ
  choice: Heilige
  rationale: Erhält die religiöse Bedeutung von heilig/rein und bildet einen prägnanten Gegensatz zu Hure, ohne eine kirchliche Amts- oder Heiligenlehre einzutragen.
- source_word: ⲥϩⲓⲙⲉ
  choice: Frau
  rationale: Bleibt beim lexikalischen Grundsinn, statt durch Ehefrau die Antithese interpretierend zu verschärfen.
- source_word: ⲡⲁⲣ (Abkürzung für παρθένος)
  choice: Jungfrau
  rationale: Die Nag-Hammadi-Abkürzung bezeichnet das griechische Wort für Jungfrau; die deutsche Wiedergabe ist direkt und idiomatisch.
theological_decisions:
- issue: Identität der sprechenden Stimme
  choice: Durchgehend feminine substantivierte Formen
  alternative: Geschlechtsneutrale oder abstrakte Formulierungen
  rationale: Die koptischen femininen Artikel und Prädikate charakterisieren die Stimme grammatisch als weiblich; die Übersetzung bewahrt dies, ohne ihre theologische Identität näher festzulegen.
- issue: Paradoxe Selbstaussagen
  choice: Gegensätze unaufgelöst nebeneinanderstellen
  alternative: Die Aussagen allegorisch erklären oder harmonisieren
  rationale: Der Text entfaltet seine Aussage gerade durch spannungsvolle Gegensatzpaare; eine Auflösung würde eine bestimmte Deutung importieren.
translation_notes:
  register: Poetisch-orakelhafter, würdevoller Ton mit kurzen parallelen Sätzen. Die anstößige Schärfe von „Hure“ und die unaufgelösten Gegensätze bleiben bewusst erhalten. Die Anrede steht im Plural, entsprechend der koptischen Imperativform.
