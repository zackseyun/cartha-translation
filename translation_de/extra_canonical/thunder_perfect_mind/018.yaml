base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: de
  text: '**13.** […] und wer sich seiner rühmt, bringt mir dies.[a]


    Ich bin die Stille, die nicht zu erfassen ist,


    und der Gedanke, dessen Erinnerung groß ist.


    Ich bin die Stimme, deren Klang vielfältig ist,


    und das Wort, das vielfältig ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausschnitt beginnt mitten im Satz; auch die OCR-Lesung des ersten erhaltenen Wortes ist unsicher. Das koptische Pronomen in „wer sich seiner rühmt“ hat einen Bezug außerhalb des hier wiedergegebenen Ausschnitts.
    reason: textual_uncertainty
  - marker: b
    text: 'Wörtlich auch: „und das Wort, das vielfach/zahlreich ist“. Die genaue Art dieser Vielheit bleibt im Koptischen offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧϣⲟⲩⲟⲩϣⲟⲩ ⲙⲙⲟϥ
  choice: wer sich rühmt
  rationale: Die Konstruktion mit ⲙⲙⲟϥ ist reflexiv; das reduplizierte Verb bezeichnet hier Sich-Rühmen bzw. Prahlen, nicht einen Schreienden.
- source_word: ⲡⲕⲁⲣⲱϥ
  choice: die Stille
  rationale: Die Form ist als ⲡ-ⲕⲁ-ⲣⲱϥ, wörtlich etwa „das Schweigen/Stillhalten seines Mundes“, zu analysieren und bezeichnet im Kontext die Stille.
- source_word: ⲉⲧⲉⲙⲁⲩⲧⲁϩⲟϥ
  choice: die nicht zu erfassen ist
  rationale: ⲧⲁϩⲟ kann „erreichen, erfassen“ bedeuten; die negative Konstruktion beschreibt die Stille als unerreichbar beziehungsweise unbegreiflich.
- source_word: ⲧⲉⲡⲓⲛⲟⲓⲁ
  choice: der Gedanke
  rationale: Das im OCR über den Zeilenumbruch getrennte Wort ist das griechische Lehnwort ἐπίνοια; „Gedanke“ wahrt die gedankliche Bedeutung ohne zusätzliche metaphysische Festlegung.
- source_word: ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ
  choice: dessen Andenken groß ist
  rationale: ⲛⲁϣⲉ bedeutet „groß/viel“, während ⲣ-ⲡ-ⲙⲉⲉⲩⲉ das Erinnern oder Gedenken ausdrückt; die substantivische Wiedergabe erhält die Mehrdeutigkeit zwischen Erinnerung und Gedenken.
- source_word: ⲧⲉⲥⲙⲏ
  choice: die Stimme
  rationale: ⲥⲙⲏ bezeichnet hier „Stimme“, nicht „Name“, und steht parallel zu Klang und Wort.
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: deren Klang vielfältig ist
  rationale: Die Wendung beschreibt die Fülle beziehungsweise Vielgestaltigkeit ihres Lautes; „vielfältig“ fügt sich natürlich in die parallele Aussage ein.
- source_word: ⲡⲗⲟⲅⲟⲥ ⲉⲧⲉ ⲛⲁϣⲉ
  choice: das Wort, das vielerlei ist
  rationale: Das griechische Lehnwort λόγος wird im unmittelbaren Rede-Kontext mit „Wort“ wiedergegeben; ⲛⲁϣⲉ drückt Vielheit aus, ohne deren genaue Art festzulegen.
theological_decisions:
- issue: Mögliche Logos-Anspielung
  choice: „Wort“ ohne christologische Erläuterung
  alternative: „Logos“ oder ausdrücklich personifiziertes „Wort“
  rationale: Der griechische Ausdruck λόγος trägt ein erhöhtes Bedeutungsfeld, doch der Text bestimmt hier keine besondere christologische Identität. Die Übersetzung bewahrt die Resonanz, ohne sie konfessionell festzulegen.
- issue: Person und grammatisches Geschlecht in den Ich-Aussagen
  choice: Die wechselnden grammatischen Genera der Prädikatsnomen bleiben sichtbar
  alternative: Alle Aussagen durch einheitlich feminine Umschreibungen angleichen
  rationale: „Stille“, „Gedanke“, „Stimme“ und „Wort“ haben im Deutschen unterschiedliche Genera. Eine künstliche Angleichung würde die spannungsreiche Identifikationsreihe interpretierend glätten.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappen, parallel gebauten Ich-Aussagen. „Nicht zu erfassen“ hält körperliches Erreichen und geistiges Begreifen zusammen; „vielerlei“ bewahrt am Schluss die eigentümliche Offenheit des Originals.
