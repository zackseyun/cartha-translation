review_pass:
  verdict: revise
  source_fidelity: 'Die erste Antithese wird im Wesentlichen zutreffend wiedergegeben: ⲥⲩⲛⲟⲩⲥⲓⲁ bezeichnet ein Zusammensein bzw. eine Gemeinschaft, und οὐσία kann offen mit „Wesen“ wiedergegeben werden. In der dritten Zeile steht im vorliegenden koptischen OCR jedoch kein Negationselement vor ⲥⲟⲟⲩⲛ („kennen/erkennen“). Die Fassung „haben mich nicht erkannt“ fügt daher eine nicht belegte Negation ein. Da die Ausrichtung und das OCR unsicher sind, wird die etwas schwierige Reihung ohne diese Ergänzung übersetzt und nicht harmonisiert.'
  naturalness: Die überarbeitete Fassung behält den knappen, paradoxen Parallelismus bei und formuliert ihn in heutigem, würdigem Standarddeutsch. „weit von mir entfernt“ ist gegenüber „fern von mir“ etwas weniger gehoben, aber klar und idiomatisch; die Satzverbindung der dritten Aussage macht die im OCR überlieferte Reihung lesbar, ohne eine zusätzliche Negation einzutragen.
  terminology: „Gemeinschaft“ ist für ⲥⲩⲛⲟⲩⲥⲓⲁ tragfähig; die Fußnote wahrt die lexikalischen Alternativen. „Wesen“ für οὐσία ist angemessen offen und die Fußnote nennt „Sein“ und „Substanz“, ohne eine dogmatische Bedeutung festzulegen. „kennen“ und „erkannt haben“ bewahren die Wiederaufnahme des koptischen Erkenntnisverbs.
  issues:
  - severity: high
    issue: Unbelegte Negation in der Aussage über die Nahen
    rationale: Der Entwurf übersetzt „Die mir nahe sind, haben mich nicht erkannt“. Im bereitgestellten koptischen Text steht nach ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ jedoch ⲁⲩⲱ ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ („und die mich kennen“); ein ⲁⲧ- oder anderes Negationselement ist nicht vorhanden. Die Negation darf nicht aus einer vermuteten Standardfassung ergänzt werden.
  - severity: low
    issue: Fußnote c kann den Textbefund genauer beschreiben
    rationale: Der OCR-Ausschnitt bricht nicht vor dem ganzen letzten Satz ab, sondern nach dessen Anfang („an dem Tag, an dem …“). Die Fußnote sollte dies präzisieren und klarstellen, dass nur die Fortsetzung aus der überlieferten Passage ergänzt ist.
  revised_text: 'Die außerhalb meiner Gemeinschaft[a] sind, kennen mich nicht;

    die aber in meinem Wesen[b] sind, kennen mich.


    Die mir nahe sind und mich kennen, und die weit von mir entfernt sind, haben mich erkannt.


    An dem Tag, an dem ich euch nahe bin, seid ihr fern von mir;

    und an dem Tag, an dem ihr mir nahe seid, bin ich fern von euch.[c]'
  revised_footnotes:
