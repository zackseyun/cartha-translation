base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: de
  text: 'Die außerhalb meiner Gemeinschaft[a] sind, kennen mich nicht;

    die aber in meinem Wesen[b] sind, kennen mich.


    Die mir nahe sind, haben mich nicht erkannt;

    die aber fern von mir sind, haben mich erkannt.


    An dem Tag, an dem ich euch nahe bin, seid ihr fern von mir;

    und an dem Tag, an dem ihr mir nahe seid, bin ich fern von euch.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit ⲥⲩⲛⲟⲩⲥⲓⲁ wiedergegebene Wort kann „Zusammensein“, „Umgang“, „Gemeinschaft“ oder „Gesellschaft“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „in meinem Sein“ oder „in meiner Substanz“.'
    reason: lexical_alternative
  - marker: c
    text: Der bereitgestellte OCR-Ausschnitt bricht zu Beginn des letzten parallelen Satzes ab; dessen Abschluss folgt der überlieferten Fortsetzung der Passage.
    reason: textual_scope
lexical_decisions:
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲁⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: außerhalb meiner Gemeinschaft
  rationale: ⲥⲩⲛⲟⲩⲥⲓⲁ bezeichnet Zusammensein, Umgang oder Gemeinschaft. „Gemeinschaft“ bewahrt den Beziehungsaspekt und klingt im Deutschen natürlich; „außerhalb“ gibt ⲉⲃⲟⲗ wieder.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: kennen mich nicht
  rationale: Die Konstruktion ⲣ̄ ⲁⲧ- mit ⲥⲟⲟⲩⲛ drückt Unkenntnis aus. Die schlichte deutsche Verneinung ist genauer und natürlicher als ein abstraktes „sind unwissend über mich“.
- source_word: 'ⲛ̄ ⲧⲁⲟⲩⲥⲓⲁ (im OCR geteilt: ⲛⲧⲁ ⲟⲩⲁ)'
  choice: in meinem Wesen
  rationale: Das griechische Lehnwort οὐσία kann Wesen, Sein oder Substanz bezeichnen. „Wesen“ wahrt die ontologische Offenheit und ist verständlicher als „Substanz“.
- source_word: ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ / Näheformulierung im überlieferten Zusammenhang
  choice: die mir nahe sind
  rationale: Die Passage bildet einen antithetischen Parallelismus zwischen Nähe und Ferne. „Mir nahe“ erhält diesen räumlich-beziehungsbezogenen Doppelsinn.
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: die aber fern von mir sind
  rationale: Die Wendung bezeichnet ausdrücklich diejenigen, die sich weit außerhalb beziehungsweise fern von der Sprecherin befinden. „Aber“ verdeutlicht den im Coptischen durch die Reihung getragenen Gegensatz.
- source_word: ⲥⲟⲟⲩⲛ / ⲥⲟⲩⲱⲛⲧ
  choice: kennen / haben erkannt
  rationale: Das Verb bezeichnet Erkennen oder Kennen. Im ersten Gegensatz ist präsentisches „kennen“ passend; bei den folgenden Formen bewahrt „haben erkannt“ die im Text angelegte aspektuelle beziehungsweise zeitliche Abstufung.
theological_decisions:
- issue: Verhältnis von Nähe, Ferne und Erkenntnis
  choice: Die paradoxen Gegensätze bleiben unaufgelöst stehen.
  alternative: Nähe und Ferne metaphorisch als geistliche Zustände erläutern oder harmonisieren.
  rationale: Der Text stellt die Spannung bewusst her und erklärt sie nicht. Eine theologische Deutung im Haupttext würde eine bestimmte Lesart importieren.
- issue: Bedeutung von οὐσία
  choice: „Wesen“ mit Fußnote zu „Sein/Substanz“
  alternative: Festlegung auf „Substanz“ als technischer ontologischer Begriff.
  rationale: Das Lehnwort besitzt einen breiten Bedeutungsraum; die Übersetzung soll keine spätere dogmatische Präzision erzwingen.
translation_notes:
  register: Moderner, würdevoller deutscher Prosarhythmus mit klaren antithetischen Satzpaaren. Die weibliche Sprecherstimme verlangt an dieser Stelle keine grammatisch markierte Selbstbezeichnung. Semikolons halten die eng verbundenen Gegensätze zusammen; die paradoxen Aussagen werden weder geglättet noch ausgelegt.
