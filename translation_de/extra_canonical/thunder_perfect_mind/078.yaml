    reason: textual_scope
  revision_rationale: Die allein sichere inhaltliche Korrektur ist die Entfernung der in den OCR-Zeilen nicht belegten Negation bei denjenigen, die der Sprecherin nahe sind. Die daraus entstehende knappe Reihung bleibt bewusst stehen, weil der Quellenausschnitt niedrig ausgerichtet und OCR-unsicher ist; eine glättende Umdeutung oder Rückübernahme einer abweichenden Standardfassung wäre weniger quellentreu. Die übrigen Aussagen und die Fußnoten werden nur sprachlich beziehungsweise befundbezogen präzisiert.
