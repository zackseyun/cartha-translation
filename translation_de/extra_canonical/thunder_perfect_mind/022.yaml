base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: de
  text: '**17.** Diejenigen, die über mich die Wahrheit sagen, lügen über mich,


    und diejenigen, die über mich gelogen haben, sagen über mich die Wahrheit.


    Diejenigen, die mich kennen, sollen mich nicht kennen[a],


    und diejenigen, die mich nicht gekannt haben, sollen mich erkennen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher im Sinn einer jussivischen Aufforderung: »Diejenigen, die mich kennen, sollen über mich unwissend sein.«'
    reason: Die koptische Form ist auffordernd; »mich nicht kennen« gibt die paradoxe Aussage im Deutschen knapper und natürlicher wieder.
  - marker: b
    text: 'Auch möglich: »sollen mich kennenlernen« oder »sollen von mir wissen«.'
    reason: ⲥⲟⲟⲩⲛ kann, je nach Zusammenhang, »wissen«, »kennen« oder »erkennen« bedeuten.
lexical_decisions:
- source_word: ⲙⲉ
  choice: die Wahrheit
  rationale: Das koptische ⲙⲉ bezeichnet hier im Gegensatz zu ϫⲓ ϭⲟⲗ die Wahrheit beziehungsweise das Wahre. Die substantivische deutsche Wendung erhält den scharfen Gegensatz von Wahrheit und Lüge.
- source_word: ϫⲓ ϭⲟⲗ
  choice: lügen / gelogen haben
  rationale: Die Verbindung bedeutet hier »eine Lüge äußern«, also »lügen«. Der unmittelbare Gegensatz zu ⲙⲉ schließt die an anderer Stelle erwogene Bedeutung »Ausruf/Äußerung« in diesem Zusammenhang aus.
- source_word: ⲥⲟⲟⲩⲛ
  choice: kennen / erkennen
  rationale: Das Verb bezeichnet Wissen oder Kennen. »Kennen« passt beim bestehenden Verhältnis zu der Sprecherin; im abschließenden Aufforderungssatz gibt »erkennen« den Eintritt in dieses Kennen natürlich wieder, ohne den paradoxen Gegensatz aufzulösen.
- source_word: ⲉⲙⲡⲟⲩ-
  choice: nicht gekannt haben
  rationale: Die negative Vergangenheitsform wird im Deutschen mit dem Perfekt wiedergegeben und von dem gegenwärtigen »kennen« des vorigen Versglieds unterschieden.
theological_decisions:
- issue: Paradoxe Verbindung von wahrer und falscher Rede über die Sprecherin
  choice: Der formale Gegensatz wird unverändert stehen gelassen.
  alternative: Die Aussage als Kritik an bestimmten Gruppen oder als Aussage über unzulängliche Gotteserkenntnis erklären.
  rationale: Der Text nennt keine solche Auflösung. Seine Spannung gehört zur Selbstoffenbarung der Sprecherin und darf nicht konfessionell oder systematisch vereindeutigt werden.
- issue: Imperativische Aussage über Kennen und Nichtkennen
  choice: Mit »sollen« als Aufforderung wiedergegeben.
  alternative: 'Direkte Anrede: »Seid unwissend über mich« beziehungsweise indikativisch »werden mich nicht kennen«.'
  rationale: Die Aufforderungskraft bleibt erhalten, während die parallele Form »Die …« im Deutschen gewahrt wird. Eine futurische Deutung würde den im Quellenzusammenhang bezeugten Imperativ abschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst parallelem Satzbau. Das wiederholte »über mich« und der Gegensatz von »kennen« und »nicht kennen« bleiben sichtbar. Die Übersetzung folgt der im OCR noch erkennbaren Wahrheits-/Lügen-Terminologie und nicht der älteren, an dieser Stelle unzutreffenden Fassung »Ich bin die Äußerung meines Namens«.
