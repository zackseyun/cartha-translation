  text: Ἐπὶ τίνα ἐπιβλέψω, ἀλλ’ ἢ ἐπὶ τὸν πρᾶον καὶ ἡσύχιον καὶ τρέμοντά μου τὰ λόγια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: de
  text: „Auf wen werde ich blicken, wenn nicht auf den, der sanftmütig und still ist und vor meinen Worten zittert?“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: werde ich blicken
  rationale: Bewahrt die konkrete Bildsprache des griechischen Verbs und den futurischen Fragesatz.
- source_word: πρᾶον
  choice: sanftmütig
  rationale: Gibt die Haltung von Milde und Gewaltlosigkeit in würdigem, verständlichem Deutsch wieder.
- source_word: ἡσύχιον
  choice: still
  rationale: Entspricht der ruhigen, unaufdringlichen Haltung, die das Adjektiv bezeichnet.
- source_word: τρέμοντά μου τὰ λόγια
  choice: vor meinen Worten zittert
  rationale: Die natürliche deutsche Verbindung „vor etwas zittern“ bildet die griechische Konstruktion treffend ab; „Worten“ wahrt den Plural.
theological_decisions:
- issue: Einheit oder Aufteilung der beschriebenen Person
  choice: 'Alle drei Merkmale beziehen sich auf dieselbe Person: „der sanftmütig und still ist und … zittert“'
  alternative: „auf den Sanftmütigen und Stillen und auf den, der … zittert“
  rationale: Der einzelne Artikel τὸν regiert die drei koordinierten Beschreibungen πρᾶον, ἡσύχιον und τρέμοντα. Daher ist grammatisch eine einzige Person gemeint; eine Aufteilung in zwei Personen wäre irreführend.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht biblischem Klang. Die Satzstruktur bleibt eng am Griechischen, ohne im Deutschen unnatürlich zu wirken.
