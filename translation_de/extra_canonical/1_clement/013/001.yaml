id: 1CLEM.13.1
reference: 1 Clement 13:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: de
  text: 'Seien wir also demütig gesinnt, Geschwister, und legen wir alle Überheblichkeit, allen Dünkel, alle Unvernunft und alle Zornesausbrüche ab. Tun wir, was geschrieben steht; denn der Heilige Geist sagt: »Der Weise soll sich nicht seiner Weisheit rühmen, der Starke nicht seiner Stärke und der Reiche nicht seines Reichtums. Wer sich aber rühmt, soll sich des Herrn rühmen, um ihn zu suchen und Recht[a] und Gerechtigkeit zu üben.« Dabei wollen wir besonders an die Worte des Herrn Jesus denken, mit denen er Sanftmut und Geduld lehrte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gerechtes Urteil«.'
    reason: κρίμα kann je nach Zusammenhang „Recht“, „Urteil“ oder „Gericht“ bedeuten; in der Verbindung mit δικαιοσύνη bezeichnet es wahrscheinlich rechtes beziehungsweise gerechtes Handeln.
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: Seien wir … demütig gesinnt
  rationale: Gibt den auffordernden Konjunktiv und die innere Haltung von ταπεινοφρονεῖν wieder, ohne ihn auf ein bloß äußeres Verhalten zu verengen.
- source_word: ἀλαζονείαν καὶ τύφος
  choice: Überheblichkeit, … Dünkel
  rationale: 'Die beiden nahe verwandten Begriffe werden unterscheidbar wiedergegeben: ἀλαζονεία bezeichnet anmaßendes Auftreten, τύφος verblendeten Hochmut beziehungsweise Dünkel.'
- source_word: ἀφροσύνην
  choice: Unvernunft
  rationale: Bezeichnet mangelnde Einsicht oder Torheit; „Unvernunft“ ist hier natürlich und vermeidet einen unnötig abwertenden Klang.
- source_word: ὀργάς
  choice: Zornesausbrüche
  rationale: Der Plural legt konkrete Regungen oder Ausbrüche des Zorns nahe, nicht nur Zorn als abstrakte Haltung.
- source_word: ποιήσωμεν τὸ γεγραμμένον
  choice: Tun wir, was geschrieben steht
  rationale: Bewahrt das aktive ποιεῖν und die feste frühchristliche Bezugnahme auf die Schrift.
- source_word: καυχάομαι
  choice: sich rühmen
  rationale: Entspricht dem wiederholten Leitwort der Schriftanführung und funktioniert sowohl für verfehltes als auch für auf den Herrn bezogenes Rühmen.
- source_word: ποιεῖν κρίμα καὶ δικαιοσύνην
  choice: Recht und Gerechtigkeit üben
  rationale: Die idiomatische Verbindung bezeichnet praktisches gerechtes Handeln; „üben“ ist im Deutschen natürlicher als das formale „tun“.
- source_word: ἐπιείκειαν καὶ μακροθυμίαν
  choice: Sanftmut und Geduld
  rationale: ἐπιείκεια meint milde, nachsichtige Sanftmut; μακροθυμία geduldiges Ertragen beziehungsweise Langmut. Die gewählten Wörter sind gegenwärtig und würdevoll.
theological_decisions:
- issue: Umfang der Rede des Heiligen Geistes
  choice: Die Wendung „indem er ihn sucht und Recht und Gerechtigkeit übt“ bleibt innerhalb des Zitats.
  alternative: Das Zitat nach „des Herrn rühmen“ schließen und die folgende Wendung als Kommentar Clements lesen.
  rationale: Die griechische Satzführung ordnet τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην weiterhin dem von λέγει … τὸ πνεῦμα τὸ ἅγιον eingeführten Redeinhalt zu.
- issue: Bezug des finalen Relativsatzes
  choice: „mit denen er … lehrte“ bezieht die Lehrwirkung auf die Worte Jesu.
  alternative: „die er sprach, als er … lehrte“ bildet Sprechen und Lehren als getrennte Verbalhandlungen ab.
  rationale: Das griechische οὓς ἐλάλησεν διδάσκων verbindet die gesprochenen Worte eng mit Jesu Lehren. Die deutsche Fassung ist idiomatisch, ohne den Inhalt dieser Lehre über „Sanftmut und Geduld“ hinaus zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. „Geschwister“ gibt das gemeinschaftlich inklusive ἀδελφοί natürlich wieder. Die direkte Schriftrede ist klar markiert; ihre syntaktische Einbindung und die Spannung zwischen „Recht“ und „Gerechtigkeit“ bleiben sichtbar.
