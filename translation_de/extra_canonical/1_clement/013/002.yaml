  source_fidelity: Die Übersetzung gibt die sieben parataktisch gereihten Imperativ-Folge-Sätze sachgerecht wieder. Die ungenannten passivischen Handelnden bleiben durchgehend ungenannt. Die Entsprechungen von Erbarmen, Vergebung, Tun, Geben, Urteilen, Güte und Messen sind vollständig erhalten; besonders „mit demselben Maß“ gibt αὐτῷ zutreffend aufnehmend wieder.
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem dem Mahnwort angemessenen würdigen Ton. Die wiederholte Satzstruktur ist klar und bewahrt den Rhythmus der Vorlage. „an euch gehandelt werden“ ist im Kontext verständlich und bildet die unbestimmte Passivform des Griechischen angemessen ab.
  terminology: „Erbarmen“, „vergeben“, „Güte“ und „Maß“ sind passende, konfessionell nicht festlegende Wiedergaben. Die Wortfeldwiederholungen in „Erbarmen“ sowie „Güte erweisen/erwiesen werden“ und das Bild des Messens bleiben erkennbar. „urteilt/beurteilt“ gibt κρίνετε/κριθήσεσθε idiomatisch wieder, ohne eine engere gerichtliche oder verdammende Nuance aufzuzwingen.
