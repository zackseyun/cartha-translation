id: 1CLEM.13.2
reference: 1 Clement 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: de
  text: 'Denn so hat er gesagt: „Habt Erbarmen, damit ihr Erbarmen findet. Vergebt, damit euch vergeben wird. Wie ihr handelt, so wird an euch gehandelt werden. Wie ihr gebt, so wird euch gegeben werden. Wie ihr urteilt, so werdet ihr beurteilt werden. Wie ihr Güte erweist, so wird euch Güte erwiesen werden. Mit demselben Maß, mit dem ihr messt, wird euch zugemessen werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε / ἐλεηθῆτε
  choice: Habt Erbarmen / damit ihr Erbarmen findet
  rationale: Gibt den Imperativ und das anschließende Passiv idiomatisch wieder und bewahrt zugleich die erkennbare Wiederholung desselben Wortfeldes.
- source_word: ἀφίετε / ἀφεθῇ ὑμῖν
  choice: Vergebt / damit euch vergeben wird
  rationale: Im zwischenmenschlichen Zusammenhang bedeutet ἀφίημι hier „vergeben“; die deutsche Passivform bleibt eng an der griechischen Konstruktion.
- source_word: ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν
  choice: Wie ihr handelt, so wird an euch gehandelt werden
  rationale: Das objektlose ποιεῖτε bezeichnet allgemein das Tun beziehungsweise Verhalten; „handeln“ bewahrt diese Offenheit und die aktiv-passive Entsprechung.
- source_word: χρηστεύεσθε / χρηστευθήσεται
  choice: Güte erweist / Güte erwiesen werden
  rationale: Die seltene verbale Form bezeichnet gütiges Handeln. Die Formulierung ist im Deutschen natürlich und hält die lexikalische Spiegelung fest.
- source_word: ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν
  choice: Mit demselben Maß, mit dem ihr messt, wird euch zugemessen werden
  rationale: Bewahrt das Bild des Maßes, die Wiederholung des Messens und den passiven Vergeltungssinn des griechischen Satzes.
theological_decisions:
- issue: Gegenseitigkeit zwischen menschlichem Handeln und dem, was den Angesprochenen widerfährt
  choice: Die durchgehend parallelen Aktiv-Passiv-Sätze werden ohne ausdrückliche Nennung des Handelnden wiedergegeben.
  alternative: Gott ausdrücklich als denjenigen nennen, der Erbarmen zeigt, vergibt, gibt und richtet.
  rationale: Der griechische Text lässt den Handelnden in den Passivformen ungenannt. Die Übersetzung bewahrt diese theologisch bedeutsame Offenheit, statt den implizierten Urheber ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer pluralischer Anrede. Die rhythmische Folge kurzer Parallelsätze und die wiederholten Aktiv-Passiv-Entsprechungen des griechischen Textes bleiben erhalten.
