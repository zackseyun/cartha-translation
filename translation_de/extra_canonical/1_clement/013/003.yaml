base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: de
  text: 'Durch dieses Gebot und diese Weisungen wollen wir uns stärken, um im Gehorsam gegenüber seinen der Heiligkeit angemessenen Worten zu wandeln und demütig gesinnt zu sein. Denn das heilige Wort sagt:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλμασι
  choice: Weisungen
  rationale: Gibt verbindliche Anordnungen in natürlichem, würdigem Deutsch wieder, ohne unnötig juristisch zu klingen.
- source_word: στηρίξωμεν ἑαυτούς
  choice: wollen wir uns stärken
  rationale: Bewahrt den hortativen Konjunktiv und die reflexive Form des Griechischen.
- source_word: εἰς τὸ πορεύεσθαι
  choice: damit wir unseren Weg … gehen
  rationale: Gibt die Zielrichtung von εἰς τό mit Infinitiv wieder und bewahrt die Wegmetaphorik von πορεύεσθαι.
- source_word: ὑπηκόους ὄντας
  choice: im Gehorsam gegenüber
  rationale: Drückt den begleitenden Zustand des Gehorsams idiomatisch aus, ohne ihn zu einem bloßen Einzelakt zu verengen.
- source_word: ἁγιοπρεπέσι λόγοις
  choice: Worten …, die der Heiligkeit entsprechen
  rationale: Bewahrt die Bedeutung des zusammengesetzten Adjektivs ἁγιοπρεπής als der Heiligkeit angemessen bzw. entsprechend, statt es in zwei Eigenschaften aufzuspalten.
- source_word: ταπεινοφρονοῦντες
  choice: und dabei demütig gesinnt sind
  rationale: Gibt die begleitende Haltung des Partizips ausdrücklich und in verständlichem modernem Deutsch wieder.
- source_word: ὁ ἅγιος λόγος
  choice: das heilige Wort
  rationale: Formale und im Kontext passende Wiedergabe der Einleitungsformel für das folgende Schriftwort.
theological_decisions:
- issue: Charakterisierung der Worte durch ἁγιοπρεπής
  choice: die der Heiligkeit entsprechen
  alternative: heilige Worte
  rationale: Die gewählte Form erhält die spezifische Nuance, dass die Worte der Heiligkeit angemessen sind; die idiomatischere Alternative ist möglich und wird in der Fußnote genannt.
- issue: Verhältnis von Gehorsam und Lebenswandel
  choice: unseren Weg im Gehorsam … gehen
  alternative: als Gehorsame gehen
  rationale: Die Übersetzung lässt den Gehorsam als fortdauernde Haltung beim Lebenswandel erkennen, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem exhortativem Stil. Die Satzstruktur wurde leicht geglättet, während Aufforderung, Zielrichtung, begleitender Gehorsam und Demut erhalten bleiben.
