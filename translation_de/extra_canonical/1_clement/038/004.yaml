id: 1CLEM.38.4
reference: 1 Clement 38:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες, ὀφείλομεν κατὰ πάντα εὐχαριστεῖν αὐτῷ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Da wir nun all dies von ihm haben, sind wir verpflichtet, ihm in jeder Hinsicht zu danken. Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: dies alles
  rationale: Gibt den umfassenden Ausdruck im Deutschen natürlich und präzise wieder.
- source_word: ὀφείλομεν
  choice: sind wir verpflichtet
  rationale: Bewahrt den verpflichtenden Sinn von ὀφείλω deutlicher als ein bloßes „sollen“.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Gibt die distributive Weite des Ausdrucks idiomatisch wieder, ohne ihn unnötig einzuengen.
- source_word: εὐχαριστεῖν
  choice: zu danken
  rationale: Im Kontext bezeichnet das Verb den Dank an Gott; „danken“ ist hier natürlich und sachlich vollständig.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: Bewahrt den traditionellen und theologisch offenen Bedeutungsumfang von δόξα.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: von Ewigkeit zu Ewigkeit
  rationale: Eine geläufige, würdige deutsche Wiedergabe der emphatischen Ewigkeitsformel.
theological_decisions:
- issue: Bezugswort der Pronomen in ἐξ αὐτοῦ, αὐτῷ und ᾧ
  choice: Das maskuline Pronomen bleibt durchgehend als „ihm“ wiedergegeben.
  alternative: Den Bezug ausdrücklich als „Gott“ benennen.
  rationale: Der griechische Text verwendet Pronomen; die Übersetzung bewahrt diesen Textbezug und vermeidet eine nicht ausdrücklich vorhandene Präzisierung.
- issue: Doxologische Formulierung ᾧ ἡ δόξα
  choice: „Ihm sei die Herrlichkeit“
  alternative: „Ihm gehört die Herrlichkeit“
  rationale: Die elliptische griechische Doxologie lässt eine Wunsch- oder Feststellungsaussage zu. Die gewählte traditionelle deutsche Form bewahrt ihren liturgischen Charakter, ohne ein zusätzliches Verb als eindeutige Aussage des Grundtextes auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Gedankengang, klingt aber natürlich; keine Fußnoten erforderlich.
