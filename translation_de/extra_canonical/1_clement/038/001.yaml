  verdict: approve
  source_fidelity: Die Übersetzung gibt σωζέσθω sachgerecht mit „bewahrt werden“ wieder und hält die mögliche Bedeutung „gerettet werden“ in der Fußnote offen. „Unser ganzer Leib“, die gegenseitige Unterordnung und die Einsetzung im Verhältnis zur jeweiligen Gnadengabe entsprechen dem griechischen Text. Die bei Funk OCR-bedingt entstellte Form ist zutreffend als σωζέσθω verstanden.
  naturalness: Der Satz ist flüssiges, modernes und zugleich dem kirchlich-paränetischen Register angemessenes Standarddeutsch. „Leib“ bewahrt die im Kontext beabsichtigte gemeinschaftliche Körpermetapher. Die Formulierung „seiner Gnadengabe entsprechend“ ist idiomatischer als eine strikt wörtliche Wiedergabe und wird durch die Fußnote ausreichend abgesichert.
  terminology: „Christus Jesus“, „Leib“, „Nächster“ und „Gnadengabe“ sind treffende, verständliche und registergerechte Entsprechungen. „Unterordnen“ gibt ὑποτάσσεσθαι direkt wieder, ohne über den Text hinausgehende institutionelle oder konfessionelle Deutungen einzutragen.
