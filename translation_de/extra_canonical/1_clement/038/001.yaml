source:
  edition: Funk 1901 (normalized OCR)
  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: de
  text: Darum soll unser ganzer Leib in Christus Jesus bewahrt werden,[a] und jeder soll sich seinem Nächsten unterordnen, so wie er seiner Gnadengabe entsprechend eingesetzt worden ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerettet werden“.'
    reason: Das griechische σωζέσθω umfasst sowohl Rettung als auch Bewahrung.
  - marker: b
    text: 'Wörtlicher: „so wie er in seiner Gnadengabe eingesetzt worden ist“.'
    reason: Die Verbindung ἐν τῷ χαρίσματι αὐτοῦ lässt sich im Deutschen sowohl sphärisch („in“) als auch im Sinn einer der Gabe entsprechenden Einsetzung wiedergeben.
lexical_decisions:
- source_word: 'Σωζέσθω (im OCR: Συνξέσϑω)'
  choice: soll … bewahrt werden
  rationale: Das überlieferte σωζέσθω bedeutet „gerettet“ oder „bewahrt werden“. Im Zusammenhang mit dem ganzen Leib gibt „bewahrt werden“ den Sinn natürlich wieder, ohne den möglichen Heilsanklang auszuschließen.
- source_word: ὅλον τὸ σῶμα
  choice: unser ganzer Leib
  rationale: Die kollektive Leib-Metapher wird formal erhalten; „Leib“ klingt im kirchlichen Zusammenhang würdiger und eindeutiger als „Körper“.
- source_word: ὑποτασσέσθω
  choice: soll sich … unterordnen
  rationale: Die mediale bzw. passive Imperativform bezeichnet hier die freiwillige Einordnung unter den Nächsten.
- source_word: τῷ πλησίον αὐτοῦ
  choice: seinem Nächsten
  rationale: Dies ist die direkte und im Deutschen geläufige Entsprechung.
- source_word: χάρισμα
  choice: Gnadengabe
  rationale: „Gnadengabe“ bewahrt sowohl den Geschenkcharakter als auch den Bezug zur göttlichen Gnade und ist im vorliegenden gemeindlichen Kontext verständlich.
- source_word: ἐτέθη
  choice: eingesetzt worden ist
  rationale: Das passive τίθημι kann „gesetzt“, „gestellt“ oder „eingesetzt“ bedeuten. „Eingesetzt“ gibt die zugewiesene Stellung bzw. Aufgabe in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von σωζέσθω für den gemeinschaftlichen Leib
  choice: bewahrt werden
  alternative: gerettet werden
  rationale: „Bewahrt“ passt zur fortdauernden Einheit und Unversehrtheit des ganzen Leibes, lässt aber die soteriologische Bedeutung des Verbs bestehen; die Alternative wird in der Fußnote genannt.
- issue: Verhältnis von Einsetzung und Gnadengabe in καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ
  choice: so wie er seiner Gnadengabe entsprechend eingesetzt worden ist
  alternative: so wie er in seiner Gnadengabe eingesetzt worden ist
  rationale: Die gewählte Fassung ist im Deutschen verständlich und bewahrt den Gedanken, dass Stellung und Gabe einander entsprechen. Da ἐν auch eine engere örtlich-sphärische Beziehung ausdrücken kann, wird die wörtlichere Alternative als Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Leib-Metapher. Die Satzstruktur bleibt eng am Griechischen, wird jedoch durch „seiner Gnadengabe entsprechend“ idiomatisch gestaltet. Das fehlerhafte OCR Συνξέσϑω wurde anhand der belegten Lesart σωζέσθω korrigiert.
