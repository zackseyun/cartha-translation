id: 1CLEM.38.3
reference: 1 Clement 38:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: de
  text: Bedenken wir also, Geschwister, aus welchem Stoff wir entstanden sind, welcher Art und wer wir waren, als wir in die Welt eintraten, und aus welchem Grab und welcher Finsternis derjenige, der uns geformt und geschaffen hat, uns in seine Welt führte. Seine Wohltaten hatte er schon bereitet, bevor wir geboren wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: Bedenken wir
  rationale: Gibt den auffordernden Konjunktiv und das gründliche Nachdenken natürlich und würdevoll wieder.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Bezeichnet im gemeindlichen Anredekontext natürlich die Glaubensgemeinschaft, ohne den griechischen Plural unnötig auf Männer zu beschränken.
- source_word: ὕλης
  choice: Stoff
  rationale: Bewahrt die konkrete Bedeutung von Materie bzw. Ausgangsstoff und vermeidet das abstraktere „Ursprung“.
- source_word: ποῖοι καὶ τίνες
  choice: welcher Art und wer
  rationale: 'Erhält die griechische Dopplung: ποῖοι fragt nach Beschaffenheit oder Zustand, τίνες nach Identität.'
- source_word: τάφου καὶ σκότους
  choice: Grab und Finsternis
  rationale: Gibt die auffällige, spannungsreiche Bildsprache wörtlich wieder, statt sie als bloßen Herkunftsort auszudeuten.
- source_word: πλάσας ... καὶ δημιουργήσας
  choice: geformt und geschaffen
  rationale: Bewahrt die beiden komplementären Schöpfungsverben; „geformt“ trägt die handwerklich-plastische Nuance von πλάσσω.
- source_word: εὐεργεσίας
  choice: Wohltaten
  rationale: Entspricht dem Sinn von Begünstigungen bzw. erwiesenen Wohltaten und erhält eher als „Gaben“ den Anklang an die antike Sprache des Wohltäters.
theological_decisions:
- issue: Deutung von „Grab und Finsternis“
  choice: Die Metapher bleibt ohne erklärende Auflösung stehen.
  alternative: Als Mutterleib, Nichtsein, Tod oder sündiger Zustand explizit deuten.
  rationale: Der griechische Text benennt nur das Bild; eine eindeutige anthropologische oder soteriologische Auslegung wäre ein Zusatz.
- issue: Bezeichnung Gottes als Schöpfer
  choice: Die substantivierte Umschreibung „derjenige, der uns geformt und geschaffen hat“ bleibt erhalten.
  alternative: Das Subjekt ausdrücklich mit „Gott“ wiedergeben.
  rationale: Gott ist im Kontext gemeint, wird in diesem Satz aber nicht ausdrücklich genannt; die Übersetzung folgt daher der Formulierung des Ausgangstextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Der lange griechische Satz wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; die gedankliche Folge und der zeitliche Vorrang der Wohltaten bleiben erhalten.
