  source_fidelity: 'Die Übersetzung gibt die paränetische Aufforderung ἀναλογισώμεθα, die doppelte Frage ποῖοι καὶ τίνες, die unaufgelöste Bildsprache „Grab und Finsternis“, die beiden Schöpfungsverben sowie den zeitlichen Vorrang der εὐεργεσίαι zuverlässig wieder. Die Aufteilung des griechischen Satzes in zwei deutsche Sätze verändert die Zuordnung nicht: Der Schöpfer ist auch derjenige, der die Wohltaten vorbereitet hat.'
