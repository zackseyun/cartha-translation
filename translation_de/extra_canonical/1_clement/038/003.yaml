  terminology: „Stoff“ trifft ὕλη angemessen; „geformt und geschaffen“ erhält die Unterscheidung von πλάσας und δημιουργήσας. „Wohltaten“ ist für εὐεργεσίαι besonders passend und bewahrt gegenüber „Gaben“ den Charakter erwiesener Wohltätigkeit. Die Gottesbezeichnung wird nicht über den Wortlaut hinaus expliziert.
