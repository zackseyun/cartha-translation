source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: de
  text: Der Starke soll für den Schwachen sorgen, der Schwache aber den Starken achten. Der Reiche soll den Armen unterstützen, der Arme aber Gott danken, weil er ihm jemanden gegeben hat, durch den seinem Mangel abgeholfen werden kann.[a] Der Weise soll seine Weisheit nicht durch Worte zeigen, sondern durch gute Taten. Wer demütig gesinnt ist, soll nicht für sich selbst Zeugnis ablegen, sondern es einem anderen überlassen, für ihn Zeugnis abzulegen. Wer rein im Leib ist, soll sich dessen nicht rühmen; denn er weiß, dass es ein anderer ist, der ihm die Selbstbeherrschung schenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier zugrunde gelegte griechische Wortlaut ist offenbar gestört. Die Übersetzung folgt der in anderen Ausgaben bezeugten bzw. angenommenen Lesart δι’ οὗ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα: „durch den seinem Mangel abgeholfen werde“ bzw. „gedeckt werden kann“.'
    reason: Die im vorgelegten Text stehende Folge ᾧ οὐ ἀναπληρωθῇ ergibt syntaktisch und inhaltlich keinen stimmigen Satz; die genannte Lesart erklärt den Zusammenhang.
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: soll … sorgen
  rationale: Gibt die fürsorgliche Verantwortung des Starken natürlich und präzise wieder.
- source_word: ἐντρεπέσϑω
  choice: soll … achten
  rationale: Das transitive ἐντρέπομαι bezeichnet hier respektvolle Achtung, nicht bloß Furcht oder Unterordnung.
- source_word: ἐπιχορηγείτω
  choice: soll … unterstützen
  rationale: Bezeichnet das Bereitstellen dessen, was dem Armen fehlt; „unterstützen“ ist im Deutschen idiomatisch und lässt die Art der Hilfe offen.
- source_word: τὸ ὑστέρημα
  choice: Mangel
  rationale: Bewahrt den Gedanken eines konkreten Fehlbedarfs, ohne ihn auf Armut im Allgemeinen zu verengen.
- source_word: μαρτυρείτω
  choice: Zeugnis ablegen
  rationale: Erhält die bewusste Wiederholung desselben Verbstamms in beiden Satzhälften.
- source_word: ὁ ἁγνὸς ἐν τῇ σαρκὶ
  choice: wer körperlich rein lebt
  rationale: Gibt die auf den leiblichen Lebenswandel bezogene Reinheit verständlich wieder, ohne sie unnötig auf einen einzigen Bereich festzulegen.
- source_word: ἐγκράτειαν
  choice: Selbstbeherrschung
  rationale: Der etablierte deutsche Ausdruck deckt die Fähigkeit zur Beherrschung eigener Begierden ab und ist weiter als ausschließlich sexuelle Enthaltsamkeit.
theological_decisions:
- issue: Bezug von ἕτερός („ein anderer“)
  choice: „ein anderer“ kleingeschrieben und ohne ausdrückliche Identifikation
  alternative: „der Andere“ beziehungsweise ausdrückliche Identifikation mit Gott
  rationale: Der Kontext legt Gott nahe, doch der griechische Wortlaut nennt ihn in diesem Satz nicht ausdrücklich. Die Übersetzung bewahrt diese indirekte Formulierung.
- issue: Gottes Gabe an den Armen
  choice: „jemanden gegeben hat, durch den seinem Mangel abgeholfen werden kann“
  alternative: direkte Aussage, Gott selbst behebe den Mangel
  rationale: Der Gedankengang verbindet den armen Menschen mit einem von Gott gegebenen menschlichen Wohltäter; dies sollte nicht zu einer ausschließlich unmittelbaren Versorgung durch Gott umgedeutet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelen Aufforderungssätzen. Die wiederholte Struktur des Griechischen bleibt erkennbar, ohne unnatürliche deutsche Passivkonstruktionen zu erzwingen. Das generische Maskulinum der Rollenbezeichnungen wird überwiegend durch substantivierte Adjektive beziehungsweise „wer“-Sätze natürlich abgebildet.
