base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: de
  text: 'Als aber die Leute des Königs bei ihr standen und sagten: »Die Kundschafter unseres Landes sind zu dir gekommen. Bring sie heraus, denn so befiehlt es der König!«, antwortete sie: »Die Männer, die ihr sucht, sind tatsächlich zu mir gekommen; aber sie sind sofort wieder fortgegangen und auf dem Weg weitergezogen.« Währenddessen wies sie ihnen einen anderen Weg.*'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: vor ihr standen
  rationale: Das Partizip von ἐφίστημι bezeichnet hier das Herantreten bzw. Dabeistehen der königlichen Leute; die Formulierung bewahrt gegenüber einem bloßen »kamen« den räumlichen Nachdruck.
- source_word: τῶν περὶ τοῦ βασιλέως
  choice: die Leute des Königs
  rationale: Die idiomatische Wendung bezeichnet Personen aus dem Umfeld oder Dienst des Königs. »Leute des Königs« ist natürlich und legt keine genauer bestimmte Amtsfunktion fest.
- source_word: οἱ κατάσκοποι τῆς γῆς ἡμῶν
  choice: die Kundschafter unseres Landes
  rationale: »Kundschafter« gibt κατάσκοποι im erzählerischen Kontext würdig und verständlich wieder. Der Genitiv bleibt wie im Griechischen knapp und lässt sich sachgemäß als Kundschafter verstehen, die das Land auskundschaften.
- source_word: μέν
  choice: tatsächlich
  rationale: Das μέν räumt ein, dass die Männer bei ihr waren, bevor mit ἀλλά der Gegensatz folgt.
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  choice: Dabei wies sie ihnen eine andere Richtung
  rationale: Der überlieferte bzw. durch OCR normalisierte Schluss ist sprachlich auffällig; der Kontext und die konsultierte Wiedergabe weisen auf ein irreführendes Zeigen in eine andere Richtung. Die deutsche Fassung bildet diesen klaren Erzählwert ab, ohne ein unverständliches Formdetail nachzuahmen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter Rede. »Tatsächlich … aber« erhält die griechische μέν–ἀλλά-Struktur; die kurzen Hauptsätze bewahren den zügigen Fortgang der Szene.
