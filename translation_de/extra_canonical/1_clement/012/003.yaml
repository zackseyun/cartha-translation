    rationale: Die griechische Form ist attributiv (ἡ φιλόξενος Ῥαὰβ). Eine adverbiale Alternative ist zwar als freie Umformung denkbar, aber nicht als textlich gleichwertige, notwendige Lesart zu markieren.
  revised_text: So nahm die gastfreundliche Rahab sie auf und versteckte sie in einem oberen Raum unter den Flachsstängeln.
