- source_word: εἰσδεξαμένη
  choice: nahm … auf
  rationale: Das Partizip bezeichnet ihre Aufnahme der Männer; die deutsche Verbfolge gibt die Handlung natürlich wieder.
- source_word: ὑπερῷον
  choice: Obergeschoss
  rationale: Bezeichnet einen oberen Raum beziehungsweise Gebäudeteil; „Obergeschoss“ ist verständlich und vermeidet die speziellere Vorstellung eines Dachzimmers.
- source_word: λινοκαλάμην
  choice: Flachsstängeln
  rationale: Das Kollektiv bezeichnet die Stängel des Flachses, unter denen die Männer verborgen wurden.
