source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: de
  text: 'Und sie sagte zu den Männern: »Ich weiß ganz gewiss, dass der Herr, Gott, euch dieses Land übergibt; denn Furcht und Schrecken vor euch sind über die gekommen, die darin wohnen. Wenn es nun dazu kommt, dass ihr es einnehmt, rettet mich und das Haus meines Vaters.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω ἐγώ
  choice: Ich weiß ganz gewiss
  rationale: Die figura etymologica verstärkt die Gewissheit. Eine wörtliche Wiedergabe wie »wissend weiß ich« wäre im modernen Deutschen unnatürlich.
- source_word: παραδίδωσιν
  choice: übergibt
  rationale: Das Präsens und der Gedanke, dass Gott das Land in ihre Gewalt gibt, werden bewahrt, ohne die Aussage als bloße Zukunftsprognose wiederzugeben.
- source_word: ὁ φόβος καὶ ὁ τρόμος ὑμῶν
  choice: Furcht und Schrecken vor euch
  rationale: Der Genitiv bezeichnet hier am natürlichsten die durch die Männer hervorgerufene Furcht; »vor euch« macht dies im Deutschen verständlich.
- source_word: λαβεῖν
  choice: einnehmt
  rationale: Im Kontext der Inbesitznahme eines Landes gibt »einnehmen« den Sinn natürlicher und genauer wieder als das allgemeinere »nehmen«.
- source_word: διασώσατέ
  choice: rettet
  rationale: Das Verb fordert die sichere Bewahrung beziehungsweise Rettung aus der drohenden Vernichtung; »rettet« ist klar und idiomatisch.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: das Haus meines Vaters
  rationale: Die traditionelle, bewusst mehrdeutige Redeweise kann sowohl Haushalt als auch Familie umfassen und wird daher nicht auf »Familie« verengt.
theological_decisions:
- issue: Bezeichnung Gottes in κύριος ὁ θεός
  choice: der Herr, Gott
  alternative: Gott, der Herr / der Herr, unser Gott
  rationale: Die ungewöhnliche griechische Wortfolge wird ohne Ergänzung eines im Text nicht vorhandenen Possessivpronomens wiedergegeben. Das Komma lässt »Gott« als nähere Bezeichnung zu, ohne die Formulierung konfessionell auszubauen.
- issue: Göttliche Übergabe des Landes
  choice: dass der Herr, Gott, euch dieses Land übergibt
  alternative: dass der Herr, Gott, euch dieses Land geben wird
  rationale: Das griechische Präsens stellt die Übergabe als bereits wirksames Handeln Gottes dar; diese Spannung zur noch ausstehenden Einnahme bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die emphatische griechische Konstruktion wird idiomatisch verstärkt wiedergegeben; biblisch geprägte Wendungen wie »das Haus meines Vaters« bleiben erhalten.
