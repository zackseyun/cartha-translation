revisions:
- from: 'Und sie sagte zu den Männern: »Ich weiß ganz gewiss, dass der Herr, Gott, euch dieses Land übergibt; denn Furcht und Schrecken vor euch sind über seine Bewohner gekommen. Wenn es nun dazu kommt, dass ihr es einnehmt, dann rettet mich und das Haus meines Vaters.«'
  to: 'Und sie sagte zu den Männern: »Ich weiß ganz gewiss, dass der Herr, Gott, euch dieses Land übergibt; denn Furcht und Schrecken vor euch sind über die gekommen, die darin wohnen. Wenn es nun dazu kommt, dass ihr es einnehmt, rettet mich und das Haus meines Vaters.«'
  rationale: 'Die Revision beschränkt sich auf zwei sprachliche Präzisierungen: Die Bewohner werden eindeutig als Bewohner des Landes bezeichnet, und die Gottesbezeichnung wird ohne störende Kommas gesetzt. Die griechische Aussage, einschließlich ihrer zeitlichen Spannung zwischen Gottes gegenwärtigem Übergeben und der künftigen Einnahme, bleibt gewahrt.'
