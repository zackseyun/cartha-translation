id: 1CLEM.12.2
reference: 1 Clement 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: de
  text: Denn nachdem Josua, der Sohn Nuns, Kundschafter nach Jericho ausgesandt hatte, erfuhr der König des Landes, dass sie gekommen waren, um ihr Land auszukundschaften. Da sandte er Männer aus, die sie ergreifen sollten, damit sie nach ihrer Festnahme getötet würden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπεμφθέντων ... κατασκόπων
  choice: nachdem ... Kundschafter ... ausgesandt hatte
  rationale: Der absolute Genitiv wird als natürlicher deutscher Temporalsatz wiedergegeben; „Kundschafter“ ist im biblisch-historischen Zusammenhang idiomatischer als „Spione“.
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: Josua, der Sohn Nuns
  rationale: Der griechische Name Ἰησοῦ bezeichnet hier Josua; die doppelte Artikelfolge weist ihn als Sohn Nuns aus.
- source_word: ἔγνω
  choice: erfuhr
  rationale: Gibt das Bekanntwerden der Ankunft in diesem Erzählzusammenhang natürlich wieder.
- source_word: τῆς γῆς / τὴν χώραν αὐτῶν
  choice: des Landes / ihr Land
  rationale: Bewahrt die leichte lexikalische Unterscheidung zwischen γῆ und χώρα, ohne im Deutschen einen künstlichen Bedeutungsunterschied einzuführen; αὐτῶν bleibt als „ihr“ ausdrücklich erhalten.
- source_word: τοὺς συλλημψομένους αὐτούς
  choice: die sie ergreifen sollten
  rationale: Das substantivierte Futurpartizip bezeichnet den Auftrag beziehungsweise Zweck der ausgesandten Männer.
- source_word: ὅπως συλληφθέντες θανατωθῶσιν
  choice: damit sie nach ihrer Festnahme getötet würden
  rationale: Bewahrt Zweckbezug, zeitliche Abfolge und Passivformen des griechischen Ausdrucks.
