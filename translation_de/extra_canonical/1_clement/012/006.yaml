  terminology: »Gerettet« ist für διασωθήσονται im konkreten Erzählzusammenhang passend und ohne zusätzliche theologische Festlegung. »Umkommen« gibt ἀπολοῦνται klar und angemessen wieder. Es sind keine Namen oder fachterminologischen Fußnoten erforderlich.
