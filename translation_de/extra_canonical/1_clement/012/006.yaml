source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: de
  text: 'Und sie sagten zu ihr: »Es soll so sein, wie du zu uns gesagt hast. Sobald du aber erkennst, dass wir kommen, sollst du alle, die zu dir gehören, unter deinem Dach versammeln; dann werden sie gerettet. Denn alle, die außerhalb des Hauses angetroffen werden, werden umkommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται οὕτως
  choice: Es soll so geschehen
  rationale: Gibt die bestätigende Zusage idiomatisch und zugleich nahe am griechischen Futur wieder.
- source_word: ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς
  choice: Sobald du aber erkennst, dass wir kommen
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, an dem sie ihr Kommen bemerkt; »kommen« ist eine natürliche Wiedergabe von παραγίνομαι.
- source_word: πάντας τοὺς σοὺς
  choice: alle, die zu dir gehören
  rationale: Das substantivierte Possessivpronomen umfasst ihre Angehörigen bzw. die Ihren, ohne den griechischen Ausdruck unnötig auf Familie oder Volk einzuengen.
- source_word: διασωθήσονται
  choice: werden sie gerettet werden
  rationale: Bewahrt die passive Form und den starken Sinn vollständiger Rettung bzw. Bewahrung.
- source_word: ἀπολοῦνται
  choice: werden umkommen
  rationale: Entspricht dem ernsten Gegensatz zu διασωθήσονται und wahrt die Aussage des griechischen Futurs.
theological_decisions:
- issue: Bedeutungsumfang von διασωθήσονται
  choice: gerettet werden
  alternative: unversehrt bleiben / bewahrt werden
  rationale: Im erzählten Zusammenhang geht es konkret um Rettung vor dem Tod. »Gerettet werden« bewahrt zugleich die passive Ausdrucksweise, ohne eine zusätzliche heilsgeschichtliche Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Satzführung. Die Wiederholung des Futurs im abschließenden Gegensatz wurde zur Wahrung von Nachdruck und Struktur beibehalten.
