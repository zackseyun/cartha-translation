  source_fidelity: 'Der Entwurf gibt die Aussagefolge und die wesentlichen griechischen Begriffe zuverlässig wieder: die bestätigende Zusage (Ἔσται οὕτως), das Erkennen ihres Kommens, das Versammeln aller Zugehörigen unter dem eigenen Dach sowie den scharfen Gegensatz von Rettung und Untergang. »Alle, die zu dir gehören« gibt πάντας τοὺς σοὺς angemessen weit wieder. Die Änderung von »geschehen« zu »sein« ist eine nähere Wiedergabe von Ἔσται οὕτως.'
