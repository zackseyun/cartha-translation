- from: Ihr seht, Geliebte, dass in der Frau nicht nur Glaube, sondern auch prophetische Gabe[a] entstanden ist.
  to: Ihr seht, Geliebte, dass in der Frau nicht nur Glaube, sondern auch Prophetie zutage getreten ist.
  rationale: Die Revision hält die lokale Formulierung „in der Frau“ und die parallele Nennung von Glaube und Prophetie bei. „Zutage getreten ist“ gibt den perfektischen, dynamischen Sinn von γέγονεν idiomatisch wieder, ohne die Aussage auf bloßes Auffinden oder auf die Entstehung einer Fähigkeit festzulegen. Die unmarkierte Wiedergabe „Prophetie“ bleibt näher am griechischen Begriff und wahrt dessen Kontextoffenheit.
