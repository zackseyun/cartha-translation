  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: de
  text: Ihr seht, Geliebte, dass in der Frau nicht nur Glaube, sondern auch Prophetie zutage getreten ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Ihr seht
  rationale: 'Der Indikativ Präsens passt zum argumentativen Rückblick: Die Angeredeten erkennen an Rahabs Geschichte, was sich an ihr gezeigt hat.'
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die traditionelle, würdevolle Anrede gibt den substantivierten Plural wieder und bleibt im Deutschen verständlich.
- source_word: γέγονεν
  choice: entstanden ist
  rationale: Das Perfekt von γίνομαι bezeichnet hier, dass Glaube und prophetische Gabe in der Frau hervorgetreten beziehungsweise Wirklichkeit geworden sind. „Entstanden ist“ wahrt den dynamischen Sinn besser als das stärker deutende „wurde gefunden“.
- source_word: προφητεία
  choice: prophetische Gabe
  rationale: Gemeint ist in diesem Zusammenhang Rahabs prophetisch bedeutsames Reden beziehungsweise Handeln. „Prophetische Gabe“ ist idiomatischer als „Prophetie“, ohne den Begriff auf eine einzelne Vorhersage einzuengen.
- source_word: ἐν τῇ γυναικί
  choice: in der Frau
  rationale: Die lokale Formulierung des Griechischen bleibt erhalten; sie bezeichnet Rahab als die Person, in der beides hervortrat.
theological_decisions:
- issue: Verhältnis von Glaube und Prophetie bei Rahab
  choice: Beide werden parallel als in ihr entstanden dargestellt.
  alternative: Die Prophetie lediglich als Folge oder Beweis ihres Glaubens auslegen.
  rationale: Die Konstruktion οὐ μόνον … ἀλλὰ καί nennt beide ausdrücklich nebeneinander und bestimmt ihr Verhältnis nicht näher.
- issue: Bedeutungsumfang von προφητεία
  choice: „prophetische Gabe“ mit erläuternder Fußnote
  alternative: „Prophezeiung“ oder „Prophetie“
  rationale: Der griechische Ausdruck kann prophetische Rede beziehungsweise prophetisches Wirken bezeichnen. Die Übersetzung soll die Aussage nicht unnötig auf Zukunftsvorhersage verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt entsprechend dem Griechischen hervor, dass sowohl Glaube als auch prophetische Gabe in Rahab hervortraten.
