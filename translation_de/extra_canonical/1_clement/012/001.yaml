  text: Durch Glauben und Gastfreundschaft wurde Rahab, die Prostituierte, gerettet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πίστιν καὶ φιλοξενίαν
  choice: Durch Glauben und Gastfreundschaft
  rationale: Διά mit Akkusativ bezeichnet hier den Grund beziehungsweise das Mittel; die knappe Parallelstruktur des Griechischen bleibt erhalten.
- source_word: ἐσώθη
  choice: wurde … gerettet
  rationale: Gibt den Aorist Passiv von σῴζω natürlich und ohne ausdrückliche Nennung des Handelnden wieder.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: Rahab, die Prostituierte
  rationale: Bewahrt Namen und Apposition; „Prostituierte“ ist eine sachliche, moderne Entsprechung für πόρνη.
theological_decisions:
- issue: Verhältnis von Glauben und Gastfreundschaft zu Rahabs Rettung
  choice: Die beiden Größen werden gleichgeordnet als Grund beziehungsweise Mittel genannt.
  alternative: Die Gastfreundschaft lediglich als nachgeordneten Beweis des Glaubens auslegen.
  rationale: Der griechische Satz verbindet πίστιν und φιλοξενίαν ausdrücklich mit καί und erläutert ihr theologisches Verhältnis nicht weiter; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Knappe, würdevolle Standardsprache; nahe an der griechischen Satzstruktur und zugleich natürlich im modernen Deutsch.
