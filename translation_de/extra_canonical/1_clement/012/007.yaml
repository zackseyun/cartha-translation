source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ προσέθεντο αὐτῇ δοῦναι σημεῖον, ὅπως ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς κόκκινον, πρόδηλον ποιοῦντες, ὅτι διὰ τοῦ αἵματος τοῦ κυρίου λύτρωσις ἔσται πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: de
  text: 'Und sie gaben ihr ein Zeichen[a]: Sie sollte etwas Scharlachrotes an ihrem Haus herabhängen lassen; damit machten sie deutlich, dass es durch das Blut des Herrn Erlösung geben wird für alle, die an Gott glauben und auf ihn hoffen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und sie fügten hinzu, ihr ein Zeichen zu geben.“ Die semitisch geprägte griechische Wendung kann ein anschließendes Handeln bezeichnen.'
    reason: Die Anmerkung bewahrt die formale Gestalt der Wendung, ohne die Haupttextwiedergabe „gaben“ als bloße zukünftige Zusage misszuverstehen.
lexical_decisions:
- source_word: προσέθεντο ... δοῦναι
  choice: gaben ... außerdem
  rationale: Die semitisch geprägte Verbindung bezeichnet hier ein zusätzliches beziehungsweise anschließendes Handeln. Die Wiedergabe ist natürliches Deutsch und vermeidet den unzutreffenden Eindruck einer bloßen Zusage für die Zukunft.
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ bewahrt sowohl die konkrete Erkennungsfunktion als auch die im folgenden Satz entfaltete symbolische Bedeutung.
- source_word: κόκκινον
  choice: etwas Scharlachrotes
  rationale: Das substantivierte Adjektiv nennt die scharlachrote Sache, ohne ihren im griechischen Text nicht ausdrücklich angegebenen Gegenstand als Schnur oder Band festzulegen.
- source_word: λύτρωσις
  choice: Erlösung
  rationale: Der Ausdruck bezeichnet Befreiung durch Loskauf und passt zum ausdrücklich genannten Blut des Herrn.
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: die an Gott glauben und auf ihn hoffen
  rationale: Die idiomatische deutsche Formulierung gibt beide Partizipien wieder und behält Gott als gemeinsamen Bezugspunkt bei.
theological_decisions:
- issue: Typologische Deutung des scharlachroten Zeichens
  choice: „Damit machten sie deutlich, dass es durch das Blut des Herrn Erlösung geben wird“
  alternative: Die Aussage als bloßen rückblickenden Vergleich oder als unmittelbare Rede der Männer formulieren
  rationale: Das pluralische Partizip πρόδηλον ποιοῦντες wird als Aussage des Autors über die zeichenhafte Bedeutung wiedergegeben. Die Zukunftsaussage und der Bezug auf das Blut des Herrn bleiben unangetastet.
- issue: Umfang der Erlösungsaussage
  choice: „für alle, die an Gott glauben und auf ihn hoffen“
  alternative: „für alle Menschen“ oder eine konfessionell näher bestimmte Gruppe
  rationale: πᾶσι wird durch die beiden Partizipien näher bestimmt; weder Universalismus noch eine engere konfessionelle Definition wird in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Etwas Scharlachrotes“ vermeidet eine sachlich nicht ausdrücklich belegte Ergänzung wie „Schnur“. Der Doppelpunkt gliedert die Anweisung klar; „heraushängen lassen“ gibt die räumliche Vorstellung von ἐκκρεμάσῃ ἐκ τοῦ οἴκου natürlich wieder.
