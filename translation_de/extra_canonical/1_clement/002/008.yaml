  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: de
  text: Mit einem ehrwürdigen Lebenswandel geschmückt, vollbrachtet ihr alles in Ehrfurcht vor ihm; die Gebote und Satzungen des Herrn waren auf die Tafeln eures Herzens geschrieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die breiten Flächen eures Herzens“; „Tafeln“ gibt das Bild des Einschreibens idiomatisch wieder.'
    reason: Die Anmerkung dokumentiert πλάτη („breite Flächen“), ohne die idiomatische Wiedergabe „Tafeln“ als zwingende Bedeutung auszugeben.
lexical_decisions:
- source_word: πολιτείᾳ
  choice: Lebenswandel
  rationale: Das Wort kann Bürgerleben, Lebensführung oder Verhalten bezeichnen. Im Zusammenhang beschreibt es die gesamte Lebensweise der Gemeinde; „Lebenswandel“ gibt dies in würdigem, verständlichem Deutsch wieder.
- source_word: πάντα … ἐτελεῖτε
  choice: tatet ihr alles
  rationale: Die reguläre Lesart hinter dem fehlerhaften OCR-Text bedeutet, dass die Adressaten alles ausführten oder erfüllten. „tatet ihr alles“ bewahrt die Weite der Aussage, ohne ein bestimmtes Objekt zu ergänzen.
- source_word: ἐν φόβῳ αὐτοῦ
  choice: in Ehrfurcht vor ihm
  rationale: φόβος kann Furcht bedeuten, bezeichnet hier aber die religiöse Haltung gegenüber Gott. „Ehrfurcht“ trifft diesen Sinn natürlicher als bloße Angst.
- source_word: τὰ δικαιώματα
  choice: Rechtsordnungen
  rationale: δικαιώματα bezeichnet verbindliche, rechtmäßige Satzungen oder Forderungen. „Rechtsordnungen“ unterscheidet den Ausdruck von den zuvor genannten Geboten und vermeidet eine unnötige dogmatische Festlegung.
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας
  choice: auf die Tafeln eures Herzens
  rationale: Wörtlich geht es um die breiten Flächen des Herzens. Die Formulierung greift jedoch die biblische Vorstellung vom Einschreiben auf Herzenstafeln auf; „Tafeln“ macht das Bild im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: Ehrfurcht vor ihm
  alternative: Furcht vor ihm
  rationale: Der Kontext lobt eine fromme Lebenshaltung. „Ehrfurcht“ vermittelt dies, ohne die im griechischen φόβος enthaltene Ernsthaftigkeit aufzuheben.
- issue: Verbindlichkeit von δικαιώματα
  choice: Rechtsordnungen
  alternative: gerechte Forderungen
  rationale: Die substantivische Bedeutung als göttliche Satzungen bleibt erhalten; eine Deutung im Sinn einer besonderen Rechtfertigungslehre wird vermieden.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Der Satzbau wahrt den feierlichen Lobton des griechischen Textes; traditionelle biblische Bildsprache bleibt verständlich erhalten.
