id: 1CLEM.2.3
reference: 1 Clement 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: de
  text: Und erfüllt von heiligem Vorsatz, strecktet ihr mit gutem Eifer und frommer Zuversicht eure Hände zu Gott, dem Allmächtigen, aus und flehtet ihn an, sich gnädig zu erweisen, falls ihr euch in irgendeiner Hinsicht unabsichtlich[a] versündigt hattet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ohne es zu wollen.'
    reason: ἀκόντες kann neben fehlender Absicht auch den mangelnden Willen zur Tat hervorheben; die Alternative bewahrt diese Nuance, ohne Zwang zu unterstellen.
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: heiligem Vorsatz
  rationale: βουλή bezeichnet hier eine innere Ausrichtung bzw. einen Vorsatz; »Vorsatz« gibt dies im Zusammenhang natürlicher wieder als das stärker beratungsbezogene »Rat«.
- source_word: ἐν ἀγαθῇ προθυμίᾳ
  choice: mit gutem Eifer
  rationale: προθυμία bezeichnet Bereitwilligkeit und Eifer; »guter Eifer« bewahrt die positive Wertung von ἀγαθή und passt zum würdevollen Register.
- source_word: μετ’ εὐσεβοῦς πεποιθήσεως
  choice: mit frommer Zuversicht
  rationale: εὐσεβής bezeichnet hier gottesfürchtige Frömmigkeit, πεποίθησις vertrauensvolle Gewissheit bzw. Zuversicht.
- source_word: τὸν παντοκράτορα θεόν
  choice: Gott, dem Allmächtigen
  rationale: Die Apposition ist idiomatisches Deutsch und bewahrt sowohl θεός als auch den Hoheitstitel παντοκράτωρ.
- source_word: ἵλεων γενέσθαι
  choice: sich gnädig zu erweisen
  rationale: Die Wendung bittet um Gottes gnädige Haltung; diese Formulierung ist natürlich und hält zugleich das dynamische γενέσθαι fest.
- source_word: ἀκόντες
  choice: unabsichtlich
  rationale: Im Zusammenhang mit ἁμαρτάνω bezeichnet ἄκων ein nicht vorsätzliches, unbeabsichtigtes Sündigen; »unabsichtlich« vermeidet den irreführenden Eindruck äußeren Zwangs.
theological_decisions:
- issue: Art der erwähnten Sünde
  choice: unabsichtlich
  alternative: ohne es zu wollen
  rationale: Der Text unterscheidet nicht weiter zwischen Irrtum, Unwissenheit und fehlendem Vorsatz. Die Übersetzung belässt diese Breite und legt keine besondere Sündenlehre fest.
- issue: Bedingung εἴ τι ἡμάρτετε
  choice: falls ihr euch in irgendeiner Hinsicht … versündigt hattet
  alternative: wenn ihr irgendetwas … gesündigt hattet
  rationale: Die bedingte Form wird bewahrt, ohne daraus eine Aussage über tatsächliche Sündlosigkeit oder Schuldlosigkeit der Adressaten abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, wurde aber für gute deutsche Lesbarkeit geordnet. Das traditionelle Gebetsbild des Ausstreckens der Hände bleibt unverändert erhalten.
