  text: Jede Zwietracht und jede Spaltung war euch ein Gräuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα στάσις
  choice: jede Zwietracht
  rationale: στάσις bezeichnet hier inneren Streit, Parteiung oder Aufruhr. „Zwietracht“ gibt den gemeinschaftszerstörenden Konflikt natürlich wieder, ohne den Sinn auf politischen Aufstand zu verengen.
- source_word: πᾶν σχίσμα
  choice: jede Spaltung
  rationale: σχίσμα meint einen Riss beziehungsweise eine Trennung innerhalb der Gemeinschaft. „Spaltung“ ist im modernen Deutsch klarer und natürlicher als das fachsprachliche „Schisma“.
- source_word: βδέλυκτον
  choice: ein Gräuel
  rationale: Das starke Werturteil bezeichnet etwas Abscheuliches oder Verabscheuungswürdiges. Die idiomatische Wendung „jemandem ein Gräuel sein“ bewahrt Intensität und Würde.
- source_word: ἦν ὑμῖν
  choice: war euch
  rationale: Der Dativ bezeichnet, wie die Adressaten Zwietracht und Spaltung bewerteten; die deutsche Wendung „war euch ein Gräuel“ bildet dies knapp und idiomatisch ab.
theological_decisions: []
translation_notes:
  register: Kurzer, würdiger und allgemein verständlicher Satz. Die Wiederholung „jede … und jede …“ bewahrt die emphatische Parallelstruktur des Griechischen.
