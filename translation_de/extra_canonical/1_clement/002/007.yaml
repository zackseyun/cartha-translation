  text: ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενϑεῖτε· τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε. ἀγαθοποιοί, ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: de
  text: Ihr trauertet über die Verfehlungen eurer Nächsten; ihre Mängel betrachtetet ihr als eure eigenen. Ihr tatet Gutes[a] und wart zu jedem guten Werk bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr wart wohltätig und zu jedem guten Werk bereit.“'
    reason: ἀγαθοποιοί ist ein prädikatives Adjektiv bzw. substantivisch verwendeter Ausdruck („Gutes tuend“, „wohltätig“). Die Alternative zeigt diese mögliche deutsche Fassung, ohne eine Umschreibung fälschlich als wörtlicher zu bezeichnen.
lexical_decisions:
- source_word: παραπτώμασιν
  choice: Verfehlungen
  rationale: Gibt den Sinn von Fehltritten oder Übertretungen verständlich wieder, ohne ihn unnötig auf eine bestimmte Art von Sünde einzuengen.
- source_word: πλησίον
  choice: Nächsten
  rationale: Entspricht dem üblichen zwischenmenschlichen Sinn des griechischen Ausdrucks und bewahrt seinen ethischen Klang.
- source_word: ὑστερήματα
  choice: Mängel
  rationale: Bezeichnet hier das, was anderen fehlt oder worin sie zurückbleiben; „Mängel“ hält diese Bedeutungsbreite offen.
- source_word: ἐκρίνετε
  choice: betrachtetet
  rationale: Im Zusammenhang bedeutet das Verb, dass die Adressaten die Mängel der anderen als ihre eigenen ansahen; „betrachtetet“ klingt im Deutschen natürlicher als das wörtlichere „urteiltet“.
- source_word: ἀγαθοποιοί
  choice: Ihr tatet Gutes
  rationale: Das nominativische Adjektiv bezeichnet Menschen, die Gutes tun. Die finite deutsche Form ergibt einen natürlichen vollständigen Satz und nimmt die Anrede im Plural auf.
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: zu jedem guten Werk bereit
  rationale: Nahe, idiomatische Wiedergabe der Bereitschaft zu jeder guten Tat.
theological_decisions:
- issue: Beziehung zu den Mängeln der Nächsten
  choice: ihre Mängel betrachtetet ihr als eure eigenen
  alternative: ihre Mängel beurteiltet ihr als eure eigenen
  rationale: Die gewählte Fassung betont solidarische Anteilnahme, ohne aus dem Verb eine förmliche Verurteilung zu machen.
- issue: Verbloser Ausdruck ἀγαθοποιοί
  choice: Ihr tatet Gutes
  alternative: Wohltätig, zu jedem guten Werk bereit
  rationale: Der griechische Ausdruck kann prädikativ oder substantivisch verstanden werden. Im Deutschen wird das im Kontext implizite „ihr wart“ sinngemäß entfaltet, ohne eine besondere theologische Aussage hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Anrede „ihr“ und die Vergangenheitsformen bewahren den rückblickenden Ton; der letzte verbloste griechische Satzteil wird für ein flüssiges deutsches Verständnis als vollständiger Satz wiedergegeben.
