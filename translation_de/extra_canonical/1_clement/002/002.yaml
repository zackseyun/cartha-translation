source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως εἰρήνη βαϑεῖα καὶ λιπαρὰ ἐδέδοτο πᾶσιν καὶ ἀκόρεστος πόϑος εἰς ἀγαϑοποιΐαν, καὶ πλήρης πνεύματος ἁγίου ἐπέχυσις ἐπὶ πάντας ἐγίνετο·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
translation:
  language: de
  text: So waren allen tiefer und reicher Frieden sowie ein unstillbares Verlangen, Gutes zu tun, geschenkt worden, und eine volle Ausgießung des Heiligen Geistes kam über alle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη βαθεῖα καὶ λιπαρά
  choice: tiefer und reicher Frieden
  rationale: βαθεῖα bezeichnet die Tiefe des Friedens; λιπαρά bedeutet wörtlich „fett“ und übertragen „reich, üppig“. „Reich“ gibt das Bild in natürlichem, würdigem Deutsch wieder.
- source_word: ἐδέδοτο
  choice: war … geschenkt worden
  rationale: Das Plusquamperfekt Passiv beschreibt den Frieden als etwas, das zuvor gegeben worden war. „Geschenkt“ klingt bei Frieden natürlicher als das streng wörtliche „gegeben“, ohne den Sinn zu verändern.
- source_word: ἀκόρεστος πόθος εἰς ἀγαθοποιΐαν
  choice: ein unstillbares Verlangen, Gutes zu tun
  rationale: ἀκόρεστος ist „unstillbar, unersättlich“, πόθος ein starkes Verlangen und ἀγαθοποιΐα das Tun des Guten.
- source_word: πλήρης πνεύματος ἁγίου ἐπέχυσις
  choice: eine Fülle des Heiligen Geistes
  rationale: Die griechische Wendung bezeichnet wörtlich eine „volle Ausgießung des Heiligen Geistes“. Im Zusammenhang mit ἐπὶ πάντας ἐγίνετο wird sie idiomatisch als eine über alle kommende Fülle wiedergegeben.
- source_word: ἐπὶ πάντας ἐγίνετο
  choice: kam … über alle
  rationale: Die Verlaufsform ἐγίνετο beschreibt das Geschehen in der damaligen Gemeinschaft; „kam über alle“ bewahrt die räumliche Präposition ἐπί und klingt natürlich.
theological_decisions:
- issue: Charakter der Ausgießung des Heiligen Geistes
  choice: auch kam eine Fülle des Heiligen Geistes über alle
  alternative: auch erfolgte über allen eine volle Ausgießung des Heiligen Geistes
  rationale: Die gewählte Formulierung bewahrt die Aussage, dass der Heilige Geist alle erfasste, ohne Art, Dauer oder besondere charismatische Erscheinungsform näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte griechische Satzstruktur wird leicht geglättet, damit deutlich bleibt, dass sowohl der Frieden als auch das Verlangen und die Fülle die ganze Gemeinschaft kennzeichneten. Keine Fußnote ist erforderlich.
