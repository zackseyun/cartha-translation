  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: de
  text: Tag und Nacht habt ihr für die ganze Bruderschaft gerungen,[a] damit die Zahl seiner Erwählten mit Erbarmen und Gewissen gerettet würde.[b]
  philosophy: optimal-equivalence
