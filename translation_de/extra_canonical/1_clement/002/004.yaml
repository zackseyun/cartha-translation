lexical_decisions:
- source_word: ἀγών (im überlieferten Funk-Text; im vorgelegten normalisierten OCR-Text ausgefallen)
  choice: gerungen
  rationale: 'Das Verb gibt die Intensität des substantivischen Ausdrucks ἀγὼν ἦν ὑμῖν natürlich wieder und passt zu ὑπέρ: ein Ringen zugunsten der ganzen Bruderschaft.'
- source_word: ἀδελφότης
  choice: Bruderschaft
  rationale: Bezeichnet hier die gesamte Gemeinschaft der Glaubensgeschwister; „Bruderschaft“ wahrt den kollektiven Charakter des griechischen Ausdrucks.
- source_word: ὁ ἀριθμὸς τῶν ἐκλεκτῶν αὐτοῦ
  choice: die Schar seiner Erwählten
  rationale: Wörtliches „die Zahl“ klingt im Deutschen primär rechnerisch. „Schar“ bezeichnet natürlich die Gesamtheit, ohne die Vorstellung einer von Gott bestimmten Zahl auszuschließen.
- source_word: μετ’ ἐλέους καὶ συνειδήσεως
  choice: mit Erbarmen und Gewissenhaftigkeit
  rationale: „Erbarmen“ entspricht ἔλεος. „Gewissenhaftigkeit“ wahrt den Bezug von συνείδησις zum Gewissen, ohne das im Griechischen nicht ausdrücklich vorhandene Adjektiv „gut“ zu ergänzen.
theological_decisions:
- issue: Bezug von αὐτοῦ („seiner“)
  choice: Das Pronomen bleibt ohne erläuternden Namenszusatz stehen.
  alternative: „Gottes Erwählten“
  rationale: Der unmittelbare Ausschnitt nennt den Bezugsinhaber nicht ausdrücklich; die Übersetzung bewahrt diese grammatische Gegebenheit, statt ihn stillschweigend festzulegen.
- issue: Agens und genaue Funktion von „mit Erbarmen und Gewissenhaftigkeit“
  choice: Die Präpositionalgruppe bleibt eng beim Rettungsvorgang und grammatisch offen.
  alternative: „damit ihr durch eure barmherzige und gewissenhafte Fürsorge … rettet“
  rationale: Der griechische Passivinfinitiv σώζεσθαι nennt das rettende Agens nicht. Eine ausdrückliche Zuweisung an die Gemeinde oder an Gott würde die theologische und syntaktische Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gerungen“ bewahrt die Intensität des wahrscheinlich durch OCR ausgefallenen ἀγών. Die etwas ungewöhnliche Verbindung „mit Erbarmen und Gewissenhaftigkeit“ wurde beibehalten, um die knappe und mehrdeutige griechische Formulierung nicht durch zusätzliche Akteure oder Wertungen zu vereindeutigen.
