  naturalness: Der würdige, moderne Registerton ist gelungen. „Rühmtet euch keiner Sache“ wirkt jedoch unidiomatisch; „ohne euch etwas zugutezuhalten“ ist natürlich und trifft den Sinn von ἀλαζονευόμενοι. Die korrigierte Gegenüberstellung von Unterordnung und Unterwerfen ist klar und flüssig.
  terminology: „Christus“, „Leiden“ und „zu Herzen genommen“ sind angemessen. Die Fußnote zu σπλάγχνα erklärt das antike Körperbild sachlich. „Wegzehrung Christi“ bewahrt die Bildlichkeit von ἐφόδια und lässt die genitivische Beziehung offen.
