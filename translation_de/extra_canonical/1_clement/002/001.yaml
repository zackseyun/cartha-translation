  - severity: medium
    issue: „als andere euch zu unterwerfen“ ist syntaktisch mehrdeutig.
    rationale: 'Es kann so verstanden werden, als ob andere die Angeredeten unterwerfen. Gemeint ist der Kontrast: sich selbst unterordnen statt andere unterwerfen.'
