revisions:
- from: Ihr alle wart demütig gesinnt und rühmtet euch keiner Sache. Ihr ordnetet euch lieber unter, als andere euch zu unterwerfen, und hattet mehr Freude am Geben als am Nehmen. Zufrieden mit dem, was Christus euch als Wegzehrung gab, und aufmerksam auf seine Worte, hattet ihr sie euch sorgfältig zu Herzen[a] genommen; seine Leiden standen euch vor Augen.
  to: Ihr alle wart demütig gesinnt, ohne euch etwas zugutezuhalten. Ihr ordnetet euch lieber unter, als andere zu unterwerfen, und hattet mehr Freude am Geben als am Nehmen. Mit Christi Wegzehrung zufrieden und aufmerksam auf seine Worte, hattet ihr sie euch sorgfältig zu Herzen[a] genommen; seine Leiden standen euch vor Augen.
  rationale: Die Revision beseitigt die syntaktische Mehrdeutigkeit beim Unterwerfen, ersetzt eine unidiomatische Prahlerei-Formulierung und wahrt bei τοῖς ἐφοδίοις τοῦ Χριστοῦ die offene Genitivbeziehung, ohne eine bestimmte Herkunfts- oder Sakramentsdeutung festzulegen. Satzstruktur, Rückblickcharakter und die Metapher von σπλάγχνα bleiben erhalten.
