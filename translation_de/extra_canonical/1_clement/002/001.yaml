reference: 1 Clement 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: de
  text: Ihr alle wart demütig gesinnt, ohne euch etwas zugutezuhalten. Ihr ordnetet euch lieber unter, als andere zu unterwerfen, und hattet mehr Freude am Geben als am Nehmen. Mit Christi Wegzehrung zufrieden und aufmerksam auf seine Worte, hattet ihr sie euch sorgfältig zu Herzen[a] genommen; seine Leiden standen euch vor Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in eurem Innersten“ oder „in euren inneren Organen“; diese galten als Sitz tiefer Empfindungen.'
    reason: Die idiomatische Übersetzung „zu Herzen genommen“ ist verständlich, während die Fußnote das konkrete griechische Körperbild von σπλάγχνα sichtbar hält.
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: wart demütig gesinnt
  rationale: Gibt die innere Haltung der Demut wieder und bewahrt den durativen Rückblick des Imperfekts.
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: Ihr ordnetet euch lieber unter, als andere euch zu unterwerfen
  rationale: Macht den im Griechischen knappen Gegensatz zwischen eigener Unterordnung und dem Unterwerfen anderer auf natürliches Deutsch verständlich.
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: mit dem, was Christus euch als Wegzehrung gab
  rationale: ἐφόδια bezeichnet Vorrat oder Ausstattung für den Weg. „Wegzehrung“ erhält dieses Bild; die Umschreibung vermeidet eine unnatürliche Formulierung wie „mit den Vorräten Christi“.
- source_word: ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  choice: euch ... zu Herzen genommen
  rationale: Die anatomische Metapher bezeichnet das tiefe Innere als Sitz von Empfindung und innerer Aneignung. Die deutsche Wendung gibt diese Funktion idiomatisch wieder.
- source_word: τὰ παθήματα αὐτοῦ
  choice: seine Leiden
  rationale: Der Plural bezeichnet die erlittenen Leiden Christi; „Leiden“ bewahrt im Deutschen sowohl den kollektiven als auch den mehrteiligen Sinn.
theological_decisions:
- issue: Genitiv in τοῖς ἐφοδίοις τοῦ Χριστοῦ
  choice: was Christus euch als Wegzehrung gab
  alternative: Christi Wegzehrung / die Wegzehrung für Christus
  rationale: Der Genitiv kann Zugehörigkeit oder Herkunft ausdrücken. Der Zusammenhang mit seinen Worten legt das von Christus Empfangene nahe, ohne die Wegmetapher auf eine bestimmte sakramentale Deutung festzulegen.
- issue: Bezug der Leiden Christi
  choice: seine Leiden standen euch vor Augen
  alternative: ihr saht sein Leiden vor euch
  rationale: Der Plural des griechischen Textes bleibt durch das pluralisch gebrauchte deutsche „Leiden“ erhalten; die Formulierung lässt offen, ob geistige Vergegenwärtigung, Erinnerung oder Vorbildcharakter im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um die lange griechische Partizipialkonstruktion gut lesbar zu machen. Wiederholte Imperfektformen erhalten den rückblickenden Charakter des Abschnitts.
