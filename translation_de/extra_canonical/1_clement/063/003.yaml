id: 1CLEM.63.3
reference: 1 Clement 63:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: de
  text: Wir haben aber treue und besonnene Männer gesandt, die von ihrer Jugend bis ins Alter untadelig unter uns gelebt haben; sie werden auch Zeugen zwischen euch und uns sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: treue
  rationale: Gibt hier die Zuverlässigkeit und bewährte Loyalität der entsandten Männer natürlich wieder, ohne den Begriff auf eine bloße Glaubensbezeichnung zu verengen.
- source_word: σώφρονας
  choice: besonnene
  rationale: Bewahrt den Sinn von Selbstbeherrschung, vernünftigem Urteil und charakterlicher Umsicht in einer geläufigen deutschen Formulierung.
- source_word: ἀναστραφέντας
  choice: gelebt haben
  rationale: Das Verb bezeichnet hier den Lebenswandel beziehungsweise die Lebensführung; „gelebt haben“ ist im Zusammenhang natürlich und wird durch „untadelig“ näher bestimmt.
- source_word: ἀμέμπτως
  choice: untadelig
  rationale: Entspricht der Aussage eines Lebenswandels, an dem kein berechtigter Tadel haftet.
- source_word: μάρτυρες
  choice: Zeugen
  rationale: Die formale Wiedergabe erhält offen, ob vor allem an persönliche Bestätigung, Vermittlung oder die Bezeugung der weiteren Vorgänge gedacht ist.
theological_decisions:
- issue: Funktion der Gesandten als Zeugen
  choice: „Zeugen zwischen euch und uns“
  alternative: „Gewährsleute für euch und uns“ oder „Vermittler zwischen euch und uns“
  rationale: Die wörtlich-nahe Fassung bewahrt die offene Bedeutung von μάρτυρες und μεταξὺ und legt die konkrete kirchliche Funktion der Männer nicht enger fest, als es der griechische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Aussage des griechischen Textes. „Bis ins hohe Alter“ gibt γήρους idiomatisch wieder; das Perfekt „gelebt haben“ passt zur gegenwärtigen Entsendung und zur rückblickenden Charakterisierung.
