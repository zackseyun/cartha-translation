revisions:
- from: Darum ist es angemessen, dass wir, nachdem wir uns an solchen und so zahlreichen Vorbildern orientiert haben, den Nacken beugen, unseren Platz im Gehorsam einnehmen und still werden, damit wir von dem nichtigen Aufruhr ablassen und ohne jeden Tadel zu dem Ziel gelangen, das uns in Wahrheit vor Augen steht.[a]
  to: Darum ist es angemessen, dass wir, nachdem wir uns solchen und so zahlreichen Vorbildern zugewandt haben, den Nacken beugen, den Platz des Gehorsams ausfüllen und zur Ruhe kommen, damit wir, nachdem wir den sinnlosen Streit beendet haben, ohne jeden Tadel das uns vor Augen liegende Ziel in Wahrheit erreichen.[a]
  rationale: Die Revision folgt dem vollständigen kritischen Wortlaut, der wegen der dokumentierten OCR-Haplographie heranzuziehen ist. Sie verbessert die Wiedergabe von ἀναπληρόω und στάσις, ohne den Sinn zu erweitern, und lässt die syntaktische Reichweite von ἐν ἀληθείᾳ möglichst offen. Die Fußnote bleibt erforderlich, da der bereitgestellte griechische OCR-Text den zentralen Satzteil nicht vollständig enthält.
