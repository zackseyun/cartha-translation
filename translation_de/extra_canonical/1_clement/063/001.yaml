base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: de
  text: Darum ist es angemessen, dass wir, nachdem wir uns solchen und so zahlreichen Vorbildern zugewandt haben, den Nacken beugen, den Platz des Gehorsams ausfüllen und zur Ruhe kommen, damit wir, nachdem wir den sinnlosen Streit beendet haben, ohne jeden Tadel das uns vor Augen liegende Ziel in Wahrheit erreichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der bereitgestellte normalisierte OCR-Text ist an dieser Stelle beschädigt und lässt mehrere Wörter aus. Die Übersetzung folgt dem vollständig überlieferten kritischen Text: „den Platz des Gehorsams ausfüllen und zur Ruhe kommen, damit wir, nachdem wir den sinnlosen Streit beendet haben, …“'
    reason: source_text_corruption
lexical_decisions:
- source_word: Θεμιτὸν
  choice: es ist angemessen
  rationale: Gibt die Bedeutung von etwas Geziemendem oder Angebrachtem in natürlichem, würdigem Deutsch wieder.
- source_word: τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας
  choice: nachdem wir uns an solchen und so zahlreichen Vorbildern orientiert haben
  rationale: προσέρχομαι bezeichnet hier das Herantreten bzw. Sich-Zuwenden zu den zuvor genannten Beispielen; „sich orientieren an“ macht ihre Vorbildfunktion im Deutschen deutlich, ohne sie als bloße räumliche Annäherung wiederzugeben.
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: den Nacken beugen
  rationale: Bewahrt das anschauliche griechische Bild der demütigen Unterordnung.
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: unseren Platz im Gehorsam einnehmen
  rationale: Gibt die idiomatische Bedeutung des Ausfüllens bzw. Einnehmens eines zugewiesenen Platzes wieder und vermeidet das im Deutschen unnatürliche „den Platz erfüllen“.
- source_word: ἡσυχάσαι
  choice: still werden
  rationale: Bezeichnet im Zusammenhang das Ende des streitsüchtigen Handelns, nicht lediglich äußere Geräuschlosigkeit.
- source_word: τῆς ματαίας στάσεως
  choice: von dem nichtigen Aufruhr
  rationale: στάσις bezeichnet Zwietracht, Aufruhr oder Parteienstreit; „Aufruhr“ bewahrt die Schärfe des Vorwurfs, während „nichtig“ ματαίας entspricht.
- source_word: σκοπὸν
  choice: Ziel
  rationale: Bezeichnet das vor Augen liegende Ziel, auf das das Handeln ausgerichtet ist.
- source_word: δίχα παντὸς μώμου
  choice: ohne jeden Tadel
  rationale: Formale und idiomatische Wiedergabe der Forderung, untadelig zum Ziel zu gelangen.
theological_decisions:
- issue: Charakter des Gehorsams
  choice: „unseren Platz im Gehorsam einnehmen“
  alternative: „die Aufgabe des Gehorsams erfüllen“
  rationale: Die gewählte Formulierung bewahrt die räumliche Metapher von τόπος und lässt offen, wie dieser Gehorsam konkret institutionell oder geistlich zu bestimmen ist.
- issue: Bezug von ἐν ἀληθείᾳ
  choice: „das uns in Wahrheit vor Augen steht“
  alternative: „in Wahrheit ... zu dem Ziel gelangen“
  rationale: Die griechische Stellung lässt den Bezug nicht völlig zweifelsfrei erkennen. Die Übersetzung verbindet die Wendung, dem überlieferten Wortlaut entsprechend, eng mit dem vor uns liegenden Ziel, ohne daraus eine besondere dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom gebeugten Nacken bleibt erhalten; schwer verständliche griechische Wendungen werden maßvoll idiomatisiert. Die zentrale Aufforderung, den Aufruhr zu beenden, wird aufgrund des vollständigen kritischen Textes aufgenommen.
