    issue: ἀναπληρώσαντας wird mit „unseren Platz im Gehorsam einnehmen“ nicht vollständig erfasst.
    rationale: „Einnehmen“ bezeichnet vor allem das Antreten oder Besetzen eines Platzes, während ἀναπληρόω dessen Ausfüllen bzw. Erfüllen bezeichnet. „Den Platz des Gehorsams ausfüllen“ bewahrt die Metapher und den Vollzugsaspekt.
  - severity: low
    issue: „nichtiger Aufruhr“ ist für τῆς ματαίας στάσεως enger und politischer als erforderlich.
    rationale: στάσις kann Aufruhr bedeuten, bezeichnet in diesem Brief aber besonders Streit, Zwietracht und Parteiung. „Sinnloser Streit“ ist im Deutschen natürlich und wahrt die semantische Breite.
  - severity: low
    issue: Der Bezug von ἐν ἀληθείᾳ wird in der vorliegenden Form dem Ziel zugeschrieben.
    rationale: Die Verbindung „das uns in Wahrheit vor Augen steht“ entscheidet die nicht ganz eindeutige griechische Anbindung. Die Revision positioniert „in Wahrheit“ beim Erreichen und vermeidet damit eine unnötig feste Deutung.
