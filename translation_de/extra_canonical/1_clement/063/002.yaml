id: 1CLEM.63.2
reference: 1 Clement 63:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: de
  text: Denn ihr werdet uns Freude und Jubel bereiten, wenn ihr dem gehorcht, was wir durch den Heiligen Geist geschrieben haben, und den unrechtmäßigen Zorn eurer Eifersucht beseitigt, entsprechend dem Appell, den wir in diesem Brief hinsichtlich Frieden und Eintracht ausgesprochen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν ... καὶ ἀγαλλίασιν
  choice: Freude und Jubel
  rationale: Gibt die beiden abgestuften Begriffe natürlich und zugleich würdevoll wieder.
- source_word: ὑπήκοοι γενήμενοι
  choice: wenn ihr ... gehorcht
  rationale: Die idiomatische deutsche Verbform bewahrt den bedingenden Sinn des griechischen Partizips.
- source_word: ἐκκόψητε
  choice: beseitigt
  rationale: Überträgt das bildhafte ‚abschneiden/ausmerzen‘ verständlich, ohne eine körperliche Handlung nahezulegen.
- source_word: ἄθεμον
  choice: frevelhaft
  rationale: Bezeichnet hier sittlich verwerfliches, ordnungswidriges Verhalten; ‚gesetzlos‘ wäre im Deutschen leicht zu eng juristisch.
- source_word: ζήλους
  choice: Eifersucht
  rationale: Bewahrt die negative Bedeutung von ζῆλος im Kontext des streitstiftenden Affekts.
- source_word: ἔντευξιν
  choice: Bitte
  rationale: Im Kontext des Briefes bezeichnet das Wort eine eindringliche Bitte bzw. einen Appell.
- source_word: εἰρήνης καὶ ὁμονοίας
  choice: Frieden und Eintracht
  rationale: Entspricht der etablierten und natürlichen Wiedergabe des Begriffspaars.
theological_decisions:
- issue: διὰ τοῦ ἁγίου πνεύματος und der Anspruch geistgewirkten Schreibens
  choice: was wir durch den Heiligen Geist geschrieben haben
  alternative: was wir unter der Leitung des Heiligen Geistes geschrieben haben
  rationale: Die formale Wendung bewahrt den unmittelbaren instrumentalen Anspruch des griechischen Textes, ohne dessen genaue Inspirationslehre weiter auszudeuten.
- issue: Bezug von τοῖς ὑφʼ ἡμῶν γεγραμμένοις
  choice: dem ... was wir ... geschrieben haben
  alternative: den von uns geschriebenen Weisungen
  rationale: Die substantivierte griechische Form bleibt bewusst allgemein und wird nicht auf Gebote, Weisungen oder den gesamten Brief verengt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Briefstil. Der lange griechische Satz wird in seiner logischen Struktur bewahrt; die Gedankenstrichkonstruktion macht den abschließenden Bezug der Bitte lesbar. Keine konfessionelle Präzisierung des Wirkens des Heiligen Geistes.
