revisions:
- from: Denn ihr werdet uns Freude und Jubel bereiten, wenn ihr dem gehorcht, was wir durch den Heiligen Geist geschrieben haben, und den frevelhaften Zorn eurer Eifersucht beseitigt – entsprechend der Bitte um Frieden und Eintracht, die wir in diesem Brief an euch gerichtet haben.
  to: Denn ihr werdet uns Freude und Jubel bereiten, wenn ihr dem gehorcht, was wir durch den Heiligen Geist geschrieben haben, und den unrechtmäßigen Zorn eurer Eifersucht beseitigt, entsprechend dem Appell, den wir in diesem Brief hinsichtlich Frieden und Eintracht ausgesprochen haben.
  rationale: Die Revision klärt den abschließenden Bezug des Appells, ohne den Umfang dessen, was „durch den Heiligen Geist“ geschrieben wurde, oder die Art des geistgewirkten Schreibens weiter auszudeuten. Sie bewahrt die bildhafte, entschiedene Aufforderung von ἐκκόψητε mit „beseitigt“ und die im Griechischen vorliegende Ambiguität von ζῆλος als negativem Eifersuchts- bzw. Neidaffekt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:27Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den bedingenden Satzbau, den Anspruch des Schreibens „durch den Heiligen Geist“ und die Aufforderung zur Beseitigung des von Eifersucht geprägten Zorns im Wesentlichen treffend wieder. Die abschließende Wendung κατὰ τὴν ἔντευξιν bezieht sich jedoch genauer auf den im Brief ausgesprochenen Appell als auf eine „Bitte um Frieden und Eintracht“.
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „Bitte um Frieden und Eintracht, die wir ... an euch gerichtet haben“ ist semantisch etwas ungenau und stilistisch weniger glatt als eine Formulierung mit „Appell“ und „ausgesprochen“.
  terminology: „Freude und Jubel“, „Heiliger Geist“, „Eifersucht“, „Frieden und Eintracht“ sind angemessen. „Frevelhaft“ ist möglich, wirkt jedoch stärker religiös aufgeladen als das griechische ἄθεμος verlangt; „unrechtmäßig“ bewahrt den normverletzenden Sinn ohne zusätzliche theologische Konnotation.
  issues:
  - severity: medium
    issue: Der Bezug von ἔντευξιν wird als „Bitte um Frieden und Eintracht“ gefasst.
    rationale: Gemeint ist der im Brief erfolgte Appell hinsichtlich Frieden und Eintracht, nicht notwendig eine Bitte, deren Gegenstand Frieden und Eintracht wäre. Die Revision erhält diese syntaktische und semantische Unterscheidung.
  - severity: low
    issue: „frevelhaften“ verstärkt ἄθεμον unnötig religiös.
    rationale: Ἄθεμος bezeichnet etwas Unrechtmäßiges bzw. gegen die angemessene Ordnung Gehendes. „Unrechtmäßig“ ist im Deutschen präzise und weniger interpretierend.
  revised_text: Denn ihr werdet uns Freude und Jubel bereiten, wenn ihr dem gehorcht, was wir durch den Heiligen Geist geschrieben haben, und den unrechtmäßigen Zorn eurer Eifersucht beseitigt, entsprechend dem Appell, den wir in diesem Brief hinsichtlich Frieden und Eintracht ausgesprochen haben.
