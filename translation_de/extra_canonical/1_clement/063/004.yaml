source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: de
  text: Das haben wir getan, damit ihr wisst, dass unsere ganze Sorge darauf gerichtet war und noch immer ist, dass ihr bald in Frieden lebt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίς
  choice: Sorge
  rationale: „Sorge“ gibt die aufmerksame, anhaltende Anteilnahme natürlich und würdig wieder; der Zusammenhang zeigt, worauf sie gerichtet ist.
- source_word: εἰρηνεῦσαι
  choice: in Frieden lebt
  rationale: Das aktive Infinitivverb bezeichnet hier, im Frieden zu sein beziehungsweise friedlich zu leben. Die Wiedergabe wahrt die aktive Form und vermeidet die stärker deutende passive Formulierung „zum Frieden wiederhergestellt werdet“.
- source_word: ἐν τάχει
  choice: bald
  rationale: „Bald“ drückt die gewünschte zeitliche Dringlichkeit idiomatisch aus, ohne eine übermäßig scharfe Nuance wie „unverzüglich“ einzutragen.
theological_decisions:
- issue: Zustand oder Wiederherstellung des Friedens
  choice: dass ihr bald in Frieden lebt
  alternative: dass ihr bald wieder zum Frieden findet
  rationale: Der Konfliktzusammenhang kann eine Wiederherstellung nahelegen, doch εἰρηνεῦσαι selbst ist aktiv und bezeichnet zunächst das Sein oder Leben im Frieden. Die Übersetzung lässt das Ziel deutlich werden, ohne eine im Verb nicht ausdrücklich enthaltene Wiederherstellung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darauf gerichtet war und noch immer ist“ bildet die fortdauernde Sorge idiomatisch ab und erhält den Kontrast der griechischen Perfekt- und Präsensformen.
