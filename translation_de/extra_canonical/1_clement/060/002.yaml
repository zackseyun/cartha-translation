id: 1CLEM.60.2
reference: 1 Clement 60:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: de
  text: Rechne deinen Knechten und Mägden keine Sünde an[a], sondern reinige uns durch die Reinigung deiner Wahrheit. Lenke unsere Schritte, damit wir in der Heiligkeit des Herzens wandeln und tun, was vor dir und vor unseren Herrschern gut und wohlgefällig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ist auch möglich: „Rechne deinen Knechten und Mägden nicht jede Sünde an.“ Im biblisch geprägten Sprachgebrauch kann die griechische Verbindung jedoch „keine Sünde“ bedeuten. „Knechte und Mägde“ kann hier auch männliche und weibliche Sklaven bezeichnen.'
    reason: Bewahrt sowohl die formale Mehrdeutigkeit von μή mit πᾶσαν als auch den antiken sozialen Bedeutungsumfang von δούλων und παιδισκῶν.
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: Rechne … keine Sünde an
  rationale: 'Die Verbindung von μή mit πᾶσαν kann im biblisch-semitisch geprägten Gebetsstil umfassend verneint werden: Nicht eine Sünde soll angerechnet werden. Die idiomatische deutsche Fassung vermeidet die missverständliche Bitte, nur einen Teil der Sünden nicht anzurechnen; die formale Alternative wird in der Fußnote bewahrt.'
- source_word: δούλων σου καὶ παιδισκῶν
  choice: deinen Knechten und Mägden
  rationale: Die traditionelle, würdige Paarform gibt die männliche und weibliche Dienststellung wieder. Beide griechischen Wörter können im antiken Sozialkontext auch versklavte Menschen bezeichnen.
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: reinige uns durch die Reinigung deiner Wahrheit
  rationale: Die ungewöhnliche griechische figura etymologica aus Verb und verwandtem Substantiv bleibt erkennbar, ohne ihre Beziehung zur Wahrheit näher auszudeuten.
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: Lenke unsere Schritte
  rationale: Gibt das Bild zielgerichteter Führung natürlich und zugleich bibelsprachlich würdig wieder.
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: unseren Herrschern
  rationale: Bezeichnet die übergeordneten politischen Autoritäten, ohne eine bestimmte Staatsform vorauszusetzen.
theological_decisions:
- issue: Umfang der erbetenen Nichtanrechnung von Sünde
  choice: keine Sünde
  alternative: nicht jede Sünde
  rationale: Im LXX-geprägten Gebetsregister kann μή mit πᾶς einer umfassenden Verneinung entsprechen. Da die formal mögliche Lesart „nicht jede“ offenlassen könnte, dass manche Sünden angerechnet werden sollen, steht die kontextuell wahrscheinlichere Lesart im Haupttext; die echte sprachliche Spannung wird in der Fußnote kenntlich gemacht.
- issue: Wirkung der Wahrheit bei der Reinigung
  choice: durch die Reinigung deiner Wahrheit
  alternative: durch deine Wahrheit reinigen / mit der reinigenden Kraft deiner Wahrheit
  rationale: 'Die genitivische Beziehung bleibt bewusst unbestimmt: Der Text legt nicht ausdrücklich fest, ob die Wahrheit Mittel, Ursprung oder Kennzeichen der Reinigung ist.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst maßvoller Bibelsprachlichkeit („Knechte und Mägde“, „Heiligkeit des Herzens“). Der Satzbau wurde für heutige Leser gegliedert, während Gebetscharakter, Parallelismus und die auffällige Wiederholung von „reinigen/Reinigung“ erhalten bleiben.
