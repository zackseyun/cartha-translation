source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: de
  text: 'Denn du hast die ewige Ordnung der Welt durch deine Werke offenbar gemacht. Du, Herr, hast den Erdkreis erschaffen: treu in allen Generationen, gerecht in deinen Urteilen, wunderbar an Macht und Majestät, weise im Erschaffen und verständig darin, dem Entstandenen festen Bestand zu geben, gütig in allem Sichtbaren und treu gegenüber denen, die auf dich vertrauen. Du Barmherziger und Mitfühlender, vergib uns unsere Gesetzlosigkeiten, unsere Ungerechtigkeiten, unsere Verfehlungen und unsere Versäumnisse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀέναον ... σύστασιν
  choice: ewige Ordnung
  rationale: σύστασις bezeichnet hier den geordneten Bestand bzw. die Ordnung der Welt; „ewig“ gibt ἀέναος natürlich und würdevoll wieder.
- source_word: διὰ τῶν ἐνεργουμένων
  choice: durch dein Wirken
  rationale: Die substantivierte Passivform bezeichnet das, was gewirkt bzw. vollzogen wird; im Gebetskontext ist Gottes Wirken gemeint. Die kompakte Wiedergabe vermeidet das schwerfällige „durch die gewirkten Dinge“.
- source_word: οἰκουμένην
  choice: Erdkreis
  rationale: Gemeint ist die bewohnte Welt; „Erdkreis“ wahrt die antike Perspektive in geläufiger, gehobener Sprache.
- source_word: ἐν τῷ τὰ γενόμενα ἑδράσαι
  choice: darin, dem Entstandenen festen Bestand zu geben
  rationale: ἑδράζω bedeutet fest gründen bzw. stabilisieren; τὰ γενόμενα bezeichnet das ins Dasein Gekommene.
- source_word: πλημμελείας
  choice: Versäumnisse
  rationale: Der Ausdruck bezeichnet Fehltritte oder Verfehlungen; „Versäumnisse“ differenziert ihn in der viergliedrigen Aufzählung von παραπτώματα.
theological_decisions:
- issue: Bezug von ἐλεῆμον καὶ οἰκτίρμον
  choice: 'Als direkte Anrede vor der Bitte: „Du Barmherziger und Mitfühlender, vergib uns …“'
  alternative: 'Als nachgestellte Beschreibung im vorausgehenden Satz: „… die auf dich vertrauen, barmherzig und mitfühlend. Vergib uns …“'
  rationale: Die Formen sind als Vokative zu verstehen und leiten passend den Imperativ ἄφες ein. So wird der syntaktische Wechsel von den vorherigen prädikativen Beschreibungen zur unmittelbaren Bitte gewahrt.
- issue: Viergliedriges Sündenbekenntnis
  choice: Gesetzlosigkeiten, Ungerechtigkeiten, Verfehlungen und Versäumnisse
  alternative: Übertretungen, unrechte Taten, Fehltritte und Vergehen
  rationale: Die vier unterschiedlichen griechischen Begriffe bleiben unterscheidbar, ohne eine konfessionell geprägte Sündensystematik einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Gebetston. Die lange griechische Prädikatsreihe bleibt erhalten, wird aber durch Doppelpunkt und idiomatische Ergänzungen lesbar gegliedert. Keine Fußnote erforderlich, da die vokativische Lesart von ἐλεῆμον καὶ οἰκτίρμον grammatisch vorzuziehen ist.
