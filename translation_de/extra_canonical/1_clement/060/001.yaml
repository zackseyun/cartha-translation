  source_fidelity: 'Der Entwurf gibt die Gebetsstruktur und die Reihe der Gottesprädikate insgesamt zuverlässig wieder. Präzisiert werden sollte jedoch διὰ τῶν ἐνεργουμένων: Die pluralische, substantivierte Partizipialform bezeichnet die gewirkten bzw. vollbrachten Dinge und sollte nicht ohne Weiteres zu einem singularischen „Wirken“ verengt werden. Auch ἐν πάσαις ταῖς γενεαῖς wird mit „in allen Generationen“ genauer wiedergegeben als mit „durch alle Generationen“.'
  naturalness: Der würdige Gebetston ist gelungen. „Gut in dem, was sichtbar ist“ ist im Deutschen etwas hart und kann als „gütig in allem Sichtbaren“ flüssiger formuliert werden, ohne die knappe griechische Prädikatsstruktur aufzugeben.
  terminology: „Ewige Ordnung“, „Erdkreis“, „Urteile“, „Gesetzlosigkeiten“, „Ungerechtigkeiten“, „Verfehlungen“ und „Versäumnisse“ sind tragfähige Wiedergaben. Die direkte Anrede „Du Barmherziger und Mitfühlender“ entspricht dem vokativischen Anschluss von ἐλεῆμον καὶ οἰκτίρμον an ἄφες und folgt dem englischen Audit-Ergebnis.
