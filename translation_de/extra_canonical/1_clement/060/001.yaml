- from: 'Denn du hast die ewige Ordnung der Welt durch dein Wirken offenbar gemacht. Du, Herr, hast den Erdkreis erschaffen: treu durch alle Generationen, gerecht in deinen Urteilen, wunderbar an Macht und Majestät, weise im Erschaffen und verständig darin, dem Entstandenen festen Bestand zu geben, gut in dem, was sichtbar ist, und treu gegenüber denen, die auf dich vertrauen. Du Barmherziger und Mitfühlender, vergib uns unsere Gesetzlosigkeiten, unsere Ungerechtigkeiten, unsere Verfehlungen und unsere Versäumnisse.'
  to: 'Denn du hast die ewige Ordnung der Welt durch deine Werke offenbar gemacht. Du, Herr, hast den Erdkreis erschaffen: treu in allen Generationen, gerecht in deinen Urteilen, wunderbar an Macht und Majestät, weise im Erschaffen und verständig darin, dem Entstandenen festen Bestand zu geben, gütig in allem Sichtbaren und treu gegenüber denen, die auf dich vertrauen. Du Barmherziger und Mitfühlender, vergib uns unsere Gesetzlosigkeiten, unsere Ungerechtigkeiten, unsere Verfehlungen und unsere Versäumnisse.'
  rationale: 'Die Revision wahrt die griechische Syntax, den Gebetsregister und die viergliedrige Bitte um Vergebung. Sie präzisiert insbesondere die pluralische Aussage von διὰ τῶν ἐνεργουμένων und die Präposition ἐν in der Prädikatsreihe. Eine Fußnote ist nicht nötig: Die vokativische Anrede vor „vergib“ ist im gegebenen Kontext die syntaktisch naheliegende Lesart; die im englischen Audit vermerkte ältere alternative Interpunktion wird nicht übernommen.'
