id: 1CLEM.60.3
reference: 1 Clement 60:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: de
  text: Ja, Herr, lass dein Angesicht über uns leuchten, zum Guten in Frieden, damit wir von deiner mächtigen Hand beschirmt und durch deinen erhobenen Arm von jeder Sünde befreit werden; und rette uns vor denen, die uns zu Unrecht hassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Herr
  rationale: Die Anrede bezeichnet Gott als souveränen Gebieter. „Herr“ ist im Deutschen würdig und gebetsgemäß; „Gebieter“ wäre zwar formaler, klänge hier aber unnötig hart und altertümlich.
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  choice: lass dein Angesicht über uns leuchten
  rationale: Bewahrt die biblisch geprägte Bildsprache des göttlichen Angesichts und gibt den faktitiven Imperativ natürlich wieder.
- source_word: εἰς ἀγαθὰ ἐν εἰρήνῃ
  choice: zum Guten in Frieden
  rationale: Folgt der knappen, möglicherweise mehrdeutigen Präpositionalfügung, ohne das Verhältnis von Gutem und Frieden erklärend festzulegen.
- source_word: σκεπασθῆναι
  choice: beschirmt werden
  rationale: Gibt den Schutzgedanken des passiven Infinitivs würdig und idiomatisch wieder.
- source_word: τῇ χειρί σου τῇ κραταιᾷ
  choice: von deiner mächtigen Hand
  rationale: Erhält das traditionelle anthropomorphe Bild und die instrumentale Bedeutung des Dativs.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: von jeder Sünde
  rationale: „Jede Sünde“ bildet den distributiven bzw. umfassenden Sinn von πάσης ab, ohne ihn zu verengen.
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: durch deinen erhobenen Arm
  rationale: „Erhoben“ gibt ὑψηλός im Bild machtvollen göttlichen Eingreifens anschaulich wieder; „hoher Arm“ wäre unidiomatisch, „erhabener Arm“ im Deutschen weniger natürlich.
- source_word: τῶν μισούντων ἡμᾶς ἀδίκως
  choice: denen, die uns zu Unrecht hassen
  rationale: Gibt das substantivierte Partizip und das Adverb vollständig und in natürlicher deutscher Syntax wieder.
theological_decisions:
- issue: Befreiung „von jeder Sünde“
  choice: Die Formulierung bleibt wörtlich auf Sünde bezogen.
  alternative: „von allem Bösen“ oder „von jeder Verfehlung“
  rationale: ἁμαρτία bedeutet ausdrücklich „Sünde“. Eine Umdeutung zu äußerem Übel oder allgemeinem Fehlverhalten würde die theologische Aussage abschwächen oder verschieben.
- issue: Anthropomorphe Rede von Gottes Hand, Arm und Angesicht
  choice: Alle drei Körperbilder werden beibehalten.
  alternative: Abstrakte Wiedergabe als Gegenwart, Macht und Schutz Gottes
  rationale: Die bildhafte Gebetssprache ist ein wesentlicher Bestandteil des griechischen Textes und soll nicht theologisierend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit bewusst bewahrter biblischer Bildsprache. Der lange Satzbau folgt dem flehenden Rhythmus des Originals, wird aber durch ein Semikolon lesbar gegliedert.
