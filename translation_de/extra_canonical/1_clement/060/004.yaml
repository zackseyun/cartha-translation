id: 1CLEM.60.4
reference: 1 Clement 60:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: de
  text: Schenke uns und allen, die auf der Erde wohnen, Eintracht und Frieden, wie du sie unseren Vätern geschenkt hast, als sie dich in heiliger Gesinnung, im Glauben und in Wahrheit anriefen – wobei wir deinem allmächtigen und in allem vortrefflichen Namen sowie unseren Herrschern und Führenden auf der Erde gehorsam werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „wobei wir … gehorsam werden“ bezieht sich auf die gegenwärtigen Beter, nicht auf die zuvor genannten Väter.
    reason: Die weit auseinanderstehenden Satzteile können in der Übersetzung leicht so missverstanden werden, als seien die Väter den gegenwärtigen Herrschern gehorsam geworden; die Kasusformen des griechischen Textes schließen diesen Bezug jedoch aus.
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: Eintracht
  rationale: Bezeichnet gemeinschaftliche und auch bürgerliche Übereinstimmung als Gegenpol zu Zwietracht; „Eintracht“ ist im Deutschen natürlicher und präziser als „Harmonie“.
- source_word: ὁσίως
  choice: in heiliger Gesinnung
  rationale: Gibt das adverbiale ὁσίως verständlich wieder, ohne es mit dem nachfolgenden ἐν πίστει καὶ ἀληθείᾳ zu einer einzigen dreigliedrigen Präpositionalformel zu verschmelzen.
- source_word: παναρέτῳ
  choice: vollkommen guten
  rationale: Das seltene Adjektiv bezeichnet umfassende sittliche Vortrefflichkeit. „Alltugendhaft“ wäre zwar formal näher, klingt im heutigen Deutschen jedoch unnatürlich und passt schlecht als Bezeichnung des Namens Gottes.
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: Herrschern und Führenden
  rationale: Bewahrt die zwei unterschiedlichen Amts- beziehungsweise Leitungsbezeichnungen des griechischen Textes.
theological_decisions:
- issue: Bezugswort von ὑπηκόους γινομένους
  choice: Das Partizip wird auf die gegenwärtigen Beter („wir“) bezogen.
  alternative: Bezug auf „unsere Väter“ oder eine syntaktisch unbestimmte Wiedergabe.
  rationale: Der Akkusativ Plural ὑπηκόους γινομένους kann nicht mit dem Genitiv Plural αὐτῶν, der auf die Väter verweist, kongruieren. Er nimmt vielmehr ein bei ἡμῖν sinngemäß vorausgesetztes ἡμᾶς auf. Auch „unsere Herrscher“ weist auf die gegenwärtigen Beter.
- issue: Verhältnis des Partizips zur Bitte
  choice: Als begleitender Umstand mit „wobei wir … gehorsam werden“ wiedergegeben.
  alternative: 'Als zweiter Imperativ: „und mache uns gehorsam“ beziehungsweise „lass uns gehorsam sein“.'
  rationale: Im Griechischen steht nur δός als Imperativ; die gewählte Form bewahrt die Partizipialkonstruktion und vermeidet einen zusätzlich eingeführten Befehlssatz.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der lange griechische Satz bleibt als Einheit erhalten; der Gedankenstrich markiert den Wechsel vom Rückblick auf die Väter zur Haltung der gegenwärtigen Beter.
