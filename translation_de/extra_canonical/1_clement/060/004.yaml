review_pass:
  verdict: revise
  source_fidelity: 'Die Satzglieder und der schwierige Bezug des Akkusativ-Partizips ὑπηκόους γινομένους sind zutreffend erfasst: Es bezieht sich nicht auf τοῖς πατράσιν ἡμῶν im Genitiv, sondern auf die gegenwärtigen Beter als mit ἡμῖν mitgemeinte Akkusativgröße. Auch die doppelte Gehorsamsrichtung gegenüber Gottes Namen und den irdischen Amtsträgern bleibt erhalten. „vollkommen guten“ schwächt jedoch παναρέτῳ („in jeder Hinsicht vortrefflich/tugendhaft“) unnötig auf bloße Güte ab.'
  naturalness: Der Gebetston ist würdig und weitgehend modernes Standarddeutsch. „Eintracht“, „Herrschern und Führenden“ sowie die Markierung des Bezugswechsels mit Gedankenstrich sind klar. „Wobei wir“ ist zwar verständlich, aber etwas umgangssprachlich-prosaisch; es kann beibehalten werden, weil es die partizipiale Begleitumstandsbeziehung ohne einen neuen Imperativ wiedergibt.
  terminology: „Eintracht“ gibt ὁμόνοια präzise wieder. „Heilige Gesinnung“ ist als moderne Umschreibung von ὁσίως vertretbar. Für παναρέτῳ ist „in allem vortrefflich“ genauer und im Zusammenhang mit Gottes Namen idiomatischer als „vollkommen gut“.
  issues:
  - severity: medium
    issue: „vollkommen guten“ für παναρέτῳ
    rationale: παναρέτῳ bezeichnet umfassende Vortrefflichkeit beziehungsweise Tugendhaftigkeit, nicht allein Güte. Die Formulierung „in allem vortrefflichen“ bewahrt den Umfang des griechischen Adjektivs, ohne ein unnatürliches „alltugendhaft“ zu erzwingen.
