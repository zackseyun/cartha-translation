revisions:
- from: Schenke uns und allen, die auf der Erde wohnen, Eintracht und Frieden, wie du sie unseren Vätern geschenkt hast, als sie dich in heiliger Gesinnung, in Glauben und Wahrheit anriefen – wobei wir deinem allmächtigen und vollkommen guten Namen sowie unseren Herrschern und Führenden auf der Erde gehorsam werden.[a]
  to: Schenke uns und allen, die auf der Erde wohnen, Eintracht und Frieden, wie du sie unseren Vätern geschenkt hast, als sie dich in heiliger Gesinnung, im Glauben und in Wahrheit anriefen – wobei wir deinem allmächtigen und in allem vortrefflichen Namen sowie unseren Herrschern und Führenden auf der Erde gehorsam werden.[a]
  rationale: Die Übersetzung wird nur bei παναρέτῳ präzisiert. Die syntaktisch notwendige Zuordnung von ὑπηκόους γινομένους zu den gegenwärtigen Betern bleibt mitsamt der erläuternden Fußnote erhalten. Die Fassung wahrt die offene partizipiale Beziehung des Griechischen, statt daraus einen zusätzlichen Imperativ zu machen.
