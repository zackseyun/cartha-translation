    issue: „mit geheiligter Seele“ für ἐν ὁσιότητι ψυχῆς
    rationale: „Geheiligt“ kann einen vollzogenen Akt der Heiligung nahelegen. Das Griechische bezeichnet hier die Heiligkeit bzw. fromme Reinheit, in der die Seele sich Gott nähert. „In Heiligkeit der Seele“ erhält dies ohne zusätzliche aspektuelle Aussage.
  revised_text: Lasst uns nun in Heiligkeit der Seele zu ihm kommen, indem wir reine und unbefleckte Hände zu ihm erheben und unseren gütigen und barmherzigen Vater lieben, der uns für sich zu einem erwählten Anteil gemacht hat.
