  source_fidelity: Die Satzstruktur und die Wiedergabe von ἁγνὰς καὶ ἀμιάντους χεῖρας sowie ἐπιεικῆ καὶ εὔσπλαγχνον sind im Wesentlichen quellentreu. „Mit geheiligter Seele“ verschiebt jedoch ἐν ὁσιότητι ψυχῆς von der Haltung bzw. Sphäre der Heiligkeit zu einem Ergebnis eines Heiligungsvorgangs. Die Schlusswendung wird mit „zu einem erwählten Anteil“ vertretbar nah und ohne ekklesiologische Festlegung wiedergegeben.
  naturalness: Der würdige, moderne Satzbau ist gut lesbar. „In Heiligkeit der Seele“ ist etwas gehoben, aber in diesem paränetisch-liturgischen Kontext natürlich und genauer als „mit geheiligter Seele“.
  terminology: „Reine und unbefleckte Hände“ und „gütigen und barmherzigen Vater“ treffen Bildsprache und Register. „Erwählter Anteil“ bewahrt die ungewöhnliche, nicht weiter aufzulösende Bildlichkeit von ἐκλογῆς μέρος angemessen.
  issues:
