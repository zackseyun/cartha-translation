source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: de
  text: Lasst uns nun in Heiligkeit der Seele zu ihm kommen, indem wir reine und unbefleckte Hände zu ihm erheben und unseren gütigen und barmherzigen Vater lieben, der uns für sich zu einem erwählten Anteil gemacht hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: mit geheiligter Seele
  rationale: Gibt die innere, auf Gott ausgerichtete Heiligkeit natürlich und würdig wieder, ohne sie bloß als moralische Makellosigkeit zu verengen.
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: reine und unbefleckte Hände
  rationale: Bewahrt die beiden attributiven Adjektive und die kultisch-ethische Bildsprache des Griechischen.
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: gütigen und barmherzigen
  rationale: ἐπιεικής bezeichnet hier freundliche Milde oder Güte; εὔσπλαγχνος inniges Erbarmen. Die gewählte Paarung ist idiomatisch und erhält beide Akzente.
- source_word: ἐκλογῆς μέρος
  choice: einen erwählten Anteil
  rationale: Bewahrt die ungewöhnliche und möglicherweise bewusst mehrdeutige Wendung, statt sie eindeutig als ‚sein auserwähltes Volk‘ auszulegen.
theological_decisions:
- issue: Bedeutung von ἐκλογῆς μέρος
  choice: zu einem erwählten Anteil
  alternative: zu seinem auserwählten Volk
  rationale: Die wörtlichere Fassung erhält die Spannung zwischen einem Anteil, der erwählt ist, und einem Anteil an der Erwählung; eine eindeutige ekklesiologische Auflösung wäre interpretierend.
- issue: ὁσιότης als innere Heiligkeit
  choice: mit geheiligter Seele
  alternative: in Heiligkeit der Seele
  rationale: Die natürliche deutsche Formulierung wahrt den religiösen Bezug des Begriffs und vermeidet zugleich eine konfessionell aufgeladene Präzisierung.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit hortativem Ton. Der Partizipialbau wird durch ‚indem‘ transparent wiedergegeben; die ungewöhnliche Schlusswendung bleibt bewusst nahe am griechischen Ausdruck.
