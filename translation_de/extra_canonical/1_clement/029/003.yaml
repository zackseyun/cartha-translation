base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: de
  text: 'Und an einer anderen Stelle heißt es:


    »Siehe, der Herr nimmt für sich ein Volk mitten aus den Völkern,


    wie ein Mensch die Erstlingsgabe seiner Tenne nimmt;


    und aus jenem Volk wird das Allerheiligste hervorgehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Herkunft dieses Zitats ist nicht sicher bestimmt; es ist in dieser Form nicht im Alten Testament überliefert.
    reason: Die Zitatformel führt einen Schriftbeleg ein, dessen genaue Quelle unklar ist; dies ist für das Verständnis und die Textgeschichte relevant.
lexical_decisions:
- source_word: ἔθνος
  choice: Volk
  rationale: Im Zusammenhang bezeichnet ἔθνος eine Volksgemeinschaft; »Volk« ist im Deutschen natürlicher als »Nation« und bewahrt den Kontrast zu den übrigen Völkern.
- source_word: ἀπαρχή
  choice: Erstlingsgabe
  rationale: Der kultisch geprägte Ausdruck bezeichnet den zuerst ausgesonderten und dargebrachten Anteil; »Erstlingsgabe« gibt diesen Sinn deutlicher wieder als bloß »Erstling«.
- source_word: ἅλω
  choice: Tenne
  rationale: Gemeint ist der Platz, an dem das Getreide gedroschen und geworfelt wird.
- source_word: ἅγια ἁγίων
  choice: das Allerheiligste
  rationale: Dies ist die geläufige deutsche Wiedergabe der festen kultischen Wendung und wahrt ihre substantivische, neutrale Form.
theological_decisions:
- issue: Bezug von ἅγια ἁγίων
  choice: das Allerheiligste
  alternative: Heilige unter Heiligen / Hochheiliges
  rationale: Die feste Wendung legt die kultische Bedeutung »Allerheiligstes« nahe. Der Text erklärt jedoch nicht ausdrücklich, ob ein Ort, eine Sache oder typologisch eine Person gemeint ist; die Übersetzung lässt diese Spannung bestehen.
- issue: Subjekt der einleitenden Redeformel λέγει
  choice: heißt es
  alternative: er sagt
  rationale: Das griechische Präsens kann eine Schriftstelle als sprechend einführen. Die unpersönliche deutsche Formel vermeidet es, einen im unmittelbaren Vers nicht genannten Sprecher festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Zeilenfall für das Zitat. Der demonstrative Auftakt »Siehe« und die kultischen Begriffe bleiben wegen des feierlichen Quellencharakters erhalten.
