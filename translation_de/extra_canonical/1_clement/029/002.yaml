  to: 'Denn so steht geschrieben:


    „Als der Höchste die Völker aufteilte,


    als er die Söhne Adams zerstreute,


    setzte er die Grenzen der Völker fest


    nach der Zahl der Engel Gottes.[a]


    Und sein Volk, Jakob, wurde zum Anteil des Herrn,


    Israel zum abgemessenen Anteil seines Erbes.“[b]'
  rationale: 'Die Revision korrigiert die syntaktische Wiedergabe der Schlusszeilen entsprechend dem griechischen Zitat: Gottes Volk, Jakob/Israel, wird als der Anteil des Herrn bezeichnet. Zugleich wird die Metapher von σχοίνισμα im Deutschen behutsam bewahrt. Die Fußnote zu der umstrittenen Textüberlieferung bleibt sachlich und folgt weiterhin dem tatsächlich zitierten Wortlaut des Clemens.'
