base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: de
  text: 'Denn so steht geschrieben:


    „Als der Höchste die Völker aufteilte,


    als er die Söhne Adams zerstreute,


    setzte er die Grenzen der Völker fest


    nach der Zahl der Engel Gottes.[a]


    Und sein Volk, Jakob, wurde zum Anteil des Herrn,


    Israel zum abgemessenen Anteil seines Erbes.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Textüberlieferungen von 5. Mose 32,8 lesen „Söhne Israels“ oder „Söhne Gottes“; Clemens zitiert hier „Engel Gottes“.
    reason: Die textgeschichtlich relevante Abweichung wird transparent gemacht, ohne die bei Clemens bezeugte Lesart zu ersetzen.
  - marker: b
    text: 'Wörtlich: „Israel [wurde] zum Messschnuranteil seines Erbes“; gemeint ist ein mit der Messschnur abgemessener Anteil.'
    reason: Erläutert die in σχοίνισμα erhaltene Vermessungsmetapher und den Genitiv „seines Erbes“.
lexical_decisions:
- source_word: διεμέριζεν
  choice: aufteilte
  rationale: Gibt die Verteilung der Völker natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: υἱοὺς Ἀδάμ
  choice: die Söhne Adams
  rationale: Bewahrt das konkrete biblische Bild des griechischen Zitats statt es zu „Menschen“ zu verallgemeinern.
- source_word: ἀγγέλων θεοῦ
  choice: Engel Gottes
  rationale: Übersetzt den von Clemens zitierten griechischen Wortlaut unmittelbar und glättet ihn nicht nach einer abweichenden Texttradition.
- source_word: μερὶς κυρίου
  choice: Anteil des Herrn
  rationale: Entspricht der Besitz- und Zuteilungsmetaphorik von μερίς in natürlichem Deutsch.
- source_word: σχοίνισμα κληρονομίας αὐτοῦ
  choice: zugemessener Erbteil für ihn
  rationale: σχοίνισμα bezeichnet wörtlich ein mit der Messschnur abgemessenes Stück; die Formulierung macht die Vermessungsmetapher verständlich, ohne das Deutsche zu überfrachten.
theological_decisions:
- issue: Textform von Deuteronomium 32,8
  choice: „Engel Gottes“
  alternative: „Söhne Israels“ oder „Gottessöhne“
  rationale: Die Übersetzung folgt der ausdrücklich vorliegenden griechischen Textform bei Clemens (ἀγγέλων θεοῦ), auch wenn andere Überlieferungsformen des alttestamentlichen Verses abweichen.
- issue: Bezug von αὐτοῦ in der Schlusszeile
  choice: „für ihn“ als Bezug auf den Herrn
  alternative: „sein Erbteil“, mit möglicher grammatischer Unklarheit im Deutschen
  rationale: Der griechische Ausdruck bezeichnet Israel als den dem Herrn zugehörigen Erbteil. Die Formulierung vermeidet im Deutschen den irreführenden Eindruck, Israel selbst sei der Besitzer des Erbteils.
translation_notes:
  register: Dignifizieller, gut verständlicher Schriftzitatstil mit poetischer Zeilengliederung. Die Übersetzung bleibt nahe an Clemens’ griechischer Fassung, verwendet aber in der Schlusszeile idiomatisches modernes Standarddeutsch.
