source:
  edition: Funk 1901 (normalized OCR)
  text: ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: de
  text: Siebenmal trug er Fesseln, wurde in die Verbannung getrieben und gesteinigt; er wurde sowohl im Osten als auch im Westen zum Verkündiger und erlangte den edlen Ruhm seines Glaubens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: Siebenmal trug er Fesseln
  rationale: Gibt Zahl, Bild und partizipiale Vorzeitigkeit knapp und natürlich wieder; „Fesseln tragen“ bezeichnet Gefangenschaft, ohne sie weiter auszudeuten.
- source_word: φυγαδευθείς
  choice: wurde in die Verbannung getrieben
  rationale: Bewahrt den passiven und erzwungenen Charakter des Verbs deutlicher als das bloße „verbannt“.
- source_word: λιθασθείς
  choice: gesteinigt
  rationale: Direkte und sachlich genaue Wiedergabe des Aoristpassivs.
- source_word: κῆρυξ γενόμενος
  choice: zum Verkündiger geworden
  rationale: „Verkündiger“ ist im Deutschen natürlicher als „Herold“, bewahrt aber die öffentliche Botenfunktion von κῆρυξ.
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: im Osten wie im Westen
  rationale: Idiomatiche Wiedergabe der korrelativen Verbindung τε … καί und der geografischen Spannweite.
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος
  choice: den ruhmreichen Lohn für seinen Glauben
  rationale: Im Kontext bezeichnet κλέος nicht nur Ansehen, sondern den ehrenvollen Ausgang beziehungsweise Ruhm, den sein Glauben erlangt. „Ruhmreicher Lohn“ ergibt einen natürlichen deutschen Satz, ohne den Lohn näher zu bestimmen.
theological_decisions:
- issue: Bezug von τῆς πίστεως αὐτοῦ
  choice: für seinen Glauben
  alternative: seines Glaubens
  rationale: Der Genitiv kann Zugehörigkeit oder Grundlage/Ursache ausdrücken. Die gewählte Form ist im Deutschen verständlich, legt aber nicht fest, worin der Lohn besteht oder von wem er verliehen wird.
- issue: Bedeutung von κλέος
  choice: ruhmreicher Lohn
  alternative: edler Ruhm / ehrenvoller Ruf
  rationale: κλέος bedeutet gewöhnlich Ruhm oder Renommee; im Martyriumskontext kann es zugleich den ehrenvollen Ertrag standhaften Glaubens bezeichnen. Die Formulierung hält beide Aspekte zusammen, ohne eine spezifische Heilslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Partizipialkette wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die zeitliche und rhetorische Steigerung bleibt erhalten.
