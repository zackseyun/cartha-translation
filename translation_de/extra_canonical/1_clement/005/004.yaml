review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur ist zutreffend. „Ihm bestimmten“ gibt ὀφειλόμενον jedoch nicht präzise wieder: Das Partizip bezeichnet den Petrus zukommenden bzw. gebührenden Ort, nicht vorrangig einen im Voraus bestimmten Ort. Außerdem kann „aus ungerechter Eifersucht“ im Deutschen stärker nahelegen, Petrus selbst sei eifersüchtig gewesen; der griechische Ausdruck lässt den Träger der Eifersucht offen.'
  naturalness: Der Satz ist insgesamt würdig und gut verständlich. „Infolge ungerechter Eifersucht“ bewahrt die offene Verursachungsrelation idiomatischer. „Leiden“ trifft πόνους in diesem Kontext natürlicher und gewichtiger als „Mühen“.
  terminology: „Petrus“ und „Zeugnis abgelegt hatte“ sind angemessen. „Ort der Herrlichkeit“ erhält die offene Genitivverbindung des Griechischen. „Ihm gebührenden“ ist für ὀφειλόμενον genauer und vermeidet die semantische Verschiebung von „bestimmt“.
  issues:
  - severity: medium
    issue: „ihm bestimmten“ für ὀφειλόμενον
    rationale: Die Formulierung verschiebt „geschuldet/gebührend“ in Richtung einer bloßen Vorherbestimmung. „Ihm gebührend“ entspricht dem Wortlaut, ohne eine dogmatische Deutung aufzudrängen.
  - severity: low
    issue: „aus ungerechter Eifersucht“ kann den Eifersüchtigen zu stark mit Petrus identifizieren
    rationale: Der griechische Kausalausdruck benennt die ungerechte Eifersucht als Ursache, aber nicht ausdrücklich ihren Träger. „Infolge“ lässt dies im Deutschen offener.
  - severity: low
    issue: „Mühen“ für πόνους
    rationale: πόνους kann zwar Mühen meinen, bezeichnet hier angesichts von Leiden und Zeugnisablegen eher schwere Leiden; „Leiden“ wahrt diese Stärke besser.
  revised_text: Petrus, der infolge ungerechter Eifersucht nicht einen oder zwei, sondern viele Leiden ertrug und so, nachdem er Zeugnis abgelegt hatte, an den ihm gebührenden Ort der Herrlichkeit ging.
