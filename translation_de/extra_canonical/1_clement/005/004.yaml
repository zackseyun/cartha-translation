source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: de
  text: Petrus, der infolge ungerechter Eifersucht nicht einen oder zwei, sondern viele Leiden ertrug und so, nachdem er Zeugnis abgelegt hatte, an den ihm gebührenden Ort der Herrlichkeit ging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον ἄδικον
  choice: aus ungerechter Eifersucht
  rationale: Gibt Ursache und negative Wertung der Eifersucht unmittelbar wieder, ohne den möglichen Bezug auf die Eifersucht anderer ausdrücklich festzulegen.
- source_word: πλείονας ... πόνους
  choice: viele Mühen
  rationale: πόνοι bezeichnet belastende Mühen, Leiden oder Drangsale; „Mühen“ bewahrt die Breite des Ausdrucks und klingt im Deutschen natürlich.
- source_word: μαρτυρήσας
  choice: nachdem er Zeugnis abgelegt hatte
  rationale: Bewahrt den primären Sinn „Zeugnis ablegen“ und legt das in frühchristlichem Sprachgebrauch mögliche Martyrium nicht ausdrücklich als Todesart fest.
- source_word: τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: den ihm bestimmten Ort der Herrlichkeit
  rationale: „Bestimmt“ gibt den ihm zukommenden bzw. geschuldeten Ort idiomatisch wieder; „Ort der Herrlichkeit“ erhält die Genitivkonstruktion und ihre theologische Offenheit.
theological_decisions:
- issue: Bedeutung von μαρτυρήσας
  choice: „nachdem er Zeugnis abgelegt hatte“
  alternative: „nachdem er den Märtyrertod erlitten hatte“
  rationale: Der Kontext kann auf das Martyrium des Petrus anspielen, doch das Verb bedeutet zunächst „Zeugnis ablegen“. Die Übersetzung bewahrt diese bewusste Spannung.
- issue: Sinn von ὀφειλόμενον
  choice: „ihm bestimmten“
  alternative: „ihm gebührenden“ oder „ihm geschuldeten“
  rationale: „Ihm bestimmten“ vermeidet den Eindruck, Petrus habe sich die Herrlichkeit als Verdienstanspruch erworben, ohne den Gedanken eines ihm zukommenden Zieles aufzugeben.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhythmische Steigerung „nicht nur eine oder zwei, sondern viele“ bleibt erhalten; „Petrus“ folgt der etablierten deutschen Namensform.
