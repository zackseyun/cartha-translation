source:
  edition: Funk 1901 (normalized OCR)
  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: de
  text: Nachdem er die ganze Welt Gerechtigkeit gelehrt hatte, bis an die äußerste Grenze des Westens gekommen war und vor den Machthabern Zeugnis abgelegt hatte[a], schied er so aus der Welt und ging an den heiligen Ort; so wurde er zum größten Vorbild der Standhaftigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Satzgliederung: „… bis an die äußerste Grenze des Westens gekommen war und vor den Machthabern den Märtyrertod erlitten hatte.“'
    reason: Die Hauptübersetzung gibt μαρτυρήσας mit Bezug auf ἐπὶ τῶν ἡγουμένων unmittelbar als öffentliches Zeugnis ablegen wieder. Die Fußnote wahrt die überlieferungs- und auslegungsbedingte Martyriumsdeutung, ohne sie als reguläre isolierte Wortbedeutung auszugeben.
lexical_decisions:
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Gibt den zentralen ethisch-religiösen Begriff ohne konfessionelle Einengung direkt wieder.
- source_word: τὸ τέρμα τῆς δύσεως
  choice: die äußerste Grenze des Westens
  rationale: Bewahrt die geografische, aber nicht näher bestimmte Ausdrucksweise des Griechischen, ohne einen konkreten Ort wie Spanien oder Rom einzutragen.
- source_word: μαρτυρήσας
  choice: Zeugnis abgelegt hatte
  rationale: Entspricht im Zusammenhang mit ἐπὶ τῶν ἡγουμένων am unmittelbarsten dem Auftreten und Bezeugen vor Machthabern; die mögliche Bedeutung eines Märtyrertodes bleibt in der Fußnote sichtbar.
- source_word: τῶν ἡγουμένων
  choice: den Machthabern
  rationale: Bezeichnet hier leitende politische beziehungsweise staatliche Autoritäten; „Machthaber“ ist verständlich und lässt ihre genaue Amtsstellung offen.
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: schied er aus der Welt
  rationale: Gibt die idiomatische Bezeichnung des Sterbens beziehungsweise Verlassens der Welt würdig wieder, ohne die missverständliche Nebenbedeutung einer ausdrücklich vollzogenen Befreiung einzuführen.
- source_word: ὑπομονῆς ... μέγιστος ὑπογραμμός
  choice: zum größten Vorbild standhaften Ausharrens
  rationale: ὑπογραμμός bezeichnet ein vor Augen gestelltes Muster oder Vorbild; „standhaftes Ausharren“ erfasst die aktive, dauerhafte Belastbarkeit von ὑπομονή besser als das bloße „Geduld“.
theological_decisions:
- issue: Bedeutung von μαρτυρήσας
  choice: Zeugnis abgelegt hatte
  alternative: den Märtyrertod erlitten hatte
  rationale: Das Verb kann vom Ablegen eines Zeugnisses sprechen und entwickelte im christlichen Sprachgebrauch die Bedeutung des Martyriums. Der Zusatz „vor den Machthabern“ stützt die erste Wiedergabe, doch die zweite Möglichkeit wird nicht ausgeschlossen.
- issue: Bedeutung des heiligen Ortes
  choice: an den heiligen Ort
  alternative: in die heilige Stätte
  rationale: Die Übersetzung wahrt die unbestimmte eschatologische Aussage des Ausgangstextes und identifiziert den Ort nicht eigenmächtig mit Himmel, Paradies oder einem anderen näher bestimmten Bereich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Folge der drei griechischen Aoristpartizipien wird als zusammenhängende Nachdem-Konstruktion wiedergegeben, die auf die Haupthandlungen „schied“ und „ging“ zuläuft. Konkrete geografische oder eschatologische Identifizierungen werden vermieden.
