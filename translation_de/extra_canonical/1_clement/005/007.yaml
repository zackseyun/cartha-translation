  to: Nachdem er die ganze Welt Gerechtigkeit gelehrt hatte, bis an die äußerste Grenze des Westens gekommen war und vor den Machthabern Zeugnis abgelegt hatte[a], schied er so aus der Welt und ging an den heiligen Ort; so wurde er zum größten Vorbild der Standhaftigkeit.
