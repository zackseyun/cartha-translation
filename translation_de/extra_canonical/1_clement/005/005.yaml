  text: διὰ ζῆλον καὶ ἔριν Παῦλος ὑπομονῆς βραβεῖον ἔδειξεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/005.yaml
  text: Because of jealousy and strife[a], Paul showed the prize of endurance,
translation:
  language: de
  text: Aus Eifersucht und Streit zeigte Paulus den Siegespreis der Standhaftigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον καὶ ἔριν
  choice: Aus Eifersucht und Streit
  rationale: Gibt die kausale Wendung natürlich wieder; ζῆλος bezeichnet hier im negativen Kontext Eifersucht beziehungsweise Missgunst, ἔρις Streit oder Zwietracht.
- source_word: ὑπομονῆς
  choice: der Standhaftigkeit
  rationale: Bezeichnet ausdauerndes, standhaftes Ertragen; „Standhaftigkeit“ ist in diesem Zusammenhang würdig und verständlich.
- source_word: βραβεῖον
  choice: Siegespreis
  rationale: Das Wort bezeichnet den bei einem Wettkampf verliehenen Preis; „Siegespreis“ bewahrt das Bild deutlicher als das allgemeinere „Preis“.
- source_word: ἔδειξεν
  choice: zeigte
  rationale: Entspricht direkt der Grundbedeutung „zeigen, sichtbar machen“ und lässt offen, auf welche Weise Paulus den Preis vor Augen stellte.
theological_decisions:
- issue: Verhältnis von Paulus zum „Siegespreis der Standhaftigkeit“
  choice: zeigte Paulus den Siegespreis
  alternative: wies Paulus auf den Siegespreis hin
  rationale: Die direkte Formulierung bewahrt die Aussage des griechischen ἔδειξεν, ohne erklärend festzulegen, ob Paulus den Preis durch sein Beispiel sichtbar machte oder ausdrücklich auf ihn hinwies.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die metaphorische Wettkampfsprache des griechischen Textes bleiben erhalten.
