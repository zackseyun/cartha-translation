source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: de
  text: Doch um die Beispiele aus alter Zeit hinter uns zu lassen, wollen wir uns den Wettkämpfern zuwenden, die unserer Zeit am nächsten standen. Nehmen wir uns die edlen Beispiele aus unserer eigenen Generation vor Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα
  choice: die Beispiele aus alter Zeit hinter uns zu lassen
  rationale: Gibt das Sich-Abwenden von den früheren Beispielen idiomatisch wieder, ohne den missverständlichen Sinn „bei ihnen stehen bleiben“ nahezulegen.
- source_word: ἀθλητάς
  choice: Kämpfern
  rationale: Das griechische Bild bezeichnet Wettkämpfer, hier bildlich bewährte Glaubenszeugen. „Kämpfer“ bewahrt die agonistische Metapher und klingt im Deutschen natürlich.
- source_word: τοὺς ἔγγιστα γενομένους
  choice: die unserer Zeit am nächsten standen
  rationale: Drückt die zeitliche Nähe der genannten Personen aus; γενομένους wird im Zusammenhang nicht unnötig mit „lebten“ präzisiert.
- source_word: τὰ γενναῖα ὑποδείγματα
  choice: die edlen Beispiele
  rationale: γενναῖος meint hier vorbildliche Größe beziehungsweise edle Gesinnung; „edel“ erhält die wertende Aussage knapp und würdig.
- source_word: λάβωμεν
  choice: Nehmen wir uns … vor Augen
  rationale: Vermittelt im Deutschen natürlich die Aufforderung, diese Beispiele zu betrachten und sich an ihnen zu orientieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Ausdruck „Kämpfer“ bleibt erhalten; die zweimalige Verwendung von ὑποδείγματα wird entsprechend mit „Beispiele“ wiedergegeben.
