  text: διὰ ζῆλον καὶ φθόνον οἱ μέγιστοι καὶ δικαιότατοι στῦλοι ἐδιώχθησαν καὶ ἕως θανάτου ἤθλησαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/002.yaml
  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: de
  text: Aus Eifersucht und Neid wurden die größten und gerechtesten Säulen verfolgt und kämpften bis zum Tod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: Eifersucht und Neid
  rationale: Die beiden eng verwandten griechischen Begriffe werden entsprechend der Vorlage getrennt wiedergegeben; „Eifersucht“ und „Neid“ sind im modernen Deutsch natürlich und bewahren die begriffliche Häufung.
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  choice: die größten und gerechtesten Säulen
  rationale: Die Superlative und das Bild der „Säulen“ bleiben erhalten. Der Kontext bezeichnet herausragende, rechtschaffene Stützen der Gemeinschaft, ohne sie hier ausdrücklich zu identifizieren.
- source_word: ἐδιώχθησαν
  choice: wurden ... verfolgt
  rationale: Gibt den passiven Aorist unmittelbar und idiomatisch wieder.
- source_word: ἤθλησαν
  choice: kämpften
  rationale: Das Verb hat ein athletisches Grundbild und kann das Bestehen eines schweren Kampfes bezeichnen. „Kämpften“ ist natürlich und wahrt die metaphorische Kraft besser als ein allgemeines „litten“.
- source_word: ἕως θανάτου
  choice: bis zum Tod
  rationale: Entspricht der zeitlich beziehungsweise graduell zugespitzten Wendung und lässt offen, ob der Kampf im Tod endete oder bis an die Todesgrenze reichte.
theological_decisions:
- issue: Reichweite von ἕως θανάτου
  choice: bis zum Tod
  alternative: bis in den Tod / bis an den Tod
  rationale: „Bis zum Tod“ bewahrt die knappe Aussage und legt nicht über den griechischen Wortlaut hinaus fest, in welchem genauen Sinn der Tod Grenze oder Endpunkt des Kampfes war.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzstruktur. Das Säulenbild und die doppelte Motivangabe bleiben bewusst unaufgelöst erhalten.
