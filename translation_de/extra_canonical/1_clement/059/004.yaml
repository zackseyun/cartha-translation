  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: de
  text: Wir bitten dich, Gebieter, unser Helfer und Beschützer zu sein. Rette die von uns, die in Bedrängnis sind; erbarme dich der Geringen; richte die Gefallenen auf; erscheine denen, die in Not sind; heile die Schwachen; führe die aus deinem Volk zurück, die in die Irre gehen.[a] Sättige die Hungrigen; befreie unsere Gefangenen; richte die Kranken auf; ermutige die Verzagten. Alle Völker sollen erkennen, dass du allein Gott bist und Jesus, der Messias, dein Knecht[b] ist und dass wir dein Volk und die Schafe deiner Weide sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die umherirren“ beziehungsweise „auf Irrwegen sind“.'
    reason: Das Verb πλανάω kann sowohl tatsächliches Umherirren als auch übertragenes Abirren bezeichnen.
  - marker: b
    text: Das griechische Wort kann auch „Kind“ bedeuten.
    reason: παῖς bezeichnet je nach Zusammenhang einen Knecht/Diener oder ein Kind; hier ist die Anspielung auf den Gottesknecht wahrscheinlich, die Mehrdeutigkeit soll jedoch sichtbar bleiben.
lexical_decisions:
- source_word: δέσποτα
  choice: Gebieter
  rationale: Gibt die Anrede für einen souveränen Herrn würdig und genauer wieder als das allgemeinere „Herr“.
- source_word: ἀντιλήμπτορα
  choice: Beschützer
  rationale: Bezeichnet den, der sich eines Menschen annimmt und ihm schützend beisteht; zusammen mit „Helfer“ ergibt sich eine natürliche deutsche Wortverbindung.
- source_word: τοὺς ἐν θλίψει ἡμῶν
  choice: die unter uns, die in Bedrängnis sind
  rationale: Bewahrt den Bezug von ἡμῶν auf die betende Gemeinschaft und vermeidet das im Deutschen missverständliche „unsere Bedrängten“.
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου
  choice: die aus deinem Volk …, die in die Irre gehen
  rationale: Gibt das substantivierte Partizip als Personenbezeichnung wieder; „in die Irre gehen“ wahrt sowohl räumliches Umherirren als auch übertragenes Abirren.
- source_word: λύτρωσαι
  choice: befreie
  rationale: Im Zusammenhang mit Gefangenen ist die konkrete Bedeutung „befreien/auslösen“ idiomatischer als das theologisch stärker geprägte „erlösen“.
- source_word: τοὺς ὀλιγοψυχούντας
  choice: die Verzagten
  rationale: Bezeichnet Menschen, denen Mut und Zuversicht fehlen; „verzagt“ ist verständlich und dem würdigen Gebetsregister angemessen.
- source_word: νομῆς
  choice: Weide
  rationale: Bewahrt das vertraute Hirtenbild und die konkrete Bedeutung des griechischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von παῖς für Jesus
  choice: Knecht
  alternative: Kind / Sohn
  rationale: Im Gebetskontext und in der frühchristlichen, an den Gottesknecht erinnernden Sprache ist „Knecht“ wahrscheinlich; die echte lexikalische Mehrdeutigkeit wird in einer Fußnote offengelegt.
- issue: Wiedergabe von Χριστός
  choice: der Messias
  alternative: Christus
  rationale: Gibt den Titel als „der Gesalbte/Messias“ transparent wieder, statt ihn lediglich in der traditionellen gräzisierten Form zu übernehmen.
- issue: Aussage über den einen Gott und Jesus
  choice: dass du allein Gott bist und Jesus, der Messias, dein Knecht ist
  alternative: dass du allein Gott bist, und dass Jesus Christus dein Knecht ist
  rationale: Die koordinierte Aussage des griechischen Textes bleibt erhalten, ohne das Verhältnis der beiden Aussagen dogmatisch umzuformen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit direkter Anrede im Singular. Die Folge kurzer Bitten und die parallelen Imperative des griechischen Textes bleiben erhalten; Semikolons gliedern den langen Satz für heutige Leser.
