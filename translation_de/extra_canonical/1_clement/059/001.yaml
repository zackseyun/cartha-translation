id: 1CLEM.59.1
reference: 1 Clement 59:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: de
  text: Wenn aber einige dem nicht gehorchen, was er durch uns gesagt hat, sollen sie wissen, dass sie sich in eine Verfehlung und in keine geringe Gefahr verstricken werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: nicht gehorchen
  rationale: Gibt den Gedanken des verweigerten Gehorsams natürlich wieder, ohne ihn auf bloßen Unglauben oder ein rein intellektuelles Nichtzustimmen zu verengen.
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: dem, was er durch uns gesagt hat
  rationale: Bewahrt sowohl den göttlichen Urheber („er“) als auch die menschliche Vermittlung („durch uns“) und entspricht der substantivierten griechischen Wendung.
- source_word: παραπτώσει
  choice: Verfehlung
  rationale: Entspricht dem Sinn einer Übertretung oder eines Fehltritts, ohne unnötig eine spezifische dogmatische Kategorie festzulegen.
- source_word: ἐνδήσουσιν
  choice: sich … verstricken werden
  rationale: Bewahrt das bildhafte Moment des Sich-Bindens beziehungsweise Hineingeratens und klingt im modernen Deutschen idiomatisch.
- source_word: κινδύνῳ οὐ μικρῷ
  choice: in nicht geringe Gefahr
  rationale: Erhält die litotische Ausdrucksweise des Griechischen statt sie zu „große Gefahr“ zu glätten.
theological_decisions:
- issue: Bezug des Pronomens αὐτοῦ
  choice: „er“ kleingeschrieben und ohne erklärenden Zusatz
  alternative: „Gott“ oder „Christus“ ausdrücklich einsetzen
  rationale: Der Vers selbst benennt den Referenten nicht. Die Übersetzung bewahrt diese im unmittelbaren Wortlaut vorhandene Bezugsoffenheit.
- issue: Autorität der übermittelten Worte
  choice: „was er durch uns gesagt hat“
  alternative: „unsere Worte“
  rationale: Die griechische Formulierung stellt die Worte als von „ihm“ gesprochen und durch die Verfasser vermittelt dar; diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, wird aber idiomatisch formuliert. Die Litotes „nicht geringe Gefahr“ und die Vermittlungsformel „durch uns“ bleiben bewusst erhalten.
