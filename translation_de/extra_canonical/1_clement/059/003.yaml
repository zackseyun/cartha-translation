  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: de
  text: 'auf deinen Namen zu hoffen, den Ursprung aller Schöpfung,[a] da du die Augen unseres Herzens geöffnet hast, damit wir dich erkennen: dich, den alleinigen Höchsten unter den Höchsten, den Heiligen, der unter den Heiligen ruht; dich, der den Hochmut der Stolzen erniedrigt, die Pläne der Völker vereitelt, die Niedrigen erhöht und die Erhabenen erniedrigt, reich und arm macht, tötet, lebendig macht und leben lässt; dich, den einzigen Wohltäter der Geister und Gott allen Fleisches; dich, der in die Tiefen hinabschaut, über die Taten der Menschen wacht, den Gefährdeten hilft, die Hoffnungslosen rettet und jeden Geist erschafft und beaufsichtigt; dich, der die Völker auf der Erde zahlreich macht und aus ihnen allen diejenigen erwählt, die dich lieben, durch Jesus, den Messias, deinen geliebten Diener,[b] durch den du uns unterwiesen, geheiligt und geehrt hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf deinen Namen, aus dem alle Schöpfung zuerst hervorging“. Die genaue Beziehung von „Ursprung“ zu „Name“ ist im Griechischen ungewöhnlich und nicht völlig eindeutig.'
    reason: Bewahrt die syntaktische und semantische Mehrdeutigkeit von ἀρχέγονον πάσης κτίσεως ὄνομά σου.
  - marker: b
    text: Das griechische Wort kann „Diener“ oder „Kind“ bedeuten; in diesem Zusammenhang ist auch die Wiedergabe „Sohn“ möglich.
    reason: Kennzeichnet die theologisch bedeutsame Mehrdeutigkeit von παῖς, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: ἀρχέγονον
  choice: Ursprung
  rationale: Das Wort bezeichnet hier das ursprünglich Hervorgebrachte bzw. den ersten Ursprung. Die knappe Wiedergabe wahrt den Schöpfungsbezug und lässt die syntaktische Zuordnung durch eine Fußnote offen.
- source_word: ὕψιστον ἐν ὑψίστοις
  choice: den alleinigen Höchsten unter den Höchsten
  rationale: Gibt den substantivischen Singular und den pluralischen Vergleichs- bzw. Bereichsausdruck formal erkennbar wieder.
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  choice: den Heiligen, der unter den Heiligen ruht
  rationale: Der substantivische Singular wird als Titel wiedergegeben; der Dativ Plural bleibt als personale Bezeichnung verständlich.
- source_word: ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: lebendig macht und am Leben erhält
  rationale: Bewahrt beide griechischen Wendungen, ohne im Deutschen bloß tautologisch zu klingen.
- source_word: ἐπίσκοπον
  choice: behütet / wacht über
  rationale: Im Kontext bezeichnet das Wort Gottes fürsorgliche Aufsicht; eine kirchenamtliche Wiedergabe wie „Bischof“ wäre anachronistisch und missverständlich.
- source_word: ἀπηλπισμένων
  choice: die Hoffnungslosen
  rationale: Bezeichnet Menschen, die verzweifelt sind bzw. keine Hoffnung mehr haben.
- source_word: παιδός
  choice: Diener
  rationale: Im Gebets- und Sendungskontext ist „Diener“ eine natürliche Wiedergabe; die mögliche Bedeutung „Kind/Sohn“ wird in der Fußnote offengehalten.
- source_word: ἐπαίδευσας
  choice: unterwiesen
  rationale: Trifft hier den Sinn religiöser Erziehung und Belehrung in würdigem, modernem Deutsch.
theological_decisions:
- issue: Bezug von ἀρχέγονον πάσης κτίσεως
  choice: 'Apposition zu „deinen Namen“: „deinen Namen, den Ursprung aller Schöpfung“'
  alternative: „auf deinen ursprünglichen Namen, der vor aller Schöpfung ist“ bzw. „auf deinen Namen, aus dem alle Schöpfung zuerst hervorging“
  rationale: Kasus und Wortstellung legen eine appositionelle Verbindung mit ὄνομά σου nahe, doch die ungewöhnliche Formulierung bleibt semantisch mehrdeutig; die Fußnote bewahrt diese Spannung.
- issue: Bedeutung von παῖς für Jesus
  choice: „deinen geliebten Diener“
  alternative: „dein geliebtes Kind“ oder „dein geliebter Sohn“
  rationale: „Diener“ entspricht dem traditionsgeschichtlichen und funktionalen Gebrauch, ohne die lexikalische Mehrdeutigkeit des griechischen Wortes zu leugnen.
- issue: „Heilige unter Heiligen“
  choice: personale Wiedergabe im Plural
  alternative: „der im Heiligtum ruht“ oder „der im Heiligen ruht“
  rationale: Die Form ἁγίοις kann morphologisch maskulin oder neutrum sein. Im parallelen Ausdruck „Höchster unter den Höchsten“ ist die personale Lesart naheliegend, aber nicht dogmatisch weiterbestimmt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die wiederholten „dich“-Anschlüsse machen die lange griechische Akkusativkette für heutige Leser nachvollziehbar. Biblisch geprägte Ausdrücke wie „Augen unseres Herzens“, „Gott allen Fleisches“ und „Messias“ bleiben erhalten; unnötig kirchenamtliche oder konfessionell festgelegte Begriffe werden vermieden.
