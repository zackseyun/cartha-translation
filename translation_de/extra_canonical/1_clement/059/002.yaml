  terminology: „Schöpfer aller Dinge“, „Erwählte“, „unversehrt bewahre“, „Finsternis“, „Erkenntnis“ und „Herrlichkeit seines Namens“ entsprechen dem würdevollen, liturgisch geprägten Register. „Jesus Christus“ ist als Namensform angemessen. Die Fußnote zu „Diener“ ist sachlich und wahrt die lexikalische Mehrdeutigkeit von παῖς.
