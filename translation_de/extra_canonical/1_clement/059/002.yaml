id: 1CLEM.59.2
reference: 1 Clement 59:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: de
  text: Wir aber werden uns an dieser Sünde nicht schuldig machen und in inständigem Gebet und Flehen darum bitten, dass der Schöpfer aller Dinge die Zahl seiner Erwählten, die in der ganzen Welt gezählt worden ist, durch seinen geliebten Diener[a] Jesus Christus unversehrt bewahre, durch den er uns aus der Finsternis ins Licht gerufen hat, aus der Unwissenheit zur Erkenntnis der Herrlichkeit seines Namens,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geliebtes Kind“.'
    reason: Das griechische Wort παῖς kann sowohl „Diener“ als auch „Kind“ bedeuten; im vorliegenden Gebetskontext ist „Diener“ wahrscheinlich, doch die Mehrdeutigkeit soll erhalten bleiben.
lexical_decisions:
- source_word: ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας
  choice: werden an dieser Sünde unschuldig sein
  rationale: Gibt die Wendung idiomatisch wieder, ohne den zukünftigen Aussagecharakter abzuschwächen.
- source_word: ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι
  choice: in inständigem Gebet und Flehen
  rationale: Bewahrt sowohl die Intensität von ἐκτενής als auch die beiden eng verwandten Gebetsbegriffe.
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: die gezählte Zahl
  rationale: Hält das Zählmotiv des griechischen Perfektpartizips ausdrücklich fest und vermeidet die interpretierende Festlegung auf eine vorherbestimmte Zahl.
- source_word: ὁ δημιουργὸς τῶν ἁπάντων
  choice: der Schöpfer aller Dinge
  rationale: Natürliches modernes Deutsch für den umfassenden griechischen Ausdruck.
- source_word: διαφυλάξῃ ἄθραυστον
  choice: unversehrt bewahre
  rationale: Verbindet das sorgfältige Bewahren mit dem Zustand des Ungebrochenseins bzw. der Unversehrtheit.
- source_word: παιδὸς
  choice: Diener
  rationale: Im liturgisch-schriftgeprägten Kontext klingt die Gestalt des Gottesknechts an; die mögliche Bedeutung „Kind“ bleibt in der Fußnote sichtbar.
- source_word: ἐπίγνωσιν
  choice: Erkenntnis
  rationale: Gibt den Begriff ohne die interpretierende Verstärkung „volle Erkenntnis“ wieder.
theological_decisions:
- issue: Bedeutung von παῖς für Jesus
  choice: Diener
  alternative: Kind
  rationale: „Diener“ wahrt hier wahrscheinlich die Anspielung auf den Gottesknecht und den frühchristlich-liturgischen Sprachgebrauch; da παῖς auch „Kind“ bedeuten kann, wird diese echte Mehrdeutigkeit ausgewiesen.
- issue: Bedeutung der gezählten Zahl der Erwählten
  choice: gezählte Zahl
  alternative: festgesetzte Zahl
  rationale: Die Übersetzung hält sich an das Zählmotiv und vermeidet eine zusätzliche Aussage darüber, ob diese Zahl durch Vorherbestimmung festgesetzt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die lange Satzstruktur und das abschließende Komma bleiben erhalten, da der griechische Text in den folgenden Vers hinein weiterführt.
