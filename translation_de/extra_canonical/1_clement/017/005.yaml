revisions:
- from: 'Mose wurde in seinem ganzen Haus als treu bezeichnet. Durch seinen Dienst richtete Gott Ägypten mit den Plagen und Qualen, die über seine Bewohner kamen. Doch obwohl Mose hoch geehrt worden war, überhob er sich nicht, sondern sagte, als ihm am Dornbusch eine göttliche Weisung gegeben wurde: »Wer bin ich, dass du mich sendest? Ich habe doch nur eine schwache Stimme und eine schwerfällige Zunge.«'
  to: 'Mose wurde in seinem ganzen Haus als treu bezeichnet. Durch seinen Dienst richtete Gott Ägypten durch die Plagen und Qualen, die die Ägypter trafen. Doch obwohl Mose hoch geehrt worden war, überhob er sich nicht, sondern sagte, als ihm am Dornbusch eine göttliche Weisung gegeben wurde: »Wer bin ich, dass du mich sendest? Denn ich habe eine schwache Stimme und eine schwerfällige Zunge.«'
  rationale: Die Revision entfernt die nicht erforderliche Ausdeutung des Possessivpronomens bei den Strafleiden und die zusätzliche Partikel „nur“. Die zweimalige Wiedergabe von διά mit „durch“ entspricht der instrumentalen Wiederholung im griechischen Text. Der Bezug auf die Ägypter wird im Deutschen explizit genug ausgedrückt, ohne weitere historische oder theologische Deutung einzutragen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:57:01Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Gedankengang und die meisten Schlüsselbegriffe gut. Die Ergänzung „die über seine Bewohner kamen“ legt jedoch den nicht ausdrücklich genannten Bezug von αὐτῶν stärker aus, als der griechische Wortlaut es tut. Außerdem fügt „doch nur“ bei Moses’ Selbstbeschreibung eine Einschränkung hinzu, die im Ausgangstext nicht steht.
  naturalness: Würdiges, gut verständliches modernes Standarddeutsch. „Durch die Plagen und Qualen, die die Ägypter trafen“ ist idiomatisch und macht den gemeinten Bezug klar, ohne die Plagen als Besitz Ägyptens missverständlich erscheinen zu lassen.
  terminology: „treu“, „Dienst“, „richtete“, „Dornbusch“, „göttliche Weisung“ und „überhob er sich nicht“ sind angemessen. „Plagen und Qualen“ gibt μάστιγες und αἰκίσματα im Kontext hinreichend genau wieder. „schwache Stimme und eine schwerfällige Zunge“ bewahrt die konkreten Bilder von ἰσχνόφωνος und βραδύγλωσσος.
  issues:
  - severity: medium
    issue: Explizierung von αὐτῶν als „die über seine Bewohner kamen“
    rationale: Das Pronomen αὐτῶν bleibt im griechischen Satz knapp und bezieht sich im Kontext auf die Ägypter bzw. die sie treffenden Strafleiden. „seine Bewohner“ fügt ein Besitzverhältnis zu „Ägypten“ und eine erklärende Relativkonstruktion ein, die nicht im Wortlaut steht.
  - severity: low
    issue: Zusatz „doch nur“ in der Selbstaussage Moses’
    rationale: Das Original sagt schlicht „denn/aber ich bin schwach an Stimme und langsam an Zunge“. „nur“ verstärkt die Selbstabwertung und sollte nicht ergänzt werden.
