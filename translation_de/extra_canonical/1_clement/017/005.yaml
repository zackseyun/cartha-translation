source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: de
  text: 'Mose wurde in seinem ganzen Haus als treu bezeichnet. Durch seinen Dienst richtete Gott Ägypten durch die Plagen und Qualen, die die Ägypter trafen. Doch obwohl Mose hoch geehrt worden war, überhob er sich nicht, sondern sagte, als ihm am Dornbusch eine göttliche Weisung gegeben wurde: »Wer bin ich, dass du mich sendest? Denn ich habe eine schwache Stimme und eine schwerfällige Zunge.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: in seinem ganzen Haus als treu
  rationale: Bewahrt die Anspielung auf die biblische Aussage über Mose und lässt den Bezug des Possessivpronomens ebenso offen wie der griechische Text.
- source_word: διὰ τῆς ὑπηρεσίας αὐτοῦ
  choice: durch seinen Dienst
  rationale: Gibt διά instrumental und ὑπηρεσία als den von Mose geleisteten Dienst knapp und natürlich wieder.
- source_word: διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν
  choice: mit den Plagen und Qualen, die über seine Bewohner kamen
  rationale: „Plagen und Qualen“ erfasst die Straf- und Leidensbegriffe; die Auflösung von αὐτῶν vermeidet im Deutschen den irreführenden Eindruck, Ägypten besitze die Plagen als handelndes Mittel.
- source_word: δοξασθεὶς μεγάλως
  choice: hoch geehrt worden war
  rationale: Drückt das passive δοξασθείς in natürlichem Deutsch aus, ohne Mose als Quelle seiner eigenen Ehre darzustellen.
- source_word: οὐκ ἐμεγαλοφρόνησεν
  choice: überhob er sich nicht
  rationale: Bezeichnet Hochmut beziehungsweise anmaßende Selbsterhöhung und vermeidet die im heutigen Sprachgebrauch missverständliche wörtliche Wiedergabe „dachte nicht groß“.
- source_word: χρηματισμοῦ αὐτῷ δεδομένου
  choice: als ihm … eine göttliche Weisung gegeben wurde
  rationale: Im Kontext der Offenbarung am Dornbusch bezeichnet χρηματισμός eine von Gott erteilte Botschaft oder Weisung; die passive Form des Originals bleibt erhalten.
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: eine schwache Stimme und eine schwerfällige Zunge
  rationale: Gibt beide körperlich-sprachlichen Bilder konkret wieder, statt sie vorschnell als allgemeine mangelnde Redekunst auszulegen.
theological_decisions:
- issue: Bezug von „seinem ganzen Haus“
  choice: Das Possessivpronomen bleibt unbestimmt.
  alternative: „in Gottes ganzem Haus“ oder „in seinem eigenen ganzen Haus“
  rationale: Das griechische αὐτοῦ nennt den Bezugsgegenstand nicht ausdrücklich; eine Festlegung würde die im Wortlaut vorhandene Offenheit beseitigen.
- issue: Moses Demut trotz seiner Ehrung
  choice: „überhob er sich nicht“
  alternative: „wurde er nicht hochmütig“
  rationale: Beide Wiedergaben treffen den Sinn; die gewählte Form macht die bewusste Selbsterhöhung als verneinte Reaktion deutlich, ohne eine weitergehende Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für gute Lesbarkeit leicht gegliedert; die biblischen Bilder „Haus“, „Dornbusch“, „schwache Stimme“ und „schwerfällige Zunge“ bleiben erhalten. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext verständlich wiedergegeben werden.
