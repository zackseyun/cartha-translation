  source_fidelity: 'Die zentralen Begriffe sind zutreffend wiedergegeben: φίλος τοῦ θεοῦ als „Freund Gottes“, ἀτενίζων als konzentriertes Hinblicken, ταπεινοφρονῶν als demütige Haltung und γῆ καὶ σποδός bewusst als „Erde und Asche“. Das historische Präsens λέγει wird mit „sagt“ bewahrt. Die Wendung „erhielt ein herausragendes Zeugnis“ ist jedoch für ἐμαρτυρήθη μεγάλως weniger idiomatisch und verdeckt die passive Aussage, dass Abraham in hohem Maß bezeugt bzw. gerühmt wurde.'
