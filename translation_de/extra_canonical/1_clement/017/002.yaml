source:
  edition: Funk 1901 (normalized OCR)
  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: de
  text: 'Abraham wurde hoch gerühmt und Freund Gottes genannt. Den Blick fest auf die Herrlichkeit Gottes gerichtet, sagt er voller Demut: »Ich aber bin Erde und Asche.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: erhielt ein herausragendes Zeugnis
  rationale: Gibt die passive Wendung und die verstärkende Bedeutung von μεγάλως in natürlichem Deutsch wieder, ohne sie auf bloßes Lob oder einen guten Ruf einzuengen.
- source_word: φίλος … τοῦ θεοῦ
  choice: Freund Gottes
  rationale: Entspricht der Genitivverbindung direkt und bewahrt die traditionsreiche biblische Bezeichnung.
- source_word: ἀτενίζων εἰς
  choice: den Blick fest auf … gerichtet
  rationale: Bringt das anhaltende, aufmerksame Hinschauen des Partizips idiomatisch zum Ausdruck.
- source_word: ταπεινοφρονῶν
  choice: voller Demut
  rationale: Gibt die demütige innere Haltung prägnant und in gegenwärtigem Standarddeutsch wieder.
- source_word: γῆ καὶ σποδός
  choice: Erde und Asche
  rationale: Folgt dem vorliegenden griechischen Wortlaut γῆ („Erde“) statt ihn nach dem hebräischen Wortlaut von Genesis 18,27 zu „Staub“ anzugleichen.
theological_decisions:
- issue: Abrahams Bezeichnung als Freund Gottes
  choice: wurde Freund Gottes genannt
  alternative: wurde ein Freund Gottes genannt
  rationale: Der artikellose deutsche Titel klingt als feste Ehrenbezeichnung natürlich und bildet τοῦ θεοῦ ohne konfessionelle Zusatzdeutung ab.
- issue: Bezug des demütigen Sinnes
  choice: sagt er voller Demut
  alternative: sagt er demütig gesinnt
  rationale: Die Formulierung bezieht ταπεινοφρονῶν auf Abrahams Haltung beim Sprechen, ohne den Begriff psychologisch oder lehrmäßig weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das historische Präsens λέγει wird als „sagt“ bewahrt. Die direkte Rede folgt bewusst dem griechischen „Erde und Asche“.
