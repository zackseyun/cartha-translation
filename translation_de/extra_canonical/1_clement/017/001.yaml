reference: 1 Clement 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: de
  text: Lasst uns auch jene nachahmen, die in Ziegen- und Schafsfellen umherzogen und das Kommen Christi[a] verkündeten. Gemeint sind Elia und Elisa sowie auch Hesekiel, die Propheten; außerdem jene, die Anerkennung gefunden haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: des Messias.'
    reason: Χριστός bedeutet wörtlich „Gesalbter“ und entspricht dem Titel „Messias“, wird hier jedoch im Haupttext als „Christus“ wiedergegeben.
  - marker: b
    text: 'Oder: die, denen ein gutes Zeugnis ausgestellt wurde.'
    reason: Die griechische Passivform kann wörtlicher mit einer Wendung des Bezeugens wiedergegeben werden; im Zusammenhang hat sie einen positiven, anerkennenden Sinn.
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: Lasst uns … nachahmen
  rationale: Gibt die auffordernde Form natürlich wieder; das griechische Prädikatsnomen „Nachahmer werden“ wird im Deutschen idiomatisch als verbale Aufforderung formuliert.
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν
  choice: in Ziegen- und Schaffellen umherzogen
  rationale: Bewahrt beide Arten von Tierfellen und gibt περιπατέω im konkreten Sinn als wanderndes Umherziehen wieder.
- source_word: κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: das Kommen Christi verkündeten
  rationale: „Verkündeten“ entspricht dem öffentlichen Ausrufen von κηρύσσω; „Kommen“ ist eine klare, nicht überdeutende Wiedergabe von ἔλευσις.
- source_word: τοὺς μεμαρτυρημένους
  choice: jene, die Anerkennung gefunden haben
  rationale: Der perfekte Passivpartizip bezeichnet hier positiv Bezeugte beziehungsweise Anerkannte. Die Formulierung wahrt den positiven Sinn, ohne den Urheber der Anerkennung ausdrücklich festzulegen.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: Χριστός erscheint hier als etablierter Titel beziehungsweise Name. „Christus“ ist die direkte deutsche Entsprechung; die messianische Bedeutung wird in einer Fußnote kenntlich gemacht.
- issue: Urheber der Anerkennung bei μεμαρτυρημένους
  choice: nicht ausdrücklich genannt
  alternative: von Gott anerkannt
  rationale: Die Passivform nennt den Urheber nicht. Obwohl der Zusammenhang an Hebräer 11 erinnern kann, soll eine göttliche Urheberschaft nicht stillschweigend in den Haupttext eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderung ist idiomatisch formuliert; die prophetische Aufzählung und die im Griechischen nicht genannte Instanz der Anerkennung bleiben erhalten.
