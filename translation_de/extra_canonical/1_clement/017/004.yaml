source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλ’ αὐτὸς ἑαυτοῦ κατηγορεῖ λέγων· Οὐδεὶς καθαρὸς ἀπὸ ῥύπου, οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/004.yaml
  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: de
  text: 'Doch er klagt sich selbst an[a] und sagt: »Niemand ist frei von Unreinheit, selbst wenn sein Leben nur einen Tag währt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er erhebt Anklage gegen sich selbst«.'
    reason: Die Alternative bildet die forensische Nuance von κατηγορεῖ und die genitivische Konstruktion ἑαυτοῦ etwas formaler ab.
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Gibt den adversativen Übergang knapp und würdig wieder.
- source_word: αὐτὸς ἑαυτοῦ κατηγορεῖ
  choice: er klagt sich selbst an
  rationale: Entspricht der ausdrücklichen Verbindung aus betontem αὐτός, reflexivem ἑαυτοῦ und κατηγορεῖ; im Deutschen ist „sich selbst anklagen“ natürlich und präzise.
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: frei von Unreinheit
  rationale: Bewahrt die Konstruktion „rein/frei von“ und gibt ῥύπος in seinem Sinn als Befleckung oder Unreinheit verständlich wieder.
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: selbst wenn sein Leben nur einen Tag währt
  rationale: Gibt die konzessive Wendung mit ἄν idiomatisch wieder; „währt“ macht die gemeinte Lebensdauer deutlich, ohne den Sinn auszubauen.
theological_decisions:
- issue: Umfang der menschlichen Unreinheit
  choice: „Niemand ist frei von Unreinheit“ ohne nähere dogmatische Bestimmung
  alternative: „Niemand ist ohne Sünde“
  rationale: Der griechische Text sagt ῥύπος („Unreinheit/Befleckung“), nicht ausdrücklich ἁμαρτία („Sünde“). Die Bildsprache und ihre theologische Spannung bleiben daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Griechischen, wird jedoch bei der Altersangabe idiomatisch formuliert. Das betonte αὐτός wird durch „er … selbst“ erhalten.
