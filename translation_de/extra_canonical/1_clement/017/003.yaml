  terminology: „Gerecht“, „untadelig“ und „gottesfürchtig“ sind sachgerecht. „Wahrhaftig“ bewahrt den nicht völlig eng festlegbaren Bedeutungsumfang von ἀληθινός; die Fußnote nennt plausible Alternativen, ohne eine davon als zwingend auszugeben. Die Namensform „Hiob“ ist im Deutschen etabliert.
