  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: de
  text: 'Auch über Hiob steht Folgendes geschrieben: »Hiob war gerecht und untadelig, wahrhaftig,[a] gottesfürchtig und hielt sich von allem Bösen fern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufrichtig« beziehungsweise »echt«.'
    reason: ἀληθινός kann je nach Akzent Wahrhaftigkeit, Aufrichtigkeit oder Echtheit bezeichnen.
lexical_decisions:
- source_word: δίκαιος
  choice: gerecht
  rationale: Die übliche und kontextuell passende Wiedergabe für moralische Rechtschaffenheit.
- source_word: ἄμεμπτος
  choice: untadelig
  rationale: Gibt die Bedeutung »ohne berechtigten Tadel« präzise und in natürlichem Deutsch wieder.
- source_word: ἀληθινός
  choice: wahrhaftig
  rationale: Bewahrt die Aussage über Echtheit beziehungsweise Wahrhaftigkeit, ohne sie enger als »ehrlich« oder »aufrichtig« festzulegen.
- source_word: θεοσεβής
  choice: gottesfürchtig
  rationale: Entspricht der etablierten Bedeutung einer ehrfürchtigen, an Gott ausgerichteten Haltung.
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: hielt sich von allem Bösen fern
  rationale: ἀπέχομαι bezeichnet das Sich-Fernhalten beziehungsweise Sich-Enthalten; die finite Koordination ist im Deutschen natürlicher als eine schwerfällige Partizipialkonstruktion.
theological_decisions:
- issue: Bedeutungsumfang von ἀληθινός
  choice: wahrhaftig
  alternative: aufrichtig; echt
  rationale: »Wahrhaftig« lässt sowohl charakterliche Wahrhaftigkeit als auch Echtheit anklingen und vermeidet eine unbegründete dogmatische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Einleitungsformel bleibt nah am griechischen Wortlaut; die abschließende Partizipialkonstruktion wird für natürliche Lesbarkeit als koordinierter Verbalsatz wiedergegeben.
