  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes wieder: die Einleitung über Hiob, δίκαιος („gerecht“), ἄμεμπτος („untadelig“), ἀληθινός („wahrhaftig“), θεοσεβής („gottesfürchtig“) und ἀπεχόμενος ἀπὸ παντὸς κακοῦ („hielt sich von allem Bösen fern“). Besonders die letzte Formulierung trifft ἀπέχομαι angemessen als Sich-Fernhalten bzw. Sich-Enthalten und vermeidet die weniger genaue Wiedergabe „sich abwenden“.'
