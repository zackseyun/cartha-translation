lexical_decisions:
- source_word: ἀτμὶς
  choice: Dampf
  rationale: Im Zusammenhang mit ἀπὸ χύτρας bezeichnet das Wort natürlich den aus einem Topf aufsteigenden Dampf; „Dunst“ oder „Hauch“ wären weniger konkret.
- source_word: χύτρας
  choice: Topf
  rationale: Das gewöhnliche, konkrete deutsche Wort gibt das Kochgefäß χύτρα klar und natürlich wieder.
- source_word: Ἐγὼ δέ
  choice: Ich aber
  rationale: Bewahrt die ausdrückliche Setzung des Pronomens und die kontrastive Partikel δέ, ohne den knappen Ausspruch auszudeuten.
theological_decisions:
- issue: Bildsprache der Selbsterniedrigung und Vergänglichkeit
  choice: Die konkrete Metapher „Dampf aus einem Topf“ wird unverändert beibehalten.
  alternative: Eine erklärende Wiedergabe wie „ein vergänglicher Hauch“
  rationale: Der griechische Text nennt ein konkretes Bild; eine abstrakte Deutung würde dessen Eigenart und mögliche Anspielung vorschnell auflösen.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die ungewöhnliche, anschauliche Formulierung des griechischen Textes bleibt bewusst erhalten.
