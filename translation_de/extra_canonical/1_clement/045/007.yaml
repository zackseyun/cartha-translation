revisions:
- from: Oder wurden Hananja, Asarja und Mischaël etwa von Menschen, die die erhabene und herrliche Gottesverehrung des Höchsten ausübten, in einen Feuerofen eingeschlossen? Auch das sei ferne! Wer waren also die, die so handelten? Es waren abscheuliche Menschen, erfüllt von jeder Bosheit. Sie steigerten sich so sehr in Zorn hinein, dass sie diejenigen misshandelten, die Gott mit heiliger und untadeliger Hingabe dienten. Dabei wussten sie nicht, dass der Höchste der Beistand und Beschützer derer ist, die seinem vollkommen guten Namen mit reinem Gewissen dienen. Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit. Amen.
  to: Oder wurden Hananja, Asarja und Mischaël etwa von Menschen, die die erhabene und herrliche Gottesverehrung des Höchsten ausübten, in einen Feuerofen eingeschlossen? Das sei fern! Wer waren also die, die dies taten? Es waren abscheuliche Menschen, erfüllt von jeder Bosheit. Sie ließen sich zu solcher Wut hinreißen, dass sie diejenigen misshandelten, die Gott in heiliger und untadeliger Gesinnung dienten. Dabei wussten sie nicht, dass der Höchste der Beistand und Beschützer derer ist, die seinem an allen Tugenden reichen Namen mit reinem Gewissen dienen. Ihm sei die Herrlichkeit in alle Ewigkeit. Amen.
  rationale: Die Revision ist begrenzt auf zwei semantisch relevante Präzisierungen (πρόθεσις und παναρέτῳ) sowie kleine stilistische Anpassungen. Die Einordnung der Täter als Menschen, die rhetorisch als Praktizierende der Gottesverehrung des Höchsten vorgestellt werden, bleibt erhalten. Die englische Fußnote zu »cast down/brought down« wird nicht übernommen, weil die deutsche Fassung bereits die quellennahe Bedeutung »eingeschlossen« bietet und keine Fußnote benötigt.
