source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Oder wurden Hananja, Asarja und Mischaël etwa von Menschen, die die erhabene und herrliche Gottesverehrung des Höchsten ausübten, in einen Feuerofen eingeschlossen? Das sei fern! Wer waren also die, die dies taten? Es waren abscheuliche Menschen, erfüllt von jeder Bosheit. Sie ließen sich zu solcher Wut hinreißen, dass sie diejenigen misshandelten, die Gott in heiliger und untadeliger Gesinnung dienten. Dabei wussten sie nicht, dass der Höchste der Beistand und Beschützer derer ist, die seinem an allen Tugenden reichen Namen mit reinem Gewissen dienen. Ihm sei die Herrlichkeit in alle Ewigkeit. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν
  choice: wurden … eingeschlossen
  rationale: Das Passiv von κατείργω bezeichnet das Einschließen oder Gefangenhalten; es bedeutet hier nicht »hinabwerfen«.
- source_word: θρησκευόντων … θρησκείαν
  choice: die … Gottesverehrung … ausübten
  rationale: Die etymologische Wiederholung wird in natürlichem Deutsch sinngemäß bewahrt; im Kontext geht es um kultische bzw. religiöse Verehrung.
- source_word: στυγητοὶ
  choice: abscheuliche Menschen
  rationale: Das Wort bezeichnet Verhasste bzw. Abscheu Erregende; die substantivische Wiedergabe klingt im Deutschen natürlich.
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: misshandelten
  rationale: Die Wendung beschreibt das Ausliefern an entehrende Behandlung, Misshandlung oder Schmach; »misshandeln« bündelt dies klar und idiomatisch.
- source_word: προθέσει
  choice: Hingabe
  rationale: Hier ist die innere Ausrichtung bzw. entschlossene Absicht des Gottesdienstes gemeint; »Hingabe« passt zum Kontext, ohne die moralische Qualifizierung vorwegzunehmen.
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  choice: Beistand und Beschützer
  rationale: Beide Bezeichnungen für den eintretenden Verteidiger werden bewahrt, aber in verständlichem modernem Deutsch formuliert.
- source_word: παναρέτῳ
  choice: vollkommen guten
  rationale: Das seltene Adjektiv bedeutet etwa »mit aller Tugend/Vortrefflichkeit versehen«; bezogen auf Gottes Namen ist »vollkommen gut« verständlich und würdig.
theological_decisions:
- issue: Bezug von θρησκεία auf die Täter
  choice: Die Täter werden rhetorisch als angebliche Verehrer der Religion des Höchsten ausgeschlossen.
  alternative: Die Formulierung als allgemeine Frage nach religiös praktizierenden Menschen verstehen.
  rationale: Der anschließende Ausruf und die Frage nach den wirklichen Tätern machen den polemisch-rhetorischen Gegensatz deutlich, ohne ihn dogmatisch weiter auszulegen.
- issue: Dativ τῷ παναρέτῳ ὀνόματι bei λατρεύω
  choice: »seinem vollkommen guten Namen … dienen«
  alternative: »ihn unter seinem vollkommen guten Namen anbeten«
  rationale: Die grammatische Bindung an »Name« bleibt erhalten; zugleich wird das für λατρεύω typische religiöse Dienen ausgedrückt.
- issue: Doxologisches Relativpronomen ᾧ
  choice: »Ihm sei die Herrlichkeit« bezieht sich auf den Höchsten.
  alternative: Bezug auf den Namen Gottes
  rationale: Der nächstliegende personale Bezug ist ὁ ὕψιστος; die deutsche Form wahrt die traditionelle Doxologie, ohne einen christologischen Bezug einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Abfolge wurde mit kurzen, klaren Sätzen wiedergegeben. Die Namen folgen geläufigen deutschen Formen; »Mischaël« erhält das Trema zur eindeutigen Aussprache. Keine sachlich unpassende Fußnote aus der englischen Konsultationsschicht wurde übernommen.
