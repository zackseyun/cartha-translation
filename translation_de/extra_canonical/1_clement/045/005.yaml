lexical_decisions:
- source_word: ταῦτα πάσχοντες
  choice: Obwohl sie dies erlitten
  rationale: Die konzessive Wiedergabe gibt den Zusammenhang von Leiden und standhaftem Ertragen im natürlichen modernen Deutsch wieder; „dies“ bewahrt den Rückbezug von ταῦτα.
- source_word: εὐκλεῶς
  choice: ruhmvoll
  rationale: Das Adverb bezeichnet ein ehrenvolles, ruhmwürdiges Verhalten; „ruhmvoll“ erhält diesen wertenden Akzent knapp und würdevoll.
- source_word: ἤνεγκαν
  choice: hielten sie … stand
  rationale: Im Zusammenhang des Leidens bedeutet φέρειν hier standhaft ertragen. Die idiomatische Formulierung vermeidet das im Deutschen unnatürliche „sie trugen es“.
