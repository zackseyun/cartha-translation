  text: ἐνεκύψατε εἰς τὰς ἱερὰς γραφάς, τὰς ἀληθεῖς, τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/002.yaml
  text: You have looked closely into the holy Scriptures[a], the true ones, those given through the Holy Spirit.
translation:
  language: de
  text: Ihr habt die heiligen Schriften[a] gründlich erforscht, die wahren, die durch den Heiligen Geist gegeben sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr habt euch hinabgebeugt, um in die heiligen Schriften hineinzuschauen.«'
    reason: Bewahrt das anschauliche, wörtliche Bild von ἐγκύπτω neben seiner idiomatischen Bedeutung »gründlich erforschen«.
lexical_decisions:
- source_word: ἐνεκύψατε
  choice: habt … gründlich erforscht
  rationale: Das Verb bezeichnet wörtlich ein Sich-Hinabbeugen, um hineinzuschauen, kann bei Schriften jedoch idiomatisch das genaue Betrachten oder sorgfältige Erforschen ausdrücken.
- source_word: ἱερὰς γραφάς
  choice: heiligen Schriften
  rationale: Die feste und natürliche deutsche Entsprechung bewahrt sowohl den sakralen Charakter von ἱερός als auch den Bezug auf maßgebliche Schriften.
- source_word: τὰς ἀληθεῖς
  choice: die wahren
  rationale: Die substantivisch gebrauchte attributive Wendung wird als Apposition zu den Schriften wiedergegeben, ohne das Substantiv unnötig zu wiederholen.
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: durch den Heiligen Geist
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde Instanz; die Formulierung lässt offen, auf welche konkrete Weise die Schriften durch den Geist vermittelt wurden.
theological_decisions:
- issue: Ergänzung eines im Griechischen nicht ausdrücklich genannten Partizips bei διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: die durch den Heiligen Geist gegeben sind
  alternative: die durch den Heiligen Geist sind
  rationale: Für idiomatisches Deutsch ist ein Prädikat erforderlich. „gegeben sind“ macht die Vermittlung verständlich, ohne eine detaillierte Inspirationslehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionelle Folge „die wahren“ erhält die emphatische Struktur des Griechischen; die Fußnote dokumentiert dessen körperlich-anschauliches Verbbild.
