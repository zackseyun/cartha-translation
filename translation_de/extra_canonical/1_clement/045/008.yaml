review_pass:
  verdict: revise
  source_fidelity: Die Vergangenheitswiedergabe von οἱ ὑπομένοντες ist im historischen Kontext zutreffend. „erbten“, „wurden erhöht“ und „von Gott ... verzeichnet“ geben die aoristischen Prädikate und die passive Eintragung sachgerecht wieder. Für μνημόσυνον ist „Gedenkschrift“ jedoch zu eng und im heutigen Deutsch vor allem eine zu einem Anlass herausgegebene Schrift; der griechische Ausdruck bezeichnet hier eher Gedenken beziehungsweise eine erinnernde Aufzeichnung. Der Bezug von αὐτῶν bleibt knapp und sollte nicht über die Quelle hinaus festgelegt werden.
  naturalness: „Doch diejenigen, die in Zuversicht standhielten“ ist idiomatischer als die doppelte Konstruktion „die, die“. „Im Gedenken an sie verzeichnet“ ist modernes, würdiges Deutsch und vermeidet die missverständliche institutionelle Konnotation von „Gedenkschrift“.
  terminology: „Herrlichkeit und Ehre“, „Zuversicht“, „erhöht“ und die verstärkte Dauerformel „für immer und ewig“ sind angemessen. Die Fußnote sollte die mögliche alternative Lesart von αὐτῶν knapp dokumentieren, ohne eine angeblich wörtliche deutsche Wiedergabe zu bieten, die selbst keine eindeutige Entsprechung ist.
  issues:
  - severity: medium
    issue: „Gedenkschrift“ verengt μνημόσυνον.
    rationale: Eine Gedenkschrift ist im Deutschen gewöhnlich eine konkrete commemorative Publikation. μνημόσυνον kann Erinnerung, Gedenken oder eine memoriale Aufzeichnung meinen; der Kontext der Eintragung verlangt keine bestimmte Schriftgattung.
  - severity: low
    issue: Die Fußnote bezeichnet eine interpretierende deutsche Formulierung als „wörtlicher“ und ist unnötig umständlich.
    rationale: „in ihrem Gedenken“ ist im Deutschen selbst auslegungsbedürftig. Eine knappe Anmerkung zur möglichen possessiven gegenüber objektiven Auffassung von αὐτῶν bewahrt die Ambiguität zuverlässiger.
