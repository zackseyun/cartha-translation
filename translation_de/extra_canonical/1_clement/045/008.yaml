source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: de
  text: Doch diejenigen, die in Zuversicht standhielten, erbten Herrlichkeit und Ehre; sie wurden erhöht und von Gott im Gedenken an sie für immer und ewig verzeichnet.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Auffassung von „an sie“: „in ihrem Gedenken“. Die knappe griechische Formulierung kann sowohl Gottes Gedenken an sie als auch ein ihnen zugehöriges Gedenken beziehungsweise eine entsprechende bleibende Aufzeichnung bezeichnen.'
    reason: Die Anmerkung erhält die Mehrdeutigkeit des Genitivpronomens αὐτῶν, ohne μνημόσυνον auf eine bestimmte Art von Schrift festzulegen.
lexical_decisions:
- source_word: ὑπομένοντες
  choice: die … standhielten
  rationale: Das substantivierte Präsenspartizip bezeichnet beharrliches Ausharren; wegen der umgebenden Aoristformen und des Rückblicks auf vergangene Glaubenszeugen wird es im Deutschen vergangen wiedergegeben.
- source_word: ἐν πεποιθήσει
  choice: voller Zuversicht
  rationale: Gibt die feste, vertrauensvolle Haltung idiomatisch wieder, ohne das nicht ausdrücklich genannte Objekt des Vertrauens zu ergänzen.
- source_word: ἐκληρονόμησαν
  choice: erbten
  rationale: Bewahrt das Erbmotiv des griechischen Verbs und dessen Vergangenheitsbezug.
- source_word: ἔγγραφοι ἐγένοντο
  choice: wurden … verzeichnet
  rationale: Eine natürliche deutsche Wiedergabe der prädikativen Wendung, die den Gedanken einer bleibenden Eintragung erhält.
- source_word: μνημοσύνῳ
  choice: Gedenkschrift
  rationale: Der Ausdruck kann ein Gedenken beziehungsweise eine erinnernde Aufzeichnung bezeichnen. „Gedenkschrift“ macht im Zusammenhang mit ἔγγραφοι den Aufzeichnungsaspekt verständlich, ohne ausdrücklich ein „Buch“ in den Text einzuführen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die geläufige, würdige deutsche Entsprechung der verstärkten Ewigkeitsformel.
theological_decisions:
- issue: Zeitbezug von οἱ ὑπομένοντες
  choice: vergangenes Standhalten
  alternative: 'allgemeingültig: „die ausharren“'
  rationale: Obwohl das Partizip Präsens ist, erhält es seinen zeitlichen Bezug von den Aoristverben und dem historischen Kontext. Die Wiedergabe im Präteritum vermeidet einen unbeabsichtigten Wechsel zu einer allgemeinen Aussage.
- issue: Bezug von αὐτῶν bei μνημοσύνῳ
  choice: 'objektiver Bezug: „Gedenkschrift über sie“'
  alternative: 'possessiv: „in ihrer Gedenkschrift“ oder „in ihrem Gedenken“'
  rationale: Der Kontext legt nahe, dass die Standhaften Gegenstand des von Gott bewahrten Gedenkens beziehungsweise Eintrags sind. Da die knappe griechische Fügung mehrdeutig bleibt, wird die wörtlichere Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Kurze Hauptsätze vermeiden eine schwerfällige Reihung, während die wiederholte Koordination des griechischen Textes inhaltlich erhalten bleibt.
