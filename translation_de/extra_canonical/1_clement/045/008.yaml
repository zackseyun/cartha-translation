revisions:
- from: Doch die, die voller Zuversicht standhielten, erbten Herrlichkeit und Ehre. Sie wurden erhöht und von Gott in der Gedenkschrift über sie verzeichnet für immer und ewig.[a] Amen.
  to: Doch diejenigen, die in Zuversicht standhielten, erbten Herrlichkeit und Ehre; sie wurden erhöht und von Gott im Gedenken an sie für immer und ewig verzeichnet.[a] Amen.
  rationale: Die Revision ersetzt die im modernen Deutschen zu spezifische „Gedenkschrift“ durch „Gedenken“, bewahrt aber durch „verzeichnet“ den Eintragungsaspekt von ἔγγραφοι ἐγένοντο. Sie glättet die einleitende Relativkonstruktion und fasst die Fußnote quellennäher und klarer. Bedeutung, historische Zeitstufe und theologische Offenheit bleiben erhalten.
