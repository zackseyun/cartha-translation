source:
  edition: Funk 1901 (normalized OCR)
  text: τί γὰρ εἴπωμεν, ἀδελφοί; Δανιὴλ ὑπὸ τῶν φοβουμένων τὸν θεὸν ἐβλήθη εἰς λάκκον λεόντων;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/006.yaml
  text: For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God?
translation:
  language: de
  text: Denn was sollen wir sagen, Brüder? Wurde Daniel von denen, die Gott fürchteten, in eine Löwengrube geworfen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ εἴπωμεν
  choice: Denn was sollen wir sagen
  rationale: Gibt die einleitende rhetorische Frage natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Bewahrt die direkte Anrede und die im griechischen Text ausdrücklich männliche Form.
- source_word: ὑπὸ τῶν φοβουμένων τὸν θεόν
  choice: von Menschen, die Gott fürchteten
  rationale: Gibt das substantivierte Partizip verständlich wieder, ohne zu unterstellen, dass die Täter Gott tatsächlich fürchteten.
- source_word: λάκκον λεόντων
  choice: Löwengrube
  rationale: Die geläufige deutsche Entsprechung vermittelt knapp eine Grube, in der Löwen gehalten wurden.
theological_decisions:
- issue: Rhetorische Stoßrichtung der Frage
  choice: Die Frage bleibt formal offen; „etwa“ signalisiert die erwartete Verneinung.
  alternative: „Daniel wurde doch nicht von Gottesfürchtigen in die Löwengrube geworfen!“
  rationale: Der griechische Text verwendet eine Frage ohne ausdrückliche Negationspartikel. Die Übersetzung soll ihre implizite Antwort nicht in eine Behauptung umformen.
- issue: Status der als gottesfürchtig Bezeichneten
  choice: „Menschen, die Gott fürchteten“ als Beschreibung innerhalb der rhetorischen Frage
  alternative: „wahren Gottesfürchtigen“ oder „angeblich Gottesfürchtigen“
  rationale: Weder eine bestätigende Wertung noch eine ironische Kennzeichnung ist im Wortlaut ausdrücklich markiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hebt Daniel wie im Griechischen hervor; „etwa“ macht die im Deutschen erwartete rhetorische Lesart kenntlich, ohne eine Negation in den Text einzutragen.
