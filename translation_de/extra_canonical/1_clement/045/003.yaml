id: 1CLEM.45.3
reference: 1 Clement 45:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπίστασθε, ὅτι οὐδὲν ἄδικον οὐδὲ παρεπεποιημένον γέγραπται ἐν αὐταῖς· οὐχ εὑρήσετε δικαίους ἀποβεβλημένους ἀπὸ ὁσίων ἀνδρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/003.yaml
  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: de
  text: Ihr wisst, dass darin nichts Ungerechtes oder Verfälschtes geschrieben steht. Ihr werdet nicht finden, dass Gerechte von heiligen Männern verstoßen wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: Ihr wisst
  rationale: Gibt das sichere Wissen der Angesprochenen natürlich und direkt wieder.
- source_word: παρεπεποιημένον
  choice: Verfälschtes
  rationale: Bezeichnet hier etwas Falsches beziehungsweise manipulativ Verfälschtes und bewahrt den Bezug auf die Zuverlässigkeit der Schriften.
- source_word: ἐν αὐταῖς
  choice: darin
  rationale: Das feminine Pluralpronomen verweist auf die zuvor genannten Schriften; „darin“ ist im Deutschen flüssig, ohne den Bezug unnötig zu präzisieren.
- source_word: ἀποβεβλημένους
  choice: verstoßen wurden
  rationale: Der passive Ausdruck bezeichnet das Wegstoßen oder Verwerfen von Personen; „verstoßen“ gibt die soziale Zurückweisung prägnant wieder.
- source_word: ὁσίων ἀνδρῶν
  choice: heiligen Männern
  rationale: ὅσιος bezeichnet fromme beziehungsweise heilige Menschen; „heilig“ wahrt die religiös-ethische Färbung, während ἀνδρῶν ausdrücklich Männer meint.
theological_decisions:
- issue: Aussage über die Zuverlässigkeit der Schriften
  choice: „nichts Ungerechtes oder Verfälschtes“
  alternative: „nichts Unrechtes oder Gefälschtes“
  rationale: Die Übersetzung hält beide griechischen Prädikate auseinander und formuliert keine weitergehende Lehre über Inspiration oder Irrtumslosigkeit.
- issue: Handelnde beim Verstoßen der Gerechten
  choice: „von heiligen Männern“
  alternative: „von frommen Menschen“
  rationale: Die ausdrückliche männliche Bezeichnung ἀνδρῶν bleibt erhalten; zugleich wird ὁσίων nicht konfessionell näher bestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Die zwei griechischen Sätze werden als zwei deutsche Hauptsätze wiedergegeben; das Perfekt γέγραπται wird idiomatisch als gegenwärtiger Textzustand („geschrieben steht“) formuliert.
