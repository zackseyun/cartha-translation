id: 1CLEM.45.4
reference: 1 Clement 45:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐδιώχθησαν δίκαιοι, ἀλλ᾽ ὑπὸ ἀνόμων, ἐφυλακίσθησαν, ἀλλ᾽ ὑπὸ ἀνοσίων· ἐλιθοβόλησαν ὑπὸ παρανόμων· ἀπεκτείνθησαν ὑπὸ τῶν μιαρῶν καὶ ἀδίκων ζήλῳ ἀνεκτρίστῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: de
  text: Gerechte wurden verfolgt, aber von Gesetzlosen; sie wurden ins Gefängnis geworfen, aber von Gottlosen; sie wurden von Gesetzesbrechern gesteinigt; sie wurden von den Befleckten und Ungerechten aus unerträglicher Eifersucht getötet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: Gerechte
  rationale: Gibt die substantivisch gebrauchte Bezeichnung für rechtschaffene Menschen knapp und würdig wieder.
- source_word: ἀνόμων
  choice: Gesetzlosen
  rationale: Entspricht Menschen, die ohne Gesetz beziehungsweise gesetzlos handeln, und wahrt die bewusste Variation gegenüber παρανόμων.
- source_word: ἀνοσίων
  choice: Gottlosen
  rationale: Bezeichnet hier Menschen, denen Heiligkeit und religiös-sittliche Ehrfurcht fehlen; „Gottlose“ ist im Deutschen natürlich und kontextgemäß.
- source_word: παρανόμων
  choice: Gesetzesbrechern
  rationale: Drückt aktive Übertretung des Gesetzes aus und vermeidet die irreführende Bedeutung „Geächtete“.
- source_word: μιαρῶν
  choice: Befleckten
  rationale: Bewahrt die starke Vorstellung moralischer beziehungsweise kultischer Befleckung, ohne sie zu einer bloß allgemeinen Abwertung abzuschwächen.
- source_word: ζήλῳ ἀνεκτρίστῳ
  choice: aus unerträglicher Eifersucht
  rationale: Der Dativ bezeichnet Ursache oder Beweggrund; „Eifersucht“ passt zum negativen Gebrauch von ζῆλος im Kontext, während „unerträglich“ die ungewöhnliche Intensivierung wiedergibt.
theological_decisions:
- issue: Bedeutungsbereich von ἀνόσιοι
  choice: Gottlose
  alternative: Unheilige
  rationale: „Gottlose“ ist idiomatischer für Personen und erfasst die religiös-moralische Verfehlung; es behauptet nicht zwingend theoretischen Atheismus.
- issue: Bedeutungsbereich von ζῆλος
  choice: Eifersucht
  alternative: Eifer
  rationale: Der gewaltsame Kontext verlangt die negative Bedeutung Neid/Eifersucht. „Eifer“ könnte im modernen Deutschen fälschlich positiv wirken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit weitgehend parallelem Satzbau. Die wiederholten Passivformen und Täterangaben des Griechischen bleiben erhalten; die lexikalische Abstufung zwischen Gesetzlosen, Gottlosen und Gesetzesbrechern wird nicht eingeebnet.
