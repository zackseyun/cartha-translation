review_pass:
  verdict: revise
  source_fidelity: Die Passivreihe und die Täterangaben werden genau abgebildet. Die überlieferte Form „ἐλιθοβόλησαν“ ist neben „ὑπὸ παρανόμων“ syntaktisch auffällig; die passive Wiedergabe folgt der eindeutigen Konstruktion, dem englischen Audit-Trail und offenbar der vorauszusetzenden passiven Form. „Unreinen“ gibt μιαροί angemessen wieder und lässt die moralisch-kultische Konnotation offen. ζῆλος ist in diesem Gewaltkontext negativ als „Neid“ wiedergegeben.
  naturalness: Die parallele Satzstruktur bleibt erhalten. „Die Befleckten“ wirkt im heutigen Standarddeutsch als substantiviertes Adjektiv weniger idiomatisch und ist semantisch enger als das griechische μιαροί. „Aus unerträglichem Neid“ ist natürlich und vermeidet die im Deutschen häufig partnerschaftlich-sexuell konnotierte „Eifersucht“.
  terminology: „Gerechte“, „Gesetzlose“, „Gottlose“ und „Gesetzesbrecher“ erhalten die beabsichtigte lexikalische Abstufung. „Unreine“ wahrt für μιαροί sowohl kultische als auch moralische Unreinheit, ohne die Aussage zu einer bloßen allgemeinen Beschimpfung abzuschwächen.
  issues:
  - severity: medium
    issue: „Befleckten“ für μιαρῶν
    rationale: Die Formulierung ist als Personenbezeichnung im modernen Deutsch unnatürlich; zudem kann sie stärker auf einen vollzogenen Befleckungsvorgang verengen. „Unreinen“ ist idiomatischer und bewahrt den weiteren kultisch-moralischen Bedeutungsbereich.
  - severity: low
    issue: „Eifersucht“ für ζήλῳ
    rationale: Im gegebenen Kontext ist die negative Bedeutung zutreffend, doch „Eifersucht“ ist im heutigen Deutsch oft relational konnotiert. „Neid“ trifft den gewalttätigen, missgünstigen Antrieb hier unmittelbarer.
  - severity: low
    issue: Aktive Form ἐλιθοβόλησαν im bereitgestellten normalisierten griechischen Text
    rationale: Die aktive Form ist mit der folgenden ὑπό-Täterangabe nicht sinnvoll vereinbar. Die passive Übersetzung ist durch Syntax und Audit-Trail gestützt, sollte jedoch bei einer kritischen Endredaktion gegen die maßgebliche Edition geprüft werden.
  revised_text: Gerechte wurden verfolgt, aber von Gesetzlosen; sie wurden ins Gefängnis geworfen, aber von Gottlosen; sie wurden von Gesetzesbrechern gesteinigt; sie wurden von Unreinen und Ungerechten aus unerträglichem Neid getötet.
  revised_footnotes: []
  revision_rationale: Die Änderung verbessert die idiomatische moderne deutsche Ausdrucksweise und präzisiert die negative Bedeutung von ζῆλος, ohne den Sinn, die parallele Rhetorik oder die begrifflichen Unterschiede des griechischen Textes zu verändern. Eine Fußnote ist nicht nötig; die auffällige aktive griechische Form betrifft die Quellengestalt, nicht eine im Deutschen abzubildende semantische Alternative.
