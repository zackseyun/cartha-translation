id: 1CLEM.62.1
reference: 1 Clement 62:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: de
  text: Über die Dinge, die zu unserer Religion gehören und für ein tugendhaftes Leben denen besonders nützlich sind, die ihr Leben fromm und gerecht führen wollen, haben wir euch, Brüder, genug geschrieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκείᾳ
  choice: Gottesverehrung
  rationale: Bezeichnet hier die religiöse Verehrung beziehungsweise gelebte Religion; „Gottesverehrung“ ist im Kontext klarer und würdiger als das modern mehrdeutige „Religion“.
- source_word: ὠφελιμωτάτων
  choice: besonders nützlich
  rationale: Gibt den Superlativ idiomatisch wieder, ohne die Aussage unnötig zu übersteigern.
- source_word: ἐνάρετον βίον
  choice: ein tugendhaftes Leben
  rationale: Bewahrt die ethische Bedeutung von ἐνάρετος und den Bezug auf die Lebensführung.
- source_word: εὐσεβῶς καὶ δικαίως
  choice: in Gottesfurcht und Gerechtigkeit
  rationale: Überträgt die adverbiale Doppelformel natürlich und wahrt sowohl die auf Gott als auch die auf rechtes Handeln bezogene Dimension.
- source_word: διευθύνειν
  choice: führen
  rationale: Das Verb meint das ordnende Ausrichten beziehungsweise Lenken des Lebens; „ihr Leben … führen“ ist im Deutschen natürlich.
- source_word: ἱκανῶς ἐπεστείλαμεν
  choice: ausführlich genug geschrieben
  rationale: ἱκανῶς bedeutet „hinreichend/genügend“; zusammen mit dem Briefverb ἐπιστέλλω ergibt sich idiomatisch „ausführlich genug geschrieben“.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die feste Anrede wird knapp und natürlich wiedergegeben; das zusätzliche ἄνδρες verstärkt die Anrede, verlangt im Deutschen aber kein unbeholfenes „Männer, Brüder“.
theological_decisions:
- issue: Bedeutung von εὐσεβῶς
  choice: in Gottesfurcht
  alternative: in Frömmigkeit / gottesfürchtig
  rationale: „Gottesfurcht“ bringt die Gottesbezogenheit klar zum Ausdruck, ohne eine konfessionell bestimmte Frömmigkeitsform einzutragen.
- issue: Bedeutung von θρησκεία
  choice: Gottesverehrung
  alternative: Religion / religiöser Dienst
  rationale: Der Kontext spricht allgemein von den zur gemeinsamen religiösen Praxis und Überzeugung gehörenden Dingen. „Gottesverehrung“ wahrt diesen Sinn, ohne das Wort auf bloße Rituale einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte griechische Satzstruktur wird durch Gedankenstriche lesbar gegliedert; der Gegensatz beziehungsweise die Verbindung der beiden περὶ-Glieder bleibt erhalten. Kein einleitendes „Nun“, da im Griechischen kein entsprechendes Zeit- oder Diskursadverb steht.
