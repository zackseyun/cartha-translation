id: 1CLEM.62.3
reference: 1 Clement 62:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: de
  text: Und wir haben euch umso mehr an diese Dinge erinnert, weil wir sehr wohl wussten, dass wir an treue und höchst angesehene Männer schreiben, die sich eingehend in die Aussprüche der Unterweisung Gottes vertieft haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπενήγκαμεν (OCR; wohl ὑπεμνήσαμεν)
  choice: haben euch … erinnert
  rationale: Die überlieferte Form im normalisierten OCR ist kontextuell und textkritisch wahrscheinlich ein Fehler für ὑπεμνήσαμεν; die Wiedergabe wahrt zudem den Anschluss an das Erinnern im vorhergehenden Vers.
- source_word: τοσούτῳ μᾶλλον
  choice: umso nachdrücklicher
  rationale: Drückt die Steigerung idiomatisch aus, ohne einen ausdrücklich genannten Vergleichsmaßstab hinzuzufügen.
- source_word: πιστοῖς
  choice: treue
  rationale: Bewahrt die mögliche Bedeutung von zuverlässig beziehungsweise im Glauben treu, ohne sie konfessionell einzuengen.
- source_word: ἐλλογιμωτάτοις
  choice: höchst angesehene
  rationale: Gibt den Superlativ und die Bedeutung angesehen beziehungsweise hochgeschätzt in natürlichem Deutsch wieder.
- source_word: ἐγκεχυφόσιν εἰς
  choice: die sich tief … vertieft haben
  rationale: Die ungewöhnliche Form bezeichnet ein tiefes Eindringen beziehungsweise Sich-Versenken; die deutsche Formulierung wahrt dieses Bild besser als bloßes Unterwiesensein.
- source_word: τὰ λόγια
  choice: die Aussprüche
  rationale: Formale Wiedergabe für autoritative göttliche Worte, ohne sie vorschnell mit einer bestimmten Schriftensammlung gleichzusetzen.
- source_word: τῆς παιδείας τοῦ θεοῦ
  choice: der Unterweisung Gottes
  rationale: παιδεία umfasst Erziehung, Schulung und Zucht; Unterweisung ist hier würdig und verständlich und lässt den Genitiv als Gottes Unterweisung stehen.
theological_decisions:
- issue: Bedeutung des Genitivs τοῦ θεοῦ bei παιδείας
  choice: Unterweisung Gottes
  alternative: Unterweisung über Gott
  rationale: Der griechische Genitiv bleibt mehrdeutig; die gewählte Form hält offen, ob Gott Ursprung, Urheber oder Inhalt der Unterweisung ist.
- issue: Textkritische Deutung von ὑπενήγκαμεν
  choice: als OCR-Fehler für ὑπεμνήσαμεν verstanden
  alternative: haben diese Dinge vorgebracht / angeregt
  rationale: Die angegebene Revisionsnotiz identifiziert die Form als bekannten OCR-Fehler der Edition; ὑπεμνήσαμεν passt semantisch und stellt den lexikalischen Anschluss an den vorhergehenden Vers her.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am griechischen Gedankengang, wird jedoch idiomatisch geglättet. Das historische, grammatisch männliche ἀνδράσιν wird als „Männer“ wiedergegeben.
