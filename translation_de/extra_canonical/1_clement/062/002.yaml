revisions:
- from: 'Denn über Glauben und Umkehr, über echte Liebe, Selbstbeherrschung, Besonnenheit und standhaftes Ausharren haben wir jeden Punkt behandelt. Dabei haben wir euch daran erinnert, dass ihr dem allmächtigen Gott in Gerechtigkeit, Wahrheit und Geduld ehrfürchtig gefallen sollt: Seid einmütig und frei von Groll, lebt in Liebe und Frieden und übt beharrlich Milde. So fanden auch unsere zuvor erwähnten Väter sein Wohlgefallen, indem sie dem Vater, Gott und Schöpfer sowie allen Menschen gegenüber demütig gesinnt waren.'
  to: Denn über Glauben und Umkehr, über echte Liebe, Selbstbeherrschung, Besonnenheit und standhaftes Ausharren haben wir jeden Punkt behandelt. Dabei haben wir euch daran erinnert, dass ihr dem allmächtigen Gott in Gerechtigkeit, Wahrheit und Geduld in frommer Haltung wohlgefällig sein sollt, indem ihr einmütig und ohne Groll in Liebe und Frieden mit beharrlicher Milde lebt. So fanden auch unsere zuvor erwähnten Väter sein Wohlgefallen, indem sie in ihrem Verhältnis zum Vater, zu Gott, zum Schöpfer und zu allen Menschen demütig waren.
  rationale: Die Revision bewahrt die vollständige Tugendreihe und die Bedeutung des Entwurfs, stellt jedoch die von δεῖν abhängige Struktur wieder her. „In frommer Haltung wohlgefällig sein“ gibt die Verbindung ὁσίως εὐαρεστεῖν natürlich und quellentreu wieder. Die Schlussformulierung mit „in ihrem Verhältnis zu“ gibt τὰ πρὸς als Beziehungsbereich wieder, ohne die diskutierbare Nuance auf ein bloßes räumliches „vor“ oder ein engeres Pflichtverhältnis festzulegen.
