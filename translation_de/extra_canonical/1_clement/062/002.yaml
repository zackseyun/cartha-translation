id: 1CLEM.62.2
reference: 1 Clement 62:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: de
  text: Denn über Glauben und Umkehr, über echte Liebe, Selbstbeherrschung, Besonnenheit und standhaftes Ausharren haben wir jeden Punkt behandelt. Dabei haben wir euch daran erinnert, dass ihr dem allmächtigen Gott in Gerechtigkeit, Wahrheit und Geduld in frommer Haltung wohlgefällig sein sollt, indem ihr einmütig und ohne Groll in Liebe und Frieden mit beharrlicher Milde lebt. So fanden auch unsere zuvor erwähnten Väter sein Wohlgefallen, indem sie in ihrem Verhältnis zum Vater, zu Gott, zum Schöpfer und zu allen Menschen demütig waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας
  choice: Umkehr
  rationale: Gibt die grundlegende Sinnes- und Lebenswende wieder, ohne den Ausdruck auf bloße Reue zu verengen.
- source_word: σωφροσύνης
  choice: Besonnenheit
  rationale: Bezeichnet vernünftige, maßvolle Selbstbeherrschung und wird im heutigen Deutsch natürlich mit „Besonnenheit“ wiedergegeben.
- source_word: ὑπομονῆς
  choice: standhaftes Ausharren
  rationale: Bewahrt sowohl den zeitlichen Aspekt des Durchhaltens als auch die innere Standfestigkeit.
- source_word: πάντα τόπον ἐψηλαφήσαμεν
  choice: haben wir jeden Punkt behandelt
  rationale: Die wörtliche Bildsprache des Abtastens bezeichnet hier das Durchgehen sämtlicher einschlägiger Gesichtspunkte; die deutsche Formulierung ist klar und idiomatisch.
- source_word: ὁσίως εὐαρεστεῖν
  choice: ehrfürchtig gefallen
  rationale: ὁσίως wird adverbial auf εὐαρεστεῖν bezogen und bezeichnet eine Gott angemessene, fromme Haltung.
- source_word: μακροθυμίᾳ
  choice: Geduld
  rationale: Meint langmütige Geduld; „Geduld“ ist im Kontext verständlich und vermeidet ein altertümliches Register.
- source_word: ἀμνησικάκως
  choice: frei von Groll
  rationale: Drückt aus, erlittenes Unrecht nicht nachzutragen und keinen Groll zu hegen.
- source_word: μετὰ ἐκτενοῦς ἐπιεικείας
  choice: übt beharrlich Milde
  rationale: ἐκτενής bezeichnet anhaltenden Ernst beziehungsweise Beharrlichkeit, ἐπιείκεια eine milde, nachsichtige Haltung.
- source_word: ταπεινοφρονοῦντες τὰ πρὸς
  choice: gegenüber … demütig gesinnt waren
  rationale: Gibt den Akkusativ der Beziehung natürlich wieder und erhält die Ausrichtung der Demut sowohl auf Gott als auch auf alle Menschen.
theological_decisions:
- issue: Bezug von ὁσίως
  choice: 'Als Adverb zu „gefallen“: „ehrfürchtig gefallen“'
  alternative: 'Als weiteres Glied der ἐν-Reihe: „in Heiligkeit, Gerechtigkeit, Wahrheit und Geduld“'
  rationale: Die griechische Syntax setzt ὁσίως als eigenständiges Adverb von den folgenden Präpositionalbestimmungen ab.
- issue: Bezug des Wohlgefallens bei den Vätern
  choice: „sein Wohlgefallen“ mit Bezug auf den allmächtigen Gott
  alternative: 'Unpersönlich: „gefielen“'
  rationale: Der Gottesbezug ergibt sich aus dem vorangehenden Satz und wird im Deutschen zur Klarheit aufgenommen, ohne eine zusätzliche Lehrbestimmung einzuführen.
- issue: Reichweite der Demut im Schlusssatz
  choice: Demut sowohl gegenüber Gott als auch gegenüber allen Menschen
  alternative: Demut nur hinsichtlich der Pflichten gegenüber Gott und Menschen
  rationale: Die Aufzählung nach τὰ πρὸς umfasst den Vater, Gott und Schöpfer ebenso wie alle Menschen; die relationale Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in drei Sätze gegliedert; die Folge der Tugenden und die logischen Beziehungen bleiben erhalten. „Väter“ folgt der historischen Ausdrucksweise des Textes und meint die zuvor genannten Glaubensvorbilder.
