  text: Οἱ λειτουργοὶ τῆς χάριτος τοῦ θεοῦ διὰ πνεύματος ἁγίου περὶ μετανοίας ἐλάλησαν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/001.yaml
  text: The ministers of the grace of God spoke through the Holy Spirit concerning repentance,
translation:
  language: de
  text: Die Diener der Gnade Gottes sprachen durch den Heiligen Geist über die Umkehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργοὶ
  choice: Diener
  rationale: Bezeichnet hier Menschen, die im Dienst der göttlichen Gnade stehen; „Diener“ ist natürlich und bewahrt die religiöse Dienstvorstellung, ohne vorschnell ein bestimmtes Amt festzulegen.
- source_word: χάριτος
  choice: Gnade
  rationale: Die übliche und sachlich genaue Wiedergabe von χάρις im frühchristlichen Sprachgebrauch.
- source_word: διὰ πνεύματος ἁγίου
  choice: durch den Heiligen Geist
  rationale: Gibt die instrumentale bzw. vermittelnde Bedeutung von διά mit Genitiv direkt wieder.
- source_word: περὶ μετανοίας
  choice: über die Umkehr
  rationale: μετάνοια bezeichnet eine grundlegende Sinnes- und Lebensänderung hin zu Gott; „Umkehr“ ist im Deutschen umfassender als bloße Reue oder Buße.
- source_word: ἐλάλησαν
  choice: sprachen
  rationale: Schlichte und formnahe Wiedergabe des Aorists, dessen vergangener Bezug erhalten bleibt.
theological_decisions:
- issue: Rolle des Heiligen Geistes beim Reden
  choice: „durch den Heiligen Geist“
  alternative: „im Heiligen Geist“
  rationale: Die Präposition διά mit Genitiv stellt den Geist am ehesten als Vermittler oder Wirkenden des Redens dar; die Formulierung legt darüber hinaus keine Inspirationstheorie fest.
- issue: Bedeutungsumfang von μετάνοια
  choice: „Umkehr“
  alternative: „Buße“
  rationale: „Umkehr“ bewahrt den Gedanken einer inneren und praktischen Neuausrichtung, während „Buße“ heute leicht nur an Reue oder Sühneleistung denken lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Der Satz endet entsprechend der Vorlage mit einem Punkt.
