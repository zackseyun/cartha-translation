source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: de
  text: '„Kehrt um, Haus Israel, und wendet euch von eurem Unrecht ab. Ich sagte zu den Söhnen meines Volkes: ‚Wenn eure Sünden von der Erde bis zum Himmel reichen, wenn sie röter sind als Scharlach und schwärzer als Sacktuch, und wenn ihr euch mir von ganzem Herzen zuwendet und sagt: »Vater«, dann werde ich auf euch hören wie auf ein heiliges Volk.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Kehrt um
  rationale: Gibt den Aufruf zu einer grundlegenden Sinnes- und Lebenswende natürlich und würdig wieder.
- source_word: ἀπὸ τῆς ἀνομίας ὑμῶν
  choice: wendet euch von eurem Unrecht ab
  rationale: Macht die mit ἀπό bezeichnete Abkehr im Deutschen ausdrücklich; „Unrecht“ ist verständlicher als das mögliche, aber schwerere „Gesetzlosigkeit“.
- source_word: εἶπον
  choice: Ich sagte
  rationale: Folgt der Akzentuierung und grammatischen Form des vorgelegten griechischen Textes als 1. Person Singular Aorist, nicht einem Imperativ „Sagt“.
- source_word: ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ
  choice: von der Erde bis zum Himmel reichen
  rationale: Gibt die räumliche Ausdehnung idiomatisch wieder; ein wörtliches „von der Erde bis zum Himmel sind“ wäre im Deutschen unnatürlich.
- source_word: πυρρότεραι κόκκου
  choice: röter als Scharlach
  rationale: κόκκος bezeichnet hier den scharlachroten Farbstoff beziehungsweise Scharlach; die Vergleichsform wird direkt bewahrt.
- source_word: μελανώτεραι σάκκου
  choice: schwärzer als Sacktuch
  rationale: Bewahrt das konkrete antike Bild eines dunklen, groben Trauer- oder Bußstoffes.
- source_word: ἐπιστραφῆτε πρὸς με
  choice: ihr euch mir ... zuwendet
  rationale: Unterscheidet die Hinwendung zu Gott sprachlich von der anfänglichen Umkehr und Abkehr vom Unrecht.
- source_word: ἐπακούσομαι ὑμῶν
  choice: werde ich auf euch hören
  rationale: Bewahrt den Sinn des Hörens beziehungsweise Erhörens, ohne die Aussage unnötig auf Gebet im engeren Sinn festzulegen.
theological_decisions:
- issue: Bedingung und göttliche Zusage
  choice: wenn … und wenn …, dann werde ich
  alternative: selbst wenn …, werde ich dennoch
  rationale: Die wiederholten ἐάν-Sätze bilden formal Bedingungen. Die Übersetzung fügt kein adversatives „selbst wenn/dennoch“ hinzu, bewahrt aber durch „dann“ den Zusammenhang mit der Zusage.
- issue: Anrede Gottes als Vater
  choice: 'und sagt: »Vater«'
  alternative: und mich »Vater« nennt
  rationale: Die knappe direkte Anrede des griechischen Textes bleibt erhalten, ohne eine weitergehende Aussage über Gotteskindschaft einzutragen.
- issue: Status als heiliges Volk
  choice: wie auf ein heiliges Volk
  alternative: weil ihr ein heiliges Volk seid
  rationale: Das vergleichende ὡς wird beibehalten; die Übersetzung macht daraus keine ausdrückliche Begründung oder uneingeschränkte Identitätsaussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Struktur. Die traditionellen Bilder „Haus Israel“, „Söhne meines Volkes“, „Scharlach“ und „Sacktuch“ bleiben erhalten; unnötige Archaismen werden vermieden.
