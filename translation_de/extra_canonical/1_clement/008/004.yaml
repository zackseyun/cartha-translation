review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den griechischen Text insgesamt zuverlässig wieder, einschließlich der wichtigen Bestimmung ἀπὸ τῶν ψυχῶν ὑμῶν („aus euren Seelen“). Die zweifache deutsche Aufforderung „Schafft … weg, entfernt sie …“ ist jedoch eine unnötige Umformung eines einzigen Imperativs. τὰ ἀγαθὰ τῆς γῆς bezeichnet unmittelbar die guten Dinge/Güter des Landes, nicht spezifisch „Gaben“.
  naturalness: Der Registerton ist würdevoll und modern verständlich. „Miteinander ins Gericht gehen“ klingt im Deutschen jedoch stärker nach einem förmlichen Gerichtsverfahren als das mehrdeutige διελεγχθῶμεν. „Miteinander rechten“ ist idiomatisch, bewahrt den streitenden bzw. rechtlichen Klang und wird durch die Fußnote angemessen abgesichert.
  terminology: „Recht suchen“, „dem Unrecht Leidenden retten“, „der Waise zum Recht verhelfen“ und „der Witwe Gerechtigkeit verschaffen“ geben die sozialrechtlichen Imperative angemessen wieder. Die Unterscheidung von Purpur und Scharlach bleibt erhalten.
  issues:
  - severity: medium
    issue: Wiedergabe von διελεγχθῶμεν
    rationale: „Wir wollen miteinander ins Gericht gehen“ verengt das Verb auf ein gerichtliches Verfahren. Das griechische Wort kann rechtliches Austragen, prüfende Auseinandersetzung oder Klärung bezeichnen. „Lasst uns miteinander rechten“ ist näher und die verbleibende Mehrdeutigkeit gehört in die Fußnote.
  - severity: low
    issue: Doppelter Imperativ bei ἀφέλεσθε
    rationale: Das Griechische hat einen Imperativ („entfernt“). Die Wiederholung „Schafft … weg, entfernt sie“ ist nicht nötig und macht den Satz schwerfälliger.
  - severity: low
    issue: „Gaben des Landes“ für τὰ ἀγαθὰ τῆς γῆς
    rationale: „Gaben“ ist eine interpretierende Einengung. „Die guten Dinge des Landes“ gibt den umfassenden Ausdruck unmittelbarer wieder.
