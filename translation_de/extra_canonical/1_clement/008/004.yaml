source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
translation:
  language: de
  text: 'Und an einer anderen Stelle sagt er Folgendes: »Wascht euch und werdet rein! Entfernt eure bösen Taten aus euren Seelen vor meinen Augen! Hört auf, Böses zu tun! Lernt, Gutes zu tun; sucht das Recht, rettet den, dem Unrecht geschieht, verhelft der Waise zum Recht und verschafft der Witwe Gerechtigkeit! Kommt, lasst uns miteinander rechten[a], spricht der Herr. Auch wenn eure Sünden wie Purpur sind, werde ich sie weiß machen wie Schnee; und wenn sie wie Scharlach sind, werde ich sie weiß machen wie Wolle. Wenn ihr willig seid und auf mich hört, werdet ihr die guten Dinge des Landes essen. Wenn ihr aber nicht willig seid und nicht auf mich hört, wird das Schwert euch verschlingen. Denn der Mund des Herrn hat dies gesprochen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lasst uns die Sache miteinander klären«; das griechische Wort kann eine rechtliche Auseinandersetzung, eine prüfende Widerlegung oder Klärung bezeichnen.'
    reason: Bewahrt die Mehrdeutigkeit von διελεγχθῶμεν, ohne den Sinn auf ein bloß rationales Gespräch oder ein formelles Gerichtsverfahren festzulegen.
lexical_decisions:
- source_word: ἀφέλεσθε τὰς πονηρίας ... ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου
  choice: Schafft eure bösen Taten vor meinen Augen weg, entfernt sie aus euren Seelen
  rationale: Die ungewöhnliche griechische Wortstellung wird vollständig bewahrt, ohne »aus euren Seelen« auszulassen; die Wiederaufnahme durch »entfernt sie« ergibt verständliches Deutsch.
- source_word: ἐκζητήσατε κρίσιν
  choice: sucht das Recht
  rationale: κρίσις bezeichnet hier im ethisch-rechtlichen Zusammenhang Recht beziehungsweise gerechtes Urteil, nicht bloß abstrakte »Gerechtigkeit«.
- source_word: ῥύσασθε ἀδικούμενον
  choice: befreit den, dem Unrecht geschieht
  rationale: Gibt sowohl das rettende Eingreifen von ῥύομαι als auch den passiven Sinn von ἀδικούμενον wieder.
- source_word: κρίνατε ὀρφανῷ
  choice: verhelft der Waise zum Recht
  rationale: Natürliches modernes Deutsch für das Eintreten beziehungsweise Rechtsprechen zugunsten der Waise; das grammatische Geschlecht des griechischen Ausdrucks bleibt im Deutschen offen.
- source_word: δικαιώσατε χήραν
  choice: verschafft der Witwe Gerechtigkeit
  rationale: Drückt den forensischen Sinn aus, der Witwe zu ihrem Recht zu verhelfen.
- source_word: φοινικοῦν / κόκκινον
  choice: Purpur / Scharlach
  rationale: Bewahrt die zwei verschiedenen Farbbezeichnungen und ihre rhetorische Parallelität.
- source_word: τὰ ἀγαθὰ τῆς γῆς
  choice: die guten Gaben des Landes
  rationale: Natürlich und inhaltlich umfassend; gemeint sind die guten Erträge beziehungsweise Güter des Landes.
theological_decisions:
- issue: Bedeutung von διελεγχθῶμεν
  choice: wir wollen miteinander ins Gericht gehen
  alternative: wir wollen miteinander rechten / lasst uns vernünftig miteinander reden
  rationale: Das Verb hat einen prüfenden, widerlegenden oder rechtlichen Klang. Die gewählte Form bewahrt die Spannung einer Auseinandersetzung vor Gott, ohne sie zu einem bloß vernünftigen Gespräch abzuschwächen; eine Fußnote nennt die echten Alternativen.
- issue: Reinigung der Sünden
  choice: werde ich sie weiß machen
  alternative: sollen sie weiß werden
  rationale: Das griechische λευκανῶ steht aktiv in der ersten Person; Gott ist ausdrücklich der Handelnde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Imperativen. Die Schriftzitat-Struktur und der Wechsel zwischen Aufforderung, Verheißung und Warnung bleiben erhalten. Die ungewöhnliche doppelte Bestimmung »vor meinen Augen … aus euren Seelen« wird nicht harmonisiert oder gekürzt.
