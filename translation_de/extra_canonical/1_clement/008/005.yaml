    rationale: Die Formulierung ruft im modernen Deutsch vorrangig die Bedeutung von Liebhabern/Liebhaberinnen hervor und ist daher für τοὺς ἀγαπητοὺς αὐτοῦ unnatürlich und potenziell irreführend.
  - severity: low
    issue: Satzanschluss »Da er also wollte«
    rationale: Die Stellung von »also« wirkt unnötig holprig. Ein vorangestelltes »Daher« bildet die folgernde Funktion von οὖν klarer ab, während der Partizipialsatz als natürlicher Kausalsatz erhalten bleibt.
