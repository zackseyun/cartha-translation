source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: de
  text: Daher bekräftigte er dies durch seinen allmächtigen Willen, weil er wollte, dass alle, die er liebt, an der Umkehr teilhaben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας μετασχεῖν
  choice: an der Umkehr teilhaben
  rationale: Gibt die Genitivkonstruktion mit μετασχεῖν eng und zugleich natürlich wieder; »Umkehr« bezeichnet hier die von Gott eröffnete Möglichkeit und Wirklichkeit der Sinnes- und Lebensänderung.
- source_word: ἐστήριξεν
  choice: bekräftigte
  rationale: στηρίζω bedeutet fest machen, stützen oder bestätigen. Im Zusammenhang der zuvor ausgesprochenen Zusagen gibt »bekräftigte« den rückbezüglichen Sinn besser wieder als ein erstmaliges »begründete«.
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: durch seinen allmächtigen Willen
  rationale: Das substantivierte Adjektiv παντοκρατορικός beschreibt den Willen bzw. Ratschluss als von göttlicher Allmacht bestimmt. Die instrumentale Wiedergabe mit »durch« entspricht dem Dativ.
- source_word: τοὺς ἀγαπητοὺς αὐτοῦ
  choice: seine Geliebten
  rationale: Bewahrt die substantivische und relationale Form des Griechischen, ohne die Bezugsgruppe näher festzulegen, als es der Text tut.
theological_decisions:
- issue: Bezugswort des unausgesprochenen Objekts bei ἐστήριξεν
  choice: »dies« lässt den Rückbezug offen
  alternative: »die Umkehr« oder »die Verheißung« ausdrücklich als Objekt einsetzen
  rationale: Das griechische Verb hat kein ausdrückliches Objekt. Im Kontext kann der Rückbezug die Umkehr, Gottes Zusage oder seine entsprechende Anordnung betreffen; »dies« bewahrt diese Offenheit.
- issue: Bedeutung von μετάνοια
  choice: Umkehr
  alternative: Buße
  rationale: »Umkehr« ist im heutigen Deutsch verständlich und umfasst innere Neuausrichtung sowie verändertes Handeln, ohne spätere konfessionelle Nebenbedeutungen von »Buße« aufzudrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte partizipiale Begründung wird als natürlicher Kausalsatz wiedergegeben; »also« erhält die folgernde Funktion von οὖν.
