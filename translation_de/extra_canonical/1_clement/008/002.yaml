- from: 'Und auch der Herr über alles selbst sprach über die Umkehr mit einem Schwur: »So wahr ich lebe, spricht der Herr: Ich will nicht den Tod des Sünders, sondern seine Umkehr«, und fügte noch einen guten Ausspruch hinzu:'
