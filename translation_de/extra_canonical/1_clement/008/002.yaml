id: 1CLEM.8.2
reference: 1 Clement 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: de
  text: 'Und auch der Herr über alles selbst sprach über die Umkehr mit einem Schwur: »So wahr ich lebe, spricht der Herr: Ich will nicht so sehr den Tod des Sünders wie seine Umkehr«, und fügte noch einen guten Ausspruch hinzu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης τῶν ἁπάντων
  choice: Herr über alles
  rationale: Gibt den souveränen Titel natürlich und würdevoll wieder; „Gebieter“ wäre formaler, klingt im heutigen Deutsch jedoch härter und weniger idiomatisch.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet hier die Abkehr von der Sünde und Hinwendung zu Gott; „Buße“ könnte enger als Bußleistung verstanden werden.
- source_word: μετὰ ὅρκου
  choice: mit einem Schwur
  rationale: Bewahrt die ausdrückliche Aussage, dass Gott seine Worte eidlich bekräftigt.
- source_word: οὐ βούλομαι ... ὡς
  choice: Ich will nicht ... sondern
  rationale: Das vergleichend-präferentielle ὡς stellt Tod und Umkehr gegenüber. Die idiomatische deutsche Kontrastform erhält den Sinn, ohne ein unnatürliches „so sehr wie“.
- source_word: γνώμην ἀγαθήν
  choice: einen guten Ausspruch
  rationale: Im Kontext leitet γνώμη eine weitere gesprochene Erklärung ein; „Ausspruch“ passt daher besser als „Absicht“, während „Urteil“ im Deutschen leicht einen richterlichen Entscheid bezeichnet.
theological_decisions:
- issue: Bedeutung von μετάνοια
  choice: Umkehr
  alternative: Buße
  rationale: „Umkehr“ wahrt den umfassenden Sinn einer inneren und praktischen Neuausrichtung und vermeidet die mögliche Verengung auf Bußhandlungen.
- issue: Wiedergabe des göttlichen Nichtwollens
  choice: Ich will nicht den Tod des Sünders, sondern seine Umkehr
  alternative: Ich wünsche den Tod des Sünders nicht so sehr wie seine Umkehr
  rationale: Die gewählte Form gibt die starke Gegenüberstellung idiomatisch wieder, ohne eine dogmatische Aussage über verschiedene Arten des göttlichen Willens hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am Griechischen, wird aber für heutige Leser geglättet. Die doppelte Hervorhebung in καὶ αὐτὸς δέ bleibt durch „auch ... selbst“ erhalten.
