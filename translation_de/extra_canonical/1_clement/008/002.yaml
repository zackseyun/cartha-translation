  rationale: Ausschließlich die deutsche Wiedergabe der griechischen Vergleichspartikel ὡς wurde angepasst. Dadurch bleibt die Vorlage in ihrer präferentiellen, nicht ausschließenden Gegenüberstellung erhalten, ohne eine theologische Deutung einzutragen.
