revisions:
- from: So werden auch wir, die wir durch seinen Willen in Christus Jesus berufen worden sind, nicht aus uns selbst gerechtfertigt, auch nicht aufgrund unserer eigenen Weisheit oder Einsicht, unserer Gottesfurcht oder der Werke, die wir in der Lauterkeit unseres Herzens vollbracht haben, sondern durch den Glauben. Durch ihn hat der allmächtige Gott alle Menschen von jeher gerechtfertigt. Ihm sei die Herrlichkeit für immer und ewig. Amen.
  to: So werden auch wir, die wir durch seinen Willen in Christus Jesus berufen worden sind, nicht durch uns selbst gerechtfertigt, auch nicht durch unsere eigene Weisheit oder Einsicht, Gottesfurcht oder Werke, die wir in Lauterkeit des Herzens vollbracht haben, sondern durch den Glauben, durch den der allmächtige Gott alle Menschen seit Anbeginn gerechtfertigt hat. Ihm sei die Herrlichkeit für immer und ewig. Amen.
  rationale: 'Die Revision beschränkt sich auf sichere sprachliche und syntaktische Präzisierungen: δι’ ἑαυτῶν wird als „durch uns selbst“ wiedergegeben, der direkte Bezug von δι’ ἧς auf den Glauben wird im Deutschen erhalten, und ἀπ’ αἰῶνος wird mit „seit Anbeginn“ klarer zeitlich gefasst. Die Reichweite von πάντας bleibt ohne konfessionelle Einschränkung offen. Fußnoten sind im deutschen Entwurf weder erforderlich noch verankert.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:16Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Aufbau und zentrale Begriffe des griechischen Textes insgesamt zuverlässig wieder, einschließlich der Wiederholung von δικαιόω mit „gerechtfertigt“. δι’ ἑαυτῶν ist jedoch unmittelbarer „durch uns selbst“ als „aus uns selbst“. Für τοὺς ἀπ’ αἰῶνος ist „alle Menschen seit Anbeginn“ zeitlich klarer als „alle Menschen von jeher“ und bewahrt die offene Personenbezeichnung des substantivierten Artikels.
  naturalness: Der Text ist würdiges, modernes Standarddeutsch. Die Zusammenziehung des Glaubenssatzes mit seinem Relativbezug vermeidet das etwas harte, durch die Satztrennung entstandene „Durch ihn“ nach „durch den Glauben“.
  terminology: „Christus Jesus“, „gerechtfertigt“, „Gottesfurcht“ und „Lauterkeit des Herzens“ sind im gegebenen frühchristlich-theologischen Register tragfähig. „Durch uns selbst“ erhält zudem die parallele διά-Struktur mit Weisheit, Einsicht, Gottesfurcht und Werken besser.
  issues:
  - severity: medium
    issue: „aus uns selbst“ für δι’ ἑαυτῶν
    rationale: Die Präposition διά bezeichnet hier wie in den nachfolgenden Gliedern das Mittel beziehungsweise die Vermittlung. „Durch uns selbst“ ist die nähere und idiomatische Entsprechung; „aus uns selbst“ verschiebt den Akzent zur Herkunft.
  - severity: low
    issue: „von jeher“ für ἀπ’ αἰῶνος
    rationale: „Von jeher“ kann im Deutschen eine zeitlose oder wesenhafte Geltung nahelegen. „Seit Anbeginn“ gibt den rückblickenden Zeitansatz deutlicher wieder, ohne den im Griechischen nicht näher bestimmten Anfang zu definieren.
  - severity: low
    issue: Relativbezug auf den Glauben durch Satztrennung abgeschwächt
    rationale: Das griechische δι’ ἧς bezieht sich direkt auf πίστεως. Die Verbindung „durch den Glauben, durch den …“ macht diese syntaktische und argumentative Beziehung transparent.
  revised_text: So werden auch wir, die wir durch seinen Willen in Christus Jesus berufen worden sind, nicht durch uns selbst gerechtfertigt, auch nicht durch unsere eigene Weisheit oder Einsicht, Gottesfurcht oder Werke, die wir in Lauterkeit des Herzens vollbracht haben, sondern durch den Glauben, durch den der allmächtige Gott alle Menschen seit Anbeginn gerechtfertigt hat. Ihm sei die Herrlichkeit für immer und ewig. Amen.
