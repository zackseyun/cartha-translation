source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: de
  text: So werden auch wir, die wir durch seinen Willen in Christus Jesus berufen worden sind, nicht durch uns selbst gerechtfertigt, auch nicht durch unsere eigene Weisheit oder Einsicht, Gottesfurcht oder Werke, die wir in Lauterkeit des Herzens vollbracht haben, sondern durch den Glauben, durch den der allmächtige Gott alle Menschen seit Anbeginn gerechtfertigt hat. Ihm sei die Herrlichkeit für immer und ewig. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ θελήματος αὐτοῦ
  choice: durch seinen Willen
  rationale: Gibt die instrumentale bzw. vermittelnde Formulierung des Griechischen knapp wieder, ohne sie kausal umzudeuten.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: in Christus Jesus
  rationale: Bewahrt die feste frühchristliche Wendung und folgt dem griechischen Titel Χριστός, ohne ihn hier durch „Messias“ stärker auszudeuten.
- source_word: δικαιούμεθα / ἐδικαίωσεν
  choice: gerechtfertigt / hat … gerechtfertigt
  rationale: Die einheitliche Wiedergabe erhält die bewusste Wiederholung desselben Verbstamms und lässt den theologischen Bedeutungsumfang von δικαιόω offen.
- source_word: εὐσεβείας
  choice: Gottesfurcht
  rationale: Im Kontext bezeichnet εὐσέβεια eine ehrfürchtige, Gott zugewandte Lebenshaltung; „Frömmigkeit“ wäre möglich, klingt im heutigen Deutsch jedoch leichter nach äußerlicher Religiosität.
- source_word: ὁσιότητι καρδίας
  choice: Lauterkeit unseres Herzens
  rationale: Drückt die innere Heiligkeit und redliche Reinheit des Herzens idiomatisch aus, ohne eine bloß rituelle Bedeutung nahezulegen.
- source_word: τοὺς ἀπ’ αἰῶνος
  choice: alle Menschen von jeher
  rationale: Bewahrt den weiten zeitlichen Rückblick von ἀπ’ αἰῶνος und vermeidet die präzisierende, aber enger klingende Festlegung auf „seit Beginn der Welt“.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Natürliche, würdige deutsche Entsprechung der verstärkten Ewigkeitsformel.
theological_decisions:
- issue: Art und Grundlage der Rechtfertigung
  choice: „nicht aus uns selbst … oder aufgrund … der Werke …, sondern durch den Glauben“
  alternative: „nicht durch uns selbst …, sondern aufgrund des Glaubens“
  rationale: Die Formulierung unterscheidet idiomatisch zwischen der verneinten Quelle menschlicher Selbstrechtfertigung und dem im Text bejahten Mittel des Glaubens, ohne ein ausgearbeitetes konfessionelles Rechtfertigungsmodell einzutragen.
- issue: Bedeutung von δικαιόω
  choice: „rechtfertigen“
  alternative: „für gerecht erklären“ oder „gerecht machen“
  rationale: „Rechtfertigen“ bewahrt die im griechischen Verb vorhandene Spannung zwischen Erklärung, Anerkennung und Herstellung von Gerechtigkeit, statt sie einseitig auf eine Deutung festzulegen.
- issue: Reichweite von πάντας
  choice: „alle Menschen von jeher“
  alternative: „alle, die von jeher gelebt haben“
  rationale: Das unbestimmte substantivierte πάντας wird als Personenbezeichnung kenntlich gemacht. Die Aussage wird nicht durch einen Zusatz wie „alle Glaubenden“ eingeschränkt, auch wenn der Relativsatz den Glauben als Mittel nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Der lange griechische Satz wird vor dem abschließenden Relativgedanken geteilt, ohne die logische Verbindung zu verändern. Traditionelle theologische Schlüsselbegriffe werden dort beibehalten, wo eine stärker paraphrasierende Wiedergabe die genuine Mehrdeutigkeit einschränken würde.
