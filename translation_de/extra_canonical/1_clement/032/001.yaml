id: 1CLEM.32.1
reference: 1 Clement 32:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἐὰν τις καθ’ ἓν ἕκαστον εἰλικρινῶς κατανοήσῃ, ἐπιγνώσεται μεγαλεῖα τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/001.yaml
  text: If anyone sincerely considers this point by point, he will recognize the greatness of the gifts given by him.
translation:
  language: de
  text: Wenn jemand dies Punkt für Punkt aufrichtig betrachtet, wird er die Größe der von ihm geschenkten Gaben erkennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰλικρινῶς
  choice: aufrichtig
  rationale: Gibt die Bedeutung von Lauterkeit und ungeteilter Ernsthaftigkeit in natürlichem modernem Deutsch wieder.
- source_word: καθ’ ἓν ἕκαστον
  choice: Punkt für Punkt
  rationale: Versteht die Wendung adverbial als sorgfältige Betrachtung der einzelnen Aspekte und nicht als direktes Objekt.
- source_word: μεγαλεῖα
  choice: die Größe
  rationale: Der griechische Plural bezeichnet hier die Großartigkeit bzw. Größe der Gaben; die kollektive deutsche Formulierung klingt natürlich und entspricht der Aussage.
- source_word: δωρεῶν
  choice: Gaben
  rationale: Eine geläufige, würdige Entsprechung für unverdiente Geschenke oder Wohltaten.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: „von ihm“ bleibt ohne ausdrückliche Identifizierung stehen
  alternative: „von Gott“
  rationale: Der Vers selbst nennt den Geber nur pronominal. Die Übersetzung bewahrt diesen Rückbezug und ergänzt keine ausdrückliche Gottesbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konditionale Struktur ἐὰν τις wird mit „Wenn jemand“ bewahrt; „dies“ gibt das vorangestellte relative bzw. demonstrativ auf den Kontext zurückweisende Objekt wieder.
