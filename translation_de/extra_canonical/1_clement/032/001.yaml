  source_fidelity: Die Übersetzung bewahrt die konditionale Struktur von ἐὰν τις („Wenn jemand“), gibt das vorangestellte rückverweisende Objekt ὅ mit „dies“ wieder und versteht καθ’ ἓν ἕκαστον zutreffend adverbial als „Punkt für Punkt“. „die Größe“ gibt μεγαλεῖα in diesem Zusammenhang angemessen als abstrakte Kollektivform wieder. „von ihm geschenkten Gaben“ entspricht den ὑπ’ αὐτοῦ δεδομένων δωρεῶν, ohne den im Satz nur pronominal bezeichneten Geber zu identifizieren.
