id: 1CLEM.32.3
reference: 1 Clement 32:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: de
  text: So wurden sie alle verherrlicht und groß gemacht, nicht durch sich selbst oder durch ihre Werke oder durch die gerechten Taten, die sie vollbrachten, sondern durch seinen Willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: wurden verherrlicht
  rationale: Gibt das Passiv und die Bedeutung von δοξάζω präzise und in angemessen würdigem Deutsch wieder.
- source_word: ἐμεγαλύνθησαν
  choice: wurden groß gemacht
  rationale: Bewahrt das Passiv sowie den Gedanken, dass ihnen Größe verliehen wurde; natürlicher als das im Deutschen missverständliche „vergrößert“.
- source_word: δικαιοπραγίας
  choice: gerechten Taten
  rationale: Bezeichnet konkretes rechtes bzw. gerechtes Handeln; die pluralische Wiedergabe ist im Deutschen idiomatisch.
- source_word: κατειργάσαντο
  choice: vollbrachten
  rationale: Drückt das tätige Hervorbringen beziehungsweise Ausführen der gerechten Taten knapp und natürlich aus.
- source_word: διὰ τοῦ θελήματος αὐτοῦ
  choice: durch seinen Willen
  rationale: Erhält die instrumentale bzw. vermittelnde Formulierung des griechischen διά mit Genitiv und lässt den Bezug des Pronomens wie im Kontext vorausgesetzt stehen.
theological_decisions:
- issue: Grund der Verherrlichung und Größe
  choice: Die dreifache Verneinung menschlicher Grundlage und der Gegensatz „sondern durch seinen Willen“ bleiben vollständig erhalten.
  alternative: Die Aussage deutend als „allein aus Gnade“ wiederzugeben.
  rationale: Der griechische Text nennt ausdrücklich Gottes Willen, nicht den theologischen Fachausdruck „Gnade“; eine interpretierende Präzisierung würde die Formulierung des Autors ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des griechischen Satzes bleibt erhalten; „So“ nimmt das folgernde οὖν natürlich auf.
