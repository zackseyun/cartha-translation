  source_fidelity: Die wiederholte Herkunftsformel ἐξ αὐτοῦ, die kultische Bezeichnung λειτουργοῦντες, die Formel κατὰ σάρκα, die Zuordnung zu Juda und die Litotes οὐκ ἐν μικρᾷ δόξῃ sind im Entwurf grundsätzlich treffend wiedergegeben. σκῆπτρα ist im genealogischen Kontext auffällig und wohl metonymisch zu verstehen; der Haupttext soll das Bild bewahren, die Fußnote die mögliche Bedeutung erläutern. σπέρμα bezeichnet in der Verheißung kollektiv die Nachkommenschaft.
  naturalness: „in nicht geringer Herrlichkeit stehen“ ist im Deutschen keine natürliche Verbindung. „von nicht geringer Herrlichkeit sein“ gibt die Litotes klar und würdig wieder. „Same“ ist zwar bibelsprachlich möglich, wirkt im heutigen Standarddeutsch jedoch unnötig archaisch bzw. mehrdeutig; „Nachkommenschaft“ ist hier die natürliche kollektive Wiedergabe.
  terminology: „dem Fleisch nach“, „Herr Jesus“, „Priester und Leviten“ sowie „Zepter“ sind angemessen. Die Fußnote zu „Zepter“ ist nötig, sollte aber vorsichtig von einer möglichen, nicht festgelegten metonymischen Bedeutung sprechen.
