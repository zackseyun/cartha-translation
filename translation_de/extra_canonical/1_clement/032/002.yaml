source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: de
  text: 'Denn von ihm stammen die Priester und Leviten, alle, die am Altar Gottes Dienst tun. Von ihm stammt dem Fleisch nach der Herr Jesus. Von ihm stammen in der Linie Judas Könige, Herrscher und Führer. Seine übrigen Zepter[a] aber sind von nicht geringer Herrlichkeit, wie Gott verheißen hat: »Deine Nachkommenschaft wird sein wie die Sterne des Himmels.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bedeutet wörtlich »Zepter« und kann in diesem genealogischen Zusammenhang möglicherweise bildlich die übrigen Stämme bezeichnen.
    reason: σκῆπτρα ist im Kontext ungewöhnlich. Die Anmerkung erklärt die mögliche Metonymie, ohne die wörtliche Bildsprache des Haupttexts zu ersetzen oder die Deutung als sicher auszugeben.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: von ihm stammen
  rationale: Gibt die wiederholte Herkunftsformel natürlich wieder und bewahrt ihren rhetorischen Parallelismus.
- source_word: λειτουργοῦντες
  choice: Dienst tun
  rationale: Bezeichnet hier den kultischen Dienst am Altar, ohne spätere kirchliche Amtsvorstellungen einzutragen.
- source_word: τὸ κατὰ σάρκα
  choice: dem Fleisch nach
  rationale: Bewahrt die traditionelle, theologisch offene Herkunftsformel und ihre Spannung.
- source_word: κατὰ τὸν Ἰούδαν
  choice: in der Linie Judas
  rationale: Drückt die genealogische Zuordnung zu Juda in verständlichem Deutsch aus, ohne mehr als der Kontext festzulegen.
- source_word: σκῆπτρα
  choice: Zepter
  rationale: Bewahrt das konkrete Bild des griechischen Ausdrucks; seine mögliche metonymische Bedeutung als Stämme wird in der Fußnote erläutert.
- source_word: οὐκ ἐν μικρᾷ δόξῃ
  choice: in nicht geringer Herrlichkeit
  rationale: Gibt die griechische Litotes eng und würdig wieder.
- source_word: σπέρμα
  choice: Same
  rationale: Erhält die singularische, kollektiv deutbare biblische Ausdrucksweise.
theological_decisions:
- issue: Christi Herkunft κατὰ σάρκα
  choice: dem Fleisch nach
  alternative: seiner menschlichen Abstammung nach
  rationale: Die gewählte Fassung bewahrt die knappe paulinisch anmutende Formel und löst ihre christologische Spannung nicht erklärend auf.
- issue: Bedeutung von σκῆπτρα
  choice: Zepter im Haupttext, mögliche Bedeutung »Stämme« in der Fußnote
  alternative: Stämme im Haupttext
  rationale: Die Bildsprache des Ausgangstextes bleibt sichtbar, während die im genealogischen Zusammenhang wahrscheinliche metonymische Deutung zugänglich gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Herkunftsformel wird parallel gestaltet; kurze Hauptsätze halten den feierlichen Rhythmus klar. Die Schriftverheißung ist als direktes Zitat markiert.
