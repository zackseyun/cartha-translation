  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: de
  text: 'Ein Opfer des Lobes wird mich verherrlichen; und dort ist ein Weg, den ich ihm zeigen werde: das Heil Gottes.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist syntaktisch ungewöhnlich: Das Relativpronomen steht im Akkusativ („einen Weg, den ich ihm zeigen werde“), während „das Heil Gottes“ daneben steht und möglicherweise als nähere Bestimmung zu „Weg“ zu verstehen ist. Eine geläufige griechische Psalmenlesart hat an dieser Stelle den Dativ („auf dem/durch den Weg“), woraus die Deutung „der Weg, auf dem ich ihm das Heil Gottes zeigen werde“ entsteht.'
    reason: Macht die im vorgelegten Wortlaut vorhandene syntaktische Schwierigkeit und die naheliegende, aber textlich abweichende instrumentale Deutung nachvollziehbar, ohne eine davon im Haupttext festzulegen.
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: ein Opfer des Lobes
  rationale: Gibt die kultische Bildsprache und den Genitiv des griechischen Ausdrucks direkt und zugleich verständlich wieder.
- source_word: δοξάσει με
  choice: wird mich verherrlichen
  rationale: Bewahrt das Futur und die Bedeutung von δοξάζω, Gott Ehre zu erweisen.
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: das Heil Gottes
  rationale: Der substantivierte Ausdruck σωτήριον bezeichnet hier Gottes rettendes Heil; die knappe traditionelle Wendung ist im Deutschen klar und würdig.
theological_decisions:
- issue: Bezug von ἐκεῖ ὁδός und ἣν
  choice: „dort ist der Weg, auf dem …“
  alternative: '„dort ist ein Weg, den ich ihm zeigen werde: das Heil Gottes“'
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch schwierig. Die gewählte Fassung folgt der durch die englische Konsultationsschicht bezeugten instrumentalen Deutung, ohne den Weg ausdrücklich mit dem Heil gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Metapher bleibt erhalten; die schwierige Syntax des zweiten Halbverses wird im Haupttext lesbar wiedergegeben und in der Fußnote offengelegt.
