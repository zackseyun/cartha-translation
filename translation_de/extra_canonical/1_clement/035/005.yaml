  to: Wie aber wird dies geschehen, ihr Lieben? Wenn unser Denken Gott in Treue fest zugewandt ist[a], wenn wir suchen, was ihm gefällt und bei ihm willkommen ist, wenn wir tun, was seinem untadeligen Willen entspricht, und dem Weg der Wahrheit folgen, nachdem wir alle Ungerechtigkeit und Bosheit, Habgier, Streit, Böswilligkeit und Täuschung, Geflüster und üble Nachrede, Hass gegen Gott, Hochmut und Überheblichkeit, eitle Ruhmsucht und mangelnde Gastfreundschaft von uns geworfen haben.
