id: 1CLEM.35.5
reference: 1 Clement 35:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: de
  text: Wie aber wird dies geschehen, ihr Lieben? Wenn unser Denken Gott in Treue fest zugewandt ist[a], wenn wir suchen, was ihm gefällt und bei ihm willkommen ist, wenn wir tun, was seinem untadeligen Willen entspricht, und dem Weg der Wahrheit folgen, nachdem wir alle Ungerechtigkeit und Bosheit, Habgier, Streit, Böswilligkeit und Täuschung, Geflüster und üble Nachrede, Hass gegen Gott, Hochmut und Überheblichkeit, eitle Ruhmsucht und mangelnde Gastfreundschaft von uns geworfen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fest auf Gott gerichtet ist“.'
    reason: Die griechische Perfektform bezeichnet einen bestehenden Zustand, der aus einer zuvor erfolgten Befestigung hervorgegangen ist; sie legt nicht zwingend eine besondere Betonung der Fortdauer nahe.
lexical_decisions:
- source_word: διάνοια
  choice: Denken
  rationale: Bezeichnet hier die innere Denk- und Sinnesausrichtung; „Denken“ ist im Deutschen natürlicher als das missverständliche „Verstand“.
- source_word: πιστῶς πρὸς τὸν θεόν
  choice: in Treue fest auf Gott gerichtet
  rationale: Bewahrt den adverbialen Gedanken von πιστῶς und die gerichtete Beziehung πρὸς τὸν θεόν, ohne bloß psychische Konzentration auszudrücken.
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  choice: was seinem untadeligen Willen entspricht
  rationale: ἀνήκοντα bedeutet das Angemessene oder Entsprechende; βούλησις wird im ethischen Zusammenhang treffend mit „Wille“ wiedergegeben.
- source_word: κακοηθείας τε καὶ δόλους
  choice: Arglist und Täuschung
  rationale: κακοήθεια bezeichnet eine bösartige Gesinnung bzw. Arglist; δόλος meint Täuschung oder Hinterlist. Die Wiedergabe hält beide Begriffe unterscheidbar.
- source_word: ψιθυρισμούς τε καὶ καταλαλιάς
  choice: Getuschel und üble Nachrede
  rationale: ψιθυρισμός meint heimliches, tuschelndes Reden; καταλαλιά bezeichnet abwertendes Reden über andere.
- source_word: θεοστυγίαν
  choice: Hass gegen Gott
  rationale: Gibt die naheliegende aktive Bedeutung des zusammengesetzten Substantivs klar und würdig wieder.
- source_word: κενοδοξίαν
  choice: eitle Ruhmsucht
  rationale: Vermittelt das Streben nach leerem Ansehen natürlicher als die wörtliche, im Deutschen ungewöhnliche Form „leerer Ruhm“.
- source_word: ἀφιλοξενίαν
  choice: mangelnde Gastfreundschaft
  rationale: Das negierte Abstraktum bezeichnet das Fehlen von Gastfreundschaft; diese Formulierung ist präzise und verständlich.
theological_decisions:
- issue: Bezug von ἀνήκοντα und βούλησις
  choice: „was seinem untadeligen Willen entspricht“
  alternative: „was zu seinem untadeligen Ratschluss gehört“
  rationale: Der Satz beschreibt angemessenes ethisches Handeln. Die gewählte Fassung wahrt diesen Sinn, ohne „Wille“ und „Ratschluss“ dogmatisch gleichzusetzen.
- issue: Bedeutungsrichtung von θεοστυγία
  choice: „Hass gegen Gott“
  alternative: „Gottverhasstheit“ bzw. „von Gott gehasstes Wesen“
  rationale: Die aktive Deutung ist für das Substantiv in dieser Lasterreihe am naheliegendsten. Eine passive Deutung wäre sprachlich denkbar, ist hier aber weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Konditionalsätze und die abschließende Lasterreihe bleiben erhalten; der Doppelpunkt macht die syntaktische Zuordnung der Aufzählung im Deutschen transparent.
