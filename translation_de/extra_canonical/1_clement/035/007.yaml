  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: de
  text: 'Denn die Schrift sagt: „Zu dem Frevler aber sagt Gott: Warum zählst du meine Satzungen auf und nimmst meinen Bund in den Mund?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  choice: die Schrift
  rationale: Die feste frühchristliche Bezeichnung für die als autoritativ angeführte heilige Schrift.
- source_word: ἁμαρτωλῷ (im zugrunde liegenden Schriftzitat; der vorgelegte Text ist hier offenbar durch OCR entstellt)
  choice: dem Frevler
  rationale: Im Kontext des Psalmzitats bezeichnet das Wort nicht lediglich jemanden, der einmal sündigt, sondern einen Menschen, dessen gottwidriges Handeln im Gegensatz zu seinem Bekenntnis steht. „Frevler“ gibt dies prägnant und würdig wieder.
- source_word: δικαιώματά
  choice: Satzungen
  rationale: Gemeint sind die verbindlichen göttlichen Bestimmungen; „Satzungen“ wahrt den rechtlich-biblischen Sinn, ohne ihn als bloße moralische Forderungen auszulegen.
- source_word: ἀναλαμβάνεις
  choice: nimmst … in den Mund
  rationale: Die deutsche Wendung ist natürlich und bewahrt das konkrete Bild des griechischen Ausdrucks in Verbindung mit „Mund“.
- source_word: διαθήκην
  choice: Bund
  rationale: Im biblischen Kontext bezeichnet διαθήκη Gottes Bundesverhältnis, nicht ein gewöhnliches Testament.
theological_decisions:
- issue: Bezeichnung des angesprochenen Menschen
  choice: Frevler
  alternative: Sünder
  rationale: „Frevler“ bringt die im Psalmzusammenhang vorausgesetzte, beharrliche Gottlosigkeit zum Ausdruck, ohne eine bestimmte konfessionelle Lehre über den Sünderbegriff einzutragen.
- issue: Wiedergabe von Gottes Sprechen im Zitat
  choice: sagt Gott
  alternative: sprach Gott
  rationale: Das Präsens entspricht der einleitenden Formel „die Schrift sagt“ und stellt das Schriftwort als gegenwärtig redend dar; wegen der offenbar entstellten Verbform der Vorlage wird die von der konsultierten Fassung gestützte Lesart verwendet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das anschauliche Bild vom Bund „im Mund“ bleiben erhalten. Der vorgelegte griechische Text ist im ersten Teil des Zitats offenbar OCR-beschädigt; die Übersetzung folgt dort dem erkennbaren Psalmzitat und der auditierten Konsultationsfassung.
