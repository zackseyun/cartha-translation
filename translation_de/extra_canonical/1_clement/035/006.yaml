source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: de
  text: Denn die, die dies tun, sind Gott verhasst; nicht nur sie, sondern auch die, die ihnen zustimmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πράσσοντες
  choice: wer … tut
  rationale: Die substantivierte Pluralform wird im Deutschen idiomatisch durch ein generisches „wer“ wiedergegeben; πράσσω bezeichnet hier das tatsächliche Tun bzw. Praktizieren.
- source_word: στυγητοὶ τῷ θεῷ
  choice: Gott verhasst
  rationale: στυγητός bedeutet „verhasst, abscheulich“; der Dativ τῷ θεῷ bezeichnet denjenigen, dem die Handelnden verhasst sind.
- source_word: οἱ συνευδοκοῦντες αὐτοῖς
  choice: wer denen zustimmt, die sie tun
  rationale: συνευδοκέω bezeichnet zustimmendes Gutheißen oder Billigen. Das erste αὐτοῖς bezieht sich grammatisch auf die Handelnden, weshalb die personale Ergänzung ausdrücklich wiedergegeben wird.
theological_decisions:
- issue: Art und Reichweite der Zustimmung
  choice: denen zustimmt, die sie tun
  alternative: sie gutheißt / daran Gefallen hat
  rationale: Die Übersetzung bewahrt den personalen Bezug des griechischen Dativs und lässt offen, ob die Zustimmung verbal, innerlich oder durch Unterstützung erfolgt.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Die zweimalige „wer“-Konstruktion bildet den griechischen Gegensatz zwischen Tätern und Zustimmenden natürlich ab.
