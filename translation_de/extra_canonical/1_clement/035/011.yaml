id: 1CLEM.35.11
reference: 1 Clement 35:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ, μήποτε ἁρπάσῃ ὡς λέων, καὶ μὴ ᾖ ὁ ῥυόμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: de
  text: Begreift das doch, ihr, die ihr Gott vergesst, damit er euch nicht wie ein Löwe packt[a] und niemand da ist, der euch rettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht kein Objekt bei „packt“; möglich ist daher auch: „damit er nicht wie ein Löwe zupackt“.'
    reason: Das griechische ἁρπάσῃ ist transitiv gebraucht, lässt sein aus dem Kontext erschließbares Objekt jedoch unausgesprochen.
lexical_decisions:
- source_word: σύνετε
  choice: Begreift
  rationale: Der Imperativ fordert dazu auf, die zuvor genannten Dinge zu verstehen und ernst zu nehmen; „begreifen“ ist natürlich und bewahrt den eindringlichen Ton.
- source_word: ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: ihr, die ihr Gott vergesst
  rationale: Gibt das substantivierte Präsenspartizip direkt und in modernem Deutsch verständlich wieder.
- source_word: ἁρπάσῃ
  choice: er euch … packt
  rationale: ἁρπάζω bezeichnet gewaltsames Ergreifen oder Fortreißen. Das im Griechischen unausgesprochene Objekt wird aus den Angeredeten erschlossen und im Deutschen ergänzt.
- source_word: ὁ ῥυόμενος
  choice: jemand …, der euch rettet
  rationale: Das substantivierte Partizip bezeichnet einen Retter oder Befreier; der Bezug auf die bedrohten Angeredeten wird im Deutschen ausdrücklich gemacht.
theological_decisions:
- issue: Subjekt von ἁρπάσῃ
  choice: „er“ als Rückbezug auf Gott
  alternative: Ein nicht ausdrücklich benannter Angreifer
  rationale: Im unmittelbaren Satz ist „Gott“ der einzig genannte mögliche Bezugspunkt. Das Pronomen bewahrt zugleich die knappe Form des Griechischen, ohne eine zusätzliche Deutung einzuführen.
- issue: Unausgesprochenes Objekt von ἁρπάσῃ
  choice: „euch“ im Haupttext ergänzt
  alternative: „damit er nicht wie ein Löwe zupackt/raubt“
  rationale: Das Griechische lässt das Objekt formal unausgesprochen, doch die Angeredeten sind sinngemäß betroffen. Natürliches Deutsch verlangt hier eine Ergänzung; die formale Auslassung wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Mahnrede. „Doch“ gibt die eindringliche Partikel δή wieder; die Satzspannung und das warnende Bild vom Löwen bleiben erhalten.
