  source_fidelity: Der Text gibt σύνετε δὴ ταῦτα treffend mit „Begreift das doch“ wieder und bewahrt die direkte Mahnrede. Die Warnung μήποτε ἁρπάσῃ ὡς λέων ist mit „damit er euch nicht wie ein Löwe packt“ sinngemäß und idiomatisch wiedergegeben. Das im Griechischen nicht ausgedrückte Objekt von ἁρπάσῃ darf im Deutschen aus den Angeredeten ergänzt werden. „… und niemand da ist, der euch rettet“ entspricht καὶ μὴ ᾖ ὁ ῥυόμενος; die Ergänzung „euch“ ist kontextgemäß.
  naturalness: Modernes, gut verständliches und zugleich angemessen würdiges Standarddeutsch. „Begreift das doch“ und „wie ein Löwe packt“ sind natürlich und bewahren den eindringlichen Charakter.
  terminology: „Gott“, „Löwe“ und „rettet“ sind sachgerecht. „Packt“ vermittelt die gewaltsame Nuance von ἁρπάζω, ohne stärker festzulegen als der griechische Text.
