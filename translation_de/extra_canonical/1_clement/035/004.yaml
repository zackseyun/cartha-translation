source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: de
  text: Lasst uns daher darum ringen, zu denen gezählt zu werden, die auf ihn warten,[a] damit wir an den verheißenen Gaben Anteil erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann ein geduldiges, standhaftes Warten einschließen.
    reason: Erläutert den Aspekt des griechischen ὑπομένω, ohne „ihn ertragen“ als im Kontext missverständliche Alternative nahezulegen.
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: wollen wir uns bemühen
  rationale: Der hortative Konjunktiv fordert zu ernsthaftem Einsatz auf; „uns bemühen“ ist im modernen Deutsch natürlich und bewahrt den Gedanken des Ringens, ohne einen sportlichen Bildgehalt zu überzeichnen.
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: zu denen gezählt zu werden
  rationale: Gibt die idiomatische Bedeutung von „in der Zahl gefunden werden“ natürlich und präzise wieder.
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: die auf ihn warten
  rationale: Bei persönlichem Akkusativ bezeichnet ὑπομένω hier das erwartungsvolle Warten auf ihn; „ihn erdulden“ würde irreführend nahelegen, dass er selbst ein Leiden sei.
- source_word: μεταλάβωμεν
  choice: wir … Anteil erhalten
  rationale: Bewahrt den Gedanken des Teilhabens bzw. Empfangens; die Formulierung ist im Deutschen mit „an den … Gaben“ idiomatisch.
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: an den verheißenen Gaben
  rationale: Entspricht knapp und würdig den zugesagten beziehungsweise verheißenen Gaben.
theological_decisions:
- issue: Bedeutung von ὑπομένω mit αὐτόν
  choice: auf ihn warten
  alternative: ihn geduldig ertragen
  rationale: Der Kontext verheißener Gaben und der persönliche Akkusativ stützen erwartungsvolles Ausharren auf ihn. Die Alternative wahrt zwar eine mögliche Grundbedeutung des Verbs, erzeugt hier aber eine theologisch und semantisch irreführende Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hortative Form wird mit „wollen wir“ wiedergegeben; „zu denen gezählt zu werden“ vermeidet eine unnatürliche wörtliche Nachbildung des griechischen Ausdrucks.
