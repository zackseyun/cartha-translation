  yaml_path: translation/extra_canonical/1_clement/035/010.yaml
  text: I will rebuke you and set it before your face.
translation:
  language: de
  text: Ich werde dich zurechtweisen und es dir vor Augen stellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέγξω
  choice: Ich werde dich zurechtweisen
  rationale: Das Verb bezeichnet hier ein überführendes Tadeln oder Zurechtweisen; die Wiedergabe ist verständlich und bewahrt den gerichtlichen Ernst.
- source_word: παραστήσω
  choice: vor Augen stellen
  rationale: In Verbindung mit κατὰ πρόσωπόν σου bezeichnet das Verb ein deutliches Vorhalten beziehungsweise Vor-Augen-Stellen.
- source_word: σε ... κατὰ πρόσωπόν σου
  choice: dir alles vor Augen
  rationale: Der überlieferte griechische Text hat formal ein zweites σε („dich“), während die zugrunde liegende Psalmstelle und der Sinnzusammenhang nahelegen, dass die Verfehlungen als gedankliches Objekt vorgehalten werden. „alles“ macht dieses implizite Objekt natürlich verständlich, ohne eine einzelne Sache festzulegen.
theological_decisions:
- issue: Objekt von παραστήσω
  choice: „alles“ als implizites Objekt
  alternative: „dich vor dein eigenes Angesicht stellen“
  rationale: Die rein formale Alternative bildet das zweite σε ab, ergibt im Deutschen jedoch eine schwer verständliche Aussage. Der idiomatische Zusammenhang des Zitats meint, dass Gott dem Angesprochenen seine Taten beziehungsweise Verfehlungen vor Augen stellt; „alles“ lässt deren genaue Bestimmung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung „vor Augen stellen“ gibt das Bild natürlich wieder; „zurechtweisen“ wahrt den ernsten, überführenden Ton.
