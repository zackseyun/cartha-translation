source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: de
  text: Was ist also für die bereitet, die geduldig ausharren? Der Schöpfer und Vater der Zeitalter[a], der Allheilige selbst, kennt ihr Ausmaß und ihre Schönheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weltzeiten«; griechisch αἰῶνες.'
    reason: Die Wendung »Vater der Zeitalter« kann die Weltzeiten beziehungsweise die umfassenden Ordnungen der Zeit bezeichnen.
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: die geduldig ausharren
  rationale: Das substantivierte Partizip bezeichnet Menschen, die standhaft beziehungsweise geduldig ausharren; ein nicht im griechischen Text vorhandenes Objekt wie »für ihn« wird nicht ergänzt.
- source_word: δημιουργὸς
  choice: Schöpfer
  rationale: Im Kontext bezeichnet das Wort Gott als den Urheber und Schöpfer; »Schöpfer« ist im Deutschen klar und würdig.
- source_word: αἰώνων
  choice: Zeitalter
  rationale: Der Plural αἰῶνες bezeichnet hier die Zeitalter beziehungsweise Weltzeiten; »Zeitalter« bewahrt diese zeitlich-kosmische Weite.
- source_word: ποσότητα
  choice: Ausmaß
  rationale: Das Substantiv meint Quantität, Größe oder Umfang. »Ausmaß« klingt im Deutschen natürlicher als »Menge« und legt nicht unnötig eine zählbare Anzahl fest.
- source_word: καλλονὴν
  choice: Schönheit
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe der außergewöhnlichen Schönheit beziehungsweise Herrlichkeit der bereiteten Dinge.
- source_word: πανάγιος
  choice: Allheilige
  rationale: Die verstärkte Form wird mit dem etablierten Gottesprädikat »der Allheilige« wiedergegeben und nicht zum bloßen »Heilige« abgeschwächt.
theological_decisions:
- issue: Bezug von τοῖς ὑπομένουσιν
  choice: »die geduldig ausharren« ohne ergänztes Objekt
  alternative: »die für ihn geduldig ausharren«
  rationale: Im vorliegenden Vers steht kein Objekt zu ὑπομένουσιν. Die mögliche inhaltliche Ergänzung aus dem folgenden Kontext darf nicht in diesen Satz hineingetragen werden.
- issue: Bedeutung von αἰώνων
  choice: »Zeitalter«
  alternative: »Ewigkeiten« oder »Welten«
  rationale: »Zeitalter« gibt den griechischen Plural transparent wieder, ohne die Wendung vorschnell ausschließlich zeitlich als endlose Ewigkeit oder räumlich als geschaffene Welten auszulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage bleibt knapp; »Was also ist … bereitet?« bildet die griechische Schlussfolgerung οὖν ἄρα ohne redundante Doppelung ab. Das markante Gottesprädikat »der Allheilige selbst« und die Paarung »Ausmaß und Schönheit« werden bewahrt.
