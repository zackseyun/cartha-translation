review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge und den vorwurfsvollen Charakter des griechischen Textes überwiegend treffend wieder. Korrekt sind insbesondere der Singular „einem Ehebrecher“ für μετὰ μοιχοῦ sowie die Wiedergabe von σκάνδαλον als „Stolperstein“. Allerdings ist „deinem leiblichen Bruder“ enger und weniger präzise als υἱῷ τῆς μητρός σου („dem Sohn deiner Mutter“); die griechische Verwandtschaftsformulierung sollte im Text stehen bleiben. „Dein Mund ließ das Böse überhandnehmen“ macht den Mund unnötig kausativ und trifft τὸ στόμα σου ἐπλεόνασεν κακίαν weniger unmittelbar.
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. „Mit einem Ehebrecher machtest du gemeinsame Sache“ ist verständlich, aber etwas umgangssprachlicher als der übrige Registerton; „hieltest du es“ ist knapper und näher an der Aussage. „Spann ein Netz aus Täuschung“ fügt das Bild eines Netzes hinzu, das im griechischen Text nicht ausdrücklich genannt ist.
  terminology: „Zurechtweisung“ ist für παιδεία im gegebenen Kontext vertretbar. „Täuschung“ für δολιότητα und „Stolperstein“ für σκάνδαλον bewahren den Bild- und Bedeutungsumfang ohne konfessionelle Festlegung. Die explizite Formulierung „Sohn deiner Mutter“ ist gegenüber „leiblicher Bruder“ vorzuziehen.
  issues:
  - severity: medium
    issue: „deinem leiblichen Bruder“ für υἱῷ τῆς μητρός σου
    rationale: Die Formulierung „Sohn deiner Mutter“ ist im Griechischen bewusst ausdrücklich und kann auch die Beziehung über die gemeinsame Mutter hervorheben. „Leiblicher Bruder“ glättet diese Form und kann im Deutschen zudem eine engere Beziehung suggerieren.
  - severity: medium
    issue: „Dein Mund ließ das Böse überhandnehmen“ für τὸ στόμα σου ἐπλεόνασεν κακίαν
    rationale: Die deutsche Formulierung legt nahe, der Mund bewirke, dass das Böse allgemein überhandnimmt. Der griechische Ausdruck beschreibt vielmehr das reichliche Hervorbringen bzw. die Fülle von Bosheit durch den Mund.
  - severity: low
    issue: „ein Netz aus Täuschung“
    rationale: Das Netz ist eine zusätzliche Konkretisierung. περιέπλεκεν bewahrt zwar ein Verflechtungsbild, benennt jedoch kein Netz.
  revised_text: Du aber hast Zurechtweisung gehasst und meine Worte hinter dich geworfen. Wenn du einen Dieb sahst, liefst du mit ihm, und mit einem Ehebrecher hieltest du es. Dein Mund brachte viel Böses hervor, und deine Zunge spann Täuschung. Du saßest da und verleumdetest deinen Bruder; dem Sohn deiner Mutter legtest du einen Stolperstein in den Weg.
