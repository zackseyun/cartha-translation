revisions:
- from: Du aber hast Zurechtweisung gehasst und meine Worte hinter dich geworfen. Sahst du einen Dieb, so liefst du mit ihm, und mit einem Ehebrecher machtest du gemeinsame Sache. Dein Mund ließ das Böse überhandnehmen, und deine Zunge spann ein Netz aus Täuschung. Du saßest da und verleumdetest deinen Bruder; deinem leiblichen Bruder[a] legtest du einen Stolperstein in den Weg.
  to: Du aber hast Zurechtweisung gehasst und meine Worte hinter dich geworfen. Wenn du einen Dieb sahst, liefst du mit ihm, und mit einem Ehebrecher hieltest du es. Dein Mund brachte viel Böses hervor, und deine Zunge spann Täuschung. Du saßest da und verleumdetest deinen Bruder; dem Sohn deiner Mutter legtest du einen Stolperstein in den Weg.
  rationale: Die Revision stellt die ausdrücklich mütterliche Verwandtschaftsbezeichnung im Haupttext wieder her und entfernt damit die dafür bislang erforderliche Fußnote. Die Aussage über den Mund wird unmittelbarer und ohne eine nicht im Ausgangstext angelegte kausative Nuance wiedergegeben. Die Metapher des Zungenhandelns bleibt mit „spann Täuschung“ erhalten, ohne ein „Netz“ hinzuzufügen. Die übrigen Entscheidungen, einschließlich des Singulars „einem Ehebrecher“, bleiben quellentreu.
  reviewer_model: gpt-5.6-terra
