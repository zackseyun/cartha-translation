source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: de
  text: Du aber hast Zurechtweisung gehasst und meine Worte hinter dich geworfen. Wenn du einen Dieb sahst, liefst du mit ihm, und mit einem Ehebrecher hieltest du es. Dein Mund brachte viel Böses hervor, und deine Zunge spann Täuschung. Du saßest da und verleumdetest deinen Bruder; dem Sohn deiner Mutter legtest du einen Stolperstein in den Weg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείαν
  choice: Zurechtweisung
  rationale: παιδεία bezeichnet hier nicht bloß Bildung, sondern erziehende Unterweisung beziehungsweise korrigierende Zucht. „Zurechtweisung“ gibt den vorwurfsvollen Zusammenhang natürlich wieder.
- source_word: συνέτρεχες αὐτῷ
  choice: liefst du mit ihm
  rationale: Die konkrete Laufmetapher des griechischen Ausdrucks bleibt erhalten; zugleich ist das gemeinsame Handeln mit dem Dieb verständlich.
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: mit einem Ehebrecher machtest du gemeinsame Sache
  rationale: μοιχοῦ ist Singular. Die idiomatische Wendung gibt die Beteiligung beziehungsweise Parteinahme wieder, ohne den griechischen Numerus zu verwischen.
- source_word: περιέπλεκεν δολιότητα
  choice: spann ein Netz aus Täuschung
  rationale: περιπλέκω bezeichnet ein Verflechten oder Umschlingen. Die deutsche Metapher bewahrt dieses Bild und klingt zugleich natürlich.
- source_word: σκάνδαλον
  choice: Stolperstein
  rationale: Das Wort kann einen Anstoß, Fallstrick oder eine Falle bezeichnen. „Stolperstein“ erhält das grundlegende Bild, ohne die Stelle vorschnell auf eine bestimmte Art der Schädigung festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von παιδεία
  choice: Zurechtweisung
  alternative: Unterweisung; Erziehung; Zucht
  rationale: Die Übersetzung wahrt den Gedanken korrigierender Erziehung, ohne eine konfessionell geprägte Lehre von „Zucht“ einzutragen.
- issue: Bezeichnung des υἱοῦ τῆς μητρός σου
  choice: dein leiblicher Bruder
  alternative: der Sohn deiner Mutter
  rationale: Die Wendung bezeichnet im Parallelismus den eigenen Bruder, betont aber ausdrücklich die gemeinsame Mutter. „Leiblicher Bruder“ macht diese Beziehung im modernen Deutsch deutlich; die Fußnote dokumentiert die Form des griechischen Ausdrucks.
- issue: Bildgehalt von σκάνδαλον
  choice: einen Stolperstein in den Weg legen
  alternative: eine Falle stellen; Anstoß bereiten
  rationale: Die bildhafte und potenziell mehrdeutige Aussage bleibt erhalten, statt sie ausschließlich als Falle oder moralischen Anstoß zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Folge imperfektischer Verbformen wird überwiegend als fortdauerndes beziehungsweise wiederholtes Verhalten wiedergegeben. Bildhafte Wendungen des griechischen Textes bleiben, soweit im Deutschen verständlich, erhalten.
