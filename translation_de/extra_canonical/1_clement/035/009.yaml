  text: ταῦτα ἐποίήσας, καὶ ἐσίγησα· ὑπέλαβες, ἄνομε, ὅτι ἔσομαι ὅμοιος σοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/009.yaml
  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: de
  text: Das hast du getan, und ich schwieg. Du meintest, du Gesetzloser, ich sei genauso wie du.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: Das
  rationale: Der griechische Plural bezeichnet zusammenfassend die zuvor genannten Taten; im natürlichen Deutschen ist dafür der kollektive Singular „Das“ passend.
- source_word: ἐσίγησα
  choice: ich schwieg
  rationale: Gibt den Aorist knapp und unmittelbar wieder, ohne Gottes Schweigen als Zustimmung zu deuten.
- source_word: ὑπέλαβες
  choice: du meintest
  rationale: Drückt die hier gemeinte irrige Annahme idiomatisch aus.
- source_word: ἄνομε
  choice: du Gesetzloser
  rationale: Bewahrt die direkte Anrede und den Bezug auf Missachtung des Gesetzes, statt sie allgemeiner als „Bösewicht“ wiederzugeben.
- source_word: ὅτι ἔσομαι ὅμοιος σοι
  choice: ich sei genauso wie du
  rationale: Die indirekte Rede mit Konjunktiv ist im Deutschen natürlich; „genauso wie du“ bewahrt den Gedanken vermeintlicher Gleichartigkeit.
theological_decisions:
- issue: Bedeutung von Gottes Schweigen
  choice: „ich schwieg“ ohne erklärenden Zusatz
  alternative: „ich duldete es still“ oder „ich schwieg dazu“
  rationale: Der Ausgangstext benennt Schweigen, erklärt aber weder Duldung noch Zustimmung; diese Spannung bleibt erhalten.
- issue: Art der vermeintlichen Gleichheit
  choice: „genauso wie du“
  alternative: „deinesgleichen“ oder „dir gleichgesinnt“
  rationale: Der griechische Ausdruck lässt offen, worin die Ähnlichkeit bestehen soll; die Übersetzung vermeidet eine dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, eindringlicher direkter Anrede. Keine Fußnoten erforderlich.
