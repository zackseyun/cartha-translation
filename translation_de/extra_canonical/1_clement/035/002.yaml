  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ζωὴ ἐν ἀθανασίᾳ, λαμπρότης ἐν δικαιοσύνῃ, ἀλήθεια ἐν παρρησίᾳ, πίστις ἐν πεποιθήσει, ἐγκράτεια ἐν ἁγιασμῷ· καὶ ταῦτα ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: de
  text: Leben in Unsterblichkeit, Herrlichkeit in Gerechtigkeit, Wahrheit in Freimütigkeit, Glaube in Zuversicht, Selbstbeherrschung in Heiligung; und dies alles stand unserem Denken vor Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴ ἐν ἀθανασίᾳ
  choice: Leben in Unsterblichkeit
  rationale: Bewahrt die knappe parallele Fügung mit ἐν und gibt ἀθανασία unmittelbar wieder.
- source_word: λαμπρότης ἐν δικαιοσύνῃ
  choice: Herrlichkeit in Gerechtigkeit
  rationale: λαμπρότης bezeichnet Glanz bzw. Herrlichkeit; „Herrlichkeit“ ist hier würdig und fügt sich natürlich in die Aufzählung ein.
- source_word: ἀλήθεια ἐν παρρησίᾳ
  choice: Wahrheit in Freimütigkeit
  rationale: παρρησία meint freies, offenes und unerschrockenes Reden bzw. Auftreten; „Freimütigkeit“ erhält diese Bedeutungsbreite.
- source_word: πίστις ἐν πεποιθήσει
  choice: Glaube in Zuversicht
  rationale: Unterscheidet πίστις von πεποίθησις und wahrt zugleich ihre enge semantische Verbindung.
- source_word: ἐγκράτεια ἐν ἁγιασμῷ
  choice: Selbstbeherrschung in Heiligung
  rationale: Gibt ἐγκράτεια als Selbstbeherrschung und ἁγιασμός als Heiligung wieder, ohne den Prozess- oder Zustandscharakter einseitig festzulegen.
- source_word: ὑπέπεπτεν ... τῇ διανοίᾳ ἡμῶν
  choice: stand unserem Denken vor Augen
  rationale: Das Imperfekt bezeichnet einen fortdauernden vergangenen Sachverhalt; die deutsche Wendung vermittelt, dass all dies dem geistigen Erfassen vorlag, ohne die schwer natürliche wörtliche Konstruktion „unter unser Denken fallen“ nachzubilden.
theological_decisions:
- issue: Verhältnis der jeweils mit ἐν verbundenen Begriffe
  choice: Die wiederholte Form „X in Y“ bleibt bestehen.
  alternative: Die Beziehungen deutend als Ursache, Mittel oder Folge ausdrücken.
  rationale: Das Griechische lässt die genaue Beziehung bewusst offen; eine explizite kausale oder instrumentale Deutung würde die theologische Spannung unnötig auflösen.
translation_notes:
  register: Knappe, rhythmische und würdige Reihung in modernem Standarddeutsch. Der Semikolonanschluss bewahrt die enge syntaktische Verbindung des Schlussglieds mit der Aufzählung.
