source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: de
  text: 'Und weiter heißt es: »Ich sah einen Gottlosen, hoch erhoben und aufragend wie die Zedern des Libanon. Ich ging vorüber, und siehe, er war nicht mehr da; ich suchte nach seinem Ort, doch ich fand ihn nicht. Bewahre Unschuld und achte auf Aufrichtigkeit; denn für einen friedfertigen Menschen bleibt etwas bestehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn für einen friedfertigen Menschen gibt es einen Rest / etwas Verbleibendes«. Das griechische Wort ἐγκατάλειμμα kann »Rest«, »das Verbleibende« oder auch »Nachkommenschaft« bedeuten; im Psalmzusammenhang kann damit auch die bleibende Zukunft des friedfertigen Menschen gemeint sein.'
    reason: Bewahrt die im griechischen Begriff enthaltene Mehrdeutigkeit und erläutert die mögliche kontextuelle Lesart, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: ἀσεβῆ
  choice: einen Gottlosen
  rationale: Gibt die religiös-moralische Bedeutung des substantivierten Adjektivs klar und traditionsnah wieder.
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: hoch erhoben und aufragend
  rationale: Bewahrt die beiden parallelen Partizipien und vermittelt sowohl Erhöhung als auch imposantes Hervortreten.
- source_word: φύλασσε ἀκακίαν
  choice: Bewahre Arglosigkeit
  rationale: ἀκακία bezeichnet das Freisein von Bosheit bzw. schuldlose Lauterkeit; »Arglosigkeit« wahrt diesen Sinn, ohne eine konfessionelle Deutung einzutragen.
- source_word: ἴδε εὐθύτητα
  choice: achte auf Aufrichtigkeit
  rationale: Das wörtliche »sieh Aufrichtigkeit« ist im Deutschen unnatürlich; »achte auf« gibt die auffordernde Bedeutung idiomatisch wieder.
- source_word: ἐγκατάλειμμα
  choice: Zukunft
  rationale: Im zugrunde liegenden Psalmkontext bezeichnet das Wort das, was einem Menschen verbleibt bzw. ihm bevorsteht; »Zukunft« ergibt einen natürlichen deutschen Sinn, während die wörtliche Bedeutung in der Fußnote dokumentiert wird.
- source_word: ἀνθρώπῳ εἰρηνικῷ
  choice: ein friedfertiger Mensch
  rationale: Gibt die allgemein-menschliche Formulierung inklusiv und das Adjektiv als beständige Haltung wieder.
theological_decisions:
- issue: Bedeutung von ἐγκατάλειμμα in der Schlussaussage
  choice: »hat eine Zukunft«
  alternative: »für einen friedfertigen Menschen bleibt etwas übrig« / »es gibt einen Rest für einen friedfertigen Menschen«
  rationale: Die griechische Formulierung ist ungewöhnlich und kann wörtlich auf etwas Verbleibendes weisen. Im Psalmzusammenhang ist jedoch die bleibende Zukunft bzw. Nachkommenschaft des Friedfertigen gemeint. Die Hauptfassung bleibt verständlich, während die Fußnote die echte lexikalische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Schriftzitat-Ton. Die Parallelität und Bildsprache des griechischen Textes bleiben erhalten; altertümliche oder unnötig technische Wendungen werden vermieden.
