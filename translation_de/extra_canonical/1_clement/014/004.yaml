  to: 'Denn es steht geschrieben: »Die Rechtschaffenen werden das Land[a] bewohnen, und die Unschuldigen werden darauf übrig bleiben; die aber gesetzlos handeln, werden vom Land hinweggetilgt werden.«'
  rationale: Die einzige Änderung ersetzt die schwerfällige Formulierung »werden daraus ausgerottet werden« durch »werden vom Land hinweggetilgt werden«. Damit bleibt die Intensität von ἐξολεθρεύω und die Trennung von der γῆ erhalten, während die deutsche Formulierung natürlicher wird.
