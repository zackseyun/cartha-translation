review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die drei Personengruppen und den Zukunfts- bzw. Passivcharakter des griechischen Spruchs insgesamt zutreffend wieder. »Rechtschaffenen« ist für χρηστοί in diesem ethischen Kontrast vertretbar; »Unschuldigen« gibt ἄκακοι angemessen wieder. Bei ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς sollte die räumliche Trennung idiomatischer als »vom Land hinweggetilgt« ausgedrückt werden.
  naturalness: Der Satz ist klar und dem zitathaften Register angemessen. Die Folge »werden daraus ausgerottet werden« ist jedoch stilistisch schwerfällig und klingt aufgrund der doppelten werden-Konstruktion weniger natürlich. »Vom Land hinweggetilgt werden« ist in modernem Standarddeutsch flüssiger und erhält die entschiedene Aussage des Verbs.
  terminology: Die ethischen Begriffe sind nicht konfessionell überfrachtet. »Land« ist als Wiedergabe von γῆ im Weisheitsspruch gut möglich; die Fußnote wahrt sinnvoll die mögliche weitere Bedeutung »Erde«. Die passive Form lässt die im Griechischen ungenannte handelnde Instanz offen.
