source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: de
  text: 'Denn es steht geschrieben: »Die Rechtschaffenen werden das Land[a] bewohnen, und die Unschuldigen werden darauf übrig bleiben; die aber gesetzlos handeln, werden vom Land hinweggetilgt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Erde.'
    reason: γῆ kann je nach Kontext sowohl »Land« als auch »Erde« bedeuten. Im Zusammenhang des zitierten Weisheitsspruchs ist »Land« wahrscheinlich, doch die weitere Bedeutung bleibt möglich.
lexical_decisions:
- source_word: χρηστοί
  choice: die Rechtschaffenen
  rationale: χρηστός kann »gut«, »tüchtig« oder »rechtschaffen« bedeuten. Im sprichwörtlichen Gegensatz zu den gesetzlos Handelnden bezeichnet »rechtschaffen« am klarsten die moralische Qualität.
- source_word: οἰκήτορες γῆς
  choice: werden das Land bewohnen
  rationale: Die prädikative Wendung bezeichnet Menschen, die im Land wohnen werden. Die verbale deutsche Fassung ist natürlich und bewahrt den Zukunftsbezug.
- source_word: ἄκακοι
  choice: die Unschuldigen
  rationale: ἄκακος bedeutet wörtlich »ohne Böses« und kann unschuldig, arglos oder lauter bezeichnen. »Unschuldig« gibt hier den moralischen Kontrast verständlich wieder.
- source_word: ὑπολειφθήσονται
  choice: werden … übrig bleiben
  rationale: Das Passiv bezeichnet diejenigen, die zurück- beziehungsweise übrig bleiben; die Formulierung erhält diesen Aspekt, ohne eine handelnde Instanz zu ergänzen.
- source_word: οἱ παρανομοῦντες
  choice: die … gesetzlos handeln
  rationale: Das substantivierte Partizip bezeichnet fortgesetzt oder charakteristisch gesetzlos Handelnde. Die Wiedergabe vermeidet die engere Festlegung auf einen einzelnen Gesetzesverstoß.
- source_word: ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς
  choice: werden daraus ausgerottet werden
  rationale: ἐξολεθρεύω bezeichnet vollständige Vernichtung oder Beseitigung. »Ausgerottet werden« verbindet diese Stärke idiomatisch mit der Entfernung aus dem Land.
theological_decisions:
- issue: Moralische Bezeichnung der beiden Gruppen
  choice: Rechtschaffene und Unschuldige gegenüber denen, die gesetzlos handeln
  alternative: Gütige und Arglose gegenüber Gesetzesübertretern
  rationale: Die gewählte Fassung wahrt den ethischen Gegensatz, ohne die Begriffe konfessionell oder lehrsystematisch aufzuladen.
- issue: Implizite handelnde Instanz bei den Passivformen
  choice: Die Passivformen bleiben ohne ausdrücklich genanntes Subjekt.
  alternative: Gott wird als derjenige ergänzt, der Menschen übrig lässt beziehungsweise ausrottet.
  rationale: Der griechische Text nennt die handelnde Instanz nicht ausdrücklich; diese Offenheit wird bewahrt.
translation_notes:
  register: Würdevoller, klarer Schriftzitat-Stil in modernem Standarddeutsch. Der parallele Satzbau und der scharfe Gegensatz des griechischen Spruchs bleiben erhalten; unnötig altertümliche Wendungen wurden vermieden.
