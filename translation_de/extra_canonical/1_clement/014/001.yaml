source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: de
  text: Darum ist es recht und heilig, Brüder, dass wir Gott gehorsam werden, statt denjenigen zu folgen, die in Überheblichkeit und Unordnung abscheuliche Eifersucht anstiften.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Anführern der abscheulichen Eifersucht“.'
    reason: ἀρχηγός kann sowohl einen Urheber bzw. Anstifter als auch einen Anführer bezeichnen; der Genitiv begünstigt hier die erste Deutung, schließt die zweite aber nicht völlig aus.
lexical_decisions:
- source_word: Δίκαιον οὖν καὶ ὅσιον
  choice: Darum ist es recht und heilig
  rationale: „Darum“ gibt οὖν folgernd wieder; „recht und heilig“ bewahrt die beiden wertenden Begriffe ohne sie zusammenzuziehen.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die griechische Anredeformel lautet wörtlich „Männer, Brüder“; im natürlichen modernen Deutsch trägt „Brüder“ die Anrede angemessen, ohne ein unidiomatisches „Männer, Brüder“.
- source_word: ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ
  choice: dass wir Gott gehorsam werden
  rationale: „Gehorsam werden“ bildet γενέσθαι ab und bezeichnet nicht nur einen einzelnen Akt des Gehorchens; die Gegenüberstellung μᾶλλον … ἢ wird durch „statt“ idiomatisch ausgedrückt.
- source_word: ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: in Überheblichkeit und Unordnung
  rationale: „Überheblichkeit“ trifft die anmaßende Selbstüberschätzung von ἀλαζονεία; „Unordnung“ wahrt die breite Bedeutung von ἀκαταστασία, die auch Aufruhr oder Zerrüttung einschließen kann.
- source_word: μυσεροῦ ζήλους ἀρχηγοῖς
  choice: die … abscheuliche Eifersucht anstiften
  rationale: ἀρχηγός mit Genitiv kann den Urheber oder Anstifter einer Sache bezeichnen. Die verbale deutsche Fassung gibt diese Beziehung natürlich wieder; „abscheulich“ bildet μυσερός und „Eifersucht“ ζῆλος in seinem negativen Kontext ab.
theological_decisions:
- issue: Reichweite des geforderten Gehorsams
  choice: Die Gegenüberstellung zwischen Gehorsam gegenüber Gott und dem Folgen der Unruhestifter bleibt unmittelbar stehen.
  alternative: Den Satz ausdrücklich als allgemeine Lehre über menschliche und göttliche Autorität auslegen.
  rationale: Der griechische Text formuliert die konkrete moralische Alternative, entwickelt hier aber keine umfassende Autoritätslehre; eine solche Präzisierung wäre interpretierender Zusatz.
- issue: Bedeutung von ἀρχηγός
  choice: Als „anstiften“ im Sinn von Urheberschaft wiedergegeben.
  alternative: Als „Anführer“ im Sinn einer leitenden Rolle wiedergeben.
  rationale: Die Verbindung mit dem Genitiv μυσεροῦ ζήλους spricht besonders für „Urheber/Anstifter“, doch die mögliche Bedeutung „Anführer“ wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Anrede ist knapp und natürlich; der Satzbau bleibt gut verständlich. „Unordnung“ bewahrt gegenüber dem engeren „Aufruhr“ die semantische Breite des Griechischen.
