  source_fidelity: 'Die Übersetzung gibt die normalisierte Quelllesart πίπτουσιν zutreffend intransitiv wieder: Die betreffenden Menschen verfallen selbst in Streit und στάσεις. Auch „Wünschen“, „leichtfertig ausliefern“ und „dem Guten entfremden“ entsprechen dem griechischen Sinn gut. „In große Gefahr geraten“ ist für κίνδυνον ὑποίσομεν eine zulässige idiomatische Wiedergabe.'
