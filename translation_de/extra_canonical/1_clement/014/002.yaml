id: 1CLEM.14.2
reference: 1 Clement 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: de
  text: Denn wir werden keinen gewöhnlichen Schaden erleiden, sondern vielmehr in große Gefahr geraten, wenn wir uns leichtfertig den Wünschen von Menschen ausliefern, die in Streit und Spaltungen verfallen, um uns dem Guten zu entfremden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: keinen gewöhnlichen Schaden
  rationale: Die Wendung bezeichnet keinen beliebigen oder geringfügigen Schaden; „keinen gewöhnlichen Schaden“ bewahrt die emphatische Untertreibung.
- source_word: κίνδυνον ὑποίσομεν μέγαν
  choice: in große Gefahr geraten
  rationale: Natürliches modernes Deutsch für das Tragen beziehungsweise Aufsichnehmen großer Gefahr.
- source_word: ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς
  choice: uns leichtfertig ... ausliefern
  rationale: Gibt sowohl das rücksichtslose Eingehen eines Risikos als auch die Selbstüberantwortung wieder.
- source_word: τοῖς θελήμασιν
  choice: den Wünschen
  rationale: Entspricht dem Willen oder Begehren der betreffenden Menschen, ohne daraus bereits feste Absichten oder Pläne zu machen.
- source_word: πίπτουσιν εἰς ἔριν καὶ στάσεις
  choice: in Streit und Parteiungen verfallen
  rationale: Folgt der überlieferten Lesart πίπτουσιν intransitiv; die Menschen selbst geraten in Streit und parteiliche Spaltungen.
- source_word: τοῦ καλοῦ
  choice: dem Guten
  rationale: Bewahrt die substantivische und ethisch weit gefasste Bedeutung des griechischen Ausdrucks.
theological_decisions:
- issue: Bezug von εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς
  choice: „um uns dem Guten zu entfremden“ als Ziel- beziehungsweise Ergebnisangabe
  alternative: „sodass wir dem Guten entfremdet werden“
  rationale: Die Infinitivkonstruktion kann Ziel oder Folge ausdrücken. Die knappe deutsche Wiedergabe mit „um“ erhält die Spannung, ohne eine zusätzliche handelnde Person einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber idiomatisch geglättet. Keine Fußnote erforderlich, da die normalisierte Quelllesart πίπτουσιν im Haupttext unmittelbar und verständlich wiedergegeben wird.
