  terminology: στάσεις bezeichnet hier Fraktionsbildung, Aufruhr oder Spaltungen. „Spaltungen“ ist im Zusammenhang mit ἔρις die natürlichere und semantisch breitere deutsche Entsprechung als „Parteiungen“. Die ethisch offene Wiedergabe τοῦ καλοῦ als „dem Guten“ ist beizubehalten.
