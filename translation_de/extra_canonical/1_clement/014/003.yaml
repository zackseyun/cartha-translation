  text: χρηστευσώμεθα ἑαυτοῖς κατὰ τὴν εὐσπλαγχνίαν καὶ γλυκύτητα τοῦ ποιήσαντος ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/003.yaml
  text: Let us be kind to one another according to the compassion and gentleness of the One who made us[a].
translation:
  language: de
  text: Lasst uns zueinander freundlich sein, entsprechend dem Erbarmen und der Milde dessen, der uns geschaffen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns freundlich zu uns selbst sein.“'
    reason: ἑαυτοῖς ist der Form nach reflexiv, wird im Plural jedoch häufig reziprok gebraucht; der Kontext spricht für „zueinander“.
lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: Lasst uns … freundlich sein
  rationale: Der hortative Aorist fordert zu erwiesener Freundlichkeit auf; die Formulierung ist natürlich und gibt den gemeinschaftlichen Appell unmittelbar wieder.
- source_word: ἑαυτοῖς
  choice: zueinander
  rationale: 'Das plurale Reflexivpronomen hat hier, im gemeinschaftlichen Zusammenhang, reziproke Bedeutung: gegenseitige Freundlichkeit statt moderner Selbstfürsorge.'
- source_word: εὐσπλαγχνίαν
  choice: Erbarmen
  rationale: Bezeichnet herzliches Mitgefühl beziehungsweise Barmherzigkeit; „Erbarmen“ ist würdig, verständlich und prägnant.
- source_word: γλυκύτητα
  choice: Güte
  rationale: Wörtlich liegt „Sanftheit/Milde“ nahe; hier bezeichnet das Wort die milde, gütige Wesensart des Schöpfers. „Güte“ verbindet Natürlichkeit mit dem Sinnzusammenhang.
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: dessen, der uns geschaffen hat
  rationale: Gibt das substantivierte Partizip eindeutig wieder und bewahrt den Bezug auf Gott als Schöpfer.
theological_decisions:
- issue: Reziproke oder reflexive Deutung von ἑαυτοῖς
  choice: zueinander
  alternative: zu uns selbst
  rationale: Pluralische Reflexivpronomen können im hellenistischen Griechisch reziprok gebraucht werden. Der Aufruf zur gemeinschaftlichen Eintracht stützt diese Lesart; die formal mögliche reflexive Wiedergabe bleibt in der Fußnote sichtbar.
- issue: Normgebende Beziehung zu den Eigenschaften des Schöpfers
  choice: entsprechend dem Erbarmen und der Güte
  alternative: gemäß der Barmherzigkeit und Sanftmut
  rationale: κατά stellt Gottes Haltung als Maßstab für das gegenseitige Verhalten dar, ohne genauer festzulegen, ob Nachahmung, Übereinstimmung oder Begründung im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der inklusive gemeinschaftliche Appell wird mit „Lasst uns“ bewahrt. „Zueinander freundlich sein“ klingt natürlich, während die Fußnote die echte grammatische Mehrdeutigkeit dokumentiert.
