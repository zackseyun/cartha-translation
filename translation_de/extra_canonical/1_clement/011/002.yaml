id: 1CLEM.11.2
reference: 1 Clement 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: de
  text: 'Denn als seine Frau mit ihm hinausging, war sie anderer Gesinnung und nicht in Eintracht. Darum wurde sie als Zeichen hingestellt: Sie wurde zu einer Salzsäule bis auf den heutigen Tag. So sollte allen bekannt sein, dass die innerlich Geteilten[a] und diejenigen, die an der Macht Gottes zweifeln, für alle Generationen zum Gericht und zum Warnzeichen werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Doppelseeligen«; gemeint sind Menschen mit geteilter, schwankender Haltung.'
    reason: Das ungewöhnliche Bild von δίψυχοι lässt sich im Haupttext nicht zugleich wörtlich und idiomatisch wiedergeben.
  - marker: b
    text: 'Oder: »zu einem Urteil und zu einer Warnung werden«.'
    reason: κρίμα kann je nach Zusammenhang »Gericht«, »Urteil« oder »Verurteilung« bedeuten; σημείωσις bezeichnet ein kennzeichnendes, warnendes Beispiel.
lexical_decisions:
- source_word: ἑτερογνώμονος
  choice: anderer Gesinnung
  rationale: Gibt die abweichende innere Haltung gegenüber ihrem Mann wieder, ohne den Ausdruck auf bloße Meinungsverschiedenheit zu verengen.
- source_word: ὁμονοίᾳ
  choice: Eintracht
  rationale: Bewahrt den für 1 Clemens wichtigen gemeinschaftlich-ethischen Sinn von ὁμόνοια und klingt im Deutschen zugleich würdig und verständlich.
- source_word: δίψυχοι
  choice: die innerlich Geteilten
  rationale: Bewahrt das Bild des griechischen Ausdrucks ('zweifach beseelt') in natürlichem Deutsch und bezeichnet schwankende, unentschlossene Menschen.
- source_word: διστάζοντες
  choice: diejenigen, die ... zweifeln
  rationale: Entspricht dem Partizip und bewahrt dessen direkten Bezug auf die Macht Gottes.
- source_word: κρίμα
  choice: Gericht
  rationale: Bewahrt die gerichtliche und theologische Spannung des Wortes, statt es eindeutig als Urteil, Strafe oder Verurteilung festzulegen.
- source_word: σημείωσιν
  choice: Warnzeichen
  rationale: Gibt die exemplarische Warnfunktion treffend wieder und hält die Verbindung zu σημεῖον ('Zeichen') im vorhergehenden Satz hörbar.
theological_decisions:
- issue: Bedeutung von εἰς κρίμα καὶ εἰς σημείωσιν
  choice: zum Gericht und zum Warnzeichen werden
  alternative: der Verurteilung anheimfallen und als Warnung dienen
  rationale: Ein einziges γίγνονται regiert beide parallelen Glieder. Die gewählte Fassung erhält diese Struktur und lässt offen, in welchem genauen Sinn die Betroffenen selbst 'Gericht' werden.
- issue: Aussage über die Macht Gottes
  choice: an der Macht Gottes zweifeln
  alternative: hinsichtlich der Macht Gottes unschlüssig sind
  rationale: Die direkte Formulierung ist natürlich und gibt διστάζοντες περὶ klar wieder, ohne eine weitergehende dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in drei Sätze gegliedert, während Ursache, Zeichenfunktion und Folgerung erhalten bleiben. »Eintracht« wahrt den programmatischen Sprachgebrauch des 1. Clemensbriefs.
