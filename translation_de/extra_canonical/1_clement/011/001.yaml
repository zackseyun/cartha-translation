revisions:
- from: Durch Gastfreundschaft und Gottesfurcht wurde Lot aus Sodom gerettet, als die ganze umliegende Gegend durch Feuer und Schwefel gerichtet wurde. Damit machte der Herr deutlich, dass er die nicht verlässt, die auf ihn hoffen, die aber, die vom rechten Weg abweichen, der Strafe und Misshandlung preisgibt.
  to: Durch Gastfreundschaft und Gottesfurcht wurde Lot aus Sodom gerettet, während die ganze umliegende Gegend durch Feuer und Schwefel gerichtet wurde. Daran machte der Herr deutlich, dass er die nicht verlässt, die auf ihn hoffen, die aber, die abweichen, zu Strafe und Pein bestimmt.
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text enthaltene Ergänzung „rechten Weg“, gibt die Bestimmungsaussage von τίθησιν εἰς genauer wieder und bewahrt die offene Bedeutung von ἑτεροκλινεῖς sowie αἰκισμός. Satzstruktur, Kontrast und würdiger Registerton bleiben erhalten.
