id: 1CLEM.11.1
reference: 1 Clement 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: de
  text: Durch Gastfreundschaft und Gottesfurcht wurde Lot aus Sodom gerettet, während die ganze umliegende Gegend durch Feuer und Schwefel gerichtet wurde. Daran machte der Herr deutlich, dass er die nicht verlässt, die auf ihn hoffen, die aber, die abweichen, zu Strafe und Pein bestimmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: Gastfreundschaft
  rationale: Die direkte und im Kontext von Lots Aufnahme der Fremden natürliche Wiedergabe.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Bezeichnet hier eine ehrfürchtige, an Gott ausgerichtete Frömmigkeit; „Gottesfurcht“ ist verständlich und bewahrt den religiösen Bezug.
- source_word: ὁ δεσπότης
  choice: der Herr
  rationale: Im Kontext ist Gott als souveräner Herr gemeint; „Herr“ ist im Deutschen würdig und idiomatischer als „Gebieter“.
- source_word: ἑτεροκλινεῖς
  choice: die vom rechten Weg abweichen
  rationale: Das seltene Wort bezeichnet Menschen, die sich auf eine andere Seite neigen beziehungsweise abwenden; die Formulierung bewahrt die bildhafte moralische Richtung, ohne sie konfessionell festzulegen.
- source_word: κόλασιν καὶ αἰκισμὸν
  choice: Strafe und Misshandlung
  rationale: 'Gibt die beiden Begriffe getrennt wieder: κόλασις als Strafe und αἰκισμός als qualvolle, entehrende Misshandlung.'
theological_decisions:
- issue: Art und Zeitpunkt der Strafe
  choice: „der Strafe und Misshandlung preisgibt“
  alternative: „zu Strafe und Qual bestimmt“
  rationale: Das Griechische τίθησιν εἰς bezeichnet ein Versetzen beziehungsweise Bestimmen zu einem Zustand, legt aber weder den genauen Zeitpunkt noch ein ausgearbeitetes Strafverständnis fest.
- issue: Bezeichnung Gottes als δεσπότης
  choice: „der Herr“
  alternative: „der Gebieter“
  rationale: „Herr“ bewahrt die Aussage göttlicher Hoheit in natürlichem, dignifiziertem Deutsch, ohne zusätzliche dogmatische Akzente einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzlogik. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; der Gegensatz zwischen den Hoffenden und den Abweichenden bleibt erhalten.
