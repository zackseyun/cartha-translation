review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung ist zutreffend. Jedoch fügt „vom rechten Weg“ eine im griechischen ἑτεροκλινεῖς nicht ausdrücklich vorhandene Konkretisierung hinzu. Für τίθησιν εἰς κόλασιν καὶ αἰκισμόν ist „zu Strafe und Pein bestimmt“ näher an der Aussage als „preisgibt“ und wahrt deren offene zeitliche und konzeptionelle Reichweite.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Daran machte der Herr deutlich“ stellt den Bezug auf Lots Rettung und das Gericht idiomatischer und genauer her als das etwas pauschale „Damit“.
  terminology: „Gastfreundschaft“, „Gottesfurcht“ und „Herr“ sind im Kontext tragfähige Wiedergaben. „Pein“ gibt αἰκισμός als schwere, qualvolle Behandlung wieder, ohne eine konkrete Art der Misshandlung festzulegen.
  issues:
  - severity: medium
    issue: „vom rechten Weg abweichen“ ergänzt „rechten Weg“.
    rationale: ἑτεροκλινεῖς bezeichnet die anders Geneigten bzw. Abweichenden, ohne das Bild eines ausdrücklich „rechten Weges“ zu verwenden. Die Ergänzung ist zwar interpretativ naheliegend, aber für eine optimal-äquivalente Übersetzung entbehrlich.
  - severity: low
    issue: „der Strafe und Misshandlung preisgibt“ ist bei τίθησιν εἰς weniger präzise.
    rationale: Das Verb bedeutet hier eher „zu/in etwas setzen, bestimmen“ als „preisgeben“. Zudem kann „Misshandlung“ im Deutschen unnötig konkret eine Täterhandlung nahelegen; αἰκισμός bezeichnet allgemein qualvolle Pein bzw. Tortur.
  revised_text: Durch Gastfreundschaft und Gottesfurcht wurde Lot aus Sodom gerettet, während die ganze umliegende Gegend durch Feuer und Schwefel gerichtet wurde. Daran machte der Herr deutlich, dass er die nicht verlässt, die auf ihn hoffen, die aber, die abweichen, zu Strafe und Pein bestimmt.
