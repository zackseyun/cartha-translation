  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: de
  text: Und ich werde deine Nachkommen zahlreich machen wie den Sand der Erde. Wenn jemand den Sand der Erde zählen kann, dann werden auch deine Nachkommen gezählt werden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα
  choice: Nachkommen
  rationale: Im Zusammenhang der Verheißung bezeichnet das singularische Kollektivwort die Nachkommenschaft Abrahams; „Nachkommen“ ist im heutigen Deutsch natürlich und wahrt den kollektiven Sinn.
- source_word: ποιήσω … ὡς
  choice: werde … zahlreich machen wie
  rationale: Die wörtliche Formulierung „machen wie“ meint hier den Vergleich hinsichtlich der unzählbaren Menge. Die Ergänzung „zahlreich“ macht diesen im Folgesatz ausdrücklich bestätigten Sinn natürlich verständlich.
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: zählen / gezählt werden
  rationale: Die Wiederholung und der Wechsel vom Aktiv zum Passiv bleiben erhalten.
theological_decisions:
- issue: Kollektiver oder individueller Sinn von σπέρμα
  choice: 'kollektiv: „Nachkommen“'
  alternative: „Same“ oder „Nachkommenschaft“
  rationale: Der unmittelbare Vergleich mit dem Sand der Erde stellt die Vielzahl in den Vordergrund. Die Übersetzung entscheidet nicht über weitergehende theologische Verwendungen des Begriffs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konditionale Nachsatz und die rhetorische Unmöglichkeit des Zählens bleiben erhalten; das abschließende Anführungszeichen kennzeichnet das Ende des fortlaufenden Zitats.
