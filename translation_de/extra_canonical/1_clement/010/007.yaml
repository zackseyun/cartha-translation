review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die kausalen Präpositionalgruppen, den theologischen Passivsatz, die Opferterminologie und die zeitliche Vorordnung von ἔδειξεν gegenüber προσήνεγκεν insgesamt treffend wieder. Im Schlusssatz ist der im Kontext vorausgesetzte Handelnde des griechischen Singularverbs Gott; das deutsche Pronomen „er“ legt wegen des unmittelbar vorausgehenden Subjekts Abraham jedoch naheliegend eine sachwidrige Lesart nahe.
  naturalness: Modernes, würdiges Standarddeutsch. Die Satzfügung und „als Opfer darbringen“ sind idiomatisch. Die explizite Nennung Gottes im Relativsatz beseitigt eine im Deutschen deutlich stärkere und irreführende Pronomenmehrdeutigkeit.
  terminology: „Glauben“, „Gastfreundschaft“, „Gehorsam“ und „Opfer“ sind angemessen und registergerecht. Das Passiv „wurde ... geschenkt“ wahrt, dass der griechische Text Gott beim Geben nicht ausdrücklich nennt.
  issues:
  - severity: medium
    issue: Mehrdeutiger und im Deutschen missverständlicher Bezug von „er“ in „die er ihm gezeigt hatte“
    rationale: Während ἔδειξεν im griechischen Kontext Gott als impliziten Handelnden voraussetzt, lässt das deutsche maskuline Pronomen nach „brachte er“ leicht Abraham als Subjekt erscheinen; dadurch entstünde die unsinnige Vorstellung, Abraham habe die Berge sich selbst gezeigt. Die explizite Nennung Gottes gibt den kontextuell bestimmten, aber im Griechischen unausgedrückten Handelnden wieder.
  revised_text: Aufgrund seines Glaubens und seiner Gastfreundschaft wurde ihm im hohen Alter ein Sohn geschenkt, und aus Gehorsam brachte er ihn Gott als Opfer dar, auf einem der Berge, die Gott ihm gezeigt hatte.
