source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ πίστιν καὶ φιλοξενίαν ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ, καὶ διʼ ὑπακοῆς προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ πρὸς ἓν τῶν ὀρέων ὧν ἔδειξεν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: de
  text: Aufgrund seines Glaubens und seiner Gastfreundschaft wurde ihm im hohen Alter ein Sohn geschenkt, und aus Gehorsam brachte er ihn Gott als Opfer dar, auf einem der Berge, die Gott ihm gezeigt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ πίστιν καὶ φιλοξενίαν
  choice: Aufgrund seines Glaubens und seiner Gastfreundschaft
  rationale: διά mit accusative expresses cause or reason here. The possessive pronoun is supplied naturally in German and clearly refers to Abraham.
- source_word: ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ
  choice: wurde ihm im hohen Alter ein Sohn geschenkt
  rationale: The passive ἐδόθη is retained, while 'geschenkt' conveys the implied gracious gift more naturally than the bare 'gegeben'.
- source_word: διʼ ὑπακοῆς
  choice: aus Gehorsam
  rationale: This idiomatic German phrase preserves obedience as the motive or means of Abraham's action.
- source_word: προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ
  choice: brachte er ihn Gott als Opfer dar
  rationale: The idiomatic sacrificial expression 'als Opfer darbringen' accurately renders προσφέρειν ... θυσίαν and preserves the referent of αὐτόν.
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: auf einem der Berge
  rationale: Although πρός formally has directional force, the phrase in context identifies the mountain where the offering occurred; idiomatic German uses 'auf'.
- source_word: ὧν ἔδειξεν αὐτῷ
  choice: die er ihm gezeigt hatte
  rationale: German pluperfect makes the prior act of showing clear while retaining the Greek pronouns and their mild referential ambiguity.
theological_decisions:
- issue: Agency behind the gift of the son
  choice: The passive wording is retained without explicitly naming God as giver.
  alternative: Gott schenkte ihm im hohen Alter einen Sohn.
  rationale: The Greek uses a theological passive (ἐδόθη), so naming God would make an implication explicit that the wording itself leaves unstated.
- issue: Subject of 'had shown'
  choice: Retain the pronoun 'er' rather than inserting 'Gott'.
  alternative: die Gott ihm gezeigt hatte
  rationale: The biblical allusion makes God the likely subject, but the Greek does not name him in the relative clause; retaining the pronoun preserves the source form and genuine grammatical ambiguity.
- issue: Nature of Abraham's action
  choice: Translate the text's presentation directly as bringing his son as a sacrifice.
  alternative: wollte er ihn Gott als Opfer darbringen
  rationale: The Greek aorist προσήνεγκεν presents the offering as an accomplished act in the author's theological retelling; adding 'wollte' would soften it based on the Genesis narrative rather than translate this sentence.
translation_notes:
  register: Modern, dignified standard German. The syntax is kept clear and natural without flattening the source's theological passive or resolving the pronoun in the final relative clause.
