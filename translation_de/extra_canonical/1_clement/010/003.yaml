id: 1CLEM.10.3
reference: 1 Clement 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: de
  text: „Zieh fort[a] aus deinem Land, aus deiner Verwandtschaft und aus dem Haus deines Vaters in das Land, das ich dir zeigen werde. Ich werde dich zu einem großen Volk machen, dich segnen und deinen Namen groß machen, und du wirst gesegnet sein. Ich werde segnen, die dich segnen, und verfluchen, die dich verfluchen; und in dir werden alle Stämme der Erde gesegnet werden.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geh fort“.'
    reason: Ἄπελθε kann schlicht als Aufforderung zum Weggehen wiedergegeben werden; „Zieh fort“ passt besonders gut zur Abreise aus Land, Verwandtschaft und Vaterhaus.
lexical_decisions:
- source_word: Ἄπελθε
  choice: Zieh fort
  rationale: Gibt den Imperativ von ἀπέρχομαι als Aufforderung zum Weggehen wieder und bewahrt Clements Wortwahl gegenüber dem traditionellen „Geh hinaus“ für ἔξελθε.
- source_word: συγγενείας
  choice: Verwandtschaft
  rationale: Bezeichnet hier den Kreis der Verwandten beziehungsweise die Sippe; „Verwandtschaft“ ist im modernen Standarddeutsch verständlich und quellennah.
- source_word: ποιήσω σε εἰς ἔθνος μέγα
  choice: Ich werde dich zu einem großen Volk machen
  rationale: Natürliches Deutsch für die griechische Ergebniskonstruktion; ἔθνος bezeichnet hier ein Volk.
- source_word: μεγαλυνῶ τὸ ὄνομά σου
  choice: deinen Namen groß machen
  rationale: Bewahrt das konkrete Bild und den feierlichen Klang des griechischen Ausdrucks.
- source_word: φυλαὶ
  choice: Stämme
  rationale: Entspricht dem sozialen und genealogischen Sinn von φυλή genauer als das allgemeinere „Völker“.
theological_decisions:
- issue: Bedeutung von ἔσῃ εὐλογημένος
  choice: du wirst gesegnet sein
  alternative: du wirst ein Segen sein
  rationale: Der vorliegende griechische Text hat eine passive beziehungsweise zustandsbezogene Form und sagt ausdrücklich „gesegnet“; die alternative, aus anderen Texttraditionen bekannte Deutung „ein Segen“ wird nicht in den Text eingetragen.
- issue: Bedeutung von ἐν σοὶ
  choice: in dir
  alternative: durch dich
  rationale: „In dir“ bewahrt die formale und theologisch bedeutsame Mehrdeutigkeit der Wendung, während „durch dich“ die Art der Vermittlung stärker festlegen würde.
- issue: Passiv εὐλογηθήσονται
  choice: werden gesegnet werden
  alternative: werden sich Segen wünschen
  rationale: Die passive Wiedergabe folgt der griechischen Form, ohne eine reflexive oder idiomatische Deutung vorwegzunehmen.
translation_notes:
  register: Feierliche, aber gegenwärtige Standardsprache. Die wiederholten Satzverbindungen und Segensformeln bleiben erhalten, ohne den deutschen Satzbau unnötig archaisch zu gestalten.
