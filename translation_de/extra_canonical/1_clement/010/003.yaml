review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung folgt dem griechischen Text eng. „Zieh fort“ gibt Ἄπελθε treffend wieder und wahrt die Abweichung gegenüber einem möglichen „Geh hinaus“. Die Wiederholung von „aus“ entspricht der Vorlage; „zu einem großen Volk machen“, „deinen Namen groß machen“, die passivische Wiedergabe von ἔσῃ εὐλογημένος und εὐλογηθήσονται sowie das mehrdeutig offene „in dir“ sind quellentreu.
  naturalness: Der Text ist in feierlicher, heutiger Standardsprache gut lesbar. „Zieh fort“ passt idiomatisch zum Verlassen von Land, Verwandtschaft und Vaterhaus. Die knappe Konstruktion „segnen, die dich segnen“ ist in diesem gehobenen, formelhaften Register zulässig und bewahrt die Wiederholung der Vorlage.
  terminology: „Verwandtschaft“, „Volk“ und „Stämme“ sind sachgerecht. „Stämme der Erde“ gibt φυλαὶ τῆς γῆς präzise wieder, ohne es zu „Völkern“ zu verallgemeinern. Die Segens- und Fluchterminologie ist konsistent und theologisch nicht überdeutet.
