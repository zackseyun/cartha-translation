source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: de
  text: 'Und wiederum sagte Gott zu ihm, als er sich von Lot getrennt hatte: „Heb deine Augen auf und schau von dem Ort, an dem du jetzt bist, nach Norden und Süden, nach Osten und zum Meer[a]. Denn das ganze Land, das du siehst, werde ich dir und deinen Nachkommen[b] auf ewig geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Meer bezeichnet hier die westliche Richtung.
    reason: Das griechische θάλασσα bedeutet wörtlich „Meer“, fungiert in dieser Richtungsfolge jedoch zugleich als Bezeichnung des Westens.
  - marker: b
    text: 'Wörtlich: deinem Samen.'
    reason: Die Fußnote bewahrt die konkrete, grammatisch singularische Ausdrucksweise des griechischen σπέρμα, während der Haupttext den kollektiven Sinn verständlich wiedergibt.
lexical_decisions:
- source_word: διαχωρισθῆναι
  choice: sich … getrennt hatte
  rationale: 'Die formal passive Form wird hier sinnvoll intransitiv beziehungsweise medial verstanden: Abraham und Lot gingen auseinander; eine von außen bewirkte Trennung wird nicht behauptet.'
- source_word: Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε
  choice: Heb deine Augen und schau
  rationale: Gibt sowohl das Aufheben des Blicks als auch die Aufforderung zum Schauen natürlich und würdig wieder.
- source_word: λίβα
  choice: Süden
  rationale: Der Richtungsbegriff bezeichnet hier den Südwesten beziehungsweise Süden und steht in der Vier-Richtungen-Formel dem Norden gegenüber.
- source_word: θάλασσαν
  choice: zum Meer
  rationale: Bewahrt das konkrete griechische Bild; gemeint ist die westliche Richtung zum Mittelmeer.
- source_word: σπέρματί
  choice: Nachkommen
  rationale: Im Kontext ist der kollektive Sinn von 'Same' gemeint. 'Nachkommen' ist im modernen Deutschen klar und natürlich, während eine Fußnote die Form des Ausgangswortes transparent hält.
- source_word: ἕως αἰῶνος
  choice: auf ewig
  rationale: Entspricht der zeitlich unbeschränkten Zusage in idiomatischem, gehobenem Deutsch.
theological_decisions:
- issue: Passivische Form bei Abrahams Trennung von Lot
  choice: als er sich von Lot getrennt hatte
  alternative: als er von Lot getrennt worden war
  rationale: Die griechische Passivform kann hier intransitiv beziehungsweise medial gebraucht sein. Die gewählte Fassung vermeidet die unbegründete Aussage, ein äußerer Handelnder habe Abraham getrennt.
- issue: Kollektiver oder individueller Sinn von σπέρμα
  choice: deinen Nachkommen
  alternative: deinem Samen
  rationale: Der unmittelbare Zusammenhang spricht kollektiv von Abrahams Nachkommenschaft. Die Übersetzung legt keine weitergehende christologische oder konfessionelle Deutung in den Wortlaut hinein; die wörtliche Singularform wird in der Fußnote vermerkt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die Satzstellung bleibt nahe am griechischen Gedankengang, ohne unnatürliche Gräzismen zu übernehmen. Das konkrete Richtungsbild „zum Meer“ bleibt im Haupttext erhalten.
