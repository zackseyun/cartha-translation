id: 1CLEM.10.6
reference: 1 Clement 10:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: de
  text: 'Und wieder sagt er: „Gott führte Abraham hinaus und sprach zu ihm: ›Blicke zum Himmel auf und zähle die Sterne, wenn du sie zählen kannst. So zahlreich werden deine Nachkommen sein.‹ Abraham aber glaubte Gott, und das wurde ihm als Gerechtigkeit angerechnet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνάβλεψον
  choice: Blicke ... auf
  rationale: Gibt den nach oben zum Himmel gerichteten Blick natürlich und präzise wieder.
- source_word: τὸ σπέρμα σου
  choice: deine Nachkommen
  rationale: σπέρμα ist hier kollektiv gebraucht. „Nachkommen“ ist im modernen Deutschen natürlich und bewahrt den Bezug auf Abrahams künftige Abstammung.
- source_word: ἐλογίσθη αὐτῷ
  choice: wurde ihm ... angerechnet
  rationale: Das passive λογίζομαι bezeichnet hier ein Zurechnen beziehungsweise Anrechnen und wird mit einer etablierten, verständlichen deutschen Wendung wiedergegeben.
- source_word: εἰς δικαιοσύνην
  choice: als Gerechtigkeit
  rationale: „Als Gerechtigkeit“ gibt die prädikative Bedeutung im Zusammenhang idiomatisch wieder, ohne die theologische Aussage weiter auszudeuten.
theological_decisions:
- issue: Umfang des Schriftzitats
  choice: Die gesamte Aussage bis einschließlich der Anrechnung als Gerechtigkeit steht innerhalb des äußeren Zitats.
  alternative: Das äußere Zitat nach Gottes direkter Rede beenden und den letzten Satz als Erzählung Clements darstellen.
  rationale: καὶ πάλιν λέγει führt das fortlaufende Zitat aus Genesis 15,5–6 ein; der Satz über Abrahams Glauben gehört noch dazu.
- issue: Kollektivsingular σπέρμα
  choice: Nachkommen
  alternative: Same
  rationale: „Nachkommen“ bewahrt den kollektiven Sinn in natürlichem Gegenwartsdeutsch; „Same“ wäre zwar formnäher, klingt hier jedoch altertümlich und kann missverständlich sein.
- issue: Verhältnis von Glaube und Gerechtigkeit
  choice: glaubte Gott ... als Gerechtigkeit angerechnet
  alternative: glaubte an Gott ... zur Gerechtigkeit gerechnet
  rationale: Der Dativ τῷ θεῷ bezeichnet, wem Abraham glaubte, nicht ausdrücklich den abstrakten Glauben an Gottes Existenz. Die Formulierung wahrt zudem die Aussage des Textes, ohne eine konfessionelle Rechtfertigungslehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gestufte direkte Rede wird durch deutsche doppelte und einfache Anführungszeichen kenntlich gemacht. „So zahlreich“ macht den im Sternenvergleich vorausgesetzten quantitativen Sinn natürlich deutlich.
