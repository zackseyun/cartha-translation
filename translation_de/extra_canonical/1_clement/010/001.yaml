id: 1CLEM.10.1
reference: 1 Clement 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: de
  text: Abraham, der »Freund« genannt wurde, erwies sich als treu, indem er den Worten Gottes gehorsam wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als er den Worten Gottes gehorsam wurde«; auch: »dadurch, dass er den Worten Gottes gehorsam wurde«.'
    reason: Die griechische Konstruktion ἐν τῷ mit Infinitiv kann hier einen begleitenden Umstand oder das Mittel seiner erwiesenen Treue bezeichnen.
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  choice: der »Freund« genannt wurde
  rationale: Gibt die Benennung sachlich wieder, ohne das im Griechischen nicht ausdrücklich genannte »Gottes« zu ergänzen; die Anführungszeichen kennzeichnen »Freund« als verliehenen Titel.
- source_word: πιστὸς εὑρέθη
  choice: erwies sich als treu
  rationale: Natürliches modernes Deutsch für das semitisch geprägte »wurde treu befunden«; der Gedanke einer bestätigten bzw. sichtbar gewordenen Treue bleibt erhalten.
- source_word: ὑπήκοον γενέσθαι
  choice: gehorsam wurde
  rationale: Bewahrt den ingressiven Sinn von γενέσθαι und gibt ὑπήκοος unmittelbar mit »gehorsam« wieder.
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: den Worten Gottes
  rationale: Entspricht dem Plural ῥήματα und wahrt den Bezug auf Gottes einzelne Äußerungen bzw. Weisungen.
theological_decisions:
- issue: Bezeichnung Abrahams als »Freund«
  choice: Das Bezugswort »Gottes« wird nicht in den Haupttext ergänzt.
  alternative: der »Freund Gottes« genannt wurde
  rationale: Obwohl der traditionsgeschichtliche Bezug den Freund Gottes meint, steht θεοῦ bei dieser Bezeichnung im griechischen Satz nicht ausdrücklich; die knappe Form bewahrt die Gestalt der Quelle.
- issue: Verhältnis zwischen Abrahams Treue und seinem Gehorsam
  choice: indem er
  alternative: dadurch, dass er / als er
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv kann Mittel, Begründungsnähe oder begleitenden Umstand ausdrücken. »Indem« hält Mittel und Umstand zusammen, ohne eine streng kausale Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erwies sich als treu« vermeidet das im Deutschen schwerfällige »wurde als treu befunden«, ohne den Aussagegehalt zu verändern. Die Satzstruktur bleibt nah am griechischen Ausgangstext.
