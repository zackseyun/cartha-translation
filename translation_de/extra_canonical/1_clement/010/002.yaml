  text: οὗτος δὲ ὑπακοῇ ἐξῆλθεν ἐκ τῆς γῆς αὐτοῦ καὶ ἐκ τῆς συγγενείας αὐτοῦ καὶ ἐκ τοῦ οἴκου τοῦ πατρὸς αὐτοῦ, ὅπως γῆν ὀλίγην καὶ συγγένειαν ἀσθενῆ καὶ οἶκον μικρὸν καταλιπὼν κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ. λέγει γὰρ αὐτῷ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: de
  text: 'Dieser aber verließ im Gehorsam sein Land, seine Verwandtschaft und das Haus seines Vaters. Er ließ wenig Land, eine schwache Verwandtschaft und ein kleines Haus zurück, um die Verheißungen Gottes zu erben. Denn Gott sagt zu ihm:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: im Gehorsam
  rationale: Gibt den instrumentalen beziehungsweise modalen Dativ knapp und idiomatisch wieder.
- source_word: συγγένεια
  choice: Verwandtschaft
  rationale: Bewahrt in beiden Vorkommen denselben Bezug auf den Verwandtschaftsverband.
- source_word: ἀσθενῆ
  choice: schwach
  rationale: Erhält die wertende Gegenüberstellung zwischen Abrahams bescheidenem Ausgangspunkt und Gottes Verheißungen.
- source_word: οἶκον μικρόν
  choice: ein unbedeutendes Haus
  rationale: Im Zusammenhang bezeichnet οἶκος wahrscheinlich nicht nur ein Gebäude, sondern Hausstand beziehungsweise Sippe; „unbedeutend“ vermittelt die geringe Stellung natürlich, ohne den Begriff auf die Gebäudegröße zu verengen.
- source_word: κληρονομήσῃ
  choice: zu erben
  rationale: Bewahrt die Erbschaftssprache des griechischen Verbs.
- source_word: λέγει γὰρ αὐτῷ
  choice: Denn Gott sagt zu ihm
  rationale: Das im Verb enthaltene Subjekt wird aus dem unmittelbar zuvor genannten θεός erschlossen; die explizite Nennung verhindert im Deutschen einen unklaren Subjektwechsel.
theological_decisions:
- issue: Verhältnis von Gehorsam und Verheißung
  choice: „im Gehorsam“ und „um ... zu erben“
  alternative: eine kausale Formulierung wie „weil er gehorchte, verdiente er“
  rationale: Der Text verbindet Abrahams Auszug mit Gehorsam und dem Erben der Verheißungen, sagt jedoch nicht, dass er sie verdiente. Die Übersetzung wahrt diese Spannung.
- issue: Tempus von λέγει
  choice: „sagt“
  alternative: „sagte“
  rationale: Das historische Präsens wird beibehalten und leitet das folgende Schriftzitat lebendig ein.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die lange griechische Periode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die dreifache Gegenüberstellung von Land, Verwandtschaft und Haus bleibt erhalten.
