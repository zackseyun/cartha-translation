  to: Die Großen können ohne die Kleinen nicht bestehen, ebenso wenig die Kleinen ohne die Großen. In allen Dingen gibt es eine gewisse Mischung, und darin liegt Nutzen.[a]
  rationale: „Mischung“ gibt σύγκρασις unmittelbarer wieder als „Verbindung“. Die Formulierung „darin liegt Nutzen“ ist im Deutschen idiomatisch und bewahrt angesichts des vorangehenden pluralischen Bezugs die im griechischen ἐν τούτοις vorhandene referenzielle Offenheit; die Fußnote macht die Pluralform ausdrücklich sichtbar.
