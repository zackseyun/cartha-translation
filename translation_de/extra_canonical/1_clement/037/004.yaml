  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: de
  text: Die Großen können ohne die Kleinen nicht bestehen, ebenso wenig die Kleinen ohne die Großen. In allen Dingen gibt es eine gewisse Mischung, und darin liegt Nutzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „in diesen“ steht im Plural; es kann sich auf alle Dinge oder auf die Großen und die Kleinen beziehen.
    reason: Bewahrt die pluralische Form von ἐν τούτοις und erläutert den nicht völlig eindeutigen Bezug.
lexical_decisions:
- source_word: δίχα
  choice: ohne
  rationale: Gibt die Bedeutung „getrennt von, ohne“ in diesem Zusammenhang natürlich und präzise wieder.
- source_word: σύγκρασίς
  choice: Verbindung
  rationale: Bezeichnet hier eine Zusammenfügung oder Vermischung verschiedener Teile; „Verbindung“ ist im Deutschen verständlich, ohne die Bildsprache unnötig festzulegen.
- source_word: χρῆσις
  choice: Nutzen
  rationale: Gibt den Gedanken der Nützlichkeit beziehungsweise Brauchbarkeit knapp und idiomatisch wieder.
- source_word: ἐν τούτοις
  choice: in ihnen
  rationale: Bewahrt den Plural des griechischen Demonstrativpronomens und lässt dessen möglichen Bezug offen.
theological_decisions:
- issue: Bezug von ἐν τούτοις
  choice: Das pluralische „in ihnen“ bewahrt die Offenheit des Bezugs.
  alternative: „darin“ oder „in dieser Verbindung“
  rationale: Der griechische Ausdruck steht im Plural und kann sich auf „alle Dinge“ oder auf die Großen und die Kleinen beziehen; eine singularische Wiedergabe würde diese Mehrdeutigkeit einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten; „ebenso wenig“ vermeidet eine schwerfällige Wiederholung.
