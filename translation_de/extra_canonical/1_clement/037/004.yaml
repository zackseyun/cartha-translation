  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. Die Wiederholung von „in“ in „In allen Dingen ... und in ihnen“ wirkt leicht schwerfällig. „Dabei ist beides von Nutzen“ gibt den Zusammenhang natürlich wieder, legt den umstrittenen Bezug aber stärker auf die beiden Gruppen fest.
  terminology: „Großen“ und „Kleinen“ bewahren die antithetische, allgemeine Ausdrucksweise. Für σύγκρασις ist „Mischung“ die nähere und zugleich verständliche Entsprechung. χρῆσις kann hier idiomatisch als „Nutzen“ stehen.
