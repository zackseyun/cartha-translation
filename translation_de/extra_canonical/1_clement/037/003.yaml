    rationale: „Nicht alle sind Präfekten, nicht alle Befehlshaber ...“ ist im Deutschen elliptisch und lässt die Aufzählung weniger klar erkennen. Das Griechische nennt nach οὐ πάντες εἰσὶν eine Reihe von Rangbezeichnungen.
  - severity: low
    issue: „den Führenden“ ist als Personenbezeichnung weniger idiomatisch
    rationale: Die substantivierte Form ist möglich, klingt hier aber steif. „den Vorgesetzten“ gibt die übergeordnete leitende Funktion von ἡγούμενοι im dargestellten Befehlsgefüge natürlich wieder.
