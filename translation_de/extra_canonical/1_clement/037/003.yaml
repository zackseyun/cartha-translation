  verdict: revise
  source_fidelity: Die Rangfolge ἔπαρχοι, χιλίαρχοι, ἑκατόνταρχοι und πεντηκόνταρχοι sowie der Gegensatz zur Pflichterfüllung im eigenen τάγμα werden grundsätzlich zutreffend wiedergegeben. Die Wiederholung von „nicht alle“ vor der gesamten folgenden Rangreihe verwischt jedoch die griechische koordinierte Aufzählung. „Vorgesetzten“ gibt τῶν ἡγουμένων im militärisch-administrativen Bild idiomatischer wieder als „den Führenden“, ohne es auf ein bestimmtes Amt festzulegen.
  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. „Tausendführer“, „Hundertführer“ und „Fünfzigführer“ bilden die griechische Zahlenreihe knapp, verständlich und parallel ab. „Und so weiter in der Rangfolge“ ist eine natürliche Wiedergabe von τὸ καθεξῆς.
  terminology: „Präfekten“ ist für ἔπαρχοι als historisch geprägte Rangbezeichnung vertretbar. Die transparenten Bildungen für die folgenden Ränge erhalten die hierarchische Struktur. „Rang“ für τάγμα ist im Kontext angemessen; „Vorgesetzten“ für ἡγουμένων bleibt weiter als ein spezifischer militärischer Dienstgrad.
