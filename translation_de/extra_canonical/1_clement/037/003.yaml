id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: de
  text: Nicht alle sind Präfekten, Tausendführer, Hundertführer, Fünfzigführer und so weiter in der Rangfolge; vielmehr führt jeder in seinem eigenen Rang aus, was ihm vom König und von den Vorgesetzten befohlen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  choice: Präfekten
  rationale: Der historische Amtstitel wahrt den Rangcharakter im militärischen Vergleich; „Statthalter“ wäre möglich, passt aber weniger gut zur anschließenden militärischen Rangfolge.
- source_word: χιλίαρχοι / ἑκατόνταρχοι / πεντηκόνταρχοι
  choice: Befehlshaber über tausend / hundert / fünfzig Mann
  rationale: Die transparenten deutschen Funktionsbezeichnungen geben die abgestufte Zahlenfolge verständlich wieder, ohne durch weniger geläufige Fremdwörter wie „Chiliarchen“ die Aussage zu verdunkeln.
- source_word: τὸ καθεξῆς
  choice: und so weiter in der Rangfolge
  rationale: Die Wendung bezeichnet das in geordneter Folge Anschließende; die Übersetzung bewahrt sowohl den Gedanken der Fortsetzung als auch den der Rangordnung.
- source_word: τάγματι
  choice: Rang
  rationale: Im militärischen Bild kann das Wort eine zugewiesene Stellung oder Ordnung bezeichnen. „Rang“ ist hier natürlich und entspricht der hierarchischen Aussage.
- source_word: τῶν ἡγουμένων
  choice: den Führenden
  rationale: Die substantivierte Partizipialform bezeichnet allgemein diejenigen, die führen. Die Wiedergabe vermeidet die nicht ausdrücklich festgelegte Einengung auf militärische „Befehlshaber“.
theological_decisions:
- issue: Verhältnis des Einzelnen zur geordneten Autorität
  choice: Die militärische Rangordnung und das Ausführen erteilter Befehle werden ohne zusätzliche kirchenamtliche Deutung wiedergegeben.
  alternative: Die Führenden ausdrücklich als kirchliche Leiter oder Amtsträger bezeichnen.
  rationale: Der Vers entfaltet zunächst ein militärisches Vergleichsbild. Eine unmittelbare Identifizierung einzelner Ränge mit kirchlichen Ämtern wäre eine über den griechischen Wortlaut hinausgehende Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „nicht alle“ macht die griechische Reihung im Deutschen klar, während „vielmehr“ den Gegensatz von Rangverschiedenheit und gemeinsamer Pflichterfüllung deutlich markiert.
