reference: 1 Clement 37:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: de
  text: 'Nehmen wir unseren Körper als Beispiel: Der Kopf ist ohne die Füße nichts, ebenso sind die Füße ohne den Kopf nichts. Selbst die kleinsten Glieder unseres Körpers sind für den ganzen Körper notwendig und nützlich. Doch alle atmen gemeinsam und üben eine einzige Unterordnung aus, damit der ganze Körper bewahrt wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: Nehmen wir unseren Körper als Beispiel
  rationale: Der griechische Aufforderungssatz lautet wörtlich „Nehmen wir unseren Körper“; „als Beispiel“ macht seine argumentative Funktion im Deutschen natürlich deutlich.
- source_word: δίχα
  choice: ohne
  rationale: Gibt die Bedeutung „getrennt von/ohne“ in diesem Zusammenhang knapp und idiomatisch wieder.
- source_word: τὰ ἐλάχιστα μέλη
  choice: selbst die kleinsten Glieder
  rationale: „Glieder“ wahrt die Körpermetapher; „selbst“ bringt die hervorhebende Wirkung der Wendung natürlich zum Ausdruck.
- source_word: συνεπνεῖ
  choice: atmen gemeinsam
  rationale: Bewahrt das auffällige Bild des gemeinsamen Atmens, statt es interpretierend zu „wirken harmonisch zusammen“ abzuschwächen.
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: ordnen sich ein und derselben Ordnung unter
  rationale: χράομαι mit einem Abstraktum bezeichnet das Praktizieren bzw. Befolgen; die Formulierung vermittelt die gemeinsame Unterordnung idiomatisch, ohne das mechanische „eine Unterordnung benutzen“.
- source_word: εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα
  choice: damit der ganze Körper bewahrt wird
  rationale: Die Zweckkonstruktion wird als deutscher Finalsatz wiedergegeben; „bewahrt“ lässt den Sinn von σῴζω offen zwischen Erhaltung und Rettung.
theological_decisions:
- issue: Bedeutung von ὑποταγή im Körperbild
  choice: ein und derselben Ordnung unterordnen
  alternative: denselben Gehorsam üben
  rationale: „Ordnung“ passt zum organischen Körperbild und vermeidet, den Ausdruck vorschnell auf persönlichen Gehorsam gegenüber einer bestimmten Autorität festzulegen; die Unterordnung bleibt ausdrücklich erhalten.
- issue: Metaphorik von συνεπνεῖ
  choice: gemeinsam atmen
  alternative: einträchtig zusammenwirken
  rationale: Die konkrete, ungewöhnliche Metapher des griechischen Textes wird bewahrt und nicht als bloße Harmonie paraphrasiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Körpermetapher und das auffällige „gemeinsam atmen“ bleiben erhalten; der letzte Satz wird idiomatisch formuliert, ohne seine semantische Spannung unnötig aufzulösen.
