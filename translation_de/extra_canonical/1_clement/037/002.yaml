source:
  edition: Funk 1901 (normalized OCR)
  text: κατανοήσωμεν τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν, πῶς εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως ἐπιτελοῦσιν τὰ διατασσόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: de
  text: 'Betrachten wir die, die unter unseren Befehlshabern als Soldaten dienen: wie geordnet, wie gehorsam und wie unterwürfig sie das Angeordnete ausführen!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: Betrachten wir
  rationale: Der auffordernde Aorist Konjunktiv wird als gemeinschaftlicher Imperativ wiedergegeben.
- source_word: τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν
  choice: die, die unter unseren Befehlshabern als Soldaten dienen
  rationale: Bewahrt den militärischen Sinn von στρατεύομαι und gibt τοῖς ἡγουμένοις im Kontext natürlich als Unterstellung unter Befehlshaber wieder.
- source_word: εὐτάκτως
  choice: mit welcher Ordnung
  rationale: Bezeichnet geordnetes, diszipliniertes Handeln; die nominale Fassung ermöglicht im Deutschen eine natürliche dreigliedrige Reihe.
- source_word: εἰκτικῶς
  choice: Fügsamkeit
  rationale: Das seltene Adverb bezeichnet nachgiebiges, bereitwillig folgsames Verhalten, nicht bloß Schnelligkeit oder Bereitschaft.
- source_word: ὑποτεταγμένως
  choice: Unterordnung
  rationale: Gibt den Gedanken des Unterstelltseins eng wieder und bewahrt die bewusste Nähe zu Fügsamkeit.
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: führen sie das Angeordnete aus
  rationale: Bildet sowohl das vollständige Ausführen als auch den passivischen Sinn dessen, was angeordnet wurde, präzise ab.
theological_decisions:
- issue: Verhältnis von Fügsamkeit und Unterordnung
  choice: Beide Begriffe werden als eigene Glieder der Reihe beibehalten.
  alternative: Die beiden nahezu synonymen Begriffe zu „Gehorsam“ zusammenzuziehen.
  rationale: Der griechische Text setzt εἰκτικῶς und ὑποτεταγμένως bewusst nebeneinander; ihre rhetorische und begriffliche Spannung soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte griechische πῶς-Reihe wird durch „Mit welcher …“ als rhetorische Dreierfigur natürlich nachgebildet; der abschließende Ausruf macht ihren bewundernden Charakter sichtbar.
