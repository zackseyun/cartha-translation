    text: 'Oder: „willig“; auch „nachgiebig“.'
    reason: εἰκτικῶς ist selten und kann folgsames Nachgeben ebenso wie williges Einwilligen bezeichnen.
  revision_rationale: Die Revision stellt die adverbiale Dreierfigur des griechischen πῶς … πῶς … πῶς wieder her und ersetzt die im Deutschen semantisch missverständliche Wendung „mit welcher Ordnung“ durch „wie geordnet“. Die militärische Bildsprache und die Unterscheidung der beiden letzten Glieder bleiben erhalten.
