review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den militärischen Vergleich, den Aufforderungscharakter von κατανοήσωμεν und das Ausführen der Befehle grundsätzlich gut. Die drei πῶς-Adverbien beschreiben jedoch die Art des Ausführens. „Mit welcher Ordnung“ bezeichnet im Deutschen eher eine konkrete Ordnung bzw. Anordnung als die Weise „geordnet“ zu handeln und verwischt daher εὐτάκτως.
  naturalness: „Wie geordnet, wie gehorsam und wie unterwürfig sie das Angeordnete ausführen“ bildet die rhetorische Dreierreihe klar und idiomatisch nach. Die Wiederholung von „wie“ gibt die anaphorische Struktur des Griechischen genauer wieder als eine bloße Nominalreihe.
  terminology: „Befehlshaber“ und „Angeordnete“ sind im militärischen Kontext angemessen. „Gehorsam“ für εἰκτικῶς und „unterwürfig“ für ὑποτεταγμένως halten die beiden eng verwandten, aber nicht identischen Glieder der Reihe getrennt. Die Fußnote wahrt die lexikalische Unsicherheit des seltenen εἰκτικῶς.
  issues:
  - severity: medium
    issue: „Mit welcher Ordnung“ gibt εὐτάκτως nicht präzise wieder.
    rationale: Die griechische Form ist ein Adverb und beschreibt, wie die Soldaten Befehle ausführen. Im Deutschen bedeutet „mit welcher Ordnung“ gewöhnlich „nach welchem Ordnungsprinzip“ oder „mit welcher (konkreten) Ordnung“, nicht „wie geordnet“.
  - severity: low
    issue: Die Fußnotenalternative ist nicht an die neue adverbiale/attributive Satzgestaltung angepasst.
    rationale: Bei einer Wiedergabe mit Adjektiven sind nominale Alternativen wie „Bereitwilligkeit“ weniger unmittelbar anschließbar; „willig“ und „nachgiebig“ sind passende Alternativen.
  revised_text: 'Betrachten wir die, die unter unseren Befehlshabern als Soldaten dienen: wie geordnet, wie gehorsam und wie unterwürfig sie das Angeordnete ausführen!'
  revised_footnotes:
