  source_fidelity: Die Übersetzung gibt Στρατευώμεθα zutreffend als Dienst im soldatischen Bild wieder. „mit allem Eifer“ trifft μετὰ πάσης ἐκτενείας angemessen, und „unter seinen untadeligen Befehlen“ bewahrt sowohl die militärische Metaphorik als auch die pronominale Kontextabhängigkeit von αὐτοῦ. Die nicht weiter aufgelöste Anrede „Brüder“ ist für ἄνδρες ἀδελφοί sachgerecht.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch mit würdigem Register. Die Stellung von „als Soldaten“ und „unter seinen untadeligen Befehlen“ ist idiomatisch und erhält den Nachdruck des Ausgangstextes.
  terminology: „als Soldaten dienen“ entspricht dem Bildfeld von στρατεύομαι. „untadelig“ ist eine präzise, im religiös-ethischen Register natürliche Wiedergabe von ἀμώμος. Der Bezug von „seinen“ wird zu Recht nicht dogmatisch spezifiziert.
