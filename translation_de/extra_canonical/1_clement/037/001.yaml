source:
  edition: Funk 1901 (normalized OCR)
  text: Στρατευώμεϑα οὖν, ἄνδρες ἀδελφοί, μετὰ πάσης ἐκτενείας ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/001.yaml
  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: de
  text: Lasst uns also, Brüder, mit allem Eifer als Soldaten unter seinen untadeligen Befehlen dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεθα
  choice: Lasst uns … als Soldaten … dienen
  rationale: Das Verb bezeichnet den Dienst als Soldat beziehungsweise das Kämpfen im Heeresdienst. Die Formulierung bewahrt das militärische Bild und klingt zugleich natürlich.
- source_word: ἄνδρες ἀδελφοί
  choice: Brüder
  rationale: Die feste Anrede meint hier die Angehörigen der Gemeinschaft; das deutsche „Brüder“ gibt sie knapp und würdig wieder, ohne das im Deutschen unnötige „Männer“ zu verdoppeln.
- source_word: μετὰ πάσης ἐκτενείας
  choice: mit allem Eifer
  rationale: ἐκτένεια bezeichnet angespannte, beharrliche Ernsthaftigkeit beziehungsweise eifrigen Einsatz.
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: unter seinen untadeligen Befehlen
  rationale: Im militärischen Zusammenhang gibt „unter … Befehlen“ die durch ἐν bezeichnete Sphäre des Dienstes idiomatisch wieder; ἀμώμοις bedeutet ohne Tadel oder Makel.
theological_decisions:
- issue: Bezug des Pronomens αὐτοῦ („seinen“)
  choice: Das Pronomen bleibt im Text unaufgelöst.
  alternative: „unter Gottes/Christi untadeligen Befehlen“
  rationale: Der einzelne Vers nennt den Bezugsträger nicht ausdrücklich. Eine Ergänzung würde die im Griechischen bestehende Kontextabhängigkeit unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Das militärische Leitbild des griechischen Satzes bleibt deutlich erhalten; die inklusive Auslegung der historischen Anrede wird nicht durch eine erklärende Erweiterung in den Haupttext eingetragen.
