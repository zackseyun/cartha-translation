source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: de
  text: 'Denn es steht geschrieben: »Geht für eine ganz kurze Zeit in eure Kammern, bis mein Zorn und mein Grimm vorübergehen, und ich werde eines guten Tages gedenken und euch aus euren Gräbern auferwecken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: Kammern
  rationale: Bezeichnet abgeschlossene, private Räume; »Kammern« gibt den Ausdruck direkt wieder, ohne das im Griechischen nicht ausdrücklich vorhandene »inneren« hinzuzufügen.
- source_word: μικρὸν ὅσον ὅσον
  choice: für eine ganz kurze Zeit
  rationale: Die emphatische Wendung bezeichnet eine äußerst kurze Dauer und wird in natürlichem Deutsch entsprechend verstärkt wiedergegeben.
- source_word: ἡ ὀργὴ καὶ ὁ θυμός μου
  choice: mein Zorn und mein Grimm
  rationale: Bewahrt die zwei parallelen Begriffe und ihre gesteigerte affektive Färbung, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: μνησθήσομαι ἡμέρας ἀγαθῆς
  choice: werde ich eines guten Tages gedenken
  rationale: Erhält die ungewöhnliche und möglicherweise absichtlich offene Formulierung des griechischen Textes, statt sie erklärend umzudeuten.
- source_word: ἀναστήσω
  choice: auferwecken
  rationale: Im Zusammenhang mit dem Hervorbringen aus Gräbern bezeichnet das Verb das Auferwecken der Toten.
- source_word: θηκῶν
  choice: Gräbern
  rationale: Obwohl θήκη allgemein einen Behälter oder Aufbewahrungsort bezeichnen kann, verlangt der Auferstehungskontext hier die Bedeutung »Gräber«.
theological_decisions:
- issue: Verhältnis von göttlichem Zorn, Gedenken und Auferweckung
  choice: 'Die Abfolge wird ohne zusätzliche Erklärung beibehalten: Der Zorn geht vorüber, Gott gedenkt eines guten Tages und weckt aus den Gräbern auf.'
  alternative: Das Gedenken als ausdrücklichen Heilsbeschluss oder den »guten Tag« als fest bestimmten Auferstehungstag auslegen.
  rationale: Der griechische Wortlaut lässt Bedeutung und Bezug von »eines guten Tages« offen; eine dogmatische Präzisierung würde diese echte Spannung auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit zitathaftem Klang. Die direkte Rede bleibt eng am griechischen Wortlaut; das etwas ungewöhnliche »eines guten Tages gedenken« wird bewusst nicht geglättet.
