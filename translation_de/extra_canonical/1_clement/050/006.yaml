source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: de
  text: 'Denn es steht geschrieben[a]: „Glücklich sind die, deren Gesetzlosigkeiten vergeben und deren Sünden bedeckt sind. Glücklich ist der Mann, dem der Herr die Sünde niemals anrechnen wird und in dessen Mund kein Trug ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deren Gesetzlosigkeiten vergeben und deren Sünden bedeckt wurden“.'
    reason: Die griechischen Aoristformen können formal als Vergangenheit wiedergegeben werden; im Zusammenhang der Seligpreisung bezeichnen sie jedoch wahrscheinlich einen fortbestehenden Zustand.
lexical_decisions:
- source_word: Μακάριοι / μακάριος
  choice: Glücklich sind / Glücklich ist
  rationale: Gibt die Seligpreisungsformel in natürlichem, heutigem Deutsch wieder, ohne ihren feststellenden Charakter abzuschwächen.
- source_word: ἀνομίαι
  choice: Gesetzlosigkeiten
  rationale: Bewahrt den Bezug auf Verstöße gegen Gottes Gesetz und unterscheidet den Ausdruck vom folgenden ἁμαρτίαι.
- source_word: ἀφέθησαν
  choice: vergeben sind
  rationale: Der griechische Aorist beschreibt in dieser Seligpreisung den bestehenden, allgemein gültigen Zustand der Vergebung; das deutsche Präsens mit Zustandspassiv gibt dies angemessen wieder.
- source_word: ἐπεκαλύφθησαν
  choice: zugedeckt sind
  rationale: Bewahrt das konkrete Bild des griechischen Verbs und zugleich den Gedanken, dass die Sünden nicht mehr belastend hervortreten.
- source_word: οὐ μὴ λογίσηται
  choice: keinesfalls anrechnet
  rationale: Die nachdrückliche griechische Verneinung wird ausdrücklich wiedergegeben; »anrechnen« erhält das forensisch-buchhalterische Bild von λογίζομαι.
- source_word: δόλος
  choice: Trug
  rationale: Ein würdiger und verständlicher Ausdruck für Täuschung oder Falschheit, der zur Psalmzitation passt.
theological_decisions:
- issue: Zeitbezug der Aoristformen ἀφέθησαν und ἐπεκαλύφθησαν
  choice: vergeben und zugedeckt sind
  alternative: vergeben und zugedeckt wurden
  rationale: Im Rahmen der Seligpreisung bezeichnen die Aoriste eine allgemeine Gruppe anhand ihres gegenwärtigen Zustands; die Übersetzung soll dies nicht auf ein bestimmtes vergangenes Ereignis beschränken.
- issue: Stärke der Verneinung οὐ μή
  choice: keinesfalls
  alternative: nicht
  rationale: Die emphatische Verneinung des griechischen Textes wird bewahrt, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Wiedergabe von ἀνήρ
  choice: Mann
  alternative: Mensch
  rationale: Die direkte lexikalische Bedeutung und die Einzelform der griechischen Psalmzitation bleiben erhalten; eine inklusive Verallgemeinerung wird nicht stillschweigend in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer Seligpreisungs- und Schriftzitationsform. Die Satzstruktur bleibt quellennah, ist aber im Deutschen flüssig; zentrale Bilder wie »zugedeckt«, »anrechnen« und »Trug« werden bewahrt.
