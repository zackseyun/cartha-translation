- from: 'Denn es steht geschrieben: „Glücklich sind die, deren Gesetzlosigkeiten vergeben und deren Sünden zugedeckt sind[a]. Glücklich ist der Mann, dem der Herr die Sünde keinesfalls anrechnet und in dessen Mund kein Trug ist.“'
  to: 'Denn es steht geschrieben[a]: „Glücklich sind die, deren Gesetzlosigkeiten vergeben und deren Sünden bedeckt sind. Glücklich ist der Mann, dem der Herr die Sünde niemals anrechnen wird und in dessen Mund kein Trug ist.“'
  rationale: Der Fußnotenanker wurde an die Einleitungsformel gesetzt, wie im englischen Audit Trail. Die Verneinung wurde mit „niemals ... wird“ genauer und idiomatisch wiedergegeben. „Bedeckt“ wahrt das griechische Bild bei natürlicherem deutschem Register.
