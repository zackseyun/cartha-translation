  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: de
  text: Seht, Geliebte, wie groß und wunderbar die Liebe ist! Ihre Vollkommenheit lässt sich nicht in Worte fassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Für ihre Vollkommenheit gibt es keine Beschreibung.« Auch möglich: »keine Darlegung«.'
    reason: Die idiomatische Haupttextfassung gibt die gemeinte Unmöglichkeit einer angemessenen sprachlichen Darstellung wieder; die Anmerkung dokumentiert die formal nähere Wiedergabe und die Bedeutungsspanne von ἐξήγησις.
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht
  rationale: Bewahrt den direkten, auffordernden Charakter des griechischen Imperativs.
- source_word: ἀγαπητοί
  choice: ihr Geliebten
  rationale: Gibt die persönliche Anrede substantiviert und würdevoll wieder.
- source_word: μέγα καὶ θαυμαστόν
  choice: groß und wunderbar
  rationale: Entspricht den beiden wertenden Adjektiven in natürlichem modernem Deutsch.
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die übliche und sachlich angemessene Wiedergabe von ἀγάπη.
- source_word: τῆς τελειότητος αὐτῆς
  choice: Ihre Vollkommenheit
  rationale: Bewahrt den Bezug des Pronomens auf die Liebe und gibt τελειότης als Vollkommenheit wieder.
- source_word: οὐκ ἔστιν ἐξήγησις
  choice: lässt sich nicht in Worte fassen
  rationale: Gibt idiomatisch den Gedanken wieder, dass keine angemessene sprachliche Darstellung oder Beschreibung möglich ist, ohne den modernen Sinn einer kausalen Erklärung einzutragen.
theological_decisions:
- issue: Reichweite der Aussage über die Vollkommenheit der Liebe
  choice: Als Unmöglichkeit angemessener sprachlicher Darstellung formuliert
  alternative: Für ihre Vollkommenheit gibt es keine Beschreibung/Erklärung
  rationale: ἐξήγησις bezeichnet hier am ehesten Darstellung, Darlegung oder Beschreibung. Die Formulierung wahrt die emphatische Aussage, ohne eine besondere Lehrdeutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt erhalten; der zweite Satz ist idiomatisch formuliert und vermeidet das im heutigen Deutsch missverständliche »Erklärung«.
