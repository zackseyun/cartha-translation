id: 1CLEM.50.7
reference: 1 Clement 50:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Diese Seligpreisung kam über diejenigen, die von Gott durch Jesus, den Messias, unseren Herrn, erwählt worden sind. Ihm sei die Herrlichkeit in alle Ewigkeit. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: Seligpreisung
  rationale: Bezeichnet hier den zuvor ausgesprochenen Zustand beziehungsweise Zuspruch des Seligseins; „Seligpreisung“ bewahrt den Bezug zum vorherigen Kontext besser als das allgemeinere „Segen“.
- source_word: ἐγένετο ἐπὶ
  choice: kam über
  rationale: Gibt die bildhafte griechische Wendung eng und zugleich idiomatisch wieder, ohne einen im Ausgangstext fehlenden Folgerungspartikel einzufügen.
- source_word: ἐκλελεγμένους
  choice: die … erwählt worden sind
  rationale: Das Perfektpartizip bezeichnet Menschen, die von Gott erwählt worden sind, mit fortbestehendem Ergebnis.
- source_word: Χριστοῦ
  choice: den Messias
  rationale: Gibt den Titel Χριστός in seiner Bedeutung wieder und lässt ihn als Titel neben dem Namen Jesus erkennbar.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: in alle Ewigkeit
  rationale: Eine natürliche, würdevolle deutsche Wiedergabe der verstärkten Ewigkeitsformel.
theological_decisions:
- issue: Beziehung von διὰ Ἰησοῦ Χριστοῦ
  choice: Die Erwählung geschieht von Gott durch Jesus, den Messias.
  alternative: Die Seligpreisung kommt durch Jesus, den Messias, über die von Gott Erwählten.
  rationale: Die unmittelbare Stellung nach ὑπὸ τοῦ θεοῦ legt nahe, dass die ganze Fügung „von Gott durch Jesus Christus“ zur Erwählung gehört; die griechische Wortstellung lässt jedoch eine gewisse syntaktische Offenheit.
- issue: Bezugswort von ᾧ
  choice: „Ihm“ bezieht sich auf Jesus, den Messias, unseren Herrn.
  alternative: „Ihm“ könnte auf Gott bezogen werden.
  rationale: Das Relativpronomen folgt unmittelbar auf „unseren Herrn“ und stimmt mit dem maskulinen Dativ überein; zugleich bleibt die formale Möglichkeit eines Bezugs auf Gott bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem griechischen Gedankengang nahe, wird aber für heutige Leser durch einen Relativsatz und einen neuen Satz vor der Doxologie geglättet.
