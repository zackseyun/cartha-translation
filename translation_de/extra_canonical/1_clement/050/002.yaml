source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: de
  text: Wer ist imstande, in ihr gefunden zu werden, außer denjenigen, die Gott für würdig erachtet? Darum wollen wir beten und von seiner Barmherzigkeit erbitten, dass wir in Liebe gefunden werden, ohne menschliche Parteilichkeit, untadelig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: imstande
  rationale: Gibt die Fähigkeit beziehungsweise das Genügen natürlich wieder, ohne eine besondere geistliche Würdigkeit bereits in das Wort hineinzulesen.
- source_word: καταξιώσῃ
  choice: für würdig erachtet
  rationale: Bewahrt den Gedanken, dass Gott Menschen als würdig ansieht beziehungsweise würdigt, und erhält durch den deutschen Indikativ die offene Nuance des griechischen Konjunktivs im Relativsatz.
- source_word: δεηθῶμεν
  choice: wollen wir beten
  rationale: Gibt die hortative Form und den Gebetscharakter des Verbs in natürlichem, würdigem Deutsch wieder.
- source_word: αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ
  choice: von seiner Barmherzigkeit erbitten
  rationale: Erhält die ungewöhnliche personale beziehungsweise bildhafte Formulierung, wonach die Bitte an Gottes Barmherzigkeit gerichtet ist.
- source_word: ἀγάπῃ
  choice: Liebe
  rationale: Der unmittelbare Kontext handelt von der Liebe; die geläufige deutsche Entsprechung wahrt die theologische Weite des Begriffs.
- source_word: δίχα προσκλίσεως ἀνθρωπίνης
  choice: frei von menschlicher Parteilichkeit
  rationale: πρόσκλισις bezeichnet eine menschlich bedingte Neigung oder Begünstigung; „Parteilichkeit“ macht den ethischen Sinn verständlich.
- source_word: ἄμωμοι
  choice: ohne Tadel
  rationale: Gibt die moralisch-kultische Bedeutung von „untadelig, makellos“ in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Göttliches Würdigen und menschliche Fähigkeit
  choice: „außer denen, die Gott für würdig erachtet“
  alternative: „außer denen, die Gott würdig macht“
  rationale: καταξιόω kann das Würdigerachten oder Würdigen ausdrücken. Die gewählte Fassung folgt dem näheren lexikalischen Sinn, ohne zu entscheiden, ob damit nur Gottes Urteil oder auch sein befähigendes Handeln gemeint ist.
- issue: Bedeutung von „in ihr“
  choice: Das feminine Pronomen bleibt als „in ihr“ stehen.
  alternative: Explizite Wiederholung von „in der Liebe“
  rationale: αὐτῇ verweist im Zusammenhang sehr wahrscheinlich auf die Liebe, doch die pronominale Form des Ausgangstextes wird bewahrt und nicht erklärend ersetzt.
- issue: Verhältnis von Parteilichkeit und Tadellosigkeit
  choice: „frei von menschlicher Parteilichkeit und ohne Tadel“
  alternative: „ohne menschliche Parteilichkeit, untadelig“
  rationale: Das verbindende „und“ macht die deutsche Satzstruktur lesbar, ohne eindeutig festzulegen, ob ἄμωμοι die ganze Bitte zusammenfasst oder speziell die Abwesenheit von Parteilichkeit näher bestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die anschließende gemeinschaftliche Aufforderung zum Gebet bleiben erhalten. Keine konfessionell geprägte Terminologie; die leichte Fremdheit von „von seiner Barmherzigkeit erbitten“ bewahrt das Bild des griechischen Textes.
