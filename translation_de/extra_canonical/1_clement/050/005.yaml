id: 1CLEM.50.5
reference: 1 Clement 50:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: de
  text: Selig sind wir, ihr Geliebten, wenn wir Gottes Gebote in der Einmütigkeit der Liebe erfüllen, damit uns durch die Liebe unsere Sünden vergeben werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass uns durch die Liebe unsere Sünden vergeben werden“; das griechische εἰς τό mit Infinitiv kann hier Zweck oder Folge bezeichnen.'
    reason: Bewahrt die mögliche konsekutive Nuance von εἰς τό + Infinitiv als tatsächlich unterscheidbare Alternative zur finalen Wiedergabe im Haupttext.
lexical_decisions:
- source_word: μακάριοι
  choice: selig
  rationale: Gibt die religiös geprägte Glückseligpreisung des griechischen Ausdrucks würdig und knapp wieder.
- source_word: ἀγαπητοί
  choice: ihr Geliebten
  rationale: Bewahrt die direkte, von Liebe geprägte Anrede; die Ergänzung „ihr“ entspricht natürlichem deutschem Sprachgebrauch.
- source_word: προστάγματα
  choice: Gebote
  rationale: Bezeichnet hier verbindliche göttliche Anordnungen; „Gebote“ ist im Deutschen klar und kontextgemäß.
- source_word: ἐποιούμεν
  choice: erfüllen
  rationale: Gibt das tätige Befolgen der Gebote idiomatisch wieder, ohne den Sinn auf bloßes Hören oder Bewahren zu verengen.
- source_word: ὁμονοίᾳ
  choice: Einmütigkeit
  rationale: Bewahrt den Gedanken des gemeinsamen Sinnes und der Eintracht und unterscheidet den Begriff von bloßer emotionaler Harmonie.
- source_word: ἀγάπης / δι’ ἀγάπης
  choice: der Liebe / durch die Liebe
  rationale: Die Wiederholung von ἀγάπη wird erhalten, da sie die Aussage inhaltlich und rhetorisch prägt.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Die übliche und sachlich genaue Wiedergabe im religiös-ethischen Zusammenhang.
theological_decisions:
- issue: Verhältnis von Gebotserfüllung, Liebe und Sündenvergebung
  choice: Die Zweck- bzw. Folgebeziehung des griechischen εἰς τὸ wird wörtlich erkennbar gelassen, ohne ein vollständiges Heilsmodell daraus abzuleiten.
  alternative: 'Die Aussage kausal zuspitzen, etwa: „weil wir durch Liebe Vergebung verdienen“.'
  rationale: Der Ausgangstext spricht von Geboten, Liebe und Vergebung, behauptet aber weder Verdienstlichkeit noch erklärt er abschließend, wie diese Größen theologisch zusammenhängen.
- issue: εἰς τὸ ἀφεθῆναι als Zweck oder Folge
  choice: „damit … vergeben werden“
  alternative: „sodass … vergeben werden“
  rationale: εἰς τό mit Infinitiv kann Ziel oder Ergebnis ausdrücken. Der Haupttext verwendet die naheliegende finale Fassung; die mögliche konsekutive Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einmütigkeit der Liebe“ ist bewusst etwas gehoben, bewahrt jedoch den für 1 Clemens wichtigen Gedanken gemeinschaftlicher Eintracht und bleibt verständlich. Die parallele Nennung der Liebe wird nicht geglättet.
