  naturalness: Der Satz ist würdiges, gut verständliches modernes Standarddeutsch. Die Stellung „uns durch die Liebe die Sünden“ ist zwar möglich, klingt aber weniger flüssig als eine Formulierung mit vorangestelltem „unsere Sünden“.
