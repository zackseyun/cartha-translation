id: 1CLEM.50.3
reference: 1 Clement 50:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: de
  text: Alle Generationen von Adam bis zum heutigen Tag sind vergangen. Doch diejenigen, die gemäß der Gnade Gottes in der Liebe vollendet worden sind, haben einen Platz bei den Gottesfürchtigen, die bei der Heimsuchung des Reiches des Messias offenbar werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heimsuchung“ kann hier ein göttliches Aufsuchen, Eingreifen oder Kommen bezeichnen. Die Verbindung „des Reiches des Messias“ gibt den griechischen Genitiv wieder; dessen genaue Beziehung zu „Heimsuchung“ bleibt offen.
    reason: ἐπισκοπή kann eine göttliche Visitation bzw. ein Eingreifen bezeichnen. Der Genitiv τῆς βασιλείας τοῦ Χριστοῦ sollte nicht dadurch festgelegt werden, dass das Reich als Subjekt eines „Kommens zur Heimsuchung“ dargestellt wird.
lexical_decisions:
- source_word: γενεαὶ
  choice: Generationen
  rationale: Gibt die zeitliche Abfolge der Geschlechter seit Adam im heutigen Standarddeutsch klar wieder.
- source_word: ἐν ἀγάπῃ τελειωθέντες
  choice: in der Liebe vollendet worden sind
  rationale: Bewahrt sowohl den Bereich der Vollendung (Liebe) als auch die passive Form des griechischen Partizips.
- source_word: κατὰ τὴν τοῦ θεοῦ χάριν
  choice: durch Gottes Gnade
  rationale: Κατά bezeichnet hier die Grundlage beziehungsweise Maßgabe; die idiomatische deutsche Fassung bringt Gottes Gnade als bestimmenden Grund zum Ausdruck.
- source_word: χῶρον εὐσεβῶν
  choice: einen Platz unter den Gottesfürchtigen
  rationale: Versteht den Genitiv idiomatisch als Zugehörigkeit zur Gemeinschaft der Frommen, ohne daraus eine spezifisch ausgearbeitete Jenseitslehre abzuleiten.
- source_word: φανερωθήσονται
  choice: werden offenbar werden
  rationale: Gibt das passive Futur direkt wieder und lässt offen, auf welche Weise diese Menschen sichtbar beziehungsweise enthüllt werden.
- source_word: ἐπισκοπῇ
  choice: Heimsuchung
  rationale: Bewahrt den biblisch geprägten Sinn eines göttlichen Aufsuchens oder Eingreifens; eine Fußnote erläutert die weitere Bedeutungsbreite.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Gibt den Titel Χριστός entsprechend seiner Bedeutung wieder und vermeidet, ihn lediglich als eingedeutschten Eigennamen zu behandeln.
theological_decisions:
- issue: Bezug des Relativpronomens οἳ
  choice: Als neuer Satz auf „diejenigen, die … vollendet worden sind“ bezogen
  alternative: Unmittelbarer Relativsatz zu „den Gottesfürchtigen“
  rationale: Das maskuline Pluralpronomen kann formal an beide Gruppenbezeichnungen anschließen; sachlich überschneiden sie sich hier. Der neue Satz macht die Hauptaussage verständlich, ohne eine zusätzliche Personengruppe einzuführen.
- issue: Bedeutung von ἐπισκοπή im Verhältnis zum Reich
  choice: „wenn das Reich des Messias zur Heimsuchung kommt“
  alternative: „bei der Aufsicht/Visitation des Reiches des Messias“ oder „beim Kommen des Reiches des Messias“
  rationale: Die Formulierung wahrt den Gedanken eines eschatologischen Aufsuchens oder Eingreifens, ohne ἐπισκοπή vollständig mit dem bloßen Kommen des Reiches gleichzusetzen.
- issue: Charakter des „Platzes unter den Gottesfürchtigen“
  choice: Keine nähere Lokalisierung oder dogmatische Bestimmung
  alternative: Ein ausdrücklicher Ort im Himmel, im Totenreich oder im künftigen Reich
  rationale: Der griechische Text nennt einen Platz beziehungsweise Anteil bei den Gottesfürchtigen, bestimmt dessen Zustand und Ort aber nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert. „Heimsuchung“ ist bewusst bibelsprachlich, wird jedoch durch die Fußnote erklärt.
