lexical_decisions:
- source_word: εἰρήνην καὶ ὁμόνοιαν
  choice: Frieden und Eintracht
  rationale: Gibt das geläufige Begriffspaar präzise und in natürlichem, würdigem Deutsch wieder.
- source_word: εὐκταίαν καὶ ἐπιπόθητον
  choice: um die wir gebetet und die wir ersehnt haben
  rationale: Bringt beide Beschreibungen zum Ausdruck, ohne das zweite Element ‚ersehnt‘ auszulassen; die relative Form klingt im Deutschen natürlicher als eine Häufung attributiver Partizipien.
- source_word: εὐσταθείας ὑμῶν
  choice: eure geordneten Verhältnisse
  rationale: Bewahrt den Sinn eines stabilen, wohlgeordneten Zustands der Gemeinde, ohne den Ausdruck auf bloße Standhaftigkeit oder äußere Ordnung zu verengen.
