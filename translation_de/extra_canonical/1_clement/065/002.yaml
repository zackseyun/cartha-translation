  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: de
  text: damit sie uns umso schneller von dem Frieden und der Eintracht berichten, um die wir gebetet und die wir ersehnt haben,[a] damit auch wir uns umso eher über eure gefestigte Ordnung freuen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem Frieden und der Eintracht berichten, die wir inständig erbeten und ersehnt haben“.'
