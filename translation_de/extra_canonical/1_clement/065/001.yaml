source:
  edition: Funk 1901 (normalized OCR)
  text: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα σὺν καὶ Φορτουνάτῳ ἐν εἰρήνῃ μετὰ χαρᾶς ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: de
  text: Schickt die von uns Gesandten – Claudius Ephebus und Valerius Bito zusammen mit Fortunatus – so bald wie möglich in Frieden und mit Freude zu uns zurück,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοὺς δὲ ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: die von uns gesandten Männer
  rationale: Das substantivierte Partizip wird im Deutschen natürlich mit „Männer“ ergänzt; δέ markiert hier lediglich den Fortgang und muss nicht eigens mit „nun“ wiedergegeben werden.
- source_word: ἐν τάχει ἀναπέμψατε πρὸς ἡμᾶς
  choice: schickt … bald … zu uns zurück
  rationale: ἀναπέμπω bezeichnet hier das Zurücksenden zu den Absendern; ἐν τάχει fordert eine baldige, zügige Ausführung.
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: in Frieden und mit Freude
  rationale: Die beiden präpositionalen Wendungen werden formal und idiomatisch bewahrt, ohne das Verhältnis von Frieden und Freude näher auszudeuten.
- source_word: σὺν καὶ Φορτουνάτῳ
  choice: zusammen mit Fortunatus
  rationale: Die etwas verstärkende griechische Verbindung wird in natürlichem Deutsch als Begleitung wiedergegeben.
