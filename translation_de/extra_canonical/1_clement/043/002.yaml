id: 1CLEM.43.2
reference: 1 Clement 43:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: de
  text: Dort zeichnete auch der selige Mose, der in seinem ganzen Haus ein treuer Diener war, in den heiligen Büchern alles auf, was ihm aufgetragen worden war. Ihm folgten auch die übrigen Propheten und bezeugten gemeinsam die von ihm erlassenen Vorschriften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: Dort … auch
  rationale: Gibt den örtlich-rückverweisenden Anschluss natürlich wieder, ohne ihn zu einem bloßen begründenden »denn« umzudeuten.
- source_word: ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς
  choice: der selige Mose, der in seinem ganzen Haus ein treuer Diener war
  rationale: Bewahrt die biblisch geprägte Charakterisierung Moses; »Diener« ist für θεράπων im heutigen Deutsch verständlich und würdevoll.
- source_word: τὰ διατεταγμένα αὐτῷ πάντα
  choice: alles, was ihm aufgetragen worden war
  rationale: Gibt die umfassende Bedeutung von πάντα sowie die passive Anordnung an Mose wieder.
- source_word: ἐσημειώσατο
  choice: zeichnete … auf
  rationale: Trifft hier den Sinn des schriftlichen Festhaltens in den heiligen Büchern.
- source_word: συνεπιμαρτυροῦντες
  choice: bezeugten gemeinsam
  rationale: Das Präfix συν- bezeichnet das gemeinsame bzw. übereinstimmende Zeugnis der übrigen Propheten; der folgende Dativ bezeichnet, was sie bezeugen.
- source_word: τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  choice: die von ihm erlassenen Vorschriften
  rationale: Der substantivierte Ausdruck bezeichnet die von Mose gesetzlich festgelegten Bestimmungen; »Vorschriften« bleibt allgemein genug für die nicht näher bestimmten Einzelregelungen.
theological_decisions:
- issue: Bezug des Dativs nach συνεπιμαρτυροῦντες
  choice: Die Propheten bezeugen gemeinsam die von Mose erlassenen Vorschriften.
  alternative: Die Propheten legen zusammen mit den von Mose erlassenen Vorschriften Zeugnis ab.
  rationale: Der Dativ ist am natürlichsten als Gegenstand des Bezeugens zu verstehen, nicht als mitbezeugende Größe. Dadurch wird den Vorschriften keine eigenständige Zeugenrolle zugeschrieben.
- issue: Moses Rolle bei der Gesetzgebung
  choice: von ihm erlassenen Vorschriften
  alternative: durch ihn gegebenen Vorschriften
  rationale: Die Formulierung hält die ausdrückliche Urheberschaftsangabe ὑπ’ αὐτοῦ fest, ohne weiter zu entscheiden, wie sie sich zur zuvor genannten göttlichen Beauftragung verhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar biblischem Ton. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; seine logische Abfolge und die anaphorische Verbindung durch »Ihm« bleiben erhalten.
