source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: de
  text: Als es Morgen geworden war, rief er ganz Israel zusammen, die sechshunderttausend Männer, und zeigte den Stammesoberhäuptern die Siegel. Dann öffnete er das Zelt des Zeugnisses und holte die Stäbe heraus. Dabei fand man, dass Aarons Stab nicht nur ausgeschlagen hatte, sondern sogar Frucht trug.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: Als es Morgen geworden war
  rationale: Gibt die temporale Genitivus-absolute-Konstruktion natürlich und zugleich nah am griechischen Wortlaut wieder.
- source_word: φυλάρχοις
  choice: Stammesoberhäuptern
  rationale: Bezeichnet die leitenden Vertreter der Stämme und ist im Deutschen verständlicher und genauer als eine bloße Wiedergabe mit „Fürsten“.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: Zelt des Zeugnisses
  rationale: Bewahrt die traditionelle, formal genaue Bedeutung von μαρτύριον und vermeidet eine vorschnelle Gleichsetzung mit einer spezielleren deutschen Kultbezeichnung.
- source_word: ῥάβδους
  choice: Stäbe
  rationale: Passt zum erzählten Loszeichen der Stammesführer und bewahrt den sachlichen Ausdruck des Griechischen.
- source_word: βεβλαστηκυῖα
  choice: ausgetrieben hatte
  rationale: Gibt den perfektischen Zustand als bereits eingetretenes Austreiben idiomatisch wieder.
- source_word: καρπὸν ἔχουσα
  choice: Frucht trug
  rationale: Natürliches Deutsch für das Vorhandensein von Frucht am lebendig gewordenen Stab.
theological_decisions:
- issue: Bezeichnung des Heiligtums
  choice: Zelt des Zeugnisses
  alternative: Offenbarungszelt / Stiftshütte
  rationale: Die gewählte Form erhält die Zeugnis-Terminologie des griechischen Textes, ohne eine konfessionell oder traditionsgeschichtlich stärker festgelegte Bezeichnung einzutragen.
- issue: Art der Frucht an Aarons Stab
  choice: allgemein „Frucht“
  alternative: Mandeln
  rationale: Der vorliegende griechische Text nennt nur καρπός und spezifiziert die Frucht nicht; eine Präzisierung aus Numeri 17 würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die hohe Zahl und die kultische Terminologie bleiben ohne erklärende Zusätze im Haupttext erhalten.
