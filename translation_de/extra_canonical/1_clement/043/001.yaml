id: 1CLEM.43.1
reference: 1 Clement 43:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: de
  text: Und was ist daran erstaunlich, wenn diejenigen, die von Gott in Christus mit einem solchen Werk betraut worden waren, die zuvor Genannten einsetzten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί θαυμαστόν
  choice: was ist daran erstaunlich
  rationale: Gibt die rhetorische Frage natürlich und inhaltlich eng wieder.
- source_word: οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ
  choice: diejenigen, die von Gott in Christus … betraut worden waren
  rationale: Das passive πιστευθέντες bezeichnet Personen, denen etwas anvertraut wurde; παρὰ θεοῦ nennt Gott als Handelnden, während ἐν Χριστῷ als eigenständige christologische Bestimmung bewahrt bleibt.
- source_word: ἔργον τοιοῦτο
  choice: mit einem solchen Werk
  rationale: 'Der Akkusativ hängt sachlich von πιστευθέντες ab: Diese Personen waren mit einem solchen Werk betraut.'
- source_word: κατέστησαν
  choice: einsetzten
  rationale: Bezeichnet hier die Einsetzung beziehungsweise Bestellung von Personen in eine Aufgabe oder Stellung.
- source_word: τοὺς προειρημένους
  choice: die zuvor Genannten
  rationale: Wahrt den rückverweisenden Charakter des Ausdrucks ohne eine Amtsbezeichnung hinzuzufügen.
theological_decisions:
- issue: Bezug von ἔργον τοιοῦτο
  choice: Das Werk wird mit den von Gott Betrauten verbunden.
  alternative: Das Werk als Aufgabe der eingesetzten Personen auffassen.
  rationale: Grammatisch ergänzt ἔργον τοιοῦτο das passive πιστευθέντες; eine Verbindung mit κατέστησαν würde eine im Griechischen nicht ausgedrückte Ziel- oder Amtsbestimmung voraussetzen.
- issue: Wiedergabe von ἐν Χριστῷ
  choice: in Christus
  alternative: im Messias
  rationale: „In Christus“ ist im modernen deutschen Bibelstil die natürliche und zugleich formnahe Wiedergabe; die theologisch dichte Formulierung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ist aber als rhetorische Frage flüssig lesbar. Keine Fußnote ist nötig, da die ältere syntaktische Alternative durch die Grammatik des Ausgangstextes nicht hinreichend gestützt wird.
