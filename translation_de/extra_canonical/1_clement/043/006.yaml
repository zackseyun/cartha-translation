id: 1CLEM.43.6
reference: 1 Clement 43:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: de
  text: Was meint ihr, Geliebte? Wusste Mose nicht im Voraus, dass dies geschehen würde? Gewiss wusste er es. Doch damit in Israel keine Unordnung entstünde, handelte er so, damit der Name des wahren und einzigen Gottes verherrlicht würde. Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί δοκεῖτε
  choice: Was meint ihr?
  rationale: Eine natürliche deutsche Wiedergabe der direkten Frage; sie bewahrt den beratend-rhetorischen Ton.
- source_word: ἀγαπητοί
  choice: Geliebte
  rationale: Die traditionelle, würdevolle Anrede gibt die Beziehungsnähe des griechischen Ausdrucks wieder, ohne ein Geschlecht festzulegen.
- source_word: ἀκαταστασία
  choice: Unordnung
  rationale: Der Ausdruck bezeichnet hier einen ungeordneten oder instabilen Zustand; „Unordnung“ passt zum Zusammenhang in Israel, ohne stärker als der griechische Text „Aufruhr“ zu behaupten.
- source_word: εἰς τὸ δοξασθῆναι
  choice: damit … verherrlicht würde
  rationale: Die finale Bedeutung der Konstruktion wird klar und idiomatisch wiedergegeben; das Passiv bleibt erhalten.
- source_word: τοῦ ἀληθινοῦ καὶ μόνου θεοῦ
  choice: des wahren und einzigen Gottes
  rationale: Beide griechischen Attribute werden unmittelbar und in ihrer theologischen Spannung bewahrt.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: von Ewigkeit zu Ewigkeit
  rationale: Eine geläufige, würdevolle deutsche Doxologie, die die verstärkende griechische Ewigkeitsformel angemessen wiedergibt.
theological_decisions:
- issue: Moses Vorwissen
  choice: „Wusste Mose nicht im Voraus …? Gewiss wusste er es.“
  alternative: „Sah Mose nicht voraus …? Ganz gewiss.“
  rationale: Die Übersetzung erhält die ausdrückliche Aussage des Textes über Moses Vorwissen, ohne dessen Art oder Quelle näher zu bestimmen.
- issue: Ziel von Moses Vorgehen
  choice: Zwei Finalsätze mit „damit“
  alternative: 'Den zweiten Ausdruck als bloße Folge wiedergeben: „sodass der Name … verherrlicht wurde“'
  rationale: Das griechische εἰς τὸ legt hier eine Zielangabe nahe. Die Übersetzung lässt offen, durch wen beziehungsweise auf welche Weise Gottes Name verherrlicht wird.
- issue: Doxologische Aussage
  choice: „Ihm sei die Herrlichkeit“
  alternative: „Ihm gehört die Herrlichkeit“
  rationale: Der optative deutsche Doxologiestil entspricht der elliptischen griechischen Formel und vermeidet eine unnötige Festlegung auf Indikativ oder Wunschform.
translation_notes:
  register: 'Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die rhetorische Bewegung des griechischen Textes bleibt erhalten: Anrede, Frage, nachdrückliche Antwort, Begründung und Doxologie. Keine Fußnoten erforderlich.'
