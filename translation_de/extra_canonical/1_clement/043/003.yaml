  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. Die präzisere Umformulierung der Stab-Beschriftung ist zugleich idiomatischer und weniger missverständlich.
  terminology: „Eifersucht“, „Parteienstreit“, „Stammesführer“, „Siegelringe“ und „Zelt des Zeugnisses“ sind tragfähige Wiedergaben. Die Fußnote sollte den nicht ausdrücklich bestimmten Bezug des „ruhmreichen Namens“ nicht auf einen priesterlichen Namen oder eine priesterliche Würde festlegen.
