id: 1CLEM.43.3
reference: 1 Clement 43:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: de
  text: Denn als Eifersucht wegen des Priestertums aufkam und die Stämme darüber in Parteienstreit gerieten, welcher von ihnen mit dem ruhmreichen Namen geschmückt sei,[a] befahl jener den zwölf Stammesführern, ihm jeweils einen Stab zu bringen, der mit dem Namen seines Stammes beschriftet war. Er nahm sie, band sie zusammen und versiegelte sie mit den Siegelringen der Stammesführer. Dann legte er sie im Zelt des Zeugnisses auf den Tisch Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Bezug des „ruhmreichen Namens“ wird im griechischen Text nicht näher bestimmt.
    reason: Die bildhafte Formulierung bleibt erhalten, ohne den Namen ausdrücklich als priesterlichen Titel oder als priesterliche Würde zu deuten.
lexical_decisions:
- source_word: ζήλου
  choice: Eifersucht
  rationale: Gibt den Grundsinn von ζῆλος wieder und bewahrt die negative Färbung des ausbrechenden Rivalitätsdenkens; „Streit“ allein würde die innere Haltung einebnen.
- source_word: στασιαζουσῶν
  choice: in Parteienstreit gerieten
  rationale: Bringt den aktiven, gemeinschaftsspaltenden Sinn von στασιάζω zur Geltung und wahrt den politischen bzw. fraktionellen Ton der στάσις-Wortgruppe.
- source_word: τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη
  choice: mit dem ruhmreichen Namen geschmückt sei
  rationale: Folgt der Bildsprache und lässt offen, in welchem genauen Sinn der priesterliche Name oder Titel den betreffenden Stamm auszeichnet.
- source_word: φυλάρχους
  choice: Stammesführern
  rationale: Natürliche und sachlich genaue Wiedergabe für die Oberhäupter bzw. Anführer der zwölf Stämme.
- source_word: ῥάβδους
  choice: Stäbe
  rationale: Passt zum erzählten Loszeichen aus Numeri 17 und vermeidet eine unnötige Festlegung auf Geh- oder Hirtenstäbe.
- source_word: τοῖς δακτυλίοις
  choice: mit den Siegelringen
  rationale: Der Zusammenhang des Versiegelns zeigt, dass δακτύλιοι hier Ringe mit Siegelfunktion bezeichnet.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: Zelt des Zeugnisses
  rationale: Formnahe Wiedergabe der griechischen Benennung; vermeidet, μαρτύριον ohne Not als „Begegnung“ umzudeuten.
theological_decisions:
- issue: Bezug des „ruhmreichen Namens“
  choice: Die bildhafte, grammatisch offene Formulierung bleibt stehen.
  alternative: Explizit „welcher Stamm zum Priesterdienst erwählt sei“ zu schreiben.
  rationale: Der Zusammenhang betrifft zwar das Priestertum, doch der griechische Text spricht ausdrücklich vom Geschmücktsein mit dem ruhmreichen Namen und erklärt dessen genauen Bezug nicht weiter.
- issue: Identität von ἐκεῖνος
  choice: „jener“
  alternative: „Mose“
  rationale: Das Demonstrativpronomen verweist im Kontext auf Mose, nennt ihn hier aber nicht ausdrücklich; die Übersetzung wahrt diese anaphorische Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzperiode wurde für gute Lesbarkeit nach dem Hauptsatz geteilt; die kultischen Bezeichnungen und die Bildsprache des Griechischen bleiben erhalten.
