  to: Denn als Eifersucht wegen des Priestertums aufkam und die Stämme darüber in Parteienstreit gerieten, welcher von ihnen mit dem ruhmreichen Namen geschmückt sei,[a] befahl jener den zwölf Stammesführern, ihm jeweils einen Stab zu bringen, der mit dem Namen seines Stammes beschriftet war. Er nahm sie, band sie zusammen und versiegelte sie mit den Siegelringen der Stammesführer. Dann legte er sie im Zelt des Zeugnisses auf den Tisch Gottes.
  rationale: Die Revision präzisiert die individuelle Beschriftung der zwölf Stäbe und ersetzt die interpretativ zu enge Fußnote durch eine textnahe Erläuterung der bewahrten Unbestimmtheit. Bedeutung, Register und Satzführung bleiben ansonsten erhalten.
