  terminology: »Zelt«, »Schlüssel«, »Stäbe«, »ausschlägt«, »als Priester dienen« und »den heiligen Dienst verrichten« sind im gegebenen kultischen Zusammenhang tragfähig. Die Anrede »Brüder« ist als idiomatische Wiedergabe von ἄνδρες ἀδελφοί vertretbar; die Fußnote dokumentiert die wörtlich männlich-markierte Form.
