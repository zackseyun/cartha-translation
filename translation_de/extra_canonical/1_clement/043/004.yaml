source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κλείσας τὴν σκηνὴν ἐσφράγισεν τὰς κλεῖδας ὡσαύτως καὶ τὰς ῥάβδους, καὶ εἶπεν αὐτοῖς· Ἄνδρες ἀδελφοί, ἧς ἂν φυλῆς ἡ ῥάβδος βλαστήσῃ, ταύτην ἐκλέλεκται ὁ θεὸς εἰς τὸ ἱερατεύειν καὶ λειτουργεῖν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: de
  text: 'Nachdem er das Zelt geschlossen hatte, versiegelte er die Schlüssel ebenso wie die Stäbe. Er sagte zu ihnen: »Brüder,[a] der Stamm, dessen Stab ausschlägt – diesen hat Gott erwählt, ihm als Priester zu dienen und für ihn den heiligen Dienst zu verrichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer, Brüder«; eine feierliche Anrede an die versammelten Männer.'
    reason: Die natürliche deutsche Anrede »Brüder« gibt den Sinn wieder; die Fußnote bewahrt die ausdrücklich männliche und förmliche Formulierung ἄνδρες ἀδελφοί.
lexical_decisions:
- source_word: σκηνή
  choice: Zelt
  rationale: Die Grundbedeutung ist »Zelt«; im erzählten kultischen Zusammenhang ist das Offenbarungszelt gemeint, doch die einfache Wiedergabe vermeidet eine unnötige terminologische Festlegung.
- source_word: κλεῖδας
  choice: Schlüssel
  rationale: Der griechische Text der angegebenen Ausgabe nennt ausdrücklich die »Schlüssel«. Diese Lesart wird trotz der Auslassung in der englischen Konsultationsfassung beibehalten.
- source_word: ῥάβδους / ῥάβδος
  choice: Stäbe / Stab
  rationale: »Stab« gibt den Gegenstand natürlich und im Anschluss an die zugrunde liegende Überlieferung sachgerecht wieder.
- source_word: βλαστήσῃ
  choice: ausschlägt
  rationale: Das Verb bezeichnet das Hervortreiben bzw. Sprossen einer Pflanze; bei einem Stab ist »ausschlagen« im Deutschen anschaulich und idiomatisch.
- source_word: ἱερατεύειν
  choice: als Priester dienen
  rationale: Die verbale Aussage über die Ausübung des Priesteramts wird verständlich wiedergegeben, ohne einen konfessionell geprägten Amtstitel einzuführen.
- source_word: λειτουργεῖν αὐτῷ
  choice: für ihn den heiligen Dienst verrichten
  rationale: Im kultischen Zusammenhang bezeichnet λειτουργεῖν einen geordneten heiligen Dienst. »Für ihn« bewahrt den Bezug auf Gott und unterscheidet die Wendung sprachlich von ἱερατεύειν.
theological_decisions:
- issue: Gottes Erwählung eines Stammes zum Priesterdienst
  choice: »diesen hat Gott erwählt«
  alternative: »diesen erwählt Gott« oder eine abgeschwächte Umschreibung wie »diesem weist Gott den Dienst zu«
  rationale: Das Perfekt ἐκλέλεκται stellt die vollzogene Erwählung mit fortbestehender Geltung heraus. Die direkte Formulierung bewahrt diese theologische Aussage, ohne ihren Umfang über den konkreten Priesterdienst hinaus auszudehnen.
- issue: Verhältnis von ἱερατεύειν und λειτουργεῖν
  choice: 'Beide Verben werden unterscheidbar wiedergegeben: Priesterdienst und heiliger Dienst.'
  alternative: Beide Verben zusammenfassend nur mit »dienen« wiederzugeben.
  rationale: Die zwei griechischen Verben stehen koordiniert nebeneinander. Eine differenzierte Wiedergabe bewahrt die rhetorische und kultische Spannung, ohne zwingend zwei voneinander getrennte Ämter zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die direkte Rede bleibt feierlich, aber für heutige Leser verständlich. Der Gedankenstrich hebt die Folgerung hervor, die im Griechischen durch die vorangestellte Relativkonstruktion und das demonstrative ταύτην markiert ist.
