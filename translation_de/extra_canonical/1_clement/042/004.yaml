source:
  edition: Funk 1901 (normalized OCR)
  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: de
  text: So verkündigten sie in Landstrichen und Städten die Botschaft und setzten ihre Erstlinge, nachdem sie sie durch den Geist geprüft hatten, zu Aufsehern und Diakonen für diejenigen ein, die künftig glauben würden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ χώρας οὖν καὶ πόεις
  choice: So … in Landstrichen und Städten
  rationale: κατά mit dem Akkusativ bezeichnet hier die Ausbreitung über verschiedene Gebiete und Städte; „Landstriche“ ist natürlich und bewahrt den Gegensatz zu den Städten. οὖν wird folgernd mit „So“ wiedergegeben.
- source_word: κηρύσσοντες
  choice: verkündigten … die Botschaft
  rationale: Das Partizip bezeichnet öffentliches Verkündigen; die Ergänzung „die Botschaft“ macht den deutschen Satz idiomatisch, ohne den nicht ausdrücklich genannten Inhalt enger festzulegen.
- source_word: καθίστανον
  choice: setzten … ein
  rationale: Das Verb bezeichnet hier die Bestellung zu einem Amt oder Dienst. „Einsetzen“ ist im Deutschen klarer als das mögliche, aber missverständliche „bestellen“.
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: ihre Erstlinge
  rationale: Die bildhafte Bezeichnung „Erstlinge“ wird bewahrt; gemeint sind offenbar die ersten gewonnenen Glaubenden in den jeweiligen Missionsgebieten, doch diese Deutung wird nicht in den Haupttext eingetragen.
- source_word: δοκιμάσαντες τῷ πνεύματι
  choice: nachdem sie sie durch den Geist geprüft hatten
  rationale: Der Dativ τῷ πνεύματι wird instrumental verstanden. „Geist“ bleibt ohne näher bestimmendes Adjektiv, weil auch der griechische Text die Beziehung nicht ausdrücklich auflöst.
- source_word: εἰς ἐπισκόπους καὶ διακόνους
  choice: als Aufseher und Diakone
  rationale: „Aufseher“ gibt die Grundbedeutung von ἐπίσκοποι wieder, ohne spätere Amtsstrukturen vorauszusetzen; „Diakone“ ist als geläufige Amtsbezeichnung verständlich und wahrt die Unterscheidung beider Begriffe.
- source_word: τῶν μελλόντων πιστεύειν
  choice: für diejenigen, die zum Glauben kommen sollten
  rationale: Die Konstruktion bezeichnet Menschen, deren Glauben noch bevorstand. „Sollten“ drückt die Zukunft aus, ohne daraus eine ausdrückliche göttliche Vorherbestimmung zu machen.
theological_decisions:
- issue: Bedeutung von τῷ πνεύματι
  choice: „durch den Geist“
  alternative: „im Geist“ oder „geistlich“
  rationale: Der instrumentale Sinn liegt nahe und bewahrt den Geist als handelndes beziehungsweise vermittelndes Gegenüber; der Text sagt jedoch nicht ausdrücklich „Heiliger Geist“, weshalb keine Präzisierung hinzugefügt wird.
- issue: Amtsverständnis von ἐπίσκοποι und διάκονοι
  choice: „Aufseher und Diakone“
  alternative: „Bischöfe und Diakone“ oder „Gemeindeleiter und Helfer“
  rationale: Die gewählte Form vermeidet sowohl eine anachronistische Gleichsetzung mit später ausgeprägten kirchlichen Ämtern als auch eine funktionale Verengung, die der griechische Text nicht vornimmt.
- issue: Zukunftsaussage in τῶν μελλόντων πιστεύειν
  choice: 'prospektiv: „die zum Glauben kommen sollten“'
  alternative: 'determinativ: „die zum Glauben bestimmt waren“'
  rationale: μέλλω mit Infinitiv bezeichnet hier zunächst bevorstehendes Geschehen. Eine ausdrückliche Aussage über Vorherbestimmung wäre theologisch stärker als der Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird aber durch finite Verben und eine zeitliche Nebensatzkonstruktion natürlich gestaltet. Die traditionsreiche Metapher „Erstlinge“ bleibt erhalten; kirchengeschichtlich belastete Amtsbegriffe werden differenziert wiedergegeben.
