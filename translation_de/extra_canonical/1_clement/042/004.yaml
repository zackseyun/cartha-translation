  to: So verkündigten sie in Landstrichen und Städten die Botschaft und setzten ihre Erstlinge, nachdem sie sie durch den Geist geprüft hatten, zu Aufsehern und Diakonen für diejenigen ein, die künftig glauben würden.
  rationale: Die Revision bewahrt die Metapher „Erstlinge“, die instrumentale und nicht weiter spezifizierte Wiedergabe von τῷ πνεύματι sowie die nicht-anhistorisierende Amtsbezeichnung „Aufseher“. Sie ersetzt die über das griechische πιστεύειν hinausgehende Formulierung „zum Glauben kommen“ und vermeidet die mögliche Nebenbedeutung von „sollten“. Da die Zukunftsbedeutung im Haupttext klar wiedergegeben ist, ist keine Alternativfußnote erforderlich.
