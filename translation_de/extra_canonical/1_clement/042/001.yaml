id: 1CLEM.42.1
reference: 1 Clement 42:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: de
  text: Die Apostel empfingen für uns die gute Botschaft vom Herrn Jesus Christus; Jesus, der Christus, wurde von Gott ausgesandt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐηγγελίσθησαν
  choice: empfingen … die gute Botschaft
  rationale: Das passive Verb bezeichnet hier, dass den Aposteln die gute Botschaft übermittelt wurde. Die aktive deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die Herkunft der Botschaft zu verwischen.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: Bewahrt die zugunsten der Gemeinschaft gemeinte Ausrichtung, ohne sie näher als nötig auszulegen.
- source_word: ἐξεπέμφθη
  choice: wurde … ausgesandt
  rationale: Gibt das Passiv und die Vorstellung einer Beauftragung mit Sendung präzise wieder.
- source_word: Ἰησοῦς ὁ Χριστός
  choice: Jesus, der Christus
  rationale: Der Artikel hebt Christus hier als Titel hervor; die Formulierung erhält diese Betonung deutlicher als der bloße Eigenname „Jesus Christus“.
theological_decisions:
- issue: Abfolge und Ursprung der Sendung
  choice: Die gute Botschaft kommt vom Herrn Jesus Christus zu den Aposteln; Jesus, der Christus, wird von Gott ausgesandt.
  alternative: Die Aussagen als allgemeine Gleichsetzung göttlicher und apostolischer Autorität glätten.
  rationale: Die Übersetzung bewahrt die im Griechischen ausdrücklich gestufte Sendungsfolge, ohne daraus weitergehende Lehrfolgerungen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Unterscheidung zwischen „Jesus Christus“ und „Jesus, der Christus“ bleiben erkennbar.
