id: 1CLEM.42.5
reference: 1 Clement 42:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ τοῦτο οὐ καινῶς· ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο περὶ ἐπισκόπων καὶ διακόνων. οὕτως γάρ που λέγει ἡ γραφή· Καταστήσω τοὺς ἐπισκόπους αὐτῶν ἐν δικαιοσύνῃ καὶ τοὺς διακόνους αὐτῶν ἐν πίστει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: de
  text: 'Und dies war nichts Neues; denn schon seit langer Zeit war über Aufseher und Diakone geschrieben worden. So sagt nämlich die Schrift an einer Stelle: »Ich werde ihre Aufseher in Gerechtigkeit einsetzen und ihre Diakone in Treue.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ καινῶς
  choice: war nichts Neues
  rationale: Gibt die adverbiale Wendung idiomatisch und sinngenau wieder, ohne den Gedanken abzuschwächen.
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων
  choice: denn schon vor vielen Zeitaltern
  rationale: Bewahrt die zeitliche Weite von πολλῶν χρόνων und gibt δὴ durch das bekräftigende »schon« natürlich wieder.
- source_word: ἐπισκόπων
  choice: Aufseher
  rationale: Gibt die Grundbedeutung wieder und vermeidet, einen späteren kirchlichen Amtstitel rückwirkend eindeutig festzulegen.
- source_word: διακόνων
  choice: Diakone
  rationale: Der im frühen christlichen Kontext geläufige Amtsausdruck wird als etablierter deutscher Begriff beibehalten.
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: So sagt nämlich die Schrift an einer Stelle
  rationale: Bewahrt οὕτως (»so«), γάρ (»nämlich«) und das Unbestimmte von που (»an einer Stelle«).
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Formale Wiedergabe, welche die mögliche instrumentale, modale oder sphärische Nuance der Präposition nicht vorschnell auflöst.
- source_word: ἐν πίστει
  choice: in Treue
  rationale: Im Parallelismus bezeichnet πίστις hier plausibel zuverlässige Treue; die Formulierung wahrt zugleich die knappe Ausdrucksweise des Zitats.
theological_decisions:
- issue: Amtsbezeichnung ἐπίσκοποι
  choice: Aufseher
  alternative: Bischöfe
  rationale: »Aufseher« entspricht der lexikalischen Grundbedeutung und legt die spätere Ausgestaltung des Bischofsamtes nicht in den frühen Text hinein.
- issue: Bedeutung von πίστις im Schriftzitat
  choice: Treue
  alternative: Glaube
  rationale: Im Parallelismus mit »Gerechtigkeit« und bei der Einsetzung von Amtsträgern liegt die Eigenschaft der Zuverlässigkeit nahe; »Glaube« bleibt lexikalisch möglich, ist hier aber weniger natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau, soweit dies natürlich bleibt. Das Zitat ist durch deutsche Anführungszeichen markiert; die unbestimmte Zitierformel που wird ausdrücklich bewahrt.
