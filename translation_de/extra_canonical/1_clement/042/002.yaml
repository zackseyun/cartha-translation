source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: de
  text: Der Messias stammt also von Gott, und die Apostel stammen vom Messias. Beides geschah in guter Ordnung durch Gottes Willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „aus Gottes Willen“.'
    reason: ἐκ kennzeichnet hier wörtlich den Ausgangspunkt bzw. Ursprung; „durch Gottes Willen“ ist im Deutschen die idiomatische Wiedergabe.
lexical_decisions:
- source_word: ὁ Χριστός
  choice: der Messias
  rationale: Gibt den griechischen Titel in seiner Bedeutung wieder und entspricht der vorgegebenen POB-Terminologie; der bestimmte Artikel wird im Deutschen natürlich beibehalten.
- source_word: ἀπὸ
  choice: von
  rationale: 'Bewahrt in beiden parallelen Aussagen die Herkunfts- bzw. Sendungsrelation: Der Messias kommt von Gott, die Apostel vom Messias.'
- source_word: εὐτάκτως
  choice: in wohlgeordneter Weise
  rationale: Gibt den Gedanken einer ordnungsgemäßen, wohlgeordneten Abfolge wieder, ohne eine bestimmte kirchliche Amtslehre hineinzulesen.
- source_word: ἐκ θελήματος θεοῦ
  choice: durch Gottes Willen
  rationale: Natürliches modernes Deutsch für den Ursprung bzw. die Veranlassung im Willen Gottes; die wörtlichere Herkunftsnuance wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Art der Beziehung zwischen Gott, dem Messias und den Aposteln
  choice: Die parallele Herkunfts- bzw. Sendungsformulierung bleibt mit „kommt von“ erhalten.
  alternative: „wurde von … gesandt“
  rationale: Der Kontext kann Sendung nahelegen, doch der griechische Wortlaut verwendet hier kein ausdrückliches Verb für „senden“. Die Übersetzung vermeidet daher eine unnötige Festlegung.
- issue: Bedeutung der geordneten Abfolge
  choice: „in wohlgeordneter Weise“
  alternative: „nach der rechten Ordnung“
  rationale: Die Formulierung wahrt die Aussage über Ordnung, ohne daraus stillschweigend eine spezifische Konfessions- oder Sukzessionslehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt sichtbar; das im ersten Satz fehlende Verb wird entsprechend der deutschen Grammatik mit „kommt“ ergänzt.
