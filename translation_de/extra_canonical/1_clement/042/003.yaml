id: 1CLEM.42.3
reference: 1 Clement 42:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: de
  text: Nachdem sie also Weisungen empfangen, durch die Auferstehung unseres Herrn Jesus, des Messias, volle Gewissheit erlangt und im Wort Gottes Bestärkung erfahren hatten, zogen sie in der vollen Gewissheit des Heiligen Geistes aus. Sie verkündeten die gute Botschaft, dass das Reich Gottes im Begriff sei zu kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kommen werde.'
    reason: μέλλειν ἔρχεσθαι kann ein bevorstehendes Kommen oder allgemeiner ein erwartetes künftiges Kommen bezeichnen.
lexical_decisions:
- source_word: παραγγελίας
  choice: Aufträge
  rationale: Der Plural bezeichnet empfangene Weisungen oder Anordnungen; „Aufträge“ passt natürlich zum anschließenden Aussenden und bewahrt den verpflichtenden Charakter.
- source_word: πληροφορηθέντες
  choice: völlig gewiss geworden
  rationale: Gibt die volle Überzeugung beziehungsweise Gewissheit des Partizips wieder, ohne einen bloß verstandesmäßigen Beweisvorgang zu unterstellen.
- source_word: Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist der griechische Titel für den Gesalbten beziehungsweise Messias; die appositionelle Form macht den Titel im modernen Deutschen verständlich.
- source_word: πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ
  choice: im Wort Gottes bestärkt worden
  rationale: πιστόω kann bestätigen, beglaubigen oder Gewissheit geben. „bestärkt“ ist hier idiomatisch und lässt offen, ob das Wort Gottes Grundlage oder Bereich dieser Festigung ist.
- source_word: μετὰ πληροφορίας πνεύματος ἁγίου
  choice: in der vollen Gewissheit des Heiligen Geistes
  rationale: 'Bewahrt die wiederholte Vorstellung voller Gewissheit und lässt die Genitivbeziehung offen: Der Heilige Geist kann Quelle oder Träger dieser Gewissheit sein.'
- source_word: εὐαγγελιζόμενοι
  choice: Sie verkündeten die gute Botschaft
  rationale: Gibt den verbalen Sinn ausdrücklich wieder und vermeidet eine unnötig kirchensprachliche Engführung auf „evangelisieren“.
- source_word: μέλλειν ἔρχεσθαι
  choice: im Begriff sei zu kommen
  rationale: Bringt den prospektiven, möglicherweise unmittelbar bevorstehenden Sinn von μέλλω zum Ausdruck; der Konjunktiv kennzeichnet im Deutschen die berichtete Verkündigung.
theological_decisions:
- issue: Wiedergabe von Ἰησοῦ Χριστοῦ
  choice: Jesus, des Messias
  alternative: Jesus Christus
  rationale: Die Übersetzung macht den Titelgehalt von Χριστός sichtbar, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Zeitliche Aussage über das Kommen des Reiches Gottes
  choice: im Begriff sei zu kommen
  alternative: kommen werde
  rationale: μέλλειν ἔρχεσθαι kann sowohl Erwartung beziehungsweise Zukunft als auch bevorstehende Nähe ausdrücken. Der Haupttext bildet die stärkere prospektive Nuance ab; die Fußnote bewahrt die weniger stark auf Unmittelbarkeit festgelegte Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in zwei Sätze gegliedert, während Abfolge und logische Beziehungen erhalten bleiben. Der wiederholte Gewissheitsgedanke des griechischen Textes bleibt bewusst hörbar.
