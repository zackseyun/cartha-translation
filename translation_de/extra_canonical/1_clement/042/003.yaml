revisions:
- from: Nachdem sie also ihre Aufträge erhalten hatten, durch die Auferstehung unseres Herrn Jesus, des Messias, völlig gewiss geworden und im Wort Gottes bestärkt worden waren, zogen sie in der vollen Gewissheit des Heiligen Geistes aus. Sie verkündeten die gute Botschaft, dass das Reich Gottes im Begriff sei zu kommen.[a]
  to: Nachdem sie also Weisungen empfangen, durch die Auferstehung unseres Herrn Jesus, des Messias, volle Gewissheit erlangt und im Wort Gottes Bestärkung erfahren hatten, zogen sie in der vollen Gewissheit des Heiligen Geistes aus. Sie verkündeten die gute Botschaft, dass das Reich Gottes im Begriff sei zu kommen.[a]
  rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-semantische Verbesserungen: „Weisungen“ statt „Aufträge“ und „volle Gewissheit erlangt“ statt „völlig gewiss geworden“. Satzbau, Zeitbezug, die transparente Messias-Wiedergabe und die Fußnote zur Reich-Gottes-Aussage bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn der Partizipien insgesamt zutreffend wieder: empfangene Weisungen, Gewissheit durch die Auferstehung, Bestärkung im Wort Gottes, Ausgehen zur Verkündigung und die eschatologische Aussage über Gottes Reich. „Im Begriff sei zu kommen“ ist als Haupttext für μέλλειν ἔρχεσθαι möglich; die Fußnote wahrt die weiter gefasste Zukunftslesart. Eine kleine sprachliche Präzisierung vermeidet jedoch, dass „Aufträge“ zu stark nach konkreten Einzelmissionen klingt, während παραγγελίαι primär Weisungen/Anordnungen bezeichnet.'
  naturalness: Der lange Eingangssatz ist verständlich, aber die Kombination „Aufträge erhalten hatten“ und „völlig gewiss geworden“ wirkt etwas schwerfällig. „Weisungen empfangen“ und „volle Gewissheit erlangt“ sind im würdevollen modernen Standarddeutsch idiomatischer. Die appositionelle Wiedergabe „Jesus, des Messias“ ist grammatisch möglich, aber weniger natürlich als „Jesus, dem Messias“ in einer Dativ-Apposition; da hier jedoch ein Genitivanschluss vorliegt, ist eine Umformung zu „unseres Herrn, Jesus, des Messias“ ebenfalls nicht besser. „unseres Herrn Jesus, des Messias“ kann beibehalten werden.
  terminology: „Messias“ macht den Titel Χριστός transparent und ist konsistent mit der Vorgabe. „Wort Gottes“, „Heiliger Geist“, „Reich Gottes“ und „gute Botschaft“ sind sachgerecht. „Weisungen“ bildet παραγγελίας genauer und ohne unnötige Verengung ab.
  issues:
  - severity: low
    issue: „Aufträge“ für παραγγελίας
    rationale: „Aufträge“ ist möglich, kann aber konkrete zu erledigende Aufgaben nahelegen. Das griechische Wort bezeichnet hier allgemeiner empfangene Weisungen bzw. Anordnungen. „Weisungen“ ist quellenäher und stilistisch passend.
  - severity: low
    issue: Schwerfällige Formulierung „völlig gewiss geworden“
    rationale: Die Aussage ist sachlich richtig, doch „volle Gewissheit erlangt“ klingt im Deutschen natürlicher und gibt πληροφορηθέντες präzise wieder.
  revised_text: Nachdem sie also Weisungen empfangen, durch die Auferstehung unseres Herrn Jesus, des Messias, volle Gewissheit erlangt und im Wort Gottes Bestärkung erfahren hatten, zogen sie in der vollen Gewissheit des Heiligen Geistes aus. Sie verkündeten die gute Botschaft, dass das Reich Gottes im Begriff sei zu kommen.[a]
  revised_footnotes:
