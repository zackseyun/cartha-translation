source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία τῷ θεῷ πνεῦμα συντετριμμένον· καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξουδενώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: de
  text: 'Ein Opfer für Gott ist ein zerbrochener Geist;

    ein zerbrochenes und gedemütigtes Herz wird Gott nicht verachten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: Opfer
  rationale: Die direkte und im kultischen wie übertragenen Sinn natürliche Entsprechung bewahrt die Bildsprache des griechischen Textes.
- source_word: πνεῦμα συντετριμμένον
  choice: ein zerbrochener Geist
  rationale: Die traditionelle, verständliche Wendung gibt den Zustand innerer Zerschlagenheit wieder, ohne ihn erklärend einzuengen.
- source_word: καρδίαν … τεταπεινωμένην
  choice: ein … gedemütigtes Herz
  rationale: „Gedemütigt“ bildet das Partizip passivisch ab und lässt offen, wodurch oder von wem die Erniedrigung erfolgt ist.
- source_word: οὐκ ἐξουδενώσει
  choice: wird … nicht verachten
  rationale: Dies gibt die futurische Form und die Bedeutung ‚geringschätzen/verachten‘ prägnant und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Opfer und innerer Haltung
  choice: Die metaphorische Opferaussage wird ohne Zusatz oder dogmatische Erläuterung wiedergegeben.
  alternative: „Das Opfer, das Gott gefällt, ist …“
  rationale: Der griechische Text setzt „Opfer für Gott“ und „zerbrochener Geist“ unmittelbar gleich; eine Aussage über Gottes Gefallen wäre interpretierend ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst parallelem Satzbau; die vertraute biblische Bildsprache bleibt erhalten.
