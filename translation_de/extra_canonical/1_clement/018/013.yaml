base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: de
  text: 'Ich werde die Gesetzlosen deine Wege lehren,

    und die Gottlosen werden sich dir zuwenden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόμους
  choice: die Gesetzlosen
  rationale: Gibt die Bezeichnung für Menschen wieder, die Gottes Gesetz missachten, und bewahrt den deutlichen Bezug zu νόμος.
- source_word: τὰς ὁδούς σου
  choice: deine Wege
  rationale: Bewahrt das biblische Bild für Gottes Willen und Lebensführung.
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Gibt Menschen wieder, denen Ehrfurcht und rechte Haltung gegenüber Gott fehlen.
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: werden sich dir zuwenden
  rationale: Drückt die Hinwendung zu Gott aus, ohne durch „zurückkehren“ eine im Griechischen nicht ausdrücklich bezeichnete frühere Beziehung vorauszusetzen.
theological_decisions:
- issue: Bedeutung der Hinwendung in ἐπιστρέψουσιν ἐπὶ σέ
  choice: sich dir zuwenden
  alternative: zu dir umkehren / zu dir zurückkehren
  rationale: Die Übersetzung lässt offen, ob eine Rückkehr oder eine erstmalige Hinwendung gemeint ist, und trägt so der Formulierung des griechischen Textes Rechnung.
translation_notes:
  register: Moderne, würdige Standardsprache mit parallelem Satzbau; das traditionelle biblische Weg-Motiv bleibt erhalten.
