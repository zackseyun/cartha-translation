source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: de
  text: 'Denn siehe: In Gesetzlosigkeiten wurde ich empfangen,

    und in Sünden wurde meine Mutter mit mir schwanger.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezeichnet ursprünglich Schwangerschaftsgelüste; in diesem biblisch-griechischen Zusammenhang bedeutet es, mit jemandem schwanger zu werden bzw. jemanden zu empfangen, nicht ihn zu stillen.
    reason: Erläutert die ungewöhnliche, aber quellentreue Wiedergabe von ἐκίσσησέν und grenzt sie von der nicht sachgerechten Deutung „stillte mich“ ab.
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn sieh
  rationale: Gibt sowohl die begründende Partikel γάρ als auch den aufmerksamkeitslenkenden Imperativ ἰδού natürlich und würdig wieder.
- source_word: ἐν ἀνομίαις
  choice: in Gesetzlosigkeiten
  rationale: Bewahrt den Plural und den Bezug auf Handlungen oder Zustände, die Gottes Gesetz widersprechen, ohne ihn vorschnell zu verallgemeinern.
- source_word: συνελήμφθην
  choice: wurde ich empfangen
  rationale: Der passive Aorist von συλλαμβάνω bezeichnet hier das Empfangenwerden im Mutterleib.
- source_word: ἐν ἁμαρτίαις
  choice: in Sünden
  rationale: Bewahrt den auffälligen Plural des griechischen Textes.
- source_word: ἐκίσσησέν με
  choice: empfing mich
  rationale: κισσάω bezeichnet ursprünglich Schwangerschaftsgelüste und kann in diesem biblisch-griechischen Kontext das Schwangerwerden beziehungsweise Empfangen ausdrücken; „stillte mich“ wäre lexikalisch nicht sachgerecht.
theological_decisions:
- issue: Verhältnis der Sünden zur Empfängnis
  choice: Die Formulierung „in Gesetzlosigkeiten … in Sünden“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Eine ausdrückliche Deutung als ererbte Sünde, als Sünde der Eltern oder als sündige Umwelt.
  rationale: Der Vers lässt die genaue Beziehung zwischen Sünde und Empfängnis offen; die Übersetzung soll diese theologische Spannung nicht konfessionell festlegen.
- issue: Wiedergabe der beiden Verben für die Empfängnis
  choice: Beide Teilsätze verwenden im Deutschen „empfangen“, einmal passiv und einmal aktiv.
  alternative: Im zweiten Teilsatz „gebar mich“.
  rationale: Das zweite griechische Verb verweist in diesem Kontext eher auf Empfangen beziehungsweise Schwangerwerden als auf die Geburt. Die Wiederholung ist im Deutschen zwar auffällig, bildet aber den Sinn genauer ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilenstruktur. „Gesetzlosigkeiten“ ist bewusst präziser als das allgemeinere „Unrecht“. Das zweimalige „empfangen“ bewahrt die sachliche Parallelität, ohne das zweite Verb fälschlich als Geburt oder Stillen zu deuten.
