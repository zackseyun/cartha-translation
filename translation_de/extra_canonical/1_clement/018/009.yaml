lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου
  choice: Wende dein Angesicht … ab
  rationale: Bewahrt das konkrete biblische Bild und den Imperativ des griechischen Textes; „Angesicht“ entspricht dem würdevollen Gebetsregister.
- source_word: ἁμαρτιῶν
  choice: Sünden
  rationale: Die übliche und sachlich genaue Wiedergabe des Begriffs im religiös-ethischen Kontext.
- source_word: ἀνομίας
  choice: Verfehlungen
  rationale: Gibt schuldhafte Übertretungen natürlich wieder, ohne das im Deutschen leicht missverständliche „Gesetzlosigkeiten“ zu verwenden.
- source_word: ἐξάλειψον
  choice: tilge
  rationale: Erhält das Bild des Auslöschens beziehungsweise Wegwischens und passt zum gehobenen Gebetsstil.
theological_decisions:
- issue: Unterscheidung zwischen ἁμαρτίαι und ἀνομίαι
  choice: „Sünden“ und „Verfehlungen“
  alternative: „Sünden“ und „Gesetzlosigkeiten“
  rationale: Die zwei unterschiedlichen griechischen Begriffe bleiben unterscheidbar, ohne ἀνομία unnötig auf ein bestimmtes Gesetzesverständnis festzulegen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit bewusst bewahrtem biblischem Bildwort „Angesicht“. Die zweizeilige poetische Parallelstruktur des Zitats bleibt erhalten.
