source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: de
  text: 'Verwirf mich nicht von deinem Angesicht,

    und nimm deinen Heiligen Geist nicht von mir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με
  choice: Verwirf mich nicht
  rationale: Gibt den nachdrücklichen Gedanken des Wegstoßens oder Verwerfens knapp und würdig wieder.
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: von deinem Angesicht
  rationale: Bewahrt das Bild des griechischen προσώπου und den feierlichen Gebetsstil; gemeint ist die Entfernung aus Gottes Gegenwart.
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: deinen Heiligen Geist
  rationale: Entspricht der bestimmten, possessiven griechischen Formulierung und ist im Deutschen natürlich.
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: nimm … nicht von mir
  rationale: Gibt das Entfernen beziehungsweise Wegnehmen wieder, ohne durch „zurücknehmen“ eine im Griechischen nicht ausdrücklich formulierte Vorannahme einzutragen.
theological_decisions:
- issue: Das Wegnehmen des Heiligen Geistes
  choice: Die Bitte wird unmittelbar als „nimm deinen Heiligen Geist nicht von mir“ wiedergegeben.
  alternative: „Nimm deinen Heiligen Geist nicht zurück“ oder eine erklärende dogmatische Umschreibung.
  rationale: Die Übersetzung bewahrt die theologische Spannung der Bitte und vermeidet es, ihre Bedeutung durch eine konfessionelle Deutung festzulegen.
translation_notes:
  register: Moderner, würdiger Gebetsstil. „Angesicht“ ist bewusst bildhafter und feierlicher als „Gegenwart“, bleibt aber im heutigen Standarddeutsch verständlich.
