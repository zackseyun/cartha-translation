  text: ῥῦσαί με ἐξ αἱμάτων, ὁ θεός, ὁ θεὸς τῆς σωτηρίας μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/014.yaml
  text: Deliver me from bloodguilt, O God, the God of my salvation.
translation:
  language: de
  text: Rette mich von Blutschuld, o Gott, Gott meiner Rettung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαί με
  choice: Rette mich
  rationale: Der Imperativ bezeichnet die Bitte um Befreiung oder Errettung; „Rette mich“ ist natürlich und bewahrt den dringlichen Gebetscharakter.
- source_word: ἐξ αἱμάτων
  choice: von Blutschuld
  rationale: Der griechische Plural „Blut(taten)“ ist eine idiomatische Bezeichnung für Schuld an vergossenem Blut. „Blutschuld“ gibt den Sinn im Deutschen knapp und verständlich wieder.
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: du Gott meiner Rettung
  rationale: Die Genitivverbindung wird bewusst eng nachgebildet. „Rettung“ entspricht σωτηρία und hält sowohl erfahrene als auch erhoffte Rettung offen.
theological_decisions:
- issue: Bedeutung von ἐξ αἱμάτων
  choice: von Blutschuld
  alternative: von Blutvergießen / vor Bluttaten
  rationale: Der Kontext des zitierten Bußgebets legt Schuld an vergossenem Blut nahe. Die Übersetzung benennt diese moralische Dimension, ohne eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die wiederholte Gottesbezeichnung des Griechischen bleibt durch „Gott, du Gott …“ hörbar erhalten.
