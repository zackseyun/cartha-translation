source:
  edition: Funk 1901 (normalized OCR)
  text: καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: de
  text: 'Erschaffe in mir ein reines Herz, o Gott,

    und erneuere in meinem Innersten einen aufrichtigen Geist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κτίσον
  choice: Erschaffe
  rationale: Der Schöpfungsimperativ wird direkt und würdevoll wiedergegeben.
- source_word: καρδίαν καθαράν
  choice: ein reines Herz
  rationale: Die geläufige biblische Wendung entspricht der griechischen Wortverbindung genau.
- source_word: πνεῦμα εὐθές
  choice: einen aufrichtigen Geist
  rationale: εὐθύς bezeichnet hier einen geraden, redlichen bzw. beständigen Geist; „aufrichtig“ bewahrt den ethischen Sinn, ohne ihn konfessionell einzuengen.
- source_word: ἐγκαίνισον
  choice: erneuere
  rationale: Das Verb bezeichnet das Neu- bzw. Wiederherstellen und wird idiomatisch mit „erneuern“ wiedergegeben.
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: in meinem Innersten
  rationale: Die wörtliche Vorstellung der inneren Bereiche wird in natürlichem Deutsch bewahrt und nicht lediglich zu „in mir“ verallgemeinert.
theological_decisions:
- issue: Bedeutungsumfang von πνεῦμα εὐθές
  choice: aufrichtiger Geist
  alternative: beständiger Geist / rechter Geist
  rationale: „Aufrichtig“ bringt die Grundvorstellung des Geraden und Redlichen verständlich zum Ausdruck. „Beständig“ ist kontextuell möglich, aber lexikalisch stärker deutend; „rechter Geist“ wäre formnäher, klingt im heutigen Deutsch jedoch weniger natürlich.
translation_notes:
  register: Moderne, würdige Gebetssprache mit poetischem Zeilenumbruch. „O Gott“ wahrt den feierlichen Anruf; „in meinem Innersten“ erhält die konkrete Bildsprache des griechischen Textes.
