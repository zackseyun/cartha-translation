id: 1CLEM.18.4
reference: 1 Clement 18:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: de
  text: 'Gegen dich allein habe ich gesündigt

    und getan, was böse ist vor deinen Augen,

    damit du in deinen Worten als gerecht erwiesen wirst

    und siegst, wenn man über dich urteilt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und siegst, wenn du richtest«; auch möglich: »wenn du vor Gericht gehst«.'
    reason: Die mittel-passive Form κρίνεσθαι ist mehrdeutig; der zugrunde liegende hebräische Psalmtext wird meist aktiv verstanden.
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: gegen dich allein
  rationale: Gibt die exklusive Hervorhebung des griechischen Dativs natürlich und präzise wieder.
- source_word: τὸ πονηρὸν ἐνώπιόν σου
  choice: was böse ist vor deinen Augen
  rationale: Bewahrt die wertende Aussage und gibt ἐνώπιόν σου in der vertrauten, bildhaften deutschen Wendung wieder.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: du in deinen Worten als gerecht erwiesen wirst
  rationale: Das Passiv δικαιωθῇς wird beibehalten; die Formulierung bezeichnet die Bestätigung von Gottes Recht in seinen Worten.
- source_word: νικήσῃς
  choice: siegst
  rationale: Gibt die forensische Bedeutung des Verbs knapp wieder, ohne sie unnötig auszudeuten.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: wenn man über dich urteilt
  rationale: κρίνεσθαι ist formal mittel/passiv und in dieser Überlieferung umstritten. Die unpersönliche deutsche Form wahrt hier die passive Lesart, nach der Gott beurteilt wird, in natürlicher Sprache.
theological_decisions:
- issue: Rolle Gottes in ἐν τῷ κρίνεσθαί σε
  choice: wenn man über dich urteilt
  alternative: wenn du richtest / wenn du vor Gericht gehst
  rationale: Die griechische Form lässt morphologisch eine mittel-passive Deutung zu; zugleich steht hinter dem LXX-Zitat ein hebräischer Text, der gewöhnlich aktiv verstanden wird. Der Haupttext folgt der unmittelbar vorliegenden griechischen passiven Lesart, während die Fußnote die bedeutsame aktive beziehungsweise mediale Alternative offenlegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Zeilenbau entsprechend dem zitierten Psalm. Die Wendung »vor deinen Augen« ist idiomatisch und bewahrt das biblische Bild; die juristische Spannung der Schlusszeile wird nicht stillschweigend aufgelöst.
