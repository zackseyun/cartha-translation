  source_fidelity: Der deutsche Text gibt den griechischen Wortlaut zuverlässig wieder. »Gegen dich allein habe ich gesündigt« vermittelt die exklusive Akzentuierung von σοὶ μόνῳ idiomatisch. »Damit du in deinen Worten als gerecht erwiesen wirst« bildet δικαιωθῇς ἐν τοῖς λόγοις σου angemessen ab. Für ἐν τῷ κρίνεσθαί σε ist die passive Deutung im Haupttext sprachlich möglich; die Fußnote legt die wesentlichen medialen bzw. aktiven Deutungsmöglichkeiten offen, ohne die strittige Form zu einseitig aufzulösen.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch und bewahrt den poetisch-zitathaften Charakter. »Vor deinen Augen« und »wenn man über dich urteilt« sind natürlich und verständlich.
