  text: ἀκουτιεῖς με ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστᾶ τεταπεινωμένα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/008.yaml
  text: 'You will make me hear gladness and joy;

    the bones that have been humbled will rejoice.'
translation:
  language: de
  text: 'Du wirst mich Jubel und Freude hören lassen;

    die gedemütigten Gebeine werden jubeln.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  choice: Du wirst mich … hören lassen
  rationale: Gibt das futurische Kausativum direkt und in natürlichem, würdigem Deutsch wieder.
- source_word: ἀγαλλίασιν καὶ εὐφροσύνην
  choice: Jubel und Freude
  rationale: 'Bewahrt die beiden verwandten, aber unterscheidbaren Begriffe: ἀγαλλίασις als lebhafter Jubel, εὐφροσύνη als Freude.'
- source_word: ὀστᾶ τεταπεινωμένα
  choice: die gedemütigten Gebeine
  rationale: Die resultative Passivbedeutung des Partizips und das bildhafte, biblisch geprägte ὀστᾶ bleiben erhalten.
- source_word: ἀγαλλιάσονται
  choice: werden jubeln
  rationale: Entspricht dem Futur und nimmt die Wortverwandtschaft mit ἀγαλλίασιν erkennbar auf.
theological_decisions:
- issue: Bildsprache der gedemütigten Gebeine
  choice: Wörtliche Beibehaltung als „die gedemütigten Gebeine“
  alternative: „mein zerschlagener Körper“ oder eine andere deutende Umschreibung
  rationale: Der griechische Text lässt die metaphorische Beziehung von Erniedrigung, Zerbruch und Wiederherstellung offen; eine körperliche oder ausschließlich geistliche Deutung wird daher nicht festgelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht biblischem Klang. „Gebeine“ bewahrt die poetische Körpermetapher besser als das alltäglichere „Knochen“, ohne altertümlich unverständlich zu sein.
