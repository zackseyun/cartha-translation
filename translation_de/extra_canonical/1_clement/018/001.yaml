base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: de
  text: 'Was aber sollen wir über David sagen, dem Zeugnis gegeben worden ist? Zu ihm sagte Gott: »Ich habe einen Mann nach meinem Herzen gefunden, David, den Sohn Isais; in ewiger Barmherzigkeit habe ich ihn gesalbt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  choice: dem dieses Zeugnis ausgestellt wurde
  rationale: Das Perfektpartizip bezeichnet David als jemanden, über den ein bestätigendes Zeugnis vorliegt; die Formulierung bleibt nah am Griechischen und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit »bezeugt«.
- source_word: κατὰ τὴν καρδίαν μου
  choice: nach meinem Herzen
  rationale: Bewahrt die biblische Ausdrucksweise und ihre mögliche Bedeutungsspannweite, statt sie deutend als »ganz nach meinem Willen« aufzulösen.
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: mit ewiger Barmherzigkeit
  rationale: Gibt ἐν instrumental beziehungsweise modal wieder und erhält ἔλεος als »Barmherzigkeit« sowie αἰώνιος als »ewig«.
- source_word: ἔχρισα
  choice: habe ich … gesalbt
  rationale: Entspricht dem kultisch-königlichen Verb χρίω und wahrt dessen theologische Resonanz.
- source_word: Ἰεσσαί
  choice: Isais
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Namensform.
theological_decisions:
- issue: Bedeutung von »nach meinem Herzen«
  choice: Die idiomatische Bildsprache wird beibehalten.
  alternative: »ganz nach meinem Willen«
  rationale: Die aus der Schrift übernommene Wendung kann Übereinstimmung mit Gottes Wollen ausdrücken, sollte aber nicht auf eine einzige erklärende Paraphrase verengt werden.
- issue: Verhältnis von Barmherzigkeit und Salbung
  choice: »Mit ewiger Barmherzigkeit habe ich ihn gesalbt«
  alternative: »In ewiger Barmherzigkeit habe ich ihn gesalbt«
  rationale: »Mit« ist im Deutschen natürlicher und lässt die Barmherzigkeit als Art oder Grundlage der Salbung erkennen, ohne eine präzisere dogmatische Beziehung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter biblischer Bildsprache. Die einleitende Frage folgt der griechischen Syntax, während die Partizipialkonstruktion verständlich und ohne schwerfälligen Passivismus wiedergegeben wird.
