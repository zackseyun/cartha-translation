  source_fidelity: Die beiden finiten Verben der zweiten Satzhälften (καθαρισθήσομαι, λευκανθήσομαι) sind Zukunftspassive. Der Entwurf gibt die resultierende Bedeutung zwar verständlich wieder, schwächt jedoch die passive Form jeweils zu „rein werden“ bzw. „weißer werden“ ab. Eine passive Wiedergabe ist hier ohne Bedeutungszusatz möglich und entspricht auch der englischen Audit-Fassung genauer.
  naturalness: Die Parallelstruktur ist klar und würdig. „Ich werde gereinigt werden“ ist im kultisch-biblischen Register natürlich; „ich werde weißer als Schnee werden“ bewahrt den Vergleich und die resultative Bildsprache.
  terminology: „Ysop“ ist die übliche deutsche Bezeichnung für ὕσσωπος. „Besprengen“ und „waschen“ treffen die kultisch geprägten Bildverben. „Gereinigt werden“ hält die kultische wie die weiter gefasste Reinigungsdimension offen.
