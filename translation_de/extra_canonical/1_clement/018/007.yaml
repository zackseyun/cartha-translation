  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: de
  text: 'Du wirst mich mit Ysop besprengen, und ich werde gereinigt werden;


    du wirst mich waschen, und ich werde weißer als Schnee werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: du wirst … besprengen
  rationale: Gibt das kultisch geprägte Verb präzise und in natürlichem Deutsch wieder.
- source_word: ὑσσώπῳ
  choice: mit Ysop
  rationale: Bewahrt die konkrete Pflanze beziehungsweise das kultische Reinigungsmittel des Ausgangstextes.
- source_word: καθαρισθήσομαι
  choice: ich werde rein werden
  rationale: Gibt das passive Futur wieder, ohne die kultische und moralische Bedeutung auf nur eine Ebene festzulegen.
- source_word: πλυνεῖς
  choice: du wirst … waschen
  rationale: Direkte, idiomatische Wiedergabe des Futurs.
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: ich werde weißer werden als Schnee
  rationale: Bewahrt den Vergleich und die passive beziehungsweise resultative Aussage des griechischen Verbs.
theological_decisions:
- issue: Art der Reinigung
  choice: „rein werden“ ohne nähere Bestimmung
  alternative: „gereinigt werden“ oder ausdrücklich „von Sünde gereinigt werden“
  rationale: Der Text lässt die kultische und die moralisch-geistliche Dimension zusammenklingen; eine ausdrückliche Ergänzung würde diese Spannung einseitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem biblisch-kultischem Bild. Die parallele Satzstruktur des griechischen Textes bleibt erhalten.
