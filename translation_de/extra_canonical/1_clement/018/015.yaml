  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. κύριε, τὸ στόμα μου ἀνοίξεις, καὶ τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: de
  text: 'Meine Zunge wird über deine Gerechtigkeit jubeln.


    Herr, du wirst meinen Mund öffnen,


    und meine Lippen werden dein Lob verkünden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: wird … jubeln
  rationale: Gibt die intensive Freude des griechischen Verbs natürlich und würdevoll wieder.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Bewahrt den üblichen Bedeutungsumfang von δικαιοσύνη und lässt offen, ob besonders Gottes gerechtes Handeln oder seine Gerechtigkeit als Eigenschaft gemeint ist.
- source_word: ἀναγγελεῖ
  choice: wird … verkünden
  rationale: Entspricht dem öffentlichen Bekanntmachen oder Ausrufen, das das Verb bezeichnet.
- source_word: αἴνεσίν
  choice: Lob
  rationale: Eine natürliche deutsche Wiedergabe für den an Gott gerichteten beziehungsweise Gott geltenden Lobpreis.
theological_decisions:
- issue: Gottes Öffnen des Mundes
  choice: du wirst meinen Mund öffnen
  alternative: öffne meinen Mund
  rationale: Der überlieferte griechische Text hat die Zukunftsform ἀνοίξεις, nicht den Imperativ; die Übersetzung bewahrt diese grammatische Form und löst die Aussage nicht in eine Bitte um.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-gehobenem Klang. Die parallele Zeilenstruktur des griechischen Textes bleibt erhalten.
