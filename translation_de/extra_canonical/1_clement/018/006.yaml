  text: ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας· τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: de
  text: 'Denn sieh, du hast die Wahrheit geliebt;

    das Verborgene und das Geheime deiner Weisheit hast du mir offenbart.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Denn sieh
  rationale: Gibt sowohl die begründende Partikel γάρ als auch den aufmerksamkeitslenkenden Ausruf ἰδού in natürlichem, würdigem Deutsch wieder.
- source_word: ἀλήθειαν ἠγάπησας
  choice: du hast die Wahrheit geliebt
  rationale: Bewahrt die direkte und formal klare Aussage des griechischen Textes.
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  choice: das Verborgene und das Geheime
  rationale: 'Erhält die beiden weitgehend parallelen, aber nicht völlig identischen Begriffe: ἄδηλα bezeichnet das Nichtoffenbare, κρύφια das Verdeckte beziehungsweise Geheime.'
- source_word: τῆς σοφίας σου
  choice: deiner Weisheit
  rationale: Der Genitiv bleibt bewusst ähnlich offen wie im Griechischen und wird nicht erläuternd umgedeutet.
- source_word: ἐδήλωσάς μοι
  choice: hast du mir offenbart
  rationale: ‚Offenbart‘ bringt das Bekanntmachen zuvor verborgener Dinge idiomatisch zum Ausdruck und passt zum feierlichen Kontext.
theological_decisions:
- issue: Bezug des Genitivs τῆς σοφίας σου
  choice: „das Verborgene und das Geheime deiner Weisheit“
  alternative: „die verborgenen und geheimen Dinge über deine Weisheit“
  rationale: Die gewählte Fassung bewahrt die genitivische Mehrdeutigkeit und legt nicht fest, ob die Geheimnisse zur göttlichen Weisheit gehören oder deren Inhalt betreffen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, schriftgemäßem Ton. Die poetische Zweizeiligkeit und der Parallelismus des Ausgangstextes bleiben erhalten.
