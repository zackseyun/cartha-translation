  source_fidelity: 'Die Satzstruktur ist zutreffend wiedergegeben: ein kontrafaktischer Bedingungssatz mit Konjunktiv II (''wenn du ... gewollt hättest, hätte ich ...'') wird von der futurischen Aussage über die Brandopfer gefolgt. ''dargebracht'' ist im Opferkontext eine natürliche und sachlich vertretbare Wiedergabe von ἔδωκα. ''Schlachtopfer'' ist jedoch enger als das griechische θυσία, das hier zunächst allgemein ''Opfer'' bedeutet; die anschließenden ὁλοκαυτώματα bilden die spezifischere Kategorie.'
