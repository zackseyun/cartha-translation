  text: ὅτι εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν· ὁλοκαυτώματα οὐκ εὐδοκήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: de
  text: 'Denn wenn du ein Opfer gewollt hättest, hätte ich es dargebracht;


    an Brandopfern wirst du keinen Gefallen haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  choice: Schlachtopfer
  rationale: Bezeichnet hier ein dargebrachtes Opfer und wird zur Unterscheidung von den unmittelbar folgenden vollständigen Brandopfern konkret wiedergegeben.
- source_word: ἔδωκα ἄν
  choice: hätte ich es dargebracht
  rationale: Der irreale Bedingungssatz verlangt im Deutschen den Konjunktiv II; „darbringen“ ist für die Übergabe eines Opfers natürlicher und sachlich genauer als „geben“.
- source_word: ὁλοκαυτώματα
  choice: Brandopfern
  rationale: Das Wort bezeichnet Opfer, die vollständig verbrannt werden; „Brandopfer“ ist der geläufige deutsche Fachausdruck.
- source_word: οὐκ εὐδοκήσεις
  choice: wirst du kein Gefallen haben
  rationale: Bewahrt das Futur des griechischen Textes und gibt εὐδοκέω idiomatisch als Wohlgefallen an etwas haben wieder.
theological_decisions:
- issue: Verhältnis zwischen Opfer und Gottes Wohlgefallen
  choice: Die Aussage bleibt als kontrafaktische und anschließend futurische Formulierung stehen.
  alternative: Beide Verben präsentisch oder als allgemeine Ablehnung aller Opfer wiedergeben.
  rationale: Der griechische Wortlaut unterscheidet den irrealen Bedingungssatz von der Futurform und erklärt nicht ausdrücklich, ob nur diese konkrete Situation oder Opfer allgemein gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch vertrauter, aber verständlicher Opferterminologie; die poetische Zweizeiligkeit bleibt erhalten.
