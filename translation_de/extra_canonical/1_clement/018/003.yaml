source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: de
  text: 'Wasche mich immer mehr von meiner Gesetzlosigkeit,


    und reinige mich von meiner Sünde.


    Denn ich kenne meine Gesetzlosigkeit,


    und meine Sünde steht mir ständig vor Augen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον πλῦνόν με
  choice: Wasche mich gründlich
  rationale: Die Wendung bezeichnet ein verstärktes bzw. umfassenderes Waschen. „Gründlich“ gibt diesen Steigerungssinn im Deutschen natürlich wieder, ohne ein unidiomatisches „mehr und mehr“ zu erzwingen.
- source_word: ἀνομία
  choice: Gesetzlosigkeit
  rationale: Bewahrt den Bezug auf die Missachtung göttlicher Ordnung und unterscheidet den Ausdruck von ἁμαρτία.
- source_word: ἁμαρτία
  choice: Sünde
  rationale: Die geläufige und sachlich passende Wiedergabe; die Unterscheidung von ἀνομία bleibt erhalten.
- source_word: διαπαντός
  choice: allezeit
  rationale: Gibt die Bedeutung „fortwährend, ständig“ in würdigem und verständlichem Deutsch wieder.
theological_decisions:
- issue: Verhältnis von ἀνομία und ἁμαρτία
  choice: „Gesetzlosigkeit“ und „Sünde“ werden als verschiedene deutsche Begriffe beibehalten.
  alternative: Beide Begriffe könnten vereinheitlichend mit „Schuld“ oder „Sünde“ übersetzt werden.
  rationale: Der griechische Text verwendet bewusst unterschiedliche Wörter; die Übersetzung bewahrt diese Spannung, ohne eine weitergehende theologische Unterscheidung festzuschreiben.
- issue: Bildhafte Formulierung ἐνώπιόν μου
  choice: „steht mir … vor Augen“
  alternative: 'Wörtlicher: „ist beständig vor mir“.'
  rationale: Die idiomatische deutsche Wendung bewahrt das Bild der unausweichlichen Gegenwart und bewussten Wahrnehmung der Sünde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die Formulierungen bleiben nahe am griechischen Wortlaut, vermeiden jedoch unnötige Wörtlichkeit.
