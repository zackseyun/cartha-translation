  source_fidelity: 'Der Sinn wird insgesamt zuverlässig wiedergegeben: ἀλλὰ καὶ αὐτός ist mit „Doch auch er selbst“ angemessen nachdrücklich erfasst, und ἀνόμημα bleibt als abstrakte „Gesetzlosigkeit“ erhalten. „Sei mir gnädig“ ist jedoch gegenüber dem direkten Imperativ ἐλέησόν με weniger genau; „Erbarme dich meiner“ bildet die Bitte um Erbarmen unmittelbar ab. Für τῶν οἰκτιρμῶν ist der Plural in einer poetisch-schriftsprachlichen Übersetzung ohne Härte bewahrbar.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und der Zeilenfall funktioniert gut. „Erbarme dich meiner“ ist trotz gehobenen Registers idiomatisch und in einem Psalmzitat natürlicher als eine Umschreibung mit „gnädig sein“.
  terminology: Die Unterscheidung von „Barmherzigkeit“ für ἔλεος und „Erbarmungen“ für οἰκτιρμοί ist sinnvoll. „Gesetzlosigkeit“ gibt ἀνόμημα sachgerecht wieder, ohne es auf eine Einzeltat zu beschränken.
