id: 1CLEM.18.2
reference: 1 Clement 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: de
  text: 'Doch auch er selbst sagt zu Gott:


    Erbarme dich meiner, Gott, nach deiner großen Barmherzigkeit,


    und nach der Fülle deiner Erbarmungen tilge meine Gesetzlosigkeit aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέησόν με
  choice: Sei mir gnädig
  rationale: Gibt den Ruf um göttliches Erbarmen natürlich und würdig wieder; ebenso möglich wäre »Erbarme dich über mich«.
- source_word: τὸ μέγα ἔλεός σου
  choice: deine große Barmherzigkeit
  rationale: Bewahrt das Substantiv ἔλεος und den ausdrücklich genannten hohen Grad μέγα.
- source_word: τὸ πλῆθος τῶν οἰκτιρμῶν σου
  choice: die Fülle deines Erbarmens
  rationale: Natürliches Deutsch für die große Menge der göttlichen Regungen des Mitleids; der griechische Plural wird idiomatisch als Kollektivsingular wiedergegeben.
- source_word: ἐξάλειψον
  choice: tilge … aus
  rationale: Bewahrt das Bild des vollständigen Auslöschens beziehungsweise Wegwischens.
- source_word: τὸ ἀνόμημά μου
  choice: meine Gesetzlosigkeit
  rationale: Gibt das singuläre Abstraktum quellennah wieder, ohne es auf eine bestimmte gesetzlose Tat einzuengen.
theological_decisions:
- issue: Nachdruck in καὶ αὐτός
  choice: auch er selbst
  alternative: auch er
  rationale: 'Bewahrt sowohl καί als auch das emphatische αὐτός und damit den Kontrast: Gott redete zu David, doch David selbst redet seinerseits zu Gott.'
- issue: Verhältnis von ἔλεος und οἰκτιρμοί
  choice: Barmherzigkeit / Erbarmen
  alternative: Gnade / Erbarmungen
  rationale: Die verwandten, aber nicht identischen Begriffe bleiben unterscheidbar, ohne eine konfessionell geprägte Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Zeilenfall für das Schriftzitat. Die Anrede »Gott« statt »o Gott« vermeidet unnötig altertümlichen Ton. Keine Fußnote erforderlich.
