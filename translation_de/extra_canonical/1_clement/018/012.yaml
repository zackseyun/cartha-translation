source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: de
  text: 'Gib mir die Freude über dein Heil zurück[a],


    und stütze mich durch einen führenden Geist[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „den Jubel deines Heils“.'
    reason: Bewahrt die intensive, jubelnde Nuance von ἀγαλλίασις.
  - marker: b
    text: 'Auch möglich: „einen leitenden Geist“ oder „einen herrschenden Geist“; nach dem hebräischen Psalmtext wird traditionell auch „einen willigen Geist“ übersetzt.'
    reason: Dokumentiert den Bedeutungsumfang von ἡγεμονικός und unterscheidet die griechische Formulierung von der traditionellen, am Hebräischen orientierten Wiedergabe.
lexical_decisions:
- source_word: ἀπόδος
  choice: gib … zurück
  rationale: Gibt die Bedeutung des Wiedergebens oder Wiederherstellens natürlich wieder.
- source_word: ἀγαλλίασιν
  choice: Freude
  rationale: Bezeichnet eine lebhafte, jubelnde Freude; „Freude“ ist im Haupttext natürlich und verständlich, während die stärkere Nuance in der Fußnote erhalten bleibt.
- source_word: σωτηρίου
  choice: Heil
  rationale: Das substantivierte σωτήριον bezeichnet hier Gottes rettendes Heil; „Heil“ wahrt den biblisch-dignifizierten Ton.
- source_word: στήριξόν
  choice: stütze
  rationale: Bewahrt das Bild des Festmachens und Aufrechterhaltens besser als ein bloß innerliches „ermutige“.
- source_word: πνεύματι ἡγεμονικῷ
  choice: durch einen leitenden Geist
  rationale: ἡγεμονικός bezeichnet grundlegend etwas Leitendes oder Führendes. Die Formulierung bleibt nahe am griechischen Text und vermeidet, die aus dem hebräischen Paralleltext bekannte Deutung „willig“ ohne Kennzeichnung in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: Die Übersetzung lässt offen, ob der Geist als von Gott gewährte Kraft, als menschliche innere Haltung oder in anderer Weise verstanden wird.
  alternative: Explizit „mein Geist“ oder „dein Geist“ schreiben.
  rationale: Der griechische Text enthält weder ein Possessivpronomen noch eine ausdrückliche Identifizierung des Geistes.
- issue: Bedeutung von ἡγεμονικός
  choice: „leitend“ im Haupttext, mit Alternativen in der Fußnote
  alternative: „willig“ oder „herrschend“ ohne Fußnote
  rationale: Der griechische Ausdruck trägt eine Leitungs- beziehungsweise Führungsnuance; die traditionelle Wiedergabe „willig“ beruht stark auf dem hebräischen Psalmtext. Die Fußnote bewahrt die Auslegungsspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Zweizeiligkeit des Psalmzitats bleibt erhalten; „Heil“ wahrt den biblischen Ton, ohne altertümliche Syntax zu verwenden.
