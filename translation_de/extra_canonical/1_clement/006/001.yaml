source:
  edition: Funk 1901 (normalized OCR)
  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: de
  text: Zu diesen Männern, die fromm gelebt hatten, gesellte sich eine große Schar Auserwählter. Sie erlitten wegen Eifersucht[a] viele Misshandlungen und Foltern und wurden unter uns zu einem überaus schönen Vorbild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen Eifer«. Das griechische ζῆλος kann sowohl »Eifersucht« als auch »Eifer« bedeuten; der Zusammenhang legt »Eifersucht« nahe.'
    reason: Markiert die lexikalische Mehrdeutigkeit von ζῆλος, ohne ein Motiv der leidenden Auserwählten zu unterstellen.
lexical_decisions:
- source_word: ὁσίως πολιτευσαμένοις
  choice: die ein heiliges Leben geführt hatten
  rationale: Gibt das adverbiale ὁσίως und das auf die Lebensführung bezogene πολιτεύομαι natürlich und würdevoll wieder.
- source_word: συνηθροίσθη
  choice: wurde ... zugesellt
  rationale: Bewahrt die passive Form und den Gedanken, dass die große Schar zu den zuvor genannten Männern hinzukam.
- source_word: πολὺ πλῆθος ἐκλεκτῶν
  choice: eine große Schar von Auserwählten
  rationale: Entspricht der Mengenangabe und lässt den substantivischen theologischen Ausdruck ἐκλεκτῶν stehen.
- source_word: αἰκίαις καὶ βασάνοις
  choice: Misshandlungen und Foltern
  rationale: αἰκία bezeichnet entwürdigende bzw. gewaltsame Misshandlung, βάσανος hier körperliche Qual oder Folter.
- source_word: ὑπόδειγμα κάλλιστον
  choice: ein überaus schönes Vorbild
  rationale: Bewahrt sowohl die Vorbildfunktion von ὑπόδειγμα als auch die auffällige ästhetische Wertung des Superlativs κάλλιστον.
- source_word: ἐν ἡμῖν
  choice: unter uns
  rationale: Die örtlich-gemeinschaftliche Wendung wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung und Bezug von διὰ ζῆλος
  choice: aus Eifersucht
  alternative: wegen Eifersucht / durch Eifer
  rationale: ζῆλος kann je nach Kontext Eifer oder Eifersucht bedeuten; der Zusammenhang der Verfolgung spricht für Eifersucht. Die Fußnote weist auf die grammatische Bezugsambiguität hin.
- issue: Bezeichnung ἐκλεκτῶν
  choice: Auserwählten
  alternative: Erwählten
  rationale: Der substantivierte Ausdruck bleibt theologisch offen und wird nicht näher konfessionell bestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die Partizipialbeziehungen und die zeitliche Abfolge bleiben erhalten.
