revisions:
- from: Diesen Männern, die ein heiliges Leben geführt hatten, wurde eine große Schar von Auserwählten zugesellt. Sie hatten aus Eifersucht[a] viele Misshandlungen und Foltern erlitten und wurden zu einem überaus schönen Vorbild unter uns.
  to: Zu diesen Männern, die fromm gelebt hatten, gesellte sich eine große Schar Auserwählter. Sie erlitten wegen Eifersucht[a] viele Misshandlungen und Foltern und wurden unter uns zu einem überaus schönen Vorbild.
  rationale: Die Revision beseitigt eine mögliche deutsche Fehlzuordnung des Motivs, glättet die Wiedergabe von συνηθροίσθη und präzisiert die Fußnote. Aussagegehalt, zeitliche Abfolge und die offene theologische Bezeichnung »Auserwählte« bleiben erhalten.
