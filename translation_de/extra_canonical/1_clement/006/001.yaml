review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Sinn des griechischen Satzes sind zutreffend erfasst. »Aus Eifersucht« kann im Deutschen jedoch nahelegen, dass die Auserwählten selbst aus diesem Motiv handelten. διὰ ζῆλος bezeichnet hier natürlicher den Grund ihrer Leiden. ὁσίως ist mit »fromm« idiomatischer und semantisch genauer als »ein heiliges Leben«.
  naturalness: Die Satzteilung ist verständlich, doch »wurde ... zugesellt« wirkt im modernen Standarddeutsch passivisch-ungewöhnlich. »Gesellte sich ... an« gibt die Anschlussbewegung natürlich wieder. »Eine große Schar Auserwählter« ist zudem knapper und idiomatisch.
  terminology: »Auserwählte«, »Misshandlungen und Foltern« sowie »Vorbild« sind angemessen. Der Superlativ κάλλιστον wird mit »überaus schön« bewusst sichtbar beibehalten. Die Fußnote sollte nicht eine im Deutschen kaum tragfähige instrumentale Nuance behaupten, sondern die mögliche Bedeutung von ζῆλος transparent machen.
  issues:
  - severity: medium
    issue: »aus Eifersucht«
    rationale: Diese deutsche Wendung kann das Motiv dem Subjekt des Satzes zuschreiben. Der griechische Kontext und διὰ mit Akkusativ legen vielmehr den Anlass bzw. Grund nahe, aus dem die Auserwählten litten.
  - severity: low
    issue: »wurde ... zugesellt«
    rationale: Formal möglich, aber in modernem Deutsch unidiomatisch. Eine reflexiv-aktive Wiedergabe der passivischen Sammelbewegung ist natürlicher und wahrt den Sinn.
  - severity: low
    issue: Fußnotentext zu διὰ ζῆλος
    rationale: Die vorgeschlagene instrumentale Alternative »durch Eifersucht« ist im Deutschen semantisch unklar. Die tatsächlich relevante lexikalische Spannweite von ζῆλος lässt sich präziser markieren.
