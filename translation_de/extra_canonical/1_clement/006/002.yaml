    rationale: Die Anspielung auf Danaiden und Dirken ist klar mythologisch, ihre genaue historische Umsetzung bleibt aber unsicher; der Hinweis auf öffentliche Schauspiele sollte nicht stärker behauptet werden als der Text hergibt.
