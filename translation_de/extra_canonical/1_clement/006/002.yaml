  to: Aus Eifersucht wurden Frauen als Danaiden und Dirken[a] verfolgt. Nachdem sie schreckliche und frevelhafte Misshandlungen erlitten hatten, gelangten sie auf die feste Bahn des Glaubens und empfingen einen ehrenvollen Lohn – sie, die körperlich schwach waren.
  rationale: Die Revision korrigiert vor allem die Verschiebung bei βέβαιον und vermeidet die unnötige Einengung von γέρας auf einen ausdrücklich als Sieg bezeichneten Preis. Die in der maßgeblichen Überlieferung naheliegende Lesart ἀνόσια wird weiterhin mit „frevelhafte“ berücksichtigt, während die Fußnote die umstrittene historische Anspielung zurückhaltender formuliert.
