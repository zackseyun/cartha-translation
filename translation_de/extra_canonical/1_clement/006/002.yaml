  source_fidelity: 'Die Übersetzung gibt den Satzbau, die Verfolgung aus ζῆλος, die mythologischen Bezeichnungen, das Erleiden von Misshandlungen sowie Lohn und körperliche Schwäche im Wesentlichen zutreffend wieder. Für αἰκίσματα δεινὰ καὶ ἀνδρία ist der überlieferte Kontext zu beachten: Das OCR bietet offenbar die sinnwidrige Verlesung ἀνδρία; die von der Edition und dem Zusammenhang gestützte Lesart ἀνόσια rechtfertigt „frevelhafte“. Die Wiedergabe von βέβαιον durch „standhaft“ verschiebt jedoch die Aussage: βέβαιον beschreibt den Lauf/Weg als fest bzw. sicher, nicht primär die Haltung der Frauen.'
