  terminology: „Eifersucht“, „Danaiden und Dirken“, „frevelhafte Misshandlungen“ und „körperlich schwach“ sind angemessen. „Siegespreis“ ist durch die Laufmetapher verständlich, aber γέρας bezeichnet allgemeiner einen ehrenvollen Lohn bzw. eine Auszeichnung; „ehrenvoller Lohn“ ist genauer, ohne einen ausdrücklich genannten Sieg vorauszusetzen.
  issues:
