base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: de
  text: Aus Eifersucht wurden Frauen als Danaiden und Dirken[a] verfolgt. Nachdem sie schreckliche und frevelhafte Misshandlungen erlitten hatten, gelangten sie auf die feste Bahn des Glaubens und empfingen einen ehrenvollen Lohn – sie, die körperlich schwach waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Danaiden und Dirken“ spielt wahrscheinlich auf mythologische Figuren und die mit ihnen verbundenen Bestrafungen an. Wie diese Anspielung historisch genau zu verstehen ist, bleibt unsicher.
    reason: Die mythologischen Bezeichnungen werden im Text bewahrt; die Fußnote erläutert die Anspielung, ohne eine konkrete historische Rekonstruktion vorauszusetzen.
lexical_decisions:
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Der Zusammenhang des Kapitels beschreibt zerstörerische Missgunst und Rivalität; „Eifersucht“ gibt diese negative Bedeutung im heutigen Deutsch verständlich wieder.
- source_word: Δαναΐδες καὶ Δίρκαι
  choice: als Danaiden und Dirken
  rationale: Die mythologischen Bezeichnungen bleiben erhalten. „als“ macht wahrscheinlich, dass die Frauen bei öffentlichen Misshandlungen in entsprechenden Rollen dargestellt wurden, ohne die historisch nicht völlig klare Anspielung auszudeuten.
- source_word: αἰκίσματα δεινὰ καὶ ἀνδρία
  choice: schreckliche und frevelhafte Misshandlungen
  rationale: „Misshandlungen“ entspricht αἰκίσματα. Die überlieferte Lesart ist an dieser Stelle unsicher; „frevelhaft“ folgt der in Editionen und der antiken Überlieferung weithin vorausgesetzten Lesart ἀνόσια („unheilig, frevelhaft“) statt des im bereitgestellten OCR-Text stehenden, im Kontext schwer verständlichen ἀνδρία.
- source_word: τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: vollendeten sie standhaft den Lauf des Glaubens
  rationale: Die griechische Wettlaufmetapher wird bewahrt. „standhaft“ gibt βέβαιον idiomatisch wieder, während „vollendeten“ das Erreichen des Endpunkts ausdrückt, ohne δρόμος fälschlich selbst als „Ziel“ zu übersetzen.
- source_word: γέρας γενναῖον
  choice: ruhmvollen Siegespreis
  rationale: γέρας bezeichnet einen Ehren- oder Siegespreis; γενναῖον hebt dessen hohen, edlen Rang hervor.
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: sie, die körperlich schwach waren
  rationale: Die nachgestellte, kontrastierende Betonung des griechischen Ausdrucks bleibt durch den Gedankenstrich erhalten.
theological_decisions:
- issue: Bedeutung des Glaubenslaufs
  choice: Die Aussage bleibt als Bild für standhaftes Vollenden unter Verfolgung formuliert.
  alternative: Den Lauf ausdrücklich als Martyrium, Heilsweg oder Erlangung des ewigen Lebens erklären.
  rationale: Der griechische Text nennt nur den „Lauf des Glaubens“ und den Ehrenpreis; eine genauere dogmatische Bestimmung würde mehr festlegen, als der Wortlaut sagt.
- issue: Ursache der Verfolgung
  choice: ζῆλος wird als menschliche „Eifersucht“ wiedergegeben.
  alternative: „Eifer“ im positiven religiösen Sinn oder „Neid“.
  rationale: Der weitere Kontext stellt ζῆλος neben Streit und beschreibt seine zerstörerischen Folgen. „Eifersucht“ wahrt den Leitbegriff des Abschnitts, während „Neid“ ebenfalls möglich wäre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sätze sind klar gegliedert, die Wettlauf- und Siegespreis-Metaphorik bleibt erhalten. Der ungewöhnliche mythologische Ausdruck wird im Haupttext bewahrt und durch eine sparsame Fußnote erläutert.
