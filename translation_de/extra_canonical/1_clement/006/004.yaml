  yaml_path: translation/extra_canonical/1_clement/006/004.yaml
  text: Because of jealousy and strife, great cities have been overthrown and great nations uprooted.
translation:
  language: de
  text: Eifersucht und Streit haben große Städte zerstört und große Völker entwurzelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im Zusammenhang bezeichnet das Wort eine zerstörerische Eifersucht beziehungsweise Missgunst; „Eifersucht“ hält den Leitbegriff des Abschnitts klar fest.
- source_word: ἔρις
  choice: Streit
  rationale: Gibt den gemeinschaftszerstörenden Konflikt natürlich und prägnant wieder.
- source_word: κατέστρεψεν
  choice: haben … zerstört
  rationale: Das griechische Verb steht aktiv und bezeichnet hier die Zerstörung großer Städte; die deutsche Pluralform entspricht dem zusammengesetzten Subjekt.
- source_word: ἔθνη μεγάλα
  choice: große Völker
  rationale: „Völker“ ist in diesem historischen Zusammenhang die natürliche Wiedergabe von ἔθνη und bewahrt die Parallele zu den großen Städten.
- source_word: ἐξερίζωσεν
  choice: entwurzelt
  rationale: Bewahrt das kräftige Bild des griechischen Verbs und passt sowohl wörtlich als auch übertragen auf Völker.
