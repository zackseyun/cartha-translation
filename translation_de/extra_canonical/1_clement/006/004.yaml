  register: Knapp, würdevoll und warnend. Die aktive Satzstruktur des griechischen Textes bleibt erhalten; anders als in der englischen Beratungsschicht enthält Vers 4 kein διὰ und wird daher nicht mit „wegen“ eingeleitet.
