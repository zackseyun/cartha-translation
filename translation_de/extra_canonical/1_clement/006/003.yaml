base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: de
  text: 'Eifersucht entfremdete Frauen ihren Ehemännern und veränderte, was unser Vater Adam gesagt hatte: „Das ist nun Knochen von meinen Knochen und Fleisch von meinem Fleisch.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im Zusammenhang bezeichnet das Wort eine zerstörerische, zwischenmenschliche Eifersucht beziehungsweise Missgunst; „Eifersucht“ passt besonders zur Entfremdung von Ehepartnern.
- source_word: ἀπηλλοτρίωσεν
  choice: entfremdete
  rationale: Gibt die bewirkte Trennung und den Verlust ehelicher Verbundenheit prägnant wieder.
- source_word: ἠλλοίωσεν
  choice: verdrehte
  rationale: 'Hier ist nicht bloß eine neutrale Veränderung gemeint: Eifersucht verkehrt die von Adam ausgesprochene Einheit ins Gegenteil.'
- source_word: ὀστοῦν ἐκ τῶν ὀστέων μου
  choice: Gebein von meinem Gebein
  rationale: Bewahrt die feierliche, formelhafte Sprache des Genesis-Zitats und bildet Singular und Plural des Griechischen angemessen ab.
theological_decisions:
- issue: Wirkung der Eifersucht auf Adams Ausspruch
  choice: „verdrehte“
  alternative: „veränderte“
  rationale: Der Satz beschreibt, wie Eifersucht die in Adams Worten bezeugte Einheit praktisch ins Gegenteil verkehrt; die Übersetzung macht diese negative Stoßrichtung deutlich, ohne eine Änderung am Schrifttext selbst zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; das Genesis-Zitat bleibt bewusst leicht gehoben und formelhaft.
