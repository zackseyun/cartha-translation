  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: de
  text: So erhoben sich die Geringgeachteten gegen die Hochgeachteten, die Unberühmten gegen die Berühmten, die Unvernünftigen gegen die Verständigen, die Jungen gegen die Älteren[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ältesten“. Das griechische Wort kann allgemein ältere Personen und, je nach Zusammenhang, auch Älteste bzw. Gemeindeleiter bezeichnen.'
    reason: Bewahrt die im griechischen πρεσβυτέρους vorhandene kontextuelle Ambiguität, ohne im Haupttext eine Amtsbedeutung festzulegen.
lexical_decisions:
- source_word: οἱ ἄτιμοι / τοὺς ἐντίμους
  choice: die Verachteten / die Angesehenen
  rationale: Gibt den Gegensatz von fehlender und vorhandener gesellschaftlicher Ehre natürlich und prägnant wieder.
- source_word: οἱ ἄδοξοι / τοὺς ἐνδόξους
  choice: die Ruhmlosen / die Ruhmreichen
  rationale: Bewahrt die bewusste Parallelität und den Gegensatz des griechischen Wortpaares.
- source_word: οἱ ἄφρονες / τοὺς φρονίμους
  choice: die Unvernünftigen / die Verständigen
  rationale: Bezeichnet den Gegensatz zwischen mangelnder Einsicht und verständigem Urteilsvermögen, ohne ihn moralisch oder theologisch zu verengen.
- source_word: οἱ νέοι / τοὺς πρεσβυτέρους
  choice: die Jungen / die Älteren
  rationale: Gibt zunächst den Alterskontrast wieder; πρεσβύτεροι kann im Zusammenhang auch Älteste beziehungsweise Gemeindeleiter bezeichnen.
- source_word: ἐπηγέρθησαν ἐπί
  choice: erhoben sich gegen
  rationale: Bildet die feindliche Auflehnung und die wiederholte Konstruktion des Ausgangstextes idiomatisch ab.
theological_decisions:
- issue: Bedeutung von πρεσβύτεροι
  choice: die Älteren
  alternative: die Ältesten
  rationale: Der unmittelbare Parallelismus stellt gesellschaftliche und altersbezogene Gegensätze gegenüber. Da zugleich ein gemeindliches Leitungsamt anklingen kann, wird diese mögliche Bedeutung nicht durch eine eindeutige Amtsbezeichnung in den Haupttext eingetragen.
translation_notes:
  register: Dignifiziierter, moderner Standardstil. Die viergliedrige anaphorische Reihung und die scharfen Gegensatzpaare des Griechischen bleiben erhalten.
