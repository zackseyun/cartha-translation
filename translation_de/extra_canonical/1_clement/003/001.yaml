id: 1CLEM.3.1
reference: 1 Clement 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: de
  text: 'Alle Herrlichkeit und aller Überfluss wurden euch gegeben, und es erfüllte sich, was geschrieben steht: »Er aß und trank, wurde breit und fett, und der Geliebte schlug aus.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Gibt den weiten Bedeutungsbereich von Ansehen, Ehre und glanzvoller Stellung in würdigem Deutsch wieder, ohne ihn vorschnell auf bloßen Ruhm einzuengen.
- source_word: πλατυσμός
  choice: Überfluss
  rationale: Bezeichnet hier im Zusammenhang mit Essen, Trinken und Fettwerden eine üppige, wohlhabende Lebenslage; das wörtliche »Weite« wäre im Deutschen missverständlich.
- source_word: ἐπλατύνθη καὶ ἐπαχύνθη
  choice: wurde breit und fett
  rationale: Bewahrt das anschauliche Bild des griechischen Zitats und die parallelen Zustandsveränderungen.
- source_word: ἀπελάκτισεν
  choice: schlug aus
  rationale: Gibt das Bild eines widerspenstigen, überfütterten Tieres sowie den darin liegenden Gedanken der Auflehnung natürlich wieder.
- source_word: ὁ ἠγαπημένος
  choice: der Geliebte
  rationale: Folgt der substantivierten Passivform und wahrt die auffällige Bezeichnung des zitierten Volkes bzw. der zitierten Gestalt.
theological_decisions:
- issue: Bezug des Schriftzitats und Bezeichnung ὁ ἠγαπημένος
  choice: Die metaphorische Form »der Geliebte schlug aus« bleibt stehen.
  alternative: Explizit »Israel lehnte sich auf« oder nach Deuteronomium 32,15 »Jeschurun schlug aus«.
  rationale: Der vorliegende griechische Text nennt weder Israel noch Jeschurun, sondern formuliert »der Geliebte«. Die Übersetzung bewahrt daher Wortlaut, Metapher und mögliche intertextuelle Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Schriftzitat bleibt bildhaft und leicht fremdartig; »schlug aus« ist idiomatisch verständlich und vermeidet die missverständliche Vorstellung eines bloßen Tritts oder eines entspannten Zurücklehnens.
