  source_fidelity: Die Übersetzung gibt die kausale Einleitung Ἐκ τούτου sowie die vier paarweise gereihten Folgen präzise wieder. „Eifersucht und Neid“ bewahrt die Unterscheidung von ζῆλος und φθόνος; „Aufruhr“ ist für στάσις im Sinn von konfliktiver innerer Erhebung bzw. Parteienstreit tragfähig. Auch „Unordnung“ für ἀκαταστασία und „Gefangenschaft“ für αἰχμαλωσία entsprechen dem griechischen Sinn und der knappen Reihung.
