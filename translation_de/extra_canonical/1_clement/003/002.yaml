base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/002.yaml
  text: From this came jealousy and envy, strife and faction, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became shortsighted in faith in him, neither walking in the lawful ways of his commandments nor conducting himself in a manner fitting for the Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy, through which death also entered into the world.
translation:
  language: de
  text: Daraus entstanden Eifersucht und Neid, Streit und Aufruhr, Verfolgung und Unordnung, Krieg und Gefangenschaft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im negativen Zusammenhang bezeichnet das Wort missgünstige Eifersucht; die Wiedergabe hält es zugleich von φθόνος („Neid“) unterscheidbar.
- source_word: στάσις
  choice: Aufruhr
  rationale: Das Wort meint hier nicht nur eine Meinungsverschiedenheit, sondern parteiliche Erhebung und inneren Unfrieden.
- source_word: ἀκαταστασία
  choice: Unordnung
  rationale: Die Übersetzung bewahrt den weiten Sinn von Instabilität, Wirren und ungeordneten Zuständen, ohne ihn unnötig zu verengen.
- source_word: αἰχμαλωσία
  choice: Gefangenschaft
  rationale: Dies ist die direkte und im Zusammenhang mit Krieg natürliche Entsprechung.
