id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: de
  text: Darum sind Gerechtigkeit und Frieden weit weggerückt, weil jeder die Furcht Gottes aufgegeben hatte und im Glauben an ihn[a] kurzsichtig geworden war, weder nach den Satzungen seiner Gebote wandelte noch so lebte, wie es Christus entspricht, sondern jeder den Begierden seines bösen Herzens folgte und sich ungerechten und gottlosen Neid[b] zu eigen gemacht hatte, durch den auch der Tod in die Welt kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in seinem Glauben; auch: in seiner Treue.'
    reason: Der Genitiv αὐτοῦ kann objektiv oder possessiv verstanden werden.
  - marker: b
    text: Das griechische Wort kann auch „Eifersucht“ oder „Eifer“ bedeuten.
    reason: ζῆλος besitzt eine größere Bedeutungsbreite als das im Kontext naheliegende „Neid“.
lexical_decisions:
- source_word: πόρρω ἀπέστη
  choice: haben sich … weit entfernt
  rationale: Gibt die räumliche Metapher des griechischen Ausdrucks natürlich und ohne Abschwächung wieder.
- source_word: ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι
  choice: nach den Satzungen seiner Gebote leben
  rationale: νόμιμα bezeichnet festgesetzte Satzungen oder Ordnungen; πορεύεσθαι ist hier als Bild für die Lebensführung gebraucht.
- source_word: πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ
  choice: ein Leben führen, wie es Christus entspricht
  rationale: πολιτεύεσθαι bezeichnet die Lebensführung; das offenbar für καθῆκον stehende OCR καλῆκον meint das Angemessene oder Gebührende. Die Formulierung wahrt den Bezug auf Christus, ohne ihn konfessionell auszudeuten.
- source_word: ἐπιθυμίας
  choice: Begierden
  rationale: Bewahrt die negative moralische Färbung, die hier durch das böse Herz ausdrücklich festgelegt ist.
- source_word: ζῆλον
  choice: Neid
  rationale: Im Kontext von Streit und vom Eintritt des Todes in die Welt ist destruktiver Neid gemeint; die breitere Bedeutungsweite des Wortes wird in einer Fußnote kenntlich gemacht.
- source_word: ἀμβλυωπῆσαι
  choice: kurzsichtig geworden
  rationale: Bewahrt das prägnante Bild eingeschränkter Sehkraft, statt es allgemein als geistliche Schwäche zu paraphrasieren.
theological_decisions:
- issue: Bezug von αὐτοῦ in ἐν τῇ πίστει αὐτοῦ
  choice: im Glauben an ihn
  alternative: in seinem Glauben / in seiner Treue
  rationale: Der vorausgehende Bezug auf Gott macht einen objektiven Genitiv plausibel. Da der Genitiv grammatisch auch possessiv verstanden werden kann, bleibt die Alternative in der Fußnote sichtbar.
- issue: Bedeutung von Χριστός
  choice: Christus
  alternative: der Messias
  rationale: In diesem frühchristlichen Brief ist Χριστός die etablierte Bezeichnung für Jesus; „Christus“ wahrt Register und historischen Adressatenkontext, ohne den Titel erklärend umzudeuten.
- issue: Anspielung auf den Eintritt des Todes in die Welt
  choice: durch den auch der Tod in die Welt gekommen ist
  alternative: keine ausdrückliche Identifizierung mit einer bestimmten biblischen Gestalt
  rationale: Der Wortlaut wird beibehalten, ohne den genannten Neid eigenmächtig dem Teufel, Kain oder einer anderen Gestalt zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden griechischen Verben für Lebensführung werden ohne schwerfällige Doppelung wiedergegeben; der Wechsel von „jeder“ zu „keiner“ und zurück zu „jeder“ bildet die negative Parallelstruktur idiomatisch ab. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
