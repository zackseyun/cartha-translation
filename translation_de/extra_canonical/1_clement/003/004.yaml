  source_fidelity: 'Die Grundwiedergabe trifft den Sinn des griechischen Satzes weitgehend: das Fernrücken von Gerechtigkeit und Frieden, die Aufgabe der Gottesfurcht, die Bildsprache von ἀμβλυωπῆσαι, die beiden Aspekte der Lebensführung, die Begierden des bösen Herzens und den Eintritt des Todes. Der Bezug von αὐτοῦ bei πίστει bleibt grammatisch nicht völlig eindeutig; die objektive Wiedergabe „Glauben an ihn“ ist möglich und durch die Fußnote angemessen abgesichert.'
  naturalness: Der Text ist überwiegend modernes, würdiges Deutsch. Allerdings erzeugt der Wechsel von „Jeder“ zu „Keiner“ und insbesondere zu „sie haben“ einen unnötigen Wechsel der Bezugsgröße. „Neid angenommen“ ist zudem für ἀνειληφότας weniger präzise und weniger idiomatisch als „sich ... zu eigen gemacht“.
  terminology: „Satzungen seiner Gebote“, „Christus“, „Begierden“ und „gottlos“ sind angemessen. „Neid“ ist im Kontext vertretbar; die Fußnote nennt zutreffend die weitere Bedeutung von ζῆλος. Die Fußnote zu αὐτοῦ wahrt die notwendige Auslegungszurückhaltung.
