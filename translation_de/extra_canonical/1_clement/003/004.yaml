  - severity: low
    issue: „Keiner lebt“ glättet die wiederholte Individualisierung unnötig
    rationale: Die griechische Konstruktion bezeichnet wiederholt jeden Einzelnen. Eine einheitliche Formulierung mit „jeder“ ist sowohl näher am Ausgangstext als auch im Deutschen klar.
