revisions:
- from: 'Darum haben sich Gerechtigkeit und Frieden weit entfernt: Jeder hat die Furcht Gottes aufgegeben und ist im Glauben an ihn[a] kurzsichtig geworden. Keiner lebt nach den Satzungen seiner Gebote oder führt ein Leben, wie es Christus entspricht. Stattdessen folgt jeder den Begierden seines bösen Herzens; sie haben ungerechten und gottlosen Neid[b] angenommen, durch den auch der Tod in die Welt gekommen ist.'
  to: Darum sind Gerechtigkeit und Frieden weit weggerückt, weil jeder die Furcht Gottes aufgegeben hatte und im Glauben an ihn[a] kurzsichtig geworden war, weder nach den Satzungen seiner Gebote wandelte noch so lebte, wie es Christus entspricht, sondern jeder den Begierden seines bösen Herzens folgte und sich ungerechten und gottlosen Neid[b] zu eigen gemacht hatte, durch den auch der Tod in die Welt kam.
  rationale: Die Revision bewahrt die Satzlogik und die zeitliche Rückschau des griechischen Kontextes, hält die wiederholte Bezugnahme auf „jeder“ durch und ersetzt die unklare Formulierung „sie haben ... angenommen“ durch eine idiomatische, quellentreue Wiedergabe von ἀνειληφότας. Die vorhandenen Fußnoten bleiben inhaltlich gerechtfertigt und korrekt verankert.
  reviewer_model: gpt-5.6-terra
