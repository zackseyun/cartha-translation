id: 1CLEM.47.6
reference: 1 Clement 47:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: de
  text: Es ist beschämend, Geliebte – überaus beschämend und eines Lebenswandels in Christus unwürdig –, zu hören, dass die überaus standhafte und altehrwürdige Gemeinde der Korinther sich wegen einer oder zweier Personen gegen die Ältesten auflehnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρά … λίαν αἰσχρά
  choice: beschämend … überaus beschämend
  rationale: Bewahrt die nachdrückliche Wiederholung und gibt die moralische Schande in natürlichem modernem Deutsch wieder.
- source_word: ἀγωγῆς
  choice: Lebenswandels
  rationale: Bezeichnet hier die christlich geprägte Lebensführung; „Lebenswandel“ ist würdig und verständlich und erfasst mehr als einzelnes Verhalten.
- source_word: βεβαιοτάτην
  choice: überaus standhafte
  rationale: Der Superlativ bezeichnet die besonders gefestigte, beständige Gemeinde.
- source_word: ἀρχαίαν
  choice: altehrwürdige
  rationale: Im Zusammenhang mit einer Gemeinde meint das Wort nicht bloß „alt“, sondern hebt ihr langes Bestehen ehrend hervor.
- source_word: στασιάζειν πρὸς
  choice: gegen … rebelliert
  rationale: Gibt den starken Sinn von Aufruhr, Parteiung oder Auflehnung gegen die Ältesten wieder, ohne ihn zu einem bloßen Streit abzuschwächen.
- source_word: πρεσβυτέρους
  choice: Ältesten
  rationale: Entspricht dem frühchristlichen Leitungsbegriff und vermeidet eine unnötige konfessionelle Präzisierung.
theological_decisions:
- issue: ἐν Χριστῷ
  choice: in Christus
  alternative: im Messias
  rationale: Die feste frühchristliche, besonders paulinisch geprägte Wendung wird in diesem Kontext am natürlichsten mit „in Christus“ wiedergegeben; die Übersetzung lässt ihren gemeinschaftlichen und ethischen Gehalt offen.
- issue: δι’ ἓν ἢ δύο πρόσωπα
  choice: wegen einer oder zweier Personen
  alternative: durch eine oder zwei Personen
  rationale: διά mit Akkusativ bezeichnet den Anlass oder Grund. „Wegen“ bewahrt dabei die mögliche Spannung, ob diese Personen Urheber oder Anlass der Auflehnung waren, besser als eine eindeutige Kausalzuweisung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Satzführung und die scharfe Zurechtweisung des Griechischen bleiben erhalten; konfessionell eng gefasste Amtsbezeichnungen werden vermieden.
