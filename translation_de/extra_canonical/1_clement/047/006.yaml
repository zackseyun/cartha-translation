review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Begriffe sind treffend wiedergegeben: die emphatische Wiederholung von αἰσχρά, der christliche Lebenswandel, die gefestigte und alte Gemeinde, die Ältesten sowie der Konflikt gegen sie. Allerdings gibt „wenn man hören muss“ weder die Konstruktion αἰσχρά ... ἀκούεσθαι noch deren Aussage genau wieder: Es führt eine Konditionalität und ein Modalverb („muss“) ein, die im Griechischen nicht stehen. Gemeint ist, dass schon die Nachricht als solche schändlich ist.'
  naturalness: Der Ton ist würdig und modernes Standarddeutsch. „Es ist ... zu hören, dass“ bildet die griechische Aussage natürlicher und präziser nach als „wenn man hören muss“. „sich ... auflehnt“ ist für die reflexive deutsche Konstruktion mit „Gemeinde“ idiomatischer als „gegen ... rebelliert“.
  terminology: „in Christus“, „Lebenswandel“ und „Älteste“ sind angemessen und konfessionell nicht überbestimmt. „altehrwürdige“ ist als ehrende Kontextentfaltung von ἀρχαία vertretbar. Für στασιάζειν bleibt „sich gegen die Ältesten auflehnt“ stark genug, ohne die genaue Ausprägung des Konflikts unzulässig weiter festzulegen.
  issues:
  - severity: medium
    issue: „wenn man hören muss“ für αἰσχρά ... ἀκούεσθαι
    rationale: Die Formulierung macht aus der Aussage über eine beschämende Nachricht einen Bedingungssatz und fügt die nicht ausgedrückte Notwendigkeit „muss“ hinzu. Der griechische Infinitiv ἀκούεσθαι besagt hier, dass etwas zu hören bzw. bekannt geworden ist.
  revised_text: Es ist beschämend, Geliebte – überaus beschämend und eines Lebenswandels in Christus unwürdig –, zu hören, dass die überaus standhafte und altehrwürdige Gemeinde der Korinther sich wegen einer oder zweier Personen gegen die Ältesten auflehnt.
