lexical_decisions:
- source_word: τί
  choice: Was
  rationale: Gibt das direkte Fragepronomen natürlich und genau wieder.
- source_word: πρῶτον
  choice: als Erstes
  rationale: Bezieht sich am natürlichsten auf das, was Paulus ihnen zuerst schrieb, und bewahrt die zeitliche Hervorhebung.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: am Anfang der Verkündigung des Evangeliums
  rationale: εὐαγγέλιον kann hier das Evangelium beziehungsweise seine Verkündigung bezeichnen. Die Formulierung macht den zeitlich-missionarischen Zusammenhang im Deutschen verständlich, ohne den Inhalt des Evangeliums auf eine Schrift zu verengen.
theological_decisions:
- issue: Bedeutung von τοῦ εὐαγγελίου
  choice: der Verkündigung des Evangeliums
  alternative: des Evangeliums
  rationale: Im Zusammenhang verweist die Wendung wahrscheinlich auf die Anfangszeit der Evangeliumsverkündigung in Korinth. Die gewählte Form vermeidet das moderne Missverständnis, es sei zwingend der Anfang eines schriftlichen Evangelienbuches gemeint.
