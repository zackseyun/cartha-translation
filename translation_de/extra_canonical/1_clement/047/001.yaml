  text: Ἀναλάβετε τὴν ἐπιστολὴν τοῦ μακαρίου Παύλου τοῦ ἀποστόλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/001.yaml
  text: Take up the letter of the blessed Paul the apostle.
translation:
  language: de
  text: Nehmt den Brief des seligen Apostels Paulus zur Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναλάβετε
  choice: Nehmt … zur Hand
  rationale: Der Imperativ bezeichnet hier das Aufnehmen beziehungsweise Heranziehen eines bekannten Schreibens; die deutsche Wendung ist natürlich und bewahrt den konkreten Aufforderungscharakter.
- source_word: μακαρίου
  choice: seligen
  rationale: „Selig“ entspricht dem ehrenden Prädikat μακάριος in frühchristlichem Sprachgebrauch, ohne es auf das bloß moderne „glücklich“ zu verengen.
- source_word: Παύλου τοῦ ἀποστόλου
  choice: des … Apostels Paulus
  rationale: Die idiomatische deutsche Wortstellung gibt sowohl den Namen als auch die ausdrückliche Amtsbezeichnung wieder.
theological_decisions:
- issue: Ehrenprädikat für Paulus
  choice: seligen
  alternative: gesegneten
  rationale: Das traditionelle, weiterhin verständliche „selig“ bildet μακάριος genauer ab; „gesegnet“ würde eher εὐλογητός beziehungsweise ein ausdrückliches Segenshandeln nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufforderung des griechischen Satzes bleibt erhalten; „zur Hand nehmen“ klingt natürlich und meint hier, den Brief heranzuziehen beziehungsweise zu lesen.
