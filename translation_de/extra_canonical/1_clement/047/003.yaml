id: 1CLEM.47.3
reference: 1 Clement 47:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: de
  text: In Wahrheit schrieb er euch in geistlicher Weise über sich selbst sowie über Kephas und Apollos, weil ihr schon damals Parteilichkeiten hattet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: Tatsächlich
  rationale: Gibt die bekräftigende Wendung natürlich und würdevoll wieder, ohne sie unnötig zu einer Aussage über abstrakte Wahrheit auszubauen.
- source_word: πνευματικῶς
  choice: in geistlicher Weise
  rationale: Bewahrt den adverbialen Sinn des griechischen Ausdrucks und legt ihn nicht eindeutig auf die mögliche Deutung „durch den Geist“ fest.
- source_word: Κηφᾶ
  choice: Kephas
  rationale: Übernimmt die traditionelle deutsche Form des griechisch überlieferten Namens.
- source_word: προσκλίσεις
  choice: Parteiungen
  rationale: Bezeichnet hier das Sich-Zuneigen zu bestimmten Führungsfiguren und die daraus entstehenden innergemeindlichen Lager; „Parteilichkeiten“ wäre wörtlicher, im Kontext jedoch weniger idiomatisch.
- source_word: πεποιῆσθαι
  choice: gebildet hattet
  rationale: Gibt die perfektische Konstruktion idiomatisch wieder und erhält den Rückblick auf einen bereits damals eingetretenen Zustand.
theological_decisions:
- issue: Bedeutung von πνευματικῶς
  choice: in geistlicher Weise
  alternative: durch den Geist / im Geist
  rationale: Das Adverb kann eine geistliche Art des Schreibens bezeichnen, ohne den Heiligen Geist ausdrücklich als handelnde Instanz zu nennen. Die Übersetzung wahrt diese Offenheit.
- issue: Charakter der προσκλίσεις
  choice: Parteiungen
  alternative: Parteilichkeiten / Neigungen
  rationale: Der Zusammenhang mit Paulus, Kephas und Apollos weist auf gruppenbildende Hinwendung zu Personen. „Parteiungen“ vermittelt diesen Gemeindekonflikt, ohne eine spätere konfessionelle Kategorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, wird aber idiomatisch geglättet. Keine Fußnoten erforderlich.
