id: 1CLEM.47.7
reference: 1 Clement 47:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: de
  text: Und die Nachricht ist nicht nur zu uns gedrungen, sondern auch zu denen, die uns fernstehen,[a] sodass wegen eurer Unvernunft sogar Lästerungen gegen den Namen des Herrn erhoben werden, während ihr euch selbst in Gefahr bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die uns fremd beziehungsweise ablehnend gegenüberstehen“.'
    reason: Das seltene ἑτεροκλινής bezeichnet ein Sich-von-jemandem-Wegneigen und kann Distanz, Fremdheit oder Gegnerschaft ausdrücken.
lexical_decisions:
- source_word: ἀκοή
  choice: Nachricht
  rationale: Gemeint ist hier das, was über die Vorgänge bekannt geworden ist, also eine Nachricht oder Kunde, nicht der körperliche Vorgang des Hörens.
- source_word: ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: die uns fernstehen
  rationale: Die Wendung bezeichnet Menschen, die außerhalb der Gemeinschaft stehen beziehungsweise ihr fremd oder ablehnend gegenüberstehen. „Uns fernstehen“ ist im Deutschen natürlich und lässt die genaue Art der Distanz offen.
- source_word: ἀφροσύνη
  choice: Unvernunft
  rationale: Das Wort bezeichnet törichtes, uneinsichtiges Verhalten. „Unvernunft“ ist würdig und verständlich, ohne den Ausdruck unnötig abzuschwächen.
- source_word: κίνδυνον ἐξεργάζεσθαι
  choice: sich selbst in Gefahr bringen
  rationale: Die idiomatische deutsche Formulierung gibt das aktive Herbeiführen einer Gefahr für sich selbst treffend wieder.
theological_decisions:
- issue: Auswirkung des Verhaltens auf den Namen des Herrn
  choice: Lästerungen gegen den Namen des Herrn erhoben werden
  alternative: der Name des Herrn gelästert wird
  rationale: Die gewählte Fassung bewahrt die substantivische und passive Ausdrucksweise des Griechischen und macht zugleich deutlich, dass sich die Lästerungen gegen den Namen des Herrn richten.
- issue: Bedeutung des ascensiven καί in ὥστε καὶ βλασφημίας
  choice: sogar Lästerungen
  alternative: auch Lästerungen
  rationale: '„Sogar“ bringt die Steigerung zum Ausdruck: Die Nachricht dringt nicht nur nach außen, sondern führt bis dahin, dass Lästerungen gegen den Namen des Herrn erhoben werden.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der argumentativen Bewegung des griechischen Textes, wurde aber so gegliedert, dass die lange Folge im Deutschen verständlich bleibt.
