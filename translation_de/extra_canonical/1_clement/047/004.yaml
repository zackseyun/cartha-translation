revisions:
- from: Doch jene Parteinahme brachte weniger Sünde über euch; denn ihr hieltet euch an gut bezeugte[a] Apostel und an einen Mann, den sie als bewährt anerkannt hatten.
  to: Doch jene Parteinahme brachte euch weniger Sünde; denn ihr wandtet euch Aposteln zu, für die ein gutes Zeugnis vorlag, und einem Mann, der bei ihnen bewährt war.
  rationale: Die Fassung wahrt den Vergleich und die zurückhaltende Bewertung des Ausgangstextes. Sie gibt die beiden unterschiedlichen Partizipien nicht gleichförmig wieder und hält bei παρ’ αὐτοῖς die im Griechischen vorhandene Offenheit zwischen „bei ihnen“ und „in ihrem Urteil“ aufrecht. Die Fußnote erläutert die mögliche Reputationsnuance von μεμαρτυρημένοις, ohne sie in den Haupttext zu erzwingen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:54Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Vergleich „weniger Sünde“ geben ἧσσον ἁμαρτίαν angemessen wieder. „Parteinahme“ ist für πρόσκλισις vertretbar. Allerdings ist „gut bezeugte Apostel“ im heutigen Deutsch mehrdeutig und kann bloß historisch dokumentierte Apostel meinen, während μεμαρτυρημένοις von einem für die Apostel abgelegten bzw. ihnen zukommenden Zeugnis spricht. Bei δεδοκιμασμένῳ παρ’ αὐτοῖς ist „bei ihnen bewährt“ näher an der offenen lokalen bzw. urteilsbezogenen Bedeutung von παρ’ αὐτοῖς als die explizite Aussage, sie hätten den Mann anerkannt.
  naturalness: „Brachte weniger Sünde über euch“ und besonders „gut bezeugte Apostel“ klingen im Deutschen unidiomatisch. Eine Relativkonstruktion mit „für die ein gutes Zeugnis vorlag“ ist verständlicher, ohne den Quelltext auszudeuten. „Ihr wandtet euch … zu“ bildet die Hinwendung von προσεκλίθητε klar und natürlich ab.
  terminology: Die Revision unterscheidet weiterhin zwischen μεμαρτυρημένοις („für die ein gutes Zeugnis vorlag“) und δεδοκιμασμένῳ („bei ihnen bewährt“). Sie vermeidet sowohl eine kirchlich-doktrinäre Aufladung als auch die nicht gesicherte Einschränkung, die Apostel hätten den Mann förmlich anerkannt.
  issues:
  - severity: medium
    issue: „gut bezeugte Apostel“ ist semantisch mehrdeutig und stilistisch unnatürlich.
    rationale: Die Formulierung kann im modernen Deutsch „historisch gut dokumentierte Apostel“ bedeuten. Das griechische Perfektpartizip μεμαρτυρημένοις bezeichnet vielmehr Apostel, für die ein bestätigendes Zeugnis abgelegt worden war bzw. die ein gutes Zeugnis hatten.
  - severity: medium
    issue: „den sie als bewährt anerkannt hatten“ verengt παρ’ αὐτοῖς.
    rationale: παρὰ mit Dativ kann hier die Sphäre bzw. das Urteil der Apostel bezeichnen („bei ihnen“, „in ihren Augen“). Die deutsche Formulierung macht die Apostel stärker zu handelnden Anerkennenden, als der griechische Ausdruck zwingend verlangt.
  - severity: low
    issue: „hieltet euch an“ schwächt die Bewegungs- und Anschlussnuance von προσεκλίθητε.
    rationale: „Wandet euch … zu“ gibt die Hinwendung bzw. das Sich-auf-eine-Seite-Stellen unmittelbarer wieder und bewahrt den Zusammenhang mit πρόσκλισις.
  revised_text: Doch jene Parteinahme brachte euch weniger Sünde; denn ihr wandtet euch Aposteln zu, für die ein gutes Zeugnis vorlag, und einem Mann, der bei ihnen bewährt war.
  revised_footnotes:
  - marker: a
    text: 'Oder: Aposteln, die gut bezeugt waren; auch: angesehenen Aposteln.'
    reason: μεμαρτυρημένοις bezeichnet Apostel, für die Zeugnis abgelegt worden war, und kann je nach Kontext auch den daraus hervorgehenden guten Ruf betonen.
  revision_rationale: Die Fassung wahrt den Vergleich und die zurückhaltende Bewertung des Ausgangstextes. Sie gibt die beiden unterschiedlichen Partizipien nicht gleichförmig wieder und hält bei παρ’ αὐτοῖς die im Griechischen vorhandene Offenheit zwischen „bei ihnen“ und „in ihrem Urteil“ aufrecht. Die Fußnote erläutert die mögliche Reputationsnuance von μεμαρτυρημένοις, ohne sie in den Haupttext zu erzwingen.
