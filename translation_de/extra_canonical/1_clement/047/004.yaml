  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: de
  text: Doch jene Parteinahme brachte euch weniger Sünde; denn ihr wandtet euch Aposteln zu, für die ein gutes Zeugnis vorlag, und einem Mann, der bei ihnen bewährt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόσκλισις
  choice: Parteinahme
  rationale: Das Wort bezeichnet ein Sich-Zuneigen oder Sich-auf-eine-Seite-Schlagen. „Parteinahme“ wahrt den Bezug zum folgenden Verb προσεκλίθητε, ohne die stärkere Bedeutung „Spaltung“ einzutragen.
- source_word: ἧσσον ἁμαρτίαν
  choice: weniger Sünde
  rationale: Die vergleichende Formulierung des Griechischen wird bewusst beibehalten; „weniger Schuld“ wäre idiomatischer, würde ἁμαρτία jedoch begrifflich verschieben.
- source_word: προσεκλίθητε
  choice: ihr hieltet euch an
  rationale: Der Aorist wird als abgeschlossene Handlung wiedergegeben. Die Wendung drückt die Hinwendung beziehungsweise den Anschluss an bestimmte Personen in natürlichem Deutsch aus.
- source_word: μεμαρτυρημένοις
  choice: gut bezeugte
  rationale: Das Partizip bezeichnet Personen, für die ein bestätigendes Zeugnis vorliegt, also gut bezeugte beziehungsweise anerkannte Apostel.
- source_word: δεδοκιμασμένῳ παρ’ αὐτοῖς
  choice: den sie als bewährt anerkannt hatten
  rationale: δεδοκιμασμένῳ bezeichnet das positive Ergebnis einer Prüfung; παρ’ αὐτοῖς nennt diejenigen, bei denen beziehungsweise durch die diese Anerkennung galt.
theological_decisions:
- issue: Vergleichende Bewertung der früheren Parteinahme
  choice: „weniger Sünde“
  alternative: „geringere Schuld“
  rationale: Der Text vergleicht das Maß der Sünde, erklärt die frühere Parteinahme aber nicht für sündlos. Diese Spannung bleibt erhalten.
- issue: Status der Apostel und des Mannes
  choice: Unterschiedliche griechische Ausdrücke werden als „gut bezeugt“ und „als bewährt anerkannt“ unterschieden.
  alternative: Beide Male „anerkannt“ oder „bestätigt“
  rationale: So bleibt die lexikalische Differenz zwischen μεμαρτυρημένοις und δεδοκιμασμένῳ sichtbar, ohne eine besondere kirchliche Amtslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „weniger Sünde“ ist wegen ihrer Nähe zum griechischen Vergleich bewusst stehen gelassen; der übrige Satz ist idiomatisch und allgemein verständlich formuliert.
