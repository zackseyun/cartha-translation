source:
  edition: Funk 1901 (normalized OCR)
  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
translation:
  language: de
  text: Jetzt aber bedenkt, welche Leute euch auf Abwege gebracht und die Würde eurer weithin gerühmten geschwisterlichen Liebe gemindert haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Jetzt aber
  rationale: Gibt den betonten zeitlichen Gegensatz knapp und natürlich wieder.
- source_word: κατανοήσατε
  choice: bedenkt
  rationale: Der Imperativ fordert zu aufmerksamer Betrachtung und Einsicht auf; „bedenkt“ wahrt dies in würdigem, gegenwärtigem Deutsch.
- source_word: τίνες
  choice: wer
  rationale: Das deutsche interrogative „wer“ kann trotz formal singularischer Form mehrere unbekannte Personen bezeichnen; der Kontext wird nicht auf eine Einzelperson festgelegt.
- source_word: διέστρεψαν
  choice: auf Abwege gebracht
  rationale: Erfasst die Vorstellung des Irreführens oder Verleitens idiomatisch, ohne das im Deutschen missverständliche „pervertiert“ zu verwenden.
- source_word: τὸ σεμνὸν
  choice: die Würde
  rationale: Das substantivierte Adjektiv bezeichnet hier die ehrwürdige, achtunggebietende Qualität der Liebe.
- source_word: περιβοήτου
  choice: weithin gerühmten
  rationale: Gibt die Bedeutung „vielbesprochen, berühmt, angesehen“ im positiven rhetorischen Zusammenhang natürlich wieder.
- source_word: φιλαδελφίας
  choice: geschwisterlichen Liebe
  rationale: Bewahrt die gemeinschaftliche Bedeutung von φιλαδελφία und verwendet eine moderne inklusive Formulierung.
- source_word: ἐμείωσαν
  choice: gemindert hat
  rationale: Entspricht dem Aorist von „verringern, schmälern“; im deutschen Relativsatz ist das Perfekt idiomatisch.
theological_decisions:
- issue: Adressatenkreis von φιλαδελφία
  choice: geschwisterliche Liebe
  alternative: Bruderliebe
  rationale: Der griechische Begriff bezeichnet hier die gegenseitige Liebe innerhalb der Glaubensgemeinschaft; die gewählte Formulierung macht keine unnötige Beschränkung auf Männer.
- issue: Identität und Zahl der Verführer
  choice: wer euch auf Abwege gebracht hat
  alternative: welche Leute euch auf Abwege gebracht haben
  rationale: τίνες ist morphologisch plural, doch die idiomatische deutsche Frage mit „wer“ lässt die Zahl offen und vermeidet eine stilistisch schwerfällige Festlegung; die Aussage bleibt auf nicht näher bezeichnete Verantwortliche bezogen.
translation_notes:
  register: Gehobenes, aber gut verständliches modernes Standarddeutsch. Die direkte Mahnung und der rhetorische Gegensatz bleiben erhalten; lange nominale oder altertümliche Wendungen werden vermieden.
