source:
  edition: Funk 1901 (normalized OCR)
  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: de
  text: 'Denn das Tor der Gerechtigkeit selbst[a] ist zum Leben geöffnet, wie geschrieben steht: »Öffnet mir die Tore der Gerechtigkeit! Durch sie will ich eintreten und dem Herrn danken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Form kann bei abweichender Akzentuierung auch als αὕτη („dies ist“) gelesen werden: »Denn dies ist das Tor der Gerechtigkeit, das zum Leben geöffnet ist.«'
    reason: Die angegebene Quelle hat αὐτή („selbst“); die alternative demonstrative Lesart wird als textliche beziehungsweise akzentbedingte Möglichkeit transparent ausgewiesen.
lexical_decisions:
- source_word: πύλη … δικαιοσύνης
  choice: Tor der Gerechtigkeit
  rationale: Die formale Genitivverbindung wird bewahrt; »Gerechtigkeit« entspricht δικαιοσύνη, ohne den Ausdruck vorschnell als »Heil« oder »Tempel« auszulegen.
- source_word: ἀνεῳγυῖα εἰς ζωήν
  choice: das zum Leben geöffnet ist
  rationale: Das Partizip bezieht sich auf πύλη; εἰς ζωήν bezeichnet Ziel oder Hinführung. Die Formulierung bleibt nahe am griechischen Bild und ist zugleich natürliches Deutsch.
- source_word: ἐξομολογήσομαι
  choice: will ich … danken
  rationale: Im zitierten Psalmkontext bezeichnet das Verb den dankenden Lobpreis. »Danken« ist hier idiomatischer als das mögliche, aber missverständliche »bekennen«.
- source_word: ἐν αὐταῖς
  choice: durch sie
  rationale: Bei Toren gibt ἐν hier das Eintreten durch sie wieder; das feminine Pluralpronomen nimmt πύλας auf.
theological_decisions:
- issue: Bedeutung von »Tor der Gerechtigkeit«
  choice: Die Metapher bleibt unaufgelöst stehen.
  alternative: »Tor zum Heil« oder eine ausdrückliche Identifikation des Tores
  rationale: Der griechische Wortlaut benennt das Tor als eines »der Gerechtigkeit«, legt dessen theologische Identität in diesem Satz aber nicht ausdrücklich fest.
- issue: Bezug und Lesart von αὐτή/αὕτη
  choice: »dies ist das Tor« nach der kontextuell und syntaktisch überzeugenden demonstrativen Lesart αὕτη
  alternative: »das Tor selbst ist zum Leben geöffnet« bei αὐτή
  rationale: Die überlieferungs- bzw. akzentbedingte Mehrdeutigkeit soll nicht verborgen werden; die Hauptfassung folgt der Lesart, die den Satz als Identifikation des zuvor genannten Zugangs versteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Psalmzitierung erhält einen leicht gehobenen, aber allgemein verständlichen Klang; Satzbau und Metaphorik bleiben quellennah.
