revisions:
- from: Da nun viele Tore offen stehen, ist dieses Tor in Gerechtigkeit dasjenige in Christus. Glücklich sind alle, die durch es eingetreten sind und ihren Weg in Heiligkeit und Gerechtigkeit gerade ausrichten, indem sie alles ohne Unruhe vollbringen.
  to: Da nun viele Tore offen stehen, ist dieses Tor in Gerechtigkeit dasjenige in Christus, in dem alle glücklich sind, die eingetreten sind und ihren Weg in Heiligkeit und Gerechtigkeit gerade richten, indem sie alles ungestört vollbringen.
  rationale: Die Revision beseitigt den nicht ausdrücklich im griechischen Text stehenden Zusatz „durch es“ und glättet zwei Formulierungen, ohne die elliptische Aussage über das Tor, den Aspekt der Partizipien oder die theologische Offenheit von „in Gerechtigkeit“ und „in Christus“ zu verändern.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:53Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die elliptische Gegenüberstellung „[Tor] in Gerechtigkeit“ / „[Tor] in Christus“ und die Abfolge von vorausgehendem Eintritt (Aorist) und fortdauernder Lebensführung (Präsens) grundsätzlich zutreffend wieder. „durch es eingetreten“ fügt jedoch gegenüber dem bloßen εἰσελθόντες eine ausdrücklich transitive Richtungsbestimmung hinzu; die Relativkonstruktion kann den Bezug zum Tor ohne diesen Zusatz wiedergeben.
  naturalness: „Ihren Weg gerade ausrichten“ ist verständlich, aber weniger idiomatisch als „ihren Weg gerade richten“. Auch „alles ohne Unruhe vollbringen“ wirkt im heutigen Standarddeutsch etwas sperrig; „alles ungestört vollbringen“ ist natürlich und wahrt den Sinn von ἀταράχως.
  terminology: „Gerechtigkeit“, „in Christus“, „Heiligkeit“ und „Tore“ sind sachgerecht. „Glücklich“ ist für μακάριοι in modernem, nicht konfessionell festgelegtem Deutsch vertretbar.
  issues:
  - severity: low
    issue: Zusatz „durch es“ bei „eingetreten“
    rationale: Das Griechische hat εἰσελθόντες ohne ausdrücklich genanntes „durch“. Der Kontext des Tores legt den Eintritt zwar nahe, doch die deutsche Fassung kann den Bezug über „in dem“ beibehalten, ohne die Bewegungsrichtung zusätzlich festzulegen.
  - severity: low
    issue: Unidiomatische Formulierungen bei Wegführung und adverbialem Schluss
    rationale: „Den Weg gerade richten“ und „alles ungestört vollbringen“ sind im modernen Standarddeutsch flüssiger und geben κατευθύνοντες bzw. ἀταράχως angemessen wieder.
  revised_text: Da nun viele Tore offen stehen, ist dieses Tor in Gerechtigkeit dasjenige in Christus, in dem alle glücklich sind, die eingetreten sind und ihren Weg in Heiligkeit und Gerechtigkeit gerade richten, indem sie alles ungestört vollbringen.
  revised_footnotes: []
