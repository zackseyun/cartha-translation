id: 1CLEM.48.4
reference: 1 Clement 48:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: de
  text: Da nun viele Tore offen stehen, ist dieses Tor in Gerechtigkeit dasjenige in Christus, in dem alle glücklich sind, die eingetreten sind und ihren Weg in Heiligkeit und Gerechtigkeit gerade richten, indem sie alles ungestört vollbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶν
  choice: Tore
  rationale: Die konkrete Bildsprache des griechischen Textes wird unmittelbar bewahrt.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Die ungewöhnliche, aber theologisch offene Präpositionalformulierung wird nicht zu „zur Gerechtigkeit“ oder „der Gerechtigkeit“ vereindeutigt.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: Entspricht dem etablierten frühchristlichen Sprachgebrauch und vermeidet eine unnötige etymologische Auflösung als „im Messias“.
- source_word: κατευθύνοντες τὴν πορείαν αὐτῶν
  choice: ihren Weg gerade ausrichten
  rationale: Gibt sowohl die Wegmetaphorik von πορεία als auch den Sinn von κατευθύνω wieder.
- source_word: ἀταράχως
  choice: ohne Unruhe
  rationale: Bewahrt den Gedanken störungsfreier, unaufgeregter Ausführung, ohne ihn enger als „ohne Streit“ festzulegen.
theological_decisions:
- issue: Verhältnis des Tores „in Gerechtigkeit“ zu dem „in Christus“
  choice: „dieses Tor in Gerechtigkeit [ist] dasjenige in Christus“
  alternative: „dies ist das Tor zur Gerechtigkeit, nämlich Christus“
  rationale: Die gewählte Form folgt der Artikelstruktur und den elliptischen Bezügen des Griechischen, ohne das Tor ausdrücklich mit Christus selbst gleichzusetzen oder ἐν in eine Zielangabe umzudeuten.
- issue: Aspekt der Partizipien εἰσελθόντες und κατευθύνοντες
  choice: „eingetreten sind und … gerade ausrichten“
  alternative: „eintreten und … ausrichten“
  rationale: Das Perfekt im Deutschen bildet den vorausgehenden Eintritt ab, während das Präsens die fortdauernde Lebensführung ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die syntaktischen und theologischen Bezüge bleiben erhalten.
