  language: de
  text: „Dies ist das Tor des Herrn; die Gerechten werden durch es eintreten.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύλη
  choice: Tor
  rationale: Bezeichnet ein Tor beziehungsweise einen größeren Eingang; „Tor“ entspricht hier dem biblisch geprägten Bild und dem zugrunde liegenden Psalmzitat.
- source_word: δίκαιοι
  choice: die Gerechten
  rationale: Gibt die substantivierte Personenbezeichnung wörtlich und in geläufiger biblischer Sprache wieder.
- source_word: εἰσελεύσονται ἐν αὐτῇ
  choice: werden durch es hineingehen
  rationale: Bewahrt den Zukunftsbezug und gibt ἐν mit dem Tor als räumlichem Durchgang natürlich als „durch“ wieder; das neutrale Pronomen folgt dem deutschen Genus von „Tor“.
theological_decisions:
- issue: Bestimmung der „Gerechten“
  choice: Unbestimmt als „die Gerechten“ belassen
  alternative: Deutend als bestimmte Glaubende oder Erlöste wiedergeben
  rationale: Der griechische Wortlaut benennt die Gruppe, ohne an dieser Stelle näher zu erklären, wodurch ihre Gerechtigkeit bestimmt ist.
translation_notes:
  register: Kurzer, würdevoller und bibelnaher Zitatstil. Die Formulierung bleibt nahe am Griechischen und ist zugleich in modernem Standarddeutsch verständlich.
