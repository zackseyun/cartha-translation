id: 1CLEM.48.1
reference: 1 Clement 48:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: de
  text: Darum wollen wir dies unverzüglich aus dem Weg räumen, vor dem Gebieter niederfallen und weinend zu ihm flehen, damit er uns gnädig wird, sich mit uns versöhnt und uns zu dem ehrwürdigen und reinen Lebenswandel unserer geschwisterlichen Liebe zurückführt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: wollen wir … aus dem Weg räumen
  rationale: Das Verb bezeichnet hier das Beseitigen des zuvor angesprochenen Übels; die deutsche Wendung gibt den auffordernden Aoristkonjunktiv natürlich und nachdrücklich wieder.
- source_word: ἐν τάχει
  choice: unverzüglich
  rationale: Gibt die geforderte Eile in würdigem, modernem Deutsch wieder.
- source_word: δεσπότῃ
  choice: Gebieter
  rationale: Bewahrt stärker als „Herr“ den Gedanken uneingeschränkter Autorität, ohne die Anrede unnötig zu verschärfen.
- source_word: ἵλεως γενόμενος
  choice: uns gnädig wird
  rationale: Gibt den Zustandswechsel beziehungsweise das gnädige Gestimmtsein wieder, ohne eine bestimmte Versöhnungslehre einzutragen.
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: sich wieder mit uns versöhnt
  rationale: Bewahrt die im griechischen Verb ausgedrückte Versöhnung und das verstärkende beziehungsweise wiederherstellende Moment von ἐπι-.
- source_word: ἀγωγὴν
  choice: Lebenswandel
  rationale: Im ethischen Zusammenhang bezeichnet ἀγωγή die praktische Lebensführung, nicht lediglich ein einzelnes Verhalten.
- source_word: φιλαδελφίας
  choice: geschwisterlichen Liebe
  rationale: Gibt die Liebe innerhalb der Glaubensgemeinschaft in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Richtung der Versöhnung
  choice: sich wieder mit uns versöhnt
  alternative: uns wieder mit sich versöhnt
  rationale: Die gewählte Fassung folgt der griechischen Konstruktion mit ἡμῖν und lässt die theologische Spannung stehen, dass der Gebieter als derjenige beschrieben wird, der sich den Bittenden gnädig zuwendet.
- issue: Bezug der Adjektive σεμνήν und ἁγνήν
  choice: 'Beide bestimmen „Lebenswandel“: „ehrwürdigen und reinen Lebenswandel“'
  alternative: „reiner Lebenswandel, der unserer ehrwürdigen geschwisterlichen Liebe entspricht“
  rationale: Kasus und Satzbau beziehen beide Akkusativadjektive unmittelbar auf ἀγωγήν; die Übersetzung fügt daher kein ungeschriebenes „entspricht“ ein.
translation_notes:
  register: Moderner, würdiger Mahn- und Gebetsstil. Die Reihung der Aufforderungen bleibt erhalten; „weinend zu ihm flehen“ verbindet die gleichzeitigen Handlungen idiomatisch. Beide griechischen Adjektive bleiben ausdrücklich auf den Lebenswandel bezogen.
