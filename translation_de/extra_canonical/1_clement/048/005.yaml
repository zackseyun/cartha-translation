source:
  edition: Funk 1901 (normalized OCR)
  text: ἤτω τις πιστός, ἤτω δυνατὸς γνῶσιν ἐξεπεῖν, ἤτω σοφὸς ἐν διακρίσει λόγων, ἤτω ἁγνὸς ἐν ἔργοις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: de
  text: Jeder sei treu, jeder sei fähig, Erkenntnis darzulegen, jeder sei weise im Unterscheiden von Worten, jeder sei rein in seinen Taten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤτω τις
  choice: mag jemand … sein
  rationale: Bewahrt die wiederholte, auffordernde Form und gibt das unbestimmte τις geschlechtsneutral und natürlich wieder.
- source_word: πιστός
  choice: treu
  rationale: Entspricht hier der grundlegenden Bedeutung von πιστός; die mögliche Nuance „gläubig“ wird nicht ohne Kontextfestlegung erzwungen.
- source_word: δυνατὸς γνῶσιν ἐξεπεῖν
  choice: fähig, Erkenntnis darzulegen
  rationale: Gibt sowohl die Befähigung als auch das ausführliche sprachliche Darlegen von Erkenntnis wieder.
- source_word: σοφὸς ἐν διακρίσει λόγων
  choice: weise in der Beurteilung von Worten
  rationale: διακρίσει bezeichnet unterscheidendes Prüfen oder Beurteilen; λόγων bleibt mit „Worten“ bewusst offen und wird nicht auf Lehren oder Aussagen verengt.
- source_word: ἁγνὸς ἐν ἔργοις
  choice: rein in seinen Taten
  rationale: Bewahrt die ethisch-kultische Weite von ἁγνός und gibt ἔργα idiomatisch als konkrete Taten wieder.
theological_decisions:
- issue: Bedeutung von πιστός
  choice: treu
  alternative: gläubig
  rationale: Ohne weiteren Zusatz kann πιστός beides bedeuten. „Treu“ wahrt die allgemeinere Tugendaussage und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die viergliedrige Parallelstruktur des Griechischen wird beibehalten; „mag jemand“ klingt gehoben, aber verständlich und bildet den exhortativen Charakter von ἤτω genauer ab als eine bloße Aussage.
