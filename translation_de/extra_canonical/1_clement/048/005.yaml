review_pass:
  verdict: revise
  source_fidelity: Die vierfache parataktische Aufforderung wird bewahrt. πιστός ist angemessen mit „treu“ wiedergegeben. δυνατὸς γνῶσιν ἐξεπεῖν bezeichnet die Fähigkeit, Erkenntnis/Wissen darzulegen; σοφὸς ἐν διακρίσει λόγων die Weisheit im unterscheidenden Umgang mit Worten bzw. Aussagen. ἁγνὸς ἐν ἔργοις bleibt als ethisch offene Reinheit im Handeln erhalten.
  naturalness: „Mag jemand … sein“ ist im heutigen Standarddeutsch zwar verständlich, wirkt aber ungebräuchlich und kann als Wunsch oder Einräumung missverstanden werden. Der imperativische Konjunktiv „Jeder sei“ ist würdig, klar und natürlich genug für den exhortativen Registerton.
  terminology: „Erkenntnis“ kann für γνῶσις stehen und wahrt den gegebenen Begriff. „Im Unterscheiden von Worten“ bildet διακρίσει λόγων unmittelbarer ab als „in der Beurteilung von Worten“, ohne λόγοι auf Lehren oder Aussagen festzulegen. „Taten“ ist für ἔργα idiomatisch und sachlich passend.
  issues:
  - severity: medium
    issue: „Mag jemand … sein“ ist als Wiedergabe von ἤτω τις stilistisch und modal mehrdeutig.
    rationale: Die Form kann im modernen Deutsch einen bloßen Wunsch oder eine Konzession ausdrücken. Der griechische Imperativ fordert hingegen zur beschriebenen Haltung auf.
  - severity: low
    issue: „Beurteilung von Worten“ glättet διακρίσει stärker als nötig.
    rationale: διακρίσις meint primär Unterscheiden bzw. unterscheidendes Prüfen. „Im Unterscheiden von Worten“ wahrt diese Nuance und lässt λόγων offen.
