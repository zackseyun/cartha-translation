id: 1CLEM.48.6
reference: 1 Clement 48:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: de
  text: Denn er soll umso demütiger sein[a], je größer er zu sein scheint, und nach dem suchen, was allen nützt, nicht nach dem Eigenen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn um so viel mehr soll er demütig sein, um wie viel größer er zu sein scheint.«'
    reason: Die Fußnote dokumentiert die formale Gestalt der griechischen proportionalen Korrelativkonstruktion, die im Haupttext idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: demütig sein
  rationale: Gibt die Haltung der Demut in natürlichem, gegenwärtigem Deutsch wieder, ohne den Ausdruck unnötig zu nominalisieren.
- source_word: δοκεῖ ... μείζων εἶναι
  choice: größer zu sein scheint
  rationale: Bewahrt die mit δοκεῖ ausgedrückte Perspektive beziehungsweise den Anschein, statt tatsächliche Größe vorauszusetzen.
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: was allen nützt
  rationale: Natürliche und genaue Wiedergabe dessen, was dem gemeinsamen Nutzen aller dient.
- source_word: τὸ ἑαυτοῦ
  choice: das Eigene
  rationale: Bewahrt die substantivische Offenheit des Griechischen; gemeint sein kann der eigene Nutzen oder Vorteil, ohne dies enger festzulegen.
theological_decisions:
- issue: Begründender Zusammenhang durch γὰρ
  choice: Denn
  alternative: Doch
  rationale: γὰρ begründet die Forderung aus dem vorausgehenden Zusammenhang und ist nicht adversativ.
- issue: Proportionale Beziehung τοσούτῳ ... ὅσῳ
  choice: umso ... je
  alternative: in dem Maße mehr ... in dem Maße wie
  rationale: Die geläufige deutsche Korrelativkonstruktion gibt die proportionale Steigerung präzise und verständlich wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Gedankengang, wird aber mit der natürlichen deutschen Konstruktion »umso … je« lesbar gestaltet. Die Spannung zwischen scheinbarer Größe und gebotener Demut bleibt erhalten.
