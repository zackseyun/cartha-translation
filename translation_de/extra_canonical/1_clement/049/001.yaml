source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἔχων ἀγάπην ἐν Χριστῷ ποιησάτω τὰ τοῦ Χριστοῦ παραγγέλματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/001.yaml
  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: de
  text: Wer Liebe in Christus hat, soll die Gebote Christi befolgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπην
  choice: Liebe
  rationale: Die direkte und im christlichen Kontext natürliche Wiedergabe bewahrt den umfassenden Sinn des griechischen Begriffs.
- source_word: ἐν Χριστῷ
  choice: in Christus
  rationale: Die formale Wendung bewahrt die mögliche Mehrdeutigkeit zwischen einer in Christus gegründeten Liebe und der Lebenssphäre der Christusgemeinschaft.
- source_word: ποιησάτω
  choice: soll … befolgen
  rationale: Der Imperativ der dritten Person wird im natürlichen modernen Deutsch mit „soll“ wiedergegeben; bei Geboten bezeichnet „befolgen“ idiomatisch das verlangte Tun.
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  choice: die Gebote Christi
  rationale: Der attributive Genitiv wird knapp und würdig wiedergegeben; „Gebote“ entspricht hier den verbindlichen Weisungen Christi.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Christus
  alternative: Messias
  rationale: Im deutschsprachigen frühchristlichen Kontext ist „Christus“ die natürliche Bezeichnung und entspricht der griechischen Form, ohne die messianische Bedeutung zu leugnen.
- issue: Bezug von ἐν Χριστῷ
  choice: Wörtlich als „in Christus“ bewahrt
  alternative: „Liebe zu Christus“ oder „christliche Liebe“
  rationale: Das Griechische legt nicht eindeutig fest, ob die Liebe auf Christus gerichtet, durch ihn bestimmt oder in der Gemeinschaft mit ihm verankert ist; die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der Satz bleibt knapp und paränetisch; wegen der Kürze des Ausgangstextes sind keine Fußnoten erforderlich.
