id: 1CLEM.49.6
reference: 1 Clement 49:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: de
  text: In Liebe nahm der Herrscher uns an; wegen der Liebe, die er zu uns hatte, gab Jesus, der Messias, unser Herr, nach Gottes Willen sein Blut für uns, sein Fleisch für unser Fleisch und seine Seele für unsere Seelen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Leben für unser Leben“. Das griechische Wort kann sowohl „Seele“ als auch „Leben“ bedeuten.'
    reason: Bewahrt die echte Bedeutungsbreite von ψυχή, während der Haupttext die rhetorische Parallelität mit „Fleisch“ sichtbar macht.
lexical_decisions:
- source_word: δεσπότης
  choice: Herrscher
  rationale: Bewahrt gegenüber dem gewöhnlichen κύριος („Herr“) die stärkere Bedeutung eines Gebieters bzw. souveränen Herrn und vermeidet, beide griechischen Titel gleich wiederzugeben.
- source_word: προσελάβετο
  choice: nahm … an
  rationale: Das Medium bezeichnet hier das Annehmen bzw. Aufnehmen von Personen; „nahm uns an“ ist natürlich und lässt die genaue Art der Aufnahme offen.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, der Messias
  rationale: Χριστός wird als Titel wiedergegeben; die Apposition macht dies im Deutschen deutlich, ohne den Namenstitel in ein bloßes Namenselement zu verwandeln.
- source_word: ἐν θελήματι θεοῦ
  choice: nach Gottes Willen
  rationale: 'Idiomatiche Wiedergabe der instrumentalen bzw. normativen Wendung: Jesu Hingabe geschieht gemäß dem Willen Gottes.'
- source_word: σάρξ
  choice: Fleisch
  rationale: Erhält den konkreten anthropologischen Ausdruck und die rhetorische Parallelität des griechischen Satzes.
- source_word: ψυχή
  choice: Seele
  rationale: Bewahrt die bewusste Parallelstruktur „Fleisch für Fleisch, Seele für Seelen“; „Leben“ wäre möglich, würde aber die anthropologische Symmetrie abschwächen.
theological_decisions:
- issue: Bedeutung von ψυχή in der Aussage über Jesu Hingabe
  choice: Seele
  alternative: Leben
  rationale: ψυχή kann „Leben“ bedeuten, doch die ausdrückliche Paarung mit σάρξ sowie Singular und Plural auf beiden Seiten spricht hier dafür, die rhetorische und anthropologische Symmetrie sichtbar zu halten. Eine Fußnote nennt die echte lexikalische Alternative.
- issue: Verhältnis von göttlichem Willen und Hingabe Jesu
  choice: „nach Gottes Willen“ wird unmittelbar bei der Hingabe belassen
  alternative: „durch Gottes Willen“ oder Bezug auf einen anderen Satzteil
  rationale: Die Stellung im Griechischen verbindet die Wendung am natürlichsten mit ἔδωκεν. „Nach“ drückt Übereinstimmung mit Gottes Willen aus, ohne die genaue kausale oder instrumentale Nuance dogmatisch festzulegen.
- issue: Identität des Subjekts in „nahm uns an“
  choice: „der Herrscher“ ohne ausdrückliche Identifizierung mit Gott oder Christus
  alternative: „Gott“ oder „Christus“ ergänzen
  rationale: Der griechische Text nennt nur ὁ δεσπότης. Die Übersetzung bewahrt diese Referenzoffenheit und ergänzt keine theologische Identifikation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzstruktur. Das Semikolon erhält den engen argumentativen Zusammenhang, ohne einen überlangen deutschen Satz unübersichtlich zu machen. „Herrscher“ ist bewusst markanter als „Herr“, da im selben Vers κύριος für Jesus steht.
