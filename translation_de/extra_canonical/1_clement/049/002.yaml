lexical_decisions:
- source_word: δεσμόν
  choice: Band
  rationale: „Band“ gibt die verbindende Kraft von δεσμός natürlich und bildhaft wieder.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: der Liebe Gottes
  rationale: Der deutsche Genitiv bewahrt die im Griechischen mögliche Spannung, ob Gottes Liebe zu den Menschen oder die Liebe zu Gott gemeint ist.
- source_word: ἐξηγήσασθαι
  choice: beschreiben
  rationale: Im rhetorischen Zusammenhang bezeichnet das Verb das Darlegen oder Schildern; „beschreiben“ passt zum erhabenen Ton und lässt die Bedeutung „erklären“ als mögliche Alternative offen.
theological_decisions:
- issue: Bezug des Genitivs τοῦ θεοῦ
  choice: der Liebe Gottes
  alternative: der Liebe zu Gott / Gottes Liebe
  rationale: Die formal entsprechende Genitivkonstruktion legt nicht einseitig fest, ob Gott Subjekt oder Objekt der Liebe ist.
translation_notes:
  register: Kurze rhetorische Frage in natürlichem, würdigem Standarddeutsch; die Bildsprache des verbindenden „Bandes“ bleibt erhalten.
