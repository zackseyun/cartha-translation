  source_fidelity: Der Entwurf gibt τὸ μεγαλεῖον mit „Erhabenheit“, καλλονή mit „Schönheit“ und αὐτοῦ mit dem maskulinen „seiner“ sachgerecht wieder. „Wer vermag …?“ trifft die rhetorische Aussage von τίς ἀρκετός angemessen. Für ἐξειπεῖν ist „auszusprechen“ jedoch im Deutschen bei einem Gegenstand wie „Erhabenheit“ weniger idiomatisch und bezeichnet eher das bloße Äußern als das schildernde Darlegen.
  naturalness: „Wer vermag die Erhabenheit seiner Schönheit zu schildern?“ ist gehobene, heutige Standardsprache und bewahrt die knappe rhetorische Form. „Schildern“ verbindet sich natürlicher mit dem Gegenstand und vermittelt die ausmalend-erklärende Kraft von ἐξειπεῖν.
  terminology: „Erhabenheit“ ist für μεγαλεῖον im vorliegenden Lobpreis-Kontext eine vertretbare, nicht konfessionell festgelegte Wiedergabe. „Schönheit“ für καλλονή und „seiner“ für αὐτοῦ sind beizubehalten.
