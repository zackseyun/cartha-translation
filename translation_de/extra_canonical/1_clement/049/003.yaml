  text: Who is sufficient to declare the majesty of his beauty?[a]
translation:
  language: de
  text: Wer vermag die Erhabenheit seiner Schönheit zu schildern?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλεῖον
  choice: Erhabenheit
  rationale: Das substantivierte μεγαλεῖον bezeichnet Größe, Pracht oder Majestät. „Erhabenheit“ bewahrt den gehobenen Ton und verbindet sich im Deutschen natürlich mit „Schönheit“.
- source_word: καλλονῆς
  choice: Schönheit
  rationale: καλλονή bezeichnet Schönheit oder Anmut; „Schönheit“ ist die direkte und verständliche Wiedergabe.
- source_word: ἀρκετὸς
  choice: vermag
  rationale: Die rhetorische Frage zielt auf ausreichende Fähigkeit. „Wer vermag …?“ gibt dies knapp und würdig wieder.
- source_word: ἐξειπεῖν
  choice: auszusprechen
  rationale: ἐξειπεῖν bedeutet vollständig aussprechen, darlegen oder schildern. „auszusprechen“ bewahrt hier sowohl den Gedanken sprachlicher Darstellung als auch die rhetorische Unerreichbarkeit.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: seiner
  alternative: dessen / ihrer
  rationale: Das griechische maskuline oder neutrale Genitivpronomen wird formal mit „seiner“ wiedergegeben. Dadurch bleibt der im isolierten Satz nicht ausdrücklich genannte Bezug offen, ohne ihn theologisch festzulegen.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Die knappe rhetorische Frage und die Spannung zwischen sprachlichem Vermögen und unaussprechlicher Schönheit bleiben erhalten.
