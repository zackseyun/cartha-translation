  text: τὸ ὕψος, εἰς ὃ ἀνάγει ἡ ἀγάπη, ἀνεκδιήγητόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/004.yaml
  text: The height to which love leads is beyond telling.
translation:
  language: de
  text: Die Höhe, zu der die Liebe hinaufführt, ist unbeschreiblich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: die Höhe
  rationale: Gibt das substantivierte ὕψος direkt und in der bildlichen Aussage natürlich wieder.
- source_word: εἰς ὃ ἀνάγει
  choice: zu der … hinaufführt
  rationale: Bewahrt sowohl die Zielrichtung von εἰς ὅ als auch die Aufwärtsbewegung in ἀνάγει, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt wie „uns“ einzufügen.
- source_word: ἡ ἀγάπη
  choice: die Liebe
  rationale: Die übliche und kontextgemäße Wiedergabe von ἀγάπη.
- source_word: ἀνεκδιήγητόν
  choice: unbeschreiblich
  rationale: Drückt aus, dass diese Höhe nicht vollständig erzählt oder in Worte gefasst werden kann; im modernen Deutsch würdevoll und verständlich.
theological_decisions:
- issue: Nicht genanntes Objekt von ἀνάγει
  choice: Kein „uns“ ergänzen
  alternative: „zu der uns die Liebe hinaufführt“
  rationale: Das griechische Verb lässt das Objekt unausgesprochen. Die Übersetzung bewahrt diese Offenheit und vermeidet eine sachlich naheliegende, aber nicht ausdrücklich belegte Ergänzung.
translation_notes:
  register: Kurzer, würdevoller Aussagesatz in modernem Standarddeutsch. „Hinaufführt“ erhält das Höhenbild des griechischen ἀνάγει klarer als das allgemeinere „führt“.
