id: 1CLEM.49.5
reference: 1 Clement 49:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: de
  text: Die Liebe verbindet uns mit Gott; die Liebe bedeckt eine Menge von Sünden; die Liebe erträgt alles, sie ist in allem geduldig. Nichts Gemeines ist in der Liebe, nichts Überhebliches. Die Liebe kennt keine Spaltung; die Liebe stiftet keinen Aufruhr; die Liebe tut alles in Eintracht. In der Liebe wurden alle Erwählten Gottes vollendet; ohne Liebe ist nichts Gott wohlgefällig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾷ
  choice: verbindet
  rationale: Das Verb bezeichnet ein enges Anfügen oder Verbinden. „Verbindet uns mit Gott“ ist natürliches Deutsch und bewahrt die starke relationale Aussage.
- source_word: καλύπτει
  choice: bedeckt
  rationale: Die bildhafte Bedeutung „bedecken“ bleibt erhalten und entspricht der erkennbaren traditionsgeschichtlichen Anspielung, ohne sie auszudeuten.
- source_word: ἀνέχεται
  choice: erträgt
  rationale: Das Verb bedeutet, etwas auszuhalten oder zu ertragen; „erträgt alles“ gibt den umfassenden Sinn knapp wieder.
- source_word: μακροθυμεῖ
  choice: ist in allem geduldig
  rationale: μακροθυμεῖ bezeichnet langmütiges, geduldiges Verhalten. Die Verbindung mit πάντα wird als „in allem“ wiedergegeben, statt sie mit dem vorigen πάντα zusammenzuziehen.
- source_word: βάναυσον
  choice: Gemeines
  rationale: Hier bezeichnet das Adjektiv moralisch niedriges, unedles oder grobes Verhalten. „Gemeines“ ist verständlich und wahrt die moralische Breite.
- source_word: ὑπερήφανον
  choice: Überhebliches
  rationale: Das Wort bezeichnet Stolz oder Hochmut; „überheblich“ klingt im modernen Deutsch natürlich und würdevoll.
- source_word: σχίσμα
  choice: Spaltung
  rationale: „Spaltung“ gibt den konkreten gemeinschaftlichen Bruch wieder, ohne den Begriff auf eine spätere kirchenrechtliche Bedeutung festzulegen.
- source_word: στασιάζει
  choice: stiftet keinen Aufruhr
  rationale: Das Verb meint Auflehnung, Parteibildung oder Unruhe. „Aufruhr stiften“ wahrt den aktiven, gemeinschaftszerstörenden Sinn.
- source_word: ὁμονοίᾳ
  choice: Eintracht
  rationale: Der Begriff bezeichnet gemeinsames Denken und harmonische Übereinstimmung. „Eintracht“ ist prägnant und dem würdevollen Register angemessen.
- source_word: ἐτελειώθησαν
  choice: wurden … vollendet
  rationale: Die passive Form und das Motiv des Zur-Vollendung-Gelangens werden formal bewahrt, ohne festzulegen, worin diese Vollendung genau besteht.
- source_word: εὐάρεστόν
  choice: wohlgefällig
  rationale: „Gott wohlgefällig“ ist eine klare, etablierte Wiedergabe für das, was Gottes Zustimmung oder Gefallen findet.
theological_decisions:
- issue: Bedeutung der Vollendung der Erwählten in der Liebe
  choice: „In der Liebe wurden alle Erwählten Gottes vollendet“
  alternative: „Durch die Liebe gelangten alle Erwählten Gottes zur Vollkommenheit“
  rationale: Die gewählte Fassung bewahrt sowohl das Passiv als auch die mögliche Mehrdeutigkeit von ἐν als Sphäre oder Mittel und erklärt die Art der Vollendung nicht näher.
- issue: Liebe und das Bedecken von Sünden
  choice: wörtlich-bildhaft „bedeckt eine Menge von Sünden“
  alternative: deutend „bewirkt die Vergebung vieler Sünden“ oder „sieht über viele Sünden hinweg“
  rationale: Der griechische Text benennt weder ausdrücklich Vergebung noch bloßes Übersehen. Die Metapher bleibt daher theologisch offen.
- issue: Gottes Wohlgefallen und Liebe
  choice: „ohne Liebe ist nichts Gott wohlgefällig“
  alternative: „ohne Liebe kann niemand Gott gefallen“
  rationale: Die sachliche Negation οὐδὲν wird beibehalten; sie soll nicht ohne Textgrund auf Personen eingeschränkt oder als Aussage über Heilsbedingungen systematisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst wiederholtem „die Liebe“, entsprechend der rhetorischen Anapher des griechischen Textes. Die kurzen Hauptsätze und Semikolons bewahren den feierlichen, eindringlichen Rhythmus. Keine Fußnoten erforderlich.
