  yaml_path: translation/extra_canonical/1_clement/015/002.yaml
  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: de
  text: 'Denn irgendwo heißt es: »Dieses Volk ehrt mich mit den Lippen, doch ihr Herz ist fern von mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Denn irgendwo heißt es
  rationale: Gibt die unbestimmte Verweisformel natürlich wieder; das unpersönliche »heißt es« passt im Deutschen zu einem nicht näher bezeichneten Schriftzitat.
- source_word: τοῖς χείλεσιν με τιμᾷ
  choice: ehrt mich mit den Lippen
  rationale: Bewahrt das konkrete Bild und die Wortstellung des griechischen Zitats in idiomatischem Deutsch.
- source_word: ἡ δὲ καρδία αὐτῶν πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: doch ihr Herz ist fern von mir
  rationale: »Doch« bildet den Gegensatz ab; der griechische Singular »Herz« bei pluralischem Bezug bleibt erhalten, ebenso die räumliche Metapher.
theological_decisions:
- issue: Kollektiver Singular »Herz« bei pluralischem Possessivbezug
  choice: ihr Herz
  alternative: ihre Herzen
  rationale: Der Singular καρδία wird bewahrt, weil er das Volk als Kollektiv beschreibt; eine Auflösung in den Plural wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe Zitatform und der Gegensatz zwischen äußerer Ehrerweisung und innerer Distanz bleiben erhalten.
