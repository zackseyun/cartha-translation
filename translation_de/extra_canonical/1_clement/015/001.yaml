  text: Therefore let us join ourselves to those who Therefore let us join ourselves to those who live in peace with godliness, and not to those who desire peace with hypocrisy..
translation:
  language: de
  text: Darum lasst uns denen anschließen, die in Frömmigkeit friedlich leben, nicht aber denen, die heuchlerisch Frieden wollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: wollen wir uns … anschließen
  rationale: Das Verb bezeichnet ein enges Sich-Anschließen oder Sich-Halten an andere; die inklusive Aufforderung des griechischen Konjunktivs wird natürlich wiedergegeben.
- source_word: εὐσεβείας
  choice: Gottesfurcht
  rationale: Im frühchristlichen Kontext bezeichnet εὐσέβεια eine auf Gott ausgerichtete ehrfürchtige Lebenshaltung; „Gottesfurcht“ ist hier klarer und weniger kirchlich gefärbt als „Frömmigkeit“.
- source_word: εἰρηνεύουσιν
  choice: Frieden halten
  rationale: Das Verb meint, in Frieden zu leben beziehungsweise Frieden zu wahren. „Frieden halten“ bewahrt den aktiven Aspekt, ohne Gottesfurcht fälschlich zum Gegenstand einer Versöhnung zu machen.
- source_word: μεθ᾽ ὑποκρίσεως βουλομένοις εἰρήνην
  choice: die heuchlerisch Frieden wollen
  rationale: μεθ᾽ ὑποκρίσεως beschreibt die Art ihres Friedenswillens. Die adverbiale Wiedergabe vermeidet den missverständlichen Eindruck, „Heuchelei“ sei das Gegenüber, mit dem Frieden gesucht wird.
theological_decisions:
- issue: Bedeutung von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: Beide Wiedergaben sind möglich. „Gottesfurcht“ macht die religiöse Ausrichtung ausdrücklich, ohne eine besondere konfessionelle Frömmigkeitsform einzutragen.
- issue: Bezug von μεθ᾽ ὑποκρίσεως
  choice: 'modal auf das Wollen des Friedens bezogen: „heuchlerisch Frieden wollen“'
  alternative: „Frieden mit Heuchelei wollen“
  rationale: Die Präpositionalgruppe kennzeichnet am plausibelsten die Haltung beziehungsweise Art des Friedenswillens; die Alternative wäre im Deutschen sachlich irreführend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der ethische Gegensatz des Griechischen bleiben erhalten; unnötige Zusätze wie „nur zum Schein“ wurden vermieden.
