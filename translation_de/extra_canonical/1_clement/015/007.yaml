lexical_decisions:
- source_word: παρρησιάσομαι
  choice: werde ich frei und offen reden
  rationale: Das Verb bezeichnet freimütiges, unerschrockenes und öffentlich-offenes Reden; die Verbindung „frei und offen reden“ gibt diese Bedeutungsbreite in natürlichem Deutsch wieder.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die formal entsprechende Wiedergabe bewahrt die Mehrdeutigkeit der griechischen Präpositionalfügung, auch wenn im Zusammenhang ebenso ein Reden „für ihn“ beziehungsweise „seinetwegen“ gemeint sein kann.
theological_decisions:
- issue: Bezug und Funktion von ἐν αὐτῷ
  choice: in ihm
  alternative: für ihn / seinetwegen
  rationale: Der knappe Ausschnitt lässt nicht zweifelsfrei erkennen, ob ἐν instrumental, relational oder zugunsten der bezeichneten Person zu verstehen ist. Der Haupttext erhält daher die genuine Spannung, während die Fußnote die idiomatisch plausible Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am knappen griechischen Wortlaut und vermeidet eine vorschnelle Auflösung der Präpositionalfügung.
