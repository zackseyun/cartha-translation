  terminology: „Bund“ ist für διαθήκη im vorliegenden Schriftzitat sachgerecht. „Aufrichtig“ für εὐθεῖα und „treu“ für ἐπιστώθησαν sind semantisch tragfähig und vermeiden unnötige dogmatische oder interpretierende Zusätze.
