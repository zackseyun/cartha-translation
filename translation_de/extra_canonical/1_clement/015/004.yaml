id: 1CLEM.15.4
reference: 1 Clement 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν καὶ τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν, ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ, οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: de
  text: 'Und wieder heißt es: „Sie liebten ihn mit ihrem Mund und belogen ihn mit ihrer Zunge; doch ihr Herz war ihm gegenüber nicht aufrichtig, und sie waren seinem Bund nicht treu.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  choice: Sie liebten ihn mit ihrem Mund
  rationale: Die auffällige wörtliche Rede vom Lieben mit dem Mund bleibt erhalten, weil der Kontrast zwischen äußerem Bekenntnis und innerer Haltung den Sinn trägt.
- source_word: ἐψεύσαντο αὐτόν
  choice: belogen ihn
  rationale: Das Verb bezeichnet hier, auf eine Person bezogen, das Belügen; die Formulierung ist im Deutschen direkt und natürlich.
- source_word: οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  choice: war ihm gegenüber nicht aufrichtig
  rationale: εὐθεῖα bedeutet bildlich „gerade, rechtschaffen, aufrichtig“; „ihm gegenüber“ gibt μετ᾽ αὐτοῦ idiomatisch wieder, ohne die Beziehung näher zu deuten.
- source_word: οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  choice: und sie waren seinem Bund nicht treu
  rationale: Die passive Form von πιστόω kann hier den Zustand beziehungsweise das Erweisen von Treue ausdrücken. Die knappe Wiedergabe vermeidet den Zusatz „als treu befunden“ und fasst ἐν idiomatisch als Zugehörigkeit und Verpflichtung innerhalb des Bundes.
theological_decisions:
- issue: Bedeutung von διαθήκη
  choice: Bund
  alternative: Verfügung / Testament
  rationale: Im Schriftzitat bezeichnet διαθήκη die von Gott gestiftete Bundesbeziehung; „Bund“ ist hier die sachlich und traditionsgeschichtlich angemessene, konfessionell neutrale Wiedergabe.
- issue: Nuance von ἐπιστώθησαν
  choice: waren … treu
  alternative: erwiesen sich … als treu / wurden als treu befunden
  rationale: Der griechische Aorist Passiv lässt eine stärker ereignisbezogene Nuance zu. Im Kontext steht jedoch die fehlende Bundestreue im Vordergrund; die gewählte Fassung bleibt knapp und vermeidet eine zusätzliche Vorstellung von Prüfung oder Urteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bildsprache von Mund, Zunge und Herz sowie der Gegensatz zwischen äußerem Liebesbekenntnis und innerer Untreue bleiben deutlich erhalten.
