  language: de
  text: 'Und wiederum: »Mit ihrem Mund segneten sie, doch in ihrem Herzen fluchten sie.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογοῦσαν
  choice: segneten sie
  rationale: Das Imperfekt wird als fortdauernde oder wiederholte Handlung in der Vergangenheit wiedergegeben; »segnen« bewahrt die religiöse und sprachliche Spannung zum folgenden Fluchen.
- source_word: κατηρῶντο
  choice: fluchten sie
  rationale: Das ebenfalls imperfektische Verb bezeichnet Verwünschen oder Verfluchen. »fluchten« ist hier natürlich und erhält den deutlichen Gegensatz zu »segneten«.
- source_word: τῇ καρδίᾳ αὐτῶν
  choice: in ihrem Herzen
  rationale: Die Wendung bezeichnet die innere Haltung und wird in idiomatischem, zugleich traditionsnahem Deutsch wiedergegeben.
theological_decisions:
- issue: Gegensatz zwischen äußerer Rede und innerer Haltung
  choice: »Mit ihrem Mund segneten sie, doch in ihrem Herzen fluchten sie.«
  alternative: »Mit ihrem Mund priesen sie, aber in ihrem Herzen verwünschten sie.«
  rationale: Die Übersetzung bewahrt den scharfen Gegensatz des griechischen Textes, ohne näher zu bestimmen, wen sie segneten oder verfluchten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; die parallele Satzstruktur und der Gegensatz zwischen Mund und Herz bleiben erhalten.
