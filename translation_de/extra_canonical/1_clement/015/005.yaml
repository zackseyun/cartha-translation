  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: de
  text: 'Darum mögen die trügerischen Lippen verstummen, die gegen den Gerechten Unrecht reden. Und wiederum: »Der Herr möge alle trügerischen Lippen ausrotten, die großsprecherische Zunge und alle, die sagen: ›Wir machen unsere Zunge groß; unsere Lippen gehören uns.[a] Wer ist Herr über uns?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Unsere Lippen sind bei uns.«'
    reason: Dokumentiert die konkrete, mehrdeutige griechische Wendung hinter der idiomatischen Übersetzung »gehören uns«.
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: sollen … verstummen
  rationale: Gibt den auffordernden Wunschcharakter und das Ergebnis des Stummwerdens natürlich wieder.
- source_word: ἀνομίαν
  choice: gesetzlos
  rationale: Bewahrt den Bezug auf Gesetzlosigkeit beziehungsweise Unrecht, ohne den Ausdruck auf bloße Beleidigung zu verengen.
- source_word: γλῶσσαν μεγαλοῤῥήμονα
  choice: die großsprecherische Zunge
  rationale: Erhält das bildhafte Organ und gibt die Bedeutung von prahlerischer, anmaßender Rede in gehobenem, verständlichem Deutsch wieder.
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  choice: Wir machen unsere Zunge groß
  rationale: Bewahrt die auffällige Metapher und die transitive Konstruktion des Griechischen, statt sie deutend in eine Aussage über Macht oder Überlegenheit umzuschreiben.
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: unsere Lippen gehören uns
  rationale: Gibt den idiomatischen Sinn der selbstherrlichen Verfügung über die eigene Rede wieder; die wörtlichere Fassung wird in der Fußnote festgehalten.
theological_decisions:
- issue: Bezeichnung τοῦ δικαίου im Singular
  choice: des Gerechten
  alternative: des gerechten Menschen
  rationale: Der substantivierte Singular bleibt wie im Griechischen offen dafür, ob ein bestimmter Gerechter oder der Gerechte als Typus gemeint ist.
- issue: κύριος in der abschließenden Frage
  choice: Herr
  alternative: Gebieter
  rationale: Bewahrt den im biblischen Zitat theologisch gewichtigen und zugleich allgemein verständlichen Herrschaftstitel, ohne die rhetorische Frage näher zu bestimmen.
- issue: Wunschform der Vernichtungsaussage
  choice: Der Herr möge … ausrotten
  alternative: Der Herr wird … ausrotten
  rationale: Folgt dem optativisch beziehungsweise jussivisch verstandenen Charakter der überlieferten Form und vermeidet, die Aussage als reine Zukunftsprognose festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Ton für das Schriftzitat. Die Parallelismen und die markante Metaphorik von Lippen und Zunge bleiben erhalten; ungewöhnliche Bildsprache wird nicht vorschnell geglättet.
