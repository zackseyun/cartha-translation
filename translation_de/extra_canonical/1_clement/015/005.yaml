  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „gegen den Gerechten Unrecht reden“ ist zugleich natürlich und näher an der griechischen Objektkonstruktion als „gesetzlos reden“.
  terminology: „trügerische Lippen“, „der Gerechte“, „großsprecherische Zunge“, „ausrotten“ und „Herr“ sind angemessen. Die Fußnote bildet die mehrdeutige Wendung παρ᾽ ἡμῖν korrekt ab, ohne sie dogmatisch festzulegen.
