source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: de
  text: »Wegen des Elends der Armen und wegen des Seufzens der Bedürftigen werde ich jetzt aufstehen«, spricht der Herr. »Ich werde Rettung bringen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταλαιπωρίας
  choice: Elends
  rationale: Gibt die bedrückende Notlage der Armen natürlich und treffend wieder.
- source_word: πτωχῶν
  choice: Armen
  rationale: Bezeichnet Menschen in Armut; die substantivierte deutsche Form entspricht dem Kontext.
- source_word: στεναγμοῦ
  choice: Seufzens
  rationale: Bewahrt das konkrete Bild des hörbaren Ausdrucks von Leid.
- source_word: πενήτων
  choice: Bedürftigen
  rationale: Unterscheidet den Ausdruck angemessen von πτωχῶν und bezeichnet Menschen, denen es am Lebensnotwendigen fehlt.
- source_word: ἀναστήσομαι
  choice: werde ich jetzt aufstehen
  rationale: Bewahrt das Bild göttlichen Sich-Erhebens zum Eingreifen; νῦν wird ausdrücklich mit „jetzt“ wiedergegeben.
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: Ich werde ihn in Sicherheit bringen
  rationale: Natürliches Deutsch für das Setzen beziehungsweise Versetzen in einen Zustand der Rettung oder Sicherheit; das im Zitat vorausgesetzte singularische Objekt bleibt erhalten.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt bei θήσομαι
  choice: „ihn“
  alternative: „sie“ oder eine unpersönliche Formulierung
  rationale: Der überlieferte griechische Wortlaut nennt kein ausdrückliches Objekt. Der unmittelbare Psalmkontext und die konsultierte Fassung legen ein singularisches männliches Objekt nahe; „ihn“ bewahrt diese traditionelle syntaktische Ergänzung, ohne sie näher zu identifizieren.
- issue: Bedeutungsumfang von σωτήριον
  choice: „Sicherheit“
  alternative: „Rettung“ oder „Heil“
  rationale: Im Zusammenhang mit dem Elend und Seufzen bedrängter Menschen bezeichnet der Ausdruck vor allem einen geschützten, geretteten Zustand. „Sicherheit“ vermeidet eine unnötige dogmatische Verengung auf „Heil“.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Satzstruktur des griechischen Zitats und das konkrete Bild des Aufstehens wurden bewahrt.
