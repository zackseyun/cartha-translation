id: 1CLEM.7.7
reference: 1 Clement 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: de
  text: Jona kündigte den Einwohnern von Ninive den Untergang an. Sie aber bereuten ihre Sünden, besänftigten Gott durch ihr Flehen und wurden gerettet, obwohl sie Gott fremd waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστροφήν
  choice: den Untergang
  rationale: Bezeichnet hier die angekündigte Vernichtung bzw. den Untergang Ninives; die substantivische Form wahrt die Aussage des Griechischen natürlich.
- source_word: μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν
  choice: bereuten ihre Sünden
  rationale: Gibt die Umkehr in Bezug auf ihre Verfehlungen idiomatisch und präzise wieder.
- source_word: ἐξιλάσαντο τὸν θεόν
  choice: besänftigten Gott
  rationale: Das Verb hat Gott als direktes Objekt und bezeichnet hier das Besänftigen bzw. Gnädig-Stimmen Gottes; diese Wiedergabe bewahrt die griechische Syntax ohne den Begriff 'Sühne' unnötig zu systematisieren.
- source_word: ἱκετεύσαντες
  choice: durch ihr Flehen
  rationale: Der Partizipialausdruck bezeichnet das inständige Bitten als Mittel, durch das sie Gott besänftigten.
- source_word: ἔλαβον σωτηρίαν
  choice: wurden gerettet
  rationale: Eine natürliche deutsche Wiedergabe von 'empfingen Rettung', ohne den Sinn abzuschwächen.
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: Gott fremd
  rationale: Bewahrt die relationale Aussage des Genitivs und die Spannung, dass Menschen außerhalb der Gottesbeziehung dennoch Rettung empfingen.
theological_decisions:
- issue: Bedeutung von ἐξιλάσαντο mit Gott als direktem Objekt
  choice: besänftigten Gott
  alternative: leisteten Gott Sühne / versöhnten sich mit Gott
  rationale: Die gewählte Form folgt der transitiven Konstruktion und vermeidet, die Aussage in eine bestimmte Sühnetheorie oder eine wechselseitige Versöhnung umzudeuten.
- issue: Status der Niniviten als ἀλλότριοι τοῦ θεοῦ
  choice: obwohl sie Gott fremd waren
  alternative: obwohl sie nicht zu Gottes Volk gehörten
  rationale: Die allgemeinere Formulierung bewahrt die genuine Mehrdeutigkeit zwischen religiöser Entfremdung und Zugehörigkeit außerhalb des Gottesvolkes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber der langen griechischen Periode leicht gegliedert, während die Abfolge von Verkündigung, Reue, Flehen und Rettung erhalten bleibt.
