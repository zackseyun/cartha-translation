  source_fidelity: 'Die Übersetzung gibt die Abfolge und die syntaktischen Beziehungen des Griechischen zuverlässig wieder: Jona verkündigt Ninive den Untergang; die Niniviten bereuen hinsichtlich ihrer Sünden, flehen und besänftigen dadurch Gott; anschließend erlangen sie Rettung. Besonders „besänftigten Gott“ wahrt bei ἐξιλάσαντο τὸν θεόν das direkte Objekt und vermeidet die unzutreffende Umformung zu einer bloß indirekten Handlung „vor Gott“.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch in angemessen würdigem Register. „Gott fremd“ und „durch ihr Flehen“ sind idiomatisch und dem Kontext angemessen. Die Aufteilung der griechischen Periode in zwei Sätze ist klar und ohne Sinnverlust.
  terminology: „Untergang“ für καταστροφή, „bereuten ihre Sünden“ für μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν, „besänftigten Gott“ für ἐξιλάσαντο τὸν θεόν und „gerettet“ für ἔλαβον σωτηρίαν sind sachgerecht. Die Übersetzung von ἀλλότριοι τοῦ θεοῦ als „Gott fremd“ bewahrt die beabsichtigte Offenheit, ohne eine engere ethnisch- oder konfessionell-theologische Deutung einzutragen.
