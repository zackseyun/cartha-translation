source:
  edition: Funk 1901 (normalized OCR)
  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: de
  text: Lasst uns alle Generationen durchgehen und gründlich erkennen, dass der Herr von Generation zu Generation denen Raum zur Umkehr gegeben hat, die sich ihm zuwenden wollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  choice: Gehen wir alle Generationen durch
  rationale: Bewahrt das Bild des Durchschreitens bzw. Durchgehens der gesamten Folge früherer Generationen, ohne einen ausdrücklichen Rückblick in den griechischen Text hineinzutragen.
- source_word: καταμάθωμεν
  choice: erkennen wir genau
  rationale: Gibt die verstärkende Bedeutung des Verbs als sorgfältiges, gründliches Erfassen in natürlichem modernem Deutsch wieder.
- source_word: ἐν γενεᾷ καὶ γενεᾷ
  choice: Von Generation zu Generation
  rationale: Eine natürliche deutsche Wiedergabe der distributiven griechischen Wendung, die das wiederholte Handeln in jeder Generation bezeichnet.
- source_word: μετανοίας τόπον
  choice: Raum zur Umkehr
  rationale: Erhält die Bildsprache von τόπος und gibt μετάνοια als umfassende Umkehr statt lediglich als Reue wieder.
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: denen, die sich ihm zuwenden wollen
  rationale: Bewahrt sowohl den Willensaspekt von βούλομαι als auch die Richtung der Hinwendung; ein nicht ausdrücklich vorhandenes „zurück“ wird vermieden.
theological_decisions:
- issue: Gottesbezeichnung δεσπότης
  choice: der Herr
  alternative: der Gebieter
  rationale: „Herr“ ist im Deutschen würdig und verständlich und bezeichnet hier den souveränen göttlichen Herrn. „Gebieter“ wäre lexikalisch möglich, klänge aber stärker herrisch und weniger natürlich.
- issue: Bedeutungsumfang von μετάνοια
  choice: Umkehr
  alternative: Buße
  rationale: „Umkehr“ hält die grundlegende Bedeutung einer veränderten Ausrichtung offen und vermeidet konfessionelle oder institutionelle Nebenbedeutungen, die „Buße“ im heutigen Deutsch haben kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht exhortativem Rhythmus. Die parallele Formulierung „Von Generation zu Generation“ bewahrt den feierlichen Charakter, bleibt aber allgemein verständlich.
