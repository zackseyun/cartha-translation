source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἴδωμεν, τί καλὸν καὶ τί τερπνὸν καὶ τί προσδεκτὸν τῷ ποιήσαντι ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/003.yaml
  text: And let us see what is good, and what is delightful, and what is acceptable to the one who made us.
translation:
  language: de
  text: Und lasst uns sehen, was gut, was erfreulich und was dem, der uns geschaffen hat, willkommen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: lasst uns erkennen
  rationale: Im Zusammenhang bezeichnet das Verb mehr als bloßes Sehen; die inklusive Aufforderung zielt auf prüfendes Wahrnehmen und Erkennen.
- source_word: καλόν
  choice: gut
  rationale: Gibt den ethisch wertenden Sinn hier schlicht und natürlich wieder, ohne die mögliche Nuance von »schön« unnötig auszuschließen.
- source_word: τερπνόν
  choice: erfreulich
  rationale: Bewahrt als eigener Ausdruck neben »gut« und »willkommen« die Bedeutung von etwas, das Freude bereitet.
- source_word: προσδεκτόν
  choice: willkommen
  rationale: Drückt aus, was bei jemandem Annahme findet; die Konstruktion mit dem Dativ wird natürlich als »dem willkommen« wiedergegeben.
- source_word: τῷ ποιήσαντι ἡμᾶς
  choice: dem, der uns geschaffen hat
  rationale: Gibt das substantivierte Aoristpartizip verständlich und würdig wieder; »geschaffen« passt im Deutschen bei Gott als Schöpfer besser als das allgemeinere »gemacht«.
theological_decisions:
- issue: Bezug der drei Eigenschaften
  choice: Alle drei Prädikate bleiben parallel und werden nicht ausdrücklich als »vor Gott« zusammengezogen.
  alternative: »was vor unserem Schöpfer gut, erfreulich und annehmbar ist«
  rationale: Der griechische Dativ steht ausdrücklich nur bei προσδεκτόν. Die Übersetzung erhält diese syntaktische Spannung, statt den Gottesbezug stillschweigend auf alle drei Adjektive auszudehnen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache τί-Struktur wird durch die Wiederholung von »was« bewahrt; »dem, der uns geschaffen hat« bleibt geschlechtsneutral in Bezug auf die Menschen und natürlich in Bezug auf Gott.
