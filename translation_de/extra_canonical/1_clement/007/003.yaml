  source_fidelity: Die dreigliedrige Struktur von τί ... τί ... τί sowie der auf προσδεκτόν bezogene Dativ τῷ ποιήσαντι ἡμᾶς werden grundsätzlich zutreffend wiedergegeben. Für ἴδωμεν ist „lasst uns sehen“ die nähere, unmarkierte Entsprechung; „erkennen“ legt einen stärker kognitiven Schluss nahe, der im griechischen Verb nicht ausdrücklich enthalten ist.
  naturalness: 'Die Formulierung ist würdig und verständlich. Die Stellung des Relativsatzes sollte jedoch unmittelbar an „dem“ angeschlossen werden: „dem, der uns geschaffen hat, willkommen ist“. Dadurch wird der Bezug klar und der Satz flüssiger.'
  terminology: „gut“, „erfreulich“ und „willkommen“ erhalten die drei unterschiedlichen Prädikate. „Willkommen“ ist hier eine natürliche Wiedergabe von προσδεκτόν im Sinn von bei jemandem angenommen bzw. akzeptabel; es wird kein zusätzlicher theologischer Fachbegriff eingeführt.
  issues:
