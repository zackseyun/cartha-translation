id: 1CLEM.7.4
reference: 1 Clement 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: de
  text: Lasst uns unseren Blick auf das Blut des Messias richten und erkennen, wie kostbar es seinem Gott und Vater ist[a], denn es wurde zu unserer Rettung vergossen und brachte der ganzen Welt die Gnade zur Umkehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott, seinem Vater“.'
    reason: Die alternative deutsche Wortstellung kann die Apposition stärker hervorheben. „Seinem Gott und Vater“ gibt die durch den einen griechischen Artikel eng verbundene Wortgruppe unmittelbar wieder.
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Lasst uns unseren Blick … richten
  rationale: Gibt den auffordernden Aorist-Konjunktiv und das intensive, aufmerksame Hinschauen natürlich und würdig wieder.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Χριστός ist der griechische Titel für den Gesalbten; „Messias“ bewahrt hier den Titelcharakter.
- source_word: τίμιον
  choice: kostbar
  rationale: Bezeichnet hohen Wert und große Kostbarkeit; im Bezug auf Blut ist „kostbar“ im Deutschen idiomatisch.
- source_word: σωτηρίαν
  choice: Rettung
  rationale: Gibt den umfassenden Sinn von Bewahrung und Heil wieder, ohne ihn auf eine konfessionelle Fachbedeutung zu verengen.
- source_word: μετανοίας
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Sinnes- und Lebenswendung; „Umkehr“ ist verständlich und wahrt die ethische wie geistliche Dimension.
- source_word: χάριν
  choice: Gnade
  rationale: Bewahrt den ausdrücklich theologischen Begriff der unverdienten Gunst oder Gabe.
- source_word: διήνεγκεν
  choice: brachte
  rationale: Das Verb bedeutet hier „darbringen, gewähren, zukommen lassen“; „brachte“ bildet die Aussage knapp und natürlich ab.
theological_decisions:
- issue: Beziehung des Messias zu Gott und Vater in τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: seinem Gott und Vater
  alternative: Gott, seinem Vater
  rationale: Der eine Artikel verbindet θεῷ und πατρὶ, während αὐτοῦ die gesamte Wortgruppe bestimmt. Die gewählte Fassung bewahrt die ausdrückliche relationale Aussage, ohne sie abzuschwächen.
- issue: Bezug des Partizips ἐκχυθέν und Subjekt von διήνεγκεν
  choice: Das Blut wurde vergossen und brachte die Gnade
  alternative: Der Messias vergoss sein Blut und brachte die Gnade
  rationale: Das grammatische Bezugswort ist αἷμα; die Übersetzung erhält diese Bildführung und ergänzt kein ausdrücklich handelndes Subjekt.
- issue: Reichweite von παντὶ τῷ κόσμῳ
  choice: der ganzen Welt
  alternative: allen Menschen in der Welt
  rationale: Die wörtliche kosmische Reichweite bleibt erhalten; der Text selbst legt nicht ausdrücklich fest, ob damit ausnahmslos jeder Einzelne gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem frühchristlichem Ton. Die Aufforderung bleibt gemeinschaftlich und eindringlich; traditionelle, aber verständliche Begriffe wie „Gnade“ werden beibehalten.
