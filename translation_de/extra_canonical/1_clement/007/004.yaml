    issue: Satzzeichen und Konnektor vor „Denn“
    rationale: 'ὅτι leitet die Begründung unmittelbar ein. Das deutsche Komma mit „denn“ stellt die syntaktische und gedankliche Verbindung flüssiger her als „: Denn“.'
  - severity: low
    issue: „Gnade der Umkehr“
    rationale: Der Genitiv kann im Deutschen missverständlich als eine der Umkehr eigene Gnade verstanden werden. „Gnade zur Umkehr“ gibt μετανοίας χάριν als gewährte Möglichkeit bzw. Gunst zur Umkehr klarer wieder.
  - severity: low
    issue: Begründung der Fußnote
    rationale: Die alternative deutsche Fassung beruht nicht auf einer wesentlich anderen Gliederung des griechischen Ausdrucks. Der griechische Einzelartikel verbindet „Gott“ und „Vater“, und αὐτοῦ bezieht sich natürlich auf die koordinierte Gruppe.
