  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Begriffe des Griechischen zutreffend wieder: Das Blut ist sowohl das zu unserer Rettung Vergossene als auch das Subjekt von διήνεγκεν; „seinem Gott und Vater“ bildet τῷ θεῷ καὶ πατρὶ αὐτοῦ angemessen ab. Für μετανοίας χάριν ist „die Gnade zur Umkehr“ im Deutschen semantisch klarer als „die Gnade der Umkehr“.'
  naturalness: Die Formulierung ist insgesamt modernes, würdiges Standarddeutsch. Der Doppelpunkt mit anschließendem „Denn“ trennt jedoch einen im Griechischen durch ὅτι eng begründenden Satz unnötig stark. Ein Komma und kleingeschriebenes „denn“ sind natürlicher.
  terminology: „Messias“, „kostbar“, „Rettung“, „Gnade“ und „Umkehr“ sind registergerecht und sachlich treffend. Die Fußnotenalternative ist als deutsche Umstellung möglich, sollte aber nicht mit einer angeblich unterschiedlichen griechischen Gliederung begründet werden; die Grundfassung gibt die enge Verbindung am besten wieder.
  issues:
