id: 1CLEM.7.2
reference: 1 Clement 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: de
  text: Darum wollen wir die leeren und vergeblichen Sorgen hinter uns lassen und uns der ruhmreichen und ehrwürdigen Richtschnur unserer Überlieferung zuwenden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολίπωμεν
  choice: wollen wir … hinter uns lassen
  rationale: Der hortative Konjunktiv wird im Deutschen natürlich als gemeinsame Aufforderung wiedergegeben.
- source_word: φροντίδας
  choice: Sorgen
  rationale: Bezeichnet hier gedankliche Beschäftigungen oder Besorgnisse; „Sorgen“ ist verständlich und bewahrt den negativen Zusammenhang mit „leer und vergeblich“.
- source_word: ἔλθωμεν ἐπὶ
  choice: uns … zuwenden
  rationale: Die wörtliche Bewegung „zu … kommen“ bezeichnet im Zusammenhang den bewussten Übergang zu einer maßgeblichen Orientierung; „sich zuwenden“ klingt im modernen Deutschen natürlicher.
- source_word: εὐκλεῆ
  choice: ruhmreichen
  rationale: Bewahrt die Bedeutung „ruhmvoll, angesehen“ und vermeidet eine Abschwächung zu bloß „gut“.
- source_word: σεμνὸν
  choice: ehrwürdigen
  rationale: Gibt die Bedeutung „der Achtung und Verehrung würdig“ präziser wieder als „feierlich“ oder „ernst“.
- source_word: κανόνα
  choice: Richtschnur
  rationale: Bezeichnet einen normgebenden Maßstab; „Richtschnur“ bewahrt das Bild und ist hier weniger institutionell verengt als „Kanon“.
- source_word: παραδόσεως
  choice: Überlieferung
  rationale: Gibt das Weitergegebene beziehungsweise den Vorgang des Weitergebens wieder, ohne eine spätere konfessionelle Traditionslehre einzutragen.
theological_decisions:
- issue: Verhältnis von κανών und παράδοσις
  choice: Richtschnur unserer Überlieferung
  alternative: Kanon unserer Tradition
  rationale: Die gewählte Formulierung bewahrt den Genitiv und die normgebende Aussage, ohne „Kanon“ vorschnell auf einen festgelegten Schriftkanon zu beziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemeinschaftlich-mahnendem Ton. Die parallelen Adjektive und die Bewegung vom Verlassen zum Zuwenden bleiben erhalten.
