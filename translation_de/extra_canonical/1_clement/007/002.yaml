  source_fidelity: 'Die Übersetzung folgt dem griechischen Satzbau und Sinn sehr genau: διό ist mit „Darum“ angemessen wiedergegeben; die beiden wertenden Adjektive zu φροντίδας erscheinen vollständig als „leer und vergeblich“. Der hortative Konjunktiv ἀπολίπωμεν / ἔλθωμεν wird idiomatisch als gemeinschaftliche Aufforderung gestaltet. „Richtschnur unserer Überlieferung“ gibt κανόνα τῆς παραδόσεως wieder, ohne einen späteren fest umrissenen Schriftkanon zu unterstellen.'
  naturalness: Das Deutsch ist modernes Standarddeutsch, flüssig und dem würdig-ermahnenden Register angemessen. „Hinter uns lassen“ und „uns ... zuwenden“ bilden den im Griechischen vorhandenen Kontrast zwischen Abwenden und Hinwenden natürlich ab.
  terminology: „Ruhmreich“ trifft εὐκλεής im Sinn von ruhmvoll/hoch angesehen; „ehrwürdig“ trifft σεμνός als verehrungs- bzw. achtungswürdig besser als „feierlich“. „Überlieferung“ ist für παράδοσις sachlich und konfessionell nicht überladen. Die Fußnote des englischen Audit Trail betrifft eine verworfene englische Alternative und verlangt im Deutschen keinen Anker.
