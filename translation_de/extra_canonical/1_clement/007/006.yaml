lexical_decisions:
- source_word: ἐκήρυξεν
  choice: verkündete
  rationale: Gibt das öffentliche Ausrufen bzw. Verkündigen natürlich und würdig wieder.
- source_word: μετάνοιαν
  choice: Umkehr
  rationale: Bezeichnet eine grundlegende Sinnes- und Lebensänderung; „Umkehr“ ist im heutigen Deutsch prägnant und vermeidet eine Verengung auf bloße Reue.
- source_word: οἱ ὑπακούσαντες
  choice: alle, die gehorchten
  rationale: Gibt das substantivierte Partizip verständlich wieder. „Gehorchten“ bewahrt den Gedanken des Hörens mit entsprechender Reaktion.
- source_word: ἐσώθησαν
  choice: wurden gerettet
  rationale: Entspricht dem Passiv des griechischen Verbs und lässt den Handelnden wie im Ausgangstext unausgesprochen.
theological_decisions:
- issue: Bezug des Gehorsams
  choice: „die gehorchten“ ohne ausdrückliches Objekt
  alternative: „die auf ihn hörten“ oder „seiner Botschaft gehorchten“
  rationale: Der griechische Text nennt kein Objekt. Die offene Formulierung bewahrt diese Knappheit und Mehrdeutigkeit.
translation_notes:
  register: Kurzer, klarer und würdiger Aussagesatz in modernem Standarddeutsch; die Parallelstruktur des griechischen Textes bleibt erhalten.
