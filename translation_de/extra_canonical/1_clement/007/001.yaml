id: 1CLEM.7.1
reference: 1 Clement 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: de
  text: Dies, Geliebte, haben wir nicht nur geschrieben, um euch zu ermahnen, sondern auch, um uns selbst daran zu erinnern; denn wir befinden uns in derselben Kampfbahn, und derselbe Wettkampf steht uns bevor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: ihr Geliebten
  rationale: Bewahrt die herzliche Anrede und den substantivischen Charakter des griechischen Ausdrucks in würdigem, verständlichem Deutsch.
- source_word: νουθετοῦντες
  choice: um euch zu ermahnen
  rationale: Gibt die Bedeutung des mahnenden Zurechtweisens beziehungsweise Anleitens natürlich wieder.
- source_word: ὑπομιμνήσκοντες
  choice: um uns selbst daran zu erinnern
  rationale: Drückt die reflexive Erinnerung aus und nimmt mit „daran“ auf das zuvor Geschriebene Bezug.
- source_word: σκάμματι
  choice: Kampfbahn
  rationale: Der Ausdruck bezeichnet hier bildlich den Ort des athletischen Kampfes; „Kampfbahn“ erhält das zusammenhängende Wettkampfmotiv.
- source_word: ἀγὼν
  choice: Wettkampf
  rationale: Passt zum Bild der Kampfbahn und bewahrt den Sinn einer anstehenden mühevollen Auseinandersetzung, ohne ihn vorschnell zu vergeistigen.
- source_word: ἐπίκειται
  choice: steht uns bevor
  rationale: Gibt idiomatisch wieder, dass derselbe Kampf auf beiden Seiten liegt beziehungsweise unmittelbar ansteht.
theological_decisions:
- issue: Gemeinsame Verantwortung von Verfassern und Adressaten
  choice: „wir befinden uns in derselben Kampfbahn“
  alternative: „wir sind im selben Kampf“
  rationale: Die bildhafte Aussage schließt die Schreibenden ausdrücklich in dieselbe Lage und Prüfung ein, ohne die Metaphern von Ort und Wettkampf zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die athletische Metaphorik des griechischen Textes wird durch „Kampfbahn“ und „Wettkampf“ konsequent bewahrt; die inklusive Selbstmahnung der Schreibenden bleibt deutlich.
