source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: de
  text: Denn du, Gebieter, himmlischer König der Zeitalter, gibst den Menschenkindern Herrlichkeit, Ehre und Vollmacht über die, die auf der Erde leben. Herr, lenke ihren Rat auf das hin, was vor dir gut und wohlgefällig ist, damit sie die ihnen von dir gegebene Vollmacht in Frieden, Sanftmut und Gottesfurcht ausüben und so deine Gunst[a] erlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte griechische Text lautet hier θεοῦ σου, wörtlich etwa „deines Gottes“. Die Lesart scheint verderbt zu sein; dem Zusammenhang nach ist wahrscheinlich „deine Gunst“ gemeint.
    reason: textual
lexical_decisions:
- source_word: δέσποτα
  choice: Gebieter
  rationale: Bewahrt die Anrede an Gott als souveränen Herrn und unterscheidet sie von κύριε.
- source_word: βασιλεῦ τῶν αἰώνων
  choice: König der Zeitalter
  rationale: Gibt den genitivischen Ausdruck formal und mit seiner zeitübergreifenden Bedeutung wieder, ohne ihn vorschnell zu „ewiger König“ zu glätten.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: den Menschenkindern
  rationale: Eine verständliche, zugleich würdige Wiedergabe der semitisch gefärbten Bezeichnung für Menschen.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Bezeichnet verliehene Herrschaftsbefugnis und passt sowohl zum göttlichen Verleihen als auch zur politischen Ausübung.
- source_word: διεύθυνον τὴν βουλὴν αὐτῶν
  choice: lenke ihren Rat
  rationale: Gibt den Imperativ als Bitte eindeutig wieder; βουλή kann Rat, Überlegung oder Beschluss meinen, weshalb „Rat“ die Offenheit knapp bewahrt.
- source_word: εὐσεβῶς
  choice: in Gottesfurcht
  rationale: Drückt hier eine gottbezogene, fromme Weise der Amtsführung natürlicher aus als das heute teils missverständliche „gottselig“.
- source_word: πραΰτητι
  choice: Sanftmut
  rationale: Bewahrt die ethische Qualität milder, nicht gewaltsamer Herrschaft in einer geläufigen würdigen Form.
theological_decisions:
- issue: Göttliche Einsetzung weltlicher Herrschaft
  choice: Die Vollmacht wird als von Gott gegeben bezeichnet, während zugleich um ihre gute, friedliche und gottesfürchtige Ausübung gebetet wird.
  alternative: Die Aussage als uneingeschränkte Billigung jeder konkreten Herrschaft zu formulieren.
  rationale: Der Text verbindet göttliche Verleihung mit einer ethischen Bitte und lässt dadurch die Spannung zwischen Autorisierung und verantwortlicher Amtsführung bestehen.
- issue: Unklare Schlusslesart θεοῦ σου
  choice: Im Haupttext kontextgemäß „deine Gunst“ und dazu eine textkritische Fußnote.
  alternative: Wörtlich „deines Gottes teilhaftig werden“ beziehungsweise „deinen Gott erlangen“.
  rationale: Die überlieferte Form im vorgelegten Quelltext ergibt mit τυγχάνωσιν in diesem Zusammenhang keinen tragfähigen Sinn; der Gebetszusammenhang und die konsultierte englische Fassung weisen auf eine beschädigte Lesart mit dem Sinn „Gunst“ hin. Die Unsicherheit wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der Imperativ διεύθυνον wird mit „Herr, lenke“ klar als Bitte formuliert. Die längere griechische Satzperiode bleibt erhalten, wird aber durch natürliche deutsche Gliederung verständlich gemacht.
