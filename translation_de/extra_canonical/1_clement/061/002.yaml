review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Anrede, die Gabe von δόξα, τιμή und ἐξουσία sowie die Bitte um eine friedliche, sanftmütige und εὐσεβῶς ausgeübte Herrschaft insgesamt zuverlässig wieder. τῶν ἐπὶ τῆς γῆς ὑπαρχόντων bedeutet jedoch zunächst „die auf der Erde sind/existieren“; „leben“ ist enger als der griechische Ausdruck. Die syntaktisch anstößige Schlussfolge θεοῦ σου τυγχάνωσιν kann nicht sinnvoll wörtlich übersetzt werden. Die kontextuelle Wiedergabe als Bitte um göttliche Gunst ist mit klarer textkritischer Fußnote vertretbar, darf aber nicht als sichere Lesart ausgegeben werden.
  naturalness: Der Stil ist würdig und gut verständlich. „Herr, lenke ihren Rat“ macht den Imperativ διεύθυνον klar. „Menschenkindern“ ist bewusst gehoben-biblisch, aber im Gebetsregister noch natürlich. Die kleine Änderung zu „auf der Erde sind“ ist zugleich näher am Ausgangstext.
  terminology: „Gebieter“ für δέσποτα, „König der Zeitalter“, „Vollmacht“, „Sanftmut“ und „Gottesfurcht“ sind angemessen. „Wohlgefällig“ trifft εὐάρεστον. Die Fußnote muss die Unsicherheit der beschädigt wirkenden Schlusslesart ausdrücklich bewahren.
  issues:
  - severity: low
    issue: „die auf der Erde leben“ verengt ὑπαρχόντων.
    rationale: ὑπάρχοντες bezeichnet allgemeiner diejenigen, die auf der Erde sind/existieren; der Text spezifiziert nicht ausdrücklich „leben“.
  revised_text: Denn du, Gebieter, himmlischer König der Zeitalter, gibst den Menschenkindern Herrlichkeit, Ehre und Vollmacht über die, die auf der Erde sind. Herr, lenke ihren Rat auf das hin, was vor dir gut und wohlgefällig ist, damit sie die ihnen von dir gegebene Vollmacht in Frieden, Sanftmut und Gottesfurcht ausüben und so deine Gunst[a] erlangen.
  revised_footnotes:
  - marker: a
    text: Der vorgelegte griechische Text lautet hier θεοῦ σου, wörtlich etwa „deines Gottes“. Diese Wortfolge ergibt mit „erlangen“ keinen klaren Sinn und scheint verderbt zu sein. Dem Zusammenhang nach ist wahrscheinlich eine Bitte gemeint, Gottes Gunst zu erlangen.
    reason: textual
  revision_rationale: Nur die Wiedergabe von ὑπάρχοντες wurde von „leben“ zu „sind“ geändert, um keine im Griechischen nicht ausdrücklich enthaltene Einschränkung einzuführen. Die textkritische Behandlung der unklaren Schlusslesart bleibt erhalten und kennzeichnet die kontextuelle Wiedergabe als wahrscheinlich, nicht als sicher.
