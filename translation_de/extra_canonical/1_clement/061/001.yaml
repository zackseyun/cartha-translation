id: 1CLEM.61.1
reference: 1 Clement 61:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: de
  text: Du, Herrscher, hast ihnen durch deine erhabene und unaussprechliche Macht die Regierungsgewalt gegeben, damit wir die Herrlichkeit und Ehre erkennen, die du ihnen verliehen hast, und uns ihnen unterordnen, ohne deinem Willen in irgendeiner Weise zu widerstreben. Schenke ihnen, Herr, Gesundheit, Frieden, Eintracht und Beständigkeit, damit sie die ihnen von dir verliehene Herrschaft ohne Anstoß ausüben können.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie die ihnen von dir verliehene Herrschaft ungehindert ausüben können.“'
    reason: ἀπροσκόπως kann sowohl „ohne Anstoß/Fehltritt“ als auch „ungehindert“ bedeuten.
lexical_decisions:
- source_word: δέσποτα
  choice: Herrscher
  rationale: Die Anrede bezeichnet den souveränen Gebieter; „Herrscher“ bewahrt diesen Akzent und unterscheidet sie vom folgenden κύριε.
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: Regierungsgewalt
  rationale: Die Wendung meint die verliehene Vollmacht zu regieren, nicht notwendig ein Königreich als Gebiet.
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: erhabene und unaussprechliche Macht
  rationale: Gibt sowohl die Majestät als auch die nicht erschöpfend beschreibbare Kraft Gottes wieder.
- source_word: ὁμόνοιαν
  choice: Eintracht
  rationale: Bezeichnet Übereinstimmung und gesellschaftlich-politische Harmonie.
- source_word: εὐστάθειαν
  choice: Beständigkeit
  rationale: Bewahrt den Sinn von Stabilität und gefestigtem Bestand, ohne ihn auf politische Sicherheit einzuengen.
- source_word: ἡγεμονίαν
  choice: Herrschaft
  rationale: Bezeichnet hier die von Gott verliehene leitende Regierungsstellung.
- source_word: ἀπροσκόπως
  choice: ohne Anstoß
  rationale: 'Die Formulierung erhält die mögliche Bedeutungsbreite: ohne Anstoß zu geben, ohne Fehltritt oder ungehindert.'
theological_decisions:
- issue: Göttliche Verleihung politischer Autorität
  choice: „die Regierungsgewalt gegeben“ und „von dir verliehene Herrschaft“
  alternative: Eine bloße göttliche Duldung staatlicher Gewalt
  rationale: Der griechische Text spricht ausdrücklich vom Geben der Gewalt und Herrschaft, ohne damit jede konkrete Regierungshandlung gutzuheißen.
- issue: Unterordnung unter Regierende und Gottes Wille
  choice: Die Unterordnung wird mit dem Nicht-Widerstreben gegen Gottes Willen verbunden.
  alternative: Eine ausdrückliche Begrenzung oder eine Forderung nach absolutem Gehorsam
  rationale: Die Spannung des Ausgangstextes bleibt stehen; weder wird eine unbedingte Gehorsamspflicht ergänzt noch eine im Vers nicht ausdrücklich genannte Ausnahme eingefügt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die zweimalige Gottesanrede wird entsprechend der unterschiedlichen griechischen Wörter als „Herrscher“ (δέσποτα) und „Herr“ (κύριε) wiedergegeben. Die lange Satzführung des Originals wurde bewahrt, bleibt aber gut verständlich.
