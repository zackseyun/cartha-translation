source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: de
  text: Dir, der allein imstande ist, dies und noch mehr Gutes unter uns[a] zu tun, danken wir durch den Hohepriester und Beschützer unserer Seelen, Jesus Christus, durch den dir Herrlichkeit und Majestät sei, jetzt und von Generation zu Generation und in alle Ewigkeit.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit uns“.'
    reason: Das griechische μεθ’ ἡμῶν kann Gottes Wirken „unter uns“ beziehungsweise sein Handeln „mit uns“ ausdrücken.
  - marker: b
    text: 'Wörtlich: „bis in die Zeitalter der Zeitalter“.'
    reason: Die Fußnote bewahrt die bildhafte griechische Ewigkeitsformel hinter der natürlichen deutschen Wiedergabe.
lexical_decisions:
- source_word: ἐξομολογούμεθα
  choice: danken wir
  rationale: Im Gebets- und Lobpreiskontext bezeichnet das Verb hier ein dankendes Bekenntnis beziehungsweise öffentliches Danken; „danken wir“ ist im Deutschen natürlich und entspricht der doxologischen Funktion.
- source_word: ἀρχιερέως
  choice: Hohepriester
  rationale: Gibt den kultischen Titel präzise und in geläufiger deutscher Form wieder.
- source_word: προστάτου
  choice: Beschützer
  rationale: Bewahrt die Bedeutung eines Beistands und Schutzherrn; „Beschützer“ ist verständlich und passt zu „unserer Seelen“.
- source_word: Χριστοῦ
  choice: Christus
  rationale: In der festen, feierlichen Verbindung „Jesus Christus“ fungiert Χριστός hier als etablierter Titel beziehungsweise Namensbestandteil; „Messias“ würde den Ausdruck im Kontext unnötig erklärend wiedergeben.
- source_word: μεγαλωσύνη
  choice: Majestät
  rationale: Entspricht dem erhabenen doxologischen Register und unterscheidet den Begriff passend von δόξα („Herrlichkeit“).
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: in alle Ewigkeit
  rationale: Natürliche, feierliche deutsche Wiedergabe der griechischen Steigerungsformel; die wörtliche Bildstruktur wird in einer Fußnote genannt.
theological_decisions:
- issue: Bezug der Doxologie δι’ οὗ σοι ἡ δόξα
  choice: „durch den dir Herrlichkeit und Majestät sei“
  alternative: „durch den Herrlichkeit und Majestät dir zukommen“
  rationale: Die Formulierung lässt den Vater als Empfänger der Herrlichkeit und Jesus Christus als den Mittler erkennen, ohne ein im Griechischen nicht ausdrücklich vorhandenes Verb dogmatisch auszubauen.
- issue: Bedeutung von μεθ’ ἡμῶν
  choice: „unter uns“
  alternative: „mit uns“
  rationale: „Unter uns“ bezeichnet plausibel Gottes Wirken in der Gemeinschaft; da σύντακτικά auch „mit uns“ möglich ist, bleibt diese Nuance in der Fußnote sichtbar.
translation_notes:
  register: Feierlich-liturgischer, aber gegenwärtig verständlicher Gebetsstil. Die lange griechische Satzbewegung bleibt erhalten; veraltete Formen und unnötig konfessionell geprägte Ausdrücke werden vermieden.
