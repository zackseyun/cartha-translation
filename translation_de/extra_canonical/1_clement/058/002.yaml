    issue: 'Die Doxologie wird als Optativ wiedergegeben: „Durch ihn sei Gott die Herrlichkeit“.'
    rationale: ἐστὶν ist Indikativ („ist/gebührt“). Die deutsche Fassung sollte keine Wunschform einführen.
  - severity: low
    issue: Die Formel „so wahr … und …, und so wahr …“ ist im Deutschen holprig.
    rationale: Das zweite „so wahr“ hat keine eigenständige griechische Entsprechung; eine einmalige, fortgeführte Bekräftigungsformel ist natürlicher und bewahrt die Ellipse.
  - severity: low
    issue: „Rechtsforderungen“ ist für δικαιώματα unnötig verwaltungs- bzw. rechtsförmlich.
    rationale: „Gerechte Bestimmungen“ wahrt den normativen Sinn und lässt sich klar von προστάγματα („Gebote“) unterscheiden.
