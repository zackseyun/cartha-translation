  naturalness: Die Überarbeitung glättet die Schwur-/Bekräftigungsformel, ohne ihre ungewöhnliche Personifikation abzuschwächen, und formuliert die Schlussdoxologie idiomatisch und dem griechischen Indikativ entsprechend.
  terminology: „Messias“ bleibt für Χριστός erhalten. „Gerechte Bestimmungen und Gebote“ bildet δικαιώματα und προστάγματα verständlich und unterscheidbar ab. „Zugeordnet und gezählt“ gibt ἐντεταγμένος καὶ ἐλλόγιμος präziser wieder als „eingereiht und aufgenommen“.
  issues:
