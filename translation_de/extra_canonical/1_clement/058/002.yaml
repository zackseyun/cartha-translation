  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: de
  text: Nehmt unseren Rat an, dann werdet ihr es nicht bereuen. Denn so wahr Gott lebt und der Herr Jesus, der Messias, lebt, so wahr leben auch der Heilige Geist und der Glaube und die Hoffnung der Erwählten:[a] Wer in Demut und mit aufrichtiger Milde ohne Reue die von Gott gegebenen gerechten Bestimmungen und Gebote erfüllt, wird durch Jesus, den Messias, der Zahl derer zugeordnet und zugerechnet werden, die gerettet werden. Durch ihn gebührt Gott die Herrlichkeit für immer und ewig. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „lebt“ nur bei Gott und dem Herrn Jesus ausdrücklich; bei dem Heiligen Geist sowie dem Glauben und der Hoffnung der Erwählten ist es sinngemäß zu ergänzen. Die ungewöhnliche Formulierung stellt auch Glauben und Hoffnung als lebendige Zeugen der Bekräftigung dar.
    reason: Die elliptische Syntax und die auffällige Personifikation sind auslegungsrelevant und sollten transparent gemacht werden.
lexical_decisions:
- source_word: συμβουλή
  choice: Rat
  rationale: Gibt den Sinn einer ernst gemeinten Empfehlung in natürlichem modernem Deutsch wieder.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: mit aufrichtiger Milde
  rationale: ἐκτενής bezeichnet hier die ernsthafte, ungeteilte Haltung; ἐπιείκεια meint Milde, Nachsicht oder Sanftmut. Die Formulierung bewahrt beide Aspekte ohne unnatürliche Wörtlichkeit.
- source_word: δικαιώματα
  choice: Rechtsforderungen
  rationale: Bezeichnet von Gott gesetzte gerechte beziehungsweise rechtlich bindende Anforderungen und wird neben προστάγματα nicht einfach mit demselben Wort wiedergegeben.
- source_word: προστάγματα
  choice: Gebote
  rationale: Gibt verbindliche Anordnungen Gottes klar und allgemein verständlich wieder.
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: eingereiht und aufgenommen
  rationale: Bewahrt die doppelte Aussage von Zuordnung und Anrechnung zur Gruppe der Geretteten, ohne schwer verständliche Verwaltungsbegriffe zu verwenden.
- source_word: σῳζομένων
  choice: die gerettet werden
  rationale: Bewahrt die präsentische, prozesshafte Form des griechischen Partizips und vermeidet eine unnötige Festlegung auf einen ausschließlich vergangenen oder zukünftigen Zeitpunkt.
- source_word: Χριστός
  choice: Messias
  rationale: Gibt den griechischen Titel als seine deutsch verständliche Bedeutungsentsprechung wieder und lässt ihn durch Apposition zu Jesus natürlich klingen.
theological_decisions:
- issue: Die Reihe Gott, Herr Jesus, Heiliger Geist, Glaube und Hoffnung in der Schwurformel
  choice: Das bei Gott und Jesus ausdrücklich gesetzte Verb „lebt“ wird auch bei dem Heiligen Geist sowie Glauben und Hoffnung ergänzt.
  alternative: Die letzten drei Nominative ohne ergänztes Verb als abgebrochene oder elliptische Reihe stehen lassen.
  rationale: Die koordinierenden Nominative setzen syntaktisch am natürlichsten das Verb ζῇ fort. Dadurch bleibt die auffällige Personifikation von Glaube und Hoffnung erhalten, statt sie in einen Relativsatz umzudeuten.
- issue: Bezug von αὐτῷ in der Doxologie
  choice: '„Gott“ wird als Bezug ausdrücklich genannt: „Durch ihn sei Gott die Herrlichkeit“.'
  alternative: „Durch ihn sei ihm die Herrlichkeit“, mit formal bewahrter, im Deutschen aber schwerer verständlicher Pronomenfolge.
  rationale: Der Dativ αὐτῷ verweist im Kontext am ehesten auf Gott, während δι᾽ οὗ auf Jesus, den Messias, zurückweist. Die Explizierung verhindert eine irreführende deutsche Pronomenzuordnung, ohne die christologische Vermittlungsformel aufzulösen.
- issue: Zusammenhang von ἀμεταμέλητα und ἀμεταμελήτως
  choice: Beide werden mit „nicht bereuen“ beziehungsweise „ohne Reue“ wiedergegeben.
  alternative: Das Adverb als „unwiderruflich“ oder „standhaft“ deuten.
  rationale: Die Wiederholung desselben Wortstamms ist erkennbar beabsichtigt und soll im Deutschen hörbar bleiben; zugleich bleibt offen, ob vor allem Reuelosigkeit oder beständige Entschlossenheit betont wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Bekräftigungsformel wird mit „so wahr … lebt“ idiomatisch wiedergegeben; die ungewöhnliche Reihung des griechischen Textes bleibt erkennbar. „für immer und ewig“ bildet die verstärkte Ewigkeitsformel verständlich ab.
