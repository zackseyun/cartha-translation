revisions:
- from: Nehmt unseren Rat an, dann werdet ihr es nicht bereuen. Denn so wahr Gott lebt und der Herr Jesus, der Messias, lebt, und so wahr der Heilige Geist sowie der Glaube und die Hoffnung der Erwählten leben:[a] Wer in Demut und mit aufrichtiger Milde ohne Reue die von Gott gegebenen Rechtsforderungen und Gebote erfüllt, der wird durch Jesus, den Messias, in die Zahl derer eingereiht und aufgenommen werden, die gerettet werden. Durch ihn sei Gott die Herrlichkeit für immer und ewig. Amen.
  to: Nehmt unseren Rat an, dann werdet ihr es nicht bereuen. Denn so wahr Gott lebt und der Herr Jesus, der Messias, lebt, so wahr leben auch der Heilige Geist und der Glaube und die Hoffnung der Erwählten:[a] Wer in Demut und mit aufrichtiger Milde ohne Reue die von Gott gegebenen gerechten Bestimmungen und Gebote erfüllt, wird durch Jesus, den Messias, der Zahl derer zugeordnet und zugerechnet werden, die gerettet werden. Durch ihn gebührt Gott die Herrlichkeit für immer und ewig. Amen.
  rationale: Die Revision erhält die vom griechischen Text verlangte Personifikation von Glaube und Hoffnung und die Übersetzung von Χριστός als „Messias“. Sie verbessert die deutsche Satzführung, gibt die zwei Ausdrücke für Zuordnung bzw. Zählung differenzierter wieder und stellt die abschließende Aussage als Indikativ dar. Die Bezugsexplikation „Gott“ in der Doxologie folgt dem unmittelbaren Kontext, in dem Jesus das Mittel („durch ihn“) und Gott der Empfänger der Herrlichkeit ist.
