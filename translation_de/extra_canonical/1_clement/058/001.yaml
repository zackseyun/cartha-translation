id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: de
  text: Darum lasst uns uns seinem ganz heiligen und herrlichen Namen unterordnen und vor den zuvor durch die Weisheit gegen die Ungehorsamen ausgesprochenen Drohungen fliehen, damit wir im Vertrauen auf den überaus heiligen Namen seiner Majestät wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit wir wohnen, nachdem wir unser Vertrauen auf den überaus heiligen Namen seiner Majestät gesetzt haben.«'
    reason: Das griechische Perfektpartizip πεποιθότες kann sowohl einen bestehenden Zustand des Vertrauens als auch das zuvor gesetzte Vertrauen hervorheben.
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: wollen wir uns … unterordnen
  rationale: Der hortative Aoristpassiv-Konjunktiv fordert gemeinsam zur Unterordnung auf; die reflexive deutsche Form gibt den Sinn natürlich wieder.
- source_word: πανάγιος / ὀσιώτατος
  choice: ganz heilig / überaus heilig
  rationale: Die unterschiedlichen griechischen Ausdrücke werden unterscheidbar wiedergegeben; der Superlativ ὀσιώτατος erhält eine ausdrücklich steigernde Form.
- source_word: ἀπειλάς
  choice: Drohungen
  rationale: Bezeichnet die zuvor genannten Warn- beziehungsweise Strafandrohungen gegen Ungehorsam.
- source_word: κατασκηνώσωμεν
  choice: wohnen
  rationale: Das Verb bedeutet hier wohnen beziehungsweise sich niederlassen; eine zusätzliche Aussage der Sicherheit steckt nicht ausdrücklich im finiten Verb.
- source_word: πεποιθότες ἐπί
  choice: im Vertrauen auf
  rationale: Das Perfektpartizip bezeichnet gefestigtes Vertrauen und regiert hier ausdrücklich das folgende Objekt mit ἐπί.
- source_word: μεγαλωσύνη
  choice: Majestät
  rationale: Gibt die göttliche Hoheit und Größe in diesem feierlichen Kontext prägnant wieder.
theological_decisions:
- issue: Bezug der Unterordnung auf Gottes Namen
  choice: seinem … Namen unterordnen
  alternative: sich Gott unterordnen
  rationale: Das ungewöhnliche, aber bewusste Bild des griechischen Wortlauts wird nicht aufgelöst oder paraphrasiert.
- issue: Vermittlung der Drohungen durch die Weisheit
  choice: durch die Weisheit … ausgesprochen
  alternative: von der Weisheit ausgesprochen
  rationale: διά mit Genitiv bezeichnet hier die Vermittlung; die personifizierte »Weisheit« bleibt als solche stehen.
- issue: Verhältnis von Wohnen und Vertrauen
  choice: wohnen, im Vertrauen auf den … Namen
  alternative: sicher wohnen
  rationale: Die Übersetzung wahrt die griechische Struktur aus finitem Verb und begleitendem Partizip und vermeidet, Sicherheit zusätzlich in κατασκηνόω hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Satzperiode und die feierliche Rede vom göttlichen Namen werden bewahrt, zugleich bleibt die Syntax für heutige Leser nachvollziehbar.
