revisions:
- from: Während aber sein Fleisch verwest, entsteht ein Wurm. Dieser nährt sich von der Feuchtigkeit des verendeten Tieres und bekommt Flügel. Sobald er dann kräftig geworden ist, hebt er jenes Nest empor, in dem sich die Gebeine seines Vorgängers befinden. Mit ihnen zieht er aus Arabien bis nach Ägypten, in die sogenannte Stadt Heliopolis.
  to: Während aber sein Fleisch verwest, entsteht ein Wurm, der sich von der Feuchtigkeit des toten Tieres ernährt und Flügel bekommt. Dann, nachdem er kräftig geworden ist, hebt er jenes Nest empor, in dem sich die Gebeine seines Vorgängers befinden, und trägt sie von Arabien bis nach Ägypten, in die sogenannte Stadt Heliopolis.
  rationale: Die Überarbeitung ist eng am griechischen Satzbau und Aspekt orientiert, ohne den sagenhaften Bericht zu erklären oder zu bewerten. Sie wahrt die unbestimmte Formulierung „ein Wurm“, die Gegenwartsform der Erzählung und die Ortsbezeichnung Heliopolis. Eine Fußnote ist nicht erforderlich; die im englischen Audit vermerkte alternative Satzgliederung betrifft keine im Deutschen zu sichernde textkritische oder semantische Mehrdeutigkeit.
