  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: de
  text: Während aber sein Fleisch verwest, entsteht ein Wurm, der sich von der Feuchtigkeit des toten Tieres ernährt und Flügel bekommt. Dann, nachdem er kräftig geworden ist, hebt er jenes Nest empor, in dem sich die Gebeine seines Vorgängers befinden, und trägt sie von Arabien bis nach Ägypten, in die sogenannte Stadt Heliopolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σηπομένης
  choice: verwest
  rationale: Gibt den fortschreitenden Zerfall des Fleisches natürlich und präzise wieder.
- source_word: σκώληξ τις γεννᾶται
  choice: entsteht ein Wurm
  rationale: Bewahrt die unbestimmte Aussage des Griechischen; „entsteht“ klingt im Deutschen in diesem sagenhaften naturkundlichen Bericht natürlicher als „wird geboren“.
- source_word: ἰκμάδος
  choice: Feuchtigkeit
  rationale: Der Ausdruck bezeichnet hier die im toten Tier verbliebene Feuchtigkeit beziehungsweise Körpersäfte; „Feuchtigkeit“ wahrt die Breite des Wortes.
- source_word: πτεροφυεῖ
  choice: bekommt Flügel
  rationale: Natürliche deutsche Wiedergabe des Vorgangs, dass dem Wurm Flügel wachsen.
- source_word: γενναῖος γενόμενος
  choice: kräftig geworden
  rationale: Im Kontext bezeichnet γενναῖος die erreichte Stärke oder Reife, die das Anheben und Tragen ermöglicht.
- source_word: σηκόν
  choice: Nest
  rationale: Im Zusammenhang mit dem Phönix bezeichnet das Wort den Behälter beziehungsweise das Nest mit den Gebeinen; „Nest“ entspricht dem erzählerischen Kontext, ohne unnötig zu spezifizieren.
- source_word: τοῦ προγεγονότος
  choice: seines Vorgängers
  rationale: Gibt wörtlich denjenigen wieder, der zuvor da war, und hält die Beziehung zum neu entstandenen Wesen knapp verständlich.
- source_word: διανύει
  choice: zieht
  rationale: Bezeichnet das Zurücklegen der langen Strecke; „zieht“ ist hier idiomatisch und wahrt die Bewegung mit der getragenen Last.
