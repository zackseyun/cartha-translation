source:
  edition: Funk 1901 (normalized OCR)
  text: Ἴδωμεν τὸ παράδοξον σημεῖον τὸ γινόμενον ἐν τοῖς ἀνατολικοῖς τόποις, τουτέστιν τοῖς περὶ τὴν Ἀραβίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/001.yaml
  text: Let us consider the remarkable sign that takes place in the eastern regions, that is, in the areas around Arabia.
translation:
  language: de
  text: Betrachten wir das außergewöhnliche Zeichen, das in den östlichen Gegenden geschieht, das heißt in den Gebieten um Arabien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδωμεν
  choice: Betrachten wir
  rationale: Der auffordernde Konjunktiv wird natürlich und würdevoll wiedergegeben; gemeint ist ein aufmerksames Hinsehen bzw. Erwägen.
- source_word: παράδοξον σημεῖον
  choice: das außergewöhnliche Zeichen
  rationale: παράδοξος bezeichnet etwas Unerwartetes oder Staunenswertes; „außergewöhnlich“ bewahrt diesen Sinn, ohne das Zeichen bereits als Wunder zu deuten.
- source_word: τὸ γινόμενον
  choice: das … geschieht
  rationale: Das Präsenspartizip bezeichnet das sich ereignende Geschehen und wird durch einen deutschen Relativsatz wiedergegeben.
- source_word: ἐν τοῖς ἀνατολικοῖς τόποις
  choice: in den östlichen Gegenden
  rationale: Die räumliche Bedeutung von ἀνατολικός und τόποις wird direkt und in natürlichem Deutsch ausgedrückt.
- source_word: τοῖς περὶ τὴν Ἀραβίαν
  choice: in den Gebieten um Arabien
  rationale: περί mit Akkusativ bezeichnet hier den Raum um bzw. im Umfeld Arabiens; „Gebiete“ ergänzt idiomatisch den substantivisch gebrauchten Ausdruck.
theological_decisions: []
