  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Aufforderungsstil. Die Formulierung vermeidet eine stärkere Deutung von σημεῖον als „Wunder“ und bewahrt die geografische Unschärfe des griechischen Textes.
