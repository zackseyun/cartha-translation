source:
  edition: Funk 1901 (normalized OCR)
  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: de
  text: Denn es gibt einen Vogel, der Phönix genannt wird. Er ist der Einzige seiner Art und lebt fünfhundert Jahre. Wenn er bereits nahe daran ist zu sterben[a], baut er sich aus Weihrauch, Myrrhe und den übrigen Duftstoffen ein Nest. Wenn die Zeit erfüllt ist, geht er hinein und stirbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für den bevorstehenden Tod kann auch „Loslösung“ oder „Abschied“ bedeuten; der folgende Ausdruck nennt ausdrücklich das Sterben.
    reason: Erläutert die Nuance von ἀπόλυσις und bewahrt zugleich den expliziten Bezug auf ἀποθανεῖν, ohne eine unzutreffende wörtliche Konstruktion zu behaupten.
lexical_decisions:
- source_word: προσονομάζεται φοῖνιξ
  choice: Phönix genannt wird
  rationale: Gibt die Benennung schlicht und idiomatisch wieder; das Präfix in προσονομάζεται verlangt im Deutschen keine gesonderte Wiedergabe.
- source_word: μονογενές
  choice: der Einzige seiner Art
  rationale: Im Zusammenhang mit dem Phönix bezeichnet das Wort seine Einzigartigkeit, nicht eine Abstammungsbeziehung; die Formulierung bleibt für heutige Leser unmittelbar verständlich.
- source_word: ἀπόλυσιν τοῦ ἀποθανεῖν
  choice: seinem Sterben nähert
  rationale: Bewahrt den ausdrücklichen Bezug auf das Sterben und vermeidet zugleich eine unnatürlich wörtliche Formulierung wie „der Loslösung seines Sterbens“; die Nuance von ἀπόλυσις wird in der Fußnote dokumentiert.
- source_word: σηκόν
  choice: Nest
  rationale: Im Kontext einer vom Vogel gebauten, anschließend betretenen Stätte ist „Nest“ die natürliche deutsche Entsprechung; das Grundwort kann allgemeiner ein Gehege oder einen umschlossenen Ort bezeichnen.
- source_word: ἀρωμάτων
  choice: Duftstoffen
  rationale: Bezeichnet aromatische Stoffe und schließt hier Weihrauch und Myrrhe ein; „Gewürze“ wäre zu eng und kulinarisch gefärbt.
- source_word: τελευτᾷ
  choice: stirbt
  rationale: Gibt das Lebensende im Kontext klar und idiomatisch wieder.
theological_decisions:
- issue: Darstellung der Einzigartigkeit des Phönix
  choice: der Einzige seiner Art
  alternative: einziggeboren
  rationale: Das griechische μονογενές kann etymologisch oder in anderen Kontexten anders akzentuiert werden, bezeichnet hier aber sachlich den einzigen Vertreter seiner Art. Eine christologisch aufgeladene Wiedergabe wäre kontextfremd.
- issue: ἀπόλυσις in Verbindung mit dem Sterben
  choice: im Haupttext idiomatisch als Annäherung an das Sterben, mit Fußnote zur Abschieds-/Loslösungsnuance
  alternative: sich seiner Loslösung zum Sterben nähern
  rationale: So bleibt die ausdrückliche Todessprache erhalten, ohne die schwierige griechische Fügung künstlich zu glätten oder theologisch als Befreiung der Seele auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die legendäre Schilderung wird ohne erklärende Zusätze wiedergegeben. „Sobald die Zeit erfüllt ist“ bewahrt die feierliche Zeitformel des Griechischen.
