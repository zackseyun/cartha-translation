  to: Denn es gibt einen Vogel, der Phönix genannt wird. Er ist der Einzige seiner Art und lebt fünfhundert Jahre. Wenn er bereits nahe daran ist zu sterben[a], baut er sich aus Weihrauch, Myrrhe und den übrigen Duftstoffen ein Nest. Wenn die Zeit erfüllt ist, geht er hinein und stirbt.
