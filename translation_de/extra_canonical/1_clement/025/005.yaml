  text: οἱ οὖν ἱερεῖς ἐπισκέπτονται τὰς ἀναγραφὰς τῶν χρόνων καὶ εὑρίσκουσιν αὐτὸν πεντακοσιοστοῦ ἔτους πεπληρωμένου ἐληλυθέναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/005.yaml
  text: So then the priests inspect the records of the times[a], and they find that it came when the five-hundredth year was completed.
translation:
  language: de
  text: Die Priester prüfen also die Zeitaufzeichnungen und stellen fest, dass er beim Ablauf des fünfhundertsten Jahres gekommen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ οὖν ἱερεῖς
  choice: Daraufhin … die Priester
  rationale: οὖν führt die Folge aus dem zuvor Geschilderten ein; „daraufhin“ ist im Deutschen natürlich und bewahrt den folgernden Übergang.
- source_word: ἐπισκέπτονται
  choice: prüfen
  rationale: Das Verb bezeichnet hier das genaue Nachsehen beziehungsweise Untersuchen von Aufzeichnungen.
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  choice: die Zeitaufzeichnungen
  rationale: ἀναγραφαί sind schriftliche Verzeichnisse oder Aufzeichnungen; der Genitiv τῶν χρόνων bezeichnet die darin festgehaltenen Zeiten beziehungsweise Zeiträume.
- source_word: εὑρίσκουσιν
  choice: stellen fest
  rationale: Im Zusammenhang einer Prüfung von Aufzeichnungen bedeutet das wörtliche „finden“ idiomatisch „feststellen“.
- source_word: αὐτόν
  choice: er
  rationale: Das maskuline Pronomen verweist im Kontext auf den zuvor genannten Phönix; das Geschlecht und der personale Rückbezug bleiben erhalten.
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: nach Vollendung des fünfhundertsten Jahres
  rationale: Der Genitivus absolutus bezeichnet den abgeschlossenen Zeitpunkt; die Präpositionalfügung gibt ihn knapp und natürlich wieder.
- source_word: ἐληλυθέναι
  choice: gekommen ist
  rationale: Der Perfektinfinitiv steht in indirekter Rede nach εὑρίσκουσιν und bezeichnet ein bereits eingetretenes Kommen, dessen Ergebnis festgestellt wird.
