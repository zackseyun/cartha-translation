revisions:
- from: Daraufhin prüfen die Priester die Zeitaufzeichnungen und stellen fest, dass er nach Vollendung des fünfhundertsten Jahres gekommen ist.
  to: Die Priester prüfen also die Zeitaufzeichnungen und stellen fest, dass er beim Ablauf des fünfhundertsten Jahres gekommen ist.
  rationale: Die Revision beseitigt die durch „nach“ hervorgerufene zeitliche Verschiebung und gibt den folgernden Anschluss von οὖν genauer wieder. Sie bewahrt die Perfektbedeutung des Infinitivs sowie den im Kontext eindeutigen maskulinen Bezug von αὐτόν. Eine Fußnote ist nicht erforderlich; die englische Alternativform betrifft keine im Deutschen verbleibende Mehrdeutigkeit.
  reviewer_model: gpt-5.6-terra
