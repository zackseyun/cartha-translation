source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμέρας, βλεπόντων πάντων, ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμὸν τίθησιν αὐτὰ καὶ οὕτως εἰς τοὐπίσω ἀφορμᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: de
  text: Und bei Tag fliegt er vor aller Augen zum Altar der Sonne, legt sie dort nieder und macht sich dann auf den Rückweg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας
  choice: bei Tag
  rationale: Der Genitiv bezeichnet die Zeit; „bei Tag“ gibt ihn im Deutschen natürlich und knapp wieder.
- source_word: βλεπόντων πάντων
  choice: vor aller Augen
  rationale: 'Die idiomatische Wendung bewahrt den Sinn des Genitivus absolutus: Alle sehen dabei zu.'
- source_word: ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμόν
  choice: fliegt … zum Altar der Sonne hinab
  rationale: Die Bewegungsrichtung auf den Altar zu wird mit „hinab“ natürlich ausgedrückt, ohne zusätzliche Einzelheiten einzutragen.
- source_word: τίθησιν αὐτά
  choice: legt sie dort nieder
  rationale: Das neutrale Pluralpronomen αὐτά bleibt als rückbezügliches „sie“ erhalten; „dort“ nimmt den genannten Altar auf.
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: macht sich dann auf den Rückweg
  rationale: Die Wendung bezeichnet das Aufbrechen in rückwärtiger beziehungsweise zurückführender Richtung; die deutsche Formulierung ist würdig und geläufig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das grammatische Geschlecht des im Zusammenhang gemeinten Vogels wird im Deutschen mit „er“ wiedergegeben; die nicht näher bezeichneten Gegenstände bleiben durch „sie“ offen.
