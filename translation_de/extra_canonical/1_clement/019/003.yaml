base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: de
  text: Betrachten wir ihn in Gedanken und richten wir die Augen der Seele auf seine geduldige Absicht. Erkennen wir, wie frei von Zorn er gegenüber seiner ganzen Schöpfung ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ διάνοιαν
  choice: mit unserem Denken
  rationale: Gibt die innere, verstandesmäßige Betrachtung natürlich wieder, ohne sie auf bloße Vorstellungskraft einzuengen.
- source_word: τοῖς ὄμμασιν τῆς ψυχῆς
  choice: die Augen der Seele
  rationale: Bewahrt das anschauliche griechische Bild in einer im Deutschen verständlichen und würdigen Form.
- source_word: μακρόθυμον
  choice: langmütigen
  rationale: Erhält den theologischen und ethischen Begriff der geduldigen Zurückhaltung; »geduldig« wäre möglich, aber weniger prägnant.
- source_word: βούλημα
  choice: Ratschluss
  rationale: Bezeichnet hier Gottes Willensabsicht beziehungsweise Vorhaben; »Ratschluss« wahrt die inhaltliche Weite und den gehobenen Registerton.
- source_word: ἀόργητος
  choice: frei von Zorn
  rationale: Gibt die Negation des Zorns direkt wieder und vermeidet die mögliche Fehlbedeutung von »unwillig« oder »gleichgültig«.
- source_word: πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: seiner ganzen Schöpfung
  rationale: Natürliches modernes Deutsch bei vollständiger Wiedergabe des umfassenden Bezugs.
theological_decisions:
- issue: Gottes Zornlosigkeit gegenüber der gesamten Schöpfung
  choice: wie frei von Zorn er gegenüber seiner ganzen Schöpfung ist
  alternative: wie geduldig er mit seiner ganzen Schöpfung ist
  rationale: Die Formulierung bewahrt die starke Aussage von ἀόργητος, ohne sie zu einer allgemeinen Aussage über Geduld abzuschwächen oder mit anderen theologischen Aussagen über göttlichen Zorn harmonisierend aufzulösen.
- issue: Bedeutung von βούλημα
  choice: Ratschluss
  alternative: Wille / Absicht
  rationale: »Ratschluss« lässt offen, ob vor allem Gottes Wille, Absicht oder planvolles Vorhaben gemeint ist, und passt zum Kontext der betrachtenden Aufforderung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache. Die parallelen Aufforderungen des Griechischen werden klar wiedergegeben; »langmütig« und »Ratschluss« sind leicht gehoben, aber im religiösen Kontext allgemein verständlich.
