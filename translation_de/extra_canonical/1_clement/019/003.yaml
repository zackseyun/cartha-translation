  source_fidelity: Der Entwurf gibt die drei Aufforderungen, das Bild von den „Augen der Seele“ und ἀόργητος („frei von Zorn“) zuverlässig wieder. „Ratschluss“ kann für βούλημα stehen, verengt den Ausdruck jedoch leicht auf einen festgelegten göttlichen Beschluss; hier ist Gottes geduldige Absicht bzw. sein geduldiger Wille gemeint.
  naturalness: „mit unserem Denken“ ist im modernen Standarddeutsch merklich sperrig. „in Gedanken“ ist idiomatischer und wahrt die innere Betrachtungsweise. „geduldige Absicht“ verbindet sich natürlicher als „langmütiger Ratschluss“.
  terminology: Die Bildsprache „Augen der Seele“ sollte erhalten bleiben. „Frei von Zorn“ ist für ἀόργητος präzise und vermeidet eine konfessionell motivierte Abschwächung. „Geduldige Absicht“ gibt μακρόθυμον βούλημα weit und kontextgerecht wieder, ohne βούλημα als technischen Dekretbegriff festzulegen.
