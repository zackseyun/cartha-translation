base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: de
  text: Da wir nun an vielen großen und ruhmreichen Taten Anteil bekommen haben,[a] wollen wir auf das uns von Anfang an überlieferte Ziel des Friedens hin zur Vollendung gelangen.[b] Lasst uns den Blick fest auf den Vater und Schöpfer der ganzen Welt richten und an seinen großartigen und alles überragenden Gaben des Friedens und Wohltaten festhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da wir nun an vielen großen und ruhmreichen Taten teilgenommen haben.“'
    reason: Macht die aktive Nuance von μετασχόντες sichtbar und bewahrt zugleich die Offenheit, wessen Taten gemeint sind.
  - marker: b
    text: Der hier vorgelegte griechische Text hat ein Verb mit der Bedeutung „vollenden, zur Ausführung bringen“. Andere Textfassungen lesen an dieser Stelle sinngemäß „wieder hinlaufen“ oder „zurückkehren“.
    reason: Die überlieferte Formulierung ἐκτελέσωμεν ἐπὶ ... σκοπόν ist ungewöhnlich und dürfte eine Text- oder OCR-Variante widerspiegeln; die Anmerkung legt die Unsicherheit offen.
lexical_decisions:
- source_word: μετασχόντες
  choice: Anteil bekommen haben
  rationale: Das Partizip bezeichnet Teilhabe. Anders als die englische Revisionsfassung setzt der überlieferte griechische Text hier kein Verb im Sinn von „für würdig erachtet werden“ voraus.
- source_word: πράξεων
  choice: Taten
  rationale: πρᾶξις kann Taten, Handlungen oder Geschehnisse bezeichnen. „Taten“ wahrt die konkrete, zugleich offene Aussage.
- source_word: ἐκτελέσωμεν ἐπὶ ... σκοπόν
  choice: auf ... Ziel hin zur Vollendung gelangen
  rationale: Die Formulierung bildet das im vorgelegten Text stehende ἐκτελέσωμεν („vollenden, zur Ausführung bringen“) ab, ohne die im Englischen vorausgesetzte, aber hier nicht belegte Lesart „vorandrängen“ einzutragen.
- source_word: σκοπόν
  choice: Ziel
  rationale: σκοπός bezeichnet hier den Zielpunkt, auf den das Handeln ausgerichtet ist.
- source_word: ἀτενίσωμεν
  choice: den Blick fest ... richten
  rationale: Gibt das intensive, aufmerksame Hinschauen natürlich und würdig wieder.
- source_word: κολληθῶμεν
  choice: festhalten
  rationale: Das Verb bedeutet wörtlich „sich anheften“; „an ... festhalten“ vermittelt die nachdrückliche Bindung idiomatisch.
- source_word: εὐεργεσίαις
  choice: Wohltaten
  rationale: Bewahrt die eigenständige Bedeutung neben δωρεαῖς („Gaben“) und vermeidet eine unnötige Verschmelzung beider Begriffe.
theological_decisions:
- issue: Subjekt der großen und ruhmreichen Taten
  choice: Die Aussage bleibt als Teilhabe an Taten formuliert.
  alternative: „Da wir vieler großer und herrlicher Dinge für würdig erachtet worden sind“
  rationale: Die Alternative beruht auf einem in der angegebenen griechischen Quelle nicht vorhandenen ἠξιώθημεν und würde die Aussage theologisch wie semantisch verschieben.
- issue: Genitiv τῆς εἰρήνης
  choice: „Gaben des Friedens“
  alternative: „Gaben und Wohltaten, die Frieden schenken“
  rationale: Der formale Genitiv bleibt erhalten; seine mögliche Zugehörigkeits- oder Wirkungsbeziehung wird nicht dogmatisch vereindeutigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung folgt der rhetorischen Ermahnung des Griechischen, vermeidet aber unnötig altertümliche Wendungen. Die beiden Aufforderungen werden zur besseren Lesbarkeit auf zwei Sätze verteilt.
