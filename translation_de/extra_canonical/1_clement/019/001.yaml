id: 1CLEM.19.1
reference: 1 Clement 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: de
  text: Die Demut und Unterordnung so vieler und so bedeutender Menschen, die auf diese Weise bezeugt worden sind, haben durch ihren Gehorsam nicht nur uns, sondern auch die Generationen vor uns besser gemacht – diejenigen, die seine Worte[a] in Heiligkeit und Wahrheit angenommen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottesworte“; gemeint sind autoritative, göttliche Aussprüche.'
    reason: λόγια kann allgemeiner mit „Worte“ wiedergegeben werden, hat hier aber einen besonderen religiösen und autoritativen Klang. Das Pronomen αὐτοῦ bleibt wie im griechischen Text ohne ausdrückliche Identifizierung des Bezuges erhalten.
lexical_decisions:
- source_word: ταπεινοφρόνων
  choice: Demut … Menschen
  rationale: Das Wort bezeichnet demütig Gesinnte; die deutsche substantivische Fassung fügt sich natürlich in die Satzkonstruktion ein und bewahrt den Gedanken ihrer bezeugten Demut.
- source_word: τὸ ὑποδεές
  choice: Unterordnung
  rationale: Das substantivierte Adjektiv bezeichnet eine niedrige, sich unterordnende Haltung. „Unterordnung“ gibt dies im Zusammenhang mit ὑπακοή verständlich wieder, ohne es mit „Demut“ gleichzusetzen.
- source_word: διὰ τῆς ὑπακοῆς
  choice: durch Gehorsam geprägt
  rationale: Die Formulierung wahrt die instrumentale Beziehung zum Gehorsam und ergibt im Deutschen eine natürliche Verbindung mit „Unterordnung“.
- source_word: τὰ λόγια αὐτοῦ
  choice: seine Aussprüche
  rationale: λόγια bezeichnet hier autoritative, insbesondere göttliche Äußerungen. Das Pronomen bleibt wie im Griechischen stehen, ohne den Bezug ausdrücklich zu ergänzen.
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: in Heiligkeit und Wahrheit
  rationale: Die abstrakte, feierliche Ausdrucksweise des griechischen Textes wird formal und verständlich bewahrt.
theological_decisions:
- issue: Bezug von αὐτοῦ in „seine Aussprüche“
  choice: Das Pronomen wird ohne ausdrückliche Identifizierung wiedergegeben.
  alternative: „Gottes Aussprüche“
  rationale: Der nähere Kontext legt Gott nahe, doch der vorliegende griechische Satz nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt daher die formale Referenz und vermeidet eine stillschweigende Präzisierung.
- issue: Wirkung von Demut und Unterordnung auf frühere Generationen
  choice: Die zeitlich spannungsvolle Aussage wird unverändert beibehalten.
  alternative: Eine Umschreibung, nach der lediglich das gleiche Vorbild auch für frühere Generationen galt
  rationale: Der Wortlaut sagt ausdrücklich, dass diese Haltungen sowohl „uns“ als auch „die Generationen vor uns“ besser gemacht haben. Diese auffällige Aussage soll nicht harmonisierend umgedeutet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Periodenstruktur bleibt erkennbar, wird jedoch durch Gedankenstrich und klare Zuordnungen lesbar gehalten. Die ungewöhnliche zeitliche Spannung des griechischen Satzes wird nicht geglättet.
