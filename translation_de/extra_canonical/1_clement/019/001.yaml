revisions:
- from: Die Demut so vieler Menschen von solcher Art, die auf diese Weise bezeugt ist, und ihre durch Gehorsam geprägte Unterordnung haben daher nicht nur uns besser gemacht, sondern auch die Generationen vor uns – diejenigen, die seine Aussprüche[a] in Heiligkeit und Wahrheit angenommen haben.
  to: Die Demut und Unterordnung so vieler und so bedeutender Menschen, die auf diese Weise bezeugt worden sind, haben durch ihren Gehorsam nicht nur uns, sondern auch die Generationen vor uns besser gemacht – diejenigen, die seine Worte[a] in Heiligkeit und Wahrheit angenommen haben.
  rationale: Die Revision korrigiert den grammatischen Bezug der Bezeugung, bringt die emphatische Beschreibung der vielen Personen idiomatisch zum Ausdruck und ordnet den Gehorsam klarer der genannten Demut und Unterordnung zu. Sie bewahrt sowohl den nicht ausdrücklich aufgelösten Bezug von „seine“ als auch die im Ausgangstext auffällige Wirkung auf frühere Generationen.
  reviewer_model: gpt-5.6-terra
