    reason: λόγια kann allgemeiner mit „Worte“ wiedergegeben werden, hat hier aber einen besonderen religiösen und autoritativen Klang. Das Pronomen αὐτοῦ bleibt wie im griechischen Text ohne ausdrückliche Identifizierung des Bezuges erhalten.
  revision_rationale: Die Revision korrigiert den grammatischen Bezug der Bezeugung, bringt die emphatische Beschreibung der vielen Personen idiomatisch zum Ausdruck und ordnet den Gehorsam klarer der genannten Demut und Unterordnung zu. Sie bewahrt sowohl den nicht ausdrücklich aufgelösten Bezug von „seine“ als auch die im Ausgangstext auffällige Wirkung auf frühere Generationen.
