source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: de
  text: 'Fern sei von uns diese Schrift[a], in der es heißt: »Elend sind die Zwiespältigen, die in ihrer Seele zweifeln und sagen: ›Das haben wir schon zur Zeit unserer Väter gehört, und siehe, wir sind alt geworden, doch nichts davon ist bei uns eingetroffen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, den einzelnen angeführten Ausspruch ausdrücklich bezeichnend: »dieses Schriftwort«.'
    reason: γραφή heißt unmittelbar »Schrift«; die Alternative erläutert die kontextuell mögliche, aber stärker interpretierende deutsche Einordnung als einzelnes Zitat.
lexical_decisions:
- source_word: ἡ γραφὴ αὕτη
  choice: dieses Schriftwort
  rationale: Im Zusammenhang bezeichnet γραφή nicht notwendig die gesamte Schrift, sondern das anschließend angeführte Schriftwort; die Wiedergabe ist im Deutschen natürlich und wahrt den Zitatcharakter.
- source_word: δίψυχοι
  choice: Unentschlossenen
  rationale: Wörtlich bezeichnet das Wort Menschen mit »geteilter Seele«; gemeint sind innerlich gespaltene, unbeständige Menschen. »Unentschlossene« ist verständlich, ohne das folgende Zweifeln bloß zu wiederholen.
- source_word: διατάζοντες τῇ ψυχῇ
  choice: die in ihrer Seele zweifeln
  rationale: Die seltene Formulierung ist hier im Sinn inneren Zweifelns verstanden; die Ortsangabe »in ihrer Seele« bewahrt die griechische Ausdrucksweise und deren Spannung.
- source_word: ἐπὶ τῶν πατέρων ἡμῶν
  choice: zur Zeit unserer Väter
  rationale: Die Wendung bezeichnet die Zeit beziehungsweise Generation der Vorfahren.
- source_word: ἰδού
  choice: siehe
  rationale: Bewahrt den markierenden, feierlichen Ton des griechischen Aufmerksamkeitssignals.
- source_word: συνέβηκεν
  choice: ist … eingetroffen
  rationale: Gibt das Geschehen beziehungsweise Eintreten der angekündigten Dinge idiomatisch wieder.
theological_decisions:
- issue: Status und Bezug von γραφή
  choice: »Schriftwort« als Bezeichnung des folgenden Zitats
  alternative: »Schrift«
  rationale: Der Text nennt die angeführte Aussage γραφή, ohne hier deren Herkunft oder kanonischen Status weiter zu bestimmen. »Schriftwort« lässt diese Frage offen und passt zum einzelnen Zitat.
- issue: Bedeutung von δίψυχοι
  choice: »Unentschlossenen«
  alternative: »Wankelmütigen« oder wörtlich »Doppelseeligen«
  rationale: Die Wahl vermittelt innere Geteiltheit in geläufigem Deutsch, ohne eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Wunsch bleibt bewusst feierlich; das eingebettete Zitat ist klar und mündlich nachvollziehbar formuliert. Die verschachtelte griechische Relativstruktur wurde leicht geglättet, ohne ihren Inhalt aufzulösen.
