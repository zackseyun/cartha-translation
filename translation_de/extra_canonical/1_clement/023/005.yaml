source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: de
  text: 'In Wahrheit wird sein Wille schnell und plötzlich vollendet werden. Auch die Schrift bezeugt dies mit den Worten: »Schnell wird er kommen und nicht zögern«, und: »Plötzlich wird der Herr in seinen Tempel kommen und der Heilige, den ihr erwartet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: In Wahrheit
  rationale: Gibt die bekräftigende Wendung würdig und im modernen Standarddeutsch natürlich wieder.
- source_word: τελειωθήσεται
  choice: wird … vollendet werden
  rationale: Bewahrt das Passiv und den Gedanken, dass Gottes Wille vollständig zur Ausführung gelangt.
- source_word: συνεπιμαρτυρούσης
  choice: Auch die Schrift bezeugt dies
  rationale: Drückt das zusätzliche, bestätigende Zeugnis der Schrift klar aus, ohne den Sinn zu erweitern.
- source_word: οὐ χρονιεῖ
  choice: nicht zögern
  rationale: Natürliche Wiedergabe des Verbs im Sinn von sich verspäten bzw. ausbleiben.
- source_word: ὁ ἅγιος
  choice: der Heilige
  rationale: Bewahrt den substantivierten Titel und seine mögliche christologische beziehungsweise theologische Offenheit.
- source_word: προσδοκᾶτε
  choice: erwartet
  rationale: Entspricht dem aktiven, gespannten Erwarten des griechischen Verbs in allgemein verständlichem Deutsch.
theological_decisions:
- issue: Bezug und Identität von »der Herr« und »der Heilige«
  choice: Beide Bezeichnungen stehen in einer fortlaufenden Aussage, ohne zusätzliche Erklärung ihrer Identität.
  alternative: »der Herr, nämlich der Heilige« oder »der Herr … und der Heilige«
  rationale: Das griechische καὶ kann hier appositionell beziehungsweise verbindend verstanden werden. Die Formulierung bewahrt die enge Zuordnung, ohne eine dogmatisch stärker festgelegte Erläuterung einzufügen.
- issue: Verhältnis der beiden Schriftzitate
  choice: Die Zitate werden mit »und« als zwei Zeugnisse wiedergegeben.
  alternative: Ein einziges zusammengezogenes Zitat
  rationale: Der Wortlaut verbindet Anklänge an verschiedene Schriftstellen; die deutsche Zeichensetzung macht diese Struktur sichtbar, ohne die im Ausgangstext fehlenden Quellenangaben zu ergänzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau wurde für deutsche Lesbarkeit in zwei Sätze gegliedert; Wiederholung und Nachdruck von »schnell und plötzlich« bleiben erhalten.
