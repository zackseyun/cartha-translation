base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: de
  text: Darum lasst uns nicht zwiespältig sein[a], und unsere Seele soll nicht an seinen überragenden und herrlichen Gaben zweifeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: doppelgesinnt; innerlich geteilt oder unentschlossen.'
    reason: διψυχῶμεν bezeichnet eine geteilte innere Haltung und kann damit verbundenes Schwanken oder Unentschlossenheit einschließen.
lexical_decisions:
- source_word: διψυχῶμεν
  choice: lasst uns nicht innerlich zwiespältig sein
  rationale: Das Verb bezeichnet ein Geteiltsein in der inneren Haltung beziehungsweise ein Schwanken zwischen zwei Einstellungen. „Innerlich zwiespältig“ bewahrt das Bild, ohne die nachfolgende Aussage über das Zweifeln bloß zu wiederholen.
- source_word: ἐνδυλλιεσθω
  choice: soll … nicht … zweifeln
  rationale: Die überlieferte Form ist orthografisch beziehungsweise textlich schwierig und wird hier als Form von ἰνδάλλομαι verstanden. Im Zusammenhang bezeichnet sie Zweifel oder Unsicherheit hinsichtlich der Gaben Gottes.
- source_word: ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς
  choice: überragenden und herrlichen Gaben
  rationale: „Überragend“ gibt den Gedanken des alles Übliche Übertreffenden wieder; „herrlich“ bewahrt die wertende und ruhmvolle Färbung von ἐνδόξοις.
theological_decisions:
- issue: Verhältnis von innerer Zwiespältigkeit und Zweifel
  choice: Die beiden Ausdrücke werden als verwandte, aber nicht identische Mahnungen wiedergegeben.
  alternative: Beide Ausdrücke nahezu synonym als Zweifel oder Unentschlossenheit übersetzen.
  rationale: Der griechische Satz setzt zwei verschiedene Verben nebeneinander. Die Übersetzung erhält die Spannung zwischen einer geteilten inneren Haltung und konkretem Zweifel an Gottes Gaben.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Aufforderung „lasst uns“ folgt der gemeinschaftlichen Mahnung des griechischen Konjunktivs; „unsere Seele“ bewahrt den kollektiven Singular der Vorlage.
