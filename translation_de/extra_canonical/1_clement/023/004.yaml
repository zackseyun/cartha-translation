id: 1CLEM.23.4
reference: 1 Clement 23:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: de
  text: 'Ihr Unverständigen, vergleicht euch mit einem Baum[a]: Nehmt einen Weinstock. Zuerst verliert er seine Blätter, dann entsteht ein Trieb, dann ein Blatt, dann eine Blüte; danach zeigen sich eine unreife Beere und dann eine Traube. Ihr seht, dass die Frucht des Baumes in kurzer Zeit zur Reife gelangt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann hier auch allgemeiner ein Holzgewächs bezeichnen.
    reason: Die Grundbedeutung von ξύλον ist „Holz“ beziehungsweise „Baum“; da unmittelbar ein Weinstock als Beispiel folgt, ist auch eine allgemeinere botanische Bedeutung möglich.
lexical_decisions:
- source_word: ἀνόητοι
  choice: Unverständigen
  rationale: Gibt den Vorwurf mangelnder Einsicht würdevoll und in natürlichem modernem Deutsch wieder, ohne die stärker abwertende Nebenbedeutung von „Toren“ unnötig festzulegen.
- source_word: ξύλον
  choice: Baum
  rationale: Bewahrt die übliche konkrete Bedeutung und die Wiederaufnahme in „Frucht des Baumes“; die im Zusammenhang mit dem Weinstock mögliche weitere Bedeutung wird in einer Fußnote genannt.
- source_word: φυλλορροεῖ
  choice: verliert er seine Blätter
  rationale: Gibt das Abfallen beziehungsweise Abwerfen der Blätter idiomatisch wieder.
- source_word: βλαστὸς γίνεται
  choice: entsteht ein Trieb
  rationale: Bildet sowohl das Werden als auch die botanische Bedeutung von βλαστός natürlich ab.
- source_word: ὄμφαξ
  choice: unreife Beere
  rationale: Bezeichnet hier die noch unreife Weinbeere und vermeidet eine Verwechslung mit der anschließend genannten ganzen Traube.
- source_word: σταφυλή
  choice: Traube
  rationale: Bezeichnet im Unterschied zur einzelnen unreifen Beere die ausgebildete Weintraube; Reife wird erst im folgenden Satz ausdrücklich ausgesagt.
- source_word: παρίστανται
  choice: zeigen sich
  rationale: Die Pluralform wird mit den beiden Subjekten „eine unreife Beere“ und „eine Traube“ bewahrt.
- source_word: εἰς πέπειρον καταντᾷ
  choice: zur Reife gelangt
  rationale: Gibt den Zielpunkt des Reifungsprozesses präzise und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die stufenweise Abfolge des griechischen Textes bleibt durch die wiederholten Zeitangaben erhalten; die ungewöhnliche Verbindung von „Baum“ und „Weinstock“ wird nicht eingeebnet.
