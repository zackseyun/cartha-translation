id: 1CLEM.23.1
reference: 1 Clement 23:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: de
  text: Der in allem barmherzige und wohltätige Vater hat Erbarmen mit denen, die ihn fürchten, und möge denen, die mit aufrichtigem Sinn zu ihm kommen, seine Gnadengaben sanft und freundlich zuteilwerden lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων κατὰ πάντα
  choice: der in allem barmherzige
  rationale: Gibt sowohl die umfassende Wendung κατὰ πάντα als auch die erbarmende Haltung von οἰκτίρμων in natürlichem, würdigem Deutsch wieder.
- source_word: εὐεργετικὸς πατήρ
  choice: wohltätige Vater
  rationale: Bewahrt die aktive Bedeutung des Wohltuns, ohne sie auf bloße Güte abzuschwächen.
- source_word: ἔχει σπλάγχνα ἐπί
  choice: empfindet tiefes Mitgefühl mit
  rationale: Das griechische Körperbild bezeichnet innige, tief empfundene Zuwendung; eine wörtliche Wiedergabe mit »Eingeweiden« wäre im modernen Deutsch irreführend.
- source_word: τὰς χάριτας αὐτοῦ ἀποδίδοι
  choice: gewährt … seine Gnadengaben
  rationale: χάριτες steht im Plural und meint hier gnädige Wohltaten oder Gaben; »gewährt« gibt den Sinn von ἀποδίδοι idiomatisch wieder.
- source_word: ἁπλῇ διανοίᾳ
  choice: mit ungeteiltem Sinn
  rationale: Bewahrt den Gedanken innerer Einfalt, Aufrichtigkeit und fehlender Doppelherzigkeit, ohne die Wendung vorschnell nur als »Herz« wiederzugeben.
theological_decisions:
- issue: Bedeutung von τοὺς φοβουμένους αὐτόν
  choice: die ihn fürchten
  alternative: die Ehrfurcht vor ihm haben
  rationale: Die direkte Wiedergabe erhält die biblisch-theologische Spannung des Gottesfürchtens; eine reine Umschreibung als Ehrfurcht könnte die Bedeutungsbreite verengen.
- issue: Nuance von χάριτας
  choice: Gnadengaben
  alternative: Wohltaten
  rationale: »Gnadengaben« hält den Bezug zur unverdienten Gunst fest und wahrt den Plural; der Kontext erlaubt zugleich die allgemeinere Bedeutung »Wohltaten«.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für natürlichen deutschen Lesefluss leicht geordnet. Keine Fußnoten erforderlich.
