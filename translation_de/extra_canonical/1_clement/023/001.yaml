revisions:
- from: Der in allem barmherzige und wohltätige Vater empfindet tiefes Mitgefühl mit denen, die ihn fürchten, und gewährt denen, die mit ungeteiltem Sinn zu ihm kommen, seine Gnadengaben sanft und freundlich.
  to: Der in allem barmherzige und wohltätige Vater hat Erbarmen mit denen, die ihn fürchten, und möge denen, die mit aufrichtigem Sinn zu ihm kommen, seine Gnadengaben sanft und freundlich zuteilwerden lassen.
  rationale: Die Revision folgt der ausdrücklich angegebenen griechischen Form ἀποδίδοι als Optativ und formuliert die übrigen Wendungen idiomatisch im modernen Standarddeutsch. Für ἁπλῇ διανοίᾳ wird „aufrichtigem Sinn“ gewählt, das die schlichte, ungeteilte Ausrichtung des Denkens natürlich ausdrückt.
