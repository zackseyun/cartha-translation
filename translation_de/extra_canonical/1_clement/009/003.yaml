source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: de
  text: 'Nehmen wir Henoch als Beispiel: Er wurde im Gehorsam als gerecht befunden und entrückt[a], und sein Tod wurde nicht gefunden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: versetzt; das griechische Wort bezeichnet hier Henochs Hinwegnahme.'
    reason: Die wörtlichere Alternative hält die lexikalische Breite von μετετέθη fest, während der Haupttext den besonderen Henoch-Kontext idiomatisch wiedergibt.
lexical_decisions:
- source_word: λάβωμεν
  choice: Nehmen wir … als Beispiel
  rationale: Der hortative Konjunktiv fordert dazu auf, Henoch als Anschauungsbeispiel heranzuziehen; „als Beispiel“ macht den im Deutschen sonst schwer erkennbaren Sinn natürlich deutlich.
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθείς
  choice: im Gehorsam als gerecht befunden
  rationale: Die Formulierung bewahrt sowohl den Gehorsam als Bezugsrahmen als auch das passive εὑρεθείς; sie folgt der naheliegenden Verbindung von δικαίως mit dem Befund seiner Gerechtigkeit.
- source_word: μετετέθη
  choice: entrückt
  rationale: Im Henoch-Kontext bezeichnet das Passiv von μετατίθημι seine übernatürliche Hinwegnahme und nimmt die biblische Überlieferung aus Genesis 5,24 auf. „Entrückt“ ist im Deutschen prägnant und vermeidet den verwaltungssprachlichen Klang von „versetzt“.
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: sein Tod wurde nicht gefunden
  rationale: Die auffällige, semitisch geprägte Passivform wird bewusst erhalten, statt sie erklärend zu „er starb nicht“ aufzulösen.
theological_decisions:
- issue: Art und Ziel von Henochs Hinwegnahme
  choice: entrückt
  alternative: versetzt / hinweggenommen
  rationale: Der Text nennt weder ausdrücklich den Himmel noch den Handelnden. „Entrückt“ bezeichnet die außergewöhnliche Hinwegnahme, ohne ein Ziel oder Subjekt in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „sein Tod wurde nicht gefunden“ bleibt als bewusste Nähe zur griechischen Vorlage und zur biblischen Henoch-Tradition erhalten.
