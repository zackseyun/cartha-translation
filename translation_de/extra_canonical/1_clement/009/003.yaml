  terminology: „Henoch“ entspricht dem üblichen deutschen biblischen Namen. „Entrückt“ wahrt den biblisch-religiösen Registerwert und ist gegenüber dem technisch oder bürokratisch klingenden „versetzt“ im Haupttext vorzuziehen. Die Fußnote dokumentiert die lexikalisch nähere Alternative, ohne eine weitergehende theologische Deutung festzulegen.
