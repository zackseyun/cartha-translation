  source_fidelity: 'Die Übersetzung gibt alle Bestandteile der griechischen Vorlage sachgerecht wieder: Der hortative Aufruf λάβωμεν wird idiomatisch als „Nehmen wir Henoch als Beispiel“ gefasst; „im Gehorsam als gerecht befunden“ bewahrt die passive Konstruktion und die Verbindung von Gehorsam und Gerechtigkeit; „entrückt“ trifft μετετέθη im traditionsgeschichtlichen Henoch-Kontext, ohne Ziel oder Handelnden ausdrücklich einzutragen. Die bewusst ungewöhnliche Formulierung „sein Tod wurde nicht gefunden“ bildet οὐχ εὑρέθη αὐτοῦ θάνατος eng ab und löst sie nicht unzulässig zu „er starb nicht“ auf.'
