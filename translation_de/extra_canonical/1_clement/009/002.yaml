  yaml_path: translation/extra_canonical/1_clement/009/002.yaml
  text: Let us fix our gaze on those who served perfectly in his majestic glory.
translation:
  language: de
  text: Richten wir unseren Blick auf diejenigen, die seiner majestätischen Herrlichkeit vollkommen gedient haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in seiner majestätischen Herrlichkeit vollkommen gedient haben“.'
    reason: Der griechische Dativ kann entweder das Gegenüber des Dienstes oder den Bereich bezeichnen, in dem der Dienst geschieht.
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Richten wir unseren Blick
  rationale: Der auffordernde Aorist wird als gemeinschaftlicher Aufruf wiedergegeben; die Formulierung drückt das aufmerksame, anhaltende Hinschauen natürlich aus.
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: die, die … in vollkommener Weise gedient haben
  rationale: λειτουργέω bezeichnet hier einen geleisteten Dienst; „gedient“ ist im Deutschen natürlich und wahrt den kultisch-öffentlichen Beiklang, ohne ihn unnötig festzulegen. τελείως wird adverbial als „in vollkommener Weise“ wiedergegeben.
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: seiner majestätischen Herrlichkeit
  rationale: μεγαλοπρεπής wird mit „majestätisch“ und δόξα mit „Herrlichkeit“ wiedergegeben. Der griechische Dativ wird eng an „gedient“ angeschlossen.
theological_decisions:
- issue: Beziehung des Dativs τῇ … δόξῃ zu λειτουργήσαντας
  choice: „seiner majestätischen Herrlichkeit … gedient“
  alternative: „in seiner majestätischen Herrlichkeit gedient“
  rationale: λειτουργέω kann einen Dativ desjenigen bei sich haben, dem Dienst geleistet wird. Die gewählte Fassung bildet diese naheliegende syntaktische Beziehung ab; die mögliche modale oder sphärische Deutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gemeinschaftliche Aufruf bleibt knapp und eindringlich; die ungewöhnliche Verbindung von „dienen“ und „Herrlichkeit“ wird als Ausdruck des griechischen Textes bewahrt.
