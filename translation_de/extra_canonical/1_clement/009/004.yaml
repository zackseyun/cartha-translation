  source_fidelity: 'Der Satzbau und die Rollenverteilung sind im Entwurf grundsätzlich richtig wiedergegeben: Noah ist der treu Befundene und Verkündende; der δεσπότης handelt rettend durch Noah. παλιγγενεσία bezeichnet jedoch eher „Erneuerung“ als den stärker idiomatischen, aber enger deutenden „Neuanfang“. Die am Schluss überlieferte OCR-Lesart ἐν ὁμοίᾳ ist offenbar verderbt; die in der Textüberlieferung erwartbare Lesung ἐν ὁμονοίᾳ bedeutet „in Eintracht/Einmütigkeit“, nicht „paarweise“.'
  naturalness: „Der Herrscher“ ist als Gottesbezeichnung im modernen deutschen Bibelregister ungewohnt und kann politisch missverstanden werden. „Der Herr“ ist hier natürlich und würdig. „In die Arche gingen“ gibt das partizipiale εἰσελθόντα knapp und flüssig wieder.
  terminology: „Erneuerung“ wahrt bei παλιγγενεσία den sachlichen Bezug auf die durch die Flut erneuerte Welt und lässt zugleich den terminologischen Klang des Wortes erkennbar. „Lebewesen“ ist für ζῷα möglich; „Tiere“ ist im konkreten Arche-Kontext natürlicher, ohne den Sinn einzuengen.
  issues:
  - severity: medium
    issue: „Neuanfang“ für παλιγγενεσία
    rationale: Die Wiedergabe ist verständlich, deutet den griechischen Begriff aber stärker als bloßen Neubeginn. „Erneuerung“ entspricht dem Wort und dem Flutkontext unmittelbarer.
  - severity: low
    issue: „der Herrscher“ für ὁ δεσπότης
    rationale: Die Übersetzung ist lexikalisch vertretbar, aber im deutschen religiösen Register unnatürlich. „Der Herr“ ist die etablierte und verständliche Wiedergabe, ohne eine theologische Zuspitzung vorzunehmen.
  - severity: low
    issue: Fußnote formuliert die Textunsicherheit zu pauschal
    rationale: Die Fußnote soll präzise zwischen der auffälligen vorgelegten OCR-Lesart und der naheliegenden Lesung ἐν ὁμονοίᾳ unterscheiden. Damit wird weder „paarweise“ importiert noch die Sache unnötig als umfassend unsicher dargestellt.
  revised_text: Noah wurde als treu befunden; durch seinen Dienst verkündete er der Welt Erneuerung, und durch ihn rettete der Herr die Tiere, die in Eintracht in die Arche gingen.[a]
