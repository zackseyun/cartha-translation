    reason: Die Anmerkung erklärt die problematische OCR-Lesart und die wahrscheinliche Lesung, ohne das aus dem Genesisbericht bekannte „paarweise“ in den Wortlaut einzutragen.
  revision_rationale: Die Revision verbessert die Wiedergabe von παλιγγενεσία zu „Erneuerung“, verwendet für δεσπότης die im Deutschen natürliche Gottesbezeichnung „der Herr“ und präzisiert die textkritische Anmerkung zum Schluss des Verses. Der Sinn, dass Gott die in Eintracht in die Arche eingegangenen Tiere durch Noah rettete, bleibt vollständig erhalten.
