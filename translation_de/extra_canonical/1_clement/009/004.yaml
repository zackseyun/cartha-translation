source:
  edition: Funk 1901 (normalized OCR)
  text: Νῶε πιστὸς εὑρεθεὶς διὰ τῆς λειτουργίας αὐτοῦ παλιγγενεσίαν κόσμῳ ἐκήρυξεν, καὶ διέσωσεν δι’ αὐτοῦ ὁ δεσπότης τὰ εἰσελθόντα ἐν ὁμοίᾳ ζῷα εἰς τὴν κιβωτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: de
  text: Noah wurde als treu befunden; durch seinen Dienst verkündete er der Welt Erneuerung, und durch ihn rettete der Herr die Tiere, die in Eintracht in die Arche gingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte OCR-Lesart lautet „in Gleichheit/Ähnlichkeit“ und ist an dieser Stelle auffällig. Wahrscheinlich ist „in Eintracht“ zu lesen (griechisch ἐν ὁμονοίᾳ); „paarweise“ steht nicht im griechischen Text.
    reason: Die Anmerkung erklärt die problematische OCR-Lesart und die wahrscheinliche Lesung, ohne das aus dem Genesisbericht bekannte „paarweise“ in den Wortlaut einzutragen.
lexical_decisions:
- source_word: πιστὸς εὑρεθείς
  choice: wurde als treu befunden
  rationale: Gibt die passive Partizipialkonstruktion quellennah und in natürlichem Deutsch wieder.
- source_word: λειτουργίας
  choice: Dienst
  rationale: Bezeichnet hier Noahs von Gott übertragenes Wirken; „Dienst“ bewahrt den weiten Sinn ohne unnötige kultische Verengung.
- source_word: παλιγγενεσίαν
  choice: einen Neuanfang
  rationale: Im Zusammenhang der Flut ist die Erneuerung beziehungsweise Wiederentstehung der Welt gemeint. „Neuanfang“ ist verständlich und vermeidet eine vorschnelle Festlegung auf die spätere theologische Bedeutung „Wiedergeburt“.
- source_word: ὁ δεσπότης
  choice: der Herrscher
  rationale: Bewahrt den Titel δεσπότης und unterscheidet ihn vom häufigeren κύριος („Herr“).
- source_word: τὰ ... ζῷα
  choice: die Lebewesen
  rationale: Das substantivierte ζῷα bezeichnet die lebenden Geschöpfe beziehungsweise Tiere in der Arche; „Lebewesen“ bleibt formal nahe am Griechischen.
- source_word: ἐν ὁμοίᾳ
  choice: einträchtig
  rationale: Der überlieferte Text ist offenbar problematisch; wahrscheinlich steht hinter der OCR-Lesart ὁμοίᾳ eine Formulierung mit dem Sinn „in Eintracht“. Die Wiedergabe importiert nicht das im Griechischen unbelegte „paarweise“.
- source_word: διέσωσεν
  choice: rettete
  rationale: Gibt den Sinn von „sicher hindurchretten, bewahren“ im Flutkontext prägnant wieder.
theological_decisions:
- issue: Bedeutung von παλιγγενεσία
  choice: Neuanfang
  alternative: Wiedergeburt / Erneuerung
  rationale: Der Ausdruck kann theologisch „Wiedergeburt“ heißen, bezeichnet hier aber wahrscheinlich die erneuerte Welt nach der Flut. „Neuanfang“ wahrt den kosmischen Kontext, ohne andere Bedeutungsanteile zu leugnen.
- issue: Subjekt und Mittler in διέσωσεν δι’ αὐτοῦ ὁ δεσπότης
  choice: Der Herrscher rettete durch Noah
  alternative: Noah selbst rettete
  rationale: Das ausdrückliche Subjekt ὁ δεσπότης ist Gott; δι’ αὐτοῦ bezeichnet Noah als das Mittel seines rettenden Handelns.
- issue: Textlich unsichere Wendung ἐν ὁμοίᾳ
  choice: einträchtig
  alternative: paarweise
  rationale: „Paarweise“ wäre eine aus Genesis eingetragene Präzisierung, für die im vorgelegten griechischen Wortlaut kein Zahlwort steht. Die wahrscheinliche Lesart zielt auf Eintracht beziehungsweise Gemeinsamkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzführung. Das Semikolon entlastet die lange griechische Periode. Ungewöhnliche, aber bedeutungstragende Begriffe werden verständlich wiedergegeben; die textkritische Unsicherheit am Versende wird nicht stillschweigend aufgelöst.
