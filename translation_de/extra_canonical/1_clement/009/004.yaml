revisions:
- from: Noah wurde als treu befunden; durch seinen Dienst verkündete er der Welt einen Neuanfang, und durch ihn rettete der Herrscher die Lebewesen, die einträchtig in die Arche hineingegangen waren.[a]
  to: Noah wurde als treu befunden; durch seinen Dienst verkündete er der Welt Erneuerung, und durch ihn rettete der Herr die Tiere, die in Eintracht in die Arche gingen.[a]
  rationale: Die Revision verbessert die Wiedergabe von παλιγγενεσία zu „Erneuerung“, verwendet für δεσπότης die im Deutschen natürliche Gottesbezeichnung „der Herr“ und präzisiert die textkritische Anmerkung zum Schluss des Verses. Der Sinn, dass Gott die in Eintracht in die Arche eingegangenen Tiere durch Noah rettete, bleibt vollständig erhalten.
