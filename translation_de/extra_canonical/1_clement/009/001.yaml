reference: 1 Clement 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: de
  text: Darum lasst uns seinem majestätischen und herrlichen Willen gehorchen und als Bittende um sein Erbarmen und seine Güte[a] vor ihm niederfallen und uns seinen Erweisen des Mitgefühls zuwenden, indem wir vergebliches Mühen sowie Streit und den Neid, der zum Tod führt, hinter uns lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Genitive können formal auch enger mit „Bittende“ verbunden werden; im Zusammenhang bezeichnen sie wahrscheinlich das, worum gebeten wird.
    reason: Bewahrt die im englischen Audit Trail vermerkte formale Alternative, ohne eine im Deutschen unidiomatische Scheinübersetzung zu erzeugen.
lexical_decisions:
- source_word: βουλήσει
  choice: Willen
  rationale: Das Wort bezeichnet hier Gottes Absicht oder Willensentschluss. „Willen“ ist im Deutschen natürlich und bewahrt den verpflichtenden Charakter im Zusammenhang mit ὑπακούσωμεν.
- source_word: ἱκέται γενόμενοι
  choice: als Bittende
  rationale: ἱκέτης bezeichnet einen demütig Flehenden. „als Bittende“ ist gegenwärtiges, verständliches Deutsch und vermeidet das altertümliche „Bittsteller“.
- source_word: οἰκτιρμούς
  choice: Erweisen des Mitgefühls
  rationale: Der griechische Plural bezeichnet Regungen oder konkrete Erweise erbarmenden Mitgefühls. Diese Wiedergabe erhält den Pluralgedanken, ohne im Deutschen unnatürlich „Erbarmungen“ zu sagen.
- source_word: ματαιοπονίαν
  choice: vergebliche Mühen
  rationale: Das Kompositum bezeichnet nutzlose, erfolglose Anstrengung; der Plural klingt im Deutschen idiomatisch.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: ζῆλος kann Eifer, Rivalität oder Eifersucht bedeuten. Zusammen mit Streit und der Folge Tod ist hier die destruktive Bedeutung „Eifersucht“ am wahrscheinlichsten.
theological_decisions:
- issue: Bedeutung von βούλησις als Wille oder Ratschluss
  choice: Willen
  alternative: Ratschluss / Absicht
  rationale: Der Text fordert Gehorsam gegenüber Gottes βούλησις. „Willen“ gibt dies klar wieder, ohne einen besonderen dogmatischen Begriff des göttlichen Ratschlusses einzutragen.
- issue: Genitive bei „Bittende“
  choice: Bittende um sein Erbarmen und seine Güte
  alternative: Bittende seines Erbarmens und seiner Güte
  rationale: 'Die Genitive τοῦ ἐλέους καὶ τῆς χρηστότητος lassen sich am natürlichsten objektiv verstehen: Erbarmen und Güte sind das Erbetene. Die alternative formnähere Konstruktion bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffordernde erste Person Plural wird mit „wollen wir“ und „Lasst uns“ natürlich wiedergegeben. Abstrakte Begriffe werden verständlich formuliert, während der Plural von οἰκτιρμοί und die negative Spannung von ζῆλος erhalten bleiben.
