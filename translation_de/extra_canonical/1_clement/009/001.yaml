revisions:
- from: Darum wollen wir seinem majestätischen und herrlichen Willen gehorchen. Lasst uns als Bittende um sein Erbarmen und seine Güte[a] vor ihm niederfallen und uns seinen Erweisen des Mitgefühls zuwenden. Dabei wollen wir alles vergebliche Mühen hinter uns lassen, ebenso Streit und die Eifersucht, die zum Tod führt.
  to: Darum lasst uns seinem majestätischen und herrlichen Willen gehorchen und als Bittende um sein Erbarmen und seine Güte[a] vor ihm niederfallen und uns seinen Erweisen des Mitgefühls zuwenden, indem wir vergebliches Mühen sowie Streit und den Neid, der zum Tod führt, hinter uns lassen.
  rationale: Die Revision glättet die deutsche Syntax, stellt die einheitliche griechische Aufforderungsreihe wieder her und ersetzt zwei problematische Wortwahlen. „Neid“ trifft ζῆλος in diesem Lasterkatalog genauer als „Eifersucht“; „vergebliches Mühen“ ist eine natürliche, singularische Wiedergabe von ματαιοπονία. Die Wiedergaben von Gottes Wille, demütigem Bitten und den pluralischen Erweisen des Mitgefühls bleiben erhalten. Die Fußnote erläutert die syntaktische Ambiguität ohne unnatürliches Deutsch.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:56:23Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben. Allerdings ist ζῆλος im Zusammenhang mit ἔρις und der tödlichen Folge eher als „Neid“ bzw. rivalisierender Eifer denn als möglicherweise sexuell konnotierte „Eifersucht“ zu verstehen. Der Singular ματαιοπονία sollte nicht durch die unidiomatische Verbindung „alles vergebliche Mühen“ wiedergegeben werden.
  naturalness: „Alles vergebliche Mühen“ ist im modernen Standarddeutsch nicht idiomatisch. Auch der Wechsel von „wollen wir“ zu „Lasst uns“ zerlegt die eng verbundene griechische Aufforderung unnötig. Eine einheitliche Aufforderungsform ist natürlicher.
  terminology: „Wille“ für βούλησις, „Bittende um“ für ἱκέται mit objektiv verstandenen Genitiven und „Erweisen des Mitgefühls“ für den pluralischen οἰκτιρμοί sind sachlich vertretbar. Die Fußnote sollte die formnähere Alternative jedoch nicht als deutsches wörtliches Zitat ausgeben, da „Bittende seines Erbarmens“ im Deutschen keine brauchbare Formulierung ist.
  issues:
  - severity: medium
    issue: „alles vergebliche Mühen“
    rationale: Die Formulierung ist grammatisch und idiomatisch holprig; ματαιοπονία steht zudem im Singular. „vergebliches Mühen“ gibt den Begriff natürlich und quellentreu wieder.
  - severity: medium
    issue: „Eifersucht“ für ζῆλος
    rationale: Im vorliegenden Lasterkatalog neben Streit bezeichnet ζῆλος am wahrscheinlichsten Neid bzw. rivalisierenden Eifer. „Eifersucht“ ist im heutigen Deutsch enger und kann eine nicht naheliegende Beziehungskonnotation hervorrufen.
  - severity: low
    issue: Wechsel der Aufforderungsform
    rationale: Die griechischen Konjunktive bilden eine zusammenhängende paränetische Reihe. Durchgehend „lasst uns“ bewahrt den Zusammenhang und klingt natürlich.
  - severity: low
    issue: Formulierung der Fußnote
    rationale: Die bisherige angeblich wörtliche deutsche Alternative ist nicht idiomatisch. Die Fußnote sollte lediglich die genitivische Anschlussmöglichkeit am griechischen Ausdruck erläutern.
  revised_text: Darum lasst uns seinem majestätischen und herrlichen Willen gehorchen und als Bittende um sein Erbarmen und seine Güte[a] vor ihm niederfallen und uns seinen Erweisen des Mitgefühls zuwenden, indem wir vergebliches Mühen sowie Streit und den Neid, der zum Tod führt, hinter uns lassen.
