id: 1CLEM.22.6
reference: 1 Clement 22:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: de
  text: Die Augen des Herrn sind auf die Gerechten gerichtet und seine Ohren auf ihr Flehen; doch das Angesicht des Herrn richtet sich gegen die, die Böses tun, um die Erinnerung an sie von der Erde auszulöschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίους
  choice: die Gerechten
  rationale: Gibt die substantivisch gebrauchte Bezeichnung knapp und traditionsnah wieder, ohne näher festzulegen, worin ihre Gerechtigkeit besteht.
- source_word: δέησιν
  choice: ihr Flehen
  rationale: Bezeichnet eine dringliche Bitte oder ein inständiges Gebet; „Flehen“ bewahrt die Intensität des griechischen Ausdrucks.
- source_word: πρόσωπον
  choice: das Angesicht
  rationale: Bewahrt das Körperbild und den feierlichen biblischen Sprachklang; im Zusammenhang bezeichnet es die ablehnende Zuwendung des Herrn.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: die Erinnerung an sie
  rationale: Gibt den Sinn eines fortbestehenden Gedenkens wieder und vermeidet die im Deutschen mögliche Einengung von „Gedächtnis“ auf das Erinnerungsvermögen.
theological_decisions:
- issue: Bedeutung der Präposition ἐπί beim Angesicht des Herrn
  choice: richtet sich gegen
  alternative: ist gegen
  rationale: Der Gegensatz zwischen Gottes wohlwollender Aufmerksamkeit für die Gerechten und seinem Angesicht gegenüber den Bösen verlangt hier eine gegnerische Bedeutung, ohne die Bildsprache aufzugeben.
- issue: Zweck oder Folge des göttlichen Gerichts
  choice: um ... auszulöschen
  alternative: sodass ... ausgelöscht wird
  rationale: Der griechische Genitiv des substantivierten Infinitivs τοῦ ἐξολεθρεῦσαι wird am natürlichsten als Zweckangabe verstanden; die Formulierung lässt die Gerichtsaussage in ihrer Schärfe stehen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Körperbildsprache „Augen“, „Ohren“ und „Angesicht“ bleibt erhalten; die Satzstruktur folgt dem griechischen Gegensatz, wird aber für flüssiges Deutsch leicht entfaltet.
