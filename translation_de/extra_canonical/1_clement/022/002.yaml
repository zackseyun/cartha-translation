- source_word: ἀγαπῶν ἡμέρας ἰδεῖν ἀγαθάς
  choice: und gute Tage sehen möchte
  rationale: Der griechische Ausdruck bedeutet wörtlich, gute Tage zu sehen zu lieben. Die idiomatische deutsche Fassung gibt den Wunsch nach dem Erleben guter Tage wieder, ohne den Sinn unnötig auszudeuten.
