lexical_decisions:
- source_word: παῦσον
  choice: Halte … zurück
  rationale: Der Aoristimperativ fordert entschieden dazu auf, die Zunge vom Bösen abzuhalten. Die deutsche Wendung ist natürlich und bewahrt den Sinn von Beenden beziehungsweise Unterbinden.
- source_word: κακοῦ
  choice: vom Bösen
  rationale: Das substantivierte Adjektiv bezeichnet das Böse beziehungsweise schädliches Reden allgemein; die Formulierung lässt diesen Umfang offen.
- source_word: δόλον
  choice: Trug
  rationale: Das Wort bezeichnet Täuschung oder Arglist. „Trug“ ist knapp, würdevoll und passt idiomatisch zu „reden“.
