review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt παῦσον („halte ab/zurück“) sowie die beiden parallelen Aufforderungen im Wesentlichen treffend wieder. Das zweite Glied τοῦ μὴ λαλῆσαι δόλον verlangt jedoch klar eine Ergänzung mit „ab“, damit auch die Lippen ausdrücklich vom Reden des Trugs abgehalten werden.
  naturalness: „… und deine Lippen davon, Trug zu reden“ ist ohne „ab“ syntaktisch unvollständig und im heutigen Standarddeutsch holprig. Mit „davon ab“ ist die elliptische Parallelkonstruktion natürlich und klar.
  terminology: „das Böse“ bewahrt die substantivierte, offen gehaltene Bedeutung von κακοῦ. „Trug“ ist eine angemessene, registergerechte Wiedergabe von δόλον; „Trug reden“ entspricht der knappen Formulierung des griechischen Zitats.
  issues:
  - severity: medium
    issue: Im zweiten Satzglied fehlt bei „deine Lippen davon, Trug zu reden“ das notwendige Partikelverb „ab“.
    rationale: Das Griechische wiederholt das Verb nicht, aber im Deutschen benötigt die Konstruktion „jemanden/etwas davon abhalten, etwas zu tun“ „ab“. Die Ergänzung stellt die grammatische und semantische Parallelität her, ohne den Sinn zu ändern.
  - severity: low
    issue: Die Fußnotenalternative „Lass deine Zunge vom Bösen ab“ ist weniger idiomatisch und kann allgemeiner wirken als der Ausgangstext.
    rationale: „Lass ab von“ bezieht sich gewöhnlich auf ein eigenes Tun; bei der Zunge ist „halte … ab/zurück“ die klarere und näherliegende Wiedergabe. Die Anmerkung ist nicht erforderlich.
  revised_text: Halte deine Zunge vom Bösen zurück und deine Lippen davon ab, Trug zu reden.
  revised_footnotes: []
