- from: Halte deine Zunge vom Bösen zurück[a] und deine Lippen davon, Trug zu reden.
  to: Halte deine Zunge vom Bösen zurück und deine Lippen davon ab, Trug zu reden.
  rationale: Die Ergänzung von „ab“ korrigiert die deutsche Syntax und macht deutlich, dass sowohl die Zunge als auch die Lippen Gegenstand der Aufforderung sind. Die knappe, würdige Form und die Ambiguität von κακοῦ bleiben erhalten. Die Fußnote wird entfernt, weil die Hauptfassung die Bedeutung von παῦσον bereits idiomatisch wiedergibt und die Alternative keinen zusätzlichen textlichen Befund erschließt.
