  text: ἐκέκραξεν ὁ δίκαιος, καὶ ὁ κύριος εἰσήκουσεν αὐτοῦ καὶ ἐκ πασῶν τῶν θλίψεων αὐτοῦ ἐῤῥύσατο αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/007.yaml
  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: de
  text: Der Gerechte schrie, und der Herr hörte ihn und rettete ihn aus all seinen Bedrängnissen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέκραξεν
  choice: schrie
  rationale: Gibt den kräftigen Hilferuf des Aorists natürlich und knapp wieder.
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Bewahrt die substantivierte Einzahl und den ethisch-religiösen Gehalt von δίκαιος.
- source_word: εἰσήκουσεν αὐτοῦ
  choice: hörte ihn
  rationale: Im Deutschen ist „jemanden hören“ die natürliche Entsprechung; im Zusammenhang ist das erhörende Zuhören mitgemeint, ohne es ausdrücklich hinzuzusetzen.
- source_word: θλίψεων
  choice: Bedrängnissen
  rationale: Deckt äußere Not, Druck und Bedrückung ab und wahrt den Plural.
- source_word: ἐῤῥύσατο
  choice: rettete
  rationale: Drückt die Befreiung aus drohender Not idiomatisch aus.
theological_decisions:
- issue: Bedeutung von εἰσήκουσεν
  choice: hörte ihn
  alternative: erhörte ihn
  rationale: „Erhörte“ würde die göttliche Antwort stärker explizieren; „hörte ihn“ bleibt näher am griechischen Wortlaut und bewahrt die Aussagefolge, in der die Rettung gesondert genannt wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper, psalmartiger Satzstruktur; keine Fußnoten erforderlich.
