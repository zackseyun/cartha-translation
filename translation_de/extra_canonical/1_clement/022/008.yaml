source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: de
  text: 'Zahlreich sind die Bedrängnisse des Gerechten, und aus ihnen allen wird der Herr ihn retten. Weiter heißt es: »Zahlreich sind die Schläge, die den Sünder treffen; wer aber auf den Herrn hofft, den wird Erbarmen umgeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: Bedrängnisse
  rationale: Bezeichnet Nöte, Drangsale und bedrückende Leiden; »Bedrängnisse« ist quellenah und zugleich allgemein verständlich.
- source_word: ῥύσεται
  choice: wird … retten
  rationale: Gibt das Herausreißen oder Befreien aus Gefahr natürlich wieder, ohne die Aussage abzuschwächen.
- source_word: μάστιγες
  choice: Schläge
  rationale: Das Wort bezeichnet wörtlich Geißelhiebe und übertragen schwere Züchtigungen oder Plagen; »Schläge« bewahrt das kräftige Bild.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Gibt die barmherzige Zuwendung prägnant wieder und passt zum personifizierten Bild des Umgebens.
- source_word: κυκλώσει
  choice: wird … umgeben
  rationale: Bewahrt das räumliche Schutzbild des griechischen Verbs.
theological_decisions:
- issue: Singular und Mehrzahl bei τοῦ δικαίου und τοὺς … ἐλπίζοντας
  choice: Zunächst »des Gerechten … ihn«, danach idiomatisch kollektiv »wer … hofft, den …«
  alternative: »die auf den Herrn hoffen, wird Erbarmen umgeben«
  rationale: Der erste Satz bewahrt den grammatischen Singular. Im zweiten gibt die deutsche Wer-Konstruktion den generischen Plural natürlich wieder, ohne den Kreis der Hoffenden einzuengen.
- issue: Beziehung der μάστιγες zum Sünder
  choice: »die den Sünder treffen«
  alternative: »die Schläge des Sünders«
  rationale: Der griechische Genitiv kann formal mit »des Sünders« wiedergegeben werden, meint im Psalmzusammenhang jedoch die zahlreichen Plagen beziehungsweise Strafschläge, die den Sünder treffen. Die gewählte Formulierung verhindert im Deutschen das naheliegende Missverständnis, der Sünder teile selbst Schläge aus.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Satzform »Zahlreich sind …« erhält den poetischen Charakter der beiden Schriftzitate; »Weiter heißt es« gibt εἶτα als Einführung eines weiteren Zitats natürlich wieder.
