source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: de
  text: 'Dies alles aber bekräftigt der Glaube an Christus[a]. Denn er selbst ruft uns durch den Heiligen Geist so zu sich[b]: »Kommt, Kinder, hört mir zu; ich will euch die Furcht des Herrn lehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Glaube in Christus«.'
    reason: Die Präpositionalwendung ἐν Χριστῷ kann formal enger am griechischen Wortlaut wiedergegeben werden; im Kontext ist »Glaube an Christus« idiomatisch und naheliegend.
  - marker: b
    text: 'Oder: »ruft uns so«.'
    reason: Das Medium προσκαλεῖται kann idiomatisch ohne die ausdrücklich gemachte Nuance »zu sich« übersetzt werden.
lexical_decisions:
- source_word: βεβαιοῖ
  choice: wird … bekräftigt
  rationale: Gibt das Bestätigen und Festigen der zuvor genannten Dinge wieder, ohne einen stärkeren Sinn wie »beweisen« einzutragen.
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: der Glaube an Christus
  rationale: Natürliches modernes Deutsch für die wahrscheinlich objektbezogene Wendung; die formal mögliche Lesart »der Glaube in Christus« bleibt in einer Fußnote sichtbar.
- source_word: προσκαλεῖται ἡμᾶς
  choice: ruft uns … zu sich
  rationale: Die mediale Form bezeichnet ein Herbeirufen zu sich und ist daher genauer als ein bloßes »ruft uns«.
- source_word: φόβον κυρίου
  choice: die Furcht des Herrn
  rationale: Bewahrt den biblisch-theologischen Ausdruck und seine Spannweite von Ehrfurcht bis Furcht.
theological_decisions:
- issue: Bezug von αὐτός in »er selbst«
  choice: Das maskuline Pronomen wird unverändert als »er selbst« wiedergegeben, ohne den Bezug ausdrücklich zu benennen.
  alternative: »Christus selbst« oder »der Herr selbst«
  rationale: Der Kontext legt Christus nahe, doch der griechische Wortlaut nennt den Referenten nicht erneut; die Übersetzung wahrt diese Form.
- issue: Christus spricht durch den Heiligen Geist
  choice: »Denn er selbst ruft uns durch den Heiligen Geist …«
  alternative: Die Aussage als unmittelbare Rede des Geistes oder ausschließlich als Psalmzitat kennzeichnen
  rationale: Die christologische und pneumatologische Zuordnung des griechischen Textes wird nicht geglättet oder systematisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Gegensatz beziehungsweise Anschluss von δέ bleibt mit »aber« erhalten. Das Psalmzitat ist als direkte Rede gesetzt; »ihr Kinder« klingt natürlich und bewahrt die Anrede τέκνα.
