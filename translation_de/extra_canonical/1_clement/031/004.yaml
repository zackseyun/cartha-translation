base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: de
  text: Jakob zog in Demut seines Bruders wegen aus seinem Land fort, ging zu Laban und diente ihm. Und ihm wurden die zwölf Stämme[a] Israels gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa »das zwölfszeptrige Israel«. Gemeint sind wahrscheinlich die zwölf Stämme Israels; die ungewöhnliche griechische Wortbildung bewahrt dabei die Bildsprache des »Szepters«.
    reason: Gibt die wörtliche Szepter-Bildsprache von δωδεκάσκηπτρον wieder, kennzeichnet »zwölf Stämme« als wahrscheinliche idiomatische Deutung und vermeidet eine unzutreffend starke lexikalische Gleichsetzung.
lexical_decisions:
- source_word: μετὰ ταπεινοφροσύνης
  choice: in Demut
  rationale: Gibt die innere Haltung bzw. Gesinnung natürlich und würdevoll wieder, ohne den Ausdruck auf bloße äußere Niedrigkeit zu verengen.
- source_word: δι’ ἀδελφόν
  choice: seines Bruders wegen
  rationale: Bewahrt die knappe kausale Formulierung des Griechischen, ohne näher festzulegen, auf welche Weise der Bruder den Weggang veranlasste.
- source_word: ἐδούλευσεν
  choice: diente ihm
  rationale: Das Verb bezeichnet Jakobs Dienst bei Laban. Das im Deutschen ergänzte Objekt ergibt sich eindeutig aus dem unmittelbaren Zusammenhang.
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: die zwölf Stämme Israels
  rationale: Das seltene Kompositum bedeutet im biblisch-griechischen Sprachraum idiomatisch die zwölf Stämme; die zugrunde liegende Bildsprache des »Szepters« wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Die Gabe der zwölf Stämme an Jakob
  choice: ihm wurden die zwölf Stämme Israels gegeben
  alternative: von ihm gingen die zwölf Stämme Israels aus
  rationale: Die passive Formulierung ἐδόθη αὐτῷ wird beibehalten. So bleibt der Gedanke der Gabe erhalten und wird nicht zu einer bloßen genealogischen Aussage umgedeutet.
- issue: Bedeutung von δωδεκάσκηπτρον
  choice: zwölf Stämme mit erklärender Fußnote
  alternative: das Zwölfszepter / das zwölfszeptrige Volk
  rationale: Die idiomatische Bedeutung ist für heutige Leser verständlich, während die Fußnote die ungewöhnliche griechische Wortbildung und ihre mögliche königliche Bildwirkung sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am griechischen Text; der zweite Hauptsatz wird zur besseren Lesbarkeit mit einem Punkt abgesetzt.
