  terminology: »Demut«, »Laban«, »diente« und »zwölf Stämme Israels« sind angemessen. Die Fußnote benötigt eine präzisere Beschreibung der Wortbildung von δωδεκάσκηπτρον, ohne eine unsichere lexikalische Gleichsetzung von »Szepter« und »Stamm« zu formulieren.
