id: 1CLEM.31.1
reference: 1 Clement 31:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: de
  text: Halten wir also an seinem Segen fest und sehen wir, was die Wege des Segens sind. Rollen wir auf, was von Anfang an geschehen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: Halten wir … fest
  rationale: Gibt die Aufforderung zum engen, beharrlichen Festhalten natürlich wieder, ohne das im Deutschen missverständliche wörtliche „ankleben“.
- source_word: εὐλογίᾳ
  choice: Segen
  rationale: Bewahrt den zentralen Begriff und seine mögliche Bedeutung sowohl als göttliche Segensgabe als auch als Zustand des Gesegnetseins.
- source_word: ὁδοὶ τῆς εὐλογίας
  choice: Wege des Segens
  rationale: Erhält das Wegbild und die bewusst offene Genitivverbindung des Griechischen.
- source_word: ἀνατυλίξωμεν
  choice: Rollen wir auf
  rationale: Bewahrt das anschauliche Bild des Aufrollens beziehungsweise Entfaltens und bezeichnet zugleich die folgende rückblickende Darlegung.
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: was von Anfang an geschehen ist
  rationale: Gibt die substantivierte Wendung idiomatisch und zeitlich präzise wieder.
theological_decisions:
- issue: Bezug von αὐτοῦ („seinem“)
  choice: Das Pronomen bleibt ohne ergänzende Benennung stehen.
  alternative: „am Segen Gottes“ oder eine andere ausdrückliche Identifikation
  rationale: Der Vers selbst nennt den Bezugsgegenstand nicht; eine Ergänzung würde die im unmittelbaren Wortlaut bestehende Referenz festlegen.
- issue: Bedeutung der „Wege des Segens“
  choice: Die metaphorische und grammatische Offenheit bleibt erhalten.
  alternative: „die Wege, die zum Segen führen“
  rationale: Die Alternative legt einen Ziel- oder Mittelbezug fest, den der griechische Genitiv nicht ausdrücklich bestimmt.
translation_notes:
  register: Moderne, würdige Standardsprache mit gemeinschaftlichen Aufforderungen. Die Wiederholung von „Segen“ und das Wegbild werden bewusst beibehalten; „Rollen wir auf“ spiegelt die markante Metapher des griechischen Verbs.
