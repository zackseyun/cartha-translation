  source_fidelity: Die rhetorische Frage, das Passiv („wurde … gesegnet“), die Anrede „unser Vater Abraham“ sowie die Abfolge von Glauben und ethischem Handeln sind im Entwurf grundsätzlich zutreffend wiedergegeben. Das aoristische Partizip ποιήσας ist jedoch am besten als dem Segen vorausliegender bzw. begründender Vollzug auszudrücken.
