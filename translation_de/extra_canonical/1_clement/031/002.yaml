  text: τίνος χάριν ηὐλογήθη ὁ πατὴρ ἡμῶν Ἀβραάμ, οὐχὶ δικαιοσύνην καὶ ἀλήθειαν διὰ πίστεως ποιήσας;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/002.yaml
  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: de
  text: Aus welchem Grund wurde unser Vater Abraham gesegnet? War es nicht, weil er durch Glauben Gerechtigkeit und Wahrheit übte?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: Aus welchem Grund
  rationale: Gibt die Frage nach dem Grund idiomatisch und eng am griechischen Ausdruck wieder.
- source_word: ηὐλογήθη
  choice: wurde … gesegnet
  rationale: Bewahrt die Passivform des Aorists und den theologischen Grundbegriff des Segnens.
- source_word: ὁ πατὴρ ἡμῶν Ἀβραάμ
  choice: unser Vater Abraham
  rationale: Entspricht direkt dem griechischen Wortlaut und bewahrt die gemeinschaftliche Bezugnahme.
- source_word: οὐχὶ
  choice: Nicht deshalb, weil …?
  rationale: Formuliert die rhetorische Frage mit der im Griechischen erwarteten bejahenden Antwort natürlich auf Deutsch.
- source_word: δικαιοσύνην καὶ ἀλήθειαν
  choice: Gerechtigkeit und Wahrheit
  rationale: Bewahrt die beiden abstrakten Akkusativobjekte ohne sie interpretierend in Adverbien oder Tugendbeschreibungen umzuwandeln.
- source_word: διὰ πίστεως
  choice: durch Glauben
  rationale: Gibt die instrumentale bzw. vermittelnde Bedeutung wieder, ohne die genaue Beziehung zwischen Glauben und Tun weiter festzulegen.
- source_word: ποιήσας
  choice: tat
  rationale: Entspricht dem schlichten ποιεῖν und vermeidet die interpretierende Abschwächung „übte“ oder „praktizierte“.
theological_decisions:
- issue: Verhältnis von Glauben, Tun und Segen
  choice: „weil er durch Glauben Gerechtigkeit und Wahrheit tat“
  alternative: „weil er im Glauben gerecht und wahrhaftig handelte“
  rationale: Die gewählte Fassung hält Glauben als vermittelndes Moment fest und bewahrt Gerechtigkeit und Wahrheit als Objekte des Tuns. Sie löst die Spannung zwischen Glauben, Handeln und Segen nicht konfessionell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die etwas markante Verbindung „Gerechtigkeit und Wahrheit tat“ ist bewusst beibehalten, da sie den Wortlaut und die inhaltliche Spannung genauer wahrt als eine glättende Umschreibung.
