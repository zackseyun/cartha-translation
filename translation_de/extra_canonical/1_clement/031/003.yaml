id: 1CLEM.31.3
reference: 1 Clement 31:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰσαὰκ μετὰ πεποιθήσεως γινώσκων τὸ μέλλον ἡδέως προσήγετο θυσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/003.yaml
  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: de
  text: Isaak wusste voller Zuversicht, was kommen würde, und ließ sich gern zum Opfer führen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: voller Zuversicht
  rationale: Gibt die feste, vertrauensvolle Gewissheit idiomatisch wieder und bezieht sie eindeutig auf Isaaks Wissen.
- source_word: γινώσκων τὸ μέλλον
  choice: wusste …, was kommen würde
  rationale: Natürliches modernes Deutsch für das Wissen um das Bevorstehende; τὸ μέλλον bezeichnet hier das, was künftig geschehen sollte.
- source_word: ἡδέως
  choice: bereitwillig
  rationale: Drückt im Zusammenhang einer Opferdarbringung freudige beziehungsweise willige Zustimmung würdig und natürlich aus.
- source_word: προσήγετο θυσία
  choice: ließ sich … als Opfer darbringen
  rationale: Bewahrt die mediale/passive Form und vermeidet die stärkere, im Griechischen nicht eindeutige Aussage, Isaak habe sich selbst aktiv geopfert.
theological_decisions:
- issue: Grad von Isaaks eigener Aktivität bei der Opferdarbringung
  choice: ließ sich bereitwillig als Opfer darbringen
  alternative: brachte sich bereitwillig als Opfer dar
  rationale: Die Form προσήγετο kann medial oder passiv verstanden werden. Die gewählte Fassung wahrt Isaaks willige Beteiligung, ohne den Opfernden ausdrücklich mit Isaak gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist flüssig gebaut; die Zuversicht wird eindeutig dem Wissen Isaaks zugeordnet. Keine Fußnote ist nötig, da die griechische Wortstellung im Deutschen ohne Bedeutungsverlust klar wiedergegeben werden kann.
