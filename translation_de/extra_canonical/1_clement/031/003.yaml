  verdict: revise
  source_fidelity: Die Konstruktion ἡδέως προσήγετο θυσία bezeichnet Isaaks freudig-williges Sich-zur-Opferung-Führenlassen bzw. seine willige Hingabe. Die vorliegende Formulierung ist grundsätzlich vertretbar, doch „bereitwillig“ gibt ἡδέως („gern, freudig“) nur abgeschwächt wieder.
  naturalness: „sich als Opfer darbringen lassen“ ist verständlich und modernes Standarddeutsch, klingt jedoch etwas schwerfällig. „sich gern zum Opfer führen lassen“ ist idiomatischer und bildet die mediale/passive Offenheit von προσήγετο ohne eine aktive Selbstopferung festzulegen.
  terminology: „Zuversicht“ für πεποίθησις und „was kommen würde“ für τὸ μέλλον sind treffend. „Zum Opfer“ bewahrt θυσία als Zweck-/Opferausdruck und vermeidet die potenziell stärkere Aussage, Isaak habe sich selbst als Opfer dargebracht.
