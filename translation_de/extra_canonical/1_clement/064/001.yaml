source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: de
  text: Schließlich möge der alles sehende Gott, der Herrscher über die Geister und Herr über alles Fleisch, der den Herrn Jesus Christus erwählt und uns durch ihn zu einem Volk gemacht hat, das ihm gehört, jeder Seele, über der sein erhabener und heiliger Name angerufen worden ist, Glauben, Ehrfurcht, Frieden, Standhaftigkeit und Langmut, Selbstbeherrschung, Reinheit und Besonnenheit schenken, zum Wohlgefallen seines Namens, durch unseren Hohepriester und Beschützer Jesus Christus. Durch ihn sei ihm Herrlichkeit und Majestät, Macht und Ehre, jetzt und in alle Zeitalter der Zeitalter. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λοιπόν
  choice: Schließlich
  rationale: Markiert den abschließenden Übergang des Briefes natürlich und würdig.
- source_word: παντεπόπτης
  choice: alles sehend
  rationale: Gibt die transparente Bedeutung des seltenen Titels wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: δεσπότης τῶν πνευμάτων
  choice: Herrscher über die Geister
  rationale: Bewahrt den Gedanken souveräner Herrschaft und unterscheidet δεσπότης sprachlich von dem folgenden κύριος.
- source_word: πάσης σαρκός
  choice: alles Fleisch
  rationale: Erhält die biblisch geprägte Kollektivformel, die alle sterblichen Lebewesen beziehungsweise Menschen umfasst.
- source_word: λαὸν περιούσιον
  choice: ein Volk, das ihm gehört
  rationale: Vermittelt idiomatisch den Gedanken eines besonders zugeeigneten Eigentumsvolkes.
- source_word: φόβον
  choice: Ehrfurcht
  rationale: Im Gebetskontext bezeichnet φόβος gegenüber Gott respektvolle Gottesfurcht; „Ehrfurcht“ ist im modernen Deutsch weniger missverständlich.
- source_word: ὑπομονήν
  choice: Standhaftigkeit
  rationale: Betont das standhafte Ausharren unter Belastung.
- source_word: μακροθυμίαν
  choice: Langmut
  rationale: Hält den Unterschied zu ὑπομονή fest und bezeichnet geduldige Nachsicht beziehungsweise langen Atem.
- source_word: σωφροσύνην
  choice: Besonnenheit
  rationale: Gibt vernünftige Selbstbeherrschung und gesundes Urteilsvermögen breit wieder.
- source_word: προστάτου
  choice: Beistand
  rationale: Erfasst die helfende und schützende Rolle, ohne den möglichen Bedeutungsumfang unnötig auf einen juristischen Fürsprecher zu verengen.
theological_decisions:
- issue: Bezug von ἐπικεκλημένῃ ... ὄνομα
  choice: „die durch seinen ... Namen berufen ist“
  alternative: „über der sein ... Name angerufen worden ist“
  rationale: Der Dativ ψυχῇ mit ἐπικεκλημένῃ lässt eine Berufung durch den Namen oder das Angerufensein beziehungsweise Benanntsein mit dem Namen zu. Der Haupttext folgt der im Kontext gut verständlichen Berufungslesart, ohne eine konfessionelle Zuspitzung.
- issue: Dativ τῷ ὀνόματι in εἰς εὐαρέστησιν
  choice: „damit sie seinem Namen wohlgefällt“
  alternative: „zum Wohlgefallen seines Namens“
  rationale: Die personale Formulierung klingt im Deutschen natürlicher und bewahrt zugleich die ungewöhnliche Ausrichtung des Wohlgefallens auf Gottes Namen.
- issue: Doxologie δι’ οὗ αὐτῷ
  choice: „Durch ihn sei Gott ...“
  alternative: „Durch ihn sei ihm ...“
  rationale: Das explizite „Gott“ klärt im Deutschen den Rückbezug von αὐτῷ auf Gott und verhindert, dass die Herrlichkeit grammatisch Jesus Christus zugeschrieben erscheint; die Mittlerschaft Christi bleibt durch „durch ihn“ erhalten.
- issue: Titel Χριστός
  choice: Christus
  alternative: Messias
  rationale: „Christus“ ist im deutschen frühchristlichen Text als Titelname natürlich und entspricht der griechischen Form, ohne die messianische Bedeutung zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch-frühchristlicher Färbung. Der lange griechische Segenssatz bleibt als zusammenhängende Gebetsperiode erkennbar, wird aber durch Gedankenstrich und klaren Doxologiesatz lesbarer gestaltet. Keine Fußnoten sind für den Veröffentlichungstext zwingend erforderlich.
