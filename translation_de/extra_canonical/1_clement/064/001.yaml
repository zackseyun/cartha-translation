revisions:
- from: Schließlich möge der alles sehende Gott, der Herrscher über die Geister und Herr über alles Fleisch, der den Herrn Jesus Christus erwählt hat und durch ihn auch uns zu einem Volk, das ihm gehört, jeder Seele, die durch seinen erhabenen und heiligen Namen berufen ist, Glauben, Ehrfurcht, Frieden, Standhaftigkeit und Langmut, Selbstbeherrschung, Reinheit und Besonnenheit schenken, damit sie seinem Namen wohlgefällt – durch unseren Hohepriester und Beistand Jesus Christus. Durch ihn sei Gott Herrlichkeit und Majestät, Macht und Ehre, jetzt und in alle Zeitalter der Zeitalter. Amen.
  to: Schließlich möge der alles sehende Gott, der Herrscher über die Geister und Herr über alles Fleisch, der den Herrn Jesus Christus erwählt und uns durch ihn zu einem Volk gemacht hat, das ihm gehört, jeder Seele, über der sein erhabener und heiliger Name angerufen worden ist, Glauben, Ehrfurcht, Frieden, Standhaftigkeit und Langmut, Selbstbeherrschung, Reinheit und Besonnenheit schenken, zum Wohlgefallen seines Namens, durch unseren Hohepriester und Beschützer Jesus Christus. Durch ihn sei ihm Herrlichkeit und Majestät, Macht und Ehre, jetzt und in alle Zeitalter der Zeitalter. Amen.
  rationale: Der Text wird nur dort geändert, wo die Vorlage entweder mehrdeutig ist oder ein zentraler Titel enger wiedergegeben wurde. Die Fußnotenmarke a ist nach „angerufen worden ist“ zu setzen. Die übrigen Entscheidungen des Entwurfs bleiben erhalten.
