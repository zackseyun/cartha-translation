review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Satzbau, Gottesprädikate, Tugendliste und Doxologie überwiegend treffend wieder. Bei ἐπικεκλημένῃ τὸ ... ὄνομα ist jedoch „durch seinen Namen berufen“ eine einseitige Festlegung; die griechische Konstruktion bezeichnet vorrangig, dass der Name über jemandem angerufen bzw. genannt worden ist. Auch προστάτης schließt die Schutzfunktion stärker ein als „Beistand“.
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. „Zum Wohlgefallen seines Namens“ bildet die zielgerichtete Präpositionalwendung εἰς εὐαρέστησιν genauer nach als die personale Umformung „damit sie seinem Namen wohlgefällt“, ohne unverständlich zu werden.
  terminology: „alles sehende“, „Herrscher über die Geister“, „Ehrfurcht“, „Standhaftigkeit“, „Langmut“, „Selbstbeherrschung“, „Reinheit“ und „Besonnenheit“ sind angemessen. „Beschützer“ ist für προστάτης quellentreuer und im Deutschen klar. Die Deutung der Namensformel wird mit einer Fußnote transparent gemacht, statt die vorhandene Ambiguität im Haupttext aufzulösen.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ἐπικεκλημένῃ τὸ ... ὄνομα als „die durch seinen ... Namen berufen ist“ verengt eine mehrdeutige Namensformel.
    rationale: Die Konstruktion kann bedeuten, dass Gottes Name über einer Person angerufen/ausgerufen bzw. sie nach diesem Namen benannt worden ist. Eine Berufung durch den Namen ist als Auslegung möglich, aber nicht als unmarkierte alleinige Übersetzung vorzuziehen.
  - severity: medium
    issue: „Beistand“ für προστάτης lässt die im griechischen Titel enthaltene Schutz- und Patronatsfunktion zurücktreten.
    rationale: προστάτης bezeichnet einen Schützer, Fürsprecher oder Patron; „Beschützer“ wahrt hier die zentrale Schutzbedeutung ohne eine spezifisch juristische oder konfessionelle Deutung.
  - severity: low
    issue: „damit sie seinem Namen wohlgefällt“ gestaltet εἰς εὐαρέστησιν τῷ ὀνόματι freier um.
    rationale: „zum Wohlgefallen seines Namens“ erhält die finale Nominalkonstruktion und die auffällige Bezugnahme auf den Namen Gottes genauer.
  revised_text: Schließlich möge der alles sehende Gott, der Herrscher über die Geister und Herr über alles Fleisch, der den Herrn Jesus Christus erwählt und uns durch ihn zu einem Volk gemacht hat, das ihm gehört, jeder Seele, über der sein erhabener und heiliger Name angerufen worden ist, Glauben, Ehrfurcht, Frieden, Standhaftigkeit und Langmut, Selbstbeherrschung, Reinheit und Besonnenheit schenken, zum Wohlgefallen seines Namens, durch unseren Hohepriester und Beschützer Jesus Christus. Durch ihn sei ihm Herrlichkeit und Majestät, Macht und Ehre, jetzt und in alle Zeitalter der Zeitalter. Amen.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich etwa: „jeder Seele, über der sein erhabener und heiliger Name angerufen worden ist“. Die griechische Namensformel kann auch die Benennung beziehungsweise Zugehörigkeit zu Gott ausdrücken; eine Berufung durch den Namen ist eine mögliche Deutung.'
    reason: Macht die semantische Reichweite von ἐπικεκλημένῃ τὸ ... ὄνομα sichtbar, ohne eine umstrittene Deutung im Haupttext festzuschreiben.
  revision_rationale: Der Text wird nur dort geändert, wo die Vorlage entweder mehrdeutig ist oder ein zentraler Titel enger wiedergegeben wurde. Die Fußnotenmarke a ist nach „angerufen worden ist“ zu setzen. Die übrigen Entscheidungen des Entwurfs bleiben erhalten.
