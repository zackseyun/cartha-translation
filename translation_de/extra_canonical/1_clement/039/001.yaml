source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄφρονες καὶ ἀσύνετοι καὶ μωροὶ καὶ ἀπαίδευτοι χλευάζουσιν ἡμᾶς καὶ μυκτηρίζουσιν, ἑαυτοὺς βουλόμενοι ἐπαίρεσθαι ταῖς διανοίαις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: de
  text: Unvernünftige, Unverständige, Dumme und Ungebildete verspotten und verhöhnen uns und wollen sich mit ihrem Denken selbst erhöhen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: Törichte
  rationale: Gibt den Mangel an vernünftigem Urteilsvermögen in natürlichem, würdigem Deutsch wieder.
- source_word: ἀσύνετοι
  choice: Einsichtslose
  rationale: Bewahrt gegenüber ἄφρονες die Nuance fehlender Einsicht beziehungsweise fehlenden Verständnisses.
- source_word: μωροί
  choice: Unverständige
  rationale: Erhält die verstärkende Reihung abwertender Bezeichnungen, ohne im modernen Deutsch unnötig grob oder missverständlich zu klingen.
- source_word: ἀπαίδευτοι
  choice: Ungebildete
  rationale: Bezeichnet Menschen ohne Bildung oder Unterweisung und entspricht dem griechischen Ausdruck unmittelbar.
- source_word: χλευάζουσιν … καὶ μυκτηρίζουσιν
  choice: verspotten und verhöhnen
  rationale: Die beiden Verben werden als gesteigerte, aber verwandte Formen spöttischer Herabsetzung wiedergegeben.
- source_word: ἑαυτοὺς βουλόμενοι ἐπαίρεσθαι
  choice: weil sie sich … überheben wollen
  rationale: Drückt die beabsichtigte Selbsterhöhung aus; „überheben“ bewahrt zugleich den negativen Unterton.
- source_word: ταῖς διανοίαις αὐτῶν
  choice: in ihren eigenen Gedanken
  rationale: Folgt der instrumentalen beziehungsweise sphärischen Offenheit des Dativs, ohne die Aussage auf „Einbildung“ oder „Meinung“ zu verengen.
