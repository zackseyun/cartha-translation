  timestamp: '2026-07-17T18:09:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die vierfache Charakterisierung, die doppelte Verspottung und die Absicht der Selbsterhöhung sind im Entwurf grundsätzlich getroffen. „sich ... überheben“ ist jedoch hier nicht passend: Im heutigen Deutsch bedeutet „sich übernehmen/überheben“ meist, dass jemand sich zu viel zumutet, während ἐπαίρεσθαι die Selbsterhöhung bezeichnet. Auch die kausale Einleitung „weil“ legt den Partizipialausdruck stärker als Begründung fest, als der griechische Text verlangt.'
  naturalness: Die Reihung ist verständlich, doch „Unverständige“ gibt eher ἀσύνετοι wieder als μωροί. „sich in ihren eigenen Gedanken überheben“ ist idiomatisch und semantisch missverständlich. Die Revision verwendet eine natürlichere Formulierung für die Selbsterhöhung und bewahrt die knappe rhetorische Reihung.
  terminology: „Unvernünftige“ für ἄφρονες, „Unverständige“ für ἀσύνετοι, „Dumme“ für μωροί und „Ungebildete“ für ἀπαίδευτοι unterscheiden die überlappenden Bezeichnungen hinreichend. „mit ihrem Denken“ gibt den Dativ ταῖς διανοίαις αὐτῶν offen wieder, ohne ihn zu einer bestimmten Lehre oder bloßen Einbildung einzuengen.
  issues:
  - severity: medium
    issue: „sich ... überheben“
    rationale: Diese Wendung bezeichnet im modernen Deutsch gewöhnlich ein Sich-zu-viel-Zumuten und nicht die im Griechischen ausgedrückte Selbsterhöhung.
  - severity: low
    issue: Zuordnung von „Unverständige“ zu μωροί
    rationale: „Unverständige“ entspricht semantisch eher ἀσύνετοι; μωροί wird mit „Dumme“ klarer wiedergegeben.
  - severity: low
    issue: Kausales „weil“
    rationale: Das Partizip βουλόμενοι bezeichnet die begleitende Absicht; eine koordinierte Wiedergabe vermeidet eine unnötige Festlegung auf einen Kausalzusammenhang.
  revised_text: Unvernünftige, Unverständige, Dumme und Ungebildete verspotten und verhöhnen uns und wollen sich mit ihrem Denken selbst erhöhen.
