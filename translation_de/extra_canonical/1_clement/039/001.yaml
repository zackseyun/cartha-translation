revisions:
- from: Törichte, Einsichtslose, Unverständige und Ungebildete verspotten und verhöhnen uns, weil sie sich in ihren eigenen Gedanken überheben wollen.
  to: Unvernünftige, Unverständige, Dumme und Ungebildete verspotten und verhöhnen uns und wollen sich mit ihrem Denken selbst erhöhen.
  rationale: Die Änderung korrigiert die missverständliche deutsche Wendung für Selbsterhöhung, ordnet die abgestuften abwertenden Bezeichnungen näher am Griechischen zu und erhält die Aussage über die beabsichtigte Selbstüberhöhung ohne eine stärker festgelegte Kausalverknüpfung.
