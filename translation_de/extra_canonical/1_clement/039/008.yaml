  verdict: approve
  source_fidelity: Die Übersetzung gibt ἐγὼ δὲ angemessen als „Ich aber“ wieder, bewahrt das Bild von ῥίζας βάλλοντας mit „Wurzeln schlugen“ und erhält sowohl die Unmittelbarkeit von εὐθέως als auch das Passiv von ἐβρώθη. „Wohnstätte“ ist für δίαιτα im vorliegenden bildhaften Kontext eine vertretbare, nicht überdeutende Wahl.
  naturalness: Der Satz ist klares, würdiges modernes Standarddeutsch. Die leicht auffällige Aussage, dass eine Wohnstätte „verzehrt“ wird, ist absichtlich beibehalten und entspricht der ungewöhnlichen Bildlichkeit des griechischen Wortlauts.
  terminology: „Toren“ trifft ἄφρονες im weisheitlich geprägten Register gut. „Wohnstätte“ hält den möglichen Aufenthalts- bzw. Wohnsinn von δίαιτα offen und harmonisiert mit dem englischen Audit-Text „dwelling“, ohne eine theologische oder interpretative Festlegung einzutragen.
