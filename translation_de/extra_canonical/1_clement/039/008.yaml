  text: ἐγὼ δὲ ἑώρακα ἄφρονας ῥίζας βάλλοντας, ἀλλʼ εὐθέως ἐβρώθη αὐτῶν ἡ δίαιτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/008.yaml
  text: But I have seen fools taking root, yet immediately their dwelling was consumed.
translation:
  language: de
  text: Ich aber habe gesehen, wie Toren Wurzeln schlugen; doch sogleich wurde ihre Wohnstätte verzehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ich aber
  rationale: Gibt den ausdrücklich gesetzten Gegensatz von δέ sowie die Betonung des Pronomens ἐγώ knapp und natürlich wieder.
- source_word: ἄφρονας
  choice: Toren
  rationale: Bezeichnet Menschen ohne Einsicht; das würdige, allgemein verständliche „Toren“ wahrt den weisheitlichen Klang.
- source_word: ῥίζας βάλλοντας
  choice: wie … Wurzeln schlugen
  rationale: Bewahrt das griechische Bild wörtlich und gibt das Partizip in natürlichem Deutsch als wahrgenommenen Vorgang wieder.
- source_word: εὐθέως
  choice: sogleich
  rationale: Drückt die unmittelbare zeitliche Wendung prägnant aus.
- source_word: ἐβρώθη
  choice: wurde … verzehrt
  rationale: Das Passiv von ἐσθίω bedeutet hier bildlich „aufgezehrt/verzehrt werden“; die passive Form bleibt erhalten.
- source_word: αὐτῶν ἡ δίαιτα
  choice: ihre Wohnstätte
  rationale: δίαιτα kann Lebensweise, Aufenthalt oder Wohnstätte bedeuten. Im Zusammenhang mit dem Wurzelbild ist „Wohnstätte“ plausibel und bewahrt zugleich die Bildhaftigkeit der überlieferten Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildsprache. Der Satz folgt dem griechischen Gegensatz und lässt die ungewöhnliche Verbindung von Wurzelschlagen und verzehrter Wohnstätte stehen, statt sie deutend zu glätten.
