  text: γέγραπται· Οὐκ ἦν μορφὴ πρὸ ὀφθαλμῶν μου, ἀλλʼ ἢ αὔραν καὶ φωνὴν ἤκουονʼ
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/003.yaml
  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: de
  text: 'Es steht geschrieben: »Vor meinen Augen war keine Gestalt, sondern ich hörte nur einen Lufthauch[a] und eine Stimme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine leichte Brise.'
    reason: αὔρα kann einen Lufthauch beziehungsweise eine leichte Brise bezeichnen.
lexical_decisions:
- source_word: γέγραπται
  choice: Es steht geschrieben
  rationale: Entspricht der geläufigen deutschen Zitierformel und fügt keinen im Griechischen fehlenden begründenden Anschluss hinzu.
- source_word: μορφή
  choice: Gestalt
  rationale: Gibt die sichtbare Form oder Erscheinung neutral und quellennah wieder.
- source_word: ἀλλʼ ἢ
  choice: sondern … nur
  rationale: 'Nach der Verneinung bezeichnet die Verbindung eine ausschließende Gegenüberstellung: Es war keine Gestalt zu sehen; wahrgenommen wurden lediglich ein Lufthauch und eine Stimme.'
- source_word: αὔρα
  choice: Lufthauch
  rationale: Bewahrt die Bedeutung eines leichten Luftzugs und klingt im Deutschen natürlicher und konkreter als das mehrdeutige „Hauch“ allein.
- source_word: φωνή
  choice: Stimme
  rationale: Im Zusammenhang mit dem Hören ist „Stimme“ die naheliegende Wiedergabe, ohne den Sprecher näher zu bestimmen.
- source_word: ἤκουον
  choice: ich hörte
  rationale: Das deutsche Präteritum gibt die vergangene Wahrnehmung idiomatisch wieder; der griechische Imperfekt muss hier nicht durch eine schwerfällige Verlaufsform nachgebildet werden.
