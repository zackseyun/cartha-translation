base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: de
  text: Rufe doch, ob dir jemand antwortet oder ob du einen der heiligen Engel siehst; denn Zorn tötet den Toren, und Eifersucht bringt den Irrenden um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: rufe nur
  rationale: Der Aoristimperativ fordert zum Rufen bzw. Anrufen auf; „nur“ gibt in diesem Zusammenhang den herausfordernden Ton des griechischen δέ natürlich wieder.
- source_word: ὑπακούσεται
  choice: antworten wird
  rationale: ὑπακούω bedeutet grundsätzlich „hören, gehorchen“; nach „rufen“ bezeichnet es idiomatisch das Reagieren auf den Ruf und wird daher mit „antworten“ wiedergegeben.
- source_word: ἁγίων ἀγγέλων
  choice: heiligen Engel
  rationale: Die ausdrückliche Lesart des griechischen Textes wird bewahrt; ἄγγελος bezeichnet hier ein himmlisches Wesen.
- source_word: ἄφρονα
  choice: den Toren
  rationale: Das substantivierte Adjektiv meint einen unverständigen oder törichten Menschen; „der Tor“ ist knapp und würdevoll.
- source_word: πεπλανημένον
  choice: den Irrenden
  rationale: Das substantivierte Perfektpartizip bezeichnet jemanden, der in die Irre geraten ist; „den Irrenden“ wahrt diesen Zustand, ohne dessen Art näher festzulegen.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: ζῆλος kann Eifer, Neid oder Eifersucht bezeichnen. Im Parallelismus mit zerstörerischem Zorn ist „Eifersucht“ eine natürliche negative Wiedergabe, ohne das Motiv weiter zu bestimmen.
theological_decisions:
- issue: Bezug auf die heiligen Engel
  choice: Die ungewöhnliche Formulierung „ob du einen der heiligen Engel siehst“ bleibt stehen.
  alternative: 'Nach dem hebräischen Text von Ijob 5,1 sinngemäß: „an welchen der Heiligen willst du dich wenden?“'
  rationale: Übersetzt wird die vorliegende griechische Textgestalt von 1 Clemens; eine Angleichung an den hebräischen Ijobtext würde die tatsächliche Lesart stillschweigend ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffordernd-herausfordernde Ton und der knappe poetische Parallelismus werden bewahrt; die ungewöhnliche griechische Satzfügung wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
