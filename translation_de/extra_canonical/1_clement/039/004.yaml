revisions:
- from: Was also? Kann ein Sterblicher vor dem Herrn rein sein oder ein Mensch aufgrund seiner Taten untadelig? Wenn der Herr schon seinen Dienern nicht vertraut und selbst bei seinen Engeln etwas Verkehrtes festgestellt hat![a]
  to: Was denn? Kann ein Sterblicher vor dem Herrn rein sein? Oder ist ein Mensch aufgrund seiner Taten untadelig, wenn der Herr seinen Dienern nicht vertraut und gegen seine Engel etwas Verkehrtes ersonnen hat?[a]
  rationale: Die Übersetzung wird an der Bedeutung von ἐπενόησεν („ersonnen“) und an der rhetorischen Satzstruktur des griechischen Textes ausgerichtet. Das ausdrücklich genannte Subjekt „der Herr“ verhindert im modernen Deutsch die falsche Zuordnung der folgenden Verben zu „ein Mensch“. Die schwierige Aussage über die Engel wird weder abgeschwächt noch dogmatisch erklärt.
