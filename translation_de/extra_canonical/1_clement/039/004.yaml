source:
  edition: Funk 1901 (normalized OCR)
  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: de
  text: Was denn? Kann ein Sterblicher vor dem Herrn rein sein? Oder ist ein Mensch aufgrund seiner Taten untadelig, wenn der Herr seinen Dienern nicht vertraut und gegen seine Engel etwas Verkehrtes ersonnen hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Dienern“ kann auch „Kindern“ bedeuten. Die Wendung „gegen seine Engel etwas Verkehrtes ersonnen hat“ ist im griechischen Text auffällig und wird unterschiedlich verstanden; sie ist hier möglichst nah am Wortlaut wiedergegeben.
    reason: Erläutert die lexikalische Mehrdeutigkeit von παῖς und wahrt bei der schwierigen Wendung κατὰ … σκολιόν τι ἐπενόησεν die Auslegungsfreiheit, ohne den Wortlaut zu harmonisieren.
lexical_decisions:
- source_word: βροτός
  choice: ein Sterblicher
  rationale: Bewahrt den Gegensatz zwischen der Vergänglichkeit des Menschen und dem Herrn in natürlichem, würdigem Deutsch.
- source_word: καθαρός
  choice: rein
  rationale: Gibt die moralisch-religiöse Bedeutung wieder, ohne sie auf bloße Schuldlosigkeit einzuengen.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: aufgrund seiner Taten
  rationale: ἀπό bezeichnet hier die Grundlage, auf der ein Mensch als untadelig gelten könnte; „Taten“ ist im Deutschen natürlicher als „Werke“, ohne den Sinn zu verändern.
- source_word: παίδων αὐτοῦ
  choice: seinen Dienern
  rationale: παῖς kann „Kind“ oder „Diener“ bedeuten. Im Hiob-Zitat und im argumentativen Zusammenhang bezeichnet es Wesen im Dienst des Herrn und bildet die Steigerung zu den Engeln.
- source_word: σκολιόν τι ἐπενόησεν
  choice: etwas Verkehrtes festgestellt hat
  rationale: σκολιός bezeichnet etwas Krummes, Verkehrtes oder Fehlerhaftes; ἐπινοέω kann hier das Bemerken oder Erkennen eines Mangels ausdrücken. Die Formulierung gibt den Sinn des Vergleichs verständlich wieder, während die ungewöhnlichere griechische Ausdrucksweise in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Subjekt von οὐ πιστεύει und ἐπενόησεν
  choice: „der Herr“ wird im Deutschen ausdrücklich wiederholt
  alternative: „wenn er seinen Dienern nicht vertraut …“
  rationale: Obwohl das griechische Subjekt nur mitgedacht ist, verlangt der Zusammenhang des Hiob-Zitats den Herrn als Handelnden. Ein bloßes „er“ würde sich im Deutschen irreführend auf den unmittelbar zuvor genannten Menschen beziehen und den Schluss vom Höheren auf den Niedrigeren zerstören.
- issue: Rhetorische Form und gedankliche Steigerung
  choice: Die ersten beiden Glieder als Fragen, das abschließende εἰ-Glied als ausrufende Begründung
  alternative: Alle Glieder als eine einzige lange Frage
  rationale: 'So bleibt die rhetorische Verneinung der menschlichen Reinheit ebenso erhalten wie die nachfolgende Begründung: Wenn selbst himmlische Diener vor dem Herrn nicht uneingeschränkt bestehen, dann erst recht kein Sterblicher.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Wiederholung „der Herr“ klärt den im Griechischen nur impliziten Subjektwechsel. „Selbst“ macht die argumentative Steigerung zu den Engeln sichtbar, ohne eine konfessionelle Deutung einzutragen.
