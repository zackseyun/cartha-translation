review_pass:
  verdict: revise
  source_fidelity: Die Fassung folgt im Wesentlichen der überlieferten Hiob-Anspielung, muss jedoch die in der bereitgestellten OCR enthaltene Verlesung bei ἡτοίμασας berücksichtigen. Im kritischen Sinn der zitierten Stelle ist „was sie bereitet haben“ gemeint, nicht „was du für jene bereitet hast“.
  naturalness: „von den Geringeren zerschlagen“ ist im modernen Deutsch sowohl syntaktisch als auch semantisch unerquicklich. „an den Toren der Schwächeren misshandelt werden“ bewahrt die schwierige soziale Bildsprache und ist verständlicher. „Heil“ ist möglich, wirkt hier aber stärker theologisch als der Kontext verlangt; „Rettung“ ist idiomatischer und weiter passend.
  terminology: σωτηρία wird mit „Rettung“ wiedergegeben. κολαβρισθείησαν wird als gewaltsames „misshandelt werden“ gefasst. Der problematische Ausdruck ἡσσόνων wird nicht doktrinär präzisiert, sondern als „der Schwächeren“ wiedergegeben. Die textkritisch erforderliche Änderung bei „sie bereitet haben“ wird mit einer Fußnote transparent gemacht.
  issues:
  - severity: high
    issue: „was du für jene bereitet hast“ folgt einer erkannten OCR-Verlesung.
    rationale: Die englische Auditspur hält zurecht fest, dass die Stelle Job 5,5 zitiert und der Sinn „was sie bereitet haben“ lautet. Die zweite Person Singular im normalisierten OCR-Text erzeugt einen unpassenden Sprecherwechsel und zerstört den Zusammenhang.
  - severity: medium
    issue: Der angekündigte Fußnotenanker fehlt im Haupttext, und es ist keine Fußnote geliefert.
    rationale: Die Übersetzungsnotizen verlangen ausdrücklich [a]; bei der textkritisch strittigen Lesart ist ein verankerter Hinweis erforderlich.
  - severity: medium
    issue: „an den Toren von den Geringeren zerschlagen“ ist unnatürlich und legt die Präposition unnötig als Handelndenangabe fest.
    rationale: ἐπὶ θύραις ἡσσόνων verbindet das Geschehen mit den Toren und den sozial Niedrigeren/Schwächeren. Die revidierte Formulierung erhält diese Bildsprache ohne das missverständliche „von“.
  revised_text: Ihre Söhne seien fern von Rettung; sie sollen an den Toren der Schwächeren misshandelt werden, und niemand wird sie retten. Denn was sie bereitet haben[a], werden die Gerechten essen; sie selbst aber werden nicht aus dem Unheil errettet werden.
