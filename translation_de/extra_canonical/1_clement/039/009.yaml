revisions:
- from: Ihre Söhne seien fern vom Heil; sie sollen an den Toren von den Geringeren zerschlagen werden, und niemand wird sie retten. Denn was du für jene bereitet hast, werden die Gerechten essen; sie selbst aber werden aus dem Unheil nicht errettet werden.
  to: Ihre Söhne seien fern von Rettung; sie sollen an den Toren der Schwächeren misshandelt werden, und niemand wird sie retten. Denn was sie bereitet haben[a], werden die Gerechten essen; sie selbst aber werden nicht aus dem Unheil errettet werden.
  rationale: Die Revision korrigiert die durch die OCR verursachte, kontextwidrige zweite Person bei ἡτοίμασας gemäß der in der Auditspur dokumentierten Hiob-Vorlage. Zugleich wird die schwierige Wendung mit ἡσσόνων in natürlichem, aber nicht harmonisierendem Deutsch wiedergegeben und der erforderliche Fußnotenanker ergänzt.
  reviewer_model: gpt-5.6-terra
