id: 1CLEM.39.9
reference: 1 Clement 39:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: de
  text: Ihre Söhne seien fern von Rettung; sie sollen an den Toren der Schwächeren misshandelt werden, und niemand wird sie retten. Denn was sie bereitet haben[a], werden die Gerechten essen; sie selbst aber werden nicht aus dem Unheil errettet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte normalisierte OCR-Text liest „was du für jene bereitet hast“. Im Zusammenhang mit dem Zitat von Hiob 5,5 ist jedoch die Lesart „was sie bereitet haben“ zugrunde gelegt.
    reason: Die Fußnote legt die Abweichung von der erkennbaren OCR-Verlesung offen und bewahrt die textkritische Unsicherheit transparent.
lexical_decisions:
- source_word: ἀπὸ σωτηρίας
  choice: fern vom Heil
  rationale: Gibt die räumlich formulierte Trennung von Rettung, Sicherheit oder Wohlergehen knapp wieder, ohne sie auf bloße körperliche Sicherheit einzuengen.
- source_word: κολαβρισθείησαν
  choice: sie sollen … zerschlagen werden
  rationale: Bewahrt den optativischen Wunschcharakter und die gewaltsame Bedeutung des seltenen Verbs.
- source_word: ἐπὶ θύραις
  choice: an den Toren
  rationale: Entspricht der örtlichen Wendung und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „Türen“.
- source_word: ἡσόνων
  choice: von den Geringeren
  rationale: Gibt den überlieferten Komparativ als Bezeichnung niedriger Gestellter oder Schwächerer wieder; die ungewöhnliche Formulierung bleibt erkennbar.
- source_word: ἐξαιρούμενος / ἐξαίρετοι
  choice: retten / errettet
  rationale: Die Wortfamilie bezeichnet hier das Herausreißen beziehungsweise Befreien aus Gefahr; die deutsche Variation dient der natürlichen Syntax.
- source_word: ἃ γὰρ ἐκείνοις ἡτοίμασας
  choice: Denn was du für jene bereitet hast
  rationale: 'Übersetzt den vorgelegten Wortlaut unmittelbar: ἡτοίμασας ist zweite Person Singular, ἐκείνοις Dativ Plural.'
- source_word: ἐκ κακῶν
  choice: aus dem Unheil
  rationale: Bewahrt den umfassenden Sinn von κακά als Übel oder Unheil, ohne ausschließlich moralische Bosheit zu meinen.
theological_decisions:
- issue: Bedeutung von σωτηρία
  choice: Heil
  alternative: Sicherheit
  rationale: „Heil“ erhält die Breite des griechischen Begriffs zwischen Rettung, Bewahrung und Wohlergehen und vermeidet eine vorschnelle Beschränkung.
- issue: Subjekt von ἡτοίμασας im überlieferten Text gegenüber der vermuteten Hiob-Vorlage
  choice: du hast bereitet
  alternative: sie haben bereitet
  rationale: Der eingereichte griechische Text hat eindeutig die zweite Person Singular. Eine stillschweigende Emendation anhand von Hiob 5,5 würde die vorliegende Quellengestalt ersetzen; die textkritische Spannung wird daher in einer Fußnote offengelegt.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit bewusst biblischem Klang. Der seltene und schwierige Ausdruck ἡσόνων wird nicht geglättet. Der Fußnotenmarker [a] ist im Haupttext nachzutragen; die publikationsfertige Fassung lautet an der betreffenden Stelle: „Denn was du für jene bereitet hast[a], werden die Gerechten essen“.'
