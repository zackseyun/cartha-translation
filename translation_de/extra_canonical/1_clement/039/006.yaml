lexical_decisions:
- source_word: ἐνεφύσησεν αὐτοῖς
  choice: Er hauchte sie an
  rationale: Gibt das Verb ἐμφυσάω mit seinem konkreten Bild des Anhau­chens wieder; das Dativpronomen bezeichnet die vom Hauch Betroffenen.
- source_word: ἐτελεύτησαν
  choice: sie starben
  rationale: Im Kontext bezeichnet τελευτάω das Sterben; die schlichte Wiedergabe ist natürlich und präzise.
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  choice: weil ihnen Weisheit fehlte
  rationale: Die Konstruktion bezeichnet hier den Grund ihres Todes. Die deutsche Formulierung bewahrt den Sinn von μὴ ἔχειν σοφίαν, ohne unnötig schwerfällig zu wirken.
