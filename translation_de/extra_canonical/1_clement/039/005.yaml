source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: de
  text: Selbst die Himmel sind vor ihm nicht rein; wie viel weniger die, die in Lehmhäusern wohnen, die selbst – wie auch wir – aus demselben Lehm sind. Er zermalmte sie wie eine Motte, und vom Morgen bis zum Abend sind sie nicht mehr; weil sie sich selbst nicht helfen konnten, gingen sie zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανούς ... οὐχὶ καθαρὴς
  choice: Selbst die Himmel sind ... nicht rein
  rationale: Gibt trotz der offenbar gestörten Kongruenz im überlieferten griechischen Text den klar erkennbaren Sinn natürlich wieder.
- source_word: ἐὰ δὲ
  choice: wie viel weniger
  rationale: Die Formulierung führt hier einen Schluss vom Größeren zum Geringeren ein und entspricht dem Zusammenhang der Hiob-Anspielung.
- source_word: οἰκίας πηλίνας
  choice: Häusern aus Lehm
  rationale: Bewahrt das konkrete Bild vergänglicher menschlicher Körperlichkeit.
- source_word: σητὸς τρόπον
  choice: wie eine Motte
  rationale: Gibt den knappen Vergleich wörtlich und ohne zusätzliche Deutung wieder.
- source_word: παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι
  choice: weil sie sich nicht selbst helfen konnten
  rationale: Drückt den kausalen Sinn der Konstruktion in natürlichem Deutsch aus.
theological_decisions:
- issue: Subjekt von ἔπαισεν („schlug“)
  choice: Er schlug sie
  alternative: Eine Motte schlug sie / Man schlug sie
  rationale: Das im Kontext naheliegende unausgesprochene Subjekt ist Gott; die Übersetzung behält jedoch wie das Griechische lediglich das Pronomen bei und entfaltet dies nicht ausdrücklich.
- issue: Anthropologische Bildsprache des Lehms
  choice: aus demselben Lehm, aus dem auch wir sind
  alternative: aus dem gleichen Lehm, aus dem auch wir gemacht sind
  rationale: „sind“ folgt dem ausdrücklichen ἐσμέν und vermeidet, einen im Relativsatz nicht genannten Schöpfungsakt sprachlich hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die semitisch geprägte Steigerung „wie viel weniger“ und die abrupte Bildsprache „wie eine Motte“ bleiben erhalten; die redundante griechische Lehmformulierung wird behutsam geglättet.
