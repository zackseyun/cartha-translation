review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft den von Hiob 4,18–20 geprägten Gedankengang und gibt die im überlieferten griechischen Text offenbar gestörte bzw. elliptische Steigerung mit „wie viel weniger“ angemessen wieder. Die Wiedergabe der Lehmbildsprache sollte jedoch klarer ausdrücken, dass die Bewohner selbst – ebenso wie „wir“ – aus demselben Lehm sind. Für σητὸς τρόπον ist „wie eine Motte“ als Vergleich zwar formal möglich, im Deutschen aber semantisch unerquicklich; „wie eine Motte“ beim Zermalmen bewahrt das Bild besser.
  naturalness: „aus demselben Lehm, aus dem auch wir sind“ ist im Deutschen unidiomatisch und lässt den Satz abbrechen. Die Umstellung zu einem Relativsatz mit „selbst“ ist natürlich, ohne den Sinn zu verändern. „zermalmte“ ist für das Bild eines vernichtenden Schlages idiomatischer als „schlug“.
  terminology: „Himmel“, „rein“, „Lehmhäuser“ und „zugrunde“ sind modernes, würdiges Standarddeutsch und bewahren die anthropologische Bildsprache ohne zusätzliche dogmatische Auslegung.
  issues:
  - severity: medium
    issue: Unklare und unnatürliche Wiedergabe der Lehmkonstruktion
    rationale: Der Entwurf „aus demselben Lehm, aus dem auch wir sind“ gibt ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν zwar wörtlichkeitsnah wieder, ist aber im Deutschen syntaktisch und bildlich unvollständig. Der griechische Sinn, dass die Bewohner selbst wie wir aus demselben Lehm sind, sollte explizit bleiben.
  - severity: low
    issue: „Er schlug sie wie eine Motte“ ist im Deutschen bildlich schwer verständlich
    rationale: σητὸς τρόπον bezeichnet die Art und Weise des Vernichtens. „zermalmte sie wie eine Motte“ ergibt im Deutschen ein verständliches, ohne Ausdeutung bewahrtes Bild.
  revised_text: Selbst die Himmel sind vor ihm nicht rein; wie viel weniger die, die in Lehmhäusern wohnen, die selbst – wie auch wir – aus demselben Lehm sind. Er zermalmte sie wie eine Motte, und vom Morgen bis zum Abend sind sie nicht mehr; weil sie sich selbst nicht helfen konnten, gingen sie zugrunde.
