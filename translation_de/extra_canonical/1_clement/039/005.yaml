- from: Selbst die Himmel sind vor ihm nicht rein; wie viel weniger die, die in Häusern aus Lehm wohnen, aus demselben Lehm, aus dem auch wir sind. Er schlug sie wie eine Motte, und vom Morgen bis zum Abend sind sie nicht mehr; weil sie sich nicht selbst helfen konnten, gingen sie zugrunde.
  to: Selbst die Himmel sind vor ihm nicht rein; wie viel weniger die, die in Lehmhäusern wohnen, die selbst – wie auch wir – aus demselben Lehm sind. Er zermalmte sie wie eine Motte, und vom Morgen bis zum Abend sind sie nicht mehr; weil sie sich selbst nicht helfen konnten, gingen sie zugrunde.
  rationale: Die Revision beseitigt die unidiomatische deutsche Lehmformulierung und verbessert die Verständlichkeit des Mottenvergleichs. Die im griechischen Wortlaut überlieferte Ellipse bzw. textliche Unebenheit wird nicht durch eine weitergehende Rekonstruktion verdeckt; die traditionelle Steigerung „wie viel weniger“ bleibt erhalten.
