    rationale: εὐχή kann auch „Gelübde“ bedeuten, doch der vorliegende Wortlaut und die englische POB-Audit-Fassung („prayers“) stützen „Gebete“. „Gelübde“ legt eine umstrittene Deutung unnötig fest.
  - severity: low
