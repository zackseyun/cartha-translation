  - severity: low
    issue: „auf Fehler geprüft“ ist für μυωροσκοπηθέν weniger präzise als eine Formulierung mit „Mängeln“.
    rationale: Gemeint ist die Untersuchung einer Opfergabe auf kultisch relevante Makel bzw. Mängel.
