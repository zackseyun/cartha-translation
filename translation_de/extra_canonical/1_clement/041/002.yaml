base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: de
  text: Denn die Opfer für die fortwährende Darbringung, für Gebete sowie für Sünde und Verfehlung werden nicht überall dargebracht, Brüder, sondern allein in Jerusalem. Und selbst dort werden sie nicht an jedem Ort dargebracht, sondern vor dem Tempel am Altar, nachdem die Opfergabe vom Hohen Priester und den bereits erwähnten Dienern auf Mängel untersucht worden ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: die Opfer des regelmäßigen Opfers
  rationale: ἐνδελεχισμός bezeichnet hier im kultischen Zusammenhang die regelmäßig bzw. fortwährend dargebrachte Opfergabe. Die Wiedergabe wahrt die substantivische Opferterminologie, ohne sie vorschnell mit einer einzelnen späteren Fachbezeichnung gleichzusetzen.
- source_word: εὐχῶν
  choice: der Gelübde
  rationale: εὐχή kann „Gebet“ oder „Gelübde“ bedeuten; in einer Aufzählung von Opferarten ist die kultische Bedeutung „Gelübde“ beziehungsweise „Gelübdeopfer“ am wahrscheinlichsten.
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: für Sünde und Verfehlung
  rationale: Die Präposition περὶ wird in der kultischen Formel zweckbezogen wiedergegeben. „Verfehlung“ hält πλημμέλεια von dem allgemeineren ἁμαρτία unterscheidbar.
- source_word: ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον
  choice: vor dem Tempel am Altar
  rationale: Die räumlichen Angaben werden knapp und natürlich wiedergegeben; ναός bezeichnet hier das Heiligtum beziehungsweise den Tempelbau, θυσιαστήριον den Opferaltar.
- source_word: μυωροσκοπηθέν
  choice: auf Fehler geprüft
  rationale: Das seltene kultische Verb bezeichnet die Untersuchung einer Opfergabe auf einen Makel oder Fehler.
- source_word: λειτουργῶν
  choice: Diener
  rationale: Im Kontext sind die für den Opferdienst zuständigen Amtsträger gemeint. „Diener“ vermeidet eine unnötige konfessionelle Festlegung.
theological_decisions:
- issue: Bedeutung von εὐχῶν im Opferkatalog
  choice: Gelübde
  alternative: Gebete
  rationale: Obwohl εὐχή auch „Gebet“ heißen kann, spricht der kultische Opferkatalog stärker für Gelübde beziehungsweise daraus hervorgehende Gelübdeopfer.
- issue: Bezeichnung des jüdischen Kultpersonals
  choice: der Hohe Priester und die bereits erwähnten Diener
  alternative: der Hohepriester und die zuvor genannten Priester
  rationale: Die Formulierung folgt der überlieferten Ergänzung des im bereitgestellten Ausschnitt abgebrochenen Satzes und lässt λειτουργοί allgemein genug, statt eine engere Amtsbezeichnung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Wiederholung von „dargebracht“ bewahrt die rhetorische Parallelität des griechischen Satzes. „Brüder“ gibt die direkte Anrede ἀδελφοί formal wieder.
