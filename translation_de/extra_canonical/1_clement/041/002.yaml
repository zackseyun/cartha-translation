revisions:
- from: Denn die Opfer des regelmäßigen Opfers, der Gelübde sowie für Sünde und Verfehlung werden nicht überall dargebracht, Brüder, sondern allein in Jerusalem. Und selbst dort werden sie nicht an jedem beliebigen Ort dargebracht, sondern vor dem Tempel am Altar, nachdem der Hohe Priester und die bereits erwähnten Diener die Opfergabe auf Fehler geprüft haben.
  to: Denn die Opfer für die fortwährende Darbringung, für Gebete sowie für Sünde und Verfehlung werden nicht überall dargebracht, Brüder, sondern allein in Jerusalem. Und selbst dort werden sie nicht an jedem Ort dargebracht, sondern vor dem Tempel am Altar, nachdem die Opfergabe vom Hohen Priester und den bereits erwähnten Dienern auf Mängel untersucht worden ist.
  rationale: Die Revision ersetzt die zu eng festgelegte Wiedergabe „Gelübde“ durch „Gebete“, im Einklang mit der naheliegenden Grundbedeutung und dem englischen POB-Audit. Sie glättet außerdem die im Deutschen tautologische Formulierung zum fortwährenden Opfer und verdeutlicht, dass die Opfergabe selbst auf kultische Mängel untersucht wird. Die räumliche und institutionelle Terminologie bleibt sachlich und ohne konfessionelle Zuspitzung erhalten.
