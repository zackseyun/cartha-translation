revisions:
- from: Jeder von uns, Brüder und Schwestern,[a] soll Gott in seinem eigenen Rang gefallen, mit gutem Gewissen, ohne die festgesetzte Ordnung seines Dienstes zu überschreiten, und in würdiger Haltung.
  to: Jeder von uns, Brüder, soll Gott in seinem eigenen Rang gefallen, ein gutes Gewissen bewahren und die festgesetzte Regel seines Dienstes nicht überschreiten, in würdiger Haltung.
  rationale: Die Revision stellt die Anrede auf den griechischen Wortlaut zurück, ohne über ihren möglichen gemeinschaftlichen Umfang zu entscheiden. Sie präzisiert κανών als „Regel“ und glättet die deutsche Syntax. „Rang“, „Dienst“ und die weit anschließbare Wendung „in würdiger Haltung“ bewahren die institutionelle und syntaktische Offenheit des griechischen Textes.
  reviewer_model: gpt-5.6-terra
