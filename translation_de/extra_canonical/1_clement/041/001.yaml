source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: de
  text: Jeder von uns, Brüder, soll Gott in seinem eigenen Rang gefallen, ein gutes Gewissen bewahren und die festgesetzte Regel seines Dienstes nicht überschreiten, in würdiger Haltung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die direkte Anrede bezeichnet im gemeinschaftlichen Kontext die Glaubensgeschwister insgesamt; die inklusive deutsche Wiedergabe macht diesen pragmatischen Umfang verständlich.
- source_word: τάγματι
  choice: Rang
  rationale: Bewahrt die Vorstellung einer zugewiesenen Stellung innerhalb einer geordneten Gemeinschaft, ohne bereits eine bestimmte kirchliche Amtsstruktur festzulegen.
- source_word: εὐαρεστείτω
  choice: soll Gott ... gefallen
  rationale: Gibt den Imperativ idiomatisch und mit seinem ethischen Anspruch wieder.
- source_word: κανόνα
  choice: Ordnung
  rationale: Im Zusammenhang bezeichnet das Wort die festgelegte Regel beziehungsweise den abgesteckten Rahmen des Dienstes; „Ordnung“ klingt im Deutschen natürlich und bewahrt den institutionellen Sinn.
- source_word: λειτουργίας
  choice: Dienstes
  rationale: Der Kontext spricht von einem geregelten Dienst; die Übersetzung vermeidet sowohl die Verengung auf Gottesdienst/Liturgie als auch eine unnötig technische Amtsbezeichnung.
- source_word: σεμνότητι
  choice: würdiger Haltung
  rationale: Erfasst die Bedeutung von Ernsthaftigkeit, Ehrbarkeit und Würde als Haltung beziehungsweise Art der Ausübung.
theological_decisions:
- issue: Charakter des τάγμα und der λειτουργία
  choice: „in seinem eigenen Rang“ und „seines Dienstes“
  alternative: „an seinem eigenen Platz“ und „seiner Amtsausübung“
  rationale: Die Formulierung erhält den geordneten, möglicherweise kultisch-amtlichen Hintergrund, legt den Satz aber nicht auf eine bestimmte spätere Ämtertheologie fest.
- issue: Bezug von ἐν σεμνότητι
  choice: als abschließende Bestimmung der gesamten Aufforderung wiedergegeben
  alternative: unmittelbar nur auf das Nichtüberschreiten oder auf den Dienst beziehen
  rationale: Die griechische Endstellung lässt den genauen syntaktischen Bezug offen; die deutsche Fassung bewahrt den weiten Bezug auf das Verhalten im eigenen Rang und Dienst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem geordneten Aufbau des griechischen Textes nahe, wird jedoch durch idiomatische Fügungen wie „mit gutem Gewissen“ und „in würdiger Haltung“ lesbar gehalten.
