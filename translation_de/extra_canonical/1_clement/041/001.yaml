review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird weitgehend getroffen. Allerdings erweitert „Brüder und Schwestern“ die ausdrücklich männlich-plurale Anrede ἀδελφοί; ihr möglicher inklusiver kommunikativer Umfang rechtfertigt keine Ausformulierung im Übersetzungstext. „Ordnung“ ist für κανών möglich, aber „Regel“ gibt den Sinn eines festgelegten normativen Rahmens genauer wieder.
  naturalness: Der Satz ist verständlich und würdig, doch die Reihung „mit gutem Gewissen, ohne …, und in würdiger Haltung“ wirkt elliptisch und etwas ungleichartig. Die explizite Verbfügung macht die deutschen Beziehungen klarer, ohne den knappen Charakter des Originals aufzugeben.
  terminology: „Rang“ für τάγμα und „Dienst“ für λειτουργία sind vertretbar und legen keine bestimmte Amtslehre fest. „Würdiger Haltung“ kann σεμνότης wiedergeben. „Brüder“ soll als direkte Entsprechung von ἀδελφοί stehen bleiben.
  issues:
  - severity: medium
    issue: Die Anrede wird zu „Brüder und Schwestern“ erweitert.
    rationale: ἀδελφοί lautet wörtlich „Brüder“. Zwar kann die Anrede im Gemeindekontext alle Glaubensgeschwister pragmatisch einschließen, doch die ausgeschriebene Doppelanrede ist eine interpretierende Ergänzung. Eine Fußnote beseitigt diese Veränderung im Haupttext nicht.
  - severity: low
    issue: „Ordnung“ für κανόνα ist weniger präzise als „Regel“.
    rationale: κανών bezeichnet hier den festgelegten Maßstab beziehungsweise Rahmen, den man nicht überschreiten darf. „Regel seines Dienstes“ bewahrt diese normative Nuance klarer.
  - severity: low
    issue: Die Aufzählung der Partizipialbestimmungen ist im Deutschen stilistisch uneinheitlich.
    rationale: „ein gutes Gewissen bewahren“ und „nicht überschreiten“ bilden eine natürliche, klar gegliederte Entsprechung zu ὑπάρχων und μὴ παρεκβαίνων; die abschließende Bestimmung „in würdiger Haltung“ bleibt bewusst weit bezogen.
  revised_text: Jeder von uns, Brüder, soll Gott in seinem eigenen Rang gefallen, ein gutes Gewissen bewahren und die festgesetzte Regel seines Dienstes nicht überschreiten, in würdiger Haltung.
