  text: Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: de
  text: Als die Stadt eingeschlossen war, bat die selige Judit die Ältesten um die Erlaubnis, ins Lager der Fremdvölker hinauszugehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδὶθ
  choice: Judit
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: ἡ μακαρία
  choice: die selige
  rationale: Gibt die ehrende Bezeichnung μακαρία knapp und würdig wieder.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: Als die Stadt eingeschlossen war
  rationale: Natürliche Wiedergabe des Genitivus absolutus; der militärische Kontext bleibt klar.
- source_word: ᾐτήσατο παρὰ τῶν πρεσβυτέρων
  choice: bat die Ältesten um die Erlaubnis
  rationale: Idiomatiche deutsche Wiedergabe des Ersuchens an die Ältesten, passend zum folgenden Passiv ἐαθῆναι.
- source_word: παρεμβολὴν
  choice: Lager
  rationale: Im militärischen Zusammenhang bezeichnet das Wort das Heerlager.
- source_word: ἀλλοφύλων
  choice: Fremdvölker
  rationale: Bewahrt den ethnischen Sinn von Angehörigen anderer Völker, ohne die mögliche Identifizierung mit den Philistern in den Text einzutragen.
theological_decisions:
- issue: Referenz von ἀλλόφυλοι
  choice: Fremdvölker
  alternative: Philister
  rationale: Obwohl der Judith-Kontext eine konkretere historische Bezeichnung nahelegen könnte, verwendet der griechische Text den allgemeineren Ausdruck; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem frühchristlichem Erzählton; die Satzstellung hebt wie im Kontext die Notlage der Stadt hervor.
