  text: πολλαὶ γυναῖκες ἐνδυναμωθεῖσαι διὰ τῆς χάριτος τοῦ θεοῦ ἐπετέλεσαν πολλὰ ἀνδρεῖα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/003.yaml
  text: Many women[a], strengthened through the grace of God, accomplished many courageous deeds.
translation:
  language: de
  text: Viele Frauen, die durch die Gnade Gottes gestärkt wurden, vollbrachten viele mutige Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mannhafte Taten“; das griechische Wort bedeutet hier gewöhnlich „mutige“ oder „tapfere Taten“, ist aber etymologisch mit dem Wort für „Mann“ verbunden.'
    reason: Die Fußnote bewahrt die mögliche geschlechtlich markierte bzw. etymologische Nuance von ἀνδρεῖα, ohne „mannhafte“ fälschlich als wörtliche Übersetzung auszugeben.
lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: die … gestärkt wurden
  rationale: Das Partizip bezeichnet, dass die Frauen Kraft bzw. Befähigung empfingen. „Gestärkt wurden“ gibt die Passivform natürlich und ohne unnötige Präzisierung des Handelnden wieder.
- source_word: ἀνδρεῖα
  choice: mutige Taten
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet hier mutige oder tapfere Leistungen. „Mutige Taten“ vermittelt die primäre Bedeutung in natürlichem modernem Deutsch; die etymologische Verbindung mit ἀνήρ („Mann“) wird in der Fußnote kenntlich gemacht.
- source_word: ἐπετέλεσαν
  choice: vollbrachten
  rationale: Das Verb bezeichnet das erfolgreiche Ausführen oder Vollenden. „Vollbrachten“ passt idiomatisch zu außergewöhnlichen mutigen Taten.
theological_decisions:
- issue: Verhältnis von göttlicher Gnade und menschlichem Handeln
  choice: „durch die Gnade Gottes gestärkt … vollbrachten“
  alternative: „von Gottes Gnade befähigt … führten aus“
  rationale: Die Formulierung bewahrt sowohl die göttliche Befähigung als auch das aktive Handeln der Frauen, ohne das Verhältnis zwischen beiden weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, klingt jedoch natürlich; „mutige Taten“ vermeidet im Haupttext die heute missverständliche Wendung „mannhafte Taten“.
