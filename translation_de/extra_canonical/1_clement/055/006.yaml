source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: de
  text: Nicht minder setzte auch Ester, die im Glauben vollkommen war,[a] sich selbst der Gefahr aus, um die zwölf Stämme Israels,[b] die dem Untergang entgegengingen, zu retten. Denn durch Fasten und Selbsterniedrigung[c] flehte sie den allsehenden Herrscher, den Gott der Zeitalter, an. Als er die Demut ihrer Seele sah, rettete er das Volk, um dessentwillen sie sich in Gefahr begeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die gemäß dem Glauben vollkommen war“.'
    reason: Bewahrt die formale Bedeutung und mögliche Nuance von κατὰ πίστιν.
  - marker: b
    text: 'Wörtlich eine kollektive Bezeichnung: „das Zwölfstämmevolk Israels“.'
    reason: Macht die substantivierte Einzahl δωδεκάφυλον sichtbar, während der Haupttext natürliches Deutsch verwendet.
  - marker: c
    text: Gemeint ist eine bewusste Erniedrigung des eigenen Selbst vor Gott; auch „Demütigung“.
    reason: Verhindert das moderne Missverständnis einer bloß unfreiwilligen Beschämung und bewahrt zugleich die Bedeutungsbreite von ταπείνωσις.
lexical_decisions:
- source_word: ἡ τελεία κατὰ πίστιν
  choice: die im Glauben vollkommen war
  rationale: Gibt Esters Charakterisierung in natürlichem Deutsch wieder, ohne κατὰ πίστιν vom Begriff der Vollkommenheit zu lösen; die formalere Alternative wird in einer Fußnote bewahrt.
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  choice: die zwölf Stämme Israels
  rationale: δωδεκάφυλον ist eine substantivierte kollektive Bezeichnung für die Gesamtheit der zwölf Stämme. Diese Wiedergabe ist im Deutschen klarer als das schwerfällige „Zwölfstämmevolk“.
- source_word: τῆς ταπεινώσεως
  choice: Selbsterniedrigung
  rationale: Im Zusammenhang mit Fasten bezeichnet ταπείνωσις eine bewusste Demütigung beziehungsweise Erniedrigung des eigenen Selbst vor Gott, nicht bloß eine von außen zugefügte Beschämung.
- source_word: τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς
  choice: die Demut ihrer Seele
  rationale: Das substantivierte Adjektiv bezeichnet hier ihren demütigen inneren Zustand; „Demut“ ist im Deutschen idiomatisch und bewahrt den Bezug zu ταπείνωσις.
- source_word: τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων
  choice: den allsehenden Herrscher, den Gott der Zeitalter
  rationale: Bewahrt sowohl das Herrschaftsprädikat δεσπότης als auch die zeitlich umfassende, formal offene Wendung θεὸς τῶν αἰώνων.
theological_decisions:
- issue: Art und Maßstab von Esters Vollkommenheit
  choice: die im Glauben vollkommen war
  alternative: die gemäß dem Glauben vollkommen war
  rationale: Die Übersetzung hält die Vollkommenheit ausdrücklich auf den Glauben bezogen und macht daraus keine uneingeschränkte moralische Sündlosigkeit.
- issue: Bezeichnung Israels als δωδεκάφυλον
  choice: die zwölf Stämme Israels
  alternative: das Zwölfstämmevolk Israel
  rationale: Die kollektive Einheit Israels bleibt durch den Zusammenhang und das folgende Singularwort „Volk“ erkennbar; eine bestimmte heilsgeschichtliche Theorie wird nicht eingetragen.
- issue: Bedeutung der Erniedrigung beim Fasten
  choice: Selbsterniedrigung
  alternative: Demütigung
  rationale: Die aktive, freiwillige Hinwendung in Niedrigkeit vor Gott wird ausgedrückt, ohne eine unfreiwillige öffentliche Beschämung zu suggerieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um die lange griechische Periode verständlich wiederzugeben. „Herrscher“ wahrt den feierlichen Klang von δεσπότης; „Gott der Zeitalter“ erhält die offene zeitliche Formel des Griechischen.
