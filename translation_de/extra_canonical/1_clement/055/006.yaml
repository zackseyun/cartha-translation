  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: Esters Glaubensvollkommenheit, ihre Gefährdung zur Rettung Israels, Fasten und freiwillige Erniedrigung sowie Gottes Rettung des Volkes. „Die zwölf Stämme Israels“ ist eine natürliche und sachgerechte Wiedergabe des kollektiven τὸ δωδεκάφυλον τοῦ Ἰσραήλ. Die Fußnoten bewahren die formalere Nuance von κατὰ πίστιν und die Kollektivbildung.'
