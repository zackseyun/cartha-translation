  terminology: „Selbsterniedrigung“ trifft ταπείνωσις im Zusammenhang mit Fasten besser als „Demütigung“, da kein bloß von außen zugefügtes Beschämtwerden gemeint ist. „Demut ihrer Seele“ gibt τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς idiomatisch wieder. „Allsehender Herrscher“ für παντεπότης δεσπότης und „Gott der Zeitalter“ für θεὸς τῶν αἰώνων sind quellentreu und ohne unnötige dogmatische Festlegung.
