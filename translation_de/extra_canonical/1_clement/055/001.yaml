source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: de
  text: 'Um auch Beispiele aus den Völkern anzuführen: Viele Könige und Herrscher haben sich, als eine Zeit der Seuche angebrochen war, auf einen Orakelspruch hin dem Tod ausgeliefert, um durch ihr eigenes Blut ihre Mitbürger zu retten. Viele verließen ihre eigenen Städte, damit sie nicht noch weiter in Bürgerzwist gerieten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείγματα ἐθνῶν
  choice: Beispiele aus den Völkern
  rationale: Gibt den Genitiv natürlich wieder; ἔθνη bezeichnet hier nichtjüdische beziehungsweise nichtchristliche Völker, ohne dass eine konfessionell gefärbte Bezeichnung nötig ist.
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: als eine Seuchenzeit eingetreten war
  rationale: Bewahrt den Bezug von λοιμικός auf eine Seuche und versteht καιρός als eingetretene Krisenlage beziehungsweise Zeit.
- source_word: χρησμοδοτηθέντες
  choice: auf einen Orakelspruch hin
  rationale: Drückt die göttliche Weisung im paganen Orakelkontext idiomatisch aus, ohne ihre Wahrheit zu bestätigen.
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: haben sich … dem Tod ausgeliefert
  rationale: Bewahrt die aktive Selbsthingabe und die starke Formulierung des Griechischen.
- source_word: τοὺς πολίτας
  choice: ihre Mitbürger
  rationale: Entspricht dem politischen Gemeinwesen und klingt im Deutschen natürlicher als das isolierte „die Bürger“.
- source_word: στασιάζωσιν
  choice: der Parteienstreit … weiterging
  rationale: Das Verb bezeichnet inneren politischen oder gesellschaftlichen Zwist; die unpersönliche deutsche Form bewahrt die mögliche Bezugnahme auf fortgesetzte Unruhen in den Städten.
theological_decisions:
- issue: Beispiele heidnischer Selbsthingabe
  choice: Die Handlungen werden als historische Beispiele berichtet, ohne sie ausdrücklich moralisch oder religiös zu bestätigen.
  alternative: Die Orakel oder Selbstopfer ausdrücklich als vorbildlich beziehungsweise göttlich geboten darstellen.
  rationale: Der Satz führt Analogien aus den Völkern an; er bewertet weder die Verlässlichkeit der Orakel noch entfaltet er eine Lehre über Selbstopfer.
- issue: Wirkung des eigenen Blutes
  choice: „damit sie durch ihr eigenes Blut ihre Mitbürger retteten“
  alternative: „in der Überzeugung, dadurch ihre Mitbürger retten zu können“
  rationale: Der finale ἵνα-Satz formuliert unmittelbar die beabsichtigte Rettung. Eine Distanzierungsformel wäre eine nicht im Wortlaut stehende Interpretation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Zweiteilung und die rhetorische Reihe des griechischen Textes bleiben erhalten; altertümliche Wörter wie „Pestilenz“ und unnötig technische Wendungen wurden vermieden.
