revisions:
- from: 'Um auch Beispiele aus den Völkern anzuführen: Viele Könige und Herrscher haben sich, als eine Seuchenzeit eingetreten war, auf einen Orakelspruch hin dem Tod ausgeliefert, damit sie durch ihr eigenes Blut ihre Mitbürger retteten. Viele verließen ihre eigenen Städte, damit der Parteienstreit nicht noch weiterging.'
  to: 'Um auch Beispiele aus den Völkern anzuführen: Viele Könige und Herrscher haben sich, als eine Zeit der Seuche angebrochen war, auf einen Orakelspruch hin dem Tod ausgeliefert, um durch ihr eigenes Blut ihre Mitbürger zu retten. Viele verließen ihre eigenen Städte, damit sie nicht noch weiter in Bürgerzwist gerieten.'
  rationale: Die Übersetzung wird nur dort geändert, wo die deutsche Formulierung den griechischen Bezug oder die moderne Idiomatik beeinträchtigt. Die Orakelweisung bleibt als berichtete Motivierung formuliert; die Rettung durch das eigene Blut wird weder theologisch aufgeladen noch relativiert. Für den umstritten bzw. kontextabhängig zu verstehenden Bezug des letzten Plurals wird eine personale Form gewählt, die die grammatische Pluralform erhält und keine konkrete historische Identifikation erzwingt.
