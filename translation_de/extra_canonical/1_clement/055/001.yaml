review_pass:
  verdict: revise
  source_fidelity: Der erste Satz gibt die Selbsthingabe der Könige und Herrscher sowie den Zweck der Rettung ihrer Mitbürger zutreffend wieder. Im zweiten Satz verschiebt „damit der Parteienstreit nicht noch weiterging“ jedoch das im Griechischen bei στασιάζωσιν mitgedachte personale Subjekt in ein unpersönliches Geschehen. Die Revision bewahrt, dass die Weggehenden selbst nicht weiter in parteilichen Bürgerzwist geraten bzw. ihn betreiben sollten, ohne den genauen historischen Vorgang weiter auszudeuten.
  naturalness: „Seuchenzeit“ ist verständlich, aber weniger idiomatisch als „eine Zeit der Seuche“. Die finale Konstruktion „damit sie ... retteten“ ist nach dem perfektischen Hauptsatz unnötig spannungsreich; „um ... zu retten“ ist im modernen Standarddeutsch klar und natürlich.
  terminology: „Orakelspruch“, „dem Tod ausliefern“, „Mitbürger“ und „Bürgerzwist“ entsprechen dem paganen und politischen Register des griechischen Textes. „Bürgerzwist“ gibt στασιάζωσιν angemessen als innergemeinschaftlichen, parteilichen Konflikt wieder, ohne eine bestimmte moderne Parteiform vorauszusetzen.
  issues:
  - severity: medium
    issue: Subjektverschiebung bei στασιάζωσιν
    rationale: Der Entwurf macht den „Parteienstreit“ zum Subjekt. Das griechische Verb steht hingegen im Plural und nimmt am naheliegendsten die zuvor genannten Personen auf. Eine personale deutsche Form wahrt dies besser.
  - severity: low
    issue: Unidiomatische und zeitlich uneinheitliche Formulierung
    rationale: „als eine Seuchenzeit eingetreten war“ und „damit sie ... retteten“ sind möglich, aber stilistisch weniger glatt. Die Revision macht die Aussage idiomatischer, ohne den Sinn zu verändern.
