source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: de
  text: So gab sie sich selbst der Gefahr preis und ging aus Liebe zu ihrer Heimat und zu dem eingeschlossenen Volk hinaus, und der Herr gab Holofernes in die Hand einer Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: übergab … gab … in die Hand
  rationale: Die wiederholte Verwendung von παραδίδωμι wird im Deutschen soweit natürlich möglich erkennbar gehalten; beim zweiten Vorkommen entspricht die feste Wendung „in die Hand geben“ dem griechischen Ausdruck.
- source_word: ἐξῆλθεν
  choice: zog … hinaus
  rationale: Die Form bezeichnet ihr Hinausgehen aus der belagerten Situation; „hinausziehen“ ist hier natürlich und erzählerisch angemessen.
- source_word: πατρίδος
  choice: Heimat
  rationale: „Heimat“ gibt das Vaterland beziehungsweise Heimatland in diesem Kontext verständlich und würdig wieder.
- source_word: τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ
  choice: dem eingeschlossenen Volk
  rationale: Die Wendung beschreibt das Volk als eingeschlossen beziehungsweise unter Belagerung; „eingeschlossen“ bleibt nahe an der Formulierung des griechischen Textes.
- source_word: ἐν χειρὶ θηλείας
  choice: in die Hand einer Frau
  rationale: Die semitisch geprägte Wendung „in die Hand“ wird bewahrt; θηλείας bezeichnet hier eine weibliche Person und wird im Deutschen natürlich mit „einer Frau“ wiedergegeben.
theological_decisions:
- issue: Bezeichnung des göttlichen Handelnden
  choice: der Herr
  alternative: der Herrgott
  rationale: κύριος steht ohne Zusatz; „der Herr“ bewahrt diese Form und fügt keine nähere Bestimmung ein.
- issue: Verhältnis zwischen Judits Selbstgefährdung und Gottes Handeln
  choice: beide Übergabehandlungen werden sprachlich miteinander verbunden
  alternative: unterschiedliche Verben wie „sich aussetzen“ und „ausliefern“
  rationale: Die Wiederholung desselben griechischen Verbs verknüpft ihre freiwillige Gefährdung mit der göttlichen Übergabe des Holofernes, ohne das theologische Verhältnis weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und die rhetorische Wiederaufnahme von παραδίδωμι bleiben möglichst sichtbar, ohne unnatürliche Wörtlichkeit.
