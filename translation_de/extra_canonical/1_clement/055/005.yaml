    rationale: „Sich selbst der Gefahr übergeben“ ist zwar verständlich, aber im modernen Deutsch nicht idiomatisch. „Sich selbst der Gefahr preisgeben“ gibt die freiwillige Aussetzung gegenüber der Gefahr präzise wieder.
  - severity: low
    issue: „zog ... hinaus“ ist gegenüber ἐξῆλθεν zu spezifisch
    rationale: ἐξῆλθεν bedeutet „ging hinaus“ beziehungsweise „ging hinaus aus“. „Zog hinaus“ kann einen gezielten Aufbruch oder ein Ausziehen nahelegen, der im griechischen Verb nicht ausdrücklich enthalten ist.
