  source_fidelity: Der Sinn wird insgesamt getroffen, einschließlich der doppelten Übergabehandlung und der Wendung „in die Hand einer Frau“. „zog ... hinaus“ ist jedoch gegenüber ἐξῆλθεν unnötig spezifisch; das griechische Verb sagt lediglich aus, dass sie hinausging. Die Formulierung „sich selbst der Gefahr übergeben“ ist im modernen Deutschen weniger idiomatisch als „sich der Gefahr preisgeben“.
  naturalness: „So übergab sie sich selbst der Gefahr“ wirkt im heutigen Standarddeutsch gestelzt. „Gab sich selbst der Gefahr preis“ ist klar und würdig. „Ging ... hinaus“ ist natürlicher und näher am Ausgangstext als „zog ... hinaus“.
  terminology: „Heimat“, „der Herr“, „Holofernes“ und „in die Hand einer Frau“ sind angemessen. „Das eingeschlossene Volk“ bewahrt die offene Formulierung ἐν συγκλεισμῷ, ohne die Belagerung stärker auszudeuten als der Text.
