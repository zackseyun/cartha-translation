  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: de
  text: Wir wissen von vielen unter uns, die sich in Ketten begaben, um andere freizukaufen. Viele verkauften sich als Sklaven und ernährten, nachdem sie den Erlös dafür erhalten hatten, andere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nachdem sie ihre Preise erhalten hatten, speisten sie andere.“ „Den Erlös dafür“ versteht sich aus dem Zusammenhang ihres Selbstverkaufs in die Sklaverei.'
    reason: Die griechische Wendung τὰς τιμὰς αὐτῶν lautet wörtlich „ihre Preise“ und lässt die genaue wirtschaftliche Ausgestaltung unausgesprochen. Die Fußnote dokumentiert die knappe Formulierung und erläutert nur den unmittelbar gegebenen Kontext.
lexical_decisions:
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: die sich in Fesseln auslieferten
  rationale: Gibt die freiwillige Selbsthingabe und das konkrete Bild der Fesseln eng und zugleich idiomatisch wieder.
- source_word: ὅπως ἑτέρους λυτρώσωνται
  choice: um andere freizukaufen
  rationale: λυτρόομαι bezeichnet hier die Befreiung durch Zahlung eines Lösegeldes; „freikaufen“ ist im Deutschen natürlich und wahrt den wirtschaftlichen Hintergrund.
- source_word: παρέδωκαν εἰς δουλείαν
  choice: verkauften sich in die Sklaverei
  rationale: Der Kontext des empfangenen Preises zeigt eine freiwillige Veräußerung der eigenen Person; diese Formulierung macht den Vorgang verständlich, ohne das Motiv zu erweitern.
- source_word: λαβόντες τὰς τιμὰς αὐτῶν
  choice: mit dem Erlös für sich selbst
  rationale: τιμή bedeutet hier den für ihre eigene Person erhaltenen Preis. „Erlös“ passt idiomatisch zum Sichverkaufen; „für sich selbst“ bewahrt die Zuordnung des griechischen αὐτῶν.
- source_word: ἑτέρους ἐψώμισαν
  choice: speisten … andere
  rationale: Das Verb bedeutet, jemanden mit Nahrung zu versorgen. „speisten“ erhält die konkrete Aussage und den würdigen Ton.
theological_decisions:
- issue: Art und Tragweite der Selbsthingabe
  choice: Die beiden Beispiele werden als konkrete Akte freiwilliger Gefangenschaft beziehungsweise Selbstversklavung wiedergegeben.
  alternative: Die Aussagen metaphorisch als allgemeinen selbstlosen Dienst deuten.
  rationale: Der griechische Wortlaut nennt ausdrücklich Fesseln, Loskauf, Sklaverei, Preis und Ernährung. Eine metaphorische Verallgemeinerung würde die historische und ethische Zuspitzung abschwächen.
- issue: Bezug von τὰς τιμὰς αὐτῶν
  choice: Der Preis wird auf die sich selbst Verkaufenden bezogen.
  alternative: „den für sie gezahlten Preis“ oder allgemein „ihren Lohn“.
  rationale: Das Genitivpronomen αὐτῶν ordnet den Preis den betreffenden Personen zu, während der Text nicht ausdrücklich sagt, wer zahlte. Die gewählte Fassung vermeidet diese Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Viele“ und der Wechsel zwischen „andere freikaufen“ und „andere speisen“ bleiben als rhetorische Parallelführung erhalten. Das historische Bild von Fesseln und Sklaverei wird nicht verharmlost.
