  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: de
  text: „Denn“, heißt es, „ein Gerechter wird mich in Barmherzigkeit zurechtweisen und mich tadeln; doch das Öl der Sünder soll mein Haupt nicht salben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παιδεύσει
  choice: soll ... zurechtweisen
  rationale: Das Verb παιδεύω bezeichnet hier erziehende, korrigierende Zucht. „Zurechtweisen“ gibt den Gedanken in natürlichem modernem Deutsch wieder; das Futur in der Psalmform wird als zustimmend-auffordernde Aussage verstanden.
- source_word: δίκαιος
  choice: ein Gerechter
  rationale: Das artikellose Substantiv ist generisch zu verstehen. „Ein Gerechter“ wahrt dies, ohne einen bestimmten göttlichen oder messianischen Titel einzutragen.
- source_word: ἐν ἐλέει
  choice: in Barmherzigkeit
  rationale: Die Präpositionalwendung wird formal bewahrt und bezeichnet die barmherzige Weise der Zurechtweisung.
- source_word: ἐλέγξει
  choice: wird ... tadeln
  rationale: ἐλέγχω bezeichnet das Überführen beziehungsweise den begründeten Tadel; „tadeln“ ist hier knapp und idiomatisch.
- source_word: μὴ λιπανάτω
  choice: soll ... nicht salben
  rationale: Der verneinte Imperativ der dritten Person wird mit „soll nicht“ wiedergegeben. Obwohl λιπαίνω wörtlich auch „fett machen“ heißen kann, fordert die Verbindung mit Öl und Haupt im Deutschen „salben“.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Der Genitiv Plural wird direkt wiedergegeben und lässt offen, ob Besitz, Herkunft oder Zuordnung des Öls im Vordergrund steht.
theological_decisions:
- issue: Identität von δίκαιος
  choice: ein Gerechter
  alternative: der Gerechte
  rationale: Der fehlende griechische Artikel und der Zusammenhang gegenseitiger Zurechtweisung sprechen für eine generische Person. Die Übersetzung vermeidet daher eine unbegründete Identifizierung mit Gott oder einer bestimmten messianischen Gestalt.
- issue: Modalität der beiden Futurformen
  choice: „soll ... zurechtweisen“ und „wird ... tadeln“
  alternative: „wird ... zurechtweisen und ... tadeln“
  rationale: Die Psalmform kann als erwartende Aussage oder als bereitwillige Zustimmung zu gerechter Korrektur gelesen werden. Die gemischte deutsche Wiedergabe bildet den voluntativen Zug von παιδεύσει ab, ohne die grammatische Zukunftsaussage bei ἐλέγξει ganz einzuebnen.
translation_notes:
  register: Moderne, würdige Standardsprache mit engem Anschluss an den griechischen Satzbau. „Ein Gerechter“ ist gewöhnlichen Lesern verständlich und bewahrt den generischen Sinn; die poetische Antithese zwischen barmherziger Zurechtweisung und dem Öl der Sünder bleibt erhalten.
