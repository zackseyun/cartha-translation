  text: εἶτα γνώσῃ, ὅτι εἰρηνεύσει σου ὁ οἶκος, ἡ δὲ δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: de
  text: Dann wirst du erkennen, dass in deinem Haus Frieden herrschen wird und bei deiner Zeltwohnung gewiss nichts fehlen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und ungewöhnlicher lautet der griechische Text: „und die Wohnstätte deines Zeltes wird gewiss nicht fehlgehen“. Im Zusammenhang mit Ijob 5,24 ist gemeint: „Wenn du nach deiner Wohnstätte siehst, wirst du nichts vermissen.“'
    reason: Die Anmerkung dokumentiert die auffällige griechische Satzgestalt und erläutert ihren kontextuellen Sinn, ohne die im Haupttext erforderliche idiomatische deutsche Wiedergabe zu belasten.
lexical_decisions:
- source_word: εἰρηνεύσει
  choice: wird in Frieden leben
  rationale: Gibt das Verb εἰρηνεύω als Zustand des Friedens natürlich wieder, ohne es auf bloße äußere Ruhe zu verengen.
- source_word: δίαιτα τῆς σκηνῆς σου
  choice: mit deiner Zeltwohnung
  rationale: δίαιτα bezeichnet hier im räumlichen Parallelismus zu οἶκος die Wohnstätte bzw. Behausung; „Zeltwohnung“ bewahrt zugleich den Bezug zu σκηνή.
- source_word: οὐ μὴ ἁμάρτῃ
  choice: gewiss nichts schiefgehen wird
  rationale: Die verstärkte Verneinung οὐ μή wird mit „gewiss“ ausgedrückt. ἁμαρτάνω bedeutet grundsätzlich verfehlen oder fehlgehen; die idiomatische Wendung lässt die ungewöhnliche Aussage über die Wohnstätte verständlich werden.
theological_decisions:
- issue: Mehrdeutigkeit der zweiten Satzhälfte
  choice: Die griechische Satzgestalt wird im Haupttext als Aussage über die Zeltwohnung wiedergegeben.
  alternative: „und wenn du nach deiner Wohnstätte siehst, wirst du nichts vermissen“
  rationale: Die Alternative entspricht dem Sinn des hebräischen Hintergrunds von Ijob 5,24 und erklärt traditionelle kontextuelle Übersetzungen, setzt im vorliegenden griechischen Wortlaut jedoch ein nicht ausdrücklich vorhandenes menschliches Subjekt und eine Tätigkeit des Nachsehens voraus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeltwohnung“ hält den räumlichen Parallelismus mit „Haus“ fest; die idiomatische Formulierung „nichts schiefgehen“ vermeidet eine im Deutschen kaum verständliche Personifikation, während die Fußnote den wörtlicheren griechischen Ausdruck dokumentiert.
