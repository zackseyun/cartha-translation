  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: de
  text: 'Sechsmal wird er dich aus Bedrängnissen retten,

    und beim siebten Mal wird dich kein Unheil treffen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑξάκις
  choice: sechsmal
  rationale: Gibt die zahlenmäßige Wiederholung knapp und direkt wieder.
- source_word: ἐξ ἀναγκῶν
  choice: aus Bedrängnissen
  rationale: ἀνάγκη bezeichnet hier bedrängende Notlagen oder Zwänge; der Plural „Bedrängnisse“ bewahrt den Umfang des griechischen Ausdrucks.
- source_word: ἐξελεῖταί σε
  choice: wird er dich … retten
  rationale: Das Futur von ἐξαιρέω bezeichnet die Befreiung oder Rettung aus einer Notlage.
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: und beim siebten Mal
  rationale: Die substantivierte Ordnungszahl bezieht sich sinngemäß auf einen siebten Notfall; „Mal“ ergibt im Deutschen eine natürliche, ohne zusätzliche Deutung auskommende Formulierung.
- source_word: οὐχ ἅψεταί σου κακόν
  choice: wird dich kein Unheil treffen
  rationale: Wörtlich heißt es, dass kein Übel den Angesprochenen berühren wird; „treffen“ ist im Deutschen die natürliche bildhafte Entsprechung und bewahrt den Sinn.
theological_decisions:
- issue: Sprecher bzw. handelndes Subjekt von ἐξελεῖται
  choice: Pronomen „er“ ohne nähere Identifizierung beibehalten
  alternative: „Gott“ ausdrücklich einsetzen
  rationale: Der griechische Satz nennt das Subjekt nur implizit im Verb. Eine ausdrückliche Benennung Gottes würde die im vorliegenden Wortlaut bestehende Referenz ergänzen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache; der zweigliedrige poetische Parallelismus und die direkte Anrede im Singular bleiben erhalten.
