    issue: „Garbenhaufen von der Tenne“ verengt θημωνιὰ ἅλωνος unnötig.
    rationale: Der griechische Ausdruck bezeichnet einen Haufen bzw. Stapel von Erntegut/Getreide im Kontext der Tenne. „Garbenhaufen“ legt speziell Garben nahe, während die Tenne gerade den Ort des Dreschens und der Verarbeitung bezeichnet. „Getreidehaufen“ wahrt das Bild ohne diese sachliche Einengung.
  revised_text: Und du wirst ins Grab kommen wie reifes Getreide, das zu seiner Zeit geerntet wird, oder wie ein Getreidehaufen, der zur rechten Zeit von der Tenne eingebracht wird.
