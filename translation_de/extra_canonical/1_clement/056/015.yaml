  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: de
  text: Und du wirst ins Grab kommen wie reifes Getreide, das zu seiner Zeit geerntet wird, oder wie ein Getreidehaufen, der zur rechten Zeit von der Tenne eingebracht wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ
  choice: du wirst … kommen
  rationale: Gibt das Futur des Verbs ἔρχομαι direkt und natürlich wieder.
- source_word: τάφῳ
  choice: ins Grab
  rationale: Der Dativ steht hier nach der Bewegungsangabe idiomatisch für das Ziel; im Deutschen ist „ins Grab kommen“ die natürliche Entsprechung.
- source_word: σῖτος ὥριμος
  choice: reifes Getreide
  rationale: σῖτος kann Korn oder Getreide bezeichnen; „reifes Getreide“ bewahrt das landwirtschaftliche Bild ohne unnötige Verengung.
- source_word: κατὰ καιρὸν θεριζόμενος
  choice: das zu seiner Zeit geerntet wird
  rationale: Bewahrt sowohl den Gedanken des angemessenen Zeitpunkts als auch das passive Partizip.
- source_word: θημωνιὰ ἅλωνος
  choice: ein Garbenhaufen von der Tenne
  rationale: θημωνιά bezeichnet einen aufgehäuften Erntebestand, wahrscheinlich Garben; „Garbenhaufen“ macht das Bild verständlich, während „von der Tenne“ ἅλωνος wiedergibt.
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: der zur rechten Zeit eingebracht wird
  rationale: συγκομίζω bezeichnet hier das Einsammeln bzw. Einbringen der Ernte; „zur rechten Zeit“ gibt den passenden, bestimmten Zeitpunkt idiomatisch wieder.
theological_decisions:
- issue: Bild des zeitgerechten Todes
  choice: Die beiden landwirtschaftlichen Vergleiche bleiben ohne ausdeutenden Zusatz stehen.
  alternative: Das Bild ausdrücklich als friedlichen oder von Gott bestimmten Tod erklären.
  rationale: Der griechische Text zeichnet den Tod als zeitgerechtes Einbringen der Ernte, legt aber keine weitergehende dogmatische Deutung ausdrücklich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die beiden Erntebilder des griechischen Textes werden bewahrt; eine Fußnote ist nicht erforderlich.
