  text: Er schlug, und seine Hände heilten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν
  choice: Er schlug
  rationale: Der Aorist von παίω bezeichnet hier das Schlagen; das Präteritum wahrt die Zeitform und den knappen Aussagecharakter.
- source_word: αἱ χεῖρες αὐτοῦ ἰάσαντο
  choice: seine Hände brachten Heilung
  rationale: Die Hände bleiben wie im Griechischen das Subjekt. Die Formulierung gibt die heilende Wirkung wieder, ohne ein im Ausgangstext nicht genanntes Objekt einzufügen oder den missverständlichen Eindruck zu erwecken, die Hände selbst seien gesund geworden.
theological_decisions:
- issue: Das Verhältnis zwischen Schlagen und Heilen
  choice: Die Spannung zwischen beiden Handlungen bleibt unaufgelöst stehen.
  alternative: „Er schlug, doch seine Hände heilten ihn.“
  rationale: καί bedeutet schlicht „und“, und ein Objekt zu ἰάσαντο wird nicht ausdrücklich genannt. Daher werden weder ein Gegensatz noch ein bestimmter Geheilter ergänzt.
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch; die bildhafte Rede von den Händen als Trägern der Heilung bleibt erhalten.
