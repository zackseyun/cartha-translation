  text: ἀδίκων καὶ ἀνόμων καταγελάσῃ, ἀπὸ δὲ θηρίων ἀγρίων οὐ μὴ φοβηθῇς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/011.yaml
  text: 'You will laugh at the unrighteous and lawless,

    and you will certainly not fear wild beasts,'
translation:
  language: de
  text: 'Über Ungerechte und Gesetzlose wirst du lachen,

    und vor wilden Tieren wirst du dich gewiss nicht fürchten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδίκων
  choice: Ungerechte
  rationale: Gibt die substantivisch gebrauchte Bezeichnung für Menschen wieder, die Unrecht tun beziehungsweise ungerecht sind.
- source_word: ἀνόμων
  choice: Gesetzlose
  rationale: Bewahrt den eigenständigen Sinn von Menschen, die ohne Gesetz beziehungsweise gegen das Gesetz handeln, ohne ihn mit ἀδίκων zu verschmelzen.
- source_word: καταγελάσῃ
  choice: wirst du lachen
  rationale: Entspricht dem Futur und wahrt die knappe Bildsprache; der Genitiv der verspotteten Personen wird im Deutschen idiomatisch mit „über“ wiedergegeben.
- source_word: θηρίων ἀγρίων
  choice: wilden Tieren
  rationale: Natürliche deutsche Wiedergabe der Verbindung aus „Tieren/Bestien“ und „wild“.
- source_word: οὐ μὴ φοβηθῇς
  choice: wirst du dich gewiss nicht fürchten
  rationale: Die verstärkte griechische Verneinung οὐ μή wird durch „gewiss nicht“ ausgedrückt; das deutsche reflexive Verb ist idiomatisch.
theological_decisions:
- issue: Reichweite der Verheißung in οὐ μή
  choice: 'Als nachdrückliche Zukunftsaussage wiedergegeben: „wirst du dich gewiss nicht fürchten“'
  alternative: 'Als Verbot oder Aufforderung: „Fürchte dich keinesfalls“'
  rationale: Die Form steht hier im Zusammenhang als Zusage; zugleich bleibt die starke Negation des Griechischen hörbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. Keine Fußnoten erforderlich; die verstärkte Verneinung wird direkt im Text sichtbar gemacht.
