    issue: ὑπερασπισμός mit „Schutz“ wiedergegeben
    rationale: Das griechische Substantiv bezeichnet vorrangig Beistand oder Verteidigung. „Schutz“ ist zwar semantisch verwandt, schwächt aber die konkrete Vorstellung helfenden, verteidigenden Beistands und weicht von der englischen Audit-Fassung „defense“ ab.
