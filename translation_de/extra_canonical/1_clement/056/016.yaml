  text: βλέπετε, ἀγαπητοί, πόσος ὑπερασπισμός ἐστιν τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου· πατὴρ γὰρ ἀγαθὸς ὢν παιδεύει εἰς τὸ ἐλεηθῆναι ἡμᾶς διὰ τῆς ὁσίας παιδείας αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: de
  text: Seht, ihr Geliebten, wie groß doch der Beistand für die ist, die vom Herrn erzogen werden! Denn als guter Vater erzieht er uns, damit wir durch seine heilige Erziehung Erbarmen erfahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερασπισμός
  choice: Schutz
  rationale: Das Wort bezeichnet Verteidigung, Beistand oder den daraus erwachsenden Schutz. „Schutz“ gibt den Sinn im Deutschen natürlich wieder, ohne das unidiomatische Bild einer „Verteidigung für jemanden“ zu erzwingen.
- source_word: παιδεύω / παιδεία
  choice: erziehen / Erziehung
  rationale: Die Wortfamilie umfasst Erziehung, Unterweisung und korrigierende Disziplin. Die Wiederholung derselben deutschen Wortfamilie bewahrt den Zusammenhang des griechischen Textes; „züchtigen“ wäre enger und unnötig strafbetont.
- source_word: δεσπότης
  choice: Herr
  rationale: „Herr“ ist in diesem religiösen Zusammenhang die natürliche und würdevolle Wiedergabe; das griechische Wort betont dabei die Autorität des Herrn bzw. Gebieters.
- source_word: ἐλεηθῆναι
  choice: Erbarmen erfahren
  rationale: 'Die passive Form wird bewahrt: Erbarmen wird den Betroffenen zuteil, statt als eigene Leistung dargestellt zu werden.'
theological_decisions:
- issue: Zweck der göttlichen Erziehung
  choice: „damit wir … Erbarmen erfahren“
  alternative: „sodass wir … Erbarmen erfahren“
  rationale: εἰς τὸ mit Infinitiv bezeichnet hier am naheliegendsten das Ziel der väterlichen Erziehung. Die Formulierung wahrt zugleich die Spannung, dass die Erziehung selbst zum Erbarmen hinführt.
- issue: Gottesbezeichnung als Vater und Herr
  choice: Beide Bezeichnungen werden unverändert nebeneinandergestellt.
  alternative: Die Bezeichnungen harmonisierend vereinheitlichen.
  rationale: Der Text verbindet die Autorität des Herrn mit der Güte des Vaters; diese theologische Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Anredecharakter und die auffordernde Form von βλέπετε bleiben mit „Seht, ihr Geliebten“ erhalten. Die wiederholte Wortfamilie „erziehen/Erziehung“ bildet die griechische Wiederholung transparent ab.
