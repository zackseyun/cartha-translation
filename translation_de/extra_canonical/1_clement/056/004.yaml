  text: ὃν γὰρ ἀγαπᾷ κύριος, παιδεύει, μαστιγοῖ δὲ πάντα υἱόν, ὃν παραδέχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: de
  text: '„Denn wen der Herr liebt, den erzieht er,


    und jeden Sohn, den er annimmt, geißelt er.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεύει
  choice: weist er zurecht
  rationale: Das Verb bezeichnet erziehende Zurechtweisung oder Disziplinierung. „Zurechtweisen“ ist im heutigen Deutsch verständlich und bewahrt hier den erzieherischen Sinn.
- source_word: μαστιγοῖ
  choice: züchtigt
  rationale: Wörtlich bezeichnet das Verb das Geißeln. Im parallelen Weisheitsspruch ist eine schmerzhafte erzieherische Maßnahme gemeint; „züchtigt“ bewahrt die Härte des Ausdrucks, ohne unnötig eine konkrete Vollzugsform festzulegen.
- source_word: παραδέχεται
  choice: annimmt
  rationale: Das Verb bedeutet hier jemanden als zugehörig aufzunehmen beziehungsweise anzuerkennen. „Annimmt“ gibt diese Beziehung natürlich und knapp wieder.
theological_decisions:
- issue: Göttliche Liebe und schmerzhafte Zurechtweisung
  choice: Die Spannung zwischen Liebe, Zurechtweisung und Züchtigung bleibt ausdrücklich bestehen.
  alternative: Die Aussage durch mildere Begriffe wie „erzieht“ oder „korrigiert“ abschwächen.
  rationale: Der griechische Parallelismus verbindet die Liebe des Herrn bewusst mit παιδεύει und dem starken μαστιγοῖ; diese theologische Spannung darf nicht aufgelöst werden.
- issue: υἱόν als Beziehungsbegriff
  choice: „Sohn“
  alternative: „Kind“
  rationale: Der Ausgangstext verwendet ausdrücklich den maskulinen Singular υἱόν und greift damit die traditionelle Vater-Sohn-Bildsprache auf. Diese wird bewahrt, ohne sie verallgemeinernd umzudeuten.
translation_notes:
  register: Digniger, gut verständlicher moderner Bibelstil. Die zweizeilige poetische Form und der Parallelismus des griechischen Zitats werden beibehalten.
