source:
  edition: Funk 1901 (normalized OCR)
  text: γνώσῃ δέ, ὅτι πολὺ τὸ σπέρμα σου, τὰ δὲ τέκνα σου ὥσπερ τὸ παμβότανον τοῦ ἀγροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/014.yaml
  text: 'And you will know that your offspring will be many,

    and your children like the abundant grass of the field[a].'
translation:
  language: de
  text: Und du wirst erkennen, dass deine Nachkommen zahlreich sein werden und dass deine Kinder wie das üppige Grün des Feldes sein werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wie alles Kraut des Feldes«; auch: »wie alle Pflanzen des Feldes«.'
    reason: παμβότανον ist ein kollektiver Ausdruck für die gesamte Feldvegetation; die Fußnote bietet eine engere formale Alternative zur natürlichen Haupttextwiedergabe.
lexical_decisions:
- source_word: γνώσῃ
  choice: du wirst erkennen
  rationale: Gibt das futurische Medium von γινώσκω natürlich und bedeutungsnah wieder.
- source_word: πολὺ τὸ σπέρμα σου
  choice: deine Nachkommen zahlreich sein werden
  rationale: σπέρμα bezeichnet hier kollektiv die Nachkommenschaft; »zahlreich« bewahrt den quantitativen Sinn von πολύ und vermeidet die im Deutschen missverständliche wörtliche Formulierung »viel Same«.
- source_word: τὸ παμβότανον τοῦ ἀγροῦ
  choice: das üppige Grün des Feldes
  rationale: παμβότανον bezeichnet die reiche, vielfältige Pflanzen- bzw. Krautvegetation. »Üppiges Grün« ist im Deutschen natürlich und erhält das Bild der Fülle.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Parallelismus zwischen »Nachkommen« und »Kinder« bleibt erhalten; die seltene Bildsprache des griechischen Textes wird im Haupttext natürlich wiedergegeben und in der Fußnote formaler erschlossen.
