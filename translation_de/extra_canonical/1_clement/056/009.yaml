source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: de
  text: 'In der Hungersnot wird er dich vor dem Tod retten,

    und im Krieg wird er dich aus der Gewalt des Schwertes befreien.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus der Hand des Eisens«; »Eisen« steht hier für die Waffe beziehungsweise das Schwert.'
    reason: Die Fußnote dokumentiert die markante griechische Bildsprache, während der Haupttext ihre idiomatische Bedeutung wiedergibt.
lexical_decisions:
- source_word: ἐν λιμῷ
  choice: In der Hungersnot
  rationale: Das Substantiv λιμός bezeichnet Hunger beziehungsweise eine Hungersnot; im Zusammenhang einer lebensbedrohlichen Notlage ist „Hungersnot“ die natürliche und präzise Wiedergabe.
- source_word: ῥύσεταί σε ἐκ θανάτου
  choice: wird er dich vor dem Tod retten
  rationale: ῥύομαι bezeichnet das Retten oder Befreien aus einer Gefahr. Im Deutschen ist bei „Tod“ die idiomatische Verbindung „vor dem Tod retten“ angemessen.
- source_word: ἐν πολέμῳ
  choice: im Krieg
  rationale: Gibt die schlichte lokale beziehungsweise situative Wendung direkt wieder.
- source_word: ἐκ χειρὸς σιδήρου
  choice: aus der Gewalt des Schwertes
  rationale: Wörtlich steht „aus der Hand des Eisens“. χείρ kann in diesem semitisch geprägten Ausdruck Macht oder Gewalt bezeichnen, während σίδηρος („Eisen“) metonymisch für die eiserne Waffe beziehungsweise das Schwert steht. Die gewählte Form bewahrt das Bild, ohne im Deutschen eine missverständliche Mischmetapher zu erzeugen.
- source_word: λύσει σε
  choice: wird er dich … befreien
  rationale: λύω bedeutet hier aus einer tödlichen Bedrohung lösen beziehungsweise befreien; „befreien“ unterscheidet die Formulierung passend vom vorangehenden „retten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. Die poetische Zweizeiligkeit und der Wechsel zwischen „retten“ und „befreien“ bleiben erhalten.
