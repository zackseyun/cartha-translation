  text: καὶ ἀπὸ μάστιγος γλώσσης σε κρύψει, καὶ οὐ μὴ φοβηθήσῃ κακῶν ἐπερχομένων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: de
  text: Und er wird dich vor der Geißel der Zunge verbergen, und du wirst dich gewiss nicht vor herannahenden Übeln fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάστιγος γλώσσης
  choice: Geißel der Zunge
  rationale: Bewahrt das markante Bild und die Genitivverbindung des griechischen Textes; gemeint ist durch die Zunge verursachtes Unheil, ohne dieses im Haupttext auszudeuten.
- source_word: κρύψει
  choice: wird … verbergen
  rationale: Gibt das Futur und das Schutzmotiv direkt wieder; „bergen“ wäre ebenfalls möglich, ist hier aber weniger transparent.
- source_word: κακῶν ἐπερχομένων
  choice: hereinbrechendem Unheil
  rationale: Das substantivierte κακά wird idiomatisch kollektiv als „Unheil“ wiedergegeben; das präsentische Partizip ἐπερχομένων bezeichnet drohendes beziehungsweise eintretendes Unheil.
- source_word: οὐ μὴ φοβηθήσῃ
  choice: du wirst dich gewiss nicht … fürchten
  rationale: Die nachdrückliche Verneinung οὐ μή wird mit „gewiss nicht“ kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Natürliche, würdevolle Standardsprache mit enger Wahrung der poetischen Bildlichkeit und des einleitenden καί („Und“).
