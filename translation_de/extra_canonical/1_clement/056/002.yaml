id: 1CLEM.56.2
reference: 1 Clement 56:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: de
  text: Lasst uns die Erziehung annehmen, über die niemand ungehalten sein sollte, Geliebte. Die Ermahnung, die wir einander geben, ist gut und überaus nützlich; denn sie verbindet uns mit dem Willen Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείαν
  choice: Erziehung
  rationale: Das Wort bezeichnet formende Unterweisung oder Zucht. „Erziehung“ bewahrt die positive, charakterbildende Bedeutung im Zusammenhang, ohne sie auf Strafe zu verengen.
- source_word: ἀγανακτεῖν
  choice: ungehalten sein
  rationale: Gibt den Sinn von Verärgerung oder Entrüstung in natürlichem, würdigem Deutsch wieder.
- source_word: νουθέτησις
  choice: Ermahnung
  rationale: Bezeichnet zurechtweisende, zum richtigen Verhalten anleitende Unterweisung; „Ermahnung“ ist hier idiomatisch und sachlich passend.
- source_word: κολλᾷ
  choice: verbindet
  rationale: Das Verb bedeutet wörtlich „anheften“ oder „eng verbinden“. „Verbindet“ klingt natürlich und erhält die Aussage einer engen Bindung.
theological_decisions:
- issue: Art der παιδεία
  choice: Erziehung
  alternative: Zucht; Unterweisung
  rationale: „Erziehung“ lässt sowohl Unterweisung als auch korrigierende Formung anklingen und vermeidet eine unnötige Verengung auf Strafmaßnahmen.
- issue: Beziehung zum Willen Gottes in κολλᾷ
  choice: verbindet uns mit dem Willen Gottes
  alternative: lässt uns am Willen Gottes festhalten
  rationale: Die direkte Metapher bezeichnet eine enge Verbindung. Die Übersetzung wahrt diese Relation, ohne genauer festzulegen, ob vor allem Zugehörigkeit, Übereinstimmung oder beharrliches Festhalten gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gemeinschaftlich ermahnendem Ton. Die Anrede „Geliebte“ bewahrt den frühchristlichen Briefstil; der Satzbau folgt dem griechischen Gedankengang, bleibt aber gut verständlich.
