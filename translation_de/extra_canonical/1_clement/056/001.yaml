revisions:
- from: Darum wollen auch wir für diejenigen eintreten, die sich in irgendeiner Verfehlung befinden, damit ihnen Milde und Demut geschenkt werden und sie sich nicht uns, sondern dem Willen Gottes fügen. Denn so wird das von Erbarmen getragene Gedenken an sie vor Gott und den Heiligen fruchtbar und vollkommen sein.[a]
  to: Darum lasst auch uns Fürbitte einlegen für diejenigen, die sich in irgendeiner Verfehlung befinden, damit ihnen Milde und Demut geschenkt werden, damit sie sich nicht uns, sondern dem Willen Gottes fügen. Denn so wird ihr von Erbarmen begleitetes Gedenken gegenüber Gott und den Heiligen fruchtbar und vollkommen sein.[a]
  rationale: Die Revision macht die Fürbitte im ersten Satz explizit und bewahrt im Schlusssatz die griechische Ambiguität. Insbesondere vermeidet sie, αὐτοῖς zwingend zum Gegenstand eines Gedenkens („an sie“) zu machen, und gibt πρὸς mit der semantisch zurückhaltenderen Beziehung „gegenüber“ wieder. Der Marker bleibt unmittelbar beim betroffenen Satz.
  reviewer_model: gpt-5.6-terra
