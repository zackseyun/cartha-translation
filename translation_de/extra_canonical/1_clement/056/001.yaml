id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: de
  text: Darum lasst auch uns Fürbitte einlegen für diejenigen, die sich in irgendeiner Verfehlung befinden, damit ihnen Milde und Demut geschenkt werden, damit sie sich nicht uns, sondern dem Willen Gottes fügen. Denn so wird ihr von Erbarmen begleitetes Gedenken gegenüber Gott und den Heiligen fruchtbar und vollkommen sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit anderer Zuordnung des griechischen Dativs αὐτοῖς: „Denn so wird das ihnen zugutekommende, von Erbarmen begleitete Gedenken gegenüber Gott und den Heiligen fruchtbar und vollkommen sein.“'
    reason: Die Beziehung von αὐτοῖς zu μνεία ist in der gedrängten griechischen Formulierung nicht eindeutig. Die Fußnote bewahrt diese syntaktische Unschärfe, ohne „an sie“ als alleinige Deutung festzulegen.
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: wollen … eintreten
  rationale: ἐντυγχάνω bezeichnet hier das Fürbitten beziehungsweise Eintreten für andere; die inklusive Aufforderung des Konjunktivs wird mit „wollen auch wir“ natürlich wiedergegeben.
- source_word: ἐν τινι παραπτώματι ὑπαρχόντων
  choice: die sich in irgendeiner Verfehlung befinden
  rationale: ὑπάρχω bezeichnet schlicht das Sichbefinden in einem Zustand. Die Übersetzung vermeidet den nicht vorhandenen Gedanken, bei einer Verfehlung ertappt oder von ihr überwältigt worden zu sein.
- source_word: ἐπιείκεια
  choice: Milde
  rationale: Das Wort bezeichnet hier eine nachsichtige, sanfte Haltung. „Milde“ ist würdig und verständlich, ohne den Begriff auf bloße Freundlichkeit zu verengen.
- source_word: εἶξαι
  choice: sich … fügen
  rationale: Das Verb bedeutet nachgeben oder weichen. In Verbindung mit Gottes Willen ist „sich dem Willen Gottes fügen“ im Deutschen idiomatisch und erhält den Gegensatz zu einem Nachgeben gegenüber Menschen.
- source_word: ἔγκαρπος καὶ τελεία
  choice: fruchtbar und vollkommen
  rationale: Die beiden Prädikatsadjektive werden eng und in ihrer theologischen Offenheit wiedergegeben; τελεία kann Vollständigkeit wie Vollkommenheit bezeichnen.
- source_word: οἱ ἅγιοι
  choice: die Heiligen
  rationale: Die substantivierte Bezeichnung bleibt bewusst offen und wird nicht näher als Christen, Verstorbene oder Engel bestimmt.
theological_decisions:
- issue: Wem die Fehlenden sich fügen sollen
  choice: „nicht uns, sondern dem Willen Gottes“
  alternative: „nicht unserem, sondern Gottes Willen“
  rationale: Der griechische Gegensatz stellt ausdrücklich „uns“ dem „Willen Gottes“ gegenüber. Die formal ungewöhnliche Spannung wird bewahrt und nicht zu einem Gegensatz zweier Willensäußerungen umgedeutet.
- issue: Bezug des erbarmenden Gedenkens
  choice: „das von Erbarmen getragene Gedenken an sie vor Gott und den Heiligen“
  alternative: „ihr von Erbarmen getragenes Gedenken vor Gott und den Heiligen“
  rationale: 'Die griechische Wortstellung verbindet μετ’ οἰκτιρμῶν am ehesten mit μνεία. Das Dativpronomen αὐτοῖς wird als Dativ des Vorteils verstanden: Es geht um ein ihnen zugutekommendes Gedenken. Wegen der gedrängten Syntax wird die Alternative in einer Fußnote offengehalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gemeinschaftliche Ermahnung klingt einladend statt amtlich; „Verfehlung“, „Milde“, „Demut“ und „sich fügen“ sind allgemein verständlich und zugleich dem frühchristlichen Mahnregister angemessen. Der Fußnotenmarker [a] steht unmittelbar nach dem betreffenden Satz.
