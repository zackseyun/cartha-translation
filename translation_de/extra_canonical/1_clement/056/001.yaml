  revision_rationale: Die Revision macht die Fürbitte im ersten Satz explizit und bewahrt im Schlusssatz die griechische Ambiguität. Insbesondere vermeidet sie, αὐτοῖς zwingend zum Gegenstand eines Gedenkens („an sie“) zu machen, und gibt πρὸς mit der semantisch zurückhaltenderen Beziehung „gegenüber“ wieder. Der Marker bleibt unmittelbar beim betroffenen Satz.
