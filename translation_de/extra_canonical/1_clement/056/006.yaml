reference: 1 Clement 56:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: de
  text: 'Und wiederum heißt es:


    „Glücklich ist der Mensch, den der Herr zurechtweist;[a]

    die Mahnung des Allmächtigen aber weise nicht zurück.

    Denn er verursacht Schmerz und stellt wieder her;“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den der Herr zurechtgewiesen hat“; das griechische Verb steht im Aorist, kann hier aber eine allgemeine Wahrheit ausdrücken.'
    reason: Bewahrt die grammatische Mehrdeutigkeit zwischen einer formnahen Vergangenheitswiedergabe und dem wahrscheinlich gnomischen Gebrauch.
lexical_decisions:
- source_word: Μακάριος
  choice: Glücklich ist
  rationale: Gibt die Seligpreisungsformel in natürlichem, allgemein verständlichem Deutsch wieder, ohne ihren feierlichen Charakter zu verlieren.
- source_word: ἤλεγξεν
  choice: zurechtweist
  rationale: Der griechische Aorist formuliert im Zusammenhang wahrscheinlich eine allgemeine Wahrheit und wird daher idiomatisch im Präsens wiedergegeben; die formale Vergangenheitsbedeutung bleibt in einer Fußnote sichtbar.
- source_word: νουθέτημα
  choice: Mahnung
  rationale: Bezeichnet eine zurechtbringende Unterweisung oder Ermahnung; „Mahnung“ ist knapp und entspricht dem Zusammenhang göttlicher Zurechtweisung.
- source_word: μὴ ἀπαναίνου
  choice: weise nicht zurück
  rationale: Bewahrt die ausdrückliche Aufforderung, die Mahnung nicht abzuweisen oder abzulehnen.
- source_word: ἀλγεῖν ποιεῖ
  choice: verursacht Schmerz
  rationale: Gibt die kausative Wendung wörtlich-sinngemäß wieder, ohne ein im Griechischen nicht genanntes Objekt hinzuzufügen.
- source_word: πάλιν ἀποκαθίστησιν
  choice: stellt wieder her
  rationale: „Wieder“ gehört semantisch zur Wiederherstellung; die Formulierung vermeidet ein unnatürliches zusätzliches „wiederum“.
theological_decisions:
- issue: Zeitbezug der Zurechtweisung durch den Herrn
  choice: 'Präsens als allgemeine Aussage: „zurechtweist“'
  alternative: 'Perfekt: „zurechtgewiesen hat“'
  rationale: Der Aorist ἤλεγξεν kann hier in der Seligpreisungsformel gnomisch verstanden werden. Die Fußnote bewahrt die mögliche formnähere Wiedergabe, ohne die Aussage auf ein einzelnes vergangenes Ereignis festzulegen.
- issue: Göttliches Verursachen von Schmerz und Wiederherstellen
  choice: Beide Handlungen werden demselben unausgesprochenen Subjekt „er“ zugeschrieben
  alternative: Den Schmerz abschwächend als bloßes Zulassen wiedergeben
  rationale: Der griechische Text sagt ausdrücklich αὐτὸς γὰρ ἀλγεῖν ποιεῖ und darf theologisch nicht zu „er lässt Schmerz zu“ abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengliederung. Der einleitende unpersönliche Ausdruck „heißt es“ entspricht dem nicht näher genannten Schriftzitat. Das abschließende Semikolon bleibt erhalten, weil der Satz im folgenden Abschnitt weitergeführt wird.
