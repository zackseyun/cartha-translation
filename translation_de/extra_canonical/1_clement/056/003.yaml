  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: de
  text: 'Denn so sagt das heilige Wort:


    „Der Herr hat mich schwer gezüchtigt,


    doch dem Tod hat er mich nicht ausgeliefert.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: das heilige Wort
  rationale: Die substantivische Wendung bezeichnet hier die heilige Schrift beziehungsweise ihren Ausspruch; die wörtliche und im Deutschen natürliche Wiedergabe bewahrt diese Ausdrucksweise.
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: hat mich schwer gezüchtigt
  rationale: Die Verbindung von Partizip und finitem Verb verstärkt nach semitischem Sprachgebrauch die Handlung. „Schwer“ gibt die Intensivierung wieder; „züchtigen“ wahrt den Sinn korrigierender, schmerzhafter Disziplin.
- source_word: τῷ θανάτῳ οὐ παρέδωκέν με
  choice: dem Tod hat er mich nicht ausgeliefert
  rationale: „Ausliefern“ entspricht παραδίδωμι und bewahrt den personifizierenden Dativ „dem Tod“.
theological_decisions:
- issue: Art und Stärke der göttlichen Züchtigung
  choice: schwer gezüchtigt
  alternative: gewiss gezüchtigt
  rationale: 'Die emphatische griechische Konstruktion bezeichnet hier eher den Grad der Züchtigung als epistemische Gewissheit. Die Wiedergabe lässt zugleich den Kontrast bestehen: harte Züchtigung, aber keine Preisgabe an den Tod.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zweizeiligkeit des Schriftzitats bleibt erhalten; „doch“ macht den im griechischen καί kontextuell liegenden Gegensatz natürlich sichtbar.
