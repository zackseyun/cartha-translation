  yaml_path: translation/extra_canonical/1_clement/028/004.yaml
  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: de
  text: Wohin also könnte jemand gehen, oder wohin könnte er fliehen vor dem, der alles umfasst?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ ... ἀπέλθῃ
  choice: Wohin ... könnte jemand gehen
  rationale: Gibt die deliberative Frage mit dem indefiniten τις in natürlichem Deutsch wieder, ohne dem schlichten Verb ἀπέρχομαι eine unnötig starke Bedeutung zu geben.
- source_word: ποῦ ἀποδράσῃ
  choice: wohin könnte er fliehen
  rationale: ἀποδιδράσκω bezeichnet das Entkommen oder Entfliehen; „fliehen“ bewahrt hier die räumliche und dringliche Aussage.
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: dem, der alles umfasst
  rationale: Die substantivierte Partizipialkonstruktion wird transparent wiedergegeben. „umfasst“ bewahrt die Aussage, dass Gott alles einschließt beziehungsweise umschließt, ohne sie dogmatisch weiter auszudeuten.
theological_decisions:
- issue: Reichweite von τὰ πάντα ἐμπεριέχοντος
  choice: der alles umfasst
  alternative: der alles umschließt / der alles in sich enthält
  rationale: „Umfasst“ erhält die kosmische Weite und lässt offen, ob vor allem Gottes Allgegenwart, umfassende Macht oder das Enthalten aller Dinge gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die doppelte Wohin-Frage und der Wechsel von „gehen“ zu „fliehen“ folgen der griechischen Parallelstruktur; das Pronomen „er“ bezieht sich generisch auf „jemand“.
