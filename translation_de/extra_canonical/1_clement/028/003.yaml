base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: de
  text: »Wohin soll ich gehen, und wo soll ich mich vor deinem Angesicht verbergen? Steige ich zum Himmel hinauf, so bist du dort; gehe ich bis an die äußersten Enden der Erde, so ist dort deine rechte Hand; lege ich mich in den Tiefen nieder, so ist dort dein Geist.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφίξω
  choice: soll ich gehen
  rationale: Gibt die Frage nach einem möglichen Ziel in natürlichem Deutsch wieder, ohne eine Fluchtmöglichkeit vorauszusetzen.
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: vor deinem Angesicht
  rationale: Bewahrt die bildhafte und würdige Redeweise des griechischen Textes; gemeint ist das Entkommen aus Gottes Gegenwart.
- source_word: τὰ ἔσχατα τῆς γῆς
  choice: die äußersten Enden der Erde
  rationale: Entspricht der räumlichen Grenzvorstellung des Ausdrucks und vermeidet eine unnötige geografische Festlegung.
- source_word: ἡ δεξιά σου
  choice: deine rechte Hand
  rationale: Erhält das konkrete biblische Bild, statt es deutend als Macht oder Führung aufzulösen.
- source_word: καταστρωθῶ
  choice: lege ich mich … nieder
  rationale: Gibt das Niederlegen oder Lagern ohne den im Griechischen nicht genannten Gegenstand »Bett« wieder.
- source_word: τὰς ἀβύσσους
  choice: den Tiefen
  rationale: Bewahrt den Pluralgedanken tiefer, unergründlicher Bereiche in idiomatischem Deutsch, ohne ihn enger als Totenreich oder Meer auszulegen.
- source_word: τὸ πνεῦμά σου
  choice: dein Geist
  rationale: Übersetzt πνεῦμα unmittelbar und lässt die mögliche Bedeutung von Gottes wirksamer Gegenwart offen.
theological_decisions:
- issue: Gottes allgegenwärtige Gegenwart
  choice: Die räumlichen Bilder bleiben unaufgelöst stehen.
  alternative: Die Aussagen ausdrücklich als Lehre von Gottes Allgegenwart paraphrasieren.
  rationale: Der Text entfaltet seine Aussage poetisch durch Himmel, Erdenden und Tiefen; eine dogmatische Paraphrase würde die Bildsprache und Spannung verengen.
- issue: Bedeutung von »dein Geist«
  choice: »dein Geist«
  alternative: »deine Gegenwart« oder »dein Atem«
  rationale: Die direkte Wiedergabe bewahrt sowohl den personalen als auch den dynamischen Bedeutungsraum von πνεῦμα, ohne ihn konfessionell festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht bibelsprachlichem Klang. Die parallele Satzstruktur des griechischen Zitats wird bewahrt; unnötig altertümliche Formen werden vermieden.
