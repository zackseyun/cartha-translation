id: 1CLEM.28.1
reference: 1 Clement 28:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: de
  text: Da nun alles gesehen und gehört wird, lasst uns ihn fürchten und die unreinen Begierden nach bösen Taten hinter uns lassen, damit wir durch sein Erbarmen vor den kommenden Gerichten geschützt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων οὖν βλεπομένων καὶ ἀκουομένων
  choice: Da also alles gesehen und gehört wird
  rationale: Der absolute Genitiv wird kausal wiedergegeben. Die passiven Partizipien lassen den Wahrnehmenden unausgesprochen, wie im Griechischen.
- source_word: φοβηθῶμεν αὐτόν
  choice: wollen wir ihn fürchten
  rationale: Der hortative Aorist-Konjunktiv wird mit einer natürlichen deutschen Aufforderungsform wiedergegeben.
- source_word: ἀπολίπωμεν
  choice: hinter uns lassen
  rationale: Die Form bezeichnet ein entschiedenes Aufgeben oder Verlassen und wird idiomatisch, aber kräftig ausgedrückt.
- source_word: φαύλων ἔργων μιαρὰς ἐπιθυμίας
  choice: die unreinen Begierden nach bösen Taten
  rationale: 'φαύλων ἔργων wird als objektiver Genitiv zu ἐπιθυμίας verstanden: Begierden, die auf böse Taten gerichtet sind. μιαρός bezeichnet moralische Befleckung und wird mit „unrein“ wiedergegeben.'
- source_word: τῷ ἐλέει αὐτοῦ
  choice: durch sein Erbarmen
  rationale: Der Dativ bezeichnet hier am natürlichsten das Mittel oder die Grundlage der Bewahrung.
- source_word: σκεπασθῶμεν
  choice: bewahrt werden
  rationale: Wörtlich bedeutet das Verb „bedeckt/geschützt werden“; „bewahrt werden“ vermittelt im Deutschen den hier gemeinten Schutz ohne unnatürliche Bildlichkeit.
- source_word: ἀπὸ τῶν μελλόντων κριμάτων
  choice: vor den kommenden Gerichten
  rationale: Das substantivierte Partizip bezeichnet bevorstehende Gerichte; der Plural κρίματα bleibt erhalten.
theological_decisions:
- issue: Wer alles sieht und hört
  choice: Der Wahrnehmende bleibt unausgesprochen.
  alternative: „Da Gott alles sieht und hört“
  rationale: Obwohl der Kontext eindeutig auf Gott verweist, nennt die griechische Konstruktion das handelnde Subjekt nicht ausdrücklich. Die Übersetzung bewahrt diese formale Zurückhaltung.
- issue: Singular oder Plural bei κρίματα
  choice: „Gerichten“ im Plural
  alternative: „Gericht“ im Singular
  rationale: Der griechische Plural kann einzelne Strafurteile oder Gerichtsakte bezeichnen und sollte nicht ohne Not zu einem einzigen endzeitlichen Gericht vereinheitlicht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am argumentativen Aufbau des Griechischen, ohne hölzern zu wirken. „Begierden“ erhält den ethisch-religiösen Ernst des Ausgangstextes; „böse Taten“ ist allgemein verständlich.
