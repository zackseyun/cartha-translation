base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: de
  text: 'Denn wohin könnte jemand von uns vor seiner mächtigen Hand fliehen? Oder welche Welt wird jemanden aufnehmen, der von ihm abtrünnig wird? Denn die Schrift sagt an einer Stelle:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιᾶς χειρός
  choice: mächtigen Hand
  rationale: Bewahrt das biblisch geprägte Bild und gibt die Stärke von κραταιός natürlich wieder.
- source_word: κόσμος
  choice: Welt
  rationale: Entspricht dem weiten räumlichen Sinn der rhetorischen Frage, ohne ihn auf einen bestimmten Ort einzuengen.
- source_word: αὐτομολούντων
  choice: der von ihm abtrünnig wird
  rationale: Das Verb bezeichnet das Überlaufen oder Desertieren. „Abtrünnig werden“ bewahrt den bewussten Abfall, klingt im Deutschen hier jedoch natürlicher als ein militärisch enges „desertieren“.
- source_word: τὸ γραφεῖον
  choice: die Schrift
  rationale: Im Kontext bezeichnet der Ausdruck die heilige Schrift als zitierte Autorität; die etablierte deutsche Wiedergabe ist idiomatisch und sachlich angemessen.
- source_word: που
  choice: an einer Stelle
  rationale: Gibt die unbestimmte Verweisformel wieder, ohne Unkenntnis oder Unsicherheit zu unterstellen.
theological_decisions:
- issue: Reichweite der Flucht vor Gott
  choice: Die beiden Fragen bleiben als universale rhetorische Fragen stehen.
  alternative: Die Aussage ausdrücklich als Unmöglichkeit der Flucht paraphrasieren.
  rationale: Der griechische Text entfaltet die Aussage durch Fragen; eine erklärende Auflösung würde seine Form und Spannung abschwächen.
- issue: Charakter von αὐτομολεῖν
  choice: „von ihm abtrünnig wird“
  alternative: „ihn verlässt“ oder „von ihm desertiert“
  rationale: Die gewählte Formulierung erhält den Gedanken eines willentlichen Abfalls, ohne eine ausschließlich militärische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Parallelstruktur und der Doppelpunkt als Hinführung zum folgenden Schriftzitat bleiben erhalten.
