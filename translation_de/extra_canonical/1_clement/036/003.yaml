source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: de
  text: 'Denn so steht geschrieben:


    „Er macht seine Engel zu Winden

    und seine Diener zu einer Feuerflamme.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελοι
  choice: Engel
  rationale: Bewahrt die übliche Bedeutung im Kontext himmlischer Boten und lässt zugleich die Grundbedeutung ‚Boten‘ im Hintergrund bestehen.
- source_word: πνεύματα
  choice: Winde
  rationale: πνεῦμα kann ‚Geist‘, ‚Hauch‘ oder ‚Wind‘ bedeuten. Im Zitat aus Psalm 104,4 und im Parallelismus mit der Feuerflamme ist ‚Winde‘ eine gut begründete, bildhafte Wiedergabe.
- source_word: λειτουργοί
  choice: Diener
  rationale: Gibt die Bedeutung von Beauftragten im Dienst Gottes natürlich und würdig wieder, ohne sie unnötig auf einen kultischen Dienst einzuengen.
- source_word: πυρὸς φλόγα
  choice: eine Feuerflamme
  rationale: Entspricht der griechischen Genitivverbindung eng und bewahrt das poetische Bild.
theological_decisions:
- issue: Mehrdeutigkeit von πνεύματα
  choice: Winde
  alternative: Geister
  rationale: Der Psalmzusammenhang und der poetische Parallelismus sprechen für Naturkräfte als Bild der göttlichen Diener. Die mögliche Bedeutung ‚Geister‘ wird nicht dogmatisch ausgeschlossen, aber im Haupttext nicht bevorzugt.
- issue: Prädikative Verwandlungssprache bei ποιῶν ... πνεύματα
  choice: macht ... zu Winden
  alternative: macht Winde zu seinen Engeln
  rationale: Die griechische Wortstellung versteht τοὺς ἀγγέλους αὐτοῦ als Objekt und πνεύματα als Prädikativ. Diese Leserichtung entspricht auch der in 1 Clemens verwendeten griechischen Zitatgestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengliederung. Die einleitende Formel γέγραπται γὰρ οὕτως wird idiomatisch mit „Denn so steht geschrieben“ wiedergegeben.
