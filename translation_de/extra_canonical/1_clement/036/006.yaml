source:
  edition: Funk 1901 (normalized OCR)
  text: τίνες οὖν οἱ ἐχϑροί; οἱ φαῦλοι καὶ ἀντιτασσόμενοι τῷ ϑελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/006.yaml
  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: de
  text: Wer sind nun die Feinde? Die Bösen und diejenigen, die sich seinem Willen widersetzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: die Bösen
  rationale: Im moralischen Zusammenhang bezeichnet φαῦλος schlechte bzw. böse Menschen; „die Bösen“ ist natürlich, verständlich und weniger emotional aufgeladen als „die Niederträchtigen“.
- source_word: ἀντιτασσόμενοι
  choice: diejenigen, die sich … widersetzen
  rationale: Das Partizip bezeichnet Menschen, die sich gegen etwas stellen oder Widerstand leisten; die Relativkonstruktion gibt dies im Deutschen klar und idiomatisch wieder.
- source_word: τῷ θελήματι αὐτοῦ
  choice: seinem Willen
  rationale: Entspricht direkt dem griechischen Dativobjekt und bewahrt den im Kontext erschließbaren Bezug des Pronomens.
theological_decisions:
- issue: Verhältnis der beiden Bezeichnungen der Feinde
  choice: „Die Bösen und diejenigen, die sich seinem Willen widersetzen“
  alternative: „Die Bösen, nämlich diejenigen, die sich seinem Willen widersetzen“
  rationale: Das griechische καί verbindet zwei Beschreibungen unter einem gemeinsamen Artikel, legt aber nicht eindeutig fest, ob sie deckungsgleich sind. Die koordinierende Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und rhetorisch entsprechend dem griechischen Fragesatz. Keine Fußnote erforderlich.
