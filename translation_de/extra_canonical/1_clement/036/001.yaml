reference: 1 Clement 36:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: de
  text: 'Dies ist der Weg, Geliebte, auf dem wir unser Heil gefunden haben: Jesus Christus, den Hohepriester unserer Opfergaben und den Beschützer und Helfer in unserer Schwachheit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ὁδός
  choice: der Weg
  rationale: Die konkrete Metapher des griechischen Textes bleibt unverändert erhalten.
- source_word: τὸ σωτήριον ἡμῶν
  choice: unser Heil
  rationale: Das substantivierte σωτήριον bezeichnet hier das rettende Heil; die anschließende Apposition setzt es mit Jesus Christus in Beziehung.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus Christus
  rationale: Die feste Namens- und Titelform entspricht Clements Sprachgebrauch; der Kontext verlangt keine erklärende Wiedergabe als »Jesus, den Messias«.
- source_word: ἀρχιερέα
  choice: Hohepriester
  rationale: Bewahrt den kultischen Titel und seinen Bezug auf die Opfergaben.
- source_word: προσφορῶν
  choice: Opfergaben
  rationale: Gibt den kultischen Sinn von προσφορά im Zusammenhang mit dem Hohepriester deutlich wieder.
- source_word: προστάτην
  choice: Beschützer
  rationale: Erfasst die Bedeutung eines Beistands oder Schutzherrn in natürlichem modernem Deutsch.
- source_word: ἀσθενείας
  choice: Schwachheit
  rationale: Bewahrt die allgemeine menschliche Schwäche, ohne sie auf Krankheit oder Sünde einzuengen.
theological_decisions:
- issue: Verhältnis von »Heil« und Jesus Christus
  choice: 'Doppelpunkt mit Apposition: »unser Heil gefunden haben: Jesus Christus«'
  alternative: »den Weg zu unserem Heil gefunden haben, Jesus Christus«
  rationale: Die griechische Syntax stellt Jesus Christus als Apposition zu τὸ σωτήριον ἡμῶν dar; die Übersetzung wahrt diese starke Identifikation, ohne sie auszudeuten.
- issue: Genitiv bei »Hohepriester unserer Opfergaben«
  choice: unsere Opfergaben werden als der Bereich seines hohepriesterlichen Dienstes wiedergegeben
  alternative: »Hohepriester, der unsere Opfergaben darbringt«
  rationale: Der knappe Genitiv bleibt erhalten; die Übersetzung ergänzt weder ausdrücklich, wer opfert, noch auf welche Weise Christus mit den Gaben verfährt.
- issue: Funktion Christi gegenüber menschlicher Schwachheit
  choice: »Beschützer und Helfer in unserer Schwachheit«
  alternative: »Beschützer und Helfer unserer Schwachheit«
  rationale: Das idiomatische »in« vermeidet den missverständlichen Eindruck, die Schwachheit selbst werde beschützt, und bewahrt dennoch den Bezug des griechischen Genitivs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede »ihr Geliebten« macht den Vokativ deutlich. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt aber gut lesbar.
