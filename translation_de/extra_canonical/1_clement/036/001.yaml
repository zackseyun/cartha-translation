    issue: Anrede „ihr Geliebten“
    rationale: Die Form ist verständlich, wirkt jedoch weniger natürlich als die im deutschen Brief- und Bibelregister übliche Vokativanrede „Geliebte“.
  - severity: low
    issue: Appositionskasus nach dem Doppelpunkt
    rationale: Da Jesus Christus und die Titel appositiv zu „unser Heil“ stehen, sollte die Akkusativbeziehung durch „Jesus Christus, den Hohepriester … und den Beschützer …“ vollständig sichtbar bleiben.
