id: 1CLEM.36.4
reference: 1 Clement 36:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ οὕτως· εἶπεν ὁ δεσπότης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· αἴτησαι παρ’ ἐμοῦ, καὶ δώσω σοι ἔϑνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: de
  text: 'Über seinen Sohn aber heißt es so:[a]


    »Der Gebieter sprach:

    Du bist mein Sohn;

    heute habe ich dich gezeugt.

    Bitte mich, und ich werde dir die Völker als dein Erbe geben

    und die Enden der Erde als deinen Besitz.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über seinen Sohn aber sprach der Gebieter so:“'
    reason: Die knappe griechische Satzfügung und Zeichensetzung lassen οὕτως („so“) entweder zur einleitenden Formel oder zu „sprach“ ziehen.
lexical_decisions:
- source_word: δεσπότης
  choice: Gebieter
  rationale: Bewahrt den Titel für Gott als souveränen Herrn und unterscheidet ihn vom gewöhnlicheren κύριος („Herr“).
- source_word: γεγέννηκά
  choice: habe … gezeugt
  rationale: Gibt die konkrete Zeugungsmetaphorik des Perfekts wieder, ohne sie theologisch auszudeuten.
- source_word: ἔθνη
  choice: Völker
  rationale: Im Zitat aus Psalm 2 bezeichnet der Plural die Völker bzw. Nationen; „Völker“ ist im Deutschen natürlich und traditionsnah.
- source_word: κληρονομία
  choice: Erbe
  rationale: Entspricht dem Erbteil, das dem Sohn gegeben wird.
- source_word: κατάσχεσις
  choice: Besitz
  rationale: Bezeichnet das in Besitz Genommene bzw. den Besitz und bildet die Parallelzeile verständlich ab.
theological_decisions:
- issue: Aussage „heute habe ich dich gezeugt“
  choice: Die zeitlich und christologisch spannungsreiche Formulierung wird wörtlich beibehalten.
  alternative: Eine deutende Wiedergabe wie „heute habe ich dich als Sohn eingesetzt“
  rationale: Der griechische Text verwendet ausdrücklich γεννάω („zeugen“); eine Erklärung des „Heute“ oder eine Einsetzungsterminologie würde eine bestimmte christologische Deutung importieren.
- issue: Sprecherzuweisung des Psalmzitats
  choice: „Der Gebieter sprach“ wird ausdrücklich wiedergegeben.
  alternative: Die Formel auslassen und nur „heißt es so“ schreiben
  rationale: εἶπεν ὁ δεσπότης ist im Ausgangstext vorhanden und weist die folgenden Worte ausdrücklich dem Gebieter zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetischen Zeilen des Psalmzitats bleiben klar und rhythmisch; „Gebieter“ bewahrt den markierten göttlichen Titel δεσπότης, ohne konfessionelle Zusatzdeutung.
