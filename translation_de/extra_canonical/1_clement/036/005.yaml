base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/005.yaml
  text: 'And again he says to him:

    “Sit at my right hand,

    until I make your enemies a footstool for your feet.”'
translation:
  language: de
  text: 'Und wiederum sagt er zu ihm:


    »Setze dich zu meiner Rechten,

    bis ich deine Feinde zum Schemel für deine Füße mache.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κάϑου
  choice: Setze dich
  rationale: Der Imperativ wird im heutigen Standarddeutsch natürlich und zugleich würdevoll wiedergegeben.
- source_word: ἐκ δεξιῶν μου
  choice: zu meiner Rechten
  rationale: Diese feste deutsche Wendung bewahrt die räumliche und rangbezogene Bildsprache des Griechischen.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: zum Schemel für deine Füße
  rationale: Die konkrete Metapher des Fußschemels bleibt erhalten; »für deine Füße« gibt den griechischen Genitiv natürlich wieder.
theological_decisions:
- issue: Bezug der Sprecher und Angesprochenen
  choice: Die Pronomen »er« und »ihm« bleiben ohne ausdrückliche Identifizierung stehen.
  alternative: Die Sprecher ausdrücklich als Gott und Christus benennen.
  rationale: Der griechische Vers verwendet lediglich Pronomen; eine explizite Identifizierung würde die im unmittelbaren Wortlaut vorhandene Offenheit auslegend auflösen.
- issue: Zeitliche Grenze in ἕως ἂν
  choice: »bis ich … mache«
  alternative: Eine darüber hinausgehende Aussage über die Herrschaft nach der Unterwerfung ergänzen.
  rationale: Die Übersetzung bewahrt die zeitliche Formulierung, ohne daraus zusätzliche theologische Folgerungen abzuleiten.
translation_notes:
  register: Modernes, verständliches und würdiges Standarddeutsch. Die poetische Zeilengliederung kennzeichnet das Schriftzitat; wegen fehlender Fußnoten sind keine Fußnotenmarker erforderlich.
