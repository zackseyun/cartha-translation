  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: de
  text: Durch ihn richten wir unseren Blick auf die Höhen der Himmel; durch ihn schauen wir wie in einem Spiegel sein makelloses und höchst erhabenes Angesicht; durch ihn wurden die Augen unseres Herzens geöffnet; durch ihn blüht unser unverständiger und verfinsterter Sinn zum Licht hin auf; durch ihn wollte der Gebieter, dass wir von der unsterblichen Erkenntnis kosten. Er ist der Abglanz seiner Majestät und ist um so viel größer als die Engel, wie der Name, den er geerbt hat, vorzüglicher ist als der ihre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίζομεν
  choice: richten wir unseren Blick
  rationale: Gibt das intensive, zielgerichtete Hinschauen natürlich und präzise wieder.
- source_word: ἐνοπτριζόμεθα
  choice: schauen wir wie in einem Spiegel
  rationale: Bewahrt ausdrücklich das Spiegelmotiv des griechischen Verbs, ohne festzulegen, ob mittelbare Schau oder Widerspiegelung im Vordergrund steht.
- source_word: ὄψιν
  choice: Angesicht
  rationale: Passt zum erhabenen Kontext und kann sowohl Erscheinung als auch Antlitz bezeichnen.
- source_word: ἀναθάλλει
  choice: blüht ... auf
  rationale: Erhält das lebendige Bild des erneuten Aufblühens beziehungsweise Hervorsprießens.
- source_word: δεσπότης
  choice: Gebieter
  rationale: Bewahrt den Gedanken souveräner Herrschaft deutlicher als das allgemeinere „Herr“.
- source_word: ἀϑανάτου γνώσεως
  choice: von der unsterblichen Erkenntnis
  rationale: Der Genitiv bei γεύσασθαι wird mit „von ... kosten“ sichtbar wiedergegeben; „unsterblich“ bleibt attributiv und wird nicht zu „Erkenntnis der Unsterblichkeit“ umgedeutet.
- source_word: ἀπαύγασμα
  choice: Abglanz
  rationale: Traditionell verständliche und semantisch passende Wiedergabe für ausstrahlenden Glanz beziehungsweise Widerschein.
- source_word: διαφορώτερον
  choice: vorzüglicher
  rationale: Drückt die höhere Auszeichnung oder Überlegenheit des Namens in gehobenem, verständlichem Deutsch aus.
theological_decisions:
- issue: Bezug der wiederholten Wendung διὰ τούτου
  choice: „Durch ihn“ mit personalem Bezug auf Christus
  alternative: „Dadurch“ oder „durch dieses“
  rationale: Der anschließende Relativsatz und die Anspielung auf Hebräer 1 kennzeichnen den Bezug eindeutig als personal; das Deutsche verlangt hier die natürliche personale Form.
- issue: Verhältnis Christi zu Gottes Majestät in ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ
  choice: „der Abglanz seiner Majestät“
  alternative: „die Ausstrahlung seiner Größe“
  rationale: Die Formulierung wahrt die christologische Bildsprache, ohne ihre metaphysische Tragweite näher zu definieren.
- issue: Komparativ gegenüber den Engeln
  choice: „um so viel größer ... wie ... vorzüglicher“
  alternative: „den Engeln so weit überlegen, wie ...“
  rationale: Die gewählte Fassung erhält die formale Vergleichsstruktur und vermeidet eine stärkere interpretierende Paraphrase.
- issue: Geerbter Name
  choice: „der Name, den er geerbt hat“
  alternative: „der ihm als Erbe zugefallene Name“
  rationale: Das Erbmotiv wird unverändert bewahrt und nicht christologisch erklärt oder auf einen bestimmten Titel festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener rhetorischer Wiederholung „durch ihn“. Die langen Parallelglieder des Griechischen bleiben erhalten, werden jedoch vor dem abschließenden christologischen Satz durch einen Punkt lesbarer gegliedert. Keine konfessionell spezifische Terminologie wurde eingeführt.
