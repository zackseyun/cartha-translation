revisions:
- from: Durch ihn richten wir unseren Blick auf die Höhen der Himmel; durch ihn schauen wir wie in einem Spiegel sein makelloses und höchst erhabenes Angesicht; durch ihn wurden die Augen unseres Herzens geöffnet; durch ihn blüht unser unverständiger und verfinsterter Sinn zum Licht hin auf; durch ihn wollte der Gebieter uns von der unsterblichen Erkenntnis kosten lassen. Er ist der Abglanz seiner Majestät und ist um so viel größer als die Engel, wie der Name, den er geerbt hat, vorzüglicher ist als der ihre.
  to: Durch ihn richten wir unseren Blick auf die Höhen der Himmel; durch ihn schauen wir wie in einem Spiegel sein makelloses und höchst erhabenes Angesicht; durch ihn wurden die Augen unseres Herzens geöffnet; durch ihn blüht unser unverständiger und verfinsterter Sinn zum Licht hin auf; durch ihn wollte der Gebieter, dass wir von der unsterblichen Erkenntnis kosten. Er ist der Abglanz seiner Majestät und ist um so viel größer als die Engel, wie der Name, den er geerbt hat, vorzüglicher ist als der ihre.
  rationale: Ausschließlich die Wiedergabe von ἠθέλησεν ... ἡμᾶς γεύσασθαι wurde korrigiert. „Wollte, dass wir ... kosten“ gibt den Wunsch beziehungsweise Willen des Gebieters wieder, ohne die zusätzliche Kausativ- oder Erlaubnisnuance von „kosten lassen“ einzutragen. Die übrige Fassung kann unverändert bleiben.
