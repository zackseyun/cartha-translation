revisions:
- from: Das Zeugnis für unser gutes Handeln[a] soll von anderen gegeben werden, so wie es unseren gerechten Vätern gegeben wurde.
  to: Das Zeugnis über unser gutes Handeln[a] soll von anderen abgelegt werden, so wie es unseren gerechten Vätern zuteilwurde.
  rationale: Die Revision beseitigt eine deutsche Präpositionsmehrdeutigkeit und glättet die zweite Passivformulierung. Der Singular und die semantische Spannweite von πράξις werden durch „gutes Handeln“ samt Fußnote beibehalten.
  reviewer_model: gpt-5.6-terra
