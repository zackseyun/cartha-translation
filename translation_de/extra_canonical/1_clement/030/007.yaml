source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: de
  text: Das Zeugnis über unser gutes Handeln[a] soll von anderen abgelegt werden, so wie es unseren gerechten Vätern zuteilwurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unsere gute Tat«.'
    reason: πρᾶξις kann sowohl das Handeln beziehungsweise Verhalten als auch eine einzelne Tat bezeichnen.
lexical_decisions:
- source_word: ἡ μαρτυρία
  choice: das Zeugnis
  rationale: Gibt die Aussage über die bestätigende Bezeugung des Lebenswandels knapp und quellentreu wieder.
- source_word: τῆς ἀγαθῆς πράξεως ἡμῶν
  choice: für unser gutes Handeln
  rationale: Das singularische πρᾶξις kann eine einzelne Tat oder allgemeiner das praktische Verhalten bezeichnen. »Handeln« bewahrt den Singular und passt hier natürlich zur ethischen Lebensführung, ohne die Möglichkeit einer einzelnen Tat ganz auszuschließen.
- source_word: ὑπ’ ἄλλων
  choice: von anderen
  rationale: Entspricht der griechischen Urheberangabe und betont, dass nicht die Betreffenden selbst, sondern andere das Zeugnis ablegen.
- source_word: τοῖς πατράσιν ἡμῶν τοῖς δικαίοις
  choice: unseren gerechten Vätern
  rationale: Bewahrt die traditionelle Bezeichnung der vorangegangenen Glaubensgeneration und das attributive »gerecht«.
theological_decisions:
- issue: Eigenlob und Anerkennung durch andere
  choice: Die passive Formulierung »soll von anderen gegeben werden« bleibt erhalten.
  alternative: »Andere sollen unser gutes Handeln bezeugen«
  rationale: Die gewählte Fassung bildet die Struktur des griechischen Textes ab und lässt den Kontrast zwischen eigener Selbstdarstellung und fremdem Zeugnis unausgesprochen bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Parallelität der beiden Passivkonstruktionen wurde bewahrt; »so wie« macht den Vergleich idiomatisch verständlich.
