review_pass:
  verdict: revise
  source_fidelity: Die griechische Aufforderung διδόσθω wird mit „soll … abgelegt werden“ angemessen wiedergegeben. ἀγαθῆς πράξεως steht im Singular und kann sowohl eine gute Tat als auch das ethische Handeln bzw. Verhalten bezeichnen; „gutes Handeln“ wahrt diese Offenheit. ὑπ’ ἄλλων ist korrekt als „von anderen“ erfasst, und der Vergleich mit den gerechten Vätern bleibt erhalten.
  naturalness: „Zeugnis für unser gutes Handeln“ ist im Deutschen missverständlich, weil es auch ein unser Handeln stützendes Beweismittel bezeichnen kann. „Zeugnis über unser gutes Handeln“ bezeichnet klar den Inhalt des Zeugnisses. Bei den Vätern ist „zuteilwurde“ idiomatischer als die wörtliche, aber hölzerne Wiederholung „gegeben wurde“.
  terminology: „Zeugnis“, „gutes Handeln“ und „gerechten Vätern“ sind registergerecht und quellentreu. Die Fußnote ist sinnvoll, da „Tat“ als engere Lesart von πράξις möglich bleibt. Sie steht im Einklang mit der englischen Auditspur, ohne deren Pluralform „good deeds“ unbesehen in das singularische deutsche Ausgangswort zu übernehmen.
  issues:
  - severity: low
    issue: Präposition „für“ bei „Zeugnis“ ist semantisch mehrdeutig.
    rationale: Sie kann ein Zeugnis zugunsten des Handelns statt ein Zeugnis über dessen Qualität meinen. „über“ löst dies ohne Bedeutungsverschiebung.
  - severity: low
    issue: „gegeben wurde“ ist im zweiten Glied wenig idiomatisch.
    rationale: Das griechische Passiv mit Dativ bezeichnet, dass den Vätern ein Zeugnis zuteilwurde. Diese deutsche Formulierung ist natürlicher und bewahrt die Aussage.
  revised_text: Das Zeugnis über unser gutes Handeln[a] soll von anderen abgelegt werden, so wie es unseren gerechten Vätern zuteilwurde.
  revised_footnotes:
  - marker: a
    text: 'Oder: »unsere gute Tat«.'
    reason: πρᾶξις kann sowohl das Handeln beziehungsweise Verhalten als auch eine einzelne Tat bezeichnen.
  revision_rationale: Die Revision beseitigt eine deutsche Präpositionsmehrdeutigkeit und glättet die zweite Passivformulierung. Der Singular und die semantische Spannweite von πράξις werden durch „gutes Handeln“ samt Fußnote beibehalten.
