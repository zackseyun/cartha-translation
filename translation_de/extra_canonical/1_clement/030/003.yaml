id: 1CLEM.30.3
reference: 1 Clement 30:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: κολληθῶμεν οὖν ἐκείνοις, οἷς ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται· ἐνδυσώμεθα τὴν ὁμόνοιαν ταπεινοφρονοῦντες, ἐγκρατευόμενοι, ἀπὸ παντὸς ψιθυρισμοῦ καὶ καταλαλιᾶς πόρρω ἑαυτοὺς ποιοῦντες, ἔργοις δικαιούμενοι καὶ μὴ λόγοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: de
  text: Darum wollen wir uns an die halten, denen die Gnade von Gott gegeben ist. Wir wollen uns mit Eintracht bekleiden, demütig gesinnt und selbstbeherrscht sein, uns von allem Getuschel und aller üblen Nachrede fernhalten und durch Taten gerechtfertigt werden, nicht durch Worte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: wollen wir uns an die halten
  rationale: Gibt den auffordernden Konjunktiv und das enge Sich-Anschließen natürlich wieder, ohne die bildhafte Stärke völlig aufzugeben.
- source_word: ὁμόνοιαν
  choice: Eintracht
  rationale: Bezeichnet gemeinsames Denken und harmonische Übereinstimmung; „Eintracht“ ist im Deutschen prägnant und würdig.
- source_word: ταπεινοφρονοῦντες
  choice: demütig gesinnt sein
  rationale: Bewahrt den Bezug auf die innere Haltung und vermeidet eine bloß äußerliche Beschreibung.
- source_word: ἐγκρατευόμενοι
  choice: selbstbeherrscht sein
  rationale: Gibt den Gedanken disziplinierter Selbstkontrolle in verständlichem modernem Deutsch wieder.
- source_word: ψιθυρισμοῦ
  choice: Getuschel
  rationale: Erfasst heimliches, missbilligendes oder verleumderisches Reden; „Flüstern“ allein wäre im Deutschen zu neutral.
- source_word: καταλαλιᾶς
  choice: üble Nachrede
  rationale: Bezeichnet herabsetzendes Reden über andere und unterscheidet sich passend vom heimlichen Getuschel.
- source_word: δικαιούμενοι
  choice: gerechtfertigt werden
  rationale: Bewahrt die forensisch-theologische Mehrdeutigkeit des griechischen Verbs, statt sie als bloßes „sich bewähren“ aufzulösen.
theological_decisions:
- issue: Bedeutung von ἔργοις δικαιούμενοι
  choice: durch Taten gerechtfertigt werden
  alternative: uns durch Taten als gerecht erweisen
  rationale: Die passive Form und die genuine Spannung der Aussage bleiben erhalten. Eine paraphrasierende Wiedergabe als bloßes Erweisen würde die mögliche theologische Tragweite vorentscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Die wiederholte Aufforderungsform „Wir wollen …“ bildet die griechischen Hortative ab; der abschließende Gegensatz „durch Taten … nicht durch Worte“ bleibt pointiert erhalten.
