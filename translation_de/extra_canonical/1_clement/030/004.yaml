source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ· Ὁ ἰὰ πολλὰ λέγων καὶ ἀντακουσεται· ἢ ὁ εὐλάλος οἴεται εἶναι δίκαιος;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
translation:
  language: de
  text: 'Denn er sagt[a]: „Wer vieles redet, wird auch eine Erwiderung hören; oder meint der Redegewandte, gerecht zu sein?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Hiob 11,2 nach der griechischen Übersetzung.
    reason: Kennzeichnet die von Clemens angeführte Schriftstelle und erklärt die Zitatform; „Hiob“ ist die moderne deutsche Buchbezeichnung.
lexical_decisions:
- source_word: πολλὰ λέγων
  choice: vieles redet
  rationale: Gibt die mengenbezogene Aussage des Griechischen knapp und idiomatisch wieder, ohne sie wertend als Geschwätz zu deuten.
- source_word: ἀντακούσεται
  choice: wird auch eine Erwiderung hören
  rationale: Bewahrt den Gedanken einer Antwort oder Gegenrede; „Erwiderung“ ist im Deutschen natürlicher als die streng wörtliche Formulierung „zurückhören“.
- source_word: εὐλάλος
  choice: der Redegewandte
  rationale: Bezeichnet einen gewandten bzw. beredten Sprecher. Die substantivierte Form erhält die knappe Personenbezeichnung des Griechischen.
- source_word: δίκαιος
  choice: gerecht
  rationale: Entspricht dem üblichen ethisch-religiösen Sinn von δίκαιος und vermeidet die Verengung auf bloße Rechtmäßigkeit.
theological_decisions:
- issue: Sprecher der einleitenden Formel λέγει γάρ
  choice: Denn er sagt
  alternative: Denn es heißt
  rationale: Die personale Form des griechischen λέγει wird bewahrt, ohne die im Ausschnitt nicht ausdrücklich genannte Identität des Sprechers festzulegen.
- issue: Umfang des Schriftzitats
  choice: Die gesamte Frage bis zum Versende steht innerhalb der Anführungszeichen.
  alternative: Das Zitat nach „hören“ schließen und die zweite Frage Clemens zuschreiben.
  rationale: Auf λέγει γάρ folgt im Griechischen ein zusammenhängendes Zitat; die zweite Frage gehört ebenfalls zur angeführten Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung und die offene Frage des griechischen Textes bleiben erhalten; das Semikolon macht den engen Zusammenhang der beiden Satzglieder sichtbar.
