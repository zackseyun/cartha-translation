id: 1CLEM.30.8
reference: 1 Clement 30:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: de
  text: Dreistigkeit[a], Selbstherrlichkeit und Vermessenheit finden sich bei denen, die von Gott verflucht sind; Milde, Demut und Sanftmut dagegen bei denen, die von Gott gesegnet sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dreiste Kühnheit«.'
    reason: θράσος bezeichnet negativ bewertete Kühnheit oder Unverschämtheit; die Alternative macht das Kühnheitsmoment sichtbar, ohne ihm einen positiven Sinn zu geben.
lexical_decisions:
- source_word: θράσος
  choice: Dreistigkeit
  rationale: Das Wort bezeichnet in dieser Lasterreihe keine positiv verstandene Kühnheit, sondern unverschämte oder anmaßende Verwegenheit. »Dreistigkeit« gibt diese negative Wertung im heutigen Deutsch klar wieder.
- source_word: αὐθάδεια
  choice: Selbstherrlichkeit
  rationale: Der Ausdruck verbindet Eigensinn mit hochmütiger Rücksichtslosigkeit. »Selbstherrlichkeit« bewahrt beide Aspekte und unterscheidet sich deutlich von θράσος.
- source_word: τόλμα
  choice: Vermessenheit
  rationale: τόλμα kann Mut oder Wagnis bezeichnen, ist hier aber durch die Lasterreihe negativ geprägt. »Vermessenheit« vermittelt diese rücksichtslose, Grenzen überschreitende Kühnheit.
- source_word: ἐπιείκεια
  choice: Milde
  rationale: Der Begriff bezeichnet nachsichtige, maßvolle Güte. »Milde« ist natürlich und bildet einen passenden Gegenpol zu den vorausgehenden Lastern.
- source_word: ταπεινοφροσύνη
  choice: Demut
  rationale: Die übliche und sachlich genaue Wiedergabe für eine demütige innere Haltung.
- source_word: πραΰτης
  choice: Sanftmut
  rationale: »Sanftmut« gibt die beherrschte, nicht aggressive Milde des griechischen Begriffs wieder und bleibt im würdevollen religiösen Register verständlich.
theological_decisions:
- issue: Göttliches Verfluchen und Segnen
  choice: „die von Gott verflucht sind“ / „die von Gott gesegnet sind“
  alternative: „die Gott verflucht hat“ / „die Gott gesegnet hat“
  rationale: Die passivischen Partizipien mit ὑπὸ τοῦ θεοῦ benennen Gott ausdrücklich als Handelnden. Die gewählte Form erhält die parallele Struktur und legt weder Zeitpunkt noch nähere Art des göttlichen Handelns fest.
- issue: Zuordnung der Eigenschaften zu Personengruppen
  choice: „finden sich bei denen“
  alternative: „gehören denen“
  rationale: Die griechischen Nominalsätze mit Dativ drücken eine Zuordnung aus, ohne Besitz oder Wesensidentität näher festzulegen. »Finden sich bei« bewahrt diese Offenheit in natürlichem Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Reihung des Griechischen bleibt erhalten; „dagegen“ verdeutlicht den im asyndetischen griechischen Parallelismus enthaltenen Gegensatz.
