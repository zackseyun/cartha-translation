  source_fidelity: Der Entwurf gibt den griechischen Kontrast zwischen ἐν θεῷ („in Gott“) und ἐξ αὐτῶν („aus uns selbst“) angemessen wieder. Die Ergänzung „kommen“ macht die Herkunftsbedeutung im Deutschen verständlich, ohne den offenen Sinn von ἐν θεῷ einzuengen. αὐτεπανέτους ist treffend als Personenbezeichnung wiedergegeben; μισεῖ bleibt mit „hasst“ ungemildert.
  naturalness: Modernes, klares und würdiges Standarddeutsch. „Unser Lob soll in Gott sein“ ist bewusst nah am griechischen Bild und im gegebenen religiös-paränetischen Register verständlich. Der zweite Teilsatz liest sich idiomatisch.
