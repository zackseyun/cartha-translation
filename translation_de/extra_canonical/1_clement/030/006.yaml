source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἔπαινος ἡμῶν ἔστω ἐν θεῷ καὶ μὴ ἐξ αὐτῶν· αὐτεπανέτους γὰρ μισεῖ ὁ θεός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: de
  text: Unser Lob soll in Gott sein und nicht aus uns selbst kommen; denn Gott hasst die, die sich selbst loben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: unser Lob
  rationale: Gibt die Nominalfügung direkt und natürlich wieder.
- source_word: ἐν θεῷ
  choice: in Gott
  rationale: Bewahrt die räumlich-metaphorische und theologisch offene Formulierung des griechischen Textes, statt sie etwa als „Gott gelten“ festzulegen.
- source_word: μὴ ἐξ αὐτῶν
  choice: nicht aus uns selbst kommen
  rationale: Macht den Herkunftsaspekt von ἐξ idiomatisch deutlich; αὐτῶν bezieht sich sinngemäß auf die Sprechenden.
- source_word: αὐτεπανέτους
  choice: die, die sich selbst loben
  rationale: Gibt das seltene substantivierte Adjektiv verständlich und präzise als Personenbezeichnung wieder.
- source_word: μισεῖ
  choice: hasst
  rationale: Entspricht der starken, ungemilderten Aussage des griechischen Verbs.
theological_decisions:
- issue: Bedeutung von „Lob in Gott“
  choice: Die offene Wendung „in Gott“ wird beibehalten.
  alternative: „Unser Ruhm soll von Gott kommen“ oder „Wir sollen uns Gottes rühmen“
  rationale: Der griechische Wortlaut unterscheidet ἐν θεῷ von ἐξ αὐτῶν. Eine stärker deutende Wiedergabe würde die mögliche Bedeutung als Grund, Bereich oder Bezugspunkt des Lobes vorschnell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Kontrast, während „kommen“ ergänzt wird, damit „nicht aus uns selbst“ im Deutschen klar und idiomatisch klingt.
