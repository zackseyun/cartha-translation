source:
  edition: Funk 1901 (normalized OCR)
  text: θεὸς γάρ, φησίν, ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: de
  text: 'Denn es heißt[a]: »Gott widersetzt sich den Hochmütigen, den Demütigen aber schenkt er Gnade.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn Gott, sagt er, widersetzt sich den Hochmütigen, den Demütigen aber schenkt er Gnade.«'
    reason: Bewahrt die formal mögliche parenthetische Auffassung von φησίν als »sagt er« statt als unpersönliche Zitationsformel.
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: den Hochmütigen
  rationale: Gibt die moralische Haltung des Stolzes bzw. Hochmuts im Deutschen natürlich und präzise wieder.
- source_word: ἀντιτάσσεται
  choice: widersetzt sich
  rationale: Bewahrt den Gedanken des aktiven Entgegentretens, ohne die Aussage unnötig zu verschärfen.
- source_word: ταπεινοῖς
  choice: den Demütigen
  rationale: Bezeichnet hier Menschen, die durch Demut gekennzeichnet sind; die substantivierte Form entspricht der parallelen griechischen Konstruktion.
- source_word: χάριν
  choice: Gnade
  rationale: Die etablierte und kontextuell angemessene Wiedergabe von χάρις in der zitierten Weisheitsaussage.
theological_decisions:
- issue: Funktion von φησίν
  choice: 'unpersönliche Zitationsformel: »es heißt«'
  alternative: 'parenthetisch: »sagt er«'
  rationale: φησίν führt hier sehr wahrscheinlich ein Schriftzitat ein. »Es heißt« macht diese Funktion im Deutschen klar, während die alternative syntaktische Deutung in einer Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anführungszeichen kennzeichnen die eingeführte Schriftanführung; die adversative Struktur mit δέ wird durch »aber« bewahrt.
