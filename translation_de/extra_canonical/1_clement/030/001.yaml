  to: Da wir nun ein heiliger Anteil sind, wollen wir alles tun, was zur Heiligung gehört, und Verleumdungen, schmutzige und unreine Verstrickungen, Trunkenheit und Aufruhr, abscheuliche Begierden, widerwärtigen Ehebruch, abscheulichen Hochmut meiden.
