id: 1CLEM.30.1
reference: 1 Clement 30:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: de
  text: Da wir nun ein heiliger Anteil sind, wollen wir alles tun, was zur Heiligung gehört, und Verleumdungen, schmutzige und unreine Verstrickungen, Trunkenheit und Aufruhr, abscheuliche Begierden, widerwärtigen Ehebruch, abscheulichen Hochmut meiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: Teil
  rationale: Gibt die Grundbedeutung eines zugehörigen Teils wieder und klingt im Deutschen natürlicher als „Anteil“, ohne die gemeinschaftliche Aussage abzuschwächen.
- source_word: τὰ τοῦ ἁγιασμοῦ πάντα
  choice: alles, was zur Heiligung gehört
  rationale: Bewahrt die umfassende Wendung und gibt ἁγιασμός als fortdauernde Heiligung wieder.
- source_word: καταλαλιάς
  choice: Verleumdungen
  rationale: Der Plural des griechischen Substantivs wird ausdrücklich erhalten.
- source_word: συμπλοκὰς
  choice: Verstrickungen
  rationale: Bewahrt die mögliche Bedeutungsbreite von Verbindungen, Verwicklungen oder körperlichen Verbindungen, statt die Stelle eindeutig sexuell festzulegen.
- source_word: μέθας
  choice: Trunkenheit
  rationale: Ein natürliches deutsches Kollektivum für wiederholte Zustände oder Fälle des Betrunkenseins.
- source_word: νεωτεροποιΐας
  choice: Aufruhr
  rationale: Bezeichnet umstürzlerisches oder Unruhe stiftendes Handeln, ohne unnötig eine konkrete politische Revolution vorauszusetzen.
- source_word: βδελυκτὰς / βδελυκτὴν
  choice: abscheuliche / abscheulichen
  rationale: Die bewusste Wiederholung desselben griechischen Adjektivs bei Begierden und Hochmut bleibt rhetorisch sichtbar.
- source_word: μοιχείαν
  choice: Ehebruch
  rationale: Direkte und im modernen Standarddeutsch klare Wiedergabe.
theological_decisions:
- issue: Bedeutung von ἁγιασμός
  choice: Heiligung
  alternative: Heiligkeit
  rationale: Die Formulierung beschreibt Dinge oder Handlungen, die zu einem geheiligten Leben gehören; „Heiligung“ lässt sowohl Zustand als auch Lebensvollzug zu.
- issue: Sexuelle Deutung von συμπλοκαί
  choice: Verstrickungen
  alternative: sexuelle Verbindungen
  rationale: Der Kontext kann eine sexuelle Nebenbedeutung tragen, doch das Wort muss hier nicht ausschließlich sexuell verstanden werden; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung folgt dem griechischen Aufbau; insbesondere wird vor dem letzten Glied kein zusätzliches „und“ eingefügt. Die wiederholte Wertung „abscheulich“ spiegelt die Wiederholung von βδελυκτός.
