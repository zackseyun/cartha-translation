source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: de
  text: Weil ich rief und ihr nicht auf mich hörtet, weil ich euch eindringlich zusprach und ihr nicht darauf achtetet, sondern meine Ratschläge für ungültig erklärtet und meinen Zurechtweisungen nicht gehorchtet, darum werde auch ich über euren Untergang lachen; ich werde mich freuen, wenn das Verderben über euch kommt, wenn plötzliche Unruhe euch ereilt und der Zusammenbruch wie ein Sturm hereinbricht oder wenn Bedrängnis und Belagerung über euch kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηκούσατε
  choice: gehorchtet
  rationale: 'Das Verb bezeichnet hier mehr als bloßes akustisches Hören: Der Ruf wurde nicht befolgt.'
- source_word: ἐξέτεινον λόγους
  choice: eindringlich zu euch redete
  rationale: Die wörtliche Wendung „Worte ausstrecken“ ist im Deutschen unnatürlich; im Kontext drückt sie ein nachdrückliches, anhaltendes Zureden aus.
- source_word: ἀκύρους ἐποιεῖτε
  choice: für nichts achtetet
  rationale: Die Wendung bedeutet, den Ratschlägen Geltung oder Gewicht abzusprechen; diese Formulierung wahrt den aktiven Aspekt ohne juristisch zu klingen.
- source_word: ἀπώλεια
  choice: Untergang
  rationale: Bezeichnet hier das ruinöse Ende und passt zum folgenden Feld von Verderben und Zusammenbruch.
- source_word: καταχαροῦμαι
  choice: ich werde mich freuen
  rationale: Gibt den starken Ausdruck der Freude wieder, ohne ihn durch eine interpretierende Abschwächung zu entschärfen.
- source_word: θόρυβος
  choice: Bestürzung
  rationale: Im Unheilskontext ist nicht bloß Lärm gemeint, sondern plötzlich hereinbrechende Unruhe und Verwirrung.
- source_word: πολιορκία
  choice: Belagerung
  rationale: Die konkrete Bedeutung wird beibehalten; eine Verallgemeinerung zu „Not“ würde das Bild abschwächen.
theological_decisions:
- issue: Personifizierte Weisheit spricht vom Lachen und Sichfreuen über den Untergang der Ungehorsamen.
  choice: Die anstößige Schärfe der Aussage bleibt ungemildert erhalten.
  alternative: Als bloße Feststellung gerechter Vergeltung paraphrasieren.
  rationale: Der griechische Text formuliert ausdrücklich ἐπιγελάσομαι und καταχαροῦμαι; eine Harmonisierung würde die theologische Spannung beseitigen.
- issue: Wechsel beziehungsweise Reihung der Unheilsbilder mit καί und ἤ.
  choice: 'Die Folge wird als mehrere mögliche beziehungsweise sich ergänzende Bilder wiedergegeben: Verderben, Bestürzung, Zusammenbruch, Bedrängnis und Belagerung.'
  alternative: Alle Begriffe als streng zeitliche Abfolge oder ausschließlich als synonyme Parallelismen darstellen.
  rationale: Die Syntax lässt die genaue Beziehung der letzten Glieder offen; die Übersetzung legt sie nicht unnötig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte und forensisch-mahnende Schärfe des griechischen Weisheitsspruchs bleibt erhalten; unnatürliche Gräzismen werden idiomatisch wiedergegeben.
