revisions:
- from: Weil ich rief und ihr nicht gehorchtet, weil ich eindringlich zu euch redete und ihr nicht darauf achtetet, sondern meine Ratschläge für nichts achtetet und meinen Zurechtweisungen nicht folgen wolltet, darum werde auch ich über euren Untergang lachen; ich werde mich freuen, wenn das Verderben über euch kommt, wenn euch plötzlich Bestürzung ereilt und der Zusammenbruch wie ein Sturm hereinbricht oder wenn Bedrängnis und Belagerung über euch kommen.
  to: Weil ich rief und ihr nicht auf mich hörtet, weil ich euch eindringlich zusprach und ihr nicht darauf achtetet, sondern meine Ratschläge für ungültig erklärtet und meinen Zurechtweisungen nicht gehorchtet, darum werde auch ich über euren Untergang lachen; ich werde mich freuen, wenn das Verderben über euch kommt, wenn plötzliche Unruhe euch ereilt und der Zusammenbruch wie ein Sturm hereinbricht oder wenn Bedrängnis und Belagerung über euch kommen.
  rationale: Die Revision beseitigt die zusätzliche Willensnuance bei ἠπειθήσατε, präzisiert θόρυβος als äußeres beziehungsweise umfassendes Unheilsereignis und gibt ἀκύρους ἐποιεῖτε aktiv und verständlich wieder. Die scharfe Aussage des personifizierten Sprechers wird unverändert beibehalten; die mit „oder“ markierte, im Griechischen nicht vollständig festgelegte Verknüpfung der abschließenden Unheilsbilder bleibt offen.
