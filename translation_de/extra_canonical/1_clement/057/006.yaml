  text: τοιγαροῦν ἔδονται τῆς ἑαυτῶν ὁδοῦ τοὺς καρποὺς καὶ τῆς ἑαυτῶν ἀσεβείας πλησθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/006.yaml
  text: Therefore they will eat the fruits of their own way and be filled with their own ungodliness.
translation:
  language: de
  text: Darum werden sie die Früchte ihres eigenen Weges essen und von ihrer eigenen Gottlosigkeit gesättigt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Darum
  rationale: Gibt die nachdrückliche Folgerung des griechischen Ausdrucks knapp und natürlich wieder.
- source_word: τῆς ἑαυτῶν ὁδοῦ τοὺς καρπούς
  choice: die Früchte ihres eigenen Weges
  rationale: Bewahrt das Bild und die betonte Rückbezüglichkeit von ἑαυτῶν.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Entspricht dem religiös-moralischen Sinn von ἀσέβεια, der eine Missachtung Gottes bezeichnet.
- source_word: πλησθήσονται
  choice: sich … sättigen
  rationale: Bewahrt das Bild des vollständigen Erfülltwerdens und verbindet sich im Deutschen idiomatisch mit der Genitivvorlage.
theological_decisions:
- issue: Vergeltung als Folge des eigenen Handelns
  choice: Die Metaphern des Essens und Sich-Sättigens bleiben unverändert erhalten.
  alternative: 'Frei wiedergeben als: „Sie werden die Folgen ihres Handelns tragen.“'
  rationale: Der griechische Text beschreibt die Vergeltung bildhaft als Genuss der eigenen Früchte; eine abstrakte Wiedergabe würde diese rhetorische und theologische Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; eng am griechischen Satzbau und an dessen Bildsprache, zugleich natürlich lesbar.
