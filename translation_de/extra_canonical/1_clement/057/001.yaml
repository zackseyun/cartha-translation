  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: καταβολὴν ... ποιήσαντες als bildhaftes Legen des Grundes, στάσις als negativ bewerteter innergemeinschaftlicher Konflikt, ὑποτάγητε als Aufforderung zur Unterordnung, παιδεύθητε εἰς μετάνοιαν als auf Umkehr zielende korrigierende Erziehung und die absichtsvoll paradoxe Metapher von den „Knien ... des Herzens“.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Ihr nun“ bewahrt die betonte Folgerung; „ordnet euch ... unter“ und „lasst euch zur Umkehr erziehen“ sind idiomatisch. Die ungewöhnliche Herz-Knie-Metapher ist mit Recht nicht geglättet.
  terminology: „Älteste“ ist für πρεσβύτεροι angemessen. „Umkehr“ gibt μετάνοια sachgerecht und konfessionell unvoreingenommen wieder. „Aufruhr“ ist für στάσις im gegebenen Tadelkontext vertretbar; die Fußnote sichert mit „Spaltung“ und „Parteienstreit“ wichtige kontextuelle Nuancen ab und steht im Einklang mit dem englischen Audit, der die negative Konfliktdimension betont.
