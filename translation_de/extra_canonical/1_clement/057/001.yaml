source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: de
  text: Ihr nun, die ihr den Grund für den Aufruhr[a] gelegt habt, ordnet euch den Ältesten unter und lasst euch zur Umkehr erziehen, indem ihr die Knie eures Herzens beugt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Spaltung“; auch „den Parteienstreit“.'
    reason: στάσις kann je nach Akzent Aufruhr, Zwietracht, Parteienstreit oder Spaltung bezeichnen; die Fußnote bewahrt die sachliche Bandbreite des Begriffs.
lexical_decisions:
- source_word: καταβολή
  choice: Grund gelegt
  rationale: Die Wendung τὴν καταβολὴν ... ποιήσαντες bezeichnet bildhaft das Legen einer Grundlage und damit das Verursachen bzw. Ingangsetzen des Konflikts; die griechische Metapher bleibt im Deutschen erhalten.
- source_word: στάσις
  choice: Aufruhr
  rationale: Im Kontext bezeichnet στάσις einen verwerflichen innergemeindlichen Konflikt gegen die bestehende Ordnung. „Aufruhr“ gibt den negativen, aufrührerischen Sinn wieder, ohne das Geschehen vorschnell als politische Rebellion festzulegen.
- source_word: πρεσβύτεροι
  choice: Älteste
  rationale: „Älteste“ ist die sachlich passende und im frühchristlichen Kontext geläufige Wiedergabe des Amts- bzw. Leitungsbegriffs.
- source_word: παιδεύθητε
  choice: lasst euch ... erziehen
  rationale: Der passive Imperativ umfasst korrigierende Unterweisung und Zucht. „Erziehen“ bewahrt diese pädagogische Weite besser als das enger strafende „disziplinieren“.
- source_word: μετάνοια
  choice: Umkehr
  rationale: „Umkehr“ bezeichnet die geforderte grundlegende Änderung von Haltung und Verhalten und ist in modernem Deutsch verständlicher als „Buße“, ohne den theologischen Ernst abzuschwächen.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  choice: indem ihr die Knie eures Herzens beugt
  rationale: Die auffällige Körpermetapher des griechischen Textes wird formal bewahrt; sie drückt innere Demut und Unterwerfung aus.
theological_decisions:
- issue: Art und Ziel der geforderten Zurechtweisung
  choice: „lasst euch zur Umkehr erziehen“
  alternative: „lasst euch mit dem Ziel der Umkehr zurechtweisen“
  rationale: εἰς μετάνοιαν kann Ziel oder Ausrichtung bezeichnen. Die gewählte Fassung erhält die Bewegung hin zur Umkehr, ohne zu behaupten, die Zurechtweisung selbst sei bereits die Umkehr.
- issue: Unterordnung unter die Ältesten
  choice: direkter Imperativ ohne konfessionelle Ausdeutung
  alternative: Interpretation als Gehorsam gegenüber einem später entwickelten kirchlichen Amtssystem
  rationale: Der Text fordert die Verursacher des Konflikts zur Unterordnung unter die konkreten Ältesten auf. Weitergehende Aussagen über spätere Kirchenverfassungen werden nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „Ihr nun“ bildet die folgernde und betonte griechische Eröffnung knapp ab. Die Herz-Knie-Metapher bleibt wegen ihrer rhetorischen und geistlichen Prägnanz unverändert erhalten.
