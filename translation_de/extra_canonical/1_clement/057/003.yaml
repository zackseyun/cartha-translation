base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: de
  text: 'Denn so spricht die vollkommen tugendhafte Weisheit: »Siehe, ich werde euch einen Ausspruch aus meinem Atem hervorströmen lassen und euch mein Wort lehren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανάρετος
  choice: vollkommen tugendhaft
  rationale: Gibt die umfassende Bedeutung »mit jeder Tugend ausgestattet« würdevoll und verständlich wieder.
- source_word: προΐομαι
  choice: ausströmen lassen
  rationale: Bewahrt in Verbindung mit πνοή das Bild eines aus dem Atem hervorgehenden Ausspruchs, ohne das Verb auf ein bloßes »sagen« zu reduzieren.
- source_word: πνοῆς
  choice: Atem
  rationale: Die konkrete Atemmetaphorik des griechischen Textes bleibt erhalten.
- source_word: ῥῆσιν
  choice: Ausspruch
  rationale: Unterscheidet den geäußerten Spruch von λόγος und bildet den poetischen Parallelismus ab.
- source_word: λόγον
  choice: Wort
  rationale: Entspricht der üblichen Bedeutung von λόγος und wahrt die bewusste Unterscheidung zu ῥῆσις.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: die vollkommen tugendhafte Weisheit
  alternative: die Weisheit, die alle Tugend besitzt
  rationale: Die personifizierte Weisheit und ihre qualifizierende Bezeichnung werden erhalten, ohne eine zusätzliche dogmatische Identifikation vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält die poetische Atem- und Wortmetaphorik sowie die Unterscheidung zwischen ῥῆσις und λόγος bei.
