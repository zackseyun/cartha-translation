revisions:
- from: Lernt, euch unterzuordnen, und legt den anmaßenden und hochmütigen Eigensinn eurer Zunge ab. Denn es ist besser für euch, in der Herde Christi als gering und dazugezählt[a] erfunden zu werden, als den Anschein zu erwecken, über anderen zu stehen, und aus seiner Hoffnung ausgeschlossen zu werden.[b]
  to: Lernt, euch unterzuordnen, und legt den anmaßenden und hochmütigen Eigensinn eurer Zunge ab. Denn es ist besser für euch, in der Herde Christi als gering und dazugezählt[a] erfunden zu werden, als aus seiner Hoffnung[b] ausgeschlossen zu werden, während ihr meint, über anderen zu stehen.
  rationale: Die Revision verdeutlicht die syntaktische Funktion des griechischen Partizips δοκοῦντας durch »während ihr meint« und setzt den zweiten Fußnotenanker an die erläuterte Wendung. Die vorsichtige Hauptwiedergabe von ἐλλογίμους und die alternative Lesart in der Fußnote bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Aufforderung zur Unterordnung, die polemische Charakterisierung der Zunge, das Bild der Herde Christi sowie den Kontrast zwischen bescheidener Zugehörigkeit und Ausschluss insgesamt treffend wieder. »dazugezählt« ist für ἐλλογίμους im Kontext des Gegenbilds »hinausgeworfen« gut vertretbar; die Fußnote wahrt die lexikalisch mögliche Bedeutung »angesehen/geachtet«. Die Partizipialkonstruktion καθ’ ὑπεροχὴν δοκοῦντας sollte jedoch klar als begleitender Umstand des Ausgeschlossenwerdens formuliert werden, nicht als gleichrangige Handlung.
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. Die bisherige Verbindung »als den Anschein zu erwecken … und … ausgeschlossen zu werden« ist syntaktisch möglich, lässt aber den griechischen Zusammenhang weniger klar erkennen. »während ihr meint, über anderen zu stehen« ist direkter und natürlicher. Der Fußnotenanker zu »seiner Hoffnung« sollte unmittelbar bei dieser Wendung stehen.
  terminology: »Herde Christi«, »Eigensinn«, »dazugezählt« und »ausgeschlossen« sind kontextgerecht. »Christi« gibt τοῦ Χριστοῦ angemessen wieder. »seiner Hoffnung« bewahrt die knappe, nicht weiter erklärte Genitivverbindung des Griechischen.
