source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: de
  text: Lernt, euch unterzuordnen, und legt den anmaßenden und hochmütigen Eigensinn eurer Zunge ab. Denn es ist besser für euch, in der Herde Christi als gering und dazugezählt[a] erfunden zu werden, als aus seiner Hoffnung[b] ausgeschlossen zu werden, während ihr meint, über anderen zu stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gering und angesehen« bzw. »geachtet«.'
    reason: ἐλλογίμους kann entweder das Dazugerechnetwerden beziehungsweise die anerkannte Zugehörigkeit oder das Angesehensein bezeichnen.
  - marker: b
    text: 'Wörtlich: »aus seiner Hoffnung hinausgeworfen zu werden«; »seiner« kann auch die Hoffnung auf Christus oder die von ihm gegebene Hoffnung meinen.'
    reason: Die griechische Genitivverbindung ἐκ τῆς ἐλπίδος αὐτοῦ lässt Art und Bezug der Zugehörigkeit offen.
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: euch unterzuordnen
  rationale: Der mediale Infinitiv bezeichnet die Bereitschaft, sich einer Ordnung oder Leitung zu unterstellen; die reflexive Wiedergabe bewahrt diese Nuance.
- source_word: αὐθάδειαν
  choice: Eigensinn
  rationale: Das Wort bezeichnet selbstherrliche Eigenwilligkeit bzw. anmaßende Hartnäckigkeit. „Eigensinn“ passt zur Zunge und wird durch „anmaßend und hochmütig“ näher bestimmt.
- source_word: ἐλλογίμους
  choice: dazugezählt
  rationale: Im Gegensatz zum Ausschluss aus der Hoffnung liegt hier wahrscheinlich der Sinn „mitgerechnet, als zugehörig angesehen“ nahe. Da auch „angesehen, geachtet“ lexikalisch möglich ist, wird die Alternative in einer Fußnote bewahrt.
- source_word: καθ’ ὑπεροχὴν δοκοῦντας
  choice: den Anschein zu erwecken, über anderen zu stehen
  rationale: Die Formulierung gibt sowohl δοκοῦντας („scheinen, den Eindruck machen“) als auch ὑπεροχή („Vorrang, Überlegenheit“) in natürlichem Deutsch wieder.
- source_word: ἐκβληθῆναι
  choice: ausgeschlossen zu werden
  rationale: Wörtlich „hinausgeworfen zu werden“; im Gegenüber zur Zugehörigkeit zur Herde ist „ausgeschlossen“ idiomatisch und erhält die soziale wie heilsgeschichtliche Schärfe.
theological_decisions:
- issue: Bedeutung von τοῦ Χριστοῦ
  choice: Christi
  alternative: des Messias
  rationale: Χριστός dient hier im frühchristlichen Gemeindekontext als etablierte Bezeichnung bzw. Name. „Christus“ bewahrt den griechischen Ausdruck, ohne einen zusätzlichen sozioreligiösen Akzent einzutragen.
- issue: Bezug von αὐτοῦ in ἐκ τῆς ἐλπίδος αὐτοῦ
  choice: aus seiner Hoffnung
  alternative: aus der Hoffnung auf ihn / aus der von ihm gegebenen Hoffnung
  rationale: Der Genitiv ist knapp und kann unterschiedlich verstanden werden. Die formal offene Wiedergabe „seiner Hoffnung“ vermeidet es, den Bezug eigenmächtig als Hoffnung auf Christus oder als von Christus gewährte Hoffnung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ bleibt direkt, aber nicht altertümlich. Die Bildfelder von Herde, Zugehörigkeit und Ausschluss werden beibehalten; lexikalische und genitivische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
