reference: 1 Clement 57:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: de
  text: Denn weil sie den Unerfahrenen[a] Unrecht taten, werden sie getötet, und eine Untersuchung wird die Gottlosen vernichten. Wer aber auf mich hört, wird voller Vertrauen in Hoffnung wohnen und ohne Furcht vor allem Übel Ruhe finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Unmündigen; möglicherweise auch: den Arglosen.'
    reason: νηπίους kann Unerfahrenheit, Unreife oder schutzbedürftige Arglosigkeit bezeichnen; „unschuldig“ wäre stärker moralisch festgelegt.
lexical_decisions:
- source_word: νηπίους
  choice: den Unerfahrenen
  rationale: Das Wort bezeichnet hier im Kontext der Weisheitsliteratur eher unerfahrene, leicht beeinflussbare Menschen als moralisch Schuldlose. „Unerfahrene“ gibt diese Kategorie in natürlichem modernem Deutsch wieder, ohne die Schutzbedürftigkeit auszublenden.
- source_word: ἐξέτασμος
  choice: eine Untersuchung
  rationale: Das seltene Substantiv bezeichnet eine Prüfung beziehungsweise eingehende Untersuchung; „Untersuchung“ wahrt den sachlich-gerichtlichen Klang.
- source_word: κατασκηνώσει
  choice: wird … wohnen
  rationale: Das Verb kann wörtlich „sich lagern“ oder „Wohnung nehmen“ bedeuten. „Wohnen“ ist im Deutschen natürlich und bewahrt das Bild dauerhafter Geborgenheit.
- source_word: ἡσυχάσει
  choice: wird … Ruhe finden
  rationale: Die Wendung gibt den Sinn von ruhig und ungestört sein idiomatisch wieder, ohne die Aussage auf bloßes Schweigen zu verengen.
- source_word: ἀπὸ παντὸς κακοῦ
  choice: vor allem Bösen
  rationale: Mit dem Ausdruck der Furchtlosigkeit ist „vor“ im Deutschen idiomatisch; „alles Böse“ lässt offen, ob Übel, Unheil oder moralisch Böses gemeint ist.
theological_decisions:
- issue: Bedeutung von νηπίους
  choice: den Unerfahrenen
  alternative: den Unschuldigen / den Unmündigen
  rationale: Die Weisheitstradition verwendet den Ausdruck für naive oder noch nicht verständige Menschen. Die Übersetzung vermeidet daher die zusätzliche Behauptung moralischer Schuldlosigkeit.
- issue: Bezug von ἐπ’ ἐλπίδι πεποιθώς
  choice: in Hoffnung wohnen, voller Vertrauen
  alternative: sicher wohnen, weil er vertraut
  rationale: Die Formulierung bewahrt sowohl Hoffnung als auch Vertrauen ausdrücklich und löst ihre knappe syntaktische Beziehung nicht dogmatisch auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch einen Satzpunkt und idiomatische Wendungen lesbar gestaltet. Der Wechsel zwischen Gericht über die Gottlosen und Ruhe für den Hörenden bleibt deutlich.
