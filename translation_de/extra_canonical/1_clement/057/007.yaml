  to: Denn weil sie den Unerfahrenen[a] Unrecht taten, werden sie getötet, und eine Untersuchung wird die Gottlosen vernichten. Wer aber auf mich hört, wird voller Vertrauen in Hoffnung wohnen und ohne Furcht vor allem Übel Ruhe finden.
