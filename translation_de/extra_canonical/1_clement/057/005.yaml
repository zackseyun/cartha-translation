id: 1CLEM.57.5
reference: 1 Clement 57:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: de
  text: Denn wenn ihr mich anruft, werde ich euch nicht erhören; böse Menschen werden mich suchen und nicht finden. Denn sie hassten die Weisheit, die Furcht des Herrn aber erwählten sie nicht; sie wollten auch nicht auf meine Ratschläge hören, sondern verspotteten meine Zurechtweisungen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ
  choice: anruft
  rationale: Gibt den direkten Appell an die redende Weisheit natürlich und präzise wieder.
- source_word: οὐκ εἰσακούσομαι ὑμῶν
  choice: werde ich euch nicht erhören
  rationale: „Erhören“ bewahrt gegenüber bloßem „hören“ den Sinn einer verweigerten Antwort auf den Hilferuf.
- source_word: κακοὶ
  choice: Böse Menschen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch Böse; die Ergänzung „Menschen“ ist im Deutschen klar und inklusiv.
- source_word: φόβον τοῦ κυρίου
  choice: Furcht des Herrn
  rationale: Bewahrt die traditionelle und theologisch offene Formulierung, ohne sie auf Ehrfurcht allein einzuengen.
- source_word: βουλαῖς
  choice: Ratschläge
  rationale: Passt zum Kontext der personifizierten Weisheit und gibt ihre richtungsweisenden Weisungen verständlich wieder.
- source_word: ἐλέγχους
  choice: Zurechtweisungen
  rationale: Bezeichnet tadelnde Korrektur; „Zurechtweisungen“ ist modern verständlich und wahrt die Schärfe des Ausdrucks.
theological_decisions:
- issue: Gottesfurcht als Haltung
  choice: Furcht des Herrn
  alternative: Ehrfurcht vor dem Herrn
  rationale: Die wörtlichere Form bewahrt die semantische und theologische Spannung von φόβος, die sowohl Furcht als auch ehrfürchtige Gottesbindung umfassen kann.
- issue: Identität der sprechenden Gestalt
  choice: Das grammatische Ich bleibt ohne erklärenden Zusatz stehen.
  alternative: Explizite Bezeichnung als Weisheit oder als Gott
  rationale: Der Vers setzt seinen literarischen Kontext voraus; eine ausdrückliche Identifikation würde eine im vorliegenden Satz nicht ausformulierte Deutung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die direkte und warnende Tonlage des griechischen Textes bleibt erhalten; unnötige Archaismen werden vermieden.
