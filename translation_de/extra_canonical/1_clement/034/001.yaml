source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἀγαθὸς ἐργάτης μετὰ παρρησίας λαμβάνει τὸν ἄρτον τοῦ ἔργου αὐτοῦ, ὁ νωθρὸς καὶ παρειμένος οὐκ ἀντοφθαλμεῖ τῷ ἐργοδότῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: de
  text: Der gute Arbeiter empfängt mit Zuversicht das Brot seiner Arbeit; der Träge und Nachlässige aber kann seinem Arbeitgeber nicht in die Augen sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἐργάτης
  choice: der gute Arbeiter
  rationale: Gibt die Wendung unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: μετὰ παρρησίας
  choice: mit Zuversicht
  rationale: παρρησία bezeichnet hier ein berechtigtes, freies und selbstsicheres Auftreten; „Zuversicht“ bewahrt diesen Sinn, ohne unnatürlich „Freimütigkeit“ zu formulieren.
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: den Lohn für seine Arbeit
  rationale: Wörtlich steht „das Brot seiner Arbeit“. Im Zusammenhang bezeichnet die bildhafte Wendung den verdienten Lebensunterhalt beziehungsweise Arbeitslohn; die funktionale Wiedergabe ist im Deutschen klarer.
- source_word: νωθρὸς καὶ παρειμένος
  choice: träge und nachlässig
  rationale: νωθρός bezeichnet Trägheit, παρειμένος ein Nachlassen beziehungsweise Sich-gehen-Lassen; das Wortpaar wahrt beide Aspekte.
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: wagt … nicht in die Augen zu sehen
  rationale: Das Verb bedeutet, jemandem von Angesicht zu Angesicht beziehungsweise mit festem Blick entgegenzutreten. Die deutsche Redewendung trifft die durch Schuld oder fehlende Leistung bedingte Scheu.
- source_word: τῷ ἐργοδότῃ αὐτοῦ
  choice: seinem Arbeitgeber
  rationale: ἐργοδότης ist derjenige, der Arbeit gibt beziehungsweise beschäftigt; „Arbeitgeber“ ist die genaue und natürliche moderne Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die metaphorische Formulierung „Brot seiner Arbeit“ wird zugunsten des im Kontext gemeinten „Lohns für seine Arbeit“ dynamisch wiedergegeben; der Gegensatz zwischen berechtigter Zuversicht und beschämter Scheu bleibt erhalten.
