base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/004.yaml
  text: Therefore he urges us, who believe in him with our whole heart, not to be idle or negligent in every good work.
translation:
  language: de
  text: Darum ermahnt er uns, die wir von ganzem Herzen an ihn glauben, in keinem guten Werk untätig oder nachlässig zu sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  choice: ermahnt
  rationale: Gibt den auffordernden und anspornenden Sinn des Verbs in einem würdigen, heute verständlichen Deutsch wieder.
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: die wir von ganzem Herzen an ihn glauben
  rationale: Bewahrt die partizipiale Charakterisierung der Angesprochenen und gibt ἐπ᾽ αὐτῷ idiomatisch als „an ihn glauben“ wieder.
- source_word: μὴ ἀργοὺς μηδὲ παρειμένους εἶναι
  choice: nicht untätig oder nachlässig zu sein
  rationale: ἀργός bezeichnet Untätigkeit; παρειμένος hat hier den übertragenen Sinn von schlaff, nachlässig oder ohne Eifer.
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: bei keinem guten Werk
  rationale: 'Die griechische Verbindung der Verneinung mit πᾶν wird im Deutschen natürlich distributiv wiedergegeben: Es soll kein gutes Werk von Untätigkeit oder Nachlässigkeit betroffen sein.'
theological_decisions:
- issue: Bezug von αὐτῷ
  choice: „an ihn“ ohne ausdrückliche Identifizierung
  alternative: „an Gott“ oder „an Christus“
  rationale: Das Pronomen wird entsprechend dem griechischen Text beibehalten; seine Identität ist aus dem weiteren Kontext zu erschließen und wird hier nicht interpretierend festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber mit „bei keinem guten Werk“ idiomatisch und klar formuliert.
