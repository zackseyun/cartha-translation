  source_fidelity: Die Ergänzung „kommt“ hat im vorliegenden griechischen Wortlaut keine ausdrückliche Entsprechung. Auch wenn sie durch den Jesaja-Hintergrund nahegelegt sein kann, sollte die Ellipse hier nicht durch eine inhaltliche Ergänzung festgelegt werden. πρὸ προσώπου αὐτοῦ bezeichnet wörtlich „vor ihm/vor seinem Angesicht“ und nicht einfach „bei ihm“.
  naturalness: „Denn er sagt uns im Voraus“ ist verständlich, aber „Denn er sagt uns voraus“ ist im heutigen Standarddeutsch idiomatischer. Die bewusst elliptische Zitatform ist im würdigen Schriftzitatton tragfähig.
  terminology: „Herr“, „Lohn“, „vergelten“ und „Werk“ sind sachgerecht und bewahren die offene, sowohl positiv als auch gerichtlich deutbare Vergeltungssprache. „Vor ihm“ bildet die räumliche Metapher genauer ab als „bei ihm“.
