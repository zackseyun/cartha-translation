source:
  edition: Funk 1901 (normalized OCR)
  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: de
  text: 'Denn er sagt uns voraus: „Siehe, der Herr, und sein Lohn ist vor ihm, um jedem nach seinem Werk zu vergelten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  choice: sagt … im Voraus
  rationale: Gibt die Grundbedeutung „vorher sagen“ eng wieder, ohne die zusätzliche Bedeutung „warnen“ einzutragen.
- source_word: Ἰδοὺ ὁ κύριος
  choice: Siehe, der Herr kommt
  rationale: Der griechische Nominalsatz lässt das Verb unausgesprochen; im Zusammenhang der zitierten Schriftstellen (vgl. Jes 40,10; 62,11) ist das Kommen des Herrn gemeint. Das ergänzte „kommt“ ergibt natürliches Deutsch.
- source_word: ὁ μισθὸς αὐτοῦ
  choice: sein Lohn
  rationale: „Lohn“ bewahrt die mögliche positive wie auch vergeltende Bedeutung von μισθός.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: bei ihm
  rationale: Natürliches Deutsch für die räumliche Wendung „vor seinem Angesicht/ihm voraus“; vermeidet das unübliche „vor seinem Angesicht“.
- source_word: ἀποδοῦναι
  choice: um … zu vergelten
  rationale: Gibt das Zurückerstatten beziehungsweise Zumessen nach dem Werk wieder und passt sowohl auf Belohnung als auch Gericht.
- source_word: ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ
  choice: jedem nach seinem Werk
  rationale: Bewahrt den Singular und die individuelle Zumessung der griechischen Formulierung.
theological_decisions:
- issue: Ergänzung eines Verbs in Ἰδοὺ ὁ κύριος
  choice: „der Herr kommt“
  alternative: „siehe, der Herr“
  rationale: Das Griechische ist elliptisch. „Kommt“ macht den aus dem Schriftzitat und Kontext erschließbaren Sinn verständlich, ohne die Identität oder Art des Gerichts weiter festzulegen.
- issue: Art der Vergeltung
  choice: „Lohn“ und „vergelten“
  alternative: „Belohnung“ und „zurückzahlen“
  rationale: Die gewählte Formulierung lässt offen, ob die jeweilige Vergeltung positiv oder negativ ausfällt, und bewahrt so die theologische Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schriftsprachlichem Zitatton. Die Einleitung bleibt formal nah am Griechischen; die elliptische Zitatform wird für verständliches Deutsch behutsam ergänzt.
