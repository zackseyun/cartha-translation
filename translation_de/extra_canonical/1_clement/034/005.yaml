source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: de
  text: Unser Ruhm und unser Freimut sollen in ihm sein. Ordnen wir uns seinem Willen unter. Betrachten wir die ganze Schar seiner Engel und sehen wir, wie sie vor ihm stehen und seinem Willen dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καύχημα
  choice: unser Ruhm
  rationale: Gibt das Rühmen beziehungsweise den Grund des Rühmens natürlich wieder, ohne die im Deutschen überwiegend negative Färbung von „Prahlerei“ einzutragen.
- source_word: ἡ παρρησία
  choice: unsere Zuversicht
  rationale: Im Zusammenhang bezeichnet das Wort freimütiges, vertrauensvolles Auftreten; „Zuversicht“ ist hier verständlich und würdevoll, auch wenn es den Aspekt der Freimütigkeit weniger ausdrücklich wiedergibt.
- source_word: ὑποτασσώμεθα
  choice: Ordnen wir uns ... unter
  rationale: Bewahrt den voluntativen Aufforderungscharakter und die Bedeutung freiwilliger Unterordnung.
- source_word: τὸ πᾶν πλῆθος
  choice: die ganze Schar
  rationale: „Schar“ ist für die Gesamtheit der Engel idiomatisch und wahrt den korporativen Sinn von πλῆθος.
- source_word: λειτουργοῦσιν
  choice: dienen
  rationale: Bezeichnet hier den Dienst der Engel; „dienen“ ist natürlich und vermeidet eine unnötige Einengung auf einen späteren liturgischen Fachgebrauch.
- source_word: παρεστῶτες
  choice: vor ihm stehen
  rationale: Gibt das vollendete Partizip als anhaltende Stellung in Gottes Gegenwart wieder. Das im Griechischen implizite Bezugsobjekt wird zur natürlichen deutschen Verständlichkeit als „ihm“ ausgedrückt.
theological_decisions:
- issue: Bezug von „ihm/seinem“
  choice: Die Pronomen bleiben unbestimmt auf den im Kontext genannten göttlichen Bezug gerichtet.
  alternative: Den Referenten ausdrücklich als „Gott“ benennen.
  rationale: Der griechische Vers verwendet ausschließlich Pronomen; eine ausdrückliche Benennung würde die Vorlage unnötig explizieren.
- issue: Dienst „seinem Willen“
  choice: „seinem Willen dienen“
  alternative: „nach seinem Willen dienen“ oder „seinen Willen ausführen“
  rationale: Die ungewöhnliche Dativverbindung τῷ θελήματι αὐτοῦ wird formal bewahrt, ohne sie eindeutig als Norm, Auftrag oder Nutznießer des Dienstes festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Aufforderungssätzen. Die parallele Struktur des Griechischen bleibt erhalten; „Wie“ nach dem Doppelpunkt hebt die betrachtete Weise des Engeldienstes hervor.
