source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: de
  text: 'Denn die Schrift sagt: „Myriaden über Myriaden standen vor ihm, und Tausende über Tausende dienten ihm, und sie riefen: ‚Heilig, heilig, heilig ist der Herr Zebaot[a]; die ganze Schöpfung ist voll seiner Herrlichkeit.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zebaot ist die aus dem Hebräischen übernommene Bezeichnung für „Heerscharen“; der Titel bedeutet „Herr der Heerscharen“.
    reason: Der traditionelle Name ist vielen heutigen Lesern nicht ohne Erklärung verständlich.
lexical_decisions:
- source_word: Μύριαι μυριάδες
  choice: Myriaden über Myriaden
  rationale: Bewahrt die bewusst unermessliche Zahlenangabe des Griechischen und klingt im modernen Deutschen natürlicher als das wörtlichere „Myriaden von Myriaden“.
- source_word: παρειστήκεισαν αὐτῷ
  choice: standen vor ihm
  rationale: Gibt die Vorstellung wieder, dass die unzählbare Menge in seiner Gegenwart und zu seinem Dienst bereitstand; „standen ihm zur Seite“ könnte fälschlich Gleichrangigkeit oder Beistand in Not nahelegen.
- source_word: ἐλειτούργουν αὐτῷ
  choice: dienten ihm
  rationale: Das Verb bezeichnet hier den vollzogenen Dienst vor Gott. „Verrichteten Priesterdienst“ wäre enger als der Kontext verlangt.
- source_word: κύριος σαβαώθ
  choice: Herr Zebaot
  rationale: Übernimmt den im Deutschen etablierten biblischen Namenstitel und lässt zugleich erkennen, dass der griechische Text das semitische Wort σαβαώθ transliteriert.
- source_word: πᾶσα ἡ κτίσις
  choice: die ganze Schöpfung
  rationale: Entspricht unmittelbar dem griechischen κτίσις und erhält Clements gegenüber Jesaja weiter gefasste Formulierung.
theological_decisions:
- issue: Umfang dessen, was von Gottes Herrlichkeit erfüllt ist
  choice: die ganze Schöpfung
  alternative: die ganze Erde
  rationale: Obwohl der Ruf Jesaja 6,3 aufgreift, steht bei Clemens ausdrücklich κτίσις („Schöpfung“), nicht γῆ („Erde“). Diese Erweiterung darf nicht an den Wortlaut der alttestamentlichen Vorlage angeglichen werden.
- issue: Bedeutung von „Zebaot“
  choice: Titel im Haupttext beibehalten und in einer Fußnote erklären
  alternative: im Haupttext mit „Herr der Heerscharen“ übersetzen
  rationale: So bleibt die ausdrücklich transliterierte Form des griechischen Textes sichtbar, während die Fußnote heutigen Lesern ihre Bedeutung erschließt.
translation_notes:
  register: Dignifiziöses, aber allgemein verständliches Standarddeutsch. Die parallelen Mengenangaben und der dreifache Heilig-Ruf bleiben als feierliche, poetische Strukturen erhalten. Die beiden Zitate sind entsprechend der griechischen Satzfügung getrennt, ohne ihre enge Verbindung aufzulösen.
