  text: δεῖν οὖν ἐστὶ προθύμους ἡμᾶς εἶναι εἰς ἀγαθοποιΐαν· ἐξ αὐτοῦ γάρ ἐστιν τὰ πάντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/002.yaml
  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: de
  text: Darum müssen wir mit Eifer Gutes tun; denn alles ist aus ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθύμους
  choice: mit Eifer
  rationale: Gibt die willige, tatbereite Haltung des griechischen Adjektivs natürlich und würdig wieder, ohne bloßen Aktionismus auszudrücken.
- source_word: ἀγαθοποιΐαν
  choice: Gutes tun
  rationale: Die Tätigkeitsbezeichnung meint das praktische Tun des Guten; die verbale deutsche Wendung ist natürlicher als ein abstraktes Substantiv.
- source_word: ἐξ αὐτοῦ
  choice: aus ihm
  rationale: Bewahrt die knappe Herkunftsaussage und ihre mögliche theologische Anspielung, ohne sie durch »von ihm kommt« weiter auszudeuten.
- source_word: τὰ πάντα
  choice: alles
  rationale: Entspricht der umfassenden Aussage des griechischen Ausdrucks in idiomatischem Deutsch.
theological_decisions:
- issue: Bezug von αὐτοῦ
  choice: Das Pronomen bleibt als »ihm« stehen.
  alternative: Den Bezug ausdrücklich als »Gott« wiedergeben.
  rationale: Der griechische Text verwendet ein Pronomen; die Übersetzung bewahrt diesen Textbezug und vermeidet eine unnötige Explizierung.
- issue: Bedeutung von ἐξ αὐτοῦ ἐστιν τὰ πάντα
  choice: »alles ist aus ihm«
  alternative: »alles kommt von ihm«
  rationale: Die gewählte Form erhält die ontologische beziehungsweise ursprungsbezogene Offenheit der griechischen Formulierung und glättet sie nicht zu einer bloßen Aussage über empfangene Gaben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. »Mit Eifer Gutes tun« verbindet Quellennähe mit natürlicher deutscher Ausdrucksweise.
