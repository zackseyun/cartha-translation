source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: de
  text: Darum lasst auch uns, einträchtig und in gemeinsamer Gesinnung versammelt, wie aus einem Mund inständig zu ihm rufen, damit wir Anteil an seinen großen und herrlichen Verheißungen erhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμονοίᾳ
  choice: einträchtig
  rationale: Gibt die gemeinschaftliche Einmütigkeit natürlich und prägnant wieder.
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: versammelt
  rationale: Die Wendung bezeichnet hier das Zusammenkommen beziehungsweise Versammeltsein; eine ausdrückliche Ortsangabe ist möglich, aber nicht zwingend.
- source_word: τῇ συνειδήσει
  choice: eines Sinnes
  rationale: Im Kontext des gemeinsamen Rufens bezeichnet die Wendung am ehesten eine geteilte innere Haltung. Die wörtlichere Wiedergabe mit „Bewusstsein“ oder „Gewissen“ wird in der Fußnote bewahrt.
- source_word: βοήσωμεν ... ἐκτενῶς
  choice: inständig zu ihm rufen
  rationale: Bewahrt sowohl die kräftige Bedeutung von βοάω als auch die Ernsthaftigkeit und Intensität von ἐκτενῶς.
- source_word: μετόχους ... γενέσθαι
  choice: Anteil ... bekommen
  rationale: Natürliche moderne Wiedergabe des Werdens zu Teilhabern, ohne den Ziel- oder Wunschsinn des Satzes abzuschwächen.
- source_word: ἐπαγγελιῶν
  choice: Verheißungen
  rationale: Im frühchristlichen theologischen Kontext ist „Verheißungen“ die etablierte und sachlich passende Wiedergabe.
theological_decisions:
- issue: Art der Teilhabe an den Verheißungen
  choice: Anteil an seinen ... Verheißungen bekommen
  alternative: Teilhaber seiner ... Verheißungen werden
  rationale: Die Formulierung lässt offen, wie sich die Teilhabe konkret vollzieht, und fügt keine konfessionelle Deutung hinzu.
- issue: Bedeutung von τῇ συνειδήσει
  choice: eines Sinnes
  alternative: mit einem Gewissen / im Bewusstsein
  rationale: Der gemeinschaftliche Kontext stützt eine kollektive innere Ausrichtung; die lexikalisch wörtlichere, aber im Deutschen mehrdeutige Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wie aus einem Mund“ bewahrt das anschauliche Bild des griechischen Textes; „inständig“ hält den eindringlichen Gebetston fest.
