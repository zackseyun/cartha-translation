revisions:
- from: So lasst auch uns, einträchtig versammelt und eines Sinnes,[a] wie aus einem Mund inständig zu ihm rufen, damit wir Anteil an seinen großen und herrlichen Verheißungen bekommen.
  to: Darum lasst auch uns, einträchtig und in gemeinsamer Gesinnung versammelt, wie aus einem Mund inständig zu ihm rufen, damit wir Anteil an seinen großen und herrlichen Verheißungen erhalten.
  rationale: Die Revision bewahrt die Aussage des griechischen Satzes und sein gemeinschaftlich-gebetliches Register. Sie ersetzt die für συνείδησις zu eng auf „Sinn“ festgelegte Formulierung durch „gemeinsame Gesinnung“, verbessert die Fußnotenerläuterung und wählt mit „erhalten“ eine stilistisch passendere Wiedergabe von μετόχους ... γενέσθαι.
  reviewer_model: gpt-5.6-terra
