  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: de
  text: 'Denn er sagt: »Kein Auge hat gesehen und kein Ohr gehört, und in das Herz eines Menschen ist nicht gekommen[a], was er denen bereitet hat, die geduldig auf ihn warten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und auf das Herz eines Menschen ist nicht gestiegen«; gemeint ist: Es ist keinem Menschen ins Herz oder in den Sinn gekommen.'
    reason: Die semitisch geprägte griechische Wendung lässt sich wörtlich nur unnatürlich wiedergeben; die Fußnote dokumentiert ihr Bild und ihre idiomatische Bedeutung.
lexical_decisions:
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: ist nicht in das Herz eines Menschen gekommen
  rationale: Die griechische, semitisch geprägte Wendung bedeutet, dass etwas einem Menschen nicht ins Herz beziehungsweise in den Sinn gekommen ist. Die gewählte Form wahrt das Bild des Herzens und klingt zugleich verständlich.
- source_word: ὅσα
  choice: was
  rationale: Das substantivierte neutrale Pluralpronomen bezeichnet hier zusammenfassend all das, was Gott bereitet hat; im Deutschen ist der singularische Sammelausdruck „was“ natürlich.
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: denen, die geduldig auf ihn warten
  rationale: ὑπομένω mit Personenobjekt kann geduldiges Erwarten bezeichnen. „Geduldig auf ihn warten“ gibt sowohl das Ausharren als auch die Ausrichtung auf ihn wieder.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von ἡτοίμασεν
  choice: er
  alternative: Gott
  rationale: Der griechische Text hat nur die männliche Verbform im Singular; die Übersetzung bewahrt diese implizite Bezugnahme, statt den Namen Gottes ergänzend einzusetzen.
- issue: Bedeutung von ὑπομένουσιν αὐτόν
  choice: die geduldig auf ihn warten
  alternative: die um seinetwillen ausharren
  rationale: Die transitive Konstruktion spricht am ehesten vom geduldigen Warten auf ihn. Die mögliche Nuance des Ausharrens bleibt durch „geduldig“ hörbar, ohne eine bestimmte Verfolgungs- oder Bewährungssituation in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Herz-Metaphorik. Die leicht feierliche Reihung folgt dem griechischen Zitat, ohne einen schwer verständlichen deutschen Satzbau zu erzeugen.
