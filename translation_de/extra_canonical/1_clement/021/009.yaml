id: 1CLEM.21.9
reference: 1 Clement 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: de
  text: Denn er erforscht Gedanken und Absichten; sein Lebenshauch ist in uns, und wann immer er will, wird er ihn wegnehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: er erforscht
  rationale: Die verbale Wiedergabe klingt im modernen Deutschen natürlicher als das substantivische „Erforscher“, bewahrt aber die Aussage, dass Gott das Innere prüfend durchdringt.
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  choice: Gedanken und Absichten
  rationale: „Gedanken“ gibt ἔννοιαι allgemein wieder; „Absichten“ bringt bei ἐνθυμήσεις die inneren Erwägungen beziehungsweise Beweggründe verständlich zum Ausdruck, ohne die Begriffe gleichzusetzen.
- source_word: ἡ πνοὴ αὐτοῦ
  choice: sein Lebenshauch
  rationale: πνοή bezeichnet Atem oder Hauch. „Lebenshauch“ macht im Zusammenhang deutlich, dass es um den von Gott verliehenen Atem des Lebens geht, und erhält zugleich das Bild des Atems.
- source_word: ἀνελεῖ αὐτήν
  choice: nimmt er ihn weg
  rationale: ἀναιρέω bedeutet hier „wegnehmen“ und bezieht sich grammatisch auf πνοή. Das Pronomen „ihn“ folgt im Deutschen dem maskulinen „Lebenshauch“; das Präsens ist als lebendige, allgemeingültige Zukunftsaussage natürlich.
theological_decisions:
- issue: Bezug von „sein Lebenshauch“
  choice: Der Text bezeichnet den in Menschen gegenwärtigen Lebenshauch als Gottes Hauch.
  alternative: Nur neutral „sein Atem“ oder „der Atem“ wiederzugeben.
  rationale: Das Possessivpronomen αὐτοῦ wird ausdrücklich bewahrt. „Lebenshauch“ verdeutlicht den Kontext von verliehenem und wieder genommenem Leben, ohne eine weitergehende Lehre über den Geist Gottes einzutragen.
- issue: Zeitwert von ἀνελεῖ
  choice: „nimmt er ihn weg“
  alternative: „wird er ihn wegnehmen“
  rationale: Die griechische Futurform bezeichnet, was Gott nach seinem Willen tun wird. Nach „wann immer“ klingt im Deutschen das Präsens idiomatischer und bewahrt den generischen Charakter der Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon bewahrt den engen Zusammenhang zwischen Gottes Erforschung des Inneren und seiner Verfügung über den Lebenshauch. Keine Fußnoten erforderlich.
