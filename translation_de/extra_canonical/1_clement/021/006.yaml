  to: Lasst uns Ehrfurcht vor dem Herrn Jesus Christus[a] haben, dessen Blut für uns gegeben wurde; lasst uns die achten, die uns vorangehen; lasst uns die Ältesten[b] ehren; lasst uns die jungen Menschen in Gottesfurcht erziehen[c]; lasst uns unsere Frauen zum Guten anhalten.
