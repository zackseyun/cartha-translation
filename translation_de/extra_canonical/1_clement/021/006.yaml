id: 1CLEM.21.6
reference: 1 Clement 21:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: de
  text: Lasst uns Ehrfurcht vor dem Herrn Jesus Christus[a] haben, dessen Blut für uns gegeben wurde; lasst uns die achten, die uns vorangehen; lasst uns die Ältesten[b] ehren; lasst uns die jungen Menschen in Gottesfurcht erziehen[c]; lasst uns unsere Frauen zum Guten anhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Herrn Jesus, dem Messias«.'
    reason: Χριστός kann als Titel »Messias« hervorgehoben werden; κύριον (»Herrn«) bleibt dabei erhalten.
  - marker: b
    text: 'Oder: »die Älteren«.'
    reason: πρεσβύτεροι kann ältere Menschen oder gemeindliche Älteste bezeichnen.
  - marker: c
    text: 'Wörtlicher: »in der Erziehung der Gottesfurcht«; der Genitiv kann auch die Erziehung bezeichnen, die in der Gottesfurcht besteht.'
    reason: Die Beziehung zwischen παιδεία und φόβος θεοῦ ist im Griechischen nicht vollständig festgelegt.
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: mit Ehrfurcht begegnen
  rationale: Das Verb bezeichnet hier ehrfürchtige Scheu beziehungsweise respektvolle Rücksicht gegenüber einer Person. Die Formulierung gibt dies in natürlichem modernem Deutsch wieder, ohne es auf bloße Angst oder Scham zu verengen.
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: die, die uns vorangehen
  rationale: Die wörtlich-nahe Wendung bewahrt, dass προηγεῖσθαι sowohl tatsächliches Vorangehen als auch leitende Stellung bezeichnen kann, ohne vorschnell ein formales Amt anzunehmen.
- source_word: τοὺς πρεσβυτέρους
  choice: die Ältesten
  rationale: Die traditionelle und kontextuell passende Wiedergabe lässt sowohl angesehene ältere Menschen als auch gemeindliche Älteste zu; die Alternative wird in einer Fußnote genannt.
- source_word: τοὺς νέους
  choice: die jungen Menschen
  rationale: νέους ist der Positiv und bezeichnet die Jungen beziehungsweise jungen Menschen, nicht ausdrücklich die Jüngeren.
- source_word: παιδεύσωμεν τὴν παιδείαν
  choice: in der Erziehung … anleiten
  rationale: Die Wiedergabe erhält den Gedanken von Bildung, Erziehung und disziplinierender Unterweisung, vermeidet aber im Deutschen die schwerfällige Wiederholung des griechischen Wortstamms.
- source_word: τὰς γυναῖκας ἡμῶν
  choice: unsere Frauen
  rationale: Im haushaltsbezogenen Kontext sind sehr wahrscheinlich die Ehefrauen gemeint. Deutsch „unsere Frauen“ trägt diesen relationalen Sinn natürlich und bewahrt zugleich die lexikalische Nähe zu γυναῖκας.
- source_word: ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα
  choice: zum Guten anhalten
  rationale: Die Formulierung gibt die auf das Gute ausgerichtete korrigierende beziehungsweise lenkende Tätigkeit wieder, ohne einen spezifischeren Inhalt des Guten einzutragen.
theological_decisions:
- issue: Χριστός als Titel oder Name
  choice: Jesus Christus
  alternative: Jesus, der Messias
  rationale: „Jesus Christus“ ist im Deutschen die natürliche und traditionsübergreifend verständliche Wiedergabe; eine Fußnote hält den Titelsinn von Χριστός sichtbar.
- issue: Bedeutung von πρεσβύτεροι
  choice: die Ältesten
  alternative: die Älteren
  rationale: Der Kontext erlaubt eine gemeindliche oder altersbezogene Deutung. Der Haupttext folgt der geläufigen Bezeichnung, während die Fußnote die echte Mehrdeutigkeit bewahrt.
- issue: Genitiv τοῦ φόβου τοῦ θεοῦ
  choice: Erziehung zur Gottesfurcht
  alternative: Erziehung der Gottesfurcht / Erziehung, die in der Gottesfurcht besteht
  rationale: Der deutsche Haupttext drückt den naheliegenden Zielbezug verständlich aus. Da der griechische Genitiv auch epexegetisch oder anders relational verstanden werden kann, wird die engere formale Alternative in der Fußnote offengehalten.
translation_notes:
  register: Wiederholtes „lasst uns“ bewahrt den eindringlichen, gemeinschaftlichen Mahnton des griechischen Abschnitts. Die Sprache ist würdevoll und modern; semikolonartige Reihung erhält den rhetorischen Rhythmus. Das historisch-patriarchale Gefälle der letzten Aufforderung wird weder abgeschwächt noch durch zusätzliche Deutung verschärft.
