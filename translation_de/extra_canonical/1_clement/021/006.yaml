    rationale: Der griechische Ausdruck lautet τὸν κύριον Ἰησοῦν Χριστόν. Die angebotene Alternative »Jesus, dem Messias« gibt zwar Χριστός als Titel wieder, unterschlägt aber κύριον und ist daher keine vollständige alternative Wiedergabe der markierten Anrede.
  - severity: low
