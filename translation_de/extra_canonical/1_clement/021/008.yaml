source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: de
  text: 'Unsere Kinder sollen an der Erziehung im Messias teilhaben. Sie sollen lernen, was Demut bei Gott vermag,[a] was reine Liebe bei Gott bewirken kann und wie gut und groß die Furcht vor ihm ist: Sie rettet alle, die in ihm[b] in Heiligkeit und mit reinem Denken leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „welche Kraft Demut bei Gott hat“.'
    reason: τί ... ἰσχύει kann als Frage nach der Kraft oder Wirksamkeit der Demut verstanden werden.
  - marker: b
    text: Gemeint ist wahrscheinlich Gott. Grammatisch könnte sich „ihm“ auch auf die zuvor genannte Furcht beziehen.
    reason: ἐν αὐτῷ kann formal an das maskuline Substantiv φόβος („Furcht“) anknüpfen; im Kontext ist der Bezug auf Gott jedoch vorzuziehen.
lexical_decisions:
- source_word: παιδείας
  choice: Erziehung
  rationale: Das Wort umfasst Unterweisung, Formung und Zucht. „Erziehung“ gibt diesen umfassenden Sinn im Zusammenhang mit Kindern natürlich wieder.
- source_word: ἐν Χριστῷ
  choice: im Messias
  rationale: Χριστός ist der griechische Titel für den Gesalbten; „Messias“ macht diesen Titel im Deutschen verständlich und folgt der vorgegebenen terminologischen Linie.
- source_word: ταπεινοφροσύνη ... ἰσχύει
  choice: Demut ... vermag
  rationale: ἰσχύει bezeichnet hier die Kraft oder Wirksamkeit der Demut. „Was ... vermag“ bewahrt die offene Aussage, ohne eine konkrete Wirkung hinzuzufügen.
- source_word: ἀγάπη ἁγνὴ
  choice: reine Liebe
  rationale: ἁγνή bezeichnet sittliche Reinheit und Lauterkeit; „reine Liebe“ ist knapp und quellennah.
- source_word: φόβος αὐτοῦ
  choice: die Furcht vor ihm
  rationale: Der Genitiv bezeichnet hier sachgerecht die auf Gott gerichtete Furcht beziehungsweise Ehrfurcht. „Furcht“ bewahrt zugleich die Stärke des griechischen φόβος.
- source_word: ὁσίως ἀναστρεφομένους
  choice: in Heiligkeit ... leben
  rationale: ἀναστρέφομαι meint die Lebensführung; ὁσίως beschreibt sie als fromm beziehungsweise heilig. Die Formulierung ist im heutigen Deutsch natürlicher als „wandeln“.
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: mit reinem Denken
  rationale: διάνοια bezeichnet Denken, Sinn oder innere Gesinnung. „Denken“ bleibt nah am griechischen Ausdruck und vermeidet eine unnötige Verengung auf Gefühle oder Absichten.
theological_decisions:
- issue: Bezug von ἐν αὐτῷ
  choice: „darin“, auf die Furcht vor Gott bezogen
  alternative: „in ihm“, auf Gott bezogen
  rationale: Das nächstliegende grammatische Bezugswort ist ὁ φόβος; zugleich ist wegen des vorausgehenden αὐτοῦ ein Bezug auf Gott möglich. Der Haupttext folgt dem näheren Bezugswort, während die Fußnote die echte Mehrdeutigkeit wahrt.
- issue: Heilswirkung der Gottesfurcht
  choice: „Sie rettet alle ...“
  alternative: „sie bewahrt alle ...“
  rationale: σῴζων kann retten, bewahren oder heil erhalten bedeuten. „Rettet“ gibt die starke Aussage des Textes wieder, ohne ihre theologische Spannung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallel gebauten Lerninhalte bleiben erkennbar; archaische Wendungen wie „fromm wandeln“ werden vermieden. „Furcht vor ihm“ wahrt die Stärke des Ausgangstextes, während die Fußnote die mögliche Beziehung von ἐν αὐτῷ offenlegt.
