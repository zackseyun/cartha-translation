id: 1CLEM.21.3
reference: 1 Clement 21:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: de
  text: Lasst uns sehen, wie nahe er ist und dass ihm weder unsere Gedanken noch die Überlegungen, die wir anstellen, entgangen sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Lasst uns erkennen
  rationale: Der hortative Aorist wird als gemeinsame Aufforderung wiedergegeben; »erkennen« passt hier natürlicher als das wörtlichere »sehen« zur folgenden Einsicht.
- source_word: ἐγγύς
  choice: nahe
  rationale: Bewahrt die räumlich beziehungsweise gegenwärtig gedachte Nähe ohne zusätzliche theologische Deutung.
- source_word: λέληθεν αὐτόν
  choice: ihm … verborgen bleibt
  rationale: 'Gibt das griechische λανθάνω idiomatisch wieder: Nichts entgeht seiner Wahrnehmung beziehungsweise bleibt ihm unbemerkt.'
- source_word: ἐννοιῶν
  choice: Gedanken
  rationale: Eine verständliche und im Kontext passende Wiedergabe für innere Gedanken oder Vorstellungen.
- source_word: διαλογισμῶν ὧν ποιούμεθα
  choice: Überlegungen, die wir anstellen
  rationale: Unterscheidet διαλογισμοί von den allgemeineren ἔννοιαι und gibt ποιούμεθα in natürlichem Deutsch wieder, ohne die mögliche Bedeutung innerer Erwägungen zu verengen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in »wie nahe er ist«
  choice: Das Pronomen »er« bleibt ohne ergänzende Benennung stehen.
  alternative: »wie nahe Gott ist«
  rationale: Der griechische Text hat lediglich das implizite Subjekt zu ἐστιν; eine ausdrückliche Benennung würde mehr festlegen als dieser Vers selbst.
- issue: Art der Nähe
  choice: »nahe« bleibt semantisch offen.
  alternative: »uns nahe« oder »unmittelbar gegenwärtig«
  rationale: ἐγγύς bezeichnet Nähe, ohne hier ausdrücklich ihren Bezug oder ihre genaue Art zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, wird aber idiomatisch gestaltet; die parallelen inneren Vorgänge »Gedanken« und »Überlegungen« bleiben unterscheidbar.
