id: 1CLEM.21.1
reference: 1 Clement 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: de
  text: Seht zu, Geliebte, dass seine vielen Wohltaten nicht für uns alle zum Gericht werden, wenn wir nicht in einer Weise leben, die seiner würdig ist, und nicht in Eintracht das tun, was vor ihm gut und wohlgefällig ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch die Lebensführung als Bürger innerhalb eines Gemeinwesens bezeichnen.
    reason: lexical_nuance
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht zu
  rationale: Die imperativische Wendung fordert nicht nur zum Sehen, sondern zu wachsamer Sorge auf; „Seht zu“ ist im Deutschen natürlich und prägnant.
- source_word: εὐεργεσίαι
  choice: Wohltaten
  rationale: Das Wort bezeichnet erwiesene Wohltaten beziehungsweise Begünstigungen und bewahrt hier eher die Sprache eines Wohltäters als die allgemeinere Wiedergabe „gute Gaben“.
- source_word: πολιτευόμενοι
  choice: unser Leben … führen
  rationale: Gemeint ist die gesamte Lebensführung; die Fußnote weist auf den bürgerlich-gemeinschaftlichen Beiklang des griechischen Verbs hin.
- source_word: εἰς κρίμα
  choice: zum Gericht
  rationale: „Gericht“ bewahrt die forensische und theologische Aussage, ohne κρίμα vorschnell auf „Verurteilung“ zu verengen.
- source_word: μεθ’ ὁμονοίας
  choice: in Eintracht
  rationale: „Eintracht“ erhält den für 1 Clemens zentralen gemeinschaftlich-politischen Gegenbegriff zu Spaltung und Aufruhr.
- source_word: τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ
  choice: was gut und vor ihm wohlgefällig ist
  rationale: Die Formulierung gibt beide Wertungen wieder und bindet „wohlgefällig“ ausdrücklich an Gottes Gegenwart beziehungsweise Urteil.
theological_decisions:
- issue: Bezug des Pronomens αὐτοῦ
  choice: „seine … seiner … ihm“ ohne ausdrückliche Namensnennung
  alternative: „Gottes … Gottes … Gott“
  rationale: Der Kontext lässt den Bezug auf Gott erkennen, doch der griechische Satz verwendet durchgehend nur das Pronomen. Die Übersetzung wahrt diese Ausdrucksweise, statt die Referenz erklärend einzusetzen.
- issue: Bedeutungsumfang von κρίμα
  choice: „Gericht“
  alternative: „Verurteilung“
  rationale: Das griechische Wort kann je nach Kontext Urteil oder Verurteilung bezeichnen. „Gericht“ erhält den weiteren Bedeutungsraum und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohltaten“ und „Eintracht“ bewahren den gehobenen gemeinschaftlich-politischen Wortschatz des Briefes; der Satzbau bleibt klar und für heutige Leser verständlich.
