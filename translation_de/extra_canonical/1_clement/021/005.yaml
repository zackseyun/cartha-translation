  source_fidelity: 'Die Übersetzung gibt die Vergleichskonstruktion μᾶλλον … ἢ und προσκόψωμεν zutreffend wieder: Es geht darum, eher bei den beschriebenen Menschen als bei Gott Anstoß zu erregen. Die beiden Wertungen ἄφροσι und ἀνοήτοις werden unterscheidbar als „törichten und unverständigen“ erhalten. Die Partizipien ἐπαιρομένοις und ἐγκαυχωμένοις sowie die abschließende Bestimmung ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν sind sachgerecht erfasst.'
  naturalness: Der Satz ist modernes, würdiges und gut verständliches Standarddeutsch. „Bei jemandem Anstoß erregen“ ist idiomatisch und bewahrt gegenüber engeren Optionen wie „beleidigen“ die Breite des griechischen Ausdrucks.
  terminology: „Anstoß erregen“, „sich überheben“ und „sich brüsten“ passen zum moralisch-mahnenden Register des Abschnitts. „Überheblichkeit ihrer eigenen Worte“ gibt die arrogante Färbung von ἀλαζονεία und den Bezug auf ihre Rede angemessen wieder, ohne den Sinn unnötig einzuengen.
