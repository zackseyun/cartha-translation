id: 1CLEM.21.5
reference: 1 Clement 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: de
  text: Lieber wollen wir bei törichten und unverständigen Menschen Anstoß erregen, die sich überheben und sich mit der Überheblichkeit ihrer eigenen Worte brüsten, als bei Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μᾶλλον … ἢ
  choice: lieber … als
  rationale: Gibt die griechische Vorzugs- und Vergleichskonstruktion natürlich und präzise wieder.
- source_word: προσκόψωμεν
  choice: Anstoß erregen
  rationale: Bewahrt das Bild des griechischen Verbs und passt zur Aussage, eher Menschen als Gott Anlass zum Missfallen zu geben.
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: törichten und unverständigen
  rationale: Spiegelt beide wertenden Adjektive, ohne sie zu einem einzigen Begriff zusammenzuziehen.
- source_word: ἐπαιρομένοις
  choice: sich überheben
  rationale: Gibt das passive beziehungsweise mediale Bild des Sich-Erhebens idiomatisch wieder.
- source_word: ἐγκαυχωμένοις
  choice: sich … brüsten
  rationale: Entspricht dem Sinn des prahlerischen Rühmens.
- source_word: ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: mit der Überheblichkeit ihrer eigenen Worte
  rationale: Bewahrt die negative Färbung von ἀλαζονεία und versteht λόγος hier im Kontext als Rede beziehungsweise Worte; „eigenen“ verdeutlicht das rückbezügliche αὐτῶν.
theological_decisions:
- issue: Vergleich zwischen dem Anstoß bei Menschen und bei Gott
  choice: Die verkürzte griechische Vergleichsform wird als „bei … Anstoß erregen … als bei Gott“ wiedergegeben.
  alternative: „lieber Menschen beleidigen als Gott“
  rationale: Die gewählte Fassung vermeidet eine unnötige Festlegung auf bloße persönliche Beleidigung und erhält die metaphorische Breite von προσκόπτω.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, ist aber flüssig und für heutige Leser verständlich.
