source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ που· Πνεῦμα κυρίου λύχνος ἐρευνῶν τὰ ταμιεῖα τῆς γαστρός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/002.yaml
  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
translation:
  language: de
  text: 'Denn irgendwo heißt es: »Der Geist des Herrn ist eine Lampe, die die inneren Kammern[a] des Bauches durchsucht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »Vorratskammern« bedeuten.
    reason: Bewahrt die konkrete lexikalische Alternative von ταμιεῖα, während der Haupttext die kontextuell passendere Bedeutung wiedergibt.
lexical_decisions:
- source_word: ταμιεῖα
  choice: innersten Kammern
  rationale: Das Wort bezeichnet wörtlich Kammern oder Vorratsräume, kann aber auch verborgene Innenräume meinen. Im vorliegenden Spruch bezeichnet es bildhaft die tiefsten, verborgenen Bereiche des Menschen.
- source_word: γαστρός
  choice: des Leibes
  rationale: Der griechische Ausdruck bedeutet wörtlich »des Bauches«. »Des Leibes« bewahrt das körperliche Bild, klingt im Deutschen jedoch würdiger und bezeichnet hier verständlich das Innere des Menschen.
- source_word: λύχνος ἐρευνῶν
  choice: eine Leuchte, die … durchsucht
  rationale: Das maskuline Partizip ἐρευνῶν stimmt grammatisch mit λύχνος überein. Daher wird die Leuchte als das Durchsuchende dargestellt, ohne die Bildsprache zu glätten.
theological_decisions:
- issue: Bezug des suchenden Partizips
  choice: Die Leuchte durchsucht die innersten Kammern.
  alternative: Der Geist des Herrn durchsucht die innersten Kammern.
  rationale: Obwohl der Geist sachlich als Handelnder verstanden werden könnte, bezieht sich das maskuline ἐρευνῶν grammatisch auf den ebenfalls maskulinen λύχνος, nicht auf das neutrale πνεῦμα.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Denn irgendwo heißt es« gibt die unbestimmte Zitierformel λέγει γάρ που knapp wieder. Die ungewöhnliche Metapher der inneren Kammern bleibt erhalten und wird nicht psychologisierend aufgelöst.
