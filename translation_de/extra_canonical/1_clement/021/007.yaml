id: 1CLEM.21.7
reference: 1 Clement 21:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: de
  text: Sie sollen den liebenswerten Charakter der Reinheit erkennen lassen; sie sollen die lautere Gesinnung ihrer Sanftmut unter Beweis stellen; sie sollen die maßvolle Art ihrer Rede durch Schweigen sichtbar machen; ihre Liebe sollen sie nicht nach persönlicher Vorliebe, sondern allen, die Gott fürchten, in heiliger Weise gleichermaßen erweisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιαγάπητον … ἦθος
  choice: liebenswerten Charakter
  rationale: Gibt sowohl die positive Wertung von ἀξιαγάπητος als auch ἦθος im Sinn von Charakter bzw. Wesensart natürlich wieder.
- source_word: ἁγνείας
  choice: Reinheit
  rationale: Bewahrt den umfassenden Sinn moralischer und sittlicher Reinheit, ohne ihn unnötig auf sexuelle Enthaltsamkeit zu verengen.
- source_word: ἀκέραιον … βούλημα
  choice: lautere Gesinnung
  rationale: ἀκέραιος bezeichnet hier Unverdorbenheit bzw. Aufrichtigkeit; βούλημα kann Wille, Absicht oder innere Haltung meinen. „Gesinnung“ passt zum Zusammenhang, ohne bloß einen einzelnen Vorsatz zu bezeichnen.
- source_word: πραΰτητος
  choice: Sanftmut
  rationale: Die traditionelle, weiterhin verständliche Wiedergabe erfasst milde, nicht aggressive Selbstbeherrschung.
- source_word: ἐπιεικὲς τῆς γλώσσης
  choice: maßvolle Art ihrer Rede
  rationale: Überträgt die idiomatische Verbindung von Zunge und maßvoller Milde in natürliches Deutsch, ohne sie als bloße Wortkargheit zu deuten.
- source_word: κατὰ προσκλίσεις
  choice: nach persönlicher Vorliebe
  rationale: πρόσκλισις bezeichnet eine Neigung oder Parteinahme; die Formulierung macht die gemeinte bevorzugende Zuwendung verständlich.
- source_word: ὁσίως ἴσην παρεχέτωσαν
  choice: in heiliger Weise gleichermaßen erweisen
  rationale: Ordnet ὁσίως dem Erweisen der Liebe zu und wahrt mit „gleichermaßen“ die Forderung nach gleicher Liebe.
theological_decisions:
- issue: Bezug von ὁσίως
  choice: „in heiliger Weise“ bestimmt das Erweisen der Liebe.
  alternative: Verbindung mit „die Gott in Heiligkeit fürchten“
  rationale: Die Stellung nach der Gruppe „allen, die Gott fürchten“ lässt syntaktisch beide Bezüge erwägen; adverbiales ὁσίως passt jedoch am unmittelbarsten zum finiten Verb παρεχέτωσαν und beschreibt die gottgemäße Weise, in der Liebe erwiesen werden soll.
- issue: Reichweite von ἁγνεία
  choice: „Reinheit“ bleibt allgemein.
  alternative: „Keuschheit“ als ausdrücklich sexuelle Reinheit
  rationale: Der griechische Begriff kann Keuschheit einschließen, ist hier aber nicht eindeutig darauf beschränkt. Die allgemeinere Wiedergabe bewahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit paralleler Satzstruktur. Die wiederholte Aufforderungsform des Griechischen bleibt erhalten; abstrakte Formulierungen werden dort leicht idiomatisiert, wo eine wörtliche Wiedergabe im Deutschen hölzern wäre.
