base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/004.yaml
  text: Therefore it is right that we should not desert his will[a].
translation:
  language: de
  text: Darum ist es recht, dass wir nicht von seinem Willen abfallen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb ist ein militärischer Ausdruck und bezeichnet das Verlassen des eigenen Postens, also Desertieren.
    reason: Die Übersetzung gibt die mit ἀπό ausgedrückte Abwendung idiomatisch wieder; die Fußnote bewahrt die im Verb enthaltene militärische Bildsprache.
lexical_decisions:
- source_word: δίκαιον
  choice: recht
  rationale: Gibt die moralische Angemessenheit und Verpflichtung des griechischen Ausdrucks knapp und würdig wieder.
- source_word: λειποτακτεῖν … ἀπό
  choice: … den Dienst entziehen
  rationale: Bewahrt die militärische Vorstellung des Verlassens der eigenen Stellung, klingt im Deutschen aber natürlicher als eine wörtliche Konstruktion mit „desertieren von“.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: seinem Willen
  rationale: Entspricht dem Genitiv mit αὐτοῦ, ohne den Bezug durch eine ausdrückliche Einfügung wie „Gottes“ enger festzulegen.
theological_decisions:
- issue: Verhältnis zum Willen Gottes
  choice: seinem Willen nicht den Dienst entziehen
  alternative: uns nicht von seinem Willen abwenden
  rationale: Die gewählte Fassung erhält das im seltenen Verb λειποτακτεῖν enthaltene militärische Bild und deutet „Wille“ weder als bloße innere Absicht noch als bestimmte Lehrordnung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Dienst entziehen“ ist bewusst bildhaft und bewahrt den militärischen Unterton, ohne die im Deutschen unnatürliche Wendung „von seinem Willen desertieren“ zu verwenden.
