id: 1CLEM.24.1
reference: 1 Clement 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: de
  text: Bedenken wir, ihr Geliebten, wie der Gebieter uns stets vor Augen führt, dass die künftige Auferstehung stattfinden wird. Zu ihrem Erstling machte er den Herrn Jesus Christus, indem er ihn von den Toten auferweckte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: Bedenken wir
  rationale: Der hortative Konjunktiv fordert die Lesenden gemeinsam zu aufmerksamer Betrachtung auf; „Bedenken wir“ gibt dies natürlich und würdig wieder.
- source_word: ὁ δεσπότης
  choice: der Gebieter
  rationale: δεσπότης bezeichnet den souveränen Herrn oder Gebieter. „Gebieter“ bewahrt die Aussage von Autorität und unterscheidet den Ausdruck zugleich von κύριος im selben Satz.
- source_word: ἐπιδείκνυται διηνεκῶς
  choice: führt uns immer wieder vor Augen
  rationale: Die idiomatische Wendung vermittelt sowohl das anschauliche Aufzeigen als auch den fortdauernden beziehungsweise wiederholten Charakter.
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  choice: dass die künftige Auferstehung stattfinden wird
  rationale: Dies gibt die griechische Konstruktion klar wieder, ohne das Zukunftsmoment von μέλλουσαν und ἔσεσθαι im Deutschen schwerfällig zu verdoppeln.
- source_word: ἀπαρχήν
  choice: Erstling
  rationale: „Erstling“ bewahrt das biblisch-kultische Bild der ersten Gabe beziehungsweise des ersten Anteils, der die kommende Gesamternte ankündigt.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus Christus
  rationale: Χριστός wird hier in der üblichen deutschen Namens- und Titelgestalt wiedergegeben, ohne die Frage, wie stark der Titel bereits als Eigenname gebraucht ist, unnötig festzulegen.
theological_decisions:
- issue: Christus als ἀπαρχή der künftigen Auferstehung
  choice: „Zu ihrem Erstling machte er den Herrn Jesus Christus“
  alternative: „Mit dem Herrn Jesus Christus ließ er sie erstmals beginnen“
  rationale: Die gewählte Fassung erhält das konkrete Erstlingsbild und die Beziehung zwischen Jesu Auferweckung und der künftig erwarteten Auferstehung, ohne über den Wortlaut hinaus eine umfassende Auferstehungslehre auszuformulieren.
- issue: Handelnder bei Jesu Auferweckung
  choice: Gott, bezeichnet als „der Gebieter“, ist das Subjekt von „auferweckte“
  alternative: 'Passivische Formulierung: „als der Herr Jesus Christus von den Toten auferweckt wurde“'
  rationale: Das griechische Partizip ἀναστήσας ist aktiv und bezieht sich auf ὁ δεσπότης; diese klare Aussage wird beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „ihr Geliebten“ wahrt den gemeinschaftlichen und warmen Ton. „Immer wieder vor Augen führt“ vermeidet eine steife Wiedergabe von διηνεκῶς, ohne dessen fortdauernde Bedeutung abzuschwächen.
