source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: de
  text: Der Sämann ging hinaus und warf jedes einzelne Samenkorn in die Erde. Wenn die Körner trocken und nackt in die Erde gefallen sind, zerfallen sie. Dann lässt die Größe der Fürsorge des Herrn sie aus diesem Zerfall wieder erstehen; und aus dem einen wachsen viele heran und bringen Frucht hervor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie lässt aus dem einen viele wachsen und bringt Frucht hervor.“ Das Griechische lässt beim Subjekt der letzten beiden Verben unterschiedliche Zuordnungen zu.'
    reason: 'Bewahrt die echte syntaktische Mehrdeutigkeit: πλείονα kann neutrales Pluralsubjekt sein, während auch „die Größe der Fürsorge“ als fortgeführtes Subjekt verstanden werden kann.'
lexical_decisions:
- source_word: ὁ σπείρων
  choice: der Sämann
  rationale: Die substantivierte Partizipialform bezeichnet idiomatisch den Säenden; „der Sämann“ ist im Deutschen natürlich und präzise.
- source_word: ἕκαστον τῶν σπερμάτων
  choice: jedes einzelne Samenkorn
  rationale: Bewahrt den distributiven Sinn von ἕκαστον und gibt σπέρματα hier konkret als einzelne Saatkörner wieder.
- source_word: ξηρὰ καὶ γυμνά
  choice: trocken und nackt
  rationale: Die beiden anschaulichen Prädikative werden eng und ohne erklärende Erweiterung wiedergegeben.
- source_word: διαλύεται / διαλύσεως
  choice: zerfallen / Zerfall
  rationale: Wahrt die lexikalische Wiederaufnahme und bezeichnet den Auflösungsprozess des Samenkorns, ohne ihn biologisch zu präzisieren.
- source_word: ἡ μεγαλειότης τῆς προνοίας
  choice: die Größe der Fürsorge
  rationale: Gibt sowohl μεγαλειότης als auch πρόνοια ausdrücklich wieder; „Fürsorge“ passt zum wirksamen, bewahrenden Handeln im Kontext.
- source_word: τοῦ δεσπότου
  choice: des Herrn
  rationale: „Herr“ ist eine würdevolle und im religiösen Kontext natürliche Wiedergabe von δεσπότης, ohne die Härte des modernen deutschen „Gebieter“ einzutragen.
- source_word: ἀνίστησιν αὐτά
  choice: lässt sie … wieder erstehen
  rationale: Drückt das kausative Aufrichten beziehungsweise Wiedererstehen der zuvor zerfallenen Körner aus und erhält den Auferstehungsanklang des Abschnitts.
- source_word: ἐκ τοῦ ἑνὸς πλείονα
  choice: aus dem einen … viele
  rationale: Bewahrt den Kontrast zwischen dem einen und den vielen; der bestimmte Artikel wird durch „dem einen“ abgebildet.
- source_word: ἐκφέρει καρπόν
  choice: bringen Frucht hervor
  rationale: Eine natürliche, zugleich formnahe Wiedergabe der landwirtschaftlichen Wendung.
theological_decisions:
- issue: Auferstehungsanklang von ἀνίστησιν
  choice: „wieder erstehen“
  alternative: „richtet sie auf“ oder „lässt sie aufgehen“
  rationale: Der Kontext des Kapitels verwendet den Naturvorgang als Bild für Auferstehung. „Wieder erstehen“ erhält diesen Anklang, ohne das Bild in eine dogmatische Erklärung umzuschreiben.
- issue: Subjekt der Schlussverben αὔξει und ἐκφέρει
  choice: „viele wachsen heran und bringen Frucht hervor“
  alternative: „sie lässt aus dem einen viele wachsen und bringt Frucht hervor“
  rationale: πλείονα kann als neutrales Pluralsubjekt verstanden werden, mit Verben im Singular nach griechischer Kongruenzregel. Da zugleich eine Fortführung von ἡ μεγαλειότης als Subjekt grammatisch erwogen werden kann, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze entlasten die dichte griechische Syntax. Das wiederholte Wortfeld „zerfallen/Zerfall“ und der Kontrast „das eine/viele“ bleiben sichtbar; unnötige konfessionelle Präzisierungen werden vermieden.
