  terminology: „Sämann“, „Samenkorn“, „Fürsorge des Herrn“ und „Frucht hervorbringen“ sind sachgerecht. Die Wiedergabe von δεσπότης mit „Herr“ ist im Kontext angemessen. Die Fußnote ist korrekt verankert und macht die mögliche syntaktische Zuordnung der Schlussverben transparent, ohne eine Auslegung vorzuschreiben.
