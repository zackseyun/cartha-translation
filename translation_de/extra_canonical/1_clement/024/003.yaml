id: 1CLEM.24.3
reference: 1 Clement 24:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: de
  text: 'Tag und Nacht führen uns eine Auferstehung vor Augen: Die Nacht schläft ein, der Tag steht auf; der Tag geht fort, die Nacht kommt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασιν
  choice: eine Auferstehung
  rationale: Bewahrt das zentrale Bild und die Verbindung zum Thema der Auferstehung; der unbestimmte Artikel entspricht dem griechischen artikellosen Ausdruck natürlich.
- source_word: δηλοῦσιν
  choice: führen uns … vor Augen
  rationale: Gibt das anschauliche ‚zeigen, sichtbar machen‘ in natürlichem, gehobenem Deutsch wieder.
- source_word: κοιμᾶται
  choice: schläft ein
  rationale: Erhält die Personifikation der Nacht und das Schlafmotiv, das im Kontext auf Tod und Auferstehung verweist.
- source_word: ἀνίσταται
  choice: steht auf
  rationale: Bewahrt die bewusste lexikalische Nähe zu ἀνάστασις und damit das Wortspiel zwischen Auferstehung und dem Aufstehen des Tages.
- source_word: ἄπεισιν
  choice: geht fort
  rationale: Direkte und natürliche Wiedergabe des Weggehens bzw. Verschwindens des Tages.
- source_word: ἐπέρχεται
  choice: kommt
  rationale: Knapp und idiomatisch; wahrt die rasche Gegenüberstellung der griechischen Satzglieder.
theological_decisions:
- issue: Verhältnis des täglichen Wechsels zur Auferstehung
  choice: „eine Auferstehung“
  alternative: „die Auferstehung“ oder „ein Bild der Auferstehung“
  rationale: Der griechische Text sagt wörtlich ἀνάστασιν ohne Artikel und nennt den Wechsel unmittelbar eine Auferstehung. Weder eine dogmatische Bestimmung durch den bestimmten Artikel noch die erklärende Abschwächung zu einem bloßen Bild wird hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die asyndetische, rhythmische Folge der vier kurzen Aussagen bleibt ohne ergänzte Konjunktionen erhalten. „Steht auf“ bewahrt außerdem den im Griechischen hörbaren Zusammenhang zwischen ἀνάστασις und ἀνίσταται.
