  source_fidelity: Der Entwurf gibt den griechischen Satz vollständig und präzise wieder. „führen uns eine Auferstehung vor Augen“ trifft δηλοῦσιν ἡμῖν ἀνάστασιν, ohne den artikellosen Ausdruck dogmatisch zu präzisieren. „Die Nacht schläft ein, der Tag steht auf; der Tag geht fort, die Nacht kommt“ bewahrt die Abfolge, Personifikation und die asyndetische Kürze der Vorlage. „steht auf“ erhält zudem angemessen die lexikalische Resonanz zwischen ἀνάστασις und ἀνίσταται.
