  text: 'Let us take the fruits as an example: how and in what way does the seed come to be?[a]'
translation:
  language: de
  text: 'Nehmen wir die Früchte als Beispiel: Wie und auf welche Weise geschieht die Aussaat?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν τοὺς καρπούς
  choice: Nehmen wir die Früchte als Beispiel
  rationale: λάβωμεν ist als auffordernder Konjunktiv wiedergegeben; »als Beispiel« macht die exemplarische Funktion im Deutschen natürlich deutlich. καρπούς bleibt mit »Früchte« lexikalisch nah am Griechischen.
- source_word: ὁ σπόρος
  choice: die Aussaat
  rationale: σπόρος kann den Vorgang des Säens bezeichnen. Dieser Sinn passt hier besonders, da der folgende Vers für das konkrete Samenkorn σπέρμα verwendet.
- source_word: πῶς καὶ τίνα τρόπον γίνεται
  choice: Wie und auf welche Weise geschieht
  rationale: Die Doppelung des griechischen Ausdrucks wird bewahrt. Bei dem Ereignisnomen »Aussaat« gibt γίνεται natürlich »geschieht« beziehungsweise »findet statt« wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Doppelung »wie und auf welche Weise« bleibt bewusst erhalten; die Deutung von σπόρος als Vorgang vermeidet eine sachlich schwer verständliche Frage danach, wie ein Same ins Dasein kommt.
