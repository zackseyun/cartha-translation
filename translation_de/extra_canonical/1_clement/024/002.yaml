  text: ἴδωμεν, ἀγαπητοί, τὴν κατὰ καιρὸν γινομένην ἀνάστασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/002.yaml
  text: Let us observe, beloved, the resurrection that takes place in due season.
translation:
  language: de
  text: Betrachten wir, ihr Lieben, die Auferstehung, die zur rechten Zeit geschieht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Betrachten wir
  rationale: Der hortative Aorist fordert gemeinsam dazu auf, etwas aufmerksam wahrzunehmen bzw. zu betrachten.
- source_word: ἀγαπητοί
  choice: ihr Lieben
  rationale: Eine natürliche, würdige deutsche Anrede, die den Sinn von »Geliebte« ohne unnötig altertümlichen Klang wiedergibt.
- source_word: τὴν ... ἀνάστασιν
  choice: die Auferstehung
  rationale: Die bestimmte Form und der zentrale Begriff werden direkt bewahrt.
- source_word: κατὰ καιρόν
  choice: zur rechten Zeit
  rationale: Gibt die zeitliche Bedeutung idiomatisch wieder, ohne ein im Griechischen nicht ausgedrücktes Possessiv oder ausdrücklich festgesetztes Datum hinzuzufügen.
- source_word: γινομένην
  choice: die ... geschieht
  rationale: Das Präsenspartizip bezeichnet die sich ereignende bzw. eintretende Auferstehung; der Relativsatz ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung von ἀνάστασις in diesem naturbezogenen Argument
  choice: Auferstehung
  alternative: Wiederbelebung / Wiederkehr
  rationale: Der theologisch gewichtige Ausdruck des griechischen Textes bleibt erhalten. Eine abschwächende Umschreibung würde die beabsichtigte Verbindung zur Auferstehungsthematik vorzeitig auflösen.
- issue: Zeitbestimmung κατὰ καιρόν
  choice: zur rechten Zeit
  alternative: zu festgesetzter Zeit
  rationale: Die Übersetzung bewahrt den Gedanken eines angemessenen Zeitpunkts, ohne göttliche Festsetzung ausdrücklich einzutragen, die in dieser Formulierung nicht eindeutig genannt wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die inklusive gemeinschaftliche Aufforderung und die herzliche Anrede bleiben erhalten; die Satzstruktur folgt dem Griechischen, klingt aber natürlich deutsch.
