source:
  edition: Funk 1901 (normalized OCR)
  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: de
  text: Die unergründlichen Tiefen der Abgründe und die unbeschreiblichen Bereiche der Unterwelt werden durch dieselben Anordnungen in Schranken gehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch dieselben Anordnungen zusammengehalten«.'
    reason: συνέχεται kann sowohl begrenzendes Festhalten als auch inneren Zusammenhalt ausdrücken.
lexical_decisions:
- source_word: ἀβύσσων … ἀνεξιχνίαστα
  choice: die unergründlichen Tiefen der Abgründe
  rationale: Die substantivierte neutrale Form bezeichnet hier das Unerforschliche bzw. die unergründlichen Tiefen der Abgründe; die Formulierung bewahrt das kosmologische Bild in natürlichem Deutsch.
- source_word: νερτέρων ἀνεκδιήγητα κρίματα
  choice: die unbeschreiblichen Bereiche der Unterwelt
  rationale: νερτέρων bezeichnet das Untere bzw. die Unterwelt. κρίματα heißt gewöhnlich »Urteile/Entscheidungen«, kann hier im kosmologischen Zusammenhang aber schwerlich konkrete Richtersprüche meinen; »Bereiche« gibt die gemeinte Gliederung des unteren Kosmos verständlich wieder, ohne eine Gerichtsaussage einzutragen.
- source_word: ταῖς αὐταῖς … προστάξεσιν
  choice: durch dieselben Anordnungen
  rationale: προστάξεις sind bindende Anweisungen oder Verfügungen. »Anordnungen« passt zum Kontext der göttlich geordneten Schöpfung und vermeidet eine unnötig juristische Engführung.
- source_word: συνέχεται
  choice: werden … in Schranken gehalten
  rationale: Das Verb kann »zusammengehalten«, »eingeschlossen« oder »in Schach gehalten« bedeuten. Mit dem Dativ der Anordnungen und im Kontext kosmischer Grenzen bringt »in Schranken gehalten« die kontrollierende Wirkung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Art der Wirksamkeit der göttlichen Anordnungen
  choice: in Schranken gehalten
  alternative: zusammengehalten
  rationale: Der Zusammenhang betont, dass die Bereiche der Schöpfung ihre gesetzten Grenzen einhalten. Zugleich bleibt die lexikalisch mögliche Vorstellung des Zusammenhaltens in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmologische Bildsprache und die Wiederholung »Tiefen der Abgründe« bleiben erhalten; eine Fußnote bewahrt die echte Bedeutungsbreite des Verbs.
