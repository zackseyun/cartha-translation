theological_decisions:
- issue: Sprecher und angeredetes Gegenüber
  choice: Die Pronomen bleiben ohne erklärende Ergänzung stehen.
  alternative: Gott als Sprecher und das Meer als Gegenüber ausdrücklich benennen.
  rationale: Der griechische Vers setzt den Bezug aus dem Kontext voraus; eine explizite Benennung würde interpretierende Information in den Text eintragen.
translation_notes:
  register: Modernes Standarddeutsch in einem knappen, würdevollen Zitatstil. Die ungewöhnliche Formulierung »in dir« bleibt erhalten, um die genuine Bildsprache und mögliche textliche Spannung nicht stillschweigend aufzulösen.
