lexical_decisions:
- source_word: Ἕως ὧδε
  choice: Bis hierher
  rationale: Gibt die räumliche Begrenzung knapp, natürlich und würdevoll wieder.
- source_word: ἥξεις
  choice: sollst du kommen
  rationale: Bewahrt die futurische Aussage mit ihrem im Kontext gebietenden Begrenzungssinn.
- source_word: τὰ κύματά σου
