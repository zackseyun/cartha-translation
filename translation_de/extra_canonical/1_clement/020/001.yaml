  text: Οἱ οὐρανοὶ τῇ διοικήσει αὐτοῦ σαλευόμενοι ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/001.yaml
  text: The heavens, revolving by his governance, submit to him in peace.
translation:
  language: de
  text: Die Himmel werden durch seine Lenkung bewegt[a] und ordnen sich ihm in Frieden unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erschüttert“ oder „ins Wanken gebracht“. Im kosmologischen Zusammenhang kann σαλευόμενοι jedoch die geordnete Bewegung der Himmel bezeichnen.'
    reason: σαλευόμενοι kann Bewegung beziehungsweise Erschütterung bezeichnen; die Fußnote bewahrt die lexikalische Alternative, während die Hauptfassung die kontextuell passende, nicht überpräzisierte Bedeutung wahrt.
lexical_decisions:
- source_word: Οἱ οὐρανοί
  choice: Die Himmel
  rationale: Der griechische Plural wird beibehalten und entspricht dem kosmologischen Sprachgebrauch des Abschnitts.
- source_word: τῇ διοικήσει αὐτοῦ
  choice: unter seiner Leitung
  rationale: διοίκησις bezeichnet hier Gottes ordnende Lenkung bzw. Verwaltung; „Leitung“ ist natürliches modernes Deutsch und bewahrt diesen Sinn.
- source_word: σαλευόμενοι
  choice: bewegen sich
  rationale: Das Partizip bezeichnet in diesem kosmologischen Zusammenhang die geordnete Bewegung der Himmel. Die Wiedergabe vermeidet den hier irreführenden Eindruck einer gewaltsamen Erschütterung, ohne die lexikalische Alternative zu verschweigen.
- source_word: ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ
  choice: ordnen sich ihm in Frieden unter
  rationale: Die reflexive Form gibt die Unterordnung natürlich wieder; „in Frieden“ bewahrt die Art und Sphäre des Gehorsams.
theological_decisions:
- issue: Verhältnis von kosmischer Bewegung und göttlicher Herrschaft
  choice: Geordnete Bewegung unter Gottes Leitung
  alternative: Die Himmel werden erschüttert und unterwerfen sich Gott
  rationale: Der unmittelbare Zusammenhang schildert die friedliche kosmische Ordnung. Dennoch bleibt die mögliche Grundbedeutung von σαλεύω in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und folgt der griechischen Struktur, klingt jedoch idiomatisch; die echte lexikalische Mehrdeutigkeit wird durch die Fußnote bewahrt.
