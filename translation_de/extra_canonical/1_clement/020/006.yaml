id: 1CLEM.20.6
reference: 1 Clement 20:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: de
  text: Die Wassermasse des grenzenlosen Meeres, die gemäß seinem Schöpfungswerk in ihren Becken gesammelt ist, überschreitet nicht die Grenzen[a], die ihr ringsum gesetzt sind, sondern tut, was er ihr befohlen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lippen“ oder „Ränder“.'
    reason: Die Metapher des griechischen χείλη lässt sich im Haupttext nicht ebenso natürlich wiedergeben.
lexical_decisions:
- source_word: τὸ χύτος
  choice: die Wassermasse
  rationale: χύτος bezeichnet hier die ausgegossene beziehungsweise zusammenhängende Masse des Meerwassers, nicht das Becken, das sie aufnimmt.
- source_word: τῆς ἀπείρου θαλάσσης
  choice: des grenzenlosen Meeres
  rationale: Gibt ἄπειρος in seiner räumlichen Bedeutung natürlich und würdig wieder.
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: gemäß seinem Schöpfungswerk
  rationale: Bewahrt den Bezug auf Gottes δημιουργία, ohne den Ausdruck unnötig als bloßen Vorgang oder als abstrakte Ordnung festzulegen.
- source_word: συσταθὲν εἰς τὰς συναγωγάς
  choice: in ihren Becken gesammelt
  rationale: συνίστημι bezeichnet hier das Zusammenbringen beziehungsweise Sammeln des Wassers; συναγωγαί sind die dafür bestimmten Ansammlungsorte oder Becken.
- source_word: τὰ περιτεθειμένα αὐτῇ χείλη
  choice: die Grenzen, die ihr ringsum gesetzt sind
  rationale: χείλη bedeutet wörtlich „Lippen“, bezeichnet bildlich aber die das Meer umgebenden Ränder oder Begrenzungen; περιτεθειμένα wird durch „ringsum gesetzt“ aufgenommen.
- source_word: καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ
  choice: sondern tut, was er ihr befohlen hat
  rationale: Natürliches Deutsch, das die personifizierende Aussage und die verbindliche Anordnung durch διετάξεν erhält.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Personifizierung des Meeres und der ausdrückliche Bezug auf Gottes Schöpfungswerk und Befehl bleiben erhalten.
