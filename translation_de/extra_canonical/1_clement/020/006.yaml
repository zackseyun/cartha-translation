  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Begriffe sachgerecht wieder: χύτος als „Wassermasse“, ἄπειρος als „grenzenlos“, die Sammlung in συναγωγαί als „Becken“, die umgebenden χείλη als Grenzen sowie die abschließende, personifizierende Befolgung des göttlichen Befehls. „Gemäß seinem Schöpfungswerk“ ist für κατὰ τὴν δημιουργίαν αὐτοῦ vertretbar und wahrt den Bezug auf Gottes schöpferisches Handeln.'
