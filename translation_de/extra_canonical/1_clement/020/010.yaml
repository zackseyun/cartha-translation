id: 1CLEM.20.10
reference: 1 Clement 20:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: de
  text: Die Bahnen der Winde erfüllen, jede zu ihrer eigenen Zeit, ungehindert[a] ihren Dienst. Die ewig fließenden Quellen, die zu Genuss und Gesundheit geschaffen sind, bieten den Menschen ohne Unterlass ihre Brüste zum Leben. Und die kleinsten unter den Lebewesen halten ihre Zusammenkünfte in Eintracht und Frieden ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort kann bildlich an „nicht anstoßen“ erinnern; gemeint ist: ungehindert, reibungslos.'
    reason: Erläutert die Bildlichkeit, ohne sie fälschlich als wörtliche Kontextübersetzung auszugeben.
lexical_decisions:
- source_word: ἀνέμων σταθμοί
  choice: die Bahnen der Winde
  rationale: σταθμοί bezeichnet hier im kosmischen Zusammenhang die geordneten, festgelegten Bewegungsbereiche beziehungsweise Laufbahnen der Winde; „Bahnen“ ist im Deutschen natürlich und bewahrt diesen Ordnungsgedanken.
- source_word: λειτουργία
  choice: Dienst
  rationale: „Dienst“ gibt die übertragene Aufgabe der Winde in der geordneten Schöpfung wieder, ohne einen spezifisch kultischen Sinn aufzudrängen.
- source_word: ἀπροσκόπως
  choice: ungehindert
  rationale: Das Adverb bezeichnet hier einen reibungslosen, unbehinderten Vollzug und passt so sachlich zu den Winden.
- source_word: πρὸς ἀπόλαυσιν καὶ ὑγείαν
  choice: zu Genuss und Gesundheit
  rationale: Die Zweckangabe wird knapp und direkt wiedergegeben; „Genuss“ bewahrt den positiven Sinn von ἀπόλαυσις.
- source_word: δίχα ἐλλείψεως
  choice: unerschöpflich
  rationale: Die idiomatische Wiedergabe drückt aus, dass die Quellen ohne Mangel beziehungsweise Ausbleiben geben.
- source_word: μαζούς
  choice: ihre Brüste
  rationale: Das konkrete mütterliche Bild des griechischen Textes wird trotz seiner Ungewöhnlichkeit bewusst bewahrt.
- source_word: τὰ ἐλάχιστα τῶν ζῴων
  choice: die kleinsten unter den Lebewesen
  rationale: Die Formulierung gibt den partitiven Genitiv natürlich wieder und vermeidet eine unnötige Einschränkung auf eine bestimmte Tiergruppe.
- source_word: ἐν ὁμονοίᾳ καὶ εἰρήνῃ
  choice: in Eintracht und Frieden
  rationale: „Eintracht“ trifft ὁμόνοια als gemeinsames, übereinstimmendes Handeln und erhält die Verbindung mit „Frieden“.
