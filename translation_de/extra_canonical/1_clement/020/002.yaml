  yaml_path: translation/extra_canonical/1_clement/020/002.yaml
  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: de
  text: Tag und Nacht vollenden den Lauf, den er ihnen bestimmt hat, ohne einander in irgendeiner Weise zu behindern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον
  choice: den Lauf, den er ihnen bestimmt hat
  rationale: Gibt die göttliche Anordnung des jeweiligen Laufs natürlich und präzise wieder; „Lauf“ bewahrt das griechische Bild.
- source_word: ἀνύουσιν
  choice: vollenden
  rationale: Drückt das Erreichen beziehungsweise vollständige Zurücklegen des bestimmten Laufs aus.
- source_word: μηδὲν ἀλλήλαις ἐμποδίζοντα
  choice: ohne einander in irgendeiner Weise zu behindern
  rationale: Bewahrt die umfassende Verneinung μηδέν und gibt die wechselseitige Beziehung idiomatisch wieder.
theological_decisions:
- issue: Bezug des unausgedrückten Handelnden in ὑπ᾽ αὐτοῦ
  choice: „er“ bleibt kleingeschrieben und ohne erklärenden Zusatz
  alternative: „Gott“ ausdrücklich einsetzen
  rationale: Der griechische Text verwendet nur das Pronomen. Die Übersetzung bewahrt diesen Rückbezug, ohne den Namen interpretierend zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Rede von Tag und Nacht sowie das Bild ihres „Laufs“ bleiben erhalten.
