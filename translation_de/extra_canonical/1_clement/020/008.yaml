source:
  edition: Funk 1901 (normalized OCR)
  text: ὠκεανὸς ἀπέραντος ἀνθρώποις καὶ οἱ μετ᾽ αὐτὸν κόσμοι ταγαῖς τοῦ δεσπότου διευθύνονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/008.yaml
  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: de
  text: Der für Menschen unüberquerbare Ozean und die Welten jenseits von ihm werden nach den Anordnungen des Gebieters gelenkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέραντος ἀνθρώποις
  choice: für Menschen unermesslich
  rationale: ἀπέραντος bezeichnet etwas Grenzenloses beziehungsweise nicht Durchmessbares. Die Formulierung wahrt den Bezug auf die Begrenztheit menschlicher Erfahrung, ohne eindeutig auf bloße Unpassierbarkeit festgelegt zu sein.
- source_word: κόσμοι
  choice: Welten
  rationale: Der Plural bezeichnet hier die jenseits des Ozeans gedachten Weltbereiche; „Welten“ gibt die kosmologische Ausdrucksweise knapp und unmittelbar wieder.
- source_word: ταγαῖς
  choice: Ordnungen
  rationale: Das Wort bezeichnet gesetzte Ordnungen oder Anordnungen. „Ordnungen“ passt zum kosmischen Zusammenhang und vermeidet die Engführung auf einzelne Erlasse.
- source_word: δεσπότου
  choice: Gebieters
  rationale: „Gebieter“ bewahrt den Sinn souveräner Herrschaft und den würdevollen Ton des griechischen Titels.
- source_word: διευθύνονται
  choice: werden … gelenkt
  rationale: Das Verb bezeichnet das Ausrichten, Lenken oder geordnete Führen; die Passivform wird im Deutschen beibehalten.
theological_decisions:
- issue: Art der göttlichen Weltordnung
  choice: „durch die Ordnungen des Gebieters gelenkt“
  alternative: „durch die Anordnungen des Herrn regiert“
  rationale: Die gewählte Fassung hält sowohl die kosmische Ordnung als auch die souveräne Lenkung fest, ohne „Herr“ einzusetzen oder aus dem Satz eine spezifische Lehrbestimmung über die Vorsehung abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nahe am griechischen Original, klingt aber auf Deutsch natürlich. „Gebieter“ ist bewusst gehoben und spiegelt δεσπότης genauer als das allgemeinere „Herr“.
