id: 1CLEM.20.3
reference: 1 Clement 20:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: de
  text: Sonne und Mond sowie die Chöre der Sterne durchlaufen nach seiner Anordnung in Eintracht und ohne jede Abweichung die ihnen zugewiesenen Bahnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die ihnen gesetzten Grenzen“.'
    reason: ὁρισμούς kann sowohl die festgesetzten Grenzen bzw. Bestimmungen als auch im kosmologischen Zusammenhang die zugewiesenen Bahnen bezeichnen.
lexical_decisions:
- source_word: χοροὶ
  choice: Chöre
  rationale: Bewahrt das Bild geordneter, gemeinsam handelnder Gruppen; „Reigen“ wäre ebenfalls möglich, wirkt im heutigen Deutsch jedoch stärker poetisch und legt eine kreisende Tanzbewegung nahe.
- source_word: διαταγή
  choice: Anordnung
  rationale: Gibt die von Gott festgelegte Ordnung bzw. Weisung sachlich und würdig wieder.
- source_word: ἐν ὁμονοίᾳ
  choice: in Eintracht
  rationale: Erhält den für 1 Clemens wichtigen Gedanken der ὁμόνοια und schwächt ihn nicht zum bloß ästhetischen „Einklang“ ab.
- source_word: ἐξελίσσουσιν ... ὁρισμούς
  choice: durchlaufen ... Bahnen
  rationale: Gibt die kosmologische Bewegung idiomatisch wieder. ὁρισμοί bezeichnet wörtlicher gesetzte Begrenzungen oder Bestimmungen, kann hier aber die den Himmelskörpern zugewiesenen Laufbahnen meinen.
- source_word: δίχα πάσης παρεκβάσεως
  choice: ohne jede Abweichung
  rationale: Entspricht der umfassenden Verneinung und bewahrt das Motiv unverbrüchlicher Ordnung.
theological_decisions:
- issue: Die kosmische Ordnung als Vorbild der Eintracht
  choice: „in Eintracht“ ausdrücklich beibehalten
  alternative: „im Einklang“ oder „harmonisch“
  rationale: Der Text beschreibt nicht nur eine ästhetische Harmonie, sondern verwendet einen ethisch und gemeinschaftlich gewichtigen Leitbegriff des Schreibens; die Übersetzung soll diesen Zusammenhang offenhalten.
- issue: Bedeutung von ὁρισμούς
  choice: Im Haupttext als „Bahnen“ wiedergeben und die wörtlichere Möglichkeit in einer Fußnote nennen
  alternative: „Grenzen“ unmittelbar im Haupttext
  rationale: „Bahnen“ ist im Zusammenhang mit Sonne, Mond und Sternen natürlich und passt zum Bewegungsverb; „Grenzen“ bewahrt dagegen die formale Grundbedeutung, klingt hier aber im Deutschen weniger idiomatisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Text, ohne schwerfällig zu wirken; „Eintracht“ bewahrt die rhetorische Schlüsselterminologie des 1. Clemensbriefs.
