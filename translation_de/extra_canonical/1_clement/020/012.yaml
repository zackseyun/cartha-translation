source:
  edition: Funk 1901 (normalized OCR)
  text: ᾧ ἡ δόξα καὶ ἡ μεγαλωσύνη εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/012.yaml
  text: to whom be the glory and the majesty forever and ever. Amen.
translation:
  language: de
  text: Ihm sei die Herrlichkeit und die Majestät in alle Ewigkeit. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Ihm
  rationale: Das Relativpronomen im Dativ verweist auf Gott im vorausgehenden Zusammenhang. Die selbstständige deutsche Doxologie beginnt natürlich mit „Ihm“.
- source_word: ἡ δόξα
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ ist die übliche und kontextgemäße Wiedergabe von δόξα in einer Doxologie.
- source_word: ἡ μεγαλωσύνη
  choice: die Majestät
  rationale: „Majestät“ gibt die erhabene Größe und Hoheit von μεγαλωσύνη prägnant und idiomatisch wieder.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: von Ewigkeit zu Ewigkeit
  rationale: Diese etablierte deutsche Wendung bewahrt die verstärkende, unbegrenzte Zeitvorstellung der griechischen Formel und klingt würdig und natürlich.
- source_word: ἀμήν
  choice: Amen
  rationale: Die traditionelle transliterierte Bekräftigungsform wird im Deutschen unverändert gebraucht.
theological_decisions:
- issue: Elliptische Doxologie ohne ausdrückliches Verb
  choice: „gebühren“ ergänzt
  alternative: „Ihm sei die Herrlichkeit und die Majestät“
  rationale: Das Griechische lässt die Kopula beziehungsweise den doxologischen Prädikatsausdruck aus. „Gebühren“ macht den Sinn idiomatisch deutlich, ohne eine zusätzliche theologische Aussage einzuführen; der jussive Charakter der Alternative ist im Ausgangstext nicht ausdrücklich markiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache; die traditionelle doxologische Formel bleibt klar und für gewöhnliche Leser verständlich.
