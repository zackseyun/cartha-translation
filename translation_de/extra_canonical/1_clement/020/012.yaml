revisions:
- from: Ihm gebühren die Herrlichkeit und die Majestät von Ewigkeit zu Ewigkeit. Amen.
  to: Ihm sei die Herrlichkeit und die Majestät in alle Ewigkeit. Amen.
  rationale: Die Revision bewahrt die elliptische doxologische Aussage, indem sie sie mit der im Deutschen üblichen Formel „Ihm sei“ idiomatisch ausdrückt. „In alle Ewigkeit“ gibt die griechische Formel εἰς τοὺς αἰῶνας τῶν αἰώνων ohne zusätzliche zeitliche Richtung wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:57:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Anrede im Dativ („ᾧ“) sowie „δόξα“ und „μεγαλωσύνη“ sind zutreffend erfasst. Die griechische Zeitformel εἰς τοὺς αἰῶνας τῶν αἰώνων bezeichnet jedoch ein Fortdauern „in alle Ewigkeit“; „von Ewigkeit zu Ewigkeit“ kann im Deutschen zusätzlich eine Ausgangsrichtung („von“) nahelegen, die im Griechischen nicht ausgedrückt ist.
  naturalness: „Ihm sei die Herrlichkeit und die Majestät“ ist eine im Deutschen natürliche, würdige doxologische Formel. Sie gibt die im Griechischen elliptische Prädikation idiomatisch wieder.
  terminology: „Herrlichkeit“, „Majestät“ und „Amen“ sind angemessen. „Majestät“ gibt μεγαλωσύνη als erhabene Größe beziehungsweise Hoheit prägnant wieder.
  issues:
  - severity: low
    issue: Zeitformel „von Ewigkeit zu Ewigkeit“
    rationale: Die Wendung ist traditionell verständlich, doch „in alle Ewigkeit“ entspricht εἰς („in, bis hinein in“) unmittelbarer und vermeidet die zusätzliche Assoziation eines Anfangspunktes durch „von“.
  - severity: low
    issue: Doxologisches Prädikat „gebühren“
    rationale: Grammatisch möglich, aber „Ihm sei …“ ist für die elliptische griechische Doxologie unmittelbarer und im modernen würdevollen Deutsch idiomatischer.
  revised_text: Ihm sei die Herrlichkeit und die Majestät in alle Ewigkeit. Amen.
  revised_footnotes: []
  revision_rationale: Die Revision bewahrt die elliptische doxologische Aussage, indem sie sie mit der im Deutschen üblichen Formel „Ihm sei“ idiomatisch ausdrückt. „In alle Ewigkeit“ gibt die griechische Formel εἰς τοὺς αἰῶνας τῶν αἰώνων ohne zusätzliche zeitliche Richtung wieder.
