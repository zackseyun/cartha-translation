id: 1CLEM.20.11
reference: 1 Clement 20:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: de
  text: Dies alles hat der große Schöpfer und Gebieter über alles dazu bestimmt, in Frieden und Eintracht zu sein. Er tut allem Gutes, in überreichem Maß aber uns, die wir durch unseren Herrn Jesus, den Messias, zu seinem Erbarmen Zuflucht genommen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διμιουργὸς
  choice: Schöpfer
  rationale: Die im Text begegnende Schreibform entspricht δημιουργός; im Zusammenhang bezeichnet das Wort Gott als den Urheber und Schöpfer des Alls.
- source_word: δεσπότης τῶν ἁπάντων
  choice: Gebieter über alles
  rationale: „Gebieter“ bewahrt den Gedanken uneingeschränkter Herrschaft, ohne die im heutigen Deutsch problematischen Nebenbedeutungen von „Meister“ oder „Despot“.
- source_word: ἐν εἰρήνῃ καὶ ὁμονοίᾳ
  choice: in Frieden und Eintracht
  rationale: „Eintracht“ gibt ὁμόνοια als gemeinsames, harmonisches Miteinander natürlich und würdig wieder.
- source_word: εὐεργετῶν τὰ πάντα
  choice: Er tut allem Gutes
  rationale: Das Partizip beschreibt Gottes fortdauerndes wohltätiges Handeln; ein eigener deutscher Satz vermeidet eine unklare Partizipialfügung.
- source_word: ὑπερεκπερισσῶς
  choice: in überreichem Maß
  rationale: Die starke Steigerung wird idiomatisch ausgedrückt, ohne ein im Deutschen unnatürliches „überaus mehr“.
- source_word: τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ
  choice: die wir … zu seinem Erbarmen Zuflucht genommen haben
  rationale: Bewahrt das Zufluchtsbild des Verbs προσφεύγω; der griechische Plural οἰκτιρμοί wird im Deutschen idiomatisch kollektiv als „Erbarmen“ wiedergegeben.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, den Messias
  rationale: Χριστός wird seinem titularen Sinn entsprechend als „Messias“ wiedergegeben; die Apposition klingt im modernen Deutsch natürlich und macht den Titel erkennbar.
theological_decisions:
- issue: Bezug von διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: „durch unseren Herrn Jesus, den Messias“ wird an die Zufluchtnahme zu Gottes Erbarmen angeschlossen
  alternative: Die Wendung könnte weiter gefasst auf Gottes überreiches Wohltun bezogen werden.
  rationale: Die unmittelbare Stellung nach „zu seinem Erbarmen Zuflucht genommen haben“ legt den instrumentalen Bezug auf den Zugang zu Gottes Erbarmen nahe; die deutsche Wortstellung wahrt zugleich den fortlaufenden Gedankengang.
- issue: Verhältnis von Gottes allgemeinem und besonderem Wohltun
  choice: „allem … in überreichem Maß aber uns“
  alternative: Eine stärker ausdeutende Fassung wie „besonders reichlich uns Menschen/Gläubigen“
  rationale: Die Übersetzung erhält die Spannung des griechischen Textes zwischen Gottes Güte gegenüber allem und ihrem überreichen Erweis an der bezeichneten Gemeinschaft, ohne deren Identität zusätzlich zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz folgt dem syntaktischen Hauptgedanken eng; der zweite löst das griechische Partizip zugunsten guter Verständlichkeit auf. Keine konfessionell geprägte Terminologie; „Messias“ bewahrt den Titelcharakter von Χριστός.
