source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: de
  text: Die Erde trägt nach seinem Willen zu ihren rechten Zeiten reichlich Nahrung für Menschen, Tiere und alle Lebewesen, die auf ihr leben, und bringt sie hervor, ohne zu zögern oder etwas von dem zu verändern, was von ihm festgesetzt worden ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: trägt
  rationale: Das Partizip bezeichnet wörtlich das Tragen beziehungsweise Schwangersein. „trägt“ bewahrt das Bild der hervorbringenden Erde, ohne das im Griechischen nicht ausdrücklich genannte „Frucht“ einzufügen.
- source_word: τοῖς ἰδίοις καιροῖς
  choice: zu den ihr bestimmten Zeiten
  rationale: Gibt die jeweils eigenen beziehungsweise angemessenen Zeiten idiomatisch wieder und lässt im Zusammenhang erkennen, dass sie in der göttlichen Ordnung festgelegt sind.
- source_word: τὴν πανπληθῆ ... τροφήν
  choice: Nahrung in reicher Fülle
  rationale: πανπληθής hebt die umfassende Fülle hervor; die Formulierung ist natürliches Deutsch und vermeidet ein schwerfälliges Kompositum.
- source_word: ἀνατέλλει
  choice: lässt sie hervorsprießen
  rationale: Das Verb wird vom Aufgehen beziehungsweise Hervorsprießen gebraucht. Das Pronomen bezieht sich auf die zuvor genannte Nahrung und bildet den Vorgang anschaulich ab.
- source_word: μήτε διστατάσουσα
  choice: ohne zu zögern
  rationale: διστάζω kann Zögern oder Schwanken bezeichnen. Im Bild des gehorsamen Vollzugs der Ordnung ist „zögern“ natürlich und wahrt den Gedanken fehlender Unschlüssigkeit.
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: was er angeordnet hat
  rationale: Das passive Perfekt bezeichnet das von Gott verbindlich Festgesetzte. „angeordnet“ ist würdig und verständlich, ohne zwingend einen formalen Erlass anzunehmen.
theological_decisions:
- issue: Göttliche Ordnung der Schöpfung
  choice: „nach seinem Willen“ und „was er angeordnet hat“
  alternative: „gemäß seinem Willen“ und „was von ihm beschlossen worden ist“
  rationale: Die aktive deutsche Schlussformulierung bewahrt Gott als Urheber der Ordnung, ohne die Aussage über Art oder Mechanismus seines Wirkens dogmatisch auszuweiten.
- issue: Bezug der „bestimmten Zeiten“
  choice: „zu den ihr bestimmten Zeiten“
  alternative: „zu ihren eigenen Zeiten“
  rationale: Der griechische Ausdruck kann schlicht die jeweils angemessenen Zeiten meinen. „ihr bestimmt“ passt zur genannten göttlichen Ordnung, ohne eine besondere Lehre über Vorsehung auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personifikation der Erde und die Bewegung vom Tragen zum Hervorsprießen bleiben erhalten. Die Satzstruktur ist gegenüber dem Griechischen leicht gegliedert, damit der lange Gedankengang für heutige Leser klar bleibt.
