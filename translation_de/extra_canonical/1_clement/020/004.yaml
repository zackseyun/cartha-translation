  to: Die Erde trägt nach seinem Willen zu ihren rechten Zeiten reichlich Nahrung für Menschen, Tiere und alle Lebewesen, die auf ihr leben, und bringt sie hervor, ohne zu zögern oder etwas von dem zu verändern, was von ihm festgesetzt worden ist.
