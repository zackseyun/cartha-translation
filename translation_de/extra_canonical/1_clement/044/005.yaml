  source_fidelity: 'Die Grundbedeutung wird gut getroffen: προοδοιπορήσαντες bezeichnet vorausgegangene (im Kontext verstorbene) Älteste, und δεδομένου bleibt zutreffend als „gegebenen“ wiedergegeben. Zwei Nuancen sollten jedoch korrigiert werden: τελείαν bedeutet hier „vollständig/vollendet“, nicht primär „endgültig“, und μεταστήσῃ ist neutraler „entfernen/wegversetzen“ als das stärker konkurrenzbezogene „verdrängen“. Das im Deutschen ergänzte „uns“ steht nicht im griechischen Text und ist entbehrlich.'
