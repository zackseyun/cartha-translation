  terminology: „Älteste“ gibt πρεσβύτεροι angemessen wieder. „Abschied“ bewahrt die euphemistische Ausdrucksweise von ἀνάλυσις; die Fußnote erklärt den Todesbezug sachgerecht. „Gegebener Platz“ erhält sowohl die örtliche Bildlichkeit als auch den möglichen Bezug auf Stellung oder Aufgabe und folgt der in der englischen Audit-Spur festgehaltenen Unterscheidung von δεδομένου gegenüber Terminologie für Einsetzung.
