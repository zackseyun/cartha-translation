revisions:
- from: Glücklich zu nennen sind die Ältesten, die uns vorausgegangen sind und deren Abschied zur rechten Zeit und endgültig war[a]. Denn sie brauchen nicht zu fürchten, dass jemand sie von dem ihnen gegebenen Platz verdrängt.
  to: Glücklich sind die Ältesten, die vorausgegangen sind und deren Abschied rechtzeitig und vollständig war[a]. Denn sie fürchten nicht, dass jemand sie von dem ihnen gegebenen Platz entfernt.
  rationale: Die Revision ersetzt die semantisch eingeengte Wiedergabe „endgültig“ durch „vollständig“ für τελείαν, gibt μεταστήσῃ neutral als „entfernt“ wieder und lässt das nicht ausdrücklich genannte Objekt bei „vorausgegangen“ weg. Die Bildsprache von „Abschied“ und „gegebenem Platz“ sowie die lexikalische Unterscheidung von δεδομένου („gegeben“) gegenüber einer formalen Einsetzung bleiben erhalten.
