source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: de
  text: Glücklich sind die Ältesten, die vorausgegangen sind und deren Abschied rechtzeitig und vollständig war[a]. Denn sie fürchten nicht, dass jemand sie von dem ihnen gegebenen Platz entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Abschied“ ist hier das Scheiden aus dem Leben gemeint; das griechische Wort kann auch „Aufbruch“ oder „Auflösung“ bedeuten.
    reason: Erläutert den Todesbezug von ἀνάλυσις, ohne die euphemistische und bildhafte Formulierung des Haupttexts aufzugeben.
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: die uns vorausgegangen sind
  rationale: Das Partizip bezeichnet diejenigen, die auf dem Weg vorausgegangen sind; im Zusammenhang sind bereits verstorbene Älteste gemeint. „Uns“ ist im Deutschen idiomatisch mitgedacht, ohne den Sinn einzuengen.
- source_word: πρεσβύτεροι
  choice: Ältesten
  rationale: Die kirchliche Amts- beziehungsweise Gemeindebezeichnung wird mit dem im Deutschen etablierten „Älteste“ wiedergegeben.
- source_word: ἔγκαιρον
  choice: zur rechten Zeit
  rationale: Gibt den zeitlichen Sinn von „rechtzeitig, angemessen zur Zeit“ natürlich wieder.
- source_word: τελείαν
  choice: endgültig
  rationale: Im Zusammenhang des Todes und im Gegensatz zur möglichen Absetzung der Lebenden bezeichnet das Wort einen abgeschlossenen, vollendeten Abschied; „endgültig“ ist hier verständlicher als das missverständliche „vollkommen“.
- source_word: ἀνάλυσιν
  choice: Abschied
  rationale: Das Wort kann Aufbruch, Scheiden oder Auflösung bezeichnen und wird hier als verhüllende Bezeichnung für den Tod gebraucht.
- source_word: μεταστήσῃ
  choice: verdrängt
  rationale: Das Verb bedeutet hier, jemanden von seinem Platz zu entfernen oder wegzuversetzen; „verdrängt“ passt zum Zusammenhang einer Absetzung.
- source_word: δεδομένου
  choice: gegebenen
  rationale: Bewahrt den ausdrücklichen Wortlaut des Partizips von δίδωμι („geben“) und glättet ihn nicht zu „zugewiesen“ oder „ernannt“.
- source_word: τόπου
  choice: Platz
  rationale: Wahrt die Bildlichkeit und mögliche Spannung zwischen einem konkreten Platz und einer übertragenen Stellung oder Aufgabe.
theological_decisions:
- issue: Bezug des „Abschieds“ auf den Tod
  choice: Der Haupttext lässt mit „Abschied“ die euphemistische Ausdrucksweise erkennen; die Fußnote erläutert den Todesbezug.
  alternative: „Tod“ oder „Heimgang“ direkt im Haupttext
  rationale: „Tod“ wäre expliziter als das Griechische, während „Heimgang“ zusätzliche religiöse Konnotationen eintragen könnte.
- issue: Der den Ältesten gegebene τόπος
  choice: „der ihnen gegebene Platz“
  alternative: „das ihnen übertragene Amt“ oder „die ihnen zugewiesene Stellung“
  rationale: Der unmittelbare Zusammenhang legt ihre Stellung als Älteste nahe, doch der griechische Ausdruck bleibt bildhaft und nennt nicht ausdrücklich ein Amt. Die offene Formulierung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Glücklich zu nennen“ vermeidet die im heutigen Deutsch oft alltagssprachlich verstandene Wendung „glücklich sind“, während „Älteste“, „Abschied“ und „Platz“ die kirchliche sowie bildhafte Sprache des griechischen Textes bewahren.
