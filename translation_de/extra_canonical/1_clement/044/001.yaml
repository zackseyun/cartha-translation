source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ οἱ ἀπόστολοι ἡμῶν ἔγνωσαν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι ἔρις ἔσται ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/001.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: de
  text: Und unsere Apostel wussten durch unseren Herrn Jesus Christus, dass es Streit um die Bezeichnung des Aufseheramtes geben würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἀπόστολοι ἡμῶν
  choice: unsere Apostel
  rationale: Gibt die Zugehörigkeitsangabe schlicht und unmittelbar wieder.
- source_word: ἔγνωσαν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: wussten durch unseren Herrn Jesus Christus
  rationale: Bewahrt διά als Vermittlungsangabe und gibt ἔγνωσαν natürlich im Deutschen wieder.
- source_word: ἔρις
  choice: Streit
  rationale: Trifft den Sinn von Auseinandersetzung oder Zwist in einem allgemein verständlichen Register.
- source_word: ἐπὶ τοῦ ὀνόματος
  choice: um die Bezeichnung
  rationale: Der Zusammenhang meint wahrscheinlich nicht bloß einen Eigennamen, sondern die Benennung beziehungsweise den Titel; „Bezeichnung“ bewahrt diesen Bezug.
- source_word: τῆς ἐπισκοπῆς
  choice: des Aufseheramtes
  rationale: ἐπισκοπή bezeichnet hier die Funktion beziehungsweise das Amt der Aufsicht. „Aufseheramt“ vermeidet eine vorschnelle Gleichsetzung mit einer später ausgeformten kirchlichen Amtsstruktur.
theological_decisions:
- issue: Bedeutung von ἐπισκοπή im frühkirchlichen Kontext
  choice: Aufseheramt
  alternative: Bischofsamt / Aufsicht
  rationale: „Aufseheramt“ hält Amtscharakter und etymologischen Sinn zusammen, ohne spätere konfessionelle Amtsvorstellungen in den Text einzutragen.
- issue: Bezug von ὄνομα
  choice: Bezeichnung des Amtes
  alternative: Name des Amtes / Amt selbst
  rationale: Die wörtliche Rede vom „Namen“ bleibt semantisch erkennbar, wird aber idiomatisch ausgedrückt; die mögliche metonymische Beziehung zum Amt selbst wird nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung bleibt nahe am griechischen Satz, während „Bezeichnung des Aufseheramtes“ den schwierigen Schluss verständlich und ohne konfessionelle Vorentscheidung wiedergibt.
