  rationale: Die Revision beseitigt die missverständliche Genitivverbindung „Gaben des Aufseherdienstes“, ohne die im Griechischen vorhandene syntaktisch-sachliche Offenheit zu beseitigen. Der Haupttext hält die kultische Sprache von „Gaben darbringen“ und die direkte Bedeutung von ἀποβάλωμεν („verstoßen“) bei; die Fußnote dokumentiert die kontextuell plausible Amtsenthebungslesung. Keine konfessionelle Amtsauffassung wird vorausgesetzt.
