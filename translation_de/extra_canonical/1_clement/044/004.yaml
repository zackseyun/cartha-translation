source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: de
  text: Denn es wird für uns keine geringe Sünde sein, wenn wir diejenigen verstoßen, die im Dienst der Aufsicht die Gaben untadelig und in heiliger Haltung dargebracht haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang des Abschnitts: „wenn wir diejenigen aus dem Dienst der Aufsicht entfernen, die die Gaben untadelig und in heiliger Haltung dargebracht haben“.'
    reason: Der Genitiv τῆς ἐπισκοπῆς steht unmittelbar bei „die Gaben“, doch der Kontext erlaubt auch die Deutung, dass bewährte Personen aus dem Aufsichtsdienst entfernt werden.
lexical_decisions:
- source_word: ἁμαρτία ... οὐ μικρά
  choice: keine geringe Sünde
  rationale: Bewahrt die litotische Formulierung und ihr starkes moralisches Gewicht.
- source_word: ἀποβάλωμεν
  choice: verstoßen
  rationale: Gibt die Grundbedeutung „hinauswerfen, verstoßen“ wieder, ohne die im Griechischen nicht ausdrücklich genannte Amtsenthebung in den Haupttext einzutragen.
- source_word: τὰ δῶρα
  choice: die Gaben
  rationale: Das kultisch geprägte „Gaben“ passt zu προσφέρειν und lässt offen, ob konkrete Opfergaben oder die mit dem Dienst verbundenen Gaben gemeint sind.
- source_word: τῆς ἐπισκοπῆς
  choice: des Aufseherdienstes
  rationale: „Aufseherdienst“ gibt ἐπισκοπή als Aufgabe bzw. Amt wieder, ohne einen einzelnen „Bischof“ vorauszusetzen.
- source_word: προσενέγκοντας
  choice: dargebracht haben
  rationale: Entspricht dem kultischen Sprachgebrauch des Verbs und seiner Verbindung mit „Gaben“.
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: untadelig und in heiliger Gesinnung
  rationale: Bewahrt sowohl die nach außen erkennbare Unbescholtenheit als auch die religiös-sittliche Ausrichtung von ὁσίως.
theological_decisions:
- issue: Bezug von τῆς ἐπισκοπῆς
  choice: 'Im Haupttext auf „die Gaben“ bezogen: „die Gaben des Aufseherdienstes“'
  alternative: 'Als sinngemäße Ergänzung zu ἀποβάλωμεν: „aus dem Aufseherdienst entfernen“'
  rationale: Die griechische Wortstellung verbindet den Genitiv zunächst mit „Gaben“, lässt im Kontext aber eine Deutung als Entfernung aus dem Amt zu. Die Fußnote bewahrt diese echte syntaktisch-sachliche Spannung.
- issue: Charakter der „Gaben“
  choice: Nicht näher bestimmt
  alternative: Ausdrücklich als eucharistische oder sonstige liturgische Opfergaben deuten
  rationale: Der Wortlaut erlaubt einen kultischen Hintergrund, legt jedoch die genaue Art der Gaben nicht eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufseherdienst“ vermeidet sowohl das konfessionell stärker geprägte „Bischofsamt“ als auch das abstrakte und weniger natürliche „Aufsicht“. Die kultische Färbung von „Gaben darbringen“ bleibt erhalten.
