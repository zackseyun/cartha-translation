  - severity: low
    issue: „in heiliger Gesinnung“ ist stärker innerlich-psychologisch als ὁσίως.
    rationale: Das Adverb bezeichnet eine fromme bzw. heilige Weise des Handelns. „In heiliger Haltung“ ist weiter und näher am griechischen Ausdruck.
