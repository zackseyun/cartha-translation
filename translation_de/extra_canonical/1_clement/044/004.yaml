  source_fidelity: 'Der Haupttext gibt die litotische Aussage, ἀποβάλωμεν, προσφέρειν und die ethisch-kultische Qualifikation grundsätzlich zutreffend wieder. Die Verbindung τὰ δῶρα τῆς ἐπισκοπῆς ist jedoch im Deutschen mit „Gaben des Aufseherdienstes“ semantisch zu unklar: Sie lässt die Gaben wie Eigenschaften oder Erträge des Dienstes erscheinen. Der griechische Genitiv bleibt zwar auslegungsfähig, verweist aber klar auf ἐπισκοπή als Aufsichts- bzw. Leitungsdienst.'
  naturalness: „Verstoßen“ ist hier möglich, klingt im Deutschen aber persönlicher und endgültiger als nötig. „Die Gaben des Aufseherdienstes darbringen“ ist nicht idiomatisch verständlich. „Den Dienst der Aufsicht“ ist modernes, würdiges Standarddeutsch und vermeidet sowohl die anachronistische Festlegung auf ein einzelnes Bischofsamt als auch die schwer verständliche Kompositabildung.
  terminology: „Dienst der Aufsicht“ gibt ἐπισκοπή als Funktion bzw. Amt wieder, ohne eine spätere konfessionelle Amtsstruktur vorauszusetzen. „Untadelig und in heiliger Haltung“ wahrt die religiös-ethische Nuance von ὁσίως besser als die interpretierende Wendung „in heiliger Gesinnung“. Die Fußnote soll die plausible kontextuelle Lesung als Entfernung aus diesem Dienst ausdrücklich als Alternative kenntlich machen, nicht als alleinigen Sinn behaupten.
