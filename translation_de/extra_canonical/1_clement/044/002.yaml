base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: de
  text: 'Aus diesem Grund setzten sie also, nachdem sie vollständige Voraussicht empfangen hatten, die bereits erwähnten Männer ein und trafen danach eine weitere Regelung[a]: Wenn diese entschlafen sollten, sollten andere bewährte Männer ihren Dienst übernehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist selten und in ihrer genauen Bedeutung unsicher; möglich ist auch: „gaben danach eine Anweisung“.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: πρόγνωσιν τελείαν
  choice: vollkommene Vorauskenntnis
  rationale: Gibt sowohl den zeitlichen Vorbezug von πρόγνωσις als auch die starke Aussage von τελείαν wieder, ohne zu erklären, worauf diese Vorauskenntnis beruhte.
- source_word: κατέστησαν
  choice: setzten … ein
  rationale: Natürliche deutsche Wiedergabe für die förmliche Bestellung der bereits genannten Männer.
- source_word: μεταξὺ ἐπινομὴν δεδώκασιν
  choice: trafen danach eine weitere Regelung
  rationale: Gibt die zeitliche Fortführung durch μεταξὺ und den vorsorglichen Charakter der seltenen Wendung mit ἐπινομή wieder; die Unsicherheit der Formulierung wird in der Fußnote kenntlich gemacht.
- source_word: κοιμηθῶσιν
  choice: entschlafen sollten
  rationale: Bewahrt das im Griechischen verwendete würdevolle Bild für den Tod.
- source_word: δεδοκιμασμένοι ἄνδρες
  choice: bewährte Männer
  rationale: δεδοκιμασμένοι bezeichnet Männer, die geprüft wurden und sich als geeignet erwiesen haben.
- source_word: τὴν λειτουργίαν αὐτῶν
  choice: ihren Dienst
  rationale: Im Kontext bezeichnet λειτουργία die anvertraute kirchliche Dienstaufgabe; „Dienst“ bleibt breit genug und vermeidet eine spätere technische Amtsbezeichnung.
theological_decisions:
- issue: Art und Ursprung der Vorauskenntnis
  choice: vollkommene Vorauskenntnis empfangen hatten
  alternative: alles im Voraus wussten
  rationale: Die Übersetzung bewahrt die Aussage, dass die Vorauskenntnis empfangen wurde, ohne ihre genaue Art oder ihren göttlichen Ursprung ausdrücklich auszudeuten.
- issue: Nachfolge im kirchlichen Dienst
  choice: ihren Dienst übernehmen
  alternative: in ihrem Amt nachfolgen
  rationale: Die Formulierung gibt διαδέξωνται und λειτουργία sachlich wieder, ohne eine bestimmte spätere Lehre von Amtsnachfolge in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit behutsam gegliedert; die zeitliche und logische Folge des griechischen Textes bleibt erhalten.
