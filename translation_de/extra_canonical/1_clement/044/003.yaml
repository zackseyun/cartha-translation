revisions:
- from: Die also von jenen eingesetzt wurden oder später von anderen angesehenen Männern mit Zustimmung der ganzen Gemeinde, die der Herde Christi untadelig, in Demut, ruhig und ohne niedere Absichten[a] gedient haben und über viele Jahre hinweg von allen ein gutes Zeugnis erhalten haben – bei diesen halten wir es nicht für gerecht, sie aus dem Dienst zu entfernen.
  to: Diejenigen nun, die von ihnen eingesetzt wurden oder später von anderen angesehenen Männern, mit Zustimmung der ganzen Gemeinde, und die der Herde Christi untadelig in Demut, ruhig und ohne Anmaßung[a] gedient haben und denen alle über viele Jahre hinweg ein gutes Zeugnis ausgestellt haben – diese, so meinen wir, dürfen nicht mit Recht aus dem Dienst entfernt werden.
  rationale: Die Revision klärt die deutsche Syntax, bewahrt aber die rhetorische Voranstellung und die Wiederaufnahme des griechischen Satzes. „Dürfen nicht mit Recht ... entfernt werden“ gibt die normative Wertung von οὐ δικαίως mit dem passiven Infinitiv wieder, ohne zu behaupten, die Entfernung sei bereits erfolgt. Die Wiedergabe von ἀβαναύσως wird von einer zu spezifischen Motivunterstellung zu „ohne Anmaßung“ korrigiert und durch eine zurückhaltende Fußnote ergänzt.
  reviewer_model: gpt-5.6-terra
