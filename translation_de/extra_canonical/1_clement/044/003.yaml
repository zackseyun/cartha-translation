id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: de
  text: Diejenigen nun, die von ihnen eingesetzt wurden oder später von anderen angesehenen Männern, mit Zustimmung der ganzen Gemeinde, und die der Herde Christi untadelig in Demut, ruhig und ohne Anmaßung[a] gedient haben und denen alle über viele Jahre hinweg ein gutes Zeugnis ausgestellt haben – diese, so meinen wir, dürfen nicht mit Recht aus dem Dienst entfernt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann auch „ohne Eigennutz“, „unaufdringlich“ oder „ohne unwürdiges Streben“ bedeuten.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: μεταξὺ
  choice: später
  rationale: 'Das adverbiale μεταξὺ bezeichnet hier die nachfolgende Zwischenzeit: weitere Einsetzungen erfolgten später.'
- source_word: ἐλλογίμων ἀνδρῶν
  choice: angesehenen Männern
  rationale: ἐλλόγιμος bezeichnet Personen von Ansehen beziehungsweise gutem Ruf; „angesehen“ ist im Deutschen natürlich und präzise.
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: mit Zustimmung der ganzen Gemeinde
  rationale: Der Genitivus absolutus beschreibt die Mitwirkung beziehungsweise Zustimmung der gesamten ἐκκλησία. „Gemeinde“ vermeidet hier eine unnötig institutionelle Verengung.
- source_word: λειτουργήσαντας … τῆς λειτουργίας
  choice: gedient haben … aus dem Dienst
  rationale: Die Wiederholung des Wortstamms wird im Deutschen durch „dienen/Dienst“ bewahrt, ohne λειτουργία vorschnell als ein bestimmtes kirchliches Amt oder als Liturgie zu deuten.
- source_word: ἡσύχως
  choice: ruhig
  rationale: Das Adverb bezeichnet stilles, friedliches und nicht Unruhe stiftendes Handeln; „ruhig“ bewahrt die knappe Formulierung.
- source_word: ἀβαναύσως
  choice: ohne niedere Absichten
  rationale: Das seltene Wort verneint banausisches, unwürdiges oder niedrig eigennütziges Verhalten. Die Formulierung bleibt verständlich, ohne die Bedeutung ausschließlich auf Gewinnsucht oder Anmaßung festzulegen.
- source_word: μεμαρτυρημένους … ὑπὸ πάντων
  choice: von allen ein gutes Zeugnis erhalten haben
  rationale: Der passive Ausdruck meint, dass ihnen von allen über lange Zeit anerkennend Zeugnis ausgestellt wurde; „ein gutes Zeugnis“ macht die positive Aussage im Deutschen deutlich.
- source_word: οὐ δικαίως … ἀποβάλλεσθαι
  choice: nicht für gerecht, sie … zu entfernen
  rationale: Die Wendung bewertet ihre Entfernung als nicht gerechtfertigt. Diese deutsche Konstruktion gibt die Aussage idiomatisch wieder und bewahrt die passive Betroffenheit der genannten Personen.
theological_decisions:
- issue: Bedeutung von ἐκκλησία
  choice: Gemeinde
  alternative: Kirche
  rationale: Im Zusammenhang der gemeinschaftlichen Zustimmung bezeichnet ἐκκλησία die versammelte Glaubensgemeinschaft; „Gemeinde“ ist sachlich passend und legt keine spätere Kirchenstruktur in den Text hinein.
- issue: Bedeutung von λειτουργία
  choice: Dienst
  alternative: Amt
  rationale: Der griechische Ausdruck kann einen beauftragten Gemeindedienst einschließen, benennt hier aber nicht eindeutig ein technisch definiertes Amt. „Dienst“ wahrt diese Offenheit.
- issue: Wiedergabe der Satzbewertung
  choice: wir halten es nicht für gerecht, sie aus dem Dienst zu entfernen
  alternative: wir meinen, dass sie zu Unrecht aus dem Dienst entfernt werden
  rationale: Der griechische Infinitiv kann als Bewertung einer Entfernung oder als Aussage über ein Geschehen verstanden werden. Die gewählte Fassung bewahrt den normativen Schwerpunkt, ohne festzulegen, ob die Entfernung bereits vollzogen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte lange Personenbeschreibung und die Wiederaufnahme mit „bei diesen“ bilden die griechische Linksversetzung verständlich nach. „Gemeinde“ und „Dienst“ vermeiden spätere institutionelle oder liturgische Festlegungen.
