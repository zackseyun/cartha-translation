review_pass:
  verdict: revise
  source_fidelity: Der Entzug aus dem Dienst (μετηγάγετε ἐκ τῆς λειτουργίας) sowie die Aussage, dass die Betroffenen diesen Dienst untadelig in Ehren hielten (ἀμέμπτως αὐτοῖς τετιμημένης), sind sachgerecht wiedergegeben. Die aktive deutsche Formulierung vermeidet zutreffend eine missverständliche Wiedergabe von τετιμημένης als „zugewiesen“. Allerdings steht καλῶς πολιτευομένους im Präsenspartizip und bezeichnet ihr damaliges fortdauerndes Verhalten; „die sich gut geführt haben“ klingt im Deutschen eher abgeschlossen.
  naturalness: „Die ein gutes Leben führten“ ist modernes, würdiges Standarddeutsch und bildet die ethisch geprägte, andauernde Verhaltensführung von πολιτεύομαι natürlicher ab als „die sich gut geführt haben“.
  terminology: „Dienst“ ist für λειτουργία kontextgerecht und ohne spätere amtstheologische Verengung. „Untadelig in Ehren hielten“ bewahrt sowohl ἀμέμπτως als auch die durch das Perfekt ausgedrückte bestehende Würdigung des Dienstes.
  issues:
