    issue: Zeit- und Aspektwiedergabe von καλῶς πολιτευομένους
    rationale: Das Präsenspartizip beschreibt diejenigen, die sich zur Zeit ihrer Entfernung gut verhielten bzw. ein gutes Leben führten. Das deutsche Perfekt „geführt haben“ kann eine abgeschlossene Vorzeitigkeit nahelegen.
