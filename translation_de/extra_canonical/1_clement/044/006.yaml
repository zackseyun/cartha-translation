source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: de
  text: Denn wir sehen, dass ihr einige, die ein gutes Leben führten, aus dem Dienst entfernt habt, den sie ohne Tadel in Ehren gehalten hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »aus dem von ihnen untadelig geehrten Dienst«.'
    reason: Die Fußnote macht die im Deutschen weniger natürliche passive Form des griechischen Ausdrucks sichtbar; der Haupttext gibt sie idiomatisch als Relativsatz wieder.
lexical_decisions:
- source_word: μετηγάγετε
  choice: entfernt habt
  rationale: Das Verb bezeichnet hier das Wegbringen beziehungsweise Entfernen aus einem Dienst. »Entfernt« gibt den Vorgang direkt und idiomatisch wieder, ohne eine bloße Versetzung nahezulegen.
- source_word: καλῶς πολιτευομένους
  choice: die sich gut geführt haben
  rationale: πολιτεύομαι beschreibt hier die Lebens- oder Verhaltensführung. Die Formulierung bleibt allgemein und verengt den Sinn nicht auf die Amtsausübung.
- source_word: λειτουργίας
  choice: Dienst
  rationale: Im Kontext bezeichnet λειτουργία einen anvertrauten gemeinschaftlichen beziehungsweise kirchlichen Dienst. »Dienst« ist natürlich und vermeidet unnötig kultische oder spätere amtstheologische Festlegungen.
- source_word: ἀμέμπτως αὐτοῖς τετιμημένης
  choice: den sie ohne Tadel in Ehren gehalten hatten
  rationale: 'Die aktive deutsche Relativkonstruktion gibt das griechische Perfekt Passiv mit αὐτοῖς als Handelnden natürlich wieder: Der Dienst war von ihnen geehrt worden. »Ohne Tadel« bewahrt ἀμέμπτως, ohne τετιμημένης fälschlich als »zugewiesen« zu verstehen.'
theological_decisions:
- issue: Charakter des erwähnten Dienstes
  choice: allgemein »Dienst«
  alternative: »Amt« oder »liturgischer Dienst«
  rationale: Der griechische Ausdruck bezeichnet einen Dienst, legt an dieser Stelle aber weder eine präzise spätere Amtsordnung noch ausschließlich einen gottesdienstlichen Vollzug fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nah am griechischen Argument, während die schwerfällige Passivkonstruktion idiomatisch als Relativsatz wiedergegeben wird.
