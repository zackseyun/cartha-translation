  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
translation:
  language: de
  text: 'Wegen der plötzlichen und sich häufenden Unglücksfälle und Bedrängnisse, Brüder, meinen wir, uns den bei euch umstrittenen Angelegenheiten[a] erst verspätet zugewandt zu haben, Geliebte: nämlich jenem befleckten und gottlosen Aufruhr, der den Erwählten Gottes fremd und fernliegend ist und den einige wenige voreilige und eigenwillige Personen zu einem solchen Maß an Wahnsinn angefacht haben, dass euer ehrwürdiger, weithin bekannter und bei allen Menschen hochgeschätzter Name schwer gelästert worden ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »den Angelegenheiten, nach denen bei euch gefragt wird«. Das griechische ἐπιζητουμένων παρ’ ὑμῖν kann auf umstrittene beziehungsweise erörterte Fragen zielen, lässt aber auch eine allgemeinere Wiedergabe als Angelegenheiten zu, nach denen gefragt oder die gesucht werden; ein ausdrückliches »von uns« steht nicht im Text.'
    reason: Die Anmerkung wahrt die mögliche weitere Bedeutung von ἐπιζητουμένων, ohne die nicht im griechischen Text ausgedrückte Richtung »von uns« einzutragen.
lexical_decisions:
- source_word: αἰφνιδίους καὶ ἐπαλλήλους
  choice: plötzlichen und Schlag auf Schlag
  rationale: Gibt sowohl das unerwartete Eintreten als auch die rasche Folge der Ereignisse idiomatisch wieder.
- source_word: συμφορὰς καὶ περιστάσεις
  choice: Unglücksfälle und Bedrängnisse
  rationale: Bewahrt die Unterscheidung zwischen widerfahrenem Unglück und bedrängenden Krisenlagen.
- source_word: ἐπιστροφὴν πεποιῆσθαι
  choice: uns … zugewandt zu haben
  rationale: Entspricht dem Gedanken, die Aufmerksamkeit auf die betreffenden Angelegenheiten zu richten, ohne eine förmliche Antwort in den Text hineinzulesen.
- source_word: στάσεως
  choice: Aufruhr
  rationale: Bezeichnet hier nicht bloß Meinungsverschiedenheit, sondern einen gemeinschaftszerstörenden Konflikt beziehungsweise eine Erhebung.
- source_word: μιαρᾶς καὶ ἀνοσίου
  choice: abscheulichen und unheiligen
  rationale: Gibt die kultisch-moralische Verunreinigung und die Gottlosigkeit in natürlichem Deutsch wieder.
- source_word: ἀπονοίας
  choice: Wahnsinns
  rationale: Bewahrt die starke Wertung des griechischen Ausdrucks für vernunftlose, verderbliche Verblendung.
- source_word: βλασφημηθῆναι
  choice: gelästert worden ist
  rationale: Erhält die religiös und moralisch gewichtige Sprache des Verbs, statt sie lediglich als Rufschädigung abzuschwächen.
theological_decisions:
- issue: Bezug der Eigenschaften ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ
  choice: Der Aufruhr ist den Erwählten Gottes fremd und wesensfremd.
  alternative: Der Aufruhr gehört nicht zu den Erwählten Gottes.
  rationale: Die gewählte Formulierung bewahrt den ethisch-theologischen Gegensatz, ohne eine Aussage über den endgültigen Erwählungsstatus einzelner Beteiligter zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Periode wurde nach der Anrede »Geliebte« geteilt, damit die Satzbezüge für heutige Leser klar bleiben. Wiederholte Anreden und die starke moralisch-theologische Tonlage wurden bewahrt.
