revisions:
- from: Wegen der plötzlichen und Schlag auf Schlag über uns gekommenen Unglücksfälle und Bedrängnisse, Brüder, meinen wir, uns erst spät den bei euch umstrittenen Angelegenheiten[a] zugewandt zu haben, Geliebte. Es geht um jenen abscheulichen und unheiligen Aufruhr, der den Erwählten Gottes fremd und wesensfremd ist. Einige wenige voreilige und eigenwillige Personen haben ihn bis zu einem solchen Ausmaß des Wahnsinns angefacht, dass euer ehrwürdiger, weithin bekannter und bei allen Menschen hochgeschätzter Name schwer gelästert worden ist.
  to: 'Wegen der plötzlichen und sich häufenden Unglücksfälle und Bedrängnisse, Brüder, meinen wir, uns den bei euch umstrittenen Angelegenheiten[a] erst verspätet zugewandt zu haben, Geliebte: nämlich jenem befleckten und gottlosen Aufruhr, der den Erwählten Gottes fremd und fernliegend ist und den einige wenige voreilige und eigenwillige Personen zu einem solchen Maß an Wahnsinn angefacht haben, dass euer ehrwürdiger, weithin bekannter und bei allen Menschen hochgeschätzter Name schwer gelästert worden ist.'
  rationale: Die Revision präzisiert die kultisch-moralische Wertung von μιαράς, vermeidet eine deutsche Tautologie bei ἀλλοτρία καὶ ξένη und glättet die Wiedergabe von ἐπαλλήλους. Die Aussage über den Aufruhr bleibt klar als Apposition zu den bei den Adressaten umstrittenen Angelegenheiten verbunden; die Deutung des Partizips ἐπιζητουμένων wird weiterhin nur in der Fußnote als Alternative kenntlich gemacht.
