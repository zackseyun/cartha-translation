  naturalness: Der Text ist gut verständlich und würdig. „Plötzlichen und Schlag auf Schlag über uns gekommenen“ ist jedoch syntaktisch etwas schwerfällig; „plötzlichen und sich häufenden“ ist idiomatischer und bewahrt ἐπαλλήλους. Eine einheitliche Periode bildet zudem die griechische Apposition klarer ab.
  terminology: „Erwählte Gottes“, „Aufruhr“ und „gelästert“ passen zu Register und Begrifflichkeit. „Befleckten und gottlosen“ gibt μιαρᾶς καὶ ἀνοσίου präziser wieder als „abscheulichen und unheiligen“.
