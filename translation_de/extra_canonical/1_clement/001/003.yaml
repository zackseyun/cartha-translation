source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: de
  text: Denn ihr tatet alles ohne Ansehen der Person[a] und lebtet nach den Satzungen Gottes. Ihr ordnetet euch euren Leitern unter und erwieset den Älteren unter euch die gebührende Ehre. Die Jüngeren wieset ihr an, maßvoll und würdig zu denken. Den Frauen trugt ihr auf, alles mit einem untadeligen, würdigen und reinen Gewissen zu tun und ihre eigenen Männer zu lieben, wie es sich gehört. Ihr lehrtet sie, in der Ordnung der Unterordnung den Haushalt in würdiger Weise zu führen und dabei in jeder Hinsicht besonnen zu sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ohne Parteilichkeit« beziehungsweise »ohne Ansehen einer Person«.'
    reason: Die feste deutsche Wendung kann altertümlich wirken; die Fußnote verdeutlicht ihren Sinn.
  - marker: b
    text: 'Oder: »Ihr lehrtet sie, unter der Ordnung der Unterordnung stehend, den Haushalt in würdiger Weise zu führen, ganz und gar besonnen.«'
    reason: Die Partizipien ὑπαρχούσας und σωφρονούσας können im Deutschen als Begleitumstände oder enger an die jeweiligen Infinitive angeschlossen werden.
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: ohne Ansehen der Person
  rationale: Die geläufige biblische Wendung gibt das unparteiische Handeln präzise und würdig wieder.
- source_word: τοῖς ἡγουμένοις
  choice: euren Leitern
  rationale: Bezeichnet die führenden Personen der Gemeinschaft, ohne ein späteres festes Kirchenamt in den Text einzutragen.
- source_word: τοῖς παρ’ ὑμῖν πρεσβυτέροις
  choice: den Älteren unter euch
  rationale: Bewahrt die mögliche Bedeutung älterer Menschen beziehungsweise von Ältesten, statt sie vorschnell amtlich festzulegen.
- source_word: μέτρα καὶ σεμνὰ νοεῖν
  choice: maßvoll und würdig zu denken
  rationale: Das überlieferte μέτρα ist ungewöhnlich und wohl eine Text- oder OCR-Variante zu μέτρια; die Übersetzung folgt dem im Kontext klaren Sinn, ohne die Formulierung auszuschmücken.
- source_word: κανόνι τῆς ὑποταγῆς
  choice: Ordnung der Unterordnung
  rationale: Gibt sowohl κανών als verbindliche Ordnung beziehungsweise Richtschnur als auch ὑποταγή ausdrücklich wieder.
- source_word: οἰκουρεῖν
  choice: den Haushalt ... zu führen
  rationale: Natürliches modernes Deutsch für die verantwortliche Sorge um die häuslichen Angelegenheiten.
- source_word: πάνυ σωφρονούσας
  choice: in jeder Hinsicht besonnen zu sein
  rationale: σωφροσύνη umfasst Besonnenheit, Selbstbeherrschung und maßvolles Verhalten; die Formulierung wahrt diese Breite.
theological_decisions:
- issue: Amtscharakter von πρεσβύτεροι
  choice: Älteren
  alternative: Ältesten
  rationale: Der Kontext erlaubt eine amtliche Lesart, erzwingt sie jedoch nicht eindeutig; die Wiedergabe bewahrt diese Spannung.
- issue: Bezug und Stärke der Unterordnung
  choice: sich an die Ordnung der Unterordnung zu halten
  alternative: unter der Regel der Unterordnung zu stehen
  rationale: Die gewählte Fassung gibt die bestehende Unterordnung wieder, ohne ihren konkreten sozialen oder kirchlichen Umfang über den griechischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch vertrauter, aber verständlicher Ausdrucksweise. Die wiederholten Imperfekte werden als fortdauernde frühere Praxis durch Präteritum wiedergegeben. Leitungs- und Amtsbegriffe bleiben bewusst semantisch offen.
