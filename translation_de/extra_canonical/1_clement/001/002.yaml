id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: de
  text: Denn wer bei euch zu Gast war, hat nicht euren in jeder Hinsicht vortrefflichen und standhaften Glauben als bewährt anerkannt? Wer hat nicht eure besonnene und milde Frömmigkeit im Messias bewundert? Wer hat nicht den großartigen Charakter eurer Gastfreundschaft verkündet? Und wer hat nicht eure vollkommene und sichere Erkenntnis seliggepriesen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας πρὸς ὑμᾶς
  choice: der sich bei euch als Fremder aufhielt
  rationale: Gibt sowohl den vorübergehenden Aufenthalt als auch den im Verb enthaltenen Gedanken des Fremdseins wieder.
- source_word: πανάρετον καὶ βεβαίαν ... πίστιν
  choice: in jeder Hinsicht vortrefflichen und standhaften Glauben
  rationale: πανάρετος bezeichnet umfassende Vortrefflichkeit; βέβαιος Festigkeit oder Beständigkeit. πίστις bleibt hier bewusst mit „Glauben“ wiedergegeben.
- source_word: ἐδοκίμασεν
  choice: als bewährt anerkannt
  rationale: Bewahrt den Gedanken einer positiven Beurteilung nach Prüfung, statt das Verb nur als allgemeines Gutheißen wiederzugeben.
- source_word: σώφρονα καὶ ἐπιεικῆ ... εὐσέβειαν
  choice: besonnene und milde Frömmigkeit
  rationale: σώφρων umfasst Besonnenheit und Selbstbeherrschung; ἐπιεικής bezeichnet Milde und entgegenkommende Nachsicht; εὐσέβεια ist hier natürliche religiöse Frömmigkeit.
- source_word: μεγαλοπρεπὲς ... ἦθος
  choice: großartige Haltung
  rationale: ἦθος bezeichnet Charakter oder Haltung; die Formulierung erhält diese Nuance, ohne sie in das bloße Adjektiv „großzügig“ aufzulösen.
- source_word: ἐμακάρισεν
  choice: seliggepriesen
  rationale: Spiegelt das starke Werturteil von μακαρίζω genauer als ein bloßes „gelobt“.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: Χριστός ist der griechische Titel „Gesalbter“; „Messias“ hält den Titelcharakter ausdrücklich fest, ohne die Verbindung als bloße Zugehörigkeitsangabe umzudeuten.
- issue: Bedeutung von πίστις
  choice: Glauben
  alternative: Treue
  rationale: Der Zusammenhang erlaubt grundsätzlich sowohl Glauben als auch Treue beziehungsweise Zuverlässigkeit. „Glauben“ ist hier im frühchristlichen Kontext die naheliegende Hauptwiedergabe; die beschreibenden Adjektive lassen seine beständige, gelebte Seite hervortreten.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die vier rhetorischen Fragen und ihre steigernde Parallelität bleiben erhalten; altertümliche Formen und unnötig konfessionelle Terminologie werden vermieden.
