id: 1CLEM.4.12
reference: 1 Clement 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: de
  text: Eifersucht brachte Datan und Abiram lebendig ins Totenreich hinab, weil sie sich gegen Mose, den Diener Gottes, aufgelehnt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Gibt das wiederkehrende Motiv ζῆλος konkret und verständlich wieder; je nach Kontext wäre auch „Neid“ möglich, doch hier wird die zerstörerische Eifersucht als antreibende Macht personifiziert.
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  choice: ließ … lebendig ins Totenreich hinabfahren
  rationale: Bewahrt sowohl das Lebendig-Hinabfahren als auch die räumliche Bildsprache. „Totenreich“ bezeichnet den Hades, ohne ihn vorschnell mit der Hölle gleichzusetzen.
- source_word: στασιάσαι … πρὸς
  choice: sich gegen … aufgelehnt hatten
  rationale: Drückt den rebellischen Widerstand natürlich aus und bewahrt den Bezug auf die Erzählung von Datan und Abiram.
- source_word: θεράποντα τοῦ θεοῦ
  choice: Diener Gottes
  rationale: θεράπων ist hier ein ehrender biblischer Titel für Mose; „Diener“ wahrt diesen Rang und klingt im Deutschen natürlicher als „Bediensteter“ oder „Gehilfe“.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Totenreich
  alternative: Hades
  rationale: „Totenreich“ erhält die Vorstellung des Aufenthalts der Toten und vermeidet die theologisch verengende Gleichsetzung mit „Hölle“.
- issue: 'Titel des Mose: θεράπων τοῦ θεοῦ'
  choice: Diener Gottes
  alternative: Gehilfe Gottes
  rationale: Im biblischen Mose-Kontext ist θεράπων ein Ehrentitel. „Diener Gottes“ trägt diese Resonanz, ohne eine weitergehende konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klar und nah an der griechischen Aussage; die Personifikation der Eifersucht und das Motiv des lebendigen Hinabfahrens werden bewahrt.
