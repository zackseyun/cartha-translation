source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: de
  text: Und Gott blickte auf Abel und auf seine Gaben[a]; auf Kain aber und auf seine Opfer achtete er nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Geschenke.'
    reason: „Gaben“ gibt δῶρα im Opferkontext natürlich wieder; die Fußnote macht den allgemeineren Grundsinn des griechischen Wortes sichtbar.
lexical_decisions:
- source_word: εἶδεν ... ἐπί
  choice: blickte auf
  rationale: Gibt die wörtliche Bildsprache des Sehens mit ἐπί natürlich und in würdigem Deutsch wieder; im Zusammenhang bezeichnet es Gottes wohlwollende Zuwendung.
- source_word: δῶρα
  choice: Gaben
  rationale: Entspricht dem allgemeinen Sinn von δῶρα und bewahrt den Unterschied zum folgenden θυσίαις.
- source_word: θυσίαις
  choice: Opfer
  rationale: Gibt den kultischen Opferbegriff idiomatisch und prägnant wieder.
- source_word: οὐ προσέσχεν
  choice: achtete er nicht
  rationale: Entspricht der Bedeutung „Aufmerksamkeit schenken, beachten“ und erhält den Kontrast zu Gottes Blick auf Abel, ohne eine zusätzliche Erklärung einzutragen.
theological_decisions:
- issue: Art von Gottes Zuwendung zu Abel und seinen Gaben
  choice: „blickte auf“ ohne erklärenden Zusatz
  alternative: „sah wohlgefällig an“ oder „nahm gnädig an“
  rationale: Der griechische Wortlaut drückt die Zuwendung durch das Verb des Sehens aus, benennt aber weder Wohlgefallen noch Annahme ausdrücklich; die Übersetzung bewahrt diese Spannung.
- issue: Verhältnis von Person und Opfergabe
  choice: Beide Satzglieder werden jeweils ausdrücklich genannt
  alternative: Zusammenfassende Wiedergabe wie „nahm Abels Opfer an“
  rationale: Die parallele Struktur des Originals unterscheidet Abel/Kain jeweils von ihren Gaben/Opfern und soll nicht theologisch eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht schriftsprachlichem Klang. Die parallele Struktur und der adversative Gegensatz des griechischen Textes bleiben erhalten.
