  yaml_path: translation/extra_canonical/1_clement/004/011.yaml
  text: Because of jealousy Aaron and Miriam lodged outside the camp.
translation:
  language: de
  text: Aus Eifersucht hielten sich Aaron und Mirjam außerhalb des Lagers auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: Aus Eifersucht
  rationale: Gibt die Ursache natürlich und knapp wieder. Das griechische ζῆλος kann je nach Zusammenhang »Eifer« oder »Eifersucht« bedeuten; hier bezeichnet es den missgünstigen Widerstand gegen Mose.
- source_word: παρεμβολῆς
  choice: Lagers
  rationale: Im erzählten Wüstenkontext bezeichnet παρεμβολή das Lager Israels.
- source_word: ηὐλίσθησαν
  choice: mussten … bleiben
  rationale: Das Verb bedeutet wörtlich, sich aufzuhalten bzw. zu lagern. Im Bezug auf Numeri 12 bringt die Formulierung idiomatisch zum Ausdruck, dass sie außerhalb des Lagers verweilen mussten.
theological_decisions:
- issue: Aaron und Mirjam werden gemeinsam als außerhalb des Lagers befindlich dargestellt
  choice: Die gemeinsame Aussage des griechischen Textes wird unverändert bewahrt.
  alternative: Nur Mirjams siebentägigen Ausschluss entsprechend Numeri 12 ausdrücklich nennen.
  rationale: 1 Clemens formuliert im Plural und nennt sowohl Aaron als auch Mirjam; eine Harmonisierung mit der alttestamentlichen Erzählung würde die vorliegende Textaussage korrigieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und verständlich. Die Wiedergabe folgt der griechischen Aussage, auch wo sie gegenüber Numeri 12 eine Spannung erkennen lässt.
