  source_fidelity: Die kausale Aussage und die beiden von ζῆλος abhängigen Infinitive sind zutreffend erfasst. „Bis hin zum Tod“ kann im Deutschen jedoch stärker nach einem tatsächlichen Tod klingen als die hier kontextuell als Grenz-/Extremangabe verstandene Wendung μέχρι θανάτου. Zudem sollte die parallele μέχρι-Markierung vor δουλείας auch in der deutschen Fassung erkennbar bleiben.
  naturalness: „Bis an die Grenze des Todes“ ist modernes, klares Standarddeutsch und vermeidet die missverständliche Implikation, Josef sei gestorben. „Bis in die Sklaverei hinein geriet“ gibt die Bewegung in diesen Zustand idiomatisch wieder und erhält die Steigerung des Satzes.
  terminology: „Neid“ ist für ζῆλος in diesem Zusammenhang passend. „Sklaverei“ ist die sachgerechte Wiedergabe von δουλεία. „Josef“ folgt der üblichen deutschen Namensform.
