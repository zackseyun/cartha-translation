    rationale: Das zweite μέχρι markiert parallel die äußerste Folge bzw. das Hineingelangen in den Zustand der Sklaverei und sollte in einer optimal-äquivalenten Übersetzung sichtbar bleiben.
  revised_text: Neid führte dazu, dass Josef bis an die Grenze des Todes verfolgt wurde und bis in die Sklaverei hinein geriet.
