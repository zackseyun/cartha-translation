source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος ἐποίησεν Ἰωσὴφ μέχρι θανάτου διωχθῆναι καὶ μέχρι δουλείας εἰσελθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/009.yaml
  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
translation:
  language: de
  text: Neid führte dazu, dass Josef bis an die Grenze des Todes verfolgt wurde und bis in die Sklaverei hinein geriet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: Neid
  rationale: Im Zusammenhang mit Josef bezeichnet das Wort die missgünstige Haltung, die zur Verfolgung führte. „Neid“ ist im modernen Deutschen natürlicher und eindeutiger als das oft romantisch verstandene „Eifersucht“.
- source_word: ἐποίησεν
  choice: führte dazu, dass
  rationale: Gibt die verursachende Konstruktion mit zwei Infinitiven natürlich wieder, ohne ihre Aussagekraft abzuschwächen.
- source_word: μέχρι θανάτου διωχθῆναι
  choice: bis hin zum Tod verfolgt wurde
  rationale: Bewahrt die Reichweiten- bzw. Grenzbedeutung von μέχρι und zugleich die Spannung der Formulierung, ohne ausdrücklich festzulegen, dass Josef tatsächlich starb.
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: in die Sklaverei geriet
  rationale: Natürliche deutsche Wiedergabe des Eintretens in den Zustand der Sklaverei; die mit μέχρι bezeichnete äußerste Folge ist im Zusammenhang hinreichend ausgedrückt.
theological_decisions:
- issue: Bedeutet μέχρι θανάτου den tatsächlichen Tod oder eine Verfolgung bis an die Todesgrenze?
  choice: Die mehrdeutige Formulierung „bis hin zum Tod“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
  alternative: „bis an den Rand des Todes“ beziehungsweise „bis in Todesgefahr“
  rationale: Josef wurde nach der Genesis-Erzählung nicht getötet, doch die griechische Wendung nennt wörtlich den Tod als Grenze. Die Übersetzung soll weder einen tatsächlichen Tod behaupten noch die zugespitzte Ausdrucksweise des Autors einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und folgt der kausalen Struktur des Griechischen, vermeidet aber eine im Deutschen schwerfällige doppelte Infinitivkonstruktion.
