source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: de
  text: 'Und Gott sagte zu Kain: »Warum bist du betrübt geworden, und warum hat sich dein Gesicht gesenkt? Wenn du richtig darbringst, aber nicht richtig zuteilst, hast du dann nicht gesündigt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: betrübt
  rationale: Gibt den Zustand tiefer Traurigkeit in natürlichem, würdigem Deutsch wieder, ohne die Intensität durch einen Zusatz unnötig festzulegen.
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: hat sich dein Gesicht gesenkt
  rationale: Bewahrt das griechische Bild des niedergesunkenen Gesichts und klingt im Deutschen verständlich.
- source_word: προσενέγκῃς
  choice: darbringst
  rationale: Entspricht dem kultischen Zusammenhang einer Opfergabe und bleibt zugleich nah am griechischen Verb.
- source_word: διέλῃς
  choice: zuteilst
  rationale: Bewahrt die konkrete Bedeutung des Teilens bzw. Zuteilens, ohne die im griechischen Wortlaut offene Art des Vorgangs näher zu bestimmen.
- source_word: ἥμαρτες
  choice: hast du nicht gesündigt?
  rationale: Gibt den Aorist als vollzogene Verfehlung wieder und erhält die rhetorische Frage.
theological_decisions:
- issue: Bedeutung von ὀρθῶς δὲ μὴ διέλῃς
  choice: aber nicht richtig zuteilst
  alternative: aber nicht richtig unterscheidest
  rationale: Der Wortlaut folgt der konkreten Grundbedeutung von διαιρέω und der überlieferten Form der Genesis-Stelle in der Septuaginta. Er legt nicht fest, worin Kains falsches Zuteilen bestand.
- issue: Satzbau der Bedingungsfrage
  choice: Hast du nicht gesündigt, wenn du zwar richtig darbringst, aber nicht richtig zuteilst?
  alternative: Wenn du richtig darbringst, aber nicht richtig zuteilst, hast du dann nicht gesündigt?
  rationale: Die gewählte Form ist idiomatisch und bewahrt sowohl den konditionalen Zusammenhang als auch die theologische Spannung zwischen richtiger Darbringung und falscher Zuteilung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede wird typografisch klar markiert; die eigentümliche Formulierung der zugrunde liegenden Septuaginta-Tradition bleibt erhalten.
