source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: de
  text: 'Neid[a] zwang Mose, vor dem Pharao, dem König von Ägypten, zu fliehen, als er von einem seiner Volksgenossen hörte: »Wer hat dich zum Richter oder Schiedsrichter über uns eingesetzt? Willst du mich etwa töten, so wie du gestern den Ägypter getötet hast?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Eifersucht; das griechische Wort kann je nach Zusammenhang auch Eifer oder eifersüchtigen Neid bezeichnen.'
    reason: Das Bedeutungsspektrum von ζῆλος ist breiter als das deutsche „Neid“, während der Kontext hier eine schädliche, feindselige Haltung verlangt.
lexical_decisions:
- source_word: ζῆλος
  choice: Neid
  rationale: Im Zusammenhang bezeichnet das Wort die feindselige Missgunst, die zu Moses Flucht führte. „Neid“ ist im modernen Deutschen natürlicher und weniger auf partnerschaftliche Eifersucht verengt als „Eifersucht“.
- source_word: ἀπὸ προσώπου
  choice: vor dem Pharao … fliehen
  rationale: Die Wendung bedeutet hier, sich der Gegenwart beziehungsweise dem Zugriff des Pharaos durch Flucht zu entziehen; die idiomatische deutsche Verbindung „vor jemandem fliehen“ gibt dies präzise wieder.
- source_word: ὁμόφυλος
  choice: einer seiner Stammesgenossen
  rationale: Das Wort bezeichnet einen Menschen gleicher Abstammung beziehungsweise Volkszugehörigkeit; „Stammesgenosse“ bewahrt diesen Bezug.
- source_word: κριτὴν ἢ δικαστὴν
  choice: Richter oder Schiedsrichter
  rationale: Beide griechischen Begriffe sind ausdrücklich juristisch. Die Wiedergabe erhält die Doppelung, ohne den ersten Begriff mit dem aus der vertrauten Exodusfassung stammenden „Herrscher“ zu harmonisieren.
- source_word: μὴ … θέλεις
  choice: Willst du mich etwa …?
  rationale: Das einleitende μή kennzeichnet eine Frage, bei der eine verneinende Antwort erwartet oder nahegelegt wird; „etwa“ vermittelt diese Färbung natürlich.
theological_decisions:
- issue: Personifizierung beziehungsweise ursächliche Rolle des Neids
  choice: „Neid zwang Mose“
  alternative: „Aus Neid musste Mose fliehen“
  rationale: Die grammatische Konstruktion macht ζῆλος ausdrücklich zum Subjekt von ἠνάγκασεν. Die Übersetzung bewahrt daher Clements zugespitzte Darstellung des Neids als wirkende Macht.
- issue: Abweichung von der geläufigen Exodusformulierung
  choice: „Richter oder Schiedsrichter“
  alternative: „Herrscher und Richter“
  rationale: Clements überlieferter Text hat κριτήν ἢ δικαστήν und damit zwei juristische Bezeichnungen. Er wird nicht stillschweigend an Exodus 2,14 in der Septuaginta angeglichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne umgangssprachlich zu wirken. Der lange griechische Satz wurde für bessere Verständlichkeit in zwei deutsche Sätze gegliedert.
