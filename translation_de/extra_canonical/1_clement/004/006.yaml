  source_fidelity: 'Die Übersetzung gibt den griechischen Wortlaut zuverlässig wieder: Kains Anrede an Abel, die Aufforderung, aufs Feld zu gehen, den zeitlichen Ablauf im Feld sowie den gewaltsamen Angriff und die Tötung. »Als sie auf dem Feld waren« ist eine idiomatische und sachlich angemessene Wiedergabe von καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς ἐν τῷ πεδίῳ.'
