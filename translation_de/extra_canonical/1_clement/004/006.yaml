  terminology: Die Namen Kain und Abel sind standardsprachlich. »tötete ihn« ist für ἀπέκτεινεν direkt und neutral. Die wiederholte Bezeichnung »seinen Bruder Abel« bewahrt die Vorlage ohne unnatürlich zu wirken.
