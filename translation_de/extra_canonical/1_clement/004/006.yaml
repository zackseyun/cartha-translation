source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν Κάϊν πρὸς Ἄβελ τὸν ἀδελφὸν αὐτοῦ· Διέλθωμεν εἰς τὸ πεδίον. καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς ἐν τῷ πεδίῳ, ἀνέστη Κάϊν ἐπʼ Ἄβελ τὸν ἀδελφὸν αὐτοῦ καὶ ἀπέκτεινεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: de
  text: 'Und Kain sagte zu seinem Bruder Abel: »Lasst uns aufs Feld gehen.« Als sie auf dem Feld waren, erhob sich Kain gegen seinen Bruder Abel und tötete ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: Lasst uns aufs Feld gehen
  rationale: διέρχομαι bezeichnet hier zusammen mit εἰς die Bewegung an einen anderen Ort; im Deutschen gibt »aufs Feld gehen« den erzählerischen Sinn natürlich wieder, ohne fälschlich ein Durchqueren des Feldes anzudeuten.
- source_word: καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς
  choice: Als sie … waren
  rationale: Die griechische Septuaginta-Formel wird in idiomatischem modernem Deutsch als zeitlicher Nebensatz wiedergegeben.
- source_word: ἀνέστη … ἐπʼ
  choice: erhob sich … gegen
  rationale: Die formnahe Wendung bewahrt den feindseligen Angriffssinn des griechischen Ausdrucks.
- source_word: ἀπέκτεινεν
  choice: tötete
  rationale: Direkte und sachlich genaue Wiedergabe des Aorists.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »seinen Bruder Abel« bleibt entsprechend der griechischen Vorlage erhalten; die altertümliche Ereignisformel »und es geschah« wird zugunsten eines natürlichen zeitlichen Anschlusses vermieden.
