  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλος ὁ πατὴρ ἡμῶν Ἰακὼβ ἀπέδρα ἀπὸ προσώπου Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/008.yaml
  text: Because of jealousy our father Jacob fled from the face of Esau his brother.
translation:
  language: de
  text: Aus Eifersucht floh unser Vater Jakob vor seinem Bruder Esau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: Aus Eifersucht
  rationale: Die Wendung bezeichnet den Grund der Flucht. Obwohl nach διά mit Akkusativ formal ζῆλον zu erwarten wäre, ist der Sinn des überlieferten Textes klar; „Eifersucht“ gibt ζῆλος im Zusammenhang des Abschnitts natürlich wieder.
- source_word: ἀπέδρα ἀπὸ προσώπου
  choice: floh vor
  rationale: Wörtlich steht hier „floh vom Angesicht weg“. Das deutsche „vor jemandem fliehen“ vermittelt denselben Sinn natürlich und würdig.
- source_word: ὁ πατὴρ ἡμῶν Ἰακώβ
  choice: unser Vater Jakob
  rationale: Die familiär-identitätsstiftende Bezeichnung wird eng am griechischen Wortlaut bewahrt.
- source_word: Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ
  choice: seinem Bruder Esau
  rationale: Die im Griechischen nachgestellte Apposition wird für idiomatisches Deutsch vorangestellt, ohne den Aussagegehalt zu verändern.
theological_decisions:
- issue: Wessen Eifersucht die Flucht verursachte
  choice: Die Eifersucht bleibt ohne ausdrücklich genannten Träger.
  alternative: „Aus Esaus Eifersucht“ oder „Weil Esau eifersüchtig war“
  rationale: Der griechische Text nennt keinen Besitzer oder Träger der Eifersucht. Eine ausdrückliche Zuordnung zu Esau würde eine echte Unbestimmtheit des Wortlauts auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die semitisch geprägte Wendung „vom Angesicht ... weg“ wurde idiomatisch als „vor ... fliehen“ wiedergegeben.
