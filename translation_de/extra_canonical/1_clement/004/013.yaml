source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλος Δαυὶδ φθόνον ἔσχεν οὐ μόνον ὑπὸ τῶν ἀλλοφύλων, ἀλλὰ καὶ ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ ἐδιώχθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/013.yaml
  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: de
  text: Durch Eifersucht zog David sich nicht nur den Neid der Fremden zu,[a] sondern wurde auch von Saul, dem König Israels, verfolgt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David wurde nicht nur von den Fremden beneidet.“'
    reason: Die griechische Wendung φθόνον ἔχειν ὑπό kann idiomatisch sowohl als „sich den Neid von jemandem zuziehen“ als auch passivisch als „von jemandem beneidet werden“ wiedergegeben werden.
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: Wegen Eifersucht
  rationale: Gibt die kausale Wendung knapp wieder und bewahrt die im Kontext zentrale Vorstellung der Eifersucht; die auffällige Kasusform ζῆλος wird nicht inhaltlich überinterpretiert.
- source_word: φθόνον ἔσχεν ... ὑπὸ
  choice: zog sich ... den Neid ... zu
  rationale: Gibt die idiomatische Bedeutung wieder, dass David zum Gegenstand des Neides wurde, und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „hatte“.
- source_word: τῶν ἀλλοφύλων
  choice: der Fremdvölker
  rationale: ἀλλόφυλοι bezeichnet Menschen anderer Volkszugehörigkeit; „Fremdvölker“ wahrt diese allgemeine Bedeutung, ohne die Bezeichnung unbelegt auf die Philister einzuengen.
- source_word: ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ ἐδιώχθη
  choice: wurde auch von Saul, dem König Israels, verfolgt
  rationale: Entspricht dem griechischen Passiv und gibt βασιλέως Ἰσραήλ als Apposition klar und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Eifersucht, Neid und Verfolgung
  choice: Die beiden unterschiedlichen griechischen Begriffe werden als „Eifersucht“ und „Neid“ unterschieden; der Übergang zur Verfolgung bleibt bestehen.
  alternative: Beide Begriffe einheitlich mit „Neid“ wiedergeben.
  rationale: Die Unterscheidung bewahrt die lexikalische Spannung zwischen ζῆλος und φθόνος, ohne einen theologischen Kausalzusammenhang näher festzulegen, als der Text es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fremdvölker“ ist verständlich und historisch passend; die Satzstruktur bewahrt die Parallelität von Neid und Verfolgung.
