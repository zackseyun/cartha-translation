source:
  edition: Funk 1901 (normalized OCR)
  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: de
  text: 'Denn so steht geschrieben: »Und es geschah nach einigen Tagen: Kain brachte von den Früchten der Erde Gott eine Opfergabe dar; und auch Abel brachte von den Erstgeborenen seiner Schafe und von ihren Fettanteilen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γέγραπται γὰρ οὕτως
  choice: Denn so steht geschrieben
  rationale: Gibt die einleitende Schriftformel natürlich und zugleich eng am griechischen Perfekt Passiv wieder.
- source_word: μεθ' ἡμέρας
  choice: nach einigen Tagen
  rationale: Im Kontext idiomatische Wiedergabe der unbestimmten Zeitangabe; vermeidet das im Deutschen unnatürliche »nach Tagen«.
- source_word: θυσίαν
  choice: eine Opfergabe
  rationale: Bezeichnet hier das dargebrachte Opfer und passt sowohl zu den Feldfrüchten Kains als auch zu Abels Gabe.
- source_word: τῶν πρωτοτόκων τῶν προβάτων
  choice: den Erstgeborenen seiner Schafe
  rationale: Bewahrt den substantivischen Sinn von πρωτότοκα; πρόβατα kann Kleinvieh bezeichnen, wird hier traditions- und kontextgerecht mit »Schafe« wiedergegeben.
- source_word: τῶν στεάτων αὐτῶν
  choice: ihren Fettstücken
  rationale: Gibt die zum Opfer bestimmten fetten Anteile konkret wieder, ohne den Ausdruck abstrakt zu »Fett« zu verflachen.
theological_decisions:
- issue: Charakter der Gaben Kains und Abels
  choice: Beide Handlungen werden mit »brachte ... dar« beschrieben, ohne eine Wertung einzufügen.
  alternative: Abels Gabe sprachlich als höherwertiges Opfer kennzeichnen.
  rationale: Der griechische Text nennt an dieser Stelle nur Herkunft und Bestandteile der Gaben; eine ausdrückliche theologische Bewertung folgt hier nicht.
translation_notes:
  register: Moderne, würdige Standardsprache. Die leicht feierliche Schriftformel und die direkte Rede bleiben erhalten; der Satzbau wurde behutsam gegliedert, ohne die Parallelität zwischen Kain und Abel aufzugeben.
