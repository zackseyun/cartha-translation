source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρᾶτε, ἀδελφοί, ζῆλος καὶ φθόνος ἀδελφοκτονίαν κατειργάσατο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/007.yaml
  text: See[a], brothers, jealousy and envy brought about fratricide.
translation:
  language: de
  text: Seht, Brüder, Eifersucht und Neid haben Brudermord bewirkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Seht
  rationale: Der Imperativ Plural wird direkt und prägnant wiedergegeben; im Zusammenhang fordert er die Angesprochenen auf, das folgende Beispiel wahrzunehmen beziehungsweise zu bedenken.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Die inklusive moderne Anrede gibt den griechischen Plural im gemeindlichen Kontext natürlich wieder, ohne die Verbindung zum folgenden Kompositum künstlich nachzuahmen.
- source_word: ζῆλος καὶ φθόνος
  choice: Eifersucht und Neid
  rationale: Die zwei nah verwandten, aber unterscheidbaren Begriffe bleiben als Begriffspaar erhalten. ζῆλος bezeichnet hier aufgrund der negativen Folge eine missgünstige Eifersucht beziehungsweise Rivalität.
- source_word: ἀδελφοκτονίαν
  choice: Brudermord
  rationale: Das natürliche deutsche Kompositum entspricht dem griechischen ἀδελφοκτονία und bezeichnet die Tötung eines Bruders beziehungsweise eines nahen Angehörigen.
- source_word: κατειργάσατο
  choice: haben ... geführt
  rationale: Die idiomatische Verbindung „zum ... geführt“ gibt das Hervorbringen beziehungsweise Bewirken der Folge natürlich wieder. Das griechische Singularverb fasst die beiden eng verbundenen Ursachen als Einheit auf; im Deutschen verlangt das zusammengesetzte Subjekt gewöhnlich den Plural.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der Anrede macht die auffordernde Einleitung klar. „Geschwister“ ist als heutige gemeindliche Anrede gewählt, während „Brudermord“ den etablierten und präzisen deutschen Ausdruck für ἀδελφοκτονία bewahrt.
