review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft Aufforderung, das Begriffspaar ζῆλος καὶ φθόνος und die verursachte Tötung im Wesentlichen. „Geschwister“ gibt ἀδελφοί jedoch nicht präzise wieder und verdeckt zudem die bewusst wiederholte Wortfamilie ἀδελφοί / ἀδελφοκτονία.
  naturalness: „Seht, Brüder, Eifersucht und Neid haben Brudermord bewirkt“ ist idiomatisches, würdiges modernes Standarddeutsch. Die knappe paränetische Anrede und der nachfolgende Aussagesatz bleiben klar.
  terminology: „Brüder“ entspricht der im griechischen Gemeindekontext üblichen Anrede ἀδελφοί, ohne eine über den Wortlaut hinausgehende inklusive Umformulierung vorzunehmen. „Brudermord“ ist das etablierte deutsche Äquivalent für ἀδελφοκτονία und bewahrt die rhetorische Wiederholung.
  issues:
  - severity: medium
    issue: „Geschwister“ statt „Brüder“
    rationale: ἀδελφοί steht hier als maskuline Pluralanrede. Eine inklusive Wiedergabe kann in manchen deutschen Bibelübersetzungen vertretbar sein, ist aber keine optimal-äquivalente Entsprechung und beseitigt die im Griechischen auffällige Verbindung von ἀδελφοί mit ἀδελφοκτονία.
  - severity: low
    issue: Rhetorische Wortverbindung abgeschwächt
    rationale: Die Kombination „Geschwister“ / „Brudermord“ gibt die Wiederholung des Stamms ἀδελφ- nicht wieder. „Brüder“ / „Brudermord“ wahrt sie natürlich.
