  language: de
  text: Sei ruhig! Dir gilt seine Hinwendung, und du wirst über ihn herrschen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασον
  choice: Sei ruhig!
  rationale: Der Aoristimperativ fordert dazu auf, Ruhe zu bewahren beziehungsweise stillzuhalten; die knappe deutsche Wendung erhält den gebietenden Ton.
- source_word: πρὸς δὲ ἡ ἀποστροφὴ αὐτοῦ
  choice: Dir gilt seine Hinwendung
  rationale: Der überlieferte griechische Text ist syntaktisch verkürzt und lehnt sich an Gen 4,7 an. „Hinwendung“ bewahrt die relationale, zugleich nicht völlig eindeutige Bedeutung von ἀποστροφή, ohne sie als Verlangen oder Unterordnung festzulegen.
- source_word: καὶ σὺ ἄρξεις αὐτοῦ
  choice: und du wirst über ihn herrschen
  rationale: ἄρχω mit Genitiv bezeichnet Herrschaft über jemanden; das maskuline Pronomen wird entsprechend mit „ihn“ wiedergegeben.
theological_decisions:
- issue: Bezug von αὐτοῦ und Verhältnis zu Gen 4,7
  choice: Das maskuline Pronomen bleibt als „ihn“ erhalten, ohne den Bezug ausdrücklich zu identifizieren.
  alternative: Den Bezug als Sünde, Bruder oder dessen Hinwendung ausdrücklich auslegen.
  rationale: Der isolierte Satz und seine Textgestalt lassen den Bezug nicht zweifelsfrei erkennen. Eine explizite Identifizierung würde die im griechischen Wortlaut vorhandene Spannung auflösen.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die leicht ungewöhnliche Formulierung „Dir gilt seine Hinwendung“ spiegelt bewusst die Verdichtung und Mehrdeutigkeit des griechischen Textes.
