lexical_decisions:
- source_word: Τοιούτοις … ὑποδείγμασιν
  choice: an solche Vorbilder
  rationale: „Vorbilder“ gibt den beispielhaften Charakter der zuvor genannten Personen natürlich und würdig wieder.
- source_word: κολληθῆναι
  choice: uns … halten
  rationale: Das Verb bezeichnet ein enges Sich-Anschließen oder Festhalten. „Sich an Vorbilder halten“ bewahrt diesen Sinn in natürlichem modernem Deutsch.
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Die Anrede richtet sich an die gesamte Gemeinde; „Geschwister“ gibt die inklusive gemeinschaftliche Bedeutung des griechischen Plurals im heutigen Deutsch klar wieder.
