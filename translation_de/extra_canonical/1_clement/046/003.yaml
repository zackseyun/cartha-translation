  yaml_path: translation/extra_canonical/1_clement/046/003.yaml
  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: de
  text: 'Und wiederum heißt es an einer anderen Stelle: »Mit einem unschuldigen Mann wirst du unschuldig sein, und mit einem Erwählten wirst du erwählt sein, und mit einem Verdrehten wirst du verdreht handeln.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb ist aktiv und nennt kein Objekt; wörtlich: »wirst du verdrehen«. Die Wendung kann auch im Sinn von »wirst du dich verdrehen« verstanden werden.'
    reason: Die aktive, objektlose Form διαστρέψεις ist im Deutschen nicht ohne Weiteres entsprechend nachzubilden. Die Anmerkung dokumentiert die syntaktische Mehrdeutigkeit, ohne eine Deutung als alleinige Möglichkeit auszugeben.
lexical_decisions:
- source_word: ἀθῴου / ἀθῷος
  choice: unschuldigen / unschuldig
  rationale: Gibt die ethische Bedeutung von ἀθῷος im sprichwortartigen Parallelismus direkt und in allgemein verständlichem Deutsch wieder.
- source_word: ἐκλεκτοῦ / ἐκλεκτός
  choice: Erwählten / erwählt
  rationale: Bewahrt die Wiederholung desselben Wortstamms und den generischen, substantivischen Gebrauch ohne bestimmten Artikel.
- source_word: στρεβλοῦ / διαστρέψεις
  choice: Verdrehten / wirst du dich verdrehen
  rationale: Erhält das griechische Wortspiel zwischen dem verdrehten Menschen und der entsprechenden Reaktion; die reflexive Form macht die knappe griechische Wendung im Deutschen verständlich.
- source_word: λέγει
  choice: heißt es
  rationale: Das nicht ausdrücklich genannte Subjekt bleibt wie im Griechischen unbestimmt; die deutsche Wendung ist für die Einführung eines Schriftzitats natürlich.
theological_decisions:
- issue: Möglicher titularer Klang von ἐκλεκτός
  choice: ein Erwählter
  alternative: der Erwählte
  rationale: Das anarthrische Adjektiv steht parallel zu »einem unschuldigen Mann« und bezeichnet daher am ehesten allgemein einen erwählten Menschen, nicht eine bestimmte messianische Gestalt.
- issue: Bedeutung von διαστρέψεις im letzten Parallelglied
  choice: wirst du dich verdrehen
  alternative: wirst du verdreht handeln / wirst du [ihn] verdrehen
  rationale: Die Form ist grammatisch aktiv und kann unterschiedlich aufgefasst werden. Im Zusammenhang des Parallelismus liegt eine Aussage über das Verhalten des Angesprochenen nahe; die Fußnote hält die sprachliche Schwierigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dreifache Parallelismus und die jeweiligen Wortwiederholungen des griechischen Zitats bleiben erhalten; ungewöhnliche Formulierungen werden nicht vorschnell geglättet.
