  text: κολληθῶμεν οὖν τοῖς ἀθῴοις καὶ δικαίοις· εἰσὶν δὲ οὗτοι ἐκλεκτοὶ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
translation:
  language: de
  text: Halten wir uns also an die Schuldlosen und Gerechten; denn sie sind Gottes Erwählte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: Halten wir uns … an
  rationale: Der griechische Aorist Konjunktiv im auffordernden Sinn bezeichnet ein enges Anschließen. Die deutsche Wendung ist natürlich und bewahrt den Gedanken verbindlicher Zugehörigkeit.
- source_word: ἀθῴοις
  choice: die Schuldlosen
  rationale: ἀθῷος bezeichnet Menschen, die frei von Schuld beziehungsweise unschuldig sind. „Schuldlose“ ist hier würdig und in der substantivierten Personenbezeichnung klar.
- source_word: δικαίοις
  choice: Gerechten
  rationale: Die traditionelle und sachlich passende Wiedergabe von δίκαιος bleibt erhalten, ohne die ethische oder theologische Bedeutung einzuengen.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: Gottes Erwählte
  rationale: Die Genitivverbindung wird idiomatisch wiedergegeben und bezeichnet diejenigen, die Gott erwählt hat.
theological_decisions:
- issue: Beziehung zwischen den Schuldlosen und Gerechten und den Erwählten Gottes
  choice: Die zweite Aussage wird mit „denn“ als Begründung beziehungsweise nähere Bestimmung angeschlossen.
  alternative: „und sie sind Gottes Erwählte“
  rationale: δέ kann locker anschließen oder leicht erklärend wirken. Im Kontext ist die Identifizierung der genannten Menschen als Gottes Erwählte wahrscheinlich; „denn“ gibt diesen Zusammenhang wieder, ohne eine weitergehende Lehrentscheidung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der auffordernde Charakter von κολληθῶμεν wird mit „Halten wir uns … an“ natürlich ausgedrückt; die knappe rhetorische Struktur des griechischen Satzes bleibt erhalten.
