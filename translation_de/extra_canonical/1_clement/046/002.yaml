  text: γέγραπται γάρ· Κολλᾶσθε τοῖς ἁγίοις, ὅτι οἱ κολλώμενοι αὐτοῖς ἁγιασθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: de
  text: 'Denn es steht geschrieben: »Haltet euch an die Heiligen; denn diejenigen, die sich an sie halten, werden geheiligt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολλᾶσθε / κολλώμενοι
  choice: Haltet euch an / die sich an sie halten
  rationale: Die Wendung gibt das enge Festhalten und die beständige Verbundenheit des griechischen κολλάω natürlich wieder und bewahrt zugleich die bewusste Wiederholung des Ausgangstextes.
- source_word: τοῖς ἁγίοις
  choice: die Heiligen
  rationale: Die substantivische Personenbezeichnung wird unmittelbar wiedergegeben, ohne näher festzulegen, welche Gruppe heiliger Menschen gemeint ist.
- source_word: ἁγιασθήσονται
  choice: werden geheiligt werden
  rationale: Die Formulierung bewahrt Futur und Passiv des griechischen Verbs und löst die theologische Aussage über das Geheiligtwerden nicht erklärend auf.
theological_decisions:
- issue: Identität der »Heiligen«
  choice: Die Bezeichnung bleibt allgemein als »die Heiligen« stehen.
  alternative: »die heiligen Menschen« oder eine nähere Bestimmung der gemeinten Gruppe
  rationale: Der griechische Text bestimmt die Gruppe nicht näher; eine Konkretisierung würde eine nicht ausdrücklich gegebene Auslegung eintragen.
- issue: Art und Urheber der Heiligung
  choice: Das Passiv »werden geheiligt werden« bleibt erhalten.
  alternative: Aktive oder erklärende Formulierungen wie »Gott wird sie heiligen«
  rationale: Das griechische Passiv lässt den Handelnden unausgesprochen und bewahrt so die Aussage in ihrer ursprünglichen theologischen Spannung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Formulierung »sich an ... halten« spiegelt die Wiederholung des griechischen Verbs, ohne steif oder altertümlich zu wirken.
