review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt γέγραπται mit „es steht geschrieben“ treffend wieder. „Haltet euch an“ beziehungsweise „sich an sie halten“ bewahrt die Wiederholung von κολλᾶσθε/κολλώμενοι und gibt die enge Bindung bzw. Zugehörigkeit idiomatisch wieder. „die Heiligen“ entspricht τοῖς ἁγίοις, und „werden geheiligt werden“ erhält sowohl Futur als auch Passiv von ἁγιασθήσονται.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die Wiederholung ist im Deutschen nicht störend, sondern bildet die rhetorische Wiederholung des Griechischen angemessen ab. Der doppelte Infinitiv in „werden geheiligt werden“ ist zwar formal, aber korrekt und für die ausdrückliche Bewahrung des futurischen Passivs vertretbar.
  terminology: „Heilige“ ist als etablierte substantivische Wiedergabe von ἅγιοι passend und legt weder eine bestimmte historische Gruppe noch ein konfessionelles Heiligenverständnis fest. Das ungenannte Subjekt des Passivs bleibt wie im griechischen Text offen.
