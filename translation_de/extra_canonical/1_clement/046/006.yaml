id: 1CLEM.46.6
reference: 1 Clement 46:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: de
  text: Oder haben wir nicht einen Gott und einen Messias und einen Geist der Gnade, der über uns ausgegossen wurde, und eine Berufung im Messias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht „eine Berufung“ im Nominativ, während „einen Gott“, „einen Messias“ und „einen Geist“ Akkusativobjekte zu „haben wir“ sind. Daher auch möglich: „und gibt es nicht eine Berufung im Messias?“'
    reason: Bewahrt den auffälligen syntaktischen Wechsel und die daraus entstehende Übersetzungsalternative.
lexical_decisions:
- source_word: Χριστόν / Χριστῷ
  choice: Messias / im Messias
  rationale: Gibt den Titel Χριστός als messianische Bezeichnung wieder und wahrt seine zweimalige Wiederholung.
- source_word: πνεῦμα τῆς χάριτος
  choice: Geist der Gnade
  rationale: Bewahrt die knappe Genitivverbindung des Griechischen, ohne ihre mögliche Bedeutungsbeziehung näher festzulegen.
- source_word: κλῆσις
  choice: Berufung
  rationale: Entspricht dem frühchristlichen Sinn einer göttlichen Berufung und bleibt im Deutschen verständlich.
- source_word: ἐκχυθέν ἐφ’ ἡμᾶς
  choice: der über uns ausgegossen wurde
  rationale: Gibt Bild, Passivform und Richtung der griechischen Wendung eng und natürlich wieder.
theological_decisions:
- issue: Einheit von Gott, Messias, Geist und Berufung
  choice: Die vierfache Wiederholung von εἷς/μία wird jeweils mit „ein/eine“ sichtbar gemacht.
  alternative: Die Reihe stilistisch glätten oder „einzig“ ergänzen.
  rationale: Die rhetorische Betonung der Einheit soll erhalten bleiben; „einzig“ wäre stärker als der griechische Wortlaut.
- issue: Syntaktischer Status der abschließenden Berufung
  choice: Die Wendung bleibt als Fortsetzung der rhetorischen Reihe stehen; eine Fußnote weist auf den Kasuswechsel hin.
  alternative: „Und gibt es nicht eine Berufung im Messias?“
  rationale: Im Griechischen wechselt μία κλῆσις vom Akkusativ der vorherigen Objekte in den Nominativ. Eine neue finite Aussage ist möglich, aber nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener rhetorischer Wiederholung. „Messias“ folgt dem titelbezogenen Gebrauch von Χριστός; die ungewöhnliche Schlusskonstruktion wird nicht stillschweigend vereindeutigt.
