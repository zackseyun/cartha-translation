source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σχίσμα ὑμῶν πολλοὺς διέστρεψεν, πολλοὺς εἰς ἀθυμίαν ἔβαλεν, πολλοὺς εἰς δισταγμόν, τοὺς πάντας ἡμᾶς εἰς λύπην· καὶ ἐπίμονος ὑμῶν ἐστὶν ἡ στάσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: de
  text: Eure Spaltung hat viele in die Irre geführt, viele entmutigt, viele ins Schwanken gebracht und uns alle in Trauer versetzt; und euer Parteienstreit dauert beharrlich an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: Spaltung
  rationale: Bezeichnet hier den gemeinschaftszerstörenden Bruch; „Spaltung“ ist im Deutschen natürlich und wahrt den deutlichen Vorwurf.
- source_word: διέστρεψεν
  choice: vom rechten Weg abgebracht
  rationale: Das Verb kann „verdrehen“, „abwenden“ oder „vom Weg abbringen“ bedeuten. Die idiomatische Wendung gibt die Wirkung auf Menschen wieder, ohne das Ziel näher festzulegen.
- source_word: ἀθυμία
  choice: Mutlosigkeit
  rationale: Gibt Niedergeschlagenheit beziehungsweise den Verlust von Mut und Zuversicht prägnant wieder.
- source_word: δισταγμός
  choice: Zweifel
  rationale: Bezeichnet Schwanken oder Ungewissheit; „Zweifel“ ist im Zusammenhang klar und allgemein verständlich.
- source_word: στάσις
  choice: Aufruhr
  rationale: Das Wort bezeichnet parteilichen Streit, Zwietracht oder Auflehnung. „Aufruhr“ bewahrt die Schärfe des Vorwurfs und vermeidet eine bloße Wiederholung von „Spaltung“.
- source_word: ἐπίμονος
  choice: hält hartnäckig an
  rationale: Drückt nicht nur Fortdauer, sondern Beharrlichkeit beziehungsweise Verstocktheit aus; die deutsche Formulierung bewahrt beides.
theological_decisions:
- issue: Moralische Bestimmung von διέστρεψεν
  choice: vom rechten Weg abgebracht
  alternative: irregeführt
  rationale: Der Text nennt nicht ausdrücklich eine falsche Lehre als Ursache. Die gewählte Fassung wahrt die moralisch-geistliche Orientierung, ohne den Vorwurf auf Lehrirrtum einzuengen.
- issue: Verhältnis von σχίσμα und στάσις
  choice: Spaltung … Aufruhr
  alternative: Spaltung … Parteienstreit
  rationale: 'Die zwei griechischen Begriffe werden unterschieden wiedergegeben: zuerst der entstandene Bruch, dann der fortdauernde konfliktgeladene Zustand. Eine konfessionelle Deutung wird vermieden.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Dreierfolge „viele … viele … viele“ und der Höhepunkt „uns alle“ bleiben erhalten; das Semikolon bildet den griechischen Gedankenverlauf ab.
