id: 1CLEM.46.7
reference: 1 Clement 46:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: de
  text: 'Warum zerren wir die Glieder des Messias auseinander und zerreißen sie[a], lehnen uns gegen unseren eigenen Leib auf und geraten in einen solchen Wahnsinn, dass wir vergessen, dass wir Glieder voneinander sind?


    Erinnert euch an die Worte Jesu, unseres Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ziehen wir … auseinander und reißen sie in Stücke“.'
    reason: Die beiden griechischen Verben können mit unterschiedlicher Stärke als Auseinanderziehen und gewaltsames Zerreißen wiedergegeben werden.
lexical_decisions:
- source_word: διέλκωμεν καὶ διασπῶμεν
  choice: zerren wir … auseinander und zerreißen sie
  rationale: Die beiden Verben bezeichnen ein gewaltsames Auseinanderziehen und Zerreißen. Die Formulierung wahrt ihre Steigerung und die körperliche Bildsprache.
- source_word: τὰ μέλη τοῦ Χριστοῦ
  choice: die Glieder des Messias
  rationale: „Glieder“ erhält die Verbindung zum anschließenden Bild des Leibes und zu „Glieder voneinander“. Χριστός wird als Titel mit „Messias“ wiedergegeben.
- source_word: στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον
  choice: lehnen wir uns gegen unseren eigenen Leib auf
  rationale: στασιάζω bezeichnet Aufruhr oder rebellisches Partei-Ergreifen; „sich auflehnen“ gibt dies in natürlichem Deutsch wieder. „Leib“ erhält die organische Metapher.
- source_word: εἰς τοσαύτην ἀπόνοιαν
  choice: in einen solchen Wahnsinn
  rationale: ἀπόνοια bezeichnet hier einen äußersten Verlust vernünftiger Besinnung; „Wahnsinn“ bewahrt die Schärfe der rhetorischen Anklage.
- source_word: μέλη ἐσμὲν ἀλλήλων
  choice: wir Glieder voneinander sind
  rationale: Die bewusst knappe gegenseitige Zugehörigkeitsformel des Griechischen wird erhalten und nicht als bloße Mitgliedschaft in einer Gruppe abgeschwächt.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Das griechische Wort ist hier ein Titel; „Messias“ macht dessen Bedeutung transparent, ohne die Aussage weiter auszulegen.
- issue: Bezug des Leibesbildes
  choice: Glieder des Messias / unser eigener Leib / Glieder voneinander
  alternative: Mitglieder der Gemeinde
  rationale: Die konkrete Leib-Metaphorik bleibt durchgehend erhalten; eine Auflösung in „Gemeindemitglieder“ würde die theologische Spannung des Bildes erklären statt übersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die eindringliche Aufforderung bleiben erhalten; „Leib“ und „Glieder“ sichern die zusammenhängende Körpermetaphorik.
