  terminology: „Auserwählten“, „zu Fall bringen“ und „irreführen“ sind angemessen und bewahren sowohl den würdigen Registerton als auch die Differenz der griechischen Verben. „Mühlstein“ ist bewusst allgemein genug, da μύλος hier nicht weiter spezifiziert wird.
