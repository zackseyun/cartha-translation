source:
  edition: Funk 1901 (normalized OCR)
  text: εἶπεν γάρ· Οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ· καλὸν ἦν αὐτῷ, εἰ οὐκ ἐγεννήθη, ἢ ἕνα τῶν ἐκλεκτῶν μου σκανδαλίσαι· κρεῖττον ἦν αὐτῷ περιτεθῆναι μύλον καὶ καταποντισθῆναι εἰς τὴν θάλασσαν, ἢ ἕνα τῶν ἐκλεκτῶν μου διαστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: de
  text: 'Denn er sagte: „Wehe jenem Menschen! Es wäre gut für ihn gewesen, wenn er nicht geboren worden wäre, statt einen meiner Auserwählten zu Fall zu bringen. Es wäre besser für ihn gewesen, wenn man ihm einen Mühlstein umhängte und ihn ins Meer versenkte, als wenn er einen meiner Auserwählten irreführte.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίσαι
  choice: zu Fall zu bringen
  rationale: Gibt das Bild eines Anstoßes wieder, der einen Menschen geistlich oder moralisch zu Fall bringt, ohne es auf bloße Verärgerung zu verengen.
- source_word: ἐκλεκτῶν
  choice: Auserwählten
  rationale: Entspricht dem substantivierten Adjektiv und bewahrt dessen theologische Aussage, ohne die Identität der Gruppe näher festzulegen.
- source_word: περιτεθῆναι μύλον
  choice: wenn ihm ein Mühlstein umgehängt würde
  rationale: Gibt die passive Konstruktion natürlich wieder. Der griechische Text nennt keinen Hals; daher wird dieses aus der bekannten Bildsprache erschließbare Detail nicht ergänzt.
- source_word: καταποντισθῆναι
  choice: im Meer versenkt würde
  rationale: Bewahrt den starken passiven Sinn des Untertauchens beziehungsweise Versenkens.
- source_word: διαστρέψαι
  choice: irrezuführen
  rationale: Drückt das Abbringen oder Verdrehen der Ausrichtung idiomatisch aus und unterscheidet sich zugleich von σκανδαλίσαι.
theological_decisions:
- issue: Bezeichnung der Betroffenen als „meine Auserwählten“
  choice: meiner Auserwählten
  alternative: meiner Erwählten
  rationale: „Auserwählte“ ist in modernem Deutsch verständlich und bildet ἐκλεκτῶν unmittelbar ab, ohne ihre Erwählung dogmatisch näher zu bestimmen.
- issue: Verhältnis der beiden Warnverben
  choice: σκανδαλίσαι als „zu Fall bringen“, διαστρέψαι als „irreführen“
  alternative: beide Verben mit „vom Weg abbringen“ wiedergeben
  rationale: Die unterschiedliche Wortwahl des griechischen Textes bleibt erkennbar, ohne einen ungesicherten präzisen theologischen Gegensatz zu behaupten.
translation_notes:
  register: Würdiges, modernes Standarddeutsch mit klarer Warn- und Gerichtssprache. Die ungewöhnliche Vergleichsfügung mit καλόν ... εἰ ... ἢ wird natürlich als „gut ... statt“ wiedergegeben; die stärkere zweite Aussage mit κρεῖττον bleibt als „besser“ erhalten.
