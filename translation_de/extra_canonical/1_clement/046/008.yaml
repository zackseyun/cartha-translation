  source_fidelity: 'Die inhaltliche Wiedergabe ist insgesamt quellennah: σκανδαλίσαι und διαστρέψαι werden sinnvoll unterschieden, ἐκλεκτῶν bleibt als „Auserwählten“ offen, und der Mühlstein wird ohne im Griechischen nicht genanntes Detail ergänzt. Die Bewegungsrichtung von εἰς τὴν θάλασσαν sollte jedoch mit „ins Meer“ statt „im Meer“ wiedergegeben werden.'
