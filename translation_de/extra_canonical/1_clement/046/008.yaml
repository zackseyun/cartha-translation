  to: 'Denn er sagte: „Wehe jenem Menschen! Es wäre gut für ihn gewesen, wenn er nicht geboren worden wäre, statt einen meiner Auserwählten zu Fall zu bringen. Es wäre besser für ihn gewesen, wenn man ihm einen Mühlstein umhängte und ihn ins Meer versenkte, als wenn er einen meiner Auserwählten irreführte.“'
