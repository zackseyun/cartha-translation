- source_word: σχίσματα
  choice: Spaltungen
  rationale: Gibt das konkrete Auseinanderbrechen einer Gemeinschaft angemessen wieder.
- source_word: πόλεμός τε
  choice: und sogar Krieg
  rationale: Bringt die steigernde Schlussstellung von „Krieg“ in der Aufzählung in natürlichem Deutsch zum Ausdruck.
