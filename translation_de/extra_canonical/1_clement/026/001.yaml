revisions:
- from: Halten wir es also für etwas Großes und Wunderbares, wenn der Schöpfer des Alls die Auferstehung derer herbeiführen wird, die ihm in Heiligkeit und im Vertrauen eines guten Glaubens gedient haben, wo er uns doch sogar durch einen Vogel die Größe seiner Verheißung zeigt?
  to: Halten wir es also für etwas Großes und Wunderbares, wenn der Schöpfer des Alls die Auferstehung derer herbeiführen wird, die ihm fromm und in der Zuversicht eines guten Glaubens gedient haben, da er uns doch sogar durch einen Vogel die Größe seiner Verheißung zeigt?
  rationale: Die Revision ersetzt die potenziell missverständliche Zustandsformulierung „in Heiligkeit“ durch das quellentreue und moderne „fromm“ und glättet die argumentative Konjunktion. Die bewusst etwas markierte Wendung „in der Zuversicht eines guten Glaubens“ bleibt erhalten, damit die nominale Struktur und die nicht abschließend entscheidbare Nuance von πίστις nicht einseitig auf „Treue“ oder eine dogmatisch geprägte Glaubensformel festgelegt werden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:01Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur, die aktive Verursachung der Auferstehung, die unbestimmte Nennung eines Vogels und die rhetorische Frage geben den griechischen Text zuverlässig wieder. ὁσίως bezeichnet jedoch primär die fromme/gottesfürchtige Weise des Dienstes; „in Heiligkeit“ ist dafür im modernen Deutsch weniger präzise.
  naturalness: Die Fassung ist insgesamt verständlich und angemessen würdig. „Wo er uns doch“ ist als begründendes ὅπου zwar möglich, aber „da er uns doch“ ist in dieser rhetorischen Begründung idiomatischer. Die Zusammenstellung „fromm und in der Zuversicht eines guten Glaubens“ bindet beide Modalbestimmungen klar an das Dienen.
  terminology: „Schöpfer des Alls“, „Auferstehung“, „Verheißung“ und „Glaube“ sind sachgerecht. „Glaube“ für πίστις lässt die mögliche Nuance von Treue offen, ohne eine theologische Deutung festzulegen.
  issues:
  - severity: medium
    issue: ὁσίως mit „in Heiligkeit“ wiedergegeben
    rationale: Das Adverb bedeutet hier „fromm“, „gottesfürchtig“ oder „in heiliger Weise“. „In Heiligkeit“ kann im Deutschen eher einen Zustand persönlicher Heiligkeit als die Haltung des gottergebenen Dienstes bezeichnen.
  - severity: low
    issue: Begründendes ὅπου als „wo“ wiedergegeben
    rationale: „Wo“ ist nicht falsch, wirkt in diesem Zusammenhang aber weniger natürlich als das kausal-erläuternde „da“, das die argumentative Funktion der Aussage besser erkennen lässt.
  revised_text: Halten wir es also für etwas Großes und Wunderbares, wenn der Schöpfer des Alls die Auferstehung derer herbeiführen wird, die ihm fromm und in der Zuversicht eines guten Glaubens gedient haben, da er uns doch sogar durch einen Vogel die Größe seiner Verheißung zeigt?
