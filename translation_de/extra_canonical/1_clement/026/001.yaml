id: 1CLEM.26.1
reference: 1 Clement 26:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: de
  text: Halten wir es also für etwas Großes und Wunderbares, wenn der Schöpfer des Alls die Auferstehung derer herbeiführen wird, die ihm fromm und in der Zuversicht eines guten Glaubens gedient haben, da er uns doch sogar durch einen Vogel die Größe seiner Verheißung zeigt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δημιουργὸς τῶν ἁπάντων
  choice: der Schöpfer des Alls
  rationale: Gibt die umfassende Bedeutung knapp und würdevoll wieder; δημιουργός bezeichnet hier Gott als Urheber und Schöpfer.
- source_word: ἀνάστασιν ποιήσεται
  choice: die Auferstehung … herbeiführen wird
  rationale: Bewahrt die aktive Kausativwendung des Griechischen natürlicher als das wörtliche „eine Auferstehung machen“.
- source_word: τῶν ὁσίως αὐτῷ δουλευσάντων
  choice: derer …, die ihm in Heiligkeit … gedient haben
  rationale: ὁσίως bezeichnet eine heilige beziehungsweise fromme Weise des Dienens; „in Heiligkeit“ bleibt eng am Wortlaut und vermeidet eine konfessionelle Einengung.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: im Vertrauen eines guten Glaubens
  rationale: 'Die Genitivbeziehung bleibt bewusst erhalten: πεποίθησις ist Vertrauen oder Zuversicht, πίστις kann Glaube oder Treue bedeuten. Die Formulierung glättet diese Spannung nicht vollständig.'
- source_word: δι᾿ ὀρνέου
  choice: durch einen Vogel
  rationale: Die unbestimmte Bezeichnung des griechischen Textes wird bewahrt; der folgende Kontext identifiziert das Beispiel näher.
- source_word: τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ
  choice: die Größe seiner Verheißung
  rationale: Natürliche deutsche Wiedergabe der Größe beziehungsweise Erhabenheit dessen, was Gott verheißen hat.
theological_decisions:
- issue: Art und Urheber der Auferstehung
  choice: „der Schöpfer des Alls die Auferstehung … herbeiführen wird“
  alternative: „der Schöpfer des Alls die Toten auferwecken wird“
  rationale: Die gewählte Fassung hält sich an das Abstraktum ἀνάστασις und macht zugleich Gottes aktives Handeln deutlich, ohne den Text in eine geläufigere dogmatische Formel umzuschreiben.
- issue: Bedeutung von πίστις in der Wendung πίστεως ἀγαθῆς
  choice: „guten Glaubens“
  alternative: „guter Treue“ oder „fester Glaubenszuversicht“
  rationale: πίστις kann Glaube, Vertrauen oder Treue bezeichnen. „Glaube“ wahrt die traditionelle und hier naheliegende Bedeutung, während die ungewöhnliche Genitivkonstruktion die echte Mehrdeutigkeit erkennen lässt.
translation_notes:
  register: Moderne standarddeutsche, würdige Fragesatzstruktur. Das einleitende „also“ gibt οὖν wieder; „wo … doch“ bildet das argumentierende ὅπου idiomatisch ab. Keine Fußnoten erforderlich.
