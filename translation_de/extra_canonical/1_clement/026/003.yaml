  text: καὶ πάλιν Ἰὼβ λέγει· Καὶ ἀναστήσεις τὴν σάρκα μου ταύτην τὴν ἀναντλήσασαν ταῦτα πάντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/003.yaml
  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
translation:
  language: de
  text: 'Und wiederum sagt Hiob: »Und du wirst dieses mein Fleisch auferwecken, das all dies ertragen hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεις
  choice: du wirst … auferwecken
  rationale: Gibt das transitive Futur in seinem Auferstehungssinn wieder und bewahrt die ausdrückliche Anrede in der zweiten Person Singular.
- source_word: τὴν σάρκα μου ταύτην
  choice: dieses mein Fleisch
  rationale: Bewahrt die nachdrückliche Verbindung von Demonstrativ- und Possessivbezug; die leicht gehobene Wortstellung passt zum würdigen Zitatcharakter.
- source_word: ἀναντλήσασαν
  choice: ertragen hat
  rationale: Das Verb bedeutet wörtlich etwa »ausschöpfen« und bezeichnet hier bildlich das Durchstehen bzw. Ertragen der genannten Leiden; »ertragen« ist im Deutschen klar und quellenah.
theological_decisions:
- issue: Gegenstand der Auferweckung
  choice: dieses mein Fleisch auferwecken
  alternative: mich in meinem Fleisch auferwecken
  rationale: Der griechische Text nennt ausdrücklich das Fleisch als direktes Objekt. Die Übersetzung bewahrt diese körperliche Aussage, ohne sie erklärend umzuformen.
- issue: Nicht genanntes Subjekt von ἀναστήσεις
  choice: du wirst
  alternative: er wird
  rationale: Die griechische Verbform ist eindeutig zweite Person Singular. Eine Identifizierung des Angeredeten wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobener Syntax im Zitat. Der biblische Name Ἰώβ wird in der üblichen deutschen Form »Hiob« wiedergegeben.
