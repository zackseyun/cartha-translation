  text: λέγει γάρ που· Καὶ ἐξαναστήσεις με, καὶ ἐξομολογήσομαί σοι· καί· Ἐκοιμήθην καὶ ὕπνωσα, ἐξηγέρθην, ὅτι σὺ μετ᾿ ἐμοῦ εἶ.
