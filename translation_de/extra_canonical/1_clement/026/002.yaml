  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: de
  text: 'Denn irgendwo heißt es: „Du wirst mich auferwecken, und ich werde dir danken“; und: „Ich legte mich nieder und schlief; ich erwachte, denn du bist bei mir.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: auferwecken
  rationale: Das Verb bezeichnet ein Aufrichten beziehungsweise Aufwecken und trägt im Zusammenhang die mögliche Anspielung auf Auferstehung; „auferwecken“ bewahrt diese Spannung.
- source_word: ἐξομολογήσομαί
  choice: preisen
  rationale: Im Gebets- und Psalmkontext bedeutet das Verb, Gott öffentlich dankend zu bekennen oder zu loben. „preisen“ ist natürlich und umfasst hier Dank und Lob.
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: Ich legte mich nieder und schlief
  rationale: Die beiden griechischen Verben werden getrennt wiedergegeben; die idiomatische deutsche Form bewahrt die Abfolge von Niederlegen und Schlafen.
- source_word: ἐξηγέρθην
  choice: ich erwachte
  rationale: Im unmittelbaren Schlafbild ist „erwachte“ die natürliche Bedeutung, ohne die übertragbare Auferstehungssprache völlig auszuschließen.
- source_word: μετ᾿ ἐμοῦ
  choice: bei mir
  rationale: Die Wendung bezeichnet begleitende Gegenwart; „bei mir“ ist im Deutschen idiomatisch und präzise.
theological_decisions:
- issue: Auferstehungsbezug der angeführten Schriftworte
  choice: Die mögliche Auferstehungsbedeutung wird durch „auferwecken“ erhalten, während „erwachte“ das konkrete Schlafbild wahrt.
  alternative: Beide Verben durchgehend mit ausdrücklich auferstehungssprachlichen Begriffen wiederzugeben.
  rationale: Der griechische Wortlaut verbindet Aufstehen, Schlaf und Erwachen, ohne an jeder Stelle ausschließlich die leibliche Auferstehung zu bezeichnen; die Übersetzung bewahrt diese Spannung.
- issue: Unausgesprochenes Subjekt in λέγει
  choice: Unpersönlich mit „heißt es“ wiedergegeben.
  alternative: „Er sagt“ mit Gott oder der Schrift als ausdrücklich bestimmtem Subjekt.
  rationale: Das griechische Subjekt bleibt implizit. „Heißt es“ vermeidet eine unbelegte Festlegung und entspricht einer deutschen Zitationsformel.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die Zitate bleiben knapp und rhythmisch; die einleitende Formel gibt die unbestimmte Fundstellenangabe des griechischen Textes wieder.
