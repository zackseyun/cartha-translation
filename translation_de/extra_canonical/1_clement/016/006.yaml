lexical_decisions:
- source_word: πάντες
  choice: wir alle
  rationale: Gibt das umfassende Subjekt in natürlichem modernem Deutsch wieder.
- source_word: ὡς πρόβατα
  choice: wie Schafe
  rationale: Bewahrt den direkten Vergleich und das biblische Bild.
- source_word: ἐπλανήθημεν / ἐπλανήθη
  choice: gingen / ging … in die Irre
  rationale: Gibt das Verirren beziehungsweise Abweichen idiomatisch wieder und wahrt den Wechsel vom Plural zum Singular.
- source_word: ἄνθρωπος
  choice: jeder Mensch
  rationale: Der artikellose Singular ist hier im Zusammenhang distributiv zu verstehen; die Wiedergabe vermeidet eine unnatürliche wörtliche Formulierung.
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: auf seinem eigenen Weg
  rationale: Das Possessivpronomen hebt den jeweils eigenen Weg hervor; „auf“ entspricht dem Dativ der Sphäre beziehungsweise Richtung im Kontext.
theological_decisions:
- issue: Wechsel vom kollektiven Plural zum distributiven Singular
  choice: „Wir alle …; jeder Mensch …“
  alternative: „Wir alle …; ein Mensch …“
  rationale: Die Übersetzung bewahrt die Spannung zwischen gemeinsamer Verirrung und individueller Abweichung, ohne den griechischen Singular unidiomatisch wiederzugeben.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die parallele Satzstruktur und das wiederholte „in die Irre“ spiegeln die griechische Formulierung.
