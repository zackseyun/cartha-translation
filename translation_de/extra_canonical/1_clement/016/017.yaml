revisions:
- from: Seht, geliebte Brüder und Schwestern,[a] welches Vorbild uns gegeben ist. Denn wenn der Herr sich so erniedrigt hat, was sollen dann wir tun, die wir durch ihn unter das Joch seiner Gnade gekommen sind?
  to: Seht, ihr geliebten Männer, welches Vorbild uns gegeben ist. Denn wenn der Herr sich so erniedrigt hat, was sollen dann wir tun, die wir durch ihn unter das Joch seiner Gnade gekommen sind?
  rationale: Die allein erforderliche Änderung entfernt die nicht im griechischen Text ausgedrückte Erweiterung „Brüder und Schwestern“ samt ihrer interpretierenden Fußnote. Der übrige Wortlaut ist quellentreu, idiomatisch und bewahrt die rhetorische und theologische Offenheit des Satzes.
