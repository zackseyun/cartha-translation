base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: de
  text: Seht, ihr geliebten Männer, welches Vorbild uns gegeben ist. Denn wenn der Herr sich so erniedrigt hat, was sollen dann wir tun, die wir durch ihn unter das Joch seiner Gnade gekommen sind?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht
  rationale: Der griechische Imperativ fordert die Angesprochenen auf, ihre Aufmerksamkeit auf das zuvor dargestellte Vorbild zu richten.
- source_word: ἄνδρες ἀγαπητοί
  choice: geliebte Brüder und Schwestern
  rationale: ἄνδρες kann eine gemischte Gruppe anreden; die inklusive Wiedergabe vermittelt die gemeinte Gemeindeansprache in natürlichem modernem Deutsch. Eine Fußnote hält die formnähere Alternative fest.
- source_word: ὑπογραμμός
  choice: Vorbild
  rationale: Das Wort bezeichnet ein vorgegebenes Muster oder Beispiel zur Nachahmung; „Vorbild“ ist hier idiomatisch und bewahrt den ethischen Sinn.
- source_word: ἐταπεινοφρόνησεν
  choice: sich erniedrigt hat
  rationale: Die Wiedergabe bringt die vom Verb bezeichnete demütige Selbsterniedrigung des Herrn zum Ausdruck und passt zum vorausgehenden Christusbeispiel.
- source_word: ζυγὸν τῆς χάριτος αὐτοῦ
  choice: Joch seiner Gnade
  rationale: Die auffällige Metapher und ihre Spannung zwischen Joch und Gnade werden unverändert bewahrt.
theological_decisions:
- issue: Das Verhältnis von menschlichem Handeln und Gnade
  choice: Die rhetorische Frage und die Metapher „unter das Joch seiner Gnade gekommen“ bleiben stehen.
  alternative: Die Aussage als Pflicht zum Gehorsam unter der Gnade erklärend auflösen.
  rationale: Der griechische Text verbindet Gnade, Bindung und Nachahmung, ohne ihr theologisches Verhältnis weiter zu systematisieren.
- issue: Vermittlung durch Christus in δι’ αὐτοῦ
  choice: „durch ihn“
  alternative: „um seinetwillen“ oder „durch seine Gnade“
  rationale: „Durch ihn“ wahrt den persönlichen Bezug und die instrumentale beziehungsweise vermittelnde Offenheit der griechischen Formulierung.
translation_notes:
  register: Würdig und zugleich allgemein verständlich. Der einleitende Imperativ bleibt deutlich; die ungewöhnliche, theologisch spannungsvolle Metapher „Joch seiner Gnade“ wird nicht geglättet.
