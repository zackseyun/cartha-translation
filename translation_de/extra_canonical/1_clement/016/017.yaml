review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Imperativ, Vorbild-Metapher, Selbsterniedrigung, Vermittlung „durch ihn“ und das Bild vom „Joch seiner Gnade“ treffend wieder. Die Ergänzung „Brüder und Schwestern“ ist jedoch im griechischen Wortlaut nicht enthalten; ἄνδρες bezeichnet ausdrücklich Männer und sollte nicht ohne zwingenden Kontext durch eine doppeltgeschlechtliche Anrede ersetzt werden.
  naturalness: Der Satzbau ist modernes, würdiges Deutsch. „Ihr geliebten Männer“ ist als direkte, quellennahe Anrede zwar markierter als „ihr Lieben“, aber klar und angesichts des ausdrücklich männlichen griechischen Ausdrucks angemessen.
  terminology: „Vorbild“ für ὑπογραμμός, „sich erniedrigt“ für ἐταπεινοφρόνησεν und „Joch seiner Gnade“ sind präzise und bewahren die Bildsprache. „Herr“ und „Gnade“ sind registergerecht.
  issues:
  - severity: medium
    issue: Interpretierende inklusive Anrede „geliebte Brüder und Schwestern“
    rationale: Der Ausgangstext hat ἄνδρες ἀγαπητοί („geliebte Männer“), nicht „Brüder und Schwestern“. Die beigefügte Behauptung, im Zusammenhang sei die ganze Gemeinde angesprochen, lässt sich aus diesem einzelnen Vers nicht hinreichend absichern. Die Übersetzung sollte die ausdrückliche Formulierung nicht erweitern.
  revised_text: Seht, ihr geliebten Männer, welches Vorbild uns gegeben ist. Denn wenn der Herr sich so erniedrigt hat, was sollen dann wir tun, die wir durch ihn unter das Joch seiner Gnade gekommen sind?
