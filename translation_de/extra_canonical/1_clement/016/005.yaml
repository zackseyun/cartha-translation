source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: de
  text: 'Doch er wurde wegen unserer Sünden verwundet

    und wegen unserer gesetzlosen Taten zerschlagen.

    Die Strafe, die uns Frieden brachte, lag auf ihm;

    durch seine Strieme wurden wir geheilt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: wurde … verwundet
  rationale: Gibt das Passiv und die konkrete Verletzungsaussage unmittelbar wieder.
- source_word: μεμαλάκισται
  choice: wurde … misshandelt
  rationale: Das Verb kann wörtlich ein Schwachmachen bezeichnen; im Leidenskontext drückt „misshandelt“ die zugefügte körperliche Erniedrigung natürlich aus, ohne die Aussage unnötig zu spezifizieren.
- source_word: ἀνομίας
  choice: gesetzlose Taten
  rationale: Bewahrt den Bezug auf Gesetzlosigkeit und formuliert zugleich idiomatisch, dass konkrete Verfehlungen gemeint sind.
- source_word: παιδεία
  choice: Strafe
  rationale: Im Kontext bezeichnet das Wort eine auferlegte Züchtigung beziehungsweise Strafmaßnahme, nicht bloß Unterweisung.
- source_word: εἰρήνης
  choice: Frieden
  rationale: Bewahrt den umfassenden, theologisch offenen Friedensbegriff des griechischen Textes.
- source_word: μώλωπι
  choice: Strieme
  rationale: Bezeichnet eine durch einen Schlag verursachte Verletzung oder Schwellung; „Strieme“ ist konkret und in diesem feierlichen Kontext verständlich.
- source_word: ἰάθημεν
  choice: wurden wir geheilt
  rationale: Entspricht dem passiven Aorist und lässt offen, ob Heilung körperlich, geistlich oder umfassend verstanden wird.
theological_decisions:
- issue: Beziehung zwischen Strafe und Frieden
  choice: „Die Strafe, die uns Frieden brachte“
  alternative: „Die Strafe unseres Friedens“
  rationale: Die knappe griechische Nominalfügung παιδεία εἰρήνης ἡμῶν ist mehrdeutig. Die gewählte Form macht den naheliegenden Ziel- oder Ergebnisbezug verständlich, ohne genauer festzulegen, worin der Frieden besteht.
- issue: Stellvertretender Bezug
  choice: Die wiederholten Bezüge „wegen unserer …“, „auf ihm“ und „wir“ bleiben ausdrücklich erhalten.
  alternative: Eine stärker dogmatisch ausgeführte Formulierung wie „an unserer Stelle“
  rationale: Der Text legt einen stellvertretenden Zusammenhang nahe, formuliert aber keine ausgearbeitete Sühnetheorie; daher wird nichts ergänzt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Zeilengliederung. Die Satzparallelismen und der Wechsel von „er/ihm“ zu „wir/uns“ bleiben erhalten; altertümliche Wendungen werden vermieden.
