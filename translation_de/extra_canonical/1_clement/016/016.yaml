source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: de
  text: 'Alle, die mich sahen, verspotteten mich;

    sie rissen den Mund auf,

    sie schüttelten den Kopf:

    »Er hat auf den Herrn gehofft; der soll ihn retten,

    der soll ihn befreien, denn er hat Gefallen an ihm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωροῦντές
  choice: die mich sahen
  rationale: Das präsentische Partizip steht bei einem aoristischen Hauptverb. Die Vergangenheitsform ergibt im Deutschen einen natürlichen und zeitlich stimmigen Satz, ohne den Sinn zu verändern.
- source_word: ἐξεμυκτήρισάν
  choice: verspotteten
  rationale: Gibt den starken Sinn des Verbs – höhnisch verspotten – klar und idiomatisch wieder.
- source_word: ἐλάλησαν ἐν χείλεσιν
  choice: sie redeten mit ihren Lippen
  rationale: Bewahrt die auffällige Ausdrucksweise des griechischen Textes, statt sie nach einer möglichen hebräischen Vorlage als Gebärde umzudeuten.
- source_word: ἐκίνησαν κεφαλήν
  choice: sie schüttelten den Kopf
  rationale: Der griechische Singular ist bei pluralischem Subjekt distributiv; die deutsche Wendung verwendet entsprechend den Singular „den Kopf“.
- source_word: ῥυσάσθω / σωσάτω
  choice: der soll ihn retten / der soll ihn befreien
  rationale: Die beiden Imperative werden als spöttische Aufforderungen wiedergegeben. Zwei unterschiedliche deutsche Verben erhalten die Variation des griechischen Wortlauts.
- source_word: θέλει αὐτόν
  choice: er hat Gefallen an ihm
  rationale: θέλω kann hier Zuneigung beziehungsweise Wohlgefallen ausdrücken. Die Formulierung passt zum Kontext, ohne eine weitergehende theologische Deutung einzutragen.
theological_decisions:
- issue: Bezug des Subjekts in ὅτι θέλει αὐτόν
  choice: „denn er hat Gefallen an ihm“ mit unveränderten Pronomen
  alternative: „denn der Herr hat Gefallen an ihm“
  rationale: Der griechische Text nennt das Subjekt nicht erneut. Die pronomenreiche Form bewahrt diese grammatische Offenheit und vermeidet eine erklärende Ergänzung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Zeilengliederung. Die direkte Rede trägt den spöttischen Ton der Aufforderungen. Das traditionelle „der Herr“ bleibt als natürliche Wiedergabe von κύριον erhalten.
