  source_fidelity: 'Die Grundstruktur und der Sinn des griechischen Textes sind zutreffend wiedergegeben: die Verspottung, das Kopfschütteln, die spöttischen Aufforderungen an den Herrn sowie die abschließende Begründung bleiben erhalten. »sie redeten mit ihren Lippen« ist jedoch keine natürliche deutsche Wiedergabe von ἐλάλησαν ἐν χείλεσιν und verfehlt in diesem psalmischen Spottkontext die gestische, höhnische Aussage der Wendung.'
  naturalness: Die Zeilengliederung und der würdevolle poetische Ton sind gut. »Sie rissen den Mund auf« ist im heutigen Standarddeutsch eine natürliche, in Bibelübersetzungen etablierte und kontextgerechte Wiedergabe; »sie redeten mit ihren Lippen« wirkt dagegen unidiomatisch und inhaltlich zu farblos.
  terminology: »der Herr« für κύριος, »verspotteten«, »auf den Herrn gehofft«, »retten« und »befreien« sind angemessen. »Gefallen an ihm hat« gibt θέλει αὐτόν im vorliegenden traditionsgeschichtlichen und poetischen Kontext idiomatisch wieder, ohne den nicht erneut genannten Bezugsträger ausdrücklich zu ergänzen.
