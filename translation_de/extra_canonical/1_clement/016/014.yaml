  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes präzise wieder: die Hervorhebung in αὐτός („er selbst“), das Sündentragen (ἁμαρτίας πολλῶν ἀνήνεγκε), den Grundzusammenhang von διά mit Akkusativ („wegen“) und das unbestimmte Passiv παρεδόθη („wurde dahingegeben“). Die im griechischen Passiv offene Frage nach dem Handelnden bleibt zu Recht offen.'
  naturalness: „Und er selbst trug die Sünden vieler und wurde wegen ihrer Sünden dahingegeben“ ist verständliches, würdiges modernes Standarddeutsch. „Dahingegeben“ ist leicht bibelsprachlich, aber in diesem zitathaften und theologisch gewichtigen Kontext idiomatisch und angemessen.
  terminology: „Sünden“, „trug“ und „dahingegeben“ bewahren die knappe, traditionsreiche und theologisch nicht weiter festgelegte Ausdrucksweise der Vorlage. Insbesondere wird weder eine bestimmte Deutung des Sündentragens noch ein Handelnder des Dahingebens hinzugefügt.
