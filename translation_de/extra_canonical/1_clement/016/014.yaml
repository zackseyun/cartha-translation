source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς ἁμαρτίας πολλῶν ἀνήνεγκε καὶ διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/014.yaml
  text: 'And he bore the sins of many,

    and was given over because of their sins.'
translation:
  language: de
  text: 'Und er selbst trug die Sünden vieler

    und wurde wegen ihrer Sünden dahingegeben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτός
  choice: Und er selbst
  rationale: Gibt sowohl die Verknüpfung durch καί als auch die Hervorhebung durch αὐτός wieder.
- source_word: ἁμαρτίας πολλῶν ἀνήνεγκε
  choice: trug die Sünden vieler
  rationale: Bewahrt die kultisch und stellvertretend deutbare Formulierung des Griechischen, ohne sie erklärend auszuweiten.
- source_word: παρεδόθη
  choice: wurde dahingegeben
  rationale: Das Passiv bleibt erhalten; „dahingegeben“ gibt die feierliche, theologisch offene Bedeutung natürlicher wieder als ein bloßes „ausgeliefert“.
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: wegen ihrer Sünden
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Anlass; „wegen“ erhält diese Beziehung knapp und eindeutig.
theological_decisions:
- issue: Ungenannter Handelnder beim Passiv παρεδόθη
  choice: 'Passiv ohne Ergänzung: „wurde dahingegeben“'
  alternative: „Gott gab ihn dahin“ oder „Menschen lieferten ihn aus“
  rationale: Der griechische Text nennt den Handelnden nicht. Die Übersetzung wahrt diese Offenheit und importiert keine Festlegung.
- issue: Bedeutung des Sündentragens
  choice: „trug die Sünden vieler“
  alternative: „nahm die Sünden vieler weg“ oder „trug die Strafe für die Sünden vieler“
  rationale: Die knappe Quellformulierung lässt die genaue soteriologische Ausdeutung offen; weder Wegnahme noch Straftragung wird ausdrücklich hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bibelsprachlichem „dahingegeben“. Der zweizeilige Satzbau folgt dem poetischen beziehungsweise zitathaften Charakter der Vorlage.
