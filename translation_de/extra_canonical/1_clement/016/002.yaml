source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: de
  text: 'Das Zepter der Majestät Gottes, der Herr Jesus, der Messias, kam weder mit prahlerischem Gepränge noch mit Hochmut, obwohl er dazu fähig war, sondern in demütiger Gesinnung, wie der Heilige Geist über ihn gesprochen hat. Denn es heißt:


    »Herr, wer hat unserer Kunde geglaubt?


    Und wem ist der Arm des Herrn offenbart worden?


    Wir verkündeten vor ihm[a]


    wie ein Kind,


    wie eine Wurzel in dürstendem Land.


    Er hat weder Gestalt noch Herrlichkeit;


    wir sahen ihn,


    und er hatte weder Gestalt noch Schönheit.


    Vielmehr war sein Aussehen verachtet


    und stand hinter dem Aussehen der Menschen zurück[b]:


    ein Mensch in Leiden[c] und Mühsal,


    der es verstand, Schwachheit zu tragen,


    weil sein Gesicht abgewandt ist[d].


    Er wurde verachtet und nicht geachtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und ohne ausdrücklich genanntes Objekt: »Wir verkündeten vor ihm.« Die ungewöhnliche Wendung stammt aus der hier zitierten griechischen Fassung von Jesaja 53,2.'
    reason: Die griechische Verbform hat kein ausdrückliches direktes Objekt; ein ergänztes »ihn« würde eine bestimmte Deutung erzwingen.
  - marker: b
    text: 'Auch möglich: »blieb gegenüber dem Aussehen der Menschen zurück« oder »war unansehnlicher als Menschen«.'
    reason: Die Vergleichsfügung ἐκλεῖπον παρά bezeichnet ein Zurückbleiben oder Unterlegensein, lässt sich im Deutschen aber nicht zugleich wörtlich und idiomatisch eindeutig wiedergeben.
  - marker: c
    text: Das griechische Wort kann auch »Wunde«, »Schlag« oder »Heimsuchung« bedeuten.
    reason: πληγή hat ein breites Bedeutungsspektrum; »Leiden« ist kontextgerecht, soll die konkreteren Möglichkeiten jedoch nicht verdecken.
  - marker: d
    text: 'Auch möglich: »weil er sein Gesicht abgewandt hat«. Der griechische Wortlaut lässt offen, wer das Abwenden bewirkt.'
    reason: ἀπέστραπται kann als intransitive beziehungsweise mediale oder als passive Form verstanden werden; ein Handelnder wird nicht genannt.
lexical_decisions:
- source_word: σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  choice: das Zepter der Majestät Gottes
  rationale: Bewahrt die auffällige Hoheitsmetapher und die Genitivfügung des griechischen Textes.
- source_word: ὁ κύριος Ἰησοῦς Χριστός
  choice: der Herr Jesus, der Messias
  rationale: Gibt Χριστός als Titel wieder und macht die Apposition im Deutschen eindeutig, ohne sie in einen bloßen Nachnamen zu verwandeln.
- source_word: ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  choice: mit prahlerischem Gepränge oder Hochmut
  rationale: κόμπος bezeichnet hier prahlerisches Auftreten beziehungsweise Gepränge; ἀλαζονεία und ὑπερηφανία benennen Anmaßung und Hochmut.
- source_word: ταπεινοφρονῶν
  choice: in demütiger Gesinnung
  rationale: Bringt nicht nur eine äußere Niedrigkeit, sondern die in ταπεινοφρονέω bezeichnete innere Haltung zum Ausdruck.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: unserer Kunde
  rationale: ἀκοή kann sowohl das Hören als auch das Gehörte, also Botschaft oder Kunde, bezeichnen; im Satz ist die übermittelte Kunde gemeint.
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: wir verkündeten vor ihm
  rationale: Bewahrt die ungewöhnliche Formulierung der griechischen Jesaja-Fassung und ergänzt insbesondere kein im Griechischen fehlendes direktes Objekt.
- source_word: γῇ διψώσῃ
  choice: dürstendem Land
  rationale: Erhält die Personifikation und Bildsprache wörtlicher als eine bloße Wiedergabe mit trockenem Boden.
- source_word: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων
  choice: stand hinter dem Aussehen der Menschen zurück
  rationale: Gibt den vergleichenden Gedanken des Zurückbleibens beziehungsweise Unterlegenseins wieder, ohne eine präzisere körperliche Deutung einzutragen.
- source_word: πληγῇ
  choice: Leiden
  rationale: Im Kontext des leidenden Gottesknechts ist die weitere Bedeutung Leiden oder Heimsuchung angemessener als das modern missverständliche Seuche; die konkretere Möglichkeit Wunde bleibt in einer Fußnote sichtbar.
- source_word: μαλακίαν
  choice: Schwachheit
  rationale: Das Wort kann Schwäche oder Krankheit bezeichnen. Schwachheit wahrt hier die Breite des Ausdrucks und passt zu φέρειν, tragen.
theological_decisions:
- issue: Bezeichnung Jesu als Χριστός
  choice: Messias
  alternative: Christus
  rationale: Der griechische Ausdruck ist ein Hoheitstitel; Messias macht seine Titelfunktion für heutige Leser deutlicher, ohne eine zusätzliche konfessionelle Deutung einzuführen.
- issue: Sprechender im Jesaja-Zitat
  choice: Die grammatischen Personen und die eigentümliche Form des griechischen Zitats bleiben unverändert.
  alternative: Das Zitat nach dem hebräischen Jesajatext oder einer geläufigen deutschen Bibelfassung glätten.
  rationale: Clemens zitiert eine griechische Jesaja-Form, deren Wortlaut teilweise vom Hebräischen abweicht. Die Übersetzung folgt der tatsächlich vorliegenden Quelle.
- issue: Abgewandtes Gesicht
  choice: weil sein Gesicht abgewandt ist
  alternative: weil man das Gesicht von ihm abwandte / weil er sein Gesicht abwandte
  rationale: Die griechische Formulierung nennt keinen eindeutigen Handelnden. Die passive Zustandsbeschreibung bewahrt diese syntaktische und theologische Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Der einleitende Satz bleibt feierlich, wird aber durch geläufige Satzführung verständlich gehalten. Das Jesaja-Zitat ist als poetischer Block gestaltet; seine ungewöhnlichen, durch die griechische Vorlage bedingten Wendungen werden nicht an eine vertraute deutsche Bibelfassung angeglichen.
