lexical_decisions:
- source_word: ταπεινοφρονούντων
  choice: den Demütigen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die demütig gesinnt sind. Die knappe deutsche Form ist natürlich und bewahrt den Gegensatz zum selbstherrlichen Sich-Erheben.
- source_word: ὁ Χριστός
  choice: Christus
  rationale: Der griechische Titel wird in diesem frühchristlichen Text mit der im Deutschen etablierten Form „Christus“ wiedergegeben.
- source_word: ἐπαιρομένων
  choice: die sich … erheben
  rationale: Die textkritisch wiederhergestellte Lesart bezeichnet ein selbstherrliches Sich-Erheben und bildet den beabsichtigten Gegensatz zur Demut.
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: seine Herde
  rationale: Das Hirtenbild wird direkt und idiomatisch bewahrt; gemeint ist die Gemeinschaft, ohne dass diese Deutung in den Haupttext eingesetzt wird.
theological_decisions:
- issue: Bedeutung der Zugehörigkeitsaussage ταπεινοφρονούντων ἐστίν
  choice: Christus gehört den Demütigen
  alternative: Christus ist bei den Demütigen
  rationale: „Gehört“ bildet die Genitivkonstruktion knapp ab, ohne näher zu bestimmen, ob Zugehörigkeit, Gemeinschaft oder Zuwendung im Vordergrund steht.
- issue: Textgrundlage trotz sinnstörender OCR-Lesart
  choice: Die bekannte, kontextuell stimmige Lesart ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ wird übersetzt und in einer Fußnote offengelegt.
  alternative: Die vorgelegte OCR-Lesart ἐπιρριπμένων ἐπὶ τὸν φόβον αὐτοῦ wörtlich übersetzen.
  rationale: Die OCR-Lesart ergibt hier einen sachlich und syntaktisch problematischen Sinn und beruht nach der Quellenprüfung auf Texterkennungsfehlern. Die wiederhergestellte Lesart entspricht dem tatsächlichen Wortlaut der Stelle und ihrem Gegensatz zwischen Demut und Überheblichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und bewahrt den rhetorischen Gegensatz zwischen Demut und selbstherrlichem Erheben; das Bild der Herde wird nicht erläuternd aufgelöst.
