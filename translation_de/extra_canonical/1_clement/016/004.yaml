id: 1CLEM.16.4
reference: 1 Clement 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται, καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: de
  text: Dieser trägt unsere Sünden und leidet um unsertwillen; wir meinten, er sei in Schmerzen, von einem Schlag getroffen und in Bedrängnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Dieser
  rationale: Bewahrt den demonstrativen Nachdruck des griechischen Ausdrucks und verweist unmittelbar auf die zuvor beschriebene Person.
- source_word: φέρει
  choice: trägt
  rationale: Gibt die konkrete und zugleich stellvertretende Bedeutung von φέρει ohne zusätzliche Deutung wieder.
- source_word: περὶ ἡμῶν
  choice: um unsertwillen
  rationale: Natürliches, würdevolles Deutsch für das Leiden zugunsten beziehungsweise wegen anderer; die genaue Verhältnisbestimmung wird nicht dogmatisch verengt.
- source_word: ὀδυνᾶται
  choice: leidet
  rationale: Das Verb bezeichnet schmerzliches Leiden; „leidet“ ist im Deutschen idiomatisch und lässt die körperliche oder seelische Ausprägung offen.
- source_word: ἐν πόνῳ
  choice: in Schmerzen
  rationale: Im Kontext des Jesaja-Zitats bedeutet πόνος Schmerz beziehungsweise Leiden, nicht Arbeit oder Mühe.
- source_word: ἐν πληγῇ
  choice: von einem Schlag getroffen
  rationale: πληγή bezeichnet hier einen Schlag oder eine Heimsuchung. Die verbale Fügung ist natürlicher als das wörtliche „in einem Schlag“ und vermeidet das moderne Missverständnis „Seuche“.
- source_word: ἐν κακώσει
  choice: in Bedrängnis
  rationale: κάκωσις bezeichnet Misshandlung, Elend oder Bedrückung; „Bedrängnis“ wahrt die Breite und passt zum feierlichen Register.
theological_decisions:
- issue: Stellvertretender Bezug des Leidens
  choice: „um unsertwillen“
  alternative: „für uns“ oder „unseretwegen“
  rationale: περὶ ἡμῶν stellt einen Bezug zu „uns“ her, ohne dessen soteriologische Mechanik näher auszuführen. „Um unsertwillen“ bewahrt diese Offenheit.
- issue: Deutung des Schlages
  choice: „von einem Schlag getroffen“
  alternative: „von Gott geschlagen“
  rationale: Der griechische Wortlaut nennt bei πληγή keinen Handelnden. Deshalb wird Gott nicht ausdrücklich als Urheber ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax und Bildsprache. Das einleitende „Dieser“ und der Kontrast „wir aber“ bewahren den rhetorischen Nachdruck; sperrige Lokativformulierungen wurden nur dort idiomatisiert, wo eine wörtliche Wiedergabe im Deutschen unnatürlich wäre.
