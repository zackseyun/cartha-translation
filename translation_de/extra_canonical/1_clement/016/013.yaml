review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die Satzstruktur und die Passivformen im Wesentlichen. »sein Leben« ist für ἡ ψυχὴ αὐτοῦ im Kontext möglich. Bei κληρονομήσει πολλούς ist jedoch »viele als Erbe empfangen« im Deutschen semantisch und idiomatisch zu stark auf ein Empfangen als Erbe festgelegt; das Verb κληρονομέω bedeutet primär »erben/als Erbteil erhalten«.
  naturalness: Die Zeilengliederung und der würdige Register sind gut. »viele als Erbe empfangen« klingt im modernen Standarddeutsch jedoch unnatürlich und lässt die syntaktische Beziehung missverständlich erscheinen. »viele zum Erbteil erhalten« ist klarer und bewahrt die auffällige Personenobjekt-Konstruktion.
  terminology: »Beute der Starken«, »dem Tod preisgegeben« und »zu den Gesetzlosen gezählt« geben σκῦλα, παρεδόθη und ἐν τοῖς ἀνόμοις ἐλογίσθη angemessen wieder. »Gesetzlosen« wahrt die Nähe zu ἀνόμοις.
  issues:
  - severity: medium
    issue: Wiedergabe von κληρονομήσει πολλούς
    rationale: »Viele als Erbe empfangen« kann nahelegen, dass er etwas mittels vieler Personen als Erbe empfängt. Der griechische Akkusativ πολλούς ist vielmehr das direkte Objekt von κληρονομήσει. »Viele zum Erbteil erhalten« gibt die ungewöhnliche Aussage verständlicher wieder, ohne ihre Deutung festzulegen.
  revised_text: 'Darum wird er viele zum Erbteil erhalten,


    und die Beute der Starken wird er verteilen,


    weil sein Leben dem Tod preisgegeben wurde


