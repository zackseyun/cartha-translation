source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: de
  text: 'Darum wird er viele zum Erbteil erhalten,


    und die Beute der Starken wird er verteilen,


    weil sein Leben dem Tod preisgegeben wurde


    und er zu den Gesetzlosen gezählt wurde;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλούς
  choice: wird er viele als Erbe empfangen
  rationale: Bewahrt die ungewöhnliche Konstruktion, in der Personen Gegenstand des Erbens sind, ohne sie zu einer bloßen Mengenangabe abzuschwächen.
- source_word: τῶν ἰσχυρῶν μεριεῖ σκῦλα
  choice: die Beute der Starken wird er verteilen
  rationale: Gibt die Genitivkonstruktion natürlich wieder und erhält die mögliche Bedeutung, dass die Beute den Starken abgenommen wurde.
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: sein Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang mit der Hingabe an den Tod die lebendige Person beziehungsweise das Leben, nicht notwendig eine vom Körper getrennte Seele.
- source_word: τοῖς ἀνόμοις
  choice: den Gesetzlosen
  rationale: Entspricht dem rechtlich-moralischen Sinn von ἄνομος und vermeidet die ungenauere Wiedergabe »Verbrecher«.
theological_decisions:
- issue: Mehrdeutigkeit von κληρονομήσει πολλούς
  choice: viele als Erbe empfangen
  alternative: viele zum Erbteil erhalten
  rationale: Die gewählte Formulierung hält das Erbmotiv fest und lässt offen, wie genau die Vielen als Erbe zu verstehen sind.
- issue: Bedeutung von ψυχή bei der Todeshingabe
  choice: sein Leben
  alternative: seine Seele
  rationale: Im semitisch geprägten Sprachgebrauch kann ψυχή die Person oder ihr Leben bezeichnen. »Leben« ist im Deutschen in Verbindung mit dem Tod natürlicher und vermeidet eine unbeabsichtigte anthropologische Festlegung.
- issue: Passivformen παρεδόθη und ἐλογίσθη
  choice: wurde preisgegeben / wurde gezählt
  alternative: gab er hin / man zählte ihn
  rationale: Die Passivformen des griechischen Textes bleiben erhalten; dadurch wird weder ausdrücklich festgelegt, wer ihn dem Tod übergab, noch wer ihn zu den Gesetzlosen zählte.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Das abschließende Semikolon wahrt den fortlaufenden Charakter des Zitats. Keine Fußnoten erforderlich.
