id: 1CLEM.16.10
reference: 1 Clement 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: de
  text: 'Und ich werde die Bösen anstelle seines Grabes geben

    und die Reichen anstelle seines Todes;


    denn er hat kein Unrecht begangen,

    und in seinem Mund wurde keine Täuschung gefunden.


    Und der Herr will ihn von der Wunde reinigen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem Schlag“; πληγή kann je nach Zusammenhang auch ein Leiden oder eine Heimsuchung bezeichnen. Die Formulierung „von der Wunde reinigen“ gibt die im Griechischen auffällige Verbindung von „reinigen“ mit dem Genitiv wieder.'
    reason: Die Grundbedeutung von πληγή wird gewahrt, während die mögliche Bedeutungsbreite und die ungewöhnliche griechische Konstruktion transparent bleiben.
lexical_decisions:
- source_word: πονηρούς
  choice: die Bösen
  rationale: Gibt die substantivierte Personenbezeichnung direkt und in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: ἀνομίαν
  choice: Unrecht
  rationale: Bezeichnet hier gesetz- bzw. ordnungswidriges Handeln; „Unrecht“ ist natürlich und bewahrt den moralisch-rechtlichen Sinn, ohne unnötig zu verengen.
- source_word: δόλος
  choice: Täuschung
  rationale: Trifft den Sinn von Arglist oder betrügerischer Rede im Zusammenhang mit dem Mund.
- source_word: πληγῆς
  choice: Plage
  rationale: Bewahrt die Spannweite von Schlag, Wunde und Leiden besser als eine eindeutige Festlegung auf nur einen dieser Aspekte.
theological_decisions:
- issue: Ungewöhnliche Zuordnung der Bösen zum Begräbnis und der Reichen zum Tod
  choice: wörtlich als „die Bösen anstelle seines Grabes“ und „die Reichen anstelle seines Todes“ wiedergegeben
  alternative: 'an Jesaja 53,9 angleichen, etwa: „Man gab ihm sein Grab bei den Bösen und bei einem Reichen in seinem Tod“'
  rationale: Der überlieferte griechische Text von 1 Clemens enthält ἀντί und eine gegenüber anderen Jesaja-Textformen ungewöhnliche Formulierung. Diese Spannung darf nicht stillschweigend harmonisiert werden.
- issue: Reinigung von der Plage
  choice: „ihn von der Plage reinigen“
  alternative: „ihn von seiner Wunde heilen“ oder „ihn von dem Leiden reinigen“
  rationale: καθαρίσαι bedeutet ausdrücklich „reinigen“, während der Genitiv mit der Präposition nicht eindeutig idiomatisch ist. Die Übersetzung erhält diese auffällige Ausdrucksweise und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. Die ungewöhnliche Syntax des griechischen Zitats wird bewusst nicht an geläufige Fassungen von Jesaja 53,9–10 angeglichen.
