review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die ungewöhnliche antithetische Formulierung mit ἀντί („anstelle“) zutreffend wieder und harmonisiert sie nicht mit anderen Fassungen von Jesaja 53. Auch ἀνομία, δόλος und die abschließende Aussage über den Willen des Herrn sind sachgerecht erfasst. πληγή bezeichnet jedoch vorrangig einen Schlag bzw. eine Wunde und kann erweitert auch Leiden oder Heimsuchung meinen; „Plage“ ist im Deutschen enger und legt leicht eine Seuche oder allgemeine Katastrophe nahe.
  naturalness: Die Zeilengliederung und der würdige Registerton funktionieren gut. „Von der Plage reinigen“ ist im Deutschen zwar absichtlich auffällig, aber weniger quellennah und idiomatisch als „von der Wunde reinigen“. Die ungewöhnliche Reinigungskonstruktion darf dabei erhalten bleiben.
  terminology: „die Bösen“, „die Reichen“, „Unrecht“ und „Täuschung“ sind vertretbare moderne Wiedergaben. Für πληγή ist „Wunde“ als Grundbedeutung vorzuziehen; die weiterreichenden möglichen Bedeutungen sollten in der Fußnote genannt werden.
  issues:
  - severity: medium
    issue: „Plage“ verengt πληγή unnötig.
    rationale: πληγή meint grundsätzlich Schlag, Hieb oder Wunde; je nach Kontext kann es auch ein Leiden bzw. eine Heimsuchung bezeichnen. „Plage“ weckt im modernen Deutsch besonders die Assoziation einer Seuche oder kollektiven Not und ist daher keine neutrale Grundwiedergabe.
  - severity: medium
    issue: Die Fußnote spricht fälschlich von einem Genitiv „mit der Präposition“.
    rationale: Im griechischen Text steht καθαρίσαι αὐτὸν τῆς πληγῆς, also ein Genitiv ohne Präposition. Die Erläuterung muss diesen strukturellen Fehler beheben.
