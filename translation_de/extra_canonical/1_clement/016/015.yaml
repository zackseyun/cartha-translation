source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: de
  text: 'Und wiederum sagt er selbst:


    »Ich aber bin ein Wurm und kein Mensch,

    den Menschen ein Gespött

    und dem Volk ein Gegenstand der Verachtung.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν αὐτὸς φησίν
  choice: Und wiederum sagt er selbst
  rationale: Gibt sowohl πάλιν als auch das betonte αὐτός ausdrücklich wieder und bewahrt die einleitende Zitierformel.
- source_word: σκώληξ
  choice: Wurm
  rationale: Die direkte und im Psalmzitat etablierte Entsprechung erhält das drastische Bild.
- source_word: οὐκ ἄνθρωπος
  choice: kein Mensch
  rationale: Natürliches modernes Deutsch, das die uneingeschränkte Verneinung des Griechischen bewahrt.
- source_word: ὄνειδος ἀνθρώπων
  choice: den Menschen ein Gespött
  rationale: ὄνειδος bezeichnet hier die Person als Ziel von Schmach oder Spott; die prädikative Nominalform und der Bezug auf Menschen bleiben erhalten.
- source_word: ἐξουθένημα λαοῦ
  choice: dem Volk ein Gegenstand der Verachtung
  rationale: Gibt das seltene Abstraktum als Bezeichnung für jemanden wieder, auf den Verachtung gerichtet ist, und wahrt die nominale Parallelität zu ὄνειδος.
theological_decisions:
- issue: Sprecheridentität im Psalmzitat
  choice: Das Pronomen „er“ und die Ich-Rede werden ohne ergänzende christologische Identifizierung wiedergegeben.
  alternative: Den Sprecher ausdrücklich als Christus benennen.
  rationale: Der unmittelbare griechische Wortlaut enthält an dieser Stelle nur αὐτός und das Zitat; eine ausdrücklichere Identifizierung würde über den Vers hinaus interpretieren.
translation_notes:
  register: Poetisch gegliederte, würdevolle Standardsprache. Die beiden parallelen griechischen Nominalausdrücke werden auch im Deutschen nominal wiedergegeben; dabei vermeidet „Gegenstand der Verachtung“ die grammatisch weniger genaue participiale Auflösung „vom Volk verachtet“.
