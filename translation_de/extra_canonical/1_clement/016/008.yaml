  rationale: 'Es ist nur eine sichere idiomatische Korrektur erforderlich: „zum Tod“ ersetzt das im modernen Deutsch unübliche „in den Tod“. Die lexikalische Mehrdeutigkeit von γενεά bleibt durch „Geschlecht“ und die Fußnote erhalten; die kausale, aber nicht weiter ausgeführte Beziehung der Gesetzlosigkeiten zum Tod bleibt unverändert.'
