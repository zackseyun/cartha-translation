source:
  edition: Funk 1901 (normalized OCR)
  text: τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ . ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤκει εἰς θάνατον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: de
  text: '„Wer wird von seinem Geschlecht[a] erzählen?


    Denn sein Leben wird von der Erde weggenommen.


    Wegen der gesetzlosen Taten meines Volkes kam er zum Tod.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von seiner Generation“; der griechische Ausdruck kann auch seine Herkunft, seine Zeitgenossen oder seine Nachkommenschaft bezeichnen.'
    reason: Der Ausgangstext enthält eine echte lexikalische und auslegungsgeschichtliche Mehrdeutigkeit, die eine einzelne deutsche Entsprechung nicht vollständig abbildet.
lexical_decisions:
- source_word: γενεὰν
  choice: Geschlecht
  rationale: Der Ausdruck kann Herkunft, Generation oder die Menschen seiner Zeit bezeichnen. „Geschlecht“ bewahrt diese Mehrdeutigkeit im Deutschen besser als eine eindeutige Umschreibung.
- source_word: διηγήσεται
  choice: wird … erzählen
  rationale: Gibt das zukünftige Verb direkt und in natürlichem Deutsch wieder, ohne es auf „beschreiben“ oder „ermessen“ zu verengen.
- source_word: αἴρεται
  choice: wird … weggenommen
  rationale: Bewahrt Präsens und Passiv des griechischen Textes sowie das Motiv eines entzogenen Lebens.
- source_word: ἀνομιῶν
  choice: gesetzlosen Taten
  rationale: „Gesetzlosigkeiten“ wäre formal näher, klingt jedoch schwerfällig; die gewählte Form bezeichnet konkrete Verstöße gegen Gottes Recht, ohne die Aussage konfessionell auszudeuten.
- source_word: ἤκει εἰς θάνατον
  choice: kam er in den Tod
  rationale: Folgt der ungewöhnlichen Bewegungsformulierung des griechischen Textes und vermeidet die glättende, stärkere Aussage „wurde getötet“.
theological_decisions:
- issue: Deutung von „seinem Geschlecht“
  choice: Die Aussage bleibt offen und wird nicht christologisch auf Abstammung, ewige Herkunft oder Nachkommenschaft festgelegt.
  alternative: Eine deutende Wiedergabe wie „Wer kann seine Herkunft ergründen?“ oder „Wer wird von seinen Nachkommen erzählen?“
  rationale: Der griechische Wortlaut trägt mehrere mögliche Bedeutungen; der Zusammenhang allein entscheidet nicht eindeutig zwischen ihnen.
- issue: Ursächlicher Zusammenhang mit dem Tod
  choice: „Wegen der gesetzlosen Taten meines Volkes“ gibt ἀπό kausal wieder.
  alternative: „Von den gesetzlosen Taten meines Volkes her“ oder eine instrumentale Deutung, nach der das Volk ihn unmittelbar tötet.
  rationale: Die kausale Lesart ist natürlich und entspricht der konsultierten englischen Fassung, ohne genauer festzulegen, auf welche Weise die Taten des Volkes zu seinem Tod führen.
translation_notes:
  register: Dignitativ-poetische Zeilengliederung entsprechend dem Zitatstil. Die Syntax bleibt nahe am griechischen Text, ist aber für heutige deutschsprachige Leser verständlich. „Gesetzlose Taten“ vermeidet das unnatürliche Abstraktum „Gesetzlosigkeiten“.
