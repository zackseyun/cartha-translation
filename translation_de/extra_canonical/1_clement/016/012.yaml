id: 1CLEM.16.12
reference: 1 Clement 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: de
  text: 'Und der Herr will ihn von der Qual seiner Seele befreien,


    ihm Licht zeigen und ihn mit Einsicht formen,


    den Gerechten rechtfertigen, der vielen gut dient;


    und er selbst wird ihre Sünden tragen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  choice: ihn von der Qual seiner Seele befreien
  rationale: Die Konstruktion bezeichnet eine Befreiung aus dem inneren Leiden; „Qual“ gibt πόνος im Zusammenhang natürlicher und kräftiger wieder als „Mühe“.
- source_word: δεῖξαι αὐτῷ φῶς
  choice: ihm Licht zeigen
  rationale: Die konkrete Bildsprache des Griechischen bleibt ohne erklärende Erweiterung erhalten.
- source_word: πλάσαι τῇ συνέσει
  choice: ihn mit Einsicht formen
  rationale: πλάσαι wird als „formen/gestalten“ wiedergegeben; der Dativ τῇ συνέσει bleibt in seiner möglichen instrumentalen beziehungsweise modalen Bedeutung offen.
- source_word: δικαιῶσαι δίκαιον
  choice: den Gerechten rechtfertigen
  rationale: Die etymologische Spannung zwischen δικαιῶσαι und δίκαιον wird entsprechend durch „rechtfertigen“ und „Gerechten“ bewahrt.
- source_word: εὖ δουλεύοντα πολλοῖς
  choice: der vielen gut dient
  rationale: Das Partizip wird als Relativsatz natürlich ins Deutsche übertragen; εὖ bleibt ausdrücklich mit dem Dienen verbunden.
- source_word: ἀνοίσει
  choice: wird tragen
  rationale: Das Verb bezeichnet hier das Auf-sich-Nehmen beziehungsweise Tragen von Sünden und wird im traditionellen Opfer- und Leidensbild knapp wiedergegeben.
theological_decisions:
- issue: Bestimmtheit von δίκαιον
  choice: den Gerechten
  alternative: einen Gerechten
  rationale: Obwohl der griechische Ausdruck artikellos ist, bezeichnet er im Kontext die zuvor beschriebene Gestalt; die bestimmte Wiedergabe wahrt diesen titularen Bezug, ohne ihre Identität zusätzlich auszudeuten.
- issue: Bezug von αὐτῶν in „ihre Sünden“
  choice: ihre Sünden
  alternative: die Sünden der Vielen
  rationale: Das Pronomen bleibt als Pronomen erhalten und wird nicht ausdrücklich mit „den Vielen“ gleichgesetzt, auch wenn πολλοῖς der naheliegende Bezug ist.
- issue: Implizites Objekt bei ἀφελεῖν und πλάσαι
  choice: ihn
  alternative: die Qual seiner Seele wegnehmen / ohne genanntes Objekt formen
  rationale: Aus den folgenden Bezügen auf dieselbe Gestalt wird das im Deutschen erforderliche Objekt ergänzt; dies folgt der syntaktischen Linie des Zitats, ohne eine neue handelnde Person einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Die ungewöhnliche Formulierung „mit Einsicht formen“ bewahrt die Spannung des griechischen Wortlauts, statt sie deutend zu glätten.
