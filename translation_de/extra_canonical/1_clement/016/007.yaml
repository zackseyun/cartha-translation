source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: de
  text: 'Und der Herr lieferte ihn wegen unserer Sünden aus,


    und weil er misshandelt worden ist,


    öffnet er seinen Mund nicht.


    Wie ein Schaf wurde er zur Schlachtung geführt,


    und wie ein Lamm, das vor seinem Scherer stumm bleibt,


    so öffnet er seinen Mund nicht.


    In seiner Erniedrigung wurde ihm sein Recht genommen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurde sein Gericht weggenommen“. Das griechische Wort kann je nach Zusammenhang auch „Urteil“, „Rechtsprechung“ oder „Recht“ bedeuten.'
    reason: κρίσις ist in dieser knappen forensischen Aussage mehrdeutig; die Fußnote macht sichtbar, dass „Recht“ eine kontextuelle deutsche Wiedergabe und keine abschließende Festlegung ist.
lexical_decisions:
- source_word: παρέδωκεν
  choice: gab … dahin
  rationale: Gibt die Übergabe beziehungsweise Auslieferung des Leidenden idiomatisch und in gehobenem, aber verständlichem Deutsch wieder.
- source_word: διὰ τὸ κεκακῶσθαι
  choice: weil er misshandelt worden war
  rationale: Bewahrt den kausalen Sinn von διά mit substantiviertem Infinitiv und den perfektiv-passiven Aspekt der bereits erlittenen Misshandlung.
- source_word: ἄφωνος
  choice: stumm
  rationale: Bezeichnet hier, dass das Lamm keinen Laut von sich gibt; „stumm“ ist im Deutschen knapp und natürlich.
- source_word: ἡ κρίσις αὐτοῦ ἤρθη
  choice: wurde ihm sein Recht genommen
  rationale: Gibt den forensischen Sinn von κρίσις und die passive Wegnahme verständlich wieder, ohne die genaue rechtliche Nuance endgültig festzulegen.
theological_decisions:
- issue: Bezug von ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: wegen unserer Sünden
  alternative: für unsere Sünden
  rationale: „Wegen“ bewahrt hier den kausalen Bezug der Übergabe auf die Sünden, ohne eine weitergehende Sühnetheorie in die Präposition hineinzulesen.
- issue: Forensische Bedeutung von κρίσις
  choice: sein Recht
  alternative: sein Gerichtsurteil / sein Gericht
  rationale: Der Kontext erlaubt Nuancen wie Recht, Rechtsprechung oder Urteil. Die Hauptfassung ist verständlich und rechtlich offen; die Fußnote weist auf die wörtlichere, mehrdeutige Form hin.
translation_notes:
  register: Moderne Standardsprache mit würdigem, poetischem Zeilenbau. Die wechselnden Tempora des griechischen Textes wurden bewahrt. „Scherer“ ist die natürliche deutsche Bezeichnung für denjenigen, der ein Schaf schert.
