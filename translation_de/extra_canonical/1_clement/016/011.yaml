source:
  edition: Funk 1901 (normalized OCR)
  text: ἐὰν δῶτε περὶ ἁμαρτίας, ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/011.yaml
  text: 'If you give for sin,

    your soul will see long-lived offspring[a].'
translation:
  language: de
  text: 'Wenn ihr ein Sündopfer darbringt,


    wird eure Seele Nachkommen sehen, die lange leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Samen, der lange lebt“.'
    reason: Die Fußnote macht die konkrete Bildsprache von σπέρμα und die ungewöhnliche Verbindung mit μακρόβιον sichtbar.
lexical_decisions:
- source_word: ἐὰν δῶτε περὶ ἁμαρτίας
  choice: Wenn ihr ein Sündopfer darbringt
  rationale: περὶ ἁμαρτίας ist in der griechischen Bibel eine feste kultische Wendung für ein Sündopfer. Das im Deutschen erforderliche Substantiv wird daher ausdrücklich wiedergegeben; „darbringen“ entspricht dem Opferkontext natürlicher als das bloße „geben“.
- source_word: ἡ ψυχὴ ὑμῶν
  choice: eure Seele
  rationale: Die kollektive Singularform des Griechischen bleibt erhalten, auch wenn im Deutschen nach dem pluralischen „ihr“ ebenso „eure Seelen“ denkbar wäre.
- source_word: ὄψεται
  choice: wird … sehen
  rationale: Gibt den Futurwert und das Bild des tatsächlichen Erlebens bzw. Schauens direkt wieder.
- source_word: σπέρμα μακρόβιον
  choice: langlebige Nachkommenschaft
  rationale: σπέρμα bezeichnet hier nicht wörtlich Saat oder Samen, sondern Nachkommen; μακρόβιον beschreibt deren langes Leben.
theological_decisions:
- issue: Opfersprachliche Deutung von περὶ ἁμαρτίας
  choice: Sündopfer
  alternative: für die Sünde
  rationale: Die feste Septuaginta-Verwendung stützt die kultische Deutung. Eine rein wörtliche Fassung wäre im Deutschen missverständlich und könnte wie eine Gabe zugunsten der Sünde klingen.
- issue: Bezug der Verheißung
  choice: eure Seele wird langlebige Nachkommenschaft sehen
  alternative: ihr werdet langlebige Nachkommenschaft sehen
  rationale: Die auffällige Aussage über die „Seele“ wird nicht geglättet; so bleiben Bildsprache und mögliche theologische Spannung des griechischen Wortlauts erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zeilenstruktur wahrt den zweigliedrigen Satz. Die kultische Wendung wird idiomatisch wiedergegeben, während die ungewöhnliche Singularform „eure Seele“ bewusst erhalten bleibt.
