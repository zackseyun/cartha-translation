source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: de
  text: 'Denn der auserwählte David sagt: »Ich will dem Herrn danken, und das wird ihm besser gefallen als ein junger Stier, dem Hörner und Hufe wachsen. Die Armen sollen es sehen und sich freuen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκλεκτὸς Δαυίδ
  choice: der auserwählte David
  rationale: Gibt die attributive Wendung eng und in natürlichem Deutsch wieder, ohne ihre Aussage über David abzuschwächen.
- source_word: Ἐξομολογήσομαι
  choice: Ich will ... danken
  rationale: Im Psalmkontext bezeichnet das Verb ein öffentliches Preisen oder Danken gegenüber Gott; „bekennen“ wäre im heutigen Deutsch leicht als Sündenbekenntnis missverständlich.
- source_word: ἀρέσει αὐτῷ ὑπέρ
  choice: das wird ihm besser gefallen als
  rationale: 'ὑπέρ hat hier vergleichenden Sinn: Der Dank gefällt Gott mehr als das genannte Opfertier.'
- source_word: μόσχον νέον
  choice: ein junger Stier
  rationale: Bezeichnet hier ein junges männliches Rind als Opfertier.
- source_word: κέρατα ἐκφέροντα καὶ ὁπλάς
  choice: mit Hörnern und Hufen
  rationale: Natürliche deutsche Wiedergabe des Bildes eines hinreichend entwickelten jungen Stiers; die wörtlichere Entwicklungsnuance von ἐκφέροντα bleibt in der Fußnote erhalten.
- source_word: πτωχοὶ
  choice: die Armen
  rationale: Bewahrt die soziale und geistliche Offenheit des griechischen Begriffs, statt ihn auf eine engere Bedeutung festzulegen.
- source_word: ἰδέτωσαν ... καὶ εὐφρανθήτωσαν
  choice: sollen es sehen und sich freuen
  rationale: Gibt die Imperative der dritten Person idiomatisch wieder; „es“ nimmt das zuvor beschriebene dankbare Gotteslob auf.
theological_decisions:
- issue: Art der Gott wohlgefälligen Handlung
  choice: Dank als Gott wohlgefälliger als ein Tieropfer
  alternative: Bekenntnis als Gott wohlgefälliger als ein Tieropfer
  rationale: Der zitierte Psalm stellt lobenden Dank dem Opfer gegenüber. Die Übersetzung bewahrt diesen Kontrast, ohne daraus eine allgemeine Lehraussage gegen Opfer abzuleiten.
- issue: Bedeutung von πτωχοί
  choice: die Armen
  alternative: die Demütigen / Elenden
  rationale: „Die Armen“ ist die direkte und offene Wiedergabe und lässt sowohl materielle Not als auch die im Psalm mögliche religiöse Dimension bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Psalmzitat bleibt gut verständlich und leicht feierlich; unnötige Archaismen wie „Farren“ oder „Klauen“ wurden vermieden.
