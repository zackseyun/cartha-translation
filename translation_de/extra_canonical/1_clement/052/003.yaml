source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: de
  text: 'Und wiederum sagt er: „Bring Gott ein Opfer des Lobes dar und erfülle dem Höchsten deine Gelübde. Rufe mich am Tag deiner Bedrängnis an, und ich werde dich retten, und du wirst mich verherrlichen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν αἰνέσεως
  choice: ein Dankopfer
  rationale: Die feste biblische Wendung bezeichnet ein Opfer des Lobes bzw. Dankes. „Dankopfer“ ist im Deutschen natürlich, würdevoll und wahrt den kultischen Charakter.
- source_word: ἀπόδος … τὰς εὐχάς σου
  choice: erfülle … deine Gelübde
  rationale: εὐχαί meint hier im biblischen Zusammenhang abgelegte Gelübde; ἀποδίδωμι fordert dazu auf, das Gelobte zu leisten.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: am Tag deiner Bedrängnis
  rationale: „Bedrängnis“ gibt θλῖψις prägnant wieder und erhält den feierlich-biblischen Ton ohne veraltete Sprache.
- source_word: ἐξελοῦμαί σε
  choice: ich werde dich retten
  rationale: Das Verb bedeutet hier aus einer Notlage herausretten oder befreien. „Retten“ ist klar und lässt Art und Mittel der Befreiung offen.
- source_word: δοξάσεις με
  choice: du wirst mich ehren
  rationale: Im gegebenen Zusammenhang bedeutet δοξάζω, Gott Ehre zu erweisen. „Ehren“ klingt im modernen Deutsch natürlicher als „verherrlichen“, ohne den theologischen Gehalt aufzulösen.
theological_decisions:
- issue: Verhältnis von Gottes Rettung und der Antwort des Menschen
  choice: „dann werde ich dich retten, und du wirst mich ehren“
  alternative: „ich werde dich retten, und du sollst mich verherrlichen“
  rationale: Die griechischen Formen sind beide futurisch. Die Übersetzung bewahrt die Abfolge von göttlicher Rettung und menschlicher Ehrung, ohne das zweite Futur stillschweigend in einen Imperativ umzudeuten.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem biblischem Klang. Die direkte Rede und die parallele Satzstruktur des griechischen Zitats bleiben erhalten.
