revisions:
- from: 'Und wiederum sagt er: „Bring Gott ein Dankopfer dar und erfülle dem Höchsten deine Gelübde. Rufe mich an am Tag deiner Bedrängnis; dann werde ich dich retten, und du wirst mich ehren.“'
  to: 'Und wiederum sagt er: „Bring Gott ein Opfer des Lobes dar und erfülle dem Höchsten deine Gelübde. Rufe mich am Tag deiner Bedrängnis an, und ich werde dich retten, und du wirst mich verherrlichen.“'
  rationale: Die Revision ersetzt die semantisch engere Wiedergabe „Dankopfer“ durch „Opfer des Lobes“ und bildet damit θυσία αἰνέσεως transparent ab. Sie entfernt die nicht ausdrücklich vorhandene Ergänzung „dann“, glättet die Wortstellung und gibt δοξάζω mit „verherrlichen“ quellen- und registergerecht wieder. Die futurische Abfolge bleibt erhalten.
