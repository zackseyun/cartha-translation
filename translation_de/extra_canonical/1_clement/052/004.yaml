lexical_decisions:
- source_word: θυσία
  choice: Opfer
  rationale: Die übliche und im Zusammenhang natürliche Wiedergabe für eine Gott dargebrachte Opfergabe.
- source_word: πνεῦμα συντετριμμένον
  choice: ein zerbrochener Geist
  rationale: Bewahrt das konkrete Bild und die enge Anlehnung an die zugrunde liegende Psalmformulierung; „Geist“ bezeichnet hier die innere Haltung des Menschen.
theological_decisions:
- issue: Verhältnis von Opfer und innerer Haltung
  choice: Die nominale Aussage bleibt ohne erklärende Zusätze stehen.
  alternative: „Das Opfer, das Gott gefällt, ist ein reumütiger Geist.“
  rationale: Der griechische Text sagt weder ausdrücklich „gefällt“ noch eindeutig „reumütig“; die offene, bildhafte Aussage soll nicht theologisierend eingeengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; bewusst knappe Satzgestalt entsprechend dem griechischen Original.
