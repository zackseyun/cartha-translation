source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀπροσδεής, ἀδελφοί, ὁ δεσπότης ὑπάρχει τῶν ἁπάντων· οὐδενὸς οὐδὲν χρῄζει εἰ μὴ τὸ ἐξομολογεῖσθαι αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: de
  text: Der Herr über alles, Brüder und Schwestern, ist auf nichts angewiesen; er braucht nichts von irgendjemandem, außer dass man sich zu ihm bekennt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort kann je nach Zusammenhang auch bedeuten: ihm danken, ihn preisen oder ihm etwas bekennen.'
    reason: Bewahrt die semantische Spannweite von ἐξομολογεῖσθαι.
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: ist auf nichts angewiesen
  rationale: Gibt die Bedürfnislosigkeit Gottes in natürlichem, modernem Deutsch wieder, ohne einen ungewöhnlichen abstrakten Ausdruck zu erzwingen.
- source_word: ἀδελφοί
  choice: Brüder und Schwestern
  rationale: Die Anrede bezeichnet im frühchristlichen Gemeindekontext die Glaubensgeschwister insgesamt; die inklusive Wiedergabe macht den gemeinten Adressatenkreis deutlich.
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: der Herr über alles
  rationale: Bewahrt den Gedanken uneingeschränkter Herrschaft; „Herr“ ist im Deutschen würdevoller und kontextgemäßer als „Gebieter“.
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: er braucht nichts von irgendjemandem
  rationale: Erhält beide Negativpronomen und damit die relationale Betonung des Griechischen.
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: dass man sich zu ihm bekennt
  rationale: ἐξομολογεῖσθαι kann Bekennen, Eingestehen oder Loben/Danken bezeichnen. Im Deutschen hält „sich zu ihm bekennen“ den Gottesbezug fest, ohne den Ausdruck allein auf Sündenbekenntnis zu verengen.
theological_decisions:
- issue: Art der von Gott gewünschten ἐξομολόγησις
  choice: sich zu ihm bekennen
  alternative: ihm danken / ihm Sünden bekennen
  rationale: Der griechische Ausdruck ist mehrdeutig. Der Haupttext wahrt einen breiten Bekenntnissinn; die Fußnote nennt die ebenfalls möglichen kontextuellen Nuancen, ohne eine davon dogmatisch festzulegen.
- issue: Gottes Bedürfnislosigkeit und die Ausnahmeformulierung
  choice: außer dass man sich zu ihm bekennt
  alternative: außer dem Bekenntnis zu ihm
  rationale: Die sprachliche Ausnahme wird erhalten, ohne zu unterstellen, Gott sei im eigentlichen Sinn auf menschliches Bekennen angewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Nachdruck von Ἀπροσδεής und οὐδενὸς οὐδὲν χρῄζει bleibt durch „auf nichts angewiesen“ und „braucht nichts von irgendjemandem“ hörbar. Die Anrede wird gemeindebezogen inklusiv wiedergegeben.
