source:
  edition: Funk 1901 (normalized OCR)
  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: de
  text: Alles ist vor ihm, und nichts ist seiner Überlegung[a] entgangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinem Ratschluss; das griechische Wort kann auch „Plan“ oder „Absicht“ bedeuten.'
    reason: βουλή kann eine Überlegung oder Beratung, aber auch einen Ratschluss, Plan oder eine Absicht bezeichnen. Die Anmerkung bewahrt diese Bedeutungsbreite.
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend alle Dinge; im Deutschen gibt „Alles“ dies natürlich und prägnant wieder.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Bewahrt die räumlich-bildhafte Formulierung des Griechischen, die hier zugleich Gottes unbeschränkte Kenntnis ausdrückt.
- source_word: λέληθεν
  choice: ist … entgangen
  rationale: Das Perfekt von λανθάνω bezeichnet etwas, das unbemerkt geblieben oder der Wahrnehmung entgangen ist. Die deutsche Perfektform gibt sowohl den Aspekt als auch den Erkenntnisbezug natürlich wieder.
- source_word: βουλή
  choice: Ratschluss
  rationale: „Ratschluss“ umfasst hier sowohl beratendes Erkennen als auch Absicht oder Plan und passt zum würdevollen Ton des Textes, ohne die Bedeutung auf bloßes Vorhaben zu verengen.
theological_decisions:
- issue: Verhältnis von Gottes Wissen und Gottes Ratschluss
  choice: „nichts ist seinem Ratschluss entgangen“
  alternative: „nichts ist vor seinem Rat verborgen“ oder „nichts ist seiner Absicht entgangen“
  rationale: Die Übersetzung hält den Erkenntnisaspekt von λανθάνω und die Bedeutungsbreite von βουλή zusammen. Sie vermeidet die Aussage, etwas habe Gottes Plan vereitelt, und legt zugleich nicht fest, ob βουλή primär Gottes Rat, Plan oder Absicht meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten; „Ratschluss“ ist gehoben, aber im religiös-literarischen Kontext weiterhin verständlich.
