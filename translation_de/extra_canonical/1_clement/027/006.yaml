  revision_rationale: Die Revision ersetzt allein die missverständliche Verbindung „seinem Ratschluss entgangen“ durch die idiomatische Formulierung „seiner Überlegung entgangen“. Dadurch wird der mit λέληθεν ausgedrückte Erkenntnisbezug klarer wiedergegeben, während die Fußnote die plan- bzw. beschlussbezogenen Nuancen von βουλή transparent erhält.
