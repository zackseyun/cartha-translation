source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: de
  text: 'Wer wird zu ihm sagen: »Was hast du getan?« Oder wer wird der Macht seiner Kraft widerstehen? Wenn er will und wie er will, wird er alles tun, und nichts von dem, was er beschlossen hat, wird je vergehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: wird … widerstehen
  rationale: Gibt die aktive Bedeutung des Verbs natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: der Macht seiner Stärke
  rationale: Bewahrt die auffällige Häufung zweier Kraftbegriffe im Ausgangstext, statt sie zu einem einzigen Begriff einzuebnen.
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: von dem, was er beschlossen hat
  rationale: Das Partizip bezeichnet hier das von Gott verbindlich Festgesetzte; „beschlossen“ ist im heutigen Deutsch verständlich und vermeidet den missverständlichen modernen Klang von „dogmatisiert“.
- source_word: παρελθῇ
  choice: hinfällig werden
  rationale: Im Zusammenhang mit göttlichen Beschlüssen bezeichnet das Verb, dass etwas vergeht beziehungsweise seine Geltung oder Verwirklichung verfehlt; „hinfällig werden“ passt idiomatisch zum deutschen Satz.
- source_word: οὐδὲν μὴ
  choice: nichts … wird je
  rationale: Die verstärkte griechische Verneinung wird durch „nichts“ und „je“ mit entsprechendem Nachdruck wiedergegeben.
theological_decisions:
- issue: Göttliche Willens- und Handlungsvollmacht
  choice: „Wann er will und wie er will, wird er alles tun“
  alternative: „Alles, was und wie er will, wird er tun“
  rationale: Die gewählte Fassung erhält die beiden adverbialen Bestimmungen ὅτε und ὡς sowie die uneingeschränkte Aussage πάντα, ohne den Gegenstand des Willens zusätzlich auszudeuten.
- issue: Bestand der göttlichen Beschlüsse
  choice: „nichts von dem, was er beschlossen hat, wird je hinfällig werden“
  alternative: „keines seiner Gebote wird vergehen“
  rationale: δεδογματισμένων ist weiter als „Gebote“ und kann Beschlüsse oder Festsetzungen bezeichnen. Die Übersetzung wahrt diese Breite und legt keine besondere dogmatische Kategorie fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schriftsprachlicher Prägung. Die rhetorischen Fragen und die Kraftwort-Häufung des Griechischen bleiben erhalten; unnötige Archaismen werden vermieden.
