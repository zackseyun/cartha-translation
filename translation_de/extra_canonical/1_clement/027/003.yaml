  text: ἀναζωπυρησάτω οὖν ἡ πίστις αὐτοῦ ἐν ἡμῖν, καὶ νοήσωμεν, ὅτι πάντα ἐγγὺς αὐτῷ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: de
  text: Darum möge der Glaube an ihn in uns neu entfacht werden, und lasst uns erkennen, dass alles ihm nahe ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: soll … neu entfacht werden
  rationale: Das Bild eines erneut angefachten Feuers wird natürlich und würdig wiedergegeben; die Form wahrt den auffordernden Charakter des griechischen Imperativs.
- source_word: ἡ πίστις αὐτοῦ
  choice: der Glaube an ihn
  rationale: Der Genitiv αὐτοῦ kann unterschiedlich bestimmt werden. Im Zusammenhang ist der auf ihn gerichtete Glaube die naheliegende Lesart; diese Deutung stimmt auch mit der geprüften englischen Konsultationsfassung überein.
- source_word: νοήσωμεν
  choice: wir wollen erkennen
  rationale: Der Kohortativ bringt eine gemeinsame Aufforderung zum verständigen Erfassen zum Ausdruck.
- source_word: πάντα ἐγγὺς αὐτῷ ἐστιν
  choice: ihm alles nahe ist
  rationale: Die knappe räumliche Metapher des Griechischen bleibt erhalten und wird nicht zu einer spezifischen Aussage über Allwissenheit oder unmittelbare Verfügbarkeit ausgedeutet.
theological_decisions:
- issue: Bedeutung des Genitivs in ἡ πίστις αὐτοῦ
  choice: Glaube an ihn (objektiver Genitiv)
  alternative: sein Glaube beziehungsweise seine Treue
  rationale: Die objektive Deutung passt zum Aufruf an die Gemeinde, den Glauben neu zu beleben. Da die grammatische Form für sich genommen mehrdeutig ist, wird keine weitergehende dogmatische Aussage daraus abgeleitet.
- issue: Aussage, dass alles Gott nahe ist
  choice: Die bildhafte Aussage bleibt wörtlich als „ihm alles nahe“ stehen.
  alternative: Alles liegt offen vor ihm / alles steht ihm unmittelbar zur Verfügung.
  rationale: Die Übersetzung bewahrt die theologische Weite und Spannung der Vorlage, ohne die Aussage ausschließlich als Allwissenheit, Gegenwart oder Macht zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Feuer-Metapher und die prägnante Aussage über Gottes Nähe zu allem bleiben erhalten.
