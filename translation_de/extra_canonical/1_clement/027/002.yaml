source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: de
  text: Wer geboten hat, nicht zu lügen, wird erst recht selbst nicht lügen; denn bei Gott[a] ist nichts unmöglich außer zu lügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für Gott«.'
    reason: παρὰ τῷ θεῷ kann in diesem Zusammenhang idiomatisch sowohl »bei Gott« als auch »für Gott« wiedergegeben werden.
lexical_decisions:
- source_word: ὁ παραγγείλας
  choice: Der geboten hat
  rationale: Gibt das substantivierte Partizip und die verbindliche Anweisung wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt wie »uns« zu ergänzen.
- source_word: πολλῷ μᾶλλον
  choice: erst recht
  rationale: Natürliche moderne Wiedergabe des verstärkenden Schlusses »um wie viel mehr«.
- source_word: αὐτὸς οὐ ψεύσεται
  choice: wird erst recht selbst nicht lügen
  rationale: »selbst« bewahrt die Betonung von αὐτός; das Futur wird als Futur wiedergegeben.
- source_word: παρὰ τῷ θεῷ
  choice: bei Gott
  rationale: Die geläufige deutsche Formulierung entspricht der griechischen Wendung und lässt deren Beziehungsaussage offen.
- source_word: εἰ μὴ τὸ ψεύσασθαι
  choice: außer zu lügen
  rationale: Bewahrt die pointierte Ausnahmeformulierung des griechischen Textes.
theological_decisions:
- issue: Gottes Unmöglichkeit zu lügen
  choice: »bei Gott ist nichts unmöglich außer zu lügen«
  alternative: »Gott kann alles, nur nicht lügen«
  rationale: Die gewählte Fassung hält sich enger an Syntax und Spannung des Originals und deutet die Aussage nicht weiter als abstrakte Lehre über Gottes Fähigkeiten aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Anfangskonstruktion bewahrt den substantivierten griechischen Ausdruck; »erst recht« sorgt zugleich für natürliche Verständlichkeit.
