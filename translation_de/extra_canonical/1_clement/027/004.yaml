source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ συνεστήσατο τὰ πάντα καὶ ἐν λόγῳ δύναται αὐτὰ καταστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/004.yaml
  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: de
  text: Durch das Wort seiner Majestät hat er alles ins Dasein gerufen, und durch ein Wort kann er es vernichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: Durch das Wort / durch ein Wort
  rationale: Die instrumentale Wendung bezeichnet das Wort als Mittel göttlichen Handelns. Beim ersten Vorkommen legt der bestimmte Genitivzusatz eine bestimmte Formulierung nahe; beim zweiten bleibt die deutsche Wiedergabe mit „ein Wort“ natürlich und bewahrt die leichte Asymmetrie des Griechischen.
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: seiner Majestät
  rationale: „Majestät“ gibt μεγαλωσύνη in diesem feierlichen Kontext prägnant und würdevoll wieder.
- source_word: συνεστήσατο
  choice: hat … ins Dasein gerufen
  rationale: Das Medium und der Kontext bezeichnen Gottes schöpferisches Begründen bzw. Herstellen aller Dinge. Die Wendung ist im heutigen Deutsch natürlicher als „hat alles hingestellt“ und eindeutiger schöpfungstheologisch als das mehrdeutige „hat alles gegründet“.
- source_word: τὰ πάντα
  choice: alles
  rationale: Die umfassende Bedeutung von „alle Dinge/das All“ wird idiomatisch mit „alles“ wiedergegeben.
- source_word: δύναται
  choice: kann
  rationale: Bewahrt die Aussage über Gottes Fähigkeit beziehungsweise Macht, ohne sie als bereits vollzogene Handlung darzustellen.
- source_word: καταστρέψαι
  choice: vernichten
  rationale: Das Verb kann umstürzen, zugrunde richten oder vernichten bedeuten. In der Gegenüberstellung zur Erschaffung des Alls trifft „vernichten“ den umfassenden Sinn natürlich und deutlich.
theological_decisions:
- issue: Verhältnis von Schöpfung und möglicher Vernichtung
  choice: 'Die Parallelität wird als Aussage über Gottes souveräne Macht bewahrt: Er rief alles durch sein Wort ins Dasein und kann es durch ein Wort vernichten.'
  alternative: „zerstören“ oder „umstürzen“ statt „vernichten“
  rationale: „Vernichten“ macht den scharfen Gegensatz zu συνεστήσατο sichtbar, ohne zu behaupten, dass Gott dies tatsächlich tun werde; δύναται bleibt als Möglichkeit formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität des Griechischen bleibt erhalten; „wieder“ markiert idiomatisch die Umkehrung des vorausgehenden schöpferischen Handelns, ohne eine zeitliche Wiederholung zu behaupten.
