  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: de
  text: Die Himmel erzählen die Herrlichkeit Gottes[a], und das Himmelsgewölbe verkündet das Werk seiner Hände. Ein Tag sprudelt dem anderen ein Wort hervor, und eine Nacht verkündet der anderen Erkenntnis. Es gibt keine Worte und keine Äußerungen, deren Stimmen nicht gehört werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das anfängliche εἰ („wenn“ oder „da“) im normalisierten OCR-Text ist offenbar ein Erkennungsfehler für Οἱ („die“), entsprechend dem hier zitierten Psalm 19,2 (LXX 18,2).
    reason: textual
lexical_decisions:
- source_word: διηγοῦνται
  choice: erzählen
  rationale: Gibt das ausführliche Kundtun des Verbs natürlich und in Anlehnung an den Psalmton wieder.
- source_word: τὸ στερέωμα
  choice: das Himmelsgewölbe
  rationale: Bezeichnet die sichtbare Himmelsfeste; „Himmelsgewölbe“ ist im modernen Deutsch verständlicher als „Firmament“, ohne das antike Bild aufzulösen.
- source_word: ἐρεύγεται ῥῆμα
  choice: lässt … eine Botschaft hervorströmen
  rationale: Bewahrt sowohl das kräftige Bild von ἐρεύγεται („hervorströmen lassen“) als auch den Mitteilungscharakter von ῥῆμα.
- source_word: γνῶσιν
  choice: Erkenntnis
  rationale: Entspricht dem Bedeutungsfeld von Wissen und Erkennen und wahrt den gehobenen poetischen Registerton.
- source_word: λαλιαί
  choice: Äußerungen
  rationale: Unterscheidet den Ausdruck von λόγοι („Worte“) und bezeichnet Gesprochenes, ohne unnötig technisch zu klingen.
theological_decisions:
- issue: Anfangslesart εἰ gegenüber dem Psalmzitat οἱ
  choice: Als „Die Himmel …“ wiedergegeben und die überlieferte Form in einer Fußnote erläutert
  alternative: „Wenn/da die Himmel …“
  rationale: Der Zusammenhang zitiert Psalm 19,2–4 (LXX 18,2–4); εἰ ist sehr wahrscheinlich ein OCR- oder Drucklesefehler für Οἱ. Eine konditionale oder kausale Wiedergabe würde den Satzbau entstellen, doch die formale Ausgangslesart wird nicht verschwiegen.
- issue: Generelle Hörbarkeit der kosmischen Verkündigung
  choice: „deren Stimmen nicht gehört werden“
  alternative: 'Sinngemäß: „ohne dass ihre Stimme gehört würde“'
  rationale: Die relative Konstruktion und ihre umfassende Aussage werden beibehalten, ohne die poetische Spannung rationalisierend umzudeuten.
translation_notes:
  register: Poetisch-gehobenes, aber gegenwärtiges Standarddeutsch. Die Parallelstruktur des Psalmzitats bleibt erhalten; altertümliche Formen und unnötig kirchensprachliche Ausdrücke werden vermieden.
