id: 1CLEM.27.1
reference: 1 Clement 27:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: de
  text: In dieser Hoffnung nun sollen unsere Seelen fest an den gebunden sein, der in seinen Verheißungen treu und in seinen Urteilen gerecht ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεδέσθωσαν
  choice: sollen … fest … verbunden sein
  rationale: Der Perfektimperativ Passiv bezeichnet einen herbeigeführten und fortdauernden Zustand des Gebundenseins; „fest verbunden sein“ gibt dies natürlich und würdig wieder.
- source_word: τῷ πιστῷ
  choice: mit dem …, der … treu … ist
  rationale: Der Dativ bezeichnet die Person, mit der die Seelen verbunden sein sollen. Die substantivierte Personenbezeichnung wird im Deutschen durch einen Relativsatz klar wiedergegeben.
- source_word: ἐν ταῖς ἐπαγγελίαις
  choice: in seinen Verheißungen
  rationale: Die Wendung bezeichnet den Bereich, in dem sich seine Treue erweist; das Possessivpronomen ist im Deutschen zur natürlichen Zuordnung erforderlich.
- source_word: ἐν τοῖς κρίμασιν
  choice: in seinen Urteilen
  rationale: κρίματα kann richterliche Entscheidungen beziehungsweise Urteile bezeichnen. „Urteile“ bewahrt den forensischen Sinn, ohne ihn unnötig einzuengen.
theological_decisions:
- issue: Identität des substantivierten „Treuen und Gerechten“
  choice: „dem, der … treu und … gerecht ist“ ohne ausdrückliche Benennung
  alternative: „Gott“ oder „dem Einen“ ausdrücklich einsetzen
  rationale: Der griechische Text nennt die Person an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt diese implizite Referenz und vermeidet eine über den Wortlaut hinausgehende Festlegung.
- issue: Syntaktische Zuordnung der Dative
  choice: „In dieser Hoffnung“ als Rahmen und „mit dem“ als Ergänzung zu „verbunden“
  alternative: Die Seelen „mit dieser Hoffnung“ verbinden und den Treuen als Bereich auffassen
  rationale: τῷ πιστῷ ist die natürliche dativische Ergänzung zu προσδέω; Ταύτῃ … τῇ ἐλπίδι bezeichnet dagegen den Bereich oder Grund, in dem die Aufforderung ergeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Griechischen eng, bleibt aber idiomatisch; „Seelen“ wird als anthropologische Ausdrucksweise des Ausgangstextes bewahrt.
