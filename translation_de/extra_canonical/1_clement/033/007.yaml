  source_fidelity: Die Satzglieder und die wiederholte Schmuckmetapher sind im Entwurf grundsätzlich zutreffend wiedergegeben. Der aoristische Partizip κοσμήσας bezeichnet jedoch die dem Sichfreuen vorausgehende Handlung; die bloße Reihung „schmückte sich und freute sich“ lässt diese Vorzeitigkeit weniger klar erkennen.
  naturalness: „Lasst uns erkennen“ ist in diesem auffordernden, betrachtenden Zusammenhang idiomatisches modernes Standarddeutsch. Die Konstruktion „nachdem er sich … geschmückt hatte“ ist klar und würdig, ohne eine unnatürliche Partizipialkonstruktion zu erzwingen.
