reference: 1 Clement 33:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: de
  text: Lasst uns erkennen, dass alle Gerechten mit guten Werken geschmückt wurden und dass auch der Herr selbst, nachdem er sich mit guten Werken geschmückt hatte, sich freute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Lasst uns sehen
  rationale: Gibt den hortativen Aoristkonjunktiv direkt und im Zusammenhang als Aufforderung zum Wahrnehmen bzw. Betrachten wieder, nicht als Aufforderung, für etwas zu sorgen.
- source_word: ἐκοσμήθησαν / κοσμήσας
  choice: wurden geschmückt / schmückte sich
  rationale: Bewahrt das gemeinsame Bild von κοσμέω in beiden Satzteilen und unterscheidet Passiv und reflexiven Gebrauch. Das deutsche Präteritum beim Partizip fügt sich natürlich in die zeitliche Abfolge ein.
- source_word: καὶ αὐτὸς δὲ ὁ κύριος
  choice: und dass auch der Herr selbst
  rationale: Gibt die additive Hervorhebung natürlich wieder; „selbst“ bewahrt die Betonung von αὐτός, während „auch“ den Anschluss markiert.
- source_word: ἐχάρη
  choice: freute sich
  rationale: Direkte, idiomatische Wiedergabe des Aorists von χαίρω.
theological_decisions:
- issue: Gute Werke werden sowohl den Gerechten als auch dem Herrn zugeschrieben.
  choice: Die parallele Aussage und dasselbe Schmuckbild werden unverändert bewahrt.
  alternative: Die Werke des Herrn erklärend als Schöpfungswerke oder Heilstaten bestimmen.
  rationale: Der griechische Text spezifiziert die Werke nicht; eine nähere theologische Festlegung wäre interpretierende Hinzufügung.
- issue: Identität von „der Herr“
  choice: „der Herr“ ohne erklärenden Zusatz
  alternative: „Jesus Christus“ oder „Gott“
  rationale: κύριος bleibt im unmittelbaren Satz mehrdeutig; die Übersetzung soll diese Offenheit nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter hortativer Einleitung. Die wiederholte Schmuckmetapher ist bewusst erhalten. Der griechische vorzeitige Aoristpartizipialgedanke wird im Deutschen durch die Abfolge „schmückte sich und freute sich“ natürlich ausgedrückt, ohne eine schwerfällige Partizipialkonstruktion.
