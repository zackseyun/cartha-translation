base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: de
  text: Da wir nun dieses Vorbild haben, lasst uns uns seinem Willen ohne Zögern zuwenden. Lasst uns mit all unserer Kraft ein Werk der Gerechtigkeit vollbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπογραμμός
  choice: Vorbild
  rationale: Bezeichnet ein vorgezeichnetes Muster oder Beispiel, an dem man sich orientiert; „Vorbild“ ist im Deutschen natürlich und wahrt den exemplarischen Sinn.
- source_word: ἀόκνως
  choice: ohne Zögern
  rationale: Gibt die Grundbedeutung „ohne Scheu, Zögern oder Säumen“ präzise wieder und vermeidet die weniger genaue Wiedergabe „eifrig“.
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: seinem Willen folgen
  rationale: Die wörtliche Vorstellung des Herantretens an Gottes Willen klingt im Deutschen unnatürlich; „folgen“ bringt die intendierte Hinwendung und praktische Ausrichtung idiomatisch zum Ausdruck.
- source_word: ἐξ ὅλης τῆς ἰσχύος ἡμῶν
  choice: mit all unserer Kraft
  rationale: Nahe, klare Wiedergabe des umfassenden Krafteinsatzes.
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: ein Werk der Gerechtigkeit tun
  rationale: Bewahrt die bewusste Verbindung von Verb und Substantiv, ohne die im Deutschen schwerfällige Etymologie „ein Werk wirken“ zu verwenden.
theological_decisions:
- issue: Verhältnis von menschlichem Handeln und Gerechtigkeit
  choice: „ein Werk der Gerechtigkeit tun“
  alternative: „Gerechtigkeit üben“
  rationale: Die Formulierung hält die konkrete Rede vom Werk fest, ohne eine bestimmte Rechtfertigungslehre einzutragen oder die Aussage zu verallgemeinern.
- issue: Hinwendung zu Gottes Willen
  choice: „seinem Willen folgen“
  alternative: „an seinen Willen herantreten“
  rationale: Die idiomatische Wiedergabe beschreibt gehorsame Ausrichtung, ohne genauer zu bestimmen, wie dieses Folgen theologisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemeinschaftlichem Aufforderungston. Die parallelen Kohortative werden durch zweimaliges „wollen wir“ klar und natürlich wiedergegeben.
