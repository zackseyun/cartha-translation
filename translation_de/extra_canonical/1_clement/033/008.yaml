review_pass:
  verdict: revise
  source_fidelity: „Seinem Willen folgen“ gibt zwar eine mögliche praktische Folge wieder, verschiebt προσέλθωμεν jedoch von der bildhaften Hinwendung/Annäherung zu ausdrücklich gehorsamem Befolgen. „Uns seinem Willen zuwenden“ ist idiomatisch und näher am griechischen Ausdruck. Die übrigen Bestandteile geben ὑπογραμμός, ἀόκνως, ἐξ ὅλης τῆς ἰσχύος ἡμῶν und ἐργασώμεθα ἔργον δικαιοσύνης zutreffend wieder.
  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. „Lasst uns“ bildet die beiden griechischen Kohortative direkt und natürlich ab; „ein Werk der Gerechtigkeit vollbringen“ ist im Deutschen flüssiger als „tun“ und erhält die substantivische Betonung von ἔργον.
  terminology: „Vorbild“ ist für ὑπογραμμός angemessen. „Gerechtigkeit“ bewahrt δικαιοσύνη ohne konfessionelle Einengung. „Seinem Willen zuwenden“ vermeidet es, über die im Ausgangstext gewählte Annäherungsmetapher hinaus eine bestimmte theologische Auslegung einzutragen.
  issues:
