    issue: „seinem Willen folgen“ statt einer Hinwendungs-/Annäherungsformulierung
    rationale: προσέλθωμεν bedeutet wörtlich „lasst uns hinzutreten/herantreten“. „Folgen“ interpretiert die Bewegung als Gehorsam und ist daher gegenüber dem griechischen Bild enger und weniger quellennah.
  revised_text: Da wir nun dieses Vorbild haben, lasst uns uns seinem Willen ohne Zögern zuwenden. Lasst uns mit all unserer Kraft ein Werk der Gerechtigkeit vollbringen.
