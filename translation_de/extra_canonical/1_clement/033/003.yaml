source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: de
  text: Denn durch seine überaus gewaltige Macht festigte er die Himmel, und durch seine unergründliche Einsicht lenkte er sie. Die Erde schied er von dem Wasser, das sie umgibt, und gründete sie auf das sichere Fundament seines eigenen Willens. Den Lebewesen, die sich auf ihr bewegen, gebot er, gemäß seiner eigenen Anordnung zu existieren. Nachdem er das Meer und die Lebewesen darin vorbereitet hatte, schloss er es[a] durch seine eigene Kraft ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist bei „schloss ... ein“ kein Objekt ausdrücklich genannt; dem Zusammenhang nach ist wahrscheinlich das Meer gemeint.
    reason: Das Objekt von ἐνέκλεισεν bleibt im griechischen Wortlaut unausgedrückt. Das deutsche „es“ bezieht sich daher als naheliegende Ergänzung auf „das Meer“, ohne diese Deutung als völlig eindeutig auszugeben.
lexical_decisions:
- source_word: παμμεγεθεστάτῳ … κράτει
  choice: durch seine überaus gewaltige Macht
  rationale: Gibt den Superlativ und die Bedeutung von κράτος als wirksame Macht in natürlichem, würdigem Deutsch wieder.
- source_word: ἐστήριξεν
  choice: festigte
  rationale: Bewahrt den Gedanken des Festmachens und Stützens, ohne die kosmologische Bildsprache unnötig auszubauen.
- source_word: ἀκαταλήπτῳ … συνέσει
  choice: durch seine unergründliche Einsicht
  rationale: ἀκατάληπτος bezeichnet etwas, das menschliches Begreifen übersteigt; σύνεσις ist Einsicht oder Verständnis.
- source_word: διεκύβευσεν
  choice: lenkte
  rationale: Das Verb trägt das Bild kundiger Steuerung beziehungsweise Führung; „lenkte“ ist verständlich und bewahrt diese aktive Bedeutung.
- source_word: βουλήματος
  choice: Willens
  rationale: Das Wort kann Wille, Absicht oder Ratschluss bezeichnen. „Willen“ bleibt natürlich und legt keine zusätzliche konfessionelle Deutung fest.
- source_word: φοιτώντα
  choice: die sich … bewegen
  rationale: Gibt das Umhergehen beziehungsweise Sich-Bewegen der Lebewesen idiomatisch wieder.
- source_word: ἐκέλευσεν εἶναι
  choice: gebot …, da zu sein
  rationale: Bewahrt ausdrücklich sowohl das gebietende Verb als auch den Existenzbezug des Infinitivs.
- source_word: προετοιμάσας
  choice: bereitete … im Voraus
  rationale: Bildet das Präfix προ- sichtbar ab und erhält die zeitliche Vorordnung der Vorbereitung.
- source_word: ἐνέκλεισεν
  choice: schloss … ein
  rationale: Entspricht der Grundbedeutung des Einschließens oder Begrenzens und passt zum Meer im Schöpfungskontext.
theological_decisions:
- issue: Das sichere Fundament der Erde
  choice: „das sichere Fundament seines eigenen Willens“ als bildhafte Aussage beibehalten
  alternative: Die Formulierung kosmologisch erklären oder als bloßes Naturgesetz umschreiben
  rationale: Der griechische Text verbindet Schöpfungsbild und göttlichen Willen ausdrücklich; die Übersetzung wahrt diese Spannung, ohne sie zu systematisieren.
- issue: Gottes Befehl an die Lebewesen, zu sein
  choice: Die ungewöhnliche Existenzformulierung ausdrücklich erhalten
  alternative: Frei als „rief die Lebewesen ins Dasein“ wiedergeben
  rationale: ἐκέλευσεν εἶναι betont zugleich Befehl und Sein; die formalere Wiedergabe bewahrt beides.
- issue: Nicht ausgedrücktes Objekt bei ἐνέκλεισεν
  choice: Im Haupttext das Meer als naheliegenden Bezug von „es“ wiedergeben und die grammatische Offenheit anmerken
  alternative: Explizit „das Meer“ oder „sie alle“ einsetzen
  rationale: Im Griechischen fehlt ein ausgesprochenes Objekt. Der unmittelbare Schöpfungskontext legt das Meer nahe, doch eine Ergänzung sollte nicht als völlig eindeutig ausgegeben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Schöpfungsvokabular. Satzbau und Wiederholungen folgen der feierlichen Reihung des griechischen Textes, bleiben aber für heutige Leser verständlich.
