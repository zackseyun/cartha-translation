revisions:
- from: Denn durch seine überaus gewaltige Macht festigte er die Himmel, und durch seine unergründliche Einsicht lenkte er sie. Die Erde schied er von dem Wasser, das sie umgibt, und gründete sie auf das sichere Fundament seines eigenen Willens. Den Lebewesen, die sich auf ihr bewegen, gebot er durch seine eigene Anordnung, da zu sein. Das Meer und die Lebewesen darin bereitete er im Voraus und schloss es[a] durch seine eigene Kraft ein.
  to: Denn durch seine überaus gewaltige Macht festigte er die Himmel, und durch seine unergründliche Einsicht lenkte er sie. Die Erde schied er von dem Wasser, das sie umgibt, und gründete sie auf das sichere Fundament seines eigenen Willens. Den Lebewesen, die sich auf ihr bewegen, gebot er, gemäß seiner eigenen Anordnung zu existieren. Nachdem er das Meer und die Lebewesen darin vorbereitet hatte, schloss er es[a] durch seine eigene Kraft ein.
  rationale: Die Revision korrigiert die Funktion von τῇ ἑαυτοῦ διατάξει als Maßgabe der geschaffenen Existenz und verbessert zugleich die idiomatische deutsche Wiedergabe von ἐκέλευσεν εἶναι. Der Schluss bewahrt die griechische Objektellipse bei ἐνέκλεισεν durch ein deutsches Pronomen samt erläuternder Fußnote; es wird keine weitergehende kosmologische oder theologische Deutung eingeführt.
