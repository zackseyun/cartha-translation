base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: de
  text: Über alles hinaus formte er mit seinen heiligen und unbefleckten Händen den Menschen – das hervorragendste und überaus große Werk, Gottes Denken gemäß[a] – als Gepräge seines eigenen Bildes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Menschen, der an Denkvermögen der hervorragendste und überaus groß ist“. Die knappe griechische Formulierung lässt auch eine Beziehung auf das Denken des Menschen zu.'
    reason: Bewahrt die mögliche syntaktische Mehrdeutigkeit von κατὰ διάνοιαν und der substantivierten Neutra, während der Haupttext die im Schöpfungskontext bevorzugte Beziehung auf Gottes Denken ausdrücklich macht.
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: Über allem aber
  rationale: Gibt die herausgehobene, krönende Stellung des Menschen innerhalb der zuvor beschriebenen Schöpfungswerke wieder; „aber“ sorgt im Deutschen für einen natürlichen Übergang.
- source_word: ἔπλασεν
  choice: formte
  rationale: Bewahrt die konkrete Vorstellung des gestaltenden Formens, die durch die Erwähnung der Hände verstärkt wird.
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: das hervorragendste und überaus große Werk
  rationale: Die substantivierten Neutra werden als appositionelle Beschreibung des Menschen verstanden. „Werk“ macht den im Deutschen sonst schwer wiederzugebenden sachlichen Ausdruck verständlich, ohne den Menschen auf eine bloße Sache zu reduzieren.
- source_word: κατὰ διάνοιαν
  choice: seinem Denken gemäß
  rationale: Gibt κατά mit Akkusativ formal und offen wieder. Das Possessivpronomen bezieht die Wendung im Einklang mit dem Schöpfungskontext auf Gottes Denken, ohne sie enger als „Plan“ oder „Absicht“ festzulegen.
- source_word: χαρακτῆρα
  choice: Gepräge
  rationale: Bewahrt die Vorstellung einer eingeprägten oder kennzeichnenden Gestalt und vermeidet, χαρακτήρ und εἰκών mit demselben deutschen Wort wiederzugeben.
- source_word: τῆς ἑαυτοῦ εἰκόνος
  choice: seines eigenen Bildes
  rationale: Entspricht der reflexiven Betonung von ἑαυτοῦ und erhält die Bild-Terminologie des griechischen Textes.
theological_decisions:
- issue: Bezug von κατὰ διάνοιαν
  choice: Die Wendung wird auf Gottes Denken bei der Erschaffung des Menschen bezogen.
  alternative: Die Wendung kann als Beschreibung des Menschen hinsichtlich seines Denkvermögens verstanden werden.
  rationale: Der unmittelbare Kontext hebt Gottes Einsicht, Willen, Ordnung und Macht im Schöpfungshandeln hervor; zugleich lässt die knappe griechische Konstruktion eine alternative syntaktische Zuordnung zu, die in der Fußnote bewahrt wird.
- issue: Verhältnis von Mensch, Bild und Gepräge
  choice: Der Mensch wird als „Gepräge seines eigenen Bildes“ bezeichnet.
  alternative: Freier wäre „als Abbild seiner selbst“ oder „nach seinem eigenen Bild“.
  rationale: Die gewählte Fassung erhält die Spannung zwischen χαρακτήρ und εἰκών, statt beide Begriffe zu verschmelzen oder die ungewöhnliche Formulierung stillschweigend zu glätten.
translation_notes:
  register: Moderne, würdige Standardsprache. „Unbefleckt“ und „Gepräge“ sind leicht gehoben, aber wegen der sakralen Aussage und der präzisen Bildsprache angemessen. Die Gedankenstriche kennzeichnen die appositionelle Beschreibung des Menschen, ohne die griechische Mehrdeutigkeit unnötig einzuebnen.
