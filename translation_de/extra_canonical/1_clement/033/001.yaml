id: 1CLEM.33.1
reference: 1 Clement 33:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: de
  text: Was sollen wir also tun, Geschwister? Sollen wir aufhören, Gutes zu tun,[a] und die Liebe aufgeben? Niemals möge der Herr zulassen, dass dies bei uns geschieht! Lasst uns vielmehr eifrig und bereitwillig darum bemüht sein, jedes gute Werk zu vollbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sollen wir davon ablassen, Gutes zu tun“.'
    reason: Die Konstruktion ἀργέω ἀπό kann als „aufhören mit“ oder „ablassen von“ wiedergegeben werden.
lexical_decisions:
- source_word: ἀδελφοί
  choice: Geschwister
  rationale: Die Anrede bezeichnet die Gemeinschaft der Glaubenden; „Geschwister“ gibt sie im heutigen Deutschen natürlich und inklusiv wieder.
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: Sollen wir aufhören, Gutes zu tun
  rationale: ἀργέω mit ἀπό bezeichnet hier das Ablassen beziehungsweise Aufhören; die Wiedergabe vermeidet den irreführenden Eindruck bloß nachlässigen Handelns.
- source_word: δεσπότης
  choice: Herr
  rationale: Im religiösen Kontext ist „Herr“ eine würdevolle, natürliche Wiedergabe; das härtere „Gebieter“ wäre zwar lexikalisch möglich, klingt im modernen Deutschen jedoch unnötig herrisch.
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: mit ganzem Ernst und voller Bereitschaft
  rationale: Die Formulierung bewahrt sowohl den Gedanken angespannter Ernsthaftigkeit beziehungsweise Hingabe als auch den der willigen Bereitschaft.
- source_word: σπεύσωμεν ... ἐπιτελεῖν
  choice: Lasst uns ... danach streben, ... zu vollbringen
  rationale: σπεύδω drückt eifriges, entschlossenes Bemühen aus; ἐπιτελεῖν bezeichnet das Ausführen oder Vollbringen.
theological_decisions:
- issue: Bezeichnung Gottes durch ὁ δεσπότης
  choice: der Herr
  alternative: der Gebieter
  rationale: „Herr“ wahrt den Gottesbezug und den souveränen Anspruch, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Reichweite von ἐφ’ ἡμῖν γενηθῆναι
  choice: dass dies bei uns geschieht
  alternative: dass dies über uns kommt
  rationale: „Bei uns“ lässt offen, ob die Aussage das Verhalten innerhalb der Gemeinschaft oder einen die Gemeinschaft betreffenden Zustand hervorhebt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gemeinschaftlicher Mahnrede. Die rhetorischen Fragen und der nachdrückliche Übergang zu „vielmehr“ bleiben erhalten.
