  text: αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: de
  text: Denn der Schöpfer und Herr über alles selbst freut sich über seine Werke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργός
  choice: Schöpfer
  rationale: Bezeichnet hier Gott als den Urheber der Schöpfung; „Schöpfer“ ist im Deutschen natürlich und sachlich genau.
- source_word: δεσπότης
  choice: Herr
  rationale: Gibt die Bedeutung eines souveränen Gebieters würdig und verständlich wieder, ohne die im heutigen Deutschen irreführende Färbung von „Despot“.
- source_word: τῶν ἁπάντων
  choice: über alles
  rationale: Drückt die umfassende Herrschaft aus, die durch den Genitiv bei δεσπότης bezeichnet wird.
- source_word: ἀγάλλεται
  choice: freut sich
  rationale: Gibt die starke, positive Freude des Verbs in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezug von αὐτός
  choice: „selbst“ beim Subjekt beibehalten
  alternative: Das Pronomen unübersetzt lassen
  rationale: Das griechische αὐτός hebt den Schöpfer und Herrn persönlich hervor; „selbst“ bewahrt diese Betonung, ohne sie auszudeuten.
- issue: Gottes Freude an seinen Werken
  choice: „freut sich selbst an seinen Werken“
  alternative: „jubelt über seine Werke“
  rationale: Die Formulierung bewahrt die Aussage über Gottes Freude, ohne deren Art oder Intensität über den griechischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Keine Fußnoten erforderlich.
