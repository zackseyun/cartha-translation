    rationale: Die Formulierung „freut sich selbst an seinen Werken“ ist weniger idiomatisch und kann „selbst“ formal an das Reflexivverb binden. Die Umstellung bewahrt die Betonung von αὐτός und gibt ἐπί mit „über“ natürlicher wieder.
  revised_text: Denn der Schöpfer und Herr über alles selbst freut sich über seine Werke.
