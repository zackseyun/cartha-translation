source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: de
  text: 'Denn so spricht Gott: »Lasst uns den Menschen nach unserem Bild und nach unserer Ähnlichkeit machen.« Und Gott machte den Menschen; männlich und weiblich schuf er sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσωμεν
  choice: Lasst uns … machen
  rationale: Gibt den deliberativen Konjunktiv in der ersten Person Plural unmittelbar und natürlich wieder.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: Bezeichnet hier den Menschen als Menschheit bzw. menschliches Wesen, nicht ausschließlich einen männlichen Einzelnen.
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν
  choice: nach unserem Bild und nach unserer Ähnlichkeit
  rationale: Bewahrt die zwei parallelen griechischen Begriffe und ihre Präpositionen, ohne sie zu einer einzigen Aussage zu verschmelzen.
- source_word: ἄρσεν καὶ θῆλυ
  choice: als Mann und Frau
  rationale: Natürliches modernes Deutsch für die geschlechtliche Gegenüberstellung; das prädikative Verhältnis zum Erschaffen bleibt erhalten.
- source_word: αὐτούς
  choice: sie
  rationale: Bewahrt den Wechsel vom singularischen »den Menschen« zum pluralischen Pronomen der Vorlage.
theological_decisions:
- issue: Plural in Gottes Rede
  choice: »Lasst uns … nach unserem …« bleibt unverändert pluralisch.
  alternative: Den Plural erläuternd oder singularisch auflösen.
  rationale: Der griechische Text lässt die Deutung des göttlichen Plurals offen; die Übersetzung soll diese theologische Spannung nicht entscheiden.
- issue: Einheit und Vielheit des Menschen
  choice: Singular »den Menschen« und anschließend Plural »sie« werden beide bewahrt.
  alternative: Durchgehend Singular oder durchgehend Plural verwenden.
  rationale: So bleibt die bewusste Spannung der Vorlage zwischen Menschheit als Einheit und Mann und Frau als Vielheit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Wortlaut. Die Zitatstruktur und der Wechsel von Singular zu Plural bleiben erhalten; unnötige Archaismen wurden vermieden.
