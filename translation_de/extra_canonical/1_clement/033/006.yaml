  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οὖν πάντα τελειώσας ἐπῄνεσεν αὐτὰ καὶ ηὐλόγησεν καὶ εἶπεν· Αὐξάνεσθε καὶ πληθύνεσθε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: de
  text: 'Nachdem er dies alles vollendet hatte, lobte und segnete er es und sprach: »Seid fruchtbar und vermehrt euch.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: vollendet hatte
  rationale: Gibt das aoristische Partizip natürlich und zugleich eng am Sinn von »vollenden, zum Abschluss bringen« wieder.
- source_word: ἐπῄνεσεν αὐτὰ
  choice: lobte er es
  rationale: Das griechische Neutrum Plural αὐτά nimmt ταῦτα πάντα auf; im Deutschen wird die Gesamtheit idiomatisch durch das Singularpronomen »es« aufgenommen.
- source_word: ηὐλόγησεν αὐτὰ
  choice: segnete er es
  rationale: Bewahrt die religiös geprägte Grundbedeutung von εὐλογέω und denselben Bezug auf die Gesamtheit des Geschaffenen.
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: Seid fruchtbar und vermehrt euch
  rationale: Entspricht im Schöpfungskontext der etablierten und sachlich passenden deutschen Wiedergabe der aus Genesis angeführten Aufforderung.
theological_decisions:
- issue: Bezug der neutralen Pluralpronomen αὐτά
  choice: Wiedergabe als »es« mit Bezug auf »dies alles«
  alternative: »sie«
  rationale: Die Formulierung hält den umfassenden Bezug auf das zuvor genannte Schöpfungswerk fest, ohne im Deutschen ein missverständliches personales Pluralpronomen zu verwenden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »sprach« wahrt den feierlichen Zitatanschluss; die Satzstruktur bleibt klar und gut lesbar.
