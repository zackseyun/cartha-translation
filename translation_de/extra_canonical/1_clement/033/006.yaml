  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Satzes zuverlässig wieder: Das aoristische Partizip τελειώσας ist angemessen durch „Nachdem er dies alles vollendet hatte“ entfaltet; ἐπῄνεσεν und ηὐλόγησεν werden zutreffend mit „lobte“ und „segnete“ wiedergegeben. Das kollektive deutsche „es“ kann die neutral-plurale Rückverweisung αὐτά auf das gesamte Vollendete idiomatisch aufnehmen. „Seid fruchtbar und vermehrt euch“ wahrt im Schöpfungskontext den Charakter der biblisch geprägten Aufforderung Αὐξάνεσθε καὶ πληθύνεσθε.'
