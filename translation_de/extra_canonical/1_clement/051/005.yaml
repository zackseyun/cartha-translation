source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: de
  text: Der Pharao, sein Heer, alle führenden Männer Ägyptens sowie die Streitwagen und ihre Fahrer versanken im Roten Meer und kamen um. Dies geschah aus keinem anderen Grund, als weil ihre uneinsichtigen Herzen verhärtet worden waren, nachdem im Land Ägypten durch Mose, den Diener Gottes, die Zeichen und Wunder geschehen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἡγούμενοι Αἰγύπτου
  choice: die führenden Männer Ägyptens
  rationale: Gibt die leitende Stellung natürlich wieder, ohne einen bestimmten politischen Amtstitel vorauszusetzen.
- source_word: τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν
  choice: die Streitwagen samt ihren Fahrern
  rationale: Bewahrt die ausdrückliche Nennung der Wagen und bezeichnet οἱ ἀναβάται idiomatisch als deren Fahrer.
- source_word: ἐβυθίσθησαν εἰς θάλασσαν ἐρυθράν
  choice: versanken im Roten Meer
  rationale: Natürliches Deutsch für das passive Versinken beziehungsweise Untergehen im Meer; die traditionelle geografische Bezeichnung bleibt erhalten.
- source_word: ἀσυνέτους καρδίας
  choice: unverständigen Herzen
  rationale: Bewahrt den Bezug auf fehlende Einsicht näher als »töricht«, ohne bloße Intelligenzlosigkeit zu behaupten.
- source_word: θεράποντος τοῦ θεοῦ
  choice: Diener Gottes
  rationale: Im religiösen Kontext ist »Diener« die natürliche und würdevolle Wiedergabe für θεράπων.
theological_decisions:
- issue: Agens der Verhärtung
  choice: ihre unverständigen Herzen verhärtet worden waren
  alternative: sie ihre unverständigen Herzen verhärtet hatten
  rationale: Der griechische passive Infinitiv σκληρυνθῆναι nennt das Agens nicht. Die passive deutsche Form bewahrt diese genuine Offenheit, statt göttliche oder menschliche Verursachung festzulegen.
- issue: Vermittlung der Zeichen und Wunder
  choice: durch Mose, den Diener Gottes
  alternative: mittels Mose, des Dieners Gottes
  rationale: διὰ mit Genitiv bezeichnet Mose als vermittelndes Werkzeug; »durch« gibt dies klar wieder, ohne ihn als eigentliche Quelle der Wunder darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. »Pharao« erhält im Deutschen idiomatisch den bestimmten Artikel; die passive Aussage über die Verhärtung bleibt bewusst unaufgelöst.
