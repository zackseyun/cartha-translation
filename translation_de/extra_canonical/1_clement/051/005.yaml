revisions:
- from: Der Pharao, sein Heer und alle führenden Männer Ägyptens, die Streitwagen samt ihren Fahrern, versanken im Roten Meer und kamen um. Dies geschah aus keinem anderen Grund, als dass ihre unverständigen Herzen verhärtet worden waren, nachdem im Land Ägypten durch Mose, den Diener Gottes, die Zeichen und Wunder geschehen waren.
  to: Der Pharao, sein Heer, alle führenden Männer Ägyptens sowie die Streitwagen und ihre Fahrer versanken im Roten Meer und kamen um. Dies geschah aus keinem anderen Grund, als weil ihre uneinsichtigen Herzen verhärtet worden waren, nachdem im Land Ägypten durch Mose, den Diener Gottes, die Zeichen und Wunder geschehen waren.
  rationale: Die Aufzählung wurde so gegliedert, dass Pharao, Heer, führende Männer, Streitwagen und Fahrer eindeutig gemeinsam Subjekt sind. „Unverständigen“ wurde durch „uneinsichtigen“ ersetzt, um den Sinn von ἀσυνέτους idiomatisch und präzise wiederzugeben. Die passive Verhärtung bleibt ohne Agens, wie im Griechischen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:59Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Satzbau, Kausalität, ungenanntes Agens der passiven Verhärtung, die zeitliche Folge der Zeichen und Wunder sowie θεράπων als „Diener Gottes“ im Wesentlichen korrekt wieder. Die Reihung von Streitwagen und Reitern/Fahrern sollte jedoch eindeutiger als zusätzliche Glieder der Subjektgruppe formuliert werden.
  naturalness: „Unverständige Herzen“ bedeutet im heutigen Deutschen eher „nicht verständliche Herzen“ als „Herzen ohne Einsicht“ und verfehlt daher den natürlichen Sinn. Außerdem kann die bestehende Kommasetzung „alle führenden Männer Ägyptens, die Streitwagen samt ihren Fahrern“ die Streitwagen fälschlich als Apposition zu den Männern erscheinen lassen.
  terminology: „Pharao“, „Rotes Meer“, „Zeichen und Wunder“ und „Diener Gottes“ sind angemessen. „Führende Männer“ ist als kontextoffene Wiedergabe von ἡγούμενοι vertretbar. „uneinsichtig“ trifft ἀσυνέτους im modernen Standarddeutsch besser, ohne über die genaue Art der Einsichtslosigkeit hinauszugehen.
  issues:
  - severity: medium
    issue: „unverständigen Herzen“
    rationale: 'Die Formulierung ist im modernen Deutsch semantisch missverständlich: Sie bezeichnet gewöhnlich etwas schwer Verständliches, nicht Personen beziehungsweise Herzen ohne Einsicht. ἀσυνέτους verlangt eine Wiedergabe wie „uneinsichtig“.'
  - severity: low
    issue: Unklare Aufzählung der Streitwagen und Fahrer
    rationale: Die Kommasetzung lässt „die Streitwagen samt ihren Fahrern“ als nähere Bestimmung von „alle führenden Männer Ägyptens“ lesen. Der griechische Text zählt diese ausdrücklich als weitere betroffene Gruppen auf.
  revised_text: Der Pharao, sein Heer, alle führenden Männer Ägyptens sowie die Streitwagen und ihre Fahrer versanken im Roten Meer und kamen um. Dies geschah aus keinem anderen Grund, als weil ihre uneinsichtigen Herzen verhärtet worden waren, nachdem im Land Ägypten durch Mose, den Diener Gottes, die Zeichen und Wunder geschehen waren.
