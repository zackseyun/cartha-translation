  to: Was immer wir durch etwas, das vom Widersacher kommt, an Fehltritten begangen oder Unrecht getan haben, wollen wir darum bitten, dass uns vergeben wird. Auch jene, die zu Anführern von Aufruhr und Spaltung geworden sind, müssen die gemeinsame Hoffnung im Blick behalten.[a]
