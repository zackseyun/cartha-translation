id: 1CLEM.51.1
reference: 1 Clement 51:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: de
  text: Was immer wir durch etwas, das vom Widersacher kommt, an Fehltritten begangen oder Unrecht getan haben, wollen wir darum bitten, dass uns vergeben wird. Auch jene, die zu Anführern von Aufruhr und Spaltung geworden sind, müssen die gemeinsame Hoffnung im Blick behalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formal: „das Gemeinsame der Hoffnung beachten“.'
    reason: Die Wendung τὸ κοινὸν τῆς ἐλπίδος bedeutet idiomatisch „die gemeinsame Hoffnung“; die Fußnote hält eine stärker formale Deutung der substantivierten Form offen, ohne deren Bedeutung unnötig festzulegen.
lexical_decisions:
- source_word: παρεπέσαμεν
  choice: falsch gemacht
  rationale: Das Verb bezeichnet hier ein Fehlgehen oder einen Fehltritt. Die allgemein verständliche Formulierung bewahrt den Unterschied zum folgenden ἐποιήσαμεν, ohne eine bloß versehentliche Verfehlung festzuschreiben.
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: durch etwas, das vom Widersacher kommt
  rationale: Die elliptische griechische Wendung spricht unbestimmt von etwas, das dem Widersacher zugehört oder von ihm ausgeht. Diese Wiedergabe vermeidet die unbelegte Konkretisierung als „Machenschaften“ oder „Fallstricke“.
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  choice: dafür wollen wir um Vergebung bitten
  rationale: Im Kontext hat ἀξιόω mit dem Infinitiv den Sinn, um etwas zu ersuchen; die deutsche Formulierung gibt zugleich den hortativen Konjunktiv wieder.
- source_word: στάσεως καὶ διχοστασίας
  choice: Aufruhr und Spaltung
  rationale: στάσις bezeichnet hier den innergemeinschaftlichen Aufruhr beziehungsweise die Rebellion, διχοστασία die dadurch hervorgerufene Spaltung.
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  choice: die gemeinsame Hoffnung
  rationale: Die substantivierte Wendung mit Genitiv kann idiomatisch die allen gemeinsame Hoffnung bezeichnen. Eine Fußnote hält die formal näherliegende, aber im Deutschen weniger eindeutige Alternative offen.
- source_word: σκοπεῖν
  choice: im Blick behalten
  rationale: Das Verb fordert zu aufmerksamer Beachtung und Ausrichtung auf; „im Blick behalten“ ist natürlich und bewahrt diesen fortdauernden Sinn.
theological_decisions:
- issue: Bezeichnung ὁ ἀντικείμενος
  choice: der Widersacher
  alternative: der Gegner
  rationale: „Widersacher“ wahrt die mögliche personale, religiöse Referenz, ohne ausdrücklich festzulegen, ob Satan oder ein anderer Gegner gemeint ist.
- issue: Bedeutung von τὸ κοινὸν τῆς ἐλπίδος
  choice: die gemeinsame Hoffnung
  alternative: das gemeinsame Gut der Hoffnung
  rationale: Die idiomatische Lesart passt zum Aufruf an die ganze Gemeinschaft; die alternative Genitivdeutung bleibt wegen der formalen Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der gemeinschaftliche Mahnton wird durch „wollen wir“ und „müssen“ klar wiedergegeben; unnötig konfessionelle oder übermäßig technische Begriffe werden vermieden.
