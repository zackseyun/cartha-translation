source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: de
  text: 'Denn wer sein Leben in Furcht und Liebe führt, will lieber selbst Misshandlungen erleiden, als dass seine Nächsten sie erleiden. Mehr noch: Solche Menschen verurteilen eher sich selbst als die Eintracht, die uns auf gute und gerechte Weise überliefert worden ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιτευόμενοι
  choice: lebt
  rationale: Das Verb bezeichnet hier die Lebensführung beziehungsweise das Verhalten. Das schlichte „lebt“ gibt dies im Zusammenhang natürlich wieder, ohne die im Deutschen irreführende politische Bedeutung von „als Bürger leben“ einzutragen.
- source_word: μετὰ φόβου καὶ ἀγάπης
  choice: in Ehrfurcht und Liebe
  rationale: φόβος kann „Furcht“ bedeuten, bezeichnet in einem religiös-ethischen Zusammenhang jedoch häufig ehrfürchtige Haltung. „Ehrfurcht“ vermeidet den Beiklang bloßer Angst.
- source_word: αἰκίαις περιπίπτειν
  choice: Misshandlungen erleidet
  rationale: αἰκία bezeichnet Misshandlung oder körperliche Schmach; περιπίπτειν beschreibt das Hineingeraten beziehungsweise Betroffensein. Die Formulierung wahrt, dass nicht eine aktive Misshandlung der Nächsten gemeint ist.
- source_word: κατάγνωσιν φέρουσιν
  choice: verurteilen
  rationale: Die Wendung bedeutet hier, ein verurteilendes Urteil über jemanden zu fällen beziehungsweise Verurteilung über ihn zu bringen. Die beiden Genitive ἑαυτῶν und τῆς … ὁμοφωνίας geben die jeweiligen Ziele dieser Verurteilung an.
- source_word: ὁμοφωνίας
  choice: Eintracht
  rationale: Wörtlich bezeichnet das Wort das Sprechen mit einer Stimme und daraus hervorgehend Übereinstimmung oder Einmütigkeit. „Eintracht“ passt zum gemeinschaftlichen Zusammenhang und zum gehobenen Register.
- source_word: καλῶς καὶ δικαίως
  choice: auf gute und gerechte Weise
  rationale: Die Adverbien werden formal auf παραδεδομένης bezogen und nicht stillschweigend in Adjektive zur Beschreibung der Eintracht umgedeutet.
theological_decisions:
- issue: Bezug des elliptischen Vergleichs ἢ τοὺς πλησίον
  choice: „als dass seine Nächsten sie erleiden“
  alternative: „als sie seinen Nächsten zuzufügen“
  rationale: τοὺς πλησίον steht parallel zu ἑαυτούς als gedachtes Subjekt des Infinitivs περιπίπτειν. Der Text sagt daher, dass die Betreffenden lieber selbst Misshandlungen erleiden wollen, als dass ihre Nächsten davon betroffen sind; eine aktive Täterschaft gegenüber den Nächsten wird nicht ausgesagt.
- issue: Sinn von κατάγνωσιν φέρειν
  choice: „verurteilen eher sich selbst“
  alternative: „tragen eher ihre eigene Verurteilung“
  rationale: Die Konstruktion mit den Genitiven bezeichnet hier das Fällen beziehungsweise Bringen eines verurteilenden Urteils über sich selbst oder über die überlieferte Eintracht. Eine Deutung als geduldiges Ertragen einer bereits erfolgten Verurteilung würde den syntaktischen Parallelismus abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Singular „wer … er … seine“ gibt das substantivierte griechische Partizip generisch und flüssig wieder; der anschließende Satz verwendet „solche Menschen“, um einen schwerfälligen Singularbezug zu vermeiden. Die Ellipse beim Leiden der Nächsten wurde ausdrücklich aufgelöst, damit keine im Griechischen nicht vorhandene aktive Zufügung von Misshandlung entsteht.
