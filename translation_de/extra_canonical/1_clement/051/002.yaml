review_pass:
  verdict: revise
  source_fidelity: 'Der erste Satz gibt die elliptische Vergleichskonstruktion korrekt wieder: Die Betreffenden wollen lieber selbst Misshandlungen erleiden, als dass ihre Nächsten sie erleiden. Im zweiten Satz ist κατάγνωσιν φέρειν aktiv als Verurteilung gegen sich selbst bzw. gegen die Eintracht zu verstehen. Die deutsche Fassung trifft dies grundsätzlich, doch „Ehrfurcht“ legt den Sinn von φόβος stärker religiös aus als der griechische Wortlaut verlangt.'
  naturalness: Die Vorlage ist flüssig und verständlich. „Mehr noch“ bildet μᾶλλον δέ idiomatischer ab als das etwas unvermittelte „Ja“. Eine leicht gestraffte zweite Satzhälfte wahrt den gehobenen, modernen Registerton.
  terminology: „Misshandlungen“ für αἰκίαις, „Eintracht“ für ὁμοφωνίας und „verurteilen“ für κατάγνωσιν φέρειν sind treffend. „Furcht“ ist gegenüber „Ehrfurcht“ die weniger interpretierende Wiedergabe von φόβος; der Kontext kann die Haltung näher bestimmen, ohne dass dies im deutschen Text festgelegt werden muss.
  issues:
  - severity: low
    issue: „Ehrfurcht“ ist eine interpretierende Einengung von φόβος.
    rationale: φόβος bedeutet zunächst „Furcht“ und wird im vorliegenden Wortlaut nicht ausdrücklich als Gottesfurcht qualifiziert. „Furcht“ erhält die mögliche religiös-ethische Nuance, ohne sie festzuschreiben.
  - severity: low
    issue: „Ja“ gibt μᾶλλον δέ nur ungenau wieder.
    rationale: Die Partikelverbindung verstärkt den vorangehenden Gedanken im Sinn von „mehr noch“ bzw. „ja vielmehr“. „Mehr noch“ ist im Deutschen klarer und weniger umgangssprachlich.
