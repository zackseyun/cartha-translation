revisions:
- from: Denn wer in Ehrfurcht und Liebe lebt, will lieber, dass er selbst Misshandlungen erleidet, als dass seine Nächsten sie erleiden. Ja, solche Menschen verurteilen eher sich selbst als die Eintracht, die uns auf gute und gerechte Weise überliefert worden ist.
  to: 'Denn wer sein Leben in Furcht und Liebe führt, will lieber selbst Misshandlungen erleiden, als dass seine Nächsten sie erleiden. Mehr noch: Solche Menschen verurteilen eher sich selbst als die Eintracht, die uns auf gute und gerechte Weise überliefert worden ist.'
  rationale: Die Revision ist zurückhaltend. Sie ersetzt die stärker deutende „Ehrfurcht“ durch das quellennähere „Furcht“ und gibt μᾶλλον δέ mit „Mehr noch“ wieder. Die ausdrücklich ergänzte Vergleichskonstruktion bleibt erhalten, weil sie zuverlässig verhindert, dass den Betreffenden eine aktive Misshandlung ihrer Nächsten unterstellt wird. Es sind keine Fußnoten erforderlich.
