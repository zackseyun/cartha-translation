id: 1CLEM.51.3
reference: 1 Clement 51:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: de
  text: Denn es ist gut für einen Menschen, seine Verfehlungen zu bekennen[a], statt sein Herz zu verhärten, so wie das Herz derer verhärtet wurde, die sich gegen Mose, den Diener Gottes, auflehnten. Ihr Gericht wurde offenbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich zu seinen Verfehlungen zu bekennen«.'
    reason: Die mittlere Form ἐξομολογεῖσθαι mit περὶ kann auch reflexiv als Bekenntnis in Bezug auf die eigenen Verfehlungen ausgedrückt werden; der Haupttext ist im modernen Deutschen natürlicher.
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: seine Verfehlungen zu bekennen
  rationale: Die griechische Verbindung bedeutet, sich zu den Verfehlungen zu bekennen beziehungsweise sie einzugestehen. Im natürlichen Deutschen regiert „bekennen“ hier unmittelbar den Akkusativ; die wörtlichere Wiedergabe von περὶ mit „über“ wäre schwerfällig.
- source_word: σκληρῦναι τὴν καρδίαν αὐτοῦ
  choice: sein Herz zu verhärten
  rationale: Bewahrt das biblische Bild und gibt den Infinitiv aktiv und präzise wieder.
- source_word: στασιασάντων πρὸς
  choice: die sich gegen … auflehnten
  rationale: στασιάζω bezeichnet rebellisches Aufbegehren oder Aufruhr; „sich auflehnen“ ist gegenwartssprachlich und behält die Schärfe des Ausdrucks.
- source_word: θεράποντα τοῦ θεοῦ
  choice: den Diener Gottes
  rationale: θεράπων bezeichnet hier einen Gott ergebenen Diener. „Diener Gottes“ ist würdig, verständlich und im biblischen Sprachgebrauch etabliert.
- source_word: τὸ κρίμα πρόδηλον ἐγενήθη
  choice: deren Gerichtsurteil offenbar wurde
  rationale: κρίμα meint in diesem Zusammenhang das richtende Urteil beziehungsweise Strafgericht; „Gerichtsurteil“ wahrt diesen forensisch-theologischen Sinn, während πρόδηλον ἐγενήθη mit „offenbar wurde“ eng wiedergegeben ist.
theological_decisions:
- issue: Bedeutung von κρίμα
  choice: Gerichtsurteil
  alternative: Gericht / Verurteilung
  rationale: „Gerichtsurteil“ lässt offen, ob der Schwerpunkt auf dem göttlichen Urteil oder dessen vollzogener Strafe liegt, und vermeidet es, den Ausdruck vorschnell auf bloße Verurteilung zu verengen.
- issue: Verhärtung des Herzens im Aktiv und Passiv
  choice: Der Mensch verhärtet sein Herz; das Herz der Rebellen wurde verhärtet
  alternative: Der Mensch wird hartherzig; die Rebellen verhärteten ihr Herz
  rationale: Die Übersetzung erhält bewusst den Wechsel vom aktiven σκληρῦναι zum passiven ἐσκληρύνθη und löst die theologische Spannung hinsichtlich der Urheberschaft der Verhärtung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber idiomatisch; der Relativanschluss am Ende wurde so gestaltet, dass er sich eindeutig auf die Aufständischen bezieht.
