    issue: Unklarer bzw. holpriger Relativanschluss am Satzende
    rationale: Das koordinierte »und deren Gerichtsurteil offenbar wurde« folgt auf »die sich ... auflehnten« und lässt den syntaktischen Bezug unnötig unscharf. Der griechische Relativbezug ὧν gilt den Aufständischen; dies sollte im Deutschen eindeutig ausgedrückt werden.
  - severity: low
    issue: »Gerichtsurteil« ist für κρίμα etwas zu eng
    rationale: κρίμα kann Urteil, gerichtliche Entscheidung oder Strafgericht bezeichnen. »Gericht« erhält diese Spannweite, ohne eine rein forensische Lesart festzulegen.
  - severity: low
    issue: Fußnote ist unnötig umständlich und ihre erste Alternative ist kein gutes heutiges Deutsch
    rationale: »sich wegen seiner Verfehlungen zu bekennen« klingt im Deutschen unidiomatisch. Eine kurze alternative Formulierung kann die reflexive Nuance darstellen, ohne einen problematischen Literalismus zu behaupten.
