revisions:
- from: Denn es ist gut für einen Menschen, seine Verfehlungen zu bekennen[a], statt sein Herz zu verhärten, so wie das Herz derer verhärtet wurde, die sich gegen Mose, den Diener Gottes, auflehnten und deren Gerichtsurteil offenbar wurde.
  to: Denn es ist gut für einen Menschen, seine Verfehlungen zu bekennen[a], statt sein Herz zu verhärten, so wie das Herz derer verhärtet wurde, die sich gegen Mose, den Diener Gottes, auflehnten. Ihr Gericht wurde offenbar.
  rationale: Die Revision beseitigt den unklaren Relativanschluss, indem sie den letzten griechischen Relativsatz als eigenen deutschen Satz formuliert. »Ihr Gericht« gibt τὸ κρίμα wieder, ohne zwischen Urteil und Strafgericht zu entscheiden. Die Fußnote wird sprachlich gestrafft und dokumentiert die mögliche reflexive Nuance, ohne die natürliche Haupttextfassung zu belasten.
