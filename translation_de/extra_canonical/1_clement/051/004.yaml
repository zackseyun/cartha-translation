  text: κατέβησαν γὰρ εἰς ᾅδου ζῶντες, καὶ θάνατος ποιμανεῖ αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/004.yaml
  text: For they went down alive into Hades, and death will shepherd them.
translation:
  language: de
  text: Denn sie gingen lebend ins Totenreich hinab, und der Tod wird sie weiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: Totenreich
  rationale: Bezeichnet hier die Unterwelt beziehungsweise den Aufenthaltsort der Toten; „Totenreich“ ist im heutigen Deutsch verständlich und vermeidet die Gleichsetzung mit dem endgültigen Strafort.
- source_word: ζῶντες
  choice: lebend
  rationale: Gibt den prädikativen Partizipialgebrauch knapp und genau wieder.
- source_word: ποιμανεῖ
  choice: wird … weiden
  rationale: Bewahrt das auffällige Hirtenbild des griechischen Verbs und dessen Zukunftsform, ohne die Spannung durch eine deutende Umschreibung aufzulösen.
theological_decisions:
- issue: Bedeutung von ᾅδης
  choice: Totenreich
  alternative: Hades / Hölle
  rationale: „Totenreich“ entspricht dem griechischen Begriff, ohne ihn mit „Hölle“ dogmatisch einzuengen; gegenüber „Hades“ ist es für gewöhnliche Leser unmittelbarer verständlich.
- issue: Metapher vom Tod als Hirten
  choice: der Tod wird sie weiden
  alternative: der Tod wird über sie herrschen / sie hüten
  rationale: Die personifizierende und möglicherweise befremdliche Bildsprache bleibt erhalten, statt interpretierend geglättet zu werden.
translation_notes:
  register: Dignitatives, modernes Standarddeutsch. Die Satzstruktur bleibt nahe am prägnanten griechischen Wortlaut; das ungewöhnliche Hirtenbild wird bewusst bewahrt.
