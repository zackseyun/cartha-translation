base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: de
  text: Dies haben diejenigen getan und werden es tun, die einen gottgemäßen, nicht zu bereuenden Lebenswandel führen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die den nicht zu bereuenden Lebenswandel Gottes leben/führen«. Das Griechische verwendet für »leben« und »Lebenswandel« Wörter derselben Wortfamilie; sie können auch an Bürgerschaft und bürgerliches Verhalten anklingen.'
    reason: Die Anmerkung dokumentiert die figura etymologica und den politischen Bedeutungsanklang. Zugleich erläutert sie, warum der im Deutschen natürlichere Ausdruck »gottgemäß« gewählt wurde, ohne die genaue Nuance des Genitivs dogmatisch festzulegen.
lexical_decisions:
- source_word: πολιτευόμενοι … πολιτείαν
  choice: den Lebenswandel … führen
  rationale: Die etymologisch politische Wortfamilie bezeichnet hier idiomatisch die Lebensführung bzw. das Verhalten. Die deutsche Wendung gibt zugleich die figura etymologica des griechischen Ausdrucks annähernd wieder.
- source_word: ἀμεταμέλητον
  choice: den man nicht bereuen muss
  rationale: Das Adjektiv bedeutet hier »nicht zu bereuen« bzw. »keinen Anlass zur Reue gebend«. Diese Formulierung vermeidet das missverständliche »unbereut«, das im Deutschen meist eine Schuld bezeichnet, für die keine Buße getan wurde.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird formal bewahrt. Ob er den von Gott bestimmten, ihm entsprechenden oder auf ihn bezogenen Lebenswandel meint, wird nicht unnötig festgelegt.
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: haben … getan, und … werden es auch künftig tun
  rationale: Bewahrt den Rückblick und die Zukunftsaussage; »künftig« macht den zeitlichen Gegensatz im natürlichen Deutschen deutlich.
theological_decisions:
- issue: Bezug des Genitivs τοῦ θεοῦ
  choice: »Lebenswandel Gottes« als bewusst offene Genitivverbindung
  alternative: »gottgemäßen Lebenswandel« oder »von Gott bestimmten Lebenswandel«
  rationale: Der griechische Genitiv lässt die genaue Beziehung offen. Eine explizite Deutung würde die theologische Spannung unnötig auflösen.
- issue: Bedeutung von ἀμεταμέλητος
  choice: »den man nicht bereuen muss«
  alternative: »unbereut«
  rationale: »Unbereut« könnte fälschlich einen sündigen, noch nicht bereuten Lebenswandel bezeichnen und damit den Sinn umkehren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Verbindung »Lebenswandel Gottes« bleibt erhalten, um den offenen Genitiv des Originals nicht konfessionell oder interpretativ festzulegen; der Relativsatz erklärt ἀμεταμέλητον eindeutig und idiomatisch.
