  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Begriffe insgesamt zuverlässig wieder: Die Dreierreihe στάσις, ἔρις und σχίσματα bleibt erhalten, ebenso die beiden Verben ἐκχωρῶ und ἄπειμι, die offene Ortsangabe οὗ ἐὰν βούλησθε, die Anordnungen des πλήθος und das friedliche Miteinander mit den eingesetzten Ältesten. Für στάσις ist „Unruhe“ im vorliegenden Konfliktkontext weniger auf einen gewaltsamen Aufstand festgelegt als „Aufruhr“.'
