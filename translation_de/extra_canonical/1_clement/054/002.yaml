id: 1CLEM.54.2
reference: 1 Clement 54:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: de
  text: 'Er soll sagen: »Wenn es durch mich zu Unruhe, Streit und Spaltungen kommt, ziehe ich mich zurück und gehe fort, wohin immer ihr wollt; und ich tue, was die Gemeinschaft[a] anordnet. Nur soll die Herde des Messias mit den eingesetzten Ältesten in Frieden leben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Menge«; gemeint kann die versammelte Gemeinschaft als Ganze sein.'
    reason: τὸ πλῆθος bezeichnet eine Menge beziehungsweise größere Gemeinschaft; ob ein formelles institutionelles Verfahren gemeint ist, bleibt offen.
lexical_decisions:
- source_word: στάσις
  choice: Aufruhr
  rationale: Gibt den gemeinschaftszerstörenden Konflikt wieder, ohne ihn auf eine bloße Meinungsverschiedenheit zu reduzieren.
- source_word: σχίσματα
  choice: Spaltungen
  rationale: Bewahrt den Plural und bezeichnet konkrete Risse innerhalb der Gemeinschaft.
- source_word: ἐκχωρῶ, ἄπειμι
  choice: ziehe ich mich zurück und gehe fort
  rationale: Erhält die zwei aufeinanderfolgenden Verben und gibt ihren natürlichen Sinn im Deutschen wieder.
- source_word: τὸ πλῆθος
  choice: die Gesamtheit
  rationale: Bezeichnet hier die breitere Gemeinschaft als anordnende Instanz, ohne vorschnell ein förmliches Mehrheitsvotum vorauszusetzen.
- source_word: τοῦ Χριστοῦ
  choice: des Messias
  rationale: Gibt den griechischen Titel Χριστός entsprechend seiner Bedeutung als der Gesalbte wieder.
- source_word: τῶν καθεσταμένων πρεσβυτέρων
  choice: den eingesetzten Ältesten
  rationale: καθεσταμένων bezeichnet ihre erfolgte Einsetzung; πρεσβύτεροι wird mit dem transparenten Amtsbegriff „Älteste“ wiedergegeben.
theological_decisions:
- issue: Verhältnis der Herde zu den Ältesten
  choice: mit den eingesetzten Ältesten in Frieden leben
  alternative: unter den eingesetzten Ältesten in Frieden leben
  rationale: Das griechische μετά bezeichnet hier Gemeinschaft beziehungsweise friedliches Miteinander und sagt nicht ausdrücklich „unter“.
- issue: Bezeichnung Χριστός
  choice: Messias
  alternative: Christus
  rationale: „Messias“ macht den Titelcharakter und die Bedeutung „Gesalbter“ deutlich, ohne dem Text eine zusätzliche konfessionelle Auslegung aufzuerlegen.
translation_notes:
  register: Würdiges, gegenwärtiges Standarddeutsch. Die direkte Rede bleibt eindringlich und bewahrt die verbale Doppelung bei Rückzug und Fortgang. „Wohin immer ihr wollt“ bildet die Offenheit von οὗ ἐὰν βούλησθε natürlich ab.
