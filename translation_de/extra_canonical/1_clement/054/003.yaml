id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: de
  text: Wer dies getan hat, wird sich im Messias großen Ruhm erwerben, und jeder Ort wird ihn aufnehmen. Denn dem Herrn gehört die Erde und alles, was sie erfüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: Wer dies getan hat
  rationale: Das substantivierte Aoristpartizip bezeichnet die Person, die die zuvor genannte Handlung vollzogen hat; die Formulierung ist geschlechtsneutral und wahrt den vollendeten Aspekt.
- source_word: μέγα κλέος
  choice: großen Ruhm
  rationale: κλέος bezeichnet Ruhm beziehungsweise hohes Ansehen; „großen Ruhm“ gibt Ausdruck und Stärke knapp und idiomatisch wieder.
- source_word: περιποιήσεται
  choice: wird sich … erwerben
  rationale: Das Medium und der Dativ ἑαυτῷ bringen zum Ausdruck, dass die betreffende Person etwas für sich selbst erlangt.
- source_word: πᾶς τόπος δέξεται αὐτόν
  choice: jeder Ort wird ihn aufnehmen
  rationale: Die personifizierende Ausdrucksweise des Griechischen bleibt erhalten; „aufnehmen“ erfasst δέχομαι natürlicher als „empfangen“.
- source_word: τὸ πλήρωμα αὐτῆς
  choice: alles, was sie erfüllt
  rationale: Die idiomatische Wiedergabe erschließt den Sinn von „ihre Fülle“, ohne den umfassenden Anspruch des Psalmzitats einzuschränken.
theological_decisions:
- issue: Wiedergabe von ἐν Χριστῷ
  choice: im Messias
  alternative: in Christus
  rationale: Χριστός ist der griechische Titel „Gesalbter/Messias“. „Im Messias“ bewahrt hier sowohl den Titelcharakter als auch die theologisch bedeutsame, nicht weiter aufgelöste Präposition ἐν.
- issue: Besitzformel τοῦ γὰρ κυρίου ἡ γῆ
  choice: Denn dem Herrn gehört die Erde
  alternative: Denn die Erde ist des Herrn
  rationale: Die natürliche moderne Besitzformel gibt die elliptische griechische Aussage genau wieder, ohne „Herr“ näher zu identifizieren oder die Aussage theologisch auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang; das Psalmzitat wird verständlich und zugleich feierlich formuliert.
