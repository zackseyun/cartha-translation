  yaml_path: translation/extra_canonical/1_clement/054/001.yaml
  text: Who then among you is noble? Who is compassionate? Who is filled with love?
translation:
  language: de
  text: Wer also unter euch ist hochherzig? Wer ist mitfühlend? Wer ist ganz von Liebe erfüllt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  choice: hochherzig
  rationale: Das Wort bezeichnet hier eine edle, charakterlich vorbildliche Haltung; „hochherzig“ gibt dies im Zusammenhang natürlicher wieder als das mehrdeutige „edel“.
- source_word: εὔσπλαγχνος
  choice: mitfühlend
  rationale: Der Ausdruck bezeichnet herzliches Erbarmen beziehungsweise tiefes Mitgefühl; „mitfühlend“ ist modern, klar und würdevoll.
- source_word: πεπληροφορημένος ἀγάπης
  choice: ganz von Liebe erfüllt
  rationale: Das passive Partizip mit dem Genitiv des Inhalts bezeichnet hier vollständiges Erfülltsein. Die Wiedergabe bewahrt die resultative Nuance des Perfekts und vermeidet die bei dieser Konstruktion weniger passende Deutung „der Liebe völlig gewiss“.
