  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: προσφοραί sind im Kontext zutreffend als „Opfergaben“ wiedergegeben, und „zu den festgesetzten Zeiten“ entspricht τοῖς προστεταγμένοις καιροῖς. Die griechischen Prädikate stehen jedoch im Plural und bezeichnen die Darbringenden als „wohl angenommen/anerkannt“ und „gesegnet“. „Willkommen“ ist hierfür etwas zu umgangssprachlich und weniger präzise. Die Umschreibung „verfehlt sein Ziel nicht“ bewahrt zwar eine mögliche Grundvorstellung von διαμαρτάνω, ist im Deutschen aber unnötig interpretierend und weniger idiomatisch als „geht nicht fehl“.'
