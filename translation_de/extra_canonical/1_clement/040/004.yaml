  terminology: „Opfergaben“ ist angesichts des kultischen Kontextes angemessen. Für δεσπότης ist „Herr“ hier als etablierte religiöse Anrede vertretbar. „Rechtmäßige Ordnungen des Herrn“ gibt den normativen Charakter von νομίμοις wieder, ohne eine bestimmte konfessionelle Auslegung einzutragen.
