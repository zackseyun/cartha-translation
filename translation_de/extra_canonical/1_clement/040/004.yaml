source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: de
  text: Diejenigen also, die ihre Opfergaben zu den festgesetzten Zeiten darbringen, finden Annahme und sind gesegnet; denn indem sie den rechtmäßigen Ordnungen des Herrn folgen, gehen sie nicht fehl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφοράς
  choice: Opfergaben
  rationale: Der kultische Zusammenhang des Abschnitts spricht für „Opfergaben“ statt des allgemeineren „Gaben“.
- source_word: εὐπρόσδεκτοι
  choice: willkommen
  rationale: Gibt die Bedeutung „wohl angenommen, annehmbar“ in natürlichem Deutsch wieder, ohne ausdrücklich zu ergänzen, bei wem die Personen Annahme finden.
- source_word: μακάριοι
  choice: gesegnet
  rationale: Bewahrt hier die religiöse Bedeutung; „glücklich“ wäre zwar möglich, klänge im kultischen Zusammenhang jedoch schwächer.
- source_word: νομίμοις
  choice: Vorschriften
  rationale: Das substantivierte Adjektiv bezeichnet rechtmäßig festgelegte Ordnungen oder Satzungen; „Vorschriften“ ist verständlich und bewahrt den normativen Sinn.
- source_word: δεσπότου
  choice: Herrn
  rationale: „Herr“ ist im religiösen Kontext die natürliche würdevolle Wiedergabe; „Gebieter“ würde die Herrschaftsnuance stärker hervorheben, klingt hier aber weniger idiomatisch.
- source_word: οὐ διαμαρτάνουσιν
  choice: verfehlt sein Ziel nicht
  rationale: Bewahrt die Grundvorstellung des Verfehlens in διαμαρτάνω und vermeidet eine vorschnelle Verengung auf moralisches Irregehen.
theological_decisions:
- issue: Bezug von εὐπρόσδεκτοι auf die darbringenden Personen
  choice: ist willkommen und gesegnet
  alternative: findet Annahme und ist gesegnet
  rationale: Das griechische Prädikat beschreibt grammatisch die Personen. Die Übersetzung lässt wie der Ausgangstext offen, bei wem sie willkommen sind.
- issue: Normativer Charakter der kultischen Ordnung
  choice: den Vorschriften des Herrn folgt
  alternative: die rechtmäßigen Ordnungen des Herrn befolgt
  rationale: Die Formulierung bewahrt die Bindung der Ordnungen an den Herrn, ohne daraus eine bestimmte spätere kirchenrechtliche Lehre abzuleiten.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Satzbau wurde leicht geglättet: Die griechischen Pluralpartizipien werden mit generischem Singular wiedergegeben. Der kultische und normative Ton bleibt erhalten; echte Mehrdeutigkeit wird nicht konfessionell aufgelöst.'
