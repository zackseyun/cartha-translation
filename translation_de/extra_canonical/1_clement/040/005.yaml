id: 1CLEM.40.5
reference: 1 Clement 40:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: de
  text: Denn dem Hohen Priester sind eigene Dienste übertragen, und den Priestern ist ihr eigener Platz zugewiesen, und den Leviten sind eigene Aufgaben auferlegt; der Laie ist an die für Laien geltenden Vorschriften gebunden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργίαι
  choice: Dienste
  rationale: Bezeichnet hier die dem Hohen Priester eigens übertragenen kultischen Dienstaufgaben; „Dienste“ ist natürlich und wahrt den institutionellen Zusammenhang.
- source_word: ὁ τόπος
  choice: Platz
  rationale: Gibt den den Priestern zugewiesenen Bereich beziehungsweise ihre festgelegte Stellung wieder, ohne den Ausdruck unnötig zu präzisieren.
- source_word: διακονίαι
  choice: Aufgaben
  rationale: Hebt die den Leviten obliegenden Dienstverrichtungen hervor und vermeidet eine im Deutschen schwerfällige Wiederholung von „Dienste“.
- source_word: ὁ λαϊκὸς ἄνθρωπος
  choice: der Laie
  rationale: Ist die natürliche deutsche Bezeichnung für einen Menschen, der nicht dem priesterlichen oder levitischen Amt angehört.
- source_word: τοῖς λαϊκοῖς προστάγμασιν
  choice: die für Laien geltenden Vorschriften
  rationale: Bewahrt die adjektivische Bedeutung von λαϊκοῖς und macht im Deutschen klar, dass es sich um Vorschriften für Laien handelt.
theological_decisions:
- issue: Bedeutung von τόπος im Verhältnis zum Priesteramt
  choice: Platz
  alternative: Amt / Bereich
  rationale: Das Griechische lässt offen, ob vor allem der konkrete kultische Platz, der Aufgabenbereich oder die geordnete Stellung gemeint ist. „Platz“ bewahrt diese Offenheit am ehesten.
- issue: Kirchliche oder alttestamentlich-kultische Anwendung von λαϊκός
  choice: Laie
  alternative: Mensch aus dem Volk
  rationale: Der unmittelbare Zusammenhang nennt Hohen Priester, Priester und Leviten. „Laie“ bildet den Gegensatz knapp ab, ohne eine spätere konfessionelle Amtslehre ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Parallelstruktur. Die mehrfachen Passiv- beziehungsweise Verpflichtungsformulierungen des griechischen Textes werden klar wiedergegeben; das abschließende Semikolon markiert die zugespitzte Gegenüberstellung.
