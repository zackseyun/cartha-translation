source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: de
  text: Da uns dies nun klar vor Augen steht und wir uns in die Tiefen der göttlichen Erkenntnis vertieft haben, müssen wir alles in geordneter Weise tun, was der Herr zu den festgesetzten Zeiten auszuführen geboten hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: klar vor Augen steht
  rationale: Gibt die offenkundige, deutlich erkennbare Beschaffenheit idiomatisch wieder.
- source_word: ἐγκεχυφότες
  choice: uns … vertieft haben
  rationale: Das Partizip bezeichnet ein intensives Hineinblicken bzw. Sich-Hineinbeugen; „vertieft“ bewahrt den Bildgehalt in natürlichem Deutsch.
- source_word: τὰ βάθη τῆς θείας γνώσεως
  choice: die Tiefen der göttlichen Erkenntnis
  rationale: Nahe Wiedergabe der Genitivverbindung; „Erkenntnis“ passt hier besser als bloßes Faktenwissen.
- source_word: τάξει
  choice: in geordneter Weise
  rationale: Dativ der Art und Weise; vermeidet die falsche Deutung als Zwecksatz und erhält den Gedanken ordnungsgemäßen Handelns.
- source_word: ὁ δεσπότης
  choice: der Herr
  rationale: Im religiösen Kontext eine natürliche, würdevolle Wiedergabe; der Sinn souveräner Autorität bleibt im Zusammenhang mit dem Gebot erkennbar.
- source_word: κατὰ καιροὺς τεταγμένους
  choice: zu den festgesetzten Zeiten
  rationale: Bewahrt sowohl den zeitlichen Bezug von καιρούς als auch den Gedanken verbindlicher Festsetzung in τεταγμένους.
theological_decisions:
- issue: Bezug der Ordnung und der festgesetzten Zeiten
  choice: „alles in geordneter Weise tun, was der Herr zu den festgesetzten Zeiten … geboten hat“
  alternative: „alles, was der Herr geboten hat, ordnungsgemäß zu den festgesetzten Zeiten ausführen“
  rationale: Die gewählte Wortstellung ordnet τάξει zunächst dem Tun insgesamt zu und κατὰ καιροὺς τεταγμένους dem angeordneten Vollzug, ohne die syntaktische Spannung unnötig aufzulösen.
- issue: Wiedergabe des Herrschertitels δεσπότης
  choice: „der Herr“
  alternative: „der Gebieter“
  rationale: „Herr“ ist im modernen religiösen Deutsch natürlich und würdevoll; „Gebieter“ würde die Herrschaftsnuance stärker markieren, klänge hier jedoch unnötig hart und altertümlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, wird aber flüssig formuliert. Keine Fußnote ist nötig, da „in geordneter Weise“ die Funktion von τάξει eindeutig und ohne konfessionelle Zuspitzung wiedergibt.
