  variant: modern standard German
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: de
  text: Er gebot, dass sowohl die Opfergaben dargebracht als auch die Dienste verrichtet werden und dass dies nicht willkürlich oder ungeordnet, sondern zu festgesetzten Zeiten und Stunden geschieht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφοράς
  choice: Opfergaben
  rationale: Im kultischen Zusammenhang bezeichnet προσφοράς die dargebrachten Gaben; „Opfergaben“ macht diesen Bezug im Deutschen deutlich.
- source_word: λειτουργίας
  choice: Dienste
  rationale: λειτουργίαι bezeichnet hier geordnete kultische Diensthandlungen. „Dienste“ wahrt die Breite des Ausdrucks, ohne ihn vorschnell auf einen späteren technischen Begriff wie „Liturgien“ festzulegen.
- source_word: ἐπιτελεῖσθαι
  choice: vollzogen werden
  rationale: Das Verb bezeichnet die ordnungsgemäße Ausführung bzw. Vollendung der Opfergaben und Dienste; „vollzogen werden“ passt zum kultischen Kontext und zur Passivkonstruktion.
- source_word: εἰκῇ
  choice: willkürlich
  rationale: εἰκῇ bedeutet hier ohne Plan oder feste Bestimmung. „Willkürlich“ bildet den Gegensatz zu den festgesetzten Zeiten präziser ab als „beiläufig“ oder „zufällig“.
- source_word: ἀτάκτως
  choice: ungeordnet
  rationale: Das Adverb bezeichnet ein Handeln ohne die vorgesehene Ordnung; „ungeordnet“ gibt den unmittelbaren Kontrast sachlich wieder.
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: zu festgesetzten Zeiten und Stunden
  rationale: Die Formulierung wahrt sowohl die Bestimmung durch ὡρισμένοις als auch die zweigliedrige Zeitangabe καιροῖς καὶ ὥραις.
theological_decisions:
- issue: Referent des unausgesprochenen Subjekts von ἐκέλευσεν
  choice: „Er“ ohne ausdrückliche Identifizierung
  alternative: „Gott“ oder „der Herr“
  rationale: Der griechische Satz hat lediglich die Verbform „er gebot“; eine namentliche Identifizierung wäre aus dem unmittelbaren Ausschnitt nicht eigenständig zu ergänzen.
- issue: Technischer Gehalt von λειτουργίας
  choice: allgemein „Dienste“
  alternative: „Liturgien“, „Gottesdienste“ oder „priesterliche Dienste“
  rationale: Die allgemeinere Wiedergabe bewahrt die kultische Bedeutung, ohne eine bestimmte spätere Amts- oder Liturgietheologie in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht kultischem Ton. Die koordinierte Konstruktion wurde durch „und zwar“ natürlich gegliedert; die Kontraste willkürlich/ungeordnet und festgesetzt bleiben klar erhalten.
