  source_fidelity: 'Der Entwurf trifft die Grundstruktur zuverlässig: Die Orts- und Vermittlungsbestimmung wird von Gott festgesetzt; πάντα ist Subjekt von εἴη; und ἐν εὐδοκίᾳ bleibt durch die Fußnote als syntaktisch nicht eindeutig ausgewiesen. Eine kleine Präzisierung ist bei βουλή angezeigt, das eher „Ratschluss“ als „Wille“ bedeutet.'
  naturalness: Der Eingangssatz mit „wo und durch wen er will, dass dies ausgeführt wird“ ist verständlich, aber schwerfällig. Auch die Wiederholung von „Willen“ in „durch seinen erhabenen Willen bestimmt“ verdeckt die Nuance von βουλή. Die Revision formuliert idiomatischer, ohne den gehobenen Registerton aufzugeben.
  terminology: „Höchster Ratschluss“ gibt τῇ ὑπερτάτῃ αὐτοῦ βουλήσει präziser wieder. „In heiliger Weise“ ist für ὁσίως natürlich und angemessen. „Wohlgefällig“ bewahrt für εὐπρόσδεκτα die kultisch-religiöse Akzeptanzsprache. Die Zuordnung von ἐν εὐδοκίᾳ wird weiterhin nicht dogmatisch festgelegt.
