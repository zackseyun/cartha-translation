  - severity: low
    issue: Der einleitende Satzbau ist im Deutschen unnötig umständlich.
    rationale: „Wo und durch wen er es vollzogen wissen will, das hat er selbst … bestimmt“ gibt θέλει plus Infinitiv flüssiger wieder und erhält den emphatischen Bezug von αὐτός.
