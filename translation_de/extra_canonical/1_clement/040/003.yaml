  rationale: Die Revision unterscheidet βουλή („Ratschluss“) von θελήμα („Wille“), glättet den deutschen Satzbau und bewahrt die im Griechischen mögliche unterschiedliche Zuordnung von ἐν εὐδοκίᾳ durch eine knappe Alternativübersetzung in der Fußnote.
