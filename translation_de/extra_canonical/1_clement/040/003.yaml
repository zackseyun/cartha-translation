source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: de
  text: Wo und durch wen er es vollzogen wissen will, das hat er selbst kraft seines höchsten Ratschlusses bestimmt, damit alles, was in heiliger Weise geschieht, seinem Willen nach seinem Wohlgefallen wohlgefällig sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… damit alles, was in heiliger Weise und nach seinem Wohlgefallen geschieht, seinem Willen wohlgefällig sei.“'
    reason: Die Stellung von ἐν εὐδοκίᾳ lässt sowohl einen Bezug auf γινόμενα („geschieht“) als auch auf εὐπρόσδεκτα εἴη („wohlgefällig sei“) zu.
lexical_decisions:
- source_word: ἐπιτελεῖσθαι
  choice: ausgeführt wird
  rationale: Das Passiv bezeichnet die ordnungsgemäße Ausführung der zuvor genannten Handlungen; „dies“ nimmt den Kontext auf, ohne im Deutschen ein unbestimmtes „sie“ zu erzwingen.
- source_word: τῇ ὑπερτάτῃ αὐτοῦ βουλήσει
  choice: durch seinen erhabenen Willen
  rationale: Der Dativ wird instrumental verstanden. „Erhaben“ gibt ὑπερτάτῃ würdig und idiomatisch wieder, ohne den Sinn zu übersteigern.
- source_word: ὁσίως
  choice: in Heiligkeit
  rationale: Bewahrt den religiös-ethischen Gehalt des Adverbs und den würdigen Ton.
- source_word: ἐν εὐδοκήσει
  choice: nach seinem Wohlgefallen
  rationale: Gibt die schwer eindeutig zuzuordnende Wendung natürlich wieder und verbindet sie primär mit der Annahme durch Gottes Willen.
- source_word: εὐπρόσδεκτα
  choice: wohlgefällig
  rationale: Bezeichnet das, was günstig aufgenommen beziehungsweise angenommen wird; im Deutschen passt „wohlgefällig“ zum Bezug auf Gottes Willen.
theological_decisions:
- issue: Bezug von ἐν εὐδοκήσει
  choice: „nach seinem Wohlgefallen“ wird an „wohlgefällig sei“ angeschlossen
  alternative: 'Die Wendung kann mit γινόμενα verbunden werden: „wenn alles in Heiligkeit und nach seinem Wohlgefallen geschieht“'
  rationale: Die Wortstellung erlaubt verschiedene Akzentsetzungen. Der Haupttext folgt der zuletzt geprüften Lesart, während die Fußnote die echte syntaktische Mehrdeutigkeit bewahrt.
- issue: Subjekt von εἴη
  choice: πάντα („alles“) ist das Subjekt
  alternative: Ein ergänztes „sie“ mit πάντα γινόμενα als absoluter Fügung
  rationale: Das neutrale Plural πάντα kann regelgerecht mit dem singularischen εἴη stehen und ergibt die unmittelbarere Syntax.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „dies“ und einen konditionalen Nebensatz natürlich lesbar gemacht.
