  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: de
  text: 'Und der Herr sagte zu ihm: „Ich habe einmal und zweimal zu dir gesprochen und gesagt: ‚Ich habe dieses Volk gesehen, und sieh: Es ist halsstarrig. Lass mich sie vernichten; ich werde ihren Namen unter dem Himmel auslöschen und dich zu einem großen, bewundernswerten Volk machen, das viel größer ist als dieses.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκληροτράχηλος
  choice: halsstarrig
  rationale: Die traditionelle, bildhafte Wiedergabe bewahrt die Metapher des griechischen Ausdrucks und ist im modernen Deutschen weiterhin verständlich.
- source_word: ἔασόν με
  choice: Lass mich
  rationale: Gibt die direkte Aufforderung knapp und ohne erklärenden Zusatz wieder.
- source_word: ἐξολεθρεῦσαι
  choice: vernichten
  rationale: Entspricht der starken Bedeutung des Verbs, ohne einen im Kontext nicht ausdrücklich vorhandenen Verstärker hinzuzufügen.
- source_word: ἐξαλείψω
  choice: auslöschen
  rationale: Bewahrt das Bild des Tilgens eines Namens.
- source_word: θαυμαστόν
  choice: bewundernswert
  rationale: Gibt den positiven Sinn von θαυμαστός als staunenswert bzw. bewundernswert wieder, ohne die Aussage zu überhöhen.
- source_word: πολὺ μᾶλλον ἢ τοῦτο
  choice: größer als dieses
  rationale: Im Zusammenhang mit ἔθνος wird die Vergleichsaussage idiomatisch wiedergegeben; auf einen zusätzlichen Verstärker wie „weit“ wird verzichtet.
theological_decisions:
- issue: Gottes Aufforderung, ihn das Volk vernichten zu lassen
  choice: Lass mich sie vernichten
  alternative: Halte mich nicht davon ab, sie zu vernichten
  rationale: Die knappe Form wahrt die Spannung und anthropomorphe Ausdrucksweise des Textes, ohne sie theologisch auszudeuten.
- issue: Bezeichnung der verheißenen Größe
  choice: zu einem großen, bewundernswerten Volk
  alternative: zu einem großen und wunderbaren Volk
  rationale: „Bewundernswert“ vermeidet, θαυμαστόν vorschnell als übernatürliches „wunderbar“ zu deuten, und erhält zugleich die positive Wertung.
translation_notes:
  register: Natürliche, würdige Standardsprache mit bewahrter biblischer Bildsprache. Die verschachtelte direkte Rede des griechischen Textes wird durch deutsche Anführungszeichen klar kenntlich gemacht; es sind keine Fußnoten erforderlich.
