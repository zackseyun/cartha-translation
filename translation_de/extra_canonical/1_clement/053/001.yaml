  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: de
  text: Denn ihr kennt die heiligen Schriften, ja, ihr kennt sie gut, Geliebte, und ihr habt euch eingehend mit den Aussprüchen Gottes[a] befasst. Darum schreiben wir euch dies alles zur Erinnerung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und ihr habt euch in die Aussprüche Gottes hineingebeugt«; gemeint ist das sorgfältige Studium.'
    reason: Bewahrt das anschauliche Grundbild von ἐγκύπτω mit εἰς und erläutert seine übertragene Bedeutung im Kontext.
lexical_decisions:
- source_word: Ἐπίστασθε ... καὶ καλῶς ἐπίστασθε
  choice: ihr kennt ... ja, ihr kennt sie gut
  rationale: Gibt die emphatische Wiederholung natürlich und deutlich wieder.
- source_word: τὰς ἱερὰς γραφάς
  choice: die heiligen Schriften
  rationale: Entspricht der üblichen und kontextgerechten Bezeichnung für die als heilig anerkannten Schriften.
- source_word: ἐγκεκύφατε εἰς
  choice: ihr habt euch eingehend mit ... befasst
  rationale: Das wörtliche Bild des Sich-Hineinbeugens bezeichnet hier das genaue, intensive Studium eines Textes; die Formulierung klingt im modernen Deutschen natürlich.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: die Aussprüche Gottes
  rationale: Bewahrt den Sinn autoritativer göttlicher Äußerungen; »Aussprüche« ist verständlicher und weniger missverständlich als »Orakel«.
- source_word: πρὸς ἀνάμνησιν
  choice: um euch daran zu erinnern
  rationale: Gibt die Zweckangabe idiomatisch wieder, ohne festzulegen, ob nur Erinnerung oder auch erneute Vergegenwärtigung gemeint ist.
theological_decisions:
- issue: Verhältnis von »heiligen Schriften« und »Aussprüchen Gottes«
  choice: Beide Bezeichnungen bleiben nebeneinander bestehen.
  alternative: Beide Ausdrücke durch »Heilige Schrift« vereinheitlichen.
  rationale: Der griechische Text verwendet zwei unterschiedliche Wendungen; ihre Gleichsetzung oder genaue Abgrenzung sollte nicht stillschweigend entschieden werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede »Geliebte« wahrt den frühchristlichen Briefstil. Die Wiederholung von »ihr kennt« erhält die Betonung des griechischen Textes.
