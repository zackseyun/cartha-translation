revisions:
- from: Denn ihr kennt die heiligen Schriften, ja, ihr kennt sie gut, Geliebte, und ihr habt euch eingehend mit den Aussprüchen Gottes[a] befasst. Darum schreiben wir dies, um euch daran zu erinnern.
  to: Denn ihr kennt die heiligen Schriften, ja, ihr kennt sie gut, Geliebte, und ihr habt euch eingehend mit den Aussprüchen Gottes[a] befasst. Darum schreiben wir euch dies alles zur Erinnerung.
  rationale: Die Revision beschränkt sich auf den abschließenden Zweckausdruck und die Präzisierung der Fußnote. Sie erhält die vorhandenen sachgerechten Entscheidungen zu Anrede, Wiederholung, Schriftbezeichnung und λόγια bei, gibt ταῦτα sowie πρὸς ἀνάμνησιν aber enger und ohne zusätzliche Ausdeutung wieder.
