base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: de
  text: 'Denn als Mose auf den Berg hinaufgestiegen war und vierzig Tage und vierzig Nächte mit Fasten und Selbsterniedrigung verbracht hatte, sagte Gott zu ihm: »Mose, Mose, steig schnell von hier hinab! Denn dein Volk, das du aus dem Land Ägypten herausgeführt hast, hat gesetzlos gehandelt. Schnell sind sie von dem Weg abgewichen, den ich ihnen geboten hatte; sie haben sich gegossene Bilder gemacht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσαντος τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας
  choice: vierzig Tage und vierzig Nächte … verbracht hatte
  rationale: Das griechische ποιεῖν mit einer Zeitangabe bedeutet idiomatisch, eine Zeitspanne zu verbringen; die deutsche Formulierung gibt dies natürlich und vollständig wieder.
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: mit Fasten und Selbsterniedrigung
  rationale: ταπείνωσις bezeichnet hier eine bewusst vollzogene Erniedrigung bzw. Demütigung im Zusammenhang mit dem Fasten. „Selbsterniedrigung“ wahrt den asketischen Sinn, ohne das Wort bloß als innere Demut umzudeuten.
- source_word: ἠνόμησεν
  choice: hat gesetzlos gehandelt
  rationale: Die Wiedergabe bewahrt den Bezug auf νόμος und vermeidet eine vorschnelle Verengung auf eine einzelne konkrete Übertretung.
- source_word: παρεβήσαν … ἐκ τῆς ὁδοῦ
  choice: sind … von dem Weg abgewichen
  rationale: Die räumliche Metapher des griechischen Textes wird im natürlichen Deutschen beibehalten.
- source_word: χωνευτά
  choice: Gussbilder
  rationale: Das substantivierte Adjektiv bezeichnet gegossene Gegenstände bzw. Bilder. „Gussbilder“ bleibt nahe am Wortlaut und ergänzt nicht ausdrücklich „Götzen“, obwohl der Kontext sie als solche erkennen lässt.
theological_decisions:
- issue: Art der Verfehlung Israels
  choice: hat gesetzlos gehandelt
  alternative: hat gesündigt / hat das Gesetz übertreten
  rationale: Der Wortlaut ἠνόμησεν wird formal erkennbar wiedergegeben; weder die allgemeinere Kategorie „Sünde“ noch eine stärker juristisch konkretisierte Formulierung wird an seine Stelle gesetzt.
- issue: Bezeichnung der gegossenen Kultgegenstände
  choice: Gussbilder
  alternative: Götzenbilder / gegossene Götter
  rationale: Der griechische Text sagt lediglich χωνευτά. Die negative kultische Bewertung ist im Zusammenhang eindeutig, soll aber nicht durch eine im Ausdruck selbst fehlende Präzisierung in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die direkte Rede verwendet ein natürliches, nachdrückliches Imperativdeutsch; biblische Bildsprache und die wiederholte Anrede „Mose, Mose“ bleiben erhalten.
