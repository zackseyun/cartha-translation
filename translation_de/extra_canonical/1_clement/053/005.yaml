  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: de
  text: O, welch große Liebe! O, welch unübertreffliche Vollkommenheit! Ein Diener spricht freimütig zu seinem Herrn, bittet für die Menge um Vergebung und bittet sogar darum, mit ihnen ausgelöscht zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ μεγάλης ἀγάπης
  choice: O welch große Liebe!
  rationale: Die ausrufende Genitivkonstruktion drückt staunende Bewunderung aus; die deutsche Wiedergabe bewahrt Ausruf und Würde natürlich.
- source_word: τελειότητος ἀνυπερβλήτου
  choice: unübertreffliche Vollkommenheit
  rationale: τελειότης bezeichnet hier sittliche Vollkommenheit bzw. vollendete Haltung; ἀνυπέρβλητος bedeutet unübertrefflich.
- source_word: παρρησιάζεται
  choice: spricht freimütig
  rationale: Das Verb bezeichnet offenes, unerschrockenes Reden; „freimütig“ wahrt sowohl Mut als auch Offenheit, ohne Respektlosigkeit anzudeuten.
- source_word: θεράπων
  choice: Diener
  rationale: θεράπων bezeichnet einen persönlichen Diener und wird im Kontext auf Mose bezogen; „Diener“ ist verständlich und würdevoll.
- source_word: τῷ πλήθει
  choice: für das ganze Volk
  rationale: Wörtlich „für die Menge“; im unmittelbaren Kontext ist die Gemeinschaft Israels gemeint. „Das ganze Volk“ gibt den Referenten natürlich wieder.
- source_word: ἀξιοῖ
  choice: verlangt
  rationale: Das Verb kann „fordern“, „beanspruchen“ oder „für angemessen halten“ bedeuten. Hier bezeichnet es Moses kühne Bitte, selbst mit ausgelöscht zu werden; „verlangt“ erhält deren Nachdruck.
theological_decisions:
- issue: Moses Fürbitte und sein angebotenes Mit-Ausgelöschtwerden
  choice: „verlangt sogar, zusammen mit ihnen ausgelöscht zu werden“
  alternative: „hält es sogar für angemessen, zusammen mit ihnen ausgelöscht zu werden“
  rationale: Der Satz beschreibt die Kühnheit und Selbsthingabe des Mose, ohne zu erklären, wie ein solches Auslöschen theologisch zu verstehen ist. Die Spannung des Textes bleibt bestehen.
- issue: Anredeverhältnis zwischen Mose und Gott
  choice: „Ein Diener … zu seinem Herrn“
  alternative: „Der Diener … zum Herrn“
  rationale: Die anarthrischen griechischen Substantive stellen das Verhältnis typologisch heraus. Die unbestimmte Form bildet dies im Deutschen angemessen ab, ohne Mose oder Gott unkenntlich zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Ausrufe und der gesteigerte Schluss bewahren die rhetorische Kraft des griechischen Textes.
