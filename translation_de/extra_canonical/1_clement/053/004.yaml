  text: And Moses said, "If you will forgive their sin, forgive; but if not, blot me also out of the book of the living."
translation:
  language: de
  text: 'Und Mose sagte: »Auf keinen Fall, Herr! Vergib diesem Volk seine Sünde; andernfalls tilge auch mich aus dem Buch der Lebenden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Auf keinen Fall
  rationale: Gibt die nachdrückliche Zurückweisung natürlich und mit der Stärke des griechischen Ausdrucks wieder.
- source_word: ἄφες
  choice: Vergib
  rationale: Der Imperativ bezeichnet hier den Erlass beziehungsweise die Vergebung der Sünde.
- source_word: ἐξάλειψόν
  choice: tilge ... aus
  rationale: Bewahrt das Bild des Auslöschens eines Namens aus einem Buch.
- source_word: βίβλου ζώντων
  choice: Buch der Lebenden
  rationale: Formale und im Deutschen verständliche Wiedergabe der Genitivverbindung.
theological_decisions:
- issue: Verhältnis zum alttestamentlichen Wortlaut und zur englischen Revisionsfassung
  choice: Den in 1 Clemens tatsächlich überlieferten Wortlaut mit Μηδαμῶς, κύριε und der Alternative ἢ κἂν wiedergeben
  alternative: Eine konditionale Ergänzung wie »Wenn du ihre Sünde vergeben willst ... wenn aber nicht«
  rationale: Der griechische Text von 1 Clemens 53,4 enthält ausdrücklich »Auf keinen Fall, Herr« und formuliert danach »vergib ... oder andernfalls«. Die konditionale Fassung der englischen Konsultationsschicht entspricht nicht dem hier vorgelegten griechischen Quelltext und wird daher nicht übernommen.
- issue: Moses’ Einschluss in das Gericht
  choice: »auch mich«
  alternative: »mich« ohne »auch«
  rationale: 'κἂν trägt hier einschließende beziehungsweise steigernde Bedeutung: notfalls soll Mose ebenfalls getilgt werden.'
translation_notes:
  register: Dign187, klarer moderner Standard. Die direkte Rede bleibt feierlich, ohne archaische Formen. »Tilgen« wird wegen des konkreten Buchbildes beibehalten.
