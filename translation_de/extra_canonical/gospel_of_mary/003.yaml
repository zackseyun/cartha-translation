  - severity: medium
    issue: Im letzten fragmentarischen Satz ist die Wiederherstellungsstruktur von „is [what] sees ... [and] it [that …]“ nicht vollständig erhalten.
    rationale: Die Fassung glättet die ergänzte Satzstruktur und lässt insbesondere die Markierung der Ergänzung zu „[what]“ verschwinden. Eine vorsichtige deutsche Konstruktion kann die Klammern und den Abbruch genauer bewahren.
