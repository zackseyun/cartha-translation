translation:
  language: de
  text: 'Dann stand Maria auf und begrüßte sie alle. Sie sagte zu ihren Brüdern und Schwestern[a]: „Weint nicht, trauert nicht und seid nicht innerlich gespalten; denn seine Gnade wird mit euch allen sein und euch beschützen. Lasst uns vielmehr seine Größe preisen, denn er hat uns vorbereitet und zu Menschen gemacht.“[b]


    Als Maria dies gesagt hatte, wandte sie ihre Herzen dem Guten zu, und sie begannen, über die Worte des [Retters] zu sprechen.[c]


    Petrus sagte zu Maria: „Schwester, wir wissen, dass der Retter dich mehr liebte als alle anderen Frauen. Sag uns die Worte des Retters, an die du dich erinnerst – das, was du weißt, wir aber nicht wissen und auch nicht gehört haben.“


    Maria antwortete: „Ich werde euch sagen, was euch verborgen ist.“ Dann begann sie, ihnen Folgendes zu erzählen: „Ich“, sagte sie, „sah den Herrn in einer Vision und sagte zu ihm: ‚Herr, heute sah ich dich in einer Vision.‘


    Er antwortete mir: ‚Glücklich bist du, weil du bei meinem Anblick nicht ins Wanken geraten bist. Denn wo der Verstand ist, dort ist der Schatz.‘[d]


    Ich sagte zu ihm: ‚Herr, sieht nun jemand, der eine Vision hat, sie in der Seele oder im Geist?‘


    Der Retter antwortete: ‚Man sieht weder in der Seele noch im Geist; vielmehr ist es der Verstand, der zwischen beiden [besteht], der die Vision sieht, [und] er [ist es, der …]“[e]


    [Die Seiten 11 bis 14 fehlen.][f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im zugrunde liegenden englischen Zeugen: „Brüdern (und Schwestern)“. Die ausdrückliche Nennung der Schwestern ist dort als Ergänzung gekennzeichnet.'
    reason: Die Ergänzung muss wegen der ausstehenden direkten Prüfung des Koptischen/Griechischen transparent bleiben.
  - marker: b
    text: 'Oder näher an der Form des Zeugen: „Er hat uns zu Menschen gemacht.“ Die genaue Tragweite dieser Aussage bleibt offen.'
    reason: Verhindert eine nicht belegte anthropologische oder soteriologische Ausdeutung.
  - marker: c
    text: „dem Guten“, „begannen“ und „Retters“ beruhen im zugrunde liegenden Zeugen auf ergänztem beziehungsweise wiederhergestelltem Text.
    reason: Die eckigen Klammern der Vorlage werden erklärt, ohne den Lesefluss übermäßig zu belasten.
  - marker: d
    text: „Verstand“ gibt hier einen Ausdruck wieder, der von „Seele“ und „Geist“ unterschieden wird. Auch „Geist“, „Sinn“ oder „Bewusstsein“ wären je nach quellensprachlichem Befund erwägenswert.
    reason: Die lexikalische und anthropologische Mehrdeutigkeit ist bei ausstehender Quellenprüfung wesentlich.
  - marker: e
    text: Der Satz bricht wegen einer Handschriftenlücke ab. Die eckigen Klammern kennzeichnen ergänzte oder unsichere Bestandteile des zugrunde liegenden Zeugen.
    reason: Der fragmentarische Zustand darf nicht durch eine rekonstruierte Fortsetzung verdeckt werden.
  - marker: f
    text: Im Papyrus Berolinensis 8502,1 fehlen an dieser Stelle die Seiten 11 bis 14.
    reason: Dokumentiert den materiellen Grund für den Textabbruch.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: Brüdern und Schwestern
  rationale: Die inklusive Personengruppe wird im Deutschen ausdrücklich wiedergegeben; die Ergänzung bleibt wegen der nur indirekten Quellenlage in einer Fußnote kenntlich.
- source_word: let your hearts be divided
  choice: seid nicht innerlich gespalten
  rationale: Natürliches modernes Deutsch, das das Bild des geteilten Herzens und die innere Zerrissenheit bewahrt.
- source_word: Humans
  choice: Menschen
  rationale: Die auffällige Aussage über das Menschwerden wird nicht zu „wahren Menschen“ oder einer konfessionell geprägten Deutung erweitert.
- source_word: the Good
  choice: dem Guten
  rationale: Die substantivierte und möglicherweise technische Bezeichnung bleibt durch Großschreibung erkennbar.
- source_word: mind
  choice: Verstand
  rationale: Unterscheidet den Ausdruck von „Seele“ und „Geist“, ohne ihn spekulativ als Vernunft, Bewusstsein oder göttlichen Geist festzulegen.
- source_word: vision
  choice: Vision
  rationale: Bewahrt den visionären Charakter und vermeidet die engeren oder altertümlicheren Ausdrücke „Traumgesicht“ und „Schau“.
- source_word: Savior
  choice: Retter
  rationale: Klare, würdige moderne Wiedergabe ohne unnötige kirchensprachliche Verengung.
theological_decisions:
- issue: Bedeutung von „zu Menschen gemacht“
  choice: Wörtlich-offene Wiedergabe
  alternative: „zu wahren/vollkommenen Menschen gemacht“
  rationale: Der überlieferte englische Zeuge enthält keine ausdrücklichen Adjektive; eine anthropologische oder soteriologische Deutung wird daher nicht ergänzt.
- issue: Verhältnis von Seele, Geist und Verstand
  choice: Die Dreigliederung und die Stellung des Verstandes „zwischen beiden“ bleiben erhalten
  alternative: Den Verstand mit Seele, Geist oder Bewusstsein gleichsetzen
  rationale: Die theologische und anthropologische Spannung des Textes darf nicht harmonisiert werden.
- issue: „Wo der Verstand ist, dort ist der Schatz“
  choice: Satzfolge und Zuordnung werden unverändert bewahrt
  alternative: An bekannte kanonische Schatz-Herz-Formulierungen angleichen
  rationale: Eine Harmonisierung würde die eigenständige Aussage dieses Zeugnisses beseitigen.
- issue: Geschlecht der angesprochenen Gruppe
  choice: „Brüdern und Schwestern“ mit textkritischem Hinweis
  alternative: Nur „Brüdern“
  rationale: Der gelieferte Zeuge signalisiert die inklusive Ergänzung ausdrücklich; sie wird lesbar aufgenommen, aber nicht als zweifelsfrei quellensprachlich ausgegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Die Fassung ist ausdrücklich vorläufig, da nur der bereitgestellte gemeinfreie englische Zeuge ausgewertet werden konnte und die direkte Prüfung des koptischen Textes sowie der griechischen Fragmente noch aussteht. Ergänzungen, Unsicherheiten und die große Handschriftenlücke werden sichtbar gehalten.
