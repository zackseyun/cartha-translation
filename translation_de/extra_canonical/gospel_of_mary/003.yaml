  naturalness: Das Deutsch ist überwiegend modern, würdig und gut lesbar. „über die Worte ... zu debattieren“ bildet das englische „debate“ präziser ab als „über ... zu sprechen“.
  terminology: „Retter“, „Vision“, „Verstand“, „Seele“ und „Geist“ sind als vorläufige, offene Entsprechungen vertretbar. Die auffällige Aussage „zu Menschen gemacht“ bleibt angemessen undehnend wiedergegeben.
