    reason: Die deutsche Ergänzung »niemanden« macht den Satz grammatisch lesbar, ohne einen bestimmten Gegenstand des Bindens festzulegen.
  - marker: c
    text: »Erde« und »Himmel« stehen im zugrunde liegenden Zeugen in eckigen Klammern und gelten daher als Ergänzungen.
    reason: Kennzeichnet textkritische Unsicherheit.
  - marker: d
    text: »Überwinderin des Raumes« ist eine bewusst wörtliche Wiedergabe einer ungewöhnlichen und möglicherweise kosmologisch gemeinten Bezeichnung.
    reason: Warnt davor, die schwer verständliche Wendung vorschnell zu glätten.
  - marker: e
    text: 'Der Satzbau ist unsicher. Möglich ist auch eine stärker formale Wiedergabe: »in einem Typus aus einem Typus, der oben ist«.'
    reason: Bewahrt die Mehrdeutigkeit der Verhältnisbestimmung zwischen den beiden »Abbildern«.
  - marker: f
    text: Die Folge »Zeit, Zeitpunkt und Äon« gibt eine schwer deutbare Häufung von Zeitbegriffen wieder. Auch eine Übersetzung wie »die übrige Zeit der bestimmten Stunde des Äons« ist möglich.
    reason: Vermeidet eine scheinbar eindeutige eschatologische Deutung eines unsicheren Satzes.
lexical_decisions:
- source_word: Desire
  choice: Begierde
  rationale: Bezeichnet hier eine personifizierte Macht; »Begierde« bewahrt sowohl den begehrenden Impuls als auch den negativen kosmologischen Zusammenhang.
- source_word: power
  choice: Macht
  rationale: »Macht« eignet sich für die personifizierten widerstrebenden Gewalten und vermeidet die ausschließlich politische Färbung von »Herrschaft«.
- source_word: Ignorance
  choice: Unwissenheit
  rationale: Gibt einen Zustand fehlender Erkenntnis wieder und lässt den im Text wichtigen Gegensatz zu »erkennen« deutlich hervortreten.
- source_word: Zeal for Death
  choice: Todesstreben
  rationale: Eine knappe, natürliche Wiedergabe; sie bewahrt die Ausrichtung auf den Tod, ohne die semantisch unsichere Nuance vorschnell als »Eifer« oder »Eifersucht« festzulegen.
- source_word: Kingdom of the Flesh
  choice: Reich des Fleisches
  rationale: Bewahrt die Herrschaftsmetaphorik und den in religiösen Texten üblichen, aber nicht konfessionell verengten Ausdruck »Fleisch«.
- source_word: Wrath
  choice: Zorn
  rationale: Bewahrt die Personifikation beziehungsweise Sammelbezeichnung der sieben Mächte.
- source_word: conqueror of space
  choice: Überwinderin des Raumes
  rationale: Folgt der ungewöhnlichen räumlichen Bildsprache des Zeugen, statt sie zu einer bestimmten kosmologischen Lehre auszudeuten.
- source_word: type
  choice: Abbild
  rationale: »Abbild« ist im Deutschen verständlicher als »Typus«, lässt aber weiterhin eine Beziehung zwischen irdischer und höherer Gestalt offen.
- source_word: age
  choice: Äon
  rationale: Der Text verwendet eine kosmologisch und zeitlich aufgeladene Begrifflichkeit; »Äon« erhält diese Mehrdeutigkeit besser als bloß »Zeitalter«.
theological_decisions:
- issue: Verhältnis der Seele zu Begierde und Leiblichkeit
  choice: Die Bildsprache von Zugehörigkeit, Gewand und Befreiung wird ohne erklärende Zusätze beibehalten.
  alternative: Die Aussagen ausdrücklich als Trennung einer göttlichen Seele vom materiellen Leib deuten.
  rationale: Der Abschnitt legt eine solche kosmologische Lesart nahe, bestimmt sie aber nicht vollständig; eine dogmatische Festlegung würde die Spannung des Textes auflösen.
- issue: Auflösung von Erde und Himmel
  choice: Die umfassende Aussage »alles wird sich auflösen« bleibt stehen.
  alternative: Die Aussage auf vergängliche oder böse Bestandteile der Welt einschränken.
  rationale: Der überlieferte Wortlaut nennt Erde und Himmel umfassend; eine Einschränkung wäre interpretierende Harmonisierung.
- issue: Urteil und Gebundensein
  choice: Der paradoxe Dialog über Richten und Gebundensein wird formal bewahrt.
  alternative: Das Argument glätten und als moralische Rechtfertigung der Seele paraphrasieren.
  rationale: Die knappen Wiederholungen tragen die rhetorische und theologische Spannung und sollen nicht stillschweigend erklärt werden.
- issue: Eschatologische Ruhe
  choice: »Ruhe« wird als mehrdeutiger Zielzustand wiedergegeben.
  alternative: Sie ausdrücklich als ewige Erlösung, Tod oder Sabbatruhe bezeichnen.
  rationale: Der Text benennt den Zustand nicht genauer; die Übersetzung soll keine konfessionelle Deutung importieren.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer direkter Rede und bewahrten Wiederholungen. Personifizierte Mächte und ihre Namen werden großgeschrieben. Weibliche Anreden entsprechen dem grammatischen Geschlecht von »Seele«. Die Fassung ist ausdrücklich vorläufig: Da keine koptische oder griechische Transkription vorgelegt wurde und die direkte Prüfung der antiken Sprachzeugen noch aussteht, beruht sie auf dem angegebenen gemeinfreien englischen Übersetzungszeugen; dessen eckige Klammern und erkennbare Unsicherheiten wurden nicht verdeckt.'
