  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: de
  text: 'Die Begierde sagte: »Ich sah dich nicht hinabsteigen; jetzt aber sehe ich dich hinaufsteigen. Warum lügst du also, da du doch zu mir gehörst?«


    Die Seele antwortete: »Ich sah dich; du aber hast mich weder gesehen noch erkannt. Für dich war ich nur wie ein Gewand, und du hast mich nicht erkannt.« Nachdem sie dies gesagt hatte, zog sie weiter und freute sich sehr.


    Wiederum kam sie zur dritten Macht, die »Unwissenheit« genannt wird. [Sie] verhörte die Seele und [sagte]: »Wohin gehst du? Du bist in Bosheit gebunden. Da du gebunden bist, richte nicht!«[a]


    [Und] die Seele sagte: »Warum richtest du mich, obwohl ich nicht gerichtet habe? Ich war gebunden, obwohl ich niemanden gebunden habe.[b] Sie haben mich nicht erkannt; ich aber habe erkannt, dass sich alles auflösen wird – sowohl das, was auf der [Erde] ist, als auch das, was im [Himmel] ist.[c]«


    Nachdem die Seele die dritte Macht überwunden hatte, stieg sie hinauf und sah die vierte Macht, die sieben Gestalten annahm:


    Die erste Gestalt ist Finsternis;

    die zweite Begierde;

    die dritte Unwissenheit;

    die vierte Todesstreben;

    die fünfte das Reich des Fleisches;

    die sechste die törichte »Weisheit« des Fleisches;

    die siebte die »Weisheit« des Zorns.


    Dies sind die sieben Mächte des Zorns.


    Sie fragen die Seele: »Woher kommst du, du Mörderin, und wohin gehst du, du Überwinderin des Raumes?«[d]


    Die Seele antwortete: »Was mich bindet, ist getötet worden; was mich umgibt, ist überwunden worden. Meine Begierde ist vergangen, und die Unwissenheit ist gestorben. In einer [Welt] wurde ich aus einer Welt befreit, [und] in einem Abbild aus einem Abbild, das droben ist,[e] und aus der Fessel des Vergessens, die nur für eine Zeit besteht. Von nun an werde ich in Schweigen die Ruhe der Zeit, des Zeitpunkts und des Äons empfangen.«[f]


    Nachdem Maria dies gesagt hatte, schwieg sie, denn bis zu diesem Punkt hatte der Retter mit ihr gesprochen.'
  philosophy: optimal-equivalence
