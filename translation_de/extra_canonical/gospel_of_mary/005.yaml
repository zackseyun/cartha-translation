  verdict: revise
  source_fidelity: Die Fassung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die rhetorischen Fragen, den Konflikt um Marias Autorität, die Rang-/Liebesaussage sowie die eckig markierte Textergänzung. Da kein koptischer oder griechischer Wortlaut mit Variantenapparat vorliegt, bleibt die unmittelbare quellensprachliche Kontrolle insbesondere bei „andersartige Vorstellungen“ und „vollkommene Menschlichkeit“ vorläufig.
  naturalness: Weitgehend modernes, würdiges Standarddeutsch. „im Blick auf den Retter“ wirkt in dieser Einleitung unnötig abstrakt, und „mit dieser Frau streitest wie die Widersacher“ kann fälschlich besagen, Petrus streite in derselben Weise wie die Widersacher. Die Revision stellt klarer heraus, dass er die Frau so behandelt, wie man Widersacher behandelt.
  terminology: „Retter“, „Evangelium“, „Widersacher“ und die bewusst nicht dogmatisch präzisierte Wendung „vollkommene Menschlichkeit“ sind konsistent. Die Großschreibung von „Menschlichkeit“ wird als möglicher technischer Ausdruck beibehalten und in der Anmerkung abgesichert.
