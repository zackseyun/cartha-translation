  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: de
  text: 'Andreas erwiderte den Brüdern und Schwestern: „Sagt über das, was sie gesagt hat, was ihr wollt. Ich jedenfalls glaube nicht, dass der Retter diese Dinge gesagt hat; denn diese Lehren scheinen andersartige Vorstellungen zu sein.“[a]


    Petrus äußerte daraufhin dieselben Bedenken. Er fragte sie im Blick auf den Retter: „Er hat doch nicht etwa ohne unser Wissen mit einer Frau gesprochen und nicht offen mit uns? Sollen wir uns nun umwenden und alle auf sie hören? Hat er sie uns vorgezogen?“


    Da weinte Maria und sagte zu Petrus: „Mein Bruder Petrus, was denkst du? Glaubst du wirklich, ich hätte mir das selbst in meinem Herzen ausgedacht oder würde über den Retter lügen?“


    Levi erwiderte Petrus: „Petrus, du bist schon immer zornig gewesen. Jetzt sehe ich, wie du mit dieser Frau streitest wie die Widersacher. Wenn aber der Retter sie für würdig erachtet hat, wer bist dann du, dass du sie zurückweist? Gewiss kennt der Retter sie sehr gut. Deshalb liebte er sie mehr als uns.


    Vielmehr sollten wir uns schämen, uns mit der vollkommenen Menschlichkeit bekleiden,[b] sie für uns erwerben, wie er uns angewiesen hat, und das Evangelium verkünden. Dabei sollen wir keine andere Vorschrift und kein anderes Gesetz aufstellen als das, was der Retter gesagt hat.“


    Als [Levi dies gesagt hatte],[c] machten sie sich auf, um zu lehren und zu verkünden.


    Das Evangelium


    nach


    Maria'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die genaue Nuance von „andersartige Vorstellungen“ ist vorläufig; möglich ist auch: „fremdartige Gedanken“ oder „abweichende Auffassungen“.'
    reason: Die direkte Prüfung des koptischen beziehungsweise griechischen Wortlauts steht noch aus, und das englische Zeugnis lässt die Art der behaupteten Verschiedenheit offen.
  - marker: b
    text: 'Wörtlich nach dem zugrunde gelegten englischen Zeugnis: „uns mit vollkommener Menschlichkeit bekleiden“. Der Ausdruck kann begrifflich oder technisch geprägt sein; die genaue Form ist anhand des koptisch-griechischen Befunds zu prüfen.'
    reason: Die ungewöhnliche Verbindung von Bekleiden und Menschlichkeit soll nicht vorschnell normalisiert oder dogmatisch bestimmt werden.
  - marker: c
    text: Die eckigen Klammern kennzeichnen eine Ergänzung beziehungsweise Wiederherstellung im überlieferten Text.
    reason: Das Restaurationssignal des zugrunde gelegten Zeugnisses muss sichtbar erhalten bleiben.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: Brüdern und Schwestern
  rationale: Die inklusive Wiedergabe folgt dem ausdrücklich markierten Sinn des englischen Zeugnisses und klingt im modernen Deutsch natürlich.
- source_word: Savior
  choice: Retter
  rationale: „Retter“ ist eine klare, traditionsfähige und zugleich allgemein verständliche Wiedergabe des christologischen Titels.
- source_word: different ideas
  choice: andersartige Vorstellungen
  rationale: Die Formulierung bewahrt Andreas’ distanzierende, aber semantisch unscharfe Beurteilung, ohne sie als Häresie oder Widerspruch zu präzisieren.
- source_word: made her worthy
  choice: sie für würdig erachtet hat
  rationale: Die Wendung wahrt die Aussage, dass ihre Anerkennung vom Retter ausgeht, ohne eine bestimmte Lehre über Verdienst oder Einsetzung einzutragen.
- source_word: perfect Humanity
  choice: vollkommene Menschlichkeit
  rationale: Die Großschreibung des englischen Zeugnisses kann auf einen begrifflich aufgeladenen Ausdruck weisen; „Menschlichkeit“ bewahrt dessen Abstraktheit besser als „Menschsein“ oder „Mensch“.
- source_word: acquire it for ourselves
  choice: sie für uns erwerben
  rationale: Die eigenartige Erwerbsmetaphorik wird bewusst beibehalten und nicht als bloßes Anziehen, Aneignen oder Verwirklichen geglättet.
- source_word: gospel
  choice: Evangelium
  rationale: Der etablierte deutsche Begriff passt sowohl zur verkündigten Botschaft als auch zur abschließenden Werkbezeichnung.
- source_word: adversaries
  choice: Widersacher
  rationale: Der Plural und die polemische Vergleichsrichtung bleiben erhalten, ohne „Feinde“ oder eine spezifisch dämonologische Deutung festzulegen.
theological_decisions:
- issue: Petrus’ Frage nach einer privaten Offenbarung an Maria
  choice: Die rhetorische und skeptische Frageform bleibt erhalten.
  alternative: Als kategorische Bestreitung oder als bestätigte geheime Offenbarung formulieren.
  rationale: Der Abschnitt inszeniert einen Autoritätskonflikt; er entscheidet nicht ausdrücklich, wie Petrus’ Voraussetzungen historisch zu bewerten sind.
- issue: Bevorzugung und Liebe Marias
  choice: „Deshalb liebte er sie mehr als uns“ wird unmittelbar wiedergegeben.
  alternative: „Deshalb schätzte er sie höher“ oder „vertraute ihr mehr“ verwenden.
  rationale: Eine Abschwächung würde die Spannung des Textes und die behauptete besondere Beziehung zwischen dem Retter und Maria verdecken.
- issue: „vollkommene Menschlichkeit“ als möglicher technischer Begriff
  choice: Der Ausdruck bleibt abstrakt und wird durch eine Fußnote als vorläufig gekennzeichnet.
  alternative: „den vollkommenen Menschen“, „das vollkommene Menschsein“ oder eine christologische Deutung einsetzen.
  rationale: Ohne abgeschlossene koptisch-griechische Prüfung wäre jede stärkere Präzisierung eine ungesicherte theologische Festlegung.
- issue: Norm und Gesetz der Verkündigung
  choice: „keine andere Vorschrift und kein anderes Gesetz ... als das, was der Retter gesagt hat“
  alternative: Die Aussage absolut gegen jedes Gesetz richten oder auf eine bestimmte kirchliche Ordnung beziehen.
  rationale: Die Übersetzung bewahrt die textinterne Begrenzung, ohne eine antinomistische oder konfessionelle Folgerung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die argumentative Schärfe des Autoritätskonflikts bleibt erhalten. Wegen der noch ausstehenden direkten Prüfung des koptischen und griechischen Quellenmaterials ist die Fassung ausdrücklich vorläufig; ungewöhnliche oder möglicherweise technische Wendungen wurden nicht stillschweigend harmonisiert.
