base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: de
  text: 'Als der Gesegnete dies gesagt hatte, grüßte er sie alle und sagte: „Friede sei mit euch! Nehmt meinen Frieden in euch auf.[a] Seht euch vor, dass euch niemand irreführt und sagt: ‚Seht, hier!‘ oder: ‚Seht, dort!‘ Denn der Menschensohn ist in euch.[b] Folgt ihm! Wer ihn sucht, wird ihn finden.


    Geht nun und verkündet die gute Botschaft vom Reich. Erlasst keine weiteren Vorschriften als die, die ich euch gegeben habe, und gebt kein Gesetz wie ein Gesetzgeber, damit ihr nicht dadurch gebunden werdet.“ Als er dies gesagt hatte, ging er fort.


    Doch sie waren tief betrübt und weinten bitterlich. Sie sagten: „Wie können wir zu den Völkern gehen und die gute Botschaft vom Reich des Menschensohnes verkünden?[c] Wenn sie ihn nicht verschont haben, warum sollten sie dann uns verschonen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher nach dem vorliegenden englischen Zeugen: „Erwerbt meinen Frieden.“ Die direkte Prüfung des koptischen und griechischen Wortlauts steht noch aus.'
    reason: Die ungewöhnliche aktive Formulierung besitzt mehrere mögliche deutsche Wiedergaben.
  - marker: b
    text: „In euch“ kann je nach zugrunde liegendem Wortlaut und Kontext auch gemeinschaftlich als „unter euch“ oder „in eurer Mitte“ verstanden werden. Eine direkte Prüfung der antiken Sprachzeugen steht noch aus.
    reason: Bewahrt die mögliche räumliche, gemeinschaftliche oder innerliche Mehrdeutigkeit.
  - marker: c
    text: Der vorliegende Zeuge hat hier „das Reich des Menschensohnes“, während zuvor nur vom „Reich“ die Rede ist.
    reason: Macht einen auffälligen Unterschied im Text sichtbar, ohne ihn anzugleichen.
lexical_decisions:
- source_word: the Blessed One
  choice: der Gesegnete
  rationale: Bewahrt den ehrenden Titel des vorliegenden Zeugen, ohne die Person im Text eigenmächtig ausdrücklich zu benennen.
- source_word: Acquire my peace
  choice: Nehmt meinen Frieden in euch auf
  rationale: Natürliches modernes Deutsch, das den aktiven Sinn von „erwerben/annehmen“ wahrt, ohne das missverständliche kommerzielle „erwerben“ zu verwenden.
- source_word: Son of Humanity
  choice: Menschensohn
  rationale: Der im Deutschen eingebürgerte biblische Titel gibt die semitisch geprägte Wendung idiomatisch und würdig wieder; die mögliche Bedeutungsspanne wird in einer Fußnote vermerkt.
- source_word: Gentiles
  choice: die Völker
  rationale: Gibt die nichtjüdischen Nationen weniger kirchenjargonhaft als „Heiden“ wieder und erhält den kollektiven Sinn.
- source_word: gospel
  choice: gute Botschaft
  rationale: Macht den Bedeutungsgehalt für heutige Leser unmittelbar verständlich; „verkünden“ bewahrt den öffentlichen Verkündigungscharakter.
- source_word: lawgiver
  choice: Gesetzgeber
  rationale: Formale und im Deutschen klare Entsprechung, ohne eine bestimmte historische oder theologische Identifikation einzutragen.
theological_decisions:
- issue: Ort oder Gegenwart des Menschensohnes
  choice: „in euch“
  alternative: „unter euch“ / „in eurer Mitte“
  rationale: Der bereitgestellte Zeuge lautet „within you“. Da eine direkte Prüfung des koptischen und griechischen Befunds noch aussteht und die Wendung sowohl innerlich als auch gemeinschaftlich verstanden werden kann, bleibt die Übersetzung nahe am Zeugen und die Alternative wird in der Fußnote offengelegt.
- issue: Beziehung zwischen Reich und Menschensohn im letzten Absatz
  choice: „Reich des Menschensohnes“
  alternative: „Reich“ ohne Genitivergänzung
  rationale: Folgt der ausdrücklich überlieferten Formulierung des bereitgestellten Zeugen, obwohl zuvor nur „vom Reich“ steht; die Spannung wird nicht harmonisiert.
- issue: Warnung vor zusätzlichem Gesetz
  choice: „damit ihr nicht dadurch gebunden werdet“
  alternative: „sonst könntet ihr dadurch gebunden werden“
  rationale: Bewahrt den Zweck- beziehungsweise Warnsinn und lässt offen, ob die Bindung rechtlich, geistlich oder sozial gemeint ist.
