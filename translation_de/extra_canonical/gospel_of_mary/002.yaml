  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Aufforderungen und rhetorische Fragen bleiben erhalten. Der Entwurf ist ausdrücklich vorläufig, da als Grundlage nur der angegebene gemeinfreie englische Übersetzungszeuge vorliegt; eine direkte Kontrolle anhand von Papyrus Berolinensis 8502,1 und der griechischen Fragmente ist weiterhin erforderlich.
