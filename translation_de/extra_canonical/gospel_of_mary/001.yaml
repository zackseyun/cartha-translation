    Petrus sagte zu ihm: »Da du uns alles erklärt hast, sage uns noch eines: Was ist die Sünde der Welt?«



    Der Retter sagte: »Sünde gibt es nicht. Ihr aber seid es, die Sünde hervorbringen, wenn ihr gemäß der Natur des Ehebruchs handelt, die ›Sünde‹ genannt wird. Darum kam das Gute in eure Mitte, zu allen Dingen jeder Natur, um sie in ihrer Wurzel wiederherzustellen.«



