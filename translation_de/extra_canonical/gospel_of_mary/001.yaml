translation:
  language: de
  text: '»Wird dann die [Materie] [vernichtet werden] oder nicht?«[a]


    Der Retter sagte: »Jede Natur, jede Gestalt und jedes Geschöpf besteht in- und miteinander. Doch sie werden sich wieder in ihre eigenen Wurzeln auflösen; denn die Natur der Materie löst sich allein in ihre eigene Natur auf. Wer Ohren hat zu hören, soll hören!«


    Petrus sagte zu ihm: »Da du uns alles erklärt hast, sage uns noch eines: Was ist die Sünde der Welt?«


    Der Retter sagte: »Sünde gibt es nicht. Ihr aber seid es, die Sünde hervorbringen, wenn ihr gemäß der Natur des Ehebruchs handelt, die ›Sünde‹ genannt wird. Darum kam das Gute in eure Mitte, bis hin zu den Dingen jeder Natur, um sie in ihrer Wurzel wiederherzustellen.«


    Dann fuhr er fort: »Darum werdet ihr krank und sterbt: weil [ihr liebt, was euch täuscht. Wer] verstehen kann, soll verstehen![b]


    Die Materie [brachte] eine Leidenschaft [hervor], die kein Bild hat, weil sie aus dem Naturwidrigen stammt.[c] Daraufhin entsteht Verwirrung im ganzen Körper. Deshalb sagte ich euch: Seid im Herzen zufrieden. Wenn ihr unzufrieden seid, findet Zufriedenheit angesichts der verschiedenen Bilder der Natur. Wer Ohren hat zu hören, soll hören!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen ergänzten beziehungsweise aufgrund einer Textlücke rekonstruierten Wortlaut. Die direkte Prüfung des koptischen und griechischen Quellenmaterials steht noch aus.
    reason: Die Eröffnungsfrage enthält im zugrunde gelegten englischen Zeugnis editorisch ergänzte Wörter.
  - marker: b
    text: Der eingeklammerte Wortlaut ist wegen einer Lücke im Manuskript rekonstruiert und bleibt unsicher.
    reason: Die Überlieferung ist mitten im Satz beschädigt; die Unsicherheit darf nicht durch glatten deutschen Wortlaut verdeckt werden.
  - marker: c
    text: Auch »brachte … hervor« ist eine Ergänzung im beschädigten Text; möglich ist sinngemäß eine Aussage über das Entstehen oder Hervorbringen der Leidenschaft.
    reason: Das Prädikat ist im zugrunde gelegten Zeugnis editorisch rekonstruiert.
lexical_decisions:
- source_word: matter
  choice: Materie
  rationale: Bewahrt den philosophisch-kosmologischen Begriff des Zeugnisses; »Stoff« wäre konkreter und würde den Aussagehorizont verengen.
- source_word: nature
  choice: Natur
  rationale: Gibt die wiederholte Schlüsselvokabel einheitlich wieder und bewahrt ihre mögliche Bedeutungsspanne zwischen Wesen, Beschaffenheit und Naturordnung.
- source_word: form
  choice: Gestalt
  rationale: Natürliches, würdiges Deutsch; lässt offen, ob eine sichtbare Form oder eine ontologische Gestalt gemeint ist.
- source_word: roots / root
  choice: Wurzeln / Wurzel
  rationale: Die Bildsprache wird formal erhalten, ohne sie als Ursprung, Prinzip oder Element auszudeuten.
- source_word: the Good
  choice: das Gute
  rationale: Bewahrt die substantivierte und möglicherweise personale Bezeichnung, ohne sie ausdrücklich mit einer bestimmten Person oder metaphysischen Instanz gleichzusetzen.
- source_word: adultery
  choice: Ehebruch
  rationale: Entspricht dem vorliegenden Zeugnis eng und vermeidet eine stillschweigende Verallgemeinerung zu »Unmoral« oder »Unzucht«.
- source_word: passion
  choice: Leidenschaft
  rationale: Erhält den mehrdeutigen Begriff; »Begierde« wäre stärker moralisch festgelegt, »Affekt« unnötig fachsprachlich.
- source_word: image
  choice: Bild
  rationale: Bewahrt die Bildterminologie und ihre mögliche philosophische Bedeutung, statt sie als Erscheinungsform auszulegen.
- source_word: content at heart
  choice: im Herzen zufrieden
  rationale: Verständliches modernes Deutsch, das die innere Haltung des englischen Zeugnisses wiedergibt, ohne sie als Ruhe, Genügsamkeit oder Festigkeit festzulegen.
theological_decisions:
- issue: Aussage »Sünde gibt es nicht«
  choice: Die Aussage wird ohne dogmatische Abschwächung wiedergegeben.
  alternative: »Sünde hat kein eigenständiges Sein« oder »Von sich aus gibt es keine Sünde«
  rationale: Solche Alternativen würden eine ontologische Deutung eintragen, die im vorliegenden Zeugnis zwar möglich, aber nicht ausdrücklich formuliert ist.
- issue: Personaler oder unpersönlicher Sinn von »das Gute«
  choice: Neutrales substantiviertes »das Gute«
  alternative: »der Gute« oder eine ausdrückliche Identifizierung mit Christus/Gott
  rationale: So bleibt die im Zeugnis erkennbare Spannung zwischen abstrakter Größe und personal handelnder Wirklichkeit erhalten.
- issue: Wiederherstellung »in ihrer Wurzel«
  choice: Das singuläre Pronomen bezieht sich offen auf die jeweilige Natur bzw. die Gesamtheit.
  alternative: »in ihren jeweiligen Wurzeln« oder »in seiner Wurzel«
  rationale: Eine präzisierende Zuordnung würde die schwer verständliche Syntax des Zeugnisses stärker auflösen, als die Quellenlage erlaubt.
- issue: Naturwidrigkeit der Leidenschaft
  choice: »aus dem Naturwidrigen stammt«
  alternative: »aus dem hervorgeht, was der Natur entgegensteht«
  rationale: Die kompakte Form bewahrt den Gegensatz zur wiederholten »Natur«, ohne eine bestimmte ethische oder kosmologische Lehre daraus abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Lehrdialog. Wiederholungen und begriffliche Spannungen wurden bewusst erhalten. Die Übersetzung ist vorläufig, da nur ein öffentlich zugängliches englisches Übersetzungszeugnis samt Hinweis auf Papyrus Berolinensis 8502,1 und griechische Fragmente vorlag; eine unmittelbare Prüfung des koptischen/griechischen Wortlauts ist noch erforderlich.
