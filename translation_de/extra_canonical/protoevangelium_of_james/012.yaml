    (3) Maria blieb drei Monate bei Elisabet. Von Tag zu Tag wurde ihr Leib größer, und Maria bekam Angst. Sie ging nach Hause und verbarg sich vor dem Volk Israel. Sie war sechzehn Jahre alt, als diese Geheimnisse sich an ihr ereigneten.'
  rationale: 'Die Revision richtet die wenigen entscheidenden Stellen am griechischen Wortlaut aus: allgemeine Verwandtschaftsbezeichnung, Mehrzahl bei Purpur und Scharlach sowie μακαρίζειν als „selig preisen“. Die offene religiöse Sprache um die „Geheimnisse“ und die auffällige Aussage des ungeborenen Kindes bleiben erhalten. Nicht mehr nötige, auf die bloß vorläufige englische Brückenvorlage bezogene Unsicherheitsfußnoten wurden entfernt.'
