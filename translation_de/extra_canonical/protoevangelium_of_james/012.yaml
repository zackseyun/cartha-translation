  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: de
  text: '(1) Maria fertigte den Purpur und den Scharlach an und brachte sie zum Priester. Der Priester nahm sie entgegen, segnete sie und sagte: »Maria, Gott der Herr hat deinen Namen groß gemacht, und du wirst unter allen Geschlechtern der Erde gesegnet sein.«


    (2) Da freute sich Maria und ging zu ihrer Verwandten Elisabet. Sie klopfte an die Tür. Als Elisabet es hörte, ließ sie den Scharlach fallen und eilte zur Tür. Sie öffnete, segnete Maria und sagte: »Wie kommt es, dass die Mutter meines Herrn zu mir kommt? Denn sieh: Das Kind in mir hüpfte und segnete dich!«[a]


    Maria aber hatte die Geheimnisse vergessen, von denen der Engel Gabriel zu ihr gesprochen hatte. Sie blickte unverwandt zum Himmel und sagte: »Herr, wer bin ich, dass alle Frauen der Erde mich selig preisen werden?«


    (3) Maria blieb drei Monate bei Elisabet. Von Tag zu Tag wurde ihr Leib größer, und Maria bekam Angst. Sie ging nach Hause und verbarg sich vor dem Volk Israel. Sie war sechzehn Jahre alt, als diese Geheimnisse sich an ihr ereigneten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche Formulierung »Das Kind in mir hüpfte und segnete dich« wird beibehalten. Sie wird nicht an Lukas 1,41–44 angeglichen.
    reason: Die Aussage des ungeborenen Kindes wird im Text ausdrücklich mit „segnete dich“ verbunden und soll nicht harmonisierend umgedeutet werden.
lexical_decisions:
- source_word: purple / scarlet (Greek source review pending)
  choice: Purpur / Scharlach
  rationale: Die traditionellen Farbstoff- bzw. Textilbezeichnungen bleiben unterschieden; »anfertigen« gibt die Tätigkeit wieder, ohne eine nicht belegte konkrete Web- oder Spinntechnik festzulegen.
- source_word: cousin (English witness; Greek source review pending)
  choice: Verwandte
  rationale: Die genaue Verwandtschaftsbezeichnung ist textgeschichtlich bzw. quellenabhängig; »Verwandte« vermeidet eine ungesicherte Präzisierung.
- source_word: the one in me
  choice: das Kind in mir
  rationale: Natürliches modernes Deutsch; der Bezug auf das ungeborene Kind wird aus dem Kontext ausgedrückt, ohne es namentlich zu identifizieren.
- source_word: mysteries
  choice: Geheimnisse
  rationale: Bewahrt die offene, religiös gewichtige Bedeutung und deutet den Ausdruck weder als Sakramente noch bloß als geheime Informationen.
- source_word: bless (final saying by Mary)
  choice: preisen
  rationale: Bei Menschen als Handelnden ist »mich preisen« idiomatischer als »mich segnen« und entspricht dem Sinn, Maria selig bzw. glücklich zu nennen; die Abweichung vom englischen Zeugen wird in einer Fußnote kenntlich gemacht.
- source_word: womb grew larger
  choice: ihr Leib wurde größer
  rationale: Dignifizierte, verständliche Wiedergabe des sichtbaren Fortschreitens der Schwangerschaft, ohne unnötig klinische Sprache.
theological_decisions:
- issue: Elisabets Aussage, das ungeborene Kind habe Maria gesegnet
  choice: Die ungewöhnliche personale Aussage wird wörtlich als »hüpfte und segnete dich« bewahrt.
  alternative: »hüpfte vor Freude über dich« oder eine Harmonisierung mit Lukas 1,41–44.
  rationale: Die besondere Formulierung dieses Textes soll nicht stillschweigend an den kanonischen Parallelbericht angeglichen werden.
- issue: Marias Vergessen der von Gabriel mitgeteilten Geheimnisse
  choice: »hatte die Geheimnisse vergessen« bleibt ohne Abschwächung stehen.
  alternative: »dachte nicht mehr an« oder »verstand noch nicht«.
  rationale: Die erzählerische und theologische Spannung wird bewahrt, statt Marias Vergessen psychologisch oder dogmatisch umzudeuten.
- issue: »Mutter meines Herrn«
  choice: Die christologische Anrede wird unverändert beibehalten.
  alternative: Eine erklärende Erweiterung oder ein späterer dogmatischer Titel.
  rationale: Der Text sagt »Mutter meines Herrn«; eine terminologische Ausweitung würde spätere Lehrsprache importieren.
- issue: »Geheimnisse geschahen an ihr«
  choice: Die passive, offene Geschehensform bleibt erhalten.
  alternative: »als sie dies erlebte« oder »als Gott dies an ihr tat«.
  rationale: So wird weder die göttliche Urheberschaft ausdrücklich ergänzt noch der religiöse Charakter zu einem bloßen Erlebnis abgeschwächt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze parataktische Sätze bewahren den schlichten Stil der Überlieferung, werden aber behutsam geglättet. Da die direkte Prüfung des griechischen Ausgangstextes noch aussteht, werden textkritisch oder lexikalisch unsichere Stellen ausdrücklich markiert und nicht überpräzisiert.
