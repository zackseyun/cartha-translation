  to: '(1) Maria fertigte den Purpur und den Scharlach an und brachte sie zum Priester. Der Priester nahm sie entgegen, segnete sie und sagte: »Maria, Gott der Herr hat deinen Namen groß gemacht, und du wirst unter allen Geschlechtern der Erde gesegnet sein.«


