    Maria aber hatte die Geheimnisse vergessen, von denen der Engel Gabriel zu ihr gesprochen hatte. Sie blickte unverwandt zum Himmel und sagte: »Herr, wer bin ich, dass alle Frauen der Erde mich preisen werden?«[c]


