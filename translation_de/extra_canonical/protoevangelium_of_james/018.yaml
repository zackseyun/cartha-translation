  yaml_path: translation/extra_canonical/protoevangelium_of_james/018.yaml
  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: de
  text: '(1) Dort fand er eine Höhle. Er brachte sie hinein, ließ seine Söhne bei ihr und ging fort, um in der Gegend von Bethlehem eine hebräische Hebamme zu suchen.


    (2) Ich aber, Josef, ging umher und ging doch nicht umher. Ich blickte zum Himmelsgewölbe hinauf und sah, dass es stillstand. Dann blickte ich in den Himmel und sah voller Staunen, dass selbst die Vögel des Himmels reglos waren. Ich blickte zur Erde und sah dort eine Schüssel stehen und Arbeiter beim Essen liegen. Ihre Hände waren in der Schüssel; sie kauten und kauten doch nicht. Sie nahmen Speise, nahmen sie aber nicht; sie führten sie zum Mund, führten sie aber nicht zum Mund. Vielmehr waren die Gesichter aller nach oben gerichtet.


    Und ich sah Schafe, die vorangetrieben wurden; doch die Schafe standen still. Der Hirte hob die Hand, um sie zu schlagen; doch seine Hand blieb erhoben. Ich blickte in die reißende Strömung des Flusses und sah junge Ziegen. Ihre Mäuler waren im Wasser, doch sie tranken nicht.


    Da nahm plötzlich alles wieder seinen Lauf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dome of heaven
  choice: Himmelsgewölbe
  rationale: Die traditionelle, verständliche Bezeichnung bewahrt das antike kosmologische Bild, ohne es modernisierend aufzulösen.
- source_word: was wandering but not wandering
  choice: ging umher und ging doch nicht umher
  rationale: Die paradoxe Wiederholung wird bewusst erhalten, weil sie den Stillstand der Zeit erzählerisch erfahrbar macht.
- source_word: workers reclining
  choice: Arbeiter beim Essen liegen
  rationale: „Arbeiter“ gibt die Personengruppe wieder; „beim Essen liegen“ macht die antike Tischhaltung verständlich, ohne moderne Sitzgewohnheiten einzutragen.
- source_word: torrent of the river
  choice: reißende Strömung des Flusses
  rationale: Die Formulierung bewahrt die Kraft und Bewegung des Gewässers als Kontrast zum Stillstand der Tiere.
- source_word: young goats
  choice: junge Ziegen
  rationale: Die neutrale Wiedergabe vermeidet die mögliche Überpräzisierung „Zicklein“, solange die griechische Wortform nicht direkt geprüft ist.
- source_word: resumed its course
  choice: nahm ... wieder seinen Lauf
  rationale: Die idiomatische deutsche Wendung erhält das Bewegungsbild und bezeichnet knapp das Ende des kosmischen Stillstands.
theological_decisions:
- issue: Art und Bedeutung des universalen Stillstands
  choice: Die paradoxen Bewegungsbeschreibungen bleiben wörtlich-spannungsvoll stehen.
  alternative: Den Vorgang ausdrücklich als Vision, Wunder oder Anhalten der Zeit erklären.
  rationale: Der Text beschreibt das Geschehen, deutet aber seinen metaphysischen Mechanismus nicht ausdrücklich. Die Übersetzung soll diese Offenheit bewahren.
- issue: Identität der „hebräischen Hebamme“
  choice: hebräische Hebamme
  alternative: jüdische Hebamme
  rationale: „Hebräisch“ hält die auffällige ethnisch-sprachliche Bezeichnung des Zeugen fest und vermeidet eine interpretierende Normalisierung.
- issue: Erzählperspektive Josefs
  choice: Der unvermittelte Wechsel zur Ich-Erzählung wird beibehalten.
  alternative: Die Passage durchgehend in der dritten Person wiedergeben.
  rationale: Der Perspektivwechsel gehört zur literarischen Gestalt der Überlieferung und darf nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten Parallelismen und paradoxen Wiederholungen. Wegen der noch ausstehenden direkten Prüfung der griechischen Überlieferung ist der Entwurf als vorläufig und auf den bereitgestellten englischen Zeugen gestützt zu behandeln.
