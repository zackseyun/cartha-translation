  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: de
  text: '**Protoevangelium des Jakobus – Kapitel 6: Marias erstes Lebensjahr**


    **(1)** Von Tag zu Tag wurde das Kind kräftiger. Als es sechs Monate alt war, stellte seine Mutter es auf den Boden, um zu sehen, ob es stehen konnte. Es ging sieben Schritte und kam an die Brust seiner Mutter. Da nahm sie es auf und sagte: »So wahr der Herr, mein Gott, lebt: Du wirst diesen Boden nicht wieder betreten, bis ich dich in den Tempel des Herrn bringe.«


    In ihrem Schlafgemach richtete sie einen heiligen Raum ein. Nichts Unheiliges oder Unreines durfte dort hineingelangen. Dann rief sie die unbefleckten Töchter der Hebräer zu sich, und sie beschäftigten das Kind.[a]


    **(2)** Als das Kind ein Jahr alt wurde, veranstaltete Joachim ein großes Fest. Er lud die Hohenpriester, die Priester, die Schriftgelehrten, die Ältesten und das ganze Volk Israel ein. Joachim brachte das Kind zu den Priestern, und sie segneten es mit den Worten: »Gott unserer Vorfahren, segne dieses Kind und gib ihm einen Namen, der für immer in allen Generationen genannt werden wird.«


    Das ganze Volk erwiderte: »So sei es! Amen.«


    Dann brachten sie das Kind zu den Hohenpriestern. Diese segneten es und sprachen: »Höchster Gott, sieh auf dieses Kind und segne es mit einem vollkommenen Segen, der nicht übertroffen werden kann.«[b]


    **(3)** Seine Mutter nahm es mit hinauf in den heiligen Raum ihres Schlafgemachs und stillte es. Dann stimmte Anna für den Herrn, ihren Gott, ein Lied an:


    »Ein heiliges Lied will ich dem Herrn, meinem Gott, singen,

    denn Gott hat sich mir zugewandt

    und die Schmähung meiner Feinde von mir genommen.


    Der Herr, mein Gott, hat mir die Frucht seiner Gerechtigkeit geschenkt,

    einzigartig und doch vielgestaltig vor ihm.[c]


    Wer wird den Leuten Reubels berichten,

    dass Anna ein Kind stillt?

    Hört, hört, ihr zwölf Stämme Israels:

    Anna stillt ein Kind!«[d]


    Anna ruhte in dem heiligen Raum ihres Schlafgemachs. Danach ging sie hinaus und bediente die Gäste. Als das Festmahl beendet war, gingen sie voll Freude fort und priesen den Gott Israels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Überlieferung lässt sich auch im Sinn von »sie spielten mit ihr« oder »sie unterhielten sie« verstehen.
    reason: Bewahrt die lexikalische Unsicherheit der Handlung der jungen Frauen.
  - marker: b
    text: 'Wörtlicher: »mit einem letzten Segen, der nicht übertroffen werden wird«; gemeint ist wahrscheinlich ein höchster oder vollkommener Segen.'
    reason: Dokumentiert die formale Lesart und die begründete idiomatische Wiedergabe.
  - marker: c
    text: Die Wendung »einzigartig und doch vielgestaltig« ist im überlieferten Text ungewöhnlich und bleibt in ihrer genauen Bedeutung offen.
    reason: Verhindert eine unbelegte theologische Auflösung einer schwierigen Quellenaussage.
  - marker: d
    text: »Reubel« ist die Namensform des zugrunde gelegten englischen Zeugen. Gemeint sein könnten die Leute beziehungsweise Nachkommen Rubens; die genaue Lesart muss noch am griechischen Handschriftenbestand geprüft werden.
    reason: Kennzeichnet eine textkritisch und onomastisch unsichere Stelle, da die direkte Prüfung der griechischen Überlieferung noch aussteht.
lexical_decisions:
- source_word: ἐκραταιοῦτο
  choice: wurde … kräftiger
  rationale: Gibt das fortschreitende Erstarken des Kindes natürlich und quellennah wieder.
- source_word: ἁγίασμα
  choice: heiliger Raum
  rationale: Bezeichnet hier ein eigens abgesondertes Heiligtum innerhalb des Schlafgemachs; „heiliger Raum“ ist im Deutschen verständlicher als das institutionell klingende „Heiligtum“.
- source_word: ἀμίαντοι/καθαραί (traditionsabhängig)
  choice: unbefleckte Töchter der Hebräer
  rationale: Bewahrt die kultisch-moralische Reinheitsvorstellung des Textes, ohne sie bloß hygienisch als „sauber“ wiederzugeben.
- source_word: ἀπεδοκίμασαν/διέπαιζον bzw. entsprechende Überlieferung (unsichere Lesart)
  choice: sie beschäftigten das Kind
  rationale: Die überlieferte Handlung wird in Übersetzungszeugen verschieden als Spielen, Unterhalten oder Betreuen verstanden; die gewählte Formulierung bleibt bewusst offen.
- source_word: ὄνομα ὀνομαστόν
  choice: einen Namen, der … genannt werden wird
  rationale: Erhält das Wortspiel von Name und Nennung soweit im Deutschen möglich; gemeint sein kann auch ein berühmter Name.
- source_word: ὀνειδισμός
  choice: Schmähung
  rationale: Trifft öffentliche Schande und Vorwurf besser als das schwächere moderne Wort „Kritik“.
- source_word: ἐπεσκέψατό με
  choice: hat sich mir zugewandt
  rationale: Gibt die gnädige göttliche Zuwendung wieder, ohne das im heutigen Deutsch oft negativ verstandene „heimgesucht“ zu verwenden.
- source_word: μονοειδῆ καὶ πολυειδῆ
  choice: einzigartig und doch vielgestaltig
  rationale: Bewahrt die auffällige, theologisch spannungsreiche Gegenüberstellung, statt sie erklärend aufzulösen.
theological_decisions:
- issue: Sakraler Sonderstatus des Kindes
  choice: Die kultische Sprache von heiligem Raum, Unreinheit und unbefleckten Begleiterinnen wird beibehalten.
  alternative: Die Aussagen als bloße Fürsorge oder Hygiene abschwächen.
  rationale: Der Text zeichnet Maria bewusst als für den Tempel abgesondert; diese theologische Akzentsetzung gehört zum Werk und darf nicht neutralisiert werden.
- issue: „Frucht seiner Gerechtigkeit“
  choice: Das Possessivpronomen wird auf Gott bezogen und die rätselhafte Formulierung wörtlich bewahrt.
  alternative: „Frucht meiner Gerechtigkeit“ oder eine eindeutige Deutung auf Maria.
  rationale: Die Formulierung des Zeugen ist theologisch dicht und mehrdeutig; eine dogmatische Identifikation der Frucht wird vermieden.
- issue: „vollkommener/letzter Segen“
  choice: „vollkommener Segen, der nicht übertroffen werden kann“
  alternative: „letzter Segen“
  rationale: „Letzter“ wäre im Deutschen leicht rein zeitlich oder als Todessegen misszuverstehen; der Parallelismus beschreibt offenbar den höchsten, endgültigen Grad des Segens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Fluss und leicht biblischem Klang. Archaismen wurden vermieden, kultische und poetische Schlüsselbegriffe jedoch erhalten. Die Verszeilen in Annas Lied machen Parallelismen und Ausrufcharakter sichtbar. Der Entwurf stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen sowie auf vorläufige Kenntnis der griechischen Textgestalt; eine vollständige Kollation der griechischen Handschriftentradition steht noch aus.
