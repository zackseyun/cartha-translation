review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng. Einige Wiedergaben gehen jedoch über dessen Wortlaut hinaus: „unbefleckt“ ist stärker und spezifischer als „pure“, „sie beschäftigten das Kind“ ersetzt die ausdrücklich genannte Spielhandlung, und „vollkommener Segen“ legt „final blessing“ einseitig als höchsten Segen aus. Außerdem sollte die Bewegungsangabe am Schluss („gingen hinab“) erhalten bleiben.'
  naturalness: Das Deutsch ist überwiegend flüssig, würdig und modern. „Stimmte Anna für den Herrn, ihren Gott, ein Lied an“ ist jedoch weniger idiomatisch als „Anna sang dem Herrn, ihrem Gott, ein Lied“. „Gingen ... fort“ verliert zudem die konkrete Erzählangabe „hinab“.
  terminology: „Schmähung“, „Gerechtigkeit“, „Höchster Gott“, „Tempel“ und die kultische Sprache sind angemessen. Für die jungen Frauen ist „reine Töchter“ die neutrale, quellennähere Wiedergabe. Die schwierige Formel „einzigartig und doch vielgestaltig“ sowie „Reubel“ sollen mit zurückhaltenden Anmerkungen bewahrt werden.
  issues:
  - severity: medium
    issue: „unbefleckten Töchter“
    rationale: Diese Formulierung kann im Deutschen insbesondere im Marienkontext eine weitergehende dogmatische Konnotation tragen. Der vorliegende Zeuge bietet lediglich „pure daughters“; „reine Töchter“ bewahrt die kultische Reinheitssprache ohne zusätzliche Festlegung.
  - severity: medium
    issue: „sie beschäftigten das Kind“
    rationale: Der englische Zeuge sagt ausdrücklich, dass die Töchter „mit ihr spielten“. Die verallgemeinernde Umschreibung schwächt die konkrete Handlung unnötig ab.
  - severity: medium
    issue: „vollkommener Segen“ für „final blessing“
    rationale: Die Wiedergabe entscheidet die mehrdeutige Zeit-/Rangvorstellung zugunsten von „höchster“. Ein wörtlicheres „letzter Segen“ bewahrt die Ambiguität; eine Fußnote kann die naheliegende Bedeutung erläutern, ohne sie in den Text einzutragen.
  - severity: low
    issue: Schlussbewegung ausgelassen
    rationale: „Gingen ... fort“ gibt nicht wieder, dass die Gäste laut Zeuge „hinabgingen“. Die Ortsbewegung sollte beibehalten werden.
  revised_text: '**Protoevangelium des Jakobus – Kapitel 6: Marias erstes Lebensjahr**


