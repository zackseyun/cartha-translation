base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: de
  text: '**Protoevangelium des Jakobus – Kapitel 22: Die Tötung der Kinder**[a]


    (1) Als Herodes merkte, dass die Sterndeuter ihn getäuscht hatten, wurde er zornig. Er sandte seine Mörder aus und befahl ihnen, alle Kinder im Alter von zwei Jahren und darunter zu töten.


    (2) Als Maria hörte, dass die Kinder getötet wurden, bekam sie Angst. Sie nahm ihr Kind, wickelte es in Tücher und legte es in eine Futterkrippe für Rinder.


    (3) Als Elisabet hörte, dass man nach Johannes suchte, nahm sie ihn mit ins Bergland und sah sich nach einem Ort um, an dem sie ihn verstecken könnte; doch es gab kein Versteck. Da seufzte Elisabet und sagte: »Berg Gottes, nimm eine Mutter mit ihrem Kind auf!« Denn Elisabet konnte nicht weiter hinaufsteigen. Sofort spaltete sich der Berg und nahm sie auf, und im Berg leuchtete ein Licht für sie. Denn ein Engel des Herrn war bei ihnen und beschützte sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem bereitgestellten gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung anhand der griechischen Handschriftentradition steht noch aus.
    reason: Die angegebene Textgrundlage ist ein englischer Übersetzungszeuge; der griechische Ausgangstext wurde für diesen Entwurf noch nicht direkt geprüft.
lexical_decisions:
- source_word: magi
  choice: Sterndeuter
  rationale: Gibt die antike Bezeichnung in verständlichem modernem Deutsch wieder, ohne die später traditionelle Vorstellung von Königen einzutragen.
- source_word: killers
  choice: Mörder
  rationale: Bewahrt die scharfe moralische Benennung der ausgesandten Männer; »Soldaten« oder »Wachen« wäre eine nicht belegte Präzisierung.
- source_word: infants
  choice: Kinder
  rationale: Der angegebene Altersrahmen bis zu zwei Jahren umfasst im Deutschen nicht nur Säuglinge; »Kinder« ist daher natürlich und sachlich passend.
- source_word: manger for cows
  choice: Futterkrippe für Rinder
  rationale: Bewahrt sowohl den konkreten Futtertrog als auch den Bezug zu Rindern, ohne das Bild unnötig auszuschmücken.
- source_word: hills
  choice: Bergland
  rationale: Passt zum anschließenden Hinaufsteigen und zur Anrede des Berges, ohne mehrere einzelne Hügel vorauszusetzen.
- source_word: took her
  choice: nahm sie auf
  rationale: Greift Elisabets Bitte »nimm ... auf« wieder auf und lässt offen, auf welche Weise der gespaltene Berg ihr Schutz bot.
theological_decisions:
- issue: Das wunderhafte Öffnen des Berges und das Licht darin
  choice: Als unmittelbares Geschehen der Erzählung wiedergegeben
  alternative: Als Vision, Sinnbild oder natürliche Felsspalte deuten
  rationale: Der Text erzählt das Ereignis ausdrücklich als Wunder; eine rationalisierende oder allegorische Erklärung wäre eine unbelegte theologische Festlegung.
- issue: Schutz durch den Engel des Herrn
  choice: »Denn ein Engel des Herrn war bei ihnen und beschützte sie«
  alternative: Den Engel mit einer bestimmten Gestalt identifizieren oder seinen Schutzmechanismus näher erklären
  rationale: Die unbestimmte Bezeichnung und die knappe kausale Aussage des Zeugnisses bleiben erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze, klare Sätze folgen der schlichten narrativen Struktur. Traditionell missverständliche oder konfessionell aufgeladene Erweiterungen wurden vermieden; insbesondere werden die magi nicht als Könige bezeichnet. Elisabet folgt der im Deutschen üblichen biblischen Namensform.
