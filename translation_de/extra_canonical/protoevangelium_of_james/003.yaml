translation:
  language: de
  text: '(1) Anna blickte unverwandt zum Himmel und sah im Lorbeerbaum ein Spatzennest. Da stimmte Anna eine Klage an und sprach bei sich:


    »Weh mir! Wer hat mich geboren? Welcher Mutterleib hat mich zur Welt gebracht? Als Fluch vor dem Volk Israel wurde ich geboren und bin verachtet worden. Sie haben mich verspottet und aus dem Tempel des Herrn, meines Gottes, verbannt.


    (2) Weh mir! Wem gleiche ich? Ich gleiche nicht den Vögeln des Himmels; denn selbst die Vögel des Himmels sind fruchtbar vor dir, Herr.


    Weh mir! Wem gleiche ich? Ich gleiche nicht den Tieren; denn selbst die Tiere sind fruchtbar vor dir, Herr.


    Weh mir! Wem gleiche ich? Ich gleiche nicht den wilden Tieren der Erde; denn selbst die wilden Tiere der Erde sind fruchtbar vor dir, Herr.


    (3) Weh mir! Wem gleiche ich? Ich gleiche nicht diesen Wassern; denn selbst diese Wasser sind ruhig und geraten doch in Bewegung, und ihre Fische preisen dich, Herr.[a]


    Weh mir! Wem gleiche ich? Ich gleiche nicht dieser Erde; denn die Erde bringt zu ihrer Zeit ihre Früchte hervor und preist dich, Herr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die genaue Fassung des Satzes über die Wasser ist unsicher, solange die direkte Prüfung des griechischen Textes aussteht. Die vorliegende Übersetzung folgt dem englischen Zeugen: Die Wasser sind ruhig und geraten dennoch in Bewegung.'
    reason: Die Formulierung »serene yet churn« ist semantisch spannungsvoll; die Fußnote bewahrt diese Spannung und kennzeichnet die noch ausstehende Prüfung am griechischen Text.
lexical_decisions:
- source_word: looked intently (Greek review pending)
  choice: blickte unverwandt
  rationale: Gibt den nachdrücklichen, anhaltenden Blick in natürlichem und würdigem Deutsch wieder.
- source_word: lamented
  choice: stimmte eine Klage an
  rationale: Bewahrt den Charakter einer feierlich-poetischen Klage besser als das im Deutschen oft allgemeinere »beklagte sich«.
- source_word: What am I like?
  choice: Wem gleiche ich?
  rationale: Die wiederkehrende rhetorische Vergleichsfrage wird knapp und idiomatisch wiedergegeben, ohne ihre poetische Parallelstruktur aufzulösen.
- source_word: fruitful
  choice: fruchtbar
  rationale: Erhält das zentrale Motiv der Fruchtbarkeit und Annas Kinderlosigkeit sowie die Wiederholung des Ausgangstextes.
- source_word: bless you
  choice: preisen dich
  rationale: Bei nichtmenschlichen Geschöpfen bezeichnet das deutsche »preisen« natürlich deren Lob Gottes; »segnen dich« wäre hier missverständlich.
- source_word: at the proper time / when it’s time
  choice: zu ihrer Zeit
  rationale: Bewahrt den zeitlichen Sinn in einer geläufigen, biblisch geprägten, aber verständlichen Formulierung.
theological_decisions:
- issue: Annas Selbstbeschreibung als Fluch
  choice: »Als Fluch vor dem Volk Israel wurde ich geboren«
  alternative: »Ich wurde zum Fluch für das Volk Israel geboren«
  rationale: »Vor dem Volk« wahrt die mögliche Bedeutung ihrer öffentlichen Schande; »für das Volk« könnte stärker behaupten, sie selbst bringe Israel Unheil.
- issue: Geschöpfliches Gotteslob
  choice: »ihre Fische preisen dich« und »die Erde … preist dich«
  alternative: »segnen dich«
  rationale: Die Übersetzung hält die Vorstellung fest, dass die Schöpfung Gott lobt, ohne den deutschen Lesern nahezulegen, Geschöpfe spendeten Gott einen Segen.
- issue: Ausschluss aus dem Tempel
  choice: »aus dem Tempel … verbannt«
  alternative: »vom Tempel … ausgeschlossen«
  rationale: Die stärkere Aussage des Zeugen wird beibehalten, ohne einen bestimmten historisch-rechtlichen Mechanismus hinzuzufügen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klagepoetischem Ton. Die anaphorische Wiederholung »Weh mir! Wem gleiche ich?« und die parallele Satzstruktur wurden bewusst erhalten. Der Entwurf ist wegen der ausstehenden direkten Prüfung der griechischen Handschriftentradition vorläufig; er stützt sich auf den bereitgestellten gemeinfreien englischen Zeugen und nutzt die englische POB-Fassung nur als konsultative Kontrollschicht.
