base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: de
  text: '(1) Die Priester hielten Rat und sagten: »Lasst uns einen Vorhang für den Tempel des Herrn anfertigen.«


    Der Priester sagte: »Ruft mir die reinen Jungfrauen aus dem Stamm Davids.« Die Tempeldiener gingen fort, suchten und fanden sieben. Da erinnerte sich der Priester daran, dass auch das Mädchen Maria aus dem Stamm Davids stammte und vor Gott rein war. Die Tempeldiener gingen fort und brachten sie.


    (2) Sie führten die Jungfrauen in den Tempel des Herrn. Der Priester sagte: »Werft Lose, damit bestimmt wird, wer das Gold, das Weiße, das Leinen, die Seide, das Violett, den Scharlach und den echten Purpur spinnen soll.«[a]


    Das Los für den echten Purpur und den Scharlach fiel auf Maria, und sie nahm beides mit in ihr Haus. Zu dieser Zeit verstummte Zacharias, und Samuel trat an seine Stelle, bis Zacharias wieder sprechen konnte.[b] Maria nahm den Scharlach und begann ihn zu spinnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Zuordnung der aufgezählten Begriffe zu Farben, Fasern und Geweben ist im überlieferten Wortlaut nicht überall eindeutig; »echter Purpur« wird ausdrücklich von »Violett« unterschieden.
    reason: Bewahrt die textilkundliche und lexikalische Unsicherheit des Zeugen, ohne die Aufzählung im Haupttext zu glätten.
  - marker: b
    text: Der hier genannte Samuel wird im Text nicht näher identifiziert; auch die genaue Funktion, in der er Zacharias vertrat, bleibt offen.
    reason: Verhindert eine unbelegte Identifizierung oder Amtsbestimmung.
lexical_decisions:
- source_word: council
  choice: hielten Rat
  rationale: Gibt die Beratung der Priester natürlich wieder, ohne zwingend ein dauerhaftes Ratsgremium vorauszusetzen.
- source_word: officers
  choice: Tempeldiener
  rationale: Der englische Ausdruck ist hinsichtlich des Amtes unscharf; im Tempelzusammenhang ist »Tempeldiener« verständlich und vermeidet die moderne Bedeutung von »Beamte«.
- source_word: pure virgins
  choice: reinen Jungfrauen
  rationale: Bewahrt sowohl die ausdrückliche Jungfräulichkeit als auch die kultisch beziehungsweise moralisch offene Bezeichnung »rein«.
- source_word: child Mary
  choice: das Mädchen Maria
  rationale: Natürliches modernes Deutsch, das Marias Jugend ausdrückt, ohne sie als Kleinkind erscheinen zu lassen.
- source_word: true purple
  choice: echten Purpur
  rationale: Bewahrt die auffällige Unterscheidung des Zeugen zwischen Violett und »wahrem/echtem« Purpur.
- source_word: fell silent
  choice: verstummte
  rationale: Gibt den eingetretenen Zustand knapp wieder, ohne an dieser Stelle dessen Ursache auszudeuten.
theological_decisions:
- issue: Marias Reinheit vor Gott
  choice: »vor Gott rein« ohne nähere Erklärung
  alternative: Die Reinheit als kultische, moralische oder sündlose Reinheit präzisieren
  rationale: Der vorliegende Zeuge legt die genaue Art und Reichweite der Reinheit nicht fest; die theologische Offenheit bleibt erhalten.
- issue: Zacharias’ Verstummen
  choice: »verstummte« ohne ausdrücklichen Hinweis auf göttliches Gericht oder ein Wunder
  alternative: »von Gott stumm gemacht wurde«
  rationale: Die Ursache wird in diesem Kapitel nicht ausdrücklich genannt und soll nicht aus einer anderen Überlieferung in den Text eingetragen werden.
- issue: Samuel als Stellvertreter
  choice: »trat an seine Stelle«
  alternative: Samuel als Hohepriester oder konkreten Amtsnachfolger bezeichnen
  rationale: Das genaue Amt und die Identität Samuels bleiben im gelieferten Text unbestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Wiederholungen wurden weitgehend bewahrt, soweit sie den schlichten antiken Erzählstil tragen. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung der griechischen Manuskripttradition als vorläufig zu behandeln.
