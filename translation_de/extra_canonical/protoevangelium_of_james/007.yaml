lexical_decisions:
- source_word: Temple of the Lord
  choice: Tempel des Herrn
  rationale: Bewahrt die kultische Bezeichnung und den wiederholten Wortlaut des Zeugnisses in natürlichem Deutsch.
- source_word: pure daughters of the Hebrews
  choice: unberührten Töchter der Hebräer
  rationale: „Unberührt“ gibt im Zusammenhang wahrscheinlich die sexuelle beziehungsweise kultische Reinheit wieder, ohne mit „rein“ vorschnell eine ausschließlich moralische Bedeutung festzulegen.
- source_word: lamps ... be lit
  choice: Lampen ... brennend halten
  rationale: Natürliches Deutsch; es macht deutlich, dass die Lampen während des Zuges leuchten sollen.
- source_word: redemption
  choice: Erlösung
  rationale: Bewahrt den religiös-theologischen Gehalt und lässt offen, wie diese Erlösung konkret verwirklicht wird.
- source_word: house of Israel
  choice: Haus Israel
  rationale: Die traditionelle kollektive Bezeichnung bleibt erhalten, statt sie auf „Volk“ zu verengen.
- source_word: loved her
  choice: gewann sie lieb
  rationale: Idiomatische und würdige Wiedergabe einer gemeinschaftlichen Zuneigung.
theological_decisions:
- issue: Art der durch Maria offenbarten Erlösung
  choice: „Durch dich wird der Herr ... seine Erlösung ... offenbaren“
  alternative: „An dir wird der Herr ... die Erlösung ... sichtbar machen“
  rationale: Die instrumentale Formulierung des Zeugnisses bleibt erhalten, ohne Marias genaue heilsgeschichtliche Rolle dogmatisch näherzubestimmen.
- issue: Gnade, die über Maria ausgegossen wird
  choice: „goss Gnade über sie aus“
  alternative: „ließ seine Gnade auf ihr ruhen“
  rationale: Bewahrt das dynamische Bild des Ausgangstextes und vermeidet eine konfessionelle Ausdeutung der Gnade.
- issue: Stufe des Altars
  choice: „dritte Stufe des Altars“
  alternative: „dritte Altarstufe“
  rationale: Die räumliche Aussage wird formal bewahrt, ohne architektonische oder liturgische Einzelheiten hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener erzählerischer Reihung. Wegen der noch ausstehenden direkten Prüfung des Griechischen ist der Entwurf quellenkritisch vorläufig; insbesondere „unberührten“, die Tempelbewegung und einzelne Präpositionen sollten am griechischen Text verifiziert werden.
