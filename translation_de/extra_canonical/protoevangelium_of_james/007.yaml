translation:
  language: de
  text: '(1) Und sie umsorgte ihr Kind Monat für Monat. Als es zwei Jahre alt war, sagte Joachim: „Lasst uns das Kind zum Tempel des Herrn bringen, damit wir das Versprechen erfüllen, das wir gegeben haben, damit der Herr uns nicht zürnt und unsere Gabe als unannehmbar zurückweist.“


    Anna aber sagte: „Lasst uns bis zu seinem dritten Lebensjahr warten, damit es nicht nach Vater oder Mutter verlangt.“


    Und Joachim sagte: „Lasst uns warten.“


    (2) Als das Kind drei Jahre alt geworden war, sagte Joachim: „Lasst uns die unberührten Töchter der Hebräer rufen. Sie sollen ihre Lampen nehmen und sie brennend halten, damit das Kind nicht umkehrt und sein Herz nicht vom Tempel des Herrn weggezogen wird.“ Und sie taten dies, bis sie zum Tempel des Herrn hinaufgegangen waren.


    Der Priester nahm sie in Empfang, küsste sie und sagte: „Der Herr, Gott, hat deinen Namen unter allen Generationen groß gemacht. Durch dich wird der Herr in den letzten Tagen seine Erlösung für das Volk Israel offenbaren.“


    (3) Und er setzte sie auf die dritte Stufe des Altars. Der Herr, Gott, goss Gnade über sie aus. Sie tanzte auf ihren Füßen, und das ganze Haus Israel gewann sie lieb.'
