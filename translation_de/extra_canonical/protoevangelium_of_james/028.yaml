review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Der Bezug von »gegen ihre Natur« darf nicht zu »entgegen der menschlichen Natur« verallgemeinert werden. Außerdem legt der unmittelbare Kontext nahe, dass Josef die Hebamme findet und mitbringt, nicht Maria. Die vorsichtige, nicht ausdeutende Wiedergabe der körperlichen Untersuchung bleibt erhalten.'
  naturalness: Der Text ist insgesamt gut lesbar und registergerecht. »Heute wird meine Seele groß erhoben« ist jedoch im Deutschen unidiomatisch; »Heute ist meine Seele groß geworden« bildet die auffällige Bildsprache verständlicher ab. »an die Brust seiner Mutter« ist für das Verhalten des Säuglings natürlicher als »nahm die Brust«.
  terminology: »Verlobte«, »vom Heiligen Geist empfangen«, »Heil«, »Jungfrau« und »Herr, mein Gott« sind angemessen. Die Wiedergabe »gegen ihre Natur« wahrt den im Zeugnis vorliegenden Bezug, ohne ihn dogmatisch oder anthropologisch zu erweitern.
  issues:
  - severity: medium
    issue: »entgegen der menschlichen Natur« erweitert den Bezug von »against her nature«.
    rationale: Das vorliegende Zeugnis bezieht das Possessivum auf die Jungfrau. Die Deutung als Aussage über die gesamte menschliche Natur ist möglich, aber nicht im Haupttext zu erzwingen.
  - severity: medium
    issue: In Vers 1 bleibt im Haupttext offen, wen Josef findet und mitbringt.
    rationale: Die folgende Anrede und der Erzählzusammenhang identifizieren diese Person als die Hebamme. Die bisherige Formulierung mit bloßem Pronomen samt Alternativfußnote macht den deutschen Text unnötig unsicher.
  - severity: low
    issue: »Heute wird meine Seele groß erhoben« ist keine natürliche deutsche Entsprechung.
    rationale: Die Formulierung ist semantisch unklar und klingt passivisch-verfremdet. Eine Form mit »groß geworden« bewahrt das Bild des Zeugnisses besser.
  revised_text: '(1) Er fand die Hebamme, als sie vom Berg herabkam, und brachte sie mit. Josef sagte zu der Hebamme: »Maria ist meine Verlobte. Sie hat jedoch vom Heiligen Geist empfangen und ist im Tempel des Herrn aufgewachsen.«


    Und die Hebamme ging mit ihm. (2) Sie blieben vor der Höhle stehen, und eine dunkle Wolke überschattete die Höhle. Da sagte die Hebamme: »Heute ist meine Seele groß geworden, denn meine Augen haben heute etwas Wunderbares gesehen: Für Israel ist das Heil geboren worden!«


    Sogleich wich die Wolke von der Höhle, und in der Höhle erschien ein großes Licht, sodass sie es nicht ertragen konnten. Kurze Zeit später zog sich das Licht zurück, bis ein Kind erschien. Es legte sich an die Brust seiner Mutter Maria.


    Da rief die Hebamme: »Wie groß ist dieser Tag, denn ich habe dieses neue Wunder gesehen!«


    (3) Die Hebamme ging aus der Höhle hinaus, und Salome begegnete ihr.


    Sie sagte zu ihr: »Salome, Salome, ich muss dir von einem neuen Anblick erzählen: Eine Jungfrau hat geboren – gegen ihre Natur!«


    Salome sagte: »So wahr der Herr, mein Gott, lebt: Wenn ich nicht meinen Finger einführe und ihren Zustand untersuche, werde ich nicht glauben, dass die Jungfrau geboren hat.«[a]'
  revised_footnotes:
  - marker: a
    text: Gemeint ist eine körperliche Untersuchung, mit der Salome die fortbestehende Jungfräulichkeit prüfen will.
    reason: Die knappe Formulierung »ihren Zustand untersuche« gibt die verhüllende Ausdrucksweise des Zeugnisses wieder; die Anmerkung erläutert den erzählerischen Bezug.
  revision_rationale: Die Revision löst die unnötige Pronomenunsicherheit zu Beginn anhand des unmittelbaren Kontexts auf, beseitigt eine interpretierende Verallgemeinerung bei »gegen ihre Natur« und glättet einzelne unidiomatische deutsche Wendungen. Sie ergänzt keine dogmatische Deutung und lässt die körperliche Prüfung sachlich, aber nicht sensationalistisch erkennen.
