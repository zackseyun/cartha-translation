translation:
  language: de
  text: '(1) Und er fand sie, als sie vom Berg herabkam, und brachte sie mit.[a] Josef sagte zu der Hebamme: »Maria ist meine Verlobte. Sie hat jedoch vom Heiligen Geist empfangen und ist im Tempel des Herrn aufgewachsen.«


    Und die Hebamme ging mit ihm. (2) Sie traten vor die Höhle, und eine dunkle Wolke überschattete sie. Da sagte die Hebamme: »Heute wird meine Seele groß erhoben, denn meine Augen haben heute etwas Wunderbares gesehen: Für Israel ist das Heil geboren worden!«


    Sogleich wich die Wolke von der Höhle, und in der Höhle erschien ein großes Licht, sodass ihre Augen es nicht ertragen konnten. Wenig später wich das Licht zurück, bis ein Kind sichtbar wurde. Es kam und nahm die Brust seiner Mutter Maria.


    Da rief die Hebamme: »Wie groß ist dieser Tag! Denn ich habe dieses neue Wunder gesehen.«


    (3) Die Hebamme ging aus der Höhle hinaus, und Salome begegnete ihr.


    Sie sagte zu ihr: »Salome, Salome, ich muss dir von einem neuartigen Anblick erzählen: Eine Jungfrau hat geboren – entgegen der menschlichen Natur!«[b]


    Salome sagte: »So wahr der Herr, mein Gott, lebt: Wenn ich nicht meinen Finger einführe und ihren Zustand untersuche, werde ich nicht glauben, dass die Jungfrau geboren hat.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Satzbau ist knapp und mehrdeutig; sinngemäß könnte auch gemeint sein: »Er fand die Hebamme, als sie vom Berg herabkam, und brachte sie mit.«'
    reason: Das englische Zeugnis enthält unklare Pronomenbezüge und eine parenthetische Verbindung; die griechische Ausgangstradition muss noch direkt geprüft werden.
  - marker: b
    text: 'Wörtlicher nach dem vorliegenden englischen Zeugnis: »entgegen ihrer Natur«.'
    reason: Die Formulierung kann sich grammatisch auf die Jungfrau beziehen, meint im Zusammenhang aber vermutlich das als naturwidrig betrachtete Gebären einer Jungfrau.
  - marker: c
    text: Gemeint ist eine körperliche Untersuchung, mit der Salome die fortbestehende Jungfräulichkeit prüfen will.
    reason: »Zustand« ist im Text verhüllend; die Fußnote macht den erzählerischen Sinn klar, ohne ihn im Haupttext unnötig auszumalen.
lexical_decisions:
- source_word: betrothed
  choice: Verlobte
  rationale: Gibt das rechtlich bindende Verlöbnis verständlich wieder, ohne Maria bereits ausdrücklich als Ehefrau zu bezeichnen.
- source_word: conceived from the Holy Spirit
  choice: vom Heiligen Geist empfangen
  rationale: Bewahrt die Aussage über den Ursprung der Empfängnis und entspricht natürlichem deutschsprachigem Bibelregister.
- source_word: overshadowed
  choice: überschattete
  rationale: Erhält die biblische Bildsprache, ohne die dunkle Wolke rationalistisch zu erklären.
- source_word: Salvation
  choice: das Heil
  rationale: Die substantivische Form bewahrt die mögliche Mehrdeutigkeit zwischen Heilsereignis und dem geborenen Heilbringer.
- source_word: infant
  choice: Kind
  rationale: Natürliches, würdevolles Deutsch; »Säugling« wäre anatomisch genauer, klänge hier jedoch technisch.
- source_word: condition
  choice: Zustand
  rationale: Bewahrt die verhüllende Ausdrucksweise des Zeugnisses; die folgende Handlung macht den körperlichen Prüfungscharakter deutlich.
theological_decisions:
- issue: Empfängnis vom Heiligen Geist
  choice: als Aussage Josefs direkt wiedergegeben
  alternative: durch eine erklärende oder dogmatisch ausgebaute Formulierung präzisieren
  rationale: Der Text stellt die Behauptung narrativ in Josefs Rede; die Übersetzung fügt keine spätere Lehrformel hinzu.
- issue: Personifikation des Heils
  choice: »Für Israel ist das Heil geboren worden«
  alternative: »Israels Retter ist geboren worden«
  rationale: »Heil« bewahrt die auffällige und theologisch offene Formulierung, statt sie eindeutig auf einen Personentitel festzulegen.
- issue: Jungfräuliche Geburt und körperliche Untersuchung
  choice: die anstößige körperliche Aussage nüchtern und ausdrücklich belassen
  alternative: euphemistisch abschwächen oder auslassen
  rationale: Die Erzählung macht Salomes Zweifel und ihre beabsichtigte Prüfung zum zentralen Spannungsmoment; dieser darf nicht harmonisiert werden.
- issue: »entgegen ihrer Natur«
  choice: »entgegen der menschlichen Natur« mit Fußnote
  alternative: »entgegen ihrer Natur«
  rationale: Die idiomatische Deutung meint das gewöhnliche natürliche Geschehen, während die Fußnote die engere Form des Zeugnisses dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Klang. Wiederholungen und feierliche Ausrufe bleiben erhalten. Da eine direkte Prüfung des griechischen Textes ausdrücklich noch aussteht, ist der Entwurf als vorläufige, am bereitgestellten öffentlichen englischen Zeugnis orientierte Übersetzung zu behandeln; besonders Vers 1 benötigt eine spätere textkritische Kontrolle.
