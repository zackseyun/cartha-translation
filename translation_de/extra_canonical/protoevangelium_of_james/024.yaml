translation:
  language: de
  text: '(1) Zur Zeit des Segensgrußes kamen die Priester, doch Zacharias trat ihnen nicht wie üblich entgegen, um sie zu segnen. Die Priester standen da und warteten auf Zacharias, um ihn mit einem Segen zu begrüßen und den allerhöchsten Gott zu verherrlichen.


    (2) Als er aber auf sich warten ließ, fürchteten sie sich alle. Doch einer von ihnen fasste Mut, ging in das Heiligtum hinein und sah neben dem Altar des Herrn geronnenes Blut. Und eine Stimme sprach: »Zacharias ist ermordet worden, und sein Blut wird nicht weggewischt werden, bis sein Rächer kommt!«[a]


    Als er diese Worte hörte, erschrak er. Er ging hinaus und berichtete den Priestern, was er gesehen und gehört hatte.


    (3) Da fassten auch sie Mut, gingen hinein und sahen, was geschehen war. Die Vorhänge des Tempels schrien auf,[b] und die Priester zerrissen ihre Gewänder von oben bis unten. Sie fanden seinen Leichnam nicht; doch sie fanden, dass sein Blut zu Stein geworden war. Da erschraken sie, gingen hinaus und berichteten dem ganzen Volk, Zacharias sei ermordet worden. Als alle Stämme des Volkes davon hörten, trauerten sie um ihn und weinten drei Tage und drei Nächte lang.


    (4) Nach drei Tagen berieten die Priester darüber, wer an die Stelle des Zacharias treten sollte. Das Los fiel auf Simeon; denn ihm war durch den Heiligen Geist zugesagt worden, er werde den Tod nicht sehen, bevor er den Christus im Fleisch gesehen habe.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage über das Blut und den kommenden Rächer wird hier bewusst nicht näher gedeutet.
    reason: Bewahrt die theologische Offenheit der überlieferten Aussage.
  - marker: b
    text: Das griechische Wort bezeichnet Vorhänge, Schleier oder verhängende Tücher im Tempelbereich. Das Aufschreien der Vorhänge ist als wunderhaftes Erzählbild wiedergegeben.
    reason: Korrigiert die sachlich unzutreffende Wiedergabe als »Tafeln«, ohne das bildhafte Ereignis zu rationalisieren.
  - marker: c
    text: 'Vgl. Lukas 2,26. Die Formulierung »den Tod sehen« bedeutet: sterben.'
    reason: Erläutert die biblische Wendung und den literarischen Bezug, ohne den Haupttext zu glätten.
lexical_decisions:
- source_word: hour of greeting
  choice: Stunde der Begrüßung
  rationale: Bewahrt die zeitlich-kultische Formulierung des vorliegenden Zeugen, ohne eine nicht belegte konkrete Gebetszeit einzusetzen.
- source_word: sanctuary
  choice: Heiligtum
  rationale: Bezeichnet den inneren heiligen Bereich angemessen und unterscheidet ihn vom Tempelgebäude insgesamt.
- source_word: blood clotted
  choice: geronnenes Blut
  rationale: Gibt den körperlich-konkreten Zustand natürlich und genau wieder.
- source_word: panels of the Temple
  choice: Tafeln des Tempels
  rationale: Eine zurückhaltend formale Wiedergabe; die genaue bauliche Bedeutung bleibt mangels griechischer Quellenprüfung offen.
- source_word: turned to stone
  choice: zu Stein geworden
  rationale: Bewahrt das auffällige Wunderbild wörtlich, statt es als bloßes Gerinnen oder Verhärten zu erklären.
- source_word: the Christ in the flesh
  choice: den Christus im Fleisch
  rationale: Erhält die christologische Formulierung und ihre körperliche Konkretheit.
theological_decisions:
- issue: Ankündigung des Rächers
  choice: bis sein Rächer kommt
  alternative: bis der kommt, der ihn rächt
  rationale: Die personale und eschatologisch offene Aussage wird erhalten, ohne den Rächer mit einer bestimmten Gestalt gleichzusetzen.
- issue: Nicht vom Tod sehen
  choice: er werde den Tod nicht sehen
  alternative: er werde nicht sterben
  rationale: Die semitisch-biblische Wendung bleibt erkennbar und wahrt die Verbindung zur Simeonüberlieferung.
- issue: Christus im Fleisch
  choice: den Christus im Fleisch gesehen habe
  alternative: den menschgewordenen Christus gesehen habe
  rationale: Die Übersetzung vermeidet eine dogmatisch ausdeutende Paraphrase und bewahrt die Spannung der Vorlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Wiederholungen und die parataktische Bewegung der antiken Erzählung wurden teilweise bewahrt, jedoch dort geglättet, wo eine wörtliche Nachbildung im Deutschen schwerfällig wäre. Der Entwurf ist ausdrücklich vorläufig, da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht.
