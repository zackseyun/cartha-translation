    (3) Da fassten auch sie Mut, gingen hinein und sahen, was geschehen war. Die Tafeln des Tempels schrien auf,[b] und die Priester zerrissen ihre Gewänder von oben bis unten. Sie fanden seinen Leichnam nicht; doch sie sahen, dass sein Blut zu Stein geworden war. Da erschraken sie, gingen hinaus und berichteten dem ganzen Volk, Zacharias sei ermordet worden. Als alle Stämme des Volkes davon hörten, trauerten sie um ihn und weinten drei Tage und drei Nächte lang.


