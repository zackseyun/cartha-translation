  source_fidelity: 'Revision nötig: Die griechische Überlieferung von ProtJak 20,4 enthält bei der Engelsrede eine Verneinung („berichte nicht ...“), die im vorgelegten englischen Zeugen offenbar ausgefallen ist. Der deutsche Entwurf übernimmt dadurch eine sinnverkehrende Lesart. Im Übrigen bewahrt er die Personen- und Pronomenbezüge sowie den weiten Sinn von „Rettung“ angemessen.'
  naturalness: Das Deutsch ist überwiegend klar und würdig. „Da schrie Salome auf“ und „auf einmal die Stimme“ sind natürliche erzählerische Formulierungen. Die Wiederholung von „seht“ bewahrt den emphatischen Erzählgestus, ohne unverständlich zu wirken.
  terminology: „lebendiger Gott“, „Herr“, „Engel des Herrn“ und „Rettung“ sind treffend und registergerecht. „Die Hebamme“ soll in Vers 2 beibehalten werden, da der Text sie ausdrücklich so bezeichnet und eine Gleichsetzung mit Salome nicht erzwungen werden darf.
