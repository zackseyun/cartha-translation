translation:
  language: de
  text: '(1) Und sie ging hinein und brachte sie in die richtige Lage. Dann untersuchte Salome ihren Zustand. Da schrie Salome auf: »Ich habe den lebendigen Gott auf die Probe gestellt – und seht: Meine Hand steht in Flammen und fällt von mir ab!«


    (2) Sie betete zum Herrn, und noch in jener Stunde wurde die Hebamme geheilt.


    (3) Und seht: Ein Engel des Herrn trat vor Salome und sagte: »Dein Gebet ist vor Gott, dem Herrn, erhört worden. Geh, berühre das Kind, dann wirst du Rettung empfangen.«


    (4) Das tat sie, und Salome wurde geheilt. Während sie anbetete und die Höhle verließ, erklang auf einmal die Stimme eines Engels des Herrn: »Salome, Salome! Berichte nicht von den wunderbaren Dingen, die du gesehen hast, bis das Kind nach Jerusalem kommt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: positioned her
  choice: brachte sie in die richtige Lage
  rationale: Gibt die für eine Untersuchung nötige Positionierung natürlich wieder, ohne die nicht ausdrücklich genannte Person näher zu bestimmen.
- source_word: examined her condition
  choice: untersuchte ihren Zustand
  rationale: Bewahrt die zurückhaltende und mehrdeutige Formulierung des Zeugen, statt die Art der Untersuchung expliziter auszumalen.
- source_word: tested the living God
  choice: habe den lebendigen Gott auf die Probe gestellt
  rationale: Die idiomatische Wendung gibt den Vorwurf vermessenen Prüfens wieder und wahrt den theologischen Ernst.
- source_word: look
  choice: seht / auf einmal
  rationale: In direkter Rede wird der Aufmerksamkeitsruf mit »seht« erhalten; im Erzählfluss von Vers 4 wird seine plötzliche, hervorhebende Funktion natürlicher mit »auf einmal« ausgedrückt.
- source_word: salvation
  choice: Rettung
  rationale: Bewahrt den weiten Bedeutungsraum zwischen leiblicher Heilung und umfassenderem Heil, ohne ihn konfessionell einzuengen.
- source_word: report the wonderful things
  choice: Berichte von den wunderbaren Dingen
  rationale: Bleibt nahe am Zeugnischarakter und vermeidet eine unnötig interpretierende Wiedergabe wie »Wunder«.
theological_decisions:
- issue: Unklare Pronomenbezüge und Wechsel zwischen Salome und »der Hebamme«
  choice: Die Pronomen und die Bezeichnung »die Hebamme« bleiben erhalten.
  alternative: Salome ausdrücklich mit der Hebamme gleichsetzen oder die jeweils gemeinte Frau benennen.
  rationale: Der vorgelegte Zeuge lässt die Identität beziehungsweise den Bezug teilweise offen; die Übersetzung löst diese Spannung nicht stillschweigend auf.
- issue: Bedeutung der verheißenen Rettung
  choice: »Rettung empfangen«
  alternative: »geheilt werden« oder »das Heil empfangen«
  rationale: »Rettung« lässt sowohl die unmittelbar folgende körperliche Heilung als auch einen umfassenderen theologischen Sinn zu.
- issue: Anbetung in Vers 4
  choice: »Während sie anbetete« ohne ausdrücklich genanntes Objekt
  alternative: »Während sie das Kind anbetete« oder »Gott anbetete«
  rationale: Das Objekt ist im vorgelegten Zeugen nicht genannt und wird daher nicht ergänzt.
- issue: Zeitliche Aussage »until the child comes into Jerusalem«
  choice: »bis das Kind nach Jerusalem kommt«
  alternative: »bevor das Kind nach Jerusalem kommt«
  rationale: Die ungewöhnliche zeitliche Formulierung wird bewahrt, statt sie zu einer eindeutigen Frist umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung des griechischen Textes vorläufig und folgt quellenbewusst dem bereitgestellten gemeinfreien englischen Zeugen. Echte Mehrdeutigkeiten wurden nicht durch erläuternde Zusätze beseitigt.
