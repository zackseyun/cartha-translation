review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung erforderlich: »von dem Trauergewand« verfehlt die wiederholte Bezugnahme der Vorlage auf das Sacktuch, von dem Josef anschließend aufsteht. Auch die Einfügung des Namens Maria ist im gegebenen Textzeugen nicht vorhanden. »von seiner Bauarbeit zurück« engt »from his building« unnötig als Rückkehr von einer einzelnen Bauarbeit ein; »von seinen Bauarbeiten« wahrt den beruflich-baulichen Bezug ohne diese Zusatzannahme.'
  naturalness: Die überarbeitete Fassung ist modernes, würdiges Standarddeutsch. »Welches Gebet kann ich … sprechen?« ist idiomatischer als »Was kann ich … beten?«. »vom Sacktuch« ist bewusst konkret und entspricht dem Trauerzeichen der Vorlage.
  terminology: »Allerheiligstes«, »Jungfrau«, »rein« und der Euphemismus »einen Mann erkennen« bleiben erhalten. »entweiht« gibt das hier gemeinte Schänden/Verunreinigen wieder, ohne eine bestimmte Art des Übergriffs hinzuzufügen. Die Fußnote bleibt an der einschlägigen Aussage verankert.
  issues:
  - severity: medium
    issue: »Josef erhob sich von dem Trauergewand«
    rationale: Ein Trauergewand ist Kleidung; die Vorlage bezieht sich an dieser Stelle auf das Sacktuch, auf bzw. von dem Josef liegt oder aufsteht. Die deutsche Formulierung ist daher sachlich und syntaktisch missverständlich.
  - severity: low
    issue: Einfügung von »Maria« in Vers 2
    rationale: Der vorgelegte englische Zeuge sagt lediglich, Josef rief sie. Die Identität ist klar, doch die Namensnennung ist ein nicht erforderlicher Zusatz.
  - severity: low
    issue: »von seiner Bauarbeit zurück«
    rationale: Der Zeuge spricht von seinem Bau/Gebäude bzw. baulichen Arbeiten, nicht ausdrücklich von der Rückkehr von einer einzelnen Bauarbeit. Die Pluralform ist weniger einengend.
  revised_text: '(1) Sie war im sechsten Monat. Und sieh: Josef kam von seinen Bauarbeiten, ging ins Haus und fand sie schwanger. Da schlug er sich ins Gesicht, warf sich auf ein Sacktuch zu Boden und weinte bitterlich. Er sagte: »Wie kann ich zum Herrn, meinem Gott, aufblicken? Welches Gebet kann ich wegen dieses jungen Mädchens sprechen? Denn ich habe sie als Jungfrau aus dem Tempel des Herrn, meines Gottes, übernommen und sie nicht beschützt. Wer hat mir diese Falle gestellt? Wer hat dieses Böse in meinem Haus getan? Wer hat die Jungfrau entweiht? Widerfährt mir nicht dasselbe wie Adam? Denn während Adam zur Stunde des Gebets Gott verherrlichte, kam die Schlange, fand Eva allein und täuschte sie. Und nun ist es mir ebenso ergangen!«


    (2) Josef erhob sich vom Sacktuch, rief sie und sagte zu ihr: »Gott hat für dich Sorge getragen. Warum hast du das getan? Du hast den Herrn, deinen Gott, vergessen. Warum hast du dich selbst erniedrigt? Du bist im Allerheiligsten ernährt worden und hast Nahrung aus der Hand eines Engels empfangen!«


    (3) Da weinte sie bitterlich und sagte: »Ich bin rein und habe keinen Mann erkannt!«[a]


    Josef sagte zu ihr: »Woher kommt dann das in deinem Leib?«


    Sie sagte: »So wahr der Herr, mein Gott, lebt: Ich weiß nicht, woher es kommt!«'
  revised_footnotes:
  - marker: a
    text: »Einen Mann erkennen« ist eine biblische Umschreibung für geschlechtlichen Verkehr.
    reason: Der bewusst beibehaltene Euphemismus könnte ohne Erklärung missverstanden werden.
  revision_rationale: Die Revision behebt die sachlich problematische Wiedergabe des Sacktuchs, entfernt die nicht im Textzeugen stehende Namensnennung und vermeidet eine zu enge Deutung von Josefs Bauarbeit. Sie bewahrt die harte, anklagende Sprache Josefs sowie die distanzierende Umschreibung für die Schwangerschaft. Da eine unmittelbare Prüfung der griechischen Handschriftenüberlieferung weiterhin aussteht, folgt die Wortwahl im Übrigen eng dem vorgelegten englischen Zeugen und vermeidet weitergehende historische oder theologische Festlegungen.
