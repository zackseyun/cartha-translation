base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: de
  text: '(1) Sie war im sechsten Monat. Und sieh: Josef kam von seiner Bauarbeit zurück, ging ins Haus und fand sie schwanger. Da schlug er sich ins Gesicht, warf sich im Trauergewand zu Boden und weinte bitterlich. Er sagte: »Wie kann ich vor den Herrn, meinen Gott, treten? Was kann ich wegen dieses jungen Mädchens beten? Denn ich habe sie als Jungfrau aus dem Tempel des Herrn, meines Gottes, übernommen und sie nicht beschützt. Wer hat mir diese Falle gestellt? Wer hat diese böse Tat in meinem Haus begangen? Wer hat die Jungfrau geschändet? Wiederholt sich an mir nicht die Geschichte Adams? Denn während Adam zur Stunde des Gebets Gott verherrlichte, kam die Schlange, fand Eva allein und täuschte sie. Und nun ist es auch mir so ergangen!«


    (2) Josef erhob sich von dem Trauergewand, rief Maria zu sich und sagte zu ihr: »Gott hat für dich Sorge getragen. Warum hast du das getan? Du hast den Herrn, deinen Gott, vergessen. Warum hast du dich selbst erniedrigt? Du bist im Allerheiligsten ernährt worden und hast Nahrung aus der Hand eines Engels empfangen!«


    (3) Da weinte sie bitterlich und sagte: »Ich bin rein und habe keinen Mann erkannt!«[a]


    Josef sagte zu ihr: »Woher kommt dann das, was du in deinem Leib trägst?«


    Sie sagte: »So wahr der Herr, mein Gott, lebt: Ich weiß nicht, woher es kommt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Einen Mann erkennen« ist eine biblische Umschreibung für geschlechtlichen Verkehr.
    reason: Der bewusst beibehaltene Euphemismus könnte ohne Erklärung missverstanden werden.
lexical_decisions:
- source_word: from his building
  choice: von seiner Bauarbeit zurück
  rationale: Der Ausdruck bezeichnet im Zusammenhang am ehesten Josefs Tätigkeit an einem Bau; »von seinem Gebäude« wäre im Deutschen missverständlich.
- source_word: in sackcloth
  choice: im Trauergewand
  rationale: »Sacktuch« wäre formaler, klingt im modernen Deutschen jedoch leicht gegenständlich; »Trauergewand« vermittelt die Funktion des Buß- und Trauerzeichens.
- source_word: look!
  choice: Und sieh
  rationale: Bewahrt den erzählerischen Aufmerksamkeitssignalton in würdiger, verständlicher Form.
- source_word: humiliated your soul
  choice: dich selbst erniedrigt
  rationale: Das semitisch gefärbte »deine Seele erniedrigt« bezeichnet hier die eigene Person; die natürliche deutsche Wiedergabe wahrt den Vorwurf, ohne ihn weiter auszudeuten.
- source_word: known a man
  choice: keinen Mann erkannt
  rationale: Bewahrt den biblischen Euphemismus für geschlechtlichen Verkehr; eine Fußnote klärt ihn.
- source_word: this thing in your womb
  choice: das, was du in deinem Leib trägst
  rationale: Gibt Josefs distanzierte Umschreibung natürlich wieder, ohne die Schwangerschaft stärker zu deuten als die Vorlage.
theological_decisions:
- issue: Marias Aussage über ihre Reinheit
  choice: »Ich bin rein«
  alternative: »Ich bin unschuldig«
  rationale: »Rein« bewahrt die kultisch-moralische Färbung und lässt offen, ob vor allem sexuelle Unberührtheit oder umfassendere Unschuld gemeint ist.
- issue: Gottes bisheriges Handeln an Maria
  choice: »Gott hat für dich Sorge getragen«
  alternative: »Gott hat sich deiner angenommen«
  rationale: Die Formulierung erhält den Gedanken göttlicher Fürsorge, ohne daraus eine spezifische Lehre über Erwählung oder Gnadenstand abzuleiten.
- issue: Adams Tätigkeit zur Gebetsstunde
  choice: »Gott verherrlichte«
  alternative: »Lobpreis darbrachte«
  rationale: Die ungewöhnliche Aussage bleibt erkennbar und wird nicht mit einer bestimmten liturgischen Handlung gleichgesetzt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem erzählerischem Ton. Die häufigen Satzanschlüsse der Vorlage wurden teilweise bewahrt, aber für flüssiges Deutsch behutsam gegliedert. Da eine direkte Prüfung des griechischen Textes noch aussteht, ist die Fassung als quellennaher vorläufiger Entwurf auf Grundlage des angegebenen öffentlichen englischen Textzeugen zu verstehen.
