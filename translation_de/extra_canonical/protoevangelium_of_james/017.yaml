review_pass:
  verdict: revise
  source_fidelity: Eine Revision ist erforderlich. Der Entwurf gibt die rätselhafte Aussage Marias als »zwei Völker« wieder, während der bereitgestellte englische Zeuge sowohl im Ausgangstext als auch in der englischen POB-Fassung eindeutig von »two people« spricht. Da die unmittelbare griechische Prüfung laut Kontext noch aussteht, darf eine abweichende griechische Lesart nicht gegen den vorliegenden Zeugen in den deutschen Text eingetragen werden. Auch die Fußnote behauptet eine nicht durch die bereitgestellte Quelle abgesicherte griechische Wortwahl. Die übrigen Änderungen präzisieren einzelne Nuancen, ohne den Sinn zu verändern.
  naturalness: Die revidierte Fassung bleibt modernes Standarddeutsch mit schlichtem, würdigem Erzählton. »Wie soll ich sie registrieren?« und »in deiner beschämenden Lage Schutz geben« sind natürlicher und näher an der jeweiligen Aussage als die vorherigen Umschreibungen. Die bewusst befremdliche Formel »zwei Menschen in meinen Augen« bleibt absichtlich erhalten.
  terminology: »Registrieren« bildet den Verwaltungsvorgang klar ab. »Menschen« folgt dem vorliegenden Zeugen. »Beschämende Lage« wahrt bei ἀσχημοσύνη den Bereich von Scham/Unschicklichkeit, ohne die Szene unnötig körperlich zu konkretisieren. Namen und die Formel »Tag des Herrn« werden beibehalten.
  issues:
  - severity: high
    issue: »zwei Völker« statt »zwei Menschen«
    rationale: Der bereitgestellte Ausgangszeuge und die englische POB-Audit-Fassung lesen »two people«. Die abweichende Wiedergabe verändert das Bild und führt eine mögliche Deutung bzw. eine unbestätigte Lesart ein.
  - severity: high
    issue: Fußnote a behauptet eine nicht belegte griechische Lesart
    rationale: Die Fußnote erklärt, die griechische Überlieferung habe ein gewöhnlich »Völker« bedeutendes Wort. Dies steht im Widerspruch zum bereitgestellten Zeugen und ist angesichts der ausdrücklich noch ausstehenden direkten griechischen Prüfung nicht sicher vertretbar.
  - severity: medium
    issue: »deine Blöße verbergen« ist zu eng und verändert die Satzhandlung
    rationale: Der Zeuge fragt, wo Josef Maria unterbringen und ihr in ihrer »awkwardness« Schutz geben könne. Die Formulierung mit »Blöße verbergen« legt körperliche Entblößung stärker fest und lässt den Aspekt des Schutzgebens zurücktreten.
  - severity: low
    issue: »Das wäre mir eine Schande«
    rationale: Die Vorlage sagt unmittelbar »Ich schäme mich«. Die direkte Formulierung bewahrt Josefs persönliches Schamempfinden genauer.
  revised_text: '**Kapitel 17 – Die Volkszählung**


    **(1)** Nun erging von König Augustus der Befehl, die Menschen in Bethlehem in Judäa zu registrieren.


    Josef sagte: »Ich werde meine Söhne registrieren. Aber was soll ich mit diesem Kind tun? Wie soll ich sie registrieren? Als meine Frau? Ich schäme mich. Als meine Tochter? Doch das Volk Israel weiß, dass sie nicht meine Tochter ist. Dies ist der Tag des Herrn; ich werde tun, was der Herr will.«


    **(2)** Dann sattelte er den Esel und setzte sie darauf. Sein Sohn führte ihn, und Samuel folgte.


    Als sie sich der dritten Meile näherten, wandte Josef sich um und sah, dass sie traurig war. Er sagte bei sich: »Wahrscheinlich macht ihr der, der in ihr ist, zu schaffen.«


    Als Josef sich wieder umwandte, sah er sie lachen. Er fragte sie: »Maria, warum bist du so, dass ich dein Gesicht einmal lachen sehe und dann traurig?«


    Sie antwortete ihm: »Weil ich in meinen Augen zwei Menschen sehe:[a] Der eine weint und trauert, der andere freut sich und jubelt.«


    **(3)** Als sie in die Mitte des Weges kamen, sagte Maria zu ihm: »Josef, hilf mir vom Esel herunter, denn der, der in mir ist, drängt darauf, herauszukommen.«


    Er half ihr vom Esel herunter und sagte zu ihr: »Wohin soll ich dich bringen, um dir in deiner beschämenden Lage Schutz zu geben?[b] Dieser Ort ist eine Einöde.«'
