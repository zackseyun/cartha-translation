translation:
  language: de
  text: '**Kapitel 17 – Die Volkszählung**


    **(1)** Nun erging von König Augustus der Befehl, alle Einwohner Bethlehems in Judäa in die Listen einzutragen.


    Da sagte Josef: »Meine Söhne werde ich eintragen lassen. Aber was soll ich mit diesem Kind tun? Als was soll ich sie eintragen lassen? Als meine Frau? Das wäre mir eine Schande. Als meine Tochter? Doch das Volk Israel weiß, dass sie nicht meine Tochter ist. Dies ist der Tag des Herrn; ich werde tun, was der Herr will.«


    **(2)** Dann sattelte er den Esel, setzte Maria darauf, und sein Sohn führte ihn; Samuel folgte ihnen.


    Als sie sich der dritten Meile näherten, wandte Josef sich um und sah, dass Maria traurig war. Da dachte er: »Wahrscheinlich macht ihr der zu schaffen, der in ihr ist.«


    Als Josef sich wieder umwandte, sah er sie lachen. Er fragte sie: »Maria, was ist mit dir, dass ich dein Gesicht einmal lachen sehe und dann wieder traurig?«


    Sie antwortete ihm: »Ich sehe nämlich in meinen Augen zwei Völker:[a] Das eine weint und trauert, das andere freut sich und jubelt.«


    **(3)** Als sie die Mitte des Weges erreicht hatten, sagte Maria zu ihm: »Josef, hilf mir vom Esel herunter; denn der, der in mir ist, drängt darauf, herauszukommen.«


    Er half ihr vom Esel herunter und sagte zu ihr: »Wohin soll ich dich bringen, damit ich dich unterbringen und deine Blöße verbergen kann?[b] Dieser Ort ist eine Einöde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bewusst ungewöhnlich: »Ich sehe in meinen Augen zwei Völker.« Manche Übersetzungen geben »zwei Menschen« wieder; die griechische Überlieferung hat hier jedoch ein Wort, das gewöhnlich »Völker« bedeutet.'
    reason: Erklärt die auffällige Wendung, ohne ihre Bildsprache oder mögliche prophetische Bedeutung aufzulösen.
  - marker: b
    text: Das zugrunde liegende Wort kann körperliche Blöße, Scham oder eine als unschicklich empfundene Lage bezeichnen; gemeint ist hier offenbar Marias bevorstehende Niederkunft an einem ungeschützten Ort.
    reason: Die Bedeutungsbreite lässt sich mit einem einzigen natürlichen deutschen Ausdruck nicht vollständig abbilden.
lexical_decisions:
- source_word: ἀπογράφεσθαι (as reflected in the Greek tradition)
  choice: in die Listen einzutragen
  rationale: Gibt den Verwaltungsvorgang einer Registrierung wieder, ohne ihn vorschnell mit einer modernen Volkszählung gleichzusetzen; die Kapitelüberschrift verwendet den geläufigen Sammelbegriff.
- source_word: δύο λαούς (as reflected in the Greek tradition)
  choice: zwei Völker
  rationale: Der Plural λαοί bezeichnet eher Völker bzw. Volksgruppen als lediglich zwei einzelne Menschen. Die bewusst ungewöhnliche Verbindung mit »in meinen Augen« bleibt erhalten.
- source_word: ἀσχημοσύνη (as reflected in the Greek tradition)
  choice: Blöße
  rationale: Bewahrt den Bedeutungsbereich von körperlicher Entblößung, Scham und als unschicklich empfundener Lage. Eine bloße Wiedergabe mit »Schwierigkeiten« wäre zu unbestimmt.
- source_word: ἔρημος (as reflected in the Greek tradition)
  choice: Einöde
  rationale: Bezeichnet einen verlassenen, unbewohnten Ort; »Einöde« ist hier natürlicher als »Wüste« und legt keine bestimmte Landschaftsform fest.
- source_word: ὁ ἐν αὐτῇ / ὁ ἐν ἐμοί (as reflected in the supplied witness)
  choice: der, der in ihr ist / der, der in mir ist
  rationale: Die personale und zugleich verhüllende Ausdrucksweise für das ungeborene Kind wird beibehalten.
theological_decisions:
- issue: Die zwei Völker in Marias Schau
  choice: Die Aussage bleibt als rätselhafte Vision zweier Völker stehen.
  alternative: Die Völker ausdrücklich als Israel und die Heiden oder als Glaubende und Ungläubige bestimmen.
  rationale: Der Abschnitt selbst benennt die beiden Völker nicht. Eine konkrete heilsgeschichtliche Identifizierung würde eine Auslegung in den Text eintragen.
- issue: »Tag des Herrn«
  choice: Die überlieferte Formulierung wird ohne Erklärung oder zeitliche Umdeutung bewahrt.
  alternative: Als Sabbat, Festtag oder unmittelbare göttliche Entscheidungssituation erklären.
  rationale: Der Kontext legt keine eindeutige fachliche Bedeutung fest; die theologische Spannung soll erhalten bleiben.
- issue: Josefs Bezeichnung Marias als mögliche Frau oder Tochter
  choice: Sein Dilemma und sein Schamempfinden werden direkt wiedergegeben.
  alternative: Das Verhältnis durch eine harmonisierende Bezeichnung wie »Verlobte« eindeutig festlegen.
  rationale: Die Passage stellt gerade die Unsicherheit der amtlichen Zuordnung heraus und sollte nicht konfessionell oder harmonisierend geglättet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die häufigen Satzverbindungen des antiken Berichts wurden teilweise geglättet, ohne die schlichte, fortschreitende Erzählweise aufzugeben. Da die direkte Prüfung am griechischen Ausgangstext laut Projektangabe noch aussteht, ist der Entwurf anhand des bereitgestellten öffentlichen englischen Zeugen und der darin bezeichneten griechischen Überlieferung formuliert; besonders textnahe Entscheidungen sollten vor der Veröffentlichung nochmals am edierten griechischen Text geprüft werden.
