translation:
  language: de
  text: '**Protoevangelium des Jakobus — Kapitel 15: Der Hohe Priester befragt Maria und Josef**


    **(1)** Da kam der Schriftgelehrte Annas zu ihm und sagte: »Josef, warum hast du dich unserer Reisegesellschaft nicht angeschlossen?«


    Er antwortete ihm: »Weil ich von der Reise erschöpft war und mich am ersten Tag nach meiner Rückkehr ausruhte.«


    Da wandte sich Annas um und sah, dass Maria schwanger war.


    **(2)** Sogleich ging er zum Priester und sagte zu ihm: »Josef, für den du Zeugnis abgelegt hast, hat höchst gesetzlos gehandelt.«


    Der Priester fragte: »Was ist geschehen?«


    Er antwortete: »Die Jungfrau, die Josef aus dem Tempel des Herrn übernommen hat, hat er entehrt. Er hat ihre Hochzeit gestohlen[a] und es dem Volk Israel nicht bekannt gemacht.«


    Darauf fragte der Priester: »Hat Josef das getan?«


    Der Schriftgelehrte Annas sagte zu ihm: »Schick Gerichtsbedienstete hin, dann wirst du die Jungfrau schwanger vorfinden.«


    Die Gerichtsbediensteten gingen hin und fanden sie so vor, wie er gesagt hatte. Dann führten sie Maria zusammen mit Josef vor das Gericht.


    **(3)** Der Hohe Priester sagte zu ihr: »Maria, warum hast du das getan? Warum hast du deine Seele erniedrigt und den Herrn, deinen Gott, vergessen? Du bist im Allerheiligsten aufgewachsen, hast Nahrung aus der Hand eines Engels empfangen, seine Lobgesänge gehört und vor ihm getanzt.[b] Was hast du da getan?«


    Da weinte sie bitterlich und sagte: »So wahr der Herr, Gott, lebt: Ich bin vor Gott rein und habe keinen Mann erkannt!«[c]


    **(4)** Der Priester sagte: »Josef, was hast du da getan?«


    Josef antwortete: »So wahr der Herr, mein Gott, lebt und Gottes Wahrheit mein Zeuge ist: Ich bin ihr gegenüber rein.«[d]


    Der Priester sagte: »Lege kein falsches Zeugnis ab, sondern sage die Wahrheit! Du hast ihre Hochzeit gestohlen[a] und es dem Volk Israel nicht bekannt gemacht. Auch hast du dein Haupt nicht unter die mächtige Hand gebeugt, die deine Nachkommen segnen sollte.«[e]


    Da schwieg Josef.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugnis: »ihre Hochzeit gestohlen«. Gemeint sein könnte, dass Josef die Eheschließung eigenmächtig oder heimlich vollzogen habe; die ungewöhnliche Formulierung bleibt jedoch bewusst erhalten.'
    reason: Kennzeichnet eine auffällige, mehrdeutige Wendung, deren griechische Grundlage noch direkt zu prüfen ist.
  - marker: b
    text: Das vorliegende englische Zeugnis lautet ungewöhnlich »hörtest ihre/seine Lobgesänge und tanztest davor«. Die deutsche Fassung bezieht die Pronomen vorläufig auf den Engel. Eine Prüfung am griechischen Text steht noch aus.
    reason: Macht die für natürliches Deutsch notwendige, aber vorläufige Bezugsentscheidung transparent.
  - marker: c
    text: »Einen Mann erkennen« ist eine biblisch geprägte Umschreibung für geschlechtlichen Verkehr.
    reason: Erklärt eine traditionelle idiomatische Wendung, die im modernen Deutsch missverstanden werden könnte.
  - marker: d
    text: Die ungewöhnliche Aussage »ihr gegenüber rein« wird nicht zu »ich habe sie nicht berührt« oder »ich bin unschuldig« vereindeutigt.
    reason: Bewahrt die sprachliche und theologische Offenheit der Vorlage.
  - marker: e
    text: Der genaue Sinn der »mächtigen Hand«, unter die Josef sein Haupt hätte beugen sollen und die seine Nachkommen segnen sollte, bleibt im vorliegenden Zeugnis offen.
    reason: Verhindert, dass eine unsichere kultische oder theologische Deutung in den Haupttext eingetragen wird.
lexical_decisions:
- source_word: traveling group
  choice: Reisegesellschaft
  rationale: Gibt die gemeinsame Reisegruppe in natürlichem, modernem Deutsch wieder, ohne eine organisierte Karawane vorauszusetzen.
- source_word: acted very lawlessly
  choice: höchst gesetzlos gehandelt
  rationale: Bewahrt den starken rechtlich-moralischen Vorwurf, ohne ihn auf eine bestimmte einzelne Straftat einzuengen.
- source_word: stolen her wedding
  choice: ihre Hochzeit gestohlen
  rationale: Die auffällige und im vorliegenden Zeugnis nicht eindeutig auflösbare Wendung wird bewusst formal bewahrt und durch eine Fußnote gekennzeichnet.
- source_word: officers
  choice: Gerichtsbedienstete
  rationale: Passt zum Auftrag, die Beschuldigten vor das Gericht zu führen, und vermeidet den modernen Eindruck gewöhnlicher Polizeibeamter.
- source_word: known a man
  choice: einen Mann erkannt
  rationale: Bewahrt die biblisch geprägte Umschreibung für Geschlechtsverkehr und den feierlichen Ton der Aussage.
- source_word: pure toward her
  choice: ihr gegenüber rein
  rationale: Erhält Josefs ungewöhnliche, relationale Formulierung, ohne sie zu einer ausdrücklicheren Unschuldsbehauptung umzudeuten.
- source_word: mighty hand
  choice: mächtige Hand
  rationale: Bewahrt das traditionelle biblische Bild und seine mögliche theologische Resonanz.
theological_decisions:
- issue: Marias Reinheit und die Aussage, sie habe keinen Mann erkannt
  choice: Die beiden Aussagen werden unmittelbar und ohne harmonisierende Erklärung wiedergegeben.
  alternative: Die Aussage ausdrücklich als Behauptung sexueller Jungfräulichkeit erläutern.
  rationale: Der Text selbst verbindet Reinheit und Nichterkennen eines Mannes, lässt aber seine eigene rhetorische und theologische Spannung stehen.
- issue: Engel, Lobgesänge und Tanz
  choice: Die im Deutschen erforderlichen Pronomen werden auf den Engel bezogen, jedoch mit einer Fußnote als vorläufige Deutung markiert.
  alternative: Unpersönlich oder mit wechselndem Bezug übersetzen.
  rationale: Das englische Zeugnis hat das auffällige Pronomen „it“; idiomatisches Deutsch verlangt hier eine Bezugsentscheidung. Eine direkte Prüfung des Griechischen steht noch aus.
- issue: Segen der Nachkommen unter der mächtigen Hand
  choice: Die schwer verständliche Formulierung bleibt weitgehend wörtlich erhalten.
  alternative: Sie als priesterlichen Hochzeitssegen oder als Unterwerfung unter Gottes Hand auslegen.
  rationale: Der verfügbare Text erlaubt keine sichere Entscheidung zwischen möglichen kultischen, ehelichen oder theologischen Bezügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher direkter Rede. Die wiederholten Satzanschlüsse der antiken Erzählweise wurden überwiegend bewahrt, aber dort geglättet, wo eine durchgehende Folge von »und« im Deutschen schwerfällig wäre. Die Übersetzung ist ausdrücklich vorläufig, da als Arbeitsgrundlage nur das angegebene gemeinfreie englische Zeugnis vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht.
