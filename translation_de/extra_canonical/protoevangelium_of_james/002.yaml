  yaml_path: translation/extra_canonical/protoevangelium_of_james/002.yaml
  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: de
  text: '**Protoevangelium des Jakobus – Kapitel 2: Annas Not**


    (1) Seine Frau Anna trauerte und klagte aus zwei Gründen. Sie sagte: »Ich klage darüber, dass ich Witwe bin, und darüber, dass ich kein Kind habe.«


    (2) Nun nahte der große Tag des Herrn, und ihre Dienerin Juthine sagte zu ihr: »Wie lange willst du deine Seele noch demütigen? Sieh doch, der große Tag des Herrn ist nahe, und da ziemt es sich nicht, dass du trauerst. Nimm vielmehr dieses Stirnband, das mir die Leiterin der Werkstatt gegeben hat. Ich darf es nicht tragen, weil ich deine Dienerin bin und es ein königliches Zeichen trägt.«[a]


    (3) Anna erwiderte: »Geh weg von mir! Das werde ich nicht tun. Der Herr, Gott, hat mich tief gedemütigt. Vielleicht hat dir ein Betrüger dieses Band gegeben, und nun bist du gekommen, um mich an deiner Sünde teilhaben zu lassen.«


    Da sagte die Dienerin Juthine: »Warum sollte ich dich verfluchen, wo du doch nicht auf meine Stimme gehört hast? Der Herr, Gott, hat deinen Mutterleib unfruchtbar gemacht, sodass du in Israel keine Frucht hervorbringst.«


    (4) Anna wurde darüber sehr betrübt. Sie legte ihr Trauergewand ab, wusch sich den Kopf und zog ihr Hochzeitsgewand an. Etwa um die neunte Stunde[b] ging sie in ihren Garten hinunter, um dort umherzugehen. Sie sah einen Lorbeerbaum und setzte sich darunter. Nachdem sie sich ausgeruht hatte, flehte sie zum Herrn: »Gott meiner Vorfahren, segne mich und erhöre mein Gebet, wie du unsere Mutter Sara gesegnet und ihr einen Sohn, Isaak, geschenkt hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Art des Stirnbands, der »Werkstatt« und des königlichen Zeichens ist im zugrunde liegenden englischen Zeugnis nicht näher bestimmt; die Wiedergabe bedarf noch der Prüfung am griechischen Text.
    reason: Kennzeichnet eine lexikalisch und textgeschichtlich unsichere Stelle, ohne im Haupttext eine bestimmte Rekonstruktion vorzutäuschen.
  - marker: b
    text: Das heißt ungefähr um 15 Uhr.
    reason: Erläutert die antike Stundenangabe für heutige Leserinnen und Leser.
lexical_decisions:
- source_word: widow
  choice: Witwe
  rationale: Die auffällige Aussage des vorliegenden Zeugnisses wird wörtlich bewahrt und nicht anhand des Erzählzusammenhangs geglättet.
- source_word: humiliate your soul
  choice: deine Seele demütigen
  rationale: Die semitisch-biblisch anmutende Wendung bleibt in ihrer körperlich-seelischen Bedeutung offen; eine Deutung wie »dich durch Trauer quälen« wäre enger.
- source_word: headband
  choice: Stirnband
  rationale: Bezeichnet knapp und verständlich einen am Kopf getragenen Schmuck, ohne seine genaue, im Zeugnis nicht geklärte Form festzulegen.
- source_word: leader of the workplace
  choice: Leiterin der Werkstatt
  rationale: Eine möglichst formnahe, im Kontext verständliche Wiedergabe der nur mittelbar überlieferten Berufs- bzw. Werkstattbezeichnung; das Geschlecht wird aus dem Zusammenhang einer Trägerin des Stirnbands erschlossen, bleibt jedoch textkritisch zu prüfen.
- source_word: royal mark
  choice: königliches Zeichen
  rationale: Bewahrt die Mehrdeutigkeit zwischen Kennzeichen, Siegel, Abzeichen oder Verzierung.
- source_word: wedding garment
  choice: Hochzeitsgewand
  rationale: Formnah und weniger deutend als »Festkleid« oder »Brautkleid«.
- source_word: petitioned the Lord
  choice: flehte sie zum Herrn
  rationale: Natürliches, würdevolles Deutsch, das die Dringlichkeit des Bittens ausdrückt.
- source_word: fruit in Israel
  choice: in Israel keine Frucht hervorbringst
  rationale: Die bildhafte und theologisch spannungsreiche Rede von Nachkommenschaft als »Frucht« wird erhalten.
theological_decisions:
- issue: Göttliche Verursachung von Annas Unfruchtbarkeit
  choice: »Der Herr, Gott, hat deinen Mutterleib unfruchtbar gemacht«
  alternative: »Der Herr, Gott, hat zugelassen, dass dein Mutterleib unfruchtbar ist«
  rationale: Die direkte Zuschreibung des Zeugnisses wird nicht durch eine theologische Abschwächung ersetzt.
- issue: Annas Bezeichnung als Witwe
  choice: Die Selbstbezeichnung »Witwe« bleibt stehen.
  alternative: Eine kontextuelle Glättung wie »verlassen« oder »wie eine Witwe«
  rationale: Die echte erzählerische Spannung soll bewahrt und nicht stillschweigend aufgelöst werden.
- issue: Anrede Gottes
  choice: »Gott meiner Vorfahren«
  alternative: »Gott meiner Väter«
  rationale: Die inklusive deutsche Bezeichnung gibt die Herkunfts- und Bundeslinie natürlich wieder, ohne die anschließende ausdrückliche Berufung auf die Ahnmutter Sara zu verdecken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Biblisch geprägte Schlüsselbilder wie »Seele demütigen«, »Frucht in Israel« und »neunte Stunde« bleiben erhalten. Da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht, ist der Entwurf ausdrücklich vorläufig und folgt dem bereitgestellten gemeinfreien englischen Zeugnis als transparenter Brücke.
