- from: '(1) Am nächsten Tag brachte Joachim seine Gaben dar und sagte sich: »Wenn der Herr, Gott, sich mit mir versöhnt hat, wird mir das Stirnblatt des Priesters[a] Gewissheit geben.« Joachim brachte seine Gaben dar und achtete auf das Stirnblatt des Priesters, als dieser zum Altar des Herrn hinaufging. Er sah keine Sünde daran.[b] Da sagte Joachim: »Jetzt weiß ich, dass der Herr, Gott, sich mit mir versöhnt und alle meine Sünden von mir genommen hat.« Gerechtfertigt ging er vom Tempel des Herrn hinab und kehrte in sein Haus zurück.


    (2) Etwa sechs Monate waren vergangen; im siebten Monat gebar Anna. Sie fragte ihre Hebamme: »Was ist es?«


