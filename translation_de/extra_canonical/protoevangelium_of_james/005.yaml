review_pass:
  verdict: revise
  source_fidelity: 'Überarbeitung nötig: Gegenüber der griechischen Überlieferung ist die entscheidende Aussage über Joachim als Reinigung (nicht als Versöhnung) wiederzugeben. Ferner bezieht sich das Hinaufgehen zum Altar auf Joachim, und die Sünde wird „an/in ihm selbst“, nicht am Stirnblatt, nicht gesehen. Die Bezeichnung des Stirnblatts und „gerechtfertigt“ sind grundsätzlich sachgerecht.'
  naturalness: Der Entwurf ist überwiegend flüssig und würdig. „Er sah keine Sünde daran“ ist jedoch im Deutschen sowohl unnatürlich als auch sinnverschiebend. „Als die Tage ihrer Reinigung erfüllt waren“ legt mehr aus als der Text sagt; „als ihre Tage erfüllt waren“ bewahrt die knappe Formulierung. Die ungewöhnliche Aussage über Annas Seele darf als solche erkennbar bleiben.
  terminology: „Stirnblatt“, „Sünde“, „gerechtfertigt“ und „Maria“ sind passend. „Sich mit mir versöhnt“ ist für das griechische Reinigungsverb nicht haltbar und wird durch „mich gereinigt“ ersetzt. Die Fußnoten werden auf die tatsächlich verbleibenden sprachlichen bzw. sachlichen Unklarheiten beschränkt.
  issues:
  - severity: high
    issue: „sich mit mir versöhnt hat“ statt „mich gereinigt hat“
    rationale: Die griechische Formulierung κεκαθάρισταί με bezeichnet Reinigung. Die englische Zeugnisgrundlage („reconciled“) ist hier gegenüber dem griechischen Text weniger genau.
  - severity: high
    issue: Das Hinaufgehen zum Altar wird dem Priester zugewiesen.
    rationale: 'Die griechische Partizipialkonstruktion bezieht sich auf Joachim: Er achtet beim Hinzutreten zum Altar auf das Stirnblatt.'
  - severity: high
    issue: „Er sah keine Sünde daran“ lokalisiert die Sünde am Stirnblatt.
    rationale: Der griechische Text sagt, dass Joachim keine Sünde an bzw. in sich selbst sah. Die rätselhafte Verbindung von Stirnblatt und diesem Befund bleibt bestehen, darf aber nicht in den Gegenstand verlegt werden.
  - severity: medium
    issue: „die Tage ihrer Reinigung“ ergänzt einen nicht ausdrücklich vorhandenen Bezug.
    rationale: Der Kontext betrifft zwar die Zeit nach der Geburt, doch der Text sagt nur „als ihre Tage erfüllt waren“. Die Ergänzung sollte nicht im Haupttext festgelegt werden.
