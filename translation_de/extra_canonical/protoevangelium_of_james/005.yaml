  to: '(1) Am nächsten Tag brachte Joachim seine Gaben dar und sagte sich: »Wenn der Herr, Gott, mich gereinigt hat, wird mir das Stirnblatt des Priesters[a] dies deutlich machen.« Joachim brachte seine Gaben dar und achtete auf das Stirnblatt des Priesters, als er zum Altar des Herrn hinauftrat. Er sah keine Sünde an sich selbst.[b] Da sagte Joachim: »Jetzt weiß ich, dass der Herr, Gott, mich gereinigt und alle meine Sünden von mir weggenommen hat.« Gerechtfertigt ging er vom Tempel des Herrn hinab und kehrte in sein Haus zurück.


    (2) Etwa sechs Monate waren vergangen, und im siebten Monat gebar Anna. Sie fragte ihre Hebamme: »Was ist es?«


    Die Hebamme antwortete: »Ein Mädchen!«


    Da sagte Anna: »An diesem Tag ist meine Seele groß gemacht worden!«[c] Dann legte sie ihr Kind nieder.


    Als ihre Tage erfüllt waren, reinigte Anna sich von ihrem Blutfluss.[d] Sie gab dem Kind die Brust und gab ihm den Namen Maria.'
  rationale: 'Die Revision folgt dort dem griechischen Wortlaut, wo die vorliegende englische Brückenfassung davon abweicht: Joachim wird gereinigt, er selbst tritt zum Altar hinauf, und der Befund betrifft ihn selbst. Die rätselhafte Zeichenhandlung, Annas ungewöhnlicher Ausruf und die knappe zeitliche Angabe nach der Geburt bleiben ohne konfessionelle oder harmonisierende Auslegung erhalten.'
