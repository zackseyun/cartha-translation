review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Zeugen insgesamt zuverlässig und erhält dessen Spannungen, besonders Josefs Unsicherheit über die Herkunft des Kindes sowie die anschließende Aussage vom Heiligen Geist. Korrekturbedarf besteht bei »von einem Engel stammen könnte«: Dies verengt »might be angelic« auf einen bestimmten Engel als Ursprung. Auch »bloßstelle« fügt einen nicht ausdrücklich enthaltenen Aspekt öffentlicher Beschämung hinzu. Die abschließende Umschreibung »nahm sie in seinen Schutz« ist möglich, aber gegenüber »protected her« interpretativer als nötig.'
  naturalness: Der Text ist überwiegend idiomatisches modernes Standarddeutsch in angemessen würdigem Erzählton. »Die Nacht überkam ihn« ist näher am knappen Erzählgestus als »Da brach die Nacht über ihn herein«. Die direkte Wiedergabe »er beschützte sie« ist hier zugleich natürlich und quellentreuer.
  terminology: »Heiliger Geist«, »Gott Israels«, »Sünden« und »Jesus« sind sachgerecht. Die Namensfußnote erläutert die im Text angegebene Namensdeutung zurückhaltend. »Engelhafter Herkunft« bewahrt die unbestimmte, nicht mit der folgenden Geist-Aussage harmonisierte Formulierung des Zeugen.
  issues:
  - severity: medium
    issue: »von einem Engel stammen könnte«
    rationale: Die Formulierung macht aus der offenen Charakterisierung »might be angelic« eine konkrete Herkunft von einem einzelnen Engel. »möglicherweise engelhafter Herkunft sein könnte« bewahrt die Unbestimmtheit besser.
  - severity: low
    issue: »vor dem Volk Israel bloßstelle«
    rationale: »Bloßstellen« betont Beschämung; der Zeuge sagt lediglich, dass Josef sie dem Volk Israel offenlegt bzw. bekannt macht.
  - severity: low
    issue: »nahm sie in seinen Schutz«
    rationale: Die Wendung deutet einen rechtlich-sozialen Schutzakt stärker aus. Das knappe »er beschützte sie« entspricht dem Zeugen unmittelbar.
  revised_text: '(1) Josef fürchtete sich sehr und schwieg über sie, während er überlegte, was er mit ihr tun sollte. Josef sagte: »Wenn ich ihre Sünde verberge, werde ich als jemand dastehen, der sich dem Gesetz des Herrn widersetzt. Wenn ich sie aber dem Volk Israel offenlege, fürchte ich, dass das in ihr möglicherweise engelhafter Herkunft sein könnte. Dann werde ich unschuldiges Blut dem Todesurteil ausliefern. Was soll ich also mit ihr tun? Ich werde sie heimlich freigeben.«[a]


    Die Nacht überkam ihn. (2) Und sieh! Ein Engel des Herrn erschien ihm im Traum und sagte: »Fürchte dich nicht wegen dieses Kindes; denn was in ihr ist, stammt vom Heiligen Geist. Sie wird einen Sohn zur Welt bringen, und du sollst ihm den Namen Jesus geben,[b] denn er wird sein Volk von seinen Sünden retten.«


    Josef erwachte aus dem Schlaf und pries den Gott Israels, der ihm Gnade erwiesen hatte. Und er beschützte sie.'
  revised_footnotes:
