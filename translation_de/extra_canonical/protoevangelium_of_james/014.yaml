base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: de
  text: '(1) Josef fürchtete sich sehr und schwieg über sie, während er überlegte, was er mit ihr tun sollte. Josef sagte: »Wenn ich ihre Sünde verberge, werde ich als jemand dastehen, der sich dem Gesetz des Herrn widersetzt. Wenn ich sie aber vor dem Volk Israel bloßstelle, fürchte ich, dass das, was in ihr ist, von einem Engel stammen könnte. Dann würde ich unschuldiges Blut dem Todesurteil ausliefern. Was soll ich also mit ihr tun? Ich werde sie heimlich freigeben.«[a]


    Da brach die Nacht über ihn herein. (2) Und sieh! Ein Engel des Herrn erschien ihm im Traum und sagte: »Fürchte dich nicht vor diesem Kind; denn was in ihr ist, stammt vom Heiligen Geist. Sie wird einen Sohn zur Welt bringen, und du sollst ihm den Namen Jesus geben,[b] denn er wird sein Volk von seinen Sünden retten.«


    Josef erwachte aus dem Schlaf und pries den Gott Israels, der ihm Gnade erwiesen hatte. Und er nahm sie in seinen Schutz.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde sie heimlich von mir entlassen.« Die genaue rechtliche Form der beabsichtigten Trennung bleibt in der vorliegenden Übersetzungsgrundlage offen.'
    reason: Bewahrt die Mehrdeutigkeit von »set her free from me«.
  - marker: b
    text: 'Jesus: eine Namensform, die mit der Aussage »er wird retten« verbunden wird.'
    reason: Macht das im Satz enthaltene Wortspiel für deutschsprachige Leser knapp sichtbar, ohne eine unsichere Detailrekonstruktion einzuführen.
  - marker: c
    text: 'Oder: »Und er beschützte sie.«'
    reason: Dokumentiert die engere wörtliche Wiedergabe neben der idiomatischen Haupttextfassung.
lexical_decisions:
- source_word: what’s inside her might be angelic
  choice: das, was in ihr ist, von einem Engel stammen könnte
  rationale: Die ungewöhnliche und theologisch offene Aussage des Zeugen wird bewahrt, ohne sie mit der späteren ausdrücklichen Aussage über den Heiligen Geist gleichzusetzen. »Engelhaft« wäre im modernen Deutsch missverständlich.
- source_word: secretly set her free from me
  choice: sie heimlich freigeben
  rationale: »Freigeben« erhält die rechtlich-soziale Vorstellung einer Lösung von Josef, ohne vorschnell eine konkrete Form wie Scheidung oder Verstoßung festzulegen.
- source_word: Night overtook him
  choice: Da brach die Nacht über ihn herein
  rationale: Die bildhafte Erzählweise wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: the one in her is from the Holy Spirit
  choice: was in ihr ist, stammt vom Heiligen Geist
  rationale: Die Formulierung wahrt den Unterschied zwischen dem in Maria Befindlichen und dessen Herkunft und vermeidet eine unnötige dogmatische Ausdeutung.
- source_word: call his name ‘Jesus’
  choice: ihm den Namen Jesus geben
  rationale: Natürliches modernes Deutsch für die semitisch geprägte Namengebungsformel.
- source_word: protected her
  choice: nahm sie in seinen Schutz
  rationale: Gibt den fortdauernden fürsorglichen Schutz deutlicher und idiomatischer wieder als das bloße »beschützte sie«.
theological_decisions:
- issue: Möglicherweise engelhafte Herkunft der Schwangerschaft
  choice: »von einem Engel stammen könnte«
  alternative: »engelhaft sein könnte« / Harmonisierung mit »vom Heiligen Geist«
  rationale: Die eigentümliche Unsicherheit in Josefs Überlegung bleibt bestehen und wird nicht nachträglich harmonisiert.
- issue: Herkunft des Kindes
  choice: »stammt vom Heiligen Geist«
  alternative: »ist der Heilige Geist« oder eine ausführlichere Lehraussage zur Empfängnis
  rationale: Die Aussage des überlieferten Zeugen wird beibehalten, ohne zusätzliche konfessionelle Präzisierung.
- issue: Bedeutung des Namens Jesus
  choice: Die Begründung »denn er wird sein Volk von seinen Sünden retten« bleibt im Haupttext
  alternative: Eine erklärende etymologische Fußnote
  rationale: Die im Text selbst gegebene theologische Namensdeutung genügt; eine weitergehende Erklärung wäre bei ausstehender griechischer Prüfung unnötig.
- issue: Josefs beabsichtigte Trennung von Maria
  choice: »freigeben«
  alternative: »entlassen«, »verstoßen« oder »sich scheiden lassen«
  rationale: Die rechtliche Art der Trennung wird nicht enger bestimmt, als es die vorliegende Grundlage erlaubt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Kurze, klare Sätze erhalten die dramatische Bewegung. »Und sieh!« bewahrt das Aufmerksamkeitssignal des Zeugen. Da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht, vermeidet der Entwurf unnötig enge lexikalische oder rechtshistorische Festlegungen.
