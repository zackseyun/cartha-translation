translation:
  language: de
  text: '(1) Die Hebamme ging hinein und sagte: »Maria, bring dich in die richtige Lage; denn dir steht eine nicht geringe Prüfung bevor.«


    Und Salome untersuchte sie. Da schrie Salome auf und sagte: »Weh mir wegen meiner Gesetzlosigkeit und meines Unglaubens! Denn ich habe den lebendigen Gott auf die Probe gestellt, und sieh doch: Meine Hand steht in Flammen und löst sich von mir ab!«


    (2) Sie fiel vor dem Herrn auf die Knie und sagte: »Gott meiner Vorfahren, denk an mich: Ich stamme von Abraham, Isaak und Jakob ab. Mach mich nicht zum warnenden Beispiel für das Volk Israel, sondern gib mich den Armen zurück,[a] denn du weißt, Herr, dass ich in deinem Namen Menschen geheilt und meinen Lohn von dir empfangen habe.«


    (3) Und sieh doch: Ein Engel des Herrn erschien ihr und sagte: »Salome, Salome, der Herr über alles hat dein Gebet erhört. Strecke deine Hand nach dem Kind aus und nimm es auf den Arm; dann wirst du Rettung und Freude erfahren.«


    (4) Und sieh doch: Voll Freude ging Salome zu dem Kind und nahm es auf den Arm. Dabei sagte sie: »Ich bete es an, denn ein großer König ist für Israel geboren worden.« Sofort wurde Salome geheilt, und sie verließ die Höhle gerechtfertigt.[b]


    Und sieh doch: Eine Stimme sagte: »Salome, Salome, erzähle nichts von den wunderbaren Dingen, die du gesehen hast, bis das Kind nach Jerusalem kommt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung »gib mich den Armen zurück« ist in der überlieferten Textgestalt schwer verständlich. Sie wurde ohne ergänzende Deutung beibehalten.
    reason: Textkritisch beziehungsweise semantisch schwierige Stelle; eine eindeutige Erklärung lässt sich auf Grundlage des bereitgestellten englischen Zeugen nicht sichern.
  - marker: b
    text: 'Oder: »als gerecht Erwiesene«. Das Wort kann hier Freispruch, Rechtfertigung oder die Wiederherstellung Salomes bezeichnen.'
    reason: Die religiöse und forensische Bedeutungsbreite soll sichtbar bleiben, ohne die Aussage auf die unmittelbar zuvor erwähnte Heilung zu reduzieren.
lexical_decisions:
- source_word: position yourself
  choice: bring dich in die richtige Lage
  rationale: Gibt die Aufforderung zu einer für die Untersuchung geeigneten Körperhaltung natürlich wieder, ohne Einzelheiten zu ergänzen, die im vorliegenden Zeugen nicht ausdrücklich genannt werden.
- source_word: no small test
  choice: eine nicht geringe Prüfung
  rationale: Bewahrt die litotische Ausdrucksweise und lässt offen, ob primär die körperliche Untersuchung oder deren schwerwiegende Bedeutung gemeint ist.
- source_word: lawlessness
  choice: Gesetzlosigkeit
  rationale: Erhält die religiös-moralische Färbung stärker als das allgemeinere »Unrecht«.
- source_word: tested the living God
  choice: den lebendigen Gott auf die Probe gestellt
  rationale: Gibt den Vorwurf vermessener Prüfung idiomatisch wieder und bewahrt den Gottesbezug.
- source_word: on fire and falling away from me
  choice: steht in Flammen und löst sich von mir ab
  rationale: Bewahrt beide drastischen Bildelemente des Zeugen, ohne den Vorgang medizinisch oder übernatürlich näher festzulegen.
- source_word: Lord of All
  choice: Herr über alles
  rationale: Eine verständliche, würdevolle Wiedergabe des universalen Herrschaftstitels ohne konfessionelle Spezialisierung.
- source_word: lift him up
  choice: nimm es auf den Arm
  rationale: Im Zusammenhang mit einem Kind ist dies die natürliche deutsche Formulierung; das grammatische Neutrum richtet sich nach »Kind«.
- source_word: salvation
  choice: Rettung
  rationale: Bewahrt die mögliche körperliche und umfassendere religiöse Bedeutung, ohne sie allein auf Heilung zu verengen.
- source_word: justified
  choice: gerechtfertigt
  rationale: Erhält die theologisch und erzählerisch gespannte Formulierung, statt sie lediglich als »geheilt« oder »freigesprochen« zu erklären.
theological_decisions:
- issue: Salomes Anbetung des Kindes
  choice: »Ich bete es an«
  alternative: »Ich verehre es«
  rationale: Der Zeuge verwendet ausdrücklich eine kultisch starke Aussage. Die Übersetzung schwächt sie nicht ab und legt zugleich keine weiterführende dogmatische Deutung in den Text.
- issue: Verheißung von Rettung und Freude
  choice: »dann wirst du Rettung und Freude erfahren«
  alternative: »dann wird dir Heil und Freude zuteil«
  rationale: »Rettung« hält sowohl die unmittelbare körperliche Befreiung als auch einen weiteren theologischen Sinn offen.
- issue: Salome verlässt die Höhle gerechtfertigt
  choice: »gerechtfertigt«
  alternative: »als gerecht Erwiesene«
  rationale: Die knappe forensisch-theologische Spannung wird bewahrt und nicht mit ihrer körperlichen Heilung gleichgesetzt.
- issue: Der große König und Israel
  choice: »ein großer König ist für Israel geboren worden«
  alternative: »Israel ist ein großer König geboren worden«
  rationale: Die gewählte Wortstellung ist modernes Deutsch und erhält die mögliche Bedeutung eines Königs, der Israel gegeben ist, ohne seine genaue Beziehung zu Israel weiter auszulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Das wiederholte »Und sieh doch« wahrt das markante narrative Signal des Zeugen. Die Übersetzung ist wegen der noch ausstehenden direkten Prüfung der griechischen Handschriftentradition vorläufig; besonders die Aussage über die Armen bedarf der Kontrolle am griechischen Text.
