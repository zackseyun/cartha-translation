base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: de
  text: '(1) Ich, Jakobus, schrieb nun diesen Bericht in Jerusalem, als es wegen des Todes von Herodes zu Unruhen kam. Ich ging in die Wüste, bis die Unruhen in Jerusalem abgeklungen waren. Ich pries den Herrn, Gott, der mir die Weisheit gab, diesen Bericht zu schreiben.


    (2) Und die Gnade wird mit allen sein, die den Herrn fürchten. Amen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account (Greek review pending)
  choice: Bericht
  rationale: „Bericht“ ist natürlich und lässt die Gattungsfrage offen; „Geschichte“ könnte entweder ein Geschehen oder eine Erzählung bezeichnen.
- source_word: commotion / unrest (Greek review pending)
  choice: Unruhen
  rationale: Der Plural bezeichnet verständlich öffentliche oder politische Unruhe, ohne Art und Ausmaß näher festzulegen.
- source_word: wilderness (Greek review pending)
  choice: Wüste
  rationale: „Wüste“ entspricht dem traditionellen biblischen Sprachgebrauch und kann auch eine unbewohnte, abgelegene Gegend bezeichnen.
- source_word: fear the Lord (Greek review pending)
  choice: den Herrn fürchten
  rationale: Die etablierte biblische Wendung bewahrt sowohl Ehrfurcht als auch das mögliche Moment der Furcht.
theological_decisions:
- issue: Bezeichnung Gottes in „the Lord God“
  choice: „den Herrn, Gott“
  alternative: „Gott, den Herrn“ / „den Herrn Gott“
  rationale: Die Formulierung hält beide Gottesbezeichnungen sichtbar, ohne die syntaktische Beziehung dogmatisch auszudeuten; wegen der noch ausstehenden Prüfung des griechischen Wortlauts bleibt sie bewusst eng am vorliegenden Zeugen.
- issue: Zeitform der Gnadenzusage
  choice: „die Gnade wird ... sein“
  alternative: „die Gnade sei ...“ / „die Gnade ist ...“
  rationale: Der Futurcharakter des bereitgestellten Textzeugen wird bewahrt und nicht in einen Segenswunsch oder eine allgemeine Feststellung umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischer Färbung bei „den Herrn fürchten“ und „Amen“. Der Entwurf ist vorläufig, da nur ein gemeinfreier englischer Textzeuge vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht.
