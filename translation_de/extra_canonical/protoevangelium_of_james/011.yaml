translation:
  language: de
  text: '**Protoevangelium des Jakobus – Kapitel 11: Die Verkündigung**


    **(1)** Sie nahm den Krug und ging hinaus, um ihn mit Wasser zu füllen. Da hörte sie plötzlich eine Stimme, die zu ihr sagte: »Freue dich, du Begnadete! Der Herr ist mit dir. Gesegnet bist du unter den Frauen.«


    Maria blickte nach rechts und nach links, um zu sehen, woher die Stimme kommen könnte. Da erschrak sie sehr und ging in ihr Haus. Sie stellte den Krug ab, nahm den Purpur[a], setzte sich auf ihren Thron und spann den Purpur.


    **(2)** Da stand plötzlich ein Engel des Herrn vor ihr und sagte: »Fürchte dich nicht, Maria, denn du hast Gnade gefunden vor dem Herrn über alles. Du wirst durch Gottes Wort empfangen.«[b]


    Als Maria das hörte, fragte sie sich: »Soll ich etwa vom Herrn, dem lebendigen Gott, empfangen und dann so gebären, wie alle Frauen gebären?«


    **(3)** Der Engel des Herrn sagte zu ihr: »Nicht so, Maria. Denn die Kraft Gottes wird dich überschatten. Darum wird das Heilige, das aus dir geboren wird, Sohn des Höchsten genannt werden. Du sollst ihm den Namen Jesus geben, denn er wird sein Volk von seinen Sünden retten.«


    Maria sagte: »Sieh, ich bin die Dienerin des Herrn. Mir geschehe nach deinem Wort.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Purpur« ist hier wahrscheinlich purpurfarbenes Spinnmaterial oder Garn gemeint.
    reason: Die substantivische Form kann für heutige Leser sonst lediglich wie eine Farbangabe wirken.
  - marker: b
    text: 'Wörtlich und sinngemäß eng am vorliegenden Zeugen: »aus/von Gottes Wort empfangen«. Die genaue griechische Formulierung muss noch unmittelbar anhand der Handschriftentradition geprüft werden.'
    reason: Die ungewöhnliche Wendung ist auslegungsrelevant; zugleich liegt für diesen Entwurf ausdrücklich noch keine abgeschlossene Prüfung des griechischen Ausgangstextes vor.
lexical_decisions:
- source_word: blessed one
  choice: du Begnadete
  rationale: Die Anrede wird von dem folgenden »Gesegnet bist du unter den Frauen« unterschieden. »Begnadete« gibt die empfangene Gunst wieder und bewahrt den feierlichen Klang.
- source_word: the purple
  choice: der Purpur
  rationale: Die knappe substantivische Ausdrucksweise bleibt erhalten; gemeint sein kann das purpurfarbene Spinnmaterial beziehungsweise Garn, nicht nur die Farbe.
- source_word: Lord of All
  choice: Herr über alles
  rationale: Diese verständliche Formulierung bewahrt den universalen Herrschaftsanspruch, ohne ihn mit einem stärker systematisch geprägten Titel auszuschmücken.
- source_word: conceive from God’s word
  choice: durch Gottes Wort empfangen
  rationale: Die ungewöhnliche Verbindung von Empfangen und Gottes Wort bleibt bestehen. »Durch« klingt im Deutschen natürlich, ohne die genaue Wirkweise näher festzulegen.
- source_word: overshadow
  choice: überschatten
  rationale: Das bildhafte und theologisch offene Verb wird wörtlich bewahrt statt durch eine erklärende Umschreibung ersetzt.
- source_word: servant
  choice: Dienerin
  rationale: Die feminine Form ist im modernen Deutschen natürlich und gibt Marias Selbstbezeichnung als dem Herrn unterstellte Person wieder.
theological_decisions:
- issue: Wie Marias Empfangen mit Gottes Wort verbunden wird
  choice: »Du wirst durch Gottes Wort empfangen«
  alternative: »Du wirst vom Wort Gottes empfangen« oder »Du wirst aufgrund von Gottes Wort schwanger werden«
  rationale: Die gewählte Fassung lässt offen, ob das Wort als schöpferisches Mittel, Verkündigung oder unmittelbare Ursache verstanden wird, und vermeidet eine vorschnelle Identifikation des »Wortes« mit einer ausdrücklich personifizierten Gestalt.
- issue: Art der angekündigten Empfängnis
  choice: Die Gegenüberstellung »Nicht so« und die Aussage vom Überschatten bleiben ohne biologische oder dogmatische Erklärung stehen.
  alternative: Eine ausdrückliche Ergänzung wie »nicht auf natürliche Weise«
  rationale: Der Text deutet einen Unterschied an, definiert ihn hier aber nicht vollständig. Die Übersetzung bewahrt diese Spannung.
- issue: Bezeichnung des Kindes
  choice: »das Heilige, das aus dir geboren wird«
  alternative: »der Heilige, der aus dir geboren wird«
  rationale: Die neutrale Form wahrt die grammatische und semantische Offenheit der überlieferten Formulierung, bevor der Titel »Sohn des Höchsten« folgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Das wiederholte Aufmerksamkeitssignal wird mit »Da … plötzlich« wiedergegeben, ohne den Text umgangssprachlich wirken zu lassen. Biblisch vertraute Wendungen wie »Fürchte dich nicht«, »Gnade gefunden«, »Sohn des Höchsten« und »Mir geschehe nach deinem Wort« bleiben erhalten. Der Entwurf stützt sich notgedrungen auf den angegebenen gemeinfreien englischen Textzeugen und die auditierte englische POB-Fassung; eine direkte Prüfung der griechischen Handschriftentradition steht noch aus.
