  naturalness: Das Deutsch ist modernes, gut lesbares Standarddeutsch mit angemessen erzählerisch-würdigem Register. Die Frage »Was für ein Zeichen habt ihr für den gesehen ...?« ist allerdings leicht sperrig; »Welches Zeichen habt ihr im Blick auf den gesehen ...?« ist natürlicher, ohne den Bezug zu verändern.
  terminology: »Sterndeuter« ist eine verständliche und historisch angemessene Wiedergabe von magi; die Fußnote schützt zu Recht vor der Eintragung der späteren Königstradition. »Sich vor ihm niederwerfen« bewahrt die Bedeutungsspannweite von worship/proskyneo. »Führende Priester« ist für den Plural von chief priests/archiereis vertretbar. »Christus« bleibt als etablierter Titel passend.
