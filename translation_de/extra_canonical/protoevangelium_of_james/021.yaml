base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: de
  text: '(1) Sieh! Joseph bereitete sich darauf vor, nach Judäa aufzubrechen, als in Bethlehem in Judäa große Unruhe entstand. Denn Sterndeuter[a] kamen und fragten: »Wo ist der König der Juden? Wir haben nämlich seinen Stern im Osten[b] gesehen und sind gekommen, um uns vor ihm niederzuwerfen.«[c]


    (2) Als Herodes davon hörte, geriet er in Unruhe. Er schickte Beauftragte zu den Sterndeutern, ließ die führenden Priester[d] rufen und befragte sie in seinem Palast. Er sagte zu ihnen: »Was steht über den Christus[e] geschrieben? Wo wird er geboren werden?«


    Sie antworteten ihm: »In Bethlehem in Judäa; denn so steht es geschrieben.« Darauf ließ er sie – die führenden Priester – gehen.


    Dann befragte er die Sterndeuter: »Was für ein Zeichen habt ihr für den gesehen, der als König geboren worden ist?«


    Die Sterndeuter antworteten: »Wir sahen einen gewaltigen Stern, der unter den anderen Sternen leuchtete und sie so sehr verdunkelte, dass sie gar nicht mehr zu sehen waren. Daran erkannten wir, dass für Israel ein König geboren worden war, und wir kamen, um uns vor ihm niederzuwerfen.«


    Herodes sagte zu ihnen: »Geht und sucht nach ihm. Wenn ihr ihn findet, meldet es mir, damit auch ich kommen und mich vor ihm niederwerfen kann.«


    (3) Die Sterndeuter gingen fort, und sieh: Der Stern, den sie im Osten[b] gesehen hatten, führte sie, bis sie zu der Höhle kamen; dort blieb er über dem Eingang[f] der Höhle stehen. Als sie ihn bei seiner Mutter Maria sahen, holten die Sterndeuter Geschenke aus ihren Taschen: Gold, Weihrauch und Myrrhe.


    Nachdem ein Engel sie gewarnt hatte, nicht nach Judäa zu gehen, kehrten sie auf einem anderen Weg in ihr Land zurück.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. traditionell: »Magier«. Gemeint sind hier kundige Sterndeuter; der Text nennt sie nicht Könige.'
    reason: Verhindert eine spätere traditionsgeschichtliche Eintragung in den Text.
  - marker: b
    text: Die Formulierung kann je nach griechischem Wortlaut auch »beim Aufgang« bedeuten.
    reason: Bewahrt die mögliche astronomische beziehungsweise geografische Mehrdeutigkeit; direkte Prüfung des Griechischen steht noch aus.
  - marker: c
    text: 'Oder: »um ihm zu huldigen« beziehungsweise »ihn anzubeten«. Das zugrunde liegende Verb bezeichnet zunächst das ehrerbietige Niederwerfen.'
    reason: Bewahrt die semantische und theologische Spannweite.
  - marker: d
    text: 'Traditionell: »Hohepriester«; der Plural bezeichnet die führenden Angehörigen der Priesterschaft.'
    reason: Erläutert die institutionelle Bedeutung.
  - marker: e
    text: »Christus« bedeutet »der Gesalbte« und entspricht dem Titel »Messias«.
    reason: Macht den griechischen Titel für heutige Leser verständlich.
  - marker: f
    text: Die zugängliche englische Textgrundlage hat wörtlich »über dem Kopf der Höhle«. Gemeint sein dürfte der obere Bereich oder Eingang der Höhle; der griechische Wortlaut muss noch unmittelbar geprüft werden.
    reason: Kennzeichnet eine unsichere, vorläufig idiomatische Wiedergabe.
  - marker: g
    text: Die Aufforderung, nicht nach Judäa zu gehen, ist auffällig, weil die Sterndeuter sich der Erzählung zufolge bereits in Bethlehem in Judäa befinden. Der Wortlaut wurde nicht an Matthäus 2,12 angeglichen.
    reason: Bewahrt eine echte narrative beziehungsweise textliche Spannung des vorliegenden Zeugnisses.
lexical_decisions:
- source_word: μάγοι / magi (as reflected in the witness)
  choice: Sterndeuter
  rationale: Bezeichnet die antiken Magier sachgerecht und verständlich, ohne sie anachronistisch als Könige darzustellen.
- source_word: προσκυνέω / worship (as reflected in the witness)
  choice: sich vor ihm niederwerfen
  rationale: Bewahrt die konkrete Geste und lässt offen, ob hier Huldigung, Verehrung oder Anbetung im engeren Sinn gemeint ist.
- source_word: Χριστός / Christ
  choice: Christus
  rationale: Der eingebürgerte Titel wahrt den messianischen Gehalt; eine Fußnote erläutert die Bedeutung.
- source_word: ἀρχιερεῖς / chief priests (as reflected in the witness)
  choice: führende Priester
  rationale: Natürliches modernes Deutsch; vermeidet die mögliche Fehlannahme, es sei nur ein einzelner Hohepriester gemeint.
- source_word: head of the cave (Greek review pending)
  choice: Eingang der Höhle
  rationale: Im räumlichen Zusammenhang idiomatisch verständlich, aber wegen der ausstehenden Prüfung des griechischen Wortlauts ausdrücklich als vorläufig markiert.
theological_decisions:
- issue: Art der den Sterndeutern erwiesenen Handlung
  choice: »sich vor ihm niederwerfen«
  alternative: »ihn anbeten« oder »ihm huldigen«
  rationale: Die körperliche Handlung wird wiedergegeben, ohne ihre theologische Bedeutung enger festzulegen, als es die zugängliche Quellenlage erlaubt.
- issue: Bezeichnung des erwarteten Retters
  choice: »Christus« mit erläuternder Fußnote
  alternative: »Messias«
  rationale: Der griechische Titel wird traditionsgemäß beibehalten; die Erläuterung macht seine Bedeutung transparent.
- issue: Warnung, nicht nach Judäa zu gehen
  choice: Wortlaut unverändert bewahrt
  alternative: Harmonisierung zu »nicht zu Herodes zurückzukehren«
  rationale: Die auffällige Spannung zum vorherigen Aufenthalt in Bethlehem wird nicht stillschweigend an die matthäische Erzählung angeglichen.
- issue: Stern über der Höhle
  choice: »über dem Eingang der Höhle« mit Vorbehalt
  alternative: wörtlich »über dem Kopf der Höhle«
  rationale: Die idiomatische räumliche Deutung ist lesbarer, wird jedoch wegen der noch ausstehenden direkten Prüfung des Griechischen als unsicher ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erzählerischem Klang. Wiederholungen und das aufmerksamkeitslenkende »Sieh!« wurden soweit möglich bewahrt. Da nur ein gemeinfreies englisches Übersetzungszeugnis vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht, sind besonders die Wiedergaben von »im Osten/beim Aufgang« und »Kopf/Eingang der Höhle« ausdrücklich vorläufig.
