  - severity: low
    issue: Die Formulierung »Was für ein Zeichen habt ihr für den gesehen ...?« ist idiomatisch schwerfällig.
    rationale: Eine geringe Umstellung zu »Welches Zeichen habt ihr im Blick auf den gesehen ...?« ist im modernen Deutsch klarer und erhält die Frage nach dem Zeichen in Bezug auf den neugeborenen König.
