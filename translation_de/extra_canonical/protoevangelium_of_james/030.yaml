base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: de
  text: '(1) Und sieh! Josef schickte sich an, nach Judäa aufzubrechen, als in Bethlehem in Judäa große Unruhe entstand. Denn Sterndeuter[a] kamen und fragten: »Wo ist der König der Juden? Wir haben nämlich seinen Stern im Osten[b] gesehen und sind gekommen, um uns vor ihm niederzuwerfen.«[c]


    (2) Als Herodes davon hörte, wurde er beunruhigt. Er sandte Beamte aus und ließ die Sterndeuter zu sich rufen; und sie berichteten ihm von dem Stern.


    (3) Und sieh! Sie sahen Sterne[d] im Osten. Die Sterne führten die Sterndeuter, bis sie zu der Höhle kamen; und der Stern blieb über dem Kopf des Kindes stehen. Als die Sterndeuter das Kind mit seiner Mutter Maria sahen, holten sie Geschenke aus ihren Taschen: Gold, Weihrauch und Myrrhe.


    Nachdem ein Engel sie gewarnt hatte, kehrten sie auf einem anderen Weg in ihr Land zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Magier« oder »Weise«. Der Ausdruck bezeichnet hier keine Könige, sondern kundige Sterndeuter aus dem Osten.
    reason: Verhindert, dass eine spätere Tradition als ausdrückliche Aussage des Textes gelesen wird.
  - marker: b
    text: 'Die Wendung kann auch bedeuten: »bei seinem Aufgang« beziehungsweise »als er aufging«.'
    reason: Bewahrt die räumliche beziehungsweise astronomische Mehrdeutigkeit der zugrunde liegenden traditionellen Formulierung, soweit sie anhand des englischen Zeugen erschließbar ist.
  - marker: c
    text: 'Oder: »um ihn anzubeten«. Das zugrunde liegende Verb kann sowohl ehrerbietiges Niederfallen als auch religiöse Anbetung bezeichnen.'
    reason: Macht die genuine semantische und theologische Spannung transparent.
  - marker: d
    text: Der Text hat hier den Plural »Sterne«, wechselt danach jedoch zum Singular »der Stern«.
    reason: Kennzeichnet die auffällige Numerusverschiebung, ohne sie zu harmonisieren.
lexical_decisions:
- source_word: magi
  choice: Sterndeuter
  rationale: Gibt die antike Bezeichnung verständlich wieder, ohne die später eingebürgerte Vorstellung von »Königen« in den Text einzutragen.
- source_word: look
  choice: sieh!
  rationale: Bewahrt den auffordernden, erzählerischen Aufmerksamkeitssignalton des Zeugen.
- source_word: worship
  choice: sich vor ihm niederwerfen
  rationale: Bewahrt die körperliche Grundbedeutung und lässt offen, ob hier Huldigung eines Königs oder religiöse Anbetung im Vordergrund steht.
- source_word: officers
  choice: Beamte
  rationale: Eine neutrale Bezeichnung für Amtsträger oder Beauftragte des Herodes; vermeidet die unbelegte Präzisierung als Soldaten.
- source_word: cave
  choice: Höhle
  rationale: Entspricht der ausdrücklich genannten Geburtsstätte dieser Überlieferung und wird nicht an die bekanntere Darstellung eines Stalls angeglichen.
- source_word: bags
  choice: Taschen
  rationale: Natürliches modernes Deutsch für mitgeführte Behältnisse, ohne unnötige Festlegung auf Truhen oder Schatzkästen.
theological_decisions:
- issue: Bedeutung der Huldigung der Sterndeuter
  choice: »um uns vor ihm niederzuwerfen«
  alternative: »um ihn anzubeten«
  rationale: Die Übersetzung erhält die mögliche Spannung zwischen königlicher Huldigung und religiöser Verehrung, statt sie zugunsten einer einzigen theologischen Lesart aufzulösen.
- issue: Plural »Sterne« und anschließender Singular »Stern«
  choice: Der Wechsel wird unverändert bewahrt.
  alternative: Durchgehend »Stern«
  rationale: Der überlieferte Wechsel ist auffällig und möglicherweise textgeschichtlich bedeutsam; eine stillschweigende Harmonisierung wäre nicht gerechtfertigt.
- issue: Identität des warnenden Engels
  choice: »ein Engel«
  alternative: »der Engel«
  rationale: Im Deutschen verlangt die erste isolierte Nennung eher den unbestimmten Artikel; der Text identifiziert den Engel nicht näher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltenem erzählerischem »Und sieh!«. Die Syntax wurde moderat geglättet, Wiederholungen und auffällige Textmerkmale wurden jedoch nicht beseitigt. Da eine direkte Prüfung des griechischen Textes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugen orientiert; insbesondere die Fußnoten zu möglichen griechischen Bedeutungsnuancen sind bei der Quellenprüfung zu verifizieren.
