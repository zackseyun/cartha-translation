  text: '(1) Look! An angel of the Lord stood nearby and said to her, “Anna, Anna, the Lord has heard your prayer. You will conceive and give birth, and your offspring will be spoken of throughout the whole world.”


    Anna said, “As the Lord God lives, whether I give birth to a boy or a girl, I will bring the child as a gift to the Lord my God, and the child will minister to him all the days of its life.”


    (2) Look! Two angels came and said to her, “Look, your husband Joachim is coming with his flocks.” For an angel of the Lord had gone down to Joachim and said, “Joachim, Joachim, the Lord God has heard your prayer. Go down from here. Look, your wife Anna has conceived in her womb.”


    (3) Joachim immediately went down and called the shepherds. He said to them, “Bring me ten lambs without spot or blemish, and the ten lambs will be for the Lord God. Bring me twelve tender calves for the priests and the elders, and one hundred male goats for all the people.”


    (4) Look! Joachim came with his flocks, and Anna stood at the gate. When she saw Joachim coming with his flocks, she immediately ran and threw her arms around his neck, saying, “Now I know that the Lord God has greatly blessed me. For look! The widow is no longer a widow, and look! The one without a child in her womb has conceived.”


    Joachim rested in his house for the first day.'
translation:
  language: de
  text: '(1) Sieh! Ein Engel des Herrn trat zu ihr und sagte: »Anna, Anna, der Herr hat dein Gebet erhört. Du wirst empfangen und gebären, und von deinem Kind wird man auf der ganzen Welt sprechen.«


    Anna sagte: »So wahr der Herr, Gott, lebt: Ob ich einen Jungen oder ein Mädchen gebäre, ich werde das Kind dem Herrn, meinem Gott, als Gabe darbringen, und es wird ihm alle Tage seines Lebens dienen.«


    (2) Sieh! Zwei Engel kamen zu ihr und sagten: »Sieh, dein Mann Joachim kommt mit seinen Herden.« Denn ein Engel des Herrn war zu Joachim hinabgestiegen und hatte gesagt: »Joachim, Joachim, der Herr, Gott, hat dein Gebet erhört. Steig von hier hinab. Sieh, deine Frau Anna hat in ihrem Leib empfangen.«[a]


    (3) Sofort stieg Joachim hinab und rief die Hirten zu sich. Er sagte zu ihnen: »Bringt mir zehn Lämmer ohne Fehler und Makel; die zehn Lämmer sollen für den Herrn, Gott, sein. Bringt mir auch zwölf zarte Kälber für die Priester und die Ältesten und hundert Ziegenböcke für das ganze Volk.«


    (4) Sieh! Joachim kam mit seinen Herden, und Anna stand am Tor. Als sie Joachim mit seinen Herden kommen sah, lief sie sofort zu ihm, fiel ihm um den Hals und sagte: »Nun weiß ich, dass der Herr, Gott, mich reich gesegnet hat. Denn sieh: Die Witwe ist keine Witwe mehr, und sieh: Die Kinderlose hat in ihrem Leib empfangen.«[b]


    Und Joachim verbrachte den ersten Tag in seinem Haus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Aussage setzt Annas Empfängnis bereits als geschehen voraus, obwohl der Engel ihr zuvor angekündigt hatte: »Du wirst empfangen«. Diese zeitliche Spannung ist im überlieferten Wortlaut erhalten.'
    reason: Bewahrt eine genuine erzählerische beziehungsweise textliche Spannung, statt sie in der Übersetzung zu harmonisieren.
  - marker: b
    text: Anna nennt sich hier »Witwe«, obwohl Joachim lebt und zurückkehrt. Gemeint sein kann ihre bisherige Lage der Trennung oder Verlassenheit; der auffällige Ausdruck bleibt jedoch bewusst unaufgelöst.
    reason: Erklärt eine offensichtliche semantische Spannung, ohne eine bestimmte Interpretation zum Haupttext zu machen.
lexical_decisions:
- source_word: And look! / Look! (Greek source review pending)
  choice: Sieh!
  rationale: Bewahrt den wiederkehrenden, schriftsprachlich-biblischen Aufmerksamkeitsruf, ohne ihn durch ein bloßes »Da« abzuschwächen.
- source_word: offspring
  choice: Kind
  rationale: Im Kontext ist Annas erwartetes einzelnes Kind gemeint. »Nachkommenschaft« wäre zwar formaler, klänge hier aber kollektiv oder abstrakt.
- source_word: bring it as a gift
  choice: das Kind … als Gabe darbringen
  rationale: Gibt den Weihe- und Opferwortschatz würdig wieder, ohne zu behaupten, das Kind werde als Schlachtopfer dargebracht.
- source_word: minister to him
  choice: ihm … dienen
  rationale: Natürliches Deutsch für einen lebenslangen religiösen Dienst; »Dienst tun« wäre schwerfälliger.
- source_word: without spot or blemish
  choice: ohne Fehler und Makel
  rationale: Erhält die kultische Doppelformel und bleibt verständlich.
- source_word: tender calves
  choice: zarte Kälber
  rationale: Bewahrt die mögliche Aussage über Alter oder Beschaffenheit, statt sie unbelegt als »junge« oder »gemästete« Kälber festzulegen.
- source_word: male goats
  choice: Ziegenböcke
  rationale: Bezeichnet das Geschlecht ausdrücklich und idiomatisch.
- source_word: the one without a child
  choice: die Kinderlose
  rationale: Natürliches, knappes Deutsch, das Annas bisherigen Zustand bezeichnet.
- source_word: rested … for the first day
  choice: verbrachte den ersten Tag
  rationale: Gibt den zeitlichen Sinn lesbar wieder, ohne das im Deutschen missverständliche »ruhte für den ersten Tag« zu verwenden.
theological_decisions:
- issue: Zeitpunkt von Annas Empfängnis
  choice: »hat in ihrem Leib empfangen«
  alternative: »wird in ihrem Leib empfangen« oder »ist schwanger geworden«
  rationale: Der gelieferte Zeuge formuliert die Empfängnis bereits als vollzogen. Diese Spannung zur vorangehenden Zukunftsankündigung wird nicht harmonisiert.
- issue: Annas Bezeichnung als Witwe, obwohl Joachim lebt
  choice: Die Selbstbezeichnung »Witwe« bleibt unverändert stehen.
  alternative: Sinngemäße Auflösung als »wie eine Witwe« oder »verlassen«
  rationale: Die auffällige, theologisch und erzählerisch spannungsreiche Formulierung soll nicht stillschweigend erklärt oder abgeschwächt werden.
- issue: Darbringung und lebenslanger Dienst des Kindes
  choice: »als Gabe darbringen« und »ihm … dienen«
  alternative: Konfessionell geprägte Deutung als Tempelgelübde mit näher bestimmtem Amt
  rationale: Der Wortlaut wird wiedergegeben, ohne spätere kirchliche oder mariologische Einzeldeutungen in den Text einzutragen.
- issue: Gottesbezeichnung »Lord God«
  choice: »der Herr, Gott«
  alternative: »der Herr, unser Gott« oder »Gott der Herr«
  rationale: Die enge Verbindung beider Titel wird bewahrt, ohne ein im Zeugen nicht vorhandenes Possessivpronomen hinzuzufügen. Die Interpunktion hält zugleich offen, ob »Herr« als Titel und »Gott« als Apposition zu verstehen ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Das wiederholte »Sieh!« erhält den markanten biblischen Erzählrhythmus. Direkte Prüfung der griechischen Handschriftentradition steht laut Projektdaten noch aus; der Entwurf ist daher quellennah zum bereitgestellten gemeinfreien englischen Zeugen und entsprechend vorläufig.
