  terminology: Namen, kultische Begriffe und die zurückhaltende Wiedergabe der Darbringung sind angemessen. Die Formel »der Herr, Gott« wird als quellennaher, bewusst feierlicher Titel beibehalten. Die Fußnoten sind sinnvoll verankert und legen keine konfessionelle Deutung fest.
