review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem vorliegenden englischen Zeugen im Wesentlichen zuverlässig und bewahrt die auffällige Wiederholung von »Sünde« und »offenbaren«. Die Fassung »vor Augen führen« deutet jedoch stärker auf bloße Erkenntnis als die bildhaft-körperliche bzw. sichtbare Offenbarung des Zeugen. Außerdem ist »chief priest« als »Hohepriester« (ein Wort) wiederzugeben. Eine unmittelbare Kontrolle an der griechischen Handschriftentradition steht nach den Projektangaben weiterhin aus.
  naturalness: Der Erzählton ist überwiegend klar und modern-würdevoll. »Der Hohe Priester« ist orthografisch nicht standardsprachlich; »der Hohepriester« ist korrekt. »Gott, der Herr« ist als deutsche Wiedergabe von »the Lord God« natürlich, ohne die Gottesbezeichnung inhaltlich zu verändern.
  terminology: »Jungfrau«, »Tempel des Herrn«, »Wasser der Zurechtweisung des Herrn«, »Wildnis«, »unversehrt«, »offenbaren« und »Gott Israels« sind angemessen. Die Formulierung zum Sichtbarwerden der Sünde wird näher am Zeugen gefasst, ohne die noch ungeprüfte griechische Form festzulegen.
  issues:
  - severity: medium
    issue: Die Wendung »Es wird dir deine Sünde vor Augen führen« verschiebt den Sinn von sichtbarer Offenbarung zu bloßer Einsicht.
    rationale: Der englische Zeuge sagt ausdrücklich, das Wasser werde die Sünde »in your eyes« offenbaren. »deine Sünde vor deinen Augen sichtbar machen« erhält die auffällige Bildlichkeit besser; die verbleibende Unsicherheit wird in einer Fußnote dokumentiert.
  - severity: low
    issue: »Der Hohe Priester« ist orthografisch fehlerhaft.
    rationale: Die korrekte standarddeutsche Form lautet »der Hohepriester«.
  - severity: low
    issue: Die Anrede bzw. Benennung »der Herr, Gott« ist im Deutschen unnötig holprig.
    rationale: »Gott, der Herr« gibt »the Lord God« idiomatisch wieder und lässt offen, ob es sich um eine feste Gottesbezeichnung handelt.
  revised_text: '(1) Der Priester sagte: »Gib die Jungfrau zurück, die du aus dem Tempel des Herrn mitgenommen hast.«


    Josef kamen die Tränen.


    Der Hohepriester sagte: »Ich werde dir das Wasser der Zurechtweisung des Herrn zu trinken geben. Es wird deine Sünde vor deinen Augen sichtbar machen.«[a]


    (2) Der Priester nahm das Wasser, gab es Josef und schickte ihn in die Wildnis. Josef kehrte unversehrt zurück.


    Dann gab er es Maria und schickte sie in die Wildnis. Auch sie kehrte unversehrt zurück.


    Das ganze Volk staunte darüber, dass ihre Sünde nicht offenbar geworden war.[b]


    (3) Der Priester sagte: »Wenn Gott, der Herr, euch eure Sünde nicht offenbart hat, richte auch ich euch nicht.«[c] Dann ließ er sie frei.


    Josef nahm Maria mit und ging in sein Haus; er freute sich und pries den Gott Israels.'
  revised_footnotes:
  - marker: a
    text: 'Der vorliegende englische Zeuge lautet wörtlich etwa: »Es wird deine Sünde in deinen Augen offenbaren.« Die genaue griechische Formulierung und die Bedeutung der Bildlichkeit müssen noch an der Handschriftentradition geprüft werden.'
    reason: Die englische Wendung ist im Deutschen nicht völlig eindeutig; der Haupttext bewahrt ihre Bildlichkeit, ohne eine bestimmte griechische Erklärung vorauszusetzen.
  - marker: b
    text: Der Text nennt eine »Sünde«, berichtet aber zugleich, dass die Prüfung keine Sünde offenbar machte.
    reason: Die Spannung der Anklagesprache und des für Josef und Maria günstigen Ergebnisses bleibt im Haupttext bewusst bestehen.
  - marker: c
    text: 'Der englische Zeuge hat: »If the Lord God hasn’t revealed your sin to you«. Das »euch« kann eine Mitteilung an die Beschuldigten oder eine an ihnen erkennbare Offenbarung bezeichnen.'
    reason: Die deutsche Formulierung bewahrt die im vorliegenden Zeugen bestehende Auslegungsweite; eine Entscheidung aufgrund des noch nicht direkt geprüften Griechisch wird vermieden.
  revision_rationale: Die Revision korrigiert die Zusammenschreibung von »Hohepriester«, glättet die Gottesbezeichnung und stellt die auffällige sichtbare Offenbarung der Sünde näher am englischen Zeugen dar. Die Aussage, dass trotz der Sprache von »Sünde« keine Sünde offenbar wurde, bleibt unverändert. Alle Fußnotenanker sind im revidierten Text vorhanden und die Fußnoten dokumentieren nur tatsächliche, für die vorläufige Quellengrundlage relevante Mehrdeutigkeiten.
