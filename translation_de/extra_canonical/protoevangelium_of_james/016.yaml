translation:
  language: de
  text: '(1) Der Priester sagte: »Gib die Jungfrau zurück, die du aus dem Tempel des Herrn mitgenommen hast.«


    Da kamen Josef die Tränen.


    Und der Hohe Priester sagte: »Ich werde dir das Wasser der Zurechtweisung des Herrn zu trinken geben. Es wird dir deine Sünde vor Augen führen.«[a]


    (2) Der Priester nahm das Wasser, gab es Josef und schickte ihn in die Wildnis. Doch Josef kehrte unversehrt zurück.


    Dann gab er es Maria und schickte sie in die Wildnis. Auch sie kehrte unversehrt zurück.


    Da staunte das ganze Volk darüber, dass ihre Sünde nicht offenbar geworden war.[b]


    (3) Der Priester sagte: »Wenn der Herr, Gott, euch eure Sünde nicht offenbart hat, verurteile auch ich euch nicht.«[c] Und er ließ sie frei.


    Josef nahm Maria mit und ging in sein Haus. Dabei freute er sich und pries den Gott Israels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden englischen Zeugen etwa: »Es wird deine Sünde vor deinen Augen offenbaren.« Die genaue griechische Formulierung muss noch am Ausgangstext geprüft werden.'
    reason: Die überlieferte englische Wendung ist im Deutschen mehrdeutig und möglicherweise textkritisch oder idiomatisch erklärungsbedürftig.
  - marker: b
    text: Der Text nennt eine »Sünde«, berichtet aber zugleich, dass die Prüfung keine Schuld offenbar machte.
    reason: Die sachliche und theologische Spannung des Wortlauts soll sichtbar bleiben, ohne sie im Haupttext aufzulösen.
  - marker: c
    text: 'Das zugrunde liegende »to you« kann nach dem vorliegenden englischen Zeugen auch als »an euch« verstanden werden: »Wenn der Herr, Gott, eure Sünde nicht an euch offenbar gemacht hat …«'
    reason: Die englische Vorlage lässt offen, ob die Offenbarung den Beschuldigten mitgeteilt oder an ihnen sichtbar gemacht wird.
lexical_decisions:
- source_word: the water of the Lord’s rebuke
  choice: das Wasser der Zurechtweisung des Herrn
  rationale: Die Formulierung bewahrt den kultisch-gerichtlichen Charakter des Prüftranks, ohne das nicht vorliegende griechische Ausgangswort spekulativ festzulegen.
- source_word: wilderness
  choice: Wildnis
  rationale: »Wildnis« gibt den offenen Bedeutungsumfang besser wieder als das engere »Wüste« und vermeidet eine unbelegte geografische Präzisierung.
- source_word: unharmed
  choice: unversehrt
  rationale: Die knappe Formulierung bezeichnet das Ausbleiben eines schädlichen Urteilszeichens, ohne dessen genaue Art zu ergänzen.
- source_word: reveal
  choice: offenbaren / offenbar werden
  rationale: Die Wortfamilie erhält den wiederholten Gedanken göttlicher Aufdeckung und passt zum würdevollen Erzählregister.
- source_word: glorifying
  choice: pries
  rationale: Im Deutschen ist »Gott preisen« natürlich und verständlich; es gibt den religiösen Sinn von »verherrlichen« idiomatisch wieder.
theological_decisions:
- issue: Nicht offenbarte »Sünde« nach bestandener Prüfung
  choice: Die Rede von »ihrer/eurer Sünde« bleibt stehen, obwohl die Prüfung keine Schuld sichtbar macht.
  alternative: »die ihnen vorgeworfene Sünde« oder »eine Schuld«
  rationale: Der Text spricht in der vorausgesetzten Anklagesprache von Sünde und lässt zugleich durch den Ausgang der Prüfung ihre Nichtaufdeckung bestehen. Diese Spannung wird nicht erklärend aufgelöst.
- issue: Bedeutung des Prüftranks
  choice: Der Trank wird neutral als »Wasser der Zurechtweisung des Herrn« wiedergegeben.
  alternative: »Fluchwasser«, »Eifersuchtswasser« oder ausdrückliche Gleichsetzung mit dem Ritual aus Numeri 5
  rationale: Ein möglicher biblischer Hintergrund soll nicht durch eine konfessionell oder exegetisch festlegende Bezeichnung in den Haupttext importiert werden.
- issue: Urteil des Priesters
  choice: »verurteile auch ich euch nicht«
  alternative: »richte auch ich euch nicht«
  rationale: »Verurteilen« macht im heutigen Deutsch den forensischen Sinn deutlich, ohne dem Priester göttliche Allwissenheit zuzuschreiben.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit kurzen, klaren Sätzen. Die wiederholte Struktur des Berichts bleibt erhalten, wird aber durch »doch«, »dann« und »auch« natürlich ins Deutsche geführt. Da eine direkte Prüfung der griechischen Handschriftentradition noch aussteht, ist der Entwurf ausdrücklich vorläufig und vermeidet griechische Rückschlüsse, die sich allein aus dem englischen Zeugen nicht sicher begründen lassen.
