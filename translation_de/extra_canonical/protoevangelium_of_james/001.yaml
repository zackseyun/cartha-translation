lexical_decisions:
- source_word: histories / (history) [Greek review pending]
  choice: Aufzeichnungen
  rationale: Der Kontext legt genealogische oder geschichtliche Verzeichnisse nahe. »Aufzeichnungen« ist im Deutschen natürlich und hält die genaue Art des Dokuments durch eine Fußnote offen.
- source_word: doubled the gifts
  choice: brachte ... seine Gaben in doppeltem Maß dar
  rationale: Gibt die Verdoppelung der Opfergaben klar wieder, ohne anzunehmen, dass es sich lediglich um zwei identische Einzelgaben handelte.
- source_word: for forgiveness, to atone for me
  choice: zur Vergebung dienen und für mich Sühne erwirken
  rationale: Bewahrt beide kultisch-theologischen Aussagen des Zeugnisses, ohne ihr Verhältnis dogmatisch enger zu bestimmen.
- source_word: had a child / raised children
  choice: ein Kind gezeugt / Nachkommen hervorgebracht
  rationale: Im Zusammenhang mit Joachims Kinderlosigkeit ist die biologische Abstammung gemeint. Die leicht unterschiedliche Formulierung folgt dem jeweiligen Singular- beziehungsweise Pluralkontext.
- source_word: considers me
  choice: sich meiner annimmt
  rationale: Natürliches, würdiges Deutsch; die mögliche wörtlichere Bedeutung »auf mich sehen/beachten« bleibt in der Fußnote erhalten.
- source_word: gave himself to the wilderness
  choice: zog sich in die Wüste zurück
  rationale: Idiomatistische Wiedergabe der bewussten Absonderung, ohne zusätzliche asketische Motive einzutragen.
theological_decisions:
- issue: Bedeutung der doppelten Gabe
  choice: Eine Gabe kommt dem Volk zugute; die andere dient vor Gott der Vergebung und Sühne für Joachim.
  alternative: Beide Gaben unmittelbar als Tempelopfer oder als genau bestimmte mosaische Opferarten deuten.
  rationale: Das Zeugnis unterscheidet Zweck und Empfänger, nennt aber keine präzisen Opfergattungen. Die Übersetzung wahrt diese Offenheit.
- issue: Reubels Zurückweisung Joachims
  choice: 'Die Aussage wird als Reubels Behauptung wiedergegeben: »Es steht dir nicht zu«.'
  alternative: Die Kinderlosigkeit als objektiven Beweis göttlicher Verwerfung darstellen.
  rationale: Der Text berichtet eine Anschuldigung, bestätigt ihre theologische Begründung aber an dieser Stelle nicht ausdrücklich.
- issue: Abrahams »letzte Tage«
  choice: »noch in dessen letzten Tagen«
  alternative: »in seinem hohen Alter«
  rationale: Die ungewöhnliche zeitliche Formulierung des Zeugnisses bleibt erhalten; eine Harmonisierung mit vertrauter biblischer Ausdrucksweise wird vermieden.
- issue: Joachims Fasten und Gebet
  choice: Das Gebet ist bildlich seine Speise und sein Trank, während er auf Gottes Zuwendung wartet.
  alternative: Das Fasten als verdienstliche Leistung oder als Mittel zur Erzwingung göttlichen Handelns deuten.
  rationale: Der Text beschreibt Entsagung und Bitte, legt aber keine ausgearbeitete Lehre über deren Verdienstlichkeit vor.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der Satzbau wurde behutsam geglättet, Wiederholungen und semitisch anmutende Erzählanschlüsse aber teilweise bewahrt. Der Entwurf ist ausdrücklich vorläufig, weil nur ein gemeinfreies englisches Zeugnis vorliegt und die direkte Prüfung der griechischen Handschriftentradition noch aussteht.
