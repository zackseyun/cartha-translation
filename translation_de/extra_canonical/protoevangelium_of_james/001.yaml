translation:
  language: de
  text: '**Protoevangelium des Jakobus — Kapitel 1: Joachims Bedrängnis**


    (1) In den Aufzeichnungen[a] über die zwölf Stämme Israels wird berichtet, dass Joachim ein sehr reicher Mann war. Er brachte dem Herrn seine Gaben in doppeltem Maß dar und sagte bei sich: »Die eine Gabe aus meinem Überfluss soll dem ganzen Volk zugutekommen; die andere soll dem Herrn, meinem Gott, zur Vergebung dienen und für mich Sühne erwirken.«


    (2) Als nun der große Tag des Herrn näher rückte und die Israeliten ihre Gaben darbrachten, trat Reubel vor Joachim und sagte: »Es steht dir nicht zu, deine Gaben als Erster darzubringen, denn du hast in Israel kein Kind gezeugt.«


    (3) Darüber wurde Joachim sehr betrübt. Er ging zu den Aufzeichnungen[a] über die zwölf Stämme des Volkes und sagte bei sich: »Ich will in den Aufzeichnungen über die zwölf Stämme Israels nachsehen, ob ich der Einzige bin, der in Israel kein Kind gezeugt hat.« Er forschte nach und stellte fest, dass alle Gerechten in Israel Nachkommen hervorgebracht hatten. Da erinnerte er sich daran, dass der Herr, Gott, dem Erzvater Abraham noch in dessen letzten Tagen einen Sohn geschenkt hatte: Isaak.


    (4) Joachim war tief betrübt. Er kehrte nicht zu seiner Frau zurück, sondern zog sich in die Wüste zurück und schlug dort sein Zelt auf. Vierzig Tage und vierzig Nächte fastete er und sagte bei sich: »Ich werde weder zum Essen noch zum Trinken hinabgehen, bis der Herr, mein Gott, sich meiner annimmt.[b] Mein Gebet soll mir Speise und Trank sein.«


    [a] Das zugrunde liegende englische Zeugnis kennzeichnet »history/histories« als unsichere Wiedergabe. Gemeint sein können schriftliche Aufzeichnungen, Stammesgeschichten oder genealogische Verzeichnisse.


    [b] Oder: »bis der Herr, mein Gott, auf mich sieht« beziehungsweise »mich beachtet«.'
  philosophy: optimal-equivalence
