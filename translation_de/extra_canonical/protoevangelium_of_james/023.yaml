translation:
  language: de
  text: '**23. Kapitel – Die Ermordung des Zacharias**


    (1) Herodes aber ließ nach Johannes suchen und sandte Diener zu Zacharias. Sie sollten ihn fragen: »Wo hältst du deinen Sohn verborgen?«


    Er antwortete ihnen: »Ich bin ein Diener Gottes und versehe meinen Dienst im Tempel Gottes. Woher sollte ich wissen, wo mein Sohn ist?«


    (2) Die Diener gingen zurück und berichteten Herodes alles. Da wurde Herodes zornig und sagte: »Sein Sohn soll König über Israel werden!«


    Er schickte seine Diener noch einmal zu Zacharias. Sie sollten ihm sagen: »Sag mir die Wahrheit: Wo ist dein Sohn? Du weißt, dass dein Leben in meiner Hand liegt.«


    Die Diener gingen hin und überbrachten ihm diese Worte.


    (3) Zacharias sagte: »Wenn ihr mein Blut vergießt, bin ich ein Zeuge Gottes,[a] denn der Herr wird meinen Geist aufnehmen. Ihr werdet nämlich am Eingang des Tempels des Herrn unschuldiges Blut vergießen.«


    Um die Morgendämmerung wurde Zacharias ermordet; das Volk Israel aber wusste nicht, dass er ermordet worden war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Märtyrer Gottes«.'
    reason: Der Ausdruck kann sowohl »Zeuge« als auch, besonders im Zusammenhang eines gewaltsamen Todes, »Märtyrer« bedeuten.
lexical_decisions:
- source_word: asked for John
  choice: ließ nach Johannes suchen
  rationale: Im Zusammenhang verlangt Herodes nach Johannes beziehungsweise lässt ihn suchen; die idiomatische deutsche Formulierung bewahrt diesen Sinn, ohne eine bereits erfolgte Festnahme anzudeuten.
- source_word: officers
  choice: Diener
  rationale: Die genaue amtliche Funktion ist anhand des vorliegenden englischen Zeugnisses nicht sicher bestimmbar. »Diener« bleibt allgemein und passt zu königlichen Beauftragten.
- source_word: minister of God
  choice: Diener Gottes
  rationale: »Diener« ist natürlich und würdig und vermeidet die moderne verwaltungssprachliche Bedeutung von »Minister«.
- source_word: I sit in God’s Temple
  choice: versehe meinen Dienst im Tempel Gottes
  rationale: Eine wörtliche Wiedergabe mit »sitze« wäre im Deutschen missverständlich. Die Formulierung gibt die erkennbare Aussage über Zacharias' Tempeldienst idiomatisch wieder.
- source_word: martyr of God
  choice: Zeuge Gottes
  rationale: Der zugrunde liegende Begriff kann »Zeuge« bedeuten und entwickelte erst später die feste Bedeutung »Märtyrer«. Die Übersetzung bewahrt die Zeugnisdimension; eine Fußnote nennt die mögliche traditionelle Wiedergabe.
- source_word: spirit
  choice: Geist
  rationale: Die herkömmliche und semantisch offene Wiedergabe lässt die anthropologische Aussage des Textes unbestimmt.
- source_word: around daybreak
  choice: Um die Morgendämmerung
  rationale: Bewahrt die ungefähre Zeitangabe des Zeugnisses.
theological_decisions:
- issue: Bedeutung von »martyr/Zeuge Gottes«
  choice: Zeuge Gottes
  alternative: Märtyrer Gottes
  rationale: »Zeuge« vermeidet, die spätere technische Bedeutung rückwirkend festzuschreiben. Da Zacharias unmittelbar vom Vergießen seines Blutes spricht, bleibt die Märtyrerbedeutung als Fußnotenalternative sichtbar.
- issue: Aufnahme des Geistes durch den Herrn
  choice: der Herr wird meinen Geist aufnehmen
  alternative: der Herr wird meinen Geist empfangen
  rationale: »Aufnehmen« bewahrt die Aussage über Gottes Annahme des Sterbenden, ohne eine weitergehende Lehre über den Zwischenzustand einzutragen.
- issue: Herodes’ Aussage über das Königtum
  choice: Sein Sohn soll König über Israel werden!
  alternative: Sein Sohn ist im Begriff, König über Israel zu werden!
  rationale: »Soll ... werden« gibt Herodes’ alarmierte Einschätzung natürlich wieder, ohne zu entscheiden, ob er eine Prophezeiung, Absicht oder unmittelbar bevorstehende Entwicklung meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerischer Klarheit. Die häufigen verbindenden Satzanfänge des Zeugnisses wurden teilweise erhalten, aber dort geglättet, wo eine wörtliche Nachbildung im Deutschen schwerfällig wäre. Der Entwurf bleibt wegen der noch ausstehenden direkten Prüfung der griechischen Handschriftentradition vorläufig.
