review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Handlungsablauf und die zentralen Aussagen überwiegend zutreffend wieder. Zwei Formulierungen gehen jedoch über das vorliegende Zeugnis hinaus bzw. werden unklar: »versehe meinen Dienst« interpretiert das ausdrückliche »I sit«; und das abschließende »überbrachten ihm diese Worte« lässt offen, dass die Beauftragten Herodes berichteten.'
  naturalness: Die Sprache ist im Allgemeinen modernes, würdiges Standarddeutsch. »Herodes fragte nach Johannes« ist näher am Wortlaut und ebenso idiomatisch. »Beauftragte« ist für die nicht näher bestimmte Funktion der officers natürlich und neutral. Die Wiederholung von »ermordet« am Schluss ist stilistisch hart, aber quellengerecht und daher beizubehalten.
  terminology: »Zeuge Gottes« kann die Grundbedeutung von martyr bewahren; die Fußnote muss die im Kontext naheliegende Lesart »Märtyrer Gottes« nennen. »Diener Gottes«, »Geist«, »Tempel Gottes/des Herrn« und »unschuldiges Blut« sind angemessen. »Beauftragte« vermeidet die zu private Einengung von »Diener« für königliche officers.
  issues:
  - severity: medium
    issue: Interpretierende Wiedergabe von »I sit in God’s Temple«
    rationale: »Versehe meinen Dienst im Tempel Gottes« erklärt die Aussage als amtlichen Tempeldienst. Das Zeugnis sagt ausdrücklich nur, dass Zacharias im Tempel sitzt. Die deutsche wörtliche Wiedergabe ist verständlich und sollte bevorzugt werden.
  - severity: medium
    issue: Unklarer Bezug in Vers 2
    rationale: »Die Diener gingen hin und überbrachten ihm diese Worte« entspricht weder klar dem Zurückkehren noch dem Berichten an Herodes; das Pronomen kann fälschlich auf Zacharias bezogen werden. Der Empfänger ist explizit zu nennen.
  - severity: low
    issue: »ließ nach Johannes suchen« ist enger als »asked for John«
    rationale: Die Formulierung legt einen Suchauftrag nahe. »fragte nach Johannes« bewahrt offen, ob Herodes nach Johannes selbst verlangte oder Erkundigungen über ihn einzog.
  revised_text: '**23. Kapitel – Die Ermordung des Zacharias**


    (1) Herodes aber fragte nach Johannes und schickte Beauftragte zu Zacharias, die zu ihm sagen sollten: »Wo hältst du deinen Sohn verborgen?«


    Er antwortete ihnen: »Ich bin ein Diener Gottes und sitze im Tempel Gottes. Woher sollte ich wissen, wo mein Sohn ist?«


    (2) Seine Beauftragten gingen fort und berichteten Herodes dies alles. Da wurde Herodes zornig und sagte: »Sein Sohn ist im Begriff, König über Israel zu werden!«


    Und er schickte seine Beauftragten noch einmal, um ihm zu sagen: »Sag mir die Wahrheit: Wo ist dein Sohn? Du weißt, dass dein Leben in meiner Hand ist.«


    Die Beauftragten gingen fort und berichteten ihm dies.


    (3) Zacharias sagte: »Wenn ihr mein Blut vergießt, bin ich ein Zeuge Gottes,[a] denn der Herr wird meinen Geist aufnehmen, weil ihr am Eingang des Tempels des Herrn unschuldiges Blut vergießen werdet.«


    Um die Morgendämmerung wurde Zacharias ermordet, und das Volk Israel wusste nicht, dass er ermordet worden war.'
  revised_footnotes:
  - marker: a
    text: 'Oder: »ein Märtyrer Gottes«.'
    reason: Das griechische Wort kann »Zeuge« bedeuten und bezeichnet im Zusammenhang eines gewaltsamen Todes auch einen Märtyrer. Die Fußnote erhält beide Deutungsmöglichkeiten.
  revision_rationale: Die Revision reduziert interpretierende Zusätze, klärt die Berichtskette in Vers 2 und verwendet für die königlichen officers eine funktionsneutrale Bezeichnung. Die Formulierung »ist im Begriff, ... zu werden« gibt die unmittelbare, alarmierte Aussage des englischen Zeugnisses näher wieder als »soll ... werden«. Die Ambiguität von martyr bleibt im Text und in der Fußnote sichtbar.
