review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Zeugen weitgehend zuverlässig. Korrigiert werden sollte jedoch die zusätzliche Bewegungsangabe „trat zu ihm“: Der Engel steht dort lediglich in der Nähe. Auch die Formulierung zur durch ein Zeichen bestimmten Person muss im Deutschen eindeutiger die im Zeugen ausgesagte eheliche Zuordnung wiedergeben.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Sie blieb im Tempel“ legt gegenüber „Mary was in the Temple“ unnötig ein Fortdauern nahe; „Maria war im Tempel“ ist genauer. „ihretwegen beten“ ist hier natürlicher als „wegen ihr beten“.
  terminology: '„Allerheiligste“, „Stab“, „Herolde“ und „Trompete des Herrn“ sind tragfähige Wiedergaben. „Oberster Priester“ wahrt gegenüber dem englischen „chief priest“ die nötige Zurückhaltung. Die bisherigen Fußnoten sind nicht erforderlich: Sie dokumentieren vor allem den provisorischen Übersetzungsweg, erläutern aber keine im deutschen Text verbleibende, leserelevante Unklarheit.'
  issues:
  - severity: medium
    issue: 'Zusatz in Vers 3: „Ein Engel des Herrn trat zu ihm“'
    rationale: Der Zeuge sagt, der Engel habe in der Nähe gestanden. Ein Herantreten zum Priester wird nicht berichtet und sollte nicht ergänzt werden.
  - severity: medium
    issue: Eheliche Zuweisung in Vers 3 ist deutschsprachig missverständlich
    rationale: „Wem ... bestimmt, dessen Frau soll sie werden“ ist zwar verständlich, aber die Relativkonstruktion ist schwerfällig und kann die Zuordnung verwischen. „Derjenige, den ... bezeichnet, soll ihr Mann werden“ gibt die Aussage des Zeugen klar und ohne Abschwächung wieder.
  - severity: low
    issue: „Maria aber blieb im Tempel“ verstärkt die Aussage
    rationale: Der Zeuge stellt fest, dass Maria im Tempel war; „blieb“ fügt eine ausdrückliche Fortdauer hinzu.
  revised_text: '(1) Ihre Eltern gingen hinab. Sie staunten, priesen und verherrlichten Gott, den Herrn, weil das Kind nicht umgekehrt war. Maria war im Tempel des Herrn. Sie wurde wie eine Taube umsorgt und empfing Nahrung aus der Hand eines Engels.


    (2) Als sie zwölf Jahre alt wurde, versammelten sich die Priester zu einer Beratung und sagten: »Seht, Maria ist seit zwölf Jahren im Tempel des Herrn. Was sollen wir mit ihr tun, damit sie das Heiligtum des Herrn, unseres Gottes, nicht verunreinigt?« Sie sagten zum obersten Priester: »Du stehst am Altar des Herrn. Geh hinein und bete ihretwegen. Wenn der Herr, unser Gott, dir etwas offenbart, werden wir es tun.«


    (3) Da ging der oberste Priester hinein, nahm das Gewand mit den zwölf Glöckchen mit in das Allerheiligste und betete ihretwegen. Und siehe: Ein Engel des Herrn stand in der Nähe und sagte: »Sacharja, Sacharja, geh hinaus und versammle die Witwer des Volkes. Jeder von ihnen soll einen Stab mitbringen. Derjenige, den der Herr, unser Gott, durch ein Zeichen bezeichnet, soll ihr Mann werden.«


    Da zogen die Herolde durch das ganze Umland von Judäa und ließen die Trompete des Herrn erschallen. Und siehe: Alle Männer eilten herbei.'
  revised_footnotes: []
  revision_rationale: Die Revision entfernt eine nicht im Zeugen enthaltene Handlung des Engels, vermeidet eine leichte Verstärkung der Tempelangabe und klärt die grammatische Zuordnung der Ehe ohne die Aussage des Textes zu harmonisieren. Die ungewöhnliche Wendung „Trompete des Herrn“ und die offene Reichweite von „alle Männer“ bleiben im Haupttext erhalten; zusätzliche Fußnoten würden hier keine textliche Unsicherheit lösen, sondern lediglich den vorläufigen Übersetzungsstatus wiederholen.
