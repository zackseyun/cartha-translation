base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: de
  text: '(1) Ihre Eltern gingen hinab. Sie staunten und priesen und verherrlichten Gott, den Herrn, weil das Kind nicht umgekehrt war. Maria aber blieb im Tempel des Herrn. Sie wurde wie eine Taube umsorgt und empfing Nahrung aus der Hand eines Engels.


    (2) Als sie zwölf Jahre alt wurde, versammelten sich die Priester zu einer Beratung und sagten: »Seht, Maria ist seit zwölf Jahren im Tempel des Herrn. Was sollen wir mit ihr tun, damit sie das Heiligtum des Herrn, unseres Gottes, nicht verunreinigt?« Sie sagten zum obersten Priester: »Du stehst am Altar des Herrn. Geh hinein und bete wegen ihr. Wenn der Herr, unser Gott, dir etwas offenbart, werden wir es tun.«


    (3) Da ging der oberste Priester hinein. Er nahm das Gewand mit den zwölf Glöckchen und betrat das Allerheiligste; dort betete er wegen ihr. Und siehe: Ein Engel des Herrn trat zu ihm und sagte: »Sacharja, Sacharja, geh hinaus und versammle die Witwer des Volkes. Jeder von ihnen soll einen Stab mitbringen. Wem der Herr, unser Gott, durch ein Zeichen bestimmt, dessen Frau soll sie werden.«[a]


    Da zogen die Herolde durch das ganze Umland von Judäa und ließen die Trompete des Herrn erschallen.[b] Und siehe: Alle Männer eilten herbei.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorliegende englische Zeuge lautet wörtlich sinngemäß: „Wen der Herr, Gott, durch ein Zeichen bezeichnet, dessen Frau wird sie sein.“ Eine unmittelbare Prüfung der griechischen Überlieferung steht noch aus.'
    reason: Kennzeichnet die quellensprachlich noch zu prüfende Formulierung und bewahrt ihre mögliche rechtliche beziehungsweise eheliche Tragweite.
  - marker: b
    text: „Trompete des Herrn“ folgt der ungewöhnlichen Formulierung des vorliegenden Zeugen; gemeint sein kann ein heiliger oder im Auftrag des Herrn ergehender Trompetenruf.
    reason: Die Genitivbeziehung ist ohne griechische Quellenprüfung nicht sicher zu bestimmen.
  - marker: c
    text: „Alle Männer“ gibt den Wortlaut des Zeugen wieder; im Zusammenhang sind offenbar die zuvor zusammengerufenen Witwer gemeint.
    reason: Verhindert eine unnötige Verengung im Haupttext, erläutert aber den unmittelbaren erzählerischen Bezug.
lexical_decisions:
- source_word: went down
  choice: gingen hinab
  rationale: Bewahrt die räumliche Bewegungsangabe des Zeugen, ohne ein nicht genanntes Ziel hinzuzufügen.
- source_word: was nurtured like a dove
  choice: wurde wie eine Taube umsorgt
  rationale: Natürliches modernes Deutsch; lässt offen, ob Pflege, Ernährung oder behütetes Aufwachsen im Vordergrund steht.
- source_word: pollute / defile
  choice: verunreinigt
  rationale: Gibt den kultischen Zusammenhang sachgerecht wieder und vermeidet eine bloß moralische Engführung.
- source_word: chief priest
  choice: oberster Priester
  rationale: Formale Wiedergabe, die gegenüber dem stärker festgelegten Titel „Hohepriester“ vorsichtig bleibt, solange die griechische Quellenprüfung aussteht.
- source_word: Holy of Holies
  choice: Allerheiligste
  rationale: Eingebürgerter und verständlicher deutscher Ausdruck für den innersten Tempelbereich.
- source_word: staff
  choice: Stab
  rationale: Bewahrt das Zeichenmotiv, ohne die Gestalt oder Funktion des Gegenstands näher festzulegen.
- source_word: heralds
  choice: Herolde
  rationale: Gibt die öffentlich ausrufenden Boten in würdigem, noch verständlichem Deutsch wieder.
- source_word: trumpet of the Lord
  choice: Trompete des Herrn
  rationale: Bewahrt die ungewöhnliche Genitivverbindung des Zeugen, statt sie erklärend umzudeuten.
theological_decisions:
- issue: Marias mögliche Verunreinigung des Heiligtums
  choice: Die kultisch belastete Aussage wird direkt als „das Heiligtum ... verunreinigt“ wiedergegeben.
  alternative: Euphemistische Wiedergabe oder ausdrückliche Erklärung mit Bezug auf Menstruation.
  rationale: Der Text nennt den Grund nicht ausdrücklich. Die Übersetzung bewahrt die historische Spannung, ohne zusätzliche Reinheitslehre einzutragen.
- issue: Zuweisung Marias an einen Witwer
  choice: „dessen Frau soll sie werden“
  alternative: „sie soll seiner Obhut anvertraut werden“ oder „sie soll seine Verlobte werden“
  rationale: Der vorliegende Zeuge sagt ausdrücklich „wife“. Eine harmonisierende Abschwächung würde die Aussage des Textes verändern; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- issue: Engelsnahrung
  choice: „empfing Nahrung aus der Hand eines Engels“
  alternative: Metaphorische oder naturalistische Umdeutung
  rationale: Die übernatürliche Aussage wird als Behauptung der Erzählung unverändert bewahrt.
- issue: Bestimmung durch ein göttliches Zeichen
  choice: „Wem der Herr, unser Gott, durch ein Zeichen bestimmt“
  alternative: „Bei wessen Stab der Herr ein Zeichen zeigt“
  rationale: Die Formulierung bewahrt, dass Gott die betreffende Person bezeichnet, ohne vor der griechischen Prüfung die genaue Beziehung zwischen Zeichen, Mann und Stab festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Wiederholungen wie „Und siehe“ sowie die Anrede „Sacharja, Sacharja“ bleiben als Stilmerkmale erhalten. Der Entwurf ist wegen der ausstehenden direkten Prüfung der griechischen Handschriftentradition ausdrücklich vorläufig und stützt sich quellenkritisch auf den bereitgestellten gemeinfreien englischen Zeugen sowie konsultativ auf die englische POB-Fassung.
