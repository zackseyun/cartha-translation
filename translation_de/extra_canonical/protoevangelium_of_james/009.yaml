base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/009.yaml
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: de
  text: '(1) Josef legte sein Beil nieder und ging zu ihrer Versammlung. Als alle zusammengekommen waren, gingen sie mit ihren Stäben zum Priester. Der Priester nahm die Stäbe entgegen, ging in den Tempel und betete. Nachdem er sein Gebet beendet hatte, nahm er die Stäbe, ging hinaus und gab sie ihnen zurück. Doch an keinem von ihnen zeigte sich ein Zeichen. Als Letzter nahm Josef seinen Stab. Und sieh: Eine Taube kam aus dem Stab hervor und flog auf Josefs Kopf. Da sagte der Priester zu Josef: »Du bist dazu erwählt worden, die Jungfrau des Herrn bei dir aufzunehmen und zu behüten.«


    (2) Josef aber widersprach: »Ich habe Söhne und bin ein alter Mann; sie dagegen ist jung. Ich will nicht zum Gespött unter den Israeliten werden.«


    Der Priester sagte: »Josef, fürchte den Herrn, deinen Gott! Denk daran, was Gott mit Datan, Abiram und Korach tat: Die Erde tat sich auf und verschlang sie alle wegen ihrer Auflehnung. Darum fürchte dich nun, Josef, damit so etwas nicht in deinem Haus geschieht.«


    (3) Da bekam Josef Angst und nahm Maria in seine Obhut. Er sagte zu ihr: »Maria, ich habe dich aus dem Tempel des Herrn aufgenommen und lasse dich nun in meinem Haus zurück. Ich gehe fort, um Häuser zu bauen, doch ich werde zu dir zurückkommen. Der Herr wird dich beschützen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: axe / Greek σκέπαρνον (source-language review pending)
  choice: Beil
  rationale: »Beil« bezeichnet natürlich und knapp Josefs Werkzeug; die genaue fachsprachliche Bestimmung des griechischen Werkzeugnamens sollte bei der abschließenden Prüfung des griechischen Textes bestätigt werden.
- source_word: staffs / Greek ῥάβδοι
  choice: Stäbe
  rationale: Bewahrt den kultisch-erzählerischen Gegenstand, ohne ihn als Wanderstab oder Zepter näher festzulegen.
- source_word: welcome ... into your own care / Greek τήρησις
  choice: bei dir aufnehmen und behüten / in seine Obhut nehmen
  rationale: Gibt sowohl die Aufnahme als auch den Schutz- und Bewahrungsauftrag wieder; eine eheliche Beziehung wird nicht in den Wortlaut hineingetragen.
- source_word: virgin of the Lord
  choice: Jungfrau des Herrn
  rationale: Bewahrt die feierliche Bezeichnung und ihre religiöse Zuordnung ohne erklärende Erweiterung.
- source_word: rebellion / Greek ἀντιλογία
  choice: Auflehnung
  rationale: Passt zum warnenden Rückblick auf Datan, Abiram und Korach und lässt offen, ob vor allem Widerspruch, Widerstand oder Rebellion gemeint ist.
- source_word: build houses
  choice: Häuser bauen
  rationale: Bewahrt den auffälligen Plural des Zeugnisses, statt ihn zu »an einem Haus arbeiten« zu glätten.
theological_decisions:
- issue: Art von Josefs Verantwortung für Maria
  choice: Als Aufnahme und Obhut formuliert
  alternative: Als Verlobung oder Eheschließung formulieren
  rationale: Der vorliegende Wortlaut betont Bewahrung und Fürsorge. Eine genauere rechtliche oder eheliche Einordnung würde mehr festlegen, als diese Passage ausdrücklich sagt.
- issue: Die Taube als Zeichen
  choice: Das Geschehen wird ohne Deutung erzählt
  alternative: Die Taube ausdrücklich als Heiligen Geist oder göttliches Siegel erklären
  rationale: Der Text nennt die Taube als Zeichen, deutet ihre Identität oder Symbolik hier aber nicht ausdrücklich.
- issue: Warnung vor dem Gericht über Datan, Abiram und Korach
  choice: Die Drohung in ihrer Härte bewahrt
  alternative: Die Aussage abschwächen oder nur als allgemeine Mahnung wiedergeben
  rationale: Die theologische Spannung zwischen göttlicher Erwählung, menschlicher Furcht und angedrohtem Gericht gehört zum Text und soll nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die Namensformen Josef, Datan, Abiram und Korach folgen geläufigen deutschen Bibelformen. Der Entwurf berücksichtigt, soweit rekonstruierbar, den griechischen Wortlaut, bleibt aber wegen der ausdrücklich noch ausstehenden direkten Prüfung der griechischen Handschriftentradition vorläufig.
