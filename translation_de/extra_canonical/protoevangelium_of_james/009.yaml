review_pass:
  verdict: revise
  source_fidelity: 'Eine sinnverändernde Abweichung liegt in V. 3 vor: »lasse dich nun in meinem Haus zurück« bedeutet, Maria dort zurückzulassen, während das Zeugnis ausdrücklich sagt, Josef bringe sie jetzt in sein Haus. Auch »widersprach« bildet Josefs ausdrückliche Weigerung nur ungenau ab. Im Übrigen folgt die Übersetzung dem vorliegenden englischen Zeugen weitgehend eng, einschließlich des Zeichens der Taube, der Warnung unter Bezug auf Datan, Abiram und Korach sowie des Plurals »Häuser bauen«.'
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch in angemessen würdigem Erzählregister. »weigerte sich« ist für die direkte Zurückweisung natürlicher als »widersprach«. »bringe dich jetzt in mein Haus« ist klar und idiomatisch.
  terminology: »Beil«, »Stäbe«, »Jungfrau des Herrn«, »Obhut«, »Datan, Abiram und Korach« sowie »Auflehnung« sind sachgerecht. Die Wiedergabe von Josefs Auftrag als Aufnahme in Obhut vermeidet zu Recht eine nicht ausdrücklich genannte rechtliche oder eheliche Einordnung. Das zusätzliche »behüten« in V. 1 wird vermieden, weil der anschließende Satz den Schutz ausdrücklich dem Herrn zuschreibt.
  issues:
  - severity: high
    issue: 'V. 3: »lasse dich nun in meinem Haus zurück«'
    rationale: 'Dies kehrt die Handlung des Zeugen um: Josef sagt nicht, dass er Maria in seinem Haus zurücklasse, sondern dass er sie jetzt in sein Haus bringe.'
  - severity: medium
    issue: 'V. 2: »Josef aber widersprach«'
    rationale: Das englische Zeugnis sagt ausdrücklich, dass Josef sich weigerte. »Widersprach« kann bloßes Einwenden bezeichnen und schwächt die Ablehnung ab.
  - severity: low
    issue: 'V. 1: »bei dir aufnehmen und behüten«'
    rationale: »Behüten« ist als Deutung des Obhutsauftrags verständlich, fügt aber gegenüber »in deine Obhut aufnehmen« eine Schutzhandlung hinzu. Eine knappere Fassung wahrt die Formulierung des Zeugen und die offene Reichweite von Josefs Verantwortung.
  revised_text: '(1) Josef legte sein Beil nieder und ging zu ihrer Versammlung. Als alle zusammengekommen waren, gingen sie mit ihren Stäben zum Priester. Der Priester nahm alle ihre Stäbe, ging in den Tempel und betete. Nachdem er das Gebet beendet hatte, nahm er die Stäbe, ging hinaus und gab sie ihnen zurück. Doch an keinem von ihnen zeigte sich ein Zeichen. Josef nahm seinen Stab als Letzter, und sieh: Eine Taube kam aus dem Stab hervor und flog auf Josefs Kopf. Da sagte der Priester zu Josef: »Du bist dazu erwählt worden, die Jungfrau des Herrn in deine Obhut aufzunehmen.«


    (2) Josef aber weigerte sich und sagte: »Ich habe Söhne und bin ein alter Mann; sie dagegen ist jung. Ich will nicht zum Gespött unter den Israeliten werden.«


    Der Priester sagte: »Josef, fürchte den Herrn, deinen Gott! Denk daran, was Gott mit Datan, Abiram und Korach tat: Die Erde tat sich auf und verschlang sie alle wegen ihrer Auflehnung. Darum fürchte dich nun, Josef, damit so etwas nicht in deinem Haus geschieht.«


    (3) Da bekam Josef Angst und nahm Maria in seine Obhut. Er sagte zu ihr: »Maria, ich habe dich aus dem Tempel des Herrn aufgenommen und bringe dich jetzt in mein Haus. Ich gehe fort, um Häuser zu bauen, doch ich werde zu dir zurückkommen. Der Herr wird dich beschützen.«'
  revised_footnotes: []
  revision_rationale: 'Die Revision stellt in V. 3 die Bewegungsrichtung und Handlung des Zeugen wieder her: Josef bringt Maria in sein Haus, statt sie dort zurückzulassen. Ferner wird Josefs Weigerung ausdrücklich wiedergegeben und die Formulierung seines Auftrags auf die im Zeugnis genannte Aufnahme in Obhut beschränkt. Keine Fußnoten sind erforderlich; es gibt keine Fußnotenanker im Entwurf. Die direkte Prüfung der griechischen Handschriftentradition bleibt für die abschließende Absicherung einzelner lexikalischer Nuancen ausstehend.'
