translation:
  language: de
  text: '(1) Und sieh: Eine Frau kam vom Berg herab und sagte zu mir: „Mann, wohin gehst du?“


    Ich sagte: „Ich suche eine hebräische Hebamme.“


    Sie erwiderte: „Bist du aus Israel?“


    Ich sagte zu ihr: „Ja.“


    Da fragte sie: „Und wer ist die Frau, die in der Höhle gebiert?“


    Ich sagte: „Meine Verlobte.“


    Sie fragte mich: „Sie ist nicht deine Frau?“


    Ich sagte zu ihr: „Maria wurde im Tempel des Herrn großgezogen, und durch das Los wurde bestimmt, dass sie meine Frau werden sollte. Doch sie ist nicht meine Frau; vielmehr hat sie vom Heiligen Geist empfangen.“


    Die Hebamme fragte: „Ist das wahr?“


    Josef sagte zu ihr: „Komm und sieh!“


    Und die Hebamme ging mit ihm.


    (2) Sie traten vor die Höhle, und eine leuchtende Wolke überschattete die Höhle. Da sagte die Hebamme: „Heute wird meine Seele groß erhoben, denn meine Augen haben etwas Wunderbares gesehen: Israel ist das Heil geboren!“[a]


    Sogleich wich die Wolke aus der Höhle, und in der Höhle erschien ein großes Licht, sodass ihre Augen es nicht ertragen konnten. Wenig später wich das Licht zurück, bis ein Säugling sichtbar wurde. Er kam und nahm die Brust seiner Mutter Maria.


    Da rief die Hebamme aus: „Wie groß ist dieser Tag für mich, denn ich habe dieses neuartige Wunder gesehen!“


    (3) Die Hebamme ging aus der Höhle hinaus, und Salome begegnete ihr.


    Sie sagte zu ihr: „Salome, Salome, ich muss dir von einem neuartigen Anblick erzählen: Eine Jungfrau hat geboren – entgegen ihrer Natur!“[b]


    Salome sagte: „So wahr der Herr, mein Gott, lebt: Wenn ich ihren Zustand nicht untersuche, werde ich nicht glauben, dass die Jungfrau geboren hat.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „Israel ist das Heil geboren“ kann sowohl die Geburt des von Gott geschenkten Heils als auch die desjenigen bezeichnen, der dieses Heil bringt.
    reason: Bewahrt die theologische Mehrdeutigkeit des substantivischen Ausdrucks.
  - marker: b
    text: '„Entgegen ihrer Natur“ gibt die paradoxe Aussage des überlieferten Zeugnisses wieder: Die Sprecherin hält eine Geburt bei fortbestehender Jungfräulichkeit für naturwidrig beziehungsweise außergewöhnlich.'
    reason: Verhindert, dass die knappe Formulierung als allgemeine Abwertung weiblicher Natur missverstanden wird.
  - marker: c
    text: Mit der Untersuchung ihres „Zustands“ ist im Zusammenhang eine körperliche Prüfung der behaupteten Jungfräulichkeit gemeint.
    reason: Erklärt die zurückhaltende indirekte Ausdrucksweise, ohne im Haupttext unnötig explizit zu werden.
lexical_decisions:
- source_word: look / Greek witness likely ἰδού
  choice: Und sieh
  rationale: Bewahrt den erzählerischen Aufmerksamkeitsruf in natürlichem, zugleich schriftsprachlich-würdigem Deutsch.
- source_word: Hebrew midwife
  choice: hebräische Hebamme
  rationale: Gibt die ethnische beziehungsweise gemeinschaftliche Bezeichnung formal wieder, ohne sie zu »jüdische Hebamme« zu modernisieren.
- source_word: betrothed
  choice: Verlobte
  rationale: Drückt das bestehende Eheversprechen aus und erhält zugleich die im Dialog ausdrücklich behauptete Spannung, dass Maria noch nicht Josefs Frau sei.
- source_word: overshadowed
  choice: überschattete
  rationale: Bewahrt die biblisch geprägte Wolkenbildsprache, obwohl die Wolke zugleich als leuchtend beschrieben wird.
- source_word: salvation
  choice: das Heil
  rationale: Das substantivische »Heil« erhält die theologische und personbezogene Offenheit stärker als eine erklärende Umschreibung wie »ein Retter«.
- source_word: condition
  choice: Zustand
  rationale: Bleibt zurückhaltend und wahrt die indirekte Formulierung des Zeugnisses; der Zusammenhang deutet eine körperliche Untersuchung an, ohne sie hier auszubuchstabieren.
theological_decisions:
- issue: Empfängnis durch den Heiligen Geist
  choice: „hat sie vom Heiligen Geist empfangen“
  alternative: „ist sie vom Heiligen Geist schwanger geworden“
  rationale: Die gewählte Form ist würdig und traditionsnah, ohne über die knappe Aussage hinaus einen Mechanismus zu erklären.
- issue: Josefs Verhältnis zu Maria
  choice: „sie ist nicht meine Frau“ trotz vorheriger Losbestimmung
  alternative: Glättung zu „wir haben die Ehe noch nicht vollzogen“
  rationale: Die auffällige Spannung des Zeugnisses wird nicht konfessionell oder harmonisierend aufgelöst.
- issue: Geburt des Heils für Israel
  choice: „Israel ist das Heil geboren“
  alternative: „Für Israel ist ein Retter geboren“
  rationale: Die abstrakt-personale Mehrdeutigkeit von »salvation« bleibt erhalten; die Alternative würde das Heil eindeutig als männliche Person auslegen.
- issue: Jungfrauengeburt und körperliche Prüfung
  choice: Die Behauptung sowie Salomes angekündigte Untersuchung werden direkt wiedergegeben.
  alternative: Euphemistische oder dogmatisch ausgearbeitete Erklärung
  rationale: Der Text entfaltet seine eigene erzählerische und theologische Spannung; eine spätere Lehre über Marias körperlichen Zustand wird nicht vorweggenommen.
