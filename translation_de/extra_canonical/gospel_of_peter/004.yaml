base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: de
  text: '(10) Sie brachten zwei Übeltäter herbei und kreuzigten den Herrn zwischen ihnen. Er aber schwieg, als hätte er keine Schmerzen. (11) Als sie das Kreuz aufgerichtet hatten, schrieben sie darauf: »Dies ist der König Israels.« (12) Sie legten seine Kleider vor ihm nieder, verteilten sie untereinander und warfen das Los darüber.


    (13) Doch einer jener Übeltäter wies sie zurecht und sagte: »Wir leiden so wegen des Unrechts, das wir begangen haben. Aber dieser ist zum Retter der Menschheit geworden – was für ein Unrecht hat er euch getan?«


    (14) Da wurden sie zornig auf ihn. Sie befahlen, dass ihm die Beine nicht gebrochen werden sollten, damit er qualvoll sterbe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich lässt die Formulierung offen, wessen Beine nicht gebrochen werden sollten. Der unmittelbare Zusammenhang kann auf den Übeltäter weisen, der sie zurechtgewiesen hatte; auch ein Bezug auf den Herrn ist möglich.
    reason: Bewahrt die vom englischen Zeugnis und der POB-Konsultationsfassung ausgewiesene Bezugsmehrdeutigkeit.
lexical_decisions:
- source_word: wrongdoers
  choice: Übeltäter
  rationale: Gibt die moralisch-rechtliche Bezeichnung würdevoll und ohne unnötige Festlegung auf eine bestimmte Straftat wieder.
- source_word: Lord
  choice: Herr
  rationale: Bewahrt die im Zeugnis verwendete christologische Bezeichnung.
- source_word: king of Israel
  choice: König Israels
  rationale: Entspricht der traditionellen und zugleich natürlichen deutschen Titelform.
- source_word: Savior of humanity
  choice: Retter der Menschheit
  rationale: Gibt den universalen Bezug wieder, ohne eine geschlechtlich verengende Formulierung zu verwenden.
- source_word: die tortured / die under torture
  choice: qualvoll sterbe
  rationale: Natürliches Deutsch, das den beabsichtigten Tod durch fortdauernde Qual ausdrückt, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Aussage, der Gekreuzigte sei zum Retter der Menschheit geworden
  choice: ist zum Retter der Menschheit geworden
  alternative: ist der Retter der Menschheit
  rationale: Die ungewöhnliche Werde-Formulierung des überlieferten englischen Zeugnisses bleibt erhalten und wird nicht zu einer zeitlosen Wesensaussage geglättet.
- issue: Bezug der nicht zu brechenden Beine in Vers 14
  choice: Pronomen im Haupttext mit erläuternder Fußnote
  alternative: ausdrückliche Zuordnung zum zurechtweisenden Übeltäter oder zu Jesus
  rationale: Der unmittelbare Erzählzusammenhang legt den zurechtweisenden Übeltäter nahe, doch die zugrunde liegende Formulierung ist mehrdeutig; die Fußnote hält diese Spannung offen.
- issue: Schweigen trotz Schmerz
  choice: als hätte er keine Schmerzen
  alternative: als empfände er keinen Schmerz
  rationale: Die Vergleichsaussage bleibt als Wahrnehmung formuliert und wird nicht zur Behauptung tatsächlicher Schmerzlosigkeit gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Wegen der noch ausstehenden direkten Prüfung des griechischen Textes ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugnis ausgerichtet; auffällige Mehrdeutigkeiten und theologische Spannungen wurden nicht stillschweigend bereinigt.
