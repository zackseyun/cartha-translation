revisions:
- from: 'Und er lieferte ihn dem Volk aus, noch vor dem ersten Tag ihres Festes der Ungesäuerten Brote. (6) Sie nahmen den Herrn, liefen mit ihm davon, stießen ihn vor sich her und sagten: »Lasst uns den Sohn Gottes fortschleppen – wir haben ja Gewalt über ihn!«


    (7) Sie legten ihm ein Purpurgewand an, setzten ihn auf den Richterstuhl und sagten: »Richte gerecht, König Israels!« (8) Einer von ihnen brachte einen Dornenkranz und setzte ihn dem Herrn auf den Kopf.


    (9) Einige der Umstehenden spuckten ihm ins Gesicht, andere schlugen ihn auf die Wangen. Wieder andere stachen ihn mit einem Rohrstock, und manche geißelten ihn und sagten: »Mit dieser Ehre wollen wir den Sohn Gottes ehren!«'
