base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/003.yaml
  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: de
  text: 'Und er lieferte ihn dem Volk aus, noch vor dem ersten Tag ihres Festes der Ungesäuerten Brote. (6) Diejenigen, die den Herrn ergriffen hatten, liefen und stießen ihn vorwärts und sagten: »Lasst uns den Sohn Gottes fortschleppen, da wir Macht über ihn haben!«


    (7) Sie kleideten ihn in Purpur, setzten ihn auf den Richterstuhl und sagten: »Richte gerecht, König Israels!« (8) Einer von ihnen brachte einen Dornenkranz und setzte ihn dem Herrn auf den Kopf.


    (9) Andere Umstehende spuckten ihm ins Gesicht, andere schlugen ihn auf die Wangen. Andere stachen ihn mit einem Rohr, und manche geißelten ihn und sagten: »Mit dieser Ehre wollen wir den Sohn Gottes ehren!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festival of the Unleavened Bread
  choice: Fest der Ungesäuerten Brote
  rationale: Bewahrt die traditionelle und sachlich präzise Bezeichnung des jüdischen Festes, ohne es stillschweigend mit einer anderen Festbezeichnung gleichzusetzen.
- source_word: were running, pushing him
  choice: liefen mit ihm davon, stießen ihn vor sich her
  rationale: Gibt die fortdauernde, gewaltsame Bewegung in natürlichem Deutsch wieder; das genaue Verhältnis der Handlungen bleibt aufgrund der nur englisch vermittelten Grundlage vorläufig.
- source_word: having authority over him
  choice: wir haben ja Gewalt über ihn
  rationale: „Gewalt“ erfasst hier sowohl Verfügungsgewalt als auch den höhnischen Machtanspruch der Sprecher.
- source_word: purple
  choice: Purpurgewand
  rationale: Im Deutschen verlangt der Zusammenhang eine natürliche Konkretisierung des substantivisch gebrauchten Farbausdrucks als Kleidungsstück.
- source_word: seat of judgment
  choice: Richterstuhl
  rationale: Entspricht der gerichtlichen Funktion des Sitzes und erhält den Zusammenhang mit dem spöttischen Befehl zu richten.
- source_word: thorn crown
  choice: Dornenkranz
  rationale: Gibt die Formulierung des Zeugen genauer wieder als das stärker traditionsgeprägte Kompositum „Dornenkrone“, während die königliche Verspottung aus dem Kontext hervorgeht.
- source_word: piercing him with a reed
  choice: stachen ihn mit einem Rohrstock
  rationale: Bewahrt die ungewöhnliche und möglicherweise mehrdeutige Gewalthandlung, statt sie zu „schlagen“ zu harmonisieren; „Rohrstock“ ist im Deutschen anschaulicher als bloß „Rohr“.
- source_word: With this honor, let’s honor
  choice: Mit dieser Ehre wollen wir … ehren
  rationale: Erhält die bittere Ironie und die auffällige Wortwiederholung des Zeugen.
theological_decisions:
- issue: Bezeichnung Jesu als „Sohn Gottes“ in den Spottreden
  choice: unverändert als „Sohn Gottes“ wiedergegeben
  alternative: als rein ironischen Titel abschwächen oder mit einer erklärenden Ergänzung versehen
  rationale: Der Text verbindet Misshandlung und theologischen Titel bewusst spannungsvoll; die Übersetzung darf die Ironie nicht auflösen.
- issue: „König Israels“ und der Richterstuhl
  choice: königlichen Titel und richterliche Szenerie wörtlich-spöttisch bewahrt
  alternative: die Aussagen ausdrücklich als Hohn markieren
  rationale: Die Ironie ergibt sich aus Handlung und Rede selbst; eine erläuternde Markierung würde interpretierend eingreifen.
- issue: Referent von „he“ in der Eröffnung
  choice: Pronomen „er“ beibehalten
  alternative: eine konkrete Person benennen
  rationale: Der vorgelegte Ausschnitt identifiziert den Referenten nicht; die genuine Kontextabhängigkeit wird nicht durch eine Vermutung beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung und unverstellter Härte der Misshandlung. Die Verszählung des Zeugen wurde beibehalten. Da eine direkte Prüfung des griechischen Akhmim-Textes ausdrücklich noch aussteht, ist die Fassung als vorläufiger, am englischen öffentlichen Zeugen orientierter Entwurf zu behandeln; besonders die Bewegungsverben in Vers 6 sowie „piercing … with a reed“ sollten bei der griechischen Quellenprüfung erneut bewertet werden.
