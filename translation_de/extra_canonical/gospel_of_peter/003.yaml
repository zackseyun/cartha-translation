  rationale: Die Revision beseitigt nicht gedeckte Richtungs-, Ton- und Sachzusätze und bewahrt zugleich die teils auffälligen Formulierungen des Zeugen. Insbesondere bleibt die Gewalthandlung mit dem „Rohr“ unharmonisiert; eine direkte Prüfung des griechischen Akhmim-Textes bleibt wegen der ausdrücklich nur vorläufigen Quellengrundlage angezeigt.
