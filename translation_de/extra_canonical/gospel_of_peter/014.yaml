  yaml_path: translation/extra_canonical/gospel_of_peter/014.yaml
  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: de
  text: (58) Es war der letzte Tag des Festes der Ungesäuerten Brote, und viele brachen auf und kehrten nach Hause zurück, weil das Fest zu Ende war. (59) Wir aber, die zwölf Jünger des Herrn, weinten und trauerten. Jeder von uns kehrte nach Hause zurück, betrübt über das, was geschehen war. (60) Ich aber, Simon Petrus, und mein Bruder Andreas nahmen unsere Netze und gingen zum See. Mit uns war Levi, der Sohn des Alphäus, den der Herr …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier bricht die erhaltene Handschrift ab.
    reason: Die Auslassungspunkte kennzeichnen keinen ausgelassenen übersetzbaren Inhalt, sondern das unvollständige Ende des Manuskripts.
lexical_decisions:
- source_word: Unleavened Bread
  choice: Fest der Ungesäuerten Brote
  rationale: Die Ergänzung „Fest“ macht im Deutschen deutlich, dass die Festzeit gemeint ist, und entspricht dem anschließenden Hinweis auf das Ende des Festes.
- source_word: houses / homes
  choice: nach Hause
  rationale: Natürliches modernes Deutsch; der Sinn der Rückkehr in die jeweilige häusliche Umgebung bleibt erhalten.
- source_word: sea
  choice: See
  rationale: Im erzählerischen Zusammenhang ist ein Binnengewässer gemeint; „See“ ist im Deutschen dafür die natürliche Bezeichnung, ohne im Fragment einen nicht ausdrücklich genannten Eigennamen einzuführen.
- source_word: grieving
  choice: trauerten / betrübt
  rationale: Die Variation vermeidet schwerfällige Wiederholung, bewahrt aber sowohl die gemeinsame Trauer als auch die persönliche Betrübnis jedes Einzelnen.
- source_word: went off
  choice: gingen
  rationale: Schlichtes, idiomatisches Deutsch, das die Bewegung zum See wiedergibt, ohne ein im vorliegenden Zeugnis nicht gesichertes zusätzliches Bedeutungsmerkmal einzutragen.
theological_decisions:
- issue: Bezeichnung der Gruppe als „die zwölf Jünger des Herrn“
  choice: Die überlieferte Selbstbezeichnung wird unverändert wiedergegeben.
  alternative: Die Zahl wegen der zuvor erzählten Ereignisse harmonisieren oder abschwächen.
  rationale: Die mögliche erzählerische beziehungsweise theologische Spannung ist Teil des Zeugnisses und darf nicht stillschweigend aufgelöst werden.
- issue: Unvollständiger Relativsatz über Levi
  choice: „den der Herr …“ bleibt syntaktisch offen.
  alternative: Den Satz anhand anderer Überlieferungen ergänzen.
  rationale: Der erhaltene Text bricht ab; eine Ergänzung wäre spekulativ und könnte eine nicht belegte Aussage über Levi oder den Herrn einführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Da eine direkte Prüfung des griechischen Textes noch aussteht, ist die Fassung ausdrücklich vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Textzeugen. Die Verszählung und die abrupte Schlussform wurden bewahrt.
