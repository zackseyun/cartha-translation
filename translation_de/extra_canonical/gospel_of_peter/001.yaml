base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: de
  text: '(1) Doch von den Juden wusch sich niemand die Hände, weder Herodes noch einer seiner Richter. Als sie sich nicht waschen wollten, stand Pilatus auf. (2) Dann befahl König Herodes, den Herrn vorzuführen, und sagte zu ihnen: »Tut mit ihm, was ich euch befohlen habe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: washed the hands
  choice: wusch sich … die Hände
  rationale: Natürliche deutsche Wiedergabe der im englischen Zeugen belegten Handlung; der bestimmte Artikel bewahrt den semitisch bzw. griechisch geprägten Ausdruck, ohne ihn unnötig auszudeuten.
- source_word: judges
  choice: Richter
  rationale: Formale und verständliche Entsprechung; eine genauere Amtsbezeichnung lässt sich ohne griechische Quellenprüfung nicht sichern.
- source_word: the Lord
  choice: den Herrn
  rationale: Bewahrt die christologische Bezeichnung des Zeugen, ohne den Referenten erläuternd zu erweitern.
- source_word: to be brought
  choice: vorzuführen
  rationale: Gibt das angeordnete Herbeibringen in idiomatischem Deutsch wieder; das im englischen POB ergänzte »before him« wird nicht eigens ausgedrückt, da es im angegebenen Zeugen nicht ausdrücklich steht.
theological_decisions:
- issue: Kollektive Bezeichnung »die Juden«
  choice: von den Juden
  alternative: von den jüdischen Verantwortlichen
  rationale: Die überlieferte pauschale Gruppenbezeichnung wird aus Texttreue bewahrt und nicht interpretierend auf Amtsträger eingeengt; der Text beschreibt die Figuren dieser Szene und darf nicht als Aussage über alle Juden verallgemeinert werden.
- issue: Bezug der Richter
  choice: einer seiner Richter
  alternative: einer ihrer Richter
  rationale: Der Singular »his judges« des bereitgestellten Zeugen wird formal auf Herodes bezogen; eine mögliche abweichende Zuordnung ist erst durch Prüfung des griechischen Wortlauts zuverlässig zu beurteilen.
- issue: Befehl über den Herrn
  choice: »Tut mit ihm, was ich euch befohlen habe.«
  alternative: »Tut, was ich euch befohlen habe, ihm anzutun.«
  rationale: Die gewählte Fassung ist natürlich und bewahrt den Handlungsbezug, ohne die Art der angeordneten Behandlung zu konkretisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Die Fassung ist ausdrücklich vorläufig, weil als Grundlage nur der bereitgestellte gemeinfreie englische Übersetzungszeuge dient und die direkte Prüfung des griechischen Textes des Akhmim-Codex noch aussteht.
