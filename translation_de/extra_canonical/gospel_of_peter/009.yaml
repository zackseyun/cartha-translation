review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt eng und bewahrt die Unterscheidung zwischen „Männern“ und „jungen Männern“ sowie die ungewöhnliche teilweise Bewegung des Steins. In V. 34 sollte jedoch „ging“ statt des perspektivisch verschobenen „kam“ stehen. In V. 37 gibt „wich teilweise zur Seite“ die im englischen Audit-Trail festgehaltene, etwas unklare Aussage „made way in part / moved partly aside“ unmittelbarer wieder als die deutende Folgeformulierung „gab den Zugang teilweise frei“; außerdem sollte die passive Öffnung des Grabes beibehalten werden.
  naturalness: Die Sprache ist überwiegend modernes, würdevolles Standarddeutsch. „Die Himmel“ ist als bewusste Wiedergabe des Plurals möglich; „wie sich die Himmel öffneten“ bleibt verständlich. Die überarbeitete Satzführung in V. 36–37 ist flüssig und wahrt die erzählerische Abfolge.
  terminology: „Sabbat“, „Tag des Herrn“, „Grab“, „Männer“ und „junge Männer“ sind angemessen. „Glanz“ gibt die Radiantheit wieder, ohne die Gestalten als Engel zu identifizieren oder ihre Erscheinung näher auszudeuten.
  issues:
  - severity: low
    issue: Bewegungsverb in V. 34
    rationale: Der Textzeuge sagt, die Menge „ging“ zum Grab. „Kam“ ist im Deutschen zwar möglich, setzt aber einen nicht ausdrücklich gegebenen Bezugspunkt voraus.
  - severity: medium
    issue: Bewegung des Steins in V. 37
    rationale: „Gab den Zugang teilweise frei“ legt die Wirkung der Bewegung stärker fest. „Wich teilweise zur Seite“ bildet die im Audit-Trail bewahrte ungewöhnliche und nicht weiter erklärte Formulierung unmittelbarer ab.
  - severity: low
    issue: Öffnung des Grabes in V. 37
    rationale: „Das Grab öffnete sich“ ist idiomatisch, aber die passive Form „Das Grab wurde geöffnet“ wahrt besser, dass der Text keinen Handelnden nennt.
  revised_text: (34) Als der Sabbatmorgen anbrach, ging eine Menschenmenge aus Jerusalem und dem umliegenden Land hin, um das versiegelte Grab zu sehen. (35) Doch in der Nacht, bevor der Tag des Herrn anbrach, während die Soldaten jeweils zu zweit Wache hielten, ertönte eine gewaltige Stimme im Himmel. (36) Sie sahen, wie sich die Himmel öffneten und zwei Männer von dort herabstiegen. Sie waren von großem Glanz umgeben und näherten sich dem Grab. (37) Der Stein aber, der vor den Eingang gelegt worden war, rollte von selbst weg und wich teilweise zur Seite. Das Grab wurde geöffnet, und beide jungen Männer gingen hinein.[a]
  revised_footnotes:
  - marker: a
    text: Diese Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Textes steht noch aus. Die ungewöhnliche Angabe, dass der Stein nur teilweise zur Seite wich, wurde beibehalten.
    reason: Kennzeichnet die begrenzte textkritische Grundlage und erläutert die auffällige, bedeutungstragende und im Textzeugen nicht weiter präzisierte Formulierung.
  revision_rationale: Die Revision beschränkt sich auf sichere, quellennahe Korrekturen. Sie vermeidet einen impliziten Standortwechsel in V. 34, wahrt in V. 37 sowohl die begrenzte Bewegung des Steins als auch die unbestimmte Passivform bei der Öffnung des Grabes und fügt keine theologische Identifikation der beiden Gestalten hinzu.
