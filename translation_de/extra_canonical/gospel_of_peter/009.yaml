base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: de
  text: (34) Als der Sabbatmorgen anbrach, kam eine Menschenmenge aus Jerusalem und dem umliegenden Land, um das versiegelte Grab zu sehen. (35) Doch in der Nacht, bevor der Tag des Herrn anbrach, während die Soldaten jeweils zu zweit Wache hielten, ertönte eine gewaltige Stimme im Himmel. (36) Sie sahen, wie sich die Himmel öffneten und zwei Männer von dort herabstiegen. Sie waren von großem Glanz umgeben und näherten sich dem Grab. (37) Der Stein aber, der vor den Eingang gelegt worden war, rollte von selbst weg und gab den Zugang teilweise frei. Das Grab öffnete sich, und beide jungen Männer gingen hinein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Textes steht noch aus. Die ungewöhnliche Angabe, der Stein habe den Zugang nur teilweise freigegeben, wurde beibehalten.
    reason: Die Quellenangabe kennzeichnet die begrenzte textkritische Grundlage und erläutert eine auffällige, aber bedeutungstragende Formulierung.
lexical_decisions:
- source_word: morning of the Sabbath
  choice: Sabbatmorgen
  rationale: Gibt die Zeitangabe knapp und in natürlichem modernem Deutsch wieder, ohne sie als Sonntag zu deuten.
- source_word: grave / tomb
  choice: Grab
  rationale: Einheitliche, allgemein verständliche Wiedergabe für die Begräbnisstätte.
- source_word: the Lord's day
  choice: Tag des Herrn
  rationale: Bewahrt die traditionelle Bezeichnung und vermeidet eine stillschweigende Ersetzung durch „Sonntag“.
- source_word: great voice in heaven
  choice: eine gewaltige Stimme im Himmel
  rationale: „Gewaltig“ vermittelt Größe und Wirkung natürlicher als das wörtliche „groß“, während „im Himmel“ die räumliche Aussage bewahrt.
- source_word: the heavens
  choice: die Himmel
  rationale: Der Plural des Zeugnisses bleibt erhalten, obwohl im modernen Deutsch auch der Singular geläufig wäre.
- source_word: having much radiance
  choice: von großem Glanz umgeben
  rationale: Natürliches Deutsch, das die auffällige Licht- oder Glanzerscheinung der Männer wiedergibt, ohne ihre Identität zu bestimmen.
- source_word: made way in part
  choice: gab den Zugang teilweise frei
  rationale: Bewahrt ausdrücklich die ungewöhnliche Einschränkung „teilweise“ und ergibt im Zusammenhang mit dem Eingang einen verständlichen Sinn.
- source_word: young men
  choice: junge Männer
  rationale: Folgt dem Wechsel von „Männer“ zu „junge Männer“, ohne daraus ausdrücklich Engel zu machen.
theological_decisions:
- issue: Identität der beiden Männer
  choice: Männer / junge Männer
  alternative: Engel
  rationale: Der Text bezeichnet sie als Männer beziehungsweise junge Männer; eine Engelidentifikation wäre eine theologische Auslegung, die der Übersetzung nicht hinzugefügt werden sollte.
- issue: Bedeutung des „Tages des Herrn“
  choice: Tag des Herrn
  alternative: Sonntag
  rationale: Die traditionelle Formulierung erhält die historische und mögliche theologische Spannung der Zeitangabe.
- issue: Öffnung des Grabes und Bewegung des Steins
  choice: Als eigenständige, außergewöhnliche Vorgänge wiedergegeben
  alternative: Durch die Männer bewirkte Vorgänge
  rationale: Das Zeugnis sagt, der Stein rolle von selbst weg und das Grab werde geöffnet; es nennt die Männer nicht ausdrücklich als Handelnde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Biblisch geprägte Ausdrücke wie „Sabbat“ und „Tag des Herrn“ bleiben erhalten; altertümliche Syntax und konfessionell festgelegte Deutungen werden vermieden.
