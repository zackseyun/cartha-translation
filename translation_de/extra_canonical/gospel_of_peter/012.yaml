base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: de
  text: '(50) In der Morgendämmerung am Tag des Herrn hatte Maria Magdalena, eine Jüngerin des Herrn, am Grab des Herrn noch nicht getan, was Frauen gewöhnlich für ihre verstorbenen Angehörigen tun; denn sie fürchtete sich vor den Juden, weil sie voller Zorn waren.


    (51) Sie nahm ihre Freundinnen mit und ging zu dem Grab, in das er gelegt worden war. (52) Sie fürchteten, die Juden könnten sie sehen, und sagten: »An dem Tag, an dem er gekreuzigt wurde, konnten wir nicht weinen und trauern. Vielleicht können wir es wenigstens jetzt an seinem Grab tun. (53) Aber wer wird uns den Stein wegrollen, der vor den Eingang des Grabes gelegt worden ist, damit wir hineingehen, uns zu ihm setzen und unsere Pflicht erfüllen können? (54) Denn der Stein ist groß, und wir fürchten, jemand könnte uns sehen. Und wenn wir nicht hineingehen können, wollen wir wenigstens das, was wir zu seinem Gedenken mitbringen, am Eingang niederlegen. Dann werden wir weinen und trauern, bis wir wieder nach Hause zurückkehren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Lord’s day
  choice: Tag des Herrn
  rationale: Die formnahe Wiedergabe bewahrt die mögliche frühchristliche Bezeichnung des Sonntags, ohne die Wendung erklärend aufzulösen.
- source_word: disciple
  choice: Jüngerin
  rationale: Die feminine deutsche Form gibt Marias ausdrückliche Stellung als Schülerin und Anhängerin des Herrn klar wieder.
- source_word: friends
  choice: Freundinnen
  rationale: Der Zusammenhang beschreibt eine gemeinsam handelnde Frauengruppe; die feminine Form ist im Deutschen natürlich und entspricht dem wahrscheinlichen Bezug.
- source_word: at the door of the grave
  choice: am Eingang / vor den Eingang des Grabes
  rationale: Für ein Grab ist »Eingang« im modernen Deutsch natürlicher als das wörtliche »Tür«, während die räumliche Aussage erhalten bleibt.
- source_word: do our duties
  choice: unsere Pflicht erfüllen
  rationale: Die Formulierung wahrt den Bezug auf die erwarteten Trauer- und Totendienste, ohne Einzelheiten hinzuzufügen, die der überlieferte Wortlaut nicht nennt.
- source_word: loved ones
  choice: Angehörigen
  rationale: »Angehörige« bezeichnet hier nahestehende Verstorbene idiomatisch und würdig, ohne die Beziehung genauer festzulegen.
theological_decisions:
- issue: Kollektive Bezeichnung »die Juden«
  choice: die Juden
  alternative: die jüdischen Verantwortlichen / ihre jüdischen Gegner
  rationale: Der zugrunde gelegte Textzeuge bezeichnet die Gruppe pauschal. Eine historische Präzisierung würde den problematischen Wortlaut interpretierend verändern; die Übersetzung bewahrt ihn, ohne ihn auszuweiten.
- issue: Bedeutung von »Tag des Herrn«
  choice: Tag des Herrn
  alternative: Sonntag
  rationale: Die traditionelle Wendung kann den ersten Wochentag bezeichnen, trägt aber eine eigene frühchristliche Prägung. Die formnahe Fassung bewahrt diese Spannung.
- issue: Charakter der Handlungen am Grab
  choice: unsere Pflicht erfüllen
  alternative: die Totenriten vollziehen
  rationale: Der Text spricht von einem üblichen Dienst der Frauen, legt dessen genaue rituelle Gestalt im vorliegenden Zeugnis jedoch nicht fest. Daher wird keine bestimmte Bestattungspraxis in den Text eingetragen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit gut lesbarer direkter Rede. Die Satzfolge wurde behutsam geglättet, ohne Erzählangaben oder Spannungen zu beseitigen. Der Entwurf ist ausdrücklich vorläufig: Zur Verfügung stand nur der angegebene gemeinfreie englische Textzeuge; eine unmittelbare Prüfung des griechischen Textes des Akhmim-Kodex steht noch aus.'
