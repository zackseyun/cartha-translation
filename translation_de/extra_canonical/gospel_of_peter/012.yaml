review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorliegenden englischen Textzeugen insgesamt eng. Zwei Nuancen benötigen jedoch Korrektur: Das unsichere »perhaps« wird durch »vielleicht« wiedergegeben, nicht durch das verstärkende »wenigstens«; und »if we aren’t able« bleibt im Ausgangstext unbestimmt und darf nicht auf die Unfähigkeit zum Hineingehen eingeengt werden.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. »Ihre verstorbenen Lieben« gibt den persönlichen Bezug von »loved ones« unmittelbarer wieder als »Angehörige«, ohne eine konkrete Verwandtschaftsbeziehung festzulegen.
  terminology: »Tag des Herrn«, »Jüngerin«, »die Juden« und »unsere Pflicht erfüllen« sind als formnahe, im Kontext verständliche Wiedergaben vertretbar. Die pauschale Gruppenbezeichnung wird nicht interpretierend verschärft oder eingeschränkt.
  issues:
  - severity: medium
    issue: »Vielleicht können wir es wenigstens jetzt« ergänzt eine Verstärkung.
    rationale: 'Der Textzeuge hat »perhaps even now«: »vielleicht ... jetzt« bewahrt die Unsicherheit; »wenigstens« trägt zusätzlich die Bedeutung von »at least« ein, die erst im folgenden Satz steht.'
  - severity: medium
    issue: »wenn wir nicht hineingehen können« legt den Grund der Unfähigkeit fest.
    rationale: »If we aren’t able« lässt offen, wozu sie nicht imstande wären; der Zusammenhang kann den Stein, das Eintreten oder die beabsichtigte Handlung betreffen. Die Übersetzung soll diese Offenheit bewahren.
  - severity: low
    issue: »Angehörigen« ist gegenüber »loved ones« etwas sachlicher und enger.
    rationale: »Ihre verstorbenen Lieben« bewahrt den affektiven, nicht näher bestimmten Beziehungsbezug des Textzeugen natürlicher.
  revised_text: '(50) In der Morgendämmerung am Tag des Herrn hatte Maria Magdalena, eine Jüngerin des Herrn, am Grab des Herrn noch nicht getan, was Frauen gewöhnlich für ihre verstorbenen Lieben tun; denn sie fürchtete sich vor den Juden, weil sie voller Zorn waren.


    (51) Sie nahm ihre Freundinnen mit und ging zu dem Grab, in das er gelegt worden war. (52) Sie fürchteten, die Juden könnten sie sehen, und sagten: »An dem Tag, an dem er gekreuzigt wurde, konnten wir nicht weinen und trauern. Vielleicht können wir es jetzt an seinem Grab tun. (53) Aber wer wird uns den Stein wegrollen, der vor den Eingang des Grabes gelegt worden ist, damit wir hineingehen, uns zu ihm setzen und unsere Pflicht erfüllen können? (54) Denn der Stein ist groß, und wir fürchten, jemand könnte uns sehen. Und wenn wir dazu nicht imstande sind, wollen wir wenigstens das, was wir zu seinem Gedenken mitbringen, am Eingang niederlegen. Dann werden wir weinen und trauern, bis wir wieder nach Hause zurückkehren.«'
  revised_footnotes: []
  revision_rationale: 'Die Revision beseitigt zwei nicht vom Textzeugen gedeckte Präzisierungen und erhält die abgestufte Ausdrucksweise der Rede: zunächst »vielleicht«, anschließend »wenigstens«. Sie verbessert außerdem die Wiedergabe von »loved ones«. Eine unmittelbare Prüfung am griechischen Akhmim-Kodex bleibt aufgrund der angegebenen vorläufigen englischen Grundlage erforderlich.'
