base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: de
  text: '(21) Dann zogen sie die Nägel aus den Händen des Herrn und legten ihn auf die Erde. Und die ganze Erde erbebte, und große Furcht kam auf.


    (22) Dann schien die Sonne, und es stellte sich heraus, dass es die neunte Stunde war. (23) Die Juden freuten sich und übergaben Josef seinen Leichnam zur Bestattung, weil er all das Gute gesehen hatte, das er getan hatte.[a] (24) Josef nahm den Herrn, wusch ihn, wickelte ihn in Leinen und brachte ihn in sein eigenes Grab, das als »Josefs Garten« bekannt war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bezüge der Pronomen in diesem Satz sind in der vorliegenden Textgrundlage mehrdeutig: Es bleibt offen, wer gesehen hat und auf wen sich »er« jeweils bezieht. Eine Prüfung am griechischen Text steht noch aus.'
    reason: Die echte syntaktische und inhaltliche Mehrdeutigkeit soll sichtbar bleiben und nicht stillschweigend aufgelöst werden.
lexical_decisions:
- source_word: hands
  choice: Händen
  rationale: Bewahrt die konkrete Körperangabe der vorliegenden Zeugenübersetzung.
- source_word: earth
  choice: Erde
  rationale: Gibt die Wiederholung desselben Ausdrucks in Vers 21 wieder und lässt sowohl den Boden als auch die ganze Erde als Bezugsrahmen erkennen.
- source_word: ninth hour
  choice: neunte Stunde
  rationale: Bewahrt die antike Stundenangabe, statt sie interpretierend in eine moderne Uhrzeit umzuwandeln.
- source_word: linen
  choice: Leinen
  rationale: Eine natürliche und sachlich zurückhaltende Wiedergabe des Bestattungsmaterials.
- source_word: tomb
  choice: Grab
  rationale: Modernes, allgemein verständliches Deutsch ohne unnötige Festlegung auf eine bestimmte Grabform.
theological_decisions:
- issue: Mehrdeutige Pronomen in Vers 23
  choice: »seinen Leichnam … weil er all das Gute gesehen hatte, das er getan hatte«
  alternative: Die Bezüge ausdrücklich Josef, Jesus oder den Juden zuordnen
  rationale: Die vorliegende englische Textgrundlage lässt die Bezüge mehrdeutig. Die Übersetzung bewahrt diese Spannung, statt sie ohne griechische Quellenprüfung aufzulösen.
- issue: Bezeichnung Jesu nach seinem Tod
  choice: »der Herr«
  alternative: »Jesus« oder eine abschwächende Umschreibung
  rationale: Bewahrt die Titulierung der Textgrundlage und ihre theologische Perspektive.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend narrativer Satzführung. Der Entwurf beruht vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Textes des Akhmim-Kodex steht noch aus.
