review_pass:
  verdict: revise
  source_fidelity: Vers 21 unterscheidet im englischen Zeugen sinnvoll zwischen „ground“ und „earth“; „Boden“ und „Erde“ geben dies im Deutschen klarer wieder. In Vers 23 ist „seinen Leichnam“ problematisch, weil das Possessivum im Deutschen leicht auf Josef bezogen wird und damit den Sinn verfälschen kann. Die übrigen Pronominalbezüge in der Begründung bleiben, wie im Zeugen, bewusst offen.
  naturalness: Die Überarbeitung verwendet idiomatisches modernes Standarddeutsch. „Große Furcht erfasste alle“ ist natürlicher als die wörtliche, aber hölzerne Wendung „große Furcht kam auf“.
  terminology: „Herr“, „neunte Stunde“, „Leinen“ und „Grab“ sind angemessen und registergerecht. „Leichnam“ wahrt den sachlichen Bestattungskontext.
  issues:
  - severity: medium
    issue: „seinen Leichnam“ in Vers 23 kann im Deutschen Josefs eigenen Leichnam bezeichnen.
    rationale: Das deutsche Reflexivpossessivum bezieht sich regulär auf das Subjekt bzw. den naheliegenden männlichen Bezugsträger. Die Formulierung erzeugt daher eine missverständliche, im Ausgangszeugen nicht beabsichtigte Zuordnung.
  - severity: low
    issue: „auf die Erde“ verwischt den Unterschied zwischen „ground“ und dem nachfolgenden „earth“.
    rationale: „Auf den Boden“ bezeichnet hier die Ablagefläche und lässt „die ganze Erde“ als kosmisch-geographische Aussage deutlich hervortreten.
  - severity: low
    issue: „große Furcht kam auf“ ist weniger natürlich als nötig.
    rationale: Die Umformulierung bewahrt das Eintreten großer Furcht, ohne eine unidiomatische Konstruktion zu verwenden.
  revised_text: '(21) Dann zogen sie die Nägel aus den Händen des Herrn und legten ihn auf den Boden. Die ganze Erde erbebte, und große Furcht erfasste alle.


    (22) Dann schien die Sonne, und es stellte sich heraus, dass es die neunte Stunde war. (23) Die Juden freuten sich und übergaben Josef den Leichnam zur Bestattung, weil er all das Gute gesehen hatte, das er getan hatte.[a] (24) Josef nahm den Herrn, wusch ihn, wickelte ihn in Leinen und brachte ihn in sein eigenes Grab, das als »Josefs Garten« bekannt war.'
  revised_footnotes:
  - marker: a
    text: 'Die Bezüge der Pronomen in diesem Satz sind in der vorliegenden Textgrundlage mehrdeutig: Es bleibt offen, wer gesehen hat und auf wen sich »er« jeweils bezieht. Eine Prüfung am griechischen Text steht noch aus.'
    reason: Die syntaktische und inhaltliche Mehrdeutigkeit des vorliegenden englischen Zeugen wird nicht ohne direkte Prüfung des griechischen Textes aufgelöst.
  revision_rationale: Die Revision beseitigt die im Deutschen sinnwidrige oder zumindest stark irreführende mögliche Lesart, Josef werde sein eigener Leichnam übergeben. Zugleich bewahrt sie die im englischen Zeugen dokumentierte Mehrdeutigkeit der anschließenden Pronomen mit einer Fußnote. Weitere Änderungen verbessern die natürliche deutsche Ausdrucksweise und die Unterscheidung von Ablageboden und ganzer Erde, ohne den Inhalt zu verändern.
