review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem bereitgestellten englischen Textzeugen insgesamt eng. Zwei Nuancen sollten jedoch genauer wiedergegeben werden: Das unmittelbar bevorstehende Kreuzigen („were about to crucify“) ist stärker als bloßes Wollen, und „having sent to Herod“ besagt nicht ausdrücklich, dass Pilatus eine Botschaft sandte.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „schickte zu Herodes“ ist knapper und näher am offenen Ausdruck des Zeugen als „sandte eine Botschaft an Herodes“.
  terminology: „Leichnam“, „bestatten“, „Herr“, „Bruder Pilatus“ und „Getöteter“ sind angemessen. „Auch“ soll das im Zeugen vorhandene „also“ abbilden; „bereits“ würde dagegen eine zusätzliche zeitliche Nuance eintragen.
  issues:
  - severity: medium
    issue: „dass sie ihn kreuzigen wollten“ schwächt die unmittelbar bevorstehende Handlung ab.
    rationale: Der Textzeuge sagt „were about to crucify him“. „im Begriff waren, ihn zu kreuzigen“ bewahrt diese Nähe, ohne den Ablauf weiter auszudeuten.
  - severity: low
    issue: „Pilatus sandte eine Botschaft an Herodes“ legt die Art des Gesandten fest.
    rationale: „having sent to Herod“ lässt offen, ob ein Bote, eine Nachricht oder etwas anderes gesandt wurde. „schickte zu Herodes“ erhält diese Offenheit.
  - severity: low
    issue: „bereits“ gibt „also“ nicht präzise wieder.
    rationale: „Also“ bedeutet hier „auch“; „bereits“ ergänzt eine nicht ausdrücklich belegte zeitliche Folgerung.
  revised_text: '(3) Josef stand dort, ein Freund des Pilatus und des Herrn. Als er sah, dass sie im Begriff waren, ihn zu kreuzigen, ging er zu Pilatus und bat um den Leichnam des Herrn, um ihn zu bestatten. (4) Pilatus schickte zu Herodes und bat ihn um den Leichnam.


    (5) Herodes sagte: »Bruder Pilatus, selbst wenn niemand um ihn gebeten hätte, hätten wir ihn bestattet, denn auch der Sabbat beginnt. Im Gesetz steht nämlich geschrieben: ›Die Sonne soll nicht über einem Getöteten untergehen.‹«[a]'
  revised_footnotes:
  - marker: a
    text: Vgl. 5. Mose 21,22–23. Die Formulierung ist hier frei wiedergegeben. Der vorliegende Entwurf beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Kennzeichnet sowohl den Schriftbezug als auch die quellenbedingte Vorläufigkeit, da keine direkte griechische Prüfung vorliegt.
  revision_rationale: 'Die Revision beschränkt sich auf sichere Anpassungen an den vorliegenden Textzeugen: die bevorstehende Kreuzigung, die nicht näher bestimmte Sendung zu Herodes und das additive „auch“ beim beginnenden Sabbat. Die auffälligen relationalen und rechtlich-theologischen Formulierungen bleiben ohne Harmonisierung erhalten. Da ein direkter griechischer Abgleich ausdrücklich noch aussteht, bleibt die Quellenvorläufigkeit in der Fußnote bestehen.'
