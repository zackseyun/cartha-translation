source:
  text: '(3) And Joseph stood there, the friend of Pilate and the Lord. And seeing that they were about to crucify him, he went to Pilate and asked for the body of the Lord for burial. (4) And Pilate, having sent to Herod, asked him for the body.


    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
