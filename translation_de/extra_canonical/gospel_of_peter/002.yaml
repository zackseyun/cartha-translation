    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: de
  text: '(3) Josef stand dort, ein Freund des Pilatus und des Herrn. Als er sah, dass sie ihn kreuzigen wollten, ging er zu Pilatus und bat um den Leichnam des Herrn, um ihn zu bestatten. (4) Pilatus sandte eine Botschaft an Herodes und bat ihn um den Leichnam.


    (5) Herodes sagte: »Bruder Pilatus, selbst wenn niemand um ihn gebeten hätte, hätten wir ihn bestattet, denn der Sabbat beginnt bereits. Im Gesetz steht nämlich geschrieben: ›Die Sonne soll nicht über einem Getöteten untergehen.‹«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. 5. Mose 21,22–23. Die Formulierung ist hier frei wiedergegeben. Der vorliegende Entwurf beruht auf dem angegebenen gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Kennzeichnet sowohl den Schriftbezug als auch die quellenbedingte Vorläufigkeit, da keine direkte griechische Prüfung vorliegt.
lexical_decisions:
- source_word: friend
  choice: Freund
  rationale: Gibt die im vorliegenden englischen Zeugen ausdrücklich bezeichnete persönliche Beziehung schlicht und ohne zusätzliche Deutung wieder.
- source_word: body
  choice: Leichnam
  rationale: Im Zusammenhang mit Kreuzigung und Bestattung ist im Deutschen »Leichnam« natürlicher und eindeutiger als das allgemeinere »Körper«.
- source_word: for burial / buried
  choice: um ihn zu bestatten / hätten wir ihn bestattet
  rationale: »Bestatten« wahrt den würdigen Ton und bildet den Zweck sowie die hypothetische Aussage idiomatisch ab.
- source_word: Sabbath is beginning
  choice: der Sabbat beginnt bereits
  rationale: Bewahrt den einsetzenden Sabbat als zeitliche Begründung; »bereits« gibt das im Zeugen enthaltene »also« wieder, ohne den Zeitpunkt genauer festzulegen.
- source_word: one who has been killed
  choice: einem Getöteten
  rationale: Hält die passive, allgemeine Form der angeführten Gesetzesaussage fest und vermeidet eine unnötige Festlegung auf Hinrichtung oder Mord.
theological_decisions:
- issue: Bezeichnung Josefs als Freund sowohl des Pilatus als auch des Herrn
  choice: »ein Freund des Pilatus und des Herrn«
  alternative: »mit Pilatus und dem Herrn befreundet«
  rationale: Die koordinierte Zuordnung bleibt erhalten und wird nicht zugunsten einer bloßen Bekanntschaft oder Anhängerschaft abgeschwächt.
- issue: Herodes nennt Pilatus »Bruder«
  choice: »Bruder Pilatus«
  alternative: »Mein Bruder Pilatus« oder eine sinngemäße Amtsanrede
  rationale: Die auffällige direkte Anrede wird ohne Harmonisierung oder politische beziehungsweise geistliche Ausdeutung bewahrt.
- issue: Gesetzeszitat und alttestamentlicher Bezug
  choice: Wiedergabe gemäß dem vorliegenden Textzeugen mit »Die Sonne soll nicht über einem Getöteten untergehen«
  alternative: Angleichung an den Wortlaut einer kanonischen Übersetzung von Deuteronomium 21,22–23
  rationale: Die eigenständige Formulierung des Petrusevangeliums soll nicht stillschweigend an eine andere Textgestalt harmonisiert werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die parataktische Struktur bleibt weitgehend erhalten, wird aber idiomatisch geglättet. Wegen der noch ausstehenden Prüfung des griechischen Akhmim-Textes ist die Fassung ausdrücklich als vorläufig zu behandeln.
