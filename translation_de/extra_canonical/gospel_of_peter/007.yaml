review_pass:
  verdict: revise
  source_fidelity: Die Übertragung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt die Erzählperspektive, die Anschuldigung hinsichtlich des Tempelbrands sowie die offene Zuordnung von „Gericht“ und Jerusalems Ende. „Unheil ... über sich selbst gebracht“ kann jedoch eher das über sie gekommene Verderben als ihr eigenes schuldhaftes Handeln bezeichnen. „Unrecht ... zugefügt“ gibt den vorliegenden Sinn von „wrong they had done to themselves“ genauer wieder.
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. Die Gliederung der längeren Vorlage ist natürlich. „Bei alledem“ ist für „On top of all this“ idiomatischer als „Zu all dem“.
  terminology: „Älteste“, „Priester“, „Gericht“, „Sabbat“ und „Tempel“ sind angemessen. „Übeltäter“ und die Formulierung des Vorwurfs, den Tempel in Brand setzen zu wollen, bewahren den Charakter einer Anschuldigung. Die kollektive Bezeichnung „die Juden“ wird quellengetreu beibehalten, ohne sie interpretierend einzuengen.
  issues:
  - severity: medium
    issue: „Unheil ... über sich selbst gebracht“
    rationale: Diese Wendung kann das ihnen widerfahrende Unheil in den Vordergrund rücken. Die Vorlage sagt, dass sie erkannten, wie viel Unrecht sie sich selbst angetan hatten; dies sollte als eigenes schuldhaftes Handeln erkennbar bleiben.
  - severity: low
    issue: „Zu all dem“
    rationale: Die Formulierung ist verständlich, aber „Bei alledem“ entspricht der additiven, zusammenfassenden Funktion von „On top of all this“ natürlicher.
  revised_text: 'Da begannen die Juden, die Ältesten und die Priester zu trauern, denn sie erkannten, wie viel Unrecht sie sich selbst zugefügt hatten. Sie sagten: „Wehe über unsere Sünden! Das Gericht und das Ende Jerusalems sind nahe!“


    Ich aber und meine Gefährten waren von Kummer erfüllt und innerlich verwundet. Wir hielten uns verborgen, weil sie nach uns suchten: Sie hielten uns für Übeltäter und warfen uns vor, den Tempel in Brand setzen zu wollen. Bei alledem fasteten wir; wir saßen da, trauerten und weinten Tag und Nacht bis zum Sabbat.[a]'
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach der angegebenen gemeinfreien englischen Textfassung des Akhmim-Kodex; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die bereitgestellte Quellengrundlage ist ausdrücklich ein englischer Übersetzungszeuge, während die Prüfung der antiken Ausgangssprache noch aussteht.
  revision_rationale: Die Revision präzisiert ausschließlich die Wiedergabe des selbstverursachten „wrong“ als „Unrecht“, damit nicht eine Verschiebung zu bloßem erlittenem Unheil entsteht. Außerdem wird die einleitende Zusammenfassung der folgenden Handlungen idiomatischer formuliert. Aussagegehalt, Ambiguitäten und der vorläufige Status der Quellengrundlage bleiben erhalten.
