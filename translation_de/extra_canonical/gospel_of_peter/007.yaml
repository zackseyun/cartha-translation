base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: de
  text: 'Da begannen die Juden, die Ältesten und die Priester zu trauern, denn sie erkannten, wie viel Unheil sie über sich selbst gebracht hatten. Sie sagten: „Wehe über unsere Sünden! Das Gericht und das Ende Jerusalems sind nahe!“


    Ich aber und meine Gefährten waren von Kummer erfüllt und innerlich verwundet. Wir hielten uns verborgen, weil sie nach uns suchten: Sie hielten uns für Übeltäter und warfen uns vor, den Tempel in Brand setzen zu wollen. Zu all dem fasteten wir; wir saßen da, trauerten und weinten Tag und Nacht bis zum Sabbat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach der angegebenen gemeinfreien englischen Textfassung des Akhmim-Kodex; eine unmittelbare Prüfung des griechischen Wortlauts steht noch aus.
    reason: Die bereitgestellte Quellengrundlage ist ausdrücklich ein englischer Übersetzungszeuge, während die Prüfung der antiken Ausgangssprache noch aussteht.
lexical_decisions:
- source_word: how much wrong they had done to themselves
  choice: wie viel Unheil sie über sich selbst gebracht hatten
  rationale: Gibt die selbstverschuldete Schädigung idiomatisch und ohne unnötige moralische Präzisierung wieder; die genaue griechische Formulierung ist noch nicht geprüft.
- source_word: judgment
  choice: Gericht
  rationale: Bewahrt den eschatologischen und rechtlichen Bedeutungsraum des Ausdrucks.
- source_word: being wounded in mind
  choice: innerlich verwundet
  rationale: Erhält das Bild der Verwundung und formuliert zugleich natürliches modernes Deutsch.
- source_word: wrongdoers
  choice: Übeltäter
  rationale: Dignified, allgemein verständliche Bezeichnung für Menschen, denen schuldhaftes Handeln vorgeworfen wird.
- source_word: wanting to burn the temple
  choice: den Tempel in Brand setzen zu wollen
  rationale: Bewahrt den Vorwurfscharakter und vermeidet die mögliche Fehlbedeutung, der Brand sei bereits gelegt worden.
- source_word: until the Sabbath
  choice: bis zum Sabbat
  rationale: Entspricht dem zeitlichen Abschluss der überlieferten englischen Fassung, ohne den Sabbat ausdrücklich ein- oder auszuschließen.
theological_decisions:
- issue: Kollektive Bezeichnung „die Juden“
  choice: die Juden
  alternative: die jüdischen Verantwortlichen / die Judäer
  rationale: Die überlieferte englische Vorlage nennt zunächst „the Jews“ und danach gesondert Älteste und Priester. Mangels direkter griechischer Prüfung wird diese schwierige kollektive Formulierung nicht stillschweigend eingeengt.
- issue: „Gericht und Ende Jerusalems“
  choice: Das Gericht und das Ende Jerusalems sind nahe
  alternative: Das Gericht über Jerusalem und sein Ende sind nahe
  rationale: 'Die syntaktische Beziehung bleibt bewusst offen: Die Vorlage kann Gericht und Ende als zwei nahe Ereignisse nennen, ohne das Gericht grammatisch ausdrücklich auf Jerusalem zu beziehen.'
- issue: Absicht oder Anschuldigung bezüglich des Tempelbrands
  choice: warfen uns vor, den Tempel in Brand setzen zu wollen
  alternative: suchten uns als Übeltäter und als solche, die den Tempel verbrennen wollten
  rationale: Macht verständlich, dass es sich im Erzählzusammenhang um die Sicht der Verfolger handelt, ohne die Anschuldigung als Tatsache zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Die längeren englischen Satzgefüge wurden behutsam gegliedert. Die polemisch belastete kollektive Bezeichnung wurde aufgrund der vorläufigen Quellenlage beibehalten und nicht interpretierend umgeschrieben.
