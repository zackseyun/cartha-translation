    issue: Direkte Prüfung der griechischen Vorlage steht noch aus.
    rationale: Die Beurteilung der Quelltreue kann derzeit nur den gelieferten englischen öffentlichen Textzeugen und dessen dokumentierte Auffälligkeit in V. 32 zugrunde legen. Der Entwurf behauptet keine weitergehende griechische Sicherheit.
