    (29) The elders were afraid, and went to Pilate, begging him and saying, (30) "Give us soldiers, that we may guard his grave for three days, lest his disciples come and steal him, and the people think that he rose from the dead, and do us wrong."


    (31) And Pilate gave them Petronius the centurion, with soldiers to guard the tomb. And elders and scribes went with them to the grave. (32) And having rolled a great stone to the centurion and the soldiers, all who were there placed it at the door of the grave. (33) And they put seven seals on it, and having pitched a tent there, they kept watch.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: de
  text: '(28) Die Schriftgelehrten, die Pharisäer und die Ältesten kamen zusammen. Sie hatten gehört, wie das ganze Volk murrte, sich an die Brust schlug und sagte: »Wenn bei seinem Tod diese gewaltigen Zeichen geschehen sind, dann seht, wie gerecht er war!«


    (29) Da bekamen die Ältesten Angst. Sie gingen zu Pilatus, baten ihn inständig und sagten: (30) »Gib uns Soldaten, damit wir sein Grab drei Tage lang bewachen können. Sonst könnten seine Jünger kommen und ihn stehlen; dann könnte das Volk glauben, er sei von den Toten auferstanden, und uns Unrecht antun.«


    (31) Pilatus übergab ihnen den Hauptmann Petronius und Soldaten, die das Grab bewachen sollten. Auch Älteste und Schriftgelehrte gingen mit ihnen zum Grab. (32) Sie rollten einen großen Stein zu dem Hauptmann und den Soldaten hin; dann setzten ihn alle Anwesenden vor den Eingang des Grabes.[a] (33) Sie versahen ihn mit sieben Siegeln, schlugen dort ein Zelt auf und hielten Wache.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Wortlaut dieses Satzes ist ungewöhnlich: Der Stein wird zunächst »zu dem Hauptmann und den Soldaten« gerollt und anschließend von allen Anwesenden vor den Grabeingang gesetzt. Die Übersetzung bewahrt diese Abfolge.'
    reason: Die syntaktische Auffälligkeit des zugrunde liegenden öffentlichen englischen Textzeugen soll sichtbar bleiben; eine Prüfung am griechischen Text steht noch aus.
lexical_decisions:
- source_word: grumbling
  choice: murrte
  rationale: Gibt die missbilligende, unruhige Reaktion des Volkes knapp und in bibelnaher, aber weiterhin geläufiger Sprache wieder.
- source_word: beating their chests
  choice: sich an die Brust schlug
  rationale: Bewahrt die konkrete Trauer- oder Reuegeste, ohne ihre genaue emotionale Bedeutung festzulegen.
- source_word: just
  choice: gerecht
  rationale: Bewahrt die moralische und möglicherweise forensisch-theologische Weite des Ausdrucks besser als »unschuldig«.
- source_word: centurion
  choice: Hauptmann
  rationale: Ist für ein allgemeines modernes Publikum verständlicher als »Zenturio« und bezeichnet den römischen Offiziersrang hinreichend genau.
- source_word: rose from the dead
  choice: von den Toten auferstanden
  rationale: Entspricht dem traditionellen, weiterhin verständlichen Auferstehungsvokabular und bewahrt die Aussageform des Zeugnisses.
- source_word: do us wrong
  choice: uns Unrecht antun
  rationale: Hält die offene Bedeutung der drohenden Schädigung fest, statt eine bestimmte Form von Vergeltung oder Gewalt einzutragen.
- source_word: seven seals
  choice: sieben Siegeln
  rationale: Erhält sowohl die konkrete Sicherungsmaßnahme als auch die ausdrücklich genannte Zahl.
theological_decisions:
- issue: Die Aussage über Jesu Gerechtigkeit
  choice: »wie gerecht er war«
  alternative: »wie unschuldig er war«
  rationale: »Gerecht« bewahrt die größere semantische und theologische Spannung; »unschuldig« würde die Aussage auf ein forensisches Urteil verengen.
- issue: Die erwartete Auferstehungsbehauptung
  choice: »das Volk glauben, er sei von den Toten auferstanden«
  alternative: »das Volk meinen, er wäre auferstanden«
  rationale: Der Konjunktiv kennzeichnet die Aussage als befürchtete Überzeugung des Volkes, ohne dass die Übersetzung selbst über ihren Wahrheitsgehalt entscheidet.
- issue: Die befürchtete Schädigung der führenden Männer
  choice: »uns Unrecht antun«
  alternative: »uns Böses antun«
  rationale: Die gewählte Formulierung bewahrt die rechtlich-moralische Offenheit und legt weder Aufruhr noch körperliche Gewalt fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit klaren Sätzen und moderat bibelnaher Wortwahl. Die Verszählung bleibt erhalten. Der Entwurf beruht wegen der noch ausstehenden direkten Prüfung des Griechischen vorläufig auf dem angegebenen gemeinfreien englischen Textzeugen; besonders Vers 32 darf daher nicht stillschweigend geglättet werden.
