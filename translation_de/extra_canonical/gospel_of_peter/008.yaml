review_pass:
  verdict: approve
  source_fidelity: Im Rahmen des bereitgestellten öffentlichen englischen Textzeugen ist die Übersetzung quellentreu. Sie bewahrt insbesondere die Reaktion des Volkes, die befürchtete Auferstehungsbehauptung, die offene Wendung »uns Unrecht antun« sowie die auffällige Abfolge in V. 32. Eine unmittelbare Prüfung am griechischen Akhmim-Text bleibt nach den Kontextangaben noch aus.
  naturalness: Die Formulierungen sind modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Satzteilung und Konjunktivgebrauch verbessern die Lesbarkeit, ohne Aussagen hinzuzufügen. »zu dem Hauptmann und den Soldaten hin« ist absichtlich sperrig, aber durch die Fußnote sachgerecht als überlieferungsbedingte Auffälligkeit kenntlich gemacht.
  terminology: »Schriftgelehrte«, »Pharisäer«, »Älteste«, »Hauptmann«, »Grab«, »Siegel« und »von den Toten auferstanden« sind konsistent, verständlich und registergerecht. »gerecht« bewahrt gegenüber einer einengenden Wiedergabe wie »unschuldig« die weitere Aussage des Textzeugen.
