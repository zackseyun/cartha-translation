  to: '(38) Als die Soldaten das sahen, weckten sie den Hauptmann und die Ältesten, denn auch sie waren dort und hielten Wache. (39) Während die Soldaten ihnen berichteten, was sie gesehen hatten, sahen sie erneut drei Männer aus dem Grab herauskommen. Zwei von ihnen führten den Dritten an der Hand, und ein Kreuz folgte ihnen. (40) Die Köpfe der beiden reichten bis zum Himmel, doch der Kopf dessen, den sie führten, reichte über die Himmel hinaus.


    (41) Da hörten sie eine Stimme aus den Himmeln sagen: »Hast du denen verkündet, die schlafen?«


    (42) Vom Kreuz her war die Antwort zu hören: »Ja!«'
  rationale: Die einzige notwendige Änderung betrifft V. 39 und stellt die konkrete Bedeutung des griechischen Verbs für das Führen an der Hand wieder her. Alle weiteren Formulierungen bleiben erhalten, da sie die Überlieferung einschließlich ihrer erzählerischen und theologischen Mehrdeutigkeiten angemessen wiedergeben.
