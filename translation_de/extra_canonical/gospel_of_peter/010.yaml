base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: de
  text: '(38) Als die Soldaten das sahen, weckten sie den Hauptmann und die Ältesten, denn auch sie waren dort und hielten Wache. (39) Während die Soldaten ihnen berichteten, was sie gesehen hatten, sahen sie erneut drei Männer aus dem Grab herauskommen. Zwei von ihnen führten den Dritten an der Hand, und ein Kreuz folgte ihnen. (40) Die Köpfe der beiden reichten bis zum Himmel, doch der Kopf dessen, den sie führten, reichte über die Himmel hinaus.


    (41) Da hörten sie eine Stimme aus den Himmeln sagen: »Hast du denen verkündet, die schlafen?«


    (42) Vom Kreuz her war die Antwort zu hören: »Ja!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: centurion
  choice: Hauptmann
  rationale: Die im Deutschen biblisch geläufige und allgemein verständliche Bezeichnung gibt den römischen militärischen Rang angemessen wieder.
- source_word: supporting
  choice: stützten
  rationale: Bewahrt den konkreten Vorgang, ohne genauer festzulegen, weshalb die dritte Gestalt gestützt wird.
- source_word: those who sleep
  choice: die schlafen
  rationale: Erhält die bildhafte und möglicherweise auf die Toten bezogene Ausdrucksweise, ohne sie auslegend aufzulösen.
- source_word: proclaimed
  choice: verkündet
  rationale: Gibt die religiös gewichtige Bedeutung wieder, ohne einen im vorliegenden Zeugen nicht ausdrücklich genannten Inhalt der Verkündigung zu ergänzen.
- source_word: heaven / the heavens
  choice: Himmel / die Himmel
  rationale: Bewahrt den auffälligen Wechsel zwischen Singular und Plural im überlieferten englischen Zeugen.
theological_decisions:
- issue: Identität der drei Männer
  choice: Die Gestalten bleiben unbenannt.
  alternative: Den dritten ausdrücklich als Jesus und die beiden anderen als Engel bezeichnen.
  rationale: Der vorliegende Text benennt sie nicht; eine Identifizierung würde die erzählerische Mehrdeutigkeit auslegend festlegen.
- issue: Adressat der himmlischen Frage
  choice: 'Die Anrede bleibt im Singular: »Hast du …?«'
  alternative: Den Adressaten ausdrücklich als den aus dem Grab Geführten oder als das Kreuz benennen.
  rationale: Der Sprecher nennt den Adressaten nicht ausdrücklich; der Singular wird bewahrt, ohne den Bezug zu entscheiden.
- issue: Antwort des Kreuzes
  choice: Das Kreuz bleibt ausdrücklich Ursprung der hörbaren Antwort.
  alternative: Die Antwort als Stimme einer Person bei dem Kreuz deuten.
  rationale: Die ungewöhnliche Darstellung gehört zur theologischen und literarischen Eigenart des Textes und darf nicht normalisiert werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Erzählführung. Da die direkte Prüfung des griechischen Textes noch aussteht, ist die Fassung ausdrücklich auf Grundlage des angegebenen gemeinfreien englischen Textzeugen erstellt. Der Wechsel von »Himmel« zu »Himmeln« und die personhaft wirkende Antwort des Kreuzes wurden bewusst erhalten.
