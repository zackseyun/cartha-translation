review_pass:
  verdict: revise
  source_fidelity: 'Die Erzählabfolge, die unbenannten drei Männer, die kosmische Größensteigerung, der Singular der himmlischen Anrede und die vom Kreuz ausgehende Antwort sind zutreffend bewahrt. In V. 39 ist für das zugrunde liegende griechische χειραγωγέω jedoch eine Präzisierung nötig: Die beiden stützen den Dritten nicht nur allgemein, sondern führen ihn an der Hand.'
  naturalness: Die Fassung ist insgesamt klares, modernes und würdiges Standarddeutsch. »an der Hand führten« ist idiomatisch und macht die konkrete Bewegung verständlich, ohne einen Grund für das Geführtwerden zu unterstellen.
  terminology: »Hauptmann«, »Älteste«, »verkündet«, »die schlafen« sowie der Wechsel zwischen »Himmel« und »Himmeln« sind tragfähig. Die unbenannten Gestalten und die ungewöhnliche Rede des Kreuzes werden nicht auslegend normalisiert.
  issues:
  - severity: medium
    issue: 'V. 39: »Zwei von ihnen stützten den dritten«'
    rationale: Das griechische Verb bezeichnet das Führen bzw. Leiten an der Hand. »stützten« kann körperliches Abstützen aufgrund von Schwäche nahelegen und ist daher zu unbestimmt beziehungsweise potenziell irreführend.
