  naturalness: Modernes Standarddeutsch und der würdige Erzählton sind überwiegend gelungen. In V. 45 ist »die Männer beim Hauptmann dies sahen« jedoch syntaktisch holprig. Die Umstellung zu »Als die Männer beim Hauptmann das sahen« ist natürlicher, ohne den unbestimmten Gruppenbezug des Zeugen näher festzulegen.
  terminology: »Hauptmann«, »Grab«, »unschuldig am Blut« und »Gottes Sohn« sind im gewählten Register treffend. »Das jüdische Volk« gibt die Figurenrede des Zeugen wieder; die erläuternde Fußnote stellt zu Recht klar, dass dies kein Urteil der Übersetzung ist.
