base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: de
  text: '(43) Da beschlossen jene Männer gemeinsam, zu Pilatus zu gehen und ihm davon zu berichten. (44) Während sie noch darüber berieten, sah man erneut, wie sich die Himmel öffneten. Ein Mann stieg herab und ging in das Grab hinein. (45) Als die Männer beim Hauptmann dies sahen, verließen sie das Grab, das sie bewacht hatten, und eilten noch in der Nacht zu Pilatus. Tief bestürzt berichteten sie alles, was sie gesehen hatten, und sagten: »Wahrhaftig, er war Gottes Sohn!«


    (46) Pilatus erwiderte: »Ich bin unschuldig am Blut des Sohnes Gottes; das ist uns klar.«[a]


    (47) Da baten ihn alle, die gekommen waren, inständig, dem Hauptmann und den Soldaten zu befehlen, nichts von dem zu erzählen, was sie gesehen hatten. (48) Sie sagten: »Es ist besser für uns, uns vor Gott einer großen Sünde schuldig zu machen, als dem jüdischen Volk in die Hände zu fallen und gesteinigt zu werden.«[b] (49) Darauf befahl Pilatus dem Hauptmann und den Soldaten, nichts zu sagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung folgt dem überlieferten Zeugnis. Wer mit »uns« gemeint ist, bleibt offen.
    reason: Bewahrt die genuine Unbestimmtheit des Personalpronomens.
  - marker: b
    text: Diese Worte geben die Befürchtung der im Bericht auftretenden Sprecher wieder; sie sind kein allgemeines Urteil über das jüdische Volk.
    reason: Verhindert, dass die Figurenrede als pauschale Aussage der Übersetzung missverstanden wird.
lexical_decisions:
- source_word: the heavens
  choice: die Himmel
  rationale: Der Plural des zugrunde liegenden Zeugnisses bleibt erhalten und wahrt die antike kosmologische Ausdrucksweise.
- source_word: a certain man
  choice: ein Mann
  rationale: Natürliches modernes Deutsch; der unbestimmte Bezug wird bewahrt, ohne die Gestalt näher zu identifizieren.
- source_word: grave / tomb
  choice: Grab
  rationale: Im Deutschen ist »Grab« in diesem Zusammenhang idiomatisch und vermeidet einen unbelegten architektonischen Zusatz.
- source_word: centurion
  choice: Hauptmann
  rationale: Traditionelle, allgemein verständliche Bezeichnung für den römischen centurio im biblischen Register.
- source_word: clean of the blood
  choice: unschuldig am Blut
  rationale: Gibt das semitisch-biblische Verantwortungsmotiv verständlich wieder, ohne die Aussage theologisch auszudeuten.
- source_word: the Jewish people
  choice: das jüdische Volk
  rationale: Entspricht dem vorliegenden Zeugnis und macht deutlich, dass hier die Figuren ihre eigene Befürchtung äußern.
theological_decisions:
- issue: Bekenntnis zur Sohnschaft
  choice: »Wahrhaftig, er war Gottes Sohn!«
  alternative: »Wahrhaftig, er ist der Sohn Gottes!«
  rationale: Die Vergangenheitsform des vorliegenden Zeugnisses wird bewahrt; eine Angleichung an kanonische Parallelformulierungen wird vermieden.
- issue: Pilatus’ Unschuldserklärung
  choice: »Ich bin unschuldig am Blut des Sohnes Gottes«
  alternative: »Ich bin rein vom Blut des Sohnes Gottes«
  rationale: Die idiomatische Bedeutung wird verständlich wiedergegeben, ohne die im Text behauptete Entlastung des Pilatus zu bestätigen oder zu bestreiten.
- issue: Unklarer Bezug von »uns«
  choice: »das ist uns klar«
  alternative: »das ist euch klar« / »das ist allen klar«
  rationale: Der inklusive oder gruppenbezogene Plural bleibt entsprechend dem vorliegenden Zeugnis unaufgelöst.
- issue: Negative Aussage über das jüdische Volk
  choice: Als direkte Rede der berichtenden Figuren belassen
  alternative: Verallgemeinernd in die Erzählerstimme übernehmen
  rationale: Die problematische Behauptung wird klar als Angst beziehungsweise Behauptung der Figuren markiert und nicht als allgemeines Urteil des Übersetzers ausgegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Die Verszählung bleibt erhalten. Da eine direkte Prüfung des griechischen Textes ausdrücklich noch aussteht, ist der Entwurf quellenkritisch vorläufig und folgt eng dem bereitgestellten gemeinfreien englischen Zeugen; mögliche griechische Mehrdeutigkeiten dürfen bei der späteren Quellenprüfung zu Revisionen führen.
