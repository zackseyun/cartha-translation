source:
  text: '(43) Then those men decided to go with each other and report these things to Pilate. (44) And while they were still considering, again the heavens were seen being opened, and a certain man descended and went into the grave. (45) Having seen these things, those with the centurion hurried by night to Pilate, having left the tomb they were watching, and described all that they saw, being greatly distressed, and saying, "Truly he was the Son of God!"


    (46) In response Pilate said, "I''m clean of the blood of the Son of God, and this is clear to us."


    (47) Then all who came were begging him, and encouraging him to command the centurion and the soldiers to say nothing about what they saw. (48) "It''s better for us," they said, "to be guilty of a great sin in front of God than to fall into the hands of the Jewish people and be stoned." (49) So Pilate commanded the centurion and the soldiers to say nothing.'
