    (19) And the Lord cried out, saying, "My Power, the Power, you''ve left me!" And when he said this, it was taken up. (20) And that very hour, the veil of the temple in Jerusalem was torn in two.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: de
  text: '(15) Es war Mittag, und Finsternis lag über ganz Judäa. Sie waren beunruhigt und bedrückt, der Gedanke, die Sonne könnte untergehen, während er noch lebte. Denn für sie steht geschrieben: »Die Sonne soll nicht über einem Getöteten untergehen.«[a] (16) Einer von ihnen sagte: »Gebt ihm Galle mit saurem Wein zu trinken.« Sie mischten beides und gaben es ihm zu trinken. (17) So erfüllten sie alles und häuften die Sünden auf ihr eigenes Haupt. (18) Viele gingen mit Lampen umher, weil sie meinten, es sei Nacht; und einige stürzten zu Boden.


    (19) Der Herr schrie auf und sagte: »Meine Kraft, du Kraft, du hast mich verlassen!«[b] Als er dies gesagt hatte, wurde sie emporgehoben.[c] (20) In eben jener Stunde riss der Vorhang des Tempels in Jerusalem entzwei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Schriftstelle ist unklar. Der Satz erinnert an das Gebot, den Leichnam eines Hingerichteten noch am selben Tag zu bestatten (vgl. 5. Mose 21,22–23), formuliert es hier jedoch mit dem Untergang der Sonne.
    reason: Kennzeichnet eine nicht wörtlich zuzuordnende Schriftanführung und bewahrt deren Eigenart.
  - marker: b
    text: 'Wörtlich beziehungsweise sehr nah am überlieferten Ausdruck: »Meine Kraft, die Kraft«. Die ungewöhnliche Formulierung wurde nicht an »Mein Gott, mein Gott« angeglichen.'
    reason: Bewahrt eine theologisch bedeutsame, vom kanonischen Wortlaut abweichende Lesart.
  - marker: c
    text: Der Bezug ist unsicher. Gemeint sein könnte, dass die »Kraft« emporgehoben wurde; der Ausdruck kann aber auch anders verstanden werden. Der Text erklärt dies nicht.
    reason: Macht die echte syntaktische und theologische Mehrdeutigkeit sichtbar, ohne sie endgültig aufzulösen.
lexical_decisions:
- source_word: darkness held fast over all Judea
  choice: Finsternis lag über ganz Judäa
  rationale: Natürliches, würdevolles Deutsch, das die umfassende Dunkelheit wiedergibt, ohne die englische Zwischenformulierung mechanisch nachzubilden.
- source_word: bile with sour wine
  choice: Galle mit saurem Wein
  rationale: Bewahrt beide Bestandteile des überlieferten Wortlauts; »saurer Wein« ist allgemein verständlicher als das enger deutende »Essig«.
- source_word: accumulated the sins on their head
  choice: häuften die Sünden auf ihr eigenes Haupt
  rationale: Erhält das bildhafte Schuldmotiv und den Singular »Haupt« in einer im Deutschen verständlichen biblischen Ausdrucksweise.
- source_word: lanterns
  choice: Lampen
  rationale: Ein sachlich weiter Ausdruck für tragbare antike Lichtquellen; vermeidet die moderne Vorstellung geschlossener Laternen.
- source_word: Power
  choice: Kraft
  rationale: Gibt die ungewöhnliche Anrede möglichst unmittelbar wieder und ersetzt sie nicht harmonisierend durch »Gott«.
- source_word: veil of the temple
  choice: Vorhang des Tempels
  rationale: »Vorhang« ist modernes, verständliches Deutsch und lässt offen, welcher Tempelvorhang gemeint ist.
theological_decisions:
- issue: Die ungewöhnliche Anrede »My Power, the Power«
  choice: »Meine Kraft, du Kraft«
  alternative: »Meine Macht, o Macht« oder harmonisierend »Mein Gott, mein Gott«
  rationale: Die eigenständige Lesart des Petrusevangeliums wird bewahrt. »Kraft« gibt den Ausdruck wieder, ohne ihn an die kanonische Kreuzeswortform anzugleichen.
- issue: Unbestimmtes Subjekt bei »it was taken up«
  choice: »wurde sie emporgehoben« mit Rückbezug auf »Kraft«
  alternative: »wurde er aufgenommen« mit Bezug auf den Herrn oder unpersönlich »es wurde emporgehoben«
  rationale: Das grammatische Femininum von »Kraft« ermöglicht im Deutschen einen erkennbaren, aber nicht dogmatisch ausgedeuteten Rückbezug. Eine Fußnote hält die textliche Unsicherheit ausdrücklich offen.
- issue: Aussage über das Erfüllen aller Dinge und das Anwachsen der Sünden
  choice: nah am überlieferten Wortlaut belassen
  alternative: explizite Benennung einer bestimmten Gruppe oder heilsgeschichtliche Deutung
  rationale: Der Text benennt im vorliegenden Ausschnitt die Handelnden nur pronominal. Die Übersetzung importiert weder eine zusätzliche Gruppenbestimmung noch eine konfessionelle Deutung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut lesbarem Erzählton. Wiederholungen und ungewöhnliche Aussagen wurden dort erhalten, wo sie für die Eigenart des Textes wesentlich sind. Da eine direkte Prüfung des griechischen Akhmim-Textes noch aussteht, bleibt der Entwurf ausdrücklich auf den angegebenen gemeinfreien englischen Zeugen gestützt; strittige Stellen werden deshalb vorsichtig und mit Fußnoten wiedergegeben.
