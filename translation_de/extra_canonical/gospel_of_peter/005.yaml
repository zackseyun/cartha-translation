review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng. In V. 19 legt jedoch „wurde sie emporgehoben“ durch das grammatische Femininum zwingend einen Rückbezug auf „Kraft“ fest, während der Zeuge mit „it was taken up“ bewusst unbestimmt bleibt. Die Revision bewahrt diese Unbestimmtheit. Auch die kausale Einleitung „So“ in V. 17 wird entfernt, da sie im Zeugen nicht ausgedrückt ist.
  naturalness: Der Satz in V. 15 („Sie waren beunruhigt und bedrückt, der Gedanke ...“) ist im modernen Standarddeutsch syntaktisch nicht vollständig. Er wird idiomatisch und ohne Bedeutungsverschiebung formuliert. „Fielen hin“ gibt V. 18 neutraler wieder als das stärker akzentuierende „stürzten zu Boden“.
  terminology: „Finsternis“, „Judäa“, „Galle“, „saurer Wein“, „Kraft“ und „Vorhang des Tempels“ sind angemessen. Die auffällige Anrede wird nicht an kanonische Fassungen angeglichen. Die Fußnoten werden an die revidierte, bewusst unbestimmte Formulierung in V. 19 angepasst.
  issues:
  - severity: medium
    issue: Syntaktischer Bruch in V. 15
    rationale: „Sie waren beunruhigt und bedrückt, der Gedanke ...“ enthält keine tragfähige Verknüpfung. Die Sorge vor Sonnenuntergang bei noch lebendem Gekreuzigten muss als Grund bzw. Befürchtung ausgedrückt werden.
  - severity: high
    issue: V. 19 bestimmt den Bezug von „it was taken up“ zu stark
    rationale: „wurde sie emporgehoben“ legt die „Kraft“ als Subjekt fest. Der englische Zeuge hält das Bezugswort ausdrücklich offen; die deutsche Fassung darf diese Mehrdeutigkeit nicht grammatisch auflösen.
  - severity: low
    issue: „So“ in V. 17 fügt eine Schlussfolgerung hinzu
    rationale: Der Zeuge beginnt schlicht mit „And“. Die Ergänzung kann einen über den Text hinausgehenden Folgezusammenhang nahelegen.
  - severity: low
    issue: „stürzten zu Boden“ ist stärker als „fell down“
    rationale: „Fielen hin“ gibt den neutralen Vorgang des Zeugen unmittelbarer wieder.
  revised_text: '(15) Es war Mittag, und Finsternis lag über ganz Judäa. Sie waren beunruhigt und bedrückt, weil die Sonne untergehen könnte, während er noch lebte. Denn ihnen steht geschrieben: »Die Sonne soll nicht über einem Getöteten untergehen.«[a] (16) Einer von ihnen sagte: »Gebt ihm Galle mit saurem Wein zu trinken.« Sie mischten es und gaben es ihm zu trinken. (17) Sie erfüllten alles und häuften die Sünden auf ihre eigenen Häupter. (18) Viele gingen mit Lampen umher, weil sie meinten, es sei Nacht, und einige fielen hin.


    (19) Der Herr schrie auf und sagte: »Meine Kraft, die Kraft, du hast mich verlassen!«[b] Als er dies gesagt hatte, wurde es emporgehoben.[c] (20) In eben jener Stunde riss der Vorhang des Tempels in Jerusalem entzwei.'
  revised_footnotes:
  - marker: a
    text: Die genaue Schriftstelle ist unklar. Der Satz erinnert an das Gebot, den Leichnam eines Hingerichteten noch am selben Tag zu bestatten (vgl. 5. Mose 21,22–23), formuliert es hier jedoch mit dem Untergang der Sonne.
    reason: Kennzeichnet eine nicht eindeutig zuzuordnende Schriftanführung und bewahrt deren besondere Formulierung.
  - marker: b
    text: 'Wörtlich beziehungsweise sehr nah am überlieferten Ausdruck: »Meine Kraft, die Kraft«. Die ungewöhnliche Formulierung wurde nicht an »Mein Gott, mein Gott« angeglichen.'
    reason: Bewahrt eine theologisch bedeutsame, vom kanonischen Wortlaut abweichende Lesart.
  - marker: c
    text: Der Bezug von »es« ist im überlieferten Text unklar. Es könnte sich auf die zuvor angeredete »Kraft« beziehen, der Ausdruck kann jedoch auch anders verstanden werden. Der Text erklärt dies nicht.
    reason: Bewahrt die syntaktische und theologische Mehrdeutigkeit, ohne sie durch das grammatische Geschlecht im Deutschen festzulegen.
  revision_rationale: Die Revision behebt den syntaktischen Mangel in V. 15 und wahrt in V. 19 die im bereitgestellten englischen Zeugen dokumentierte Mehrdeutigkeit. Weitere Änderungen reduzieren geringfügige interpretierende oder verstärkende Zusätze, ohne Register, Namen oder theologisch markierte Begriffe zu verändern.
