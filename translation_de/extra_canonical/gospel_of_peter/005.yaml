source:
  text: '(15) And it was mid-day, and darkness held fast over all Judea. And they were troubled and distressed lest the sun set, since he was still living. It''s written to them, "The sun shouldn''t set on one who''s been killed." (16) And one of them said, "Give him bile with sour wine to drink." And having mixed it, they gave it to him to drink. (17) And they fulfilled all things and accumulated the sins on their head. (18) And many were going around with lanterns, thinking it was night, and some fell down.


    (19) And the Lord cried out, saying, "My Power, the Power, you''ve left me!" And when he said this, it was taken up. (20) And that very hour, the veil of the temple in Jerusalem was torn in two.'
