review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt insbesondere die knappe rhetorische Frage, die Verbindung von Auferstehung und Weggehen sowie die unbestimmte Herkunftsangabe. In V. 55 wird jedoch die reflexive, resultative Formulierung „having clothed himself“ durch „trug“ abgeschwächt. „hatte sich ... gekleidet“ bildet sie genauer ab. Die direkte Prüfung des griechischen Textes ist nach den Metadaten weiterhin ausstehend.
  naturalness: Die Sprache ist modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählregister. „Er war schön und hatte sich in ein langes, leuchtendes Gewand gekleidet“ ist natürlich und präziser als „von schöner Gestalt und trug ...“.
  terminology: „Grab“, „gekreuzigt“, „auferstanden“ und „leuchtendes Gewand“ sind sachgerecht. Die Formulierung „woher er gekommen war“ erhält die im Zeugen offene Herkunftsangabe und deutet sie nicht aus.
  issues:
  - severity: low
    issue: Die Wiedergabe von „having clothed himself“ als „trug“
    rationale: „Trug“ beschreibt nur den Zustand des Bekleidetseins. Der Zeuge bezeichnet zusätzlich die Handlung des Sich-Kleidens; diese lässt sich im Deutschen ohne Unnatürlichkeit als „hatte sich ... gekleidet“ erhalten.
