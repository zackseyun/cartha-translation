base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: de
  text: '(55) Sie gingen hin und fanden, dass das Grab geöffnet worden war. Als sie näher kamen, beugten sie sich hinunter und sahen dort einen jungen Mann mitten im Grab sitzen. Er war von schöner Gestalt und trug ein langes, leuchtendes Gewand. Er sagte zu ihnen: (56) »Warum seid ihr gekommen? Wen sucht ihr? Doch nicht den, der gekreuzigt wurde? Er ist auferstanden und fortgegangen. Wenn ihr es aber nicht glaubt, beugt euch hinunter und seht euch die Stelle an, an der er lag: Er ist nicht hier; denn er ist auferstanden und dorthin gegangen, woher er gekommen war.«


    (57) Da fürchteten sich die Frauen und flohen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese Übersetzung ist vorläufig und beruht auf dem angegebenen gemeinfreien englischen Übersetzungszeugnis des Akhmim-Codex (P.Cair. 10759). Eine unmittelbare Prüfung des griechischen Textes steht noch aus.
    reason: Die bereitgestellten Daten weisen ausdrücklich darauf hin, dass die Prüfung anhand der alten Ausgangssprache noch aussteht; diese Einschränkung ist für die textkritische Transparenz wesentlich.
lexical_decisions:
- source_word: tomb
  choice: Grab
  rationale: Im Deutschen ist »Grab« hier die natürliche und sachlich passende Bezeichnung für die begehbare Grabanlage.
- source_word: a certain young man
  choice: einen jungen Mann
  rationale: Das unbestimmte Element wird durch den unbestimmten Artikel wiedergegeben; »einen gewissen jungen Mann« klänge unnötig markiert.
- source_word: beautiful
  choice: von schöner Gestalt
  rationale: Bewahrt die Aussage über sein Erscheinungsbild in einem würdigen Register, ohne sie mit »herrlich« theologisch aufzuladen.
- source_word: shining robe
  choice: leuchtendes Gewand
  rationale: »Leuchtend« gibt den visuellen Eindruck wieder; »Gewand« passt zum antiken Kontext und bleibt allgemein verständlich.
- source_word: arose
  choice: ist auferstanden
  rationale: Im Auferstehungskontext ist dies die idiomatische deutsche Wiedergabe, während die Verbindung mit »fortgegangen« erhalten bleibt.
- source_word: where he came from
  choice: woher er gekommen war
  rationale: Die offene Herkunftsaussage bleibt bestehen und wird nicht als ausdrücklicher Verweis auf Himmel, Gott oder einen bestimmten Ort gedeutet.
theological_decisions:
- issue: Die Aussage »he arose and went away«
  choice: »Er ist auferstanden und fortgegangen«
  alternative: »Er stand auf und ging fort«
  rationale: Der unmittelbare Kontext behandelt den Gekreuzigten und das leere Grab; »auferstanden« bildet diesen Sinn im Deutschen klar ab, ohne das zusätzliche »fortgegangen« zu beseitigen.
- issue: Die Frage »Not that one who was crucified?«
  choice: »Doch nicht den, der gekreuzigt wurde?«
  alternative: »Sucht ihr nicht den Gekreuzigten?«
  rationale: Die fragmentarische, rhetorisch zugespitzte Form des Zeugnisses wird bewahrt, statt sie zu einer vollständig geglätteten Frage umzuformen.
- issue: Das Ziel »where he came from«
  choice: »dorthin gegangen, woher er gekommen war«
  alternative: »zu dem Ort gegangen, von dem er gekommen war«
  rationale: Die genuine Unbestimmtheit des Textes bleibt erhalten; eine Identifizierung des Zieles wird nicht ergänzt.
- issue: Der Grund der Furcht der Frauen
  choice: nicht näher erklärt
  alternative: Furcht aufgrund der Erscheinung oder Botschaft ausdrücklich benennen
  rationale: Das Zeugnis nennt keinen Grund. Eine Erklärung würde eine nicht belegte Deutung einführen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die kurzen Fragen und die ungewöhnliche Verbindung von Auferstehung und Fortgehen wurden nicht harmonisierend geglättet. Wegen der noch ausstehenden direkten Prüfung des griechischen Manuskripts ist der Entwurf ausdrücklich vorläufig.
