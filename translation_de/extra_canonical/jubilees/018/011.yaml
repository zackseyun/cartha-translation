  yaml_path: translation/extra_canonical/jubilees/018/011.yaml
  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: de
  text: 'Und ich sagte zu ihm: „Streck deine Hand nicht gegen den Jungen aus und tu ihm nichts! Denn nun weiß ich, dass du Gott fürchtest und mir deinen Sohn, deinen Erstgeborenen, nicht vorenthalten hast.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእቤሎ
  choice: Und ich sagte zu ihm
  rationale: Die Form ist 1. Person Singular mit angehängtem Objektpronomen („ich sagte zu ihm“), passend zur Erzählstimme des Engels der Gegenwart.
- source_word: ሕፃን
  choice: Jungen
  rationale: Bezeichnet hier Isaak als den jungen Sohn; „Junge“ ist im modernen Deutschen natürlich und bewahrt den Bezug der Szene.
- source_word: አትፈኑ፡ እዴከ፡ ዲበ
  choice: Streck deine Hand nicht gegen ... aus
  rationale: Gibt die konkrete körperliche Handlung und ihre feindliche Zielrichtung idiomatisch wieder.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: du Gott fürchtest
  rationale: Bewahrt die traditionelle und theologisch offene Formulierung der Gottesfurcht.
- source_word: 'በዘረከ (editionskritisch: በኵረከ)'
  choice: deinen Erstgeborenen
  rationale: Die vorgelegte Zeichenfolge beruht nach dem Editionsbefund auf einem OCR-Fehler; Charles 1895 liest „deinen Erstgeborenen“, nicht „deinen Samen“.
theological_decisions:
- issue: Sprecheridentität
  choice: ich sagte
  alternative: er sagte
  rationale: Die ge'ezische Verbform ist eindeutig die 1. Person Singular. Die Übersetzung folgt der Erzählstimme, ohne sie durch eine erklärende Benennung zu ersetzen.
- issue: Bedeutung von Gottesfurcht
  choice: dass du Gott fürchtest
  alternative: dass du gottesfürchtig bist
  rationale: Die verbale Formulierung hält den unmittelbaren Bezug zu Abrahams Handeln fest und vermeidet eine interpretierende Charaktereigenschaft.
- issue: Bezeichnung Isaaks
  choice: deinen Sohn, deinen Erstgeborenen
  alternative: deinen Sohn, deinen Samen
  rationale: „Erstgeborenen“ folgt der verifizierten Lesart der genannten Edition; die Apposition bleibt erhalten, auch wenn sie im Zusammenhang mit Ismael eine bewusste literarisch-theologische Spannung erzeugt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ ist direkt und natürlich; die Wiederholung „deinen Sohn, deinen Erstgeborenen“ bewahrt die Struktur und Spannung des Quelltexts.
