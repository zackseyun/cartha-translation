  yaml_path: translation/extra_canonical/jubilees/018/004.yaml
  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: de
  text: 'Und er sah den Ort von fern. Er kam bis zu einem Wasserbrunnen[a] und sagte zu seinen Dienern: »Bleibt hier bei den Eseln. Der Junge und ich werden weitergehen, uns niederwerfen und zu euch zurückkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wassergrube«.'
    reason: Die geezische Wortgruppe kann einen Brunnen beziehungsweise eine zum Sammeln von Wasser angelegte Grube bezeichnen.
lexical_decisions:
- source_word: መካነ
  choice: den Ort
  rationale: Das bestimmte Objekt entspricht natürlich und präzise dem gemeinten Ort, den Abraham aus der Ferne sieht.
- source_word: ዐዘቅተ፡ ማይ
  choice: Wasserbrunnen
  rationale: Die Wortgruppe bezeichnet wörtlich eine Wassergrube beziehungsweise einen Brunnen; »Wasserbrunnen« bewahrt die explizite Nennung des Wassers und bleibt im Deutschen verständlich.
- source_word: አድግት
  choice: den Eseln
  rationale: Die geezische Form ist pluralisch; deshalb wird nicht an den Singular von Genesis 22,5 angeglichen.
- source_word: ሰጊደነ
  choice: uns niederwerfen
  rationale: Das Verb bezeichnet körperliches Niederwerfen als Verehrungs- oder Anbetungsgeste; die konkrete Handlung wird bewahrt.
- source_word: ሕፃን
  choice: der Junge
  rationale: Im Kontext bezeichnet das Wort Isaak als jungen Menschen; »Junge« ist natürlich und vermeidet die im Deutschen missverständliche Bedeutung von »Kind« hinsichtlich seines genauen Alters.
theological_decisions:
- issue: Zweck und Bedeutung des Niederwerfens
  choice: uns niederwerfen
  alternative: anbeten
  rationale: Die konkrete Körperhandlung bleibt sichtbar, ohne vorschnell festzulegen, ob ausschließlich kultische Anbetung gemeint ist.
- issue: Aussage über die gemeinsame Rückkehr
  choice: und dann zu euch zurückkehren
  alternative: und wir werden zu euch zurückkehren
  rationale: Der futurische Sinn wird natürlich wiedergegeben, ohne die Spannung zwischen Abrahams Aussage und der bevorstehenden Opferforderung zu erklären oder aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Der Plural »Eseln« folgt ausdrücklich dem geezischen Text und wird nicht mit Genesis 22,5 harmonisiert. Die direkte Rede bleibt einfach und feierlich.
