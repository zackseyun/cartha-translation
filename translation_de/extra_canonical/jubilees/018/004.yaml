  rationale: Die Revision glättet die deutsche Syntax und bildet die futurische Aussage des geezischen Textes unmittelbarer ab. Sie belässt die pluralischen »Esel«, die körperlich konkrete Geste des Niederwerfens und die Aussage, dass beide zurückkehren werden. Die lexikalische Ambiguität von ዐዘቅተ ማይ bleibt über die vorhandene Fußnote markiert.
