revisions:
- from: 'Und er sah den Ort von fern. Er kam bis zu dem Wasserbrunnen[a] und sagte zu seinen Dienern: »Bleibt hier bei den Eseln. Ich aber und der Junge wollen dorthin gehen, uns niederwerfen und dann zu euch zurückkehren.«'
