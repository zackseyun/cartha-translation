  text: And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.
translation:
  language: de
  text: Und Abraham ging zu seinen Knechten. Sie standen auf und gingen gemeinsam nach Beerscheba; und Abraham wohnte beim Brunnen des Eides.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቁ
  choice: seinen Knechten
  rationale: Das Wort bezeichnet hier Abrahams Diener bzw. junge männliche Begleiter; „Knechte“ entspricht dem biblischen Erzählregister und dem Zusammenhang.
- source_word: በርስሕ
  choice: Beerscheba
  rationale: Der Ortsname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: ዐዘቅት፡ መሐላ
  choice: Brunnen des Eides
  rationale: Die geezische Benennung wird bedeutungsgetreu übersetzt und bewahrt das Wortspiel bzw. die Deutung des Ortsnamens.
- source_word: ኀደረ
  choice: wohnte
  rationale: Das Verb kann ein Bleiben, Lagern oder Wohnen bezeichnen; „wohnte“ passt zur längerfristigen Niederlassung Abrahams.
