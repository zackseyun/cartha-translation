  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: de
  text: 'Und so ist es angeordnet und auf den himmlischen Tafeln über Israel und seine Nachkommen geschrieben: Sie sollen dieses Fest sieben Tage lang in festlicher Freude begehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ
  choice: ist es angeordnet und … geschrieben
  rationale: Gibt sowohl die verbindliche Festsetzung als auch ihre schriftliche Niederlegung wieder, ohne die beiden Aussagen zusammenzuziehen.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Entspricht der im Jubiläenbuch feststehenden Vorstellung und bewahrt das konkrete Bild der Tafeln.
- source_word: ዘርኡ
  choice: seine Nachkommen
  rationale: Natürliches modernes Deutsch für wörtlich „sein Same“ im Sinn der Nachkommenschaft Israels.
- source_word: ለገቢረ፡ ዛቲ፡ በዓል
  choice: dieses Fest … begehen
  rationale: „Ein Fest begehen“ gibt die Konstruktion „dieses Fest tun/halten“ idiomatisch und würdig wieder.
- source_word: በፍሥሓ፡ በዓል
  choice: in festlicher Freude
  rationale: Bewahrt neben der Freude auch die erneute ausdrückliche Festnuance des abschließenden በዓል.
theological_decisions:
- issue: Geltungsgrund der Festordnung
  choice: Die doppelte Aussage „angeordnet“ und „auf den himmlischen Tafeln … geschrieben“ bleibt erhalten.
  alternative: Nur „auf den himmlischen Tafeln festgeschrieben“
  rationale: Die Quelle nennt Anordnung und Niederschrift nebeneinander; eine Verschmelzung würde eine echte Aussagekomponente abschwächen.
- issue: Bezug von Israel und seiner Nachkommenschaft
  choice: „über Israel und seine Nachkommen“
  alternative: „für Israel und seine Nachkommen“
  rationale: „Über“ folgt der Präposition enger und lässt offen, ob vor allem Gegenstand, Bestimmung oder Verpflichtung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt vermeidet einen schwerfälligen dass-Satz und gibt den normativen Inhalt klar wieder. „Festliche Freude“ ist bewusst beibehalten, da der Ge’ez-Text am Versende erneut das Festmotiv nennt.
