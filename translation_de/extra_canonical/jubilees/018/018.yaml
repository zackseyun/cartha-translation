  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: de
  text: Und er feierte dieses Fest jedes Jahr sieben Tage lang mit Freude. Er nannte es das Fest des HERRN, entsprechend den sieben Tagen, in denen er fortgegangen und in Frieden zurückgekehrt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር፡ ዛተ፡ በዓለ
  choice: er feierte dieses Fest
  rationale: Das Verb bedeutet wörtlich „machen/tun“, bezeichnet mit „Fest“ als Objekt aber idiomatisch das Begehen oder Feiern eines Festes.
- source_word: በኵሉ፡ ዓመታት
  choice: jedes Jahr
  rationale: Natürliche deutsche Wiedergabe der distributiven Zeitangabe „in allen Jahren“.
- source_word: ሰቡዐ፡ ዕለተ
  choice: sieben Tage lang
  rationale: Gibt Dauer und Zahl klar und idiomatisch wieder.
- source_word: በፍሥሓ
  choice: mit Freude
  rationale: Entspricht dem Sinn von Freude, Fröhlichkeit beziehungsweise Jubel, ohne den Ausdruck zu übersteigern.
- source_word: በዓለ፡ እግዚአብሔር
  choice: das Fest des HERRN
  rationale: Bewahrt die Genitivverbindung; die Kapitälchenkonvention „HERR“ kennzeichnet den Gottesnamen in würdiger deutscher Bibelsprache.
- source_word: ሖረ፡ ወተመይጠ፡ በሰላም
  choice: fortgegangen und in Frieden zurückgekehrt war
  rationale: Bildet die beiden Bewegungsverben und die modale Friedensangabe in ihrer Reihenfolge ab.
theological_decisions:
- issue: Bezeichnung des Festes als „Fest des HERRN“
  choice: Die Zugehörigkeitsbezeichnung bleibt ohne nähere Deutung stehen.
  alternative: „ein Fest für den HERRN“
  rationale: Der Genitiv kann Zugehörigkeit oder Widmung ausdrücken. „Fest des HERRN“ bewahrt die formale Offenheit und vermeidet, die Beziehung einseitig als Widmung festzulegen.
- issue: Bezug der sieben Tage
  choice: Die sieben Tage werden als Zeitraum seines Fortgehens und seiner friedlichen Rückkehr wiedergegeben.
  alternative: „weil er nach sieben Tagen in Frieden zurückgekehrt war“
  rationale: Die Quelle verbindet die sieben Tage mit dem Gehen und Zurückkehren; eine punktuelle Rückkehr „nach sieben Tagen“ wäre interpretierender.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdige Standardsprache. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; Wiederholungen und zeitliche Bezüge der Quelle bleiben erhalten.
