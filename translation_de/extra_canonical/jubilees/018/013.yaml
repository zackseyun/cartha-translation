  text: And Abraham called that place “The LORD has seen,” so that it is said, “The LORD has seen”—it is Mount Zion.
translation:
  language: de
  text: 'Und Abraham nannte jenen Ort »Der HERR hat gesehen«, sodass man sagt: »Der HERR hat gesehen« – es ist der Berg Zion.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ
  choice: nannte
  rationale: Das äthiopische Verb bezeichnet hier das Benennen eines Ortes; »nannte« ist im Deutschen natürlich und präzise.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Gottesbezeichnung wird in bibelsprachlicher Konvention mit »der HERR« wiedergegeben.
- source_word: ርእየ
  choice: hat gesehen
  rationale: Bewahrt die finite Vergangenheitsform der Vorlage und lässt die mögliche Anspielung auf Gottes Wahrnehmen bzw. Vorsorge unausgedeutet.
- source_word: ደብረ፡ ጽዮን
  choice: der Berg Zion
  rationale: Direkte und geläufige Wiedergabe der Ortsbezeichnung.
theological_decisions:
- issue: Bedeutung von »Der HERR hat gesehen«
  choice: wörtlich »hat gesehen«
  alternative: »Der HERR wird vorsorgen« / »Der HERR hat ersehen«
  rationale: Die Vorlage verwendet das Verb des Sehens. Die Übersetzung wahrt diese Formulierung und legt die darin möglicherweise mitschwingende Vorstellung göttlicher Vorsorge nicht ausdrücklich fest.
- issue: Identifikation des Ortes mit Zion
  choice: »es ist der Berg Zion«
  alternative: '»das heißt: der Berg Zion«'
  rationale: Die prädikative Aussage der Vorlage wird direkt wiedergegeben, ohne sie lediglich als erklärende Glosse umzudeuten.
translation_notes:
  register: Moderne, würdige Bibelsprache mit klarer Syntax. Die Wiederholung von »Der HERR hat gesehen« bleibt entsprechend der Vorlage erhalten.
