  yaml_path: translation/extra_canonical/jubilees/018/012.yaml
  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: de
  text: 'Und Fürst Mastema wurde beschämt. Abraham erhob seine Augen und sah, und siehe: Ein Widder hatte sich mit seinen Hörnern im Dickicht verfangen. Da ging Abraham hin, nahm den Widder und brachte ihn anstelle seines Sohnes als Brandopfer dar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: Fürst Mastema
  rationale: መኰንን bezeichnet einen Herrscher bzw. Fürsten und steht hier als Titel vor dem Eigennamen Mastema.
- source_word: አሐዱ፡ በሐኵ
  choice: ein Widder
  rationale: አሐዱ gibt die Einzahl ausdrücklich an; im natürlichen Deutschen wird dies mit dem unbestimmten Artikel „ein“ wiedergegeben.
- source_word: አኀዝ፡ በዕፀው፡ በአቅርንቲሁ
  choice: hatte sich mit seinen Hörnern im Dickicht verfangen
  rationale: Die Formulierung beschreibt den Widder als im Gehölz festgehalten; „sich verfangen“ ist dafür eine natürliche und anschauliche deutsche Wiedergabe.
- source_word: አዕረገ፡ ለጽንሓሕ
  choice: brachte ihn … als Brandopfer dar
  rationale: Die Wendung bezeichnet das Hinaufbringen bzw. Darbringen als Ganzbrandopfer; „Brandopfer“ ist die geläufige deutsche Bezeichnung.
- source_word: ህየንተ፡ ወልዱ
  choice: anstelle seines Sohnes
  rationale: ህየንተ drückt Stellvertretung bzw. Ersatz aus, ohne darüber hinausgehende Deutung einzutragen.
theological_decisions:
- issue: Bezeichnung Mastemas
  choice: Fürst Mastema
  alternative: der Fürst Mastema
  rationale: Der Titel wird wie im Quelltext eng mit dem Namen verbunden. Ohne Artikel wirkt er im Deutschen als feste Titulatur und vermeidet eine unnötige Präzisierung.
- issue: Stellvertretung des Widders
  choice: anstelle seines Sohnes
  alternative: für seinen Sohn
  rationale: „Anstelle“ bewahrt den klaren Ersatzgedanken des Ausgangstextes, ohne eine weitergehende soteriologische Auslegung zu ergänzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusster Beibehaltung der biblischen Schauformel „und siehe“. Der Satzbau wurde leicht geglättet, ohne die erzählerische Abfolge oder theologische Spannung aufzulösen.
