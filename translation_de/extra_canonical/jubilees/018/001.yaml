  source_fidelity: 'Die Übersetzung gibt die ge’ezische Satzfolge und die wesentlichen Elemente zuverlässig wieder: die Anrede Gottes, Abrahams Antwort, die dreifache Kennzeichnung Isaaks, das Ziel »hohes Land/Hochland« sowie den Auftrag, ihn auf einem noch zu zeigenden Berg darzubringen. »Hochland« ist eine natürliche Wiedergabe von »hohes Land« und enthält keine unzulässige Ortsidentifikation. Die Formulierung »als Opfer darbringen« trifft die im Kontext naheliegende kultische Bedeutung von ወአዕርጎ, während Fußnote b die Grundbildlichkeit des Hinaufbringens transparent macht.'
