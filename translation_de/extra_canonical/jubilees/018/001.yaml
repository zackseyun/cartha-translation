  yaml_path: translation/extra_canonical/jubilees/018/001.yaml
  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: de
  text: 'Und der HERR sagte zu Abraham: »Abraham, Abraham!« Er antwortete: »Hier bin ich.« Da sagte er: »Nimm deinen Sohn, deinen geliebten Sohn, den du liebst, Isaak, und geh in das Hochland.[a] Bring ihn auf einem der Berge, die ich dir zeigen werde, als Opfer dar.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in das hohe Land«.'
    reason: Bewahrt die transparente Bedeutung der ge’ezischen Verbindung neben dem idiomatischen deutschen »Hochland«.
  - marker: b
    text: 'Wörtlich etwa: »Lass ihn hinaufsteigen« oder »Bring ihn hinauf«; das Verb kann das Darbringen eines Opfers bezeichnen.'
    reason: Macht die Bildlichkeit und den Bedeutungsumfang des ge’ezischen Verbs sichtbar.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die herkömmliche und im Kontext passende Wiedergabe der Gottesbezeichnung; die Kapitälchen kennzeichnen den göttlichen Titel.
- source_word: ምድር፡ ልዐልት
  choice: das Hochland
  rationale: Das Substantiv »Land« wird im Ge’ez durch ein feminines Adjektiv mit der Bedeutung »hoch« näher bestimmt. »Hochland« gibt diese Verbindung natürlich und prägnant wieder.
- source_word: ወአዕርጎ
  choice: Bring ihn … als Opfer dar
  rationale: Das Kausativverb bedeutet wörtlich »lass ihn hinaufsteigen« beziehungsweise »bring ihn hinauf« und wird im Opferkontext für das Darbringen verwendet. Die gewählte Formulierung macht die kultische Bedeutung auf Deutsch verständlich.
- source_word: ይስሐቅሃ
  choice: Isaak
  rationale: Das Ge’ez enthält ein Possessivsuffix (»dein Isaak«). Da die Zugehörigkeit bereits durch »deinen Sohn« ausgedrückt ist und »dein Isaak« im Deutschen unnatürlich klingt, steht der Name als Apposition.
theological_decisions:
- issue: Bedeutung des Befehls ወአዕርጎ
  choice: als Opfer darbringen
  alternative: hinaufbringen / hinaufsteigen lassen
  rationale: Der Opferkontext trägt die kultische Bedeutung, doch die zugrunde liegende Bildlichkeit des Hinaufbringens bleibt in einer Fußnote sichtbar, ohne die Spannung des Textes abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung »Abraham, Abraham« sowie die auffällige Häufung »deinen Sohn, deinen geliebten Sohn, den du liebst« bleiben erhalten. Die direkte Rede ist natürlich gegliedert, ohne die Spannung oder Härte des Befehls zu mildern.
