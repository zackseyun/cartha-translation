  terminology: »der HERR« entspricht der etablierten deutschen Wiedergabe der Gottesbezeichnung. »Isaak«, »Hochland« und »als Opfer darbringen« sind terminologisch verständlich und kontextgerecht. Die Fußnoten sind korrekt verankert und erläutern die zwei relevanten Übersetzungsentscheidungen, ohne den Text zu überladen.
