  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: de
  text: Und er stand früh am Morgen auf, sattelte seinen Esel und nahm zwei Diener mit sich sowie seinen Sohn Isaak. Er spaltete das Holz für das Brandopfer und ging am dritten Tag zu dem Ort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሌለየ፡ በነግህ፡
  choice: stand früh am Morgen auf
  rationale: Die Wendung bezeichnet das frühe Aufstehen am Morgen; die natürliche deutsche Formulierung bewahrt den erzählerischen Ablauf.
- source_word: አድጎ፡
  choice: seinen Esel
  rationale: Das Substantiv bezeichnet hier den Esel als Reittier; das Possessivpronomen ergibt sich sachgerecht aus dem Kontext.
- source_word: ደቂቀ፡
  choice: Knechte
  rationale: Im Kontext sind zwei männliche Angehörige des Haushalts beziehungsweise Diener gemeint. „Knechte“ entspricht dem biblisch-erzählerischen Register, ohne ihren Status genauer festzulegen.
- source_word: መሥዋዕተ፡ ሰፀረ፡
  choice: Brandopfer
  rationale: Die Wortgruppe bezeichnet das vollständig verbrannte Opfer und entspricht funktional dem Brandopfer in Genesis 22.
- source_word: ዐፀወ፡ … ሰፀረ፡
  choice: das Holz für das Brandopfer
  rationale: Die syntaktische Verbindung wird im Deutschen mit „für“ natürlich und sachlich klar wiedergegeben.
- source_word: በሠሉስ፡ ዕለት፡
  choice: Am dritten Tag
  rationale: Die überlieferte Wortgruppe bedeutet „am dritten Tag“, steht in der vorgelegten Textgestalt jedoch offenbar am Beginn des anschließenden Satzes.
theological_decisions:
- issue: Bezeichnung des Opfers
  choice: Brandopfer
  alternative: Opfer zum Verbrennen
  rationale: „Brandopfer“ ist die etablierte, präzise deutsche Bezeichnung und fügt keine Deutung über die Opferart hinaus hinzu.
- issue: Satzanschluss von „am dritten Tag“
  choice: Beginn des folgenden, offen bleibenden Satzes
  alternative: 'Abschluss des Satzes: „und gelangte am dritten Tag an den Ort“'
  rationale: Die vorgelegte Geʿez-Textgestalt setzt vor „am dritten Tag“ ein Trennzeichen beziehungsweise einen markierten Kapitelanschluss. Zudem fehlt hier ein Verb wie „gelangte“. Daher wird die syntaktische Spannung nicht nach dem englischen Konsultationstext geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Erzählton. Kurze Hauptsätze bilden die parataktische Struktur des Geʿez nach. Die Ellipse am Versende wird wegen der ausgewiesenen Kapiteltrennung erhalten.
