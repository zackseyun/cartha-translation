  text: And I called to him from heaven and said to him, “Abraham, Abraham.” And he was terrified and said, “Here I am.”
translation:
  language: de
  text: 'Und ich rief ihm vom Himmel her zu und sagte zu ihm: »Abraham, Abraham!« Da erschrak er[a] und sagte: »Hier bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da wich er erschrocken zurück.«'
    reason: Die Verbform kann neben dem Erschrecken auch ein furchtsames Zurückweichen ausdrücken.
lexical_decisions:
- source_word: ጸዋዕክዎ፡ እምሰማይ
  choice: ich rief ihm vom Himmel her zu
  rationale: Gibt das Rufen mit indirektem Objekt und die Herkunft der Stimme natürlich und quellennah wieder.
- source_word: ወይገብዕ
  choice: Da erschrak er
  rationale: Der Kontext und die geprüfte lexikalische Evidenz sprechen für Erschrecken beziehungsweise Zurückweichen, nicht für Eile.
- source_word: ነየ፡ አነ
  choice: Hier bin ich
  rationale: Natürliche deutsche Wiedergabe der Antwortformel, mit der sich der Angesprochene zur Verfügung stellt.
theological_decisions:
- issue: Abrahams Reaktion auf die Stimme vom Himmel
  choice: Da erschrak er
  alternative: Da wich er erschrocken zurück
  rationale: Die knappe Form bewahrt die im Jubiläenbuch ausdrücklich genannte Furcht, ohne eine körperliche Bewegung stärker festzulegen, als es nötig ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; »vom Himmel her« klingt natürlich und wahrt die räumliche Perspektive der Quelle.
