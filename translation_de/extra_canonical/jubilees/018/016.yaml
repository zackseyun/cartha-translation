  - severity: low
    issue: „So habe ich allen kundgetan“
    rationale: Das Quellwort verbindet die Aussage schlicht mit „und“. „So“ verstärkt den Schluss- bzw. Folgesinn. „Und ich habe …“ bleibt näher am Text, ohne unnatürlich zu sein.
