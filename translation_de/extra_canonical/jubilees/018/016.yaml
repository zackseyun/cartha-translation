  source_fidelity: 'Die Wiedergabe trifft den Sinn insgesamt gut. Die Präposition bei በዘርእከ sollte jedoch nicht ohne zwingenden Grund als instrumentales „durch“ festgelegt werden: In diesem Verheißungsformular ist „in“ die näherliegende, auch zum englischen Audit Trail passende Wiedergabe. Der Quellenausdruck für „Same/Nachkommenschaft“ ist zudem semantisch nicht auf einen einzelnen Nachkommen beschränkt.'
  naturalness: Der Text ist würdiges, modernes Standarddeutsch. „Kundgetan“ und „Geh in Frieden“ passen zum Register. Die Satztrennung ist möglich, doch „So habe ich“ macht aus dem einfachen anschließenden „und“ einen stärker folgernden Zusammenhang.
  terminology: „Nachkommen“ im Singular ist im Deutschen überwiegend individuell und bewahrt daher die kollektive Lesemöglichkeit des Quellenausdrucks nicht, anders als die Begründung behauptet. „Nachkommenschaft“ ist hier die natürlichere übergreifende Bezeichnung; die mögliche individuelle Zuspitzung wird in einer Anmerkung offengehalten.
