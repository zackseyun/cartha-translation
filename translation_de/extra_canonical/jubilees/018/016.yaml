  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: de
  text: Und in deiner Nachkommenschaft werden alle Völker der Erde gesegnet werden, weil du auf meine Stimme gehört hast, und ich habe allen kundgetan, dass du mir in allem treu bist, was ich dir gesagt habe. Geh in Frieden.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  choice: durch deinen Nachkommen
  rationale: Das ge'ezische Wort bezeichnet wörtlich »Same/Nachkommenschaft« und kann kollektiv oder auf einen einzelnen Nachkommen bezogen verstanden werden. Der deutsche Singular »Nachkomme« bewahrt diese Offenheit besser als »Nachkommen«; »durch« gibt die instrumentale Bedeutung von በ- natürlich wieder.
- source_word: አሕዛበ፡ ምድር
  choice: Völker der Erde
  rationale: አሕዛብ bezeichnet hier die Völker bzw. Nationen. »Völker der Erde« ist idiomatisch und entspricht der feierlichen Verheißungssprache.
- source_word: ዘሰማዕከ፡ ቃለ፡ ዚአየ
  choice: weil du auf meine Stimme gehört hast
  rationale: Wörtlich steht »weil du meine Stimme gehört hast«; im Kontext bedeutet die Wendung gehorsames Hören. »Auf meine Stimme gehört« bewahrt das Bild und macht den Sinn im heutigen Deutsch deutlich.
- source_word: አይደዐኩ፡ ለኵሉ
  choice: So habe ich allen kundgetan
  rationale: Das Verb bedeutet »wissen lassen/bekannt machen«. »Kundgetan« wahrt den würdigen Registerton; ለኵሉ wird knapp mit »allen« wiedergegeben.
- source_word: ምእመን
  choice: treu
  rationale: Das Adjektiv kann »treu, zuverlässig, glaubwürdig« bedeuten. In der Beziehung zu Gott und angesichts der bestandenen Prüfung passt »treu«, ohne eine speziell konfessionelle Deutung einzutragen.
- source_word: ሖር፡ በሰላም
  choice: Geh in Frieden
  rationale: Direkte und natürliche Wiedergabe der abschließenden Entlassungsformel.
theological_decisions:
- issue: Singular oder kollektive Bedeutung von »Same/Nachkommenschaft«
  choice: »deinen Nachkommen« im Singular
  alternative: »deine Nachkommen« oder »deine Nachkommenschaft«
  rationale: Der Quellenausdruck ist grammatisch singularisch und zugleich semantisch offen für einen Einzelnen oder eine kollektive Nachkommenschaft. Der deutsche Singular erhält diese theologische Spannung, ohne sie ausdrücklich aufzulösen.
- issue: Art des Segens für die Völker
  choice: »werden … gesegnet werden«
  alternative: »werden sich … Segen wünschen«
  rationale: Die ge'ezische Verbform wird hier entsprechend der überlieferten Fassung als passiv/reflexiv deutbarer Segensvorgang verstanden. Die passive Form folgt dem unmittelbaren Sinn und vermeidet eine Festlegung auf eine bloße Segensformel.
- issue: Zusammenhang zwischen Gehorsam und öffentlicher Bestätigung
  choice: Zwei Sätze mit »So habe ich …«
  alternative: Ein fortlaufender Satz mit »und ich habe …«
  rationale: »So« bringt den Folgezusammenhang natürlich zum Ausdruck, ohne einen weitergehenden dogmatischen Kausalmechanismus zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten biblischen Leitbildern (»Stimme«, »kundgetan«, »in Frieden«). Die Syntax wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert. Keine Fußnoten erforderlich.
