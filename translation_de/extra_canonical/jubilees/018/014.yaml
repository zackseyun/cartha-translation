revisions:
- from: Und der HERR rief Abraham ein zweites Mal vom Himmel her bei seinem Namen, wie er es mir gezeigt hatte, damit wir im Namen des HERRN sprechen sollten.
  to: Und der HERR rief Abraham ein zweites Mal vom Himmel her beim Namen, wie er mir gezeigt hatte, dass wir im Namen des HERRN sprechen sollten.
  rationale: Die Revision stellt die deutsche feste Wendung „beim Namen rufen“ her und gibt den zweiten ከመ-Satz als Inhalt dessen wieder, was dem Sprecher gezeigt worden war. Die auffällige Perspektive „wir“ und das Modalverb „sollten“ bleiben erhalten; es wird keine zusätzliche Deutung zum Sprecher oder zur theologischen Aussage eingeführt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:59:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Abfolge und der wesentliche Inhalt werden getroffen: der Ruf erfolgt zum zweiten Mal vom Himmel, Abraham wird beim Namen angesprochen, und die ungewöhnliche erste Person Plural bleibt erhalten. Die deutsche Finalkonstruktion „damit wir … sprechen sollten“ legt jedoch einen Zweck fest, während ከመ an dieser Stelle im Anschluss an „er mir gezeigt hatte“ naheliegend und auch im englischen Audit als Inhaltssatz („that“) verstanden wird.'
  naturalness: „bei seinem Namen“ ist in dieser Stellung nicht idiomatisch. Die feste moderne deutsche Wendung lautet „jemanden beim Namen rufen“. Auch „wie er es mir gezeigt hatte, damit …“ ist syntaktisch schwerfällig und semantisch missverständlich.
  terminology: „HERR“ für እግዚአብሔር sowie „im Namen des HERRN“ sind im würdevollen deutschen Bibelregister angemessen. „vom Himmel her“ ist ebenfalls treffend.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von በስሙ
    rationale: „Abraham … bei seinem Namen“ klingt im modernen Standarddeutsch nicht natürlich. „Abraham … beim Namen“ gibt die explizite Namensanrede quellentreu und idiomatisch wieder.
  - severity: medium
    issue: „damit“ verengt die Funktion von ከመ
    rationale: Nach „wie er mir gezeigt hatte“ ist ein Inhaltssatz mit „dass“ die klare und natürliche Wiedergabe. „Damit“ macht daraus einen Zwecksatz und verschiebt damit den Bezug.
  revised_text: Und der HERR rief Abraham ein zweites Mal vom Himmel her beim Namen, wie er mir gezeigt hatte, dass wir im Namen des HERRN sprechen sollten.
  revised_footnotes: []
  revision_rationale: Die Revision stellt die deutsche feste Wendung „beim Namen rufen“ her und gibt den zweiten ከመ-Satz als Inhalt dessen wieder, was dem Sprecher gezeigt worden war. Die auffällige Perspektive „wir“ und das Modalverb „sollten“ bleiben erhalten; es wird keine zusätzliche Deutung zum Sprecher oder zur theologischen Aussage eingeführt.
