  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: de
  text: Und der HERR rief Abraham ein zweites Mal vom Himmel her beim Namen, wie er mir gezeigt hatte, dass wir im Namen des HERRN sprechen sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዖ
  choice: Und … rief
  rationale: Gibt das ge'ezische Verb „rufen/anrufen“ in diesem Kontext natürlich und quellentreu wieder.
- source_word: በስሙ
  choice: bei seinem Namen
  rationale: Bewahrt die instrumentale Wendung „mit/bei seinem Namen“ und vermeidet die freiere Formulierung „mit Namen“.
- source_word: ዳግመ
  choice: ein zweites Mal
  rationale: Entspricht dem adverbialen Sinn „wieder, zum zweiten Mal“.
- source_word: እምሰማይ
  choice: vom Himmel her
  rationale: Gibt Herkunft und räumliche Richtung der Präposition ausdrücklich wieder.
- source_word: ከመ ንትናገር
  choice: damit wir … sprechen sollten
  rationale: Bewahrt die finale beziehungsweise konsekutive Offenheit von ከመ mit der nachfolgenden Verbform, ohne den Satz freier umzudeuten.
- source_word: በስመ እግዚአብሔር
  choice: im Namen des HERRN
  rationale: Die übliche und sachlich genaue deutsche Wiedergabe der Wendung.
theological_decisions:
- issue: Bezug und Funktion des Offenbarungssatzes
  choice: „wie er es mir gezeigt hatte, damit wir … sprechen sollten“
  alternative: „wie er mir gezeigt hatte, dass wir … sprechen sollten“
  rationale: Die gewählte Fassung erhält die im Ge'ez angelegte mögliche Zweck-/Folgerelation, statt ከመ eindeutig als Inhaltssatz festzulegen.
- issue: Wiedergabe des Gottesnamens
  choice: HERR in Kapitälchen-Schreibweise
  alternative: Herr
  rationale: Folgt der etablierten deutschen Bibelkonvention für den in der Vorlage durch እግዚአብሔር bezeichneten göttlichen Titel im gegebenen Überlieferungskontext, ohne einen nicht ausdrücklich erhaltenen Eigennamen einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Perspektive der ersten Person Plural sowie die Spannung zwischen Vergleichssatz und Zwecksatz bleiben erhalten; der Text wird nicht durch ergänzende Identifizierung des Sprechers geglättet.
