  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: de
  text: 'Und er sagte: „Gott wird sich das Schaf zum Brandopfer ersehen, mein Sohn.“ Und er kam zu dem Ort, dem Berg des HERRN.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ፡ በግዐ
  choice: wird sich selbst das Schaf ersehen
  rationale: Die Wendung bedeutet wörtlich, dass Gott für sich das Opfertier sehen beziehungsweise auswählen oder bereitstellen wird. „sich selbst … ersehen“ bewahrt das Bild des Sehens und lässt die im Ausgangstext vorhandene Bedeutungsweite bestehen.
- source_word: ለጽንሓሕ
  choice: für das Brandopfer
  rationale: Der Kontext und die englische Kontrollfassung weisen auf das zum vollständigen Verbrennen bestimmte Opfer; „Brandopfer“ ist dafür die geläufige und sachlich genaue deutsche Bezeichnung.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Direkte, natürliche Wiedergabe der vertraulichen Anrede.
- source_word: መካን፡ ዘደብረ፡ እግዚአብሔር
  choice: dem Ort am Berg des HERRN
  rationale: Gibt die Genitivverbindung verständlich wieder, ohne den Bergnamen zu ergänzen oder den Ausdruck stärker zu bestimmen, als es die Quelle erlaubt.
theological_decisions:
- issue: Bedeutung von Gottes „Sehen“ des Opfertiers
  choice: „wird sich selbst … ersehen“
  alternative: „wird sich selbst … bereitstellen“ oder „wird für sich … auswählen“
  rationale: Die Übersetzung wahrt die mögliche Spannung zwischen Wahrnehmen, Auswählen und Vorsehen, statt die Aussage ausschließlich als göttliche Bereitstellung auszulegen.
- issue: Gottesbezeichnung im Ausdruck „Berg des HERRN“
  choice: HERR in Kapitälchenkonvention
  alternative: Herr oder Gott
  rationale: Die deutsche Bibeltradition kennzeichnet so den Gottesnamen beziehungsweise die entsprechende ehrerbietige Gottesbezeichnung, ohne eine zusätzliche konfessionelle Deutung einzuführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bleibt bewusst eng am ge'ezischen Ausgangstext; „ersehen“ ist leicht gehoben, aber im Opferkontext verständlich und bewahrt das Wortspiel beziehungsweise Bedeutungsfeld des Sehens.
