  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: de
  text: Und er nahm das Holz für das Opfer und legte es seinem Sohn Isaak auf. Dann nahm er das Feuer und das Messer in die Hand, und beide gingen gemeinsam bis zu jenem Ort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: das Holz für das Opfer
  rationale: Gibt die Genitivverbindung natürlich und sachlich wieder, ohne eine bestimmte Opferart hinzuzufügen.
- source_word: አስከሞ
  choice: legte es … auf
  rationale: Bewahrt den konkreten Sinn des Aufladens; das Bezugswort „Holz“ macht das neutrale Pronomen erforderlich.
- source_word: እሳተ፡ ወመጥባሕተኒ
  choice: das Feuer und das Messer
  rationale: Entspricht den beiden ausdrücklich genannten Gegenständen; „Messer“ ist im Kontext idiomatischer als eine stärker spezialisierte Benennung.
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: beide gingen gemeinsam
  rationale: Gibt sowohl die Zweiheit als auch das gemeinsame Gehen wieder, ohne unnötige Wiederholung.
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: bis zu jenem Ort
  rationale: Bewahrt den durch እስክ ausgedrückten Ziel- beziehungsweise Grenzbezug und die deiktische Distanz von „jenem“.
