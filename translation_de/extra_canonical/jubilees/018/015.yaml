  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: de
  text: 'Und er sagte: »Bei mir selbst habe ich geschworen, spricht der HERR: Weil du dies getan und mir deinen Sohn, deinen Erstgeborenen[a], den du liebst, nicht vorenthalten hast, werde ich dich überreich segnen und deine Nachkommen überaus zahlreich machen wie die Sterne am Himmel und wie den Sand am Meeresufer. Deine Nachkommen werden die Städte ihrer Feinde in Besitz nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Lesart lautet »deinen Erstgeborenen«; die vorliegende digitalisierte Textform ist offenbar fehlerhaft.
    reason: Die gebotene Form በዘረከ beruht nach der Quellenprüfung auf einem Übertragungs- oder OCR-Fehler für eine Lesart mit der Bedeutung »dein Erstgeborener«.
lexical_decisions:
- source_word: በርእስየ መሐልኩ
  choice: Bei mir selbst habe ich geschworen
  rationale: Gibt die Selbstbeschwörung formal und zugleich idiomatisch wieder.
- source_word: ገበርከ ዘንተ ቃለ
  choice: du dies getan hast
  rationale: Das wörtliche »dieses Wort getan« bezeichnet hier die vollzogene Tat; die deutsche Wendung bewahrt den Sinn natürlich.
- source_word: ወልደከ … ዘአፍቀርከ
  choice: deinen Sohn … den du liebst
  rationale: Bewahrt den Relativsatz und gibt die Liebe als Abrahams Haltung wieder, ohne sie zu einer bloßen Bezeichnung einzuebnen.
- source_word: ባርኮ እባርከከ
  choice: werde ich dich überreich segnen
  rationale: Die figura etymologica aus Infinitiv und finitem Verb drückt nachdrückliche Gewissheit und Fülle aus; »überreich« bildet diese Betonung in natürlichem Deutsch ab.
- source_word: አበዝኆ አበዝኆ ዘርአከ
  choice: deine Nachkommen überaus zahlreich machen
  rationale: Gibt die emphatische Wiederholung und das kollektive »Same/Nachkommenschaft« verständlich wieder.
- source_word: አህጉረ ፀሮሙ
  choice: die Städte ihrer Feinde
  rationale: አህጉር kann Gebiete oder Städte bezeichnen; im gegebenen Erzählzusammenhang und in der überlieferten Fassung ist »Städte« die passendste konkrete Wiedergabe.
theological_decisions:
- issue: Göttlicher Schwur bei sich selbst
  choice: Bei mir selbst habe ich geschworen
  alternative: Ich schwöre bei mir selbst
  rationale: Das Perfekt des Quelltextes wird beibehalten und nicht zu einer gegenwärtigen Schwurformel umgestaltet.
- issue: Verheißung an die Nachkommenschaft
  choice: Deine Nachkommen werden die Städte ihrer Feinde in Besitz nehmen
  alternative: Dein Same wird die Städte seiner Feinde erben
  rationale: Das kollektive Singularwort wird im Deutschen natürlich pluralisch wiedergegeben; »in Besitz nehmen« bewahrt den Erb- und Besitzgedanken, ohne eine bestimmte spätere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Schwurformel bleibt erhalten; die emphatischen semitischen Verbverdopplungen werden durch »überreich« und »überaus« natürlich und hörbar nachgebildet.
