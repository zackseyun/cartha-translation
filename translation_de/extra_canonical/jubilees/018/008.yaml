  yaml_path: translation/extra_canonical/jubilees/018/008.yaml
  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: de
  text: Und er baute den Altar und legte das Holz auf den Altar. Dann band er seinen Sohn Isaak und legte ihn auf das Holz oben auf dem Altar. Und er streckte seine Hand aus, um das Messer zu nehmen und seinen Sohn Isaak zu schlachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: Altar
  rationale: Das Wort bezeichnet hier den errichteten Opferaltar; »Altar« ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: ዕፀወ / ዕፀው
  choice: Holz
  rationale: Der kollektive Singular »Holz« gibt das für das Opfer aufgeschichtete Brennholz im Deutschen idiomatisch wieder.
- source_word: አሰረ
  choice: band
  rationale: Die konkrete Handlung des Fesselns beziehungsweise Bindens Isaaks wird ohne zusätzliche Deutung wiedergegeben.
- source_word: መጥባሕተ
  choice: Messer
  rationale: Im Kontext des Opfers bezeichnet der Ausdruck das zum Schlachten bestimmte Messer; die schlichte Wiedergabe bewahrt den Erzählton.
- source_word: ይዝብሖ
  choice: zu schlachten
  rationale: Das Verb meint rituelles beziehungsweise tatsächliches Schlachten und ist präziser als das allgemeinere »töten« oder das interpretierende »opfern«.
theological_decisions:
- issue: Zweck von Abrahams Griff nach dem Messer
  choice: »um … zu nehmen und … zu schlachten«
  alternative: »und wollte … nehmen, um … zu opfern«
  rationale: Die Übersetzung bewahrt die ausdrücklich geschilderte Absicht und verwendet das konkrete Verb »schlachten«, ohne sie durch den theologisch weiter gefassten Begriff »opfern« abzuschwächen oder auszudeuten.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Satzgliederung. Die wiederholte Bezeichnung »seinen Sohn Isaak« bleibt entsprechend der Vorlage erhalten und unterstreicht die Spannung der Szene.
