- from: 'Und ich stand vor ihm und vor dem Fürsten Mastema. Da sagte der HERR: »Sag ihm, er soll seine Hand nicht gegen den Jungen ausstrecken und ihm nichts antun; denn nun weiß ich, dass er Gott fürchtet.«'
  to: 'Und ich stand vor ihm und vor dem Engel Mastema. Da sagte der HERR: »Sag ihm, er soll seine Hand nicht an den Jungen legen und ihm nichts antun; denn nun weiß ich, dass er Gott fürchtet.«'
  rationale: Der Titel Mastemas wird entsprechend dem geʽezischen Text als „Engel“ wiedergegeben. Die Handlungsformel wurde zu einer im Deutschen natürlichen und quellennahen Wendung angepasst. Die zeitliche Zuspitzung von „nun weiß ich“ sowie die offene Aussage der Gottesfurcht bleiben unverändert erhalten.
