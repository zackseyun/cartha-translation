  yaml_path: translation/extra_canonical/jubilees/018/009.yaml
  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: de
  text: 'Und ich stand vor ihm und vor dem Engel Mastema. Da sagte der HERR: »Sag ihm, er soll seine Hand nicht an den Jungen legen und ihm nichts antun; denn nun weiß ich, dass er Gott fürchtet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእክት፡ መስተማ
  choice: Fürsten Mastema
  rationale: Die überlieferte Wortfolge wird entsprechend dem textkritisch und kontextuell gestützten Titel »Fürst Mastema« wiedergegeben; der Eigenname bleibt erhalten.
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: er soll seine Hand nicht gegen den Jungen ausstrecken
  rationale: Die Handlungsformel bezeichnet hier einen gewaltsamen Zugriff. »Die Hand ausstrecken gegen« ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: ወኢይግበር፡ ምዝገኒ፡ ላዕሌሁ
  choice: und ihm nichts antun
  rationale: Gibt das Verbot jeder schädigenden Handlung knapp und idiomatisch wieder.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: dass er Gott fürchtet
  rationale: Bewahrt die traditionelle und theologisch offene Rede von Gottesfurcht, ohne sie interpretierend als bloße Ehrfurcht oder Frömmigkeit aufzulösen.
theological_decisions:
- issue: Gottes neu erlangtes Wissen
  choice: denn nun weiß ich
  alternative: denn nun habe ich erkannt
  rationale: Die zeitliche Zuspitzung »nun« und die Aussage des Wissens werden ohne harmonisierende Erklärung bewahrt; die Spannung zu Vorstellungen göttlichen Vorwissens bleibt bestehen.
- issue: Bezugsfigur des Gottesfürchtigen
  choice: dass er Gott fürchtet
  alternative: dass er ein Gottesfürchtiger ist
  rationale: Die verbale Form klingt im modernen Deutsch natürlicher und vermeidet, aus der Aussage eine feste religiöse Gruppenbezeichnung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; »der HERR« folgt der üblichen Wiedergabe des Gottesnamens beziehungsweise Gottestitels. Keine Fußnoten erforderlich.
