  yaml_path: translation/extra_canonical/jubilees/018/006.yaml
  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: de
  text: 'Und Isaak sagte zu seinem Vater: »Vater!« Er antwortete: »Hier bin ich, mein Sohn.« Da sagte er zu ihm: »Sieh: das Feuer, das Messer und das Holz – aber wo ist das Schaf für das Brandopfer, Vater?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነየ፡ አነ
  choice: Hier bin ich
  rationale: Die äthiopische Antwortformel bedeutet wörtlich etwa »Siehe, ich« und wird im Deutschen idiomatisch und würdig mit »Hier bin ich« wiedergegeben.
- source_word: መጥባሕት
  choice: Messer
  rationale: Das Wort bezeichnet hier das zum Schlachten bestimmte Schneidewerkzeug; »Messer« ist im Kontext natürlich und präzise.
- source_word: በግዕ
  choice: Schaf
  rationale: Der äthiopische Ausdruck bezeichnet ein Schaf beziehungsweise ein Tier aus der Schafgattung. Das Geschlecht wird nicht näher festgelegt, daher wird die allgemeinere Wiedergabe »Schaf« gewählt.
- source_word: ጽንሓሕ
  choice: Brandopfer
  rationale: Der kultische Ausdruck bezeichnet das vollständig verbrannte Opfer; »Brandopfer« ist die etablierte, verständliche deutsche Entsprechung.
theological_decisions:
- issue: Art des Opfertiers
  choice: Schaf
  alternative: Lamm oder Widder
  rationale: Der Ausgangstext legt Alter und Geschlecht des Tieres nicht eindeutig fest. »Schaf« bewahrt diese Offenheit, statt sie theologisch oder erzählerisch zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die wiederholte Anrede »Vater« bleibt erhalten; der Doppelpunkt nach »Sieh« bewahrt den aufzählenden, beobachtenden Charakter der Frage.
