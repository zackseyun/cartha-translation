  source_fidelity: Die Übersetzung gibt die Abfolge sowie die Amtsbezeichnungen im Wesentlichen quellentreu wieder. ወሐብበይዎ bezeichnet hinterlistiges bzw. treuloses Handeln gegen Josef, nicht einfach Hass. Die Formulierung „Diese brachten“ legt jedoch entgegen dem nicht näher spezifizierten Plural des Textes die ismaelitischen Händler als Subjekt der folgenden Handlungen fest.
  naturalness: „Treulos an ihm handeln“ ist im heutigen Standarddeutsch weniger idiomatisch; „treulos gegen ihn handeln“ ist klarer und bewahrt den Sinn. Der anschließende Gedankengang klingt ohne das demonstrative „Diese“ natürlicher und bleibt syntaktisch näher an der Vorlage.
  terminology: „Sichem“, „Dotan“, „Potifar“, „Ismaeliten“ und „Heliopolis“ sind angemessene deutsche Formen. „Oberster der Wache“ gibt ሊቀ ዐቀብት zutreffend wieder und darf nicht zu „Oberster der Köche“ verändert werden. Die Fußnote sollte die Wiedergabe als ungefähre wörtliche Bedeutung kennzeichnen, da „Wache“ im Deutschen eine Kollektivbezeichnung ist.
  issues:
  - severity: medium
    issue: „Diese brachten ihn …“ bestimmt die Händler als Subjekt.
    rationale: Der geʿezische Text führt lediglich einen pluralischen Handlungsträger fort. Das Demonstrativpronomen bezieht sich im Deutschen eindeutig auf die unmittelbar zuvor genannten Händler und engt die Vorlage daher unnötig ein.
  - severity: low
    issue: „Sie handelten treulos an ihm“ ist unidiomatisch.
    rationale: Die Verbindung „treulos gegen jemandem handeln“ ist modernes, natürliches Deutsch und gibt die gegen Josef gerichtete Hinterlist präziser wieder.
  - severity: low
    issue: Die Fußnote bezeichnet „Oberster der Wächter“ als strikt wörtlich.
    rationale: Die geʿezische Wendung meint den Anführer der Wächter; die deutsche Kollektivform „Oberster der Wache“ ist idiomatischer. „Etwa wörtlich“ ist deshalb genauer.
