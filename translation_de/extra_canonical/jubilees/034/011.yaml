base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: de
  text: Sichem – und er fand sie im Land Dotan. Sie handelten treulos gegen ihn und fassten den Plan, ihn zu töten. Doch dann änderten sie ihren Entschluss und verkauften ihn an ismaelitische Händler. Sie brachten ihn nach Ägypten hinab und verkauften ihn an Potifar, einen Hofbeamten des Pharaos, den Obersten der Wache[a] und Priester der Stadt Heliopolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Etwa wörtlich: „Oberster der Wächter“. Die hier stehende äthiopische Amtsbezeichnung lautet nicht „Oberster der Köche“, wie die entsprechende Bezeichnung in manchen Überlieferungen von 1. Mose wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐብበይዎ
  choice: Sie handelten treulos an ihm
  rationale: Das Verb bezeichnet treuloses, hinterlistiges Handeln; „sie hassten ihn“ wäre lexikalisch weniger genau.
- source_word: ወተመይጦሙ
  choice: Doch dann änderten sie ihren Entschluss
  rationale: Gibt den Sinn des Sich-Umentscheidens natürlich wieder, ohne ein ausdrücklich genanntes Motiv hinzuzufügen.
- source_word: ለነጋዲተ እስማዒላዊያን
  choice: an ismaelitische Händler
  rationale: Entspricht der Händlerbezeichnung und der ethnischen Zuordnung im äthiopischen Text.
- source_word: ሐፀወ ፈርዖን
  choice: einen Hofbeamten des Pharaos
  rationale: Die Amtsbezeichnung kann auch einen Eunuchen bezeichnen; im Kontext ist die allgemeinere Funktionsbezeichnung angemessen und vermeidet eine unnötige Festlegung.
- source_word: ሊቀ ዐቀብት
  choice: den Obersten der Wache
  rationale: Die Wörter bedeuten wörtlich den Obersten beziehungsweise Anführer der Wächter und nicht den Obersten der Köche.
- source_word: ሣውዕ ዘሀገረ ኤሌው
  choice: Priester der Stadt Heliopolis
  rationale: Die geographische Bezeichnung wird mit dem geläufigen deutschen Namen Heliopolis wiedergegeben.
theological_decisions:
- issue: Potifars mehrere Amts- und Standesbezeichnungen
  choice: Alle Titel werden als Appositionen auf Potifar bezogen.
  alternative: Einzelne Titel könnten auf verschiedene Personen oder Ämter verteilt gelesen werden.
  rationale: Die unmittelbare Syntax stellt die Bezeichnungen nacheinander zu Potifar; die Übersetzung bewahrt diese Reihung, ohne daraus eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der mit „Sichem“ einsetzende Satzanschluss des überlieferten Versabschnitts bleibt durch den Gedankenstrich erkennbar. „Dotan“, „Potifar“ und „Heliopolis“ folgen geläufigen deutschen Namensformen.
