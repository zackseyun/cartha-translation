revisions:
- from: Sichem – und er fand sie im Land Dotan. Sie handelten treulos an ihm und fassten den Plan, ihn zu töten. Doch dann änderten sie ihren Entschluss und verkauften ihn an ismaelitische Händler. Diese brachten ihn nach Ägypten hinab und verkauften ihn an Potifar, einen Hofbeamten des Pharaos, den Obersten der Wache[a] und Priester der Stadt Heliopolis.
  to: Sichem – und er fand sie im Land Dotan. Sie handelten treulos gegen ihn und fassten den Plan, ihn zu töten. Doch dann änderten sie ihren Entschluss und verkauften ihn an ismaelitische Händler. Sie brachten ihn nach Ägypten hinab und verkauften ihn an Potifar, einen Hofbeamten des Pharaos, den Obersten der Wache[a] und Priester der Stadt Heliopolis.
  rationale: Die Revision beseitigt eine deutsche Subjektfestlegung, die der Quelle nicht ausdrücklich zu entnehmen ist, und verbessert die idiomatische Wiedergabe des treulosen Handelns. Die Abfolge, die Mehrdeutigkeit des handelnden Plurals sowie sämtliche Amtsbezeichnungen bleiben erhalten.
