lexical_decisions:
- source_word: ወተጋብኡ
  choice: Und … versammelten sich
  rationale: Das Verb bezeichnet das Zusammenkommen bzw. Sichversammeln; die reflexive deutsche Form ist hier idiomatisch.
- source_word: ሱባዔቲሆሙ
  choice: die sieben
  rationale: Die Form bezeichnet ihre Siebenzahl und bestimmt hier die Könige näher.
- source_word: ነገሥተ፡ አሞሬዎን
  choice: Könige der Amoriter
  rationale: Direkte und im Deutschen geläufige Wiedergabe der Volkszugehörigkeit.
- source_word: ኀብኢኦሙ
  choice: aus dem Hinterhalt
  rationale: Die Form vermittelt verborgenes bzw. heimliches Vorgehen. Im Zusammenhang mit einem geplanten Töten gibt „aus dem Hinterhalt“ den konkreten Sinn natürlich wieder, ohne lediglich die Absicht als geheim zu bezeichnen.
