revisions:
- from: Und im sechsten Jahr dieser Jahrwoche, im vierundvierzigsten Jubiläum, sandte Jakob seine Söhne aus, ihre Schafe zu weiden; auch ihre Knechte[a] gingen mit ihnen auf das Weideland von Sichem.
  to: Und im sechsten Jahr dieser Jahrwoche, im vierundvierzigsten Jubiläum, sandte Jakob seine Söhne aus, um ihre Schafe zu weiden, und auch ihre Diener mit ihnen auf die Weide von Sichem.
  rationale: 'Die Satzstruktur wurde enger an die Ausgangssprache angelehnt: Jakob sendet sowohl die Söhne als auch deren Diener aus; die Diener begleiten die Söhne. „Diener“ vermeidet eine unnötig archaische oder sozial spezifizierende Deutung. Die Datierung und die singuläre Weide bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:03Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Chronologie, Jakobs Aussendung, die pluralische Zuordnung der Diener zu den Söhnen und die einzelne Weide bei Sichem im Wesentlichen richtig wieder. Die semikolongetrennte Formulierung „auch ihre Knechte gingen“ macht jedoch aus dem im Ausgangstext von „sandte“ abhängigen Begleitobjekt einen eigenen finiten Vorgang. Die Revision lässt das Senden auch für die Diener gelten und wahrt zugleich ihre Begleitung der Söhne.
  naturalness: „Jahrwoche“ ist im Kontext des Jubiläenbuches klar und gut verständlich. „Diener“ ist im modernen Standarddeutsch die neutralere und natürlichere Wiedergabe als das stärker archaische und sozial enger festgelegte „Knechte“.
  terminology: Jakob und Sichem sind korrekt. „Diener“ gibt den geezischen Ausdruck ohne unnötige soziale oder rechtliche Präzisierung wieder. Die Fußnote ist entbehrlich, weil „Diener“ keine abweichende, sondern die unmittelbare Übersetzung ist.
  issues:
  - severity: medium
    issue: Syntaktische Abtrennung der Diener vom Verb „sandte“
    rationale: Der geezische Satz verbindet die Söhne und ihre Diener als von Jakob Ausgesandte; die Diener sind zusätzlich „mit ihnen“. Die Fassung „auch ihre Knechte gingen“ verschiebt dies zu einem selbständigen Vorgang.
  - severity: low
    issue: „Knechte“ mit erläuternder Fußnote
    rationale: „Knechte“ ist möglich, aber im modernen Standarddeutsch stärker archaisch und semantisch enger. Die Fußnote bezeichnet „Diener“ zudem als bloß mögliche Alternative, obwohl es die unmarkierte direkte Wiedergabe ist.
  revised_text: Und im sechsten Jahr dieser Jahrwoche, im vierundvierzigsten Jubiläum, sandte Jakob seine Söhne aus, um ihre Schafe zu weiden, und auch ihre Diener mit ihnen auf die Weide von Sichem.
