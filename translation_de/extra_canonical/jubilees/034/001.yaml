  yaml_path: translation/extra_canonical/jubilees/034/001.yaml
  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: de
  text: Und im sechsten Jahr dieser Jahrwoche, im vierundvierzigsten Jubiläum, sandte Jakob seine Söhne aus, um ihre Schafe zu weiden, und auch ihre Diener mit ihnen auf die Weide von Sichem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet im chronologischen System des Jubiläenbuches eine Siebenerperiode von Jahren; „Jahrwoche“ macht dies für heutige Leser knapp und eindeutig sichtbar.
- source_word: ይርዐዩ
  choice: zu weiden
  rationale: Der geezische Verbkontext mit den Schafen bezeichnet das Hüten beziehungsweise Weidenlassen der Herde.
- source_word: አግብርቲሆሙኒ
  choice: auch ihre Knechte
  rationale: Das Possessivsuffix ist Plural („ihre“), und die Partikel entspricht „auch“; „Knechte“ gibt abhängige männliche Arbeitskräfte in einem würdigen, bibelnahen Register wieder.
- source_word: ውስተ፡ ጸአተ፡ ሴቄም
  choice: auf das Weideland von Sichem
  rationale: Die singuläre Ortsangabe wird natürlich als Weidegebiet bei beziehungsweise von Sichem wiedergegeben; die Bewegungsrichtung passt zu den ausgesandten Söhnen und Knechten.
theological_decisions:
- issue: Zuordnung der Knechte
  choice: ihre Knechte
  alternative: seine Knechte
  rationale: Das geezische Possessivsuffix der dritten Person Plural bezieht die Knechte auf die Söhne; eine Angleichung an Jakob wäre grammatisch nicht begründet.
- issue: Chronologische Bezeichnung
  choice: im vierundvierzigsten Jubiläum
  alternative: in diesem vierundvierzigsten Jubiläum
  rationale: Das Demonstrativum ist im Deutschen in dieser Datierungsform entbehrlich; die Zählung und der chronologische Sinn bleiben vollständig erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem bibelnahen Ton. Die ungewöhnliche Chronologie wird durch „Jahrwoche“ verständlich gemacht; der Satzbau bleibt flüssig und folgt der Handlungsabfolge des Ausgangstextes.
