  text: And the sons of Jacob slaughtered a kid of the goats and dipped Joseph’s garment in the blood, and sent it to Jacob their father on the tenth of the seventh month.
translation:
  language: de
  text: Und die zwölf Söhne Jakobs schlachteten einen Ziegenbock, tauchten Josefs Gewand in das Blut und schickten es ihrem Vater Jakob am zehnten Tag des siebten Monats.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘብሑ
  choice: schlachteten
  rationale: Gibt das Töten eines Tieres im gegebenen Erzählzusammenhang präzise und natürlich wieder.
- source_word: ዳቤላ ጠሊ
  choice: einen Ziegenbock
  rationale: Bezeichnet hier ein männliches Tier der Ziegen; die knappe deutsche Wiedergabe ist verständlich und sachlich.
- source_word: ጸንቀቀ
  choice: tauchten … in
  rationale: Der Kontext und die überlieferte lexikalische Beurteilung sprechen für ein Eintauchen, nicht bloß für ein Beflecken; zugleich bleibt die Verbindung zur Josefserzählung erhalten.
- source_word: ልብሱ ለዮሴፍ
  choice: Josefs Gewand
  rationale: Natürliche deutsche Genitivkonstruktion für das Kleidungsstück Josefs.
- source_word: አመ ዐሡሩ ለወርኀ ሳብዕ
  choice: am zehnten Tag des siebten Monats
  rationale: Gibt die Datumsangabe der Quelle klar und idiomatisch wieder.
