- source_word: በወርኀ፡ አሐዱ
  choice: innerhalb eines Monats
  rationale: Gibt den zeitlichen Rahmen idiomatisch wieder, ohne eine Gleichzeitigkeit an einem einzelnen Tag anzudeuten.
- source_word: አንጻረ፡ መቃብረ፡ ራሔል
  choice: gegenüber dem Grab Rahels
  rationale: Bewahrt die räumliche Verhältnisangabe des geezischen Textes.
- source_word: ዳናሃኒ፡ ወለተ
  choice: auch Dina, seine Tochter
  rationale: Das Possessivverhältnis bezieht sich auf Israel/Jakob; die Apposition wird im modernen Deutschen klar gesetzt.
