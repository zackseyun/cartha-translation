  text: And these three mournings came upon Israel in one month. And they buried Bilhah opposite Rachel's tomb, and they buried Dinah, his daughter, there.
translation:
  language: de
  text: Und diese drei Trauerfälle trafen Israel in einem Monat. Sie begruben Bilha gegenüber dem Grab Rahels, und Dina, seine Tochter, begruben sie dort.
  philosophy: optimal-equivalence
lexical_decisions:
