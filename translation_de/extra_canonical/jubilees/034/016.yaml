    9. *ርቤአሃ፡ ወትምናታሬስሃ።" ወተመይጠ፡ በሰላም፡ ወገብረ፡ ምስሌሆሙ፡ ሰላመ፡ ወኮንዎ፡

    10. አግብርተ፡ እስከ፡ አመ፡ ዕለተ፡ ወረዱ፡ ውእቱ፡ ወውሉዱ፡ ውስተ፡" ግብጽ። ወበሳብዕ፡ ዓመት፡ ዘዝ፡ ሱባዔ፡ ፈነወ፡" ዮሴፍሃ፡ ከመ፡ ያእምር፡ ሰላሞሙ፡ ለአኀዊሁ፡ እምቤቱ፡ ውስተ፡ ምድረ፡"

