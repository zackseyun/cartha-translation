  text: under the trees, and to seize their cattle. But Jacob, and Levi, and Judah, and Joseph were in the house with Isaac their father, because his spirit was grieved and they could not leave him.
translation:
  language: de
  text: unter den Bäumen und um ihr Vieh an sich zu bringen. Jakob, Levi, Juda und Josef aber waren mit Isaak, ihrem Vater, im Haus, weil sein Geist betrübt war und sie ihn nicht verlassen konnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕተ፡ አም
  choice: unter den Bäumen
  rationale: Gibt die am Versanfang stehende Ortsangabe knapp wieder; der Text setzt hier mitten im Satz ein.
- source_word: ይማህርኩ፡ እንስሳሆሙ
  choice: um ihr Vieh an sich zu bringen
  rationale: Bewahrt den zielgerichteten Sinn des Ergreifens beziehungsweise Inbesitznehmens des Viehs, ohne unnötig eine bestimmte Art der Wegnahme festzulegen.
- source_word: ኖንዝና፡ መንፈሱ
  choice: sein Geist war bekümmert
  rationale: Gibt die innere Betrübnis würdevoll und verständlich wieder und erhält zugleich das ausdrücklich genannte »Geist«.
- source_word: ስእኑ፡ ኀዲጎተ
  choice: sie konnten ihn nicht verlassen
  rationale: Entspricht der Aussage des Unvermögens und vermeidet den im Ausgangstext nicht ausdrücklich enthaltenen Zusatz »allein«.
theological_decisions:
- issue: Bezeichnung von Isaaks innerem Zustand
  choice: sein Geist war bekümmert
  alternative: er war bekümmert
  rationale: Die ausdrückliche Rede von seinem Geist bleibt erhalten, ohne den Ausdruck psychologisch oder theologisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Namen werden entsprechend der geezischen Aufzählung beibehalten; »aber« markiert natürlich den Gegensatz. Der fragmentarische Versanfang bleibt als Satzfortsetzung kleingeschrieben.
