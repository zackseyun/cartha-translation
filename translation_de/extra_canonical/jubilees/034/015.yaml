  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: de
  text: Und an jenem Tag hörte Bilha, dass Josef umgekommen war. Während sie um ihn trauerte, starb sie in Qafratef[a]. Auch Dina, seine Tochter, starb, nachdem Josef umgekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Vokalisierung des Ortsnamens „Qafratef“ ist unsicher; möglicherweise ist der Name in der äthiopischen Überlieferung entstellt worden.
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕለ
  choice: umgekommen war
  rationale: Das Verb bezeichnet hier, dass Josef als verloren beziehungsweise tot galt. „Umgekommen“ bewahrt diesen Bedeutungsraum, ohne die Erzählung vorwegzunehmen, nach der Josef tatsächlich noch lebte.
- source_word: ትለሐዎ
  choice: sie um ihn trauerte
  rationale: Die Form beschreibt Bilhas anhaltende Trauer um Josef; die temporale Verbindung mit ihrem Tod wird im Deutschen natürlich als Nebensatz wiedergegeben.
- source_word: ቀፍራቲፍ
  choice: Qafratef
  rationale: Der unsichere Ortsname wird transliteriert und nicht durch eine spekulative Identifizierung ersetzt.
theological_decisions:
- issue: Josefs vermeintlicher Tod
  choice: „dass Josef umgekommen war“
  alternative: „dass Josef verschwunden war“
  rationale: Der Kontext schildert die Nachricht als Todesnachricht, obwohl Josef tatsächlich lebt. Die Formulierung gibt Bilhas Wissensstand wieder und behauptet nicht aus Erzählerperspektive einen tatsächlichen Tod.
- issue: Bezug von „seine Tochter“
  choice: Die Formulierung „seine Tochter“ bleibt erhalten.
  alternative: „Jakobs Tochter“
  rationale: Das Possessivpronomen des Ausgangstextes wird bewahrt. Im weiteren Kontext ist Jakob der naheliegende Bezug, doch eine ausdrückliche Auflösung würde die grammatische Form vereindeutigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für gute Verständlichkeit gegliedert; die inhaltliche Wiederholung von Josefs vermeintlichem Tod und das nicht ausdrücklich aufgelöste Pronomen wurden beibehalten.
