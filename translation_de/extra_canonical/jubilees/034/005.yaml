lexical_decisions:
- source_word: አም፡ ምድረ፡ ከናዓን
  choice: aus dem Land Kanaan
  rationale: አም ist hier als typografischer Fehler für እም („aus/von“) zu verstehen; die Wendung setzt den Satz aus dem vorigen Vers fort.
- source_word: ወዜነዉዎ፡ ለያዕቆብ
  choice: Und sie berichteten Jakob
  rationale: ዜነወ bezeichnet das Mitteilen oder Berichten; das deutsche Verb gibt den erzählerischen Zusammenhang natürlich wieder.
- source_word: እንዘ፡ ይብሉ
  choice: '[in direkter Rede wiedergegeben]'
  rationale: Wörtlich etwa „indem sie sagten“. Im Deutschen genügt nach „berichteten“ die direkte Rede, ohne die redundante Einleitungsformel nachzuahmen.
- source_word: ናሁ
  choice: Siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden, feierlichen Charakter des ge'ezischen Ausdrucks.
- source_word: ነገሥተ፡ አሞሬዎን
  choice: die Könige der Amoriter
  rationale: Formale und im biblischen Deutsch geläufige Wiedergabe der Pluralverbindung.
