  text: six thousand men who carried weapons. And he killed them in the descent of Shechem, and pursued those who fled, and killed them with the edge of the sword, and he killed Ares and Taphu and Seragan.
translation:
  language: de
  text: sechstausend Männer, die Waffen trugen. Er tötete sie am Abstieg von Sichem[a], verfolgte die Flüchtenden und erschlug sie mit der Schärfe des Schwertes. Auch Ares, Tafu und Seragan tötete er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „am Ausgang von Sichem“; gemeint ist hier wahrscheinlich der Abstieg bei der Stadt.'
    reason: Bewahrt die lexikalische Grundbedeutung von ጸአተ und macht die topografische Deutung transparent.
lexical_decisions:
- source_word: እለ፡ ይጸውሩ፡ አበይፍተ
  choice: die Waffen trugen
  rationale: Gibt die attributive Wendung unmittelbar und idiomatisch wieder, ohne die Art der Waffen enger festzulegen als der Text.
- source_word: ጸአተ፡ ዘሴቄም
  choice: am Abstieg von Sichem
  rationale: ጸአተ bezeichnet wörtlich ein Hinausgehen bzw. einen Ausgang und hier topografisch den Abstieg bei Sichem; „Ebene“ wäre lexikalisch nicht hinreichend begründet.
- source_word: በአፈ፡ ሰይፍ
  choice: mit der Schärfe des Schwertes
  rationale: Die wörtliche Metapher „mit dem Mund des Schwertes“ wird durch die geläufige deutsche biblische Entsprechung wiedergegeben.
- source_word: አሬስ፡ … ታፉ፡ … ሴሬጋን
  choice: Ares, Tafu und Seragan
  rationale: Die Eigennamen werden eng nach der überlieferten ge'ezischen Form transkribiert.
