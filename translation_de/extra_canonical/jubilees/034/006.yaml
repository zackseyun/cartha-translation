  text: have surrounded your sons, and their flocks have been seized.” And he rose up from his house, he and his three sons, and all his father’s servants, and the servants of his house, and he went against them with six thousand men.
translation:
  language: de
  text: »Sie haben deine Söhne umzingelt und ihre Herden geraubt.« Da brach er aus seinem Haus auf, zusammen mit seinen drei Söhnen, allen Dienern seines Vaters und den Dienern seines eigenen Hauses, und zog ihnen mit sechstausend Mann entgegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐገትዎሙ
  choice: Sie haben … umzingelt
  rationale: Das Verb bezeichnet ein Umringen oder Einschließen; „umzingelt“ gibt die feindliche Handlung im Kontext natürlich und präzise wieder.
- source_word: መራዕዮሙሂ ተማህጠኑ
  choice: ihre Herden geraubt
  rationale: Die Formulierung besagt, dass auch ihre Herden gewaltsam fortgenommen beziehungsweise geplündert wurden. „Geraubt“ wahrt diesen Nachdruck.
- source_word: ደቂ አቡሁ ወደቂ ቤቱ
  choice: Dienern seines Vaters und den Dienern seines eigenen Hauses
  rationale: In diesem Haushalts- und Gefolgschaftskontext bezeichnet ደቂ die Angehörigen beziehungsweise Diener zweier verschiedener Gruppen. Die Übersetzung hält die Diener des Vaters und die des eigenen Hauses ausdrücklich auseinander.
- source_word: በስሳ [ምእት]
  choice: mit sechstausend Mann
  rationale: Die überlieferte Zahlenangabe ist als sechzig Hundert, also sechstausend, zu verstehen; „Mann“ bezeichnet hier die aufgebotene Streitmacht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Da brach er … auf“ bildet den entschlossenen Aufbruch idiomatisch ab; „zog ihnen … entgegen“ bewahrt die feindliche Stoßrichtung, ohne zusätzliche militärische Einzelheiten einzutragen.
