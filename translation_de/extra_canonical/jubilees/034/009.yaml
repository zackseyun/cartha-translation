  text: Robel and Tamnatares. And he returned in peace and made peace with them, and they became his
translation:
  language: de
  text: Robel und Tamnatares. Dann kehrte er in Frieden zurück, schloss Frieden mit ihnen, und sie wurden ihm zu eigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und sie wurden ihm«; welche Art von Zugehörigkeit gemeint ist, bleibt offen.'
    reason: Das ge’ezische Verb trägt ein Objektsuffix („ihm“), lässt die genaue Beziehung jedoch unausgesprochen.
lexical_decisions:
- source_word: ተመይጠ
  choice: kehrte … zurück
  rationale: Gibt die Rückkehrbewegung des ge’ezischen Verbs natürlich und genau wieder.
- source_word: ገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: schloss Frieden mit ihnen
  rationale: Die feste deutsche Wendung entspricht wörtlich dem ge’ezischen Ausdruck „machte mit ihnen Frieden“.
- source_word: ወኮንዎ
  choice: und sie wurden ihm zu eigen
  rationale: Bewahrt sowohl den ingressiven Sinn „sie wurden“ als auch das maskuline Singular-Objektsuffix „ihm“. Die elliptische Zugehörigkeitsbeziehung wird nicht als eine bestimmte soziale Stellung wie Knechtschaft oder Tributpflicht festgelegt.
theological_decisions:
- issue: Art der entstandenen Zugehörigkeit
  choice: ihm zu eigen
  alternative: seine Diener / seine Untertanen
  rationale: Der Ausgangstext nennt keine konkrete Funktion oder Rechtsstellung. Die Übersetzung wahrt diese Unbestimmtheit, statt eine mögliche historische Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Eigennamen folgen der überlieferten Form. Der elliptische Schluss des ge’ezischen Textes wird verständlich formuliert, ohne die nicht genannte Art der Zugehörigkeit zu bestimmen.
