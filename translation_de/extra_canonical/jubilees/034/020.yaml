base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: de
  text: Als Josef abhandengekommen war, nahmen sich die Söhne Jakobs Frauen. Rubens Frau hieß Ada, und Simeons Frau hieß Adiba, eine Kanaaniterin. Levis Frau hieß Melka; sie stammte von den Töchtern Arams ab, aus der Nachkommenschaft der Söhne Terachs. Judas Frau hieß Betesuel, eine Kanaaniterin. Issachars Frau hieß Hizeqa, Sebulons Frau Niʾaman, Dans Frau Egla und Naftalis Frau Resuʾa, die aus Mesopotamien stammte. Gads Frau hieß Maka, Aschers Frau Ijona und Josefs Frau Asenat, eine Ägypterin. Benjamins Frau hieß Iyasaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte äthiopische Textabschrift bricht nach „und der Name …“ ab. Der Name von Benjamins Frau, Iyasaka, ist nach der vollständigeren überlieferten Versfassung ergänzt.
    reason: Transparenz über die materielle Lücke im bereitgestellten Originalsprachauszug und die Grundlage der Ergänzung.
lexical_decisions:
- source_word: ተሐጕለ ዮሴፍ
  choice: Josef verschwunden war
  rationale: Das äthiopische Verb bezeichnet ein Verlorengehen oder Verschwinden. „Verschwunden“ gibt dies im Zusammenhang von Josefs Abwesenheit natürlich wieder, ohne ausdrücklich festzulegen, ob er entführt, tot oder lediglich unauffindbar war.
- source_word: ነሥኡ … አንስትያ
  choice: nahmen sich … Frauen
  rationale: Die idiomatische Wendung bedeutet, Frauen zu Ehefrauen zu nehmen. Die gewählte Form bleibt dem Ausdruck des Ausgangstextes nahe und ist im Deutschen verständlich.
- source_word: እምዘርአ፡ ውሉደ፡ ታራን
  choice: aus der Nachkommenschaft der Söhne Terachs
  rationale: „Nachkommenschaft“ gibt den genealogischen Ausdruck „Same“ in heutigem, würdigem Deutsch wieder; Terach ist die im Deutschen geläufige biblische Namensform.
- source_word: ከናዊት / ከነናዊት
  choice: eine Kanaaniterin
  rationale: Die feminine Herkunftsbezeichnung wird als „Kanaaniterin“ wiedergegeben.
- source_word: እንተ፡ ሜስጶጦምያ
  choice: die aus Mesopotamien stammte
  rationale: Die Herkunftsangabe wird als natürlicher deutscher Relativsatz formuliert.
- source_word: አስኔት፡ ግብጻዊት
  choice: Asenat, eine Ägypterin
  rationale: Asenat ist die geläufige deutsche Form des Namens; die indefinite Herkunftsbezeichnung entspricht dem äthiopischen Text.
theological_decisions:
- issue: Bedeutung von Josefs Abwesenheit
  choice: „verschwunden war“
  alternative: „weggenommen worden war“ oder „verloren gegangen war“
  rationale: Der Text bezeichnet Josef als abhandengekommen, erklärt an dieser Stelle aber weder genauer die Ursache noch seinen vermeintlichen Zustand. „Verschwunden“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die lange Namensliste ist durch maßvolle Satzteilung lesbarer gemacht worden. Geläufige deutsche Formen der biblischen Männernamen werden verwendet; weniger bekannte Frauennamen werden quellennah transliteriert.
