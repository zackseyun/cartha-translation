  text: und Selo, Amanisker und Gagaas. Er gewann seinen Besitz zurück und setzte sich gegen sie durch. Er legte ihnen Tribut auf, sodass sie ihm als Tribut ein Fünftel des Ertrags ihres Landes gaben. Und er baute[a]
