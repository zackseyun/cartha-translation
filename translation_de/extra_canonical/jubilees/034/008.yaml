lexical_decisions:
- source_word: መራዕይሁ
  choice: seine Herden
  rationale: Das Substantiv bezeichnet am natürlichsten Weidevieh beziehungsweise Herden. Die breitere Wiedergabe „Besitz“ ist möglich, verwischt aber den konkreten pastoralen Sinn.
- source_word: ወአስተጋብአ
  choice: Er brachte … wieder zusammen
  rationale: Die Kausativ-/Rekursivform drückt hier das erneute Zusammenbringen oder Sammeln aus und passt sachlich zu „seine Herden“.
- source_word: ወዐብየ፡ ላዕሌሆሙ
  choice: und gewann die Oberhand über sie
  rationale: Die wörtliche Vorstellung „wurde groß über ihnen“ wird idiomatisch als Erlangung der Vorherrschaft wiedergegeben, ohne mehr militärische Einzelheiten einzutragen.
- source_word: ፀባሕተ
  choice: Tribut
  rationale: Der Kontext einer auferlegten regelmäßigen Abgabe stützt „Tribut“.
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: ein Fünftel vom Ertrag ihres Landes
  rationale: Gibt den Anteil und die landwirtschaftlichen Erzeugnisse klar und natürlich wieder.
- source_word: ወሐነጸ
  choice: Und er baute
  rationale: Das Verb bedeutet „bauen/errichten“; der unvollständige Satz wird beibehalten, weil die genannten Bauorte erst im anschließenden Text folgen.
