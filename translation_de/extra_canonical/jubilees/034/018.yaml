base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: de
  text: Darum wurde für die Söhne Israels festgesetzt, dass sie sich am zehnten Tag des siebten Monats selbst demütigen sollen[a] – an dem Tag, an dem die Nachricht über Josef seinen Vater Jakob erreichte – und dass sie an diesem Tag mit einem Zicklein für sich Sühne erwirken sollen, Jahr für Jahr am zehnten Tag des siebten Monats wegen ihrer Sünden. Denn sie hatten die Liebe ihres Vaters zu seinem Sohn Josef betrübt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Kapitel verbindet die jährliche Selbstdemütigung am zehnten Tag des siebten Monats mit Josefs blutbeflecktem Gewand und Jakobs Trauer. Damit erklärt es die jährliche Begehung des Versöhnungstags (Jom Kippur).
    reason: cross_reference
lexical_decisions:
- source_word: ይሕመሙ
  choice: sich selbst demütigen
  rationale: Das Verb bezeichnet wörtlich ein Leiden oder Sich-Kasteien. Im kultischen Zusammenhang des zehnten Tages des siebten Monats gibt „sich selbst demütigen“ die rituelle Selbsterniedrigung natürlich wieder, ohne eine bestimmte Form wie Fasten ausdrücklich einzutragen.
- source_word: ያስተስርዩ
  choice: Sühne erwirken
  rationale: Die Kausativform bezeichnet das Bewirken von Sühne beziehungsweise Entsühnung. „Sühne erwirken“ erhält den kultischen Sinn und vermeidet die missverständliche Vorstellung, Menschen könnten ihre Schuld rein aus eigener Kraft ausgleichen.
- source_word: ጠሊ
  choice: junger Ziegenbock
  rationale: Das Wort bezeichnet einen jungen Ziegenbock beziehungsweise ein Ziegenjunges; die konkrete Wiedergabe passt zum genannten Sühneritus.
- source_word: ምሕረቶ
  choice: Liebe
  rationale: Das Substantiv kann Erbarmen, Zuneigung oder liebevolle Regung bezeichnen. In der Beziehung Jakobs zu Josef ist „Liebe“ im Deutschen natürlich und gibt die väterliche Zuneigung wieder.
- source_word: ዜናሁ ለዮሴፍ
  choice: die Nachricht über Josef
  rationale: Der Ausgangstext sagt lediglich „die Nachricht über Josef“ und legt nicht ausdrücklich fest, dass Josef als tot gemeldet wurde.
theological_decisions:
- issue: Bezug zum Versöhnungstag
  choice: Der Haupttext nennt Datum, Selbstdemütigung und Sühne, ohne den später geläufigen Festnamen einzusetzen.
  alternative: Den „Versöhnungstag (Jom Kippur)“ ausdrücklich in den Haupttext aufnehmen.
  rationale: Der Festname steht hier nicht ausdrücklich im geʿezischen Wortlaut; die ätiologische Verbindung wird daher nur in der Fußnote erläutert.
- issue: Art der Selbstkasteiung
  choice: „sich selbst demütigen“
  alternative: „fasten“ oder „sich kasteien“
  rationale: Der Text benennt nicht ausdrücklich das Fasten. Die gewählte Formulierung bewahrt den kultischen Sinn und lässt die konkrete Praxis offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Söhne Israels“ bewahrt die historische Formulierung; die Gedankenstriche gliedern den langen Satz. Die Wiederholung des Datums bleibt erhalten, weil sie auch im Ausgangstext steht.
