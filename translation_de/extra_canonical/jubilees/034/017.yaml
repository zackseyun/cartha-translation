  text: And he mourned for Joseph one year and did not cease, for he said, “I will go down to the grave mourning for my son.”
translation:
  language: de
  text: 'Und er trauerte ein Jahr lang um Josef und hörte nicht damit auf; denn er sagte: »Trauernd um meinen Sohn werde ich ins Grab hinabsteigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይላሑ
  choice: trauerte
  rationale: Das Verb bezeichnet hier anhaltende Trauer um den vermeintlich verstorbenen Josef; »trauern« ist im Deutschen natürlich und kontextgerecht.
- source_word: መቃብር
  choice: Grab
  rationale: Das Wort bezeichnet wörtlich das Grab bzw. die Begräbnisstätte. »Grab« bewahrt die konkrete Bildsprache, ohne die Aussage ausdrücklich als Unterweltvorstellung zu deuten.
- source_word: እንዘ፡ ላላሑ
  choice: trauernd
  rationale: Die begleitende Umstandsform wird knapp als modales Partizip wiedergegeben und bewahrt den Zusammenhang zwischen Hinabsteigen und Trauer.
theological_decisions:
- issue: Bedeutung des Hinabsteigens ins Grab
  choice: »ins Grab hinabsteigen«
  alternative: »ins Totenreich hinabsteigen« oder »sterben«
  rationale: Die konkrete Quellensprache bleibt erhalten. So wird weder eine ausgearbeitete Lehre vom Totenreich eingetragen noch die Bildhaftigkeit durch die abstrakte Wiedergabe »sterben« eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der ge'ezischen Abfolge, wird aber durch ein Semikolon und eine natürliche deutsche Wortstellung gut lesbar gemacht.
