lexical_decisions:
- source_word: ወረዱ
  choice: hinabzogen
  rationale: Bewahrt die traditionelle räumliche Ausdrucksweise für den Zug nach Ägypten und entspricht dem Plural des ge’ezischen Verbs.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet im Jubiläenbuch eine Siebenergruppe von Jahren; „Jahrwoche“ gibt diesen technischen Sinn knapp und verständlich wieder.
- source_word: ሰላሞሙ
  choice: Wohlergehen
  rationale: Das zugrunde liegende Wort für „Frieden“ bezeichnet hier idiomatisch den Zustand beziehungsweise das Wohlergehen der Brüder.
- source_word: እምቤቱ
  choice: aus seinem Haus
  rationale: Gibt die Herkunftsangabe wörtlich und natürlich wieder, ohne sie unnötig als bloßen Aufenthaltsort umzudeuten.
- source_word: ውስተ፡ ምድረ
  choice: im Land von …
  rationale: „Land“ steht in einer abhängigen Konstruktion („Land von“); da der vorgelegte Quellenausschnitt ohne das folgende Bezugswort endet, wird die syntaktische Unvollständigkeit sichtbar bewahrt.
