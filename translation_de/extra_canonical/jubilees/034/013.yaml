  yaml_path: translation/extra_canonical/jubilees/034/013.yaml
  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: de
  text: 'Und er trauerte die ganze Nacht, denn am Abend hatten sie es[a] ihm gebracht. Vor Kummer über Josefs Tod wurde er fiebrig und sagte: »Ein wildes Tier hat Josef gefressen.« Alle Angehörigen seines Hauses trauerten an jenem Tag mit ihm; sie waren den ganzen Tag tief betrübt und trauerten mit ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Josefs blutbeflecktes Gewand; der Ausgangstext sagt hier wörtlich nur „es“.
    reason: Die Fußnote erklärt den pronominalen Rückverweis, ohne die im Vers vorhandene indirekte Ausdrucksweise im Haupttext zu ersetzen.
lexical_decisions:
- source_word: ወበሐወ
  choice: Und er trauerte
  rationale: Das Verb bezeichnet Klage bzw. Trauer; „trauerte“ ist im Deutschen natürlich und wahrt den feierlich-erzählenden Ton.
- source_word: ኪያሁ
  choice: es
  rationale: Das äthiopische Pronomen verweist im Zusammenhang auf Josefs blutbeflecktes Gewand, benennt den Gegenstand hier aber nicht ausdrücklich.
- source_word: ወፈጸነ፡ በላህ፡ ሞቶ
  choice: Vor Kummer über seinen Tod geriet er in Fieber
  rationale: Die schwierige Wendung wird entsprechend dem überlieferten Sinn als körperliche Fieberreaktion auf die Todestrauer wiedergegeben, ohne den Bezug von „seinen“ über Josef hinaus auszudeuten.
- source_word: አርዌ፡ ጸዋገ
  choice: ein wildes Tier
  rationale: Die Wortgruppe bezeichnet ein wildes bzw. reißendes Tier; „wildes Tier“ ist präzise und allgemein verständlich.
- source_word: በልዖ
  choice: hat … gefressen
  rationale: Bei einem Tier als Subjekt ist „fressen“ im Deutschen die natürliche und anschauliche Entsprechung von „verschlingen/essen“.
- source_word: ኵሉ፡ ሰብአ፡ ቤቱ
  choice: alle Angehörigen seines Hauses
  rationale: Gemeint ist die gesamte Hausgemeinschaft, nicht nur ein Gebäude oder zwingend ausschließlich die Kernfamilie.
- source_word: የሐምሙ
  choice: sie waren … tief betrübt
  rationale: Das Verb kann Schmerz, Leiden oder Betrübnis ausdrücken; die Wiedergabe hält hier die emotionale Bedeutung im Trauerkontext fest.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzführung. Die Wiederholung von Trauer und Betrübnis bleibt erhalten, weil sie die Dauer und Intensität von Jakobs Klage betont.
