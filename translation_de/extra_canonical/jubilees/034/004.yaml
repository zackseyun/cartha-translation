  text: And Benjamin was the youngest[4], and for this reason he remained with his father. And there came the kings of Taphu, and the kings of Ares, and the kings of Seragan, and the kings of Selo, and the kings of Gaas, and the king of Bethoron, and the king of Maanisakir, and all those who dwell on this mountain, and those who dwell in
translation:
  language: de
  text: Und Benjamin war der Jüngste[a] und blieb deshalb bei seinem Vater. Da kamen die Könige von Tafu, die Könige von Ares, die Könige von Seragan, die Könige von Selo, die Könige von Gaas, der König von Bet-Horon, der König von Maanisakir und alle, die auf diesem Berg wohnen, sowie die, die in … wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Abfolge und Abgrenzung der Orts- und Herrschernamen in V. 4–8 ist in der äthiopischen Überlieferung unsicher. Die Namen werden daher zurückhaltend lautnah wiedergegeben. Der Satz bricht in der vorliegenden Versvorlage nach „in“ ab.
    reason: segmentation_note
lexical_decisions:
- source_word: ወብንያም፡ ውእቱ፡ ዘይኄእስ
  choice: Und Benjamin war der Jüngste
  rationale: Die Konstruktion bezeichnet Benjamin als den jüngsten; idiomatisches modernes Deutsch verlangt hier den Superlativ mit Artikel.
- source_word: ወ"በእግዚአ፡ ነበረ፡" *ኀበ፡ አቡሁ
  choice: und blieb deshalb bei seinem Vater
  rationale: Der überlieferte Text ist durch editorische Zeichen gestört; im Kontext ist die kausale Verbindung mit Benjamins Verbleib beim Vater am besten bezeugt.
- source_word: ነገሥተ
  choice: die Könige von
  rationale: Der Plural wird formal gewahrt, auch wo die wiederholte Angabe mehrerer Könige für einzelne Ortsnamen ungewöhnlich wirkt.
- source_word: ንጉሠ
  choice: der König von
  rationale: Bei Bet-Horon und Maanisakir steht im Gegensatz zu den vorausgehenden Formen der Singular.
- source_word: ውስተዝ፡ ደብር
  choice: auf diesem Berg
  rationale: ደብር bezeichnet hier einen Berg; die deiktische Form wird mit „diesem“ wiedergegeben.
