  source_fidelity: 'Der ge''ezische Text nennt zunächst Iyasaka als Frau Benjamins und berichtet dann, dass Simeon seine Haltung änderte/etwas bereute und wie seine Brüder eine weitere Frau aus Mesopotamien nahm. Der Entwurf gibt diese Elemente grundsätzlich wieder. „besann sich anders“ ist jedoch im Deutschen semantisch und idiomatisch unvollständig: Man besinnt sich anders nicht ohne klaren Bezug; zudem wird die im Kontext naheliegende Reue beziehungsweise Sinnesänderung weniger klar erfasst.'
  naturalness: „Benjamins Frau hieß Iyasaka“ und der zweite Satz sind sonst natürliches modernes Standarddeutsch. „Simeon aber bereute es“ ist knapp, idiomatisch und lässt den weiteren Bedeutungsrahmen des Verbs durch die Fußnote offen.
  terminology: Die Namen Iyasaka, Simeon und Mesopotamien sind angemessen wiedergegeben. „eine zweite Frau“ entspricht dem expliziten „andere/zweite Frau“; „nahm sich“ ist in diesem ehelichen Kontext verständlich und wahrt die knappe Quellformulierung.
