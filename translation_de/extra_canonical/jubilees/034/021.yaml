  yaml_path: translation/extra_canonical/jubilees/034/021.yaml
  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: de
  text: Benjamins Frau hieß Iyasaka. Simeon aber bereute es[a] und nahm sich wie seine Brüder eine zweite Frau aus Mesopotamien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb kann auch „änderte seine Meinung“ oder allgemeiner „kehrte um“ beziehungsweise „wandte sich um“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ለብእሲተ፡ ብንያም፡ ኢያስካ፡
  choice: Benjamins Frau hieß Iyasaka
  rationale: Die nominale Wendung nennt Benjamins Frau und ihren Namen; im Deutschen gibt „hieß“ die elliptische Namensangabe natürlich wieder.
- source_word: ወተመይጠ፡
  choice: aber besann sich anders
  rationale: Das Verb bezeichnet ein Sich-Wenden beziehungsweise eine Sinnesänderung. Die Formulierung wahrt diese Bedeutung, ohne vorschnell eine ausdrücklich religiöse „Buße“ anzunehmen.
- source_word: ወነሥአ፡ ብእሲተ፡
  choice: und nahm sich … eine Frau
  rationale: Wörtlich ist vom Nehmen einer Frau die Rede; im Zusammenhang bedeutet dies, eine Frau zu heiraten.
- source_word: እም፡ ሜስጶጦምያ፡
  choice: aus Mesopotamien
  rationale: Direkte Wiedergabe der Herkunftsangabe.
- source_word: ካልእተ፡ ከመ፡ አኅዊሁ።
  choice: wie seine Brüder eine zweite Frau
  rationale: „Zweite“ bezieht sich auf die Frau; „wie seine Brüder“ bewahrt den ausdrücklichen Vergleich.
theological_decisions:
- issue: Bedeutungsumfang von ተመይጠ
  choice: besann sich anders
  alternative: bereute es / kehrte um
  rationale: Das Verb kann Umkehr, Sinnesänderung oder Reue ausdrücken. Der Kontext hebt die geänderte Entscheidung und die anschließende zweite Heirat hervor; eine spezifisch theologische Bußterminologie wäre zu eng.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wurde für natürliche Lesbarkeit leicht geglättet; „aber“ macht den Übergang zur Reaktion Simeons deutlich, ohne den Sinn festzulegen.
