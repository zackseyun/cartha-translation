base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/019.yaml
  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: de
  text: Ihre Sünde bestand darin, dass sie ihren Vater um seinen Sohn Josef betrübt hatten.[a] Dieser Tag wurde dazu bestimmt, dass sie an ihm über ihre Sünden, alle ihre Vergehen und alle ihre Verfehlungen trauern und sich so einmal jährlich reinigen sollten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Ge’ez: „dass sie das Erbarmen oder Mitgefühl ihres Vaters wegen Josef, seines Sohnes, betrübt hatten“. Die Formulierung ist im Deutschen wie bereits im Ausgangstext ungewöhnlich.'
    reason: Die Fußnote weist die im Haupttext idiomatisch geglättete, aber quellenrelevante Wendung über das Mitgefühl des Vaters aus.
  - marker: b
    text: Der hier vorgelegte Ge’ez-Ausschnitt bricht nach „und wegen aller …“ ab; der Schluss des Satzes folgt der überlieferten vollständigen Versfassung.
    reason: Die Fußnote macht transparent, dass die abschließende Aussage im bereitgestellten Quellenausschnitt nicht vollständig enthalten ist.
lexical_decisions:
- source_word: ኃጢአቶሙ (ḫaṭiʾātomu)
  choice: ihre Sünde / ihre Sünden
  rationale: Das erste Vorkommen bezeichnet zusammenfassend ihre Schuld im Fall Josefs; das spätere Vorkommen steht im Rahmen der jährlichen Trauer allgemein im Plural.
- source_word: አኅዘኑ (ʾaḥzanu)
  choice: mit Kummer erfüllt hatten
  rationale: Das Kausativverb drückt aus, dass die Brüder ihrem Vater Kummer bereiteten; die Formulierung ist im Deutschen natürlich und wahrt den rückblickenden Sinn.
- source_word: ምሕረተ አቡሆሙ (məḥrata ʾabuhomu)
  choice: das erbarmende Herz ihres Vaters
  rationale: ምሕረት bezeichnet Erbarmen oder Mitgefühl. „Herz“ macht die anthropologische Wendung im Deutschen verständlich, ohne den Aspekt väterlichen Erbarmens aufzugeben.
- source_word: ተሠርዐት (taśarʿat)
  choice: wurde bestimmt
  rationale: Das Verb bezeichnet eine verbindliche Festsetzung oder Anordnung; „bestimmt“ passt hier idiomatisch zu einem jährlich begangenen Tag.
- source_word: ይሕዝኑ (yəḥzənu)
  choice: trauern
  rationale: Das Verb bezeichnet Trauer beziehungsweise Bekümmerung und bewahrt den Zusammenhang mit dem Kummer des Vaters.
- source_word: አበሳሆሙ (ʾabasāhomu)
  choice: ihre Vergehen
  rationale: Der Ausdruck bezeichnet schuldhafte Übertretungen; „Vergehen“ unterscheidet ihn verständlich von „Sünden“ und „Verfehlungen“.
theological_decisions:
- issue: Zweck der jährlichen Trauer und Reinigung
  choice: „trauern und sich so … reinigen sollten“
  alternative: „trauern, um sich … zu reinigen“
  rationale: Die Formulierung wahrt den Zusammenhang zwischen Trauer über Schuld und Reinigung, ohne genauer festzulegen, ob die Trauer selbst die Reinigung bewirkt oder Bestandteil des angeordneten Ritus ist.
- issue: Bezeichnung von Jakobs innerer Regung
  choice: „das erbarmende Herz ihres Vaters“
  alternative: „das Erbarmen ihres Vaters“
  rationale: Die wörtlichere Alternative klingt im Deutschen unnatürlich und könnte Erbarmen als abstrakte Sache darstellen. Die gewählte Wendung erhält den im Quellwort liegenden Gedanken väterlichen Mitgefühls.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Ge’ez, wird aber so geglättet, dass Zweck und jährliche Wiederholung unmittelbar verständlich sind. „Josef“ folgt der üblichen modernen deutschen Namensform.
