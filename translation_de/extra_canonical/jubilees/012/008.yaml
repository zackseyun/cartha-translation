translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholten Pronomen in „damit sie sie anbeten“ bleiben trotz ihrer stilistischen Dichte erhalten, weil der Bezug der Ausgangssprache nicht eigenmächtig durch ein konkretes Substantiv aufgelöst werden soll. Der im bereitgestellten Textausschnitt nur begonnene Schlusssatz wird anhand der dokumentierten Fortsetzung des Ge’ez-Verses vollständig wiedergegeben.
