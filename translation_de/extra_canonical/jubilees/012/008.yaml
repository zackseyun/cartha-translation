lexical_decisions:
- source_word: ያምልክዎሙ
  choice: sie anbeten
  rationale: Gibt die religiöse Verehrung des Ge’ez-Verbs klar wieder und bewahrt das pronominale Objekt.
- source_word: ይስብሕዎሙ
  choice: sie preisen
  rationale: Entspricht dem Sinn von loben beziehungsweise preisen und passt zum kultischen Zusammenhang.
- source_word: አርምም
  choice: Schweig
  rationale: Der direkte Imperativ wird knapp und natürlich wiedergegeben.
- source_word: አይቅትሉከ
  choice: sonst töten sie dich
  rationale: Gibt die warnende beziehungsweise vorbeugende Konstruktion idiomatisch wieder, ohne die reale Gefahr abzuschwächen.
- source_word: ነገረ
  choice: sagte
  rationale: Das Verb kann je nach Konstruktion „sagen“, „erzählen“ oder „mitteilen“ bedeuten; mit „diese Worte“ ist „sagte“ hier natürlich und quellennah.
- source_word: ወተምዑ፡ ሎቱ
  choice: Da wurden sie zornig auf ihn
  rationale: Bewahrt sowohl die Reaktion der Brüder als auch ihre Ausrichtung gegen ihn.
- source_word: ወአርመመ
  choice: und er schwieg
  rationale: Nimmt das zuvor verwendete Motiv des Schweigens wieder auf und entspricht der abschließenden Verbform.
