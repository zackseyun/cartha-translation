lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: diese Sache
  rationale: Gibt Demonstrativpronomen und Substantiv natürlich wieder; „Angelegenheit“ wäre möglich, klingt hier aber unnötig abstrakt.
- source_word: ተምዑ፡ ላዕሌሁ
  choice: wurden sie zornig auf ihn
  rationale: Bewahrt sowohl die emotionale Reaktion als auch ihre Ausrichtung gegen Abram.
- source_word: አርመሙ
  choice: schwiegen
  rationale: Die Verbform ist Plural und bezieht sich auf die beiden Brüder; daher nicht „er schwieg“.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet im chronologischen System des Jubiläenbuches eine Einheit von sieben Jahren und wird so für heutige Leser knapp verständlich wiedergegeben.
- source_word: ሶራ
  choice: Sarai
  rationale: Der äthiopische Namensform entspricht hier die im Deutschen geläufige biblische Namensform Sarai.
- source_word: ወሰተ
  choice: und sie war die Tochter von
  rationale: Gibt die am Segmentende beginnende, aber unvollständig überlieferte Verwandtschaftsangabe als bewusst offenen Satz wieder.
theological_decisions:
- issue: Unvollständige Angabe zu Sarais Abstammung
  choice: „die Tochter von …“ mit Fußnote
  alternative: Die aus dem Folgekontext oder anderen Textzeugen erschlossene Verwandtschaftsangabe ergänzen
  rationale: Der bereitgestellte ge'ezische Abschnitt endet mitten in der Genitivverbindung. Eine Ergänzung würde über die vorliegende Quellenbasis hinausgehen und könnte eine textlich schwierige Familienbeziehung vorschnell festlegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Jubiläenchronologie bleibt formal erkennbar; „Jahrwoche“ verdeutlicht die Siebenjahreseinheit. Die durch den Quellenausschnitt verursachte Satzunterbrechung wird nicht stillschweigend ergänzt.
