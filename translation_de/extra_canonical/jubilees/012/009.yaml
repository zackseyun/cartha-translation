  terminology: „Jubiläum“, „Jahrwoche“, „Abram“ und „Sarai“ sind angemessen. „Jahrwoche“ gibt die siebenteilige chronologische Einheit präzise wieder. Die Fußnote ist korrekt am unvollständigen Abstammungsausdruck verankert.
