  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: de
  text: 'Das Wort des HERRN kam durch meine Hand zu ihm: »Zieh fort aus deinem Land, aus deiner Verwandtschaft und aus dem Haus deines Vaters in das Land, das ich dir zeigen werde. Ich werde dich zu einem großen und zahlreichen Volk machen und dich segnen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: das Wort des HERRN
  rationale: Gibt die geezische Wendung sachlich und in vertrauter biblischer Sprache wieder.
- source_word: ኀቤሁ፡ በእዴየ
  choice: durch meine Hand zu ihm
  rationale: Bewahrt sowohl die Zielangabe „zu ihm“ als auch die im Erzählrahmen bedeutsame Vermittlungsformel „durch meine Hand“.
- source_word: ፃእ
  choice: Zieh fort
  rationale: Das Verb fordert zum Verlassen des bisherigen Ortes und Umfelds auf; „zieh fort“ klingt im Deutschen natürlicher und würdiger als das wörtlichere „geh hinaus“.
- source_word: ትዝምድከ
  choice: deiner Verwandtschaft
  rationale: Bezeichnet die verwandtschaftliche Zugehörigkeit bzw. Sippe, ohne den Ausdruck unnötig zu verengen.
- source_word: ሕዝበ፡ ዐቢየ፡ ወብዙኃ
  choice: ein großes und zahlreiches Volk
  rationale: 'Erhält beide ausdrücklichen Eigenschaften: Größe und zahlenmäßige Vielheit.'
theological_decisions:
- issue: Vermittlung des göttlichen Wortes
  choice: „durch meine Hand“ ausdrücklich beibehalten
  alternative: die Wendung idiomatisch zu „durch mich“ vereinfachen
  rationale: Die wörtliche Metapher kann auf die Vermittlungsrolle des erzählenden Engels hinweisen und sollte daher nicht geglättet werden.
- issue: Gottesname
  choice: HERRN in Kapitälchenkonvention
  alternative: Herrn
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den Gottesnamen, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdig-biblischem Ton. Die direkte Rede ist klar gegliedert; die geezische Vermittlungsformel bleibt bewusst sichtbar.
