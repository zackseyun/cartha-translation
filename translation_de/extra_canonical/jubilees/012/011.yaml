lexical_decisions:
- source_word: ስሞ፡ ሎጥ
  choice: seinen Namen Lot
  rationale: Der Versanfang setzt den über die Versgrenze reichenden Satz aus Vers 10 fort. Deshalb wird er nicht als selbstständiger Satz im Sinn von »Sein Name war Lot« wiedergegeben.
- source_word: ወናኮር፡ እኁሁ
  choice: Und sein Bruder Nahor
  rationale: Gibt die koordinierende Konjunktion, den Eigennamen und die Verwandtschaftsbezeichnung in natürlicher deutscher Wortstellung wieder.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm sich eine Frau
  rationale: Bewahrt die reflexive Bedeutung von »für sich nehmen« und verwendet die geläufige deutsche Formulierung für die Eheschließung.
