  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: de
  text: Er lässt es am Morgen und am Abend regnen; und wenn er will, lässt er es nicht herabkommen. Und alles ist in seiner Hand.« Und er betete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዘንም
  choice: Er lässt es … regnen
  rationale: Das Verb bezeichnet das Veranlassen von Regen; das Pronomen »es« ergibt im Deutschen eine natürliche Wetterkonstruktion.
- source_word: ነግሀ ወሰርከ
  choice: am Morgen und am Abend
  rationale: Gibt die beiden Zeitangaben idiomatisch und zugleich eng am Wortlaut wieder.
- source_word: ወእመ ፈቀደ
  choice: und wenn er will
  rationale: Bewahrt die Bedingung im zweiten Satzteil, ohne sie gegen den ge'ezischen Wortlaut auf den ersten Satzteil auszudehnen.
- source_word: ኢያወርድ
  choice: lässt er es nicht herabkommen
  rationale: Bewahrt das konkrete Bild des Herabkommens und den kausativen Sinn; im Zusammenhang bezieht sich »es« auf den Regen.
- source_word: ወኵሉ ውስተ እዴሁ
  choice: Alles ist in seiner Hand
  rationale: Die geläufige deutsche Wendung bildet die Aussage über Gottes Verfügungsgewalt formal und verständlich ab.
- source_word: ወጸለየ
  choice: Und er betete
  rationale: Die im bereitgestellten Quellsegment enthaltene abschließende Verbform wird ausdrücklich wiedergegeben.
theological_decisions:
- issue: Göttliche Verfügung über den Regen
  choice: Die Aussage wird ohne Zusatz oder Abschwächung als unmittelbares Handeln und Wollen Gottes wiedergegeben.
  alternative: Das Wetter unpersönlich beschreiben oder eine sekundäre Ursache einfügen.
  rationale: Der Quelltext schreibt sowohl das Regnen als auch dessen Ausbleiben direkt Gottes Verfügung zu.
- issue: Reichweite der Bedingung »wenn er will«
  choice: Die Bedingung gehört nur zum Nicht-Herabkommenlassen.
  alternative: Auch den ersten Satz mit »Wenn er will« beginnen.
  rationale: ወእመ ፈቀደ steht erst vor der negierten zweiten Handlung; eine Ausdehnung auf die erste wäre textlich unbegründet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die ge'ezische Satzfolge. Das etwas konkrete »herabkommen« bleibt erhalten, da es das Bild des Quelltexts wahrt. »Und er betete« wird trotz möglicher Zugehörigkeit zum folgenden Erzählabschnitt aufgenommen, weil es im vorgelegten Quellsegment steht.
