translation:
  language: de
  text: … der Sonne und des Mondes, alles liegt in der Hand des Herrn. Warum suche ich? Wenn er will …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: … der Sonne und des Mondes
  rationale: Die mit ለ- markierten Ausdrücke setzen hier syntaktisch den vorangehenden Vers fort. Die Auslassungspunkte machen die durch die Verssegmentierung entstandene Fragmentgrenze sichtbar, statt eine eigenständige Nominalphrase zu konstruieren.
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: alles liegt in der Hand des Herrn
  rationale: Die Wendung wird als natürliche deutsche Zustandsaussage wiedergegeben; das Bild von Gottes Hand bleibt erhalten.
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: Warum suche ich?
  rationale: Gibt Fragewort, ausdrückliches Ich und das Verb schlicht wieder, ohne die nicht ausdrücklich bezeichnete Dauer durch „weiter“ einzutragen.
- source_word: በእመ፡ ፈቀደ
  choice: Wenn er will …
  rationale: Der Bedingungssatz eröffnet offenbar den folgenden Gedanken. Die Auslassungspunkte bewahren den fragmentarischen Charakter und verhindern eine falsche Anbindung an die vorausgehende Frage.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: Herr
  alternative: HERR
  rationale: „Herr“ entspricht der vorliegenden Bezeichnung, ohne durch Kapitälchen eine spezifische Wiedergabe des Tetragramms zu behaupten.
- issue: Bezug von „Wenn er will“
  choice: als Beginn des nächsten, hier unvollständigen Satzes
  alternative: als Bedingung zur Frage „Warum suche ich?“
  rationale: Die Quellenform und die überlieferte Segmentierung sprechen dafür, dass die Bedingungsphrase einen neuen Gedanken beginnt. Die Übersetzung lässt ihn offen, statt die theologische Logik zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen Anfangs- und Schlussfragmente werden durch Auslassungspunkte offengelegt; ein Semikolon trennt die fortgesetzte Genitivphrase von der vollständigen Aussage.
