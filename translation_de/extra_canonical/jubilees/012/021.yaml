  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: de
  text: 'Und er sagte: „Soll ich nach Ur der Chaldäer zurückkehren, zu den Menschen, die mein Angesicht suchen, damit ich zu ihnen zurückkehre? Und was soll ich hier an diesem Ort tun? Mache vor dir den rechten Weg gerade durch die Hand deines Dieners, damit er ihn beschreite, und lass mich nicht im Irrtum meines Herzens wandeln, mein Gott.“[a] Als er zu Ende gesprochen und gebetet hatte, siehe, da wurde einer gesandt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mittlere Teil des Verses ist im gegliederten ge’ezischen Text schwer verständlich. Die Übersetzung bewahrt den Sinn von Abrams Bitte, Gott möge den rechten Weg gerade machen und ihn nicht dem Irrtum seines eigenen Herzens folgen lassen.
    reason: segmentation_note
lexical_decisions:
- source_word: ገጽየ
  choice: mein Angesicht
  rationale: Die wörtliche Wendung wird bewahrt; im Zusammenhang bedeutet sie, dass die Chaldäer Abrams Gegenwart beziehungsweise Rückkehr wünschen, nicht dass sie nach seinem Leben trachten.
- source_word: እግባእ
  choice: ich zurückkehre
  rationale: Das Verb bezeichnet hier die Rückkehr zu ihnen und wird nicht mit dem weniger genauen „hineingehen“ wiedergegeben.
- source_word: ፍኖተ፡ ርቱዐ
  choice: den rechten Weg
  rationale: Bewahrt das Wegbild und die ethische beziehungsweise richtungsweisende Bedeutung der Vorlage.
- source_word: ይግበር
  choice: damit er ihn beschreite
  rationale: Die aktive Form mit dem Diener als Subjekt bleibt erhalten. Im Deutschen passt „einen Weg beschreiten“ natürlicher als „einen Weg tun“, ohne das Bild aufzulösen.
- source_word: ተፈነወ
  choice: wurde einer gesandt
  rationale: Das Passiv wird beibehalten; „einer“ gibt das im Zusammenhang vorausgesetzte, aber noch nicht näher bestimmte Subjekt wieder.
theological_decisions:
- issue: Göttliche Führung und menschliches Handeln
  choice: „durch die Hand deines Dieners, damit er ihn beschreite“
  alternative: „und lass es durch die Hand deines Dieners geschehen“
  rationale: Die Übersetzung bewahrt sowohl Gottes wegweisendes Handeln als auch die aktive Rolle des Dieners und vermeidet eine passive Umdeutung des Verbs.
- issue: Irrtum des Herzens
  choice: „lass mich nicht im Irrtum meines Herzens wandeln“
  alternative: „lass mich nicht meinem irrenden Herzen folgen“
  rationale: Die bildhafte Verbindung von Weg und Wandeln bleibt erhalten, ohne den Ausdruck psychologisch oder lehrmäßig weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitische Wendung „mein Angesicht suchen“ und die Wegmetaphorik bleiben bewusst erhalten; ungewöhnliche Syntax wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
