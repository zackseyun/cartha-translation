  terminology: „Angesicht“, „rechter Weg“, „Irrtum meines Herzens“ und „mein Gott“ sind registergerecht und quellennah. „Wandeln“ wahrt die Wegmetaphorik in würdigem modernen Standarddeutsch. Die Fußnote erklärt die textliche Schwierigkeit sachlich und ohne unzulässige Auslegung.
