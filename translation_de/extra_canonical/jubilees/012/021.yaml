  source_fidelity: 'Die wesentlichen Lesarten sind zutreffend wiedergegeben: „mein Angesicht suchen“ entspricht ገጽየ und darf hier nicht zu „nach meinem Leben trachten“ verschärft werden; እግባእ ist als Rückkehr wiedergegeben. Die schwierige Bitte bewahrt zudem „vor dir“, die aktive Handlung des Dieners und das Passiv am Versschluss. Eine kleine stilistische Präzisierung bei der Ortsbezeichnung und der Anbindung der Personen verbessert das Deutsche ohne Sinnverlust.'
