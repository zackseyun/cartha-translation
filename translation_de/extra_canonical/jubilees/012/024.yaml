  yaml_path: translation/extra_canonical/jubilees/012/024.yaml
  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: de
  text: '»Und ich werde dein Gott sein, der Gott deines Sohnes, des Sohnes deines Sohnes und aller deiner Nachkommen. Fürchte dich von nun an nicht, bis hinein in alle Generationen der Erde.[a] Ich bin dein Gott.« Und er sagte zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und bis zu allen Generationen der Erde«; gemeint sein kann auch: »durch alle Generationen der Erde hindurch«.'
    reason: Die Verbindung mit እስከ bezeichnet eine Erstreckung bis zu beziehungsweise bis in einen Endpunkt hinein; im Deutschen bleibt offen, ob der Ausdruck stärker ziel- oder verlaufsbezogen zu verstehen ist.
lexical_decisions:
- source_word: እከውንከ፡ … አምላከ፡
  choice: ich werde dein Gott sein
  rationale: Gibt die futurische Form von ‚sein/werden‘ mit dem prädikativen ‚Gott‘ idiomatisch und quellentreu wieder.
- source_word: ዘርእከ፡
  choice: deine Nachkommen
  rationale: Das Wort bezeichnet hier die gesamte Nachkommenschaft; modernes Deutsch verwendet dafür natürlicherweise den Plural.
- source_word: ኢትፍራህ፡
  choice: Fürchte dich nicht
  rationale: Entspricht dem negierten Singularimperativ, ohne den Sinn durch ‚Hab keine Angst‘ abzuschwächen.
- source_word: እምይእዜ፡ ወእስከ፡ ኵሉ፡ ትዝምደ፡ ምድር፡
  choice: von nun an … bis in alle Generationen der Erde hinein
  rationale: Bewahrt sowohl den Ausgangspunkt ‚von nun an‘ als auch ወእስከ ‚und bis/ bis hinein‘; ein nicht belegtes ‚für immer‘ wird nicht eingefügt.
- source_word: ወይቤለኒ፡
  choice: 'Und er sagte zu mir:'
  rationale: Das Subjekt ist im Ge’ez lediglich in der Verbform als ‚er‘ enthalten; ein ausdrückliches ‚der Herr, Gott‘ wäre ein Zusatz.
theological_decisions:
- issue: Gottes Zusage über mehrere Generationen
  choice: Die wiederholte Beziehung wird ausdrücklich als ‚dein Gott … der Gott deines Sohnes …‘ wiedergegeben.
  alternative: ‚Ich werde Gott sein für dich und für deinen Sohn …‘
  rationale: Die gewählte Form ist im Deutschen natürlicher, ohne Umfang oder persönlichen Charakter der Zusage einzuschränken.
- issue: Zeitliche Reichweite des Furchtverbots
  choice: ‚bis in alle Generationen der Erde hinein‘
  alternative: ‚für immer, durch alle Generationen der Erde hindurch‘
  rationale: Die Quelle enthält እስከ ‚bis/solange wie‘, aber kein eigenes Wort für ‚für immer‘; die Übersetzung vermeidet daher eine theologische oder zeitliche Erweiterung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gestufte Abstammungsformel bleibt bewusst erhalten. Der abschließende Sprecherverweis wird nicht durch einen Gottesnamen ergänzt, da dieser im vorliegenden Ge’ez-Text fehlt.
