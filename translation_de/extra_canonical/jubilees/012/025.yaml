base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: de
  text: 'Gott, der Herr, [sprach][a]: »Öffne seinen Mund und seine Ohren, damit er hört und mit seinem Mund in der Sprache spricht, die offenbart worden ist; denn seit dem Tag des Umsturzes ist sie aus dem Mund aller Menschenkinder verschwunden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das in eckigen Klammern ergänzte „sprach“ steht nicht im hier vorgelegten ge’ezischen Wortlaut, ergibt sich aber aus dem erzählerischen Zusammenhang. Das folgende „Öffne“ ist ein Imperativ.
    reason: textual_clarity
  - marker: b
    text: 'Die Schlusswendung bezieht sich wahrscheinlich auf den Verlust der ursprünglichen Sprache nach dem mit Babel verbundenen Gericht. Der ge’ezische Wortlaut ist knapp und sagt wörtlich sinngemäß: „seit dem Tag des Umsturzes“.'
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ (fətaḥ)
  choice: Öffne
  rationale: Die Form ist ein Imperativ der 2. Person Singular und wird daher als unmittelbarer Befehl wiedergegeben, nicht als Wunschform.
- source_word: በልሳን (ba-ləssān)
  choice: in der Sprache
  rationale: Die Präposition und das Substantiv bezeichnen das sprachliche Medium; „in der Sprache“ ist im Deutschen natürlich und genau.
- source_word: እንተ ታስተርኢ (ʾənta tāstarʾi)
  choice: die offenbart worden ist
  rationale: Die passive Aussage wird bewahrt; das Perfekt bezeichnet eine bereits erfolgte Offenbarung.
- source_word: አዐረፈ እምአፈ (ʾaʿarafa ʾəm-ʾafe)
  choice: ist sie aus dem Mund … verschwunden
  rationale: Die komprimierte Wendung besagt, dass die Sprache nicht mehr im Mund der Menschen vorhanden beziehungsweise nicht mehr gesprochen wurde. „Verschwunden“ erhält das Bild des Mundes, ohne eine zusätzliche Auslegung einzuführen.
- source_word: ዕለተ ድቀት (ʿəlata dəqət)
  choice: Tag des Umsturzes
  rationale: ድቀት bezeichnet Fall, Niedersturz oder Umsturz. Die Wiedergabe bleibt bewusst allgemeiner als eine ausdrückliche Nennung Babels.
theological_decisions:
- issue: Sprecherformel und Anrede am Versanfang
  choice: 'Der Herr, Gott, [sprach]: »Öffne …«'
  alternative: Möge der Herr, Gott, seinen Mund und seine Ohren öffnen …
  rationale: Der überlieferte Wortlaut beginnt mit „Herr Gott“ und danach einem Imperativ der 2. Person Singular. Im erzählerischen Zusammenhang ist dies als Gottes Befehl zu verstehen. Die im vorgelegten Text fehlende, in anderen Textzeugen beziehungsweise kritischen Rekonstruktionen vorausgesetzte Sprecherformel wird transparent in eckigen Klammern ergänzt.
- issue: Bezug des „Umsturzes“
  choice: Der Haupttext nennt nur den „Tag des Umsturzes“.
  alternative: seit dem Turmbau zu Babel / seit der Sprachverwirrung
  rationale: Ein Bezug auf Babel ist wahrscheinlich, steht aber nicht ausdrücklich in der ge’ezischen Formulierung und wird deshalb nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bildet den Imperativ des Ausgangstextes ab. „Menschenkinder“ bewahrt die traditionelle anthropologische Wendung, während Satzbau und Verbwahl für heutige Leser verständlich bleiben.
