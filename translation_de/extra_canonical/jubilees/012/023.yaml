  yaml_path: translation/extra_canonical/jubilees/012/023.yaml
  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: de
  text: Und ich werde deinen Namen groß machen, und du wirst auf der Erde gesegnet sein, und in dir werden alle Völker der Erde gesegnet werden. Die, die dich segnen, werde ich segnen, und die, die dich verfluchen, werde ich verfluchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: Und ich werde deinen Namen groß machen
  rationale: Gibt die Kausativform von „groß sein/werden“ mit „Name“ unmittelbar und idiomatisch wieder; der äthiopische Text enthält hier kein zusätzliches „ich werde dich segnen“.
- source_word: ቡሩከ፡ ውስተ፡ ምድር
  choice: du wirst auf der Erde gesegnet sein
  rationale: Bewahrt die passive Aussage und die Ortsangabe des Ausgangstextes, ohne sie zu „du wirst ein Segen sein“ umzudeuten.
- source_word: ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: alle Völker der Erde
  rationale: „Völker“ ist im Deutschen die natürliche kollektive Wiedergabe von አሕዛብ; „der Erde“ erhält den universalen Umfang.
- source_word: ወይትባረኩ፡ ብከ
  choice: und in dir werden … gesegnet werden
  rationale: Erhält sowohl den Passivcharakter als auch die Wendung „in dir“, statt eine reflexive oder instrumentale Deutung festzulegen.
- source_word: ይረግሙከ / እረግሞሙ
  choice: dich verfluchen / werde ich verfluchen
  rationale: Die wiederholte Wortwurzel und die symmetrische Gegenüberstellung von Segen und Fluch werden gewahrt.
theological_decisions:
- issue: Bedeutung der Segensformel „in dir“
  choice: „in dir werden alle Völker der Erde gesegnet werden“
  alternative: „durch dich werden sich alle Völker der Erde Segen wünschen“
  rationale: Die passive Form des ge'ezischen Textes wird formal bewahrt. So wird weder eine ausschließlich instrumentale noch eine reflexive Auslegung in den Haupttext eingetragen.
- issue: Status Abrahams als Gesegneter oder als Segen
  choice: „du wirst auf der Erde gesegnet sein“
  alternative: „du wirst auf der Erde ein Segen sein“
  rationale: Der Ausgangstext verwendet eine Form mit der Bedeutung „gesegnet“, nicht ausdrücklich das Substantiv „Segen“; die Übersetzung vermeidet daher eine Angleichung an andere Fassungen der Abrahamverheißung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den ge'ezischen Wortlaut. Die wiederholten Satzverbindungen mit „und“ sowie die parallele Struktur von Segen und Fluch wurden beibehalten; „die, die“ ist bewusst verständlicher und weniger steif als „diejenigen, die“.
