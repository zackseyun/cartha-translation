lexical_decisions:
- source_word: አቡሁ
  choice: seines Vaters
  rationale: Der Vers setzt mitten in einer Satzverbindung aus dem vorhergehenden Kontext ein; der Genitiv bewahrt diesen fragmentarischen Anschluss.
- source_word: ወኮነት፡ ሎቱ፡ ብእሲተ
  choice: und sie wurde seine Frau
  rationale: Gibt die wörtliche Konstruktion ‚sie wurde ihm zur Frau‘ in natürlichem modernem Deutsch wieder.
- source_word: አሬን
  choice: Aran
  rationale: Folgt der Namensform der vorliegenden äthiopischen Edition und vermeidet eine unbelegte Angleichung.
- source_word: ዘሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet im Jubiläenbuch einen Zeitraum von sieben Jahren; ‚Jahrwoche‘ ist prägnant und erhält das kalendarische System des Textes.
- source_word: ወጸውዐ
  choice: und er nannte ihn
  rationale: Die Namensformel bleibt am Versende unvollständig; ‚nannte ihn‘ bewahrt diesen offenen Anschluss genauer als eine Ergänzung des fehlenden Namens.
