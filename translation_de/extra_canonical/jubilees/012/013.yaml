  text: And they arose in the night and wanted to rescue their gods from the midst of the fire. And Haran rushed
translation:
  language: de
  text: Da standen sie in der Nacht auf und wollten ihre Götter mitten aus dem Feuer retten. Und Haran stürzte los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Aran lief los.“'
    reason: Die Namensform kann enger als „Aran“ umschrieben und das Bewegungsverb allgemeiner mit „lief los“ wiedergegeben werden.
lexical_decisions:
- source_word: ተንሥኡ
  choice: standen … auf
  rationale: Das Verb bezeichnet hier das Aufstehen beziehungsweise Sich-Erheben; zusammen mit „in der Nacht“ ist „standen … auf“ natürlich und quellenah.
- source_word: ያድኅኑ
  choice: retten
  rationale: Die Kausativform drückt Retten oder In-Sicherheit-Bringen aus; „retten“ gibt den Versuch wieder, die Götter dem Feuer zu entreißen.
- source_word: አማልክቲሆሙ
  choice: ihre Götter
  rationale: Die Mehrzahl mit Possessivsuffix wird direkt wiedergegeben, ohne die polemische Spannung der Aussage abzuschwächen.
- source_word: አራን
  choice: Haran
  rationale: Die äthiopische Namensform bezeichnet die aus Genesis bekannte Gestalt Haran; die etablierte deutsche biblische Namensform erleichtert die Zuordnung.
- source_word: ሰረረ
  choice: stürzte los
  rationale: Das Verb kann ein plötzliches Losspringen, Eilen oder Stürmen bezeichnen. „stürzte los“ bewahrt die dynamische, kontextgerechte Bewegung stärker als das allgemeinere „lief“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die auffällige Aussage, Menschen wollten „ihre Götter“ retten, bleibt unverändert stehen. Der abschließende Satz ist trotz seiner inhaltlichen Fortsetzung im nächsten Vers gemäß der vorgegebenen Verssegmentierung aufgenommen.
