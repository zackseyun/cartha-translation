base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/005.yaml
  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: de
  text: Kein Geist ist in ihnen, denn sie sind von Händen gemacht. Ihr tragt sie auf euren Schultern, und von ihnen kommt euch keine Hilfe, sondern nur große Schande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈስ
  choice: Geist
  rationale: Die direkte und kontextuell passende Wiedergabe bezeichnet das fehlende Lebens- beziehungsweise Geistprinzip der Götzen.
- source_word: ግብረ፡ እደው
  choice: das Werk von Händen
  rationale: Bewahrt die konkrete, polemische Formulierung des Ausgangstextes und bleibt im Deutschen verständlich.
- source_word: ትጸውርዎሙ
  choice: ihr tragt sie
  rationale: Gibt das Tragen der Götzen unmittelbar wieder, ohne die nicht belegte Ergänzung einzuführen, sie seien eine Last.
- source_word: ረድኤት
  choice: Hilfe
  rationale: Entspricht dem Sinn von Beistand oder Unterstützung in diesem Zusammenhang.
- source_word: ዘእንበለ፡ ሐሳር፡ ዐቢይ
  choice: sondern nur große Schande
  rationale: Die ausschließende Wendung wird idiomatisch als Kontrast wiedergegeben; ሐሳር bezeichnet hier Schande beziehungsweise Erniedrigung.
theological_decisions:
- issue: Aussage, dass in den Götzen kein Geist ist
  choice: Kein Geist ist in ihnen
  alternative: Sie haben keinen Lebensgeist
  rationale: Die knappe Form wahrt die Mehrdeutigkeit von መንፈስ und erläutert nicht über den Ausgangstext hinaus.
- issue: Schlusskontrast zwischen fehlender Hilfe und Schande
  choice: sondern nur große Schande
  alternative: außer großer Schande
  rationale: Die gewählte Fassung klingt natürlich und erhält den polemischen Gegensatz, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die bildhafte Rede vom Werk der Hände und vom Tragen auf den Schultern bleibt erhalten. Keine unbelegte Aussage, die Götzen seien eine Last, wurde ergänzt.
