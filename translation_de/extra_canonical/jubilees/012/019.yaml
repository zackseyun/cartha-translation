  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: de
  text: 'Und in jener Nacht sagte er: „Mein Gott, Gott, der Höchste, du allein bist mein Gott. Du hast alles erschaffen, und alles, was existiert, ist das Werk deiner Hände. Dich und deine Herrschaft[a] habe ich erwählt. Rette mich!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte Textform ist offenbar fehlerhaft; andere Textzeugen beziehungsweise die erschlossene Lesart bieten „deine Herrschaft“.
    reason: textual_variant
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: Gott, der Höchste
  rationale: Gibt die Gottesbezeichnung wörtlich und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ
  choice: du allein bist mein Gott
  rationale: Bewahrt die emphatische Exklusivität von ባሕቲትከ und gibt ሊተ idiomatisch als possessive Beziehung wieder.
- source_word: ኵሎ፡ ፈጠርከ
  choice: du hast alles erschaffen
  rationale: Das umfassende Objekt ኵሎ wird unverkürzt wiedergegeben.
- source_word: ግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ
  choice: alles, was existiert, ist das Werk deiner Hände
  rationale: Folgt der Aussage über die Gesamtheit des Seienden und erhält das konkrete Bild vom Werk der Hände.
- source_word: ወኪያከ፡ ወመሰክንከ፡ ኀረይኩ
  choice: Dich und deine Herrschaft habe ich erwählt
  rationale: ኪያከ ist das betonte Objekt „dich“. Für das zweite Objekt wird die als ursprüngliche Lesart erschlossene Form መኰንንከ („deine Herrschaft“) zugrunde gelegt; die vorgelegte Form gilt als fehlerhafte Textgestalt.
- source_word: አድኅነኒ
  choice: Rette mich!
  rationale: Gibt die abschließende Bitte direkt und mit ihrem imperativischen Nachdruck wieder.
theological_decisions:
- issue: Exklusives Gottesbekenntnis
  choice: du allein bist mein Gott
  alternative: du allein bist Gott für mich
  rationale: Die gewählte Fassung ist natürliches Deutsch und wahrt sowohl die Ausschließlichkeit als auch den persönlichen Bezug, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
- issue: Erwählung Gottes und seiner Herrschaft
  choice: Dich und deine Herrschaft habe ich erwählt
  alternative: Ich habe dich und deine Herrschaft gewählt
  rationale: Die Voranstellung von „Dich“ erhält den Nachdruck des Quelltexts; „erwählt“ passt zum feierlichen Gebetsregister, ohne eine bestimmte Lehre von Erwählung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Kurze Hauptsätze bewahren die feierliche Direktheit und den Aufbau des ge’ezischen Textes.
