  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: de
  text: Und ich öffnete seinen Mund, seine Ohren und seine Lippen und begann, mit ihm auf Hebräisch zu sprechen, in der Sprache der Schöpfung. Und er nahm die Bücher seiner Väter; sie waren auf Hebräisch geschrieben. Er schrieb sie ab und begann von da an, sie zu studieren. Und ich ließ ihn alles verstehen, was er nicht begreifen konnte. Und er studierte sie während der sechs Regenmonate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕብራይስጥ
  choice: auf Hebräisch
  rationale: Gibt die Sprachbezeichnung unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: በልሳነ፡ ፍጥረታት
  choice: in der Sprache der Schöpfung
  rationale: Bewahrt die auffällige wörtliche Bezeichnung und ihre mögliche theologische Bedeutung, ohne sie auszudeuten.
- source_word: ወደገሞን
  choice: Er schrieb sie ab
  rationale: Das Verb bezeichnet hier das Wiederholen beziehungsweise Vervielfältigen der Bücher; im Zusammenhang ist „abschreiben“ die natürliche deutsche Wiedergabe.
- source_word: ወአነ፡ አየድዖ፡ ኵሎ፡ ዘይስእኖ
  choice: Und ich ließ ihn alles verstehen, was er nicht begreifen konnte
  rationale: Gibt den Sinn des Bekanntmachens oder Erschließens wieder und vermeidet die im Deutschen schwerfällige Formulierung „machte ihm alles bekannt, was er nicht vermochte“.
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: die sechs Regenmonate
  rationale: Bewahrt die konkrete jahreszeitliche Zeitangabe des Ge'ez; „Regenmonate“ ist knapper und natürlicher als „Monate des Regens“.
theological_decisions:
- issue: Hebräisch als „Sprache der Schöpfung“
  choice: Die Aussage bleibt als direkte Gleichsetzung stehen.
  alternative: „Hebräisch, die ursprüngliche Sprache der Schöpfung“
  rationale: Der Zusatz „ursprüngliche“ wäre eine interpretierende Präzisierung, die im Wortlaut nicht ausdrücklich vorhanden ist.
- issue: Übernatürliche Befähigung Abrahams
  choice: Die Ich-Stimme öffnet seine Sprech- und Hörorgane und erschließt ihm Unverstandenes.
  alternative: Die Vorgänge als bloße Unterweisung oder Heilung erklären.
  rationale: Der Text lässt Identität und genaue Wirkungsweise der sprechenden Gestalt hier offen; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Ich-Perspektive und die sachliche Erzählfolge bleiben erhalten. Keine Fußnoten erforderlich, da die markanten Formulierungen im Haupttext verständlich und quellennah wiedergegeben werden.
