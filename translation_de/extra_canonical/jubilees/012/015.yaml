lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ
  choice: vor seinem Vater Terach
  rationale: Gibt die fortgesetzte Satzwendung des Versanfangs eng wieder, ohne ein im vorliegenden Quelltext nicht ausgedrücktes Verb zu ergänzen.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ur bei den Chaldäern
  rationale: Bewahrt die Zuordnung Urs zu den Chaldäern in natürlichem Deutsch, ohne das im Äthiopischen nicht ausdrücklich stehende Wort „Land“ einzufügen.
- source_word: ወውሉዱ
  choice: und seine Söhne
  rationale: Das Substantiv bezeichnet hier Terachs männliche Nachkommen; „Söhne“ entspricht dem erzählerischen Zusammenhang und der traditionellen Familienangabe.
- source_word: ከመ፡ ይምጽኡ
  choice: um … zu ziehen
  rationale: Gibt die Ziel- beziehungsweise Absichtskonstruktion idiomatisch wieder.
- source_word: ወኀደረ
  choice: ließ sich … nieder / wohnte
  rationale: Dasselbe Verb bezeichnet in beiden Teilsätzen das Verweilen oder Wohnen. Die kontextgerechte Variation vermeidet im Deutschen eine schwerfällige Wiederholung, ohne den Sinnunterschied zu vergrößern.
- source_word: ካራን
  choice: Haran
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufige Form des Ortsnamens.
