  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: de
  text: vor seinem Vater Terach.[a] Und sie begruben ihn in Ur der Chaldäer. Terach zog aus Ur der Chaldäer fort, er und seine Söhne, um in das Land Libanon und in das Land Kanaan zu ziehen. Er ließ sich im Land Haran nieder, und Abram wohnte mit seinem Vater Terach in Haran.
