  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: de
  text: '„[Sie sind eine Täuschung] für die, die sie anfertigen,[a] und eine Verwirrung des Herzens für die, die sie anbeten. Bete sie nicht an!“ Sein Vater erwiderte: „Auch ich weiß das, mein Sohn. Doch was kann ich gegen ein Volk ausrichten, das mich zum Dienen gezwungen hat?[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ge’ez-Text setzt hier den Gedanken aus dem vorhergehenden Vers fort; die Wörter in eckigen Klammern sind sinngemäß ergänzt.
    reason: source_ellipsis
  - marker: b
    text: 'Oder: „das mich zum Gehorsam gezwungen hat?“'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ይገብርዎሙ
  choice: sie anfertigen
  rationale: Das Verb bezeichnet hier das Herstellen der zuvor genannten Götzen; „anfertigen“ ist im Deutschen eindeutig und natürlich.
- source_word: ከሕተት፡ ልብ
  choice: eine Verwirrung des Herzens
  rationale: Die Formulierung bewahrt die innere, das Herz betreffende Irreführung bzw. Verwirrung, ohne sie psychologisch oder theologisch weiter auszudeuten.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: sie anbeten / Bete sie nicht an
  rationale: „Anbeten“ gibt den kultischen Sinn im Zusammenhang mit Götzen klar und idiomatisch wieder.
- source_word: እትአዘዝ
  choice: zu dienen
  rationale: Das Verb trägt den Sinn von gehorchen, sich unterordnen oder dienen. Im Kontext wird „dienen“ gewählt, während das im Ge’ez nicht ausdrücklich genannte Dienstobjekt unausgesprochen bleibt.
theological_decisions:
- issue: Ergänzung des am Versanfang nur impliziten Prädikats
  choice: „[Sie sind eine Täuschung]“ in eckigen Klammern
  alternative: „Schande kommt über die, die sie anfertigen“
  rationale: Der Ge’ez-Text beginnt mit „für die, die sie machen“ und setzt offenbar den Gedanken aus Vers 5 fort. Die gekennzeichnete Ergänzung stellt den syntaktischen Zusammenhang her, ohne den im Quelltext nicht vorhandenen Begriff „Schande“ einzuführen.
- issue: Bedeutung der abschließenden Aussage des Vaters
  choice: „das mich gezwungen hat zu dienen“
  alternative: „das mich in die Irre geführt hat“ oder „das mich gezwungen hat zu gehorchen“
  rationale: Die Grundbedeutung weist auf Gehorsam, Unterordnung oder Dienst, nicht auf Irreführung. Die gewählte Formulierung wahrt zugleich die Offenheit darüber, wem oder was er dienen muss.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; die Ellipse am Versanfang wird sichtbar ergänzt, und die Mehrdeutigkeit des abschließenden Verbs wird in einer Fußnote bewahrt.
