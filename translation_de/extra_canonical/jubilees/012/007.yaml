  text: before them? And if I speak the truth to them, they will kill me, for their souls cling to them.
translation:
  language: de
  text: vor ihnen? Und wenn ich ihnen die Wahrheit[a] sage, werden sie mich töten, denn ihre Seelen hängen an ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Gerechtigkeit spreche«.'
    reason: Bewahrt die wörtlichere substantivische Bedeutung von ጽድቀ.
lexical_decisions:
- source_word: ጽድቀ
  choice: die Wahrheit
  rationale: Das Substantiv kann »Gerechtigkeit« bezeichnen; in Verbindung mit »sagen« gibt »die Wahrheit sagen« den kontextuellen Sinn im modernen Deutschen natürlich wieder, ohne die wörtlichere Möglichkeit zu verschweigen.
- source_word: ተለውት፡ ነፍሶሙ፡ ኀቤሆሙ
  choice: ihre Seelen hängen an ihnen
  rationale: Bewahrt das bildhafte Reden von den Seelen und deren starker innerer Bindung an die zuvor genannten Gegenstände.
theological_decisions:
- issue: Wiedergabe von ጽድቀ als Wahrheit oder Gerechtigkeit
  choice: die Wahrheit sagen
  alternative: Gerechtigkeit verkünden / von Gerechtigkeit sprechen
  rationale: Der unmittelbare Zusammenhang beschreibt eine Äußerung, die wegen ihrer Wahrhaftigkeit tödlichen Widerstand hervorruft. Die substantivische Grundbedeutung »Gerechtigkeit« bleibt in der Fußnote sichtbar.
