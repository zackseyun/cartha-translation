  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
translation:
  language: de
  text: 'Zwei Jahrwochen[a]. Und in der sechsten Jahrwoche, in deren fünftem Jahr, saß Abram in der Nacht zu Beginn des siebten Monats[b] da, um die Sterne vom Abend bis zum Morgengrauen zu beobachten und zu sehen, wie sich das Jahr im Blick auf die Regenfälle entwickeln würde. Er war dort allein, saß da und beobachtete. Da kam ein Wort in sein Herz, und er sagte: »Alle Zeichen der Sterne und ihre Zeichen …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine »Jahrwoche« ist ein Zeitraum von sieben Jahren. Das Jubiläenbuch zählt Zeit regelmäßig nach Jubiläen, Jahrwochen und Jahren.
    reason: cultural_note
  - marker: b
    text: Die Formulierung kann genauer den Aufgang des Mondes beziehungsweise den Neumond bezeichnen, mit dem der siebte Monat begann.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: Jahrwochen
  rationale: Die Wendung bezeichnet Siebenerperioden von Jahren. Das im Deutschen verständliche Kompositum bewahrt die kalendarische Zählweise knapp.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: zu Beginn des siebten Monats
  rationale: ሠርቀ ወርኅ kann den Aufgang beziehungsweise den Neumond und damit den Monatsbeginn bezeichnen. Die Hauptübersetzung bleibt allgemein; die engere Deutung wird in einer Fußnote genannt.
- source_word: ከመ፡ ያበይነ፡ ከዋክብተ
  choice: um die Sterne … zu beobachten
  rationale: Das Verb bezeichnet ein prüfendes beziehungsweise genaues Betrachten. »beobachten« passt zum nächtlichen Verfolgen der Sterne.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: wie sich das Jahr im Blick auf die Regenfälle entwickeln würde
  rationale: Die wörtliche Rede vom »Werk des Jahres« wird idiomatisch als erwarteter Jahresverlauf wiedergegeben, ohne den Bezug auf die Regenfälle zu verengen.
- source_word: ወመጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: Da kam ein Wort in sein Herz
  rationale: Die konkrete Bildsprache des Ausgangstextes wird bewahrt und nicht vorzeitig als göttliche Offenbarung oder bloßer Gedanke gedeutet.
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: Alle Zeichen der Sterne und ihre Zeichen …
  rationale: Die auffällige Wiederholung des Quelltextes wird erhalten, da der Satz am Versende unvollständig weiterführt und nicht stillschweigend geglättet werden soll.
theological_decisions:
- issue: Ursprung des Wortes in Abrams Herz
  choice: »ein Wort« ohne ausdrückliche Zuschreibung an Gott
  alternative: »Gott gab ihm ein Wort ins Herz« oder »ihm kam ein Gedanke«
  rationale: Der Quelltext nennt weder ausdrücklich Gott als Sprecher noch reduziert er das Wort auf einen gewöhnlichen Gedanken. Die Übersetzung bewahrt diese Offenheit.
- issue: Deutung der Sternbeobachtung
  choice: neutrale Beschreibung als Beobachtung der Sterne
  alternative: ausdrückliche Bezeichnung als Astrologie oder Wahrsagerei
  rationale: Der Vers beschreibt Zweck und Vorgang, versieht sie hier aber nicht ausdrücklich mit einer theologischen Wertung. Eine solche Einordnung wird daher nicht eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kalendarische Fachsprache bleibt mit »Jahrwoche« erkennbar; ungewohnte Bildsprache und die abgebrochene, repetitive Schlussformulierung werden bewusst bewahrt. Die Auslassungspunkte zeigen an, dass die Rede über die Versgrenze hinausführt.
