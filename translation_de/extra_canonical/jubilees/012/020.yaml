  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: de
  text: 'Befreie mich aus der Hand der bösen Geister, die über die Gedanken des menschlichen Herzens herrschen, und lass nicht zu, dass sie mich davon abbringen, dir zu folgen, mein Gott. Festige mich und meine Nachkommen für immer, damit wir von nun an bis in Ewigkeit nicht in die Irre gehen.« Und er sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእዴ
  choice: aus der Hand
  rationale: Gibt die ge'ezische Wendung wörtlich und zugleich idiomatisch als Ausdruck von Macht beziehungsweise Gewalt wieder.
- source_word: መናፍስት፡ እኩያን
  choice: böse Geister
  rationale: Direkte und natürliche Wiedergabe des Plurals mit nachgestelltem Adjektiv.
- source_word: ይስልጡ
  choice: herrschen
  rationale: Bewahrt den Gedanken tatsächlicher Macht oder Vorherrschaft und schwächt ihn nicht zu bloßer Beeinflussung ab.
- source_word: ውስተ፡ ሕሊና፡ ልበ፡ ሰብእ
  choice: über die Gedanken des menschlichen Herzens
  rationale: Folgt der überlieferten syntaktischen Deutung und bewahrt die anthropologische Verbindung von Denken und Herz, ohne sie modern psychologisierend aufzulösen.
- source_word: ወአይስሕቱኒ፡ እምድኅሬከ
  choice: und lass nicht zu, dass sie mich davon abbringen, dir zu folgen
  rationale: Gibt die Bitte in natürlichem Deutsch wieder; der Gedanke des Abirrens von der Nachfolge Gottes bleibt erhalten.
- source_word: ወትረሰየኒ
  choice: Festige mich
  rationale: Vermittelt das Erbetene als dauerhaftes Gründen oder Festmachen, ohne über den Wortlaut hinaus einen Ort oder ein 'vor dir' einzufügen.
- source_word: ኪያየ፡ ወዘርእየ
  choice: mich und meine Nachkommen
  rationale: ኪያየ ist das selbstständige Akkusativpronomen 'mich' und steht mit 'meine Nachkommen' als zusammengesetztes Objekt; es bedeutet hier nicht 'vor dir'.
- source_word: ለዓለም
  choice: für immer / in Ewigkeit
  rationale: Die stilistisch variierte Wiedergabe entspricht in beiden Vorkommen dem Gedanken unbegrenzter Dauer.
- source_word: ወይቤ
  choice: 'Und er sprach:'
  rationale: Die abschließende narrative Einleitung gehört zum Vers und leitet die folgende Rede ein.
theological_decisions:
- issue: Macht böser Geister über das menschliche Innere
  choice: die über die Gedanken des menschlichen Herzens herrschen
  alternative: die die Gedanken des menschlichen Herzens beeinflussen
  rationale: Die stärkere Aussage des Quellverbs wird bewahrt, ohne daraus eine umfassende Lehre über menschliche Verantwortung oder dämonische Kontrolle abzuleiten.
- issue: Objekt der Bitte um Festigung
  choice: mich und meine Nachkommen
  alternative: mich und meine Nachkommen vor dir
  rationale: Im ge'ezischen Text fehlt eine Wendung für 'vor dir'; ኪያየ bezeichnet 'mich'. Die alternative Lesart würde einen theologischen Beziehungsaspekt hinzufügen, der hier nicht ausdrücklich steht.
- issue: Numerus beim Abirren
  choice: damit wir ... nicht in die Irre gehen
  alternative: damit ich ... nicht in die Irre gehe
  rationale: Der Plural entspricht der Bitte für den Sprecher und seine Nachkommen und bewahrt den kollektiven Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache bleibt unmittelbar und ernst; ungewöhnliche Quellbilder wie die Gedanken des Herzens werden nicht eingeebnet. Das offene Ende „Und er sprach:“ ist als erzählerischer Anschluss des Verses erhalten.
