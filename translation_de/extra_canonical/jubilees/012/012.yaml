  yaml_path: translation/extra_canonical/jubilees/012/012.yaml
  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: de
  text: Und im sechzigsten Lebensjahr Abrams – das war in der vierten Woche, in deren viertem Jahr – stand Abram nachts auf und verbrannte das Haus der Götzenbilder. Er verbrannte alles, was sich im Haus befand, und niemand wusste davon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤተ፡ ጣዖታት
  choice: das Haus der Götzenbilder
  rationale: Gibt die Verbindung aus „Haus“ und dem Plural „Götzen/Götzenbilder“ direkt wieder, ohne das Gebäude enger als „Tempel“ zu bestimmen.
- source_word: አውዐየ
  choice: verbrannte
  rationale: Bewahrt die im Ausgangstext zweimal wiederholte Brandhandlung und lässt offen, ob das Haus vollständig niederbrannte.
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: niemand wusste davon
  rationale: Natürliches modernes Deutsch für die Aussage, dass keine Person von der Tat Kenntnis hatte.
