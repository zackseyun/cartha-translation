review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von መናቅፅ als „Eingeweiden“ ist quellengetreu; die ältere Alternative „Lenden“ ist zu Recht nur als frühere Wiedergabe vermerkt. Dagegen bedeutet ትብልእ in der vorliegenden geʽezischen Textform „du sollst essen/verzehren“. „Abtrennen“ ist eine kontextgeleitete Harmonisierung mit Opfervorschriften und kann nicht als Haupttext stehen, auch nicht mit erläuternder Fußnote. Die Spannung zur anschließenden Darbringung sollte erhalten bleiben.
  naturalness: Die Syntax ist gut verständlich und hat einen angemessen würdigen kultischen Ton. „Das Fett auf den Eingeweiden“ ist im Deutschen natürlich. „Mit dem dazugehörigen Opfer“ ist idiomatischer und macht die possessive Beziehung ohne ein missverständliches maskulines Pronomen deutlich.
  terminology: „HERR“ ist für እግዚአብሔር angemessen. „Angenehmer, wohlgefälliger Duft“ gibt die kultische Duft- und Annahmeformel vertretbar wieder. መሥዋዕቱ sollte allgemein als „das dazugehörige Opfer“ wiedergegeben werden; „Speisopfer“ wäre in dieser Vorlage eine nicht ausdrücklich bezeichnete Spezifizierung.
  issues:
  - severity: high
    issue: „sollst du abtrennen“ steht anstelle von „sollst du verzehren“.
    rationale: Das in der Vorlage stehende Verb ትብልእ hat die Grund- und direkte Satzbedeutung „du wirst essen/du sollst essen“. Der Opferkontext kann einen textkritischen oder traditionsgeschichtlichen Erklärungsbedarf anzeigen, erlaubt aber keine Ersetzung des überlieferten Wortlauts durch „abtrennen“.
  - severity: medium
    issue: Fußnote b beschreibt eine kontextuelle Umdeutung als Bedeutung der Übersetzung.
    rationale: Die Fußnote darf die ungewöhnliche Spannung im Text erläutern, soll aber nicht behaupten, der Kontext lege gegen die eindeutige Verbform „abtrennen“ nahe.
  revised_text: Das Fett, das auf ihnen liegt, und das Fett auf den Eingeweiden[a] sowie die Leber mit den Nieren sollst du verzehren.[b] Das alles sollst du zusammen mit dem dazugehörigen Opfer[c] als angenehmen, wohlgefälligen Duft vor dem HERRN darbringen.
  revised_footnotes:
  - marker: a
    text: 'Oder nach älterer Wiedergabe: „Lenden“.'
    reason: previous_rendering
  - marker: b
    text: 'Wörtlich: „sollst du essen/verzehren“. Dies steht in Spannung dazu, dass alles Folgende als Opfer dargebracht werden soll; möglicherweise liegt eine abweichende Überlieferung oder eine im Text nicht aufgelöste kultische Anweisung vor.'
    reason: source_ambiguity
  - marker: c
    text: Die äthiopische Vorlage nennt allgemein ein „Opfer“; andere Wiedergaben verstehen hier ein Speisopfer.
    reason: lexical_precision
  revision_rationale: Der Haupttext wird beim eindeutig belegten Verb ትብልእ auf „verzehren“ zurückgeführt. Die sachliche Schwierigkeit wird transparent in einer zurückhaltenden Fußnote angezeigt, ohne den überlieferten Wortlaut an biblische Paralleltexte anzugleichen. Die übrigen Entscheidungen bleiben im Wesentlichen bestehen; die Formulierung zum Possessivsuffix bei „Opfer“ wird idiomatischer gefasst.
