  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: de
  text: Das Fett, das auf ihnen liegt, und das Fett auf den Eingeweiden[a] sowie die Leber mit den Nieren sollst du abtrennen.[b] Das alles sollst du zusammen mit seinem Opfer[c] als angenehmen, wohlgefälligen Duft vor dem HERRN darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach älterer Wiedergabe: „Lenden“.'
    reason: previous_rendering
  - marker: b
    text: Das äthiopische Verb bedeutet wörtlich „essen“ oder „verzehren“; der Opferzusammenhang legt hier „abtrennen“ nahe.
    reason: source_ambiguity
  - marker: c
    text: Die äthiopische Vorlage nennt allgemein ein „Opfer“; andere Wiedergaben verstehen hier ein Speisopfer.
    reason: lexical_precision
lexical_decisions:
- source_word: መናቅፅ
  choice: Eingeweide
  rationale: Das Wort bezeichnet die inneren Organe beziehungsweise Eingeweide; dies passt auch zum Opferkontext. Die ältere Wiedergabe „Lenden“ wird wegen der Überlieferungsgeschichte in einer Fußnote genannt.
- source_word: ትብልእ
  choice: sollst du abtrennen
  rationale: Die Grundbedeutung des Verbs ist „essen, verzehren“. Da die genannten Teile unmittelbar danach als Opfer dargebracht werden sollen, gibt „abtrennen“ den im Zusammenhang erforderlichen Handlungssinn wieder; die auffällige wörtliche Bedeutung wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
- source_word: ለመዐዛ፡ ሠናይ፡ ዘይሠጠው
  choice: als angenehmen, wohlgefälligen Duft
  rationale: Die Formulierung bezeichnet einen guten Duft, der angenommen beziehungsweise als wohlgefällig erachtet wird. Die deutsche Doppelung bewahrt sowohl den Duftbegriff als auch den Gedanken der Annahme.
- source_word: እግዚአብሔር
  choice: HERR
  rationale: Die traditionelle Gottesbezeichnung wird in würdigem, bibelsprachlich vertrautem Deutsch wiedergegeben.
- source_word: መሥዋዕቱ
  choice: seinem Opfer
  rationale: Das äthiopische Wort bedeutet allgemein „Opfer“ und spezifiziert hier nicht ausdrücklich ein Speisopfer. Das Possessivsuffix bleibt mit „seinem“ erhalten.
theological_decisions:
- issue: Annahme des Opferduftes vor Gott
  choice: „als angenehmen, wohlgefälligen Duft vor dem HERRN“
  alternative: „zu einem guten Duft, der vor dem Herrn angenommen wird“
  rationale: Die gewählte Fassung bewahrt die kultische Aussage, ohne eine besondere Lehre über die Wirkungsweise des Opfers hinzuzufügen.
- issue: Art des begleitenden Opfers
  choice: allgemein „Opfer“
  alternative: „Speisopfer“
  rationale: Der vorgelegte ge’ezische Wortlaut nennt nur ein Opfer allgemein. Eine Festlegung auf ein Speisopfer wäre stärker spezifizierend als die unmittelbare Quelle.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Ton. Die Satzfolge bleibt nahe an der ge’ezischen Vorlage; schwer verständliche Quellenprobleme werden durch knappe Fußnoten offengelegt, statt stillschweigend harmonisiert zu werden.
