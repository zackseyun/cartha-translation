  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: de
  text: 'dem Herrn. Das Fett des Rettungsopfers sollst du auf das Feuer legen, das auf dem Altar ist: das Fett, das auf den Eingeweiden ist, und alles Fett, das an den inneren Teilen ist, und die beiden Nieren und alles[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird in Vers 9 fortgesetzt.
    reason: Die überlieferte Versgrenze unterbricht die Aufzählung nach „alles“; die Anmerkung verhindert, dass der absichtlich unvollständige Schluss als Textfehler missverstanden wird.
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: Rettungsopfer
  rationale: Die Verbindung bezeichnet wörtlich ein Opfer der Rettung bzw. des Heils. „Rettungsopfer“ gibt መድኃኒት transparent wieder, ohne die Opferart durch eine konfessionell geprägte Fachbezeichnung enger festzulegen.
- source_word: መሥዋዕት
  choice: Altar
  rationale: Obwohl das Wort auch „Opfer“ bedeuten kann, verlangt der Zusammenhang hier den Ort des Feuers; daher ist „Altar“ die sachgerechte Bedeutung.
- source_word: ከርሥ
  choice: Eingeweide
  rationale: Bezeichnet im Opferkontext die inneren Organe bzw. Eingeweide.
- source_word: ንዋየ፡ ውስት
  choice: innere Teile
  rationale: Eine bewusst allgemeine Wiedergabe der wörtlichen Bezeichnung für das Innere bzw. die inneren Teile; sie vermeidet eine unbelegte anatomische Präzisierung.
- source_word: ኵሎ
  choice: alles
  rationale: Das Wort bedeutet „alles“ bzw. „das Ganze“. Die Wiedergabe „beide“ wäre trotz der unmittelbar vorausgehenden zwei Nieren lexikalisch nicht gerechtfertigt; der Satz läuft über die Versgrenze hinweg weiter.
theological_decisions:
- issue: Bezeichnung der Opferart
  choice: Rettungsopfer
  alternative: Heilsopfer / Gemeinschaftsopfer
  rationale: „Rettungsopfer“ wahrt den semantischen Bezug von መድኃኒት auf Rettung oder Heil und vermeidet, den Ausdruck ohne ausreichenden Textgrund vollständig mit einer bestimmten levitischen Opferkategorie gleichzusetzen.
translation_notes:
  register: 'Moderne, würdige Standardsprache mit klarer kultischer Terminologie. Die fragmentarischen Grenzen des Verses werden beibehalten: Der Anfang setzt den vorherigen Satz fort, und der Schluss läuft in Vers 9 weiter.'
