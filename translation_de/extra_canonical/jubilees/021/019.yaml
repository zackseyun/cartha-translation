  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: de
  text: … überhaupt Blut, denn es ist das Leben[a]; und iss keinerlei Blut. Nimm auch kein Geschenk wegen des Blutes irgendeines Menschen an, damit es nicht ungestraft, ohne Urteil, vergossen wird. Denn vergossenes Blut verunreinigt die Erde, und die Erde kann vom Blut eines Menschen nur durch das Blut dessen gereinigt werden, der es vergossen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Seele«.'
    reason: Das ge’ezische ነፍስ kann sowohl »Leben« als auch »Seele« bezeichnen.
lexical_decisions:
- source_word: ነፍስ
  choice: Leben
  rationale: Das Wort kann »Seele« oder »Leben/Lebenskraft« bedeuten. Im Zusammenhang des Verbots, Blut zu essen, gibt »Leben« die gemeinte Beziehung natürlich und verständlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ሕልያነ
  choice: Geschenk
  rationale: Die Wendung bezeichnet hier eine Gabe, die im Zusammenhang mit vergossenem Menschenblut angenommen wird, sachlich also eine Zahlung oder Bestechung. »Geschenk« hält sich eng an die Ausdrucksweise des Ausgangstextes, ohne die Art der Gabe stärker festzulegen.
- source_word: በከ
  choice: ungestraft
  rationale: Das Adverb bedeutet hier »vergeblich/umsonst« beziehungsweise im Kontext »ungestraft, straflos«. »Ungestraft« macht deutlich, dass das Blutvergießen ohne rechtliche Ahndung bleiben soll.
- source_word: ይትከዐው
  choice: vergossen wird
  rationale: Das Verb bedeutet »ausgegossen/vergossen werden« und bezieht sich auf Blut; eine Wiedergabe als »eingefordert werden« wäre nicht quellengerecht.
- source_word: ያንጥኦ
  choice: verunreinigt
  rationale: Im Zusammenhang mit Blut und der anschließenden Reinigung der Erde bezeichnet das Verb kultische beziehungsweise moralische Verunreinigung.
theological_decisions:
- issue: Blut als ነፍስ
  choice: »Leben« im Text, »Seele« als Fußnotenalternative
  alternative: »Seele« im Haupttext
  rationale: Die Aussage identifiziert das Blut mit Leben beziehungsweise Lebenskraft. Die Übersetzung wahrt zugleich die lexikalische und anthropologische Spannung, ohne eine bestimmte Seelenlehre festzuschreiben.
- issue: Reinigung der Erde durch das Blut des Täters
  choice: Die Vergeltungsformel wird ohne Abschwächung oder erläuternde Harmonisierung wiedergegeben.
  alternative: Eine verallgemeinernde Wiedergabe wie »nur durch die Bestrafung des Schuldigen«
  rationale: Der Ausgangstext spricht ausdrücklich vom Blut dessen, der das Menschenblut vergossen hat. Diese theologisch und ethisch spannungsreiche Aussage darf nicht stillschweigend umgedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Mahnrede und die Wiederholung von »Blut« bleiben als prägende Stilmerkmale erhalten. Der eröffnende Ausdruck ist aufgrund des überlieferten Verszuschnitts syntaktisch an den vorhergehenden Zusammenhang angeschlossen.
