base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/015.yaml
  text: Keep this command and do it[15], my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you go up to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, return.
translation:
  language: de
  text: Halte dieses Gebot und befolge es, mein Sohn,[a] damit du in allem, was du tust, recht handelst. Halte deinen Körper jederzeit rein und wasche dich mit Wasser, bevor du hinaufgehst, um auf dem Altar zu opfern. Wasche auch deine Hände und deine Füße, bevor du an den Altar trittst; und wenn du das Opfer dargebracht hast, kehre zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der vorliegenden Gliederung des ge’ezischen Textes folgt auf Vers 15 unmittelbar Vers 17; sie enthält keinen eigenständigen Textabschnitt für Vers 16.
    reason: segmentation_note
lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ
  choice: Halte dieses Gebot und befolge es
  rationale: Gibt sowohl den Imperativ des Bewahrens bzw. Haltens als auch den ausdrücklichen Vollzug des Gebots wieder.
- source_word: ታርትዕ፡ በኵሉ፡ ግብርከ
  choice: damit du in allem, was du tust, recht handelst
  rationale: Bewahrt den finalen Sinn und gibt das rechte bzw. geradlinige Handeln in natürlichem modernem Deutsch wieder.
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ
  choice: Sei zu jeder Zeit rein an deinem Körper
  rationale: Die körperliche Reinheit wird ausdrücklich beibehalten, ohne sie vorschnell nur als moralische oder nur als rituelle Reinheit auszulegen.
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  choice: bevor du hinaufgehst, um auf dem Altar zu opfern
  rationale: Das Verb des Hinaufgehens wird explizit wiedergegeben; der Opferkontext bestimmt den Zweck.
- source_word: ግባእ
  choice: kehre zurück
  rationale: Der Imperativ bezeichnet hier die Rückkehr bzw. das Zurückgehen und nicht das Hineingehen.
theological_decisions:
- issue: Art der geforderten Reinheit
  choice: rein an deinem Körper
  alternative: körperlich rein / rituell rein
  rationale: Die Formulierung hält die ausdrücklich körperliche Dimension fest, legt aber nicht über den Quelltext hinaus fest, wie technisch-rituell der Begriff zu verstehen ist.
- issue: Bedeutung des abschließenden Imperativs
  choice: kehre zurück
  alternative: geh hinein
  rationale: Die ge’ezische Verbform stützt „zurückkehren“; die ältere Alternative beruht auf der Verwechslung mit einem anderen Verb.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. „Mein Sohn“ und die Folge der Imperative bewahren den väterlich-lehrhaften Ton; unnötige Fachsprache wird vermieden.
