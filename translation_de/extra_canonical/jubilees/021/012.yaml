base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: de
  text: 'deine Opfergaben vor dem Herrn. Achte sorgfältig auf das Holz für das Opfer: Bring für den Altar kein anderes Holz als Zypresse, Tanne, Mandelbaum, Kiefer, Pechkiefer, Zeder, Wacholder, Waldrebe, Olive, Myrte, Lorbeer und Zeder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bestimmung einzelner in der Pflanzenliste genannten Arten ist unsicher; die beiden mit »Zeder« wiedergegebenen Wörter sind im ge'ezischen Text verschieden.
    reason: Die antiken Pflanzennamen lassen sich botanisch nicht durchweg sicher bestimmen, und die scheinbare Doppelung sollte nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: deine Opfergaben
  rationale: Das Substantiv bezeichnet Opfer bzw. Opfergaben; der deutsche Plural passt zum zusammenhängenden kultischen Kontext und zur englischen Konsultationsfassung.
- source_word: ዕፀወ፡ መሥዋዕት
  choice: das Holz für das Opfer
  rationale: Gibt die Verbindung von »Holz« und »Opfer« natürlich wieder, ohne መሥዋዕት mit dem anschließend bezeichneten Altar gleichzusetzen.
- source_word: ምሥዋዕ
  choice: Altar
  rationale: Hier bezeichnet die abweichende Form den Altar, nicht nochmals die Opfergabe.
- source_word: ዲበ፡ ዝንቱ
  choice: kein anderes Holz als
  rationale: Die Wendung wird im Zusammenhang als ausschließende Beschränkung auf die folgende Liste verstanden; so wird das Verbot nicht irrtümlich gegen die aufgezählten Holzarten gerichtet.
- source_word: ቍጲርሳን፡ … ቄዳር
  choice: Zypresse, Tanne, Mandelbaum, Kiefer, Pechkiefer, Zeder, Wacholder, Waldrebe, Olive, Myrte, Lorbeer und Zeder
  rationale: Die Pflanzenliste folgt den im geprüften Konsultationstext angesetzten Identifizierungen. Die Wiederholung von »Zeder« wird bewahrt, da auch der ge'ezische Text zwei unterschiedliche, entsprechend gedeutete Benennungen enthält.
theological_decisions:
- issue: Richtung des Verbots
  choice: 'Nur die aufgezählten Holzarten sind zugelassen: »kein anderes Holz als …«'
  alternative: 'Die aufgezählten Holzarten sind verboten: »kein Holz von diesen Arten …«'
  rationale: Syntax und revidierte Quellenprüfung sprechen dafür, dass die Liste die erlaubten Arten nennt. Die Alternative würde die Anweisung umkehren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers setzt mitten im Satz ein; deshalb beginnt die Übersetzung entsprechend mit einem kleingeschriebenen Satzfragment. Die kultische Anweisung ist knapp und verständlich formuliert.
