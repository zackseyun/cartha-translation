translation:
  language: de
  text: zu unreinen Dingen oder hinter Schnitzbildern her oder hinter Gussbildern her.[a] Und esst keinerlei Blut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann die Reihe auch heißen: »zu unreinen Dingen und hinter Schnitzbildern her und hinter Gussbildern her«.'
    reason: Das äthiopische Bindewort kann sowohl schlicht anreihend als auch im Zusammenhang disjunktiv verstanden werden.
  - marker: b
    text: 'Auch möglich: »Und esst überhaupt kein Blut.«'
    reason: Die verstärkte Verneinung lässt sich im Deutschen sowohl mit »keinerlei« als auch mit »überhaupt kein« ausdrücken.
lexical_decisions:
- source_word: ርኩሳን
  choice: unreinen Dingen
  rationale: Gibt den pluralischen Ausdruck allgemein wieder, ohne ihn vorschnell auf Götzenbilder oder eine bestimmte Form kultischer Unreinheit festzulegen.
- source_word: ገሊፎ
  choice: Schnitzbildern
  rationale: Bezeichnet ausgehauene beziehungsweise geschnitzte Bilder und wahrt den Gegensatz zu gegossenen Bildern.
- source_word: ስብክ
  choice: Gussbildern
  rationale: Gibt den Ausdruck für gegossene Bilder in natürlichem, zugleich traditionsnahem Deutsch wieder.
- source_word: ኢምዝተኒ
  choice: keinerlei
  rationale: 'Die verneinte Indefinitform verstärkt das Verbot: Es soll überhaupt kein Blut gegessen werden.'
theological_decisions:
- issue: Verhältnis der drei untersagten Zielrichtungen
  choice: oder … oder
  alternative: und … und
  rationale: Im Deutschen kennzeichnet die disjunktive Reihung die einzelnen verbotenen Hinwendungen idiomatisch. Das äthiopische ወ kann jedoch formal auch schlicht »und« bedeuten; diese Möglichkeit wird in der Fußnote offengehalten.
- issue: Deutung von ርኩሳን
  choice: unreine Dinge
  alternative: Götzen
  rationale: Die allgemeinere Wiedergabe bewahrt die lexikalische Breite und vermeidet eine nicht zwingende Gleichsetzung mit Götzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang bleibt bewusst kleingeschrieben, da der überlieferte Ausschnitt syntaktisch an den vorausgehenden Satz anschließt. »Hinter … her« erhält das Bewegungsbild der Vorlage; »keinerlei« bildet die ausdrückliche Totalverneinung ab.
