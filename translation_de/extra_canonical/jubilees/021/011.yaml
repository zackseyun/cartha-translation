  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: de
  text: Und auf alle deine Opfergaben sollst du Salz streuen; das Salz des Bundes darf bei keiner von ihnen fehlen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: deine Opfergaben
  rationale: Gibt die kultischen Gaben natürlich und sachlich wieder; „Opfergaben“ passt hier besser als das enger oder missverständlich wirkende „Opfer“.
- source_word: ትደይ፡ ፄወ
  choice: sollst du Salz streuen
  rationale: Bewahrt die Anweisung, Salz auf die Opfergaben zu geben; „streuen“ ist im Deutschen für diesen Vorgang idiomatisch.
- source_word: ፄወ፡ ኪዳን
  choice: das Salz des Bundes
  rationale: Entspricht der kompakten genitivischen Verbindung der Vorlage und bewahrt ihre kultisch-theologische Bildsprache.
- source_word: ወኢይደሪዕ
  choice: darf … nicht fehlen
  rationale: Gibt das Verbot des Auslassens beziehungsweise Fehlens in natürlichem, würdigem Deutsch wieder.
- source_word: ውስተ፡ ኵሉ
  choice: bei keiner von ihnen
  rationale: Drückt im negativen Satz den umfassenden Bezug auf sämtliche zuvor genannten Opfergaben eindeutig aus.
theological_decisions:
- issue: Bedeutung des „Salzes des Bundes“
  choice: Die feste Wendung bleibt unaufgelöst stehen.
  alternative: Eine erklärende Wiedergabe wie „Salz als Zeichen des Bundes“.
  rationale: Der Ausgangstext erklärt die Beziehung zwischen Salz und Bund nicht näher. Die Übersetzung bewahrt daher die genuine kultische und theologische Verdichtung, ohne eine bestimmte Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Der parallele Aufbau der zweigliedrigen Anweisung bleibt erhalten; ein Fußnotenapparat ist für diesen Vers nicht nötig.
