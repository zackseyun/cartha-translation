base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: de
  text: den Willen dessen, der mich erschaffen hat. Denn er ist der lebendige Gott; er ist heilig, treu und über alle Maßen gerecht. Bei ihm gibt es weder Ansehen der Person noch Annahme von Geschenken.[a] Denn er ist ein gerechter Gott und vollstreckt das Gericht an allen, die seine Gebote übertreten, und an denen, die seinen Bund verachten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Geschenken“ sind hier wahrscheinlich Gaben gemeint, die ein Urteil beeinflussen sollen, also Bestechungsgeschenke.
    reason: Die Ge'ez-Wendung ist von der vorhergehenden Aussage über Parteilichkeit verschieden und kann eine Bestechungskonnotation tragen.
  - marker: b
    text: 'Im vorliegenden Ge''ez-Wortlaut steht am Ende wörtlich nur: „und an denen, die verachten“; „seinen Bund“ ist als sinngemäßes Objekt ergänzt.'
    reason: Kennzeichnet transparent die Ellipse beziehungsweise textliche Unklarheit am Ende des bereitgestellten Quellenausschnitts.
lexical_decisions:
- source_word: ፈቃዱ፡ ለዘፈጠረኒ
  choice: den Willen dessen, der mich erschaffen hat
  rationale: Bewahrt den fragmentarischen Anschluss des Versanfangs und gibt das Possessivverhältnis natürlich wieder.
- source_word: አምላክ፡ ሕያው
  choice: der lebendige Gott
  rationale: Direkte und im Deutschen geläufige Wiedergabe.
- source_word: ምእመን
  choice: treu
  rationale: Gibt die personale Zuverlässigkeit Gottes natürlicher wieder als das missverständliche „gläubig“.
- source_word: ጻድቅ፡ ውእቱ፡ እምኵሉ
  choice: über alle Maßen gerecht
  rationale: Bringt die verstärkende beziehungsweise vergleichende Aussage idiomatisch zum Ausdruck, ohne eine Rangordnung unter Göttern nahezulegen.
- source_word: ነሢአ፡ ገጽ
  choice: Ansehen der Person
  rationale: Die Wendung bedeutet wörtlich etwa „das Gesicht annehmen“ und bezeichnet Parteilichkeit oder Begünstigung.
- source_word: ነሢአ፡ ሕልያን
  choice: Annahme von Geschenken
  rationale: Bewahrt die vom ersten Ausdruck verschiedene Aussage über das Annehmen von Gaben, wahrscheinlich im Sinn von Bestechungsgeschenken.
- source_word: ገባሬ፡ ኵነኔ
  choice: vollstreckt das Gericht
  rationale: Gibt die aktive Ausübung beziehungsweise Durchführung des Gerichts wieder.
- source_word: ይትዐደዉ፡ ትእዛዞ
  choice: seine Gebote übertreten
  rationale: Entspricht dem pluralischen beziehungsweise kollektiv verstandenen Gebotsausdruck und dem Verb des Übertretens.
- source_word: ይሜንኑ
  choice: verachten
  rationale: Bewahrt die eigenständige zweite Handlung und verschmilzt sie nicht mit dem Übertreten der Gebote.
theological_decisions:
- issue: Göttliche Unparteilichkeit und Annahme von Gaben
  choice: 'zwei verschiedene Aussagen: „weder Ansehen der Person noch Annahme von Geschenken“'
  alternative: „keine Parteilichkeit und kein Ansehen der Person“
  rationale: Der Ge'ez-Text nennt zwei unterschiedliche Ausdrücke; die Alternative wäre redundant und ließe die Aussage über Geschenke beziehungsweise Bestechung aus.
- issue: Gegenstand des Verachtens am Versende
  choice: „seinen Bund verachten“
  alternative: „verachten“ ohne ausdrücklich genanntes Objekt
  rationale: Die überlieferte konsultierte Versgliederung versteht den Bund als Gegenstand; im hier vorgelegten Ge'ez-Ausschnitt bleibt dieser am Ende elliptisch. Die Ergänzung wird deshalb transparent in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Versanfang bleibt als syntaktischer Anschluss an den vorherigen Kontext erhalten. Semitisch geprägte Rechts- und Bundessprache wird verständlich formuliert, ohne die beiden Gruppen oder Handlungen am Versende zusammenzuziehen.
