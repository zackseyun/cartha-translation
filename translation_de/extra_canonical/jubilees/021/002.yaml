lexical_decisions:
- source_word: ወናሁ
  choice: Und sieh
  rationale: Gibt die einleitende Aufmerksamkeitsformel knapp und würdig wieder.
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: Ich bin 175 Jahre alt
  rationale: Natürliche moderne deutsche Altersangabe bei genauer Wahrung der Zahl.
- source_word: እዜከር፡ ለእግዚአብሔር
  choice: habe ich an den Herrn gedacht
  rationale: Entspricht unmittelbar dem Verb des Erinnerns beziehungsweise Gedenkens, ohne den Sinn zu einer konfessionell geprägten Formel zu erweitern.
- source_word: አኀሥሥ፡ በኵሉ፡ ልብየ
  choice: mit ganzem Herzen danach gestrebt
  rationale: Das Verb bezeichnet Suchen oder Trachten; „danach gestrebt“ ist im Deutschen in Verbindung mit dem folgenden Tun des Willens natürlich und bewahrt die zielgerichtete Bedeutung.
- source_word: እግበር፡ ፈቃደቲሁ
  choice: seinen Willen zu tun
  rationale: Formale und idiomatische Wiedergabe der Zweckkonstruktion.
