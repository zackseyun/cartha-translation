  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: de
  text: 'Und siehe: Ich bin 175 Jahre alt, und habe alle Tage meines Lebens an den Herrn gedacht und mit ganzem Herzen danach gestrebt, seinen Willen zu tun.'
