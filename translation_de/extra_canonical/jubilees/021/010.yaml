  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: de
  text: und dazu sein Trankopfer, zu einem wohlgefälligen Duft, ein Speiseopfer für den HERRN.[a] Iss sein Fleisch an jenem Tag und am zweiten Tag. Am zweiten Tag darf die Sonne nicht darüber untergehen, bevor es aufgegessen ist. Lass nichts davon bis zum dritten Tag übrig, denn es ist nicht annehmbar, denn es ist etwas Unreines und darf nicht gegessen werden. Jeder, der davon isst, lädt Schuld auf sich. Denn so fand ich es im Buch meiner früheren Vorväter geschrieben, ebenso in den Worten Henochs und in den Worten Noahs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe Satzverknüpfung im Ausgangstext lässt auch zu: „und dazu sein Trankopfer sowie ein Speiseopfer für den HERRN zu einem wohlgefälligen Duft“.'
    reason: Die genaue syntaktische Zuordnung von „zu einem wohlgefälligen Duft“ zu Trank- und Speiseopfer bleibt mehrdeutig.
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: sein Trankopfer
  rationale: Der Ausdruck bezeichnet die zum Opfer gehörende Trankspende; er darf nicht mit dem anschließend eigens genannten Speiseopfer zusammengezogen werden.
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: als Speiseopfer
  rationale: Wörtlich steht eine Brot- bzw. Speisegabe; „Speiseopfer“ ist der natürliche deutsche kultische Fachausdruck und hält diese Gabe vom Trankopfer getrennt.
- source_word: መዓዛ፡ ሠናይ
  choice: zum wohlgefälligen Duft
  rationale: Die Wendung bezeichnet einen guten bzw. angenehmen Opferduft; „wohlgefällig“ bewahrt ihren kultischen Sinn.
- source_word: ኢይሠጠዎ
  choice: nicht mehr annehmbar
  rationale: Im Opferkontext ist die Aussage als fehlende Annehmbarkeit zu verstehen, ohne ausdrücklich festzulegen, wer das Opfer nicht annimmt.
- source_word: እኩይ፡ ኅሩየ
  choice: entweiht
  rationale: Die schwierige Verbindung kennzeichnet das am dritten Tag gegessene Opferfleisch negativ als profan bzw. kultisch unzulässig; „entweiht“ gibt diesen Gegensatz knapp wieder.
- source_word: ኃጢአተ፡ ሎሙ፡ ይነሥኡ
  choice: lädt Schuld auf sich
  rationale: Die idiomatische deutsche Formulierung bewahrt das Bild des Auf-sich-Nehmens von Sünde bzw. Schuld.
- source_word: ነገረ፡ ሄኖክ ... ነገረ፡ ኖኅ
  choice: in den Worten Henochs ... in den Worten Noahs
  rationale: „Worte“ folgt der Quellenaussage enger als eine Festlegung auf bestimmte schriftliche Bücher oder bloße mündliche Überlieferungen.
theological_decisions:
- issue: Annehmbarkeit des am dritten Tag verbleibenden Opferfleisches
  choice: „dann ist es nicht mehr annehmbar“
  alternative: „denn es wird nicht angenommen“
  rationale: Die gewählte Fassung wahrt die kultische Aussage, ohne einen im Satz nicht ausdrücklich genannten göttlichen Handlungsträger einzuführen.
- issue: Folge des verbotenen Essens
  choice: „lädt Schuld auf sich“
  alternative: „trägt seine Sünde“
  rationale: Die natürliche deutsche Wendung macht persönliche Verantwortlichkeit deutlich, ohne die Art oder Sanktion der Schuld dogmatisch näher zu bestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache mit vertrauter kultischer Terminologie. Der Gottesname wird als „HERR“ wiedergegeben. Kurze Imperative erhalten den Charakter väterlicher Weisung; schwer verständliche Ausgangssyntax wird behutsam geglättet, ohne die beiden Opfergaben oder die zeitliche Grenze am zweiten Tag zu verwischen.
