  to: und dazu sein Trankopfer, zu einem wohlgefälligen Duft, ein Speiseopfer für den HERRN.[a] Iss sein Fleisch an jenem Tag und am zweiten Tag. Am zweiten Tag darf die Sonne nicht darüber untergehen, bevor es aufgegessen ist. Lass nichts davon bis zum dritten Tag übrig, denn es ist nicht annehmbar, denn es ist etwas Unreines und darf nicht gegessen werden. Jeder, der davon isst, lädt Schuld auf sich. Denn so fand ich es im Buch meiner früheren Vorväter geschrieben, ebenso in den Worten Henochs und in den Worten Noahs.
