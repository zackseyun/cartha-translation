base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: de
  text: '[Sie heißen] Arsatna und Besem.[a] Von diesen Hölzern aber lege unter das Opfer auf dem Altar nur solche, die ihrem Aussehen nach erprobt sind. Lege kein gespaltenes oder dunkles Holz auf, sondern hartes und reines Holz, ohne Makel, unversehrt und frisch gewachsen. Lege auch kein altes Holz auf, denn sein Duft ist verflogen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namen Arsatna und Besem sind schwer verständlich und möglicherweise verderbt überliefert. Die in diesem Abschnitt genannten Hölzer lassen sich zum Teil nicht sicher bestimmten Baumarten zuordnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርሳትነ ወቤስም
  choice: Arsatna und Besem
  rationale: Die schwer bestimmbaren Pflanzennamen werden transliteriert, statt ihnen unsichere deutsche Artennamen zuzuweisen.
- source_word: መትሕተ፡ ጽንሓሕ፡ ዲበ፡ ምሥዋዕ
  choice: unter das Opfer auf dem Altar
  rationale: 'Die räumlichen Angaben werden vollständig wiedergegeben: Das Holz liegt unter dem Opfer, das sich auf dem Altar befindet.'
- source_word: ምኩረ፡ ራእዮሙ
  choice: die sich dem Aussehen nach bewährt haben
  rationale: Bewahrt sowohl den Gedanken der Prüfung/Bewährung als auch den ausdrücklichen Bezug auf das Erscheinungsbild.
- source_word: ንቁዐ፡ ወፈዋነ
  choice: gespaltenes oder dunkles
  rationale: Gibt beide negativen Eigenschaften des Ge'ez wieder; das verbindende Element wird im Deutschen innerhalb der verneinten Aufzählung idiomatisch mit „oder“ ausgedrückt.
- source_word: ጽኑዓነ፡ ወንጹሐ
  choice: hartes und reines
  rationale: Formnahe und zugleich natürliche Wiedergabe der geforderten Beschaffenheit des Holzes.
- source_word: ዘአልቦ፡ ምትነኒ፡ ነወረ፡ ፍጹመ
  choice: ohne Makel, unversehrt
  rationale: Die Häufung von Ausdrücken für Fehlerlosigkeit und vollständige Unversehrtheit wird knapp, aber nicht nivellierend wiedergegeben.
- source_word: ወንደስተ፡ ተከለ
  choice: frisch gewachsen
  rationale: Bezeichnet offenbar junges beziehungsweise neues Wachstum; „frisch gewachsen“ ist verständlich und vermeidet eine zu genaue botanische Festlegung.
- source_word: እስመ፡ ወፅአ
  choice: denn sein Duft ist verflogen
  rationale: Im Zusammenhang mit altem Holz bezeichnet das Herausgehen den Verlust des Duftes; „verflogen“ ist dafür idiomatisches Deutsch.
theological_decisions:
- issue: Reinheitsanforderungen an das Altarholz
  choice: als konkrete Anforderungen an Beschaffenheit und Eignung des Holzes wiedergegeben
  alternative: die Merkmale symbolisch oder kulttheologisch ausdeuten
  rationale: Der Vers formuliert praktische Kultanweisungen. Eine weitergehende symbolische Deutung wäre nicht ausdrücklich im Ausgangstext enthalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die unsicheren Pflanzennamen bleiben transliteriert; die Satzstruktur wurde behutsam geglättet, ohne die räumlichen Angaben oder die aufgezählten Qualitätsmerkmale auszulassen.
