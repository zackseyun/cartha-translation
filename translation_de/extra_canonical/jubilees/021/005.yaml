  text: his covenant. And you also, my son, keep his commandment and his statute and his judgment, and do not walk after them.
translation:
  language: de
  text: seinen Bund.[a] Und auch du, mein Sohn, halte sein Gebot, seine Satzung und sein Recht, und folge ihnen nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste Wort schließt dem Zusammenhang nach möglicherweise den vorangehenden Vers ab.
    reason: Die Quellsegmentierung setzt offenbar innerhalb eines Satzes ein; das im Segment vorhandene Wort muss dennoch wiedergegeben werden.
  - marker: b
    text: 'Wörtlich: „geh nicht hinter ihnen her“. Worauf sich „ihnen“ bezieht, wird in diesem Quellsegment nicht ausdrücklich genannt.'
    reason: Die Fußnote bewahrt sowohl das Bild der Ausgangssprache als auch die durch die Verssegmentierung entstandene Unbestimmtheit.
lexical_decisions:
- source_word: ኪዳኖ
  choice: seinen Bund
  rationale: Das Substantiv bedeutet „Bund“; das angefügte Possessivsuffix ist maskulin Singular („sein/seinen“). Obwohl das Wort wahrscheinlich den vorangehenden Satz abschließt, wird es übersetzt, da es im vorliegenden Quellsegment steht.
- source_word: ዕቀብ
  choice: halte
  rationale: Der Imperativ bezeichnet das Bewahren bzw. treue Einhalten; „halte“ ist im Zusammenhang mit Gebot und Satzung natürlich und präzise.
- source_word: ትእዛዞ፡ ወሥርዐቶ፡ ወኵነኔሁ
  choice: sein Gebot, seine Satzung und sein Recht
  rationale: Alle drei geʿezischen Formen stehen morphologisch im Singular und tragen ein Possivsuffix der 3. Person maskulin Singular. „Recht“ bewahrt bei ኵነኔሁ den rechtlich-normativen Sinn, ohne vorschnell nur einen einzelnen Richterspruch anzunehmen.
- source_word: ወኢትሖር፡ ድኅሬሆሙ
  choice: und folge ihnen nicht
  rationale: Wörtlich liegt die Wendung „nicht hinter ihnen gehen“ vor. „Ihnen nicht folgen“ gibt dieses Bild in natürlichem modernem Deutsch wieder und bewahrt den pluralischen Rückverweis.
theological_decisions:
- issue: Bezug des pluralischen Pronomens in „ihnen“
  choice: Der pluralische Ausdruck bleibt ohne ergänztes Bezugswort stehen.
  alternative: Ein im weiteren Kontext vermutetes Bezugswort wie „Götzen“ ausdrücklich ergänzen.
  rationale: Das vorgelegte Quellsegment nennt kein solches Bezugswort. Eine Ergänzung würde die durch die Segmentgrenze entstandene Mehrdeutigkeit unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Gesetzesterminologie und die morphologischen Singulare bleiben erhalten. Der fragmentarische Beginn sowie der unbestimmte pluralische Rückverweis werden nicht stillschweigend geglättet.
