  source_fidelity: 'Die wesentlichen Begriffe sind überwiegend zutreffend wiedergegeben, insbesondere „Bestechung ... Geschenk“, „Schutz“, die dreifache Negativcharakterisierung und das Pflanzenbild. Eine sichere Korrektur ist jedoch bei der Formel ደመ፡ በደም፡ ከመ፡ ትሠጠው angebracht: Sie enthält die direkte Aufforderung, „Blut für Blut“ vor Gott zu leisten/zu erstatten, nicht lediglich einen unpersönlichen Passivsatz. Ferner muss beim Ausrotten die Nachkommenschaft syntaktisch ausdrücklich als zweites Objekt des Verbs stehen.'
  naturalness: Der Ton ist würdevoll und gut verständlich. „Den Auftrag ... halten“ und die unvollständige Verbellipse bei „deine Nachkommen unter dem Himmel“ sind im Deutschen weniger klar. „Die Weisung ... bewahren“ sowie ein ausdrücklich wiederholtes „ausrottet“ sind idiomatischer und zugleich quellennäher.
  terminology: „Der höchste Gott“, „Gerechtigkeit“, „Unreinheit“, „Abscheulichkeit“, „Befleckung“ und „Pflanzung der Gerechtigkeit“ sind angemessen. „Nachkommenschaft“ ist hier als Kollektivbegriff präziser als „Nachkommen“, da der Singular des Quelltexts die gesamte Linie meint.
