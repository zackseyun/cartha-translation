  - severity: medium
    issue: Ausrottungsandrohung an der Nachkommenschaft syntaktisch unvollständig
    rationale: Der Quelltext verbindet das Ausrotten des Angeredeten von der Erde mit dem seiner Nachkommenschaft unter dem Himmel. Im Entwurf fehlt bei „deine Nachkommen unter dem Himmel“ das regierende Verb.
  - severity: low
    issue: „Auftrag ... halte dich an“ ist weniger präzise für die göttliche Weisung
    rationale: Die Aufforderung lautet, die göttliche „charge“ zu bewahren. „Bewahre die Weisung“ ist im Deutschen klarer und entspricht dem traditionssprachlichen Register ohne zusätzliche dogmatische Deutung.
