base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/020.yaml
  text: And do not accept a bribe or a present for human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be a good protection for you, so that you may be kept from every evil and so that he may save you from every death. For I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your enemies and root you out from the earth, and your seed from under heaven, and destroy your name and your seed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he will raise up from
    you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for everlasting generations with every righteous blessing, so that you may become a blessing on all the earth.” And he went out from before him rejoicing.
translation:
  language: de
  text: 'Für das Blut, das er vergossen hat. Nimm weder Bestechung noch ein Geschenk für Menschenblut an; Blut für Blut sollst du vor dem Herrn, dem höchsten Gott, erstatten. Das wird dir ein guter Schutz sein, damit du vor allem Bösen bewahrt bleibst und er dich vor jedem Tod rettet. Denn ich habe, mein Sohn, alle Taten der Menschenkinder gesehen: All ihre Sünde und Bosheit und alle ihre Taten sind Unreinheit, Abscheulichkeit und Befleckung, und bei ihnen ist keine Gerechtigkeit. Hüte dich davor, auf ihren Wegen zu gehen und ihren Pfaden zu folgen. Begehe keine Sünde, die vor dem höchsten Gott zum Tod führt, damit er sein Angesicht nicht vor dir verbirgt, dich in die Hand deiner Feinde gibt, dich von der Erde ausrottet und deine Nachkommenschaft unter dem Himmel ausrottet, sodass dein Name und deine Nachkommenschaft von der ganzen Erde verschwinden. Sondern trenne dich von allen ihren Taten und von all ihrer Unreinheit. Bewahre die Weisung des höchsten Gottes, tu seinen Willen und verhalte
    dich in allem rechtschaffen. Dann wird er dich in allen deinen Taten segnen und aus dir eine Pflanzung der Gerechtigkeit hervorgehen lassen, auf der ganzen Erde und durch alle Geschlechter der Erde hindurch. Mein Name und dein Name werden unter dem Himmel niemals vergessen werden.


    Geh hin in Frieden, mein Sohn! Der höchste Gott, mein Gott und dein Gott, stärke dich, seinen Willen zu tun. Er segne alle deine Nachkommenschaft und den Rest deiner Nachkommenschaft für ewige Geschlechter mit jedem gerechten Segen, damit du auf der ganzen Erde zum Segen wirst.« Und er ging voll Freude von ihm hinaus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕልያነ፡ ወአምኃ
  choice: Bestechung noch ein Geschenk
  rationale: Die beiden Begriffe bezeichnen eine Bestechungsgabe und ein Geschenk; die Wiedergabe wahrt die Doppelung und vermeidet die sachlich unzutreffende Deutung als Parteilichkeit.
- source_word: ደመ፡ በደም፡ ከመ፡ ትሠጠው
  choice: Blut soll mit Blut … vergolten werden
  rationale: Die knappe Vergeltungsformel »Blut für Blut« wird in natürlichem Deutsch wiedergegeben, ohne ihre rechtliche Härte abzuschwächen.
- source_word: ዑቃቤሁ፡ ሠናይ
  choice: Das wird dir ein guter Schutz sein
  rationale: ዑቃቤ bezeichnet Schutz, Bewahrung oder Obhut, nicht ein Gedächtniszeichen. Der personale Bezug wird aus dem folgenden Schutz- und Rettungssatz erschlossen.
- source_word: ገብሮሙ፡ ርኵስ፡ ወምኖ፡ ወገማኔ
  choice: ihre Taten sind Unreinheit, Abscheulichkeit und Befleckung
  rationale: Die gehäufte kultisch-moralische Negativbeschreibung wird durch drei unterscheidbare deutsche Begriffe bewahrt.
- source_word: ተገንሥ
  choice: trenne dich
  rationale: Der Imperativ fordert eine entschiedene Absonderung von den genannten Taten, nicht lediglich innerliche Ablehnung.
- source_word: ተክለ፡ ጽድቅ
  choice: eine Pflanzung der Gerechtigkeit
  rationale: Das konkrete Pflanzenbild bleibt erhalten; »Pflanzung« kann sowohl Gewächs als auch von Gott begründete Nachkommenschaft bezeichnen.
- source_word: ወወፅአ፡ እምኀቤሁ፡ እንዘ፡ ይትፌሣሕ
  choice: Und er ging voll Freude von ihm hinaus
  rationale: Die Schlussformel wird idiomatisch wiedergegeben und erhält sowohl das Fortgehen aus der Gegenwart Abrahams als auch die Freude.
theological_decisions:
- issue: Vergeltung für vergossenes Menschenblut
  choice: »Blut soll mit Blut … vergolten werden«
  alternative: »Blut für Blut soll dargebracht werden«
  rationale: Der Zusammenhang behandelt Verantwortung für Blutvergießen. »Vergolten« lässt die gerichtliche Aussage stehen, ohne sie als kultisches Opfer zu deuten.
- issue: Sünde, die zum Tod führt
  choice: »Begehe keine Sünde, die … zum Tod führt«
  alternative: »Versündige dich nicht mit einer Todsünde«
  rationale: Die Formulierung bewahrt den funktionalen Zusammenhang von Sünde und Tod und vermeidet, eine später festgelegte dogmatische Kategorie der »Todsünde« in den Text einzutragen.
- issue: Pflanzung der Gerechtigkeit
  choice: Metaphorische Formulierung beibehalten
  alternative: »gerechte Nachkommenschaft«
  rationale: Der Text verbindet Nachkommenschaft und Pflanzenbild, ohne beide vollständig gleichzusetzen; die Bildsprache bleibt deshalb offen.
- issue: Segen auf der ganzen Erde
  choice: »damit du auf der ganzen Erde zum Segen wirst«
  alternative: »damit durch dich die ganze Erde gesegnet wird«
  rationale: Die gewählte Fassung folgt der Prädikatsaussage über den Angeredeten und vermeidet eine kausale Erweiterung, die der Wortlaut nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter väterlicher Mahnrede. Die parataktische Struktur des ge’ezischen Textes wurde weitgehend erhalten, an einzelnen Stellen jedoch in klarere deutsche Satzperioden gegliedert. Der im überlieferten Versanfang stehende Satzrest »Für das Blut, das er vergossen hat« wurde nicht ausgelassen, obwohl er syntaktisch an den vorausgehenden Kontext anschließt.
