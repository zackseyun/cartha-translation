translation:
  language: de
  text: seinen Duft; denn auf ihm ist kein Duft mehr wie zuvor. Außer diesen Hölzern lege kein anderes Holz auf, denn sein Duft ist unverwechselbar, und der Wohlgeruch seines Duftes steigt zum Himmel empor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ
  choice: seinen Duft / sein Duft
  rationale: Das Substantiv bezeichnet Duft oder Wohlgeruch; das angefügte Pronomen der 3. Person Singular wird ausdrücklich wiedergegeben. Der fragmentarische Beginn setzt offenbar den vorhergehenden Satz fort.
- source_word: እሉ፡ ዕፀው
  choice: diese Hölzer
  rationale: Der Demonstrativausdruck mit dem Plural von ‚Holz/Baum‘ verweist auf die zuvor genannten Holzarten; ‚Hölzer‘ ist im Zusammenhang mit dem Auflegen zum Räuchern natürlich.
- source_word: ፍሉጥ
  choice: unverwechselbar
  rationale: Das Wort kann ‚bekannt, erkennbar, ausgezeichnet/unterschieden‘ bedeuten. ‚Unverwechselbar‘ bewahrt hier den Sinn eines deutlich erkennbaren, besonderen Duftes, ohne bloßes Bekanntsein zu behaupten.
- source_word: ፄና፡ መዐዛሁ
  choice: der Wohlgeruch seines Duftes
  rationale: Die eng verbundenen Duftbegriffe werden nicht zusammengezogen, damit die emphatische Ausdrucksweise des Ge'ez sichtbar bleibt; ‚Wohlgeruch‘ passt zum kultischen Kontext.
- source_word: የዐርግ
  choice: steigt … empor
  rationale: Gibt die gerichtete Aufwärtsbewegung zum Himmel würdig und idiomatisch wieder.
theological_decisions:
- issue: Kultische Bedeutung des zum Himmel aufsteigenden Duftes
  choice: Wörtliche Darstellung ohne zusätzliche Deutung
  alternative: Als von Gott angenommener Opferduft ausdeuten
  rationale: Der Vers beschreibt, dass der Wohlgeruch zum Himmel emporsteigt, erklärt aber an dieser Stelle nicht ausdrücklich dessen Annahme oder theologische Wirkung.
- issue: Identität des Duftes ‚wie zuvor‘
  choice: „nicht mehr derselbe Duft wie zuvor“
  alternative: „keinen Duft mehr wie anfangs“
  rationale: Die Formulierung wahrt den Vergleich mit dem früheren Zustand, ohne vorschnell festzulegen, ob Duft vollständig fehlt oder sich qualitativ verändert hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht kultischem Ton. Der kleingeschriebene fragmentarische Anfang ist als Fortsetzung des vorangehenden Verses behandelt. Keine Fußnoten erforderlich.
