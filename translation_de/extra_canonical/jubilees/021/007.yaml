  to: das Blut der wilden Tiere, des Viehs und jedes Vogels, der am Himmel fliegt. Wenn du ein wohlgefälliges Friedensopfer[a] schlachtest, dann schlachte es und gieße sein Blut auf den Altar. Alles Fett deines Opfers[b] sollst du auf dem Altar darbringen, zusammen mit Feinmehl, das mit Öl vermischt ist. Mit dem dazugehörigen Trankopfer sollst du alles gemeinsam auf dem Altar darbringen, als ein Opfer von angenehmem Duft vor …
