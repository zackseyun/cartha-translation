  text: the blood of wild animals and of cattle and of every bird that flies in the sky. And if you slaughter a sacrifice as an acceptable peace offering, slaughter it and pour out its blood on the altar; and all the fat of your offering you shall offer up on the altar, together with fine flour mixed with oil; and with its drink offering you shall offer it all together on the altar as an offering of a pleasing fragrance before
translation:
  language: de
  text: das Blut der wilden Tiere, des Viehs und jedes Vogels, der am Himmel fliegt. Wenn du ein wohlgefälliges Friedensopfer[a] schlachtest, dann schlachte es und gieße sein Blut auf den Altar. Alles Fett deines Opfers[b] sollst du auf dem Altar darbringen, zusammen mit Feinmehl, das mit Öl vermischt ist. Mit dem dazugehörigen Trankopfer sollst du alles gemeinsam auf dem Altar darbringen, als ein Opfer von angenehmem Duft vor …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Friedensopfer, das wohlgefällig ist“, das heißt, angenommen wird.'
    reason: Erläutert den Relativausdruck ዘይሰጠው und grenzt ihn von der unbelegten Deutung als Dankopfer ab.
  - marker: b
    text: 'Wörtlich: „alles Fett deines Opfers“.'
    reason: Macht das im Ausgangstext vorhandene Possessivsuffix der zweiten Person Singular sichtbar.
lexical_decisions:
- source_word: አርዌ፡ ወዘእንስሳ
  choice: der wilden Tiere, des Viehs
  rationale: Unterscheidet wildlebende Tiere von domestiziertem Vieh und gibt die koordinierte Genitivkonstruktion natürlich wieder.
- source_word: ጽንሓሐ፡ ሰላም
  choice: Friedensopfer
  rationale: Die feste Opferbezeichnung wird mit dem im Deutschen geläufigen biblischen Fachausdruck wiedergegeben.
- source_word: ዘይሰጠው
  choice: wohlgefällig
  rationale: Bezeichnet hier, dass das Opfer angenommen beziehungsweise als annehmbar gilt; es bedeutet nicht „Dank“.
- source_word: ጽንሑክ
  choice: deines Opfers
  rationale: Bewahrt das Suffix der zweiten Person Singular; im Zusammenhang bezeichnet der Ausdruck die Opfergabe.
- source_word: ስንዳሌ፡ ልውሰ፡ በቅብዕ
  choice: Feinmehl, das mit Öl vermischt ist
  rationale: Gibt die Opferzubereitung klar und quellennah wieder.
- source_word: ጽንሓሕነ፡ መዐዛ፡ ሠናይ
  choice: als ein Opfer von angenehmem Duft
  rationale: Bewahrt die kultische Duftformel in verständlichem, würdigem Deutsch.
theological_decisions:
- issue: Bedeutung des an das Friedensopfer angeschlossenen Relativausdrucks ዘይሰጠው
  choice: wohlgefälliges Friedensopfer
  alternative: Dank-Friedensopfer
  rationale: Der geezische Ausdruck bezeichnet Annahme beziehungsweise Wohlgefälligkeit und enthält keinen belastbaren Hinweis auf Danksagung.
- issue: Unvollständiger Satz am Versende
  choice: vor …
  alternative: vor Gott / vor dem Herrn
  rationale: Die Vorlage endet innerhalb der Duftformel mit „vor“. Die Ergänzung des in diesem Vers nicht überlieferten Bezugswortes würde die Kapitel- beziehungsweise Verseinteilung stillschweigend überschreiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultischen Fachbegriffen, die im deutschen Bibelstil verständlich sind. Die Wiederholung von „schlachtest … schlachte“ bleibt wegen ihrer Nähe zur geezischen Formulierung erhalten. Das Satzfragment am Versende wird sichtbar offengelassen, statt ein nicht im vorliegenden Vers stehendes Gottesprädikat zu ergänzen.
