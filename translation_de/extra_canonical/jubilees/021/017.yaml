  text: and wash your hands and your feet. And let no blood be seen on you or on your garments.
translation:
  language: de
  text: Und wasche deine Hände und deine Füße. An euch und an euren Gewändern soll keinerlei Blut zu sehen sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሐፀብ
  choice: wasche
  rationale: Das Verb bezeichnet hier das Waschen beziehungsweise Abwaschen; der Imperativ wird im Deutschen direkt wiedergegeben.
- source_word: እደዊከ፡ ወእገሪከ
  choice: deine Hände und deine Füße
  rationale: Die paarige Nennung der Körperteile und der singularische Bezug auf den Angeredeten bleiben erhalten.
- source_word: ኢያስተርኢ
  choice: soll … nicht zu sehen sein
  rationale: Die Form drückt aus, dass etwas nicht sichtbar beziehungsweise nicht gesehen werden soll.
- source_word: በዲቤክሙ
  choice: an euch
  rationale: Die Präposition bezeichnet hier Blut, das sich sichtbar an beziehungsweise auf den Angeredeten befindet; der Plural der geezischen Form wird bewahrt.
- source_word: ኵሉ፡ ደም
  choice: keinerlei Blut
  rationale: Im negierten Satz gibt diese idiomatische Formulierung den umfassenden Sinn ‚überhaupt kein Blut‘ natürlich wieder.
- source_word: በውስተ፡ አልባሲክሙ
  choice: an euren Gewändern
  rationale: Im gegebenen Zusammenhang bezeichnet die Wendung sichtbar vorhandenes Blut an beziehungsweise auf den Kleidern; ‚Gewänder‘ wahrt den würdigen Registerton.
theological_decisions: []
