  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: de
  text: 'Und im sechsten Jahr der siebten Jahrwoche dieses Jubiläums rief Abraham seinen Sohn Isaak zu sich und gab ihm folgende Weisung: »Ich bin alt geworden und weiß nicht, an welchem Tag ich sterben werde; ich bin meiner Tage satt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe ein erfülltes Leben hinter mir.« Wörtlich: »Ich bin meiner Tage satt.«'
    reason: Das zugrunde liegende Bild kann sowohl Lebenssättigung als auch die Fülle beziehungsweise Vollendung der Lebenstage ausdrücken.
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier die aus sieben Jahren bestehende Zeiteinheit innerhalb eines Jubiläums; »Jahrwoche« macht dies im Deutschen knapp und eindeutig.
- source_word: አዘዞ
  choice: gab ihm folgende Weisung
  rationale: Das Verb bedeutet anweisen oder gebieten. Die gewählte Formulierung wahrt den verbindlichen Charakter, ohne im Deutschen unnötig schroff zu klingen.
- source_word: ረሳዕኩ
  choice: Ich bin alt geworden
  rationale: Die Wiedergabe folgt der Aussage über Abrahams fortgeschrittenes Alter und klingt zugleich natürlich und würdevoll.
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: ich bin meiner Tage satt
  rationale: Die erste Person Singular von ጸገብኩ wird gewahrt. Die traditionelle deutsche Wendung bildet das biblische Bild des von Lebenstagen erfüllten Menschen ab, ohne es auf eine rein zeitliche Aussage zu reduzieren.
