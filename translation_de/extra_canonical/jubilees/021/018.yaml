  text: Take care, my son, concerning blood; take great care to cover it in the earth. And do not eat it at all.
translation:
  language: de
  text: Gib acht, mein Sohn, wenn es um Blut geht; achte sehr darauf, es in der Erde[a] zu bedecken. Und iss es überhaupt nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Erdboden“.'
    reason: „Erde“ kann hier sowohl das Erdreich als Material als auch den Boden bezeichnen.
lexical_decisions:
- source_word: ተዐቀብ (taʿakkab)
  choice: Gib acht / achte darauf
  rationale: Die wiederholte Aufforderung bezeichnet wachsame Sorgfalt. Die variierte deutsche Wiedergabe erhält die Wiederholung des Gedankens, ohne unnatürlich zu klingen.
- source_word: ጥቀ (ṭəqa)
  choice: sehr
  rationale: Das Adverb verstärkt die zweite Aufforderung ausdrücklich und darf nicht ausgelassen werden.
- source_word: ደፍኖ (dafino)
  choice: es … zu bedecken
  rationale: Die Form bezeichnet das Bedecken; das deutsche Pronomen nimmt natürlich das zuvor genannte Blut auf.
- source_word: ውስተ ምድር (wəsta mədr)
  choice: in der Erde
  rationale: Die Wendung bedeutet wörtlich „in der Erde/im Erdboden“. Ein zusätzliches „mit Staub“ steht nicht im ge'ezischen Text.
- source_word: እንከ (ʾənka)
  choice: überhaupt nicht
  rationale: In der negativen Aufforderung verleiht die Partikel dem Verbot Nachdruck.
theological_decisions:
- issue: Reichweite des Verbots, Blut zu essen
  choice: Die emphatische, uneingeschränkte Formulierung des Verses wird beibehalten.
  alternative: Das Verbot durch eine kontextuelle oder konfessionelle Deutung einzuschränken.
  rationale: Der Ausgangstext formuliert hier ein nachdrückliches Verbot; eine weitergehende theologische Einordnung gehört nicht in die Übersetzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gib acht“ und „achte sehr darauf“ geben die zweimalige Aufforderung natürlich wieder; „überhaupt nicht“ bewahrt den Nachdruck des abschließenden Verbots.
