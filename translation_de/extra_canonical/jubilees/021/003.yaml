translation:
  language: de
  text: und auf allen seinen Wegen aufrecht zu gehen. Meine Seele hasste die Götzen, damit ich darauf bedacht war, zu tun, [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satz wird im folgenden Vers fortgesetzt; wörtlich etwa: „damit ich darauf bedacht war, zu tun …“. Gemeint ist nicht: „damit ich mich davor hütete, sie zu tun“.'
    reason: Die Versgrenze trennt die Konstruktion von ihrem folgenden Inhalt. Die Anmerkung sichert den positiven Sinn der ge'ezischen Wendung und erklärt den absichtlich offenen Satzschluss.
lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: aufrichtig zu gehen
  rationale: Gibt die Verbindung aus dem Verb für Gehen und der Vorstellung des Geraden/Rechten natürlich und zugleich formnah wieder.
- source_word: በኵሉ፡ ፍናዊሁ
  choice: auf allen seinen Wegen
  rationale: Bewahrt Numerus, Umfang und das maskuline Possessivsuffix des ge'ezischen Textes.
- source_word: ጣዖተ
  choice: die Götzen
  rationale: Bezeichnet Kultbilder beziehungsweise falsche Gottheiten; „Götzen“ ist im biblischen Register klar und geläufig.
- source_word: ጸልአት፡ ነፍስየ
  choice: Meine Seele hasste
  rationale: Erhält das ausdrücklich genannte Subjekt „meine Seele“ und die starke Aussage des Hassens.
- source_word: እትዐቀብ፡ ለገቢረ
  choice: ich darauf achtete, zu tun
  rationale: Gibt den positiven Sinn „darauf bedacht sein/achtgeben, zu tun“ wieder. Das inhaltliche Objekt folgt offenbar im nächsten Vers und wird hier nicht ergänzt.
theological_decisions:
- issue: Bezug des Pronomens in „seinen Wegen“
  choice: Das maskuline Pronomen bleibt unbestimmt als „seinen“ erhalten.
  alternative: Explizit „Gottes Wegen“ oder „Abrahams Wegen“ schreiben.
  rationale: Der vorgelegte Versausschnitt nennt den Bezugsträger nicht ausdrücklich; eine Auflösung würde die echte Kontextabhängigkeit beseitigen.
- issue: Richtung des abschließenden Zwecksatzes
  choice: 'Positiv: „damit ich darauf achtete, zu tun“'
  alternative: 'Negativ: „damit ich mich davor hütete, sie zu tun“'
  rationale: Die Präposition ለ vor ገቢረ weist auf das zu vollziehende Tun, nicht auf ein Sich-Hüten vor dem Tun. Die negative Alternative würde den Sinn umkehren.
- issue: Unvollständigkeit des letzten Infinitivs im Vers
  choice: Die über die Versgrenze reichende Konstruktion bleibt offen und wird mit Komma markiert.
  alternative: Ein Objekt wie „seinen Willen“ oder „das Rechte“ ergänzen.
  rationale: Das Objekt steht nach der überlieferten Segmentierung erst im folgenden Vers. Es soll nicht stillschweigend in Vers 3 importiert werden.
translation_notes:
  register: Modernes, würdiges Bibeldeutsch. Die Formulierung bleibt nahe an der ge'ezischen Syntax, ohne deren offenen Schluss durch eine sachlich unbelegte Ergänzung zu glätten.
