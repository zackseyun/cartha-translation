base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: de
  text: 'Und nun sage ich dir: Die Kinder Israels werden diese Ordnung nicht treu befolgen[a] und ihre Söhne nicht so beschneiden, wie es das ganze Gesetz verlangt. Denn bei der Beschneidung ihrer Söhne werden sie etwas von dem Fleisch ihrer Beschneidung zurücklassen. Und alle Söhne Belials werden ihre Söhne unbeschnitten lassen, so wie sie geboren wurden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »werden in Bezug auf diese Ordnung falsch handeln«.'
    reason: Das ge’ezische Verb kann falsches oder treuloses Handeln ausdrücken; »nicht treu befolgen« gibt den Zusammenhang idiomatisch wieder.
lexical_decisions:
- source_word: ይሐስዉ
  choice: nicht treu befolgen
  rationale: Das Verb kann ein falsches bzw. treuloses Handeln bezeichnen. Im Zusammenhang mit einer verbindlichen Ordnung gibt die Formulierung den Sinn natürlich wieder, ohne das Verb einfach mit einem bloßen »nicht halten« gleichzusetzen.
- source_word: በከመ፡ ኵሉ፡ ሕግ
  choice: wie es das ganze Gesetz verlangt
  rationale: Bewahrt »das ganze Gesetz« ohne den im Ge’ez nicht vorhandenen Demonstrativzusatz »dieses« und stellt idiomatisch den Bezug zur vorgeschriebenen Beschneidung her.
- source_word: መተርፋነ
  choice: etwas … stehen lassen
  rationale: Gibt das Zurück- bzw. Übriglassen von Fleisch bei einer unvollständigen Beschneidung anschaulich und verständlich wieder.
- source_word: ውሉደ፡ ቤልአር
  choice: Söhne Belials
  rationale: Bewahrt die traditionelle personifizierende Bezeichnung des Quelltexts, statt sie deutend als »böse Menschen« aufzulösen.
- source_word: ዘእንበለ፡ ክስበት
  choice: unbeschnitten
  rationale: Direkte und natürliche Wiedergabe des Zustands ohne Beschneidung.
theological_decisions:
- issue: Art des künftigen Verstoßes gegen die Beschneidungsordnung
  choice: 'Zwei Stufen des Verstoßes bleiben erkennbar: unvollständige Beschneidung und völliges Unbeschnittenlassen.'
  alternative: Beide Aussagen allgemein als Nichtbefolgung der Beschneidungsvorschrift zusammenfassen.
  rationale: Der Quelltext unterscheidet ausdrücklich zwischen zurückgelassenem Fleisch bei der Beschneidung und Söhnen, die so unbeschnitten bleiben, wie sie geboren wurden.
- issue: Bezeichnung »Söhne Belials«
  choice: Als »Söhne Belials« beibehalten.
  alternative: Als »nichtswürdige Menschen« oder »Söhne der Bosheit« interpretierend übersetzen.
  rationale: Die transliterierte Bezeichnung erhält die mögliche Personifizierung und die theologische Mehrdeutigkeit des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde leicht geglättet, zugleich bleiben die Wiederholungen zu den Söhnen und die Abstufung zwischen unvollständiger und unterlassener Beschneidung erhalten.
