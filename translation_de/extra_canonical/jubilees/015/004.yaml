  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: de
  text: Und ich werde meinen Bund zwischen mir und dir aufrichten und dich überaus zahlreich machen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  choice: aufrichten
  rationale: Das Verb bedeutet wörtlich „geben“. In Verbindung mit „Bund“ gibt „einen Bund aufrichten“ die beabsichtigte Bundesstiftung im Deutschen natürlich und sachgerecht wieder, ohne bei der bloß formalen Wendung „meinen Bund geben“ stehenzubleiben.
- source_word: ኪዳንየ
  choice: meinen Bund
  rationale: Die Form bezeichnet „meinen Bund“; „Bund“ ist die etablierte und kontextgerechte Wiedergabe.
- source_word: ማእከሌየ፡ ወማእከሌከ
  choice: zwischen mir und dir
  rationale: Die wiederholte Konstruktion mit „zwischen“ wird idiomatisch als „zwischen mir und dir“ wiedergegeben.
- source_word: አአብቀከ፡ ጥቀ
  choice: dich überaus zahlreich machen
  rationale: Die Kausativform bezeichnet starkes Vermehren; das Adverb verstärkt sie. Die Formulierung bewahrt sowohl die Vermehrung als auch ihre hohe Intensität.
theological_decisions:
- issue: Art der Bundessetzung
  choice: meinen Bund … aufrichten
  alternative: meinen Bund … geben
  rationale: Die wörtliche Alternative ist im Deutschen missverständlich und unidiomatisch. „Aufrichten“ bezeichnet die Einsetzung des Bundes, ohne zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Bundessprache; die Satzstruktur bleibt eng am ge'ezischen Ausgangstext.
