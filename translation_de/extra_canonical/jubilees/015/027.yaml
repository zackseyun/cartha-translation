  yaml_path: translation/extra_canonical/jubilees/015/027.yaml
  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: de
  text: 'Denn alle Engel der Gegenwart und alle Engel der Heiligkeit: So war ihre Erschaffung vom Tag ihrer Erschaffung an[a]. Und vor den Engeln der Gegenwart und den Engeln der Heiligkeit[b] heiligte er Israel, damit sie bei ihm und bei seinen heiligen Engeln seien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so schuf er sie vom Tag ihrer Erschaffung an“.'
    reason: Die knappe nominale Formulierung kann auch verbal verstanden werden.
  - marker: b
    text: 'Oder: „gegenüber den Engeln der Gegenwart und den Engeln der Heiligkeit“.'
    reason: Das zugrunde liegende Wort kann sowohl „vor/in Gegenwart von“ als auch „gegenüber“ bedeuten.
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: Engel der Gegenwart
  rationale: Wörtlich etwa „Engel des Angesichts“; „Engel der Gegenwart“ gibt die idiomatische Bedeutung einer besonderen Nähe zur göttlichen Gegenwart verständlich wieder, ohne sie weiter auszudeuten.
- source_word: መላእክተ፡ ቅዳሴ
  choice: Engel der Heiligkeit
  rationale: Die formale Genitivverbindung bewahrt die vom folgenden Ausdruck „heilige Engel“ abweichende Formulierung des Ausgangstextes.
- source_word: ፍጥረቶሙ
  choice: ihre Erschaffung
  rationale: Das Substantiv wird als Substantiv wiedergegeben; dadurch wird nicht vorschnell die verbale Lesart „er schuf sie“ gewählt.
- source_word: እምዕለተ፡ ፍጥረቶሙ
  choice: vom Tag ihrer Erschaffung an
  rationale: Gibt den zeitlichen Ausgangspunkt natürlich und zugleich quellennah wieder.
- source_word: ወአንጻሮሙ
  choice: und vor
  rationale: „Vor“ ist im Zusammenhang mit den genannten Engeln idiomatisch und kann die Bedeutung „in Gegenwart von“ tragen; die räumlichere Alternative „gegenüber“ bleibt in der Fußnote erhalten.
- source_word: ቀደሶ፡ ለእስራኤል
  choice: heiligte er Israel
  rationale: Bewahrt die direkte theologische Aussage und die aktive Verbform.
theological_decisions:
- issue: Verhältnis Israels zu Gott und den heiligen Engeln
  choice: damit sie bei ihm und bei seinen heiligen Engeln seien
  alternative: damit sie mit ihm und mit seinen heiligen Engeln seien
  rationale: „Bei“ drückt Gemeinschaft beziehungsweise Zugehörigkeit aus, ohne eine Gleichstellung Israels mit Gott oder den Engeln nahezulegen; der Plural „sie“ bezieht sich kollektiv auf Israel.
- issue: Ort beziehungsweise Zeugenschaft der Heiligung Israels
  choice: vor den Engeln
  alternative: gegenüber den Engeln
  rationale: Die kontextuell natürliche Lesart wird im Haupttext verwendet, während die echte lexikalische Mehrdeutigkeit von አንጻር durch eine Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der beiden Engelgruppen sowie die auffällige Wiederholung von „Erschaffung“ bleiben erhalten, weil sie die Struktur des ge’ezischen Textes abbilden. Der Gedankenstrich markiert den eingeschobenen Satzteil, ohne die syntaktische Spannung des Verses aufzulösen.
