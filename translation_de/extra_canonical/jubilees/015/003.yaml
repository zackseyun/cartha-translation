  text: And the Lord appeared to Abram and said to him, “I am God Shaddai; be pleasing before me, and be blameless.”
translation:
  language: de
  text: 'Und der Herr erschien Abram und sagte zu ihm: »Ich bin Gott Schaddai. Lebe so vor mir, dass du mir gefällst, und sei untadelig.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስተርአዮ
  choice: erschien
  rationale: Das Verb bezeichnet ein Sichtbarwerden bzw. Erscheinen und wird im Deutschen natürlich mit »erschien« wiedergegeben.
- source_word: አምላክ፡ ሰዳይ
  choice: Gott Schaddai
  rationale: Der Gottesname bzw. göttliche Titel wird nicht deutend übersetzt, sondern in seiner überlieferten Form bewahrt.
- source_word: አሥምር፡ ቅድሜየ
  choice: Lebe so vor mir, dass du mir gefällst
  rationale: አሥምር bedeutet hier »gefällig sein / tun, was gefällt«, nicht »gehen«. Die idiomatische Formulierung macht den Imperativ im modernen Deutschen verständlich und bewahrt »vor mir«.
- source_word: ኩን፡ ፍጹመ
  choice: sei untadelig
  rationale: ፍጹመ kann Vollständigkeit oder Makellosigkeit bezeichnen; »untadelig« entspricht in diesem ethischen Zusammenhang der Aufforderung, ohne Tadel zu leben.
theological_decisions:
- issue: Beziehung zur parallelen Formulierung in Genesis 17,1
  choice: Die ge’ezische Lesart »mir gefallen« wird eigenständig übersetzt.
  alternative: »Wandle vor mir« bzw. »Lebe vor mir« nach dem hebräischen Genesistext.
  rationale: Die Übersetzung folgt dem vorliegenden ge’ezischen Wortlaut und harmonisiert ihn nicht mit einer anderslautenden Parallelüberlieferung.
- issue: Wiedergabe des Titels Schaddai
  choice: Gott Schaddai
  alternative: Gott, der Allmächtige
  rationale: Die Transliteration bewahrt die mögliche Bedeutungsbreite des Titels und vermeidet eine nicht ausdrücklich im Ausgangstext aufgelöste Deutung.
translation_notes:
  register: Natürliches, modernes und würdevolles Standarddeutsch. Die etwas ausführlichere Wendung »Lebe so vor mir, dass du mir gefällst« vermeidet das im Deutschen unnatürliche »Sei mir wohlgefällig vor mir« und grenzt die ge’ezische Aussage zugleich klar von »wandle vor mir« ab.
