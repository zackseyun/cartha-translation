  source_fidelity: Die Übersetzung folgt dem geʾezischen Text. Insbesondere gibt »Lebe so vor mir, dass du mir gefällst« አሥምር፡ቅድሜየ angemessen als Aufforderung wieder, Gott zu gefallen, ohne den Wortlaut an die abweichende Genesis-Formulierung »wandle vor mir« anzugleichen. »Untadelig« trifft ፍጹመ im ethischen Kontext gut.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die Umschreibung »Lebe so vor mir, dass du mir gefällst« ist idiomatisch und macht den im Deutschen sonst schwer knapp wiederzugebenden Imperativ verständlich. »Und der Herr erschien Abram« ist in biblischem Register natürlich; Abram ist hierbei formal Dativ.
  terminology: »Herr«, »Abram«, »Gott Schaddai« und »untadelig« sind konsistent und sachgerecht. Die Transliteration von »Schaddai« bewahrt die im Ausgangstext nicht aufgelöste Bedeutung des Titels.
