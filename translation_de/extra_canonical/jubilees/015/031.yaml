  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: de
  text: Und er heiligte ihn und sammelte ihn aus allen Menschenkindern; denn es gibt viele Nationen und viele Völker, und sie alle gehören ihm. Über sie alle setzte er Geister ein, die sie davon abbringen sollten, ihm zu folgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um sie von hinter ihm weg irrezuführen“.'
    reason: Die Ausgangsformulierung ist ein räumlich formulierter semitischer Ausdruck für das Abbringen von der Nachfolge; die Fußnote bewahrt ihre konkrete Gestalt in einer syntaktisch klaren deutschen Form.
lexical_decisions:
- source_word: ወቀደሶ
  choice: Und er heiligte ihn
  rationale: Gibt das Verb ቀደሰ in seiner üblichen sakralen Bedeutung wieder und bewahrt das männliche Singularobjekt des Ausgangstextes.
- source_word: ወአስተጋብኦ
  choice: und sammelte ihn
  rationale: Bewahrt die konkrete Bedeutung „sammeln/zusammenbringen“ sowie die personifizierende Singularform, statt sie deutend durch „erwählen“ oder „aussondern“ zu ersetzen.
- source_word: እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: aus allen Menschenkindern
  rationale: Eine formnahe, im biblischen Register verständliche Wiedergabe von „aus allen Kindern der Menschen“.
- source_word: ብዙኅ፡ አሕዛብ፡ ወብዙኅ፡ ሕዝብ
  choice: viele Nationen und viele Völker
  rationale: Erhält die zweigliedrige Bezeichnung unterschiedlicher menschlicher Gemeinschaften, ohne beide Begriffe einzuebnen.
- source_word: ወኵሎሙ፡ ሎቱ
  choice: und sie alle gehören ihm
  rationale: Macht die nominale Besitz- bzw. Zugehörigkeitsaussage im Deutschen vollständig und natürlich.
- source_word: አሰለመ፡ መናፍስተ
  choice: setzte er Geister ein
  rationale: Gibt die Beauftragung oder Einsetzung von Geistern wieder, ohne ihre genaue Funktion stärker festzulegen, als der Kontext erlaubt.
- source_word: ያስሕትዎሙ
  choice: die sie davon abbringen sollten
  rationale: Das Kausativ bezeichnet ein Irreführen bzw. Abbringen; die Formulierung verbindet dies natürlich mit dem folgenden Ausdruck der Nachfolge.
- source_word: እምድኅሬሁ
  choice: ihm zu folgen
  rationale: Gibt die semitische Wendung wörtlich „von hinter ihm“ idiomatisch als Abkehr von der Nachfolge wieder.
theological_decisions:
- issue: Göttliche Zugehörigkeit der vielen Nationen und Völker
  choice: „sie alle gehören ihm“ bleibt uneingeschränkt stehen
  alternative: Die Aussage auf Israel oder nur auf einzelne Völker beziehen
  rationale: Der Quelltext bezieht „alle“ grammatisch auf die zuvor genannten Nationen und Völker; diese theologische Spannung wird nicht abgeschwächt.
- issue: Einsetzung irreführender Geister
  choice: Gott setzt die Geister über die Völker ein, damit sie sie von seiner Nachfolge abbringen
  alternative: Die Geister handeln lediglich mit göttlicher Erlaubnis oder aus eigenem Antrieb
  rationale: Die kausale und finale Struktur des Quelltextes wird bewahrt, ohne die schwierige Aussage konfessionell oder systematisch umzudeuten.
- issue: Singularobjekt bei Heiligung und Sammlung
  choice: Das wiederholte „ihn“ wird beibehalten
  alternative: Den Bezug ausdrücklich als Israel, Jakob oder das Volk identifizieren
  rationale: Der vorgelegte Vers nennt den Referenten nicht ausdrücklich; eine Auflösung würde Kontextdeutung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Färbung. „Menschenkinder“ und die personifizierende Singularform bleiben erhalten, während die finale Wendung idiomatisch formuliert wird. Die Pronomenmehrdeutigkeit und die theologische Spannung des Verses werden nicht aufgelöst.
