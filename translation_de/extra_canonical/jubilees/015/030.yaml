- source_word: ወኢኀረየ፡ ቦሙ
  choice: und erwählte sie nicht
  rationale: ‚Erwählen‘ entspricht dem theologischen und literarischen Gewicht des Verbs; das deutsche Pronomen fasst die genannte Gruppe zusammen.
- source_word: እስመ
  choice: obwohl …; weil
  rationale: Die zweimalige Konjunktion hat grundsätzlich kausale Bedeutung (‚denn/weil‘). Im ersten Satzgefüge erfordert der argumentative Zusammenhang eine konzessive Wiedergabe, während die zweite Instanz ausdrücklich kausal wiedergegeben wird; die formnähere Alternative wird in der Fußnote dokumentiert.
