  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: de
  text: Denn Ismael und seine Söhne, seine Brüder und Esau brachte der Herr nicht in seine Nähe und erwählte sie nicht, obwohl sie Abrahams Kinder sind; denn er kannte sie.[a] Israel aber erwählte er zu seinem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen hier zweimal kausale Verknüpfungen: „… denn sie sind Abrahams Kinder; denn er kannte sie.“ Wegen der knappen Satzfolge ist ihr genauer Bezug nicht völlig eindeutig. Die Hauptfassung versteht die erste Verknüpfung im Sinn eines Gegensatzes: obwohl sie Abrahams Kinder sind.'
    reason: Die Anmerkung dokumentiert die kausale Grundbedeutung von እስመ und die syntaktische Mehrdeutigkeit, ohne eine strittige Zuordnung als die wörtliche oder allein mögliche Lesart auszugeben.
