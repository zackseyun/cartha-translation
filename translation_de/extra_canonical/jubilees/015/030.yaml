  choice: Israel aber erwählte er zu seinem Volk
  rationale: Natürliches, würdevolles Deutsch; ‚aber‘ macht den im Text angelegten Gegensatz zur zuvor nicht erwählten Gruppe deutlich.
theological_decisions:
- issue: Verhältnis von Abstammung, göttlichem Wissen und Erwählung
  choice: „obwohl sie Abrahams Kinder sind, weil er sie kannte“
  alternative: „nicht, weil sie Abrahams Kinder sind; denn er kannte sie“
  rationale: Die Hauptfassung folgt der jüngsten quellensprachlichen Prüfung und bewahrt den kausalen Zusammenhang zwischen Gottes Wissen und der Nichterwählung. Wegen der knappen, mehrfach mit እስመ verbundenen Satzstruktur wird die mögliche abweichende Zuordnung der Kausalsätze in einer Fußnote offengelegt.
- issue: Gegenstand der Erwählung
  choice: Israel als Gottes Volk
  alternative: keine ergänzende Deutung als Kirche oder bestimmte spätere Glaubensgemeinschaft
  rationale: Die Übersetzung belässt die Aussage bei der im Vers ausdrücklich genannten Größe Israel und importiert keine konfessionelle Identifikation.
