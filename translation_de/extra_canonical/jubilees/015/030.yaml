  choice: Ismael und seine Söhne, seine Brüder und Esau
  rationale: Gibt die aufgezählte Personengruppe in natürlicher deutscher Syntax wieder; die Possessivformen werden entsprechend dem überlieferten Text beibehalten.
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: brachte … nicht in seine Nähe
