base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: de
  text: Und ich werde dich überaus groß machen und dich zu Völkern machen; Könige werden aus dir hervorgehen. Und ich werde meinen Bund aufrichten zwischen mir und dir und zwischen deinen Nachkommen nach dir, für alle ihre Generationen, als ewige Ordnung, damit ich dir und deinen Nachkommen nach dir Gott sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዐብየከ፡ ጥቀ
  choice: dich überaus groß machen
  rationale: Gibt die intensive Vergrößerungsformel eng und zugleich idiomatisch wieder.
- source_word: እሁበከ፡ ውስተ፡ አሕዛብ
  choice: dich zu Völkern werden lassen
  rationale: Bewahrt den pluralischen Zielbegriff ‚Völker‘; die deutsche Formulierung drückt das Bewirken eines Werdens natürlich aus.
- source_word: ይወፅኡ፡ እምኔከ
  choice: werden aus dir hervorgehen
  rationale: Entspricht dem räumlich-genealogischen Bild des Hervorgehens.
- source_word: እሁብ፡ ኪዳንየ
  choice: meinen Bund aufrichten
  rationale: Im Kontext einer Bundessetzung ist ‚aufrichten‘ idiomatischer und präziser als ein wörtliches ‚geben‘, ohne den Inhalt zu erweitern.
- source_word: ዘርእከ
  choice: deinen Nachkommen
  rationale: Das kollektiv gebrauchte Wort für ‚Same/Nachkommenschaft‘ wird im modernen Deutsch natürlich als ‚Nachkommen‘ wiedergegeben.
- source_word: በትዝምዶሙ
  choice: Generation für Generation
  rationale: Gibt die distributive zeitliche Reichweite über ihre Generationen hinweg klar und würdig wieder.
- source_word: ሥርዓት፡ ዘለዓለም
  choice: als ewige Ordnung
  rationale: Bewahrt den Rechts- bzw. Ordnungscharakter von ሥርዓት und seine unbegrenzte Dauer.
theological_decisions:
- issue: Bundesformel und Gottesbeziehung
  choice: damit ich dir und deinen Nachkommen nach dir Gott sei
  alternative: um dein Gott und der Gott deiner Nachkommen nach dir zu sein
  rationale: Die gewählte Fassung hält die prädikative und personale Form der Vorlage fest und vermeidet eine zusätzliche Besitzformulierung.
- issue: Kollektivsingular ‚Same‘
  choice: Nachkommen
  alternative: Same
  rationale: ‚Nachkommen‘ ist im heutigen Standarddeutsch verständlich und bewahrt den kollektiven Sinn, ohne unnötig archaisch oder biologisch zu wirken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bibelsprachlichem Rhythmus. Die Parallelstruktur und die wiederholte Wendung „nach dir“ bleiben erhalten; genuine Spannungen werden nicht harmonisiert.
