  source_fidelity: Die Übersetzung gibt die Abfolge und den theologischen Gehalt der ge’ezischen Vorlage im Wesentlichen zuverlässig wieder. Eine kleine Anpassung verbessert jedoch die Wiedergabe von „in/throughout their generations“ und die Gliederung der Bundesbeziehung.
  naturalness: „Dich zu Völkern werden lassen“ ist verständlich, klingt im modernen Standarddeutsch jedoch weniger idiomatisch als „dich zu Völkern machen“. „Für alle ihre Generationen“ ist zudem natürlicher und genauer als „Generation für Generation“.
  terminology: „Bund“, „Nachkommen“, „ewige Ordnung“ und die Gottesformel sind angemessen. Die Wiederholung von „zwischen“ macht die zweigliedrige Bundesformel der Vorlage im Deutschen klarer.
