  - severity: low
    issue: Zeitangabe bei den Generationen
    rationale: „Generation für Generation“ gibt die Dauer an, lässt aber den Bezug auf die Nachkommen weniger deutlich erkennen. „Für alle ihre Generationen“ bildet den possessiven Plural der Vorlage genauer ab.
  - severity: low
    issue: Bundesformel syntaktisch verdichtet
    rationale: Die Vorlage gliedert ausdrücklich „zwischen mir und dir“ sowie „zwischen ... deinen Nachkommen“. Die Wiederholung von „zwischen“ wahrt diese Struktur klarer.
