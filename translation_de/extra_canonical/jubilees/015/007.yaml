  yaml_path: translation/extra_canonical/jubilees/015/007.yaml
  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: de
  text: Und dein Name soll nicht mehr Abram heißen, sondern von nun an und für immer soll dein Name Abraham sein; denn ich habe dich zum Vater vieler Völker gemacht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: soll nicht mehr … heißen
  rationale: Die negative passive Namensformel wird im natürlichen modernen Deutsch mit „nicht mehr heißen“ wiedergegeben.
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: von nun an und für immer
  rationale: Bewahrt sowohl den gegenwärtigen Anfangspunkt als auch die unbegrenzte Dauer der ge'ezischen Wendung.
- source_word: አሕዛብ
  choice: Völker
  rationale: Im Zusammenhang bezeichnet das Wort mehrere ethnische beziehungsweise politische Völker; „Völker“ ist hier idiomatischer und weniger missverständlich als „Nationen“.
- source_word: ሤምኩከ
  choice: ich habe dich … gemacht
  rationale: Gibt die vollendete göttliche Einsetzung als bereits feststehende Handlung wieder.
theological_decisions:
- issue: Zeitform der Einsetzung Abrahams zum Vater vieler Völker
  choice: „ich habe dich … gemacht“
  alternative: „ich mache dich …“
  rationale: Die überlieferte Form und die Parallele in Genesis 17,5 stellen die Einsetzung als vollzogen beziehungsweise göttlich festgesetzt dar; diese Spannung zur erst künftigen Erfüllung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die feierliche Namensformel und ihre zeitliche Reichweite bleiben erhalten.
