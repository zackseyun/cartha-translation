base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: de
  text: Und großer Zorn des Herrn wird über die Kinder Israels kommen, weil sie seinen Bund verlassen haben, von seinem Wort abgewichen sind, ihn gereizt und gelästert haben, indem sie die Satzung dieses Gesetzes nicht befolgen. Denn sie haben sich selbst den Völkern gleichgemacht – zur Ausrottung und Vernichtung vom Erdboden. Es wird für sie keine Verzeihung und keine Vergebung mehr geben, durch die ihnen all die Sünde dieses ewigen Irrwegs verziehen und vergeben werden könnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዓት
  choice: Zorn
  rationale: Gibt das göttliche Strafgericht in diesem Zusammenhang direkt und würdig wieder.
- source_word: ውሉደ፡ እስራኤል
  choice: Kinder Israels
  rationale: Bewahrt die traditionelle, formal nahe Bezeichnung, die im Deutschen gut verständlich ist.
- source_word: ተገኅሡ
  choice: abgewichen
  rationale: Bezeichnet das Sich-Abwenden von Gottes Wort, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- source_word: ሥርዐተ፡ ለዝ፡ ሕግ
  choice: die Satzung dieses Gesetzes
  rationale: Bewahrt die Unterscheidung zwischen der konkreten Anordnung und dem Gesetz, zu dem sie gehört.
- source_word: ነፍሳቲሆሙ
  choice: sich selbst
  rationale: Das wörtliche 'ihre Seelen' fungiert hier idiomatisch als Reflexivbezeichnung; 'sich selbst' ist im modernen Deutschen natürlich.
- source_word: ለስስሎ፡ ወለተሠርዎ፡ እምድር
  choice: zur Ausrottung und Vernichtung von der Erde hinweg
  rationale: Gibt die beiden nachdrücklichen Gerichtsbegriffe wieder und lässt ihre knappe Zweck- oder Ergebnisbeziehung zum vorigen Satz bestehen.
- source_word: ኃጢአት፡ ለስሕተት
  choice: die Sünde dieses Irrwegs
  rationale: Nimmt das ausdrücklich vorhandene Wort für 'Sünde' auf; 'Irrweg' beschreibt hier stärker als bloßer intellektueller 'Irrtum' das schuldhafte Abweichen.
theological_decisions:
- issue: Bezug des Zorns
  choice: Zorn vom Herrn
  alternative: Zorn des Herrn
  rationale: Die Formulierung wahrt die im Ausgangstext ausgedrückte Herkunft des Zorns, ohne den Sinn theologisch auszuweiten.
- issue: Folge der Angleichung an die Völker
  choice: knappe Nominalfügung 'zur Ausrottung und Vernichtung'
  alternative: ausformulierter Passivzweck 'damit sie ausgerottet und vernichtet werden'
  rationale: Die knappe Form bewahrt die Härte und syntaktische Offenheit des Ausgangstextes, statt Zweck und Ergebnis eindeutig festzulegen.
- issue: Zeitlicher Bezug von ዘለዓለም
  choice: dieses ewigen Irrwegs
  alternative: dieses Irrwegs für immer
  rationale: Der nächstliegende Bezug ist auf 'Irrweg'; die mögliche adverbiale Zuordnung wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst biblischem Klang. Parallele Begriffe wie „Verzeihung/Vergebung“ und „verziehen/vergeben“ bleiben erhalten, weil sie die rhetorische Doppelung des ge'ezischen Textes spiegeln.
