review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die zentralen Elemente des ge'ezischen Textes grundsätzlich wieder, einschließlich des ausdrücklich genannten Begriffs „Sünde“, der doppelten Vergebungsformel und der Verbindung von Angleichung an die Völker mit Ausrottung und Vernichtung. Die Schlusskonstruktion mit „sodass ... würde“ verschiebt jedoch die Aussage in ein unpassendes, hypothetisches Folgeverhältnis.
  naturalness: „Großer Zorn vom Herrn“ und besonders „von der Erde hinweg“ wirken im modernen Standarddeutsch unidiomatisch. Der letzte Satz ist zudem trotz seiner formalen Nähe schwer verständlich und logisch missverständlich. Eine klare negative Modalformulierung wahrt den Sinn besser.
  terminology: „Bund“, „Wort“, „Satzung“, „Ausrottung“, „Vernichtung“, „Sünde“ und „Irrweg“ sind angemessen. „Zorn des Herrn“ ist im Deutschen die natürliche und zugleich quellennahe Formulierung. Die Doppelung „Verzeihung und Vergebung“ kann als rhetorische Entsprechung der Quelle erhalten bleiben.
  issues:
  - severity: medium
    issue: Unnatürliche und missverständliche Schlussfolgerung
    rationale: „Dann gibt es für sie weder Verzeihung noch Vergebung mehr, sodass ihnen ... verziehen und vergeben würde“ kann den Eindruck erwecken, die fehlende Vergebung führe dennoch zu Vergebung. Die Quelle besagt gerade, dass keinerlei Vergebung verfügbar sein wird.
  - severity: low
    issue: Idiomatikwidriges „vom Herrn“ und „von der Erde hinweg“
    rationale: „Zorn des Herrn“ sowie „vom Erdboden“ sind in modernem Standarddeutsch deutlich natürlicher und geben Herkunft beziehungsweise Entfernung von der Erde ausreichend wieder.
  - severity: low
    issue: Fußnote stützt eine im vorliegenden Text nicht nötige syntaktische Alternative
    rationale: Die Fußnote zu „für immer“ legt einen adverbialen Bezug nahe, der in der deutschen Zielformulierung nicht gut abbildbar ist und die klarere Lesart „ewigen Irrwegs“ unnötig belastet.
  revised_text: Und großer Zorn des Herrn wird über die Kinder Israels kommen, weil sie seinen Bund verlassen haben, von seinem Wort abgewichen sind, ihn gereizt und gelästert haben, indem sie die Satzung dieses Gesetzes nicht befolgen. Denn sie haben sich selbst den Völkern gleichgemacht – zur Ausrottung und Vernichtung vom Erdboden. Es wird für sie keine Verzeihung und keine Vergebung mehr geben, durch die ihnen all die Sünde dieses ewigen Irrwegs verziehen und vergeben werden könnte.
