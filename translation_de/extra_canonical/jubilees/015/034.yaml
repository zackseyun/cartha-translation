revisions:
- from: Und großer Zorn vom Herrn wird über die Kinder Israels kommen, weil sie seinen Bund verlassen haben, von seinem Wort abgewichen sind, ihn gereizt und gelästert haben, indem sie die Satzung dieses Gesetzes nicht befolgen. Denn sie haben sich selbst den Völkern gleichgemacht – zur Ausrottung und Vernichtung von der Erde hinweg. Dann gibt es für sie weder Verzeihung noch Vergebung mehr, sodass ihnen all die Sünde dieses ewigen Irrwegs[a] verziehen und vergeben würde.
  to: Und großer Zorn des Herrn wird über die Kinder Israels kommen, weil sie seinen Bund verlassen haben, von seinem Wort abgewichen sind, ihn gereizt und gelästert haben, indem sie die Satzung dieses Gesetzes nicht befolgen. Denn sie haben sich selbst den Völkern gleichgemacht – zur Ausrottung und Vernichtung vom Erdboden. Es wird für sie keine Verzeihung und keine Vergebung mehr geben, durch die ihnen all die Sünde dieses ewigen Irrwegs verziehen und vergeben werden könnte.
  rationale: Die Überarbeitung beseitigt die missverständliche hypothetische „sodass“-Konstruktion, ohne den umfassenden Charakter der verweigerten Vergebung oder die rhetorische Doppelung der Quelle aufzugeben. Zugleich werden zwei im Deutschen unnatürliche Formulierungen idiomatisch und quellengetreu geglättet. Die Fußnote wird weggelassen, da die sichere, dem englischen Audit entsprechende Lesart „dieses ewigen Irrwegs“ im Haupttext steht und keine für die Übersetzung notwendige abweichende Lesart dokumentiert werden muss.
