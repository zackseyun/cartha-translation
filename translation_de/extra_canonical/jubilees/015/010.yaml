  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: de
  text: Und ich werde dir und deinen Nachkommen nach dir das Land geben, in dem du als Fremder gelebt hast, das Land Kanaan, als ewigen Besitz; und ich werde ihr Gott sein.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: deinen Nachkommen
  rationale: Das äthiopische Wort bezeichnet wörtlich den »Samen«, kann aber kollektiv die Nachkommenschaft meinen. »Nachkommen« ist im heutigen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: ፈለስከ
  choice: du als Fremder gelebt hast
  rationale: Die Form bezeichnet den Aufenthalt als Fremder beziehungsweise Beisasse. Diese Wiedergabe macht den rechtlich-sozialen Fremdlingsstatus deutlich, ohne bloßes Reisen anzudeuten.
- source_word: ዘትኳን
  choice: als ewigen Besitz
  rationale: Die Wendung beschreibt das Land als bleibenden beziehungsweise ewigen Besitz. »Ewig« erhält die starke zeitliche Aussage des Ausgangstextes.
- source_word: እከውኖሙ አምላከ
  choice: ich werde ihr Gott sein
  rationale: Die Mehrzahl »ihr« bezieht sich auf die kollektiv verstandenen Nachkommen und bewahrt den Bundescharakter der Aussage.
theological_decisions:
- issue: Zeitliche Reichweite des Landbesitzes
  choice: ewigen Besitz
  alternative: dauernden Besitz
  rationale: Der Ausgangstext hat eine starke, wörtlich auf Dauer beziehungsweise Ewigkeit gerichtete Formulierung. Die Übersetzung lässt deren mögliche theologische Spannung bestehen, statt sie abzuschwächen.
- issue: Bezug des Pronomens in der Gottesformel
  choice: ihr Gott
  alternative: dein Gott
  rationale: Die pluralische Form im Ausgangstext verweist auf Abrahams Nachkommen. Dieser Wechsel vom Singular zum Plural wird beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die traditionelle Bundesformel bleibt erhalten; »als Fremder gelebt hast« ist verständlicher als das heute ungebräuchliche »Fremdling gewesen bist«.
