  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: de
  text: Das Volk Israel jedoch übergab er weder einem Engel noch einem Geist; keinem von ihnen vertraute er es an.[a] Denn er allein ist ihr Herrscher. Er wird sie behüten und sie aus der Hand seiner Engel, aus der Hand seiner Geister und aus der Hand aller seiner Gewalten zurückfordern,[b] damit er sie behütet und segnet und damit sie ihm gehören und er ihnen gehört, von nun an bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über Israel setzte er weder einen Engel noch einen Geist ein.“'
    reason: Die Verbindung der Präposition „über“ mit den beiden Verben kann funktional als Einsetzung über Israel verstanden werden; die Hauptfassung bewahrt stärker die Nuancen „übergeben“ und „anvertrauen“.
  - marker: b
    text: 'Wörtlicher auch: „von der Hand … fordern“; das Verb kann ebenso „suchen“ oder „verlangen“ bedeuten.'
    reason: Die Ausgangsform umfasst Suchen, Fordern und Verlangen; zusammen mit „aus der Hand“ kann sie Rückforderung oder Rechenschaft ausdrücken.
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ፡
  choice: übergab er … nicht; … vertraute er es nicht an
  rationale: Die beiden Verben werden getrennt wiedergegeben, damit die Bedeutungsnuancen des Übergebens und Anvertrauens erhalten bleiben. „Das Volk Israel“ macht das im Deutschen erforderliche Objekt und den anschließenden Numeruswechsel verständlich.
- source_word: መኰንኖሙ፡
  choice: ihr Herrscher
  rationale: Gibt die persönliche Herrschafts- und Leitungsfunktion würdig und ohne konfessionelle Zusatzdeutung wieder.
- source_word: የዐቅቦሙ፡ / ይዕቀቦሙ፡
  choice: sie behüten / damit er sie behütet
  rationale: Das wiederholte Ausgangsverb wird konsequent gleich übersetzt; „behüten“ verbindet Schutz und fürsorgliche Bewahrung.
- source_word: ይትኀሠሦሙ፡ እምእዴ፡
  choice: sie aus der Hand … zurückfordern
  rationale: Im Zusammenhang mit „aus der Hand“ bezeichnet das Verb nicht bloß ein Suchen, sondern ein forderndes Zurückverlangen beziehungsweise Rechenschaftfordern. „Zurückfordern“ ist im heutigen Deutsch verständlich und bewahrt das Bild.
- source_word: ኵሉ፡ ትእዛዝያኒሁ፡
  choice: alle seine Gewalten
  rationale: „Gewalten“ wahrt den übermenschlichen und herrschaftlichen Sinn im Kontext der Engel und Geister, ohne die Wesen genauer zu bestimmen, als es die Vorlage tut.
- source_word: እምይእዜ፡ ወእስከ፡ ለዓለም።
  choice: von nun an bis in Ewigkeit
  rationale: Natürliche, feierliche Wiedergabe der zeitlichen Formel.
theological_decisions:
- issue: Gottes unmittelbare Herrschaft über Israel im Unterschied zu Engel- oder Geistmächten
  choice: Israel wird keinem Engel oder Geist übergeben oder anvertraut; Gott allein bleibt sein Herrscher.
  alternative: Über Israel wurde kein Engel oder Geist eingesetzt.
  rationale: Die Hauptfassung erhält beide ge'ezischen Verben und damit die Vorstellung, Israel sei anders als andere Völker keiner himmlischen Zwischenmacht übergeben. Die mögliche funktionale Deutung „einsetzen“ wird in der Fußnote bewahrt.
- issue: Gottes Anspruch gegenüber seinen Engeln, Geistern und Gewalten
  choice: zurückfordern
  alternative: bei ihnen suchen; von ihrer Hand fordern
  rationale: Die Formulierung lässt sowohl Rückgewinnung als auch Verantwortlichkeit anklingen, ohne eine ausgearbeitete Engellehre in den Text einzutragen.
- issue: Bundesartige wechselseitige Zugehörigkeit
  choice: damit sie ihm gehören und er ihnen gehört
  alternative: damit sie sein seien und er der Ihre sei
  rationale: Die direkte wechselseitige Aussage bleibt erhalten; modernes Deutsch vermeidet die unnatürliche nominale Formulierung, ohne die theologische Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die Wiederholung „aus der Hand“ und das zweimalige „behüten“ bleiben als prägende Struktur der Vorlage erhalten. „Gewalten“ wird als knappe Bezeichnung himmlischer Autoritäten verwendet.
