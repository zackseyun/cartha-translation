  text: In the fifth year of the fourth week of this jubilee, in the third month, in the middle of the month, Abram celebrated the festival of the firstfruits of the wheat harvest.
translation:
  language: de
  text: Im fünften Jahr der vierten Jahrwoche dieses Jubiläums, im dritten Monat, zur Mitte des Monats, feierte Abram das Fest der Erstlingsfrüchte der Weizenernte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልዉን
  choice: Jubiläum
  rationale: Bezeichnet den Jubiläumszeitraum innerhalb der chronologischen Gliederung des Buches; „dieses Jubiläums“ gibt die genitivische Beziehung natürlich wieder.
- source_word: መንፈቀ፡ ወርኀ
  choice: zur Mitte des Monats
  rationale: Gibt die zeitliche Angabe „in der Mitte des Monats“ idiomatisch und ohne zusätzliche Festlegung auf einen bestimmten Kalendertag wieder.
- source_word: ቀዳሜ፡ ማእረር
  choice: Erstlingsfrüchte
  rationale: Bezeichnet die ersten Erträge der Ernte im Zusammenhang mit dem gefeierten Fest.
- source_word: ስርናይ
  choice: Weizenernte
  rationale: Das Substantiv bezeichnet spezifisch Weizen und nicht lediglich Getreide allgemein; zusammen mit dem Ernteausdruck ergibt sich „Weizenernte“.
