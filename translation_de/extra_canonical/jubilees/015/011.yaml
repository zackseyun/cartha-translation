  yaml_path: translation/extra_canonical/jubilees/015/011.yaml
  text: 'And the Lord said to Abraham, “And as for you, keep my covenant, you and your seed after you. And circumcise every male among you, and circumcise the flesh of your foreskins, and it shall be a sign of an everlasting ordinance between me and you. And a son of eight days you shall circumcise—every male among you, one born in the house and one bought with your gold [or ''money''] from any sons of foreigners who are not from your seed. The one born in your house must surely be circumcised, and the one whom you bought with your silver must be circumcised; and my covenant shall be in your flesh as an everlasting ordinance. But an uncircumcised male, one whose foreskin''s flesh is not circumcised on the eighth day, that person shall be cut off from his kin, because he has broken my covenant.” And the Lord said to Abraham, “As for Sarai your wife, you shall no longer call her name Sarai, for Sarah is her name. And I will bless her, and from her I will give you a son; and I will bless him,
    and he shall become a nation, and kings of nations shall come from him.” And Abraham fell on his face and rejoiced, and he said in his heart, “Shall a son be born to one a hundred years old? And shall Sarah, who is ninety years old, give birth?” And Abraham said to the Lord, “If only Ishmael might live before you!” And God said, “Yes, and Sarah shall bear you a son, and you shall call his name Isaac; and I will establish my covenant with him, an everlasting covenant, and with his seed after him. And concerning Ishmael also, I have heard you. Behold, I will bless him and make him fruitful and multiply him very greatly; he shall father twelve princes, and I will make him into a great nation. But my covenant I will establish with Isaac, whom Sarah shall bear to you at this time in the next year.” And he finished speaking with him, and the Lord went up from Abraham. And Abraham did as the Lord had said to him, and he took Ishmael his son and all those born in his house and those bought with
    silver, every male in his house, and circumcised the flesh of their foreskins. And on that very day Abraham was circumcised, and all the men of his house—those born in his house—and all those bought with silver from the sons of foreigners were circumcised with him. This is a statute for all the generations forever: there is no delaying of days, and no omission of even one day from eight days, for it is an everlasting ordinance, ordained and written on the heavenly tablets. And everyone who is born whose flesh of foreskin is not circumcised on the eighth day does not belong to the children of the covenant that the Lord made with Abraham, for he belongs to the children of destruction; and there is no sign on him that he belongs to the Lord, but he is for destruction, and for being destroyed from the earth, and for being rooted out from the earth, because he has broken the covenant of the Lord our God.'
translation:
  language: de
  text: 'Und der Herr sagte zu Abraham: »Du aber halte meinen Bund, du und deine Nachkommen nach dir. Alles Männliche unter euch soll beschnitten werden. Beschneidet das Fleisch eurer Vorhaut; dies soll ein Zeichen einer ewigen Ordnung zwischen mir und euch sein. Jeden männlichen Säugling unter euch sollt ihr am achten Tag beschneiden: den im Haus Geborenen und den, der von irgendwelchen Fremden, die nicht von deinen Nachkommen sind, mit eurem Gold[a] gekauft wurde. Der in deinem Haus Geborene muss beschnitten werden, und der mit deinem Gold Gekaufte muss beschnitten werden. So soll mein Bund als ewige Ordnung an eurem Fleisch sein. Ein unbeschnittener Mann aber, dessen Vorhautfleisch am achten Tag nicht beschnitten worden ist, soll aus seiner Verwandtschaft ausgerottet werden, denn er hat meinen Bund gebrochen.«


    Und der Herr sagte zu Abraham: »Sarai, deine Frau, sollst du nicht länger Sarai nennen; vielmehr soll ihr Name Sara sein. Ich werde sie segnen und dir von ihr einen Sohn geben. Ihn werde ich segnen; er wird zu einem Volk werden, und Könige von Völkern werden aus ihm hervorgehen.«


    Da fiel Abraham auf sein Angesicht und freute sich. In seinem Herzen sagte er: »Kann einem Hundertjährigen noch ein Sohn geboren werden? Und kann Sara, die neunzig Jahre alt ist, noch gebären?« Abraham sagte zum Herrn: »Wenn doch nur Ismael vor dir leben dürfte!«


    Gott sagte: »Ja, und Sara wird dir einen Sohn gebären, und du sollst ihn Isaak nennen. Mit ihm werde ich meinen Bund aufrichten, einen ewigen Bund, und ebenso mit seinen Nachkommen nach ihm. Auch wegen Ismael habe ich dich erhört. Siehe, ich werde ihn segnen, ihn fruchtbar machen und ihn überaus stark vermehren. Zwölf Fürsten wird er zeugen, und ich werde ihn zu einem großen Volk machen. Meinen Bund aber werde ich mit Isaak aufrichten, den Sara dir um diese Zeit im nächsten Jahr gebären wird.«


    Als er sein Gespräch mit ihm beendet hatte, stieg der Herr von Abraham auf. Abraham tat, wie der Herr ihm gesagt hatte. Er nahm seinen Sohn Ismael, alle in seinem Haus Geborenen und alle mit Gold Gekauften, alles Männliche in seinem Haus, und beschnitt das Fleisch ihrer Vorhaut. Noch an diesem selben Tag wurden Abraham und alle Männer seines Hauses beschnitten – die in seinem Haus Geborenen und alle, die von Fremden mit Gold gekauft worden waren, wurden zusammen mit ihm beschnitten.


    Dies ist eine Satzung für alle Generationen auf ewig: Die festgesetzte Zahl der Tage darf nicht hinausgeschoben und von den acht Tagen darf nicht ein einziger Tag ausgelassen werden; denn es ist eine ewige Ordnung, angeordnet und auf den himmlischen Tafeln niedergeschrieben. Jeder Geborene, dessen Vorhautfleisch am achten Tag nicht beschnitten wird, gehört nicht zu den Kindern des Bundes, den der Herr mit Abraham geschlossen hat, sondern zu den Kindern des Verderbens. An ihm ist kein Zeichen dafür, dass er dem Herrn gehört. Vielmehr ist er dem Verderben bestimmt: Er soll von der Erde vernichtet und aus der Erde ausgerottet werden, denn er hat den Bund des Herrn, unseres Gottes, gebrochen.'
