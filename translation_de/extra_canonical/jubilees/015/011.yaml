  footnotes:
  - marker: a
    text: 'Oder: »mit eurem Geld«; das ge’ezische Wort bedeutet wörtlich »Gold« und kann auch Zahlungsmittel bezeichnen.'
    reason: Die erweiterte monetäre Bedeutung ist möglich, während die Hauptübersetzung die konkrete Wortwahl des ge’ezischen Textes bewahrt.
lexical_decisions:
- source_word: ወርቅ (warq)
  choice: Gold
  rationale: Das ge’ezische Wort bezeichnet ausdrücklich Gold und kann erweitert auch Zahlungsmittel oder Geld bedeuten. Die Übersetzung folgt dieser Lesart statt dem aus Genesis 17 vertrauten »Silber«.
- source_word: ዘርእ (zarʾ)
  choice: Nachkommen
  rationale: Im Deutschen gibt »Nachkommen« den kollektiven Sinn natürlicher wieder als das wörtliche »Same«, ohne die Abstammungsbedeutung aufzulösen.
- source_word: መላእክት (malāʾəkt)
  choice: Fürsten
  rationale: Im Kontext der zwölf von Ismael gezeugten Herrscher ist die Bedeutung »Fürsten« sachgemäß; »Engel« oder »Boten« wäre hier kontextuell irreführend.
- source_word: ሥርዓት ዘለዓለም (śərʿāt za-laʿālam)
  choice: ewige Ordnung
  rationale: Die Wiedergabe wahrt den institutionellen Charakter von śərʿāt und vermeidet eine unnötige Einengung auf »Gesetz« oder »Bund«.
- source_word: ትሤረር (təsērar)
  choice: ausgerottet werden
  rationale: Die Form bezeichnet den Ausschluss beziehungsweise die Beseitigung aus der Verwandtschaft; die traditionelle, zugleich verständliche Bundesformel »ausgerottet werden« bewahrt die Schärfe.
theological_decisions:
- issue: Bezug der männlichen Pronomen nach der Verheißung des Sohnes
  choice: »Ihn werde ich segnen; er wird zu einem Volk werden, und Könige von Völkern werden aus ihm hervorgehen.«
  alternative: »Ich werde sie segnen; sie wird zu Völkern werden, und Könige von Völkern werden aus ihr hervorgehen.«
  rationale: Der ge’ezische Text hat ausdrücklich männliche Pronominalsuffixe und bezieht die Aussagen auf den verheißenen Sohn. Die abweichende Form des hebräischen Textes von Genesis 17 darf nicht in Jubilees eingetragen werden.
- issue: Status des nicht am achten Tag Beschnittenen
  choice: Die harten Ausschluss- und Verderbensaussagen werden ohne Abschwächung wiedergegeben.
  alternative: Eine spiritualisierende oder nur symbolische Deutung
  rationale: Der Ausgangstext formuliert eine konkrete Bundesordnung und verbindet ihre Verletzung ausdrücklich mit Ausschluss, Verderben, Vernichtung und Ausrottung. Die Übersetzung bewahrt diese theologische Spannung, ohne sie auszulegen.
- issue: »vor dir leben« bei Ismael
  choice: »Wenn doch nur Ismael vor dir leben dürfte!«
  alternative: »Wenn du doch Ismael am Leben ließest!«
  rationale: Die formelhafte Wendung bezeichnet Leben in Gottes Gegenwart beziehungsweise Gunst und sollte nicht auf bloßes physisches Überleben verengt werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit moderater Nähe zur Satzstruktur des ge’ezischen Textes. Wiederholungen der Bundes- und Beschneidungsformeln wurden bewusst erhalten. Archaismen wurden weitgehend vermieden; feste biblische Wendungen wie »auf sein Angesicht fallen«, »Bund aufrichten« und »siehe« bleiben dort stehen, wo sie verständlich und stilistisch tragfähig sind.
