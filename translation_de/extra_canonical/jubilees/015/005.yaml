  yaml_path: translation/extra_canonical/jubilees/015/005.yaml
  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: de
  text: 'Da fiel Abram auf sein Angesicht. Gott sprach mit ihm und sagte: »Siehe, mein Bund ist mit dir, und du wirst zum Vater vieler Völker werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዓትየ
  choice: mein Bund
  rationale: Das Wort kann grundsätzlich »Ordnung, Satzung, Bestimmung« bezeichnen; im unmittelbaren Bundeskontext von Jub 15 und entsprechend Gen 17,4 gibt »Bund« den gemeinten Beziehungsakt am treffendsten wieder.
- source_word: አሕዛብ
  choice: Völker
  rationale: Bezeichnet hier mehrere Völker bzw. Nationen; »Völker« ist im Deutschen natürlich und vermeidet die in diesem Zusammenhang unpassende Engführung auf »Heiden«.
- source_word: ወትከውን
  choice: du wirst ... werden
  rationale: Gibt die futurische Aussage wieder und bewahrt den zugesagten Übergang in Abrams neue Stellung.
theological_decisions:
- issue: Bedeutung von ሥርዓትየ im Kontext
  choice: Bund
  alternative: Satzung / Ordnung
  rationale: Obwohl das Lexem einen weiteren Bedeutungsumfang hat, verlangt die Bundesrede in diesem Abschnitt nach »Bund«. Damit wird keine zusätzliche konfessionelle Deutung eingeführt.
- issue: Abrams Vaterschaft
  choice: Vater vieler Völker
  alternative: Vater einer Menge von Völkern
  rationale: Die knappe Formulierung folgt dem ge'ezischen Text und lässt Umfang und Art dieser Vaterschaft unausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Auf sein Angesicht fallen« bewahrt die körperliche Geste des Ausgangstextes; »Siehe« erhält den feierlichen Aufmerksamkeitsruf. Direkte Rede und Satzglieder sind für gute heutige Lesbarkeit gegliedert.
