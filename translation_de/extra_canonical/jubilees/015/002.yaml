  yaml_path: translation/extra_canonical/jubilees/015/002.yaml
  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: de
  text: 'Und er brachte auf dem Altar ein neues Opfer dar, die Erstlinge des Ertrags, für den HERRN: ein Rind, eine Ziege und ein Schaf auf dem Altar als einen wohlgefälligen Duft für den HERRN. Und ihre Speisopfer und ihre Trankopfer brachte er mit Räucherwerk auf dem Altar dar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ ሐዲስ
  choice: ein neues Opfer
  rationale: Gibt die Verbindung aus »Opfer« und »neu« formal und natürlich wieder.
- source_word: ቀዳሜ፡ እክል
  choice: die Erstlinge des Ertrags
  rationale: ቀዳሜ bezeichnet das Erste bzw. die Erstlinge; እክል meint Ertrag, Frucht oder Nahrung. »Ertrag« wahrt den landwirtschaftlichen Zusammenhang, ohne auf Getreide zu verengen.
- source_word: ላህመ
  choice: ein Rind
  rationale: Die Tierbezeichnung lässt sich allgemein als Rind wiedergeben; dadurch wird eine im Ausdruck nicht sicher festgelegte Alters- oder Geschlechtsbestimmung vermieden.
- source_word: በሐኮ
  choice: einen Ziegenbock
  rationale: Bezeichnet hier ein Tier aus der Ziege bzw. einen jungen Ziegenbock; »Ziegenbock« unterscheidet es klar vom Schaf und folgt der korrigierten Quellenauswertung statt der älteren Wiedergabe »Widder«.
- source_word: በግዐ
  choice: ein Schaf
  rationale: Die allgemeine Wiedergabe »Schaf« bewahrt die lexikalische Breite, ohne unbelegt Geschlecht oder Alter festzulegen.
- source_word: ጽንሓሐ፡ ለእግዚአብሔር
  choice: als einen wohlgefälligen Duft für den HERRN
  rationale: Der Ausdruck bezeichnet einen angenehmen bzw. annehmbaren Duft vor Gott; »wohlgefälliger Duft« bewahrt den kultischen Sinn und vermeidet die sachlich engere Deutung als Brandopfer.
- source_word: ሞጻሕቶሙ
  choice: ihre Trankopfer
  rationale: Entspricht der kultischen Bezeichnung für ausgegossene Opfergaben.
- source_word: ስኂን
  choice: Räucherwerk
  rationale: Gibt den allgemeinen Sinn von Räucherstoff bzw. Weihrauchwerk wieder, ohne unnötig auf reinen Weihrauch zu verengen.
theological_decisions:
- issue: Kultische Wendung als Duft oder Opferart
  choice: wohlgefälliger Duft
  alternative: Brandopfer
  rationale: Die Quelle beschreibt die Wirkung bzw. Annahme des Opfers als Duft für den HERRN und benennt hier nicht eindeutig eine bestimmte Opferart.
- issue: Gottesname
  choice: HERRN
  alternative: Herrn
  rationale: Die traditionelle Kapitälchenschreibung signalisiert im Deutschen den Gottesnamen, ohne eine unsichere Aussprache in den Text einzutragen.
- issue: Bezug der Pluralpronomina bei Speis- und Trankopfern
  choice: ihre Speisopfer und ihre Trankopfer
  alternative: das dazugehörige Speisopfer und Trankopfer
  rationale: Der Plural der Quelle bleibt sichtbar und wird nicht stillschweigend zu einem Sammelsingular harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Fachsprache, die auch für heutige Leser verständlich bleibt. Die Satzgliederung folgt dem Quelltext, wird jedoch zur besseren Lesbarkeit in zwei Sätze aufgeteilt. Echte lexikalische Breite wird bei »Rind«, »Schaf« und »Räucherwerk« bewahrt.
