- from: Und du, gebiete den Kindern Israels, das Zeichen des Bundes über alle ihre Generationen hinweg als ewige Ordnung zu bewahren, damit sie nicht aus dem Land ausgerottet werden.
  to: Und du, gebiete den Kindern Israels, das Zeichen des Bundes über alle ihre Generationen hinweg als ewige Ordnung zu bewahren, und sie werden nicht aus dem Land herausgerissen werden.
  rationale: Der Schlusssatz wird als koordinierte Zukunftsaussage wiedergegeben, ohne das im Ausgangstext nicht ausdrücklich festgelegte logische Verhältnis als Zweck zu bestimmen. Die Formulierung „aus dem Land herausgerissen“ gibt das Bild des Entwurzeltwerdens bzw. Entfernens genauer wieder als „ausgerottet“.
