  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: de
  text: Und du, gebiete den Kindern Israels, das Zeichen des Bundes über alle ihre Generationen hinweg als ewige Ordnung zu bewahren, und sie werden nicht aus dem Land herausgerissen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: Und du
  rationale: Gibt die koordinierende Konjunktion und das ausdrücklich hervorgehobene Personalpronomen wieder, ohne das im Ge'ez nicht vorhandene „nun“ einzufügen.
- source_word: ለውሉደ፡ እስራኤል
  choice: den Kindern Israels
  rationale: Traditionelle und allgemein verständliche Wiedergabe der genealogischen Bezeichnung.
- source_word: ትእምርተ፡ ኪዳን
  choice: das Zeichen des Bundes
  rationale: Entspricht der bestimmten Genitivverbindung; „dieses Bundes“ wäre stärker bestimmt als die Quelle.
- source_word: ለትውልዶሙ
  choice: über alle ihre Generationen hinweg
  rationale: Natürliches Deutsch für die fortdauernde Geltung in ihren aufeinanderfolgenden Generationen.
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: als ewige Ordnung
  rationale: Bewahrt sowohl den normativen Sinn von ሥርዐት als auch die dauerhafte Geltung.
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: damit sie nicht aus dem Land ausgerottet werden
  rationale: Gibt das passive Entfernt- oder Ausgerottetwerden aus dem Land wieder; der finale Zusammenhang mit dem Gebot wird im Deutschen natürlich ausgedrückt.
theological_decisions:
- issue: Logisches Verhältnis des letzten Satzglieds
  choice: damit sie nicht aus dem Land ausgerottet werden
  alternative: und sie werden nicht aus dem Land ausgerottet werden
  rationale: Die Verbform nach der Gebotsfolge lässt sich als abhängige Zweck- oder Folgewendung verstehen. Die gewählte Fassung macht die Verbindung zum Bewahren des Bundeszeichens verständlich, ohne eine bedingungslose Verheißung zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Und du“ erhält die Hervorhebung der Quelle; „ewige Ordnung“ wahrt den rechtlich-kultischen Ton.
