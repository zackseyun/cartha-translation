review_pass:
  verdict: revise
  source_fidelity: Die Anrede, das Gebot an die Kinder Israels, „das Zeichen des Bundes“, die generationsübergreifende Geltung und „ewige Ordnung“ sind quellentreu wiedergegeben. Das abschließende Satzglied ist jedoch im Ausgangstext koordinierend formuliert und entspricht dem englischen Audit-Trail „and they shall not be uprooted from the land“; die finale Einordnung mit „damit“ ist nicht abgesichert und verändert das Verhältnis der Aussageglieder.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Aus dem Land herausgerissen werden“ ist hier idiomatischer und semantisch präziser als „aus dem Land ausgerottet werden“, das im Deutschen vor allem die Vernichtung von Menschen bezeichnet.
  terminology: „Kinder Israels“, „Zeichen des Bundes“ und „ewige Ordnung“ sind angemessene, traditionsbewusste und zugleich verständliche Wiedergaben. „Herausgerissen“ wahrt für das letzte Verb die bildhafte Bedeutung des Entwurzeltwerdens bzw. Entferntwerdens, ohne unnötig eine Tötung auszusagen.
  issues:
  - severity: medium
    issue: Finale Umdeutung des Schlusssatzes durch „damit“
    rationale: Die Quelle verbindet den Schlusssatz mit „und“. Eine Zweckbestimmung ist möglich zu interpretieren, wird aber nicht ausdrücklich markiert und sollte daher nicht in den Text eingebracht werden.
  - severity: medium
    issue: „ausgerottet“ ist zu eng und kann Vernichtung statt Entfernung ausdrücken
    rationale: Der Sinn betrifft das Herausgerissen- oder Entwurzeltwerden aus dem Land. „Ausgerottet“ legt im heutigen Deutsch vorrangig physische Auslöschung nahe.
  revised_text: Und du, gebiete den Kindern Israels, das Zeichen des Bundes über alle ihre Generationen hinweg als ewige Ordnung zu bewahren, und sie werden nicht aus dem Land herausgerissen werden.
  revised_footnotes: []
