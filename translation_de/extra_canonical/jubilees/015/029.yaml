    rationale: Die Formulierung lässt im Deutschen offen, wer das Gebot halten soll, und klingt räumlich bzw. distributiv. „Damit alle Kinder Israels es … einhalten“ gibt die umfassende Verpflichtung klar wieder.
  - severity: low
    issue: „es ... halten“ für ein Gebot
    rationale: Die Wendung ist zwar biblisch möglich, im modernen Standarddeutsch jedoch weniger eindeutig. „Einhalten“ bezeichnet die Befolgung eines Gebots direkt und ohne Bedeutungsverlust.
