  text: For the command has been ordained as a covenant, that they should keep it forever among all the children of Israel.
translation:
  language: de
  text: Denn das Gebot wurde als Bund eingesetzt, damit alle Kinder Israels es für immer einhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዝ
  choice: das Gebot
  rationale: Die äthiopische Form bezeichnet eine verbindliche Anordnung oder ein Gebot; im Zusammenhang ist der bestimmte Singular angemessen.
- source_word: ተሠርዐ
  choice: wurde … eingesetzt
  rationale: Das Verb trägt den Sinn von anordnen, festsetzen oder einsetzen. Die Passivform des Ausgangstextes bleibt erhalten.
- source_word: ለኪዳን
  choice: als Bund
  rationale: Die Präposition mit ኪዳን beschreibt hier die Bestimmung beziehungsweise Geltung der Anordnung als Bund.
- source_word: ከመ፡ ይዕቀብዎ
  choice: damit sie es … halten
  rationale: Die Finalkonstruktion wird natürlich mit „damit“ wiedergegeben; „halten“ bewahrt den bundesbezogenen Sinn von beachten und einhalten.
- source_word: ለዓለም
  choice: für immer
  rationale: Die Wendung bezeichnet unbefristete, fortdauernde Geltung und wird in allgemein verständlichem Deutsch wiedergegeben.
- source_word: ዲበ፡ ኵሎሙ፡ ደቂቀ፡ እስራኤል
  choice: unter allen Kindern Israels
  rationale: Die Formulierung folgt der kollektiven Reichweite des äthiopischen Textes und bewahrt die traditionelle biblische Bezeichnung.
theological_decisions:
- issue: Verhältnis von Gebot und Bund
  choice: „das Gebot wurde als Bund eingesetzt“
  alternative: „das Gebot wurde für den Bund festgesetzt“
  rationale: Die Präpositionalfügung lässt eine gewisse Verhältnisbestimmung zu. „Als Bund“ entspricht der überlieferten Lesart und erhält die enge Identifikation, ohne sie weiter dogmatisch auszudeuten.
- issue: Zeitliche Reichweite
  choice: „für immer“
  alternative: „auf ewig“
  rationale: Beide Möglichkeiten geben ለዓለም wieder; „für immer“ ist moderner und verständlicher, ohne die starke Dauerbehauptung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater formaler Nähe zum ge'ezischen Satzbau. Die traditionelle Wendung „Kinder Israels“ bleibt wegen ihres bundesbezogenen Charakters erhalten.
