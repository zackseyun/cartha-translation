  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des ge''ezischen Satzes zutreffend wieder: ትእዛዝ als „Gebot“, das passive ተሠርዐ, die Zuordnung zu ኪዳን („Bund“), die Finalaussage des Bewahrens/Einhalten sowie die dauerhafte Geltung. Die englische POB-Audit-Fassung stützt insbesondere die Wiedergabe „als Bund“.'
  naturalness: „Unter allen Kindern Israels“ ist in diesem Satz nicht idiomatisch und kann eine räumlich-soziale Bedeutung („in ihrer Mitte“) nahelegen. Die kollektive Subjektfunktion wird im Deutschen klar und natürlich durch „alle Kinder Israels“ ausgedrückt. „Einhalten“ ist für ein Gebot im modernen Standarddeutsch präziser als das hier missverständliche „halten“.
  terminology: „Gebot“, „Bund“ und „Kinder Israels“ sind angemessene, registergerechte Begriffe. „Kinder Israels“ wahrt die traditionelle kollektive Selbstbezeichnung des Ausgangstextes, ohne eine zusätzliche Auslegung einzutragen.
