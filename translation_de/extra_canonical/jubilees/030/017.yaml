base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/017.yaml
  text: And the seed of Levi was chosen for the priesthood and to be Levites, that they might minister before the LORD as we do at all times[17]. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.
translation:
  language: de
  text: Und die Nachkommen Levis wurden zum Priestertum und dazu erwählt, Leviten zu sein, damit sie vor dem HERRN Dienst tun, wie wir es allezeit tun.[a] Und Levi und seine Nachkommen werden für immer gesegnet sein, weil er mit Eifer Gerechtigkeit, Gericht und Vergeltung an allen vollzog, die sich gegen Israel erhoben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „wir“ spricht aus der Perspektive des sprechenden Engels innerhalb der Sinai-Offenbarung des Jubiläenbuches.
    reason: Erläutert die im Haupttext beibehaltene Wir-Perspektive und ist am Ausdruck „wie wir es allezeit tun“ verankert.
lexical_decisions:
- source_word: ዘርአ፡ ሌዊ
  choice: die Nachkommen Levis
  rationale: Das Gəʿəz „Same Levis“ bezeichnet hier kollektiv seine Nachkommenschaft; „Nachkommen“ ist im modernen Deutsch natürlich und sachgerecht.
- source_word: ለክህነት፡ ወለሌዋውያን
  choice: zum Priesterdienst und zu Leviten
  rationale: Bewahrt die zweigliedrige Formulierung und gibt die zweite Zweckbestimmung verständlich wieder, ohne den missverständlichen Eindruck „für die Leviten“ zu erzeugen.
- source_word: ይትለአኩ፡ ቅድመ፡ እግዚአብሔር
  choice: vor dem HERRN Dienst tun
  rationale: Gibt den kultischen Dienst vor Gott in natürlichem, würdigem Deutsch wieder.
- source_word: ቀንአ
  choice: mit Eifer
  rationale: Bewahrt den Gedanken religiösen Eifers, ohne ihn durch eine stärker wertende deutsche Bezeichnung zu überzeichnen.
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: Gerechtigkeit, Gericht und Vergeltung
  rationale: Erhält die dreifache Reihung des Ausgangstextes und dessen forensisch-vergeltenden Sinn.
theological_decisions:
- issue: Bezug des „wir“
  choice: „wie wir es allezeit tun“ wird als Rede aus der Perspektive des engelischen Sprechers beibehalten.
  alternative: Das „wir“ erklärend durch „wie die Engel“ ersetzen.
  rationale: Der Text spricht bewusst in der ersten Person Plural. Die Übersetzung bewahrt diese Erzählperspektive; die Fußnote erläutert sie, ohne sie im Haupttext aufzulösen.
- issue: Bewertung von Levis Gewalttat
  choice: Die positive Bewertung des Ausgangstextes wird unverändert als „Gerechtigkeit, Gericht und Vergeltung“ wiedergegeben.
  alternative: Die Aussage ethisch abschwächen oder neutralisieren.
  rationale: Jubiläen 30 deutet Levis Handeln ausdrücklich positiv. Diese theologische Spannung darf die Übersetzung nicht stillschweigend beseitigen.
- issue: Dauer des Segens
  choice: „für immer“
  alternative: „auf ewig“
  rationale: Beide sind möglich; „für immer“ ist gegenwärtiges, würdevolles Standarddeutsch und erhält den uneingeschränkten Zeithorizont.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultisch-biblischem Ton. „HERR“ folgt der üblichen deutschen Wiedergabe des Gottesnamens bzw. Herrentitels im Kontext. Die syntaktische Parallelität und die ethische Spannung des Quelltextes bleiben erhalten.
