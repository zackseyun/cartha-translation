base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: de
  text: Darum soll es in Israel niemanden geben, der eine israelitische Jungfrau verunreinigt. Wenn irgendein Mann in Israel seine Tochter oder auch seine Schwester einem Mann aus den Nachkommen der Völker geben will, soll er gewiss sterben, und man soll ihn mit Steinen steinigen, denn er hat in Israel eine Schandtat begangen. Was aber die Frau betrifft,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und der Frau“. Der Satz wird im folgenden Vers fortgesetzt.'
    reason: Die geʿezische Schlusswendung ist als vorangestelltes Satzglied auf die folgende Aussage bezogen. Die Fußnote gibt ihren knappen Wortlaut wieder, ohne der Frau fälschlich dieselbe Handlung oder Strafe wie dem Mann zuzuschreiben.
lexical_decisions:
- source_word: ለአርኵሶ
  choice: entehrt
  rationale: Das Verb bezeichnet hier ein Verunreinigen beziehungsweise Schänden. „Entehrt“ gibt den Zusammenhang mit der Jungfrau und der später genannten Schandtat in natürlichem, würdigem Deutsch wieder, ohne die Art der Tat enger festzulegen als der Text.
- source_word: ድንግለ፡ እስራኤላዊት
  choice: eine israelitische Jungfrau
  rationale: Formale und im Deutschen klare Wiedergabe der Nominalverbindung.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: aus der Nachkommenschaft der Völker
  rationale: Bewahrt das konkrete Bild von „Same/Nachkommenschaft“ und gibt አሕዛብ neutral als „Völker“ wieder, statt die konfessionell stärker geprägte Bezeichnung „Heiden“ einzutragen.
- source_word: ሞተ፡ ለይሙት
  choice: soll er gewiss sterben
  rationale: Die figura etymologica „des Todes sterben“ drückt Nachdruck aus; „gewiss sterben“ wahrt diesen Nachdruck in idiomatischem Deutsch.
- source_word: በእብን፡ ይውግርዎ
  choice: man soll ihn steinigen
  rationale: Das wörtliche „mit Steinen bewerfen“ bezeichnet in diesem Rechtszusammenhang die Steinigung; die deutsche Formulierung ist knapp und eindeutig.
- source_word: ኀፍረተ
  choice: eine Schandtat
  rationale: Gibt die konkrete, öffentlich entehrende Verfehlung wieder und passt zum rechtlichen Ton des Abschnitts.
theological_decisions:
- issue: Bezeichnung der nichtisraelitischen Völker
  choice: Völker
  alternative: Heiden
  rationale: „Völker“ entspricht dem Quellbegriff neutraler und vermeidet eine spätere religiöse Engführung.
- issue: Bezug der abschließenden Wendung ወለብእሲትሂ
  choice: 'Als vorangestelltes Satzglied des folgenden Verses: „Was aber die Frau betrifft“'
  alternative: „und auch die Frau“ als Abschluss der Strafbestimmung dieses Verses
  rationale: Die Präposition ለ kennzeichnet die Frau als hervorgehobenes Objekt beziehungsweise Thema der anschließenden Aussage. Die offene Formulierung verhindert, dass ihr irrtümlich dieselbe Steinigungsstrafe oder dieselbe Tat zugeschrieben wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. Der emphatische Todesbefehl bleibt erhalten; die Schlusswendung wird bewusst offen gelassen, da der Satz erst im folgenden Vers weitergeführt wird.
