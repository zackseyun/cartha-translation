  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: de
  text: 'Dina, ihre Schwester. So darf von nun an nicht mehr so gehandelt werden: eine Tochter Israels zu entweihen; denn im Himmel ist gegen sie angeordnet worden, alle Männer von Sichem mit dem Schwert zu vernichten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዲናሃ፡ እኅቶሙ
  choice: Dina, ihre Schwester
  rationale: Die nominale Wendung wird entsprechend dem überlieferten Versanfang bewahrt; das Possessivpronomen bezieht sich im Erzählzusammenhang auf die Brüder.
- source_word: አይትገበር፡ እምይእዜ
  choice: darf von nun an nicht mehr gehandelt werden
  rationale: Gibt das unpersönliche Verbot und den zeitlichen Ausgangspunkt wieder, ohne einen nicht genannten Täter einzusetzen.
- source_word: ለአርኵሶ፡ ወለተ፡ እስራኤል
  choice: um eine Tochter Israels zu schänden
  rationale: „Schänden“ vermittelt die sexuelle Entehrung und Verunreinigung in natürlichem, würdigem Deutsch.
- source_word: በሰማይ፡ ተሠርዐ፡ ላዕሌሆሙ
  choice: im Himmel ist über sie angeordnet worden
  rationale: Bewahrt Ort, Passivform und die gegen die Betroffenen gerichtete Anordnung, ohne den Urheber ausdrücklich zu benennen.
- source_word: ያጥፍእዎሙ፡ በሰይፍ፡ ለኵሎሙ፡ ዐደወ፡ ሴቄማ
  choice: dass alle Männer von Sichem mit dem Schwert vernichtet werden
  rationale: Gibt die angeordnete vollständige Vernichtung der männlichen Bevölkerung Sichems formal und verständlich wieder.
theological_decisions:
- issue: Urheber der himmlischen Anordnung
  choice: 'Passiv: „ist ... angeordnet worden“'
  alternative: „Gott hat ... angeordnet“
  rationale: Der Ausgangstext nennt den handelnden Urheber nicht ausdrücklich; das Passiv bewahrt diese Zurückhaltung.
- issue: Modalität der Vernichtung
  choice: „dass ... vernichtet werden“
  alternative: „dass ... vernichtet werden sollen“
  rationale: Die Formulierung stellt den Inhalt der himmlischen Anordnung dar, ohne ihn durch ein zusätzliches deutsches Modalverb abzuschwächen oder auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit relativ formaler Satzführung. Der fragmentarisch wirkende Versanfang „Dina, ihre Schwester“ bleibt erhalten, weil er zum überlieferten Text dieses Verses gehört und nicht stillschweigend geglättet werden soll.
