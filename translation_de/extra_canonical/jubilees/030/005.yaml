  source_fidelity: Der Entwurf gibt den fragmentarischen Eingang, das Verbot der Entweihung einer Tochter Israels, die im Himmel erlassene Anordnung gegen die Betroffenen sowie die Tötung aller Männer Sichems durch das Schwert grundsätzlich zutreffend wieder. Die Formulierung des Verbots sollte jedoch die im Ausgangstext erkennbare Verbindung von „so handeln“ und „eine Tochter Israels entweihen“ unmittelbarer abbilden.
  naturalness: „darf ... nicht mehr gehandelt werden, um ... zu schänden“ ist im Deutschen schwerfällig und kann fälschlich einen Zweck („um“) ausdrücken. Eine Konstruktion mit Doppelpunkt stellt den Inhalt des untersagten Handelns klarer dar. „gegen sie“ ist bei einer feindlichen Anordnung natürlicher und präziser als „über sie“.
  terminology: „entweihen“ gibt den Verunreinigungs-/Entweihungsaspekt von አርኵሶ angemessen wieder und bleibt im würdevollen Register. „Männer von Sichem“ und „mit dem Schwert vernichten“ sind beizubehalten. Der ungenannte Urheber der himmlischen Anordnung bleibt im Passiv unbestimmt.
