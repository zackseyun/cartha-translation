base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: de
  text: Sie sollen sie mit Feuer verbrennen, denn sie hat den Namen des Hauses ihres Vaters entehrt; sie soll aus Israel ausgerottet werden. Und kein Unzüchtiger und kein Unreiner soll in Israel gefunden werden, an allen Tagen der Generationen der Erde.[a] Denn Israel ist dem HERRN heilig. Jeder Mann, der es verunreinigt, soll gewiss sterben; man soll ihn steinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch alle Generationen der Erde hindurch«.'
    reason: Die Hauptfassung bewahrt das im Ge'ez ausdrücklich vorhandene Wort »Tage«; die Alternative gibt die zeitliche Formel idiomatischer zusammenfassend wieder.
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Man soll sie im Feuer verbrennen
  rationale: Das Objektsuffix bezeichnet die Frau; die deutsche unpersönliche Konstruktion gibt die rechtliche Anordnung natürlich und würdig wieder.
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: sie hat den Namen des Hauses ihres Vaters entehrt
  rationale: አርኰሰት bezeichnet Verunreinigung bzw. Entehrung. Beim »Namen« eines Hauses ist »entehrt« im Deutschen idiomatisch, ohne den zugrunde liegenden Reinheitsgedanken völlig aufzulösen.
- source_word: ትሠረው፡ እምእስራኤል
  choice: sie soll aus Israel ausgerottet werden
  rationale: Bewahrt die starke Tilgungs- bzw. Ausrottungssprache des Ausgangstextes.
- source_word: ዘማ፡ ወርኵስ
  choice: kein Unzüchtiger und kein Unreiner
  rationale: Gibt die zwei koordinierten Personenbezeichnungen getrennt wieder; »Unzüchtiger« bezeichnet hier sexuelle Unmoral, »Unreiner« kultisch oder moralisch befleckten Status.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: alle Tage der Geschlechter der Erde hindurch
  rationale: Erhält ausdrücklich መዋዕለ »Tage« und die charakteristische zeitliche Formel, auch wenn sie im Deutschen ungewöhnlich klingt.
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: Israel ist dem HERRN heilig
  rationale: Die Dativfügung gibt die Zugehörigkeit bzw. Heiligkeit für Gott wieder; HERR folgt der üblichen deutschen Wiedergabe des Gottesnamens in diesem Kontext.
- source_word: ሞተ፡ ለይሙት
  choice: muss sterben
  rationale: Die emphatische Todesformel wird als verbindliches Todesurteil ausgedrückt.
- source_word: በእብን፡ ይውግርዎ
  choice: man soll ihn steinigen
  rationale: Das Instrument »mit Steinen« ist im deutschen Verb »steinigen« bereits enthalten; so bleibt der Sinn vollständig und natürlich.
theological_decisions:
- issue: Bezug des pronominalen Objekts in »der es verunreinigt«
  choice: »es« bezieht sich grammatisch auf Israel
  alternative: Explizit »Israel« oder einen impliziten heiligen Bereich bzw. Bund einsetzen
  rationale: Der Ausgangstext lässt den Bezug über ein Pronomen stehen. Die Übersetzung bewahrt diese Spannung und ergänzt keine theologische Deutung.
- issue: Art der Unreinheit
  choice: »Unreiner« ohne nähere Bestimmung
  alternative: »Befleckter«, »kultisch Unreiner« oder »moralisch Verdorbener«
  rationale: Der Quellbegriff kann kultische und moralische Dimensionen tragen. Eine nähere Festlegung würde die genuine Mehrdeutigkeit einschränken.
- issue: Bedeutung von Israels Heiligkeit
  choice: »dem HERRN heilig«
  alternative: »für den HERRN geheiligt«
  rationale: Die stative Formulierung wahrt die Aussage des Textes, ohne eine bestimmte systematisch-theologische Auffassung von Erwählung oder Heiligung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtssprachlichem Ton. Die harten Strafbestimmungen werden ohne Abschwächung wiedergegeben. Archaisierende Wörter werden vermieden, während die ungewöhnliche Zeitformel des Ge’ez im Haupttext erhalten bleibt.
