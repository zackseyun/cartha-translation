  source_fidelity: Der Entwurf gibt die Abfolge und die zentralen Begriffe des Ge'ez insgesamt zuverlässig wieder, einschließlich des weiblichen Objekts beim Verbrennen, der Ausrottung aus Israel, der doppelten Personenbezeichnung und der ausdrücklich genannten »Tage«. Die emphatische Todesformel ሞተ፡ ለይሙት sollte jedoch nicht auf das bloße »muss sterben« reduziert werden, sondern als »soll gewiss sterben« erkennbar bleiben.
  naturalness: »Alle Tage der Geschlechter der Erde hindurch« ist zwar verständlich, wirkt im modernen Standarddeutsch aber unnötig sperrig. »An allen Tagen der Generationen der Erde« bewahrt jedes Element der Quellformel und liest sich klarer. »Mit Feuer verbrennen« ist zudem die idiomatischere und quellnähere Wiedergabe der Instrumentalangabe als »im Feuer verbrennen«.
  terminology: »Unzüchtiger« und »Unreiner« lassen die offene sexuelle beziehungsweise kultisch-moralische Begrifflichkeit stehen. »Dem HERRN heilig« ist für ቅዱስ ... ለእግዚአብሔር angemessen. Das Pronomen in »wer es verunreinigt« wird beibehalten, sodass kein über den Text hinausgehender Bezugsgegenstand festgelegt wird.
