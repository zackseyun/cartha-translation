revisions:
- from: Man soll sie im Feuer verbrennen, denn sie hat den Namen des Hauses ihres Vaters entehrt; sie soll aus Israel ausgerottet werden. Und kein Unzüchtiger und kein Unreiner soll in Israel zu finden sein, alle Tage der Geschlechter der Erde hindurch.[a] Denn Israel ist dem HERRN heilig. Jeder Mann, der es verunreinigt, muss sterben; man soll ihn steinigen.
  to: Sie sollen sie mit Feuer verbrennen, denn sie hat den Namen des Hauses ihres Vaters entehrt; sie soll aus Israel ausgerottet werden. Und kein Unzüchtiger und kein Unreiner soll in Israel gefunden werden, an allen Tagen der Generationen der Erde.[a] Denn Israel ist dem HERRN heilig. Jeder Mann, der es verunreinigt, soll gewiss sterben; man soll ihn steinigen.
