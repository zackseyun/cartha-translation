  - severity: low
    issue: Die zeitliche Formel ist im Deutschen unnötig holprig.
    rationale: »Alle Tage der Geschlechter der Erde hindurch« ist eine zu stark nachgebildete Wortfolge. »An allen Tagen der Generationen der Erde« ist modernes Standarddeutsch und bewahrt »Tage«, »Generationen« und »Erde«.
  - severity: low
    issue: Die Wiedergabe der Feuerangabe ist weniger idiomatisch.
    rationale: »Mit Feuer verbrennen« entspricht der instrumentalen Wendung des Ausgangstextes und ist im Deutschen natürlicher als »im Feuer verbrennen«.
