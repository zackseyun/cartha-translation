    rationale: »der Sohn Hamors, des Hiwiters und Fürsten des Landes« ist verständlich, kann aber den Hiwiter- und Fürstentitel syntaktisch etwas weniger klar Hamor zuordnen. Die Wiederholung des Genitivartikels schafft Klarheit ohne Bedeutungsänderung.
