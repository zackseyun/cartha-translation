base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/002.yaml
  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: de
  text: In Frieden, im sechsten Monat, sah dort Sichem, der Sohn Hamors, des Hiwiters, des Fürsten des Landes, Dina, die Tochter Jakobs. Er ergriff sie, schlief mit ihr und verunreinigte sie; sie aber war noch ein junges Mädchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeichnet der letzte Satz Dina als jung beziehungsweise klein; im folgenden Vers wird ihr Alter mit zwölf Jahren angegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአርኰሳ
  choice: und verunreinigte sie
  rationale: Das Verb bezeichnet ein Verunreinigen oder Beflecken. Diese Wiedergabe bewahrt die im weiteren Kapitel wichtige Sprache der Unreinheit und ersetzt nicht das ge’ezische Verb durch das aus Genesis 34 bekannte »demütigen«.
- source_word: ንስቲት
  choice: ein junges Mädchen
  rationale: Das Wort kennzeichnet Dina als jung beziehungsweise klein. »Junges Mädchen« ist im heutigen Deutsch natürlich und vermeidet die mögliche Fehlvorstellung eines sehr kleinen Kindes; der folgende Vers nennt ihr Alter.
- source_word: መኰንነ ምድር
  choice: Fürsten des Landes
  rationale: Die traditionelle Würdebezeichnung gibt die Stellung als Herrscher beziehungsweise führender Amtsträger des Landes in gehobenem, verständlichem Deutsch wieder.
- source_word: ወሰከበ ምስሌሃ
  choice: schlief mit ihr
  rationale: Dies gibt die feste Wendung direkt und in natürlichem modernem Deutsch wieder, ohne den gewaltsamen Zusammenhang abzuschwächen, der bereits durch »ergriff sie« deutlich wird.
theological_decisions:
- issue: Bezeichnung der Tat an Dina
  choice: verunreinigte sie
  alternative: demütigte sie / schändete sie
  rationale: »Verunreinigte« folgt dem konkreten ge’ezischen Wortlaut und erhält das für Jubilaeen 30 zentrale Motiv der Verunreinigung. »Demütigte« würde eher den Wortlaut einer anderen Texttradition aus Genesis 34 eintragen; »schändete« wäre idiomatischer, ließe aber das Reinheitsmotiv weniger deutlich hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gewalt wird klar benannt, ohne sie auszumalen. Die Apposition zu Sichem bleibt eng am Quelltext; der lange Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert.
