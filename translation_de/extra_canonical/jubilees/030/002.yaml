  verdict: revise
  source_fidelity: Die Wiedergabe von Sichem, Hamor, Dina, dem Ergreifen, dem Beischlaf, der Verunreinigung und Dinas jungem Alter ist im Wesentlichen quellentreu. Der Entwurf lässt jedoch die einleitende Zeit-/Umstandsangabe des vorgelegten ge'ezischen Textes (»in Frieden, im sechsten Monat«) aus. Diese darf auch dann nicht entfallen, wenn sie im englischen Audit-Text nicht erscheint.
  naturalness: Das Deutsch ist klar, würdig und modernes Standarddeutsch. Die Apposition wird mit einer geringfügigen Umstellung eindeutiger Hamor zugeordnet; die knappe einleitende Angabe bleibt dabei verständlich.
  terminology: »verunreinigte sie« trifft ወአርኰሳ angemessen und erhält das Reinheitsmotiv. »junges Mädchen« ist für ንስቲት idiomatisch und wird durch die Anmerkung sachgerecht erläutert. Die Namen Sichem, Hamor und Dina sind gebräuchliche deutsche Bibelschreibungen.
