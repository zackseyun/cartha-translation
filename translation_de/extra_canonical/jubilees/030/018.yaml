  text: And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.
translation:
  language: de
  text: Und so verzeichnen sie zu seinen Gunsten auf den himmlischen Tafeln Segen und Gerechtigkeit als Zeugnis vor dem Gott des Alls.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዐርጉ
  choice: schreiben … nieder
  rationale: Das Verb bedeutet grundlegend „hinaufbringen/aufsteigen lassen“, bezeichnet hier im Zusammenhang mit den himmlischen Tafeln jedoch die Eintragung in das himmlische Verzeichnis; „niederschreiben“ gibt die kontextuelle Funktion natürlich wieder.
- source_word: በስምዐ
  choice: als Zeugnis
  rationale: Bewahrt den ausdrücklich vorhandenen Zeugnischarakter der Eintragung, der in der englischen Konsultationsfassung nicht wiedergegeben ist.
- source_word: በረከተ፡ ወጽድቀ
  choice: Segen und Gerechtigkeit
  rationale: Gibt beide koordinierten Begriffe formal und theologisch offen wieder, ohne „Gerechtigkeit“ als Verdienst, Freispruch oder Rechtschaffenheit einzuengen.
- source_word: ለአምላከ፡ ኵሉ
  choice: dem Gott des Alls
  rationale: Gibt die universale Bezeichnung knapp und würdig wieder; „das All“ bezeichnet die Gesamtheit der Schöpfung.
theological_decisions:
- issue: Bedeutung der himmlischen Eintragung
  choice: „als Zeugnis Segen und Gerechtigkeit“
  alternative: „seine Segnung und Rechtfertigung“
  rationale: Die Übersetzung hält die nominale und sachliche Spannung des Ausgangstextes fest und vermeidet eine dogmatische Festlegung auf einen bestimmten Rechtfertigungsbegriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und bewahrt zugleich die feierliche Sprache der himmlischen Tafeln.
