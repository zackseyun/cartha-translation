  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: de
  text: Und sie redeten arglistig mit ihnen, betrogen sie und führten sie in die Irre. Simeon und Levi betraten Sichem unerwartet und vollstreckten das Urteil an allen Männern von Sichem. Sie töteten jeden Mann, den sie dort fanden, und ließen keinen Einzigen übrig; sie töteten sie alle, während diese Schmerzen litten,[a] weil sie ihre Schwester Dina entehrt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Qual“ oder „unter Schmerzen“; wahrscheinlich sind die Schmerzen nach der Beschneidung gemeint. Nicht: „mit der Schärfe des Schwertes“.'
    reason: Die im überlieferten Text offenbar fehlerhaft beziehungsweise durch OCR entstellte Form በ፵ዐር steht für በጻዕር, „in Qual/Schmerz“. Die Anmerkung sichert die vom Kontext gestützte Bedeutung gegen eine Harmonisierung mit Genesis 34,26 ab.
lexical_decisions:
- source_word: በአኩይ
  choice: in böser Absicht
  rationale: Die Wendung bezeichnet hier die arglistige, feindselige Art ihrer Rede; die natürliche deutsche Formulierung wahrt den moralischen Akzent.
- source_word: ኀብለይዎሙ
  choice: betrogen sie
  rationale: Das Verb bezeichnet täuschendes beziehungsweise treuloses Handeln und wird im Zusammenhang knapp mit „betrügen“ wiedergegeben.
- source_word: አስፈጥዎሙ
  choice: führten sie in die Irre
  rationale: Gibt die kausative Bedeutung des Verbs wieder, ohne sie mit dem vorhergehenden Betrug gleichzusetzen.
- source_word: ግብተ
  choice: unerwartet
  rationale: Bezeichnet das überraschende beziehungsweise unvorhergesehene Eindringen; „unerwartet“ ist im Deutschen idiomatisch und bewahrt den Überraschungsmoment.
- source_word: ገብሩ፡ ኵነኔ
  choice: vollstreckten das Urteil
  rationale: Die Wendung bedeutet wörtlich, Gericht beziehungsweise Urteil zu vollziehen, und beschreibt die Tat aus der Perspektive des Erzählers, ohne ihre Berechtigung zusätzlich auszudeuten.
- source_word: በ፵ዐር (für በጻዕር)
  choice: unter Qualen
  rationale: Die überlieferte Form ist offenbar fehlerhaft beziehungsweise durch OCR entstellt; በጻዕር bedeutet „in/unter Qual, Schmerz“ und verweist im Kontext wahrscheinlich auf die Schmerzen nach der Beschneidung, nicht auf die Schärfe des Schwertes.
- source_word: ገመፉ
  choice: entehrt hatten
  rationale: Das Verb trägt hier den Sinn von beschämen, schänden oder entehren; „entehren“ ist würdig und kontextgerecht.
theological_decisions:
- issue: Erzählerische Bezeichnung des Massakers als Gericht
  choice: „vollstreckten das Urteil“
  alternative: „übten Vergeltung“
  rationale: Die gerichtliche Terminologie des Ausgangstextes bleibt erhalten. Die Übersetzung erklärt weder ausdrücklich, dass Gott dieses Urteil geboten habe, noch schwächt sie die problematische Darstellung zu bloßer Rache ab.
- issue: Grund der Tötung
  choice: „weil sie ihre Schwester Dina entehrt hatten“
  alternative: „weil sie Schande gebracht hatten“
  rationale: Der Zusammenhang und die konsultierte Fassung identifizieren Dina und das verwandtschaftliche Verhältnis. Die Formulierung bewahrt die kausale Aussage des Verses, ohne daraus eine normative Rechtfertigung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. „Drangen … ein“ vermittelt den gewaltsamen Charakter, „keinen Einzigen“ gibt die emphatische Totalität natürlich wieder. Die Wiederholung von „sie töteten“ bleibt zur Wahrung der eindringlichen Ausgangsstruktur erhalten.
