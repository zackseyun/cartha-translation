  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Sie töteten sie alle unter Qualen“ ist syntaktisch mehrdeutig und daher an dieser Stelle weniger klar als eine explizite Zuordnung der Schmerzen zu den Opfern. „Betraten Sichem“ ist zudem quellentreuer und stilistisch neutraler als das leicht interpretierende „drangen ... ein“.
  terminology: „das Urteil vollstreckten“, „entehrt“ und die Namen Simeon, Levi, Sichem und Dina sind angemessen. Die gerichtliche Sprache wird beibehalten, ohne die Gewalttat normativ zu kommentieren.
