base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/022.yaml
  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: de
  text: Und sie brachten alles zu ihrem Vater Jakob. Er sprach mit ihnen darüber, dass sie die Stadt zerstört hatten,[a] denn er fürchtete die Bewohner des Landes, die Kanaaniter und die Perisiter. Da lag der Schrecken Jahwes auf allen Städten rings um Sichem, und sie machten sich nicht auf, um die Söhne Jakobs zu verfolgen, denn Entsetzen war über sie gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »weil sie die Stadt getötet hatten«; gemeint sein können ihre Bewohner.'
    reason: Die ge'ezische Formulierung verbindet das Verb »töten« unmittelbar mit »Stadt« und verwendet damit eine im Deutschen erklärungsbedürftige Metonymie.
lexical_decisions:
- source_word: ተናገረ፡ ምስሌሆሙ
  choice: Er stellte sie … zur Rede
  rationale: Die Wendung bedeutet wörtlich, dass Jakob mit ihnen sprach; im Zusammenhang handelt es sich um eine tadelnde Auseinandersetzung. Die idiomatische deutsche Fassung wahrt diesen Sinn.
- source_word: ቀተሉ፡ ሀገረ
  choice: Zerstörung der Stadt
  rationale: Wörtlich steht »die Stadt töten«. Gemeint ist metonymisch die Vernichtung beziehungsweise Tötung ihrer Bewohner; »Zerstörung der Stadt« ist im Deutschen natürlich und lässt den Umfang offen.
- source_word: ግርማ፡ እግዚአብሔር
  choice: der Schrecken Jahwes
  rationale: ግርማ bezeichnet hier einen von Gott ausgehenden Schrecken. Der Gottesname wird entsprechend der POB-Konvention als »Jahwe« wiedergegeben.
- source_word: ድንጋፄ
  choice: Entsetzen
  rationale: Das Substantiv bezeichnet lähmende Furcht oder Bestürzung und wird zur Vermeidung bloßer Wiederholung von »Schrecken« mit »Entsetzen« wiedergegeben.
theological_decisions:
- issue: Ursprung und Wirkung des Schreckens
  choice: »der Schrecken Jahwes lag auf allen Städten«
  alternative: »die Furcht vor Jahwe ergriff alle Städte«
  rationale: Die gewählte Fassung bewahrt die im Ausgangstext ausgesagte göttliche Zuordnung, ohne näher festzulegen, auf welche Weise Jahwe den Schrecken bewirkte.
- issue: Bewertung der Gewalttat durch Jakob
  choice: »stellte sie … zur Rede«
  alternative: »sprach mit ihnen«
  rationale: Der Kontext legt Vorwurf und Tadel nahe, doch die Fassung fügt keine weitergehende moraltheologische Bewertung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die Satzverknüpfungen des Ge'ez wurden erhalten, aber idiomatisch geglättet. »Sichem«, »Kanaaniter« und »Perisiter« folgen gebräuchlichen deutschen Namensformen.
