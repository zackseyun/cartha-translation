  source_fidelity: Die kultisch-moralische Wertung von ምኑን und ርኵስ ist mit „Gräuel“ bzw. „Unreinheit“ zutreffend wiedergegeben. Für ኢይነጽሕ ist „wird ... nicht gereinigt werden“ näher am passivischen Sinn „wird nicht gereinigt werden“ als „wird ... nicht rein werden“. Die Konstruktion ዘቦ ብእሲት bezeichnet einen Besitzbezug („der eine Frau hat“); eine rein existentielle Wiedergabe wäre weniger genau. Das überlieferte Versende bleibt syntaktisch offen.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Von dieser Unreinheit nicht gereinigt werden“ ist in diesem kultisch geprägten Kontext idiomatisch und präzise. Der abschließende Gedankenstrich markiert, dass die vorliegende Quelleneinheit mitten in der Wortgruppe abbricht, ohne einen abgeschlossenen deutschen Satz vorzutäuschen.
  terminology: „Gräuel“, „Unreinheit“ und „gereinigt“ bewahren die kultisch-moralische Terminologie. „Eine Frau aus den Töchtern der Völker“ folgt der Herkunftsformulierung des Textes; „hat“ wahrt den possessiven Gehalt der ge’ezischen Konstruktion.
