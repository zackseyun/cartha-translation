- from: Und es ist für Israel ein Gräuel. Israel wird von dieser Unreinheit nicht rein werden, wenn jemand eine Frau aus den Töchtern der Völker hat.[a]
  to: Und es ist für Israel ein Gräuel. Israel wird von dieser Unreinheit nicht gereinigt werden, wenn jemand eine Frau aus den Töchtern der Völker hat—
  rationale: Die passive Wiedergabe von ኢይነጽሕ wurde präzisiert und das offene Versende durch einen Gedankenstrich sichtbar gemacht. Die vorsichtige bedingende Wiedergabe bleibt erhalten, während „hat“ den im englischen Audit hervorgehobenen possessiven Gehalt wahrt. Die Fußnote bleibt an der betreffenden Wortgruppe verankert und erläutert die syntaktische Mehrdeutigkeit ohne sie aufzulösen.
