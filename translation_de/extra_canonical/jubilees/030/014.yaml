  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: de
  text: Und es ist für Israel ein Gräuel. Israel wird von dieser Unreinheit nicht gereinigt werden, wenn jemand eine Frau aus den Töchtern der Völker hat—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምኑን (mənun)
  choice: ein Gräuel
  rationale: Gibt die starke kultisch-moralische Wertung des ge’ezischen Ausdrucks in würdigem, verständlichem Deutsch wieder.
- source_word: ኢይነጽሕ (ʾi-yənaṣṣəḥ)
  choice: wird … nicht rein werden
  rationale: Bewahrt das Bild des Reinwerdens und den Zukunftsbezug der ge’ezischen Verbform.
- source_word: ርኵስ (rəkus)
  choice: Unreinheit
  rationale: Entspricht dem kultisch und moralisch gefärbten Begriff, ohne ihn auf bloßen Schmutz zu reduzieren.
- source_word: ዘቦ፡ ብእሲት (za-bo bəʾəsit)
  choice: wenn jemand eine Frau … hat
  rationale: Gibt die possessive Konstruktion bo („er hat“/„in ihm ist“) verständlich wieder; „jemand“ macht den impliziten menschlichen Träger im Deutschen kenntlich.
- source_word: እም (ʾəm)
  choice: aus
  rationale: Gibt Herkunft beziehungsweise Zugehörigkeit in der abgebrochen überlieferten Wortgruppe natürlich wieder.
theological_decisions:
- issue: Bezug der Unreinheit auf Israel und auf den Besitzer einer fremdvölkischen Frau
  choice: Die kollektive Aussage über Israel bleibt stehen; der Relativ-/Bedingungssatz wird mit „wenn jemand … hat“ wiedergegeben.
  alternative: „Israel wird … nicht rein werden, solange es eine Frau aus den Töchtern der Völker in seiner Mitte gibt.“
  rationale: Der Ausgangstext verbindet das kollektive Subjekt Israel mit einer mehrdeutigen Konstruktion aus Relativpartikel und possessivem Existenzverb. Die gewählte Fassung bewahrt den individuellen Besitzbezug, ohne eine weitergehende ekklesiologische oder ethnische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gräuel“ und „Unreinheit“ erhalten die starke kultisch-moralische Sprache des Ausgangstextes; der Satz bleibt wegen des überlieferten Versendes bewusst offen.
