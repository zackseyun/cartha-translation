review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt den ge’ezischen Wortlaut zuverlässig wieder: Dina ist zwölf Jahre alt; die Bitte richtet sich an ihren Vater und ihre Brüder, sie dem Mann zur Frau zu geben; Jakob und seine Söhne reagieren wegen der Männer von Sichem zornig; Dina wird als ihre Schwester bezeichnet und als geschändet dargestellt. Besonders korrekt ist „die Männer von Sichem“ für ዐደወ፡ ሰቂማ; eine Wiedergabe als „Stadt Sichem“ wäre hier nicht quellentreu.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Erzählregister. „Jemandem zur Frau geben“ und „zornig auf“ sind idiomatisch. Die Zusammenziehung der wiederholten Bezugsangabe zu „ihren Vater und ihre Brüder“ ist ohne Bedeutungsverlust möglich.
  terminology: „Jakob“, „Dina“ und „Sichem“ sind gebräuchliche deutsche Namensformen. „Geschändet“ trifft im Kontext die Bedeutung des Verunreinigens/Entehrens und vermeidet eine unnötig spezifizierende Umschreibung der Gewalttat. Die pluralische Zuschreibung an die Männer von Sichem bleibt wie im ge’ezischen Text erhalten.
