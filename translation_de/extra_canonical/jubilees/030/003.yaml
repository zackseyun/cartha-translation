  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: de
  text: Und sie war zwölf Jahre alt. Er bat ihren Vater und ihre Brüder, sie ihm zur Frau zu geben. Jakob und seine Söhne aber waren zornig auf die Männer von Sichem, weil sie ihre Schwester Dina geschändet hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ
  choice: zur Frau
  rationale: Das Wort bezeichnet hier im Zusammenhang der erbetenen Eheschließung eine Ehefrau; die idiomatische deutsche Wendung lautet „jemandem zur Frau geben“.
- source_word: ወልዱ
  choice: seine Söhne
  rationale: Wörtlich kann der Ausdruck „seine Kinder“ bedeuten; im Erzählzusammenhang sind jedoch Jakobs Söhne als die handelnde Gruppe gemeint.
- source_word: ዐደወ፡ ሰቂማ
  choice: die Männer von Sichem
  rationale: ዐደወ ist hier als auf Personen bezogene Pluralverbindung „Männer von“ zu verstehen, nicht als „Stadt“; Sichem bezeichnet ihre Zugehörigkeit beziehungsweise Herkunft.
- source_word: አርኰስዋ
  choice: geschändet hatten
  rationale: Das Verb bezeichnet ein Verunreinigen beziehungsweise Entehren; „schänden“ gibt im Kontext der an Dina begangenen sexuellen Gewalttat sowohl die Tat als auch ihre entehrende Dimension angemessen wieder.
theological_decisions:
- issue: Kollektive Bezeichnung der Schuldigen
  choice: „die Männer von Sichem“ und das plurale „sie“ beibehalten
  alternative: Die Aussage auf Sichem als einzelnen Täter oder auf die Stadt Sichem beziehen
  rationale: Der überlieferte ge’ezische Wortlaut formuliert die betroffene beziehungsweise beschuldigte Gruppe im Plural. Die Übersetzung löst die daraus entstehende Spannung zur Einzeltat nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas umständliche doppelte Herkunftsangabe der Bitte wird idiomatisch zu „ihren Vater und ihre Brüder“ zusammengezogen. „Aber“ markiert natürlich den Übergang zur Reaktion Jakobs und seiner Söhne, ohne einen zusätzlichen theologischen Akzent einzutragen.
