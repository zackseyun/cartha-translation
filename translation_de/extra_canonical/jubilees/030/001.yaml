  yaml_path: translation/extra_canonical/jubilees/030/001.yaml
  text: And in the first year of the sixth week[1], he went up to Salem, east of Shechem, in peace, in the fourth month.
translation:
  language: de
  text: Und im ersten Jahr der sechsten Jahrwoche[a] zog er nach Salem hinauf, östlich von Sichem, in Frieden, im vierten Monat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der einleitende Satzteil ist textlich schwer zu gliedern. Der äthiopische Text scheint das Ereignis in das erste Jahr der sechsten Jahrwoche zu setzen und die Bewegung auf Salem beziehungsweise auf das Gebiet östlich von Sichem zu beziehen. Gemeint ist Jakob bei seiner Rückkehr nach Kanaan.
    reason: segmentation_note
  - marker: b
    text: 'Eine frühere Wiedergabe lautet: „im siebten Monat“. Der maßgebliche äthiopische Text bietet jedoch „im vierten Monat“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier im chronologischen System des Jubiläenbuches einen Zeitraum von sieben Jahren; „Jahrwoche“ gibt diese Bedeutung knapp und verständlich wieder.
- source_word: ዐርገ
  choice: zog … hinauf
  rationale: Die Grundbedeutung ist „hinaufgehen/hinaufziehen“. „Zog hinauf“ passt zum erzählenden Kontext einer Reise.
- source_word: ሰሌማሃ
  choice: nach Salem
  rationale: Der Ortsname wird als Salem wiedergegeben; die Richtung wird im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: መንገለ፡ ጽባሒሁ፡ ለሰቂማ
  choice: östlich von Sichem
  rationale: Die Wendung lokalisiert Salem auf der Ostseite Sichems. „Sichem“ ist die geläufige deutsche Form des Ortsnamens.
theological_decisions: []
