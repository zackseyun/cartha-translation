  naturalness: Der Text ist überwiegend natürliches, würdiges modernes Standarddeutsch. Die revidierte Fassung beseitigt die unnötige Paraphrase und formuliert die Aufzählung der nicht angenommenen Opfergaben idiomatischer, ohne deren Dichte aufzulösen.
  terminology: „Plage“, „Fluch“, „Strafgericht“, „Unreinheit“, „verunreinigen“, „entweihen“ und „Ansehen der Person“ sind angemessen. Das allgemeine Opferwort wird als „Opfer“ wiedergegeben, nicht enger als „Schlachtopfer“, da die Quelle hier keine solche Spezifizierung sicher verlangt.
