base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: de
  text: oder wenn er eine von seinen Töchtern einem Mann aus irgendeinem der Völker zur Frau gegeben hat. Denn es ist Plage über Plage und Fluch über Fluch; jedes Strafgericht, jede Plage und jeder Fluch wird kommen. Wenn er dies tut oder die Augen vor denen verschließt, die Unreinheit begehen, die das Heiligtum des HERRN verunreinigen und die seinen heiligen Namen entweihen, wird das ganze Volk gemeinsam wegen jeder Unreinheit und Entweihung gerichtet werden. Es wird kein Ansehen der Person geben, und aus seiner Hand werden weder Früchte noch Opfer noch Brandopfer noch Fett noch ein wohlgefälliger Duft angenommen werden. So wird es jedem Mann und jeder Frau in Israel ergehen, die sein Heiligtum verunreinigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: Plage
  rationale: Bewahrt die wiederholte Straf- und Unheilssemantik des äthiopischen Ausdrucks, ohne sie vorschnell auf eine bestimmte Krankheit einzuengen.
- source_word: ኵነኔ
  choice: Strafgericht
  rationale: Gibt den gerichtlichen Charakter im Zusammenhang von Plage und Fluch wieder.
- source_word: ርኵሰ / ያረኵሱ
  choice: Unreinheit / verunreinigen
  rationale: Erhält die kultische Bedeutung und die sprachliche Verbindung zwischen Tat und Heiligtum.
- source_word: ይጌምሩ፡ ስሞ፡ ቅዱሰ
  choice: seinen heiligen Namen entweihen
  rationale: Natürliche deutsche Wiedergabe der Profanierung des heiligen Namens.
- source_word: ነሢአ፡ ገጽ
  choice: Ansehen der Person
  rationale: Traditionsnahe und verständliche Rechtsformel für Parteilichkeit oder Begünstigung.
- source_word: መሥዋዕተ፡ ወጽንሓሐ፡ ወስብሐ
  choice: Schlachtopfer noch Brandopfer noch Fett
  rationale: Gibt die dichte kultische Opferliste entsprechend dem Quellenzusammenhang wieder; die genaue Zuordnung einzelner äthiopischer Glieder ist textlich schwierig.
- source_word: ትምዐዘ፡ መዐዛ፡ ሠናይ
  choice: Duft eines wohlgefälligen Geruchs
  rationale: Bewahrt die idiomatische Opfersprache vom angenehmen beziehungsweise annehmbaren Duft.
theological_decisions:
- issue: Träger des Gerichts
  choice: „wird über ihn kommen“
  alternative: unpersönlich „wird kommen“
  rationale: Der Zusammenhang richtet die Sanktion gegen den Handelnden; die Ergänzung macht dies auf Deutsch verständlich, ohne die Art des Gerichts näher festzulegen.
- issue: Kollektive Verantwortung
  choice: „wird das ganze Volk gemeinsam … gerichtet werden“
  alternative: Beschränkung des Gerichts auf die unmittelbar Handelnden
  rationale: Die Quelle formuliert ausdrücklich ein gemeinsames Gericht über das ganze Volk und hält damit die Spannung zwischen individuellem Handeln und öffentlicher Mitschuld fest.
- issue: Verweigerte Annahme der Opfer
  choice: „wird Gott … nicht annehmen“
  alternative: passivisch „wird … nicht angenommen werden“
  rationale: Der im Kontext vorausgesetzte Empfänger der Opfer ist Gott; die explizite Nennung schafft im Deutschen Klarheit, ohne eine zusätzliche Lehrentscheidung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-rechtlicher Terminologie. Die parallelen Formeln „Plage über Plage“ und „Fluch über Fluch“ sowie die dichte Opferliste wurden bewusst erhalten.
