  - severity: medium
    issue: „wird über ihn kommen“
    rationale: Der gegebene Text und der englische Audit Trail kündigen an, dass Gericht, Plage und Fluch kommen, ohne an dieser Stelle ausdrücklich „über ihn“ zu ergänzen. Die Ergänzung sollte wegen der möglichen Reichweite der Sanktion unterbleiben.
  - severity: low
