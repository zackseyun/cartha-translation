base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: de
  text: Wer sie entweiht, muss unbedingt sterben und soll gesteinigt werden. Für dieses Gesetz gibt es keine zeitliche Begrenzung, keine Vergebung und keinerlei Sühne, sondern der Mann wird ausgerottet, der inmitten von ganz Israel eine Tochter geschändet hat; denn er hat von seinem Samen dem Molech gegeben und frevelhaft gehandelt, indem er sie entweihte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Erwähnung Molechs steht in diesem Zusammenhang unvermittelt. Der äthiopische Text überliefert sie; möglicherweise stellt sie eine weiter gefasste Verbindung zwischen unrechtmäßig eingesetztem Samen und kultischer Entweihung her.
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Wer sie entweiht
  rationale: Das Verb bezeichnet kultische oder sittliche Verunreinigung bzw. Entweihung. Das feminine Pronomen nimmt im Zusammenhang die Tochter auf; „entweiht“ bewahrt zugleich die kultische Färbung.
- source_word: ሞተ፡ ለይሙት
  choice: muss unbedingt sterben
  rationale: Die figura etymologica verstärkt das Todesurteil. Natürliches Deutsch gibt diese Emphase mit „muss unbedingt sterben“ wieder.
- source_word: ወበእብን፡ ይትወገር
  choice: und soll gesteinigt werden
  rationale: Wörtlich geht es um das Bewerfen mit Stein; „gesteinigt werden“ ist die klare und etablierte deutsche Wiedergabe der Hinrichtungsart.
- source_word: ዐቅመ፡ መዋዕለ
  choice: zeitliche Begrenzung
  rationale: Die Verbindung bedeutet sinngemäß ein Maß bzw. eine Grenze von Tagen und erklärt, dass das Gesetz nicht nach einer bestimmten Frist erlischt.
- source_word: ይሤረው
  choice: ausgerottet wird
  rationale: Die passive Form bezeichnet das Entwurzelt- oder Ausgerottetwerden. Diese Wiedergabe bewahrt das konkrete biblische Bild, ohne unbelegt „sofort töten“ einzutragen.
- source_word: ዘርኡ
  choice: seinem Samen
  rationale: „Samen“ erhält die körperlich-genealogische Ausdrucksweise und die beabsichtigte Verbindung zwischen sexueller Verfehlung und der Molech-Aussage.
- source_word: ለሞሎክ
  choice: dem Molech
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben; der Dativ folgt dem Verb „geben“.
theological_decisions:
- issue: Bedeutung von „ausgerottet werden“
  choice: Die bildhafte Formulierung bleibt stehen, ohne die genaue Vollzugsart zu bestimmen.
  alternative: „getötet werden“ oder „aus der Gemeinschaft ausgeschlossen werden“
  rationale: Der Ausgangstext legt das Bild des Entwurzelns nahe, entscheidet aber nicht ausdrücklich, ob allein Hinrichtung, Ausschluss oder umfassende Beseitigung gemeint ist.
- issue: Abrupte Molech-Klausel
  choice: Die Klausel wird an ihrer überlieferten Stelle übersetzt und durch eine textbezogene Fußnote erläutert.
  alternative: Sie als Glosse aussondern oder frei an den sexuellen Kontext angleichen.
  rationale: Die äthiopische Textgestalt bezeugt die Aussage; ihre Spannung zum unmittelbaren Zusammenhang darf nicht stillschweigend beseitigt werden.
- issue: Bezug des femininen Pronomens
  choice: „sie“ wird auf die zuvor genannte Tochter bezogen.
  alternative: Unpersönliches „es“ oder Bezug auf Israel bzw. das Gesetz
  rationale: Der feminine Bezug auf „Tochter“ ist grammatisch und kontextuell am nächsten, auch wenn die kultische Molech-Sprache den Satz bewusst spannungsvoll macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Rechtssprachliche Feierlichkeit bleibt erhalten, doch unnötig archaische Satzformen werden vermieden. Die ungewöhnliche Verbindung von Schändung, Sühne, Ausrottung und Molech wird nicht harmonisiert.
