  rationale: Die Revision verbessert ausschließlich die deutsche Satzlogik und Idiomatik. Die ambivalente, im Kontext abrupte Molech-Klausel, der feminine Bezug von „sie“ sowie das nicht näher spezifizierte „ausgerottet“ bleiben erhalten. Die Fußnote wird sprachlich präzisiert, ohne die überlieferte Schwierigkeit als textkritische Entscheidung auszugeben.
