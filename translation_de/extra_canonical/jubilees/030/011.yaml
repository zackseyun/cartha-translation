base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: de
  text: Und du, Mose, gebiete den Israeliten und bezeuge ihnen[a], dass sie keine ihrer Töchter den Völkern geben und für ihre Söhne keine Frauen von den Töchtern der Völker nehmen sollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warne sie eindringlich“; wörtlicher: „lass es ihnen hören“.'
    reason: Die ge'ezische Wendung kann als Zeugnisformel oder als nachdrückliches Zu-Gehör-Bringen verstanden werden.
lexical_decisions:
- source_word: ለደቂቀ፡ እስራኤል
  choice: den Israeliten
  rationale: Die wörtliche Wendung „den Kindern/Söhnen Israels“ bezeichnet hier das Volk Israel; „Israeliten“ ist im modernen Deutschen natürlich und inhaltlich genau.
- source_word: ወአስምዕ፡ ላዕሌሆሙ
  choice: und bezeuge ihnen
  rationale: Das Kausativ von „hören“ mit der Präposition „über/gegen“ bildet eine Zeugnis- bzw. Warnformel. „Bezeuge ihnen“ bewahrt den feierlich-rechtlichen Ton besser als das unnatürliche „lass sie hören“.
- source_word: ለአሕዛብ
  choice: den Völkern
  rationale: Der Ausdruck bezeichnet die nichtisraelitischen Völker. „Völker“ hält diese kollektive Bedeutung offen, ohne die abwertende Konnotation des deutschen Wortes „Heiden“ einzutragen.
- source_word: አይንሥኡ፡ ለውሉዶሙ
  choice: für ihre Söhne keine Frauen … nehmen
  rationale: Das Verb „nehmen“ steht im Heiratskontext; das deutsche „Frauen nehmen“ macht diesen Bezug verständlich, ohne ein zusätzliches ausdrückliches Verb für „heiraten“ in den Haupttext einzutragen.
theological_decisions:
- issue: Kraft der Anweisung
  choice: „dass sie … nicht … sollen“
  alternative: „dass sie … nicht dürfen“
  rationale: Die Soll-Form gibt die verbindliche Weisung wieder, ohne ihre Modalität unnötig als bloße Erlaubnisfrage zu formulieren.
- issue: Adressaten des Zeugnisses bzw. der Warnung
  choice: „bezeuge ihnen“
  alternative: „warne sie eindringlich“
  rationale: Die Übersetzung wahrt den möglichen rechtlich-bundestheologischen Zeugnischarakter; „warnen“ wäre verständlich, würde die genuine Bedeutungsbreite aber stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur der beiden Eheverbote bleibt erhalten; „Israeliten“ und „Völker“ vermeiden unnötig archaische beziehungsweise konfessionell belastete Formulierungen.
