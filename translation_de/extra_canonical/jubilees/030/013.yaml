base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: de
  text: „Wir werden unsere Tochter keinem Mann geben, der eine Vorhaut hat; denn das ist eine Schmach für uns.“ Auch für Israel ist es eine Schmach – für alle, die geben, und für alle, die von den Töchtern der Völker nehmen –, denn es ist unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ
  choice: eine Vorhaut hat
  rationale: Gibt die konkrete Formulierung des geʿezischen Textes wieder, statt sie lediglich mit „unbeschnitten ist“ zusammenzufassen.
- source_word: ጽእለት
  choice: Schmach
  rationale: Entspricht dem Sinn von öffentlicher Entehrung bzw. Schande und bewahrt den feierlich-ernsten Ton.
- source_word: አዋልደ፡ አሕዛብ
  choice: Töchter der Völker
  rationale: Bewahrt die wörtliche, im biblischen Sprachgebrauch verständliche Bezeichnung; „Völker“ gibt አሕዛብ hier neutraler wieder als „Heiden“.
- source_word: ርኵስ
  choice: unrein
  rationale: Bewahrt die kultisch-ethische Bedeutungsbreite des Ausgangswortes, ohne sie auf „verboten“ oder „sündig“ zu verengen.
theological_decisions:
- issue: Übergang von direkter Rede zu kommentierender Aussage
  choice: Nur den ersten Satz in Anführungszeichen setzen
  alternative: Den gesamten Vers als direkte Rede oder ganz ohne Anführungszeichen wiedergeben
  rationale: Der erste Satz entspricht der Rede der Söhne Jakobs; der folgende Satz formuliert eine auf Israel bezogene allgemeine Wertung. Die Zeichensetzung macht den Sprecherwechsel sichtbar, ohne zusätzliche Sprecherbezeichnungen einzufügen.
- issue: Nicht ausdrücklich genannte Objekte bei „geben“ und „nehmen“
  choice: Die knappe Parallelform „die geben … die nehmen“ bewahren
  alternative: „die ihre Töchter geben“ und „die sich Frauen nehmen“ ergänzen
  rationale: Der geʿezische Text lässt die Objekte teilweise implizit. Die Übersetzung vermeidet es, die genaue Rollenverteilung stärker festzulegen, als es die Quelle tut.
- issue: Bezug von „es ist unrein“
  choice: Das unbestimmte Pronomen „es“ beibehalten
  alternative: „eine solche Verbindung ist unrein“
  rationale: Die Quelle benennt den grammatischen bzw. sachlichen Bezug nicht näher; die offene Form bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst quellennaher Syntax. „Schmach“ trägt den gehobenen biblischen Ton, bleibt aber allgemein verständlich. Der Gedankenstrich gliedert die erläuternde Zuordnung, ohne dem Text zusätzliche Inhalte hinzuzufügen.
