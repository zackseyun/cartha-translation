base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: de
  text: 'Darum habe ich dir geboten: »Lege Israel dieses Zeugnis vor: Sieh, was mit den Sichemitern und ihren Söhnen geschah, wie sie in die Hand der beiden Söhne Jakobs gegeben wurden und diese sie unter Qualen[a] töteten. Das wurde ihnen als Gerechtigkeit angerechnet und für sie als Gerechtigkeit aufgeschrieben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der schwierige Ausdruck kann auch »in Bedrängnis« oder »mit Mühsal« bedeuten; in einigen Texttraditionen steht möglicherweise »mit dem Schwert«. Gemeint ist jedenfalls eine gewaltsame Tötung.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስምዕ ዛተ ስምዐ
  choice: Lege Israel dieses Zeugnis vor
  rationale: Die Kognatverbindung bezeichnet das Bezeugen beziehungsweise eindringliche Einschärfen; die deutsche Fassung bewahrt den Zeugnischarakter, ohne unnatürlich wörtlich zu klingen.
- source_word: ለሰቂሞን ወለውሉዱ
  choice: mit den Sichemitern und ihren Söhnen
  rationale: Der Volks- beziehungsweise Gruppenname wird natürlich als »Sichemiter« wiedergegeben; das Possessivpronomen bezieht sich auf diese Gruppe.
- source_word: በፃዕር
  choice: unter Qualen
  rationale: Das äthiopische Wort bezeichnet Mühsal, Schmerz, Bedrängnis oder Qual. »Unter Qualen« gibt den schwierigen Ausdruck formal und kontextgerecht wieder; abweichende Texttraditionen werden in der Fußnote vermerkt.
- source_word: ኮነቶሙ ጽድቀ
  choice: Das wurde ihnen als Gerechtigkeit angerechnet
  rationale: Die Konstruktion beschreibt eine wertende Zurechnung; »angerechnet« ist im Deutschen verständlich und erhält die Aussage des Textes.
- source_word: ተጽሕፎሙ ለጽድቅ
  choice: für sie als Gerechtigkeit aufgeschrieben
  rationale: Die Formulierung wahrt die Wiederholung von »Gerechtigkeit« und gibt den Dativ zu ihren Gunsten beziehungsweise auf ihr Konto wieder, ohne ihn als adressiertes Schreiben misszuverstehen.
theological_decisions:
- issue: Positive himmlische Bewertung der Tötung der Sichemiter
  choice: Die ausdrückliche Zurechnung »als Gerechtigkeit« bleibt unverändert stehen.
  alternative: Die Aussage durch »als gerechte Tat angesehen« abzuschwächen oder moralisch zu kommentieren.
  rationale: Der Quellentext fällt selbst eine starke theologische Wertung. Eine Übersetzung darf die Spannung zur Gewaltdarstellung weder auflösen noch durch einen erklärenden Zusatz korrigieren.
- issue: Agens beim Töten
  choice: »diese« bezeichnet ausdrücklich die beiden Söhne Jakobs.
  alternative: Ein unbestimmtes »sie wurden getötet«.
  rationale: Das Ge'ez hat ein aktives Verb mit pluralischem Subjekt; der unmittelbare Bezug sind die beiden Söhne Jakobs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird klar gegliedert; Wiederholungen der Quelle, besonders »als Gerechtigkeit«, bleiben erhalten. Der traditionelle Orts- und Volksname Sichem/Sichemiter wird verwendet.
