  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: de
  text: 'denn es ist ein Gräuel vor dem HERRN. Darum habe ich dir in den Worten des Gesetzes alle Taten der Einwohner von Sichem aufgeschrieben, die sie gegen Dina verübten, und wie die Söhne Jakobs sprachen, als sie sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምኑን
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas Abscheuliches bzw. einen Gräuel; die nominale Wiedergabe bewahrt die Form und das Gewicht der Aussage.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens bzw. der Gottesbezeichnung passt zum biblischen Register.
- source_word: ውስተ፡ ቃለ፡ ሕግ
  choice: in den Worten des Gesetzes
  rationale: Formnahe Wiedergabe der Wendung; sie lässt offen, ob eine konkrete Gesetzesschrift oder deren Wortlaut gemeint ist.
- source_word: ሴቄማ
  choice: die Einwohner von Sichem
  rationale: Die zugehörigen pluralischen Formen („ihre Taten“, „die sie begingen“) zeigen, dass die Leute von Sichem und nicht allein die namensgleiche Einzelperson gemeint sind.
- source_word: ገብሩ፡ ላዕለ፡ ዲና
  choice: die sie an Dina begingen
  rationale: Im Deutschen ist „Taten an jemandem begehen“ eine natürliche, zugleich bewusst wertende Wiedergabe für das gegen Dina gerichtete Handeln.
- source_word: እንዘ፡ ይብሉ
  choice: und sagten
  rationale: Die einleitende Partizipialkonstruktion führt die folgende direkte Rede ein; „sprachen und sagten“ erhält die Wiederholung des Ausgangstextes.
theological_decisions:
- issue: Bewertung der Tat vor Gott
  choice: es ist ein Gräuel vor dem HERRN
  alternative: es ist abscheulich vor dem HERRN
  rationale: Die substantivische Form bewahrt die starke kultisch-ethische Wertung, ohne sie näher einzugrenzen.
- issue: Bezug von Sichem
  choice: die Einwohner von Sichem
  alternative: die Sichemiten / Sichem
  rationale: Der Plural im Ge'ez verlangt einen kollektiven Bezug. „Einwohner von Sichem“ ist im modernen Deutsch klarer und vermeidet die mögliche Verwechslung mit der Einzelperson Sichem.
translation_notes:
  register: Modernes, würdevolles Bibeldeutsch. „HERR“ folgt der üblichen typografischen Konvention; „Gräuel“ bewahrt den markanten biblischen Ton. Der Vers endet mit einem Doppelpunkt, da die Rede im folgenden Vers fortgesetzt wird.
