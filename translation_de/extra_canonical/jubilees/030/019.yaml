  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: de
  text: 'Und deshalb verzeichnen sie für ihn auf den himmlischen Tafeln ein Zeugnis der Gunst[a]: Segen und Gerechtigkeit vor dem Gott des Alls.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Geʿez: ስምዐ ፡ ሞገስ (semʿa mogas), wörtlich etwa »Zeugnis der Gunst«; gemeint ist eine förmliche Aufzeichnung wohlwollender Anerkennung oder Gnade.'
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: sie schreiben
  rationale: Gibt die aktive Pluralform des Geʿez wieder, ohne die nicht ausdrücklich genannten Schreibenden als Engel zu identifizieren.
- source_word: ስምዐ ፡ ሞገስ
  choice: ein Zeugnis der Gunst
  rationale: Bewahrt die formelle Zeugnissprache und gibt ሞገስ als Gunst beziehungsweise wohlwollende Anerkennung wieder.
- source_word: በጽላተ ፡ ሰማይ
  choice: auf die himmlischen Tafeln
  rationale: Natürliche deutsche Wiedergabe der lokalen Präposition und der festen Vorstellung himmlischer Tafeln.
- source_word: በረከተ ፡ ወጽድቀ
  choice: Segen und Gerechtigkeit
  rationale: Entspricht den beiden koordinierten Substantiven, ohne ihr genaues Verhältnis zum vorausgehenden Zeugnis übermäßig festzulegen.
- source_word: አምላከ ፡ ኵሉ
  choice: dem Gott des Alls
  rationale: Gibt die umfassende Genitivfügung knapp und würdevoll wieder; »des Alls« wahrt ihren kosmischen Umfang.
theological_decisions:
- issue: Identität des pluralischen Subjekts von ይጽሕፉ
  choice: Das unbestimmte »sie« wird beibehalten.
  alternative: »Es wird eingeschrieben« oder »die Engel schreiben«
  rationale: Der Quelltext hat ein aktives pluralisches Verb, nennt die Handelnden jedoch nicht; eine ausdrückliche Identifizierung als Engel wäre interpretierend.
- issue: Bezug von »Segen und Gerechtigkeit«
  choice: Der Doppelpunkt stellt beide Begriffe als Inhalt oder nähere Bestimmung des Zeugnisses dar, ohne die Syntax dogmatisch zu verengen.
  alternative: »nämlich Segen und Gerechtigkeit«
  rationale: Die knappe Reihung im Geʿez lässt das genaue syntaktische Verhältnis offen; der Doppelpunkt erhält diese Spannung besser als eine explizite Gleichsetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der knappen, formellen Sprache der Quelle; der Vers enthält ausschließlich den vorgelegten Text von Jubiläen 30,19.
