  text: 'Denn so ist es angeordnet und auf den himmlischen Tafeln über die gesamte Nachkommenschaft Israels geschrieben:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: ist es angeordnet
  rationale: Das passive Verb bezeichnet eine verbindliche Festsetzung oder Anordnung; die unpersönliche deutsche Form bewahrt das Passiv des Ausgangstextes.
- source_word: ተጽሕፈ
  choice: geschrieben
  rationale: Gibt das passive „wurde/ist geschrieben“ knapp wieder und ist mit „ist“ aus dem ersten Prädikat koordiniert.
- source_word: ጽላተ፡ ሰማይ
  choice: den himmlischen Tafeln
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Vorstellung von „Tafeln des Himmels“ im Sprachgebrauch des Jubiläenbuches.
- source_word: በእንተ
  choice: über
  rationale: Bezeichnet hier den Gegenstand, auf den sich die schriftliche Festlegung bezieht.
- source_word: ኵሉ፡ ዘርአ፡ እስራኤል
  choice: die gesamte Nachkommenschaft Israels
  rationale: „Nachkommenschaft“ gibt das kollektive „Same“ im modernen Deutsch verständlich wieder, ohne die Aussage auf einzelne Generationen zu beschränken.
theological_decisions:
- issue: Urheber der Anordnung und Niederschrift
  choice: Unpersönliches Passiv ohne ausdrücklich genannten Handelnden
  alternative: „Gott hat es angeordnet und ... geschrieben“
  rationale: Der Ausgangstext nennt den Handelnden nicht ausdrücklich; die Übersetzung vermeidet eine stillschweigende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelcharakter als angeordnete und schriftlich festgehaltene Bestimmung bleibt erhalten; der Doppelpunkt signalisiert die folgende inhaltliche Ausführung.
