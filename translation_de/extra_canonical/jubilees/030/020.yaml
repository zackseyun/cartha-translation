  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: de
  text: 'Und an dem Tag, als die Söhne Jakobs die Einwohner von Sichem töteten, wurde für sie im Himmel eine Urkunde verfasst[a]: Sie hatten Gerechtigkeit und Recht geübt und an den Sündern Vergeltung vollzogen. Und es wurde ihnen zum Segen angerechnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der vorliegenden äthiopischen Lesart möglicherweise: »Eine Urkunde stieg für sie zum Himmel hinauf.«'
    reason: Die sichtbare Geʽez-Formulierung enthält ein Verb des Hinaufsteigens, während die revidierte Lesart eine passive Form von »schreiben« voraussetzt.
lexical_decisions:
- source_word: መጽሐፍ (maṣḥaf)
  choice: Urkunde
  rationale: Das Wort bezeichnet wörtlich ein Schriftstück oder Buch. Im himmlischen Gerichtskontext gibt „Urkunde“ den dokumentarischen Charakter natürlich wieder.
- source_word: ጽድቀ፡ ወርትዐ
  choice: Gerechtigkeit und Recht
  rationale: Die beiden parallelen Begriffe werden unterschieden wiedergegeben, ohne sie zu einem einzigen moralischen Urteil zusammenzuziehen.
- source_word: ወበቀለ፡ ላዕለ፡ ኃጥአን
  choice: und an den Sündern Vergeltung vollzogen
  rationale: Bewahrt die Aussage des Textes, dass ihr Handeln als Vergeltung an den Sündern bewertet wird, ohne sie durch ein moderneres Werturteil abzuschwächen.
- source_word: ለበረከት
  choice: ihnen zum Segen angerechnet
  rationale: Gibt die knappe Ziel- oder Bestimmungsangabe idiomatisch wieder und hält den Bezug zur himmlischen Niederschrift fest.
theological_decisions:
- issue: Himmlische Bewertung der Tötung der Einwohner Sichems
  choice: Die positive Bewertung als Gerechtigkeit, Recht und Vergeltung bleibt ausdrücklich stehen.
  alternative: Die Aussage durch distanzierende Formulierungen wie „galt als“ oder durch eine moralische Erklärung abschwächen.
  rationale: Der Quelltext stellt diese theologisch schwierige Bewertung selbst auf; eine Übersetzung darf die Spannung nicht stillschweigend beseitigen.
- issue: Art der himmlischen Niederschrift
  choice: Im Haupttext steht „wurde ... eine Urkunde verfasst“, mit einer Fußnote zur wörtlichen Lesart des überlieferten Verbs.
  alternative: „Eine Urkunde stieg für sie hinauf.“
  rationale: Die revidierte Textentscheidung versteht die Aussage als himmlische schriftliche Registrierung; die sichtbare äthiopische Überlieferung kann jedoch wörtlich ein Hinaufsteigen des Schriftstücks ausdrücken. Die Fußnote bewahrt diese Ambiguität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sichem“ folgt der im Deutschen üblichen biblischen Namensform. Der Satzbau wurde für gute Verständlichkeit gegliedert, ohne die positive und spannungsreiche Bewertung des Geschehens im Quelltext zu relativieren.
