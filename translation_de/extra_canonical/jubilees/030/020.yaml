  source_fidelity: Die sichtbare geʽezische Überlieferung zu diesem Vers lautet beim ersten Prädikat ዐርገ፡ („stieg hinauf“) mit መጽሐፍ („Buch/Schriftstück/Urkunde“). Der Haupttext „wurde ... eine Urkunde verfasst“ folgt zwar der englischen Audit-Entscheidung, gibt diese sichtbare Lesart aber nicht wieder. Die abschließende Form ወተጽሕፈ፡ („und es wurde geschrieben/verzeichnet“) stützt dagegen die Niederschrift zum Segen.
  naturalness: „Stieg zu ihren Gunsten eine Urkunde in den Himmel auf“ ist verständliches, würdiges modernes Standarddeutsch und bewahrt die ungewöhnliche Bildsprache des Textes. „Zum Segen verzeichnet“ gibt die knappe passive Schlussformel idiomatisch wieder.
  terminology: „Urkunde“ ist für መጽሐፍ im gerichtlichen/himmlischen Register vertretbar. „Gerechtigkeit und Recht“ und „Vergeltung an den Sündern“ bewahren die dreiwertige Reihung und die wertende Aussage des Textes. „Einwohner von Sichem“ ist sachgerecht.
  issues:
  - severity: medium
    issue: Der Haupttext ersetzt das sichtbare Verb „stieg hinauf“ durch „wurde ... verfasst“.
    rationale: Die englische Auditspur bevorzugt eine abweichende passive Lesart, doch die vorgelegte geʽezische Textgestalt hat ausdrücklich ein Verb des Hinaufsteigens. Da die Übersetzung zuerst am Originaltext auszurichten ist, muss diese Lesart im Haupttext stehen; die abweichende Audit-Lesart kann in einer Fußnote dokumentiert werden.
  - severity: low
    issue: Die vorhandene Fußnote bezeichnet die sichtbare Lesart nur als „möglicherweise“ und stellt die abweichende Lesart in den Haupttext.
    rationale: Für die vorgelegte Textgestalt ist das Hinaufsteigen nicht bloß eine entfernte Möglichkeit. Die Fußnote sollte stattdessen die abweichende, in der englischen Auditspur angenommene Lesart als solche ausweisen.
  revised_text: 'Und an dem Tag, als die Söhne Jakobs die Einwohner von Sichem töteten, stieg zu ihren Gunsten eine Urkunde in den Himmel auf[a]: Sie hatten Gerechtigkeit und Recht geübt und an den Sündern Vergeltung vollzogen. Und sie wurde zum Segen verzeichnet.'
