review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: eine Schandtat in Israel, die Übergabe in die Hand der Söhne Jakobs, Vernichtung mit dem Schwert, das weitere offene „dies an ihnen tun“ sowie der unvollständige Schlusssatz. „Vernichten“ gibt die starke Bedeutung von ይሠርውዎሙ angemessen wieder. Die Zweck-/Folgeform der drei ከመ-Sätze sollte im Deutschen jedoch syntaktisch klarer als im Entwurf markiert werden.'
  naturalness: '„damit diese sie mit dem Schwert vernichteten und so an ihnen handelten“ ist im modernen Standarddeutsch als Finalkonstruktion nicht idiomatisch: Der Präteritum-Indikativ verwischt die Abhängigkeit von „damit“, und „so an ihnen handelten“ ist unnötig unbestimmt. „damit sie sie … vernichten und ihnen dies antun sollten“ ist klar, würdevoll und wahrt die offene Demonstrativformel.'
  terminology: „der HERR gab sie in die Hand der Söhne Jakobs“ ist als traditionelle Formel passend. „Schande in Israel verübt“ ist sachlich und registergerecht. „ihnen dies antun“ bildet ዝንተ („dies“) direkter ab als „so an ihnen handeln“.
  issues:
  - severity: medium
    issue: Finalsatz mit Präteritum-Indikativ
    rationale: Nach „gab sie …, damit“ ist „vernichteten“ nicht die natürliche deutsche Wiedergabe eines Zwecksatzes. Die Quelle verwendet eine von ከመ eingeleitete Ziel-/Folgekonstruktion; „vernichten … sollten“ macht diese Relation verständlich, ohne eine zusätzliche Deutung einzuführen.
  - severity: low
    issue: „so an ihnen handelten“ statt direktem Demonstrativobjekt
    rationale: Die Vorlage sagt wörtlich sinngemäß „dies an ihnen tun“. „Ihnen dies antun“ bewahrt den demonstrativen, im Kontext offenen Bezug genauer und klingt natürlicher.
  revised_text: denn sie hatten Schande in Israel verübt. Und der HERR gab sie in die Hand der Söhne Jakobs, damit sie sie mit dem Schwert vernichten und ihnen dies antun sollten und damit es nicht wieder geschehe,
