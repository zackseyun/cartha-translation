  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: de
  text: denn sie hatten Schande in Israel verübt. Und der HERR gab sie in die Hand der Söhne Jakobs, damit sie sie mit dem Schwert vernichten und ihnen dies antun sollten und damit es nicht wieder geschehe,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብሩ፡ ኀፍረተ
  choice: sie hatten Schande … verübt
  rationale: Die Verbindung bezeichnet das Begehen einer schändlichen Tat; „Schande verüben“ bewahrt den sachlichen und zugleich würdevollen Ton.
- source_word: መጠዎሙ፡ እግዚአብሔር፡ ውስተ፡ እዴ
  choice: der HERR gab sie in die Hand
  rationale: Die traditionelle Übergabeformel wird formal nah und im Deutschen idiomatisch wiedergegeben.
- source_word: ይሠርውዎሙ
  choice: sie … vernichteten
  rationale: Das Verb hat die starke Bedeutung „ausrotten, beseitigen, vernichten“; „vernichten“ gibt diese umfassendere Kraft besser wieder als bloß „töten“.
- source_word: ይግበሩ፡ ላዕሌሆሙ፡ ዝንተ
  choice: so an ihnen handelten
  rationale: Die demonstrative Wendung „dies an ihnen tun“ wird natürlich wiedergegeben, ohne ihren Bezug interpretierend zu präzisieren.
- source_word: ኢይኩን
  choice: damit es nicht wieder geschehe
  rationale: Die unpersönliche Form und der offene Bezug bleiben erhalten; der offenbar im Folgetext weiterlaufende Satz wird nicht ergänzt.
theological_decisions:
- issue: Göttliche Übergabe der Täter an Jakobs Söhne
  choice: „der HERR gab sie in die Hand der Söhne Jakobs“
  alternative: „der HERR lieferte sie den Söhnen Jakobs aus“
  rationale: Die gewählte Form bewahrt die biblische Übergabeformel und lässt die theologische Spannung zwischen göttlichem Handeln und menschlicher Gewalttat unaufgelöst.
- issue: Zweck der Vernichtung
  choice: Die drei ከመ-Sätze werden als Zweckangaben wiedergegeben.
  alternative: Den mittleren Satz als richterliche Vollstreckung deuten.
  rationale: Der Ausgangstext spricht vom Vernichten und Handeln, nennt jedoch nicht ausdrücklich „Gericht“ oder „Strafe“; eine solche Deutung wird daher nicht eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Formel „in die Hand geben“. Der Vers ist im vorgelegten Ge’ez-Text syntaktisch unvollständig und endet mit einer weiterführenden Aussage; deshalb bleibt auch die deutsche Fassung mit Komma offen, ohne Material aus dem Kontext zu ergänzen.
