lexical_decisions:
- source_word: ሞተ፡ ለይሙት
  choice: Er soll ganz gewiss sterben
  rationale: Die figura etymologica aus ‚sterben‘ und derselben Verbalwurzel verstärkt die Aussage. Natürliches modernes Deutsch gibt diese Emphase mit ‚ganz gewiss‘ wieder.
- source_word: አህቀ
  choice: wurde … wohlhabend
  rationale: Das Verb bezeichnet hier Isaaks wirtschaftliches Gedeihen beziehungsweise Reichwerden; ‚wurde wohlhabend‘ passt zum folgenden Hinweis auf seinen großen Besitz.
- source_word: በፍልስጥኤም
  choice: im Philisterland
  rationale: Die Form bezeichnet das Gebiet der Philister. ‚Philisterland‘ wahrt den geografischen Bezug und ist im Deutschen verständlicher als eine mehrdeutige moderne Gebietsbezeichnung.
- source_word: ጥሪት፡ ብዙኅ
  choice: großen Reichtum
  rationale: Die Wendung bezeichnet umfangreichen Besitz beziehungsweise Vermögen. ‚Großen Reichtum‘ ist idiomatisch und vermeidet die im Deutschen mögliche Bedeutung von ‚Eigentum‘ als bloßer Rechtskategorie.
theological_decisions:
- issue: Stärke des Todesurteils
  choice: ganz gewiss sterben
  alternative: des Todes sterben
  rationale: Die emphatische Aussage bleibt erhalten, ohne eine heute unnatürliche hebräisierende beziehungsweise quellensprachlich nachgebildete Formel einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als Abschluss einer direkten Rede erkennbar; der anschließende Erzählsatz ist klar und flüssig. Keine konfessionell geprägte Terminologie.
