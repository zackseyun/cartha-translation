  yaml_path: translation/extra_canonical/jubilees/024/010.yaml
  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: de
  text: Und deinen Nachkommen werde ich dieses ganze Land geben. Ich werde meinen Eid bestätigen, den ich deinem Vater Abraham geschworen habe. Ich werde deine Nachkommen so zahlreich machen wie die Sterne am Himmel und deinen Nachkommen dieses ganze Land geben. Und sie werden sich segnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden gesegnet werden.“ Der vorliegende geʿezische Text nennt hier nicht ausdrücklich „alle Völker der Erde“.'
    reason: Die geʿezische Verbalform ist zwischen reflexiver und passiver Bedeutung mehrdeutig, und das Subjekt wird im vorliegenden Ausschnitt nicht ausdrücklich genannt.
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommen / deinen Nachkommen
  rationale: Das geʿezische Wort bezeichnet hier kollektiv die Nachkommenschaft. Der deutsche Plural ist natürlich und bewahrt den kollektiven Sinn.
- source_word: አቀውም፡ መሐላየ
  choice: meinen Eid bestätigen
  rationale: Die Wendung bedeutet wörtlich, den Eid aufzurichten bzw. Bestand haben zu lassen; „bestätigen“ gibt dies in natürlichem Deutsch wieder.
- source_word: ከመ፡ ከዋክብተ፡ ሰማይ
  choice: so zahlreich wie die Sterne am Himmel
  rationale: Das im Verb enthaltene Vermehren wird mit dem Vergleich idiomatisch als „so zahlreich machen wie“ wiedergegeben.
- source_word: ወይትባረኩ
  choice: Und sie werden sich segnen
  rationale: Die reflexiv-passive Verbalform kann als reflexives Segnen oder als passives Gesegnetwerden verstanden werden. Die Hauptfassung folgt der reflexiven Deutung, ohne ein im vorliegenden Quelltext nicht genanntes Subjekt wie „alle Völker der Erde“ zu ergänzen.
theological_decisions:
- issue: Mehrdeutigkeit der Schlussform ወይትባረኩ
  choice: Und sie werden sich segnen
  alternative: Und sie werden gesegnet werden
  rationale: Die Form lässt sowohl eine reflexive als auch eine passive Deutung zu. Diese Spannung wird durch eine Fußnote bewahrt; die im parallelen Traditionskontext mögliche Ergänzung „alle Völker der Erde“ wird nicht in den Text eingeführt, da sie im bereitgestellten geʿezischen Wortlaut fehlt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung der Landverheißung bleibt als Merkmal des Quelltexts erhalten; nicht im vorliegenden Text enthaltene Wörter werden nicht ergänzt.
