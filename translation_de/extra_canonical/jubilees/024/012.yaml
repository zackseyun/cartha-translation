lexical_decisions:
- source_word: በእንተ፡ ኵሉ፡ ዘዚአሁ
  choice: über alles, was ihm gehörte
  rationale: Die Wendung bezeichnet umfassend seinen Besitz bzw. alles ihm Zugehörige; die deutsche Relativkonstruktion ist natürlich und wahrt den Umfang.
- source_word: እንዘ፡ ይብል
  choice: indem er sagte
  rationale: Gibt die begleitende bzw. modale Funktion der ge'ezischen Konstruktion eng wieder.
- source_word: ዘይሰክፎ
  choice: der ihn … anrührt
  rationale: Das Verb bezeichnet hier ein Berühren oder Antasten. „Anrührt“ passt zum Warn- bzw. Schutzkontext, ohne bereits eine Schädigungsabsicht festzulegen.
- source_word: ወለኵሉ፡ ዘዚአሁ
  choice: oder irgendetwas von dem …, was ihm gehört
  rationale: Das koordinierte zweite Objekt wird idiomatisch wiedergegeben und bleibt auf alles ihm Zugehörige bezogen.
theological_decisions:
- issue: Reichweite des Berührungsverbots
  choice: „ihn oder irgendetwas …, was ihm gehört“
  alternative: „ihn und all seinen Besitz“
  rationale: Die Übersetzung wahrt die Einzelalternative zwischen der Person und etwas aus ihrem Eigentum, statt beide Gegenstände zu einer pauschalen Formel zusammenzuziehen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers ist im vorliegenden Ausschnitt syntaktisch unvollständig; daher endet der Text bewusst mit einem Komma und ohne ergänzten Nachsatz.
