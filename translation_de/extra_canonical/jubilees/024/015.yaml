  text: among the Philistines and reaped a hundredfold. And Isaac became very great, and the Philistines envied him. And all the wells that the servants of Abraham had dug during Abraham's lifetime, the Philistines stopped up.
translation:
  language: de
  text: bei den Philistern und erntete hundertfach. Isaak wurde sehr mächtig, und die Philister beneideten ihn. Alle Brunnen, die Abrahams Knechte zu Abrahams Lebzeiten gegraben hatten, schütteten die Philister zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐረገ፡ መእተ፡ ስዊተ
  choice: und erntete hundertfach
  rationale: Die Wendung beschreibt den hundertfachen Ertrag der Aussaat; „erntete hundertfach“ gibt den landwirtschaftlichen Sinn im Deutschen natürlich wieder.
- source_word: ወዐብየ፡ ይስሐቅ፡ ፈድፋደ
  choice: Isaak wurde sehr mächtig
  rationale: Die Verbindung bezeichnet Isaaks außerordentliches Groß- bzw. Mächtigwerden; „sehr mächtig“ bewahrt neben Wohlstand auch seine gewachsene Stellung.
- source_word: ወቀንኡ፡ ላዕሌሁ
  choice: und die Philister beneideten ihn
  rationale: Das Verb bezeichnet Eifersucht oder Neid; im Zusammenhang mit Isaaks Erfolg ist „beneideten“ die idiomatische deutsche Wahl.
- source_word: ደፈንዎ
  choice: schütteten ... zu
  rationale: Das Verb bedeutet hier, die Brunnen zu verschließen bzw. unbrauchbar zu machen; „zuschütten“ ist die sachlich passende deutsche Formulierung.
