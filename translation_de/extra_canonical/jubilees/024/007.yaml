  text: And Jacob grew up, and kept the command of his father, but Esau rejected it. And there was famine upon the land, and he came
translation:
  language: de
  text: Und Jakob wuchs heran und hielt das Gebot seines Vaters; Esau aber verwarf es. Da kam eine Hungersnot über das Land, und er kam …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አህቀ (ʾaḥaqa)
  choice: wuchs heran
  rationale: Das Verb bezeichnet hier das Heranwachsen beziehungsweise Erreichen der Reife, nicht ein Großwerden an Rang oder Macht.
- source_word: ኀለወ (ḫalawa)
  choice: hielt
  rationale: Das Verb bedeutet, ein Gebot zu halten oder zu befolgen.
- source_word: ዐበየ (ʿabaya)
  choice: verwarf
  rationale: Im Kontrast zu Jakobs Gehorsam bezeichnet das Verb Esaus Weigerung beziehungsweise Zurückweisung des väterlichen Gebots.
- source_word: ዐባር (ʿabār)
  choice: Hungersnot
  rationale: Das Substantiv bezeichnet eine Hungersnot; die natürliche deutsche Wendung lautet, dass sie über das Land kam.
- source_word: መጽአ (maṣʾa)
  choice: er kam
  rationale: Die maskuline Singularform und der im Versabbruch offene Satz werden bewahrt, ohne den nicht ausdrücklich genannten Bezug des Pronomens festzulegen.
theological_decisions:
- issue: Gehorsam Jakobs und Zurückweisung durch Esau
  choice: Jakob hält das väterliche Gebot, Esau verwirft es.
  alternative: Jakob entfernt sich vom Gebot seines Vaters.
  rationale: Die korrigierte Lesung enthält ኀለወ im Sinn von „halten“ und nennt anschließend Esau als denjenigen, der ablehnt. Die Alternative würde die Rollen vertauschen und den Sinn des Quelltexts umkehren.
- issue: Unbestimmter Bezug von „er kam“
  choice: Das Pronomen bleibt unaufgelöst.
  alternative: Eine bestimmte Person namentlich einsetzen.
  rationale: Der vorliegende Vers nennt das Subjekt des letzten Verbs nicht ausdrücklich; eine namentliche Ergänzung würde die genuine Offenheit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Kontrast zwischen Jakob und Esau wird mit „aber“ klar und natürlich wiedergegeben. Der unvollständige Schluss der überlieferten Verseinteilung bleibt durch die Auslassungspunkte erkennbar.
