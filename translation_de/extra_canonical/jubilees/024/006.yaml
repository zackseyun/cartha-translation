review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen geʿezischen Aussagen zutreffend wieder: Esau schwört, Jakob gibt ihm Brot und ein gekochtes Weizengericht, Esau verkauft sein Erstgeburtsrecht, und der Name Edom wird mit diesem Gericht erklärt. „Weizeneintopf“ ist als verständliche, vorsichtige Wiedergabe von ተብሰለ፡ ስርናይ vertretbar und vermeidet zu Recht die Angleichung an Genesis 25. Allerdings ist das unmarkierte Pronomen „Er“ nach „Jakob gab ...“ im Deutschen naheliegend auf Jakob bezogen, während der Quelltext Esau als Essenden benennt.'
  naturalness: Der Stil ist insgesamt modernes, würdiges Standarddeutsch. Die explizite Nennung Esaus statt des missverständlichen Pronomens verbessert Verständlichkeit und Erzählanschluss. „Deshalb wurde er Edom genannt“ ist idiomatischer als „wurde sein Name Edom genannt“.
  terminology: „Erstgeburtsrecht“ und „verkaufte“ sind treffend. „Weizeneintopf“ ist im Haupttext zulässig; die Anmerkung sollte sprachlich vollständig formuliert und als Erklärung der begrenzten Bestimmbarkeit des Gerichts gefasst werden.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „Er aß“
    rationale: Nach dem unmittelbar vorher genannten Subjekt Jakob legt das deutsche Pronomen „Er“ Jakob als Essenden nahe. Im geʿezischen Text ist Esau derjenige, der aß, bis er satt war.
  - severity: low
    issue: Unidiomatische Namensformulierung
    rationale: „Deshalb wurde sein Name Edom genannt“ folgt zwar eng einer semitischen Formel, ist im modernen Deutschen jedoch weniger natürlich als „Deshalb wurde er Edom genannt“.
  - severity: low
    issue: Unvollständige Formulierung der Fußnotenalternative
    rationale: '„Auch: ‚gekochten Weizengerichts‘“ lässt den notwendigen Artikel aus. „Auch: ‚ein gekochtes Weizengericht‘“ ist grammatisch und erläutert die Alternative klarer.'
  revised_text: „Schwöre mir heute!“ Da schwor er ihm. Und Jakob gab seinem Bruder Esau Brot und einen Eintopf. Esau aß, bis er satt war. Esau verkaufte sein Erstgeburtsrecht. Deshalb wurde er Edom genannt, wegen des Weizeneintopfs[a], den Jakob ihm im Tausch gegen sein Erstgeburtsrecht gab.
  revised_footnotes:
  - marker: a
    text: 'Auch: „ein gekochtes Weizengericht“. Der geʿezische Text nennt Weizen, nicht rote Linsen.'
    reason: Die genaue Zubereitungsform des Gerichts bleibt offen. Zugleich wird klargestellt, dass der Text nicht mit dem roten Linsengericht aus Genesis 25 harmonisiert werden darf.
  revision_rationale: Die Revision beseitigt die im Deutschen erhebliche Subjektmehrdeutigkeit beim Essen, glättet die Namensformel und formuliert die Fußnote grammatisch vollständig. Sie verändert weder die Aussage noch die Abfolge des geʿezischen Textes und bewahrt dessen ausdrückliche Angabe von Weizen.
