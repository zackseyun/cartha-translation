revisions:
- from: „Schwöre mir heute!“ Da schwor er ihm. Und Jakob gab seinem Bruder Esau Brot und einen Eintopf. Er aß, bis er satt war. Esau verkaufte sein Erstgeburtsrecht. Deshalb wurde sein Name Edom genannt, wegen des Weizeneintopfs[a], den Jakob ihm im Tausch gegen sein Erstgeburtsrecht gegeben hatte.
  to: „Schwöre mir heute!“ Da schwor er ihm. Und Jakob gab seinem Bruder Esau Brot und einen Eintopf. Esau aß, bis er satt war. Esau verkaufte sein Erstgeburtsrecht. Deshalb wurde er Edom genannt, wegen des Weizeneintopfs[a], den Jakob ihm im Tausch gegen sein Erstgeburtsrecht gab.
  rationale: Die Revision beseitigt die im Deutschen erhebliche Subjektmehrdeutigkeit beim Essen, glättet die Namensformel und formuliert die Fußnote grammatisch vollständig. Sie verändert weder die Aussage noch die Abfolge des geʿezischen Textes und bewahrt dessen ausdrückliche Angabe von Weizen.
