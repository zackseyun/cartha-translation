base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: de
  text: „Schwöre mir heute!“ Da schwor er ihm. Und Jakob gab seinem Bruder Esau Brot und einen Eintopf. Esau aß, bis er satt war. Esau verkaufte sein Erstgeburtsrecht. Deshalb wurde er Edom genannt, wegen des Weizeneintopfs[a], den Jakob ihm im Tausch gegen sein Erstgeburtsrecht gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein gekochtes Weizengericht“. Der geʿezische Text nennt Weizen, nicht rote Linsen.'
    reason: Die genaue Zubereitungsform des Gerichts bleibt offen. Zugleich wird klargestellt, dass der Text nicht mit dem roten Linsengericht aus Genesis 25 harmonisiert werden darf.
lexical_decisions:
- source_word: ተብሰለ፡ ስርናይ
  choice: Weizeneintopf
  rationale: ስርናይ bezeichnet Weizen; ተብሰለ bezeichnet hier ein gekochtes Gericht bzw. einen Eintopf. Die Wiedergabe folgt dem geʿezischen Text und harmonisiert ihn nicht mit dem Linsengericht in Genesis 25.
- source_word: መጠ
  choice: verkaufte
  rationale: Das Verb bezeichnet hier ein Veräußern bzw. Verkaufen, nicht ein Verachten.
- source_word: ቀዳሙ፡ ትውልዶ / ቅድመተ፡ ልደቱ
  choice: sein Erstgeburtsrecht
  rationale: Die Wendungen beziehen sich auf Esaus Vorrang als Erstgeborener und werden im Deutschen idiomatisch mit „Erstgeburtsrecht“ wiedergegeben.
- source_word: እስከ፡ ይጸግብ
  choice: bis er satt war
  rationale: Natürliche und genaue Wiedergabe des Essens bis zur Sättigung.
theological_decisions:
- issue: Verhältnis zur Erzählung in Genesis 25
  choice: Weizeneintopf
  alternative: roter Linseneintopf
  rationale: Der vorliegende geʿezische Text nennt ausdrücklich Weizen und enthält weder „rot“ noch „Linsen“. Eine Angleichung an Genesis würde die eigenständige Textgestalt von Jubiläen beseitigen.
- issue: Esaus Handlung gegenüber dem Erstgeburtsrecht
  choice: verkaufte
  alternative: verachtete
  rationale: Die Übersetzung wahrt die konkrete Transaktion, die der Quelltext ausdrückt, statt eine theologische Bewertung aus Genesis einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Erzählperioden bewahren den klaren Handlungsablauf; „Eintopf“ ist allgemein verständlich, während die Fußnote die lexikalische Spannweite offenhält.
