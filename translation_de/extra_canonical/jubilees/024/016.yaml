  text: after Abraham died, and filled them with earth. And Abimelech said to Isaac, "Go away from us, for you have become much mightier than we." And Isaac departed from there in the first year of the seventh week and camped in the valley of Gerar. And they dug again the wells of water that the servants of Abraham his father had dug, and that the Philistines had stopped up after Abraham his father died; and they called their names by the names that Abraham his father had called them. And Isaac's servants dug a well in the wadi and found living water. And the shepherds of Gerar quarreled with Isaac's shepherds, saying, "The water is ours." And Isaac called the name of that well Contention, because they contended with us. And they dug another well, and they quarreled over that one also, and he called its name Hostility. And he moved on from there and dug another well, and they did not quarrel over it, and he called its name Broad Place. And Isaac said, "Now the LORD has made room for us,
    and we will be fruitful in the land." And he went up from there to the Well of the Oath in the first year of the first week in the forty-fourth jubilee. And the LORD appeared to him that night, at dawn on the first day of the first month, and said to him, "I am the God of Abraham your father. Do not fear, for I am with you, and I will bless you and greatly multiply your seed like the sand of the earth, for the sake of Abraham my servant." And he built there an altar where Abraham his father had first built one, and he called on the name of the LORD, and he offered sacrifice to the God of Abraham his father. And they dug a well and found living water. And Isaac's servants dug another well and did not find water, and they came and told Isaac that they had not found water. And Isaac said, "On this day I have sworn to the Philistines, and this thing has happened to us." And he called the name of that place Well of the Oath, because there he swore to Abimelech and to Ahuzzath his companion
    and to Phicol the captain of his army. And Isaac knew on that day that he had sworn under compulsion, to make peace with them. And on that day Isaac cursed the Philistines and said, "Cursed be the Philistines with wrath and indignation among all the nations. May the LORD give them over for reproach and for cursing and for wrath and for indignation into the hand of sinful nations, into the hand of the Kittim. And those who escape from the sword of the enemy and from the Kittim, let a righteous people root them out in judgment from under heaven, because they will be enemies and haters of my children in their generations upon the earth. And there will not be left to them any survivor or anyone who escapes in the day of wrathful judgment. For all the seed of the Philistines is destined for destruction and uprooting and removal from the earth, and there will no longer remain for these Caphtorim a remnant or seed upon the earth. For even if he goes up to heaven, from there he will be brought
    down; and if he sinks into the earth, from there he will be dragged away; and if he hides among the nations, from there he will be rooted out; and if he goes down into Sheol, there also his judgment will increase, and there will be no peace for him there. And if he goes into captivity, by the hand of those who seek his life on the highways they will kill him, and there will be left for him neither name nor seed in all the earth, for he will go into eternal curse." And thus it is written and ordained concerning him on the heavenly tablets, to do to him on the day of judgment, so that he should be rooted out from the earth.
translation:
  language: de
  text: 'nach Abrahams Tod kamen die Philister und füllten sie mit Erde. Abimelech sagte zu Isaak: »Geh fort von uns, denn du bist sehr viel mächtiger geworden als wir.« Da zog Isaak im ersten Jahr der siebten Jahrwoche von dort fort und ließ sich in der Ebene von Gerar nieder.


    Sie gruben die Wasserbrunnen wieder auf, die die Knechte seines Vaters Abraham gegraben und die die Philister nach dem Tod seines Vaters Abraham zugeschüttet hatten. Sie gaben ihnen dieselben Namen, die ihnen sein Vater Abraham gegeben hatte. Isaaks Knechte gruben im Wadi einen Brunnen und fanden lebendiges Wasser. Da stritten die Hirten von Gerar mit den Hirten Isaaks und sagten: »Das Wasser gehört uns!« Isaak nannte jenen Brunnen »Streit«, weil sie mit uns gestritten hatten. Dann gruben sie einen anderen Brunnen, doch auch um ihn stritten sie. Deshalb nannte er ihn »Feindschaft«. Er brach von dort auf und grub einen weiteren Brunnen. Um diesen stritten sie nicht, und er nannte ihn »Weiter Raum«. Isaak sagte: »Nun hat der HERR uns Raum geschaffen, und wir werden im Land fruchtbar sein.«


    Von dort zog er im ersten Jahr der ersten Jahrwoche des vierundvierzigsten Jubiläums zum Schwurbrunnen hinauf. In jener Nacht, beim Anbruch des ersten Tages des ersten Monats, erschien ihm der HERR und sagte zu ihm: »Ich bin der Gott deines Vaters Abraham. Fürchte dich nicht, denn ich bin mit dir. Ich werde dich segnen und deine Nachkommen überaus zahlreich machen wie den Sand der Erde, um meines Dieners Abraham willen.« Dort baute er einen Altar an der Stelle, an der sein Vater Abraham zuerst einen gebaut hatte. Er rief den Namen des HERRN an und brachte dem Gott seines Vaters Abraham ein Opfer dar.


    Sie gruben einen Brunnen und fanden lebendiges Wasser. Auch Isaaks Knechte gruben einen weiteren Brunnen, fanden aber kein Wasser. Sie kamen zu Isaak und berichteten ihm, dass sie kein Wasser gefunden hatten. Isaak sagte: »An diesem Tag habe ich den Philistern einen Eid geschworen, und nun ist uns dies widerfahren.« Er nannte jenen Ort »Schwurbrunnen«, weil er dort Abimelech, dessen Gefährten Ahusat und dessen Heerführer Pichol einen Eid geschworen hatte. An jenem Tag erkannte Isaak, dass er unter Zwang geschworen hatte, mit ihnen Frieden zu schließen.


    An jenem Tag verfluchte Isaak die Philister und sagte: »Verflucht seien die Philister mit Zorn und Grimm unter allen Völkern! Der HERR gebe sie der Schmach und dem Fluch, dem Zorn und dem Grimm preis, in die Hand sündiger Völker, in die Hand der Kittim. Und alle, die dem Schwert des Feindes und den Kittim entkommen, soll ein gerechtes Volk im Gericht[a] unter dem Himmel ausrotten. Denn sie werden auf der Erde von Generation zu Generation Feinde und Hasser meiner Kinder sein. Am Tag des Zorngerichts wird von ihnen weder ein Überlebender noch ein Entkommener übrig bleiben. Denn alle Nachkommen der Philister sind zur Vernichtung, zur Ausrottung und zur Vertilgung von der Erde bestimmt. Von diesen Kaftoritern wird auf der Erde kein Rest und kein Nachkomme mehr bleiben.


    Selbst wenn einer von ihnen zum Himmel hinaufsteigt, wird er von dort herabgebracht werden. Wenn er sich in die Erde versenkt, wird er von dort fortgeschleppt werden. Wenn er sich unter den Völkern verbirgt, wird er auch von dort ausgerottet werden. Wenn er ins Totenreich hinabsteigt, wird auch dort sein Gericht noch schwerer werden; selbst am Ort der Toten wird es für ihn keinen Frieden geben. Und wenn er in Gefangenschaft gerät, werden ihn diejenigen, die ihm nach dem Leben trachten, unterwegs töten. Weder Name noch Nachkommenschaft werden ihm auf der ganzen Erde bleiben, denn er wird in den ewigen Fluch eingehen.«


    So steht es über ihn auf den himmlischen Tafeln geschrieben und ist dort festgesetzt: Am Tag des Gerichts soll an ihm so gehandelt werden, dass er von der Erde ausgerottet wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Ausdruck »im Gericht« beruht auf der naheliegenden Berichtigung eines Schreibfehlers im überlieferten Text; möglich ist auch: »soll ein gerechtes Volk sie unter dem Himmel ausrotten«.'
    reason: Die Ge’ez-Ausgabe liest በዘነኔ, das wahrscheinlich für በኵነኔ, »im Gericht«, steht; die Textunsicherheit soll sichtbar bleiben.
lexical_decisions:
- source_word: ማየ፡ ሕይወ
  choice: lebendiges Wasser
  rationale: Die wörtliche und traditionsnahe Wiedergabe bewahrt die Bedeutung von fließendem beziehungsweise frischem Quellwasser, ohne sie im Haupttext einzuengen.
- source_word: ስፍሐ
  choice: Weiter Raum
  rationale: Der Brunnenname wird bedeutungsbezogen wiedergegeben und hält den anschließenden Wortanklang an Gottes Raumschaffen aufrecht.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Schwurbrunnen
  rationale: Die Zusammensetzung gibt Brunnen und Eid/Schwur wieder und bewahrt die Begründung der Ortsbenennung.
- source_word: ሲኦል
  choice: Totenreich
  rationale: Natürliches modernes Deutsch, das den antiken Aufenthaltsort der Toten wiedergibt, ohne spätere Vorstellungen von Hölle einzutragen.
- source_word: ክፍቶር
  choice: Kaftoriter
