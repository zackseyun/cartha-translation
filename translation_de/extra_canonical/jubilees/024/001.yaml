base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: de
  text: Und nach Abrahams Tod segnete Gott seinen Sohn Isaak. Isaak brach von Hebron auf, zog fort und ließ sich am Brunnen der Vision[a] nieder, im ersten Jahr der dritten Jahrwoche dieses Jubiläums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname ist aus dem Geez wörtlich als „Brunnen der Vision“ wiedergegeben. Wahrscheinlich entspricht er dem aus Genesis bekannten Ort; dessen längere traditionelle Namensform wird hier jedoch nicht in den Haupttext übernommen.
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Gott
  rationale: Das geezische ʾEgziʾabəḥer ist hier die gewöhnliche Gottesbezeichnung. „Gott“ gibt sie im modernen Deutschen natürlich wieder, ohne durch die Schreibweise „HERR“ unbelegt eine besondere Wiedergabe des hebräischen Gottesnamens anzudeuten.
- source_word: ወተንሥአ፡ እምኬብሮን
  choice: Isaak brach von Hebron auf
  rationale: Wörtlich steht „und er erhob sich von Hebron“. „Brach … auf“ gibt den idiomatischen Sinn einer Abreise wieder; „Isaak“ ersetzt das Pronomen, damit der Bezug nach dem vorangehenden Satz eindeutig und natürlich bleibt.
- source_word: ወኀደረ
  choice: und ließ sich … nieder
  rationale: Das Verb kann wohnen, bleiben oder lagern bezeichnen. Im Zusammenhang mit dem Ortswechsel ist „ließ sich nieder“ eine natürliche, inhaltlich offene Wiedergabe.
- source_word: ዐዘቅተ፡ ራእይ
  choice: Brunnen der Vision
  rationale: Der Ortsname wird entsprechend seinen geezischen Bestandteilen wörtlich wiedergegeben, ohne die längere, aus Genesis bekannte traditionelle Namensform in den Haupttext einzutragen.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet eine Siebenerperiode; im chronologischen System des Jubiläenbuchs ist „Jahrwoche“ die verständliche und präzise deutsche Bezeichnung.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung እግዚአብሔር
  choice: Gott
  alternative: der HERR
  rationale: Die Quelle enthält die übliche geezische Gottesbezeichnung und bietet an dieser Stelle keinen hinreichenden Grund, durch „HERR“ typografisch eine unmittelbare Entsprechung zum Tetragramm zu markieren.
- issue: Bezug des Subjekts beim Aufbruch aus Hebron
  choice: Isaak wird im zweiten Satz ausdrücklich genannt
  alternative: „Er brach von Hebron auf“
  rationale: Grammatisch verweist das geezische Pronomen auf Isaak. Die ausdrückliche Nennung bewahrt den Sinn und verhindert im Deutschen einen möglichen Rückbezug auf Gott, ohne eine theologische Mehrdeutigkeit zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende geezische Erzählungsausdruck wird knapp mit „Und nach …“ wiedergegeben. Die Zeitangabe folgt dem chronologischen Vokabular des Jubiläenbuchs; ein zusätzlicher Ausdruck „sieben Jahre“ wird nicht ergänzt, da er im vorliegenden Versschluss nicht als eigenständige Angabe belegt ist.
