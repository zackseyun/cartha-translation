  yaml_path: translation/extra_canonical/jubilees/024/008.yaml
  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: de
  text: Isaak war im zweiten Jahr dieser Jahrwoche[a] im Begriff, nach Ägypten hinabzuziehen, und er ging nach Gerar zu Abimelech, dem König der Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dieser Woche“. Gemeint ist eine aus sieben Jahren bestehende Jahrwoche.'
    reason: Die Fußnote bewahrt den Wortlaut des ge’ezischen Demonstrativausdrucks und erklärt zugleich die im Deutschen kontextgemäß gewählte Bezeichnung „Jahrwoche“.
lexical_decisions:
- source_word: ይረድ
  choice: war … im Begriff, … hinabzuziehen
  rationale: Die Imperfekt-/Jussivform bezeichnet hier eine beabsichtigte oder unmittelbar bevorstehende Bewegung, nicht eine vollendete Reise nach Ägypten. So bleibt erkennbar, dass Isaak Ägypten nicht erreichte.
- source_word: ግብጸ
  choice: nach Ägypten
  rationale: Das Richtungsziel wird im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: ዘዝ፡ ሱባዔ
  choice: dieser Jahrwoche
  rationale: Der Demonstrativausdruck bedeutet „dieser Woche“, nicht „der sechsten Woche“. „Jahrwoche“ verdeutlicht im chronologischen Zusammenhang, dass eine aus Jahren bestehende Siebenerperiode gemeint ist.
- source_word: ወሖረ
  choice: und er ging
  rationale: Die vollendete Verbform bezeichnet im Unterschied zum vorausgehenden ይረድ die tatsächlich ausgeführte Bewegung nach Gerar.
- source_word: ንጉሠ፡ ፍልስጥኤም
  choice: dem König der Philister
  rationale: Die ge’ezische Titelfügung wird in natürlicher deutscher Apposition wiedergegeben.
theological_decisions:
- issue: Isaaks beabsichtigte Reise nach Ägypten gegenüber seinem tatsächlichen Weg nach Gerar
  choice: Die erste Bewegung wird als unmittelbar bevorstehende Absicht, die zweite als vollzogene Handlung übersetzt.
  alternative: „Isaak zog nach Ägypten hinab“
  rationale: Die Alternative würde fälschlich behaupten, Isaak habe Ägypten erreicht, und den grammatischen Gegensatz zwischen der unvollendeten und der vollendeten Verbform verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Im Begriff sein“ gibt den bevorstehenden, aber nicht vollendeten Zug nach Ägypten präzise wieder; die Satzverknüpfung mit „und“ bewahrt die schlichte parataktische Struktur der Quelle.
