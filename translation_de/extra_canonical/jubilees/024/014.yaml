lexical_decisions:
- source_word: አልህምተ
  choice: Rinder
  rationale: Bezeichnet Vieh bzw. Rinder; im Zusammenhang einer Aufzählung verschiedener Tierarten ist „Rinder“ die natürliche deutsche Wiedergabe.
- source_word: አባግዐ
  choice: Schafe
  rationale: Die reguläre konkrete Bezeichnung für Schafe.
- source_word: አግማለ
  choice: Kamele
  rationale: Direkte Entsprechung der genannten Tierart.
- source_word: አእዱገ
  choice: Esel
  rationale: Direkte Entsprechung der genannten Tierart.
- source_word: ጥሪት ብዙኅ
  choice: großen Besitz
  rationale: ጥሪት bezeichnet Besitz, Vermögen oder Habe; „großen Besitz“ bewahrt den umfassenderen Sinn, statt ihn auf Vieh oder Reichtum im Geldsinn einzuengen.
- source_word: ወዘርአ በምድረ
  choice: Und er säte im Land
  rationale: Gibt Verb und Ortsangabe eng am ge'ezischen Wortlaut wieder; der am Versende offene Satzanschluss bleibt erhalten.
