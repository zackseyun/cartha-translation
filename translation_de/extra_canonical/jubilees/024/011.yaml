  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: de
  text: Durch deine Nachkommen werden alle Völker der Erde gesegnet,[a] weil dein Vater auf meine Stimme hörte, meine Weisung befolgte und meine Gebote, meine Gesetze, meine Satzungen und meinen Bund bewahrte.[b] Und nun höre auf meine Stimme und wohne in diesem Land!« Da wohnte er drei Jahrwochen lang in Gerar. Und Abimelech gab seinetwegen Befehl
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im überlieferten geez Text steht an dieser Stelle kein ausdrückliches Verb für »gesegnet werden«; es ist aus dem Zusammenhang der Verheißung ergänzt. Auch möglich: »Durch deine Nachkommen werden sich alle Völker der Erde Segen wünschen.«'
    reason: textual_and_semantic_ambiguity
  - marker: b
    text: Die rechtliche Aufzählung ist sprachlich dicht und teilweise überlappend. Alle fünf Ausdrücke des Ausgangstextes werden hier einzeln wiedergegeben, statt sie unter einem Sammelbegriff wie »Gesetze« zusammenzufassen.
    reason: segmentation_note
lexical_decisions:
- source_word: በዘርእከ
  choice: Durch deine Nachkommen
  rationale: Das kollektive »Same« wird im modernen Deutschen natürlich als »Nachkommen« wiedergegeben; die instrumentale Präposition በ- bleibt durch »durch« erkennbar.
- source_word: አሕዛበ ምድር
  choice: Völker der Erde
  rationale: አሕዛብ bezeichnet hier die Völker beziehungsweise Nationen; »Völker« entspricht dem biblischen Register und ist allgemein verständlich.
- source_word: ሰምዐ ... ቃለ ዚአየ
  choice: hörte auf meine Stimme
  rationale: Die feste Wendung bezeichnet Gehorsam, bewahrt aber das konkrete Bild des Hörens.
- source_word: ዑቃቤየ
  choice: meinen Auftrag
  rationale: Der Ausdruck bezeichnet etwas zur Beachtung oder Bewahrung Anvertrautes. »Auftrag« hält ihn von den anschließenden Geboten, Gesetzen und Satzungen unterscheidbar.
- source_word: ትእዛዛትየ / ሕገጊየ / ሥርዐትየ / ኪዳንየ
  choice: meine Gebote / meine Gesetze / meine Satzungen / meinen Bund
  rationale: Die fünfgliedrige Rechts- und Bundessprache des Ausgangstextes wird nicht zu einem Sammelbegriff eingeebnet.
- source_word: ሠለስተ ሱባዔ ዓመት
  choice: drei Jahrwochen lang
  rationale: Eine Jahrwoche ist ein Zeitraum von sieben Jahren. Die quellensprachliche Zählweise bleibt sichtbar, statt stillschweigend in 21 Jahre umgerechnet zu werden.
- source_word: በእንቲአሁ
  choice: seinetwegen
  rationale: Die Präpositionalfügung bedeutet »um seinetwillen / ihn betreffend«; »seinetwegen« lässt den im nächsten Vers folgenden Inhalt des Befehls offen.
theological_decisions:
- issue: Nicht ausdrücklich vorhandenes Segensverb nach »durch deine Nachkommen«
  choice: werden ... gesegnet werden
  alternative: werden sich ... Segen wünschen / der Satz bleibt ohne ergänztes Prädikat
  rationale: Der überlieferte geez Text setzt nach der Segensformel unmittelbar mit »weil« fort und enthält hier kein ausdrückliches Segensverb. Der Kontext und die zugrunde liegende Verheißungstradition verlangen jedoch ein Prädikat. Die passive Wiedergabe ist theologisch zurückhaltend und wird durch eine textkritische Fußnote kenntlich gemacht.
- issue: Rechtsbegriffe in der Gehorsamsaussage
  choice: alle fünf Begriffe einzeln wiedergeben
  alternative: die Reihe zusammenfassend als »meine Gesetze« wiedergeben
  rationale: Die dichte, teilweise überlappende Reihe ist Bestandteil der Aussage über den Gehorsam des Vaters. Eine Zusammenfassung würde eine möglicherweise bedeutsame Abstufung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischer, aber verständlicher Wendung »auf meine Stimme hören«. Die direkte Rede wird vor dem Erzählerwechsel geschlossen. Der letzte Satz bleibt wie der vorgelegte Vers unabgeschlossen, da der Inhalt von Abimelechs Befehl im folgenden Vers fortgesetzt wird.
