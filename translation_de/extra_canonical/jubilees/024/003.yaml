base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: de
  text: 'Und Jakob kochte einen Linseneintopf. Als Esau hungrig vom Feld kam, sagte er zu seinem Bruder Jakob: »Gib mir etwas von diesem Weizeneintopf![a]« Jakob erwiderte: »Verkaufe mir dein Erstgeburtsrecht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von diesem gekochten Weizengericht«. Obwohl zuvor ein Linseneintopf genannt wird, steht hier im ge’ezischen Text »Weizen« beziehungsweise »Getreide«.'
    reason: Bewahrt und erläutert die auffällige lexikalische Abweichung der überlieferten Vorlage.
lexical_decisions:
- source_word: ተብሰለ፡ ብርስን
  choice: kochte einen Linseneintopf
  rationale: Die Wortgruppe bezeichnet ausdrücklich ein gekochtes Gericht aus Linsen; »Linseneintopf« ist im modernen Deutschen natürlich und präzise.
- source_word: ተብሰል፡ ዘሥርናይ
  choice: Weizeneintopf
  rationale: Der überlieferte ge’ezische Text nennt in Esaus Bitte ausdrücklich ein Gericht aus Weizen beziehungsweise Getreide. Diese auffällige Abweichung vom zuvor genannten Linsengericht wird nicht harmonisiert.
- source_word: ርኁብ
  choice: hungrig
  rationale: Gibt Esaus körperlichen Zustand direkt und idiomatisch wieder.
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: dein Erstgeburtsrecht
  rationale: Die Wendung verweist auf den Vorrang beziehungsweise Rechtsanspruch aufgrund der ersten Geburt; das etablierte deutsche Wort »Erstgeburtsrecht« bewahrt diesen Sinn, ohne »zuerst« fälschlich als Zeitadverb zu verstehen.
theological_decisions:
- issue: Bezeichnung des von Esau zu verkaufenden Rechts
  choice: Erstgeburtsrecht
  alternative: Vorrang des Erstgeborenen / Erstgeborenenanteil
  rationale: »Erstgeburtsrecht« deckt Status und Anspruch des Erstgeborenen ab, ohne den Text auf einen bloßen Erbanteil einzuengen.
- issue: Unterschied zwischen Linsen- und Weizengericht
  choice: Die überlieferte Spannung bleibt im Haupttext erhalten.
  alternative: Esaus Bitte an das zuvor erwähnte Linsengericht angleichen.
  rationale: Die ge’ezische Vorlage nennt zunächst Linsen, danach aber Weizen beziehungsweise Getreide. Eine Harmonisierung würde eine echte textliche Auffälligkeit beseitigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die auffällige Differenz zwischen Linsen- und Weizengericht bleibt entsprechend der Vorlage sichtbar.
