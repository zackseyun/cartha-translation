  source_fidelity: Die Übersetzung trifft Brot, das Linsengericht und Esaus innere Rede grundsätzlich. Das partitive „von diesem Linsengericht“ fügt jedoch gegenüber dem ge’ezischen direkten Objekt eine nicht erforderliche Einschränkung („etwas davon“) hinzu; die englische Audit-Fassung hat dieselbe Ergänzung ausdrücklich entfernt.
  naturalness: „Esau sagte in seinem Herzen“ ist im modernen Deutschen wenig idiomatisch. „Esau sagte bei sich“ gibt die innere Rede natürlich und ohne Bedeutungsverschiebung wieder. Der offene Satzabschluss mit Semikolon ist beizubehalten.
  terminology: „Brot“ und „Linsengericht“ sind treffend. „Dieses Linsengericht“ wahrt den demonstrativen Bezug der Vorlage, ohne einen partitiven Zusatz einzutragen. „Ich werde sterben“ bewahrt die knappe, nicht weiter ausgedeutete Aussage.
