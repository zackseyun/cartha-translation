translation:
  language: de
  text: '»Und ich werde dir Brot und auch dieses Linsengericht geben.« Und Esau sagte bei sich: »Ich werde sterben;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: Brot
  rationale: Das Substantiv bezeichnet Brot und wird im Deutschen direkt und natürlich wiedergegeben.
- source_word: ብርስን
  choice: Linsengericht
  rationale: Das Wort bezeichnet Linsen; im Zusammenhang mit dem gekochten Essen ist „Linsengericht“ idiomatischer als das bloße „Linsen“.
- source_word: እመውት
  choice: Ich werde sterben
  rationale: Die Form wird möglichst direkt als Aussage über den bevorstehenden Tod wiedergegeben, ohne die stärkere zeitliche Zuspitzung „ich bin im Begriff zu sterben“ einzutragen.
theological_decisions:
- issue: Esaus innere Aussage über seinen Tod
  choice: „Ich werde sterben“
  alternative: „Ich bin im Begriff zu sterben“
  rationale: Die knappe Aussage bewahrt die mögliche Spannung zwischen tatsächlicher Todesnähe und rhetorischer Übertreibung, ohne sie interpretierend aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers bleibt entsprechend der Vorlage mit einem Semikolon offen, da der Satz im folgenden Vers weitergeht. „Von diesem Linsengericht“ gibt die partitive Bedeutung natürlich wieder.
