  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: de
  text: 'Und der HERR erschien ihm und sagte zu ihm: »Zieh nicht nach Ägypten hinab. Wohne in dem Land, das ich dir nennen werde, und halte dich als Fremder in diesem Land auf. Ich werde mit dir sein und dich segnen; denn dir …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte Ausgangstext bricht hier nach »denn dir« ab.
    reason: Kennzeichnet transparent die Unvollständigkeit der bereitgestellten Textgrundlage, ohne fehlenden Text aus anderen Überlieferungen zu ergänzen.
lexical_decisions:
- source_word: አስተርአዮ
  choice: erschien ihm
  rationale: Gibt die Erscheinung Gottes natürlich und quellennah wieder.
- source_word: ኢትረድ፡ ግብጸ
  choice: Zieh nicht nach Ägypten hinab
  rationale: Bewahrt die im äthiopischen Text ausdrücklich formulierte Abwärtsbewegung.
- source_word: ንበር
  choice: Bleib
  rationale: Drückt das Wohnen bzw. Verweilen im angewiesenen Land in natürlichem modernem Deutsch aus.
- source_word: ፍልስ
  choice: halte dich als Fremder … auf
  rationale: Bewahrt gegenüber dem vorausgehenden Bleiben den besonderen Sinn eines zeitweiligen Aufenthalts als Fremder.
- source_word: እሄሉ፡ ምስሌከ
  choice: Ich werde mit dir sein
  rationale: Formale und idiomatische Wiedergabe der göttlichen Beistandszusage.
- source_word: እባርከከ
  choice: dich segnen
  rationale: Entspricht unmittelbar dem Segensverb der Quelle.
theological_decisions:
- issue: Gottesname እግዚአብሔር
  choice: der HERR
  alternative: der Herr
  rationale: Die etablierte deutsche Bibelkonvention kennzeichnet den Gottesnamen bzw. die entsprechende traditionelle Gottesbezeichnung, ohne zusätzliche Deutung einzuführen.
- issue: Status des Aufenthalts im Land
  choice: als Fremder … aufhalten
  alternative: wohnen / bleiben
  rationale: Die zweite Aufenthaltsanweisung wird lexikalisch von der ersten unterschieden; so bleibt die Spannung zwischen Bleiben und Fremdlingschaft erhalten.
- issue: Unvollständiger Versschluss
  choice: Abbruch mit Auslassungszeichen und Fußnote
  alternative: Ergänzung aus einer anderen Textüberlieferung oder aus Genesis 26
  rationale: Der bereitgestellte ge’ezsprachige Ausgangstext endet bei »denn dir«; fehlender Inhalt wird nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und bibelnah; »als Fremder aufhalten« wahrt den lexikalischen Unterschied zwischen den beiden Aufenthaltsverben. Der fragmentarische Schluss wird nicht ergänzt.
