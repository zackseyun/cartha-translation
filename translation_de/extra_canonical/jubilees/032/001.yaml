base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: de
  text: 'Und Juda sah[a] und freute sich. Er pries den Gott seiner Väter, Abrahams und Isaaks, und sagte: »Nun weiß ich, dass ich und auch meine Kinder vor dem Gott des Alls eine ewige Hoffnung haben. So ist es für die beiden bestimmt, und es wird ihnen als ewiges Zeugnis auf den himmlischen Tafeln eingetragen werden, so wie Isaak sie gesegnet hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und Juda freute sich.« Der überlieferte Text ist an dieser Stelle offenbar fehlerhaft; andere Textzeugen beziehungsweise Rekonstruktionen stützen »sah«.'
    reason: Die vorgelegte Ge’ez-Zeile scheint am Versanfang eine Abschreib- oder Druckverderbnis aufzuweisen. Die revidierte Lesart »sah und freute sich« ist quellenkritisch gestützt, doch die kürzere Wiedergabe wird als Alternative dokumentiert.
lexical_decisions:
- source_word: ባረኮ
  choice: pries
  rationale: Das Verb bedeutet wörtlich »segnete«. Im Deutschen ist bei einem Menschen als Handelndem und Gott als Objekt »pries« die natürliche und sachlich passende Wiedergabe.
- source_word: ተስፋ፡ ዘለዓለም
  choice: eine ewige Hoffnung
  rationale: Bewahrt die direkte Nominalfügung und ihre eschatologische Offenheit, ohne den Inhalt der Hoffnung näher festzulegen.
- source_word: አምላከ፡ ኵሉ
  choice: der Gott des Alls
  rationale: Gibt die umfassende Formulierung des Ge’ez wieder, ohne sie enger als »Gott aller Menschen« auszulegen.
- source_word: ሥሩዕ
  choice: bestimmt
  rationale: Vermittelt die Bedeutung »festgesetzt/geordnet«, ohne eine bestimmte Vorstellung göttlicher Vorherbestimmung einzutragen.
- source_word: ውስተ፡ ጽላተ፡ ሰማይ
  choice: auf den himmlischen Tafeln
  rationale: Natürliche deutsche Wiedergabe des apokalyptischen Bildes; der Plural »Tafeln« bleibt erhalten.
theological_decisions:
- issue: Bezug der ewigen Hoffnung
  choice: »dass ich und auch meine Kinder … eine ewige Hoffnung haben«
  alternative: »dass für mich und auch für meine Kinder … eine ewige Hoffnung besteht«
  rationale: Die gewählte Form ist im Deutschen flüssiger und wahrt, dass sowohl Juda als auch seine Nachkommen an dieser Hoffnung Anteil haben.
- issue: Identität der »beiden« und von »sie«
  choice: Die Pronomen bleiben unaufgelöst.
  alternative: Die beiden ausdrücklich als Judas Söhne benennen.
  rationale: Der Vers selbst nennt die Bezugsgrößen nicht ausdrücklich. Eine Auflösung würde Kontextwissen in den Wortlaut eintragen und die echte pronominale Offenheit beseitigen.
- issue: Eintragung als ewiges Zeugnis
  choice: »es wird ihnen als ewiges Zeugnis … eingetragen werden«
  alternative: »sie werden ihnen als ewiges Zeugnis … hinaufsteigen«
  rationale: Die wörtliche Bewegungsbedeutung des Verbs ergibt im Zusammenhang mit den himmlischen Tafeln idiomatisch den Sinn einer bleibenden Eintragung. Die unpersönliche Form vermeidet zugleich eine unnötig genaue Festlegung des grammatischen Bezugs.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Pries« vermeidet die im heutigen Deutsch missverständliche Aussage, ein Mensch habe Gott Segen erteilt. Die pronominalen Bezüge bleiben entsprechend der Quelle offen.
