base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: de
  text: Und er kam in das Land Efrata und blieb dort. In der Nacht gebar Rahel einen Sohn. Sie gab ihm den Namen »Sohn meines Schmerzes«, weil sie bei der Geburt litt; sein Vater aber gab ihm den Namen Benjamin. Das geschah am elften Tag des achten Monats, im ersten Jahr der sechsten Jahrwoche dieses Jubiläums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ከብራታን
  choice: das Land Efrata
  rationale: Der geäzische Ortsausdruck entspricht dem in der Überlieferung als Efrata bekannten Namen; »Land« gibt ምድር wieder. Die Namensform wird in geläufiger deutscher Bibelschreibung wiedergegeben.
- source_word: ወኀደረ ህየ
  choice: und blieb dort
  rationale: Das Verb kann das Verweilen oder Übernachten bezeichnen. Im Zusammenhang ist das allgemeinere »blieb dort« natürlich und wahrt den zeitlichen Ablauf.
- source_word: ወልደ ሕማምየ
  choice: Sohn meines Schmerzes
  rationale: Die geäzische Namensdeutung wird transparent und nah am Wortlaut wiedergegeben, statt sie stillschweigend durch die hebräische Form Ben-Oni zu ersetzen.
- source_word: ዐጸበታ ሶበ ትወልድ
  choice: weil sie bei der Geburt litt
  rationale: Gibt Ursache und Geburtsnot idiomatisch wieder, ohne die Intensität näher zu bestimmen, als es der Text erlaubt.
- source_word: ብንያም
  choice: Benjamin
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: አመ ዐሡሩ ወአሚሩ ለወርኀ ሳምን
  choice: am elften Tag des achten Monats
  rationale: Die Datumsformel bezeichnet den elften Tag im achten Monat; »Tag« wird im Deutschen zur eindeutigen und natürlichen Wiedergabe ergänzt.
- source_word: በዓመት አሐዱ ዘሱባዔ ሳድስ ዘዝንቱ ኢዮቤልው
  choice: im ersten Jahr der sechsten Jahrwoche dieses Jubiläums
  rationale: Gibt das jubiläische Zeitschema präzise wieder; »Jahrwoche« ist für eine Siebenjahresperiode verständlicher als das bloße »Woche«.
theological_decisions:
- issue: Bedeutung des von Rahel gegebenen Namens
  choice: »Sohn meines Schmerzes« als ausdrückliche Namensgebung
  alternative: Ben-Oni als unübersetzter Eigenname
  rationale: Der geäzische Text bietet eine verständliche Bedeutungsphrase. Die Übersetzung bewahrt diese Aussage, ohne eine darüber hinausgehende Deutung einzutragen.
- issue: Bedeutung des Namens Benjamin
  choice: Der Name bleibt ohne erklärende Übersetzung
  alternative: Ergänzung einer Deutung wie »Sohn der rechten Hand«
  rationale: Der Vers nennt keine Bedeutung von Benjamin. Eine Erklärung würde zusätzliche Tradition in den Haupttext eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählfolge. Die wiederholten geäzischen Satzanschlüsse mit »und« werden teilweise beibehalten, teilweise durch deutsche Satzgliederung geglättet. Keine konfessionellen oder auslegenden Zusätze.
