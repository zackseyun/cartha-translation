  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: de
  text: aufgrund des Gebets, das er gebetet hatte, den Zehnten zusammen mit ihren Schlachtopfern und ihren Trankopfern darzubringen. Als das Feuer es verzehrt hatte,[a] verbrannte er darauf im Feuer Weihrauch. Und als Opfer der Rettung[b] brachte er zwei Rinder, vier Widder, vier Schafe, vier Ziegenböcke und vier einjährige Schafe dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Als das Feuer es verzehrt hatte.“ Was mit „es“ gemeint ist, wird hier nicht ausdrücklich genannt.'
    reason: Bewahrt das im Ausgangstext unbestimmte Bezugswort und verhindert die unbelegte Ergänzung „Brandopfer“.
  - marker: b
    text: 'Oder: „Heilsopfer“; auch „Opfer zur Rettung“.'
    reason: መድኃኒት kann Heil, Rettung oder Befreiung bezeichnen; die Wiedergabe bleibt bewusst offen.
lexical_decisions:
- source_word: የዐሥር
  choice: den Zehnten darbringen
  rationale: Das Verb bezeichnet das Verzehnten beziehungsweise Geben des Zehnten; „darbringen“ passt hier zum Opferkontext.
- source_word: መሥዋዕተሙ፡ ወጥዓሕቶሙ
  choice: ihren Schlachtopfern und ihren Trankopfern
  rationale: Die Pluralsuffixe -omu sind als „ihren“ wiedergegeben; die beiden Opferbegriffe bleiben unterschieden.
- source_word: የዐጥን፡ ስኂነ
  choice: verbrannte … Weihrauch
  rationale: Die ausdrücklich bezeugte Räucherklausel wird vollständig wiedergegeben; ስኂነ bezeichnet hier Weihrauch.
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: Heilsopfer
  rationale: Die kompakte deutsche Wiedergabe bewahrt den Sinnbereich von Heil, Rettung und Befreiung, ohne ihn auf eine bestimmte kultische Kategorie einzuengen.
- source_word: አባወረ፡ ክልኤተ
  choice: zwei Rinder
  rationale: Der Tierbegriff wird allgemein als Rinder wiedergegeben; eine unnötig enge Geschlechtsbestimmung wird vermieden.
- source_word: ይቤላት፡ አርባዕተ
  choice: vier Ziegenböcke
  rationale: አርባዕተ bedeutet ausdrücklich „vier“; die nachfolgende editorische Fußnotenziffer ፭ darf nicht als Mengenangabe gelesen werden.
theological_decisions:
- issue: Bedeutung von መድኃኒት in der Opferbezeichnung
  choice: Heilsopfer
  alternative: Rettungsopfer / Opfer zur Rettung
  rationale: „Heilsopfer“ ist würdig und knapp und lässt die Spannung zwischen Rettung, Befreiung und Heil bestehen; eine konfessionell festgelegte Deutung wird vermieden.
- issue: Unbestimmtes Bezugswort des Objekts nach dem Verzehren durch das Feuer
  choice: „es“ ohne ergänztes Substantiv
  alternative: „das Brandopfer“
  rationale: Der ge'ezische Text nennt an dieser Stelle kein ausdrückliches Substantiv. Die Ergänzung „Brandopfer“ würde die genuine Unbestimmtheit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche syntaktische Eröffnung bleibt als Anschluss an den vorausgehenden Kontext erhalten. Kultische Begriffe werden verständlich, aber nicht paraphrasierend oder konfessionell verengt wiedergegeben.
