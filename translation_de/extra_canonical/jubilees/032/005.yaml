base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/005.yaml
  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: de
  text: aus dem Land Gilead. Jakob verbarg vor Laban, was er im Herzen hatte,[a] und sagte es ihm nicht. In der vierten Woche, im siebten Jahr, wandte sich Jakob am einundzwanzigsten Tag des ersten Monats nach Gilead. Laban verfolgte ihn und holte Jakob am dreizehnten Tag des dritten Monats am Berg Gilead ein. Doch der HERR ließ nicht zu, dass er Jakob etwas antat; denn er erschien ihm nachts im Traum, und Laban erzählte Jakob davon.[b] Am fünfzehnten Tag jener Tage veranstaltete Jakob ein Festmahl für Laban und alle, die mit ihm gekommen waren. An jenem Tag schwor Jakob Laban einen Eid, und auch Laban schwor Jakob, keiner von ihnen werde in böser Absicht zum anderen hinüberziehen, am Berg,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Jakob verbarg sein Herz vor Laban«.'
    reason: Die Fußnote bewahrt die konkrete Bildsprache des Ausgangstextes, während der Haupttext den Sinn im Deutschen verständlich ausdrückt.
  - marker: b
    text: 'Wörtlich: »und Laban erzählte Jakob«; was er ihm erzählte, wird nicht ausdrücklich genannt.'
    reason: Der Ausgangstext lässt das Objekt des Erzählens unausgesprochen; die deutsche Ergänzung »davon« stellt nur den Zusammenhang her.
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: Jakob verbarg vor Laban, was er im Herzen hatte
  rationale: Bewahrt das Bild des »Herzens«, gibt die geʿezische Wendung aber in verständlichem, natürlichem Deutsch wieder.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: wandte sich Jakob … nach Gilead
  rationale: Die Richtungsendung an »Gilead« bezeichnet eine Bewegung nach bzw. in Richtung Gilead, nicht ein Fortgehen von dort.
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: am einundzwanzigsten Tag des ersten Monats
  rationale: Die Zeitangabe nennt den ersten Monat und den einundzwanzigsten Tag.
- source_word: በወርኅ፡ ሣልስ፡ አመ፡ ዐሡሩ፡ ወሠሉሱ
  choice: am dreizehnten Tag des dritten Monats
  rationale: Geʿez አመ führt hier die Tagesangabe ein; »dreizehntes Jahr« wäre grammatisch und chronologisch unbegründet.
- source_word: ይሕክም፡ ላዕለ፡ ያዕቆብ
  choice: Jakob etwas antat
  rationale: Gibt die beabsichtigte schädigende Handlung idiomatisch wieder, ohne eine speziellere Form des Schadens festzulegen.
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ
  choice: veranstaltete Jakob ein Festmahl
  rationale: ግዝአ bezeichnet in diesem Zusammenhang ein Mahl beziehungsweise Festmahl.
- source_word: በእኩይ
  choice: in böser Absicht
  rationale: Gibt die adverbiale Bedeutung »zum Bösen / mit Bösem« natürlich wieder.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: der HERR
  alternative: Gott / der Herr
  rationale: Die traditionelle deutsche Wiedergabe passt zur göttlichen Bezeichnung im erzählerischen Kontext, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Subjekt und Bezug in der Traumerzählung
  choice: Gott erschien Laban; Laban erzählte Jakob davon
  alternative: Gott sprach zu Laban über Jakob
  rationale: Die geʿezische Syntax nennt Laban ausdrücklich als Subjekt von »erzählte« und Jakob als Empfänger. »Davon« lässt den nicht näher ausgeführten Inhalt seiner Mitteilung offen und vermeidet eine Harmonisierung mit Genesis 31,24.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte geʿezische Satzfolge wurde behutsam in kürzere deutsche Sätze gegliedert. Der Schluss bleibt bewusst als unvollständiger Anschluss »am Berg,« stehen, weil der überlieferte Vers an dieser Stelle in den folgenden Text weiterführt.
