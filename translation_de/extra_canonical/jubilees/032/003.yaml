base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: de
  text: In jenen Tagen wurde Rahel mit Benjamin schwanger. Jakob zählte seine Söhne von ihm aus,[a] und Levi fiel dem HERRN als Anteil zu; sein Vater kleidete ihn ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihm aus“, das heißt von Benjamin aus. Die Formulierung bezeichnet den Ausgangspunkt der Zählung; ihre Richtung wird nicht ausdrücklich genannt.'
    reason: Die pronominale Wendung እምኔሁ ist für die Zähllogik wesentlich, bleibt hinsichtlich der genauen Richtung aber knapp.
lexical_decisions:
- source_word: ፀንሰት (ṣansat)
  choice: wurde … schwanger
  rationale: Gibt den Eintritt der Schwangerschaft in natürlichem modernem Deutsch wieder.
- source_word: ውሉዶ (wəludo)
  choice: seine Söhne
  rationale: Im Zusammenhang der Zählung von Jakobs männlichen Nachkommen ist „Söhne“ präziser und idiomatischer als das allgemeinere „Kinder“ oder „Nachkommen“.
- source_word: እምኔሁ (ʾəmnehu)
  choice: bei ihm beginnend
  rationale: Bewahrt den für die Zähllogik entscheidenden Ausgangspunkt Benjamin, ohne die im Ausgangstext nicht ausdrücklich bezeichnete Zählrichtung in den Haupttext einzutragen.
- source_word: ዐርገ (ʿarga)
  choice: kam … heraus
  rationale: Das wörtliche „stieg hinauf“ wäre hier im Deutschen missverständlich; „kam heraus“ passt zur durch Zählung erfolgenden Bestimmung Levis, ohne ausdrücklich ein Losverfahren zu behaupten.
- source_word: በመክፈሊተ እግዚአብሔር (ba-makfalt(a) ʾəgziʾabəḥer)
  choice: als Anteil des HERRN
  rationale: Gibt die Zugehörigkeit Levis zum göttlichen Anteil klar wieder; die Wiedergabe des Gottesnamens als „HERR“ entspricht dem würdigen Bibelregister.
- source_word: አልበሱ (ʾalbasa)
  choice: kleidete ihn ein
  rationale: Bewahrt die konkrete Handlung des Bekleidens und lässt ihre mögliche kultische Bedeutung unausgelegt.
theological_decisions:
- issue: Levis Bestimmung als göttlicher Anteil
  choice: Levi kam als Anteil des HERRN heraus
  alternative: Levi fiel dem HERRN als Anteil zu
  rationale: Die gewählte Fassung bewahrt das Bild des Ergebnisses einer Zählung und vermeidet, ein ausdrücklich durch Lose entschiedenes Verfahren oder eine stärker ausgelegte Eigentumsformel einzutragen.
- issue: Mögliche priesterliche Bedeutung der Bekleidung
  choice: sein Vater kleidete ihn ein
  alternative: sein Vater legte ihm die priesterlichen Gewänder an
  rationale: Der Ausgangstext nennt lediglich das Bekleiden. Eine ausdrückliche Bestimmung der Kleidung als priesterlich würde die theologische Deutung vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten den erzählerischen Rhythmus; kultische Zusammenhänge werden nicht über den Wortlaut hinaus ausgedeutet.
