  source_fidelity: Der Entwurf gibt Tod, Bestattung in Efrata/Bethlehem und Jakobs Errichtung eines Grabmals zuverlässig wieder. Die doppelte räumliche Bestimmung des ge'ezischen Satzes (am Weg / über ihrer Grabstätte) sollte jedoch syntaktisch klarer und ohne die missverständliche Bedeutung von „oberhalb“ wiedergegeben werden.
  naturalness: „Oberhalb ihrer Grabstätte“ klingt im Deutschen nach einer Lage auf einer Anhöhe und ist neben „über Rahels Grab“ unnötig doppelt. Eine Umstellung erhält beide Angaben und ist flüssiger.
  terminology: „Rahel“, „Efrata“, „Bethlehem“ und „Gedenkstein“ sind angemessen. „Gedenkstein“ ist eine natürliche Wiedergabe für das hier gemeinte aufgerichtete Erinnerungs- bzw. Grabmal.
