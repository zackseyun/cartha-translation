base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: de
  text: Und Rahel starb dort und wurde im Land Efrata begraben, das heißt Bethlehem. Jakob errichtete an Rahels Grab am Weg einen Gedenkstein über ihrer Grabstätte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐውልተ
  choice: Gedenkstein
  rationale: Das Wort bezeichnet hier ein aufgerichtetes Grabmal bzw. einen Stein als Erinnerungszeichen; „Gedenkstein“ ist im modernen Deutschen natürlich und bewahrt diese Funktion.
- source_word: ፍኖት
  choice: am Weg
  rationale: Gibt die Ortsangabe knapp und idiomatisch wieder, ohne einen bestimmten Straßentyp vorauszusetzen.
- source_word: መቃብር / መቃብሪሃ
  choice: Grab / Grabstätte
  rationale: Die leichte Variation vermeidet unbeholfene Wiederholung und erhält zugleich beide Grabbezüge des Ausgangstextes.
