- from: Und Rahel starb dort und wurde im Land Efrata begraben, das ist Bethlehem. Jakob errichtete am Weg über Rahels Grab einen Gedenkstein, oberhalb ihrer Grabstätte.
  to: Und Rahel starb dort und wurde im Land Efrata begraben, das heißt Bethlehem. Jakob errichtete an Rahels Grab am Weg einen Gedenkstein über ihrer Grabstätte.
