  yaml_path: translation/extra_canonical/jubilees/032/021.yaml
  text: And he went up into heaven[21]. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his children through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make it an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father, and dwell with Isaac your father until the day of your father's death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will make you remember everything."
    And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen[21]. And there he celebrated one additional day, and he observed it according to all that they sacrifice in former days, and he called its name Addition, because that day had been added, and they had formerly called them a feast. And thus he showed that it should be so, and it is written on the heavenly tablets concerning this, that it was revealed to him that he should observe it and add it to the seven days of the feast. And its name was called Addition, because it is added to the feast days according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah's nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place Deborah's River, and the oak, the Oak of the Mourning of Deborah. And Rebekah went and entered her house
    to Isaac her father, and Jacob sent by her hand rams and sheep, that she might bring them to his father's house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his possessions and crossed the river and arrived.
translation:
  language: de
  text: 'Und er stieg zum Himmel hinauf. In einem nächtlichen Gesicht sah er: Siehe, ein Engel stieg vom Himmel herab und hielt Tafeln in seinen Händen. Er gab sie Jakob; der las sie und erfuhr alles, was darauf geschrieben stand und was ihm und seinen Nachkommen in allen Zeitaltern widerfahren würde. Der Engel zeigte ihm alles, was auf den Tafeln geschrieben stand, und sagte zu ihm: »Bebaue diesen Ort nicht und mache ihn nicht zu einem ewigen Heiligtum. Bleibe auch nicht hier, denn dies ist nicht der Ort. Geh zum Haus Abrahams, deines Vaters, und wohne bei deinem Vater Isaak bis zum Tag, an dem dein Vater stirbt. Denn in Ägypten wirst du in Frieden sterben, und in diesem Land wirst du ehrenvoll im Grab deiner Vorfahren bestattet werden, bei Abraham und Isaak. Fürchte dich nicht! Denn alles wird so geschehen, wie du es gesehen und gelesen hast. Schreibe auch du alles auf, wie du es gesehen und gelesen hast.«


    Jakob sagte: »Herr, wie soll ich mich an alles erinnern, was ich gelesen und gesehen habe?« Er antwortete ihm: »Ich werde dich an alles erinnern.« Dann stieg er von ihm hinauf. Jakob erwachte aus seinem Schlaf und erinnerte sich an alles, was er gelesen und gesehen hatte. Er schrieb alle Dinge auf, die er gelesen und gesehen hatte.


    Dort feierte er noch einen zusätzlichen Tag. Er beging ihn entsprechend all dem, was man in den früheren Tagen opferte, und nannte ihn »Hinzufügung«, weil dieser Tag hinzugefügt worden war; die früheren Tage hatte man »Fest« genannt.[a] So zeigte er, dass es sein sollte; und auf den himmlischen Tafeln steht darüber geschrieben, dass es ihm offenbart wurde, damit er diesen Tag begehe und ihn den sieben Festtagen hinzufüge. Man nannte ihn »Hinzufügung«, weil er den Festtagen entsprechend der Zahl der Tage des Jahres hinzugefügt wird.


    In der Nacht des dreizehnten Tages dieses Monats starb Debora, Rebekkas Amme. Man begrub sie unterhalb der Stadt, unter der Eiche am Fluss. Diesen Ort nannte man »Deboras Fluss« und die Eiche »Eiche der Trauer um Debora«.[b]


    Rebekka ging zurück in ihr Haus zu Isaak, ihrem Vater. Jakob sandte durch ihre Hand Widder und Schafe, damit sie sie zum Haus seines Vaters bringe. Er sagte zu ihr: »Lasst uns an jeden Ort gehen, aber ich werde nicht mit dir gehen.«[c] Jakob pries den Gott seines Vaters Isaak und den Gott Abrahams, des Vaters seines Vaters. Dann machte er sich auf, belud seine Frauen und seine Kinder, nahm seinen ganzen Besitz mit, überquerte den Fluss und kam an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Hinzufügung« bezeichnet einen angefügten Tag. Gemeint ist ein zusätzlicher Tag nach den sieben Tagen des Festes. Die genaue Syntax des letzten Teils des Satzes ist unsicher.
    reason: cultural_note
  - marker: b
    text: Der Ausdruck für den Namen der Eiche ist in der ge'ezischen Überlieferung offenbar beschädigt. Wahrscheinlich ist »Eiche der Trauer um Debora« beziehungsweise »Eiche des Weinens um Debora« gemeint.
    reason: textual_variant
  - marker: c
    text: Die überlieferten Sätze über Rebekkas Rückkehr und Jakobs Anweisung sind grammatisch gestört; auch Personenbezüge und Pronomen stimmen teilweise nicht überein. Die auffällige Aussage »ich werde nicht mit dir gehen« folgt dem überlieferten Wortlaut und wird nicht frei harmonisiert.
    reason: textual_variant
lexical_decisions:
- source_word: ተውሳክ
  choice: Hinzufügung
  rationale: Das Wort bezeichnet etwas Hinzugefügtes beziehungsweise einen Nachtrag; der Text erklärt den Namen ausdrücklich durch den zusätzlichen Festtag.
- source_word: ይሠውዑ
  choice: opferte
  rationale: Das Verb bezeichnet konkret das Darbringen eines Opfers und darf nicht zu einem allgemeinen »tun« abgeschwächt werden.
- source_word: መቅደሰ፡ ዘለዓለም
  choice: ewiges Heiligtum
  rationale: Die formale Wiedergabe bewahrt sowohl den kultischen Begriff als auch die zeitliche Bestimmung.
- source_word: በላኖነ፡ ኀሐ፡ ዲቦራ
  choice: Eiche der Trauer um Debora
  rationale: Die überlieferte Form ist offenbar beschädigt, bewahrt aber den Sinn »Trauer/Weinen« und entspricht der Benennung des Ortes in Gen 35,8.
theological_decisions:
- issue: Abrahams Bezeichnung als Jakobs Vater
  choice: Abraham, deines Vaters
  alternative: Abraham, der Vater deines Vaters
  rationale: Der ge'ezische Text sagt ausdrücklich »Abraham, dein Vater«; die weitere genealogische Präzisierung wäre eine harmonisierende Ergänzung.
- issue: Himmlische Tafeln und festgesetzter zusätzlicher Festtag
  choice: als Aussage der Erzählung ohne dogmatische Erläuterung wiedergegeben
  alternative: als bloße Vision oder spätere menschliche Satzung deuten
  rationale: Der Quelltext verbindet Offenbarung, himmlische Tafeln und Festbegehung unmittelbar; diese Spannung wird nicht konfessionell aufgelöst.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerisch klaren Absätzen. Kultische und offenbarungstheologische Begriffe bleiben nahe am Quelltext. Offenkundig schwierige Syntax im Schlussabschnitt wird kenntlich gemacht, statt durch eine unbelegte Lesart ersetzt zu werden.
