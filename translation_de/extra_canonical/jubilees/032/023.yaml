- from: 'voller Freude. Jakob stellte seine beiden Söhne[a] auf, den einen zu seiner Rechten und den anderen zu seiner Linken, und es wurde ihm als Gerechtigkeit angerechnet. Noch in der Nacht erzählte Jakob seinem Vater alles: wie der HERR ihm große Barmherzigkeit erwiesen, ihm auf allen seinen Wegen Gelingen geschenkt und ihn vor allem Bösen bewahrt hatte. Da pries Isaak den Gott seines Vaters Abraham, der dem Sohn seines Dieners Isaak Barmherzigkeit und Gerechtigkeit nicht vorenthalten hatte.


    Am Morgen berichtete Jakob seinem Vater Isaak von dem Gebet, das er zum HERRN gebetet hatte, von der Erscheinung, die er gesehen hatte, davon, wie er einen Altar gebaut und alles für das Opfer vorbereitet hatte, das er gemäß seinem Gebet vor dem HERRN darbringen wollte, und davon, wie er gekommen war, um ihn auf einem Esel zu tragen.


    Isaak sagte zu Jakob: »Mein Sohn, ich kann nicht mit dir kommen, denn ich bin alt und kann die Reise nicht mehr ertragen. Zieh in Frieden, mein Sohn! Heute bin ich hundertfünfundsechzig Jahre alt. Ich kann nicht mehr reisen. Setze deine Mutter auf ein Lasttier und lass sie mit dir ziehen. Ich weiß, mein Sohn, dass du meinetwegen gekommen bist. Gesegnet sei dieser Tag, an dem du mich noch lebend gesehen hast und auch ich dich gesehen habe, mein Sohn. Habe Gelingen und erfülle, was du in deinem Gebet gelobt hast. Schiebe es nicht hinaus, denn dieses Gebet wird von dir erwartet. Erfülle es jetzt unverzüglich! Und der, der alles getan hat, lasse alles gelingen, worum du gebetet hast.«


    Dann sagte er zu Rebekka: »Zieh mit deinem Sohn Jakob!« So zog Rebekka mit ihrem Sohn Jakob, und Debora war bei ihr. Sie kamen nach Bet-El. Jakob erinnerte sich an das Gebet, mit dem sein Vater ihn und seine beiden Söhne Levi und Juda gesegnet hatte. Er freute sich und pries den Gott seiner Väter Abraham und Isaak. Er sagte: »Nun weiß ich, dass ich vor dem Gott über alles eine ewige Hoffnung habe – und ebenso meine Kinder. So ist es für die beiden bestimmt, und entsprechend dem Segen, den Isaak ihnen gab, wird es für sie als ewiges Zeugnis auf den himmlischen Tafeln festgehalten werden.«


    In jener Nacht blieb er in Bet-El. Levi träumte, dass man ihn und seine Nachkommen für immer zu Priestern des höchsten Gottes eingesetzt und bestimmt hatte. Als er aus dem Schlaf erwachte, pries er den HERRN.


    Am Morgen des vierzehnten Tages dieses Monats stand Jakob früh auf und gab den Zehnten von allem, was er mitgebracht hatte: von den Menschen bis zum Vieh, vom Gold bis zu sämtlichem Besitz und den Erträgen. Von allem sonderte er den Zehnten aus. In jenen Tagen wurde Rahel mit Benjamin schwanger. Jakob zählte seine Söhne, und das Los fiel auf Levi als Anteil des HERRN. Sein Vater bekleidete ihn mit priesterlichen Gewändern und füllte seine Hände.[b]


    Am fünfzehnten Tag dieses Monats brachte er auf dem Altar als Opfer vom Vieh vierzehn Rinder, achtzehn Widder, neunundvierzig Schafe, sieben Lämmer und elf Ziegenböcke[c] dar.'
