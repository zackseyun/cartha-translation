  yaml_path: translation/extra_canonical/jubilees/032/023.yaml
  text: in joy. And Jacob arranged his two sons[23], one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I am no longer able to travel; set your mother on a beast and let her go with
    you. And I know, my son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And he said to Rebekah, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed
    that they had appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.
translation:
  language: de
  text: 'voller Freude. Jakob stellte seine beiden Söhne[a] auf, den einen zu seiner Rechten und den anderen zu seiner Linken, und es wurde ihm als Gerechtigkeit angerechnet. Noch in der Nacht erzählte Jakob seinem Vater alles: wie der HERR ihm große Barmherzigkeit erwiesen, ihm auf allen seinen Wegen Gelingen geschenkt und ihn vor allem Bösen bewahrt hatte. Da pries Isaak den Gott seines Vaters Abraham, der dem Sohn seines Dieners Isaak Barmherzigkeit und Gerechtigkeit nicht vorenthalten hatte.


    Am Morgen berichtete Jakob seinem Vater Isaak von dem Gebet, das er zum HERRN gebetet hatte, von der Erscheinung, die er gesehen hatte, davon, wie er einen Altar gebaut und alles für das Opfer vorbereitet hatte, das er gemäß seinem Gebet vor dem HERRN darbringen wollte, und davon, wie er gekommen war, um ihn auf einem Esel zu tragen.


    Isaak sagte zu Jakob: »Mein Sohn, ich kann nicht mit dir kommen, denn ich bin alt und kann die Reise nicht mehr ertragen. Zieh in Frieden, mein Sohn! Heute bin ich hundertfünfundsechzig Jahre alt. Ich kann nicht mehr reisen. Setze deine Mutter auf ein Lasttier und lass sie mit dir ziehen. Ich weiß, mein Sohn, dass du meinetwegen gekommen bist. Gesegnet sei dieser Tag, an dem du mich noch lebend gesehen hast und auch ich dich gesehen habe, mein Sohn. Habe Gelingen und führe aus, worum du gebetet hast. Schiebe dein Gebet nicht auf, denn nach dem Gebet wird gefragt. Handle jetzt unverzüglich! Und der, der alles getan hat, lasse gelingen, worum du gebetet hast.«


    Dann sagte er zu Rebekka: »Zieh mit deinem Sohn Jakob!« So zog Rebekka mit ihrem Sohn Jakob, und Debora war bei ihr. Sie kamen nach Bet-El. Jakob erinnerte sich an das Gebet, mit dem sein Vater ihn und seine beiden Söhne Levi und Juda gesegnet hatte. Er freute sich und pries den Gott seiner Väter Abraham und Isaak. Er sagte: »Nun weiß ich, dass ich vor Gott, dem Gott aller, eine ewige Hoffnung habe – und ebenso meine Kinder. So ist es für die beiden bestimmt, und entsprechend dem Segen, den Isaak ihnen gab, wird es für sie als ewiges Zeugnis auf den himmlischen Tafeln festgehalten werden.«


    In jener Nacht blieb er in Bet-El. Levi träumte, dass man ihn und seine Nachkommen für immer zu Priestern des höchsten Gottes eingesetzt und bestimmt hatte. Als er aus dem Schlaf erwachte, pries er den HERRN.


    Am Morgen des vierzehnten Tages dieses Monats stand Jakob früh auf und gab den Zehnten von allem, was er mitgebracht hatte: von den Menschen bis zum Vieh, vom Gold bis zu sämtlichem Besitz und den Kleidern. Von allem sonderte er den Zehnten aus. In jenen Tagen wurde Rahel mit Benjamin schwanger. Jakob zählte seine Söhne, und das Los fiel auf Levi als Anteil des HERRN. Sein Vater bekleidete ihn mit priesterlichen Gewändern und füllte seine Hände.[b]


    Am fünfzehnten Tag dieses Monats brachte er auf dem Altar als Opfer vom Vieh vierzehn Rinder, achtzehn Widder, neunundvierzig Schafe, sieben Lämmer und elf Ziegenböcke[c] dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Quellzeile wiederholt hier Stoff vom Anfang des Kapitels und führt anschließend bis zur Erzählung von Rahels Schwangerschaft weiter. Die Übersetzung gibt diesen wiederholten Abschnitt als Teil des überlieferten Textes wieder.
    reason: segmentation_note
  - marker: b
    text: „Die Hände füllen“ ist eine alte Wendung für die Einsetzung oder Bevollmächtigung zum priesterlichen Dienst.
    reason: idiom_explanation
  - marker: c
    text: Der geezische Text hat „zehn und eins“, also elf. Die englische Konsultationsfassung liest hier einundzwanzig.
    reason: textual_number_note
lexical_decisions:
- source_word: ወተብቈ፡ ሎቱ፡ ጽድቀ
  choice: und es wurde ihm als Gerechtigkeit angerechnet
  rationale: Die passive geezische Wendung wird formal nah wiedergegeben und ihre mögliche kultische oder ethische Bedeutung nicht weiter festgelegt.
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: um ihn auf einem Esel zu tragen
  rationale: Das Verb enthält ein maskulines Objektsuffix; gemeint ist daher nicht, dass Jakob selbst auf einem Esel ritt, sondern dass er Isaak darauf befördern wollte.
- source_word: ጻዕና፡ ለአምካ፡ ወትሖር፡ ምስሌከ
  choice: Setze deine Mutter auf ein Lasttier und lass sie mit dir ziehen
  rationale: Die Aufforderung nennt ausdrücklich Jakobs Mutter; das im Deutschen ergänzte „Lasttier“ ergibt sich aus dem Verb des Aufladens beziehungsweise Aufsetzens und dem Reisezusammenhang.
- source_word: ወዐርገ፡ ወወረደ፡ ሌዊ፡ በመክፈሊተ፡ እግዚአብሔር
  choice: und das Los fiel auf Levi als Anteil des HERRN
  rationale: Die schwer wörtlich wiederzugebende Los- beziehungsweise Anteilssprache wird als Auswahl Levis für den göttlichen Anteil verständlich formuliert.
- source_word: ወመልአ፡ እደዊሁ
  choice: und füllte seine Hände
  rationale: Das ordinatorische Idiom wird beibehalten und in einer Fußnote erläutert, statt es im Haupttext einseitig als bloße Einsetzung auszudeuten.
- source_word: ዐሥራ፡ ወአሐደ
  choice: elf
  rationale: Der geezische Zahlenausdruck lautet wörtlich „zehn und eins“ und ergibt elf, auch wenn die englische Konsultationsschicht hier einundzwanzig bietet.
theological_decisions:
- issue: Bedeutung der Anrechnung als Gerechtigkeit
  choice: Die passive Aussage bleibt ohne ausdrückliches göttliches Subjekt und ohne dogmatische Erklärung stehen.
  alternative: Gott rechnete Jakob seine Handlung als Gerechtigkeit an.
  rationale: Der Ausgangstext nennt das handelnde Subjekt nicht ausdrücklich; die passive Form bewahrt diese Offenheit.
- issue: Levis priesterliche Bestimmung
  choice: Der Traum berichtet eine dauerhafte Einsetzung Levis und seiner Nachkommen zu Priestern des höchsten Gottes.
  alternative: Levi wird bereits im Traum durch Gott selbst geweiht.
  rationale: Das unbestimmte plurale Verb wird nicht vorschnell mit einem ausdrücklich genannten göttlichen Handelnden identifiziert.
- issue: Himmlische Tafeln
  choice: Die Aussage wird als Bestandteil der erzählten Welt direkt wiedergegeben.
  alternative: Eine erklärende oder relativierende Umschreibung der himmlischen Tafeln.
  rationale: Der traditionsgeschichtliche Begriff soll weder konfessionell umgedeutet noch rationalisiert werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerisch klaren Absätzen. Gottesname als HERR; direkte Rede natürlich, aber nicht umgangssprachlich. Kultische und traditionsspezifische Wendungen wie „als Gerechtigkeit angerechnet“, „himmlische Tafeln“ und „füllte seine Hände“ bleiben erkennbar, wobei nur das ungebräuchliche Ordinationsidiom erläutert wird.
