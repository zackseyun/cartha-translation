  terminology: „Rettung Israels“, „Thron der Herrlichkeit deiner Gerechtigkeit“, „großer Frieden“ und „der Geliebte“ sind angemessen. Die Fußnoten bilden die textlich mögliche alternative Segmentierung sowie die wörtliche Bildsprache sachgerecht ab.
