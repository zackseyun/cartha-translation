base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: de
  text: Und durch dich wird die Rettung Israels gefunden werden. Und an dem Tag, an dem du auf dem Thron der Herrlichkeit deiner Gerechtigkeit sitzt,[a] wird großer Frieden herrschen für alle Nachkommen der Söhne des Geliebten.[b] Wer dich segnet, wird gesegnet sein; und alle, die dich hassen und bedrängen, und auch die, die dich verfluchen, werden vernichtet und ausgerottet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und an jenem Tag wirst du auf dem Thron der Herrlichkeit deiner Gerechtigkeit wohnen. Dann wird großer Frieden herrschen …“'
    reason: Die Verbform kann auch mit „wohnen“ wiedergegeben und die Konstruktion als zwei enger aufeinanderfolgende Aussagen verstanden werden.
  - marker: b
    text: 'Wörtlich: „für allen Samen der Söhne des Geliebten“.'
    reason: Die Fußnote macht die konkrete Bildsprache von „Samen“ sowie den substantivischen Titel „der Geliebte“ sichtbar.
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: die Rettung Israels
  rationale: Gibt die soteriologische Wendung direkt und ohne konfessionelle Zuspitzung wieder.
- source_word: መንበረ፡ ክብር፡ ጽድቅከ
  choice: Thron der Herrlichkeit deiner Gerechtigkeit
  rationale: Bewahrt die gestufte Genitivkonstruktion und gibt ክብር als „Herrlichkeit“ sowie ጽድቅከ als „deiner Gerechtigkeit“ wieder.
- source_word: ዐቢየ፡ ሰላም
  choice: großer Frieden
  rationale: Nahe, natürliche Wiedergabe der nominalen Wendung.
- source_word: ኵሉ፡ ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: alle Nachkommen der Söhne des Geliebten
  rationale: Versteht die Konstruktion als „die Söhne des Geliebten“ und gibt ዘርአ kollektiv als „Nachkommen“ wieder.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: werden ausgerottet werden und zugrunde gehen
  rationale: Bewahrt die zwei parallelen Vernichtungsverben und ihre Steigerung.
theological_decisions:
- issue: Titel „der Geliebte“ und Zuordnung der Söhne
  choice: die Söhne des Geliebten
  alternative: seine geliebten Söhne
  rationale: Die geezische Konstruktion spricht eher für den substantivisch gebrauchten Titel „der Geliebte“; die alternative Lesart würde die grammatische Beziehung verschieben.
- issue: Verhältnis von Thronbesteigung und Frieden
  choice: 'temporaler Satz: „an dem Tag, an dem …, wird …“'
  alternative: 'zwei selbstständige Aussagen: „An jenem Tag wirst du … wohnen. Es wird …“'
  rationale: Die Syntax verbindet das Sitzen auf dem Thron unmittelbar mit dem Eintreten großen Friedens, ohne die genaue Art des Zusammenhangs weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der geezischen temporalen Verknüpfung, bleibt aber gut lesbar. „Herrlichkeit“, „Gerechtigkeit“, „der Geliebte“ und „ausgerottet“ erhalten den feierlichen, traditionsnahen Ton.
