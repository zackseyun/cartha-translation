  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: de
  text: alle Menschenkinder. Und ich werde deinen Nachkommen die ganze Erde unter dem Himmel geben. Sie werden über alle Völker herrschen, wie es ihnen gefällt; danach werden sie die ganze Erde an sich bringen[a] und sie als Erbe besitzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Erde sammeln“.'
    reason: Das zugrunde liegende Verb kann wörtlicher „sammeln“ oder „zusammenbringen“ bedeuten; die Hauptfassung berücksichtigt den Zusammenhang von Herrschaft und Erbbesitz.
lexical_decisions:
- source_word: ውሉደ፡ ሰብእ
  choice: alle Menschenkinder
  rationale: Gibt die wörtliche Verbindung „Kinder/Söhne der Menschen“ verständlich und geschlechtsübergreifend wieder; der Ausdruck setzt offenbar einen Satz aus dem vorausgehenden Kontext fort.
- source_word: ለዘርእከ
  choice: deinen Nachkommen
  rationale: Das kollektive „Same/Nachkommenschaft“ wird im modernen Deutsch natürlich als „Nachkommen“ wiedergegeben.
- source_word: ኵላ፡ ምድረ ... ከመትሕተ፡ ሰማይ
  choice: das ganze Land unter dem Himmel
  rationale: Bewahrt zunächst die konkrete Bedeutung von ምድር als Land; die spätere Wiederholung wird wegen ihres umfassenden Zusammenhangs mit „Erde“ wiedergegeben.
- source_word: ወይኴንኑ፡ ውስተ፡ ኵሉ፡ አሕዛብ
  choice: Sie werden über alle Völker herrschen
  rationale: Der Kontext bezeichnet Herrschaft bzw. Dominanz; „über“ ist im Deutschen idiomatisch und bildet den Bezug auf sämtliche Völker klar ab.
- source_word: በከመ፡ ፈቀዱ
  choice: wie es ihnen gefällt
  rationale: Entspricht dem Sinn „wie sie wollen/wünschen“ in natürlichem, würdigem Deutsch.
- source_word: ያስተጋብኡ፡ ኵላ፡ ምድረ
  choice: sie werden die ganze Erde an sich bringen
  rationale: Das kausative Verb kann „versammeln, zusammenbringen, sammeln“ bedeuten. „An sich bringen“ erfasst im Herrschafts- und Erbkontext das Zusammenführen unter die eigene Gewalt, ohne die Erde als körperlich bewegten Gegenstand erscheinen zu lassen.
- source_word: ወይወርስዋ
  choice: und sie als Erbe besitzen
  rationale: Gibt das Verb „erben/in Besitz nehmen“ samt dem femininen Objektbezug auf Erde/Land klar wieder.
theological_decisions:
- issue: Umfang und Art der verheißenen Herrschaft
  choice: über alle Völker herrschen ... die ganze Erde an sich bringen
  alternative: unter allen Völkern herrschen ... die ganze Erde sammeln
  rationale: Der Wortlaut beschreibt umfassende Herrschaft, legt aber deren politische oder endzeitliche Ausgestaltung nicht näher fest. Die Übersetzung bewahrt diese Offenheit und vermeidet eine konfessionelle Deutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der eröffnende Satzrest bleibt als Fragment stehen, weil der vorgelegte Vers offenbar mitten in einem Satz beginnt. „Land“ und „Erde“ bilden die mögliche Bedeutungsbreite von ምድር kontextsensitiv ab; die alternative, wörtlichere Deutung des Sammelns wird in der Fußnote bewahrt.
