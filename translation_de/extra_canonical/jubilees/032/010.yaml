  verdict: revise
  source_fidelity: Die passive Aussage bei ይሤረው und die maskuline Singularform des abschließenden pronominalen Objekts sind zutreffend berücksichtigt. Die Eingangsfassung fügt jedoch mit »sie« ein im geʿezischen Relativsatz nicht ausgedrücktes Objekt hinzu. Zudem sollte die mit »außer« eingeleitete Einschränkung des Ausgangstextes im deutschen Satz ausdrücklich wiedergegeben werden.
  naturalness: »Wer sie entweiht« ist ohne zuvor genanntes feminines Bezugswort unnatürlich und irreführend. »Er hat von seiner Nachkommenschaft dem Moloch gegeben« ist ebenfalls nicht idiomatisch; »einen aus seiner Nachkommenschaft dem Moloch gegeben« gibt den gemeinten Teilbezug verständlich wieder. Die Schlussformulierung bleibt bewusst etwas offen, wird aber mit »indem« flüssiger an den Satz angeschlossen.
  terminology: »entweihen«, »gesteinigt«, »ausgerottet«, »Sühne« und »Moloch« passen zum kultisch-rechtlichen Register. »Aus seiner Nachkommenschaft« gibt den möglichen Sinn von »aus seinem Samen« in modernem Standarddeutsch angemessen wieder, ohne eine spezifische biologische Ausdrucksweise zu erzwingen.
