base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: de
  text: Wer entweiht, muss sterben; er soll gesteinigt werden. Für dieses Gesetz gibt es keine zeitliche Begrenzung, keine Vergebung und keinerlei Sühne, außer dass der Mann, der seine Tochter inmitten ganz Israels entweiht hat, ausgerottet wird[a], denn er hat Moloch einen aus seiner Nachkommenschaft gegeben und dadurch böse gehandelt, indem er es entweihte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Mann werde ausgerottet«.'
    reason: Die passive Verbform soll sichtbar bleiben; die deutsche Hauptfassung gibt ihre verpflichtende Aussage idiomatisch wieder.
  - marker: b
    text: 'Das Pronomen im Geʿez ist maskulin Singular; worauf es sich genau bezieht, ist unklar. Daher nicht: »indem er sie entweihte«.'
    reason: Die grammatische Mehrdeutigkeit des Ausgangstextes darf nicht durch einen rein inhaltlichen Bezug auf die Tochter aufgelöst werden.
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Wer sie entweiht
  rationale: Das Verb bezeichnet Verunreinigung bzw. Entweihung. Das feminine Objekt wird aus dem folgenden Bezug auf die Tochter erschlossen; die knappe Form des Ausgangstextes bleibt erhalten.
- source_word: ሞተ፡ ለይሙት
  choice: muss sterben
  rationale: Die emphatische figura etymologica wird in natürliches, würdevolles Deutsch als nachdrückliche Todesbestimmung wiedergegeben.
- source_word: ወበእብን፡ ይትወገር
  choice: er soll gesteinigt werden
  rationale: Wörtlich steht eine passive Wendung mit »Stein«; »gesteinigt werden« ist die idiomatische deutsche Entsprechung.
- source_word: ዐቅመ፡ መዋዕለ
  choice: zeitliche Begrenzung
  rationale: Die Verbindung bezeichnet eine Begrenzung bzw. ein Maß an Tagen und wird verständlich, ohne die dauerhafte Geltung weiter auszudeuten.
- source_word: ይሤረው
  choice: muss ausgerottet werden
  rationale: Die Form ist als dritte Person Singular Passiv verstanden und stimmt mit »der Mann« überein.
- source_word: ዘርኡ
  choice: seiner Nachkommenschaft
  rationale: Das Wort bedeutet »Same/Nachkommenschaft«; die deutsche Wahl bewahrt den kultisch-familiären Sinn im Zusammenhang mit der Gabe an Moloch.
- source_word: በአርኵሶ
  choice: dass er es entweihte
  rationale: Das angefügte Pronomen ist maskulin Singular. Daher wird trotz des möglichen inhaltlichen Bezugs auf die Tochter nicht stillschweigend ein feminines Objekt eingesetzt.
theological_decisions:
- issue: Art und Dauer der Rechtsbestimmung
  choice: Für dieses Gesetz gibt es keine zeitliche Begrenzung
  alternative: Dieses Gesetz gilt für unbegrenzte Zeit
  rationale: Die gewählte Fassung bewahrt die negative Struktur des Ge'ez und vermeidet eine weitergehende dogmatische Aussage über ewige Geltung.
- issue: Beseitigung des Täters
  choice: Der Mann ... muss ausgerottet werden
  alternative: Man muss den Mann ... ausrotten
  rationale: Das Passiv des Ausgangstextes wird beibehalten, sodass weder eine ausführende Instanz ergänzt noch die Aussage spiritualisiert wird.
- issue: Referent des abschließenden maskulinen Pronomens
  choice: es
  alternative: sie
  rationale: Die grammatische Form ist maskulin Singular und kann auf etwas anderes als die Tochter zurückweisen; diese Spannung wird im Text und in der Fußnote sichtbar bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen, rechtlich-feierlichen Register. Archaisierende Formeln wie »des Todes sterben« werden vermieden. »Moloch« folgt der im Deutschen geläufigen Namensform. Die harte kultisch-rechtliche Aussage und die unklare Referenz des letzten Pronomens bleiben erhalten.
