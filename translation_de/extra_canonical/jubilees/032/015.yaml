  source_fidelity: 'Die Übersetzung gibt die ge''ezische Satzfolge und den Sinn zuverlässig wieder: die fragmentarische Eröffnung, die Heiratsgabe einer Tochter an einen Mann aus den Völkern, die Formel „Plage über Plage und Fluch über Fluch“, die Konsequenz bei Handeln und Wegsehen sowie das gemeinsame Gericht des ganzen Volkes. „seine Augen verschließt“ ist eine natürliche deutsche Wiedergabe der Bildsprache vom Blindwerden/den Augen gegenüber etwas Verschließen und legt keine zusätzliche Handlung fest.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung „Plage über Plage und Fluch über Fluch“ ist bewusst formnah und im Kontext verständlich. Das einleitende Satzfragment ist angesichts des mitten im Zusammenhang beginnenden Verses angemessen.
  terminology: „Völker“, „Plage“, „Fluch“, „Unreinheit“, „verunreinigen“, „entweihen“ und „gerichtet werden“ sind terminologisch konsistent und geben die kultisch-gerichtliche Sprache ohne konfessionelle Zuspitzung wieder. „HERRN“ ist eine etablierte deutsche Wiedergabe des Gottesnamens in diesem Register.
