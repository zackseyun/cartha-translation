base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: de
  text: die Töchter der Völker. Und wenn er eine seiner Töchter einem Mann aus irgendeinem der Völker gibt – denn es ist Plage über Plage und Fluch über Fluch –, dann werden all diese Plage und dieser Fluch kommen, wenn er so handelt und wenn er seine Augen verschließt vor denen, die Unreinheit begehen, vor denen, die das Heiligtum des HERRN verunreinigen, und vor denen, die seinen heiligen Namen entweihen. Das ganze Volk wird gemeinsam wegen all der Unreinheit und Entweihung gerichtet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕዛብ
  choice: Völker
  rationale: Gibt den pluralischen Ausdruck für fremde Völker natürlich wieder; im Zusammenhang sind die nichtisraelitischen Völker gemeint.
- source_word: መቅሠፍት
  choice: Plage
  rationale: Bewahrt den konkreten und zugleich strafgerichtlichen Klang des ge'ezischen Ausdrucks.
- source_word: ርኵሰ
  choice: Unreinheit
  rationale: Entspricht dem kultisch-moralischen Bedeutungsfeld, ohne es auf nur eine Art von Verfehlung einzuengen.
- source_word: ያረኵሱ
  choice: verunreinigen
  rationale: Erhält die lexikalische Verbindung zu »Unreinheit« und passt zum Heiligtum als Objekt.
- source_word: ይጌምኑ
  choice: entweihen
  rationale: Gibt die Profanierung des heiligen Namens idiomatisch und würdig wieder.
- source_word: ይትኬነን
  choice: wird … gerichtet werden
  rationale: Bewahrt die passive Gerichtsformulierung und vermeidet eine unbelegte nähere Bestimmung des Richters.
theological_decisions:
- issue: Kollektive Verantwortung
  choice: Das ganze Volk wird gemeinsam … gerichtet werden
  alternative: Jeder aus dem Volk wird … gerichtet werden
  rationale: Der Quelltext nennt das gesamte Volk kollektiv und fügt einen Ausdruck für Gemeinsamkeit hinzu; diese Spannung wird nicht individualisierend aufgelöst.
- issue: Heiligkeit des Gottesnamens
  choice: seinen heiligen Namen entweihen
  alternative: seinen heiligen Namen lästern
  rationale: »Entweihen« wahrt den Zusammenhang von Heiligtum, Reinheit und Profanierung, ohne den Ausdruck auf verbale Lästerung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitenden Worte bleiben als erkennbares Satzfragment stehen, weil der Vers mitten im Zusammenhang einsetzt. Die Wiederholungsformel »Plage über Plage und Fluch über Fluch« wird wegen ihrer rhetorischen und theologischen Schärfe formal bewahrt.
