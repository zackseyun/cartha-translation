base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: de
  text: So werden auch deine Kinder durch alle Zeitalter hindurch sein. Der HERR gebe dir und deinen Nachkommen ein großes Herz zu seiner Ehre. Er bringe dich und deine Nachkommen aus allen Menschen zu sich, damit sie in seinem Heiligtum Dienst tun[a] wie die Engel des Angesichts und wie die Heiligen. Ihnen gleich soll die Nachkommenschaft deiner Kinder zu Ehre und Größe sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gehorchen.'
    reason: Das ge’ezische Verb kann sowohl gehorsames Unterordnen als auch Dienen bezeichnen; der Heiligtumskontext begünstigt »Dienst tun«.
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommen
  rationale: Das kollektive »Same/Nachkommenschaft« wird in modernem Deutsch natürlich als »Nachkommen« wiedergegeben.
- source_word: ዐበየ፡ ልበየ
  choice: ein großes Herz
  rationale: Die wörtliche Wendung »Größe des Herzens« bezeichnet innere Größe; »ein großes Herz« bewahrt das Bild in verständlichem Deutsch, ohne es näher auszudeuten.
- source_word: ይትአዘዙ
  choice: Dienst tun
  rationale: Das Verb kann Gehorsam beziehungsweise untergeordneten Dienst ausdrücken; der Zusammenhang mit dem Heiligtum legt hier kultischen Dienst nahe.
- source_word: መላእክተ፡ ገጽ
  choice: Engel des Angesichts
  rationale: Die feste traditionsgeschichtliche Bezeichnung wird formal bewahrt und nicht interpretierend zu »Engel der Gegenwart Gottes« erweitert.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Die substantivierte Mehrzahl bleibt offen dafür, himmlische heilige Wesen zu bezeichnen.
theological_decisions:
- issue: Bezugswort des Verbs ይትአዘዙ
  choice: damit sie … Dienst tun
  alternative: damit ihr … Dienst tut
  rationale: Die ge’ezische Verbform steht in der dritten Person Plural. Das deutsche »sie« bewahrt diese grammatische Form und bezieht sich am ehesten auf die Nachkommen, ohne sie zu einer zweiten Person umzudeuten.
- issue: Erwählung aus der Menschheit
  choice: aus allen Menschen
  alternative: aus allem Fleisch
  rationale: Die Wendung እምኵሉ፡ ዘሥጋ ist wörtlich »aus allem Fleisch«; »aus allen Menschen« gibt den gemeinten menschlichen Gesamtbereich klar wieder, ohne die Auswahl theologisch weiter zu bestimmen.
- issue: Identität der »Heiligen«
  choice: die Heiligen
  alternative: die heiligen Engel
  rationale: Der Quelltext nennt nur »Heilige«. Eine ausdrückliche Gleichsetzung mit Engeln würde eine mögliche Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Gebetston. Der Gottesname wird entsprechend deutscher Bibelkonvention als HERR gesetzt. Die Satzfolge und die wiederholte Nennung der Nachkommen bleiben nahe am Quelltext; schwer verständliche Semitismen werden nur dort geglättet, wo der Sinn dabei erhalten bleibt.
