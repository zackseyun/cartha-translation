base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: de
  text: Ihre Königreiche waren Karnaim, Aschtarot, Edreï, Misur und Beon. Der HERR vernichtete sie wegen ihrer bösen Taten, denn sie waren überaus böse. An ihrer Stelle ließ er die Amoriter wohnen, die böse und sündig waren. Und heute gibt es kein Volk, das alle ihre Sünden vollendet hat; und sie sind nicht mehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንግሥቶሙ (mangəśtōmu)
  choice: Ihre Königreiche
  rationale: Gibt den Plural mit Possessivsuffix unmittelbar und natürlich wieder.
- source_word: አሕጐሎሙ (ʾaḥgʷalomu)
  choice: vernichtete sie
  rationale: Das Verb bezeichnet Vernichten oder Zugrunderichten; „richtete sie“ wäre lexikalisch zu schwach beziehungsweise unzutreffend.
- source_word: እምእኩይ ምግባሮሙ
  choice: wegen ihrer bösen Taten
  rationale: Gibt den Grund der Vernichtung idiomatisch wieder, ohne einen zusätzlichen Maßstabs- oder Gerichtsgedanken einzuführen.
- source_word: ጸዋጋን ጥቀ
  choice: überaus gottlos
  rationale: Bewahrt die starke Intensivierung; „gottlos“ passt zum moralisch-religiösen Kontext des Ausdrucks.
- source_word: ወአኅደረ አሞሬዎነ ህየንቴሆሙ
  choice: An ihrer Stelle ließ er die Amoriter wohnen
  rationale: Bildet das kausative Verb und die Ortsangabe in natürlichem Deutsch ab.
- source_word: ዘፈጸመ ኀጣውኢሆሙ ኵሎ
  choice: das alle ihre Sünden vollendet hat
  rationale: Bewahrt sowohl das Verb „vollenden“ als auch das ausdrücklich vorhandene „alle“, ohne die ungewöhnliche Aussage zu glätten.
- source_word: ወአልቦሙ
  choice: und sie sind nicht mehr
  rationale: Gibt die knappe Existenzverneinung wieder und lässt den Bezug des pluralischen Pronomens so offen wie die Vorlage.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung እግዚአብሔር
  choice: der HERR
  alternative: der Herr / Gott
  rationale: Die traditionelle deutsche Bibelschreibung signalisiert die Gottesbezeichnung würdig und knapp, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Ungewöhnliche Rede vom Vollenden der Sünden
  choice: wörtlich als „alle ihre Sünden vollendet“ beibehalten
  alternative: „das ebenso viele Sünden begangen hat“ oder „das das volle Maß ihrer Sünden erreicht hat“
  rationale: Die Alternativen würden einen Vergleich oder das Bild eines Sündenmaßes ergänzen, das im überlieferten ge'ezischen Wortlaut nicht ausdrücklich steht.
- issue: Bezug von „sie“ im Schlusssatz
  choice: Pronomen ohne erklärende Auflösung beibehalten
  alternative: das zuvor vernichtete Volk ausdrücklich benennen
  rationale: Der knappe Ausgangstext lässt den Bezug formal offen; eine ausdrückliche Benennung würde die Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblischem Ton. Die Reihung der Ortsnamen bleibt erhalten; der längere ge'ezische Satz wird zur besseren Verständlichkeit gegliedert. Die auffällige Formulierung „Sünden vollendet“ und die pronominale Spannung am Schluss werden bewusst nicht interpretierend geglättet.
