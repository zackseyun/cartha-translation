base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: de
  text: Dies ist ein Zeugnis der Freude – einer Freude wie dieser.[a] Früher nannte man das Land Gilead das Land der Refaïm, denn es ist das Land der Refaïm. Dort wurden Refaïm geboren, Riesen, die zehn Ellen, neun Ellen, acht Ellen und bis hinab zu sieben Ellen groß waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe Eingangsformel wiederholt das Wort „Freude“; ihre genaue syntaktische Zuordnung ist im Ausgangstext nicht völlig eindeutig.
    reason: source_ambiguity
  - marker: b
    text: Die erste Zahl ist in der vorliegenden gedruckten Überlieferung offenbar fehlerhaft wiedergegeben; die Zahlenfolge meint zehn, neun, acht und sieben Ellen.
    reason: textual_transcription
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዕ፡ … ፍሥሐተ
  choice: ein Zeugnis der Freude – einer Freude wie dieser
  rationale: Die beiden Belege von ፍሥሐት werden konsequent als „Freude“ wiedergegeben, während ስምዕ als „Zeugnis“ erscheint. Die leicht ungewöhnliche Wiederholung des Ausgangstextes bleibt erkennbar.
- source_word: ምድረ፡ ራፋኤል / ረፋኤም
  choice: Land der Refaïm / Refaïm
  rationale: Der überlieferte Volksname wird in einer im Deutschen verständlichen biblischen Form bewahrt, statt ihn deutend zu ersetzen.
- source_word: ረዐይት
  choice: Riesen
  rationale: Der Kontext beschreibt außergewöhnlich große Angehörige der Refaïm; „Riesen“ ist die natürliche und sachgerechte deutsche Entsprechung.
- source_word: በአመት
  choice: Ellen
  rationale: Die Maßangabe wird entsprechend der antiken Längeneinheit und der gesicherten Versüberlieferung als „Ellen“ wiedergegeben.
theological_decisions:
- issue: Identität der Refaïm und der Riesen
  choice: „Refaïm … Riesen“ ohne weitergehende Gleichsetzung oder Erklärung
  alternative: Refaïm vollständig mit „Riesen“ zu übersetzen oder mythologisch näher zu bestimmen
  rationale: Der Text nennt zunächst den Volksnamen und beschreibt die Betreffenden anschließend als Riesen. Diese Spannung und Reihenfolge wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit leicht geglättet, während die auffällige Wiederholung von „Freude“, der Volksname Refaïm und die absteigende Maßfolge erhalten bleiben.
