  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: de
  text: 'jeden Mann und jede Frau in Israel, die sein Heiligtum entweihen. Darum habe ich dir geboten: »Verkünde dieses Zeugnis über Israel![a] Sieh, was Sichem und seinen Söhnen widerfuhr: Sie wurden in die Hand der beiden Söhne Jakobs gegeben, und diese töteten sie unter Qualen. Das wurde ihnen als Gerechtigkeit angerechnet und für sie als Gerechtigkeit aufgeschrieben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Lass dieses Zeugnis über Israel hören!«'
    reason: Die Quelle verwendet ein kausatives Verb des Hörens zusammen mit dem Substantiv »Zeugnis«.
lexical_decisions:
- source_word: ያረኵስ፡ መቅደሶ
  choice: sein Heiligtum entweihen
  rationale: Das Verb bezeichnet das Verunreinigen oder Entweihen; das possessive »sein« bleibt entsprechend dem Ge’ez erhalten, ohne den Bezug ausdrücklich aufzulösen.
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: Verkünde dieses Zeugnis
  rationale: Die Wendung verbindet ein kausatives Hörverb mit »Zeugnis«. »Verkünde« gibt den natürlichen deutschen Sinn wieder, während »Zeugnis« das rechtlich-bundestheologische Gewicht des Substantivs bewahrt.
- source_word: ተውህበት፡ ውስተ፡ እዴ
  choice: wurden in die Hand … gegeben
  rationale: Die singularische Quellenmetapher wird formal bewahrt und nicht idiomatisch zu »in die Hände« erweitert.
- source_word: በፃዕር
  choice: unter Qualen
  rationale: ፃዕር bezeichnet Schmerz, Mühsal oder Qual; im Zusammenhang mit Sichem ist eine Umstandsangabe beim Töten gemeint, nicht das Instrument »Schwert«.
- source_word: ወኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: Das wurde ihnen als Gerechtigkeit angerechnet und für sie als Gerechtigkeit aufgeschrieben
  rationale: Die Wiederholung von »Gerechtigkeit« wird beibehalten; »angerechnet« drückt die wertende Zurechnung des ersten Satzteils natürlich aus.
theological_decisions:
- issue: Bezug des Possessivpronomens bei »sein Heiligtum«
  choice: Das maskuline Singularpronomen bleibt unaufgelöst.
  alternative: »Gottes Heiligtum« oder »ihr Heiligtum«
  rationale: Die Quelle bietet »sein Heiligtum«. Eine ausdrückliche Identifizierung des Besitzers würde eine nicht im Wortlaut vollzogene Auslegung festschreiben.
- issue: Positive Bewertung der Tötung Sichems und seiner Söhne
  choice: Die Aussage, sie sei als Gerechtigkeit angerechnet worden, wird ohne Abschwächung wiedergegeben.
  alternative: Eine moralisch relativierende oder erklärende Umschreibung
  rationale: Die theologische Spannung gehört zum Text und darf nicht stillschweigend geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Zusammenhangs; deshalb bleibt »jeden« kleingeschrieben. Die direkte Rede ist klar gegliedert, ohne die fremdsprachlichen Idiome unnötig einzuebnen.
