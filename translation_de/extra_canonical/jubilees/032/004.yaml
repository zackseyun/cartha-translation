base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: de
  text: 'Er legte die priesterlichen Gewänder an und füllte seine Hände.[a] Am fünfzehnten Tag dieses Monats brachte er aus dem Vieh zum Altar: vierzehn Stiere, achtundzwanzig Widder, neunundvierzig Schafe, sieben Lämmer und einundzwanzig Ziegenböckchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seine Hände füllen“ ist eine kultische Wendung, die hier wahrscheinlich seine Einsetzung oder Bevollmächtigung zum priesterlichen Dienst bezeichnet.
    reason: Die wörtliche Formulierung ist im Deutschen ungewohnt; die Fußnote erläutert den wahrscheinlichen kultischen Sinn, ohne ihn im Haupttext festzuschreiben.
lexical_decisions:
- source_word: አልባሰ፡ ክህነት
  choice: legte die priesterlichen Gewänder an
  rationale: Gibt den aktiven Vorgang des Anlegens von Gewändern und deren priesterliche Bestimmung natürlich und quellennah wieder.
- source_word: መልአ፡ እደዊሁ
  choice: füllte seine Hände
  rationale: Bewahrt die konkrete, möglicherweise kultische Wendung des Ge’ez, ohne ihre Bedeutung im Haupttext vorschnell auf eine bestimmte Amtseinsetzung festzulegen.
- source_word: አብአ፡ ውስተ፡ ምሥዋዕ
  choice: brachte er … zum Altar
  rationale: Entspricht der Bewegungsrichtung zum Altar; ein nicht ausdrücklich vorhandenes „als Opfer“ wird nicht ergänzt.
- source_word: አስዋረ
  choice: Stiere
  rationale: Bezeichnet männliche Rinder und unterscheidet sie von der übergeordneten Herkunftsangabe „aus dem Vieh“.
- source_word: መሓስዐ፡ ጠሊ
  choice: Ziegenböckchen
  rationale: Gibt junge männliche Ziegen präzise und in verständlichem modernem Deutsch wieder.
theological_decisions:
- issue: Kultische Bedeutung der Wendung „die Hände füllen“
  choice: Die wörtliche Wendung bleibt im Haupttext erhalten und wird in einer Fußnote vorsichtig erläutert.
  alternative: „setzte ihn in das Priesteramt ein“ oder „weihte ihn zum Priester“
  rationale: Eine explizite Deutung als Priesterweihe würde die bildhafte und potenziell mehrdeutige Ausgangsformulierung stärker festlegen, als es der Text selbst tut.
- issue: Opfercharakter der zum Altar gebrachten Tiere
  choice: Keine Ergänzung „als Opfer“ im Haupttext
  alternative: „brachte er als Opfer zum Altar“
  rationale: Der Zusammenhang legt Opfer nahe, doch das entsprechende Wort steht in dieser Formulierung nicht ausdrücklich im Ge’ez.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung nach dem Doppelpunkt ist übersichtlich, ohne die sachliche und kultische Prägung des Ausgangstextes abzuschwächen.
