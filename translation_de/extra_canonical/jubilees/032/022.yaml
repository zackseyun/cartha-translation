translation:
  language: de
  text: Es ist ihnen verordnet, es zu tun und als Freunde verzeichnet zu werden.[a] Wenn sie aber übertreten und auf all ihren Wegen unrein handeln, werden sie auf den himmlischen Tafeln als Widersacher verzeichnet; sie werden aus dem Buch des Lebens getilgt und in das Buch derer eingetragen, die zugrunde gehen werden, und zusammen mit denen, die …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ordnete ihnen an, es zu tun und als Freunde verzeichnet zu werden.“'
    reason: Die Eingangswendung lässt sich entweder unpersönlich-passiv oder mit einem impliziten handelnden Subjekt wiedergeben.
lexical_decisions:
- source_word: ሤሠርዐት፡ ሎሙ
  choice: Es ist ihnen verordnet
  rationale: Die unpersönlich-passive Wiedergabe entspricht der vorliegenden Form und bewahrt zugleich die Möglichkeit eines impliziten Anordnenden.
- source_word: ወይጸሐፉ፡ አዕርክተ
  choice: und als Freunde verzeichnet zu werden
  rationale: ይጸሐፉ wird passiv als „verzeichnet werden“ verstanden; አዕርክተ bezeichnet prädikativ „Freunde“ und bildet den beabsichtigten Gegensatz zu „Widersacher“ im folgenden Satz.
- source_word: ሰርኵስ
  choice: Unreinheit
  rationale: Der Ausdruck bezeichnet kultische oder sittliche Unreinheit; das Substantiv wahrt diese Bedeutungsbreite besser als eine enger festgelegte Umschreibung.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Wörtliche und im Jubiläenbuch etablierte Wiedergabe des himmlischen Verzeichnisses.
- source_word: ጸላእተ
  choice: Widersacher
  rationale: Bewahrt den deutlichen Gegenbegriff zu „Freunde“, ohne ihn unnötig auf persönliche Feindschaft oder eine bestimmte theologische Kategorie zu verengen.
- source_word: ይደመሰሱ
  choice: getilgt
  rationale: Gibt das Auslöschen aus einem schriftlichen Register prägnant und traditionsgemäß wieder.
- source_word: እለ፡ ይትሐጐሉ
  choice: derer, die zugrunde gehen werden
  rationale: Gibt den zukünftigen Untergang wieder, ohne dessen genaue Art über den Quelltext hinaus festzulegen.
theological_decisions:
- issue: Gegenüberstellung der himmlischen Einträge
  choice: „als Freunde“ gegenüber „als Widersacher“
  alternative: „als Satzung“ gegenüber „als Feinde“
  rationale: Die Formen አዕርክተ und ጸላእተ bilden eine personale und theologisch bedeutsame Antithese; die frühere Deutung als „Satzung“ wird vom ge’ezischen Wortlaut nicht getragen.
- issue: Unvollständiger Versschluss
  choice: Abbruch mit Auslassungspunkten bewahrt
  alternative: Den Satz aus späterer Überlieferung oder dem Kontext ergänzen
  rationale: Der bereitgestellte Quelltext endet mitten im Relativsatz. Eine Ergänzung würde nicht aus der vorgelegten Quelle stammen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Registersprache „verordnet“, „verzeichnet“, „Widersacher“ und „getilgt“ erhält den feierlichen Gerichtskontext, bleibt aber allgemein verständlich. Der syntaktische Abbruch am Ende ist bewusst beibehalten, da auch der bereitgestellte Quellenausschnitt unvollständig endet.
