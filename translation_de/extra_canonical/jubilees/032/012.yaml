  text: It has been ordained, and there is no keeping it over from this year to the year that is coming. For in its year the seed is eaten until the days of the gathering of the seed of the year, and wine until the time of
translation:
  language: de
  text: Es ist festgesetzt, und nichts davon darf von diesem Jahr bis zum kommenden Jahr aufbewahrt werden. Denn in seinem Jahr wird das Getreide gegessen bis zu den Tagen, an denen das Getreide des Jahres eingebracht wird, und der Wein bis zur Zeit, da …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende Quellenausschnitt bricht an dieser Stelle mitten im Satz ab. Die äthiopischen Zahlenzeichen ፳፮, ፳፯ und ፳፰ in der Druckausgabe sind Fußnotenverweise und gehören nicht zum Text des Verses.
    reason: source_truncation_and_editorial_markers
lexical_decisions:
- source_word: ተኀርየ
  choice: Es ist festgesetzt
  rationale: Das passive Verb bezeichnet hier etwas Bestimmtes bzw. Angeordnetes; „festgesetzt“ ist im Zusammenhang einer zeitlichen Regelung natürlich und wahrt den passiven Sinn.
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: und nichts davon darf … aufbewahrt werden
  rationale: Die Wendung verneint das Zurücklassen bzw. Aufbewahren eines Teils davon. Die modale Formulierung gibt den normativen Zusammenhang idiomatisch wieder.
- source_word: ዘርእ
  choice: Getreide
  rationale: Das Wort kann „Saat“, „Samen“ oder die daraus hervorgegangene Feldfrucht bezeichnen. Da sie gegessen und eingebracht wird, passt „Getreide“ im Deutschen am besten.
- source_word: መዋዕለ፡ ሐፊረ፡ ዘርእ
  choice: die Tage, an denen das Getreide … eingebracht wird
  rationale: Die Formulierung bezeichnet die Zeit des Einsammelns bzw. Einbringens der Feldfrucht; die verbale Wiedergabe ist verständlicher als ein schwerfälliges Substantivgefüge.
- source_word: አመ
  choice: Zeit, da
  rationale: Hier ist eine Zeitangabe gemeint, nicht notwendig ein Jahr. Der Satz bricht danach im überlieferten Ausschnitt ab.
