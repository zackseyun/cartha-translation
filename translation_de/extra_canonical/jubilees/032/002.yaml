base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: de
  text: Jakob stand am frühen Morgen des vierzehnten Tages dieses Monats auf. Er gab den zehnten Teil von allem, was mit ihm gekommen war – von den Menschen bis zum Vieh, vom Gold bis zu allem Besitz. Er brachte ihn[a] und gab von allem den zehnten Teil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachte ihn hinein«; im Zusammenhang auch: »brachte ihn dar«.'
    reason: Das ge’ezische Verb ist die Kausativform von „hineingehen“ und kann je nach Kontext „hereinbringen“ oder „darbringen“ bedeuten.
lexical_decisions:
- source_word: ወጌሰ፡ ያዕቆብ፡ በነግህ
  choice: Am Morgen … stand Jakob früh auf
  rationale: Die Wendung bezeichnet Jakobs frühes Aufstehen am Morgen; die deutsche Formulierung ist natürlich und bewahrt die zeitliche Angabe.
- source_word: ወዐሠረ፡ እምኵሉ
  choice: Er gab den zehnten Teil von allem
  rationale: Das Verb ist von der Zehnzahl abgeleitet und bedeutet hier, den Zehnten zu geben. Die ausgeschriebene Wendung ist im heutigen Deutsch klarer als das seltenere „verzehnten“.
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: von den Menschen bis zum Vieh
  rationale: Die umfassende Spannweite des Ausgangstextes wird ohne Abschwächung oder erklärende Umdeutung erhalten.
- source_word: እምወርቅ፡ እስከ፡ ኵሉ፡ ንዋይ
  choice: vom Gold bis zu allem Besitz
  rationale: „Besitz“ gibt ንዋይ in diesem Zusammenhang als Vermögen beziehungsweise Habe verständlich wieder.
- source_word: ወአብአ
  choice: Dann brachte er ihn herbei
  rationale: Die Kausativform des Verbs „hineingehen/eintreten“ bedeutet „hereinbringen“ beziehungsweise kontextuell „darbringen“. „Herbeibringen“ bewahrt den konkreten Bewegungssinn, ohne eine kultische Deutung zwingend festzulegen.
theological_decisions:
- issue: Umfang des Zehnten einschließlich der Menschen
  choice: Die Formulierung „von den Menschen bis zum Vieh“ bleibt wörtlich erhalten.
  alternative: Die Menschen als bloße Zähl- oder Bezugsgröße umschreiben oder auslassen.
  rationale: Der Ausgangstext schließt Menschen ausdrücklich in die Spannweite ein; eine nähere Bestimmung dessen, was praktisch mit ihnen geschah, liefert der Vers nicht.
- issue: Möglicher Opfer- oder Darbringungssinn von ወአብአ
  choice: Neutral „brachte er ihn herbei“ mit Fußnote.
  alternative: Eindeutig kultisch „brachte er ihn dar“.
  rationale: Der Kontext kann eine Darbringung nahelegen, doch die Verbform selbst erlaubt auch den konkreteren Sinn „hereinbringen“. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Gebens des Zehnten wird wie im Ausgangstext beibehalten. Das einleitende ለእግዚአብሔር („für Gott/zu Gott“) wurde nicht in Vers 2 aufgenommen, da es syntaktisch den Abschluss des vorangehenden Verses bildet und auch die konsultierte Versabgrenzung es dort voraussetzt.
