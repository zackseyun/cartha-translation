  terminology: „den zehnten Teil“ ist modernes, klares Standarddeutsch und wahrt den Sinn. „Menschen“, „Vieh“, „Gold“ und „Besitz“ sind angemessene Wiedergaben. Die Fußnote erhält die semantische Spannweite von ወአብአ, ohne den kultischen Sinn vorzuschreiben.
