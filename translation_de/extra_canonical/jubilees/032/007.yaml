base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: de
  text: Darum ist dies in Israel bestimmt über die Entehrung einer israelitischen Jungfrau:[a] Wenn es in Israel einen Mann gibt, der seine Tochter oder auch seine Schwester einem Mann aus der Nachkommenschaft der Völker geben will, muss er sterben; man soll ihn mit Steinen steinigen, denn er hat Schande in Israel begangen; und die Frau …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über eine entehrte israelitische Jungfrau“.'
    reason: Die Geʽez-Wendung kann entweder substantivisch als „über die Entehrung …“ oder als Aussage über eine Jungfrau verstanden werden, die entehrt worden ist.
  - marker: b
    text: Der hier vorgelegte Quelltext bricht an dieser Stelle mitten im Satz ab.
    reason: Der unvollständige Überlieferungsumfang muss sichtbar bleiben; eine Ergänzung wäre spekulativ.
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: über die Entehrung einer israelitischen Jungfrau
  rationale: Gibt die substantivische Wendung mit ድንግል („Jungfrau“) und dem femininen Adjektiv እስራኤላዊት („israelitisch“) natürlich und quellennah wieder; „Entehrung“ passt im Deutschen zum sexualethischen Kontext, ohne den Vorgang genauer festzulegen.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: aus der Nachkommenschaft der Völker
  rationale: Bewahrt das Bild von „Same/Nachkommenschaft“ und die kollektive Bezeichnung አሕዛብ („Völker“, häufig auch „Heiden“), ohne eine konfessionell oder abwertend verengende Wiedergabe.
- source_word: ሞተ፡ ለይሙት
  choice: muss er sterben
  rationale: Die figura etymologica verstärkt das Todesurteil („sterbend soll er sterben“); die deutsche modale Form gibt diese Verbindlichkeit idiomatisch wieder.
- source_word: ወበእብን፡ ይውግሮዎ
  choice: man soll ihn steinigen
  rationale: Gibt die unbestimmte Mehrzahl des Verbs und das ausdrücklich genannte Mittel, Steine, in geläufigem Deutsch wieder.
- source_word: ገብረ፡ ኀፍረተ፡ በውስተ፡ እስራኤል
  choice: er hat Schande über Israel gebracht
  rationale: Natürliches Deutsch für „er hat Schande in Israel getan/verursacht“; es bewahrt den gemeinschaftsbezogenen Charakter der Tat.
theological_decisions:
- issue: Bezeichnung der nichtisraelitischen Gruppen
  choice: Völker
  alternative: Heiden
  rationale: „Völker“ entspricht dem Grundsinn von አሕዛብ und vermeidet, eine spätere religiöse Wertung stärker in den Text einzutragen, als die ethnisch-genealogische Formulierung verlangt.
- issue: Unvollständiger Satz über die Frau
  choice: und ebenso die Frau …
  alternative: Ergänzung einer aus dem Kontext erschlossenen Strafe
  rationale: Der bereitgestellte Quelltext endet mit ወለብእሲትሂ („und auch/ebenso die Frau“). Die Übersetzung wahrt den Abbruch und ergänzt keine nicht überlieferte Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Rechtssprache wird klar, aber nicht unnötig archaisch formuliert. Der harte Inhalt des Ausgangstextes wird weder abgeschwächt noch kommentierend verschärft; die syntaktische Unvollständigkeit am Versende bleibt ausdrücklich erkennbar.
