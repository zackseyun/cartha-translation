  yaml_path: translation/extra_canonical/jubilees/032/008.yaml
  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: de
  text: Man soll sie mit Feuer verbrennen, denn sie hat den Namen des Hauses ihres Vaters entweiht; und sie soll aus Israel ausgerottet werden. Weder Unzucht noch Unreinheit soll sich in Israel finden, solange die Geschlechter der Erde bestehen; denn Israel ist dem HERRN heilig. Jeder, der es entweiht, soll gewiss sterben; man soll ihn steinigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Man soll sie im Feuer verbrennen
  rationale: Das feminine Objektsuffix wird ausdrücklich mit „sie“ wiedergegeben; die unbestimmte vollziehende Instanz des ge'ezischen Plurals wird im Deutschen natürlich durch „man“ ausgedrückt.
- source_word: አርኰሰት
  choice: entweiht
  rationale: Das Verb bezeichnet hier kultisch-sittliche Verunreinigung beziehungsweise Entheiligung; „entweiht“ passt zum folgenden „Namen“ und bewahrt den sakralen Ernst.
- source_word: ስመ፡ ቤተ፡ አቡሃ
  choice: den Namen des Hauses ihres Vaters
  rationale: Die Genitivfolge wird formal bewahrt; „Haus“ kann sowohl Familie als auch Haushalt bezeichnen, ohne dies einseitig aufzulösen.
- source_word: ትሠረው፡ እምእስራኤል
  choice: sie soll aus Israel ausgerottet werden
  rationale: Gibt die starke Tilgungsformel wieder und wahrt den Parallelismus zur Todesstrafe.
- source_word: ዘማ፡ ወርኵስ
  choice: Unzucht noch Unreinheit
  rationale: „Unzucht“ gibt den sexuellen Verstoß wieder; „Unreinheit“ lässt den umfassenderen moralisch-kultischen Begriff offen.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: solange die Geschlechter der Erde bestehen
  rationale: Eine natürliche deutsche Wiedergabe der zeitlichen Totalitätsformel, ohne sie auf eine bestimmte Endzeitvorstellung festzulegen.
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: Israel ist dem HERRN heilig
  rationale: Bewahrt Prädikation und Zugehörigkeitsbezug; die Gottesbezeichnung wird entsprechend deutscher Bibeltradition als „HERR“ gesetzt.
- source_word: ሞተ፡ ለይሙት
  choice: muss sterben
  rationale: Gibt die emphatische Todesformel idiomatisch und mit ihrer rechtlichen Bestimmtheit wieder.
- source_word: በእብን፡ ይውግርዎ
  choice: man soll ihn steinigen
  rationale: Die wörtliche Wendung „mit Stein(en) bewerfen“ bezeichnet die Hinrichtung durch Steinigung; die deutsche Rechtsformel ist präzise und verständlich.
theological_decisions:
- issue: Bezugswort des maskulinen Suffixes in „jeder, der es entweiht“
  choice: „es“ bezieht sich grammatisch auf Israel
  alternative: Sinngemäß könnte der Bezug auf Israels Heiligkeit, das Gesetz oder die betreffende Ordnung verstanden werden.
  rationale: Der unmittelbar vorausgehende grammatische Bezug ist „Israel“. Die Übersetzung wahrt diesen Wortlaut und löst die weitergehende theologische Referenz nicht ausdeutend auf.
- issue: Heiligkeit Israels
  choice: „Israel ist dem HERRN heilig“
  alternative: „Israel ist heilig für den HERRN“
  rationale: Die gewählte Formulierung drückt sowohl Heiligkeit als auch Zugehörigkeit aus, ohne eine konfessionelle Lehre über den Status Israels hinzuzufügen.
translation_notes:
  register: Moderner, würdiger deutscher Bibelstil mit klaren Rechtssätzen. Archaische Formen wurden vermieden; die Härte und Wiederholung des Ausgangstextes wurden nicht abgeschwächt. Keine Fußnoten erforderlich.
