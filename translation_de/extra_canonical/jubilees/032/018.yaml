base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: de
  text: 'Gesegnet sei jeder, der dich segnet, und jedes Volk, das dich verflucht, soll verflucht sein. Zu Juda sagte er: »Der Herr gebe dir Kraft und Stärke, damit du alle niedertrittst, die dich hassen. Sei ein Herrscher über die Söhne Jakobs, du und einer deiner Söhne. Dein Name und der Name deiner Söhne sollen hinausgehen und überall auf der Erde und in den Ländern verkündet werden. Dann werden die Völker vor deinem Angesicht erzittern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃይለ፡ ወጽንዐ
  choice: Kraft und Stärke
  rationale: Gibt das synonyme Begriffspaar mit zwei natürlichen deutschen Substantiven wieder.
- source_word: ትኪዶሙ
  choice: du ... niedertrittst
  rationale: Bewahrt das kraftvolle Bild des Nieder- oder Zertretens, ohne es zu einem bloßen Besiegen abzuschwächen.
- source_word: መኰንነ
  choice: Herrscher
  rationale: Entspricht der politischen Leitungsfunktion des ge'ezischen Titels und klingt im Deutschen würdig und verständlich.
- source_word: ዘየሐውር፡ ወዘያንበቡ
  choice: hinausgehen und ... verkündet werden
  rationale: Gibt die beiden Verben getrennt wieder; das zweite bezeichnet hier das öffentliche Lesen, Ausrufen oder Bekanntmachen eines Namens.
- source_word: ኵሉ፡ ምድር፡ ወአህጉር
  choice: überall auf der Erde und in den Ländern
  rationale: Bewahrt sowohl den weltweiten Ausdruck als auch das anschließende Wort für Länder beziehungsweise Regionen, ohne einen im Ge'ez nicht vorhandenen Possessivbezug einzuführen.
- source_word: እምቅድመ፡ ገጽከ
  choice: vor dir
  rationale: Natürliches Deutsch für die wörtliche Wendung „vor deinem Angesicht“; die räumliche und personale Bedeutung bleibt erhalten.
theological_decisions:
- issue: Fortdauer der Herrschaft in Judas Nachkommenschaft
  choice: „du und einer deiner Söhne“
  alternative: „du und einer von deinen Nachkommen“
  rationale: Die konkrete Formulierung des Quellenwortlauts bleibt erhalten, ohne die Identität oder Reichweite des angekündigten Sohnes theologisch festzulegen.
- issue: Gottesbezeichnung እግዚአ ብሔር
  choice: „der Herr“
  alternative: „Gott, der Herr“
  rationale: Die übliche und kontextgemäße Wiedergabe vermeidet eine nicht ausdrücklich geforderte Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt am Versende bewusst offen, da sie im folgenden Vers weitergeht. Bildhafte Macht- und Furchtsprache wird nicht abgeschwächt.
