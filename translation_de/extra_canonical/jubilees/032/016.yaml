base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: de
  text: Der Herr wird es ihnen in den Mund legen, damit sie die ganze Nachkommenschaft des Geliebten segnen. Deine Mutter nannte dich Levi, und wahrhaftig nannte sie dich so, damit du mit Gott verbunden und ein Gefährte aller Söhne Jakobs würdest. Sein Tisch soll dein sein, und du und deine Söhne sollt davon essen – und für alle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Wortlaut bricht mit „und für alle“ unvermittelt ab.
    reason: Die syntaktisch unvollständige Schlussformulierung wird nicht durch eine vermutete Ergänzung geglättet.
lexical_decisions:
- source_word: አብሔር
  choice: der Herr
  rationale: Die Gottesbezeichnung wird im gegebenen Kontext würdevoll und entsprechend der konsultierten Überlieferung mit „der Herr“ wiedergegeben.
- source_word: ዘርአ ለፍቅር
  choice: die ganze Nachkommenschaft des Geliebten
  rationale: „Nachkommenschaft“ gibt das kollektive „Same“ im heutigen Deutsch natürlich wieder; „des Geliebten“ bewahrt die substantivierte Bezeichnung ohne den Bezug näher festzulegen.
- source_word: እምከ ... ሌዊሃ
  choice: Deine Mutter nannte dich Levi
  rationale: እምከ bedeutet „deine Mutter“; der Satz verweist auf Levis Namensgebung und darf nicht als „aus ihrer Mitte“ verstanden werden.
- source_word: አጸቁ ለእግዚአብሔር
  choice: damit du Gott verbunden würdest
  rationale: Die Wiedergabe bewahrt das etymologische Wortspiel mit dem Namen Levi („verbunden/angeschlossen“) und vermeidet die unbelegte Verengung auf ein bloßes Nahen.
- source_word: ሱታፌ
  choice: Gefährte
  rationale: Das Wort bezeichnet einen Teilhaber, Gefährten oder Genossen; „Gefährte“ ist hier verständlich und lässt die Art der Gemeinschaft offen.
- source_word: ማእዳ ለከ ትኩን
  choice: Sein Tisch soll dein sein
  rationale: Die knappe Besitz- beziehungsweise Teilhabeformulierung des Ausgangstextes wird bewahrt, ohne sie zu „an deinem Tisch essen“ umzudeuten.
theological_decisions:
- issue: Bedeutung der Verbindung Levis mit Gott
  choice: „Gott verbunden“
  alternative: „sich dem Herrn nahen“
  rationale: Der Ausgangstext betont die Verbindung und damit das Namenswortspiel zu Levi. Eine kultische Deutung als Annäherung würde die Aussage stärker festlegen, als der Wortlaut erlaubt.
- issue: Bezug von „sein Tisch“
  choice: Pronomen ohne ausdrückliche Auflösung beibehalten
  alternative: „Gottes Tisch“
  rationale: Der wahrscheinlich auf Gott bezogene Rückverweis bleibt als Pronomen stehen, damit die im Text vorhandene Referenzspannung nicht durch eine erklärende Ergänzung beseitigt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Namensbezug Levis und die knappe, teils schwierige Syntax werden bewahrt; nur dort wird idiomatisch geglättet, wo keine inhaltliche Festlegung entsteht.
