  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: de
  text: 'Lasst uns unsere Tochter keinem Mann mit Vorhaut geben; denn das ist eine Schande für uns. Auch für Israel ist es eine Schande: für die, die geben, und für die, die Frauen von den Töchtern der Völker nehmen; denn es ist unrein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ
  choice: Vorhaut
  rationale: Die konkrete Körperbezeichnung des geezischen Textes wird bewahrt, statt sie lediglich mit „unbeschnitten“ zu umschreiben.
- source_word: ጽእለት
  choice: Schande
  rationale: Gibt die Bedeutung „Schmach, Schande“ in natürlichem, würdigem Gegenwartsdeutsch wieder.
- source_word: አሕዛብ
  choice: Völker
  rationale: Entspricht der üblichen biblischen Bezeichnung für die nichtisraelitischen Völker, ohne die Aussage konfessionell zuzuspitzen.
- source_word: ርኩስ
  choice: unrein
  rationale: Bewahrt die kultisch und moralisch offene Bedeutungsweite des Ausgangswortes.
theological_decisions:
- issue: Bezug des abschließenden „es“
  choice: Das unbestimmte Pronomen „es“ bleibt erhalten.
  alternative: Den Bezug ausdrücklich als Mischehe, Heirat oder Handlung benennen.
  rationale: Der Ausgangstext nennt den Bezug nicht ausdrücklich; eine Konkretisierung würde die echte Mehrdeutigkeit auflösen.
- issue: Ausgelassenes Objekt bei „die geben“ und „die nehmen“
  choice: Die Ellipse des Ausgangstextes wird bewahrt.
  alternative: „die ihre Töchter geben“ und „die Frauen nehmen“ ergänzen.
  rationale: Obwohl der Zusammenhang die Eheschließung nahelegt, stehen diese Objekte nicht ausdrücklich im geezischen Text.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit biblisch-würdigem Ton. Die parallele Satzstruktur und die knappen, im Ausgangstext nicht näher bestimmten Formulierungen bleiben erhalten.
