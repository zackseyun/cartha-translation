  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: de
  text: Und das Land Ägypten litt unter der Hungersnot. Josef erwarb das ganze Land Ägypten für den Pharao gegen Getreide; auch die Menschen und ihr Vieh – alles erwarb er für den Pharao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐመተ
  choice: litt
  rationale: Das Verb bezeichnet hier das Leiden bzw. die schwere Bedrängnis des Landes infolge der Hungersnot.
- source_word: እምቅድመ፡ ገጸ፡ ዐባር
  choice: unter der Hungersnot
  rationale: Die geezische Wendung bedeutet idiomatisch, dass Ägypten angesichts bzw. infolge der Hungersnot litt; eine wörtliche Wiedergabe mit „vor dem Angesicht“ wäre im Deutschen unnötig sperrig.
- source_word: አስተጋብአ
  choice: erwarb
  rationale: Das Kausativverb kann ein Zusammenbringen bzw. Einziehen ausdrücken; im Zusammenhang mit dem Tausch gegen Getreide gibt „erwarb“ den Vorgang natürlich und sachgerecht wieder.
- source_word: በእክል
  choice: gegen Getreide
  rationale: Die Präposition bezeichnet hier das Tauschmittel bzw. die Gegenleistung, nicht bloß das Mittel einer Handlung.
- source_word: ሰብአኒ
  choice: auch die Menschen
  rationale: ሰብእ bedeutet „Menschen/Volk“, und die angefügte Partikel -ኒ hat hier additiven Sinn („auch“); ein Possessivbezug „ihre Menschen“ liegt nicht vor.
- source_word: እንስሳሆሙኒ
  choice: und ihr Vieh
  rationale: Das Wort bezeichnet die Tiere bzw. den Viehbestand der Menschen; das Suffix gibt den Pluralpossessiv „ihr“ wieder, und -ኒ verstärkt die additive Reihung.
- source_word: ኵሎ አጥሪየ
  choice: alles erwarb er
  rationale: አጥሪየ wird als aktives Verb mit Josef als fortgeführtem Subjekt verstanden; ኵሎ ist sein umfassendes Objekt. Dadurch bleibt Josefs aktive Rolle erhalten.
theological_decisions:
- issue: Josefs aktive Rolle beim Übergang von Land, Menschen und Vieh an den Pharao
  choice: „alles erwarb er für den Pharao“
  alternative: „alles wurde Eigentum des Pharaos“
  rationale: Die aktive Verbform nennt Josef als Handelnden. Eine passive Eigentumsformulierung würde diese Aussage abschwächen und eine im Wortlaut nicht ausdrücklich bezeichnete Zustandsänderung einsetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die dichte Schlussreihe und macht deutlich, dass „alles“ Menschen und Vieh zusammenfassend aufnimmt. „Pharao“ steht entsprechend dem deutschen Bibelstil mit bestimmtem Artikel.
