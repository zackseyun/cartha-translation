  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: de
  text: Und die Jahre der Hungersnot gingen zu Ende. Josef gab den Völkern, die im Land waren, Saatgut und Vorräte, damit sie im achten Jahr das Land besäten; denn der Fluss war über das ganze Land Ägypten übergetreten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈጸመ፡ ዓመታት፡ ዐባር
  choice: die Jahre der Hungersnot gingen zu Ende
  rationale: Gibt den Abschluss der Hungerjahre natürlich und inhaltlich genau wieder.
- source_word: ለአሕዛብ፡ ዘውስተ፡ ምድረ
  choice: den Völkern, die im Land waren
  rationale: Bewahrt den Plural von አሕዛብ und den Relativausdruck, ohne die Gruppe enger als im Ausgangstext zu bestimmen.
- source_word: ዘርአ፡ ወሲሳተ
  choice: Saatgut und Vorräte
  rationale: Unterscheidet das zum Säen bestimmte Korn von den zusätzlich ausgegebenen Lebensmitteln beziehungsweise Vorräten.
- source_word: በሳምን፡ ዓመት
  choice: im achten Jahr
  rationale: ሳምን bezeichnet hier eindeutig die Ordinalzahl „acht“; dies passt zudem zum Jahr nach den sieben Hungerjahren.
- source_word: መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: der Fluss war über das ganze Land Ägypten übergetreten
  rationale: Im Zusammenhang mit dem Nil beschreibt „übergetreten“ idiomatisch das Anschwellen beziehungsweise Überfluten des Landes und wahrt die räumliche Aussage des Ge'ez.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Der Fluss“ bleibt entsprechend dem Ausgangstext unbenannt; der ägyptische Kontext macht den Nil erkennbar. Keine Fußnote ist nötig, da die Ge'ez-Lesart „achtes Jahr“ lexikalisch klar ist.
