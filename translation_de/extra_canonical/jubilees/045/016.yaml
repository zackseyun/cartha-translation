  naturalness: „Damit er sie bewahrte und … erneuerte“ ist im modernen Standarddeutschen als Zwecksatz ungrammatisch bzw. missverständlich. Die Infinitivkonstruktion „um sie zu bewahren und … zu erneuern“ ist idiomatisch und wahrt die Aussage. Die Stellung von „bis auf diesen Tag“ wird so gefasst, dass es weiterhin die fortdauernde Bewahrung/Erneuerung kennzeichnet.
  terminology: „Grab“, „Doppelhöhle“, „Bücher seiner Väter“ und „erneuern“ sind angemessen. Die Fußnote wird sprachlich geglättet, ohne die möglichen konkreten Formen des Erneuerns einzuengen.
