  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: de
  text: in dem Grab, das er sich selbst in der Doppelhöhle im Land Hebron gegraben hatte. Und er gab alle seine Bücher und die Bücher seiner Väter seinem Sohn Levi[a], um sie zu bewahren und für seine Kinder bis auf diesen Tag zu erneuern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erneuern“ kann bedeuten, dass Levi die Bücher durch erneutes Abschreiben, Ausbessern oder erneute Weitergabe an spätere Generationen bewahrte.
    reason: lexical_alternative
lexical_decisions:
- source_word: መቃብር (maqāber)
  choice: Grab
  rationale: Bezeichnet hier die für die Bestattung bestimmte Grabstätte; „Grab“ ist im Deutschen natürlich und genau.
- source_word: በዐት፡ ዘካዕበት (baʿat za-kaʿbat)
  choice: Doppelhöhle
  rationale: Gibt die Verbindung aus „Höhle“ und „doppelt“ knapp und traditionsnah wieder, ohne eine zusätzliche Erklärung in den Text einzutragen.
- source_word: ያሐድሶን (yaḥaddəson)
  choice: erneuerte
  rationale: Bewahrt die konkrete und zugleich mehrdeutige Aussage des Verbs „erneuern/wiederherstellen“; im Zusammenhang mit Büchern kann damit besonders erneutes Abschreiben, Ausbessern oder frische Weitergabe gemeint sein.
- source_word: እስከ፡ ዛቲ፡ ዕለት (ʾəska zāti ʿəlat)
  choice: bis auf diesen Tag
  rationale: Formale Wiedergabe der zeitlichen Wendung; ihre mögliche Erzählerperspektive bleibt erhalten.
theological_decisions:
- issue: Bezug von „für seine Kinder“
  choice: Das Possessivpronomen bleibt als „seine“ stehen.
  alternative: „für Levis Kinder“ oder „für seine Nachkommen“
  rationale: Der Ausgangstext nennt Levi unmittelbar zuvor, löst den Bezug aber nicht durch einen Eigennamen auf. Die Übersetzung bewahrt diese grammatische Offenheit und erweitert „Kinder“ nicht zu „Nachkommen“.
- issue: Art der Erneuerung der Bücher
  choice: „erneuerte“ im Haupttext mit erklärender Fußnote
  alternative: „neu abschrieb“, „wiederherstellte“ oder „weiterüberlieferte“
  rationale: Eine Festlegung auf nur einen Vorgang würde die semantische Breite des Quellverbs unnötig einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Satzes bewusst mit Kleinschreibung. Die leicht ungewohnte Formulierung „bis auf diesen Tag erneuerte“ folgt der Struktur und zeitlichen Spannung des Ausgangstextes.
