  yaml_path: translation/extra_canonical/jubilees/045/015.yaml
  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: de
  text: Und er segnete sie und gab Josef einen doppelten Anteil im Land. Dann legte er sich zu seinen Vätern und wurde in der Höhle von Machpela[a] im Land Kanaan begraben, nahe bei seinem Vater Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der doppelten Höhle“. Gemeint ist die andernorts Machpela genannte Ahnengruft.'
    reason: Die Fußnote bewahrt die wörtliche Bedeutung der äthiopischen Bezeichnung und erklärt zugleich die Wiedergabe als Ortsname.
lexical_decisions:
- source_word: ክልኤተ፡ መክፈሊተ
  choice: einen doppelten Anteil
  rationale: Die Wendung bezeichnet wörtlich zwei Anteile und idiomatisch einen Doppelanteil; die deutsche Formulierung ist klar und bewahrt den erbrechtlichen Sinn.
- source_word: ወኖመ፡ ምስለ፡ አበዊሁ
  choice: Dann legte er sich zu seinen Vätern
  rationale: Die traditionelle Todesformel wird in würdigem, verständlichem Deutsch wiedergegeben, ohne sie auf das bloße Verb „sterben“ zu reduzieren.
- source_word: በዐት፡ ዘካዕበት
  choice: Höhle von Machpela
  rationale: Die äthiopische Wendung bedeutet formal „doppelte Höhle“, entspricht hier aber der andernorts als Machpela bekannten Ahnengruft; die Fußnote macht den Wortlaut transparent.
- source_word: ቅሩበ፡ አብርሃም፡ አቡሁ
  choice: nahe bei seinem Vater Abraham
  rationale: Gibt Wortfolge und Beziehung des Ausgangstextes natürlich wieder; „Vater“ kann im genealogischen Sinn „Vorfahr“ einschließen.
theological_decisions:
- issue: Bedeutung der Formel vom Sich-Niederlegen zu den Vätern
  choice: „legte er sich zu seinen Vätern“ beibehalten
  alternative: „starb“
  rationale: Die bildhafte, traditionsreiche Formulierung des Ausgangstextes enthält mehr als eine sachliche Todesmitteilung und sollte nicht eingeebnet werden.
- issue: Abraham als „Vater“ Jakobs
  choice: „sein Vater Abraham“
  alternative: „sein Vorfahr Abraham“
  rationale: Der Ausgangstext nennt Abraham ausdrücklich „seinen Vater“. Die genealogisch weitere Bedeutung von „Vater“ ist im biblischen Sprachgebrauch möglich und bleibt so erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Todesformel. Satzbau und Wortwahl sind für heutige Leser verständlich; der Ortsname Machpela wird im Haupttext verwendet und textnah erläutert.
