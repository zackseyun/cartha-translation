lexical_decisions:
- source_word: ቦአ
  choice: kam in
  rationale: Das Verb bezeichnet das Hineingehen bzw. Eintreten; im Deutschen gibt „kam in“ die räumliche Bewegung hier natürlich und genau wieder.
- source_word: ብሔረ፡ ግብጽ
  choice: das Land Ägypten
  rationale: ብሔር bezeichnet hier ein Land bzw. Gebiet; die traditionelle geografische Wiedergabe ist im Kontext eindeutig.
- source_word: ምድረ፡ ጌሤም
  choice: das Gebiet Goschen
  rationale: ምድር kann „Land“ oder „Gebiet“ bedeuten. „Gebiet“ vermeidet im Deutschen die schwerfällige unmittelbare Wiederholung von „Land“ und bewahrt die geografische Einordnung.
- source_word: አመ፡ ሠርቀ፡ ወርኅ
  choice: am Neumond
  rationale: Die Wendung bezeichnet den Monatsanfang bzw. Neumond; „am Neumond“ bewahrt die kalendarische Ausdrucksweise des Ausgangstextes.
theological_decisions: []
