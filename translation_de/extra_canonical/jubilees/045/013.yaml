  yaml_path: translation/extra_canonical/jubilees/045/013.yaml
  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: de
  text: Und Josef setzte für das Land Ägypten eine Satzung fest, die bis auf diesen Tag gilt. Israel lebte siebzehn Jahre im Land Ägypten. Alle Tage seines Lebens beliefen sich auf drei Jubiläen, auf 147 Jahre. Er starb im vierten Jahr der fünften Woche des fünfundvierzigsten Jubiläums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: Satzung
  rationale: Das Wort bezeichnet hier eine festgesetzte rechtliche Ordnung; „Satzung“ gibt den formellen Charakter im Deutschen knapp und treffend wieder.
- source_word: እስራኤል
  choice: Israel
  rationale: Der im Ausgangstext verwendete Name wird beibehalten, statt ihn stillschweigend durch „Jakob“ zu ersetzen.
- source_word: እዮቤሌውስ
  choice: Jubiläum
  rationale: Die chronologische Einheit des Jubiläenbuches wird mit dem etablierten deutschen Begriff wiedergegeben.
- source_word: ሱባዔ
  choice: Woche
  rationale: Gemeint ist im chronologischen Schema eine Siebenerperiode von Jahren; die knappe Wiedergabe „Woche“ bewahrt die Ausdrucksweise des Ausgangstextes.
theological_decisions:
- issue: Identität Israels in der Erzählung
  choice: Der Name „Israel“ bleibt im Haupttext stehen.
  alternative: „Jakob“ zur unmittelbaren Verdeutlichung einsetzen.
  rationale: Der Ausgangstext nennt ausdrücklich Israel; die Übersetzung bewahrt diese Benennung und löst sie nicht interpretierend auf.
- issue: Chronologische Angaben in Jubiläen und Wochen
  choice: Die überlieferten Einheiten und Ordnungszahlen werden wörtlich bewahrt.
  alternative: Die Angaben in gewöhnliche Jahreszahlen umrechnen oder erklärend harmonisieren.
  rationale: Das besondere Zeitschema ist ein wesentlicher Bestandteil des Textes und soll weder ersetzt noch theologisch oder chronologisch geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Sätzen. Die rechtliche Formulierung und das besondere chronologische Schema des Jubiläenbuches bleiben erkennbar; Zahlen werden zur besseren Lesbarkeit als Ziffern gesetzt.
