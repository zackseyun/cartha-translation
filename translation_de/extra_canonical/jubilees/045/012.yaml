lexical_decisions:
- source_word: ነሥአ
  choice: nahm
  rationale: Gibt das einfache Verb des Nehmens unmittelbar und natürlich wieder.
- source_word: እምኵሉ፡ ዘፈረየ
  choice: von allem, was hervorgebracht wurde
  rationale: Bewahrt den umfassenden Bezug und die passive Formulierung der Vorlage, ohne das Erzeugnis unnötig auf eine bestimmte Art einzugrenzen.
- source_word: ኃምስቶ
  choice: ein Fünftel
  rationale: Bezeichnet den fünften Anteil idiomatisch im Deutschen.
- source_word: ራብዕተ፡ እደ
  choice: vier Teile
  rationale: Gibt die vier verbleibenden Anteile formal wieder und erhält den Gegensatz zum Fünftel.
- source_word: ለሲሲት፡ ወለዘርእ
  choice: zur Nahrung und als Saatgut
  rationale: Unterscheidet den unmittelbaren Verzehr von dem für die Aussaat zurückbehaltenen Samen in natürlichem Deutsch.
