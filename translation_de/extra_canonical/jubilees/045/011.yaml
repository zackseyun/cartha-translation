lexical_decisions:
- source_word: ዓመት
  choice: Jahr
  rationale: Entspricht unmittelbar der ge’ezischen Zeitangabe und bewahrt die chronologische Formulierung.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet eine Siebenerperiode; im chronologischen Zusammenhang des Jubiläenbuches ist mit einer Woche von Jahren zu rechnen. „Jahrwoche“ ist im Deutschen eindeutig und dennoch nah an der Bildsprache des Ausgangstextes.
- source_word: ራብዕ
  choice: vierten
  rationale: Gibt die Ordnungszahl der Jahrwoche formal wieder.
- source_word: እዮቤሌው
  choice: Jubiläums
  rationale: Bewahrt den festen chronologischen Fachbegriff des Buches; der Genitiv fügt sich natürlich in den deutschen Satzbau ein.
- source_word: ዘአርብዓ … [kritischer Zahlenbestand]
  choice: des fünfundvierzigsten
  rationale: Die maßgebliche Lesart der Ausgabe Charles 1895 ergibt „fünfundvierzigsten“. Die im bereitgestellten elektronischen Text auffällige Form scheint fehlerhaft überliefert oder erfasst zu sein; die Unsicherheit wird in der Fußnote offengelegt.
theological_decisions: []
