  text: And that year was the first year of the fourth week of the forty-fifth jubilee[11].
translation:
  language: de
  text: Und jenes Jahr war das erste Jahr der vierten Jahrwoche des fünfundvierzigsten Jubiläums[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Diese chronologische Angabe lässt sich nur schwer mit den früheren Datierungsformeln des Kapitels vereinbaren. Die kritische Lesart der ge’ezischen Ausgabe lautet „fünfundvierzigsten“; die abweichende Zahl in der vorliegenden elektronischen Textanzeige scheint auf einen Erfassungsfehler zurückzugehen.
