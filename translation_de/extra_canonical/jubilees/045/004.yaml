  to: 'von seinem Knecht Jakob: „Wie groß ist es für mich, dass ich dein Angesicht gesehen habe und noch lebe; denn die Erscheinung, die ich in Bet-El sah, hat sich wahrhaftig bestätigt.[a] Gepriesen sei der HERR, mein Gott, bis in alle Ewigkeit, und gepriesen …“[b]'
