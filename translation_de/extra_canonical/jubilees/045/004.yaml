base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/004.yaml
  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: de
  text: 'von seinem Knecht Jakob: „Wie groß ist es für mich, dass ich dein Angesicht gesehen habe und noch lebe; denn die Erscheinung, die ich in Bet-El sah, hat sich wahrhaftig bestätigt.[a] Gepriesen sei der HERR, mein Gott, bis in alle Ewigkeit, und gepriesen …“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „denn wahrhaftig bestand/war die Erscheinung, die ich in Bet-El sah“.'
    reason: Kennzeichnet die mögliche wörtlichere Wiedergabe der knappen geʿezischen Formulierung und bewahrt ihre semantische Spannung.
  - marker: b
    text: Der hier vorgelegte geʿezische Text bricht nach „und gepriesen“ ab. Eine Fortsetzung, etwa „sein Name“, ist in dieser Vorlage nicht belegt.
    reason: Macht den Abbruch der vorgelegten Quelle transparent und vermeidet eine nicht bezeugte Ergänzung im Übersetzungstext.
lexical_decisions:
- source_word: ዐቢይ፡ ሊተ፡ ዘርኢኩ፡ ገጸከ
  choice: 'Groß ist für mich dies: Ich habe dein Gesicht gesehen'
  rationale: Bewahrt die betonte, feierliche Wortstellung des Geʿez, klingt aber im Deutschen noch verständlich.
- source_word: ራእይ
  choice: Erscheinung
  rationale: Gibt eine übernatürliche Schau wieder, ohne sie unnötig auf einen Traum oder eine bestimmte Offenbarungsform festzulegen.
- source_word: አማን፡ ሀለወ
  choice: hat sich wahrhaftig bestätigt
  rationale: Drückt aus, dass die frühere Erscheinung nun als wahr bzw. wirklich erwiesen ist; die wörtlichere Vorstellung des Bestehens wird idiomatisch wiedergegeben.
- source_word: ለዓለመ፡ ዓለም
  choice: für immer und ewig
  rationale: Entspricht der traditionellen emphatischen Ewigkeitsformel und ist im modernen Deutsch natürlich.
theological_decisions:
- issue: Status der Erscheinung von Bet-El
  choice: hat sich wahrhaftig bestätigt
  alternative: war wirklich / bestand wahrhaftig
  rationale: Die Formulierung wahrt den Gedanken, dass Jakobs frühere Schau durch das Wiedersehen bestätigt wurde, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Unvollständiger Schluss im vorgelegten Geʿez-Text
  choice: '[sein Name] als gekennzeichnete Ergänzung'
  alternative: und gepriesen …
  rationale: Der vorgelegte Ausgangstext endet nach „und gepriesen“. Die Ergänzung stellt einen verständlichen Satz her und folgt der geprüften englischen Konsultationsschicht, wird aber durch eckige Klammern transparent als nicht ausdrücklich im vorgelegten Geʿez vorhanden ausgewiesen.
translation_notes:
  register: Feierlich und bibelnah, zugleich in modernem Standarddeutsch verständlich. „Bet-El“ macht die Namensbestandteile sichtbar. Der Vers beginnt offenbar mitten in einem übergeordneten Satz; deshalb steht „von“ am Anfang klein.
