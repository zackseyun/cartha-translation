  terminology: „Erscheinung“ für ራእይ und „Bet-El“ sind angemessen. „Der HERR, mein Gott“ und „bis in alle Ewigkeit“ sind im deutschen Bibelregister idiomatisch. Die unvollständige Schlussformel darf nicht durch eine aus dem englischen Audit Trail übernommene Namensnennung vervollständigt werden.
