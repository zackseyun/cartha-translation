base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/003.yaml
  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: de
  text: '… traf er seinen Vater Jakob im Land Goschen und umarmte ihn und weinte. Israel sagte zu Josef: »Nun kann ich sterben, nachdem ich dich gesehen habe. Und nun sei der HERR gepriesen, der Gott Israels, der Gott Abrahams und der Gott Isaaks, der Barmherzigkeit und Erbarmen erwiesen hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ጌሤም
  choice: Land Goschen
  rationale: Gibt die geografische Bezeichnung in der im Deutschen geläufigen biblischen Form wieder.
- source_word: ወሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: und er fiel seinem Vater um den Hals
  rationale: Natürliches deutsches Idiom für die wörtliche Vorstellung, den Hals des Vaters zu umarmen.
- source_word: እሙት፡ ይእዜሰ
  choice: Nun kann ich sterben
  rationale: Gibt den voluntativ beziehungsweise zulassend wirkenden Sinn idiomatisch wieder, ohne einen Todeswunsch übermäßig zu verstärken.
- source_word: ይትባረክ
  choice: sei … gepriesen
  rationale: Bewahrt den jussivischen Segens- beziehungsweise Lobausruf und klingt im Deutschen würdig und natürlich.
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ
  choice: der Barmherzigkeit und Erbarmen erwiesen hat
  rationale: Folgt der positiven Aussage des überlieferten Textes und vermeidet die unbelegte Umschreibung »nicht vorenthalten«.
theological_decisions:
- issue: Gottesbezeichnung und Lobpreis
  choice: der HERR … sei gepriesen
  alternative: der Herr … werde gesegnet
  rationale: »HERR« entspricht dem üblichen deutschen Bibelregister für den göttlichen Titel; »gepriesen« vermeidet im Deutschen das mögliche Missverständnis, Gott empfange einen Segen von einem Höheren.
- issue: Beschreibung des göttlichen Handelns
  choice: der Barmherzigkeit und Erbarmen erwiesen hat
  alternative: der Barmherzigkeit und Erbarmen nicht vorenthalten hat
  rationale: Der vorliegende ge’ezische Wortlaut stützt eine positive Aussage des Erweisens; eine Negation ist nicht erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Namensform. Die einleitende Ellipse bleibt erhalten, weil der bereitgestellte Versabschnitt syntaktisch offenbar an den vorhergehenden Text anschließt. Die Satzgrenze nach »Goschen« wird mit Semikolon geglättet, ohne fehlendes Material zu ergänzen.
