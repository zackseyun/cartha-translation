  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: de
  text: Und Josef und seine Brüder aßen vor ihrem Vater Brot und tranken Wein. Jakob freute sich überaus, weil er sah, wie Josef mit seinen Brüdern aß und vor ihm trank. Und er pries den Schöpfer von allem, der ihn bewahrt hatte und ihm seine zwölf Söhne erhalten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: Brot
  rationale: Die konkrete Grundbedeutung wird beibehalten; im Kontext bezeichnet das Wort zugleich die gemeinsame Mahlzeit.
- source_word: ተፈሥሐ፡ ... ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: freute sich überaus
  rationale: Die emphatische Verbindung aus Verb, verwandtem Substantiv und Verstärkung wird in natürlichem Deutsch intensiv wiedergegeben, ohne die äthiopische Wortwiederholung mechanisch nachzubilden.
- source_word: ባረኮ
  choice: pries
  rationale: Beim Menschen als Subjekt und dem Schöpfer als Objekt bedeutet das Verb hier, Gott lobend zu segnen beziehungsweise zu preisen; „pries“ ist im Deutschen idiomatisch.
- source_word: ፈጣሪ፡ ኵሉ
  choice: Schöpfer von allem
  rationale: Gibt die umfassende Genitivverbindung eng und theologisch neutral wieder.
- source_word: ዐቀቦ፡ ወዐቀበ፡ ሎቱ
  choice: der ihn bewahrt und ihm ... erhalten hatte
  rationale: Wahrt die zweifache Verwendung desselben Verbstamms und unterscheidet im Deutschen idiomatisch zwischen der Bewahrung Jakobs und der Erhaltung seiner Söhne für ihn.
theological_decisions:
- issue: Gottesbezeichnung
  choice: Schöpfer von allem
  alternative: Schöpfer des Alls
  rationale: Die gewählte Form ist für heutige Leser natürlicher und bewahrt zugleich den universalen Umfang der Aussage.
- issue: Jakobs Lobhandlung
  choice: pries den Schöpfer
  alternative: segnete den Schöpfer
  rationale: „Segnete“ wäre formal näher, klingt im modernen Deutschen bei Gott als Objekt jedoch missverständlich; „pries“ vermittelt die kontextuelle Bedeutung, ohne eine besondere Segenslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer erzählerischer Satzführung. Die zeitliche Vorzeitigkeit der Bewahrung wird im Relativsatz durch das Plusquamperfekt ausgedrückt; die Wiederholung „vor ihrem Vater / vor ihm“ bleibt entsprechend der Quelle erhalten.
