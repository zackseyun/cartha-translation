    issue: Unparallele und grammatisch missverständliche Tempusfügung im Schlusssatz
    rationale: 'Die Quelle wiederholt das Verb „bewahren/erhalten“ für Jakob und für seine zwölf Söhne. Das Deutsche sollte diese Wiederholung mit gleicher, klarer Zeitstufe wiedergeben: „der ihn bewahrt hatte und ihm seine zwölf Söhne erhalten hatte“.'
