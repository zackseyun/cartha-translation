    rationale: Die Fußnote dokumentiert die wörtlichere Wendung und erklärt die idiomatische Übertragung. Da die Hauptfassung weder eine Genehmigung noch unabhängige Königsherrschaft Josefs behauptet, entsteht keine sachliche Verfälschung.
