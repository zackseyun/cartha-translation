  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: de
  text: Und Josef gab seinem Vater und seinen Brüdern Landbesitz, damit sie sich im Land Goschen, in Ramses und dessen ganzem Gebiet niederließen, das er unter dem Pharao verwaltete.[a] So ließen sich Israel und seine Kinder im Land Goschen nieder, dem besten Teil des Landes Ägypten. Israel war hundertdreißig Jahre alt, als er nach Ägypten kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das er vor dem Pharao regierte«.'
    reason: Die ge’ezische Wendung „vor dem Pharao“ kann die Ausübung von Josefs Regierungsamt in der Gegenwart beziehungsweise im Dienst des Pharaos bezeichnen; die Hauptübersetzung gibt dieses Verhältnis idiomatisch als „unter dem Pharao“ wieder.
lexical_decisions:
- source_word: ሀብተ (habta)
  choice: Landbesitz
  rationale: Bezeichnet hier das Josef seiner Familie überlassene Besitztum; „Landbesitz“ macht den räumlichen Bezug deutlich, ohne eine bloße Geld- oder Sachgabe anzunehmen.
- source_word: ይኅደሩ / ኀደረ (yəḥaddaru / ḥadara)
  choice: sich niederließen / ließen sich … nieder
  rationale: Im Zusammenhang mit einem zugewiesenen Wohngebiet ist dauerhafte Ansiedlung gemeint, nicht nur vorübergehendes Wohnen.
- source_word: ይኴንን (yəkwännən)
  choice: verwaltete
  rationale: Das Verb bezeichnet Herrschen, Regieren oder Verwalten. „Verwaltete“ gibt Josefs Regierungsfunktion wieder, ohne ihn als unabhängigen Herrscher neben dem Pharao darzustellen.
- source_word: ውሉዱ (wəludu)
  choice: seine Kinder
  rationale: Der Ausdruck bezeichnet Israels Nachkommen beziehungsweise Kinder; im unmittelbaren Erzählzusammenhang sind seine Söhne mit ihren Familien eingeschlossen.
- source_word: ምሥናይሃ (məśənayha)
  choice: dem besten Teil
  rationale: Das Wort beschreibt Goschen als den vorzüglichen oder besten Teil Ägyptens.
- source_word: ቦአ (boʾa)
  choice: kam
  rationale: Das Verb bedeutet wörtlich „trat ein/ging hinein“; bei einem Land ist im Deutschen „nach Ägypten kam“ idiomatisch und inhaltlich genau.
theological_decisions:
- issue: Josefs Verhältnis zum Pharao in der Relativklausel
  choice: „das er unter dem Pharao verwaltete“ mit Fußnote zur wörtlicheren Form
  alternative: „das er vor dem Pharao beherrschte“ oder „wie es vor dem Pharao genehmigt war“
  rationale: Das ge’ezische Verb bedeutet regieren oder verwalten, nicht genehmigen. „Unter dem Pharao“ bringt im Deutschen Josefs nachgeordnete Regierungsgewalt verständlich zum Ausdruck; die räumlich beziehungsweise höfisch wörtlichere Wendung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge und Wiederholung von „Land Goschen“ bleiben erhalten; sperrige ge’ezische Konstruktionen werden behutsam idiomatisiert, ohne den Aussagegehalt zu glätten.
