  source_fidelity: 'Die Übersetzung folgt dem ge’ezischen Text eng: Josef überlässt Vater und Brüdern Besitz zur Ansiedlung in Goschen/Ramses samt Gebiet; Israel und seine Nachkommen wohnen in Goschen, dem besten Teil Ägyptens; sein Alter bei der Einreise beträgt 130 Jahre. Die umstrittene bzw. syntaktisch schwierige Relativklausel wird zutreffend als Josefs Verwaltungs- bzw. Regierungshandeln verstanden, nicht als eine Genehmigung durch den Pharao.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Erzählregister. „Landbesitz“, „sich niederlassen“ und „nach Ägypten kam“ sind idiomatisch. Die Wiederholung von „Land Goschen“ entspricht der textlichen Gliederung und ist nicht störend.
  terminology: Namen und Ortsnamen sind konsistent wiedergegeben. „Landbesitz“ trifft den hier gemeinten zugewiesenen Besitz; „verwaltete“ ist für Josefs dem Pharao nachgeordnete Herrschaftsausübung eine sachgerechte, nicht überdehnte Wiedergabe. „Kinder“ ist als Übersetzung von ውሉዱ zulässig und wahrt gegenüber „Söhne“ die mögliche weitere Bedeutung von Nachkommen.
  issues:
