- from: Bevor Israel starb, segnete er seine Söhne und berichtete ihnen alles, was ihnen im Land Ägypten widerfahren würde. Auch ließ er sie wissen, was in späteren Tagen über sie kommen würde.
  to: Bevor Israel starb, segnete er seine Söhne und sagte ihnen alles voraus, was ihnen im Land Ägypten widerfahren würde, und machte ihnen bekannt, was in späteren Tagen über sie kommen würde.
  rationale: Die Revision ersetzt zwei stilistisch beziehungsweise semantisch weniger passende Verben durch idiomatische, quellennähere Formulierungen. Sie bewahrt die zwei koordinierten Mitteilungen, die Zukunftsperspektive und die offene Bedeutung von „späteren Tagen“. Fußnoten sind nicht nötig, da die deutsche Fassung keine erläuterungsbedürftige Textvariante oder Mehrdeutigkeit über die Übersetzung hinaus festlegt.
