  yaml_path: translation/extra_canonical/jubilees/045/014.yaml
  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: de
  text: Bevor Israel starb, segnete er seine Söhne und sagte ihnen alles voraus, was ihnen im Land Ägypten widerfahren würde, und machte ihnen bekannt, was in späteren Tagen über sie kommen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘእንበለ፡ ይሙት
  choice: Bevor Israel starb
  rationale: Die Wendung bezeichnet die Zeit vor seinem Tod; im Deutschen ist die vorangestellte Nebensatzkonstruktion natürlich und klar.
- source_word: ወባረኮሙ
  choice: segnete er
  rationale: Gibt das Verb für „segnen“ unmittelbar wieder.
- source_word: ለውሉዱ
  choice: seine Söhne
  rationale: Im Kontext sind Israels männliche Nachkommen beziehungsweise Söhne gemeint.
- source_word: ወነገሮሙ
  choice: und berichtete ihnen
  rationale: Das Verb bedeutet „sagen/erzählen/mitteilen“; „berichtete“ passt zu der ausführlichen Ankündigung dessen, was geschehen würde.
- source_word: ይረክቦሙ
  choice: ihnen … widerfahren würde
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den Sinn von etwas, das sie treffen beziehungsweise ihnen begegnen wird.
- source_word: በምድረ፡ ግብጽ
  choice: im Land Ägypten
  rationale: Formnahe und im biblischen Register geläufige Wiedergabe.
- source_word: በደኃሪ፡ መዋዕል
  choice: in späteren Tagen
  rationale: Bewahrt die zeitliche, eschatologisch offene Formulierung, ohne sie auf eine bestimmte Endzeitlehre festzulegen.
- source_word: ዘከመ፡ ይመጽእ፡ ላዕሌሆሙ
  choice: was … über sie kommen würde
  rationale: Gibt die räumliche Metapher „über sie kommen“ wieder und entspricht der prädiktiven Aussage.
- source_word: እይድያሙ
  choice: ließ er sie wissen
  rationale: Folgt der textkritisch erschlossenen Bedeutung „er machte ihnen bekannt“ und bildet ein eigenes Prädikat für den Schlussabschnitt.
theological_decisions:
- issue: Bedeutung von „spätere Tage“
  choice: in späteren Tagen
  alternative: am Ende der Tage
  rationale: Die allgemeinere Zeitangabe bewahrt die Offenheit des ge'ezischen Ausdrucks und vermeidet eine unbegründete Festlegung auf ein technisches eschatologisches Verständnis.
- issue: Bezug der angekündigten Ereignisse
  choice: 'zwei parallele Mitteilungen: in Ägypten und in späteren Tagen'
  alternative: eine einzige Mitteilung über Ereignisse in Ägypten und späteren Tagen
  rationale: Das erschlossene Schlussverb „ließ er sie wissen“ stützt eine zweite, parallele Aussage; die inhaltliche Beziehung bleibt dennoch eng.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die parallelen Zukunftsaussagen verständlich, ohne die prophetische Spannung zu erklären oder konfessionell auszudeuten.
