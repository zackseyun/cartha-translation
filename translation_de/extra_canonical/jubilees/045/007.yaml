  text: And Joseph sustained his father and his brothers, and all their livestock, as was sufficient for them during the seven years of famine.
translation:
  language: de
  text: Und Josef versorgte seinen Vater, seine Brüder und ihren gesamten Viehbestand mit so viel, wie sie während der sieben Hungerjahre brauchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሴሰዮሙ
  choice: versorgte
  rationale: Das Verb bezeichnet hier das Ernähren bzw. Unterhalten während einer Hungersnot; „versorgte“ gibt den Sinn natürlich wieder und kann alle folgenden Objekte gemeinsam regieren.
- source_word: ጥሪቶሙ
  choice: ihren gesamten Viehbestand
  rationale: Der Ausdruck bezeichnet in diesem Zusammenhang ihren Tier- bzw. Viehbestand und ist konkreter als „alles, was ihnen gehörte“.
- source_word: በከመ፡ የአክሎሙ
  choice: mit so viel, wie sie … brauchten
  rationale: Die Wendung drückt eine ihrem Bedarf entsprechende, ausreichende Versorgung aus.
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: während der sieben Hungerjahre
  rationale: Dies gibt Zeitdauer und Hungersnot knapp und idiomatisch wieder.
