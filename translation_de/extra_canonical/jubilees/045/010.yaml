  terminology: »Hungerjahre«, »bewässert«, »Getreide« und »über die Ufer treten« sind sachgerecht. Die Fußnote bewahrt die mögliche Nuance des Anschwellens beziehungsweise Steigens, ohne die kontextuell passende Hauptwiedergabe zu verdrängen.
