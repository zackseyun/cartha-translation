base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/010.yaml
  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: de
  text: Denn während der sieben Hungerjahre war der Fluss nicht über die Ufer getreten[a] und hatte das Land nicht bewässert, außer an wenigen Stellen an den Ufern des Flusses. Nun aber trat er über die Ufer, und die Ägypter besäten das Land und brachten in jenem Jahr sehr viel Getreide ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war nicht angeschwollen«.'
    reason: Die Form kann das Anschwellen beziehungsweise Steigen des Flusses ausdrücken; im Kontext ist das Übertreten über die Ufer gemeint.
lexical_decisions:
- source_word: ዐባር
  choice: war der Fluss nicht über die Ufer getreten
  rationale: Das Verb bezeichnet hier im Zusammenhang mit dem Nil sein Anschwellen beziehungsweise Übertreten; das im Deutschen ergänzte Subjekt »der Fluss« ergibt sich aus dem folgenden ፈለግ.
- source_word: ኢሰቀየ
  choice: hatte das Land nicht bewässert
  rationale: Das Ge'ez-Verb ሰቀየ bedeutet »tränken, bewässern«; dies erhält die sachliche Aussage über die ausbleibende Bewässerung während der Hungersnot.
- source_word: መካን፡ ኀበ፡ ድንጋጌ፡ ፈለግ
  choice: an wenigen Stellen am Flussufer
  rationale: Die Wendung bezeichnet wenige Orte beziehungsweise Stellen beim Rand oder Ufer des Flusses.
- source_word: ዘርኡ፡ ግብጽ፡ ምድረ
  choice: die Ägypter besäten das Land
  rationale: Das wörtliche »Ägypten besäte das Land« wird als natürliche Bezeichnung der Bewohner wiedergegeben, ohne den Sinn zu verändern.
- source_word: አረሩ፡ ብዙኀ፡ ሥርናየ
  choice: brachten sehr viel Getreide ein
  rationale: Das Verb bezeichnet das Ernten beziehungsweise Einbringen; ሥርናይ wird allgemein mit »Getreide« wiedergegeben.
