  text: fourth, in the second year of the third week of the forty-second[2] jubilee. And Joseph came to receive him.
translation:
  language: de
  text: vierten[b], im zweiten Jahr der dritten Jahrwoche des zweiundvierzigsten[a] Jubiläums. Und Josef kam, um ihn zu empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Text lautet wörtlich „zweiundvierzigsten“ (፵ወ፪). Nach der Binnenchronologie des Jubiläenbuches wäre jedoch das fünfundvierzigste Jubiläum zu erwarten.
    reason: textual_variant
  - marker: b
    text: „vierten“ setzt offenbar eine Monatsangabe aus dem vorhergehenden Vers fort. Eine frühere Wiedergabe ergänzte hier „im vierten Jahr“, doch unmittelbar danach nennt der Text das zweite Jahr.
    reason: verse_segmentation
lexical_decisions:
- source_word: ራብዕ
  choice: vierten
  rationale: Der Ordinal steht im überlieferten Ausschnitt ohne Substantiv und setzt offenbar die Monatsangabe des vorhergehenden Verses fort. Die elliptische Form wahrt den vorliegenden Versschnitt, ohne das nicht belegte Wort „Jahr“ einzufügen.
- source_word: ዓመት፡ ዘሰብዓ፡ ሣልስ
  choice: im zweiten Jahr der dritten Jahrwoche
  rationale: Gibt die gestufte Jubiläenchronologie verständlich und nahe an der ge’ezischen Konstruktion wieder.
- source_word: ዘ፵ወ፪ እዮቤልው
  choice: des zweiundvierzigsten Jubiläums
  rationale: Folgt dem ausdrücklich bezeugten Zahlwert ፵ወ፪, obwohl die Binnenchronologie eine andere Zahl erwarten lässt; die Schwierigkeit wird in der Fußnote offengelegt.
- source_word: ወመጽአ፡ ዮሴፍ፡ ይትቀበል
  choice: Und Josef kam, um ihn zu empfangen
  rationale: Bewahrt sowohl die einleitende Konjunktion als auch die finale Aussage des Verbs; das pronominale Objekt wird entsprechend dem Kontext wiedergegeben, ohne weitere Handlungselemente hinzuzufügen.
