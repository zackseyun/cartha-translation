  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Satzstruktur bleibt dem antiken Begründungsgang nahe, wird jedoch idiomatisch geglättet. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
