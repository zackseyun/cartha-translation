lexical_decisions:
- source_word: ተዐቀብኩ፡ በመንፈስየ
  choice: habe ich über meinen Geist gewacht
  rationale: Bewahrt die reflexiv-innere Wachsamkeit des Ausdrucks in natürlichem, würdigem Deutsch, ohne ihn auf bloße Selbstbeherrschung zu verengen.
- source_word: ኢየአብስ
  choice: damit ich nicht sündige
  rationale: Gibt das Verb direkt und idiomatisch wieder.
- source_word: ኢይማስን፡ በኵሉ፡ ፍናውየ
  choice: auf keinem meiner Wege unrein werde
  rationale: Folgt der moralischen Verunreinigung im Kontext und lässt die im Ausdruck mögliche alternative syntaktische Zuordnung in der Fußnote sichtbar.
- source_word: ምርዐት፡ ወዝሙት
  choice: Ausschweifung und Unzucht
  rationale: Unterscheidet zügelloses sexuelles Verhalten vom konkreteren Begriff sexueller Unmoral und wahrt den feierlichen Registerton.
- source_word: አብዝኀ፡ ... አዝዘትየ
  choice: gab mir ... viele Gebote
  rationale: Gibt die Vielzahl väterlicher Weisungen klar wieder; „Gebote“ entspricht dem verpflichtenden Charakter.
theological_decisions:
- issue: Bezug von Verunreinigung beziehungsweise Verderbnis
  choice: 'Der Haupttext bezieht die Verunreinigung auf die Sprecherin innerhalb ihrer Lebensführung: „auf keinem meiner Wege unrein werde“.'
  alternative: Der Satz kann auch so verstanden werden, dass sie sich selbst nicht verunreinigt und ihre Wege nicht verdorben werden.
  rationale: Die überlieferte Formulierung lässt Spielraum hinsichtlich Diathese und syntaktischem Bezug. Der Haupttext bietet eine gut verständliche Lesart, während die Fußnote die echte Mehrdeutigkeit wahrt.
