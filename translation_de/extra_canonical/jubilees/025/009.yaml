  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: de
  text: Und deshalb habe ich über meinen Geist gewacht[a], damit ich alle Tage meines Lebens auf keinem meiner Wege sündige oder unrein werde; denn wegen Ausschweifung und Unzucht gab mir mein Vater Abraham viele Gebote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung kann auch so verstanden werden: „damit ich mich nicht verunreinige und meine Wege nicht verdorben werden“.'
