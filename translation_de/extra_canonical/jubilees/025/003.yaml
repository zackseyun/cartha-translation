  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: de
  text: Denn ihr ganzes Tun ist Unzucht und Unreinheit, und bei ihnen ist keine Gerechtigkeit; denn es ist böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ምግባሮሙ
  choice: ihr ganzes Tun
  rationale: Gibt die Gesamtheit ihres Handelns natürlich und zugleich eng am geʿezischen Ausdruck wieder.
- source_word: ዝሙት
  choice: Unzucht
  rationale: Bewahrt den deutlich sexuellen und moralischen Sinn des Ausgangswortes in würdigem, allgemein verständlichem Deutsch.
- source_word: ምርጓት
  choice: Begierde
  rationale: Entspricht dem Sinnfeld von Begehren beziehungsweise Lust; die Übersetzung vermeidet eine unnötige Festlegung auf bloße kultische Unreinheit.
- source_word: ጽድቀ
  choice: Gerechtigkeit
  rationale: Der übliche sachgerechte Ausdruck für moralische beziehungsweise rechte Beschaffenheit.
- source_word: እኩይ
  choice: böse
  rationale: Gibt die abschließende moralische Wertung knapp wieder und erhält den unpersönlichen Bezug des Satzes.
theological_decisions:
- issue: Bezug des abschließenden »es«
  choice: 'Unpersönlich formuliert: »denn es ist böse«'
  alternative: »denn sie sind böse« oder »denn ihr Tun ist böse«
  rationale: Der geʿezische Text hat eine singularische prädikative Aussage. Die gewählte Form bewahrt die mögliche Rückbeziehung auf das gesamte zuvor beschriebene Verhalten, ohne den Bezug ausdrücklich auf die Personen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Folge »Unzucht und Begierde« sowie die Wiederholung von »denn« erhalten die knappe, eindringliche Struktur des Ausgangstextes.
