  yaml_path: translation/extra_canonical/jubilees/025/002.yaml
  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: de
  text: 'Und sie sagte zu ihm: „Mein Sohn, nimm dir keine Frau von den Töchtern Kanaans, wie es dein Bruder Esau getan hat. Er nahm sich zwei Frauen von den Töchtern Kanaans, und durch ihr ganzes unreines Verhalten haben sie meinen Geist verbittert.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: nimm dir keine Frau
  rationale: Gibt die Verbotsform und die reflexive Wendung idiomatisch und zugleich quellennah wieder.
- source_word: አዋልደ፡ ከናአን
  choice: Töchter Kanaans
  rationale: Bewahrt die traditionelle genealogische Bezeichnung des Ausgangstextes.
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: haben sie meinen Geist verbittert
  rationale: Erhält das konkrete Bild des Bittermachens und gibt መንፈሰያ formal mit „meinen Geist“ wieder.
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: durch ihr ganzes unreines Verhalten
  rationale: Fasst die distributive Aussage natürlich auf Deutsch, ohne die moralisch-kultische Offenheit von „unrein“ einzuengen.
theological_decisions:
- issue: Bedeutungsumfang von „unrein“
  choice: unreines Verhalten
  alternative: verwerfliches Tun
  rationale: „Unrein“ bewahrt die mögliche kultische wie moralische Spannung des Quellbegriffs, statt ihn ausschließlich moralisch auszulegen.
- issue: Anthropologische Bedeutung von „Geist“
  choice: meinen Geist
  alternative: mein Innerstes / mich zutiefst
  rationale: Die formale Wiedergabe lässt offen, ob der Ausdruck die Lebenskraft, das innere Gemüt oder die ganze Person bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende parataktische Verbindung „Und“ sowie die familiäre Anrede bleiben erhalten; der lange Ausgangssatz wird zur besseren Verständlichkeit in zwei Sätze gegliedert.
