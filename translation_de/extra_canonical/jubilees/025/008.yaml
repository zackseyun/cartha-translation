  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: de
  text: Und ich hatte schon früher gehört, dass deinem Bruder Laban Töchter geboren worden waren. Auf sie richtete ich mein Herz, um mir eine von ihnen zur Frau zu nehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕኩ፡ እምቀዲሙ፡
  choice: ich hatte schon früher gehört
  rationale: Gibt das Hören mit der Zeitangabe „zuvor/früher“ natürlich wieder und macht im erzählerischen Rückblick die Vorzeitigkeit deutlich.
- source_word: ትወልዲ፡ አዋልደ፡
  choice: Töchter geboren worden waren
  rationale: Bewahrt die passive Aussage über die Geburt der Töchter und entspricht dem rückblickenden Zusammenhang.
- source_word: ለላባ፡ እኁኪ፡
  choice: deinem Bruder Laban
  rationale: Gibt die Genitivbeziehung und die direkte Anrede knapp und eindeutig wieder.
- source_word: ወላዕሌሆን፡ አንበርኩ፡ ልብየ፡
  choice: Auf sie richtete ich mein Herz
  rationale: Bewahrt das konkrete semitische Bild vom Ausrichten beziehungsweise Setzen des Herzens, ohne es vorschnell als bloßes Gefallen oder als feste Entscheidung auszulegen.
- source_word: ከመ፡ እንሣእ፡ እምኔሆን፡ ብእሲተ።
  choice: um mir eine von ihnen zur Frau zu nehmen
  rationale: Gibt Zweck, Auswahl aus der Gruppe und Eheschließungsabsicht in idiomatischem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung des Bildes vom auf die Töchter gerichteten Herzen
  choice: „Auf sie richtete ich mein Herz“
  alternative: „Ich fasste den Entschluss, eine von ihnen zu heiraten“
  rationale: Die bildhafte Formulierung lässt offen, in welchem Maß Zuneigung, Absicht oder Entschlossenheit gemeint ist, und vermeidet eine theologisch oder psychologisch verengende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die inhaltliche Verknüpfung aufzulösen. Das Quellenbild „das Herz auf jemanden richten“ bleibt bewusst erhalten.
