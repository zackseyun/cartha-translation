lexical_decisions:
- source_word: አትፍርሂ
  choice: Hab keine Angst
  rationale: Gibt den negierten Imperativ in natürlichem, modernem Deutsch wieder.
- source_word: ትእመኒ
  choice: Verlass dich darauf
  rationale: Bewahrt den Gedanken des Vertrauens beziehungsweise der Gewissheit und passt zur direkten Anrede der Mutter.
- source_word: እገብር ፈቃደኪ
  choice: deinen Willen tun
  rationale: Nahe und idiomatische Wiedergabe der Aussage, dass der Sprecher dem Wunsch beziehungsweise Willen der Mutter folgen wird.
- source_word: ወበርትዕ አሐውር
  choice: aufrichtig leben
  rationale: Das wörtliche Bild des aufrechten Gehens wird als geläufige deutsche Aussage über die Lebensführung wiedergegeben.
- source_word: ወኢያማስን ፍናውየ ለዓለም
  choice: meine Wege niemals verderben
  rationale: Bewahrt das Wegmotiv und gibt ለዓለም in diesem negierten Zusammenhang idiomatisch als „niemals“ wieder.
theological_decisions:
- issue: Metapher der sittlichen Lebensführung
  choice: aufrichtig leben … meine Wege … verderben
  alternative: in Aufrichtigkeit wandeln … meine Wege … verderben
  rationale: Die Formulierung bleibt bildhaft, ist aber für heutige Leser natürlicher; eine besondere konfessionelle Deutung wird nicht eingetragen.
translation_notes:
  register: Direkte, respektvolle Rede in modernem Standarddeutsch. Der Ton ist würdevoll und verständlich; die Wegmetaphorik des Schlusssatzes bleibt erhalten.
