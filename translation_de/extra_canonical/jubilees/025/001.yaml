lexical_decisions:
- source_word: ወበካልእ፡ ዓመት፡
  choice: Und im zweiten Jahr
  rationale: Gibt die zeitliche Einleitung und die Ordinalzahl direkt und natürlich wieder.
- source_word: ዘዝ፡ ሱባዔ፡
  choice: dieser Woche
  rationale: Bewahrt das Demonstrativpronomen »dieser«; der Text sagt nicht ausdrücklich »der siebten Woche«.
- source_word: በዝ፡ አምቤልዉ፡
  choice: in diesem Jubiläum
  rationale: Entspricht der demonstrativen Wendung und wahrt die jubilarische Zeitrechnung.
- source_word: ጸውዐት፡ ርብቃ፡ ያዕቆብሃ፡ ወልዳ፡
  choice: rief Rebekka ihren Sohn Jakob zu sich
  rationale: Gibt Subjekt und verwandtschaftliche Apposition klar wieder; »zu sich« ist im Deutschen die natürliche Ergänzung bei einer persönlichen Vorladung.
