  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: de
  text: 'Ich aber, mein Sohn, liebe dich über alle Maßen, und mein Herz und meine Zuneigung segnen dich zu jeder Zeit: am Tag und während der Nachtwachen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlusswendung ist in dieser Textzeile sprachlich beziehungsweise hinsichtlich ihrer Abgrenzung schwierig; am besten ist sie als umfassende Zeitangabe zu verstehen: „am Tag und während der Nachtwachen“.'
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: liebe dich über alle Maßen
  rationale: Die gehäufte Verstärkung wird in natürliches, würdiges Deutsch übertragen, ohne ihre starke Aussage abzuschwächen.
- source_word: ምሕረትየ
  choice: meine Zuneigung
  rationale: Das Wort kann Erbarmen, Mitgefühl oder liebevolle Zuneigung bezeichnen. Im unmittelbaren Zusammenhang mit der Liebe einer Mutter zu ihrem Sohn gibt „Zuneigung“ den Sinn natürlich wieder, ohne eine engere theologische Bedeutung einzutragen.
- source_word: ዐቃቤ፡ ለያልይ
  choice: während der Nachtwachen
  rationale: Die Wendung bezeichnet die Wachzeiten beziehungsweise Abschnitte der Nacht; „Nachtwachen“ bewahrt das antike Bild in verständlichem Deutsch.
