    issue: Abgeschlossene Vergangenheit in „Doch ich war nicht bereit“
    rationale: Die ge’ezische Aussage beschreibt Jakobs Weigerung gegenüber dem lang andauernden Drängen. „Ich habe nicht tun wollen“ bewahrt diesen bis zum Sprechzeitpunkt reichenden Aspekt besser als „war nicht bereit“.
  - severity: low
    issue: Zusatznuance „Immer wieder“ und leicht markierte Wortstellung
    rationale: „Immer wieder“ formuliert eine ausdrücklich iterative Aussage, während der Text das Sprechen als Begleitumstand des Drängens ausdrückt. Die Umstellung zu „Esau drängt und bedrängt mich“ ist im heutigen Deutsch klarer und natürlicher.
