  yaml_path: translation/extra_canonical/jubilees/025/010.yaml
  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: de
  text: 'Und trotz allem, was er mir aufgetragen hat,[a] drängt und bedrängt Esau mich nun schon seit zweiundzwanzig Jahren,[b] indem er zu mir sagt: »Mein Bruder, nimm dir eine Frau, eine von den Schwestern meiner beiden Frauen!« Doch ich habe nicht tun wollen, wie er es getan hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und bei all dem, was er mir aufgetragen hat«. Die Verbindung kann additiv oder konzessiv verstanden werden.'
    reason: textual_ambiguity
  - marker: b
    text: Die Zeitangabe beschreibt offenbar Esaus über zweiundzwanzig Jahre anhaltendes Drängen, nicht ein einzelnes Ereignis.
    reason: cultural_note
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ
  choice: Und trotz allem, was er mir aufgetragen hat
  rationale: Gibt die einleitende Verbindung samt dem ausdrücklich vorhandenen Verb ዘአዘዘኒ („was er mir befahl/auftrug“) wieder. „Trotz“ bringt den im Zusammenhang naheliegenden Gegensatz zur abschließenden Weigerung zum Ausdruck, ohne die alternative, stärker additive Lesart zu verschweigen.
- source_word: ዕሥራ፡ ወክልኤተ፡ ዓመተ
  choice: nun schon seit zweiundzwanzig Jahren
  rationale: Die Zeitangabe bezeichnet eine anhaltende Einwirkung über zweiundzwanzig Jahre; „nun schon seit“ ist dafür im modernen Deutschen natürlich.
- source_word: ይትኃአዘኒ፡ ወያበዝኀ
  choice: drängt und bedrängt ... mich
  rationale: Bewahrt die zwei parallelen Verben und ihre steigernde Wirkung, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: እኁየ
  choice: Mein Bruder
  rationale: Entspricht der direkten Anrede und bewahrt den familiären Ton.
- source_word: ንሣእ፡ ብእሲተ
  choice: nimm dir eine Frau
  rationale: Natürliches modernes Deutsch für die Aufforderung, eine Frau zu heiraten, bei zugleich enger Bindung an das Verb „nehmen“.
- source_word: ወአነኒ፡ ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: Doch ich war nicht bereit, es ihm gleichzutun
  rationale: Gibt Jakobs fehlende Bereitschaft und den Vergleich mit Esaus Handeln prägnant wieder, ohne ein über den Text hinausgehendes Motiv einzuführen.
theological_decisions:
- issue: Bezug des nicht genannten Subjekts in „was er mir aufgetragen hat“
  choice: Das Pronomen „er“ bleibt ohne erklärende Identifizierung stehen.
  alternative: Den in der vorausgehenden Erzählung gemeinten Sprecher ausdrücklich beim Namen nennen.
  rationale: Der Vers selbst nennt das Subjekt nicht; eine ausdrückliche Identifizierung würde eine kontextuelle Deutung in den Haupttext eintragen.
- issue: Art des Gegensatzes am Versanfang
  choice: Die Verbindung wird konzessiv mit „trotz“ wiedergegeben.
  alternative: 'Additiv: „Und zusammen mit all dem“ oder „Und bei all dem“.'
  rationale: Der Schluss des Verses stellt Jakobs Weigerung Esaus anhaltendem Drängen gegenüber. Da die Ge’ez-Verbindung auch näher bei „mit/bei all dem“ liegen kann, wird diese Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Sprechakts im Ge’ez wird idiomatisch durch „Immer wieder sagt er“ ausgedrückt; die beiden Verben für Esaus Drängen bleiben als „drängt und bedrängt“ erhalten. Beide Fußnotenmarker stehen an ihren jeweiligen Ankerstellen im Haupttext.
