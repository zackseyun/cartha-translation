base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/011.yaml
  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: de
  text: Ich schwöre dir, solange ich lebe, dass ich mir keine Frau aus den Töchtern der Nachkommenschaft Kanaans nehmen und nicht böse handeln werde, wie Esau es getan hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… und ich werde nichts Böses tun, wie Esau es getan hat.«'
    reason: Die geʿezische Wendung verbindet ein Verb des bösen Handelns mit »tun«; die genaue syntaktische Verbindung lässt sich im Deutschen unterschiedlich ausdrücken.
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: Ich schwöre dir
  rationale: Die Schwurformel wird in natürlichem Deutsch wiedergegeben; das feminine Suffix bezeichnet die angesprochene Frau.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: bei allen Tagen meines Lebens
  rationale: Bewahrt die zeitlich umfassende und feierliche Formulierung des Ge’ez, ohne sie zu einem bloßen »solange ich lebe« abzuschwächen.
- source_word: ብእሲተ፡ እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: eine Frau von den Töchtern aus dem Geschlecht Kanaans
  rationale: Gibt sowohl »Töchter« als auch »Same/Nachkommenschaft« wieder; »Geschlecht« ist im Deutschen idiomatischer als »Same«.
- source_word: ወኢያአኪ፡ ገቢረ
  choice: und nicht so böse handeln werde
  rationale: Das Verb ያአኪ trägt ausdrücklich die Bedeutung des Bösen beziehungsweise schlechten Handelns und darf nicht zu einem neutralen »tun« abgeschwächt werden.
- source_word: በከመ፡ ገብረ፡ ዔሳው
  choice: wie Esau es getan hat
  rationale: Die Vergleichsformel wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Moralische Bewertung von Esaus Handeln
  choice: »böse handeln« ausdrücklich im Haupttext
  alternative: »handeln/tun, wie Esau es getan hat«
  rationale: Die negative Bewertung beruht auf dem Ge’ez-Verb und ist keine nachträgliche konfessionelle Deutung. Die syntaktische Beziehung der beiden Verben bleibt jedoch etwas schwierig, weshalb eine Fußnote die engere Wiedergabe nennt.
translation_notes:
  register: Feierlich und gelöbnisartig, zugleich in modernem Standarddeutsch. »Geschlecht Kanaans« vermeidet das heute missverständliche »Same Kanaans«. Die weibliche Anrede ist in der deutschen Form »dir« nicht eigens markiert.
