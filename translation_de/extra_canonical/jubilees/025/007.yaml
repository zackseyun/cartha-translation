base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/007.yaml
  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: de
  text: Denn ich erinnere mich an das Wort Abrahams, unseres Vaters,[a] denn er gebot mir, keine Frau von den Töchtern Kanaans zu nehmen, sondern mir eine Frau aus der Nachkommenschaft meines Vaterhauses und aus meiner Verwandtschaft zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an das, was Abraham, unser Vater, mir sagte: Er gebot mir …«'
    reason: Die Wortfolge am Versanfang kann entweder substantivisch als Erinnerung an ‚das Wort‘ Abrahams oder als Bezug auf das von ihm Gesagte verstanden werden.
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ፡
  choice: das Wort Abrahams, unseres Vaters
  rationale: Bewahrt die substantivische Formulierung des geʿezischen Textes, ohne sie dynamisch als direkte Mitteilung aufzulösen.
- source_word: ኢይንሣእ፡ ብእሲተ፡ እምአወልደ፡ ከናአን፡
  choice: keine Frau von den Töchtern Kanaans zu nehmen
  rationale: Gibt Verbot, Verb und Herkunftsangabe eng am Ausgangstext und zugleich in natürlichem Deutsch wieder.
- source_word: እምዘርአ፡ ቤተ፡ አቡየ፡
  choice: aus der Nachkommenschaft meines Vaterhauses
  rationale: ‚Nachkommenschaft‘ vermittelt ዘርእ (Same, Nachkommen) im genealogischen Sinn; ‚Vaterhaus‘ fasst die geʿezische Verbindung idiomatisch zusammen.
- source_word: ወእምዘመድየ፡
  choice: und aus meiner Verwandtschaft
  rationale: Bewahrt die zusätzliche, mit ‚und‘ verbundene Herkunftsbestimmung.
theological_decisions:
- issue: Verwandtschaftsgebot und kanaanäische Frauen
  choice: Die beiden Herkunftsbestimmungen werden ohne Harmonisierung oder konfessionelle Ausdeutung wiedergegeben.
  alternative: Die Aussage als allgemeines religiöses Verbot von Mischehen erläutern.
  rationale: Der Vers formuliert ein konkretes familiäres Gebot; eine weitergehende theologische Anwendung steht nicht ausdrücklich im Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »nehmen« folgt bewusst der Parallelstruktur des Ausgangstextes; »Vaterhaus« und »Nachkommenschaft« erhalten den genealogisch-familiären Ton.
