  yaml_path: translation/extra_canonical/jubilees/025/005.yaml
  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: de
  text: Und nun, mein Sohn, höre auf meine Stimme und tu, was deine Mutter will. Nimm dir keine Frau von den Töchtern dieses Landes, sondern nimm dir eine Frau aus dem Haus meines Vaters und aus der Verwandtschaft meines Vaters.[a] Und Gott, der Höchste, wird dich segnen, und deine Kinder werden ein gerechtes Geschlecht und ein heiliger Same sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im überlieferten Wortlaut wird die Wendung „aus dem Haus meines Vaters“ in diesem Satz offenbar wiederholt. Das kann eine nachdrückliche Ausdrucksweise oder eine Unregelmäßigkeit der Textgliederung widerspiegeln.
    reason: segmentation_note
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ
  choice: höre auf meine Stimme
  rationale: Gibt die wörtliche Redeweise des Ge'ez wieder und drückt zugleich natürlich die Aufforderung zum Gehorsam aus.
- source_word: አዋልደ፡ ዝምድር
  choice: Töchter dieses Landes
  rationale: Bewahrt die konkrete Verwandtschafts- und Herkunftsbezeichnung des Ausgangstextes.
- source_word: ትውልደ፡ ጽድቅ
  choice: ein gerechtes Geschlecht
  rationale: Gibt die kollektive Nachkommenschaft wieder, ohne sie auf einzelne moralisch rechtschaffene Kinder zu verengen.
- source_word: ዘርአ፡ ቅዱሰ
  choice: ein heiliger Same
  rationale: Bewahrt die traditionsreiche Metapher und ihren theologischen Klang.
theological_decisions:
- issue: Bezeichnung Gottes als አምላከ፡ ልዑል
  choice: Gott, der Höchste
  alternative: der höchste Gott
  rationale: Die appositionale Form wahrt die mögliche Lesart als Gottesbezeichnung beziehungsweise Titel, ohne unnötig festzulegen, wie die Wörter syntaktisch verbunden sind.
- issue: Bedeutung von ጽድቅ bei der Nachkommenschaft
  choice: gerechtes Geschlecht
  alternative: Nachkommenschaft der Gerechtigkeit
  rationale: Die natürliche deutsche Form bewahrt den theologischen Begriff der Gerechtigkeit, ohne eine spezifische konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt persönlich und feierlich; konkrete Verwandtschaftsbegriffe sowie die Bilder „Geschlecht“ und „heiliger Same“ werden beibehalten.
