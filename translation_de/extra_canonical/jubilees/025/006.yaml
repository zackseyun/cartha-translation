  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: de
  text: 'Dann sprach Jakob mit seiner Mutter Rebekka und sagte zu ihr: »Sieh, ich bin nun neun Jahrwochen alt[a], und ich habe noch keine Frau erkannt, keine berührt und mich mit keiner verlobt; auch habe ich nicht vor, mir eine Frau von den Töchtern Kanaans zu nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neun Jahrwochen entsprechen 63 Jahren; der Haupttext bewahrt die eigene Zeitrechnung des Jubiläenbuches.
    reason: cultural_note
lexical_decisions:
- source_word: ተስዓተ፡ ሱባዔ፡ ዓመት
  choice: neun Jahrwochen alt
  rationale: Bewahrt die jubilläische Zeitrechnung knapp und verständlich; die Fußnote nennt den Gegenwert von 63 Jahren.
- source_word: ኢያአምር
  choice: ich habe noch keine Frau erkannt
  rationale: Das Verb »erkennen« wird in seinem sexuellen Sinn gebraucht. Die etwas formelle Wendung bewahrt das biblische Idiom, während »noch« im Deutschen den zeitlichen Zusammenhang natürlich ausdrückt.
- source_word: ወአገስስኩ
  choice: keine berührt
  rationale: Gibt die körperliche Berührung direkt wieder und folgt der durch die Negationsreihe bestimmten Bedeutung.
- source_word: ወአፈፃርኩ
  choice: mich mit keiner verlobt
  rationale: Bewahrt das im früheren Entwurf ausgelassene eigenständige Glied der Aufzählung und gibt den Sinn einer eingegangenen Verlobung wieder.
- source_word: ወኢይሔሊኒ
  choice: auch habe ich nicht vor
  rationale: Gibt die Bedeutung »denken, erwägen, beabsichtigen« wieder, statt sie zu einer bloßen Zukunftsaussage abzuschwächen.
- source_word: አዋልደ፡ ከናአን
  choice: den Töchtern Kanaans
  rationale: Traditionelle, quellennah formulierte Bezeichnung für die Frauen der kanaanäischen Bevölkerung.
