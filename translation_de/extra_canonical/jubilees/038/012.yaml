  text: And they sent to their father asking whether they should make peace with them or kill them.
translation:
  language: de
  text: Und sie sandten zu ihrem Vater und fragten, ob sie mit ihnen Frieden schließen oder sie töten sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለአኩ፡ ኀበ፡ አቡሆሙ
  choice: Und sie ließen ihren Vater fragen
  rationale: Wörtlich etwa „Und sie sandten zu ihrem Vater“. Im Zusammenhang leitet die Wendung eine Anfrage ein; die deutsche Fassung gibt dies natürlich wieder, ohne einen im Geʿez nicht ausdrücklich genannten Boten hervorzuheben.
- source_word: ይገብሩ፡ ሰላመ፡ ምስሌሆሙ
  choice: ob sie mit ihnen Frieden schließen sollten
  rationale: Die Wendung bedeutet wörtlich „Frieden mit ihnen machen“. „Frieden schließen“ ist die natürliche, inhaltlich genaue deutsche Entsprechung.
- source_word: ይቀትልዎሙ
  choice: sie töten sollten
  rationale: Das Verb bezeichnet das Töten; das angehängte Pronomen ist pluralisch („sie“). Die schlichte Wiedergabe „töten“ bewahrt die Härte und die Alternative des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte geʿezische Bedingungsform („ob … und ob …“) wird als natürliche deutsche Alternativfrage mit „ob … oder …“ wiedergegeben.
