  source_fidelity: Die Alternative „Frieden schließen oder sie töten“ gibt den Geʿez-Text einschließlich des abschließenden Verbs ይቀትልዎሙ („sie töten“) zutreffend wieder. Die Formulierung „ließen ihren Vater fragen“ verschiebt jedoch die ausdrücklich genannte Sendung zu ihrem Vater in eine bloße Veranlassung einer Frage.
  naturalness: „Und sie sandten zu ihrem Vater und fragten“ ist verständliches, würdevolles Standarddeutsch und bildet die im Ausgangstext ausgedrückte Sendung mit anschließender Anfrage natürlicher und genauer ab als die kausative Formulierung des Entwurfs.
  terminology: „Frieden schließen“ ist eine idiomatische und genaue Wiedergabe von „Frieden machen“; „töten“ wahrt die ungemilderte Bedeutung des Verbs. Keine theologischen Fachbegriffe oder Namen sind betroffen.
