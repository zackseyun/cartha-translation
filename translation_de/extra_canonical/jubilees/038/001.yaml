  yaml_path: translation/extra_canonical/jubilees/038/001.yaml
  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: de
  text: 'Und danach sprach Juda zu seinem Vater Jakob und sagte zu ihm: „Spanne deinen Bogen, Vater, und schieß deine Pfeile ab! Stürze den Feind nieder und töte den Widersacher! Mögest du Kraft haben! Denn wir werden deinen Bruder nicht töten; er ist dein Gefährte und ist dir gleich. Lasst uns ihm Ehre erweisen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der gedruckte äthiopische Text ist in diesem Satz offenbar an mehreren Stellen fehlerhaft. Bei rein buchstäblicher Lesung der vorliegenden Formen wäre auch eine stark abweichende Wiedergabe möglich: „Denn wir werden den Feind deiner Brüder töten. Deine Hand ist bei dir, und deine Hilfe ist bei dir; wir werden sie dir zur Ehre geben.“ Die Hauptfassung folgt den naheliegenden Korrekturen der fehlerhaften Formen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ምስከ
  choice: Spanne
  rationale: Das Verb bezeichnet hier das Spannen beziehungsweise Biegen des Bogens; „nimm“ wäre lexikalisch nicht hinreichend begründet.
- source_word: ፈኑ
  choice: schieß … ab
  rationale: Das Verb bedeutet „aussenden, abschießen“ und bezeichnet im Zusammenhang das Abschießen der Pfeile.
- source_word: ንደፍ
  choice: Stürze … nieder
  rationale: Gibt den gewaltsamen Sturz des Feindes natürlich und zugleich bildnah wieder.
- source_word: ጸላኢ / ፀረዊ
  choice: Feind / Widersacher
  rationale: Die zwei parallelen Feindbezeichnungen werden im Deutschen mit zwei entsprechenden Begriffen wiedergegeben.
- source_word: ኀይለ
  choice: Kraft
  rationale: Bewahrt den offenen Sinn der Bitte beziehungsweise Zusage, ohne eine bestimmte Art von Stärke einzutragen.
- source_word: አኅዋከ
  choice: deinen Bruder
  rationale: Die im Zusammenhang erforderliche Lesart folgt der textkritisch erschlossenen Verneinung und dem Singular „Bruder“, statt aus den fehlerhaften Druckformen einen „Feind deiner Brüder“ zu konstruieren.
- source_word: ንህቦ፡ ለክብር
  choice: Lasst uns ihm Ehre erweisen
  rationale: Idiomatiches Deutsch für die Aufforderung, ihm Ehre zukommen zu lassen; das männliche Bezugswort bleibt erhalten.
theological_decisions:
- issue: Tötung des Bruders und seine Gleichstellung mit Jakob
  choice: „wir werden deinen Bruder nicht töten; er ist dein Gefährte und ist dir gleich“
  alternative: „wir werden den Feind deiner Brüder töten; deine Hand und deine Hilfe sind bei dir“
  rationale: Die Hauptfassung folgt der durch den Kontext und die erkennbaren Textfehler gestützten Rekonstruktion. Sie bewahrt zugleich die auffällige Spannung, dass der Bruder als Gefährte und Jakob gleichartig bezeichnet wird, ohne diese Aussage auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Redeeinleitung des Ge’ez wurde bewahrt. Imperative und parallele Feindbezeichnungen erhalten den feierlich-kriegerischen Rhythmus; unnötige konfessionelle Deutung wurde vermieden.
