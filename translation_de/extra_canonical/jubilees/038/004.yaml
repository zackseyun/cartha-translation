  text: And after this the sons of Jacob went out, they and their servants dividing themselves into four battle lines.
translation:
  language: de
  text: Danach zogen die Söhne Jakobs und ihre Diener aus und teilten sich in vier Schlachtreihen auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምዝ
  choice: Danach
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: ወጽኡ
  choice: zogen … aus
  rationale: Entspricht dem Bewegungsvorgang und passt zum militärischen Zusammenhang.
- source_word: ውሉደ፡ ያዕቆብ
  choice: die Söhne Jakobs
  rationale: Direkte und idiomatische Wiedergabe der ge’ezischen Genitivverbindung.
- source_word: እሙንቱ፡ ወአግብርቲሆሙ
  choice: mit ihren Dienern
  rationale: Das selbstständige Pronomen mit der anschließenden Dienergruppe bezeichnet gemeinsam die Ausziehenden; im Deutschen wird dies natürlich durch eine mit-Konstruktion ausgedrückt.
- source_word: ተናፊቆሙ
  choice: teilten sich … auf
  rationale: Bewahrt den reflexiven beziehungsweise medialen Sinn des Verbs und macht die im Englischen nachträglich ergänzte Nuance ausdrücklich.
- source_word: ውስተ፡ መርብዕተ፡ ማኅፈድ
  choice: in vier Schlachtreihen
  rationale: Gibt die Vierzahl und den militärischen Formationssinn prägnant wieder; „Schlachtreihen“ ist im Deutschen verständlicher und würdiger als eine wörtlich sperrige Wendung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am ge’ezischen Ablauf, wird jedoch idiomatisch verbunden. Keine Fußnote ist nötig, da die reflexive Teilung ausdrücklich im Haupttext erscheint und die englische frühere Alternative „with them“ keinen zusätzlichen eigenständigen Quellenbestandteil erfordert.
