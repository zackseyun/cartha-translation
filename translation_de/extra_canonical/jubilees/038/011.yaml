  text: And the sons of Jacob subdued the sons of Esau on Mount Seir, and they bowed their necks so that they might become servants.
translation:
  language: de
  text: Und die Söhne Jakobs unterwarfen die Söhne Esaus auf dem Berg Seïr, und die Söhne Esaus beugten den Nacken, um Knechte zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መገብዎሙ
  choice: unterwarfen
  rationale: Das Verb bezeichnet hier das Gewinnen von Herrschaft beziehungsweise das Unterwerfen; „unterwarfen“ gibt den militärisch-politischen Zusammenhang klar und idiomatisch wieder.
- source_word: አትሐቱ፡ ክሳዶሙ
  choice: sie beugten ihren Nacken
  rationale: Die konkrete Körpermetapher des Ausgangstextes wird bewahrt; sie drückt Unterordnung aus, ohne sie lediglich abstrakt zu umschreiben.
- source_word: አግብርተ
  choice: Knechte
  rationale: Der Ausdruck bezeichnet Menschen im Dienst- oder Abhängigkeitsverhältnis. „Knechte“ wahrt den historischen Ton und lässt den möglichen Bedeutungsumfang zwischen Dienern und Unfreien offen.
theological_decisions:
- issue: Bezug des pluralischen Subjekts in „sie beugten ihren Nacken“
  choice: Das Pronomen bleibt formal mehrdeutig, wobei der Zusammenhang auf die Söhne Esaus weist.
  alternative: „Die Söhne Esaus beugten ihren Nacken“
  rationale: Der Ausgangstext wiederholt das Subjekt nicht ausdrücklich. Die deutsche Fassung bewahrt diese syntaktische Offenheit, ohne den naheliegenden Bezug zu verdecken.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Nackenmetapher. „Seïr“ verwendet das Trema zur eindeutigen Silbentrennung.
