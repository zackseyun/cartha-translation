  yaml_path: translation/extra_canonical/jubilees/038/008.yaml
  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: de
  text: Simeon, Benjamin und Henoch, der Sohn Rubens, zogen zur Westseite des Turmes hinaus; fünfzig waren bei ihnen. Sie töteten unter den Edomitern und Horitern vierhundert starke, kampftüchtige Männer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ዐረቢሁ፡ ለማኅፈድ
  choice: zur Westseite des Turmes
  rationale: Die Wendung bezeichnet die westliche Seite bzw. Front des Turmes; die zielgerichtete Bewegung wird im Deutschen idiomatisch mit „zur“ wiedergegeben.
- source_word: ፶ ምስሌሆሙ
  choice: fünfzig Männer waren bei ihnen
  rationale: Das Zahlwort steht elliptisch; „Männer“ wird aus dem militärischen Zusammenhang ergänzt, ohne eine zusätzliche Personengruppe näher zu bestimmen.
- source_word: ኤዶማ ኤዶም ወኤዶማ ሖሬዎን
  choice: von den Edomitern und den Horitern
  rationale: Die schwerfällige bzw. wiederholende äthiopische Gruppenbezeichnung wird als Zugehörigkeit der Getöteten zu Edomitern und Horitern verständlich wiedergegeben.
- source_word: ጽኑዓነ፡ መስተቃትላነ
  choice: kampfstarke Männer
  rationale: Die beiden Ausdrücke kennzeichnen sie als starke, zum Kampf befähigte Männer. „Kampfstark“ bewahrt beide Aspekte knapp und vermeidet die zusätzliche Wertung von „tapfer“.
