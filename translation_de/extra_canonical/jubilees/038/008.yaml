  source_fidelity: Die Satzglieder und die Zahl sind zutreffend wiedergegeben. Die Ergänzung „Männer“ bei „fünfzig“ ist jedoch im Ge’ez elliptisch und sollte nicht ohne Kennzeichnung ergänzt werden. Die beiden Prädikate für die Getöteten bezeichnen starke und kampftüchtige Männer; „kampfstark“ ist dafür weder besonders idiomatisch noch bildet es die zweigliedrige Beschreibung klar ab.
  naturalness: „Kampfstarke Männer“ wirkt im modernen Standarddeutsch ungebräuchlich. Eine koordinierte Wiedergabe als „starke, kampftüchtige Männer“ ist klar und würdevoll. „unter den Edomitern und Horitern“ gibt die Zugehörigkeitsangabe idiomatischer wieder als „von den“.
