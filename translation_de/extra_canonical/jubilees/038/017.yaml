  text: to this day, in the land of Edom. And Balaq son of Beor reigned in Edom, and the name of his city was Denaba.
translation:
  language: de
  text: bis zum heutigen Tag im Land Edom. Und Balaq, der Sohn Beors, regierte in Edom, und seine Stadt hieß Denaba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: bis auf diesen Tag
  rationale: Gibt die zeitliche Wendung wörtlich und zugleich in geläufigem, würdigem Deutsch wieder; der Vers setzt erkennbar einen vorherigen Satz fort.
- source_word: በምድረ፡ ኤዶም
  choice: im Land Edom
  rationale: Bewahrt die ausdrückliche Gebietsbezeichnung des ge’ezischen Textes.
- source_word: ወነግሠ፡ በአዶም
  choice: Und … herrschte in Edom
  rationale: Gibt sowohl die eröffnende Konjunktion als auch das Herrschaftsverb wieder, ohne eine bestimmte staatsrechtliche Nuance zusätzlich einzutragen.
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
  choice: Balak, der Sohn Beors
  rationale: Verwendet die im Deutschen geläufigen biblischen Namensformen und gibt die Abstammungsangabe natürlich wieder.
- source_word: ወስመ፡ …
  choice: und seine Stadt hieß Denaba
  rationale: Die vorgelegte ge’ezische Zeile bricht nach „und der Name …“ ab; die durch die Kapitelaufteilung abgeschnittene Fortsetzung wird nach der geprüften Versüberlieferung wiedergegeben.
