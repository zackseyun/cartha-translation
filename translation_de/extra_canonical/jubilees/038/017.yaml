  source_fidelity: Die Satzfolge und die Ortsangaben entsprechen dem geʽezischen Text und dem englischen Audit Trail. Das Herrschaftsverb ist mit „regierte“ präziser wiedergegeben. Für den im vorliegenden Quellenausschnitt abgeschnittenen Stadtnamen wird wie im Audit Trail „Denaba“ beibehalten.
  naturalness: „Bis auf diesen Tag“ ist im heutigen Deutsch missverständlich, da es auch „mit Ausnahme dieses Tages“ bedeuten kann. „Bis zum heutigen Tag“ ist idiomatisch und wahrt den zeitlichen Sinn.
  terminology: „Balaq“ folgt der geʽezischen Namensform und dem englischen Audit Trail; so wird die im Text überlieferte Gestalt nicht vorschnell mit einer anders überlieferten biblischen Namensform harmonisiert. „Edom“ und „Denaba“ sind konsistent wiedergegeben.
