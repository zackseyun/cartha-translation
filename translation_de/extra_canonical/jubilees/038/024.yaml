  verdict: approve
  source_fidelity: 'Der Entwurf gibt die ge''ezische Satzfolge und alle wesentlichen Angaben zuverlässig wieder: Baelunans Tod, Adats königliche Nachfolge „an seiner Stelle“, den Namen der Frau sowie die ausdrücklich über zwei Frauen geführte Abstammungsangabe. Mayṭabigo bewahrt zutreffend das im Ge''ez vorhandene y. Die Wiedergabe „wurde an seiner Stelle König“ ist als deutsche Nachfolgeformel sachgerecht und steht nicht im Widerspruch zu ነግሠ.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Formulierung „eine Tochter Mataregos, der Tochter Metebedzaabs“ ist eine knappe, aber grammatisch mögliche genealogische Apposition; sie erhält die im Ausgangstext auffällige weibliche Abstammungskette, ohne sie umzudeuten.
  terminology: Die Eigennamen sind konsequent eng am ge'ezischen Text gehalten. „König“ und „an seiner Stelle“ geben die Nachfolge- und Herrschaftsformel angemessen wieder. Kein theologischer oder konfessioneller Eingriff liegt vor.
