  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: de
  text: Und Baelunan, der Sohn Achbors, starb, und Adat wurde an seiner Stelle König. Seine Frau hieß Mayṭabigo, eine Tochter Mataregos, der Tochter Metebedzaabs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Gibt die Bedeutung »an seiner Stelle/an seiner statt« präzise wieder und bewahrt die königliche Nachfolgeformel.
- source_word: መይጠቢጎ
  choice: Mayṭabigo
  rationale: Bildet die ge’ezische Schreibweise einschließlich des y-Lauts ab.
- source_word: ነግሠ
  choice: wurde … König
  rationale: Natürliches modernes Deutsch für das Verb »als König herrschen/König werden« im Kontext einer Thronfolge.
- source_word: ወለተ፡ ማጠረጎ፡ ወለተ፡ ሜተቤድዛአብ
  choice: eine Tochter Mataregos, der Tochter Metebedzaabs
  rationale: Bewahrt die im Ausgangstext ausdrücklich weiblich formulierte zweistufige Abstammungsangabe.
