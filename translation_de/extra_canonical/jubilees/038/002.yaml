  text: Da spannte Jakob seinen Bogen und schoss einen Pfeil ab. Er traf seinen Bruder Esau in die rechte Brust und tötete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእተ፡ ሶቤ
  choice: Da
  rationale: Die äthiopische Zeitangabe bedeutet sinngemäß „zu jener Zeit“; im fortlaufenden Erzählstil gibt „Da“ den zeitlichen Anschluss natürlich und knapp wieder.
- source_word: ወሰቀ፡ ያዕቆብ፡ ቀስተ
  choice: spannte Jakob seinen Bogen
  rationale: Bewahrt Handlung, Subjekt und Objekt der Vorlage in idiomatischem modernem Deutsch.
- source_word: ወፈነወ፡ ሐጸ
  choice: schoss einen Pfeil ab
  rationale: Das Verb bezeichnet das Aussenden bzw. Abschießen; „einen Pfeil abschießen“ ist die natürliche deutsche Formulierung.
- source_word: ወነደፎ፡ ለዔሳው፡ እኁሁ
  choice: Er traf seinen Bruder Esau
  rationale: Gibt das gewaltsame Treffen wieder und stellt die Apposition „seinen Bruder“ im Deutschen natürlich.
- source_word: ጥቦ፡ የማናዊ
  choice: in die rechte Brust
  rationale: Entspricht der überlieferten Lesart und bezeichnet die getroffene rechte Brustseite; „in die Brust“ ist bei einem Pfeiltreffer im Deutschen idiomatisch.
- source_word: ወገደሎ
  choice: und tötete ihn
  rationale: Direkte und eindeutige Wiedergabe der abschließenden Tötungshandlung.
