  text: And Saul died, and Baelunan son of Achbor reigned in his place.
translation:
  language: de
  text: Und Saul starb, und Baëlunan, der Sohn Achbors, wurde König an seiner Stelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: starb
  rationale: Gibt das einfache ge’ezische Verb für „sterben“ unmittelbar und natürlich wieder.
- source_word: ነግሠ
  choice: wurde König
  rationale: Das Verb bezeichnet den Herrschaftsantritt beziehungsweise das Regieren als König; „wurde König“ ist in diesem Nachfolgesatz idiomatisches modernes Deutsch.
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Bewahrt die konkrete Bedeutung „an seiner Stelle / an seiner Statt“ genauer als das bloß zeitliche „nach ihm“.
- source_word: ወልደ፡ አክቡር
  choice: der Sohn Achbors
  rationale: Gibt die ge’ezische Abstammungsformel natürlich wieder; „Achbor“ entspricht der geläufigen deutschen Namensform.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die wiederholte Satzverbindung mit „und“ bewahrt den parataktischen Charakter der Vorlage, während „wurde König“ im Deutschen natürlicher klingt als „herrschte“ beim unmittelbaren Thronwechsel.
