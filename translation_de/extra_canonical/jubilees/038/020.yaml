  yaml_path: translation/extra_canonical/jubilees/038/020.yaml
  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: de
  text: Und Asam starb. An seiner Stelle wurde Adat, der Sohn Barads, König, der Midian im Gebiet von Moab geschlagen hatte. Seine Stadt hieß Awit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet ausdrücklich das Einnehmen der Stelle des Vorgängers, nicht lediglich eine zeitliche Abfolge.
- source_word: ዘቀተለ፡ ምዕድያምሃ
  choice: der Midian … besiegt hatte
  rationale: Das Verb bedeutet wörtlich „tötete“. Da „Midian“ hier kollektiv für ein Volk beziehungsweise dessen Streitmacht steht, gibt „besiegte“ den Sinn im Deutschen natürlich und sachgerecht wieder.
- source_word: በሐቅለ፡ ሞአብ
  choice: auf dem Gebiet von Moab
  rationale: Das wörtliche „auf dem Feld Moabs“ bezeichnet hier das Land beziehungsweise Gebiet Moabs; die gewählte Formulierung ist im modernen Deutschen klar.
- source_word: ወስመ
  choice: Seine Stadt hieß
  rationale: Der vorgelegte äthiopische Ausschnitt bricht nach „und der Name“ ab; die im Verszusammenhang bezeugte Fortsetzung wird in natürlicher deutscher Syntax wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die Eigennamen folgen der vorgelegten Ge’ez-Überlieferung (Asam, Adat, Barad, Awit) und werden nicht an die Namensformen von Genesis 36 angeglichen. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des Ausgangstextes zu verändern.
