  verdict: revise
  source_fidelity: Die Abfolge, die Thronnachfolge „an seiner Stelle“ und die Namen sind im Wesentlichen zutreffend wiedergegeben. Das ge'ezische Verb ቀተለ bedeutet jedoch „töten/erschlagen“; „besiegt“ legt eine bloß militärische Niederlage fest und schwächt die Formulierung gegenüber dem Ausgangstext ab. „schlug“ bewahrt die bei einer kollektiven Orts-/Volksbezeichnung mögliche Weite und entspricht auch der englischen Audit-Fassung „struck“.
  naturalness: Die Satzteilung und die moderne erzählerische Syntax sind natürlich. Die Relativkonstruktion mit „schlug“ ist im sachlich-würdigen Bibelregister idiomatisch.
  terminology: „An seiner Stelle“ gibt ህየንቴሁ präzise wieder. Die Namensformen Asam, Adat, Barad und Awit bleiben konsistent mit der gewählten ge'eznahen deutschen Wiedergabe. „im Gebiet von Moab“ ist als natürliche Umschreibung von „im Feld von Moab“ vertretbar.
  issues:
  - severity: medium
    issue: „besiegt hatte“ für ዘቀተለ፡ ምዕድያምሃ
    rationale: Das Verb bezeichnet töten bzw. erschlagen; bei „Midian“ als kollektiver Bezeichnung sollte die Übersetzung nicht auf die engere Deutung eines bloßen militärischen Sieges festgelegt werden. „schlug“ ist näher am Wortlaut und wahrt die Aussageweite.
  revised_text: Und Asam starb. An seiner Stelle wurde Adat, der Sohn Barads, König, der Midian im Gebiet von Moab geschlagen hatte. Seine Stadt hieß Awit.
