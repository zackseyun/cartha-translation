lexical_decisions:
- source_word: ሀገሩ
  choice: Seine Stadt
  rationale: Das Substantiv bezeichnet hier die Stadt bzw. den Ort einer Person; das angehängte Pronomen ist possessiv.
- source_word: ነግሠ
  choice: wurde … König
  rationale: Das Verb bedeutet, die Königsherrschaft anzutreten bzw. als König zu herrschen. Im Zusammenhang einer Thronfolge ist die ingressiv formulierte deutsche Wiedergabe natürlich und präzise.
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet Stellvertretung bzw. Nachfolge im Amt und ist genauer als das bloß zeitliche „nach ihm“.
