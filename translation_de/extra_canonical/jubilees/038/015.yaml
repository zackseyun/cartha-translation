  text: And the sons of Edom have not cast off the yoke of servitude that the twelve sons of Jacob had laid upon them, to this day.
translation:
  language: de
  text: Und die Söhne Edoms haben das Joch der Knechtschaft, das die zwölf Söhne Jakobs ihnen auferlegt hatten, bis auf diesen Tag nicht abgeschüttelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢነገኁ
  choice: Und … haben … nicht abgeschüttelt
  rationale: Gibt die verneinte Handlung idiomatisch wieder; zusammen mit dem Joch ergibt „abschütteln“ im Deutschen ein natürliches und bildgetreues Ausdrucksgefüge.
- source_word: ውሉደ፡ ኤዶም
  choice: die Söhne Edoms
  rationale: Formale Wiedergabe der genealogisch-ethnischen Bezeichnung.
- source_word: እምአርዑተ፡ ቅኔ
  choice: das Joch des Frondienstes
  rationale: Bewahrt sowohl das konkrete Jochbild als auch den Zwangscharakter des Dienstverhältnisses; „Frondienst“ ist hier präziser als das neutralere „Dienst“.
- source_word: ዘሠርዑ
  choice: das … auferlegt hatten
  rationale: „Auferlegen“ passt idiomatisch zu „Joch“ und wahrt die vorzeitige Handlung.
- source_word: ውሉደ፡ ያዕቆብ
  choice: die zwölf Söhne Jakobs
  rationale: Folgt der kritisch bestätigten Lesart von Charles 1895; die abweichende Zahlenfolge in der übermittelten Zeichenkette ist als OCR-Fehler beurteilt.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: bis auf diesen Tag
  rationale: Dignified, established German equivalent preserving the temporal endpoint.
theological_decisions:
- issue: Zahl der Söhne Jakobs
  choice: zwölf
  alternative: vierzehn und fünfzehn
  rationale: Die kritische Textgrundlage und der klare Erzählzusammenhang stützen „zwölf“. Die alternative Zahlenfolge beruht auf einer fehlerhaften OCR-Wiedergabe und ergibt keinen sinnvollen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Rede vom Joch bleibt erhalten; „Frondienst“ macht den erzwungenen Charakter verständlich, ohne eine konfessionelle Deutung einzutragen.
