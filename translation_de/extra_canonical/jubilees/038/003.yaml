  text: And again he shot an arrow, and it struck Adoran the Aramean in the left breast, and he drove him back and killed him.
translation:
  language: de
  text: Und wieder schoss er einen Pfeil ab, der Adoran, den Aramäer, in die linke Brust traf. Dann drängte er ihn zurück und tötete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ ሐጸ
  choice: schoss er einen Pfeil ab
  rationale: Die Verbindung bezeichnet das Aussenden beziehungsweise Abschießen eines Pfeils; im Deutschen ist „einen Pfeil abschießen“ die natürliche und präzise Wiedergabe.
- source_word: አዶራንሃ፡ አረማዊ
  choice: Adoran, den Aramäer
  rationale: Der Personenname wird als Adoran wiedergegeben; die Herkunftsbezeichnung wird mit dem geläufigen deutschen Ethnikon „Aramäer“ übersetzt.
- source_word: ጥቦ፡ ፀጋማዊ
  choice: in die linke Brust
  rationale: Die Wendung lokalisiert den Treffer an der linken Brustseite; „in die linke Brust“ entspricht im Kontext eines Pfeiltreffers natürlichem Deutsch.
- source_word: ወሰደዶ፡ ወቀተሎ
  choice: drängte ihn zurück und tötete ihn
  rationale: 'Die aufeinanderfolgenden Verben werden als zwei Handlungen bewahrt: Zurückdrängen beziehungsweise Zurücktreiben und Töten.'
