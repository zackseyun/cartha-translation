  yaml_path: translation/extra_canonical/jubilees/038/018.yaml
  text: His city was Danaba. And Balaq died, and Jobab son of Zarah from Boser reigned in his place.
translation:
  language: de
  text: Seine Stadt war Danaba. Balak starb, und an seiner Stelle[a] wurde Jobab König, der Sohn Zarahs aus Boser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihm“.'
    reason: Die alternative Wiedergabe drückt die zeitliche Nachfolge aus, während „an seiner Stelle“ den Stellvertretungs- beziehungsweise Nachfolgebezug des ge’ezischen Ausdrucks genauer bewahrt.
lexical_decisions:
- source_word: ሀገሩ፡ ደናባ
  choice: Seine Stadt war Danaba
  rationale: Die nominale Aussage wird im Deutschen natürlich mit „war“ wiedergegeben; das Possessivsuffix an „Stadt“ bleibt als „seine“ erhalten.
- source_word: ወነግሠ
  choice: wurde … König
  rationale: Das Verb bezeichnet das Königwerden beziehungsweise Herrschen; in diesem Nachfolgezusammenhang ist „wurde König“ klares, natürliches Deutsch.
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Die Form bezeichnet hier das Eintreten an die Stelle des verstorbenen Königs und wird genauer so statt lediglich zeitlich mit „nach ihm“ wiedergegeben.
- source_word: ዮባብ፡ ወልደ፡ ዛራ፡ ዘእም፡ ቦሴር
  choice: Jobab, der Sohn Zarahs aus Boser
  rationale: Die Eigennamen werden entsprechend der vorliegenden Textgestalt transliteriert; „aus Boser“ gibt die Herkunftsangabe wieder.
