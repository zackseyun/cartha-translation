  text: And Levi and Dan and Asher went out toward the east side of the tower, and fifty were with them; and they killed the warriors of Moab and Ammon.
translation:
  language: de
  text: Und Levi, Dan und Ascher zogen zur Ostseite des Turmes hinaus, und fünfzig waren mit ihnen. Sie töteten die Krieger Moabs und Ammons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ገጸ፡ ጽባሕ፡ ለማኅፈድ
  choice: zur Ostseite des Turmes
  rationale: Die Wendung bezeichnet die dem Sonnenaufgang zugewandte, also östliche Seite des Turmes; die natürliche deutsche Richtungsangabe bewahrt diesen Sinn.
- source_word: መስተቃትላኒሆሙ
  choice: die Krieger
  rationale: Das Wort bezeichnet die am Kampf beteiligten Männer beziehungsweise Kämpfer; „Krieger“ ist prägnant und entspricht dem militärischen Zusammenhang.
- source_word: ፶ ምስሌሆሙ
  choice: fünfzig Männer waren bei ihnen
  rationale: Die Zahl und die Begleitung werden ausdrücklich wiedergegeben; „Männer“ ergänzt im Deutschen natürlich das im Kontext vorausgesetzte Bezugswort.
- source_word: ለሞአብ፡ ወለዐሞን
  choice: Moabs und Ammons
  rationale: Der Bezug auf die Krieger der beiden Völker wird durch den deutschen Genitiv klar und knapp ausgedrückt.
