  rationale: Die Richtungsangabe und die wörtliche Vorstellung der „Nordseite“ werden in natürlichem modernem Deutsch bewahrt.
- source_word: መስተባእሳኒሆሙ፡ ለፍልስጥኤም
  choice: die Kämpfer der Philister
