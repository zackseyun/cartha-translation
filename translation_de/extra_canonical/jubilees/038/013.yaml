revisions:
- from: Und Jakob ließ seinen Söhnen ausrichten, sie sollten Frieden schließen. Da schlossen sie Frieden mit ihnen und legten ihnen ein Joch des Frondienstes auf, sodass sie Jakob und seinen Söhnen allezeit Tribut entrichten mussten.[a]
  to: Und Jakob ließ seinen Söhnen sagen, sie sollten Frieden schließen. Da schlossen sie Frieden mit ihnen und legten ihnen ein Joch der Dienstbarkeit auf, damit sie Jakob und seinen Söhnen allezeit Tribut entrichteten.[a]
  rationale: Die Revision ersetzt die zu spezifische Bezeichnung »Frondienst« durch »Dienstbarkeit« und präzisiert die Fußnote zur knappen Schlussform. Der Tributbegriff bleibt erhalten; die kausale Zweckbeziehung wird mit »damit« näher an der Vorlage ausgedrückt.
