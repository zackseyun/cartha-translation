  source_fidelity: 'Die Abfolge des geʽezischen Textes wird grundsätzlich getroffen: Jakob gibt seinen Söhnen den Auftrag zum Friedensschluss; Frieden wird geschlossen; anschließend wird ein Joch der Dienstbarkeit auferlegt, damit Tribut an Jakob und seine Söhne geleistet wird. ይጽብሑ ist hier zutreffend mit »Tribut entrichten« wiederzugeben, nicht allgemein mit »dienen«. »Frondienst« verengt ቅኔ jedoch auf Zwangsarbeit, während der Ausdruck allgemeiner Dienstbarkeit/Unterordnung bezeichnet.'
  naturalness: Der Text ist gut verständlich und würdig. »Joch der Dienstbarkeit« ist im Deutschen sowohl natürlich als auch näher am Bild und Bedeutungsumfang der Vorlage als »Joch des Frondienstes«. Die Formulierung »ließ seinen Söhnen ausrichten« ist möglich; »ließ seinen Söhnen sagen« ist etwas unmittelbarer und idiomatischer.
  terminology: »Jakob«, »Frieden schließen«, »Joch«, »Dienstbarkeit« und »Tribut entrichten« sind angemessen. Die Fußnote sollte die knappe bzw. textlich problematische Endform nicht durch die semantisch wenig naheliegende Paraphrase »insgesamt« erklären. Die englische Audit-Trail-Entscheidung zugunsten von »Tribut« wird berücksichtigt.
