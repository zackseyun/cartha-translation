  yaml_path: translation/extra_canonical/jubilees/038/013.yaml
  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: de
  text: Und Jakob ließ seinen Söhnen sagen, sie sollten Frieden schließen. Da schlossen sie Frieden mit ihnen und legten ihnen ein Joch der Dienstbarkeit auf, damit sie Jakob und seinen Söhnen allezeit Tribut entrichteten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlussform des überlieferten geʽezischen Textes ist knapp; sie wird in der Übersetzungstradition zeitlich verstanden: »alle ihre Tage« bzw. »allezeit«.'
    reason: Die Fußnote kennzeichnet die begrenzte syntaktische Klarheit am Versende, ohne die zeitliche Deutung durch die unpassende Wiedergabe »insgesamt« zu ersetzen.
lexical_decisions:
- source_word: ይግበሩ፡ ሰላመ / ገብሩ፡ ምስሌሆሙ፡ ሰላመ
  choice: Frieden schließen / schlossen sie Frieden mit ihnen
  rationale: Die idiomatische Verbindung mit ገብረ und ሰላም bezeichnet das Herstellen beziehungsweise Schließen von Frieden; die deutsche Wendung ist natürlich und wahrt die Wiederholung.
- source_word: አርዑተ፡ ቅኔ
  choice: Joch des Frondienstes
  rationale: አርዕት bedeutet »Joch«, während ቅኔ Abhängigkeit beziehungsweise Dienstbarkeit ausdrückt. »Frondienst« vermittelt hier den auferlegten, untergeordneten Dienst.
- source_word: ይጽብሑ
  choice: Tribut entrichten mussten
  rationale: Das Verb bezeichnet in diesem Kontext die Leistung von Tribut oder Abgaben und nicht bloß allgemeinen Dienst. »mussten« macht die durch das auferlegte Joch begründete Verpflichtung im Deutschen deutlich.
- source_word: ኵሎ
  choice: allezeit
  rationale: Die abschließende Form ist knapp und kann umfassende beziehungsweise fortdauernde Geltung ausdrücken; im Erzählzusammenhang entspricht dies »alle ihre Tage« bzw. »allezeit«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Frondienst« ist verständlich und gibt den Zwangscharakter des Dienstbarkeitsjochs präziser wieder als das allgemeinere »Dienst«. Die Satzstruktur bleibt nahe am ge’ezischen Text, wird aber idiomatisch gegliedert.
