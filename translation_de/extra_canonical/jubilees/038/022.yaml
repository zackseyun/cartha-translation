  text: And Salman died, and Saul from Rehoboth by the River reigned in his place.
translation:
  language: de
  text: Und Salman starb, und Saul aus Rehoboth am Fluss wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ (ḥəyāntehu)
  choice: an seiner Stelle
  rationale: Gibt die Bedeutung „an seiner statt/in seiner Stellung“ präzise wieder und bezeichnet die Thronfolge, ohne sie lediglich zeitlich als „nach ihm“ auszudrücken.
- source_word: ነግሠ (nagaśa)
  choice: wurde … König
  rationale: Das Verb bedeutet, als König zu herrschen bzw. König zu werden. Im Deutschen bezeichnet „wurde König“ den hier gemeinten Herrschaftsantritt natürlich und klar.
- source_word: ዘእም፡ ራኦቦት፡ ፈለግ (za-ʾəm Rāʾobot falag)
  choice: aus Rehoboth am Fluss
  rationale: Bewahrt Rehoboth als Ortsnamen und versteht „Fluss“ als nähere Ortsbestimmung; „am Fluss“ ist im modernen Deutsch natürlicher als „des Flusses“.
theological_decisions: []
