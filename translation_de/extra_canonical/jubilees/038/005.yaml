  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: de
  text: Und Juda zog als Erster aus, und mit ihm Naftali und Gad sowie fünfzig Knechte. Sie zogen zur Südseite des Turmes und töteten alle, die sie vor sich fanden; keiner von ihnen entkam, auch nicht ein Einziger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: als Erster
  rationale: Im Satz bezeichnet das Wort Judas Vorrang beim Ausziehen; „als Erster“ gibt dies im modernen Deutsch natürlich wieder.
- source_word: ደቅ
  choice: Knechte
  rationale: Die Bezeichnung meint hier untergeordnete männliche Begleiter bzw. Diener; „Knechte“ bewahrt den historischen sozialen Kontext, ohne sie zu Soldaten umzudeuten.
- source_word: ገጸ፡ ደቡብ፡ ለማኅፈድ
  choice: zur Südseite des Turmes
  rationale: Die räumliche Wendung wird idiomatisch und zugleich eng am überlieferten Sinn wiedergegeben.
- source_word: ወአሐዱኒ
  choice: auch nicht ein Einziger
  rationale: Die abschließende emphatische Verneinung wird ausdrücklich bewahrt.
