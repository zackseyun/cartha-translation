lexical_decisions:
- source_word: ደብረ፡ ቴማን
  choice: Bergland Teman
  rationale: ደብር bezeichnet hier das gebirgige Gebiet beziehungsweise Bergland von Teman; „Bergland“ ist im Deutschen natürlicher als die Wiedergabe als einzelner „Berg“.
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Das Wort bezeichnet die Stellvertretung beziehungsweise Nachfolge im Amt und entspricht präziser „an seiner Stelle“ als dem bloß zeitlichen „nach ihm“.
- source_word: ነግሠ
  choice: herrschte
  rationale: Das Verb bedeutet „König sein/regieren“. „Herrschte“ gibt den Regierungsantritt im Zusammenhang knapp und natürlich wieder.
