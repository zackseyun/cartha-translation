lexical_decisions:
- source_word: ወገር (wagar)
  choice: Berg
  rationale: Das ge’ezische Wort bezeichnet einen Berg bzw. eine Anhöhe und bewahrt damit die topografische Angabe des Ausgangstextes.
- source_word: ውስተ አዱፊም (wəsta ʾAdurim)
  choice: bei Adurim
  rationale: Die wörtliche räumliche Formulierung „in Adurim“ klingt zusammen mit „Berg“ im Deutschen missverständlich; „bei Adurim“ gibt natürlich wieder, dass der Berg im Gebiet bzw. an dem Ort Adurim liegt.
- source_word: ቤቱ (betu)
  choice: sein Haus
  rationale: Die Form bezeichnet sein Haus bzw. Heim; „sein Haus“ entspricht der konkreten Ausdrucksweise der Quelle.
