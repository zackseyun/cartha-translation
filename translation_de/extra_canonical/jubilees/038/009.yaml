  terminology: „Bergland“, „Adufim“ und „Berg Seïr“ sind angemessen. Die Fußnote bewahrt die tatsächlich bezeugte Lesart und kennzeichnet „Adurim“ vorsichtig als wahrscheinliche textkritische Korrektur.
