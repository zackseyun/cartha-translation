  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: de
  text: Sechshundert flohen, und vier von Esaus Söhnen flohen mit ihnen. Sie ließen ihren Vater erschlagen zurück, als er im Bergland, das in Adufim[a] liegt, gefallen war. Jakobs Söhne verfolgten sie bis zum Berg Seïr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez-Text steht »Adufim«, vermutlich durch einen Abschreibfehler für »Adurim«.
    reason: Die überlieferte ge’ezische Lesart bleibt im Haupttext; die wahrscheinliche textkritische Korrektur wird transparent angegeben.
lexical_decisions:
- source_word: ስድስቱ፡ ምእት
  choice: sechshundert Männer
  rationale: Die Quelle nennt wörtlich »sechshundert«; »Männer« macht die im Deutschen erforderliche Personenbezeichnung aus dem Zusammenhang ausdrücklich.
- source_word: ቅቱለ
  choice: ihren erschlagenen Vater
  rationale: Das Partizip bezeichnet den Vater als getötet beziehungsweise erschlagen; die attributive Wiedergabe ist im Deutschen natürlich und bewahrt die Aussage.
- source_word: ወገር
  choice: Bergland
  rationale: Der Ausdruck bezeichnet hier eine bergige Gegend und nicht lediglich einen einzelnen Hügel.
- source_word: አዱፊም
  choice: Adufim
  rationale: Die Hauptübersetzung gibt die tatsächlich überlieferte Ge’ez-Lesart wieder; die wahrscheinliche Emendation wird transparent in einer Fußnote genannt.
- source_word: ደብረ፡ ሴኢር
  choice: Berg Seïr
  rationale: Wörtliche und im biblischen Sprachgebrauch geläufige Wiedergabe des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Standardsprache. Die etwas sperrige Folge »sie ließen ihren Vater erschlagen, wie er gefallen war« wurde sinngenau und natürlich als Zurücklassen am Ort seines Falles formuliert; die Ortsnamen bleiben quellennah.
