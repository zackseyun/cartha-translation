  source_fidelity: 'Eine sichere Korrektur ist nötig: Das Ge''ez nennt lediglich „sechshundert“, nicht ausdrücklich „sechshundert Männer“. Die übrigen Kernaussagen – die vier Söhne Esaus, der erschlagen zurückgelassene Vater, das Bergland bei Adufim und die Verfolgung bis zum Berg Seïr – werden zutreffend wiedergegeben.'
