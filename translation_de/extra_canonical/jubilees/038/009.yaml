  - severity: low
    issue: „dort zurück, wo“ konkretisiert die Ortsbeziehung stärker als die Vorlage.
    rationale: Der Text besagt, dass der Vater erschlagen zurückgelassen wurde, nachdem er im Bergland, das in Adufim liegt, gefallen war. Die direktere Satzfügung wahrt diese Struktur ohne zusätzliche Lokalangabe.
