base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: de
  text: 'Und weiter: Im zweiten Jahr des fünfzigsten Jubiläums weißt du[a], was auf dem Berg Sinai zu dir gesagt wurde und was der Fürst Mastema mit dir vorhatte, als du nach Ägypten zurückkehrtest.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wirst du erkennen«.'
    reason: Die geezische Verbform kann sowohl präsentisch als auch futurisch wiedergegeben werden.
  - marker: b
    text: 'Oder: »als du nach Ägypten kamst«.'
    reason: Das geezische Verb kann neben »zurückkehren« auch »hineingehen« beziehungsweise »eintreten« bedeuten.
lexical_decisions:
- source_word: ታአምር
  choice: weißt du
  rationale: Die geezische Imperfektform kann gegenwärtig oder zukünftig verstanden werden. Im Zusammenhang verweist sie am natürlichsten auf Moses bereits vorhandenes Wissen; die Zukunftsbedeutung bleibt in einer Fußnote erhalten.
- source_word: ፈቀደ፡ ይግበር፡ ምስሌከ
  choice: mit dir vorhatte
  rationale: Die Wendung bezeichnet das, was Mastema mit Mose zu tun beabsichtigte. Die Formulierung bleibt nahe an der Präposition »mit«, ohne die feindliche Absicht ausdrücklich stärker auszudeuten als der Ausgangstext.
- source_word: መኰንን፡ መስተማ
  choice: der Fürst Mastema
  rationale: መኰንን bezeichnet einen Herrscher oder Fürsten; »Fürst« gibt den Titel knapp und würdig wieder. Mastema bleibt als Eigenname unübersetzt.
- source_word: ትገብእ፡ ግብጸ
  choice: als du nach Ägypten zurückkehrtest
  rationale: ገብአ kann »zurückkehren« oder »hineingehen/eintreten« bedeuten. Der Erzählzusammenhang von Moses Weg aus Midian nach Ägypten stützt »zurückkehren«.
- source_word: ዳግም
  choice: Und weiter
  rationale: Gibt die fortführende beziehungsweise erneute Bezugnahme idiomatisch wieder, ohne zwingend eine Wiederholung desselben Ereignisses zu behaupten.
theological_decisions:
- issue: Darstellung von Mastemas Absicht
  choice: mit dir vorhatte
  alternative: dir antun wollte / gegen dich tun wollte
  rationale: Der Text benennt eine Absicht gegenüber Mose, legt aber in dieser Wendung allein die feindliche Wertung nicht ausdrücklich fest. »Mit dir vorhatte« bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Die Datierungsformel »im zweiten Jahr des fünfzigsten Jubiläums« bleibt formal nah am Ausgangstext; echte verbale Mehrdeutigkeiten werden durch Fußnoten offengehalten.
