- source_word: ኀበቀሎሙ
  choice: An einer Million von ihnen nahm er Rache
  rationale: Die offenbar verderbte beziehungsweise variante Form wird entsprechend dem im Kontext geforderten Vergeltungsverb verstanden; die erste Zahlenfolge wird gemäß der geprüften Quellentscheidung als eine Million wiedergegeben.
- source_word: ሕሱዳ
  choice: Neid
  rationale: Entspricht der unmittelbaren lexikalischen Bedeutung und vermeidet eine motivierende Umdeutung.
theological_decisions:
- issue: Vergeltende Entsprechung zwischen dem Fluss und dem Meer
  choice: 'Die aktive Gegenüberstellung bleibt ausdrücklich erhalten: Gott wirft die Verfolger ins Meer, wie die Ägypter Kinder in den Fluss warfen.'
  alternative: Die zweite Handlung passiv oder als bloßes Hinabgehen der Kinder wiederzugeben.
  rationale: Die aktive Verbform und die literarische Spannung der Vergeltung sollen nicht abgeschwächt werden.
- issue: Bezug von „ihre Kinder“
  choice: Die grammatische Mehrdeutigkeit wird im Haupttext mit „ihre Kinder“ bewahrt und in einer Fußnote erläutert.
  alternative: Im Haupttext eindeutig „die Kinder Israels“ zu setzen.
  rationale: Der unmittelbare Wortlaut hat ein Possessivpronomen mit den Ägyptern als naheliegendem Bezug, während der Erzählzusammenhang auf israelitische Kinder weist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der abgerissene Versanfang und die ungewöhnliche räumliche Aussage „unter die Israeliten“ wurden nicht geglättet; die klaren Handlungsbezüge und die geprüften Zahlenangaben wurden idiomatisch formuliert.
