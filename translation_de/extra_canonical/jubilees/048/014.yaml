  terminology: „die Tiefen des Abgrunds“, „mächtige Männer“ und „Neid“ geben die maßgeblichen Begriffe angemessen wieder. „Gott, der Herr“ wahrt den Gottesnamen-Titel ohne konfessionelle Zusatzdeutung. Die Fußnote zu „ihre Kinder“ bewahrt die grammatische Spannung, während sie den erzählerischen Bezug sachlich erläutert.
