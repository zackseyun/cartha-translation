  source_fidelity: 'Die wesentlichen Aussagen des geʿezischen Textes sind zutreffend wiedergegeben: die Verfolgung Israels, das Hineinwerfen der Verfolger ins Meer und in die Tiefe, die Vergeltungsparallele zum Hineinwerfen der Kinder in den Fluss, die Zahlenangaben sowie der Neid als Grund ihres Untergangs. Die Wiedergabe von ኀበቀሎሙ als „Rache nehmen“ ist angesichts der überlieferten problematischen Form und des Kontextes vertretbar. „ausziehen lassen“ kann jedoch im Deutschen ein bloßes Erlauben nahelegen und schwächt das aktiv-kausative „herausführen“ ab.'
