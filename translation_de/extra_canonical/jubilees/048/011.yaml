  text: das Gericht, das sie mitten im Fluss gegen die Kinder deines Volkes ersonnen hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኩነነ
  choice: das Gericht
  rationale: Das Substantiv bezeichnet Gericht bzw. Strafgericht; die Wiedergabe bewahrt den gerichtlichen Sinn des äthiopischen Ausdrucks.
- source_word: አቡረ
  choice: ersonnen hatten
  rationale: Im gegebenen Satzgefüge bezeichnet die Form das planende bzw. ausheckende Handeln; das Plusquamperfekt gibt die Vorzeitigkeit natürlich wieder.
- source_word: ማእከለ፡ ፈለገ
  choice: mitten im Fluss
  rationale: Entspricht wörtlich der räumlichen Angabe „in der Mitte des Flusses“ und klingt im Deutschen natürlich.
- source_word: ለውሉደ፡ ሕዝብከ
  choice: gegen die Kinder deines Volkes
  rationale: Bewahrt die konkrete Verwandtschaftsmetapher und den Bezug auf das angesprochene Volk.
theological_decisions:
- issue: Art und Träger des Gerichts
  choice: „das Gericht, das sie … ersonnen hatten“
  alternative: „die Strafe, die sie … geplant hatten“
  rationale: „Gericht“ erhält die mögliche theologische und forensische Weite des Ausdrucks, ohne ihn auf eine bloße Strafmaßnahme einzuengen; zugleich bleibt das Gericht Gegenstand des feindlichen Plans.
