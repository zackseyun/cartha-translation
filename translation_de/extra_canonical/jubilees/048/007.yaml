base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/007.yaml
  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: de
  text: 'Und du solltest vor dem König von Ägypten sprechen, vor allen seinen Dienern und vor seinem Volk. Und alles geschah auf dein Wort hin: Zehn große und schwere Strafgerichte kamen über das Land Ägypten, die du vollstrecken solltest.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር
  choice: du solltest … sprechen
  rationale: Die Verbform bezeichnet hier die an Mose gerichtete bzw. über ihn ausgesagte Aufgabe; die modale Vergangenheitsform gibt dies im Zusammenhang natürlich wieder.
- source_word: በቃልከ
  choice: auf dein Wort hin
  rationale: Bewahrt den engen Bezug zum Wort Moses und klingt im Deutschen zugleich idiomatisch.
- source_word: ዐሥሩ፡ ኵነኔ፡ ዐበይት፡ ወጸዋጋት
  choice: zehn große und schwere Strafgerichte
  rationale: „Strafgerichte“ erfasst den gerichtlichen Charakter von ኵነኔ; die beiden Eigenschaften werden als „groß“ und „schwer“ wiedergegeben.
- source_word: መጽአ፡ ውስተ፡ ምድረ፡ ግብጽ
  choice: kamen über das Land Ägypten
  rationale: Die idiomatische deutsche Wendung gibt das Eintreffen der Gerichte im Land wieder, ohne ihren Ursprung zusätzlich festzulegen.
- source_word: ከመ፡ ትግበር
  choice: damit du sie vollstrecktest
  rationale: Die aktive Form der zweiten Person Singular wird beibehalten; das im Deutschen nötige Objekt „sie“ bezieht sich auf die Strafgerichte.
theological_decisions:
- issue: Moses’ Rolle bei den Strafgerichten
  choice: damit du sie vollstrecktest
  alternative: damit sie vollstreckt würden
  rationale: Der Ausgangstext verwendet eine aktive Verbform der zweiten Person Singular. Eine passive Wiedergabe würde die ausdrücklich Mose zugeschriebene Handlung abschwächen.
- issue: Wirksamkeit des Wortes Moses
  choice: alles geschah auf dein Wort hin
  alternative: alles geschah durch dein Wort
  rationale: „Auf dein Wort hin“ wahrt den kausalen Zusammenhang, ohne eine weitergehende Aussage über eigenständige Macht oder Urheberschaft des menschlichen Wortes einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am ge’ezischen Text, wird jedoch durch die Wiederaufnahme „vor“ und den Doppelpunkt für heutige Leser klar gegliedert.
