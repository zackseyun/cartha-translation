base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: de
  text: Und der Fürst Mastema stellte sich dir entgegen und suchte dich in die Hand des Pharaos auszuliefern. Er half den Zauberern Ägyptens, und sie traten vor dich und vollbrachten ihre Taten. Wir erlaubten ihnen zwar, Böses zu tun, ließen aber nicht zu, dass durch ihre Hände Heilung geschah.[a] Doch der HERR schlug sie mit schlimmen Geschwüren, und sie konnten keinen Widerstand mehr leisten; denn wir machten sie unfähig, auch nur ein einziges Zeichen der Zauberkunst zu vollbringen. Durch all die Zeichen und Wunder wurde der Fürst Mastema beschämt, bis er an Kraft gewann und den Ägyptern zurief, sie sollten dir mit der ganzen Macht Ägyptens nachjagen – mit ihren Streitwagen und Pferden und mit der ganzen Menge des ägyptischen Volkes. Da stellte ich mich zwischen die Ägypter und Israel, und wir retteten Israel aus seiner Hand und aus der Hand seines Volkes. Der HERR aber führte sie mitten durch das Meer, als gingen sie über trockenes Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Wortlaut ist an dieser Stelle textlich schwierig. Möglich ist auch: „Sie übten zwar ihre Künste aus, und wir gestatteten ihnen, dass diese durch ihre Hände ausgeführt wurden.“'
    reason: Die vorliegende Textgestalt ist offenbar fehlerhaft oder umstritten. Die Hauptübersetzung folgt dem im Revisionshinweis erschlossenen Gegensatz zwischen Bösem und Heilung; die abweichende frühere Deutung wird als Alternative dokumentiert.
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: der Fürst Mastema
  rationale: መኰንን bezeichnet einen Herrscher, Fürsten oder Machthaber; „Fürst“ bewahrt den personalen Titel ohne zusätzliche dämonologische Deutung.
- source_word: ይትቃወመከ
  choice: stellte sich dir entgegen
  rationale: Gibt die direkte Gegnerschaft des Verbs und den singularischen Adressaten natürlich wieder.
- source_word: ሥረያቲሆሙ፡ ለግብጽ
  choice: den Zauberern Ägyptens
  rationale: Im Kontext der ägyptischen Zeichenhandlungen sind die ägyptischen Magier beziehungsweise Zauberer gemeint; „Zauberer“ ist allgemein verständlich.
- source_word: እኩየስኬ … ወፈውሳስ
  choice: zwar, Böses zu tun, … aber nicht … Heilung
  rationale: Bewahrt den ausdrücklichen Gegensatz zwischen zugelassenem Bösen und nicht zugelassener Heilung.
- source_word: ቍስል፡ እኩይ
  choice: schlimmen Geschwüren
  rationale: Die Verbindung bezeichnet eine böse beziehungsweise schwere Hautplage; „schlimme Geschwüre“ ist idiomatisch und sachlich passend.
- source_word: ሕሱደ፡ ትእምርተ
  choice: Zeichen der Zauberkunst
  rationale: Gibt ein betrügerisches beziehungsweise magisches Zeichen wieder, ohne es mit einem echten göttlichen Wunder gleichzusetzen.
- source_word: በኵሉ፡ ኃይሎሙ፡ ለግብጽ
  choice: mit der ganzen Streitmacht Ägyptens
  rationale: Im militärischen Zusammenhang mit Wagen, Pferden und Verfolgung bezeichnet „Kraft/Macht“ hier die gesamte ägyptische Heeresmacht.
- source_word: እንተ፡ ማእከለ፡ ባሕር
  choice: mitten durch das Meer
  rationale: Bewahrt die räumliche Aussage des Ge’ez und entspricht dem Exodus-Kontext.
theological_decisions:
- issue: Göttliche beziehungsweise engelhafte Zulassung des bösen Handelns der Zauberer
  choice: „Wir erlaubten ihnen zwar, Böses zu tun“
  alternative: „Sie taten zwar Böses“
  rationale: Der vorliegende Text schreibt dem sprechenden himmlischen Wir eine begrenzte Erlaubnis zu. Diese Spannung darf nicht durch eine bloße Feststellung menschlichen Handelns beseitigt werden.
- issue: Sprecherwechsel beziehungsweise handelnde Subjekte
  choice: Das „wir“ bei Begrenzung und Rettung sowie „der HERR“ beim Schlagen und Herausführen bleiben unterschieden.
  alternative: Alle Handlungen unmittelbar dem HERRN zuschreiben
  rationale: Die wechselnden Subjekte des Quelltexts werden bewahrt, ohne die Identität oder Hierarchie der Sprecher dogmatisch zu bestimmen.
- issue: Mastemas erneute Stärke
  choice: „Schließlich gewann er wieder an Kraft“
  alternative: „bis er sich durchsetzte“
  rationale: Die Aussage wird nicht als endgültiger Sieg Mastemas gedeutet; sie bezeichnet seine wiedergewonnene Handlungsfähigkeit, die Ägypter zur Verfolgung anzutreiben.
- issue: Israel als kollektive Größe
  choice: „Israel“ statt eines deutschen männlichen Pronomens
  alternative: „ihn“
  rationale: Die Wiederholung vermeidet im Deutschen ein missverständliches Pronomen und lässt offen, ob Israel als Volk oder als personifizierte Einheit aufgefasst wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerischem Rhythmus. Archaismen wurden vermieden; „HERR“ bewahrt die traditionelle Kennzeichnung des Gottesnamens. Direkte zweite Person Singular und die Wechsel zwischen „ich“, „wir“ und „der HERR“ bleiben erhalten.
