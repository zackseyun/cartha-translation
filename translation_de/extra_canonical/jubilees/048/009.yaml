revisions:
- from: Und der Fürst Mastema stellte sich dir entgegen und suchte dich in die Hand des Pharaos auszuliefern. Er half den Zauberern Ägyptens, und sie traten vor dich und vollbrachten ihre Taten. Wir erlaubten ihnen zwar, Böses zu tun, ließen aber nicht zu, dass durch ihre Hände Heilung geschah.[a] Doch der HERR schlug sie mit schlimmen Geschwüren, und sie konnten keinen Widerstand mehr leisten; denn wir machten sie unfähig, auch nur ein einziges Zeichen der Zauberkunst zu vollbringen. Durch all die Zeichen und Wunder wurde der Fürst Mastema beschämt. Schließlich gewann er wieder an Kraft und rief den Ägyptern zu, sie sollten dir mit der ganzen Streitmacht Ägyptens nachjagen – mit ihren Streitwagen und Pferden und mit der ganzen Menge des ägyptischen Volkes. Da stellte ich mich zwischen die Ägypter und Israel, und wir retteten Israel aus seiner Hand und aus der Hand seines Volkes. Der HERR aber führte sie mitten durch das Meer, als gingen sie über trockenes Land.
