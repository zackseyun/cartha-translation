    issue: „unter die Israeliten“ ist räumlich missverständlich.
    rationale: Die Quelle lokalisiert die ins Meer Geworfenen in dessen Tiefen unter den Israeliten. Deutsch „unter die Israeliten“ wird primär als Bewegung in eine Personengruppe verstanden. „unterhalb der Israeliten“ gibt die beabsichtigte vertikale Relation wieder.
  - severity: low
