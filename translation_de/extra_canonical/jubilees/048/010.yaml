  source_fidelity: 'Der Entwurf gibt die Verfolgung der Israeliten, das Hinabstürzen der Verfolger in die Meerestiefen und den kausalen Zusammenhang mit einem in den Fluss geworfenen Säugling insgesamt quellentreu wieder. Die räumliche Wendung „unter die Israeliten“ ist jedoch im Deutschen missverständlich: Sie bedeutet gewöhnlich „in ihre Mitte“ statt „unterhalb von ihnen“ und verfehlt damit die räumliche Aussage der Vorlage.'
  naturalness: Modernes, würdiges Deutsch. „Israel hinterher“ wirkt allerdings als nachgestellte Wiederholung nach „ihnen nach“ holprig. „sie, die Israeliten“ ist natürlich, erhält die explizite Identifikation und bewahrt die Wiederaufnahme der Vorlage.
  terminology: „Jahwe, unser Gott“, „Säugling“ und die emphatische Zahlenformel sind angemessen. „unterhalb der Israeliten“ stellt den räumlichen Bezug der Meerestiefen klar, ohne zusätzliche Deutung einzutragen.
