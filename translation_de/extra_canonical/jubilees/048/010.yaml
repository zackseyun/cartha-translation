base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: de
  text: Und das ganze Volk, das er herausgeführt hatte, verfolgte sie[a], die Israeliten. Da stürzte Jahwe, unser Gott, sie mitten ins Meer, in seine Tiefen, unterhalb der Israeliten – so wie die Ägypter ihre Söhne in den Fluss geworfen hatten. Tausendmal tausend und zehntausend mächtige Männer kamen wegen eines einzigen Säuglings unter den Kindern deines Volkes um, den sie in den Fluss geworfen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die erhaltene Verszählung der Quelle springt von Vers 9 zu Vers 14. Hier wird das Kapitel der Lesbarkeit halber fortlaufend gezählt; der gesamte erhaltene Inhalt bleibt dabei bewahrt.
