lexical_decisions:
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: jagte ihnen nach
  rationale: Gibt die Verfolgungsbewegung idiomatisch und zugleich eng am äthiopischen Ausdruck „hinter ihnen her“ wieder.
- source_word: እግዚአብሔር፡ አምላክ
  choice: Jahwe, unser Gott
  rationale: Folgt der im konsultierten Text bezeugten Wiedergabe des Gottesnamens und erhält die possessive Aussage „unser Gott“.
- source_word: ምእተ፡ አልፈ ... ወዐሠርተ፡ ምእተ
  choice: Tausendmal tausend und zehntausend
  rationale: Bewahrt die überlieferte, emphatische Zahlengestalt, ohne sie stillschweigend zu einer moderneren Zahl zusammenzuziehen.
- source_word: ሕሱዳ
  choice: Säugling
  rationale: Bezeichnet natürlich und verständlich ein noch gestilltes Kleinkind; „einziger“ bringt die Kontrastierung mit der gewaltigen Zahl der Umgekommenen zum Ausdruck.
theological_decisions:
- issue: Vergeltungszusammenhang zwischen den ertrunkenen Ägyptern und dem in den Fluss geworfenen Kind
  choice: wegen eines einzigen Säuglings ... den sie in den Fluss geworfen hatten
  alternative: als Vergeltung für einen einzigen Säugling
  rationale: Die kausale Formulierung bewahrt die Aussage des Textes, ohne den Vergeltungscharakter stärker auszudeuten, als es der Wortlaut verlangt.
- issue: Bezug von „er“ in „das er herausgeführt hatte“
  choice: Pronomen ohne erklärenden Eigennamen beibehalten
  alternative: das der Pharao herausgeführt hatte
  rationale: Der unmittelbare Ausschnitt nennt den Bezugsträger nicht ausdrücklich; die Übersetzung löst diese echte kontextuelle Abhängigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederaufnahme „Israel hinterher“ bildet die appositionelle Verdeutlichung der Quelle ab. Der vorangestellte Rest „… trockenes Land“, der syntaktisch zum vorherigen Segment gehört, wurde nicht in diesen Vers gezogen.
