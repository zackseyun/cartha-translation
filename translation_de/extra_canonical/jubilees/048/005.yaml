base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: de
  text: 'Und der HERR vollstreckte an ihnen große Vergeltung um Israels willen: Er schlug sie mit Blut, mit Fröschen, mit Stechmücken und mit Hundsfliegen[a], mit schlimmen Geschwüren, die in Blasen ausbrachen, und ihr Vieh mit dem Tod. Er schlug sie mit Hagelsteinen und vernichtete dadurch alles, was für sie wuchs, und mit Heuschrecken, die fraßen, was ihnen vom Hagel übrig geblieben war, ferner mit Finsternis und mit dem Tod ihrer Erstgeborenen bei Menschen und Tieren. Und an allen ihren Göttern vollstreckte der HERR Vergeltung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Hundsfliegen; möglicherweise sind damit Stech- oder Schwarmfliegen gemeint.'
    reason: Die genaue Bestimmung der durch ጽንጽያ ክልብ bezeichneten Fliegenart ist unsicher; die Fußnote bewahrt die wörtliche Lesart und nennt sachlich mögliche Bedeutungen.
lexical_decisions:
- source_word: በቀለ
  choice: Vergeltung
  rationale: Das Wort bezeichnet strafende Vergeltung bzw. Rache. „Vergeltung“ bewahrt den forensisch-theologischen Ernst, ohne im heutigen Deutsch den Beiklang persönlicher Rachsucht zu wecken.
- source_word: በጽንጽያ፡ ክልብ
  choice: mit Hundsfliegen
  rationale: Die äthiopische Verbindung ist wörtlich „Hundsfliegen“. Die ungewöhnliche Tierbezeichnung bleibt erhalten; eine Fußnote weist auf die mögliche allgemeinere Auffassung als Stech- oder Schwarmfliegen hin.
- source_word: በእኩይ፡ ቍስል፡ ዘውእቱ፡ ይፈልሕ፡ ዐንጸዐንጺ
  choice: mit schlimmen Geschwüren, die in Blasen ausbrachen
  rationale: Gibt sowohl die Schwere des Geschwürs als auch das bildhafte Hervorbrechen der Blasen wieder, ohne die Krankheitsbeschreibung medizinisch zu präzisieren.
- source_word: ዘይሠርፅ፡ ሎሙ
  choice: alles, was für sie wuchs
  rationale: „Wuchs“ ist im Deutschen natürlicher und weiter als „sprosste“ und bewahrt den Bezug „für sie“ aus dem Ausgangstext.
- source_word: አማልክቲሆሙ
  choice: ihren Göttern
  rationale: Die Pluralform wird direkt wiedergegeben; der Text lässt offen, auf welche Weise die Vergeltung an den Göttern geschah.
theological_decisions:
- issue: Göttliche Vergeltung
  choice: „der HERR vollstreckte … Vergeltung“
  alternative: „der HERR nahm … Rache“
  rationale: Die gewählte Formulierung bewahrt Gottes aktives Gericht und vermeidet zugleich, moderne Vorstellungen impulsiver persönlicher Rachsucht in den Text einzutragen.
- issue: Gericht an den ägyptischen Göttern
  choice: Die Aussage bleibt wörtlich und unerklärt stehen.
  alternative: Deutung als bloßes Gericht an Götzenbildern oder als Sieg über reale geistliche Mächte
  rationale: Der Ausgangstext legt die ontologische Stellung der genannten Götter nicht fest; diese theologische Spannung darf nicht aufgelöst werden.
- issue: Gottesbezeichnung እግዚአብሔር
  choice: der HERR
  alternative: Gott / der Herr
  rationale: „der HERR“ entspricht der etablierten Wiedergabe der im Text verwendeten göttlichen Herrschaftsbezeichnung und stimmt mit der konsultierten POB-Fassung überein, ohne einen zusätzlichen Eigennamen einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die lange Aufzählung des Ausgangstextes wird durch zwei Satzgrenzen lesbarer gemacht, während Reihenfolge, Wiederholungen und Gerichtsmotive erhalten bleiben. Ungewöhnliche Quellensprache wird nicht unnötig geglättet.
