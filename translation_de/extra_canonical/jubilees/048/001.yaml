base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: de
  text: Und im sechsten Jahr der dritten Jahrwoche des neunundvierzigsten Jubiläums zogst du fort und lebtest fünf Jahrwochen und ein Jahr lang im Land Midian. Dann kehrtest du in der zweiten Jahrwoche, im zweiten Jahr des fünfzigsten Jubiläums, nach Ägypten zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangabe ist im äthiopischen Text gedrängt und nicht leicht zu gliedern. „Fünf Jahrwochen und ein Jahr“ ist bewusst nahe am Wortlaut wiedergegeben, um das kalendarische System des Jubiläenbuches zu bewahren.
    reason: segmentation_note
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier eine Siebenerperiode von Jahren. „Jahrwoche“ gibt das kalendarische System des Jubiläenbuches knapp und verständlich wieder.
- source_word: ሖርከ
  choice: zogst du fort
  rationale: Die Form bezeichnet das Weggehen; „zogst du fort“ ist im erzählerischen Zusammenhang natürlicher und würdevoller als das bloße „gingst du“.
- source_word: ነበርከ
  choice: lebtest
  rationale: Das Verb kann „wohnen“, „bleiben“ oder „leben“ bedeuten. Bei einem längeren Aufenthalt in Midian trifft „lebtest“ den Zusammenhang, ohne eine dauerhafte Ansiedlung vorauszusetzen.
- source_word: ገባእከ
  choice: kehrtest du … zurück
  rationale: Das Verb bezeichnet hier die Rückkehr; Mose begibt sich erneut nach Ägypten. Diese Wiedergabe ist genauer als „gingst hinein“ oder „betratest“.
- source_word: ኢዮቤልውሳት
  choice: Jubiläums
  rationale: Der etablierte Ausdruck bewahrt die besondere Zeitrechnung des Werkes; gemeint ist jeweils ein Zyklus von neunundvierzig Jahren.
