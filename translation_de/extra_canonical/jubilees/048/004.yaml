  yaml_path: translation/extra_canonical/jubilees/048/004.yaml
  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: de
  text: Doch ich rettete dich aus seiner Hand, und du tatest die Zeichen und Wunder, die du in Ägypten gegen den Pharao, gegen sein ganzes Haus, gegen seine Diener und gegen sein Volk zu tun gesandt worden warst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባላሕኩከ
  choice: ich rettete dich
  rationale: Das Verb bezeichnet hier die Befreiung beziehungsweise Errettung aus der Gewalt eines anderen; „rettete“ ist im Deutschen natürlich und wahrt den Zusammenhang mit „aus seiner Hand“.
- source_word: እምእዴሁ
  choice: aus seiner Hand
  rationale: Die konkrete geezische Wendung wird beibehalten; „Hand“ steht dabei zugleich für Macht oder Gewalt.
- source_word: ገበርከ
  choice: du vollbrachtest
  rationale: Wörtlich „du tatest/machtest“; bei Zeichen und Wundern ist „vollbrachtest“ idiomatisch, würdig und semantisch eng.
- source_word: ተአምረ፡ ወመንክረ
  choice: die Zeichen und Wunder
  rationale: Die feste deutsche Wortverbindung gibt beide koordinierten Begriffe knapp und traditionsübergreifend wieder.
- source_word: ለዛ፡ ተፈነውከ፡ ትግበር
  choice: zu deren Vollbringung du gesandt worden warst
  rationale: Die Formulierung bildet den Zweck- beziehungsweise Bezugscharakter von ለዛ ab, vermeidet aber die ungrammatische Struktur der zwischenzeitlichen englischen Revision.
- source_word: ላዕለ
  choice: gegen
  rationale: Die mehrfach wiederholte Präposition bezeichnet hier die gegen Pharao und die übrigen Gruppen gerichteten Zeichen und Wunder; ihre Wiederholung wird bewahrt.
theological_decisions:
- issue: Agens der Rettung und Sendung
  choice: Die erste Person bleibt ausdrücklich Agens der Rettung; die Sendung wird passiv wiedergegeben.
  alternative: Das ungenannte Agens der Sendung ausdrücklich mit Gott identifizieren.
  rationale: Der Vers nennt das Agens des Passivs nicht ausdrücklich. Die Übersetzung vermeidet daher eine über den Wortlaut hinausgehende Identifizierung.
- issue: Richtung der Zeichen und Wunder
  choice: „gegen“ wird für alle genannten Adressaten verwendet.
  alternative: „an“ oder „vor“ Pharao und seinem Haus.
  rationale: Der Kontext und die wiederholte Präposition stützen eine konfrontative beziehungsweise gerichtliche Nuance, ohne deren genaue theologische Funktion weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Struktur „gegen …“ folgt der rhetorischen Reihung der Vorlage. „Zu deren Vollbringung“ ist leicht formell, gibt den geezischen Bezug jedoch klar und grammatisch wieder.
