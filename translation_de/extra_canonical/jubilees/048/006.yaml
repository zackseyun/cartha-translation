  yaml_path: translation/extra_canonical/jubilees/048/006.yaml
  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: de
  text: Und er verbrannte sie mit Feuer. Alles wurde in deine Hand gelegt, damit du es ausführtest, ehe es geschah; und du warst zugegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine ältere Deutung lautet: »und nichts geschah ohne dich«; der ge’ezische Wortlaut bedeutet hier eher: »ehe es geschah; und du warst zugegen«.'
    reason: Dokumentiert die überlieferte alternative Wiedergabe, ohne sie in den Haupttext einzutragen oder die ausdrückliche Aussage über die Anwesenheit auszulassen.
lexical_decisions:
- source_word: አውዐዮሙ፡ በእሳት
  choice: verbrannte sie mit Feuer
  rationale: Gibt das kausative Verb mit dem Pluralsuffix sowie die instrumentale Wendung eng und natürlich wieder.
- source_word: ኵሉ፡ ተፈነወ፡ በእዴከ
  choice: Alles wurde in deine Hand gelegt
  rationale: ተፈነወ bezeichnet ein Übergeben bzw. Überlassen; die deutsche Wendung bewahrt das Bild der anvertrauten Verfügung, ohne das weniger natürliche »durch deine Hand gesandt« zu erzwingen.
- source_word: ከመ፡ ትግበር
  choice: damit du es ausführtest
  rationale: Die Finalkonstruktion wird ausdrücklich wiedergegeben; »ausführen« passt zum anvertrauten Handeln und vermeidet eine schwer verständliche Wiederholung von »tun«.
- source_word: ዘእንበለ፡ ይትገበር
  choice: ehe es geschah
  rationale: 'Die Verbindung mit እንበለ und dem Subjunktiv hat hier zeitlichen Sinn: »bevor/ehe es getan wurde bzw. geschah«.'
- source_word: ወሀለወከ
  choice: und du warst zugegen
  rationale: Gibt das Verb des Daseins bzw. Anwesendseins samt Anrede direkt wieder.
theological_decisions:
- issue: Verhältnis des angeredeten Wesens zum Geschehen
  choice: Die zeitliche Aussage und die Anwesenheit werden getrennt und ausdrücklich wiedergegeben.
  alternative: »und nichts geschah ohne dich«
  rationale: Die Alternative verdichtet beide Aussagen zu einer Behauptung umfassender Mitwirkung. Der ge'ezische Wortlaut stützt genauer die zeitliche Lesart »ehe es geschah« und nennt anschließend ausdrücklich die Anwesenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zugegen« ist leicht gehoben, aber allgemein verständlich und bildet die ausdrücklich genannte Anwesenheit prägnant ab.
