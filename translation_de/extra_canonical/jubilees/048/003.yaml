base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: de
  text: Auf dem Weg, am Nachtlager, begegnete er dir[a]. Wollte er dich nicht mit aller Macht töten und die Ägypter aus deiner Hand retten, als er sah, dass du gesandt worden warst, dies zu tun und an Ägypten Vergeltung zu üben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann hier im Zusammenhang der tödlichen Begegnung während der Reise auch im Sinn eines feindseligen Entgegentretens verstanden werden; vgl. die Begebenheit in Exodus 4,24.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትትቄበሎ (tǝtqäbbälo)
  choice: begegnete er dir
  rationale: Das Verb bezeichnet ein Begegnen oder Entgegentreten. Die neutrale Grundbedeutung bleibt im Haupttext erhalten; der feindselige Charakter ergibt sich aus dem folgenden Tötungsversuch und wird in der Fußnote erläutert.
- source_word: በምጽላል (ba-məṣlal)
  choice: am Nachtlager
  rationale: Die Wendung bezeichnet den Rast- beziehungsweise Übernachtungsort auf der Reise und entspricht dem Schauplatz der zugrunde liegenden Exodus-Episode.
- source_word: አኮሁ (ʾakohu)
  choice: Wollte er ... nicht?
  rationale: Die Form leitet eine rhetorische Frage ein; sie darf nicht als bloße Aussage wiedergegeben werden.
- source_word: በቀለ (baqala)
  choice: Vergeltung zu üben
  rationale: Das Wortfeld umfasst Rache beziehungsweise Vergeltung. Diese Wiedergabe wahrt den gerichtlichen Ernst, ohne den Ausdruck enger als nötig auf ein förmliches Gerichtsverfahren festzulegen.
theological_decisions:
- issue: Art der Begegnung am Nachtlager
  choice: Im Haupttext steht das offene „begegnete er dir“; die feindselige Bedeutung wird durch den Kontext und eine Fußnote kenntlich.
  alternative: „trat er dir feindselig entgegen“ oder „kam er gegen dich, um dich anzuklagen“
  rationale: Der geʿezische Ausdruck trägt nicht die spezifische Bedeutung „anklagen“. Eine ausdrückliche Feindseligkeit ist kontextuell plausibel, sollte aber nicht als zusätzliche lexikalische Information in den Haupttext eingetragen werden.
- issue: Bedeutung der an Ägypten auszuführenden Handlung
  choice: „an Ägypten Vergeltung zu üben“
  alternative: „Gericht an Ägypten zu vollstrecken“
  rationale: „Vergeltung“ liegt näher am geʿezischen Wortlaut und bewahrt zugleich den theologischen Zusammenhang göttlichen Gerichts, ohne beides vollständig gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nachtlager“ ist allgemein verständlich und bewahrt den Reisecharakter der Szene. Die rhetorische Frage und die Spannung zwischen neutralem „begegnen“ und dem tödlichen Kontext bleiben erhalten.
