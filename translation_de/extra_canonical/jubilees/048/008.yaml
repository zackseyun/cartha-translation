  yaml_path: translation/extra_canonical/jubilees/048/008.yaml
  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: de
  text: Durch ihn nahm er Rache für Israel. Und der HERR tat alles für Israel gemäß seiner Ordnung, die er mit Abraham festgesetzt hatte, um sich an ihnen zu rächen, so wie sie die Israeliten mit Gewalt versklavt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦቱ
  choice: Durch ihn
  rationale: Gibt die instrumentale Wendung wieder und bewahrt den im unmittelbaren Vers nicht ausdrücklich benannten Bezug des Pronomens.
- source_word: በቀለ፡ ለእስራኤል
  choice: rächte er Israel
  rationale: Gibt das Vergeltungsverb und Israel als den Begünstigten knapp und idiomatisch wieder; der Satz ist keine Zweckangabe.
- source_word: ሥርዐቱ
  choice: seiner Ordnung
  rationale: Das Wort bezeichnet hier eine festgesetzte Ordnung oder Bestimmung; „Bund“ wäre spezifischer, als der Ausdruck selbst verlangt.
- source_word: ዘተካየደ፡ ምስለ፡ አብርሃም
  choice: die er mit Abraham festgesetzt hatte
  rationale: Bringt den Gedanken einer mit Abraham eingerichteten beziehungsweise festgesetzten Ordnung natürlich zum Ausdruck.
- source_word: በከመ
  choice: so wie
  rationale: Bewahrt den vergleichenden beziehungsweise proportionalen Sinn und macht daraus nicht bloß eine kausale Begründung.
- source_word: ቀነይዎሙ፡ በግፍዕ
  choice: sie die Israeliten mit Gewalt versklavt hatten
  rationale: Das Verb bezeichnet Unterwerfung oder Versklavung; „mit Gewalt“ gibt die adverbiale Bestimmung präzise und natürlich wieder.
theological_decisions:
- issue: Bezug der männlichen Pronomen
  choice: Die Pronomen bleiben im ersten Satz unaufgelöst; im letzten Satz wird das Objekt zur Verständlichkeit als „die Israeliten“ bezeichnet.
  alternative: Die handelnden und betroffenen Personen durchgehend ausdrücklich als Gott, Mose, Ägypter und Israeliten benennen.
  rationale: Der Ausgangstext verwendet Pronomen. Eine vollständige Explizierung würde kontextuelle Identifikationen in den Vers hineintragen; beim letzten Objekt verhindert „die Israeliten“ jedoch im Deutschen eine schwer verständliche Folge mehrerer gleichlautender Pronomen.
- issue: Art der mit Abraham verbundenen Festsetzung
  choice: „Ordnung“
  alternative: „Bund“
  rationale: Die Formulierung lässt einen Bezug auf Gottes Bundeszusage zu, nennt lexikalisch jedoch eine Ordnung oder Bestimmung. Die Übersetzung vermeidet daher eine unnötige theologische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und zwar“ glättet die doppelte ge’ezische Verknüpfung, ohne den sachlichen Zusammenhang zu verändern. Die Wiederholung des Rachemotivs bleibt wie in der Quelle erhalten.
