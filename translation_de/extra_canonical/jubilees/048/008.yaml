  source_fidelity: Der Entwurf gibt die instrumentale Eröffnung, die Vergeltung zugunsten Israels, die mit Abraham festgesetzte Ordnung sowie den vergleichenden Sinn von በከመ und die gewaltsame Versklavung zutreffend wieder. Die handelnden bzw. betroffenen Personen werden nicht über das vom Kontext her Erforderliche hinaus festgelegt.
  naturalness: „Durch ihn rächte er Israel“ ist im Deutschen zwar verständlich, aber weniger idiomatisch und kann kurz den Eindruck erwecken, Israel sei das Ziel der Rache. „Durch ihn nahm er Rache für Israel“ gibt die Begünstigtenbeziehung klar und natürlich wieder. „Und zwar“ ist eine nicht erforderliche erläuternde Verstärkung und wird weggelassen.
  terminology: „HERR“, „Ordnung“, „festgesetzt“, „Rache“ und „versklavt“ sind angemessen. „Ordnung“ vermeidet die sachlich nicht gebotene Einengung auf „Bund“.
