  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: de
  text: Und am vierzehnten Tag sowie am fünfzehnten, sechzehnten, siebzehnten und achtzehnten war der Fürst Mastema gebunden und hinter den Kindern Israels eingekerkert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hinter den Kindern Israels“. Die genaue räumliche oder relationale Bedeutung der Wendung bleibt unklar.'
    reason: translation_note
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ
  choice: der Fürst Mastema
  rationale: መኩንን bezeichnet einen Herrscher, Fürsten oder Machthaber; „Fürst“ gibt Rang und Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: አቡረ
  choice: war … gebunden
  rationale: Die Form bezeichnet das Gebundensein; die Zustandsformulierung passt zu der Folge datierter Tage.
- source_word: ወዐዐወ
  choice: und … eingekerkert
  rationale: Das Verb bezeichnet Gefangensetzung beziehungsweise Einschließung. „Eingekerkert“ wahrt die stärkere Bedeutung neben „gebunden“.
- source_word: እምድኅሬሆሙ
  choice: hinter den Kindern Israels
  rationale: Die räumliche Wendung bedeutet unmittelbar „hinter ihnen“. Die ungewöhnliche Formulierung wird nicht interpretierend geglättet.
theological_decisions:
- issue: Art und Zweck der Gefangensetzung Mastemas
  choice: Nur das Gebundensein und Eingekerkertsein wird ausgesagt.
  alternative: Mastema sei gebunden worden, damit er Israel nicht anklagen oder verfolgen könne.
  rationale: Der vorliegende Vers nennt keinen Zweck. Eine solche Erklärung aus dem Kontext würde die Aussage theologisch präzisieren, ohne im gegebenen Wortlaut ausdrücklich zu stehen.
- issue: Referenz der Kinder
  choice: „Kinder Israels“ entsprechend der überlieferten Verszuordnung und dem unmittelbaren Kontext
  alternative: nur „die Kinder“
  rationale: Der vorgelegte Text endet sichtbar mit „den Kindern“; die traditionelle Textgestalt und der Kontext identifizieren sie als die Kinder Israels. Die Ergänzung macht den deutschen Bezug verständlich, ohne eine neue Personengruppe einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Datumsfolge wird leicht gestrafft, ohne einen der genannten Tage auszulassen. Die ungewöhnliche Wendung „hinter den Kindern Israels“ bleibt zur Wahrung der Mehrdeutigkeit stehen. Die einleitenden Wörter des bereitgestellten äthiopischen Textes werden als Schluss des vorhergehenden Verses behandelt.
