revisions:
- from: Er half den Ägyptern, sodass sie den Israeliten nachjagten. Er verhärtete ihre Herzen und machte sie hartnäckig; doch vom Herrn, Gott, kam die Vergeltung, sodass er sie vernichtete.[a]
  to: Er half den Ägyptern, damit sie den Kindern Israels nachsetzten. Er verhärtete ihre Herzen und machte sie starrsinnig. Dann verbarg er sich vor dem Herrn, Gott, damit er sie erschlagen konnte.[a]
  rationale: Eine vollständige Revision ist erforderlich, weil die zentrale Wendung ተኀስየ nicht Vergeltung, sondern ein Sich-Verbergen ausdrückt. Die korrigierte Fassung folgt der ge’ezischen Syntax und Lexik, lässt die nicht aufgelösten Pronomen absichtlich offen und dokumentiert die gravierende Abweichung des englischen Audit-Texts in einer korrekt verankerten Fußnote.
