  source_fidelity: 'Die Entsprechungen für Hilfe an die Ägypter, Verfolgung der Kinder Israels sowie Verhärtung und Starrsinn ihrer Herzen sind im Entwurf im Wesentlichen zutreffend. Die Wiedergabe von ወተኀስየ als „kam die Vergeltung“ ist jedoch nicht haltbar: Das Verb bedeutet hier „sich verbergen/verborgen sein“. Auch ይምሐጾሙ bezeichnet eher „schlagen/erschlagen“ als zwingend „vernichten“. Die Pronomen bleiben im Quellenausschnitt mehrdeutig und dürfen nicht durch eine ausdrückliche Identifizierung des Subjekts ergänzt werden.'
  naturalness: Die revidierte Fassung ist flüssiges modernes Standarddeutsch und behält den knappen, würdigen Erzählton. „Den Kindern Israels nachsetzten“ gibt die wörtliche Bezugsgröße klarer wieder als das etwas freiere „den Israeliten nachjagten“.
  terminology: „Herr, Gott“ entspricht dem ausdrücklich genannten Gottesnamen-Titel እግዚአብሔር፡ አምላክ. „Herzen verhärten“ ist die etablierte und zugleich quellennähere Formulierung. „Starrsinnig machen“ bewahrt die zusätzliche Aussage von አንየሎሙ, ohne sie mit der Verhärtung gleichzusetzen.
