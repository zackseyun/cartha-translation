  text: Israel, so that he could not accuse them.
translation:
  language: de
  text: Er half den Ägyptern, damit sie den Kindern Israels nachsetzten. Er verhärtete ihre Herzen und machte sie starrsinnig. Dann verbarg er sich vor dem Herrn, Gott, damit er sie erschlagen konnte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte ge’ezische Quellzeile weicht erheblich vom englischen Konsultationstext „Israel, so that he could not accuse them“ ab. Sie spricht von der Hilfe für die Ägypter, ihrer Verfolgung der Kinder Israels, der Verhärtung ihrer Herzen und davon, dass „er“ sich vor dem Herrn, Gott, verbarg, damit „er“ „sie“ erschlagen konnte. Die Pronomen sind im Quellenausschnitt nicht näher bestimmt und werden daher nicht ausgelegt.
    reason: Transparenz über die Abweichung der englischen Konsultationsschicht sowie über die im ge’ezischen Ausschnitt verbleibenden pronominalen Bezüge.
lexical_decisions:
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: sie … nachjagten
  rationale: Die Wendung bezeichnet das Verfolgen beziehungsweise Nachsetzen hinter jemandem und wird im Kontext idiomatisch mit „nachjagen“ wiedergegeben.
- source_word: ጸጽንዐ፡ አልባቢሆሙ
  choice: Er verhärtete ihre Herzen
  rationale: Die bildhafte Rede vom Festmachen oder Verhärten der Herzen bleibt erhalten.
- source_word: አንየሎሙ
  choice: machte sie hartnäckig
  rationale: Die Wahl gibt das Verstärken ihres widerständigen, unbeugsamen Verhaltens wieder, ohne den vorherigen Ausdruck bloß zu verdoppeln.
- source_word: ተኀስየ
  choice: kam die Vergeltung
  rationale: Das Verb bezeichnet hier das Vollziehen von Vergeltung oder Ahndung; eine unpersönliche deutsche Form wahrt die syntaktische Spannung des Ausgangstextes.
- source_word: ይምሐጾሙ
  choice: er sie vernichtete
  rationale: Das Verb wird im Zusammenhang des göttlichen Gerichts als vernichtendes Schlagen verstanden.
theological_decisions:
- issue: Subjekt des Verhärtens
  choice: Das männliche Singularsubjekt bleibt mit „Er“ unausgedeutet.
  alternative: Den Fürsten Mastema oder Gott ausdrücklich als Subjekt nennen.
  rationale: Der vorgelegte Ausschnitt nennt das Subjekt nicht ausdrücklich; eine namentliche Festlegung würde Kontext ergänzen, der in der Quellzeile selbst fehlt.
- issue: Urheber der Vergeltung
  choice: „vom Herrn, Gott, kam die Vergeltung“
  alternative: „der Herr, Gott, nahm Vergeltung“
  rationale: Die gewählte Form folgt der passivisch beziehungsweise unpersönlich wirkenden Konstruktion und vermeidet eine unnötige syntaktische Glättung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit maßvoll geglättet; unklare Subjektbezüge wurden nicht durch theologische Deutung aufgelöst.
