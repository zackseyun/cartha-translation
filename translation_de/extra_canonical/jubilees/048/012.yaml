  yaml_path: translation/extra_canonical/jubilees/048/012.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: de
  text: Und am vierzehnten Tag und am fünfzehnten und am sechzehnten und am siebzehnten und am achtzehnten wurde der Engel Mastema gebunden und daran gehindert, den Kindern Israels nachzusetzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: Engel
  rationale: Das geʿezische Wort bezeichnet einen Engel oder Boten. Im Zusammenhang mit Mastema ist „Engel“ die direkte und natürliche Wiedergabe.
- source_word: ተእስረ
  choice: wurde … gebunden
  rationale: Die passive Verbform wird formal und idiomatisch mit „wurde gebunden“ wiedergegeben.
- source_word: ተዐግሠ
  choice: daran gehindert
  rationale: Das Verb bezeichnet hier ein Zurückhalten oder Hindern; zusammen mit der folgenden Wendung ergibt sich natürlich, dass Mastema am Nachsetzen gehindert wurde.
- source_word: እምድኅረ
  choice: … nachzusetzen
  rationale: Die Wendung bedeutet räumlich „hinter … her“ und bezeichnet im Kontext das Verfolgen beziehungsweise Nachsetzen.
- source_word: ደቂቀ እስራኤል
  choice: den Kindern Israels
  rationale: Die traditionelle deutsche Wendung bewahrt die Form des geʿezischen Ausdrucks und ist in biblisch geprägter Standardsprache verständlich.
theological_decisions:
- issue: Bezeichnung Mastemas
  choice: der Engel Mastema
  alternative: der Fürst Mastema
  rationale: Der vorliegende Quelltext enthält ausdrücklich መልአክ („Engel/Bote“), nicht den Titel „Fürst“. Daher wird keine zusätzliche Rangbezeichnung eingeführt.
- issue: Verhältnis der beiden passiven Verben
  choice: „gebunden und daran gehindert“ als zwei zusammengehörige Handlungen
  alternative: „gebunden und zurückgehalten“
  rationale: Die gewählte Fassung bewahrt beide Verben und macht zugleich deutlich, dass das zweite auf Mastemas verhindertes Nachsetzen zielt, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Tageszählung mit „und“ bleibt erhalten, um die auffällige kalendarische Abfolge und den parataktischen Stil der Quelle zu bewahren. Keine Fußnote ist nötig, da weder eine relevante Textvariante noch eine erklärungsbedürftige Mehrdeutigkeit vorliegt.
