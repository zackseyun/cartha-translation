  yaml_path: translation/extra_canonical/jubilees/019/003.yaml
  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
translation:
  language: de
  text: Abraham ging hin, um über sie zu weinen und sie zu begraben. Und wir prüften ihn, um zu sehen, ob sein Geist geduldig war und er in seinen Worten nicht in Zorn geriet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte äthiopische Textzeile ist am Ende abgebrochen und bietet zuvor eine abweichende Zeichenfolge, die als „und er gedachte ihrer“ verstanden werden könnte. Die hier wiedergegebene, textkritisch gestützte Lesart lautet sinngemäß „und wir prüften ihn“; sie entspricht dem Zusammenhang, in dem Abrahams Geduld geprüft wird.
    reason: textual_variant_and_truncated_source
lexical_decisions:
- source_word: ይብክያ
  choice: über sie zu weinen
  rationale: Das Verb bezeichnet das Weinen beziehungsweise Klagen um die Verstorbene; die Formulierung ist natürlich und bewahrt den Trauerkontext.
- source_word: ይቅበራ
  choice: sie zu begraben
  rationale: Gibt das äthiopische Verb für „begraben/bestatten“ unmittelbar wieder.
- source_word: ወመከርኖ (textkritisch erschlossen gegenüber dem überlieferten/angegebenen ወናዝከሮ)
  choice: Und wir prüften ihn
  rationale: Die textkritisch gestützte Lesart bedeutet „wir prüften ihn“ und passt zum Sprecher sowie zum Motiv der Erprobung Abrahams; die abweichende Zeichenfolge der vorgelegten Textzeile wird in der Fußnote offengelegt.
- source_word: ይትነገሥ፡ መንፈሱ
  choice: ob sein Geist geduldig bliebe
  rationale: Bewahrt die Prüfung seiner inneren Beherrschung, ohne daraus eine spezifische dogmatische Aussage über den Geist zu machen.
- source_word: speech of his mouth
  choice: in den Worten seines Mundes
  rationale: Die körperbezogene Ausdrucksweise wird als semitisch-äthiopische Formulierung beibehalten, bleibt aber im Deutschen verständlich.
theological_decisions:
- issue: Abrahams Prüfung angesichts von Saras Tod
  choice: Die Prüfung wird ausdrücklich als Handlung des sprechenden „wir“ wiedergegeben.
  alternative: „und er gedachte ihrer“ entsprechend der isoliert vorgelegten Lesart ወናዝከሮ
  rationale: Der weitere Textzusammenhang und die textkritisch korrigierte Lesart stützen das Prüfungsmotiv; die Unsicherheit wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
- issue: Art von Abrahams Reaktion
  choice: „er ließ sich … nicht zu Heftigkeit hinreißen“
  alternative: „er wurde nicht gewalttätig“
  rationale: Die Aussage betrifft ausdrücklich seine Rede. „Heftigkeit“ wahrt die Spannung zwischen innerer Prüfung und äußerer Selbstbeherrschung, ohne körperliche Gewalt zu unterstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bleibt schlicht und erzählerisch; im zweiten wird die etwas formelhafte Rede vom „Geist“ und von den „Worten seines Mundes“ bewusst erhalten. Die Formulierung vermeidet sowohl altertümliche Sprache als auch eine konfessionelle Ausdeutung.
