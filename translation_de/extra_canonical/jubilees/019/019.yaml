lexical_decisions:
- source_word: ዘይቀውም
  choice: der sich … hervorheben wird
  rationale: Das Relativpartizip mit dem Verb „stehen/Bestand haben“ wird im gegebenen Vergleichskontext idiomatisch als Hervortreten beziehungsweise Sich-Hervorheben wiedergegeben; die Zukunftsbedeutung bleibt erhalten.
- source_word: እምኵሎሙ፡ አሕዛብ
  choice: aus allen Völkern
  rationale: Gibt die Präposition „aus/von“ und die Gesamtheit der Völker direkt und natürlich wieder.
- source_word: እለ፡ ዲበ፡ ገጸ፡ ምድር
  choice: die auf der Erde leben
  rationale: Die wörtliche Wendung „die auf dem Angesicht der Erde [sind]“ wird in geläufiges modernes Deutsch übertragen, ohne ihren universalen Umfang zu verändern.
- source_word: ወናሁ
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch das deiktische Übergangssignal.
- source_word: ይስሐቅ፡ ወልድየ
  choice: mein Sohn Isaak
  rationale: Im Deutschen ist diese Wortstellung als Anrede natürlich; Zugehörigkeit und Name bleiben eindeutig.
