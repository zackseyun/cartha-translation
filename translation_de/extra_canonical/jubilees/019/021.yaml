  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: de
  text: zum Segen auf der Erde, von nun an und durch alle Generationen der Erde hindurch. Mögen deine Hände stark sein, und möge dein Herz sich über deinen Sohn Jakob freuen; denn ihn habe ich weit mehr geliebt als sie alle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት
  choice: zum Segen
  rationale: Gibt die Zweck- bzw. Ergebnisbestimmung der einleitenden Wendung knapp wieder und bewahrt ihren fragmentarischen Anschluss an den vorausgehenden Kontext.
- source_word: ትውልደ፡ ምድር
  choice: Generationen der Erde
  rationale: Bewahrt die wiederholte Nennung der Erde und die zeitliche Reichweite über sämtliche Generationen hinweg.
- source_word: ይጽንዓ፡ እደዊኪ
  choice: Deine Hände sollen stark sein
  rationale: Entspricht der bildhaften geezischen Ausdrucksweise und vermeidet eine unnötige Auflösung in abstrakte Tatkraft.
- source_word: ትትፈሣሕ፡ ልብኪ
  choice: dein Herz soll sich … freuen
  rationale: Erhält das Herz als Sitz der Freude und formuliert zugleich natürliches modernes Deutsch.
- source_word: ፈድፋደ፡ እምኵሎሙ
  choice: weit mehr … als sie alle
  rationale: Gibt den verstärkten Vergleich wieder und lässt den aus dem Kontext erschließbaren Bezug der Mehrzahl bestehen.
theological_decisions:
- issue: Besondere Liebe zu Jakob
  choice: denn ihn habe ich weit mehr geliebt als sie alle
  alternative: denn ihn liebe ich mehr als alle anderen
  rationale: Die Übersetzung bewahrt die ausdrücklich vergleichende, gesteigerte Aussage sowie die Vergangenheitsform des Quelltexts, ohne die Identität der Vergleichsgruppe dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt bewusst mit „zum Segen“, da die geezische Vorlage syntaktisch an den vorausgehenden Satz anschließt; diese Anschlussstruktur wird nicht künstlich zu einem vollständigen Hauptsatz umgeformt.
