  yaml_path: translation/extra_canonical/jubilees/019/024.yaml
  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: de
  text: Gott sei mein Gott und der Gott meiner Nachkommen, der Gott Jakobs und seiner Nachkommen, für alle Zeiten.[a] Und in seinen Nachkommen sollen mein Name und die Namen meiner Vorfahren – Sem, Noah, Henoch, Mahalalel, Enosch und Set – gesegnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach anderer Auffassung: »Meine Nachkommen sollen Jakob und seinen Nachkommen für immer gehören.«'
    reason: Die knappe geezische Syntax der ersten Satzhälfte lässt neben der als Haupttext wiedergegebenen Deutung eine abweichende Zuordnung der Zugehörigkeitsangaben zu.
lexical_decisions:
- source_word: እግዚአብሔር፡ ኪያየ
  choice: Gott sei mein Gott
  rationale: Das geezische ኪያየ bezeichnet hier eine Beziehung zu »mir/mein«; im Deutschen macht die Wiederaufnahme von »Gott« die elliptische Zugehörigkeitsaussage verständlich.
- source_word: ወዘርእየ፡ ለያዕቆብ፡ ወለዘርኡ
  choice: und der Gott meiner Nachkommen, der Gott Jakobs und seiner Nachkommen
  rationale: Die koordinierten Genitiv- beziehungsweise Zugehörigkeitsangaben werden idiomatisch entfaltet, ohne eine Identifizierung der Nachkommenschaften zu behaupten.
- source_word: ኵሎ፡ መዋዕለ
  choice: für alle Zeiten
  rationale: Wörtlich etwa »alle Tage«; die deutsche Wendung gibt den dauerhaften Zeithorizont natürlich und würdig wieder.
- source_word: በዘርኡ
  choice: durch seine Nachkommen
  rationale: Die Präposition kann instrumental oder lokal verstanden werden; »durch« bildet den naheliegenden instrumentalen Sinn ab, während die Alternative in der Fußnote erhalten bleibt.
- source_word: ይትባረክ
  choice: sollen … gesegnet werden
  rationale: Die passive Verbform wird als Segenswunsch beziehungsweise Zukunftsaussage wiedergegeben und auf »mein Name und die Namen« bezogen.
- source_word: አበዊየ
  choice: meiner Vorfahren
  rationale: Das Wort bezeichnet wörtlich »meine Väter«; »Vorfahren« ist im Deutschen bei der anschließenden Ahnenreihe natürlicher und schließt fernere Generationen ein.
theological_decisions:
- issue: Zugehörigkeit Gottes in der ersten Satzhälfte
  choice: Gott sei mein Gott und der Gott meiner Nachkommen, der Gott Jakobs und seiner Nachkommen
  alternative: Meine Nachkommen sollen Jakob und seinen Nachkommen für immer gehören
  rationale: እግዚአብሔር steht ausdrücklich am Satzanfang und ist am plausibelsten das Subjekt von ይኩን. Die Zugehörigkeitsangaben bleiben jedoch syntaktisch knapp, weshalb die abweichende Deutung als Fußnote dokumentiert wird.
- issue: Segen des Namens in der Nachkommenschaft
  choice: durch seine Nachkommen sollen mein Name und die Namen meiner Vorfahren … gesegnet werden
  alternative: in seinen Nachkommen sollen … gesegnet werden
  rationale: Die instrumentale Wiedergabe ist idiomatisch und theologisch nicht überbestimmt; die lokale beziehungsweise sphärische Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung »der Gott …« verdeutlicht die im Geez elliptisch ausgedrückte Zugehörigkeit. Die Namensformen folgen den im Deutschen üblichen biblischen Schreibungen.
