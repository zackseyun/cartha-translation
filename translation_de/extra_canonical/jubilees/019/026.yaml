lexical_decisions:
- source_word: ብርሃናት
  choice: die Lichter
  rationale: Der äthiopische Plural bezeichnet hier die Himmelslichter; die schlichte Wiedergabe bewahrt den Anschluss an den vorausgehenden Satz.
- source_word: ምጽናዓት
  choice: Himmelsgewölbe
  rationale: Das Wort bezeichnet das Firmament beziehungsweise die feste Himmelswölbung. »Himmelsgewölbe« ist im modernen Deutsch verständlich und wahrt zugleich das antike Weltbild.
- source_word: ጸውዖ
  choice: rief
  rationale: Das Verb bedeutet hier »rufen/herbeirufen«; »rief« bleibt nah an der Quelle und passt zum folgenden Namen als direktem Objekt.
- source_word: በቅድመ፡ አዕይንቲሃ
  choice: vor den Augen
  rationale: Die idiomatische Wendung wird bewusst relativ wörtlich wiedergegeben, da sie Rebekkas Anwesenheit und Zeugenschaft hervorhebt.
- source_word: እሙ
  choice: seiner Mutter
  rationale: Das suffigierte Substantiv bezieht sich auf Jakob; die deutsche Form macht den grammatischen Bezug natürlich verständlich.
