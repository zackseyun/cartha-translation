  yaml_path: translation/extra_canonical/jubilees/019/020.yaml
  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: de
  text: Er liebt Esau mehr als Jakob[a]. Doch ich sehe deine gerechte Liebe zu Jakob. Erweise ihm auch weiterhin Güte, und blicke liebevoll auf ihn; denn von nun an und durch alle Generationen der Erde wird er ein Segen auf der Erde sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er liebt Esau.“'
    reason: Die Vergleichsfunktion von እም ist hier möglich, doch eine nicht vergleichende Wiedergabe ist überliefert und wird als echte Alternative vermerkt.
lexical_decisions:
- source_word: ያፈቅሮ፡ ለዔሳው፡ እም፡ ያዕቆብ
  choice: Er liebt Esau mehr als Jakob
  rationale: Die Verbform enthält das männliche Subjekt „er“; እም kann in diesem Vergleich „mehr als“ ausdrücken. Die alternative, nicht vergleichende Auffassung wird in der Fußnote bewahrt.
- source_word: መፍቀሪተ፡ ጽድቅ
  choice: gerechte Liebe
  rationale: Die nominale Verbindung von Liebe/Zuneigung und Gerechtigkeit wird eng und ohne konfessionelle Ausdeutung wiedergegeben.
- source_word: ወይኩና፡ አዕይንትኪ፡ ላዕሌሁ፡ ለፍቅር
  choice: und blicke liebevoll auf ihn
  rationale: Die wörtliche Rede von den auf ihn gerichteten Augen wird in natürliches modernes Deutsch übertragen, während der Sinn liebevoller Aufmerksamkeit erhalten bleibt.
theological_decisions:
- issue: Jakobs künftige Bedeutung
  choice: wird er ein Segen auf der Erde sein
  alternative: wird er auf der Erde gesegnet sein
  rationale: Die konsultierte vollständige Versüberlieferung versteht Jakob als Segen; diese prädikative Aussage wird beibehalten und nicht zu einer bloßen Segensempfangsformel umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt persönlich und direkt; „Generationen“ ist für heutige Leser verständlicher als das stärker bibelsprachliche „Geschlechter“.
