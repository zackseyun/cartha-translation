  yaml_path: translation/extra_canonical/jubilees/019/010.yaml
  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: de
  text: Und in dessen viertem Jahr nahm er für seinen Sohn Isaak eine Ehefrau. Sie hieß Rebekka und war die Tochter Betuëls, des Sohnes Nahors, des Bruders Abrahams; sie war die Schwester Labans und die Tochter Betuëls. Betuël aber war ein Sohn Milkas, der Frau Nahors, des Bruders Abrahams.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመት፡ ራብዕ፡ ሎቱ
  choice: in dessen viertem Jahr
  rationale: Gibt die rückbezügliche Zeitangabe wieder, ohne einen im Ausschnitt nicht ausdrücklich genannten Bezugszeitraum zu ergänzen.
- source_word: ነሥአ፡ ለይስሐቅ፡ ወልዱ፡ ብእሲተ
  choice: nahm er für seinen Sohn Isaak eine Frau
  rationale: Bewahrt die Konstruktion, wonach das Subjekt die Frau für Isaak nahm, statt Isaak selbst zum handelnden Subjekt zu machen.
- source_word: ወስማ፡ ርብቃ
  choice: Sie hieß Rebekka
  rationale: Natürliches modernes Deutsch für die wörtliche Namensformel „und ihr Name war Rebekka“.
- source_word: ወለተ፡ ባቱኤል
  choice: eine Tochter Betuëls
  rationale: Gibt die genealogische Beziehung direkt wieder; die historische Namensform Betuël entspricht dem biblischen deutschen Gebrauch.
- source_word: እኅተ፡ ላባ
  choice: die Schwester Labans
  rationale: Bewahrt die ausdrücklich genannte Geschwisterbeziehung.
- source_word: ወባቱኤል፡ ወልደ፡ ሜልካ
  choice: Betuël aber war ein Sohn Milkas
  rationale: Folgt der überlieferten ge'ezischen Formulierung und glättet sie nicht zu „Enkelin Milkas“, auch wenn die genealogische Aussage auffällig ist.
theological_decisions:
- issue: Auffällige genealogische Wiederholung und Abstammungsangabe
  choice: Die Wiederholung „Tochter Betuëls“ und die Aussage, Betuël sei ein Sohn Milkas, bleiben erhalten.
  alternative: Die Angaben zu „Enkelin Milkas“ zusammenziehen oder nach Genesis 24 harmonisieren.
  rationale: Die Vorlage wiederholt Betuëls Namen und formuliert die Abstammung ausdrücklich so. Eine Harmonisierung würde die textliche Spannung beseitigen und über die gegebene Quelle hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener genealogischer Wiederholung. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne Inhalte auszulassen oder die auffällige Überlieferung zu harmonisieren.
