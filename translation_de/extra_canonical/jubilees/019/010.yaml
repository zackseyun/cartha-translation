revisions:
- from: Und in dessen viertem Jahr nahm er für seinen Sohn Isaak eine Frau. Sie hieß Rebekka und war eine Tochter Betuëls, des Sohnes Nahors, des Bruders Abrahams, sowie die Schwester Labans und die Tochter Betuëls; Betuël aber war ein Sohn Milkas, der Frau Nahors, des Bruders Abrahams.
  to: Und in dessen viertem Jahr nahm er für seinen Sohn Isaak eine Ehefrau. Sie hieß Rebekka und war die Tochter Betuëls, des Sohnes Nahors, des Bruders Abrahams; sie war die Schwester Labans und die Tochter Betuëls. Betuël aber war ein Sohn Milkas, der Frau Nahors, des Bruders Abrahams.
  rationale: Die Revision dient ausschließlich der natürlichen und eindeutigen deutschen Satzstruktur. Die doppelte Nennung, Rebekka sei Betuëls Tochter, und die im überlieferten Wortlaut auffällige Angabe zu Betuël und Milka bleiben vollständig erhalten. Die in der Quelle und im englischen Audit-Trail nicht aufgelöste genealogische Spannung wird weder erklärt noch theologisch oder textkritisch harmonisiert.
