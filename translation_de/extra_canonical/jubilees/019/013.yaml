  text: And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a fierce man, and a man of the field,
translation:
  language: de
  text: 'Und in der sechsten Woche, in ihrem zweiten Jahr, gebar Rebekka Isaak zwei Söhne: Jakob und Esau. Jakob war glatt und rechtschaffen; Esau aber war ein rauer Mann[a] und ein Mann des Feldes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein harter oder heftiger Mann.'
    reason: Das ge’ezische ድሩክ bezeichnet einen rauen, harten oder heftigen Charakter; es bedeutet nicht »behaart«.
lexical_decisions:
- source_word: ልሙጽ
  choice: glatt
  rationale: Das ge’ezische Adjektiv bezeichnet hier Glätte beziehungsweise eine glatte Beschaffenheit. Die ungewohnte Formulierung bleibt erhalten, statt sie erklärend mit »unbehaart« zu harmonisieren.
- source_word: ሬትዕ
  choice: rechtschaffen
  rationale: Gibt die moralische Bedeutung »gerade, aufrichtig, rechtschaffen« in natürlichem modernem Deutsch wieder.
- source_word: ድሩክ
  choice: wild
  rationale: Das Wort bezeichnet einen rauen, harten oder heftigen Charakter. »Wild« wahrt diesen Sinn und vermeidet die sachlich unbegründete Harmonisierung mit »behaart« aus der Genesisüberlieferung.
- source_word: ሐቃላዊ
  choice: Mann des Feldes
  rationale: Die formnahe Wendung bewahrt das Quellenbild und legt nicht enger auf »Jäger« oder »Landarbeiter« fest.
theological_decisions:
- issue: Verhältnis zur Beschreibung Esaus in Genesis 25 und 27
  choice: 'Die ge’ezische Lesart als Charakterbeschreibung wiedergeben: »ein wilder Mann«'
  alternative: »ein behaarter Mann«
  rationale: Die vorliegende Quelle verwendet ድሩክ, nicht das ge’ezische Wort für »behaart«. Eine Angleichung an die Genesisformulierung würde fremden Wortlaut in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologische Formel und »Mann des Feldes« bleiben bewusst formnah; die Satzglieder werden durch Doppelpunkt und Semikolon lesefreundlich gegliedert.
