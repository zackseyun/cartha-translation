  text: than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for all the seed of Shem.”
translation:
  language: de
  text: 'mehr als Esau. Und er sagte zu ihr: »Meine Tochter, behüte meinen Sohn Jakob; denn er wird an meiner Stelle auf der Erde sein, zum Segen inmitten der Menschenkinder und für die ganze Nachkommenschaft Sems.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine ältere Übersetzung ergänzt vor »der ganzen Nachkommenschaft Sems« die Worte »zur Herrlichkeit«; im vorliegenden geʿezischen Text steht dafür kein entsprechendes Wort.
    reason: Dokumentiert die frühere, quellenmäßig nicht belegte Wiedergabe, ohne sie in den Haupttext aufzunehmen.
lexical_decisions:
- source_word: ዐቀቢ (ʿaqabi)
  choice: behüte
  rationale: Der Imperativ bezeichnet das Bewahren, Hüten oder Beschützen. „Behüte“ ist natürlich, würdevoll und lässt den genauen Umfang des Auftrags offen.
- source_word: ህየንቴየ (ḥəyäntēya)
  choice: an meiner Stelle
  rationale: Gibt die Stellvertretungs- bzw. Nachfolgevorstellung unmittelbar wieder, ohne sie näher auszudeuten.
- source_word: ለበረከት (la-barakat)
  choice: zum Segen
  rationale: Bewahrt die prädikative Zweck- bzw. Bestimmungsformulierung des Ausgangstextes.
- source_word: ውሉደ፡ ሰብእ (wəluда sabʾ)
  choice: Menschenkinder
  rationale: Entspricht der semitisch geprägten Wendung „Söhne/Kinder der Menschen“ in verständlichem, gehobenem Deutsch.
- source_word: ኵሉ፡ ዘርኡ፡ ሴም (kʷəllu zarʾu Sēm)
  choice: die ganze Nachkommenschaft Sems
  rationale: „Nachkommenschaft“ gibt „Same/Nachkommenschaft“ idiomatisch wieder; „die ganze“ bezieht sich auf die Gesamtheit von Sems Nachkommen.
theological_decisions:
- issue: Jakobs Stellung als Nachfolger Abrahams
  choice: „an meiner Stelle auf der Erde“
  alternative: „mein Stellvertreter auf der Erde“
  rationale: Die gewählte Fassung bewahrt die Aussage des Textes, ohne eine bestimmte institutionelle oder theologische Art der Stellvertretung festzulegen.
- issue: Bezug der Segensbestimmung
  choice: „zum Segen … und für die ganze Nachkommenschaft Sems“
  alternative: „zum Segen … und zur Herrlichkeit der ganzen Nachkommenschaft Sems“
  rationale: Im vorgelegten geʿezischen Text steht kein Wort für „Herrlichkeit“. Die koordinierte Formulierung bleibt daher eng am erhaltenen Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als Satzfortsetzung aus dem vorhergehenden Kontext bewusst mit „mehr als Esau“. „Menschenkinder“ erhält den biblisch-semitischen Ton, bleibt aber allgemein verständlich.
