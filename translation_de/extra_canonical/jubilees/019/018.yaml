  text: Denn ich weiß, dass der HERR ihn für sich zu einem Volk erwählen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእምር
  choice: ich weiß
  rationale: Gibt die Wissensaussage des äthiopischen Verbs direkt und natürlich wieder.
- source_word: ያኀሪ
  choice: erwählen wird
  rationale: Bewahrt den Zukunftsbezug und den Sinn von auswählen/erwählen.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe der Gottesbezeichnung; die Kapitälchenform entspricht dem vorgelegten englischen Konsultationstext.
- source_word: ኪያሁ … ሎቱ
  choice: ihn für sich
  rationale: Erhält sowohl das männliche Objekt als auch die reflexive Zielrichtung der Erwählung.
- source_word: ለሕዝብ
  choice: als ein Volk
  rationale: Gibt die prädikative Bestimmung wörtlich wieder, ohne die auffällige Spannung zwischen dem Singularpronomen und „Volk“ aufzulösen.
theological_decisions:
- issue: Verhältnis von „ihn“ zu „ein Volk“
  choice: Die singularische Formulierung bleibt unverändert erhalten.
  alternative: „seine Nachkommen zu seinem Volk“ oder „ihn und seine Nachkommen als sein Volk“
  rationale: Der gegebene äthiopische Text verbindet ausdrücklich ein männliches Singularobjekt mit „als ein Volk“. Eine Ausdeutung auf die Nachkommenschaft wäre kontextuell möglich, steht aber nicht ausdrücklich in diesem Versfragment.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Verbindung „ihn … als ein Volk“ wurde bewusst bewahrt, um die genuine Mehrdeutigkeit des Ausgangstextes nicht stillschweigend zu glätten.
