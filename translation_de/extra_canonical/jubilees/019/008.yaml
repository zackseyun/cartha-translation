lexical_decisions:
- source_word: መዋዕለ፡ ሕይወታ፡ ለሳራ
  choice: die Lebenstage Saras
  rationale: Die nahezu formale Wiedergabe bewahrt die semitische Ausdrucksweise und ist im Deutschen als biblisch geprägte, verständliche Formulierung natürlich.
- source_word: ዝመከራ፡ ዓሥር
  choice: die zehnte Prüfung
  rationale: Der Ausdruck bezeichnet im Kontext die zehnte Erprobung; „Prüfung“ gibt sowohl das Geschehen als auch dessen belastenden Charakter wieder.
- source_word: በዘተመከረ
  choice: durch die Abraham geprüft wurde
  rationale: Die Passivkonstruktion des Quelltexts wird bewahrt; der im englischen Konsultationstext bezeugte Name stellt den offenbar vorausgesetzten Bezug klar, ohne den Handelnden der Prüfung zu bestimmen.
theological_decisions:
- issue: Urheber der Prüfung
  choice: 'Passiv: „durch die Abraham geprüft wurde“'
  alternative: „mit der Gott Abraham prüfte“
  rationale: Der Quelltext benennt an dieser Stelle den Urheber nicht. Das Passiv wahrt diese Offenheit und vermeidet eine theologische Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblisch geprägter Wendung „Lebenstage“. Das eröffnende Fragment und das abschließende Komma bleiben erhalten, da der Vers offenbar an den vorherigen beziehungsweise folgenden Kontext anschließt.
