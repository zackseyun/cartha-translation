base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: de
  text: Darin[a] wurde Abraham als treu und geduldig im Geist befunden. Er sagte kein Wort über die Verheißung des Landes, von dem der HERR gesagt hatte, er werde es ihm und seinen Nachkommen nach ihm geben. Dennoch bat er dort um einen Platz, um seine Verstorbene zu begraben. Denn er wurde als treu befunden und auf den himmlischen Tafeln als Freund des HERRN verzeichnet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „In diesem“; gemeint ist die zuvor geschilderte Bewährung.'
    reason: Der knappe Rückverweis ቦቱ lässt sich im Deutschen sowohl mit „darin“ als auch mit „in diesem“ wiedergeben.
  - marker: b
    text: 'Auch möglich: „und er wurde als Freund aufgeschrieben“.'
    reason: Die Formulierung bewahrt die wörtliche Bildsprache des Schreibens; „verzeichnet“ ist im Haupttext idiomatischer.
lexical_decisions:
- source_word: ቦቱ
  choice: Darin
  rationale: Gibt den rückverweisenden Ausdruck „in diesem/darin“ wieder und bewahrt den Bezug auf die vorausgehende Bewährung Abrahams.
- source_word: ምእመነ
  choice: treu
  rationale: Entspricht hier der Aussage über Abrahams bewährte Zuverlässigkeit beziehungsweise Glaubenstreue.
- source_word: ዕጉሠ፡ መንፈስ
  choice: geduldig im Geist
  rationale: Bewahrt die innere, geistige Haltung des geduldigen Ausharrens, ohne sie psychologisch auszudeuten.
- source_word: ንባብ፡ ዘበምድር
  choice: Verheißung des Landes
  rationale: Im Kontext bezeichnet die Wendung die göttliche Zusage des Landes; „Verheißung“ ist im Deutschen natürlich und sachlich genauer als „Bericht“.
- source_word: ዘርኡ
  choice: seinen Nachkommen
  rationale: Das Kollektiv „Same“ wird in modernem Standarddeutsch verständlich als „Nachkommen“ wiedergegeben.
- source_word: መካነ፡ አስተብቍዐ
  choice: einen Platz … um … zu begraben
  rationale: Gibt die erbetene Grabstätte idiomatisch wieder, ohne einen technisch-rechtlichen Erwerbsbegriff einzuführen.
- source_word: ቤድኖ
  choice: seine Tote
  rationale: Bewahrt die konkrete singularische Bezeichnung der verstorbenen Angehörigen, ohne den im Satz nicht genannten Namen Sara einzusetzen.
- source_word: ተጽሕፈ፡ ዐርከ
  choice: als Freund … verzeichnet
  rationale: 'Das maskuline Passiv bezieht sich auf Abraham: Er selbst wurde als Freund eingetragen beziehungsweise verzeichnet.'
theological_decisions:
- issue: Gegenstand der Landzusage
  choice: Verheißung des Landes
  alternative: Wort/Bericht über das Land
  rationale: Der Kontext spricht von der Zusage des HERRN, das Land Abraham und seinen Nachkommen zu geben. Die Übersetzung macht diesen Zusagecharakter deutlich, ohne den Inhalt zu erweitern.
- issue: Bezeichnung Gottes
  choice: HERR
  alternative: Herr/Gott
  rationale: Die im Quelltext verwendete Gottesbezeichnung wird in würdigem bibelsprachlichem Deutsch als „HERR“ wiedergegeben; eine konfessionell enger bestimmte Deutung wird vermieden.
- issue: Abrahams Eintrag als Freund
  choice: Abraham wurde als Freund des HERRN verzeichnet
  alternative: Es wurde ihm als Freundschaft angerechnet
  rationale: Die Grammatik stellt Abraham als den Verzeichneten dar. Eine soteriologische Deutung im Sinn einer Anrechnung wäre eine unbelegte Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiederholung „als treu befunden“ bleibt erhalten, weil sie die Aussage rahmt. „Seine Tote“ bewahrt die konkrete Form des Quelltexts, ohne Sara ausdrücklich einzusetzen. Die Bezüge auf den HERRN und die himmlischen Tafeln folgen der überlieferten Versgestalt und der geprüften Konsultationsfassung.
