- from: und behaart. Jakob aber wohnte in Zelten. Die jungen Männer wuchsen heran, und Jakob lernte die Schrift; Esau dagegen lernte sie nicht, denn er war ein Mann des Feldes und ein Jäger, und er erlernte die Kriegskunst.
  to: und behaart. Jakob wohnte in Zelten. Die Jungen wuchsen heran, und Jakob lernte das Schreiben; Esau lernte es nicht, denn er war ein Mann des Feldes und ein Jäger, und er erlernte die Kriegskunst.
  rationale: Die Überarbeitung klärt allein das missverständliche „die Schrift“ zu „das Schreiben“, glättet die Altersbezeichnung und vermeidet nicht notwendige, interpretierende Kontrastpartikeln. Die fragmentarische Eröffnung bleibt erhalten, weil der Vers an den vorausgehenden Zusammenhang anschließt.
