  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: de
  text: und behaart. Jakob wohnte in Zelten. Die Jungen wuchsen heran, und Jakob lernte das Schreiben; Esau lernte es nicht, denn er war ein Mann des Feldes und ein Jäger, und er erlernte die Kriegskunst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸጕር
  choice: behaart
  rationale: Das Adjektiv führt als Satzfragment die Beschreibung aus dem vorausgehenden Kontext fort; „behaart“ gibt den körperlichen Zug knapp und natürlich wieder.
- source_word: ምጽላላት
  choice: Zelten
  rationale: Der äthiopische Plural wird formal bewahrt.
- source_word: ወሬዛ
  choice: die jungen Männer
  rationale: Bezeichnet die heranwachsenden männlichen Jugendlichen; die Wiedergabe wahrt den Plural und passt zum folgenden Bezug auf Jakob und Esau.
- source_word: መጽሐፈ
  choice: die Schrift
  rationale: Das Wort bezeichnet Buch beziehungsweise Schrift; im Zusammenhang mit „lernen“ ist „die Schrift“ im Sinn des Schreibens und Lesens natürlich, ohne einen bestimmten heiligen Text vorauszusetzen.
- source_word: ሐቃላዊ
  choice: Mann des Feldes
  rationale: Die formnahe Wendung bewahrt das biblisch geprägte Bild und legt es nicht enger als Bauer oder Landarbeiter aus.
- source_word: ነዓዊ
  choice: Jäger
  rationale: Direkte und kontextgerechte Wiedergabe der Tätigkeit Esaus.
- source_word: ፀብአ
  choice: Kriegskunst
  rationale: Im Objekt zu „lernen“ bezeichnet das Wort kriegerisches Handwerk beziehungsweise Kriegführung; „Kriegskunst“ ist idiomatischer als „Krieg“ und wahrt den gehobenen Erzählton.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Das einleitende Fragment „und behaart“ bleibt erhalten, da der Vers offenbar mitten in einer Beschreibung einsetzt. Der Gegensatz zwischen Jakob und Esau wird durch „aber“ und „dagegen“ natürlich verdeutlicht, ohne zusätzliche Deutung einzutragen.
