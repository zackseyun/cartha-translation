  verdict: revise
  source_fidelity: Die Eröffnung, die Söhne Hets, Gottes gewährte Gunst, die höflich/demütig vorgetragene Bitte sowie die Ortsangabe gegenüber von Mamre sind vollständig wiedergegeben. „seine Tote“ ist jedoch als Bezeichnung für den ge’ezischen Ausdruck „seinen Toten / seinen Verstorbenen“ unnötig eingeengt und im Deutschen stilistisch weniger idiomatisch. Der Quelltext sagt nicht ausdrücklich „Sara“ und verwendet hier die übliche knappe Bezeichnung für den Verstorbenen.
  naturalness: Der Text ist insgesamt klar und würdig. „seinen Toten“ ist im Deutschen die natürlichere, quellennahe Wiedergabe als die substantivierte feminine Form „seine Tote“. „Er bat die Söhne Hets demütig“ ist eine flüssige Stellung und wahrt die Aussage über die Art der Bitte.
  terminology: „Söhne Hets“, „der HERR“, „Gunst“ und „Doppelhöhle“ sind angemessen. Die Fußnote darf Machpela als mögliche Namenswiedergabe nennen, muss aber klarstellen, dass der Name im vorliegenden ge’ezischen Wortlaut nicht ausdrücklich steht.
