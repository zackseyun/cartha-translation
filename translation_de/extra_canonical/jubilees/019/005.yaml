base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: de
  text: Er sprach mit den Söhnen Hets, damit sie ihm einen Platz gäben, wo er seinen Toten begraben könnte. Und der HERR schenkte ihm Gunst bei allen, die ihn sahen. Er bat die Söhne Hets demütig, und sie gaben ihm das Grundstück mit der Doppelhöhle[a], die gegenüber von Mamre liegt—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Höhle von Machpela“. Der ge’ezische Ausdruck bedeutet wörtlich etwa „die doppelte Höhle“; gemeint ist die aus der Abrahamüberlieferung bekannte Höhle von Machpela, doch der Eigenname steht im vorliegenden ge’ezischen Wortlaut nicht ausdrücklich.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ውሉደ፡ ኬጥ
  choice: Söhne Hets
  rationale: Die traditionelle, quellennahe Bezeichnung für die Angehörigen bzw. Nachkommen Hets; sie entspricht auch dem Sprachgebrauch der zugrunde liegenden Abrahamüberlieferung.
- source_word: መካነ
  choice: einen Platz
  rationale: Gibt den allgemeinen Sinn von ‚Ort/Platz‘ wieder, ohne bereits ein Grab oder Grundstück in das Wort hineinzulesen.
- source_word: ቤድኖ
  choice: seine Tote
  rationale: Der Kontext handelt von Sara; der Ausdruck bezeichnet hier den Leichnam einer weiblichen Verstorbenen. Die substantivierte Form bewahrt zugleich den knappen, würdevollen Ton.
- source_word: ሞገሰ
  choice: Gunst
  rationale: Bezeichnet Wohlwollen bzw. Ansehen, das Gott Abraham bei den Menschen verschafft.
- source_word: በየውሀት
  choice: demütig
  rationale: Das Wortfeld umfasst Sanftmut, Milde und Demut; ‚demütig‘ passt hier natürlich zur Art seiner Bitte.
- source_word: ምድረ፡ ባዓት
  choice: das Grundstück mit der … Höhle
  rationale: Wörtlich steht eine Verbindung von ‚Land/Grundstück‘ und ‚Höhle‘. Die deutsche Fassung macht verständlich, dass das Grundstück die Höhle umfasst.
- source_word: ዘካዕበት
  choice: Doppelhöhle
  rationale: Die Form bedeutet sinngemäß ‚die doppelte/verdoppelte‘ und entspricht der überlieferten Bezeichnung der Höhle von Machpela; der Eigenname selbst steht im vorliegenden ge'ezischen Wortlaut jedoch nicht ausdrücklich.
- source_word: ዘአንጻረ
  choice: gegenüber von
  rationale: Entspricht der räumlichen Angabe ‚vor/gegenüber‘, ohne eine präzisere Himmelsrichtung einzuführen.
theological_decisions:
- issue: Göttliches Wirken und menschliche Wahrnehmung
  choice: „der HERR schenkte ihm Gunst bei allen, die ihn sahen“
  alternative: „der HERR ließ ihn vor den Augen aller, die ihn sahen, Gunst finden“
  rationale: Die aktive Form gibt das ausdrücklich Gott zugeschriebene Wohlwollen klar und natürlich wieder, ohne die Spannung zwischen göttlichem Handeln und menschlicher Reaktion aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennahem Satzbau. Der Gedankenstrich am Ende bleibt erhalten, da der überlieferte Vers syntaktisch in den folgenden Text weiterführt. Die sachfremde englische Fußnote [5] wurde nicht übernommen; ihr Inhalt bezieht sich auf andere Verse und hat im Ausgangstext dieses Verses keinen Anhaltspunkt.
