  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: de
  text: Und alle seine Taten waren wild. Abraham liebte Jakob, Isaak aber liebte Esau. Als Abraham Esaus Taten sah, erkannte er, dass in Jakob sein Name und seine Nachkommenschaft genannt werden würden.[a] Da rief er Rebekka zu sich und wies sie wegen Jakob an; denn er wusste, dass sie Jakob weit mehr liebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „in Jakob … genannt werden“ ist eine wörtlich nahe Wiedergabe. Sie kann im Zusammenhang auf die Zuordnung oder Fortführung von Name und Nachkommenschaft durch Jakob hinweisen.
    reason: Die Fußnote erläutert die mögliche genealogische Tragweite, ohne die formelhafte Quellformulierung im Haupttext auf eine einzige Deutung festzulegen.
lexical_decisions:
- source_word: ድሩክ
  choice: wild
  rationale: Das Wort beschreibt Esaus gesamtes Handeln als ungestüm, rau oder gewalttätig. „Wild“ ist im heutigen Deutsch verständlich und bewahrt die negative Charakterisierung, ohne eine bestimmte Einzeltat vorauszusetzen.
- source_word: ዘርእ
  choice: Nachkommenschaft
  rationale: Das geʿezische Wort bedeutet wörtlich „Same“, bezeichnet hier jedoch die genealogische Nachkommenschaft. „Nachkommenschaft“ gibt diesen Sinn würdig und natürlich wieder.
- source_word: ይጼዋዕ
  choice: weitergeführt werden würden
  rationale: Das Verb bedeutet grundsätzlich „gerufen/genannt werden“. In der Verbindung mit „Name und Nachkommenschaft“ bezeichnet es hier wahrscheinlich deren Fortbestand beziehungsweise Zuordnung zu Jakob; die wörtlichere Form wird in der Fußnote festgehalten.
- source_word: ፈድፋደ
  choice: weit mehr
  rationale: Das verstärkende Adverb drückt einen hohen beziehungsweise überlegenen Grad aus. „Weit mehr“ entspricht dem Vergleichssinn des Zusammenhangs.
theological_decisions:
- issue: Fortbestand von Abrahams Name und Nachkommenschaft in Jakob
  choice: dass sein Name und seine Nachkommenschaft in Jakob weitergeführt werden würden
  alternative: dass ihm in Jakob Name und Nachkommenschaft genannt werden würden
  rationale: Die gewählte Fassung macht die genealogische Aussage im Deutschen verständlich, ohne daraus eine weitergehende Lehre über Erwählung oder Verheißung auszuformulieren. Die ungewöhnliche wörtliche Konstruktion und ihre Mehrdeutigkeit bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Wild“ erhält die knappe, scharfe Charakterisierung Esaus; die schwierige Wendung über Name und Nachkommenschaft wird verständlich übersetzt und zugleich durch eine Fußnote textnah abgesichert.
