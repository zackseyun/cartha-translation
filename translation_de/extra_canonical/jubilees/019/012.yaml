  - severity: low
    issue: Die Fußnote erklärt die Angabe als „innerhalb von vierzehn Jahren“.
    rationale: Die Erläuterung sollte die Zeitspanne benennen, ohne die zusätzliche Begrenzungsnuance von „innerhalb“ einzuführen.
