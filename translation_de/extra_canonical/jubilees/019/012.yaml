  source_fidelity: Die Aussage, dass Hagar vor Sara starb und danach mit „sie“ fortgefahren wird, ist im geʽezischen Wortlaut ebenso auffällig wie in der englischen POB-Fassung. Die Übersetzung darf diese Spannung nicht harmonisieren. Die Namensliste und die Angabe von zwei Siebenern von Jahren sind zutreffend wiedergegeben. „Innerhalb von“ fügt jedoch gegenüber dem einfachen „in“ eine nicht ausdrücklich markierte Begrenzungsnuance hinzu.
  naturalness: Die Formulierung ist modernes, würdiges Deutsch. „In zwei Jahrwochen“ ist knapper und näher am Ausgangstext als „innerhalb von zwei Jahrwochen“; die Fußnote kann die ungebräuchliche Zeiteinheit verständlich erläutern.
  terminology: Die Namensformen Simran, Jokschan, Medan, Midian, Jischbak und Schuach sind im Deutschen bibelnah und konsistent. „Sara“ entspricht der im Deutschen verbreiteten biblischen Form. „Jahrwochen“ ist als fachlich-biblische Zeiteinheit passend.
