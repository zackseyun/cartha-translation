  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
translation:
  language: de
  text: 'das heißt Hebron, für vierhundert Silberstücke. Und sie drängten ihn und sagten: »Wir geben es dir umsonst.« Doch er nahm es nicht umsonst aus ihren Händen an, denn er gab den vollen Preis in Silber für den Ort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  choice: Hebron
  rationale: Der Ortsname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: አርባዕቱ፡ ምእት፡ ብሩር
  choice: vierhundert Silberstücke
  rationale: Die Wendung bezeichnet vierhundert Einheiten beziehungsweise Stücke Silber; »Silberstücke« ist verständlich, ohne eine im Text nicht genannte Münzsorte festzulegen.
- source_word: በከ
  choice: umsonst
  rationale: Das zweimal vorkommende Wort bezeichnet eine unentgeltliche Überlassung; beide Vorkommen werden bewahrt.
- source_word: እምእዴሆሙ
  choice: aus ihrer Hand
  rationale: Die konkrete semitische Ausdrucksweise wird beibehalten und bleibt im Deutschen verständlich.
- source_word: ሤጦ፡ ለመካን፡ ብሩረ፡ ፍጹመ
  choice: den vollen Preis in Silber für den Ort
  rationale: Die Formulierung bewahrt sowohl die vollständige Bezahlung als auch Silber als Zahlungsmittel und gibt »Ort/Platz« natürlich mit »Ort« wieder.
theological_decisions:
- issue: Unentgeltliches Angebot und Abrahams Ablehnung
  choice: Beide Vorkommen von »umsonst« ausdrücklich wiedergeben
  alternative: Das zweite »umsonst« auslassen und nur sagen, er habe es nicht aus ihrer Hand angenommen
  rationale: Die Wiederholung steht im ge'ezischen Text und unterstreicht, dass Abraham den Ort nicht als Geschenk annahm, sondern vollständig bezahlte.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzverknüpfung bleibt nah am Quelltext; »Silberstücke« vermeidet die unbelegte Festlegung auf Schekel oder eine bestimmte Münze.
