  yaml_path: translation/extra_canonical/jubilees/019/001.yaml
  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: de
  text: Und im ersten Jahr der ersten Jahrwoche im achtundfünfzigsten Jubiläum[a] kehrte Abraham zurück und wohnte Hebron gegenüber – das ist Kirjat-Arba – eine weitere Jahrwoche lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Textüberlieferungen beziehungsweise frühere Wiedergaben bieten an dieser Stelle eine abweichende Jubiläumszahl.
    reason: Die vorgelegte ge'ezische Quelle liest eindeutig 58; eine knappe Anmerkung wahrt zugleich das Bewusstsein für die abweichende Überlieferung, ohne die Quellenlesart zu ersetzen.
lexical_decisions:
- source_word: ፶ወ፰
  choice: achtundfünfzigsten
  rationale: Die ge'ezische Zahl besteht aus 50 und 8 und bezeichnet daher 58.
- source_word: ተመይጠ
  choice: kehrte … zurück
  rationale: Gibt die Rückkehr Abrahams natürlich und quellennah wieder.
- source_word: ኀደረ
  choice: wohnte
  rationale: Im vorliegenden Ortszusammenhang bezeichnet das Verb ein Bleiben bzw. Wohnen.
- source_word: አንጻረ
  choice: gegenüber
  rationale: Bewahrt die konkrete räumliche Bedeutung ‚gegenüber/angesichts von‘ statt sie zu dem allgemeineren ‚bei‘ abzuschwächen.
- source_word: ቀርያታርቦቅ
  choice: Kirjat-Arba
  rationale: Verwendet die im deutschen Bibelgebrauch geläufige Form des Ortsnamens.
- source_word: ሱባዔ፡ ዓመት
  choice: Jahrwoche
  rationale: Bewahrt den für das Jubiläenbuch wichtigen kalendarischen Fachbegriff, statt ihn lediglich als ‚sieben Jahre‘ aufzulösen.
theological_decisions:
- issue: Kalendarische Terminologie
  choice: Jahrwoche
  alternative: sieben Jahre
  rationale: Die formale Bezeichnung ist ein tragendes Ordnungsprinzip des Jubiläenbuchs und sollte im Haupttext sichtbar bleiben.
- issue: Zahl des Jubiläums
  choice: achtundfünfzigstes Jubiläum
  alternative: achtundvierzigstes oder zweiundvierzigstes Jubiläum
  rationale: Die Übersetzung folgt der ausdrücklich bereitgestellten ge'ezischen Lesart ፶ወ፰, ohne eine abweichende textkritische Lesart in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die spezialisierten Kalenderbegriffe „Jahrwoche“ und „Jubiläum“ werden beibehalten; der Satzbau bleibt trotz der mehrfachen Zeitangaben gut lesbar.
