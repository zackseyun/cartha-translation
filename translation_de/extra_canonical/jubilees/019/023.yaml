  text: If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which he blessed me
translation:
  language: de
  text: Wenn ein Mensch den ganzen Sand der Erde zählen kann, dann wird auch seine Nachkommenschaft gezählt werden. Und all die Segnungen, mit denen er[a] mich gesegnet hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der HERR«.'
    reason: Der Handelnde ist im geezischen Text nur als »er« bezeichnet; aus dem Zusammenhang kann der HERR gemeint sein.
lexical_decisions:
- source_word: ሰብእ
  choice: ein Mensch
  rationale: Das geezische Substantiv bezeichnet allgemein einen Menschen; die Formulierung bleibt geschlechtsübergreifend verständlich, ohne die konditionale Aussage umzudeuten.
- source_word: ኈልቆ፡ ኖላ፡ ምድር
  choice: den ganzen Sand der Erde zählen
  rationale: Die Wendung bezeichnet das Zählen beziehungsweise vollständige Erfassen des Erdsandes; „den ganzen Sand“ gibt den totalen Umfang in natürlichem Deutsch wieder.
- source_word: ዘርኡሂ
  choice: auch seine Nachkommenschaft
  rationale: ዘር kann „Same“ oder kollektiv „Nachkommenschaft“ bedeuten; im Zusammenhang mit der Verheißung ist „Nachkommenschaft“ idiomatisch und erhält den kollektiven Sinn.
- source_word: ይትኌለቍ
  choice: wird … gezählt werden
  rationale: Die Passivform wird formal bewahrt und nicht als bloße Aussage über große Zahl oder Unzählbarkeit paraphrasiert.
- source_word: በረከት
  choice: Segnungen
  rationale: Die konkrete Mehrzahl entspricht der Aussage über sämtliche empfangenen Segnungen und bewahrt die religiöse Bedeutung des Ausgangswortes.
- source_word: ባረከኒ
  choice: er mich gesegnet hat
  rationale: Die Form enthält ein männliches Subjekt der dritten Person und das Objekt „mich“, nennt den Handelnden aber nicht ausdrücklich.
theological_decisions:
- issue: Identität des Subjekts in ባረከኒ
  choice: er[a]
  alternative: der HERR
  rationale: Im vorliegenden geezischen Wortlaut steht nur das grammatisch enthaltene „er“. Obwohl der Kontext wahrscheinlich auf den HERRN verweist, würde die ausdrückliche Gottesbezeichnung eine nicht im Satz stehende Identifikation in den Haupttext eintragen; sie wird daher nur als Fußnotenalternative genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konditionale Struktur und das Passiv bleiben erhalten. Der abschließende Beistrich macht sichtbar, dass der überlieferte Versausschnitt syntaktisch in den folgenden Zusammenhang weiterführt.
