  text: meine Söhne. Er sei für immer gesegnet, und seine Nachkommenschaft soll die ganze Erde erfüllen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድየ
  choice: meine Söhne
  rationale: Die Form bezeichnet hier die Söhne des Sprechers; die Kleinschreibung am Anfang wahrt den überlieferten fragmentarischen Anschluss an den vorausgehenden Satz.
- source_word: ለዓለም
  choice: für immer
  rationale: Gibt die zeitliche Bedeutung natürlich und verständlich wieder.
- source_word: ዘርኡ
  choice: seine Nachkommenschaft
  rationale: Das singularische Kollektivwort kann »Same« oder »Nachkommenschaft« bedeuten; im Deutschen bezeichnet »Nachkommenschaft« die gemeinte Folge von Nachkommen klar und würdig.
- source_word: ዘይመልእ ኵላ ምድረ
  choice: soll die ganze Erde erfüllen
  rationale: Die relative Konstruktion wird in natürliches Deutsch überführt; »erfüllen« bewahrt das Bild des vollständigen Füllens.
theological_decisions:
- issue: Reichweite der Verheißung über die Nachkommenschaft
  choice: die ganze Erde erfüllen
  alternative: die ganze Erde bevölkern
  rationale: »Erfüllen« bleibt näher am Quellverb und legt nicht fest, ob ausschließlich zahlenmäßige Ausbreitung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt als Satzfragment mit »meine Söhne« ein; dies wird nicht künstlich zu einem vollständigen Satz ergänzt. Das abschließende isolierte እመ wurde als Beginn des folgenden Textabschnitts behandelt und nicht in diesen Vers aufgenommen.
