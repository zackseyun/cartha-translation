  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: de
  text: 'Und er küsste ihn, segnete ihn und sagte: „Jakob, mein geliebter Sohn, den meine Seele liebt: Gott von oberhalb des Firmaments[b] segne dich und gebe dir all die Segnungen, mit denen er Adam, Henoch, Noah und Sem[a] gesegnet hat. Und alles, was er zu mir gesprochen hat und was er mir, wie er gesagt hat, geben wird, möge für immer auf dir und deinen Nachkommen ruhen, solange der Himmel über der Erde besteht. Die Geister Mastemas sollen nicht über dich oder deine Nachkommen kommen, um euch davon abzubringen, dem HERRN zu folgen, der von jetzt an und für immer dein Gott ist[d]. Der Herr, Gott, sei dir ein Vater[c], und du sei sein erstgeborener Sohn und allezeit ein Volk. Geh hin in Frieden, mein Sohn.“ Und die beiden gingen gemeinsam von Abraham fort. Rebekka liebte Jakob von ganzem Herzen und mit ihrer ganzen Seele, sehr viel mehr als Esau; Isaak aber liebte Esau sehr viel mehr als Jakob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen Lesart: „Adam, Henoch und Noah; und alles, was …“'
    reason: Die Textüberlieferung beziehungsweise Gliederung ist an dieser Stelle unsicher; die Alternative lässt »Sem« aus und setzt den folgenden Satzteil früher an.
  - marker: b
    text: 'Oder sinngemäß: „Gott, der Höchste“.'
    reason: Die Wendung kann dynamisch als Hoheitstitel verstanden werden, lautet aber wörtlicher »Gott von oberhalb des Firmaments«.
  - marker: c
    text: 'Oder: „Der HERR sei dir ein Vater“.'
    reason: Die kürzere Wiedergabe ist traditionell möglich; der Haupttext erhält jedoch beide Quellwörter »Herr« und »Gott«.
  - marker: d
    text: 'Oder kürzer: „um euch vom HERRN abzubringen“.'
    reason: Die Alternative ist idiomatisch, lässt jedoch das Bild des Gehens hinter dem HERRN weniger deutlich hervortreten.
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት
  choice: Gott von oberhalb des Firmaments
  rationale: Bewahrt die konkrete kosmologische Ortsangabe „von oberhalb des Firmaments“, statt sie ohne Not zu einem Gottesprädikat wie „Gott, der Höchste“ umzudeuten.
- source_word: ያጥጋእ፡ ላዕሌከ
  choice: möge … auf dir … ruhen
  rationale: Gibt das Bild wieder, dass die zugesagte Segnung auf Jakob und seinen Nachkommen zur Ruhe beziehungsweise zur Erfüllung kommt.
- source_word: መናፍስተ፡ መስቴማ
  choice: die Geister Mastemas
  rationale: Der Eigenname Mastema bleibt erhalten; der Genitiv entspricht der Quellform und vermeidet die unbelegte Gleichsetzung mit einer anderen Gestalt.
- source_word: እምድኅረ፡ እግዚአብሔር
  choice: davon abzubringen, dem HERRN … zu folgen
  rationale: Erhält das räumliche Bild, hinter dem HERRN herzugehen, in natürlichem Deutsch.
- source_word: በከመ፡ መዋዕለ፡ ሰማይ፡ ዲበ፡ ምድር
  choice: solange der Himmel über der Erde besteht
  rationale: Gibt die idiomatische Zeitformel sinngemäß und zugleich bildnah wieder.
theological_decisions:
- issue: Gottesbezeichnung oberhalb des Firmaments
  choice: Gott von oberhalb des Firmaments
  alternative: Gott, der Höchste
  rationale: Die Quellform bezeichnet primär eine kosmologische Lage. Die Alternative ist möglich, glättet aber das für das Jubiläenbuch charakteristische Weltbild.
- issue: Gott als Vater und Jakob als Erstgeborener
  choice: Der Herr, Gott, sei dir ein Vater, und du sei sein erstgeborener Sohn und dem Volk allezeit
  alternative: Der HERR sei dir ein Vater, und du sein erstgeborener Sohn für alle Zeit
  rationale: „Herr“ und „Gott“ werden beide wiedergegeben. Die schwierige zusätzliche Beziehung zum Volk wird nicht stillschweigend beseitigt, sondern in ihrer knappen, mehrdeutigen Form bewahrt.
- issue: Abwendung vom HERRN
  choice: um euch davon abzubringen, dem HERRN … zu folgen
  alternative: um euch vom HERRN abzubringen
  rationale: Die gewählte Fassung bewahrt die im Ausgangstext enthaltene Nachfolge-Metapher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Syntax. Die Anrede wechselt bei „dich und deine Nachkommen“ sachgerecht zum Plural „euch/eure“. „Firmament“ bleibt wegen der spezifischen antiken Kosmologie erhalten. Die schwer verständliche Verbindung „und dem Volk allezeit“ wurde bewusst nicht konfessionell oder interpretierend aufgelöst.
