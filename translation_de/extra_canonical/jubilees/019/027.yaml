  source_fidelity: 'Die Übersetzung gibt den Segen, die kosmologische Formel »von oberhalb des Firmaments«, Mastema und das Bild der Abwendung vom Folgen des HERRN insgesamt zuverlässig wieder. Eine sachliche Korrektur ist jedoch bei der elliptischen Schlussformel des Segens nötig: Das ge''ezische »zu/ein Volk alle Tage« ist nicht »dem Volk allezeit«. Die revidierte Fassung bewahrt die knappe, auf Jakob als Stammvater bezogene Aussage, ohne eine weitergehende Deutung einzutragen.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. »und dem Volk allezeit« ist jedoch kein tragfähiger deutscher Satzteil. Außerdem wird die Zuordnung von »von jetzt an und für immer« zu Gott durch eine klarere Relativkonstruktion verständlich, ohne den Sinn zu verändern.
  terminology: 'Eigennamen und Schlüsselbegriffe sind angemessen: Jakob, Henoch, Rebekka, Esau, Isaak und Mastema sind korrekt; »Firmament« bewahrt die antike Kosmologie. »HERR« ist als Wiedergabe von »Lord« konsistent. Die Fußnoten geben echte, nicht in den Haupttext zu hebende Alternativen wieder.'
