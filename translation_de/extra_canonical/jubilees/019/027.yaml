  - severity: low
    issue: Stellung von »von jetzt an und für immer« ist mehrdeutig
    rationale: Im Entwurf kann die Zeitangabe zunächst zu »folgen« gelesen werden. Der Ausgangstext qualifiziert Gott als Jakobs Gott. Die Relativkonstruktion macht diese syntaktische Bindung deutlich.
