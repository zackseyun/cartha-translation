  text: und Adam. Und sie werden den Himmel gründen, die Erde festigen und alles erneuern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሳርረ፡ ሰማይ
  choice: den Himmel zu gründen
  rationale: Das mit ለ- gebildete Verb drückt hier Zweck bzw. Bestimmung aus; die Wurzel s-r-r bezeichnet das Gründen oder Festsetzen.
- source_word: ወለአጽንዖ፡ ምድር
  choice: die Erde zu festigen
  rationale: Die Infinitivfügung bezeichnet das Festmachen oder Stärken der Erde; „festigen“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: ወለኀድሶ፡ ኵሉ
  choice: und alles zu erneuern
  rationale: Die parallele Infinitivfügung wird verbal wiedergegeben; ኵሉ bleibt entsprechend seiner offenen Reichweite als „alles“ stehen.
- source_word: ይኩኑ
  choice: sie werden dazu da sein
  rationale: Die Zukunft von „sein“ wird mit den folgenden Zweckinfinitiven verbunden, ohne das im Ausgangstext stehende Sein ganz zu tilgen.
theological_decisions:
- issue: Reichweite von „sie“ und „alles“
  choice: Die Pronomen und die umfassende Formulierung bleiben ohne erklärende Ergänzung stehen.
  alternative: Die Bezugsgruppe von „sie“ oder den Umfang von „alles“ im Text ausdrücklich bestimmen.
  rationale: Der isolierte Quellenausschnitt legt diese Bezüge nicht eindeutig fest; eine Präzisierung würde die überlieferte Offenheit auflösen.
translation_notes:
  register: Moderner, würdiger Standard; die eröffnende Fragmentform „und Adam“ wird als versübergreifender Anschluss beibehalten. Die drei parallelen Zweckinfinitive werden rhythmisch und verständlich wiedergegeben.
