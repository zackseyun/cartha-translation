  yaml_path: translation/extra_canonical/jubilees/019/007.yaml
  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: de
  text: 'Und er verneigte sich noch einmal vor ihnen. Danach begrub er seine Verstorbene in der Doppelhöhle. Saras gesamte Lebenszeit betrug 127 Jahre: zwei Jubiläen und vier Jahrwochen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካዕበ
  choice: noch einmal
  rationale: Gibt das Adverb mit der Bedeutung „wieder, ein zweites Mal“ ausdrücklich wieder.
- source_word: ቤድኖ
  choice: seine Tote
  rationale: Bewahrt die konkrete Bezeichnung der verstorbenen Angehörigen im Singular, hier Sara, statt sie vorzeitig durch ihren Namen zu ersetzen.
- source_word: ባዓት፡ ዘካዕበት
  choice: Doppelhöhle
  rationale: Entspricht der geʿezischen Bezeichnung der zweifachen bzw. doppelten Höhle und hält den Bezug zur Machpela-Überlieferung fest, ohne den Ortsnamen einzufügen.
- source_word: ኢዮቤልዉ ... ሱባዔ
  choice: Jubiläen ... Jahrwochen
  rationale: Gibt die kalendarischen Einheiten verständlich wieder; eine Jahrwoche umfasst sieben Jahre.
