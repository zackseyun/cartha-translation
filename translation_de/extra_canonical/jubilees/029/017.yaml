  text: Spring and rain and the middle of winter and summer were in the tower of Abraham. For Isaac had returned from the Well of the Oath and had gone up to the cave of his father Abraham.
translation:
  language: de
  text: Frühling und Regen, die Mitte des Winters und Sommer waren im Turm Abrahams. Denn Isaak war vom Eidbrunnen zurückgekehrt und zum Turm seines Vaters Abraham hinaufgegangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማኅፈደ (maḫfäd)
  choice: Turm
  rationale: Das ge’ezische Wort bezeichnet hier einen Turm; zudem ist Abrahams Turm ein wiederkehrender Ort im Jubiläenbuch. Daher wird es an beiden Stellen einheitlich mit „Turm“ wiedergegeben.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Eidbrunnen
  rationale: Die Verbindung bedeutet wörtlich „Brunnen des Eides“ und bezeichnet Beerscheba. „Eidbrunnen“ bewahrt die Namensbedeutung knapp und verständlich.
- source_word: ዐርገ
  choice: hinaufgezogen
  rationale: Das Verb bedeutet „hinaufgehen/aufsteigen“. „Hinaufgezogen“ gibt die räumliche Bewegung zum Turm natürlich wieder.
- source_word: ክረምት / ሐጋይ
  choice: Winter / Sommer
  rationale: Die traditionellen Jahreszeitenbezeichnungen werden entsprechend ihrer Grundbedeutung wiedergegeben, ohne die ungewöhnliche Aufzählung des Ausgangstextes zu glätten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die auffällige Folge der Jahreszeiten bleibt eng am ge’ezischen Wortlaut; die kausale Verknüpfung mit Isaaks Rückkehr wird durch „Denn“ bewahrt.
