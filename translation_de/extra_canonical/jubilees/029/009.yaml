  yaml_path: translation/extra_canonical/jubilees/029/009.yaml
  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: de
  text: „Zeugenhügel“, entsprechend diesem Hügel.[a] Früher aber nannte man das Land Gilead „Land Rafaël“;[b] denn es ist das Land der Refaïter. Dort wurden die Refaïter geboren, Riesen, deren Körpergröße zehn Ellen, neun Ellen, acht Ellen und bis hinab zu sieben Ellen betrug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte geʿezische Text lautet wörtlich etwa: „Freude [oder: Fest] des Zeugnisses, entsprechend dieser Freude [oder: diesem Fest].“ Wahrscheinlich liegt eine alte Verschreibung für „Zeugenhügel … diesem Hügel“ vor; so ergibt sich die hier beabsichtigte Erklärung des Namens Gilead (vgl. Genesis 31,47–48).'
    reason: textual_variant
  - marker: b
    text: Der geʿezische Text hat hier „Rafaël“, unmittelbar danach jedoch „Land der Refaïter“. Möglicherweise ist auch „Rafaël“ eine abweichende oder verderbte Schreibweise. Der Vers verbindet die Erklärung des Namens Gilead mit einer älteren, auf die Refaïter bezogenen Gebietsbezeichnung.
    reason: textual_variant
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዐ ... ፍሥሐት
  choice: „Zeugenhügel“ … diesem Hügel
  rationale: Der überlieferte Wortlaut bedeutet wörtlich etwa „Freude/Fest des Zeugnisses … Freude/Fest“. Im Kontext der ausdrücklich erklärten Bezeichnung Gilead und der Wortherkunft von Gal-Ed („Zeugenhügel“) ist sehr wahrscheinlich eine alte Textverderbnis anzunehmen. Die sachlich notwendige Emendation wird übersetzt und die Überlieferung in [a] offengelegt.
- source_word: ምድረ፡ ራፋኤል
  choice: „Land Rafaël“
  rationale: Die konkrete Form des geʿezischen Textes wird bewahrt, statt sie stillschweigend an das unmittelbar folgende „Land der Refaïter“ anzugleichen.
- source_word: ረፋኤም / ራፋኤም
  choice: Refaïter
  rationale: Die traditionelle deutsche Bezeichnung für die Refaïm wird verwendet; sie erhält den Volksnamen und vermeidet eine vorschnelle Gleichsetzung mit einer allgemeineren Gruppe von Riesen.
- source_word: ረዐይት
  choice: Riesen
  rationale: Das Wort bezeichnet hier außergewöhnlich große Gestalten und wird durch die unmittelbar folgenden Größenangaben erläutert.
- source_word: በአመት
  choice: Ellen
  rationale: Die wiederholte Maßeinheit bezeichnet im gegebenen Zusammenhang die Elle; idiomatisch wird sie bei der koordinierten Zahlenreihe nur einmal am Ende jeder Angabe ausgedrückt.
theological_decisions:
- issue: Verhältnis zwischen den Refaïtern und den Riesen
  choice: „die Refaïter … Riesen“
  alternative: „die Refaïter, nämlich die Riesen“ oder bloß „Riesen“
  rationale: Die Übersetzung lässt die appositionelle Beschreibung stehen, ohne über den Vers hinaus eine vollständige Identität aller Refaïter mit einer bestimmten theologischen oder mythologischen Gruppe zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihe der Körpergrößen folgt dem repetitiven Charakter des Ausgangstextes, wird aber in natürlicher deutscher Syntax formuliert. Textkritisch unsichere Stellen werden nicht stillschweigend harmonisiert, sondern im Haupttext quellennah wiedergegeben und in Fußnoten erläutert.
