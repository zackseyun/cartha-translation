  terminology: „Gilead“, „Rafaël“, „Refaïter“, „Riesen“ und „Ellen“ sind konsistent und sachgerecht. Besonders gut ist, dass „Refaïter“ nicht einfach durch „Riesen“ ersetzt wird, während die erläuternde Apposition dennoch erhalten bleibt. Die Fußnotenanker stehen an den beiden textkritisch relevanten Stellen.
