  source_fidelity: 'Der Entwurf gibt den überlieferten geʿezischen Wortlaut sorgfältig wieder: Die textkritisch notwendige, im Kontext eindeutig motivierte Emendation zu „Zeugenhügel“ wird nicht verschwiegen, sondern in Anmerkung a transparent dokumentiert. Die auffällige Form „Land Rafaël“ bleibt im Haupttext erhalten und wird, ohne unzulässige Harmonisierung mit den folgenden Refaïtern, angemessen erläutert. Die Apposition der Refaïter als Riesen und die gestaffelten Größenangaben entsprechen dem Ausgangstext.'
