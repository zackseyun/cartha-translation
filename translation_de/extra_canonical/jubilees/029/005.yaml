  yaml_path: translation/extra_canonical/jubilees/029/005.yaml
  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
translation:
  language: de
  text: das Land Gilead. Und Jakob hielt vor Laban verborgen, was er im Herzen hatte, und sagte es ihm nicht. Im siebten Jahr der vierten Jahrwoche[a] brach Jakob im ersten Monat, am einundzwanzigsten Tag, nach Gilead auf. Laban verfolgte ihn und holte Jakob im dritten Monat, am dreizehnten Tag, im Gebirge Gilead ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangaben in diesem Vers sind schwer miteinander zu verbinden, weil Aufbruch, Verfolgung und Einholen über verschiedene Monate hinweg genannt werden. Die Übersetzung gibt die überlieferten Daten wieder, ohne sie einander anzugleichen.
    reason: segmentation_note
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: Jakob hielt vor Laban verborgen, was er im Herzen hatte
  rationale: Die Wendung bewahrt das ausdrückliche Bild des Herzens, vermeidet aber das im Deutschen unnatürliche »verbarg sein Herz« und legt den Inhalt nicht vorschnell auf »Absicht« oder »Vorhaben« fest.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: brach Jakob … nach Gilead auf
  rationale: Gibt die Bewegung nach Gilead in natürlichem Deutsch wieder, ohne eine Rückkehr stärker zu behaupten, als es der unmittelbare Zusammenhang verlangt.
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ
  choice: Laban verfolgte ihn
  rationale: Entspricht dem geʿezischen Text ohne die aus Genesis eingetragene Ergänzung, Laban habe zuvor davon gehört.
- source_word: በደብረ፡ ገላአድ
  choice: im Gebirge Gilead
  rationale: »Gebirge Gilead« ist die geläufige und kontextgerechte deutsche Wiedergabe des geographischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Herzbild bleibt in idiomatischer Form erhalten; die ungewöhnliche Chronologie wird nicht harmonisiert. Der Vers beginnt als Satzfragment, weil »das Land Gilead« syntaktisch zum vorausgehenden Kontext gehört.
