- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት።
  choice: drei Tagereisen
  rationale: Die Entfernung wird als Wegstrecke von drei Reisetagen verständlich und knapp ausgedrückt.
theological_decisions:
- issue: Bezug des Pronomens in እምኔሁ („von ihm“)
  choice: von ihm
  alternative: von Jakob
  rationale: Das maskuline Pronomen bleibt wie in der Quelle formal erhalten, statt seinen Bezug aus dem Kontext ausdrücklich auf Jakob festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählstil. Die traditionelle Formel „Und es geschah“ wurde zugunsten eines natürlichen zeitlichen Anschlusses nicht mechanisch nachgebildet; die sachliche Reihenfolge und die pronominale Mehrdeutigkeit bleiben erhalten.
