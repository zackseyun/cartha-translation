lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: Und nachdem
  rationale: Die ge’ezische Erzählungsformel mit zeitlichem Anschluss wird in natürlichem modernem Deutsch knapp wiedergegeben.
- source_word: ወለደት፡ ራሔል፡ ዮሴፍሃ፡
  choice: Rahel Josef geboren hatte
  rationale: Gibt Subjekt, Verb und Objekt direkt wieder; das possessive Element bei Josef wird im Deutschen idiomatisch nicht eigens ausgedrückt.
- source_word: ወሖረ፡ ላባ፡ ይቅርጽ፡ አባግዒሁ፡
  choice: ging Laban hin, um seine Schafe zu scheren
