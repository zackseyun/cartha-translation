  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: de
  text: Und er zog von ihm weg ins Land Seïr; Jakob aber wohnte in Zelten. Im ersten Jahr der fünften Jahrwoche dieses Jubiläums überquerte er den Jordan und ließ sich jenseits des Jordan nieder. Er weidete seine Schafe vom Meer der Haufen[a] bis Bet-Schean und bis Dotan und bis …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Meer der Haufen“ ist ein unsicherer Ortsname im äthiopischen Text. Möglicherweise liegt ihm ein anderer Name zugrunde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሖረ፡ እምኀቤሁ፡ ምድረ፡ ሴኢር
  choice: zog von ihm weg ins Land Seïr
  rationale: Gibt Bewegung, Ausgangspunkt und Ziel eng am ge’ezischen Wortlaut wieder; das pronominale Subjekt bleibt wie in der Quelle unbenannt.
- source_word: ኀደረ፡ በምጽላላት
  choice: wohnte in Zelten
  rationale: Natürliche deutsche Wiedergabe der im Plural stehenden Zeltbezeichnung.
- source_word: በዓመት፡ ቀዳሚ፡ ዘኃምስ፡ ሱባዔ
  choice: Im ersten Jahr der fünften Jahrwoche
  rationale: Bewahrt die für das Jubiläenbuch charakteristische chronologische Gliederung; „Jahrwoche“ macht den Siebenjahreszeitraum verständlich.
- source_word: ዐደወ፡ ዮርዳኖስ
  choice: überquerte er den Jordan
  rationale: Direkte und idiomatische Wiedergabe des Überschreitens des Flusses.
- source_word: ኀደረ፡ ማዕዶተ፡ ዮርዳኖስ
  choice: ließ sich jenseits des Jordan nieder
  rationale: „Sich niederlassen“ passt hier zum Aufenthalt nach der Überquerung; „jenseits“ bewahrt die relationale, nicht näher bestimmte Perspektive der Quelle.
- source_word: ባሕረ፡ ፌሐሐት
  choice: Meer der Haufen
  rationale: Formale Wiedergabe des unsicheren äthiopischen Ortsnamens; die Unsicherheit wird in der Fußnote offengelegt, statt einen hypothetischen Namen einzusetzen.
- source_word: ቤተስን … ዶታኤም
  choice: Bet-Schean … Dotan
  rationale: Verwendet geläufige deutsche Formen der beiden Ortsnamen.
theological_decisions:
- issue: Identität des ersten pronominalen Subjekts
  choice: „er“
  alternative: „Esau“
  rationale: Der vorliegende ge’ezische Text hat nur ein Pronomen. Die namentliche Auflösung durch den Kontext wäre plausibel, würde aber mehr festlegen als der Vers selbst.
- issue: Abgebrochener Versschluss
  choice: „und bis …“
  alternative: den fehlenden Zielort ergänzen oder den Satz glatt abschließen
  rationale: Die bereitgestellte Quelle endet mit einer weiteren Zielangabe ohne nachfolgenden Ortsnamen. Die Auslassungspunkte zeigen den unvollständigen Überlieferungs- bzw. Ausschnittzustand transparent an.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologische Fachsprache des Jubiläenbuches bleibt mit „Jahrwoche“ und „Jubiläum“ erhalten. Der unvollständige Schluss wird nicht stillschweigend ergänzt.
