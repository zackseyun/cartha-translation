lexical_decisions:
- source_word: ወኢኀደጎ፡ እግዚአብሔር፡
  choice: Und der Herr ließ nicht zu
  rationale: Gibt das Verbot beziehungsweise die verhindernde Zulassung des Herrn natürlich und eng am Ausgangstext wieder.
- source_word: ከመ፡ ይሕስም፡ ላዕለ፡ ያዕቆብ፡
  choice: dass er Unheil gegen Jakob plante
  rationale: Bewahrt den Gedanken eines beabsichtigten schädlichen Vorgehens gegen Jakob; „Unheil planen“ ist im modernen Deutschen klar und würdig.
- source_word: እስመ፡ አስተረአዮ፡ በሕልም፡
  choice: denn er war ihm im Traum erschienen
  rationale: „Denn“ erhält den kausalen Zusammenhang; das Plusquamperfekt markiert, dass die Erscheinung im Traum dem verhinderten Plan vorausging.
theological_decisions:
- issue: Subjekt des Erscheinens
  choice: „er“ bezieht sich auf den Herrn
  alternative: Ein unbestimmtes oder anderes männliches Bezugswort
  rationale: Der Herr ist das naheliegende Subjekt der kausal begründenden Traumerscheinung; die pronominale Form des Ausgangstextes wird dennoch beibehalten und nicht durch eine wiederholte Gottesbezeichnung verdeutlicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton; knappe Satzstruktur und Erhalt der pronominalen Ausdrucksweise des Ausgangstextes.
