  text: and drink[16], and milk, and butter, and bread of milk, and from the instruction of all. And for his mother Rebekah, a fourth of the year, in the middle of their times of the months, and between plowing and reaping, and in the middle.
translation:
  language: de
  text: und Getränk, Milch, Butter, Milchbrot[b] und Datteln aus dem Tiefland.[a] Und für seine Mutter Rebekka vierteljährlich, in der Mitte ihrer Monatszeiten, zwischen Pflügen und Ernten und in der Mitte …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Datteln aus der Talregion“. Die genaue Bedeutung der Herkunftsangabe ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Milchbrot“; möglicherweise ist ein festes Milchprodukt wie Käse gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወስቴ
  choice: und Getränk
  rationale: Das Wort setzt eine Aufzählung aus dem vorausgehenden Kontext fort und bezeichnet hier etwas zu trinken; die nominale Wiedergabe passt zur folgenden Geschenkliste.
- source_word: ወኅብስተ፡ ሐሊብ
  choice: Käse
  rationale: Wörtlich etwa „Milchbrot“; gemeint ist wahrscheinlich ein geformtes festes Milchprodukt. „Käse“ ist im Deutschen die natürliche sachliche Entsprechung.
- source_word: ወእምነ፡ ትመርት፡ ቍላ
  choice: und Datteln aus dem Tiefland
  rationale: ትመርት bezeichnet Datteln; ቍላ kann das heiße Tiefland beziehungsweise eine Talregion bezeichnen. Die Ortsangabe bleibt wegen der lexikalischen Unsicherheit allgemein.
- source_word: ርብዕ፡ ለዓመት
  choice: viermal im Jahr
  rationale: Im Zusammenhang regelmäßiger Sendungen bezeichnet die Wendung plausibel vier Termine innerhalb eines Jahres, nicht die Dauer eines Vierteljahres.
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: zwischen Pflügen und Ernten
  rationale: Die Konstruktion ማእከለ … ወ… bedeutet „zwischen … und …“; ሐፅኒ bezeichnet hier das Pflügen, ዐጺድ das Ernten beziehungsweise Schneiden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das im Deutschen ergänzte „sandte er … etwas“ erschließt die im Ausschnitt elliptisch fortgesetzte Handlung aus der Geschenkliste, ohne den Inhalt der Gaben näher festzulegen. Der abschließende Gedankenstrich in Form einer Auslassung bewahrt den syntaktisch unvollständigen Versabschnitt, der im vorgelegten Ge’ez-Text mit „und zwischen“ abbricht.
