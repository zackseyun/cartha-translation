  source_fidelity: 'Der Text gibt alle Sinnelemente des geʽezischen Satzes wieder: Jakob bemerkt Labans Abwesenheit zum Scheren seiner Schafe, ruft Lea und Rahel und redet ihnen in einer auf ihr Herz zielenden Weise zu, damit sie mit ihm ins Land Kanaan kommen. „Fortgegangen war“ ist im Kontext eine angemessene Wiedergabe der Abwesenheit Labans; „mit ihm … zu ziehen“ bringt die Zielrichtung des folgenden Satzteils natürlich zum Ausdruck.'
