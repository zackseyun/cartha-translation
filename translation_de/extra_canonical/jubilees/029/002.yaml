  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: de
  text: Und Jakob sah, dass Laban fortgegangen war, um seine Schafe zu scheren. Da rief Jakob Lea und Rahel und redete ihnen zu Herzen,[a] mit ihm in das Land Kanaan zu ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »redete in ihre Herzen hinein«; gemeint ist ein eindringliches oder gewinnendes Zureden.'
    reason: Die ge’ezische Formulierung enthält ausdrücklich das Bild des Redens »in ihre Herzen«, das im Haupttext idiomatisch, aber bildnah wiedergegeben wird.
lexical_decisions:
- source_word: የሐውር፡ ላባ፡ ይቅርጽ፡ አባግዒሁ
  choice: Laban fortgegangen war, um seine Schafe zu scheren
  rationale: Gibt die wahrgenommene Abwesenheit Labans und den Zweck seines Fortgehens natürlich und vollständig wieder.
- source_word: ተናገረ፡ ውስተ፡ ልቦን
  choice: redete ihnen zu Herzen
  rationale: Bewahrt das ausdrückliche Bild des Redens in beziehungsweise an ihre Herzen und vermittelt zugleich im Deutschen ein eindringliches, gewinnendes Zureden.
- source_word: ከመ፡ ይምጽኣ፡ ምስ ሌሁ
  choice: mit ihm … zu ziehen
  rationale: Natürliches Deutsch für die finale beziehungsweise inhaltliche Aussage, dass sie ihn begleiten sollten.
- source_word: ምድረ፡ ከናአን
  choice: das Land Kanaan
  rationale: Entspricht der üblichen und würdigen deutschen Wiedergabe des geografischen Namens.
theological_decisions:
- issue: Nuance der Wendung vom Reden zu den Herzen
  choice: redete ihnen zu Herzen
  alternative: sprach zu ihnen
  rationale: Die bildhafte Wendung wird nicht auf eine neutrale Mitteilung reduziert; so bleiben Eindringlichkeit und persönliche Ansprache erhalten, ohne eine bestimmte emotionale Färbung dogmatisch festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist geglättet, während die semitisch geprägte Herzensrede bewusst erhalten bleibt.
