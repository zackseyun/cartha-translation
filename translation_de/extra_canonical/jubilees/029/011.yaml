revisions:
- from: Ihre Königreiche waren Karnajim, Aschtarot, Edreï, Misur und Beon.[a] Der Herr vernichtete sie wegen ihrer bösen Taten, denn sie waren überaus gesetzlos. An ihrer Stelle ließ er die Amoriter wohnen, ein böses und sündiges Volk. Bis auf diesen Tag gibt es kein Volk, das alle ihre Sünden vollendet hat; und sie bestehen nicht mehr.
  to: Ihre Königreiche waren Karnajim, Aschtarot, Edrei, Misur und Beon.[a] Der Herr vernichtete sie wegen ihrer bösen Taten, denn sie waren überaus gesetzlos. An ihrer Stelle ließ er die Amoriter wohnen, ein böses und sündiges Volk. Bis zum heutigen Tag gibt es kein Volk, das alle seine Sünden vollendet hat, und sie bestehen nicht mehr.
  rationale: Die Revision beschränkt sich auf eine idiomatische Zeitangabe, eine flüssigere Bindung des Schlusssatzes und die übliche deutsche Schreibung „Refaiter“. Die ungewöhnliche Formulierung, dass ein Volk „alle seine Sünden vollendet hat“, bleibt erhalten; sie wird weder durch das Bild eines „vollen Maßes“ noch durch eine theologische Deutung ersetzt. Der Fußnotenanker verbleibt nach dem letzten Ortsnamen, auf den die Anmerkung Bezug nimmt.
  reviewer_model: gpt-5.6-terra
