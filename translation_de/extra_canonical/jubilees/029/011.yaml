review_pass:
  verdict: revise
  source_fidelity: Die Pluralform „Königreiche“, die kausative Ansiedlung der Amoriter und die bewusst ungeglättete Aussage vom „Vollenden“ der Sünden geben die geezische Vorlage und die englische Audit-Fassung im Wesentlichen zutreffend wieder. Die Schlussaussage sollte jedoch syntaktisch enger mit dem vorhergehenden Satz verbunden werden, damit sie nicht wie ein unklarer neuer Gedanke wirkt.
  naturalness: „Bis auf diesen Tag“ ist in diesem Zusammenhang kein idiomatisches modernes Deutsch; „Bis zum heutigen Tag“ ist die natürliche Entsprechung. Auch der Strichpunkt vor „und sie bestehen nicht mehr“ trennt einen im Ausgangstext verbundenen Gedankengang unnötig und lässt den Bezug von „sie“ schwerer erfassen.
  terminology: Die Ortsnamensumschriften sind angesichts der unsicheren äthiopischen Überlieferung vertretbar; die Ankerposition der Fußnote direkt nach Beon ist korrekt. „Refaiter“ ist im modernen Deutschen die geläufigere Schreibung als „Refaïter“. „gesetzlos“ und „böses und sündiges Volk“ sind angemessene, nicht konfessionell einengende Wiedergaben.
