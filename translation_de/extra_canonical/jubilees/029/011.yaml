  yaml_path: translation/extra_canonical/jubilees/029/011.yaml
  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: de
  text: Ihre Königreiche waren Karnajim, Aschtarot, Edrei, Misur und Beon.[a] Der Herr vernichtete sie wegen ihrer bösen Taten, denn sie waren überaus gesetzlos. An ihrer Stelle ließ er die Amoriter wohnen, ein böses und sündiges Volk. Bis zum heutigen Tag gibt es kein Volk, das alle seine Sünden vollendet hat, und sie bestehen nicht mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Ortsnamen in der Liste des Gebiets der Refaiter sind in der äthiopischen Überlieferung schwer zu bestimmen; die Umschriften sind daher zurückhaltend gewählt.
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: Ihre Königreiche
  rationale: Der äthiopische Ausdruck steht im Plural; dies wird gegen ältere singularische Wiedergaben bewahrt.
- source_word: ጸዋጋን
  choice: gesetzlos
  rationale: Gibt die starke moralische Kennzeichnung wieder, ohne sie konfessionell oder durch eine spezifische Gesetzestheologie auszudeuten.
- source_word: አኅደረ
  choice: ließ … wohnen
  rationale: 'Kausative Wiedergabe entsprechend dem Kontext: Der Herr veranlasste die Ansiedlung der Amoriter.'
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: das alle ihre Sünden vollendet hat
  rationale: Bewahrt die auffällige und theologisch spannungsvolle Formulierung des Quelltexts, statt sie als ein erklärendes ‚volles Maß‘ zu glätten.
- source_word: ወአልቦሙ
  choice: und sie bestehen nicht mehr
  rationale: Der knappe negative Existenzsatz wird im Deutschen idiomatisch vervollständigt; der Rückbezug gilt den zuvor vernichteten Völkern.
theological_decisions:
- issue: Vollendung der Sünden
  choice: alle ihre Sünden vollendet
  alternative: das volle Maß ihrer Sünden erreicht
  rationale: Die formalere Wiedergabe erhält die ungewöhnliche Aussage und vermeidet, das im Text nicht ausdrücklich genannte Bild eines Sündenmaßes einzutragen.
- issue: Göttliche Verursachung der Ansiedlung
  choice: ließ er die Amoriter wohnen
  alternative: die Amoriter wohnten
  rationale: Die kausative Aussage des Quelltexts wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen werden konservativ transliteriert; Satzbau und Verknüpfungen sind für heutige Leser behutsam gegliedert, ohne die Härte oder Mehrdeutigkeit der Aussage zu beseitigen.
