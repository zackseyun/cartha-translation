  - severity: low
    issue: Satzverknüpfung am Schluss
    rationale: Der Semikolon trennt die negative Existenzaussage vom vorangehenden Gedanken stärker als die Quelle. Eine Komma-Verbindung bewahrt den fortlaufenden, absichtlich auffälligen Satz besser.
  - severity: low
    issue: Schreibung in der Fußnote
    rationale: „Refaiter“ ist die im Deutschen übliche Form; ein Trema ist hier nicht erforderlich.
