  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: de
  text: Abrahams, seines Vaters, auf dem Berg Hebron. Und dort sandte Jakob seinem Vater und seiner Mutter von Zeit zu Zeit alles, was sie brauchten; und sie segneten Jakob von ganzem Herzen und ganzer Seele.
