lexical_decisions:
- source_word: አብርሃም፡ አቡሁ
  choice: Abrahams, seines Vaters
  rationale: Der Vers beginnt mitten in einer Satzverbindung; die Genitivform wahrt den wahrscheinlichen Anschluss an den vorausgehenden Bezug auf den Turm Abrahams und gibt die Apposition „seines Vaters“ wieder.
- source_word: ወ'ህየ
  choice: Und dorthin
  rationale: Der lokale Rückverweis wird ausdrücklich bewahrt und bezieht sich auf den Berg Hebron.
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: immer wieder
  rationale: Gibt die wiederholte, gelegentliche Versorgung idiomatisch wieder, ohne eine feste zeitliche Regelmäßigkeit zu behaupten.
- source_word: ኵሎ፡ ትካዞሙ
  choice: alles, was sie brauchten
  rationale: Natürliche deutsche Wiedergabe des umfassenden Bedarfs der Eltern.
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: von ganzem Herzen und mit ganzer Seele
  rationale: Bewahrt die zweigliedrige Ganzheitsaussage in geläufiger, würdiger deutscher Form.
