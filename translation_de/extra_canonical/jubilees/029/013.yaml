lexical_decisions:
- source_word: ጽባሕ
  choice: am nächsten Morgen
  rationale: Gibt die zeitliche Fortsetzung natürlich und präzise wieder.
- source_word: ምድረ፡ ገለአድ
  choice: das Land Gilead
  rationale: Entspricht der geografischen Bezeichnung im Geʿez.
- source_word: ኢያቦክሃ
  choice: den Jabbok
  rationale: Wiedergabe des Flussnamens; das Verb bezeichnet hier das Überqueren.
- source_word: በታስዕ፡ ወርኅ
  choice: im neunten Monat
  rationale: Formale Wiedergabe der Monatsangabe.
- source_word: ተኂነኖ
  choice: sie versöhnten sich
  rationale: Drückt die wechselseitige Wiederherstellung des Friedens zwischen den Brüdern idiomatisch aus.
theological_decisions:
- issue: Deutung der beschädigten Datumsformel nach „im neunten Monat“
  choice: am elften Tag dieses Monats
  alternative: im ersten Jahr der zehnten Woche
  rationale: Die überlieferte Zeichenfolge ist offenbar verderbt; im unmittelbaren syntaktischen Zusammenhang mit dem neunten Monat ist die Lesung als elfter Tag die plausiblere Rekonstruktion. Die früher vertretene chronologische Wochenformel bleibt als alternative Deutung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die ungewöhnliche und offenbar beschädigte Datumsangabe wird im Haupttext nach der wahrscheinlichsten Lesung wiedergegeben; die alternative Deutung bleibt in einer Fußnote erhalten.
