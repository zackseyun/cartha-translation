  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: de
  text: Am nächsten Morgen zog er weiter in das Land Gilead. Jakob überquerte den Jabbok im neunten Monat, am elften Tag dieses Monats,[a] und an diesem Tag kam sein Bruder Esau zu ihm, und sie versöhnten sich.
  philosophy: optimal-equivalence
