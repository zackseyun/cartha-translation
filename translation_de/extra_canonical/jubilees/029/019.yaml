lexical_decisions:
- source_word: ዐዘቅተ፡ መሐላ፡ (ʿazaqta maḥālā)
  choice: Eidbrunnen
  rationale: Die beiden Wörter bezeichnen wörtlich den „Brunnen des Eides“. Das zusammengesetzte deutsche Wort ist natürlich und bewahrt die Bedeutung des geʿezischen Ausdrucks.
- source_word: ባሕቲቶ፡ (bāḥtito)
  choice: nur
  rationale: Das Wort schränkt den vorausgehenden Ausdruck im Sinn von „allein/nur“ ein; im gegebenen Satzfragment klingt „nur“ idiomatischer.
- source_word: ወዐርገ፡ (wa-ʿarga)
  choice: Und … zog … hinauf
  rationale: Das Verb bedeutet „hinaufgehen/hinaufziehen“. Bei einer Ortsveränderung Isaaks ist „zog hinauf“ natürliches modernes Deutsch.
- source_word: ወኀደረ፡ (wa-ḫadara)
  choice: und wohnte
  rationale: Das Verb kann „bleiben, sich niederlassen, wohnen“ bedeuten. „wohnte“ entspricht hier dem örtlichen Zusammenhang.
- source_word: ማኅፈደ፡ (māḫfada)
  choice: im Turm von
  rationale: Das Wort ist als Gattungsbezeichnung „Turm“ und in einer Verbindungsform zu verstehen, deren Ergänzung im folgenden Text steht. Daher wird es nicht als Eigenname „Mahfed“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der überlieferte Ausschnitt beginnt und endet mitten im Satz; insbesondere bleibt „im Turm von“ bewusst offen, weil die geʿezische Verbindungsform auf die Fortsetzung im nächsten Vers verweist.
