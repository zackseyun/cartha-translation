base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/018.yaml
  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: de
  text: Und er wohnte dort, getrennt von seinem Sohn Esau. Denn in der Zeit, als Jakob nach Mesopotamien zog, nahm sich Esau Mahalath, die Tochter Ismaels, zur Frau. Er führte den gesamten Viehbestand seines Vaters und seine Frauen zusammen, zog hinauf und ließ sich auf dem Berg Seïr nieder. Seinen Vater Isaak aber ließ er am Brunnen des Eides[a] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt Beerscheba.
    reason: Die wörtliche Ortsbezeichnung „Brunnen des Eides“ wird für heutige Leser mit dem geläufigen biblischen Ortsnamen identifiziert. Der bereitgestellte Quellenausschnitt bricht vor diesen letzten Wörtern ab; die Fortsetzung des vollständigen Verses lautet „Brunnen des Eides“.
lexical_decisions:
- source_word: ኀደረ (ḫadara)
  choice: wohnte / ließ sich nieder
  rationale: Das Verb bezeichnet je nach Zusammenhang das Wohnen, Bleiben oder Sichniederlassen. Die variierte Wiedergabe entspricht den beiden Kontexten und vermeidet im Deutschen eine unbeholfene Wiederholung.
- source_word: መስጴጦምያ
  choice: Mesopotamien
  rationale: Direkte Wiedergabe des geographischen Namens in seiner geläufigen deutschen Form.
- source_word: መርዔተ
  choice: Viehbestand
  rationale: Der Ausdruck bezeichnet hier das Vieh beziehungsweise die Tierbestände des Vaters; „Viehbestand“ wahrt die umfassende Bedeutung besser als „Herden“.
- source_word: ደብረ ሴር
  choice: Berg Seïr
  rationale: Formgerechte Wiedergabe des Ortsnamens; die Trema-Schreibung macht die getrennte Aussprache im Deutschen deutlich.
- source_word: ዐዘቅተ መሐላ
  choice: Brunnen des Eides
  rationale: Wörtliche Wiedergabe der Ortsbezeichnung, die Beerscheba erklärt, ohne den eigentlichen Ausdruck durch den geläufigeren Ortsnamen zu ersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Beziehung im ersten Satz bleibt als räumliche Trennung ausgedrückt. Der wiederholte Ge’ez-Ausdruck für Wohnen/Niederlassen wird kontextgerecht variiert. Der Schluss folgt der vollständigen Versüberlieferung, da der angegebene Ausschnitt nach der Präposition „in/an“ abbricht.
