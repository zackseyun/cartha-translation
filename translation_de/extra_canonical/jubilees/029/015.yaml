  text: at the time of autumn. And he sent to his father Isaac from all his possessions clothing and food, meat.
translation:
  language: de
  text: zur Herbstzeit. Und von seinem ganzen Besitz schickte er seinem Vater Isaak Kleidung und Nahrung, nämlich Fleisch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: zur Herbstzeit
  rationale: Die Wendung bezeichnet hier eine Jahreszeit und setzt offenbar die Aufzählung der Zeiten aus dem vorhergehenden Vers fort; sie ist nicht als Verb im Sinn von »bringen« zu verstehen.
- source_word: ወይፌኑ
  choice: Und … schickte er
  rationale: Das Verb bedeutet »senden/schicken«; die deutsche Wortstellung macht Absender, Empfänger und Gabe natürlich verständlich.
- source_word: እምኵሉ፡ ጥሪቱ
  choice: von seinem ganzen Besitz
  rationale: Gibt die Herkunft der Gaben aus der Gesamtheit seines Eigentums wieder.
- source_word: ልብሰ
  choice: Kleidung
  rationale: Eine geläufige und genaue Wiedergabe des Begriffs für Gewand beziehungsweise Bekleidung.
- source_word: ወሲሲተ፡ ሥጋ
  choice: und Nahrung, nämlich Fleisch
  rationale: ሲሲተ bezeichnet Nahrung oder Verpflegung, während ሥጋ Fleisch bezeichnet. »nämlich« gibt die appositionale Beziehung im Deutschen verständlich wieder, ohne die nicht belegte Bedeutung »Erstlingsgabe« einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kleingeschriebene fragmentarische Beginn »zur Herbstzeit« bewahrt den erkennbaren Anschluss an die vorausgehende Aufzählung. Die knappe Aufzählungsstruktur des Geʿez bleibt erhalten, wird aber durch »nämlich« idiomatisch verdeutlicht.
