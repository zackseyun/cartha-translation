  yaml_path: translation/extra_canonical/jubilees/029/007.yaml
  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: de
  text: bei Nacht und berichtete Laban über Jakob. Am fünfzehnten jener Tage veranstaltete Jakob ein Festmahl für Laban und für alle, die mit ihm gekommen waren. An jenem Tag schwor Jakob Laban, und ebenso schwor Laban Jakob, dass keiner auf dem Berg in böser Absicht zum anderen hinübergehen werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ፡
  choice: bei Nacht
  rationale: Gibt die adverbiale Zeitangabe knapp wieder; der fragmentarische Beginn wird entsprechend der Versabgrenzung bewahrt.
- source_word: ገብረ፡ … ግዝአ፡
  choice: veranstaltete … ein Festmahl
  rationale: Die Verbindung bezeichnet das Bereiten beziehungsweise Ausrichten eines Mahls; „Festmahl“ ist im Deutschen natürlich und dem feierlichen Anlass angemessen.
- source_word: መሐለ፡
  choice: schwor
  rationale: Entspricht der ausdrücklichen gegenseitigen Eidesleistung.
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡
  choice: dass keiner … zum anderen hinübergehen werde
  rationale: Bewahrt die wechselseitige Formulierung und den Gedanken des Überschreitens einer Grenze.
- source_word: በእኩይ፡
  choice: in böser Absicht
  rationale: Gibt den modalen Sinn idiomatisch wieder, ohne die Art des beabsichtigten Bösen näher festzulegen.
- source_word: በደብረ፡
  choice: auf dem Berg
  rationale: Folgt dem erhaltenen Text, der lediglich „auf/am Berg“ bietet und keinen bestimmten Bergnamen nennt.
theological_decisions:
- issue: Reichweite des gegenseitigen Eides
  choice: Die Verpflichtung wird symmetrisch als Eid Jakobs gegenüber Laban und Labans gegenüber Jakob wiedergegeben.
  alternative: Den Eid nur einer Partei zuschreiben oder die Verpflichtungen unterschiedlich formulieren.
  rationale: Der Ausgangstext nennt beide Eidesleistungen ausdrücklich und parallel.
- issue: Bedeutung des verbotenen Hinübergehens
  choice: Das Überschreiten wird nur bei böser Absicht untersagt.
  alternative: Jedes Überschreiten des Berges ausnahmslos verbieten.
  rationale: Die modale Bestimmung „in böser Absicht“ gehört ausdrücklich zur Aussage und darf nicht abgeschwächt oder verallgemeinert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der syntaktisch fragmentarische Versanfang bleibt erhalten, da die vorliegende Versabgrenzung mitten in einen Satz fällt. Die Schlussangabe wird ohne Ergänzung eines nicht belegten Bergnamens übersetzt.
