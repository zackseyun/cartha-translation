revisions:
- from: 'Denn er erzählte ihnen alles, was er im Traum gesehen hatte, und alles, was zu ihm gesagt worden war: Er solle in das Haus seines Vaters zurückkehren. Und er sagte zu ihm: »Geh an jeden Ort, wohin du auch gehst.«[a]'
  to: 'Denn er erzählte ihnen alles, was er im Traum gesehen hatte, und alles, was zu ihm gesagt worden war, dass er in das Haus seines Vaters zurückkehren solle; und er sagte zu ihm: »Geh an jeden Ort, wohin auch immer du gehst.«[a]'
  rationale: Die Revision glättet ausschließlich die deutsche Satzverknüpfung und die idiomatische Form der abschließenden Wiederholung. Sie hält am überlieferten geezischen Text fest, insbesondere an „zurückkehren“, und übernimmt weder eine harmonisierende Ergänzung noch eine theologisch bestimmte Rekonstruktion in den Haupttext.
