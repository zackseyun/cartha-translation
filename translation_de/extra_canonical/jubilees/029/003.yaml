  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: de
  text: 'Denn er erzählte ihnen alles, was er im Traum gesehen hatte, und alles, was zu ihm gesagt worden war, dass er in das Haus seines Vaters zurückkehren solle; und er sagte zu ihm: »Geh an jeden Ort, wohin auch immer du gehst.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte geezische Wortlaut ist hier ungewöhnlich und möglicherweise unvollständig. In Anlehnung an Genesis 31,3 wird bisweilen ergänzt: »und ich werde mit dir sein«; diese Worte stehen jedoch nicht im vorliegenden Text.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይግባእ
  choice: zurückkehren
  rationale: Das zugrunde liegende Verb ገብአ bedeutet hier »zurückkehren«; dies passt auch zum Zusammenhang von Jakobs Rückkehr in das Haus seines Vaters. »Eintreten« würde ein anderes geezisches Verb erwarten lassen.
- source_word: በህልም
  choice: im Traum
  rationale: Direkte und natürliche Wiedergabe der geezischen Präpositionalfügung.
- source_word: ውስተ፡ ኵሉ፡ መካን
  choice: an jeden Ort
  rationale: Gibt die räumliche Bewegung zu jedem Ort in idiomatischem Deutsch wieder, ohne die Aussage auf einen bestimmten Ort einzuengen.
- source_word: ወአይ፡ ተሐውር
  choice: wohin du auch gehst
  rationale: Folgt dem überlieferten geezischen Wortlaut und erhält dessen ungewöhnliche, möglicherweise textlich unvollständige Formulierung.
theological_decisions:
- issue: Mögliche Ergänzung nach Genesis 31,3
  choice: Keine Ergänzung »und ich werde mit dir sein« im Haupttext
  alternative: »und ich werde mit dir sein«
  rationale: Diese Zusage steht nicht im vorgelegten geezischen Text und wäre eine Rekonstruktion beziehungsweise Angleichung an Genesis 31,3. Die Übersetzung folgt daher dem erhaltenen Wortlaut und kennzeichnet dessen Schwierigkeit in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht befremdliche Wiederholung im letzten Satz bleibt erhalten, weil sie die Gestalt und mögliche Überlieferungsstörung des geezischen Textes erkennen lässt.
