    text: 'Die Wendung kann auch so verstanden werden: „Kein Rest von Leben blieb ihnen auf der Erde.“'
    reason: alternative_reading
  revision_rationale: Ergänzt wurde allein „in das Land des Ostens“, die im englischen Audit-Text ausgewiesene und vom geografischen Kontext getragene Apposition zu Mesopotamien. Der Fußnotenanker steht weiterhin unmittelbar bei der mehrdeutigen einleitenden Wendung. Der Versöhnungssatz bleibt absichtlich nicht darauf festgelegt, welcher Bruder als allein Handelnder zu verstehen wäre.
