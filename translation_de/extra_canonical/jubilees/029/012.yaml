lexical_decisions:
- source_word: ሕይወት፡ ውስተ፡ ምድር
  choice: Leben mehr auf der Erde
  rationale: Gibt die Wendung wörtlich und zugleich in natürlichem Deutsch wieder; „mehr“ gehört zum aus dem Zusammenhang erschlossenen verneinten Fortbestand des Lebens.
- source_word: ወፈነወ፡ ያዕቆብ፡ ላባሃ
  choice: Jakob verabschiedete Laban
  rationale: Das Verb bezeichnet hier das Fortsenden bzw. Ziehenlassen; „verabschiedete“ klingt im Deutschen natürlicher als „sandte Laban fort“, ohne einen Zwangsakt zu unterstellen.
- source_word: ሜስጶ
  choice: Mesopotamien
  rationale: Übernimmt die traditionelle geografische Bezeichnung, die auch durch die vollständigere Textüberlieferung bestätigt wird.
theological_decisions:
- issue: Bezug und Sinn des einleitenden Satzfragments
  choice: „kein Leben mehr auf der Erde“
  alternative: „kein Rest von Leben blieb ihnen auf der Erde“
  rationale: Die knappe Hauptfassung bewahrt den allgemeinen Wortlaut des überlieferten Fragments; die mögliche Deutung als vollständig erloschener Lebensrest wird in der Fußnote offengelegt.
- issue: Art der Versöhnung zwischen Jakob und Esau
  choice: „sie versöhnten sich miteinander“
  alternative: „er versöhnte sich mit ihm“
  rationale: Die deutsche Formulierung gibt die Gegenseitigkeit der Versöhnung idiomatisch wieder, ohne festzulegen, welcher Bruder allein die Initiative oder Verantwortung trug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang bleibt als Fortsetzung des vorangehenden Zusammenhangs erkennbar. Zeit- und Ortsangaben werden klar und idiomatisch formuliert; unnötig altertümliche Wendungen werden vermieden.
