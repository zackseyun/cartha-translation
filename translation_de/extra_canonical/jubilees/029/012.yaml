translation:
  language: de
  text: kein Leben mehr auf der Erde.[a] Jakob verabschiedete Laban, und dieser zog nach Mesopotamien, in das Land des Ostens. Jakob aber kehrte in das Land Gilead zurück. Am elften Tag des neunten Monats überquerte er den Jabbok. An diesem Tag kam sein Bruder Esau zu ihm, und sie versöhnten sich miteinander.
