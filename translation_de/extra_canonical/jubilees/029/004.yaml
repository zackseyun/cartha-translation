  revision_rationale: Die einzige sichere Korrektur ersetzt die einengende Bezeichnung „Lasttiere“ durch „Tiere“. Dadurch bleibt die Aussage offen, wie es der Quellentext verlangt, während die klare Unterscheidung zwischen dem Aufsetzen der Familie und dem Mitnehmen des Besitzes erhalten bleibt.
