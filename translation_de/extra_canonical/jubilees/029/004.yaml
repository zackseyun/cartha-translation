review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die beiden unterschiedlichen Handlungen des ge''ezischen Textes zuverlässig wieder: Jakob setzt Frauen und Kinder auf Tiere, nimmt den Besitz und überquert den Fluss. Auch das nicht genannte Ziel von „kam an“ wird zutreffend nicht ergänzt. „Lasttiere“ ist jedoch enger als der quellentextliche allgemeine Ausdruck für Tiere/Beastien und sollte nicht spezifiziert werden.'
  naturalness: Die Fassung ist modernes, würdiges und gut verständliches Deutsch. „Dann brach er auf“ und „kam an“ sind idiomatisch. „auf die Tiere“ ist hier ebenso verständlich wie „auf die Lasttiere“, aber quellentreuer.
  terminology: „Pries den Gott“ ist als natürliche deutsche Wiedergabe des an Gott gerichteten „segnete“ vertretbar. Die Verwandtschaftsformel bei Abraham bleibt sinnvoll wörtlich. „Besitz“ und „der Fluss“ sind passend.
  issues:
  - severity: low
    issue: „Lasttiere“ spezifiziert die Tiere unnötig.
    rationale: Der ge'ezische Text bezeichnet an dieser Stelle allgemein Tiere; weder Tierart noch deren Funktion als Lasttiere wird ausgedrückt. Die vorherige englische Prüfung spricht ebenfalls nur von „animals“.
  revised_text: … mit dir.[a] Und Jakob pries den Gott seines Vaters Isaak und den Gott Abrahams, des Vaters seines Vaters. Dann brach er auf, setzte seine Frauen und seine Kinder auf die Tiere, nahm seinen ganzen Besitz mit, überquerte den Fluss und kam an.
  revised_footnotes:
