  yaml_path: translation/extra_canonical/jubilees/029/004.yaml
  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: de
  text: … mit dir.[a] Und Jakob pries den Gott seines Vaters Isaak und den Gott Abrahams, des Vaters seines Vaters. Dann brach er auf, setzte seine Frauen und seine Kinder auf die Tiere, nahm seinen ganzen Besitz mit, überquerte den Fluss und kam an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „mit dir“ schließen syntaktisch an die vorausgehende Rede an; die Versgrenze liegt mitten im Satz.
    reason: Die vorgegebene Versquelle beginnt mit ምስሌከ („mit dir“), während die englische Konsultationsfassung diese zum vorherigen Zusammenhang gehörenden Worte auslässt.
lexical_decisions:
- source_word: ባረኮ
  choice: pries
  rationale: Das Verb bedeutet wörtlich „segnete“. Da Gott das Objekt ist, gibt „pries“ die hier gemeinte, im Deutschen natürliche Richtung des Segnens wieder, ohne den theologischen Gehalt abzuschwächen.
- source_word: ወጸዐ
  choice: setzte … auf die Lasttiere
  rationale: Die überlieferte Form ist offenbar verkürzt oder verderbt; im Zusammenhang und entsprechend dem zugrunde liegenden Ladeverb bezeichnet sie, dass Jakob seine Frauen und Kinder auf Reit- bzw. Lasttiere setzte. So bleibt die Handlung von dem folgenden ነሥአ („nahm“) unterschieden.
- source_word: ጥሪተ
  choice: Besitz
  rationale: Der Ausdruck bezeichnet Jakobs Habe bzw. Vermögen; „Besitz“ ist umfassend und in diesem Zusammenhang natürlich.
- source_word: ፈለገ
  choice: den Fluss
  rationale: Der bestimmte Ausdruck nennt hier keinen Flussnamen. Daher wird die Bestimmtheit bewahrt, ohne „Euphrat“ erläuternd in den Haupttext einzutragen.
- source_word: ወበጽሐ
  choice: und kam an
  rationale: Das Ziel ist im vorliegenden Vers nicht ausgedrückt. Die deutsche Fassung ergänzt deshalb keinen Ort.
theological_decisions:
- issue: Jakob als derjenige, der Gott „segnet“
  choice: „Jakob pries den Gott …“
  alternative: „Jakob segnete den Gott …“
  rationale: Die wörtliche Alternative wäre im modernen Deutschen missverständlich, als würde Jakob Gott Segen verleihen. „Pries“ wahrt die biblische Bedeutung des an Gott gerichteten Segnens als Lobpreis.
- issue: Bezeichnung Abrahams als „Vater seines Vaters“
  choice: wörtliche Verwandtschaftsformel beibehalten
  alternative: „seinen Großvater Abraham“
  rationale: Die Wiederholung von „Vater“ ist im Quelltext ausdrücklich vorhanden und verbindet Abraham eng mit Isaak; sie wird nicht zu „Großvater“ geglättet.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzgliederung. Die einleitenden Ellipsen zeigen an, dass der Vers mit dem Ende eines bereits begonnenen Satzes einsetzt. Die zwei verschiedenen Handlungen—Familie auf Tiere setzen und Besitz mitnehmen—werden ausdrücklich getrennt wiedergegeben.
