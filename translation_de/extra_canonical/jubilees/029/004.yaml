- from: … mit dir.[a] Und Jakob pries den Gott seines Vaters Isaak und den Gott Abrahams, des Vaters seines Vaters. Dann brach er auf, setzte seine Frauen und seine Kinder auf die Lasttiere, nahm seinen ganzen Besitz mit, überquerte den Fluss und kam an.
  to: … mit dir.[a] Und Jakob pries den Gott seines Vaters Isaak und den Gott Abrahams, des Vaters seines Vaters. Dann brach er auf, setzte seine Frauen und seine Kinder auf die Tiere, nahm seinen ganzen Besitz mit, überquerte den Fluss und kam an.
  rationale: Die einzige sichere Korrektur ersetzt die einengende Bezeichnung „Lasttiere“ durch „Tiere“. Dadurch bleibt die Aussage offen, wie es der Quellentext verlangt, während die klare Unterscheidung zwischen dem Aufsetzen der Familie und dem Mitnehmen des Besitzes erhalten bleibt.
