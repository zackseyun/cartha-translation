  text: And their dwelling was from the land of the sons of Ammon as far as Mount Hermon, and the house of
translation:
  language: de
  text: Und ihr Wohngebiet erstreckte sich vom Land der Söhne Ammons bis zum Berg Hermon und zum Haus von[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Textausschnitt bricht nach „Haus von“ ab; das geezische ወቤተ ist eine unvollständige Genitivverbindung. Es bedeutet hier nicht „Bethel“.
    reason: Die unvollständige Verssegmentierung und die grammatische Form des Ausgangstextes müssen transparent gemacht werden, ohne den fehlenden Namen zu ergänzen.
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: ihr Wohngebiet
  rationale: Das Substantiv bezeichnet ihren Wohn- bzw. Siedlungsraum; „Wohngebiet“ gibt den geografischen Zusammenhang im modernen Deutsch natürlich wieder.
- source_word: ምድረ ውሉደ አሞን
  choice: Land der Söhne Ammons
  rationale: Die Abstammungsbezeichnung wird entsprechend der geezischen Form bewahrt, statt sie stillschweigend zu „Ammoniter“ zu vereinfachen.
- source_word: እስከ ደብረ ሔርሞን
  choice: bis zum Berg Hermon
  rationale: እስከ markiert die Ausdehnungsgrenze, ደብር den Berg; „Berg Hermon“ ist die geläufige deutsche Form.
- source_word: ወቤተ
  choice: und zum Haus von
  rationale: ቤተ steht hier in der Status-constructus-Form und verlangt eine nachfolgende Ergänzung. Es bedeutet nicht „Bethel“. Das ergänzende „zum“ führt die mit „bis“ bezeichnete räumliche Grenze im Deutschen natürlich fort.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geografische Aussage wird flüssig formuliert, die echte Unvollständigkeit der Vorlage jedoch nicht durch eine Vermutung beseitigt. Das isolierte ኑኖሙ vor dem Satz gehört offenbar zum vorausgehenden Segment und wurde daher nicht in diesen Verssatz aufgenommen.
