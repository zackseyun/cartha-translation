  to: Und nun soll der Pharao im ganzen Land Ägypten Aufseher einsetzen. Sie sollen während der Jahre des Überflusses Getreide in den Vorratshäusern der Städte, in jeder Stadt,[a] einlagern.[b] Es soll als Vorrat für die sieben Jahre der Hungersnot dienen, und das Land wird angesichts der Hungersnot nicht zugrunde gehen; denn sie wird überaus schwer sein.
