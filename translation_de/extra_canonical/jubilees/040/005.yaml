base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: de
  text: Und nun soll der Pharao im ganzen Land Ägypten Aufseher einsetzen. Sie sollen während der Jahre des Überflusses Getreide in den Vorratshäusern der Städte, in jeder Stadt,[a] einlagern.[b] Es soll als Vorrat für die sieben Jahre der Hungersnot dienen, und das Land wird angesichts der Hungersnot nicht zugrunde gehen; denn sie wird überaus schwer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Städten“.'
    reason: Die Ortsangabe kann weniger ausdrücklich distributiv verstanden werden.
  - marker: b
    text: 'Wörtlich: „während der Tage der Jahre des Überflusses“.'
    reason: Der Grundtext bewahrt eine semitische Zeitformel; der Haupttext gibt sie in natürlichem modernem Deutsch wieder.
lexical_decisions:
- source_word: መኰንነ
  choice: Aufseher
  rationale: Die Amtsbezeichnung wird im gegebenen Verwaltungskontext funktional als „Aufseher“ wiedergegeben; der folgende Plural („sie sollen einlagern“) spricht für mehrere Beauftragte.
- source_word: በቤተ፡ አህጉር
  choice: in den Vorratshäusern der Städte
  rationale: Wörtlich bezeichnet die Wendung die „Häuser der Städte“; im Zusammenhang der Getreidelagerung sind damit Vorratshäuser gemeint. So bleibt das ausdrücklich vorhandene ቤተ („Haus/Häuser“) erhalten.
- source_word: ውስተ፡ ሀገር
  choice: Stadt für Stadt
  rationale: Die singularische Wendung nach „den Städten“ wird distributiv verstanden und in natürlichem Deutsch als „Stadt für Stadt“ ausgedrückt.
- source_word: በመዋዕለ፡ ዓመታት፡ ዘጽጋብ
  choice: während der Tage der Jahre des Überflusses
  rationale: Die charakteristische semitische Formulierung „Tage der Jahre“ wird trotz ihrer Ungewöhnlichkeit bewahrt, statt zu „während der Jahre“ verkürzt zu werden.
- source_word: ሲሳተ
  choice: Vorrat
  rationale: Das Wort bezeichnet hier die angesammelte Versorgung für die bevorstehende Hungersnot; „Vorrat“ ist im Deutschen prägnant und kontextgerecht.
- source_word: እምቅድመ፡ ገጸ፡ ረኃብ
  choice: angesichts der Hungersnot
  rationale: Die bildhafte Wendung „vor dem Angesicht der Hungersnot“ wird mit der etablierten deutschen Entsprechung „angesichts“ natürlich und würdig wiedergegeben.
theological_decisions: []
