translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „bis“ wurde zugunsten eines flüssigen deutschen Satzes mit „und“ verbunden; die zeitlich-steigernde Abfolge bleibt erhalten. „Josef“ folgt der heute üblichen deutschen Namensform.
