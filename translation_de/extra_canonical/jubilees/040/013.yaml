  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: de
  text: Und Josef sammelte die Lebensmittel für jede Stadt in der jeweiligen Stadt[a], bis jede Stadt voll Getreide war, bis man es wegen seiner Fülle nicht mehr zählen und messen konnte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für eine Stadt in einer Stadt“. Gemeint ist wahrscheinlich, dass die Lebensmittel für jede Stadt in eben dieser Stadt gesammelt wurden.'
    reason: Die knappe distributive Wendung des Ge’ez ist wörtlich im Deutschen missverständlich und wurde deshalb im Haupttext sinngemäß wiedergegeben.
  - marker: b
    text: 'Wörtlicher: „bis sie sein Zählen und Messen wegen seiner Fülle nicht vermochten“.'
    reason: Die Subjekte des Satzes sind im Ge’ez nicht völlig eindeutig; die deutsche Hauptfassung verwendet daher das unpersönliche „man“.
lexical_decisions:
- source_word: ሲሳተ (sisāta)
  choice: Lebensmittel
  rationale: Bezeichnet Nahrung beziehungsweise Vorräte; „Lebensmittel“ ist im Zusammenhang der Getreidesammlung natürlich und ausreichend umfassend.
- source_word: ለሀገር፡ ውስተ፡ ሀገር (la-hagar wəsta hagar)
  choice: jeder Stadt in der jeweiligen Stadt
  rationale: Gibt die distributive Aussage wieder, dass die Lebensmittel einer Stadt dort selbst gesammelt wurden, statt einen Transport von Stadt zu Stadt anzunehmen.
- source_word: መልአ፡ ስርናየ (mal'a sərnāya)
  choice: voll Getreide waren
  rationale: Bewahrt das konkrete Verb „voll sein/gefüllt sein“ und nimmt die anschließende Aussage über die Unmessbarkeit nicht vorweg.
- source_word: ኍልቈቶ፡ ወሰፈረ (ḫʷəlqʷato wa-safara)
  choice: es … zählen und messen
  rationale: Die beiden koordinierten Begriffe werden gemeinsam von „nicht vermochten“ abhängig verstanden; im Deutschen ist die verbale Wiedergabe klar und natürlich.
- source_word: እምነ፡ ብዝኁ (ʾəmna bəzuḫu)
  choice: wegen seiner Fülle
  rationale: Gibt den kausalen Sinn wieder und bewahrt zugleich das Bild einer überwältigenden Menge.
