  source_fidelity: 'Der deutsche Text gibt die ge''ezische Satzfolge und die entscheidenden, textgeschichtlich schwierigen Lesarten zuverlässig wieder: Pontifans bleibt gegenüber einer Harmonisierung an die LXX erhalten, und Sawes wird als im Text überlieferter Eigenname bewahrt. Die doppelte Abstammungsangabe („Tochter Potifars … Tochter des Sawes“) wird nicht geglättet. „Oberster der Wachen“ entspricht ሊቀ፡ ዐቀብት.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Register. „gab Josef den Namen“ und „zur Frau geben“ sind idiomatisch. Die syntaktische Spannung der doppelten Tochterbezeichnung ist absichtlich und quellentreu erhalten; die nachgestellte Amtsbezeichnung ist dabei noch verständlich auf Sawes bezogen.
  terminology: Die Namensformen Pontifans, Potifar und Sawes sind konsistent mit der äthiopischen Vorlage und dem englischen Audit Trail. Die Fußnote zu Sawes erklärt die wahrscheinliche Verderbnis vorsichtig, ohne den Haupttext zu emendieren oder eine konfessionelle Auslegung vorzugeben.
