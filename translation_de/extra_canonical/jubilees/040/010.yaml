  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: de
  text: Und der König gab Josef den Namen Pontifans[a] und gab ihm die Tochter Potifars zur Frau, die Tochter des Sawes[b] aus Heliopolis, des Obersten der Wachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen Überlieferungsform: „Psonthomphanes“.'
    reason: Weist auf die abweichende, an die Septuaginta erinnernde Namensform hin, ohne sie in den Haupttext einzutragen.
  - marker: b
    text: Die Form „Sawes“ beruht wahrscheinlich auf einer verderbten Überlieferung eines Wortes mit der Bedeutung „Priester“.
    reason: Erklärt die textgeschichtliche Schwierigkeit und bewahrt zugleich die Ge'ez-Lesart im Haupttext.
lexical_decisions:
- source_word: ጸውዐ፡ ንጉሥ፡ ስሞ፡ ለዮሴፍ
  choice: der König gab Josef den Namen
  rationale: Die wörtliche Wendung „rief den Namen“ wird im heutigen Deutsch idiomatisch als Namensgebung wiedergegeben.
- source_word: ጶንጢፋንስ
  choice: Pontifans
  rationale: Diese Umschrift folgt der eigenständigen äthiopischen Namensform und harmonisiert sie nicht stillschweigend mit der Septuaginta.
- source_word: ወለተ፡ ጶጢፋራን
  choice: die Tochter Potifars
  rationale: Die genealogische Zuordnung des Ge'ez-Textes wird trotz ihrer Spannung mit dem folgenden Ausdruck bewahrt.
- source_word: ሳውፅ
  choice: Sawes
  rationale: Der überlieferte Ge'ez-Text behandelt die Form als Eigennamen; die mögliche Entstehung aus einem Wort für „Priester“ wird nur in der Fußnote erläutert.
- source_word: ሊቀ፡ ዐቀብት
  choice: Obersten der Wachen
  rationale: Gibt die Amtsbezeichnung sachlich und verständlich wieder, ohne sie an eine bestimmte Genesis-Fassung anzugleichen.
theological_decisions:
- issue: Spannung in der doppelten Abstammungsangabe
  choice: „die Tochter Potifars … die Tochter des Sawes“ im Haupttext bewahren
  alternative: Den Text nach Genesis 41,45 zu „die Tochter Potiferas, des Priesters von Heliopolis“ emendieren
  rationale: Die überlieferte äthiopische Lesart ist trotz ihrer genealogischen Schwierigkeit vorrangig; eine Harmonisierung würde die tatsächliche Textgestalt verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige doppelte Bezeichnung „Tochter Potifars, die Tochter des Sawes“ bleibt erhalten, da der Ge'ez-Text sie bietet; Satzbau und Namensgebung sind für heutige Leser behutsam idiomatisiert.
