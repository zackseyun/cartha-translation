  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Aussagen des geezischen Textes zuverlässig wieder: Josephs Einsetzung als Zweiter, seine Herrschaft über Ägypten, der zweite Wagen des Pharaos, Leinengewänder, Goldkette, die schwer deutbaren Ausrufe, der Siegelring, die Verwaltung des Hauses und der alleinige Vorrang des Pharaos beim Thron. Die Wiedergabe von መንበር als „Thron“ ist sachgerecht und die Formulierung zum Vorrang wahrt den Sinn der Einschränkung.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Erzählton. Die Aufteilung in mehrere Sätze erleichtert die Lesbarkeit, ohne die enge Reihung der Vorlage wesentlich zu beeinträchtigen. „Nur durch den Thron“ ist knapp und verständlich; die Fußnote hält die formnähere mögliche Nuance fest.
  terminology: „feines Leinen“, „goldene Kette“, „Siegelring“ und „Thron“ sind treffende und registergerechte Entsprechungen. Die nicht sicher erklärbaren Rufe „El, El“ und „Abrer“ werden zu Recht nicht harmonisierend nach Genesis 41,43 gedeutet. Die Fußnotenanker stehen an den jeweils einschlägigen Stellen.
