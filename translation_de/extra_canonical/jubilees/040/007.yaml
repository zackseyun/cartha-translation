  yaml_path: translation/extra_canonical/jubilees/040/007.yaml
  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: de
  text: 'Und er setzte ihn als Zweiten über sein ganzes Reich ein und machte ihn zum Herrscher über ganz Ägypten. Er ließ ihn auf dem zweiten Wagen des Pharaos fahren, kleidete ihn in Gewänder aus feinem Leinen und legte ihm eine goldene Kette um den Hals. Vor ihm rief man: „El, El“ und „Abrer“.[a] Dann gab er ihm seinen Siegelring in die Hand, setzte ihn über sein ganzes Haus, erhob ihn und sagte zu ihm: „Nur durch den Thron werde ich größer sein als du.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferten Rufe „El, El“ und „Abrer“ sind in ihrer Bedeutung unsicher; sie werden daher nicht übersetzt.
    reason: Kennzeichnet eine echte Unsicherheit des Ausgangstextes, statt eine Deutung in den Haupttext einzutragen.
  - marker: b
    text: 'Wörtlich auch: „Nur hinsichtlich des Thrones allein werde ich größer sein als du.“'
    reason: Dokumentiert die nachdrückliche Formulierung des Ausgangstextes und die mögliche formalere Wiedergabe.
lexical_decisions:
- source_word: ሤሞ፡ ዳግመ
  choice: setzte ihn als Zweiten … ein
  rationale: Gibt die Ernennung Josephs zum rangmäßig Zweiten wieder, ohne das Adverb lediglich zeitlich als „wieder“ zu verstehen.
- source_word: ቢሶስ
  choice: feines Leinen
  rationale: Das Lehnwort bezeichnet hier hochwertige Leinen- beziehungsweise Byssuskleidung; „feines Leinen“ ist im Deutschen klar und würdig.
- source_word: ዝግና፡ ወርቅ
  choice: eine goldene Kette
  rationale: Entspricht dem konkreten Schmuckstück, das um den Hals gelegt wird.
- source_word: ማዕተቤ
  choice: Siegelring
  rationale: Im erzählerischen Zusammenhang bezeichnet das übergebene Herrschaftszeichen den Siegelring des Pharaos.
- source_word: መንበር
  choice: Thron
  rationale: Bewahrt das konkrete königliche Herrschaftssymbol und die Rangabgrenzung zwischen Pharao und Joseph.
theological_decisions:
- issue: Bedeutung der vor Joseph ausgerufenen Wörter
  choice: „El, El“ und „Abrer“ unverändert als überlieferte Rufe wiedergeben
  alternative: Die Ausdrücke deuten oder nach Genesis 41,43 mit „Beugt die Knie!“ übersetzen
  rationale: Die geezische Textgestalt bietet fremde beziehungsweise schwer deutbare Ausdrücke. Eine eindeutige Übersetzung würde die echte lexikalische Unsicherheit verdecken.
- issue: Vorrang des Pharaos aufgrund des Thrones
  choice: „Nur durch den Thron werde ich größer sein als du“
  alternative: „Nur hinsichtlich des Thrones allein werde ich größer sein als du“
  rationale: Die knappe deutsche Form erhält die Aussage, dass allein die königliche Thronstellung den Pharao über Joseph stellt, ohne die Spannung durch zusätzliche Erklärung aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Die Satzfolge bleibt eng am geezischen Text, wird aber für natürliche deutsche Lesbarkeit gegliedert. Altertümliche Amts- und Kleidungsbegriffe werden vermieden, soweit sie keinen Bedeutungsgewinn bieten.
