  yaml_path: translation/extra_canonical/jubilees/040/006.yaml
  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: de
  text: 'Und der Herr schenkte Josef Gunst und Erbarmen in den Augen des Pharaos. Da sagte der Pharao zu seinen Dienern: »Wir werden keinen Mann finden, der so weise und verständig ist wie dieser Mann; denn der Geist des Herrn ist mit ihm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞገሰ፡ ወምሕረተ
  choice: Gunst und Erbarmen
  rationale: Gibt die beiden koordinierten Begriffe formal und zugleich in natürlichem Deutsch wieder, ohne sie zu einem einzigen Ausdruck zu verschmelzen.
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: vor den Augen des Pharaos
  rationale: Bewahrt die konkrete semitische Ausdrucksweise der Vorlage, die hier Anerkennung beziehungsweise Wohlwollen bezeichnet.
- source_word: ጠቢበ፡ ወማእምረ
  choice: weise und verständig
  rationale: Erhält die Doppelbezeichnung für praktische Weisheit und Einsicht.
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: der Geist des Herrn
  rationale: Entspricht der expliziten Gottesbezeichnung der ge'ezischen Vorlage und vermeidet eine Abschwächung zu bloßer Begabung oder Klugheit.
- source_word: ምስሌሁ
  choice: mit ihm
  rationale: Gibt die relationale Aussage knapp und unmittelbar wieder.
theological_decisions:
- issue: Art und Wirkung des göttlichen Geistes bei Josef
  choice: »der Geist des Herrn ist mit ihm«
  alternative: »der Geist Gottes ist in ihm«
  rationale: Die Übersetzung folgt der ge'ezischen Formulierung mit »Herr« und der Präposition »mit«. Sie legt weder eine besondere Art der Innewohnung noch eine spätere pneumatologische Systematik in den Vers hinein.
- issue: Göttliches Handeln und menschliche Anerkennung
  choice: Der Herr schenkt Josef Gunst und Erbarmen vor dem Pharao
  alternative: Josef findet Gunst beim Pharao
  rationale: Die aktive Zuschreibung an den Herrn bleibt erhalten und wahrt damit den theologischen Akzent der Vorlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede ist direkt und gut verständlich; die leichte Wiederholung »wie dieser Mann« bewahrt den Nachdruck der Vorlage.
