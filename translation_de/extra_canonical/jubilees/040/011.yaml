  text: And in the year Joseph stood before Pharaoh, he was thirty years old when he stood before Pharaoh.
translation:
  language: de
  text: Und in dem Jahr, in dem Josef vor den Pharao trat, war er dreißig Jahre alt, als er vor den Pharao trat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, unter Straffung der Wiederholung: „Und Josef war dreißig Jahre alt, als er vor den Pharao trat.“'
    reason: Die kürzere Fassung gibt den Sinn idiomatisch wieder; der Haupttext bewahrt jedoch die im überlieferten Wortlaut vorhandene Wiederholung.
lexical_decisions:
- source_word: ወበዐሰተ
  choice: Und in dem Jahr
  rationale: Der Ausdruck ist in der vorliegenden Edition offenbar fehlerhaft überliefert oder erfasst; im Kontext ist sehr wahrscheinlich ወበዐመተ („und in dem Jahr“) gemeint. Die Übersetzung folgt dieser naheliegenden Lesart.
- source_word: ቆመ፡ … ኀበ፡ ፈርዖን
  choice: vor den Pharao trat
  rationale: Die wörtliche Vorstellung „bei/vor Pharao stehen“ bezeichnet hier das Erscheinen vor dem Herrscher; „vor den Pharao trat“ ist natürliches, würdevolles Deutsch.
- source_word: ወልደ፡ ሠላሳ፡ ክረምተ
  choice: war er dreißig Jahre alt
  rationale: Die äthiopische Altersangabe wird idiomatisch und genau wiedergegeben.
