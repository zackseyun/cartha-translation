  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: de
  text: Da erinnerte sich der oberste Mundschenk an Josef und sprach mit dem König über ihn. Der König ließ ihn aus dem Gefängnis holen, und Josef erzählte ihm seine beiden Träume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: der oberste Mundschenk
  rationale: Die Amtsbezeichnung meint den ranghöchsten königlichen Mundschenk; diese geläufige deutsche Wiedergabe bewahrt Hofamt und Rang.
- source_word: ንጉሥ
  choice: König
  rationale: Direkte und natürliche Entsprechung für den Herrschertitel.
- source_word: ቤተ፡ ሞቅሕ
  choice: Gefängnis
  rationale: Wörtlich etwa „Haus der Gefangenschaft“; „Gefängnis“ ist im modernen Deutsch natürlich und sachlich genau.
- source_word: ሕለመሁ
  choice: seine ... Träume
  rationale: 'Das Suffix -ሁ bezeichnet die 3. Person Singular maskulin und macht den Besitz ausdrücklich: „seine Träume“.'
theological_decisions:
- issue: Subjekt von ወአውፅኦ („und er ließ ihn herausbringen“)
  choice: Der König ließ ihn ... holen
  alternative: Der oberste Mundschenk brachte ihn heraus
  rationale: Das Verb kann wegen der Abfolge formal an den Mundschenk anschließen; im Erzählzusammenhang ist jedoch der König der naheliegende Veranlasser. Die kausative Form wird mit „ließ ... holen“ wiedergegeben, ohne eine persönliche Befreiung durch den Mundschenk zu behaupten.
- issue: Subjekt des abschließenden Erzählens
  choice: Josef erzählte ihm seine beiden Träume
  alternative: Der oberste Mundschenk erzählte vor dem König beide Träume Josefs
  rationale: Die pronominale Abfolge des Ge'ez ist knapp und potenziell mehrdeutig. Der unmittelbare Ablauf nach Josefs Herausholen sowie der Besitzmarker in ሕለመሁ stützen Josef als Erzähler seiner beiden Träume; die Formulierung macht die deutschen Bezüge verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bilden die fortlaufende Erzählstruktur ab; missverständliche Pronomen werden durch Eigennamen beziehungsweise Amtsbezeichnung aufgelöst.
