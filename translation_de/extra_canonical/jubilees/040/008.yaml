  to: Und Josef zog durch das ganze Land Ägypten. Alle Fürsten des Pharaos liebten ihn, ebenso alle Diener des Pharaos und alle, die im Dienst des Königs standen; denn er führte ein rechtschaffenes Leben. Bei ihm gab es weder Stolz noch Hochmut im Herzen noch Parteilichkeit, und er nahm keine Bestechungsgeschenke an; denn er sprach allen Völkern der Erde gegenüber gerechtes Recht.
