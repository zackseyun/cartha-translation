  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: de
  text: Und Josef zog durch das ganze Land Ägypten. Alle Fürsten des Pharaos liebten ihn, ebenso alle Diener des Pharaos und alle, die im Dienst des Königs standen; denn er führte ein rechtschaffenes Leben. Bei ihm gab es weder Stolz noch Hochmut im Herzen noch Parteilichkeit, und er nahm keine Bestechungsgeschenke an; denn er sprach allen Völkern der Erde gegenüber gerechtes Recht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወመበለ፡ ዮሴፍ፡ ውስተ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: Und Josef zog durch das ganze Land Ägypten
  rationale: Das Verb wird im Kontext als Bewegung durch das Land verstanden; „zog durch“ ist natürlich und entspricht der englischen Konsultationsschicht.
- source_word: አፍቀርዎ
  choice: liebten ihn
  rationale: Gibt die ausdrückliche Aussage des Ausgangstextes direkt wieder, ohne sie zu „schätzten“ abzuschwächen.
- source_word: እለ፡ ይገብሩ፡ ግብረ፡ ንጉሥ
  choice: die im Dienst des Königs standen
  rationale: Natürliche deutsche Wiedergabe des wörtlichen Ausdrucks „die das Werk des Königs tun“.
- source_word: ርቱዐ፡ የሐውር
  choice: er führte ein rechtschaffenes Leben
  rationale: Die Bewegungsmetapher „aufrichtig gehen“ bezeichnet die Lebensführung; die deutsche Formulierung bewahrt den ethischen Sinn in idiomatischer Sprache.
- source_word: አሢሦተ፡ ገጽ
  choice: Parteilichkeit
  rationale: Der Ausdruck bezeichnet Ansehen der Person beziehungsweise Begünstigung, nicht Hochmut des Gesichts.
- source_word: ነሢአ፡ ሕልያነ
  choice: er nahm keine Bestechungsgeschenke an
  rationale: Die Wendung meint das Annehmen von Gaben im korrupten richterlichen Sinn; „Bestechungsgeschenke“ macht dies eindeutig.
- source_word: ርቱዐ፡ ይኴንን
  choice: er sprach … gerechtes Recht
  rationale: Bewahrt sowohl die richterliche Tätigkeit als auch die wiederholte Betonung gerechten Handelns.
- source_word: ለኵሉ፡ አሕዛበ፡ ምድር
  choice: allen Völkern des Landes gegenüber
  rationale: „Völker“ gibt አሕዛብ wieder; „des Landes“ folgt dem unmittelbaren ägyptischen Kontext, ohne die mögliche weitere Bedeutung von „Erde“ dogmatisch auszuschließen.
theological_decisions:
- issue: Reichweite von „allen Völkern des Landes/der Erde“
  choice: allen Völkern des Landes gegenüber
  alternative: für alle Völker der Erde
  rationale: Der Erzählkontext handelt von Josefs Verwaltung Ägyptens. „Land“ ist deshalb im Haupttext kontextuell angemessen; die Formulierung soll keine universale Weltherrschaft Josefs nahelegen.
- issue: Charakterisierung von Josefs Unparteilichkeit
  choice: Parteilichkeit und Annahme von Bestechungsgeschenken als zwei getrennte Laster
  alternative: „Hochmut des Gesichts“ und „Parteilichkeit in seinen Gedanken“
  rationale: Die ge’ezischen Wendungen bezeichnen nach der revidierten Quellenanalyse Begünstigung und Bestechlichkeit. Ihre Trennung bewahrt zudem das wiederholte „und es gab kein“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Verwaltungssprache. Die Satzstruktur bleibt nah am ge’ezischen Begründungsgang, wird aber für flüssiges Deutsch moderat gegliedert. Keine konfessionell geprägte Terminologie.
