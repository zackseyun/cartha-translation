    issue: „allen Völkern des Landes“ statt „allen Völkern der Erde“
    rationale: Der Ausgangstext hat ausdrücklich „Völker der Erde“. Der ägyptische Erzählkontext rechtfertigt keine Ersetzung von „Erde“ durch „Land“.
  - severity: low
    issue: „alle seine Diener“
    rationale: Das Possessivpronomen kann im Deutschen auf Josef zurückbezogen werden, während der geʿezische Kontext die Diener des Pharaos meint.
