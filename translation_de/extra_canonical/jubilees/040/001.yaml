- from: 'Und es geschah ihnen so, wie er es ihnen gedeutet hatte: Der Pharao setzte den obersten Mundschenk wieder in sein Amt ein; den Bäcker aber ließ er töten, wie Josef es ihnen gedeutet hatte. Der oberste Mundschenk ließ Josef im Gefängnis zurück, obwohl Josef ihm mitgeteilt hatte, was geschehen würde. Er dachte nicht daran, dem Pharao mitzuteilen, was Josef ihm gesagt hatte, denn er hatte es vergessen.'
  to: 'Und es erging ihnen genau so, wie er ihnen gedeutet hatte: Der Pharao setzte den obersten Mundschenk wieder in sein Amt ein; den Bäcker aber ließ er töten, wie Josef es ihnen gedeutet hatte. Der oberste Mundschenk ließ Josef im Gefängnis zurück, nachdem Josef ihm mitgeteilt hatte, was geschehen würde. Er erinnerte sich nicht daran, dem Pharao mitzuteilen, was Josef ihm gesagt hatte, denn er vergaß es.'
