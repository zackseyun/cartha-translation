base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: de
  text: 'Und es erging ihnen genau so, wie er ihnen gedeutet hatte: Der Pharao setzte den obersten Mundschenk wieder in sein Amt ein; den Bäcker aber ließ er töten, wie Josef es ihnen gedeutet hatte. Der oberste Mundschenk ließ Josef im Gefängnis zurück, nachdem Josef ihm mitgeteilt hatte, was geschehen würde. Er erinnerte sich nicht daran, dem Pharao mitzuteilen, was Josef ihm gesagt hatte, denn er vergaß es.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: der oberste Mundschenk
  rationale: Die Wendung bezeichnet den ranghöchsten Mundschenk; „oberster Mundschenk“ ist im Deutschen verständlich und bewahrt die ausdrücklich genannte Rangbezeichnung.
- source_word: ግብሩ
  choice: sein Amt
  rationale: Wörtlich bezeichnet das Wort seine Arbeit beziehungsweise seinen Dienst. Im Zusammenhang mit der Wiedereinsetzung durch den Pharao gibt „Amt“ die Funktion natürlich wieder.
- source_word: ሐባዚስ
  choice: der Bäcker
  rationale: Der Ausgangstext nennt hier nur den Bäcker und verwendet anders als beim Mundschenk keine Rangbezeichnung; „oberster Bäcker“ würde den Text mit Genesis harmonisieren.
- source_word: ወረሰዮ
  choice: ließ Josef … zurück
  rationale: Das Verb bedeutet hier „ließ ihn“ beziehungsweise „ließ ihn zurück“, nicht „vergaß ihn“. Das eigentliche Verb für „vergessen“ steht erst am Versende.
- source_word: አይድዖ
  choice: Josef ihm mitgeteilt hatte
  rationale: Die Kausativform drückt aus, dass Josef den Mundschenk wissen ließ beziehungsweise informierte, was geschehen würde.
- source_word: ቀተሎ
  choice: ließ er töten
  rationale: Die Form besagt, dass der Pharao den Bäcker tötete. Die deutsche Wendung beschreibt eine königliche Hinrichtung natürlich, ohne den nicht vorhandenen Titel „oberster Bäcker“ einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die erste Nennung des Deuters bleibt entsprechend dem ge’ezischen Pronomen zunächst unausgesprochen; Josef wird erst am Ende des ersten Satzes ausdrücklich genannt. Die Wiederholung von Nicht-Erinnern und Vergessen bleibt erhalten, da sie im Ausgangstext steht.
