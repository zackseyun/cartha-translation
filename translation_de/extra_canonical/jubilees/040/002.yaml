base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: de
  text: Und in jenen Tagen träumte der Pharao in einer einzigen Nacht zwei Träume über die Hungersnot, die über die ganze Erde kommen sollte. Er erwachte aus seinem Schlaf und ließ alle Traumdeuter in Ägypten und die Wahrsager rufen. Er erzählte ihnen seine beiden Träume, doch sie vermochten sie nicht zu verstehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: in jenen Tagen
  rationale: Gibt die geläufige zeitliche Wendung natürlich und würdig wieder.
- source_word: ሕለመ፡ ክልኤተ፡ በአሐቲ፡ ሌሊት
  choice: hatte ... in einer einzigen Nacht zwei Träume
  rationale: Bewahrt sowohl die Zahl der Träume als auch ihre zeitliche Einheit; das deutsche Präteritum beschreibt das Traumgeschehen idiomatisch.
- source_word: ነገረ፡ ረኃብ
  choice: über die Hungersnot
  rationale: Gibt den Gegenstand der Träume knapp wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: ዲበ፡ ኵሉ፡ ምድር
  choice: über das ganze Land
  rationale: Das äthiopische Wort für Erde/Land lässt beides zu; im ägyptischen Erzählzusammenhang ist „das ganze Land“ natürlich, ohne zwingend eine globale Bedeutung festzulegen.
- source_word: መፈክራነ፡ ሕልም
  choice: Traumdeuter
  rationale: Bezeichnet Personen, die Träume auslegen, in verständlichem modernem Deutsch.
- source_word: ረቅይተ
  choice: Wahrsager
  rationale: Bewahrt die eigenständige Gruppe divinatorischer Fachleute neben den Traumdeutern.
- source_word: ወአክሀሉ፡ አእምሮ
  choice: doch sie vermochten sie nicht zu verstehen
  rationale: Folgt der Quellenformulierung des fehlenden Verstehens und vermeidet die interpretierende Erweiterung „ihre Bedeutung kundzutun“.
theological_decisions:
- issue: Reichweite der angekündigten Hungersnot
  choice: über das ganze Land
  alternative: über die ganze Erde
  rationale: „Land“ und „Erde“ sind lexikalisch möglich. Die gewählte Form wahrt im Erzählzusammenhang die regionale Lesart, ohne die umfassende Formulierung „das ganze“ abzuschwächen.
- issue: Art des Versagens der ägyptischen Fachleute
  choice: sie vermochten sie nicht zu verstehen
  alternative: sie konnten ihre Bedeutung nicht kundtun
  rationale: Die Quelle spricht unmittelbar vom Nichtverstehen; daher wird weder bloßes Schweigen noch eine nur kommunikative Unfähigkeit unterstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. „Der Pharao“ ist im Deutschen idiomatisch; „vermochten“ verleiht dem abschließenden Gegensatz einen leicht gehobenen, aber allgemein verständlichen biblischen Ton.
