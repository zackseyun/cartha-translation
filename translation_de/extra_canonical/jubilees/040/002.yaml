revisions:
- from: Und in jenen Tagen hatte der Pharao in einer einzigen Nacht zwei Träume über die Hungersnot, die über das ganze Land kommen sollte. Er erwachte aus seinem Schlaf und ließ alle Traumdeuter in Ägypten und die Wahrsager rufen. Er erzählte ihnen seine beiden Träume, doch sie vermochten sie nicht zu verstehen.
  to: Und in jenen Tagen träumte der Pharao in einer einzigen Nacht zwei Träume über die Hungersnot, die über die ganze Erde kommen sollte. Er erwachte aus seinem Schlaf und ließ alle Traumdeuter in Ägypten und die Wahrsager rufen. Er erzählte ihnen seine beiden Träume, doch sie vermochten sie nicht zu verstehen.
  rationale: Die Reichweite der Hungersnot wird entsprechend der umfassenden ge'ezischen Formulierung mit „die ganze Erde“ wiedergegeben. Außerdem wird das Traumgeschehen mit dem direkten Verb „träumte“ formuliert. Im Übrigen bleibt die Übersetzung unverändert, einschließlich der nicht weiter spezifizierten Aussage, dass die Fachleute die Träume nicht verstanden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:03Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe ist im Wesentlichen quellentreu. Die Einschränkung von ዲበ፡ ኵሉ፡ ምድር („über alle Erde/das ganze Land“) auf „das ganze Land“ ist jedoch gegenüber der umfassenden Formulierung des ge'ezischen Textes nicht gerechtfertigt; auch die englische Audit-Fassung gibt „all the earth“ wieder. „die ganze Erde“ wahrt den Wortlaut, ohne die geographische Reichweite dogmatisch festzulegen.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch. „träumte ... zwei Träume“ ist gegenüber „hatte ... zwei Träume“ die direktere und idiomatischere Wiedergabe des Verbs.
  terminology: „Pharao“, „Traumdeuter“ und „Wahrsager“ sind treffend. Die abschließende Aussage „sie vermochten sie nicht zu verstehen“ bewahrt die ausdrückliche Formulierung des Nichtverstehens, statt sie zu einer bloßen Unfähigkeit der Auskunft zu erweitern.
  issues:
  - severity: medium
    issue: „über das ganze Land“ statt „über die ganze Erde“
    rationale: Die Quelle formuliert „über alle Erde“; die regionale Eingrenzung auf ein Land schwächt die umfassende Ausdrucksweise ohne textlichen Anlass ab.
  - severity: low
    issue: „hatte ... zwei Träume“
    rationale: Die Konstruktion ist verständlich, aber „träumte ... zwei Träume“ bildet das quellenständige Traumverb unmittelbarer und natürlicher ab.
  revised_text: Und in jenen Tagen träumte der Pharao in einer einzigen Nacht zwei Träume über die Hungersnot, die über die ganze Erde kommen sollte. Er erwachte aus seinem Schlaf und ließ alle Traumdeuter in Ägypten und die Wahrsager rufen. Er erzählte ihnen seine beiden Träume, doch sie vermochten sie nicht zu verstehen.
