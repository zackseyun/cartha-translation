base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: de
  text: Und das Land Ägypten gedieh vor dem Pharao um Josefs willen; denn der Herr war mit ihm und schenkte ihm Gunst und Erbarmen bei allen Menschen seiner Generation[a], vor den Augen aller, die ihn kannten, und aller, die von ihm hörten. Und das Reich des Pharaos war wohlgeordnet, und es gab keinen Widersacher und kein Unheil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei seiner ganzen Verwandtschaft«.'
    reason: ዘመድ kann je nach Kontext sowohl die Generation bzw. Zeitgenossen als auch die Verwandtschaft bezeichnen.
lexical_decisions:
- source_word: ትሠናአወት
  choice: gedieh
  rationale: Das Verb bezeichnet hier ein Wohlergehen bzw. Gedeihen; dies passt zum durch Josef bewirkten Zustand Ägyptens besser als eine bloße Aussage über Frieden.
- source_word: በእንተ፡ ዮሴፍ
  choice: um Josefs willen
  rationale: Gibt den kausalen Sinn der Wendung würdig und idiomatisch wieder.
- source_word: ሞገሰ፡ ወምሕረተ
  choice: Gunst und Erbarmen
  rationale: Bewahrt die zwei unterschiedlichen Begriffe und ihre theologische sowie zwischenmenschliche Bedeutungsweite.
- source_word: ላዕለ፡ ኵሎሙ፡ ዘመዱ
  choice: bei allen Menschen seiner Generation
  rationale: ላዕለ kann eine auf Personen bezogene Gunstbeziehung ausdrücken; ዘመድ wird im Kontext als Generation bzw. Zeitgenossenschaft verstanden. Die Ergänzung „Menschen“ schafft im Deutschen Klarheit.
- source_word: በቅድመ፡ ኵሎሙ፡ እለ፡ ይእምርዎ
  choice: vor den Augen aller, die ihn kannten
  rationale: Gibt die räumlich-soziale Formel በቅድመ natürlich und präzise wieder.
- source_word: ወረጐዐት፡ መንግሥተ፡ ፈርዖን
  choice: das Reich des Pharaos war wohlgeordnet
  rationale: Drückt den stabilen, geordneten Zustand des Reiches aus, ohne den Begriff unnötig auf Frieden zu verengen.
- source_word: ሰይጣነ፡ ... እኩየ
  choice: Widersacher und ... Unheil
  rationale: Der erste Ausdruck wird als gewöhnlicher Widersacher verstanden, der zweite abstrakt als Unheil; dadurch wird keine nicht zwingend vorliegende personale dämonologische Deutung importiert.
theological_decisions:
- issue: Bedeutung von ሰይጣነ am Versende
  choice: Widersacher
  alternative: Satan
  rationale: Im Zusammenhang mit der geordneten Herrschaft bezeichnet das Wort plausibel einen Gegner oder Widersacher. Die Wiedergabe „Satan“ würde die Aussage ohne ausreichenden Kontext personal-dämonologisch festlegen.
- issue: Bedeutung von እኩየ
  choice: Unheil
  alternative: Böser / böser Mensch
  rationale: Die Form lässt sich sachlich auf Böses oder Unheil beziehen. Die abstrakte Wiedergabe bewahrt den Parallelismus, ohne eine Person zu ergänzen.
- issue: Reichweite von Josefs Gunst und Erbarmen
  choice: bei allen Menschen seiner Generation
  alternative: über seiner ganzen Verwandtschaft
  rationale: Der Kontext verweist eher auf Josefs Zeitgenossen in Ägypten als ausschließlich auf seine Sippe; die textliche Mehrdeutigkeit von ዘመድ wird jedoch in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formaler Satzführung. „Pharao“ erhält entsprechend der Vorlage den bestimmten Artikel. Die Wiederholung „aller ... und aller ...“ bewahrt den rhetorischen Aufbau des Ausgangstextes.
