  source_fidelity: Die Übersetzung gibt den kausalen Bezug auf Josef, Gottes Gegenwart bei ihm, die Gunst und das Erbarmen sowie die umfassende öffentliche Anerkennung sachgerecht wieder. „bei allen Menschen seiner Generation“ ist eine idiomatische kontextuelle Wiedergabe der mit ላዕለ verbundenen Reichweite; die mögliche Lesart von ዘመድ als „Verwandtschaft“ wird angemessen in der Fußnote kenntlich gemacht. Die abschließende Verbindung von fehlendem Widersacher und fehlendem Unheil wahrt die nicht eindeutig personale Bedeutung von ሰይጣነ und እኩየ.
