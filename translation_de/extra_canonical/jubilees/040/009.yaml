  text: ወትሠናአወት፡ ምድረ፡ ግብጽ፡ በቅድሜሁ፡ ለፈርዖን፡ በእንተ፡ ዮሴፍ፡ እስመ፡ እግዚአብሔር፡ ምስሌሁ፡ ወወሀቦ፡ ሞገሰ፡ ወምሕረተ፡ ላዕለ፡ ኵሎሙ፡ ዘመዱ፡ በቅድመ፡ ኵሎሙ፡ እለ፡ ይእምርዎ፡ ወለእለ፡ ይሰምዑ፡ ስምዐ፡ ምስሌሁ፡ ወረጐዐት፡ መንግሥተ፡ ፈርዖን፡ ወአልቦ፡ ሰይጣነ፡ ወአልቦ፡ እኩየ።
