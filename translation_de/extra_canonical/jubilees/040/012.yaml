  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: de
  text: 'Und in jenem Jahr starb Isaak. Und es geschah so, wie Josef es bei der Deutung seiner beiden Träume vorausgesagt hatte, so wie er es ihm gesagt hatte: Im ganzen Land Ägypten herrschten sieben Jahre des Überflusses, und das Land Ägypten brachte überaus reichen Ertrag hervor: Ein Maß ergab eintausendachthundert Maß.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: starb
  rationale: Direkte und natürliche Wiedergabe des geezischen Verbs „sterben“.
- source_word: ፍካሬ
  choice: Deutung
  rationale: Bezeichnet hier die Auslegung beziehungsweise Erklärung der Träume; „Deutung“ ist im Deutschen idiomatisch.
- source_word: ሰብዐቱ፡ ክረምት፡ ዘጽጋብ
  choice: sieben Jahre des Überflusses
  rationale: Gibt die zeitliche Periode und den Gedanken von Fülle beziehungsweise Sättigung würdig und verständlich wieder.
- source_word: ፈርየት ... ብዙኀ
  choice: brachte überaus reichen Ertrag hervor
  rationale: Erfasst das starke Fruchtbringen des Landes in natürlichem modernem Deutsch.
- source_word: አሐቲ፡ መስፈርት፡ ዐሠርተ፡ ወሰመትነ፡ ምእተ፡ መስፈረ
  choice: Ein Maß ergab eintausendachthundert Maß
  rationale: Bewahrt die im Text ausdrücklich genannte außergewöhnliche Ertragsrelation.
theological_decisions:
- issue: Bezug der männlichen Pronomina in der Traumdeutung
  choice: „wie Josef es ... vorausgesagt hatte, so wie er es ihm gesagt hatte“
  alternative: Den Adressaten ausdrücklich als Pharao benennen
  rationale: Der Ausgangstext nennt den Adressaten an dieser Stelle nicht ausdrücklich. Die Pronomen bewahren den vorhandenen Bezug, ohne eine Identifikation in den Text einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem erzählerischem Register. Die Wiederholung „so, wie ... so wie“ bleibt erhalten, weil sie der emphatischen Struktur des Ausgangstextes entspricht. Keine erläuternden Zusätze oder konfessionellen Festlegungen.
