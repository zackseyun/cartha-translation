  yaml_path: translation/extra_canonical/jubilees/040/004.yaml
  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: de
  text: 'Und er sagte vor dem Pharao, dass seine beiden Träume eins seien, und sagte zu ihm: »Sieben Jahre des Überflusses werden über das ganze Land Ägypten kommen und danach[a] sieben Jahre des Hungers, wie es ihn auf der ganzen Erde noch nicht gegeben hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach diesem«.'
    reason: Die Geʿez-Form enthält ein singularisches Demonstrativ; »danach« ist im Deutschen idiomatisch, während die Fußnote die Form des Ausgangstextes erkennen lässt.
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: seine beiden Träume ein und derselbe seien
  rationale: Gibt die Aussage wieder, dass die zwei Träume in ihrer Bedeutung eine Einheit bilden; die deutsche Wendung ist natürlich und bewahrt den prädikativen Singular des Ge’ez.
- source_word: ጽጋብ
  choice: Überfluss
  rationale: Bezeichnet hier die vorausgesagte Fülle beziehungsweise den landwirtschaftlichen Überfluss und passt zum anschließenden Gegensatz »Hunger«.
- source_word: ወእምድኅረዝ
  choice: und danach
  rationale: Das Demonstrativ verweist wörtlich auf »dies«; idiomatisches Deutsch gibt den zeitlichen Anschluss am besten mit »danach« wieder.
- source_word: ረኃብ፡ ዘአኮ፡ ከማሁ፡ ረኃብ
  choice: Hunger, wie es ihn … noch nicht gegeben hat
  rationale: Bewahrt den emphatischen Vergleich mit einem bisher beispiellosen Hunger und formuliert ihn in natürlichem Deutsch.
- source_word: ውስተ፡ ኵሉ፡ ምድር
  choice: auf der ganzen Erde
  rationale: Der Ausdruck steht hier ohne die nähere Bestimmung »Ägypten« und bezeichnet daher die ganze Erde beziehungsweise das ganze Land; »Erde« erhält den weiteren Sinn.
