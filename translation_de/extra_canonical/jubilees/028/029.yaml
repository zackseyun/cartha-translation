  text: Leah conceived and bore him a third son, and he called his name Levi, on the first day of the first month.
translation:
  language: de
  text: Lea wurde schwanger und gebar ihm einen dritten Sohn. Er gab ihm den Namen Levi, am ersten Tag des Monats.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: beim Neumond des Monats.'
    reason: Das geezische በሠርቅ ወርኅ kann den Monatsanfang als ersten Tag oder als Neumond bezeichnen.
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡ ሣልሰ፡
  choice: wurde schwanger und gebar ihm einen dritten Sohn
  rationale: Die femininen Verbformen beziehen sich auf Lea; »ihm« gibt das geezische indirekte Objekt ሎቱ wieder. Die natürliche deutsche Wortfolge bewahrt den Inhalt ohne den wiederholten Satzanschluss mit »und«.
- source_word: ወጸውዐ፡ ስሞ፡ ሌዊ፡
  choice: Er gab ihm den Namen Levi
  rationale: ጸውዐ ist hier 3. Person Singular Maskulinum und verweist auf Jakob. Die deutsche Wendung »den Namen geben« entspricht idiomatisch dem geezischen »seinen Namen nennen«.
- source_word: በሠርቅ፡ ወርኅ፡
  choice: am ersten Tag des Monats
  rationale: ሠርቅ ወርኅ bezeichnet den Monatsbeginn beziehungsweise Neumond. Die Wiedergabe vermeidet die unbegründete Doppelübersetzung »bei Tagesanbruch, am ersten Tag«.
theological_decisions:
- issue: Subjekt der Namensgebung
  choice: Er gab ihm den Namen Levi
  alternative: Sie gab ihm den Namen Levi
  rationale: Obwohl Lea das Subjekt der vorausgehenden femininen Verben ist, steht das Verb der Namensgebung im Maskulinum. Diese grammatische Spannung wird nicht zugunsten des näheren femininen Subjekts eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang wird ohne ein im Deutschen störendes einleitendes »und« formuliert; die kurzen Hauptsätze bewahren den erzählerischen Stil. Die Handschriftenform »Lea« entspricht der üblichen deutschen biblischen Namensform.
