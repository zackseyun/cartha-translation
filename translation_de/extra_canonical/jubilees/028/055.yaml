translation:
  language: de
  text: Jedes gesprenkelte[a], gefleckte und weiße Tier, das unter den Ziegen geboren wurde, würde sein Lohn sein. Und sie brachten Junge zur Welt
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aschfarben; möglicherweise auch: dunkel.'
    reason: Die genaue Farbschattierung von ሐመደ ist unsicher; die wahrscheinliche Ableitung vom Wort für „Asche“ lässt mehrere sachnahe Wiedergaben zu.
lexical_decisions:
- source_word: እምአጣሊ (ʾəm-ʾaṭāli)
  choice: unter den Ziegen
  rationale: አጣሊ bezeichnet Ziegen; die Präposition wird im Zusammenhang mit der Geburt idiomatisch als „unter“ wiedergegeben.
- source_word: ሐመደ (ḥamada)
  choice: sprenkelig
  rationale: Das vom Wortfeld „Asche“ her verstandene Farbadjektiv bezeichnet hier wahrscheinlich eine aschfarben gesprenkelte Zeichnung; „sprenkelig“ unterscheidet es zugleich vom folgenden „gefleckt“.
- source_word: ጋሰ (gāsa)
  choice: gefleckt
  rationale: Gibt die Tierzeichnung knapp und natürlich wieder.
- source_word: ጸዐዳ (ṣaʿdā)
  choice: weiß
  rationale: Direkte Wiedergabe der Farbbezeichnung.
- source_word: ዐስቦ (ʿasbo)
  choice: sein Lohn
  rationale: Bewahrt die konkrete Vorstellung der Tiere als vereinbartem Arbeitslohn.
- source_word: ወይወልዱ (wa-yəwallədu)
  choice: Und sie brachten Junge zur Welt
  rationale: Natürliche moderne Wiedergabe des Gebärens bei Tieren; die unvollständige Weiterführung des Versfragments bleibt erhalten.
