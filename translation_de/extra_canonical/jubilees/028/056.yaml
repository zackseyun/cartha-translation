lexical_decisions:
- source_word: ጋሴ
  choice: gesprenkelt
  rationale: Gibt die besondere Fellzeichnung natürlich und unterscheidbar von den anschließend genannten Flecken wieder.
- source_word: ትእምርተ፡ ኵስኵሰ
  choice: eine Fleckenzeichnung hatten
  rationale: Bewahrt den Gedanken eines kennzeichnenden Fleckenmusters, ohne ihn mit den danach genannten dunklen Flecken gleichzusetzen.
- source_word: ሐመደ፡ ኵስኵሰ
  choice: dunkle Flecken hatten
  rationale: Gibt die zusätzliche Farbbestimmung der Flecken klar und idiomatisch wieder.
- source_word: ወይደግማ
  choice: und sie pflanzten sich wieder fort
  rationale: Das Verb bezeichnet wörtlich ein Wiederholen; im Zusammenhang mit den Schafen und ihrer Zucht wird die gemeinte Wiederholung als Fortpflanzung verständlich ausgedrückt.
