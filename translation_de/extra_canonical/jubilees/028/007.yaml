  text: she was Leah. And Jacob was angry with Laban and said to him, “Why have you done this to me? Did I not
translation:
  language: de
  text: 'Doch es war Lea. Da wurde Jakob zornig auf Laban und sagte zu ihm: »Warum hast du mir das angetan? Habe ich nicht[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz wird im nächsten Vers fortgesetzt.
    reason: Die äthiopische Vorlage enthält am Versende አኩ („Habe ich nicht?“); die Versgrenze trennt die Frage von ihrer Fortsetzung.
lexical_decisions:
- source_word: ይእቲሰ፡ ልያ፡
  choice: Doch es war Lea.
  rationale: Das enklitische ሰ setzt einen Gegensatz beziehungsweise eine nachdrückliche Wendung; „doch“ gibt dies in natürlichem Deutsch wieder.
- source_word: ወተምዐ፡ ያዕቆብ፡ ላዕለ፡ ላባ፡
  choice: Da wurde Jakob zornig auf Laban
  rationale: ተምዐ bezeichnet Zorn; ላዕለ mit Personenbezug wird idiomatisch als „auf“ wiedergegeben.
- source_word: ለምንት፡ ገበርከኒ፡ ከመዝ፡
  choice: Warum hast du mir das angetan?
  rationale: Wörtlich etwa „Warum hast du mich/mit mir so behandelt?“; die gewählte Form ist gegenwärtiges, klares Deutsch und bewahrt den Vorwurf.
- source_word: አኩ፡
  choice: Habe ich nicht
  rationale: Die negative Frage eröffnet einen Satz, der erst im folgenden Vers fortgeführt wird. Sie darf trotz der ungewöhnlichen Versgrenze nicht ausgelassen werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abrupte, im Ausgangstext angelegte Versgrenze wird beibehalten und durch eine knappe Fußnote erläutert.
