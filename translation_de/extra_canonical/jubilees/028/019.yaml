  text: Und ich werde dir auch Rahel geben, wenn du mir weitere sieben Jahre dienst und meine Schafe weidest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእሁበከ
  choice: Und ich werde dir … geben
  rationale: Gibt die koordinierende Konjunktion, den Sprecherbezug sowie das futurische Versprechen unmittelbar wieder.
- source_word: ራሔልሃ
  choice: auch Rahel
  rationale: Der Name wird in der gebräuchlichen deutschen Form »Rahel« wiedergegeben; das Element mit der Bedeutung »auch/ebenfalls« wird natürlich vorangestellt.
- source_word: ትትቀነይ፡ ሊተ
  choice: du mir … dienst
  rationale: Bewahrt das persönliche Dienstverhältnis und die Satzstruktur der Bedingung.
- source_word: ካልአነ፡ ዓመተ፡ ሰብዐተ
  choice: weitere sieben Jahre
  rationale: Drückt idiomatisch aus, dass zu den bereits geleisteten Jahren nochmals sieben hinzukommen.
- source_word: ትርዐይ፡ አባግዐየ
  choice: meine Schafe weidest
  rationale: Gibt das konkrete Hüten beziehungsweise Weiden der Schafe prägnant und quellennah wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Tätigkeiten des Dienens und Schafeweidens sind mit »und« koordiniert, ohne ein bloß zeitliches Verhältnis durch »während« einzutragen.
