lexical_decisions:
- source_word: ኢያእመረ
  choice: wusste es nicht
  rationale: Gibt die Verneinung des Verbs „wissen/erkennen“ natürlich wieder; das Objekt bleibt wie im Kontext implizit.
- source_word: አምሳለ
  choice: meinte
  rationale: Drückt hier die irrige Annahme Jakobs in natürlichem Deutsch aus.
- source_word: ቦአ፡ ኀቤሃ
  choice: ging zu ihr hinein
  rationale: Bewahrt den verhüllenden biblischen Ausdruck für das Eingehen zu einer Frau, ohne die Bedeutung unnötig auszudeuten.
- source_word: ወናሁ
  choice: und siehe
  rationale: Erhält das narrative Aufmerksamkeitssignal und den bewusst offenen Übergang zum folgenden Vers.
theological_decisions:
- issue: Art und Gegenstand von Jakobs Nichtwissen
  choice: „wusste es nicht“ mit implizitem Objekt
  alternative: „erkannte sie nicht“ oder „wusste nicht, dass es Lea war“
  rationale: Der Ausgangstext benennt den Gegenstand nicht ausdrücklich. Die gewählte Fassung vermeidet sowohl eine mögliche Sinnverschiebung bei „erkannte“ als auch die Einfügung von „Lea“.
- issue: Euphemismus für den Geschlechtsverkehr
  choice: „ging zu ihr hinein“
  alternative: „schlief mit ihr“
  rationale: Die bildhafte und zurückhaltende Ausdrucksweise des Ausgangstextes bleibt erhalten, ohne die Aussage konfessionell oder interpretierend zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem Erzählton. Die Satzstellung mit „aber“ und das abschließende „und siehe“ bewahren den Rhythmus sowie den im Ausgangstext offenen Anschluss.
