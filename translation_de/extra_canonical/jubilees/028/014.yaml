- source_word: ወበእሲ፡ ዘይገብር፡ ከመዝ፡
  choice: Und der Mann, der so handelt,
  rationale: Die offene Satzfügung und das abschließende Komma bleiben erhalten, weil der Gedanke im folgenden Vers weitergeführt wird.
