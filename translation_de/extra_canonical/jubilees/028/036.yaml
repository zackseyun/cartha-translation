  text: my maidservant; and she will conceive and bear me a son.” And she gave Bilhah her maidservant to be his wife.
translation:
  language: de
  text: »… meine Dienerin; sie wird schwanger werden und mir einen Sohn gebären.« Und sie gab ihm ihre Dienerin Bilha zur Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመትየ
  choice: meine Dienerin
  rationale: Das Substantiv bezeichnet eine weibliche Hausdienerin beziehungsweise Magd; „Dienerin“ ist im heutigen Standarddeutsch natürlich und wahrt das damalige Abhängigkeitsverhältnis.
- source_word: ወትፀንስ
  choice: sie wird schwanger werden
  rationale: Die Form bezeichnet das Empfangen beziehungsweise Schwangerwerden. Im Ge’ez steht hier keine Aufforderung an Jakob, zu ihr einzugehen.
- source_word: ወትወልድ፡ ሊተ፡ ወልደ
  choice: und mir einen Sohn gebären
  rationale: Gibt die verbale Folge und die Dativbeziehung „mir“ direkt und idiomatisch wieder.
- source_word: ወወሀበት፡ ባላሃ፡ አመታ
  choice: Und sie gab ihm ihre Dienerin Bilha
  rationale: Bewahrt die Erzählfolge sowie Bilhas Stellung als Dienerin; der Eigenname wird in der im Deutschen gebräuchlichen Form „Bilha“ wiedergegeben.
- source_word: ትኩኖ፡ ብእሲተ
  choice: zur Frau
  rationale: Die wörtliche Zielangabe „damit sie [ihm] Frau sei“ wird in natürlichem Deutsch mit „zur Frau“ ausgedrückt.
theological_decisions:
- issue: Mögliche Harmonisierung mit Genesis 30,3
  choice: Keine Ergänzung von „geh zu ihr ein“
  alternative: „meine Dienerin; geh zu ihr ein, und sie wird schwanger werden“
  rationale: Die Aufforderung steht nicht im vorgelegten Ge’ez-Text. Eine Ergänzung aus der Genesis-Parallele würde den Quelltext erweitern und seine konkrete Überlieferungsform verdecken.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die einleitende Auslassungsmarke zeigt, dass der bereitgestellte Vers mit einem Satzfragment aus dem vorausgehenden Zusammenhang beginnt; es wurde kein nicht belegter Inhalt ergänzt.
