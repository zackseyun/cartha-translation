  text: ein Haus für mich, denn ich habe die Jahre vollendet, die ich dir für deine beiden Töchter gedient habe, und ich werde fortgehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: ein Haus für mich
  rationale: Die überlieferte äthiopische Wortfolge bezeichnet wörtlich ein Haus für den Sprecher. Sie darf nicht aufgrund der Parallele in Genesis zu „Gib mir meine Frau“ geändert werden.
- source_word: ፈጸምኩ፡ ዓመታተ፡
  choice: ich habe die Jahre vollendet
  rationale: Gibt das Verb des Vollendens und sein Objekt eng und zugleich idiomatisch wieder.
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: die ich dir … gedient habe
  rationale: Bewahrt den Relativsatz und die Bedeutung eines für jemanden geleisteten Dienstes.
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: für deine beiden Töchter
  rationale: Natürliche deutsche Wiedergabe der Gegenleistung beziehungsweise des Anlasses des Dienstes.
- source_word: ወአሐውር፡
  choice: und ich werde fortgehen
  rationale: Das futurische Fortgehen wird ausdrücklich wiedergegeben; „fortgehen“ passt im Zusammenhang besser als das bloße „gehen“.
theological_decisions:
- issue: Abweichung von der Genesis-Parallele
  choice: Den ge'ezischen Wortlaut „ein Haus für mich“ beibehalten
  alternative: „Gib mir meine Frau“ nach Genesis 29,21
  rationale: Die Übersetzung folgt der vorgelegten Originalsprachengrundlage. Eine Harmonisierung mit Genesis würde den tatsächlich bezeugten Wortlaut ersetzen und die textliche Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit relativ enger Bindung an Satzbau und Aussage des ge'ezischen Textes. Das Fragment beginnt bewusst kleingeschrieben, da der Vers offenbar einen im vorherigen Kontext begonnenen Satz fortsetzt.
