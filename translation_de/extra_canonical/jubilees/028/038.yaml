  text: 'The sixth: in the sixth year of the third week, Jacob again went in to Bilhah, and she conceived.'
translation:
  language: de
  text: 'Der Sechste[a]: Im sechsten Jahr der dritten Jahrwoche ging Jakob wieder zu Bilha, und sie wurde schwanger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier nur „Der Sechste“; wahrscheinlich ist der sechste Sohn in der Abfolge der Geburten gemeint.
    reason: Die isolierte Ordnungszahl des Quelltextes ist elliptisch und wurde in einer früheren Fassung ausgelassen.
lexical_decisions:
- source_word: ሳድስ
  choice: Der Sechste
  rationale: Bewahrt die vorangestellte Ordnungszahl des ge’ezischen Textes und ihre elliptische Form; im Zusammenhang bezeichnet sie wahrscheinlich den sechsten Sohn der Geburtsfolge.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Gibt die aus sieben Jahren bestehende Zeiteinheit knapp und im Deutschen verständlich wieder.
- source_word: ደገመ … ካዕበ
  choice: wieder
  rationale: Beide Ausdrücke markieren eine Wiederholung. Das deutsche „wieder“ gibt den Sinn natürlich wieder, ohne die Aussage durch „zum zweiten Mal“ unnötig zu verengen.
- source_word: ቦአ ኀበ ባላ
  choice: ging … zu Bilha
  rationale: Bewahrt die verhüllende Ausdrucksweise für den Geschlechtsverkehr und klingt zugleich natürlich und würdig.
- source_word: ፀንሰት
  choice: sie wurde schwanger
  rationale: Natürliche moderne Wiedergabe des Verbs „empfangen/schwanger werden“.
theological_decisions:
- issue: Bezug der vorangestellten Ordnungszahl
  choice: Die Ellipse „Der Sechste“ bleibt im Haupttext erhalten.
  alternative: „Der sechste Sohn“ oder Weglassung der Ordnungszahl
  rationale: Der Quelltext nennt ausdrücklich „der Sechste“, aber kein Bezugswort. Die wahrscheinliche Beziehung auf den sechsten Sohn wird daher nur in der Fußnote erläutert und nicht in den Text hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sexuelle Wendung bleibt entsprechend dem Quelltext dezent; die chronologische Fachbezeichnung „Jahrwoche“ wird beibehalten.
