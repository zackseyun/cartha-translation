lexical_decisions:
- source_word: አባግዒሁ
  choice: seine Schafe
  rationale: Das geezische Wort bezeichnet Schafe bzw. Kleinvieh; der possessive Anschluss wird mit „seine“ wiedergegeben. Das Fragment setzt offenbar einen vorhergehenden Satz fort.
- source_word: ወጸውዖን
  choice: Und … rief
  rationale: Das Verb bedeutet „rufen/herbeirufen“; das angehängte feminine Pluralobjekt wird durch die folgenden Namen Lea und Rahel konkretisiert.
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: und sprach ihnen zu Herzen
  rationale: Die wörtliche Wendung „in/zu ihrem Herzen sprechen“ wird als verständliche, zugleich bildhafte deutsche Formulierung bewahrt.
- source_word: ከመ፡ ይምጽኣ፡ ምስ
  choice: dass sie mitkommen sollten
  rationale: Die Konstruktion drückt das beabsichtigte Kommen der beiden Frauen mit Jakob aus; „mitkommen“ gibt das abschließende ምስ idiomatisch wieder, wobei der überlieferte Ausschnitt syntaktisch abbricht.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Der Text beginnt als Satzfragment; deshalb wird „seine Schafe“ kleingeschrieben und mit einem Punkt vom folgenden Satz getrennt. Die Namensreihenfolge Lea und Rahel folgt dem geezischen Text.
