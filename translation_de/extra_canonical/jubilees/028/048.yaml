  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: de
  text: Und eine Tochter wurde geboren, die Dina hieß, im siebten Monat, im siebten Jahr der sechsten Jahrwoche des vierten Jubiläums. Und er erbarmte sich ihrer,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለወለት፡ ዲና፡ ስማ
  choice: Und eine Tochter wurde geboren, die Dina hieß
  rationale: Die Wendung bezeichnet die Geburt und nennt ausdrücklich ihren Namen; die deutsche Formulierung gibt beides natürlich wieder, ohne ein im Text nicht vorhandenes „ihm“ einzufügen.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Im chronologischen System des Jubiläenbuches bezeichnet das Wort eine Siebenerperiode von Jahren; „Jahrwoche“ ist dafür präzise und verständlich.
- source_word: ወተሣሀላ
  choice: Und er erbarmte sich ihrer
  rationale: Die Form hat ein maskulines Subjekt und ein feminines Objekt; die gehobene, aber geläufige Wendung bildet beides ab, ohne den unausgesprochenen Handelnden ausdrücklich als Gott zu benennen.
theological_decisions:
- issue: Unausgesprochenes Subjekt des abschließenden Verbs
  choice: er
  alternative: Gott / der Herr
  rationale: Die Verbform zeigt ein maskulines Subjekt, doch in diesem Vers steht kein ausdrücklicher Gottesname. Das Pronomen bewahrt den grammatischen Befund und vermeidet eine erklärende Ergänzung im Haupttext.
- issue: Bezug des femininen Objektsuffixes
  choice: ihrer
  alternative: Rahels
  rationale: Das Suffix ist feminin singular, nennt die Bezugsfigur aber nicht ausdrücklich. Das Pronomen erhält den fortlaufenden Bezug und greift der Fortsetzung nicht interpretierend vor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte chronologische Fachbezeichnung „Jahrwoche“ bleibt erhalten. Das Satzende mit Komma spiegelt wider, dass der Gedanke im folgenden Vers weitergeführt wird.
