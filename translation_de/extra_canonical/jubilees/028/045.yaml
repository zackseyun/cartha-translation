- source_word: ወጸውዐት፡ ስሞ፡
  choice: sie nannte ihn
  rationale: Entspricht idiomatisch der wörtlichen Wendung „sie rief seinen Namen“ und vermeidet im Deutschen unnötige Schwerfälligkeit.
- source_word: በራብዑ፡
  choice: am vierten Tag
  rationale: Gibt die Zeitangabe formal wieder, ohne ihren im isolierten Vers nicht ausdrücklich genannten Bezug zu ergänzen.
