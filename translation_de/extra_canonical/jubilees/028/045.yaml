- source_word: ቦአ፡ … ኀበ፡
  choice: ging zu … hinein
  rationale: Die Wendung bezeichnet hier in zurückhaltender biblischer Sprache das Eingehen zu einer Frau; die Formulierung wahrt den Sinn und den würdevollen Ton des Ausgangstextes.
- source_word: ወፀንሰት፡
  choice: Sie wurde schwanger
