  text: and she bore him a fourth son, and he called his name Judah, on the fifteenth day of the third month,
translation:
  language: de
  text: Und sie gebar ihm einen vierten Sohn, und er nannte ihn Juda[a] am fünfzehnten Tag des dritten Monats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie nannte ihn Juda“.'
    reason: Der vorgelegte ge’ezische Grundtext hat bei der Namengebung eine maskuline Verbform; die Fußnote hält die feminine alternative Lesart offen.
lexical_decisions:
- source_word: ወጸውዐ፡ ስሞ፡
  choice: und er gab ihm den Namen
  rationale: Die maskuline Verbform ጸውዐ bezeichnet hier einen männlichen Namengeber; die natürliche deutsche Wendung gibt die ge’ezische Konstruktion „seinen Namen nennen“ idiomatisch wieder.
- source_word: ይሁዳ፡
  choice: Juda
  rationale: Eingebürgerte deutsche Namensform.
- source_word: በዐሡሩ፡ ወኀሙሱ፡ ለወርኅ፡ ሣልስ፡
  choice: am fünfzehnten Tag des dritten Monats
  rationale: Formgetreue und im Deutschen natürliche Wiedergabe der Datumsangabe.
theological_decisions:
- issue: Geschlecht der Person, die Juda den Namen gibt
  choice: er gab ihm den Namen
  alternative: sie gab ihm den Namen
  rationale: Der vorgelegte ge’ezische Text hat ጸውዐ, die 3. Person Singular Maskulinum. Die abweichende feminine Lesart, die mit Genesis 29,35 übereinstimmt, wird wegen der Textüberlieferung in einer Fußnote genannt, aber nicht in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Subjektnennung bewahrt den im Grundtext auffälligen Wechsel von „sie gebar“ zu „er gab den Namen“; die genuine textliche Spannung wird durch die Fußnote offengehalten.
