lexical_decisions:
- source_word: ቀንአ
  choice: beneideten
  rationale: Das Verb bezeichnet Neid beziehungsweise Eifersucht; im Zusammenhang mit Jakobs wachsendem Besitz ist „beneideten“ die natürliche und genaue Wiedergabe.
- source_word: አስተጋብአ
  choice: trieb … zusammen
  rationale: Die Kausativform drückt ein Zusammenbringen oder Versammeln aus. Bei Schafen entspricht „trieb … zusammen“ natürlichem modernem Deutsch, ohne eine nicht belegte Richtungsangabe hinzuzufügen.
- source_word: አባግዒሁ
  choice: seine Schafe
  rationale: Das Substantiv bezeichnet Schafe, das Suffix den Besitz Labans.
