translation:
  language: de
  text: Im neunten Monat[a], im ersten Jahr der dritten Jahrwoche. Rahels Mutterleib aber war verschlossen, denn er sah …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im neunten«; »Monat« ist aus dem Zusammenhang ergänzt.'
    reason: Das Bezugswort zum Zahlwort steht offenbar im vorhergehenden Versabschnitt und fehlt im hier vorgelegten Segment.
lexical_decisions:
- source_word: ታስዕ
  choice: im neunten Monat
  rationale: Das äthiopische Zahlwort bedeutet »der neunte«. »Monat« wird aufgrund des versübergreifenden Zusammenhangs ergänzt; die Ergänzung wird in einer Fußnote offengelegt.
- source_word: ሱባዔ፡ ሣልስ
  choice: dritte Jahrwoche
  rationale: ሱባዔ bezeichnet hier eine Siebenerperiode von Jahren; »Jahrwoche« gibt dies knapp und im Jubiläenbuch verständlich wieder.
- source_word: ማሕጸን
  choice: Mutterleib
  rationale: Die konkrete körperliche Bedeutung im Zusammenhang mit Rahels Kinderlosigkeit wird natürlich und würdig wiedergegeben.
- source_word: ተጸፍቀ
  choice: war verschlossen
  rationale: Bewahrt das bildhafte Passiv des Ausgangstextes, ohne die Ursache oder handelnde Instanz näher festzulegen.
- source_word: እስመ፡ ርእየ
  choice: denn er sah …
  rationale: Gibt sowohl die begründende Konjunktion als auch das finite Verb wieder. Die Auslassungspunkte zeigen an, dass der überlieferte Versabschnitt mitten im Satz endet.
theological_decisions:
- issue: Wer Rahels Mutterleib verschloss
  choice: Passiv ohne ausdrücklich genannten Handelnden
  alternative: Gott hatte Rahels Mutterleib verschlossen
  rationale: Der vorliegende ge’ezische Text nennt an dieser Stelle keinen Handelnden; eine ausdrückliche Zuschreibung an Gott würde den Text theologisch vereindeutigen.
- issue: Subjekt von »er sah«
  choice: Pronomen ohne namentliche Auflösung
  alternative: Jakob sah / Gott sah
  rationale: Die Verbform enthält ein maskulines Singularsubjekt, doch der Ausschnitt lässt dessen Referenten offen. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber fachlich etablierte Bezeichnung »Jahrwoche« wahrt die Siebenerstruktur des Jubiläenbuches. Der Satzabbruch am Versende wird sichtbar beibehalten.
