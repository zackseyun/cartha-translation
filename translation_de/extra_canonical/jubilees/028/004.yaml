lexical_decisions:
- source_word: ሱባዓተ፡ ዓመተ፡
  choice: diese sieben Jahre
  rationale: Gibt die am Versanfang fortgesetzte Zeitangabe wörtlich und im Anschluss an den vorausgehenden Satz wieder.
- source_word: እሁበከ፡ ብእሲተከ።
  choice: Ich werde dir deine Frau geben.
  rationale: Bewahrt die schlichte Zusage Labans und die bestimmte Bezeichnung der Frau als Jakobs Frau.
- source_word: ገብረ፡ ላባ፡ ግብአ፡
  choice: Dann veranstaltete Laban ein Festmahl
  rationale: Das Substantiv bezeichnet hier ein Mahl beziehungsweise Fest; „Festmahl“ ist im Hochzeitskontext natürlich und präzise.
- source_word: ወነሥአ፡
  choice: und nahm
  rationale: Der Vers bricht nach dem Verb ab; die unvollständige Syntax bleibt erhalten, da das Objekt erst im folgenden Text erscheint.
