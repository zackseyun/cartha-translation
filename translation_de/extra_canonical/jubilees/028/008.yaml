translation_notes:
  register: Natürliche, würdige Standardsprache. Die vorangestellte Wendung »Um Rahel« erhält den Kontrast zu »nicht um Lea«. Der überlieferte Ausschnitt endet nach »deine Tochter«; deshalb wurde kein abschließender Punkt ergänzt.
