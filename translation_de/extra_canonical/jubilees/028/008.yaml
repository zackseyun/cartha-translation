lexical_decisions:
- source_word: ተቀነይኩ፡ ለከ
  choice: habe ich dir gedient
  rationale: 'Die geezische Verbform steht in der 1. Person Singular; das angefügte ለከ bezeichnet den Adressaten: »dir«.'
- source_word: 7ፋዕከኒ
  choice: hast du mir Unrecht getan
  rationale: Der Zusammenhang verlangt eine Anklage wegen des an Jakob begangenen Unrechts. Die Wiedergabe bleibt allgemein und legt die Art des Unrechts nicht enger fest.
- source_word: ንግአ፡ ወሰተከ
  choice: Nimm deine Tochter
  rationale: Die imperative Wendung wird direkt und idiomatisch wiedergegeben; »deine Tochter« bewahrt die Beziehung zum Angeredeten.
