lexical_decisions:
- source_word: ግበሩ፡ ዘንተ፡ ቃለ
  choice: Tut dies
  rationale: Gibt den pluralischen Imperativ und die allgemeine Bezeichnung der Angelegenheit knapp und würdig wieder.
- source_word: አይንሥኡ፡ ወአየሀቡ
  choice: Man soll … weder nehmen noch weggeben
  rationale: Bewahrt beide Verben und ihre negative, normgebende Aussage. „Weggeben“ verdeutlicht den Gegensatz zu „nehmen“, ohne ausdrücklich eine Eheschließung in den Text einzutragen.
- source_word: እንተ፡ ትንእስ
  choice: die Jüngere
  rationale: Die feminine Form wird substantiviert wiedergegeben; der Kontextbezug bleibt erhalten.
- source_word: ዘእንበለ፡ ያቅድሙ፡ እንተ፡ ትልህቅ
  choice: bevor man zuerst die Ältere weggegeben hat
  rationale: Gibt die zeitliche Vorrangfolge ausdrücklich wieder und erhält die feminine Gegenüberstellung von Jüngerer und Älterer.
