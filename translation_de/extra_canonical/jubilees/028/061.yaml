  language: de
  text: Und nachdem Rahel Josef geboren hatte, ging Laban hin, um seine Schafe zu scheren, denn er war weit entfernt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: Und nachdem
  rationale: Die äthiopische Wendung leitet eine zeitliche Folge ein. Im modernen Deutschen gibt „Und nachdem“ den Erzählanschluss natürlich wieder, ohne die formelhafte Konstruktion unnötig nachzuahmen.
- source_word: ወለደት፡ ራሔል፡ ዮሴፍሃ፡
  choice: Rahel Josef geboren hatte
  rationale: Die Vorzeitigkeit gegenüber Labans Aufbruch wird durch das Plusquamperfekt ausgedrückt. Der Name folgt der im Deutschen üblichen Form „Rahel“.
- source_word: ይቅርጽ፡ አባግዒሁ፡
  choice: um seine Schafe zu scheren
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck von Labans Gang; „Schafe scheren“ ist die natürliche deutsche Entsprechung.
- source_word: እስመ፡ ርሑቅ፡
  choice: denn er war weit entfernt
  rationale: „Denn“ bewahrt die begründende Verknüpfung, und „weit entfernt“ gibt die räumliche Distanz vollständig und idiomatisch wieder.
