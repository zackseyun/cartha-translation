lexical_decisions:
- source_word: አዕይንቲሃ
  choice: ihre Augen
  rationale: Die isolierte Nominalgruppe wird entsprechend der vorgegebenen Versaufteilung wörtlich beibehalten; sie schließt syntaktisch an den vorhergehenden Kontext an.
- source_word: ሠናይ፡ ራእያ
  choice: ihr Aussehen war schön
  rationale: Das singularische ሠናይ bezieht sich auf das singularische ራእያ („ihr Aussehen“), nicht auf die pluralischen „Augen“.
- source_word: ወላሕይት፡ ጥቀ
  choice: und sie war sehr lieblich
  rationale: Gibt das prädikative Adjektiv mit der Verstärkung ጥቀ natürlich und würdevoll wieder, ohne es mit der vorangehenden Beschreibung zusammenzuziehen.
- source_word: ኢኮነ፡ ከመዝ
  choice: So macht man es nicht
  rationale: Eine idiomatische deutsche Wiedergabe der negierten Wendung; der Satz bleibt wie der vorgelegte Quellenausschnitt bewusst unvollständig.
