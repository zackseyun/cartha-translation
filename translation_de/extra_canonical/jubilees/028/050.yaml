  terminology: „Neumond“ ist für die kalendarische Formel passend. „Jahrwoche“ ist für die siebjährige Periode im Jubiläenbuch etabliert, knapp und verständlich. Der Name „Josef“ entspricht der üblichen deutschen Form.
