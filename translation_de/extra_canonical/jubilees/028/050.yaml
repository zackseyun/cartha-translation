  source_fidelity: 'Die Übersetzung gibt die geʽezische Chronologie sachgerecht wieder: በሠርቅ bezeichnet hier den Monatsbeginn/Neumond, nicht Morgendämmerung oder einen vierten Tag. Das implizite Geburtsprädikat bei „Josef“ wird im Deutschen zulässig ergänzt. „Im sechsten Jahr dieser vierten Jahrwoche“ bildet die zeitliche Einordnung treffend ab. Der abschließende Ausdruck wird zu Recht als über die Versgrenze weiterführende abhängige Zeitangabe behandelt.'
