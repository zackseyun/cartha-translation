  text: Joseph, on the new moon of the fourth month, in the sixth year, in this fourth week. And in the days when he was born...
translation:
  language: de
  text: Josef wurde am Neumond des vierten Monats geboren, im sechsten Jahr dieser vierten Jahrwoche. Und in den Tagen, als er geboren wurde …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሠርቅ፡ ወርኅ፡ ራብዕ
  choice: am Neumond des vierten Monats
  rationale: In dieser chronologischen Formel bezeichnet ሠርቅ den Monatsbeginn beziehungsweise Neumond; der Text nennt keinen »vierten Tag«.
- source_word: በሱባዔ፡ ዝንቱ፡ ራብዕ
  choice: dieser vierten Jahrwoche
  rationale: ሱባዔ bezeichnet im chronologischen System des Jubiläenbuches eine Siebenerperiode von Jahren. »Jahrwoche« gibt dies knapp und verständlich wieder.
- source_word: ወበመዋዕለ፡ ተወልደ
  choice: Und in den Tagen, als er geboren wurde …
  rationale: Die Wendung ist als abhängige Zeitangabe zu verstehen und führt über die Versgrenze hinaus; die Auslassungspunkte bewahren den syntaktisch offenen Anschluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im ge'ezischen Nominalsatz nur implizite Prädikat »wurde geboren« wird im ersten Satz ergänzt, damit die chronologische Aussage im Deutschen natürlich verständlich ist. Der zweite Satz bleibt entsprechend der Konstruktform bewusst unvollständig und weist auf die Fortsetzung hin.
