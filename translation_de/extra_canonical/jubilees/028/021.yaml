lexical_decisions:
- source_word: ወሀቦ፡ ላባ፡ ራሔልሃ፡ ለያዕቆብ
  choice: Laban gab Rahel Jakob zur Frau
  rationale: Die Konstruktion bezeichnet die Übergabe Rahels an Jakob im Zusammenhang der Eheschließung. »Zur Frau« macht den gemeinten sozialen Vorgang im Deutschen natürlich verständlich, ohne zusätzliche theologische Deutung.
- source_word: ከመ፡ ይትቀነይ፡ ሎቱ
  choice: damit er ihm … diente
  rationale: Der Finalsatz wird mit »damit« wiedergegeben; das Dativpronomen bezieht sich auf Laban.
- source_word: ካልአተ፡ ዓመተ፡ ሰብዓተ
  choice: noch weitere sieben Jahre
  rationale: Die Wendung meint einen zweiten bzw. zusätzlichen Zeitraum von sieben Jahren; »noch weitere« ist im gegenwärtigen Deutsch klar und idiomatisch.
- source_word: ወወሀባ፡
  choice: Und er gab ihr
  rationale: Das Verb enthält ein feminines Objektsuffix. Da der Satz am Versende offenbar in den folgenden Vers hineinreicht, bleibt die deutsche Wiedergabe entsprechend offen.
