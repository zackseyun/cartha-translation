lexical_decisions:
- source_word: እምኔሁ (ʾəmnehu)
  choice: von ihm
  rationale: Gibt die Präposition »von/aus« mit dem pronominalen Suffix der 3. Person Singular wieder und bewahrt den fragmentarischen Anschluss an den vorausgehenden Kontext.
- source_word: ወአስተሐየጸ (wa-ʾastäḥayyäṣä)
  choice: und handelte … hinterlistig
  rationale: Drückt das täuschende beziehungsweise arglistige Handeln idiomatisch und ohne unnötige Festlegung auf einen einzelnen konkreten Täuschungsakt aus.
- source_word: ለእኩይ (lä-ʾəkuy)
  choice: in böser Absicht
  rationale: Bewahrt die ausdrückliche Nennung des Bösen und gibt den finalen beziehungsweise intentionalen Sinn des Ge’ez natürlich auf Deutsch wieder.
theological_decisions:
- issue: Bezug von ለእኩይ
  choice: in böser Absicht
  alternative: ihm gegenüber
  rationale: Die Form enthält ausdrücklich እኩይ, »böse/Böses«. Daher wird sie im Haupttext als Beschreibung der bösen Zielrichtung beziehungsweise Absicht verstanden; die ältere relationale Auffassung wird lediglich als weniger wahrscheinliche Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfragmentform bleibt erhalten, weil der Vers offenbar an den vorausgehenden Text anschließt; »hinterlistig« und »in böser Absicht« bilden sowohl die Täuschung als auch ihre ausdrücklich böse Zielrichtung ab.
