lexical_decisions:
- source_word: ወትቤሎ
  choice: und sie sagte zu ihm
  rationale: Die feminine Verbform bezeichnet eine weibliche Sprecherin; das Objektsuffix ist maskulin Singular und verweist auf Jakob.
- source_word: ባላ፡ ኀበ፡ *ባላ፡
  choice: Geh zu Bilha ein
  rationale: Die überlieferte Stelle scheint verderbt zu sein. Die Übersetzung folgt der naheliegenden Rekonstruktion በአ ኀበ ባላ („geh hinein zu Bilha“) und bewahrt mit „eingehen zu“ den verhüllenden Ausdruck für geschlechtlichen Verkehr, ohne ihn im Haupttext auszudeuten.
theological_decisions:
- issue: Verhüllende Bezeichnung des Geschlechtsverkehrs
  choice: Geh zu Bilha ein
  alternative: Schlaf mit Bilha
  rationale: Die formalere Wiedergabe erhält Bildsprache und mögliche Nuancen des rekonstruierten Ausgangstextes, statt den Euphemismus ausdrücklich aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als Fortsetzung des vorangehenden Verszusammenhangs fragmentarisch; die Namen folgen den im Deutschen üblichen biblischen Formen.
