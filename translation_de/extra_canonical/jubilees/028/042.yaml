lexical_decisions:
- source_word: ወልደ
  choice: Und sie gebar einen Sohn
  rationale: Die Form bezeichnet hier im Erzählzusammenhang das Gebären; das im Deutschen nötige Objekt „einen Sohn“ entspricht der englischen Konsultationsfassung und dem Kontext.
- source_word: ወጸውዐት፡ ስሞ
  choice: und Lea gab ihm den Namen
  rationale: Wörtlich steht eine Wendung wie „sie nannte seinen Namen“. Die idiomatische deutsche Namengebungsformel bewahrt den Sinn ohne unnatürliche Syntax.
- source_word: ጋድ
  choice: Gad
  rationale: Der überlieferte biblische Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: አመ፡ ዐሡሩ፡ ወስኑዩ፡ ለወርኅ፡ ሳምን፡ በሣልስ፡ ዓመት
  choice: am zwölften Tag des achten Monats im dritten Jahr
  rationale: Die Datumsangabe wird in natürlicher deutscher Reihenfolge wiedergegeben und hält alle drei Zeitangaben fest.
