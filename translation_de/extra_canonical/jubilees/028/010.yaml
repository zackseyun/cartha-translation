  language: de
  text: denn Leas Augen waren schwach; doch ihr Aussehen war sehr schön, und Rahel war schön.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኩም
  choice: schwach
  rationale: Das Adjektiv bezeichnet Schwäche bzw. geringe Kraft und wird hier wie im überlieferten Kontrast auf Leas Augen bezogen; die Formulierung wahrt die mögliche Unbestimmtheit der genauen Augenbeschaffenheit.
- source_word: ላሕይ፡ ራእያ፡ ጥቀ
  choice: ihr Aussehen war sehr schön
  rationale: Die Wendung beschreibt Leas Erscheinung; ጥቀ verstärkt ausdrücklich mit „sehr“. Dadurch bleibt die eigenständige positive Aussage über Lea erhalten und wird nicht mit der folgenden Aussage über Rahel verschmolzen.
- source_word: ወራሔል፡ ሠናይ
  choice: und Rahel war schön
  rationale: Die knappe zweite Aussage wird eigenständig und ohne aus Genesis 29,17 ergänzte Merkmale wiedergegeben.
theological_decisions:
- issue: Zuordnung der Schönheitsaussagen
  choice: Leas Aussehen wird als sehr schön bezeichnet; anschließend wird Rahel als schön bezeichnet.
  alternative: Beide Schönheitsmerkmale ausschließlich auf Rahel beziehen.
  rationale: Grammatik und Wortfolge des ge'ezischen Textes unterscheiden eine Aussage über Leas Aussehen von der anschließenden Aussage über Rahel. Diese besondere Lesart darf nicht an Genesis 29,17 angeglichen werden.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. Das Semikolon verdeutlicht den Kontrast nach der Aussage über Leas Augen, ohne die zwei eigenständigen Schönheitsaussagen zusammenzuziehen.
