  text: And he served him for his daughter Rachel one week.
translation:
  language: de
  text: Und er diente ihm für dessen Tochter Rahel eine Woche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: eine Jahrwoche, also sieben Jahre.'
    reason: Die Anmerkung erklärt die im Kontext gemeinte Dauer, während der Haupttext die chronologische Terminologie des Ausgangstextes bewahrt.
lexical_decisions:
- source_word: ተቀንየ፡ ሎቱ፡
  choice: er diente ihm
  rationale: Die Wendung bezeichnet Jakobs Dienst für Laban und wird nah am ge'ezischen Wortlaut wiedergegeben.
- source_word: ህየንተ፡ ራሔል፡ ወለቱ፡
  choice: für seine Tochter Rahel
  rationale: ወለቱ bedeutet „seine Tochter“ und darf nicht ausgelassen werden; die deutsche Wortstellung ist natürlich und bewahrt den Bezug auf Laban.
- source_word: ሱባዔ፡ አሐደ፡
  choice: eine Woche
  rationale: Wörtlich „eine Woche“; das für das Jubiläenbuch charakteristische chronologische System bleibt sichtbar, ohne die gemeinten sieben Jahre stillschweigend in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung der „Woche“ als Jahrwoche
  choice: Im Haupttext steht wörtlich „eine Woche“.
  alternative: „sieben Jahre“
  rationale: Der Ausgangstext formuliert mit „Woche“; die zeitliche Bedeutung kann erläutert werden, sollte aber die charakteristische Ausdrucksweise des Buches nicht ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem Ausgangstext; „diente“ ist im Kontext verständlich und vermeidet unnötige Ausdeutung.
