lexical_decisions:
- source_word: ወአንሥአ፡ እገሪሁ
  choice: Und er machte sich auf
  rationale: Die wörtliche Wendung „er hob seine Füße“ ist ein idiomatischer Ausdruck für den Aufbruch. „Er machte sich auf“ gibt ihn in natürlichem, würdigem Deutsch wieder.
- source_word: ምድረ፡ ጽባሕ
  choice: das Land des Ostens
  rationale: Die Wendung bezeichnet das östliche Land bzw. das Land in Richtung Sonnenaufgang. Die traditionelle geografische Formulierung wahrt den Sinn und die leichte Unbestimmtheit.
- source_word: ወሀሎ፡ ምስሌሁ
  choice: und blieb bei ihm
  rationale: Statt des statischen „war bei ihm“ bringt „blieb bei ihm“ den im Kontext naheliegenden Aufenthalt idiomatisch zum Ausdruck, ohne eine Dauer hinzuzufügen.
