lexical_decisions:
- source_word: ዘሱባዔ፡ ራብዕ
  choice: der vierten Jahrwoche
  rationale: Die Genitivform setzt den vorangehenden Satz fort; „Jahrwoche“ gibt im Jubiläenbuch den chronologischen Siebenerzeitraum klar wieder.
- source_word: ወደገመ፡ ቦአ፡ ኀቤሃ
  choice: Und er ging wieder zu ihr ein
  rationale: Bewahrt den biblisch-euphemistischen Ausdruck für den Geschlechtsverkehr und die Bedeutung von „wieder“.
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ
  choice: sie wurde schwanger und gebar ihm
  rationale: Gibt die Abfolge von Empfängnis und Geburt sowie den Dativbezug möglichst direkt wieder.
- source_word: ወልደ፡ ካልአ
  choice: einen zweiten Sohn
  rationale: Entspricht der Ordnungsangabe und hält fest, dass es sich um einen weiteren männlichen Nachkommen handelt.
- source_word: ወጸውዐት
  choice: und sie nannte
  rationale: Die Form leitet die Namensgebung ein; da der überlieferte Versausschnitt vor dem Namen endet, bleibt auch die deutsche Fassung offen.
