lexical_decisions:
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die Gottesbezeichnung wird in würdigem, bibelsprachlich vertrautem Deutsch wiedergegeben.
- source_word: ትጸላእ
  choice: gehasst wurde
  rationale: Bewahrt die starke, spannungsreiche Aussage des Ge'ez, ohne sie zu ‚weniger geliebt‘ abzuschwächen.
- source_word: ትትፈቀር
  choice: geliebt wurde
  rationale: Direkte und natürliche Wiedergabe des passivischen Gegenstücks zu ‚gehasst wurde‘.
- source_word: ወደገመ፡ ያዕቆብ፡ ወቦአ፡ ኀበ
  choice: Und Jakob ging wieder hinein zu
  rationale: Gibt die erneute Handlung und die am Versende stehende Präposition wieder; deren Objekt folgt nach der vorliegenden Versgliederung erst in Vers 27.
theological_decisions:
- issue: Stärke des Gegensatzes zwischen Lea und Rahel
  choice: gehasst … geliebt
  alternative: weniger geliebt … geliebt
  rationale: Der Ausgangstext formuliert einen scharfen Gegensatz; eine harmonisierende Abschwächung würde die echte Spannung beseitigen.
- issue: Unvollständige Satzgrenze am Versende
  choice: hinein zu
  alternative: zu ihr hinein
  rationale: Das Ge'ez endet mit ኀበ („zu“), während das Bezugswort offenbar am Anfang von Vers 27 steht. Der offene Anschluss wahrt die überlieferte Segmentierung und vermeidet ein zusätzliches Pronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich offene Schlussformulierung ist absichtlich beibehalten, weil der Satz syntaktisch in Vers 27 weiterläuft.
