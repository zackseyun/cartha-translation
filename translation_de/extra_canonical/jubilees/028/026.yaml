  source_fidelity: 'Die Wiedergabe folgt dem ge''ezischen Wortlaut eng: እግዚአብሔር ist angemessen als „der HERR“ wiedergegeben, Lea und Rahel stehen im starken passivischen Gegensatz „gehasst“/„geliebt“, und „Jakob ging wieder hinein zu“ bewahrt sowohl die Wiederholung als auch die am Versende offen bleibende Präposition ኀበ. Das Bezugswort folgt nach der vorgegebenen Versgliederung erst in V. 27.'
