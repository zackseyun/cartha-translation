  text: The sheep bore according to their kinds; and every one with marks belonged to Jacob, and every one without marks to Laban.
translation:
  language: de
  text: Die Schafe brachten Junge ihrer jeweiligen Art entsprechend zur Welt; jedes Tier mit einer Zeichnung gehörte Jakob, jedes ohne Zeichnung Laban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዐ፡ ይለዳ፡
  choice: Die Schafe brachten Junge … zur Welt
  rationale: Gibt das ausdrücklich genannte Subjekt አባግዐ („die Schafe“) und das erzählende Verb ይለዳ idiomatisch und im passenden deutschen Erzähltempus wieder.
- source_word: ዘበአርአያሆን፡
  choice: ihrer jeweiligen Art entsprechend
  rationale: አርአያ kann Gestalt, Erscheinung oder Art bezeichnen. Im Zusammenhang der Fortpflanzung bringt „ihrer jeweiligen Art entsprechend“ den Sinn natürlich zum Ausdruck, ohne eine spezifischere biologische Deutung einzutragen.
- source_word: ትእምርት፡
  choice: Zeichnung
  rationale: Das Wort bezeichnet ein Zeichen oder Merkmal. „Zeichnung“ passt hier zu sichtbaren Fellmerkmalen der Tiere und bildet den Gegensatz zwischen markierten und unmarkierten Tieren knapp ab.
- source_word: ለያዕቆብ፡ … ለላባ።
  choice: gehörte Jakob … Laban
  rationale: Der Zugehörigkeits- beziehungsweise Besitzsinn der geʿezischen Dativkonstruktion wird im Deutschen ausdrücklich und natürlich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die parallele Gegenüberstellung „mit einer Zeichnung … ohne Zeichnung“ bewahrt die knappe Struktur des Ausgangstextes; „jedes Tier“ macht den elliptischen geʿezischen Ausdruck im Deutschen verständlich.
