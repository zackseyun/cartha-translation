  source_fidelity: 'Der deutsche Text gibt den geʿezischen Satz vollständig und präzise wieder: Das feminine Verb bei „sie gebar“ und das anschließende maskuline Verb bei „er gab ihm den Namen“ bleiben klar unterschieden. „Jakob einen Sohn gebar“ entspricht der Konstruktion mit ለያዕቆብ. Die Datierung lautet zutreffend lediglich „am vierzehnten Tag des Monats“; eine Bezeichnung als neunter Monat wird nicht in den Haupttext aufgenommen.'
