  text: and she bore Jacob a son, and he called his name Reuben, on the fourteenth day of the month,
translation:
  language: de
  text: Und sie gebar Jakob einen Sohn, und er gab ihm den Namen Ruben – am vierzehnten Tag des Monats.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In einigen Handschriften: „des neunten Monats“.'
    reason: 'Textvariante: Die Monatszahl ist im vorgelegten kritischen Text nicht enthalten, wird aber von einigen Handschriften bezeugt.'
lexical_decisions:
- source_word: ወወለደት፡ ለያዕቆብ፡ ወልደ
  choice: Und sie gebar Jakob einen Sohn
  rationale: Die feminine Verbform wird mit „sie gebar“ wiedergegeben; die deutsche Konstruktion ist natürlich und bewahrt Jakob als denjenigen, dem der Sohn geboren wurde.
- source_word: ወጸውዐ፡ ስሞ፡
  choice: und er gab ihm den Namen
  rationale: Die maskuline Singularform des Verbs verlangt ein ausdrückliches „er“. „Ihm den Namen geben“ ist die natürliche moderne deutsche Entsprechung für die wörtliche Wendung „seinen Namen nennen“.
- source_word: ሮቤል
  choice: Ruben
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡
  choice: am vierzehnten Tag des Monats
  rationale: Gibt die Datumsangabe idiomatisch und ohne die im vorgelegten Text fehlende Ordnungszahl des Monats wieder.
theological_decisions:
- issue: Wer Ruben den Namen gab
  choice: „er gab ihm den Namen“
  alternative: „und gab ihm den Namen“ / „sie gab ihm den Namen“
  rationale: Der Wechsel von der femininen Form „sie gebar“ zur maskulinen Form „er nannte“ ist im ge’ezischen Text grammatisch markiert und darf nicht eingeebnet werden.
- issue: Bestimmung des Monats
  choice: Im Haupttext nur „des Monats“
  alternative: „des neunten Monats“
  rationale: Das Wort „neunte“ fehlt im angegebenen ge’ezischen Ausgangstext; die abweichende Lesart wird lediglich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung bleibt nahe am ge’ezischen Text; ein Gedankenstrich hebt die abschließende Datumsangabe lesefreundlich ab.
