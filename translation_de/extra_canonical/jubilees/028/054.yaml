  text: and take your wages.” And they agreed between themselves that he would give him as his wages every lamb
translation:
  language: de
  text: »… und nimm deinen Lohn.« Und sie einigten sich miteinander darauf, dass er ihm jedes Lamm[a] als seinen Lohn geben sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jedes junge Schaf«.'
    reason: Die äthiopische Wendung bezeichnet ein Schaf aus den Jungtieren der Herde; »Lamm« ist die natürliche knappe Wiedergabe.
lexical_decisions:
- source_word: ዐስበከ
  choice: deinen Lohn
  rationale: Das Substantiv für Lohn trägt ein Suffix der 2. Person Singular und wird daher possessiv wiedergegeben.
- source_word: ተካሀሉ
  choice: sie einigten sich
  rationale: Gibt die wechselseitige Verständigung idiomatisch und zugleich quellennah wieder.
- source_word: በበይናቲሆሙ
  choice: miteinander
  rationale: Drückt die gegenseitige bzw. untereinander erfolgte Absprache in natürlichem Deutsch aus.
- source_word: ዐስቦ
  choice: als seinen Lohn
  rationale: Bewahrt das maskuline Possessivsuffix der 3. Person Singular; die Präposition wird im Deutschen mit »als« ausgedrückt.
- source_word: ኵሎ፡ በግዐ፡ እመሐስዕ
  choice: jedes Lamm
  rationale: Der Zusatz እመሐስዕ präzisiert das Tier als Jungtier der Herde; »Lamm« bewahrt diese gegenüber »Schaf« engere Bedeutung.
