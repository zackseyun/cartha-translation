lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier einen Zeitraum von sieben Jahren. „Jahrwoche“ gibt diese chronologische Einheit knapp und verständlich wieder.
- source_word: አቀመት
  choice: sie aufgehört hatte
  rationale: Das Verb drückt ein Aufhören beziehungsweise Stillstehen aus; zusammen mit dem folgenden Gebärmotiv ergibt sich natürlich „aufgehört hatte zu gebären“.
- source_word: ኢትወልድ
  choice: zu gebären
  rationale: Die negierte Verbform bezeichnet das Nicht-mehr-Gebären. Im Deutschen wird sie idiomatisch mit dem vorausgehenden „aufgehört hatte“ verbunden.
