  text: And he loved Rachel more than Leah, because Leah had been given to him. And the LORD opened Leah’s womb, and she conceived.
translation:
  language: de
  text: Und er liebte Rahel mehr als Lea, weil Lea ihm gegeben worden war.[a] Und der HERR öffnete Leas Mutterleib, und sie wurde schwanger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte äthiopische Textausschnitt setzt erst mit »Rahel, weil Lea …« ein. Der Satzanfang »Und er liebte Rahel mehr als Lea« folgt der vollständigen Versabgrenzung. Das im Ausschnitt stehende Wort በከ ist wahrscheinlich fehlerhaft; die Wiedergabe »ihm« folgt der vermuteten Lesung.
    reason: Der Quellenausschnitt weist offenbar eine Verssegmentierungslücke auf und enthält wahrscheinlich eine fehlerhafte Wortform. Die Fußnote macht sowohl die ergänzte Satzhälfte als auch die Grundlage für »ihm« präzise transparent.
lexical_decisions:
- source_word: ራሔል
  choice: Rahel
  rationale: Die geläufige deutsche Namensform wird verwendet.
- source_word: ትውህበት
  choice: war gegeben worden
  rationale: Die passive Verbform wird bedeutungsnah und in natürlichem modernem Deutsch wiedergegeben.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Traditionelle, verständliche deutsche Wiedergabe der Gottesbezeichnung in diesem biblischen Erzählzusammenhang.
- source_word: አርኀወ … ማኅፀነ
  choice: öffnete … Mutterleib
  rationale: Bewahrt die konkrete biblische Ausdrucksweise, ohne die Aussage erklärend auf Fruchtbarkeit zu verengen.
- source_word: ፀንሰት
  choice: sie wurde schwanger
  rationale: Natürliche moderne Wiedergabe des Verbs für das Empfangen beziehungsweise Schwangerwerden.
theological_decisions:
- issue: Göttliches Handeln bei Leas Empfängnis
  choice: der HERR öffnete Leas Mutterleib
  alternative: der HERR machte Lea fruchtbar
  rationale: Die konkrete Metapher der Vorlage bleibt erhalten und wird nicht durch eine theologisch oder biologisch ausdeutende Formulierung ersetzt.
- issue: Begründung der stärkeren Liebe zu Rahel
  choice: weil Lea ihm gegeben worden war
  alternative: obwohl Lea ihm gegeben worden war
  rationale: Die kausale Verknüpfung der Vorlage wird bewahrt, auch wenn ihr Gedankengang im Deutschen ungewöhnlich wirkt; die Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bibelnaher Bildsprache. Die syntaktisch ungewöhnliche Kausalbeziehung wird aus Quellentreue beibehalten.
