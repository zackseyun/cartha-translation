  text: Leah conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first.
translation:
  language: de
  text: Lea wurde schwanger und gebar Jakob einen zweiten Sohn. Er gab ihm den Namen Simeon, am einundzwanzigsten Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡
  choice: wurde schwanger und gebar
  rationale: Die beiden femininen Verbformen werden direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: ወልደ፡ ካልአ፡
  choice: einen zweiten Sohn
  rationale: Gibt die ge'ezische Wortgruppe sachlich und idiomatisch wieder.
- source_word: ወጸውዐ፡ ስሞ፡ ስምዖን፡
  choice: Er gab ihm den Namen Simeon
  rationale: Die maskuline Singularform ጸውዐ wird mit „Er“ bewahrt; die deutsche Namensformel ist natürlich und eindeutig.
- source_word: አመ፡ ፲ሥራ፡
  choice: am einundzwanzigsten Tag
  rationale: Die Datumsangabe wird als Ordinalzahl verstanden; „Tag“ wird im Deutschen zur Klarheit ergänzt.
theological_decisions:
- issue: Wer Simeon den Namen gibt
  choice: Er gab ihm den Namen
  alternative: Sie gab ihm den Namen
  rationale: Das ge'ezische Verb ጸውዐ steht in der 3. Person maskulin Singular. Daher ist Jakob als Namengeber beizubehalten, auch wenn Genesis 29,33 Lea als Namengeberin darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Anschluss mit „und“ wird für einen natürlichen deutschen Einzelvers nicht eigens wiedergegeben. Die im Ge'ez maskuline Form beim Namengeben bleibt ausdrücklich erhalten.
