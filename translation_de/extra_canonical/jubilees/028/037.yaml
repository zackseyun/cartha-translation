  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: de
  text: Und er ging zu ihr ein, und sie wurde schwanger und gebar ihm einen Sohn. Er gab ihm den Namen Dan[a], am neunten Tag des Monats.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften: Sie gab ihm den Namen Dan.'
    reason: Bewahrt die genuine textkritische Variante zur maskulinen Verbform des vorgelegten Haupttextes.
  - marker: b
    text: 'Wörtlich: am Neunten des Monats.'
    reason: Macht die knappe ge'ezische Datumsformel transparent und grenzt sie gegen die mögliche, hier jedoch weniger wahrscheinliche Deutung „im neunten Monat“ ab.
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  choice: Und er ging zu ihr ein
  rationale: Die idiomatische Wendung bezeichnet den ehelichen Verkehr; die traditionelle, würdige deutsche Formulierung bewahrt den verhüllenden Charakter des Ausgangstextes.
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡
  choice: und sie wurde schwanger und gebar ihm einen Sohn
  rationale: Gibt die feminine Verbfolge und den Dativbezug auf den Mann formal und zugleich natürlich wieder.
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  choice: Er gab ihm den Namen Dan
  rationale: Die überlieferte Verbform im vorgelegten Text ist maskulin Singular und wird daher trotz der abweichenden Lesart mancher Handschriften mit „Er“ wiedergegeben.
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  choice: am neunten Tag des Monats
  rationale: አመ mit der Ordinalzahl und „Monat“ bezeichnet hier den Kalendertag innerhalb des Monats, nicht den neunten Schwangerschaftsmonat.
theological_decisions:
- issue: Wer Dan den Namen gab
  choice: Er gab ihm den Namen Dan
  alternative: Sie gab ihm den Namen Dan
  rationale: Der bereitgestellte ge'ezische Haupttext hat die maskuline Singularform ወጸውዐ. Die feminine Variante wird wegen ihrer handschriftlichen Bezeugung in einer Fußnote genannt, aber nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „zu ihr eingehen“ wird wegen ihrer sachlichen und verhüllenden Entsprechung zum Ausgangstext beibehalten; die übrige Syntax ist für heutige Leser geglättet. Alle Fußnotenmarker stehen unmittelbar an der betreffenden Textstelle.
