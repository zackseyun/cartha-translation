  text: to her, and she conceived and bore another son and a daughter, and she called the son's name Zebulun,
translation:
  language: de
  text: zu ihr. Sie wurde schwanger und gebar einen weiteren[a] Sohn und eine Tochter. Dem Sohn gab sie den Namen Sebulon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen zweiten Sohn«.'
    reason: Das ge’ezische ካልእተ kann hier sowohl »einen weiteren« als auch »einen zweiten« bedeuten.
lexical_decisions:
- source_word: ካልእተ፡ ወልደ፡ (kālʾəta walda)
  choice: einen weiteren Sohn
  rationale: ካልእ kann sowohl »ein anderer/weiterer« als auch »ein zweiter« bedeuten. »Ein weiterer Sohn« bewahrt den möglichen Sinn, ohne Sebulon missverständlich als Leas insgesamt zweiten Sohn zu bezeichnen.
- source_word: ወጸውዐት፡ ስሞ፡ ለወልድ፡ ዘቡሎን፡
  choice: Dem Sohn gab sie den Namen Sebulon
  rationale: Die ge’ezische Wendung »den Namen nennen« wird in natürlichem modernem Deutsch als Namensgebung wiedergegeben; der Bezug auf den Sohn bleibt ausdrücklich erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der am Versanfang aus dem vorigen Zusammenhang fortgeführte Ausdruck »zu ihr« bleibt als Satzfragment erhalten, wird aber durch einen Punkt vom folgenden vollständigen Satz getrennt. Der überlieferte Inhalt einschließlich der Tochter wird vollständig wiedergegeben.
