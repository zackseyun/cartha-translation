  text: In the first year of the fourth week. And through all this Rachel was jealous of Leah, because she was barren.
translation:
  language: de
  text: Im ersten Jahr der vierten Jahrwoche. Während dieser ganzen Zeit war Rahel eifersüchtig auf Lea, weil sie selbst unfruchtbar war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier im chronologischen System des Jubiläenbuches einen Zeitraum von sieben Jahren; „Jahrwoche“ gibt diese Bedeutung knapp und verständlich wieder.
- source_word: ትቀንዕ
  choice: war eifersüchtig
  rationale: Die Verbform beschreibt Rahels Eifersucht beziehungsweise ihren Neid auf Lea; „eifersüchtig sein auf“ ist im modernen Deutsch natürlich und entspricht dem erzählerischen Zusammenhang.
- source_word: በዝ፡ ኵሉ
  choice: während dieser ganzen Zeit
  rationale: Die idiomatische Wiedergabe bewahrt den zeitlichen Bezug der Formulierung, ohne das unnatürliche „in all diesem“ nachzuahmen.
- source_word: ይእቲ
  choice: sie selbst
  rationale: Das feminine Pronomen bezieht sich im Zusammenhang auf Rahel. „Selbst“ macht diesen Bezug im Deutschen deutlich, da ein bloßes „sie“ unmittelbar nach „Lea“ missverständlich wäre.
