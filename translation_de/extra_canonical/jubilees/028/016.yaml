lexical_decisions:
- source_word: እኩይ፡ ዝንቱ፡ ግብር
  choice: Diese Tat ist böse
  rationale: Gibt die prädikative Aussage und die demonstrative Bestimmung des Ge'ez unmittelbar und in natürlichem Deutsch wieder.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: vor dem HERRN
  rationale: Bewahrt die räumlich-forensische Wendung „vor/in den Augen des Herrn“ knapp; die Kapitälchen kennzeichnen den Gottesnamen gemäß der konsultierten Wiedergabe.
- source_word: አዝዝ፡ ለደቂቀ፡ እስራኤል
  choice: sollst den Kindern Israels gebieten
  rationale: Der Imperativ አዝዝ wird als verbindlicher Auftrag wiedergegeben; „Kinder Israels“ wahrt die traditionelle Kollektivbezeichnung.
- source_word: ወአይ
  choice: dass sie nicht …
  rationale: Der überlieferte Ausschnitt bricht nach der einsetzenden Verneinung ab; die Auslassung macht die Unvollständigkeit sichtbar, ohne den fehlenden Inhalt zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens እግዚአብሔር
  choice: HERR
  alternative: Herr
  rationale: Die konsultierte Textschicht versteht die Bezeichnung hier als Gottesnamen; „HERR“ folgt einer vertrauten deutschen Bibelkonvention, ohne zusätzliche Deutung einzuführen.
- issue: Unvollständiger Versschluss
  choice: Offenen verneinten Nebensatz mit Auslassungszeichen bewahren
  alternative: Den Satz aus späterer oder anderer Textüberlieferung ergänzen
  rationale: Der bereitgestellte Ge'ez-Text endet bei ወአይ („und nicht“). Eine Ergänzung wäre ohne weitere Quellenevidenz spekulativ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, während „Auch du sollst … gebieten“ den ge'ezischen Imperativ idiomatisch wiedergibt. Die Unvollständigkeit des Quellenausschnitts wird nicht stillschweigend behoben.
