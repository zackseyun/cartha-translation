  text: She did not bear children, and she said to Jacob, “Give me children.” And Jacob said, “Have I withheld from you?”
translation:
  language: de
  text: 'Sie gebar keine Kinder und sagte zu Jakob: »Gib mir Kinder!« Jakob sagte: »Habe ich sie dir etwa vorenthalten?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich endet Jakobs Antwort mit: »Habe ich dir etwa vorenthalten?« Das Objekt ist nicht ausdrücklich genannt; gemeint sind im Zusammenhang die Kinder.'
    reason: Die Fußnote bewahrt die auffällige Unvollständigkeit des überlieferten Wortlauts, während der Haupttext im Deutschen verständlich bleibt.
lexical_decisions:
- source_word: ኢትወልድ
  choice: Sie gebar keine Kinder
  rationale: Die negierte Form von „gebären“ hat im Deutschen ohne Ergänzung einen anderen Klang; „keine Kinder“ gibt den im Zusammenhang gemeinten Sinn natürlich wieder.
- source_word: ሀበኒ፡ ውሉደ
  choice: Gib mir Kinder!
  rationale: Gibt den direkten und nachdrücklichen Imperativ des Ausgangstextes knapp wieder.
- source_word: አነሁ፡ ከላእኩ፡ እምኔኪ
  choice: Habe ich sie dir etwa vorenthalten?
  rationale: „etwa“ bringt die rhetorische Färbung der vorangestellten Selbstbezeichnung zur Geltung. Das Pronomen „sie“ bezieht sich natürlich auf die zuvor genannten Kinder, obwohl das Objekt im überlieferten Wortlaut der Antwort nicht ausdrücklich wiederholt wird.
theological_decisions:
- issue: Wer für die Kinderlosigkeit verantwortlich ist
  choice: Jakobs rhetorische Frage bleibt ohne ausdrückliche Benennung Gottes stehen.
  alternative: Die aus Genesis 30,2 bekannte Aussage ergänzen, dass Jakob nicht an Gottes Stelle steht.
  rationale: Der vorliegende ge'ezische Text endet mit der Frage und enthält die ausdrückliche Gottesbeziehung nicht; eine Ergänzung würde über die gegebene Quellenevidenz hinausgehen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die direkte Rede bleibt knapp und emotional; die ungewöhnlich verkürzte Schlussfrage wird nicht durch aus Parallelüberlieferungen bekannte Worte erweitert.
