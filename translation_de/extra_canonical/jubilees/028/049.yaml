  text: And the Lord remembered Rachel and opened her womb, and she conceived and bore a son, and she called his name
translation:
  language: de
  text: Und der Herr gedachte Rahels und öffnete ihren Mutterleib. Sie wurde schwanger und gebar einen Sohn, und sie gab ihm den Namen
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Die übliche und würdige deutsche Wiedergabe der Gottesbezeichnung in diesem Kontext.
- source_word: ለራሔል
  choice: an Rahel
  rationale: In Verbindung mit dem im englischen Konsultationstext bezeugten Sinn ‚gedachte/erinnerte sich‘ bezeichnet die Form Rahel als Gegenstand des göttlichen Gedenkens.
- source_word: አርኀወ ማኅፀና
  choice: öffnete ihren Mutterschoß
  rationale: Bewahrt das konkrete biblische Bild des geöffneten Mutterschoßes, klingt dabei im heutigen Deutsch natürlicher als ‚öffnete ihren Leib‘.
- source_word: ፀንሰት
  choice: Sie wurde schwanger
  rationale: Natürliche moderne Wiedergabe des Verbs für Empfangen beziehungsweise Schwangerwerden.
- source_word: ወለደት ወልደ
  choice: gebar einen Sohn
  rationale: Gibt Verb und männliches Kind ausdrücklich und knapp wieder.
- source_word: ጸውዐት ስሞ
  choice: sie gab ihm den Namen
  rationale: Natürliches deutsches Namengebungsidiom; die im überlieferten Ausschnitt fehlende Namensangabe wird nicht ergänzt.
theological_decisions:
- issue: Göttliches Gedenken an Rahel
  choice: dachte an Rahel
  alternative: erinnerte sich an Rahel
  rationale: ‚Dachte an‘ vermeidet im modernen Deutsch den möglichen Eindruck, Gott habe Rahel zuvor vergessen, und bewahrt dennoch das biblische Motiv des wirksamen Gedenkens.
- issue: Öffnung des Mutterschoßes
  choice: öffnete ihren Mutterschoß
  alternative: machte sie fruchtbar
  rationale: Die bildhafte und theologisch spannungsvolle Aussage göttlichen Handelns wird nicht durch eine abstraktere Deutung ersetzt.
- issue: Unvollständiger Satzschluss
  choice: endet mit ‚den Namen‘ ohne Ergänzung
  alternative: den aus dem Folgekontext bekannten Namen ergänzen
  rationale: Der vorgelegte Quellenausschnitt endet an dieser Stelle; die Übersetzung bewahrt diese Textgrenze und ergänzt nichts stillschweigend.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzgliederung wurde für natürliche deutsche Lesbarkeit angepasst; der unvollständige Schluss des Quellenausschnitts bleibt erhalten.
