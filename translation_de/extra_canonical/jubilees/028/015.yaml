translation:
  language: de
  text: Er lässt Sünde gegen sich selbst in den Himmel aufsteigen[a], und niemand, der dies tut, ist gerecht; denn
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er lässt Sünde seinetwegen in den Himmel aufsteigen.“'
    reason: Die Präpositionalwendung kann sowohl den gegen ihn gerichteten Bezug als auch allgemeiner den Bezug „seinetwegen“ ausdrücken.
lexical_decisions:
- source_word: አበሳ
  choice: Sünde
  rationale: Das Substantiv bezeichnet Sünde bzw. Schuld; „Sünde“ passt hier zum himmlischen Anklagekontext und lässt den Schuldaspekt mitschwingen.
- source_word: ያዐርግ
  choice: lässt … aufsteigen
  rationale: 'Die Kausativform verlangt eine transitive Wiedergabe: Der Handelnde bewirkt, dass die Sünde zum Himmel aufsteigt.'
- source_word: በእንቲአሁ
  choice: gegen sich selbst
  rationale: Die Wendung bezeichnet hier den Bezug der Sünde auf den Handelnden, also dass sie zu seiner eigenen Belastung oder Anklage aufsteigt.
- source_word: ዘይጸድቅ
  choice: ist gerecht
  rationale: Die prädikative Wiedergabe bewahrt die Aussage, dass niemand, der so handelt, als gerecht gelten kann.
- source_word: ዘንተ፡ ነገረ
  choice: dies tut
  rationale: Wörtlich steht „diese Sache/dieses Ding tut“; idiomatisches Deutsch drückt dies knapp mit „dies tut“ aus.
theological_decisions:
- issue: Verhältnis von Tat und Gerechtigkeit
  choice: „niemand, der dies tut, ist gerecht“
  alternative: „kein Gerechter tut dies“
  rationale: Die gewählte Fassung bewahrt die deklarative Stoßrichtung des Ausgangstextes, ohne eine weitergehende konfessionelle Lehre über Rechtfertigung oder den Status des Täters einzutragen.
- issue: Zum Himmel aufsteigende Sünde als Anklage
  choice: Bildsprache unverändert beibehalten
  alternative: paraphrasieren als „seine Schuld wird im Himmel gegen ihn angerechnet“
  rationale: Der Quelltext spricht bildhaft vom kausativ bewirkten Aufsteigen der Sünde; eine erklärende Paraphrase würde das Bild und seine mögliche Spannung einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der abschließende Anschluss „denn“ bleibt erhalten, weil der überlieferte Versausschnitt syntaktisch in den folgenden Text weiterführt.
