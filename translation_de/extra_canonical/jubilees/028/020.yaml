- source_word: ሰቡዕ፡ ዕለት
  choice: die sieben Tage
  rationale: Bewahrt die ausdrückliche Siebenzahl und vermeidet, die Wendung lediglich mit „Woche“ zu paraphrasieren.
- source_word: ዘግዝአ፡ ዘልያ
  choice: von Leas Hochzeitsfest
  rationale: Die äthiopische Wendung bezeichnet die zu Lea gehörige Hochzeits- beziehungsweise Festzeit; „Hochzeitsfest“ macht den erzählerischen Zusammenhang in natürlichem Deutsch deutlich.
- source_word: ኀለፈ
