  text: '[He took] Leah his elder daughter, and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.'
translation:
  language: de
  text: '[Er nahm][a] Lea, seine ältere Tochter, und gab sie Jakob zur Frau und gab ihr seine Sklavin Silpa als Dienerin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Worte „Er nahm“ sind zur Vervollständigung des durch die Verseinteilung unterbrochenen Satzes aus dem Zusammenhang ergänzt. Wörtlich beginnt der Vers: „Lea, seine ältere Tochter, und gab sie …“'
    reason: Die überlieferte Versgrenze trennt das Objekt vom vorausgehenden Verb und lässt den Vers für sich genommen als Satzfragment beginnen.
lexical_decisions:
- source_word: እንተ፡ ትልህቅ
  choice: seine ältere Tochter
  rationale: Die Wendung bezeichnet Lea im Verhältnis zur jüngeren Tochter als die ältere; dies entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: ብእሲተ
  choice: zur Frau
  rationale: Das Substantiv bezeichnet hier die Ehefrau; „zur Frau geben“ gibt die Heiratsformel knapp und idiomatisch wieder.
- source_word: አመተ
  choice: Sklavin
  rationale: Der Ausdruck bezeichnet eine unfreie weibliche Hausangehörige; „Sklavin“ macht ihren sozialen Status deutlicher als das heute mehrdeutige „Magd“.
- source_word: ለእኪት
  choice: als Dienerin
  rationale: Der zweite Dienstbegriff beschreibt Silpas Aufgabe für Lea und wird zur Unterscheidung vom zuvor genannten sozialen Status mit „Dienerin“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ergänzung am Versanfang ist durch eckige Klammern transparent gekennzeichnet; der Unterschied zwischen Silpas sozialem Status und ihrer Aufgabe für Lea bleibt erhalten.
