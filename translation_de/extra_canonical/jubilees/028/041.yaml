  text: Auch sie nahm ihre Dienerin Silpa und gab sie Jakob zur Frau; sie wurde schwanger und gebar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲኒ
  choice: Auch sie
  rationale: Das selbstständige feminine Pronomen mit der enklitischen Partikel -ni bedeutet hier „auch sie“ und hebt die Parallele zur vorausgehenden Handlung hervor.
- source_word: ዜልፋሃ
  choice: Silpa
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: ለአኪታ
  choice: ihre Dienerin
  rationale: Gibt das feminine Dienstverhältnis natürlich und sachlich wieder; „Magd“ wäre möglich, klingt heute aber altertümlicher.
- source_word: ብእሲተ
  choice: zur Frau
  rationale: Entspricht der ehelichen Bezeichnung im Kontext und wahrt die knappe Formulierung der Vorlage.
- source_word: ወፀንሰት፡ ወወለደት
  choice: und sie wurde schwanger und gebar
  rationale: Bildet die beiden aufeinanderfolgenden Verben eng und in idiomatischem Deutsch ab.
theological_decisions:
- issue: Bezug des mit „auch“ ausgedrückten Zusatzes
  choice: „Auch sie“ bezieht die Partikel auf das ausdrücklich gesetzte feminine Subjekt.
  alternative: „Sie nahm und gab auch ihre Dienerin Silpa …“
  rationale: Die Form ይእቲኒ verbindet das feminine Pronomen „sie“ unmittelbar mit der Partikel „auch“; die gewählte Stellung bewahrt diese Hervorhebung, ohne die Handlung weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und narrativ. Der Satz bleibt wie die überlieferte Verseinteilung nach „gebar“ offen und ergänzt kein in diesem Textausschnitt nicht genanntes Objekt.
