  text: Als Erstes[a] im sechsten Jahr dieser Jahrwoche. Jakob ging wieder zu ihr ein, und sie wurde schwanger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erstens“. Die Angabe schließt möglicherweise an den vorhergehenden Satz an.'
