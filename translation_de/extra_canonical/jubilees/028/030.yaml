lexical_decisions:
- source_word: ቀዳማዊ
  choice: Als Erstes
  rationale: Gibt die im segmentierten Ge’ez-Text ausdrücklich vorhandene Ordnungsangabe wieder, ohne sie stillschweigend auszulassen; die isolierte Form wirkt wahrscheinlich als Anschluss an den vorherigen Kontext.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet hier eine Siebenerperiode von Jahren; „Jahrwoche“ ist im Deutschen knapp, verständlich und für die chronologische Struktur des Jubiläenbuches präzise.
- source_word: ደገመ
  choice: wieder
  rationale: Bewahrt die Wiederholungsbedeutung des Verbs beziehungsweise Adverbs im Zusammenhang mit Jakobs erneutem Eingehen zu ihr.
- source_word: ቦአ ኀቤሃ
  choice: ging zu ihr ein
  rationale: Erhält den würdevollen biblischen Euphemismus für Geschlechtsverkehr und bleibt nahe an der räumlichen Ausdrucksweise des Ge’ez.
- source_word: ፀንሰት
  choice: sie wurde schwanger
  rationale: Natürliche moderne deutsche Wiedergabe des Verbs „empfangen/schwanger werden“.
