  text: to my father’s house.” And Laban said to Jacob, “Stay with me for your wages, and pasture my flock for me again.”
translation:
  language: de
  text: 'zum Haus meines Vaters“. Und Laban sagte zu Jakob: »Bleib bei mir für deinen Lohn und hüte wieder meine Herde für mich«.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤተ፡ አቡየ
  choice: zum Haus meines Vaters
  rationale: Die Genitivverbindung bezeichnet das väterliche Haus beziehungsweise den väterlichen Haushalt; die knappe Wiedergabe wahrt den Satzanschluss aus dem vorherigen Kontext.
- source_word: ንበር፡ ኀቤየ፡ በዐስብከ
  choice: Bleib bei mir gegen deinen Lohn
  rationale: ንበር ኀቤየ bedeutet »bleib/wohne bei mir«; በዐስብከ bezeichnet die Gegenleistung als Jakobs Lohn. »Gegen deinen Lohn« ist idiomatisch und erhält das Arbeitsverhältnis.
- source_word: ወረዐይ፡ ሊተ፡ ካዕበ፡ መርዔትየ
  choice: und hüte mir wieder meine Herde
  rationale: Das Verb bezeichnet das Hüten beziehungsweise Weiden, ሊተ markiert den Begünstigten »für mich«, ካዕበ bedeutet »wieder«, und መርዔትየ ist »meine Herde«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers beginnt als Fortsetzung einer im vorigen Abschnitt eröffneten direkten Rede; deshalb steht am Anfang kein öffnendes Anführungszeichen, aber nach »Vaters« ein schließendes. Labans anschließende direkte Rede wird klar abgegrenzt.
