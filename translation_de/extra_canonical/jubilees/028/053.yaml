  source_fidelity: 'Der Entwurf gibt den überlieferten geʿezischen Text insgesamt zutreffend wieder: den Abschluss der vorangehenden Rede (»Haus meines Vaters«), Labans Aufforderung zum Bleiben, die Entlohnung, das erneute Hüten sowie die possessiven Bezüge. „gegen deinen Lohn“ ist verständlich, klingt jedoch weniger unmittelbar als die im Deutschen natürliche Formulierung „für deinen Lohn“.'
  naturalness: Die Wortstellung „hüte mir wieder meine Herde“ ist verständlich, aber in modernem Standarddeutsch leicht altertümlich. „Hüte wieder meine Herde für mich“ ist natürlich und bewahrt sowohl den Nutznießer als auch „wieder“. Die Zeichensetzung der direkten Rede wird an die deutsche Konvention angepasst.
