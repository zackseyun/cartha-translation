lexical_decisions:
- source_word: ሥሩዕ
  choice: festgesetzt
  rationale: Gibt den Sinn einer verbindlichen Anordnung natürlich und würdig wieder.
- source_word: ጽሑፍ
  choice: geschrieben
  rationale: Bewahrt die ausdrückliche Doppelung von Festsetzung und schriftlicher Niederlegung.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Entspricht der wörtlichen Bildsprache des ge'ezischen Textes.
- source_word: ወለተ፡ እንተ፡ ትንእስ
  choice: die jüngere Tochter
  rationale: Gibt die relationale Bezeichnung wieder, ohne einen im überlieferten Satzausschnitt nicht ausdrücklich genannten Vergleich hinzuzufügen.
theological_decisions:
- issue: Autorität der himmlischen Tafeln
  choice: festgesetzt und geschrieben
  alternative: angeordnet und verzeichnet
  rationale: Die gewählte Fassung erhält sowohl den normativen als auch den schriftlichen Aspekt, ohne eine konfessionelle Deutung einzutragen.
- issue: Unvollständiger Gegenstand des Gebens im Satzausschnitt
  choice: die jüngere Tochter geben soll
  alternative: seine jüngere Tochter zur Frau geben soll
  rationale: Der Ausgangstext sagt hier nur „geben“; die eheliche Bedeutung ist aus dem Kontext erschließbar, wird aber nicht ausdrücklich ergänzt.
