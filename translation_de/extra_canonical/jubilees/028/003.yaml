lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet im chronologischen System des Jubiläenbuches eine aus sieben Jahren bestehende Woche; »Jahrwoche« gibt diesen Fachbegriff knapp und verständlich wieder.
- source_word: ሀበኒ
  choice: Gib mir
  rationale: Entspricht dem direkten Imperativ des geezischen Textes.
- source_word: ብእሲትየ
  choice: meine Frau
  rationale: Gibt die Verbindung aus »Frau/Ehefrau« und dem Possessivsuffix natürlich wieder; im Kontext ist die zur Ehe versprochene Frau gemeint.
- source_word: ተቀነይኩ፡ ለከ
  choice: ich dir gedient habe
  rationale: Bewahrt sowohl den Dienstbegriff als auch den ausdrücklich genannten Empfänger des Dienstes.
