  text: Joseph, Jacob said to Laban, “Give me my wives and my children, and I will go to my father Isaac, and I will make.”
translation:
  language: de
  text: 'Josef[a]. Jakob sagte zu Laban: »Gib mir meine Frauen und meine Kinder, dann will ich zu meinem Vater Isaak gehen und … machen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Versabschnitt beginnt lediglich mit »Josef«; wahrscheinlich setzt der Name einen Satz aus dem vorhergehenden Abschnitt fort.
    reason: Der bereitgestellte ge'ezische Text beginnt mitten im syntaktischen Zusammenhang; die Fußnote kennzeichnet die Segmentgrenze, ohne fehlende Wörter in den Haupttext einzufügen.
  - marker: b
    text: 'Wörtlich: »und ich werde machen«; der Satz wird offenbar erst im folgenden Abschnitt vervollständigt.'
    reason: Die ge'ezische Verbform bedeutet »tun/machen«. Die Auslassungspunkte bewahren den erkennbar unvollständigen Satz, statt ihn irrtümlich als »zurückkehren« zu deuten.
lexical_decisions:
- source_word: ዮሴፍ
  choice: Josef
  rationale: Der überlieferte Ausschnitt enthält nur den Namen; eine zeitliche Ergänzung wie »Als Josef geboren wurde« steht hier nicht im ge’ezischen Text.
- source_word: ሀበኒ
  choice: Gib mir
  rationale: Direkte und natürliche Wiedergabe des Imperativs mit Objektsuffix der ersten Person Singular.
- source_word: አንስትየየ፡ ወውሉድየ
  choice: meine Frauen und meine Kinder
  rationale: Gibt die Possessivformen und die beiden koordinierten Plurale unmittelbar wieder.
- source_word: ወእሖር
  choice: dann will ich … gehen
  rationale: Das ge’ezische Verb bezeichnet das Gehen; »dann« stellt im Deutschen den natürlichen Anschluss an die Aufforderung her, ohne eine Rückkehr in den Text einzutragen.
- source_word: ወእግበር
  choice: und … machen
  rationale: Die Form gehört zu ገብረ, »tun/machen«, nicht zu einem Verb für »zurückkehren«. Da das erwartete Objekt außerhalb des gelieferten Versabschnitts liegt, bleibt die Aussage sichtbar unvollständig.
