  text: Rachel, Bilhah, the sister of Zilpah, as a maidservant. And he served another seven years for
translation:
  language: de
  text: Rahel – Bilha, die Schwester Silpas, als Dienerin.[a] Und er diente nochmals sieben Jahre für …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers beginnt mitten im Satz. Gemeint ist dem Zusammenhang nach, dass Laban Rahel Bilha als Dienerin gab.
    reason: Die Kapitel- beziehungsweise Versaufteilung trennt die Satzkonstruktion; die Anmerkung erklärt den Zusammenhang, ohne das fehlende Verb in den Haupttext einzusetzen.
lexical_decisions:
- source_word: ለአኪት
  choice: als Dienerin
  rationale: Die Funktionsangabe wird in natürlichem, würdigem Deutsch wiedergegeben; »Dienerin« ist heute verständlicher und weniger missverständlich als »Magd«.
- source_word: ወትቀንየ
  choice: Und er diente
  rationale: Das Verb bezeichnet hier Jakobs vertraglich geschuldeten Dienst bei Laban; »diente« bewahrt den Anschluss an die biblische Erzählweise.
- source_word: ዳግመ
  choice: nochmals
  rationale: Gibt die Wiederholung des siebenjährigen Dienstes knapp und idiomatisch wieder.
theological_decisions:
- issue: Im Versanfang fehlt infolge der Versabgrenzung ein finites Verb.
  choice: Den fragmentarischen Anschluss mit einem Gedankenstrich bewahren und kein Subjekt oder Verb ergänzen.
  alternative: »Rahel gab Bilha …« oder »Laban gab Rahel Bilha …«
  rationale: »Rahel gab« widerspräche dem Erzählzusammenhang; »Laban gab« wäre zwar kontextuell plausibel, steht aber nicht im vorgelegten Verssegment. Die offene Konstruktion wahrt die Textgestalt, ohne eine Ergänzung als ausdrücklich überliefert auszugeben.
- issue: Der Vers endet mitten in einer Präpositionalfügung.
  choice: Den Abbruch mit Auslassungspunkten sichtbar lassen.
  alternative: Das Objekt aus dem folgenden Vers ergänzen.
  rationale: Die Quelle endet nach »für«; eine Ergänzung würde Text aus dem nächsten Segment vorwegnehmen.
translation_notes:
  register: Modernes Standarddeutsch mit schlichter, würdiger Erzählweise. Die Eigennamen folgen den im Deutschen geläufigen Formen Rahel, Bilha und Silpa. Beide durch die Segmentierung entstandenen Satzfragmente bleiben erkennbar.
