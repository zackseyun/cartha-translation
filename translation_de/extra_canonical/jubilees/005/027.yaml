lexical_decisions:
- source_word: ማያት
  choice: das Wasser
  rationale: Das ge’ezische Wort bezeichnet hier kollektiv die Flutwassermassen; im Deutschen ist der kollektive Singular natürlich und entspricht auch dem Erzählzusammenhang.
- source_word: ይቀውም
  choice: blieb … stehen
  rationale: Die Verbform beschreibt ein fortdauerndes Stehen beziehungsweise Verharren. „Blieb stehen“ gibt diesen zeitlichen Zustand idiomatisch wieder.
- source_word: ዲበ፡ ገጸ፡ ምድር
  choice: auf der Erdoberfläche
  rationale: Wörtlich steht „auf dem Angesicht der Erde“. „Auf der Erdoberfläche“ bewahrt den räumlichen Sinn in natürlichem modernem Deutsch.
- source_word: ኃምስተ፡ አውራኀ፡ ምእተ፡ ወኃምሳ፡ ዕለተ
  choice: fünf Monate lang, hundertfünfzig Tage
  rationale: Beide Zeitangaben werden ohne erklärende Harmonisierung wiedergegeben; „lang“ kennzeichnet die erste Angabe eindeutig als Dauer.
