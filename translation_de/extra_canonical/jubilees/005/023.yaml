  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: de
  text: Und er trat in dessen sechstem Jahr[a], im zweiten Monat, beim Neumond des zweiten Monats bis zum sechzehnten Tag ein; und er trat, er und alles, was wir zu ihm gebracht hatten, in die Arche ein, und der Herr verschloss sie am Abend des siebzehnten Tages von außen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangabe dieses Verses ist schwer zu gliedern. Das „sechste Jahr“ gehört wahrscheinlich zur Chronologie der vorausgehenden Verse. Neumond, sechzehnter Tag und der Abend des siebzehnten Tages bezeichnen offenbar die Zeit des Einzugs in die Arche und ihres Verschließens unmittelbar vor dem Beginn der Flut.
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ፡ ሎቱ
  choice: in dessen sechstem Jahr
  rationale: በሳድስ bedeutet ausdrücklich „im sechsten“; der Bezug wird nicht an Genesis 7,6 angeglichen. Das Pronomen ሎቱ bleibt mit „dessen“ bewusst offen.
- source_word: በሠርቅ፡ ለካልእ፡ ወርኀ
  choice: beim Neumond des zweiten Monats
  rationale: ሠርቅ bezeichnet hier den Monatsbeginn beziehungsweise Neumond. „Neumond“ bewahrt den für den Kalender des Jubiläenbuches wichtigen Ausdruck besser als die bloße Angabe „am ersten Tag“.
- source_word: እስከ፡ አመ፡ ዐሡሩ፡ ወስዱሱ
  choice: bis zum sechzehnten Tag
  rationale: Gibt die Grenzangabe እስከ („bis“) und die Ordinaldatierung möglichst direkt wieder, ohne die schwierige zeitliche Gliederung zu glätten.
- source_word: ወዐጸዎ፡ እግዚአብሔር፡ እንተ፡ አፍአሁ
  choice: und der Herr verschloss sie … von außen
  rationale: Bewahrt sowohl den göttlichen Handelnden als auch die ausdrückliche Außenperspektive des ge'ezischen Textes.
theological_decisions:
- issue: Sechstes Jahr oder sechshundertstes Jahr Noahs
  choice: sechstes Jahr
  alternative: sein sechshundertstes Jahr
  rationale: Die überlieferte ge'ezische Form በሳድስ bedeutet „im sechsten“. Eine Wiedergabe als „sechshundertstes“ wäre eine Harmonisierung mit Genesis 7,6 und nicht quellengemäß.
- issue: Bezug von „dessen“
  choice: Der Bezug bleibt im Haupttext offen.
  alternative: ausdrückliche Ergänzung „der Jahrwoche“
  rationale: Der unmittelbare chronologische Zusammenhang kann eine Jahrwoche nahelegen, doch die vorliegende Formulierung nennt sie in diesem Vers nicht ausdrücklich. Die Übersetzung wahrt daher die grammatische Unbestimmtheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Eintrittsformulierung und die schwierige Abfolge der Datumsangaben werden nicht harmonisierend beseitigt; „Dann“ macht lediglich den neuen Satzansatz lesbar.
