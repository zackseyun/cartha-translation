  source_fidelity: Die Wiedergabe von በሳድስ als „sechstem“ und von በሠርቅ als „Neumond“ ist quellentreu und vermeidet eine unangemessene Harmonisierung mit Genesis. Die Wiederholung von ወቦአ („und er trat ein“) sollte jedoch auch im Deutschen erkennbar bleiben. „Dann ging er“ glättet sowohl die Wiederholung als auch die ausdrücklich koordinierende Struktur des Textes unnötig.
