  terminology: „Arche“, „Herr“, „Neumond“ und „Flut“ sind angemessen. „dessen sechstem Jahr“ bewahrt den im Vers nicht eindeutig explizierten Bezug, auch wenn die Formulierung bewusst etwas formell wirkt.
