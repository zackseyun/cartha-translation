  yaml_path: translation/extra_canonical/jubilees/005/013.yaml
  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: de
  text: Und dies alles setzte er fest und schrieb es auf die himmlischen Tafeln; und es gibt keine Ungerechtigkeit.[a] Und alle, die von dem Weg abweichen, den er für sie festgesetzt hat, damit sie auf ihm gehen—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei anderer Gliederung: „und es gibt keine Ungerechtigkeit für alle, die abweichen“.'
    reason: Die mögliche syntaktische Verbindung wurde traditionell unterschiedlich aufgefasst; die Hauptfassung folgt jedoch dem wiederholten „und“ als Beginn eines neuen Satzteils.
lexical_decisions:
- source_word: ሠርዐ (śarʿa)
  choice: legte … fest / festgelegt hat
  rationale: Die Wiederholung desselben geʿezischen Verbs wird auch im Deutschen bewahrt. „Festlegen“ passt sowohl zur göttlichen Anordnung als auch zu dem für Menschen bestimmten Weg.
- source_word: ጽላተ፡ ሰማይ (ṣallāta samāy)
  choice: himmlische Tafeln
  rationale: Formnahe und im Kontext des Jubiläenbuches etablierte Wiedergabe für die im Himmel befindlichen beziehungsweise himmlischen Tafeln.
- source_word: ዐመፃ (ʿamaṣā)
  choice: Ungerechtigkeit
  rationale: Gibt den moralisch-rechtlichen Sinn wieder, ohne ihn auf bloße Fehlerhaftigkeit oder ein bestimmtes dogmatisches Konzept einzuengen.
- source_word: ተዐደዉ፡ እምፍኖተ (taʿaddawu ʾəm-fənota)
  choice: von dem Weg abweichen
  rationale: Bewahrt das Bild des Verlassens beziehungsweise Überschreitens eines vorgegebenen Weges in natürlichem modernem Deutsch.
theological_decisions:
- issue: Bezug der Aussage „es gibt keine Ungerechtigkeit“
  choice: Als eigenständige Aussage abgeschlossen; der folgende Satzteil beginnt mit „Und alle …“
  alternative: „Und es gibt keine Ungerechtigkeit für alle, die …“
  rationale: Das wiederholte geʿezische ወ („und“) vor „alle“ eröffnet einen neuen Satzteil. Eine Verbindung durch „für“ könnte fälschlich nahelegen, das Abweichen vom Weg sei nicht ungerecht oder den Abweichenden widerfahre grundsätzlich kein Unrecht.
- issue: Nicht abgeschlossener Gedanke am Versende
  choice: Gedankenstrich am Versende
  alternative: Abschließender Punkt
  rationale: Der geʿezische Satzteil bleibt syntaktisch offen und wird erst im folgenden Vers weitergeführt. Der Gedankenstrich macht dies sichtbar, ohne den fehlenden Inhalt vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung wahrt die lexikalische Wiederholung von ሠርዐ, trennt die Aussage über Ungerechtigkeit vom folgenden Relativsatz und kennzeichnet den über die Versgrenze hinausreichenden Satz durch einen Gedankenstrich.
