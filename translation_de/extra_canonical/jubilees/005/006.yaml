  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: de
  text: Über seine Engel aber, die er auf die Erde gesandt hatte, wurde er überaus zornig und entzog ihnen ihre ganze Herrschaft. Und er sagte uns, wir sollten sie in den Tiefen der Erde binden.[a] Und siehe, darin sind sie gebunden und abgesondert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „uns“ gehört zum Offenbarungsrahmen des Jubiläenbuches: Der vermittelnde Engel berichtet von einem Auftrag, der an ihn und weitere Engel erging.'
    reason: cross_reference
lexical_decisions:
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: sodass er ihnen ihre ganze Herrschaft entzog
  rationale: Die Wendung bezeichnet die vollständige Beseitigung beziehungsweise Entziehung ihrer Machtstellung. „Herrschaft entziehen“ gibt dies im Deutschen natürlich wieder, ohne das bildhafte „entwurzeln“ irreführend zu vergegenständlichen.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: in den Tiefen der Erde
  rationale: Die Pluralform bezeichnet unterirdische Tiefen; die Formulierung wahrt das räumliche Bild des Ausgangstextes.
- source_word: ማእከሎሙ
  choice: darin
  rationale: Das Pronomen weist auf die zuvor genannten Tiefen zurück. „Darin“ ist im modernen Deutschen natürlicher als „in ihrer Mitte“ und vermeidet einen fälschlichen Personenbezug.
- source_word: ብሕትዋን
  choice: abgesondert
  rationale: Die Wiedergabe bewahrt den knappen Zustandsausdruck des Ausgangstextes und fügt weder Zweck noch Dauer der Absonderung hinzu.
theological_decisions:
- issue: Bezug der bestraften Engel
  choice: „seine Engel, die er auf die Erde gesandt hatte“
  alternative: „die Engel, die er auf die Erde gesandt hatte“
  rationale: Das Possessivsuffix wird ausdrücklich wiedergegeben. Der Text benennt ihren früheren Zugehörigkeits- beziehungsweise Dienstbezug, ohne die Art dieses Verhältnisses weiter zu deuten.
- issue: Erste Person Plural in der göttlichen Anweisung
  choice: „er sagte uns, wir sollten sie … binden“
  alternative: 'unpersönlich: „er ließ sie … binden“'
  rationale: Die erste Person Plural gehört zum Offenbarungsrahmen des Jubiläenbuches und darf nicht eingeebnet werden; der vermittelnde Engel berichtet als Angehöriger der angesprochenen Gruppe.
- issue: Verhältnis zwischen Zorn und Entzug der Herrschaft
  choice: 'Folgebeziehung: „sodass er … entzog“'
  alternative: 'Zweckbeziehung: „um ihnen … zu entziehen“'
  rationale: Die knappe Abfolge lässt das genaue logische Verhältnis offen. Die Folgebeziehung ergibt natürliches Deutsch und entspricht dem unmittelbaren Zusammenhang, während die mögliche Zwecklesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und siehe“ bewahrt das feierliche narrative Signal des Ausgangstextes; ansonsten wurde eine klare, gegenwärtige Syntax gewählt. Sämtliche Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
