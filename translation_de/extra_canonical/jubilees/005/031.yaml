lexical_decisions:
- source_word: ወነጽፈ፡ ማያት፡ አመልዐልተ፡ ምድር
  choice: Und das Wasser zog sich von der Erde zurück
  rationale: Die Wendung beschreibt das Zurückweichen des Wassers von der Erdoberfläche. Der deutsche Singular „das Wasser“ ist als Kollektiv natürlich und bewahrt den Sinn des ge’ezischen Plurals.
- source_word: በሱባዔ፡ ኃምስ፡ በሳብዕ፡ ዓመት፡ ሎቱ
  choice: in der fünften Woche, in deren siebtem Jahr
  rationale: Die Zeitangabe wird formal bewahrt. „deren“ bezieht sich auf die fünfte Woche und gibt das ge’ezische Pronomen wieder, ohne die chronologische Spannung zu glätten.
- source_word: ወአመ፡ ዐሡሩ፡ ወሰብዑ፡ ዕለት፡ በካልእ፡ ወርኀ
  choice: und am siebzehnten Tag des zweiten Monats
  rationale: Natürliche deutsche Wiedergabe der Ordinal- und Datumsangabe.
- source_word: የብሰት፡ ምድር
  choice: war die Erde trocken
  rationale: Direkte und idiomatische Wiedergabe des Zustands der Erde.
