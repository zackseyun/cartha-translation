  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: de
  text: Und die Gesetzlosigkeit nahm auf der Erde zu, und alles Fleisch verdarb seinen Weg – von den Menschen bis zum Vieh, zu den wilden Tieren, zu den Vögeln und zu allem, was sich auf der Erde bewegt. Sie alle verdarben ihre Wege und ihre Ordnungen und begannen, einander zu verzehren. Die Gesetzlosigkeit nahm auf der Erde zu, und alles Sinnen und Denken aller Menschenkinder war alle Tage hindurch böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: Gesetzlosigkeit
  rationale: Das Wort bezeichnet Auflehnung, Unrecht bzw. Frevel. „Gesetzlosigkeit“ bewahrt hier den ethisch-kosmischen Charakter und entspricht dem wiederholten Leitbegriff.
- source_word: ኵሉ ዘሥጋ
  choice: alles Fleisch
  rationale: Die formale Wendung wird beibehalten, da sie die Gesamtheit der Lebewesen bezeichnet und zugleich den biblischen Sprachklang wahrt.
- source_word: ፍኖተ / ፍኖቶሙ
  choice: seinen Weg / ihre Wege
  rationale: „Weg“ gibt sowohl die konkrete Lebensweise als auch deren moralische Ausrichtung wieder.
- source_word: ሥርዐቶሙ
  choice: ihre Ordnungen
  rationale: Das Wort kann Ordnung, Satzung oder festgelegte Lebensordnung meinen. „Ordnungen“ lässt offen, ob natürliche oder gesetzte Ordnung gemeint ist.
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: einander zu fressen
  rationale: Die Formulierung bezeichnet wechselseitiges Verzehren. „Fressen“ ist angesichts der ausdrücklich einbezogenen Tiere natürlicher als „verschlingen“, ohne die Härte abzuschwächen.
- source_word: ሕሊና አእምሮ
  choice: Sinnen und Denken
  rationale: Die gekoppelte Wendung betrifft innere Vorstellung, Absicht und Gedankenbildung. Die Paarformel erhält die semantische Breite, ohne künstlich zwischen Herz und Verstand aufzuteilen.
- source_word: እጓለ እመሕያው
  choice: Menschenkinder
  rationale: Die traditionelle äthiopische Bezeichnung für Menschen wird als „Menschenkinder“ wiedergegeben; so bleibt die kollektive und genealogisch klingende Ausdrucksweise erhalten.
- source_word: ኵሉ መዋዕለ
  choice: alle Tage
  rationale: Die wörtlich-nahe Zeitangabe bezeichnet fortwährende Dauer und wird idiomatisch knapp wiedergegeben.
theological_decisions:
- issue: Umfang der Verderbnis
  choice: „alles Fleisch“ umfasst im Kontext Menschen und Tierwelt
  alternative: Beschränkung der moralischen Verderbnis auf Menschen
  rationale: Der Ausgangstext zählt ausdrücklich Menschen, Vieh, wilde Tiere, Vögel und alles sich Bewegende auf. Die ungewöhnliche Spannung einer auch die Tierwelt betreffenden Verderbnis darf nicht harmonisierend beseitigt werden.
- issue: Art der verdorbenen „Ordnungen“
  choice: Mehrdeutigkeit zwischen natürlicher und normativer Ordnung bewahren
  alternative: „Gesetze“ oder „Sitten“
  rationale: Eine konfessionelle oder systematische Festlegung wäre enger als der Quellbegriff. „Ordnungen“ erhält die kosmische wie ethische Lesart.
- issue: Inneres menschliches Böse
  choice: „alles Sinnen und Denken ... war so böse“
  alternative: „jede Einbildung der Gedanken ihres Herzens war nur böse“
  rationale: Die Übersetzung folgt der vorliegenden geezischen Paarformel und importiert nicht ohne Not den genaueren Wortlaut einer möglichen Genesis-Parallele.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit bewusst bewahrten biblischen Wendungen wie „alles Fleisch“ und „Menschenkinder“. Die langen Aufzählungen und Wiederholungen bleiben als rhetorische Merkmale des Ausgangstextes erhalten; die Zeichensetzung erleichtert jedoch das heutige Lesen.
