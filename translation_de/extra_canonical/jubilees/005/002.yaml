  to: Und die Gesetzlosigkeit nahm auf der Erde zu, und alles Fleisch verdarb seinen Weg – von den Menschen bis zum Vieh, zu den wilden Tieren, zu den Vögeln und zu allem, was sich auf der Erde bewegt. Sie alle verdarben ihre Wege und ihre Ordnungen und begannen, einander zu verzehren. Die Gesetzlosigkeit nahm auf der Erde zu, und alles Sinnen und Denken aller Menschenkinder war alle Tage hindurch böse.
