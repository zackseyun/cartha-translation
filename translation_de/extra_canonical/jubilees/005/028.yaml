  text: And the ark went and came to rest on the summit of Lubar, one of the mountains of Ararat.
translation:
  language: de
  text: Und die Arche zog weiter und kam auf dem Gipfel des Lubar zur Ruhe, eines der Berge von Ararat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረት፡ ታቦት፡
  choice: Und die Arche zog weiter
  rationale: Das Verb ሖረ kann Bewegung im Sinn von »gehen/ziehen« ausdrücken. »zog weiter« gibt die fortgesetzte Bewegung der Arche natürlich wieder, ohne ein bestimmtes Fortbewegungsmittel einzutragen.
- source_word: ወአዕረፈት፡
  choice: und kam … zur Ruhe
  rationale: Die Form bezeichnet Ruhen beziehungsweise Zur-Ruhe-Kommen; die deutsche Wendung bewahrt hier den Übergang von der Bewegung zum Stillstand.
- source_word: ዲበ፡ ርእሰ፡ ሉባር፡
  choice: auf dem Gipfel des Lubar
  rationale: Wörtlich steht »auf dem Kopf/Gipfel des Lubar«; bei einem Berg ist »Gipfel« die natürliche räumliche Entsprechung.
- source_word: አሐዱ፡ እምአድባረ፡ አራራት።
  choice: eines der Berge von Ararat
  rationale: Die partitive Konstruktion bezeichnet Lubar als einen aus der Gruppe der Berge von Ararat. »von Ararat« lässt offen, ob Ararat als Gebiet oder Gebirgsbezeichnung verstanden wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Eigenname »Lubar« bleibt transliteriert; die geografische Formulierung wird nicht mit der geläufigeren Wendung »Berge Ararats« harmonisiert.
