  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: de
  text: Und er sandte ein Schwert unter sie, sodass jeder seinen Gefährten tötete. Sie begannen, einander zu töten, bis sie alle durch das Schwert fielen und von der Erde getilgt wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ማእከሎሙ
  choice: ein Schwert mitten unter sie
  rationale: ሰይፍ bezeichnet ein Schwert; der unbestimmte Ausdruck wird nicht zu „sein Schwert“ erweitert. ማእከሎሙ gibt die Vorstellung „in ihrer Mitte/mitten unter ihnen“ wieder.
- source_word: ፩፪ቢጹ
  choice: einer den anderen
  rationale: Der Ausdruck bezeichnet wechselseitiges Töten unter den Beteiligten; die natürliche deutsche Form bewahrt den individuellen Sinn.
- source_word: ወተደምሰሱ፡ እምነ፡ ምድር
  choice: und von der Erde getilgt wurden
  rationale: Die Wendung beschreibt vollständige Beseitigung beziehungsweise Auslöschung von der Erde; „getilgt“ wahrt den würdigen erzählerischen Ton.
theological_decisions:
- issue: Urheber des gesandten Schwertes
  choice: Das Subjekt bleibt schlicht „er“.
  alternative: Den im weiteren Kontext gemeinten Handelnden ausdrücklich benennen.
  rationale: Der Vers selbst verwendet ein pronominales Subjekt; eine ausdrückliche Identifizierung würde über den vorgelegten Wortlaut hinausgehen.
- issue: Bedeutung des Schwertes
  choice: „ein Schwert“ ohne nähere Deutung
  alternative: Das Schwert als Krieg, Gericht oder eigenes Schwert des Handelnden auslegen.
  rationale: Der Ausgangstext nennt das Schwert, legt aber in diesem Satz keine zusätzliche metaphorische oder besitzanzeigende Bestimmung fest.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung des gegenseitigen Tötens bleibt erhalten, weil sie den Verlauf von der veranlassten Tat bis zur vollständigen Vernichtung nachzeichnet.
