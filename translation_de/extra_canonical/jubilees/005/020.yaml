  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: de
  text: 'Und der Herr sagte, er werde alles vernichten, was auf dem trockenen Land ist: vom Menschen bis zum Vieh, bis zu den wilden Tieren, bis zu den Vögeln des Himmels und bis zu allem, was sich auf der Erde regt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይደመስስ
  choice: vernichten werde
  rationale: Das aktive Verb der 3. Person wird als indirekte Rede mit futurischer Bedeutung wiedergegeben; so bleiben Subjekt und Handlung gegenüber einer passiven Aufforderung klar.
- source_word: ኵሎ፡ ዘዲበ፡ የብስ
  choice: alles …, was auf dem trockenen Land lebte
  rationale: የብስ bezeichnet das trockene Land bzw. Festland. Das im Deutschen ergänzte „lebte“ macht den Bezug auf die anschließend aufgezählten Lebewesen natürlich verständlich.
- source_word: እሰብእ
  choice: die Menschen
  rationale: Der Kollektivbegriff für Menschen wird im modernen Deutschen inklusiv und idiomatisch wiedergegeben.
- source_word: እንስሳ
  choice: das Vieh
  rationale: In der Gegenüberstellung mit wilden Tieren bezeichnet der Ausdruck am ehesten domestizierte Tiere.
- source_word: አራዊት
  choice: die wilden Tiere
  rationale: Die Wahl bewahrt die Unterscheidung gegenüber dem Vieh.
- source_word: አዕዋፈ፡ ሰማይ
  choice: die Vögel des Himmels
  rationale: Eine würdevolle, quellennahe Wiedergabe der festen Wendung.
- source_word: ዘይትሐወስ፡ ውስተ፡ ምድር
  choice: alles, was sich auf der Erde regte
  rationale: „Sich regen“ gibt die Bewegungskategorie natürlich wieder, ohne sie unnötig auf eine bestimmte Tierart zu verengen.
theological_decisions:
- issue: Direkte oder indirekte Rede und Handlungsrichtung
  choice: 'Indirekte Rede: Der Herr sagte, dass er selbst alles vernichten werde.'
  alternative: 'Direkte passive Aufforderung: „Alles … soll vernichtet werden.“'
  rationale: Die überlieferte ge'ezische Form ist ein aktives Verb der 3. Person mit „alles“ als Objekt. Daher ist die aktive indirekte Rede grammatisch vorzuziehen und vermeidet eine unbegründete Verschiebung der handelnden Person.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung wurde ohne wiederholtes „bis zu“ gestaltet, da dies im Deutschen flüssiger ist; ihr umfassender Charakter bleibt erhalten. Keine konfessionell geprägte Terminologie.
