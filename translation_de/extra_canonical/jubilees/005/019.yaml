  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: de
  text: Doch all denen, die vor der Flut[a] ihre Wege und ihre Pläne verdorben hatten, wurde keine Gunst erwiesen – außer Noah allein. Denn ihm wurde zugunsten seiner Söhne[b] Gunst erwiesen; sie wurden um seinetwillen aus den Wassern der Flut gerettet. Sein Herz war nämlich auf all seinen Wegen gerecht, entsprechend dem, was ihm geboten worden war, und er wich von nichts ab, was für ihn festgesetzt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wiedergabe „vor der Flut“ deutet eine schwierige Formulierung aus, in der die „Wasser der Flut“ anklingen. Gemeint ist, dass in jener Generation außer Noah niemand wohlwollend angesehen wurde.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „im Hinblick auf seine Söhne“; gemeint ist hier nicht, dass Noah ihretwegen Gunst erhielt, denn anschließend wird ihre Rettung Noah zugerechnet.'
    reason: previous_rendering
lexical_decisions:
- source_word: ተነሥአ፡ ገጸ
  choice: Gunst wurde erwiesen
  rationale: Die Wendung bedeutet wörtlich etwa „das Angesicht wurde erhoben“ und bezeichnet hier wohlwollende Beachtung oder Gunst. „Gunst erweisen“ ist im Deutschen natürlich und vermeidet die unpassende Nebenbedeutung von „Parteilichkeit“.
- source_word: ምክርሙ
  choice: ihre Pläne
  rationale: Das Substantiv kann Rat, Entschluss oder Plan bezeichnen; parallel zu den verdorbenen Wegen passt hier „Pläne“.
- source_word: በእንተ፡ ውሉዱ
  choice: zugunsten seiner Söhne
  rationale: Die Präposition bezeichnet hier den Bezug oder das Handeln für die Söhne; der folgende Satzteil macht deutlich, dass Noah und nicht seine Söhne der Grund ihrer Rettung war.
- source_word: ጻድቅ፡ ይእቲ፡ ልቡ
  choice: Sein Herz war gerecht
  rationale: Bewahrt die körperlich-moralische Metapher und die Aussage des Ausgangstextes ohne sie zu „aufrichtig“ oder „rechtschaffen“ umzudeuten.
- source_word: ኢተዐደወ
  choice: er wich … nicht ab
  rationale: Gibt die Vorstellung des Überschreitens oder Abweichens idiomatisch wieder und passt zur anschließenden Norm „was für ihn festgesetzt war“.
theological_decisions:
- issue: Handelnder bei der Rettung der Söhne
  choice: 'Passiv: „sie wurden … gerettet“'
  alternative: „er rettete sie“ mit Gott oder Noah als möglichem Bezug
  rationale: Die ge’ezische Verbform hat ein maskulines Subjekt, das im unmittelbaren Satz nicht ausdrücklich genannt wird. Das Passiv vermeidet eine im Deutschen leicht entstehende falsche Festlegung auf Noah, ohne den göttlichen Rettungsakt zu leugnen.
- issue: Grund für die Rettung der Söhne
  choice: „um seinetwillen“ bezieht sich auf Noah
  alternative: Rettung wegen der Söhne
  rationale: Die Abfolge unterscheidet zwischen der Gunst zugunsten der Söhne und ihrer Rettung um Noahs willen; diese Spannung wird beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Gunst erwiesen“ bildet die Wiederholung der ge’ezischen Wendung ab; der Gedankenstrich hebt Noah als einzige Ausnahme hervor.
