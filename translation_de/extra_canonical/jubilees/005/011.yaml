  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: de
  text: Und er vertilgte sie alle von ihren Stätten, und keiner von ihnen blieb übrig, den er nicht entsprechend all ihrer Bosheit gerichtet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: Und er vernichtete
  rationale: Das Verb bezeichnet hier die vollständige Zerstörung beziehungsweise Vertilgung; „vernichtete“ gibt die gerichtliche Endgültigkeit natürlich wieder.
- source_word: ኵሉ፡ እመካኖሙ
  choice: sie alle an ihren Orten
  rationale: Bewahrt sowohl die Gesamtheit als auch den örtlichen Bezug des geezischen Ausdrucks, ohne das weniger natürliche „von ihren Orten“ nachzubilden.
- source_word: ወኢተርፈ፡ አሐዱ፡ እምኔሆሙ
  choice: und keiner von ihnen blieb übrig
  rationale: Eine klare, idiomatische Wiedergabe der negierten Aussage, dass nicht ein Einziger übrig blieb.
- source_word: ዘአኰነነ
  choice: den er nicht … gerichtet hatte
  rationale: Gibt das richterliche Handeln wieder; das Plusquamperfekt verdeutlicht, dass das Gericht der vollständigen Vernichtung vorausging beziehungsweise mit ihr abgeschlossen war.
- source_word: በኵሉ፡ እኪዮሙ
  choice: nach all seiner Bosheit
  rationale: „Nach“ drückt den Maßstab beziehungsweise Grund des Gerichts aus. Der distributive Singular „seiner“ bezieht die gesamte Bosheit jeweils auf jeden Einzelnen.
theological_decisions:
- issue: Verhältnis von Gericht und Vernichtung
  choice: Beide Handlungen werden unterschieden, ohne ihre genaue zeitliche oder sachliche Beziehung weiter festzulegen.
  alternative: Die Vernichtung selbst ausdrücklich als Vollzug des Gerichts formulieren.
  rationale: Der Ausgangstext nennt Vernichtung und Gericht, erklärt aber nicht ausdrücklich, dass beide identisch sind.
- issue: Gegenstand der Bosheit
  choice: „all seiner Bosheit“ distributiv auf jeden der Gerichteten bezogen
  alternative: „all ihrer Bosheit“ kollektiv auf die Gruppe bezogen
  rationale: Die Relativkonstruktion mit „keiner von ihnen, den …“ legt im Deutschen den distributiven Singular nahe, während die Gesamtheit des Bösen erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Ausgangstext, wird jedoch idiomatisch geglättet; keine konfessionellen Zusatzdeutungen.
