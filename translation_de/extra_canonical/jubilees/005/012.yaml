  yaml_path: translation/extra_canonical/jubilees/005/012.yaml
  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: de
  text: Und er schuf für alle seine Werke eine neue und gerechte Natur[a], damit sie in ihrer ganzen Natur für immer nicht sündigen, sondern alle gerecht seien, jedes nach seiner Art, alle Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut dieses Satzteils ist textlich und semantisch schwierig. Die Übersetzung bewahrt den Sinn einer erneuerten, gerechten Ordnung der Schöpfung nach ihren Arten, statt ihn zu einer allgemeinen Aussage zu glätten.
    reason: textual_variant
lexical_decisions:
- source_word: ገብረ
  choice: gab
  rationale: Wörtlich kann das Verb „machen, schaffen, tun“ bedeuten. In Verbindung mit „für alle seine Werke eine … Natur“ gibt „gab“ den resultativen Sinn im Deutschen natürlich wieder, ohne eine Schöpfung aus dem Nichts festzulegen.
- source_word: ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: eine neue und gerechte Natur
  rationale: ፍጥረት kann je nach Zusammenhang „Schöpfung“, „Geschöpf“, „Beschaffenheit“ oder „Natur“ bezeichnen. Hier passt „Natur“ zur inneren Beschaffenheit der Werke; „neu und gerecht“ wahrt beide Attribute.
- source_word: እይረብቡ
  choice: nicht sündigten
  rationale: Die Form wird im überlieferten Kontext als Verneinung des Sündigens verstanden; der deutsche Konjunktiv in der damit-Konstruktion gibt den abhängigen Zwecksinn wieder.
- source_word: በበ፡ ትዝምዳ
  choice: jedes nach seiner Art
  rationale: Die distributive Form bezeichnet die jeweilige Zuordnung nach Art beziehungsweise Gattung. „Jedes nach seiner Art“ ist verständlich und bewahrt die geschöpfliche Differenzierung.
- source_word: ኵሉ፡ መዋዕለ
  choice: alle Tage
  rationale: Die knappe zeitliche Formel wird formal mit „alle Tage“ wiedergegeben und nicht zu „für immer“ vereinheitlicht, da bereits zuvor eine Ewigkeitsangabe steht.
theological_decisions:
- issue: Erneuerung der Schöpfung und Sündlosigkeit
  choice: Die Aussage bleibt als umfassende neue, gerechte Beschaffenheit aller Werke formuliert.
  alternative: Eine allgemeine moralische Besserung oder bloße Neuordnung der Welt.
  rationale: Der schwierige Wortlaut verbindet eine neue und gerechte Natur ausdrücklich mit dem Nicht-Sündigen; diese Spannung wird nicht abgeschwächt oder konfessionell systematisiert.
- issue: Verhältnis von Einheit und Arten
  choice: „alle … jedes nach seiner Art“
  alternative: Eine unterschiedslose Einheit aller Geschöpfe.
  rationale: Die Übersetzung bewahrt sowohl die umfassende Geltung als auch die Differenzierung nach Arten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Schlussformel „alle Tage“ bleibt wegen ihrer Nähe zur äthiopischen Vorlage erhalten; der schwierige Satzbau wurde nur so weit geglättet, wie es für gewöhnliche Leser nötig ist.
