  yaml_path: translation/extra_canonical/jubilees/005/029.yaml
  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: de
  text: Und im vierten Monat wurden die Quellen der großen Tiefe verschlossen[a], und die Schleusen des Himmels wurden zurückgehalten. Am Anfang des siebten Monats aber wurden alle Öffnungen der Tiefen der Erde aufgetan, und die Wasser begannen in die untere Tiefe hinabzufließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung kann widersprüchlich wirken: Nachdem die Quellen der großen Tiefe „verschlossen“ worden sind, werden die Öffnungen der Tiefen der Erde „aufgetan“, sodass die Wasser in die untere Tiefe hinabfließen. Die Übersetzung bewahrt diese kosmologische Abfolge, statt sie harmonisierend aufzulösen.'
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: die Quellen der großen Tiefe
  rationale: Gibt die kosmologische Wendung mit einer im Deutschen verständlichen und schriftsprachlich vertrauten Formulierung wieder.
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: die Schleusen des Himmels
  rationale: Bewahrt das Bild von Himmelsöffnungen, durch die Wasser einströmt.
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: am Anfang des siebten Monats
  rationale: Die Zeitangabe bezeichnet den Beginn beziehungsweise das Anbrechen des Monats; diese Wiedergabe ist natürlich und vermeidet eine unnötige Festlegung auf den Neumondtag.
- source_word: አፈወ፡ መዓምቅተ፡ ምድር
  choice: alle Öffnungen der Tiefen der Erde
  rationale: Das wörtliche Bild der „Münder“ wird idiomatisch als „Öffnungen“ wiedergegeben, ohne die kosmologische Vorstellung einzuebnen.
- source_word: ቀላይ፡ ታሕቲት
  choice: die untere Tiefe
  rationale: Erhält die räumlich-kosmologische Unterscheidung einer unten gelegenen Tiefe.
theological_decisions:
- issue: Scheinbarer Gegensatz zwischen verschlossenen Quellen und später geöffneten Erdöffnungen
  choice: Die Abfolge bleibt unverändert und wird in einer Fußnote erläutert.
  alternative: Die Aussagen harmonisieren oder die Öffnungen als Abflusskanäle ausdeuten.
  rationale: Der Ausgangstext beschreibt zunächst ein Verschließen und danach ein Öffnen, durch das die Wasser hinabfließen. Diese Spannung soll nicht durch zusätzliche Deutung beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufgetan“ bewahrt einen leicht gehobenen biblischen Ton, bleibt aber allgemein verständlich; die übrige Syntax ist klar und gegenwärtig.
