lexical_decisions:
- source_word: ታቦተ
  choice: Arche
  rationale: Das äthiopische Wort bezeichnet hier in Anlehnung an die Fluterzählung das rettende Schiff bzw. den Kasten; „Arche“ ist die natürliche und traditionsgemäße deutsche Wiedergabe.
- source_word: ማየ፡ አይኅ
  choice: Wasser der Flut
  rationale: Die Verbindung bedeutet wörtlich „Wasser der Flut“; der Plural „Wassern“ bewahrt die Ausdrucksweise des Ausgangstextes und passt idiomatisch zum Deutschen.
- source_word: ይድኀኖ
  choice: gerettet würde
  rationale: 'Die Verbform drückt den Zweck der Anordnung aus: Noah soll durch die Arche vor der Flut bewahrt bzw. gerettet werden.'
theological_decisions:
- issue: Unausgesprochenes Subjekt des Gebots
  choice: „er“ kleingeschrieben
  alternative: „Er“ als ausdrücklicher Gottesbezug
  rationale: Der Vers setzt das Subjekt aus dem Kontext voraus. Die Kleinschreibung bewahrt diese grammatische Zurückhaltung, ohne eine zusätzliche Hervorhebung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am ge'ezischen Ausgangstext, klingt aber natürlich; „sich eine Arche zu bauen“ gibt ለኖኅ ... ሎቱ idiomatisch wieder.
