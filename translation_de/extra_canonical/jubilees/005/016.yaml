base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: de
  text: Er bevorzugt niemanden und lässt sich nicht bestechen, wenn er sagt, dass er über jeden Einzelnen Gericht halten wird. Selbst wenn jemand alles gäbe, was auf der Erde ist, würde er ihn nicht bevorzugen und es nicht annehmen; auch würde er nichts aus seiner Hand entgegennehmen, denn er ist ein gerechter Richter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነሥእ ገጸ
  choice: jemanden bevorzugen
  rationale: Die Wendung bedeutet wörtlich etwa „das Angesicht annehmen“ und bezeichnet im gerichtlichen Zusammenhang Parteilichkeit. Die moderne deutsche Formulierung gibt den Sinn klar wieder.
- source_word: ይነሥእ ሕሊና
  choice: sich bestechen lassen
  rationale: Im parallelen gerichtlichen Zusammenhang ist das Annehmen einer Gabe mit dem Zweck der Einflussnahme gemeint; „sich bestechen lassen“ ist im Deutschen idiomatisch und präzise.
- source_word: ይገበር ዘንተ ለለ፻፻
  choice: über jeden Einzelnen Gericht halten
  rationale: Die distributive Aussage wird mit „jeden Einzelnen“ bewahrt; „Gericht halten“ entspricht dem richterlichen Kontext natürlicher als ein rein wörtliches „dies tun“.
- source_word: ኢይትሜጠው እምእዴሁ
  choice: nichts aus seiner Hand entgegennehmen
  rationale: Das Verb bezeichnet hier das Empfangen oder Annehmen. Das im Deutschen ergänzte „nichts“ macht das im Ausgangstext implizite Objekt verständlich, ohne den Sinn zu erweitern.
- source_word: መኰንን ጽድቅ
  choice: ein gerechter Richter
  rationale: Die substantivische Verbindung wird als natürliche deutsche Prädikatsgruppe wiedergegeben und bewahrt die Charakterisierung Gottes als gerecht urteilenden Richter.
theological_decisions:
- issue: Unbestechlichkeit und Unparteilichkeit des Richters
  choice: Die beiden Aussagen werden ausdrücklich und parallel wiedergegeben.
  alternative: Die Wendungen allgemeiner als bloße Unbeeinflussbarkeit zusammenzufassen.
  rationale: Der Ausgangstext nennt Parteilichkeit und Annahme einer Bestechungsgabe gesondert; diese rechtlich-theologische Spannung soll nicht eingeebnet werden.
- issue: Implizites Subjekt
  choice: Das männliche Pronomen „er“ bleibt ohne ergänzende Benennung stehen.
  alternative: Das Subjekt ausdrücklich als „Gott“ zu identifizieren.
  rationale: Der Vers setzt sein Subjekt aus dem Kontext voraus. Eine ausdrückliche Identifikation innerhalb dieses Verses wäre eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gerichtssprache. Archaische Wendungen wie „die Person ansehen“ wurden vermieden; zugleich bleibt der feierliche Charakter durch „Gericht halten“ und „gerechter Richter“ erhalten.
