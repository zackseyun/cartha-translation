  yaml_path: translation/extra_canonical/jubilees/005/017.yaml
  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: de
  text: 'Und über die Kinder Israels ist geschrieben und festgesetzt worden: Wenn sie in Gerechtigkeit zu ihm umkehren, wird er ihnen alle ihre Verfehlungen vergeben und alle ihre Sünden verzeihen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: die Kinder Israels
  rationale: Die traditionelle, gut verständliche Bezeichnung bewahrt die kollektive und heilsgeschichtliche Ausdrucksweise des Ge'ez.
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: ist geschrieben und festgesetzt worden
  rationale: Gibt beide passiven Verben wieder und bewahrt den Gedanken einer schriftlich niedergelegten und verbindlich angeordneten Bestimmung.
- source_word: ተመይጡ፡ ኀቤሁ
  choice: zu ihm umkehren
  rationale: Drückt die personale Richtungsangabe und den Sinn einer Umkehr aus, nicht bloß ein neutrales Zurückkehren.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Bewahrt den theologischen und ethischen Bedeutungsumfang von Gerechtigkeit, ohne ihn auf Aufrichtigkeit oder Reue zu verengen.
- source_word: አበሳሆሙ
  choice: ihre Verfehlungen
  rationale: Unterscheidet diesen Begriff stilistisch vom nachfolgenden Wort für Sünden und gibt schuldhafte Übertretungen natürlich wieder.
- source_word: ኀጢአቶሙ
  choice: ihre Sünden
  rationale: Entspricht der üblichen religiös-ethischen Bedeutung und erhält den Parallelismus.
theological_decisions:
- issue: Bedingung göttlicher Vergebung
  choice: Wenn sie in Gerechtigkeit zu ihm umkehren
  alternative: Wenn sie sich ihm aufrichtig zuwenden
  rationale: Die Formulierung lässt die Beziehung zwischen Umkehr, Gerechtigkeit und Vergebung so stehen, wie sie im Text erscheint, ohne sie konfessionell zu systematisieren oder 'Gerechtigkeit' psychologisch auf Aufrichtigkeit zu reduzieren.
- issue: Zwei Verben für den Umgang mit Schuld
  choice: vergeben und verzeihen
  alternative: erlassen und vergeben
  rationale: Die zwei parallelen Aussagen des Ausgangstextes bleiben erkennbar, ohne einen sachlichen Unterschied zu erzwingen, den der Vers nicht ausdrücklich erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formaler Satzstruktur. Die biblisch vertraute Wendung „Kinder Israels“ und der Ausdruck „in Gerechtigkeit“ wurden wegen ihrer inhaltlichen Tragweite beibehalten; der übrige Satz ist für heutige Leser natürlich formuliert.
