  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: de
  text: Und der Herr öffnete sieben Schleusen des Himmels und die Öffnungen der Quellen der großen Tiefe – insgesamt sieben Öffnungen[a] –, und aus den Schleusen strömte vierzig Tage und vierzig Nächte lang Wasser vom Himmel herab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sieben Münder an Zahl“. Die Formulierung hebt die fest bestimmte Zahl der Öffnungen in der großen Tiefe hervor.'
    reason: cultural_note
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: Schleusen des Himmels
  rationale: Die Wendung bezeichnet Öffnungen, durch die das Wasser vom Himmel herabkommt; „Schleusen“ bewahrt das kosmologische Bild und klingt im Deutschen natürlich.
- source_word: አፈወ፡ አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: die Öffnungen der Quellen der großen Tiefe
  rationale: „Öffnungen“ gibt das wörtliche Bild der „Münder“ verständlich wieder; „große Tiefe“ bewahrt die traditionelle kosmologische Bedeutung von ቀላይ፡ ዐቢይ.
- source_word: በሰብዑ፡ አፈወ፡ በኍልቍ
  choice: insgesamt sieben Öffnungen
  rationale: Die idiomatische Zählformel, wörtlich etwa „sieben Münder an Zahl“, wird in natürlichem Deutsch wiedergegeben, ohne die hervorgehobene Siebenzahl zu verlieren.
- source_word: ይውርዱ፡ ማየ፡ እምሰማይ
  choice: aus den Schleusen strömte … Wasser vom Himmel herab
  rationale: Die Formulierung bringt Richtung und Herkunft des Wassers klar zum Ausdruck und verbindet den Satz natürlich mit den zuvor genannten Himmelsschleusen.
theological_decisions:
- issue: Kosmologische Bildsprache von Himmel und großer Tiefe
  choice: Die räumlich-konkreten Bilder „Schleusen des Himmels“ und „Quellen der großen Tiefe“ bleiben stehen.
  alternative: Die Aussage allgemein als heftigen Regen und hervorbrechendes Grundwasser umschreiben.
  rationale: Der ge'ezische Text beschreibt die Flut mit einer strukturierten kosmologischen Bildwelt. Eine modernisierende Erklärung würde diese eigenständige Aussage des Textes abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt feierlich und eng am ge'ezischen Text, während „Öffnungen“ statt des wörtlichen „Münder“ unmittelbare Verständlichkeit gewährleistet. Der Gedankenstrich kennzeichnet die erläuternde Zählformel klar.
