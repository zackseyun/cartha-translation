  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: de
  text: 'Und er sagte: „Mein Geist soll nicht für immer auf dem Menschen bleiben[a], denn auch sie sind Fleisch; und ihre Tage sollen hundertzwanzig Jahre betragen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „auf dem Menschen“, nicht „im Menschen“.
    reason: Die ungewöhnliche Präposition ist im ge’ezischen Text ausdrücklich „auf/über“ und soll nicht an die geläufige Fassung von Genesis 6,3 angeglichen werden.
lexical_decisions:
- source_word: ይነብር (yənäbbər)
  choice: bleiben
  rationale: Das Verb bezeichnet ein Bleiben, Wohnen oder Verweilen. „Bleiben“ ist hier natürlich und bewahrt den zeitlichen Gegensatz zu „für immer“.
- source_word: ዲበ (diba)
  choice: auf
  rationale: Die Präposition bedeutet „auf/über“. Die Wiedergabe „auf dem Menschen“ folgt bewusst dem ge’ezischen Wortlaut und harmonisiert ihn nicht mit der geläufigen Formulierung „im Menschen“ aus Genesis 6,3.
- source_word: እሙንቱኒ (ʾəmuntu-ni)
  choice: auch sie
  rationale: Das angehängte -ni trägt ausdrücklich die Bedeutung „auch/ebenfalls“; daher darf „auch“ nicht ausgelassen werden.
- source_word: መዋዕሊሆሙ (mäwaʿəlihomu)
  choice: ihre Tage
  rationale: Die konkrete Rede von den „Tagen“ bleibt erhalten; aus dem Zusammenhang ergibt sich die Lebensdauer.
- source_word: ምእት ወዕሥራ ዓመት (məʾət wa-ʿəśra ʿamät)
  choice: hundertzwanzig Jahre
  rationale: Direkte Wiedergabe der Zahl und Zeiteinheit in moderner deutscher Schreibweise.
theological_decisions:
- issue: Bezug von „hundertzwanzig Jahren“
  choice: Keine ausdrückliche Festlegung, ob individuelle Lebensspanne oder Frist bis zum Gericht gemeint ist
  alternative: Den Satz als Begrenzung der menschlichen Lebensdauer oder ausdrücklich als verbleibende Frist bis zur Flut auslegen
  rationale: Der Wortlaut nennt lediglich die Tage der Menschen und lässt die bekannte Auslegungsfrage offen.
- issue: Wechsel vom kollektiven Singular „Mensch“ zum Plural „sie“
  choice: Den grammatischen Wechsel bewahren
  alternative: Beide Satzteile durchgehend in Singular oder Plural formulieren
  rationale: Der Quellenwortlaut spricht zunächst kollektiv vom Menschen und anschließend von „auch ihnen“; eine Glättung würde eine echte Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „auf dem Menschen bleiben“ wurde aus Quellentreue beibehalten und durch eine knappe Fußnote erläutert; „auch“ gibt die ge’ezische Enklitik ausdrücklich wieder.
