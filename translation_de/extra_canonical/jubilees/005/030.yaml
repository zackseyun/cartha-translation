  text: And on the new moon of the tenth month the tops of the mountains appeared, and on the new moon of the first month the earth appeared.
translation:
  language: de
  text: Und am Neumond des zehnten Monats wurden die Gipfel der Berge sichtbar, und am Neumond des ersten Monats wurde die Erde sichtbar.
