lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ
  choice: am Neumond
  rationale: Die Wendung bezeichnet den Monatsbeginn beziehungsweise Neumond; „am Neumond“ bewahrt die kalendarische Ausdrucksweise knapp und natürlich.
- source_word: አርእስተ፡ አድባር
  choice: die Gipfel der Berge
  rationale: Wörtlich sind die „Häupter“ der Berge gemeint; im Deutschen ist „Gipfel“ die natürliche Entsprechung.
- source_word: አስተርአየ / አስተርአየት
  choice: wurden sichtbar / wurde sichtbar
  rationale: Die passive beziehungsweise intransitive Erscheinungsbedeutung wird gewahrt, ohne ein nicht genanntes wahrnehmendes Subjekt einzuführen.
- source_word: ምድር
  choice: die Erde
  rationale: Die Grundbedeutung umfasst Erde beziehungsweise Land; der bestimmte Ausdruck „die Erde“ passt zum überlieferten Flutkontext und lässt offen, ob der Erdboden oder das Land im Blick ist.
