  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: de
  text: Und am siebenundzwanzigsten Tag dieses Monats öffnete er die Arche und ließ die wilden Tiere, das Vieh, die Vögel und alles, was sich bewegt, aus ihr hinaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዕሥራ፡ ወሰብዑ፡ ሎቱ፡
  choice: am siebenundzwanzigsten Tag dieses Monats
  rationale: Die Wendung bezeichnet den siebenundzwanzigsten Tag des zuvor erschließbaren Monats; die Ergänzung „Tag dieses Monats“ macht den deutschen Zeitbezug natürlich und eindeutig.
- source_word: አርኀዋ፡ ለታቦት፡
  choice: öffnete er die Arche
  rationale: Gibt Verb, Subjekt und Objekt schlicht und quellennah wieder.
- source_word: ወፈነወ፡ እምውስቴታ፡
  choice: und ließ … aus ihr hinaus
  rationale: Das Verb bezeichnet das Aussenden beziehungsweise Freilassen; bei Tieren aus der Arche ist „hinauslassen“ natürlich, während „aus ihr“ den Ausgangstext ausdrücklich abbildet.
- source_word: አራዊተ፡ ወእንስሳ፡
  choice: die wilden Tiere, das Vieh
  rationale: Bewahrt die Unterscheidung zwischen Wildtieren und domestizierten Tieren.
- source_word: ወአዕዋፈ፡ ወዘይትነወስ።
  choice: die Vögel und alles, was sich bewegt
  rationale: Formale und zugleich idiomatische Wiedergabe der abschließenden Tiergruppenformel.
