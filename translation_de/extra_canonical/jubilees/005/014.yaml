base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: de
  text: Und wenn sie nicht darin wandeln,[a] ist das Gericht über jedes Geschöpf und jede Art geschrieben. Und es gibt nichts im Himmel oder auf der Erde, im Licht oder in der Finsternis, im Totenreich oder in der Tiefe oder am Ort der Dunkelheit, dessen Gerichte nicht festgesetzt, geschrieben und eingraviert wären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Folge „im Himmel … auf der Erde … im Licht … in der Finsternis … im Totenreich … in der Tiefe … am Ort der Dunkelheit“ bildet ein umfassendes kosmologisches Verzeichnis. Die abschließende Dreierformel „festgesetzt, geschrieben und eingraviert“ bewahrt das Bild eines dauerhaft niedergelegten Rechtsurteils.
    reason: cultural_note
lexical_decisions:
- source_word: ኢሖሩ፡ ባቲ
  choice: nicht darin wandeln
  rationale: Bewahrt die konkrete Weg-Metapher des Geʿez; das feminine Suffix verweist auf den im Zusammenhang genannten Weg beziehungsweise die Ordnung.
- source_word: ምኵናነ
  choice: Gericht
  rationale: Der Ausdruck bezeichnet hier gerichtliche Entscheidung beziehungsweise Urteil; „Gericht“ hält den rechtlichen Sinn und die Verbindung zum abschließenden Plural fest.
- source_word: ለኵሉ፡ ፍጥረት፡ ወለኵሉ፡ ትዝምድ
  choice: über jedes Geschöpf und jede Art
  rationale: Gibt die umfassende Verteilung des Gerichts über alle Geschöpfe und Gattungen wieder, ohne „Art“ unnötig zu spezifizieren.
- source_word: ሲኦል
  choice: Totenreich
  rationale: Natürliches modernes Deutsch für Sheol, ohne es mit Hölle gleichzusetzen.
- source_word: ቀላይ
  choice: Tiefe
  rationale: Bewahrt die kosmologische Bezeichnung eines tiefen beziehungsweise abgründigen Bereichs.
- source_word: መጽልም
  choice: Ort der Dunkelheit
  rationale: Unterscheidet den Ausdruck von dem vorherigen einfachen „Finsternis“ und folgt seiner örtlichen Bedeutung.
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: festgesetzt, geschrieben und eingraviert
  rationale: Erhält die dreigliedrige Formel und ihre Bildwelt einer dauerhaft fixierten Rechtsakte.
theological_decisions:
- issue: Bezug und Umfang des abschließenden Satzteils
  choice: „dessen Gerichte nicht festgesetzt, geschrieben und eingraviert wären“
  alternative: „alle ihre Gerichte sind festgesetzt, geschrieben und eingraviert“
  rationale: Die deutsche Relativkonstruktion verbindet die kosmologische Gesamtliste verständlich mit der Aussage über die zugehörigen Gerichte und bewahrt zugleich den im überlieferten Text beziehungsweise in der korrigierten Lesart erkennbaren Plural „ihre Gerichte“.
- issue: Wiedergabe von Sheol
  choice: Totenreich
  alternative: Scheol
  rationale: „Totenreich“ ist allgemein verständlich und vermeidet die konfessionell aufgeladene Gleichsetzung mit der Hölle; „Scheol“ wäre eine mögliche stärker formale Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Metapher „wandeln“ bleibt wegen ihres ethischen Weg-Sinns erhalten; „Totenreich“ vermeidet ein missverständliches „Hölle“. Die umfassende kosmologische Aufzählung und die rechtlich-dokumentarische Dreierformel werden bewusst nicht geglättet.
