  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: de
  text: Und Noah baute die Arche in jeder Hinsicht so, wie Gott ihm geboten hatte, im sechsundzwanzigsten Jubiläum der Jahre, in der fünften Jahrwoche, im fünften Jahr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ኖኅ፡ ታቦተ
  choice: Noah baute die Arche
  rationale: ገብረ bedeutet hier im Zusammenhang mit der Arche natürlich „baute/fertigte“; ታቦት bezeichnet die Arche.
- source_word: በኵሉ፡ በከመ
  choice: in jeder Hinsicht so, wie
  rationale: Gibt die umfassende Wendung „in allem/ganz so, wie“ idiomatisch und zugleich quellennah wieder.
- source_word: አዘዞ
  choice: er ihm geboten hatte
  rationale: 'Die aktive Verbform mit Objektsuffix bezeichnet: „er gebot ihm“. Im Kontext ist Gott der nicht ausdrücklich genannte Handelnde; das Plusquamperfekt bildet den zeitlichen Vorrang des Gebots im Deutschen natürlich ab.'
- source_word: ዕሥራ፡ ወስድስቱ፡ ኢዮቤልው፡ ዓመታት
  choice: im sechsundzwanzigsten Jubiläum der Jahre
  rationale: Bewahrt die buchtypische chronologische Terminologie und die ausdrücklich bezeugte Zahl sechsundzwanzig.
- source_word: በኃምስ፡ ሱባዔ፡ በኃምስ፡ ዓመት
  choice: in der fünften Jahrwoche, im fünften Jahr
  rationale: ሱባዔ bezeichnet in dieser Chronologie eine Siebener- bzw. Jahrwoche; „Jahrwoche“ verhindert die Verwechslung mit einer gewöhnlichen Woche.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von አዘዞ
  choice: „er ihm geboten hatte“ mit kleingeschriebenem Pronomen und erläuternder Fußnote
  alternative: „Gott ihm geboten hatte“ oder „Er ihm geboten hatte“
  rationale: Die aktive Konstruktion wird bewahrt, ohne den Gottesnamen in den Haupttext einzufügen oder durch Großschreibung eine nicht im Ge'ez markierte Auslegung typografisch festzuschreiben. Der Kontext legt Gott als Subjekt nahe.
- issue: Aktiv gegenüber passiver Wiedergabe
  choice: 'aktive Wiedergabe: „er ihm geboten hatte“'
  alternative: „wie ihm geboten worden war“
  rationale: Das Ge'ez hat ein aktives Verb mit Objektsuffix; eine passive Form würde diese grammatische Struktur verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher Chronologie. „Jahrwoche“ ist gegenüber bloßem „Woche“ präziser. Das ungewohnte „Jubiläum der Jahre“ bleibt erhalten, da es zur formalen Zeitrechnung des Jubiläenbuches gehört.
