  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: de
  text: Ihre Väter aber sahen zu. Danach wurden sie für immer in den Tiefen der Erde gebunden, bis zum Tag des großen Gerichts – zum Gericht über alle, die ihre Wege und ihre Taten vor dem Herrn verdorben hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኔጽሩ
  choice: sahen zu
  rationale: Das Verb bezeichnet ein Sehen oder Beobachten. „Sahen zu“ gibt hier die fortdauernde Beobachtung natürlich wieder, ohne eine weitergehende Deutung einzutragen.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: in den Tiefen der Erde
  rationale: Bewahrt das räumliche Bild des geʿezischen Ausdrucks und entspricht dem passiven „wurden … gebunden“.
- source_word: እስከ፡ ለዓለም
  choice: für immer
  rationale: Gibt die idiomatische Zeitangabe wieder; die anschließende Wendung „bis zum Tag“ bezeichnet den bestimmten Endpunkt dieser Gefangenschaft.
- source_word: አማሰኑ፡ ፍኖቶሆሙ፡ ወምግባሪሆሙ
  choice: ihre Wege und ihre Taten … verdorben hatten
  rationale: '„Verderben“ wahrt sowohl die moralische Aussage des Verbs als auch die zwei ausdrücklich genannten Bereiche: Lebenswege und Handlungen.'
- source_word: ዲበ
  choice: über
  rationale: Die Präposition hat hier die gerichtliche Bedeutung „über/gegen“ und bezeichnet diejenigen, über die das Gericht ergeht.
theological_decisions:
- issue: Verhältnis des großen Gerichtstags zum Gericht über die Verderber
  choice: „bis zum Tag des großen Gerichts, zum Gericht über alle“
  alternative: „bis zum Tag des großen Gerichts, damit über alle Gericht gehalten wird“
  rationale: Die appositionale Form hält die knappe und spannungsreiche Quellkonstruktion offen und macht weder Zweck noch zeitliche Folge eindeutiger, als es der geʿezische Text erlaubt.
- issue: Bezug von „sie“ nach „ihre Väter“
  choice: Das Subjekt bleibt als Pronomen „sie“ unausgedeutet.
  alternative: Die gemeinten Wesen ausdrücklich benennen
  rationale: Der Vers setzt den Bezug aus dem Kontext voraus. Eine ausdrückliche Identifikation würde zusätzliche Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze erhalten den erzählenden Rhythmus; die ungewöhnlich knappe Gerichtsformel bleibt bewusst sichtbar. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Wendung.
