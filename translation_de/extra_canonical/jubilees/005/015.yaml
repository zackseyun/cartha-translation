  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: de
  text: 'Über alle wird er Gericht halten: über den Großen entsprechend seiner Größe und über den Kleinen entsprechend seiner Kleinheit, über jeden Einzelnen entsprechend seinem Weg.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኴንኖ
  choice: wird er Gericht halten
  rationale: Das Verb bezeichnet hier das Richten bzw. Fällen eines Urteils. Die Wendung ist im Deutschen würdevoll und macht den gerichtlichen Sinn deutlich.
- source_word: ለዐቢይ ... በከመ፡ ዐበየ
  choice: über den Großen entsprechend seiner Größe
  rationale: Bewahrt die bewusste Wiederholung von »groß« und »Größe« sowie den Maßstabcharakter von በከመ.
- source_word: ለንኡስሂ፡ በከመ፡ ንእሰ
  choice: über den Kleinen entsprechend seiner Kleinheit
  rationale: Gibt die parallele Struktur zum Großen wieder, ohne »Kleinheit« als moralische Minderwertigkeit auszudeuten.
- source_word: ለለ፡ አሐዱ
  choice: über jeden Einzelnen
  rationale: Natürliches modernes Deutsch für die distributive Aussage »jeden einzelnen«.
- source_word: በከመ፡ ፍኖቱ
  choice: entsprechend seinem Weg
  rationale: »Weg« wahrt die konkrete Metapher und ihre mögliche ethische Bedeutung, ohne sie auf »Taten« zu verengen.
theological_decisions:
- issue: Maßstab des Gerichts
  choice: Die wiederholte Formulierung »entsprechend« bleibt erhalten.
  alternative: »nach« oder eine ausdeutende Wiedergabe wie »gemäß seiner Verantwortung«
  rationale: Der Quelltext verbindet Größe, Kleinheit und Weg jeweils mit derselben vergleichenden bzw. maßgebenden Konstruktion. Eine nähere Erklärung des göttlichen Urteils wäre interpretierend.
- issue: Bedeutung von »Weg«
  choice: Die Weg-Metapher wird wörtlich bewahrt.
  alternative: »nach seinen Taten« oder »nach seinem Lebenswandel«
  rationale: »Weg« kann Lebensführung, Verhalten oder eingeschlagene Richtung umfassen. Die Übersetzung soll diese Breite nicht stillschweigend einschränken.
translation_notes:
  register: Modernes, dignifiziertes Standarddeutsch. Der Doppelpunkt macht den allgemeinen Gerichtssatz und seine dreigliedrige Entfaltung klar; die Parallelität des geezischen Textes bleibt erkennbar.
