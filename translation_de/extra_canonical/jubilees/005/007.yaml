  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: de
  text: 'Und über ihre Söhne erging von seinem Angesicht her ein Wort: Sie sollten mit dem Schwert erschlagen und unter dem Himmel hinweggenommen werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder aktiv: „damit er sie mit dem Schwert erschlage und unter dem Himmel hinwegnehme.“'
    reason: Die Verbformen können formal mit einem männlichen Einzeltäter wiedergegeben werden; der Haupttext wahrt mit dem Passiv die in der deutschen Satzform nicht ausdrücklich bestimmte Ausführung des ergangenen Wortes.
lexical_decisions:
- source_word: ዲበ፡ ውሉዶሙ፡ (diba wəludomu)
  choice: über ihre Söhne
  rationale: ዲበ kann hier den Gegenstand der Aussage bezeichnen („über“, „hinsichtlich“); ውሉድ bezeichnet Kinder beziehungsweise Nachkommen und wird im Zusammenhang mit den gezeugten männlichen Riesen passend mit „Söhne“ wiedergegeben.
- source_word: ወፅአ፡ ቃል፡ እምቅድመ፡ ገጹ፡
  choice: von seinem Angesicht erging ein Wort
  rationale: Bewahrt das konkrete Ausgangsbild von „ein Wort ging von vor seinem Angesicht aus“, verwendet mit „erging“ jedoch eine im Deutschen natürliche und würdige Wendung.
- source_word: ይምሐጾሙ፡ በሰይፍ፡
  choice: mit dem Schwert erschlagen
  rationale: Das Verb bezeichnet Schlagen oder Niederschlagen; „erschlagen“ erhält die ausdrückliche Schwertmetaphorik und vermeidet das weitergehende, unspezifische „auslöschen“.
- source_word: ያሰስሎሙ፡ እምታሕተ፡ ሰማይ፡
  choice: unter dem Himmel weggenommen
  rationale: Das Verb hat die Grundbedeutung des Entfernens oder Wegnehmens. Die Formulierung bewahrt diese Bedeutung und die räumliche Wendung „unter dem Himmel“, ohne sie vorschnell als „vernichten“ auszulegen.
theological_decisions:
- issue: Handelnder beim Erschlagen und Wegnehmen
  choice: passive Formulierung im Haupttext
  alternative: „damit er sie mit dem Schwert erschlage und unter dem Himmel wegnehme“
  rationale: Die ge’ezischen Verbformen können einen männlichen Einzeltäter ausdrücken, während der vorausgehende göttliche Ausspruch zugleich als Vollstreckungsbefehl verstanden werden kann. Das Passiv bewahrt die im Kontext mögliche Unbestimmtheit; die aktivische Lesart wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst feierliche Wendung „von seinem Angesicht“ erhält das konkrete Bild der Vorlage; „erging ein Wort“ klingt zugleich idiomatisch und lässt offen, ob das Wort als Urteil oder Befehl verstanden wird.
