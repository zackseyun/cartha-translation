  source_fidelity: 'Die Übersetzung trifft die Aussage im Wesentlichen: Ein Ausspruch ergeht bezüglich ihrer Söhne, die mit dem Schwert erschlagen und aus dem Bereich unter dem Himmel entfernt werden sollen. Die Präposition እም („von/aus“) in እምታሕተ፡ ሰማይ erfordert jedoch im Deutschen eine Richtungskomponente; „unter dem Himmel weggenommen“ kann lediglich den Ort der Wegnahme bezeichnen.'
  naturalness: „Von seinem Angesicht her erging ein Wort“ bewahrt das bildhafte Register der Vorlage in verständlichem, würdigem modernen Standarddeutsch. „Unter dem Himmel hinweggenommen“ ist hier die knappste natürliche Formulierung, welche die Bedeutung „von unter dem Himmel fortgenommen“ erkennen lässt.
  terminology: „Söhne“, „mit dem Schwert erschlagen“ und „hinweggenommen“ geben die einschlägigen Ausdrücke angemessen wieder. Die Fußnote darf die mögliche aktivische Wiedergabe nennen, ohne einen über den Satz hinausgehenden theologischen Schluss zu ziehen.
