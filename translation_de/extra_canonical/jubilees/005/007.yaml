  - severity: low
    issue: „Von seinem Angesicht erging ein Wort“ ist im Deutschen syntaktisch etwas hart.
    rationale: Die Ergänzung „her“ macht die Ausgangsrelation verständlicher und bewahrt zugleich das konkrete Bild von „vor seinem Angesicht“.
