theological_decisions:
- issue: Kosmologisches Bild der Fluterzählung
  choice: „Quellen der Tiefe“ und „die ganze Welt“ werden bildnah beibehalten.
  alternative: Eine entmythologisierende Wiedergabe wie „unterirdische Wasservorräte“ oder eine Einschränkung auf „das ganze Land“.
  rationale: Der geezische Text bietet das traditionelle kosmologische Bild und lässt den Umfang mit „ganze Welt“ weit gefasst; die Übersetzung soll diese Aussage nicht stillschweigend modernisieren oder einschränken.
