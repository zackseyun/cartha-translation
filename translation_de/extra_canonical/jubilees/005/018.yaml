  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: de
  text: Es ist geschrieben und festgesetzt, dass allen, die sich von all ihren Verfehlungen abwenden, einmal in jedem Jahr Erbarmen erwiesen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangabe lautet ausdrücklich „einmal in jedem Jahr“. Ihr genauer Bezug innerhalb des Abschnitts wird im Satz nicht näher bestimmt.
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: Es ist geschrieben und festgesetzt
  rationale: Die beiden passiven Verben werden formal und zugleich idiomatisch wiedergegeben; „festgesetzt“ bewahrt den Gedanken einer verbindlichen Anordnung.
- source_word: ይትመሐር፡
  choice: Erbarmen erwiesen wird
  rationale: Die passive, handelndenneutral formulierte Wendung entspricht der Quellform und vermeidet, ein im Satz nicht ausdrücklich genanntes Subjekt einzufügen.
- source_word: እለ፡ ተመይጡ፡ እም*ኵሉ፡ ጌጋዮሙ፡
  choice: die sich von all ihrem Irrtum abwenden
  rationale: „Sich abwenden“ gibt die Umkehrbewegung natürlich wieder; der Singular „Irrtum“ bewahrt die kollektive Formulierung des Ausgangstextes.
- source_word: ምዕረ፡ ለ*ለ፡ ዓመት።
  choice: einmal in jedem Jahr
  rationale: Die ausdrückliche jährliche Zeitangabe bleibt erhalten und wird nicht zu einer allgemeineren Aussage abgeschwächt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des Erbarmens
  choice: 'Passive Formulierung: „Erbarmen erwiesen wird“'
  alternative: „dass er sich ... erbarmt“
  rationale: Der Ausgangstext lässt den Handelnden in dieser Aussage unausgesprochen; die passive deutsche Fassung wahrt diese Offenheit.
- issue: Bedeutung der jährlichen Zeitangabe
  choice: Wörtlich als „einmal in jedem Jahr“ beibehalten
  alternative: Allgemein als regelmäßig wiederkehrendes Erbarmen deuten
  rationale: Die mögliche Beziehung zur kalendarischen Sühne- oder Erbarmenstheologie des Jubiläenbuches wird nicht im Haupttext aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der Vorlage, ohne im Deutschen steif zu wirken; theologisch nicht ausdrücklich benannte Größen werden nicht ergänzt.
