translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die geʿezische Satzfolge. Die Formulierung vermeidet das im englischen Konsultationstext enthaltene zusätzliche „hoch über“, da der vorgelegte Ausgangstext lediglich sagt, dass das Wasser über alle hohen Berge stieg.
