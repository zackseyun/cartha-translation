  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: de
  text: Und das Wasser stieg auf der Erde fünfzehn Ellen hoch. Das Wasser stieg über alle hohen Berge, und die Arche wurde von der Erde emporgehoben und trieb auf der Wasseroberfläche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቀ፡ ማያት
  choice: das Wasser stieg … hoch
  rationale: Gibt die Zunahme beziehungsweise das Ansteigen des Wassers in natürlichem Deutsch wieder.
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: fünfzehn Ellen
  rationale: Bewahrt Maßzahl und antike Maßeinheit des geʿezischen Textes.
- source_word: ኵሉ፡ ደብር፡ ነዋኅ
  choice: alle hohen Berge
  rationale: Entspricht der distributiven Gesamtheit und dem Adjektiv für die Höhe, ohne eine zusätzliche Vergleichsangabe einzuführen.
- source_word: ታቦት
  choice: Arche
  rationale: Im Flutkontext ist „Arche“ die geläufige und sachlich passende deutsche Wiedergabe.
- source_word: ተንሰፈ
  choice: trieb
  rationale: Bezeichnet hier das Schwimmen beziehungsweise Getragenwerden des Fahrzeugs auf dem Wasser; „trieb“ ist idiomatisch und bewahrt die passive Bewegung.
- source_word: ዲበ፡ ገጸ፡ ማያት
  choice: auf der Wasseroberfläche
  rationale: Wörtlich „auf dem Angesicht/der Oberfläche des Wassers“; die deutsche Formulierung ist klar und natürlich.
