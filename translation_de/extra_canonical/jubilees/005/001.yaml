revisions:
- from: 'Und es geschah: Als die Menschenkinder anfingen, sich auf der Erde zu vermehren, und ihnen Töchter geboren wurden, sahen die Engel Gottes sie in einem bestimmten Jahr dieses Jubiläums und erkannten, dass sie schön anzusehen waren. Da nahmen sie sich aus allen, die sie erwählten, Frauen; diese gebaren ihnen Kinder, und jene waren die Riesen.[a]'
  to: 'Und es geschah: Als die Menschen begannen, sich auf der Erde zu vermehren, und ihnen Töchter geboren wurden, sahen die Engel Gottes sie in einem Jahr dieses Jubiläums und sahen, dass sie schön anzusehen waren. Da nahmen sie sich Frauen aus allen, die sie erwählten; diese gebaren ihnen Kinder, und diese waren Riesen.'
  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Nuance von „erkannten“, modernisiert die idiomatische Gesamtbezeichnung für die Menschheit und ersetzt das unnatürliche, potenziell missverständliche „jene“ durch einen kontextuell klaren Bezug auf die Kinder. Die Fußnote ist nicht erforderlich, weil der Text den Referenten ohne weitergehende Auslegung erkennen lässt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:56:46Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den ge'ezsprachigen Satzverlauf, die Engel Gottes, die Wahl der Frauen und die Benennung der Nachkommen als Riesen im Wesentlichen zutreffend wieder. „erkannten“ fügt jedoch gegenüber der einfachen Konstruktion „sahen, dass“ eine nicht nötige Nuance hinzu. Der Bezug des abschließenden Pronomens wird im Kontext durch die unmittelbar genannten Kinder hinreichend angezeigt.
  naturalness: „Menschenkinder“ und besonders „jene waren die Riesen“ wirken im modernen Standarddeutsch unnötig künstlich. „Die Menschen“ gibt die idiomatische Gesamtbezeichnung wieder; „diese waren Riesen“ stellt den Kontextbezug natürlich her, ohne eine zusätzliche historische oder theologische Deutung einzutragen.
  terminology: „Engel Gottes“, „Jubiläum“, „Frauen“ und „Riesen“ sind quellennahe, verständliche und theologisch neutrale Wiedergaben. „Riesen“ sollte prädikativ ohne bestimmten Artikel stehen.
  issues:
  - severity: medium
    issue: „erkannten, dass sie schön anzusehen waren“
    rationale: Das ge'ezsprachige „sahen … dass sie schön anzusehen waren“ enthält kein eigenes Verb für ein zusätzliches Erkennen. Die Ergänzung ist zwar geringfügig, aber für eine quellennahe Übersetzung entbehrlich.
  - severity: medium
    issue: „jene waren die Riesen“ mit erläuternder Fußnote
    rationale: Das Demonstrativpronomen „jene“ ist hier im Deutschen stilistisch unnatürlich und kann den Bezug eher verunklaren. Nach „Kinder“ bezeichnet „diese“ die Kinder kontextuell klar; die Fußnote behauptet zugleich eine formale Knappheit, die im Haupttext bereits durch die Wahl von „jene“ künstlich verstärkt wird.
  - severity: low
    issue: „Menschenkinder“
    rationale: Die traditionelle Formulierung ist verständlich, aber im angestrebten modernen Standarddeutsch weniger natürlich. Der Ausdruck bezeichnet hier die Menschen allgemein, nicht eine abgegrenzte Gruppe von Kindern.
  revised_text: 'Und es geschah: Als die Menschen begannen, sich auf der Erde zu vermehren, und ihnen Töchter geboren wurden, sahen die Engel Gottes sie in einem Jahr dieses Jubiläums und sahen, dass sie schön anzusehen waren. Da nahmen sie sich Frauen aus allen, die sie erwählten; diese gebaren ihnen Kinder, und diese waren Riesen.'
