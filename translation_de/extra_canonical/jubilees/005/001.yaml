base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: de
  text: 'Und es geschah: Als die Menschen begannen, sich auf der Erde zu vermehren, und ihnen Töchter geboren wurden, sahen die Engel Gottes sie in einem Jahr dieses Jubiläums und sahen, dass sie schön anzusehen waren. Da nahmen sie sich Frauen aus allen, die sie erwählten; diese gebaren ihnen Kinder, und diese waren Riesen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: Menschenkinder
  rationale: Die traditionelle, quellennahe Wiedergabe bewahrt die semitisch geprägte Ausdrucksweise und bezeichnet die Menschen insgesamt.
- source_word: መላእክተ፡ እግዚአብሔር
  choice: Engel Gottes
  rationale: Direkte und theologisch neutrale Wiedergabe der äthiopischen Bezeichnung.
- source_word: ሠናያት፡ ለርእይ
  choice: schön anzusehen
  rationale: Gibt sowohl die Schönheit als auch den ausdrücklichen Bezug auf das Sehen wieder.
- source_word: ነሥእዎን፡ ሎሙ፡ አንስቲያ
  choice: nahmen sie sich … Frauen
  rationale: Bewahrt die aktive, possessiv formulierte Wendung des Ausgangstextes, ohne zusätzliche Wertung.
- source_word: ረዐይት
  choice: Riesen
  rationale: Entspricht der substantivischen Bezeichnung im überlieferten äthiopischen Text und dem Erzählzusammenhang.
theological_decisions:
- issue: Identität der Wesen, die die Frauen nehmen
  choice: Engel Gottes
  alternative: Söhne Gottes
  rationale: Der vorliegende ge'ezsprachige Text nennt ausdrücklich die Engel Gottes; die aus Genesis 6 bekannte alternative Formulierung wird daher nicht in den Haupttext eingetragen.
- issue: Bezug des abschließenden Pronomens
  choice: jene waren die Riesen
  alternative: diese Kinder waren die Riesen
  rationale: Die pronominale Formulierung des Ausgangstextes bleibt erkennbar, während der unmittelbare Zusammenhang die Kinder als Referenten nahelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht biblischem Erzählton. Die langen Satzverbindungen des Ge'ez wurden behutsam gegliedert; traditionelle Schlüsselbegriffe wie »Menschenkinder«, »Engel Gottes«, »Jubiläum« und »Riesen« wurden beibehalten.
