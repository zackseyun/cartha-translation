  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: de
  text: Und der Herr sah die Erde, und siehe, sie war verdorben; alles Fleisch hatte seine Ordnung verdorben, und alle, die auf der Erde waren, hatten vor seinen Augen Böses getan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሰነት / አማሰነት (māsanat / ʾamāsanat)
  choice: war verdorben / hatte … verdorben
  rationale: Die wiederholte Wortwurzel wird durch die Wiederholung von „verdorben“ bewahrt; sie bezeichnet sowohl den Zustand der Erde als auch das verderbliche Handeln alles Fleisches.
- source_word: ሥርዓታ (śərʿāta)
  choice: seine Ordnung
  rationale: Das Wort bezeichnet Ordnung, Regel oder Satzung. „Ordnung“ wahrt den Bezug auf die geschöpfliche Ordnung und vermeidet die ungenauere Wiedergabe „Weg“.
- source_word: ኵሉ ዘሤጋ (kwəllu za-śəga)
  choice: alles Fleisch
  rationale: Die traditionelle anthropologische Sammelbezeichnung wird formal bewahrt und entspricht dem biblischen Sprachgebrauch.
- source_word: አእከየ (ʾaʾkaya)
  choice: hatten … Böses getan
  rationale: Eine natürliche deutsche Wiedergabe des Verbs für böses beziehungsweise schlechtes Handeln.
theological_decisions:
- issue: Bezug des Possessivsuffixes in „seine Ordnung“
  choice: Bezug auf „alles Fleisch“ als kollektive Größe
  alternative: „die Ordnung“ oder ausdrücklich „die ihm gesetzte Ordnung“
  rationale: Das Quellwort trägt ein Possessivsuffix; die knappe Form „seine Ordnung“ erhält diese grammatische Gestalt, ohne deren theologischen Ursprung erläuternd auszubauen.
- issue: Verderbnis der Erde und des Fleisches
  choice: Wiederholung desselben deutschen Wortstamms
  alternative: „verwüstet“ für die Erde und „verdorben“ für alles Fleisch
  rationale: Die Wiederholung bildet die lexikalische Verknüpfung der Quelle ab und lässt die Spannung zwischen dem Zustand der Erde und dem Handeln ihrer Bewohner bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischer Satzführung. „Und siehe“ sowie „alles Fleisch“ bleiben als verständliche traditionelle Formulierungen erhalten; unnötige archaische Formen werden vermieden.
