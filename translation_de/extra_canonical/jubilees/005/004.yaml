  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: de
  text: 'Und er sagte: »Ich werde die Menschen und alles Fleisch auf der Oberfläche der Erde, die ich erschaffen habe, vernichten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አይመሰለ
  choice: ich werde … vernichten
  rationale: Das Verb wird im gegebenen Kontext als Vernichtungsankündigung verstanden; die deutsche Futurform gibt den angekündigten Entschluss natürlich wieder.
- source_word: ለሰብእ
  choice: die Menschen
  rationale: Das kollektive »Mensch/Menschheit« wird im modernen Deutschen idiomatisch mit dem generischen Plural wiedergegeben.
- source_word: ለኵሉ ዘሥጋ
  choice: alles Fleisch
  rationale: Die wörtliche, traditionsreiche Wendung bewahrt den umfassenden Bezug auf sterbliche Lebewesen, ohne ihn enger auszulegen.
- source_word: በመልዕልተ ገጸ ምድር
  choice: auf der Oberfläche der Erde
  rationale: በ bezeichnet hier die Lage »auf«; »von … hinweg« wird nicht ergänzt. ገጸ ምድር wird formal und verständlich als »Oberfläche der Erde« wiedergegeben.
- source_word: ዘፈጠርኩ
  choice: die ich erschaffen habe
  rationale: Der Relativsatz bleibt aufgrund der grammatischen Anschlussmöglichkeit bewusst mehrdeutig und kann sich im Deutschen auf »Erde« beziehen.
theological_decisions:
- issue: Bezugswort des Relativsatzes »die ich erschaffen habe«
  choice: weibliche Singularform nach »Erde«
  alternative: »die ich erschaffen habe« auf Menschen und alles Fleisch beziehen bzw. ausdrücklich »das ich erschaffen habe« formulieren
  rationale: Die Oberflächenstruktur stellt den Relativsatz unmittelbar hinter »Erde«; die Übersetzung bewahrt diesen möglichen Bezug, statt die schöpfungstheologische Aussage durch eine Glättung festzulegen.
- issue: Präposition vor »Oberfläche der Erde«
  choice: auf
  alternative: von … hinweg
  rationale: Die belegte ge'ezische Form በመልዕልተ bedeutet hier »auf/über« und enthält keine Ablativmarkierung; eine Angleichung an Genesis 6,7 wird vermieden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Alles Fleisch« bleibt als bewusst bibelsprachliche, aber allgemein verständliche Wendung erhalten; ansonsten wurde eine natürliche deutsche Satzgestalt gewählt.
