  source_fidelity: 'Die Übersetzung folgt dem ge''ezischen Satzbau und Sinngehalt zuverlässig: Die Vernichtungsankündigung richtet sich gegen den Menschen/die Menschen und »alles Fleisch«; die Ortsangabe lautet zutreffend »auf der Oberfläche der Erde« und fügt kein im Ausgangstext nicht vorhandenes »von … hinweg« ein. Der abschließende Relativsatz wird in der dem Text entsprechenden Stellung bewahrt.'
  naturalness: '»Und er sagte: ›Ich werde die Menschen und alles Fleisch auf der Oberfläche der Erde, die ich erschaffen habe, vernichten.‹« ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. »Alles Fleisch« ist bewusst traditionssprachlich, aber im biblischen Kontext idiomatisch und sachgerecht.'
  terminology: Die Wiedergaben »die Menschen«, »alles Fleisch«, »Oberfläche der Erde« und »erschaffen« sind terminologisch tragfähig. Die feminine Form in »die ich erschaffen habe« knüpft im Deutschen natürlich an »Erde« an und bildet die Stellung des ge'ezischen Relativsatzes ab, ohne eine zusätzliche Ablativbedeutung einzutragen.
