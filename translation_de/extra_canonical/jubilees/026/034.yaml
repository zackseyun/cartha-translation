translation:
  language: de
  text: … soll deine Wohnstätte sein und vom Tau des Himmels droben.[a] Von deinem Schwert wirst du leben, und deinem Bruder wirst du dienen. Doch wenn du dich auflehnst[b] und das Joch von deinem Nacken abschüttelst, dann wirst du eine Sünde in vollem Maß begehen, die zum Tod führt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang dieses Verses ist im überlieferten Wortlaut schwierig und wirkt unvollständig. Er wird hier nicht nach 1. Mose 27,39 ergänzt oder geglättet.
    reason: textual_variant
  - marker: b
    text: Das zugrunde liegende Verb kann auch „dich weigerst“, „dich erhebst“ oder „groß wirst“ bedeuten.
    reason: lexical_ambiguity
  - marker: c
    text: 'Wörtlicher: „eine ganze/vollständige Sünde zum Tod begehen“. Die Lesart weicht von 1. Mose 27,40 ab und wird nicht an diesen Paralleltext angeglichen.'
    reason: textual_variant
lexical_decisions:
- source_word: ንብረትከ
  choice: deine Wohnstätte
  rationale: Das Substantiv bezeichnet hier im Zusammenhang des Segens den Wohnsitz bzw. Lebensraum; die fragmentarisch überlieferte Satzöffnung wird nicht gegen den Wortlaut ergänzt.
- source_word: በመጥባኅትከ፡ ትሐዩ
  choice: Von deinem Schwert wirst du leben
  rationale: Bewahrt das konkrete Bild und den instrumentalen Sinn der ge’ezischen Wendung in idiomatischem Deutsch.
- source_word: ትትቀነይ
  choice: wirst du dienen
  rationale: Gibt die Unterordnung gegenüber dem Bruder direkt wieder, ohne sie als freiwillige Hilfe abzuschwächen.
- source_word: አበይከ
  choice: du dich auflehnst
  rationale: Der Verbform liegt ein Sinnfeld von Sich-Widersetzen, Verweigern bzw. Sich-Erheben zugrunde; die zweite Person Singular bleibt erhalten und wird nicht fälschlich auf den Vater bezogen.
- source_word: አስሰልከ፡ አርዑተ
  choice: das Joch … abschüttelst
  rationale: Das Verb bezeichnet das Beseitigen oder Abwerfen; „abschütteln“ ist im Bild des Jochs natürlich und bewahrt den handelnden Adressaten als Subjekt.
- source_word: ትኤብስ፡ አበሳ፡ ኵሎ፡ ለሞት
  choice: eine Sünde in vollem Maß begehen, die zum Tod führt
  rationale: Das singularische „Sünde“ wird durch „ganz/vollständig“ bestimmt; die Wiedergabe vermeidet die irreführende Aussage „alle Sünden“ und macht die Ziel- bzw. Ergebnisbeziehung zu Tod verständlich.
theological_decisions:
- issue: Sünde zum Tod
  choice: eine Sünde in vollem Maß begehen, die zum Tod führt
  alternative: eine vollkommene Sünde zum Tod begehen
  rationale: Die gewählte Fassung bewahrt den schwerwiegenden Zusammenhang von Sünde und Tod, ohne eine spätere dogmatische Kategorie festzuschreiben oder im Deutschen eine moralische „Vollkommenheit“ der Sünde nahezulegen.
- issue: Abweichung von Genesis 27,40
  choice: die schwierigere ge’ezische Lesart beibehalten
  alternative: an den bekannten Wortlaut von Genesis 27,40 angleichen
  rationale: Der vorliegende Text erweitert bzw. verändert die Genesis-Parallele. Diese Spannung wird nicht durch Harmonisierung beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzöffnung bleibt durch Auslassungspunkte als Fragment erkennbar. Konkrete Bilder wie Schwert, Joch und Nacken bleiben erhalten; schwierige Lesarten werden im Haupttext verständlich formuliert und in den Fußnoten transparent gemacht.
