  terminology: „Wohnstätte“, „Schwert“, „dienen“, „Joch“, „Nacken“ und „Sünde“ sind sachgerecht und registerstimmig. „Sünde in vollem Maß“ ist zwar bewusst markiert, aber für die ungewöhnliche Qualifikation der singularischen Sünde eine sinnvolle moderne Lösung, ohne spätere dogmatische Kategorien einzutragen.
