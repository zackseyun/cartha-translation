lexical_decisions:
- source_word: ተደመ፡ … ድማመ፡ ዐቢየ፡ ጥቀ
  choice: erschrak … über alle Maßen
  rationale: Die Wortverbindung bezeichnet eine außerordentlich starke Bestürzung bzw. ein tiefes Erschrecken. Die deutsche Formulierung gibt die emphatische Wiederholung idiomatisch wieder, ohne die Bedeutung aus dem hebräischen Genesistext zu übernehmen.
- source_word: መኑ፡ ውእቱ፡ ዝንቱ
  choice: Wer ist denn derjenige
  rationale: Bewahrt die gegenwärtige Frage und den hinweisenden Charakter von ዝንቱ, klingt dabei im modernen Deutschen natürlicher als das wörtliche „Wer ist dieser?“.
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: der gejagt und Wild gefangen
  rationale: Gibt beide Verben wieder und bewahrt damit die gegenüber Genesis ausführlichere Formulierung des ge’ezischen Jubiläenbuchs.
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: Ich aß von allem
  rationale: Die schlichte parataktische Aussage entspricht dem Quelltext und vermeidet eine nicht ausdrücklich markierte kausale Verknüpfung.
theological_decisions:
- issue: Umfang von Isaaks Frage
  choice: Das Fragezeichen steht am Ende der gesamten Äußerung.
  alternative: Die erste Frage nach dem Jäger als eigenständige Frage abtrennen und die folgenden Sätze als Aussagen setzen.
  rationale: Die Folge der mit „und“ verbundenen Teilsätze gehört im Quellzusammenhang zu Isaaks erstaunter Frage. Die Interpunktion hält diese Spannung offen, statt die Syntax stärker als nötig aufzuteilen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die emphatische ge’ezische Konstruktion wird idiomatisch als „über alle Maßen“ wiedergegeben; die Reihung der Handlungen bleibt knapp und quellennah.
