  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: de
  text: 'Und Jakob sagte zu seiner Mutter Rebekka: „Mutter, sollte mir etwa etwas von all dem fehlen, was mein Vater isst und was ihm schmeckt?[a] Doch ich fürchte, Mutter, dass er meine Stimme erkennt und mich betasten will. Du weißt ja, dass ich glatte Haut habe, mein Bruder Esau aber behaart ist. Dann werde ich in seinen Augen wie einer erscheinen, der ihn verspottet; ich werde etwas tun, was er mir nicht befohlen hat, und er wird mir zürnen. So werde ich einen Fluch über mich bringen und keinen Segen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Anfang des Verses ist textlich und sprachlich schwierig. Möglich ist sinngemäß auch: „Sollte mir etwas von all dem fehlen, was mein Vater gewöhnlich isst und gern hat?“'
    reason: segmentation_note
lexical_decisions:
- source_word: ኢይምሕክ
  choice: sollte mir etwa etwas … fehlen
  rationale: Die idiomatische Wendung wird als Frage nach einem Mangel wiedergegeben; dies folgt dem revidierten quellensprachlichen Befund und vermeidet die frühere Deutung als „erkennen“.
- source_word: ወያሠምሮ
  choice: und was ihm schmeckt
  rationale: Das Verb bezeichnet hier, dass die Speise dem Vater gefällt; im Zusammenhang mit Essen ist „schmeckt“ natürliches modernes Deutsch.
- source_word: ኢይለቡ፡ ቃልየ
  choice: dass er meine Stimme erkennt
  rationale: Nach dem Verb des Fürchtens drückt die Konstruktion die befürchtete positive Möglichkeit aus, nicht eine tatsächliche Verneinung.
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: und mich betasten will
  rationale: 'ይፍቅድ bezeichnet Wollen oder Beabsichtigen, und ይገሥሠኒ hat Jakob als Objekt: Isaak will ihn durch Berührung prüfen.'
- source_word: ልሙጽ
  choice: glatte Haut habe
  rationale: „Glatt“ wird für heutige Leser ausdrücklich auf Jakobs unbehaarte Haut bezogen.
- source_word: ዘያስተአኪ
  choice: der ihn verspottet
  rationale: Bewahrt den Vorwurf, Jakob könne in Isaaks Augen wie jemand erscheinen, der ihn zum Narren hält.
theological_decisions:
- issue: Jakobs erwartete Folge der Täuschung
  choice: einen Fluch über mich bringen und keinen Segen
  alternative: mir Fluch statt Segen zuziehen
  rationale: Die Formulierung erhält den deutlichen Gegensatz zwischen Fluch und Segen, ohne Jakobs Motivation moralisch oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „Mutter“ und die wiederholte Sorge Jakobs bleiben erhalten. „Betasten“ gibt die prüfende Berührung präziser wieder als das neutralere „berühren“.
