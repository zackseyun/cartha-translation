revisions:
- from: 'Da schrie er sehr laut und bitter auf und sagte zu seinem Vater: »Segne auch mich, mein Vater!« Dieser erwiderte ihm: »Dein Bruder ist mit List gekommen und hat deine Segnungen weggenommen.« Da sagte er: »Jetzt weiß ich, weshalb er Jakob genannt wurde:[a] Er hat mich nun schon zum zweiten Mal verdrängt. Zuerst nahm er mir mein Erstgeburtsrecht, und jetzt hat er mir meinen Segen genommen.«'
  to: 'Da schrie er sehr laut und bitter auf und sagte zu seinem Vater: »Segne auch mich, mein Vater!« Da sagte sein Vater zu ihm: »Dein Bruder ist mit List gekommen und hat deine Segnungen weggenommen.« Da sagte er: »Jetzt weiß ich, weshalb er Jakob genannt wurde:[a] Er hat mich nun schon zum zweiten Mal übervorteilt. Zuerst nahm er mir mein Erstgeburtsrecht, und jetzt hat er mir meinen Segen genommen.«'
  rationale: Die Revision ersetzt lediglich das zu enge »verdrängt« durch »übervorteilt« und verdeutlicht die Sprecherreferenz. Der Plural »deine Segnungen« und der spätere Singular »meinen Segen« bleiben entsprechend dem ge'ezischen Text bewusst erhalten. Die Fußnote wird sprachlich präzisiert, ohne die umstrittene Namensetymologie über das im Text vorliegende Wortspiel hinaus festzulegen.
