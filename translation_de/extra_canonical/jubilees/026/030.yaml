  yaml_path: translation/extra_canonical/jubilees/026/030.yaml
  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: de
  text: 'Da schrie er sehr laut und bitter auf und sagte zu seinem Vater: »Segne auch mich, mein Vater!« Da sagte sein Vater zu ihm: »Dein Bruder ist mit List gekommen und hat deine Segnungen weggenommen.« Da sagte er: »Jetzt weiß ich, weshalb er Jakob genannt wurde:[a] Er hat mich nun schon zum zweiten Mal übervorteilt. Zuerst nahm er mir mein Erstgeburtsrecht, und jetzt hat er mir meinen Segen genommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Jakob wird hier in einem Wortspiel mit »Ferse« und mit dem Übervorteilen oder Verdrängen verbunden.
    reason: Das Namenswortspiel ist im Deutschen nicht unmittelbar erkennbar und lässt sich im Haupttext nicht mit einem einzigen Verb vollständig wiedergeben.
lexical_decisions:
- source_word: በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: sehr laut und bitter
  rationale: Gibt die große, überaus bittere Stimme als natürliches deutsches Aufschreien wieder, ohne die Intensität abzuschwächen.
- source_word: በረከታቲከ
  choice: deine Segnungen
  rationale: Bewahrt bewusst den Plural der Ge’ez-Form, obwohl später im Vers der Singular »mein Segen« steht.
- source_word: በሕብል
  choice: mit List
  rationale: Bezeichnet hier betrügerisches beziehungsweise arglistiges Vorgehen; »mit List« ist knapp, idiomatisch und lässt die moralische Wertung erkennen.
- source_word: አዐቀጸኒ
  choice: Er hat mich … verdrängt
  rationale: Gibt die Vorstellung des Beiseitedrängens beziehungsweise Verdrängens wieder und passt zum Namenswortspiel um Jakob, ohne es mit einer zu engen Auslegung festzulegen.
- source_word: ልደተየ
  choice: mein Erstgeburtsrecht
  rationale: Im Erzählzusammenhang ist nicht die Geburt selbst, sondern das mit der Erstgeburt verbundene Recht gemeint.
theological_decisions:
- issue: Numerus bei Isaaks Segenswort und Esaus Rückblick
  choice: Zunächst Plural »deine Segnungen«, später Singular »meinen Segen«
  alternative: Beide Stellen im Singular harmonisieren
  rationale: Die unterschiedlichen Numeri des Ge’ez-Textes werden erhalten und nicht aus inhaltlichen Gründen angeglichen.
- issue: Wortspiel mit dem Namen Jakob
  choice: Im Haupttext »weshalb er Jakob genannt wurde« und »verdrängt«, ergänzt durch eine Fußnote
  alternative: Das Wortspiel durch eine freie deutsche Namensdeutung vollständig ausformulieren
  rationale: Eine direkte deutsche Wiedergabe kann das zugrunde liegende Namenswortspiel nicht vollständig abbilden; die Fußnote informiert, ohne den Haupttext konfessionell oder interpretativ zu überladen.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerisch natürlicher direkter Rede. »Da schrie er sehr laut und bitter auf« vermeidet eine hölzerne Nachbildung von »mit einer großen und sehr bitteren Stimme«. Die emphatische Bitte wird durch »auch mich« bewahrt.
