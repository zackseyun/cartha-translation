  terminology: »Segnungen« muss hier den ge'ezischen Plural bewahren; der spätere Singular »meinen Segen« darf nicht harmonisiert werden. »Übervorteilt« ist für die betreffende Aussage Esaus natürlicher und semantisch treffender als »verdrängt«, ohne eine engere dogmatische Deutung einzutragen. Die Fußnote erläutert das im Deutschen nicht reproduzierbare Namenswortspiel zurückhaltend.
