  yaml_path: translation/extra_canonical/jubilees/026/024.yaml
  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: de
  text: Nationen und Völker sollen sich vor dir niederwerfen.[a] Sei Herr über deine Brüder, und die Söhne deiner Mutter sollen sich vor dir niederwerfen. Der ganze Segen, mit dem Gott mich gesegnet und meinen Vater Abraham gesegnet hat, soll dir und deinen Nachkommen zuteilwerden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Wortlaut beginnt unvermittelt mit „Nationen“; möglicherweise hängt dieses Wort syntaktisch noch mit dem Ende des vorhergehenden Verses zusammen.
    reason: Die Versabgrenzung lässt am Anfang einen syntaktisch schwierigen Wortlaut entstehen; die Hauptübersetzung gibt dennoch alle im angegebenen Vers stehenden Wörter wieder.
lexical_decisions:
- source_word: አሕዛብ፡ … ሕዝብ፡
  choice: Nationen und Völker
  rationale: Gibt beide im Vers überlieferten Bezeichnungen wieder und vermeidet die Auslassung von አሕዛብ. Die beiden nahezu synonymen Kollektivbegriffe bleiben unterscheidbar.
- source_word: ይስግዱ፡ ለከ፡
  choice: sollen sich vor dir niederwerfen
  rationale: Der Jussiv wird als Segenswunsch wiedergegeben; „sich niederwerfen“ bewahrt die konkrete Geste der Unterwerfung.
- source_word: ኩን፡ እግዚአ፡
  choice: Sei Herr
  rationale: Entspricht knapp der Aufforderungs- bzw. Wunschform und erhält den Herrschaftsbegriff.
- source_word: ውሉደ፡ እምከ፡
  choice: die Söhne deiner Mutter
  rationale: Formale und im Deutschen verständliche Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: ወለዘርእከ፡
  choice: und deinen Nachkommen
  rationale: Das kollektive „Same“ bezeichnet hier die Nachkommenschaft; „Nachkommen“ ist im heutigen Deutsch natürlich und lässt Singularität oder Vielheit des Kollektivs offen.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: Gott
  alternative: der HERR
  rationale: Im Kontext der vorliegenden Textgestalt und der auditierten Vergleichsfassung wird die allgemeine Gottesbezeichnung gewählt, ohne eine besondere Bundesnamens-Deutung einzutragen.
- issue: Reichweite des Segens
  choice: Der ganze Segen … soll dir und deinen Nachkommen zuteilwerden
  alternative: Alle Segnungen … seien für dich und deinen Samen
  rationale: Der Singular „Segen“ und seine Weitergabe an den Angeredeten samt Nachkommenschaft werden bewahrt, ohne die Aussage dogmatisch näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer Segenssprache. Die parallelen Wunschformen werden einheitlich mit „sollen“ wiedergegeben; unnötig altertümliche Wendungen wie „Same“ oder „seien dir“ werden vermieden.
