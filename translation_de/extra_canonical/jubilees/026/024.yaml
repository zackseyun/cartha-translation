  source_fidelity: Die Übersetzung gibt die im überlieferten Versbeginn stehenden Begriffe für „Nationen“ und „Völker“ wieder und bewahrt die segensartige Wunschform. „Sei Herr über deine Brüder“, „die Söhne deiner Mutter“ sowie die Übertragung des Segens auf den Angeredeten und seine Nachkommenschaft entsprechen dem geezischen Wortlaut. Die Anmerkung weist angemessen auf die durch die Versabgrenzung bedingte syntaktische Schwierigkeit am Anfang hin.
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch und wahrt zugleich den würdevollen Registerton eines Segensspruchs. „sollen sich vor dir niederwerfen“ und „soll … zuteilwerden“ bilden die Wunschformen verständlich und einheitlich ab.
  terminology: „Nationen und Völker“ erhält die beiden überlieferten Kollektivbezeichnungen. „Herr“, „Gott“, „Söhne deiner Mutter“ und „Nachkommen“ sind sachgerecht, idiomatisch und theologisch nicht überdeutend. „Nachkommen“ gibt das kollektive Bild von „Same“ ohne unnötigen Archaismus wieder.
