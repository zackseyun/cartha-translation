lexical_decisions:
- source_word: ወልድየ
  choice: Mein Sohn
  rationale: Direkte Anrede mit Possessivsuffix; der vorliegende Text beginnt ohne einleitendes „Und er sagte“.
- source_word: ረሳዕኩ
  choice: ich bin alt geworden
  rationale: Gibt das Altwerden als eingetretenen Zustand natürlich und quellennah wieder.
- source_word: ከፍአ፡ ለርእይ
  choice: zu schwach, um zu sehen
  rationale: Idiomatiche deutsche Wiedergabe der beeinträchtigten Sehkraft, ohne zusätzliche Ursache oder völlige Blindheit anzunehmen.
- source_word: ኢያአምር
  choice: ich kenne … nicht
  rationale: Entspricht der negierten Aussage des Wissens; „kenne“ klingt in Verbindung mit einem unbekannten Zeitpunkt natürlich.
- source_word: ዕለተ፡ ሞትየ
  choice: den Tag meines Todes
  rationale: Formale und im Deutschen geläufige Entsprechung der Genitivverbindung.
theological_decisions:
- issue: Kenntnis des Todestages
  choice: ich kenne den Tag meines Todes nicht
  alternative: ich weiß nicht, wann ich sterben werde
  rationale: Die quellennähere Formulierung bewahrt das Motiv vom „Tag meines Todes“ und deutet die Aussage nicht weiter aus.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede setzt entsprechend der ge’ezischen Vorlage unmittelbar mit „Mein Sohn“ ein; ein nicht belegtes „Und er sagte“ wurde nicht ergänzt.
