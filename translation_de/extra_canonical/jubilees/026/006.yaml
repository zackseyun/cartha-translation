    rationale: Die ge'ezische Formulierung bezeichnet junge Ziegen bzw. Zicklein; eine explizite Festlegung auf männliche Tiere ist für diese Stelle nicht erforderlich. Die englische Audit-Fassung verwendet ebenfalls die offene Formulierung „young goats“.
