  terminology: „HERR“ ist für እግዚአብሔር angemessen. „Vor dem HERRN“ bewahrt die Formulierung, ohne die Rolle des Vaters als Segnender zu verändern. „Gute“ trifft die Eignungsnuance besser als das eher äußerlich verstandene „schöne“.
