  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: de
  text: 'Und nun, mein Sohn, hör auf meine Stimme und tu, was ich dir gebiete: Geh zu deiner Herde und hol mir zwei gute junge Ziegen. Ich werde sie zu einem Essen für deinen Vater zubereiten, wie er es liebt. Dann bringst du es deinem Vater, damit er isst und dich vor dem HERRN segnet, ehe er stirbt; und du wirst gesegnet sein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ወልድየ፡ ቃልየ፡ ዘአነ፡ እኤዝዘከ
  choice: mein Sohn, hör auf meine Stimme und tu, was ich dir gebiete
  rationale: Die wörtliche Wendung „höre meine Stimme hinsichtlich dessen, was ich dir gebiete“ bezeichnet hier nicht nur akustisches Hören, sondern gehorsames Befolgen. Die Formulierung bewahrt das Bild der Stimme und klingt zugleich natürlich.
- source_word: መርዔትከ
  choice: deiner Herde
  rationale: Der Ausdruck bezeichnet den Tierbestand bzw. die Herde; der Kontext verlangt keine engere Festlegung.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: zwei schöne junge Ziegenböcke
  rationale: Die Wortgruppe bezeichnet zwei geeignete bzw. gute junge Ziegen. „Ziegenböcke“ gibt das männliche Tier im zugrunde liegenden Erzählkontext präzise und idiomatisch wieder; „schöne“ kann bei Tieren auch „gut/ausgesucht“ bedeuten.
- source_word: መብልዐ
  choice: zu einem Essen
  rationale: Das Substantiv bedeutet Speise bzw. Nahrung. „Essen“ ist im modernen Deutsch natürlich und passt zur Zubereitung für den Vater.
- source_word: ዘከመ፡ ያፈቅር
  choice: wie er es liebt
  rationale: Die Formulierung bewahrt die starke Bedeutung von „lieben/mögen“, ohne die Art der Zubereitung über den Quelltext hinaus auszudeuten.
- source_word: ቅድመ፡ እግዚአብሔር
  choice: vor dem HERRN
  rationale: Wörtliche und theologisch offene Wiedergabe der göttlichen Gegenwart bzw. des göttlichen Angesichts; die Kapitälchen entsprechen der üblichen deutschen Wiedergabe des Gottesnamens im biblischen Register.
- source_word: ወትኩን፡ ቡሩከ
  choice: und du wirst gesegnet sein
  rationale: Bewahrt den resultativen/passiven Sinn und unterscheidet ihn von der vorhergehenden aktiven Segenshandlung des Vaters.
theological_decisions:
- issue: Beziehung zwischen väterlichem Segen und Gottes Gegenwart
  choice: „er ... dich vor dem HERRN segnet“
  alternative: „der HERR ... dich segnet“
  rationale: Die Grammatik setzt den Vater als Handelnden fort. „Vor dem HERRN“ lokalisiert bzw. qualifiziert seinen Segen, ohne den Vater mit Gott als Segensspender gleichzusetzen oder die Wirksamkeit des Segens näher zu erklären.
- issue: Gewissheit des abschließenden Segens
  choice: „du wirst gesegnet sein“
  alternative: „damit du gesegnet bist“
  rationale: Die koordinierte Zukunftsaussage wird als zugesicherte Folge wiedergegeben. Damit bleibt die im Text liegende Spannung zwischen menschlichem Handeln, väterlichem Segen und göttlicher Gegenwart bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Erzählton. Die direkte Rede bleibt klar und mündlich, ohne altertümliche Formen. Kurze Sätze entlasten die lange äthiopische Satzkette, während Abfolge und logischer Zusammenhang erhalten bleiben.
