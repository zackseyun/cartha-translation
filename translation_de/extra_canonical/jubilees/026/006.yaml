  source_fidelity: 'Die Wiedergabe folgt der ge''ezischen Satzfolge und den zentralen Aussagen gut: Aufforderung zum Gehorsam, Gang zur Herde, zwei geeignete junge Tiere, Zubereitung, Essen des Vaters, Segen vor dem HERRN vor dessen Tod und der daraus folgende Segen. „Ziegenböcke“ legt jedoch das Geschlecht der Tiere stärker fest, als der Text hier sicher verlangt.'
