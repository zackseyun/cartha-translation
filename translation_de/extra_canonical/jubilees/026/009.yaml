  yaml_path: translation/extra_canonical/jubilees/026/009.yaml
  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: de
  text: Und Jakob hörte auf die Stimme seiner Mutter Rebekka. Er ging, nahm zwei gute, fette Zicklein und brachte sie zu seiner Mutter. Seine Mutter bereitete daraus eine Speise zu, wie er sie liebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐ፡ … ቃለ፡
  choice: hörte auf die Stimme
  rationale: Gibt sowohl das Hören als auch das im Zusammenhang erkennbare Befolgen der Anweisung wieder und bewahrt dabei das ausdrückliche Wort „Stimme“.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡
  choice: zwei Zicklein
  rationale: Natürliche moderne Bezeichnung für zwei junge Ziegen; vermeidet die schwerfällige wörtliche Form „Junge der Ziegen“.
- source_word: ሠናያነ፡ ወስቡሓነ፡
  choice: gute, fette
  rationale: Entspricht den beiden wertenden Beschreibungen des Ausgangstextes, ohne sie zusammenzuziehen.
- source_word: መብልዐ፡
  choice: eine Speise
  rationale: Bewahrt den ausdrücklichen Bezug auf zubereitete Nahrung in einer würdigen, gut verständlichen Form.
- source_word: ዘከመ፡ ያፈቅር።
  choice: wie er sie liebte
  rationale: Erhält die knappe Form und die im Vers selbst nicht ausdrücklich aufgelöste männliche Bezugsperson.
theological_decisions:
- issue: Bezug des männlichen Pronomens in „wie er sie liebte“
  choice: Das Pronomen bleibt unaufgelöst.
  alternative: „wie sein Vater es liebte“ oder „wie Isaak es liebte“
  rationale: Der unmittelbare Vers nennt den Bezug nicht ausdrücklich. Eine namentliche Auflösung wäre zwar aus dem Kontext verständlich, würde aber die echte sprachliche Unbestimmtheit des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am erzählerischen Aufbau des ge’ezischen Textes; leicht schwerfällige Wiederholungen werden nur dort geglättet, wo der Bezug eindeutig bleibt.
