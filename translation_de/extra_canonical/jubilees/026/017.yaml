  yaml_path: translation/extra_canonical/jubilees/026/017.yaml
  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: de
  text: »Die Stimme ist Jakobs Stimme,[a] aber die Hände sind Esaus Hände.« Und er erkannte ihn nicht, denn es war eine Wendung vom Himmel, um seinen Geist hinwegzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verseinteilung in diesem Abschnitt ist in der Textüberlieferung uneinheitlich. Die Aussage über das Erkennen und die anschließende Segenshandlung sind hier in der aus dem Ge'ez am besten nachvollziehbaren Reihenfolge wiedergegeben.
    reason: segmentation_note
lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ፡
  choice: Die Stimme ist Jakobs Stimme
  rationale: Bewahrt die emphatische Wiederholung des Ge'ez und entspricht der Erkennungsformel im Kontext.
- source_word: ሚጠት፡
  choice: eine Wendung
  rationale: Gibt das substantivische Ausdrucksgefüge wieder, statt es zu einer bloßen Herkunftsangabe zu glätten.
- source_word: እምሰማይ፡
  choice: vom Himmel
  rationale: Direkte, natürliche Wiedergabe der Herkunftsangabe; die göttliche Veranlassung bleibt angedeutet, ohne ausdrücklich ergänzt zu werden.
- source_word: ለአሕልፎ፡ መንፈሱ፡
  choice: um seinen Geist abzulenken
  rationale: Gibt die Zweckkonstruktion und das Veranlassen eines Vorübergehens bzw. Abwendens wieder. »Ablenken« ist im Kontext natürlicher als das missverständliche »seinen Geist entfernen«.
theological_decisions:
- issue: Himmlische Veranlassung der Nichterkennung
  choice: es war eine Wendung vom Himmel
  alternative: es kam vom Himmel, seinen Geist abzuwenden
  rationale: Die substantivische Form und die theologische Spannung einer vom Himmel kommenden Einwirkung werden bewahrt, ohne deren genaue Art dogmatisch festzulegen.
- issue: Bedeutung von »Geist« in der Schlussklausel
  choice: seinen Geist abzulenken
  alternative: seinen Geist zu entfernen
  rationale: »Geist« bleibt als mehrdeutiger anthropologischer Begriff erhalten; das Verb wird kontextgerecht wiedergegeben, ohne Tod oder dauerhaften Geistverlust nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung »Die Stimme ist Jakobs Stimme« bleibt erhalten. Die ungewöhnliche Schlussklausel wird bewusst nicht geglättet; »Wendung vom Himmel« wahrt ihre substantivische Form und theologische Offenheit.
