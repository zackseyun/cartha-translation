  source_fidelity: 'Der Satz folgt dem ge''ezischen Wortlaut insgesamt gut: die doppelte Stimmformel, die Gegenüberstellung der Hände, die Nichterkennung sowie die substantivische »Wendung« aus/vom Himmel und der Zweckanschluss bleiben erhalten. In der Schlussklausel ist jedoch »seinen Geist abzulenken« semantisch zu psychologisierend und zu schwach für la-ʾaḥləfo, das ein Hinweggehenlassen/Entfernen bzw. Wegnehmen ausdrückt. Die Mehrdeutigkeit des Gegenstands »sein Geist« soll bewahrt bleiben.'
  naturalness: »Die Stimme ist Jakobs Stimme« ist verständlich, aber im Deutschen ist die possessive Wiederholung »Jakobs Stimme« in beiden Satzteilen leicht schwerfällig. Sie ist hier als formelhafte, emphatische Wiederholung vertretbar. »Wendung vom Himmel« ist bewusst ungewohnt, aber verständlich und dem substantivischen Ausgangstext angemessen. »um seinen Geist hinwegzunehmen« ist natürlich genug und genauer als »abzulenken«.
  terminology: Jakob und Esau sind die üblichen deutschen Namensformen. »Himmel« und »Geist« bewahren die religiös-anthropologische Sprache des Textes. »hinwegzunehmen« legt weder Tod noch eine konfessionell bestimmte Lehre fest und vermeidet die psychologisierende Engführung von »abzulenken«.
