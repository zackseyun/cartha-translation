  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: de
  text: Und nun nimm deine Jagdausrüstung, deinen Köcher und deinen Bogen, geh hinaus aufs Feld, jage und erbeute mir Wild, mein Sohn, und bereite mir eine Speise zu, die meine Seele liebt. Bring sie mir, damit ich esse und meine Seele dich segne, bevor ich sterbe.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ፡ ነፃዊከ
  choice: deine Jagdausrüstung
  rationale: Gibt die Ausrüstung beziehungsweise Geräte für die Jagd in natürlichem modernem Deutsch wieder; Köcher und Bogen werden anschließend einzeln genannt.
- source_word: ምትኃደከ
  choice: deinen Köcher
  rationale: Entspricht dem im Kontext genannten Behältnis für die Pfeile.
- source_word: ወነዐው፡ ሊተ፡ ወአንዝ፡ ሊተ
  choice: jage und erbeute mir Wild
  rationale: Bewahrt die zwei aufeinanderfolgenden Verben des ge'ezischen Textes, statt sie zu einem einzigen Jagdverb zusammenzuziehen. „Erbeuten“ bezeichnet hier das erfolgreiche Fangen beziehungsweise Erlangen des Wildes.
- source_word: ነፍስየ
  choice: meine Seele
  rationale: Erhält die zweimalige ausdrückliche Nennung der Seele und damit die Bildsprache und Wiederholung des Ausgangstextes.
- source_word: መብልዐ
  choice: eine Speise
  rationale: „Speise“ ist eine natürliche, würdige Wiedergabe für zubereitetes Essen in diesem literarischen Zusammenhang.
theological_decisions:
- issue: Die Seele als liebendes und segnendes Subjekt
  choice: die konkrete Formulierung „meine Seele“ an beiden Stellen beibehalten
  alternative: idiomatisch mit „was ich gern esse“ und „damit ich dich segne“ wiedergeben
  rationale: Der Ausgangstext nennt ausdrücklich und wiederholt die Seele. Die Übersetzung bewahrt diese anthropologische Ausdrucksweise, ohne sie dogmatisch zu erklären oder zu glätten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzfolge bleibt nahe am ge'ezischen Text; die Doppelung der Jagdverben und die Wiederholung von „meine Seele“ werden bewusst erhalten.
