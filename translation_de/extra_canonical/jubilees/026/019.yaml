  text: And he said, “Are you really my son Esau?” And he said, “I am your son.” And he said, “Bring it near to me, and I will eat.”
translation:
  language: de
  text: 'Und er sagte: »Bist du wirklich mein Sohn Esau?« Er sagte: »Ich bin dein Sohn.« Und er sagte: »Bring es mir her, und ich werde essen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንተኑ
  choice: Bist du wirklich
  rationale: Die Fragepartikel -ኑ markiert eine bestätigende bzw. prüfende Frage; »wirklich« gibt diesen Nachdruck im natürlichen Deutschen wieder.
- source_word: ወልድየ፡ ዔሳው
  choice: mein Sohn Esau
  rationale: Entspricht der direkten Anrede beziehungsweise Identifizierung als »mein Sohn Esau«, ohne die Wortfolge unnötig zu glätten.
- source_word: አቅርብ፡ ሊተ
  choice: Bring es mir her
  rationale: Der Imperativ bezeichnet das Heranbringen zum Sprecher; das sächliche Pronomen nimmt das im Zusammenhang gemeinte Essen auf.
- source_word: ወእብላዕ
  choice: damit ich esse
  rationale: Die koordinierende Form kann hier zielbezogen verstanden werden; diese deutsche Fassung bildet den natürlichen Sinn der Aufforderung ab.
