  yaml_path: translation/extra_canonical/jubilees/026/031.yaml
  text: And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance.”
translation:
  language: de
  text: 'Und er sagte: „Hast du denn keinen Segen für mich zurückbehalten, Vater?“ Isaak antwortete und sagte zu Esau: „Sieh, ich habe ihn zum Herrn über dich eingesetzt und ihm alle seine Brüder als Diener gegeben; und mit Überfluss …“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende ge’ezische Quelltext bricht hier mit der unvollständigen Wendung „und mit Überfluss“ ab.
    reason: Die Fußnote kennzeichnet den fragmentarischen Versschluss und verhindert, dass die Auslassungspunkte als freie stilistische Ergänzung missverstanden werden.
lexical_decisions:
- source_word: በረከተ
  choice: einen Segen
  rationale: Das Substantiv ist hier nicht bestimmt; „einen Segen“ gibt die Bitte Esaus im natürlichen Deutschen genau wieder.
- source_word: እግዚአ፡ ሤምክዎ፡ ለከ
  choice: ich habe ihn zum Herrn über dich eingesetzt
  rationale: Die Konstruktion bezeichnet Jakobs Einsetzung zum Herrn in Bezug auf Esau; „über dich“ macht dieses Verhältnis im Deutschen verständlich, ohne den Aussagegehalt zu erweitern.
- source_word: አግብርተ፡ ይኩንዎ
  choice: als Diener gegeben
  rationale: Die Wendung besagt, dass seine Brüder ihm als Diener unterstellt wurden. Die knappe deutsche Form vermeidet eine schwerfällige wörtliche Wiedergabe.
- source_word: በብዝኀ
  choice: mit Überfluss
  rationale: Die vorhandene Quelle endet mit dieser unvollständigen Präpositionalwendung. Die Wiedergabe wahrt sowohl den Begriff des Überflusses als auch den fragmentarischen Charakter.
theological_decisions:
- issue: Reichweite der Isaak verliehenen Herrschaft
  choice: „zum Herrn über dich“ und „alle seine Brüder als Diener“
  alternative: Die Brüder kollektiv als Völker oder Nachkommen auslegen
  rationale: Der Wortlaut wird auf der Figurenebene wiedergegeben; eine spätere nationale oder konfessionelle Deutung wird nicht in die Übersetzung eingetragen.
- issue: Unvollständiger Versschluss
  choice: Das Fragment wird mit Auslassungspunkten bewahrt
  alternative: Aus Genesis 27,37 sinngemäß „mit Getreide und Wein versorgt“ ergänzen
  rationale: Der bereitgestellte ge’ezische Quelltext enthält lediglich „und mit Überfluss“. Nicht vorhandene Wörter werden trotz der Parallelüberlieferung nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Redeformel „antwortete und sagte“ bleibt wegen ihrer erzählerischen Funktion erhalten. Der ungewöhnliche Schluss wird nicht geglättet oder aus dem biblischen Paralleltext ergänzt.
