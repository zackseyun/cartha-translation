  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: de
  text: 'Da sagte seine Mutter Rebekka zu ihm: »Dein Fluch komme über mich, mein Sohn! Hör nur auf meine Stimme.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላዕሌየ፡ መርገምከ፡
  choice: Dein Fluch komme über mich
  rationale: Die elliptisch-optative Formulierung wird im Deutschen mit »komme« natürlich und würdevoll wiedergegeben, ohne die von der Mutter übernommene mögliche Fluchfolge abzuschwächen.
- source_word: ዳእሙ፡
  choice: nur
  rationale: Gibt die einschränkende beziehungsweise nachdrückliche Partikel knapp und idiomatisch wieder.
- source_word: ስማዕ፡ ቃልየ።
  choice: Hör … auf meine Stimme
  rationale: Bewahrt das konkrete Bild von »Stimme« und zugleich den idiomatischen Sinn der Aufforderung, ihrer Weisung zu folgen.
theological_decisions:
- issue: Rebekkas Übernahme des möglichen Fluches
  choice: Dein Fluch komme über mich
  alternative: Der Fluch, der dich trifft, soll auf mir liegen
  rationale: Die knappe Form wahrt die Spannung und die direkte Zuordnung »dein Fluch«, ohne zu erklären, ob Rebekka den Fluch rechtlich, stellvertretend oder lediglich rhetorisch übernimmt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und nachdrücklich; »Stimme« erhält die quellensprachliche Bildlichkeit.
