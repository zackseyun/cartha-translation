  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: de
  text: Und Isaak erkannte ihn nicht, denn seine Hände waren behaart wie die Hände seines Bruders Esau; so segnete er ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er ihn segnete“.'
    reason: Die ge’ezische Konstruktion mit ከመ kann hier als Folge oder als Zweck verstanden werden.
lexical_decisions:
- source_word: ኢያእመረ (ʾiyāʿmara)
  choice: erkannte ihn nicht
  rationale: 'Gibt das Verbum des Erkennens im erzählerischen Zusammenhang natürlich wieder: Isaak durchschaute Jakobs Identität nicht.'
- source_word: ጸጓር (ṣagwār)
  choice: behaart
  rationale: Beschreibt die fühlbare Behaarung der Hände knapp und idiomatisch, entsprechend dem Vergleich mit Esaus Händen.
- source_word: ከመ (kama) + ይባርኮ (yəbārəko)
  choice: so segnete er ihn
  rationale: Im Erzählzusammenhang liegt eine resultative Folge nahe. Die Konstruktion kann jedoch auch final verstanden werden; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis zwischen Isaaks Nichterkennen und dem Segen
  choice: 'resultativ: „so segnete er ihn“'
  alternative: 'final: „damit er ihn segnete“'
  rationale: Der unmittelbare Erzählablauf spricht für die Folgehandlung, doch ከመ mit der betreffenden Verbform lässt auch eine Zweckangabe zu. Keine Deutung wird als theologische Aussage über die Wirksamkeit oder Absicht des Segens ausgebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der ge’ezischen Abfolge, während das Semikolon die Folgerung verständlich markiert.
