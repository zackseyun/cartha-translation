base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/005.yaml
  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: de
  text: 'Und Rebekka rief ihren Sohn Jakob und sagte zu ihm: »Sieh, ich habe gehört, wie dein Vater Isaak mit deinem Bruder Esau sprach und sagte: ›Jage für mich Wild und bereite mir eine Speise zu und bring sie mir, damit ich esse und dich vor dem HERRN segne, bevor ich sterbe.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሰግር፡ ሊተ
  choice: Jage für mich Wild
  rationale: Das Verb bezeichnet hier das Jagen beziehungsweise Erbeuten von Wild. So bleibt es klar vom späteren ወአብእ, »und bring«, unterschieden.
- source_word: መብልዐ
  choice: eine Speise
  rationale: Das Substantiv bezeichnet zubereitete Nahrung bzw. eine Mahlzeit; »eine Speise« passt zum würdevollen Erzählstil und vermeidet eine unnötige Spezifizierung.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: vor dem HERRN
  rationale: Die räumlich-relationale Wendung wird formal bewahrt; die traditionelle Wiedergabe des Gottesnamens als »der HERR« ist im deutschen Bibelregister verständlich.
- source_word: ዘእንበለ፡ እሙት
  choice: bevor ich sterbe
  rationale: Die Wendung gibt den zeitlichen Sinn natürlich und präzise wieder.
theological_decisions:
- issue: Bezug der Segnung auf Gottes Gegenwart
  choice: »dich vor dem HERRN segne«
  alternative: »dich im Angesicht des HERRN segne«
  rationale: »Vor dem HERRN« erhält die theologisch bedeutsame Wendung, ohne durch eine ausführlichere Formulierung eine besondere kultische Deutung aufzudrängen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede in deutschen Anführungszeichen. Die Verwandtschaftsbezeichnungen und die Abfolge der Verben werden eng am ge’ezischen Text bewahrt; zugleich ist der Satzfluss für heutige Leser natürlich.
