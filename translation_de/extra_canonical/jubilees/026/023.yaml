translation:
  language: de
  text: voll, das der HERR gesegnet hat. Und der HERR gebe dir vom Tau des Himmels und vom Tau der Erde[a] und vermehre dich. Getreide und Öl in Fülle mehre er dir. Sie sollen dir dienen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „Tau der Erde“ ist ungewöhnlich; nach Genesis 27,28 könnte man „Fett der Erde“ erwarten. Die Übersetzung folgt hier dem geezischen Wortlaut, ohne ihn an Genesis anzugleichen.
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ
  choice: voll
  rationale: Das Adjektiv bedeutet schlicht „voll“ und bezieht sich syntaktisch auf das Feld aus dem vorhergehenden Vers; „voll von Segen“ wäre ein Zusatz.
- source_word: እምጠለ፡ ሰማይ፡ ወእምጠለ፡ ምድር
  choice: vom Tau des Himmels und vom Tau der Erde
  rationale: Die ungewöhnliche Wiederholung von „Tau“ wird entsprechend dem überlieferten geezischen Wortlaut bewahrt und nicht an Genesis 27,28 angeglichen.
- source_word: ወብዝኀ፡ ስርናይ፡ ወቅብእ
  choice: und Fülle an Getreide und Öl
  rationale: „ብዝኀ“ bezeichnet Fülle oder Überfluss; „ስርናይ“ ist Getreide, „ቅብእ“ Öl.
- source_word: ይትቀነዩ፡ ለከ
  choice: Sie sollen dir dienen
  rationale: Das im Ge'ez nicht ausdrücklich bezeichnete Subjekt bleibt pronominal; „Völker“ wird nicht aus dem Genesis-Paralleltext ergänzt.
theological_decisions:
- issue: Verhältnis zur Segensformel in Genesis 27
  choice: Den eigenständigen geezischen Wortlaut beibehalten
  alternative: An Genesis 27,28–29 angleichen („vom Fett der Erde“; „Völker sollen dir dienen“)
  rationale: Eine Harmonisierung würde sowohl die ungewöhnliche Lesart „Tau der Erde“ als auch das unausgedrückte Subjekt beseitigen und damit die tatsächliche Textgestalt verdecken.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers setzt einen Satz aus dem vorhergehenden Vers fort; deshalb beginnt er kleingeschrieben mit „voll“. Die Segenssprache bleibt leicht gehoben, ohne altertümliche Formen.
