  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: de
  text: Und Rebekka nahm die schönen Gewänder ihres älteren Sohnes Esau, die sie bei sich im Haus hatte, und bekleidete damit Jakob, ihren jüngeren Sohn. Die Felle der Zicklein legte sie auf seine Hände und auf den unbedeckten Teil seines Halses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ... ዘይትፈተው
  choice: die kostbaren Gewänder
  rationale: Die Wendung bezeichnet begehrte beziehungsweise wertvolle Kleidung. »Kostbar« gibt den positiven Wert natürlich wieder, ohne eine fragwürdige emotionale Nebenbedeutung wie »Lieblingsgewänder« festzulegen.
- source_word: ወልዳ፡ ዔሳው፡ ዘይሌህቅ
  choice: ihres älteren Sohnes Esau
  rationale: Die Verwandtschaftsbezeichnung und der Altersvergleich werden im Deutschen in natürlicher Reihenfolge wiedergegeben.
- source_word: ዘሀሎ፡ ኀቤሃ፡ ውስተ፡ ቤት
  choice: die sie bei sich im Haus hatte
  rationale: Bewahrt sowohl den lokalen Bezug »im Haus« als auch den Bezug auf Rebekkas Besitz beziehungsweise Verwahrung.
- source_word: ወእምእስቲ፡ መሓስአ፡ ጠሊ
  choice: Die Felle der Ziegenböckchen
  rationale: ወእምእስቲ wird entsprechend der revidierten Quellenanalyse als »und die Felle«, nicht als »und von den Fellen«, verstanden; ጠሊ bezeichnet junge Ziegen beziehungsweise Böckchen.
- source_word: ውስተ፡ ዕርቃነ፡ ክሳዱ
  choice: auf die bloße Stelle seines Halses
  rationale: Gibt den unbekleideten beziehungsweise unbehaarten Bereich des Halses konkret und idiomatisch wieder.
