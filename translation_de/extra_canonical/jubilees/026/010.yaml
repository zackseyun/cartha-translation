revisions:
- from: Und Rebekka nahm die kostbaren Gewänder ihres älteren Sohnes Esau, die sie bei sich im Haus hatte, und zog sie ihrem jüngeren Sohn Jakob an. Die Felle der Ziegenböckchen legte sie auf seine Hände und auf die bloße Stelle seines Halses.
  to: Und Rebekka nahm die schönen Gewänder ihres älteren Sohnes Esau, die sie bei sich im Haus hatte, und bekleidete damit Jakob, ihren jüngeren Sohn. Die Felle der Zicklein legte sie auf seine Hände und auf den unbedeckten Teil seines Halses.
  rationale: Die Revision bewahrt alle Angaben und die Syntax des Ausgangstextes, vermeidet aber bei den Gewändern eine unnötige Festlegung auf materiellen Wert und bei den jungen Ziegen eine Festlegung auf männliche Tiere. Sie verbessert zugleich die idiomatische deutsche Ausdrucksweise. Eine Fußnote ist nicht erforderlich, da die im englischen Audit Trail dokumentierte frühere Fehlanalyse im deutschen Text nicht vorliegt.
