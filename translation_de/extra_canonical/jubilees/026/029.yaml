  text: Blessed shall he be, and all his seed forever.” And it happened, when Esau heard the words of his father Isaac,
translation:
  language: de
  text: „Gesegnet seien er und alle seine Nachkommen für immer!“ Und als Esau die Worte seines Vaters Isaak hörte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቡሩከ፡ ይኩን፡
  choice: Gesegnet sei er
  rationale: Der adjektivische Segensausdruck mit jussivischem ይኩን wird im Deutschen natürlich und zugleich formnah mit „sei“ wiedergegeben.
- source_word: ወኵሉ፡ ዘርኡ፡
  choice: und alle seine Nachkommen
  rationale: ዘር bedeutet wörtlich „Same“, bezeichnet hier jedoch die gesamte Nachkommenschaft; „Nachkommen“ ist im modernen Standarddeutsch klar und würdig.
- source_word: እስከ፡ ለዓለም።
  choice: für immer
  rationale: Die feste Zeitangabe bezeichnet unbegrenzte Dauer; „für immer“ gibt sie idiomatisch wieder.
- source_word: ወኮነ፡ ሶበ፡
  choice: Und als
  rationale: Die geezische Erzählungsformel leitet den temporalen Nebensatz ein. Im Deutschen ist „Und als“ natürlicher als das schwerfällige „Und es geschah, als“, ohne den Handlungsübergang zu verlieren.
- source_word: ሰምዐ፡ ዔሳው፡ ነገረ፡ አቡሁ፡ ይስሐቅ፡
  choice: Esau die Worte seines Vaters Isaak hörte
  rationale: Die Wortfolge wird der deutschen Syntax angepasst; ነገረ wird als „die Worte“ und nicht abstrakt als „die Rede“ wiedergegeben.
theological_decisions:
- issue: Reichweite des Segens über die Nachkommenschaft
  choice: alle seine Nachkommen für immer
  alternative: sein ganzer Same auf ewig
  rationale: Die Aussage wird in ihrer umfassenden und dauerhaften Form bewahrt, ohne „Same“ missverständlich biologisch einzuengen oder eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt entsprechend der Quelle syntaktisch offen und endet mit einem Komma, da der mit „als“ eingeleitete Satz im folgenden Vers fortgesetzt wird.
