translation:
  language: de
  text: 'für immer. Wer dich verflucht, wird verflucht sein, und wer dich segnet, wird gesegnet sein.« Und es geschah: Nachdem Isaak seinen Sohn Jakob zu Ende gesegnet hatte und Jakob von Isaak, seinem Vater, fortgegangen war, verbarg Jakob sich.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier zugrunde gelegte äthiopische Überlieferung setzt nach dem im Ausschnitt sichtbaren Abbruch fort, dass Jakob sich nach seinem Weggang verbarg. Diese Einzelheit gehört zur Nacherzählung des Jubiläenbuches.
    reason: textual_variant
lexical_decisions:
- source_word: እስከ፡ ለዓለም
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte Dauer; »für immer« ist im modernen Deutsch natürlich und bewahrt den Anschluss an den vorausgehenden Satz.
- source_word: ዘይረግመከ፡ ርጉም
  choice: Wer dich verflucht, wird verflucht sein
  rationale: Die Partizipial- beziehungsweise Relativkonstruktion und das anschließende Passiv werden als allgemeingültige Segensformel wiedergegeben, ohne einen menschlichen Urheber des Fluchs hinzuzufügen.
- source_word: ዘይባርከከ፡ ቡሩክ
  choice: wer dich segnet, wird gesegnet sein
  rationale: Die parallele Form des Ausgangstextes bleibt erhalten; »gesegnet sein« gibt den resultativen Zustand würdig und verständlich wieder.
- source_word: አኅለቀ፡ እንዘ፡ ይባርኮ
  choice: zu Ende gesegnet hatte
  rationale: Die Verbindung bedeutet, dass Isaak den Segensvorgang beendet hatte. Das deutsche Plusquamperfekt ordnet ihn klar vor den folgenden Handlungen ein.
- source_word: ወፅአ
  choice: hinausgegangen war
  rationale: Das Verb bezeichnet das Hinausgehen beziehungsweise Fortgehen; »hinausgegangen« hält die räumliche Aussage fest.
theological_decisions:
- issue: Form der Fluch- und Segenszusage
  choice: »wird verflucht sein … wird gesegnet sein«
  alternative: »sei verflucht … sei gesegnet«
  rationale: Der Ausgangstext lässt eine knappe prädikative Formel erkennen. Die gewählte Zukunftsform wahrt deren Zusagecharakter und vermeidet, sie eindeutig als Wunsch oder Befehl festzulegen.
- issue: Subjekt von »verbarg sich«
  choice: Jakob wird ausdrücklich als Subjekt genannt
  alternative: »verbarg er sich«
  rationale: Im fortlaufenden Überlieferungskontext bezieht sich die Handlung auf Jakob. Die ausdrückliche Nennung verhindert im Deutschen eine sonst naheliegende Mehrdeutigkeit mit Isaak, ohne der Handlung eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Segensformel bleibt rhythmisch erhalten; die erzählende Fortsetzung wird mit klarer deutscher Zeitfolge wiedergegeben.
