  yaml_path: translation/extra_canonical/jubilees/026/012.yaml
  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: de
  text: 'Und Jakob ging zu seinem Vater hinein und sagte: „Ich bin dein Sohn. Ich habe getan, wie du mir gesagt hast. Steh auf, setz dich und iss von dem, was ich erjagt habe, Vater, damit deine Seele mich segnet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ
  choice: ging … hinein
  rationale: Das Verb bezeichnet das Eintreten oder Hineingehen; die deutsche Wendung gibt die Bewegung zu seinem Vater natürlich wieder.
- source_word: አሰገርኩ
  choice: ich erjagt habe
  rationale: Im Kontext bezeichnet die Form das auf der Jagd Erbeutete; „erjagt“ bewahrt den Jagdbezug knapp und verständlich.
- source_word: ነፍስከ
  choice: deine Seele
  rationale: Die konkrete Wendung des Ge'ez wird bewahrt, statt sie zu „du“ zu glätten; so bleibt die altertümlich-semitische Ausdrucksweise und mögliche Bedeutungsfülle erhalten.
theological_decisions:
- issue: Die Seele als segnendes Subjekt
  choice: „damit deine Seele mich segnet“
  alternative: „damit du mich segnest“
  rationale: Die wörtliche Formulierung des Ausgangstextes wird beibehalten, da sie anthropologische und theologische Nuancen tragen kann und nicht stillschweigend vereinfacht werden sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Syntax. Die ungewöhnliche Wendung „deine Seele mich segnet“ bleibt aus Quellentreue bewusst erhalten.
