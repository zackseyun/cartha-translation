lexical_decisions:
- source_word: ጌሰ፡ … ገዳመ፡
  choice: ging hinaus ins freie Land
  rationale: Die Wendung bezeichnet Esaus Gang hinaus in unbebautes, offenes Gelände; die natürliche deutsche Formulierung bewahrt sowohl Bewegung als auch Zielbereich.
- source_word: ያሥግር፡
  choice: zu jagen
  rationale: Der Infinitiv gibt den ersten Zweck seines Ganges knapp und idiomatisch wieder.
- source_word: የአንዝ፡
  choice: das Wild zu fangen
  rationale: Das Verb bedeutet hier im Jagdzusammenhang ergreifen beziehungsweise fangen. Das ergänzte Objekt „das Wild“ macht den im Deutschen erforderlichen Bezug deutlich, ohne einen neuen Handlungsschritt einzuführen.
- source_word: ያምጽእ፡ ለአቡሁ።
  choice: es seinem Vater zu bringen
  rationale: Das Pronomen bezieht sich natürlich auf das gefangene Wild; „seinem Vater“ entspricht dem Dativziel des Ausgangstextes.
