  naturalness: Die Formulierung „Mein Vater stehe auf und esse“ ist zwar als gehobener Konjunktiv möglich, klingt im modernen Standarddeutsch jedoch unnötig steif und kann wie eine erzählerische Aussage wirken. „Mein Vater möge aufstehen und von meinem Wild essen“ gibt den jussivischen Wunsch bzw. die höfliche Aufforderung klar und natürlich wieder.
  terminology: „Seele“ soll beibehalten werden, weil der Ausgangstext ausdrücklich die Seele des Vaters nennt. „Speise“ ist in diesem Kontext präzise und stilistisch unmarkierter als „ein Essen“; „Wild“ ist die natürliche heutige Bezeichnung für das erlegte Jagdwild.
