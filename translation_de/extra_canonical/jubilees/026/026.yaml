  yaml_path: translation/extra_canonical/jubilees/026/026.yaml
  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: de
  text: 'Und sein Bruder Esau kam von der Jagd zurück. Auch er bereitete eine Speise zu, brachte sie seinem Vater und sagte zu ihm: »Mein Vater möge aufstehen und von meinem Wild essen, damit deine Seele mich segnet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽሐ፡ እምነዓዊሁ
  choice: kam von der Jagd zurück
  rationale: Die Wendung bezeichnet Esaus Eintreffen von seiner Jagd; „zurückkommen“ gibt den Zusammenhang in natürlichem Deutsch wieder.
- source_word: መብልዐ
  choice: ein Essen
  rationale: Das Wort bezeichnet hier die zubereitete Speise beziehungsweise Mahlzeit, die Esau seinem Vater bringt.
- source_word: እመሥገርትየ
  choice: von meinem Wildbret
  rationale: Gemeint ist das auf der Jagd erlegte und zubereitete Wild; „Wildbret“ bewahrt den konkreten Jagdbezug.
- source_word: ነፍስከ
  choice: deine Seele
  rationale: Die wörtliche Wiedergabe erhält die semitische Ausdrucksweise und vermeidet, sie vorschnell zu „du“ oder „von Herzen“ aufzulösen.
theological_decisions:
- issue: Die Seele des Vaters als Subjekt des Segnens
  choice: damit deine Seele mich segnet
  alternative: damit du mich segnest
  rationale: Die auffällige Formulierung des Ausgangstextes wird bewahrt, einschließlich ihrer anthropologischen und rhetorischen Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält mit „Mein Vater stehe auf“ die respektvolle Anrede in der dritten Person bei; „Wildbret“ ist gehoben, aber im Jagdkontext klar und präzise.
