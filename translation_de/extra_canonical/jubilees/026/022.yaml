  text: And he smelled the fragrant smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field.”
translation:
  language: de
  text: 'Und er roch den wohlriechenden Duft seiner Kleider, segnete ihn und sagte: »Siehe, der Duft meines Sohnes ist wie der Duft eines Feldes.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጼና፡ መዐዛ፡ አልባሲሁ፡
  choice: den wohlriechenden Duft seiner Kleider
  rationale: Die Verbindung aus ጼና („Geruch, Duft“) und መዐዛ („Wohlgeruch, Duft“) wird im natürlichen Deutschen als „wohlriechender Duft“ wiedergegeben, sodass die im ge’ezischen Text ausdrücklich enthaltene Nuance des Wohlgeruchs erhalten bleibt.
- source_word: ናሁ፡
  choice: Siehe
  rationale: Das hervorhebende Deiktikum wird in würdigem, bibelsprachlich vertrautem Deutsch mit „Siehe“ wiedergegeben.
- source_word: ጼና፡ ወልድየ፡
  choice: der Duft meines Sohnes
  rationale: „Duft“ bewahrt den positiven, durch den vorherigen Wohlgeruch geprägten Sinn von ጼና; ወልድየ bedeutet „mein Sohn“.
- source_word: ገዳም፡
  choice: Feldes
  rationale: Im Kontext des Segens bezeichnet das Wort das offene bzw. bebaute Land; „Feld“ entspricht zudem der zugrunde liegenden Motivik von Genesis 27, ohne dem Satz zusätzliche Einzelheiten hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „Duft“ bildet die Wiederaufnahme des ge’ezischen ጼና ab; die ungewöhnliche Quellverbindung „Geruch/Duft des Wohlgeruchs“ wird idiomatisch, aber vollständig als „wohlriechender Duft“ formuliert.
