lexical_decisions:
- source_word: አንሥአ፡ ዔሳው፡ ቃሎ
  choice: Esau erhob seine Stimme
  rationale: Formnahe und im Deutschen verständliche Wiedergabe der äthiopischen Wendung.
- source_word: አውሥአ፡ ይስሐቅ፡ ወይቤሎ
  choice: Da antwortete Isaak und sagte zu ihm
  rationale: Bewahrt beide Verben des Ausgangstextes; »Da« stellt den natürlichen Erzählanschluss her.
- source_word: ናሁ
  choice: Siehe
  rationale: Das deiktische Aufmerksamkeitssignal wird in würdigem, bibelsprachlich vertrautem Deutsch wiedergegeben.
- source_word: እምጠለ፡ ምድር
  choice: fern vom Tau der Erde
  rationale: እም kann Herkunft oder Trennung ausdrücken. Im Segenskontext ist die separative Lesart wahrscheinlich; »fern von« erhält diesen Sinn, ohne den abgebrochenen Satz zu ergänzen.
theological_decisions:
- issue: Deutung der Präposition እም vor »Tau der Erde«
  choice: fern vom Tau der Erde
  alternative: vom Tau der Erde
  rationale: Die Form ist grundsätzlich mehrdeutig, doch der Kontext und die revidierte Konsultationsfassung stützen hier eine Trennungsbedeutung. Die Alternative würde eher Zuteilung oder Herkunft nahelegen.
