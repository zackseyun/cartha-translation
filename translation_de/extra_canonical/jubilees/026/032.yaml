  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: de
  text: 'Mit Getreide, Wein und Öl habe ich ihn versorgt. Was kann ich nun noch für dich tun, mein Sohn?“ Da sagte Esau zu seinem Vater Isaak: „Hast du nur einen einzigen Segen, Vater? Segne auch mich, Vater!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጽናዕክዎ
  choice: habe ich ihn versorgt
  rationale: Das Verb bezeichnet ein Stärken oder Festigen; im Zusammenhang mit Getreide, Wein und Öl ist die konkrete Bedeutung des Versorgens beziehungsweise Unterhaltens im Deutschen natürlich und sachgerecht.
- source_word: በረከት
  choice: Segen
  rationale: Die übliche und kontextuell eindeutige Wiedergabe des Segens, den Isaak erteilt.
- source_word: አሐቲኑ
  choice: nur diesen einen
  rationale: Die Form hebt die Einzigkeit hervor; im Deutschen gibt die Verbindung aus „nur“ und „einen“ Esaus verzweifelte Frage natürlich wieder.
theological_decisions:
- issue: Art und Wirkung des väterlichen Segens
  choice: Die Aussage bleibt als Bitte um einen weiteren Segen stehen, ohne dessen Wirksamkeit näher zu erklären.
  alternative: Den Segen ausdrücklich als unwiderrufliche prophetische Verfügung deuten.
  rationale: Der Ausgangstext schildert die Spannung, entfaltet hier aber keine Lehre über Wesen oder Unwiderruflichkeit des Segens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „mein Vater“ wurde bewahrt, da sie Esaus eindringliche Bitte prägt. „Da sagte“ sorgt für einen natürlichen Erzählfluss, ohne den Inhalt zu erweitern.
