    issue: „dann werde ich“ verstärkt die Verknüpfung zur ausdrücklichen zeitlichen Folge.
    rationale: Der Ausgangstext verbindet die beiden Aussagen mit „und“. Der Kontext legt Esaus Abwarten zwar nahe, doch „dann“ formuliert die Folge stärker als der Wortlaut. „Und ich werde“ wahrt die offene, quellennähere Verbindung.
  revised_text: '„Und deine Nachkommen werden unter dem Himmel ausgerottet werden.“ Esau hasste Jakob wegen des Segens, mit dem sein Vater ihn gesegnet hatte, und sagte in seinem Herzen: „Nun sollen die Trauertage um meinen Vater heranrücken; und ich werde Jakob, meinen Bruder, töten.“'
