  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: de
  text: '„Und deine Nachkommen werden unter dem Himmel ausgerottet werden.“ Esau hasste Jakob wegen des Segens, mit dem sein Vater ihn gesegnet hatte, und sagte in seinem Herzen: „Nun sollen die Trauertage um meinen Vater heranrücken; und ich werde Jakob, meinen Bruder, töten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommen
  rationale: Das geezische Wort bezeichnet wörtlich den „Samen“, hier jedoch kollektiv die Nachkommenschaft; „Nachkommen“ ist im heutigen Deutsch klar und natürlich.
- source_word: ይሢሮ
  choice: werden … ausgerottet werden
  rationale: Das Verb kann das Entwurzeln beziehungsweise vollständige Beseitigen ausdrücken. „Ausgerottet werden“ bewahrt das harte Vernichtungsbild und passt idiomatisch zur Nachkommenschaft.
- source_word: ይትሜአክ
  choice: hasste
  rationale: Gibt die starke feindselige Haltung Esaus gegenüber Jakob unmittelbar wieder.
- source_word: ይእዜኒ
  choice: Nun
  rationale: Bewahrt den im Ausgangstext ausdrücklich vorhandenen zeitlichen beziehungsweise folgernden Marker „jetzt/nun“.
- source_word: ይብጻሕ
  choice: sollen … heranrücken
  rationale: Das Verb bezeichnet das Nahen oder Herankommen. „Heranrücken“ bildet diese Nuance natürlich ab, ohne den Zeitpunkt als bereits eingetreten darzustellen.
- source_word: መዋዕለ፡ ላሐ፡ አቡየ
  choice: die Trauertage um meinen Vater
  rationale: Im Deutschen trauert man idiomatisch „um“ einen Verstorbenen; die Formulierung bezeichnet die erwartete Trauerzeit nach dem Tod des Vaters.
theological_decisions:
- issue: Verhältnis zwischen den nahenden Trauertagen und Jakobs geplanter Tötung
  choice: „dann werde ich“
  alternative: „und ich werde“
  rationale: 'Das geezische „und“ verbindet die Aussagen, während der Zusammenhang eine zeitliche Folge nahelegt: Esau will den Tod beziehungsweise die Trauerzeit seines Vaters abwarten. „Dann“ macht diese im Kontext liegende Folge verständlich, ohne eine zusätzliche theologische Deutung einzuführen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die Wiederholung „Segens … gesegnet“ wurde beibehalten, weil sie dem Ausgangstext entspricht und im Deutschen verständlich bleibt. „Sagte in seinem Herzen“ wahrt die ausdrückliche innere Rede des Originals.
