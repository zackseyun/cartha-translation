  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen zuverlässig wieder: Ausrottung der Nachkommenschaft, Esaus Hass wegen des väterlichen Segens, die innere Rede, den Marker „Nun“ und das Herannahen der Trauerzeit. Das geezische verbindende „und“ vor der Tötungsabsicht sollte jedoch nicht durch das explizit konsekutive „dann“ ersetzt werden.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. „Sagte in seinem Herzen“ ist eine bewusst quellennähere, im biblischen Register dennoch natürliche Wiedergabe. „Trauertage um meinen Vater“ ist idiomatisch und verständlich.
  terminology: „Nachkommen“ ist für die kollektive Bedeutung von „Same“ angemessen; „ausgerottet“ gibt die harte Bildsprache treffend wieder. Die Namen Esau und Jakob entsprechen dem deutschen Standardgebrauch.
  issues:
