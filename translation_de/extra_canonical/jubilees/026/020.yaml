lexical_decisions:
- source_word: እምዘ፡ አደንከ፡
  choice: von deinem Wildbret
  rationale: Die Wendung bezeichnet etwas von dem, was der Sohn erjagt hat; »Wildbret« ist im Deutschen prägnant und entspricht dem erzählerischen Zusammenhang.
- source_word: ከመ፡ ትባርከከ፡ ነፍስየ፡
  choice: damit meine Seele dich segnet
  rationale: Die wörtliche Rede von der »Seele« bleibt erhalten, statt sie glättend durch »ich« zu ersetzen.
- source_word: ወአቅረበ፡ ሎቱ፡
  choice: Da brachte er es ihm
  rationale: Das implizite Objekt ist das zuvor genannte Wildbret; die deutsche Formulierung gibt Handlung und Empfänger natürlich wieder.
- source_word: ወአብአ፡ ሎቱ፡
  choice: und er brachte ihm
  rationale: Das Verb wird ohne ergänztes Objekt wiedergegeben, weil das Objekt »Wein« aufgrund der Verssegmentierung erst am Anfang des folgenden Verses steht.
