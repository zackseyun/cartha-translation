- source_word: ቀርበ
  choice: trat … heran
  rationale: Gibt die Bewegung des Sich-Näherns in natürlichem, würdigem Deutsch wieder.
- source_word: ገሰሶ
  choice: betastete ihn
  rationale: Bezeichnet das prüfende Berühren Isaaks; „betasten“ trifft den erzählerischen Zusammenhang genauer als das allgemeinere „berühren“.
- source_word: ይቤ
