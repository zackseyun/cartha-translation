  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: de
  text: Und wir unterrichteten Noah auch über ihre Täuschungen,[a] damit sie durch die Pflanzen der Erde geheilt würden. Noah schrieb alles, was wir Noah gelehrt hatten, in ein Buch über jede Art der Heilung nieder; und die Geister wurden festgehalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über all ihre Irrtümer“ oder „Irreführungen“.'
    reason: Der Ausdruck kann bewusste Täuschungen ebenso wie Irrtümer bzw. Irreführungen bezeichnen; die knappe syntaktische Verbindung bleibt auslegbar.
  - marker: b
    text: Im Zusammenhang sind damit möglicherweise die bösen Geister gemeint.
    reason: Der Quelltext selbst enthält nur das Wort „Geister“; die nähere Bestimmung ergibt sich allenfalls aus dem Kontext.
lexical_decisions:
- source_word: ምስለ፡ አስሕተትሙ፡
  choice: zugleich von ihren Täuschungen
  rationale: ምስለ bedeutet wörtlich „mit“; im Deutschen gibt „zugleich von“ die Verbindung mit dem Mitgeteilten idiomatisch wieder. አስሕተትሙ kann Täuschungen, Irreführungen oder Irrtümer bezeichnen.
- source_word: በዕፀወ፡ ምድር።
  choice: durch die Pflanzen der Erde
  rationale: Gibt das instrumentale በ- und den allgemeinen Ausdruck für Gewächse bzw. Pflanzen wieder, ohne ihn auf Heilkräuter zu verengen.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  choice: über jede Art der Heilung
  rationale: Gibt die umfassende Aussage über unterschiedliche Heilweisen natürlich wieder; „Heilmittel“ wäre ebenfalls möglich, würde den Ausdruck aber stärker gegenständlich festlegen.
- source_word: ወተዐጸዉ፡ መናፍስት፡
  choice: und die Geister wurden zurückgehalten
  rationale: Das Verb bezeichnet ein Verschließen, Absperren oder Einschränken. „Zurückgehalten“ ist im Kontext verständlich, ohne „böse“ in das unqualifizierte መናፍስት einzutragen.
theological_decisions:
- issue: Charakterisierung der Geister
  choice: die Geister
  alternative: die bösen Geister
  rationale: Der Zusammenhang kann böse Geister nahelegen, doch der Quelltext sagt lediglich „Geister“. Die Wertung wird daher nicht ergänzt.
- issue: Bezug des pluralischen Verbs ይፈውሱ
  choice: damit sie … geheilt würden
  alternative: damit sie … heilen könnten
  rationale: Die Form erlaubt im gegebenen knappen Satz unterschiedliche syntaktische Deutungen. Die passive deutsche Fassung folgt der überlieferten Auslegung, bewahrt aber durch das unbestimmte Pronomen die im Text bestehende Bezugsunschärfe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und teilweise mehrdeutige Syntax des geʿezischen Textes wird lesbar wiedergegeben, ohne den Bezug von „sie“ oder die moralische Kennzeichnung der Geister stillschweigend festzulegen.
