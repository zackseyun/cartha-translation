- from: Und wir berichteten Noah zugleich von ihren Täuschungen,[a] damit sie durch die Pflanzen der Erde geheilt würden. Noah schrieb alles, was wir ihn gelehrt hatten, in einem Buch nieder, über jede Art der Heilung; und die Geister wurden zurückgehalten.[b]
  to: Und wir unterrichteten Noah auch über ihre Täuschungen,[a] damit sie durch die Pflanzen der Erde geheilt würden. Noah schrieb alles, was wir Noah gelehrt hatten, in ein Buch über jede Art der Heilung nieder; und die Geister wurden festgehalten.[b]
  rationale: Die Revision glättet zwei geringfügige, aber relevante Formulierungen. „Auch über“ gibt die additive Funktion von ምስለ im Deutschen klarer wieder als „zugleich von“. Die Umstellung macht deutlich, dass Noah ein Buch über jede Art der Heilung schreibt. Die unbestimmte Referenz von „sie“ und die unqualifizierte Bezeichnung „Geister“ bleiben erhalten.
