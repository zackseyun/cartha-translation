  text: And for Japheth came out the third portion beyond the river Tina, toward the north of the outflow of its waters, and it extends northeastward to the whole region of Gog and to all the country east of it.
translation:
  language: de
  text: Und Jafet fiel der dritte Anteil zu, jenseits des Flusses Tina[a], nördlich von der Stelle, wo sich seine Wasser ergießen. Er erstreckt sich nach Nordosten bis zum ganzen Gebiet von Gog und bis zum gesamten Land östlich davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Identität des Flusses Tina ist ungewiss.
    reason: Der alte geografische Name lässt sich keinem heutigen Gewässer sicher zuordnen; die Anmerkung bewahrt diese Unsicherheit, ohne den Text spekulativ festzulegen.
