- source_word: መክፈልት (makfalt)
  choice: Anteil
  rationale: Bezeichnet im Zusammenhang die durch das Los zugewiesene Landportion; „Anteil“ ist natürlich und bewahrt den Verteilungscharakter.
- source_word: Tina
  choice: Fluss Tina
  rationale: Der überlieferte geografische Eigenname wird transliteriert und nicht mit einem modernen Gewässer gleichgesetzt.
- source_word: Gog
  choice: Gog
  rationale: Der traditionelle Eigenname wird unverändert beibehalten, ohne seine geografische Identität näher festzulegen.
- source_word: northeastward
  choice: nach Nordosten
  rationale: Gibt die geografische Ausdehnungsrichtung klar und idiomatisch wieder.
