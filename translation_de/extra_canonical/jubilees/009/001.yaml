- from: Und sein Gebiet im Süden reichte so weit, bis es sich der Mitte des Meeres näherte.[a] Madai fiel ein Anteil zu, den er westlich von seinen beiden Brüdern in Besitz nehmen sollte, bis zu den Inseln und ihren äußersten Grenzen.[b]
  to: Und sein Anteil im Süden erstreckte sich bis in die Nähe der Mitte des Meeres.[a] Madai fiel ein Anteil zu, den er westlich von seinen beiden Brüdern in Besitz nehmen sollte, bis zu den Inseln und ihren Grenzen.[b]
  rationale: Die Revision ersetzt im ersten Satz „Gebiet“ durch den im Zuteilungskontext angemesseneren „Anteil“ und glättet die Grenzformulierung, ohne die unsichere Zuordnung durch eine Ergänzung wie „Sem“ festzulegen. Im zweiten Satz bleibt die räumlich mögliche Lesart „westlich von“ bestehen; die Alternativlesart wird weiterhin in der Anmerkung dokumentiert. Die Fußnote zur textlichen Unsicherheit wird präziser gefasst.
