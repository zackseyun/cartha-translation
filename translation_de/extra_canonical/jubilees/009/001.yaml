base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: de
  text: Und sein Anteil im Süden erstreckte sich bis in die Nähe der Mitte des Meeres.[a] Madai fiel ein Anteil zu, den er westlich von seinen beiden Brüdern in Besitz nehmen sollte, bis zu den Inseln und ihren Grenzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der einsetzende Grenzsatz ist im vorliegenden Abschnitt nicht vollständig kontextualisiert. Daher bleiben die genaue Zuordnung des südlichen Anteils und die Bedeutung von „Mitte des Meeres“ unsicher.
    reason: segmentation_note
  - marker: b
    text: Die Wortverbindung kann auch enger am Wortlaut als „vom Westen seiner beiden Brüder an“ verstanden werden.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ውሳጥያቲሁ፡ ለደቡብ
  choice: sein Gebiet im Süden
  rationale: Der eröffnende Ausdruck ist in der überlieferten Segmentierung schwierig. Im Zusammenhang der Landzuteilung bezeichnet er am ehesten den südlichen Bereich des zuvor genannten Anteils; die deutsche Fassung ergänzt kein neues Volk oder Gebiet.
- source_word: መክፈልት
  choice: Anteil
  rationale: Bezeichnet im Kontext das durch Los beziehungsweise Aufteilung zugewiesene Land; „Anteil“ ist natürlich und bewahrt den Zuteilungscharakter.
- source_word: የአኅዝ
  choice: in Besitz nehmen
  rationale: Das Verb kann „ergreifen“, „festhalten“ oder „besitzen“ bedeuten. Bei einer Landzuteilung gibt „in Besitz nehmen“ den Sinn wieder, ohne die gewaltsame Nebenbedeutung von „an sich reißen“ einzutragen.
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: von seinen beiden Brüdern
  rationale: ክአኢ bezeichnet ausdrücklich die Zweiheit; daher ist „beiden Brüdern“ genauer als nur „Brüdern“.
- source_word: ጽነፊሆን
  choice: ihren äußersten Grenzen
  rationale: Der Ausdruck bezeichnet Enden, Ränder oder äußerste Begrenzungen; die Form bezieht sich auf die Inseln.
theological_decisions:
- issue: Zuordnung des ersten, fragmentarisch einsetzenden Grenzsatzes
  choice: Keinen Namen wie Sem oder Ham in den Text ergänzen
  alternative: „Sems Anteil im Süden“
  rationale: Der vorgelegte ge’ezische Wortlaut enthält an dieser Stelle keinen ausdrücklich genannten Namen. Der Zusammenhang kann Sem nahelegen, doch eine Ergänzung im Haupttext würde die fragmentarische Überlieferung stillschweigend festlegen.
- issue: Bedeutung des Besitzverbs bei Madais Landanteil
  choice: „in Besitz nehmen“
  alternative: „ergreifen“ oder „an sich reißen“
  rationale: Die neutrale Formulierung entspricht dem Zuteilungskontext und vermeidet eine nicht zwingend im Verb liegende Aussage über gewaltsame Eroberung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Stil bleibt erzählerisch und sachlich; die ungewöhnliche Grenzbeschreibung wird nicht durch ungesicherte Ortsnamen oder zusätzliche Personen geglättet.
