  terminology: „Anteil“ passt für die Landzuteilung. „in Besitz nehmen“ gibt das Besitzverb im Zuteilungskontext neutral wieder. „beiden Brüdern“ bewahrt die ausdrückliche Dualform; „Grenzen“ ist für den abschließenden Grenzbegriff ausreichend und vermeidet die nicht notwendige Verstärkung „äußersten“.
