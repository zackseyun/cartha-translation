  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: de
  text: 'Die dritte Zunge.[a] Und für Meschech kam als sechster Anteil hervor: das ganze Gebiet jenseits der dritten Zunge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Zunge“; möglicherweise ist eine Landzunge oder ein ähnlich geformtes geografisches Gebiet gemeint.
    reason: Die geographische Bedeutung des Ausdrucks ist nicht eindeutig; die Fußnote wahrt die Bildsprache und nennt eine naheliegende sachliche Deutung.
lexical_decisions:
- source_word: ልሳን (lǝsān)
  choice: Zunge
  rationale: Das Wort bedeutet wörtlich „Zunge“ und kann hier eine geografische Form oder Grenze bezeichnen. Die bewusst knappe Wiedergabe bewahrt die Mehrdeutigkeit des Ausgangstextes, statt vorschnell „Sprache“ oder „Landzunge“ festzulegen.
- source_word: ለሞስክ (la-Mosǝk)
  choice: für Meschech
  rationale: „Meschech“ ist die im Deutschen geläufige biblische Namensform; die Präposition wird formal mit „für“ wiedergegeben.
- source_word: ወፅአ መክፈልት ሳድስ (waṣǝʾa makfalt sādis)
  choice: fiel der sechste Anteil aus
  rationale: Die Formulierung bezeichnet das Hervorgehen beziehungsweise Ausfallen eines Losanteils. „Fiel … aus“ ist im Deutschen verständlich und bewahrt das Losverfahren besser als das stärker deutende „fiel ihm zu“.
- source_word: ማዕዶተ (maʿǝdota)
  choice: jenseits
  rationale: Das Wort bezeichnet die andere Seite beziehungsweise das Gebiet jenseits von etwas; „jenseits“ gibt die räumliche Relation präzise und knapp wieder.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Erzählstil. Der fragmentarische Anfang wird beibehalten, da er offenbar an die vorherige Grenzbeschreibung anschließt. Der Doppelpunkt macht im Deutschen deutlich, dass das folgende Gebiet den sechsten Anteil näher bestimmt.
