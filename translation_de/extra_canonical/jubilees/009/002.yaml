  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: de
  text: Es erstreckt sich über alle Feuerberge und weiter nach Westen bis zum Meer von Atel. Von dort erstreckt es sich westwärts, bis es das Meer von Mauk erreicht – jenes Meer, in dem alles, was hineinabsteigt, nicht zugrunde geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach anderer Satzgliederung: »jenes Meer, in das alles hinabsteigt, was nicht zugrunde geht«.'
    reason: Die frühere Wiedergabe beruht auf einer anderen Zuordnung des Relativsatzes; die Hauptübersetzung folgt der wahrscheinlicheren ge’ezischen Syntax, während die alternative Lesart dokumentiert bleibt.
lexical_decisions:
- source_word: ደብረ እሳት (»Feuerberge«)
  choice: Feuerberge
  rationale: Die konkrete Bildsprache wird knapp und verständlich bewahrt; eine erklärende Umdeutung wird vermieden.
- source_word: ባሕረ አቴል / ባሕረ ማውክ
  choice: Meer von Atel / Meer von Mauk
  rationale: Die geografischen Eigennamen werden transliteriert und nicht spekulativ mit bekannten Gewässern gleichgesetzt.
- source_word: za-kʷəllu za-yəwarrəd wəstētu ʾi-yəmassən
  choice: in dem alles, was hineinabsteigt, nicht zugrunde geht
  rationale: Die Relativkonstruktion bezieht das Hinabsteigen auf »alles«; die anschließende Verneinung besagt, dass dieses nicht zugrunde geht. »zugrunde gehen« gibt den Sinn natürlicher wieder als das missverständliche »zerstört werden«.
theological_decisions:
- issue: Aussage über das Meer von Mauk
  choice: Alles, was in das Meer hinabsteigt, geht nicht zugrunde.
  alternative: Alles, was nicht zugrunde geht, steigt in das Meer hinab.
  rationale: Syntax und Wortfolge stützen die erste Lesart. Die alternative Gliederung ist überlieferungsgeschichtlich belegt, kehrt jedoch das Verhältnis von Relativsatz und Hauptaussage um; sie wird deshalb nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Grenzformel »es erstreckt sich« bleibt erhalten, wird aber durch »von dort« lesbar gegliedert. Unbekannte Ortsnamen werden nicht harmonisiert oder identifiziert.
