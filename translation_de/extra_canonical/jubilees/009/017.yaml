revisions:
- from: Er lebte neunzehn Jubiläen, zwei Jahrwochen und fünf Jahre. Mit seiner Lebenszeit auf der Erde übertraf er die Menschenkinder, weil er in dieser Gerechtigkeit vollkommen war – mit Ausnahme Henochs. Denn Henoch war dazu bestimmt,[a] den Geschlechtern der Welt als Zeuge zu dienen und allen Geschlechtern sämtliche Taten zu verkünden.
  to: Er lebte neunzehn Jubiläen, zwei Jahrwochen und fünf Jahre. Mit seiner Lebenszeit auf der Erde übertraf er die Menschenkinder, weil er in der Gerechtigkeit, die er übte, vollkommen war – mit Ausnahme Henochs. Denn Henoch wurde als Zeuge für die Geschlechter der Welt geschaffen, damit er allen Geschlechtern alle Taten verkünde.
  rationale: Die Revision stellt das ausdrücklich genannte Geschaffensein Henochs in den Haupttext zurück und gibt seine Funktion als Zeuge samt Zweckbestimmung direkt wieder. Die Formulierung „in der Gerechtigkeit, die er übte“ macht den Bezug der Gerechtigkeit natürlich, ohne den Sinn einzuengen. Die auffällige Ausnahme Henochs bleibt unverändert und wird nicht harmonisierend erklärt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:51Z'
review_pass:
