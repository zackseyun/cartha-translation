  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: de
  text: Er lebte neunzehn Jubiläen, zwei Jahrwochen und fünf Jahre. Mit seiner Lebenszeit auf der Erde übertraf er die Menschenkinder, weil er in der Gerechtigkeit, die er übte, vollkommen war – mit Ausnahme Henochs. Denn Henoch wurde als Zeuge für die Geschlechter der Welt geschaffen, damit er allen Geschlechtern alle Taten verkünde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: Jubiläen
  rationale: Bezeichnet die aus dem Jubiläenbuch vertrauten Zeitabschnitte von je 49 Jahren; der transparente Fachbegriff bewahrt die chronologische Ausdrucksweise.
- source_word: ሱባዔ
  choice: Jahrwochen
  rationale: Das Wort bezeichnet Siebenerperioden; im chronologischen Zusammenhang sind Gruppen von sieben Jahren gemeint.
- source_word: አፈድፈደ
  choice: übertraf
  rationale: Gibt die Bedeutung des Übertreffens beziehungsweise Hinausgehens wieder, hier bezogen auf die Lebenszeit.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Bewahrt die konkrete semitische Ausdrucksweise, bleibt aber im Deutschen verständlich und würdevoll.
- source_word: ተፈጥሮተ
  choice: war dazu bestimmt
  rationale: Die Wendung beschreibt Henochs eingerichtete beziehungsweise geschaffene Bestimmung; eine rein wörtliche Wiedergabe mit „geschaffen“ wäre im Deutschen missverständlich.
- source_word: ስምዕ
  choice: Zeuge
  rationale: Gibt die personale Zeugnisfunktion Henochs wieder.
- source_word: ግብረ
  choice: Taten
  rationale: Entspricht dem breiten Sinn von Werken beziehungsweise Handlungen, ohne die handelnde Seite näher festzulegen.
theological_decisions:
- issue: Henochs Ausnahme von der gewöhnlichen menschlichen Lebensgrenze
  choice: „mit Ausnahme Henochs“ bleibt unmittelbar auf die Aussage über die Lebenszeit bezogen
  alternative: Die Ausnahme auf Henochs Gerechtigkeit beziehen
  rationale: Wortstellung und Aussagegang legen nahe, dass Henoch als Ausnahme unter den Menschenkindern gilt. Die ungewöhnliche Spannung zu seiner irdischen Lebensdauer wird nicht harmonisierend aufgelöst.
- issue: Henochs eingerichtete Zeugnisfunktion
  choice: „war dazu bestimmt, … als Zeuge zu dienen“
  alternative: „Henochs Aufgabe wurde als Zeugnis geschaffen“
  rationale: Die gewählte Fassung bildet Zweck und Funktion natürlich ab, ohne eine besondere Lehre über Henochs Wesen oder Amt einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die chronologischen Fachbegriffe „Jubiläen“ und „Jahrwochen“ bleiben erhalten. Der elliptische Ausgangstext wurde zu vollständigen deutschen Sätzen gegliedert, ohne die auffällige Ausnahme Henochs oder die unbestimmte Reichweite von „sämtliche Taten“ aufzulösen.
