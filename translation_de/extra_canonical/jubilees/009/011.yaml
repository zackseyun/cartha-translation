  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: de
  text: Und Tubal fiel ein fünfter Anteil zu, mitten auf der Landzunge[a], die sich dem Anteil Luds nähert, bis zur anderen Landzunge und in das Gebiet jenseits der anderen Landzunge hinein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zunge“; hier und im Folgenden wohl als geografische Bezeichnung gemeint.'
    reason: Die konkrete geografische Gestalt des mit ልሳን bezeichneten Ortes bleibt unsicher.
  - marker: b
    text: Der letzte Satzteil ist im überlieferten Text sprachlich und geografisch schwer verständlich.
    reason: Bewahrt die Unsicherheit der Quellenformulierung, ohne eine bestimmte geografische Identifizierung zu erzwingen.
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: Und Tubal
  rationale: Die Form nennt eindeutig Tubal; das unmittelbar davor stehende „Lud“ gehört zum Abschluss des vorangehenden Satzes.
- source_word: ወፅአ፡ መክፈልት፡ ኃምስ
  choice: fiel ein fünfter Anteil zu
  rationale: Gibt die Los- bzw. Gebietszuweisung idiomatisch wieder, ohne die wörtliche Bewegungsform „kam heraus“ unnötig nachzuahmen.
- source_word: ልሳን
  choice: Landzunge
  rationale: Wörtlich „Zunge“; im geographischen Zusammenhang bezeichnet das Wort wahrscheinlich eine zungenförmige Landform. Die Fußnote bewahrt den wörtlichen Ausdruck und die verbleibende Unsicherheit.
- source_word: ማዕዶተ
  choice: jenseits
  rationale: Das Wort bezeichnet die gegenüberliegende bzw. jenseitige Seite und ist daher genauer als eine bloße Wiedergabe mit „in“ oder „innerhalb“.
