  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: de
  text: 'Und der Engel der Geister, Mastema, kam und sagte: »Herr, Schöpfer, lass einige von ihnen bei mir verbleiben, damit sie auf meine Stimme hören und alles tun, was ich ihnen sage. Denn wenn mir nicht einige von ihnen übrig gelassen werden, kann ich die Vollmacht meines Willens über die Menschenkinder nicht ausüben. Denn sie sind dazu bestimmt, vor meinem Gericht Verderben zu stiften und in die Irre zu führen; denn groß ist die Bosheit der Menschenkinder.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: der Engel der Geister, Mastema
  rationale: መስተማ ist ausdrücklich als Eigenname genannt und wird als Apposition zu »Engel der Geister« wiedergegeben.
- source_word: አትርፍ ... ሊተ
  choice: lass einige von ihnen bei mir übrig / wenn mir nicht einige ... übrig gelassen werden
  rationale: Die wiederholte Wortwurzel bezeichnet das Übriglassen beziehungsweise Verbleiben; die deutsche Fassung erhält diese Wiederholung.
- source_word: ይስምዑ፡ ቃለየ
  choice: auf meine Stimme hören
  rationale: Die Wendung meint nicht nur akustisches Hören, sondern im Zusammenhang auch Gehorsam; die anschließende Aussage über ihr Tun macht diese Bedeutung deutlich.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: die Macht meines Willens ... ausüben
  rationale: Die ungewöhnliche Verbindung von Tun/Ausüben, Macht beziehungsweise Vollmacht und Wille wird möglichst eng und dennoch idiomatisch wiedergegeben.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Die traditionelle, würdige Wendung bildet die wörtliche Vorstellung »Kinder der Menschen« knapp ab.
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: Verderben zu bringen und irrezuführen
  rationale: 'Die beiden parallelen Zweckangaben werden unterschieden: verderben beziehungsweise Schaden stiften und vom rechten Weg abbringen.'
theological_decisions:
- issue: Mastemas Stellung und Tätigkeit
  choice: Die Selbstbeschreibung Mastemas wird ohne zusätzliche Erklärung oder moralische Harmonisierung wiedergegeben.
  alternative: Mastema ausdrücklich als Obersten der bösen Geister bezeichnen oder seine Macht als von Gott verliehen erläutern.
  rationale: Der Vers nennt ihn »Engel der Geister« und beschreibt seine Forderung, liefert hier aber keine solche weitergehende dogmatische Einordnung.
- issue: Zeitliche oder gerichtliche Bedeutung von ቅድመ፡ ኵነኔየ
  choice: vor meinem Gericht
  alternative: bis zu meinem Gericht
  rationale: ቅድመ bedeutet zunächst »vor«; die mögliche zeitliche Deutung wird nicht stillschweigend in »bis« aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die eigentümliche Verbindung »Macht meines Willens« und die Spannung, dass Mastema von »meinem Gericht« spricht, bleiben erhalten. Das einleitende ኵሎ wurde als Abschluss des vorangehenden Satzes behandelt, wie es auch die Versgliederung und der syntaktische Neueinsatz mit ወመጽአ nahelegen.
