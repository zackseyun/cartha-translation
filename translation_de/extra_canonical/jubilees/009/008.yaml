revisions:
- from: 'Und der Engel der Geister, Mastema, kam und sagte: »Herr, Schöpfer, lass einige von ihnen bei mir übrig, damit sie auf meine Stimme hören und alles tun, was ich ihnen sage. Denn wenn mir nicht einige von ihnen übrig gelassen werden, kann ich die Macht meines Willens über die Menschenkinder nicht ausüben. Sie sind nämlich dazu da, vor meinem Gericht Verderben zu bringen und irrezuführen; denn groß ist die Bosheit der Menschenkinder.«'
  to: 'Und der Engel der Geister, Mastema, kam und sagte: »Herr, Schöpfer, lass einige von ihnen bei mir verbleiben, damit sie auf meine Stimme hören und alles tun, was ich ihnen sage. Denn wenn mir nicht einige von ihnen übrig gelassen werden, kann ich die Vollmacht meines Willens über die Menschenkinder nicht ausüben. Denn sie sind dazu bestimmt, vor meinem Gericht Verderben zu stiften und in die Irre zu führen; denn groß ist die Bosheit der Menschenkinder.«'
  rationale: 'Die Revision glättet zwei deutsche Formulierungen, ohne die Eigenbezeichnung Mastemas, die Wiederholung des Übriglassens oder die bewusst nicht harmonisierte Wendung „vor meinem Gericht“ zu verändern. Eine Fußnote ist nicht erforderlich: Der Eigenname Mastema steht ausdrücklich im maßgeblichen Ge''ez-Text; die in der englischen Überlieferung verzeichnete alternative Lesart ist daher für diese Fassung nicht anzubringen.'
