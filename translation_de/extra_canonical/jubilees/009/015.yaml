- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: Und Noah legte sich zu seinen Vätern
  rationale: Bewahrt die traditionelle biblische Sterbeformel, ohne sie interpretierend durch „starb“ zu ersetzen.
theological_decisions:
- issue: Biblische Sterbeformel
  choice: legte sich zu seinen Vätern
  alternative: starb und wurde mit seinen Vorfahren vereint
  rationale: Die bildhafte und theologisch offene Formulierung des Quelltexts bleibt erhalten.
- issue: Unbenannter Bezug von „ihn“
  choice: ihn
  alternative: Arpachschad
  rationale: Der Geʿez-Text enthält hier nur ein Pronomen; der Name wird nicht aus dem weiteren Kontext in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Sterbeformel und die pronominale Unbestimmtheit des Quelltexts bleiben gewahrt.
