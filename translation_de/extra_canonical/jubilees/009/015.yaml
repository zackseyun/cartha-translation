lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Gibt die begründende Verknüpfung des äthiopischen Ausdrucks wieder.
- source_word: ኪያሁ፡ ያፈቅር
  choice: ihn liebte er
  rationale: Bewahrt das im vorliegenden Ausschnitt nicht ausdrücklich benannte männliche Bezugswort und die Vergangenheitsform.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
