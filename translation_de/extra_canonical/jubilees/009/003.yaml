  yaml_path: translation/extra_canonical/jubilees/009/003.yaml
  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: de
  text: Und es verläuft nach Norden bis an die Grenzen von Gadir; weiter verläuft es zur Küste der Wasser des großen Meeres, bis es sich dem Fluss Gihon nähert. Und es verläuft südlich an den Wassern des Gihon entlang bis zum Ufer dieses Flusses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕር ዐቢይ (bāḥr ʿabiy)
  choice: das große Meer
  rationale: Gibt die geographische Bezeichnung als »großes Meer« wieder; zusammen mit »Wassern« bleibt die quellensprachliche Formulierung erhalten.
- source_word: ግዮን (Gēyon)
  choice: Gihon
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: መንገለ አዜብ (mangala ʾazēb)
  choice: südlich
  rationale: Gibt die Richtungsangabe wieder, ohne sie als Aussage über den Lauf des Flusses umzudeuten.
- source_word: ደንገጉ ለዝንቱ ፈለግ (dengagu la-zentu falag)
  choice: bis zum Ufer dieses Flusses
  rationale: Bewahrt den konkreten geographischen Grenzpunkt der Quelle.
theological_decisions: []
translation_notes:
  register: Moderne, würdige geographische Prosa. Das wiederholte »verläuft« macht deutlich, dass weiterhin eine Grenzlinie beziehungsweise ein Gebiet beschrieben wird. Die frühere Alternativfassung wurde nicht als Fußnote übernommen, da die jüngste quellensprachliche Prüfung sie als Fehlübersetzung und nicht als echte Textmehrdeutigkeit beurteilt.
