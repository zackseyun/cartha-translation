base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: de
  text: 'Und der Fürst der Geister, Mastema,[a] kam und sagte: »Herr, Schöpfer, lass einige von ihnen bei mir zurück. Sie sollen auf meine Stimme hören und alles tun, was ich ihnen sage. Denn wenn mir keiner von ihnen bleibt, kann ich die Macht meines Willens unter den Menschenkindern nicht ausüben. Sie dienen nämlich dazu, vor meinem Gericht Verderben zu stiften und irrezuführen; denn groß ist die Bosheit der Menschenkinder.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »der Engel der Geister, Mastema«. Das äthiopische Wort kann »Engel/Bote« oder hier einen herrschenden »Fürsten« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ (malʾaka manāfest Mastēmā)
  choice: der Fürst der Geister, Mastema
  rationale: መልአክ kann »Engel«, »Bote« oder in einem Herrschaftskontext »Fürst« bezeichnen. Der Genitiv »der Geister« ist ausdrücklich vorhanden und wird bewahrt; »Mastema« wird als Name der feindlichen Gestalt verstanden.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: lass einige von ihnen bei mir zurück
  rationale: Gibt die Bitte wieder, einen Teil der zuvor genannten Geister für Mastema übrigzulassen; natürliches Deutsch ohne die räumliche Wendung »vor mir« zu überbetonen.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: die Macht meines Willens … ausüben
  rationale: Bewahrt sowohl den Gedanken wirksamer Autorität als auch die ausdrückliche Zuordnung zu Mastemas Willen.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Die formnahe, in würdigem biblischem Deutsch verständliche Wiedergabe wahrt die wiederholte Wendung und ihren kollektiven Sinn.
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: Verderben zu stiften und irrezuführen
  rationale: 'Gibt die beiden Zweckhandlungen getrennt wieder: schädigen bzw. verderben und vom rechten Weg abbringen.'
theological_decisions:
- issue: Identität und Titel Mastemas
  choice: »der Fürst der Geister, Mastema« im Haupttext
  alternative: »der Engel der Geister, Mastema« oder »der Fürst Mastema«
  rationale: Der unmittelbare Wortlaut enthält sowohl den Titel mit »der Geister« als auch den Namen. »Fürst« passt zur dargestellten Leitungsgewalt, während die lexikalische Alternative in der Fußnote offengehalten wird.
- issue: Bezug von »sie«
  choice: Das Pronomen bezieht sich auf die Mastema überlassenen Geister.
  alternative: Ein allgemeiner oder auf Menschen bezogener Bezug
  rationale: Der unmittelbare Zusammenhang handelt von den bösen Geistern, von denen Mastema einige behalten will, damit sie seinen Befehlen folgen.
- issue: »vor meinem Gericht«
  choice: Die spannungsreiche Formulierung wird wörtlich im Satz erhalten.
  alternative: »bis zu meinem Gericht« oder »vor dem Gericht Gottes«
  rationale: Der überlieferte Ausdruck ist semantisch schwierig. Eine zeitliche oder theologisch harmonisierende Präzisierung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Der Satzbau wurde maßvoll gegliedert, ohne die Begründungskette oder die schwierige Wendung »vor meinem Gericht« zu glätten.
