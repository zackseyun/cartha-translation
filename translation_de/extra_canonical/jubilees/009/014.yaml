revisions:
- from: So wurden die bösen Geister von den Nachkommen Noahs ferngehalten[a]. Und alles, was er aufgeschrieben hatte, gab er seinem Sohn Sem, den er überaus liebte.
  to: Die Bösen wurden von Noahs Nachkommen ferngehalten.[a] Alles, was er geschrieben hatte, gab er seinem Sohn Sem, den er sehr liebte.
  rationale: Die Revision folgt dem tatsächlich vorgelegten ge'ezischen Text statt dem sachfremden englischen Audit-Text. Sie bewahrt bei „die Bösen“ die lexikalische und referenzielle Offenheit, kennzeichnet die unvollständige bzw. elliptische Satzlage in einer Fußnote und formuliert die Aussage über Sem in modernem Standarddeutsch ohne unnötige Verstärkung.
