  yaml_path: translation/extra_canonical/jubilees/009/014.yaml
  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: de
  text: Die Bösen wurden von Noahs Nachkommen ferngehalten.[a] Alles, was er geschrieben hatte, gab er seinem Sohn Sem, den er sehr liebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Bösen“. Der vorgelegte ge''ezische Text setzt hier offenbar elliptisch bzw. mitten in einem Zusammenhang ein. Im weiteren Kontext können damit böse Geister gemeint sein; der Wortlaut selbst legt diese Deutung jedoch nicht ausdrücklich fest.'
    reason: textual_note
lexical_decisions:
- source_word: እኩያን
  choice: die bösen Geister
  rationale: Das substantivierte Pluralwort bedeutet wörtlich »die Bösen«. Im unmittelbaren literarischen Zusammenhang sind damit böse Geister gemeint; die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: እምድኅሬሆሙ፡ ለውሉደ፡ ኖኅ
  choice: von den Nachkommen Noahs ferngehalten
  rationale: Die überlieferte Wortfolge ist ein am Satzanfang abgeschnittenes Fragment. Die Wiedergabe stellt den aus dem Zusammenhang erforderlichen Satzanschluss idiomatisch her; »Nachkommen« gibt ውሉድ hier natürlicher wieder als das engere »Söhne«.
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: alles, was er aufgeschrieben hatte
  rationale: Gibt die umfassende Formulierung und das vorzeitige Schreiben gegenüber dem anschließenden Geben natürlich wieder.
- source_word: ዘይፈህቅ
  choice: den er überaus liebte
  rationale: Das Relativgefüge bezieht sich auf Sem. »Überaus« wahrt die im Überlieferungszusammenhang erkennbare Intensität, ohne einen im vorgelegten Ausschnitt nicht ausdrücklich genannten Vergleich mit den anderen Söhnen einzufügen.
theological_decisions:
- issue: Identität der »Bösen«
  choice: Im Haupttext »böse Geister«, mit wörtlicher Alternative in der Fußnote
  alternative: Nur »die Bösen«
  rationale: Der weitere Kontext handelt von schädigenden Geistern. Die kontextuelle Identifizierung macht den deutschen Satz verständlich, während die Fußnote die lexikalische Offenheit des einzelnen Ausdrucks sichtbar hält.
- issue: Abweichung von Referenzangabe und englischer Beratungsschicht
  choice: Übersetzung des tatsächlich vorgelegten ge'ezischen Wortlauts
  alternative: Wiedergabe des englischen Textes über Noahs Tod
  rationale: Der ge'ezische Quellenausschnitt handelt vom Fernhalten böser Geister und von der Übergabe der Aufzeichnungen an Sem. Der englische Beratungstext gehört inhaltlich zu einer anderen Passage und wurde daher nicht zur Grundlage gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext liest sich flüssig, während die Fußnote sowohl die wörtliche Bedeutung als auch den fragmentarischen Anfang der vorgelegten Quelle offenlegt. Die englische Beratungsschicht wurde wegen ihrer offenkundigen inhaltlichen Abweichung nicht übernommen.
