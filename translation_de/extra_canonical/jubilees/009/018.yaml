base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: de
  text: 'Im dreiunddreißigsten Jubiläum, im ersten Jahr der zweiten Jahrwoche, nahm sich Peleg eine Frau namens Lomna, eine Tochter Schinars. Im vierten Jahr dieser Jahrwoche gebar sie ihm einen Sohn. Er gab ihm den Namen Reu, denn er sagte: »Siehe, die Menschenkinder sind durch ihren bösen Plan, sich eine Stadt und einen Turm im Land zu bauen, böse geworden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: Jubiläum
  rationale: Gibt die für das Jubiläenbuch charakteristische Zeiteinheit direkt und traditionsgemäß wieder.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet hier einen Zeitraum von sieben Jahren; „Jahrwoche“ ist präzise und im Deutschen verständlich.
- source_word: ራገው
  choice: Reu
  rationale: Verwendet die im Deutschen geläufige biblische Namensform für den in der äthiopischen Überlieferung als Rāgaw wiedergegebenen Namen.
- source_word: ምክረ፡ ዐግ
  choice: böser Plan
  rationale: Bewahrt sowohl den Gedanken eines absichtlichen Vorhabens als auch dessen ausdrücklich negative Bewertung.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Formnahe und zugleich verständliche Wiedergabe der genealogisch-kollektiven Wendung.
theological_decisions:
- issue: Verhältnis zwischen dem bösen Plan und dem Bösewerden der Menschen
  choice: „durch ihren bösen Plan ... böse geworden“
  alternative: „böse geworden in dem Plan“ oder „wegen des Plans“
  rationale: Die kausale beziehungsweise instrumentale Offenheit der Präposition bleibt weitgehend erhalten, ohne eine zusätzliche theologische Erklärung einzutragen.
- issue: Zweck des Bauvorhabens
  choice: „sich eine Stadt und einen Turm ... zu bauen“
  alternative: „damit sie für sich ... bauten“
  rationale: Die finale Aussage des Ausgangstextes wird natürlich wiedergegeben, ohne Motive wie Hochmut oder Auflehnung ausdrücklich hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die chronologischen Fachbegriffe „Jubiläum“ und „Jahrwoche“ bleiben erhalten. Der vorangestellte Fragmentrest aus dem Abschluss des vorherigen Zusammenhangs wurde nicht in Vers 18 aufgenommen; ebenso wurde die sachlich unpassende englische Fußnote zu Turmmaßen nicht übernommen.
