  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: de
  text: 'Und er sagte: „Ein Zehntel von ihnen soll vor ihm bleiben[a], und neun Teile sollen zum Ort des Gerichts hinabsteigen.“ Und er sagte einem von uns, wir sollten Noah alle ihre Heilmittel[b] lehren, denn'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das verbleibende Zehntel erklärt in diesem Kapitel, weshalb nach der Flut weiterhin böse Geister tätig sind.
    reason: cross_reference
  - marker: b
    text: Gemeint sein können Heilmittel gegen die von ihnen verursachten Leiden.
    reason: translation_ambiguity
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: Ort des Gerichts
  rationale: Gibt die ge’ezische Wortgruppe formal und im Kontext verständlich wieder.
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: Und zu einem von uns sagte er
  rationale: Das Präfix ለ- kennzeichnet „einen von uns“ als indirektes Objekt; das unausgesprochene Subjekt von „sagte“ bleibt wie im Quelltext erhalten.
- source_word: ኵሎ፡ ፈውሶሙ
  choice: alle ihre Heilmittel
  rationale: Bewahrt die possessive Form und die mögliche Spannung, ob Mittel zu ihrer Heilung oder Mittel gegen ihre Wirkung gemeint sind.
theological_decisions:
- issue: Fortbestehen dämonischer Tätigkeit nach der Flut
  choice: Ein Zehntel von ihnen soll vor ihm bleiben
  alternative: Den Gedanken erklärend als Fortbestehen eines Teils der Dämonen wiedergeben
  rationale: Die eigentümliche Erklärung des Kapitels wird ohne dogmatische Ausdeutung bewahrt.
- issue: Sprecher und Empfänger des Lehrauftrags
  choice: Und zu einem von uns sagte er
  alternative: Und einer von uns sagte
  rationale: Die Präposition ለ- macht „einen von uns“ zum Empfänger der Rede, nicht zu ihrem Sprecher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit „denn“ abbrechende Satzanschluss wird beibehalten, da der vorgelegte Vers- und Quelltext an dieser Stelle in den folgenden Vers überleitet.
