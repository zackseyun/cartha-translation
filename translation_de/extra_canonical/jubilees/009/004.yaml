  yaml_path: translation/extra_canonical/jubilees/009/004.yaml
  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: de
  text: Und dies ist das Land, das Ham als Anteil zuteilwurde, das er für immer innehaben sollte, für sich und seine Söhne durch alle ihre Generationen hindurch, für immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልት (makfalt)
  choice: Anteil
  rationale: Gibt den durch Zuteilung beziehungsweise Los bestimmten Gebietsanteil natürlich und präzise wieder.
- source_word: ወፅአ (waṣaʾa)
  choice: durch das Los zufiel
  rationale: In diesem Kontext bezeichnet das Verb das Hervorgehen eines Anteils bei der Landverteilung; die Formulierung macht den impliziten Losvorgang im Deutschen verständlich.
- source_word: የአኅዝ (yaʾaḫəz)
  choice: in Besitz nehmen sollte
  rationale: Bewahrt sowohl den Gedanken des Ergreifens als auch den kontextuellen Sinn dauerhaften Besitzes.
- source_word: ለዓለም / entsprechende Ewigkeitsformel
  choice: für immer
  rationale: Die wiederholte Dauerformel wird an beiden Stellen beibehalten und nicht stilistisch gekürzt.
- source_word: በትውልዶሙ / entsprechende Generationenformel
  choice: durch alle ihre Generationen hindurch
  rationale: Gibt die fortdauernde Geltung für die Nachkommenschaft idiomatisch wieder.
theological_decisions:
- issue: Dauer und Erbfolge der Landzuteilung
  choice: Beide Ewigkeitsformeln sowie der Bezug auf Hams Söhne und ihre Generationen bleiben ausdrücklich erhalten.
  alternative: Die Wiederholung von „für immer“ stilistisch zusammenziehen.
  rationale: Die Wiederholung gehört zur rechtlich-feierlichen Aussage über dauernden Besitz und soll nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich gliedert die lange Zuteilungsformel, ohne ihren feierlichen Charakter oder ihre Wiederholungen aufzulösen.
