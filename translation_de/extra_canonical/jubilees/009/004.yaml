- from: Und dies ist das Land, das Ham durch das Los zufiel, als der Anteil, den er für immer in Besitz nehmen sollte – für sich und seine Söhne, durch alle ihre Generationen hindurch, für immer.
  to: Und dies ist das Land, das Ham als Anteil zuteilwurde, das er für immer innehaben sollte, für sich und seine Söhne durch alle ihre Generationen hindurch, für immer.
  rationale: Die Revision entfernt die nicht explizit belegte Bezugnahme auf ein Los und gibt die Zuteilungs- und Besitzformel enger sowie in natürlichem modernem Standarddeutsch wieder. Die feierliche Wiederholung der Dauerformel bleibt vollständig erhalten.
