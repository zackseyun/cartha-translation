    rationale: Die Aussage betrifft das dauerhafte Innehaben des zugeteilten Landes, nicht notwendig einen aktiven Vorgang der Besitzergreifung.
  revised_text: Und dies ist das Land, das Ham als Anteil zuteilwurde, das er für immer innehaben sollte, für sich und seine Söhne durch alle ihre Generationen hindurch, für immer.
