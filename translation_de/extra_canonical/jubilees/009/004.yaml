  source_fidelity: Die Grundstruktur und die doppelte Dauerformel werden zutreffend wiedergegeben. „Durch das Los“ ist jedoch im vorliegenden Vers nicht ausdrücklich genannt; es deutet den Zuteilungsvorgang stärker aus, als der Wortlaut erfordert.
  naturalness: Der Satz ist verständlich und würdevoll. „Als der Anteil“ nach „zufiel“ wirkt leicht doppelt; „als Anteil zuteilwurde“ ist im Deutschen geschlossener und vermeidet die zusätzliche Los-Interpretation.
  terminology: „Anteil“, „Ham“, „Söhne“, „Generationen“ und die wiederholte Formel „für immer“ sind angemessen. Für das künftige Innehaben des Landes ist „innehaben sollte“ neutraler als die potenziell stärker besitzrechtlich ausgedeutete Wendung „in Besitz nehmen sollte“.
