  text: And he was buried on Mount Lubar in the land of Ararat. And he completed 950 years of his life.
translation:
  language: de
  text: Und er wurde auf dem Berg Lubar im Land Ararat begraben. Er vollendete 950 Lebensjahre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er vollendete 950 Jahre in seinem Leben.“'
    reason: Die ge’ezische Präpositionalfügung በሕይወቱ lässt sich wörtlich mit „in seinem Leben“ wiedergeben, klingt so im Deutschen jedoch weniger natürlich.
lexical_decisions:
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: auf dem Berg Lubar
  rationale: Die Verbindung von Lubar mit ደብር bezeichnet hier natürlich den Berg Lubar. Obwohl ውስተ häufig „in“ bedeutet, ist bei einer Bestattung an einem Berg im Deutschen „auf“ idiomatisch.
- source_word: በምድረ፡ አራራት
  choice: im Land Ararat
  rationale: Gibt Präposition und Ortsbezeichnung knapp und quellennah wieder.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: Er vollendete 950 Lebensjahre
  rationale: Bewahrt das Verb „vollenden“ und gibt die Lebenszeit in natürlichem modernem Deutsch wieder; die wörtlichere Präpositionalfügung wird in der Fußnote dokumentiert.
