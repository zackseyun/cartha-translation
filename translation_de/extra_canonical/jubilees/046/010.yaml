lexical_decisions:
- source_word: ወገብኡ፡ ብዙኃን፡ ውስተ፡ ግብጽ
  choice: Und viele kehrten nach Ägypten zurück
  rationale: Gibt die Rückkehrbewegung und das Ziel natürlich und nah am ge’ezischen Wortlaut wieder.
- source_word: ወኅዳጣን፡ ተርፉ፡ እምኔሆሙ
  choice: einige wenige von ihnen aber blieben
  rationale: Bewahrt den Gegensatz zwischen den vielen Rückkehrenden und dem kleinen zurückbleibenden Teil; „blieben“ entspricht hier idiomatisch dem Sinn von ተርፉ.
- source_word: ውስተ፡ ደብረ፡ [ኬብሮን]
  choice: im Bergland von Hebron
  rationale: Das am Versende stehende ደብረ ist eine gebundene Form („Berg/Bergland von“); aufgrund der überlieferten Versabgrenzung ist „Hebron“ als nachfolgendes, vom Parser abgetrenntes Bezugswort zu verstehen. „Bergland“ klingt im Deutschen für das Gebiet um Hebron natürlicher als „Berg von Hebron“.
