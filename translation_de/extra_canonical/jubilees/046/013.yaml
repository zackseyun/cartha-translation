  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: de
  text: 'Und er unterdrückte sie und sagte zu den Ägyptern: »Seht, das Volk der Israeliten ist zahlreicher und stärker als wir. Kommt, lasst uns klug gegen sie vorgehen, bevor sie sich vermehren, und lasst uns sie durch Frondienst unterdrücken, damit kein Krieg über uns kommt und auch sie sich unseren Feinden anschließen und aus unserem Land fortziehen; denn ihr Herz und ihr Blick sind auf das Land Kanaan gerichtet.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያሕምሞሙ / ወናሕምሞሙ
  choice: er unterdrückte sie / lasst uns sie … unterdrücken
  rationale: Die wiederholte Wurzel bezeichnet hier bedrückendes Zufügen von Leid; „unterdrücken“ wahrt die Wiederholung und passt zum folgenden Frondienst.
- source_word: ሕዝበ፡ ውሉደ፡ እስራኤል
  choice: das Volk der Kinder Israels
  rationale: Gibt die Kollektivbezeichnung verständlich und nahe an der ge’ezischen Formulierung wieder.
- source_word: ልህቁ፡ ወበዝኁ፡ እምኔነ
  choice: ist zahlreicher und stärker als wir
  rationale: Die beiden komparativen Aussagen werden in natürlicher deutscher Reihenfolge wiedergegeben; im Kontext bezeichnen sie Überzahl und Macht.
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: lasst uns klug gegen sie vorgehen
  rationale: Bewahrt den Gedanken eines berechnenden Vorgehens, ohne die Wendung unnötig wörtlich oder positiv klingen zu lassen.
- source_word: ዘእንበለ፡ ይብዝኁ
  choice: bevor sie sich vermehren
  rationale: ዘእንበለ hat hier zeitlichen Sinn („bevor“), nicht finalen Sinn („damit nicht“).
- source_word: በቅኔ
  choice: durch Frondienst
  rationale: Im Kontext der ägyptischen Bedrückung bezeichnet der Ausdruck auferlegten Zwangs- beziehungsweise Frondienst.
- source_word: ይወፅኡ፡ እምድርነ
  choice: aus unserem Land fortziehen
  rationale: ወፅአ bedeutet „hinausgehen/fortziehen“, nicht „hinaufziehen“; „fortziehen“ ist im Deutschen idiomatisch und erhält die Richtung aus dem Land.
- source_word: ልቦሙ፡ ወገጾሙ
  choice: ihr Herz und ihr Blick
  rationale: „Herz“ bleibt formal erhalten; „Gesicht“ bezeichnet in der Zielausrichtung idiomatisch den Blick beziehungsweise die Hinwendung.
theological_decisions:
- issue: Beziehung zur Formulierung von Exodus 1,10
  choice: Die ge’ezische Lesart „aus unserem Land fortziehen“ wird eigenständig übersetzt.
  alternative: „aus unserem Land hinaufziehen“ nach einer bekannten Exodus-Tradition
  rationale: Die Übersetzung folgt dem vorliegenden ge’ezischen Wortlaut und harmonisiert ihn nicht mit einer anderslautenden hebräischen Form.
- issue: Zweck- oder Zeitangabe vor der Vermehrung
  choice: „bevor sie sich vermehren“
  alternative: „damit sie sich nicht vermehren“
  rationale: Die ge’ezische Konjunktion trägt hier zeitlichen Sinn; eine finale Deutung würde den Wortlaut unnötig glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die harte politische Sprache des Herrschers bleibt erkennbar; altertümliche Wendungen und eine Harmonisierung mit Exodus 1,10 werden vermieden.
