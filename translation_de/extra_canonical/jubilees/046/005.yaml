lexical_decisions:
- source_word: ትውልድ
  choice: Generation
  rationale: Das Wort bezeichnet hier die betreffende Generation; „Generation“ ist im modernen Deutschen klar und wahrt den Anschluss an den vorausgehenden Zusammenhang.
- source_word: ወአዘዞሙ፡ ለውሉደ፡ እስራኤል
  choice: Und er gebot den Söhnen Israels
  rationale: Die Konstruktion wird eng am ge’ezischen Wortlaut wiedergegeben; „Söhne Israels“ bewahrt die traditionelle Gruppenbezeichnung.
- source_word: ዘእንበለ፡ ይሙት
  choice: bevor er starb
  rationale: Die Zeitangabe wird idiomatisch und ohne unnötige Deutung wiedergegeben.
- source_word: ከመ፡ ይስዱ
  choice: sie sollten forttragen
  rationale: Der abhängige Auftrag bleibt am Versende bewusst unvollständig, da sein Objekt im folgenden Text steht; „forttragen“ gibt die gerichtete Beförderung wieder.
