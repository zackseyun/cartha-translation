  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: de
  text: im Land Ägypten. Und alle seine Brüder starben nach ihm. Im siebenundvierzigsten Jubiläum, in der zweiten Jahrwoche, im zweiten Jahr, zog der König von Ägypten aus, um gegen den König von Kanaan zu kämpfen. Und die Israeliten brachten die Gebeine aller Söhne Jakobs fort, ausgenommen die Gebeine Josefs, und begruben sie auf dem Feld, in der Doppelhöhle im Gebirge,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳም (gädam)
  choice: Feld
  rationale: Im Zusammenhang mit der Grablege der Söhne Jakobs bezeichnet das Wort hier das offene beziehungsweise unbebaute Gelände; „Feld“ wahrt zugleich den Bezug zur patriarchalischen Grabstätte.
- source_word: ሱባዔ (subāʿe)
  choice: Jahrwoche
  rationale: In der chronologischen Formel des Jubiläenbuches ist eine Siebenerperiode von Jahren gemeint; „Jahrwoche“ ist im Deutschen präziser als das bloße „Woche“.
- source_word: በዐት፡ ዘካዕበት (baʿat za-kāʿbet)
  choice: Doppelhöhle
  rationale: Die Wendung bedeutet wörtlich eine Höhle, die doppelt beziehungsweise zweifach ist; „Doppelhöhle“ ist knapp und entspricht der traditionellen Bezeichnung der Grablege.
- source_word: ወአውፅኡ (wa-ʾawṣəʾu)
  choice: brachten … fort
  rationale: Das Kausativverb bezeichnet das Heraus- beziehungsweise Fortbringen der Gebeine; die deutsche Formulierung passt natürlich zum erzählten Ortswechsel.
