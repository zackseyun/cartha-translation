  register: Moderne, würdevolle Erzählsprache. Die wiederholte Präposition in „auf dem Feld, in der Doppelhöhle“ bleibt erhalten und wird nicht als Genitivverbindung umgedeutet. Der Vers setzt einen vorhergehenden Satz fort und endet im überlieferten Ausschnitt ebenfalls syntaktisch offen; Kleinschreibung am Anfang und Schlusskomma bilden das ab.
