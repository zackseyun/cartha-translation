translation:
  language: de
  text: Sie wurden zahlreicher, und ebenso vermehrten sie sich. Und die Ägypter empfanden Abscheu vor den Söhnen Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይበዝኁ
  choice: sie wurden zahlreicher
  rationale: Gibt die Zunahme des Volkes natürlich wieder und bewahrt die erste der parallelen Aussagen.
- source_word: ወከማሁ፡ ይፈደፍዱ
  choice: und ebenso vermehrten sie sich
  rationale: ከማሁ bezeichnet hier die entsprechende beziehungsweise gleichartige Entwicklung; die Formulierung erhält den Parallelismus, ohne eine nicht ausdrücklich markierte Steigerung einzutragen.
- source_word: ያስተረዙስዎሙ
  choice: empfanden Abscheu vor
  rationale: Das Verb bezeichnet hier, parallel zu Exodus 1,12, die ablehnende Haltung der Ägypter gegenüber Israel, nicht ein Verursachen, durch das Israel anderen abscheulich gemacht worden wäre.
- source_word: ለውሉደ፡ እስራኤል
  choice: vor den Söhnen Israels
  rationale: Formale und im biblischen Deutsch verständliche Wiedergabe der genealogisch-kollektiven Bezeichnung.
theological_decisions:
- issue: Handelnde beziehungsweise empfindende Partei beim Abscheu
  choice: Die Ägypter empfinden Abscheu vor Israel.
  alternative: Die Ägypter machen die Söhne Israels abscheulich.
  rationale: Die lexikalisierte Bedeutung des Verbs beschreibt das Verabscheuen oder Verabscheutfinden durch die Ägypter. So bleibt die Feindseligkeit als Haltung der Ägypter erkennbar, ohne eine zusätzliche Wirkung auf Dritte anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Ausgangstextes bleibt hörbar; „Söhne Israels“ bewahrt die traditionelle kollektive Bezeichnung.
