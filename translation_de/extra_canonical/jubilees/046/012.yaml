lexical_decisions:
- source_word: ዐጸወ
  choice: verschloss
  rationale: Das ge'ezische Verb bezeichnet das Schließen bzw. Verschließen; „verschloss“ gibt hier die vollendete Handlung natürlich wieder.
- source_word: አንቀጸ፡ ግብጽ
  choice: das Tor Ägyptens
  rationale: Die Genitivverbindung wird formal und idiomatisch wiedergegeben, ohne „Tor“ unnötig als Plural zu deuten.
- source_word: ሐለየ፡ እኩየ፡ ሕሊና
  choice: fasste einen bösen Plan
  rationale: Die Wendung spricht wörtlich vom Denken eines bösen Gedankens; „einen bösen Plan fassen“ vermittelt im Deutschen den beabsichtigten, feindseligen Vorsatz.
- source_word: ውሉደ፡ እስራኤል
  choice: die Söhne Israels
  rationale: Bewahrt die formale, genealogische Ausdrucksweise der Vorlage.
- source_word: ከመ
  choice: damit
  rationale: Gibt die einleitende Zweck- oder Folgekonstruktion wieder und lässt den am Versende offenen Satz bewusst unvollendet.
theological_decisions:
- issue: Zielrichtung des bösen Plans
  choice: damit
  alternative: sodass / um zu
  rationale: Die Quelle bricht nach der Konjunktion ab; „damit“ bewahrt die prospektive Spannung, ohne den im Folgevers genannten Inhalt vorwegzunehmen oder die genaue Nuance endgültig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Schluss des Verses wird entsprechend der Quelle erhalten; keine Ergänzung aus dem Folgevers.
