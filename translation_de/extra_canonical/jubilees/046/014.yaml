- from: Und er setzte Aufseher über die Zwangsarbeit über sie ein, um sie durch Frondienst zu bedrücken. Sie bauten für den Pharao die befestigten Städte Pitom und Ramses. Auch bauten sie alle Mauern und alle eingestürzten Dämme wieder auf.
  to: Und er setzte Aufseher über sie ein, um sie durch Zwangsarbeit zu bedrücken. Und sie bauten für den Pharao die befestigten Städte Pitom und Ramses. Und sie bauten alle Mauern und alle Dämme, die eingestürzt waren.
  rationale: Die Revision glättet den ersten Satz, ohne das nicht ausdrücklich benannte Subjekt zu identifizieren. Am Versende bewahrt sie den möglichen gemeinsamen Bezug des Relativsatzes auf Mauern und Dämme und vermeidet die über den Wortlaut hinausgehende Explizitmachung eines Wiederaufbaus.
