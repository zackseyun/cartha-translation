  yaml_path: translation/extra_canonical/jubilees/046/014.yaml
  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: de
  text: Und er setzte Aufseher über sie ein, um sie durch Zwangsarbeit zu bedrücken. Und sie bauten für den Pharao die befestigten Städte Pitom und Ramses. Und sie bauten alle Mauern und alle Dämme, die eingestürzt waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: Aufseher über die Zwangsarbeit
  rationale: Die Wortgruppe bezeichnet Verantwortliche bzw. Vorsteher der auferlegten Arbeit; die Wiedergabe macht sowohl ihre Aufsichtsfunktion als auch den Zwangscharakter der Arbeit deutlich.
- source_word: ያሕምምዎሙ፡ በቅኔ
  choice: sie durch Frondienst zu bedrücken
  rationale: Das Verb drückt Zufügen von Leid oder Bedrängnis aus; ቅኔ bezeichnet hier belastenden Dienst bzw. Zwangsarbeit.
- source_word: አህጉረ፡ ጽኑዓተ
  choice: die befestigten Städte
  rationale: Wörtlich sind es starke bzw. feste Städte; im Kontext ist „befestigte Städte“ die natürliche deutsche Entsprechung.
- source_word: ጲቶሃ፡ ወራምሴሃ
  choice: Pitom und Ramses
  rationale: Gebräuchliche deutsche Formen der Ortsnamen.
- source_word: ጥቆመ
  choice: Mauern
  rationale: Im vorliegenden Baukontext bezeichnet das Wort bauliche Umfassungen bzw. Mauern.
- source_word: ዐረፋተ
  choice: Dämme
  rationale: Bezeichnet aufgeschüttete Erdwerke bzw. Böschungen; „Dämme“ ist hier knapp und sachgerecht.
- source_word: ዘወደቀ
  choice: eingestürzten … wieder auf
  rationale: Das Relativgefüge bedeutet „die gefallen/eingestürzt waren“. Zusammen mit „bauten“ ergibt sich im Deutschen idiomatisch „bauten … wieder auf“.
theological_decisions:
- issue: Subjekt des einleitenden Satzes
  choice: „er“ bleibt ohne ausdrückliche Identifizierung
  alternative: „der Pharao“
  rationale: Der äthiopische Text hat lediglich die maskuline Verbform; die Identität ergibt sich aus dem Zusammenhang und wird nicht interpretierend in den Text eingesetzt.
- issue: Bedeutung des Wiederaufbaus am Versende
  choice: „alle eingestürzten Dämme wieder auf“
  alternative: „alle Dämme, die eingestürzt waren“
  rationale: Die attributive Lesart von ዘወደቀ wird bewahrt; „wieder aufbauen“ gibt im Deutschen die Verbindung von Bauen und vorherigem Einsturz natürlich wieder, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung folgt dem Sinnverlauf des ge’ezischen Textes; Wiederholungen werden weitgehend bewahrt, während die Schlusskonstruktion idiomatisch als Wiederaufbau formuliert wird.
