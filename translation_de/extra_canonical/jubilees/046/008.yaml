  source_fidelity: 'Die Übersetzung gibt alle Elemente des geʿezischen Textes wieder: Josefs Tod, die dreistufige chronologische Einordnung (46. Jubiläum, sechste Woche, zweites Jahr) sowie seine Bestattung durch eine nicht näher bestimmte Mehrzahl. Die knappe Wiedergabe von ሱባዔ als „Woche“ erhält die quelltextliche Form und fügt keine auslegende Präzisierung hinzu.'
  naturalness: „Und Josef starb im sechsundvierzigsten Jubiläum, in der sechsten Woche, im zweiten Jahr; und sie begruben ihn.“ ist verständliches, modernes Standarddeutsch in bewusst schlichter erzählerischer Registerlage. Das Semikolon markiert angemessen die zweite, koordinierte Aussage.
  terminology: „Jubiläum“ ist als terminus technicus für die im Jubiläenbuch verwendete Zeitperiode konsistent und vertretbar. „Woche“ bewahrt die kalendarische, im Deutschen ohne Zusatz nicht vollständig explizierte, aber auch nicht verfälschte Bezeichnung. „Josef“ und „sie begruben ihn“ sind sachgerecht.
