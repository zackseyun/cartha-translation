lexical_decisions:
- source_word: ኢዮቤልው
  choice: Jubiläum
  rationale: Bezeichnet hier die kalendarische Jubiläumsperiode; „Jubiläum“ bewahrt den Fachbegriff des Buches.
- source_word: ሱባዔ
  choice: Woche
  rationale: Das Wort bezeichnet eine Siebenerperiode. Der Kontext ist kalendarisch; die knappe Wiedergabe bewahrt die Ausdrucksweise der Quelle, ohne „Jahrwoche“ erklärend einzufügen.
- source_word: ቀበርዎ
