base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/003.yaml
  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: de
  text: … die Söhne Israels während der ganzen Lebenszeit Josefs. Josef starb im Alter von hundertzehn Jahren. Siebzehn Jahre lebte er im Land Kanaan, zehn Jahre diente er, drei Jahre war er im Gefängnis, und achtzig Jahre stand er unter der Herrschaft des Pharaos, des Königs von Ägypten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die im Auftrag überlieferte geʽezische Textzeile bricht nach „achtzig Jahre“ ab. Die Schlussworte folgen der für diesen Vers nachgewiesenen vollständigen Lesart: „stand er unter der Herrschaft des Pharaos, des Königs von Ägypten“.'
    reason: Die materielle Lücke im bereitgestellten Ausgangstext wird transparent gemacht; zugleich wird die durch die Revisionsangabe bezeugte vollständige Lesart übersetzt.
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ
  choice: während der ganzen Lebenszeit Josefs
  rationale: Gibt die zeitliche Wendung natürlich und vollständig wieder, ohne über den Zusammenhang des am Versanfang stehenden Fragments hinauszugehen.
- source_word: ወሞተ፡ ዮሴፍ፡ ወልደ፡ ምእት፡ ወዓሠርቱ፡ ዓመት
  choice: Josef starb im Alter von hundertzehn Jahren
  rationale: Die ge'ezische Altersformel wird in idiomatischem modernem Deutsch wiedergegeben.
- source_word: እንዘ፡ ይትቀነይ
  choice: verbrachte er als Diener
  rationale: Das Verb bezeichnet Dienst beziehungsweise Unterordnung; die Formulierung bleibt gegenüber einer genaueren sozialen Einordnung wie „Sklave“ zurückhaltend.
- source_word: ቤተ፡ ሞቅሕ
  choice: Gefängnis
  rationale: Wörtlich etwa „Haus der Gefangenschaft“; „Gefängnis“ ist die natürliche deutsche Entsprechung.
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን፡ ንጉሠ፡ ግብጽ
  choice: stand er unter der Herrschaft des Pharaos, des Königs von Ägypten
  rationale: Folgt der in der Revisionsüberlieferung belegten vollständigen Schlussklausel und wahrt das Verhältnis der Unterordnung, ohne es zu „im Land Ägypten“ zu verflachen.
