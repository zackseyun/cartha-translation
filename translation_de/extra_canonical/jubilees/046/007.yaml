  terminology: „Land Kanaan“, „Tor Ägyptens“ und die Beibehaltung des nicht sicher zu identifizierenden Namens „Eromon“ sind angemessen. „Ein anderer, neuer König“ bewahrt die doppelte Charakterisierung des Textes, auch wenn sie bewusst leicht markiert klingt.
