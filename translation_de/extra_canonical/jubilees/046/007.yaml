  source_fidelity: 'Die wesentlichen ge''ezischen Aussagen sind korrekt wiedergegeben: Verfolgung bis zum Eingang von Eromon, ein anderer/neuer und überlegener König über Ägypten, Rückkehr nach Kanaan sowie das passive Verschließen des Tores. Die Wiedergabe von ወገብአ als „kehrte ... zurück“ und von ወተዐጽወ als Passiv ist gegenüber der früheren englischen Lesart besonders wichtig und richtig.'
