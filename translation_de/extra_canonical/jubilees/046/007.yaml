base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/007.yaml
  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
translation:
  language: de
  text: Ägypten und tötete ihn dort; dann verfolgte er sie nach Ägypten bis zum Eingang von Eromon. Doch er konnte nicht hineingelangen, denn ein anderer, neuer König war über Ägypten an die Macht gekommen, der stärker war als er. Und er kehrte in das Land Kanaan zurück. Das Tor Ägyptens wurde verschlossen, und niemand ging aus Ägypten hinaus oder kam hinein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዴገነ፡ ድኅሬሆሙ፡ ለግብጽ
  choice: Dann verfolgte er sie bis nach Ägypten
  rationale: ዴገነ ድኅሬሆሙ bezeichnet das Verfolgen hinter ihnen her; ለግብጽ gibt das Ziel Ägypten an.
- source_word: አንቀጸ፡ ኤሮሞን
  choice: Eingang von Eromon
  rationale: አንቀጽ kann Eingang, Tor oder Zugang bedeuten; bei dem nicht sicher identifizierten Eigennamen Eromon bleibt „Eingang“ bewusst neutral.
- source_word: ነግሠ፡ ካልእ፡ ሐዲስ፡ ንጉሥ፡ ለግብጽ
  choice: ein anderer, neuer König war über Ägypten an die Macht gekommen
  rationale: ነግሠ bedeutet als König herrschen bzw. den Thron besteigen; die idiomatische Formulierung wahrt sowohl Herrschaftsbeginn als auch Herrschaft über Ägypten.
- source_word: ወኀየሰ፡ እምኔሁ
  choice: der stärker war als er
  rationale: Der Komparativ bezeichnet die Überlegenheit des neuen Königs gegenüber dem Verfolger.
- source_word: ወገብአ፡ ምድረ፡ ከናአን
  choice: So kehrte er in das Land Kanaan zurück
  rationale: ገብአ bedeutet hier „zurückkehren“, nicht „in Besitz nehmen“.
- source_word: ወተዐጽወ፡ አንቀጸ፡ ግብጽ
  choice: Das Tor Ägyptens wurde verschlossen
  rationale: Die tä-Stammform ist passiv; አንቀጽ wird in diesem politischen Grenzkontext natürlich als „Tor“ wiedergegeben.
- source_word: ወአልቦ፡ ዘይወፅእ፡ ወአልቦ፡ ዘይበውእ፡ ውስተ፡ ግብጽ
  choice: und niemand ging aus Ägypten hinaus oder kam hinein
  rationale: Die symmetrische Negation wird in natürlichem Deutsch knapp bewahrt; „hinein“ bezieht sich eindeutig auf Ägypten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der überlieferte Verseinstieg ist syntaktisch ein Fragment, da Subjekt und vorhergehender Satzteil im vorangehenden Vers stehen; diese Anschlussform wird beibehalten. Die korrigierte Lesart „kehrte zurück“ und das Passiv „wurde verschlossen“ folgen unmittelbar den ge’ezischen Verbformen.
