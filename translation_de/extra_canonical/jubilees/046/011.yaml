  text: Hebron; and your father Amram remained with them. And the king of Canaan defeated the king of Egypt.
translation:
  language: de
  text: Hebron; und dein Vater Abram[a] blieb bei ihnen. Und der König von Kanaan besiegte den König von Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Text hat „Abram“; im Kontext ist möglicherweise „Amram“ gemeint.
    reason: Die überlieferte Lesart wird im Haupttext bewahrt, während die kontextuell plausible, in kritischen Ausgaben häufig angenommene Korrektur transparent vermerkt wird.
lexical_decisions:
- source_word: አብራም
  choice: Amram
  rationale: Der überlieferte ge’ezische Text lautet wörtlich „Abram“. Da jedoch Mose angesprochen wird und sein Vater gemeint ist, wird die allgemein anerkannte Textkorrektur „Amram“ im Haupttext verwendet; die Handschriftenlesart bleibt in einer Fußnote sichtbar.
- source_word: ወሞአ
  choice: Und … besiegte
  rationale: Das Verb ሞአ bedeutet „siegen, bezwingen, besiegen“ und ist nicht mit ሞተ („sterben“) zu verwechseln.
- source_word: ወተረፈ
  choice: blieb
  rationale: Gibt den Sinn „übrig bleiben, verbleiben“ hier natürlich und knapp wieder.
