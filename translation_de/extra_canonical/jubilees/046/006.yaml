lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: seine Gebeine
  rationale: Die traditionelle, würdevolle deutsche Wiedergabe bezeichnet die sterblichen Knochen bzw. Überreste und passt zum Bestattungskontext.
- source_word: አይድኅሙ
  choice: nicht noch einmal
  rationale: Gibt den Wiederholungsaspekt des ge'ezischen Ausdrucks wieder, ohne den Satz stärker auszudeuten.
- source_word: ግብጽ
  choice: die Ägypter
  rationale: Obwohl die Form wörtlich »Ägypten« bezeichnet, verlangt der Zusammenhang ein handelndes menschliches Subjekt; die metonymische Wiedergabe ist im Deutschen natürlich.
- source_word: ምድረ፡ አሱር
  choice: Land Assur
  rationale: Bewahrt den antiken geografischen Namen und vermeidet die mögliche Gleichsetzung mit späteren politischen Gebilden.
- source_word: በቈላ
  choice: in der Talebene
  rationale: Der Ausdruck bezeichnet tiefer gelegenes, ebenes Land; »Talebene« erhält sowohl den räumlichen als auch den topografischen Sinn.
theological_decisions:
- issue: Josefs Erwartung hinsichtlich der späteren Überführung seiner Gebeine
  choice: Die Ägypter würden ihn nicht noch einmal herausbringen und in Kanaan begraben.
  alternative: Ägypten würde nicht erneut ausziehen, um ihn im Land Kanaan zu begraben.
  rationale: Die gewählte Fassung folgt der im Kontext naheliegenden metonymischen Personenreferenz, ohne einen zusätzlichen theologischen Grund für den Schwur einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anfang wurde als Fortsetzung des vorausgehenden Zusammenhangs bewahrt; ebenso wurde das unvollständige Satzende nicht ergänzt. »Auszögen« steht im abhängigen Zukunftsbezug zu dem Schwur und klingt zugleich natürlich erzählerisch.
