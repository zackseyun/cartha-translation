  text: seine Gebeine an dem Tag, als sie aus dem Land Ägypten auszogen. Und er ließ sie wegen seiner Gebeine schwören; denn er wusste, dass die Ägypter ihn nicht erneut herausbringen und im Land Kanaan begraben würden. Denn Makmaron, der König von Kanaan, kämpfte, während er im Land Assur wohnte, in der Talebene mit dem König von …[a]
