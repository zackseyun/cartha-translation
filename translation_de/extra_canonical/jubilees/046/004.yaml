- source_word: ወሞተ፡ ወኵሎሙ፡ አኅዊሁ
  choice: Und er starb, ebenso alle seine Brüder
  rationale: Das wiederholte ወ wird so wiedergegeben, dass die koordinierte Aussage im Deutschen verständlich bleibt; der abschließende Beistrich wahrt den fragmentarischen Anschluss an den Folgekontext.
