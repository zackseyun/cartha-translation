- source_word: ያሐስሙ፡ ላዕሌሆሙ
  choice: sie sie unterdrückten
  rationale: Das Verb beschreibt bedrückende beziehungsweise harte Behandlung; „unterdrückten“ entspricht dem Kontext und bleibt knapp.
- source_word: መጠነ ... ከማሁ
  choice: je mehr ... desto mehr
  rationale: Die korrelative Vergleichskonstruktion wird idiomatisch wiedergegeben; ihr im Versfragment unvollendeter Ausgang bleibt erhalten.
