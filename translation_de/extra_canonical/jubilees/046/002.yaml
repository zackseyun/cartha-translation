base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: de
  text: Und in allen Tagen von Josefs Leben, die er nach seinem Vater Jakob[a] noch lebte, gab es keinen Widersacher und nichts Böses, denn ganz Ägypten ehrte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist wahrscheinlich: nach dem Tod seines Vaters Jakob.'
    reason: Die wörtliche Formulierung „nach seinem Vater Jakob“ ist mehrdeutig; der Zusammenhang legt Jakobs Tod als zeitlichen Bezugspunkt nahe.
lexical_decisions:
- source_word: ሰይጣን (śayṭān)
  choice: Widersacher
  rationale: Das Lehnwort bezeichnet hier einen Gegner oder Widersacher; der Kontext verlangt nicht zwingend den Eigennamen „Satan“.
- source_word: ምንተኒ፡ እኩየ
  choice: nichts Böses
  rationale: Gibt die Verbindung „irgendetwas Böses“ idiomatisch und umfassend wieder.
- source_word: ያከብ
  choice: ehrte ihn
  rationale: Das Verb drückt Ehre bzw. Achtung aus; das im Deutschen erforderliche Objekt „ihn“ ist aus dem Kontext zu ergänzen.
theological_decisions:
- issue: Ob ሰይጣን als Eigenname oder Gattungsbezeichnung zu verstehen ist
  choice: Widersacher
  alternative: Satan
  rationale: Die Aussage beschreibt das Ausbleiben feindlicher und böser Einwirkungen in Josefs späterem Leben. „Widersacher“ bewahrt den möglichen allgemeinen Sinn, ohne eine bestimmte übernatürliche Deutung festzulegen.
- issue: Bedeutung von „nach seinem Vater Jakob“
  choice: Die knappe zeitliche Formulierung bleibt im Haupttext erhalten und wird nur durch „noch lebte“ verständlicher gemacht.
  alternative: nach dem Tod seines Vaters Jakob
  rationale: Der ge’ezische Text nennt den Tod Jakobs nicht ausdrücklich. Die wahrscheinlich gemeinte zeitliche Einordnung wird daher in einer Fußnote erläutert, statt sie stillschweigend in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bündelt die zeitliche Bestimmung am Anfang und erhält zugleich den ausdrücklichen Relativsatz „die er … lebte“ der ge’ezischen Vorlage.
