  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: de
  text: Und nach Jakobs Tod vermehrten sich die Söhne Israels im Land Ägypten und wurden zu einem zahlreichen Volk. Sie waren alle in ihren Herzen vereint, sodass jeder seinen Bruder liebte und einer dem anderen half. Sie vermehrten sich überaus und nahmen außerordentlich zu während all der Tage Josefs, zehn Jahrwochen lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝኁ
  choice: vermehrten sich / wurden zahlreich
  rationale: Das wiederholte Verb bezeichnet eine zahlenmäßige Zunahme. Die beiden deutschen Wiedergaben erhalten diesen Sinn und vermeiden die sachlich unzutreffende Deutung „wurden stark“.
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: in ihren Herzen vereint
  rationale: Die Formulierung bezeichnet innere Einigkeit beziehungsweise Gleichgesinntheit; „in ihren Herzen“ gibt die ausdrücklich genannte innere Sphäre wieder.
- source_word: ይትራዳእ
  choice: half
  rationale: Das Verb drückt gegenseitige Hilfe oder Unterstützung aus; im parallelen deutschen Satz klingt „einer dem anderen half“ natürlich.
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት
  choice: zehn Jahrwochen
  rationale: Die wörtliche Zeiteinheit „zehn Siebener von Jahren“ wird mit dem etablierten und verständlichen Ausdruck „Jahrwochen“ wiedergegeben.
theological_decisions:
- issue: Brüderlichkeit innerhalb Israels
  choice: jeder seinen Bruder liebte und einer dem anderen half
  alternative: jeder seine Brüder liebte und ihnen half
  rationale: Der singularische, distributive Wortlaut des Ausgangstextes bleibt erhalten, ohne die Aussage konfessionell oder ethisch weiter auszudeuten.
- issue: Dauer der Zeit Josefs
  choice: während der ganzen Zeit Josefs
  alternative: während aller Lebenstage Josefs
  rationale: „Leben“ steht nicht ausdrücklich im überlieferten Wortlaut. Die offenere Formulierung vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Erzählauftakt wird idiomatisch verkürzt; Parallelismus und Wiederholung der Vermehrungsaussage bleiben erkennbar. Keine Fußnoten erforderlich.
