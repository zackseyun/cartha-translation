lexical_decisions:
- source_word: ይዜከር
  choice: er erinnerte sich
  rationale: Gibt das geezische Verb des Erinnerns unmittelbar und idiomatisch wieder.
- source_word: ምግባራቲሃ
  choice: ihre Taten
  rationale: Bezeichnet ihre Handlungen beziehungsweise Werke; „Taten“ ist im modernen Deutsch natürlich und bewahrt den umfassenden Sinn.
- source_word: ይላሕዋ ጥቀ
  choice: trauerte sehr um sie
  rationale: Die Verbindung drückt starke Trauer um die Verstorbene aus; „um sie trauern“ ist die natürliche deutsche Wendung.
- source_word: ያፈቅራ
  choice: er liebte sie
  rationale: Entspricht dem Ausdruck persönlicher Liebe im Kontext.
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: mit seinem ganzen Herzen und mit seiner ganzen Seele
  rationale: Bewahrt die zweiteilige, emphatische Formulierung des Ausgangstextes.
