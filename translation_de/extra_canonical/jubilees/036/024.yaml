  text: And he remembered all her deeds that she had done in her life, and he mourned for her greatly, because he loved her with all his heart and with all his soul.
translation:
  language: de
  text: Und er erinnerte sich an alle ihre Taten, die sie in ihrem Leben vollbracht hatte, und trauerte sehr um sie, denn er liebte sie mit seinem ganzen Herzen und mit seiner ganzen Seele.
