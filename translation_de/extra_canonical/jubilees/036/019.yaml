  text: Esau und Jakob. Und Esau ging in das Land Edom, zum Berg Seïr, und wohnte dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሖረ
  choice: zog
  rationale: Das Verb bezeichnet hier Esaus Ortswechsel; „zog“ ist im Deutschen natürlich und bewahrt den erzählerischen Stil.
- source_word: ደብረ፡ ሴር
  choice: Gebirge Seïr
  rationale: ደብር kann einen Berg oder ein Bergland bezeichnen. Im Zusammenhang mit Edom ist „Gebirge Seïr“ die etablierte und geografisch passende Wiedergabe.
- source_word: ነበረ፡ ህየ
  choice: ließ sich dort nieder
  rationale: Wörtlich etwa „wohnte/blieb dort“; im Zusammenhang mit dem vorausgehenden Hinziehen gibt „ließ sich dort nieder“ den dauerhaften Aufenthalt natürlich wieder.
