base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: de
  text: Denn seit dem Tod ihrer Schwester Rahel liebte er sie überaus, weil sie in all ihren Wegen untadelig und aufrichtig war und Jakob ehrte. Und während all der Tage, die sie mit ihm lebte, hörte er aus ihrem Mund kein hartes Wort, denn Sanftmut, Frieden, Aufrichtigkeit und Ehre waren in ihr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn sie war sanft, friedfertig, aufrichtig und ehrenhaft«.'
    reason: Die abstrakten geezischen Substantive mit »in ihr« können im Deutschen auch idiomatisch als Eigenschaften der Frau wiedergegeben werden.
lexical_decisions:
- source_word: ያፈቅራ፡ ፈድፋደ፡ ጥቀ
  choice: liebte er sie überaus
  rationale: Die intensive Verstärkung des Verbs „lieben“ wird in natürlichem, würdigem Deutsch bewahrt.
- source_word: ፍጽምት፡ ወሬትዕት
  choice: untadelig und aufrichtig
  rationale: Die beiden weiblichen Prädikatsadjektive bezeichnen sittliche Integrität und Geradheit; „untadelig“ vermeidet die im heutigen Deutsch leicht absolute Wirkung von „vollkommen“.
- source_word: ቃለ፡ ድሩከ
  choice: kein hartes Wort
  rationale: Die Verbindung bezeichnet eine harte, schroffe oder verletzende Äußerung; „hartes Wort“ erhält die knappe Bildlichkeit.
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ፡ ባቲ
  choice: Sanftmut, Frieden, Aufrichtigkeit und Ehre waren in ihr
  rationale: Die abstrakten Substantive und die Wendung „in ihr“ werden entsprechend der grammatischen Gestalt der geezischen Vorlage erhalten.
theological_decisions:
- issue: Bedeutung von ፍጽምት im moralischen Lob
  choice: untadelig
  alternative: vollkommen
  rationale: „Untadelig“ gibt die moralische Ganzheit wieder, ohne eine weitergehende Lehre von absoluter Sündlosigkeit einzutragen.
- issue: Abstrakte Tugendnomen am Versende
  choice: 'Substantivische Wiedergabe: „Sanftmut, Frieden, Aufrichtigkeit und Ehre waren in ihr“'
  alternative: 'Adjektivische Wiedergabe: „sie war sanft, friedfertig, aufrichtig und ehrenhaft“'
  rationale: Die substantivische Form wahrt die auffällige Quellstruktur und ihre Aussage, dass diese Eigenschaften in ihr vorhanden waren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem erzählerischem Ton. Der Satzbau wurde für gute Lesbarkeit leicht gegliedert, während Wiederholungen, moralische Begriffspaare und die substantivische Schlussformel der Vorlage erhalten bleiben.
