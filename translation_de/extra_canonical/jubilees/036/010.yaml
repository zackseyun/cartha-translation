base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: de
  text: Und am Tag des Aufruhrs, des Fluches, des Grimms und des Zorns wird er mit loderndem, verzehrendem Feuer – wie er Sodom verbrannte – sein Land, seine Stadt und alles, was ihm gehört, verbrennen. Er wird aus dem Buch der Zucht der Menschenkinder getilgt werden[a] und nicht in das Buch des Lebens aufsteigen, sondern in das, was zum Untergang bestimmt ist. Er wird dem ewigen Fluch verfallen, sodass ihr Gericht für alle Tage erneuert wird[b] – mit Verwünschung, mit Fluch, mit Zorn, mit Qual, mit Grimm, mit Plagen und mit immerwährender Krankheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „aus dem Buch der Zucht der Menschenkinder“ ist textlich und inhaltlich schwierig. Der Ge’ez-Text scheint dieses Verzeichnis vom „Buch des Lebens“ zu unterscheiden; was das erste Buch genau bezeichnet, bleibt ungewiss.
    reason: textual_variant
  - marker: b
    text: Die hier zugrunde gelegte textkritische Deutung versteht den schwierigen Wortlaut als „ihr Gericht“ und verbindet ihn mit „wird erneuert“. Die anschließende Häufung ähnlicher Fluch- und Strafwörter ist bewusst beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: ሁከት
  choice: Aufruhr
  rationale: Gibt Unruhe, Wirren oder Tumult in einem würdigen und zugleich allgemein verständlichen Ausdruck wieder.
- source_word: መርገም
  choice: Fluch
  rationale: Die wiederkehrende Bezeichnung wird konsequent mit „Fluch“ übersetzt und so auch in der Schlussreihe erhalten.
- source_word: ቍጥዓ / መዓት
  choice: Grimm / Zorn
  rationale: Zwei benachbarte Zornbegriffe werden unterschieden, ohne eine präzise Abstufung zu behaupten, die der Kontext nicht sicher festlegt.
- source_word: መጽሐፈ ተግሣጸ ውሉደ ሰብእ
  choice: Buch der Zucht der Menschenkinder
  rationale: Bewahrt die formale Bildsprache eines vom Buch des Lebens unterschiedenen Verzeichnisses; „Zucht“ lässt die unsichere Nuance von Unterweisung, Mahnung oder Disziplin sichtbar.
- source_word: ወአየዐርግ ውስተ መጽሐፈ ሕይወት
  choice: und nicht in das Buch des Lebens aufsteigen
  rationale: Erhält das im Ge’ez ausdrücklich verwendete Verb des Aufsteigens, auch wenn im Deutschen „aufgenommen werden“ idiomatischer wäre.
- source_word: እንዘ ትትሔደስ
  choice: aufs Neue vollzogen wird
  rationale: Gibt den Gedanken fortdauernder Erneuerung idiomatisch wieder und vermeidet die frühere, quellenwidrige Deutung als Denunziation.
- source_word: ጽእለት ... መርገም ... መዐት ... ፃዕር ... ቍጥዓ ... መቅሠፍት ... ደዌ ዘለዓለም
  choice: Verwünschung ... Fluch ... Zorn ... Qual ... Grimm ... Plagen ... immerwährende Krankheit
  rationale: Die gehäufte Folge nahezu synonymer Straf- und Fluchbegriffe wird in ihrer Reihenfolge und rhetorischen Wucht bewahrt.
theological_decisions:
- issue: Verhältnis des „Buches der Zucht“ zum „Buch des Lebens“
  choice: Als zwei sprachlich unterschiedene Bücher wiedergegeben
  alternative: Das erste Buch als bloße Umschreibung oder Unterabteilung des Buches des Lebens verstehen
  rationale: Der Ge’ez-Text stellt beide Bezeichnungen nebeneinander; ihre genaue Beziehung wird nicht dogmatisch festgelegt.
- issue: Ziel des Ausschlusses
  choice: „in das, was zum Untergang bestimmt ist“
  alternative: Ein bestimmtes „Buch des Untergangs“ ergänzen
  rationale: Das elliptische Ge’ez wird nicht durch ein im Wortlaut fehlendes Substantiv vereindeutigt.
- issue: Singular und Plural im Gerichtssatz
  choice: Der Wechsel von „er/sein“ zu „ihr Gericht“ bleibt erhalten
  alternative: Den gesamten Satz auf den einzelnen Verfluchten angleichen
  rationale: Die überlieferte beziehungsweise textkritisch rekonstruierte Lesart bezeichnet „ihr Gericht“; eine stillschweigende Harmonisierung würde die Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzführung. Archaisierende Wörter werden vermieden, außer wo „Zucht“ die unsichere Fachbedeutung des Quellbegriffs knapper und genauer offenhält. Die lange Schlussreihe bleibt aus rhetorischen Gründen ungekürzt.
