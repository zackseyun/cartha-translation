  text: And my heart has rejoiced concerning the birthright, that you did not do violence concerning it. May the LORD bless you
translation:
  language: de
  text: Und mein Herz hat sich über das Erstgeburtsrecht gefreut, dass du seinetwegen keine Gewalt ausgeübt hast. Der HERR segne dich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃን
  choice: Erstgeburtsrecht
  rationale: Der Zusammenhang und die englische Prüfschicht weisen auf das dem Erstgeborenen zustehende Recht; „Erstgeburtsrecht“ ist dafür die natürliche und präzise deutsche Bezeichnung.
- source_word: ፁገ
  choice: Gewalt
  rationale: Gibt den Sinn eines gewaltsamen Vorgehens wieder, ohne die Art oder das Ausmaß der Gewalt näher festzulegen.
- source_word: ኢትግበር
  choice: du … nicht ausgeübt hast
  rationale: Die Form ist aktiv und in der 2. Person Singular; deshalb bleibt Esau ausdrücklich das handelnde Subjekt und wird keine Passivkonstruktion verwendet.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die übliche würdevolle Wiedergabe der Gottesbezeichnung; ein Zusatz wie „der Höchste“ steht nicht im Ausgangstext.
theological_decisions:
- issue: Gewalt im Zusammenhang mit dem Erstgeburtsrecht
  choice: weil du seinetwegen keine Gewalt ausgeübt hast
  alternative: dass seinetwegen keine Gewalt geschah
  rationale: Die aktive Verbform mit einem Subjekt in der 2. Person Singular spricht deutlich dafür, Esau direkt als Handelnden anzureden. Die kausale Verbindung „weil“ ist im Deutschen natürlich und passt zum Grund der Freude.
- issue: Objekt des abschließenden Segens
  choice: Der HERR segne dich
  alternative: Der HERR segne
  rationale: Der direkte Anredezusammenhang und die wahrscheinliche beziehungsweise kontextuell mitverstandene Objektbeziehung stützen „dich“; da die Formfrage nicht völlig sicher ist, wird die knappere Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich freuen“ ist natürlicher als eine passive Wendung wie „mein Herz wurde erfreut“. Die Formulierung bleibt nah am Ausgangstext und vermeidet konfessionelle Zusätze.
