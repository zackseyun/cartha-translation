  language: de
  text: 'Und er sagte: »Diesen größeren Anteil gebe ich dem Mann, der zuerst geboren wurde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘንተ
  choice: diesen
  rationale: Das Demonstrativpronomen wird ausdrücklich wiedergegeben und bezieht sich auf den zugewiesenen Anteil.
- source_word: እሁብ
  choice: gebe ich
  rationale: Gibt die Verbform im natürlichen deutschen Präsens wieder.
- source_word: ዕበየ
  choice: größeren Anteil
  rationale: Der Komparativ bezeichnet eine größere Zuteilung; »Anteil« ergänzt im Deutschen den aus dem Zusammenhang erschließbaren Gegenstand idiomatisch.
- source_word: ለብእሲ
  choice: dem Mann
  rationale: Gibt die männliche Personenbezeichnung ausdrücklich wieder.
- source_word: ቀደመ ተወልደ
  choice: der zuerst geboren wurde
  rationale: Bewahrt die relative Umschreibung und die zeitliche Priorität der Geburt, ohne sie zum Titel »Erstgeborener« zu verdichten.
