lexical_decisions:
- source_word: ብእሲ
  choice: Mann
  rationale: Das Substantiv bezeichnet hier einen einzelnen Menschen männlichen Geschlechts; »Mann« wahrt den konkreten Bezug des Textes.
- source_word: ዘይገብር፡ ጽድቀ
  choice: der Gerechtigkeit übt
  rationale: Die Verbindung aus »tun/üben« und »Gerechtigkeit« wird idiomatisch und zugleich quellennah wiedergegeben.
- source_word: ዘርኦ
  choice: seine Nachkommen
  rationale: Wörtliches »Same« bezeichnet in diesem Zusammenhang die Nachkommenschaft; »Nachkommen« ist im modernen Deutsch klar und natürlich.
- source_word: እስከ፡ ለዓለም
  choice: in Ewigkeit
  rationale: Die Zeitformel drückt unbegrenzte Dauer aus; die traditionelle Wendung bleibt verständlich und würdevoll.
- source_word: ወፈጸመ
  choice: Und er hörte auf
  rationale: Im Zusammenhang markiert das Verb den Abschluss der unmittelbar folgenden Handlungen des Gebietens und Segnens.
- source_word: ይኤዝዞሙ
  choice: ihnen Gebote zu geben
  rationale: Das Verb bedeutet befehlen bzw. anweisen; die nominale Wendung passt natürlich zur Infinitivkonstruktion.
- source_word: ኅቡረ
  choice: gemeinsam
  rationale: Gibt das gemeinschaftliche Essen und Trinken knapp und idiomatisch wieder.
- source_word: በቅድሜሁ
  choice: vor ihm
  rationale: Bewahrt die räumliche beziehungsweise personale Perspektive des Ausgangstextes, ohne sie näher auszudeuten.
theological_decisions:
- issue: Verhältnis von gerechtem Handeln und dauerhaftem Segen
  choice: »der Gerechtigkeit übt« bleibt als schlichte Charakterisierung stehen
  alternative: eine Aussage über Verdienst, Rechtfertigung oder Heilsbedingung ausdrücklich formulieren
  rationale: Der Vers erläutert das theologische Verhältnis nicht; eine konfessionelle oder systematische Deutung wäre ein Zusatz.
- issue: Bedeutung von »seine Nachkommen in Ewigkeit«
  choice: Die zeitlich weitreichende Aussage wird ohne Einschränkung wiedergegeben
  alternative: »für alle Generationen« oder eine auf das irdische Leben begrenzte Umschreibung
  rationale: Die offene Reichweite der Quellformulierung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die geezische Satzstruktur. Der Vers beginnt und endet als Satzfragment, weil der bereitgestellte Quellenausschnitt sowohl den Abschluss des vorausgehenden Satzes als auch das anschließende »denn« enthält; diese Kapitelversgrenzen werden nicht künstlich geglättet.
