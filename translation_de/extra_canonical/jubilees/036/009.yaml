  verdict: revise
  source_fidelity: 'Die zentrale Aussage und der Bezug von „in seine Hand“ sind im Entwurf grundsätzlich richtig erfasst: Im Kontext bezeichnet die Hand die des Bruders, gegen den Böses geplant wird. „Verschwinden“ für das Schicksal der Nachkommenschaft ist jedoch zu unbestimmt und schwächt die ausdrückliche Ausrottungs-/Auslöschungsaussage des ge''ezischen Verbs ab.'
  naturalness: Der Mahnspruch ist verständlich und angemessen feierlich. „So erkennt von jetzt an“ klingt im heutigen Deutsch weniger idiomatisch als „dann sollt ihr von jetzt an wissen“. Die explizite Formulierung „in die Hand seines Bruders“ ist klarer als das etwas steife „in dessen Hand“.
  terminology: „Böses planen“, „Land der Lebenden“ und „Nachkommen“ sind angemessen. „Ausgelöscht werden“ gibt die angekündigte Tilgung der Nachkommenschaft unter dem Himmel genauer wieder als „verschwinden“.
