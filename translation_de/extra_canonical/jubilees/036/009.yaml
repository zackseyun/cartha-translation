base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: de
  text: 'Doch wenn einer von euch Böses gegen seinen Bruder plant, dann sollt ihr von jetzt an wissen: Jeder, der Böses gegen seinen Bruder plant, wird in die Hand seines Bruders fallen; er wird aus dem Land der Lebenden getilgt werden, und seine Nachkommen werden unter dem Himmel ausgelöscht werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀሠሠ / የኀሥሥ
  choice: Böses … plant
  rationale: Das Verb bezeichnet hier ein gegen den Bruder gerichtetes Trachten oder Vorhaben. „Plant“ gibt diesen bewussten Vorsatz in natürlichem modernem Deutsch wieder.
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: wird in dessen Hand fallen
  rationale: Die Wendung bedeutet, in die Gewalt beziehungsweise Verfügung eines anderen zu geraten. „Dessen“ bezieht sich im Kontext am ehesten auf den Bruder, wahrt aber die knappe pronominale Form des Ge'ez.
- source_word: ይሤር፡ እምድረ፡ ሕያዋን
  choice: wird aus dem Land der Lebenden getilgt werden
  rationale: Die feierliche Wendung des Ausgangstextes wird bewahrt; „getilgt“ vermittelt das Entfernen beziehungsweise Ausrotten aus dem Bereich der Lebenden.
- source_word: ዘርኡኒ
  choice: auch seine Nachkommen
  rationale: Wörtlich „auch sein Same“; im Zusammenhang ist die fortbestehende Nachkommenschaft gemeint. „Nachkommen“ ist im heutigen Deutsch klar und würdig.
- source_word: ይትሐጐል
  choice: werden … verschwinden
  rationale: Das Verb kann zugrunde gehen, verloren sein oder verschwinden bezeichnen. „Verschwinden“ verbindet sich natürlich mit „unter dem Himmel“, ohne die Aussage unnötig zu präzisieren.
theological_decisions:
- issue: Bezug des Pronomens in „in seine Hand fallen“
  choice: „in dessen Hand“ mit Bezug auf den Bruder, ergänzt durch eine textkritisch-sachliche Fußnote
  alternative: „in seine eigene Hand“ mit Bezug auf denjenigen, der Böses plant
  rationale: Der unmittelbare Kontext legt nahe, dass der Übeltäter in die Gewalt des Bruders fällt, gegen den er Böses plant. Da die pronominale Form des Ge'ez für sich genommen knapp ist und die ältere Wiedergabe anders verstanden werden konnte, wird die Alternative offengelegt.
- issue: Schicksal der Nachkommenschaft
  choice: „werden unter dem Himmel verschwinden“
  alternative: „werden unter dem Himmel ausgelöscht werden“
  rationale: Die gewählte Formulierung bewahrt die umfassende Gerichtsaussage, ohne dem Verb eine stärker aktive Vernichtungsnuance aufzuzwingen, als lexikalisch nötig ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem Mahn- und Gerichtston. Die Satzstruktur folgt dem Ge'ez eng, wird aber durch Doppelpunkt und klare Bezüge idiomatisch gegliedert.
