    rationale: Die Formulierung kann bloßes Verschwinden oder Fortgehen nahelegen. Der Ausgangstext kündigt dagegen die Vernichtung bzw. Auslöschung der Nachkommenschaft an.
  - severity: low
    issue: „so erkennt von jetzt an“
    rationale: Die pluralische Aufforderung ist semantisch möglich, aber „dann sollt ihr von jetzt an wissen“ ist idiomatischer und bewahrt den direkten, feierlichen Imperativ.
  - severity: low
    issue: Fußnote stellt „in seine eigene Hand“ als gleichrangig mögliche Lesart dar
    rationale: Die ge'ezische Pronominalform ist knapp, doch der unmittelbare Kontext bestimmt den Bruder als Bezug. Die alternative Deutung ist im Deutschen zudem missverständlich und sollte nicht ohne Not als Auslegungsoption hervorgehoben werden.
