base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: de
  text: Und an jenem Tag teilte er seinen ganzen Besitz unter ihnen auf. Dem Mann, der zuerst geboren worden war, gab er den größeren Anteil, dazu den Turm[a] und alles, was ihn umgab, sowie alles, was Abraham am Eidbrunnen erworben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Turm“ könnte ein bestimmtes Bauwerk des Anwesens gemeint sein, das zu diesem Erbteil gehörte. Die knappe Aufzählung des Erbes beruht möglicherweise auf einem schwer verständlichen Text.
    reason: cultural_note
lexical_decisions:
- source_word: ጥሪተ (ṭəritä)
  choice: Besitz
  rationale: Das ausdrückliche Substantiv bezeichnet Besitz, Eigentum oder Vermögen; „seinen ganzen Besitz“ gibt die Wendung natürlich und vollständig wieder.
- source_word: ዕበየ (ʿəbäyä)
  choice: den größeren Anteil
  rationale: Im Zusammenhang der Aufteilung bezeichnet das Wort die größere Zuweisung; „Anteil“ wird für klares, idiomatisches Deutsch ergänzt.
- source_word: ለብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: dem Mann, der zuerst geboren worden war
  rationale: Die Wiedergabe bewahrt sowohl das ausdrücklich genannte „Mann“ als auch die umschreibende Formulierung „zuerst geboren“, ohne sie stillschweigend zum rechtlich stärker geprägten Titel „Erstgeborener“ zu verdichten.
- source_word: ማኅፈደ (maḥfada)
  choice: Turm
  rationale: Die überlieferte Lesart wird formal als „Turm“ wiedergegeben; da die knappe Besitzliste textlich beziehungsweise sachlich schwierig ist, erläutert eine Fußnote die Unsicherheit.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Eidbrunnen
  rationale: Die Bestandteile „Brunnen“ und „Eid/Schwur“ werden in der etablierten deutschen Ortsbezeichnung transparent als Kompositum wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge der Besitzverteilung zu verändern. Die wiederholten Verknüpfungen des Ge'ez werden im Deutschen durch „dazu“ und „sowie“ natürlich gegliedert; die sachliche Unsicherheit bei „Turm“ bleibt durch die Fußnote sichtbar.
