  yaml_path: translation/extra_canonical/jubilees/036/018.yaml
  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: de
  text: Es herrschte Frieden unter ihnen. Dann gingen sie von ihm hinaus, ruhten an jenem Tag aus und schliefen. Auch Isaak schlief an jenem Tag voller Freude auf seinem Bett; dann schlief er den ewigen Schlaf und starb im Alter von 180 Jahren. Er vollendete 25 Jahrwochen und fünf Jahre.[a] Seine beiden Söhne begruben ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25 Jahrwochen entsprechen 175 Jahren; zusammen mit den fünf weiteren Jahren ergeben sich die zuvor genannten 180 Jahre.
    reason: Die kalendarische Altersangabe des Ausgangstextes wird für heutige Leser erläutert.
lexical_decisions:
- source_word: ዐርዮ
  choice: Frieden
  rationale: Das Wort bezeichnet Frieden bzw. Eintracht; „Frieden“ gibt den Sinn knapp und natürlich wieder.
- source_word: ንዋመ፡ ዘለዓለም
  choice: den ewigen Schlaf
  rationale: Die wörtliche Metapher des Ausgangstextes wird bewahrt und nicht erklärend durch „Tod“ ersetzt.
- source_word: ሱባዔ
  choice: Jahrwochen
  rationale: Im chronologischen Sprachgebrauch des Jubiläenbuches sind Wochen von je sieben Jahren gemeint; „Jahrwochen“ ist im Deutschen verständlich und präzise.
- source_word: ውሉዱ
  choice: seine Söhne
  rationale: Der Ausgangstext nennt hier nur seine Söhne und fügt ihre Namen nicht hinzu.
theological_decisions:
- issue: Der Tod Isaaks als „ewiger Schlaf“
  choice: Die Schlafmetapher wird wörtlich beibehalten.
  alternative: „Er starb für immer“ oder eine dogmatische Deutung des Ausdrucks.
  rationale: Der Ausdruck ist eine bildhafte Todesbezeichnung. Die Übersetzung bewahrt seine mögliche theologische Spannung, ohne eine Aussage über den Zustand nach dem Tod hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „schlief“ bleibt erhalten, weil sie den Übergang vom gewöhnlichen Schlaf zum „ewigen Schlaf“ im Ausgangstext trägt. „An jenem Tag“ folgt በዛቲ ዕለት; die im englischen Konsultationstext stehende Formulierung „five years“ an dieser Stelle wird nicht übernommen, da sie dem überlieferten ge’ezischen Wortlaut widerspricht.
