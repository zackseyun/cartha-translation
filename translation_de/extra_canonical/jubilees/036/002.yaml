  naturalness: Die Sprache ist würdig und modernes Standarddeutsch. Eine Anpassung des Relativpronomens macht den Satz zugleich grammatisch eindeutig und natürlich.
  terminology: „Doppelhöhle“, „Hetiter“, „Begräbnisstätte“ und „ausgehoben“ sind angemessen. Die Wiederholung von „dort“ und des Bestattungsauftrags bleibt erhalten.
