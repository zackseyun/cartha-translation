  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: de
  text: Und begrabt mich nahe bei meinem Vater Abraham, in der Doppelhöhle auf dem Feld Efrons, des Hetiters, das Abraham dort als Begräbnisstätte erworben hat. Begrabt mich dort in dem Grab, das ich für mich selbst ausgehoben habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅሩበ
  choice: nahe bei
  rationale: Gibt die räumliche Nähe natürlich und genau wieder.
- source_word: ባዐት፡ ዘካዕበት
  choice: Doppelhöhle
  rationale: Wahrt die traditionelle und im Kontext sachlich passende Bezeichnung der Höhle von Machpela als Doppelhöhle.
- source_word: ኬጥያዊ
  choice: Hetiter
  rationale: Etablierte moderne deutsche Wiedergabe der ethnischen Bezeichnung.
- source_word: ዘአጥረየ
  choice: erworben hat
  rationale: Bezeichnet Abrahams rechtmäßigen Erwerb des Grundstücks, ohne die genaue Art des Erwerbsvorgangs unnötig auszubauen.
- source_word: ዘከረይኩ
  choice: das ich … ausgehoben habe
  rationale: Gibt die konkrete Anlage des eigenen Grabes wieder; „ausgehoben“ ist im Deutschen für ein Grab idiomatisch.
