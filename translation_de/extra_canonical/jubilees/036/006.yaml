  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: de
  text: Denkt, meine Söhne, an den HERRN, den Gott Abrahams, eures Vaters, und daran, wie auch ich ihn angebetetᵃ und ihm in Gerechtigkeit und Freude gedient habe, damit er euch mehre und eure Nachkommen zahlreich mache wie die Sterne am Himmel und euch im Land als Pflanzung der Gerechtigkeit einpflanze, die durch alle Generationen hindurch in Ewigkeit nicht ausgerissen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከርዎ
  choice: Denkt daran
  rationale: Der Imperativ im Plural fordert die Söhne zum bewussten Erinnern auf; die nachfolgenden Inhalte werden idiomatisch mit »an« und »daran, wie« angeschlossen.
- source_word: ለእግዚአብሔር
  choice: an den HERRN
  rationale: Die traditionelle Gottesbezeichnung wird in würdigem modernem Deutsch als »der HERR« wiedergegeben.
- source_word: አምላክየ
  choice: ich ihn angebetet
  rationale: Die überlieferte Form ist im Zusammenhang wahrscheinlich verderbt und wird entsprechend der weithin angenommenen Lesart mit der Bedeutung »ich betete ihn an« verstanden; dadurch bleibt sie von dem folgenden »diente« unterschieden.
- source_word: ወተቀነዩኩ፡ ሎቱ
  choice: und ihm … gedient habe
  rationale: Das Verb bezeichnet Dienst bzw. Unterordnung und wird direkt mit »dienen« wiedergegeben.
- source_word: ዘርአክሙ
  choice: eure Nachkommen
  rationale: Wörtlich »euer Same«; im Deutschen bezeichnet »Nachkommen« natürlich und eindeutig die genealogische Bedeutung.
- source_word: ተክለ፡ ጽድቅ
  choice: eine Pflanzung der Gerechtigkeit
  rationale: Bewahrt das pflanzliche Bild und die attributive theologische Wendung, ohne sie auf eine bestimmte Auslegung festzulegen.
- source_word: ዘኢይሤረዉ
  choice: die … nicht ausgerissen wird
  rationale: Das Bild des Entwurzelns bzw. Ausreißens wird passend zur vorausgehenden Pflanzung konkret erhalten.
theological_decisions:
- issue: Verhältnis von Anbetung und Dienst
  choice: 'beide Handlungen ausdrücklich wiedergeben: »angebetet und … gedient«'
  alternative: nur »mich ihm hingegeben« oder »ihm gedient«
  rationale: Die wahrscheinlich zu korrigierende erste Verbform und das folgende Dienstverb bezeichnen zwei unterscheidbare Handlungen; keine wird ausgelassen oder ineinander aufgelöst.
- issue: Zweck- oder Folgesinn von ከመ
  choice: »damit er euch mehre«
  alternative: »sodass er euch mehrte«
  rationale: Die Formulierung lässt den Dienst als auf Gottes segnendes Handeln ausgerichtet erscheinen und folgt dem naheliegenden finalen Sinn, ohne einen mechanischen Verdienstzusammenhang auszuformulieren.
- issue: Land oder Erde bei ምድር
  choice: »im Land«
  alternative: »auf der Erde«
  rationale: »Land« passt zum Motiv einer dauerhaft eingepflanzten Nachkommenschaft, während der äthiopische Ausdruck beide Bedeutungen zulässt; die Aussage wird nicht ausdrücklich auf die ganze Welt erweitert.
- issue: Dauerformel
  choice: »durch alle Generationen hindurch in Ewigkeit«
  alternative: »für alle Generationen für immer«
  rationale: Die doppelte Zeitangabe wird vollständig bewahrt und zugleich in natürliches, feierliches Deutsch gebracht.
translation_notes:
  register: Moderne, würdige Standardsprache mit biblischer Bildhaftigkeit. Die Anrede »meine Söhne« und die Parallelität der Verben bleiben erhalten; altertümliche Syntax und unnötige Fachsprache werden vermieden.
