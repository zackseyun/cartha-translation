  yaml_path: translation/extra_canonical/jubilees/036/005.yaml
  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: de
  text: 'Was die Götzen betrifft, so gebiete ich euch und ermahne euch: Verachtet sie, weist sie zurück und liebt sie nicht; denn sie sind voller Irrtum für die, die sie verehren und sich vor ihnen niederwerfen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖት
  choice: Götzen
  rationale: Bezeichnet Kultbilder beziehungsweise falsche Gottheiten; „Götzen“ ist im Deutschen prägnant und im religiösen Kontext allgemein verständlich.
- source_word: ትመንንምዎሙ
  choice: Verachtet sie
  rationale: Gibt die Aufforderung wieder, die Götzen geringzuachten beziehungsweise zu verschmähen.
- source_word: ተጸረርዎሙ
  choice: weist sie zurück
  rationale: Bewahrt den aktiven Sinn des Sich-Widersetzens, ohne ein im Deutschen unnatürlich hartes „seid ihnen Feind“ zu erzwingen.
- source_word: ስሕተት፡ ምሉአን
  choice: voller Irrtum
  rationale: Folgt der bildhaften Quellkonstruktion eng und lässt offen, ob der Irrtum den Götzen selbst oder ihrer Wirkung zugeschrieben wird.
- source_word: ይሰግዱ፡ ሎሙ
  choice: sich vor ihnen niederwerfen
  rationale: Gibt die körperliche Kultgeste konkreter wieder als das allgemeinere „anbeten“.
theological_decisions:
- issue: Bezug von „voller Irrtum“
  choice: „sie sind voller Irrtum für alle, die sie verehren“
  alternative: „alle, die sie verehren, sind völlig im Irrtum“
  rationale: Die gewählte Fassung erhält die grammatische Zuordnung zu den Götzen und die eigentümliche Spannung der Quelle, statt die Aussage eindeutig auf die Verehrer umzudeuten.
- issue: Unterscheidung zweier Kulthandlungen
  choice: „verehren und sich vor ihnen niederwerfen“
  alternative: „anbeten“ als zusammenfassende Wiedergabe
  rationale: Die beiden parallelen Verben der Quelle bleiben unterscheidbar; dadurch wird weder ihre mögliche Überlappung beseitigt noch eine besondere Kultlehre eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der einleitende Themenwechsel wird natürlich mit „Was … betrifft“ formuliert; die dreifache Mahnung und der parallele Schluss der Quelle bleiben erhalten.
