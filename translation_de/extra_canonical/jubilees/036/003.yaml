  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: de
  text: 'Und dies gebiete ich euch, meine Söhne: Übt Gerechtigkeit und Rechtschaffenheit auf der Erde, damit der HERR über euch alles kommen lässt, von dem der HERR gesagt hat, dass er es für Abraham und seine Nachkommen tun werde.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: Gerechtigkeit und Rechtschaffenheit
  rationale: Gibt das ethische Begriffspaar mit zwei geläufigen, würdevollen deutschen Substantiven wieder, ohne die nahe Bedeutungsverwandtschaft einzuebnen.
- source_word: በዲበ፡ ምድር
  choice: auf der Erde
  rationale: Natürliche deutsche Wiedergabe der lokalen Präpositionalfügung.
- source_word: ወለዘርኡ
  choice: und seinen Nachkommen
  rationale: Das kollektive »Same/Nachkommenschaft« wird im heutigen Deutsch natürlich als »Nachkommen« ausgedrückt.
- source_word: ያምጽእ ... ላዕሌክሙ
  choice: über euch ... kommen lässt
  rationale: Bewahrt die Bewegungs- und Zielvorstellung des äthiopischen Ausdrucks in idiomatischem Deutsch.
theological_decisions:
- issue: Beziehung zwischen dem gerechten Handeln der Söhne und der Erfüllung der göttlichen Zusage
  choice: damit der HERR ... kommen lässt
  alternative: sodass der HERR ... kommen lässt
  rationale: Die finale Aussage des Quelltexts wird bewahrt, ohne näher zu bestimmen, wie menschliches Handeln und Gottes Verheißung theologisch zusammenhängen.
- issue: Inhalt von Gottes Wort an Abraham und seine Nachkommen
  choice: was der HERR Abraham und seinen Nachkommen zu tun verheißen hat
  alternative: was der HERR gesagt hat, für Abraham und seine Nachkommen zu tun
  rationale: »Verheißen« gibt den zukunftsgerichteten Zusagecharakter natürlich wieder; Abraham und seine Nachkommen bleiben Begünstigte des angekündigten Handelns.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte väterliche Anrede »meine Söhne« und die Wiederholung des Gottesnamens bleiben erhalten.
