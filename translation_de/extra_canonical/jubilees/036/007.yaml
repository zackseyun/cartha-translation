base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: de
  text: Und nun lasse ich euch einen großen Eid schwören – denn es gibt keinen größeren Eid als diesen – bei dem herrlichen, ehrenvollen, großen, prächtigen, wunderbaren und mächtigen Namen dessen, der die Himmel und die Erde und alles zusammen[a] geschaffen hat, damit ihr zu denen gehört, die ihn fürchten und ihn anbeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Schöpfung“.'
    reason: Die Wendung kann als zusammenfassende Bezeichnung für alles Geschaffene verstanden werden; der Haupttext bildet jedoch das ausdrückliche „zusammen“ der Quelle ab.
lexical_decisions:
- source_word: አምሕለክሙ
  choice: lasse ich euch … schwören
  rationale: Das Kausativ bezeichnet, dass der Sprecher die Angeredeten einen Eid ablegen lässt; die deutsche Wendung ist natürlich und wahrt die aktive Veranlassung.
- source_word: በመሐላ፡ ዐቢይ
  choice: einen großen Eid
  rationale: Gibt Substantiv und Adjektiv unmittelbar und idiomatisch wieder.
- source_word: ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: herrlichen, ehrenvollen, großen, prächtigen, wunderbaren und mächtigen
  rationale: Die sechs Eigenschaften des Namens bleiben vollständig und in ihrer Reihung erhalten; „prächtig“ gibt ወስፉሕ im Kontext eines verherrlichten Namens natürlich wieder.
- source_word: ወኵሎ፡ ኅቡረ
  choice: und alles zusammen
  rationale: Bewahrt gegenüber der glättenden Paraphrase „die ganze Schöpfung“ ausdrücklich die im Ge’ez vorhandene Bedeutung „alles … zusammen“.
- source_word: ከመ፡ ትኩኑ
  choice: damit ihr zu denen gehört
  rationale: Gibt den finalen beziehungsweise resultativen Anschluss wieder, ohne ihn zu einer bloßen Zukunftsaussage zu verengen.
- source_word: ታመልከዎ
  choice: ihn anbeten
  rationale: Im religiösen Zusammenhang bezeichnet das Verb die kultische Verehrung beziehungsweise Anbetung.
theological_decisions:
- issue: Zweck oder Ergebnis der Eidesverpflichtung
  choice: damit ihr zu denen gehört
  alternative: sodass ihr diejenigen seid
  rationale: ከመ mit dem folgenden Verb lässt eine Zweck- beziehungsweise Ergebnisschattierung zu. „Damit“ wahrt den naheliegenden finalen Sinn, während „zu denen gehört“ im Deutschen natürlich ausdrückt, dass sie Gottesfürchtige und Anbeter sein sollen.
- issue: Umfang des Geschaffenen
  choice: alles zusammen
  alternative: die ganze Schöpfung
  rationale: Die formalere Wiedergabe hält die ausdrückliche Sammelbedeutung von ኅቡረ fest und vermeidet, ein abstraktes theologisches Kollektivsubstantiv in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange, feierliche Eidesformel und ihre asyndetisch wirkende Eigenschaftsreihe bleiben erhalten; Gedankenstriche gliedern den Satz, ohne seine rhetorische Einheit aufzulösen.
