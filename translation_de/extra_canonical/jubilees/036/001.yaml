  yaml_path: translation/extra_canonical/jubilees/036/001.yaml
  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: de
  text: 'Und im sechsten Jahr dieser Jahrwoche rief Isaak seine beiden Söhne Esau und Jakob zu sich, und sie kamen zu ihm. Er sagte zu ihnen: »Meine Söhne, ich gehe den Weg meiner Väter zum ewigen Haus, wo meine Väter sind.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት፡ ዘዝሱባዔ
  choice: Jahr dieser Jahrwoche
  rationale: Die Wendung bezeichnet im Jubiläenbuch ein Jahr innerhalb eines Siebenjahreszeitraums; »Jahrwoche« gibt diese kalendarische Einheit im Deutschen knapp und verständlich wieder.
- source_word: ጸውዐ
  choice: rief … zu sich
  rationale: Das Verb bedeutet »rufen«; der deutsche Zusatz »zu sich« ergibt sich natürlich aus dem folgenden Kommen zu Isaak.
- source_word: ውስተ፡ ፍኖተ፡ አበውየ
  choice: ich gehe den Weg meiner Väter
  rationale: Die bildhafte Rede vom Sterben wird formal bewahrt, ohne sie erklärend aufzulösen.
- source_word: ቤት፡ ዘለዓለም
  choice: zum ewigen Haus
  rationale: Die wörtliche Metapher »Haus der Ewigkeit« wird in natürlichem Deutsch als »ewiges Haus« wiedergegeben.
theological_decisions:
- issue: Metaphorische Bezeichnung von Tod und jenseitigem Aufenthaltsort
  choice: »den Weg meiner Väter zum ewigen Haus, wo meine Väter sind«
  alternative: »sterben und zu meinen Vätern versammelt werden«
  rationale: Die quellensprachlichen Bilder bleiben bestehen; eine explizite Deutung als Tod oder eine Harmonisierung mit biblischen Formeln würde die genuine Ausdrucksweise unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die wiederholte Bezeichnung »meine Väter« bleiben erhalten; die Satzführung wurde nur behutsam dem natürlichen Deutschen angepasst.
