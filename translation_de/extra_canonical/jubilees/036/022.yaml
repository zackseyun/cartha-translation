  text: to the left of the grave of Sarah, his father’s mother. And all her sons and his sons came to mourn Leah his wife with him and to comfort him for her, because he was grieving for her.
translation:
  language: de
  text: links vom Grab Saras, der Mutter seines Vaters. Und alle ihre Söhne und seine Söhne kamen, um mit ihm um seine Frau Lea zu trauern und ihn ihretwegen zu trösten, denn er trauerte um sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፀጋመ፡ ለመቃብረ፡
  choice: links vom Grab
  rationale: ፀጋም bezeichnet ausdrücklich die linke Seite; die räumliche Angabe wird daher nicht zum allgemeineren „an der Seite“ abgeschwächt.
- source_word: ይብክይዋ፡
  choice: um … zu trauern
  rationale: Das Verb bezeichnet hier das beweinende Trauern um die verstorbene Lea; idiomatisches Deutsch verlangt „um jemanden trauern“.
- source_word: ይናዝዝዎ፡
  choice: ihn … zu trösten
  rationale: Gibt die auf den trauernden Mann gerichtete Handlung natürlich und präzise wieder.
- source_word: ሀሎ፡ ይሳቀዮ፡
  choice: denn er trauerte um sie
  rationale: Der Zusammenhang beschreibt seinen leidvollen Trauerzustand; die Formulierung wahrt den Bezug auf Lea und klingt im Deutschen natürlich.
