  text: And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.”
translation:
  language: de
  text: 'Und Isaak sagte: »An diesem Tag soll ein Segen auf euch ruhen, meine Söhne, und auf euren Nachkommen, weil ihr mir Ruhe verschafft habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታዕርፍ፡ ዲቤክሙ፡ በረከተ
  choice: soll ein Segen auf euch ruhen
  rationale: Die Formulierung bewahrt das Bild des auf jemandem ruhenden Segens und gibt den Wunsch- bzw. Segenscharakter der Verbform natürlich wieder.
- source_word: አውሉድየ
  choice: meine Söhne
  rationale: Die direkte Anrede bezeichnet hier Isaaks Söhne; die konkrete Wiedergabe ist im Deutschen natürlicher als das allgemeinere »meine Kinder«.
- source_word: ዘርእክሙ
  choice: euren Nachkommen
  rationale: Das Kollektivwort »Same« meint die künftige Nachkommenschaft; »Nachkommen« vermittelt dies in modernem Standarddeutsch ohne unnötige Archaisierung.
- source_word: አዕረፍክሙኒ
  choice: ihr mir Ruhe verschafft habt
  rationale: Die Wiedergabe erhält das Wortspiel mit dem zuvor genannten Ruhen des Segens und drückt zugleich aus, dass die Söhne Isaak zur Ruhe gebracht bzw. ihm Ruhe bereitet haben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Segensformel bleibt bildhaft und leicht gehoben; das lexikalische Echo zwischen »ruhen« und »Ruhe verschafft« wird bewusst bewahrt.
