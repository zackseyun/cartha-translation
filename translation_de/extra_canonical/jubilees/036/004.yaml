  yaml_path: translation/extra_canonical/jubilees/036/004.yaml
  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: de
  text: 'Und ihr, meine Söhne, seid untereinander liebevoll: Liebt eure Brüder, wie ein Mensch sein eigenes Leben liebt. Jeder suche für seinen Bruder, was ihm guttut. Handelt gemeinsam auf der Erde, und sie sollen einander lieben wie ihr eigenes Leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ihre eigene Seele“. Die Vorlage wechselt hier von der direkten Anrede („ihr“) zur dritten Person („sie“).'
    reason: Der auffällige Personenwechsel und der Bedeutungsumfang von ነፍስ werden offengelegt, ohne sie im Haupttext stillschweigend zu harmonisieren.
lexical_decisions:
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: Liebt eure Brüder
  rationale: Die geʿezische Form ist direkt an die Söhne in der zweiten Person Plural gerichtet. Der deutsche Imperativ gibt diese Anrede klar und natürlich wieder.
- source_word: ነፍሶ
  choice: sein eigenes Leben
  rationale: ነፍስ kann „Seele“, „Leben“ oder die eigene Person bezeichnen. In der Wendung über Selbstliebe ist „eigenes Leben“ im Deutschen verständlich und wahrt den lebensbezogenen Sinn.
- source_word: የኀሥሥ
  choice: suche
  rationale: Das Verb bezeichnet Suchen bzw. Trachten. „Jeder suche“ bildet den distributiven Sinn der Aussage idiomatisch ab.
- source_word: በዘ፡ ይሤኒ፡ ሎቱ
  choice: was ihm guttut
  rationale: Die Wendung meint das, was für den Bruder gut oder förderlich ist. „Was ihm guttut“ ist natürlich und bewahrt den Bezug auf dessen Wohl.
- source_word: በገቢረ፡ ኅቡረ
  choice: Handelt einmütig
  rationale: Wörtlich geht es um gemeinsames bzw. vereintes Handeln. „Einmütig handeln“ drückt die praktische Verbundenheit knapp und würdig aus.
theological_decisions:
- issue: Bedeutungsumfang von ነፍስ
  choice: Leben
  alternative: Seele / sich selbst
  rationale: Der Kontext fordert fürsorgliche Liebe nach dem Maß der Liebe zum eigenen Leben. Keine anthropologische Unterscheidung zwischen Seele und Leib soll in den Vers hineingelesen werden.
- issue: Wechsel von direkter Anrede zur dritten Person im Schlusssatz
  choice: Der Personenwechsel bleibt im Haupttext erhalten.
  alternative: „Liebt einander wie euch selbst“
  rationale: Die geʿezische Vorlage wechselt von der zweiten Person Plural zur dritten Person Plural. Eine Harmonisierung wäre flüssiger, würde aber eine echte formale Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihe partizipialer bzw. koordinierter geʿezischer Wendungen wird zur besseren Verständlichkeit in kurze Aufforderungen gegliedert. Der ungewöhnliche Personenwechsel am Versende bleibt bewusst stehen und wird erläutert.
