  naturalness: „Er teilte die Tage seiner Generation ein“ ist verständlicher und idiomatischer als „Er teilte die Tage seines Geschlechts“, ohne die schwierige Formulierung zu harmonisieren. „Nahe bei“ gibt die räumliche Angabe etwas expliziter und natürlich wieder.
  terminology: „Lea“, „Rebekka“, „Jahrwoche“, „Jubiläum“ und „Doppelhöhle“ sind angemessen. Die Fußnote zu Machpela sollte die traditionelle Identifikation als solche formulieren, da der Eigenname im Vers nicht steht.
