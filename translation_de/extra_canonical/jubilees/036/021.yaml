translation:
  language: de
  text: Er teilte die Tage seiner Generation ein.[a] Und seine Frau Lea starb im vierten Jahr der zweiten Jahrwoche des fünfundvierzigsten Jubiläums. Er begrub sie in der Doppelhöhle[b] nahe bei seiner Mutter Rebekka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch mit „die Tage seiner Geburt“ wiedergegeben werden. Sie gehört möglicherweise inhaltlich noch zum vorausgehenden Satz.
    reason: textual_ambiguity
  - marker: b
    text: Die „Doppelhöhle“ wird in der Genesisüberlieferung mit der Grabhöhle Machpela identifiziert.
    reason: cross_reference
lexical_decisions:
- source_word: ፈለጠ
  choice: Er teilte
  rationale: Das Verb bezeichnet hier das Trennen oder Teilen; die Wiedergabe folgt dem ge'ezischen Wortlaut statt der früheren Deutung „er forschte nach“.
- source_word: መዋዕለ፡ ልደቱ
  choice: die Tage seines Geschlechts
  rationale: Wörtlich etwa „die Tage seiner Geburt/Generation“. „Geschlecht“ bewahrt den möglichen Bezug auf Herkunft beziehungsweise Lebensgeneration, ohne die Wendung zu stark zu erklären.
- source_word: በዓተ፡ ዘእንተ፡ ክልኤ
  choice: Doppelhöhle
  rationale: Die Wendung bezeichnet die zweifache beziehungsweise doppelte Höhle und entspricht der aus der Genesisüberlieferung bekannten Grabhöhle.
- source_word: ቅሩበ
  choice: bei
  rationale: Natürliche deutsche Wiedergabe der räumlichen Nähe; „nahe bei“ wäre ebenfalls möglich.
theological_decisions:
- issue: Identifikation der Doppelhöhle
  choice: Im Haupttext bleibt die Bezeichnung „Doppelhöhle“ stehen; die Verbindung mit Machpela wird nur in einer Fußnote genannt.
  alternative: Direkt „Höhle von Machpela“ schreiben.
  rationale: Der ge'ezische Vers nennt hier nicht ausdrücklich den Eigennamen Machpela. Die traditionelle Identifikation ist hilfreich, darf aber den Wortlaut nicht ersetzen.
- issue: Unklare erste Satzhälfte
  choice: Die formale Wendung „die Tage seines Geschlechts“ bleibt erhalten.
  alternative: „die Tage seines Lebens“ oder „was seine Geburt betraf“.
  rationale: Der überlieferte Wortlaut und die Versabgrenzung sind schwierig. Eine glättende Deutung würde die echte Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologischen Fachbegriffe „Jahrwoche“ und „Jubiläum“ bleiben erhalten. Die schwer verständliche Anfangsklausel wird quellennah wiedergegeben und durch eine Fußnote erläutert.
