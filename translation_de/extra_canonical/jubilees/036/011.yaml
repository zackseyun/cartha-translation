  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: de
  text: Ich erkläre und bezeuge[a] euch, meine Söhne, gemäß dem Gericht[b], das über den Mann kommen wird, der seinem Bruder Böses antun will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lasse euch wissen.'
    reason: Die Kausativform kann sowohl feierliches Bezeugen als auch Kundtun beziehungsweise Hörenlassen bezeichnen.
  - marker: b
    text: 'Oder: dem Urteil.'
    reason: Der Quellbegriff kann je nach Zusammenhang sowohl den Vorgang des Gerichts als auch den ergehenden Urteilsspruch bezeichnen.
lexical_decisions:
- source_word: አነግር
  choice: ich erkläre
  rationale: Das Verb bezeichnet ein Sagen, Verkünden oder Erklären; „ich erkläre“ gibt hier die feierliche Mitteilung natürlich wieder.
- source_word: አስምዕ
  choice: bezeuge
  rationale: Die Kausativform zu „hören“ kann „hören lassen/kundtun“ bedeuten; in der feierlichen, mahnenden Verbindung mit dem ersten Verb trägt „bezeuge“ den rechtlichen beziehungsweise bundeshaften Nachdruck besser.
- source_word: በከመ፡ ኵነኔ
  choice: gemäß dem Gericht
  rationale: Bewahrt ausdrücklich die durch በከመ angezeigte Beziehung „gemäß/entsprechend“ und macht das Gericht nicht einfach zum direkten Objekt der Verkündigung.
- source_word: ሕሡመ
  choice: Böses
  rationale: Gibt den moralisch wertenden Sinn direkt wieder, ohne ihn auf bloßen Schaden einzuengen.
- source_word: ይፈቅድ
  choice: will
  rationale: Drückt Absicht oder Wollen idiomatisch aus; „begehrt“ wäre im heutigen Deutsch unnötig markiert.
theological_decisions:
- issue: Art und Bezug des kommenden Gerichts
  choice: „gemäß dem Gericht, das über den Mann kommen wird“
  alternative: „das Gericht, das über den Mann kommen wird“ als direktes Objekt von „erkläre“
  rationale: Die Präpositionalfügung በከመ፡ ኵነኔ wird beibehalten. So wird nicht stillschweigend entschieden, dass Isaak lediglich den Inhalt des Gerichts verkündet; vielmehr spricht und bezeugt er in Übereinstimmung mit diesem Gericht.
- issue: Charakter der beabsichtigten Tat
  choice: „seinem Bruder Böses antun“
  alternative: „seinem Bruder Schaden zufügen“
  rationale: „Böses“ wahrt die moralische Breite des Quellbegriffs und vermeidet eine Verengung auf materiellen oder körperlichen Schaden.
translation_notes:
  register: Feierlich-mahnender, zugleich gut verständlicher Standarddeutsch-Stil. Die etwas markierte Wendung „gemäß dem Gericht“ folgt bewusst der ausdrücklichen Struktur des ge’ezischen Textes; die Satzspannung und der rechtliche Ton werden nicht geglättet.
