  yaml_path: translation/extra_canonical/jubilees/036/020.yaml
  text: But Jacob dwelt on Mount Hebron, in the tower of the land of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commandments as they were revealed,
translation:
  language: de
  text: Jakob aber wohnte auf dem Berg Hebron, im Turm im Land, in dem sein Vorfahr Abraham als Fremder gelebt hatte.[a] Er diente dem HERRN von ganzem Herzen und nach den Geboten, wie sie offenbart worden waren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „im Turm des Landes des Fremdlingsaufenthalts seines Vaters Abraham“. „Vater“ bezeichnet hier Abraham als Vorfahren.'
    reason: Die dicht gefügte Genitivkonstruktion des äthiopischen Textes lässt sich im Deutschen verschieden gliedern. Die Anmerkung dokumentiert den Wortlaut und erläutert die weitere, vorfahrbezogene Bedeutung von „Vater“.
lexical_decisions:
- source_word: ኀደረ
  choice: wohnte
  rationale: Das Verb bezeichnet hier das Wohnen bzw. Verweilen an einem Ort; „wohnte“ ist im Deutschen natürlich und kontextgerecht.
- source_word: ማኅደድ
  choice: Turm
  rationale: Die überlieferte Bedeutung wird entsprechend der Quellenausgabe als „Turm“ wiedergegeben.
- source_word: ፍልሰተ
  choice: als Fremder gelebt hatte
  rationale: Die Wendung gibt den Aufenthalt Abrahams als Fremder verständlich wieder, ohne daraus einen dauerhaften Besitz oder eine bloße Reise zu machen.
- source_word: አምላከ፡ ለእግዚአብሔር
  choice: diente dem HERRN
  rationale: Im Kontext bezeichnet die Form die religiöse Verehrung bzw. den Dienst für den Herrn; „diente“ ist würdig und schließt Anbetung ein.
- source_word: ትእዛዛት
  choice: Geboten
  rationale: Der Plural bezeichnet verbindliche göttliche Weisungen; „Gebote“ bewahrt den formellen und religiösen Charakter.
- source_word: ያስተርኢ
  choice: offenbart worden waren
  rationale: Die passive Form wird als Offenbarwerden bzw. Offenbartwerden verstanden; diese Wiedergabe ist idiomatisch und wahrt den theologischen Bezug.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: HERR
  alternative: Herr
  rationale: Die traditionelle Kapitälchenschreibung kennzeichnet die Gottesbezeichnung würdig, ohne eine zusätzliche konfessionelle Deutung einzuführen.
- issue: Art von Jakobs Gottesverehrung
  choice: diente dem HERRN
  alternative: betete den HERRN an
  rationale: „Diente“ hält den weiteren Bedeutungsumfang religiöser Verehrung offen und beschränkt die Aussage nicht auf einen einzelnen Akt der Anbetung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzschlussinterpunktion bleibt als Komma stehen, weil der überlieferte Vers syntaktisch in die folgende Einheit weiterführt.
