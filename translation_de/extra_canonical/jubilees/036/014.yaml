  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: de
  text: 'Und Esau sagte: „Ich habe es Jakob verkauft und Jakob das Erstgeburtsrecht gegeben. Es soll ihm gegeben werden, und ich habe dazu nichts zu sagen, denn es gehört ihm.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ
  choice: Ich habe es Jakob verkauft
  rationale: Gibt das perfektische Verb und den Empfänger direkt wieder; das Objekt bleibt wie im Ausgangstext durch ein Pronomen bezeichnet.
- source_word: ልህቃነ
  choice: Erstgeburtsrecht
  rationale: Bezeichnet hier das mit der Erstgeburt verbundene Vorrecht; „Erstgeburtsrecht“ ist die natürliche und kontextgerechte deutsche Entsprechung.
- source_word: ይትወሀብ፡ ሎቱ
  choice: Es soll ihm gegeben werden
  rationale: Bewahrt die passive Form und den auffordernden beziehungsweise zustimmenden Sinn, ohne die Aussage als bereits vollzogene Besitzübertragung umzuformulieren.
- source_word: አልቦየ፡ ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: ich habe dazu nichts zu sagen
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Aussage, dass Esau kein Wort hat, das er darüber sagen könnte.
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: denn es gehört ihm
  rationale: Gibt die Begründung und die prädikative Zugehörigkeitsaussage klar und knapp wieder.
theological_decisions:
- issue: Reichweite von Esaus Anerkennung der Übertragung
  choice: Die Aussage wird als Anerkennung wiedergegeben, dass das Erstgeburtsrecht Jakob gehört.
  alternative: Die Formulierung könnte stärker als umfassender Verzicht Esaus auf jeden weiteren Anspruch ausgelegt werden.
  rationale: Der Text begründet Esaus Schweigen mit der Zugehörigkeit zu Jakob, formuliert aber keine weitergehende Lehre über sämtliche damit verbundenen Verheißungen oder Ansprüche.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Namens Jakob bleibt erhalten, während „ich habe dazu nichts zu sagen“ die semitisch geprägte Wendung idiomatisch und ohne inhaltliche Erweiterung wiedergibt.
