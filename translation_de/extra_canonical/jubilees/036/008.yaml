  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: de
  text: Jeder von euch soll seine Brüder mit Barmherzigkeit und Gerechtigkeit lieben, und niemand soll von nun an und für immer, solange ihr lebt, Böses gegen seinen Bruder im Sinn haben, damit ihr bei allem, was ihr tut, Gelingen habt und ihr nicht zugrunde geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅዋሁ
  choice: seine Brüder
  rationale: Die Form ist hier pluralisch; der Plural wird gegenüber dem später folgenden Singular እኁሁ ausdrücklich bewahrt.
- source_word: በምሕረት፡ ወበጽድቅ
  choice: mit Barmherzigkeit und Gerechtigkeit
  rationale: Gibt beide ethischen Leitbegriffe parallel und ohne konfessionelle Zuspitzung wieder.
- source_word: ወኢይፈቅድ፡ ብእሲ፡ እኩየ
  choice: und niemand soll … Böses … beabsichtigen
  rationale: ይፈቅድ bezeichnet Wollen, Begehren oder Beabsichtigen; „beabsichtigen“ passt im Deutschen natürlich zur Wendung „Böses gegen“ und bewahrt den inneren Vorsatz.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትክሙ
  choice: solange ihr lebt
  rationale: Natürliche deutsche Wiedergabe von „alle Tage eures Lebens“ ohne Bedeutungsverlust.
- source_word: ትሠርሑ፡ በኵሉ፡ ምግባሪክሙ
  choice: bei allem, was ihr tut, Gelingen habt
  rationale: Die Konstruktion verbindet das Wohlergehen beziehungsweise Gelingen mit der Gesamtheit ihrer Taten; die Formulierung ist idiomatisch und hält den Handlungsbezug fest.
- source_word: ወኢትትሐጐሉ
  choice: und nicht zugrunde geht
  rationale: Gibt den negativen Ausgang kräftig, aber allgemein wieder; die mögliche Nuance des Scheiterns wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Reichweite von Barmherzigkeit und Gerechtigkeit
  choice: Beide Begriffe beschreiben die Weise der brüderlichen Liebe.
  alternative: Die Begriffe als eigenständige Tugenden oder göttliche Eigenschaften deuten.
  rationale: Die Präpositionen binden beide Ausdrücke unmittelbar an das Lieben; eine weitergehende dogmatische Einordnung wäre nicht vom Satz erzwungen.
- issue: Verheißung von Gelingen und Bewahrung
  choice: 'Als Ziel- beziehungsweise Folgesatz formuliert: „damit ihr … Gelingen habt und nicht zugrunde geht“.'
  alternative: Als uneingeschränkte Garantie materiellen Erfolgs verstehen.
  rationale: Der Text nennt Gelingen bei den Taten und das Nicht-Zugrundegehen, bestimmt aber weder die Art des Gelingens noch einen materiellen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Folge von distributivem Singular („Jeder“) und pluralischer Anrede („ihr“) wird wie in der Quelle bewahrt. „Brüder“ bleibt als konkrete Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung erhalten; eine inklusive Ausweitung auf „Geschwister“ wäre interpretierend.
