id: JUB.37.4
reference: Jubilees 37:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: charles_1895
  language: Geez
  text: '1. ወበዕለተ፡ ሞተ፡ ይስሐቅ፡ አቡሁ፡" ለያዕቆብ፡ ወለዔሳው፡ ሰምዑ፡ ውሉደ፡ ዔሳው፡ ከመ፡

    2. ወሀቦ፡" ይስሐቅ፡ ልህቃነ፡" ለያዕቆብ፡ ወልዱ፡ ዘይንእስ፡ ወተምዑ፡ ፈድፋደ። ወተጋአዙ፡ ምስለ፡ አቡሆሙ፡ እንዘ፡ ይብሉ፡ በእንተ፡ ምንት፡ *እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ፡ ወእንዘ፡

    3. ያዕቆብ፡ ይንእስ፡" ለያዕቆብ፡" ወሀቦ፡ አቡከ፡ ልህቃነ፡" ወኪያከ፡ ኀደገ። ወይቤሎሙ፡ እስመ፡ አነ፡ ሤጥኩ፡ ቅድመ፡" ልደትየ፡ ለያዕቆብ፡ በኅዳጥ፡ ጸብሐ፡ ብርስን፡ ወበዕለተ፡ ፈነወኒ፡ አቡየ፡ *እንፀው፡ ወአስግር፡" ወአምጽእ፡" ሎቱ፡ ከመ፡ ይብላዕ፡ ወይባርከኒ፡ መጽአ፡ በተጠብቦት፡" ወአብአ፡ ለአቡየ፡ መብልዐ፡ ወመስተ፡ ወባረኮ፡ አቡየ፡ ወኪያየ፡ ረሰየኒ፡ ታሕተ፡ እዴሁ። ወይእዜኒ፡ እምሐለኩ፡ አቡከ፡ ኪያየ፡ ወኪያሁ፡ ከመ፡ ኢነትኃሠሥ፡ በእኩይ፡ *አሐዱ፡ ላዕለ፡ እኁሁ፡

    5. ወከመ፡ ነሀሉ፡ በተፋቅሮ፡ ወበሰላም፡ ብእሲ፡ ምስለ፡ እኁሁ፡ ወኢናማስን፡ ፍኖዊነ። ወይቤልዎ፡ ኢንሰምዐከ፡ ለገቢረ፡ ምስሌሁ፡ ሰላመ፡ እስመ፡ ኃይለ፡ ዚአነ፡ ይጸንዕ፡ እምኃይሉ፡ ወንሕነ፡ ንጸንዕ፡ እምኔሁ፤ ሖውር፡ ላዕሌሁ፡ ወንቅትሎ፡ ወናሐጕሎ፡ ውሉዱ፡ ወለእመ፡ ኢተሐውር፡

    6. ምስሌነ፡ ለከሂ፡ ናሐስም። ወይእዜኒ፡ ስምዐነ፡ ወንፈኑ፡ ውስተ፡ አራም፡ ወውስተ፡ ፊልስ ጥኤም። ወውስተ፡ ሞአብ፡ ወውስተ፡ አሞን፡ ወንኅረይ፡ ለርእስነ፡ ኅሩያነ፡ ሰብአ፡ እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል፡ ወንሖር፡ ላዕሌሁ፡ ወንትቃተል፡ ምስሌሁ፡ ወንሠርዎ፡ እምድር፡ እንበለ፡ የአዝዝ፡

    7. ኃይለ። ወይቤሎሙ፡ አቡሆሙ፡ ኢትሖሩ፡ ወኢትግበሩ፡ ምስሌሁ፡ ፀብአ፡ ከመ፡ ኢትደቁ፡

    8. ቅድሜሁ። ወይቤልዎ፡ ዝኒ፡ *ከመ፡ ገብርከ፡ ዘእምውርዝትከ፡ እስከ፡ ዛቲ፡ ዕለት፡ ወአንተ፡

    9. ታበውአ፡ ክሳደከ፡ ታሕተ፡ አርዑቱ፡ *ኢንሰምዕ፡ ንሕነሰ፡ *ዘንተ፡ ነገረ። ወፈነዉ፡ ውስተ፡ አራም፡ ወኀበ፡ አዱራም፡ ኀበ፡ ዐርከ፡ አቡሆሙ፡ ወተዐሰቡ፡ ምስሌሆሙ፡ ፲፻ መስተባእሳነ፡

    10. ዕደወ፡ መስተቃትላነ፡ ኅሩያነ። ወመጽኡ፡ ኀቤሆሙ፡ እምነ፡ ሞአብ፡ ወእምኀበ፡ ውሉደ፡ አሞን፡ እለ፡ ተዐሰቡ፡ ፲፻ ኅሩያነ፡ ወእምነ፡ ፍልስጥኤም፡ ፲፻ ኅሩያነ፡ መስተቃትላነ፡ ወእምኤዶም፡ ወእምነ፡ ሖሬዎን፡ ፲፻ ኅሩያነ፡ መስተባእሳነ፡ ወእምነ፡ ኬጢዎን፡ ዕደወ፡

    11. ጽኑዓነ፡ መስተቃትላነ። ወይቤልዎ፡ ለአቡሆሙ፡ ፃእ፡ *ምስሌሆሙ፡ ወምርሖሙ፡ ወእመ፡

    12. አኮ፡ ንቀትለከ። ወመልአ፡ መዐተ፡ ወቍጥዓ፡ በጊዜ፡ ርእየ፡ ውሉዶ፡ *ከመ፡ ይትኤገልዎ፡ ከመ፡

    13. ይሖር፡ ቅድመ፡ ይምርሖሙ፡ ኀበ፡ ያዕቆብ፡ እኁሁ። ወእምዝ፡ ተዘከረ፡ ኵሎ፡ እኩየ፡ *እንተ፡ ሀለወት፡ ውስተ፡ ልቡ፡ ኅብእተ፡ ላዕለ፡ ያዕቆብ፡ እኁሁ፡ ወኢተዘከረ፡ መሐላ፡ ዘመሐለ፡ ለአቡሁ፡ ወለእመ፡ ከመ፡ ኢይትኃሠሥ፡ ኵሎ፡ እኩየ፡ *ኵሎ፡ መዋዕሊሁ፡ *ላዕሌሁ፡ ለያዕቆብ፡

