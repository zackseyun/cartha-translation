base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: de
  text: 'Er ging voraus, um sie zu seinem Bruder Jakob zu führen. Dann erinnerte er sich an all das Böse, das in seinem Herzen gegen seinen Bruder Jakob verborgen gewesen war. An den Schwur aber, den er seinem Vater und seiner Mutter geleistet hatte, erinnerte er sich nicht: Er hatte geschworen, niemals danach zu trachten, Jakob etwas Böses zuzufügen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: Er ging voraus, um sie … zu führen
  rationale: Gibt sowohl die Bewegung nach vorn als auch den Zweck des Vorausgehens natürlich und vollständig wieder.
- source_word: ተዘከረ
  choice: erinnerte er sich
  rationale: Bewahrt die ausdrückliche Aussage des Textes, dass das zuvor im Herzen verborgene Böse wieder ins Bewusstsein trat.
- source_word: ኵሎ፡ እኩየ
  choice: all das Böse / nichts Böses
  rationale: Die beiden Vorkommen werden ihrem jeweiligen Satzbau entsprechend idiomatisch wiedergegeben; der umfassende Sinn von ኵሎ bleibt erhalten.
- source_word: ኅብእተ፡ ላዕለ፡ ያዕቆብ፡ እኁሁ
  choice: das in seinem Herzen gegen seinen Bruder Jakob verborgen gewesen war
  rationale: Bewahrt den Gedanken eines innerlich verborgenen, gegen Jakob gerichteten Bösen und die erste ausdrückliche Bezeichnung Jakobs als Bruder.
- source_word: ኢይትኃሠሥ
  choice: nichts Böses anzutun
  rationale: Das Verb kann das Suchen beziehungsweise Trachten nach Bösem ausdrücken; im Deutschen gibt „Böses antun“ den gemeinten feindseligen Vorsatz natürlich wieder.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: sein Leben lang
  rationale: Idiomatiche Wiedergabe von „alle seine Tage“ ohne Bedeutungsverlust.
- source_word: ላዕሌሁ፡ ለያዕቆብ
  choice: Jakob
  rationale: Am Versende steht nur „gegen Jakob“; „seinem Bruder“ wird dort daher nicht erneut ergänzt.
theological_decisions:
- issue: Verhältnis zwischen der Erinnerung an das Böse und dem Vergessen des Schwurs
  choice: 'Der Kontrast bleibt ausdrücklich stehen: Er erinnert sich an das Böse, denkt aber nicht mehr an den Schwur.'
  alternative: Das Erinnern als bloßes Planen oder Erwägen des Bösen umdeuten.
  rationale: Der Quelltext verwendet dieselbe Erinnerungswurzel positiv und negiert; seine moralische und erzählerische Spannung soll nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die etwas schwerfällige wörtliche Wendung „er suchte nicht nach irgendeinem Bösen gegen Jakob“ wurde idiomatisch als „Jakob … nichts Böses anzutun“ formuliert. Keine Fußnoten sind erforderlich, da die belegten Lesarten im Haupttext ohne sachlichen Verlust wiedergegeben werden können.
