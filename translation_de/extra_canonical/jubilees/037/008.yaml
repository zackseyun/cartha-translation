lexical_decisions:
- source_word: ወይቤልዎ
  choice: Doch sie sagten zu ihm
  rationale: Die Form bezeichnet ein Sagen zu ihm; »doch« gibt den hier adversativ verstandenen Anschluss von ወ wieder, ohne den Satz zu überladen.
- source_word: ከመ፡ ገብርከ
  choice: So hast du … gehandelt
  rationale: ከመ bezeichnet hier die Art und Weise; das Perfekt ገብርከ wird natürlich und zugleich eng am Wortlaut mit »hast du gehandelt« wiedergegeben.
- source_word: ዘእምውርዝትከ
  choice: von deiner Jugend an
  rationale: Die Wendung bezeichnet den Ausgangspunkt in seiner Jugend und wird idiomatisch mit »von … an« ausgedrückt.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: bis zu diesem Tag
  rationale: Bewahrt die konkrete zeitliche Formulierung des Ge'ez.
- source_word: ወአንተ
  choice: und du
  rationale: Die abschließenden Wörter werden ausdrücklich beibehalten, obwohl der Satz im vorliegenden Versfragment unvollständig weiterführt.
