  terminology: „Nacken“, „Joch“, „Wort“, „Freund ihres Vaters“ und „Krieger zum Kampf“ sind registergerecht und quellentreu. „Krieger“ gibt die kämpferische Personenbezeichnung präziser wieder als das bloße „Männer“.
