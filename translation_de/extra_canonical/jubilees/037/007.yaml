  text: And their father said to them, "Do not go, and do not make war with him, lest you fall."
translation:
  language: de
  text: 'Und ihr Vater sagte zu ihnen: »Geht nicht hin und führt keinen Krieg gegen ihn, damit ihr nicht fallt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሖሩ
  choice: Geht nicht hin
  rationale: Gibt das verneinte Verb des Gehens natürlich wieder; »hin« entspricht dem im Zusammenhang vorausgesetzten Ziel.
- source_word: ኢትግበሩ፡ ምስሌሁ፡ ፀብአ
  choice: führt keinen Krieg gegen ihn
  rationale: Die Verbindung bezeichnet wörtlich das Führen beziehungsweise Machen von Krieg mit ihm; im Deutschen ist »Krieg gegen ihn führen« idiomatisch und macht die feindliche Bedeutung klar.
- source_word: ከመ፡ ኢትደቁ
  choice: damit ihr nicht fallt
  rationale: Bewahrt die negative Zweck- oder Befürchtungskonstruktion, ohne einen im Text nicht ausdrücklich genannten Zusatz wie »vor ihm« einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Warnung und die Wiederholung der beiden Verbote bleiben erhalten; keine Ergänzung eines nicht klar belegten »vor ihm«.
