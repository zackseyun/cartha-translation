  text: 'Throughout all this[14], Jacob did not know that they were coming against him to kill him. And he was mourning for Leah his wife until they came near to the tower with four thousand men, warriors and chosen fighters. And they sent to him honorable men, saying, "Behold, your brother has come against you to fight you, with four hundred men girded with the sword, and they carry shields and weapons of war." For they loved Jacob more than Esau, and they told him that Jacob was a gracious and merciful man, more than Esau. Then Jacob was alarmed when they came near to the tower, and he shut the gates of the tower and stood on the battlements and spoke with his brother Esau and said, "The comfort for which you have come is a fine comfort, to comfort me concerning my wife who has died. Is this the oath that you swore to your father and your mother? Again, before they have died, you have broken the oath, and at the moment you swore to your father you were condemned." And at that time Esau
    answered and said to him, "There is no righteous oath for the sons of men, nor for the beasts of the earth; for whatever they swear, they scheme one against another with evil[14], so that each may kill his enemy and foe. And you hate me and my children forever, and there is no observing brotherhood with you. Hear this word that I declare to you: if the boar can change its skin and its bristles become soft like wool, or if horns grow on its head like the horns of a stag or a sheep, then I will keep brotherhood with you. And if the breasts separated from their mother should return and suckle again, then I will be reconciled to you as a brother. And if wolves make peace with lambs so as not to devour or oppress them, and if their hearts are good toward them, then there will be peace in my heart toward you. And if the lion becomes the friend of the ox and is bound together with it under one yoke and plows with it and makes peace with it, then I will make peace with you. And when the raven
    becomes white like the raza-bird, then I will know that I have loved you and will make peace with you. Be destroyed, and may your sons be destroyed, and let there be no peace for you." And when Jacob saw that he was evil in his heart toward him, and with all his soul intended to kill him, and that he came raging like a wild boar rushing upon the spear that pierces and kills it and does not turn back from it, then he said to his own and to his servants that they should attack him and all his companions.'
translation:
  language: de
  text: 'Während all dessen wusste Jakob nicht, dass sie gegen ihn heranzogen, um ihn zu töten. Er trauerte um seine Frau Lea, bis sie sich mit viertausend Mann dem Turm näherten – Kriegern und ausgewählten Kämpfern.[a] Da sandten sie angesehene Männer zu ihm und ließen ihm sagen: »Sieh, dein Bruder ist gegen dich herangezogen, um mit dir zu kämpfen. Bei ihm sind vierhundert Männer, die mit Schwertern gegürtet sind und Schilde und Kriegsgerät tragen.« Denn sie liebten Jakob mehr als Esau und teilten ihm mit, dass Jakob ein gütiger und barmherziger Mann sei, mehr als Esau.


    Da geriet Jakob in Angst, als sie sich dem Turm näherten. Er verschloss die Tore des Turms, stellte sich auf die Zinnen und redete mit seinem Bruder Esau. Er sagte: »Das ist ja ein schöner Trost, zu dem du gekommen bist, um mich über den Tod meiner Frau zu trösten! Ist das der Eid, den du deinem Vater und deiner Mutter geschworen hast? Noch ehe sie gestorben sind, hast du den Eid schon wieder gebrochen,[b] und in dem Augenblick, als du deinem Vater schworst, hast du dich selbst dem Urteil unterworfen.«


    Darauf antwortete ihm Esau: »Für die Menschenkinder gibt es ebenso wenig einen verlässlichen Eid wie für die Tiere der Erde. Jeden Morgen sinnt einer gegen den anderen auf Böses, um seinen Feind und Widersacher zu töten. Auch du hasst mich und meine Kinder für immer; mit dir lässt sich keine Brüderschaft halten. Höre, was ich dir sage: Wenn der Eber seine Haut wechseln kann und seine Borsten weich wie Wolle werden, oder wenn ihm Hörner wachsen wie einem Hirsch oder einem Schaf, dann werde ich mit dir Brüderschaft halten. Wenn die Brüste, nachdem sie von ihrer Mutter getrennt wurden, wieder zu ihr zurückkehren und saugen, dann werde ich mich dir als Bruder wieder zuwenden. Wenn Wölfe mit Lämmern Frieden schließen, sodass sie diese weder fressen noch bedrängen, und wenn ihr Herz ihnen Gutes will, dann wird auch in meinem Herzen Frieden mit dir sein. Wenn der Löwe zum Freund des Rindes wird, mit ihm unter dasselbe Joch gespannt wird, mit ihm pflügt und Frieden mit ihm hält, dann werde auch
    ich mit dir Frieden schließen. Und wenn der Rabe weiß wird wie der Raza-Vogel,[c] dann werde ich erkennen, dass ich dich liebe, und mit dir Frieden schließen. Du sollst ausgerottet werden, und deine Söhne sollen ausgerottet werden! Für dich soll es keinen Frieden geben.«


    Als Jakob sah, dass Esaus Herz voller Bosheit gegen ihn war und dass er ihn von ganzer Seele töten wollte, und als er sah, wie Esau wütend heranstürmte wie ein Wildschwein, das auf den Speer losrennt, der es durchbohrt und tötet, ohne vor ihm zurückzuweichen, da befahl er seinen Angehörigen und seinen Knechten, Esau und alle seine Begleiter anzugreifen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge'ezische Text nennt hier viertausend Mann, während die unmittelbar folgende Botschaft von vierhundert Männern spricht. Die abweichenden Zahlen werden nicht einander angeglichen.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich ist auch möglich: „Noch ehe sie sterben, hast du den Eid wiederum gebrochen.“'
    reason: lexical_alternative
  - marker: c
    text: „Raza“ gibt einen unsicheren Vogelnamen im Ge'ez wieder. Gemeint ist offenbar ein auffallend weißer Vogel; die genaue Art lässt sich nicht sicher bestimmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፵፻ ብእሲ
  choice: viertausend Mann
  rationale: Die ge'ezische Zahlenschreibung ፵፻ bezeichnet hier vierzig mal hundert, also 4.000; die abweichende spätere Angabe von 400 wird nicht harmonisiert.
- source_word: መስተቃላን፡ ወመስተበአላን፡ ኀሩያን
  choice: Krieger und ausgewählte Kämpfer
  rationale: Gibt die militärische Charakterisierung und das Element der Auswahl in natürlichem Deutsch wieder.
- source_word: ጸጋዊ፡ ወመሓሪ
  choice: gütiger und barmherziger
  rationale: Bewahrt die beiden positiven Wesensbezeichnungen, ohne sie konfessionell aufzuladen.
- source_word: ማኅፈድ
  choice: Turm
  rationale: Der Kontext mit Toren und Zinnen weist auf eine befestigte Turmanlage; die traditionelle Wiedergabe 'Turm' bleibt verständlich.
- source_word: ራዛ
  choice: Raza-Vogel
  rationale: Der zoologische Bezug ist unsicher; eine Transliteration vermeidet eine unbelegte Identifizierung.
- source_word: ተአኃ
  choice: Brüderschaft halten
  rationale: Das Wortfeld bezeichnet hier das Aufrechterhalten brüderlicher Verbundenheit, nicht bloß ein allgemeines Friedensverhältnis.
theological_decisions:
- issue: Geltung von Esaus Aussage über Eide
  choice: als Aussage Esaus in ihrer pauschalen und zynischen Form bewahrt
  alternative: als allgemeine Lehre über die Ungültigkeit menschlicher Eide formulieren
  rationale: Der Kontext kennzeichnet die Worte als Esaus Rechtfertigung seiner Feindschaft; die Übersetzung macht daraus keine normative theologische Aussage.
- issue: Jakobs Aussage über die Verurteilung beim Schwören
  choice: „hast du dich selbst dem Urteil unterworfen“
  alternative: „warst du verdammt“
  rationale: Die Formulierung bewahrt den forensischen Ernst des ge'ezischen Verbs, ohne die genaue Art oder Endgültigkeit des Urteils dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die direkte Rede behält ihren scharfen, bildreichen und bewusst unerbittlichen Charakter. Archaisierende Wendungen wurden vermieden, während „Sieh“, „Zinnen“, „Brüderschaft“ und die parallelen Wenn-dann-Sätze den feierlichen antiken Ton erhalten.
