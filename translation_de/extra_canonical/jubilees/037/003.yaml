base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: de
  text: '„Jakob ist jünger; dein Vater hat Jakob das Erstgeburtsrecht gegeben und dich verlassen.“ Da sagte Esau zu ihnen: „Denn ich habe mein Erstgeburtsrecht für eine kleine Schüssel Linsengericht an Jakob verkauft. Und an dem Tag, als mein Vater mich aussandte, um zu jagen und ihm Wild zu bringen, damit er esse und mich segne, kam Jakob mit List und brachte meinem Vater Speise und Trank. Mein Vater segnete ihn und stellte mich unter seine Hand. Und nun hat euer Vater mich und ihn schwören lassen, einander nichts Böses zu wollen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: Erstgeburtsrecht
  rationale: Der Kontext des Verkaufs an Jakob und die Parallele zur Genesisüberlieferung weisen auf das mit dem Erstgeborenen verbundene Vorrecht; die gewählte Formulierung ist im Deutschen klar und nicht redundant.
- source_word: በኅዳጥ፡ ጸብሐ፡ ብርስን
  choice: für eine kleine Schüssel Linsengericht
  rationale: Gibt Menge, Gefäß beziehungsweise Portion und den Inhalt idiomatisch wieder, ohne den geringen Gegenwert abzuschwächen.
- source_word: በተጠብቦት
  choice: mit List
  rationale: Bewahrt die negative Wertung des planvollen beziehungsweise listigen Vorgehens, ohne zusätzliche moralische Deutung.
- source_word: ታሕተ፡ እዴሁ
  choice: unter seine Hand
  rationale: Erhält das konkrete Herrschaftsbild und den Sinn der Unterordnung statt es frei zu paraphrasieren.
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: dass keiner … Böses antun soll
  rationale: Natürliches modernes Deutsch für das gegenseitige Nicht-Suchen beziehungsweise Nicht-Trachten nach Bösem.
theological_decisions:
- issue: Bezeichnung Isaaks im letzten Satz
  choice: euer Vater
  alternative: unser Vater
  rationale: Der überlieferte Text hat die Form „euer Vater“. Diese auffällige Perspektive wird trotz Esaus direkter Rede nicht stillschweigend harmonisiert.
- issue: Art der Unterordnung Esaus
  choice: stellte mich unter seine Hand
  alternative: unterwarf mich ihm
  rationale: Die bildhafte und theologisch offene Aussage wird formal bewahrt; so wird nicht näher bestimmt, welche konkrete Herrschaftsordnung gemeint ist.
- issue: Gegenseitigkeit des Schwurs
  choice: dass keiner seinem Bruder Böses antun soll
  alternative: dass wir nicht Böses suchen, einer gegen seinen Bruder
  rationale: Die reziproke Aussage bleibt erhalten, wird aber in verständliches Deutsch gebracht, ohne sie auf bloße Gedanken, Absichten oder Gewalt einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt deutlich gegliedert; erzählerische Wiederholungen des Ausgangstextes werden weitgehend bewahrt. Das ungewöhnliche „euer Vater“ bleibt quellennah stehen. Keine konfessionelle Ausdeutung wurde ergänzt.
