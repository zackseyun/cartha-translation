base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: de
  text: '„… mit uns, dann werden wir auch dir Böses antun. Nun hört uns zu: Lasst uns nach Aram, nach Philistäa, nach Moab und nach Ammon senden. Lasst uns für uns kampfwillige Männer auswählen. Dann wollen wir gegen ihn ziehen, mit ihm kämpfen und ihn aus dem Land vertilgen, bevor er stark wird.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሐስም
  choice: werden wir … Gewalt antun
  rationale: Gibt die feindselige Schädigung deutlich wieder, ohne sie auf eine bestimmte Form der Gewalt einzuengen.
- source_word: ወንኅረይ
  choice: Wir wollen … aussuchen
  rationale: Entspricht dem Gedanken des Auswählens und erhält die auffordernde Verbfolge.
- source_word: ኅሩያነ፡ ሰብአ
  choice: ausgewählte Männer
  rationale: Natürliche deutsche Wiedergabe für eigens ausgewählte Männer.
- source_word: እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል
  choice: die zum Kampf drängen
  rationale: Bewahrt die aktive Kampfbereitschaft der Männer; „Kampf“ passt im Zusammenhang besser als das im Deutschen enger wirkende „Töten“.
- source_word: ወንሠርዎ፡ እምድር
  choice: und ihn aus dem Land ausrotten
  rationale: Erhält das Bild vollständiger Beseitigung aus dem Land, das im zugrunde liegenden Verb anklingt.
- source_word: እንበለ፡ የአዝዝ
  choice: bevor er stark wird
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Wendung und des Starkwerdens.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Vers setzt mit einem Satzfragment aus dem vorhergehenden Zusammenhang ein; die Auslassungspunkte machen diesen überlieferten Anschluss sichtbar, ohne fehlenden Inhalt zu ergänzen. Die geografischen Bezeichnungen sind für heutige Leser idiomatisch differenziert wiedergegeben: Aram und Moab als Ländernamen, Philistia als „Philisterland“ und Ammon als dessen Bevölkerung, die Ammoniter.'
