revisions:
- from: '„… mit uns, werden wir auch dir Gewalt antun. Nun hört auf uns: Lasst uns nach Aram, ins Philisterland, nach Moab und zu den Ammonitern senden. Wir wollen für uns ausgewählte Männer aussuchen, die zum Kampf drängen. Dann wollen wir gegen ihn ziehen, mit ihm kämpfen und ihn aus dem Land ausrotten, bevor er stark wird.“'
  to: '„… mit uns, dann werden wir auch dir Böses antun. Nun hört uns zu: Lasst uns nach Aram, nach Philistäa, nach Moab und nach Ammon senden. Lasst uns für uns kampfwillige Männer auswählen. Dann wollen wir gegen ihn ziehen, mit ihm kämpfen und ihn aus dem Land vertilgen, bevor er stark wird.“'
  rationale: Die Satzanfangsellipse bleibt als Anschluss an den vorangehenden Zusammenhang erhalten. „Dann“ macht die im deutschen Fragmentsatz sonst fehlende Folgerelation explizit, ohne Sachinhalt hinzuzufügen. Die Zielorte werden parallel als Länder behandelt, die Aufforderung zum Zuhören wird korrekt wiedergegeben, und die Begriffe für Auswahl, Kampfbereitschaft und Beseitigung werden quellennäher und idiomatischer formuliert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:52Z'
review_pass:
  verdict: revise
  source_fidelity: Die Abfolge der Aufforderungen sowie die geographischen Ziele werden im Entwurf im Wesentlichen getroffen. Die Wiedergabe von Ammon als „zu den Ammonitern“ verschiebt jedoch das im Quelltext gleichförmig als Zielgebiet gebrauchte Ortsnamenschema. „Gewalt antun“ verengt zudem die allgemeiner formulierte Ankündigung, ihnen Böses bzw. Schaden zuzufügen. Für ሠረወ ist „ausrotten“ bei einem Einzeltäter im heutigen Deutsch weniger präzise und stilistisch unnötig belastet; „aus dem Land vertilgen“ bewahrt die Tilgungs-/Beseitigungsintensität und die Ortsangabe.
  naturalness: „Nun hört auf uns“ bedeutet im modernen Deutsch eher „gehorcht uns“ als „hört uns zu“. Auch „Männer aussuchen, die zum Kampf drängen“ klingt unidiomatisch. Die Revision verwendet natürliche, weiterhin entschlossene Redeformen und erhält die wiederholte deliberative Satzfolge.
  terminology: Aram, Philistäa, Moab und Ammon werden einheitlich als historische Länder- bzw. Gebietsnamen wiedergegeben. „kampfwillige Männer“ gibt die Bereitschaft bzw. das Drängen zum Kampf wieder, ohne daraus Kampferfahrung zu machen.
  issues:
  - severity: medium
    issue: „zu den Ammonitern“ statt „nach Ammon“
    rationale: Das Ge'ez führt Aram, Philistia, Moab und Ammon parallel als Ziele mit derselben Präposition auf. Die Übersetzung sollte Ammon daher nicht als Volksgruppe umdeuten.
  - severity: medium
    issue: „Nun hört auf uns“
    rationale: Diese deutsche Formulierung bedeutet gewöhnlich „gehorcht uns“; der Quelltext fordert zum Zuhören auf.
  - severity: low
    issue: „Gewalt antun“ und „ausrotten“
    rationale: Ersteres ist enger als die allgemeine Schädigungsankündigung; letzteres ist für das Tilgen eines einzelnen Gegners im modernen Deutsch ungenau bzw. unnötig belastet.
  - severity: low
    issue: Unidiomatische Auswahl- und Kampfbereitschaftsformulierung
    rationale: „ausgewählte Männer aussuchen, die zum Kampf drängen“ ist redundant und nicht natürlich. Die Auswahlhandlung und Kampfbereitschaft lassen sich ohne Bedeutungsverlust klarer ausdrücken.
  revised_text: '„… mit uns, dann werden wir auch dir Böses antun. Nun hört uns zu: Lasst uns nach Aram, nach Philistäa, nach Moab und nach Ammon senden. Lasst uns für uns kampfwillige Männer auswählen. Dann wollen wir gegen ihn ziehen, mit ihm kämpfen und ihn aus dem Land vertilgen, bevor er stark wird.“'
