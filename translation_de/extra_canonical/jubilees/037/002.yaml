base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/002.yaml
  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: de
  text: 'Isaak hatte seinem jüngeren Sohn Jakob das Erstgeburtsrecht gegeben, und sie wurden überaus zornig. Sie stritten mit ihrem Vater und sagten: »Warum hat er Jakob, der jünger ist, das Erstgeburtsrecht gegeben, obwohl du der Ältere bist, und dich übergangen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: das Erstgeburtsrecht
  rationale: Der Ausdruck bezeichnet hier den mit dem Vorrang des Erstgeborenen verbundenen Rechtsanspruch. »Erstgeburtsrecht« ist im Deutschen prägnant, geläufig und passt zum erzählerischen Zusammenhang.
- source_word: ተምዑ፡ ፈድፋደ
  choice: wurden überaus zornig
  rationale: Die Verbindung drückt sehr starken Zorn aus; »überaus« gibt die emphatische Verstärkung würdig und verständlich wieder.
- source_word: ተጋአዙ
  choice: stritten
  rationale: Das Verb bezeichnet eine Auseinandersetzung oder einen Wortstreit. »Stritten mit ihrem Vater« ist natürliches modernes Deutsch, ohne die Gewalt der Szene zu überzeichnen.
- source_word: እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ
  choice: obwohl du der Ältere bist
  rationale: Die Formulierung richtet sich an den Vater der Sprecher und stellt dessen höheres Alter beziehungsweise seinen Erstgeborenenrang dem jüngeren Jakob gegenüber. Sie bedeutet nicht »während wir anwesend waren«.
theological_decisions:
- issue: Bezug der Pronomen in der direkten Rede
  choice: '»hat er … obwohl du … dich«: »er« bezeichnet Isaak, »du/dich« den Vater der Sprecher'
  alternative: Die Sprecher reden Isaak an und beziehen »wir/uns« auf sich selbst.
  rationale: Grammatik und Erzählzusammenhang weisen darauf, dass die Söhne mit ihrem Vater über die zuvor von Isaak getroffene Vergabe sprechen. Dadurch bleiben Geber und Angesprochener klar unterschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt lebendig und klar; »Erstgeburtsrecht« bewahrt den biblisch-rechtlichen Gehalt, ohne konfessionelle Deutung hinzuzufügen.
