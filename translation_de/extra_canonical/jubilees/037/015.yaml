base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/015.yaml
  text: Then Judah said to Jacob his father, saying to him, "Bend your bow, father, and send out your arrows and strike down the enemy and kill the adversary; and may you have strength, for we will not kill your brother, because he is such, and because he is your kinsman we will give him honor." Then Jacob bent his bow and sent forth an arrow and struck Esau his brother on his right breast and killed him. And again he sent an arrow and struck Adoran the Aramean on the left breast and drove him back and killed him. Then the sons of Jacob and their servants went out from the four sides of the tower. And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, on the south side of the tower, and they killed all whom they found before them, and not one of them escaped. And Levi and Dan and Asher went out on the east side of the tower, and fifty men with them, and they killed the warriors of Moab and Ammon. And Reuben and Issachar and Zebulun went out on the north side
    of the tower, and fifty men with them, and they killed the fighters of Philistia. And Simeon and Benjamin and Enoch the son of Reuben went out on the west side of the tower, and fifty men with them, and they killed of Edom and of the Horites four hundred strong and warlike men. And six hundred fled, and four of Esau’s sons fled with them, and they left their father lying slain, as he had fallen on the hill that is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir. But Jacob buried his brother in the hill that is in Adurim, and he returned to his house, and they comforted him there.
translation:
  language: de
  text: '[15] Da sagte Juda zu seinem Vater Jakob: »Spanne deinen Bogen, Vater, schieß deine Pfeile ab, strecke den Feind nieder und töte den Widersacher! Mögest du Kraft haben; denn wir werden deinen Bruder nicht töten, weil er es ist, und weil er dein Verwandter ist, wollen wir ihm Ehre erweisen.«


    Da spannte Jakob seinen Bogen, schoss einen Pfeil ab und traf seinen Bruder Esau in die rechte Brust und tötete ihn. Dann schoss er noch einen Pfeil ab und traf Adoran, den Aramäer, in die linke Brust; er trieb ihn zurück und tötete ihn.


    Darauf zogen die Söhne Jakobs und ihre Knechte von den vier Seiten des Turmes hinaus. Juda zog zuerst auf der Südseite des Turmes hinaus, mit ihm Naftali und Gad sowie fünfzig Knechte. Sie töteten alle, die ihnen entgegentraten; kein Einziger entkam ihnen. Levi, Dan und Ascher zogen auf der Ostseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten die Krieger Moabs und Ammons. Ruben, Issachar und Sebulon zogen auf der Nordseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten die Kämpfer der Philister. Simeon, Benjamin und Henoch, der Sohn Rubens, zogen auf der Westseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten vierhundert starke, kampferprobte Männer aus Edom und von den Horitern.


    Sechshundert Männer flohen, und mit ihnen flohen vier Söhne Esaus. Ihren Vater ließen sie erschlagen liegen, wie er auf dem Hügel in Adurim gefallen war. Die Söhne Jakobs verfolgten sie bis zum Gebirge Seïr. Jakob aber begrub seinen Bruder auf dem Hügel in Adurim. Dann kehrte er in sein Haus zurück, und sie versorgten sie dort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: Die Quellenzeile ist im Arbeitskorpus als Vers 38 bezeichnet, setzt jedoch dieselbe Erzähleinheit fort und wird hier als Jubiläen 37,15 wiedergegeben.
    reason: segmentation_note
  - marker: a
    text: 'Wörtlich: „und sie nährten/speisten sie dort“. Das Objekt ist in der überlieferten Form pluralisch; im erzählerischen Zusammenhang wird es in manchen Übersetzungen auf Jakob bezogen und als „sie trösteten ihn“ wiedergegeben.'
    reason: source_ambiguity
lexical_decisions:
- source_word: አግብርቲሆሙ / አግብርቲ
  choice: ihre Knechte
  rationale: Das Wort bezeichnet abhängige Diener beziehungsweise Sklaven. „Knechte“ bewahrt den historischen Abhängigkeitscharakter, ohne die Gruppe als bloß freiwillige Bedienstete erscheinen zu lassen.
- source_word: መስተቃትላነ / መስተባእሳነ
  choice: Krieger; Kämpfer; kampferprobt
  rationale: Die wechselnden ge’ezischen Kampfbezeichnungen werden im Deutschen kontextgerecht unterschieden, ohne einen technischen militärischen Rang einzuführen.
- source_word: ማኅፈድ
  choice: Turm
  rationale: Der Erzählzusammenhang beschreibt ein befestigtes Bauwerk mit vier Seiten; „Turm“ entspricht der überlieferten Deutung und ist im Deutschen klar.
