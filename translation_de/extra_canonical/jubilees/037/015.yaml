revisions:
- from: '[15] Da sagte Juda zu seinem Vater Jakob: »Spanne deinen Bogen, Vater, schieß deine Pfeile ab, strecke den Feind nieder und töte den Widersacher! Möge dir Kraft zuteilwerden; denn wir werden deinen Bruder töten, und du sollst ihn begraben. Weil er älter ist als du, werden wir ihm Ehre erweisen.«


    Da spannte Jakob seinen Bogen, schoss einen Pfeil ab und traf seinen Bruder Esau in die rechte Brust, sodass er starb. Dann schoss er noch einen Pfeil ab und traf Adoran, den Aramäer, in die linke Brust; er trieb ihn zurück und tötete ihn.


    Darauf zogen die Söhne Jakobs und ihre Knechte an den vier Seiten des Turmes hinaus. Juda zog zuerst an der Südseite des Turmes hinaus, mit ihm Naftali und Gad sowie fünfzig Knechte. Sie töteten alle, die ihnen entgegentraten; kein Einziger entkam ihnen. Levi, Dan und Ascher zogen an der Ostseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten die Krieger Moabs und Ammons. Ruben, Issachar und Sebulon zogen an der Nordseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten die Kämpfer der Philister. Simeon, Benjamin und Henoch, der Sohn Rubens, zogen an der Westseite des Turmes hinaus, und fünfzig Männer waren bei ihnen. Sie töteten vierhundert starke, kampferprobte Männer aus Edom und von den Horitern.


    Sechshundert Männer flohen, und mit ihnen flohen vier Söhne Esaus. Ihren Vater ließen sie erschlagen dort liegen, wo er auf dem Hügel bei Adurim gefallen war. Die Söhne Jakobs verfolgten sie bis zum Gebirge Seïr. Jakob aber begrub seinen Bruder auf dem Hügel bei Adurim. Dann kehrte er in sein Haus zurück, und dort versorgten sie ihn.[a]'
