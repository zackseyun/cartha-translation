  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: de
  text: Und aus Moab und von den Söhnen Ammons kamen tausend ausgewählte Männer zu ihnen, die angeworben worden waren; aus Philistäa tausend ausgewählte, kampftüchtige Männer; aus Edom und von den Horitern tausend ausgewählte, für den Kampf ausgebildete Männer; und von den Kittäern starke, kampftüchtige Männer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ
  choice: ausgewählte Männer
  rationale: Das wiederholte Wort bezeichnet Ausgewählte beziehungsweise Auserlesene; im militärischen Zusammenhang ist „ausgewählte Männer“ natürlich und genau.
- source_word: ተዐሰቡ
  choice: angeworben worden waren
  rationale: Die Form bezeichnet hier Personen, die gegen Entgelt angeworben wurden. Die passive Wiedergabe bewahrt den Bezug auf das moabitisch-ammonitische Aufgebot.
- source_word: መስተቃትላነ
  choice: kriegstüchtige Männer
  rationale: Das Wort beschreibt zum Kämpfen geeignete beziehungsweise kampffähige Männer. „Kriegstüchtig“ ist prägnant und dem gehobenen Erzählregister angemessen.
- source_word: መስተባእሳነ
  choice: kampferprobte Männer
  rationale: Der Ausdruck kennzeichnet Kämpfer beziehungsweise für den Kampf gerüstete Männer; „kampferprobt“ gibt die militärische Qualifikation natürlich wieder, ohne eine technische Ausbildungsform zu unterstellen.
- source_word: ዕደወ
  choice: starke Männer
  rationale: Im Kontext des Aufgebots bezeichnet der Ausdruck kräftige beziehungsweise starke Männer.
- source_word: ኬጢዎን
  choice: Kittäer
  rationale: Die traditionelle deutschsprachige Wiedergabe des ethnischen Namens Kittim wird als Personenbezeichnung verwendet.
