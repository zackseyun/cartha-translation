revisions:
- from: Und aus Moab und von den Söhnen Ammons kamen tausend ausgewählte Männer zu ihnen, die angeworben worden waren; aus Philistäa tausend ausgewählte, kriegstüchtige Männer; aus Edom und von den Horitern tausend ausgewählte, kampferprobte Männer; und von den Kittäern starke, kriegstüchtige Männer.
  to: Und aus Moab und von den Söhnen Ammons kamen tausend ausgewählte Männer zu ihnen, die angeworben worden waren; aus Philistäa tausend ausgewählte, kampftüchtige Männer; aus Edom und von den Horitern tausend ausgewählte, für den Kampf ausgebildete Männer; und von den Kittäern starke, kampftüchtige Männer.
  rationale: Die Revision vermeidet die nicht gedeckte Aussage, die edomitisch-horitischen Männer seien bereits kampferprobt gewesen, und ersetzt die modern markierte Bezeichnung „kriegstüchtig“ durch das natürliche, quellentreue „kampftüchtig“. Zahlen, Abfolge, Herkunftsgruppen und die begrenzte Aussage über die angeworbenen moabitisch-ammonitischen Männer bleiben unverändert.
