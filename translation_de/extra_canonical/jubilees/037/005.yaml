translation:
  language: de
  text: '»… und dass wir in Liebe und Frieden leben, jeder mit seinem Bruder, und unsere Wege nicht verderben.« Doch sie sagten zu ihm: »Wir werden nicht auf dich hören und Frieden mit ihm schließen; denn unsere Kraft ist größer als seine, und wir sind stärker als er. Zieh gegen ihn, dann wollen wir ihn töten und seine Söhne vernichten. Wenn du aber nicht ziehst, …«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሀሉ፡ በተፋቅሮ፡ ወበሰላም
  choice: dass wir in Liebe und Frieden leben
  rationale: Der jussivisch-subjunktivische Ausdruck wird im Deutschen natürlich als gemeinsames erstrebtes Verhalten wiedergegeben; »leben« erfasst hier den Zustand besser als ein schwerfälliges »uns befinden«.
- source_word: ብእሲ፡ ምስለ፡ እኁሁ
  choice: jeder mit seinem Bruder
  rationale: Gibt die distributive Formulierung »ein Mann mit seinem Bruder« in verständlichem, würdigem Deutsch wieder, ohne die geschwisterliche Bildsprache aufzulösen.
- source_word: ወኢናማስን፡ ፍኖዊነ
  choice: und unsere Wege nicht verderben
  rationale: Das Verb bezeichnet Verderben, Zerstören oder Zugrunderichten; der Plural »unsere Wege« bleibt entsprechend der Vorlage und als biblisches Bild für den Lebenswandel erhalten.
- source_word: ኢንሰምዐከ፡ ለገቢረ፡ ምስሌሁ፡ ሰላመ
  choice: Wir werden nicht auf dich hören und Frieden mit ihm schließen
  rationale: Die wörtliche Konstruktion »auf dich hören, Frieden mit ihm zu machen« wird in idiomatisches Deutsch überführt, ohne die Ablehnung des Friedensschlusses abzuschwächen.
- source_word: ኃይለ፡ ዚአነ፡ ይጸንዕ፡ እምኃይሉ፡ ወንሕነ፡ ንጸንዕ፡ እምኔሁ
  choice: unsere Kraft ist größer als seine, und wir sind stärker als er
  rationale: Die zweimalige Vergleichsaussage und die Wiederholung des Wortfelds »Stärke/Kraft« werden bewahrt.
- source_word: ሖውር፡ ላዕሌሁ
  choice: Zieh gegen ihn
  rationale: Der militärische Sinn von »gegen ihn hinauf-/losziehen« wird knapp und natürlich ausgedrückt.
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: und seine Söhne vernichten
  rationale: Das starke Vernichtungsverb wird nicht zu einem bloßen »besiegen« abgeschwächt; ውሉዱ bezeichnet hier seine männlichen Nachkommen bzw. Söhne.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Vers setzt mitten in einer Rede ein und bricht in der überlieferten Vorlage nach der Bedingung »Wenn du aber nicht ziehst« ab; Auslassungspunkte markieren beide fragmentarischen Grenzen, ohne den fehlenden Inhalt zu ergänzen.
