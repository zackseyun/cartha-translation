  terminology: »Liebe«, »Frieden«, »Kraft«, »stärker«, »töten« und »vernichten« sind semantisch angemessen. Die Wiederholung des Stärke-Wortfelds und die Pluralform »Wege« bleiben erhalten. Es sind keine theologisch strittigen Entscheidungen betroffen.
