base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: de
  text: 'Darum habe ich für dich Jahrwochen, Jahre und Jubeljahre festgesetzt: neunundvierzig Jubeljahre von den Tagen Adams bis zu diesem Tag. Noch eine Jahrwoche, zwei Jahre und vierzig Jahre bleiben, um die Gebote des HERRN kennenzulernen, bis sie in das Land Kanaan hinüberziehen und den Jordan westwärts überqueren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: Jahrwochen
  rationale: Die Wendung bezeichnet Siebenergruppen von Jahren. „Jahrwochen“ gibt den kalendarischen Fachbegriff knapp und verständlich wieder.
- source_word: ኢዮቤሌዎታት
  choice: Jubeljahre
  rationale: Der etablierte deutsche Ausdruck bewahrt den Bezug auf den Jubiläumszyklus von jeweils neunundvierzig Jahren.
- source_word: ሠራዕኩ
  choice: habe ich … festgesetzt
  rationale: Das Verb bezeichnet ein ordnendes beziehungsweise festsetzendes Handeln; „festgesetzt“ passt zum kalendarischen Zusammenhang.
- source_word: ለእእምሮ
  choice: um … kennenzulernen
  rationale: Der Ausdruck bezeichnet das Erlangen von Kenntnis. „Kennenlernen“ bleibt näher am Erkenntnisvorgang als eine stärker auslegende Formulierung wie „befolgen lernen“.
- source_word: የዐድዉ … ዐዲዎሙ
  choice: hinüberziehen und … überqueren
  rationale: Die Übersetzung erhält die doppelte Bewegungsformulierung und insbesondere die verbale Kraft des Gerundiums beim Jordan.
- source_word: ገጸ፡ ዐረቢሁ
  choice: nach Westen
  rationale: Die Richtungsangabe wird idiomatisch wiedergegeben, ohne den möglichen Bezug auf die Westseite des Jordan vollständig festzulegen.
theological_decisions:
- issue: Gottesname እግዚአብሔር
  choice: HERR
  alternative: Herr
  rationale: Die Kapitälchenkonvention kennzeichnet in deutscher Bibelsprache den Gottesnamen beziehungsweise dessen traditionelle Wiedergabe, ohne eine weitergehende dogmatische Deutung einzuführen.
- issue: Zweck der verbleibenden Zeit
  choice: um die Gebote des HERRN kennenzulernen
  alternative: um die Gebote des HERRN befolgen zu lernen
  rationale: Der Ausgangstext spricht ausdrücklich vom Erkennen beziehungsweise Kennenlernen; eine Ergänzung des Befolgens würde die Aussage interpretierend erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch-kalendarischer Terminologie. Die langen Zahlen- und Zeitangaben wurden durch einen Satzpunkt gegliedert, ohne ihre sachliche Abfolge zu verändern.
