  terminology: „Gesetz“ und „Sabbate“ sind für den religiös-rechtlichen Kontext angemessen. „Tage der Sabbate“ bewahrt bewusst die plurale und leicht ungewohnte Formulierung des Ausgangstextes, ohne sie auslegend zu vereinheitlichen.
