  yaml_path: translation/extra_canonical/jubilees/050/001.yaml
  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: de
  text: Und nach diesem Gesetz[a] machte ich dir die Tage der Sabbate in der Wüste des Sinai bekannt, die zwischen Elim und Sinai liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und danach machte ich dir in der Wüste des Sinai, die zwischen Elim und Sinai liegt, das Gesetz über die Tage der Sabbate bekannt.“'
    reason: Die ge’ezische Wortfolge lässt als weniger wahrscheinliche Alternative zu, „Gesetz“ mit „Tage der Sabbate“ zu verbinden statt mit dem vorausgehenden Abschnitt.
lexical_decisions:
- source_word: ሕገ
  choice: Gesetz
  rationale: 'Das Akkusativ-/Status-constructus-fähige Substantiv wird hier aufgrund der Wortstellung auf das vorhergehende Gesetz bezogen: „nach diesem Gesetz“. Die alternative syntaktische Zuordnung wird in der Fußnote bewahrt.'
- source_word: መዋዕለ፡ ሰንበታት
  choice: die Tage der Sabbate
  rationale: Die Wiedergabe erhält sowohl den Plural „Tage“ als auch den Plural „Sabbate“ und vermeidet eine Verengung auf einen einzelnen Sabbat.
- source_word: በገዳመ፡ ሲና
  choice: in der Wüste Sinai
  rationale: ገዳም bezeichnet hier die Wüste beziehungsweise Wildnis; die Wendung meint nicht den Berg Sinai.
- source_word: ምእከለ፡ ኤሎም፡ ወሲና
  choice: zwischen Elim und Sinai
  rationale: Die Ortsangabe wird unmittelbar und in der im Text überlieferten Namensform wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber quellentreue Ortsbezeichnung „Wüste Sinai … zwischen Elim und Sinai“ wurde nicht zu „Wüste Sin“ harmonisiert. Das Pronomen „dir“ folgt dem im Verb enthaltenen beziehungsweise kontextuell vorausgesetzten Adressaten.
