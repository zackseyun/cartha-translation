base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: de
  text: Und jeder Mensch, der an diesem Tag eine Arbeit verrichtet, eine Reise unternimmt oder sein Feld bestellt – sei es in seinem Haus oder an jedem Ort –, der ein Feuer entzündet, auf jedem Tier reitet, mit einem Schiff über das Meer fährt, irgendetwas schlägt oder tötet, ein Tier oder einen Vogel schlachtet, ein wildes Tier, einen Vogel oder einen Fisch fängt, fastet oder am Sabbattag Krieg führt —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: eine Arbeit
  rationale: Gibt den allgemeinen Begriff für Arbeit bzw. Tätigkeit in diesem Verbotskatalog natürlich und quellennah wieder.
- source_word: ይትቀነይ፡ ወፍረ
  choice: sein Feld bestellt
  rationale: Bezeichnet landwirtschaftliche Bearbeitung; „Feld“ entspricht dem konkreten Sinn genauer als das weiter gefasste „Bauernhof“.
- source_word: ያነድድ፡ እሳተ
  choice: ein Feuer entzündet
  rationale: Direkte und idiomatische Wiedergabe der Handlung des Feueranzündens.
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ
  choice: auf irgendeinem Tier reitet
  rationale: Der Ausdruck bezeichnet das Besteigen bzw. Reiten eines Tieres; die deutsche Form ist im Zusammenhang natürlich.
- source_word: ይነግድ፡ በሐመር፡ ባሕረ
  choice: mit einem Schiff über das Meer fährt
  rationale: Bewahrt Verkehrsmittel und Seeweg, ohne dem Verb unnötig die engere Bedeutung „Handel treiben“ aufzuzwingen.
- source_word: የሐርድ
  choice: schlachtet
  rationale: Gibt das gezielte Schlachten von Tier oder Vogel präzise wieder.
- source_word: አሰገረ
  choice: fängt
  rationale: Passt zu den aufgeführten Wildtieren, Vögeln und Fischen und gibt das Erbeuten bzw. Einfangen allgemein wieder.
- source_word: ይገብር፡ ጸብአ
  choice: Krieg führt
  rationale: Wörtlich und idiomatisch für das Ausüben bzw. Führen von Krieg.
theological_decisions:
- issue: Bezug des einleitenden Pronomens auf den Sabbat
  choice: an diesem Tag
  alternative: an ihm
  rationale: Der Bezug gilt dem Sabbattag aus dem Kontext. „An diesem Tag“ macht ihn im Deutschen verständlich, ohne den Umfang des Verbots zu verändern.
- issue: Fortlaufender Satz über die Versgrenze
  choice: Gedankenstrich am Versende beibehalten
  alternative: Satz mit einem Punkt abschließen
  rationale: Der Vers bildet einen Bedingungs- bzw. Relativsatz, dessen Folgerung offenbar im Anschluss folgt; ein Punkt würde die syntaktische und inhaltliche Spannung fälschlich auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Struktur und die wiederholten Alternativen des ge'ezischen Textes bleiben erkennbar, werden aber durch eine im Deutschen gut lesbare Relativsatzkonstruktion gebündelt. „Sabbattag“ wahrt den feierlich-rechtlichen Ton.
