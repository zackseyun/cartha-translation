  source_fidelity: Der Verbotskatalog ist vollständig und im Wesentlichen quellennah wiedergegeben. „an irgendeinem Ort“ gibt jedoch በኵሉ፡ መካን („an jedem Ort/überall“) zu unbestimmt wieder. Die Stellung der Ortsangabe unmittelbar nach „sein Feld bestellt“ kann zudem im Deutschen den sachwidrig engen Eindruck erwecken, das Feld werde im Haus bestellt; im Ausgangstext steht die Ortsangabe zwar an dieser Stelle, ihr genauer Skopus ist syntaktisch nicht völlig eindeutig.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Eine geringfügige Umstellung der Ortsangabe erhöht die Verständlichkeit, ohne die aufgezählte Struktur oder die offene syntaktische Fortsetzung über die Versgrenze aufzulösen.
  terminology: „Feld“, „entzündet“, „schlachtet“, „Sabbattag“ und „Krieg führt“ sind treffend. „jedem Tier“ ist für ኵሉ፡ እንስሳ genauer als „irgendeinem Tier“; ebenso ist „an jedem Ort“ für den umfassenden Ortsausdruck vorzuziehen.
