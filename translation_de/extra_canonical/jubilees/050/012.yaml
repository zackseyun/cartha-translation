  to: Und jeder Mensch, der an diesem Tag eine Arbeit verrichtet, eine Reise unternimmt oder sein Feld bestellt – sei es in seinem Haus oder an jedem Ort –, der ein Feuer entzündet, auf jedem Tier reitet, mit einem Schiff über das Meer fährt, irgendetwas schlägt oder tötet, ein Tier oder einen Vogel schlachtet, ein wildes Tier, einen Vogel oder einen Fisch fängt, fastet oder am Sabbattag Krieg führt —
  rationale: Die Ortsangabe wird mit Gedankenstrichen als möglicherweise weiter reichende Bestimmung markiert und mit „an jedem Ort“ umfassend wiedergegeben. „auf jedem Tier“ entspricht dem universalen Ausdruck des Ge'ez. Der abschließende Gedankenstrich bleibt erhalten, da der Satz erst im folgenden Vers abgeschlossen wird.
