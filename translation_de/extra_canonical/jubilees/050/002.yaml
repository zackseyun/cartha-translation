  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: de
  text: Von den Sabbatjahren des Landes habe ich dir am Berg Sinai gesagt, und von den Jubeljahren habe ich dir im Rahmen der Sabbatjahre gesagt; doch dessen Jahr habe ich dir nicht mitgeteilt, bis ihr in das Land kommt, das ihr in Besitz nehmen werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: Sabbatjahre des Landes
  rationale: Der Ausdruck bezeichnet die Sabbatzeiten des Landes; „Sabbatjahre“ gibt den sachlichen Bezug im Deutschen klar und knapp wieder.
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: Jubeljahre
  rationale: Dies ist die geläufige deutsche Bezeichnung für die Jubiläumsjahre des biblischen Kalenders.
- source_word: ሰንበታተ፡ ዓመታት
  choice: Jahrsabbate
  rationale: Die wörtliche Struktur „Sabbate von Jahren“ bleibt erkennbar und wird zugleich idiomatisch verdichtet.
- source_word: ዓመተሰ
  choice: das betreffende Jahr
  rationale: Der äthiopische Ausdruck hebt „das Jahr“ kontrastiv hervor, ohne den Bezug ausdrücklich durch ein Possessivpronomen festzulegen; „betreffende“ bewahrt diesen Rückverweis, ohne ihn enger aufzulösen.
- source_word: ትእኅዙ
  choice: in Besitz nehmen werdet
  rationale: Das Verb bezeichnet das Ergreifen beziehungsweise Inbesitznehmen des Landes; die futurische deutsche Form passt zum erwarteten Eintritt.
theological_decisions:
- issue: Bezug von „das Jahr“
  choice: das betreffende Jahr
  alternative: sein Jahr / das Jahr des Jubeljahres
  rationale: Der Ausgangstext nennt lediglich kontrastiv „das Jahr“. Die Übersetzung vermeidet es, den möglichen Bezug dogmatisch oder kalendarisch genauer festzulegen, als es die Formulierung erlaubt.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: „dir“ für Mose, anschließend „ihr“ für den Eintritt und die Besitznahme
  alternative: durchgehend „du“
  rationale: Die Passage richtet die Mitteilung an Mose persönlich, bezieht den künftigen Eintritt in das Land jedoch auf die Gemeinschaft. Die deutsche Numerusunterscheidung macht diesen im äthiopischen Verbgefüge angelegten Wechsel sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung „habe ich dir ... gesagt“ folgt der rhetorischen Parallelität des Ausgangstextes; „im Zusammenhang mit“ vermeidet ein im Deutschen missverständliches räumliches „unter“.
