  - severity: low
    issue: Unmotiviertes „Auch“ und weniger idiomatische Ortsangabe
    rationale: Das einleitende „Auch“ hat im vorliegenden Satz keinen klaren Gegenpart. „Am Berg Sinai“ ist die übliche deutsche Wiedergabe der Ortsangabe.
