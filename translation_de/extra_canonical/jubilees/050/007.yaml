  yaml_path: translation/extra_canonical/jubilees/050/007.yaml
  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: de
  text: 'Sechs Tage sollst du Arbeit verrichten; aber am siebten Tag, dem Sabbat des HERRN, eures Gottes, sollt ihr keinerlei Arbeit verrichten: ihr selbst, eure Kinder[a], eure männlichen und weiblichen Diener, all eure Tiere und der Fremde, der bei euch lebt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eure Söhne.'
    reason: Die Grundbedeutung kann je nach Kontext auch männliche Nachkommen bezeichnen; „Kinder“ ist hier jedoch die umfassendere und wahrscheinlichere Wiedergabe.
lexical_decisions:
- source_word: ውሉድክሙ (wəludəkkəmu)
  choice: eure Kinder
  rationale: Das geezische Pluralwort bezeichnet Kinder bzw. Nachkommen und ist hier weiter gefasst als ausschließlich „Söhne“.
- source_word: እንስሳክሙ (ʾənsəsakəmu)
  choice: all eure Tiere
  rationale: Die allgemeine Bezeichnung für Tiere wird nicht unnötig auf Vieh oder Arbeitstiere eingeengt.
- source_word: ነኪር (nakir)
  choice: der Fremde
  rationale: Das Wort bezeichnet hier einen Fremden bzw. Ausländer im Lebensbereich der Angeredeten; der Zusatz „der bei euch lebt“ gibt ዘኀቤክሙ idiomatisch wieder.
- source_word: ኵሎ ግብረ (kwəllo gəbra)
  choice: keinerlei Arbeit
  rationale: Die Verbindung bedeutet wörtlich „jede/alle Arbeit“ unter Verneinung; „keinerlei Arbeit“ gibt das umfassende Verbot natürlich wieder.
theological_decisions:
- issue: Zuordnung des Sabbats zu Gott
  choice: ein Sabbat des HERRN, eures Gottes
  alternative: ein Sabbat für den HERRN, euren Gott
  rationale: Der Genitiv bewahrt die formale Zuordnung im Geez und lässt offen, ob Zugehörigkeit, Widmung oder beides gemeint ist.
- issue: Wiedergabe von እግዚአብሔር
  choice: HERRN
  alternative: Herrn
  rationale: Die traditionelle Kapitälchenschreibung kennzeichnet die Gottesbezeichnung in einer Form, die an den biblischen Gebotstext anschließt, ohne zusätzliche Auslegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebotssprache. Die Anrede wird durchgehend im Plural wiedergegeben; die Aufzählung bleibt eng an der geezischen Satzstruktur, ohne im Deutschen schwerfällig zu wirken.
