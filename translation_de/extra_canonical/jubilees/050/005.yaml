base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: de
  text: Und die Jubeljahre werden vergehen, bis Israel von aller Schuld der Unzucht, Unreinheit, Befleckung, Sünde und Verirrung gereinigt ist und sicher im ganzen Land wohnt. Dann wird es für Israel weder einen Satan[a] noch irgendeinen Bösen mehr geben, und das Land wird von jener Zeit an für immer rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Widersacher.'
    reason: Das zugrunde liegende Wort kann sowohl „Satan“ als auch allgemein „Widersacher“ bezeichnen.
lexical_decisions:
- source_word: ኢዮቤሌዎታት
  choice: Jubeljahre
  rationale: Bezeichnet die aufeinanderfolgenden Jubiläumsperioden; „Jubeljahre“ ist die geläufige und verständliche deutsche Wiedergabe.
- source_word: አበሳ
  choice: Schuld
  rationale: Gibt den moralisch-religiösen Sinn von Vergehen beziehungsweise Schuld wieder und folgt hier der syntaktischen Verbindung mit der anschließenden Aufzählung.
- source_word: ዝሙት
  choice: Unzucht
  rationale: Bewahrt den sexuellen Bedeutungsbereich des Ausdrucks in einem würdigen biblischen Register.
- source_word: ርኵስ
  choice: Unreinheit
  rationale: Erhält die religiös-moralische Dimension des Quellworts, ohne sie auf bloßen Schmutz zu verengen.
- source_word: ግማኔ
  choice: Befleckung
  rationale: Unterscheidet den Begriff von „Unreinheit“ und gibt seine Bedeutung als Verunreinigung oder Besudelung wieder.
- source_word: ጌጋይ
  choice: Verirrung
  rationale: Deckt sowohl Irrtum als auch moralisches Fehlgehen ab und lässt die mögliche Spannung des Ausdrucks bestehen.
- source_word: ይትአመን
  choice: sicher … wohnt
  rationale: Überträgt den Gedanken vertrauensvoller Sicherheit idiomatisch ins Deutsche.
- source_word: ሰይጣነ
  choice: Satan
  rationale: Bewahrt die traditionelle Benennung und zugleich durch den unbestimmten Artikel die mögliche Gattungsbedeutung „Widersacher“.
- source_word: እኩየ
  choice: Bösen
  rationale: Die substantivierte Wiedergabe wahrt die mögliche Bezeichnung eines bösen Wesens oder Gegners.
theological_decisions:
- issue: Person oder Gattungsbezeichnung bei ሰይጣነ
  choice: „einen Satan“ mit Fußnote
  alternative: „einen Widersacher“ oder „den Satan“
  rationale: Der unbestimmte Ausdruck darf weder eindeutig auf den Eigennamen des Teufels festgelegt noch seiner satanischen Konnotation beraubt werden.
- issue: Bezug des Singularpronomens nach „Israel“
  choice: „für Israel“
  alternative: „für es“ oder „für sie“
  rationale: Die Wiederholung des Namens ist im Deutschen klar und natürlich und wahrt Israel als kollektives Singularsubjekt, ohne einen unklaren Pronomenbezug zu erzeugen.
- issue: Zeitpunkt der endgültigen Reinheit des Landes
  choice: „von jener Zeit an für immer“
  alternative: „von jener Zeit an alle Tage“
  rationale: Gibt die idiomatische Ewigkeitsformel des Quelltexts verständlich wieder, ohne einen zusätzlichen theologischen Zeitpunkt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Klang. Die Aufzählung bleibt bewusst differenziert; „sicher im ganzen Land wohnt“ vermeidet unnötig steife Nominalformulierungen. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
