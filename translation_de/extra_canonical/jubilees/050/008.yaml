  to: Und der Mensch, der an ihm irgendeine Arbeit verrichtet, soll sterben – jeder Mann, der diesen Tag entweiht, der mit einer Frau schläft, der ankündigt, er werde an ihm irgendeine Sache tun, um irgendeinen Kauf oder Verkauf abzuwickeln, der an ihm Wasser schöpft, das er nicht am sechsten Tag für sich bereitgestellt hat, oder der irgendeine Last aufnimmt, um sie aus seinem Zelt oder aus seinem Haus hinauszutragen, soll sterben.
