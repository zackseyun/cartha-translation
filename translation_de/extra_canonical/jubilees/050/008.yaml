base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: de
  text: Und der Mensch, der an ihm irgendeine Arbeit verrichtet, soll sterben – jeder Mann, der diesen Tag entweiht, der mit einer Frau schläft, der ankündigt, er werde an ihm irgendeine Sache tun, um irgendeinen Kauf oder Verkauf abzuwickeln, der an ihm Wasser schöpft, das er nicht am sechsten Tag für sich bereitgestellt hat, oder der irgendeine Last aufnimmt, um sie aus seinem Zelt oder aus seinem Haus hinauszutragen, soll sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንተኒ፡ ግብረ
  choice: irgendeine Arbeit
  rationale: Gibt die indefinite Wendung eng und in natürlichem Deutsch wieder.
- source_word: ዘይፄምና፡ ለዛ፡ ዕለት
  choice: der diesen Tag entweiht
  rationale: Bewahrt den kultisch-ethischen Sinn des Verbs, ohne ihn durch eine konfessionell geprägte Auslegung einzuengen.
- source_word: ይስክብ፡ ምስለ፡ ብእሲት
  choice: mit einer Frau schläft
  rationale: Direkte, gegenwärtige und würdevolle Wiedergabe der sexuellen Wendung.
- source_word: ይትናገር፡ ነገረ
  choice: eine Angelegenheit bespricht
  rationale: Das Verb bezeichnet Sprechen beziehungsweise Bereden; diese Fassung folgt dem geezischen Wortlaut enger als eine bloße Absichtserklärung.
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: Kauf oder Verkauf
  rationale: Gibt das Wortpaar als beide Seiten eines Handelsgeschäfts wieder.
- source_word: ማየ፡ ይቀድሕ
  choice: Wasser schöpft
  rationale: Konkrete und idiomatische Entsprechung der Handlung.
- source_word: አንሥአ፡ ዘይጸውር
  choice: irgendeine Last aufnimmt
  rationale: Bewahrt sowohl das Aufheben/Aufnehmen als auch den Gegenstand des Tragens.
- source_word: እምደብተራሁ፡ ... እምቤቱ
  choice: aus seinem Zelt oder aus seinem Haus
  rationale: Entspricht den beiden ausdrücklich genannten Herkunftsorten.
theological_decisions:
- issue: Reichweite der Todesandrohung
  choice: Die abschließende Formel „soll sterben“ bleibt ausdrücklich stehen und umfasst die ganze Aufzählung.
  alternative: Die Todesandrohung nur mit dem ersten Verbot verbinden.
  rationale: Syntax und Wiederaufnahme am Versende rahmen sämtliche genannten Sabbatverstöße ein.
- issue: Sprechen beziehungsweise Vorhaben am Sabbat
  choice: „eine Angelegenheit bespricht, um Geschäfte ... zu tätigen“
  alternative: „sagt, er werde ... tun“
  rationale: Der geezische Text spricht ausdrücklich vom Reden einer Sache und anschließendem Tun; die Übersetzung erhält diese Spannung, ohne daraus lediglich einen inneren Vorsatz zu machen.
- issue: Geschlechtsverkehr am Sabbat
  choice: Die Einzelbestimmung wird ohne Erklärung oder Harmonisierung direkt übersetzt.
  alternative: Sie durch einen allgemeinen Reinheitsbegriff abschwächen oder kommentierend begründen.
  rationale: Der Ausgangstext nennt die Handlung ausdrücklich; eine theologische Begründung liefert der Vers nicht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gesetzesartigem Satzbau. „An ihm“ nimmt den zuvor bezeichneten Tag auf und bewahrt die wiederholte Tagesreferenz des Ausgangstextes. Der lange Reihungssatz bleibt erhalten, wird aber durch Gedankenstrich und klare Relativsatzgliederung lesbar gemacht.
