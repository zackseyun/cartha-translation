    rationale: Der Quelltext und der englische Audit-Trail verbinden das Sagen einer Sache mit deren beabsichtigter Ausführung im Kontext von Kauf oder Verkauf. „Bespricht“ kann hingegen lediglich ein Gespräch über eine Angelegenheit bezeichnen.
