base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: de
  text: 'Denn groß ist die Ehre, die der HERR Israel gegeben hat: an diesem Festtag zu essen und zu trinken und satt zu werden und an ihm von aller Arbeit der Menschen zu ruhen – ausgenommen das Verbrennen von Räucherwerk und das Darbringen von Gabe und Opfer vor dem HERRN für die Tage und für die Sabbate.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: groß ist die Ehre
  rationale: Gibt die emphatische Prädikatsfügung des Geʿez unmittelbar und in würdigem Deutsch wieder.
- source_word: ለበሊዕ፡ ወለስቲይ፡ ወለጸጊብ
  choice: zu essen und zu trinken und satt zu werden
  rationale: Bewahrt die dreigliedrige Folge und den Zweck- beziehungsweise Inhaltscharakter der Infinitive.
- source_word: በዛቲ፡ ዕለት፡ በዓል
  choice: an diesem Festtag
  rationale: Natürliches modernes Deutsch für die Verbindung von Tag und Fest, ohne einen zusätzlichen Festnamen einzutragen.
- source_word: ግብር፡ ዘእምግብረ፡ እጓለ፡ እመሕያው
  choice: aller Arbeit der Menschen
  rationale: Verdichtet die wörtlich schwerfällige Wendung ‚Arbeit vom Tun der Menschenkinder‘, ohne ihren allgemeinen Bezug auf menschliche Arbeit einzuengen.
- source_word: ዕጣን፡ ዕጣን
  choice: das Verbrennen von Räucherwerk
  rationale: Die im edierten Text wiederholte Form wird nach dem durch Charles bezeugten Sinn als kultisches Räuchern verstanden; eine Fußnote wäre ohne zusätzliche textkritische Evidenz spekulativ.
- source_word: ቍርባን፡ ወመሥዋዕት
  choice: Gabe und Opfer
  rationale: Unterscheidet die beiden kultischen Begriffe, ohne die genaue Opferart überzubestimmen.
- source_word: ለመዋዕለ፡ ወለሰንበታት
  choice: für die Tage und für die Sabbate
  rationale: Erhält die auffällige und möglicherweise formelhafte Pluralform des Ausgangstextes statt sie harmonisierend zu glätten.
theological_decisions:
- issue: Reichweite der Sabbatruhe und kultische Ausnahme
  choice: Die kultischen Handlungen bleiben ausdrücklich als Ausnahme von der Arbeitsruhe stehen.
  alternative: Die Ausnahme als bloße Erläuterung oder als generelle priesterliche Sonderregel paraphrasieren.
  rationale: Der Ausgangstext stellt Räucherwerk sowie Gabe und Opfer syntaktisch nach ‚ausgenommen‘; die Übersetzung wahrt diese Spannung, ohne sie konfessionell zu systematisieren.
- issue: Gottesbezeichnung
  choice: HERR in Kapitälchenkonvention
  alternative: Herr oder Gott
  rationale: Entspricht der göttlichen Anrede እግዚአብሔር und der etablierten deutschsprachigen Bibelkonvention, ohne einen nicht belegten Eigennamen einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die längere Aufzählung und die kultische Terminologie bleiben quellenah; unnötige Archaismen und konfessionelle Präzisierungen werden vermieden.
