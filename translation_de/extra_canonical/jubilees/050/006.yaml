  text: And behold, I have written for you the command concerning the Sabbaths, and all the judgments of its laws.
translation:
  language: de
  text: Und siehe, ich habe dir das Gebot über die Sabbate und alle Rechtsbestimmungen der dazugehörigen Gesetze[a] aufgeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seiner Gesetze“. Das Possessivsuffix steht im maskulinen Singular; sein genauer Bezug ist nicht eindeutig. Es kann formal auf das „Gebot“ bezogen werden, während sachlich die Gesetze der Sabbatordnung gemeint sein können.'
    reason: Dokumentiert den pluralischen Ausdruck „Gesetze“ und bewahrt die grammatische wie sachliche Unschärfe des singularischen Possessivsuffixes, die die deutsche Umschreibung nicht unmittelbar abbilden kann.
lexical_decisions:
- source_word: ትእዛዘ፡ ሰንበታት
  choice: das Gebot über die Sabbate
  rationale: Bewahrt die Konstruktion aus dem Singular „Gebot“ und dem Plural „Sabbate“, ohne sie zum geläufigeren Singular „Sabbatgebot“ einzuebnen.
- source_word: ፍትሓተ
  choice: Rechtsbestimmungen
  rationale: Gibt den rechtlichen Sinn von Urteilen, Satzungen oder verbindlichen Entscheidungen in verständlichem modernem Deutsch wieder.
- source_word: ሕገጊሁ
  choice: seiner Gesetze
  rationale: Die zugrunde liegende Form ist pluralisch („Gesetze“) und trägt ein maskulines singularisches Possessivsuffix; „seiner“ bildet diese Form möglichst eng ab.
- source_word: ጸሐፍኩ፡ ለከ
  choice: ich habe dir … aufgeschrieben
  rationale: Natürliches Deutsch für das Schreiben zugunsten bzw. zur Unterweisung des Angesprochenen.
theological_decisions:
- issue: Bezug des Possessivsuffixes in ሕገጊሁ
  choice: „seiner Gesetze“ im Haupttext, mit offengelegter Bezugsunschärfe in der Fußnote
  alternative: „der dazugehörigen Gesetze“ oder „ihrer Gesetze“
  rationale: Das maskuline singularische Suffix passt formal am ehesten zu „Gebot“, während der Sachzusammenhang einen Bezug auf die Sabbatordnung nahelegen kann. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ wahrt den feierlichen Hinweischarakter von ወናሁ, ohne das heute stärker archaische „siehe“ zu erzwingen.
