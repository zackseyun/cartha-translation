base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: de
  text: Nur diese Arbeit darf an den Sabbattagen im Heiligtum des HERRN, eures Gottes, verrichtet werden, damit man für Israel mit einem beständigen Opfer Sühne erwirkt, Tag für Tag, als eine Erinnerung, die vor dem HERRN wohlgefällig ist.[a] Und er wird sie für immer annehmen, Tag für Tag, wie dir geboten wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vor dem HERRN annehmbar ist“.'
    reason: Die Wurzel bezeichnet Wohlgefallen beziehungsweise Annehmbarkeit; beide deutschen Wiedergaben sind möglich.
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: Nur diese Arbeit
  rationale: ግብር bezeichnet ausdrücklich eine Arbeit oder Handlung; ባሕቲቱ schränkt sie als allein zulässig ein.
- source_word: ይትገበር
  choice: darf … verrichtet werden
  rationale: Die passive Verbform wird im normativen Zusammenhang als zulässige Handlung wiedergegeben.
- source_word: በቤተ፡ መቅደሱ
  choice: im Heiligtum
  rationale: Wörtlich etwa „im Haus seines Heiligtums“; „im Heiligtum“ ist natürliches Deutsch und bewahrt den kultischen Ort.
- source_word: ያስተስርዩ
  choice: man … Sühne erwirkt
  rationale: Das kausative Sühneverb bezeichnet das Vollziehen beziehungsweise Erwirken von Sühne; das unbestimmte „man“ wahrt die nicht ausdrücklich genannte handelnde Person.
- source_word: መባአ፡ ወትረ
  choice: mit einem beständigen Opfer
  rationale: መባአ bedeutet Opfer/Gabe und darf nicht ausgelassen werden; ወትረ kennzeichnet dessen fortdauernden Charakter.
- source_word: ለተዝካር
  choice: als eine Erinnerung
  rationale: Bewahrt den kultischen Begriff einer vor Gott dargebrachten Erinnerung, ohne ihn interpretierend auf „Gedenkopfer“ festzulegen.
- source_word: ዘይሠጠው
  choice: die … wohlgefällig ist
  rationale: Die Form bezeichnet Wohlgefallen beziehungsweise Annehmbarkeit, nicht das Geben.
- source_word: ወይትወከፎሙ
  choice: Und er wird sie … annehmen
  rationale: Das Verb bedeutet aufnehmen/annehmen; das plurale Objektsuffix wird als „sie“ bewahrt, obwohl sein Bezug im Kontext nicht völlig eindeutig ist.
theological_decisions:
- issue: Art und Wirkung der kultischen Handlung
  choice: „damit man für Israel … Sühne erwirkt“
  alternative: „damit sie für Israel … Sühne schaffen“
  rationale: Die Formulierung hält die kultische Sühneaussage fest, vermeidet aber eine dogmatische Präzisierung von Handelnden und Wirkmechanismus.
- issue: Bezug des pluralischen Objekts in „er wird sie annehmen“
  choice: Pronomen „sie“ ohne auflösenden Zusatz
  alternative: „er wird ihre Opfer annehmen“ oder „er wird sie [Israel] annehmen“
  rationale: Der ge'ezische Text enthält ein pluralisches Objektsuffix, dessen Referent mehrdeutig ist. Diese Spannung wird nicht stillschweigend aufgelöst.
- issue: Göttlicher Name
  choice: HERR
  alternative: Herr
  rationale: Die etablierte deutsche Bibelkonvention kennzeichnet mit Kapitälchen den Gottesnamen hinter እግዚአብሔር, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Fachsprache. Die Wiederholung „Tag für Tag“ und der unklare Bezug von „sie“ bleiben entsprechend der Quelle erhalten.
