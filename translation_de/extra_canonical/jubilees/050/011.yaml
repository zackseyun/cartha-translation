  terminology: „HERR“ ist als Wiedergabe des Gottesnamens konsistent. „Heiligtum“, „Opfer“, „Sühne“ und „Erinnerung“ sind terminologisch tragfähig. Das unbestimmte „man“ vermeidet eine nicht im Text festgelegte Bestimmung der handelnden Personen; „sie“ wahrt die Mehrdeutigkeit des pluralischen Suffixes.
