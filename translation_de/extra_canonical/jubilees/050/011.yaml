  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des ge''ezischen Textes vollständig wieder: die ausschließliche zulässige Arbeit an den Sabbattagen, den Ort im Heiligtum, die für Israel zu vollziehende Sühne, das fortdauernde Opfer, das Gedächtnis vor dem HERRN, dessen Wohlgefälligkeit sowie das pluralische Objekt von „annehmen“. Insbesondere werden ግብር („Arbeit“), መባአ („Opfer/Gabe“) und die Bedeutung von ሠጠወ im Sinn von Wohlgefallen/Annehmbarkeit nicht unterschlagen oder verfälscht.'
