revisions:
- from: Und der Mensch, der am Sabbattag irgendetwas davon tut, soll sterben, damit die Kinder Israels nach den Geboten über die Sabbate des Landes handeln,[a] wie es auf den Tafeln geschrieben steht, die er mir in die Hände gab, damit ich dir die Gesetze für jede festgesetzte Zeit nach der Einteilung ihrer Tage aufschreibe.
  to: Und der Mensch, der am Sabbattag irgendetwas davon tut, soll sterben, damit die Kinder Israels die Sabbate des Landes gemäß den Geboten halten, wie es auf den Tafeln geschrieben steht, die er mir in die Hände gab, damit ich dir die Gesetze jeder festgesetzten Zeit nach der Einteilung ihrer Tage aufschreibe.
  rationale: Die Revision ersetzt das unspezifische „handeln“ durch „die Sabbate des Landes ... halten“ und bewahrt zugleich በከመ als „gemäß“. Sie beseitigt die nicht erforderliche und sprachlich missglückte Fußnote. Außerdem wird der Bezug von „Gesetze“ auf die jeweilige festgesetzte Zeit präziser formuliert, ohne die im Ausgangstext offene Referenz des Pronomens „er“ zu ergänzen.
