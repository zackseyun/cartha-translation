  source_fidelity: Der Entwurf gibt die Satzstruktur, die Todesfolge, die Pluralform „Gesetze“ sowie die Maßstabsangabe „nach/gemäß den Geboten“ im Wesentlichen zutreffend wieder. „Nach den Geboten über die Sabbate des Landes handeln“ verschiebt jedoch das im Ge'ez ausgedrückte Bewahren/Halten auf ein unspezifisches „Handeln“ und macht den Bezug der Sabbate weniger präzise.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Die Sabbate des Landes gemäß den Geboten halten“ ist idiomatischer und bildet die Verbindung von Halten/Bewahren mit dem normativen Maßstab klarer ab.
  terminology: „Sabbat“, „Kinder Israels“, „Tafeln“ und „Gesetze“ sind angemessen. „Gesetze jeder festgesetzten Zeit“ entspricht dem pluralischen ሕገገ und dem Bezug auf die jeweilige bestimmte Zeit genauer als „Gesetze für“.
