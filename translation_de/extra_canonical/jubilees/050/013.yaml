    rationale: Die Übersetzung kann die Konstruktion ohne Fußnote klar wiedergeben. Die vorgeschlagene Fußnote „nach den Geboten ... bewahren“ ist im Deutschen selbst nicht tragfähig und erklärt keine für den Leser nötige Textvariante.
  - severity: low
