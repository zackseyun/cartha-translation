base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: de
  text: Und der Mensch, der am Sabbattag irgendetwas davon tut, soll sterben, damit die Kinder Israels die Sabbate des Landes gemäß den Geboten halten, wie es auf den Tafeln geschrieben steht, die er mir in die Hände gab, damit ich dir die Gesetze jeder festgesetzten Zeit nach der Einteilung ihrer Tage aufschreibe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእ
  choice: der Mensch
  rationale: Gibt die allgemeine Personenbezeichnung geschlechtsübergreifend und in würdigem biblischem Register wieder.
- source_word: ይሙት
  choice: soll sterben
  rationale: Bewahrt den normativen beziehungsweise rechtlichen Charakter der ge'ezischen Form, ohne die Aussage zu mildern.
- source_word: በከመ፡ ትእዛዛተ፡ ሰንበታት፡ ምድር
  choice: nach den Geboten über die Sabbate des Landes handeln
  rationale: Erhält በከመ als Maßstabsangabe „nach“; „handeln“ macht im Deutschen deutlich, dass die Gebote den Maßstab des Bewahrens beziehungsweise Beachtens bilden.
- source_word: ሕገገ፡ ጊዜ፡ ወጊዜ
  choice: die Gesetze für jede festgesetzte Zeit
  rationale: ሕገገ ist hier pluralisch; die distributive Wendung „Zeit und Zeit“ wird natürlich als „jede ... Zeit“ wiedergegeben.
- source_word: በበ፡ ክፍሌ፡ መዋዕሊሁ
  choice: nach der Einteilung ihrer Tage
  rationale: Gibt die distributive Präposition und die Gliederung der jeweiligen Tage möglichst nah und zugleich idiomatisch wieder.
theological_decisions:
- issue: Rechtsfolge für Sabbatübertretung
  choice: soll sterben
  alternative: wird sterben
  rationale: Der rechtliche Kontext spricht für eine Vorschrift beziehungsweise Strafbestimmung; die mögliche modale Spannung der Form wird nicht durch eine ausführende Instanz ergänzt.
- issue: Bezug der Sabbate des Landes
  choice: Gebote über die Sabbate des Landes
  alternative: Gebote der Sabbate des Landes
  rationale: „über“ kennzeichnet im Deutschen den sachlichen Bezug, ohne festzulegen, ob ausschließlich Land-Sabbatjahre oder Sabbatordnungen im Land gemeint sind.
- issue: Subjekt von „gab“
  choice: er
  alternative: Gott
  rationale: Das Pronomen des Ausgangstextes bleibt erhalten; der theologische Referent wird nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-biblischem Klang. „Sabbat“ wird als etablierter religiöser Begriff beibehalten; unnötige Archaismen werden vermieden. Der Fußnotenmarker [a] steht unmittelbar bei der syntaktisch mehrdeutigen Wendung.
