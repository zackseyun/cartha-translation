lexical_decisions:
- source_word: ታበብት፡ ምድር፡ ሰንበታቲሃ
  choice: das Land wird seine Sabbate halten
  rationale: Die Formulierung gibt die Aussage vom Land und seinen Sabbaten eng und zugleich idiomatisch wieder; der Plural „Sabbate“ bleibt erhalten.
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  choice: während sie darauf wohnen
  rationale: Die zeitliche Begleitumstandsangabe und der Bezug auf das Land werden natürlich im Deutschen ausgedrückt.
- source_word: ዓመተ፡ ለኢዮቤል
  choice: das Jubeljahr
  rationale: Die wörtliche Wendung „Jahr des Jubels/Jubiläums“ bezeichnet im biblischen Rechtskontext das Jubeljahr.
- source_word: ያእምሩ
  choice: sie werden … kennen
  rationale: Bewahrt den Erkenntnisbegriff des Verbs, ohne ihn deutend zu „beachten“ oder „feiern“ zu erweitern.
theological_decisions:
- issue: Bedeutung von „kennen“ beim Jubeljahr
  choice: „kennen“
  alternative: „erkennen“ oder „beachten“
  rationale: Der Ausgangstext spricht ausdrücklich vom Wissen beziehungsweise Kennen. Ob dies auch praktische Beachtung einschließt, wird nicht stillschweigend entschieden.
