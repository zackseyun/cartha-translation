  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: de
  text: Ihr sollt am Sabbattag keinerlei Arbeit tun außer dem, was ihr am sechsten Tag für euch vorbereitet habt, um zu essen und zu trinken, zu ruhen und den Sabbat zu halten und an diesem Tag von jeder Arbeit zu ruhen. Und ihr sollt den HERRN, euren Gott, preisen, der euch einen Festtag, einen heiligen Tag und einen heiligen Tag der Königsherrschaft[a] für ganz Israel gegeben hat – diesen Tag durch alle Tage Israels hindurch, durch alle Tage hindurch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tag der heiligen Königsherrschaft“.'
    reason: Das feminine Adjektiv „heilig“ kann sich grammatisch entweder auf „Tag“ oder auf „Königsherrschaft“ beziehen.
  - marker: b
    text: 'Wörtlich: „in ihren Tagen, in allen Tagen“; traditionell auch verstanden als „durch ihre Generationen, für immer“.'
    reason: Die idiomatische Reichweite der wiederholten Zeitangabe ist offen, während der Geʿez-Text ausdrücklich zweimal „Tage“ sagt.
lexical_decisions:
- source_word: ሰንበት (sanbat)
  choice: Sabbat / Sabbat halten
  rationale: Das Substantiv und die entsprechende verbale Wendung werden im Deutschen mit dem etablierten biblischen Begriff wiedergegeben; die Wiederholung des Ausgangstextes bleibt erhalten.
- source_word: ግብር (gəbr)
  choice: Arbeit
  rationale: Im Kontext des Sabbatgebots bezeichnet das Wort die untersagte Arbeit bzw. Tätigkeit.
- source_word: በዓል (baʿāl)
  choice: Festtag
  rationale: Gibt den religiösen Feiercharakter natürlich und prägnant wieder.
- source_word: መንግሥት (mangəśt)
  choice: Königsherrschaft
  rationale: Bewahrt die Bedeutung von Herrschaft/Königtum, ohne vorschnell ein räumliches „Königreich“ vorauszusetzen.
- source_word: በመዋዕሊሆሙ ... በኵሉ መዋዕል
  choice: alle ihre Tage hindurch, alle Tage hindurch
  rationale: Folgt der ausdrücklichen Wiederholung von „Tage“ im Geʿez und vermeidet die nicht unmittelbar belegte Wiedergabe „Generationen“.
theological_decisions:
- issue: Bezug des Adjektivs ቅድስት in ዕለተ መንግሥት ቅድስት
  choice: ein heiliger Tag der Königsherrschaft
  alternative: ein Tag der heiligen Königsherrschaft
  rationale: Da „Tag“ und „Königsherrschaft“ im Geʿez beide feminin sind, ist der grammatische Bezug des Adjektivs mehrdeutig. Der Haupttext folgt der naheliegenden Reihung mehrerer Tagesbezeichnungen; die Alternative wird in einer Fußnote bewahrt.
- issue: Zeitliche Schlussformel
  choice: alle ihre Tage hindurch, alle Tage hindurch
  alternative: durch ihre Generationen, für immer
  rationale: Der Ausgangstext verwendet zweimal das Wort für „Tage“, nicht den üblichen Ausdruck für „Generationen“. Die formnahe Wiedergabe erhält die auffällige Wiederholung und lässt die genaue Reichweite offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit vertrauter biblischer Terminologie. „Keinerlei Arbeit“ bildet die emphatische Verneinung ab. Die Satzteilung verbessert die Lesbarkeit, ohne die inhaltliche Abfolge zu verändern; die markierte Wiederholung von „Sabbat“ und „Tage“ bleibt bewusst erhalten.
