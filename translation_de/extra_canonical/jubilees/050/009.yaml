revisions:
- from: Ihr sollt am Sabbattag keinerlei Arbeit tun außer dem, was ihr am sechsten Tag für euch vorbereitet habt, um zu essen und zu trinken, zu ruhen und an diesem Tag von aller Arbeit Sabbat zu halten. Und ihr sollt den HERRN, euren Gott, preisen, der euch einen Festtag, einen heiligen Tag und einen heiligen Tag der Königsherrschaft[a] für ganz Israel gegeben hat – diesen Tag alle ihre Tage hindurch, alle Tage hindurch.[b]
  to: Ihr sollt am Sabbattag keinerlei Arbeit tun außer dem, was ihr am sechsten Tag für euch vorbereitet habt, um zu essen und zu trinken, zu ruhen und den Sabbat zu halten und an diesem Tag von jeder Arbeit zu ruhen. Und ihr sollt den HERRN, euren Gott, preisen, der euch einen Festtag, einen heiligen Tag und einen heiligen Tag der Königsherrschaft[a] für ganz Israel gegeben hat – diesen Tag durch alle Tage Israels hindurch, durch alle Tage hindurch.[b]
  rationale: Die Revision beseitigt die unidiomatische Verknüpfung von „Sabbat halten“ mit „von aller Arbeit“ und präzisiert den Bezug der ersten Zeitangabe auf Israel. Die semantische Reihenfolge und die absichtliche Wiederholung der Zeitbegriffe bleiben erhalten. Die Fußnotenanker und beide Fußnoten bleiben inhaltlich angemessen und strukturell korrekt.
