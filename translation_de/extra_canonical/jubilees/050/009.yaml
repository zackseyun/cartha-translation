    issue: Unidiomatische und missverständliche Wendung „von aller Arbeit Sabbat zu halten“
    rationale: Das Deutsche verbindet „Sabbat halten“ nicht natürlich mit „von aller Arbeit“. Die Vorlage unterscheidet Ruhen und Sabbat-Halten beziehungsweise Enthaltung von Arbeit. Eine Umstellung zu „den Sabbat zu halten und ... von jeder Arbeit zu ruhen“ stellt dies verständlich dar, ohne den Sinn zu ändern.
  - severity: low
    issue: Unklarer Bezug von „ihre“ in der Schlussformel
    rationale: Nach „für ganz Israel“ kann „alle ihre Tage“ zwar verstanden werden, aber „Israels Tage“ macht den im Ausgangstext pluralisch ausgedrückten Bezug explizit und erhält zugleich die Wiederholung von „Tagen“.
