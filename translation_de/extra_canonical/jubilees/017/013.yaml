translation:
  language: de
  text: ihr Kind. Dann machte sie sich auf und zog in Richtung der Wüste Paran. Und das Kind wuchs heran und wurde ein Bogenschütze. Der Herr war mit ihm, und seine Mutter nahm für ihn eine Frau aus den Töchtern Ägyptens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕፃና
  choice: ihr Kind
  rationale: Die Form bezeichnet hier wahrscheinlich das Objekt des letzten Verbs im vorhergehenden Vers und wird wegen der überlieferten Versgrenze als Satzfragment wiedergegeben; ein Verb wie „wuchs“ steht an dieser Stelle nicht.
- source_word: መንገለ
  choice: in Richtung
  rationale: Gibt die gerichtete Bedeutung „nach/gegen ... hin“ wieder, ohne schon das Eintreffen in der Wüste auszudrücken.
- source_word: በድው፡ ፍራም
  choice: der Wüste Paran
  rationale: Natürliche deutsche Wiedergabe des geografischen Ausdrucks.
- source_word: አሀቀ፡ ሕፃን
  choice: das Kind wuchs heran
  rationale: Der Satz bezeichnet hier ausdrücklich das Heranwachsen des Kindes.
- source_word: ነዳፌ
  choice: Bogenschütze
  rationale: Bezeichnet einen Schützen mit dem Bogen; die knappe Berufs- bzw. Fähigkeitsbezeichnung entspricht dem Kontext.
- source_word: ሀለወ፡ እግዚአብሔር፡ ምስሌሁ
  choice: Der Herr war mit ihm
  rationale: Bewahrt die einfache theologische Aussage der Vorlage ohne zusätzliche Ausdeutung.
- source_word: ነሥአት፡ ሎቱ ... ብእሲተ
  choice: seine Mutter nahm ihm eine Frau
  rationale: Formnah und im Deutschen verständlich; gemeint ist, dass die Mutter für ihn eine Ehefrau auswählte bzw. nahm.
- source_word: እምአዋልደ፡ ግብጽ
  choice: von den Töchtern Ägyptens
  rationale: Bewahrt die kollektive Herkunftsformulierung der Vorlage.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: der Herr
  alternative: Gott
  rationale: „Der Herr“ entspricht der traditionellen und kontextuell passenden Wiedergabe, ohne die Aussage „war mit ihm“ konfessionell auszulegen.
- issue: Bedeutung der Gegenwart des Herrn
  choice: Der Herr war mit ihm
  alternative: Der Herr stand ihm bei
  rationale: Die formnahe Fassung wahrt die offene Bedeutung zwischen Gegenwart, Beistand und Begleitung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das anfängliche Fragment „ihr Kind.“ bleibt erhalten, weil es offenbar syntaktisch zum vorigen Vers gehört und die vorgegebene Versabgrenzung mitten im Satz liegt. Keine Fußnote ist nötig, da weder eine textkritische Variante noch eine für das Verständnis wesentliche echte Mehrdeutigkeit zusätzlich erklärt werden muss.
