base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: de
  text: 'Sie ging einen Bogenschuss weit fort, denn sie sagte: »Ich will den Tod meines Kindes nicht mit ansehen.« Dann setzte sie sich hin und weinte. Da sagte ein Engel Gottes, einer von den Heiligen, zu ihr: »Warum weinst du, Hagar? Steh auf, nimm das Kind und halte es mit deiner Hand, denn Gott hat deine Stimme gehört und das Kind gesehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ፡
  choice: einen Bogenschuss weit
  rationale: Die Wendung bezeichnet wörtlich die Entfernung eines Bogenschusses und bewahrt damit das konkrete Maß sowie den Anklang an Genesis 21,16.
- source_word: አይርአይ፡ ሞቶ፡ ለሕፃንየ፡
  choice: Ich will den Tod meines Kindes nicht mit ansehen
  rationale: Die natürliche deutsche Wendung gibt den Wunsch wieder, den Tod des Kindes nicht sehen bzw. miterleben zu müssen.
- source_word: አሐዱ፡ እምቅዱሳን፡
  choice: einer von den Heiligen
  rationale: Die Zugehörigkeitsformulierung wird formal bewahrt, ohne die Gruppe der Heiligen näher zu bestimmen.
- source_word: አንዝዮ፡ በእዴኪ፡
  choice: halte es mit deiner Hand
  rationale: Die konkrete Singularform „Hand“ des Ge'ez wird beibehalten; das Verb bezeichnet hier das Halten bzw. Stützen des Kindes.
- source_word: ሰምዐ፡ እግዚአብሔር፡ ቃለኪ፡ ወርእዮ፡ ለሕፃን፡
  choice: Gott hat deine Stimme gehört und das Kind gesehen
  rationale: Die beiden parallelen Wahrnehmungsverben und ihre unterschiedlichen Objekte werden ohne Harmonisierung wiedergegeben.
theological_decisions:
- issue: Bezeichnung des Engels als Zugehöriger zu den Heiligen
  choice: ein Engel Gottes, einer von den Heiligen
  alternative: ein heiliger Engel Gottes
  rationale: Der Ausgangstext enthält sowohl „Engel Gottes“ als auch „einer von den Heiligen“. Die gewählte Fassung erhält beide Aussagen und verschmilzt sie nicht zu einer bloßen Eigenschaft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; das konkrete antike Entfernungsmaß „Bogenschuss“ sowie die ungewöhnliche Formulierung „mit deiner Hand“ bleiben aus Quellennähe erhalten.
