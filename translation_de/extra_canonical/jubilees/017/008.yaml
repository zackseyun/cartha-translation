  source_fidelity: Die Übersetzung gibt die zukunftsbezogene Aussage von እሬስዮ mit „Ich werde … machen“ zutreffend wieder. „zu einem großen Volk“ entspricht der Konstruktion ውስተ ዐቢይ ሕዝብ; „denn er stammt von dir ab“ gibt „denn er ist aus deinem Samen“ idiomatisch und ohne Bedeutungsverlust wieder. Der anschließende Satzbeginn und das abschließende Komma entsprechen dem versübergreifenden Ge'ez-Satz.
