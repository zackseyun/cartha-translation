lexical_decisions:
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስዮ
  choice: Ich werde ihn zu einem großen Volk machen
  rationale: Die Konstruktion mit ውስተ und ረሰየ bezeichnet hier das Machen zu etwas; die Imperfektform እሬስዮ wird zukunftsbezogen wiedergegeben. ዐቢይ bestimmt ሕዝብ näher.
- source_word: እስመ፡ እምዘርእከ፡ ውእቱ
  choice: denn er stammt von dir ab
  rationale: Wörtlich etwa »denn er ist aus deinem Samen«; die natürliche deutsche Wendung bewahrt die Aussage der Abstammung.
- source_word: ወነገሀ፡ አብርሃም፡ በነግህ
  choice: Und Abraham stand früh am Morgen auf
  rationale: Die idiomatische Zeitangabe wird in natürlichem Deutsch wiedergegeben; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
