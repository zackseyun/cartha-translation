  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
translation:
  language: de
  text: 'Und sie gebar ihm einen Sohn, und er gab ihm den Namen Nebajot, denn sie sagte: »Der Herr ist mir nahe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡
  choice: Und sie gebar ihm einen Sohn
  rationale: Gibt das feminine Subjekt, das indirekte Objekt und das Akkusativobjekt des geʿezischen Satzes direkt und natürlich wieder.
- source_word: ወጸውዐ፡ ስሞ፡ ናቤዮት፡
  choice: und er gab ihm den Namen Nebajot
  rationale: Die Verbform ist 3. Person Singular maskulin; daher wechselt das Subjekt zu »er«. »Ihm den Namen geben« ist im modernen Deutschen natürlicher als »seinen Namen nennen«.
- source_word: እስመ፡ ትቤ፡
  choice: denn sie sagte
  rationale: Bewahrt die kausale Verknüpfung und das ausdrücklich feminine Subjekt der Redeformel.
- source_word: ቅሩብ፡ እግዚአብሔር፡ ሊተ፡
  choice: Der Herr ist mir nahe
  rationale: Bildet Prädikat, Subjekt und Dativbezug knapp ab und erhält die im Ausgangstext formulierte Nähe des Herrn.
theological_decisions:
- issue: Aussage über die Nähe des Herrn
  choice: Der Herr ist mir nahe
  alternative: Der Herr ist mir nahegekommen
  rationale: Das Geʿez bietet eine nominale Aussage mit »nahe« und rechtfertigt keine zusätzliche Bewegungs- oder Ereignisvorstellung.
- issue: Subjekt des Namengebens
  choice: er gab ihm den Namen
  alternative: sie gab ihm den Namen
  rationale: Die maskuline Singularform ጸውዐ weist auf ein männliches Subjekt, während sowohl »sie gebar« als auch »sie sagte« ausdrücklich feminin markiert sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Der Name wird in der im Deutschen bibelsprachlich geläufigen Form »Nebajot« wiedergegeben; der Wechsel vom weiblichen zum männlichen Subjekt bleibt ausdrücklich sichtbar.
