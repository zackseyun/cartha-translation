  text: And his mother took him and cast him under an olive tree, and she went and sat opposite, at a distance.
translation:
  language: de
  text: Seine Mutter nahm ihn und warf ihn unter einen Olivenbaum.[a] Dann ging sie und setzte sich ihm gegenüber in einiger Entfernung hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter einen einzigen Olivenbaum“.'
    reason: Das geʽezische Zahlwort አሐቲ („eine“) kann als echtes Zahlwort oder idiomatisch mit unbestimmter Bedeutung verstanden werden.
lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ
  choice: Seine Mutter nahm ihn
  rationale: Gibt das Verb „nehmen“ mit dem Objektsuffix sowie das nachgestellte Subjekt „seine Mutter“ natürlich und genau wieder.
- source_word: ወገደፈቶ
  choice: und warf ihn
  rationale: Bewahrt die kräftige Bedeutung von „werfen/wegwerfen“, ohne sie durch ein milderes „legte“ abzuschwächen.
- source_word: ታኅተ፡ አሐቲ፡ እልያስ
  choice: unter einen Olivenbaum
  rationale: Das Zahlwort „eins“ kann hier idiomatisch unbestimmte Referenz ausdrücken; im Deutschen ist der unbestimmte Artikel die natürliche Wiedergabe.
- source_word: ወሖረት
  choice: Dann ging sie weg
  rationale: Das Bewegungsverb wird im Zusammenhang als Entfernung vom Kind wiedergegeben; „Dann“ markiert den Fortgang der Handlung.
- source_word: ወነበረት፡ አንጻር፡ መጠነ
  choice: und setzte sich ihm gegenüber in einiger Entfernung hin
  rationale: Gibt Sitzen, Gegenüberstellung und Abstand gemeinsam wieder; „ihm“ macht den im Deutschen erforderlichen Bezug deutlich, ohne den Sinn festzulegen oder zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Härte des Verbs „warf“ und die räumliche Aussage „ihm gegenüber in einiger Entfernung“ bleiben erhalten.
