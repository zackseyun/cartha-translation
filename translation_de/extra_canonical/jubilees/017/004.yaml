  yaml_path: translation/extra_canonical/jubilees/017/004.yaml
  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: de
  text: 'Und Sara sah, wie Ismael scherzte und tanzte und wie Abraham sich sehr freute. Da wurde sie eifersüchtig auf Ismael und sagte zu Abraham: »Vertreibe diese Magd[a] und ihren Sohn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklavin«; der überlieferte äthiopische Wortlaut ist an dieser Stelle offenbar beschädigt.'
    reason: Kennzeichnet sowohl die soziale Bedeutungsbreite als auch die textkritische Unsicherheit der vorgelegten Form.
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: scherzte und tanzte
  rationale: Gibt die beiden koordinierten Handlungen Ismaels natürlich und ohne zusätzliche Deutung wieder.
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: sich sehr freute
  rationale: Die figura etymologica mit der Verstärkung »große Freude« wird in idiomatischem Deutsch als intensive Freude ausgedrückt.
- source_word: ወቀንአት፡ ለይስማዔል
  choice: wurde sie eifersüchtig auf Ismael
  rationale: Bewahrt den ausdrücklich auf Ismael gerichteten Affekt; »eifersüchtig« entspricht dem vorgelegten Text und lässt das Motiv offen.
- source_word: ስድድ
  choice: Vertreibe
  rationale: Der Imperativ bezeichnet ein entschiedenes Fortschicken beziehungsweise Ausstoßen.
- source_word: ዛተ፡ ወሰተ
  choice: diese Magd
  rationale: Der überlieferte Ausdruck ist offenbar textlich beschädigt; die kritische Einordnung und der Erzählzusammenhang weisen auf eine weibliche Dienerin beziehungsweise Sklavin. »Magd« wahrt den sozialen Status in knapper, würdiger Sprache.
theological_decisions:
- issue: Grund für Saras Forderung
  choice: »eifersüchtig auf Ismael«
  alternative: »erbittert gegen Ismael« oder eine motivierende Erklärung
  rationale: Die Übersetzung benennt nur den im Ausgangstext ausgedrückten Affekt und fügt keine harmonisierende oder moralische Deutung hinzu.
- issue: Sozialer Status Hagars
  choice: »Magd« mit Fußnote zur möglichen Wiedergabe »Sklavin«
  alternative: »Frau« oder ausschließlich »Sklavin«
  rationale: »Magd« ist im biblischen Erzählregister verständlich und bezeichnet ein weibliches Dienstverhältnis; die Fußnote macht die härtere soziale Dimension transparent, ohne die Hauptzeile unnötig festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am Ausgangstext; Wiederholungen werden nur dort idiomatisch verdichtet, wo der Sinn vollständig erhalten bleibt.
