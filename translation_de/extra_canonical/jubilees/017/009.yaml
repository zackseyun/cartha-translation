base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/009.yaml
  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: de
  text: Und er nahm Brot und einen Wasserschlauch, legte beides Hagar auf die Schulter, dazu das Kind, und schickte sie fort.[a] Sie ging und irrte in der Wüste Beerscheba umher. Das Wasser im Schlauch ging aus; das Kind bekam Durst, konnte nicht weitergehen und fiel hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge'ezische Reihung nach „auf die Schulter“ ist syntaktisch schwierig. Sie kann weniger konkret als eine Gabe von Brot und Wasser an Hagar verstanden werden; das Verb bezeichnet jedoch gewöhnlich ein Auflegen oder Tragenlassen. „Schickte sie fort“ steht im Singular und bezieht sich auf Hagar.
    reason: Die Anmerkung dokumentiert die syntaktische Schwierigkeit und die mögliche weniger konkrete Auffassung, ohne die konkrete Verbbedeutung oder den femininen Singular des folgenden Verbs aufzugeben.
lexical_decisions:
- source_word: አስከማ (ʾaskamā)
  choice: lud … auf die Schulter
  rationale: Das Verb bezeichnet hier das Aufladen beziehungsweise Tragenlassen auf der Schulter und wird daher konkreter wiedergegeben als nur mit „geben“.
- source_word: ተንገገ (tənaggaga)
  choice: irrte … umher
  rationale: Die Form beschreibt zielloses Umherwandern; „irrte umher“ ist im modernen Deutschen natürlich und bewahrt diesen Sinn.
- source_word: ተፈጸመ (tafaṣṣama)
  choice: ausgegangen war
  rationale: Wörtlich ist das Wasser „vollendet“ beziehungsweise „zu Ende“; bei einem Wasservorrat ist „ausgehen“ die idiomatische deutsche Entsprechung.
- source_word: ስእነ ሐዊረ (səʾna ḥawira)
  choice: konnte nicht mehr weitergehen
  rationale: Die Verbindung bedeutet, zum Gehen außerstande zu sein; „nicht mehr weitergehen“ stellt den Zusammenhang mit Durst und Erschöpfung klar, ohne eine Ursache hinzuzufügen.
- source_word: ወድቀ (wadqa)
  choice: fiel hin
  rationale: Das Verb bedeutet „fallen“; „fiel hin“ gibt den körperlichen Zusammenbruch schlicht wieder.
theological_decisions:
- issue: Zuordnung des Brotes, des Wasserschlauchs und des Kindes beim Aufladen
  choice: Die schwerfällige Reihung „lud sie Hagar auf die Schulter, dazu das Kind“ bleibt im Haupttext erhalten.
  alternative: „gab sie Hagar und dem Kind“
  rationale: Die konkrete Bedeutung von አስከማ als Aufladen beziehungsweise Auf-die-Schulter-Legen soll nicht verallgemeinert werden. Zugleich lässt die Satzfügung offen, wie genau „das Kind“ syntaktisch zum Aufladen gehört; diese Spannung wird nicht stillschweigend beseitigt.
- issue: Bezugswort des femininen Singularsuffixes bei ፈነዋ
  choice: „schickte sie fort“, bezogen auf Hagar
  alternative: „schickte sie beide fort“
  rationale: Das Objektsuffix ist feminin Singular und bezeichnet daher Hagar, auch wenn das Kind selbstverständlich mit ihr fortgeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp und parataktisch; nur dort, wo es für einen natürlichen deutschen Satz nötig ist, werden zeitliche Beziehungen ausdrücklich formuliert.
