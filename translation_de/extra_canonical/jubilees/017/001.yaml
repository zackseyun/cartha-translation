base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: de
  text: Und der Herr wusste, dass Abraham sich in all seinen Prüfungen als treu erwies. Denn er hatte ihn in seinem Land und durch die Hungersnot geprüft; er hatte ihn durch den Reichtum der Könige geprüft und nochmals durch seine Frau, als sie ihm weggenommen wurde, sowie durch die Beschneidung. Auch durch Ismael und Hagar, seine Dienerin, hatte er ihn geprüft, als er sie fortschickte. In allem, womit er ihn prüfte, wurde Abraham als treu befunden. Seine Seele wurde nicht ungeduldig, und er zögerte nicht zu handeln; denn er war treu und liebte den Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንዳቤሁ
  choice: Prüfungen
  rationale: Der Kontext wird vom wiederholten Verb »prüfen« bestimmt; »Prüfungen« gibt diesen Zusammenhang besser wieder als »Bedrängnisse«.
- source_word: በምድሩ
  choice: in seinem Heimatland
  rationale: Das Substantiv bezeichnet Land oder Gebiet; »Heimatland« macht hier verständlich, dass Abrahams frühere Lebensumstände gemeint sind, ohne ein bestimmtes Land zu ergänzen.
- source_word: በብዕለ፡ ነገሥት
  choice: durch den Reichtum der Könige
  rationale: Die ungewöhnliche und möglicherweise mehrdeutige Wendung wird eng am überlieferten Wortlaut wiedergegeben, statt historisch harmonisiert zu werden.
- source_word: ኢተአገተት፡ ነፍሱ
  choice: Seine Seele wurde nicht ungeduldig
  rationale: Die ausdrückliche Nennung der Seele bleibt erhalten; »wurde nicht ungeduldig« vermittelt Abrahams innere Standhaftigkeit.
- source_word: ኢጐንደየ፡ ገቢሮተ
  choice: er zögerte nicht zu handeln
  rationale: Die Wendung bezeichnet fehlenden Aufschub bei der Ausführung; die deutsche Formulierung ist natürlich und bewahrt den aktiven Sinn.
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: liebte den Herrn
  rationale: Das wörtliche »ein Liebhaber des Herrn« wird idiomatisch als dauerhafte Liebe zum Herrn ausgedrückt.
theological_decisions:
- issue: Göttliche Prüfung und Abrahams Treue
  choice: Der Herr prüft Abraham, und Abraham wird in den Prüfungen als treu befunden.
  alternative: Die Prüfungen lediglich als allgemeine Leiden oder Versuchungen darstellen.
  rationale: Der Quelltext wiederholt ausdrücklich das Verb »prüfen« und verbindet damit die Feststellung von Abrahams Treue; diese Spannung wird beibehalten.
- issue: Bezug des Fortschickens
  choice: »als er sie fortschickte« bezieht sich auf Ismael und Hagar.
  alternative: Nur Hagar als fortgeschickte Person verstehen.
  rationale: Die pluralische Form im Quelltext stützt den Bezug auf beide Personen; der deutsche Plural bewahrt diese Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum ge'ezischen Text. Die wiederholte Prüfungsstruktur bleibt erkennbar, wird aber durch Satzteilung lesbar gestaltet. Keine konfessionellen Deutungen wurden ergänzt.
