  yaml_path: translation/extra_canonical/jubilees/017/002.yaml
  text: And the Lord said to him, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your beloved son whom you love, Isaac, and go into the high land, and offer him there on one of the mountains that I will show you.” And he rose early in the morning and saddled his donkey and took two of his young servants with him, and Isaac his son; and he split the wood of the offering and went to the place on the third day, and he saw the place from afar. And he came to a well of water, and he said to his young servants, “Stay here with the donkey, and I and the boy will go on, and when we have worshiped we will return to you.” And he took the wood of the sacrifice and laid it on Isaac his son, and he took in his hand the fire and the knife. And the two of them went together to that place.
translation:
  language: de
  text: Und er erinnerte sich an sein Wort, das er an dem Tag gesprochen hatte, als Lot sich von ihm trennte. Er freute sich, weil der Herr ihm Nachkommen auf der Erde gegeben hatte, damit sie das Land als Erbe besitzen würden, und er pries den Schöpfer aus vollem Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die bereitgestellte ge'ezische Quellzeile ist als Quellvers 3 ausgewiesen und enthält diesen Text. Sie entspricht weder der angegebenen Referenz Jub 17,2 noch dem beigefügten englischen Text, der von der Opferung Isaaks handelt.
    reason: Die Metadaten weisen eine erhebliche Vers- und Textabweichung auf. Die Übersetzung folgt gemäß Auftrag der tatsächlich bereitgestellten originalsprachlichen Quellzeile und macht die Diskrepanz transparent.
lexical_decisions:
- source_word: ዘርአ (zarʾa)
  choice: Nachkommen
  rationale: Das äthiopische Wort bedeutet wörtlich „Same“, bezeichnet hier aber Abrahams menschliche Nachkommenschaft; „Nachkommen“ ist im Deutschen natürlich und bewahrt den kollektiven Sinn.
- source_word: ይረሳ (yǝrasa)
  choice: als Erbe besitzen
  rationale: Das Verb bezeichnet das Erben beziehungsweise die Inbesitznahme als Erbe. Die Formulierung gibt beide Bedeutungsanteile verständlich wieder.
- source_word: በኵሉ አፉሁ (bakʷǝllu ʾafuhu)
  choice: aus vollem Mund
  rationale: Die wörtliche Wendung „mit seinem ganzen Mund“ drückt uneingeschränktes, offen ausgesprochenes Lob aus; die deutsche idiomatische Entsprechung wahrt dieses Bild.
- source_word: ለፈጣሪ (la-fäṭari)
  choice: den Schöpfer
  rationale: Der bestimmte Gottesbeiname wird als direktes Ziel des Preisens wiedergegeben.
theological_decisions:
- issue: Bezug von „sein Wort“
  choice: sein Wort
  alternative: das Wort
  rationale: Das Possessivsuffix des äthiopischen Textes bleibt erhalten. Der Kontext kann bestimmen, wessen Wort gemeint ist; die Übersetzung legt dies nicht zusätzlich fest.
- issue: Numerus der erbenden Nachkommenschaft
  choice: damit sie das Land als Erbe besitzen würden
  alternative: damit er das Land als Erbe besitzen würde
  rationale: „Nachkommen“ ist im Deutschen formal pluralisch und gibt den kollektiven „Samen“ natürlich wieder. Die Aussage wird nicht auf Abraham selbst umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax ist lesbar gegliedert, während die wiederholte Erzählfolge des Quelltexts und zentrale biblische Begriffe wie „Herr“, „Nachkommen“, „Land“ und „Schöpfer“ bewahrt bleiben.
