    text: Die bereitgestellte ge'ezische Quellzeile ist als Quellvers 3 ausgewiesen und enthält diesen Text. Sie entspricht weder der angegebenen Referenz Jub 17,2 noch dem beigefügten englischen Text, der von der Opferung Isaaks handelt.
    reason: Die Metadaten weisen eine erhebliche Vers- und Textabweichung auf. Die Übersetzung folgt gemäß Auftrag der tatsächlich bereitgestellten originalsprachlichen Quellzeile und macht die Diskrepanz transparent.
  revision_rationale: Die Revision klärt den Bezug des erinnerten göttlichen Wortes, stellt die Singularform des Erbens wieder her, ohne über den genauen semantischen Träger hinauszugehen, und gibt die Schlusswendung näher am ge'ezischen Bild wieder. Die notwendige Diskrepanz-Fußnote bleibt unverändert erhalten.
