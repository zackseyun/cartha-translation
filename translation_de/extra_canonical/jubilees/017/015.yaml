base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/015.yaml
  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: de
  text: 'Als ich ihn rief.[a] Und es geschah in der siebten Jahrwoche, im ersten Jahr, im ersten Monat dieses Jubiläums, am zwölften Tag dieses Monats: Im Himmel ergingen Worte über Abraham, dass er in allem, was er sagte, treu war; und er liebte den Herrn und war in jeder Prüfung treu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung knüpft an den vorhergehenden Zusammenhang an; die Verbform lautet erste Person Singular: „ich rief ihn“.'
    reason: Die Anmerkung erklärt die am Versanfang isoliert wirkende Anschlusswendung und sichert die im Geʽez ausdrücklich markierte erste Person Singular.
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: Als ich ihn rief
  rationale: 'Die Verbform ist 1. Person Singular mit Objektsuffix der 3. Person Singular: „ich rief ihn“. Die einleitende Konjunktion wird im Deutschen temporal wiedergegeben.'
- source_word: ሱባዔ፡ ሳብዕ
  choice: siebte Jahrwoche
  rationale: ሱባዔ bezeichnet hier im chronologischen System des Jubiläenbuchs eine Siebenerperiode von Jahren; „Jahrwoche“ ist präziser als das missverständliche „Woche“.
- source_word: ኮነ፡ ቃላት፡ በሰማያት፡ በእንተ፡ አብርሃም
  choice: Im Himmel wurden Worte über Abraham gesprochen
  rationale: Die idiomatische deutsche Passivform vermittelt, dass im Himmel eine Äußerung bzw. Beratung über Abraham stattfand, ohne einen Sprecher zu ergänzen.
- source_word: መሃይምን / ምእመነ
  choice: treu war / treu blieb
  rationale: Die wiederholte Treueaussage wird bewahrt; beim zweiten Vorkommen verdeutlicht „blieb“ natürlich, dass Abraham sich auch unter Prüfung als treu erwies.
- source_word: ምንዳቤ
  choice: Prüfung
  rationale: Im Kontext bezeichnet das Wort eine Erprobung oder Prüfung; „Prüfung“ wahrt den theologischen Zusammenhang, ohne die Art der Prüfung näher festzulegen.
theological_decisions:
- issue: Gegenstand von Abrahams Treue in „in allem, was er sagte“
  choice: dass er in allem, was er sagte, treu war
  alternative: dass er allem glaubte, was ihm gesagt wurde
  rationale: Die vorliegende Textgestalt enthält eine Relativform mit der Bedeutung „was er spricht/sagt“. Die syntaktische Spannung wird nicht durch eine theologisch naheliegende Umdeutung auf Gottes Verheißungen beseitigt.
- issue: Himmlische Worte über Abraham
  choice: Im Himmel wurden Worte über Abraham gesprochen
  alternative: im Himmel erging ein Wort über Abraham
  rationale: Der Plural „Worte“ wird erhalten und kein göttlicher Sprecher ausdrücklich eingesetzt, da der Ausgangstext ihn nicht nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologische Fachsprache des Jubiläenbuchs wird mit „Jahrwoche“ und „Jubiläum“ beibehalten. Der Doppelpunkt ordnet die lange Zeitangabe und die anschließende himmlische Aussage lesefreundlich, ohne den Inhalt zu glätten.
