  yaml_path: translation/extra_canonical/jubilees/017/003.yaml
  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: de
  text: Und er erinnerte sich an das Wort, das Gott zu ihm gesprochen hatte, als Lot sich von ihm trennte. Er freute sich, weil der Herr ihm Nachkommen[a] auf der Erde gegeben hatte, um die Erde zu erben, und pries den Schöpfer mit seinem ganzen Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Samen.'
    reason: Die Fußnote bewahrt die konkrete Ausgangsmetapher hinter der natürlichen deutschen Wiedergabe „Nachkommen“.
lexical_decisions:
- source_word: ቃሎ፡ ዘተናገሮ፡
  choice: das Wort, das Gott zu ihm gesprochen hatte
  rationale: ቃል steht im Singular; das Possessiv- und das Objektsuffix weisen im Kontext auf Gottes Wort an Abraham. Die ausdrückliche Nennung Gottes vermeidet im Deutschen eine irreführende Pronomenfolge.
- source_word: ዘርአ፡
  choice: Nachkommen
  rationale: Das Wort bedeutet wörtlich „Samen“, bezeichnet hier aber kollektiv Abrahams Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch natürlich und wahrt den Sinn.
- source_word: ይረሳ፡ ለምድር፡
  choice: damit sie die Erde erbten
  rationale: Das Verb gehört zur Wurzel ወረሰ „erben“. Die deutsche Pluralform stimmt mit der kollektiven Wiedergabe „Nachkommen“ überein.
- source_word: በኵሉ፡ አፉሁ፡
  choice: mit seinem ganzen Mund
  rationale: Die konkrete Bildsprache „mit seinem ganzen Mund“ wird bewahrt, statt sie deutend durch „von ganzem Herzen“ zu ersetzen.
- source_word: ለፈጣሪ፡
  choice: den Schöpfer
  rationale: Direkte und kontextgerechte Wiedergabe des Titels „Schöpfer“.
theological_decisions:
- issue: Sprecher des erinnerten Wortes
  choice: Gott wird als Sprecher ausdrücklich genannt.
  alternative: „das Wort, das er zu ihm gesprochen hatte“
  rationale: Der Ge’ez-Text hat zwar pronominale Formen, doch ihr Bezug ist im Erzählzusammenhang Gottes Verheißung an Abraham. Die explizite Benennung verhindert, dass Abraham fälschlich als Sprecher verstanden wird, ohne den theologischen Gehalt zu erweitern.
- issue: Bezug des Erbens
  choice: Die Nachkommen erben die Erde.
  alternative: Abraham erbt die Erde.
  rationale: „Nachkommen“ gibt das kollektive ዘር wieder; der finale Satz wird entsprechend natürlich auf diese Nachkommenschaft bezogen. Die Formulierung wahrt zugleich die Verheißungsspannung zwischen Abraham und seinen Nachkommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Erde“ und das körperhafte Bild „mit seinem ganzen Mund“ bleiben als Merkmale des Ausgangstextes erhalten; unnötig altertümliche Formen werden vermieden.
