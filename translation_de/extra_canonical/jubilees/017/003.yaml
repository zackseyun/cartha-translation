revisions:
- from: Und er erinnerte sich an das Wort, das Gott zu ihm gesprochen hatte, als Lot sich von ihm trennte. Er freute sich, weil der Herr ihm Nachkommen[a] auf der Erde gegeben hatte, damit sie die Erde erbten, und pries den Schöpfer mit seinem ganzen Mund.
  to: Und er erinnerte sich an das Wort, das Gott zu ihm gesprochen hatte, als Lot sich von ihm trennte. Er freute sich, weil der Herr ihm Nachkommen[a] auf der Erde gegeben hatte, um die Erde zu erben, und pries den Schöpfer mit seinem ganzen Mund.
  rationale: Die Revision beschränkt sich auf die finale Wendung. „Um die Erde zu erben“ bewahrt die Zweckbeziehung von ከመ und die Bedeutung von ወረሰ („erben“), ohne den im knappen geʿezischen Satz nicht ausdrücklich festgelegten Bezug durch ein deutsches Pluralpronomen zu entscheiden.
