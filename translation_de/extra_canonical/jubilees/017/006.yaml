  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the servant woman. Whatever Sarah says to you, listen to her voice and do it.”
translation:
  language: de
  text: 'dass er sie von sich fortschicken sollte.a Und der Herr sprach zu Abraham: „Lass es dir wegen des Jungen und der Sklavin nicht leid sein. Auf alles, was Sara dir sagt, höre und handle danach.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: dass er sie von sich fortschicken sollte
  rationale: Die Verbform setzt syntaktisch den Gedanken des vorherigen Verses fort und bezeichnet das beabsichtigte beziehungsweise erwogene Fortschicken, nicht bereits eine vollzogene Handlung.
- source_word: ሕፃን
  choice: Jungen
  rationale: Bezeichnet hier den Knaben Ismael; „Junge“ ist im modernen Deutsch natürlich und altersbezogen.
- source_word: ወለት
  choice: Sklavin
  rationale: Das Wort bezeichnet in diesem Zusammenhang die unfreie Frau Hagar. „Sklavin“ gibt ihren sozialen Status klarer wieder als das heute mehrdeutige „Magd“.
- source_word: ስማዕ፡ ቃለ፡ ወግበር
  choice: Höre auf … und handle danach
  rationale: Gibt sowohl die Aufforderung zum Hören beziehungsweise Gehorchen als auch den ausdrücklichen Handlungsauftrag natürlich wieder.
theological_decisions:
- issue: Fortschicken Hagars und Ismaels
  choice: Satzfragment als Fortsetzung des vorherigen Verses
  alternative: „Er schickte sie von sich fort.“
  rationale: Die äthiopische Verbform und der Erzählablauf sprechen dafür, dass hier noch der im vorherigen Vers genannte Anlass des Kummers beschrieben wird; die tatsächliche Ausführung folgt erst nach Gottes Rede.
- issue: Göttliche Aufforderung bezüglich Saras Worten
  choice: „Höre auf alles, was Sara dir sagt, und handle danach.“
  alternative: „Höre auf ihre Stimme und tue es.“
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den Gehorsams- und Handlungsaspekt, ohne die Aussage konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Nebensatz bleibt bewusst als versübergreifende syntaktische Fortsetzung stehen. „In deinen Augen“ erhält die Bildlichkeit des Ausgangstextes; „schlimm sein“ ist verständlich und vermeidet eine unnötige psychologische Präzisierung.
