  text: And He opened her eyes and saw a well of water, and she went and filled the skin with water and gave him drink.
translation:
  language: de
  text: Und er öffnete ihr die Augen, und sie sah einen Brunnen mit Wasser. Sie ging, füllte den Wasserschlauch mit Wasser und gab ihm zu trinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ፡
  choice: Und er öffnete ihr die Augen
  rationale: Das Verb ወከሠተ steht in der 3. Person Singular Maskulinum; das Suffix an አዕይንቲሃ bezeichnet ihre Augen. Der männliche, aus dem Kontext erschlossene Handelnde wird nicht ausdrücklich als Gott benannt.
- source_word: ዐዘቅተ፡ ማይ፡
  choice: einen Wasserbrunnen
  rationale: Die Wortgruppe bezeichnet eine Wasserquelle bzw. einen Brunnen. „Wasserbrunnen“ bewahrt die ausdrückliche Nennung des Wassers und passt zum erzählerischen Kontext.
- source_word: ዝቃ፡
  choice: Wasserschlauch
  rationale: Das Gefäß ist ein tragbarer Schlauch für Wasser; „Wasserschlauch“ ist im Deutschen eindeutig und natürlich.
- source_word: ወአስተየቶ፡
  choice: und gab ihm zu trinken
  rationale: Die kausative Verbform bezeichnet das Tränken bzw. Zu-trinken-Geben; das maskuline Objektsuffix wird mit „ihm“ wiedergegeben.
theological_decisions:
- issue: Subjekt des Augenöffnens
  choice: „er“
  alternative: „sie“
  rationale: Die maskuline Verbform ወከሠተ verlangt in diesem Satz ein männliches Subjekt, während die folgenden Handlungen mit femininen Verbformen ausgedrückt werden. Daher ist „sie öffnete“ grammatisch nicht zu bevorzugen. Der Name Gottes wird nicht ergänzt, weil er im vorgelegten Vers selbst nicht ausdrücklich steht.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die wiederholte Nennung von „Wasser“ folgt der geʿezischen Vorlage; „Da“ glättet lediglich den deutschen Erzählfluss, ohne die Abfolge der Handlungen zu verändern.
