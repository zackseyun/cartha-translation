  text: For in Isaac a name and seed will be called for you. And concerning the son of this servant woman,
translation:
  language: de
  text: Denn in Isaak werden dir Name und Nachkommenschaft genannt werden. Und was den Sohn dieser Sklavin betrifft,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Gibt die begründende Konjunktion natürlich und präzise wieder.
- source_word: በይስሐቅ
  choice: in Isaak
  rationale: Bewahrt die Präposition und den direkten Bezug auf Isaak.
- source_word: ይጼዋዕ፡ ለከ፡ ስም፡ ወዘርእ
  choice: wird dir Name und Nachkommenschaft zugesprochen werden
  rationale: Bewahrt das Passiv von ‚rufen/nennen‘, formuliert aber im Deutschen idiomatisch; sowohl ‚Name‘ als auch ‚Nachkommenschaft‘ bleiben ausdrücklich erhalten.
- source_word: ወበእንተ
  choice: Und was … betrifft
  rationale: Gibt die thematische Wendung wieder und erhält den Anschluss an den folgenden Text.
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: den Sohn dieser Sklavin
  rationale: Gibt die soziale Stellung der Frau klar wieder; der Satz bleibt entsprechend der Vorlage unvollständig und setzt im Folgevers fort.
theological_decisions:
- issue: Bedeutung der Berufungsformel bezüglich Isaak
  choice: Name und Nachkommenschaft werden ‚zugesprochen‘
  alternative: Nachkommenschaft wird ‚genannt‘ oder ‚berufen‘
  rationale: Die ungewöhnliche Verbindung von ‚Name‘ und ‚Nachkommenschaft‘ wird nicht auf eine einzelne dogmatische Deutung eingeengt.
- issue: Bezeichnung der Mutter des anderen Sohnes
  choice: Sklavin
  alternative: Magd / Dienerin
  rationale: ‚Sklavin‘ bildet den rechtlich-sozialen Status deutlicher ab, ohne die Frau namentlich zu identifizieren oder Zusatzinformationen einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abschließende, im Quelltext weiterführende Satzkonstruktion wird durch das Komma bewusst offen gehalten.
