  terminology: „Sklavin“ ist für አመቱ/„diese Sklavin“ konsequent und angemessen. „Isaak“ entspricht der üblichen deutschen Namensform. „Erbe sein“ bewahrt gegenüber „erben“ sinnvoll die Aussage über den Erbenstatus.
