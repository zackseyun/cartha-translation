  text: …and her son, for the son of this servant woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: de
  text: … und ihren Sohn; denn der Sohn dieser Sklavin soll nicht zusammen mit meinem Sohn Isaak Erbe sein.“ Diese Sache aber betrübte Abraham sehr – wegen seiner Sklavin und wegen seines Sohnes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Text endet mit ከመ (etwa „dass/wie“) und leitet grammatisch zum folgenden Vers über.
    reason: Das abschließende Wort ist im überlieferten Vers vorhanden, lässt sich innerhalb der deutschen Versgrenze aber nicht als vollständiger Satzteil wiedergeben.
lexical_decisions:
- source_word: ወወልዳ (wa-waldā)
  choice: … und ihren Sohn
  rationale: Die Worte setzen den im vorigen Vers begonnenen Ausspruch fort. Die Auslassungspunkte machen den fragmentarischen Versanfang sichtbar, ohne die fehlenden Worte hier zu ergänzen.
- source_word: እስመ (ʾəsma)
  choice: denn
  rationale: Gibt die begründende Funktion natürlich und präzise wieder.
- source_word: ወልዳ፡ ለዛ፡ ወሰት (waldā la-zā wasat)
  choice: der Sohn dieser Sklavin
  rationale: „Sklavin“ bildet den rechtlichen und sozialen Status deutlicher ab als das mildere „Magd“; das Demonstrativum wird mit „dieser“ bewahrt.
- source_word: ኢይወርስ (ʾiy-warras)
  choice: soll nicht … Erbe sein
  rationale: Bewahrt den Erbkontext und den kategorischen Charakter der Aussage; idiomatischer als „wird nicht erben“ in dieser Konstruktion.
- source_word: ወማኅዘነ፡ ውእቱ፡ ቃል (wa-maḥzana wəʾətu qāl)
  choice: Diese Sache aber war … sehr betrüblich
  rationale: „Sache“ gibt qāl hier kontextgemäß als Angelegenheit bzw. Gesagtes wieder; „sehr betrüblich“ wahrt die starke emotionale Aussage.
- source_word: በቅድመ፡ አዕይንተ፡ አብርሃም (ba-qədma ʾaʿəyǝnta ʾAbrāhām)
  choice: in Abrahams Augen
  rationale: Erhält die anschauliche semitische Wendung, die auch im modernen Deutschen verständlich ist.
- source_word: አመቱ (ʾamat-u)
  choice: seiner Sklavin
  rationale: Entspricht derselben Statusbezeichnung wie zuvor und vermeidet einen unbegründeten Wechsel zu „Magd“.
theological_decisions:
- issue: Art und Umfang des gemeinsamen Erbens
  choice: soll nicht zusammen mit meinem Sohn Isaak Erbe sein
  alternative: wird nicht mit meinem Sohn Isaak erben
  rationale: Die gewählte Form wahrt die Aussage über den Erbenstatus, ohne zu präzisieren, ob nur ein bestimmtes Erbe oder jede Form von Erbteil gemeint ist.
- issue: Abrahams Betrübnis
  choice: wegen seiner Sklavin und wegen seines Sohnes
  alternative: um seiner Magd und seines Sohnes willen
  rationale: Beide im Ge’ez ausdrücklich genannten Gründe bleiben erhalten; die Übersetzung bewertet weder Abrahams Beziehung zu Hagar noch Ismaels Stellung weitergehend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt durch Auslassungspunkte als Fortsetzung des vorigen Verses erkennbar. „Sklavin“ wird bewusst konsequent verwendet, da es den Ge’ez-Ausdruck und den damaligen Rechtsstatus genauer wiedergibt als „Magd“.
