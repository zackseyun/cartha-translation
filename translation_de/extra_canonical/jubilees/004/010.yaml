  verdict: revise
  source_fidelity: Der Entwurf gibt die im geʿezischen Gesamtzusammenhang belegte Formel „und er nannte ihn Henoch“ sinngemäß wieder, doch diese steht in Jub 4,17, nicht in Jub 4,10. Jub 4,10 handelt von Sets Heirat mit Azura und der Geburt des Enos. Der englische Audit-Text ist daher ebenfalls dem falschen Vers zugeordnet.
  naturalness: „Und er gab ihm den Namen Henoch“ wäre für die betreffende Namensgebung natürliches modernes Deutsch. Für die tatsächlich referenzierte Stelle ist jedoch ein vollständiger Ersatz erforderlich.
  terminology: Die etablierten deutschen Namensformen Set und Enos werden verwendet; Azura folgt der in der Charles-Ausgabe gebräuchlichen Umschrift. „Jahrwoche“ gibt die für Jubiläen charakteristische Siebenerperiode präzise wieder.
  issues:
  - severity: high
    issue: Versreferenz und übersetzter Text stimmen nicht überein.
    rationale: Jub 4,10 lautet nicht „und er nannte ihn Henoch“, sondern berichtet, dass Set Azura, seine Schwester, zur Frau nahm und sie Enos gebar. Die Namensgebung Henochs gehört zu Jub 4,17. Der englische Audit-Trail wiederholt dieselbe Fehlzuordnung.
  revised_text: In der fünften Jahrwoche des fünften Jubiläums nahm Set seine Schwester Azura zur Frau, und im vierten Jahr gebar sie ihm Enos.
  revised_footnotes: []
  revision_rationale: Der Text wurde vollständig auf den Inhalt von Jub 4,10 korrigiert. Das im geʿezischen Text lediglich als „im vierten [Jahr]“ überlieferte chronologische Detail wird nicht durch eine nicht ausdrücklich bezeichnete weitere Jahrwoche ergänzt.
