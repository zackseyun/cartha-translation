  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: de
  text: Und im zwölften Jubiläum, in dessen siebter Jahrwoche, nahm er sich eine Frau. Sie hieß Edni, die Tochter Daniels, einer Tochter der Schwester seines Vaters. Im sechsten Jahr dieser Jahrwoche gebar sie ihm einen Sohn, und er gab ihm den Namen
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: Jubiläum
  rationale: Bezeichnet im Buch der Jubiläen einen Zeitraum von sieben Jahrwochen; die etablierte deutsche Wiedergabe „Jubiläum“ bewahrt den Fachbegriff.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier eine Siebenerperiode von Jahren. „Jahrwoche“ ist präzise und im Deutschen verständlich.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm er sich eine Frau
  rationale: Formale und zugleich natürliche Wiedergabe der Heiratsformel.
- source_word: ወጸውዐ፡ ስሞ
  choice: und er gab ihm den Namen
  rationale: Wörtlich etwa „und er nannte seinen Namen“; die gewählte deutsche Formulierung ist idiomatisch und lässt den im nächsten Vers folgenden Namen offen.
theological_decisions:
- issue: Verwandtschaftsangabe zu Edni
  choice: „eine Tochter Daniels, der Tochter der Schwester seines Vaters“
  alternative: „eine Tochter Daniels und eine Tochter der Schwester seines Vaters“
  rationale: Die gewählte Fassung bildet die verschachtelte Genitivfolge des überlieferten Textes ab, ohne die genealogische Beziehung durch eine ergänzte Konjunktion eigenmächtig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kalendarischen Fachbegriffe bleiben erkennbar; der unvollständige Schluss wird beibehalten, weil der Name erst im anschließenden Text folgt. Die eingeklammerte Wiederholung „[nahm sich eine Frau]“ im Geʿez-Text wurde als offenkundige Dittographie nicht in den Haupttext aufgenommen.
