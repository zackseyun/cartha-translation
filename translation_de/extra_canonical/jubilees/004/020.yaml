  to: Und im zwölften Jubiläum, in dessen siebter Jahrwoche, nahm er sich eine Frau. Sie hieß Edni, die Tochter Daniels, einer Tochter der Schwester seines Vaters. Im sechsten Jahr dieser Jahrwoche gebar sie ihm einen Sohn, und er gab ihm den Namen
  rationale: Die einzige sichere Korrektur betrifft die deutsche Grammatik der genealogischen Apposition. Die Revision bewahrt die im Geʿezischen und im englischen Audit Trail vorliegende, möglicherweise befremdliche Angabe „Tochter Daniels, Tochter der Schwester seines Vaters“, ohne eine Konjunktion einzufügen oder die Verwandtschaft anders zu bestimmen.
