base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/012.yaml
  text: He was the first to write a testimony[12], and he testified to the children of men among the generations of the earth, and recounted the weeks of the jubilees, and made known the days of the years, and set in order the months,
translation:
  language: de
  text: Er war der Erste, der ein Zeugnis niederschrieb[a], und er legte den Menschenkindern unter den Generationen auf Erden Zeugnis ab. Er berichtete von den Wochen der Jubiläen, machte die Tage der Jahre bekannt und ordnete die Monate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch mit „einen Bericht aufzeichnete“ oder „ein Zeugnis schriftlich festhielt“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምዐ
  choice: Zeugnis
  rationale: Das Substantiv bezeichnet ein Zeugnis, eine Bezeugung oder einen schriftlichen Bericht. „Zeugnis“ bewahrt die Verbindung zum unmittelbar folgenden Verb „Zeugnis ablegen“.
- source_word: አስምዐ
  choice: legte … Zeugnis ab
  rationale: Die verbale Form wird konkordant mit ስምዐ wiedergegeben und bewahrt so die rhetorische Wiederaufnahme des Ausgangstextes.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: Menschenkinder
  rationale: Die traditionelle, wörtlich geprägte Bezeichnung bleibt verständlich und entspricht der kollektiven Bedeutung „Menschen“.
- source_word: ትዝምደ፡ ምድር
  choice: Geschlechter der Erde
  rationale: „Geschlechter“ gibt den genealogischen beziehungsweise generationellen Sinn wieder, ohne ihn auf bloße Zeitabschnitte zu verengen.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: Wochen der Jubiläen
  rationale: Die kalendarische Fachsprache des Jubiläenbuches wird formal bewahrt; gemeint sind Siebenerperioden innerhalb der Jubiläen.
- source_word: ሰርዐ
  choice: ordnete
  rationale: Das Verb bezeichnet das geordnete Festlegen oder Einrichten und passt zum kalendarischen Zusammenhang.
theological_decisions:
- issue: Charakter von Henochs schriftlicher Tätigkeit
  choice: „ein Zeugnis niederschrieb“
  alternative: „einen Bericht aufzeichnete“
  rationale: „Zeugnis“ bewahrt die mögliche forensische und offenbarungsbezogene Bedeutung, ohne den Ausdruck ausschließlich als neutrale Chronik zu deuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter kalendarischer Fachterminologie. Die Wiederholung von „Zeugnis“ bildet die Wortverwandtschaft des ge’ezischen Substantivs und Verbs ab; „inmitten der Geschlechter“ wahrt die etwas offene räumlich-genealogische Formulierung.
