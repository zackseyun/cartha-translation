  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: de
  text: 'Und er zählte die Sabbate der Jahre auf, wie wir sie ihm bekannt gemacht hatten. In einem Traumgesicht sah er, was geschehen war und was sein wird: was den Menschenkindern in ihren Generationen bis zum Tag des Gerichts widerfahren wird. Alles sah und erkannte er; er schrieb sein Zeugnis nieder und legte das Zeugnis auf die Erde …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Quellenausschnitt bricht an dieser Stelle nach „auf/über der Erde“ mitten im Satz ab. Eine frühere Wiedergabe über Adams fehlende siebzig Jahre gehört nicht zu diesem Vers, sondern zu Jubiläen 4,30.
    reason: Der vorgelegte Ge’ez-Text ist am Ende unvollständig; zugleich wird die dokumentierte frühere Fehlzuordnung transparent berichtigt.
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: Jahrsabbate
  rationale: Die wörtliche Verbindung „Sabbate der Jahre“ bezeichnet gegliederte Sabbatzyklen von Jahren. „Jahrsabbate“ ist knapp, verständlich und bewahrt die sachliche Bildsprache.
- source_word: ነገረ
  choice: zählte … auf
  rationale: Das Verb kann „erzählen, berichten, darlegen“ bedeuten; im Zusammenhang mit den Jahrsabbaten gibt „aufzählen“ den rechnerisch-berichtenden Sinn natürlich wieder.
- source_word: በራእየ፡ ንዋሙ
  choice: in einem Traumgesicht
  rationale: Die Konstruktion bedeutet wörtlich „in der Vision seines Schlafes“. „Traumgesicht“ bewahrt sowohl Vision als auch Schlafbezug in idiomatischem Deutsch.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: Menschenkinder
  rationale: Die traditionelle anthropologische Wendung „Kinder der Menschen“ wird als „Menschenkinder“ würdig und kompakt wiedergegeben, ohne sie auf eine bestimmte Gruppe einzuengen.
- source_word: ዕለተ፡ ደይን
  choice: Tag des Gerichts
  rationale: Formale und theologisch offene Wiedergabe der eschatologischen Zeitangabe.
- source_word: ስምዖ
  choice: Zeugnis
  rationale: „Zeugnis“ erhält den forensischen und schriftlichen Sinn des Begriffs; „Bericht“ wäre enger und würde die mögliche theologische Tragweite abschwächen.
- source_word: አንበረ
  choice: hinterlegte
  rationale: Das Verb bezeichnet ein Setzen oder Niederlegen. Bei einem schriftlichen Zeugnis vermittelt „hinterlegte“ den Gedanken bewusster Aufbewahrung natürlicher als bloßes „legte“.
theological_decisions:
- issue: Reichweite von Henochs Zukunftsschau
  choice: „was den Menschenkindern in ihren Generationen bis zum Tag des Gerichts widerfahren wird“
  alternative: „wie es den Menschenkindern … ergehen wird“
  rationale: Die gewählte Fassung bewahrt die umfassende prophetische Perspektive des Ausgangstextes, ohne Art oder Vollzug des Gerichts konfessionell näher zu bestimmen.
- issue: Bedeutung des schriftlichen „Zeugnisses“
  choice: Zeugnis
  alternative: Bericht
  rationale: Der Quellbegriff kann mehr als eine neutrale Chronik bezeichnen. „Zeugnis“ lässt seine gerichtliche, prophetische oder dokumentarische Funktion bewusst offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht schriftsprachlichem biblischem Klang. Die Satzstruktur wurde für heutige Leser gegliedert, ohne die Abfolge von Offenbarung, Schau, Erkenntnis und Niederschrift zu verändern. Die Auslassung am Ende macht den Abbruch der bereitgestellten Quelle sichtbar.
