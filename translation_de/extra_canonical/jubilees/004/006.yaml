  text: Und deshalb tun wir, wenn wir vor den Herrn, unseren Gott, treten, alle Sünden kund
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናየድዕ
  choice: bekennen wir
  rationale: Das Verb kann hier ein Bekanntmachen bzw. Eingestehen ausdrücken. Im Zusammenhang mit Sünden ist „bekennen“ natürlich und sachlich passend.
- source_word: መጻእነ ቅድመ
  choice: wenn wir vor … treten
  rationale: Gibt das Kommen vor Gottes Gegenwart in idiomatischem modernem Deutsch wieder.
- source_word: እግዚአብሔር አምላክነ
  choice: den Herrn, unseren Gott
  rationale: Die Quelle verwendet einen Herrentitel und „unseren Gott“, nicht ausdrücklich den Gottesnamen JHWH.
- source_word: ኵሎ ኀጢአተ
  choice: alle Sünden
  rationale: Formale und klare Wiedergabe der unvollständig anschließenden Nominalgruppe.
theological_decisions:
- issue: Art der Erklärung von Sünden
  choice: bekennen
  alternative: verkünden / erklären
  rationale: „Bekennen“ entspricht dem religiösen Kontext, ohne die Aussage durch eine nähere Bestimmung von Schuld, Vergebung oder Ritual theologisch zu erweitern.
- issue: Wiedergabe des Gottestitels
  choice: Herr
  alternative: HERR
  rationale: Der äthiopische Text bietet einen Titel für Gott, nicht den ausdrücklich markierten Eigennamen; daher wird keine Wiedergabe als „HERR“ importiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Unvollständigkeit des überlieferten Versabschnitts bleibt erhalten; es wird kein Objektzusatz oder Abschluss aus dem weiteren Kontext ergänzt.
