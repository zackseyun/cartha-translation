base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: de
  text: 'Und deshalb steht auf den himmlischen Tafeln geschrieben: »Verflucht ist, wer seinen Nächsten in böser Absicht schlägt.« Und alle, die es sehen und hören, sollen sagen: »So sei es!« Auch der Mensch, der es gesehen und nicht gemeldet hat,[a] soll ebenso verflucht sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende Textgestalt kann auch als »und gemeldet hat« gelesen werden; dem Zusammenhang nach ist jedoch »und nicht gemeldet hat« gemeint.
    reason: Dokumentiert die problematische positive Lesart der bereitgestellten ge’ezischen Textgestalt, während die kontextuell erforderliche Negation im Haupttext steht.
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Gibt die feste henochisch-jubiläische Wendung sachlich und in natürlichem Deutsch wieder.
- source_word: ዘይዘብጥ፡ ካልአ
  choice: wer seinen Nächsten … schlägt
  rationale: ይዘብጥ bezeichnet das Schlagen; ካልአ kann wörtlich »einen anderen« heißen, bezeichnet hier im Rechtsspruch jedoch den Mitmenschen bzw. Nächsten.
- source_word: በእኩይ
  choice: in böser Absicht
  rationale: Bewahrt den moralischen Gehalt von »böse/schlimm« und bezieht ihn idiomatisch auf die Absicht des Schlagenden.
- source_word: ይኩን
  choice: So sei es
  rationale: Entspricht der zustimmenden Bekräftigungsformel, ohne sie unnötig mit »Amen« zu vereinheitlichen.
- source_word: ርጉመ፡ ከማሁ
  choice: ebenso verflucht
  rationale: Gibt die Gleichstellung mit dem zuvor ausgesprochenen Fluch knapp und genau wieder.
theological_decisions:
- issue: Fluch über einen schweigenden Zeugen
  choice: »der es gesehen und nicht gemeldet hat«
  alternative: »der es gesehen und gemeldet hat«
  rationale: 'Der überlieferte Wortlaut in der Vorlage scheint aufgrund eines Text- bzw. OCR-Problems die positive Form zu bieten. Zusammenhang und Rechtslogik verlangen jedoch die Negation: Verflucht wird der Zeuge, der das Gesehene nicht meldet. Die abweichende Lesung wird in der Fußnote transparent gemacht.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtsspruch-Syntax. Die direkte Rede und die feierliche Bekräftigungsformel bleiben erhalten; altertümliche oder konfessionell geprägte Wendungen werden vermieden.
