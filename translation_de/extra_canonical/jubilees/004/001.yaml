- issue: Abgrenzung und Zuordnung des Verses
  choice: Der Vers berichtet von der Geburt Kains, Abels und Awans.
  alternative: Der Herr wies Kain wegen der Tötung Abels zurecht.
  rationale: Die Revisionsangaben stellen fest, dass der mitgelieferte ge'ezische Ausschnitt aus Jub 4,3–4 stammt und nicht zu Jub 4,1 gehört. Für die referenzierte Stelle wird daher der in der geprüften Überlieferung zu Jub 4,1 gehörende Geburtsbericht wiedergegeben, ohne die Fehlzuordnung in den Haupttext zu übernehmen.
