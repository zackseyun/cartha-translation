  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
translation:
  language: de
  text: Und er tötete ihn auf dem Feld, und sein Blut schrie von der Erde zum Himmel und klagte über ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und klagte ihn an“.'
    reason: Die Verbindung ይስኪ በእንተ kann eine Klage über bzw. wegen der betreffenden Person ausdrücken, aber auch eine gegen sie gerichtete Beschuldigung.
lexical_decisions:
- source_word: በገዳም
  choice: auf dem Feld
  rationale: Das Substantiv bezeichnet hier freies bzw. unbebautes Land; im Kain-und-Abel-Kontext ist „auf dem Feld“ die natürliche deutsche Wiedergabe.
- source_word: ጸርኀ
  choice: schrie
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien. „Schrie“ bewahrt die personifizierende Bildsprache des Blutes.
- source_word: እምድር፡ ውስተ፡ ሰማይ
  choice: von der Erde zum Himmel
  rationale: Gibt die räumliche Bewegung des Rufes formal und idiomatisch wieder.
- source_word: ይስኪ፡ በእንተ
  choice: klagte ihn an
  rationale: Die Konstruktion bezeichnet ein Klagen bzw. eine Beschuldigung in Bezug auf den Täter; „klagte ihn an“ ist im Deutschen natürlich und erhält den forensischen Unterton.
theological_decisions:
- issue: Personifikation des Blutes
  choice: „sein Blut … schrie … und klagte ihn an“
  alternative: „die Stimme seines Blutes schrie“
  rationale: Im vorliegenden Text ist das Blut selbst Subjekt. Eine ergänzte „Stimme“ würde zwar an Genesis 4 erinnern, stünde aber nicht ausdrücklich in dieser geezischen Vorlage.
- issue: Bezug des abschließenden Pronomens
  choice: 'Bezug auf den Täter: „ihn“'
  alternative: 'unpersönlich: „seinetwegen“'
  rationale: Der Zusammenhang legt eine gegen den Mörder gerichtete Klage nahe; die Fußnote bewahrt die formal mögliche kausale Nuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und erzählerisch; die Personifikation und die gerichtliche Spannung des Ausgangstextes werden bewahrt.
