  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: de
  text: Und er blieb weiterhin sechs Jahrjubiläen lang bei den Engeln Gottes; sie zeigten ihm alles, was auf der Erde und in den Himmeln ist, die Herrschaft der Sonne, und er schrieb alles auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: sechs Jahrjubiläen lang
  rationale: Gibt die technische Zeitangabe knapp und verständlich wieder, ohne sie rechnerisch aufzulösen.
- source_word: መላእክት፡ አምላክ
  choice: Engel Gottes
  rationale: Formale und natürliche Wiedergabe der Genitivverbindung.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: die Herrschaft der Sonne
  rationale: Bewahrt die ungewöhnliche und möglicherweise kosmologisch gemeinte Formulierung, statt sie als bloße Bewegung oder Laufbahn der Sonne zu deuten.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: und er schrieb alles auf
  rationale: „Aufschreiben“ gibt den dokumentierenden Sinn des Verbs im modernen Deutschen idiomatisch wieder.
theological_decisions:
- issue: Bezug der Herrschaft der Sonne
  choice: Als eigenes Satzglied in der Reihe beibehalten
  alternative: „einschließlich des Laufs der Sonne“
  rationale: Der Ausgangstext spricht ausdrücklich von der Herrschaft beziehungsweise Macht der Sonne; eine astronomische Präzisierung würde die genuine Deutungsspannung auflösen.
- issue: Am Versanfang überliefertes „Methusalah“
  choice: Nicht als selbstständiges Fragment in diesen Vers aufgenommen
  alternative: „Methusalah. Und er blieb dann …“
  rationale: Das Wort schließt syntaktisch den vorausgehenden Geburtsbericht ab und gehört trotz des bereitgestellten Textausschnitts nicht zum Sinngefüge dieses Verses; die geprüfte englische Konsultationsfassung bestätigt diese Abgrenzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit geteilt. „Jahrjubiläen“ bleibt als sachliterarischer Terminus erhalten; die fremdartige Wendung „Herrschaft der Sonne“ wird bewusst nicht geglättet. Die sachfremde englische Fußnote zur talionischen Vergeltung wurde nicht übernommen.
