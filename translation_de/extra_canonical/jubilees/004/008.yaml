  choice: Rechtschaffenheit
  rationale: Bezeichnet Geradheit, Richtigkeit oder aufrechtes Handeln. „Rechtschaffenheit“ bewahrt die ethische Bedeutung und unterscheidet den Begriff vom vorausgehenden „Recht“.
