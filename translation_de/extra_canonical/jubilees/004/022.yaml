base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: de
  text: Und er legte vor den Wächtern, die mit den Töchtern der Menschen gesündigt hatten, Zeugnis ab; denn diese hatten begonnen, sich mit den Töchtern der Menschen zu verbinden, um sich zu verunreinigen. Und Henoch legte gegen sie alle Zeugnis ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: Wächter
  rationale: Die traditionelle und im Henoch-Jubiläen-Kontext sachlich passende Wiedergabe für die Engelgruppe der Wächter.
- source_word: አበሱ
  choice: gesündigt hatten
  rationale: Gibt das moralisch-religiöse Fehlverhalten des ge'ezischen Verbs direkt und ohne konfessionelle Zusätze wieder.
- source_word: ይደመሩ
  choice: sich … zu verbinden
  rationale: Bewahrt den Sinn des Sich-Zusammentuns beziehungsweise Vereinigens; der sexuelle Zusammenhang ergibt sich aus Kontext und Folgesatz.
- source_word: ይርኩሱ
  choice: sich … zu verunreinigen
  rationale: Gibt die kultisch-moralische Verunreinigung wieder, ohne sie auf bloße körperliche Unreinheit zu verengen.
- source_word: አስምዐ
  choice: legte Zeugnis ab gegen
  rationale: Das Verb bezeichnet ein Bezeugen; die gegen die Wächter gerichtete Funktion wird im Deutschen mit „gegen“ natürlich ausgedrückt.
theological_decisions:
- issue: Identität der „Wächter“
  choice: Die Gruppenbezeichnung „Wächter“ bleibt stehen.
  alternative: „wachende Engel“ oder „Engelwächter“
  rationale: Der Quelltext nennt die traditionelle Gruppe, bezeichnet sie hier aber nicht ausdrücklich als Engel. Eine erklärende Präzisierung würde mehr festlegen als der Vers selbst.
- issue: Art der Verbindung mit den Menschentöchtern
  choice: „sich … verbinden“
  alternative: „sexuelle Beziehungen eingehen“
  rationale: Der Zusammenhang ist eindeutig belastet, doch die Quelle formuliert das Verb allgemeiner. Die Übersetzung bewahrt diese sprachliche Zurückhaltung und zugleich den Sinnzusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „legte Zeugnis … ab“ folgt der rhetorischen Struktur der Quelle; „Töchter der Menschen“ bleibt als traditionsgeprägte, allgemein verständliche Wendung erhalten.
