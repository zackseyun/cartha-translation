  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
translation:
  language: de
  text: 'was im Himmel und auf Erden, im Licht und in der Finsternis und überall geschehen wird. Adam und seine Frau trauerten vier Jahrwochen[a] lang um Abel. Im vierten Jahr der fünften Jahrwoche aber freuten sie sich wieder. Adam erkannte erneut seine Frau, und sie gebar ihm einen Sohn. Er gab ihm den Namen Set, denn er sagte: »Der Herr hat mir anstelle Abels einen anderen Nachkommen auf Erden erstehen lassen, weil Kain ihn getötet hat.« In der sechsten Jahrwoche zeugte Adam eine Tochter, Azura. Kain nahm seine Schwester Awan zur Frau, und am Ende des vierten Jubiläums gebar sie ihm Henoch. Im ersten Jahr der ersten Jahrwoche des fünften Jubiläums wurden auf Erden Häuser gebaut. Kain baute eine Stadt und benannte sie nach seinem Sohn Henoch. Adam erkannte Eva, seine Frau, und sie gebar neun weitere Söhne. In der fünften Jahrwoche des fünften Jubiläums nahm Set seine Schwester Azura zur Frau, und im vierten Jahr gebar sie ihm Enos. Er war der Erste, der auf Erden den Namen des Herrn anrief.
    Im siebten Jubiläum, in der dritten Jahrwoche, nahm Enos seine Schwester Noam zur Frau. Im dritten Jahr der fünften Jahrwoche gebar sie ihm einen Sohn, dem er den Namen Kenan gab. Am Ende des achten Jubiläums nahm Kenan seine Schwester Mualeleth zur Frau. Im neunten Jubiläum, im dritten Jahr der ersten Jahrwoche, gebar sie ihm einen Sohn, dem sie den Namen Mahalalel gaben. In der zweiten Jahrwoche des zehnten Jubiläums nahm Mahalalel Dina zur Frau. Sie war eine Tochter Barakiels und eine Tochter der Schwester seines Vaters.[b] Im sechsten Jahr der dritten Jahrwoche gebar sie ihm einen Sohn, dem sie den Namen Jared gaben. Denn in seinen Tagen stiegen die Engel des Herrn, die man die Wächter nennt, zur Erde herab, um die Menschenkinder zu unterweisen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine »Jahrwoche« umfasst sieben Jahre. Das Buch der Jubiläen gliedert seine Zeitrechnung in Jahrwochen und Jubiläen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich nach dem vorliegenden äthiopischen Text: »eine Tochter Barakiels, eine Tochter der Schwester seines Vaters«; gemeint ist offenbar eine Verwandte Mahalalels.'
    reason: textual_note
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Der Ausdruck bezeichnet im chronologischen System des Jubiläenbuches gewöhnlich eine Einheit von sieben Jahren; »Jahrwoche« ist im Deutschen knapp und eindeutig.
- source_word: አእመራ
  choice: erkannte
  rationale: Die traditionelle, auch im Deutschen verständliche biblische Umschreibung für den ehelichen Verkehr bewahrt die Ausdrucksweise der Quelle.
- source_word: ዘርአ
  choice: Nachkomme
  rationale: Das wörtliche »Same« ist hier ein kollektiver Ausdruck für Nachkommenschaft; »Nachkomme« gibt den Sinn natürlich wieder, ohne die Anspielung auf Gen 4,25 aufzulösen.
- source_word: ትጉሃነ
  choice: Wächter
  rationale: Dies ist die etablierte deutsche Wiedergabe der Bezeichnung für die Watchers und bewahrt ihren titelartigen Charakter.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: Menschenkinder
  rationale: Die formelhafte Bezeichnung wird würdevoll und quellenah wiedergegeben.
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Die äthiopische Gottesbezeichnung wird als Titel wiedergegeben, nicht als der ausdrücklich gesetzte Eigenname Jahwe.
theological_decisions:
- issue: Set als von Gott gewährter Ersatz für Abel
  choice: »Der Herr hat mir anstelle Abels einen anderen Nachkommen auf Erden erstehen lassen«
  alternative: »Gott hat mir einen anderen Samen gesetzt«
  rationale: Die gewählte Fassung bewahrt Gottes Handeln und die Ersatzbeziehung zu Abel, klingt aber in modernem Deutsch natürlich und legt keine weitergehende Lehre über Set fest.
- issue: Anrufung des Namens des Herrn durch Enos
  choice: »Er war der Erste, der auf Erden den Namen des Herrn anrief«
  alternative: »Er begann zuerst, den Namen des Herrn auszurufen«
  rationale: Die Formulierung bewahrt die kultisch-theologische Offenheit des Verbs zwischen Anrufen und öffentlichem Ausrufen, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Aufgabe der Wächter
  choice: »um die Menschenkinder zu unterweisen«
  alternative: »damit sie die Menschenkinder lehrten«
  rationale: Der finale Sinn des Quelltextes und die zunächst positiv formulierte Lehrfunktion werden erhalten, ohne spätere Ereignisse vorwegzunehmen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem biblischem Erzählton. Die wiederholten chronologischen Formeln bleiben sichtbar, werden aber syntaktisch geglättet. Der einleitende Satzteil und der Schluss bleiben als Fortsetzungen des umgebenden Zusammenhangs offen. Eigennamen folgen geläufigen deutschen beziehungsweise quellenahen Formen.
