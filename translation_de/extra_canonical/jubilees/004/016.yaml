    issue: Unklare Zuordnung der Datierung „im vierten Jahr dieser Woche“
    rationale: Die Datierung steht im Ge'ez bei der Aussage, dass Jared Baraka zur Frau nahm. Im Entwurf folgt sie zwar dem Satz über Jareds Eheschließung, ist aber durch die anschließende Namens- und Abstammungsbeschreibung weniger eindeutig zugeordnet. Eine unmittelbare Verbindung mit „nahm ... im vierten Jahr ... eine Frau“ bildet die Quelle klarer ab.
  - severity: medium
    issue: Fußnote bewertet die eingeklammerte Wiederholung als offenbar „sekundär oder störend“
    rationale: Die Vorlage kennzeichnet die Wiederholung zwar durch Klammern, liefert aber keine hinreichende Grundlage für diese textkritische Bewertung. Die Fußnote sollte neutral beschreiben, dass die eingeklammerte Formel nicht eigens wiedergegeben wird, weil die Eheschließung bereits ausgedrückt ist.
  revised_text: Und sie übten Recht und Rechtschaffenheit auf der Erde. Im zehnten Jubiläum, in der ersten Woche, nahm Jared sich im vierten Jahr dieser Woche eine Frau; ihr Name war Baraka. Sie war die Tochter Rasujals, einer Tochter der Schwester seines Vaters.[a] Im vierten Jahr der fünften Woche gebar sie ihm einen Sohn.
