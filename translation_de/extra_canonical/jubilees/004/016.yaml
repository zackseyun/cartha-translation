revisions:
- from: Und sie übten Recht und Rechtschaffenheit auf der Erde. Im zehnten Jubiläum, in der ersten Woche, nahm sich Jared im vierten Jahr dieser Woche eine Frau. Sie hieß Baraka und war die Tochter Rasujals, einer Tochter der Schwester seines Vaters.[a] Im vierten Jahr der fünften Woche gebar sie ihm einen Sohn.
  to: Und sie übten Recht und Rechtschaffenheit auf der Erde. Im zehnten Jubiläum, in der ersten Woche, nahm Jared sich im vierten Jahr dieser Woche eine Frau; ihr Name war Baraka. Sie war die Tochter Rasujals, einer Tochter der Schwester seines Vaters.[a] Im vierten Jahr der fünften Woche gebar sie ihm einen Sohn.
  rationale: Die Jahresangabe der Eheschließung wurde unmittelbar an „nahm Jared sich ... eine Frau“ angeschlossen. Die Fußnote wurde neutral formuliert, damit die in der Vorlage eingeklammerte Wiederholung angezeigt wird, ohne eine nicht abgesicherte Aussage über ihre textgeschichtliche Herkunft oder Qualität zu treffen. Bedeutung, genealogische Ambiguität und chronologische Angaben bleiben erhalten.
