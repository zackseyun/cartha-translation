  verdict: revise
  source_fidelity: 'Der Entwurf gibt Handlung, Namen, Verwandtschaftsangabe und beide Datierungsformeln im Wesentlichen zutreffend wieder. Die Stellung von „im vierten Jahr dieser Woche“ ist jedoch im Deutschen missverständlich: Sie kann sich auf Jareds Handeln als Ganzes beziehen, während sie im Ge''ez bei der Heiratsangabe steht. Die wiederholte Heiratsformel ist im Quellentext eingeklammert und sollte nicht ohne weitere textkritische Absicherung als „sekundär oder störend“ qualifiziert werden.'
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind gelungen. Eine Semikolonverbindung und die Voranstellung der Jahresangabe bei der Eheschließung machen die Satzgliederung klarer. Die genealogische Formulierung bleibt notwendigerweise etwas verschachtelt, ist aber verständlich.
  terminology: „Recht und Rechtschaffenheit“, „Jubiläum“ und „Woche“ sind angemessen und quellennah. „Eine Frau nehmen“ entspricht hier der Heiratsformel. Die Namen Jared, Baraka und Rasujal werden konsistent mit der Vorlage behandelt.
  issues:
