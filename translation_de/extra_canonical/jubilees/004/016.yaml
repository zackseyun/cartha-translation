base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/016.yaml
  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: de
  text: Und sie übten Recht und Rechtschaffenheit auf der Erde. Im zehnten Jubiläum, in der ersten Woche, nahm Jared sich im vierten Jahr dieser Woche eine Frau; ihr Name war Baraka. Sie war die Tochter Rasujals, einer Tochter der Schwester seines Vaters.[a] Im vierten Jahr der fünften Woche gebar sie ihm einen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text enthält nach der Abstammungsangabe eingeklammert nochmals die Formel „ihm zur Frau“. Sie wird nicht eigens wiederholt, da die Eheschließung bereits zuvor ausgedrückt ist.
    reason: textual_variant
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: Recht und Rechtschaffenheit
  rationale: 'Die beiden eng verwandten Begriffe werden getrennt wiedergegeben: ፍትሕ bezeichnet Recht bzw. Gerechtigkeit, ርትዕ Geradheit oder Rechtschaffenheit.'
- source_word: ይግበሩ
  choice: sie übten
  rationale: Die Pluralform wird bewahrt; „Recht und Rechtschaffenheit üben“ klingt im Deutschen natürlich und gibt das aktive Tun wieder.
- source_word: ነሥአ፡ ሎቱ፡ … ብእሲተ
  choice: nahm sich … eine Frau
  rationale: Entspricht der äthiopischen Heiratsformel, ohne eine moderne romantische Bedeutung einzutragen.
- source_word: ሱባዔ
  choice: Woche
  rationale: Im chronologischen System des Jubiläenbuchs bezeichnet der Ausdruck eine Jahrwoche von sieben Jahren; die traditionelle Kurzform „Woche“ bleibt im Haupttext erhalten.
theological_decisions:
- issue: Unbestimmtes Subjekt im Eröffnungssatz
  choice: „sie“ ohne ergänztes Bezugswort
  alternative: Ein konkretes Subjekt aus dem vorherigen Kontext einsetzen
  rationale: Der vorgelegte Vers enthält nur die Pluralform; ein ausdrücklich benanntes Subjekt würde die im Quelltext bestehende Kontextabhängigkeit auflösen.
- issue: Verwandtschaftsangabe zu Baraka
  choice: Rasujal wird als Tochter der Schwester von Jareds Vater verstanden
  alternative: Baraka unmittelbar als Tochter der Schwester seines Vaters bezeichnen
  rationale: Die wiederholte Folge „Tochter … Tochter …“ spricht für eine zweistufige Abstammungsangabe und wird deshalb nicht zur geläufigeren Verwandtschaftsbezeichnung vereinfacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die chronologischen Formeln und die genealogische Verschachtelung bleiben quellennah, werden jedoch in gut verständliche deutsche Satzfolge gebracht.
