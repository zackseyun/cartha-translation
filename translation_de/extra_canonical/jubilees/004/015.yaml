base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/015.yaml
  text: And he was still with the angels of God for six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.
translation:
  language: de
  text: Und er blieb sechs Jubiläen lang[a] bei den Engeln Gottes, und sie zeigten ihm alles, was auf der Erde und in den Himmeln ist, die Herrschaft der Sonne, und er schrieb alles auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Jubiläum umfasst sieben Jahrwochen, also 49 Jahre; sechs Jubiläen entsprechen daher 294 Jahren.
    reason: Der technische Zeitbegriff ist heutigen Leserinnen und Lesern meist nicht unmittelbar verständlich.
lexical_decisions:
- source_word: ሀሎ፡ እንከ፡ ምስለ
  choice: blieb … bei
  rationale: Die Wendung bezeichnet hier ein fortdauerndes Zusammensein. „Blieb bei“ gibt dies im Deutschen natürlicher wieder als das wörtlichere „war weiterhin mit“.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: sechs Jahrjubiläen lang
  rationale: Die ungewöhnliche Zeitangabe wird knapp und quellenah wiedergegeben; die Fußnote erläutert den technischen Sinn von „Jubiläum“.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: die Herrschaft der Sonne
  rationale: ሥልጣን bezeichnet Herrschaft, Vollmacht oder Machtbereich. „Herrschaft“ bewahrt die kosmologische Aussage, ohne sie deutend auf Lauf, Ordnung oder Bewegung der Sonne einzuengen.
- source_word: ጸሐፈ፡ ኵሎ
  choice: er schrieb alles auf
  rationale: „Aufschreiben“ entspricht dem dokumentierenden Sinn des Verbs im Zusammenhang und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Art und Umfang der Offenbarung an Henoch
  choice: „alles, was auf der Erde und in den Himmeln ist“
  alternative: „alles auf der Erde und die Herrschaft der Sonne am Himmel“
  rationale: Die Satzglieder werden so gefasst, dass die umfassende Schau von Erde und Himmeln erhalten bleibt; „die Herrschaft der Sonne“ folgt als zusätzlicher Gegenstand, ohne ihre genaue kosmologische Bedeutung festzulegen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die technische Zeitangabe bleibt sichtbar, während eine Fußnote ihre Bedeutung erklärt. Der kosmologische Ausdruck „Herrschaft der Sonne“ wird bewusst nicht interpretierend geglättet.
