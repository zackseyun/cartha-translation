base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/014.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: de
  text: Im zwölften Jubiläum, in dessen siebter Jahrwoche, nahm er sich eine Frau. Ihr Name war Edni; sie war die Tochter Danels, der Tochter der Schwester seines Vaters.[a] Im sechsten Jahr dieser Jahrwoche gebar sie ihm einen Sohn, und er gab ihm den Namen Metuschelach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem äthiopischen Text: „der Tochter der Schwester seines Vaters“; teilweise wird abweichend „der Tochter des Bruders seines Vaters“ wiedergegeben.'
    reason: Die Verwandtschaftsangabe des äthiopischen Ausgangstextes weicht von einer verbreiteten Wiedergabe ab; die Fußnote bewahrt diese textliche Spannung.
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: Jubiläum
  rationale: Gibt die für das Buch charakteristische Zeiteinheit sachgerecht und in verständlichem Deutsch wieder.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet hier einen Zeitraum von sieben Jahren; „Jahrwoche“ unterscheidet ihn klar vom Jubiläum.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm er sich eine Frau
  rationale: Natürliche, zugleich formnahe Wiedergabe der festen Wendung für die Eheschließung.
- source_word: ማቱሳላ
  choice: Metuschelach
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufige Namensform der Gestalt aus Genesis 5.
theological_decisions:
- issue: Verwandtschaftsangabe zu Edni
  choice: „einer Tochter der Schwester seines Vaters“
  alternative: „der Tochter des Bruders seines Vaters“
  rationale: Der vorgelegte äthiopische Text hat ausdrücklich እኅተ („Schwester“). Die Übersetzung folgt daher der Originalsprachenevidenz und weist die abweichende Wiedergabe in einer Fußnote aus.
