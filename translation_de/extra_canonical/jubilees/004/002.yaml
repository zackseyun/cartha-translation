  to: Und in der fünften Woche gebar sie ihm eine Tochter, Awan. Im ersten Jahr des dritten Jubiläums erschlug Kain Abel, weil Abels Opfergabe angenommen wurde, Kains Opfer aber nicht angenommen wurde.
