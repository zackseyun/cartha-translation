  yaml_path: translation/extra_canonical/jubilees/004/002.yaml
  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: de
  text: Und in der fünften Woche gebar sie ihm eine Tochter, Awan. Im ersten Jahr des dritten Jubiläums erschlug Kain Abel, weil Abels Opfergabe angenommen wurde, Kains Opfer aber nicht angenommen wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለቱ
  choice: seine Tochter
  rationale: Das Substantiv mit Possessivsuffix bezeichnet ausdrücklich seine Tochter; die natürliche deutsche Wiedergabe erhält diesen Bezug.
- source_word: አዋን
  choice: Awan
  rationale: Der Personenname wird entsprechend der etablierten Form transliteriert.
- source_word: ቀተሎ
  choice: erschlug
  rationale: Das Verb bezeichnet hier das Töten Abels; „erschlug“ ist im erzählerischen Kontext prägnant und würdevoll.
- source_word: ቍርባኖ
  choice: Opfergabe
  rationale: Der Ausdruck bezeichnet Abels dargebrachte Gabe und wird von dem folgenden Wort für Kains Opfer sprachlich unterschieden.
- source_word: መሥዋዕቶ
  choice: Schlachtopfer
  rationale: Der Opferterminus wird differenziert von Abels „Opfergabe“ wiedergegeben; „Schlachtopfer“ bildet den kultischen Sinn konkreter ab.
- source_word: ተወክፈ / ኢተወክፈ
  choice: wurde angenommen / wurde nicht angenommen
  rationale: Die Passivkonstruktionen werden formal bewahrt, ohne einen im Satz nicht ausdrücklich genannten Handelnden einzufügen.
theological_decisions:
- issue: Nicht genannter Annehmender der Opfer
  choice: Passiv ohne ausdrückliches Subjekt
  alternative: „Gott nahm Abels Opfergabe an, Kains Opfer aber nicht“
  rationale: Obwohl Gott aus dem Kontext als Handelnder verstanden wird, nennt der gegebene Wortlaut ihn nicht ausdrücklich. Das Passiv bewahrt diese Form.
- issue: Unterschiedliche Opferbegriffe für Abel und Kain
  choice: „Opfergabe“ und „Schlachtopfer“
  alternative: beide Male „Opfer“
  rationale: Die Quelle verwendet verschiedene Lexeme. Die deutsche Differenzierung erhält diese mögliche inhaltliche Spannung, ohne daraus eine theologische Wertung abzuleiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Chronologie. Der explizite Bezug auf Kain im letzten Satzteil bleibt erhalten; die Wiederholung von „angenommen wurde“ folgt der ausgewogenen Gegenüberstellung der Quelle.
