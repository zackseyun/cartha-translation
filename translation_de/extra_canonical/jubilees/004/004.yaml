base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/004.yaml
  text: And therefore the Lord rebuked Cain because of Abel[4], because he had killed him; and he made him a fugitive on the earth because of the blood of his brother, and he cursed him on the earth.
translation:
  language: de
  text: Darum wies der Herr Kain wegen Abels zurecht[a], weil er ihn getötet hatte. Er machte ihn wegen des Blutes seines Bruders zu einem Flüchtling auf der Erde und verfluchte ihn auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vers 4 ist im zugrunde liegenden Arbeitskorpus nicht als eigene nummerierte Zeile erhalten. Sein Sinn ergibt sich aus der Wiederaufnahme am Anfang des Abschnitts und der Fortsetzung in Vers 5; die Übersetzung stellt diesen Zusammenhang knapp wieder her.
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር (ʾƎgziʾabḥer)
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe des geʿezischen Gottesnamens; die typografische Form „HERR“ wird vermieden, da der Geʿez-Text das hebräische Tetragramm nicht eigens kennzeichnet.
- source_word: ዘለፎ (zä-läfo)
  choice: wies … zurecht
  rationale: Gibt den Sinn von tadeln oder zurechtweisen in natürlichem, würdigem Gegenwartsdeutsch wieder.
- source_word: ገብረ … በዲበ ምድር (gäbrä … bä-dibä mədr)
  choice: machte ihn … zu einem Flüchtling auf der Erde
  rationale: Folgt dem im unmittelbaren Kontext erschließbaren Strafmotiv und bewahrt die konkrete Bezeichnung als Flüchtling, statt sie frei als bloße Ruhelosigkeit auszulegen.
- source_word: ረገሞ (rägämo)
  choice: verfluchte ihn
  rationale: Direkte Wiedergabe des Verbs „verfluchen“; Subjekt und Objekt werden im Deutschen ausdrücklich genannt.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: der Herr
  alternative: der HERR
  rationale: Die Übersetzung folgt der geʿezischen Form und importiert nicht die auf das hebräische Tetragramm bezogene deutsche Kapitälchenkonvention.
- issue: Art von Kains Strafe
  choice: zu einem Flüchtling auf der Erde
  alternative: ließ ihn unstet auf der Erde umherirren
  rationale: Die gewählte Form wahrt die überlieferte konkrete Aussage, ohne sie durch eine aus Genesis bekannte Doppelformel zu erweitern.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Wiederholung „auf der Erde“ bleibt erhalten, weil sie die zweifache Aussage des Kontextes abbildet; der Fußnotenmarker steht unmittelbar bei der aus der beschädigten Versgliederung rekonstruierten Aussage.
