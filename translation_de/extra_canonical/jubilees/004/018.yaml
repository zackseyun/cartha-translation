  yaml_path: translation/extra_canonical/jubilees/004/018.yaml
  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: de
  text: Er war der Erste, der ein Zeugnis niederschrieb, und legte den Menschenkindern unter den Geschlechtern der Erde Zeugnis ab. Er berichtete von den Wochen der Jubiläen, machte die Tage der Jahre bekannt und ordnete die Monate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀዳሚ
  choice: der Erste
  rationale: Gibt die zeitliche Vorrangstellung des handelnden Henoch natürlich und unmittelbar wieder.
- source_word: ስምዐ፡ ወአስምዐ
  choice: ein Zeugnis niederschrieb … Zeugnis ab
  rationale: Bewahrt das im Ge’ez erkennbare Wortspiel zwischen dem geschriebenen Zeugnis und dem Bezeugen, ohne beide Verben zu verschmelzen.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: Menschenkinder
  rationale: Eine würdevolle, im biblischen Deutsch verständliche Wiedergabe der traditionellen Bezeichnung für die Menschen.
- source_word: ትዝምደ፡ ምድር
  choice: Geschlechter der Erde
  rationale: Bewahrt den generationenbezogenen Sinn und vermeidet die unnatürliche wörtliche Formulierung „Zeugungen der Erde“.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: die Wochen der Jubiläen
  rationale: Gibt die für das Jubiläenbuch zentrale kalendarische Terminologie formal und verständlich wieder.
- source_word: ነገረ
  choice: berichtete von
  rationale: Deckt den Sinn „erzählen, darlegen, berichten“ ab, ohne mehr technische Präzision einzutragen, als das Verb selbst verlangt.
- source_word: መዋዕለ፡ ዓመታት
  choice: die Tage der Jahre
  rationale: Bewahrt die eigentümliche kalendarische Formulierung des Ausgangstextes, statt sie glättend als bloße Jahreszeiten wiederzugeben.
- source_word: አውራኅ፡ ሰርዐ
  choice: ordnete die Monate
  rationale: Gibt sowohl die Monate als auch das ordnende bzw. festsetzende Handeln knapp und quellennah wieder.
theological_decisions:
- issue: Art und Reichweite von Henochs Zeugnis
  choice: „legte vor den Menschenkindern … Zeugnis ab“
  alternative: „bezeugte den Menschenkindern“
  rationale: Die gewählte Form hält offen, worin das Zeugnis genau bestand, und bewahrt zugleich die sachliche Verbindung zum zuvor genannten schriftlichen Zeugnis.
- issue: Kalendarische Tätigkeit Henochs
  choice: „machte … bekannt und ordnete“
  alternative: „offenbarte … und setzte fest“
  rationale: Die Übersetzung vermeidet eine unnötige theologische Zuspitzung als besondere Offenbarung oder als eigenmächtige Stiftung des Kalenders.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die Fassung folgt dem zu Jubiläen 4,18 gehörenden Satz ab ውእቱ („Er“). Der am Anfang des bereitgestellten Ausschnitts stehende Satzrest über die Zeiten der Jahre und die Monate gehört syntaktisch zum vorausgehenden Vers und wurde daher nicht in den Haupttext von 4,18 aufgenommen.
