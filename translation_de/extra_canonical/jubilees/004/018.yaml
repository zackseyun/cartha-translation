revisions:
- from: Er war der Erste, der ein Zeugnis niederschrieb. Er legte vor den Menschenkindern inmitten der Geschlechter der Erde Zeugnis ab, berichtete von den Wochen der Jubiläen, machte die Tage der Jahre bekannt und ordnete die Monate.
  to: Er war der Erste, der ein Zeugnis niederschrieb, und legte den Menschenkindern unter den Geschlechtern der Erde Zeugnis ab. Er berichtete von den Wochen der Jubiläen, machte die Tage der Jahre bekannt und ordnete die Monate.
  rationale: Die Revision beschränkt sich auf die Wiedergabe der Adressaten des Bezeugens. „Den Menschenkindern … Zeugnis ablegen“ gibt die durch ለ ausgedrückte Richtung wieder; „unter den Geschlechtern der Erde“ erhält die im Ausgangstext vorhandene, aber nicht näher bestimmte Formel. Die Satzteilung dient der Lesbarkeit und verändert weder die Abfolge noch den Sinn der Handlungen.
