base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/011.yaml
  text: He was the first among those born on earth to learn writing, instruction, and wisdom, and to write down the signs of heaven according to the order of their months in a book, so that the children of men might know the seasons of the years according to the order of each of their months.
translation:
  language: de
  text: Er war der Erste unter den auf der Erde Geborenen, der Schreiben, Unterweisung und Weisheit erlernte und die Zeichen des Himmels nach der Ordnung ihrer Monate in einem Buch aufzeichnete, damit die Menschenkinder die Zeiten der Jahre nach der Ordnung ihrer einzelnen Monate erkennen konnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ
  choice: Schreiben
  rationale: Im Zusammenhang mit »Unterweisung und Weisheit lernen« bezeichnet das Wort hier die Kunst beziehungsweise Kenntnis des Schreibens; das später ausdrücklich genannte Buch bleibt davon unterschieden.
- source_word: ትምህርተ
  choice: Unterweisung
  rationale: Gibt den Sinn von Lehre beziehungsweise Belehrung in einem würdigen, allgemein verständlichen Register wieder.
- source_word: ተአምረ፡ ሰማይ
  choice: die Zeichen des Himmels
  rationale: Bewahrt die konkrete und potenziell astronomische Bedeutung, ohne sie enger als »Himmelskörper« oder »Sternzeichen« auszulegen.
- source_word: ጊዜ፡ ዓመታት
  choice: die Zeiten der Jahre
  rationale: Die etwas markante Ausgangsformulierung bleibt erhalten und wird nicht deutend zu »Jahreszeiten« verengt.
- source_word: እጓለ፡ እመሕያው
  choice: die Menschenkinder
  rationale: Traditionell-dignifizierende, zugleich verständliche Wiedergabe der kollektiven Bezeichnung für die Menschheit.
theological_decisions:
- issue: Art der himmlischen Zeichen
  choice: Die Formulierung bleibt allgemein als »Zeichen des Himmels« stehen.
  alternative: astronomische Zeichen, Himmelskörper oder Sternzeichen
  rationale: Der Ausgangstext legt die genaue Art der Zeichen nicht eindeutig fest; eine Konkretisierung würde die genuine Bedeutungsbreite unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange, parallel gebaute Satz folgt der Struktur des Ausgangstextes, bleibt aber durch klare Verbanschlüsse gut lesbar.
