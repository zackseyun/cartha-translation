base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: de
  text: … Jahr des Jubeljahrs, und er gab ihm den Namen Henoch. Er war der Erste unter den auf der Erde geborenen Menschen, der Schreiben, Erkenntnis und Weisheit erlernte und die Zeichen des Himmels nach der Ordnung ihrer Monate in einem Buch niederschrieb, damit sie erkennen konnten …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዐ፡ ስሞ፡ ሄኖክ
  choice: und er gab ihm den Namen Henoch
  rationale: Die äthiopische Wendung bedeutet wörtlich „und er nannte seinen Namen Henoch“; die gewählte deutsche Form ist natürlich und bewahrt den Sinn.
- source_word: እምእጓለ፡ እመሕያው፡ እምእለ፡ ተወልዱ፡ ዲበ፡ ምድር
  choice: unter den auf der Erde geborenen Menschen
  rationale: Gibt die doppelte Bestimmung „von den Menschenkindern / von denen, die auf der Erde geboren wurden“ kompakt wieder, ohne sie auf eine bestimmte Menschengruppe einzuengen.
- source_word: መጽሐፈ፡ ወትምህርተ፡ ወጥበበ
  choice: Schrift, Erkenntnis und Weisheit
  rationale: „Schrift“ bezeichnet hier das Schreiben beziehungsweise die Schriftkunde; „Erkenntnis“ und „Weisheit“ bilden die weiteren Glieder der dreiteiligen Aufzählung.
- source_word: ተአምረ፡ ሰማይ
  choice: die Zeichen des Himmels
  rationale: Formale und im astronomischen Zusammenhang verständliche Wiedergabe; der Ausdruck wird nicht vorschnell als bestimmte Himmelskörper oder Kalenderphänomene gedeutet.
- source_word: በከመ፡ ሥርዐተ፡ አውራኅሆሙ
  choice: nach der Ordnung ihrer Monate
  rationale: Bewahrt den Plural und den Bezug des pronominalen Suffixes, dessen genauer Referent im erhaltenen Ausschnitt nicht ausdrücklich aufgelöst wird.
- source_word: ከመ፡ ይእምሩ
  choice: damit sie erkennen konnten
  rationale: Der abhängige Plural wird beibehalten; wegen des abbrechenden Quellenausschnitts bleibt auch der deutsche Satz offen.
