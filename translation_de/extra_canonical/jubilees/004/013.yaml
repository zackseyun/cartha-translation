base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: de
  text: Und im elften Jubiläum nahm sich Jered eine Frau namens Baraka, die Tochter Rasuyals,[a] eine Tochter des Bruders seines Vaters, in der vierten Woche dieses Jubiläums. Und sie gebar ihm in der fünften Woche, im vierten Jahr des Jubiläums, einen Sohn, und er gab ihm den Namen Henoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Rasuyal (ራሱያል) wird in einigen älteren Ausgaben als Rasujal transliteriert.
    reason: lexical_choice
lexical_decisions:
- source_word: ያሬድ
  choice: Jered
  rationale: Die im Deutschen geläufige biblische Namensform wird verwendet.
- source_word: ባረካ
  choice: Baraka
  rationale: Nahe Transliteration des geʿezischen Eigennamens.
- source_word: ራሱያል
  choice: Rasuyal
  rationale: Direkte Transliteration der geʿezischen Buchstaben; sie vermeidet das ältere, für den y-Laut verwendete j.
- source_word: ሄኖክሃ
  choice: Henoch
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: ነሥአ ፡ ያሬድ ፡ ሎቱ ፡ ብእሲተ
  choice: nahm sich Jered eine Frau
  rationale: Gibt die geʿezische Wendung formal und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: ወሰመየ ፡ ስሞ
  choice: und er gab ihm den Namen
  rationale: Idiommatische deutsche Wiedergabe von „und er nannte seinen Namen“, ohne den Inhalt zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die wiederholte Bezeichnung „Tochter …, eine Tochter …“ bleibt erhalten, um die syntaktische Gestalt und mögliche genealogische Spannung des geʿezischen Textes nicht stillschweigend aufzulösen. Auch die Zeitangabe „im vierten Jahr des Jubiläums“ folgt dem vorliegenden Wortlaut, obwohl ihr Verhältnis zur fünften Woche erklärungsbedürftig wirken kann.
