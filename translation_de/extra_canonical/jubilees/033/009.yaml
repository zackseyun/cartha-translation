  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: de
  text: Und Jakob näherte sich ihr nicht wieder, denn Ruben hatte sie verunreinigt. Und jeder Mann, der die Bedeckung seines Vaters aufdeckt[a] – seine Tat ist sehr böse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Bedeckung seines Vaters aufdeckt“; eine bildhafte Umschreibung für einen sexuellen und verwandtschaftsbezogenen Verstoß im Zusammenhang mit der Frau oder Nebenfrau des Vaters.'
    reason: Die Fußnote erläutert das antike Sexual- und Verwandtschaftsidiom, ohne einen sexuellen Übergriff im heutigen engeren Sinn zu behaupten oder die Metapher im Haupttext aufzulösen.
lexical_decisions:
- source_word: አቀረበ
  choice: näherte sich ihr
  rationale: Das Verb bezeichnet das Herantreten oder Sich-Nähern; im Zusammenhang ist eine intime Annäherung gemeint, ohne dass diese im Haupttext weiter ausgedeutet wird.
- source_word: አርኩሳ
  choice: hatte sie verunreinigt
  rationale: Die Form bezeichnet Verunreinigung beziehungsweise Befleckung; das Plusquamperfekt macht deutlich, dass Rubens Tat Jakobs anschließendem Verhalten vorausging.
- source_word: ይከሥት ክዳነ
  choice: die Bedeckung … aufdeckt
  rationale: Die bildhafte Formulierung des Ausgangstextes wird bewahrt. Eine freie Wiedergabe wie „mit der Frau seines Vaters schläft“ würde die überlieferte Metapher auflösen.
- source_word: ኵሉ ሰብእ
  choice: jeder Mann
  rationale: Entspricht der allgemeinen, männlich formulierten Aussage des Ausgangstextes.
theological_decisions:
- issue: Deutung der „Bedeckung des Vaters“
  choice: Die Metapher bleibt im Haupttext stehen und wird in einer Fußnote als sexuelle beziehungsweise verwandtschaftliche Umschreibung erläutert.
  alternative: Direkte Wiedergabe als „wer mit der Frau seines Vaters schläft“ oder „wer die Blöße seines Vaters aufdeckt“.
  rationale: So bleiben die sprachliche Verbindung zur Kleidungsmetapher und die genuine Deutungsspannung erhalten, ohne den Sinn für heutige Leser unzugänglich zu lassen.
- issue: Negation und zeitliche Fortsetzung bei Jakobs Annäherung
  choice: „näherte sich ihr nicht wieder“ gemäß dem gesicherten Satzsinn der Überlieferung und der geprüften Konsultationsfassung.
  alternative: Das isoliert vorgelegte ወአቀረበ positiv als „und Jakob näherte sich“ wiederzugeben.
  rationale: Die vorgelegte äthiopische Zeichenfolge scheint an dieser Stelle gegenüber dem bezeugten Satzsinn unvollständig oder textkritisch auffällig zu sein. Die Negation und „wieder“ sind für den kohärenten, überlieferten Sinn erforderlich; die Unsicherheit wird nicht zur theologischen Harmonisierung genutzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung mit „Und“ folgt der wiederholten Ausgangskonjunktion. „Ruben“ entspricht der üblichen deutschen Namensform. Der abschließende Gedankenstrich und das Komma bewahren den Fortsetzungscharakter des Versfragments.
