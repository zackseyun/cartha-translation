lexical_decisions:
- source_word: ወአነገረት
  choice: Und sie erzählte
  rationale: Das Verb steht in der 3. Person Singular Femininum und bezeichnet das Mitteilen oder Berichten.
- source_word: ወኢለመኑሂ ሰብአ
  choice: niemandem davon
  rationale: Die verneinte Wendung bedeutet idiomatisch, dass sie keinem Menschen davon erzählte; „davon“ macht den im Deutschen erforderlichen Bezug natürlich, ohne einen neuen Inhalt einzuführen.
- source_word: ወሶበ መጽአ ያዕቆብ
  choice: Als Jakob kam
  rationale: Die temporale Konstruktion wird knapp und natürlich wiedergegeben.
- source_word: ወኀሠሣ
  choice: und nach ihr suchte
  rationale: 'Die Form hat ein maskulines Subjekt und ein feminines Objektsuffix: Jakob ist der Suchende, die Frau die Gesuchte.'
- source_word: ትቤሎ
  choice: sagte sie zu ihm
  rationale: Die feminine Verbform mit maskulinem Objektsuffix wird in natürlicher deutscher Redeform wiedergegeben.
