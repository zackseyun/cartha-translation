revisions:
- from: 'Seine Tat ist sehr böse, denn sie ist vor dem HERRN abscheulich. Darum steht auf den himmlischen Tafeln geschrieben und festgesetzt, dass ein Mann nicht mit der Frau seines Vaters schlafen und den Rock seines Vaters nicht aufdecken darf[a], denn das ist unrein. Beide müssen unbedingt sterben: der Mann, der mit der Frau seines Vaters schläft, und auch die Frau; denn sie haben auf der Erde etwas Unreines getan. Vor unserem Gott soll es unter dem Volk, das er sich zum Königreich erwählt hat, nichts Unreines geben.


    Und ein zweites Mal steht geschrieben: »Verflucht sei, wer mit der Frau seines Vaters schläft, denn er hat die Blöße seines Vaters aufgedeckt.« Und alle Heiligen des HERRN sollen sagen: »So sei es, so sei es!«


    Und du, Mose, gebiete den Kindern Israels, dieses Wort zu halten. Denn darauf steht der Tod, und es ist unrein. Für den Mann, der dies getan hat, gibt es in Ewigkeit keine Sühne, durch die ihm Sühne verschafft werden könnte, außer dass man ihn zu Tode bringt, ihn tötet und steinigt und ihn aus der Mitte des Volkes unseres Gottes ausrottet. Denn kein Mann, der dies in Israel tut, soll auch nur einen einzigen Tag auf der Erde am Leben bleiben, weil er abscheulich und unrein ist.


    Sie sollen nicht sagen: »Ruben durfte am Leben bleiben, und ihm wurde vergeben, nachdem er mit der Nebenfrau seines Vaters geschlafen hatte; und auch sie blieb am Leben, obwohl sie verheiratet war und obwohl sein Vater Jakob noch lebte.« Denn bis zu jener Zeit waren Satzung, Urteil und Gesetz noch nicht vollständig für alle offenbart worden. In deinen Tagen aber gilt es als Gesetz für alle Zeiten und Tage und als ewiges Gesetz für alle ewigen Generationen. Für dieses Gesetz gibt es kein Ende seiner Geltungsdauer und dafür keine Vergebung, außer dass beide aus der Mitte des Volkes ausgerottet werden. An dem Tag, an dem sie es tun, soll man sie töten.


    Und du, Mose, schreibe es für Israel auf, damit sie es halten, nicht so etwas tun und sich nicht mit einer Sünde zum Tod versündigen. Denn der Richter, der HERR, unser Gott, sieht die Person nicht an und nimmt keine Bestechung an. Teile ihnen diese Satzung mit, damit sie hören, auf der Hut sind, sich selbst in Acht nehmen und nicht zugrunde gehen und aus dem Land ausgerottet werden. Denn alle, die dies auf der Erde tun, sind vor unserem Gott unrein, befleckt, entweiht und besudelt.


    Es gibt keine größere Sünde als die Unzucht, die sie auf der Erde begehen. Denn Israel ist dem HERRN, seinem Gott, ein heiliges Volk, ein Volk seines Erbbesitzes, ein priesterliches Volk, ein königliches Volk und ein eingepflanztes Volk[b]. Unter dem heiligen Volk darf nichts derart Unreines zu sehen sein.


    Im dritten Jahr dieser Jahrwoche zog Jakob mit allen seinen Söhnen fort, und sie ließen sich im Haus Abrahams nieder, in der Nähe seines Vaters Isaak und seiner Mutter Rebekka. Dies sind die Namen der Söhne Jakobs: der Erstgeborene Ruben; Simeon, Levi, Juda, Issachar und Sebulon, die Söhne Leas; Josef und Benjamin, die Söhne Rahels; Dan und Naftali, die Söhne Bilhas; Gad und Ascher, die Söhne Silpas; und Dina, Leas einzige Tochter, die Tochter Jakobs.


    Sie gingen hin und warfen sich vor Isaak und Rebekka nieder. Als diese sie sahen, segneten sie Jakob und alle seine Söhne. Isaak freute sich überaus, weil er die Söhne Jakobs, seines jüngeren Sohnes, sah, und er segnete sie.'
