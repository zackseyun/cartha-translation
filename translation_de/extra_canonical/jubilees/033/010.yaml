  text: 'His deed is very evil, for he is abominable before the LORD. Because of this it is written and ordained on the heavenly tablets that a man must not lie with his father’s wife and must not uncover his father’s skirt, because it is unclean. They must surely die together—the man who lies with his father’s wife and the woman also—for they have done an unclean deed on the earth. And let there be no uncleanness before our God among the people whom he has chosen for himself as a kingdom. And again it is written a second time: “Cursed be the one who lies with his father’s wife, because he has uncovered his father’s shame.” And let all the holy ones of the LORD say, “So be it, so be it.” And you, Moses, command the children of Israel that they keep this word, for it is a sentence of death, and it is unclean, and there is no atonement forever to atone for the man who has done this, except to put him to death and kill him and stone him and uproot him from the midst of the people of our God.
    For there shall not remain alive for a single day on the earth any man who does this in Israel, for he is abominable and unclean. And let them not say, “Reuben was allowed to live and forgiveness was granted after he lay with his father’s concubine, and she too, though she had a husband, and though Jacob his father was still alive.” For until that time the ordinance and the judgment and the law had not been fully revealed for all; but in your days it is as the law of the times and of the days, and as an everlasting law for the everlasting generations. And for this law there is no completion of days, and no forgiveness for it, except that both of them be uprooted from the midst of the people; on the day on which they did it they shall kill them. And you, Moses, write it down for Israel, that they may keep it and not do according to this matter and not sin with a sin unto death, because the Judge, the LORD our God, is one who does not show partiality and does not accept bribes. And tell
    them this word of the ordinance, that they may hear and be on guard and watch themselves and not be destroyed and rooted out from the land. For all who do it on the earth are unclean and defiled and polluted and contaminated before our God. And there is no greater sin than the sexual impurity that they commit on the earth, for Israel is a holy people to the LORD its God, and a people of inheritance, and a priestly people, and a kingdom people, and a planted people; and no such uncleanness is to be seen in the midst of the holy people. And in the third year of this week Jacob and all his sons went and dwelt in the house of Abraham, near Isaac his father and Rebekah his mother. And these are the names of the sons of Jacob: the firstborn, Reuben; and Simeon; and Levi; and Judah; and Issachar; and Zebulun, the sons of Leah; and the sons of Rachel, Joseph and Benjamin; and the sons of Bilhah, Dan and Naphtali; and the sons of Zilpah, Gad and Asher; and Dinah, the only daughter of Leah, the
    daughter of Jacob. And they went and bowed down to Isaac and Rebekah, and when they saw them they blessed Jacob and all his sons. And Isaac rejoiced greatly because he saw the sons of Jacob his younger son, and he blessed them.'
translation:
  language: de
  text: 'Seine Tat ist sehr böse, denn sie ist vor dem HERRN abscheulich. Darum steht auf den himmlischen Tafeln geschrieben und festgesetzt, dass ein Mann nicht mit der Frau seines Vaters schlafen und die Bedeckung seines Vaters nicht aufdecken darf[a], denn das ist unrein. Beide müssen unbedingt sterben: der Mann, der mit der Frau seines Vaters schläft, und auch die Frau; denn sie haben auf der Erde etwas Unreines getan. Vor unserem Gott soll es unter dem Volk, das er sich zum Königreich erwählt hat, nichts Unreines geben.


    Und ein zweites Mal steht geschrieben: »Verflucht sei, wer mit der Frau seines Vaters schläft, denn er hat die Blöße seines Vaters aufgedeckt.« Und alle Heiligen des HERRN sollen sagen: »So sei es, so sei es!«


    Und du, Mose, gebiete den Kindern Israels, dieses Wort zu halten. Denn darauf steht der Tod, und es ist unrein. Für den Mann, der dies getan hat, gibt es in Ewigkeit keine Vergebung, außer dass man ihn zu Tode bringt, ihn tötet und steinigt und ihn aus der Mitte des Volkes unseres Gottes ausrottet. Denn kein Mann, der dies in Israel tut, soll auch nur einen einzigen Tag auf der Erde am Leben bleiben, weil er abscheulich und unrein ist.


    Sie sollen nicht sagen: »Ruben durfte am Leben bleiben, und ihm wurde vergeben, nachdem er mit der Nebenfrau seines Vaters geschlafen hatte; auch sie durfte am Leben bleiben und ihr wurde vergeben, obwohl ihr Mann, sein Vater Jakob, noch lebte.« Denn bis zu jener Zeit waren Satzung, Urteil und Gesetz noch nicht vollständig für alle offenbart worden. In deinen Tagen aber gilt es als Gesetz der Zeiten und Tage und als ewiges Gesetz für alle ewigen Generationen. Für dieses Gesetz gibt es kein Ende seiner Geltungsdauer und keine Vergebung, außer dass beide aus der Mitte des Volkes ausgerottet werden. An dem Tag, an dem sie es tun, soll man sie töten.


    Und du, Mose, schreibe es für Israel auf, damit sie es halten, nicht in dieser Weise handeln und keine Sünde begehen, die zum Tod führt. Denn der Richter, der HERR, unser Gott, sieht die Person nicht an und nimmt keine Bestechung an. Teile ihnen diese Weisung der Satzung mit, damit sie hören, auf der Hut sind, sich selbst in Acht nehmen und nicht zugrunde gehen und aus dem Land ausgerottet werden. Denn alle, die dies auf der Erde tun, sind vor unserem Gott unrein, befleckt, verunreinigt und besudelt.


    Es gibt keine größere Sünde als die sexuelle Unreinheit, die sie auf der Erde begehen. Denn Israel ist dem HERRN, seinem Gott, ein heiliges Volk, ein Volk seines Erbbesitzes, ein priesterliches Volk, ein königliches Volk und ein eingepflanztes Volk[b]. Unter dem heiligen Volk darf nichts derart Unreines zu sehen sein.


    Im dritten Jahr dieser Jahrwoche zogen Jakob und alle seine Söhne hin und ließen sich im Haus Abrahams nieder, nahe bei Isaak, seinem Vater, und Rebekka, seiner Mutter. Dies sind die Namen der Söhne Jakobs: der Erstgeborene Ruben; Simeon, Levi, Juda, Issachar und Sebulon, die Söhne Leas; Josef und Benjamin, die Söhne Rahels; Dan und Naftali, die Söhne Bilhas; Gad und Ascher, die Söhne Silpas; und Dina, Leas Tochter, die einzige Tochter Jakobs.


    Sie gingen hin und warfen sich vor Isaak und Rebekka nieder. Als diese sie sahen, segneten sie Jakob und alle seine Söhne. Isaak freute sich überaus, weil er die Söhne Jakobs, seines jüngeren Sohnes, sah, und er segnete sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung lautet wörtlich etwa: »die Bedeckung seines Vaters aufdecken«. Gemeint ist eine entehrende sexuelle Verbindung mit der Frau des Vaters. Der Quelltext verwendet hier ein anderes Wort als in der folgenden Formulierung »die Blöße seines Vaters aufdecken«.'
    reason: Erhält die konkrete Gewandmetapher und erläutert die im Quelltext absichtlich beibehaltene lexikalische Unterscheidung.
  - marker: b
    text: 'Oder: »ein gepflanztes Volk«.'
    reason: Das ungewöhnliche Bild kann sowohl das Einpflanzen als auch das daraus hervorgegangene Eingepflanztsein hervorheben.
lexical_decisions:
- source_word: እኩይ ፡ ነገሩ ፡ ጥቀ
  choice: Seine Tat ist sehr böse
  rationale: Gibt die ausdrücklich wertende Eröffnung vollständig wieder; ነገሩ bezeichnet hier die Tat bzw. Angelegenheit.
- source_word: ኪዳነተ ፡ አቡሁ
  choice: den Rock seines Vaters
  rationale: Bewahrt die konkrete Gewandmetapher und unterscheidet sie vom nachfolgenden ኀፍረተ, »Blöße/Scham«.
- source_word: ኀፍረተ ፡ አቡሁ
  choice: die Blöße seines Vaters
  rationale: Gibt den sexuellen und entehrenden Sinn wieder, ohne die bewusste lexikalische Abweichung von »Rock« einzuebnen.
- source_word: ለይኩን ፡ ለይኩን
  choice: So sei es, so sei es!
  rationale: Übersetzt die bekräftigende Formel unmittelbar statt sie ohne Not durch das traditionssprachliche »Amen« zu ersetzen.
- source_word: ዕቅብተ ፡ አቡሁ
  choice: Nebenfrau seines Vaters
  rationale: Bezeichnet Bilha sachlich und verständlich; »Nebenfrau« wahrt den antiken sozialen Status besser als eine moderne Nebenbeziehungsbezeichnung.
- source_word: ኢይነሥእ ፡ ገጸ
  choice: sieht die Person nicht an
  rationale: Bewahrt die gerichtliche Wendung für Unparteilichkeit in geläufiger deutscher Bibelsprache.
- source_word: ዝሙና
  choice: Unzucht
  rationale: Der Kontext meint schwere sexuelle Verfehlung; der würdevolle Sammelbegriff lässt den durch den Kontext bestimmten Umfang stehen.
- source_word: ጥዕት
  choice: eingepflanztes Volk
  rationale: Bewahrt das ungewöhnliche Bild des Quelltexts, statt es als »fest gegründet« oder ähnlich auszudeuten.
theological_decisions:
- issue: Bezeichnung der himmlischen Rechtsordnung
  choice: auf den himmlischen Tafeln geschrieben und festgesetzt
  alternative: in den himmlischen Tafeln geschrieben und angeordnet
  rationale: Bewahrt die im Jubiläenbuch zentrale Vorstellung einer schriftlich fixierten himmlischen Ordnung, ohne ihre genaue materielle oder theologische Beschaffenheit weiter zu erklären.
- issue: Sühne und Vergebung für die Tat
  choice: die absoluten und mehrfach wiederholten Aussagen des Quelltexts bleiben ungemildert stehen
