  verdict: revise
  source_fidelity: Die Identifikation als »die Dienerin Rahels, die Nebenfrau seines Vaters« entspricht dem geʿezischen Text und vermeidet die unzutreffende Gleichsetzung der Frau mit Rahel. Auch »allein in ihrem Bett« gibt den Schluss ohne den unbelegten Zusatz eines weiteren Hauses wieder. Das Verb für sein Verhältnis zu ihr wird jedoch mit »verliebte sich« unnötig romantisierend und aspektuell enger wiedergegeben; »liebte sie« wahrt die offene Formulierung der Quelle.
  naturalness: Der erzählerische Ton ist verständlich. »betrat Bilhas Haus« ist im Deutschen präziser und stilistisch glatter als »ging er in Bilhas Haus«.
  terminology: »Dienerin«, »Nebenfrau« und »Bilha« sind angemessen. »Nebenfrau« wahrt den historischen sozialen Status besser als ein modern missverständliches Ersatzwort.
