  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
translation:
  language: de
  text: die Dienerin Rahels, die Nebenfrau seines Vaters, als sie an einem verborgenen Ort im Wasser badete, und er liebte sie. Er verbarg sich, und in der Nacht betrat er Bilhas Haus und fand sie allein in ihrem Bett schlafend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: die Dienerin Rahels
  rationale: Die ge’ezische Wortgruppe bezeichnet Rahels Dienerin und identifiziert im Erzählzusammenhang Bilha; sie darf nicht als bloßes »Rahel« wiedergegeben werden.
- source_word: ዐቅብተ ፡ አቡሁ
  choice: die Nebenfrau seines Vaters
  rationale: Gibt Bilhas Stellung als Konkubine beziehungsweise Nebenfrau des Vaters in natürlichem, würdigem Deutsch wieder.
- source_word: በኅቡእ
  choice: an einem verborgenen Ort
  rationale: Bewahrt den räumlichen Sinn eines abgeschiedenen beziehungsweise verborgenen Ortes, ohne unnötige Präzisierung.
- source_word: ወአፍቀራ
  choice: und er verliebte sich in sie
  rationale: Das Verb bezeichnet hier auf die Frau gerichtetes Lieben beziehungsweise Begehren; »verliebte sich« ist im Deutschen idiomatisch, ohne den Fortgang vorwegzunehmen.
- source_word: ተኀቢኦ
  choice: Er verbarg sich
  rationale: Formale und kontextgerechte Wiedergabe des reflexiven Verbergens.
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: allein in ihrem Bett
  rationale: Entspricht der ge’ezischen Aussage »in ihrem Bett, sie allein«; ein zusätzliches »in ihrem Haus« am Versende wäre unbelegt.
theological_decisions:
- issue: Identität der badenden Frau
  choice: Bilha wird durch »die Dienerin Rahels, die Nebenfrau seines Vaters« beschrieben.
  alternative: Rahel selbst als Nebenfrau seines Vaters zu verstehen.
  rationale: Die Wortgruppe ለአኪተ ራሔል nennt ausdrücklich Rahels Dienerin; zudem bestätigt das anschließend genannte Haus Bilhas die Referenz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-erzählerischem Ton. Die Appositionen bleiben erhalten, um die Identität und Stellung Bilhas quellennah auszudrücken.
