    issue: »verliebte sich in sie«
    rationale: Die Quelle sagt, dass er sie liebte; das deutsche »verliebte sich« legt einen Beginn und einen romantischen Gefühlswert nahe, die im Text nicht ausdrücklich markiert sind.
  - severity: low
    issue: »ging er in Bilhas Haus«
    rationale: Das Verb bezeichnet das Eintreten in das Haus. »betrat Bilhas Haus« ist genauer und natürliches modernes Standarddeutsch.
