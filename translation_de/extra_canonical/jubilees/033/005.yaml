lexical_decisions:
- source_word: ተኀፍረት
  choice: schämte sie sich
  rationale: Gibt die reflexive Bedeutung des Verbs in natürlichem modernem Deutsch wieder.
- source_word: እምኔሁ
  choice: vor ihm
  rationale: Bewahrt die räumlich-relationale Wendung und folgt der im Kontext plausiblen Bedeutung, ohne eine kausale Lesart einzutragen.
- source_word: ኀደገት እዴሃ እምላዕሌሁ
  choice: nahm ihre Hand von ihm
  rationale: Gibt das Ablösen bzw. Entfernen ihrer Hand von seiner Person klar und idiomatisch wieder.
- source_word: ጐየ
  choice: lief davon
  rationale: Das Verb bezeichnet Fliehen bzw. Davonlaufen; im Deutschen macht „lief davon“ bei weiblichem Subjekt den Handlungsablauf natürlich deutlich.
- source_word: ትላሑ
  choice: sie klagte
  rationale: Gibt Klage oder Wehklage wieder, ohne eine im Ausgangstext nicht ausdrücklich markierte Intensivierung hinzuzufügen.
- source_word: በእንተዝ ነገር
  choice: über diese Sache
  rationale: Nahe Wiedergabe der präpositionalen Wendung; „Sache“ wahrt die allgemeine Bedeutung von ነገር.
