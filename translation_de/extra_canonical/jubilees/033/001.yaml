  language: de
  text: Und Jakob zog und schlug südlich von Migdal-Eder sein Lager auf. Und er ging zu seinem Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሖረ
  choice: zog weiter / ging
  rationale: Das Verb bezeichnet allgemein das Gehen oder Ziehen. Im ersten Satz passt wegen des anschließenden Lageraufschlagens „zog weiter“, im zweiten schlicht „ging“.
- source_word: ኀደረ
  choice: schlug … sein Lager auf
  rationale: Das Verb kann „übernachten, bleiben, lagern“ bedeuten. Im Reisebericht gibt „sein Lager aufschlagen“ die Handlung natürlich und präzise wieder.
- source_word: መንገለ ደቡብ
  choice: südlich von
  rationale: Die Richtungsangabe wird im Deutschen idiomatisch als Lage südlich des genannten Ortes ausgedrückt.
- source_word: መግደላደራፋፍ
  choice: Migdal-Eder
  rationale: Der Ortsname wird in seiner geläufigen semitischen Form wiedergegeben; die verschmolzene geezische Schreibweise weist auf Migdal-Eder.
- source_word: ኀበ አቡሁ
  choice: zu seinem Vater
  rationale: Die Präposition bezeichnet hier die Bewegung zu einer Person hin; das Suffix an „Vater“ bezieht sich auf Jakob.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. „Dann“ stellt den zeitlichen Fortgang natürlich dar, ohne eine zusätzliche inhaltliche Deutung einzuführen.
