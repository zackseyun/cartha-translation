  text: in her house. And he lay with her, and she awoke and saw him, and behold, Reuben was lying with her in the bed. And she uncovered the edge of her covering and seized him and cried out, and she recognized that it was Reuben.
translation:
  language: de
  text: in ihrem Haus.[a] Und er legte sich zu ihr. Da wachte sie auf und sah ihn; und siehe, Ruben lag bei ihr im Bett. Sie schlug den Rand ihrer Decke zurück,[b] packte ihn und schrie auf. Da erkannte sie, dass es Ruben war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „in ihrem Haus“ setzen offenbar den Satz aus Vers 3 fort.
    reason: Der Quelltext beginnt mit einem syntaktisch rückwärtsweisenden Ortsausdruck; die Versgrenze soll sichtbar bleiben, ohne die Worte auszulassen.
  - marker: b
    text: 'Wörtlich etwa: „Sie öffnete/entblößte ihren Flügel (oder Rand).“ Gemeint ist wahrscheinlich der Rand ihrer Bedeckung.'
    reason: Das bildhafte Ausgangswort ist mehrdeutig und lässt sich im Deutschen nicht zugleich wörtlich und natürlich wiedergeben.
lexical_decisions:
- source_word: ውስተ ፡ ቤታ
  choice: in ihrem Haus
  rationale: Die Ortsangabe steht im überlieferten Versanfang; die Kleinschreibung macht kenntlich, dass sie syntaktisch wohl zum vorausgehenden Satz gehört.
- source_word: ወሰከበ ፡ ምስሌሃ
  choice: Und er legte sich zu ihr
  rationale: Das Verb bezeichnet hier das Sich-Hinlegen beziehungsweise Liegen bei jemandem; die Formulierung bewahrt die mögliche sexuelle Bedeutung, ohne sie stärker als der Kontext festzulegen.
- source_word: ወርእየቶ
  choice: und sah ihn
  rationale: Das männliche Objektsuffix wird ausdrücklich wiedergegeben.
- source_word: ይስክብ ፡ ምስሌሃ ፡ ውስተ ፡ ምስካብ
  choice: lag bei ihr im Bett
  rationale: Natürliche deutsche Wiedergabe der durativen Aussage; „bei ihr“ wahrt die Nähe zum Quelltext.
- source_word: ወከሠተት ፡ ክንፋ
  choice: Sie schlug den Rand ihrer Decke zurück
  rationale: Wörtlich steht ein Ausdruck wie „sie öffnete/entblößte ihren Flügel/Rand“; im Bettkontext bezeichnet er plausibel den Rand der Bedeckung.
- source_word: ወአውየወት
  choice: und schrie auf
  rationale: Gibt den plötzlichen Ruf idiomatisch und ohne Hinzufügung direkter Rede wieder.
- source_word: ወአእመረቶ
  choice: Da erkannte sie
  rationale: Das Verb bezeichnet Erkennen beziehungsweise Identifizieren; der Folgesatz benennt die erkannte Person.
theological_decisions:
- issue: Mögliche sexuelle Bedeutung von „bei ihr liegen“
  choice: „legte sich zu ihr“ und später „lag bei ihr“
  alternative: „schlief mit ihr“
  rationale: Die gewählte Fassung lässt die im Kontext vorhandene sexuelle Spannung bestehen, behauptet aber nicht eindeutiger als die Quellformulierung, dass Geschlechtsverkehr stattgefunden habe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Versanfang wird quelltreu beibehalten; kurze Hauptsätze tragen die rasche Erzählbewegung. „Siehe“ bewahrt das narrative Aufmerksamkeitssignal des Ge'ez.
