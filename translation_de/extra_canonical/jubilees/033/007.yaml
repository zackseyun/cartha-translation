  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: de
  text: „Ich bin für dich nicht rein, denn fern von dir bin ich verunreinigt worden. Ruben hat mich verunreinigt und lag in der Nacht bei mir, als ich schlief; ich wusste es nicht, bis er mein Gewand aufdeckte[a] und bei mir lag.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Gewandsaum/Gewandzipfel“. Das Wort kann auch „Flügel“ bedeuten; die genaue Bezeichnung des aufgedeckten Gewandteils bleibt offen.'
    reason: Kennzeichnet die lexikalische Mehrdeutigkeit von ክነፍ, ohne den im Kontext naheliegenden Sinn im Haupttext aufzugeben.
lexical_decisions:
- source_word: ንጽሕተ
  choice: rein
  rationale: Gibt den Zustand kultischer beziehungsweise sexueller Reinheit würdig und im Zusammenhang natürlich wieder, ohne ihn unnötig enger zu bestimmen.
- source_word: ተገመዝኩ
  choice: bin ich unrein gemacht worden
  rationale: Bewahrt die passive Form und macht deutlich, dass die Sprecherin die Verunreinigung erlitten hat.
- source_word: እምኔከ
  choice: fern von dir
  rationale: Gibt die räumlich beziehungsweise relational verstandene Trennung wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: አርኩሰኒ
  choice: hat mich entehrt
  rationale: Das Verb bezeichnet ein Unreinmachen oder Schänden; „entehrt“ vermittelt im Deutschen die sexuelle Verletzung, ohne eine freiwillige Beteiligung anzudeuten.
- source_word: ክነፍየ
  choice: mein Gewand
  rationale: Wörtlich kann das Wort einen Flügel, Saum oder Gewandzipfel bezeichnen; im Kontext ist „Gewand“ verständlich und wahrt die verhüllende Bildsprache.
theological_decisions:
- issue: Verantwortung der schlafenden Sprecherin
  choice: Die Formulierungen stellen ihr Erleiden und ihre Unkenntnis klar heraus.
  alternative: Eine neutralere Wiedergabe könnte lediglich sagen, Ruben habe bei ihr gelegen.
  rationale: Passivformen sowie „während ich schlief“ und „ich wusste nichts davon“ gehören ausdrücklich zum Quelltext und dürfen nicht so geglättet werden, dass Zustimmung anklingt.
- issue: Bedeutungsbereich von Reinheit und Entehrung
  choice: „rein“, „unrein gemacht“ und „entehrt“
  alternative: Durchgehend „verunreinigt“ beziehungsweise „geschändet“
  rationale: Die gewählte Variation erhält sowohl die Reinheitssprache als auch die konkrete persönliche Verletzung, ohne eine bestimmte kultische oder konfessionelle Lehre festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache. „Nicht mehr“ verdeutlicht im Deutschen den eingetretenen Zustandswechsel; kurze Hauptsätze halten die Aussage unmittelbar. Die Wiederholung „lag … bei mir“ bleibt entsprechend dem Quelltext erhalten.
