  text: And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.
translation:
  language: de
  text: Und Jakob wurde sehr zornig auf Ruben, weil er bei Bilha gelegen und die Bedeckung seines Vaters aufgedeckt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Gewand seines Vaters.'
    reason: Das Geʽez-Wort ክዳን kann „Bedeckung“ oder „Gewand“ bedeuten. Die bildhafte Formulierung wird beibehalten und nicht als „Bett“ aufgelöst.
lexical_decisions:
- source_word: ተምዐ ፡ ጥቀ
  choice: wurde sehr zornig
  rationale: Gibt die Verstärkung des Zorns natürlich und quellennah wieder.
- source_word: ሰከበ ፡ ምስለ
  choice: bei … gelegen hatte
  rationale: Bewahrt die biblische Umschreibung für den Geschlechtsverkehr in würdigem, verständlichem Deutsch.
- source_word: ክዳነ ፡ አቡሁ
  choice: die Decke seines Vaters
  rationale: ክዳን bezeichnet eine Bedeckung beziehungsweise ein Gewand. „Decke“ erhält das konkrete Bild des Aufdeckens, ohne gegen den Ge'ez-Wortlaut „Bett“ einzutragen.
theological_decisions:
- issue: Idiوم für die sexuelle Verletzung des Rechts des Vaters
  choice: die Decke seines Vaters aufgedeckt
  alternative: das Gewand / den Rocksaum seines Vaters aufgedeckt; das Bett seines Vaters entehrt
  rationale: Die Übersetzung bewahrt die verhüllende, intertextuell bedeutsame Bildsprache des Ausgangstextes und löst sie nicht durch eine ausdrückliche Deutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch erkennbarer, aber verständlicher Wendung. Das Plusquamperfekt ordnet beide Begründungen zeitlich dem Zorn Jakobs vor.
