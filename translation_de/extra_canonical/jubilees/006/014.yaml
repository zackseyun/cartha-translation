  terminology: »Gesetz«, »Altar«, »Herr«, »Sühne erwirken« und »ausgerottet werden« sind terminologisch angemessen. »Ausgerottet werden« gibt die passive Konsequenz von ይሠረዉ sachgerecht wieder, ohne sie unzulässig zu »vernachlässigen« umzudeuten.
