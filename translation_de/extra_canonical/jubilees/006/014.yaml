  source_fidelity: 'Die Übersetzung bildet die wesentlichen geʿezischen Aussagen zuverlässig ab: die unbegrenzte Geltung der Vorschrift, das Halten über die Generationen, das Flehen für »euch« mit Blut vor dem Altar morgens und abends, die davon unterschiedene Sühnehandlung sowie die passive Schlusswarnung, nicht ausgerottet zu werden. Besonders zutreffend wird ይትመሀለሉ als »flehen« vom folgenden Sühneverb ያስተሰርዩ unterschieden. »Dafür« wahrt den nicht völlig eindeutigen Bezug des pronominalen Objekts.'
