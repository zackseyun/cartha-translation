  text: ወአልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕል፡ እስመ፡ ለዓለም፡ ውእቱ፡ ይዕቀብዎ፡ ለትውልዶሙ፡²⁰ ከመ፡ ይኩኑ፡²¹ እንዘ፡ ይትመሀለሉ፡ *በእንቲአክሙ፡ በደም፡²² በቅድመ፡ ምሥዋዕ፡ በኵሉ፡ ዕለት፡ ወ*ሰዓተ፡²³ ነግህ፡ ወ*ሰርከ፡²⁴ ያስተሰርዩ፡ በእንቲአሁ፡²⁵ ወትረ፡²⁶ ቅድመ፡ እግዚአብሔር፡ ከመ፡ ይዕቀብዎ፡ ወኢ*ይሠረዉ።²⁷
