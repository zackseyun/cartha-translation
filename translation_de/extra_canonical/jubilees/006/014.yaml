base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: de
  text: Und für dieses Gesetz gibt es keine zeitliche Begrenzung, denn es gilt für immer. Sie sollen es über alle ihre Generationen hinweg halten, damit sie täglich morgens und abends mit Blut vor dem Altar für euch flehen und beständig vor dem Herrn dafür Sühne erwirken, damit sie es halten und nicht ausgerottet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቅመ፡ መዋዕል
  choice: zeitliche Begrenzung
  rationale: Die Wendung bezeichnet wörtlich ein »Maß« oder eine »Grenze der Tage«; die natürliche deutsche Formulierung bewahrt den Sinn einer unbegrenzten Geltungsdauer.
- source_word: ይትመሀለሉ
  choice: flehen
  rationale: Das Verb bedeutet bitten, flehen oder Fürsprache leisten. Es wird bewusst vom nachfolgenden Sühneverb unterschieden.
- source_word: በደም፡ በቅድመ፡ ምሥዋዕ
  choice: mit Blut vor dem Altar
  rationale: Die konkrete kultische Ausdrucksweise des Geʿez wird beibehalten, ohne »Blut« deutend zu einer Opferhandlung zu erweitern.
- source_word: ያስተሰርዩ
  choice: Sühne erwirken
  rationale: Das kausative Verb bezeichnet das Bewirken von Sühne beziehungsweise Entsühnung und unterscheidet sich lexikalisch vom vorausgehenden Flehen.
- source_word: ይሠረዉ
  choice: ausgerottet werden
  rationale: Die passive Verbform bezeichnet das Entwurzelt- oder Ausgerottetwerden; sie enthält eine ernste Bundesfolge und bedeutet nicht »es vernachlässigen«.
theological_decisions:
- issue: Verhältnis von Fürbitte und Sühne
  choice: Die beiden Handlungen werden als »flehen« und »Sühne erwirken« unterschieden.
  alternative: Beide Verben als »Sühne leisten« wiedergeben.
  rationale: Der Ausgangstext verwendet zwei verschiedene Verben. Ihre Unterscheidung vermeidet, das Flehen vorschnell mit der kultischen Sühnehandlung gleichzusetzen.
- issue: Bezug von »dafür«
  choice: Das Pronomen bleibt knapp und bezieht sich am ehesten auf die zuvor genannte Verpflichtung beziehungsweise Angelegenheit.
  alternative: Explizit »für das Gesetz« oder »für euch« einsetzen.
  rationale: Der pronominale Bezug im Ausgangstext ist nicht völlig eindeutig; eine stärkere Festlegung würde die vorhandene Spannung beseitigen.
- issue: Schlussfolge
  choice: »nicht ausgerottet werden«
  alternative: »es nicht vernachlässigen«
  rationale: Die passive Form des Geʿez spricht vom Ausgerottetwerden und bewahrt damit die covenantale Warnung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde leicht gegliedert, die kultischen Begriffe und die pronominale Unbestimmtheit wurden jedoch bewahrt. »Über alle ihre Generationen hinweg« gibt die fortdauernde generationenübergreifende Verpflichtung wieder; »morgens und abends« ist die natürliche deutsche Form der Zeitangabe.
