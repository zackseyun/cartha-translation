lexical_decisions:
- source_word: መዓምቅተ፡ ምድር
  choice: die Tiefen der Erde
  rationale: Die Genitivverbindung bezeichnet die tiefen Bereiche der Erde; der Plural „Tiefen“ bewahrt die Form und Bildsprache der Vorlage.
- source_word: ማያት
  choice: das Wasser
  rationale: Das geezische Wort steht formal im Plural, kann jedoch Wasser als Sammelbegriff bezeichnen; im natürlichen modernen Deutsch ist hier der Singular angemessen.
- source_word: ይረድ
  choice: begann … hinabzufließen
  rationale: Das Verb bezeichnet eine Abwärtsbewegung. „hinabzufließen“ gibt sie im Zusammenhang mit Wasser idiomatisch wieder; „begann“ folgt dem einsetzenden Vorgang, den auch die konsultierte englische Fassung ausdrückt.
- source_word: በሠርቀ፡ ወርኅ፡ ዓሥር
  choice: am Neumond des zehnten Monats
  rationale: Wörtlich verweist die Wendung auf das Aufgehen bzw. Erscheinen des zehnten Monats; kalendarisch ist damit der Monatsbeginn beziehungsweise Neumond gemeint.
