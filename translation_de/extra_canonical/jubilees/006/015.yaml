lexical_decisions:
- source_word: ወወሀቦ
  choice: Und er gab
  rationale: Gibt die fortführende Erzählung und das männliche Subjekt des ge'ezischen Verbs knapp wieder.
- source_word: ለኖኅ፡ ወለደቂቁ
  choice: Noah und seinen Söhnen
  rationale: Entspricht der Empfängerangabe; ደቂቅ bezeichnet hier im familiären Zusammenhang die Söhne bzw. Nachkommen Noahs.
- source_word: ትእምርተ
  choice: ein Zeichen
  rationale: Die übliche und kontextgerechte Wiedergabe für ein sichtbares Zeichen.
- source_word: ከመ፡ ኢይኩን፡ ዳግመ
  choice: dass es nie wieder ... geben sollte
  rationale: Gibt die verneinte zukünftige Wiederholung in natürlichem Deutsch wieder, ohne die Aussage stärker zu bestimmen.
- source_word: አይኅ
  choice: eine Flut
  rationale: Bezeichnet die Flut bzw. Überschwemmung; der unbestimmte Artikel klingt im Deutschen an dieser Stelle natürlich.
- source_word: ዲበ፡ ምድር
  choice: über der Erde
  rationale: Bewahrt die räumliche Formulierung der Vorlage; idiomatisch wäre auch „auf der Erde“ möglich.
theological_decisions:
- issue: Reichweite der Zusage
  choice: nie wieder eine Flut über der Erde
  alternative: nie wieder die Sintflut auf Erden
  rationale: Die Übersetzung bewahrt die allgemeine Formulierung der Quelle und vermeidet, durch den feststehenden Ausdruck „die Sintflut“ zusätzliche begriffliche Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die ge'ezische Satzstruktur; keine Fußnote erforderlich.
