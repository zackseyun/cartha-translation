  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: de
  text: Darum werden Jahre über sie kommen, in denen sie die Ordnung durcheinanderbringen. Sie werden einen Tag des Zeugnisses zu einem verabscheuungswürdigen Tag machen[a] und einen unreinen Tag zu einem Festtag. Sie werden alle heiligen Tage mit den unreinen vermischen und den unreinen Tag mit dem heiligen Tag; denn sie werden sich bei den Monaten, Sabbaten, Festen und Jubiläen irren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere, weniger wahrscheinliche Wiedergabe: »Sie werden einen verabscheuungswürdigen Tag zu einem Tag des Zeugnisses machen.«'
    reason: Die ältere Wiedergabe kehrt die syntaktische Zuordnung um; die Fußnote dokumentiert diese überlieferte Alternative, während der Haupttext der besser begründeten ge'ezischen Konstruktion folgt.
lexical_decisions:
- source_word: ዓመታት
  choice: Zeiten
  rationale: Wörtlich „Jahre“; im Zusammenhang bezeichnet der Plural kommende Zeitabschnitte, in denen die Kalenderordnung verfälscht wird. „Zeiten“ ist im Deutschen idiomatischer, ohne den zeitlichen Sinn aufzugeben.
- source_word: ያማስኑ
  choice: die Ordnung durcheinanderbringen
  rationale: Das Verb bezeichnet hier ein Stören, Verderben oder Verwirren; der ergänzte Bezug „die Ordnung“ wird durch den anschließenden Kalenderkontext nahegelegt und entspricht der konsultierten Lesart.
- source_word: ዕለተ፡ ስምዐ
  choice: Tag des Zeugnisses
  rationale: Die Genitivverbindung wird formal bewahrt; „Zeugnis“ lässt die kultisch-kalendarische Bedeutung offen.
- source_word: ምግንተ
  choice: verabscheuungswürdig
  rationale: Gibt den wertenden Sinn „abscheulich, verwerflich“ wieder und wahrt den Kontrast zum heiligen Gedenktag.
- source_word: በዓለ
  choice: Festtag
  rationale: Im Gegensatz zu einem unreinen Tag ist hier die Erhebung zu einem Fest gemeint; „Festtag“ klingt im Deutschen natürlich.
- source_word: ይስሕቱ
  choice: sich irren
  rationale: Entspricht dem Sinn „fehlgehen, irren“ und vermeidet die nicht ausdrücklich markierte Festlegung, ob das Fehlgehen absichtlich ist.
- source_word: አውራኀ
  choice: Monate
  rationale: Direkte Wiedergabe des kalendarischen Plurals.
- source_word: ሰንበታት
  choice: Sabbate
  rationale: Bewahrt den spezifisch religiös-kalendarischen Begriff.
- source_word: ኢዮቤል
  choice: Jubiläen
  rationale: Bezeichnet Jubiläums- beziehungsweise Jobeljahre; „Jubiläen“ bewahrt die Form und den Bezug zum Buchtitel.
theological_decisions:
- issue: Richtung der Umwertung beim „Tag des Zeugnisses“
  choice: „einen Tag des Zeugnisses zu einem verabscheuungswürdigen Tag machen“
  alternative: „einen verabscheuungswürdigen Tag zu einem Tag des Zeugnisses machen“
  rationale: Die ge'ezische Wortfolge und Konstruktion stützen „Tag des Zeugnisses“ als direktes Objekt und „verabscheuungswürdig“ als Objektprädikativ. Damit wird zunächst ein besonderer Tag herabgesetzt; anschließend wird umgekehrt ein unreiner Tag zum Festtag erhoben.
- issue: Moralische Absicht des kalendarischen Irrtums
  choice: „sie werden sich … irren“
  alternative: „sie werden … absichtlich verfälschen“
  rationale: Der Quelltext bezeichnet ein Fehlgehen, legt aber an dieser Stelle die innere Absicht nicht eindeutig fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit in drei Sätze gegliedert. Die wiederholten Gegensätze heilig/unrein und die kalendarische Aufzählung bleiben deutlich erhalten.
