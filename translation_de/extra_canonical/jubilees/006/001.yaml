  yaml_path: translation/extra_canonical/jubilees/006/001.yaml
  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: de
  text: Und am Neumond des dritten Monats ging er aus der Arche hinaus und baute auf jenem Berg einen Altar. Er erwirkte Sühne für die Erde, nahm ein junges Ziegentier und erwirkte mit dessen Blut Sühne für die gesamte Schuld der Erde; denn alles, was auf ihr gewesen war, war vernichtet worden, außer denen, die mit Noah in der Arche waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: am Neumond des dritten Monats
  rationale: Die Wendung bezeichnet den Monatsanfang beziehungsweise Neumond; die knappe kalendarische Form bleibt erhalten.
- source_word: ወፅአ፡ እምአ ታቦት
  choice: ging er aus der Arche hinaus
  rationale: Gibt die Bewegung aus der Arche natürlich und eindeutig wieder.
- source_word: ምሥዋዐ
  choice: Altar
  rationale: Der Kontext des Bauens und der anschließenden Blutriten spricht für einen Opferaltar.
- source_word: አስተስረየ
  choice: schaffte Sühne
  rationale: Bewahrt den kultisch-theologischen Sinn der wiederholten Verbalform, ohne ihn auf bloße Reinigung oder Vergebung zu verengen.
- source_word: መሐስአ፡ ጠሊ
  choice: einen jungen Ziegenbock
  rationale: Die Tierbezeichnung wird als junges männliches Ziegentier wiedergegeben.
- source_word: አበሳ፡ ምድር
  choice: die ganze Schuld der Erde
  rationale: አበሳ kann Schuld, Vergehen oder Sünde bezeichnen; „Schuld“ erhält hier die Verbindung zum Sühneritus und die personifizierende Aussage über die Erde.
- source_word: ተደምሰሰ
  choice: war vernichtet worden
  rationale: Gibt die umfassende Zerstörung des auf der Erde befindlichen Lebens in passiver Form wieder.
theological_decisions:
- issue: Sühne für die Erde durch Tierblut
  choice: Die Aussage wird direkt als „Sühne für die Erde“ und „mit dessen Blut“ wiedergegeben.
  alternative: „die Erde entsühnen/reinigen“
  rationale: Der Text verbindet Erde, Schuld und Blut ausdrücklich. Die Übersetzung bewahrt diese ungewöhnliche kultische Spannung, statt sie erklärend aufzulösen.
- issue: Umfang der Vernichtung
  choice: „alles, was auf ihr gewesen war“
  alternative: „alle, die auf ihr gewesen waren“
  rationale: Die Quellform ist umfassend und wird anschließend durch die Überlebenden in der Arche eingeschränkt. Das neutrale „alles“ erhält diesen Wortlaut, auch wenn Lebewesen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formaler biblischer Satzführung. Die Wiederholung „schaffte Sühne“ bildet die Wiederholung im Ge’ez ab; „jenem Berg“ bewahrt den deiktischen Ausdruck des Quelltexts.
