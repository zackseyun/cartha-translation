  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: de
  text: Darum ist es auf den himmlischen Tafeln angeordnet und niedergeschrieben, dass sie in diesem Monat das Wochenfest feiern sollen, einmal in jedem Jahr, um den Bund Jahr für Jahr zu erneuern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: ist … angeordnet
  rationale: Gibt die passive Festsetzung einer verbindlichen Ordnung natürlich und quellengetreu wieder.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Entspricht der wörtlichen Vorstellung von Tafeln des Himmels und bewahrt den feststehenden Ausdruck der Jubiläenliteratur.
- source_word: በዓል፡ ዘሱባዔ
  choice: Wochenfest
  rationale: Bezeichnet das Fest der Wochen als etablierten Festnamen in prägnantem modernem Deutsch.
- source_word: ለሐዲስ፡ ኪዳን
  choice: um den Bund … zu erneuern
  rationale: Gibt Zweck und Vorgang der Bundeserneuerung wieder, ohne näher zu bestimmen, wer den Bund erneuert.
- source_word: በኵሉ፡ ዓም፡ ወዓመት
  choice: Jahr für Jahr
  rationale: Bewahrt die emphatische jährliche Wiederholung in idiomatischer Form.
theological_decisions:
- issue: Subjekt der Bundeserneuerung
  choice: Infinitivkonstruktion „um den Bund … zu erneuern“
  alternative: „damit der Bund … erneuert werde“
  rationale: Die aktive deutsche Konstruktion folgt dem Zusammenhang mit den Feiernden, legt aber über das grammatisch Nötige hinaus keine bestimmte theologische Deutung des Bundeshandelns fest.
- issue: Status der himmlischen Tafeln
  choice: „angeordnet und niedergeschrieben“
  alternative: „festgesetzt und geschrieben“
  rationale: Bewahrt sowohl den normativen als auch den schriftlich fixierten Charakter der Aussage, ohne diese Bilder umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Festname wird als „Wochenfest“ wiedergegeben; die wiederholte Jahresangabe bleibt zur Wahrung des Nachdrucks als „einmal in jedem Jahr … Jahr für Jahr“ erhalten.
