  to: Wenn sie aber übertreten und sie[a] nicht nach seinem Gebot einhalten, dann werden sie alle ihre Festzeiten durcheinanderbringen; die Jahre werden aus dieser Ordnung geraten,[b] und sie werden gegen ihre Ordnungen verstoßen.
  rationale: Die Änderung ersetzt das bezugsoffene „davon abweichen“ durch das dem Quelltext entsprechende absolute „übertreten“. Die Fußnote zur eingeklammerten Wiederholung wird so umgestellt, dass das aktive Subjekt der Störung eindeutig bei den Übertretenden liegt. Im Übrigen bleiben die pluralische Mehrdeutigkeit, die aktive Kausativbedeutung und die textkritische Behandlung der Wiederholung erhalten.
