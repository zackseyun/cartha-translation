  yaml_path: translation/extra_canonical/jubilees/006/032.yaml
  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: de
  text: Wenn sie aber übertreten und sie[a] nicht nach seinem Gebot einhalten, dann werden sie alle ihre Festzeiten durcheinanderbringen; die Jahre werden aus dieser Ordnung geraten,[b] und sie werden gegen ihre Ordnungen verstoßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „sie“ wiedergegebene Objekt steht im Ge’ez im Plural; sein genauer Bezug ergibt sich aus dem vorausgehenden Zusammenhang.
    reason: Bewahrt die grammatische Zahl und kennzeichnet die verbleibende Bezugsmehrdeutigkeit.
  - marker: b
    text: 'Ein Teil der Überlieferung wiederholt hier sinngemäß: „und sie werden die Festzeiten durcheinanderbringen, und die Jahre werden aus der Ordnung geraten“.'
    reason: Die in der Vorlage eingeklammerte Wiederholung wird nicht in den Haupttext aufgenommen, aber textkritisch kenntlich gemacht.
lexical_decisions:
- source_word: ወኢገብርዎን
  choice: und sie nicht … einhalten
  rationale: Das Objektsuffix ist pluralisch und wird daher mit „sie“ wiedergegeben. „Einhalten“ entspricht im Zusammenhang mit Gebot und Kalenderordnung natürlicher dem Sinn von „tun/befolgen“.
- source_word: ያማስኑ
  choice: sie werden … durcheinanderbringen
  rationale: Die aktive kausative Verbform bezeichnet, dass die Handelnden ihre Festzeiten selbst in Unordnung bringen; eine passive Wiedergabe würde die grammatische Perspektive verändern.
- source_word: ጊዜያቲሆሙ
  choice: ihre Festzeiten
  rationale: Im Kalenderzusammenhang sind bestimmte, festgesetzte Zeiten gemeint; „Festzeiten“ wahrt zugleich den zeitlichen und kultischen Bezug.
- source_word: ይትሐወሱ
  choice: werden … geraten
  rationale: In Verbindung mit „aus dieser Ordnung“ gibt „aus der Ordnung geraten“ die Vorstellung von Verschiebung oder Vermischung idiomatisch wieder, ohne sie unnötig zu präzisieren.
- source_word: ይትዐደዉ፡ ሥርዐቶሙ
  choice: sie werden gegen ihre Ordnungen verstoßen
  rationale: Die Formulierung bewahrt das aktive Überschreiten beziehungsweise Übertreten der eigenen festgesetzten Ordnungen.
theological_decisions:
- issue: Bezug des pluralischen Objekts in „sie nicht … einhalten“
  choice: Das pluralische Pronomen bleibt im Haupttext stehen.
  alternative: Singularisch „es“ mit Bezug auf ein einzelnes Gebot oder eine Ordnung.
  rationale: Die Ge’ez-Form enthält ein pluralisches Objektsuffix. Der genaue Rückbezug ist im isolierten Vers nicht völlig eindeutig und wird daher nicht durch eine singularische Deutung festgelegt.
- issue: Subjekt der Störung der Festzeiten
  choice: 'Aktiv: Die Übertretenden bringen die Festzeiten durcheinander.'
  alternative: 'Passiv: Die Festzeiten werden durcheinandergebracht.'
  rationale: Die aktive kausative Form weist den Übertretenden die Handlung zu; diese Verantwortungszuschreibung darf nicht abgeschwächt werden.
translation_notes:
  register: Moderne, würdige Standardsprache. „Festzeiten“ hält den Kalender- und Kultzusammenhang fest; „aus der Ordnung geraten“ und „durcheinanderbringen“ sind klar und idiomatisch, ohne die im Ausgangstext vorhandenen Bezüge vorschnell zu harmonisieren.
