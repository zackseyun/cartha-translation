  verdict: revise
  source_fidelity: Die einleitende Verbform des Entwurfs („schreibe“) gibt den Satz nicht zutreffend wieder. Der geʿezische Wortlaut beschreibt, wie auch die englische Audit-Fassung, ein bereits vorliegendes, über die Adressaten geschriebenes Zeugnis; er enthält hier keine Aufforderung zum Schreiben. Die zeitliche Totalität, die drei Tiergruppen und die Sanktion einschließlich der Nachkommenschaft werden in der Revision erhalten.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Über euch geschrieben“ bildet die knappe, rechtlich geprägte Formulierung ohne unnötige Archaisierung ab; „solange die Erde besteht“ ist eine natürliche Wiedergabe von „an allen Tagen der Erde“.
  terminology: „Zeugnis“ ist für die verbindliche Bezeugung angemessen. „Wildtiere, Vögel oder Vieh“ erhält die Dreiteilung. „Ausgerottet“ gibt die harte Sanktion wieder, ohne ihren Mechanismus oder eine konfessionelle Deutung hinzuzufügen.
  issues:
  - severity: high
    issue: Die Einleitung wird als Schreibbefehl übersetzt.
    rationale: „Und schreibe dieses Zeugnis ... auf“ verändert eine Aussage über ein geschriebenes Zeugnis in eine direkte Aufforderung. Dies widerspricht dem vorliegenden geʿezischen Satzbau und der englischen Audit-Fassung („this testimony is written concerning you“).
  - severity: low
    issue: „allezeit bewahrt“ kann bei einem Gebot weniger präzise als „haltet“ sein.
    rationale: Das Verb bezeichnet hier das Beachten bzw. Halten der Anordnung. „Haltet“ macht die normative Funktion klar, ohne den Sinn zu verändern.
  revised_text: 'Und dieses Zeugnis ist über euch geschrieben, damit ihr es allezeit haltet: Ihr dürft niemals Blut von Wildtieren, Vögeln oder Vieh essen, solange die Erde besteht. Wer Blut von Wildtieren, Vieh oder Vögeln isst, solange die Erde besteht, der soll samt seinen Nachkommen von der Erde ausgerottet werden.'
