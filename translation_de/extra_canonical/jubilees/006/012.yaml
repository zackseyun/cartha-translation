base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: de
  text: 'Und dieses Zeugnis ist über euch geschrieben, damit ihr es allezeit haltet: Ihr dürft niemals Blut von Wildtieren, Vögeln oder Vieh essen, solange die Erde besteht. Wer Blut von Wildtieren, Vieh oder Vögeln isst, solange die Erde besteht, der soll samt seinen Nachkommen von der Erde ausgerottet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽሕፍት
  choice: schreibe … auf
  rationale: Die Form wird als Schreibaufforderung wiedergegeben; „aufschreiben“ ist im heutigen Deutsch natürlich und bewahrt den konkreten Vollzug.
- source_word: ስምዕ
  choice: Zeugnis
  rationale: Das Wort bezeichnet hier eine verbindliche Bezeugung bzw. Mahnung; „Zeugnis“ erhält den rechtlich-bundesbezogenen Klang.
- source_word: አራዊት … አዕዋፍ … እንስሳ
  choice: Wildtiere, Vögel oder Vieh
  rationale: Die drei Tiergruppen werden unterschieden; „Vieh“ gibt domestizierte Tiere idiomatisch wieder.
- source_word: በኵሉ መዋዕለ ምድር
  choice: solange die Erde besteht
  rationale: Die wörtliche Wendung „an allen Tagen der Erde“ bezeichnet die gesamte Dauer des irdischen Bestehens; die natürliche deutsche Fassung bewahrt diesen zeitlichen Umfang.
- source_word: ይስሮ
  choice: soll … ausgerottet werden
  rationale: Die Sanktion bezeichnet die Entfernung bzw. Vernichtung aus dem Land; das Passiv und der verpflichtend-urteilende Ton bleiben erhalten.
- source_word: ዘርኡ
  choice: seinen Nachkommen
  rationale: Wörtlich „sein Same“ meint hier die Nachkommenschaft; die moderne Formulierung ist klar und würdig.
theological_decisions:
- issue: Geltungsdauer des Blutverbots
  choice: „an keinem Tag“ und „solange die Erde besteht“
  alternative: „alle Tage der Erde hindurch“
  rationale: Die umfassende zeitliche Aussage des Ausgangstextes wird nicht eingeschränkt oder heilsgeschichtlich relativiert.
- issue: Reichweite der angekündigten Strafe
  choice: „samt seinen Nachkommen“
  alternative: „er und sein Same“
  rationale: Der Text bezieht die Nachkommenschaft ausdrücklich ein. Diese theologische Spannung wird bewahrt, ohne sie erklärend abzuschwächen.
- issue: Modalität der Sanktion
  choice: „soll … ausgerottet werden“
  alternative: „wird … ausgerottet werden“
  rationale: Die Form kann als richterliche Bestimmung oder als Zukunftsansage verstanden werden. „Soll“ erhält den normativ-urteilenden Charakter, ohne den Vollzug näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Tiergruppen und die umfassende Zeitangabe bleiben erhalten; unnötig archaische Wendungen wie „sein Same“ oder „alle Tage der Erde“ werden vermieden.
