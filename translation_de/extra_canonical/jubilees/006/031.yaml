base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: de
  text: 'Und du, gebiete den Kindern Israels, die Jahre nach dieser Berechnung einzuhalten: dreihundertvierundsechzig Tage; so wird es ein volles Jahr sein. Es wird seine Zeit nicht durch seine Tage und durch seine Feste verschieben; denn alles wird darin ihrem Zeugnis gemäß eintreffen. Sie werden keinen Tag auslassen und kein Fest verschieben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእንተኒ
  choice: Und du
  rationale: Das selbstständige Pronomen hebt den Angesprochenen ausdrücklich hervor; die knappe deutsche Form bewahrt diesen Nachdruck.
- source_word: ኍልቍ
  choice: Berechnung
  rationale: Bezeichnet hier die kalendarische Zählung beziehungsweise Berechnungsweise.
- source_word: ፍጹመ፡ ዓመተ
  choice: vollständiges Jahr
  rationale: Gibt die Vorstellung eines vollendeten, in seiner Tageszahl vollständigen Jahres unmittelbar wieder.
- source_word: ያማስን / ያማስኑ
  choice: verschieben
  rationale: Passt im kalendarischen Zusammenhang natürlich zum Verändern oder Verrücken festgesetzter Zeiten; der Wechsel vom Singular zum Plural wird beibehalten.
- source_word: በዓላቲሁ / በዓለ
  choice: seiner Feste / ein Fest
  rationale: Gibt die kultischen Festzeiten einheitlich und in allgemein verständlicher Sprache wieder.
- source_word: ይበጽሕ
  choice: eintreffen
  rationale: Bewahrt den konkreten Sinn des Eintretens beziehungsweise Ankommens zu der vorgesehenen Zeit.
- source_word: ኢየኀልፉ፡ ዕለተ
  choice: keinen Tag auslassen
  rationale: Drückt im Kontext einer Kalenderzählung verständlich aus, dass kein Tag übersprungen oder übergangen werden soll.
theological_decisions:
- issue: Verbindlichkeit des 364-Tage-Kalenders
  choice: Die Aussage wird als uneingeschränkte Anweisung und als vollständiges Jahr wiedergegeben.
  alternative: Die Kalenderangabe durch eine erklärende oder relativierende Formulierung abschwächen.
  rationale: Der Quelltext formuliert ausdrücklich normativ; eine konfessionelle oder historische Einordnung gehört nicht in den Vers selbst.
- issue: Unbestimmter Bezug von „ihrem Zeugnis“
  choice: Das pluralische Pronomen bleibt ohne erklärende Auflösung stehen.
  alternative: Das Zeugnis ausdrücklich den Tagen, Festen oder kalendarischen Ordnungen zuordnen.
  rationale: Der Quelltext nennt einen pluralischen Bezug, legt dessen genaue Referenz hier aber nicht zweifelsfrei fest; die Mehrdeutigkeit soll erhalten bleiben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bleibt quellennah, wird jedoch durch Doppelpunkt und Semikolon lesbar gegliedert. Der grammatische Gegensatz zwischen dem singularischen Jahr („Es wird … verschieben“) und dem späteren pluralischen Subjekt („Sie werden …“) ist bewusst bewahrt.
