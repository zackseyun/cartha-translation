  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
translation:
  language: de
  text: Die Gipfel der Berge wurden sichtbar, und Noah freute sich. Deshalb setzte er sie für sich als Feste zum ewigen Gedenken ein; und so sind sie eingesetzt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: die Gipfel der Berge
  rationale: Die Verbindung bezeichnet wörtlich die »Häupter« beziehungsweise Gipfel der Berge; diese natürliche deutsche Wendung bewahrt das konkrete Bild.
- source_word: ተፈሥሐ
  choice: freute sich
  rationale: Gibt Noahs Freude schlicht und idiomatisch wieder, ohne die Aussage emotional auszuschmücken.
- source_word: ሠርዓን፡ ኪያሆን፡ ሎቱ
  choice: setzte er sie für sich … ein
  rationale: Bewahrt sowohl den ordnenden beziehungsweise festsetzenden Sinn des Verbs als auch den Rückbezug auf Noah durch »für sich«.
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: als Feste zum ewigen Gedenken
  rationale: Die im vollständigen Vers bezeugte Fortsetzung bezeichnet Feste, die dauerhaft dem Gedenken dienen; »zum ewigen Gedenken« ist im Deutschen klar und würdig.
- source_word: ወከማሁ፡ ሠርዓዋ
  choice: und so sind sie eingesetzt
  rationale: Gibt die abschließende Bestätigung knapp wieder und erhält den Zusammenhang mit Noahs vorheriger Einsetzung.
theological_decisions:
- issue: Zweck und Dauer der Feste
  choice: als Feste zum ewigen Gedenken
  alternative: als Feste für immer
  rationale: Die vollständige ge’ezische Überlieferung enthält ausdrücklich den Gedanken des Gedenkens. Er darf daher nicht zugunsten einer bloßen Zeitangabe ausgelassen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am ge’ezischen Ablauf, ohne im Deutschen steif zu wirken. Das Pronomen »sie« bleibt wie in der Textgestalt stehen und bewahrt damit den Rückbezug des Zusammenhangs, statt ihn auslegend zu ersetzen.
