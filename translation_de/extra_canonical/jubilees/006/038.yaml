  text: በእንተዝ፡ አነ፡ እኤዝዘከ፡ ወአስምዕ፡ ለከ፡ ከመ፡ ታስምዕ፡ ሎሙ፡ እስመ፡ እምድኅረ፡ ሞትከ፡ ያማስኑ፡ ውሉድከ፡ ከመ፡ ኢይገብሩ፡ ዓመተ፡ ፪ሠለስተ፡ ምእተ፡ ወስሳ፡ ፫ ወረቡዐ፡ ፬ መዋዕለ፡ ፭ ባሕቲተከ፡ ወ ፮በእንተ ፯ዝ፡ ፰ ይስሕቱ፡ ሠርቀ፡ ፱ ወጊዜ፡ ወ ፲ሰንበተ፡ ፲፩ ወበዓላተ፡ ወይበልዑ፡ ኵሎ፡ ደመ፡ ምስለ፡ ኵሉ፡ ፲፪ሥጋ።
