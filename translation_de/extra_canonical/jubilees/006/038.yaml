  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzfolge, die kalenderbezogene Aussage von 364 Tagen sowie die umfassende Schlussformulierung eng und zutreffend wieder. „Bezeugen“ ist für die wiederholte geʿezische Verbform im ermahnenden Zusammenhang vertretbar und wahrt deren feierliches Gewicht. Der nicht erneut genannte Gegenstand von „verderben“ bleibt angemessen pronominalisch offen.
  naturalness: 'Der Text ist insgesamt modernes, würdiges Standarddeutsch. Im zweiten Teil der Wiederholung sollte jedoch das Akkusativobjekt ausdrücklich gesetzt werden: „ihnen bezeugst“ ist zwar unter Umständen elliptisch lesbar, ist aber weniger eindeutig als die erste Wendung „bezeuge es dir“ und schwächt die beabsichtigte Verbwiederholung.'
  terminology: „Neumonde“, „Zeiten“, „Sabbate“ und „Feste“ sind sachgerecht. „Alles Blut mit allem Fleisch“ erhält die absichtlich ungewöhnliche, umfassende Formulierung der Vorlage, ohne sie interpretierend zu glätten.
