  revised_text: Darum gebiete ich dir und bezeuge es dir, damit du es ihnen bezeugst; denn nach deinem Tod werden deine Kinder es verderben, sodass sie das Jahr nicht auf nur 364 Tage festlegen. Darum werden sie sich bei den Neumonden, den Zeiten, den Sabbaten und den Festen irren, und sie werden alles Blut mit allem Fleisch essen.
  revised_footnotes: []
