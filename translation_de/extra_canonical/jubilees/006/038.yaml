base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: de
  text: Darum gebiete ich dir und bezeuge es dir, damit du es ihnen bezeugst; denn nach deinem Tod werden deine Kinder es verderben, sodass sie das Jahr nicht auf nur 364 Tage festlegen. Darum werden sie sich bei den Neumonden, den Zeiten, den Sabbaten und den Festen irren, und sie werden alles Blut mit allem Fleisch essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስምዕ ... ታስምዕ
  choice: bezeuge es ... bezeugst es
  rationale: Das Kausativ von ሰምዐ kann hier im mahnend-bundeshaften Zusammenhang das Bezeugen ausdrücken; die Wiederholung des Verbs wird bewahrt.
- source_word: ያማስኑ
  choice: werden ... es verderben
  rationale: Gibt den kausativen Sinn von Verderben oder Verfälschen wieder; das Pronomen bezieht sich im Zusammenhang auf die geordnete Jahresrechnung.
- source_word: ኢይገብሩ ዓመተ ... መዋዕለ ባሕቲተከ
  choice: sodass sie das Jahr nicht auf nur 364 Tage festlegen
  rationale: Natürliches Deutsch für die Herstellung beziehungsweise Bestimmung eines Jahres von ausschließlich 364 Tagen, ohne die kalendarische Aussage abzuschwächen.
- source_word: ሠርቀ
  choice: Neumonden
  rationale: Im kalendarischen Kontext bezeichnet der Ausdruck den Mondaufgang beziehungsweise die Neumonde; „Neumonde“ entspricht der Aufzählung von Zeiten, Sabbaten und Festen.
- source_word: ጊዜ
  choice: Zeiten
  rationale: Bewahrt den allgemeinen kalendarischen Ausdruck und vermeidet eine unbelegte Präzisierung als Jahreszeiten oder Festzeiten.
- source_word: ኵሎ ደመ ምስለ ኵሉ ሥጋ
  choice: alles Blut mit allem Fleisch
  rationale: Die auffällige umfassende Formulierung wird eng am Geʿez wiedergegeben und nicht zu „allerlei Blut/Fleisch“ geglättet.
theological_decisions:
- issue: Bedeutung von አስምዐ im Ermahnungs- und Bundeskontext
  choice: bezeuge es dir / bezeugst es ihnen
  alternative: mache es dir bekannt / machst es ihnen bekannt
  rationale: „Bezeugen“ erhält das feierliche, verpflichtende Gewicht der Aussage und bildet zugleich die Wiederholung des Quellverbs ab, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bezug des verderbten Gegenstands
  choice: Pronomen „es“ ohne ausdrückliche Ergänzung
  alternative: „die Ordnung des Jahres“
  rationale: Die Quelle nennt den Gegenstand nicht erneut ausdrücklich. Das Pronomen bewahrt diese Ellipse und lässt den Kontext der Jahresordnung den Bezug liefern.
- issue: Blut und Fleisch in der Schlussklausel
  choice: alles Blut mit allem Fleisch
  alternative: allerlei Blut mit allerlei Fleisch
  rationale: Die umfassenden Singularausdrücke werden formal erhalten; eine Deutung als verschiedene Arten würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Wiederholung „bezeuge“ sowie die kalendarische Aufzählung bleiben erhalten. Ziffern fördern die unmittelbare Lesbarkeit der exakten Jahreszahl; die ungewöhnliche Schlussformulierung wird bewusst nicht geglättet.
