  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: de
  text: Und siehe, ich habe euch alle Tiere gegeben, alles, was fliegt, alles, was sich auf der Erde bewegt, und die Fische in den Gewässern – alles zur Nahrung. Wie die grünen Pflanzen habe ich euch alles zu essen gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ
  choice: sieh
  rationale: Gibt die präsentative Aufforderung natürlich und würdevoll wieder.
- source_word: አራዊተ
  choice: Tiere
  rationale: Der allgemeine Ausdruck bezeichnet hier die Landtiere; „Tiere“ vermeidet eine unnötige Einengung auf Wildtiere.
- source_word: ዘይሰርር
  choice: was fliegt
  rationale: Gibt das ge'ezische Verb für fliegen wieder und bewahrt die im revidierten Ausgangsbefund erkannte Gruppe der Flugtiere.
- source_word: ዘይትሐወስ
  choice: was sich auf der Erde bewegt
  rationale: Entspricht dem Sinn „sich bewegen/umhergehen“ und verbindet die Ortsangabe idiomatisch mit dem Relativsatz.
- source_word: ለሲሲት
  choice: zur Nahrung
  rationale: Drückt den Zweck prägnant aus; der Ausdruck bezieht sich zusammenfassend auf die genannten Lebewesen.
- source_word: ሐምለ፡ ሣዕር
  choice: grüne Pflanzen
  rationale: Natürliche deutsche Wiedergabe der pflanzlichen Nahrung, in sachlicher Nähe zu Genesis 9,3.
theological_decisions:
- issue: Umfang der Nahrungsgabe
  choice: „alles zur Nahrung … alles zu essen“
  alternative: Die Aussage auf bestimmte Tiergruppen oder kultisch reine Tiere beschränken
  rationale: Der Quelltext formuliert umfassend und nennt an dieser Stelle keine kultische Einschränkung; eine solche wäre nicht in den Vers einzutragen.
- issue: Verhältnis zur Gabe der Pflanzen
  choice: „Wie die grünen Pflanzen“
  alternative: „Zusammen mit den grünen Pflanzen“
  rationale: Die Vergleichspartikel bezeichnet die frühere Pflanzengabe als Analogie zur nun beschriebenen umfassenden Nahrungsgabe.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem biblischem Ton. Die Aufzählung des Ge'ez wird bewahrt, zugleich durch deutsche Zeichensetzung übersichtlich gestaltet. Keine Fußnote nötig, da die beiden Verben hier klar als „fliegt“ und „sich bewegt“ wiedergegeben werden.
