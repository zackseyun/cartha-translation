  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: de
  text: Und alle Kinder Israels werden vergessen; den Weg der Jahre werden sie nicht finden. Sie werden die Neumonde, die festgesetzten Zeiten und die Sabbate vergessen und sich hinsichtlich der gesamten Ordnung der Jahre irren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎሙ ውሉደ እስራኤል
  choice: alle Kinder Israels
  rationale: Gibt die traditionelle und im Deutschen verständliche Abstammungsbezeichnung wörtlich und würdig wieder.
- source_word: ፍኖተ ዓመታት
  choice: den Weg der Jahre
  rationale: Bewahrt das konkrete Bild des Weges und seinen Bezug zur richtigen Kalenderordnung.
- source_word: ሠርቀ
  choice: die Neumonde
  rationale: Im kalendarischen Zusammenhang bezeichnet der Ausdruck die Neumonde beziehungsweise Monatsanfänge; die traditionelle Wiedergabe lässt diesen Sachbezug sichtbar.
- source_word: ጊዜ
  choice: die festgesetzten Zeiten
  rationale: Der Kontext nennt kalendarisch bestimmte beziehungsweise festgelegte Zeiten; diese Wiedergabe ist genauer als das allgemeinere „Zeiten“ oder „Jahreszeiten“.
- source_word: ሰንበተ
  choice: die Sabbate
  rationale: Bewahrt den spezifischen kultisch-kalendarischen Begriff im Plural.
- source_word: ኵሎ ሥርዐተ ዘዓመታት ይጌግዩ
  choice: in der ganzen Ordnung der Jahre irren
  rationale: Gibt sowohl die umfassende Kalenderordnung als auch das Abweichen davon knapp und quellennah wieder.
theological_decisions:
- issue: Bedeutung der festgesetzten Zeiten
  choice: festgesetzte Zeiten
  alternative: Feste / Jahreszeiten
  rationale: Die Formulierung wahrt die kalendarisch-kultische Reichweite, ohne den Ausdruck ausschließlich auf Festtage oder natürliche Jahreszeiten festzulegen.
- issue: Kalendarische Aussage des Verses
  choice: Bild und Terminologie der Jahresordnung beibehalten
  alternative: als Verlust des richtigen Kalenders erklärend umschreiben
  rationale: Der Text wird nicht auf eine bestimmte spätere Kalenderlehre festgelegt; seine eigene Spannung zwischen Vergessen, Nichtfinden und Irren bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen biblisch-kalendarischen Ausdrücken. Der erste Satz wird zur besseren Lesbarkeit geteilt; die wiederholte Aussage des Vergessens bleibt erhalten.
