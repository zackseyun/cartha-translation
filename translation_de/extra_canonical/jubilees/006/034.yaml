base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: de
  text: Denn ich weiß es, und von nun an werde ich es dir kundtun – nicht aus meinem eigenen Herzen; denn das Buch liegt vor mir geschrieben, und auf den himmlischen Tafeln sind die Einteilungen der Tage[a] festgesetzt, damit sie die Feste des Bundes nicht vergessen und sich nicht nach den Festen der Völker richten, ihrem Irrtum und ihrer Unwissenheit folgend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einteilungen der Zeiten«.'
    reason: Bewahrt die mögliche kontextuelle Wiedergabe von »Tage« als kalendarisch bestimmte Zeiten.
lexical_decisions:
- source_word: መዋዕል
  choice: Tage
  rationale: Das Substantiv bezeichnet wörtlich »Tage«; im unmittelbaren Zusammenhang geht es um die genaue kalendarische Gliederung der Tage.
- source_word: ተሠርዐ
  choice: sind ... festgesetzt
  rationale: Gibt die Vorstellung einer verbindlich angeordneten beziehungsweise festgelegten Ordnung wieder.
- source_word: የሐውሩ
  choice: sich ... richten
  rationale: Das wörtliche »gehen« bezeichnet hier idiomatisch das Befolgen einer fremden Festordnung.
- source_word: አሕዛብ
  choice: Völker
  rationale: Neutrale und kontextgerechte Wiedergabe für die nicht zum Bund gehörenden Nationen.
theological_decisions:
- issue: Ursprung der offenbarten Kalenderordnung
  choice: »nicht aus meinem eigenen Herzen« bleibt ausdrücklich erhalten
  alternative: 'Sinngemäß: »nicht aus eigener Überlegung«'
  rationale: Die Formulierung wahrt den Gegensatz zwischen persönlichem Hervorbringen und der auf den himmlischen Tafeln vorgegebenen Offenbarung, ohne ihn konfessionell auszudeuten.
- issue: Einteilungen der Tage
  choice: Wörtliche kalendarische Formulierung
  alternative: »Einteilungen der Zeiten«
  rationale: »Tage« entspricht dem ge'ezischen Ausdruck und bewahrt den besonderen Nachdruck des Buches auf der exakten Tageszählung.
- issue: Schlusskonstruktion zu Irrtum und Unwissenheit
  choice: »ihrem Irrtum und ihrer Unwissenheit folgend«
  alternative: »infolge ihres Irrtums und ihrer Unwissenheit«
  rationale: Die syntaktische Beziehung bleibt bewusst offen genug, um sowohl das Folgen des heidnischen Weges als auch dessen Kennzeichnung durch Irrtum und Unwissenheit anklingen zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »kundtun« trägt den Offenbarungscharakter, ohne den Satz unnötig zu archaisieren; Satzbau und Begriffe bleiben nahe an der ge'ezischen Vorlage.
