  yaml_path: translation/extra_canonical/jubilees/006/013.yaml
  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: de
  text: Und du, gebiete den Kindern Israels, keinerlei Blut zu essen, damit ihr Name und ihre Nachkommen allezeit vor Jahwe, unserem Gott, seien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: Kinder Israels
  rationale: Die formnahe und im Deutschen verständliche Wiedergabe bewahrt die traditionelle kollektive Bezeichnung.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ
  choice: keinerlei Blut zu essen
  rationale: 'Die Negation mit ኵሎ፡ ደመ bezeichnet ein umfassendes Verbot: Blut jeder Art darf nicht gegessen werden.'
- source_word: ስሞሙ፡ ወዘርኦሙ
  choice: ihr Name und ihre Nachkommen
  rationale: ዘርዕ bezeichnet wörtlich Samen, hier idiomatisch die Nachkommenschaft; der Singular 'Name' wird bewahrt.
- source_word: ቅድመ፡ እግዚአብሔር፡ አምላክነ
  choice: vor Jahwe, unserem Gott
  rationale: ቅድመ wird räumlich-relational mit 'vor' wiedergegeben; der Gottesname folgt der POB-Konvention als 'Jahwe'.
- source_word: ኵሎ፡ መዋዕለ
  choice: allezeit
  rationale: Die Wendung bedeutet dauerhaft beziehungsweise für alle Tage; 'allezeit' ist knapp und würdevoll.
theological_decisions:
- issue: Bedeutung des Bestehens vor Gott
  choice: bestehen bleiben
  alternative: sein
  rationale: Das Äthiopische formuliert mit dem Existenzverb 'sein'; im Deutschen macht 'bestehen bleiben' den durch ከመ eingeleiteten Zweck und den Fortbestand von Name und Nachkommenschaft natürlich verständlich, ohne die Art des göttlichen Wohlwollens näher festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt dem Quelltext eng, wird aber durch 'keinerlei' und 'bestehen bleiben' idiomatisch geglättet. Keine konfessionell geprägte Zusatzdeutung.
