  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: de
  text: Aber Abraham allein hielt es ein, und Isaak, Jakob und seine Kinder hielten es ein bis zu deinen Tagen. In deinen Tagen aber vergaßen es die Kinder Israels, bis ich es für sie auf diesem Berg erneuerte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  choice: allein
  rationale: Das Adverb hebt Abraham als denjenigen hervor, der die betreffende Ordnung im Gegensatz zu anderen bewahrte.
- source_word: ዐቀበ / ዐቀብዋ
  choice: hielt es ein / hielten es ein
  rationale: Das Verb bedeutet grundsätzlich „bewahren, hüten“; bei einer zuvor genannten Festordnung ist „einhalten“ im Deutschen natürlich und sachlich passend.
- source_word: ረከቡ
  choice: vergaßen
  rationale: Der überlieferte äthiopische Wortlaut ist an dieser Stelle textkritisch auffällig; der Zusammenhang und die konsultierte englische Fassung setzen die Bedeutung „vergessen“ voraus.
- source_word: ኀይስክዎሙ
  choice: ich es für sie … erneuerte
  rationale: Die Form bezeichnet hier die Wiederherstellung beziehungsweise Erneuerung der vergessenen Ordnung zugunsten Israels.
- source_word: በኀበዝ፡ ደብር
  choice: auf diesem Berg
  rationale: Die deiktische Wendung verweist im Erzählrahmen auf den Berg, an dem die Offenbarung an Mose erfolgt.
theological_decisions:
- issue: Bezug des ungenannten Objekts
  choice: Das Pronomen „es“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Die zuvor behandelte Festordnung ausdrücklich benennen.
  rationale: Der Vers setzt sein Bezugswort aus dem Kontext voraus; eine ausdrückliche Benennung würde mehr festlegen als der vorgelegte Wortlaut.
- issue: Erneuerung durch den Sprecher
  choice: „bis ich es für sie … erneuerte“
  alternative: „bis ich es ihnen … wieder offenbarte“
  rationale: „Erneuern“ bewahrt die Aussage des konsultierten Textes und lässt offen, ob primär die Praxis, die Kenntnis oder die verbindliche Ordnung wiederhergestellt wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „hielt es ein“ bewahrt die Struktur und Betonung des Ausgangstextes; „Kinder Israels“ erhält die traditionelle kollektive Bezeichnung.
