  yaml_path: translation/extra_canonical/jubilees/006/010.yaml
  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: de
  text: Und Noah und seine Söhne schworen, kein Blut zu essen, das in irgendeinem Fleisch ist. Und er schloss in diesem Monat vor dem Herrn Gott einen Bund für immer, für alle Generationen der Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐኩ
  choice: schworen
  rationale: Gibt den Eidcharakter des geezischen Verbs unmittelbar und idiomatisch wieder.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ፡ ዘበኵሉ፡ ሥጋ
  choice: keinerlei Blut zu essen, das in irgendeinem Fleisch ist
  rationale: Bewahrt die umfassende Doppelung von ‚alles/irgendein‘ im Ausgangstext, ohne sie im Deutschen unnötig schwerfällig zu machen.
- source_word: ተካየደ፡ ኪዳነ
  choice: schloss … einen Bund
  rationale: Die feste deutsche Wendung ‚einen Bund schließen‘ gibt die Begründung beziehungsweise Inkraftsetzung eines Bundes natürlich und würdig wieder.
- source_word: እግዚአብሔር፡ አምላክ
  choice: Gott, dem Herrn
  rationale: Gibt die geezische Gottesbezeichnung wieder, ohne den nicht vorhandenen Eigennamen JHWH einzuführen.
- source_word: ለዓለም
  choice: ewigen
  rationale: Im Zusammenhang mit dem Bund und den nachfolgenden Generationen bezeichnet der Ausdruck dessen dauernde Geltung.
theological_decisions:
- issue: Subjekt des Bundesschlusses
  choice: Und er schloss … einen Bund
  alternative: Und sie schlossen … einen Bund
  rationale: Der geezische Text wechselt nach dem pluralischen Schwören zu einer singularischen Verbform. Diese Spannung wird bewahrt und nicht stillschweigend harmonisiert.
- issue: Wiedergabe der Gottesbezeichnung
  choice: Gott, dem Herrn
  alternative: dem HERRN, Gott
  rationale: Die Quelle enthält nicht den Gottesnamen JHWH; daher wird keine typografische Ersatzform wie ‚HERR‘ verwendet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, während die auffällige Numerusverschiebung vom pluralischen Eid zum singularischen Bundesschluss erhalten bleibt.
