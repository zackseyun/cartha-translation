revisions:
- from: Und Noah und seine Söhne schworen, keinerlei Blut zu essen, das in irgendeinem Fleisch ist. Und er schloss vor Gott, dem Herrn, einen ewigen Bund für alle Generationen der Erde, in diesem Monat.
  to: Und Noah und seine Söhne schworen, kein Blut zu essen, das in irgendeinem Fleisch ist. Und er schloss in diesem Monat vor dem Herrn Gott einen Bund für immer, für alle Generationen der Erde.
  rationale: Die Revision stellt die Gottesbezeichnung in die Reihenfolge der Quelle, bindet „in diesem Monat“ eindeutig an den Bundesschluss und gibt die fortdauernde Geltung des Bundes explizit als „für immer, für alle Generationen der Erde“ wieder. Das singuläre „er“ wird beibehalten, da die Quelle nach dem pluralischen Eid eine singularische Verbform bietet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:03Z'
review_pass:
  verdict: revise
  source_fidelity: Der Eid Noahs und seiner Söhne sowie das Verbot, Blut zu essen, sind zutreffend wiedergegeben. Der zweite Satz sollte jedoch die Reihenfolge und Reichweite von „für immer … durch alle Generationen der Erde“ klarer abbilden. Die Gottesbezeichnung steht im Ge'ez als „Herr Gott“, nicht als „Gott, der Herr“. Die singularische Form beim Bundesschluss bleibt im Deutschen als „er“ erhalten und wahrt damit die auffällige Vorlage.
  naturalness: „Kein Blut zu essen“ und „einen Bund schließen“ sind natürliches, würdiges modernes Standarddeutsch. Die Umstellung von „in diesem Monat“ an die Stelle des Bundesschlusses verhindert, dass die Zeitangabe missverständlich nur die Generationenbestimmung zu modifizieren scheint.
  terminology: „Herr Gott“ gibt እግዚአብሔር አምላክ in der Quellreihenfolge angemessen wieder, ohne den nicht belegten Gottesnamen JHWH einzuführen. „Bund“ und „für immer“ entsprechen den zentralen Begriffen ኪዳን und ለዓለም.
  issues:
  - severity: medium
    issue: Gottesbezeichnung in umgekehrter Reihenfolge
    rationale: „Gott, dem Herrn“ stellt die Quellbezeichnung እግዚአብሔር አምላክ („Herr Gott“) um. „vor dem Herrn Gott“ ist quellnäher und im Deutschen möglich.
  - severity: low
    issue: Stellung und Anbindung der Zeit- und Dauerangaben
    rationale: Die Fassung „einen ewigen Bund für alle Generationen der Erde, in diesem Monat“ lässt die Struktur der Aussage weniger klar erkennen. Die Quelle verbindet den Bundesschluss mit „in diesem Monat“ und bestimmt seine Geltung als dauerhaft durch alle Generationen der Erde.
  revised_text: Und Noah und seine Söhne schworen, kein Blut zu essen, das in irgendeinem Fleisch ist. Und er schloss in diesem Monat vor dem Herrn Gott einen Bund für immer, für alle Generationen der Erde.
  revised_footnotes: []
