  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: de
  text: Wer Menschenblut vergießt, dessen Blut soll durch einen Menschen vergossen werden; denn als Abbild Gottes schuf er den Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Adam«.'
    reason: Das Ge'ez ለአዳም kann formal auf den Eigennamen Adam bezogen werden; im Zusammenhang des Zitats aus Genesis 9,6 ist jedoch die generische Wiedergabe »den Menschen« wahrscheinlicher.
lexical_decisions:
- source_word: ዘይከዑ፡ ደመ፡ ሰብእ
  choice: Wer Menschenblut vergießt
  rationale: Gibt die allgemeine Relativkonstruktion und die Verbindung von »Blut« und »Mensch« knapp und idiomatisch wieder.
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው
  choice: dessen Blut soll durch einen Menschen vergossen werden
  rationale: Bewahrt die passive Vergeltungsformel und gibt በ als handelnde Vermittlung »durch« wieder, ohne eine nähere institutionelle Deutung einzutragen.
- source_word: በምስለ፡ እግዚአብሔር
  choice: als Abbild Gottes
  rationale: »Abbild« ist im modernen Deutsch natürlich und wahrt den Bezug auf Gottes likeness/image, ohne Identität mit Gott auszudrücken.
- source_word: ለአዳም
  choice: den Menschen
  rationale: Der Kontext des Genesis-Zitats verlangt hier die generische Bedeutung »Mensch/Menschheit«; die mögliche formale Lesung als Eigenname wird in der Fußnote bewahrt.
theological_decisions:
- issue: Begründung des Verbots durch die Gottesähnlichkeit des Menschen
  choice: denn als Abbild Gottes schuf er den Menschen
  alternative: denn nach dem Bild Gottes machte er Adam
  rationale: Die Übersetzung erhält die theologische Begründung und den generischen Bezug auf den Menschen, ohne die mögliche Namenslesung des Ge'ez zu verschweigen.
- issue: Ausführender der Blutvergeltung
  choice: durch einen Menschen
  alternative: von Menschenhand
  rationale: Die formal offene Formulierung benennt keinen Staat, Richter oder privaten Rächer und importiert daher keine bestimmte rechtstheologische Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, sprichwortartiger Satzstruktur. Die Wiederholung von »Blut« und »vergießen« bewahrt die rhetorische Entsprechung des Ausgangstextes.
