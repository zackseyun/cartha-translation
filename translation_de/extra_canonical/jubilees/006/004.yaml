  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: de
  text: Solange die Erde besteht, werden Saatzeit und Ernte nicht aufhören; Kälte und Hitze, Sommer und Winter sowie Tag und Nacht werden ihre Ordnung nicht ändern und niemals aufhören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: Solange die Erde besteht
  rationale: Die Wendung bedeutet wörtlich »alle Tage der Erde« und fungiert als Zeitangabe für die folgenden Aussagen. Die idiomatische deutsche Wiedergabe bewahrt diesen Sinn.
- source_word: ዘርእ፡ ወማእረር
  choice: Saat und Ernte
  rationale: Das feste Begriffspaar bezeichnet Aussaat beziehungsweise Saatzeit und Ernte; die knappe deutsche Paarformulierung passt zum poetischen Rhythmus.
- source_word: ቍር፡ ወሙቀት
  choice: Kälte und Hitze
  rationale: Direkte und natürliche Wiedergabe des Gegensatzpaares.
- source_word: ሐጋይ፡ ወክረምት
  choice: Sommer und Winter
  rationale: Im Kontext der geordneten Jahreszeiten ist dies die traditionelle und sachgerechte Wiedergabe.
- source_word: ኢይወልጡ፡ ሥርዓቶሙ
  choice: werden ihre Ordnung nicht ändern
  rationale: Bewahrt sowohl das Verb »ändern« als auch das auf alle genannten Zyklen bezogene »ihre Ordnung«.
- source_word: ወኢይትኀደጉ፡ ለዓለም
  choice: und niemals aufhören
  rationale: Gibt die abschließende Verneinung mit ለዓለም idiomatisch als dauerhafte, uneingeschränkte Aussage wieder.
theological_decisions:
- issue: Dauer der Verheißung
  choice: Solange die Erde besteht … niemals aufhören
  alternative: Alle Tage der Erde … in Ewigkeit nicht aufhören
  rationale: Die Formulierung lässt die Spannung zwischen der zeitlichen Rahmung durch die Dauer der Erde und dem abschließenden ለዓለም bestehen, ohne daraus eine weitergehende kosmologische Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Gegensatzpaare des Ausgangstextes bleiben erhalten; ein Semikolon gliedert die beiden Prädikatsgruppen klar.
