  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: de
  text: Und der HERR roch den wohlgefälligen Duft und schloss mit ihm einen Bund, dass nie wieder Flutwasser die Erde verderben sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛ፡ ሠናየ፡
  choice: den wohlgefälligen Duft
  rationale: Die Wortgruppe bezeichnet einen guten bzw. angenehmen Geruch; „wohlgefällig“ bewahrt im Opferkontext sowohl die sinnliche als auch die wertende Bedeutung.
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ፡
  choice: schloss mit ihm einen Bund
  rationale: Natürliches modernes Deutsch für die Wendung, die das Eingehen bzw. Schließen eines Bundes mit ihm ausdrückt.
- source_word: ማየ፡ አይኅ፡
  choice: Flutwasser
  rationale: Gibt die Verbindung aus „Wasser“ und „Flut“ kompakt wieder und lässt den Bezug auf eine künftige Flut erkennen.
- source_word: ዘያማስን፡ ምድረ፡
  choice: die Erde verderben
  rationale: „Verderben“ bildet die Bedeutung von Zerstörung bzw. Verwüstung ab, ohne sie unnötig zu präzisieren.
theological_decisions:
- issue: Anthropomorphe Aussage über Gottes Riechen
  choice: der HERR roch
  alternative: der HERR nahm den Duft wahr
  rationale: Die konkrete Bildsprache des Ausgangstextes wird bewahrt und nicht erklärend abgeschwächt.
- issue: Reichweite der Bundeszusage
  choice: dass nie wieder Flutwasser die Erde verderben sollten
  alternative: dass es nie wieder Flutwasser geben sollte, die die Erde verderben
  rationale: Die Zusage betrifft dem Wortlaut nach zerstörerische Flutwasser; sie wird nicht zu einer Aussage ausgeweitet, dass es überhaupt keine Überschwemmungen mehr geben werde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „HERR“ folgt der üblichen Wiedergabe des Gottesnamens im gegebenen Ausgangstext; die Satzstruktur bleibt nah am Ge'ez und ist zugleich flüssig lesbar.
