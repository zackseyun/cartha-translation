  source_fidelity: 'Der Entwurf gibt die geezische Aussage sachgerecht wieder: das Setzen des Bogens in die Wolke, seine Funktion als Zeichen des ewigen Bundes, die künftig ausbleibenden Flutwasser zur Vernichtung der Erde sowie die Schlussformel für die Dauer der Erde. „Seinen Bogen“ ist als natürliche Rückbindung angemessen und bewahrt die im Wort „Bogen“ liegende Bildsprache, ohne sie unnötig zu deuten.'
