  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: de
  text: Er setzte seinen Bogen in die Wolke als Zeichen des ewigen Bundes, damit nie wieder Flutwasser über die Erde käme, um sie zu vernichten, solange die Erde besteht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: seinen Bogen
  rationale: Das geezische Wort bezeichnet einen Bogen; im Zusammenhang ist der in die Wolke gesetzte Bogen gemeint. Das Possessivpronomen wird im Deutschen zur natürlichen Rückbindung an Gott ergänzt.
- source_word: ለትእምርተ፡ ኪዳን፡ ዘለዓለም
  choice: als Zeichen des ewigen Bundes
  rationale: Gibt Zweck beziehungsweise Funktion sowie die feste Bundesformulierung knapp und quellenah wieder.
- source_word: ማየ፡ አይኅ
  choice: Flutwasser
  rationale: Die Verbindung bedeutet wörtlich Wasser der Flut; „Flutwasser“ bewahrt beide Bestandteile in natürlichem Deutsch.
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: solange die Erde besteht
  rationale: Die wörtliche Wendung „alle Tage der Erde“ ist im Deutschen ungewohnt; die gewählte Form gibt ihren zeitlichen Sinn idiomatisch wieder.
theological_decisions:
- issue: Reichweite der zugesagten Bewahrung
  choice: nie wieder Flutwasser über die Erde … um sie zu vernichten
  alternative: nie wieder irgendeine Überschwemmung auf der Erde
  rationale: Der Text bezieht sich auf vernichtende Flutwasser über der Erde und behauptet nicht ausdrücklich, dass es keinerlei örtliche Überschwemmungen mehr geben werde.
- issue: Bezug des Pronomens beim Vernichten
  choice: um sie zu vernichten
  alternative: um alles zu vernichten
  rationale: Das geezische feminine Suffix verweist grammatisch auf „Erde“. Daher wird der Bezug auf die Erde bewahrt, statt dem konsultierten englischen Text mit „all“ zu folgen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am geezischen Ausgangstext, während „solange die Erde besteht“ die zeitliche Schlussformel natürlich wiedergibt.
