  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: de
  text: 'Und ihr: Seid fruchtbar und vermehrt euch auf der Erde, werdet zahlreich auf ihr und seid ein Segen auf ihr. Furcht und Schrecken vor euch werde ich über alles kommen lassen, was auf der Erde und im Meer ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: Seid fruchtbar und vermehrt euch
  rationale: Die traditionelle und zugleich verständliche deutsche Segensformel gibt die beiden koordinierten Aufforderungen prägnant wieder.
- source_word: ወብዙኁ፡ ላዕሌሃ
  choice: werdet zahlreich auf ihr
  rationale: Bewahrt die zusätzliche Aussage des Zahlreichwerdens, ohne sie mit dem vorhergehenden »vermehrt euch« zusammenzuziehen.
- source_word: ወኩኑ፡ ለበረከት፡ ላዕሌሃ
  choice: und seid ein Segen auf ihr
  rationale: Gibt die prädikative Segensaussage direkt wieder und bewahrt ihren Bezug auf die Erde.
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: Furcht und Schrecken vor euch
  rationale: Die beiden parallelen Begriffe werden unterschieden; »vor euch« entspricht im Deutschen dem gemeinten objektiven Genitiv.
- source_word: እሁብ፡ ዲበ
  choice: werde ich über … kommen lassen
  rationale: Natürliches Deutsch für das Setzen oder Legen von Furcht und Schrecken über die Geschöpfe, wobei die aktive göttliche Verursachung erhalten bleibt.
theological_decisions:
- issue: Reichweite von »alles«
  choice: alles, was auf der Erde und im Meer ist
  alternative: alle Lebewesen auf der Erde und im Meer
  rationale: Die Übersetzung erhält die umfassende, grammatisch nicht weiter eingeschränkte Formulierung des Textes und ergänzt nicht ausdrücklich »Lebewesen«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Reihung der Aufforderungen und der Wechsel zur göttlichen Ich-Rede bleiben erhalten; unnötige Archaismen wurden vermieden.
