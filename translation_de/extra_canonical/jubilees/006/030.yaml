  yaml_path: translation/extra_canonical/jubilees/006/030.yaml
  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: de
  text: Und alle Tage der Gebote umfassen zweiundfünfzig Wochen von Tagen, und sie alle ergeben ein vollständiges Jahr. So ist es auf den himmlischen Tafeln eingeschrieben und festgesetzt, und kein einziges Jahr darf übergangen werden[a], Jahr für Jahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darf ausgelassen werden“; das zugrunde liegende Wort kann auch den Gedanken des Überschreitens oder Übertretens ausdrücken.'
    reason: Bewahrt die Bedeutungsbreite von ተዐድዎ im kalendarisch-normativen Zusammenhang.
lexical_decisions:
- source_word: ትእዛዛት
  choice: Gebote
  rationale: Die geezische Form ist morphologisch Plural; „Gebote“ wahrt dies, ohne den Bezug auf die kalendarischen Anordnungen näher festzulegen.
- source_word: ፶ምሳ፡ ወክልኤ፡ ሰንበታት፡ መዋዕል
  choice: zweiundfünfzig Wochen von Tagen
  rationale: Die leicht formelhafte Wendung gibt sowohl die Zahl als auch das ausdrücklich wiederholte „Tage“ des Ausgangstextes wieder.
- source_word: ፍጹም
  choice: vollständig
  rationale: Bezeichnet hier das volle beziehungsweise vollständige Jahr.
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: eingeschrieben und festgesetzt
  rationale: 'Wahrt die Reihenfolge der beiden Verben: zuerst das Eingravieren beziehungsweise Einschreiben, dann das Ordnen oder Festsetzen.'
- source_word: ተዐድዎ
  choice: übergangen werden
  rationale: Passt zum kalendarischen Zusammenhang und bewahrt zugleich die Grundvorstellung eines Übergehens oder Überschreitens, ohne sie einseitig als bloße Nachlässigkeit zu deuten.
theological_decisions:
- issue: Verbindlichkeit der kalendarischen Ordnung
  choice: „darf übergangen werden“
  alternative: „wird ausgelassen“ oder „darf übertreten werden“
  rationale: Die modale Formulierung bringt den normativen Charakter der auf den himmlischen Tafeln festgesetzten Ordnung zum Ausdruck, ohne die lexikalische Spannung zwischen Auslassen, Übergehen und Übertreten vollständig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Wendung „Wochen von Tagen“ bleibt wegen ihrer ausdrücklichen Gestalt im geezischen Text erhalten; der übrige Satzbau ist für heutige Leser behutsam geglättet.
