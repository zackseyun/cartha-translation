lexical_decisions:
- source_word: ወባቲ
  choice: Und an diesem Tag
  rationale: Das feminine Demonstrativpronomen bezieht sich im Zusammenhang wahrscheinlich auf einen zuvor genannten Tag; im Deutschen wird der Bezug zur Verständlichkeit ausdrücklich wiedergegeben.
- source_word: የብሰት፡ ምድር
  choice: wurde die Erde trocken
  rationale: Gibt das Verb für Trockenwerden und sein Subjekt unmittelbar und natürlich wieder.
- source_word: ወአርኀወ
  choice: da öffnete er die Arche
  rationale: Das Objekt ist im überlieferten Ausschnitt nicht ausdrücklich wiederholt, wird aber aus dem Kontext erschlossen; bloßes „öffnete sie“ wäre im Deutschen wegen „Erde“ als nächstem femininem Bezugswort irreführend.
- source_word: በሠርቀ፡ ወርኅ
  choice: am Neumond
  rationale: Wörtlich bezeichnet die Wendung das Aufgehen bzw. den Beginn des Monats und entspricht hier dem ersten Tag, dem Neumond.
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: die Öffnungen der Tiefen des Abgrunds unten
  rationale: „Öffnungen“ gibt das bildhafte „Münder“ idiomatisch wieder; die gestaffelten Tiefenbegriffe und die Ortsangabe bleiben erhalten.
- source_word: ተርኅወ፡ ኵሉ፡ አፈ
  choice: wurden alle Öffnungen … geöffnet
  rationale: Das im Quelltext vorhandene Passivverb wird ausdrücklich übersetzt; der Satz bleibt wegen des abbrechenden Ausschnitts unvollständig.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt von „öffnete“
  choice: „die Arche“ im Haupttext ergänzt
  alternative: „sie“ oder „es“
  rationale: Der Erzählzusammenhang verlangt die Arche als Objekt. Ein Pronomen würde im Deutschen fälschlich auf die unmittelbar genannte Erde bezogen werden können; die Ergänzung löst keine theologische Streitfrage.
- issue: Abbrechender Schluss des Quellausschnitts
  choice: Die Unvollständigkeit durch Auslassungspunkte sichtbar bewahrt
  alternative: Den fehlenden Genitiv aus dem folgenden Text oder einer Parallelüberlieferung ergänzen
  rationale: Der bereitgestellte Quelltext endet nach „alle Öffnungen von“; nicht vorliegender Wortlaut wird nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Die wiederholte Datierungsformel bleibt erhalten. Bildhafte „Münder“ werden idiomatisch als „Öffnungen“ wiedergegeben; die ungewöhnliche Häufung der Tiefenbegriffe wird nicht geglättet.
