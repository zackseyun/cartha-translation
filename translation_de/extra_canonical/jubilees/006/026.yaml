  text: Und an diesem Tag wurde die Erde trocken; da öffnete er die Arche und sah die Erde. Am Neumond des vierten Monats wurden die Öffnungen der Tiefen des Abgrunds unten verschlossen. Und am Neumond des siebten Monats wurden alle Öffnungen von … geöffnet.[a]
