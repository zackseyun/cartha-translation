  yaml_path: translation/extra_canonical/jubilees/006/023.yaml
  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: de
  text: für ihre Generationen in diesem Monat, einen Tag in jedem Jahr. Und die Neumondtage des ersten, des vierten, des siebten und des zehnten Monats sind die Gedenktage; sie sind die Tage der Jahreszeiten in den vier Abschnitten des Jahres; sie sind aufgeschrieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: für ihre Generationen
  rationale: Der offenbar textlich unsichere Ausdruck wird im Zusammenhang als Abschluss des vorangehenden Satzes verstanden und entsprechend der wahrscheinlichen Lesart im Sinn von „ihre Generationen“ wiedergegeben.
- source_word: በዝ፡ ወርኅ
  choice: in diesem Monat
  rationale: Direkte, natürliche Wiedergabe der deiktischen Monatsangabe.
- source_word: በሠርቀ፡ ወርኅ
  choice: die Neumondstage
  rationale: Die wiederholte Wendung bezeichnet jeweils den Monatsbeginn beziehungsweise Neumond; die zusammengezogene deutsche Form bewahrt alle vier Angaben und vermeidet schwerfällige Wiederholung.
- source_word: ዕለታት፡ ተዝካር
  choice: die Gedenktage
  rationale: Gibt die Funktion dieser Tage als Tage des Erinnerns knapp und idiomatisch wieder.
- source_word: ዕለታት፡ ጊዜ
  choice: die Tage der Jahreszeiten
  rationale: „Zeit“ kann hier im kalendarischen Zusammenhang „Jahreszeit“ beziehungsweise festgesetzte Zeit bezeichnen; die Formulierung lässt den kalendarischen Bezug erkennen.
- source_word: አርባዕቱ፡ መክፈላት፡ ዓመት
  choice: den vier Abschnitten des Jahres
  rationale: Formale und zugleich verständliche Wiedergabe der vier Teilungen des Jahres.
- source_word: ጽሑፋት፡ እማንቱ
  choice: sie sind aufgeschrieben
  rationale: Bewahrt den abschließenden passivischen Satz ohne die früher ergänzte, im Ge'ez nicht belegte Aussage „und angeordnet“.
theological_decisions:
- issue: Status der vier kalendarischen Tage
  choice: „sie sind aufgeschrieben“ ohne weitere Qualifizierung
  alternative: „sie sind aufgeschrieben und angeordnet“
  rationale: Der Quelltext bezeugt nur, dass sie geschrieben beziehungsweise aufgezeichnet sind; eine göttliche Anordnung darf nicht ergänzt werden.
- issue: Bedeutung von ጊዜ im Kalenderzusammenhang
  choice: „Jahreszeiten“
  alternative: „festgesetzte Zeiten“
  rationale: Der Ausdruck bleibt grundsätzlich mehrdeutig; im unmittelbaren Bezug auf die vier Jahresabschnitte ist „Jahreszeiten“ die natürlichste deutsche Wiedergabe, ohne zusätzliche kultische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier parallelen Neumondangaben sind aus Gründen natürlicher deutscher Syntax zu einer Aufzählung zusammengezogen. Der Vers beginnt als syntaktische Fortsetzung des vorangehenden Zusammenhangs bewusst mit kleingeschriebenem „für“.
