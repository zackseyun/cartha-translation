  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: de
  text: Und es wird solche geben, die den Mond genau beobachten; denn er verdirbt die Zeiten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውኑ
  choice: Und es wird … geben
  rationale: Bewahrt sowohl die einleitende Konjunktion ወ („und“) als auch die futurische Existenzform.
- source_word: እለ፡ ያስተሐይጹ፡ ወርኀ፡ በሑያጼ
  choice: Menschen, die den Mond genau beobachten
  rationale: Gibt die substantivierte Personenbezeichnung und das Beobachten beziehungsweise Berechnen des Mondes natürlich wieder; „genau“ trägt die verstärkende Bestimmung በሑያጼ, ohne bloße gelegentliche Wahrnehmung anzudeuten.
- source_word: ታማስን
  choice: bringt … durcheinander
  rationale: Das Verb bezeichnet hier eine schädliche Beeinträchtigung bis hin zum Verderben. Im Deutschen macht „bringt die Festzeiten durcheinander“ die konkrete kalendarische Wirkung verständlich, ohne die Aussage zu einer physischen Zerstörung der Zeiten zu verschärfen.
- source_word: ጊዜያተ
  choice: Festzeiten
  rationale: Im kalendarischen Zusammenhang sind nicht allgemein Zeitabschnitte oder Jahreszeiten gemeint, sondern die festgesetzten Zeiten des religiösen Kalenders.
theological_decisions:
- issue: Bezug des weiblichen Pronomens in እስመ፡ ታማስን፡ ይእቲ
  choice: „denn er“ mit Bezug auf den Mond
  alternative: „denn sie“ mit Bezug auf die Mondbeobachtung oder Mondrechnung
  rationale: Der unmittelbare Kontext und die überlieferte Auslegung beziehen die schädliche Wirkung auf den Mond beziehungsweise den mondbasierten Kalender. Die deutsche Formulierung lässt den Mond als grammatischen Bezug klar hervortreten, ohne zusätzliche Lehrdeutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist für heutige Leser verständlich und bewahrt den polemischen kalendarischen Sinn. Keine Fußnote nötig, da das einleitende ወ eindeutig mit „Und“ wiedergegeben wird.
