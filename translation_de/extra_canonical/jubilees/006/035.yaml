  verdict: revise
  source_fidelity: Die einleitende Konjunktion und die Zukunftsaussage sind zutreffend wiedergegeben. Auch die Aussage über Personen, die den Mond genau beobachten, trifft den Sinn. „bringt ... durcheinander“ schwächt jedoch das geʿezische ታማስን, das hier stärker von Verderben bzw. Verderben/Verfälschen der Zeiten spricht.
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch. „Und es wird Menschen geben“ ist verständlich, aber „Und es wird solche geben“ ist idiomatischer und näher an der unbestimmten Personenbezeichnung.
  terminology: „Festzeiten“ legt den Begriff ጊዜያተ stärker auf kultische Feste fest, als es der Wortlaut verlangt; im Kontext sind die kalendarischen Zeiten bzw. Jahreszeiten gemeint. „die Zeiten“ bewahrt die Breite des Ausdrucks. „verdirbt“ gibt die polemische Stärke von ታማስን angemessener wieder als „bringt ... durcheinander“.
