    issue: Zu enge Wiedergabe von ጊዜያተ als „Festzeiten“
    rationale: Der Ausdruck kann im kalendarischen Kontext die Zeiten bzw. Jahreszeiten allgemein bezeichnen. Eine Festlegung auf kultische Festtermine ist nicht erforderlich.
  revised_text: Und es wird solche geben, die den Mond genau beobachten; denn er verdirbt die Zeiten.
