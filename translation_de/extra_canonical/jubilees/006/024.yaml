  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: de
  text: und eine Satzung zum ewigen Zeugnis.[a] Noach setzte sie für sich als Feste ein, für alle Generationen auf ewig,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ewiges Zeugnis“.'
    reason: Die geezische Konstruktion kann sowohl eine Zweckbeziehung („zum Zeugnis“) als auch eine Einordnung („als Zeugnis“) ausdrücken.
lexical_decisions:
- source_word: ሥርዓት (śərʿāt)
  choice: Satzung
  rationale: Gibt die ausdrücklich genannte verbindliche Ordnung wieder, ohne sie mit dem folgenden Verb zu verschmelzen.
- source_word: ስምዕ (səmʿ)
  choice: Zeugnis
  rationale: Entspricht dem Grundsinn des Substantivs und bewahrt die feierlich-rechtliche Färbung.
- source_word: በዓላት (baʿālāt)
  choice: Feste
  rationale: Bezeichnet wiederkehrende Festzeiten; „Feste“ ist im Deutschen natürlich und sachlich passend.
- source_word: ትውልድ ዘለዓለም (təwəld za-laʿālam)
  choice: für alle Generationen auf ewig
  rationale: Bewahrt sowohl den Generationenbezug als auch die ausdrückliche Vorstellung unbegrenzter Dauer.
theological_decisions:
- issue: Verhältnis der Satzung zum Zeugnis
  choice: zum ewigen Zeugnis
  alternative: als ewiges Zeugnis
  rationale: Die geezische Präposition lässt eine Zweck- oder Zuordnungsbeziehung zu. Der Haupttext gibt die Zwecknuance wieder; die alternative prädikative Lesart bleibt in der Fußnote sichtbar.
- issue: Noachs persönliche Festsetzung
  choice: setzte sie für sich als Feste ein
  alternative: ordnete sie sich selbst als Feste an
  rationale: Die Formulierung wahrt den im Text vorhandenen Bezug auf Noach selbst, ohne eine darüber hinausgehende theologische Reichweite festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Versanfang bleibt als Fortsetzung des vorherigen Satzes kleingeschrieben; das Schlusskomma bildet den im Ausgangstext fortlaufenden Satzbau ab.
