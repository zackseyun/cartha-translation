  yaml_path: translation/extra_canonical/jubilees/006/007.yaml
  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: de
  text: Doch Fleisch mit seinem Leben, mit seinem Blut, sollt ihr nicht essen; denn das Leben alles Fleisches ist im Blut, damit euer Blut für euer Leben nicht gefordert werde. Von der Hand jedes Menschen, von der Hand jedes Lebewesens werde ich das Blut des Menschen fordern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ / ነፍሰ
  choice: sein Leben / das Leben
  rationale: Beide Ausdrücke bezeichnen hier im Zusammenhang von Fleisch und Blut die belebende Lebenskraft beziehungsweise das Leben. „Leben“ ist im Deutschen natürlicher als „Geist“ oder „Seele“ und bewahrt den Zusammenhang der Aussage.
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: gefordert werde / werde ich … fordern
  rationale: Die Wortformen drücken das Einfordern beziehungsweise Zur-Rechenschaft-Ziehen für vergossenes Blut aus. Die Wiederholung von „fordern“ bildet die Wiederaufnahme des Quellverbs ab.
- source_word: ኵሉ፡ አኀሥሦ
  choice: jedes Lebewesen
  rationale: Der Ausdruck zielt auf nichtmenschliche lebende Geschöpfe beziehungsweise Tiere. „Lebewesen“ erhält die weitere Formulierung der Quelle und stimmt mit dem konsultierten englischen Text überein.
- source_word: ደመ፡ ሰብእ
  choice: das Blut des Menschen
  rationale: Die generische singularische Form wird formal bewahrt und bezeichnet menschliches Blut allgemein.
theological_decisions:
- issue: Beziehung zwischen Blut und Leben
  choice: „das Leben allen Fleisches ist im Blut“
  alternative: „die Seele allen Fleisches ist im Blut“
  rationale: „Leben“ gibt den konkreten anthropologischen Zusammenhang wieder, ohne eine spätere Lehre über die Beschaffenheit der Seele in den Text einzutragen.
- issue: Finalsatz über das Fordern menschlichen Blutes
  choice: „damit euer Blut für euer Leben nicht gefordert werde“
  alternative: „damit nicht Rechenschaft für euer Lebensblut gefordert werde“
  rationale: Die ungewöhnliche Spannung des Quelltextes und seiner Negation bleibt erhalten, statt sie an die geläufigere Fassung von Genesis 9,5 anzugleichen oder stillschweigend umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzführung und die Wiederholung von „von der Hand“ und „fordern“ wurden bewahrt; zugleich wurde die geezische Wortstellung in verständliches Deutsch überführt.
