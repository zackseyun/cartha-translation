  text: Und auch du sollst den Israeliten gebieten, dieses Fest von Generation zu Generation zu halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ እስራኤል
  choice: Israeliten
  rationale: Die wörtliche Wendung „Kinder/Söhne Israels“ bezeichnet hier das Volk Israel; „Israeliten“ gibt sie im modernen Deutschen klar und natürlich wieder.
- source_word: ይዕቀብዋ
  choice: zu halten
  rationale: Das Verb bedeutet „bewahren, beachten, einhalten“; in Verbindung mit einem Fest ist „ein Fest halten“ die idiomatische deutsche Wiedergabe.
- source_word: በዓል
  choice: Fest
  rationale: Bezeichnet eine religiöse Festfeier und wird daher sachgerecht mit „Fest“ wiedergegeben.
- source_word: በኵሉ ትዝምዶሙ
  choice: von Generation zu Generation
  rationale: Die Wendung meint die fortdauernde Beachtung in allen Generationen; die gewählte Formulierung ist natürlich und bewahrt diesen zeitlichen Umfang.
