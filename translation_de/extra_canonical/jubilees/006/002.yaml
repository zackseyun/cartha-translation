revisions:
- from: Und er legte das Fett auf den Altar. Dann nahm er einen Stier, einen Widder, ein Schaf, Ziegenböckchen, Salz, eine Turteltaube und eine junge Taube. Er brachte auf dem Altar ein Brandopfer dar, legte darauf eine mit Öl vermischte Opfergabe, besprengte sie mit Wein[a] und gab über alles Weihrauch. So ließ er einen wohltuenden Duft aufsteigen, der vor dem Herrn wohlgefällig war.
  to: Und er legte das Fett auf den Altar. Dann nahm er einen Stier, einen Widder, ein Schaf, Ziegenböckchen, Salz, eine Turteltaube und eine junge Taube. Er brachte auf dem Altar ein Brandopfer dar und legte auf diese Opfer eine mit Öl vermischte Opfergabe. Er besprengte mit Wein[a] und gab über alles Weihrauch. So ließ er einen wohltuenden Duft aufsteigen, der vor dem Herrn wohlgefällig war.
  rationale: Die Revision beseitigt die unklare Objektzuweisung beim Besprengen mit Wein und macht den pluralischen Bezug der mit Öl vermischten Opfergabe sichtbar. Die knappe Fußnote erhält die im englischen Audit Trail dokumentierte alternative Auffassung, ordnet sie jedoch der lexikalisch vorrangigen Bedeutung „besprengen“ unter.
