  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: de
  text: Und er legte das Fett auf den Altar. Dann nahm er einen Stier, einen Widder, ein Schaf, Ziegenböckchen, Salz, eine Turteltaube und eine junge Taube. Er brachte auf dem Altar ein Brandopfer dar und legte auf diese Opfer eine mit Öl vermischte Opfergabe. Er besprengte mit Wein[a] und gab über alles Weihrauch. So ließ er einen wohltuenden Duft aufsteigen, der vor dem Herrn wohlgefällig war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „besprengte“ oder „versprengte“. Im Opferzusammenhang wird die Handlung bisweilen als Ausgießen von Wein verstanden.'
    reason: Die Anmerkung sichert die primäre Bedeutung des geʽezischen Verbs, dokumentiert aber die kontextuelle alternative Auffassung, ohne sie als dessen wörtliche Bedeutung auszugeben.
lexical_decisions:
- source_word: አዕረገ፡ ሥብሐ፡ ዲበ፡ ምሥዋዕ
  choice: legte das Fett auf den Altar
  rationale: Wörtlich lässt der Text das Fett auf den Altar „hinaufsteigen“; im Opferzusammenhang gibt „legte … auf“ den konkreten Vorgang natürlich wieder.
- source_word: ላህመ፡ ወበሐኰ፡ ወበገዐ፡ ወአጣሊ
  choice: einen Stier, einen Widder, ein Schaf, Ziegenböckchen
  rationale: Die Tierbezeichnungen werden differenziert wiedergegeben; der Plural bei den Ziegen bezeichnet hier am natürlichsten junge Opfertiere.
- source_word: ጼወ
  choice: Salz
  rationale: Direkte lexikalische Entsprechung.
- source_word: አጕለ፡ ርግብ
  choice: eine junge Taube
  rationale: Die Wendung bezeichnet den Nachwuchs beziehungsweise ein Jungtier der Taube.
- source_word: አውሰ፡ በቅብዕ
  choice: eine mit Öl vermischte Opfergabe
  rationale: Die Formulierung bewahrt sowohl den Opfercharakter als auch die ausdrückliche Verbindung mit Öl.
- source_word: ነዝኀ፡ ወይነ
  choice: besprengte sie mit Wein
  rationale: Das Verb ነዝኀ bedeutet primär „besprengen/versprengen“, nicht das bei Trankopfern sonst naheliegende „ausgießen“.
- source_word: ዕጣነ
  choice: Weihrauch
  rationale: Im kultischen Zusammenhang ist die spezifische deutsche Bezeichnung „Weihrauch“ natürlicher als das allgemeinere „Räucherwerk“.
- source_word: መዐዛ፡ ሠናየ፡ ዘያሠምር
  choice: einen wohltuenden Duft …, der … wohlgefällig war
  rationale: Die Wiedergabe erhält sowohl die Qualität des Duftes als auch seine Annahme beziehungsweise Wohlgefälligkeit vor Gott.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: der Herr
  alternative: der HERR
  rationale: Die äthiopische Gottesbezeichnung verlangt hier nicht die typografische Wiedergabe des Tetragramms; „der Herr“ vermeidet eine unbelegte Identifikation.
- issue: Opfersprachliche Deutung des Weins
  choice: besprengte sie mit Wein
  alternative: goss Wein darüber aus
  rationale: Obwohl das Ausgießen im biblischen Opferkontext geläufig ist, wird die konkrete Bedeutung des überlieferten Verbs nicht durch eine kontextuell erwartete Handlung ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Opferterminologie. Die längere Reihung des Ausgangstextes wurde behutsam in mehrere Sätze gegliedert, ohne die Abfolge der Handlungen zu verändern.
