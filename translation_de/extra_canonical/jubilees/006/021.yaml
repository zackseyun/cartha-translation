  yaml_path: translation/extra_canonical/jubilees/006/021.yaml
  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: de
  text: 'Als Gebot für sie gilt: An einem Tag im Jahr, in diesem Monat, sollen sie das Fest feiern. Denn es ist das Wochenfest und das Fest der Erstlingsfrüchte. Es ist zweifach und von zweierlei Art.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለትእዛዝ፡ ሎሙ
  choice: Als Gebot für sie gilt
  rationale: Gibt die Zweck- bzw. Bestimmungsformulierung mit einer natürlichen deutschen Rechts- und Weisungssprache wieder.
- source_word: ይግበሩ፡ በዓለ፡ ባቲ
  choice: sollen sie das Fest feiern
  rationale: Das Verb bedeutet wörtlich „machen/tun“; zusammen mit „Fest“ ist „das Fest feiern“ im Deutschen idiomatisch.
- source_word: በዓለ፡ ሱባዔያት
  choice: das Wochenfest
  rationale: Traditionelle und verständliche Bezeichnung für das Fest der Wochen; die formale Festbezeichnung bleibt erkennbar.
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: das Fest der Erstlingsfrüchte
  rationale: Bewahrt das landwirtschaftliche Bild des ersten Ertrags und gibt die Festbezeichnung transparent wieder.
- source_word: ክልኤ፡ ዐጽፍት፡ ይእቲ፡ ወለክልኤ
  choice: Es ist von zweierlei Art und hat eine doppelte Bedeutung
  rationale: Bewahrt die im Ge’ez wiederholte Zweifachheit, vermeidet jedoch die im Deutschen schwer verständliche bloße Verdoppelung „zweifach und zweierlei“.
theological_decisions:
- issue: Deutung der abschließenden doppelten Zweierformel
  choice: von zweierlei Art und ... eine doppelte Bedeutung
  alternative: zweifach und von zweierlei Art
  rationale: Die Quelle betont zweimal eine Zweifachheit, erklärt hier aber nicht eindeutig deren genaue Beziehung. Die Übersetzung hält diese Spannung offen, statt die beiden Aspekte dogmatisch festzulegen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit klarer Festterminologie. Die syntaktische Wiederholung des Originals wurde lesbar geglättet, während seine doppelte Aussage über die Zweifachheit erhalten bleibt.
