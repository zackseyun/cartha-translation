  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: de
  text: 'für die Feste und zum ewigen Gedenken; so sind sie festgesetzt. Und dreizehn Wochen werden auf den himmlischen Tafeln verzeichnet,[a] eine nach der anderen, zu ihrem Gedenken: vom ersten bis zum zweiten, vom zweiten bis zum dritten und vom dritten bis zum vierten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dreizehn Wochen wurden auf den himmlischen Tafeln geschrieben.“'
    reason: Bewahrt die frühere und grammatisch mögliche Vergangenheitswiedergabe neben dem hier bevorzugten präsentischen Imperfekt; die explizite Nennung der dreizehn Wochen verhindert einen unklaren Pronomenbezug.
lexical_decisions:
- source_word: ለበዓላት፡ ለተዝካር፡ እስከ፡ ለዓለም፡
  choice: für die Feste und zum ewigen Gedenken
  rationale: Gibt die Zweckangaben und den Gedanken dauernden Gedenkens in natürlichem, würdigem Deutsch wieder.
- source_word: እማንቱ፡ ሥርዓት
  choice: so sind sie festgesetzt
  rationale: Bewahrt den nominalen Gedanken einer verbindlichen Ordnung, ohne eine bestimmte gesetzestheologische Deutung hinzuzufügen.
- source_word: ወያዐርገዎን፡ ውስተ፡ ጽላት፡ ሰማይ
  choice: Und auf den himmlischen Tafeln werden sie verzeichnet
  rationale: Das Imperfekt wird präsentisch-passivisch wiedergegeben; „verzeichnet“ passt zum Kontext der Tafeln, während die mögliche Vergangenheitsform in der Fußnote erhalten bleibt.
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት
  choice: dreizehn Wochen
  rationale: Die Zahl und die kalendarische Einheit werden direkt wiedergegeben.
- source_word: አሐቲ፡ አሐቲ፡ እምኔሆን፡ እምዛቲ፡ ውስተ፡ ዛቲ
  choice: jeweils von einem zum anderen
  rationale: Bewahrt die distributive und sequenzielle Aussage des Ge'ez in verständlichem Deutsch, ohne das grammatische Geschlecht künstlich nachzuahmen.
theological_decisions:
- issue: Zeitbezug der Verzeichnung auf den himmlischen Tafeln
  choice: werden sie verzeichnet
  alternative: wurden sie geschrieben
  rationale: Die präsentische Wiedergabe entspricht der Imperfektform und lässt den fortdauernden beziehungsweise normativen Charakter offen; die traditionelle Vergangenheitsform wird als echte Übersetzungsalternative dokumentiert.
- issue: Verbindlichkeit der Ordnung
  choice: sind sie festgesetzt
  alternative: ist ihre Ordnung
  rationale: Die Formulierung drückt eine feststehende Ordnung aus, ohne über den Text hinaus Urheber, rechtlichen Status oder konfessionelle Folgerungen zu bestimmen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Vers beginnt offenbar als Fortsetzung des vorausgehenden Satzes; deshalb steht „für“ am Anfang kleingeschrieben. Die Aufzählung und die wiederholte Abfolge der vier Zeitpunkte bleiben eng an der Quellstruktur.
