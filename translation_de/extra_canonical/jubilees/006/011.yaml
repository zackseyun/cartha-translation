  to: Darum habe ich gesagt, dass auch du in diesem Monat auf dem Berg mit den Kindern Israels einen Bund schließen sollst, verbunden mit einem Eid und einer ihnen auferlegten Anordnung; und du sollst sie mit Blut besprengen wegen all der Worte des Bundes, den Gott mit ihnen für alle Zeiten geschlossen hat.
