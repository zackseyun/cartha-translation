base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: de
  text: Darum habe ich gesagt, dass auch du in diesem Monat auf dem Berg mit den Kindern Israels einen Bund schließen sollst, verbunden mit einem Eid und einer ihnen auferlegten Anordnung; und du sollst sie mit Blut besprengen wegen all der Worte des Bundes, den Gott mit ihnen für alle Zeiten geschlossen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትካየድ፡ ኪዳነ
  choice: einen Bund … schließen sollst
  rationale: Die äthiopische Wendung bezeichnet das Eingehen beziehungsweise Schließen eines Bundes; die deutsche Formulierung ist idiomatisch und bewahrt den förmlichen Charakter.
- source_word: ደቂቀ፡ እስራኤል
  choice: Kinder Israels
  rationale: Nahe, in bibelsprachlichem Deutsch geläufige Wiedergabe der Herkunfts- und Volksbezeichnung.
- source_word: ምስለ፡ ማሕላ
  choice: verbunden mit einem Eid
  rationale: Gibt die begleitende eidliche Bekräftigung verständlich wieder, ohne den Eid mit dem Bund gleichzusetzen.
- source_word: ደመ
  choice: mit Blut
  rationale: Bewahrt das konkrete kultische Element des Ausgangstextes.
- source_word: እግዚአብሔር
  choice: Gott
  rationale: Die äthiopische Gottesbezeichnung wird hier entsprechend ihrem Kontext als „Gott“ wiedergegeben; eine künstliche Übertragung als Gottesname wird vermieden.
- source_word: ለኵሉ፡ መዋዕል
  choice: für alle Zeiten
  rationale: Natürliches modernes Deutsch für die wörtliche Vorstellung „für alle Tage“ und Ausdruck der unbefristeten Geltung.
theological_decisions:
- issue: Bezug des Blutes auf die Israeliten
  choice: du sollst sie mit Blut besprengen
  alternative: du sollst Blut auf sie sprengen
  rationale: Die gewählte Form ist im Deutschen natürlich und lässt den kultischen Bundesritus klar erkennen, ohne dessen theologische Bedeutung weiter auszudeuten.
- issue: Dauer des Bundes
  choice: für alle Zeiten
  alternative: für alle Tage
  rationale: Die idiomatische Wiedergabe bezeichnet fortdauernde Geltung, ohne eine speziell konfessionelle Lehre über den Bund einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoller biblischer Prägung. Der lange Satzbau und die Abfolge von Bund, Eid und Blutritus bleiben erhalten; unnötige Archaismen wurden vermieden.
