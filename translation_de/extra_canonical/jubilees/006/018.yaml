base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: de
  text: 'Und dieses ganze Fest wurde im Himmel vom Tag der Schöpfung an bis zu den Tagen Noahs gefeiert: sechsundzwanzig Jubiläen und fünf Jahrwochen. Noah und seine Söhne hielten es sieben Jubiläen und eine Jahrwoche lang, bis zum Tag von Noahs Tod. Doch vom Tag seines Todes an verfälschten seine Söhne es bis zu den Tagen Abrahams, und sie aßen Blut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓል
  choice: Fest
  rationale: Bezeichnet hier die wiederkehrende Festfeier; „Fest“ ist im modernen Deutschen natürlich und sachlich.
- source_word: ኢዮቤልዉ
  choice: Jubiläen
  rationale: Bewahrt die im Jubiläenbuch zentrale Zeiteinheit von jeweils sieben Jahrwochen.
- source_word: ሱባዔ፡ ዓመት / ሱባዔ፡ ዓመታት
  choice: Jahrwoche(n)
  rationale: Gibt eine Siebenerperiode von Jahren präzise und in bibelnaher deutscher Terminologie wieder.
- source_word: ዐቀብዋ
  choice: hielten es
  rationale: Vermittelt das Beachten bzw. Einhalten des Festes idiomatisch, ohne zusätzliche kultische Einzelheiten einzutragen.
- source_word: ውሉዱ
  choice: seine Söhne
  rationale: Der Kontext und die Parallelformulierung mit Noahs Söhnen stützen die konkrete Wiedergabe gegenüber dem allgemeineren „Nachkommen“.
- source_word: ይበልዑ፡ ደመ
  choice: sie aßen Blut
  rationale: Formale, klare Wiedergabe der abschließenden Aussage; die Härte und theologische Spannung des Blutgenusses bleibt erhalten.
theological_decisions:
- issue: Himmlische Feier des Festes seit der Schöpfung
  choice: wurde im Himmel ... gefeiert
  alternative: wurde im Himmel ... gehalten
  rationale: Die passive Festbegehung wird natürlich wiedergegeben, ohne die feiernden Wesen zu benennen, da der Ausgangstext sie nicht ausdrücklich nennt.
- issue: Verderben bzw. Aufheben der Festordnung durch Noahs Söhne
  choice: verdarben ... es
  alternative: ließen ... es verkommen / entweihten es
  rationale: Die stärkere, relativ formale Aussage wahrt die mögliche Mehrdeutigkeit zwischen Verfälschung, Vernachlässigung und Entweihung, statt sie konfessionell oder interpretativ festzulegen.
- issue: Bezug des Pronomens nach Noahs Tod
  choice: vom Tag seines Todes an
  alternative: vom Tag von Noahs Tod an
  rationale: Der Bezug auf Noah ist im unmittelbaren Kontext eindeutig; die pronominale Form vermeidet im Deutschen unnötige Wiederholung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bibelnaher Zeitrechnung. Die langen Zeitangaben wurden klar gegliedert; es wurden keine erklärenden Zusätze oder konfessionellen Deutungen eingeführt.
