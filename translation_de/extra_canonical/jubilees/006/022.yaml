  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des geʿezischen Textes wieder: das Fest, seine schriftliche und normative Festlegung, die jährliche Feier, die Opfergaben als Gedächtnis und den über die Versgrenze hinausgehenden Schlusssatz. Die Kennzeichnung der verderbten Anfangslesart und der offenen Satzfortsetzung ist sachgerecht. Die Formulierung „so feiern, wie es darüber geschrieben“ ist jedoch im Deutschen leicht schwerfällig und kann die Vorlage klarer abbilden.'
  naturalness: 'Eine kleine stilistische Glättung ist sicher: „wie darüber geschrieben steht und es festgesetzt ist“ ist idiomatischer als „wie es darüber geschrieben und festgesetzt ist“. „Die Israeliten“ ist modernes Standarddeutsch und in diesem Kontext natürlicher als „die Kinder Israel“, ohne den Sinn zu verändern. Das Ellipsenzeichen muss die syntaktische Fortsetzung zu Vers 23 sichtbar lassen.'
  terminology: „Fest“, „festgesetzt“, „Opfergaben“ und „zum Gedenken“ sind angemessen. „Zum Gedenken“ bewahrt offen, worauf sich das Gedächtnis richtet. Die textkritische Fußnote zur Anfangslesart ist notwendig und korrekt als vorsichtige Einschätzung formuliert.
