  yaml_path: translation/extra_canonical/jubilees/006/022.yaml
  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: de
  text: 'Denn[a] dieses Fest sollst du feiern, wie darüber geschrieben steht und es festgesetzt ist. Denn ich habe im Buch des ersten Gesetzes aufgeschrieben, was ich dir geschrieben habe: Du sollst es zu seiner festgesetzten Zeit feiern, einen Tag im Jahr. Und über seine Opfergaben habe ich dir gesagt, dass sie zum Gedenken dienen sollen und dass die Israeliten es in …[b] feiern sollen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste Wort des gedruckten äthiopischen Textes ist offenbar verderbt; eine Handschrift liest „denn“, was hier dem Zusammenhang entspricht.
    reason: textual_variant
  - marker: b
    text: Der Satz wird im nächsten Vers mit „diesem Monat“ fortgesetzt.
    reason: verse_boundary
lexical_decisions:
- source_word: በዓል
  choice: Fest
  rationale: Die übliche und im Zusammenhang natürliche Wiedergabe für ein religiöses Fest.
- source_word: ቍሩጽ
  choice: festgesetzt
  rationale: Das Wort bezeichnet wörtlich etwas Abgeschnittenes oder Bestimmtes; im Zusammenhang einer vorgeschriebenen Festfeier gibt „festgesetzt“ den Sinn natürlich wieder.
- source_word: በበጊዜሃ
  choice: zu seiner festgesetzten Zeit
  rationale: Bewahrt den Bezug auf den vorgeschriebenen Zeitpunkt des Festes, ohne ihn näher zu bestimmen als die Quelle.
- source_word: ቍርባኖሂ
  choice: seine Opfergaben
  rationale: Gibt den kultischen Sinn des Ausdrucks wieder und hält den Rückbezug auf das Fest fest.
- source_word: ዝክራነ
  choice: zum Gedenken
  rationale: Bewahrt die memoriale Funktion der Opfergaben, ohne eine bestimmte theologische Deutung hinzuzufügen.
- source_word: ደቂቀ እስራኤል
  choice: die Kinder Israel
  rationale: Die traditionsnahe deutsche Form ist verständlich und bewahrt die kollektive Bezeichnung des Ausgangstextes.
theological_decisions:
- issue: Funktion der Opfergaben als ዝክራነ
  choice: dass sie zum Gedenken dienen sollen
  alternative: dass sie Gedenkopfer sein sollen
  rationale: Die gewählte Formulierung lässt offen, worauf oder vor wem das Gedenken ausgerichtet ist, und vermeidet eine nicht ausdrücklich genannte Opferkategorie.
- issue: Vorschriftscharakter der Festfeier
  choice: wie es darüber geschrieben und festgesetzt ist
  alternative: wie es darüber geschrieben und eingraviert ist
  rationale: „Festgesetzt“ gibt in diesem rechtlich-kultischen Zusammenhang den normativen Sinn wieder; „eingraviert“ wäre zwar näher am Grundbild, klänge hier aber missverständlich materiell.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultisch-rechtlicher Sprache. Der durch die Versgrenze unterbrochene Satz bleibt durch die Auslassungspunkte sichtbar, statt durch einen nicht belegten Zusatz ergänzt zu werden.
