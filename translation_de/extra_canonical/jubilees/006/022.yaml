  to: 'Denn[a] dieses Fest sollst du feiern, wie darüber geschrieben steht und es festgesetzt ist. Denn ich habe im Buch des ersten Gesetzes aufgeschrieben, was ich dir geschrieben habe: Du sollst es zu seiner festgesetzten Zeit feiern, einen Tag im Jahr. Und über seine Opfergaben habe ich dir gesagt, dass sie zum Gedenken dienen sollen und dass die Israeliten es in …[b] feiern sollen.'
