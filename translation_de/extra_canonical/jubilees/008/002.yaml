- source_word: ወልህቀ፡ ወልድ፡
  choice: Und das Kind wuchs heran
  rationale: Gibt den im Ausgangstext ausdrücklich vorhandenen Schlusssatz wieder; „Kind“ klingt im Deutschen natürlicher als die ebenfalls mögliche Wiedergabe „Sohn“.
