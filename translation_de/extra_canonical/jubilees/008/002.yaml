- source_word: በዓመተ፡ ሣልስ፡ በሱባዔ፡ ዝንቱ፡
  choice: im dritten Jahr dieser Jahrwoche
  rationale: Gibt die zeitliche Angabe und den für das Jubiläenbuch charakteristischen Siebenjahreszeitraum präzise und in verständlichem Deutsch wieder.
- source_word: ወጸውዐ፡ ስሞ፡
  choice: und er gab ihm den Namen
