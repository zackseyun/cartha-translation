base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: de
  text: Und sein Vater lehrte ihn das Schreiben. Dann ging er fort, um sich einen Ort zu suchen, an dem er eine Stadt in Besitz nehmen konnte. Er fand eine Schrift, die die Alten in einen Felsen eingeritzt hatten, und las, was darin stand. Er schrieb sie ab und entdeckte darin die Lehre der Wächter, durch die sie die Vorzeichen der Sonne[a] beobachteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Zeichen der Sonne«.'
    reason: Die zugrunde liegende Wendung kann sowohl ominöse Vorzeichen als auch allgemeiner Zeichen beziehungsweise Erscheinungen der Sonne bezeichnen.
lexical_decisions:
- source_word: መጽሐፈ
  choice: das Schreiben / eine Schrift
  rationale: Das Substantiv kann je nach Zusammenhang die Schreibkunst beziehungsweise ein Schriftstück bezeichnen; die beiden Vorkommen werden daher kontextgemäß unterschiedlich wiedergegeben.
- source_word: ይእኅዝ፡ ሎቱ፡ ሀገረ
  choice: eine Stadt in Besitz nehmen
  rationale: Bewahrt den starken Sinn von አኀዘ („ergreifen, in Besitz nehmen“), ohne ihn unnötig als gewaltsame Eroberung festzulegen.
- source_word: ቀደምት
  choice: die Vorfahren
  rationale: Bezeichnet hier Menschen aus alter Zeit; „Vorfahren“ klingt im Deutschen natürlich und wahrt den historischen Bezug.
- source_word: ወአዕለዎ
  choice: Er schrieb sie ab
  rationale: Das Verb bezeichnet hier das Kopieren beziehungsweise Abschreiben der gefundenen Schrift, nicht ihr bloßes Verstehen.
- source_word: ትጉሃን
  choice: Wächter
  rationale: Traditionelle und im Kontext des Jubiläenbuches erkennbare Bezeichnung für die übernatürlichen Wächter.
- source_word: ሰገለ፡ ፀሓይ
  choice: Vorzeichen der Sonne
  rationale: Gibt die mantische Bedeutung der Wendung wieder; gemeint sind an der Sonne wahrgenommene Zeichen oder Omina.
theological_decisions:
- issue: Charakter der Lehre der Wächter
  choice: „Lehre der Wächter, nach der sie die Vorzeichen der Sonne beobachteten“
  alternative: „Lehre der Wächter, mit der sie die Zeichen der Sonne deuteten“
  rationale: Die Fassung lässt offen, ob das Verfahren primär Beobachtung oder Deutung war, und vermeidet eine zusätzliche theologische Wertung dieser Lehre.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Wiederholungen des Ausgangstextes wurden maßvoll geglättet, ohne narrative Einzelheiten auszulassen; insbesondere bleibt das Abschreiben der gefundenen Schrift ausdrücklich erhalten.
