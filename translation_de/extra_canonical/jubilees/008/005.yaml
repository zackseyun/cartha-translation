base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: de
  text: Denn er fürchtete sich, Noah davon zu erzählen, damit dieser ihm deswegen nicht zornig würde. Im fünften Jubiläum, in der ersten Jahrwoche, im ersten Jahr, nahm er sich eine Frau. Sie hieß Melka und war eine Tochter Madais, des Sohnes Jafets. Im vierten Jahr dieser Jahrwoche zeugte er einen Sohn und gab ihm den Namen Salah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይትመዐዐ፡ ላዕሌሁ
  choice: damit dieser ihm … nicht zornig würde
  rationale: Die negative Zwecksatzkonstruktion wird im Deutschen natürlich wiedergegeben; „dieser“ macht deutlich, dass Noah das Subjekt des Zornigwerdens ist.
- source_word: ኢዮቤልው
  choice: Jubiläum
  rationale: Der technische Zeitabschnitt des Jubiläenbuches bleibt als „Jubiläum“ erhalten und wird nicht vereinfachend mit „Jubeljahr“ gleichgesetzt.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Das Wort bezeichnet hier im chronologischen System eine Siebenerperiode von Jahren; „Jahrwoche“ ist präzise und im Deutschen verständlich.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm er sich eine Frau
  rationale: Dies entspricht der idiomatischen Bedeutung der Wendung und bewahrt das männliche Subjekt.
- source_word: ወሊደ፡ ወልደ
  choice: zeugte er einen Sohn
  rationale: Die Verbform ist maskulin Singular; daher ist der Mann Subjekt. „Zeugte“ gibt dies genauer wieder als „sie gebar ihm“.
- source_word: ወጸውዐ፡ ስሞ
  choice: gab ihm den Namen
  rationale: Natürliche moderne deutsche Wiedergabe der Namensgebungsformel „er nannte seinen Namen“.
