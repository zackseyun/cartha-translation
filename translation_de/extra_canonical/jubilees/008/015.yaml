base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: de
  text: Dieses Meer heißt »Zunge des Ägyptischen Meeres«. Von dort erstreckt es sich nach Norden bis zur Mündung des Großen Meeres, am Rand der Gewässer. Dann verläuft es westwärts bis Afra[a] und weiter, bis es sich dem Wasser des Flusses Gihon nähert, nördlich vom Wasser des Gihon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »westwärts von Afra«.'
    reason: Die knappe geographische Wortfolge kann alternativ so gegliedert werden, auch wenn die Lesart mit Afra als Ziel wahrscheinlicher ist.
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: Zunge des Ägyptischen Meeres
  rationale: Bewahrt die geographische Metapher »Zunge« und gibt die Genitivverbindung eng wieder.
- source_word: አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: Mündung des Großen Meeres
  rationale: Wörtlich steht »Mund des Großen Meeres«; »Mündung« ist im Deutschen die natürliche geographische Entsprechung.
- source_word: ውስተ፡ ክናፍረ፡ ማያት
  choice: am Rand der Wasser
  rationale: Die Wendung bezeichnet wörtlich die »Lippen/Ränder der Wasser«; die deutsche Fassung erhält das Grenzbild ohne unnatürliche Körpermetaphorik.
- source_word: መንገበ፡ ዐረብ፡ ዐፍራ
  choice: westwärts bis Afra
  rationale: Gibt die westliche Richtung und Afra als Ziel wieder, statt daraus »westlich von Afra« zu machen.
- source_word: ማየ፡ ጊዮን፡ ፈለገ
  choice: Wasser des Flusses Gihon
  rationale: Bezieht »Fluss« auf Gihon und lässt zugleich die wiederholte Grenzbezeichnung mit »Wasser« erkennen.
