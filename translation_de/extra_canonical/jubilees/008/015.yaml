  rationale: Die geringfügige stilistische Korrektur ersetzt das unnatürliche „Wasser“ im Plural durch „Gewässer“. Die nicht erforderliche Fußnote b wird entfernt, da der Haupttext die syntaktisch naheliegende Verbindung von „Fluss“ mit der ersten Gihon-Nennung bereits transparent wiedergibt. Die geographische und textliche Mehrdeutigkeit bei Afra bleibt in Fußnote a dokumentiert.
