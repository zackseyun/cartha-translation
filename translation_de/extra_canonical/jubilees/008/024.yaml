base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: de
  text: Und die Erde war voller Gewalt. Danach versündigten sie sich an den Tieren, den Vögeln und allem, was sich regt und auf der Erde umhergeht; und viel Blut wurde auf der Erde vergossen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: Gewalttat
  rationale: Das Wort bezeichnet Gewalt, Unrecht oder Frevel; »Gewalttat« gibt den konkreten Zusammenhang des Blutvergießens prägnant wieder.
- source_word: አበሱ
  choice: versündigten sie sich
  rationale: Die Verbform bezeichnet Sündigen beziehungsweise Schuldauf-sich-Laden; mit »an« bleibt die gegen Tiere und Vögel gerichtete Handlung erkennbar.
- source_word: አራዊት
  choice: Tiere
  rationale: Natürliche allgemein verständliche Wiedergabe für die genannten Landtiere beziehungsweise wilden Tiere.
- source_word: ዐዋፍ
  choice: Vögel
  rationale: Direkte moderne Wiedergabe.
- source_word: ዘይትሐወስ
  choice: was sich bewegt
  rationale: Bildet die allgemeine Bezeichnung beweglicher Lebewesen formal und verständlich ab.
- source_word: ዘያንሶሱ
  choice: auf der Erde umhergeht
  rationale: Bewahrt die zweite, vom bloßen Sich-Bewegen unterschiedene Tätigkeitsbeschreibung.
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: viel Blut wurde … vergossen
  rationale: Idiomatiche deutsche Wiedergabe der passiven Aussage über reichliches Blutvergießen.
theological_decisions:
- issue: Art der Sünde gegen die Tiere
  choice: Die allgemeine Formulierung »versündigten sie sich an« bleibt bestehen.
  alternative: Eine konkrete Deutung wie sexuelle Verfehlung, Misshandlung oder Tötung.
  rationale: Der überlieferte Wortlaut benennt die Sünde nicht genauer; eine Konkretisierung würde die genuine Offenheit des Textes auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von »auf der Erde« wird wie in der Quelle beibehalten; das Semikolon verbindet Sünde und Blutvergießen, ohne ihr genaues Verhältnis überzubestimmen.
