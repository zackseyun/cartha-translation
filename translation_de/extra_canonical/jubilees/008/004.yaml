base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/004.yaml
  text: '...and the moon and the stars in all the signs of heaven. And he wrote it down and said nothing about it...'
translation:
  language: de
  text: … und den Mond und die Sterne in allen Zeichen des Himmels. Und er schrieb es auf und berichtete darüber.[a] …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer vorgeschlagenen Textverbesserung: »Und er schrieb es auf und sagte nichts darüber.« Der überlieferte ge’ezische Wortlaut lautet jedoch positiv: »und er berichtete darüber«.'
    reason: Die englische Konsultationsfassung folgt einer Konjektur, die im bereitgestellten ge’ezischen Text nicht belegt ist; die echte textkritische Unsicherheit wird offengelegt.
lexical_decisions:
- source_word: ትእምረ፡ ሰማይ
  choice: Zeichen des Himmels
  rationale: Gibt die astronomischen »Zeichen« formal und verständlich wieder, ohne sie enger als Sternbilder oder Vorzeichen festzulegen.
- source_word: ጸሐፋ
  choice: schrieb es auf
  rationale: Das Verb bedeutet »schreiben«; das im Deutschen nötige Objekt wird aus dem Zusammenhang ergänzt.
- source_word: አነገረ፡ በእንቲአሃ
  choice: berichtete darüber
  rationale: 'Der überlieferte Wortlaut ist positiv: »er erzählte/berichtete darüber«. »Darüber« gibt die präpositionale Wendung idiomatisch wieder.'
theological_decisions:
- issue: Positive oder negative Aussage über das Berichten
  choice: Und er … berichtete darüber
  alternative: Und er … sagte nichts darüber
  rationale: Der vorgelegte ge’ezische Text hat ወአነገረ ohne Negationspartikel. Die negative Lesart setzt eine Konjektur zu ወኢነገረ voraus und wird deshalb nicht stillschweigend in den Haupttext aufgenommen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Auslassungspunkte kennzeichnen, dass der bereitgestellte Text offenbar versübergreifend segmentiert ist und nur das Ende des vorhergehenden Satzes sowie den Anfang des folgenden Satzes enthält.
