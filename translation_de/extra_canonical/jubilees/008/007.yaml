base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: de
  text: Und im sechsten Jahr gebar sie ihm einen Sohn, und er nannte ihn Peleg,[a] denn in seinen Tagen, als er geboren wurde, begannen die Söhne Noahs, die Erde unter sich aufzuteilen. Deshalb nannte er ihn Peleg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Name Peleg (Geʿez: ፋሌክ, Fālek) erinnert an den hebräischen Wortstamm פלג (plg), „teilen“ oder „spalten“, und nimmt damit auf die hier geschilderte Aufteilung der Erde Bezug.'
    reason: lexical_choice
lexical_decisions:
- source_word: ፋሌክ
  choice: Peleg
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet; das im Hintergrund stehende Wortspiel mit dem hebräischen Stamm פלג („teilen, spalten“) wird in einer Fußnote erläutert.
- source_word: ይትካፈሉ
  choice: aufzuteilen
  rationale: Die Form bezeichnet hier das Verteilen beziehungsweise Teilen der Erde unter den Söhnen Noahs; „unter sich aufzuteilen“ gibt sowohl den Vorgang als auch den wechselseitigen Bezug natürlich wieder.
- source_word: ደቂቀ፡ ኖኅ
  choice: die Söhne Noahs
  rationale: Wörtliche und im Kontext passende Wiedergabe; die genealogische Gruppenbezeichnung bleibt erhalten.
theological_decisions:
- issue: Zeitlicher Bezug der Teilung
  choice: „in seinen Tagen, als er geboren wurde, begannen …“
  alternative: „zu der Zeit, als er geboren wurde, teilten …“
  rationale: 'Die etwas spannungsreiche doppelte Zeitangabe des Geʿez-Textes wird bewahrt, ebenso der ingressiv wirkende Sinn von አኀዙ mit dem folgenden Verb: Die Söhne Noahs begannen mit der Aufteilung.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Namensgebung am Versende und die ungewöhnliche zeitliche Formulierung wurden entsprechend dem Ausgangstext beibehalten.
