    rationale: Auf „das ganze Land des Ostens und Indien“ folgt im Ge'ez „und in Erythräa und seine Berge“. „das Gebiet am Roten Meer samt seinen Bergen“ verschmilzt diese Angabe mit der zuvor bereits genannten „Erde/dem Land des Roten Meeres“.
  - severity: low
    issue: Der territoriale Umfang der Aufzählung ist bei „Morgenland und Indien“ syntaktisch leicht eingeengt.
    rationale: Die Quelle ordnet beide Größen der allgemeinen Landzuweisung zu. „das ganze Land des Ostens und Indiens“ macht dies im Deutschen klarer.
