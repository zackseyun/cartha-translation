base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: de
  text: 'und der Herr in Ewigkeit. Und er erkannte, dass Sem und seinen Söhnen für alle ewigen Geschlechter ein gesegneter Anteil und ein Segen zugefallen waren: das ganze Land Edom, das ganze Land am Roten Meer, das ganze Land des Ostens und Indiens, Erythräa und seine Berge, das ganze Land Baschan, das ganze Land Libanon und die Inseln von Kaftor, alle Berge von Senir und Amana, die Berge Assurs im Süden, die ganzen Länder Elams, Assurs und Babels sowie Susas und Mediens, alle Berge Ararats sowie das ganze Gebiet jenseits des Meeres, jenseits der Berge Assurs nach Norden hin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: ein gesegneter Anteil und ein Segen
  rationale: Gibt sowohl den Anteil als auch den ausdrücklich zusätzlich genannten Segen wieder; vermeidet die nicht quellengestützte Bedeutung „weit“.
- source_word: ለትውልድ፡ ዘለዓለም
  choice: für alle ewigen Geschlechter
  rationale: Bewahrt die generationenbezogene und dauerhafte Aussage in würdigem, verständlichem Deutsch.
- source_word: ምድረ፡ ጽባሕ
  choice: das ganze Morgenland
  rationale: Die Wendung bezeichnet das Land des Ostens; „Morgenland“ ist hier als geografische Listenbezeichnung natürlich und knapp.
- source_word: ባሕረ፡ ኤርትራ
  choice: Rotes Meer
  rationale: Traditionelle geografische Wiedergabe des erythräischen beziehungsweise Roten Meeres im Kontext dieser Völker- und Gebietsliste.
- source_word: ማዕዶተ፡ ባሕር
  choice: das Gebiet jenseits des Meeres
  rationale: Bewahrt die räumliche Perspektive der Quelle, ohne das gemeinte Meer übermäßig zu bestimmen.
theological_decisions:
- issue: Verhältnis von Anteil und Segen
  choice: Beide Begriffe werden nebeneinander erhalten.
  alternative: „ein gesegneter und weiter Anteil“
  rationale: Die Quelle nennt einen Segensanteil und zusätzlich einen Segen; eine Bedeutung „weit“ ist textlich nicht abgesichert.
- issue: Subjekt von „erkannte“
  choice: Das Pronomen „er“ bleibt ohne interpretierende Namensnennung stehen.
  alternative: Noah als Subjekt ausdrücklich einsetzen
  rationale: Die Quelle verwendet ein implizites beziehungsweise kontextuelles Subjekt; die Übersetzung soll keine unnötige Explizierung vornehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der am Versanfang stehende Satzrest „und der Herr in Ewigkeit“ bleibt erhalten, weil er im gelieferten ge'ezischen Segment bezeugt ist und offenbar den vorausgehenden Satz abschließt. Die Ortsnamen folgen geläufigen deutschen Formen; die lange Aufzählungsstruktur der Quelle wird bewahrt.
