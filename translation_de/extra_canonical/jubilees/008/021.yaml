  source_fidelity: Der Satzanfang als versübergreifender, elliptischer Rest ist beibehalten. Die Wendung über den Segensanteil und den zusätzlichen Segen ist zutreffend wiedergegeben. Jedoch unterscheidet der ge'ezische Text nach „dem Land des Ostens und Indien“ noch „Erythräa und seine Berge“; die vorliegende Fassung nivelliert diesen Ortsnamen zu einem weiteren Gebiet am Roten Meer.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „das ganze Morgenland und Indien“ lässt den Geltungsbereich von „ganz“ bei Indien etwas unklar; „das ganze Land des Ostens und Indiens“ bildet die Aufzählung klarer ab. Die Ländernamen am Ende werden mit Genitivformen und einem gemeinsamen Pluralbezug natürlicher lesbar.
  terminology: Sem, Edom, Baschan, Kaftor, Senir, Amana, Assur, Elam, Babel, Susa, Medien und Ararat sind angemessen. „Erythräa“ wahrt den im Text gesondert genannten historischen Ortsnamen, ohne ihn ungesichert mit dem bereits genannten Roten Meer gleichzusetzen.
