base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/022.yaml
  text: all the land of Eden, and all the land of the Erythraean Sea, and all the land of the east, and India, and on the Erythraean Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea beyond the mountains of Asshur toward the north—a blessed and spacious land, and all that is in it is very good.
translation:
  language: de
  text: das ganze Land Eden und das ganze Land am Erythräischen Meer, das ganze Land im Osten und Indien, das Gebiet am Erythräischen Meer samt seinen Bergen, das ganze Land Baschan, das ganze Land Libanon und die Inseln von Kaftor, alle Berge Senir und Amana, die Berge Assurs im Norden, das ganze Land Elam, Assur und Babylonien, Susa und Medien, alle Berge Ararat und das ganze Gebiet jenseits des Meeres, jenseits der Berge Assurs, nach Norden hin – ein gesegnetes und weites Land; und alles, was darin ist, ist sehr gut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ኤዶም
  choice: Land Eden
  rationale: Gibt den geographischen Eigennamen wieder, ohne ihn mit dem ähnlich geschriebenen Edom gleichzusetzen.
- source_word: ባሕረ፡ ኤርትራ
  choice: Erythräisches Meer
  rationale: Der traditionelle antike geographische Name bezeichnet je nach Kontext das Rote Meer und angrenzende Gewässer; die historische Bezeichnung bewahrt diese Weite.
- source_word: ካፍቶር
  choice: Kaftor
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: መንገለ፡ መስዕ
  choice: nach Norden hin
  rationale: Die Richtungsangabe bedeutet Norden und wird entsprechend der ge’ezischen Lesart wiedergegeben.
- source_word: ምድረ፡ ቡርክት፡ ወስፍሕት
  choice: ein gesegnetes und weites Land
  rationale: Bewahrt beide wertenden Eigenschaften in natürlichem, würdevollem Deutsch.
theological_decisions: []
translation_notes:
  register: Moderne deutsche Standardsprache mit würdigem, geographisch aufzählendem Stil. Wiederholungen von »das ganze Land« und »jenseits« bleiben weitgehend erhalten, um Struktur und räumliche Staffelung des Ausgangstextes zu bewahren.
