  text: And it goes toward the border of this river, and it goes toward the east until it approaches the garden of Eden, toward its north, to the north, and from the east of all the land of Eden, and to all the east, and it turns within the east and comes until it approaches the east of the mountain whose name is
translation:
  language: de
  text: Und sie verläuft zur Grenze dieses Flusses hin und nach Osten, bis sie sich dem Garten Eden nähert, zu seiner Nordseite hin, nach Norden; und vom Osten des ganzen Landes Eden aus zum gesamten Osten hin wendet sie sich im Osten und verläuft weiter, bis sie sich der Ostseite des Berges nähert, dessen Name …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንገበ፡ ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: zur Grenze dieses Flusses hin
  rationale: መንገበ bezeichnet hier die Richtung; ድንጋጉ ist als Grenze/Ufer mit Possessivbezug zu verstehen, nicht als Eigenname. ለዝ፡ ፈለግ bedeutet „dieses Flusses“.
- source_word: መንገበ፡ ጽባሕ
  choice: nach Osten
  rationale: Die Richtungsformel wird in natürlichem Deutsch adverbial wiedergegeben.
- source_word: ገነት፡ ዘኤዶም
  choice: Garten Eden
  rationale: Die etablierte deutsche Bezeichnung entspricht der geezischen Genitivverbindung.
- source_word: መንገበ፡ ሰሜኑ፡ ለሰሜን
  choice: nördlich davon, nach Norden
  rationale: Die doppelte Richtungsangabe und der possessive Bezug bleiben erhalten, ohne sie zu „Nordosten“ zu glätten.
- source_word: ወእምጽባሒሃ፡ ለኵላ፡ ምድረ፡ ኤዶም
  choice: und vom Osten des ganzen Landes Eden
  rationale: እም bezeichnet den Ausgangspunkt „von/aus“; ጽባሒሃ enthält einen femininen Possessivbezug auf das Land.
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: der Ostseite des Berges
  rationale: Die Konstruktion bezeichnet den Osten beziehungsweise die Ostseite des Berges, nicht lediglich eine Bewegung ostwärts zum Berg.
