  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
translation:
  language: de
  text: und ein Mann seinen Nächsten. Und jeder verkaufte sich selbst, um Unrecht zu tun und viel Blut zu vergießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte ge''ezische Textausschnitt beginnt offenbar mitten in einem Satz und stimmt nicht mit der gewöhnlichen Zuordnung zu Jubiläen 8,23 überein. Eine frühere Fassung lautete: „Und Ham wusste, dass sein Vater seinen jüngsten Sohn verflucht hatte, und er trennte sich von seinem Vater, er und seine Söhne mit ihm: Kusch, Mizrajim, Put und Kanaan.“'
    reason: source_alignment
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: ein Mann seinen Nächsten
  rationale: Die knappe, offenbar elliptische Wendung wird formal bewahrt; der vorliegende Ausschnitt beginnt mitten in einem Satz.
- source_word: ኵሉ፡ ተሰይጠ
  choice: jeder verkaufte sich selbst
  rationale: Bewahrt die starke reflexive Verkaufsmetapher des ge'ezischen Textes, statt sie zu 'gab sich hin' abzuschwächen.
- source_word: ይግበር፡ ዐመፃ
  choice: um Unrecht zu tun
  rationale: Gibt die Zweckkonstruktion und den breiten moralischen Begriff ዐመፃ natürlich und ohne konfessionelle Zuspitzung wieder.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: viel Blut zu vergießen
  rationale: Entspricht der idiomatischen Verbindung von 'Blut' mit dem Verb des Ausgießens und bewahrt die Mengenangabe.
theological_decisions:
- issue: Art der moralischen Verfehlung
  choice: Unrecht
  alternative: Bosheit / Frevel
  rationale: „Unrecht“ hält den Begriff weit und vermeidet eine unnötige kultische oder dogmatische Einengung.
- issue: Selbstverkauf als Metapher
  choice: verkaufte sich selbst
  alternative: gab sich hin
  rationale: Die auffällige Metapher bleibt sichtbar; der Text erklärt weder Käufer noch Gegenleistung, und diese Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Unvollständigkeit am Anfang wird nicht durch eine frei ergänzte Handlung geglättet, weil der bereitgestellte Quellenausschnitt offenbar fehlzugeordnet oder unvollständig ist.
