review_pass:
  verdict: revise
  source_fidelity: 'Die genealogische Kette ist in der Hauptfassung im Wesentlichen vollständig wiedergegeben: Henoch wird als „der Vater eures Vaters“ bezeichnet, Metuschelach als sein Sohn und Lamech als Sohn Metuschelachs. Die einleitende Wendung „dann“ fügt jedoch eine im geʿezischen Text nicht ausdrücklich markierte Folgerung hinzu. Zudem gibt „leben“ die ethische Wendung zwar idiomatisch, aber etwas freier wieder als erforderlich.'
  naturalness: Die deutsche Fassung ist überwiegend klar und würdig. „in Gerechtigkeit und Aufrichtigkeit leben; dann werdet ihr gerecht sein“ wirkt wegen der zusätzlichen Folgerung und der Doppelung etwas uneinheitlich. „in Gerechtigkeit und Aufrichtigkeit handeln und gerecht sein“ ist zugleich natürlich und näher an der Satzstruktur.
  terminology: „Gerechtigkeit“, „Aufrichtigkeit“, „Henoch“, „Metuschelach“ und „Lamech“ sind angemessen. Die Fußnote bietet jedoch eine verkürzende Lesart als Alternative an, obwohl sie die im Text ausdrücklich vorhandenen genealogischen Bezeichnungen gerade nicht bewahrt; sie sollte entfallen.
  issues:
  - severity: low
    issue: Zusätzliche Folgerung durch „dann“
    rationale: Das Geʿez reiht die Aufforderung zum Gerechtsein und das Gedeihen der Pflanzungen mit „und“ aneinander. Ein deutsches „dann“ kann eine stärkere konditionale beziehungsweise kausale Beziehung nahelegen, die nicht ausdrücklich markiert ist.
  - severity: low
    issue: Fußnote bewahrt eine inhaltlich verkürzende Alternative
    rationale: Die vorgeschlagene Alternative „Henoch gebot eurem Vater Metuschelach“ lässt sowohl „der Vater eures Vaters“ als auch „seinem Sohn“ aus. Da die Hauptfassung den überlieferten Wortlaut ausreichend verständlich wiedergibt, ist diese Fußnote weder nötig noch hilfreich.
  revised_text: Ihr sollt in Gerechtigkeit und Aufrichtigkeit handeln und gerecht sein, und alles, was ihr pflanzt, wird gedeihen. Denn so gebot Henoch, der Vater eures Vaters, seinem Sohn Metuschelach, Metuschelach seinem Sohn Lamech und Lamech …
