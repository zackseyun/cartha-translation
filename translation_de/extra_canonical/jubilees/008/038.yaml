base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
translation:
  language: de
  text: Ihr sollt in Gerechtigkeit und Aufrichtigkeit handeln und gerecht sein, und alles, was ihr pflanzt, wird gedeihen. Denn so gebot Henoch, der Vater eures Vaters, seinem Sohn Metuschelach, Metuschelach seinem Sohn Lamech und Lamech …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ
  choice: in Gerechtigkeit und Aufrichtigkeit
  rationale: Gibt die beiden ethischen Begriffe getrennt und in natürlichem, würdigem Deutsch wieder.
- source_word: ወትጸድቁ
  choice: dann werdet ihr gerecht sein
  rationale: Bewahrt die Aussage über das Gerechtsein und macht zugleich den syntaktischen Zusammenhang mit der vorangehenden Wendung verständlich.
- source_word: ወይረተው፡ ኵሉ፡ ተክሊክሙ
  choice: und alles, was ihr pflanzt, wird gedeihen
  rationale: Gibt das Bild der Pflanzungen idiomatisch wieder, ohne es auf Nachkommen oder Werke festzulegen.
- source_word: ወልዱ
  choice: seinem Sohn
  rationale: Kennzeichnet in der genealogischen Überlieferungskette jeweils ausdrücklich die Sohnschaft.
theological_decisions:
- issue: Genealogische Bezeichnung Henochs
  choice: Henoch, der Vater eures Vaters, seinem Sohn Metuschelach
  alternative: Henoch gebot eurem Vater Metuschelach
  rationale: Die Hauptfassung erhält sowohl die ausdrückliche Bezeichnung Henochs als „Vater eures Vaters“ als auch Metuschelachs Bezeichnung als sein Sohn; die sprachlich mögliche, aber inhaltlich verkürzende Alternative steht in der Fußnote.
- issue: Bild von den Pflanzungen
  choice: wörtlich-offen als „alles, was ihr pflanzt“
  alternative: eure Nachkommen oder eure Werke
  rationale: Die Bildsprache bleibt theologisch offen und wird nicht stillschweigend auf eine bestimmte Deutung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leichte Wiederholung von „Gerechtigkeit“ und „gerecht“ bewahrt den Zusammenhang der geʿezischen Wortwahl. Der Abbruch am Versende wird durch Auslassungspunkte kenntlich gemacht, weil auch der bereitgestellte Quelltext dort unvollständig endet.
