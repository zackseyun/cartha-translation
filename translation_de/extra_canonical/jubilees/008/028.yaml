base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/028.yaml
  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: de
  text: Und er pries den Gott der Götter, der ihm das Wort des Herrn in den Mund gelegt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: pries
  rationale: Das Verb bezeichnet hier ein Segnen beziehungsweise Lobpreisen Gottes; im natürlichen modernen Deutsch ist „pries“ bei Gott als Objekt eindeutig und würdig.
- source_word: አምላክ፡ አማልክት
  choice: Gott der Götter
  rationale: Die superlativisch-hoheitliche Genitivformel wird formal bewahrt, ohne ihre Aussage über andere Götter näher auszudeuten.
- source_word: ወደየ
  choice: gelegt hatte
  rationale: Gibt das Einsetzen oder Legen in den Mund idiomatisch wieder; das Plusquamperfekt verdeutlicht die Vorzeitigkeit gegenüber dem Preisen.
- source_word: ንባበ፡ እግዚአብሔር
  choice: das Wort des Herrn
  rationale: Bewahrt die traditionelle und kontextuell passende Wiedergabe der geezischen Genitivverbindung.
theological_decisions:
- issue: Bezeichnung Gottes als „Gott der Götter“
  choice: Die Formel wörtlich beibehalten
  alternative: „höchsten Gott“
  rationale: Die Quellenaussage bleibt in ihrer echten theologischen Spannung erhalten und wird nicht zu einem abstrakten Superlativ umgedeutet.
- issue: Urheberschaft des gesprochenen Wortes
  choice: „der ihm das Wort des Herrn in den Mund gelegt hatte“
  alternative: „der das Wort des Herrn in seinen Mund gegeben hatte“
  rationale: Die Formulierung wahrt die göttliche Veranlassung der Rede, ohne Inspiration oder Sprechweise konfessionell näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Pries“ vermeidet die im Deutschen mögliche Fehlvorstellung, ein Mensch verleihe Gott Segen, während es den Sinn des Gotteslobs klar ausdrückt. Das im Quelltext vorausgesetzte männliche Bezugswort wird mit „er/ihm“ wiedergegeben.
