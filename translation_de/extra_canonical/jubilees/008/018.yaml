  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: de
  text: 'Für Sem und seine Söhne, damit sie es für immer besitzen, für seine Nachkommen bis in Ewigkeit. Noach freute sich, weil dieser Anteil Sem und seinen Söhnen zugefallen war. Da erinnerte er sich an alles, was er mit seinem Mund prophetisch ausgesprochen hatte; denn er hatte gesagt: »Gepriesen sei der HERR, der Gott Sems, und er wohne …«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእኂዞታ
  choice: damit sie es … besitzen
  rationale: Der Infinitiv mit Objektsuffix bezeichnet das Besitzen des zuvor beschriebenen Anteils; die deutsche Finalkonstruktion gibt die syntaktische Funktion natürlich wieder.
- source_word: መክፈልት
  choice: Anteil
  rationale: Das Wort bezeichnet hier den Sem durch die Landverteilung zugefallenen Teil; „Anteil“ ist verständlich und wahrt den Verteilungskontext.
- source_word: ወፅአ
  choice: zugefallen war
  rationale: Wörtlich liegt ein Verb des Hervorgehens vor; im Kontext der Zuteilung drückt „zufallen“ idiomatisch aus, dass der Anteil Sem und seinen Söhnen durch die Verteilung zukam.
- source_word: በትንቢት
  choice: durch Prophetie
  rationale: Die Form bezeichnet die prophetische Weise beziehungsweise Vollmacht seiner Äußerung; die Wiedergabe vermeidet, daraus stillschweigend eine konkrete Einzelprophezeiung zu machen.
- source_word: ይትባረክ
  choice: Gepriesen sei
  rationale: Der jussivische Segensruf wird im Deutschen mit der etablierten, würdigen Formel wiedergegeben.
theological_decisions:
- issue: Bezug des Pronomens in „und er wohne“
  choice: Das Pronomen bleibt ohne ergänztes Bezugswort stehen.
  alternative: „und Gott wohne …“ oder „und Jafet wohne …“
  rationale: Der überlieferte Ausschnitt endet unmittelbar nach dem Verb und nennt kein ausdrückliches Subjekt. Eine Auflösung würde die echte syntaktische und intertextuelle Spannung vorwegnehmen.
- issue: Gottesbezeichnung in Noachs Segenswort
  choice: „der HERR, der Gott Sems“
  alternative: „Gott, der Gott Sems“
  rationale: እግዚአብሔር ist die übliche äthiopische Wiedergabe der Gottesbezeichnung „Herr“; die Formulierung entspricht zudem dem erkennbaren Bezug auf Genesis 9,26, ohne darüber hinaus Lehrgehalt einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als Anschluss an die vorausgehende Grenzbeschreibung erkennbar. Die Auslassungspunkte am Ende zeigen an, dass der bereitgestellte ge’ezische Quellenausschnitt mitten im Satz abbricht; sie sind keine inhaltliche Ergänzung.
