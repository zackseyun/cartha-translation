    issue: Unnatürliche Wiedergabe von በትንቢት
    rationale: „Durch Prophetie“ klingt im Deutschen instrumental und abstrakt. Die Quelle bezeichnet die prophetische Art der Rede; „prophetisch“ gibt dies natürlicher wieder, ohne den Sinn einzuengen.
