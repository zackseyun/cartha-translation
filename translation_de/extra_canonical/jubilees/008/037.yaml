  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: de
  text: Vor dem Altar[a], der angenommen wird. Und im fünften Jahr gewährten sie einen Erlass, damit ihr es erlasst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Ge’ez: „Altar“; nicht „Opfergabe“.'
    reason: Die ähnliche Wortform kann mit dem Ausdruck für eine Opfergabe verwechselt werden.
  - marker: b
    text: 'Der ge’ezische Text lautet: „gewährten sie … damit ihr … erlasst“. Möglicherweise ist statt „gewährten sie“ zu lesen: „gewährt“, sodass der ganze Satz eine Anweisung wäre.'
    reason: Der überlieferte Personwechsel ist auffällig und könnte auf einen Abschreib- oder Übertragungsfehler zurückgehen; die Fußnote bewahrt sowohl den Textbefund als auch die naheliegende Konjektur.
lexical_decisions:
- source_word: ምሥዋዕ
  choice: Altar
  rationale: Das ge’ezische ምሥዋዕ bezeichnet hier den Altar; für „Opfergabe“ wäre gewöhnlich መሥዋዕት zu erwarten.
- source_word: ዘይትወከፍ
  choice: der angenommen wird
  rationale: Die Relativform mit passivischer Bedeutung wird eng am Wortlaut wiedergegeben, ohne näher zu bestimmen, von wem oder in welchem Sinn der Altar angenommen wird.
- source_word: ኅድገተ
  choice: Erlass
  rationale: Das Substantiv bezeichnet ein Freilassen, Erlassen oder eine Freigabe. „Erlass“ bewahrt die Verbindung zum folgenden Verb und lässt den konkreten Gegenstand offen.
- source_word: ታሕድግዎ
  choice: damit ihr es erlasst
  rationale: Die Verbform ist zweite Person Plural und enthält ein Objektpronomen der dritten Person Singular; daher „ihr … es“.
theological_decisions:
- issue: Personwechsel zwischen ገበሩ und ታሕድግዎ
  choice: „vollzogen sie … damit ihr … erlasst“ nach dem überlieferten ge’ezischen Wortlaut
  alternative: „vollzieht … damit ihr … erlasst“ durch Konjektur eines Imperativs ግበሩ
  rationale: Der vorgelegte Text hat formal die dritte Person Plural ገበሩ, während das folgende Verb in der zweiten Person Plural steht. Der auffällige Wechsel wird nicht stillschweigend geglättet; die plausible Imperativ-Konjektur wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Charakter und der unvermittelte Personwechsel des überlieferten Satzes bleiben sichtbar; die Fußnote erläutert die wahrscheinlichere imperativische Lesart, ohne sie in den Haupttext einzusetzen.
