  naturalness: '„Einen Erlass vollziehen“ ist im modernen Deutsch jedoch nicht idiomatisch: Einen Erlass kann man erlassen, gewähren oder verfügen; „vollziehen“ bezeichnet eher die Ausführung eines bereits bestehenden Erlasses. „Gewährten“ ist hier eine natürliche, vorsichtige Wiedergabe von „machten“ im Sinn eines gewährten Erlasses und bewahrt den überlieferten Personwechsel.'
  terminology: „Altar“ statt „Opfergabe“ entspricht dem vorgelegten ge’ezischen Text und dem englischen Audit-Vermerk. „Erlass“ und „erlassen“ erhalten die lexikalische Verbindung des Substantivs mit dem folgenden Verb. Die Fußnoten sind sachlich und vermeiden es, die plausible imperativische Konjektur als Text sicherzustellen.
