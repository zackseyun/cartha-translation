base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: de
  text: 'Denn ich sehe – und siehe: Die Dämonen haben begonnen, euch und eure Kinder irrezuführen. Und nun fürchte ich um euch, dass ihr nach meinem Tod Menschenblut auf der Erde vergießen und auch ihr vom Erdboden getilgt werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: die Dämonen
  rationale: Direkte und im modernen Deutschen verständliche Wiedergabe des geʿezischen Ausdrucks für böse Geister.
- source_word: አበሱተ፡ ወጠኑ፡ ላዕሌክሙ፡ ወላዕለ፡ ውሉድክሙ
  choice: haben begonnen, euch und eure Kinder in die Irre zu führen
  rationale: Gibt den einsetzenden schädlichen Einfluss auf die Angeredeten und ihre Kinder natürlich wieder, ohne näher festzulegen, auf welche Weise die Verführung geschieht.
- source_word: ትክዐዉ፡ ደመ፡ ሰብእ
  choice: Menschenblut vergießen
  rationale: Entspricht der konkreten Wendung „Blut eines Menschen/Menschenblut ausgießen“ und bewahrt den Bezug auf tödliche Gewalt.
- source_word: ትደመሰሱ
  choice: getilgt werdet
  rationale: Bewahrt die starke Vernichtungssprache des Ausgangstextes und passt zur folgenden Wendung „vom Erdboden“.
- source_word: እምገጸ፡ ምድር
  choice: vom Erdboden
  rationale: Natürliche, biblisch geprägte Wiedergabe von „vom Angesicht der Erde“, ohne im Deutschen unnötig wörtlich zu klingen.
theological_decisions:
- issue: Art des dämonischen Wirkens
  choice: „in die Irre führen“
  alternative: „gegen euch zu sündigen beginnen“ oder „euch zu verführen beginnen“
  rationale: Der Zusammenhang beschreibt einen verderblichen Einfluss der Dämonen. „In die Irre führen“ erhält diese Aussage, ohne eine spezifische dämonologische Wirkweise oder ein bestimmtes moralisches Vergehen einzutragen.
- issue: Folge des Blutvergießens
  choice: 'passivisch: „vom Erdboden getilgt werdet“'
  alternative: „man euch vom Erdboden tilgt“
  rationale: Das Passiv bewahrt die Offenheit des Textes darüber, wer die Vernichtung vollzieht, und vermeidet eine ausdrückliche Zuschreibung, die im Satz nicht genannt wird.
translation_notes:
  register: Moderne, würdige Standardsprache mit leichter biblischer Prägung. Der präsentische Wahrnehmungsruf „und seht“ sowie die drastische Sprache von Blutvergießen und Tilgung bleiben erhalten; unbelegte konfessionelle Deutungen werden vermieden.
