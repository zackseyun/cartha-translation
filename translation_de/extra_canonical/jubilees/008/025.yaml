base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: de
  text: Die Gedanken und das Verlangen des Menschen ersinnen allezeit Nichtiges und Böses.[a] Und der Herr tilgte alles vom Erdboden hinweg wegen ihrer bösen Taten und wegen des Blutes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denken allezeit Nichtiges und Böses«.'
    reason: Die Verbindung von Subjekt und Verb kann im Deutschen sowohl mit „ersinnen“ als auch mit „denken“ wiedergegeben werden; die Alternative erhält die formale Nähe zum Denkverb.
  - marker: b
    text: 'Wörtlich: »wegen des Blutes«; möglicherweise sind Blutschuld oder Blutvergießen gemeint.'
    reason: Die knappe Ausgangsformulierung lässt offen, ob „Blut“ konkret oder als Bezeichnung für die dadurch begründete Schuld zu verstehen ist.
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: Die Gedanken und das Verlangen des Menschen
  rationale: Gibt sowohl ሕሊና („Gedanke, Sinn“) als auch ፈቃድ („Wille, Verlangen“) wieder, ohne sie zu einem einzigen Begriff zusammenzuziehen.
- source_word: ይኄሊ
  choice: ersinnen
  rationale: Bewahrt den verbalen Gedanken des Denkens bzw. Vorstellens; die Formulierung ist im Deutschen natürlich und verbindet sich passend mit den folgenden Gegenständen.
- source_word: ከንተ፡ ወእኩየ
  choice: Nichtiges und Böses
  rationale: ከንተ bezeichnet Nichtigkeit, Eitles oder Vergebliches; እኩይ bezeichnet Böses. Beide Elemente werden ausdrücklich bewahrt.
- source_word: በኵሉ፡ መዋዕል
  choice: allezeit
  rationale: Gibt die zeitliche Dauerformel knapp und würdevoll als „zu allen Zeiten/fortwährend“ wieder.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እምነ፡ ገጸ፡ ምድር
  choice: Und der Herr tilgte alles vom Erdboden hinweg
  rationale: „Tilgte ... hinweg“ gibt das starke Vernichtungsverb wieder; „vom Erdboden“ entspricht der Wendung „vom Angesicht der Erde“ in natürlichem modernem Deutsch.
- source_word: ወበእንተ፡ ደም
  choice: und wegen des vergossenen Blutes
  rationale: Der Quelltext hat wörtlich „wegen Blut“. Die deutsche Ergänzung „vergossenen“ macht den idiomatisch gemeinten Zusammenhang mit Blutschuld bzw. Blutvergießen verständlich, ohne ihn im Haupttext weiter auszudeuten.
theological_decisions:
- issue: Anthropologische Aussage über Gedanken und Verlangen
  choice: als aktives Ersinnen von Nichtigem und Bösem wiedergegeben
  alternative: „waren allezeit böse“
  rationale: Die kürzere Alternative glättet die Aussage, lässt jedoch das Verb ይኄሊ und das eigenständige Element ከንተ aus. Die gewählte Fassung bewahrt die differenziertere Quellenformulierung.
- issue: Umfang des göttlichen Gerichts
  choice: „alles“ beibehalten
  alternative: „alle“ oder „alles Lebendige“
  rationale: Das unbestimmte ኵሎ wird nicht durch eine ausdrücklichere Bezugsgröße eingeengt. Eine Fußnote weist auf die mögliche personale Auffassung hin.
- issue: Bedeutung von „Blut“
  choice: „vergossenes Blut“ im Text
  alternative: „Blutschuld“
  rationale: „Blutschuld“ wäre eine stärkere theologische Deutung. „Vergossenes Blut“ wahrt das konkrete Bild und verdeutlicht zugleich den idiomatischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber idiomatisch gestaltet. Seltene oder konfessionell geprägte Fachsprache wurde vermieden; echte lexikalische Mehrdeutigkeit wird in den Fußnoten offengehalten.
