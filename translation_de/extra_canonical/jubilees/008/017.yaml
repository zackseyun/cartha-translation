lexical_decisions:
- source_word: ራፋ
  choice: Rafa
  rationale: Der Eigenname steht am Anfang des überlieferten Versabschnitts und wird trotz seines syntaktischen Bezugs zum vorhergehenden Kontext beibehalten.
- source_word: ወይወርድ
  choice: Dann führt sie … hinab
  rationale: Das Verb bezeichnet ein Hinabgehen bzw. einen abwärts gerichteten Grenzverlauf; im Deutschen wird der Verlauf einer zuvor genannten Grenze idiomatisch mit „führt“ wiedergegeben.
- source_word: መንገበ፡ ጽንፉ
  choice: bis zum Ufer
  rationale: Die Wendung bezeichnet eine Seite, Kante oder Begrenzung; im Zusammenhang mit dem unmittelbar folgenden Fluss ist „Ufer“ die natürliche räumliche Wiedergabe.
- source_word: ጢና፡ ፈለገ
  choice: des Flusses Tina
  rationale: ፈለገ bedeutet „Fluss“, während ጢና als Eigenname transliteriert wird.
- source_word: ዛቲ፡ መክፈልት
  choice: Dieser Anteil
  rationale: Wörtliche und im Kontext einer Landverteilung natürliche Wiedergabe.
- source_word: ወፅአት፡ በዕፁ
  choice: fiel durch das Los zu
  rationale: Die feste Wendung bezeichnet die Zuteilung durch Losentscheid; „zufallen“ bewahrt zugleich das Bild des Losens.
