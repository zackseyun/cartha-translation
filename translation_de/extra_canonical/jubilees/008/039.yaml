revisions:
- from: Er gebot mir alles, was seine Väter ihm geboten hatten. Auch ich gebiete euch, meine Kinder, so wie Henoch seinem Sohn in den ersten Jubiläen gebot, als er noch lebte, in der siebten Generation. Bis zum Tag seines Todes gebot er seinem Sohn und den Kindern seines Sohnes und legte ihnen eindringlich Zeugnis ab.[a]
  to: Er gebot mir alles, was seine Väter ihm geboten hatten. Auch ich gebiete euch, meine Kinder, so wie Henoch seinem Sohn in den ersten Jubiläen gebot, als er noch lebte, in der siebten Generation. Er gebot seinem Sohn und den Kindern seines Sohnes und bezeugte ihnen dies bis zum Tag seines Todes.[a]
  rationale: Die Revision ersetzt die umschreibende, leicht unnatürliche Formulierung »legte ihnen eindringlich Zeugnis ab« durch »bezeugte ihnen dies«. Das demonstrative »dies« nimmt die vorausgehenden Gebote auf, ohne eine bestimmte Lehre oder einen zusätzlichen Inhalt zu behaupten. Die Zeitangabe steht nun bei beiden fortgesetzten Handlungen.
