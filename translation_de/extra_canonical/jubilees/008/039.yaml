base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: de
  text: Er gebot mir alles, was seine Väter ihm geboten hatten. Auch ich gebiete euch, meine Kinder, so wie Henoch seinem Sohn in den ersten Jubiläen gebot, als er noch lebte, in der siebten Generation. Er gebot seinem Sohn und den Kindern seines Sohnes und bezeugte ihnen dies bis zum Tag seines Todes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ließ es sie hören; auch: ermahnte sie eindringlich.'
    reason: Die ge’ezische Kausativform kann wörtlich das Hörenlassen und kontextuell feierliches Bezeugen oder Ermahnen bezeichnen.
lexical_decisions:
- source_word: አዘዘ / እኤዝዘክሙ
  choice: gebot / gebiete euch
  rationale: Die wiederholte Wurzel bezeichnet verbindliches Gebieten oder Anweisen; die Wiederholung des Ausgangstextes bleibt sichtbar.
- source_word: በቀዳሚ፡ እዮቤልውሳት
  choice: in den ersten Jubiläen
  rationale: Der Plural des ge’ezischen Textes wird bewahrt; »Jubiläen« bezeichnet hier Jubiläumszeiträume.
- source_word: እንዘ፡ ሕያው፡ ውእቱ
  choice: als er noch lebte
  rationale: Natürliche deutsche Wiedergabe der temporalen Begleitumstandsformel.
- source_word: አስምዐ
  choice: legte ihnen eindringlich Zeugnis ab
  rationale: Die Kausativform von »hören« kann im Kontext feierliches Bezeugen oder nachdrückliches Kundtun ausdrücken; die Formulierung wahrt diesen ernsten Ton.
theological_decisions:
- issue: Art und Inhalt von Henochs Zeugnis
  choice: legte ihnen eindringlich Zeugnis ab
  alternative: ließ es seinen Nachkommen hören / ermahnte sie
  rationale: Der Text nennt den Inhalt des Bezeugens nicht ausdrücklich. Die Übersetzung ergänzt daher keine konkrete Lehre und lässt den feierlich-mahnenden Charakter offen.
- issue: Bezug der siebten Generation
  choice: in der siebten Generation
  alternative: während des siebten Geschlechts
  rationale: Die knappe Quellenformulierung bleibt erhalten, ohne ihre chronologische Zuordnung über den Wortlaut hinaus zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Wiederholung von »gebieten« und die genealogischen Formulierungen wurden bewusst beibehalten; unnötig altertümliche Wendungen wurden vermieden.
