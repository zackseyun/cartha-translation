  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge der wiederholten Gebote, die Bezugnahme auf Henoch, die ersten Jubiläen, die siebte Generation und die Fortdauer bis zu Henochs Tod im Wesentlichen zutreffend wieder. Das ge’ezische አስምዐ ist jedoch ein einzelnes Prädikat neben »gebot«; »legte ihnen eindringlich Zeugnis ab« ist im Deutschen semantisch und syntaktisch weniger unmittelbar und setzt mit »eindringlich« einen Akzent, der nicht eigens markiert ist.
  naturalness: Die Übersetzung ist überwiegend modernes Standarddeutsch. Die Stellung von »Bis zum Tag seines Todes« am Satzanfang ist möglich, doch die engere Verbindung der beiden Verben mit ihren Empfängern und der Zeitangabe am Satzende liest sich klarer. »bezeugte« ist hier idiomatischer als »legte ... Zeugnis ab«.
  terminology: »gebot/gebiete«, »Henoch« und »Jubiläen« sind angemessen. Der technische, pluralische Ausdruck »in den ersten Jubiläen« bleibt erhalten. Für አስምዐ wahrt »bezeugte« die im englischen Audit Trail gewählte feierlich-deklarative Nuance, ohne den nicht genannten Inhalt zu ergänzen.
