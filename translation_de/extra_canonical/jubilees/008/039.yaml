    rationale: Das ge’ezische Verb kann »zu hören geben«, »kundtun« oder kontextuell »bezeugen« bedeuten. »bezeugte« überträgt die gewählte Kontextnuance direkter und lässt den nicht ausgedrückten Gegenstand offen.
  - severity: low
    issue: Die Satzstellung trennt die bis zum Tod fortgesetzten Handlungen etwas von ihrer Zeitangabe.
