base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: de
  text: Dies sind die Söhne Noahs. Im achtundzwanzigsten Jubiläum, in der siebten Jahrwoche, begann Noah, den Kindern seiner Söhne die Satzungen und Gebote sowie alles, was er über das Recht wusste, einzuschärfen. Er bezeugte seinen Söhnen, dass sie gerecht handeln, die Blöße ihres Leibes bedecken, ihren Schöpfer preisen, Vater und Mutter ehren, jeder seinen Bruder lieben und sich vor Unzucht bewahren sollten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Text hat wörtlich „während Noah … gebot“. Dann kann der Satz auch so verstanden werden: „Während Noah den Kindern seiner Söhne die Satzungen und Gebote sowie alles, was er über das Recht wusste, einschärfte, bezeugte er seinen Söhnen …“ Die Übersetzung im Haupttext folgt der möglichen Lesart „begann“ statt „während“.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: die Satzungen und Gebote
  rationale: Bewahrt die formale Paarung zweier normativer Begriffe und klingt zugleich in modernem, würdigem Deutsch natürlich.
- source_word: ፍትሐ
  choice: das Recht
  rationale: Der Begriff bezeichnet hier Recht beziehungsweise gerechte Ordnung; „das Recht“ bewahrt diese sachliche Breite.
- source_word: ጽድቀ
  choice: gerecht handeln
  rationale: Gibt die ethische Aufforderung idiomatisch wieder, ohne den Begriff auf bloße Gesetzeserfüllung zu verengen.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: die Blöße ihres Leibes
  rationale: Die Wendung meint wörtlich die Scham beziehungsweise Blöße des Fleisches; diese Fassung ist verständlich und wahrt den körperlichen Bezug.
- source_word: ያባርክዎ፡ ለዘፈጠሮሙ
  choice: ihren Schöpfer preisen
  rationale: Das Verb bedeutet grundsätzlich „segnen“; bei menschlichem Handeln gegenüber Gott ist „preisen“ im Deutschen die natürliche und semantisch angemessene Wiedergabe.
- source_word: ወይዕቀቡ፡ ነፍሶሙ፡ እምዝሙት
  choice: sich vor Unzucht bewahren
  rationale: Gibt das Bewahren der eigenen Person beziehungsweise Seele vor sexueller Unmoral idiomatisch wieder, ohne die Aussage unnötig einzuengen.
theological_decisions:
- issue: Verhältnis von Recht und Gerechtigkeit
  choice: „das Recht“ und „gerecht handeln“ als verwandte, aber nicht identische Ausdrücke
  alternative: Beide Stellen mit „Gerechtigkeit“ wiederzugeben
  rationale: Die unterschiedlichen ge'ezischen Begriffe werden erkennbar gehalten; so bleibt die Spannung zwischen erkannter Rechtsordnung und entsprechendem Handeln bestehen.
- issue: Segnen des Schöpfers
  choice: „den Schöpfer preisen“
  alternative: „den Schöpfer segnen“
  rationale: „Preisen“ vermittelt im heutigen Deutsch die auf Gott gerichtete Bedeutung, ohne eine konfessionelle Zusatzdeutung einzutragen.
- issue: Bewahren der Seele vor Unzucht
  choice: reflexiv als „sich vor Unzucht bewahren“
  alternative: wörtlicher „ihre Seelen vor Unzucht bewahren“
  rationale: Die natürliche deutsche Form vermeidet eine ungewollte Leib-Seele-Systematik, während der moralische Gehalt erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange ge'ezische Reihung wurde vorsichtig gegliedert. „Jahrwoche“ verdeutlicht, dass neben dem Jubiläum eine Siebenerperiode gemeint ist. Die textkritische Unsicherheit bei እንዘ wird ausdrücklich in einer Fußnote bewahrt.
