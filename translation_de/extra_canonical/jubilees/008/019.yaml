base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: de
  text: „… der HERR in der Wohnstätte Sems wohne.“[a] Und er erkannte, dass der Garten Eden das Allerheiligste und die Wohnstätte des HERRN ist, dass der Berg Sinai mitten in der Wüste liegt und der Berg Zion mitten im Nabel der Erde. Diese drei wurden als heilige Stätten geschaffen, einander gegenüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Vers beginnt mitten im Satz und setzt den Segenswunsch aus Vers 18 fort; wörtlich steht hier nur: „der HERR in der Wohnstätte Sems“.'
    reason: Die Ergänzung „wohne“ stammt syntaktisch aus dem vorangehenden Vers und muss für einen verständlichen deutschen Satz kenntlich gemacht werden.
lexical_decisions:
- source_word: ቅድስተ፡ ቅዱሳን
  choice: das Allerheiligste
  rationale: Die wörtliche Wendung „Heiliges der Heiligen“ entspricht dem etablierten deutschen Ausdruck „Allerheiligstes“.
- source_word: ማእከለ፡ ሕንብርት፡ ለምድር
  choice: mitten im Nabel der Erde
  rationale: Bewahrt sowohl die räumliche Aussage „mitten in“ als auch das konkrete und symbolisch gewichtige Bild vom „Nabel der Erde“.
- source_word: መንጸረ
  choice: einander gegenüber
  rationale: Gibt die räumliche Beziehung der drei heiligen Stätten natürlich wieder, ohne ihre genaue symbolische Anordnung weiter auszudeuten.
theological_decisions:
- issue: Der erste, verblose Satzteil gehört syntaktisch zum Segenswunsch des vorhergehenden Verses.
  choice: „… der HERR in der Wohnstätte Sems wohne.“
  alternative: „Der HERR wohnte in der Wohnstätte Sems.“
  rationale: Der überlieferte Text beginnt mit einem Fragment, das den im vorhergehenden Vers begonnenen Wunsch fortsetzt. Der deutsche Konjunktiv wahrt diesen Zusammenhang und vermeidet eine unbegründete Vergangenheitsaussage.
- issue: Bezeichnung Edens als ቅድስተ፡ ቅዱሳን
  choice: „das Allerheiligste“
  alternative: „ein Allerheiligstes“ oder „heilig unter den Heiligen“
  rationale: Der bestimmte Ausdruck bezeichnet Eden unmittelbar als den heiligsten Ort; die Übersetzung lässt diese starke kultische Aussage stehen, ohne sie konfessionell zu erklären.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die geographisch-theologische Bildsprache („Nabel der Erde“, „Allerheiligstes“) bleibt bewusst erhalten. Der Satzanfang wird mit Auslassungspunkten als Fortsetzung von Vers 18 kenntlich gemacht.
