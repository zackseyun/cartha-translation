base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: de
  text: Im neunundzwanzigsten Jubiläum[a], in der ersten Jahrwoche, in deren erstem Jahr, nahm sich Arpachschad eine Frau. Sie hieß Rasuëja und war die Tochter Susans, der Tochter Elams. Und sie gebar ihm[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende geezische Textform kann als „neunundvierzigsten“ gelesen werden; gemeint ist dem chronologischen Zusammenhang nach wahrscheinlich „neunundzwanzigsten“.
    reason: Die überlieferte bzw. gedruckte Zahlform ist textkritisch problematisch; die Übersetzung folgt der chronologisch stimmigen Lesart, legt die Abweichung aber offen.
  - marker: b
    text: Der Satz wird im folgenden Vers mit dem Kind, das sie gebar, fortgesetzt.
    reason: Erklärt den durch die Versgrenze unvollständig wirkenden Satz, ohne den Inhalt des Folgeverses einzufügen.
lexical_decisions:
- source_word: እዮቤልው
  choice: Jubiläum
  rationale: Bezeichnet hier die chronologische Jubiläumsperiode des Werkes.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Gibt die aus sieben Jahren bestehende Zeiteinheit knapp und verständlich wieder.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: nahm sich ... eine Frau
  rationale: Bewahrt die idiomatische Bedeutung der geezischen Wendung in natürlichem Deutsch.
- source_word: ራሱእያ
  choice: Rasuëja
  rationale: Transliteriert den Eigennamen und kennzeichnet durch das Trema die getrennte Aussprache der Vokale.
- source_word: ወወለደት፡ ሎቱ፡
  choice: Und sie gebar ihm
  rationale: Gibt die abschließende, im vorliegenden Vers noch unvollständige Geburtsformel wieder, ohne das erst im Folgevers genannte Kind vorwegzunehmen.
