base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/026.yaml
  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: de
  text: 'Was sie mitten auf der Erde vergossen hatten, vernichtete er alles.[a] Ich, ihr, meine Kinder, und alle, die mit uns in die Arche gegangen waren, blieben übrig. Und siehe, ich sehe eure Taten vor mir: Ihr lebt nicht in Gerechtigkeit.[b] Denn ihr habt begonnen, auf dem Weg des Verderbens[c] zu gehen. Ihr trennt euch voneinander, einer vom anderen, beneidet einander und haltet nicht zusammen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine ältere Deutung lautet: „Die mitten auf der Erde waren, vernichtete er alle.“ Das einleitende Verb bedeutet hier jedoch wahrscheinlich „was sie vergossen hatten“ und bezieht sich auf das zuvor genannte Blut.'
    reason: Bewahrt die überlieferte alternative Satzanalyse, macht aber die stärkere lexikalische Evidenz transparent.
  - marker: b
    text: 'Wörtlicher: „Ihr wandelt nicht in Gerechtigkeit.“'
    reason: Dokumentiert die traditionelle Wegmetapher hinter der natürlichen deutschen Wiedergabe.
  - marker: c
    text: Wörtlich steht „Weg“ im Singular.
    reason: Sichert die grammatische Zahl gegen die verbreitete Wiedergabe „Wege des Verderbens“.
lexical_decisions:
- source_word: ዘከዐዉ
  choice: das sie … vergossen hatten
  rationale: Das Relativverb bezeichnet hier das Vergießen beziehungsweise Ausgießen und bezieht sich im Zusammenhang auf das zuvor erwähnte Blut.
- source_word: ደምሰሰ፡ ኵሎ
  choice: da vernichtete er alles
  rationale: ደምሰሰ bedeutet vernichten oder vertilgen; ኵሎ ist neutrales „alles“, nicht „sie alle“.
- source_word: ተርፍኩ
  choice: blieb übrig
  rationale: Gibt das Überleben beziehungsweise Übrigbleiben nach der Vernichtung direkt wieder.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Bewahrt den ethisch-theologischen Leitbegriff und die Präpositionalfügung.
- source_word: በፍኖተ፡ ሙስና
  choice: auf dem Weg des Verderbens
  rationale: ፍኖት steht im Singular; „Verderben“ erfasst hier moralische Verderbtheit und deren zerstörerische Richtung.
- source_word: ትትፋለጡ
  choice: ihr trennt euch voneinander
  rationale: Das reflexiv-reziproke Verb beschreibt die zunehmende Trennung untereinander.
- source_word: ትትቃነኡ
  choice: beneidet einander
  rationale: Der reziproke Zusammenhang legt gegenseitigen Neid beziehungsweise Eifersucht nahe; „beneiden“ ist im Deutschen hier natürlicher.
- source_word: ኢትሄልዉ፡ ኅቡረ
  choice: haltet nicht zusammen
  rationale: Gibt das Nicht-zusammen-Sein idiomatisch und ohne zusätzliche institutionelle Vorstellung wieder.
theological_decisions:
- issue: Subjekt der Vernichtung
  choice: „er“ kleingeschrieben
  alternative: „Er“ als ehrendes Gottespronomen
  rationale: Der Zusammenhang identifiziert den Handelnden als Gott, doch modernes Standarddeutsch benötigt keine ehrende Großschreibung; der Ausgangstext markiert sie ebenfalls nicht eigens.
- issue: Zeitbezug des Wandels in Gerechtigkeit
  choice: „dass ihr nicht in Gerechtigkeit lebt“
  alternative: „dass ihr nicht in Gerechtigkeit gelebt habt“
  rationale: Die ge’ezische Imperfektform bezeichnet gegenwärtiges beziehungsweise fortdauerndes Verhalten, nicht einen abgeschlossenen Rückblick.
- issue: Bildsprache des Wandelns
  choice: Im ersten Glied „lebt“, im zweiten „zu gehen“
  alternative: Beide Male „wandelt/zu wandeln“
  rationale: So bleibt der Sinn natürlich verständlich, während die ausdrückliche Wegmetapher bei ፍኖት erhalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Redeform. Die einleitende Relativkonstruktion bleibt wegen des versübergreifenden Bezugs als Satzfragment erhalten. Archaisches „wandeln“ wird vermieden; die Wegmetapher bleibt im zweiten Satzteil ausdrücklich bestehen.
