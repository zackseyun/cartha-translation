  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: de
  text: 'über das ganze Land Ägypten. Ihr Vater aber glaubte ihnen nicht, denn er war wie betäubt. Als er dann die Wagen sah, die Josef geschickt hatte, lebte sein Geist wieder auf, und er sagte: »Mir genügt es, wenn Josef lebt. Ich will hinabziehen und ihn sehen, bevor ich sterbe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: er war wie betäubt
  rationale: Die Wendung beschreibt einen durch die Nachricht ausgelösten inneren Schockzustand. »Wie betäubt« ist natürliches modernes Deutsch und bewahrt die bildhafte Aussage, ohne eine medizinische Diagnose einzutragen.
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: sein Geist lebte wieder auf
  rationale: Die Formulierung gibt die Erneuerung bzw. Wiederbelebung seines inneren Lebens idiomatisch wieder und bewahrt »Geist« als Entsprechung zu መንፈስ.
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ
  choice: Mir genügt es
  rationale: Wörtlich liegt eine Aussage wie »Es ist groß/genug für mich« nahe. Im Kontext drückt sie aus, dass die Nachricht von Josefs Leben für ihn ausreicht; »Mir genügt es« ist knapp und würdevoll.
- source_word: እረድ
  choice: Ich will hinabziehen
  rationale: Das Verb bezeichnet das Hinabgehen, hier die Reise nach Ägypten. »Hinabziehen« erhält die traditionelle räumliche Perspektive und klingt in einer Reiseerzählung natürlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Vers beginnt als syntaktische Fortsetzung des vorherigen Verses mit Kleinschreibung. Die innere Erschütterung des Vaters und das anschließende Wiederaufleben seines Geistes werden anschaulich, aber nicht überdeutend wiedergegeben.
