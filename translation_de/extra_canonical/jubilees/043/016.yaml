  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
translation:
  language: de
  text: 'Und er umarmte sie um den Hals und weinte[a]. Sie aber erkannten ihn nicht und weinten ebenfalls. Und er sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage „sie erkannten ihn nicht“ kann entweder anhaltendes Erstaunen oder ein verzögertes vollständiges Erkennen widerspiegeln, als Josef sich ihnen zu erkennen gab.
    reason: alternative_reading
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳውዲሆሙ
  choice: er umarmte sie um den Hals
  rationale: Gibt die konkrete äthiopische Wendung natürlich wieder; wörtlich steht der Hals beziehungsweise Nacken der Brüder im Plural.
- source_word: ኢያእመርዎ
  choice: sie erkannten ihn nicht
  rationale: Bewahrt die ausdrückliche Verneinung des Erkennens, ohne den erzählerischen Spannungsbogen erklärend aufzulösen.
- source_word: አንከ፡ ይብከዩ
  choice: weinten ebenfalls
  rationale: Gibt die ergänzende Bedeutung von አንከ wieder und vermeidet das im Deutschen missverständliche zeitliche „dann“.
- source_word: ወይቤሎሙ
  choice: Und er sagte zu ihnen
  rationale: Formale und zugleich idiomatische Wiedergabe der einleitenden Redewendung; der Doppelpunkt wahrt den Übergang zur folgenden Rede.
theological_decisions:
- issue: Fortdauerndes Nichterkennen während Josefs Offenbarung
  choice: Die Aussage „sie erkannten ihn nicht“ bleibt uneingeschränkt im Haupttext stehen.
  alternative: Als bloßes Staunen oder verzögertes vollständiges Begreifen paraphrasieren.
  rationale: Der ge'ezische Text formuliert ausdrücklich ein Nichterkennen; eine psychologische oder harmonisierende Deutung gehört daher nur in die Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Satzverbindungen mit „und“ erhalten den schlichten Erzählrhythmus der Vorlage; der abschließende Doppelpunkt zeigt an, dass die Rede im nächsten Vers weitergeht.
