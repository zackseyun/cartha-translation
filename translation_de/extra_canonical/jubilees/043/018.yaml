lexical_decisions:
- source_word: ወዓዲ፡ ኃምስቱ፡ ዓመት፡ ሀሎ፡
  choice: Und es bleiben noch fünf Jahre
  rationale: Gibt die einleitende Aussage über die noch verbleibenden fünf Jahre vollständig und in natürlichem Deutsch wieder.
- source_word: ማእረር፡
  choice: gepflügt wird
  rationale: Bezeichnet das Pflügen beziehungsweise die Bodenbearbeitung; die unpersönliche Passivform passt zum Zusammenhang der Hungersnot.
- source_word: ፍሬ፡ ዕፅ፡
  choice: die Bäume Früchte tragen
  rationale: Gibt die Genitivverbindung ‚Frucht der Bäume‘ idiomatisch wieder, ohne die Aussage auf eine bestimmte Obstart einzuengen.
- source_word: ሐፅስ።
  choice: geerntet wird
  rationale: Bezeichnet die Ernte beziehungsweise das Einbringen der Feldfrucht und bildet den abschließenden Teil der dreifachen Negation.
