  yaml_path: translation/extra_canonical/jubilees/043/019.yaml
  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: de
  text: 'Beeilt euch und zieht hinab, ihr und eure Haushalte, damit ihr nicht durch die Hungersnot zugrunde geht und euch nicht um euren Besitz sorgen müsst. Denn zur Erhaltung[a] hat Gott mich vor euch hergesandt, damit sie am Leben bleiben.


    [a] Oder: »für einen Rest« oder »zum Überleben«.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für einen Rest« oder »zum Überleben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: Beeilt euch und zieht hinab
  rationale: Das Adverb ፍጡነ verstärkt den pluralischen Imperativ ረዱ. Die deutsche Wendung gibt sowohl die Dringlichkeit als auch die Abwärtsbewegung natürlich wieder.
- source_word: አብያቲከሙ
  choice: eure Hausgemeinschaften
  rationale: Wörtlich »eure Häuser«; gemeint sind hier die zu den Angeredeten gehörenden Haushalte beziehungsweise Hausgemeinschaften, nicht bloß Gebäude.
- source_word: ኢትትሐጐሉ
  choice: nicht ... zugrunde geht
  rationale: Das Verb bezeichnet Vernichtung oder Untergang; diese Bedeutung wird von dem folgenden Ausdruck für Sorge oder Betrübnis unterschieden.
- source_word: ኢትትከዙ
  choice: euch nicht ... sorgen müsst
  rationale: ተከዘ bezeichnet Trauer, Bekümmernis oder Sorge, nicht ein zweites Mal das Zugrundegehen. Im Zusammenhang mit dem Besitz ist »sich sorgen« idiomatisches modernes Deutsch.
- source_word: ጥዕንትከሙ
  choice: euren Besitz
  rationale: Die breite Bedeutung »Besitz, Habe, Vermögen« bleibt erhalten, ohne sie unbelegt auf eine einzelne Besitzart einzuengen.
- source_word: ለሠሪዕ
  choice: zur Erhaltung
  rationale: Die Wendung kann Bewahrung beziehungsweise Überleben und möglicherweise einen erhaltenen Rest bezeichnen. Die Haupttextwahl ist verständlich und lässt die engeren Alternativen in der Fußnote sichtbar.
- source_word: ይሕየዉ
  choice: damit sie am Leben bleiben
  rationale: 'Die Form ist dritte Person Plural im Grundstamm: »sie sollen/mögen leben«, nicht ein singularisches Kausativ »damit er euch am Leben erhält«.'
theological_decisions:
- issue: Bezug und Form von ይሕየዉ
  choice: damit sie am Leben bleiben
  alternative: damit er euch am Leben erhält
  rationale: Die pluralische Verbform wird formal gewahrt. Ihr genauer Rückbezug bleibt im Deutschen ebenso offen wie im Ausgangstext, statt die Aussage zu einer göttlichen Kausativhandlung umzuformen.
- issue: Bedeutungsbreite von ለሠሪዕ
  choice: zur Erhaltung
  alternative: für einen Rest / zum Überleben
  rationale: Die Übersetzung entscheidet nicht stillschweigend zwischen allgemeiner Bewahrung, dem Fortbestand eines Restes und Überleben; die echten lexikalischen Möglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hausgemeinschaften« vermeidet das missverständliche rein bauliche »Häuser«, während »zugrunde geht« und »sorgen müsst« die beiden unterschiedlichen Verben klar voneinander abheben. Der pluralische Schluss bleibt bewusst ohne erklärende Festlegung seines Bezugs.
