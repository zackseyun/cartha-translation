lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: Kleider zum Wechseln
  rationale: Die Wendung bezeichnet im Kontext, parallel zu Genesis 45,22, am ehesten Wechselkleider. Die natürliche Umschreibung „Kleider zum Wechseln“ gibt diesen Sinn verständlich wieder, ohne die ebenfalls möglichen Bedeutungen von ኅብር zu verschweigen.
- source_word: ብሩረ
  choice: Silber
  rationale: Das Substantiv wird ohne ergänzende Mengen- oder Münzangabe direkt mit „Silber“ wiedergegeben.
- source_word: ፈነወ
  choice: sandte
  rationale: Die Grundbedeutung „senden, schicken“ passt zum Versand der Gaben an den Vater.
