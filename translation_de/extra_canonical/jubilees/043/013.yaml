  terminology: „Sklave“ ist für die Selbstbezeichnung und das konkrete Angebot des Zurückbleibens sachgerecht und konsistent. „Junge“ und „junger Mann“ bilden die im Text vorhandene Differenz nachvollziehbar ab. „Sich für jemanden verbürgen“ und „die Schuld tragen“ treffen die juristisch-moralische Sprache des Zusammenhangs angemessen.
