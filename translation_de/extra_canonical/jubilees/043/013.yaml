base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your servant, remain alone instead of the boy as a servant to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your servant, our father. And if I do not bring him back, your servant will bear the blame before our father all our days.’
translation:
  language: de
  text: Und nun lass mich, deinen Sklaven, allein anstelle des Jungen als Sklaven meines Herrn hierbleiben; der junge Mann aber soll mit seinen Brüdern gehen. Denn ich habe mich gegenüber deinem Sklaven, unserem Vater, für ihn verbürgt. Und wenn ich ihn nicht zurückbringe, werde ich vor unserem Vater alle unsere Tage die Schuld tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte ge’ezische Text ist gedrängt und stellenweise unregelmäßig formuliert. Gemeint ist, dass Juda anstelle des Jungen zurückbleiben will und auf seine Bürgschaft gegenüber seinem Vater verweist.
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ / ገብረ
  choice: deinen Sklaven / als Sklaven
  rationale: Das Substantiv bezeichnet einen Diener oder Sklaven. Im höfischen Kontext ist es zugleich eine demütige Selbstbezeichnung; beim Angebot, anstelle des Jungen zurückzubleiben, tritt der konkrete Status als Sklave hervor. Die einheitliche Wiedergabe bewahrt diese Spannung.
- source_word: ህየንቴሁ ለሕፃን
  choice: anstelle des Jungen
  rationale: Die Wendung bezeichnet eindeutig den stellvertretenden Platz Judas anstelle des Kindes beziehungsweise Jungen.
- source_word: ወሬዛ
  choice: der junge Mann
  rationale: Das Wort bezeichnet einen Jüngling oder jungen Mann und wird zur natürlichen Unterscheidung von dem zuvor genannten »Jungen« so wiedergegeben.
- source_word: ተሀበይክዎ
  choice: ich habe mich … für ihn verbürgt
  rationale: Im Zusammenhang mit Genesis 44 ist die Bürgschaft gemeint. Diese Wiedergabe bildet Judas persönliche Verpflichtung gegenüber seinem Vater klar ab.
- source_word: ይሌብከ … ዕአቡነ
  choice: werde ich vor unserem Vater … die Schuld tragen
  rationale: Die idiomatische deutsche Formulierung bewahrt den Gedanken einer fortdauernden persönlichen Schuld gegenüber dem Vater, ohne ihn konfessionell auszudeuten.
theological_decisions:
- issue: Stellvertretendes Zurückbleiben Judas
  choice: anstelle des Jungen als Sklaven … hierbleiben
  alternative: für den Jungen Bürge bleiben
  rationale: Der überlieferte Text beschreibt nicht nur eine Bürgschaft, sondern Judas konkretes Angebot, den Platz des Jungen einzunehmen. Die Übersetzung wahrt diese stellvertretende Handlung, ohne ihr zusätzliche typologische Bedeutung beizulegen.
- issue: Dauer der Schuld
  choice: alle unsere Tage
  alternative: mein Leben lang
  rationale: Die wörtlich kollektive Formulierung des Ge’ez bleibt erhalten, auch wenn im Deutschen »mein Leben lang« idiomatischer wäre. So wird die auffällige Spannung des Textes nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung und das konkrete Angebot der Versklavung werden beide mit »Sklave« wiedergegeben. Der Satzbau wurde für heutige Leser leicht gegliedert, ohne die inhaltliche Reihenfolge oder die auffällige Schlussformulierung zu glätten.
