  source_fidelity: 'Die Übersetzung folgt dem überlieferten ge’ezischen Hauptsinn eng: Juda bietet an, anstelle des Jungen als Sklave seines Herrn zurückzubleiben, den jungen Mann mit seinen Brüdern ziehen zu lassen, verweist auf seine gegenüber dem Vater eingegangene Bürgschaft und auf die fortdauernde Schuld bei Nichtrückkehr. Das auffällige „alle unsere Tage“ bleibt zu Recht erhalten.'
