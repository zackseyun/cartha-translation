  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: de
  text: 'Und Juda sagte: „Ich bitte dich, mein Herr, lass deinen Diener bitte ein Wort vor meinem Herrn sprechen. Seine Mutter gebar deinem Diener, unserem Vater, zwei Brüder.[a] Der eine ging fort und ging verloren, und niemand hat ihn gefunden. Er allein ist von seiner Mutter übrig geblieben, und dein Diener …“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Unser Vater, dein Diener, hatte von derselben Mutter zwei Söhne.“'
    reason: Die wörtliche Syntax bezeichnet die beiden Söhne als „zwei Brüder“ und sagt, dass seine Mutter sie dem Vater gebar; die alternative Fassung macht die gemeinte Familienbeziehung im Deutschen ausdrücklich.
lexical_decisions:
- source_word: ሳዕሌየ
  choice: Ich bitte dich
  rationale: Gibt Judas ehrerbietige Bitte in natürlichem modernem Deutsch wieder.
- source_word: ክልኤተ፡ አኀወ
  choice: zwei Brüder
  rationale: Bewahrt die ausdrückliche Bezeichnung als „Brüder“ statt sie im Haupttext zu „Söhnen“ umzudeuten.
- source_word: ወፅአ፡ ወተገደፈ
  choice: ging fort und ging verloren
  rationale: Gibt sowohl das Fortgehen als auch das anschließende Verlorensein wieder, ohne den ungewissen Ausgang zu präzisieren.
- source_word: ባሕቲቱ፡ ተረፈ፡ እምእሙ
  choice: Er allein ist von seiner Mutter übrig geblieben
  rationale: Folgt der eigentümlichen, aber verständlichen Quellenformulierung und wahrt den Bezug auf die gemeinsame Mutter.
theological_decisions: []
translation_notes:
  register: Ehrerbietige, würdige Hofsprache in modernem Standarddeutsch. Die Wiederholung von „mein Herr“ und „dein Diener“ bleibt als Merkmal der Bittrede erhalten. Die Auslassungspunkte bilden den im überlieferten Versabschnitt unvollständig abbrechenden Satz nach „und dein Diener“ ab.
