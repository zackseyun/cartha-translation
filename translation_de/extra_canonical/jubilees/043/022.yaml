lexical_decisions:
- source_word: በቃለ፡ አፈ፡ ፈርዖን
  choice: auf den Befehl des Pharaos
  rationale: Die Wendung bedeutet wörtlich etwa „durch das Wort des Mundes des Pharaos“ und bezeichnet idiomatisch dessen ausdrücklichen Befehl.
- source_word: ሰረገላተ
  choice: Wagen
  rationale: Die Pluralform bezeichnet Wagen beziehungsweise Fuhrwerke; „Wagen“ ist im erzählerischen Zusammenhang natürlich und präzise.
- source_word: ስንቀ፡ ለፍኖት
  choice: Wegzehrung für die Reise
  rationale: Die Wortgruppe bezeichnet Reisevorrat beziehungsweise Proviant für den Weg; „Wegzehrung“ bewahrt den konkreten Reisesinn ohne unnötige Ergänzung.
