  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: de
  text: 'Und als sie von dort weggegangen waren, sagte Josef zu seinem Hausverwalter: »Verfolge sie, lauf ihnen nach und hol sie ein. Sag zu ihnen: ›Gutes habt ihr mir mit Bösem vergolten; ihr habt mir den silbernen Becher gestohlen, aus dem mein Herr trinkt.‹ Und bring mir ihren jüngsten Bruder zurück; bring ihn schnell her, bevor ich Gericht halte.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der letzte Satzteil ist bei dieser Verseinteilung textlich schwierig. Gemeint ist offenbar die dringende Aufforderung, den jüngsten Bruder unverzüglich zurückzubringen, bevor die Sache gerichtlich behandelt wird; die genaue Bedeutung der Wendung ist unsicher.
    reason: segmentation_note
lexical_decisions:
- source_word: ለብእሲ፡ ቤቱ
  choice: zu seinem Hausverwalter
  rationale: Wörtlich steht hier »zum Mann seines Hauses«; »Hausverwalter« gibt die Funktion in natürlichem modernem Deutsch wieder.
- source_word: ደግፎሙ፡ ሩጽ፡ ወተአንዞሙ
  choice: Verfolge sie, lauf ihnen nach und hol sie ein
  rationale: Die drei aufeinanderfolgenden Aufforderungen und ihre Dringlichkeit bleiben erhalten; ደግፎሙ wird gemäß dem Quellenbefund als »verfolge sie« verstanden.
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: Gutes habt ihr mir mit Bösem vergolten
  rationale: ህየንተ bedeutet »anstelle von/für« und leitet keine Warum-Frage ein. Die deutsche Wendung bildet den Gegensatz von Gutem und Bösem idiomatisch ab.
- source_word: ሠረቅክሙኒ
  choice: ihr habt mir … gestohlen
  rationale: Die erste Person Singular im Objekt wird ausdrücklich wiedergegeben.
- source_word: ወአገብአ፡ ሊተ፡ ለአኁሆሙ፡ ዘይንእስ
  choice: Und bring mir ihren jüngsten Bruder zurück
  rationale: Die Anweisung richtet sich an den Hausverwalter und steht außerhalb seiner an die Brüder auszurichtenden Rede; »ihren« wahrt die dritte Person des Quelltexts.
- source_word: ዘእንበለ፡ እባእ፡ ውስተ፡ ምኵናንየ
  choice: bevor ich Gericht halte
  rationale: ዘእንበለ wird temporal als »bevor« verstanden. Die wörtliche Vorstellung »in mein Gericht eintreten« wird in verständlichem Deutsch idiomatisch wiedergegeben, ohne sie zu »damit nicht« oder »es sei denn« umzudeuten.
theological_decisions:
- issue: Bedeutung der abschließenden Gerichtsformel
  choice: bevor ich Gericht halte
  alternative: bevor ich in mein Gericht eintrete
  rationale: Die natürlichere Formulierung wahrt den gerichtlichen Sinn, vermeidet jedoch, die textlich schwierige Wendung vorschnell als Urteilsfällung oder Verurteilung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Befehlsfolge ist knapp und eindringlich gehalten. Die direkte Rede an die Brüder endet nach dem Satz über den Becher, sodass die anschließende Anweisung an den Hausverwalter grammatisch klar bleibt.
