  text: '"we will be servants to our lord." And he said to them, "Not so. The man with whom I found it—he alone'
translation:
  language: de
  text: '»Wir werden unserem Herrn als Knechte dienen.« Und er sagte zu ihnen: »Nein, so soll es nicht sein. Nur der Mann, bei dem ich ihn gefunden habe,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ፡ ለእግዚእነ
  choice: Wir wollen unserem Herrn als Knechte dienen
  rationale: Die Wendung bezeichnet den Dienst in einem Abhängigkeitsverhältnis. „Als Knechte dienen“ gibt dies in natürlichem, würdigem Deutsch wieder und bewahrt den Anschluss an die Rede des vorigen Verses.
- source_word: አኮ፡ ከማሁ
  choice: Nein, so soll es nicht sein
  rationale: Die knappe Zurückweisung bedeutet wörtlich etwa „nicht so“; die gewählte Form ist im Deutschen idiomatisch und erhält den entschiedenen Ton.
- source_word: በኀበ፡ ብእሲ
  choice: der Mann, bei dem
  rationale: Die Präposition bezeichnet hier die Person, in deren Besitz beziehungsweise Nähe der Gegenstand gefunden wurde.
- source_word: ዘረከብክዎ፡ ኪያሁ
  choice: bei dem ich ihn gefunden habe
  rationale: 'ረከብክዎ ist ausdrücklich 1. Person Singular Perfekt mit Objektsuffix: „ich fand ihn“. Das maskuline Pronomen entspricht im Kontext dem Becher.'
- source_word: ባሕቲቶ
  choice: nur
  rationale: Markiert die ausschließliche Beschränkung auf diesen einen Mann; der Satz setzt im folgenden Vers weiter fort.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. „Knechte“ bewahrt das historische Abhängigkeitsverhältnis besser als das heute meist freiwillig verstandene „Diener“, ohne unnötig zu verschärfen. Das Pronomen „ihn“ richtet sich nach dem im Kontext vorausgesetzten Becher. Der Vers endet quellenbedingt mitten im Satz.
