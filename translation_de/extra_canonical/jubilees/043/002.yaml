  yaml_path: translation/extra_canonical/jubilees/043/002.yaml
  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: de
  text: 'Und er tat, wie Josef ihm gesagt hatte: Er füllte alle ihre Säcke mit Getreide und legte ihr Geld in ihre Säcke; und den Becher legte er in Benjamins Sack. Als der Morgen anbrach, zogen sie fort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕስሊሆሙ / ሐስለ
  choice: ihre Säcke / Benjamins Sack
  rationale: Die Bezeichnungen meinen hier die Behälter für das Getreide; „Sack“ ist im Deutschen natürlich und entspricht dem Erzählzusammenhang.
- source_word: ሲሊተ
  choice: Getreide
  rationale: Der Ausdruck bezeichnet Getreide beziehungsweise Korn; „Getreide“ ist im Kontext des Getreidekaufs die klare, idiomatische Wiedergabe.
- source_word: ወርቆሙ
  choice: ihr Geld
  rationale: Wörtlich kann das Wort auf „Gold“ weisen, bezeichnet im Handelszusammenhang jedoch das von den Brüdern mitgebrachte Zahlungsmittel; „Geld“ gibt die Funktion natürlich wieder.
- source_word: ኮራ
  choice: Becher
  rationale: Das Lehnwort bezeichnet hier Josefs Trinkgefäß; „Becher“ entspricht dem erzählerischen Zusammenhang und der Parallele in Genesis 44.
- source_word: ሖሩ
  choice: zogen sie fort
  rationale: Das Verb bedeutet „gehen/fortgehen“; „zogen sie fort“ passt zum Aufbruch einer Reisegruppe und wahrt den würdigen Erzählton.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Satzgliederung. Die im Ge’ez getrennten Handlungen – Säcke mit Getreide füllen und Geld hineinlegen – bleiben ausdrücklich unterschieden. „Aber“ hebt die besondere Platzierung des Bechers hervor, ohne zusätzliche Deutung einzutragen.
