base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/012.yaml
  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: de
  text: Unser Vater liebt ihn, und sein Leben ist mit dem seinen verbunden. Wenn wir nun zu deinem Diener, unserem Vater, kommen und der Junge nicht bei uns ist, wird unser Vater sterben, und wir werden ihm mit Kummer bis zum Tod zusetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und wir werden unseren Vater mit Kummer bis zum Tod bedrängen«.'
    reason: Das Verb ቀጽዐ kann je nach Kontext „bedrängen“, „zusetzen“, „züchtigen“ oder „quälen“ bedeuten. Die Alternative bewahrt diese Bandbreite, ohne die Formulierung mit Genesis 44 zu harmonisieren.
lexical_decisions:
- source_word: ያፈቅሮ
  choice: liebt ihn
  rationale: Gibt das Verb direkt und in natürlichem modernem Deutsch wieder.
- source_word: ነፍሱኒ፡ እስርት፡ እምነፍስዝ
  choice: sein Leben ist mit dessen Leben verbunden
  rationale: Bewahrt das Bild der engen Bindung beider Leben und vermeidet die im Deutschen missverständliche Folge »seinem Leben«.
- source_word: ወሬዛ
  choice: der Junge
  rationale: Das Substantiv bezeichnet hier den jungen Benjamin und wird im Bedingungssatz ausdrücklich genannt.
- source_word: ወንቀጽዕ
  choice: und wir werden … quälen
  rationale: Das Verb ቀጽዐ bedeutet bedrängen, züchtigen oder quälen; diese Wiedergabe bewahrt die vom Genesis-Paralleltext abweichende Wortwahl.
- source_word: በሐዘን፡ እስክ
  choice: vor Kummer zu Tode
  rationale: Gibt Ursache und äußerste Folge idiomatisch wieder; der am Versende überlieferte Ausdruck ist knapp beziehungsweise syntaktisch unvollständig.
theological_decisions:
- issue: Bezugswort des Verbs »wird sterben«
  choice: Das Pronomen »er« bleibt im Haupttext erhalten und bezieht sich kontextuell auf den Vater.
  alternative: »der alte Mann wird sterben«
  rationale: Im ge'ezischen Text steht nur die Verbform »er wird sterben«; ein zusätzliches Substantiv würde den Ausgangstext präzisieren, aber zugleich erweitern.
- issue: Anklang an Genesis 44,31
  choice: Die eigene Verbwahl des Jubiläenbuches wird als »quälen« wiedergegeben.
  alternative: »hinabbringen«
  rationale: Eine Harmonisierung mit dem Genesis-Paralleltext würde die lexikalische Eigenart dieses Textes verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »unser Vater« bleibt wegen ihrer rhetorischen und erzählerischen Funktion erhalten. »Dessen Leben« klärt den Bezug ohne einen Namen in den Text einzufügen.
