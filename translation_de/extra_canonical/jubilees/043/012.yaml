revisions:
- from: Unser Vater liebt ihn, und sein Leben ist mit dessen Leben verbunden. Wenn wir nun zu deinem Diener, unserem Vater, kommen und der Junge nicht bei uns ist, wird er sterben, und wir werden unseren Vater vor Kummer zu Tode quälen.[a]
  to: Unser Vater liebt ihn, und sein Leben ist mit dem seinen verbunden. Wenn wir nun zu deinem Diener, unserem Vater, kommen und der Junge nicht bei uns ist, wird unser Vater sterben, und wir werden ihm mit Kummer bis zum Tod zusetzen.[a]
  rationale: Die Revision klärt den im Deutschen sonst irreführenden Bezug des Sterbens auf den Vater und ersetzt die überstarke Formulierung „zu Tode quälen“ durch eine idiomatische Wiedergabe, die die Verbindung von Bedrängnis, Kummer und Tod bewahrt. Der Quelltext wird weder durch „hinabbringen“ harmonisiert noch durch die Bezeichnung „alter Mann“ erweitert.
