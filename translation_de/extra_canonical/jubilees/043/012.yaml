review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Bezüge des geʽezischen Textes zutreffend wieder: Der Vater liebt den Jungen, sein Leben ist mit dessen Leben verbunden, und das Fehlen des Jungen führt zum Tod des Vaters. Die Wiedergabe von ቀጽዐ darf nicht mit dem in Genesis 44 anklingenden „hinabbringen“ harmonisiert werden. „Zu Tode quälen“ ist jedoch im Deutschen zu stark und legt gezielte Folter nahe; der Text spricht davon, dem Vater durch Kummer bis zum Tod zuzusetzen bzw. ihn zu bedrängen.'
  naturalness: Der Satz „wird er sterben“ wird nach dem unmittelbar vorhergehenden Subjekt „der Junge“ im modernen Deutsch sehr wahrscheinlich auf den Jungen bezogen. Da der geʽezische Kontext den Vater meint, sollte der Vater im Deutschen ausdrücklich genannt werden. „Jemanden vor Kummer zu Tode quälen“ ist zudem semantisch und stilistisch weniger passend als „jemandem mit Kummer bis zum Tod zusetzen“.
  terminology: „Liebt“, „Leben“ und „der Junge“ sind angemessen. „Mit dem seinen verbunden“ ist eine natürliche deutsche Entsprechung für die Bindung des Lebens des Vaters an das des Jungen und hält den Bezug klar. „Mit Kummer bis zum Tod zusetzen“ wahrt die eigenständige, nicht harmonisierte Bedeutung von ቀጽዐ, ohne eine übermäßige Härte einzutragen.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „er“ in „wird er sterben“
    rationale: Im Deutschen ist „der Junge“ das nächstliegende Bezugswort. Damit kann der Satz entgegen dem Kontext und dem beabsichtigten Bezug des Quelltexts aussagen, der Junge werde sterben. Die ausdrückliche Nennung des Vaters ist zur korrekten Verständlichkeit erforderlich.
  - severity: medium
    issue: „unseren Vater vor Kummer zu Tode quälen“ überzeichnet die Aussage
    rationale: „Quälen“ kann ቀጽዐ in bestimmten Kontexten wiedergeben, aber die feste deutsche Wendung „zu Tode quälen“ suggeriert eine direkte, absichtliche Tortur. Die Konstruktion mit Kummer beschreibt besser das dem Vater durch die Handlung zugefügte Leid und die Todesfolge.
  revised_text: Unser Vater liebt ihn, und sein Leben ist mit dem seinen verbunden. Wenn wir nun zu deinem Diener, unserem Vater, kommen und der Junge nicht bei uns ist, wird unser Vater sterben, und wir werden ihm mit Kummer bis zum Tod zusetzen.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: »und wir werden unseren Vater mit Kummer bis zum Tod bedrängen«.'
    reason: Das Verb ቀጽዐ kann je nach Kontext „bedrängen“, „zusetzen“, „züchtigen“ oder „quälen“ bedeuten. Die Alternative bewahrt diese Bandbreite, ohne die Formulierung mit Genesis 44 zu harmonisieren.
  revision_rationale: Die Revision klärt den im Deutschen sonst irreführenden Bezug des Sterbens auf den Vater und ersetzt die überstarke Formulierung „zu Tode quälen“ durch eine idiomatische Wiedergabe, die die Verbindung von Bedrängnis, Kummer und Tod bewahrt. Der Quelltext wird weder durch „hinabbringen“ harmonisiert noch durch die Bezeichnung „alter Mann“ erweitert.
