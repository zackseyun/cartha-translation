  text: And he could no longer restrain himself, and told them that he was Joseph. And he spoke with them in the Hebrew language.
translation:
  language: de
  text: Da konnte er sich nicht länger zurückhalten[a] und sagte ihnen, dass er Josef war. Und er sprach mit ihnen auf Hebräisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet der überlieferte geʽezische Text: »Und er hielt sich zurück.« Die Übersetzung folgt dem Sinn des Zusammenhangs und der Parallele zu Genesis 45,1.'
    reason: Die Fußnote dokumentiert die nicht negierte Lesart des überlieferten Textes und kennzeichnet die kontextuelle Ergänzung, ohne einen Textverlust als gesichert oder wahrscheinlich zu behaupten.
lexical_decisions:
- source_word: ተዐገሦ
  choice: Da konnte er sich nicht länger zurückhalten
  rationale: Die überlieferte Form bedeutet für sich genommen »er hielt sich zurück«. Der Erzählzusammenhang — Josef gibt unmittelbar seine Identität preis — und die deutliche Parallele zu Genesis 45,1 verlangen jedoch den negierten Sinn. »Da konnte er sich nicht länger zurückhalten« gibt diesen kontextuell notwendigen Sinn in natürlichem Deutsch wieder; die Textabweichung wird in einer Fußnote offengelegt.
- source_word: ነገሮሙ
  choice: sagte ihnen
  rationale: Gibt das gewöhnliche Verb für Sagen/Mitteilen schlicht und idiomatisch wieder.
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ
  choice: auf Hebräisch
  rationale: Natürliche deutsche Wiedergabe von »in/mit der Sprache der Hebräer« ohne Bedeutungsverlust.
theological_decisions:
- issue: Fehlende Negation im überlieferten ge'ezischen Wortlaut
  choice: Den kontextuell geforderten negierten Sinn im Haupttext wiedergeben und die wörtliche Lesart in einer Fußnote dokumentieren
  alternative: »Und er hielt sich zurück«
  rationale: Die wörtliche Lesart widerspricht der unmittelbar folgenden Selbstoffenbarung und der zugrunde liegenden Szene in Genesis 45,1. Wahrscheinlich ist in der Überlieferung eine Negation ausgefallen. Die Fußnote bewahrt die textkritische Transparenz, ohne im Haupttext einen sachlich widersinnigen Ablauf zu erzeugen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »Und« im zweiten Satz wahrt den schlichten parataktischen Stil der Vorlage.
