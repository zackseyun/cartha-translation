  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: de
  text: 'Da lief er ihnen nach und richtete diese Worte an sie. Sie antworteten ihm: »Fern sei es von deinen Dienern, so etwas zu tun und aus dem Haus deines Herrn Geld oder Gold zu stehlen. Das Geld, das wir zuvor in unseren Säcken fanden, haben wir, deine Diener, aus dem Land zurückgebracht …«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሮጸ፡ ድኅሬሆሙ
  choice: lief er ihnen nach
  rationale: Gibt die Bewegungsrichtung des ge’ezischen Ausdrucks direkt und natürlich wieder.
- source_word: በከመ፡ ዝንቱ፡ ነገር
  choice: richtete diese Worte an sie
  rationale: Der Ausdruck bedeutet wörtlich etwa »gemäß diesem Wort«; im Erzählzusammenhang ist damit die zuvor vorgegebene Rede gemeint.
- source_word: ሐሰ፡ ሎሙ
  choice: Fern sei es von deinen Dienern
  rationale: Bewahrt die emphatische Zurückweisung und den würdevollen Ton der festen Wendung.
- source_word: ምነተኒ፡ ንዋየ፡ ወወርቀኒ
  choice: irgendwelchen Besitz, sei es Geld oder Gold
  rationale: ንዋይ bezeichnet Besitz, Habe, Vermögen oder Geld, nicht spezifisch Silber. Die Konstruktion mit ምነተኒ und den angefügten Partikeln wird als umfassende Formulierung wiedergegeben.
- source_word: ዘረከብነ፡ ቀዳሙ፡ ውስተ፡ አኅጢነ
  choice: Das Geld, das wir zuvor in unseren Säcken fanden
  rationale: Der Satz greift den früher in den Säcken gefundenen Geldbetrag auf; »zuvor« gibt ቀዳሙ knapp wieder.
- source_word: አበጥከ፡ ደቂቅከ፡ እምድረ
  choice: haben wir, deine Diener, aus dem Land zurückgebracht
  rationale: Der überlieferte Vers bricht nach »aus dem Land« ab; die deutsche Fassung wahrt diese offene Satzgrenze durch Auslassungspunkte.
