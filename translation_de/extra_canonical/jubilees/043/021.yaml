  text: and over all the land of Egypt. And tell my father of all my honor and of all that has been given to me."
translation:
  language: de
  text: und über das ganze Land Ägypten. Berichtet meinem Vater von all meinem Ansehen und von allem, was mir gegeben worden ist[a].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was er mir gegeben hat“; wer mit „er“ gemeint ist, wird hier nicht ausdrücklich gesagt.'
    reason: Die Fußnote bewahrt die aktive Form des Ausgangstextes und macht zugleich dessen unausgesprochenes Subjekt sichtbar, ohne es festzulegen.
lexical_decisions:
- source_word: ክብረየ
  choice: mein Ansehen
  rationale: Das Wort bezeichnet hier Josefs Ehre, Rang und gesellschaftliches Ansehen; „Ansehen“ ist in diesem Zusammenhang natürlich und vermeidet den im modernen Deutschen missverständlichen Klang von „meine Herrlichkeit“.
- source_word: ወሀበኒ
  choice: was mir gegeben worden ist
  rationale: Die passive Formulierung gibt den Sinn des ge'ezischen „(er) gab mir“ wieder, ohne den im vorliegenden Text nicht ausdrücklich genannten Geber zu bestimmen.
- source_word: ዜንውዎ፡ ለአቡየ
  choice: Berichtet meinem Vater von
  rationale: „Berichten von“ gibt die Mitteilung eines Sachverhalts idiomatisch wieder und passt zum pluralischen Imperativ.
theological_decisions:
- issue: Identität des Gebers
  choice: 'Unbestimmte Passivform: „was mir gegeben worden ist“'
  alternative: „was er mir gegeben hat“, wobei „er“ etwa auf Gott bezogen werden könnte
  rationale: Der ge'ezische Text nennt an dieser Stelle keinen ausdrücklichen Geber. Die Übersetzung soll ihn daher nicht eigenmächtig als Gott oder eine andere Person identifizieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers beginnt als Fortsetzung des vorangehenden Satzes kleingeschrieben; das abschließende Anführungszeichen zeigt das Ende der Rede. „Ansehen“ ist für gewöhnliche Leser klarer als das altertümlich oder theologisch gefärbt wirkende „Herrlichkeit“.
