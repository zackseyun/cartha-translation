  naturalness: Das Deutsch ist modern, idiomatisch und dem würdigen Erzählregister angemessen. „Berichtet ... von“ ist hier natürlich; die Kleinschreibung am Versanfang und das schließende Anführungszeichen markieren die Satz- bzw. Redefortsetzung korrekt.
  terminology: „Ansehen“ ist für Josefs Ehre, Rang und öffentliche Stellung eine treffende, moderne Wiedergabe. Die Fußnote erläutert sachgerecht, dass die aktive Form des Ausgangstextes ein nicht benanntes Subjekt enthält, ohne dieses theologisch oder erzählerisch festzulegen.
