  text: and ten donkeys carrying grain. And he sent them away. And they went up and told their father that Joseph was alive, and that he was distributing grain to all the peoples of the earth and ruling.
translation:
  language: de
  text: Und zehn Esel, die Getreide trugen. Er schickte sie fort. Sie zogen hinauf und berichteten ihrem Vater, dass Josef am Leben sei, dass er Getreide an alle Völker der Erde verteile und herrsche.
