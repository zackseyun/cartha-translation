lexical_decisions:
- source_word: ስርናየ
  choice: Getreide
  rationale: Der Begriff bezeichnet Getreide beziehungsweise Korn; „Getreide“ ist im modernen Deutschen natürlich und passt in beiden Vorkommen.
- source_word: ወፈነዎሙ
  choice: Dann ließ er sie ziehen
  rationale: Gibt das Wegsenden idiomatisch wieder, ohne ein Ziel hinzuzufügen.
- source_word: ይበፍር
  choice: verteilte
  rationale: Im Kontext bezeichnet das Verb die Ausgabe beziehungsweise Verteilung von Getreide.
- source_word: ወይኴንን
  choice: und herrschte
  rationale: Bewahrt die knappe, koordinierte Aussage des Ausgangstextes und lässt den Herrschaftsbereich unausgesprochen.
theological_decisions:
- issue: Umfang und Bezug von Josefs Herrschaft
  choice: „und herrschte“ ohne ergänztes Objekt
  alternative: „und über sie herrschte“ oder „und das Land regierte“
  rationale: Der Ausgangstext nennt nach dem Verb kein ausdrückliches Objekt. Die offene Form bewahrt diese Unbestimmtheit und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parataktische Erzählweise des Ge'ez wird weitgehend bewahrt; „Dann“ sorgt an einer Stelle für natürlichen deutschen Erzählfluss.
