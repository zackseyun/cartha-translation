  text: I will take him as a servant, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: de
  text: „Ich werde ihn als Sklaven nehmen; ihr aber zieht in Frieden nach Hause.“ Während sie nun ihr Gepäck durchsuchten, angefangen beim Ältesten und endend beim Jüngsten, wurde es im Sack Benjamins gefunden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እነሥእ፡ ገብረ
  choice: Ich werde ihn zum Sklaven nehmen
  rationale: Die Verbform ist aktiv in der 1. Person Singular („ich werde nehmen“); ገብረ bezeichnet hier einen Sklaven beziehungsweise Knecht. Die aktive Aussage wird gegen eine passive Wiedergabe bewahrt.
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: ihr aber könnt in Frieden nach Hause ziehen
  rationale: Gibt den Gegensatz zum Schicksal Benjamins sowie die idiomatische Bewegungsrichtung zu ihren Häusern in natürlichem Deutsch wieder.
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: sie ihre Sachen durchsuchten
  rationale: Der Zusammenhang verlangt das Durchsuchen ihres Besitzes beziehungsweise Gepäcks; „Sachen“ ist verständlich und schließt die Säcke ein.
- source_word: እምዘ፡ ይልህቅ፡ ቀደሙ፡ ወፈጸሙ፡ በኀበ፡ ዘይንእስ
  choice: angefangen beim Ältesten und aufgehört beim Jüngsten
  rationale: Bewahrt Reihenfolge und Endpunkt der Suche in einer natürlichen deutschen Partizipialfügung.
- source_word: ወተረክበ፡ ውስተ፡ ሐስለ፡ ብንያም
  choice: fand man ihn in Benjamins Sack
  rationale: Die unpersönliche deutsche Form entspricht dem passivischen Befund; „ihn“ nimmt den im Kontext gesuchten Gegenstand auf, ohne ihn im Vers eigens zu benennen.
theological_decisions:
- issue: Status Benjamins in Josephs Ankündigung
  choice: zum Sklaven nehmen
  alternative: zum Knecht nehmen
  rationale: „Sklave“ macht die im Text bezeichnete Unfreiheit klar und vermeidet eine verharmlosende moderne Lesart von „Knecht“. Zugleich bleibt Joseph selbst das ausdrückliche Subjekt der aktiven Verbform.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und bestimmt; der anschließende Erzählstil ist flüssig. Keine konfessionelle Auslegung wurde ergänzt.
