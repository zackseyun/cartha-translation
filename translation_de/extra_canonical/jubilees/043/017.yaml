  rationale: Der Imperativ wird direkt und idiomatisch wiedergegeben; „sondern“ macht den im Kontext naheliegenden Gegensatz deutlich.
- source_word: ወትሬእዩ
  choice: Ihr seht
  rationale: Die Imperfektform kann gegenwärtig oder zukünftig verstanden werden. Im unmittelbaren Szenario ist das Präsens am natürlichsten; die Alternative steht in Fußnote [a].
- source_word: ዘይነብብ፡ አፉየ
  choice: dass es mein Mund ist, der spricht
  rationale: Die hervorgehobene Identifikation von Josephs eigenem Mund als dem sprechenden wird bewahrt, ohne den Satz unnötig auszudeuten.
- source_word: ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: Dies ist das zweite Jahr der Hungersnot
  rationale: Die knappe Zeitangabe wird direkt und in natürlichem Deutsch wiedergegeben; die mögliche Nuance eines bereits verstrichenen zweiten Jahres wird in Fußnote [b] dokumentiert.
