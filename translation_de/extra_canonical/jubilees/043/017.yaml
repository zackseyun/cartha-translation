  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: de
  text: 'Weint nicht um mich, sondern beeilt euch und bringt meinen Vater zu mir. Ihr seht[a], dass es mein Mund ist, der spricht; auch die Augen meines Bruders Benjamin sehen es. Denn seht: Dies ist das zweite Jahr der Hungersnot.'
