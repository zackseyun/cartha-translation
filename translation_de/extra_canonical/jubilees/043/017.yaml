- source_word: ኢትብከዩ፡ ላዕሌየ
  choice: Weint nicht um mich
  rationale: Die Wendung bezeichnet das Weinen über bzw. wegen Joseph; die natürliche deutsche Entsprechung bewahrt diesen Bezug.
- source_word: ወአፍጥኑ፡ ወእምጽእዎ
