  text: his servants. Look, we are servants to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my servant, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: de
  text: 'seine Sklaven. »Sieh, wir sind die Sklaven unseres Herrn, wir und auch unsere Esel.« Josef sagte zu ihnen: »Gott bewahre, dass ich das tue![a] Ihr aber geht nach Hause; nur euer jüngster Bruder soll mein Sklave sein, denn ihr habt Böses getan. Wusstet ihr nicht, dass ein Mann mit seinem Becher sehr wohl wahrsagt, so wie ich?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die so wiedergegebene ge’ezische Wendung ist schwer verständlich und möglicherweise textlich gestört. Dem Zusammenhang nach weist Josef den Vorschlag zurück, sie alle zu Sklaven zu machen, und bestimmt stattdessen nur den jüngsten Bruder dazu.
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: Sklaven / mein Sklave
  rationale: Die Begriffe bezeichnen hier unfreie Knechte im Besitz- und Strafkontext; »Sklave« gibt die soziale Stellung deutlicher wieder als das mildere »Diener«.
- source_word: አእዱጊነ
  choice: unsere Esel
  rationale: Die ausdrückliche, ungewöhnliche Einbeziehung der Esel wird entsprechend dem ge’ezischen Text bewahrt.
- source_word: ያስተቀስም
  choice: wahrsagt
  rationale: Das Verb bezeichnet hier das Ermitteln verborgenen Wissens durch Divination; im Zusammenhang geschieht dies mittels des Bechers.
- source_word: አብያቲክሙ
  choice: nach Hause
  rationale: Wörtlich steht der Plural »eure Häuser«; idiomatisches modernes Deutsch drückt die Rückkehr mit »nach Hause« aus.
theological_decisions:
- issue: Schwierige Gottesformel in Josefs Antwort
  choice: »Gott bewahre, dass ich das tue!«
  alternative: »Gott hat [es] verhindert; ich fürchte [es].« / »Gott bewahre, dass ich mich fürchte.«
  rationale: Die ge’ezische Wortfolge ist schwierig beziehungsweise möglicherweise gestört. Der weitere Sinn ist jedoch Josefs nachdrückliche Ablehnung des Angebots, alle Brüder zu Sklaven zu machen. Die Hauptübersetzung gibt diesen Zusammenhang wieder, während die Unsicherheit in einer Fußnote offengelegt wird.
- issue: Aussage über Wahrsagung
  choice: als direkte Behauptung Josefs wiedergegeben
  alternative: als ironische oder rein fingierte Aussage markieren
  rationale: Der Text erklärt nicht, ob Josef tatsächliche Wahrsagung beansprucht, eine Rolle spielt oder die Brüder nur prüft. Die Übersetzung löst diese theologische und erzählerische Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Der Vers setzt mit dem Fragment »seine Sklaven« ein, das wegen der vorgegebenen Versgrenze erhalten bleibt. Die auffällige Aussage über die Esel und die Mehrdeutigkeit der Wahrsagungsaussage werden nicht geglättet.
