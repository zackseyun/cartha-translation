base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/009.yaml
  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: de
  text: 'Und sie kamen zu Josef, und sie alle warfen sich vor ihm nieder, mit dem Gesicht zur Erde. Josef sagte zu ihnen: »Ihr habt Böses getan.« Sie erwiderten: »Was sollen wir sagen, und wie sollen wir uns rechtfertigen? Unser Herr hat die Schuld deiner Diener aufgedeckt.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier angegebene äthiopische Wortlaut endet mit »ihre Schuld«; »deiner Diener« wird nach dem Zusammenhang und dem Paralleltext in 1. Mose 44,16 ergänzt.
    reason: Die bereitgestellte Quellzeile ist am Versende offenbar unvollständig; die Ergänzung darf nicht stillschweigend erfolgen.
lexical_decisions:
- source_word: ሰገዱ፡ ሎቱ
  choice: warfen sich vor ihm nieder
  rationale: Die Wendung bezeichnet eine ehrerbietige Prostration; zusammen mit »mit dem Gesicht zur Erde« ist diese natürliche deutsche Wiedergabe genauer als ein bloßes »verbeugten sich«.
- source_word: እኩየ፡ ገበርክሙ
  choice: Ihr habt Böses getan
  rationale: Gibt den moralischen Vorwurf knapp und unmittelbar wieder, ohne ihn inhaltlich näher zu bestimmen.
- source_word: ንትዋቀስ
  choice: uns rechtfertigen
  rationale: Im Zusammenhang geht es darum, sich vom Vorwurf zu entlasten beziehungsweise die eigene Unschuld darzutun.
- source_word: ረከበ፡ አበሳሆሙ
  choice: hat die Schuld … aufgedeckt
  rationale: Wörtlich steht »hat … gefunden«; idiomatisch ist gemeint, dass verborgene Schuld ans Licht gebracht beziehungsweise festgestellt wurde.
theological_decisions:
- issue: Bezug von »unser Herr«
  choice: Unser Herr
  alternative: unser Herr, nämlich Josef
  rationale: Die Formulierung und die Parallele zu Genesis 44,16 sprechen für Gott als Referenten. Die Großschreibung kennzeichnet dies im Deutschen, ohne den Gottesnamen in den Text einzufügen.
- issue: Possessivbezug bei »Diener«
  choice: deiner Diener
  alternative: seiner Diener
  rationale: Die überlieferte Textangabe endet bei »ihrer Schuld« und scheint verkürzt zu sein; Kontext und vollständiger Parallelwortlaut verlangen die Selbstdarstellung der Brüder gegenüber Josef als »deine Diener«. Die textliche Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »warfen sich … nieder« ist anschaulich, aber nicht altertümlich. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Satz.
