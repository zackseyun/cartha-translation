  source_fidelity: 'Der Text gibt die ge''ezischen Satzaussagen zutreffend wieder: das Kommen zu Josef, die Niederwerfung mit dem Gesicht zur Erde, Josefs knappen Vorwurf, die ratlose Gegenfrage und das Finden der Schuld durch »unseren Herrn«. »Warfen sich vor ihm nieder« trifft die Prostration angemessen. Die im bereitgestellten Quellenausschnitt nach አበሳሆሙ („ihre Schuld“) offenbar abgebrochene Ergänzung »deiner Diener« wird nicht verschwiegen, sondern sauber durch die Fußnote markiert; sie stimmt außerdem mit dem englischen Audit-Trail und dem Kontext überein.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Erzählton. »Mit dem Gesicht zur Erde«, »Böses getan« und »uns rechtfertigen« sind idiomatisch und bewahren die Knappheit der Rede.
  terminology: Josef ist die im Deutschen übliche Namensform. Die Großschreibung in »Unser Herr« ist angesichts des im Audit-Trail festgehaltenen Gottesbezugs sachgerecht, ohne eine zusätzliche dogmatische Deutung einzutragen. »Schuld ... aufgedeckt« gibt das kontextuelle Gewicht von »gefunden« verständlich wieder.
