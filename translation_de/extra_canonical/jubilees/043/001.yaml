  yaml_path: translation/extra_canonical/jubilees/043/001.yaml
  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: de
  text: 'Und Josef fasste einen Plan, mit dem er ihre Gedanken erkennen konnte: ob unter ihnen ein friedlicher Gedanke war. Und er sagte zu dem Mann, der über sein Haus gesetzt war: »Fülle alle ihre Säcke mit Getreide und lege ihnen ihr Geld wieder mitten in ihre Beutel.[a] Meinen silbernen Becher aber, den Becher, aus dem ich trinke, lege in den Sack des Jüngsten.« Dann ließ er sie ziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Gib ihnen ihr Geld zurück in die Mitte ihrer Beutel.«'
    reason: Die ge’ezische Formulierung betont das Zurückgeben und verwendet durchgehend Pluralformen; die Fußnote macht die ungewöhnliche räumliche Wendung sichtbar.
lexical_decisions:
- source_word: ወሐለየ፡ ዮሴፍ፡ ሕሊና
  choice: Und Josef fasste einen Plan
  rationale: Die Wendung verbindet das Verb des Erwägens/Planens mit »Gedanke, Plan«; die idiomatische deutsche Formulierung gibt das beabsichtigte Vorgehen wieder, ohne den folgenden Erkenntniszweck vorwegzunehmen.
- source_word: በዘ፡ ያአምር፡ ሕሊናሆሙ
  choice: durch den er ihre Gedanken erkennen könnte
  rationale: Bewahrt den Zweck bzw. die Möglichkeit des Plans und gibt ሕሊናሆሙ als »ihre Gedanken« wieder.
- source_word: ሕሊና፡ ሰላም
  choice: ein friedlicher Gedanke
  rationale: Nahe Wiedergabe der Verbindung »Gedanke des Friedens«; vermeidet eine vorschnelle Deutung als feststehende friedliche Absicht.
- source_word: አግብእ፡ ሎሙ፡ ... ወርቆሙኒ
  choice: lege ihnen ihr Geld wieder
  rationale: አግብእ bezeichnet hier das Zurückgeben bzw. Zurücklegen; die pluralischen Pronominalformen werden beibehalten.
- source_word: ማእከለ፡ መዋዲቶሙ
  choice: mitten in ihre Beutel
  rationale: Formale Wiedergabe von »in die Mitte ihrer Beutel«; »Beutel« unterscheidet die inneren Behältnisse von den zuvor genannten Säcken.
- source_word: ኮራየ፡ ... ኮራ፡ ዘብሩር
  choice: meinen silbernen Becher ... den Becher
  rationale: Gibt die wiederholte Bezeichnung des Trinkgefäßes und das Material Silber ausdrücklich wieder.
- source_word: ወፈነዎሙ
  choice: Dann ließ er sie ziehen
  rationale: Natürliches, würdevolles Deutsch für das Entlassen bzw. Fortsenden der Brüder.
theological_decisions:
- issue: Bedeutung von »Gedanke des Friedens«
  choice: wörtlich-offen als »ein friedlicher Gedanke«
  alternative: »friedliche Absichten« oder »ob sie friedlich gesinnt waren«
  rationale: Der Ausgangstext spricht von einem Gedanken des Friedens und lässt offen, ob innere Haltung, Absicht oder Eintracht gemeint ist; diese Spannung wird nicht vereindeutigt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählerischem Register. Die direkte Rede ist klar und natürlich gestaltet; die Wiederholung bei Josefs silbernem Becher sowie die Unterscheidung zwischen Säcken und Beuteln bleiben erhalten.
