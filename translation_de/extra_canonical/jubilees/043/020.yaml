  text: a numerous people. And tell my father that I am still alive, and look, you yourselves see that God has made me as a father to Pharaoh and as ruler in his house,
translation:
  language: de
  text: ein zahlreiches Volk. Sagt meinem Vater, dass ich noch lebe. Seht doch selbst, dass Gott mich dem Pharao zum Vater und zum Herrscher in seinem Haus eingesetzt hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  choice: ein zahlreiches Volk
  rationale: Gibt die wörtliche Bedeutung des fragmentarischen Versanfangs knapp und natürlich wieder.
- source_word: ዓዲ፡ ሕያው፡ አነ
  choice: dass ich noch lebe
  rationale: 'ዓዲ bezeichnet hier das Fortbestehen des Lebens: „noch/am Leben“.'
- source_word: ናሁ፡ ትሬእዩ
  choice: Seht, ihr seht selbst
  rationale: Bewahrt sowohl das aufmerksamkeitslenkende „Siehe“ als auch den ausdrücklich angesprochenen eigenen Augenschein der Brüder.
- source_word: ሠርዐኒ፡ እግዚአብሔር
  choice: dass Gott mich … eingesetzt hat
  rationale: ሠርዐ vermittelt hier das Bestellen bzw. Einsetzen in eine Stellung.
- source_word: ከመ፡ እንተ፡ አቡሁ፡ ለፈርዖን
  choice: dem Pharao zum Vater
  rationale: Erhält das ungewöhnliche, politisch-beraterische Vaterbild des Ausgangstextes, ohne es deutend abzuschwächen.
- source_word: እመብል፡ ውስተ፡ ቤቱ
  choice: zum Herrscher über sein Haus
  rationale: Gibt die Leitungsstellung idiomatisch wieder; „sein“ bezieht sich im Kontext auf den Pharao.
theological_decisions:
- issue: Göttliche Urheberschaft von Josefs Stellung
  choice: Gott hat Josef eingesetzt
  alternative: Gott hat Josef werden lassen
  rationale: Die aktive Form des Ausgangstextes stellt Gott ausdrücklich als Handelnden dar und sollte nicht abgeschwächt werden.
- issue: Josef als „Vater“ des Pharao
  choice: dem Pharao zum Vater
  alternative: zum Berater des Pharao
  rationale: Das metaphorische und theologisch spannungsreiche Vaterprädikat wird bewahrt, statt durch eine funktionale Auslegung ersetzt zu werden.
