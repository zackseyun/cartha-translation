lexical_decisions:
- source_word: ሠጠጡ
  choice: zerrissen
  rationale: Das Verb bezeichnet hier das Zerreißen der Kleidung als Ausdruck von Bestürzung oder Trauer.
- source_word: አልባሲሆሙ
  choice: ihre Gewänder
  rationale: Gibt den Plural mit Possessivsuffix natürlich und würdevoll wieder.
- source_word: ጸዐኑ፡ ዲበ፡ አእዱጊሆሙ
  choice: beluden ihre Esel
  rationale: Die wörtliche Vorstellung »luden auf ihre Esel« wird im Deutschen idiomatisch mit »beluden« ausgedrückt.
- source_word: ተመይጡ፡ ሀገረ
  choice: kehrten in die Stadt zurück
  rationale: Bewahrt sowohl die Rückkehrbewegung als auch das Ziel Stadt.
- source_word: በጽሑ፡ ቤተ
  choice: kamen zum Haus
  rationale: Gibt die abschließende Ankunftsklausel wieder, ohne das im Ausschnitt nicht näher bezeichnete Haus zu identifizieren.
