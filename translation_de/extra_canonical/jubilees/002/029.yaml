revisions:
- from: 'Ebenso sollst du den Israeliten die Bestimmung für diesen Tag verkünden und ihnen sagen: Sie sollen an ihm Sabbat halten und ihn nicht in der Verirrung ihres Herzens missachten. Sie dürfen an ihm keine Arbeit verrichten, die sich nicht gehört, nicht nach eigenem Belieben handeln, nichts zum Essen oder Trinken zubereiten, kein Wasser schöpfen und keine Last durch ihre Tore herein- oder hinaustragen, die sie nicht am sechsten Tag für sich vorbereitet haben.'
  to: 'Ebenso sollst du den Israeliten die Vorschrift für diesen Tag verkünden und ihnen sagen: Sie sollen an diesem Tag den Sabbat halten und ihn nicht in der Verirrung ihres Herzens missachten. Sie dürfen an ihm keine Arbeit verrichten, die nicht angemessen ist, nicht ihren eigenen Wünschen nachgehen, nichts zum Essen oder Trinken zubereiten, kein Wasser schöpfen und keine Last durch ihre Tore herein- oder hinaustragen, die sie nicht am sechsten Tag für sich vorbereitet haben.'
  rationale: Die Revision ist auf sichere sprachliche und semantische Präzisierungen beschränkt. Sie bewahrt „Ebenso“ für ከማሁ, lässt die offene Kategorie unangemessener Arbeit offen, gibt den Ausdruck für eigene Wünsche unmittelbarer wieder und übernimmt ausdrücklich nicht die im vorliegenden ge'ezischen Text fehlende Erweiterung „in ihren Wohnstätten“.
