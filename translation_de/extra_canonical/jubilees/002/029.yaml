base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: de
  text: 'Ebenso sollst du den Israeliten die Vorschrift für diesen Tag verkünden und ihnen sagen: Sie sollen an diesem Tag den Sabbat halten und ihn nicht in der Verirrung ihres Herzens missachten. Sie dürfen an ihm keine Arbeit verrichten, die nicht angemessen ist, nicht ihren eigenen Wünschen nachgehen, nichts zum Essen oder Trinken zubereiten, kein Wasser schöpfen und keine Last durch ihre Tore herein- oder hinaustragen, die sie nicht am sechsten Tag für sich vorbereitet haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከማሁ
  choice: Ebenso
  rationale: Gibt den vergleichenden beziehungsweise anknüpfenden Sinn „ebenso/auf gleiche Weise“ wieder und vermeidet die Abschwächung zu einem bloßen „und“.
- source_word: አይድዕ፡ ወንገር
  choice: sollst du … verkünden und ihnen sagen
  rationale: Bewahrt die beiden Aufforderungen des Ge’ez, formuliert sie aber in natürlicher deutscher Wortfolge.
- source_word: ዘዝነ፡ ለዛቲ፡ ዕለት
  choice: die Bestimmung für diesen Tag
  rationale: „Bestimmung“ gibt die rechtlich-gebotliche Bedeutung idiomatisch wieder, ohne den Ausdruck unnötig auf ein umfassendes Gesetzeswerk festzulegen.
- source_word: ወያሰንብቱ፡ ባቲ
  choice: Sie sollen an ihm Sabbat halten
  rationale: Das Verb bezeichnet das Einhalten beziehungsweise Begehen des Sabbats; „an ihm“ hält den Rückbezug auf den Tag fest.
- source_word: በስሕተት፡ ልቦሙ
  choice: in der Verirrung ihres Herzens
  rationale: Bewahrt das innere moralische Fehlgehen und die Körpermetapher des Quelltexts.
- source_word: ገቢረ፡ ግብር፡ … ዘኢይከውን
  choice: keine Arbeit verrichten, die sich nicht gehört
  rationale: Gibt die offene Bewertung „nicht passend/gehörig“ wieder, ohne eine konkrete Kategorie verbotener Arbeit einzutragen.
- source_word: ፈቃዶሙ
  choice: nach eigenem Belieben handeln
  rationale: Erfasst den Sinn des eigenen Willens oder Gefallens und lässt den genauen Umfang des Verbots offen.
- source_word: ለቀዲሐ፡ ማይ
  choice: Wasser schöpfen
  rationale: Direkte und idiomatische Entsprechung der Handlung.
- source_word: ኵሉ፡ ዘይጸውር
  choice: keine Last
  rationale: Das Ge’ez bezeichnet etwas Getragenes beziehungsweise eine Traglast; „Last“ passt zum Herein- und Hinaustragen durch Tore.
- source_word: በሰዱስ
  choice: am sechsten Tag
  rationale: Die substantivierte Ordnungszahl bezieht sich im Zusammenhang auf den sechsten Schöpfungs- beziehungsweise Wochentag.
theological_decisions:
- issue: Umfang der Sabbatverbote
  choice: Die einzelnen Tätigkeiten werden ohne zusätzliche rabbinische oder konfessionelle Kategorien wiedergegeben.
  alternative: Die Handlungen als fest umrissene halachische Arbeitsklassen erklären.
  rationale: Der Quelltext nennt konkrete Verbote, definiert aber an dieser Stelle kein späteres theologisches oder rechtliches System.
- issue: „Eigenes Belieben“ am Sabbat
  choice: Die allgemeine Formulierung bleibt bestehen.
  alternative: Sie auf Vergnügungen, Handel oder eine bestimmte Art persönlicher Tätigkeit einengen.
  rationale: Der Ausdruck ist semantisch weit; eine Konkretisierung würde die genuine Offenheit des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebotssprache. Die im gelieferten Ge’ez vor „ከማሁ“ stehenden Wörter wurden als überlappender Abschluss des vorherigen Verssegments behandelt; der für JUB 2:29 ausgewiesene und revidierte Text beginnt entsprechend mit „Ebenso“. Die Lesart „in ihren Wohnstätten“ wurde nicht aufgenommen, da sie im vorgelegten Ge’ez-Text fehlt.
