  yaml_path: translation/extra_canonical/jubilees/002/003.yaml
  text: And then we saw his works, and we blessed him and offered praise before him on account of all his works, because
translation:
  language: de
  text: Und dann sahen wir seine Werke; wir priesen ihn und brachten vor ihm Lob dar[a] wegen all seiner Werke, denn …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und priesen vor ihm«; möglich ist auch: »und priesen ihn vor ihm«.'
    reason: Die ge’ezische Formulierung enthält »vor ihm«, nennt aber beim Verb »preisen« kein ausdrückliches direktes Objekt.
lexical_decisions:
- source_word: ምግባሮ፡ / ኵሉ፡ ምግባሩ፡
  choice: seine Werke / all seine Werke
  rationale: Das Substantiv bezeichnet hier das Tun beziehungsweise dessen Hervorbringungen; im Schöpfungszusammenhang gibt »Werke« den Sinn natürlich und würdig wieder.
- source_word: ባረክናሁ፡
  choice: wir priesen ihn
  rationale: Das Verb bedeutet grundsätzlich »segnen«; wenn Menschen Gott gegenüber handeln, bezeichnet es idiomatisch das Preisen oder Lobpreisen Gottes.
- source_word: ሰብሕነ፡ ቅድሜሁ፡
  choice: brachten vor ihm Lob dar
  rationale: Die Wiedergabe erhält die lokale beziehungsweise relationale Aussage »vor ihm« und vermeidet im Deutschen die schwer verständliche Wiederholung »priesen ihn vor ihm«.
- source_word: እስመ፡
  choice: denn …
  rationale: Die begründende Konjunktion eröffnet einen Satz, der über die Versgrenze hinaus weitergeführt wird; die Auslassungspunkte kennzeichnen den unvollständigen Versschluss.
theological_decisions:
- issue: Menschen »segnen« Gott
  choice: »wir priesen ihn«
  alternative: »wir segneten ihn«
  rationale: Im Deutschen könnte »Gott segnen« missverständlich so wirken, als vermittelten Menschen Gott Segen. »Preisen« bewahrt hier die kontextuelle Bedeutung, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Objekt von »loben/preisen« in ሰብሕነ፡ ቅድሜሁ፡
  choice: »brachten vor ihm Lob dar«
  alternative: »priesen ihn vor ihm« oder »priesen vor ihm«
  rationale: Der Ausgangstext nennt bei diesem zweiten Lobverb kein ausdrücklich markiertes direktes Objekt, wohl aber »vor ihm«. Die Hauptfassung lässt diese syntaktische Offenheit bestehen und bleibt zugleich natürliches Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit »denn« abbrechende Gedankengang des Quellverses bleibt sichtbar; ein Semikolon gliedert die aufeinanderfolgenden Reaktionen der Sprecher.
