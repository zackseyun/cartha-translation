  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: de
  text: Für die Jahre. Es scheidet zwischen Licht und Finsternis und dient dem Gedeihen,[a] damit alles gedeiht, was auf der Erde hervorsprießt und wächst. Diese drei Arten schuf er am vierten Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dient der Heilung« beziehungsweise »dem Wohlergehen«. Das Wort kann ein heilsames Wirken oder ein Aufblühen und Gedeihen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: Es scheidet zwischen Licht und Finsternis
  rationale: Die Konstruktion mit ማእከለ ... ወማእከለ ist idiomatisch als »zwischen ... und ...« wiederzugeben; eine wörtliche Wiedergabe mit »Mitte« wäre im Deutschen irreführend und schwerfällig.
- source_word: ለጠዐዮ / ይጥዐይ
  choice: dient dem Gedeihen / gedeiht
  rationale: Der Wortstamm bezeichnet Wohlergehen, Gedeihen oder Heilung. Im Zusammenhang mit dem Hervorsprießen und Wachsen auf der Erde ist »Gedeihen« natürlich und bewahrt zugleich die positive, fördernde Bedeutung.
- source_word: ዘይሠርፅ፡ ወይለቍፅ
  choice: was ... hervorsprießt und wächst
  rationale: Die beiden Verben beschreiben das Sprießen und weitere Wachsen pflanzlichen Lebens; die koordinierte Wiedergabe erhält die Doppelung.
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: Diese drei Arten
  rationale: ዘመድ kann eine Art, Gattung oder Klasse bezeichnen. »Arten« ist hier knapp und bezieht sich auf die drei zuvor genannten Himmelslichter.
theological_decisions:
- issue: Bedeutung des fördernden Wirkens der Himmelslichter
  choice: dient dem Gedeihen
  alternative: dient der Heilung / dem Wohlergehen
  rationale: Der Kontext bezieht die Wirkung ausdrücklich auf alles, was auf der Erde sprießt und wächst. Die Übersetzung vermeidet sowohl eine medizinische Verengung als auch eine weitergehende kosmologische Deutung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die mit dem vorigen Vers verbundene Anfangsphrase »für die Jahre« bleibt als Satzfragment erhalten, weil auch der bereitgestellte Quellenausschnitt an dieser Stelle fortsetzt. Das Subjekt von »scheidet« ist entsprechend dem Zusammenhang singularisch wiedergegeben.
