  yaml_path: translation/extra_canonical/jubilees/002/007.yaml
  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: de
  text: an einen Ort außerhalb dieses Firmaments, und das trockene Land erschien. An jenem Tag schuf er alle Meere, jedes an seinem eigenen Sammelort, dazu alle Flüsse, die Wasseransammlungen in den Bergen und auf der ganzen Erde, alle Seen und allen Tau der Erde, den Samen, der ausgesät wird, alles, was sprosst, die fruchttragenden Bäume, die Wälder und den Garten Eden in Eden zur Freude. Alle diese vier großen Arten[a] machte er am dritten Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „alle diese vier großen Arten“ ist schwer zuzuordnen, weil die gedrängte Aufzählung Landschaftsformen, Gewässer, Pflanzenwelt und Eden miteinander verbindet. Die Zahl fasst wahrscheinlich größere Gruppen zusammen und zählt nicht jeden einzelnen genannten Gegenstand.
    reason: segmentation_note
lexical_decisions:
- source_word: ጽናዓት
  choice: Firmament
  rationale: Das Wort bezeichnet das feste Himmelsgewölbe; „Firmament“ bewahrt die antike kosmologische Bildsprache und den Anschluss an den vorangehenden Schöpfungsbericht.
- source_word: አብህርተ
  choice: Meere
  rationale: Der ge'ezische Plural wird direkt und natürlich mit „Meere“ wiedergegeben.
- source_word: ምትባኢሆሙ
  choice: jedes an seinem eigenen Sammelort
  rationale: Die Form verweist auf die jeweils gesonderten Orte des Zusammenkommens bzw. Einmündens; die Übersetzung macht die Verteilung der Meere verständlich, ohne sie mit den folgenden Wasseransammlungen gleichzusetzen.
- source_word: ምጉባኢሆሙ ለማያት
  choice: die Wasseransammlungen
  rationale: Wörtlich geht es um das Zusammenkommen bzw. die Ansammlungen der Wasser.
- source_word: አማተ
  choice: Wälder
  rationale: Der Ausdruck bezeichnet bewaldete Bestände bzw. Wälder und darf zwischen den fruchttragenden Bäumen und Eden nicht ausgelassen werden.
- source_word: ተድላ
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude, Wonne oder Ergötzen; „zur Freude“ ist würdig und verständlich, ohne den Ausdruck unnötig auszudeuten.
- source_word: ትውልደ
  choice: Arten
  rationale: Hier bezeichnet das Wort zusammenfassende Klassen oder Gattungen der geschaffenen Dinge; „Arten“ bewahrt die auffällige Kategorisierung des Ausgangstextes.
theological_decisions:
- issue: Kosmologische Bezeichnung des Himmelsgewölbes
  choice: Firmament
  alternative: Himmelsgewölbe
  rationale: „Firmament“ lässt die konkrete antike Vorstellung stehen und harmonisiert sie nicht mit moderner Kosmologie.
- issue: Zusammenfassung als vier große Arten
  choice: Die schwierige Zählung im Haupttext beibehalten und in einer Fußnote erläutern
  alternative: Die aufgezählten Dinge ausdrücklich in vier neu definierte Schöpfungsbereiche gliedern
  rationale: Der Ausgangstext nennt vier, legt die Gruppengrenzen aber nicht eindeutig offen. Eine explizite Neugliederung würde eine nicht gesicherte Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die ge'ezische Aufzählungsstruktur. Der überlieferte Versauszug setzt mitten im Satz ein; dieser fragmentarische Anfang wurde nicht durch ungesicherten Text ergänzt. Die wiederholten Verbindungen wurden leicht gegliedert, damit die lange Liste für heutige Leser verständlich bleibt.
