lexical_decisions:
- source_word: ወገብሩ፡ ከማሁ፡ ማያት፡
  choice: Und die Wasser taten so
  rationale: Gibt die Abfolge aus Verb, adverbialem Ausdruck und Subjekt in natürlichem Deutsch wieder.
- source_word: በከመ፡ ይቤሎሙ፡
  choice: wie er ihnen gesagt hatte
  rationale: Das Verb des Sagens mit pronominalem Objekt wird idiomatisch wiedergegeben; das Plusquamperfekt verdeutlicht, dass die Anweisung dem Handeln vorausging.
- source_word: ወተገብሡ፡
  choice: und sie zogen sich … zurück
  rationale: Bewahrt die Bewegung weg von einem Ort und passt als natürliches deutsches Prädikat zu den Wassern.
- source_word: እምዲበ፡ ገጸ፡ ለምድር፡
  choice: von der Oberfläche der Erde
  rationale: Gibt die räumliche Verbindung ‚von/weg von über der Fläche bzw. dem Angesicht der Erde‘ verständlich und ohne unnatürliche Präpositionshäufung wieder.
