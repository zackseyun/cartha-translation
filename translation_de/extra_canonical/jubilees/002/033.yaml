  text: and for glory above all days. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.
translation:
  language: de
  text: und zur Herrlichkeit über alle Tage hinaus. Dieses Gesetz und Zeugnis wurde den Kindern Israels als ewiges Gesetz für ihre Generationen gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: zur Herrlichkeit
  rationale: Die Präposition ለ- bezeichnet hier den Zweck bzw. die Bestimmung; „Herrlichkeit“ gibt ስብሐት in diesem feierlichen Zusammenhang angemessen wieder.
- source_word: እምኵሉ መዋዕል
  choice: über alle Tage hinaus
  rationale: Die Wendung wird möglichst nah am Wortlaut wiedergegeben, zugleich idiomatisch im Deutschen; sie bezeichnet den Vorrang bzw. die herausgehobene Stellung gegenüber allen Tagen.
- source_word: ሕግ ወስምዕ
  choice: Gesetz und Zeugnis
  rationale: Beide koordinierten Rechtsbegriffe bleiben erhalten, ohne ihre Beziehung zueinander näher festzulegen.
- source_word: ደቂቀ እስራኤል
  choice: Kinder Israels
  rationale: Die traditionelle, verständliche Bezeichnung bewahrt das genealogisch-korporative Bild des Ausgangstextes.
- source_word: ሕገ ዘለዓለም
  choice: ewiges Gesetz
  rationale: Gibt die dauerhafte Geltung des Gesetzes direkt und würdig wieder.
- source_word: ለትውልዶሙ
  choice: für ihre Generationen
  rationale: Bewahrt die knappe generationenbezogene Formulierung des Ge'ez, ohne die Reichweite durch einen zusätzlichen Ausdruck wie „hindurch“ auszuweiten.
theological_decisions:
- issue: Dauer und Adressaten des Gesetzes
  choice: „den Kindern Israels als ewiges Gesetz für ihre Generationen“
  alternative: „den Israeliten als immerwährende Vorschrift durch alle ihre Geschlechter hindurch“
  rationale: Die gewählte Fassung hält sowohl die ausdrückliche Zuordnung an Israel als auch die Aussage dauerhafter Geltung fest, ohne konfessionelle Folgerungen über andere Gemeinschaften einzutragen.
- issue: Verhältnis von „Gesetz“ und „Zeugnis“
  choice: Beide Substantive werden gleichgeordnet wiedergegeben.
  alternative: „dieses bezeugte Gesetz“
  rationale: Der Ausgangstext verbindet zwei Substantive mit „und“; eine attributive Auflösung würde die mögliche begriffliche Eigenständigkeit von „Zeugnis“ beseitigen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der Vers setzt syntaktisch mit einer Fortführung aus dem vorherigen Kontext ein; deshalb beginnt die Übersetzung bewusst mit kleingeschriebenem „und“. Die Formulierung bleibt nahe am Ge'ez, ohne die knappe Aussage interpretierend zu glätten.
