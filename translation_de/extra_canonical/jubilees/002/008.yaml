  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: de
  text: Und am vierten Tag schuf er die Sonne, den Mond und die Sterne und setzte sie an das Himmelsgewölbe, damit sie über die ganze Erde leuchten und über sie herrschen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ
  choice: schuf
  rationale: Das Verb bedeutet grundsätzlich „machen, hervorbringen“; im Schöpfungskontext ist „schuf“ die natürliche und sachlich passende deutsche Wiedergabe.
- source_word: ምጽናዓተ፡ ሰማይ
  choice: Himmelsgewölbe
  rationale: Die Verbindung bezeichnet die feste beziehungsweise gefestigte Ausdehnung des Himmels. „Himmelsgewölbe“ bewahrt das antike kosmologische Bild und klingt im modernen Deutsch würdig und verständlich.
- source_word: ያብርሁ
  choice: sie … leuchteten
  rationale: Der pluralische Ausdruck bezeichnet das Leuchten beziehungsweise Lichtgeben der zuvor genannten Himmelskörper.
- source_word: ወለኰንኖ
  choice: und über sie herrschten
  rationale: Das Verb bezeichnet Herrschaft oder Leitung; das angehängte Pronomen wird als Rückbezug auf die Erde ausdrücklich mit „sie“ wiedergegeben.
theological_decisions:
- issue: Kosmologische Bezeichnung des Firmaments
  choice: Himmelsgewölbe
  alternative: Feste des Himmels / Firmament des Himmels
  rationale: Die Übersetzung erhält die konkrete antike Vorstellung, ohne sie modern naturwissenschaftlich umzudeuten oder durch eine konfessionell geprägte Formulierung zu überfrachten.
- issue: Gegenstand der Herrschaft
  choice: über sie herrschten
  alternative: herrschten
  rationale: Das pronominale Element im äthiopischen Text wird sichtbar wiedergegeben; „sie“ bezieht sich grammatisch auf „die ganze Erde“, ohne die Art dieser Herrschaft näher auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Bildwelt der Vorlage. Das abschließende Komma bleibt erhalten, da der Vers als fortlaufender Satzteil überliefert ist. Der im bereitgestellten Quellenausschnitt vor „Und am vierten Tag“ stehende Rest von Vers 7 („Gott am dritten Tag“) wurde als Kapitelteilungsspur behandelt und nicht in Vers 8 aufgenommen.
