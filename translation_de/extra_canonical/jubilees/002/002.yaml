base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: de
  text: 'Denn am ersten Tag erschuf er die Himmel droben, die Erde und die Wasser sowie alle Geister, die vor ihm dienen: die Engel der Gegenwart, die Engel der Heiligung, die Engel des Feuergeistes, die Engel des Geistes der Wolken, der Dunkelheit, des Schnees, des Hagels und des Frostes, die Engel der Stimmen, des Donners und der Blitze, die Engel der Geister der Kälte und der Hitze, des Winters, des Frühlings, der Erntezeit und des Sommers sowie alle Geister seiner Werke im Himmel, auf der Erde, in den Meeren, in den Tiefen, in der Dunkelheit, in der Nacht, im Licht, in der Morgendämmerung und am Morgen[a] – all dies bereitete er in der Erkenntnis seines Herzens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die dichte Aufzählung ist in der äthiopischen Überlieferung stellenweise unsicher oder zusammengedrängt. Der hier zugrunde gelegte Text nennt ausdrücklich Dunkelheit, Nacht, Licht, Morgendämmerung und Morgen; andere Überlieferungen beziehungsweise ältere Wiedergaben bieten an einzelnen Stellen abweichende Reihenfolgen oder „Abend“.
    reason: textual_and_segmentation_note
lexical_decisions:
- source_word: መላእክተ ገጽ
  choice: Engel der Gegenwart
  rationale: Wörtlich liegt „Engel des Angesichts“ nahe; „der Gegenwart“ gibt die Funktion des Dienstes vor Gottes Angesicht in natürlichem Deutsch wieder, ohne eine besondere Engellehre einzutragen.
- source_word: ቅዳሴ
  choice: Heiligung
  rationale: Bewahrt den substantivischen Sinn des ge’ezischen Ausdrucks und vermeidet die glättende Umdeutung zu bloß „heiligen Engeln“.
- source_word: ቃላት
  choice: Stimmen
  rationale: Die Grundbedeutung ist „Stimmen/Laute“; der folgende Donner wird separat genannt, daher wird der Ausdruck nicht mit „Donnerschläge“ zusammengezogen.
- source_word: መጸው
  choice: Frühling
  rationale: Im jahreszeitlichen Katalog bezeichnet das Wort die auf den Winter folgende Jahreszeit; die traditionelle Reihenfolge wird beibehalten.
- source_word: ማእረር
  choice: Erntezeit
  rationale: Gibt die landwirtschaftlich bestimmte Zeitbezeichnung genauer wieder als eine zusätzliche moderne Vierjahreszeit-Kategorie.
- source_word: አእምሮ ልቡ
  choice: Erkenntnis seines Herzens
  rationale: አእምሮ bezeichnet Erkenntnis, Wissen oder Einsicht. Die Formulierung bewahrt das anthropologische Bild des Herzens als Ort des Erkennens.
theological_decisions:
- issue: Geschaffener Status der Engel und elementaren Geister
  choice: Die gesamte Aufzählung bleibt grammatisch vom Verb „erschuf“ abhängig.
  alternative: Einzelne Naturphänomene lediglich als Tätigkeitsbereiche bereits vorhandener Engel lesen.
  rationale: Der Quelltext ordnet Himmel, Erde, Wasser, Engel und Geister ausdrücklich dem Schöpfungshandeln des ersten Tages zu; diese Aussage darf nicht aus systematisch-theologischen Gründen abgeschwächt werden.
- issue: „Engel des Angesichts“ beziehungsweise „der Gegenwart“
  choice: Engel der Gegenwart
  alternative: Engel des Angesichts
  rationale: Die idiomatische Wiedergabe bezeichnet Engel, die vor Gott stehen und dienen. Sie lässt deren genaue Rangstellung offen und führt keine konfessionell geprägte Engelhierarchie ein.
- issue: Bezug von „all dies bereitete er“
  choice: Der zusammenfassende Relativsatz bezieht sich auf den gesamten vorangehenden Katalog.
  alternative: Nur Morgendämmerung und Morgen als Bezugswörter auffassen.
  rationale: Numerus und Aufbau des langen Katalogs sprechen für einen zusammenfassenden Rückbezug; die deutsche Formulierung macht diesen syntaktisch verständlich, ohne den Inhalt zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der katalogartige Satzbau des Quelltexts bleibt erkennbar, wird aber durch parallele Gliederung und einen Gedankenstrich lesbar gemacht. Naturkräfte werden nicht entmythologisiert; zugleich wird keine über den Text hinausgehende Engelhierarchie formuliert.
