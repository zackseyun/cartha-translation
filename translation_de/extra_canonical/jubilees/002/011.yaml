  source_fidelity: 'Die wesentlichen Elemente sind zutreffend wiedergegeben: die großen Seeungeheuer, ihr Ort in den Wassern, die Erstheit der Geschöpfe aus Fleisch, die sich im Wasser regenden Wesen und die fliegenden Wesen. Der Singular des ge''ezischen Demonstrativs sollte im Deutschen jedoch nicht mit dem unidiomatischen substantivierten Ausdruck „das Erste aus Fleisch“ wiedergegeben werden. „Dies war das erste Wesen aus Fleisch“ wahrt den Singular und lässt den nicht völlig eindeutigen Bezug weiterhin offen.'
  naturalness: „Denn dies war das Erste aus Fleisch“ klingt im modernen Standarddeutsch unnötig abstrakt und ist als Bezeichnung eines Lebewesens nicht idiomatisch. „Denn dies war das erste Wesen aus Fleisch“ ist klar, würdig und natürlich. Die explizite Wiedergabe der Hand-Metapher als „mit seinen Händen“ ist flüssiger als das passive „durch seine Hände“.
