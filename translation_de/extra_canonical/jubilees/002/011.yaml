  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: de
  text: Und am fünften Tag erschuf er die großen Seeungeheuer in den Tiefen der Gewässer. Denn dies[a] war das erste Wesen aus Fleisch, das er mit seinen Händen schuf, dazu alles, was sich in den Wassern regt, und alles, was fliegt—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Bezug auf die zuvor genannten Seeungeheuer: „Denn sie waren die ersten Geschöpfe aus Fleisch, die er mit seinen Händen schuf.“ Der ge’ezische Text hat hier ein Demonstrativpronomen im Singular.'
    reason: Die Anmerkung dokumentiert die mögliche kollektive Deutung des singularischen Demonstrativs, ohne den im Haupttext bewahrten Singular oder den Bezug abschließend festzulegen.
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: die großen Seeungeheuer
  rationale: Die Wendung bezeichnet große Geschöpfe des Meeres. „Seeungeheuer“ bewahrt die außergewöhnliche, urzeitliche Konnotation, ohne eine bestimmte Tierart wie Wale festzulegen.
- source_word: ማእከለ፡ ቀላያተ፡ ማያት
  choice: in den Tiefen der Gewässer
  rationale: Gibt die räumliche Vorstellung innerhalb der tiefen Wasser natürlich und würdig wieder.
- source_word: ዘሥጋ
  choice: aus Fleisch
  rationale: Bewahrt die konkrete anthropologische Kategorie des Ausgangstextes, statt sie allgemein zu „Lebewesen“ abzuschwächen.
- source_word: ኵሎ፡ ዘይትነወስ፡ ውስተ፡ ማያት
  choice: alles, was sich in den Wassern regt
  rationale: „Sich regen“ bildet die Bewegung im Wasser idiomatisch ab und wahrt zugleich den leicht formelhaften Schöpfungsstil.
- source_word: ኵሎ፡ ዘይሰርር
  choice: alles, was fliegt
  rationale: Schlichte, umfassende Wiedergabe des Partizips; der Gedankenstrich bleibt erhalten, da der überlieferte Versausschnitt syntaktisch weiterführt.
theological_decisions:
- issue: Bezug und Numerus von ዝንቱ in der Aussage über das zuerst geschaffene Fleisch
  choice: „dies war das Erste aus Fleisch“
  alternative: „sie waren die ersten Wesen aus Fleisch“
  rationale: Das Demonstrativpronomen im ge'ezischen Text steht formal im Singular. Die Übersetzung bewahrt diese Form und lässt offen, ob „dies“ die vorausgehende Schöpfungshandlung oder die kollektiv verstandenen Seeungeheuer bezeichnet, statt den Bezug durch einen pluralischen Ausdruck festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schöpfungston. Die Satzstruktur wurde behutsam gegliedert; der abschließende Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
