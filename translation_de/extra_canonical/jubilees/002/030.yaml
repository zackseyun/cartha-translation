  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: de
  text: Und an diesem Tag sollen sie von Haus zu Haus weder etwas hineinbringen noch etwas hinaustragen, denn er ist heilig und gesegnet, mehr als jeder Jubeltag der Jubeljahre.[a] An diesem Tag hielten wir im Himmel Sabbat, bevor irgendeinem Wesen aus Fleisch bekannt gemacht wurde, an ihm auf der Erde Sabbat zu halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „heilig und gesegnet, mehr als jeder Jubeltag der Jubeljahre“ ist im Ausgangstext ungewöhnlich. Sie kann als nachdrücklicher Vergleich verstanden werden, der den wöchentlichen Sabbat selbst über die höchsten Festzyklen stellt.
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡ እምቤት፡ ቤተ
  choice: von Haus zu Haus weder etwas hineinbringen noch etwas hinaustragen
  rationale: Gibt die beiden gegensätzlichen Verben und die Haus-zu-Haus-Wendung idiomatisch wieder, ohne einen nicht genannten Gegenstand näher zu bestimmen.
- source_word: ቅድስት፡ ይእቲ፡ ወቡርክት፡ ይእቲ
  choice: er ist heiliger und gesegneter
  rationale: Die prädikativen Begriffe bedeuten „heilig“ und „gesegnet“; die folgenden Vergleichswörter werden im Deutschen natürlich durch Komparative ausgedrückt.
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት
  choice: Jubeltag der Jubeljahre
  rationale: Bewahrt ausdrücklich sowohl „Jubeltag“ als auch „Jubeljahre“ und damit die emphatische, ungewöhnliche Konstruktion der Vorlage.
- source_word: አሰንበትነ
  choice: hielten wir … Sabbat
  rationale: Das Verb bezeichnet das Halten beziehungsweise Feiern des Sabbats; „Sabbat halten“ ist im Deutschen klar und quellentreu.
- source_word: ለኵሉ፡ ዘሥጋ
  choice: irgendeinem Wesen aus Fleisch
  rationale: Bewahrt die umfassende und semitisch geprägte Bezeichnung „alles/irgendetwas, was Fleisch ist“, ohne sie vorschnell auf „Menschen“ einzuengen.
theological_decisions:
- issue: Rang des Sabbats gegenüber den Jubelzyklen
  choice: „heiliger und gesegneter als jeder Jubeltag der Jubeljahre“
  alternative: „heilig und gesegnet mehr als jeder Jubeltag der Jubeljahre“
  rationale: Der deutsche Komparativ gibt den erkennbaren Vergleich natürlich wieder; die schwierige emphatische Formulierung wird in der Fußnote offengelegt, ohne daraus eine weitergehende Lehrentscheidung abzuleiten.
- issue: Himmlische Sabbatfeier vor ihrer irdischen Offenbarung
  choice: Die zeitliche Aussage wird direkt beibehalten.
  alternative: Eine symbolische oder ausschließlich menschliche Deutung
  rationale: Der Text spricht ausdrücklich von „wir“ im Himmel und von einer späteren Bekanntmachung an Wesen aus Fleisch; die Übersetzung lässt diese Aussage in ihrer eigenen Spannung stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher biblischer Begrifflichkeit. Die ungewöhnliche Jubel-Formel bleibt im Haupttext sichtbar und wird nicht durch konfessionelle Auslegung geglättet.
