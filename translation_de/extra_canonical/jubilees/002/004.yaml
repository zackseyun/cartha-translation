  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: de
  text: 'Sieben große Werke schuf er am ersten Tag. Am zweiten Tag schuf er das Himmelsgewölbe inmitten der Wasser, und an jenem Tag wurden die Wasser geteilt: Die eine Hälfte stieg nach oben, die andere stieg unter das Himmelsgewölbe hinab, das sich in der Mitte über der Oberfläche der ganzen Erde befindet.[a] Und nur dies schuf er.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die andere stieg unter das Himmelsgewölbe hinab, das sich in der Mitte über der Oberfläche der ganzen Erde befindet.“'
    reason: Die Abfolge der Ortsangaben im ge'ezischen Text lässt unterschiedliche syntaktische Gliederungen zu.
  - marker: b
    text: 'Wörtlich: „Und nur dies.“ Das Verb ist aus dem Zusammenhang ergänzt.'
    reason: Der ge'ezische Schlusssatz wiederholt das Verb nicht ausdrücklich.
lexical_decisions:
- source_word: ሰብዐተ፡ ግብረ፡ ዐበይተ
  choice: sieben große Werke
  rationale: Gibt Zahl, Substantiv und Attribut direkt und in natürlichem Deutsch wieder.
- source_word: ምጽናዓተ
  choice: Himmelsgewölbe
  rationale: Bezeichnet hier die feste Ausdehnung zwischen den Wassern. „Himmelsgewölbe“ ist im heutigen Deutsch verständlicher als das traditionsgeprägte „Feste“, ohne die antike kosmologische Vorstellung aufzulösen.
- source_word: ማያት
  choice: Wassermassen
  rationale: Der Plural wird als gegliederte Gesamtheit der Wasser wiedergegeben; „Wassermassen“ klingt im Deutschen natürlicher als der substantivierte Plural „Wasser“.
- source_word: ዐርጉ / ወረዱ
  choice: stieg nach oben / sank … hinab
  rationale: Bewahrt die gegensätzlichen Bewegungsrichtungen des Textes in idiomatischem Deutsch.
- source_word: ዲበ፡ ገጸ፡ ለኵሉ፡ ምድር
  choice: über der Oberfläche der ganzen Erde
  rationale: Gibt die räumliche Wendung „über/auf dem Angesicht der ganzen Erde“ verständlich wieder.
theological_decisions:
- issue: Kosmologische Bezeichnung der Trennschicht zwischen den Wassern
  choice: Himmelsgewölbe
  alternative: Feste
  rationale: Die Übersetzung wahrt das im Text vorausgesetzte Weltbild, verwendet aber einen heute unmittelbar verständlichen Ausdruck und deutet die Schicht nicht modern-naturwissenschaftlich um.
- issue: Fehlendes ausdrückliches Verb im Schlusssatz
  choice: „schuf er“ im Haupttext ergänzt und als Ergänzung kenntlich gemacht
  alternative: „Und nur dies.“
  rationale: Der knappe ge’ezische Ausdruck setzt das Verb aus dem Kontext voraus. Die Ergänzung ergibt einen vollständigen deutschen Satz, während die Fußnote die formale Kürze des Ausgangstextes bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Satzbezügen. Die wiederholte Schöpfungsformel „schuf er“ und die räumliche Bildsprache bleiben erhalten; schwer verständliche traditionelle Terminologie wird vermieden.
