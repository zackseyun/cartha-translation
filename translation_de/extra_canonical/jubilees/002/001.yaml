base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: de
  text: 'Und der Engel des Angesichts sagte zu Mose durch das Wort des HERRN: »Schreibe den gesamten Bericht von der Schöpfung auf: wie Gott, der HERR, in sechs Tagen alle seine Werke und alles, was er geschaffen hatte, vollendete. Am siebten Tag ruhte er, heiligte ihn für alle Zeiten und setzte ihn als Zeichen für alle ein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: Engel des Angesichts
  rationale: Formale Wiedergabe der äthiopischen Bezeichnung; sie bezeichnet den Engel der göttlichen Gegenwart und bewahrt die traditionelle Ausdrucksweise, ohne sie auszudeuten.
- source_word: በቃለ፡ እግዚአብሔር፡
  choice: durch das Wort des HERRN
  rationale: Gibt Präposition, Substantiv und Gottesbezeichnung eng wieder und lässt offen, ob das Wort als Auftrag, Vermittlung oder Ausspruch verstanden wird.
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት፡
  choice: den gesamten Bericht von der Schöpfung
  rationale: Natürliches Deutsch für die Gesamtheit der Darstellung beziehungsweise Angelegenheit der Schöpfung.
- source_word: ፈጸመ፡
  choice: vollendete
  rationale: Erfasst den Sinn von zu Ende bringen oder abschließen besser als das bloße 'beendete'.
- source_word: አዕረፈ፡
  choice: ruhte
  rationale: Entspricht der Schöpfungs- und Sabbatterminologie, ohne zusätzliche Erklärung.
- source_word: ቀደሳ፡
  choice: heiligte ihn
  rationale: Bewahrt den aktiven kultisch-theologischen Begriff des Heiligens und bezieht das Pronomen natürlich auf den siebten Tag.
- source_word: ለኵሉ፡ ዓለማት፡
  choice: für alle Zeiten
  rationale: Der Plural von 'Welt/Zeitalter' bezeichnet hier idiomatisch alle Zeitalter beziehungsweise die gesamte Dauer.
- source_word: አንበራ፡ ትእምርተ፡ ለኵሉ፡
  choice: setzte ihn als Zeichen für alle ein
  rationale: Gibt das Einsetzen als Zeichen und den abschließenden universalen Ausdruck wieder, ohne ein im Text nicht genanntes Bezugswort zu ergänzen.
theological_decisions:
- issue: Titel des Engels
  choice: Engel des Angesichts
  alternative: Engel der Gegenwart
  rationale: Die formale Wendung bewahrt das Bild des Quelltexts; 'Gegenwart' wäre erklärender und würde die mögliche Bedeutungsbreite enger festlegen.
- issue: Vermittlung der göttlichen Rede
  choice: durch das Wort des HERRN
  alternative: auf das Wort des HERRN hin
  rationale: Die gewählte Form erhält die instrumentale beziehungsweise vermittelnde Offenheit der Präposition, statt sie ausschließlich als Befehl zu bestimmen.
- issue: Bezugsgröße des abschließenden 'für alle'
  choice: für alle
  alternative: für alle seine Werke
  rationale: Der äthiopische Text nennt am Schluss kein Substantiv wie 'Werke'; die universale, aber unbestimmte Formulierung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzperiode wurde zur besseren Lesbarkeit nach 'vollendete' geteilt; die syntaktischen und theologischen Beziehungen bleiben erhalten. Die Gottesbezeichnung wird entsprechend deutscher Bibelkonvention als 'HERR' gesetzt.
