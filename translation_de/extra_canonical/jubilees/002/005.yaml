  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: de
  text: 'Dieses Werk vollbrachte er am zweiten Tag. Und am dritten Tag sprach er zu den Wassern: »Sie sollen sich von der Oberfläche der ganzen Erde an einen einzigen Ort zurückziehen, und das trockene Land soll sichtbar werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung kann auch als indirekter Befehlsbericht wiedergegeben werden: „… er gebot, dass die Wasser sich von der Oberfläche der ganzen Erde an einen einzigen Ort zurückziehen und das trockene Land sichtbar werde.“'
    reason: Bewahrt die mögliche syntaktische Auffassung als Befehlsbericht, ohne das Sichtbarwerden des trockenen Landes fälschlich als Handlung der Wasser darzustellen.
lexical_decisions:
- source_word: ገብረ፡ ገብረ
  choice: Dieses Werk vollbrachte er
  rationale: Die Wiederholung desselben Wortstamms verbindet das Substantiv „Werk“ mit dem Verb „tun/vollbringen“. „Vollbrachte“ gibt diese Verbindung in natürlichem, würdigem Deutsch wieder.
- source_word: ይቤ፡ ለማያት
  choice: sprach er zu den Wassern
  rationale: Das ge’ezische Verb bedeutet unmittelbar „sagen/sprechen“. Die Befehlswirkung ergibt sich aus den folgenden Aufforderungsformen und muss nicht durch das stärkere „befahl“ vorweggenommen werden.
- source_word: ይኅለፉ፡ እምቅድመ፡ ገጸ፡ ለኵላ፡ ምድር
  choice: Sie sollen von der Oberfläche der ganzen Erde hinweg … weichen
  rationale: Die Wendung „vor dem Angesicht der ganzen Erde“ wird als räumliche Aussage idiomatisch mit „von der Oberfläche der ganzen Erde“ wiedergegeben; „sollen … weichen“ bewahrt den auffordernden Charakter.
- source_word: ውስተ፡ መካን፡ አሐዱ
  choice: an einen einzigen Ort
  rationale: Gibt sowohl „Ort“ als auch die ausdrücklich genannte Einheit „einen/einzigen“ wieder.
- source_word: ያስተርኢ፡ የብስ
  choice: das trockene Land soll sichtbar werden
  rationale: „Sichtbar werden“ bildet die Erscheinungsbedeutung des Verbs genau ab; „das trockene Land“ ist im Deutschen klarer als das substantivierte „das Trockene“.
theological_decisions:
- issue: Art der göttlichen Anordnung am dritten Tag
  choice: Direkte Rede mit „sprach er“ und zwei Soll-Sätzen
  alternative: 'Indirekte Rede: „er befahl den Wassern … und dem trockenen Land …“'
  rationale: Die direkte Rede folgt dem ge’ezischen „er sprach zu den Wassern“ und erhält die parallelen Aufforderungen, ohne eine stärkere Befehlsformulierung einzutragen.
- issue: Bezug der zweiten Aufforderung
  choice: „das trockene Land soll sichtbar werden“ als eigenständige, parallele Aufforderung
  alternative: Die Aussage nur als Folge des Zurückweichens der Wasser auffassen
  rationale: Die parallele Verbalform lässt offen, wie Ursache und Befehl zueinander stehen, und stellt beide Vorgänge nebeneinander.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die bildhafte ge’ezische Wendung „vor dem Angesicht der ganzen Erde“ wurde räumlich und idiomatisch als „von der Oberfläche der ganzen Erde“ formuliert. Die direkte Rede wahrt die Quellsyntax und vermeidet schwerfällige deutsche Infinitivkonstruktionen.
