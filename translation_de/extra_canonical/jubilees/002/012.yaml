lexical_decisions:
- source_word: ለጥዒና
  choice: damit sie gediehen
  rationale: Das Wort bezeichnet Wohlergehen, Gesundheit oder Gedeihen. Im Zusammenhang mit Sonne, Pflanzen und Lebewesen gibt „gedeihen“ den Sinn natürlich wieder, ohne ihn auf körperliche Gesundheit zu verengen.
- source_word: ዘይሰርር
  choice: alles, was fliegt
  rationale: Das Verb ሰረረ bezeichnet Fliegen; die später genannte Kategorie dessen, was sich bewegt, ist davon zu unterscheiden.
- source_word: አስለጦ
  choice: gab ihnen Herrschaft
  rationale: Die Form bezeichnet das Einsetzen in Gewalt beziehungsweise Herrschaft. „Herrschaft geben“ bewahrt die sachliche Aussage und den Bezug zur Schöpfungserzählung.
- source_word: ዘመደ
  choice: Arten
  rationale: Im Schöpfungskatalog bezeichnet das Wort Gruppen oder Gattungen. Das allgemein verständliche „Arten“ erhält die wiederholte Zählstruktur.
- source_word: ዕለተ፡ ሰንበታት
  choice: Sabbattag
  rationale: Die feste kultische Bezeichnung wird mit dem im Deutschen etablierten „Sabbat“ wiedergegeben.
- source_word: ናዕንብት
  choice: Sabbat halten
  rationale: Die Form meint hier die Sabbatbeobachtung beziehungsweise Sabbatruhe; „Sabbat halten“ umfasst beides und passt zur wiederkehrenden theologischen Aussage.
- source_word: እፈልጥ
  choice: werde ... aussondern
  rationale: Im Kontext der Erwählung eines Volkes aus allen Völkern bezeichnet das Verb unterscheidendes Absondern. Die Übersetzung vermeidet eine bloß erkenntnisbezogene Wiedergabe.
- source_word: ፈቃደቲሁ
  choice: seinen Willen
  rationale: Das Substantiv bezeichnet Willen oder Wohlgefallen, nicht Gebote. Die personifizierte Aussage vom Aufsteigen als Duft wird beibehalten.
- source_word: አርእስተ፡ ሰብእ
  choice: Häupter der Menschheit
  rationale: Die wörtliche Metapher „Häupter“ wird wegen der symbolischen Entsprechung zur Zahl der Schöpfungsarten bewahrt.
