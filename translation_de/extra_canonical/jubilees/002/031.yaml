base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: de
  text: Und der Schöpfer von allem segnete ihn[a]; doch er heiligte nicht alle Völker und Nationen dazu, an ihm Sabbat zu halten. Israel allein – ihm allein gewährte er, auf der Erde an ihm zu essen und zu trinken und Sabbat zu halten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Text sagt, dass der Schöpfer den Tag segnete, aber nicht alle Völker dazu heiligte, an ihm Sabbat zu halten. Diese geheiligte irdische Sabbatbeobachtung wird allein Israel zugewiesen; die Aussage betrifft somit die Erwählung im Blick auf die heilige Zeit.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: „ihm allein gab er zu essen und zu trinken“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ፈጣሪ፡ ኵሉ
  choice: der Schöpfer von allem
  rationale: Gibt die genitivische Wendung wörtlich und zugleich natürlich wieder.
- source_word: ለአሰንብቶ፡ ባቲ
  choice: an ihm Sabbat zu halten
  rationale: Bewahrt den ausdrücklichen Bezug auf den gesegneten Tag und gibt das Verb für die Sabbatruhe idiomatisch wieder.
- source_word: ወሀበ
  choice: gewährte er
  rationale: Im Zusammenhang bezeichnet das Verb die Gewährung eines Vorrechts; „gab er zu essen“ könnte im Deutschen irreführend nach einer Speisung klingen.
- source_word: ይብላዕ፡ ወይስተይ
  choice: zu essen und zu trinken
  rationale: Entspricht der konkreten, parallelen Formulierung des Ausgangstextes, ohne sie als bloße Metapher umzudeuten.
theological_decisions:
- issue: Heiligung Israels für die Sabbatbeobachtung
  choice: Die ausschließliche Zuweisung an Israel bleibt ausdrücklich stehen.
  alternative: Die Aussage allgemein als universale Sabbatheiligung oder nur als ethnische Randbemerkung wiederzugeben.
  rationale: Der Text verbindet Erwählung mit geheiligter Zeit und grenzt Israels irdische Sabbatbeobachtung ausdrücklich von den übrigen Völkern ab.
- issue: Bedeutung von „gewähren/geben“
  choice: „gewährte“ bezeichnet ein verliehenes Vorrecht, ohne den Inhalt weiter dogmatisch zu bestimmen.
  alternative: „erlaubte“ oder das wörtlichere „gab“.
  rationale: „Gewährte“ wahrt sowohl den Gabecharakter als auch den Sinn einer verliehenen Befugnis und vermeidet die Vorstellung, Gott habe lediglich Speise ausgeteilt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das maskuline Pronomen „ihn/ihm“ bezieht sich auf den zuvor genannten Sabbattag. Der Gedankenstrich hebt die im Ausgangstext betonte Ausschließlichkeit Israels hervor.
