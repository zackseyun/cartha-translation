  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: de
  text: 'über Tag und Nacht und um Licht und Finsternis voneinander zu scheiden. Und Gott setzte die Sonne als großes Zeichen auf der Erde ein: für die Tage und die Sabbate, für die Monate und die Feste, für die Jahre und die Sabbatjahre, für die Jubiläen und für alle Zeiten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለፈሊጥ፡ ማዕከለ፡ ብርሃን፡ ወጽልመት
  choice: und um Licht und Finsternis voneinander zu scheiden
  rationale: Gibt die Zweckkonstruktion und das räumlich formulierte »zwischen« idiomatisch wieder, ohne die Aussage zu erweitern.
- source_word: ወወሀበ፡ እግዚአብሔር፡ ፀሐየ
  choice: Und Gott setzte die Sonne … ein
  rationale: Das Verb bedeutet wörtlich »gab«; im Zusammenhang bezeichnet es die Zuweisung einer Funktion. »setzte … ein« ist im Deutschen natürlich und wahrt diesen Sinn.
- source_word: ለበዓላት
  choice: für die Feste
  rationale: Das Substantiv bezeichnet Feste bzw. Festzeiten. Die konkrete Wiedergabe folgt dem ge'ezischen Text genauer als das allgemeinere »festgesetzte Zeiten«.
- source_word: ለሰንበታት፡ ዓመታት
  choice: für die Sabbatjahre
  rationale: Die wörtliche Verbindung »Sabbate der Jahre« wird mit dem etablierten, verständlichen deutschen Ausdruck wiedergegeben.
- source_word: ለኵሉ፡ ጊዜ
  choice: für alle Zeiten
  rationale: Entspricht »für alle/ jede Zeit« und vermeidet den nicht ausdrücklich belegten Zusatz »der Jahre«.
theological_decisions:
- issue: Funktion der Sonne als Zeichen
  choice: als großes Zeichen über der Erde
  alternative: zum großen Zeichen auf der Erde
  rationale: Die Formulierung hält sowohl die Zeichenfunktion als auch die räumliche Angabe eng am Quelltext, ohne eine weitergehende kultische oder astrologische Deutung einzutragen.
- issue: Bezeichnung der Jubiläumsperioden
  choice: Jubiläen
  alternative: Jubeljahre
  rationale: »Jubiläen« wahrt die im Jubiläenbuch wichtige Bezeichnung zyklischer Zeitabschnitte; »Jubeljahre« wäre ebenfalls möglich, könnte die Perioden aber stärker auf einzelne Jahre verengen.
translation_notes:
  register: Moderner, würdiger Standardstil. Der Satz beginnt als Fortsetzung des vorausgehenden Verskontexts bewusst mit »über Tag und Nacht«. Die Aufzählung bleibt rhythmisch und quellenah; keine konfessionell geprägte Terminologie wurde hinzugefügt.
