translation:
  language: de
  text: an ihm, auf der Erde. Und der Schöpfer von allem segnete ihn, er, der diesen Tag zum Segen und zur Heiligkeit geschaffen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und der Schöpfer von allem segnete diesen Tag, den er zum Segen und zur Heiligkeit geschaffen hat.«'
    reason: Die ge'ezische Syntax lässt auch eine flüssigere Zusammenziehung des pronominalen Objekts mit dem folgenden Relativsatz zu.
lexical_decisions:
- source_word: ባቲ፡ በዲበ፡ ምድር
  choice: an ihm auf der Erde
  rationale: Die feminine ge'ezische Pronominalform verweist im Zusammenhang wahrscheinlich auf den grammatisch femininen »Tag«; im Deutschen verlangt »Tag« das maskuline Pronomen. »Auf der Erde« gibt በዲበ፡ ምድር natürlich wieder.
- source_word: ፈጣሪ፡ ኵሉ
  choice: der Schöpfer von allem
  rationale: Bewahrt die umfassende Aussage des Ge'ez und klingt im modernen Standarddeutsch natürlicher als »der Schöpfer alles«.
- source_word: ባረካ
  choice: segnete
  rationale: Direkte und kontextgemäße Wiedergabe des Verbs.
- source_word: ለበረከት፡ ወለቅድሳት
  choice: zum Segen und zur Heiligung
  rationale: Gibt die parallelen Zweckbestimmungen wieder; »Heiligung« bewahrt gegenüber dem statischen »Heiligkeit« den möglichen Vorgangs- und Bestimmungscharakter.
theological_decisions:
- issue: Bezug des Objekts von »segnete« und Anschluss des Relativsatzes
  choice: »segnete ihn – er, der diesen Tag … geschaffen hatte«
  alternative: »segnete diesen Tag, den er zum Segen und zur Heiligung geschaffen hatte«
  rationale: Die Hauptfassung folgt der ge'ezischen Abfolge mit pronominalem Objekt und anschließendem Relativsatz, ohne beide syntaktisch zu verschmelzen. Die flüssigere alternative Analyse bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anschluss am Versanfang wird beibehalten, da der Quelltext mit einer an den vorherigen Zusammenhang gebundenen Präpositionalphrase einsetzt.
