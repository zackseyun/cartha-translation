base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/031.yaml
  text: 'And I also command you, my sons, according to the command that Enoch gave to his son in the first jubilees, while he was still alive in the seventh generation: he commanded and testified to his son and to his sons'' sons until the day of his death.'
translation:
  language: de
  text: Auch ich gebiete euch, meine Söhne, wie Henoch seinem Sohn in den ersten Jubiläen geboten hatte. Als er noch in der siebten Generation lebte, gebot er seinem Sohn und dessen Söhnen und bezeugte es ihnen bis zum Tag seines Todes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኤዝዘክሙ (ʾəʾezzäkkəmu)
  choice: ich gebiete euch
  rationale: Gibt die direkte, autoritative Redeform des Verbs natürlich und würdig wieder.
- source_word: ውሉድየ (wəlludəya)
  choice: meine Söhne
  rationale: Im familiären Anredekontext ist „meine Söhne“ die natürliche deutsche Wiedergabe; zugleich entspricht sie der konsultierten englischen Fassung.
- source_word: በቅድሜ፡ ኢዮቤልውሳት
  choice: in den ersten Jubiläen
  rationale: Bewahrt den Plural „Jubiläen“ und die zeitliche Einordnung, ohne die schwer bestimmbare Chronologie weiter auszudeuten.
- source_word: ውስተ፡ ትዝምዱ፡ ሳባስ
  choice: als Siebter seiner Generation
  rationale: Gibt die Stellung Henochs in der siebten Generation knapp wieder und vermeidet die missverständliche Aussage, er habe innerhalb einer Generation den siebten Rang eingenommen.
- source_word: ወአስምዐ (wä-ʾasməʿa)
  choice: legte ihnen eindringlich Zeugnis ab
  rationale: Das kausative Verb bezeichnet ein Bezeugen bzw. feierliches Einschärfen; die Formulierung erhält beide Bedeutungsanteile.
- source_word: ለውሉደ፡ ውሉዱ
  choice: den Söhnen seines Sohnes
  rationale: Folgt der konkreten genealogischen Formulierung des Ge’ez, statt sie zum allgemeineren „Nachkommen“ zu glätten.
theological_decisions:
- issue: Henochs Stellung als „Siebter“
  choice: als Siebter seiner Generation
  alternative: in der siebten Generation
  rationale: Die gewählte Form bewahrt den Bezug auf Henoch als den Siebten, ohne daraus eine zusätzliche heilsgeschichtliche Deutung abzuleiten.
- issue: Bedeutung von „Zeugnis ablegen“ im Mahnkontext
  choice: legte ihnen eindringlich Zeugnis ab
  alternative: ermahnte sie
  rationale: „Ermahnte“ wäre flüssiger, würde aber den Zeugnischarakter des Quellverbs beseitigen; die gewählte Fassung hält beides zusammen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholungen von „gebot“ und „Sohn“ bleiben erhalten, weil sie die formelhafte genealogische Struktur und den autoritativen Ton des Ausgangstextes tragen.
