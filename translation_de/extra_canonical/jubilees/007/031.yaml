  terminology: »Jubiläen«, »Henoch«, »meine Söhne« und »gebiete« sind angemessen. Für das feierliche Bezeugen ist »schärfte ... eindringlich ein« in modernem Deutsch natürlich, sollte aber den Zeugnisaspekt nicht ersatzlos verdecken; »bezeugte« bewahrt ihn unmittelbar.
