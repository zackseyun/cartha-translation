  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: de
  text: Und er freute sich und trank zusammen mit seinen Söhnen voller Freude von diesem Wein. Als es Abend geworden war, ging er in sein Zelt, legte sich betrunken nieder und schlief. Während er schlief, war er in seinem Zelt entblößt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ / በፍሥሓ
  choice: freute sich / mit Freude
  rationale: Gibt die wiederholte Wortwurzel für Freude im Ge’ez wieder, ohne die Wiederholung künstlich zu glätten.
- source_word: ሰትየ፡ እም ... ወይነ
  choice: trank von diesem Wein
  rationale: Bewahrt die partitive Bedeutung der Präposition und den Rückverweis auf den genannten Wein.
- source_word: ሰቀላሁ
  choice: sein Zelt
  rationale: Im Erzählzusammenhang bezeichnet das Wort die Wohnstätte beziehungsweise das Zelt; die etablierte und natürliche deutsche Wiedergabe lautet hier „Zelt“.
- source_word: ስኩሩ
  choice: betrunken
  rationale: Bezeichnet den durch Wein verursachten Rauschzustand und wird im Deutschen direkt und wertungsneutral wiedergegeben.
- source_word: ተከሥተ
  choice: war ... entblößt
  rationale: Bewahrt die passive beziehungsweise zuständliche Aussage, ohne ausdrücklich festzulegen, ob er sich selbst entblößte oder von jemand anderem entblößt wurde.
theological_decisions:
- issue: Verantwortlichkeit für die Entblößung
  choice: „war er ... entblößt“
  alternative: „entblößte er sich“
  rationale: Die Formulierung hält die im Quelltext angelegte Unbestimmtheit über den Handelnden offen und vermeidet eine interpretierende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzfolge und Wiederholungen des Ge’ez. Der lange Ausgangssatz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; keine Fußnoten erforderlich.
