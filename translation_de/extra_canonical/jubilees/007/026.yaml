  yaml_path: translation/extra_canonical/jubilees/007/026.yaml
  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: de
  text: 'das sie mitten auf der Erde vergossen hatten. Er vernichtete alles; ich und ihr, meine Kinder, und alle, die mit uns in die Arche hineingegangen waren, blieben übrig. Und siehe, ich sehe eure Taten vor mir: Ihr wandelt nicht in Gerechtigkeit. Denn ihr habt begonnen, auf den Wegen des Verderbens zu gehen; ihr trennt euch voneinander, jeder von seinem Nächsten, und ihr werdet gegeneinander kämpfen und nicht vereint sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘከዐዉ
  choice: das sie … vergossen hatten
  rationale: Das Relativpronomen nimmt das Blut aus dem vorhergehenden Vers auf; das Verb bezeichnet hier das Ausgießen beziehungsweise Vergießen.
- source_word: ደምሰሰ፡ ኵሎ
  choice: Er vernichtete alles
  rationale: Gibt sowohl das Verb im Singular als auch ኵሎ („alles“) wieder und trennt den Satz von der vorangehenden Relativkonstruktion.
- source_word: ወተርፍኩ
  choice: blieben übrig
  rationale: Bewahrt den Gedanken des Überlebens beziehungsweise Übrigbleibens nach der Vernichtung.
- source_word: ዘተሐውሩ፡ በጽድቅ
  choice: Ihr wandelt nicht in Gerechtigkeit
  rationale: Erhält das wiederkehrende Weg- und Wandelbild des Ausgangstextes in würdigem, verständlichem Deutsch.
- source_word: በፍኖተ፡ ሙስና
  choice: auf den Wegen des Verderbens
  rationale: Gibt den Plural „Wege/Pfade“ und den moralischen Sinn von ሙስና wieder, ohne ihn konfessionell einzuengen.
- source_word: ወትትፋለጡ፡ አሐዱ፡ አሐዱ፡ እም ቢጹ
  choice: ihr trennt euch voneinander, jeder von seinem Nächsten
  rationale: Das Verb bezeichnet Trennung oder Auseinandergehen; እም bedeutet „von“, und ቢጽ kann den Nächsten, Gefährten oder Mitmenschen bezeichnen.
- source_word: ኢትሄልዉ፡ ኅቡረ
  choice: nicht vereint sein
  rationale: Spiegelt die ausdrückliche Verneinung gemeinsamer Einheit knapp und direkt.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Das traditionelle Bild „in Gerechtigkeit wandeln“ und die parallelen „Wege des Verderbens“ bleiben erhalten. Die fehlerhafte ältere Alternative, wonach die Mitte der Erde vernichtet worden sei, wurde nicht als Fußnote übernommen, da die ge’ezische Syntax das Vergießen inmitten der Erde und anschließend die Vernichtung von allem bezeichnet.
