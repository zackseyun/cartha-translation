  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: de
  text: Und er bewahrte seine Früchte auf und sammelte sie in jenem Jahr im siebten Monat ein. Daraus machte er Wein, füllte ihn in ein Gefäß und bewahrte ihn bis zum fünften Jahr auf, bis zum ersten Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte Text dieses Verses endet mit „bis zum ersten Tag“. Die nähere Monatsangabe beginnt erst im folgenden Vers.
    reason: Die Fußnote erklärt die auffällige, aber quellengerechte Versgrenze und verhindert eine unbelegte Ergänzung.
lexical_decisions:
- source_word: ዐቀበ (ʿaqaba)
  choice: bewahrte … auf
  rationale: Gibt das wiederholte Bewahren bzw. Aufbewahren der Früchte und später des Weins natürlich und quellennah wieder.
- source_word: ቀሰሞ (qasamo)
  choice: sammelte … ein
  rationale: Bezeichnet hier das Einsammeln bzw. Ernten der Früchte; „einsammeln“ wahrt die Grundbedeutung, ohne den Vorgang unnötig zu spezifizieren.
- source_word: ገብረ እም … ወይነ (gabra ʾəm … wayna)
  choice: Daraus machte er Wein
  rationale: Natürliche deutsche Wiedergabe der Konstruktion „er machte daraus Wein“.
- source_word: ወደየ ውስተ ንዋይ (wadaya wəsta nəway)
  choice: füllte ihn in ein Gefäß
  rationale: Im Zusammenhang mit Wein ist „füllen“ idiomatischer als das wörtlichere „hineinlegen“, während „Gefäß“ die unspezifische Behälterbezeichnung erhält.
theological_decisions:
- issue: Bezug von „seine Früchte“
  choice: Das Possessivpronomen bleibt entsprechend der Quelle stehen.
  alternative: Explizite Nennung des Weinbergs oder Weinstocks
  rationale: Der unmittelbare Vers setzt den Bezugsgegenstand voraus; eine ausdrückliche Ergänzung würde mehr festlegen, als der vorgelegte Text sagt.
- issue: Schlussangabe „bis zum ersten Tag“
  choice: Die unvollständig wirkende Zeitangabe wird unverändert als Versschluss bewahrt.
  alternative: „bis zum ersten Tag des ersten Monats“
  rationale: „Des ersten Monats“ steht nicht im vorgelegten Text dieses Verses und darf nicht stillschweigend aus dem folgenden Vers ergänzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Geʽez, während „einsammeln“ und „in ein Gefäß füllen“ für heutige Leser natürlich formuliert sind.
