translation:
  language: de
  text: 'Und dies sind die Söhne Sems: Elam, Assur, Arpachschad – dieser wurde zwei Jahre nach der Sintflut geboren – sowie Lud und Aram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: die Söhne Sems
  rationale: Die Status-constructus-Verbindung bezeichnet Sems männliche Nachkommen; im unmittelbaren genealogischen Zusammenhang ist „Söhne“ die natürliche und genaue Wiedergabe.
- source_word: ዝንቱ፡ ትውልደ
  choice: dieser wurde geboren
  rationale: Das Demonstrativpronomen im Singular bezieht sich auf den unmittelbar zuvor genannten Arpachschad; die Form bezeichnet hier seine Geburt und nicht eine „Generation“.
- source_word: አይኅ
  choice: Sintflut
  rationale: Das Wort bezeichnet in diesem erzählerischen Zusammenhang die große Flut der Noahüberlieferung; „Sintflut“ ist die geläufige, würdige deutsche Bezeichnung.
theological_decisions:
- issue: Bezugswort der Geburtsnotiz
  choice: 'Die Notiz wird ausdrücklich auf Arpachschad bezogen: „dieser wurde … geboren“.'
  alternative: „Diese Generation wurde … geboren.“
  rationale: Grammatik und Wortfolge weisen auf den einzelnen unmittelbar zuvor genannten Sohn; zugleich stimmt diese Lesart mit der chronologischen Angabe zu Arpachschads Geburt überein.
