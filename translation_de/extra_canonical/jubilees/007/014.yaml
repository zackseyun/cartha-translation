- source_word: ወሐነጸ፡ ሎቱ፡ ውእቱሂ፡ ሀገረ
  choice: Auch er baute sich eine Stadt
  rationale: Gibt sowohl das rückbezügliche »für sich« als auch das hervorhebende »auch er« natürlich und quellennah wieder.
- source_word: ወሰመየ፡ ስማ፡ በስመ፡ ብእሲቱ
  choice: und benannte sie nach seiner Frau
  rationale: Die wörtliche Wendung »nannte ihren Namen nach dem Namen seiner Frau« wird idiomatisch wiedergegeben, ohne ihren Sinn zu verändern.
