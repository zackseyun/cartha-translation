translation:
  language: de
  text: Gott schenke Jafet weiten Raum, und Gott wohne in den Wohnstätten Sems; und Kanaan sei sein Diener.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያስፋሕ (yāsfaḥ)
  choice: mache … weiten Raum
  rationale: Gibt den Kausativgedanken „weit machen/erweitern“ natürlich wieder und bewahrt das Wortspiel mit dem Namen Jafet, soweit es im Deutschen möglich ist.
- source_word: እግዚአብሔር (ʾEgziʾabḥēr)
  choice: Gott
  rationale: Die äthiopische Vorlage bezeichnet hier Gott und bietet keinen Grund für die Wiedergabe mit dem Gottesnamen oder „der HERR“.
- source_word: ማኅደሪ (maḥdari)
  choice: Wohnstätten
  rationale: Entspricht dem konkreten Sinn „Wohnorte/Behausungen“ und wahrt den Plural der Vorlage.
- source_word: ገብሮ (gabro)
  choice: sein Diener
  rationale: Gibt das singularische Possessivverhältnis der Vorlage wieder; „Diener“ ist im Deutschen würdig und semantisch offen genug für den hierarchischen Dienststatus.
theological_decisions:
- issue: Bezug des Possessivpronomens in „sein Diener“
  choice: Das singularische und mehrdeutige „sein“ wird beibehalten.
  alternative: „ihr Diener“ oder eine ausdrückliche Zuordnung zu Jafet beziehungsweise Sem
  rationale: Die Vorlage hat ein singularisches Possessivsuffix, dessen Bezug im Satz nicht völlig eindeutig ist. Eine explizite Zuordnung würde die echte syntaktische Mehrdeutigkeit auflösen.
- issue: Subjekt des Wohnens
  choice: „Gott wohne“
  alternative: Jafet wohne in den Wohnstätten Sems
  rationale: Die ge’ezische Vorlage nennt Gott ausdrücklich ein zweites Mal als Subjekt und unterscheidet sich damit von Deutungen, die Jafet als Subjekt der zweiten Bitte verstehen.
translation_notes:
  register: Moderne, würdige Segenssprache im Konjunktiv. Die Wiederholung von „Gott“ folgt bewusst der ge’ezischen Vorlage. „Wohnstätten“ ist verständlich und hebt den Plural hervor; die Schlussklausel bewahrt die pronominale Mehrdeutigkeit.
