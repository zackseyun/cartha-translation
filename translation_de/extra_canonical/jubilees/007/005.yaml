  yaml_path: translation/extra_canonical/jubilees/007/005.yaml
  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: de
  text: Und er ließ ihr gesamtes Fleisch auf dem Altar aufsteigen. Er legte ihr ganzes, mit Öl vermischtes Opfer darauf; danach goss er Wein in das Feuer auf dem Altar, legte Räucherwerk auf den Altar und ließ einen wohlgefälligen Duft aufsteigen, der vor dem HERRN, seinem Gott, annehmbar war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ
  choice: ließ ... aufsteigen
  rationale: Gibt das wiederholte kausative Verb formal wieder und bewahrt zugleich die kultische Vorstellung, dass Opfer und Duft emporsteigen.
- source_word: ሥጋሆሙ
  choice: all ihr Fleisch
  rationale: Die Pluralbeziehung des Suffixes bleibt erhalten; »Fleisch« ist hier als Opferfleisch zu verstehen, wird aber nicht interpretierend erweitert.
- source_word: ልዉሰ፡ በቅብዕ
  choice: mit Öl vermischt
  rationale: Direkte, natürliche Wiedergabe der Zubereitung des Opfers.
- source_word: ስኂነ
  choice: Räucherwerk
  rationale: Der Ausdruck bezeichnet allgemein eine aromatische Räuchersubstanz; »Weihrauch« wäre unnötig spezifisch.
- source_word: መዐዛ፡ ሠናየ
  choice: einen wohlgefälligen Duft
  rationale: Bewahrt sowohl den Geruchsbezug als auch die positive kultische Wertung in idiomatischem Deutsch.
- source_word: ያሠምር
  choice: annehmbar war
  rationale: Gibt die Aussage kultischer Annahme wieder, ohne sie mit dem vorangehenden Duftbegriff zu verschmelzen.
- source_word: እግዚአብሔር
  choice: HERR
  rationale: Entspricht der etablierten deutschen Bibelkonvention für die Gottesbezeichnung und dem vorgegebenen englischen Konsultationstext.
theological_decisions:
- issue: Kultisches Aufsteigen des Opferfleisches
  choice: wörtlich als »ließ ... aufsteigen« wiedergegeben
  alternative: »verbrannte« oder »opferte«
  rationale: Die konkreteren Alternativen würden den Vorgang erklären, aber das wiederholte Bild des Aufsteigens von Fleisch und Duft einebnen.
- issue: Bezug der Annehmbarkeit
  choice: als Relativsatz auf den Duft bezogen
  alternative: adverbial auf den gesamten Opferakt bezogen
  rationale: Die Syntax legt den Bezug zum aufsteigenden Duft nahe; die Formulierung lässt dennoch erkennen, dass es um die Annahme des Opfers vor Gott geht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultischer Bibelsprache. Die Satzglieder folgen eng dem ge’ezischen Ablauf, wurden jedoch durch Satzteilung und klare Bezüge natürlich lesbar gemacht. Keine konfessionell geprägte Deutung wurde ergänzt.
