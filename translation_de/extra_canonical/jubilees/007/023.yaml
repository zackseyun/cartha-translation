lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: und ein Mann seinen Nächsten
  rationale: Die knappe, elliptische Formulierung des überlieferten Textes wird bewahrt; ሰብእ bezeichnet hier einen Mann bzw. Menschen, ቢጾ seinen Nächsten oder Mitmenschen.
- source_word: ኵሉ፡ ተሰይጠ
  choice: jeder verkaufte sich selbst
  rationale: Das reflexive Verb wird formal und zugleich verständlich wiedergegeben; die Aussage beschreibt eine bewusste Selbsthingabe an das folgende Unrecht.
- source_word: ይግበር፡ ዐመፃ
  choice: um Unrecht zu tun
  rationale: ዐመፃ bezeichnet Unrecht, Gewalttat oder Frevel; „Unrecht“ hält den Bedeutungsumfang offen.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: viel Blut zu vergießen
  rationale: Die Wendung wird mit der geläufigen deutschen Entsprechung für das Ausgießen einer großen Menge Blut wiedergegeben.
