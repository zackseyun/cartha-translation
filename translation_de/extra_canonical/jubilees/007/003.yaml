  text: በ ፳፫ሠርቀ፡ ወርኀ፡ ቀዳሚት። ፳፬ ወ ፳፭ገብረ፡ ፳፮ዕለተ፡ ዛቲ፡ በዓለ፡ ፳፯ በፍሥሓ፡ ወገብረ፡ ጽንሓሐ፡ ለእግዚአብሔር፡ ៣ዐዋ፡ ፳፰ እምአልህምቱ፡ አሐደ፡ ወበሐኩ፡ አሐደ፡ ወ ፳፱አባግዐ፡ ፴ ዘዘ፡ ዓመት፡ ሰብዐተ፡ ወ ፴፩መሐስአ፡ ፴፪ ጢለ፡ አሐደ፡ ከመ፡ ያስተስሪ፡ ፴፫ቦቱ፡ ለ ፴፬ርእሱ፡ ወበእንተ፡ ውሉዱ።
