base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: de
  text: 'Am Neumond des ersten Monats feierte er an diesem Tag ein Fest mit Freude und brachte dem HERRN ein Brandopfer dar: einen jungen Stier, einen Widder, sieben einjährige Schafe und eine Ziege, um für sich und seine Söhne Sühne zu erwirken.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: Am Neumond des ersten Monats
  rationale: Gibt die ausdrücklich genannte kalendarische Angabe wieder; ሠርቀ ወርኀ bezeichnet den Neumond beziehungsweise Monatsbeginn.
- source_word: ገብረ፡ ዕለተ፡ ዛቲ፡ በዓለ፡ በፍሥሓ
  choice: veranstaltete er an diesem Tag voller Freude ein Fest
  rationale: Bewahrt sowohl den Rückbezug auf den Tag als auch den freudigen Charakter des Festes in natürlichem Deutsch.
- source_word: ጽንሓሐ፡ ለእግዚአብሔር
  choice: brachte dem HERRN ein Brandopfer dar
  rationale: Verwendet die im Deutschen geläufige kultische Bezeichnung für das vollständig verbrannte Opfer und gibt den Gottesnamen traditionsgemäß als HERR wieder.
- source_word: እምአልህምቱ፡ አሐደ
  choice: ein Rind
  rationale: Der ge'ezische Ausdruck bezeichnet ein Tier vom Rindvieh, ohne in der vorliegenden Form Alter oder Geschlecht eindeutig festzulegen; daher wird gegenüber „junger Stier“ die quellennähere Oberbezeichnung gewählt.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: sieben einjährige Schafe
  rationale: Die Altersangabe „je/eines Jahres“ wird ausdrücklich aufgenommen und auf die sieben Schafe bezogen.
- source_word: ጢለ፡ አሐደ
  choice: eine Ziege
  rationale: Das Quellwort bezeichnet eine Ziege beziehungsweise ein Tier der Ziegengattung; ein männliches Geschlecht ist hier nicht hinreichend deutlich markiert.
- source_word: ያስተስሪ
  choice: Sühne erwirken
  rationale: Gibt die kausative beziehungsweise bewirkende Bedeutung des Verbs im kultischen Zusammenhang verständlich wieder, ohne die theologische Wirkungsweise näher festzulegen.
theological_decisions:
- issue: Zweck und Wirkung des Opfers
  choice: So wollte er für sich und seine Söhne Sühne erwirken.
  alternative: damit er für sich und seine Söhne Sühne schaffe
  rationale: Die Zweckbeziehung bleibt erhalten. „Sühne erwirken“ ist idiomatisches, würdiges Deutsch und legt nicht über den Text hinaus fest, ob die Handlung als Vergebung, Reinigung oder kultische Entsühnung zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt knapp und kultisch geprägt. Nicht ausdrücklich im ge'ezischen Wortlaut erkennbare Präzisierungen zu Alter oder Geschlecht der Opfertiere wurden vermieden.
