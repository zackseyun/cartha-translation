revisions:
- from: 'Am Neumond des ersten Monats veranstaltete er an diesem Tag voller Freude ein Fest und brachte dem HERRN ein Brandopfer dar: ein Rind, einen Widder, sieben einjährige Schafe und eine Ziege. So wollte er für sich und seine Söhne Sühne erwirken.'
  to: 'Am Neumond des ersten Monats feierte er an diesem Tag ein Fest mit Freude und brachte dem HERRN ein Brandopfer dar: einen jungen Stier, einen Widder, sieben einjährige Schafe und eine Ziege, um für sich und seine Söhne Sühne zu erwirken.'
  rationale: Die Revision glättet die Festformulierung und ersetzt das zu allgemeine „Rind“ durch „jungen Stier“. Die Quellenangabe zum Neumond, die sieben einjährigen Schafe, die unmarkierte Ziege und der kultische Sühnzweck bleiben erhalten. Ein Satzpunkt vor dem Zweck des Opfers wurde durch ein Komma ersetzt, damit die Zweckbeziehung unmittelbar an die Opferhandlung anschließt.
