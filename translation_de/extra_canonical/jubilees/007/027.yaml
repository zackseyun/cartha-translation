  source_fidelity: Die Übersetzung gibt den langen geʿezischen Überlieferungstext einschließlich des über die englische Konsultationsfassung hinausgehenden Abschnitts zu den Erstlingsfrüchten im Wesentlichen zuverlässig wieder. Die Aussagen über Blut, Vergeltung, Scheol, Gericht und die Reinigung der Erde bleiben ohne dogmatische Abschwächung erhalten. Eine kleine Präzisierung ist bei den fehlenden „Nachkommen bzw. Überlebenden“ sowie beim Bezug von „Blut vergießt“ erforderlich.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „Nachkommen noch Nachfahren“ ist jedoch eine unnatürliche tautologische Paarung; „lebend unter dem Himmel verbleiben“ ist syntaktisch schwerfällig. Außerdem sollte der Relativsatz im Satz über das geforderte Blut nicht fälschlich auf „Blut“ statt auf die Handlung des Blutvergießens bezogen werden.
  terminology: „Totenreich“, „Recht und Gerechtigkeit“, „Erstlingsgabe“ und „Diener des Hauses des Herrn“ sind angemessen. „Leben“ für ነፍስ im Kontext von Fleisch und Blut ist vertretbar. Die Fußnotenmarker sind vorhanden und sinnvoll verankert.
  issues:
  - severity: medium
    issue: „weder Nachkommen noch Nachfahren“
    rationale: Die beiden deutschen Ausdrücke sind nahezu synonym und geben die im Quelltext unterschiedenen Elemente „Nachkommenschaft/Same“ und „Rest/Überlebende“ nicht klar wieder. „Weder Nachkommen noch Überlebende“ erhält die Unterscheidung und ist idiomatischer.
  - severity: medium
    issue: Bezug in „irgendeines Lebewesens gefordert wird, das es auf der Erde vergießt“
    rationale: Das Pronomen „es“ kann im Deutschen nur auf „euer Blut“ zurückverweisen, während der Quelltext die blutvergießende Handlung bezeichnet. Die explizite Formulierung „das auf der Erde Blut vergießt“ beseitigt die Unklarheit.
  - severity: low
    issue: „Von all dem Blut ... soll keines an euch haften“
    rationale: „Anhaften“ deutet kultische Schuld aus, während der Quelltext zunächst bildhaft fordert, dass kein Blut auf ihnen sichtbar sei. Eine näher am Wortlaut bleibende, dennoch natürliche Formulierung vermeidet diese Zusatznuance.
  revised_text: 'Meine Kinder, liebt einander.[a] Denn ich sehe: Die Dämonen haben angefangen, gegen euch und eure Kinder zu sündigen. Darum fürchte ich jetzt um euch: Nach meinem Tod könntet ihr Menschenblut auf der Erde vergießen und selbst vom Erdboden getilgt werden. Denn jeder, der Menschenblut vergießt,[b] und jeder, der das Blut irgendeines Lebewesens isst, wird von der Erde getilgt werden. Kein Mensch, der Blut isst oder auf der Erde Menschenblut vergießt, wird übrig bleiben; weder Nachkommen noch Überlebende werden ihm unter dem Himmel bleiben. Denn sie werden ins Totenreich gehen, zum Ort des Gerichts hinabsteigen und in die Finsternis der Tiefe eingehen – sie alle durch einen gewaltsamen Tod.


    Lasst kein Blut von all dem Blut an euch sichtbar werden, das ihr im Lauf der Zeit vergießt, wenn ihr irgendein Wildtier, Vieh oder Kriechtier der Erde schlachtet. Tut ein gutes Werk für euer Leben, indem ihr das auf den Erdboden vergossene Blut mit Erde bedeckt. Seid nicht wie jemand, der Fleisch mitsamt dem Blut isst, sondern achtet streng darauf, kein Blut zu essen. Bedeckt das Blut vor euren Augen mit Erde, denn so wurde mir geboten, es euch, euren Kindern und allem Fleisch zu bezeugen. Esst nicht das Leben zusammen mit dem Fleisch, damit euer Blut – euer Leben – nicht von der Hand irgendeines Lebewesens gefordert wird, das auf der Erde Blut vergießt. Denn die Erde kann von dem Blut, das auf ihr vergossen wurde, nicht gereinigt werden; nur durch das Blut dessen, der es vergossen hat, wird die Erde in allen ihren Generationen gereinigt.


    Und nun, meine Kinder, hört: Übt Recht und Gerechtigkeit, damit ihr in Gerechtigkeit auf der ganzen Erde fest eingepflanzt werdet und eure Ehre vor meinem Gott erhöht wird, der mich aus den Wassern der Flut gerettet hat. Nun geht, baut euch Städte und pflanzt darin alle Arten von Gewächsen, die es auf der Erde gibt, und jeden fruchttragenden Baum. Drei Jahre lang soll seine Frucht nicht gepflückt und nichts davon gegessen werden. Im vierten Jahr soll seine Frucht gepflückt werden, und ihre Erstlingsgabe soll vor dem Herrn, dem Höchsten, dargebracht werden, der Himmel und Erde und alles erschaffen hat. So sollen sie die Erstlingsgabe des Weins und des Öls als Erstlingsfrucht zum Altar des Herrn bringen, damit sie angenommen wird. Was übrig bleibt, sollen die Diener des Hauses des Herrn essen.[c]'
