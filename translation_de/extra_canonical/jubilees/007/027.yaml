- source_word: ሲኦል
  choice: Totenreich
  rationale: Gibt das geʿezische Lehnwort für Scheol verständlich wieder, ohne es mit Hölle oder einem endgültigen Strafort gleichzusetzen.
- source_word: ነፍስ
  choice: Leben
  rationale: Im Blutgebot bezeichnet das Wort im Zusammenhang mit Fleisch und Blut das Leben; diese Wiedergabe bewahrt die Anspielung auf die Urgeschichte.
- source_word: ፍትሐ፡ ወጽድቀ
  choice: Recht und Gerechtigkeit
  rationale: Erhält das begriffliche Paar und seinen ethisch-rechtlichen Sinn.
- source_word: ቀዳሜ፡ ፍሬ
  choice: Erstlingsgabe / Erstlingsfrucht
  rationale: Bezeichnet den ersten, Gott dargebrachten Ertrag und passt zum kultischen Zusammenhang.
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: Diener des Hauses des Herrn
  rationale: Der Ausdruck bezeichnet die zum Heiligtum gehörenden Bediensteten; die Wiedergabe vermeidet eine unbelegte engere Amtsbezeichnung.
theological_decisions:
- issue: Zielort der gewalttätigen Blutvergießer
  choice: Totenreich, Ort des Gerichts und Finsternis der Tiefe als parallele, aber nicht vollständig gleichgesetzte Ausdrücke
  alternative: Alle Begriffe als Hölle zusammenfassen
  rationale: Der Quelltext unterscheidet mehrere Bezeichnungen; ihre mögliche Beziehung soll nicht dogmatisch vereinheitlicht werden.
- issue: Reinigung der durch Blut befleckten Erde
  choice: Nur durch das Blut dessen, der es vergossen hat
  alternative: Durch allgemeine Sühne oder Vergebung
  rationale: Die harte Vergeltungsaussage des Quelltexts wird ohne konfessionelle Harmonisierung bewahrt.
- issue: Das Leben im Blut
  choice: „das Leben zusammen mit dem Fleisch“ und „euer Blut – euer Leben“
  alternative: „die Seele mit dem Fleisch“
  rationale: „Leben“ ist im Speise- und Blutkontext natürlich und bewahrt dennoch die anthropologische Spannung des Wortes ነፍስ.
