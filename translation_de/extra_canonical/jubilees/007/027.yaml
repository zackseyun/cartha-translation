base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: de
  text: 'Meine Kinder, liebt einander.[a] Denn ich sehe: Die Dämonen haben angefangen, gegen euch und eure Kinder zu sündigen. Darum fürchte ich jetzt um euch: Nach meinem Tod könntet ihr Menschenblut auf der Erde vergießen und selbst vom Erdboden getilgt werden. Denn jeder, der Menschenblut vergießt,[b] und jeder, der das Blut irgendeines Lebewesens isst, wird von der Erde getilgt werden. Kein Mensch, der Blut isst oder auf der Erde Menschenblut vergießt, wird übrig bleiben; weder Nachkommen noch Überlebende werden ihm unter dem Himmel bleiben. Denn sie werden ins Totenreich gehen, zum Ort des Gerichts hinabsteigen und in die Finsternis der Tiefe eingehen – sie alle durch einen gewaltsamen Tod.


    Lasst kein Blut von all dem Blut an euch sichtbar werden, das ihr im Lauf der Zeit vergießt, wenn ihr irgendein Wildtier, Vieh oder Kriechtier der Erde schlachtet. Tut ein gutes Werk für euer Leben, indem ihr das auf den Erdboden vergossene Blut mit Erde bedeckt. Seid nicht wie jemand, der Fleisch mitsamt dem Blut isst, sondern achtet streng darauf, kein Blut zu essen. Bedeckt das Blut vor euren Augen mit Erde, denn so wurde mir geboten, es euch, euren Kindern und allem Fleisch zu bezeugen. Esst nicht das Leben zusammen mit dem Fleisch, damit euer Blut – euer Leben – nicht von der Hand irgendeines Lebewesens gefordert wird, das auf der Erde Blut vergießt. Denn die Erde kann von dem Blut, das auf ihr vergossen wurde, nicht gereinigt werden; nur durch das Blut dessen, der es vergossen hat, wird die Erde in allen ihren Generationen gereinigt.


    Und nun, meine Kinder, hört: Übt Recht und Gerechtigkeit, damit ihr in Gerechtigkeit auf der ganzen Erde fest eingepflanzt werdet und eure Ehre vor meinem Gott erhöht wird, der mich aus den Wassern der Flut gerettet hat. Nun geht, baut euch Städte und pflanzt darin alle Arten von Gewächsen, die es auf der Erde gibt, und jeden fruchttragenden Baum. Drei Jahre lang soll seine Frucht nicht gepflückt und nichts davon gegessen werden. Im vierten Jahr soll seine Frucht gepflückt werden, und ihre Erstlingsgabe soll vor dem Herrn, dem Höchsten, dargebracht werden, der Himmel und Erde und alles erschaffen hat. So sollen sie die Erstlingsgabe des Weins und des Öls als Erstlingsfrucht zum Altar des Herrn bringen, damit sie angenommen wird. Was übrig bleibt, sollen die Diener des Hauses des Herrn essen.[c]'
