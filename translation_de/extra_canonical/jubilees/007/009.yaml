  yaml_path: translation/extra_canonical/jubilees/007/009.yaml
  text: And Noah awoke from his wine and knew everything that his youngest son had done to him, and he cursed his son and said, “Cursed be Canaan; a lowly servant[a] shall he be to his brothers.”
translation:
  language: de
  text: 'Und Noah erwachte aus seinem Weinrausch und erkannte alles, was sein jüngster Sohn ihm angetan hatte. Da verfluchte er seinen Sohn und sagte: »Verflucht sei Kanaan! Seinen Brüdern soll er ein Knecht niedrigen Standes[a] sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut enthält hier eine Wendung im Sinn von »Knecht niedrigen Standes« beziehungsweise »niedriger Knecht«, nicht die aus Genesis bekannte Formulierung »Knecht der Knechte«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነቅሀ፡ ኖኅ፡ እምወይኑ
  choice: Und Noah erwachte von seinem Wein
  rationale: Gibt die äthiopische Wendung eng wieder, ohne den Text durch die ausdrückliche Deutung „Weinrausch“ zu erweitern.
- source_word: ወአእመረ፡ ኵሎ፡ ዘገብረ፡ ላዕሌሁ
  choice: und erkannte alles, was … ihm angetan hatte
  rationale: „Antun“ ist im Deutschen für eine gegen jemanden gerichtete Handlung natürlich und wahrt, dass der Vers die Tat selbst nicht näher bestimmt.
- source_word: ወልዱ፡ ዘይንእስ
  choice: sein jüngster Sohn
  rationale: Der Ausdruck bezeichnet den jüngeren beziehungsweise jüngsten Sohn; im erzählerischen Zusammenhang ist „jüngster Sohn“ die natürliche Wiedergabe.
- source_word: ቅኑየ፡ ገብር
  choice: ein Knecht niedrigen Ranges
  rationale: Bewahrt die im äthiopischen Wortlaut ausgedrückte Erniedrigung beziehungsweise Unterordnung, ohne ihn an die geläufigere Genesis-Formel „Knecht der Knechte“ anzugleichen.
- source_word: ለአኃዊሁ
  choice: für seine Brüder
  rationale: Gibt die relationale Dativkonstruktion natürlich wieder; „Brüder“ bleibt wie im Ausgangstext stehen.
theological_decisions:
- issue: Bezug von „seinen Sohn“ und Übergang zu Kanaan
  choice: '„Da verfluchte er seinen Sohn und sagte: Verflucht sei Kanaan!“'
  alternative: „Da verfluchte er Kanaan, den Sohn seines Sohnes“
  rationale: Der Ausgangstext nennt zunächst nur „seinen Sohn“ und anschließend Kanaan. Die Übersetzung erklärt die genealogische oder moralische Zuordnung nicht zusätzlich und bewahrt dadurch die Spannung des Wortlauts.
- issue: Statusbezeichnung Kanaans
  choice: Knecht niedrigen Ranges
  alternative: Sklave der Sklaven / Knecht der Knechte
  rationale: Die gewählte Form vermeidet eine ungesicherte Angleichung an konfessionell oder bibeltraditionell vertraute Formulierungen und hält zugleich die starke soziale Erniedrigung fest.
translation_notes:
  register: Moderne, würdige Standardsprache. „Knecht“ hält den antiken Abhängigkeitsstatus deutlicher fest als das schwächere „Diener“; die ergänzende Bestimmung „niedrigen Ranges“ macht die ungewöhnliche äthiopische Wendung verständlich. Die Satzfolge bleibt nah am Ausgangstext und löst die Spannung zwischen dem jüngsten Sohn, „seinem Sohn“ und Kanaan nicht erklärend auf.
