base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/019.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: de
  text: Dies sind die Söhne Noahs. Im achtundzwanzigsten Jubiläum begann Noah, seinen Enkeln die Ordnungen, die Gebote und alle Rechtsbestimmungen, die er kannte, einzuschärfen. Er schärfte seinen Söhnen ein, gerecht zu handeln, die Blöße ihres Leibes zu bedecken, ihren Schöpfer zu preisen, Vater und Mutter zu ehren, einander zu lieben und sich vor Unzucht, Unreinheit und allem Unrecht zu hüten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: die Ordnungen und Gebote
  rationale: Gibt die zwei parallelen Rechtsbegriffe differenziert und in verständlichem, würdigem Deutsch wieder.
- source_word: ፍትሐ
  choice: Rechtsbestimmungen
  rationale: Im Kontext bezeichnet der Ausdruck konkrete rechtliche Weisungen bzw. Rechtssprüche, nicht die abstrakte Tugend der Gerechtigkeit.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: die Blöße ihres Leibes
  rationale: Bewahrt das körperbezogene Scham- und Nacktheitsmotiv des geezischen Ausdrucks, ohne es abzuschwächen.
- source_word: ይባርክዎ፡ ለዘፈጠሮሙ
  choice: ihren Schöpfer zu preisen
  rationale: Das Verb bedeutet wörtlich „segnen“; bei Gott als Objekt entspricht im heutigen Deutschen „preisen“ dem gemeinten ehrenden Lob.
- source_word: አሐዱ፡ አሐዱ፡ ቢጾ
  choice: einander zu lieben
  rationale: Der Ausdruck meint, dass jeder seinen Gefährten bzw. Nächsten liebt; „einander“ gibt die wechselseitige Verpflichtung natürlich wieder.
- source_word: ዝሙት፡ ወርኵስ፡ ወእምኵሉ፡ ዐመፃ
  choice: Unzucht, Unreinheit und allem Unrecht
  rationale: Erhält die dreigliedrige ethische Aufzählung und unterscheidet sexuelle Verfehlung, kultisch-moralische Unreinheit und allgemeines Unrecht.
theological_decisions:
- issue: Adressaten von Noahs Unterweisung
  choice: Noah schärft den Söhnen seiner Söhne die Weisungen ein und ermahnt zugleich seine Söhne.
  alternative: Beide Aussagen unterschiedslos auf alle Nachkommen Noahs beziehen.
  rationale: Der Quelltext nennt zunächst ausdrücklich die „Söhne seiner Söhne“, danach aber seine „Söhne“. Die Übersetzung bewahrt diesen Wechsel, statt ihn harmonisierend aufzulösen.
- issue: Lob des Schöpfers
  choice: „ihren Schöpfer zu preisen“
  alternative: „ihren Schöpfer zu segnen“
  rationale: „Segnen“ wäre formal näher, klingt im modernen Deutschen bei Gott als Objekt jedoch missverständlich. „Preisen“ wahrt die theologische Richtung des Ausdrucks, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die rechtlich-ethische Reihung des Originals bleibt erhalten; altertümliche Wendungen werden vermieden. „Jubiläum“ wird als literarischer Zeitbegriff beibehalten.
