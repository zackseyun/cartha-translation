  yaml_path: translation/extra_canonical/jubilees/007/024.yaml
  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: de
  text: Und die Erde wurde von Gewalttat erfüllt. Danach sündigten sie gegen die Tiere und die Vögel und gegen alles, was sich regt und auf der Erde umhergeht. Viel Blut wurde auf der Erde vergossen, und alles—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende geezische Quelltext bricht hier nach „und alles“ ab.
    reason: Kennzeichnet transparent den unvollständigen Versschluss der angegebenen Edition.
lexical_decisions:
- source_word: ዐመፃ (ʿamaṣā)
  choice: Gewalttat
  rationale: Bezeichnet hier Gewalt bzw. gewaltsames Unrecht; „Gewalttat“ bewahrt den ethischen und konkreten Sinn.
- source_word: አበሱ፡ ሎሙ፡ በአራዊት (ʾabasu lomu ba-ʾarāwit)
  choice: sie sündigten gegen die Tiere
  rationale: Das Pronomen nimmt die nachfolgend genannten Tiere vorweg; die Konstruktion bezeichnet ein Sündigen gegen sie, nicht „gegen sich selbst mit Tieren“.
- source_word: ዘይትሐወስ (za-yitḥawwas)
  choice: was sich regt
  rationale: Gibt die Bewegung lebender Wesen natürlich wieder, ohne sie auf eine bestimmte Tierklasse einzuengen.
- source_word: ዘያንሶሱ (za-yānsawsu)
  choice: was ... umhergeht
  rationale: Bewahrt den Sinn des Sichbewegens bzw. Umhergehens auf der Erde und unterscheidet die Wendung von dem vorausgehenden Verb.
- source_word: ትክዐወ፡ ደም፡ ብዙኅ (tikʿawwa dam bəzuḥ)
  choice: Viel Blut wurde ... vergossen
  rationale: Idiomaticher deutscher Ausdruck für das passive Vergießen einer großen Menge Blut.
theological_decisions:
- issue: Art der Sünde an den Tieren
  choice: „gegen die Tiere“
  alternative: „gegen sich selbst mit Tieren“
  rationale: Die geezische Grammatik und der Zusammenhang mit Gewalttat und Blutvergießen sprechen für gegen Tiere gerichtetes Unrecht; eine sexuelle Deutung würde eine nicht hinreichend gestützte theologische Festlegung eintragen.
- issue: Unvollständiger Versschluss
  choice: „und alles—“ beibehalten
  alternative: Den Satz aus späterer Überlieferung oder dem Folgevers ergänzen
  rationale: Der bereitgestellte Quelltext bricht nach „und alles“ ab. Die Übersetzung macht diesen Überlieferungszustand sichtbar, statt fehlenden Text stillschweigend zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden für einen natürlichen deutschen Lesefluss leicht neu geordnet; die Wiederholung „gegen“ verdeutlicht den syntaktischen Bezug. Der Gedankenstrich markiert zusammen mit der Fußnote den Abbruch des Quelltexts.
