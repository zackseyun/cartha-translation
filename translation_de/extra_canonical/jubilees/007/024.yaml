  source_fidelity: 'Der deutsche Text gibt den geezischen Wortlaut zuverlässig wieder: Die Erde wird mit Gewalttat erfüllt; das Sündigen richtet sich gegen Tiere, Vögel und alles sich Bewegende bzw. auf der Erde Gehende; danach folgt das Vergießen vielen Blutes. Die Wiedergabe „gegen die Tiere“ entspricht der im Audit Trail begründeten syntaktischen Analyse und vermeidet die unbelegte Deutung einer Sünde „mit“ Tieren. Der unvollständige Schluss „und alles—“ bleibt, wie es der bereitgestellte Quelltext verlangt, transparent erhalten.'
  naturalness: Modernes, würdiges Standarddeutsch. „wurde von Gewalttat erfüllt“, „was sich regt und auf der Erde umhergeht“ und „Viel Blut wurde auf der Erde vergossen“ sind gut verständlich und angemessen knapp. Die Wiederholung von „gegen“ dient der Klarheit des Bezugs.
  terminology: „Gewalttat“ ist für ዐመፃ treffend; „sündigten“ bewahrt den ethisch-religiösen Charakter von አበሱ, ohne eine konfessionell bestimmte Auslegung einzutragen. Die Tierbezeichnungen und Bewegungsverben sind sachlich und quellentreu wiedergegeben.
