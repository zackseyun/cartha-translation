  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: de
  text: Und zuerst bereitete er das Zicklein zu. Dann strich er etwas von seinem Blut auf das Fleisch, das auf dem Altar lag, den er errichtet hatte. Sein ganzes Fett brachte er auf dem Altar als Opfer dar, auf dem er das Brandopfer dargebracht hatte, ebenso das Rind, den Widder und die Schafe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሕስአ
  choice: Ziegenbock
  rationale: Bezeichnet hier das zuerst zubereitete Opfertier; „Ziegenbock“ ist im Deutschen klar und dem Opferkontext angemessen.
- source_word: አንበረ
  choice: strich … auf
  rationale: Das Verb bedeutet grundsätzlich „legen, setzen, anbringen“. Im Zusammenhang mit Blut auf Opferfleisch gibt „strich … auf“ den konkreten Vorgang natürlich wieder, ohne eine weitergehende Ritualdeutung einzutragen.
- source_word: ስብሖ
  choice: sein ganzes Fett
  rationale: Das Suffix bezieht das Fett auf den zuvor genannten Ziegenbock; diese Zuordnung wird im Deutschen ausdrücklich gemacht.
- source_word: አዕረገ
  choice: ließ … als Opfer aufsteigen
  rationale: Bewahrt das Bild des Aufsteigenlassens und macht zugleich den kultischen Sinn verständlich, statt es lediglich mit „opferte“ zu glätten.
- source_word: ምሥዋዕ
  choice: Brandopfer
  rationale: Im Satz bezeichnet der Ausdruck das auf dem Altar dargebrachte Opfer; „Brandopfer“ entspricht dem überlieferten Kontext und der englischen Konsultationsfassung.
- source_word: ላህመ፡ ወበሐኩ፡ ወአባግዐ
  choice: das Rind, den Widder und die Schafe
  rationale: Gibt die aufgezählten Opfertiere entsprechend der erkennbaren ge'ezischen Wortfolge wieder; die Numeralzeichen der Edition werden nicht als Bestandteil des Textes behandelt.
theological_decisions:
- issue: Kultische Bedeutung von አዕረገ
  choice: ließ er … als Opfer aufsteigen
  alternative: opferte er
  rationale: Die gewählte Formulierung bewahrt sowohl das konkrete Aufstiegsbild als auch den Opferbezug und vermeidet, die Ausdrucksweise unnötig zu vereinfachen.
- issue: Syntaktischer Anschluss der letzten Tierliste
  choice: ebenso das Rind, den Widder und die Schafe
  alternative: und das Rind und den Widder und die Schafe
  rationale: Der ge'ezische Auszug ist am Versende knapp und die englische Konsultationsfassung ebenfalls syntaktisch offen. „ebenso“ macht den naheliegenden Bezug zum Darbringen auf dem Altar verständlich, ohne zusätzliche rituelle Einzelheiten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar kultischer Sprache. Kurze Satzglieder verbessern die Verständlichkeit. Keine konfessionell geprägte Terminologie; das Bild des aufsteigenden Opfers bleibt erhalten.
