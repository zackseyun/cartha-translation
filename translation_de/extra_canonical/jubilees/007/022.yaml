  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: de
  text: Und sie zeugten Kinder, die Naphidim. Sie alle waren voneinander verschieden und fraßen einander. Die Riesen töteten den Naphil, der Naphil tötete den Elyo und der Elyo die Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naphidim, Naphil und Elyo sind unterschiedliche Bezeichnungen im überlieferten Text; ihre genaue Bedeutung und Zuordnung sind unsicher.
    reason: Die Anmerkung bewahrt die lexikalische Unsicherheit und verhindert, dass die transliterierten Begriffe irrtümlich als sicher bestimmte oder identische Gruppen verstanden werden.
lexical_decisions:
- source_word: ናፊዲም (nāfidim)
  choice: Naphidim
  rationale: Als Bezeichnung einer eigenen Gruppe transliteriert; sie darf nicht mit dem später genannten ናፊል gleichgesetzt werden.
- source_word: ኢይትማሰሉ
  choice: waren voneinander verschieden
  rationale: Gibt die Verneinung des gegenseitigen Gleichseins natürlich wieder, ohne die Aussage näher zu bestimmen.
- source_word: ወይበልዕ፡ አሐዱ፡ አሐዱ፡ ካልኦ
  choice: und fraßen einander
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den drastischen Sinn der Folge ‚einer den anderen‘.
- source_word: ይርባሕ
  choice: die Riesen
  rationale: Im überlieferten Zusammenhang als Bezeichnung der riesenhaften Wesen verstanden; der Numerus wird entsprechend der konsultierten Textüberlieferung pluralisch wiedergegeben.
- source_word: ናፊል
  choice: Naphil
  rationale: Transliteration der von Naphidim unterschiedenen Bezeichnung; die Singularform des Ausgangstextes bleibt erhalten.
- source_word: ኤልዮ
  choice: Eljo
  rationale: Transliteration einer schwer sicher zu identifizierenden Gruppenbezeichnung statt einer spekulativen Deutung.
- source_word: አንሰ፡ አመሕያው
  choice: die Menschen
  rationale: Natürliche deutsche Wiedergabe für die Menschheit beziehungsweise menschliche Wesen.
theological_decisions:
- issue: Unterschiedliche Klassen oder Bezeichnungen der riesenhaften Wesen
  choice: Naphidim, Naphil und Eljo werden voneinander unterschieden
  alternative: Naphidim und Naphil beide als „Nephilim“ wiederzugeben oder alle Begriffe pauschal mit „Riesen“ zu übersetzen
  rationale: Der ge’ezische Text verwendet verschiedene Formen und zeichnet eine Abfolge gegenseitiger Tötung. Eine Vereinheitlichung würde diese Spannung und mögliche Taxonomie verdecken.
- issue: Elliptischer letzter Satzteil
  choice: „und der Eljo die Menschen“ ohne Wiederholung von „tötete“
  alternative: „und der Eljo tötete die Menschen“
  rationale: Die Ellipse des Ausgangstextes bleibt im Deutschen verständlich und bewahrt dessen knappe, kettenartige Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bilden die harte Abfolge des Ausgangstextes nach. Unklare Gruppenbezeichnungen werden transliteriert; die ungewöhnliche Schlussellipse bleibt bewusst stehen.
