    rationale: Die ge’ezische bzw. von Charles wiedergegebene Konstruktion entspricht „sie zeugten Kinder/Söhne, die Naphidim“. Die Naphidim sind somit die Bezeichnung der gezeugten Nachkommen selbst.
  - severity: low
    issue: „Eljo“ weicht von der im Quellenkontext und englischen Audit-Trail verwendeten Umschrift „Elyo“ ab.
    rationale: Bei einer nicht sicher identifizierten Gruppenbezeichnung ist eine konsistente, quellennähere Umschrift vorzuziehen; dies vermeidet eine unnötige zusätzliche germanisierende Lautfestlegung.
