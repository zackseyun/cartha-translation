  source_fidelity: 'Die Abfolge der gegenseitigen Vernichtung sowie die Unterscheidung von Naphidim, Naphil und Elyo werden grundsätzlich korrekt bewahrt. „Sie zeugten die Kinder der Naphidim“ verschiebt jedoch die Konstruktion: Der Text bezeichnet die gezeugten Kinder selbst als Naphidim, nicht als Kinder, die von bereits genannten Naphidim abstammen. Die knappe Ellipse im Schlussteil kann beibehalten werden.'
  naturalness: Die kurzen Satzreihen und „fraßen einander“ sind in modernem, würdigem Deutsch klar und angemessen. „zeugten die Kinder der …“ ist dagegen weder natürlich noch syntaktisch präzise; „zeugten Kinder, die Naphidim“ gibt die Apposition verständlich wieder.
  terminology: Die getrennte Wiedergabe von Naphidim und Naphil ist erforderlich und gelungen. Für die dritte, unsichere Bezeichnung wird zur Übereinstimmung mit der Quellenumschrift und dem englischen Audit-Trail „Elyo“ statt „Eljo“ verwendet. „Riesen“ für yərbah folgt der herangezogenen Texttradition; die Fußnote markiert zu Recht die Unsicherheit der drei Bezeichnungen.
  issues:
