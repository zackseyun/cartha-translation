  rationale: Die erste Aussage wird als Apposition korrigiert, damit die Naphidim als die gezeugten Kinder bezeichnet werden. Die Umschrift Elyo wird an die Quellen- und Audit-Trail-Form angeglichen. Im Übrigen bleiben die knappe Satzfolge, die bewusste Unterscheidung der Benennungen und die im Ausgangstext angelegte Schlussellipse erhalten.
