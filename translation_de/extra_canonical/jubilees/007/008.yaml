  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: de
  text: Und Ham sah seinen Vater Noah nackt[a]. Er ging hinaus und erzählte es draußen seinen beiden Brüdern. Da nahm Sem ein Gewand, und er und Jafet legten das Gewand auf ihre Schultern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Vers- und Zeileneinteilung ist in der zugrunde liegenden Ausgabe an dieser Stelle ungewöhnlich. Hier wird nur der für diesen Vers vorgelegte ge’ezische Text übersetzt; das rückwärts gerichtete Zudecken Noahs folgt erst im nächsten Abschnitt.
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ
  choice: nackt
  rationale: Das äthiopische Wort bezeichnet hier Noahs unbekleideten Zustand; die knappe Wiedergabe bewahrt die Aussage des Ausgangstextes.
- source_word: ለአሕሊ፡ አኀዊሁ
  choice: seinen beiden Brüdern
  rationale: Die Formulierung gibt die im Text ausdrücklich genannte Zweizahl idiomatisch und genau wieder.
- source_word: ልብሰ
  choice: ein Gewand / das Gewand
  rationale: Die erste Nennung wird im Deutschen unbestimmt, die Wiederaufnahme bestimmt wiedergegeben.
- source_word: ዲበ፡ መታክፍቲሆሙ
  choice: auf ihre Schultern
  rationale: Entspricht der lokalen Präposition und dem pluralischen Körperteil im ge'ezischen Text.
theological_decisions:
- issue: Art von Hams Wahrnehmung der Nacktheit
  choice: sah … nackt
  alternative: sah die Blöße seines Vaters
  rationale: Der Ausgangstext schildert unmittelbar Noahs nackten Zustand und zwingt nicht zu einer euphemistischen oder sexuell erweiterten Deutung.
- issue: Abgrenzung gegenüber dem folgenden Erzählabschnitt
  choice: Der Vers endet mit dem Auflegen des Gewandes auf die Schultern.
  alternative: Fortsetzung mit dem rückwärts gerichteten Zudecken Noahs
  rationale: Die zusätzlich überlieferte Fortsetzung steht nicht im für diesen Vers bereitgestellten ge'ezischen Ausgangstext und wird daher nicht vorgezogen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Nennung von „Gewand“ bleibt erhalten, da sie die Struktur des ge’ezischen Textes abbildet; ein unnötig deutender Euphemismus wird vermieden.
