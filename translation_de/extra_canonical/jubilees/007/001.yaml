base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/001.yaml
  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: de
  text: Und in der siebten Jahrwoche, in ihrem ersten Jahr, in diesem Jubiläum, pflanzte Noah einen Weinstock auf dem Berg, auf dem die Arche zur Ruhe gekommen war. Er hieß Lubar und gehörte zu den Bergen von Ararat. Im vierten Jahr trug der Weinstock Früchte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Der Ausdruck bezeichnet im chronologischen System des Jubiläenbuches eine Siebenjahresperiode; „Jahrwoche“ ist im Deutschen präzise und verständlich.
- source_word: ወይነ
  choice: einen Weinstock
  rationale: Das Wort bezeichnet hier die von Noah gepflanzte Weinrebe; „Weinstock“ passt natürlich zum anschließenden Fruchttragen.
- source_word: ደብር
  choice: Berg
  rationale: Die konkrete Ortsangabe und der folgende Bezug auf die Berge von Ararat sprechen für „Berg“.
- source_word: አዕረፈት
  choice: zur Ruhe gekommen war
  rationale: Die Form beschreibt das Ruhen beziehungsweise Aufsetzen der Arche und bewahrt zugleich die Anspielung auf Genesis 8,4.
- source_word: ገብረ፡ ፍሬ
  choice: trug … Früchte
  rationale: Die idiomatische deutsche Wiedergabe von „Frucht hervorbringen/machen“ ist „Früchte tragen“.
