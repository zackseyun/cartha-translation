  yaml_path: translation/extra_canonical/jubilees/007/015.yaml
  text: But Shem remained with his father Noah, and he built a city near his father, by the mountain, and he called its name after the name of his wife, Sedeqetelebab[a].
translation:
  language: de
  text: Sem aber blieb bei seinem Vater Noah und baute in der Nähe seines Vaters am Berg eine Stadt. Er nannte sie nach seiner Frau Sedeqatelebab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Sedeqatelebab ist aus dem Äthiopischen transliteriert. Möglicherweise liegt ihm eine Bedeutung zugrunde, die mit Gerechtigkeit zusammenhängt; wegen der unsicheren Namensform bleibt er im Haupttext unübersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ (nabara)
  choice: blieb
  rationale: Das Verb kann „wohnen, bleiben“ bedeuten; im Kontrast zu den zuvor fortgezogenen Brüdern gibt „blieb“ den Zusammenhang natürlich und genau wieder.
- source_word: በአደ፡ አቡሁ (baʾada ʾabuhu)
  choice: in der Nähe seines Vaters
  rationale: Die Wendung bezeichnet die räumliche Nähe beziehungsweise die Seite seines Vaters; die deutsche Fassung vermeidet das missverständliche wörtliche „an der Hand seines Vaters“.
- source_word: ኀበ፡ ደብር (ḫaba dabr)
  choice: am Berg
  rationale: Ḫaba bezeichnet hier die Lage bei oder an etwas; dabr bedeutet „Berg“ und wird nicht unnötig als Eigenname verstanden.
- source_word: ሴደቃቴልባብ
  choice: Sedeqatelebab
  rationale: Der äthiopische Frauenname wird transliteriert, da seine mögliche Bedeutung nicht sicher genug ist, um ihn im Haupttext zu übersetzen.
