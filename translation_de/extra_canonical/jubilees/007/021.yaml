  naturalness: Der Registerton ist modern und würdig; die anfängliche Satzreihung darf als Anschluss an den vorigen Vers fragmentarisch bleiben. »Den Töchtern der Menschen nachgehen« ist idiomatischer und semantisch neutraler als »den Menschentöchtern nachstellen«. »Frauen, wen immer sie auswählten« stellt klar, dass die Auswahl die Frauen betrifft.
  terminology: »Unreinheit«, »Gesetzlosigkeit«, »Flut«, »Wächter« und »Unzucht« sind angemessene, theologisch nicht überdeutende Wiedergaben. »Gebot ihrer Ordnung« wahrt die im vorliegenden Text und englischen Audit Trail bezeugte Formulierung ohne weitergehende angelologische Festlegung.
