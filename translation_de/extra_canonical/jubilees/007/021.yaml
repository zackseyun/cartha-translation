base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: de
  text: 'Und Unreinheit und alle Gesetzlosigkeit. Denn wegen dieser drei Dinge kam die Flut über die Erde: wegen der Unzucht, die die Wächter begingen, indem sie entgegen dem Gebot ihrer Ordnung den Töchtern der Menschen nachgingen.[a] Sie nahmen sich Frauen, wen immer sie auswählten, und machten den Anfang mit der Unreinheit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen der Unzucht, durch die die Wächter gegen das Gebot ihrer Ordnung verstießen, indem sie den Töchtern der Menschen nachgingen«.'
    reason: Die äthiopische Satzverknüpfung lässt offen, ob die Unzucht selbst als Verstoß gegen das Gebot beschrieben wird oder ob der Verstoß die Umstände ihres Nachgehens nach den Töchtern der Menschen näher bestimmt.
lexical_decisions:
- source_word: ርኵስ
  choice: Unreinheit
  rationale: Gibt die kultisch-moralische Bedeutung des äthiopischen Begriffs wieder und bewahrt seine Wiederholung am Anfang und Ende des Verses.
- source_word: ዐመፃ
  choice: Gesetzlosigkeit
  rationale: Bezeichnet widerrechtliches, aufrührerisches Handeln; »Gesetzlosigkeit« passt zum Kontext des Verstoßes gegen die gesetzte Ordnung.
- source_word: አይኅ
  choice: Flut
  rationale: Natürliche deutsche Bezeichnung für die im Kontext gemeinte große Flut; »Sintflut« wäre ebenfalls möglich, trägt aber stärkere traditionssprachliche Konnotationen.
- source_word: ትጉሃን
  choice: Wächter
  rationale: Die etablierte sachliche Wiedergabe der Engelgruppe; der Begriff wird nicht weiter konfessionell oder mythologisch ausgedeutet.
- source_word: ዝሙት
  choice: Unzucht
  rationale: Bewahrt die ausdrücklich sexuelle und moralisch negative Bedeutung des Ausgangsbegriffs; »Hurerei« wäre im heutigen Deutsch unnötig altertümlich.
- source_word: ገብሩ፡ መቅድመ፡ ርኵሰ
  choice: machten den Anfang mit der Unreinheit
  rationale: Bildet die Wendung »den Anfang machen« eng nach, ohne sie kausal stärker zu deuten als der Text.
theological_decisions:
- issue: Art des Gebots, gegen das die Wächter handelten
  choice: Gebot ihrer Ordnung
  alternative: Gebot ihrer Satzungen
  rationale: Die Formulierung bewahrt die Mehrdeutigkeit zwischen einer ihnen auferlegten Ordnung und eigenen Bestimmungen, ohne eine bestimmte Angelologie einzutragen.
- issue: Syntax der Übertretung und des Nachstellens
  choice: die Unzucht, die die Wächter begingen, als sie entgegen dem Gebot ihrer Ordnung den Menschentöchtern nachstellten
  alternative: die Unzucht, durch die die Wächter vom Gebot ihrer Ordnung abwichen, indem sie den Menschentöchtern nachstellten
  rationale: Die Hauptfassung ist im Deutschen verständlich und wahrt sowohl die Unzucht als auch den Verstoß gegen das Gebot; die mögliche engere Verknüpfung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eröffnende Satz bleibt als knappe, an den vorherigen Zusammenhang anschließende Reihung erhalten. Die Wiederholung von »Unreinheit« und die Spannung zwischen sexueller Verfehlung und Ordnungsverstoß werden nicht geglättet.
