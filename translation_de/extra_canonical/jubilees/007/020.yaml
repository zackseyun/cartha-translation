revisions:
- from: Und im achtundzwanzigsten Jubiläum begann Noah, den Kindern seiner Kinder die Satzungen und Gebote einzuschärfen sowie alles, was er über Recht[a] wusste. Er ermahnte seine Kinder, gerecht zu handeln, die Blöße ihres Körpers zu bedecken, den zu preisen, der sie erschaffen hatte,[b] Vater und Mutter zu ehren, einander zu lieben und sich selbst vor Unzucht, Unreinheit und allem Unrecht zu bewahren.
  to: Und im achtundzwanzigsten Jubiläum begann Noah, den Kindern seiner Kinder die Satzungen und Gebote sowie alle Rechtsentscheide[a], die er kannte, einzuschärfen. Er wies seine Kinder eindringlich darauf hin, gerecht zu handeln, ihre Blöße zu bedecken, den zu preisen, der sie geschaffen hat,[b] Vater und Mutter zu ehren, einander zu lieben und sich selbst vor Unzucht, Unreinheit und allem Unrecht zu bewahren.
  rationale: Die Revision korrigiert die fehlgeleitete Fußnote b und ordnet ihr eine quellennahe Erläuterung der markierten Schöpferformulierung zu. Außerdem wird ፍትሐ im rechtlichen Zusammenhang präziser als „Rechtsentscheide“ wiedergegeben, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen. Die dreigliedrige Schlussmahnung bleibt vollständig erhalten.
