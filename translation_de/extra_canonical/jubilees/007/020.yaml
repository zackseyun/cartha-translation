  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Inhalt und Reihenfolge des Geʿez insgesamt zuverlässig wieder: Noah unterweist seine Nachkommen über Satzungen, Gebote und Rechtswissen und mahnt zu gerechtem Handeln, Bedeckung der Blöße, Lobpreis des Schöpfers, Elternachtung, Nächstenliebe und sittlicher Bewahrung. Die Fußnote b ist jedoch sachlich falsch zugeordnet: Sie erläutert die Schlusswendung „ihre Seelen ... bewahren“, während der Anker im Text bei „der sie erschaffen hatte“ steht und entsprechend die Schöpferbezeichnung bzw. das wörtliche „den zu segnen“ erläutern muss.'
  naturalness: Das Deutsch ist überwiegend natürlich und würdig. „Alles, was er über Recht wusste“ ist jedoch weniger präzise und etwas schwerfällig; „alle Rechtsentscheide, die er kannte“ bildet die rechtliche Bedeutung im Kontext von Satzungen und Geboten klarer ab. „der sie erschaffen hatte“ kann ohne Bedeutungsverlust als „der sie geschaffen hat“ formuliert werden.
  terminology: „Satzungen und Gebote“, „Unzucht“, „Unreinheit“ und „Unrecht“ sind angemessen. Für ፍትሐ ist „Rechtsentscheide“ im unmittelbaren Kontext die treffendste Hauptwiedergabe; die möglichen weiteren Bedeutungen können in Fußnote a offengehalten werden. Die Fußnote zur wörtlichen Form von „ihre Seelen“ wird entfernt, da die reflexive Wiedergabe keine problematische theologische Festlegung erzeugt und kein passender Anker vorhanden ist.
