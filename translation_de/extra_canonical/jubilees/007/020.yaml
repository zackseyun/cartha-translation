    rationale: Der Marker [b] steht nach „der sie erschaffen hatte“, doch die Fußnote behandelt „ihre Seelen vor Unzucht ... zu bewahren“. Dies verletzt die Ankerzuordnung und ersetzt zudem die im englischen Audit Trail dokumentierte Erläuterung der Schöpferformulierung.
  - severity: low
    issue: „alles, was er über Recht wusste“ ist semantisch weiter und syntaktisch weniger klar als der rechtliche Kontext nahelegt.
    rationale: ፍትሐ kann zwar auch „Recht“ oder „Gerechtigkeit“ bedeuten, steht hier aber neben Satzungen und Geboten. „Rechtsentscheide, die er kannte“ wahrt den juristischen Sinn; die Fußnote dokumentiert die Mehrdeutigkeit.
