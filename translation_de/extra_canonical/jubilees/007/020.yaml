base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
translation:
  language: de
  text: Und im achtundzwanzigsten Jubiläum begann Noah, den Kindern seiner Kinder die Satzungen und Gebote sowie alle Rechtsentscheide[a], die er kannte, einzuschärfen. Er wies seine Kinder eindringlich darauf hin, gerecht zu handeln, ihre Blöße zu bedecken, den zu preisen, der sie geschaffen hat,[b] Vater und Mutter zu ehren, einander zu lieben und sich selbst vor Unzucht, Unreinheit und allem Unrecht zu bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“ beziehungsweise „Gerechtigkeit“.'
    reason: lexical_choice
  - marker: b
    text: 'Wörtlich: „den zu segnen, der sie geschaffen hat“.'
    reason: literal_translation
lexical_decisions:
- source_word: ይእዘዝ
  choice: einzuschärfen
  rationale: Das Kausativverb bezeichnet hier ein nachdrückliches Anweisen oder Gebieten; „einschärfen“ klingt im Deutschen natürlich und passt zur Weitergabe von Satzungen und Geboten.
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: die Satzungen und Gebote
  rationale: Die beiden rechtlich-ethischen Begriffe werden unterscheidbar und in traditionsnaher, zugleich verständlicher Sprache wiedergegeben.
- source_word: ፍትሐ
  choice: Recht
  rationale: Der Singular kann Recht, Gerechtigkeit oder richterliche Entscheidung bezeichnen. „Recht“ bewahrt hier die Breite des Begriffs und fügt sich in die Aussage über Noahs Wissen.
- source_word: አስምዐ
  choice: ermahnte
  rationale: Wörtlich liegt ein Bezeugen bzw. eindringliches Zeugnisgeben vor; im Kontext einer ethischen Unterweisung gibt „ermahnte“ die kommunikative Funktion idiomatisch wieder.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: die Blöße ihres Körpers
  rationale: Die Wendung bezeichnet die beschämende bzw. zu bedeckende Nacktheit des Fleisches. „Blöße ihres Körpers“ ist würdig und für heutige Leser verständlich.
- source_word: ለዘፈጠሮሙ
  choice: den zu preisen, der sie erschaffen hatte
  rationale: Die Relativkonstruktion wird nahe am Wortlaut erhalten, statt sie zum Titel „Schöpfer“ zu verdichten.
- source_word: አሐዱ፡ አሐዱ፡ ቢጾ
  choice: einander
  rationale: Die distributive Wendung bedeutet sinngemäß „jeder seinen Nächsten/Gefährten“; „einander“ gibt die gegenseitige Verpflichtung natürlich wieder.
- source_word: ይዕቀቡ፡ ነፍሶሙ
  choice: sich selbst ... zu bewahren
  rationale: Wörtlich „ihre Seelen bewahren“; hier bezeichnet „Seele“ die eigene Person bzw. das eigene Leben. Die reflexive deutsche Form vermittelt den Sinn ohne eine unnötige anthropologische Festlegung.
- source_word: ዝሙት፡ ... ርኵስ፡ ... ዐመፃ
  choice: Unzucht, Unreinheit und allem Unrecht
  rationale: Die dreigliedrige Lasterreihe wird vollständig beibehalten; „Unrecht“ gibt den breiten Schlussbegriff für gesetzeswidriges bzw. frevelhaftes Handeln wieder.
theological_decisions:
- issue: Bedeutung von ፍትሐ im Zusammenhang mit Satzungen und Geboten
  choice: Recht
  alternative: Rechtsentscheide; Gerechtigkeit
  rationale: „Recht“ lässt offen, ob primär die Rechtsordnung, gerechte Urteile oder Gerechtigkeit gemeint sind, und löst die begriffliche Spannung nicht einseitig auf.
- issue: Wiedergabe von „ihre Seelen bewahren“
  choice: sich selbst bewahren
  alternative: ihre Seelen bewahren
  rationale: Die Wendung ist hier eine Aufforderung zur persönlichen sittlichen Bewahrung. Die Übersetzung vermeidet, „Seele“ als vom Körper getrennten Bestandteil festzulegen; die wörtliche Form wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-weisheitlicher Färbung. „Jubiläum“, „Satzungen“, „Gebote“, „Blöße“ und „Unzucht“ bewahren den antiken Ton, ohne unnötig altertümliche Syntax. Die Satzstruktur wurde maßvoll gegliedert, die fortlaufende Mahnrede des Geʿez jedoch erhalten.
