base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: de
  text: 'Und dies sind die Söhne Sems: Elam, Assur und Arpachschad – dieser wurde zwei Jahre nach der Flut geboren – sowie Lud und Aram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: die Söhne Sems
  rationale: Die geezische Genitivverbindung bezeichnet Sems männliche Nachkommen und leitet die Namensliste ein.
- source_word: አይኅ
  choice: Flut
  rationale: Das Wort bezeichnet hier die Flut der Noaherzählung; „Flut“ ist im modernen Deutsch natürlich und traditionsneutral.
- source_word: ዝንቱ
  choice: dieser
  rationale: Das Demonstrativpronomen greift unmittelbar Arpachschad auf und leitet die eingeschobene Geburtsnotiz ein.
- source_word: ወሉድ
  choice: geboren wurde
  rationale: Das Partizip beziehungsweise Prädikat drückt die Geburt Arpachschads aus; die deutsche Passivform gibt dies idiomatisch wieder.
theological_decisions:
- issue: Bezug der chronologischen Notiz
  choice: Die Notiz „dieser wurde zwei Jahre nach der Flut geboren“ wird auf Arpachschad bezogen.
  alternative: Die Zeitangabe allgemein auf die Generation oder die gesamte Liste beziehen.
  rationale: Das unmittelbar vorausgehende Demonstrativpronomen im Singular verweist grammatisch auf Arpachschad.
translation_notes:
  register: Moderne, würdige Standardsprache. Die koordinierende Struktur der geezischen Namensliste bleibt erkennbar, wird aber mit Gedankenstrichen und „sowie“ lesbar gegliedert. Die Übersetzung folgt Vers 18 des geezischen Textes und nicht der irrtümlich zugeordneten Japhet-Liste aus Vers 19.
