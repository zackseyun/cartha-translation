  yaml_path: translation/extra_canonical/jubilees/007/030.yaml
  text: For thus Enoch, the father of your father, commanded his son Methuselah, and Methuselah commanded his son Lamech, and Lamech commanded me everything that his fathers commanded him.
translation:
  language: de
  text: Denn so gebot Henoch, der Vater eures Vaters, seinem Sohn Metuschelach, und Metuschelach gebot seinem Sohn Lamech, und Lamech gebot mir alles, was seine Väter ihm geboten hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዘዘ
  choice: gebot
  rationale: Das Verb bezeichnet ein verbindliches Anordnen oder Gebieten; „gebot“ bewahrt den würdevollen Ton und die wiederholte Weitergabe der Weisungen.
- source_word: አቡሁ፡ ለአቡክሙ
  choice: der Vater eures Vaters
  rationale: 'Die Genitivbeziehung wird entsprechend der äthiopischen Syntax wiedergegeben: Henoch ist der Vater des Vaters der Angeredeten.'
- source_word: ወእዱ
  choice: seinem Sohn
  rationale: Die Wendung bezeichnet die Sohnschaft; der folgende Name Metuschelach steht als Apposition zu „seinem Sohn“.
- source_word: አበዊሁ
  choice: seine Väter
  rationale: Der Plural verweist auf Lamechs Vorfahren und bewahrt die im Text betonte Überlieferungskette.
theological_decisions:
- issue: Genealogische Zuordnung Metuschelachs
  choice: Henoch gebot seinem Sohn Metuschelach
  alternative: Henoch, der Vater eures Vaters Metuschelach, gebot seinem Sohn
  rationale: Die Quellsyntax ordnet Metuschelach als Apposition zu „seinem Sohn“ und damit als Empfänger von Henochs Gebot ein. Die Alternative würde die Überlieferungskette genealogisch und syntaktisch verzerren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „gebot“ bleibt erhalten, weil sie die stufenweise Weitergabe der Weisungen hervorhebt; zugleich wird die Satzstruktur für heutige Leser klar und natürlich gestaltet.
