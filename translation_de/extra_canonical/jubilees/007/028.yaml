base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: de
  text: Drei Jahre lang darf die Frucht von allem, was gegessen wird, nicht geerntet werden. Im vierten Jahr soll deren Frucht geerntet werden, und die Erstlingsfrüchte sollen vor dem HERRN, dem Höchsten, dargebracht werden, der Himmel und Erde und alles erschaffen hat. Sie sollen reichlich den ersten Wein und das erste Öl als Erstlingsgaben auf dem Altar des HERRN darbringen; und was übrig bleibt, sollen die Diener des Hauses des HERRN vor dem Altar essen, der angenommen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ (fərēhu)
  choice: seine Frucht
  rationale: Bewahrt im zweiten Satz den pronominalen Rückbezug des Ge’ez; im ersten Satz wird die genitivische Gesamtfügung natürlich als „die Frucht von allem“ wiedergegeben.
- source_word: ዘኢይትቀሠም (za-ʾiyyətqassam)
  choice: darf … nicht geerntet werden
  rationale: Das Verb bezeichnet hier das Einsammeln beziehungsweise Ernten der Frucht; „darf nicht“ gibt die in der Unterweisung liegende normative Aussage idiomatisch wieder.
- source_word: ቀዳሜ ፍሬ (qadāmē fərē)
  choice: Erstlingsfrüchte / Erstlingsgabe
  rationale: Die Wendung bezeichnet die zuerst dargebrachte Frucht. Der Plural ist im Deutschen für Erntefrüchte natürlich; bei Wein und Öl passt der kollektive Singular „Erstlingsgabe“.
- source_word: እግዚአብሔር ልዑል (ʾƎgziʾabəḥēr ləʿul)
  choice: der HERR, der Höchste
  rationale: Gibt den Gottesnamen beziehungsweise Herrentitel und das Attribut „der Höchste“ getrennt und würdevoll wieder, ohne sie zu einer konfessionell geprägten Formel zu verschmelzen.
- source_word: ይትወከፍ (yətwakkaf)
  choice: annimmt
  rationale: Das Verb bezeichnet das Annehmen oder Entgegennehmen der Opfergabe; diese Bedeutung wird auch beim abschließenden Rückbezug auf den Altar erhalten.
theological_decisions:
- issue: Bezug des Annehmens im Schlusssatz
  choice: „der sie annimmt“ mit grammatischem Bezug auf den Altar
  alternative: „auf dem sie angenommen wird“ oder Bezug auf den HERRN
  rationale: Der Ge’ez-Relativsatz steht unmittelbar bei „Altar“ und wird formal bewahrt. Die Formulierung lässt die kultische Vorstellung stehen, ohne sie dogmatisch zu erklären.
- issue: Modalität des dreijährigen Ernteverbots
  choice: „darf … nicht geerntet werden“
  alternative: „soll … nicht geerntet werden“
  rationale: Der Kontext ist eine verbindliche Anweisung. „Darf nicht“ macht das Verbot im modernen Deutsch klar, ohne über den Quelltext hinaus eine Strafbestimmung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Wortschatz. „Erstlingsfrüchte“, „Erstlingsgabe“ und „Altar“ erhalten die sachliche Nähe zum antiken Opferkontext; unnötig archaische Formen werden vermieden.
