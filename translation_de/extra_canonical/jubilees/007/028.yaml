revisions:
- from: Drei Jahre lang darf die Frucht von allem, was gegessen wird, nicht geerntet werden.[a] Im vierten Jahr soll seine Frucht geerntet werden, und die Erstlingsfrüchte sollen vor dem HERRN, dem Höchsten, dargebracht werden, der Himmel und Erde und alles erschaffen hat. Den ersten Wein und das erste Öl sollen sie reichlich als Erstlingsgabe auf dem Altar des HERRN darbringen, der sie annimmt; und was übrig bleibt, sollen die Diener des Hauses des HERRN vor dem Altar essen, der sie annimmt.
  to: Drei Jahre lang darf die Frucht von allem, was gegessen wird, nicht geerntet werden. Im vierten Jahr soll deren Frucht geerntet werden, und die Erstlingsfrüchte sollen vor dem HERRN, dem Höchsten, dargebracht werden, der Himmel und Erde und alles erschaffen hat. Sie sollen reichlich den ersten Wein und das erste Öl als Erstlingsgaben auf dem Altar des HERRN darbringen; und was übrig bleibt, sollen die Diener des Hauses des HERRN vor dem Altar essen, der angenommen wird.
  rationale: Die alternative Fußnote wird entfernt, da die genitivische Deutung des ersten Satzes die sachgemäße Wiedergabe ist. Der passive Bezug auf den „angenommenen“ Altar wird in beiden Vorkommen source-näher und ohne die unklare aktive Personifikation wiedergegeben. Die Erstlingsgaben werden passend zu Wein und Öl pluralisch formuliert.
