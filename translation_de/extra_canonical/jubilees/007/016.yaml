  text: 'And behold, these three cities are near Mount Lubar: Sedeqetelebab in front of the mountain toward its east, Ne''elatama''uk toward the south, and Adataneses toward the sea.'
translation:
  language: de
  text: 'Und siehe, diese drei Städte liegen nahe beim Berg Lubar: Sedeqetelebab vor dem Berg auf seiner Ostseite, Ne’elatama’uk nach Norden[a] und Adataneses in Richtung Meer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Süden“. Der vorgelegte ge’ezische Text lautet hier „Norden“; eine abweichende Lesart beziehungsweise Textkorrektur versteht die Angabe als „Süden“.'
    reason: Die vorgelegte Quellenausgabe und die dokumentierte jüngste Revision weisen unterschiedliche Richtungsangaben auf.
lexical_decisions:
- source_word: ቅሩበ (qərubē)
  choice: liegen nahe bei
  rationale: Gibt die räumliche Nähe der drei Städte zum Berg in natürlichem modernem Deutsch wieder.
- source_word: በጽባሒሁ (baṣəbaḥihu)
  choice: auf seiner Ostseite
  rationale: Wörtlich mit dem Bereich von „Morgen“ verbunden und hier als Himmelsrichtung „Osten“ zu verstehen.
- source_word: ገጸ ሰሜን (gaṣa samēn)
  choice: nach Norden
  rationale: Der vorgelegte ge’ezische Text nennt ausdrücklich samēn, „Norden“; die abweichende Überlieferung beziehungsweise Korrektur „Süden“ wird in der Fußnote bewahrt.
- source_word: መንገለ ባሕር (mangala bāḥr)
  choice: in Richtung Meer
  rationale: Bewahrt die relationale Richtungsangabe, ohne ein bestimmtes Meer zu ergänzen.
