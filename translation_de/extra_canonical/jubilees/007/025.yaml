base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: de
  text: Denken und Begehren des Menschen ersinnen allezeit Nichtiges und Böses. Und der Herr vernichtete alles vom Angesicht der Erde wegen ihrer bösen Taten und wegen des Blutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Blut“ kann hier vergossenes Blut oder Blutschuld gemeint sein.
    reason: Die wörtliche Formulierung der Vorlage ist knapp und mehrdeutig; die Fußnote nennt naheliegende kontextuelle Bedeutungen, ohne eine davon in den Haupttext einzutragen.
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡
  choice: das Denken und Begehren
  rationale: Gibt beide Aspekte der inneren Gedanken- und Willenswelt wieder, ohne sie zu einer bloßen Aussage über das Wesen des Menschen zu verflachen.
- source_word: ይኄሊ፡
  choice: ersinnt
  rationale: Bewahrt den verbalen Sinn „denken, erwägen, ersinnen“ statt einer bloßen Kopula wie „ist“.
- source_word: ከንተ፡ ወእኩየ፡
  choice: Nichtiges und Böses
  rationale: Übersetzt beide ausdrücklich genannten Gegenstände; „Nichtiges“ bewahrt den Sinn von Leere, Vergeblichkeit oder Eitelkeit.
- source_word: በኵሉ፡ መዋዕል።
  choice: allezeit
  rationale: Eine würdige und geläufige Wiedergabe von „an allen Tagen/fortwährend“.
- source_word: ወደምሰሰ፡
  choice: tilgte
  rationale: Gibt die gewaltsame vollständige Beseitigung wieder und passt idiomatisch zur Wendung „vom Angesicht der Erde“.
- source_word: ደም፡
  choice: Blut
  rationale: Bewahrt die konkrete und zugleich mehrdeutige Ausdrucksweise der Vorlage, statt sie stillschweigend auf „Blutvergießen“ festzulegen.
theological_decisions:
- issue: 'Der Grund für das Gericht: „Blut“ oder ausdrücklich „Blutvergießen“'
  choice: wegen des Blutes
  alternative: wegen des Blutvergießens
  rationale: Die Vorlage nennt wörtlich „Blut“. Im Kontext kann damit vergossenes Blut beziehungsweise Blutschuld gemeint sein; die Hauptfassung lässt diese Spannung bestehen und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ersinnt“ erhält die aktive Aussage des ge’ezischen Verbs; „allezeit“ und „vom Angesicht der Erde“ wahren den gehobenen biblischen Klang, bleiben aber allgemein verständlich.
