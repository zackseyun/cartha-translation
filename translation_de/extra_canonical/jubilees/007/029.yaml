base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/029.yaml
  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: de
  text: Und im fünften Jahr sollt ihr eine Freigabe[a] vornehmen, damit ihr dies in Gerechtigkeit und Redlichkeit freigebt. Dann werdet ihr gerecht sein, und alles, was ihr pflanzt, wird gedeihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Gebot für das fünfte Jahr ist schwer zu deuten. Das zugrunde liegende Wort bezeichnet ein Freigeben, Erlassen oder Liegenlassen; wahrscheinlich ist eine landwirtschaftliche Praxis im Zusammenhang mit den unmittelbar zuvor genannten Erstlingsfrüchten gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ኅድገተ (ḥədgata) / ታሕድግዎ (taḥdəgəwo)
  choice: Freigabe / freigebt
  rationale: Das Wortfeld bezeichnet Loslassen, Erlassen oder Liegenlassen. „Freigabe“ bewahrt die Offenheit des schwer verständlichen landwirtschaftlichen Gebots, während das Verb die Wiederholung im Ge’ez wiedergibt.
- source_word: በጽድቅ (ba-ṣədq)
  choice: in Gerechtigkeit
  rationale: Gibt die moralisch-rechtliche Bedeutung von ṣədq direkt und würdig wieder.
- source_word: በርኅብ (ba-rəḥb)
  choice: in Großzügigkeit
  rationale: Das zugrunde liegende Wort kann Weite, Freigebigkeit oder Wohlergehen ausdrücken. Im Zusammenhang mit einer Freigabe ist „Großzügigkeit“ die natürlichste kontextuelle Wiedergabe.
- source_word: ወትጸድቁ (wa-təṣaddəqu)
  choice: Dann werdet ihr gerecht sein
  rationale: Bewahrt die eigenständige Aussage über die Angesprochenen, die nicht mit dem folgenden Satz über die Pflanzungen verschmolzen werden darf.
- source_word: ወይረኅብ፡ ኵሉ፡ ተክልክሙ (wa-yərəḥb kʷəllu takləkəmu)
  choice: und alles, was ihr pflanzt, wird gedeihen
  rationale: Gibt die Aussage vom Gedeihen beziehungsweise Wohlergehen der gesamten Pflanzung idiomatisch wieder.
theological_decisions:
- issue: Art der im fünften Jahr gebotenen Freigabe
  choice: Die Handlung wird allgemein als „Freigabe“ bezeichnet.
  alternative: Sie ausdrücklich als Sabbatjahr, Schuldenerlass oder konkretes Brachliegen zu bestimmen.
  rationale: Der Ge’ez-Text benennt ein Loslassen beziehungsweise Erlassen, legt hier aber die genaue Praxis nicht eindeutig fest. Die Übersetzung vermeidet daher eine konfessionelle oder gesetzessystematische Präzisierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzglieder des Ge’ez werden getrennt wiedergegeben, insbesondere die Aussage über die Gerechtigkeit der Angesprochenen und das anschließende Gedeihen ihrer Pflanzungen.
