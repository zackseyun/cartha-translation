  yaml_path: translation/extra_canonical/jubilees/007/010.yaml
  text: And he blessed Shem and said, “Blessed be the LORD, the God of Shem; and let Canaan be his servant.”
translation:
  language: de
  text: 'Und er segnete Sem und sagte: „Gepriesen sei der HERR, der Gott Sems! Kanaan soll sein Diener[a] sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sklave.'
    reason: Das geʿezische ገብር kann sowohl einen Diener als auch einen Sklaven bezeichnen.
lexical_decisions:
- source_word: ይትባረክ (yitbārak)
  choice: Gepriesen sei
  rationale: Bei Gott bezeichnet die Segensformel angemessen das Preisen Gottes; „gesegnet sei“ wäre im heutigen Deutsch missverständlich.
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: der HERR
  rationale: Der äthiopische Gotteshoheitstitel wird in würdiger deutscher Bibelsprache mit „der HERR“ wiedergegeben; zugleich entspricht dies der zugrunde liegenden Formel aus Genesis 9,26.
- source_word: ገብር (gabr)
  choice: Diener
  rationale: Das Wort kann je nach sozialem Kontext „Diener“ oder „Sklave“ bedeuten. „Diener“ eignet sich für den Haupttext, während die stärkere mögliche Bedeutung in der Fußnote erhalten bleibt.
- source_word: ገብሮ (gabro)
  choice: sein Diener
  rationale: Das maskuline Possessivpronomen des Quelltexts bleibt als „sein“ stehen, ohne den möglichen Bezug auf Sem oder den HERRN ausdrücklich festzulegen.
theological_decisions:
- issue: Bezugswort von „sein“ in „sein Diener“
  choice: 'Das Pronomen bleibt mehrdeutig: „sein Diener“.'
  alternative: „Sems Diener“ oder „Diener des HERRN“
  rationale: Der Quelltext nennt nur ein maskulines Pronomen. Eine ausdrückliche Zuordnung würde eine syntaktische und theologische Spannung auflösen, die der Text selbst offenlässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; „Gepriesen sei“ wahrt den Charakter einer feierlichen Segensformel. Das mehrdeutige Possessivpronomen wurde bewusst nicht erklärt.
