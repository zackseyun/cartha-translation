base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: de
  text: Und nun danke ich dir, mein Gott, dass du mich diesen Tag hast sehen lassen. Siehe, ich bin 175 Jahre alt, hochbetagt und reich an Tagen, und alle meine Tage waren Frieden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ
  choice: danke ich dir
  rationale: Gibt die direkte Dankesformel natürlich und zugleich quellennah wieder.
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ
  choice: du mich diesen Tag hast sehen lassen
  rationale: Bewahrt das konkrete Bild des Sehens, statt es zu 'erleben' oder 'erreichen' zu glätten.
- source_word: ወልደ፡ ፻ወ፸ወ፭ ክረምት
  choice: 175 Jahre alt
  rationale: Natürliche deutsche Wiedergabe der Altersangabe 'Sohn von 175 Jahren'.
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕል
  choice: hochbetagt und reich an Tagen
  rationale: '''Hochbetagt'' gibt das Vorgerücktsein im Alter idiomatisch wieder; ''reich an Tagen'' bewahrt die traditionelle Vorstellung erfüllter bzw. voller Lebenstage, ohne sie als moralische Vollkommenheit misszuverstehen.'
- source_word: ሰላመ
  choice: Frieden
  rationale: Behält den substantivischen Schluss und seine umfassende Bedeutung bei, statt ihn auf 'friedlich' zu verengen.
theological_decisions:
- issue: Göttliche Ermöglichung des erreichten Tages
  choice: dass du mich diesen Tag hast sehen lassen
  alternative: dass du mir diesen Tag gezeigt hast
  rationale: Die gewählte Form ist im Deutschen verständlich und bewahrt die Aussage, dass Gott das Erleben dieses Tages ermöglicht hat, ohne eine Vision oder Offenbarung einzutragen.
- issue: Charakterisierung der Lebenstage
  choice: alle meine Tage waren Frieden
  alternative: alle meine Tage verliefen friedlich
  rationale: Die ungewöhnliche prädikative Gleichsetzung bleibt erhalten und bewahrt die mögliche umfassendere Bedeutung von Wohlergehen, Ganzheit und Frieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. 'Siehe' und 'reich an Tagen' erhalten die feierliche Alters- und Abschiedsrede; die Syntax bleibt für heutige Leser verständlich.
