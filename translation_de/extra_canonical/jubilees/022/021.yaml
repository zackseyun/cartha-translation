  yaml_path: translation/extra_canonical/jubilees/022/021.yaml
  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: de
  text: 'Du aber, mein Sohn Jakob: Möge Gott, der Höchste, dir helfen, und möge der Gott des Himmels dich segnen und dich von ihrer Unreinheit und von all ihrem Irrtum fernhalten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: Du aber
  rationale: Gibt die hervorgehobene Anrede mit kontrastierendem Anschluss natürlich wieder; das enklitische Element kann je nach Kontext auch »auch du« bedeuten.
- source_word: አምላከ፡ ልዑል
  choice: der höchste Gott
  rationale: Bewahrt den Gottes-Titel und entspricht der attributiven Verbindung im Ausgangstext.
- source_word: ይርዳእከ
  choice: helfe dir
  rationale: Der jussivische Segenswunsch wird mit dem deutschen Konjunktiv I wiedergegeben.
- source_word: ወያግኅሥከ
  choice: und halte dich fern
  rationale: Gibt die Bitte um Entfernung beziehungsweise Absonderung idiomatisch wieder, ohne einen bereits eingetretenen Vorgang zu behaupten.
- source_word: ርእዮሙ
  choice: ihrer Unreinheit
  rationale: Folgt der im überlieferten Textzusammenhang und in der geprüften Konsultationsschicht bezeugten Bedeutung; gemeint ist eine verunreinigende Lebensweise, von der Jakob fernbleiben soll.
- source_word: ስሕተቶሙ
  choice: ihrem Irrtum
  rationale: Bewahrt den Sinn von Verirrung oder Fehlgehen, ohne ihn enger als bewusste Täuschung auszulegen.
theological_decisions:
- issue: Form der göttlichen Hilfe und Bewahrung
  choice: als Segenswunsch im Konjunktiv formuliert
  alternative: als Zusage im Indikativ
  rationale: Die Verbformen stehen im Zusammenhang einer Bitte beziehungsweise eines Segens; eine feste Zukunftszusage würde die Aussage stärker bestimmen als der Ausgangstext.
- issue: Absonderung von der Unreinheit anderer
  choice: »halte dich fern«
  alternative: »entferne dich« oder »reinige dich«
  rationale: Die Formulierung lässt Gott als Handelnden erkennen und vermeidet zugleich die nicht ausdrücklich genannte Vorstellung einer rituellen Reinigung Jakobs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der Anrede macht den anschließenden Segenswunsch klar, ohne die knappe Struktur des ge’ezischen Satzes unnötig auszubauen.
