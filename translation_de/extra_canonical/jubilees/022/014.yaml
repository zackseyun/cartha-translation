  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: de
  text: Sei stark vor den Menschen.[a] Und solange du über alle Nachkommen Sets herrschst, werden deine Wege und die Wege deiner Söhne als gerecht gelten, sodass sie zu einem heiligen Volk werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut ist schwierig. Im Ge’ez steht ausdrücklich „Nachkommen Sets“; die Aussage über Jakobs Stellung unter ihnen kann auch den Sinn haben, dass er unter den Menschen erhöht ist oder über sie herrscht.
    reason: segmentation_note
lexical_decisions:
- source_word: ኩን፡ ኃያለ
  choice: Sei stark
  rationale: Gibt den Imperativ mit dem prädikativen Ausdruck unmittelbar und natürlich wieder.
- source_word: በቅድመ፡ ሰብእ
  choice: vor den Menschen
  rationale: Formale Wiedergabe der Präpositionalfügung; die mögliche Bedeutung im Sinn von Ansehen oder Vorrang wird wegen der schwierigen Satzfügung in der Fußnote erläutert.
- source_word: ትሜብል
  choice: du ... herrschst
  rationale: Folgt der im überlieferten Kontext plausiblen Bedeutung von Erhöhung beziehungsweise Herrschaft, ohne die syntaktische Schwierigkeit zu verdecken.
- source_word: ኵሉ፡ ዘርአ፡ ሴት
  choice: alle Nachkommen Sets
  rationale: Bewahrt die ausdrückliche Nennung Sets; „Nachkommen“ ist im modernen Deutsch natürlicher als „Same“.
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: deine Wege und die Wege deiner Söhne
  rationale: Gibt die in der jüngsten Quellenprüfung bestätigten Pluralformen wieder.
- source_word: ይጸድቃ
  choice: werden ... als gerecht gelten
  rationale: Bewahrt den forensisch beziehungsweise wertend offenen Sinn von „gerecht sein/als gerecht erwiesen werden“ und entspricht dem pluralischen Verb.
- source_word: ለከዊነ፡ ሕዝብ፡ ቅዱስ
  choice: sodass sie zu einem heiligen Volk werden
  rationale: Gibt Zweck oder Folge der Konstruktion idiomatisch wieder und wahrt den kollektiven Ausdruck „heiliges Volk“.
theological_decisions:
- issue: Bedeutung der Rechtfertigungs- beziehungsweise Gerechtigkeitsformulierung
  choice: als gerecht gelten
  alternative: gerechtfertigt werden / gerecht sein
  rationale: Die Formulierung lässt offen, ob die Wege als gerecht anerkannt, erwiesen oder tatsächlich gerecht sein werden; sie vermeidet eine unnötige dogmatische Festlegung.
- issue: Bezug des heiligen Volkes
  choice: sie
  alternative: damit daraus ein heiliges Volk werde
  rationale: Das Pronomen knüpft am natürlichsten an die Söhne beziehungsweise ihre Nachkommenschaft an, ohne eine engere theologische Identifikation hinzuzufügen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche Aussage über Sets Nachkommen bleibt im Haupttext erhalten; die syntaktische und semantische Unsicherheit wird nicht geglättet, sondern in der Fußnote kenntlich gemacht.
