  yaml_path: translation/extra_canonical/jubilees/022/020.yaml
  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: de
  text: 'Sie haben kein Herz, um zu verstehen, und ihre Augen sehen nicht, was sie gemacht haben und wie sie in die Irre gehen, wenn sie zum Holz sagen: »Du bist mein Gott«, und zum Stein: »Du bist mein Herr und mein Retter.« Und sie gaben ihnen ein Herz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und sie gaben ihnen ein Herz.« Der Bezug von »ihnen« ist im knappen Wortlaut nicht näher erläutert. Einige Übersetzungen verstehen den Schluss stattdessen als Wiederholung des Versanfangs: »Und sie haben kein Herz.«'
    reason: Der Haupttext gibt die im vorgelegten ge’ezischen Text stehende positive Vergangenheitsform wieder. Die Fußnote dokumentiert die abweichende, auch in der englischen Konsultationsfassung vertretene Lesart, ohne die schwierige überlieferte Formulierung zu harmonisieren.
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  choice: Herz, um zu verstehen
  rationale: Bewahrt das konkrete biblische Bild des Herzens als Sitz des Denkens und Verstehens, ohne es auf den abstrakten Begriff „Verstand“ zu reduzieren.
- source_word: ምንተ፡ ገብሮሙ
  choice: was sie gemacht haben
  rationale: Gibt die Tätigkeit des Herstellens natürlich wieder und lässt im Zusammenhang erkennen, dass die selbst angefertigten Götzen gemeint sind.
- source_word: ይስኅቱ
  choice: in die Irre gehen
  rationale: Entspricht dem Sinn des Abirrens beziehungsweise Sich-Verfehlens und wahrt die religiös-moralische Dimension.
- source_word: መባሕሕየ
  choice: mein Retter
  rationale: Gibt die persönliche Anrede und die Bedeutung eines Befreiers beziehungsweise Retters idiomatisch und würdig wieder.
- source_word: ወአሀቡ፡ ሎሙ፡ ልብ
  choice: Und sie schenken ihnen ihr Herz
  rationale: Folgt der tatsächlich überlieferten positiven Verbform und versteht „ihnen“ als Rückbezug auf Holz und Stein. Das Präsens fügt sich in die allgemeine Beschreibung des fortdauernden Götzendienstes.
theological_decisions:
- issue: Schlussaussage über das Herz
  choice: Und sie schenken ihnen ihr Herz
  alternative: Und sie haben kein Herz
  rationale: Der vorgelegte ge’ezische Text lautet am Schluss sinngemäß „und sie gaben ihnen Herz“, während die englische Konsultationsfassung offenbar eine Wiederholung des Versanfangs voraussetzt. Da die Übersetzung vorrangig der originalsprachlichen Evidenz folgen und echte textliche Spannung nicht stillschweigend beseitigen soll, steht die überlieferte Lesart im Haupttext; die abweichende Auffassung wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das wiederholte Bild des Herzens und die direkte Götzenanrede bleiben erhalten. Die Satzführung ist gut verständlich, ohne den prophetisch-biblischen Ton zu glätten.
