  yaml_path: translation/extra_canonical/jubilees/022/028.yaml
  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: de
  text: Da legten sich beide zusammen auf ein Bett, und Jakob schlief an der Brust Abrahams, des Vaters seines Vaters. Abraham küsste ihn siebenmal, und sein Erbarmen und sein Herz freuten sich über ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Schlusssatz ist ungewöhnlich formuliert; wörtlich werden Abrahams Erbarmen und sein Herz als diejenigen bezeichnet, die sich über Jakob freuten.
    reason: segmentation_note
lexical_decisions:
- source_word: ውስተ፡ ዐራት፡ አሐቲ
  choice: auf ein Bett
  rationale: Gibt die Präpositionalfügung mit »Bett« und »ein/einzig« knapp und natürlich wieder.
- source_word: ውስተ፡ ሕፅነ፡ አብርሃም
  choice: an der Brust Abrahams
  rationale: ሕፅን bezeichnet Brust, Schoß oder bergende Umarmung; »an der Brust« passt hier natürlich zum schlafenden Jakob und bewahrt die körperliche Nähe.
- source_word: አቡ፡ አቡሁ
  choice: des Vaters seines Vaters
  rationale: Bewahrt die ausdrückliche Verwandtschaftsformel des Ausgangstextes, statt sie lediglich zu »seines Großvaters« zusammenzuziehen.
- source_word: ምሕረቱ
  choice: sein Erbarmen
  rationale: Gibt den Sinnbereich von Erbarmen, Mitgefühl und liebevoller Zuwendung wieder, ohne ihn auf bloße Zuneigung zu verengen.
- source_word: ወትሤሖ
  choice: freuten sich über ihn
  rationale: Bewahrt das im überlieferten Text vorhandene Verb des Sichfreuens beziehungsweise Wohlgefallens und bezieht das Objektsuffix auf Jakob.
theological_decisions:
- issue: Personifizierung von Erbarmen und Herz im Schlusssatz
  choice: sein Erbarmen und sein Herz freuten sich über ihn
  alternative: seine Zuneigung und sein Herz waren ihm zugewandt
  rationale: Die gewählte Fassung erhält sowohl das Verb des Sichfreuens als auch die auffälligen koordinierten Subjekte; eine glättende Umschreibung würde ein Element des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederholende Ausdruck »des Vaters seines Vaters« und die personifizierende Schlussformulierung wurden bewusst beibehalten, weil sie die Gestalt und Spannung des Ausgangstextes spiegeln.
