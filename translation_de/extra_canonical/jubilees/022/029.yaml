  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: de
  text: 'Und er segnete ihn von ganzem Herzen und sagte: »Der höchste Gott, der Gott aller und Schöpfer von allem, der mich aus Ur der Chaldäer herausgeführt hat, um mir dieses Land zum ewigen Erbbesitz zu geben und damit ich eine heilige Nachkommenschaft begründe – der Höchste sei in Ewigkeit gepriesen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልቡ
  choice: von ganzem Herzen
  rationale: Gibt die idiomatische Bedeutung von »mit seinem ganzen Herzen« in natürlichem, würdigem Deutsch wieder.
- source_word: አምላከ፡ ኵሉ፡ ወፈጣሪ፡ ኵሉ
  choice: der Gott aller und Schöpfer von allem
  rationale: Bewahrt die Wiederholung von »alle/alles« und unterscheidet zugleich Gottes Beziehung zu allen von seiner Rolle als Schöpfer der gesamten Schöpfung.
- source_word: ኡር፡ ዘከለዳውያን
  choice: Ur bei den Chaldäern
  rationale: Gibt die Zugehörigkeits- beziehungsweise Ortsangabe verständlich wieder, ohne das moderne Land »Chaldäa« vorauszusetzen.
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: dieses Land zum ewigen Erbbesitz
  rationale: Verbindet die Begriffe »Land« und »Erbbesitz« und erhält die zeitliche Bestimmung »für immer« in kompakter deutscher Form.
- source_word: ዘርአ፡ ቅዱሰ
  choice: eine heilige Nachkommenschaft
  rationale: »Nachkommenschaft« gibt das kollektive und genealogische Bedeutungsfeld von »Same« in heutigem Deutsch klar wieder.
theological_decisions:
- issue: Subjektwechsel im zweiten Zwecksatz
  choice: und damit ich eine heilige Nachkommenschaft begründe
  alternative: und um eine heilige Nachkommenschaft zu begründen
  rationale: Die Form አቅም ist erste Person Singular; daher ist Abraham das Subjekt. Die gewählte Fassung verhindert, dass der Satz fälschlich Gott als Subjekt der Begründung erscheinen lässt.
- issue: Ausdrückliche Wiederholung des Gottestitels im Schlusslob
  choice: der Höchste sei in Ewigkeit gepriesen
  alternative: er sei in Ewigkeit gepriesen
  rationale: Der Ausgangstext wiederholt ልዑል ausdrücklich; die Übersetzung bewahrt diese rhetorisch und theologisch bedeutsame Wiederholung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebets- und Segensregister. Der lange Satzbau des Ausgangstextes bleibt erhalten, wird aber durch den Gedankenstrich vor dem abschließenden Lobpreis klar gegliedert.
