  yaml_path: translation/extra_canonical/jubilees/022/022.yaml
  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: de
  text: Hüte dich, mein Sohn Jakob, eine Frau aus der Nachkommenschaft der Töchter Kanaans zu nehmen; denn seine ganze Nachkommenschaft soll von der Erde entwurzelt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll von der Erde ausgerottet werden“.'
    reason: „Entwurzelt“ gibt die Bildsprache des geʿezischen Verbs unmittelbar wieder; „ausgerottet“ ist eine idiomatischere, die vollständige Beseitigung ausdrückende Wiedergabe.
lexical_decisions:
- source_word: ተዐቀብ
  choice: Hüte dich
  rationale: Gibt die warnende Aufforderung natürlich und würdevoll wieder.
- source_word: አትንግእ፡ ብእሲተ
  choice: eine Frau … zu nehmen
  rationale: Bezeichnet im Kontext das Nehmen einer Frau zur Ehe; die knappe Form bewahrt den idiomatischen deutschen Ausdruck.
- source_word: ዘርአ፡ አዋልደ፡ ከናአን
  choice: Nachkommenschaft der Töchter Kanaans
  rationale: Bewahrt die genealogische Ausdrucksweise des Geʿez, ohne sie zu einer bloßen Volksbezeichnung zu glätten.
- source_word: ለሥራዊ፡ እምድር
  choice: soll von der Erde ausgerottet werden
  rationale: Der Verbalstamm vermittelt das Bild des Entwurzelns beziehungsweise vollständigen Beseitigens; „ausgerottet“ ist im Deutschen in Verbindung mit Nachkommenschaft natürlich und erhält den Bezug auf die Erde.
theological_decisions:
- issue: Reichweite des Gerichtsausspruchs
  choice: seine ganze Nachkommenschaft
  alternative: die ganze Nachkommenschaft Kanaans
  rationale: Das possessive Element bleibt entsprechend der Quelle erhalten. Der Bezug auf Kanaan ist aus dem vorangehenden Ausdruck erschließbar, ohne ihn im Haupttext ausdrücklich aufzulösen.
- issue: Modalität des angekündigten Gerichts
  choice: soll … ausgerottet werden
  alternative: ist zur Ausrottung bestimmt
  rationale: „Soll“ bewahrt die knappe, zukunftsgerichtete Bestimmung, ohne den Text stärker als ausdrückliche Prädestinationsaussage zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte väterliche Warnung bleibt erhalten; genealogische Sprache und Bildlichkeit werden nicht konfessionell ausgedeutet.
