  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: de
  text: Denn wegen der Verfehlung Hams ging Kanaan in die Irre, und seine ganze Nachkommenschaft wird von der Erde vertilgt werden. Von ihm wird am Tag des Gerichts weder ein Rest übrig bleiben noch jemand entkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: Verfehlung
  rationale: Gibt das moralisch schuldhafte Fehlverhalten wieder, ohne die mögliche Bedeutung unnötig auf einen bestimmten Tatbestand einzuengen.
- source_word: ስሕተ
  choice: ging … in die Irre
  rationale: Bewahrt die Aussage, dass Kanaan irrte beziehungsweise vom rechten Weg abkam, und vermeidet eine nicht ausdrücklich genannte konkrete Sünde.
- source_word: ዘርአ
  choice: Nachkommenschaft
  rationale: Entspricht dem kollektiven Sinn von „Same“ und klingt im modernen Deutschen natürlich und würdig.
- source_word: ይደመሰስ
  choice: wird … vertilgt werden
  rationale: Gibt die vollständige Vernichtung in einem dem Gerichtskontext angemessenen Register wieder.
- source_word: ተረፉ
  choice: Rest
  rationale: Erhält die im Ausgangstext verwendete Vorstellung eines verbleibenden Überrests.
- source_word: ዘይድኅን
  choice: entkommen
  rationale: Im Zusammenhang des Gerichtstags bezeichnet die Form jemanden, der gerettet wird beziehungsweise davonkommt; „entkommen“ bewahrt hier den konkreten Gerichtssinn.
- source_word: ዕለተ፡ ደይን
  choice: Tag des Gerichts
  rationale: Direkte und im Deutschen geläufige Wiedergabe der eschatologischen Gerichtsformel.
theological_decisions:
- issue: Verhältnis zwischen Hams Verfehlung und Kanaans Irrtum
  choice: 'Die zweistufige Aussage bleibt erhalten: Wegen Hams Verfehlung ging Kanaan in die Irre.'
  alternative: Kanaans Irrtum unmittelbar als Hams Verfehlung darstellen.
  rationale: Der ge'ezische Satz nennt Ham und Kanaan mit unterschiedlichen Prädikationen; diese Spannung darf nicht eingeebnet werden.
- issue: Umfang der angekündigten Vernichtung
  choice: Die Aussage gilt ausdrücklich Kanaans ganzer Nachkommenschaft und lässt weder Rest noch Entkommen zu.
  alternative: Die Aussage durch abschwächende Begriffe wie „fast alle“ oder „kaum jemand“ begrenzen.
  rationale: Der Quelltext formuliert umfassend und ohne solche Einschränkung.
- issue: Bedeutung von ዘይድኅን
  choice: „niemand entkommen“
  alternative: „niemand gerettet werden“
  rationale: Beides ist lexikalisch möglich; im parallelen Zusammenhang von Vernichtung und Gericht ist „entkommen“ natürlich, ohne eine weitergehende Heilslehre festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Lesbarkeit in zwei Sätze gegliedert; die kausale Folge, der umfassende Gerichtston und die Unterschiede zwischen Hams Verfehlung, Kanaans Irrtum und dem Schicksal seiner Nachkommenschaft bleiben erhalten.
