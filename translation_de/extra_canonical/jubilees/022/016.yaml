  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: de
  text: Und er reinige dich von aller Unreinheit und Befleckung, damit er dir all deine Schuld und deine unwissentlich begangenen Verfehlungen[a] vergibt. Er stärke und segne dich, und du mögest die ganze Erde erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Wendung ist textlich schwierig. Sie kann Verfehlungen bezeichnen, die aus Unwissenheit oder ohne volle Erkenntnis begangen wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኵሰት፡ ወርኩስ
  choice: Unreinheit und Befleckung
  rationale: Die zwei verwandten, aber getrennten Begriffe werden auch im Deutschen unterschieden; „Befleckung“ wahrt dabei den kultisch-moralischen Klang.
- source_word: ያስተስሪ
  choice: vergibt
  rationale: Das Verb bezeichnet hier die Beseitigung beziehungsweise Sühnung von Schuld; „vergibt“ ist im Zusammenhang natürlich und lässt den theologischen Sinn verständlich hervortreten.
- source_word: አበሳከ
  choice: deine Schuld
  rationale: Der Ausdruck kann Sünde, Übertretung oder Schuld bezeichnen. „Schuld“ passt zum folgenden Verb und vermeidet eine unnötige Präzisierung der Art des Vergehens.
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: deine unwissentlichen Verfehlungen
  rationale: Die schwierige Wendung verbindet Irrtum beziehungsweise Verfehlung mit Nichtwissen. Die Wiedergabe unterscheidet sie von der zuvor genannten Schuld, ohne den Grad der Verantwortlichkeit festzulegen.
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: du sollst die ganze Erde als Erbe erhalten
  rationale: Die Erbterminologie wird ausdrücklich bewahrt; die deutsche Formulierung ist zugleich klar und idiomatisch.
theological_decisions:
- issue: Verhältnis zwischen allgemeiner Schuld und aus Unwissenheit begangenen Verfehlungen
  choice: Beide Ausdrücke werden nebeneinandergestellt und nicht miteinander gleichgesetzt.
  alternative: Die zweite Wendung lediglich als nähere Erklärung der gesamten Schuld verstehen.
  rationale: Der ge’ezische Wortlaut scheint bewusste Schuld von Irrtümern aus mangelndem Wissen zu unterscheiden, ist aber textlich schwierig. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von ያስተስሪ
  choice: „vergibt“
  alternative: „sühnt“ oder „tilgt“
  rationale: „Vergibt“ ergibt einen natürlichen Gebets- und Segenszusammenhang, ohne eine bestimmte Sühnlehre in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit Segenscharakter. Die Parallelität der Bitten bleibt erhalten; altertümliche Verbformen und konfessionell geprägte Fachsprache werden vermieden.
