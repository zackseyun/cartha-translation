base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: de
  text: „Dieses Haus habe ich für mich gebaut[a], um meinen Namen darauf zu setzen, in dem Land, das dir und deinen Nachkommen für immer gegeben ist. Es wird »Haus Abrahams« heißen. Es ist dir und deinen Nachkommen für immer gegeben; denn du wirst mein Haus bauen und meinem Namen vor Gott für immer Bestand geben[b]. Deine Nachkommen und dein Name werden durch alle Generationen der Erde hindurch bestehen.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ kann hier sowohl den für Gottes Namen bestimmten Kultort als auch das später genannte „Haus Abrahams“, also dessen Geschlecht oder Dynastie, bezeichnen. Der Wortlaut lässt beide Ebenen anklingen.
    reason: ambiguity_note
  - marker: b
    text: 'Wörtlicher und etwas weniger idiomatisch: „meinen Namen vor Gott für immer fest begründen“ beziehungsweise „aufrichten“.'
    reason: translation_alternative
lexical_decisions:
- source_word: ቤተ (beta)
  choice: Haus
  rationale: Das Wort bezeichnet ein Haus oder einen Haushalt und trägt hier sowohl eine kultische als auch eine dynastische Bedeutung; „Haus“ bewahrt beides.
- source_word: ዘርእ (zarʾ)
  choice: Nachkommen
  rationale: Im Deutschen gibt „Nachkommen“ den kollektiven Sinn von „Same/Nachkommenschaft“ natürlich und geschlechtsübergreifend wieder.
- source_word: አንብር ስምየ ላዕሌሁ
  choice: meinen Namen darauf zu setzen
  rationale: Die konkrete Namensformel wird formalnah wiedergegeben, ohne sie vorschnell als bloße Benennung oder als Einwohnung auszulegen.
- source_word: ይቀውም / ታቀውም
  choice: bestehen / fest begründen
  rationale: Die Wurzel bezeichnet Stehen, Bestandhaben beziehungsweise Feststellen. Die kontextgerechten deutschen Wendungen bewahren diesen Zusammenhang.
- source_word: ወተሰምየ (erschlossener korrekter Text hinter dem fehlerhaften ወጎሳመይ)
  choice: und es wird … heißen
  rationale: Die überlieferungs- und kontextgestützte Lesart ist eine Form von „genannt werden“; sie vermeidet die durch den offensichtlichen Textfehler ausgelöste Fehlübersetzung „mein Volk“.
theological_decisions:
- issue: Bedeutungsumfang von „Haus“
  choice: Die kultische und die dynastische Bedeutung bleiben im Haupttext offen.
  alternative: Die erste Nennung ausdrücklich als Heiligtum und „Haus Abrahams“ ausdrücklich als Sippe oder Dynastie deuten.
  rationale: Der Wortlaut verbindet einen für Gottes Namen bestimmten Ort mit dem „Haus Abrahams“ und kann diese Ebenen bewusst ineinanderblenden.
- issue: Zeitform der Handlungen Jakobs
  choice: „du wirst … bauen“ und „… fest begründen“
  alternative: „du hast … gebaut“ und „… fest begründet“
  rationale: Die betreffenden äthiopischen Verbformen sind Imperfektformen und bezeichnen im erzählerischen Zusammenhang zukünftiges Handeln.
- issue: „meinen Namen vor Gott“
  choice: Die spannungsreiche Formulierung wird wörtlich-nah beibehalten.
  alternative: „meinen Namen als den Gottes“ oder „Gottes Namen“
  rationale: Eine Glättung würde die im Quelltext vorhandene Sprecher- und Bezugsfrage unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Verheißungsformel wurde erhalten. „Auf Erden“ steht nahe bei der Gabeformel, während die Satzgliederung im Deutschen lesbar bleibt; die ungewöhnliche Wendung „meinen Namen vor Gott“ wurde nicht dogmatisch geglättet.
