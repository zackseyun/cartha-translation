  yaml_path: translation/extra_canonical/jubilees/022/004.yaml
  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: de
  text: Und in jenen Tagen kam Ismael, um seinen Vater zu sehen, und die beiden kamen zusammen. Isaak schlachtete ein Opfer als Dankopfer und brachte es auf dem Altar dar, den sein Vater in Hebron errichtet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይርአይ፡ አባሁ
  choice: um seinen Vater zu sehen
  rationale: Gibt die finale bzw. absichtsanzeigende Konstruktion natürlich und eng am geʿezischen Wortlaut wieder.
- source_word: መሥዋዕተ፡ ለጽንሓሕ
  choice: ein Opfer als Dankopfer
  rationale: Bewahrt sowohl den allgemeinen Opferbegriff als auch die nähere Bestimmung als Dankopfer, ohne sie zu einer konfessionell geprägten Opferkategorie auszubauen.
- source_word: ወአዕረገ፡ ዲበ፡ ምሥዋዕ
  choice: und brachte es auf dem Altar dar
  rationale: Das Verb bezeichnet das Hinaufbringen bzw. Darbringen; im Opferkontext ist „darbringen“ im Deutschen idiomatisch und würdig.
- source_word: ዘገብረ፡ በኬብሮን
  choice: den sein Vater in Hebron errichtet hatte
  rationale: „Errichtet“ passt im Deutschen zu einem Altar besser als das wörtlichere „gemacht“; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
theological_decisions:
- issue: Art und Funktion des Opfers
  choice: Dankopfer
  alternative: Opfer zum Dank / Heilsopfer
  rationale: Die überlieferte Lesart wird als Dankopfer wiedergegeben. Eine genauere kultische Gleichsetzung mit einer bestimmten biblisch-hebräischen Opferklasse wäre aufgrund dieses Textes nicht sicher und wird daher vermieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die lange Satzkette des Geʿez wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert, ohne den Ablauf oder die Bezüge zu verändern.
