  text: For Isaac had many possessions in Beer-sheba, and Isaac would go and look at his possessions and return to his father.
translation:
  language: de
  text: Denn Isaak hatte großen Besitz in Beerscheba. Er ging immer wieder hin, sah nach seinem Besitz und kehrte zu seinem Vater zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Gibt die begründende Verknüpfung des Verses mit dem vorausgehenden Zusammenhang wieder.
- source_word: ብዙኅ፡ ጥሪቱ
  choice: hatte großen Besitz
  rationale: ጥሪት bezeichnet Besitz bzw. Habe; zusammen mit ብዙኅ wird der umfangreiche Besitz Isaaks ausgedrückt.
- source_word: በቤርሳቤ
  choice: in Beerscheba
  rationale: Natürliche deutsche Wiedergabe der Ortsangabe.
- source_word: የሐውር … ይዋሑ … ይገብእ
  choice: ging immer wieder hin, sah … und kehrte … zurück
  rationale: Die Imperfektformen schildern hier einen wiederholten Vorgang in der Vergangenheit. „Immer wieder“ macht diesen habituellen Aspekt im Deutschen deutlich.
- source_word: ይዋሑ፡ ጥሪተ
  choice: sah nach seinem Besitz
  rationale: Gibt die im Kontext bezeugte Bedeutung des Aufsuchens bzw. Nachsehens seines Besitzes idiomatisch wieder, ohne die sachlich unbegründete frühere Deutung als Zubereitung eines Festmahls zu übernehmen.
- source_word: ኀበ፡ አቡሁ
  choice: zu seinem Vater
  rationale: Wörtliche und natürliche Wiedergabe des Richtungsbezugs.
