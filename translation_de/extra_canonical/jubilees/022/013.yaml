  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: de
  text: 'Und er trat näher und küsste ihn. Dann sagte er: „Gesegnet seien mein Sohn Jakob und alle seine Söhne vom Herrn, dem Höchsten, für alle Zeiten. Der Herr gebe dir gerechte Nachkommen, und einige von deinen Nachkommen heilige er inmitten der ganzen Welt. Die Völker sollen dir dienen, und alle Völker sollen sich vor deinen Nachkommen niederwerfen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀርበ፡ ወስዐሞ
  choice: trat näher und küsste ihn
  rationale: Gibt die beiden aufeinanderfolgenden Verben direkt und in natürlichem Deutsch wieder.
- source_word: ቡሩክ
  choice: Gesegnet seien
  rationale: Die prädikative Segensformel wird als deutscher Segenswunsch wiedergegeben.
- source_word: ለኵሉ፡ ዓለማት
  choice: in alle Ewigkeit
  rationale: Die wörtliche Wendung „für alle Zeitalter“ entspricht idiomatisch einer zeitlich unbegrenzten Segensformel.
- source_word: ዘርአ፡ ጽድቅ
  choice: gerechte Nachkommen
  rationale: „Same“ bezeichnet hier kollektiv die Nachkommenschaft; das Genitivattribut der Gerechtigkeit wird natürlich adjektivisch wiedergegeben.
- source_word: ወ'እምውሉድከ፡ ይቀድስ
  choice: und einige von deinen Nachkommen heilige er
  rationale: Das aktive Verb bedeutet „heiligen“ und nicht „sich heiligen“; እም wird hier partitiv verstanden.
- source_word: ይትቀነዩ፡ ለከ
  choice: sollen dir dienen
  rationale: Das Verb bezeichnet Dienst beziehungsweise Unterordnung; die jussive Form der Segensrede bleibt erhalten.
- source_word: ይስግዱ፡ በቅድመ
  choice: sollen sich vor ... niederwerfen
  rationale: Bewahrt die konkrete Geste der Huldigung und die Präposition „vor“.
theological_decisions:
- issue: Urheber des Segens in der Wendung „vom Herrn, dem Höchsten“
  choice: Gesegnet seien ... vom Herrn, dem Höchsten
  alternative: Gesegnet seien ... dem Herrn, dem Höchsten
  rationale: Die Wiedergabe mit „vom“ versteht Gott als Quelle beziehungsweise Urheber des Segens, ohne den Satz zu einer ausdrücklichen Anbetungsformel umzuformen.
- issue: Heiligung eines Teils der Nachkommenschaft
  choice: einige von deinen Nachkommen heilige er
  alternative: von deinen Nachkommen heilige er sich selbst
  rationale: Die äthiopische Verbform ist aktiv, nicht reflexiv; die Präposition wird partitiv aufgefasst. So bleibt die Aussage über die Heiligung eines nicht näher bestimmten Teils der Nachkommen erhalten.
- issue: Unterordnung der Völker
  choice: Die Völker sollen dir dienen
  alternative: Die Völker werden dir dienen
  rationale: Der Kontext ist eine Segensrede; daher wird die verbale Form als Wunsch beziehungsweise Jussiv wiedergegeben, nicht als bloße Zukunftsaussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nachkommen“ vermeidet das heute missverständliche kollektive „Same“. Die parallelen Bezeichnungen „Völker“ und „Nationen“ spiegeln die Wiederholung des ge’ezischen አሕዛብ, ohne im Deutschen schwerfällig zu wirken.
