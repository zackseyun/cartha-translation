  to: 'Und er trat näher und küsste ihn. Dann sagte er: „Gesegnet seien mein Sohn Jakob und alle seine Söhne vom Herrn, dem Höchsten, für alle Zeiten. Der Herr gebe dir gerechte Nachkommen, und einige von deinen Nachkommen heilige er inmitten der ganzen Welt. Die Völker sollen dir dienen, und alle Völker sollen sich vor deinen Nachkommen niederwerfen.“'
