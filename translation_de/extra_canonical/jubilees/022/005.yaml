base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: de
  text: Und er brachte ein Heilsopfer dar und veranstaltete in Gegenwart seines Bruders Ismael ein großes Freudenmahl. Rebekka aber bereitete frische Brote aus neuem Getreide und gab sie ihrem Sohn Jakob, damit er sie Abraham, seinem Vater,[a] von den Erstlingsfrüchten des Landes bringe, sodass dieser davon esse und den Schöpfer von allem segne, bevor Abraham starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „seinem Vater“; Abraham war Jakobs Großvater. „Vater“ kann hier einen Vorfahren bezeichnen.
    reason: kinship_clarification
lexical_decisions:
- source_word: መድኃኒተ
  choice: Heilsopfer
  rationale: Das Wort bezeichnet hier ein Opfer des Heils beziehungsweise Friedens; „Heilsopfer“ bewahrt den traditionellen Opferbegriff, ohne ihn auf eine einzige mögliche Nuance zu verengen.
- source_word: ፍሥሓ
  choice: Freudenmahl
  rationale: Im Zusammenhang mit dem dargebrachten Opfer bezeichnet der Ausdruck Freude beziehungsweise Festfreude; „Freudenmahl“ gibt den festlichen Vorgang natürlich wieder.
- source_word: ጻፍንተ፡ ሐዳሰ፡ እምስርናይ፡ ኅዲስ
  choice: frische Brote aus neuem Getreide
  rationale: 'Die wiederholte Neuheitsangabe wird idiomatisch erhalten: frisch zubereitete Brote aus der neuen Ernte.'
- source_word: እምቀዳሚ፡ ፍሬ፡ ምድር
  choice: als Erstlingsfrüchte des Landes
  rationale: Die Wendung bezeichnet die ersten Erträge des Bodens und behält den kultisch-agrarischen Klang von Erstlingsfrüchten.
- source_word: ፈጣሪ፡ ኵሉ
  choice: den Schöpfer von allem
  rationale: Nahe Wiedergabe der ge'ezischen Gottesbezeichnung, in natürlichem modernem Deutsch.
theological_decisions:
- issue: Abrahams Verwandtschaftsbezeichnung gegenüber Jakob
  choice: seinem Vater
  alternative: seinem Großvater / dem Vater seines Vaters
  rationale: Der Quelltext hat ausdrücklich „seinem Vater“. Der biblische Sprachgebrauch kann „Vater“ auch für einen Vorfahren verwenden; die Übersetzung erhält diese Formulierung und erklärt die genealogische Beziehung in einer Fußnote.
- issue: Bedeutung des Opfers
  choice: Heilsopfer
  alternative: Friedensopfer
  rationale: Der Ausdruck kann mit Heil, Wohlergehen und Frieden verbunden sein. „Heilsopfer“ wahrt die lexikalische Breite und vermeidet eine unnötig enge Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Ton. Die Satzstruktur bleibt quellennah, wird aber durch „sodass dieser“ eindeutig und gut lesbar gegliedert.
