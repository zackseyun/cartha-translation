  to: Und er brachte ein Heilsopfer dar und veranstaltete in Gegenwart seines Bruders Ismael ein großes Freudenmahl. Rebekka aber bereitete frische Brote aus neuem Getreide und gab sie ihrem Sohn Jakob, damit er sie Abraham, seinem Vater,[a] von den Erstlingsfrüchten des Landes bringe, sodass dieser davon esse und den Schöpfer von allem segne, bevor Abraham starb.
