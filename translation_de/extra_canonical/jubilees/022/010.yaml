base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: de
  text: Mein Gott, deine Barmherzigkeit und dein Friede seien über deinem Diener und über den Nachkommen seiner Söhne, damit sie für dich ein erwähltes Volk und ein Erbteil aus allen Völkern der Erde seien, von jetzt an und durch alle Tage der Geschlechter der Erde, in alle Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: Mein Gott
  rationale: Gibt den ausdrücklich vorhandenen persönlichen Gottesruf wörtlich und natürlich wieder.
- source_word: ሣህልከ
  choice: deine Barmherzigkeit
  rationale: Bewahrt den zentralen Sinn von Güte, Erbarmen und gnädiger Zuwendung in einem geläufigen biblischen Ausdruck.
- source_word: ዘርአ፡ ውሉዱ
  choice: die Nachkommen seiner Söhne
  rationale: Gibt die Abstammungsformulierung verständlich wieder; „Samen seiner Söhne“ wäre formaler, im heutigen Deutsch jedoch missverständlich.
- source_word: ሕዝበ፡ ኅሩየ
  choice: ein erwähltes Volk
  rationale: Entspricht der Vorstellung eines ausgewählten beziehungsweise erwählten Volkes, ohne die Aussage konfessionell weiter auszudeuten.
- source_word: ወርስተ
  choice: und ein Erbteil
  rationale: Bewahrt die erbrechtliche und theologische Bildsprache des Ausgangstextes.
- source_word: እምኵሉ፡ አሕዛበ፡ ምድር
  choice: aus allen Völkern der Erde
  rationale: Gibt die Auswahlherkunft mit „aus“ wieder und vermeidet, das Verhältnis zu den übrigen Völkern über den Wortlaut hinaus festzulegen.
- source_word: ለኵሉ፡ ዓለማት
  choice: in alle Ewigkeit
  rationale: Natürliche, würdevolle Wiedergabe der äonischen Zeitformel; der unmittelbar vorausgehende Generationenausdruck bleibt daneben erhalten.
theological_decisions:
- issue: Bezug von „erwähltes Volk und Erbteil“
  choice: Plural „sie“, bezogen auf die Nachkommen
  alternative: Singular „es“, bezogen auf die kollektiv verstandene Nachkommenschaft
  rationale: Im Deutschen nimmt der Plural den unmittelbar vorausgehenden Ausdruck „die Nachkommen“ natürlich auf. Die kollektive Einheit wird zugleich durch die singularischen Prädikatsnomen „ein Volk“ und „ein Erbteil“ bewahrt.
- issue: Erwählung aus den Völkern
  choice: „aus allen Völkern der Erde“
  alternative: „vor allen Völkern der Erde“ oder „unter allen Völkern der Erde“
  rationale: Die Ausgangsformulierung bezeichnet am ehesten Herkunft beziehungsweise Auswahl aus der Gesamtheit; eine Rangordnung („vor“) wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Der lange Segenssatz und die gestaffelten Zeitangaben des ge'ezischen Textes bleiben erhalten, werden aber syntaktisch klar formuliert.
