  source_fidelity: Die Übersetzung gibt die Segensbitte, den Titel Gottes, die dreifache Bezugnahme auf die Segnungen (Abraham, Noah und Adam), das Bild ihres Ruhens auf dem heiligen Haupt der Nachkommenschaft sowie die zeitliche Ausdehnung korrekt wieder. „Durch alle Generationen hindurch“ bewahrt das ausdrücklich vorhandene „alle“; „bis in Ewigkeit“ entspricht der abschließenden Ewigkeitsformel.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen feierlichem Segensregister. Die Wiederholung von „mit denen er … gesegnet hat“ ist zwar bewusst parallel geführt, aber nicht unnatürlich. Die Formulierung „auf dem heiligen Haupt deiner Nachkommen“ folgt dem Bild der Vorlage und ist im Kontext verständlich.
  terminology: „Der höchste Gott“, „Segnungen“, „Nachkommen“ und „Ewigkeit“ sind sachgerecht und registerangemessen. „Nachkommen“ überträgt das genealogische Bild von „Same“ idiomatisch, ohne eine theologisch spezifizierende Einengung vorzunehmen. Der Fußnotenanker steht an der einschlägigen Generationsformel.
