base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: de
  text: Der höchste Gott gebe dir all die Segnungen, mit denen er mich gesegnet hat und mit denen er Noah und Adam gesegnet hat. Sie mögen auf dem heiligen Haupt deiner Nachkommen ruhen, durch alle Generationen hindurch[a] und bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Generation zu Generation«.'
    reason: Die ge’ezische Wendung verbindet „alle“ mit einer verdoppelten Generationsformel; sowohl die ausdrückliche Gesamtheit als auch die idiomatische Folge von Generation zu Generation sind im Ausdruck angelegt.
lexical_decisions:
- source_word: ልዑል
  choice: der höchste
  rationale: Gibt den göttlichen Titel „der Höchste“ in natürlichem, würdigem Deutsch wieder; zusammen mit „Gott“ ergibt sich „der höchste Gott“.
- source_word: ኵሎን፡ በረከታተ
  choice: all die Segnungen
  rationale: Bewahrt die ausdrückliche Gesamtheit der Segnungen und klingt im Deutschen idiomatisch.
- source_word: ያዕርፉ
  choice: ruhen
  rationale: Entspricht dem Bild, dass die Segnungen auf dem Haupt des Nachkommens beziehungsweise der Nachkommenschaft verbleiben.
- source_word: ዘርእከ
  choice: deiner Nachkommen
  rationale: Das Wort bezeichnet „Same“ beziehungsweise Nachkommenschaft. „Nachkommen“ vermittelt den gemeinten genealogischen Sinn in heutigem Deutsch, ohne das Bild unnötig biologisch zu formulieren.
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: durch alle Generationen hindurch
  rationale: Gibt den ausdrücklichen Quantifikator „alle“ wieder und wahrt zugleich die fortlaufende Abfolge der Generationen.
- source_word: ወእስከ፡ ለዓለም
  choice: und bis in Ewigkeit
  rationale: Bewahrt die zeitliche Ausdehnung „bis“ und die traditionelle, verständliche Wiedergabe des Ewigkeitsbegriffs.
theological_decisions:
- issue: Bezug des heiligen Hauptes
  choice: auf dem heiligen Haupt deiner Nachkommen
  alternative: auf dem Haupt deines heiligen Nachkommens
  rationale: Die Wortfolge kann im Deutschen unterschiedlich bezogen werden. Die gewählte Fassung folgt dem naheliegenden Anschluss von „heilig“ an „Haupt“ und lässt „Nachkommen“ kollektiv beziehungsweise generationsübergreifend verstehen, ohne einen einzelnen messianischen Nachkommen ausdrücklich festzulegen.
- issue: Segnungen als Subjekt des zweiten Satzes
  choice: Sie mögen ... ruhen
  alternative: Mögen all diese Segnungen ... ruhen
  rationale: Das Pronomen hält den Rückbezug auf sämtliche zuvor genannten Segnungen klar und bewahrt den Segenswunsch, ohne eine stärkere Zusage daraus zu machen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Segensstil. Die wiederholte Formulierung „mit denen er ... gesegnet hat“ wurde beibehalten, weil sie die feierliche Parallelität der Vorlage trägt. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Zeitangabe.
