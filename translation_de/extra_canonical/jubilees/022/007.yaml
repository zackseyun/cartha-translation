base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: de
  text: Und er aß und trank und pries Gott, den Höchsten, der Himmel und Erde erschaffen, den ganzen Ertrag der Erde hervorgebracht und ihn den Menschenkindern gegeben hat, damit sie essen und trinken und ihren Schöpfer preisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ / ይባርኩ
  choice: pries / preisen
  rationale: Das Verb bedeutet wörtlich „segnen“. Wenn ein Mensch Gott zum Gegenstand hat, gibt „preisen“ den gemeinten Sinn im natürlichen modernen Deutsch klarer wieder.
- source_word: ስብሐ፡ ምድር
  choice: Ertrag der Erde
  rationale: Die Wendung bezeichnet hier die Fülle beziehungsweise die guten Erzeugnisse des Landes. „Ertrag der Erde“ ist verständlich und vermeidet das im Deutschen irreführende wörtliche „Fett der Erde“.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Bewahrt die bildhafte, semitisch geprägte Bezeichnung „Kinder der Menschen“, klingt aber als Zusammensetzung flüssiger und würdevoll.
- source_word: ፈጣሪሆሙ
  choice: ihren Schöpfer
  rationale: Gibt das possessive Suffix und die rückbezügliche Beziehung zu den Menschenkindern genau wieder.
theological_decisions:
- issue: Wiedergabe des Segnens Gottes
  choice: Gott preisen
  alternative: Gott segnen
  rationale: „Gott segnen“ wäre formal näher, kann im heutigen Deutsch jedoch so verstanden werden, als vermittle der Mensch Gott Segen. „Preisen“ wahrt die hier gemeinte auf Gott gerichtete Lobhandlung, ohne eine konfessionelle Deutung einzutragen.
- issue: Bezug des Pronomens beim Geschenk
  choice: „ihn“ bezieht sich auf den ganzen Ertrag der Erde
  alternative: unpersönliche oder plurale Umschreibung
  rationale: Der singularische Sammelbegriff „Ertrag“ erlaubt eine klare Entsprechung zur Aussage, dass Gott das Hervorgebrachte den Menschen zur Nahrung gibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend erhaltener Satzstruktur. Die Partizipial- beziehungsweise Relativfolge des Ausgangstextes wird in einen gut lesbaren deutschen Relativsatz überführt; die drei abschließenden Handlungen bleiben parallel koordiniert.
