  source_fidelity: 'Die Übersetzung gibt die Abfolge und die syntaktischen Bezüge des geʿezischen Textes zuverlässig wieder: Essen und Trinken, das Preisen Gottes des Höchsten, Gottes Schöpfung von Himmel und Erde, das Hervorbringen des Ertrags der Erde sowie dessen Gabe an die Menschen zum Essen, Trinken und Preisen ihres Schöpfers. „Ertrag der Erde“ ist für ስብሐ፡ ምድር eine kontextgerechte Wiedergabe und stimmt mit dem englischen Audit-Trail („produce of the earth“) überein.'
