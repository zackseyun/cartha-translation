base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: de
  text: Und es geschah in der ersten Jahrwoche, im vierundvierzigsten Jubiläum[a], im zweiten Jahr dieser Jahrwoche – dem Jahr, in dem Abraham starb –, dass Isaak und Ismael vom Brunnen des Eides kamen, um bei ihrem Vater Abraham das Wochenfest zu feiern, dieses Fest der Erstlinge der Ernte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vor der ausgeschriebenen Angabe „vierundvierzigstes Jubiläum“ steht im überlieferten Text zusätzlich das Zahlzeichen ፪ („2“). Der ausgeschriebene Wortlaut lautet jedoch eindeutig „vierundvierzigstes“.
    reason: textual_variant
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Im chronologischen Zusammenhang des Jubiläenbuches bezeichnet das Wort eine Siebenjahresperiode; „Jahrwoche“ ist präziser als das missverständliche bloße „Woche“.
- source_word: ኢዮቤልዉ
  choice: Jubiläum
  rationale: Bewahrt das charakteristische chronologische System des Buches, in dem ein Jubiläum aus sieben Jahrwochen besteht.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Brunnen des Eides
  rationale: Gibt die Bedeutung der ge’ezischen Ortsbezeichnung transparent wieder, statt ohne Erklärung nur den geläufigen Namen Beerscheba einzusetzen.
- source_word: በዓለ፡ ሱባዔያት
  choice: Wochenfest
  rationale: Bezeichnet den Festnamen natürlich und verständlich im Deutschen.
- source_word: ቀዳሚ፡ ማእረር
  choice: Erstlinge der Ernte
  rationale: Die Wendung verweist auf die Erstlingsgabe der Ernte; so bleibt der kultische Bezug erhalten, ohne sie fälschlich als „erstes Fest“ zu deuten.
- source_word: ኀበ፡ አብርሃም፡ አቡሆሙ
  choice: bei ihrem Vater Abraham
  rationale: ኀበ kann eine Bewegung zu einer Person beziehungsweise den Aufenthalt bei ihr ausdrücken. Im Deutschen verbindet „bei“ den Zielpunkt natürlich mit dem gemeinsamen Feiern, ohne mehr festzulegen als der Kontext.
theological_decisions:
- issue: Verhältnis von Wochenfest und Ernteerstlingen
  choice: „das Wochenfest … dieses Fest der Erstlinge der Ernte“
  alternative: „das erste Erntefest“
  rationale: Die gewählte Fassung erhält den kultischen Bezug auf die Erstlinge und vermeidet die unbelegte Aussage, es handle sich lediglich um das zeitlich erste Erntefest.
- issue: Abrahams Tod und die Ankunft seiner Söhne
  choice: „dem Jahr, in dem Abraham starb“
  alternative: „nachdem Abraham gestorben war“
  rationale: Der Quelltext bestimmt das betreffende Jahr, sagt aber nicht, Abraham sei schon vor ihrer Ankunft gestorben. Die zeitliche Spannung bleibt daher bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die buchtypische Jubiläums- und Jahrwochenchronologie bleibt ausdrücklich erhalten; der lange Satz wird durch Gedankenstriche gegliedert, ohne seine inhaltliche Struktur aufzulösen.
