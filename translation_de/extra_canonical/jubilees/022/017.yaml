  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: de
  text: Und möge er seinen Bund mit dir erneuern, damit du ihm für alle Zeitalter ein Volk zum Erbe seist und damit er dir und deinen Nachkommen in Wahrheit und Gerechtigkeit an allen Tagen der Erde Gott sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ
  choice: seinen Bund erneuern
  rationale: Gibt das Verb „erneuern“ und das mit Suffix versehene „sein Bund“ unmittelbar und idiomatisch wieder.
- source_word: ሕዝበ፡ ለርስት
  choice: ein Volk zum Erbe
  rationale: Bewahrt die Erbteil-/Erbe-Metaphorik der Vorlage, ohne sie durch eine erklärende Deutung aufzulösen.
- source_word: ለኵሉ፡ ዓለማት
  choice: für alle Zeiten
  rationale: Das geezische ዓለማት bezeichnet hier im zeitlichen Zusammenhang Weltzeitalter beziehungsweise Zeitalter; „alle Zeiten“ ist im Deutschen natürlich und treffend.
- source_word: ለከ፡ ወለዘርእከ
  choice: dir und deinen Nachkommen
  rationale: ዘርእ bezeichnet wörtlich „Same“, wird genealogisch jedoch natürlich als „Nachkommen“ wiedergegeben.
- source_word: በሀልወ፡ ወዘበጽድቅ
  choice: in Wahrheit und Gerechtigkeit
  rationale: Folgt der überlieferten Bedeutung und erhält die beiden ethisch-theologischen Begriffe nebeneinander.
- source_word: በኵሉ፡ መዋዕለ፡ ምድር
  choice: solange die Erde besteht
  rationale: Idiomatistische Wiedergabe von „alle Tage der Erde“, die den zeitlichen Umfang ausdrückt, ohne eine Endlosigkeit über das Bestehen der Erde hinaus zu behaupten.
theological_decisions:
- issue: Gottes Verhältnis zum Volk und zu dessen Nachkommen
  choice: „damit er dir und deinen Nachkommen ein Gott sei“
  alternative: „damit er dein Gott und der Gott deiner Nachkommen sei“
  rationale: Die gewählte Fassung bewahrt die bündische Formulierung und die Zuordnung „dir und deinen Nachkommen“, ohne den Gedanken stärker auszudeuten.
- issue: Das Volk als Gottes Erbe
  choice: „ein Volk zum Erbe“
  alternative: „ein Volk als sein Erbteil“
  rationale: Die Vorlage enthält die Erbmetaphorik, lässt aber die genaue syntaktische Nuance knapp; die Fassung erhält diese Spannung und vermeidet die ausdrückliche Ergänzung „sein“ bei „Erbteil“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Segens- und Bundesstil. Das zweimalige „damit“ bildet die parallelen Zielsätze klar ab; „sei“ wahrt den Wunschcharakter des Satzes.
