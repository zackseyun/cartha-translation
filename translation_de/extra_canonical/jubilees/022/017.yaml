  source_fidelity: 'Die Grundstruktur des geezischen Segenssatzes ist zutreffend wiedergegeben: Erneuerung des Bundes, das Volk als Erbe für alle Zeitalter sowie Gottesverhältnis zu dir und deinen Nachkommen in Wahrheit und Gerechtigkeit. Die Formulierung „solange die Erde besteht“ ist jedoch gegenüber „an allen Tagen der Erde“ etwas interpretierend; außerdem sollte die Gottesbezeichnung hier ohne unbestimmten Artikel stehen.'
