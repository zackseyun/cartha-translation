  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: de
  text: 'Und er rief Jakob und sagte: „Mein Sohn Jakob, der Gott aller Dinge segne dich und stärke dich, Gerechtigkeit zu tun und seinen Willen vor ihm zu erfüllen. Er erwähle dich und deine Nachkommen, damit ihr ihm ein Volk des Erbteils seid, nach seinem Willen alle Tage.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ
  choice: der Gott über alles
  rationale: Gibt die Genitivverbindung als Gottes umfassende Hoheit wieder; natürlicher im Deutschen als „der Gott von allem“.
- source_word: ወያኃይለከ
  choice: und stärke dich
  rationale: Bewahrt den Segenswunsch und die Bedeutung des Verbs als Befähigung beziehungsweise Kräftigung.
- source_word: ለገቢረ፡ ጽድቅ
  choice: Gerechtigkeit zu üben
  rationale: Das Tun von Gerechtigkeit wird idiomatisch und zugleich nah an der Vorlage ausgedrückt.
- source_word: ወ'በዘርእከ
  choice: und deine Nachkommen
  rationale: „Nachkommen“ gibt das kollektiv gebrauchte „Same“ in modernem Deutsch verständlich wieder.
- source_word: ሕዝበ፡ ዘርስት
  choice: ein Volk des Erbteils
  rationale: 'Bewahrt die substantivische Erbteil-Terminologie und ihre mögliche doppelte Beziehung: ein Volk, das Gottes Erbteil ist beziehungsweise mit einem Erbteil verbunden ist.'
- source_word: በኵሉ፡ መዋዕለ
  choice: alle Tage
  rationale: Entspricht der zeitlichen Formel eng und bewahrt ihren feierlichen Klang.
theological_decisions:
- issue: Beziehung zwischen Erwählung, Jakob und seinen Nachkommen
  choice: „Er erwähle dich und deine Nachkommen, damit ihr … seid“
  alternative: „Er erwähle dich und deinen Samen, damit du … seist“
  rationale: Der kollektive Bezug der Nachkommenschaft wird im deutschen Plural transparent gemacht, ohne die Erwählung auf Jakob allein zu beschränken.
- issue: Bedeutung von „Volk des Erbteils“
  choice: Die Genitivfügung wird beibehalten.
  alternative: „ein Volk zu seinem Erbteil“
  rationale: Die Vorlage lässt offen, ob das Volk selbst Gottes Erbteil ist oder als Erbvolk charakterisiert wird; eine explizite Ergänzung wie „zu seinem“ würde diese Spannung stärker festlegen.
- issue: „seinen Willen vor ihm“
  choice: „seinen Willen vor ihm zu tun“
  alternative: „zu tun, was vor ihm wohlgefällig ist“
  rationale: Die ungewöhnliche Verbindung wird nicht harmonisierend umgedeutet; sowohl der Wille Gottes als auch das Handeln in seiner Gegenwart bleiben ausdrücklich erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht feierlichem Segensstil. Der Parallelismus der Bitten und die genuine Unschärfe der Erbteil-Formulierung bleiben erhalten.
