  yaml_path: translation/extra_canonical/jubilees/022/006.yaml
  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: de
  text: Auch Isaak sandte durch Jakob das Beste vom Dankopfer zu Abraham, damit er essen und trinken konnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ በእዴ፡ ያዕቆብ
  choice: sandte durch Jakob
  rationale: Die Wendung bedeutet wörtlich „sandte durch die Hand Jakobs“; im natürlichen modernen Deutsch gibt „durch Jakob“ das Mittlerverhältnis klar wieder.
- source_word: ዘይሤኒ፡ መሥዋዕተ፡ ዘመድኃኒት
  choice: das Beste vom Dankopfer
  rationale: ዘይሤኒ bezeichnet das Beste bzw. den besten Anteil. መሥዋዕት ist „Opfer“, und መድኃኒት kann hier im überlieferten kultischen Zusammenhang als Dank- bzw. Heilsopfer verstanden werden; „Dankopfer“ folgt der konsultierten Texttradition, ohne einen zusätzlichen theologischen Gedanken einzuführen.
- source_word: ይብላዕኒ፡ ወይስተይኒ
  choice: damit er esse und trinke
  rationale: Die beiden Verbformen drücken den Zweck der Sendung aus; die gehobenen Konjunktivformen bewahren den würdigen Erzählton.
theological_decisions:
- issue: Bezeichnung der Opferart
  choice: Dankopfer
  alternative: Heilsopfer / Opfer des Heils
  rationale: Das äthiopische ዘመድኃኒት ist formal mit Rettung oder Heil verbunden, wird in dieser Überlieferung jedoch als Bezeichnung eines Dankopfers verstanden. „Dankopfer“ ist im Deutschen verständlich und vermeidet die irreführende Vorstellung, das Opfer selbst bewirke Abrahams Heil.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung „auch Isaak“ wird beibehalten; die idiomatische Mittlerformel wird knapp als „durch Jakob“ wiedergegeben.
