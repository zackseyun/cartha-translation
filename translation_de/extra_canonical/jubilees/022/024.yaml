  verdict: revise
  source_fidelity: 'Die Satzfolge, die Unterscheidung zwischen dem Hinabsteigen in den Scheol und dem Gang zum Ort des Gerichts sowie die zweimalige Aussage des Weggenommenwerdens sind zutreffend wiedergegeben. Bei ጽሉአን ist »die Verhassten« als Haupttext jedoch im Deutschen missverständlich: Es bezeichnet primär Menschen, die von anderen gehasst werden, während das Wort im Kontext eine abwertende Bezeichnung meint. Die wertende Nuance sollte im Haupttext natürlicher abgebildet und die engere lexikalische Möglichkeit in der Fußnote erhalten werden.'
  naturalness: »Für alle … gibt es« ist im Deutschen idiomatischer als die eröffnende Konstruktion »Und für alle … gibt es«. »Die Abscheulichen« ist als kontextuelle abwertende Personenbezeichnung verständlicher als »die Verhassten«, ohne eine spezifische theologische Kategorie einzuführen.
  terminology: »Götzen«, »Land der Lebenden«, »Totenreich« und »Ort des Gerichts« sind passend. Eine Anmerkung zu »Totenreich« sollte ausdrücklich festhalten, dass der zugrunde liegende Ausdruck Scheol lautet und nicht mit dem anschließend genannten Gerichtsort gleichgesetzt wird. Dadurch wird auch die relevante englische Audit-Anmerkung sachgerecht berücksichtigt.
  issues:
