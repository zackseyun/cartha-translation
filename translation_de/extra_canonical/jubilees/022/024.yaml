base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: de
  text: Für alle, die Götzen anbeten, und für die Abscheulichen[a] gibt es keinerlei Hoffnung im Land der Lebenden; denn sie werden ins Totenreich[b] hinabsteigen und an den Ort des Gerichts gehen, und auf der Erde wird keine Erinnerung an sie bleiben. Wie die Söhne Sodoms von der Erde weggenommen wurden, so werden alle weggenommen werden, die Götzen anbeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Verhassten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: Scheol. Der Text unterscheidet das Hinabsteigen in den Scheol von dem anschließenden Gang zum »Ort des Gerichts«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: die Verhassten
  rationale: Das Wort geht auf die Wurzel ጸልአ, »hassen«, zurück und bezeichnet Verhasste bzw. Abscheuliche. »Unreine« wäre lexikalisch weniger genau; eine Fußnote nennt die im Kontext mögliche wertende Wiedergabe »die Abscheulichen«.
- source_word: ሲኦል (śəʾol)
  choice: Totenreich
  rationale: Das äthiopische Lehnwort entspricht Scheol. »Totenreich« ist im modernen Deutschen verständlich und vermeidet die Gleichsetzung mit »Hölle«, zumal der folgende »Ort des Gerichts« eigens genannt wird.
- source_word: ይትነሥኡ / ተንሥኡ
  choice: weggenommen werden / weggenommen wurden
  rationale: Die Form kann hier im Zusammenhang mit der Beseitigung der Söhne Sodoms als Wegnahme von der Erde verstanden werden. Die identische Wiedergabe erhält die Parallelität des Ausgangstextes.
- source_word: ዝክረ
  choice: Erinnerung
  rationale: Die Grundbedeutung ist »Erinnerung, Gedenken«. Die Formulierung gibt das Auslöschen ihres Gedenkens auf der Erde wieder, ohne sie enger auf ein sichtbares Denkmal festzulegen.
theological_decisions:
- issue: Verhältnis von Totenreich und Gericht
  choice: »ins Totenreich hinabsteigen und an den Ort des Gerichts gehen«
  alternative: »in die Hölle hinabsteigen«
  rationale: Der Text nennt Totenreich und Ort des Gerichts nacheinander. Die Übersetzung bewahrt diese Unterscheidung und setzt beide nicht stillschweigend mit der späteren Vorstellung der Hölle gleich.
- issue: Bedeutung von ጽሉአን
  choice: »die Verhassten« mit Fußnote
  alternative: »die Unreinen« oder »die Frevler«
  rationale: Die quellensprachliche Wortbildung spricht für »verhasst/abscheulich«. Die Übersetzung vermeidet sowohl den lexikalisch abweichenden Reinheitsbegriff als auch eine stärker interpretierende moralische Kategorie.
translation_notes:
  register: Moderne, würdige Standardsprache. »Götzen anbeten« und »Land der Lebenden« bewahren die biblische Bildwelt; »Totenreich« bleibt für heutige Leser verständlich. Die Wiederholung von »weggenommen« bildet die rhetorische Parallelität des ge'ezischen Textes nach.
