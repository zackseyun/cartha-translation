    issue: »die Verhassten« ist als Haupttext für ጽሉአን missverständlich.
    rationale: Modernes Deutsch versteht dies gewöhnlich passiv als Personen, die gehasst werden. Im vorliegenden Kontext ist eine abwertende Charakterisierung gemeint; »die Abscheulichen« gibt diese Funktion natürlicher wieder. Die mögliche engere Wiedergabe kann als Alternative vermerkt werden.
  - severity: low
    issue: Die begriffliche Anmerkung zum Scheol/Totenreich fehlt.
    rationale: Der Ausgangstext unterscheidet das Hinabsteigen in den Scheol vom Gang zum Ort des Gerichts. Eine Fußnote verhindert, dass »Totenreich« als Gleichsetzung mit »Hölle« oder dem Gerichtsort gelesen wird.
