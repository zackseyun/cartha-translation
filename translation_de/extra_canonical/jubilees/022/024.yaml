revisions:
- from: Und für alle, die Götzen anbeten, und für die Verhassten[a] gibt es keinerlei Hoffnung im Land der Lebenden; denn sie werden ins Totenreich hinabsteigen und an den Ort des Gerichts gehen, und auf der Erde wird keine Erinnerung an sie bleiben. Wie die Söhne Sodoms von der Erde weggenommen wurden, so werden alle weggenommen werden, die Götzen anbeten.
  to: Für alle, die Götzen anbeten, und für die Abscheulichen[a] gibt es keinerlei Hoffnung im Land der Lebenden; denn sie werden ins Totenreich[b] hinabsteigen und an den Ort des Gerichts gehen, und auf der Erde wird keine Erinnerung an sie bleiben. Wie die Söhne Sodoms von der Erde weggenommen wurden, so werden alle weggenommen werden, die Götzen anbeten.
  rationale: Die Revision ersetzt die im Deutschen semantisch schiefe Hauptlesart »die Verhassten« durch die kontextuell angemessenere wertende Bezeichnung »die Abscheulichen« und bewahrt die wörtlichere Möglichkeit in einer Fußnote. Eine zweite Fußnote sichert die im Ausgangstext und im englischen Audit hervorgehobene Unterscheidung von Scheol und Gerichtsort. Im Übrigen bleiben Parallelismus, Bildsprache und Aussagegehalt unverändert.
