  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: de
  text: Das Schwert des Feindes hat mich in allem, was du mir und meinen Kindern gegeben hast, nicht überwunden, alle Tage meines Lebens bis zum heutigen Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ
  choice: das Schwert des Feindes
  rationale: Gibt die Genitivverbindung wörtlich und in natürlichem, würdevollem Deutsch wieder.
- source_word: ኢሞአኒ
  choice: hat mich nicht überwunden
  rationale: Bewahrt die Aussage des Verbs vom Besiegen oder Überwinden und dessen Objekt in der ersten Person.
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ
  choice: bei allem, was du mir und meinen Kindern gegeben hast
  rationale: „Bei allem“ erhält die etwas offene Beziehung der Präposition zum Relativsatz, ohne sie deutend auf Besitz, Schutz oder Lebensumstände festzulegen; „mir und meinen Kindern“ gibt die beteiligten Empfänger idiomatisch wieder.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: alle Tage meines Lebens bis zum heutigen Tag
  rationale: Eine quellennah formulierte und zugleich geläufige deutsche Zeitangabe.
theological_decisions:
- issue: Bezeichnung des Gegners
  choice: Feind
  alternative: Widersacher
  rationale: Das äthiopische ጸላኢ bezeichnet allgemein einen Feind oder Gegner. „Feind“ wahrt den unmittelbaren Sinn, ohne die Gestalt ausdrücklich als Satan zu identifizieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die syntaktische Spannung von „bei allem, was …“ bleibt erhalten, statt sie durch eine theologisch oder sachlich engere Deutung aufzulösen.
