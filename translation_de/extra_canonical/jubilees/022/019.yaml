  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: de
  text: Sie schlachten ihre Opfer für die Toten, beten Dämonen an und essen in den Gräbern.[a] Alle ihre Werke sind nichtig und leer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie essen in den Gräbern“ bezieht sich wahrscheinlich auf kultische Totenmahle oder auf Mahlzeiten im Zusammenhang mit Totenbeschwörung.
    reason: Kulturelle Erläuterung einer für heutige Leser ungewöhnlichen Praxis, ohne die wahrscheinliche Deutung in den Haupttext einzutragen.
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ … ይዘብሑ
  choice: sie schlachten ihre Opfer
  rationale: Bewahrt die Wiederaufnahme des Opferbegriffs im Ausgangstext, klingt im modernen Deutschen aber weniger schwerfällig als „sie opfern ihre Opfer“.
- source_word: ለአብድነት
  choice: für die Toten
  rationale: Gibt die im Text bezeugte Ausrichtung der Opfer auf die Toten wieder, ohne die damit verbundene Praxis genauer zu bestimmen.
- source_word: ለአጋንንት፡ ይሰግዱ
  choice: beten Dämonen an
  rationale: „Anbeten“ gibt die kultische Verehrung prägnant und natürlich wieder; „Dämonen“ entspricht der übermenschlichen, negativen Geistwesenbezeichnung.
- source_word: በውስተ፡ መቃብራት፡ ይበልዑ
  choice: essen in den Gräbern
  rationale: Folgt der räumlichen Formulierung des ge'ezischen Textes und vermeidet die nicht ausdrücklich gegebene Präzisierung „auf/über den Gräbern“.
- source_word: ከንቱ፡ ወበከ
  choice: nichtig und leer
  rationale: Die koordinierte Doppelwendung wird mit zwei natürlichen deutschen Prädikatsadjektiven wiedergegeben; sie bewahrt den Sinn von Vergeblichkeit und Gehaltlosigkeit.
theological_decisions:
- issue: Art der Mahlzeiten in den Gräbern
  choice: Im Haupttext bleibt nur die räumliche Aussage „essen in den Gräbern“ stehen.
  alternative: Die Handlung als Totenmahl oder nekromantisches Kultmahl direkt im Text bezeichnen.
  rationale: Der kulturelle Zusammenhang legt eine kultische Deutung nahe, doch der Ausgangstext benennt sie nicht ausdrücklich; die mögliche Einordnung gehört deshalb in die Fußnote.
- issue: Beziehung zwischen den Toten und den Dämonen
  choice: Beide Satzglieder werden nebeneinandergestellt, ohne sie gleichzusetzen.
  alternative: Die Toten als Dämonen verstehen oder beide Aussagen zu einer einzigen kultischen Handlung verschmelzen.
  rationale: Der Ausgangstext unterscheidet die Opfer für die Toten vom Anbeten der Dämonen; diese theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die kultische Sprache bleibt deutlich, während ungewöhnliche Einzelheiten nicht geglättet oder konfessionell ausgedeutet werden.
