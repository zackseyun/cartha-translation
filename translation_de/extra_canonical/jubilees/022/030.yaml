  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: de
  text: 'Und er segnete Jakob und sagte: „Mein Sohn, an dem ich mich von ganzem Herzen und mit all meiner Zuneigung freue: Mögen deine Gnade und dein Erbarmen für alle Zeit auf ihm und seinen Nachkommen ruhen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut wechselt unvermittelt von der zweiten Person („deine Gnade“) zur dritten Person („auf ihm“). Diese grammatische Unebenheit des überlieferten Textes bleibt erhalten; möglicherweise richtet sich die Bitte an Gott.
    reason: textual_variant
lexical_decisions:
- source_word: ምሕረትየ
  choice: meiner Zuneigung
  rationale: Das Substantiv bezeichnet Erbarmen, Mitgefühl oder liebevolle Zuwendung; im Ausdruck über die Freude an Jakob gibt „Zuneigung“ den natürlichen Beziehungssinn wieder.
- source_word: ሣህለከ፡ ወምሕረትከ
  choice: deine Gnade und dein Erbarmen
  rationale: Die Suffixe -ከ sind in beiden Wörtern zweite Person Singular Maskulinum; daher ist „deine“ quellentreu und nicht „meine“.
- source_word: ይኩን፡ … ነዋኅ፡ ላዕሌሁ
  choice: Mögen … auf ihm … bleiben
  rationale: Die Wunschform wird als Gebet wiedergegeben; „bleiben“ vermittelt die zeitliche Dauer, die durch ነዋኅ ausgedrückt wird, in natürlichem Deutsch.
- source_word: ዘርኡ፡ ኵሎ፡ መዋዕለ
  choice: seinen Nachkommen … alle Tage
  rationale: ዘርኡ bedeutet wörtlich „sein Same“, idiomatisch „seine Nachkommen“. ኵሎ gehört zu „Tage“ und bedeutet daher nicht „alle seine Nachkommen“, sondern „alle Tage“.
theological_decisions:
- issue: Wechsel von der Anrede in der zweiten Person zur Rede über Jakob in der dritten Person
  choice: „deine Gnade … auf ihm“ beibehalten und mit einer Fußnote erläutern
  alternative: Die Fürbitte einheitlich als direkte Anrede („auf dir“) oder als Aussage in der ersten Person („meine Gnade“) formulieren
  rationale: Der überlieferte Text enthält tatsächlich zweite-Person-Suffixe bei „Gnade“ und „Erbarmen“, aber dritte-Person-Bezüge bei Jakob. Eine Glättung würde die grammatische und möglicherweise gebetartige Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtliche Wendung „sein Same“ wurde verständlich als „seine Nachkommen“ wiedergegeben; die ungewöhnliche Personenfolge wurde nicht stillschweigend harmonisiert.
