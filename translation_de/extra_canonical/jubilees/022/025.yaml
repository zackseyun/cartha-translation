  yaml_path: translation/extra_canonical/jubilees/022/025.yaml
  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: de
  text: Fürchte dich nicht, mein Sohn Jakob, und erschrick nicht, Sohn Abrahams! Der höchste Gott wird dich vor Verderbnis bewahren und dich von jedem Irrweg befreien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍራህ
  choice: Fürchte dich nicht
  rationale: Gibt den negierten Furcht-Aufruf direkt und idiomatisch wieder.
- source_word: አትደንግፅ
  choice: erschrick nicht
  rationale: Bewahrt gegenüber dem ersten Verbot die Nuance des Erschreckens bzw. Bestürztseins.
- source_word: አምላከ፡ ልዑል
  choice: der höchste Gott
  rationale: Natürliche deutsche Wiedergabe der Gottesbezeichnung; Kleinschreibung des Adjektivs innerhalb der Wortgruppe.
- source_word: ሙስና
  choice: Verderben
  rationale: Deckt den Bedeutungsbereich von Verderbnis, Verfall und schädigendem Verderben ab, ohne ihn unnötig auf moralische Korruption zu verengen.
- source_word: ኵሉ፡ ፍኖተ፡ ስሕተት
  choice: jedem Irrweg
  rationale: Idiomatiche Verdichtung von »jedem Weg des Irrtums«; erhält das Wegbild und den umfassenden Sinn.
- source_word: ይባልሕከ
  choice: dich … befreien
  rationale: Gibt den zweiten, zum Bewahren parallelen Rettungsakt verständlich wieder.
theological_decisions:
- issue: Verhältnis der beiden Verben zu den Präpositionalgruppen
  choice: »vor Verderben bewahren und dich von jedem Irrweg befreien«
  alternative: »vor Verderben und vor jedem Irrweg bewahren; er wird dich befreien«
  rationale: 'Die ge’ezische Satzstellung stützt zwei parallele Verbalklauseln: Bewahrung vor Verderben und Befreiung von jedem Weg des Irrtums. So bleibt auch das zweite Verb semantisch angebunden.'
- issue: Bedeutung von ስሕተት
  choice: Irrweg
  alternative: Weg der Sünde
  rationale: »Irrtum/Abirrung« wird ohne konfessionelle oder dogmatische Zuspitzung wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Anrede bleibt erhalten; der Parallelismus der beiden abschließenden Aussagen wird in natürlicher deutscher Syntax sichtbar gemacht.
