base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: de
  text: Und du, mein Sohn Jakob, denk an meine Worte und halte die Gebote Abrahams, deines Vaters. Sondere dich von den Völkern ab; iss nicht mit ihnen, handle nicht so wie sie und werde nicht ihr Gefährte. Denn ihre Taten sind unrein, und alle ihre Wege sind Befleckung, Gräuel und Unreinheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: denk an
  rationale: Gibt den Imperativ natürlich und unmittelbar wieder; gemeint ist ein wirksames Erinnern, das die folgenden Mahnungen bestimmt.
- source_word: ተፈለጥ፡ እምአሕዛብ
  choice: Sondere dich von den Völkern ab
  rationale: Bewahrt den ausdrücklichen Trennungsgedanken und gibt አሕዛብ hier kontextgemäß als „Völker“ wieder.
- source_word: ወኢትግበር፡ በከመ፡ ምግባሪሆሙ
  choice: handle nicht so wie sie
  rationale: Natürliches modernes Deutsch für das wörtlichere „handle nicht gemäß ihren Taten“, ohne den ethischen Bezug abzuschwächen.
- source_word: ቢጸ
  choice: Gefährte
  rationale: Das gehobene, aber verständliche Wort bewahrt den Sinn einer engen Gemeinschaft oder Verbundenheit.
- source_word: ርኩስ
  choice: unrein
  rationale: Entspricht dem kultisch-ethischen Bedeutungsfeld und funktioniert idiomatisch als prädikatives Adjektiv.
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: Befleckung, Gräuel und Unreinheit
  rationale: Bewahrt die dreigliedrige Häufung negativer Reinheits- und Abscheubegriffe, ohne sie zu einer einzigen Kategorie einzuebnen.
theological_decisions:
- issue: Absonderung von den Völkern
  choice: Die konkrete Mahnung wird ohne verallgemeinernden theologischen Zusatz wiedergegeben.
  alternative: Eine ausdrückliche Deutung als zeitloses Verbot jedes Umgangs mit Nichtisraeliten.
  rationale: Der Ausgangstext fordert Trennung, gemeinsames Essen zu meiden und ihre Handlungsweise nicht zu übernehmen; über Reichweite und spätere Anwendung entscheidet der Vers selbst nicht.
- issue: „Abraham, dein Vater“
  choice: Die genealogisch-bundestheologische Bezeichnung bleibt wörtlich erhalten.
  alternative: „dein Großvater Abraham“
  rationale: Obwohl Abraham Jakobs Großvater ist, bezeichnet der Quelltext ihn ausdrücklich als Vater; diese traditionelle Abstammungsbezeichnung darf nicht korrigiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verbote und die abschließende Dreierreihe bleiben deutlich hörbar; unnötige Archaismen wurden vermieden.
