revisions:
- from: Und verlass ihn nicht und vernachlässige ihn nicht, von jetzt an bis in die Tage der Ewigkeit.[a] Deine Augen seien offen über ihm und über seinen Nachkommen,[b] damit du ihn behütest, ihn segnest und ihn heiligst zu einem Volk deines Erbbesitzes. Segne ihn mit all deinen Segnungen, von jetzt an und für alle Tage bis in Ewigkeit, und erneuere deinen Bund und deine Barmherzigkeit mit ihm und mit seinem Nachkommen nach deinem ganzen Willen in allen Generationen der Erde.«
  to: Und verlass ihn nicht und lass ihn nicht im Stich, von jetzt an bis in die Tage der Ewigkeit. Deine Augen seien auf ihn und auf seine Nachkommenschaft gerichtet,[a] damit du ihn behütest, ihn segnest und ihn zu einem Volk heiligst, das dein Erbbesitz ist. Segne ihn mit all deinen Segnungen, von jetzt an und für alle Tage bis in Ewigkeit, und erneuere deinen Bund und deine Barmherzigkeit mit ihm und mit seiner Nachkommenschaft nach deinem ganzen Willen in allen Generationen der Erde.«
  rationale: Die Revision korrigiert die Bedeutungsverschiebung bei der zweiten Verneinung, glättet zwei im Deutschen unnatürliche Konstruktionen und erhält zugleich die formale Bildlichkeit und die kollektive Offenheit von »Nachkommenschaft«. Die bisherige Fußnote zur Zeitformel entfällt, weil der Haupttext »bis in die Tage der Ewigkeit« bereits vollständig wiedergibt.
