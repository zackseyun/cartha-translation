base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: de
  text: Und verlass ihn nicht und lass ihn nicht im Stich, von jetzt an bis in die Tage der Ewigkeit. Deine Augen seien auf ihn und auf seine Nachkommenschaft gerichtet,[a] damit du ihn behütest, ihn segnest und ihn zu einem Volk heiligst, das dein Erbbesitz ist. Segne ihn mit all deinen Segnungen, von jetzt an und für alle Tage bis in Ewigkeit, und erneuere deinen Bund und deine Barmherzigkeit mit ihm und mit seiner Nachkommenschaft nach deinem ganzen Willen in allen Generationen der Erde.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Deine Augen seien offen über ihm und über seinem Nachkommen.«'
    reason: Die Fußnote bewahrt die räumliche Bildlichkeit der geʿezischen Wendung, während der Haupttext ihre idiomatische Bedeutung als wachsame Zuwendung ausdrückt.
lexical_decisions:
- source_word: አትኅድጎ፡ ወአትትሐየዮ
  choice: verlass ihn nicht und vernachlässige ihn nicht
  rationale: 'Die beiden verneinten Aufforderungen werden als verwandte, aber unterscheidbare Handlungen wiedergegeben: völliges Verlassen und mangelnde Fürsorge.'
- source_word: መዋዕለ፡ ዘለዓለም
  choice: die Tage der Ewigkeit
  rationale: Die ausdrückliche Nennung von »Tagen« bleibt erhalten, statt die Wendung lediglich mit »für immer« zusammenzufassen.
- source_word: አዕይንቲከ፡ ክሡታተ፡ ላዕሌሁ
  choice: Deine Augen seien offen über ihm
  rationale: Bewahrt das Bild offener Augen und die räumlich-fürsorgliche Bedeutung der Präposition, auch wenn die Formulierung im Deutschen ungewohnt ist.
- source_word: ዘርኡ
  choice: sein Nachkomme
  rationale: Der singularische Kollektivbegriff bezeichnet die fortdauernde Nachkommenschaft; »Nachkomme« erhält diese grammatische und heilsgeschichtliche Offenheit.
- source_word: ለሕዝብ፡ ዘለርስትከ
  choice: zu einem Volk deines Erbbesitzes
  rationale: Die Zugehörigkeitskonstruktion wird eng am Ausgangstext gehalten, ohne sie als Aussage über ein bestimmtes konfessionelles Verständnis des Erbes auszulegen.
- source_word: ሣህለከ
  choice: deine Barmherzigkeit
  rationale: Gibt die gnädige, erbarmende Zuwendung Gottes in einem würdigen und allgemein verständlichen Ausdruck wieder.
- source_word: በኵሉ፡ ፈቃድከ
  choice: nach deinem ganzen Willen
  rationale: Die umfassende Aussage über Gottes Willen wird bewahrt, ohne ihre syntaktische Beziehung enger festzulegen als die Quelle.
theological_decisions:
- issue: Heiligung des Nachkommen zum Erbvolk
  choice: »ihn heiligst zu einem Volk deines Erbbesitzes«
  alternative: »ihn als Volk für dein Erbe heiligst«
  rationale: Die gewählte Fassung erhält die Spannung zwischen dem singularischen Bezug auf den Nachkommen und seiner kollektiven Bestimmung als Volk.
- issue: Erneuerung von Bund und Barmherzigkeit
  choice: »erneuere deinen Bund und deine Barmherzigkeit mit ihm«
  alternative: »erweise ihm deinen Bund und deine Barmherzigkeit aufs Neue«
  rationale: Die koordinierte Bitte um Erneuerung beider Größen wird nicht geglättet; so bleibt die ungewöhnliche, aber theologisch offene Parallelität der Quelle sichtbar.
translation_notes:
  register: Moderne, würdige Gebetssprache mit direkter Anrede Gottes. Ungewöhnliche Bilder und syntaktische Spannungen der ge’ezischen Vorlage bleiben erkennbar, werden aber durch behutsame deutsche Satzführung lesbar gemacht.
