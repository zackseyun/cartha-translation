review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe der geʿezischen Vorlage sind getroffen: die doppelte negative Bitte, die Zeitformeln, die offene/aufmerksame Blickmetapher, der Nachkomme als Kollektivbegriff sowie Bund und Barmherzigkeit. »Vernachlässige ihn nicht« verschiebt die zweite Bitte jedoch zu bloß unzureichender Fürsorge; »lass ihn nicht im Stich« gibt die parallele Bitte um Nichtverlassen natürlicher und genauer wieder.'
  naturalness: »Deine Augen seien offen über ihm« und besonders »zu einem Volk deines Erbbesitzes« sind im modernen Standarddeutsch unnötig sperrig. Eine idiomatische Wiedergabe der Blickmetapher kann das Bild in einer Fußnote absichern, ohne die fürsorgliche Ausrichtung zu verlieren.
  terminology: »Nachkommenschaft« ist im Deutschen der natürliche kollektive Ausdruck für den singularischen Ausdruck »sein Same/Nachkomme«. »Erbbesitz« bleibt als bewusst formale, nicht konfessionell festgelegte Wiedergabe erhalten, wird aber syntaktisch klarer gefasst.
