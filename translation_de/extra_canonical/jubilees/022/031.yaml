    rationale: Die Vorlage und die englische Audit-Spur haben zwei eng parallele Verben des Verlassens bzw. Preisgebens. »Lass ihn nicht im Stich« wahrt die Unterscheidung zu »verlass ihn nicht«, ohne eine bloße Vernachlässigung einzuführen.
  - severity: medium
    issue: Die Formulierung »Deine Augen seien offen über ihm« ist im Deutschen nicht idiomatisch.
    rationale: Die geʿezische Metapher bezeichnet wachsame, zugewandte Aufmerksamkeit. »Deine Augen seien auf ihn ... gerichtet« ist natürlich; die wörtlichere räumliche Bildlichkeit wird in der Fußnote dokumentiert.
  - severity: low
    issue: Die Konstruktion »zu einem Volk deines Erbbesitzes« ist syntaktisch schwer verständlich.
    rationale: »Zu einem Volk, das dein Erbbesitz ist« macht die prädikative Zugehörigkeit explizit, ohne den ungewöhnlichen und auslegungsfähigen Begriff »Erbbesitz« zu ersetzen.
