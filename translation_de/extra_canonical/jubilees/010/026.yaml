lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: einen gewaltigen Wind
  rationale: Gibt das Substantiv „Wind“ mit dem verstärkenden Adjektiv „groß, mächtig“ in natürlichem modernem Deutsch wieder.
- source_word: ውስተ፡ ማኅፈድ
  choice: gegen den Turm
  rationale: Im Babelkontext bezeichnet ማኅፈድ den Turm; ውስተ wird bei der gerichteten Einwirkung des Windes idiomatisch mit „gegen“ wiedergegeben.
- source_word: ወገፍታአ፡ ውስተ፡ ምድር
  choice: und stürzte ihn zu Boden
  rationale: Der Objektsuffix bezieht sich im Kontext auf den Turm; „zu Boden stürzen“ bildet die gewaltsame Niederwerfung natürlich und prägnant ab.
- source_word: ወናሁ
  choice: Und siehe
  rationale: Bewahrt das deiktische Signal und den bewusst offenen Übergang zum folgenden Text.
