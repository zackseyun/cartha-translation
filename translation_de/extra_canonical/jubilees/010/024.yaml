  text: And the Lord sent a mighty wind against the tower, and it threw it down upon the earth.
translation:
  language: de
  text: Und der Herr sandte einen gewaltigen Wind in den Turm, der ihn zu Boden warf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bei einer anderen Versabgrenzung folgt hier: »Und siehe …«; die damit eingeleitete Aussage steht im nächsten Vers.'
    reason: Die ge’ezische fortlaufende Textgestalt enthält nach diesem Satz ወናሁ (»und siehe«), das inhaltlich den folgenden Satz eröffnet.
lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: einen gewaltigen Wind
  rationale: Die Verbindung bezeichnet einen großen beziehungsweise mächtigen Wind; »gewaltig« gibt Stärke und Wirkung in natürlichem Deutsch wieder.
