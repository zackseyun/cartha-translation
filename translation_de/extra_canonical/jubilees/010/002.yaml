  text: the unclean demons began to lead astray the children of the sons of Noah, and to make them err and destroy them.”
translation:
  language: de
  text: Die unreinen Dämonen begannen, die Kinder von Noahs Söhnen in die Irre zu führen, sie zum Irren zu bringen und sie zu vernichten.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: unclean demons (consultation layer; corresponding Geʽez wording is not included in the supplied excerpt)
  choice: die unreinen Dämonen
  rationale: Bewahrt sowohl die kultisch-moralische Kennzeichnung »unrein« als auch die personale Bezeichnung »Dämonen«.
- source_word: children of the sons of Noah
  choice: die Kinder der Söhne Noahs
