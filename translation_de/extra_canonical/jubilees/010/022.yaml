  to: Und der Herr, unser Gott, sagte zu uns:[a] »Siehe, sie sind ein einziges Volk, und dies haben sie zu tun begonnen. Nun wird ihnen nichts von dem, was sie sich vornehmen, verwehrt bleiben. Kommt, lasst uns hinabsteigen und ihre Sprachen verwirren, sodass einer die Rede des anderen nicht versteht. Dann werden sie über Länder und Völker zerstreut werden, und bis zum Tag des Gerichts wird unter ihnen kein gemeinsamer Plan mehr bestehen.«
