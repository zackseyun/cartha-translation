  text: And the Lord our God said to us[22], “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”
translation:
  language: de
  text: Und der Herr, unser Gott, sagte zu uns:[a] »Siehe, sie sind ein einziges Volk, und dies haben sie zu tun begonnen. Nun wird ihnen nichts von dem, was sie sich vornehmen, verwehrt bleiben. Kommt, lasst uns hinabsteigen und ihre Sprachen verwirren, sodass einer die Rede des anderen nicht versteht. Dann werden sie über Länder und Völker zerstreut werden, und bis zum Tag des Gerichts wird unter ihnen kein gemeinsamer Plan mehr bestehen.«
  philosophy: optimal-equivalence
