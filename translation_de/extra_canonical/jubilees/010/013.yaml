  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: de
  text: 'Und wir teilten Noah alle ihre Heilmittel mit, damit sie durch die Pflanzen der Erde geheilt würden. Noah schrieb alles, was wir ihn gelehrt hatten, in einem Buch nieder: alle Arten von Heilmitteln; und die Geister wurden gebunden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገርናሁ
  choice: wir erklärten Noah
  rationale: Das Verb bedeutet hier, jemandem etwas mitzuteilen bzw. darzulegen; „erklärten“ ergibt im Zusammenhang der vermittelten Heilkunde natürliches Deutsch.
- source_word: አስሕተትሙ
  choice: ihre Heilmittel
  rationale: Die Form bezeichnet Mittel bzw. Arzneien; das Possessivsuffix der 3. Person Plural bleibt mit „ihre“ erhalten.
- source_word: በዕፀወ፡ ምድር
  choice: durch die Pflanzen der Erde
  rationale: Gibt das instrumentale „durch“ und die Pflanzen der Erde eng am Wortlaut wieder, ohne den Ausdruck auf moderne Arzneipflanzen einzuengen.
- source_word: ትዝምደ፡ ፈውሳት
  choice: Arten von Heilmitteln
  rationale: Der Ausdruck beschreibt Gruppen beziehungsweise Arten von Heilungen oder Heilmitteln; diese Wiedergabe passt zum schriftlich festgehaltenen Heilwissen.
- source_word: ወተዐጸዉ፡ መናፍስት
  choice: und die Geister wurden gebunden
  rationale: Das Verb trägt die Vorstellung des Verschließens, Einschränkens oder Bindens. „Gebunden“ bewahrt die konkrete Aussage, ohne ein im Vers nicht genanntes Ziel oder Objekt zu ergänzen.
theological_decisions:
- issue: Charakterisierung der Geister
  choice: die Geister
  alternative: die bösen Geister
  rationale: Der überlieferte Wortlaut nennt hier nur „Geister“. Eine ausdrückliche Bewertung als böse wäre eine kontextuelle Ergänzung und wird daher nicht in den Haupttext aufgenommen.
- issue: Wirkung auf die Geister
  choice: wurden gebunden
  alternative: wurden zurückgehalten
  rationale: „Gebunden“ wahrt das kräftige Bild des Ausgangstextes; „zurückgehalten“ wäre idiomatisch, würde die Bildlichkeit jedoch abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den ge’ezischen Wortlaut. Die Satzstruktur bleibt übersichtlich; nicht im Vers enthaltene Angaben über die Geister oder die Söhne Noahs werden nicht ergänzt.
