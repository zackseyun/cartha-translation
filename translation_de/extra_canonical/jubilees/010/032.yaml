  yaml_path: translation/extra_canonical/jubilees/010/032.yaml
  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: de
  text: „Verflucht bist du, und verfluchter sollst du sein als alle Söhne Noachs, durch den Fluch, mit dem wir uns durch einen Eid gebunden haben.“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorgelegte ge’ezische Wortlaut endet mit „durch einen Eid gebunden haben“. Die im englischen Beratungstext folgenden Worte „vor dem heiligen Richter und vor Noach, unserem Vater“ stehen im bereitgestellten Ausgangstext nicht.
    reason: Kennzeichnet transparent die Abweichung zwischen dem bereitgestellten ge’ezischen Quellenwortlaut und der englischen Beratungsschicht; nicht im Ausgangstext belegte Worte werden nicht stillschweigend in den Haupttext aufgenommen.
lexical_decisions:
- source_word: ርጉም፡ አንተ
  choice: Verflucht bist du
  rationale: Gibt die nominale Fluchformel direkt und in würdigem, natürlichem Deutsch wieder.
- source_word: ወርጉመ፡ ትከውን
  choice: und verflucht sollst du sein
  rationale: Bewahrt den zukünftigen beziehungsweise folgerichtigen Sinn von ትከውን und den formelhaften Parallelismus.
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: mehr als alle Söhne Noachs
  rationale: Die Präposition እም kann in dieser Konstruktion einen Vergleich ausdrücken; „mehr als“ bewahrt die Steigerung der Verfluchung, ohne sie als bloße Zugehörigkeit zur Gruppe wiederzugeben.
- source_word: በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ
  choice: durch den Fluch, mit dem wir uns eidlich gebunden haben
  rationale: Gibt sowohl das Mittel („durch den Fluch“) als auch die gegenseitige, durch einen Eid bekräftigte Selbstbindung wieder.
theological_decisions:
- issue: Reichweite der Fluchformel
  choice: mehr als alle Söhne Noachs
  alternative: unter allen Söhnen Noachs
  rationale: Die komparative Lesart entspricht der Verbindung von እም mit dem Prädikatsbegriff „verflucht“ und bewahrt die im Ausgangstext angelegte Steigerung.
translation_notes:
  register: Moderne deutsche Standardsprache mit feierlichem, aber verständlichem Ton. Der formelhafte Parallelismus der Verfluchung bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
