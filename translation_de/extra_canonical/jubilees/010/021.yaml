  rationale: Das Verb bezeichnet das Bauen oder Errichten; das männliche Pronomen nimmt sinngemäß den Turm auf.
- source_word: ግንፋለ፡ ጽፍሑ
  choice: seine Breite
  rationale: Die überlieferte Maßangabe wird knapp und natürlich als Angabe der Breite wiedergegeben.
- source_word: ኑኅ
