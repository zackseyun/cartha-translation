base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: de
  text: Und sie bauten ihn dreiundvierzig Jahre lang. Seine Breite betrug 204 Ellen[a], und die Höhe eines Ziegels war ein Drittel einer Elle. Seine Höhe belief sich auf 5.433 Ellen und zwei Handbreit sowie zwölf Stadien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Maßangaben des Turms sind im äthiopischen Text besonders schwer zu deuten; einige Zahlen oder Maßeinheiten könnten verderbt überliefert sein. Die überlieferten Angaben werden hier möglichst wörtlich wiedergegeben, doch die genauen Abmessungen bleiben unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: ሐነጽዎ
