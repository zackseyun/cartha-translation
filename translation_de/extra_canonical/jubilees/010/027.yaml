  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: de
  text: Und es lag zwischen Assur und Babylon im Land Schinar. Und er nannte seinen Namen »Umsturz«. In der vierten Woche, im ersten Jahr, zu dessen Beginn, im vierunddreißigsten Jubiläum, wurden sie zerstreut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሱር፡ ወባቢሎን
  choice: Assur und Babylon
  rationale: Die Ortsnamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben.
- source_word: ሰናአር
  choice: Schinar
  rationale: Die etablierte deutsche biblische Namensform bewahrt den Bezug zur Landschaft Schinar.
- source_word: ደቀት
  choice: Umsturz
  rationale: Das Wort bezeichnet Fall, Zusammenbruch oder Umsturz; als vergebener Ortsname wird seine Bedeutung übersetzt statt bloß als »Deket« transkribiert.
- source_word: በመቅደመ፡ ዚአሁ
  choice: an deren Anfang
  rationale: Die Wendung bedeutet »an ihrem/dessen Anfang« und bezieht sich im Satz am natürlichsten auf die vierte Woche.
- source_word: በ፴ሳባ፡ ወአርባዕቱ፡ እዮቤልው
  choice: im vierunddreißigsten Jubiläum
  rationale: Die Zahl besteht aus dreißig und vier; die frühere Lesart »siebenunddreißig« widerspricht dem überlieferten Text.
- source_word: ተዘርዉ
  choice: wurden sie zerstreut
  rationale: Das passive Verb wird formal und ohne Ergänzung eines ausdrücklich nicht genannten Handelnden wiedergegeben.
