  text: And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—
translation:
  language: de
  text: 'Und er betete vor dem HERRN, seinem Gott, und sagte: »Gott der Geister allen Fleisches, der du mir Erbarmen erwiesen und mich und meine Söhne aus den Wassern der Sintflut gerettet hast und mich nicht hast umkommen lassen, wie du die Söhne des Verderbens umkommen ließest —«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: God of the spirits of all flesh
  choice: Gott der Geister allen Fleisches
  rationale: Bewahrt die feierliche, semitisch geprägte Gottesbezeichnung und ihren Bezug auf alles beseelte Fleisch, ohne sie erklärend einzuengen.
