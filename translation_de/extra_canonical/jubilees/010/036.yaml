  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: de
  text: Und er wohnte im Land Medien, nahe bei den Brüdern seiner Frau, bis auf diesen Tag. Seinen Wohnort und den Wohnort seiner Söhne nannte er Medien, nach ihrem Vater Madai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ሜድቂን
  choice: Land Medien
  rationale: Gibt die geografische Bezeichnung natürlich und in der im Deutschen üblichen Form wieder.
- source_word: አኀወ፡ ብእሲቱ
  choice: Brüdern seiner Frau
  rationale: Der Ge’ez-Ausdruck steht im Plural; daher ist „Brüdern“ gegenüber dem älteren Singular vorzuziehen.
- source_word: ምገባሪሁ
  choice: seinen Wohnort
  rationale: Bezeichnet den Ort seiner Niederlassung; „Wohnort“ ist gegenwärtiges, würdevolles Deutsch.
- source_word: ሜዲቂን
  choice: Medien
  rationale: Der Ortsname wird mit der etablierten deutschen Form wiedergegeben.
- source_word: ማዳይ
  choice: Madai
  rationale: Der Personenname wird transliteriert und damit von der geografischen Bezeichnung Medien unterschieden.
