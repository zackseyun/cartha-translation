  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: de
  text: Denn er liebte ihn mehr als alle seine Söhne. Und Noah entschlief bei seinen Vätern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: ihn
  rationale: Das äthiopische Wort ist ein selbstständiges Akkusativpronomen. Der Name des Bezugsträgers wird daher nicht in den Text eingesetzt.
- source_word: ያፈቅር፡ ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: liebte er mehr als alle seine Söhne
  rationale: Die Verbindung drückt eine gesteigerte beziehungsweise vergleichende Liebe gegenüber allen seinen Söhnen aus; die deutsche Formulierung gibt den Vergleich natürlich wieder.
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: Und Noah entschlief bei seinen Vätern
  rationale: Die traditionelle deutsche Wendung bewahrt das biblische Bild vom Tod und die Aussage, dass Noah zu seinen Vorfahren kam, ohne zusätzliche Angaben zu Tod oder Bestattung einzufügen.
theological_decisions:
- issue: Bezug des Pronomens „ihn“
  choice: Das Pronomen bleibt im Haupttext unaufgelöst.
  alternative: Einen Namen wie Sem oder Arpachschad einsetzen.
  rationale: Der vorgelegte ge’ezische Vers nennt keinen Namen. Eine ausdrückliche Identifizierung würde die kontextuelle Deutung in den Wortlaut eintragen; besonders „Arpachschad“ ist durch diesen Vers nicht gestützt.
- issue: Formulierung für Noahs Tod
  choice: „entschlief bei seinen Vätern“
  alternative: „starb und wurde zu seinen Vorfahren versammelt“
  rationale: Die gewählte Form bewahrt die Bildsprache des Ausgangstextes und vermeidet, nicht ausdrücklich genannte Vorgänge hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die pronominale Mehrdeutigkeit des Ausgangstextes bleibt erhalten; sachlich nicht belegte Namen und Bestattungsangaben werden nicht ergänzt.
