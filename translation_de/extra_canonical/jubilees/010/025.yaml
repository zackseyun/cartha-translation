  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: de
  text: Er liegt zwischen Assur und Babylon im Land Schinar. Man nannte ihn »Einsturz«.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird hier als »Einsturz« wiedergegeben. Seine genaue Form und Deutung in der äthiopischen Überlieferung sind unsicher; möglich sind auch »Umsturz« oder »Zerstörung«. Die Überlieferung beziehungsweise die herangezogene Lesung schwankt zudem beim Subjekt der Namengebung zwischen Singular und Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ደቀት (daqet)
  choice: Einsturz
