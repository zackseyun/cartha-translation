  naturalness: „Er liegt zwischen Assur und Babylon im Land Schinar“ ist für die Lage eines Bauwerks idiomatischer als „Er befindet sich“. Die unpersönliche Formulierung „Man nannte ihn“ ist natürliches modernes Standarddeutsch und vermeidet eine unbegründete Festlegung auf ein bestimmtes Subjekt.
  terminology: „Assur“, „Babylon“ und „Schinar“ sind die etablierten deutschen Formen. „Einsturz“ gibt den als Ruinen- bzw. Unheilsnamen verstandenen Namen angemessen wieder; dessen genaue äthiopische Form bzw. Etymologie bleibt unsicher.
