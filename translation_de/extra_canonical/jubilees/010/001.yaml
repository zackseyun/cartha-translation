  text: place of judgment.  And one of us said[1], “Let us teach Noah all their remedies, because
translation:
  language: de
  text: 'Ort des Gerichts. Und einer von uns sagte: »Lasst uns Noach alle ihre Heilmittel lehren, denn …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte geʿezische Textausschnitt setzt mit dem Fragment »Ort des Gerichts« ein und bricht nach »denn« ab; der Satz wird im folgenden Text fortgeführt.
    reason: segmentation_note
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: Ort des Gerichts
  rationale: Die geʿezische Nominalfügung enthält kein Verb. Daher bleibt sie als Fragment stehen, statt durch »wurde errichtet« oder Ähnliches ergänzt zu werden.
- source_word: ንምሀር
  choice: Lasst uns … lehren
  rationale: Die Kohortativform wird direkt wiedergegeben; »lehren« bewahrt die Grundbedeutung, auch wenn die Verbindung mit »Heilmittel« im Deutschen ungewöhnlich klingt.
- source_word: ፈውሶሙ
  choice: ihre Heilmittel
  rationale: Die Form bezeichnet Mittel bzw. Kenntnisse zur Heilung und enthält einen pluralischen Possessivbezug. Das Pronomen bleibt bewusst stehen, ohne seinen Bezug im fragmentarischen Vers aufzulösen.
- source_word: እስመ
  choice: denn
  rationale: Die begründende Konjunktion eröffnet einen Satz, dessen Fortsetzung im vorgelegten Segment fehlt; die Auslassungspunkte machen diesen Abbruch sichtbar.
theological_decisions:
- issue: Bezug von »ihre« bei den Heilmitteln
  choice: Der mehrdeutige Pronomenbezug wird beibehalten.
  alternative: Den Bezug ausdrücklich als Heilmittel der bösen Geister oder Dämonen bestimmen.
  rationale: Das isolierte Quellensegment benennt den Bezug nicht ausdrücklich; eine Konkretisierung würde Kontextinterpretation in den Haupttext eintragen.
- issue: Ergänzung eines Verbs bei »Ort des Gerichts«
  choice: Keine Ergänzung; Wiedergabe als Satzfragment.
  alternative: »Und der Ort des Gerichts wurde errichtet.«
  rationale: Im geʿezischen Wortlaut steht nur die Nominalfügung. Die fragmentarische Überlieferungs- bzw. Segmentgrenze darf nicht durch eine nicht belegte Aussage geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Heilmittel lehren« wurde aus Quellennähe beibehalten; Fragmentcharakter und syntaktischer Abbruch werden nicht geglättet.
