  yaml_path: translation/extra_canonical/jubilees/010/023.yaml
  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: de
  text: Und der Herr stieg hinab, und wir stiegen mit ihm hinab, um die Stadt und den Turm zu sehen, die die Menschenkinder gebaut hatten. Er verwirrte ihre Sprachen, sodass sie die Worte der anderen nicht mehr verstanden, und sie hörten auf, die Stadt und den Turm zu bauen. Darum wurde das ganze Land Schinar Babel genannt; denn dort verwirrte der Herr alle Sprachen der Menschenkinder, und von dort wurden sie in ihre Länder zerstreut, jeder nach seiner Sprache und seinem Volk.
  philosophy: optimal-equivalence
lexical_decisions:
