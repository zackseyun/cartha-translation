base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/011.yaml
  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
translation:
  language: de
  text: 'Er wusste, dass sie nicht in Aufrichtigkeit wandelten und nicht nach Gerechtigkeit strebten.[a] Und wir handelten ganz nach seinem Wort: Alle Bösen, die grausam waren, banden wir am Ort des Gerichts; und ein Zehntel von ihnen …'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text am Anfang des Verses ist schwierig. Die erste Wendung kann auch im Sinn von »nicht in Stärke/Festigkeit wandeln« verstanden werden; gemeint ist im Zusammenhang wohl ein Verhalten, dem Aufrichtigkeit und Gerechtigkeit fehlen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: በርቱዕ
  choice: in Aufrichtigkeit
  rationale: Das Wort kann hier Stärke, Festigkeit oder Rechtschaffenheit bezeichnen. Im Zusammenhang mit »wandeln« und der parallelen Wendung »nach Gerechtigkeit streben« gibt »in Aufrichtigkeit« den wahrscheinlichsten Sinn natürlich wieder, ohne die Schwierigkeit des äthiopischen Textes zu verschweigen.
- source_word: ዘይትባአሱ
  choice: streben
  rationale: Die Form bezeichnet ein Kämpfen oder Sichbemühen. »Nach Gerechtigkeit streben« bewahrt die aktive Bedeutung und entspricht dem Parallelismus.
- source_word: መካነ፡ ደይን
  choice: Ort des Gerichts
  rationale: Formale und verständliche Wiedergabe der räumlichen Gerichtsbezeichnung.
- source_word: ወዓሥራተሙ
  choice: und ein Zehntel von ihnen
  rationale: Die Satzhälfte ist im vorgelegten Vers unvollständig und wird deshalb nicht durch eine aus dem Folgevers erschlossene Aussage ergänzt.
theological_decisions:
- issue: Bezug von »seinem Wort«
  choice: seinem Wort
  alternative: allem, was er gesagt hatte
  rationale: Das Possessivpronomen bleibt wie im Quelltext unaufgelöst; eine bestimmte himmlische oder menschliche Bezugsperson wird nicht stillschweigend eingesetzt.
- issue: Unvollständiger Schluss des Verses
  choice: Auslassungspunkte nach »ein Zehntel von ihnen«
  alternative: Ergänzung der Handlung aus dem folgenden Vers
  rationale: Der bereitgestellte Quelltext endet mitten in der Konstruktion. Die Übersetzung wahrt diese Grenze und vermeidet eine nicht im Vers enthaltene Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wandeln« wurde beibehalten, weil es hier als verständliche ethische Wegmetapher dient. Der fragmentarische Versschluss ist sichtbar bewahrt.
