  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: de
  text: 'Denn deine Gnade gegen mich ist groß gewesen, und groß ist dein Erbarmen mit meinem Leben. Lass deine Gnade über meinen Söhnen groß werden[a], und lass die bösen Geister nicht über sie herrschen, damit sie sie nicht von der Erde vertilgen.


    [a] Oder: »Lass deine Gnade über meinen Söhnen groß sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lass deine Gnade über meinen Söhnen groß sein.«'
    reason: Der jussivische Ausdruck kann sowohl das Großwerden als auch das Großsein der Gnade bezeichnen.
lexical_decisions:
