  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: de
  text: 'Denn sie waren aus dem Land Ararat ostwärts nach Schinar gezogen. In seinen Tagen bauten sie die Stadt und den Turm und sagten: »Kommt, lasst uns auf ihm bis in den Himmel hinaufsteigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: waren … gezogen
  rationale: Gibt die vollzogene Wanderung beziehungsweise Übersiedlung natürlich wieder und passt zum begründenden Rückblick.
- source_word: መንገለ፡ ጽባሕ
  choice: ostwärts
  rationale: Wörtlich auf die Richtung des Sonnenaufgangs bezogen; im Deutschen idiomatisch als »ostwärts« wiedergegeben.
- source_word: ሀገር
  choice: Stadt
  rationale: Im Zusammenhang mit dem Turmbau bezeichnet das Wort hier die errichtete Stadt beziehungsweise Siedlung.
- source_word: ማኅፈድ
  choice: Turm
  rationale: Der Kontext der Babelüberlieferung und die konsultierte Texttradition stützen die konkrete Bedeutung »Turm«.
- source_word: ንዕርግ
  choice: lasst uns … hinaufsteigen
  rationale: Bewahrt die ausdrückliche Aufwärtsbewegung und die einladende Kohortativform.
- source_word: ቦቱ
  choice: auf ihm
  rationale: Gibt das instrumentale beziehungsweise räumliche Verhältnis zum Turm möglichst eng wieder, ohne es erklärend aufzulösen.
theological_decisions:
- issue: Ziel und Mittel des Aufstiegs
  choice: »auf ihm bis in den Himmel hinaufsteigen«
  alternative: »durch ihn in den Himmel hinaufsteigen«
  rationale: Die Präposition lässt ein räumlich-instrumentales Verhältnis zu. »Auf ihm« hält den Turm als Aufstiegsweg im Blick und vermeidet eine unnötige dogmatische oder kosmologische Präzisierung.
- issue: Bezug von »in seinen Tagen«
  choice: Pronomen beibehalten
  alternative: den möglichen Bezugsnamen ergänzen
  rationale: Der vorgelegte Vers enthält nur den pronominalen Bezug. Eine namentliche Auflösung würde Kontextwissen in den Vers eintragen und die vorhandene Textgestalt unnötig vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt quellennah, während Perfekt und idiomatische Richtungsangabe einen natürlichen deutschen Lesefluss gewährleisten.
