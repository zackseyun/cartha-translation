  verdict: revise
  source_fidelity: Die Chronologie, die Zeitbegriffe „Jubiläum“ und „Jahrwoche“, die Namen Peleg, Lomna und Schinar sowie die Ergänzung „im Land Schinar“ geben den ge'ezischen Text sachgerecht wieder. „Regu“ ist als etablierte deutsche biblische Namensform für den hier mit ራገው wiedergegebenen Namen vertretbar. „Die Menschen“ ist eine natürliche kollektive Wiedergabe von „Kinder/Söhne der Menschen“, ohne den Sinn einzuengen.
  naturalness: Der Erzählstil ist insgesamt modernes, würdiges Deutsch. Der Infinitiv „sich eine Stadt und einen Turm ... zu bauen“ ist jedoch vom Substantiv „Rat“ abhängig und sollte durch Kommas abgegrenzt werden. Das macht die syntaktische Beziehung klarer und verhindert, dass der Infinitiv unmittelbar als Zweckfolge von „böse geworden“ gelesen wird.
  terminology: „Rat der Bosheit“ bewahrt die abstrakte, moralisch wertende Formulierung des Ausgangstextes besser als eine psychologisierende Umschreibung wie „Absicht“. „Jahrwoche“ und „Jubiläum“ sind präzise. Für die Ortsangabe ist „im Land Schinar“ richtig; die Konstruktform bei „Land“ setzt die im Versschnitt fehlende bzw. übergreifende Genitivergänzung voraus.
