base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: de
  text: 'Im dreiunddreißigsten Jubiläum, im ersten Jahr der zweiten Jahrwoche, nahm sich Peleg eine Frau namens Lomna, eine Tochter Schinars. Im vierten Jahr dieser Jahrwoche gebar sie ihm einen Sohn. Er gab ihm den Namen Regu, denn er sagte: »Siehe, die Menschen sind durch den Rat der Bosheit, sich eine Stadt und einen Turm im Land Schinar zu bauen, böse geworden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: Jubiläum
  rationale: Bezeichnet die jubiläische Zeiteinheit des Buches; die etablierte deutsche Form wahrt den sachlichen und literarischen Bezug.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Gemeint ist eine Siebenjahresperiode, nicht eine gewöhnliche Woche. „Jahrwoche“ ist knapp, verständlich und präzise.
- source_word: ፋሌክ
  choice: Peleg
  rationale: Gebräuchliche deutsche biblische Namensform.
- source_word: ሎምና
  choice: Lomna
  rationale: Direkte Umschrift des Eigennamens.
- source_word: ሲናአር
  choice: Schinar
  rationale: Gebräuchliche deutsche biblische Form des Ortsnamens.
- source_word: ራገው
  choice: Regu
  rationale: Gebräuchliche deutsche Form des in Gen 11 genannten Namens Reu/Regu; sie entspricht der äthiopischen Lautgestalt angemessen.
- source_word: ውሉደ፡ ሰብእ
  choice: die Menschen
  rationale: Wörtlich „die Kinder/Söhne der Menschen“; im heutigen Deutsch gibt „die Menschen“ die kollektive Bedeutung natürlich wieder.
- source_word: በምክረ፡ ዐግ
  choice: durch den Rat der Bosheit
  rationale: Bewahrt die substantivische und moralisch zugespitzte Formulierung des Ge'ez, ohne sie als bloße persönliche Absicht umzudeuten.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: eine Stadt und einen Turm
  rationale: Der Kontext der Turmbauerzählung und die Parallelüberlieferung stützen „Turm“ für das zweite Substantiv.
- source_word: ውስተ፡ ምድረ
  choice: im Land Schinar
  rationale: ምድረ steht in der Konstruktform und verlangt eine Genitivergänzung; „Schinar“ ist offenbar durch die Versabgrenzung abgeschnitten und ergibt sich aus der fortlaufenden Syntax.
theological_decisions:
- issue: Beziehung zwischen dem „Rat der Bosheit“ und dem Bauvorhaben
  choice: „durch den Rat der Bosheit böse geworden, sich … zu bauen“
  alternative: „durch den bösen Plan, sich … zu bauen“
  rationale: Die gewählte Fassung wahrt die markante Abstraktion „Rat der Bosheit“ und lässt den Infinitiv das Vorhaben dieses Rates bezeichnen, ohne den Ausdruck psychologisierend zu glätten.
- issue: Moralische Aussage über die Menschen
  choice: „böse geworden“
  alternative: „zu Übeltätern geworden“
  rationale: Das Prädikativ እኩያነ bezeichnet moralische Schlechtigkeit. „Böse geworden“ ist direkt, verständlich und vermeidet eine zusätzliche Festlegung auf konkrete Straftaten.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Chronologie. „Siehe“ erhält den feierlichen Aufmerksamkeitsruf des Ausgangstextes. Die sehr lange Ausgangsperiode wurde für natürliches heutiges Deutsch in drei Sätze gegliedert; genuine inhaltliche Spannungen wurden nicht konfessionell aufgelöst.
