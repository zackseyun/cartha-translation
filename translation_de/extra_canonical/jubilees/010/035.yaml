  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: de
  text: Dieses Land wurde Kanaan genannt. Jafet und seine Söhne zogen zum Meer und ließen sich in dem Land nieder, das ihnen zugeteilt worden war. Als Madai das Land am Meer[a] sah, gefiel es ihm nicht. Er erbat sich von Elam, Assur und Arpachschad, den Brüdern seiner Frau,[b] ein Gebiet und ließ sich dort nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land des Meeres“; gemeint sein kann das Küstenland.'
    reason: lexical_ambiguity
  - marker: b
    text: Die ge'ezische Satzfügung ist an dieser Stelle ungewöhnlich. Der Plural bezeichnet Elam, Assur und Arpachschad hier gemeinsam als Brüder seiner Frau. Das erbetene „Gebiet“ ist aus dem Zusammenhang ergänzt.
    reason: segmentation_note
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  choice: Dieses Land wurde Kanaan genannt
  rationale: Gibt die einleitende Passivkonstruktion und den rückverweisenden Charakter von ይእቲ natürlich und vollständig wieder.
- source_word: መንገለ፡ ባሕር
  choice: zum Meer
  rationale: Entspricht der Richtungsangabe, ohne eine genauere Küstenregion vorauszusetzen.
- source_word: ምድረ፡ መክፈልቶሙ
  choice: das Land, das ihnen zugeteilt worden war
  rationale: Gibt den Gedanken ihres Anteils beziehungsweise Losgebiets in verständlichem modernem Deutsch wieder.
- source_word: ምድረ፡ ባሕር
  choice: das Land am Meer
  rationale: Bewahrt die ungewöhnliche Ausgangsformulierung, klingt im Deutschen aber natürlicher als „Land des Meeres“.
- source_word: ወኢአደመት፡ በቅድሜሁ
  choice: gefiel es ihm nicht
  rationale: Die idiomatische deutsche Wendung gibt die Aussage wieder, dass das Gebiet in seinen Augen keinen Gefallen fand.
- source_word: ወአስተብቍዓ፡ እምኀበ
  choice: erbat er sich von
  rationale: Gibt die Bitte an die genannten Personen wieder; das erbetene Gebiet wird aus dem Zusammenhang ergänzt.
- source_word: አኀወ፡ ብእሲቱ
  choice: den Brüdern seiner Frau
  rationale: Die überlieferte Form አኀወ ist pluralisch und bezieht Elam, Assur und Arpachschad gemeinsam als Brüder der Frau Madais ein.
- source_word: ወኀደረ
  choice: und ließ sich dort nieder
  rationale: Das im Deutschen nötige „dort“ verdeutlicht den aus dem Kontext erschließbaren Ortsbezug des abschließenden Verbs.
theological_decisions:
- issue: Verwandtschaftsbezeichnung bei Elam, Assur und Arpachschad
  choice: alle drei als „Brüder seiner Frau“ verstanden
  alternative: nur Arpachschad als „Bruder seiner Frau“ auffassen
  rationale: Die ge'ezische Pluralform unterstützt den kollektiven Bezug; die syntaktische Fügung bleibt jedoch auffällig und wird deshalb in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze halten den erzählenden Rhythmus aufrecht. Ungewöhnliche ge'ezische Wendungen werden im Haupttext verständlich wiedergegeben, während echte lexikalische und syntaktische Unsicherheiten in den Fußnoten offengelegt werden.
