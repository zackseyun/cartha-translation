  yaml_path: translation/extra_canonical/jubilees/010/006.yaml
  text: And you know how your Watchers, the fathers of these spirits, acted in my days. As for these spirits that are living, imprison them and hold them fast in the place of judgment, and do not let them bring corruption upon the sons of your servant, O my God, for these are malignant and were created in order to destroy.
translation:
  language: de
  text: Und du weißt, wie deine Wächter, die Väter dieser Geister, in meinen Tagen gehandelt haben. Diese Geister aber, die leben, sperre ein und halte sie am Ort des Gerichts fest. Lass nicht zu, dass sie Verderben über die Söhne deines Knechtes bringen, o mein Gott; denn sie sind bösartig und wurden geschaffen, um zu vernichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: Ort des Gerichts
