  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: de
  text: Und sie begannen zu bauen. In der vierten Woche brannten sie Ziegel im Feuer; die Ziegel dienten ihnen als Steine, und der Lehm, mit dem sie sie verbanden, war Asphalt, der aus dem Meer und aus Wasserquellen im Land Schinar hervortritt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ራብዕ
  choice: in der vierten Woche
  rationale: Gibt die zeitliche Wendung entsprechend dem äthiopischen Text und dem jubilarischen Wochenschema natürlich wieder.
- source_word: ንንፈሱ፡ በእሳት
  choice: brannten sie Ziegel im Feuer
  rationale: Die Wendung beschreibt die Herstellung gebrannter Ziegel; im Deutschen ist die verbale Form natürlich und sachlich genau.
- source_word: ከመ፡ እብን
  choice: als Steine
  rationale: Bewahrt den ausdrücklichen Vergleich zwischen Ziegeln und Naturstein.
- source_word: ፀቡር
  choice: Mörtel
  rationale: Im Bauzusammenhang bezeichnet das Wort das zum Verstreichen beziehungsweise Verputzen verwendete Bindemittel; „Mörtel“ ist im Deutschen verständlich und präzise.
- source_word: አስፋሌጦስ
  choice: Asphalt
  rationale: Direkte und im modernen Deutsch geläufige Entsprechung für das natürliche bituminöse Material.
- source_word: ይወፅእ
  choice: hervortritt
  rationale: Bewahrt die konkrete Vorstellung, dass der Asphalt aus Meer und Quellen austritt.
- source_word: ሱቱ
  choice: sie sie verputzten
  rationale: Das erste Pronomen bezieht sich auf die Baukörper beziehungsweise Ziegel; die Wiederholung ist grammatisch nötig und gibt den Bauvorgang verständlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzgliederung. Der überlieferte Anfang „Himmel“ gehört offenbar zum vorausgehenden Vers und wurde nicht in den Vers aufgenommen. Die abschließende Ortsangabe „im Land Schinar“ ist in der bereitgestellten englischen Konsultationsfassung enthalten, liegt aber jenseits des sichtbar abgebrochenen ge’ezischen Ausschnitts; sie wurde zur Vervollständigung des überlieferten Verss beibehalten.
