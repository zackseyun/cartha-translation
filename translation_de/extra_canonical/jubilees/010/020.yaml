revisions:
- from: Und sie begannen zu bauen. In der vierten Woche brannten sie Ziegel im Feuer; die Ziegel dienten ihnen als Steine, und der Mörtel, mit dem sie sie verputzten, war Asphalt, der aus dem Meer und aus den Wasserquellen im Land Schinar hervortritt.
  to: Und sie begannen zu bauen. In der vierten Woche brannten sie Ziegel im Feuer; die Ziegel dienten ihnen als Steine, und der Lehm, mit dem sie sie verbanden, war Asphalt, der aus dem Meer und aus Wasserquellen im Land Schinar hervortritt.
