  yaml_path: translation/extra_canonical/jubilees/010/031.yaml
  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: de
  text: In Auflehnung habt ihr gewohnt, und in Auflehnung werden deine Kinder fallen; und du wirst für immer ausgerottet werden.[a] Wohne nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An deinem Wohnort wirst du wohnen, und an deinem Wohnort werden deine Kinder für immer fallen.“'
    reason: Die ältere alternative Deutung versteht die wiederholte Wendung als Orts- beziehungsweise Wohnangabe und verbindet „für immer“ anders.
lexical_decisions:
- source_word: በሀከከ
  choice: in Auflehnung
  rationale: Die wiederholte Wendung wird entsprechend der revidierten quellenkritischen Einordnung als Auflehnung beziehungsweise Rebellion verstanden und in beiden Vorkommen gleich wiedergegeben.
- source_word: ኀደርክሙ
  choice: habt ihr gewohnt
  rationale: Das Perfekt und die Anrede im Plural werden bewahrt; „gewohnt“ hält zugleich die Verbindung zum abschließenden Verb derselben Bedeutungsgruppe fest.
- source_word: ይወድቁ
  choice: werden … fallen
  rationale: Die Aussage über die Kinder wird als zukünftiges Fallen wiedergegeben, ohne die Art des Falls näher zu bestimmen.
- source_word: ወትሴር
  choice: und du wirst … ausgerottet werden
  rationale: Das im früheren Entwurf ausgelassene Verb wird ausdrücklich wiedergegeben; „ausgerottet“ vermittelt die starke passive Vorstellung vollständiger Beseitigung.
- source_word: ለዓለም
  choice: für immer
  rationale: Die Zeitangabe wird an das unmittelbar vorausgehende Ausgerottetwerden angeschlossen.
- source_word: ኢትኅደር
  choice: Wohne nicht dort
  rationale: Der abschließende verneinte Imperativ wird knapp wiedergegeben; „dort“ macht im Deutschen den durch den Zusammenhang vorausgesetzten Ort idiomatisch verständlich.
theological_decisions:
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: Den Wechsel als „ihr“ zu „deine/du“ bewahren
  alternative: Alle Anreden zu einer einheitlichen deutschen Person angleichen
  rationale: Die Formen des Quelltexts weisen unterschiedliche Numeri auf. Eine Harmonisierung würde eine echte sprachliche Spannung stillschweigend beseitigen.
- issue: Bezug von „für immer“
  choice: Auf das Ausgerottetwerden beziehen
  alternative: Auf das Fallen der Kinder beziehen
  rationale: Die Stellung nach ወትሴር legt den Bezug auf das Ausgerottetwerden nahe; die ältere Deutung wird wegen der Überlieferungs- und Verständnisgeschichte in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung von „in Auflehnung“ und der Numeruswechsel der Anrede bleiben erhalten. Das Semikolon gliedert die eng verbundenen Gerichtsaussagen, ohne ihre Reihenfolge zu verändern.
