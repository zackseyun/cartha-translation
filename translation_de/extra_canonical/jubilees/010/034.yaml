  text: Lebanon, from Hamath as far as the entrance of Egypt, he and his descendants to this day. And because of this,
translation:
  language: de
  text: den Libanon, von Hamat bis zum Eingang Ägyptens – er und seine Nachkommen bis auf den heutigen Tag. Und deshalb
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊባኖስ
  choice: den Libanon
  rationale: Der geographische Name wird direkt wiedergegeben; der Akkusativ wahrt den fragmentarischen Anschluss an den vorausgehenden Satz.
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: von Hamat bis zum Zugang nach Ägypten
  rationale: Gibt die räumliche Erstreckung natürlich und zugleich quellennah wieder. ምብዋአ bezeichnet den Zugang bzw. Eingang.
- source_word: ውእቱ፡ ወውሉዱ
  choice: er und seine Nachkommen
  rationale: Das maskuline Pronomen und das Possessivsuffix verweisen im Zusammenhang am ehesten auf Kanaan als Person; „Nachkommen“ ist im Deutschen idiomatischer als das wörtliche „Söhne“ und umfasst die fortdauernde Abstammungslinie.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: bis auf den heutigen Tag
  rationale: Bewahrt die traditionelle zeitliche Wendung in verständlichem, würdigem Deutsch.
- source_word: ወበእንተዝ
  choice: Und deshalb
  rationale: Der abschließende Kausalkonnektor bleibt bewusst offen, da der Satz im folgenden Vers weitergeführt wird.
theological_decisions:
- issue: Bezug von „er und seine Nachkommen“
  choice: Bezug auf den Patriarchen Kanaan
  alternative: 'Bezug auf den Libanon bzw. das Land: „dieses und seine Nachkommen“'
  rationale: Die personale Rede von Nachkommen und die maskuline Form sprechen im Kontext stärker für Kanaan. Da der unmittelbare Wortlaut den Bezug nicht ausdrücklich nennt, wird die andere Deutung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text bleibt als Satzfragment stehen, weil sowohl der Anfang an den vorausgehenden Zusammenhang anschließt als auch „Und deshalb“ in den folgenden Vers weiterführt. Der Gedankenstrich macht die eingeschobene personale Aussage lesbar, ohne dem Quelltext zusätzliche inhaltliche Verknüpfungen aufzuzwingen.
