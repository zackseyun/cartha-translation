revisions:
- from: 'Und Ham, sein Vater, sowie Kusch und Mizrajim, seine Brüder, sagten zu ihm: »Du hast dich in einem Land niedergelassen, das nicht dir gehört und dir nicht durch das Los zugefallen ist. Tu das nicht! Denn wenn du es tust, werdet ihr – du und deine Söhne – in diesem Land fallen und wegen eures Aufbegehrens verflucht sein. Weil du dich im Aufbegehren dort niedergelassen hast, werden auch deine Söhne im Aufbegehren fallen, und du wirst für immer entwurzelt werden.«[a]'
  to: 'Und Ham, dessen Vater, sowie Kusch und Mizrajim, dessen Brüder, sagten zu ihm: »Weil du dich in einem Land niedergelassen hast, das nicht dir gehört und dir nicht durch das Los zugefallen ist, tu das nicht! Denn wenn du es tust, wirst du mitsamt deinen Söhnen im Land fallen und wegen des Aufbegehrens verflucht werden. Denn durch dein Aufbegehren hast du dich niedergelassen; durch das Aufbegehren werden deine Söhne fallen, und du wirst für immer entwurzelt werden.«[a]'
  rationale: Die Revision klärt die Familienbeziehungen durch „dessen“, bewahrt die Verteilung der Singular- und Pluralbezüge beim Aufbegehren und vermeidet die nicht notwendige Spezifizierung „diesem“. Die Fußnote bleibt erforderlich, weil der bereitgestellte Quellentext am Ende des Verses abbricht.
