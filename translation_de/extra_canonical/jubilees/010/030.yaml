base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: de
  text: 'Und Ham, dessen Vater, sowie Kusch und Mizrajim, dessen Brüder, sagten zu ihm: »Weil du dich in einem Land niedergelassen hast, das nicht dir gehört und dir nicht durch das Los zugefallen ist, tu das nicht! Denn wenn du es tust, wirst du mitsamt deinen Söhnen im Land fallen und wegen des Aufbegehrens verflucht werden. Denn durch dein Aufbegehren hast du dich niedergelassen; durch das Aufbegehren werden deine Söhne fallen, und du wirst für immer entwurzelt werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte geʿezische Textausschnitt bricht nach »weil/denn« ab; der Schluss des Verses folgt der vollständig überlieferten Fassung der angegebenen Edition.
    reason: Der bereitgestellte Originaltext ist am Versende abgeschnitten; die Ergänzung wird daher transparent ausgewiesen.
lexical_decisions:
- source_word: ኀደርከ
  choice: du hast dich … niedergelassen
  rationale: Gibt das Wohnen beziehungsweise dauerhafte Ansiedeln im fremden Land natürlich und präzise wieder.
- source_word: በዕፁ
  choice: durch das Los
  rationale: Bewahrt das Motiv der durch Los bestimmten Landzuteilung.
- source_word: ሀከከ
  choice: Aufbegehren
  rationale: Erhält den Gedanken einer widersetzlichen, rebellischen Handlung, ohne ihn konfessionell auszudeuten.
- source_word: ትወድቁ
  choice: werden … fallen
  rationale: Bewahrt das wiederholte Bild des Fallens und legt nicht einseitig fest, ob Untergang, Tod oder Verlust des Landes gemeint ist.
- source_word: you will be uprooted
  choice: du wirst … entwurzelt werden
  rationale: Bewahrt die konkrete Metapher des gewaltsamen und endgültigen Entfernens.
theological_decisions:
- issue: Art und Ursache des Fluchs
  choice: wegen eures Aufbegehrens verflucht sein
  alternative: im Aufbegehren verflucht sein
  rationale: Drückt den kausalen Zusammenhang verständlich aus, ohne den Fluch als bloße menschliche Verwünschung oder als ausdrücklich göttliches Urteil näher zu bestimmen.
- issue: Bedeutung des Fallens
  choice: in diesem Land fallen
  alternative: in diesem Land zugrunde gehen
  rationale: Die bildhafte und möglicherweise mehrdeutige Formulierung bleibt erhalten; eine Festlegung auf Tod oder politischen Untergang wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; die Wiederholungen von »Aufbegehren« und »fallen« bleiben als rhetorische Merkmale des Ausgangstextes erhalten.
