  text: from the land of Shinar[28]. And Ham and his sons went into the land that was apportioned to him, which he acquired.
translation:
  language: de
  text: aus dem Land Schinar.[a] Ham und seine Söhne zogen in das Land, das ihm als Besitz zugeteilt worden war und das er erhalten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „aus dem Land Schinar“ schließen syntaktisch an den vorhergehenden Satz an; die Versgrenze teilt hier den Satz.
    reason: segmentation_note
lexical_decisions:
- source_word: እምድረ፡ ሲናአር
  choice: aus dem Land Schinar
  rationale: Gibt die Präposition እም („aus/von“) und den traditionellen Ortsnamen präzise wieder; der fragmentarische Anfang wird wegen der Versabgrenzung beibehalten.
- source_word: ወሖሩ፡ ካም፡ ወውሉዱ
  choice: Ham und seine Söhne zogen
  rationale: ሖሩ bezeichnet hier das Gehen bzw. Ziehen; „Söhne“ passt im genealogischen Zusammenhang natürlicher als das weitere „Kinder“.
- source_word: እንተ፡ አሕዝት፡ ሎቱ
  choice: das ihm als Besitz zugeteilt worden war
  rationale: Die causative Besitzform wird im Kontext der Landzuteilung wiedergegeben, ohne fälschlich eine eigenmächtige Eroberung oder widerrechtliche Aneignung anzudeuten.
- source_word: ዘረከበ
  choice: das er erhalten hatte
  rationale: ረከበ kann „finden, erlangen, erhalten“ bedeuten; „erhalten“ bewahrt hier den Gedanken des tatsächlich empfangenen Anteils und lässt das zweite Relativglied nicht unübersetzt.
theological_decisions:
- issue: Rechtmäßige Zuteilung oder eigenmächtige Besitzergreifung
  choice: als Besitz zugeteilt … erhalten
  alternative: für sich an sich gerissen
  rationale: Der unmittelbare Wortlaut und der Verteilungskontext sprechen für einen Ham zugewiesenen und von ihm empfangenen Landanteil. Eine widerrechtliche Landnahme würde die Handlung Kanaans aus dem folgenden Zusammenhang unberechtigt auf Ham übertragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der durch die überlieferte Versgrenze entstandene Satzrest bleibt sichtbar; die Fußnote erklärt ihn. Die beiden Aussagen über Zuteilung und Empfang werden trotz ihrer inhaltlichen Nähe beibehalten, da beide im ge’ezischen Text ausgedrückt sind.
