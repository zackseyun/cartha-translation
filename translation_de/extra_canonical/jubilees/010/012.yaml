translation:
  language: de
  text: Wir ließen sie übrig,[a] damit sie auf Erden Satan unterworfen würden. Und das Heilmittel für alle ihre Krankheiten …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aus dem Zusammenhang auch: „Wir ließen ein Zehntel von ihnen übrig.“ Eine Mengenangabe steht im vorliegenden ge''ezischen Wortlaut jedoch nicht ausdrücklich.'
    reason: Die traditionelle kontextuelle Ergänzung wird dokumentiert, ohne sie in den Haupttext einzutragen.
  - marker: b
    text: Der bereitgestellte Quelltext endet mit dieser unvollständigen Wortgruppe.
    reason: Die Auslassungspunkte kennzeichnen, dass der bereitgestellte Satzteil syntaktisch unvollständig endet, nicht eine stilistische Auslassung.
lexical_decisions:
- source_word: አተርፍነ
  choice: Wir ließen sie übrig
  rationale: Das Kausativverb bezeichnet hier das Übriglassen beziehungsweise Verschonen. Das im Deutschen notwendige Objekt „sie“ wird aus dem Zusammenhang ergänzt; eine ausdrückliche Mengenangabe steht im vorliegenden ge’ezischen Wortlaut nicht.
- source_word: ይትኰነኑ
  choice: unterworfen wären
  rationale: Die Form kann ein Unterstellt- oder Unterworfensein ausdrücken. Diese Wiedergabe passt zur Verbindung mit „vor Satan“, ohne eine zusätzliche Vorstellung von Verurteilung einzutragen.
- source_word: ቅድመ፡ ሰይጣን
  choice: Satan unterworfen
  rationale: Wörtlich steht „vor Satan“. In dieser Konstruktion gibt „unterworfen“ die gemeinte Unterstellung in natürlichem Deutsch wieder.
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: Und das Heilmittel für alle ihre Krankheiten …
  rationale: ፈውስ ist hier als Substantiv „Heilung/Heilmittel“ zu verstehen, nicht als Verb der ersten Person Plural. Da der bereitgestellte Quelltext an dieser Stelle syntaktisch unvollständig endet, bleibt auch die Übersetzung fragmentarisch.
theological_decisions:
- issue: Verhältnis der zurückgelassenen Wesen zu Satan
  choice: „Satan unterworfen“
  alternative: „vor Satan gerichtet/verurteilt“
  rationale: Die Vorlage lässt bei ይትኰነኑ eine gewisse Bedeutungsbreite zu. Der unmittelbare Zusammenhang spricht eher für Unterstellung beziehungsweise Unterordnung; eine gerichtliche Deutung wird daher nicht in den Haupttext aufgenommen.
- issue: Zahl der Übriggelassenen
  choice: Im Haupttext keine Mengenangabe
  alternative: „ein Zehntel von ihnen“
  rationale: Ein Zehntel mag aus dem vorausgehenden Kontext erschlossen werden, steht jedoch nicht ausdrücklich im bereitgestellten ge’ezischen Versabschnitt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Übriglassen“ bewahrt den Sinn des Verschonens, „unterworfen“ vermeidet unnötig altertümliche Syntax, und der Schluss bleibt entsprechend der bereitgestellten ge’ezischen Vorlage bewusst fragmentarisch.
