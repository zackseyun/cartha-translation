base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/007.yaml
  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: de
  text: Und lass sie nicht über die Geister der Lebenden herrschen; denn du allein kennst ihr Gericht. Lass sie von nun an bis in Ewigkeit keine Macht über die Söhne der Gerechten haben.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spirits of the living
  choice: Geister der Lebenden
  rationale: Die offene Genitivverbindung bleibt erhalten; sie wird nicht deutend als menschliche Seelen oder als lebendige Geister aufgelöst.
- source_word: rule / have power
  choice: herrschen / Macht haben
  rationale: Die zwei verwandten Herrschaftsaussagen werden im Deutschen natürlich, aber unterscheidbar wiedergegeben.
- source_word: judgment
  choice: Gericht
