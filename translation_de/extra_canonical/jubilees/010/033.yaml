  text: before the holy prince, and before Noah our father. But he did not listen to them, and he dwelt in the land.
translation:
  language: de
  text: vor dem heiligen Fürsten und vor Noah, unserem Vater. Doch er hörte nicht auf sie und wohnte in dem Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድሜሁ፡ ለመኰንን፡ ቅዱስ
  choice: vor dem heiligen Fürsten
  rationale: Das Suffix -hu nimmt das mit la- eingeführte Substantiv vorweg und wird daher nicht als zusätzliches „vor ihm“ wiederholt; መኰንን bezeichnet einen Fürsten oder hohen Amtsträger.
- source_word: ኖኅ፡ አቡነ
  choice: Noah, unserem Vater
  rationale: Gibt den Eigennamen und አቡነ („unser Vater“) unmittelbar und in natürlichem Deutsch wieder.
- source_word: ወኢሰምዖሙ
  choice: Doch er hörte nicht auf sie
  rationale: Das Verb des Hörens kann hier idiomatisch Gehorsam beziehungsweise das Befolgen einer Aufforderung ausdrücken; „auf sie hören“ bewahrt beides.
- source_word: ወኀደረ፡ ምድረ
  choice: und wohnte in dem Land
  rationale: ኀደረ bezeichnet das Bleiben oder Wohnen; der vorliegende Quelltext nennt das Land nicht näher.
theological_decisions:
- issue: Bezeichnung „heiliger Fürst“
  choice: heiligen Fürsten
  alternative: heiligen Herrscher / heiligen Amtsträger
  rationale: Die allgemein verständliche und würdige Wiedergabe lässt die Identität des so bezeichneten Wesens offen und trägt keine zusätzliche konfessionelle Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kleingeschriebene Beginn bleibt als Anschluss an den vorhergehenden Satz erhalten. Die knappe Schlussformulierung folgt ausschließlich dem bereitgestellten ge’ezischen Segment und ergänzt keine Ortsangaben aus anderen Textfassungen.
