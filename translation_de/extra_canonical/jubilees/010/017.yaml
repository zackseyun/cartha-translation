  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: de
  text: Neunzehn Jubiläen, zwei Jahrwochen und fünf Jahre. An Lebensdauer übertraf er die Menschensöhne[a], mit Ausnahme Henochs, wegen der Gerechtigkeit, in der er vollkommen war. Denn Henoch war zum Zeugnis für die Generationen der Welt bestimmt, um alle Taten von Generation zu Generation bis zum Tag des Gerichts zu berichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage über Henoch ist textlich sehr dicht. Sie kann so verstanden werden, dass Noah alle anderen Menschen außer Henoch an Lebensdauer übertraf, während Henoch für die kommenden Generationen eine besondere Aufgabe als Zeuge hatte.
    reason: alternative_reading
lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwochen
  rationale: Das Wort bezeichnet Siebenerzeiträume; im chronologischen Zusammenhang sind Siebenjahresperioden gemeint. „Jahrwochen“ ist knapp, verständlich und sachlich präzise.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschensöhne
  rationale: Die formnahe Wiedergabe bewahrt die semitische Ausdrucksweise und vermeidet eine unnötige Einschränkung auf männliche Personen.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Entspricht dem ethisch-theologischen Bedeutungsfeld des geʿezischen Ausdrucks, ohne die Aussage konfessionell zu verengen.
- source_word: ስምዕ
  choice: Zeugnis
  rationale: Der Ausdruck bedeutet „Zeugnis“ beziehungsweise „Zeuge“; „Zeugnis“ folgt der überlieferten Satzkonstruktion und ist lexikalisch treffender als „Zeichen“.
- source_word: ትውልደ
  choice: Generationen
  rationale: Gibt den wiederholten Bezug auf die Geschlechter beziehungsweise Generationen der Welt natürlich und konsistent wieder.
theological_decisions:
- issue: Bezug der Aussage über das Übertreffen und die Ausnahme Henochs
  choice: Die dichte Satzstruktur bleibt im Haupttext erhalten; eine Fußnote erläutert die mögliche Beziehung auf Noahs Lebensdauer und Henochs Sonderstellung.
  alternative: Die Aussage ausdrücklich als Vergleich der Lebensdauer Noahs mit allen Menschen außer Henoch deuten.
  rationale: Der geʿezische Wortlaut ist syntaktisch gedrängt. Eine eindeutige Auflösung im Haupttext würde mehr festlegen, als die Quelle sicher erkennen lässt.
- issue: Funktion Henochs
  choice: „zum Zeugnis … bestimmt“
  alternative: „als Zeichen … eingesetzt“ oder „zum Zeugen … bestimmt“
  rationale: „Zeugnis“ entspricht ስምዕ und bewahrt die überlieferte nominale Formulierung; „Zeichen“ wäre lexikalisch weniger genau.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologische Formel bleibt knapp; „Menschensöhne“ wahrt die quellensprachliche Bildlichkeit. Die syntaktische und theologische Spannung der Henoch-Aussage wird nicht stillschweigend aufgelöst.
