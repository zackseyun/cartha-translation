lexical_decisions:
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: auf dem Berg Lubar
  rationale: Die Wortgruppe bezeichnet Lubar als Berg; im Deutschen ist die natürliche geografische Fügung „auf dem Berg“. Die Namensform Lubar bleibt erhalten.
- source_word: በምድረ፡ አራራት
  choice: im Land Ararat
  rationale: Gibt die geografische Zuordnung knapp und nah am äthiopischen Wortlaut wieder.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: Insgesamt lebte er neunhundertfünfzig Jahre
  rationale: Das wörtliche Bild, er habe 950 Jahre in seinem Leben vollendet, wird idiomatisch und ohne Bedeutungsverlust als Angabe seiner gesamten Lebenszeit wiedergegeben.
