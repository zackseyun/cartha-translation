  terminology: „Bach Ägyptens“, „Erbbesitz“, „Jordan“ und „Meer“ sind angemessen. „Land des Libanon“ wahrt die überlieferte Bezeichnung besser als die umformende Wendung „Land vom Libanon bis ...“. Die Fußnote zur abschließenden Grenzformel soll die durch den bereitgestellten Auszug verursachte Unsicherheit transparent halten, ohne eine nicht belegte Aussage über den vollständigen Textbestand zu treffen.
