base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: de
  text: Bei seiner Zuteilung im Land des Südens[a] sah Kanaan das Land des Libanon bis zum Bach Ägyptens und erkannte, dass es sehr gut war. Er zog nicht in das Land seines Erbbesitzes westlich des Meeres, sondern ließ sich im Land des Libanon nieder, vom Osten bis zum Westen, von der Grenze am Jordan bis zur Grenze am Meer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Vers beginnt mit einer knappen Wendung, die möglicherweise noch zum vorhergehenden Satz gehört: wörtlich etwa „bei seiner Teilung/Zuteilung im Land des Südens“.'
    reason: Die Anfangsworte sind syntaktisch fragmentarisch; die Anmerkung bewahrt diese Unsicherheit.
  - marker: b
    text: Der im Auftrag bereitgestellte ge’ezische Auszug endet nach „von der Grenze ...“. Die Ergänzung „am Meer“ folgt der englischen Konsultationsfassung und der parallelen Grenzformel.
    reason: Die Ergänzung wird aufgrund des unvollständigen bereitgestellten Auszugs transparent gekennzeichnet.
lexical_decisions:
- source_word: በመክፈልቱ
  choice: bei seiner Zuteilung
  rationale: Das Substantiv bezeichnet hier eine Teilung beziehungsweise Zuteilung; die Formulierung bewahrt den Bezug auf die Landverteilung.
- source_word: መሐዘ፡ ግብጽ
  choice: Bach Ägyptens
  rationale: መሐዝ bezeichnet einen Bach oder Wasserlauf. Die traditionelle geografische Bezeichnung bleibt erhalten, ohne ihn mit dem Nil gleichzusetzen.
- source_word: ሠናይ፡ ይእቲ፡ ጥቀ
  choice: sehr gut war
  rationale: Wörtlich ‚es war sehr gut‘; idiomatisch als abhängiger dass-Satz an Kanaans Wahrnehmung angeschlossen.
- source_word: ምድረ፡ ርስት
  choice: Land, das ihm als Erbbesitz zugefallen war
  rationale: ርስት bezeichnet erblichen Besitz beziehungsweise Erbland; die Umschreibung macht den Zusammenhang mit der Zuteilung verständlich.
- source_word: ወኀደረ
  choice: sondern ließ sich … nieder
  rationale: Das Verb kann ‚wohnen, bleiben, sich niederlassen‘ bedeuten. Der deutsche Gegensatz zu ‚zog nicht‘ wird natürlich mit ‚sondern‘ wiedergegeben.
- source_word: እምእደ፡ ዮርዳኖስ
  choice: von der Grenze am Jordan
  rationale: እድ kann Seite, Richtung oder Rand bezeichnen; im Kontext einer Gebietsbeschreibung ist ‚Grenze am Jordan‘ angemessen.
theological_decisions:
- issue: Kanaans Missachtung der ausgelosten Erbzuteilung
  choice: 'Die Aussage bleibt rein erzählerisch: Er zog nicht in sein Erbland, sondern ließ sich im Libanonland nieder.'
  alternative: Die Handlung ausdrücklich als Sünde, Ungehorsam oder widerrechtliche Besitznahme bezeichnen.
  rationale: Der Vers selbst schildert die Entscheidung, bewertet sie hier aber nicht ausdrücklich theologisch; eine konfessionelle oder moralische Deutung wird daher nicht hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer geografischer Satzführung. Die fragmentarischen beziehungsweise unvollständigen Stellen des ge’ezischen Ausgangstextes werden nicht verschwiegen, sondern durch Fußnoten kenntlich gemacht.
