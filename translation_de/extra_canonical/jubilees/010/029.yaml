  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Kanaan betrachtet das Land des Libanon bis zum Bach Ägyptens, hält es für sehr gut, bezieht sein zugeteiltes Erbland nicht und wohnt stattdessen im Libanongebiet. Die Richtungsangabe bei dem nicht bezogenen Erbland sollte jedoch nicht als Bewegung „westwärts zum Meer“ formuliert werden; sie bezeichnet nach der konsultierten Überlieferung die Lage dieses Landes westlich des Meeres. Auch „Land vom Libanon bis“ verändert leicht die Konstruktion „Land des Libanon bis zum Bach Ägyptens“.'
