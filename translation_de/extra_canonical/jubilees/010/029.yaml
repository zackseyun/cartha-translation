revisions:
- from: Bei seiner Zuteilung im Land des Südens[a] sah Kanaan, dass das Land vom Libanon bis zum Bach Ägyptens sehr gut war. Er zog nicht in das Land, das ihm als Erbbesitz zugefallen war, westwärts zum Meer, sondern ließ sich im Land des Libanon nieder, vom Osten bis zum Westen, von der Grenze am Jordan bis zur Grenze am Meer.[b]
  to: Bei seiner Zuteilung im Land des Südens[a] sah Kanaan das Land des Libanon bis zum Bach Ägyptens und erkannte, dass es sehr gut war. Er zog nicht in das Land seines Erbbesitzes westlich des Meeres, sondern ließ sich im Land des Libanon nieder, vom Osten bis zum Westen, von der Grenze am Jordan bis zur Grenze am Meer.[b]
  rationale: Die Revision korrigiert die Richtungsangabe beim Erbland zu einer Lageangabe, bewahrt die Formulierung „Land des Libanon“ und präzisiert die Anmerkung zur im bereitgestellten Quellenauszug unvollständigen Schlussformel. Aussagegehalt, Register und die textliche Unsicherheit am Versanfang bleiben erhalten.
