  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: de
  text: 'Da kam Mastema, der Anführer der Geister, und sagte: »Herr, Schöpfer, lass einige von ihnen bei mir bleiben. Sie sollen auf meine Stimme hören und alles tun, was ich ihnen sage. Denn wenn mir keine von ihnen gelassen werden, kann ich die Macht meines Willens über die Menschenkinder nicht ausüben. Sie dienen nämlich dazu, Verderben zu bringen und Menschen irrezuführen, bevor mein Gericht ergeht[a]; denn die Bosheit der Menschenkinder ist groß.«'
  philosophy: optimal-equivalence
