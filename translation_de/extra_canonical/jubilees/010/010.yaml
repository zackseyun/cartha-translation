  text: And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”
translation:
  language: de
  text: 'Und er sagte: „Ein Zehntel von ihnen soll vor ihm bleiben, und neun Teile sollen an den Ort des Gerichts hinabsteigen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓሥራተሙ / tenth (audited consultation layer)
  choice: ein Zehntel von ihnen
  rationale: Gibt den proportionalen Anteil klar und idiomatisch wieder.
- source_word: place of judgment; መካነ፡ ደይን
  choice: Ort des Gerichts
  rationale: Entspricht der konkreten räumlichen Formulierung der geʿezischen Überlieferung und bewahrt den gerichtlichen Sinn.
