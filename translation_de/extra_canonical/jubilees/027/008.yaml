  source_fidelity: 'Die Übersetzung gibt die drei ge''ezischen Verbformen angemessen wieder: Rebekka wird hineingehen, reden und Jakob wird anschließend weggesandt. »Fortschicken« trifft den kontextuellen Sinn von ይፈንወከ (»dich senden/wegschicken«) und vermeidet zutreffend die unpassende Bedeutung »nach dir schicken« bzw. »dich rufen lassen«.'
