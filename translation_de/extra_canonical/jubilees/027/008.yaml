  language: de
  text: 'Und Rebekka sagte zu Jakob: »Ich werde hineingehen und mit ihm reden, und er wird dich fortschicken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እበውእ (ʾəbawəʾ)
  choice: ich werde hineingehen
  rationale: Gibt die Bewegung des Verbs »hineingehen/eintreten« direkt und im Zusammenhang natürlich wieder.
- source_word: እነግር (ʾənaggər)
  choice: mit ihm reden
  rationale: Das Verb bedeutet »reden/sagen/mitteilen«; das im Deutschen nötige Objekt »mit ihm« ergibt sich aus dem Zusammenhang, ohne den Inhalt der Rede vorwegzunehmen.
- source_word: ይፈንወከ (yəfännəwäka)
  choice: er wird dich fortschicken
  rationale: Das Verb bezeichnet hier das Senden bzw. Wegschicken Jakobs, nicht das Herbeirufen. »Fortschicken« macht die im Kontext gemeinte Bewegung von dort weg deutlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Satzfolge des Ge’ez bleibt erhalten; »fortschicken« verhindert die kontextwidrige Deutung als Herbeirufen.
