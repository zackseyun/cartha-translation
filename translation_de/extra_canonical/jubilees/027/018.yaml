  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: de
  text: Der höchste Gott wird ihn vor allem Bösen bewahren und mit ihm sein; denn er wird ihn sein Leben lang nicht verlassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: der höchste Gott
  rationale: Gibt die Gottesbezeichnung wörtlich und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: የዐቅቦ
  choice: wird ihn … bewahren
  rationale: Das Verb bezeichnet schützendes Bewahren oder Hüten; „bewahren“ passt hier idiomatisch zur Gefahr „vor allem Bösen“.
- source_word: እምኵሉ፡ እኩይ
  choice: vor allem Bösen
  rationale: Bewahrt den umfassenden Sinn von „aus/von jedem Bösen“ in geläufiger deutscher Form.
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: und mit ihm sein
  rationale: Entspricht unmittelbar der Zusage göttlicher Gegenwart.
- source_word: እስመ፡ ኢየኀድጎ
  choice: denn er wird ihn … nicht verlassen
  rationale: Gibt die begründende Konjunktion und das Verb des Verlassens ohne interpretative Erweiterung wieder.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: sein Leben lang
  rationale: Die Wendung bedeutet wörtlich „alle seine Tage“; die gewählte Form ist natürliches modernes Deutsch und erhält den zeitlichen Gesamtumfang.
theological_decisions:
- issue: Umfang der Bewahrungszusage
  choice: „vor allem Bösen bewahren“
  alternative: „vor jedem Übel behüten“
  rationale: Die Übersetzung lässt offen, ob „Böses“ moralisches Übel, Unheil oder beides umfasst, und löst die Zusage nicht zu einer konfessionell geprägten Schutzlehre auf.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem biblischem Register. Die beiden Zukunftsaussagen und ihre Begründung bleiben klar erhalten; keine Fußnoten erforderlich.
