  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: de
  text: 'Und Isaak sagte zu Rebekka: „Meine Schwester, weine nicht um meinen Sohn Jakob; denn er wird in Frieden fortgehen und in Frieden zurückkehren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅትየ
  choice: meine Schwester
  rationale: Die wörtliche Anrede wird bewahrt; sie ist im antiken familiären Sprachgebrauch auch gegenüber der Ehefrau möglich und soll nicht stillschweigend geglättet werden.
- source_word: ኢትብከዪ
  choice: weine nicht
  rationale: Entspricht dem negierten Imperativ an eine weibliche Person und klingt im modernen Deutsch natürlich.
- source_word: በእንተ
  choice: um
  rationale: Im Zusammenhang des Weinens gibt „um“ den Anlass beziehungsweise Gegenstand idiomatisch wieder.
- source_word: በሰላም፡ የሐውር
  choice: in Frieden fortgehen
  rationale: Bewahrt die wiederholte Friedensformel und gibt das Weggehen vom gegenwärtigen Ort klar wieder.
- source_word: ወበሰላም፡ ይትመየጥ
  choice: und in Frieden zurückkehren
  rationale: Gibt die parallele Satzstruktur und die Bedeutung der Rückkehr wieder.
theological_decisions:
- issue: Isaaks Aussage über Jakobs sichere Rückkehr
  choice: als bestimmte Aussage im Futur wiedergegeben
  alternative: als Wunsch oder Segensformel formulieren
  rationale: Die Verbformen und der Zusammenhang stützen eine Zusage beziehungsweise Vorhersage; der Text markiert hier keinen bloßen Wunsch.
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Wahrung der hebräisch-biblisch anmutenden Parallelstruktur „in Frieden … in Frieden“. Die auffällige Anrede „meine Schwester“ bleibt erhalten, da sie im Ausgangstext ausdrücklich steht.
