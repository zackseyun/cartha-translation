  text: And Rebekah went in and said to Isaac, “I loathe my life because of the two daughters of Heth whom Esau has taken for himself as wives.
translation:
  language: de
  text: 'Und Rebekka ging hinein und sagte zu Isaak: »Mein Leben ist mir zuwider wegen der beiden Töchter Hets, die Esau sich zu Frauen genommen hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአት
  choice: ging hinein
  rationale: Gibt die konkrete Bewegungsrichtung des ge’ezischen Verbs wieder und bewahrt gegenüber einem bloßen »kam« die räumliche Aussage.
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: Mein Leben ist mir zuwider
  rationale: Die idiomatische deutsche Wendung bringt den starken Lebensüberdruss natürlich und würdig zum Ausdruck, ohne daraus ausdrücklich einen Todeswunsch zu machen.
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: wegen der beiden Töchter Hets
  rationale: Bewahrt Zahl, Abstammungsbezeichnung und kausalen Zusammenhang des Ausgangstextes.
- source_word: ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: die Esau sich zu Frauen genommen hat
  rationale: Entspricht der üblichen Heiratsformel »sich Frauen nehmen« und gibt das reflexive Element von »für sich« natürlich wieder.
theological_decisions:
- issue: Stärke von Rebekkas Klage
  choice: »Mein Leben ist mir zuwider«
  alternative: »Ich verabscheue mein Leben«
  rationale: Die gewählte Formulierung wahrt die scharfe Klage, legt sie aber nicht unnötig als absolute Selbstverwerfung oder ausdrücklichen Todeswunsch aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Töchter Hets« bleibt als traditionelle ethnische beziehungsweise genealogische Bezeichnung erhalten; keine erklärende Konfessionalisierung oder Harmonisierung wurde eingefügt.
