  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: de
  text: Denn ich weiß, dass seine Wege überall, wohin er auch geht, gelingen werden, bis er in Frieden zu uns zurückkehrt und wir ihn in Frieden sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአምር
  choice: ich weiß
  rationale: Gibt das Erkenntnisverb direkt und natürlich wieder.
- source_word: ይሤራኅ ፍኖዊሁ
  choice: seine Wege werden gelingen
  rationale: Bewahrt das bildhafte Subjekt „seine Wege“ und gibt das Verb im Sinn erfolgreichen Fortgangs wieder.
- source_word: በኵሉ ውእደ ሖረ
  choice: bei allem, wohin er auch geht
  rationale: Folgt der distributiven Orts- beziehungsweise Umstandsangabe, ohne sie unnötig zu verengen.
- source_word: ይገብእ
  choice: zurückkehrt
  rationale: Im Kontext bezeichnet das Verb die Rückkehr „zu uns“.
- source_word: በሰላም
  choice: in Frieden
  rationale: Die zweimalige Wiederholung wird wie in der Quelle beibehalten.
- source_word: ወንሬእዮ
  choice: und wir ihn wiedersehen
  rationale: „Wiedersehen“ ist im Deutschen aufgrund der erwarteten Rückkehr idiomatisch und bewahrt den Sinn des erneuten Sehens.
