  to: 'Und Jakob sagte zu seiner Mutter Rebekka: „Sieh, du weißt: Mein Vater ist alt geworden und kann nicht sehen, denn seine Augen sind trüb. Wenn ich ihn verlasse, wird es in seinen Augen böse sein, weil ich ihn verlassen habe und von euch weggegangen bin.“'
  rationale: Die Revision stellt das einleitende „Sieh“ wieder her und glättet die kausale Schlusskonstruktion. Sie bewahrt die Wiederholung von „verlassen“, die bildhafte Wendung „in seinen Augen“, die moralisch offene Wertung „böse“ und den pluralischen Adressatenbezug „euch“.
