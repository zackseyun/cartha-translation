  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: de
  text: 'Und Jakob sagte zu seiner Mutter Rebekka: „Sieh, du weißt: Mein Vater ist alt geworden und kann nicht sehen, denn seine Augen sind trüb. Wenn ich ihn verlasse, wird es in seinen Augen böse sein, weil ich ihn verlassen habe und von euch weggegangen bin.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ፡ ታእምሪ፡
  choice: Du weißt doch
  rationale: Das einleitende ናሁ („siehe“) und „du weißt“ werden in natürlichem modernem Deutsch als nachdrücklicher Verweis auf Bekanntes wiedergegeben.
- source_word: ረሰአ፡
  choice: ist alt geworden
  rationale: Gibt das Altwerden des Vaters direkt und würdig wieder.
- source_word: ኢይሬኢ፡ … ክቡዳ፡ አዕይንቲሁ፡
  choice: kann nicht mehr sehen, denn seine Augen sind trüb
  rationale: Bewahrt Ursache und Aussage des Ausgangstextes; „trüb“ ist im Deutschen die natürliche Beschreibung nachlassender Sehkraft.
- source_word: እኩይ፡ ውእቱ፡ በቅድመ፡ አዕይንቲሁ፡
  choice: wird es in seinen Augen etwas Böses sein
  rationale: Behält die bildhafte und moralisch offene Formulierung „in seinen Augen“ bei, ohne sie als bloßes Missfallen auszudeuten.
- source_word: አሐውር፡ እምኔክሙ፡
  choice: von euch weggegangen bin
  rationale: Der Pluralbezug von እምኔክሙ wird durch „euch“ erhalten, statt ihn auf Rebekka allein einzuengen.
theological_decisions:
- issue: Bewertung von Jakobs Fortgang durch Isaak
  choice: „etwas Böses … in seinen Augen“
  alternative: „es wird ihm missfallen“
  rationale: Die stärkere moralische Sprache des Textes bleibt erhalten; die Übersetzung legt nicht fest, ob objektives Unrecht oder Isaaks subjektives Urteil gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt nah am geezsprachigen Satzbau, wird aber maßvoll geglättet. Der Wechsel vom Singular beim Verlassen des Vaters zum Plural „euch“ am Schluss wird bewusst bewahrt.
