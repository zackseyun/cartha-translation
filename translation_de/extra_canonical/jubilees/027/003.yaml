lexical_decisions:
- source_word: የኀድግ፡ መዐተ፡ እምኔከ
  choice: er von seinem Zorn auf dich ablässt
  rationale: መዐተ („Zorn“) ist Objekt des Verbs; daher wird nicht der Zorn als Subjekt dargestellt. „Von seinem Zorn auf dich ablassen“ gibt die Abwendung des Zorns natürlich und sinngenau wieder.
- source_word: ይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  choice: und alles vergisst, was du ihm angetan hast
  rationale: Die Formulierung bewahrt den umfassenden Sinn von „alles“ und gibt die im Kontext auf Esau bezogene Tat idiomatisch als „ihm angetan“ wieder.
- source_word: ፈነውየ፡ አቄብለከ፡ እምህየ
  choice: Dann werde ich nach dir schicken und dich von dort zurückholen
  rationale: Die Verben bezeichnen das Senden und anschließende Zurückbringen; „zurückholen“ ist im Deutschen die natürliche Wiedergabe im Kontext von Rebekkas angekündigter Rückberufung Jakobs.
