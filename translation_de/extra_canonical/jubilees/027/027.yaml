  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: de
  text: Und siehe, ich werde mit dir sein und dich behüten, wohin du auch gehst, und ich werde dich in Frieden in dieses Land zurückbringen. Denn ich werde dich nicht verlassen, bis ich alles getan habe, was ich dir gesagt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነየ
  choice: Und siehe
  rationale: Bewahrt den hervorhebenden, feierlichen Charakter der einleitenden Partikel in natürlichem biblischem Deutsch.
- source_word: እዐቅበከ
  choice: dich behüten
  rationale: Gibt die Bedeutung des Bewahrens und Beschützens angemessen und würdevoll wieder.
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: wohin du auch gehst
  rationale: Natürliche deutsche Wiedergabe der umfassenden Ortsangabe, ohne ihren Geltungsumfang einzuschränken.
- source_word: በሰላም
  choice: in Frieden
  rationale: Entspricht der wörtlichen Bedeutung und lässt sowohl Unversehrtheit als auch friedliche Rückkehr anklingen.
- source_word: ኢየኀድገከ
  choice: ich werde dich nicht verlassen
  rationale: Direkte und idiomatische Wiedergabe der zugesagten bleibenden Gegenwart.
theological_decisions:
- issue: Dauer der Zusage, nicht verlassen zu werden
  choice: bis ich alles getan habe
  alternative: solange, bis ich alles getan habe
  rationale: Das zeitliche »bis« wird formal bewahrt, ohne daraus zu folgern, dass Gottes Gegenwart anschließend endet.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede bleibt durchgehend im Singular; Satzbau und Wiederholungen bewahren den feierlichen Zusagecharakter der Quelle.
