  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: de
  text: Und deine Nachkommen werden wie der Staub der Erde sein, und du wirst dich zum Meer hin und nach Osten und nach Norden und nach Süden ausbreiten. Und in dir und in deinen Nachkommen werden alle Länder der Völker[a] gesegnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge'ezische Lesart bezeichnet Länder oder Gebiete der Völker; sie ist nicht an die aus Genesis 28,14 bekannte Lesart „Familien/Sippen“ angeglichen.
    reason: Erläutert die quellensprachliche Wortwahl und ihre Abweichung von der bekannten Genesisformulierung, ohne den Haupttext zu überladen.
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommen
  rationale: Das Kollektivwort bezeichnet hier die Nachkommenschaft; der deutsche Plural ist natürlich und bewahrt den Sinn.
- source_word: ባሕር
  choice: Meer
  rationale: Die Quelle nennt wörtlich das Meer. Die Wiedergabe vermeidet die erschließende Richtungsangabe „Westen“ und erhält das traditionelle Richtungsbild.
- source_word: በሐውርተ፡ አሕዛብ
  choice: alle Länder der Völker
  rationale: Die überlieferte äthiopische Lesart bezeichnet Länder bzw. Gebiete, nicht Familien; „Völker“ gibt አሕዛብ wieder.
- source_word: ይትባረኩ
  choice: werden … gesegnet werden
  rationale: Das Passiv wird beibehalten, ohne den Segnenden ausdrücklich zu ergänzen.
theological_decisions:
- issue: Bezug der Segensverheißung
  choice: in dir und in deinen Nachkommen
  alternative: durch dich und durch deine Nachkommen
  rationale: Die lokale/instrumentale Mehrdeutigkeit der Präposition wird mit „in“ formal bewahrt, statt sie eindeutig instrumental aufzulösen.
- issue: Kollektive oder singularische Wiedergabe von „Same“
  choice: Nachkommen
  alternative: Same
  rationale: „Nachkommen“ ist im modernen Deutsch verständlich und lässt den kollektiven Umfang offen, ohne eine ausschließlich singularische messianische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vierfache Richtungsformel bleibt quellennah; „zum Meer hin“ wird nicht stillschweigend als „nach Westen“ paraphrasiert. Der Fußnotenmarker steht unmittelbar nach dem zu erläuternden Satz.
