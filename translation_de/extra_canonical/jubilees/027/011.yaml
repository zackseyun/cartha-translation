lexical_decisions:
- source_word: ጸውዐ
  choice: rief
  rationale: Gibt den erzählenden Aorist des Verbs »rufen« knapp und natürlich wieder.
- source_word: ባረኮ
  choice: segnete ihn
  rationale: Bewahrt die klare Segenshandlung Isaaks an Jakob.
- source_word: ነሠጾ
  choice: gebot ihm
  rationale: Der Kontext verlangt eine nachdrückliche Anweisung; »gebot« wahrt die stärkere Verbindlichkeit gegenüber bloßem »ermahnte«.
- source_word: ኢትነሣእ፡ ለከ፡ ብእሲተ
  choice: Nimm dir keine Frau
  rationale: Natürliche deutsche Wiedergabe der Wendung für das Nehmen einer Frau zur Ehe.
- source_word: እምኵሉ፡ አዋልደ፡ ከናአን
  choice: von den Töchtern Kanaans
  rationale: Das Geez bezeichnet die Gruppe, aus der Jakob keine Frau nehmen soll; im Deutschen ist »von den Töchtern Kanaans« idiomatisch und hinreichend umfassend.
