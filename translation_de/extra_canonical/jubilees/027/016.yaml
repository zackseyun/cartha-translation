  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: de
  text: Und nachdem Jakob aufgebrochen war, um nach Mesopotamien zu ziehen, war Rebekkas Geist wegen ihres Sohnes betrübt, und sie weinte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ
  choice: aufgebrochen war
  rationale: Das Verb bedeutet wörtlich „sich erheben/aufstehen“, bezeichnet hier im Zusammenhang mit dem folgenden Reiseziel aber idiomatisch den Aufbruch.
- source_word: ሰሐዊረ
  choice: um … zu ziehen
  rationale: Gibt die Absicht des Gehens bzw. Reisens in natürlichem modernem Deutsch wieder.
- source_word: መስጶጦሚያ
  choice: Mesopotamien
  rationale: Übernimmt die traditionelle geografische Bezeichnung des äthiopischen Textes.
- source_word: ሐዘነ፡ መንፈሰ፡ ርብቃ
  choice: Rebekka … tief betrübt
  rationale: Die wörtliche Wendung „Rebekkas Geist war betrübt“ bezeichnet ihren inneren Kummer; die deutsche Formulierung bewahrt den Sinn ohne unnatürliche Ausdrucksweise.
- source_word: ድኅረ፡ ወልዳ
  choice: wegen ihres Sohnes
  rationale: Die Präposition bezeichnet hier den auf den Sohn bezogenen Anlass ihres Kummers, nicht eine zeitliche Folge.
- source_word: ወትበኪ
  choice: und sie weinte
  rationale: Direkte und formgerechte Wiedergabe der anschließenden Handlung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitisch geprägte Wendung vom betrübten „Geist“ wurde zugunsten einer natürlichen deutschen Gefühlsbeschreibung moderat idiomatisiert; der starke innere Kummer bleibt durch „tief betrübt“ erhalten.
