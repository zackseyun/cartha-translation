  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: de
  text: 'Und Jakob erwachte aus seinem Schlaf und sagte: „Gewiss, dieser Ort ist das Haus des Herrn, und ich wusste es nicht.“ Da fürchtete er sich und sagte: „Wie ehrfurchtgebietend ist dieser Ort! Dies ist nichts anderes als das Haus des Herrn, und dies ist das Tor des Himmels.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: Gewiss
  rationale: Gibt die bekräftigende Aussage natürlich wieder, ohne die Gewissheit übermäßig zu verstärken.
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Entspricht der traditionellen und kontextuell passenden Wiedergabe des äthiopischen Gottesnamens bzw. Gottestitels.
- source_word: ግሩም
  choice: ehrfurchtgebietend
  rationale: Bewahrt sowohl das Moment des Erschreckens als auch die religiöse Ehrfurcht, die der Kontext verlangt.
- source_word: ዘአኮ፡ ምንትኒ፡ ዘእንበለ
  choice: nichts anderes als
  rationale: Eine idiomatische deutsche Entsprechung der ausschließenden Wendung „nichts außer“.
- source_word: አንቀጸ፡ ሰማይ
  choice: Tor des Himmels
  rationale: Formnahe und im Deutschen geläufige Wiedergabe der Genitivverbindung.
theological_decisions:
- issue: Bezeichnung des Ortes als Haus des Herrn
  choice: ist das Haus des Herrn
  alternative: ist ein Haus des Herrn
  rationale: Der bestimmte Ausdruck des Quelltextes identifiziert den Ort ausdrücklich; eine unbestimmte Wiedergabe würde diese Aussage abschwächen.
translation_notes:
  register: Natürliche, gegenwärtige Standardsprache mit würdigem biblischem Klang. Die Wiederholung „Haus des Herrn“ und die Abfolge von Erwachen, Furcht und Ausruf bleiben erhalten.
